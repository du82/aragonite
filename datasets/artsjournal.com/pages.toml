ctor, shaping the Playhouse’s artistic footprint and, in light of the organization’s expansive cultural influence, the future of American theatre. Serving in partnership with La Jolla Playhouse’s Managing Director, the Artistic Director co-leads one of the premiere theatre producing companies in the nation, developing plans for how the theatre’s work can reach audiences locally and globally. The new Artistic Director will have the opportunity to create art in an atmosphere of great care, kindness, and respect for the people who contribute to the Playhouse’s enduring success. The Artistic Director will lead a team of top-tier artists, artisans, community engagement specialists, and theatre professionals focused on ensuring the highest quality of performance in any forum that the Playhouse produces, from local pop-up tours and special events that introduce young people to the power and possibilities of what live performance can mean for developing a full and expansive world view to grand scale Broadway-bound musicals. Serving in an ambassadorial role for the Playhouse, the Artistic Director will give significant time and care to promoting the Playhouse’s local San Diego impact and influence while also continuing to grow the Playhouse’s national and international reputation. La Jolla Playhouse has engaged Management Consultants for the Arts to facilitate this important search process. The full position description may be found here: https://www.mcaonline.com/searches/artistic-director-la-jolla-playhouse Organizational Profile La Jolla Playhouse’s Mission is, “…to advance theatre as an art form, telling stories that inspire empathy and create a dialogue toward a more just future. With our intrepid spirit and eclectic, artist-driven approach we will continue to cultivate a local, national and global following with an insatiable appetite for audacious work. We provide unfettered creative opportunities for a community of artists of all backgrounds and abilities. We are committed to being a permanent safe harbor for unsafe and surprising work, offering a glimpse of the new and the next in American theatre.” More information is available at La Jolla Playhouse’s website at https://lajollaplayhouse.org/. MORE .tdb_single_post_share{margin-bottom:23px}.tdb-share-classic{position:relative;height:20px;margin-bottom:15px}.td-post-sharing-show-all-icons .td-social-sharing-hidden .td-social-expand-tabs{display:none}.td-post-sharing_display-vertically .td-post-sharing-visible,.td-post-sharing_display-vertically .td-social-sharing-hidden{display:flex;flex-direction:column}.tdi_64 .td-post-sharing,.tdi_64 .tdb-share-classic{text-align:center}.tdi_64 .td-post-sharing-visible{align-items:center} .td-post-sharing-classic{position:relative;height:20px}.td-post-sharing{margin-left:-3px;margin-right:-3px;font-family:var(--td_default_google_font_1,'Open Sans','Open Sans Regular',sans-serif);z-index:2;white-space:nowrap;opacity:0}.td-post-sharing.td-social-show-all{white-space:normal}.td-js-load'''
