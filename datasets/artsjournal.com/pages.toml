title = "About | ArtsJournal"
description = "ArtsJournal: Arts, Culture, Ideas"
full_description = "ArtsJournal was founded September 13, 1999 in the heady days of the dotcom boom. The site is a digest of some of the best arts and cultural journalism in the English-speaking world. Each day ArtsJournal features link to stories culled from around the internet, including blogs and more than 200 English-language newspapers, magazines and publications featuring writing about arts and culture. We recently consolidated all of ArtsJournal's archives -- 150,000 aggregated stories over 22 years -- chronicling a transformation period in arts and culture. Those archives are available and searchable at www.artsjournal.org. You can read more about ArtsJournal and what's in the archives here. The current AJ site is the sixth design. In 2003 we added blogs and the site now features more than 60 prominent writers on culture. We expect to keep adding to the number with individuals, group and limited-time group debate blogs. Arts Journal’s founder and editor is Douglas McLennan, formerly an arts columnist and arts reporter with the Seattle Post-Intelligencer and the Seattle Weekly. Doug writes the diacritical blog on ArtsJournal, tweets as @AJDoug, writes for a number of publications and is a much-in-demand speaker on issues of arts, culture, journalism and how the digital revolution is changing culture. He also serves as editor in chief for the website Post Alley since June 2019."
