and will provide administrative and financial oversight over all aspects of the organization’s day-to-day activities. They will serve as an ex-officio member of the board and will collaborate closely with the board and Producing Artistic Director to establish an achievable long-term vision and strategy that builds on GableStage’s outstanding reputation and potential for organizational growth. Guided by GableStage’s mission, this individual will be responsible for managing all the company’s administrative functions, including marketing, development, box office, general and financial management, human resources, community relations, board relations, donor cultivation, fundraising events, front of house, and strategic planning. They will foster GableStage’s team-based, highly collaborative, supportive, and generous environment for artists and the many people who make the work of GableStage possible—on stage, behind the scenes, in the offices, in the classroom, online, and throughout the community. Role and Responsibilities Fundraising, Marketing, and Audience Development Expand audiences by formulating and implementing comprehensive marketing, public relations, and social media campaigns, and increase revenue from single ticket sales, group sales, subscription sales, concessions, rentals, community presentations, education programs, digital programming, and other earned revenue possibilities. Guide and administer staff and board fundraising initiatives to create strategies for growing contributed revenue with an emphasis on solicitation, stewardship, and cultivation of existing and new funders. Build and maintain strong professional relationships with business leaders and the funding community, including key donors, foundations, public funders, and corporations. Oversee box office staff and utilize the patron database management software to its full capacity. Assess and adapt audience development, subscription, and fundraising plans based on the specific, unique nature of GableStage’s mission and the Coral Gables and Coconut Grove communities. Support the Director of Development in the planning, production, and hosting of fundraising events in close collaboration with the staff. Embrace other fundraising, marketing, and audience development responsibilities as needed. Board and External Relations Establish strong communication channels with the board, serving as the primary liaison, and support the collective work to leverage their networks to secure resources that will advance the organization’s mission. Collaborate with the board, guiding and supporting board members in governance, strategy, and accountability. Maintain a consistent presence as a highly engaged member of the Coral Gables and South Florida community focused on increasing the visibility and reputation of GableStage in arts, culture, public, corporate, government, and philanthropic communities. Embrace other board and external relations responsibilities as needed. Operational Leadership and Strategic Plan'''
