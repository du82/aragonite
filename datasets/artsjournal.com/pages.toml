title = "About AJ Classifieds | ArtsJournal"
description = "ArtsJournal: Arts, Culture, Ideas"
full_description = "We were shocked. After we redesigned ArtsJournal in January 2014, we began displaying a list of the five most-read stories on the site. We were amazed when a classified ad for a job at the Los Angeles Philharmonic showed up in the top five. It confirmed what advertisers have been telling us for some time. AJ readers see our ads as content they want to read. Why? Because we don't accept ads from non-arts advertisers. Our advertisers are part of the arts community we serve, and they know AJ is a great way to reach that community. We have 30,000+ newsletters subscribers, and our open rates consistently beat industry averages - 22% for our free newsletters, 65% for our premium newsletters. And our clickthrough rates are an amazing 13%. ArtsJournal.com is the leading (and largest) source of arts news and views on the internet. And it's the influential audience you want to reach. AJ is required reading for the world's top arts journalists and critics. It's the home page for arts administrators, executives, artists and those who want to be in the know about the arts. Want to fill a job? There's no better place to spread the word. Now you can get your message out to ArtsJournal's 25,000-35,000 daily readers by placing a Classified Ad. You get exposure on AJ's prime time front page. Our ads are also seen by our 17,000 daily newsletter subscribers, and our 13,500 weekly newsletter subscribers. Among our 30k+ subscribers, we count the arts editors and journalists of some of the world's top media companies: The New York Times, Wall Street Journal, Washington Post, LA Times, Boston Globe, The Guardian, London Evening Standard, BBC, and NPR. We also reach many of the top arts executives, arts critics, reporters, commentators, artists, and arts patrons. Our coverage extends across the arts: music, visual art, dance, theater, media, publishing, cultural issues, ideas, and people. Whether you're trying to promote a tour or event, looking to fill an arts job, promoting a program, or selling an item, ArtsJournal delivers your message. It gets read."
