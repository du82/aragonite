r for the Performing Arts invites applications for the position of Executive Director. We seek a Performing Arts Facility professional with a grounding in all aspects of performing arts facility management: community partnerships, fund-raising, marketing, concessions, front of house, ticketing, rentals, board development, backstage/technical operations, and programming. This person will become the “face” of RiverCenter in the community and will have the managerial skills and facility experience to take RiverCenter to its next level of achievement. Experience in the management of capital projects and capital/endowment campaigns would be an asset, as well as a background in working closely with universities and community user groups. The Position: Reporting to the Board of Trustees, the Executive Director is the chief executive and operating officer for the corporation and oversees all aspects of RiverCenter for the Performing Arts, ensuring an efficient, effective, and fiscally sound operation. The Executive Director is charged with working closely with RiverCenter’s constituencies and stakeholders to provide mission-driven, community-serving programming with a healthy balance of at-risk and rental events and activities. The Executive Director is also responsible for overseeing and steering the cooperative association and interaction of the Center and Columbus State University (CSU), working with the appropriate CSU officials. Areas of overall oversight include: production, education, operations, finance, marketing, human resources, development, and programming. The new Executive Director must be willing to work closely with the development staff to raise money and to be out in the community. RiverCenter’s annual budget is approximately $4.2 million and has a staff complement of 18 full-time and 10 part-time people. Fifteen per cent of the annual budget comes from contributed income at this time. Background:Located in the heart of historic Uptown Columbus, RiverCenter for the Performing Arts is the centerpiece of the city’s arts and entertainment district. With its three state-of-the-art theatres and educational facilities, RiverCenter is the largest arts center in the region. It is home to the Columbus Symphony Orchestra, Columbus State University’s Schwob School of Music, and regularly partners with the Youth Orchestra of Greater Columbus, Columbus Ballet, and the Miss Georgia Scholarship Pageant. Conceived as a vital cultural hub, the Center was designed by Hardy Holzman Pfeiffer and Associates to enrich the Chattahoochee Valley region artistically. The construction was funded in part by $87.1 million of the over $100 million raised by the Columbus Challenge, an unprecedented public-private fund-raising effort that also revitalized other key local cultural organizations. The remainder of the funding came from a $17 million state appropriation and a $35 million matching gift from the Bradley-Turner Foundation. A property of the Georgia Department of Natural Resources'''
