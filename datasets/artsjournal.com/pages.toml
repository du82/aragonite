h the management, oversight, and strategy of one of the nation’s premiere regional theatres. The Chief Financial Officer is responsible for overseeing and managing the organization’s financial planning and accounting, as well as providing the required data and analytical information for the overall successful financial management of the organization. The Chief Financial Officer ensures the Finance Department functions as a high-performing team, focused on supporting business needs across the entire organization. This position works closely with and reports to the Managing Director, providing data and analysis to assist in making responsible financial decisions for the organization. La Jolla Playhouse has engaged Management Consultants for the Arts to facilitate this search. A full position description and details on how to apply may be found here: https://www.mcaonline.com/searches/cfo-la-jolla-playhouse Organizational Profile La Jolla Playhouse is internationally-renowned for creating some of the most exciting and adventurous work in American theatre. Founded in 1947, the Playhouse is now a not-for-profit, professional theatre in residence on the University of California, San Diego campus. Its mission is to advance theatre as an art form and as a vital social, moral and political platform by providing unfettered creative opportunities for the leading artists of today and tomorrow. The Playhouse’s brilliant and innovative productions of classics, immersive projects, new plays and musicals have merited over 300 major honors and 42 Tony Awards, including the 1993 Tony Award for America’s Outstanding Regional Theatre. These include The Outsiders, Come From Away, The Who’s Tommy, Billy Crystal’s 700 Sundays, the Pulitzer Prize-winning I Am My Own Wife, Memphis and international sensation Jersey Boys. More information is available at La Jolla Playhouse’s website at https://lajollaplayhouse.org/. MORE .tdb_single_post_share{margin-bottom:23px}.tdb-share-classic{position:r