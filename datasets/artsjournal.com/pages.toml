y Award, Court Theatre reimagines classic theatre to illuminate our current times. The Artistic Director will find a high-performing, passionate staff and an organization producing exceptional artistry in an intellectually and culturally rich community. The Artistic Director co-leads the organization alongside the Executive Director and reports to the University of Chicago Provost. The University of Chicago has engaged Management Consultants for the Arts to facilitate this search. A full position description may be found here: “The University of Chicago is an Affirmative Action/Equal Opportunity Employer/ Disabled/ Veterans Employer”. Organizational Profile Now in its 70th season, Court Theatre was founded in 1955 as an amateur outdoor summer theatre at the University of Chicago. Court produces 4-5 shows each season, to an annual attendance of 24,000 in the intimate, 251-seat Abelson Auditorium. Having been interwoven with the university since its inception, Court has developed an increasingly rich relationship with the UChicago Faculty Advisory Council and wider community. Court has a thriving Engagement Department that creates programming to connect with and serve its local area. Hyde Park, home to Court Theatre and the University of Chicago, is a diverse, historic neighborhood on the South Side of Chicago. Winner of the 2022 Regional Theatre Tony Award, Court Theatre reimagines classic theatre to illuminate our current times. In residence at the University of Chicago and on Chicago’s historic South Side, Court engages audiences with intimate and provocative experiences that inspire deeper exploration of the enduring questions that confront humanity and connect us as people. Court Theatre defines classic theatre as texts from any culture, tradition, or era that resonate throughout time and speak to our present moment. More information can be found on their website: https://www.courttheatre.org MORE .tdb_single_post_share{margin-bottom:23px}.tdb-share-classic{posit