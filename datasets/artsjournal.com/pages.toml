ies at Artis—Naples, overseeing approximately $18 million in earned revenues. Reporting to the CEO & President and working with the Board of Directors and senior leadership team, the VP-MS manages revenue and attendance projections for each season, develops and implements marketing strategies, and oversees subscription and single-ticket campaigns across print, digital, and social media channels. This role emphasizes strengthening patron relationships, loyalty-building, and attracting a broad range of audiences, using a research-based approach to developing the long-term sustainability of Artis—Naples. In addition to leading retail operations, including The Baker Museum Store, and overseeing radio and TV partnerships, the VP-MS will drive the digital transformation of engagement by enhancing social media presence and optimizing digital ticketing processes. The VP-MS collaborates closely with the development team to engage a broader demographic, advance communications, and maintain a thriving patron base. Serving as the liaison to the Board of Directors Marketing Committee, the VP-MS ensures alignment with institutional goals and directly supervises the Creative Services Senior Director, Patron Services Senior Director, Marketing Manager/Digital Strategist, and The Baker Museum Buyer and Promotions Manager. Role and Responsibilities Earned Revenue and Sales Plan, implement, and oversee marketing, communication, and patron strategies, including subscription and single ticket sales campaigns for performances, events, and museum exhibitions and activities, print, online, and radio/TV advertising, telemarketing, special promotions, digital and social media efforts, and audience development campaigns. Focus on the cultivation and strengthening of relationships with influential advocates, as well as growing support from the general patron and ticket-buyer base. Manage direct mail and digital campaigns, including list segmentation, and in coordination with design team, mail house and/or post office coordination. Develop and monitor revenue and attendance budgets for each series, performance, event, and activity, including museum attendance, to maximize revenue and paid capacity. Manage all paid and pro-bono advertising, including interfacing with advertising representatives, copywriting, and coordinating as needed with design and artistic operations teams. Oversee retail operations at The Baker Museum Store and in Hayes Hall lobby to maximize revenue and showcase products that reflect the Artis—Naples brand and programmatic offerings. Responsible for media and marketing sponsors identification, cultivation, solicitation, and fulfillment, including signage, publications, online vehicles, etc. Utilize management tools and research to compile and interpret complex sales data and prepare reports, statements, and/or projections. Lead efforts to enhance Artis—Naples’ digital presence. Focus on boosting social media engagement and optimizing digital ticketing processes to address cha'''
