raising efforts and expand its impact. Based at The Eli and Edythe Broad Stage, the organization showcases bold artistic performances across three venues and provides educational and community engagement programs. Under the leadership of Artistic & Executive Director Rob Bailis, BroadStage is transitioning to an artist-led programming model, empowering world-class artists to curate performances and festivals. This innovative approach fosters deeper audience engagement and celebrates diverse artistic expressions. The Director of Development will be responsible for securing and managing $4 million annually in contributed revenue, cultivating donor relationships, mentoring staff, engaging the board, and supporting institutional funding efforts. The ideal candidate will be a visionary fundraiser, strategic thinker, and relationship builder with a passion for the performing arts. Application Process & Compensation Semi-finalists will receive $500 for their participation.Finalists will be invited for on-site interviews, receiving $1,000 compensation plus reimbursement for travel, lodging, and meals.Applications are open until March 21, 2025, but early submissions are encouraged as the position may be filled sooner.Attachments should be in PDF format.For questions, contact:Calida Jones – calida@creativeevolutions.comRebecca Novick – rebecca@creativeevolutions.comDouglas Clayton – douglas@creativeevolutions.com About Creative Evolutions Creative Evolutions, the executive search partner for BroadStage, is a dynamic network of professionals committed to reshaping creative and cultural industries. Believing in bold action and human-centered solutions, our team of managers, innovators, consultants, coaches, and speakers works toward a more sustainable and equitable future for the arts. MORE .tdb_single_post_share{margin-bottom:23px}.tdb-share-classic{position:relative;height:20px;margin-bottom:15px}.td-post-sharing-show-all-icons .td-social-sharing-hidden .td-social-expand-tabs