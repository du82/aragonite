ndent film to serve as its next Executive Director. Currently celebrating its 40th year, Enzian is one of the premiere independent cinemas in the nation (and Central Florida’s only full-time independent cinema). It is home of the renowned Florida Film Festival and a year-round roster of curated programming that champions the belief that “Film Is Art.” A visit to Enzian is truly a unique film going experience. Its single screen theatre offers a cabaret/ lounge setup with tableside food and beverage service. Its campus offers alfresco dining service at Eden Bar in a lush courtyard surrounded by weeping oaks. The Executive Director will have the opportunity to lead the implementation of its ambitious strategic plan (scheduled to be complete in Fall 2025), strengthen its fundraising operation, expand its ‘family’ of patrons and supporters, and build on the organization’s distinctive legacy of film programming. It has an operating budget of ~$3.7 million (~85% earned, 15% contributed). The hiring range will start at $125,000 and will be determined based on experience, qualifications, and training needs at the time of hiring. Enzian offers a competitive benefits package. The approximate start date is Summer 2025. MORE .tdb_single_post_share{margin-bottom:23px}.tdb-share-classic{position:relative;height:20px;margin-bottom:15px}.td-post-sharing-show-all-icons .td-social-sharing-hidden .td-social-expand-tabs{display:none}.td-post-sharing_display-vertically .td-post-sharing-visible,.td-post-sharing_display-vertically .td-social-sharing-hidden{display:flex;flex-direction:column}.tdi_64 .td-post-sharing,.tdi_64 .tdb-share-classic{text-align:center}.tdi_64 .td-post-sharing-visible{align-items:center} .td-post-sharing-classic{position:relative;height:20px}.td-post-sharing{margin-left:-3px;margin-right:-3px;font-family:var(--td_default_google_font_1,'Open Sans','Open Sans Regular',sans-serif);z-index:2;white-space:nowrap;opacity:0}.td-post-sharing.td-social-show-all{white-space:no