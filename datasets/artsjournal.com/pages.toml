rector to lead the organization into a new era of growth and engagement. After years of planning, the Shaker Museum is building a 21st-century museum to showcase the world’s most comprehensive collection of Shaker material culture and archives. The four-floor facility located in Chatham, NY, is by Selldorf Architects, renowned worldwide for designing subtle but powerful art spaces. The new museum includes the transformation of an historic building and construction of a modern addition and surrounding public gardens. The physical space’s design embodies and perpetuates the core ideals that were at the foundation of Shaker culture, applying them in a modern and relevant context and form. The glass façade on the ground floor entrance area, for example, is accessible and welcoming – just like Shaker communities. Construction for the new museum is scheduled to begin in Spring 2025. The Executive Director will be responsible for realizing this building project including completion of our $35M capital campaign of which $16M has been raised. They will also be charged with advancing the museum’s mission to preserve the Shaker legacy and inspire new generations through innovative programming, community outreach, and sustainable management practices. The next Executive Director will have the singular opportunity to partner with the Board of Trustees and grow our small but dedicated staff to refine and realize its future. About Shaker Museum Shaker Museum holds the most comprehensive collection of Shaker objects, archives, and books, and stewards the historic North Family site at Mount Lebanon, the Central Ministry of the Shaker Communities. Shaker Museum founder John S. Williams began collecting directly from the Shakers in the 1920s and 1930s. He quickly realized the Shakers represented an important facet of American history and, as their societies were in decline, that crucial story was in danger of disappearing. He embraced an almost anthropological mission to preserve what he could, traveling around New England to extant communities and forming lasting relationships with the Shakers. They came to trust him, not only to pay a fair price, but to be the custodian of their story. Many collectors and dealers sought spectacular show pieces that could be resold, and some of which are now on display in places like the Metropolitan Museum of Art, but Williams also wanted evidence of daily Shaker life, how they lived, how they worked. The Shakers gave him important religious relics, such as a piece of founder Mother Ann Lee’s apron, because they believed in his mission to start a museum and allow the Shaker story to live on. Later, the Shakers transferred one of the most significant collections of their archival material to Shaker Museum – the records of the Central Ministry, which included diaries, business records, and correspondence spanning 150 years. In 2004, the museum became the owner and steward of the North Family site at Mount Lebanon Shaker Village, consisting of 11 Shaker '''
