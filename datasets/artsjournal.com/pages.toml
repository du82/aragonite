opment Officer. As the main architect of Arena Stage’s approach to inspiring support from individual donors, foundations, governmental sources, corporate partners, and other yet-to-be-discovered sources of contributed revenue, the Chief Development Officer will be strategic in crafting innovative plans that elevate the entire Arena Stage team to participate in the full development life of the organization. With understanding and experience building annual and special capital and capacity building campaigns, the Chief Development Officer will work in close collaboration with Arena Stage’s Executive Producer and Artistic Director to ensure that operational needs are being met through the generation of transformational development efforts. Success for Arena Stage’s Chief Development Officer will be measured by quantitative fundraising goals and the qualitative experiences of donors, patrons, and the Arena Stage community writ large. Arena Stage has engaged Management Consultants for the Arts to lead the search, and interested candidates may apply for this position by visiting this link. Compensation Amount The annual salary range for the Chief Development Officer role at Arena Stage begins at $175,000 and includes a full benefit package commensurate with other organizations of its size. The company intends to make a hiring decision in the first quarter of 2025, with the selected candidate transitioning into the position shortly after that time. Arena Stage is an equal opportunity employer that celebrates diversity and is committed to creating an inclusive environment for all employees. Candidates from communities that have historically been underrepresented in top-tier artistic leadership positions are strongly encouraged to apply. Organizational Profile Arena Stage was founded in 1950 by trailblazers Zelda Fichandler, Tom Fichandler, and Edward Magnum as one of the nation’s first significant regional theaters based in and for its community (the official corporate name of Arena Stage is Washington Drama Society, Inc.). Over seven decades, Arena Stage has evolved into a multifaceted cultural organism, a national center for theater, arts, and culture that has focused on a dedication to American voices and artists. More about Arena Stage can be found here. MORE .tdb_single_post_share{margin-bottom:23px}.tdb-share-classic{position:relative;height:20px;margin-bottom:15px}.td-post-sharing-show-all-icons .td-social-sharing-hidden .td-social-expand-tabs{display:none}.td-post-sharing_display-vertically .td-post-sharing-visible,.td-post-sharing_display-vertically .td-social-sharing-hidden{display:flex;flex-direction:column}.tdi_64 .td-post-sharing,.tdi_64 .tdb-share-classic{text-align:center}.tdi_64 .td-post-sharing-visible{align-items:center} .td-post-sharing-classic{position:relative;height:20px}.td-post-sharing{margin-left:-3px;margin-right:-3px;font-family:var(--td_default_google_font_1,'Open Sans','Open Sans Regular',sans-serif);z-index:2;white-space:nowrap;opacity:0}.td-post'''
