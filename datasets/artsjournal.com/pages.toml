xecutive Director, available in the late spring of 2025. Janet Kaltenbach, who has served as Executive Director for more than 16 years, has announced that she will step down from the role at the end of the 2024/2025 season. Her legacy is a strong and dynamic organization currently celebrating its 50th anniversary. The Charlottesville Symphony Societyhttps://cvillesymphony.org/ The Charlottesville Symphony Society (CSS), engages audiences of all ages in Charlottesville and beyond through exceptional musical experiences, imaginative community collaborations, and inspiring education programs, independently and in partnership with the Charlottesville Symphony at the University of Virginia (UVA). A primary focus is providing most of the orchestra’s financial, marketing, and administrative support. Known as one of Virginia’s leading musical ensembles, the Charlottesville Symphony has been a source of tremendous civic pride and an emblem of the bond between university and community. The 2024/2025 season is a year-long celebration of the orchestra’s 50-year history as the organization looks ahead to a bright future and the opening of a new concert venue at UVA’s planned Center of the Arts. Currently in the design and fundraising phase, the Tessa and Richard Ader Performing Arts Center will be the first in UVA’s history to offer a state-of-the-art, acoustically superior, 21st-century performance and rehearsal space. It will feature a 1,200-seat large hall, a 150-seat small hall, a large orchestral rehearsal space, interdisciplinary arts space, and a dedicated dance area, allowing the University to host concerts, dance performances, theater productions, and more in a facility unmatched in Central Virginia. The new UVA Center for the Arts will relocate the Music Department (currently housed in Old Cabell Hall), Dance Department, and the University’s two museums – the Fralin Museum of Art and the Kluge-Ruhe Aboriginal Art Collection – providing expanded exhibition, education, and engagement spaces adjacent to the Performing Arts Center. The PAC is currently scheduled to open in the Fall of 2029. Charlottesville Symphony members are professional musicians, most of whom are UVA music faculty; accomplished community members; and auditioned university students from a wide range of academic backgrounds. Admired for his dynamism on the podium, Benjamin Rous has served as Music Director of the Charlottesville Symphony since 2017. He is also an Associate Professor of Music at UVA. The orchestra presents five pairs of Masterworks concerts in the 850-seat Old Cabell Hall on the Grounds of the University of Virginia and in the 1,100-seat Martin Luther King, Jr. Performing Arts Center at Charlottesville High School. The 2024-25 50th Anniversary Season was crafted by Benjamin Rous to “emphasize the symphonic tradition while also continuing to share the versatility of orchestra performance and the way our music can intersect with the modern world.” It combines audience favorites by Barber, Bee'''
