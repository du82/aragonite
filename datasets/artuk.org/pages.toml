 to see recent changes. The date when these Terms of Use were last updated will be displayed at the bottom of the page. If you do not agree to any change you should not continue to use our website. 4. Availability of our website 4.1. Our website is made available free of charge. 4.2. We will use reasonable endeavours to ensure the availability of our website and that transmissions are error free. However, due to the nature of the Internet it is not technically possible for us to provide a completely fault free service and we give no guarantees or warranties, express or implied, as to the quality or reliability of access to our website. We do not guarantee that our website, or any content on it, will always be available or be uninterrupted. 4.3. Access to our website is permitted on a temporary basis. We reserve our right to withdraw, discontinue or change all or any part of our website or refuse access to it immediately and without notice. However, we will, where reasonably possible, provide notice of any suspension or cancellation of our website. 4.4. We will not be liable to you if for any reason our website (or any content) is unavailable at any time or for any period. 4.5. You are responsible for making all arrangements necessary for you to have access to our website. 4.6. You are also responsible for ensuring that all persons who access our website through your Internet connection are aware of these Terms of Use and other applicable terms and conditions, and that they comply with them. 5. Content on our website 5.1. We may update our website from time to time and may change the content at any time without providing prior notice. 5.2. Although we make reasonable efforts to update the information on our website, we make no representations, warranties or guarantees, whether express or implied, that the content on our website is accurate, complete or up-to-date. 5.3. We do not guarantee that our website, or any content on it, will be free from errors or omissions. 5.4. The content on our website is provided for general information only. It is not intended to amount to advice on which you should rely. See our Disclaimer. You must obtain professional or specialist advice before taking, or refraining from, any action on the basis of the content on our website. 5.5. The views expressed by other users on our website do not represent our views or values and have not been verified or approved by us. 5.6. For general content queries relating to our website please email us at collections@artuk.org. 6. Intellectual property 6.1. Except as described in paragraphs 6.7 and 6.8, we are the owner or the licensee of all intellectual property rights in our website. Our website and the material published on it are protected by copyright laws and treaties around the world. All such rights are reserved. 6.2. Unless further uses are permitted under an applicable Creative Commons licence (see creativecommons.org) or by virtue of public domain status, you may print off one copy, and may download extracts, of any page(s) from our website for your personal use or under any of the other exceptions and limitations to copyright set out in the UK’s Copyright, Designs and Patents Act 1988 (as amended and restated from time to time). You may draw the attention of others within your organisation to content posted on our website. 6.3. Our status (and that of any identified contributors) as the authors of content on our website must always be acknowledged. 6.4. Unless permitted under an applicable Creative Commons licence (see creativecommons.org) or by virtue of public domain status, you must not use any part of the content on our website for commercial purposes without obtaining a licence to do so from us or our licensors. 6.5. If you print off, copy or download any part of our website in breach of these Terms of Use, your right to use our website will cease immediately and you must, at our option, return or destroy any copies of the materials you have made