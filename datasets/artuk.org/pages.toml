["http://artuk.org/footer/privacy-policy"]
title = "Art UK |  Privacy policy"
description = "Discover artworks, explore venues and meet artists. Art UK is the online home for every public collection in the UK, featuring over 500,000 artworks by over 55,000 artists."
full_description = "Purpose of this Privacy Policy This Privacy Policy aims to give you information on how Art UK collects and processes your personal data through your use of the Art UK website or your contribution to Art UK, including any data you may provide when you sign up to our newsletter, create an account with us, elect to donate money to us, contribute content or apply to work with us. It is important that you read this Privacy Policy together with any other privacy policy or fair processing policy we may provide on specific occasions when we are collecting or processing personal data about you so that you are fully aware of how and why we are using your data. This Privacy Policy supplements other notices and privacy policies and is not intended to override them. Art UK Art UK is the operating name of the Public Catalogue Foundation, a charity registered in England and Wales (charity number: 1096185) and in Scotland (charity number: SC048601) We are registered in England and Wales under company number 04573564 and have our registered office at Tc Group, The Courtyard, Shoreham Road, Upper Beeding, West Sussex, BN44 3TN. The Art UK website at www.artuk.org (the Website) is operated by the Public Catalogue Foundation. The Public Catalogue Foundation is the data controller of personal data collected from you by this Website and related means, or otherwise provided by you to us. The Public Catalogue Foundation is committed to complying with the General Data Protection Regulation (GDPR) and the UK Data Protection Act 2018. We are registered with the Information Commissioner's Office (ICO) under Data Protection Registration Number: Z1168380. We have appointed a Data Privacy Officer who is responsible for overseeing questions in relation to this Privacy Policy. If you have any questions about this Privacy Policy, including any requests to exercise your legal rights, please contact the Data Privacy Officer using the details set out below. The Public Catalogue Foundation (We, us, our) are committed to protecting and respecting your privacy. The UK General Data Protection Regulation (UK GDPR), the Data Protection Act 2018, and other applicable national data privacy laws (together, Data Privacy Laws) place obligations on us in relation to the personal data that we collect and hold. This Privacy Policy (together with our Website Terms of Use) sets out how we comply with Data Privacy Laws, including detailing the basis on which any personal data we collect from you, or that you provide to us, will be processed by us. Please read the following carefully to understand our views and practices regarding your personal data and how we will treat it. By visiting the Website or otherwise providing us with your personal data you are doing so on the basis of the general practices described in this Privacy Policy. Where we require your consent to process your personal data in accordance with these practices, we will seek this consent at the point at which you provide us with this data. Where we wish to process your personal data for a purpose other than that for which the personal data were collected, we will notify you of that intention, explain the legal basis which allows us to do so and obtain any further necessary consents. Please note that we may process your personal data without your knowledge or consent, in compliance with the Data Privacy Laws, where this is required or permitted by law. 1. Information we may collect from you Personal data, or personal information, means any information about an individual from which that person can be identified. It does not include data where the identity has been removed (anonymous data). We may process (e.g., collect, use, store and/or transfer) the following data about you: (a) Information you give us. You may give us your personal data when you use our Website, contribute to the ART UK project (either individually or via your employer), or in correspondence with us, by phone, email or otherwise. This data may include information you provide when you create an account on our Website; subscribe to any of our services; donate to us; post or contribute material to our Website or via your account; enter a competition, promotion or survey; report a problem with the Website; or otherwise in connection with your communications with us. The information you give us may include your name, address, email address, phone number, employer, job details, financial and credit card information, personal description and information relating to your participation in and feedback on any of our products or services. (b) Information we collect about you. We may collect and process technical information about your computer, including (where available) your Internet Protocol (IP) address; login information; browser type and version; time zone setting; browser plug-in types and versions; operating system and platform; and any other technology on the devices you use to access our Website. We may also collect and process information about your visit to our Website, including the full Uniform Resource Locators (URL) clickstream to, through and from the Website (including date and time); products, artworks or artists you viewed or searched for; page response times; download errors; length of visits to certain pages; page interaction information (such as scrolling, clicks, and mouse-overs); methods used to browse away from the page; and any phone number used to contact us. We collect this information for system administration purposes and to report aggregate information on usage. (c) Information we receive from other sources. To the extent permitted by the Data Privacy Laws, we may also receive information about you from third parties to identify artwork data and artwork copyright rights holders. Where we receive personal data in this way, we will process it in accordance with the terms of this Privacy Policy. We do not collect any special categories of personal data about you (this includes details about your race or ethnicity, religious or philosophical beliefs, sex, sexual orientation, political opinions, trade union membership, information about your health, and genetic and biometric data). 2. Cookies The Website uses cookies to distinguish you from other users of the Website. This helps us to provide you with a good experience when you browse the Website and also allows us to improve the Website. For detailed information on the cookies we use and the purposes for which we use them see our Cookies Policy. 3. How we use your personal data 3.1 We use information held about you (Users of the Website) in the following ways: Purpose / activity (a) to carry out our obligations arising from any contracts entered into between you and us and to provide you with any information, products and services that you request from us; Lawful basis for processing: Performance of a contract with you (b) to contact you (including by email, post or telephone) in relation to the products and services that you have signed up for; Lawful basis for processing: Performance of a contract with you (c) to contact you (including by email, post or telephone), about other products and services that we offer that are similar to those that you have already purchased, signed up for or enquired about, provided that you have opted in to receive these communications; Lawful basis for processing: Your consent (d) to send you newsletters and other updates on our organisation and our products and services by email, where you have opted in to receive these; Lawful basis for processing: Your consent (e) to manage relationships with our supporters and administer our charitable program; Lawful basis for processing, including basis of legitimate interest: Legitimate interests (fulfilling our charitable objections) (f) to administer and facilitate our programmes and services; Lawful basis for processing, including basis of legitimate interest: Legitimate interests (the administration, improvement and promotion of our projects and our Website) (g) to notify you about changes to our organisation or services; Lawful basis for processing, including basis of legitimate interest: Legitimate interests (the administration, improvement and promotion of our projects and our Website) (h) if you provide feedback about our Website, services or projects through a contact form or email address, to develop and improve the relevant area; Lawful basis for processing, including basis of legitimate interest: Legitimate interests (the administration, improvement and promotion of our projects and our Website) (i) to monitor the way in which our sites are used, and to ensure that content from the Website is presented in the most effective manner for you and for your computer; Lawful basis for processing, including basis of legitimate interest: Legitimate interests (the administration, improvement and promotion of our projects and our Website) (j) to administer the Website and for internal operations, including troubleshooting, data analysis, testing, research, statistical and survey purposes; Lawful basis for processing, including basis of legitimate interest: Legitimate interests (the administration, improvement and promotion of our projects and our Website) (k) to allow you to participate in interactive features of our service, when you choose to do so; Lawful basis for processing: Your consent (l) as part of our efforts to keep the Website safe and secure; Lawful basis for processing, including basis of legitimate interest: Performance of a contract with you; Legitimate interests (the administration, improvement and promotion of our projects and our Website) (m) to make suggestions and recommendations to you and other users of the Website about products or services that may interest you or them. We will only contact you about these products or services where you have opted in to receive these communications; Lawful basis for processing: Your consent (n) if the Public Catalogue Foundation or substantially all of its assets are acquired by a third party (who will be a UK charity and a not-for-profit organisation), in which case personal data will be one of the transferred assets; Lawful basis for processing, including basis of legitimate interest: Legitimate interests (continuity of our projects and services) (o) if we are required to process your personal data by Law or if we believe in good faith that we are required to do so by any order of the Courts or other competent body or agency; Lawful basis for processing: Necessary to comply with a legal obligation (p) to enforce or apply our Website Terms of Use and other agreements; Lawful basis for processing, including basis of legitimate interest: Legitimate interests (pursuit and defence of our rights and property) (q) to protect or defend our rights or property or to protect the personal safety of our employees or the public at large. Lawful basis for processing, including basis of legitimate interest: Legitimate interests (pursuit and defence of our rights and property) 3.2 We will process your personal data on the basis of: (i) your consent, if requested; (ii) the performance of our obligations under any contracts entered into between you and us; (iii) compliance with applicable laws, rules and regulations; and/or (iv) our legitimate interests (which include (i) the administration, improvement and promotion of our projects and our Website; (ii) fulfilling our charitable objectives; (iii) continuity of our projects and services; and (iv) pursuit and defence of our rights and property). Where possible we will seek to use aggregate data in order to achieve these aims. Please contact us if you need details about the specific legal ground(s) we are relying on to process your personal data. 3.3 Where we need to collect your personal data by law, or under the terms of a contract we have with you, and you fail to provide that data when requested, we may not be able to perform the contract we have or are trying to enter into with you. 3.4 Where our processing is based on your consent, and not any other legal basis, you have the right to withdraw your consent at any time. This withdrawal will not affect the lawfulness of processing prior to the withdrawal. If you inform us that you no longer wish to receive email or other communications from us, we will stop sending you these communications. 3.5 We do not envisage that any decisions will be taken about you using automated means, however we will notify you if this position changes. 4. Disclosure of your personal data 4.1 In order to provide our products and services, we may share your personal information with any member of our group, which means our subsidiaries, our ultimate holding company and its subsidiaries, as defined in section 1159 of the UK Companies Act 2006. 4.2 Where we have your opt-in consent to do so, we may share your information with selected third parties who we work with in order to run and promote our projects, including but not limited to, the BBC, and participating collection administrations. 4.3 We may also disclose your personal information to third parties (see also the table at 3.1 above for further details on the lawful bases for processing for these purposes): (a) if the Public Catalogue Foundation or substantially all of its assets are acquired by a third party (who will be a UK charity and a not-for-profit organisation), in which case personal data will be one of the transferred assets and the new owner may use your personal data in the same way as set out in this Privacy Policy; (b) if required to do so by Law or if we believe in good faith that we are required to do so by any order of the Courts or other competent body or agency; (c) in order to enforce or apply our Website Terms of Use and other agreements; or (d) in order to protect or defend our rights or property or to protect the personal safety of our employees or the public at large. 4.4 We may from time to time engage third parties to perform services (including the processing of personal data) on our behalf, such as hosting our data (including your personal data) and Website; sending emails and other communications relating to our products and/or services; providing analytic services, such as tracking usage of our operational sites or websites; or performing other administrative services for us. 4.5 We shall only use processors that will commit to implement appropriate technical and organisational measures in order to ensure that their processing activities meet the requirements of Data Privacy Laws and ensure the protection of your data protection rights. Prior to allowing these service providers to access your personal data, we will enter into a formal agreement with them to ensure that they handle and process the information for specified purposes and in accordance with our instructions and applicable law. 4.6 We will not share your information with parties outside of the UK unless we are legally permitte"
