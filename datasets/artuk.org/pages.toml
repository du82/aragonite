["https://artuk.org/about/about"]
title = "Art UK | About About"
description = "Discover artworks, explore venues and meet artists. Art UK is the online home for every public collection in the UK, featuring over 500,000 artworks by over 55,000 artists."
full_description = "About What is Art UK? Art UK is the online home for every public art collection in the United Kingdom. We are an art education charity and we democratise access to art. Our website brings together art from over 3,400 British institutions in one of the UK's biggest-ever arts partnerships. It shows over 500,000 works by over 55,000 artists and is growing all the time. You will find the art held by museums, universities, libraries, town halls and hospitals, together with art owned by national bodies such as the National Trust and National Trust for Scotland. Building on this wonderful repository of artworks, the Art UK website is rich in story content and learning resources, and it offers many ways for everyone to engage with art. Through our work, we make art accessible to all – for enjoyment, learning and research. Thanks to our generous supporters, it's all free. About What we do Our mission, our values and the work of our charity. You Are Loved, 2023, painted mural by Mister Samo (b.1986), Portsmouth. © the artist. Image credit: Mike Parry / Art UK About Our impact What we achieved in 2024, including attracting over 5 million visitors. About Who we are Our team, job opportunities and the people we closely work with. About Who funds us The amazing funders who share our belief that art transforms lives."
