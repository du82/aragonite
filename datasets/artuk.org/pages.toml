e the right to disclose (and you consent to us disclosing) your identity to any third party who is claiming that your content constitutes a violation of their intellectual property rights, or of their right to privacy. 8.6. We will not be responsible, or liable to any third party, for the content or accuracy of any content posted, uploaded or contributed by you or any other user of our website. 8.7. We have the right to remove your content from the website if, in our opinion, your post does not comply with the content standards set out in paragraph 8.2 above. We also have the right, in our sole discretion, at any time and for any reason to take down, remove, delete, alter, move or transfer any of the content that is on our website, or otherwise stored on our servers, without notice and without liability to you or any third party. 8.8. You are solely responsible for securing and backing up your content. We are not responsible for the protection or security of your content or for policing unauthorised copying or use of your content. 9. The Collections Portal Service 9.1. The Collections Portal is a self-service system accessed through the Art UK account which allows Collections to manage their data and participation in the Art UK project. Using the Portal, Collections can (subject to their permissions): add new artworks; edit existing artworks; change information about venues that are managed by the Collection; add images and logos; and obtain certain statistics and analytics in relation to the Art UK website. Partner Collections are permitted to upload images of works on paper (drawings, watercolours, prints, mixed media artworks), sculpture, paintings, photographs, and textile art. Non-partner Collections may upload images of new works in oil, acrylic and tempera, and sculpture, only. 9.2. If you have been granted access to the Collections Portal Service, the following additional terms and conditions shall apply to your use of the Collections Portal Service and, by 