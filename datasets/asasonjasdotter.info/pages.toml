ich suited the needs of the large-scale farming units of the planned economy. It was soon cultivated widely, not only in East Germany, but also around the whole Soviet Union. After 1990 it no longer met the requirements of the new, capitalist economy. As an archive, Adretta is fragile. It needs to be replanted each season to survive. But it fared better than the photo archive of Groß Lüsewitz: Adretta has become one of the most beloved and prevalent staples of post-Soviet subsistence farmers from Kazakhstan to Siberia. In the stories presented here, the two archives – processed through the research of Åsa Sonjasdotter and Elske Rosenfeld – are explored as forms of dormant knowledge that are latent or active sources of resistance and dissent. Such knowledge pits itself against a capitalist logic, a way of inscribing human and human-to-non-human relations, that is today proving ever more clearly dysfunctional. Mark"
