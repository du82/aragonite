full_description = "→ Åsa Sonjasdotterartist, re-searcher, writer and organiser RECENT EXHIBITIONS → Badischer Kunstverein COLLABORATIONS / LEARNING -> Papitas Taypuycha - Earthing Potatoes ONGOING ARTISTIC PRACTICE → The Kale Bed is so called → Cultivating Abundance → Cultivating Stories -> Chemical, Organic, Mixed → The Order of Potatoes RECENT WRITING / PUBLISHING -> Peace with the Earth → Tracing Agricultural Memory → The Order of Potatoes → Archive Journal #9 ARCHIVE→ Peace with the Earth -> Adretta-> Nachbarschaftsakademie-> Tromsø Academy of Art-> Cultivating Abundance → VIEW Mark VIEW feminist strategies in Danish visual art ‘this book brings an understanding of the struggles in the periods that the book deals with, as well as why they were necessary.’ - Forum Published in 2004, VIEW –feminist strategies in Danish visual art gathers information and material about projects that have previously been fairly inaccessible. The antology enquire and debate feminist strategies in Danish visual art from 1968 until 2004. VIEW does not offer a chronological overview. Language, Narration, Space and Action are the four focal points of the book, giving a thorough introduction to a wide range of feminist strategies across generations and schools. With this book, the feminist action group Kvinder på Værtshus has created an important contribution that has been sorely missing, and which will benefit the wider debate on representation and art history, in Denmark and abroad. Ed.ited by Nanna Debois Buhl, Nynne Haugaard, Åsa Sonjasdotter, Lisa Strömbeck. Published by Informations Publishing House, Copenhagen, in November 2004. 262 pages. In Danish and English Mark"
