title = "Cultivating Abundance — Asa Sonjasdotter"
description = "Cultivating Abundance – On the commoning practice of participatory plant breeding. A film by Åsa Sonjasdotter in dialogue with Hans Larsson. 34 min...."
full_description = "→ Åsa Sonjasdotterartist, re-searcher, writer and organiser RECENT EXHIBITIONS → Badischer Kunstverein COLLABORATIONS / LEARNING -> Papitas Taypuycha - Earthing Potatoes ONGOING ARTISTIC PRACTICE → The Kale Bed is so called → Cultivating Abundance → Cultivating Stories -> Chemical, Organic, Mixed → The Order of Potatoes RECENT WRITING / PUBLISHING -> Peace with the Earth → Tracing Agricultural Memory → The Order of Potatoes → Archive Journal #9 ARCHIVE→ Peace with the Earth -> Adretta-> Nachbarschaftsakademie-> Tromsø Academy of Art-> Cultivating Abundance → VIEW Mark Cultivating Abundance – On the commoning practice of participatory plant breeding. A film by Åsa Sonjasdotter in dialogue with Hans Larsson. 34 min. Recorded at the Larsson farm in Fulltofta, Sweden and at the Swedish University of Agricultural Sciences in Alnarp, 2019. This film is made in collaboration with Hans Larsson and Allkorn (allkorn.se), a farmer-initiated association working for the restitution of the heritage grains that Larsson have rescued from the deep freezers of the Nordic Genebank. Photography: Matilda Mester, Bruno DerksenEditing: Matilda MesterSound design: Jochen JezussekSound recording: Mathias Schlaegel, Jacob Gustavsson and Frank Mølgaard KnudsenEnglish Subtitles: Ingrid EngLink to the film:https://vimeo.com/359014311Password: Cultivating_Abundance On plant breeding /Om växtförädlingens historiaby/ av Hans Larsson. In Swedish/på svenskaFrom the website of / Från Allkorns hemsida (allkorn.se) Sedan jordbrukets begynnelse för 10000 år sedan har bönderna förädlat växter för sina lokala klimat och jordar. Förädlingen har utförts av mängder av bönder på mängder av platser. Jordens odlade mångfald har framställts av bönder. Antalet sorter har varit enormt, man talar tex om en halv miljon rissorter i Indien. När den vetenskapliga växtförädlingen startade i slutet på 1800talet togs förädlingen över av ett fåtal människor på ett fåtal platser. I början försökte man förädla för en lokal anpassning. Sverige hade tex sju örädlingsstationer fördelade över landet. Växtförädlingen var en statlig angelägenhet och stöttades med anslag. Efter 1970 privatiserades växtförädlingen och man förädlade ännu mer för en vid eller bred anpassning av sorterna. Dvs sorterna skulle kunna odlas överallt om de fick näring och skydd mot skadegörare. Efter hand skärptes utsädeslagarna och böndernas ursprungliga växtförädling är i princip olaglig. Ekologisk växtförädling Ekologisk förädling innebär bland annat att tidigare regionala växtförädlingsstationer ersätts med ett samarbete mellan förädlingsforskare och ekologiska odlare för att välja ut de sorter som passar bäst för regionen så kallad deltagande forskning.Ekologisk förädling innebär också att sorter väljs ut som förutom goda odlingsegenskaper, som ogräskonkurrens och effektiv kväveupptagningsförmåga också har bra bakningsförmåga, goda kvalitetsegenskaper och god smak. Växtförädlingen fram till tidigt 60-tal hade ungefär samma förutsättningar som ekologisk odling i dag, dvs låg insats av gödselmedel och inga kemiska bekämpningsmedel. Ekologisk förädling kartlägger därför det sortmaterial som använts fram till 1960-talet i Sverige men jämför också med moderna sorter som har attraktiva egenskaper som resistens, effektiv kväveupptagning och bra ogräskonkurrens.Ur kultursorter görs istället för selektiva urval mot speciella egenskaper, som ex. produktionsförmåga, en spridning av egenskaper där man ur samma sort får ett flertal linjer med olika förstärkta men inga borttappade egenskaper. Därigenom behåller man och förstärker mångfalden av egenskaper. Ekologisk växtförädling är ett nytt begrepp som innebär att sorter som odlas i det ekologiska jordbruket också skall vara speciellt lämpade för detta och framtagna i ekologiska förädlingsprogram. För varje gård och region kan sorter hittas och anpassas för att på bästa sätt utnyttja platsens ekologiska förutsättningar i klimat och jordtyp.Den genetiska mångfalden hos våra i genbanken bevarade kulturväxter med lång anpassning till landets förhållande är den mest värdefulla tillgången för ekologiskt jordbruk. Deltagande växtförädling Projektet med gamla sorter har pågått sedan 1995 på Alnarp. Många lantbrukare har sedan dess fått utsäde för att prova på den egna gården. Projektets syfte är att återskapa den biologiska mångfalden och hitta sorter som passar för ekologisk odling. Sorterna skall ha hög kvalitet och god smak. Den ekologiska synen på en sort är att den skall vara lokal för att man skall utnyttja de platsbundna egenskaperna så bra som möjligt både ifråga om klimat och jord. Den Nordiska genbanken har sparat en liten rest av den stora biologiska mångfald som en gång fanns i Sverige. Med utgångspunkt från den kan vi på nytt skapa en mångfald. Kulturväxterna skall inte ägas av multinationella företag utan gamla sorter skall ägas av bönderna. Variationen, den biologiska mångfalden skall vara så stor som möjligt både på fältet med mångformiga sorter eller sortblandningar och på gården med många arter och sorter och i regionen där bönderna inte alltid odlar samma sorter. Grundläggande principer för deltagande forskning är: Forskning ska bedrivas på ett sätt som gör att människor kan deltaga i hela forskningsprocessen från formulerandet av frågeställningen till analys och diskussioner om hur resultaten skall användas. Forskning ska ha som syfte att föra med sig direkta och positiva effekter för de grupper och individer som involveras. Kunskap är någonting som fördjupas och berikas samt görs mer socialt när det skapas kollektivt med människor i grupp . Forskning innefattar en kombination av olika tillvägagångssätt (inkluderande såväl kvalitativa och kvantitativa metoder) avsedda att underlätta kollektivt skapande av kunskap . Forskning, folkbildning och skapandet av kunskap är ofta aspekter av samma intellektuella process, när den är riktad mot handling . Deltagande forskning syftar även till empowerment, på svenska att ha kapacitet att sätta i stånd . Det betyder att arbeta med sin egen utveckling tex ökat självförtroende, förståelse för sin egen roll och betydelse och ökad makt över utvecklingen. Genom ökad samverkan med andra intressenter är det lättare för den enskilde att förstå sin egen verklighetsbild och vilken roll man själv kan spela. Att arbeta tillsammans med att återinföra de gamla sorterna i ett ekologiskt hållbart lantbruk innefattar samtidigt kultur ella, ekologiska, sociala, ekonomiska och politiska aspekter. Evolutionär växtförädling Begreppet evolutionär växtförädling myntades redan på 1950talet. Den har kommit tillbaka de senaste decennierna med något som kallas composite cross populations. Man korsar moderna sorter med varandra och låter blandningen utvecklas under upprepad odling. Blandningarna har kallats moderna lantsorter, men lantsorter karakteriseras också av lokal anpassning till klimat och jord, historiskt ursprung och traditionella jordbrukssystem. Grunden i evolutionär växtförädling är att populationer med stor genetisk mångfald utsätts för naturlig selektion. Genom att så ut populationerna år efter år så producerar de mest gynnade plantorna mer frö till nästa generation. Populationer under utveckling kan klara av både stress och varierande miljöer. Sorterna är inte enhetliga och inte stabila men de utvecklas med odlingen och klimatet och är också motståndskraftiga mot sjukdomar. De anpassar sig således efter jordens och platsens förutsättningar och hör till framtidens jordbruk genom att skapa den mångfald som är nödvändig. Mark"
