port from a range of individuals and partners, where Åsa Sonjasdotter was a 2022 resident. Her residency was supported by Iaspis – The Swedish Grants Committee. Alaiwat, Hughes, and Johnels weres students at the MA Art & Ecology, Goldsmiths, University of London. -> More about Chemical, Organic, and Mixed: A speculative (re)visit to the soils of the Haughley Experiment. Mark"
