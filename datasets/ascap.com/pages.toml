["https://ascap.com/about-us/governingDocuments"]
title = "ASCAP Governing Documents"
description = "Important updates, announcements and downloadable documents that govern ASCAP and its relationship with its membership."
full_description = "ASCAP Governing Documents Downloadable Documents Listed below are links to downloadable documents that govern ASCAP and its relationship with its membership and licensees. Articles of Association *(PDF) The basic document that sets out ASCAP's structure and governs its relationship with its members, as amended through May 2002. Membership Application and Agreement The documents that all members sign when they join ASCAP. Compendium of ASCAP Rules and Regulations, and Policies Supplemental to the Articles of Association *(PDF) The rules, regulations and policies adopted by the Board of Directors. Please note that at the June 2023 Meeting of ASCAP's Board of Directors, the Board approved new rules in order to strengthen protections against erroneous or fraudulent title registrations, and to deal with members’ conduct that could potentially harm ASCAP, its members or employees. The new rules are set forth in Sections 2.3 and 5.1 of the Compendium of ASCAP Rules and Regulations, and Policies Supplemental to the Articles of Association. Earlier, at its September 2022 meeting, ASCAP's Board of Directors approved changes to the Membership resignation process as set forth in Section 1.11.1 of the Compendium of ASCAP Rules and Regulations, and Policies Supplemental to the Articles of Association. Under the modified rule, Members who are elected to Membership on and after January 1, 2023, will be able to resign from ASCAP on a biennial basis; Members elected to Membership before January 1, 2023 have an opportunity to notify ASCAP of their intent to resign during their next annual notification window before being subject to the new biennial resignation rule. ASCAP's Survey and Distribution System: Rules & Policies *(PDF) The rules and regulations governing distribution of royalties to members, including the Writers’ Distribution Plans, the Writers’ and Publishers’ Distribution Formulas, the Weighting Rules and Weighting Formula. Please note that at its September 2022 meeting, ASCAP’s Board of Directors approved a change to Rule 4.2 to provide that for performances on terrestrial radio, satellite radio and interactive and non-interactive audio-only streaming services, each Feature Performance of a work shall receive one (1) Use Credit, thereby eliminating the prior maximum of two (2) Use Credits for a Single Program. Earlier, at its June 2022 meeting, the Board had approved a change to Rule 2.8 to provide for additional payments in a survey quarter for certain works that have accumulated 40,000 lifetime Feature Performance credits and meet designated current survey quarter thresholds, but do not otherwise achieve high levels of Feature Performances on terrestrial radio, satellite radio and music streaming services in the most recent four survey quarters. Previously, such works were required to have accumulated 300,000 radio and television Feature Performance credits to be eligible for additional payments. Both rules changes became effective immediately upon their approval by the Board of Directors. Second Amended Final Judgment entered in United States v. ASCAP *(PDF) ASCAP’s Consent Decree with the United States government that largely governs ASCAP's licensing activities. Board of Review Rules of Procedure *(PDF) Rules for Appeals of Decisions of the ASCAP Board of Review *(PDF) Writer Resignation Notification Form *(PDF) Publisher Resignation Notification Form *(PDF) *Requires Adobe Acrobat Reader plug-in. Download the plug-in by clicking the link below."
year_published = 2025
clearnet = "https://ascap.com/about-us/governingDocuments"
