full_description = '''<div class="no-js"> This page requires Javascript to be enabled. Please enable javascript in your browser preferences. </div> Contact Us Are you a member with a question? Log in and send your question directly to ASCAP. Contact Us Get your answers here! Our FAQ is loaded with the most common questions we get from visitors and members. Read FAQs How can we help you? International / Domestic PROs If you represent a performing rights organization, send us a message and one of our Global Society Services representatives will get right back to you. Contact Society Services ASCAP Licensing Contact our Licensing department for information about using ASCAP music in your business. Contact ASCAP Licensing Marketing & Advertising Fill out this online form to ask our Marketing & Communications team a question or inquire about advertising with ASCAP. Contact ASCAP Marketing Press Questions Visit the ASCAP Press Room to contact our PR team and browse our press release archive. ASCAP Press Room Privacy Inquiries Fill out this online form to ask us any questions you may have about ASCAP's Privacy Policy and practices. Privacy Inquiries General ASCAP Questions Write to our Global Member Services team. They'll point you in the right direction. General ASCAP Questions ASCAP's Global Member Services representatives are well-prepared to answer a variety of your questions; for more complicated matters, or for certain specific individual requests, research may be required before we can provide an answer. We ask for, and appreciate, your patience and cooperation. Please note that ASCAP will not tolerate the mistreatment and/or harassment of its representatives and will take all necessary steps to protect its representatives in the event of such misconduct, including, without limitation, seeking expulsion from ASCAP membership. As a result, we ask that you please keep your communications with ASCAP's representatives respectful, professional and courteous. Still need help? Visit our Help Center. Help Center ASCAP Membership Offices If you have a question about your ASCAP membership, log into your ASCAP Member Access account to submit an inquiry, or call ASCAP Global Services at 1-800-95-ASCAP from 9am-6pm ET, Monday through Friday. New York 250 West 57th Street New York, NY 10107 Tel: (212) 621-6000 Fax: (212) 621-6595 Los Angeles 7920 W. Sunset Boulevard, Third Floor Los Angeles, CA 90046 Tel: (323) 883-1000 Fax: (323) 883-1049 Atlanta 950 Joseph E. Lowery Blvd. NW, Suite 23 Atlanta, GA 30318 Tel: (404) 685-8699 Fax: (404) 685-8701 Miami Tel: (305) 673-3446 Fax: (212) 621-6595 Puerto Rico Tel: (787) 707-0782 Fax: (787) 707-0783 London 4 Millbank 2nd Floor London SW1P 3JA Tel: 011-44-207-439-0909 Fax: 011-44-207-434-0073 Nashville Two Music Square West Nashville, TN 37203 Tel: (615) 742-5000 Fax: (615) 742-5020 Still need help? Contact us! (We’re music people. We’re good at listening.) Contact us'''
