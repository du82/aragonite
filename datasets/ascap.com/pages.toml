title = "Songview | ASCAP, BMI, metadata, music, royalties"
description = "Songview is a new comprehensive data platform that provides music users with an authoritative view of public performance copyright ownership and administration shares for the vast majority of music licensed in the United States."
full_description = '<div class="no-js"> This page requires Javascript to be enabled. Please enable javascript in your browser preferences. </div> With the launch of Songview, ASCAP and BMI are working together to make copyright data more accessible and transparent for all of our partners. Songview is a new comprehensive data platform that provides music users with an authoritative view of public performance copyright ownership and administration shares for the vast majority of music licensed in the United States. +Read the Songview press release HOW IT WORKS This innovative new system ingests song ownership information from ASCAP and BMI, processes and reconciles that information based on agreed-upon rules, and then sends the reconciled data back out to each PRO’s public searchable databases. MORE DETAILED INFORMATION With Songview technology integrated into our online search tools, ASCAP and BMI are able to seamlessly display detailed, aggregated performing rights data for more than 25 million musical works in our combined repertories, including a breakdown of shares by PRO, all in one place for the very first time. MORE COMPLETE COPYRIGHT DATA When you see the Songview checkmark next to a song, you know that the songwriters, publishers and ownership shares shown on the ASCAP and BMI websites are accurate, reliable and consistent between the two PROs. Experience Songview in action Visit the ASCAP Repertory Search page Start searching "This project is all about providing greater transparency for everyone who relies on this copyright data to guide important business decisions. When you see the Songview checkmark, you know that the data is consistent in both ASCAP and BMI’s copyright systems. Drawing upon our 185 years of combined ASCAP and BMI expertise in managing complex and dynamic copyright data, we have built a convenient new digital tool for anyone who licenses music. This release is our first iteration of Songview, and we are committed to enhancing this new platform as our industry evolves.”– Beth Matthews, ASCAP CEO Read Songview press release Visit Songview.com Read Songview FAQ'
