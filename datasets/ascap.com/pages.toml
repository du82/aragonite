full_description = '''<div class="no-js"> This page requires Javascript to be enabled. Please enable javascript in your browser preferences. </div> ASCAP Member Benefits Anything you need, we got it. As an ASCAP member, you get an exclusive package of benefits, designed to make your life as a music professional a little bit easier. Wellness Creation Tools & Gear Education Instrument & Studio Insurance Marketing Merchandise Travel Aaptiv Take your gym experience from same-old to sweat fest with Aaptiv’s engaging audio workouts, led by experienced trainers and featuring your favorite music. ASCAP members get a discount on a monthly plan. Learn more Bandzoogle Built by musicians for musicians, Bandzoogle is an all-in-one platform that makes it easy to build a beautiful website and EPK for your music. ASCAP members get an exclusive extended free trial, plus a lifetime discount off any subscription. Learn more BetterHelp ASCAP members get a free trial of BetterHelp's professional counseling services by chat, text, video or phone. Get matched with a licensed therapist within 24 hours for convenient and confidential online counseling. Anytime. Anywhere. Learn more The ASCAP Wellness Program If creating music is your life, ASCAP’s mission is to support you every step of the way. And that means supporting the whole you. Welcome to the ASCAP Wellness Program, designed especially for our music creator members, intended to help nourish your body, mind and spirit so you can be your creative best. Read more Log into Member Access to take advantage of all your ASCAP benefits. Learn more Level up your music career ASCAP offers a wide variety of workshops in all genres to help you move your career forward. Learn more'''
