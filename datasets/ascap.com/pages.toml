title = "Concert Music"
description = "The latest news, events, articles and opportunities important to ASCAP members working in the concert music, symphonic and choral music genres."
full_description = '''<div class="no-js"> This page requires Javascript to be enabled. Please enable javascript in your browser preferences. </div> ASCAP Concert Music Join ASCAP today. It's now FREE to join our global family of professional music creators. Join now The ASCAP Foundation Names Recipients of 2024 Morton Gould Young Composer Awards Read More Courtney Bryan & Raven Chacon Receive MacArthur “Genius Grants” These two wildly creative ASCAP composers have both received $800,000, no-strings-attached awards from the MacArthur Foundation as as investments in their potential. Read more NEWS ASCAP Composer Michael Abels Wins 2023 Pulitzer Prize for Music Abels and his collaborator Rhiannon Giddens won the Pulitzer Prize for their opera Omar. Learn More NEWS ASCAP Family Dominates Grammy Classical Composition Category Andy Akiho, Derek Bermel, Sofia Gubaidulina & Carlos Simon each nominated for a 2023 Grammy (Gubaidulina photo by Dmitri Smirnov) Read more ASCAP Concert Music Primer Are you a concert music composer or publisher? Have questions about licensing your concert venue? Here’s an overview of everything you need to know. Take a look ASCAP Explained Answers to big questions about ASCAP & your music career Watch videos Performance Notification Fill out this form whenever your music is performed live. Get started ASCAP Plus Awards Concert music composers who made under $25k in domestic ASCAP royalties last year are eligible. Apply now ASCAP Concert Music Video Playlist Performances, speeches and interviews with some of our favorite ASCAP composers. Watch more Nathalie Joachim visits ASCAP Composer Nathalie Joachim (center) with ASCAP's Cia Toscanini and Michael Spudic in early February, 2020 - two weeks after Joachim earned a coveted United States Artists Fellowship. Joachim's recent album Fanm d'Ayiti was nominated for a 2020 Grammy (Best World Music Album). December 13, 2019: Kinds of Kings visit ASCAP The all-ASCAP composer collective Kinds of Kings visit ASCAP HQ, just ahead of their concert at National Sawdust. Pictured (l-r): composers Shelley Washington & Susanna Hancock, ASCAP's Cia Toscanini, composers Gemma Peacocke & Maria Kaoutzani, ASCAP's Michael Spudic Hillary Purrington's "Harp of Nerves" World Premiered at Zankel Hall On November 13, 2019, ASCAP Foundation Morton Gould Young Composer Award winner Hillary Purrington had her guitar concerto "Harp of Nerves" world premiered at Zankel Hall. Pictured (l-r) are Purrington, guitarist JIJI, artist manager Steven D. Shaiman and ASCAP's Michael Spudic. Music at St. Paul’s: The Music of Roy Jennings On September 10, 2019, the music of ASCAP composer Roy Jennings was featured at a concert inaugurating a new season of Sacred Music at Columbia University, with a full season of Tuesday concerts, all free and open to the public. Pictured are (l-r) series curator and ASCAP composer Julian Bennett Holmes, Jennings, his wife Eva Jennings, vocalists Pamela E. Jones (soprano), Lucia Bradford-Wiggins (mezzo-soprano) and Angela L. Owens (soprano) and ASCAP's Michael Spudic. A visit from Gabriel Kahane, Anahita Abbasi and Lynn Kao (l-r) ASCAP's Cia Toscanini, composers Gabriel Kahane, Anahita Abbasi and Lynn Kao, and ASCAP's Michael Spudic. The three composers each dropped in for a visit at ASCAP's 20th floor lounge on August 6, 2019. ASCAP with the Iranian Female Composers Association (l-r) Composer Niloufar Nourbakhsh, ASCAP's Cia Toscanini, composers Aida Shirazi & Anahita Abbasi and ASCAP's Michael Spudic. All three ASCAP-licensed composers are members of the Iranian Female Composers Association. The photo was taken after a sold-out concert of their works, August 5, 2019 at the NY Public Library for the Performing Arts, presented as part of the 2019 Mostly Mozart Festival. Michael Schachter visits ASCAP ASCAP composer Michael Schachter (center) visits ASCAP's Cia Toscanini (l) and Michael Spudic on July 25, 2019. The previous night, Schachter's hallowed work The Black Crown (based on a poem by ASCAP member Langston Hughes) made its New York premiere at Lincoln Center. John Mauceri joins ASCAP On June 28, 2019, renowned conductor, recording artist and educator John Mauceri stopped by our NYC HQ to officially join the ASCAP family! He's pictured here with ASCAP's Cia Toscanini (l) and Seth Saltzman (r). Julia Wolfe named 2019 Composer of the Year by Musical America Julia Wolfe celebrates being named 2019 Composer of the Year by Musical America with ASCAP staff, composer members and music industry colleagues. Photo by Stephanie Berger. Alvin Singleton with ASCAP Board & Execs ASCAP composer Alvin Singleton (center) visits the ASCAP office on June 10, 2019. Pictured (l-r) are ASCAP's Cia Toscanini, ASCAP Board member Alex Shapiro, Singleton, ASCAP's Michael Spudic & ASCAP Board member James M. Kendrick. Niloufar Nourbakhsh with ASCAP's Cia Toscanini Composer Niloufar Nourbakhsh visits with ASCAP's Cia Toscanini on June 25, 2019, the same day she joined ASCAP. Nourbakhsh is the founder of the Iranian Female Composers Association, an organization dedicated to empowering Iranian women in music and the arts by fostering originality, honoring diversity and strengthening equality. Carlos Simon with ASCAP's Cia Toscanini Rising composer Carlos Simon visits with ASCAP's Cia Toscanini on March 30, 2019. Simon was named a "Composer to Watch" at the 2015 NYU/ASCAP Foundation Film Scoring Workshop In Memory of Buddy Baker; he was also chosen to participate in the 2019 ASCAP Film Scoring Workshop in LA. "Hyphenated-Americans" composers On February 20 at Merkin Hall (Kaufman Music Center), the New York Festival of Song presented "Hyphenated-Americans:" a concert of music by foreign composers who now call America home, along with first-generation American composers. (l-r) ASCAP's Michael Spudic with featured ASCAP composer Bright Sheng, New York Festival of Song co-founder Michael Barrett, and featured ASCAP composers Roberto Sierra and Daniel Sabzghabaei. The music of ASCAP composer Clarice Assad (not in attendance) was also featured on the program. Photo by Cherylynn Tsushima. Soundwaves concert At the Soundwaves concert at First Presbyterian Church of Far Rockaway, June 14, 2019: (l-r) Kyle Walker (pianist), Emily Kalish (violinist), Eun Lee (arts administrator/activist), Jeff Scott (composer/Imani Winds French hornist), Aqueelah Ligonde (Pastor) and ASCAP's Michael Spudic. The concert featured music by Margaret Bonds, Samuel Coleridge-Taylor (arr. Maud Powell), Jeff Scott, Roberto Sierra and William Grant Still, followed by a conversation on music as a vehicle for activism with composer Jeff Scott and other community members expressing their viewpoints concerning the ongoing impact of climate change in the Rockaways. ASCAP's Cia Toscanini with ASCAP composers George Tsontakis & Melissa Dunphy ASCAP Learning Center Articles & videos about the craft and business of scoring for the concert stage, the screen and beyond Get schooled ASCAP FAQs Comprehensive FAQs about registering your music, earning royalties and more Get answers ASCAP's commitment to the next generation of songwriters and composers deeply impressed me and was a major factor in bringing them on board with my team. We have such a responsibility to nurture young musicians and I am committed to this challenge in every aspect of my engagement with the art form. — Gustavo Dudamel Meet the ASCAP Concert Music team Cia Toscanini Vice President, Concert Music Michael Spudic Membership Representative, Concert Music Cia Toscanini Vice President, Concert Music Michael Spudic Membership Representative, Concert Music function toggleArrowGABoard(element, val) { var span = element.className; if (span.toLowerCase().indexOf("open") >= 0) { if (window.location.href.indexOf("board") > -1) { ga('send', 'event', 'leadership', 'expand', 'board of directors'); } else { ga('send', 'event', 'leadership', 'expand', 'ASCAPteam'); } } else { if (window.location.href.indexOf("board") > -1) { ga('send', 'event', 'leadership', 'collapse', 'board of directors'); } else { ga('send', 'event', 'leadership', 'collapse', 'ASCAPteam'); } } } ASCAP Member Benefits Get special offers on important resources for your life as a music professional. Explore all Benefits now ASCAP Concert Music Programs & Opportunities Morton Gould Young Composer Awards Read more View all programs'''
