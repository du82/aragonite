title = "ASCAP Wellness Program | music & mental health, meditation, exercise, creativity, stress, workouts, anxiety"
description = "If creating music is your life, ASCAP’s mission is to support you every step of the way. And that means supporting the whole you. The ASCAP Wellness Program is designed especially for our music creator members, intended to help nourish your body, mind and spirit so you can be your creative best."
full_description = '''Welcome to the ASCAP Wellness Program Share: Email If creating music is your life, ASCAP’s mission is to support you every step of the way. And that means supporting the whole you. The ASCAP Wellness Program is designed especially for our music creator members, intended to help nourish your body, mind and spirit so you can be your creative best. <div class="no-js"> This page requires Javascript to be enabled. Please enable javascript in your browser preferences. </div> Welcome to the ASCAP Wellness Program Share: Email If creating music is your life, ASCAP’s mission is to support you every step of the way. And that means supporting the whole you. The ASCAP Wellness Program is designed especially for our music creator members, intended to help nourish your body, mind and spirit so you can be your creative best. I’m super excited and grateful that ASCAP has made a commitment to helping artists be mindful stewards of their own bodies and hearts, so that they can be the best musical messengers of optimism, wellness and healing possible. — Michael Franti, musician, humanitarian, filmmaker and activist LISTEN: Mental Health Awareness x Music Creators As the weather warms up and music festival season starts, so many artists will hit the road to share their music with the world. But the challenges of being a touring artist can take a toll on creators’ mental and physical health. In this episode of VERSED, Dr. Chayim Newman & Zack Borer share their insights into the unique challenges artists face and some of the ways we can take care of ourselves and each other. Listen to the episode If you or someone you know is struggling with mental health, please take care of yourself and seek the help you need. The ASCAP Wellness Program has partnered with MusiCares® to launch new recovery support groups in multiple cities, plus weekly cyber emotional support groups for women in music, the Black music community and the LGBTQ+ music community. Visit the MusiCares site to find a support group near you. 5 Effective Mindfulness Practices That Aren't Meditation While meditation can be incredibly beneficial – shown to help support mental health, increase focus and even boost creativity – it’s not for everyone. Fortunately, meditation is just one several ways you can practice mindfulness and reap similar rewards. Read more to learn exactly how practicing mindfulness can add value to your life and creativity, as well as a handful of ways to get started. Make it mindful ASCAP Wellness Advice The Health Benefits of Play for Creators Read more 12 Gift Ideas for Health-Conscious Creators Read more How Creators Can Better Navigate Uncertainty Read more The Difference Between "Bad" and "Good" Stress Read more How to Deal with Perfectionism as a Creator Read more The Music Creator's Guide to Time Management Read more Advice for Managing Collaborative Relationships Read more How Creators Can Set and Enforce Personal Boundaries Read more The Creator's Guide to Getting Mentally and Emotionally Stronger Read more How to Avoid (and Bounce Back From) Burnout Read more 5 Ways to Practice Self-Care in the Studio Read more How Music Creators Can Better Prioritize Their Own Needs Read more The Creator's Guide to Goal Setting Read more How Rock 'n' Roll and a Healthy Lifestyle Can Coexist Read more 10 Simple Things Music Creators Can Do to Live a Healthier, Longer Life Read more A Guide to Maintaining Wellness While on the Road Read more The Best Types of Meditation for Music Creators Read more Former Music Exec Shanti Das Works to Shatter the Stigma of Mental Health In the Black Community Read more How Visualization Can Help Creators Achieve Their Goals Read more 8 Foods That Fuel Creativity, Brainpower, Energy and More Read more The Benefits of Sound Bath Meditation for Creators Read more Your Music Festival Wellness Checklist Read more A Beginner’s Guide to Therapy for Music Creators Read more 6 Ways Creators Can Make Their Wellness Routines More Sustainable Read more Healthy Advice For Creators to Deal With Criticism Read more 5 Ways Music Creators Can Prepare Their Mind and Body to Perform Read more 4 Ways to Make Social Media Work For—Not Against—Your Mental Health Read more 4 Ways Creators Can Benefit From Breathing Exercises Read more 8 Psychologist-Approved Ways to Boost Your Energy Read more 7 Research-Backed Strategies for Creators to Build (and Break) Habits Read more The Creative and Health Benefits of Going Outside Read more This Composer Shares Her Most Powerful Productivity Hacks Read more How Your Surroundings Affect Your Mood, Creativity and More Read more How to Improve Self Confidence Read more How This Creator Is Finding Balance in the "New Normal" Read more How Music Creators Can Thrive During the Winter Read more Advice for Creators Anxious About Readjusting to Post-Pandemic Life Read more How Running Can Help Creators Boost Creativity, Mood and More Strap on your sneakers How Recovery Helped This Creator Navigate the Pandemic Read more The Benefits of Quality Sleep for Creators (And How to Get More of It) Read more 6 Ways Creators Can Benefit From Meditation Read more Stuck at the Computer? Reduce Stress on Your Body with These Physical Therapist-Approved Tips Read more 4 Ways for Creators to Safely Find Community During the Pandemic Read more 7 Ways Music Can Help Reduce Stress and Anxiety Read more Innovative Wellness Services ASCAP members get access to, and significant discounts on, services that support mental health, mindfulness, exercise and nutrition. Take your gym experience from same-old to sweat fest with Aaptiv's engaging audio workouts, led by expert trainers and featuring your favorite music. ASCAP members get a discount on a monthly plan. Click to start your workout BetterHelp offers private & professional counseling by chat, text, video or phone. Get matched with a licensed therapist within 24 hours for convenient and confidential online counseling. Anytime. Anywhere. ASCAP members get a free trial. Click to read more Daily Burn offers thousands of workouts on-demand and provides personal fitness guidance, encouragement and motivation to help those from all levels and lifestyles achieve everyday victories. ASCAP members get an extended free trial of Daily Burn. Find the right video workout for you The Shine app makes being kind to yourself part of your daily routine. Every weekday morning, Shine gets you motivated with affirming messages. You can also unlock hundreds of guided meditations and research-backed programs on calming anxiety, feeling resilient, and building confidence. ASCAP members get a big discount off an annual Shine membership. Find out more Watch provocative discussions about the intersection of music and wellness Watch some of our favorite ASCAP music videos about physical and mental well-being Watch playlist Paul Williams on VERSED: The ASCAP Podcast Hear the legendary songwriter & ASCAP President share how recovery and wellness have helped him thrive Listen now Read about our latest ASCAP Wellness Program initiatives for our members Read press release var _emailSignUpFormdataSourceId = "4ca894cd-c985-42ec-8157-32186516f027"; Subscribe to ASCAP’s Inside Music newsletter to be the first to know about new additions to the ASCAP Wellness Program Email Address Submit ga('send', 'event', 'wellness', 'Email Subscription -signup up for the first time - Module', 'impression'); $("#emailAddress").on("change", function() { ga('send', 'event', 'wellness', 'Email Subscription -signup up for the first time - Module', 'text entered'); }); $("#EmailSignUp").on("click", function () { ga('send', 'event', 'wellness', 'Email Subscription -signup up for the first time - Module', 'click - submit'); }); $("#EmailSignUp").on("PrefCenter:EmailVerified", function () { ga('send', 'event', 'wellness', 'Email Subscription -signup up for the first time - Module', 'submit-success'); }); $("#EmailSignUp").on("PrefCenter:EmailError", function (ar