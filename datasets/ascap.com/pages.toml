["https://ascap.com/about-us/governance"]
title = "Governance"
description = "The ASCAP Board of Review is an independent panel of writer and publisher members, elected by ASCAP's membership, and available to hear claims by members that their royalty distributions were not made in accordance with the rules and regulations adopted by ASCAP's Board of Directors."
full_description = '''<div class="no-js"> This page requires Javascript to be enabled. Please enable javascript in your browser preferences. </div> Governance ASCAP is the only performing rights organization in the US founded and governed by songwriters, composers and music publishers. Our Board of Directors is made up entirely of writers and publishers elected from and by the membership every two years. Writer members elect 12 writers to sit on the Board, and publisher members elect 12 publishers, ensuring that every decision the Board makes is in the interest of ASCAP members as a whole. This Board elects a President and Chairman, who must be a writer member. ASCAP Board of Directors Paul Williams President and Chairman of the Board Paul Williams is one of the most beloved and respected lyricists and composers in the world today. As President and Chairman of the Board of the Ameri... Read more ASCAP Board of Directors Jon Batiste Writer board member Jon Batiste is one of history’s most brilliant, prolific and accomplished musicians. Batiste studied and received both a B.A. and M.F.A. at the world-renowned Juilliard School in New York City. From 2015 until 2022, Batiste served as the bandleader and musical director of The Late Show with Stephen Colbert on CBS. In 2018, he received a Grammy nomination for Best American Roots, and in 2020, he received two Grammy nods for the albums: Chronology of a Dream: Live at the Village Vanguard and Meditations (with Cory Wong). In 2020, he won an Academy Award for Best Original Score for the Disney/Pixar film Soul, an honor he shared with fellow composers Trent Reznor and Atticus Ross. Jon’s work on Soul also earned him a Golden Globe, a BAFTA, a NAACP Image Award and a Critic’s Choice Award. He is the second black composer in history, after legendary jazz musician Herbie Hancock, to win an Academy Award for composition. Batiste’s latest studio album, We Are, was released in March 2021 to overwhelming critical acclaim. Subsequently, he was nominated for eleven Grammys across seven different categories, a first in Grammy history. He went on to win five of those Grammys, including Album of the Year. Read more Peter Brodsky Publisher board member Peter Brodsky is the Executive Vice President Business and Legal Affairs and General Counsel of Sony Music Publishing in New York. He has held that position since April 2020. Prior to that he was Executive Vice President Business and Legal Affairs from the time he joined the company in 2007. In this role, Peter leads a department of 20 that is responsible for all of Sony’s business and legal activities in the United States. Peter’s responsibilities as General Counsel are global. Peter is also responsible for Sony Music’s North American digital initiatives which include creating and executing the company’s strategy in connection with the licensing of Sony Music Publishing’s catalog to digital music services and other platforms. Peter has been a leader in the industry since the inception of the digital music business and has successfully negotiated with virtually every type of digital music service and platform, including on-demand and non-interactive audio streaming, video streaming services, lyric services, sheet music, cloud-based lockers and many others. Since 2015 Peter has been recognized by Billboard magazine as one of the top 25 “Digital Power Players” in the music business. He has also been included in Billboard’s “Top Music Lawyers” since 2016.Peter also plays a lead role in Sony’s major catalog acquisitions, including the 2012 deal for EMI Music Publishing. Part of Peter’s responsibilities in that transaction was to make several appearances in front of the Federal Trade Commission and the European Commission which ultimately resulted in antitrust approval for the deal.In addition to the above responsibilities, Peter plays an active role in music publishing industry and legislative matters, such as copyright reform, and works closely with the National Music Publishers Association on many issues. Peter’s department is responsible for negotiating, drafting and maintaining all of the company’s songwriter, co-publishing, sub-publishing, joint venture and other agreements with talent and catalog owners as well as protecting and enforcing Sony Music Publishing and its songwriters’ intellectual property rights around the world.Peter is a 24-year veteran of the music publishing industry and previously worked at BMG Music Publishing in a similar role where he was in charge of BMG’s business and legal affairs. While at BMG, Peter played an integral role in the acquisition and integration of Zomba Music Publishing, as well as Bertelsmann’s divestiture of BMG Music Publishing to Universal in 2007. Peter began his career as an associate at the law firm of White & Case in New York. He lives in New York City with his wife and two children. Read more Bruce Broughton Writer board member Best known for his many film and television scores, Bruce Broughton is the composer of classic soundtracks such as Silverado, Tombstone, The Rescuers Down Under, The Presidio, Miracle on 34th Street, the Homeward Bound adventures and Lost in Space. His television themes include Seth MacFarlane's The Orville, JAG, Steven Spielberg’s Tiny Toon Adventures and Dinosaurs. His scores for television range from mini-series like Roughing It and The Blue and Gray to TV movies (Warm Springs, O Pioneers!) and countless episodes of television series such as Dallas, Quincy, Hawaii Five-O and How the West Was Won. With 23 nominations, he has won a record 10 Emmy awards. His score to Silverado was Oscar-nominated, and his score to Young Sherlock Holmes was nominated for a Grammy. His music has accompanied many of the Disney theme park attractions throughout the world, including the recent Soarin’ Around the World. His score for Heart of Darkness was the first recorded orchestral score for a video game. As a concert composer, ensembles such as the Cleveland Orchestra, the Chicago Symphony, the National Symphony and the Los Angeles Chamber Orchestra have performed his works. His works for wind ensembles, bands and chamber groups are performed and recorded throughout the world.He is a Board member of ASCAP, a former governor of both the Academy of Television Arts and Sciences and the Academy of Motion Picture Arts and Sciences, as well as a past president and founding member of the Society of Composers & Lyricists. Read more Bob Bruderman Publisher board member Bob Bruderman serves as Executive Vice President, Global Digital Business, at Kobalt Music Group. A member of Kobalt’s Executive Leadership Team, he is responsible for leading the digital commercial partnership, strategy and licensing efforts globally for Kobalt Publishing, working with a broad range of startup digital services as well as with established players, including Amazon, Apple, Meta, Pandora, Peloton, Snap, Soundcloud, Spotify, TikTok and YouTube, among many more. He also works closely with a number of industry groups to ensure the intellectual property interests of songwriters and artists are protected, including NMPA and ICMP, among others. In 2022 he was deeply involved in the Phonorecords IV settlement agreement between the NMPA, NSAI and DiMA that established statutory mechanical rates in the United States from 2023-2027, which are largely reported as being among the most favorable to songwriters in the world. He has repeatedly been named one of Billboard's "Digital Power Players."In addition to serving on the Board of ASCAP, he currently also serves on the Board of Directors of The Mechanical Licensing Collective (“The MLC”) as well as DDEX, and previously served on the board of The Music Business Association (“Music Biz”) and the Canadian Publishers’ Committee (part of CMRRA).Prior to joining Kobalt in 2013, Bruderman held a wide range of roles during his 11 years at Sony Music Entertainment, including in distribution, royalties, release planning, music publishing administration and sync, among others. He enjoys playing saxophone and guitar in his spare time, as well as making oil paintings. He is an avid fan of live and recorded music (especially jazz). He graduated from the University of Miami and lives with his wife and two small children in Brooklyn. Read more Desmond Child Writer board member Grammy-winning and Emmy-nominated songwriter Desmond Child is one of music's most prolific and accomplished hitmakers. He’s a film, television, theater and music producer, recording artist, performer and author. His credits appear on more than 80 Billboard Top 40 singles spanning six decades, including “Livin’ on a Prayer,” “You Give Love a Bad Name,” “I Was Made for Lovin’ You,” “Dude Looks Like a Lady,” “How Can We Be Lovers,” “I Hate Myself for Loving You,” “Livin’ La Vida Loca,” “The Cup of Life,” “Waking Up in Vegas,” “Kings & Queens” and many more. From Aerosmith to Zedd, his genre-defying collaborations also include KISS, Bon Jovi, Cher, Barbra Streisand, Ricky Martin, Alice Cooper, Joan Jett, Michael Bolton, Katy Perry, Dolly Parton, Kelly Clarkson, Carrie Underwood, Garth Brooks, Cyndi Lauper, Christina Aguilera, Weezer, The Black Keys, Ava Max, Mickey Mouse and Kermit the Frog, selling over 500 million records worldwide with downloads, YouTube views and streaming plays in the billions. Desmond was inducted into the Songwriters Hall of Fame in 2008 and serves on its Board of Directors as well as the Board of ASCAP. In 2018 he received ASCAP’s prestigious Founders Award celebrating 40 years as a proud member of ASCAP. In 2012 he also co-founded the Latin Songwriters Hall of Fame where he serves as Chairman Emeritus. In 2022 he was inducted into the Latin Songwriters Hall of Fame and “Livin’ La Vida Loca” was inducted into the National Archives of the Library of Congress for its cultural significance to America. In 2023 “Livin’ on a Prayer” reached 1 billion streams on Spotify and in 2024 “You Give Love a Bad Name,” “I Was Made for Lovin’ You” and “Kings & Queens” also reached 1 billion streams. In 2025 Barbra Streisand will be releasing a duet featuring Josh Groban of “Where Do I Go from You” from the musical BEBA’S MAMBO, co-written with Davitt Sigerson. Desmond’s autobiography, LIVIN' ON A PRAYER: BIG SONGS BIG LIFE with David Ritz is out now (audiobook also available). DesmondChild.comIG: @Desmond.ChildFB: Desmond.ChildTikTok: @DesmondChildOfficial Read more Marti Cuevas Publisher board member Marti Cuevas has enjoyed a diverse and exciting career during her nearly four decades in the music business. Beginning as a saxophone and flute player and composer, Cuevas spent a decade playing jazz and Latin music in Europe; highlights from this period include opening for artists such as Miles Davis and Joe Henderson and accompanying salsa legends Celia Cruz and Cheo Feliciano.Cuevas relocated to NYC in the late ‘80s, pursuing a lifelong dream of becoming part of the fabric of the jazz and Latin music mecca. However, as a single mother of two small children, Cuevas’s search for stable employment led her to the offices of famed music business attorney William Krasilovsky. Marti spent five years with Krasilovsky, completing what she termed her “master’s degree” in “The Business.”In 1990, Marti was eventually “poached” by two of Krasilovsky’s clients to take on all business affairs duties for J&N Records/J&N Publishing. Marrying her artistic background with music business acumen, Marti quickly carved out a special place for herself. With a unique skill set, Marti negotiated and drafted contracts in English and Spanish, set up a royalty accounting system for publishing, was troubleshooter with close relationships with writers and artists and much more. Starting with only a few musical works and a handful of artists, J&N developed into one of the most important tropical music companies in US history; today J&N boasts an incredible catalog of classic, vintage records and musical compositions. Marti’s relationship as administrator for J&N continues to this day.Concurrently, Marti – a consummate sight reader and section player on her instrument – played with many of the top merengue bands of the era (frequently performing music she was familiar with from her publishing duties), culminating with an opportunity to record baritone for Juan Luis Guerra on the Perico ripiao hit, “La Cosquillita.”In 1999 Marti founded Mayimba Music, initially focused on providing label and publishing administration services to independent companies, authors and artists. Highlights from this period include her long relationship with Premium Latin Music and its hit international bachata group Aventura. While serving as Premium’s General Manager and Director of Business Affairs, Aventura’s lead singer and primary songwriter, Anthony “Romeo” Santos, approached her to help him set up a publishing company for his non-Aventura works. Romeo entrusted his publishing catalog to Mayimba for a decade, until signing with a major, and has retained Marti as an integral part of his team.Mayimba Music won ASCAP Latin Indie Publisher honors in 2013, 2014 and 2015 alongside Billboard Latin Indie Publisher of the Year awards in 2015 and 2016.You can find Marti Cuevas practicing her “new” 1958 Selmer Mark VI baritone sax, and discussing the intricacies of CWR files and metadata management. Read more Sharon Farber Writer board member A Grammy winner, a member of the Executive Committees of both the Motion Pictures and TV Academies, four-time Emmy Award nominee, winner of the Society of Composers & Lyricists Award for Outstanding Work in the Art of Film Music and current nominee for the SCL’s Award in the “Outstanding Original Score For an Independent Film” category, winner of the Visionary Award in Music by The Women’s International Film & Television Showcase and the Telly Award, and the Vice President of the Alliance for Women Film Composers, Sharon Farber is a celebrated film, TV and concert music composer. A graduate of Berklee College of Music in film scoring and concert composition (dual major), and an alumna of ASCAP’s Film Scoring Workshop, Sharon started her career in LA orchestrating and composing additional music for the late, famed composer Shirley Walker, who greatly inspired her. Since then, Sharon has been working with networks and cable broadcasters like NBC, CBS, Showtime, Lifetime and the WB as well as writing music for feature films and the concert stage. Her film music has been released commercially and performed live in concert.Sharon’s latest orchestral score for the film Brainwashed: Sex-Camera-Power which premiered at Sundance and Berlin film festivals, was released commercially and earned her a nomination for the SCL award.Sharon was one of nine composers featured at Lincoln Center last year at the historical “Women Warriors” concert, curated by Maestra Amy Anderson. She was also one of the few composers featured in the concert event celebrating female compos'''
