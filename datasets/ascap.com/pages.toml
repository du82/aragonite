["https://ascap.com/about-us/why-join-ascap-general"]
title = "Join ASCAP for Free | ASCAP, PRO, performing rights organization, songwriting royalties, how do i make money as a songwriter, composing, what makes ASCAP better,"
description = "We’re the only American performing rights organization (PRO) founded and governed by our music creator and publisher members. Our main job is to get you paid when your music is played in businesses around the United States. And as the only not-for-profit PRO in the US, ASCAP is the only one that pays you first. Thinking about joining a PRO? Here’s why choosing ASCAP is a great decision."
full_description = '''<div class="no-js"> This page requires Javascript to be enabled. Please enable javascript in your browser preferences. </div> Join ASCAP for Free Today! If you're a songwriter, composer or music publisher, you belong at ASCAP. We're ASCAP – the American Society of Composers, Authors and Publishers. We are the only performing rights organization (PRO) in America operating on a not-for-profit basis, and the only one that puts creators first.We pay you royalties when your music is played publicly by the businesses we license. And that’s just one way we can help you sustain a music career. When you become an ASCAP member, you get members-only benefits, networking opportunities, educational workshops and more.ASCAP is FREE to join for writers, or if you're joining as a writer and publisher at the same time. Here’s why joining the ASCAP family is a great decision: We get you paid when your music is played ASCAP’s main job is to get you paid public performance royalties when your music is played in businesses around the US. And we’re really good at what we do! In 2023, ASCAP reported record-high financial results of $1.737 billion in revenues and $1.592 billion available in royalty distribution monies to its members. Read about how we pay We put music creators first As America's only PRO operating on a not-for-profit basis, we pay our music-making members all of the music licensing revenue we take in, minus our operating expenses (among the lowest in the industry). Our governing documents require us to pay music creators first – a claim that only ASCAP can make.Pictured: ASCAP member Dua Lipa We’re led by music creators like you ASCAP is the only PRO in the US founded and governed by songwriters, composers and music publishers. Every decision about how we operate is made by music creators like you – not broadcasters, corporations and investors, like our competitors.Pictured: ASCAP President & Chairman of the Board Paul Williams, the Oscar, Grammy and Golden Globe-winning, Hall of Fame songwriter of "The Rainbow Connection," "Evergreen," "We've Only Just Begun" Meet the ASCAP Board We represent the world’s top music creators ASCAP is home to more than one million songwriters, composers and music publishers. That includes the most respected music creators in every genre, from Beyoncé to Kelsea Ballerini, Marc Anthony to Hans Zimmer, Cardi B to Philip Glass.Pictured: ASCAP member Cardi B We help creators navigate evolving technology Artificial intelligence is raising both exciting new possibilities and real concerns for music creators. ASCAP has protected the value and the dignity of our members’ music for more than a century of technological disruption, and we’ll continue to do so as AI evolves.Pictured: ASCAP CEO Beth Matthews at the ASCAP AI Symposium Read about ASCAP & AI We educate ASCAP is dedicated to supporting your music creator journey. Want to sharpen your skills or understand the music biz better? Visit the ASCAP Learning Center, join an ASCAP workshop, or take part in our members-only ASCAP Experience conference. ASCAP Experience We advocate ASCAP is on the frontlines of the fight to protect the rights of music creators everywhere. That's what we mean by "creator first, future forward." We will always put the rights of music creators first, just like we have since 1914.Pictured: ASCAP songwriters Muni Long and Mozella outside the US Capitol Building during our annual ASCAP Walk the Halls event #StandWithSongwriters We innovate ASCAP offers the most advanced data processing systems of any PRO, to ensure that you get paid fairly and accurately. Our ASCAP Lab explores how new technologies and new business approaches can drive value for our members and the businesses that use their music. Explore the future of music Joining ASCAP is free ASCAP is totally free to join for writers, and for anyone joining as a writer and publisher at the same time. We can't wait to welcome you to the family! Join now for free We support the whole you Our ASCAP Wellness Program is designed to help music creators nourish their body, mind and spirit so they can be their creative best. Be well We listen Our dedicated Global Member Services team is available to answer questions about your ASCAP account from 9am-6pm ET, Monday – Friday. Hit us up Joining ASCAP FAQs Get answers Top 5 Reasons to Join ASCAP as a Writer and a Publisher Read 'em all When I finally got my certificate in 1955, I said ‘Man, I’m in ASCAP!’ I was happy because so were Duke Ellington and all these great people. — Quincy Jones Ready to be an ASCAP member? Join now Únase a ASCAP'''
