full_description = '''<div class="no-js"> This page requires Javascript to be enabled. Please enable javascript in your browser preferences. </div> Join the ASCAP team. Help us shape the future of music. The music industry is changing. Be a part of the change. View ASCAP job openings I am able to develop innovative solutions for the dynamic issues facing the music industry today alongside some of the most accomplished and driven colleagues I could ask for. Music has always been an integral part of my life, as it has served as the backdrop to some of my most cherished moments. Supporting the passion and dedication of our music creator community provides me with a uniquely satisfying sense of professional fulfillment. — Jason Wallace, Vice President, Business Development Where will you fit in? Whether they’re meeting with songwriters, licensing new businesses or analyzing performance data, our employees play a valuable role in supporting the music community. Sound ideal? Then we might have a job for you. See ASCAP job openings ASCAP employee benefits Aside from being an awesome place to work, ASCAP offers generous benefits options, flexible enough to fit your lifestyle. Medical, dental and vision coverage Life insurance, long term disability, auto and home insurance Up to 3% 401(k) match, retirement savings plan, bonus program 20/25 days off, parental/family leave, summer Friday hours Onsite/offsite concerts, employee social hours Gym and yoga discounts, onsite wellness programs The below link leads to the machine readable files that are made available in response to the federal Transparency in Coverage Rule and includes negotiated service rates and out-of-network allowed amounts between health plans and healthcare providers. The machine-readable files are formatted to allow researchers, regulators and application developers to more easily access and analyze data. https://www.cigna.com/legal/compliance/machine-readable-files ASCAP Gives Back: ASCAP's Sandra Villa & her daughter Dominique drop off the toys we collected at the Alexandria House ASCAP Employees Give Back ASCAP Employees Give Back ASCAP Employees Give Back Every day, ASCAP's licensing team connects ASCAP members with the businesses that use their music. Watch this video to find out how a passion for music underlies everything our licensing employees do. ASCAP for all. ASCAP is an Equal Opportunity Employer. We hire without regard to race, national origin, sex, age, marital status, sexual orientation, disability, handicap, color, religion, veteran status or any other basis prohibited by federal, state or local laws. If you need help or accommodations in completing an ASCAP job application, just let us know. View ASCAP job openings Visit our LinkedIn page'''
