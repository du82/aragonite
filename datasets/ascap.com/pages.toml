["https://ascap.com/about-us"]
title = "About ASCAP"
full_description = '''<div class="no-js"> This page requires Javascript to be enabled. Please enable javascript in your browser preferences. </div> We create music. ASCAP is a membership association of more than one million songwriters, composers and music publishers. We uphold the value of our members’ music, and help them thrive alongside the businesses that use their music every day. Our members ASCAP is home to more than one million music creator members across all genres - the greatest names in music, and thousands more in the early stages of their careers. We are the only PRO in the US founded and governed by our members. Join the family (it's free!) The ASCAP payment system We license over 20 million ASCAP songs and scores to the businesses that play them publicly, then send the money to our members as royalties. We use cutting-edge technology to process over one trillion performances every year - more than any PRO in the world. Read more ASCAP leadership Get to know the writers and publishers on the ASCAP Board of Directors who are helping to build a stronger future for music creators. Meet the ASCAP Board ASCAP advocacy ASCAP is committed to protecting the rights of our members. We work to elevate the voice of the music creator, build relationships with our allies in Congress and foster thoughtful policy-making for the benefit of creators, business and consumers alike. Read more The ASCAP story ASCAP was the first PRO in the US, founded in 1914. As the music business has evolved, we’ve evolved right along with it. But we remain committed to protecting the livelihoods of songwriters, composers and publishers that call ASCAP home. Explore our history The ASCAP team ASCAP employees are proud to be part of a community of music creators and supporters. Collectively, we are experts in the music and media businesses, technology, licensing and copyright. Individually, we are music fans, and passionate about helping those that create music. Get to know us Whatever your style, we have your back. Concert Music Country Film & TV Jazz Latin Musical Theatre Pop/Rock Rhythm & Soul Governing documents The documents that govern ASCAP and our relationship with our membership and licensees View ASCAP Annual Report View ASCAP press room Browse our press release archive, find ASCAP logos and more. Read more Have a question? Drop us a line. (We're music people. We're good at listening.) Contact us'''
