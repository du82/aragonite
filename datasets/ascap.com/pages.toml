["https://ascap.com/news-events/articles/2020/05/resources-to-fight-for-change"]
title = "Resources to Fight for Change | ASCAP.com | #StopAsianHate, Black Lives Matter, Social Justice, anti-racism"
description = "ASCAP is proud to be a diverse family of music creators. But we know that inclusivity alone cannot solve the problems of institutional racism, bigotry and hates crimes that leave us filled with pain, frustration and anger. We don’t have all the answers, but as an organization, we wanted to amplify some of the many voices that need to be heard, and stand alongside all those working to fight these systemic injustices. Here are some resources and thought leaders that we have found impactful. We will update this page as we continue this dialogue, working together as a community to learn, grow and combat racism."
full_description = '''<div class="no-js"> This page requires Javascript to be enabled. Please enable javascript in your browser preferences. </div> Resources to Fight for Change ASCAP is a diverse family of music creators. We represent many voices, but we are united in our mission to make the world a better place with our music. As we continue to face institutional racism, bigotry and hate crimes, so many of us are filled with pain, frustration and anger. These challenging moments offer an opportunity for all of us to come together and take action to fight for change and create a lasting, much-needed transformation in how we treat each other. We don’t have all the answers, and there is much to learn. But as an organization, ASCAP wanted to amplify some of the many voices that need to be heard and stand alongside all those working to fight these systemic injustices. Here are some resources and thought leaders that we have found impactful. We will update this page as we continue this dialogue, working together as a community to learn, grow and raise our voices to combat racism. TAKE ACTION. Sign a petition, reach out to your legislators and learn how to protest safely. #BlackLivesMatter Healing in Action - a toolkit for Healing Justice and Direction Action (Black Lives Matter) How to More Safely Protest in a Pandemic by Eliza Barclay (Vox.com) How to Support the Struggle Against Police Brutality by Claire Lampen (The Cut) Know Your Rights While Protesting Police Brutality (ACLU) #8CANTWAIT - Take Action in Your City Right Now (Campaign Zero) #StopAsianHate Report Instances of Anti-Asian Assault and Crimes (StopAAPIHate.org) Take Bystander Intervention Training (Hollaback!) SUPPORT & ENGAGE. Connect with and learn more about these organizations doing vital work combating racism and championing social justice. #BlackLivesMatter Black Visions Collective (BLVC) believes in a future where all Black people have autonomy, safety is community-led, and we are in right relationship within our ecosystems. Campaign Zero analyzes policing practices across the country, conducts research to identify effective solutions to end police violence, offers technical assistance to organizers leading police accountability campaigns and develops model legislation and advocacy to end police violence nationwide. Center for Policing Equity simultaneously aids police departments to realize their own equity goals as well as advance the scientific understanding of issues of equity within organizations and policing. Color of Change designs campaigns powerful enough to end practices that unfairly hold Black people back, and champion solutions that move us all forward. Equal Justice Initiative is committed to ending mass incarceration and excessive punishment in the United States, to challenging racial and economic injustice, and to protecting basic human rights for the most vulnerable people in American society. Know Your Rights Camp’s mission is to advance the liberation and well-being of Black and Brown communities through education, self-empowerment, mass-mobilization and the creation of new systems that elevate the next generation of change leaders. My Brother’s Keeper - President Obama launched My Brother’s Keeper in February 2014 to address persistent opportunity gaps facing boys and young men of color and to ensure all youth can reach their full potential. In 2015 the My Brother’s Keeper Alliance (MBK Alliance) was launched, to scale and sustain this mission. Within the Obama Foundation, MBK Alliance focuses on building safe and supportive communities for boys and young men of color where they feel valued and have clear pathways to opportunity. NAACP Legal Defense Fund is America’s premier legal organization fighting for racial justice. Through litigation, advocacy, and public education, LDF seeks structural changes to expand democracy, eliminate disparities, and achieve racial justice in a society that fulfills the promise of equality for all Americans. LDF also defends the gains and protections won over the past 75 years of civil rights struggle and works to improve the quality and diversity of judicial and executive appointments. National Association for the Advancement of Colored People (NAACP)'s mission is to secure the political, educational, social and economic equality of rights in order to eliminate race-based discrimination and ensure the health and well-being of all persons. National Black Justice Coalition (NBJC) is a civil rights organization dedicated to the empowerment of Black lesbian, gay, bisexual, transgender, queer and same gender loving (LGBTQ/SGL) people, including people living with HIV/AIDS. NBJC’s mission is to end racism, homophobia, and LGBTQ/SGL bias and stigma. As America’s leading national Black LGBTQ/SGL civil rights organization focused on federal public policy, NBJC has accepted the charge to lead Black families in strengthening the bonds and bridging the gaps between the movements for racial justice and LGBTQ/SGL equality. National Urban League is a historic civil rights and urban advocacy organization with 90 affiliates serving 300 communities, providing direct services that impact and improve the lives of more than two million people nationwide. Southern Poverty Law Center is dedicated to fighting hate and bigotry and to seeking justice for the most vulnerable members of our society. Using litigation, education, and other forms of advocacy, the SPLC works toward the day when the ideals of equal justice and equal opportunity will be a reality. The Leadership Conference on Civil & Human Rights is a coalition charged by its diverse membership of more than 200 national organizations to promote and protect the civil and human rights of all persons in the United States. Through advocacy and outreach to targeted constituencies, The Leadership Conference works toward the goal of a more open and just society – an America as good as its ideals. #StopAsianHate Act To Change is a national nonprofit organization working to address bullying, including in the Asian American and Pacific Islander community. Asian Americans Advancing Justice is the nation’s first legal and civil rights organization serving the low-income Asian Pacific American communities. The organization focuses on housing rights, immigration and immigrants’ rights, labor and employment issues, student advocacy, civil rights and hate violence, national security and criminal justice reform. Asian American Collective is a group, founded by and for Asian-Americans in the music industry, that aims to represent the full breadth of the creative Asian-American experience through mentorship programming, political and educational output and profiling legendary Asian-American creative personalities. Hate Is A Virus is a nonprofit community of mobilizers and amplifiers that exists to dismantle racism and hate against the AAPI and BIPOC communities. National Council of Asian Pacific Americans (NCAPA) represents the interests of the greater Asian American (AA) and Native Hawaiian Pacific Islander (NHPI) communities, providing a national voice for AA and NHPI issues. Southeast Asian Community Alliance is an organization that works to build an empowered Southeast Asian community through leadership development, education, advocacy and community organizing. Stop AAPI Hate is a community-created reporting center that tracks and responds to incidents of hate, violence, harassment, discrimination, shunning and child bullying against Asian Americans and Pacific Islanders (AAPI) in the United States. More Resources American Civil Liberties Union (ACLU)’s mission is to realize this promise of the United States Constitution for all and expand the reach of its guarantees. Annuity.org has put together a comprehensive article about financial literacy in the Black community, and how to close the racial wealth gap. Education Loan Finance offers a list of scholarships and educational loan resources for Black & African-American Students. Witness helps people use video and technology to protect and defend human rights. LEARN. Educate yourself and others about the roots of racism in America and how to be an antiracist. #BlackLivesMatter IG: 10 Steps to Non-Optical Allyship (@mireillecharper) 11 Things To Do Besides Say ‘This Has To Stop’ In The Wake Of Police Brutality by Brittany Wong (HuffPost) 1619 Project: An ongoing interactive initiative about how slavery has transformed America (NY Times Magazine) Anguish & Action (Obama Foundation) Anti-racism Resources (Google Doc compiled by Sarah Sophie Flicker & Alyssa Klein) A Detailed List of Anti-Racism Resources by Katie Couric (Medium) An Antiracist Reading List by Ibram X. Kendi (NY Times) Coretta Scott King Book Award Winners - given to outstanding African American authors and illustrators of books for children and young adults that demonstrate an appreciation of African American culture and universal human values. (Common Sense Media) First, Listen. Then, Learn: Anti-Racism Resources For White People by Julia Wuench (Forbes) For Our White Friends Desiring to Be Allies by Courtney Ariel (Sojourners) Racism 101 booklist by Nicole Zhou Several Antiracist Books Are Selling Out. Here's What Else Black Booksellers and Publishers Say You Should Read by Suyin Haynes (Time) Solutions (Campaign Zero) Talking About Race (National Museum of African American History and Culture) Ways You Can Stand in Solidarity with the Black Community (AdHoc) #StopAsianHate Asian Americans Are Calling on Allies in Response to a Wave of Violence(VICE) COVID-19 and Advancing Asian American Recovery(McKinsey & Company) America’s Long History of Scapegoating Its Asian Citizens (National Geographic) 'Join, Support and Donate': Coalition of Minority Americans Come Together to Dismantle Hate(NBC News) MUSIC & SOCIAL JUSTICE. Find out what our allies in the music industry are doing to help. Read the January 6th message to ASCAP employees from CEO Elizabeth Matthews regarding events at the U.S. Capitol. Read the letter from music, entertainment and sports industry leaders in support of SB731 and SB776, landmark police reform legislation in California. #JusticeInPolicing: Read the music and entertainment industry's letter to Congress in support of The Justice in Policing Act, legislation that will take bold steps toward more transparency, accountability and fairness for everyone seeking justice. #Mix4Change: DJ MICK's initiative fight police brutality and racial injustice (read about it on Complex) #ShareTheMicNow: Why Black Activists & Celebrities Are Taking Over White Influencers' Instagram Handles (Elle) The Show Must Be Paused Read the music community's letter to New York legislators demanding the repeal of NY statute 50-A, which shields police disciplinary records from public scrutiny Songtrust: Social Change Resources Black Lives Matter Cofounder Patrisse Cullors on Blackout Tuesday and How the Music Community Can Help by Jem Aswad (Variety) IG: Your Favorite Music Exists Because of Black People (by @jenziaburgos) *ASCAP is not responsible for the content or reliability of any linked website, and does not necessarily endorse all views expressed therein.'''
