["http://www.ascap.com/annualreport"]
title = "2024 ASCAP Annual Report"
description = "ASCAP Annual Report 2024"
full_description = '''<div class="no-js"> This page requires Javascript to be enabled. Please enable javascript in your browser preferences. </div> ASCAP Annual Report 2024 Read the PDF version Download now MUSIC. TRUTH. COMMUNITY. Founded and governed by songwriters, composers and music publishers, ASCAP is the only performing rights organization in the US that operates on a not-for-profit basis. And the only one that puts creators first. We are a community of more than one million music creators and publishers, representing the most respected and successful artists across all genres. We collectively thrive by taking take care of our own. We support, advocate, educate, innovate and help creators navigate evolving technology, so they can thrive and continue doing what they do best — creating the world’s greatest music.Pictured: In 2024, SHABOOZEY’s smash hit “A Bar Song (Tipsy)” tied the record for longest-running #1 song in Billboard Hot 100 history. 2024 was the year of CHAPPELL ROAN, with six Grammy noms, multiple Hot 100-charting songs and record-breaking festival crowds. Songwriter & superproducer JACK ANTONOFF was one of the creative forces behind massive hit albums like The Tortured Poets Department and Short N’ Sweet. Celebrating her latest album Radical Optimism, DUA LIPA embarked on her third headlining tour and performed at some of the world’s top festivals in 2024. As the only member-governed PRO in the US that operates on a not-for-profit basis, ASCAP ensures that our members are the sole beneficiaries of our collective growth. -ASCAP President & Chairman Paul Williams YOUR MUSIC'S VALUE: A Message from ASCAP President and Chairman of the Board Paul Williams I am more grateful than ever for what this community gives to the world. As music creators, you use your gifts for good. You dig deep into your unique experiences and mine your souls to create music that connects people with universal truths that celebrate our shared humanity. That is why ASCAP puts you first and supports you every way we can, so you can do your best work and make the world a better place. ASCAP exists not just to get you paid. We are here to connect you with your peers, offer you educational programs and opportunities to develop your craft, technology and tools to manage your music, and resources to support your well-being. With more than one million members, we will continue to thrive because we stand together with a single voice. As music creators, our community is built on a foundation of compassion, connection and a sense of purpose. That is our bedrock, where we always land, where we always begin. We lead when there is a need. For example, in the wake of the recent LA fires, we set up an emergency fund in the amount of $1 million for our LA-based members who have suffered from loss and damage to their homes and studios. As the only member-governed PRO in the US that operates on a not-for-profit basis, ASCAP ensures that our members are the sole beneficiaries of our collective growth. In 2024 your music reached more people and connected in deeply meaningful ways that translated into great success. Of every dollar ASCAP collected in licensing fees, 90 cents went back to you — our members — as royalties. As we usher in a new administration and a new Congress in Washington, DC, ASCAP will always be in your corner – leading the way, celebrating your music, advocating for your rights and making sure your voice is heard. Our commitment to defending the value of your music will never waver. Thank you for being part of the ASCAP family. For songwriters, composers and publishers, ASCAP provides the best return on their performance royalties because they get 90 cents of every dollar we collect. It’s that simple. -ASCAP CEO Beth Matthews RECORD-BREAKING REVENUE: A Message from ASCAP CEO Beth Matthews I am thrilled to announce that ASCAP delivered another year of record-breaking revenues and royalty distributions in 2024 to its music creator members. ASCAP delivered $1.835 billion in revenue in the 2024 calendar year, an increase of $98 million, or 5.7% over 2023 with $1.696 billion available for royalty distributions, up by $104 million, or 6.5%. This is the highest amount in revenue and royalty distributions to creators and music publishers historically reported by ASCAP, fueled by revenue growth and the lowest overall cost allocation overhead rate in the US at 10%. ASCAP delivers 90 cents of every dollar collected back to its members as royalties and does not charge a commission or take a profit. Instead, according to its unique governance and operating principles, it must deduct expenses and then distribute remaining dollars as royalties to its members. ASCAP increased the value and monetization of its members’ music with domestic revenue from US-licensed performances totaling $1.397 billion, an increase of 5.3%, or $71 million, year over year. Revenues from streaming audio, audio-visual and general licensing drove the increase. The strength in domestic revenue led to 5.5% growth in funds available for domestic distributions, which totaled $1.284 billion. Of that total, $53 million was distributed through Songwize, ASCAP’s royalty administration service provided to ASCAP members who directly license their works. Collections for foreign revenue also increased to a total of $438 million, up by $28 million, or 6.8% with $411 million available for royalty distribution, a 9.8% increase of $37 million. In the 10th year of its strategic growth plan, ASCAP has generated a compound annual growth rate (CAGR) for total revenue of 7%; and for total distributions, a CAGR of 8%. While every other US PRO is now private equity-owned, ASCAP is the only one that does not owe payouts to private investors or shareholders, making writer and publisher members the sole beneficiaries of ASCAP’s growth. For songwriters, composers and publishers, ASCAP provides the best return on their performance royalties because they get 90 cents of every dollar we collect. It's that simple. We are the only US PRO that does not take a profit and the only one that can credibly say we put creators first in everything we do. ASCAP represents and aggregates over 20 million copyrights in cost-effective, efficient blanket licenses which include iconic music from Beyoncé, Billy Joel, Cardi B, Chappell Roan, Charli XCX, Chris Stapleton, Dua Lipa, Duke Ellington, esperanza spalding, Garth Brooks, Hans Zimmer, Jay-Z, Jennifer Higdon, Jimi Hendrix, Joni Mitchell, Katy Perry, Lil Baby, Lin-Manuel Miranda, Marc Anthony, Mariah Carey, Michael Giacchino, Neil Young, Olivia Rodrigo, Ornette Coleman, Paul McCartney, Philip Glass, Stevie Wonder, Tania León and Usher among many others. ASCAP continues to be an industry leader not only in revenue growth and legislative advocacy but also in innovation and data technology, with a fully cloud-based infrastructure since 2022. In a new strategic alliance announced with SACEM (Société des Auteurs, Compositeurs et Editeurs de Musique), the two societies are leveraging our investments in state-of-the-art data infrastructure and human expertise to benefit our music creator and publisher members. In 2024, the ASCAP Lab, the organization’s innovation initiative, hosted its fifth ASCAP Lab Challenge. The AI and the Business of Music Challenge saw our team working directly with some of the most promising music tech entrepreneurs and early-stage startups in an effort to shape how artificial intelligence tools can benefit music creators. When the US Copyright Office (USCO) released Part Two of its report on the legal and policy issues related to copyright and AI, we were pleased to see them affirm ASCAP’s core principle of “Human Creators First.” ASCAP submitted comprehensive responses to the office to make sure music creators’ voices were heard throughout this process. We will continue to lead the charge to help our members navigate a rapidly changing technology landscape, just as we have for over a century. LEGENDS ASCAP is home to the world’s most beloved and legendary songwriters and composers. In 2024, ASCAP signed new agreements with musical giants such as Jay-Z, Katy Perry, Timbaland, Neil Young, Hans Zimmer, Max Martin, Tom Petty, Jimi Hendrix and more. We represent and aggregate over 20 million copyrights in cost-effective, efficient blanket licenses which include iconic music from such artists as Mary J. Blige, Victoria Monét, Billy Joel, Cardi B, Dua Lipa, Marc Anthony, Daddy Yankee, Kelly Clarkson, Garth Brooks, Lil Baby, Lin-Manuel Miranda, Mariah Carey, Justin Bieber, Missy Elliott, Paul McCartney, Stevie Wonder, Usher, Darius Rucker, Joni Mitchell, Kelsea Ballerini, Notorious B.I.G. and Johnny Cash among many others. GROWTH Our membership grew by more than 80,000 in 2024, rocketing past the one million mark. ASCAP’s newest family members include musical luminaries, past and present, like 3x Grammy Producer of the Year Jack Antonoff, country music trailblazer Kacey Musgraves, hard rock legends Def Leppard, pop star Tate McRae, acclaimed film/TV composer Cliff Martinez, rising rap phenom Sexyy Red, superstar songwriter Justin Tranter, global R&B hitmaker Tyla, rock icon Jack White of The White Stripes, Dear Evan Hansen star Ben Platt and pop-punk-hip-hop dynamo Yungblud.Pictured: JACK WHITE delighted the music world in 2024 with the surprise release of his sixth studio album No Name, followed by a slate of sold-out tour dates. New member TYLA New members DEF LEPPARD New member TATE McRAE New member JUSTIN TRANTER New member YUNGBLUD New member BEN PLATT SUCCESS Our global family wrote the #1 songs on 41 separate Billboard Year-End charts. They tied the record for longest-running #1 song in Billboard Hot 100 history (Shaboozey’s “A Bar Song (Tipsy)”), broke the Spotify record for highest single-day streams (“Fortnight,” co-written by Jack Antonoff), and scored the biggest animated box office hit of all time (Inside Out 2, scored by Andrea Datzman). With her staggering 11 nominations for the 67th annual Grammys, Beyoncé became the most-nominated person in Grammy history, with 99 total. From Pasek & Paul’s EGOT to Hilary Hahn’s Avery Fisher Prize, Ashley Gorley’s unprecedented 80th #1 country song to the Kennedy Center Honors earned by The Grateful Dead, Bonnie Raitt and Arturo Sandoval, ASCAP members proved over and over in 2024 that their music is the most popular, and the most respected, in the world.Pictured: Beyoncé ANDREA DATZMAN Scored Inside Out 2, highest-grossing animated film of all time BENJ PASEK & JUSTIN PAUL Fastest achievement of EGOT status BONNIE RAITT Kennedy Center Honoree SUPPORT The ASCAP community is built on compassion, connection and a shared sense of purpose. ASCAP WELLNESS PROGRAM: ASCAP wants you to be your creative best. That’s why the ASCAP Wellness Program, celebrating its 6th year, offers a variety of tools — from special access to (and discounts on) wellness services, to creator-focused advice — all geared towards helping creators stay on top of their wellness routines.ASCAP SONG CAMPS: Our ASCAP Song Camps brought together music creators across genres in Nashville, LA, New York and Atlanta to forge connections, gain inspiration through creativity and collaborate on the next big hits of tomorrow.EDUCATIONAL EVENTS: Panels, talkbacks and events for our community united songwriters, composers and industry experts to share their perspectives on the creative process, advocacy, the state of the music industry and more.Pictured: A panel discussion at the 2024 Membership Meeting featured (l-r) Variety’s Jem Aswad, composer Carter Burwell and songwriters Sam Hollander, Michael R. Jackson, Madison Love & Gregg Wattenberg ADVOCACY As we have done for more than a century, ASCAP continues to work with bipartisan allies on Capitol Hill to build consensus and workable solutions to ensure a stronger future for music creators.ASCAP advocacy is more important than ever as artificial intelligence continues to evolve. As part of our mission to ensure that American music creators can thrive alongside the businesses that use their work, ASCAP is committed to protecting the value of music without limiting the innovative opportunities AI presents to songwriters, composers and music publishers.We were the first PRO to establish AI principles in 2023 and are pleased that ASCAP is one of the few organizations whose comments submitted on behalf of our members were cited in the text of the recent US Copyright Office report on the legal and policy issues related to copyright and AI. INNOVATION ASCAP continues to be at the forefront of utilizing cutting edge technology to best serve its membership. With new tech advances and updates to US tech law coming hard and fast, our commitment to responsibly and intelligently managing the demands of the new technological frontier remains resolute.• Thousands of ASCAP members enjoy the ease of conducting their essential ASCAP business from anywhere with the ASCAP MOBILE APP, with new updates and exciting new features on the horizon. The app is an easy way to register your music, optimize your metadata, view your royalties and more.• ASCAP’S STRATEGIC ALLIANCE WITH SACEM, our sister society in France, will help us navigate the challenges and opportunities of AI together through a joint AI task force, as well as explore new platforms for furthering our members’ success on the global stage.• THE ASCAP LAB’S AI AND THE BUSINESS OF MUSIC CHALLENGE brought together ASCAP’s senior strategy, operations and legal experts; key ASCAP writer, composer and publisher members; and five of the most promising music tech entrepreneurs and early-stage startups in an effort to shape how AI tools can benefit music creators. TRANSPARENCY As the music rights landscape becomes ever more complex, ASCAP has kept transparency at the center of how we operate.We are the only US PRO to make our distribution rules and annual financials public, and we offer a comprehensive repertory so our licensees know exactly what they’re getting for their money.We are also innovating new tools to give our members even more insights into their royalty and performance data. We’ve long offered the industry’s most detailed royalty statements. With Data Health Check, a signature feature of the ASCAP mobile app, members can scan their catalog for missing metadata that can help them get paid. Publicly available member royalty distribution rules Annual report on financials New tools to analyze royalty and performance data Comprehensive, publicly available searchable repertory search Industry’s most detailed quarterly royalty statements Data Health Check on the ASCAP mobile app COMMUNITY Our members bring the world together with their music. In that same spirit, ASCAP supports programs throughout the year aimed at fostering community and encouraging our employees to make a difference in their own communities.ASCAP employees around the country participated in our annual ASCAP N'''
year_published = 2025
clearnet = "http://www.ascap.com/annualreport"
tags = ["$1.696", "$1.835", "$104", "'event',", "'leadership',", "2024,", "5.7%", "6.5%.", "accolades", "account"]
