title = "Help Center"
full_description = '''<div class="no-js"> This page requires Javascript to be enabled. Please enable javascript in your browser preferences. </div> function toggleArrowGAFAQ(element, val) { var span = element.className; if (span.toLowerCase().indexOf("show-answer") >= 0) { ga('send', 'event', 'FAQ', 'collapse question', val.replace(",", "").replace("'","")); } else { ga('send', 'event', 'FAQ', 'expand question', val.replace(",", "").replace("'", "")); } } Help Center Search Advocacy ASCAP en Español ASCAP Licensing General Music Business 101 My ASCAP Membership Registering Your Music Royalties and Payment Frequently asked questions Although the following information is specifically designed to assist ASCAP members, anyone contemplating joining our family of professional music creators and becoming an ASCAP member may also find it helpful.Haga clic aquí para ver las preguntas frecuentes en español. Joining ASCAP Member Access Online Work Registration My Royalties Streaming Royalties Mobile App Songview ASCAP OnStage Copyright General Licensing Radio Licensing Television Licensing Web & Mobile Licensing Deceased Members Where can I obtain an ASCAP application? Applications for ASCAP writer and publisher memberships can be obtained on our website: www.ascap.com/join Am I eligible to join ASCAP? You can join ASCAP as a writer if you've written or co-written music or lyrics for at least one musical work that is available to the public. It could be a song that you perform live or on a CD that you sell at your concerts, a song on a streaming service or in a YouTube video, a digital download or sheet music - if it's out there, you're eligible to join. You can join ASCAP as a publisher if you (or your business, partnership, corporation, etc.) are actively engaged in the music publishing business, and assume the financial risk involved in publishing music. You are also eligible for a publisher membership if you are a writer and have not assigned your publishing rights to someone else. A publisher membership allows you to collect the publisher share of a song's performance royalties. What does it cost to join ASCAP? Joining ASCAP is free for all new ASCAP writer members. If you join as both a writer and a publisher at the same time, we’ll waive both application fees. If you are only joining as a publisher, there is a one-time, non-refundable $50 application processing fee. I don't have a computer. Can you mail me an ASCAP application? ASCAP applications are processed online. The ASCAP website can be accessed at a public library. Can I become a writer member of ASCAP if I am already affiliated with another society as a writer? You can only belong to one society at a time as a writer for licensing public performances in the United States; however, you can be a publisher at multiple societies. You can transfer as a writer to ASCAP from your current society, but you will need to contact your current society to obtain the appropriate information to make the switch. I am a member of a band/group. Can my group join ASCAP? Each member of the group must complete a separate writer application and each member of the group must meet the eligibility criteria. It is recommended that each member apply for a separate publisher membership; however, only one application needs to be submitted if the group chooses to join as a collective publisher member. If this is the case, the publisher membership must be structured as a partnership, corporation or LLC. Why is ASCAP suspending the $50 application fee? The last couple years have been tough for music creators. Suspending the fee temporarily will help aspiring music creators launch their careers and start making money faster. ASCAP is here to support creators at every stage of their life in music. Does ASCAP’s suspension of the application fee apply to all new members? We are waiving the fee for all new ASCAP writer members. If you join as both a writer and a publisher at the same time, we’ll waive both application fees. Why aren’t you suspending the fee for members joining just as publishers? Our goal in suspending the application fee is to eliminate one of the hurdles for new songwriters and composers to start making money from their music. The majority of our new writer members don’t already have a publishing entity, so now they can set themselves up to earn 100% of their ASCAP royalties, at no cost to them. It’s a great move to join ASCAP as a publisher, even with the $50 application fee for publishers who aren’t joining as writers at the same time. When ASCAP distributes royalties for a performance of your music, 50% goes to the writer(s), and 50% to the publisher(s). If you want to collect your publisher’s share, you will need to have a publishing company with ASCAP. Click here for more reasons why an ASCAP writer should join as a publisher, too. How long will the application fee be suspended? We are suspending application fees temporarily, to help out new music creators who struggled to start their careers during the pandemic. Next year, we’ll evaluate how the change has impacted ASCAP and our membership, and decide whether to continue. I joined ASCAP before you suspended the fee. Can I get a refund? We are only waiving fees for new members who join on February 13, 2023 or later. Why does ASCAP charge an application fee at all? We charge a one-time application fee for new members who choose to join only as a publisher. The one-time fees help to offset some of the administrative costs associated with electing new members. As of February 13, 2023, we are temporarily suspending application fees for new writer members. If you join as both a writer and a publisher at the same time, we’ll waive both fees. If I join ASCAP for free as a writer and later want to join as a publisher, do I still have to pay the processing fee? For the time being, if you join as both a writer and a publisher at the same time, we will waive the application fee for both memberships. If you join only as a writer now, you can do so for free. But you will need to pay a $50 application fee if you decide to join as a publisher later. If I’m already an ASCAP writer member, can I join just as a publisher for free? We are only waiving the fee for new ASCAP publisher memberships if they are connected to a new writer joining at the same time. The goal here is to encourage new music creators for whom an application fee might be a hurdle to start making money from their music. It is still a great move to join ASCAP as a publisher. When we distribute royalties for a performance of your music, 50% goes to the writer(s), and 50% to the publisher(s). If you want to collect your publisher’s share, you will need to set up a publishing company with ASCAP. Click here for more reasons why an ASCAP writer should join as a publisher, too. If I pay $50 to apply as an ASCAP publisher, but later change my mind, can I get my money back? The application processing fee is non-refundable. If I resign, do I get my money back? The application processing fee is non-refundable. Why is the fee non-refundable? The fee is associated with the costs of processing the membership application and therefore cannot be returned. I don't have a credit card to pay the application processing fee for my publisher membership. Can I submit another form of payment? If you don't have a US-issued Visa, MasterCard or American Express credit or debit card, you must first supply ASCAP with another form of payment using the ASCAP Processing Fee Form. Upon receipt and processing of your payment you will be supplied with instructions to complete your application. The fee for processing a check, money order or foreign credit card payment is $50. Keep in mind this is in addition to the $50 publisher application fee. I don’t have a US tax ID. Why do I have to submit my credit card info if ASCAP doesn’t charge an application fee? Our application process involves verifying your identity through your tax ID. Since you don’t have a US tax ID to check, we need to use your credit card info instead. Don’t worry, we won’t charge your card! I do not have a valid US Social Security Number or I am a not a US citizen. Can I still join ASCAP? You may join ASCAP if you do not have a valid US Social Security Number or are not a US citizen; however, additional income reporting documentation must be provided with your application. Please go to the IRS website (irs.gov) to obtain a W8-BEN form. When you have completed the application please mail the original completed W8-BEN with your application number written on the top to: ASCAP Attn: Applications 7920 West Sunset Blvd. Third Floor Los Angeles, CA 90046 I want to join ASCAP as a publisher. Can you check if the publisher name I want to use is available? The availability of the publisher name will be checked automatically by the ASCAP system prior to submission of your application. If the name is not available you will not be able to submit the application until you choose another available name. Do I need to submit any music with the application? No. How long does it take for me to hear back from ASCAP once I've submitted my application? You will receive information from ASCAP regarding your online application immediately upon submission. If additional documentation is required to process your application please provide the information within 90 business days of submission. Upon receipt of this documentation your application will be processed within 10 business days. I submitted my application several days ago but can't find my Application ID. Can you check the status? We can check the status of your application without an Application ID; however, we will require the Social Security Number or TIN that you provided on your application to confirm your identity. Why was my application declined? If you completed the online application, the reason for ineligibility was sent via e-mail to the e-mail address provided in your application. I received the e-mail that confirms that I've been elected as an ASCAP member. How do I register my music with ASCAP? Work registrations are essential to the proper distribution of performance royalties and should be submitted to ASCAP once a musical work has been fully created. After you receive confirmation of your election to ASCAP membership, please allow five (5) business days before you attempt to register your works with ASCAP for the first time. Once this time has elapsed, ASCAP members should register their works through the Online Work Registration system. To start using ASCAP's Online Work Registration system, sign in to your Member Access account and click "Register a Work" under the "Works" menu on the left navigation bar. You can also register your music with the ASCAP mobile app. Use Quick Registration to send us the basic writer, publisher and royalty split breakdown for your music, or go with Guided Registration for a more comprehensive walkthrough, where you’ll learn about all the data ASCAP needs to track performances of your music, and pay you accurately. Either way, the ASCAP mobile app makes it easy with an intuitive, step-by-step approach. What is Member Access? Member Access is ASCAP's secure online web portal that provides you with access to your ASCAP information. Once you activate your Member Access account, you will have the ability to update personal details (e.g., address, bank account information, etc.), view and print the entitled party and share details of your Works, view and download ASCAP performance statements, register your works and electronically create and track service requests to ASCAP. Important programs like ASCAP OnStage and the ASCAP Plus Awards are only available via Member Access, so activation of your account is highly recommended. Activate your Member Access account at www.ascap.com/members. Can I register my music for copyright protection or get a bar code for my CD through ASCAP? ASCAP does not register music for the purpose of copyright protection; this is the responsibility of the writer(s) and publisher(s) of any given work. You can register your music for copyright protection through the Library of Congress which can be reached at 202-707-3000 or on the web at www.loc.gov. For information on bar codes, please visit www.discmakers.com. I received an e-mail that confirms I've been elected as an ASCAP member, but my song was released before I became a member. Will I still receive public performance royalties? Whether or not you receive royalties for performances of your work(s) that occurred before you became an ASCAP member will depend upon when the performance(s) of the work(s) occurred. As a newly elected writer member, you can receive royalties for surveyed performances that took place in the performance period covered by the distribution quarter in which you are elected. For writers, there is a time lag of approximately seven (7) to eight (8) months between performances and royalty processing. As in the case of writers, a newly elected publisher member can receive royalties for surveyed performances that took place in the performance period covered in the distribution quarter in which the publisher is elected. For publishers, there is a time lag of approximately six (6) months between performance and royalty processing. Please note that ASCAP ONLY distributes public performance royalties, not royalties associated with record sales. I completed my application online almost twenty (20) days ago. I haven't heard back from ASCAP. What should I do? If you completed an online application, you should have received an e-mail from ASCAP within fifteen (15) days of submitting your application regardless of whether your election to ASCAP membership was successful. Please check your spam filter on your e-mail account. If you still cannot locate the e-mail, please contact Member Services at 800-95-ASCAP. I remember receiving the e-mail that confirmed my election to ASCAP membership, but I can't find it now. How can I get my ASCAP Member ID? If you were elected to ASCAP membership, Member Services can confirm your Member ID; however, you will be asked to verify your identity by providing your Social Security Number or TIN. I received the e-mail that confirms that I've been elected as a member. Can I make an appointment to speak with an ASCAP representative? Before speaking with an ASCAP representative, we recommend you review the ASCAP Help Center and public calendar on our website. These links take you to FAQs and support opportunities that can help you further your career. If you still wish to speak with someone, please contact ASCAP at 800-95-ASCAP or at one of the local Membership offices listed on our website. I need the phone number to a company in the music business and I believe ASCAP can provide it. Can I call you for the number? Unfortunately, we cannot disclose phone numbers for specific companies unless they have agreed to allow us to do so. The following companies have agreed to a'''
year_published = 2025
clearnet = "https://ascap.com/help"
