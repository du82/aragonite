full_description = '''<div class="no-js"> This page requires Javascript to be enabled. Please enable javascript in your browser preferences. </div> The greatest music you've ever seen. Join ASCAP today. It's now FREE to join our global family of professional music creators. Join now ASCAP Composer Spotlight @ Sundance Film Festival 2025 Get to know the composers behind this year's Sundance selections. Know the score ASCAP @ Sundance 2025 Music is essential to the art of filmmaking. The Sundance ASCAP Music Café honors the love affair between music and film with performances from artists and songwriters you need to know, and conversations with the composers who are powering the Sundance Film Festival 2025 selections. See what's happening The 2024 ASCAP Screen Music Awards On May 9, 2024, ASCAP screen music royalty gathered on the sylvan terraces of LA’s Houdini Estate to honor the composers of the past year’s biggest films, TV programs and video games. Read more Happy 100th Birthday, Henry Mancini The great film/TV composer Henry Mancini would have turned 100 on April 16, 2024. As a centennial tribute to one of the all-time greats of screen music, read our comprehensive interview with him from 1978. Read more ASCAP Composer Spotlight @ Sundance Film Festival 2024 Get to know the composers behind this year's Sundance selections. Pictured (l-r): Nainita Desai, Robert Aiki Aubrey Lowe & Cristobal Tapia de Veer Know the score Sundance ASCAP Music Café 2024 Whether it’s enhancing drama, building atmosphere, or underscoring an unforgettable moment, music is essential to the movies. The Sundance ASCAP Music Café honors the love affair between music and film with performances from artists and songwriters you need to know, and conversations with the composers who are powering this year's Sundance Film Festival selections. For our 26th year, we're partnering with Acura, longtime sponsor and official vehicle of the festival. Stop by to discover some great music and find a collaborator for your next project. Lights, camera, music! FULL COVERAGE: 2023 ASCAP Screen Music Awards Michael Abels, Jeff Cardoni, Amanda Jones, Bear McCreary, Kim Neundorf & Cristobal Tapia de Veer honored with ASCAP Composers’ Choice Awards, determined by their ASCAP composer peers Read more ASCAP Screen Time Conversations with the greatest composers in film, TV, video games and beyond Binge-watch now ASCAP Expands Royalty Premium Payment Plan for Music in Top Streamed Shows on Online Streaming Services Read More How to get paid for music in film, TV & visual media Cue Sheet Corner: If your music is used in a film or TV show, cue sheets are essential to getting paid. Here's everything you need to know about them. Visit Cue Sheet Corner Ad & Promo: Was your music used in a commercial, trailer, infomercial, promo spot or PSA? Here’s how to get your ASCAP royalties. Music in Advertisements Payment System: We process hundreds of billions of performances of ASCAP music each year. So how do we track it all and get you paid? Find out ASCAP Film/TV Music Video Playlist Memorable performances & interviews from some of our scoring heroes. Watch more Icon Right Chevron The folks at ASCAP….have done so much to help me that I can barely even begin to describe it all. I've always relied on their input and guidance. — Bear McCreary Tips. Advice. Inspiration. Find it all at the ASCAP Help Center. Read more Rock out. Cash in. Get paid when you play your music live with ASCAP OnStage. Get started Attending Sundance in support of three unique films from visionary directors was an experience beyond my wildest dreams. I especially appreciated the support and enthusiasm from my friends at ASCAP, who created a place for musicians from around the world to connect with narrative filmmakers in search of their skills. — Bear McCreary Say hello to your neighborhood ASCAP screen music rep. Meet the team ASCAP Film/TV Workshops ASCAP LA Film Scoring Workshop Learn more View all ASCAP workshops''