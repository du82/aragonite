full_description = '''<div class="no-js"> This page requires Javascript to be enabled. Please enable javascript in your browser preferences. </div> ASCAP Legacy Honoring the music that has elevated the ASCAP repertory for generations.Ensuring it will have an impact for generations to come. Your music withstood the test of time. So should your royalties. Find out how estate planning can help your music benefit your successors, long after you wrote it. More info Five ASCAP Legends to Be Inducted into the Songwriters Hall of Fame Class of 2025 to include Michael McDonald & Patrick Simmons (pka The Doobie Brothers), Mike Love, Ashley Gorley & Tony Macaulay Read more Remembering Quincy Jones: Musical Giant For Over Seven Decades As a composer, producer, arranger, instrumentalist, record company executive, magazine publisher, film & television composer and producer, philanthropist, mentor and collaborator extraordinaire, Quincy Jones left a deep imprint on American music and culture over the course of more than seven decades. Read about Q Remembering & Celebrating ASCAP's John Titta ASCAP is mourning the beloved John Titta, EVP and CCO at ASCAP, who passed away after a two-year battle with cancer. “All of us at ASCAP are heartbroken," said ASCAP President & Chairman, songwriter Paul Williams. "John Titta was one of a kind, and truly one of the most beloved music industry executives I have known, with deep ties to songwriters across genres and generations." Read on to learn more about his tremendous life in music and the many lives he touched with his generosity, warmth and creativity. More about John Killer Mike, Joan Baez, Guster, Muna and More Help Celebrate Newport Folk Festival’s 65th Anniversary From an unannounced set by Beck and his band to folk royalty Joan Baez reading her poetry to a hushed audience of thousands to Conan O’Brien’s closing night jam with special guests such as Jack White, Nick Lowe, Nathaniel Rateliff and others, this year’s festival hit all of its marks. And ASCAP songwriters were front and center. Full event coverage Interview with legendary lyricist Alan Bergman In Memoriam: Marilyn Bergman, Oscar-Winning Lyricist & Former ASCAP President Read more ASCAP is a citadel, a fortress of security in very strange and difficult times for songwriters and all persons interested in intellectual property." — Jimmy Webb Happy 100th Birthday, Henry Mancini Read more Frequently asked questions About establishing your ASCAP legacy Read more Together we can build a stronger future for music. #StandWithSongwriters and make your voice heard. Find out how Help us keep the music playing. Celebrate your musical legacy with a gift to The ASCAP Foundation. Your tax-deductible donation will help us nurture the music creators of tomorrow. Find out more ASCAP @ The Library of Congress Explore riches from The ASCAP Foundation Collection in this virtual exhibit, hosted by the Library of Congress. Visit the exhibit The ASCAP story ASCAP was the first PRO in the US, founded in 1914. As the music business has evolved, we’ve evolved right along with it. But we remain committed to protecting the livelihoods of songwriters, composers and publishers that call ASCAP home. Explore our history'''
