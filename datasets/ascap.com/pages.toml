["http://www.ascap.com/onstage"]
title = "ASCAP OnStage"
full_description = '''<div class="no-js"> This page requires Javascript to be enabled. Please enable javascript in your browser preferences. </div> Rock out. Cash in. ASCAP OnStage gets you paid when you play your music live. You can collect royalties when you play your music live at an ASCAP-licensed venue of any size, with ASCAP OnStage. Here’s how it works: STEP 1: Venues pay ASCAP a licensing fee for the right to play any music in our repertory (including yours). STEP 2: You play your music at one of the venues we license. It’s amazing. The crowd goes wild. People are still talking about it today. STEP 3: You send us some basic details about the performance, including your setlist, and you get an OnStage payment with your normal ASCAP distribution. BAM. Want to get in on the OnStage action? Sign up for direct deposit. Before you can submit a setlist, you'll need to select direct deposit as your default payment preference for ASCAP royalties. Log into the Member Access account connected to your ASCAP writer membership. Select “Payment Information” from the “Profile” section of the left side navbar, click on “Add +” and enter your bank information. Log a Setlist Now ASCAP OnStage is available 24/7. Get started by logging into your Member Access account. Let's go! How to Use ASCAP OnStage Here are some helpful tips to get you cashing in whenever you rock out. Read more ASCAP OnStage DeadlinesThe deadline for submitting ASCAP OnStage performances is ongoing, starting from the top of the previous quarter to the current date. Make OnStage a regular part of your post-show routine. Date of Performance OnStage Submission Deadline January 1 to March 31 June 30 April 1 to June 30 September 30 July 1 to September 30 December 31 October 1 to December 31 March 31 (following year) function toggleArrowGAFAQ(element, val) { var span = element.className; if (span.toLowerCase().indexOf("show-answer") >= 0) { ga('send', 'event', 'FAQ', 'collapse question', val.replace(",", "").replace("'","")); } else { ga('send', 'event', 'FAQ', 'expand question', val.replace(",", "").replace("'", "")); } } Read these FAQs for more about ASCAP OnStage ASCAP OnStage What is ASCAP OnStage and how does it work? OnStage allows writer members receiving royalties via direct deposit to notify ASCAP of their live performances via Member Access. This data is processed and a royalty is distributed to the writers and publishers of the songs based upon the license fee paid by the respective venue. ASCAP OnStage is not a platform for reporting classical events, i.e., performances in the Symphonic, Recital and Educational fields. To report a Symphonic, Recital or Educational performance please visit the following link: Performance Notification Do all members of a band need to submit a performance claim? No. Only one writer needs to submit a performance claim via OnStage to ensure all writers and publishers on the title registration receive a royalty. All writers can view submitted performance claims in their Member Access account. When will I receive royalties for performances submitted via OnStage? Each performance claim will be paid during the corresponding domestic performance distribution. If you are unsure when we make our domestic distributions, please view our Distribution Schedule. How do I add works to my setlist that are not currently listed in my ASCAP catalog? You can register any missing works through your Member Access account or the ASCAP mobile app. Confirm that your music has been properly registered by revisiting your catalog in Member Access. It may take up to seven days to process a new registration. When should I submit a performance via OnStage? Is there a deadline? You can submit a claim via OnStage right after you perform live, but there is a deadline:DATE OF PERFORMANCE SUBMISSION DEADLINEJanuary 1 to March 31 June 30April 1 to June 30 September 30July 1 to September 30 December 31October 1 to December 31 March 31 (following year)If you miss the deadline, we will not be able to process your claim. Make OnStage a regular part of your post-show routine! Are all performances eligible for processing by OnStage? ASCAP OnStage is not a platform for reporting classical events, i.e., performances in the Symphonic, Recital and Educational fields. To report a Symphonic, Recital or Educational performance please visit the following link: Performance NotificationASCAP must be able to license the performance or the claim will be declined. Most performances not a part of the Symphonic, Recital or Educational survey are eligible for processing by OnStage, but some are not based upon US copyright law (as described within 17 USC § 110), generally including non-licensable performances such as:• musical theater• teaching activities• religious services• livestock and agricultural exhibits• government-sponsored events• private parties• non-permitted events Can I submit a claim if I am only the publisher of a work? All OnStage claims must be submitted by writers of the performed works. How much will I make for my live performance? The royalty generated by a live performance is based upon the license fee paid by the venue. As venues with larger capacities pay a larger license fee to ASCAP, the royalty generated by these venues will be larger than venues with smaller capacities. Will my ASCAP statement include performances submitted via OnStage? Yes, and specific details of the performance will remain available in Member Access for future reference. Who will receive royalties from my OnStage claim? All ASCAP writers and publishers who are properly listed on the title registration will receive a royalty. I made a mistake on my claim. How can I edit it? A claim can be withdrawn and edited in Member Access as long as it is still within the same Distribution period. I am a foreign affiliate, but license works through ASCAP. How can I participate in OnStage? A claim must be submitted to your respective society per their specific procedures. ASCAP will then correspond with foreign societies regarding eligibility and processing. I "covered" a popular song at my performance. Should I include it in my OnStage claim? Yes, as it ensures ASCAP receives a record of all music performed. Which genres can submit to OnStage? OnStage is not for any specific genre. Any writer members who perform their songs live can submit eligible performance claims through OnStage. However, ASCAP OnStage is not a platform for reporting classical events, i.e., performances in the Symphonic, Recital and Educational fields. To report a Symphonic, Recital or Educational performance please visit the following link: Performance Notification Is ASCAP OnStage the same as ASCAP Plus Awards? ASCAP Plus Awards is not related to ASCAP OnStage. If you are a writer member who performs live, you should submit those performance claims through OnStage.'''
