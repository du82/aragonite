["https://ascap.com/music-creators/artificial-intelligence"]
title = "ASCAP & AI | artificial intelligence, technology, royalties, music, songwriting, composing"
description = "The recent upswing in awareness about artificial intelligence has raised both exciting new possibilities and real concerns for music creators. While sophisticated AI tools are being used by creators, the regulations that will protect their work in the context of AI are still being written. Nobody has all the answers. But ASCAP has protected the value and the dignity of our members’ music for more than a century of technological disruption, and we’ll continue to do so as AI evolves."
full_description = "How ASCAP Is Helping Music Creators Navigate AI “Humans first. That is our position.” -ASCAP CEO Beth Matthews at the 2023 ASCAP AI Symposium The recent upswing in awareness about artificial intelligence has raised both exciting new possibilities and real concerns for music creators. While sophisticated AI tools are being used by creators as aids to composition, marketing and more, the regulations that will protect their work in the context of AI are still being written. Nobody has all the answers, and that uncertainty can feel challenging. But ASCAP has protected the value and the dignity of our members’ music for more than a century of technological disruption, and we’ll continue to do so as AI evolves. We view AI as an opportunity to innovate, and help our songwriter, composer and music publisher members do the same. How do we do that? By engaging in conversation with the music, tech and legal communities, and ensuring that our members have a seat at the table with policymakers. That’s what places us at the forefront of shaping the future of music and AI. Learn more in our AI FAQ below."
