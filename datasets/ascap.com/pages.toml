["https://ascap.com/repertory/about"]
title = "About ASCAP Repertory Search | ASCAP.com, Songview, ASCAP100%, repertory, licensing"
description = "ASCAP Repertory Search (“Repertory Search”) is a searchable database that contains information on musical works in the ASCAP Repertory (as that term is defined in the Compendium of ASCAP Rules and Regulations, and Policies Supplemental to the Articles of Association), plus certain works controlled by Broadcast Music, Inc. (“BMI”) (whether 100% or with one or more performing rights organizations (“PROs”) other than ASCAP)."
full_description = '''<div class="no-js"> This page requires Javascript to be enabled. Please enable javascript in your browser preferences. </div> About ASCAP Repertory Search What is ASCAP Repertory Search? ASCAP Repertory Search (“Repertory Search”) is a searchable database that contains information on musical works in the ASCAP Repertory (as that term is defined in the Compendium of ASCAP Rules and Regulations, and Policies Supplemental to the Articles of Association), plus certain works controlled by Broadcast Music, Inc. (“BMI”) (whether 100% or with one or more performing rights organizations (“PROs”) other than ASCAP). Users of Repertory Search have the option of choosing among three search functions once they enter the name of a writer or publisher: (1) “Songview,” which provides the most comprehensive set of results and includes information on all works in the database; (2) ASCAP Clearance Express (“ACE”), which provides information only on works in the ASCAP Repertory, including works split between ASCAP and one or more other PRO; and (3) “ASCAP100%,” which provides information on works in the ASCAP Repertory that are 100% controlled by ASCAP and its members for the United States and its territories and possessions. All three search functions are described below. Terms of Use By accessing Repertory Search, you acknowledge and agree that you shall comply with the Terms of Use Agreement and Privacy Policy to which you agreed upon your access to and use of this website, including the additional ASCAP Repertory Search Terms of Use, and any additional terms and conditions that we provide to you in connection with Repertory Search. General Description of Repertory Search The Repertory Search database contains information relating to musical works that are written by ASCAP writer members, BMI writer affiliates, and musical works co-written by either an ASCAP writer member or BMI writer affiliate with a writer who is either affiliated with another PRO (whether U.S. or foreign), or not affiliated with any PRO. For each work, all known writers (regardless of the writer’s PRO affiliation) are identified, along with their PRO (if applicable), and Interested Party Information (“IPI”) number, in each case, as reported by CIS-Net. The Repertory Search database is updated daily other than for routine maintenance or system upgrades. The Repertory Search database shows aggregated shares, and publisher ownership and/or administration information for the United States (including its territories and possessions) only. The publisher contact shown is intended for music users solely within the United States. Music users outside the United States should contact PROs or mechanical rights licensing organizations in their territory for publisher contact information. Additionally, the publisher name and address provided in the Repertory Search database (as the result of a publisher or title query) may be the contact information for the publisher or administrator of only certain rights in a work; and, therefore, may not necessarily be the contact information for the copyright owner of that work. The Repertory Search database contains publisher information related to musical works and is not intended to be used for sound recording purposes (such as determining which record label may control a recording of a particular musical work). Each of the three views of Repertory Search has a link that enables the user to download the ASCAP Repertory (only). However, given its extensive size, downloading the ASCAP Repertory will require a text viewer/editor application capable of opening very large files. About Songview Songview is the product of a collaboration between ASCAP and BMI that provides music users with an authoritative view of ownership shares for performing rights in the vast majority of music licensed in the United States. Using the Songview technology, ASCAP and BMI are able to display detailed, aggregated ownership data for more than 20 million musical works in their combined repertories, including copyrighted arrangements of works in the public domain, and a breakdown of ownership shares in individual works between ASCAP and BMI. The Songview search function shows works available in the ASCAP Repertory, as well as works reconciled by Songview that are in BMI’s repertoire (whether 100% controlled by BMI or jointly controlled by BMI with one or more societies other than ASCAP). A work is considered to be reconciled when ASCAP and BMI have identical information regarding the writers and publishers of the work, including the shares belonging to each of those writers and publishers. Reconciled works will be identified with the Songview checkmark in each of the Songview, ACE and ASCAP100% search functions. Click here for more detailed information about Songview. About ACE As in the past, using the ACE search function enables the user to find information (i) on works in the ASCAP Repertory that have appeared in ASCAP’s domestic performance surveys, including foreign works licensed by ASCAP for public performance in the United States, and most works registered with ASCAP since January 1, 1991, whether surveyed or unsurveyed; (ii) relating to musical works that were formerly in the ASCAP Repertory, but remain licensed by ASCAP for Licenses-in-Effect (as that term is also defined in the Compendium of ASCAP Rules and Regulations, and Policies Supplemental to the Articles of Association); and (iii) that may be used to determine whether a particular composer, writer or music publisher is a member of ASCAP or a member of another PRO. The ACE search function includes aggregate ASCAP share information for each work as well as the ASCAP-controlled writer and publisher interests of each work on ACE. All known writers (regardless of the writer’s PRO affiliation) will appear on each work displayed through an ACE search, along with their PRO, and Interested Party Information (“IPI”) number, in each case, as reported by CIS-Net. Only foreign writers and publishers affiliated with foreign societies whose interests are licensed by ASCAP for the United States will appear on each work in ACE, along with such publishers’ contact information (or administrators’ contact information, if applicable). ACE may contain information relating to musical works that are written by ASCAP writer members and/or writers who are either affiliated with other PROs (whether U.S. or foreign), or not affiliated with any PRO. A work may be removed from ACE if two or more interested parties dispute the percentage share allocation of that work. In addition, works for which ASCAP is unable to verify the interests of ASCAP members do not appear in ACE. ACE enables the user to view and download information regarding all works of an ASCAP writer or publisher member, or the works of a writer affiliated with another PRO that are licensed by ASCAP for performances in the United States. ACE also enables the user to view and download the combined ASCAP catalogs of the following music publishers that own, control or administer multiple catalogs: BMG Rights Management Group, EMI Music Publishing Group, Sony Music Publishing Group, Universal Music Publishing Group and Warner/Chappell Music Group. Note that given the extensive size of these publishers' catalogs, downloading their catalogs also will require a text viewer/editor application capable of opening very large files. If there is a dispute pending as to ownership or other rights with respect to a work, ACE advises the user to “Contact ASCAP For More Information.” To contact ASCAP for information about a listing on ACE, click here, or call us at (800) 95-ASCAP and ask for the Repertory Department. Members may resign from ASCAP and elect to remove their works from the ASCAP Repertory, or remove their interests in works created in collaboration with other ASCAP members who have not resigned from ASCAP. ACE provides information as to such works. ASCAP’s rules and regulations provide that ASCAP will continue to license public performances of such removed works, or removed interests in such works, under Licenses-in-Effect (as that term is also defined in the Compendium of ASCAP Rules and Regulations, and Policies Supplemental to the Articles of Association). For such works, ACE shows the effective date with respect to such Licenses-in-Effect for resigned members with interests in those works. Similarly, with respect to collaborative works, ASCAP will continue to license public performances of such works for so long as ASCAP continues to have the right to license such works. However, the removed interests will not be included in the “Total Current ASCAP Share” percentage or the “ASCAP controls” writer or publisher percentage share information. About ASCAP100% As its title suggests, the ASCAP100% search function enables a music user to query the Repertory Search database to determine whether a specific work is controlled entirely by ASCAP and its members, or otherwise licensed solely by ASCAP. The description of the features of ACE applies as well to ASCAP100%. ASCAP Repertory Search terms of use View now Works restored to copyright protection A list of ASCAP works to which copyright protection has been restored for the balance of the current 75 year copyright term, calculated from the year of original publication. Search the database'''
year_published = 2025
clearnet = "https://ascap.com/repertory/about"
