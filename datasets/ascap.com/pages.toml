full_description = "January 2025 U.S. Copyright Office AI Guidance Agrees with ASCAP: Human Creators First The U.S. Copyright Office issued part two of its report on artificial intelligence, affirming one of ASCAP’s core principles: Human Creators First. Read more April 2024 The Generative AI Copyright Disclosure Act Demands Transparency in AI to Protect Creators’ Intellectual Property Rights The bill, which aligns with ASCAP’s six principles on AI, represents an important effort to balance technological innovation with fairness and the economic and legal rights of creators. Read more December 2023 ASCAP Advocates for Music Creators in Comments to U.S. Copyright Office on Generative AI As artificial intelligence continues to raise exciting new possibilities and challenges, the U.S. Copyright Office is conducting a study on copyright and related issues raised by generative AI. ASCAP submitted a comprehensive response and follow-up reply on behalf of our members as part of our ongoing commitment to protecting the rights and livelihoods of songwriters, composers and music publishers. Read more September 2023 Top Songwriters and Composers Urge Congress to Protect the Rights of American Music Creators During ASCAP “Stand with Songwriters” Advocacy Day on September 21 Jimmy Jam and Terry Lewis, Paul Williams, Madison Love, Cirkut, Pasek and Paul and Matthew West join other ASCAP members and leaders to promote AI policy aligned with ASCAP’s “Six Principles” Read more September 2023 Jimmy Jam and Terry Lewis, Jermaine Dupri, Madison Love, Pasek and Paul and Matthew West to Take the Stage at The ASCAP Foundation’s 12th Annual “We Write the Songs” at The Library of Congress on September 20 The evening is hosted by Librarian of Congress Carla Hayden and The ASCAP Foundation President Paul Williams and will include performances by several of ASCAP's leading songwriter members Read more June 2021 ASCAP Songwriters Meet with Members of Congress for Virtual “Stand with Songwriters” Advocacy Month Pat Benatar and Neil Giraldo, Rhymefest, MILCK, Tom Tom Club’s Chris Frantz and Tina Weymouth and other award-winning American songwriters call on Congress to support American music creators. Read more"
