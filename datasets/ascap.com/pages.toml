["https://ascap.com/music-creators/mobile-app"]
title = "ASCAP Mobile App"
full_description = '''<div class="no-js"> This page requires Javascript to be enabled. Please enable javascript in your browser preferences. </div> Introducing the ASCAP Mobile App It's like having a personal manager in your pocket. Whether you’re on tour, taking a meeting or heading to a co-writing session, being a professional music creator means you’re always on the move. With the ASCAP mobile app, it’s easier than ever to do your essential ASCAP business, wherever you are: Register your music Optimize your metadata View your royalties Learn how the music business works Get inspired Connect with collaborators and career opportunities Download the mobile app today! Available in the App Store for iPhone and on Google Play for Android Get it now Register your music, your way. Use Quick Registration to send us the basic writer, publisher and royalty split breakdown for your music. Or go with Guided Registration for a more comprehensive walkthrough, where you’ll learn about all the data ASCAP needs to track performances of your music, and pay you accurately. Either way, the ASCAP mobile app makes it easy with an intuitive, step-by-step approach. Optimize your music metadata. Our new Data Health Check will scan your ASCAP catalog and find missing metadata that can help you get paid. Check out your ASCAP earnings. Get a snapshot of your latest ASCAP royalties as soon as they're ready, and scroll through your last three years’ worth of earnings. Learn about the music business. Get inspired with expert advice from pro music creators, and find out how the money flows in the music industry with our curated selection of articles and how-to guides. Connect with your music community. Discover new opportunities to find collaborators and apply for career-boosting workshops in our events calendar. Download the mobile app today! Available in the App Store for iPhone and on Google Play for Android Get it now function toggleArrowGAFAQ(element, val) { var span = element.className; if (span.toLowerCase().indexOf("show-answer") >= 0) { ga('send', 'event', 'FAQ', 'collapse question', val.replace(",", "").replace("'","")); } else { ga('send', 'event', 'FAQ', 'expand question', val.replace(",", "").replace("'", "")); } } Frequently asked questions Mobile App Who can use the mobile app? The app is available to current ASCAP writer and publisher members and their designated users (DUs). You must be a current member or DU with an active Member Access account to use the app. The app is not available to successors, legal earners or foreign affiliates. What can I do with the mobile app? The ASCAP mobile app is like having a personal manager in your pocket. You can: Register your music, using our guided or quick registration options See your last three years’ worth of royalty statements Use Data Health Check to scan your ASCAP catalog for missing metadata that could help you get paid Learn about the music business via a curated selection of articles and how-to guides Find out about new opportunities and music industry events Where can I download the app? Find it in the App Store on iPhone, or on Google Play on Android. You can find both links at www.ascap.com/appdownload. Which operating systems does it work with? The mobile app supports iOS 15-17 and Android OS 9-14. Currently it is only available on mobile phones – we do not support iPads or tablets. What is my login info for the app? Use your existing Member Access account credentials. You will be asked to verify your identity using two-factor authentication. What’s the difference between the mobile app and Member Access? While you can register your music and check your royalties in both the mobile app and Member Access, the app’s features and interface are designed for the on-the-go music creator. Member Access is geared towards a desktop experience. There are a few unique features that are only available on the mobile app, like the Data Health Check and Quick Registration option. What can I not do in the mobile app? If you want to update your contact info, set up direct deposit or see your full interactive earnings, you will need to log into Member Access. ASCAP OnStage submissions and ASCAP Plus Awards applications are available exclusively through Member Access. Member Access is also the best way to send ASCAP a message about your account. What’s the difference between Guided and Quick Registration? The Quick Registration option is designed for less complex work registrations – typically non-classical music without any samples or public domain elements, that aren’t intended for film/TV, jingles or other A/V projects. Quick Registration includes the minimum required info that you need to register your music, plus a few key optional fields that may apply. If you write classical music, or music intended for a film, TV program, commercial, PSA, jingle or other A/V project, you’ll want to use the Guided Registration. It allows you to give us more detailed info that can help us track your music, and pay you properly when it’s surveyed. The guided version also contains an eligibility quiz to ensure that your work needs to be registered in the first place. If I’m registering music on the app, can I save my work and come back? Yes. Registering a work on the mobile app breaks down the music registration process into a series of steps. Once you’ve hit the button that advances to the next step, your work will be saved. What sort of push notifications will ASCAP send me via the app? When you opt into push notifications we'll notify you when you get paid, and when your ASCAP account requires your attention. You can also choose to receive new event announcements and music career advice. You can turn on push notifications when you first open the app, or update your push notification settings later in the app’s Settings section. I can’t log into the app. What should I do? Make sure you are eligible. Only current ASCAP writers and publishers, and their designated users, can log into the mobile app. Do you have a Member Access account? The mobile app uses the same credentials that you set up for your Member Access. If you have never activated your Member Access account, do that first at www.ascap.com/members. Forgot your username / password? Visit www.ascap.com/members and click the “Forgot username?” or “Forgot password?” link. I’m having trouble using the app. What should I do? Here are a few basic troubleshooting tips: Make sure your operating system is supported by the app. It currently supports iOS 15-17 and Android OS 9-14. Make sure you are connected to the internet. The ASCAP mobile app requires an active internet connection, either WiFi or cellular data. If the signal is weak, it can cause connectivity issues. Occasionally, our website or app will be put into maintenance mode while we upgrade our systems. You’ll see a maintenance page – check again later after maintenance is complete. If you’re still having trouble, contact our Global Member Services team at 1-800-95-ASCAP, 9am-6pm ET, Monday through Friday. Have your member ID handy for faster service. If I delete the app, will that delete my ASCAP data? No, deleting the app will not delete any of your ASCAP royalty or works registration data. That information is all stored safely in the cloud. Will ASCAP update the app? Yes! We’re already planning new features and new functionality. We’ll notify you as they’re added. Have an idea for a new feature you’d like to see? Let us know at mobileapp@ascap.com.'''
year_published = 2025
clearnet = "https://ascap.com/music-creators/mobile-app"
