["https://ascap.com/help/legal/privacy-policy"]
title = "ASCAP Privacy Policy"
description = "The American Society of Composers, Authors and Publishers (“ASCAP,” “we,” “us” or “our”) wants you to be familiar with how we collect, use and disclose information from and about you."
full_description = 'ASCAP Privacy Policy Last Updated October 19, 2021 TABLE OF CONTENTS Introduction General Applicability of This Privacy Policy Information We Collect How We May Use Your Information How We May Share Your Information User Choice and Access How Do We Use Tracking Technologies Data Collection From Children Security Data Retention Your California Privacy Rights Linked Services Changes to our Privacy Policy International Visitors Contact Us 1. INTRODUCTION The American Society of Composers, Authors and Publishers, together with its affiliates (collectively, "ASCAP,” “we,” “us” or “our”) wants you to be familiar with how we “process” (i.e., collect, store, use and disclose) information from and about you. This is the Privacy Policy for your interaction with our products and services, including your membership in ASCAP, and the Services, and it applies to all individuals, including ASCAP members, who use our products and services (whether offline or online), whether you are accessing and/or using the Services as a registered User, member of ASCAP or otherwise. This Privacy Policy applies regardless of the Device you use to access the Services. You should also review our Terms of Use Agreement, which governs your use of the Services. Any capitalized terms that are not defined in this Privacy Policy shall have the meaning given in the Terms of Use Agreement. This Privacy Policy will remain in full force and effect, even if your use of the Services or any particular feature or activity offered in connection therewith terminates, expires or is deactivated or suspended for any reason. We will either rely on our legitimate interest or our need to perform under a contract to process your information or you will be asked to affirmatively consent to our processing of your information, all in accordance with the terms and conditions of this Privacy Policy. If you do not agree with this Privacy Policy, please do not access and/or use the Services or any features, activities, products or services offered through or in connection therewith. 2. GENERAL APPLICABILITY OF THIS PRIVACY POLICY This Privacy Policy governs only the information we collect about you (a) from you and (b) from Third Party Services (e.g., Facebook, Twitter, Instagram) and Operators, in each instance, on or in connection with your use of the Services, and does not cover any other information processed in any other manner or processed by any other entity, unless specifically stated. Where you have provided your information to third parties such as our affiliated companies, marketing companies, platform operators and/or technology providers, including, without limitation, our advertisers, sponsors and/or other promotional partners, including, without limitation, Third Party Services, and have agreed to share that information with us, we may obtain such information and combine it with the information we collect, and, if we do so, our use of the resulting combined information will be subject to this Privacy Policy. 3. INFORMATION WE COLLECT We collect personal information (i.e., information that identifies an individual or may be combined with other information to identify an individual) or other information about you when you visit our Sites or use our Services. The information and data we may process depends on your interaction with us. The key types of information that we may process include the following: Registration Information: In order to access and use certain features, content or functions of the Services (e.g., My ASCAP License, Member Enrollment or Member Access), you may need to register for a User Account. When you create a User Account, we will collect personal information as necessary to offer and fulfill the Services you request (e.g., applying for membership to ASCAP, purchasing a music license for your business). Depending on the Services you elect to use, we may ask you to provide your name, email address, phone number(s), gender, zip code, legal address, date of birth, residency information, business address, business type, business website, music use type at business, music usage at business and revenue), performing rights organization affiliation, tax id number, bank account information, stage name and/or band affiliation. If you choose not to provide some of this information, you may not be able to use all of the features of the Services, including purchasing a music license for your business or becoming a member of ASCAP. Musical Work/Copyright Interest Information: You may submit information when accessing or using certain Services regarding musical compositions that you author, publish or administer, including, work title, authorship, ownership, share or administration information. If you submit such musical work information (e.g., directly to ASCAP via Works Registration in Member Access or by other means) such information may become available to the public. We may also receive personal information about you from third party collective rights management organizations, independent management entities, third party rights holders and related business partners for various business purposes, including the identification and verification of copyright interests in musical compositions in the ASCAP repertory, enforcing and protecting your interests as a copyright holder, and the licensing of your musical compositions and/or the collection and verification of royalties as a result of such licensing activities. Fee Based Services Information: If you engage in any Fee-Based Services or other transaction offered on or in connection with the Services, we and/or our third party payment processors may require certain payment information (e.g., credit or debit card number, card type, expiration date and address associated with such credit or debit card) and additional information (e.g. your full name, physical address, telephone number(s)) to fulfill the applicable services or deliver the applicable products. Information Collected Through Additional Features and Functions of the Services: The Services may provide you with access to additional features and functionality, such as interactive and community features, message and comment functionality, posting and other functionality, which may, in certain instances, be subject to Additional Terms and requirements which will determine who can publicly or privately view such information. To participate in these features and functionalities, you may be asked to provide certain information about yourself and/or provide consent in order to personalize and/or permit your use of these features and functions. Communications Information: The Services may present you with the opportunity to sign up to receive newsletters, email correspondence, news alerts about laws that may affect music rightsholders and/or other communications from us in order for us to provide up-to-date information about ASCAP, the Services or the music industry, and to publicize and promote certain content, products and services offered by us, our business partners and/or other third parties. When there is a separate sign-up for communications, we may ask for your contact information such as name and email address, and, sometimes, demographic and profile information. Technical, Operational and Customer Support Information and Feedback: When you use our customer support system, contact us for technical, operational or other support or otherwise provide any comments or feedback to us, you may be required to provide certain information relevant to your applicable issue or we may need to contact you to resolve the issue. Unless you provide us with an additional consent, we will only process this information to provide you with technical and support services. Information Related to Promotions and Contests: To participate in certain promotions, including contests and surveys, there may be a separate registration or sign up process, which may require the submission of information (e.g., your full name, email address, mailing address, telephone number, demographic and/or profile information). Unless you provide us with an additional consent, we will only process this information to evaluate your submission or process your application or survey results. Information Collected by Tracking Technologies: Information processed by cookies will be processed in accordance with our Cookie Policy. Other Information We May Collect and Information from Other Sources.We may also collect other information when users visit our Sites or use our Services, which may include domain name, IP address, type of browser, type of device and type of operating system used. We may also supplement the information listed above that we collect with information from other sources, such as publicly available information from commercially available sources, information contained in the ASCAP Repertory Search database and information from our affiliates or business partners. 4. HOW AND WHY WE MAY USE YOUR INFORMATION We may process your personal information for a variety of reasons that are permitted under data protection laws and in accordance with this Privacy Policy, which may include the purposes described below. If we use your information for other purposes than those mentioned below, we will notify you of these purposes before using your information and obtain your consent where necessary. The legal bases outlined below are the legal bases upon which we will rely to process the personal data of end users located in the European Union (“EU”). To fulfill our contractual obligations under an existing agreement with you or in anticipation of entering into an agreement with you, including: To review and process your application to become a member of ASCAP or your request to purchase a music license; To negotiate, enter into, manage and administer licenses with third parties for the licensing of the ASCAP repertory; To process, calculate and distribute royalty payments that result from the licensing of your musical compositions; To communicate and resolve issues with licensees, other collective rights management organizations, independent management entities, administrators and other service providers about the performance of your musical compositions, your ownership interests therein and royalties accrued in connection with the same; To fulfill orders and provide you with products and services you have requested and/or paid for; and To enforce your legal rights under an agreement. To meet and fulfill our legitimate business interests, including: To communicate with you about your account, your ASCAP membership, your music license, the Sites, the Services and ASCAP; To verify, reconcile and publish the copyright interests in and to musical compositions in the ASCAP repertory; To update the ASCAP Repertory Search database; To manage our business needs, such as monitoring, analyzing, modifying and improving the Services’ and Sites’ functionality and performance; To prevent fraud and abuse on and unauthorized access to the Services and Sites; To provide you with information about products and services you have purchased or indicated your interest in; To determine which features and functionality of the Services users like best to help us operate, enhance and improve the Services; To expand ASCAP membership and the ASCAP repertory; To get to know our potential and existing members, rightsholders, clients and users; and To identify relevant content shared with potential and current members. To comply with our regulatory and legal obligations or to enforce our legal rights, including: To meet reporting requirements (e.g., filing tax forms); To protect, enforce, or defend the legal rights, privacy, safety, or property of ASCAP and our affiliates and their respective employees, agents and contractors (including enforcement of our agreements and our Terms of Use Agreement); To protect the safety, privacy and security of Users of the Services, members of ASCAP or the public; To comply with the law or legal process, and/or respond to requests from public and government authorities; To enforce your rights as a copyright holder; and To report data breaches or unauthorized access to the Services. With your consent*: To contact you about making donations to the ASCAP Foundation; To provide you with mailings, newsletters and notices that you have asked to receive; To market to you by delivering marketing materials about the products and services of unaffiliated businesses; and To provide personalized services offered by us on third-party websites and online services. *You can withdraw your consent at any time by following the steps in Sections 6 and 7 in this Privacy Policy. 5. HOW WE MAY SHARE YOUR INFORMATION We will not share your personal information with others except in the following circumstances: Our Affiliated and Related Entities: We may disclose your personal information to our affiliated companies, including ASCAP Enterprises LLC (www.songwize.com/), as well as our related entities The ASCAP Foundation (https://ascapfoundation.org/) and The ASCAP Legislative Fund for the Arts, in each case, in connection with your membership and in order to provide you with tailored membership offerings, products, services and communications or in accordance with our internal policies or administrative or business practices. Collective Rights Management Organizations, Administrators, Licensees and Business Partners: We may disclose your personal information to third party collective rights management organizations, independent management entities, licensees, administrators, and third-party partners who assist us in identifying and verifying copyright interests in and to musical compositions in the ASCAP repertory, enforcing and protecting your interests as a copyright holder, the licensing of your musical compositions and/or the verification and collection of royalties as a result of such licensing activities. Publicly via the ASCAP Repertory Search database: ASCAP will share and disclose certain information regarding the musical compositions you author, publish or administer in the ASCAP Repertory Search database. Some of this information will be made public upon your disclosure or uploading of such information. Third Party Service Providers: We may share information with other carefully selected third party operators, developers, merchants, website hosts, service providers and participants to your transactions and the licensing of your musical compositions for the purpose of (a) assisting with facilitating transactions and licenses on or through the Services, (b) sending you information about our products, offerings and services, (c) providing information technology and member service assistance, and (d) providing, offering, supporting, administering, maintaining and enabling the Services (including providing a full range of content, activities, services, widgets, payment processors, features and functions '
