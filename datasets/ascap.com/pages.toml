full_description = '''<div class="no-js"> This page requires Javascript to be enabled. Please enable javascript in your browser preferences. </div> ASCAP Awards We celebrate our members for their excellence and give back to the community with honors, scholarships and workshops Join ASCAP today. Become part of our global family of professional music creators. Already a member? Log in to Member Access. Join now Log in 2024 ASCAP Country Music Celebration On November 18, ASCAP celebrated the writers and publishers of the biggest country songs of 2023 in Nashville. The night's big winners included Ashley Gorley, Chris Stapleton, "Last Night" (ASCAP Country Song of the Year co-written with JKash) and Sony Music Publishing. Full coverage 2024 ASCAP Christian Music Celebration On September 29, ASCAP celebrated the writers and publishers of the most-performed Christian songs of 2023 at an exclusive celebration in Nashville. Full coverage 2024 ASCAP Rhythm & Soul Music Celebration On June 27, ASCAP celebrated Usher (Voice of the Culture Award), Victoria Monét (Vanguard Award) and Lil Baby (Songwriter of the Year) and all the songwriters and publishers of the most-performed ASCAP hip-hop, R&B and gospel songs of the past year. Full coverage 2024 ASCAP London Music Awards We traveled across the pond to honor Kenya Grace, Cian Ducrot, Lostboy, Steve Mac, Daniel Pemberton and the PRS for Music writers of the most-performed songs and scores of the past year. Full coverage The 2024 ASCAP Pop Music Awards Pictured: ASCAP Global Impact Award winner Charli XCX (right) with Chappell Roan On May 8, the ASCAP family gathered in celebration of our 2024 ASCAP Pop Music Awards winners – the songwriters, producers and publishers of the biggest hits of the past year. Read more The 2024 ASCAP Screen Music Awards On May 9, 2024, ASCAP screen music royalty gathered on the sylvan terraces of LA’s Houdini Estate to honor the composers of the past year’s biggest films, TV programs and video games.