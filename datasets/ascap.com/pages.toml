["https://ascap.com/news-events/articles/2023/10/stand-with-songwriters-advocacy-day-ai-principles"]
title = "ASCAP Advocacy in Washington | capitol hill, artificial intelligence, Jimmy Jam & Terry Lewis, Pasek & Paul, Matthew West, Madison Love, Cirkut, songwriting, AI"
description = "A group of ASCAP award-winning songwriters and composers convened on Capitol Hill on September 21 to meet with legislators as part of ASCAP’s “Stand with Songwriters” Advocacy Day."
full_description = "ASCAP’s “Stand with Songwriters” Advocacy Day on Capitol Hill Highlights Six Key Guiding Principles in the Age of AI By Erik Philbrook, ASCAP Editor in Chief | Photos by Mariah Miranda Photography (except where noted) • October 12, 2023 A group of ASCAP award-winning songwriters and composers convened on Capitol Hill on September 21 to meet with legislators as part of ASCAP’s “Stand with Songwriters” Advocacy Day. ASCAP members who “walked the halls” included many who performed the prior night at The ASCAP Foundation’s We Write the Songs concert at the Library of Congress: Jimmy Jam & Terry Lewis, Benj Pasek & Justin Paul, Matthew West and Madison Love. They were joined by ASCAP President and Chairman of the Board Paul Williams and other ASCAP writer and publisher Board members including Bob Bruderman, Sharon Farber, Jim Kendrick, Dan Foliart, Evan Lamberg, Desmond Child, Marti Cuevas, Michelle Lewis, Ree Guyer, Jimmy Webb and Grammy Award-winning writer-producer Henry “Cirkut” Walter, as well as ASCAP executives. Participants urged Members of Congress to protect the rights of American music creators, defend the value of music in the age of artificial intelligence and adhere to six key, creator-centric principles for AI that were unanimously adopted by the ASCAP Board of Directors earlier this year. They are: Human Creators First: Prioritizing rights and compensation for human creativity Consent: Protecting the right to decide whether one’s work is included in an AI training license Compensation: Making sure creators are paid fairly when their work is used in ANY way by AI, which is best accomplished in a free market, NOT with government-mandated licensing that essentially eliminates consent Credit when creators’ works are used in new AI-generated music Transparency in identifying AI vs. human-generated works and retaining metadata Global Consistency: An even playing field that values intellectual property across the global music and data ecosystem ASCAP also invited its songwriter, composer and music publisher members from all 50 states to join the effort, with email activations and opportunities to engage across its social media channels, all week long. ASCAP’s congressional meetings followed the ASCAP Foundation’s “We Write the Songs” concert at The Library of Congress on September 19."
