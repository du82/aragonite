title = "ASCAP Lab"
full_description = '''<div class="no-js"> This page requires Javascript to be enabled. Please enable javascript in your browser preferences. </div> .gradient { fill: url(#linear-gradient); } Ascap Lab Logo The ASCAP Lab experiments at the intersection of technology, art and business to super-serve and support our music creator and music user communities into the next century. Are you developing a new technology that we should know about? Let us know at lab@ascap.com. PODCAST: The ASCAP Lab Gets Down to Business with AI In the latest episode of VERSED: Five tech startups dive into their experiences in the 2024 ASCAP Lab Challenge, and ASCAP composer Gregg Lehrman (founder of Output) talks about mentoring this year’s teams. Listen now "AI and the Business of Music” Challenge Teams Revealed This year's Challenge, operated in partnership with the NYC Media Lab, brings together five promising tech startups that are exploring AI solutions for music creators to market, master and protect their music. Read the press release Meet the Five Teams Participating in the "AI and the Business of Music" Startup Challenge CRESQA An AI social media content assistant designed for songwriters and musicians that automates the process of social media strategy development and helps generate fully personalized post ideas and schedules for TikTok, Instagram, YouTube Shorts, Facebook and more. Learn more MUSIC TOMORROW Analytics tools that monitor and boost artists’ algorithmic performance on streaming platforms, using AI for advanced audience insights and automation that improve an artist's content discoverability, listener engagement and team efficiency. Learn more ROEX AI-driven tools for multitrack mixing, mastering, audio cleanup and quality control, designed to streamline and enhance the last steps of the creative process by delivering a professional and balanced mix with ease. Learn more SOUNDSAFE.AI Robust, state-of-the-art audio watermarking using AI to enhance security, reporting and the detection of real-time piracy and/or audio deepfakes. Learn more WAVELETS AI Tools for artists, labels, copyright holders, content distributors and DSPs that help reduce IP infringement by detecting AI vocals in music. Visit them on the web ASCAP & AI Artificial intelligence has the potential to create both massive disruption and great opportunity for the music industry. Find out how ASCAP is helping music creators navigate AI. Read more Prelude in AI Major: Crafting a Creator-First Future for Music & AI Watch the short doc VIDEO PLAYLIST: How AI Is Changing Music Watch panels from ASCAP AI Symposia, all about AI's impact on creativity, copyright, technology and more. "To drive our next century of growth and to harness your deep passion for ASCAP’s mission, we have launched ASCAP Lab, an innovation program that will explore advanced technologies, new business approaches and creative collaborations intended to broaden the lens through which we view what is possible as we seek to serve and support our membership." -Elizabeth Matthews - ASCAP Chief Executive Officer NFTs & Music 101 (Presented by the ASCAP Lab) Got questions about non-fungible tokens? Our expert panelists have answers! Watch our ASCAP Experience session with Matt Medved (nft now), Vickie Nauman (CrossBorderWorks) and early adopter Poo Bear (one of Justin Bieber's main co-writers). These three NFT experts have an eye-opening discussion about how NFTs are opening up new opportunities for music creators to monetize their creative work, and interact with their fans. Watch on demand Music in the Metaverse How can music shape our metaverse experiences and identities? Watch demos of four technologies developed by the teams in our 2022 ASCAP Lab & NYC Media Lab challenge. Watch full video Get a Glimpse of the Future of Music Creation Watch demos of four technologies that reimagine how artists and fans make and interact with music – dreamed up by the finalists of our 2021 Immersive Music Studio Challenge. Watch full video In 2020, we collaborated with five university teams to unlock new ways to create and experience music using emerging technologies.Watch the video to see what they came up with. ASCAP Lab Around the Web Music Ally: ASCAP Lab Reveals Cohort for Its 2024 AI Startups Accelerator (October 10, 2024) Read more The AI Musicpreneur: ASCAP Premieres AI Music Documentary, Announces 2024 Challenge (March 21, 2024) Read more Music Ally: Music in the Metaverse Challenge Showcases Four New Startups (August 29, 2022) Read more TechCrunch: ASCAP Lab Highlights a Quartet of Early-Stage Music Startups (July 28, 2021) Read more Music Ally: ASCAP Reveals Startups for Immersive Music Studio Challenge (July 29, 2021) Read more Variety: Living Colour’s Vernon Reid Joins ASCAP Lab as Artist in Residence (October 6, 2020) Read more ASCAP.com: ASCAP Launches Program to Drive Innovation Agenda for Next Century of Growth (September 9, 2019) Read more var _emailSignUpFormdataSourceId = "8d7893d8-2ead-464e-93c8-ec1b0f1d7518"; The ASCAP Lab Be the first to know about new ASCAP Lab events, initiatives, and ways to get involved Email Address Submit ga('send', 'event', 'ascap-lab', 'Email Subscription -signup up for the first time - Module', 'impression'); $("#emailAddress").on("change", function() { ga('send', 'event', 'ascap-lab', 'Email Subscription -signup up for the first time - Module', 'text entered'); }); $("#EmailSignUp").on("click", function () { ga('send', 'event', 'ascap-lab', 'Email Subscription -signup up for the first time - Module', 'click - submit'); }); $("#EmailSignUp").on("PrefCenter:EmailVerified", function () { ga('send', 'event', 'ascap-lab', 'Email Subscription -signup up for the first time - Module', 'submit-success'); }); $("#EmailSignUp").on("PrefCenter:EmailError", function (arg1, arg2) { ga('send', 'event', 'ascap-lab', 'Email Subscription -signup up for the first time - Module', 'error: ' + arg2); }); $("#EmailSignUp").on("PrefCenter:EmailAlreadySubscribed", function () { ga('send', 'event', 'ascap-lab', 'Small Email Subscription Module - already subscribed at this email', 'impression'); }); $("#EmailSignUp").on("PrefCenter:SubmitStart", function () { $("#EmailSignUp span.text").text("Submitting"); $("#EmailSignUp span.c-spinner-dots").addClass("in-progress"); }); $("#EmailSignUp").on("PrefCenter:SubmitEnd", function () { $("#EmailSignUp span.text").text("Submit"); $("#EmailSignUp span.c-spinner-dots").removeClass("in-progress"); });'''
