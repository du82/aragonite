full_description = '''<div class="no-js"> This page requires Javascript to be enabled. Please enable javascript in your browser preferences. </div> Press room 2025 2024 2023 2022 2021 2020 2019 2018 2017 2016 2015 2014 2013 2012 2011 2010 2008 2004 February 27, 2025 ASCAP Posts Record-Breaking $1.835 Billion in Revenue for 2024 This is the highest amount in revenue and royalty distributions to creators and music publishers historically reported by ASCAP, fueled by revenue growth and the lowest overall cost allocation overhead rate in the US at 10%. Read more February 24, 2025 Top Film, TV and Video Game Composers Nominated by Peers for 2025 ASCAP Composers’ Choice Awards Chosen by the ASCAP composer community, winners will be revealed on April 30 during an exclusive party celebrating the 2025 ASCAP Screen Music Awards in Los Angeles. Read more January 21, 2025 Sundance ASCAP Music Café Returns to Acura House of Energy to Celebrate the Love Affair Between Music and Film with Composer Conversations and Live Performances from Eric Bazilian & James Bourne, Toby Gad with Antonique Smith & Mae Mae, The Wild Feathers, HAFFWAY and Ambar Lucid on January 26 and January 27 The American Society of Composers, Authors and Publishers (ASCAP) announces the ASCAP songwriters and composers taking the stage for the 27th Annual Sundance ASCAP Music Café at the 2025 Sundance Film Festival. Read more January 15, 2025 ASCAP to Distribute $1 Million in Fire Relief to ASCAP Members in Need ASCAP, the American Society of Composers, Authors and Publishers, today announced that it will distribute $1 million in emergency relief to ASCAP songwriter and composer members in the Los Angeles area who have suffered loss or damage to their primary residence or studio, or been evacuated from their homes as a result of the LA fires. Read more December 10, 2024 Kelly Clarkson, Katy Perry, Justin Bieber, Laufey and More Light Up the Top 10 ASCAP New Classic Holiday Songs Chart Celebrating the songwriters behind the latest trending tinsel tunes and cherished seasonal standards alike, ASCAP announces the Top 10 ASCAP New Classic Holiday Songs and the Top 25 ASCAP Holiday Songs for 2024. Read more December 05, 2024 ASCAP Experience Is Back in LA on February 27, 2025 This year’s summit is a one-of-a-kind gathering for music creators to hone their craft and find community through a full day of workshops, networking, panels, performances and more, designed to help attendees achieve their goals and navigate the future of music. Read more December 04, 2024 Usher, Chappell Roan, Noah Kahan, Selena Gomez, Jermaine Dupri, Marc Anthony, Chris Stapleton, Old Dominion, Gracie Abrams & More Donate One-of-a-Kind Experiences and Items Now Available at The ASCAP Foundation Holiday Auction ASCAP’s top music creators donated an impressive collection – the largest in the auction’s history – of more than 70 exclusive items and experiences. Read more November 18, 2024 Chris Stapleton and Ashley Gorley Take Top Honors at ASCAP 2024 Country Music Celebration ASCAP, the American Society of Composers, Authors and Publishers, announces the winners of the 62nd ASCAP Country Music Awards, celebrating the songwriters and publishers of country music’s most-performed ASCAP songs of the past year. Read more November 14, 2024 Broadway Star and Two-Time Tony Award Winner Shaina Taub Presented with ASCAP Foundation Richard Rodgers New Horizons Award Established to honor ASCAP composers and lyricists who make a significant Broadway or off-Broadway debut, the award is funded by Mary Rodgers and the Rodgers Family Foundation. Read more November 13, 2024 Grammy-Winning Singer and Actress Coco Jones, Grammy-Winning Songwriter and Advocate Autumn Rowe and Emmy-Winning Composer Amanda Jones Honored at 16th Annual 2024 ASCAP Women Behind the Music Event Presented by the ASCAP Rhythm & Soul team, ASCAP Women Behind the Music recognizes and encourages female trailblazers in the music community by honoring songwriters, artists and executives across the industry. Read more November 04, 2024 Grammy Award-Winning Songwriters Coco Jones, Autumn Rowe and Emmy-Winning Composer Amanda Jones To Be Honored at 2024 ASCAP Women Behind the Music on Tuesday, November 12 in Los Angeles These trailblazing women join an illustrious group of previous honorees that includes songwriters, artists, managers, attorneys, label executives and music publishers. Read more October 31, 2024 ASCAP Foundation Deems Taylor/Virgil Thomson Awards Recognize Journalists for Works About Music Legends Donna Summer, Henry Threadgill, John Williams, Miles Davis, Sinéad O’Connor and More The winners of the 55th annual ASCAP Foundation Deems Taylor/Virgil Thomson Awards for outstanding books, articles, liner notes and broadcast programs on the subject of music give fans, readers and scholars rich new insights on legends of pop, film, jazz, country, concert music and more. Read more October 30, 2024 ASCAP and SACEM Announce Multi-Initiative Strategic Alliance The two Societies will leverage their investments in state-of-the-art data infrastructure and human expertise by collaborating in a myriad of ways to benefit their music creator and publisher members. Read more October 23, 2024 Beloved Music Industry Executive and ASCAP Chief Creative Officer John Titta Has Died After a Two-Year Battle with Cancer John Titta, Executive Vice President and Chief Creative Officer at ASCAP, has died after a two-year battle with cancer. “All of us at ASCAP are heartbroken,” commented ASCAP President & Chairman, songwriter Paul Williams. “John Titta was one of a kind, and truly one of the most beloved music industry executives I have known, with deep ties to songwriters across genres and generations. John – you had a song in your heart always, and you will always be in our hearts. I miss you already.” Read more October 16, 2024 Venues Refuse to Pay Songwriters While Profiting from Their Music ASCAP takes action to protect its songwriters' livelihoods with legal action against 11 venues nationwide for consistently performing musical works without permission. Read more October 10, 2024 2024 ASCAP Lab “AI and the Business of Music” Challenge Teams Revealed The ASCAP Lab, ASCAP’s innovation initiative, announces the cohort for the 2024 AI and the Business of Music Challenge. Read more September 29, 2024 Matthew West Named ASCAP Christian Music Songwriter of the Year; Brandon Lake Named Christian Music Songwriter/Artist of the Year at 47th ASCAP Christian Music Awards Celebration “Thank God I Do” claims top song honor, and Essential Music Publishing is named Publisher of the Year. Read more September 27, 2024 ASCAP Unveils Songwriters Selected for GPS Project Class of 2024 The ASCAP Nashville membership team, helmed by ASCAP Vice President Mike Sistad, designed the program to help promising, unsigned songwriters, who have been identified by the ASCAP team as ready for a publishing deal, take the next step in their career. Read more August 06, 2024 Joe Block, ASCAP Foundation Herb Alpert Young Jazz Composer Award Recipient, to Perform at DC Jazz Festival on August 31 Celebrating 20 years, the 2024 DC JazzFest takes place August 28-September 1. The festival opens its stage to dozens of exceptional jazz artists and will feature a performance by Joe Block’s Open Heart Trio on August 31 at 2:30 PM on its Transit Stage. Read more July 09, 2024 ASCAP Empowers Music Creators to Vote in Major Election Year as Congressional Debate Focuses on Artificial Intelligence In partnership with HeadCount, the ASCAP Citizen Campaign returns with top ASCAP members Leon Thomas, Madison Love, Jimmy Jam, Pinar Toprak and more encouraging the music community to vote. Read more July 08, 2024 The ASCAP Foundation Launches “In Her Voice” Scholarship for Female-Identifying Music Creators The scholarship will support creators and performers who identify as female and aspire to make their voices heard through songwriting. Read more June 28, 2024 2024 ASCAP Top Rhythm & Soul Music Award Winners Include Songwriter of the Year Lil Baby, Song of the Year “Snooze” and Publisher of the Year Warner Chappell Multi-platinum, Grammy-winning international icon Usher receives ASCAP Voice of the Culture Award, and 2024 Best New Artist Grammy winner Victoria Monét accepts ASCAP Vanguard Award. Read more June 25, 2024 Venues Refuse to Pay Songwriters While Profiting from Their Music ASCAP seeks to protect its songwriters' livelihoods with legal action against 13 venues nationwide for performing musical works without permission. Read more June 18, 2024 ASCAP Unveils London Music Award Winners: Lostboy Receives Four Awards Including Songwriter of the Year Rema scoops two gongs including Song of the Year for Afrobeats smash “Calm Down," Daniel Pemberton wins Top Box Office Film of the Year for Spider-Man Across the Spider-Verse and Steve Mac captures Top Hot Dance/Electronic Song for “Baby Don’t Hurt Me.” Read more June 06, 2024 Kenya Grace to Receive ASCAP Global Impact Award; Cian Ducrot to Be Honored with ASCAP Vanguard Award Rising singer-songwriters Kenya Grace and Cian Ducrot will receive two of the community’s most prestigious honours, the ASCAP Global Impact Award and the ASCAP Vanguard Award, respectively. Read more June 05, 2024 The ASCAP Foundation Names Recipients of 2024 Morton Gould Young Composer Awards The program encourages talented young creators of concert music ranging in age from 14 to 29. Read more May 30, 2024 Multi-Platinum, Grammy-Winning International Icon Usher to Receive ASCAP Voice of the Culture Award at 2024 Celebration of ASCAP Top Rhythm & Soul Music Songwriters and Publishers, June 27 in Los Angeles 2024 Best New Artist Grammy winner Victoria Monét will accept the ASCAP Vanguard Award. Read more May 10, 2024 Composers for Spider-Man: Across the Spider-Verse, The Last of Us, Only Murders in the Building, American Symphony and Star Wars Jedi: Survivor Honored with ASCAP Composers’ Choice Awards The 2024 ASCAP Screen Music Awards recognize 93 prominent film & TV composers. Read more May 09, 2024 41st Annual ASCAP Pop Music Awards Winners Include Songwriters of the Year Olivia Rodrigo and Daniel Nigro; Song of the Year “Calm Down” and Publisher of the Year Universal Music Publishing Group British avant-pop and electronic sensation Charli XCX receives the ASCAP Global Impact Award for the enduring worldwide popularity of her music. Read more April 18, 2024 The ASCAP Foundation Musical Theatre Fest Returns to Wallis Annenberg Center for the Performing Arts with Focus on Music for Film and TV Animation, May 14 -21 With support from the Gary Geld Musical Theatre Foundation, the event showcases opportunities for musical theatre songwriters and composers, whose ability to craft music that establishes mood, develops characters and advances narratives is essential for animation. Read more April 04, 2024 Avant-Pop and Electronic Superstar Charli XCX to Receive ASCAP Global Impact Award The pioneering pop phenomenon joins a select group of acclaimed musical hitmakers who have previously received the award, including Lana Del Rey and Hillary Lindsey. Read more April 02, 2024 Keityn Takes 2024 ASCAP Latin Music Songwriter of the Year Award for 2nd Year in a Row Carlos Vives is honored with ASCAP Founders Award, Feid is named Latin Songwriter/Artist of the Year, “La Bebé (Remix)” wins ASCAP Latin Song of the Year and Universal Music Publishing Group Scores ASCAP Latin Publisher of the Year. Read more March 19, 2024 Documentary Short on 2023 ASCAP Lab Music and AI Challenge Premieres March 20 on YouTube: "Prelude in AI Major: Crafting a Creator-First Future for Music & AI" On the heels of tomorrow’s documentary release, the ASCAP Lab and NYC Media Lab are officially announcing the fifth consecutive year of the Challenge with the launch of the 2024 ASCAP Lab Challenge: AI and the Business of Music. Read more March 18, 2024 The ASCAP Foundation Announces Inaugural Librettist Workshop May 18-21, 2024 Submissions are now being accepted and will be considered for this workshop taking place in Los Angeles. The deadline for submissions is April 1, 2024. Read more March 11, 2024 The ASCAP Foundation Announces 2024 Herb Alpert Young Jazz Composer Award Recipients Established in 2002, the program recognizes gifted young jazz composers up to the age of 30. It carries the name of the great trumpeter and ASCAP member Herb Alpert in recognition of The Herb Alpert Foundation’s multi-year financial commitment to the program. Read more March 07, 2024 ASCAP Connects Music Creators at SXSW Songs Writing Camp and at ASCAP SXSW Happy Hour on March 14 ASCAP representatives will also speak on several panels during the week. Read more March 05, 2024 Venues Refuse to Pay Songwriters While Profiting from Their Music ASCAP seeks to protect its songwriters' livelihoods with legal action against 13 venues nationwide for performing musical works without permission. Read more March 04, 2024 Acclaimed Colombian Singer-Songwriter Carlos Vives to Receive Prestigious ASCAP Founders Award The ASCAP Founders Award is presented to songwriters and composers who have made pioneering contributions to music by inspiring and influencing their fellow music creators. Read more February 28, 2024 ASCAP Delivers Record-Breaking Financial Results With $1.737 Billion In Revenues, Up 14.1% From The Prior Year ASCAP, which marked its 110th year on February 13, also announced several top music creators joining the ASCAP family, including A-list songwriter and producer Jack Antonoff, viral pop star PinkPantheress, Jared Leto and Shannon Leto of alternative rock chart-toppers 30 Seconds to Mars, and South African singer-songwriter Tyla. Read more February 22, 2024 Top Film, TV and Video Game Composers Nominated by Peers for 2024 ASCAP Composers’ Choice Awards Chosen by the ASCAP composer community, winners will be revealed on May 9 during an exclusive party celebrating the winners of the 2024 ASCAP Screen Music Awards in Los Angeles. Read more February 21, 2024 Jermaine Dupri, DOMi & JD BECK, Maggie Lindemann, Sam Hollander and More Industry-Leading Talent Take the Stage for ASCAP 2024 Membership Meeting Celebrating 110 years of ASCAP's creator-first leadership and ethos, the membership meeting will feature performances, panels and presentations aimed at bringing the ASCAP community together for inspiration, education and a report on ASCAP’s historic 2023 financial results. Read more January 16, 2024 Sundance ASCAP Music Café at Acura House of Energy Showcases the Power of Music in Film with Composer Conversations and Live Musical Performances From the DIG! XX Dandy Jonestown Revue (with Brian Jonestown Massacre & The Dandy Warhols), Plus Evan Bartels, Fantastic Cat, Mary Scholz and Ogi on January 21 and 22 Together with Acura, longtime Presenting Sponsor and Official Vehicle of Sundance Film Festival, the Café will feature live music performances and interviews with t'''
