["https://ascap.com/help/my-ascap-membership/join-as-publisher"]
title = "Joining ASCAP as a Writer? Here’s Why You Should Join as a Publisher, Too."
description = "Joining ASCAP as a writer is a great first step for your music career. Before you finalize that application, make sure to consider joining as a music publisher, too."
full_description = '''Joining ASCAP as a Writer? Here’s Why You Should Join as a Publisher, Too. Joining ASCAP as a writer is a great first step for your music career. Before you finalize that application, make sure to consider joining as a music publisher, too. A publisher is a person or entity that controls how a musical composition is used and monetized. Publishers pitch the works that they represent to recording artists and music supervisors and license them for film & TV, as well as other uses. They also collect multiple revenue streams for their writers, including mechanical royalties (e.g., from the sale or download of recordings), sheet music sales and more. If you write music, US Copyright law gives you certain rights, including the rights of a music publisher. Here are five reasons why it may make sense for you to become an ASCAP publisher member. 1. You could be missing out on $$$ without one. When ASCAP distributes royalties for a performance of your music, 50% goes to the writer(s), and 50% to the publisher(s). Many ASCAP writers sign publishing deals with professional music publishing companies, who work together with the writer to find new opportunities for their music, and handle the administration of their publishing royalties. But the majority of ASCAP writers self-publish their music. If you haven’t signed a publishing deal and you want to collect your publisher’s share, you will need to set up a publishing company with ASCAP. 2. It’s easy. All you need to become an ASCAP publisher is a mailing address, email address, US tax ID number and about 10 minutes. You don’t even need to set up a corporation or fictitious business name to join - if you choose the “Individual/Sole Proprietor” option, you can simply enter your Social Security Number and you are good to go. 3. It's free. Joining ASCAP as a writer member is free. If you join as a writer and publisher at the same time, we'll waive your publisher application fee, too! Keep in mind this is a temporary policy. Get more info in the "Joining ASCAP" FAQ in our Help Center. 4. Set yourself up for the future. Whatever the future holds for your music career - if you write alone or with others, if you self-publish or sign a co-publishing deal - setting up an ASCAP publishing company now will help you take advantage of opportunities as they come. 5. You can name it (almost) whatever you want. Starting a publishing company is more than just a great business idea. Since each publishing company name has to be different than every other publishing company name in the world, it is also an opportunity to flex your creative muscles. Need some inspiration? Check out 25 of our favorite ASCAP publishing company names.'''
year_published = 2025
