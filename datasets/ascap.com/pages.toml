["https://ascap.com/news-events/Podcast-Versed/versed-landing"]
title = "VERSED: The ASCAP Podcast | songwriting, composing, producing, technology, music, career, royalties"
description = "VERSED is a monthly podcast illuminating the heart and soul of music. Featuring in-depth interviews with songwriters and composers, plus tips and insights to help you navigate your music career. Brought to you by ASCAP, home of the world's greatest music creators."
full_description = "VERSED: The ASCAP Podcast LISTEN & SUBSCRIBE VERSED is a monthly podcast illuminating the heart and soul of music. Featuring in-depth interviews with songwriters and composers, plus tips and insights to help you navigate your music career. Brought to you by ASCAP, home of the world's greatest music creators. ******** EPISODE 42: Behind the Songs with Justin Tranter For the past decade, megahit songwriter Justin Tranter has penned hit after beloved hit for massive acts like Chappell Roan, Selena Gomez, Imagine Dragons, Fall Out Boy, Justin Bieber, Ariana Grande, Maroon 5, Lady Gaga, Dua Lipa, Janelle Monáe – the list goes on and on. Justin’s keen ear for catchy hooks, resonant lyrics and an endless supply of infectious melodies has secured their near constant presence on the top of the charts for the past 10 years – and their ambitions only grow stronger with every smash, most recently Chappell Roan’s undeniable anthem “Good Luck, Babe!” nominated for “Song of the Year” at the 2025 Grammy Awards. To celebrate their joining the ASCAP family, Justin recently joined us at NightBird Recording Studio for a behind the song look at some of the most beloved hits from this dynamic songwriting talent, outspoken activist and community advocate. We also picked their brain about their songwriting process, the issues facing songwriters today and why they joined ASCAP. + Read the show notes and listen to Ep. 42"
