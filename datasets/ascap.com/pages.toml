title = "ASCAP Learning Center | Help, ASCAP, songwriting, composing, publishing, money, music business, FAQs"
description = "There’s always more to know as a music creator. At ASCAP, we’re dedicated to helping you learn and supporting your music creator journey. Looking to sharpen your skills or understand the music biz better? ASCAP’s got you covered."
full_description = '''<div class="no-js"> This page requires Javascript to be enabled. Please enable javascript in your browser preferences. </div> ASCAP Learning Center At ASCAP, we’re dedicated to helping you learn and supporting your music creator journey. Looking to sharpen your skills or understand the music business better? We've got you covered. MUSIC BIZ 101 Quick insights and deep dives into how the money flows in the music industry, and how you can get your piece of the pie. Get $$$ smart TIPS FOR SONGWRITERS Advice and inspiration from ASCAP songwriters and producers, for ASCAP songwriters and producers. Write now COMPOSER ADVICE ASCAP composers offer candid insights into the craft and business of scoring for the screen, the concert stage and beyond. Know the score MUSIC BIZ 101 Music Biz 101 Videos Watch Sorting Submissions: How to Pitch Your Music Do your homework How to Earn ASCAP Royalties for Your Music on YouTube Read more Five Tips for Saving Money Between Gigs and Royalty Checks Save on What It Takes to Get a Publishing Deal What does it take for a songwriter to get signed to a publishing deal? What does a publisher look for before signing a songwriter? Nashville-based music biz veteran LeAnn Phelan has spent 25+ years helping music creators reach their potential. In this video, she shares four key questions that publishers ask when they’re considering whether or not to work with a songwriter creatively. Read more TIPS FOR SONGWRITERS Songwriter Tips Videos Watch What Co-Writers Need to Know About Songwriting Splits Divide and conquer RJD2: How to Turn Your Loops into Full Tracks Beat it 15 Essential Rhyme Schemes for Songwriters It's rhyme time COMPOSER ADVICE Composer Advice Videos Watch Scoring with Cheese Cobra Kai composers explain how to use eye-rolling, over-the-top sounds tastefully Wax on, wax off Inspiring, educational video conversations about the craft and business of music for screens Binge-watch now How to Make the Most of Your Recording Session with Live Musicians Read more'''
