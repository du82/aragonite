full_description = '''<div class="no-js"> This page requires Javascript to be enabled. Please enable javascript in your browser preferences. </div> ASCAP Team ASCAP employees are proud to be part of a community of music creators and supporters. Collectively, we are experts in the music and media businesses, technology, licensing and copyright. Individually, we are music fans, and passionate about helping those that create music. Elizabeth Matthews Chief Executive Officer Elizabeth Matthews is Chief Executive Officer of ASCAP, the American Society of Composers, Authors & Publishers (ASCAP), a membership association of m... Read more Business & Legal Affairs Clara Kim Executive Vice President, Chief Legal & Business Affairs Officer Greg Morgado Executive Vice President & Deputy General Counsel, Business & Legal Affairs Mina Farbood Senior Vice President, Business & Legal Affairs Alex Grout Senior Vice President, Membership and Business & Legal Affairs Wayne Josel Senior Vice President, Business & Legal Affairs Richard Reimer Senior Vice President, Business & Legal Affairs Lale Uner Senior Vice President, Business & Legal Affairs and Distribution Innovation Jackson Wagener Senior Vice President, Business & Legal Affairs Bill Ferullo Vice President, Business & Legal Affairs Julia Fisherman Vice President, Business & Legal Affairs Leslie Greene Vice President, Business & Legal Affairs Sam Mosenkis Vice President, Business & Legal Affairs Andrea Sobolewski Counsel, Business & Legal Affairs Finance Daniel Marrone Senior Vice President, Finance & Operations Jasmine Rosner Senior Vice President, Finance & Controller Elizabeth Valentine Vice President, Assistant Controller International Affairs Tony Dunaif Executive Vice President & Head of International Affairs Licensing Stephanie Ruyle Executive Vice President, Head of Licensing Matthew J. DeFilippis Senior Vice President, Licensing Mark Sperling Senior Vice President, Revenue Strategy & Planning Tim Daugherty Senior Vice President, General Licensing John Bonaccorso Vice President, General Licensing Hayley Dukes Vice President, Licensing Andrea Brady Assistant Vice President, General Licensing New Sales Michele Wright Assistant Vice President, General Licensing Marketing & Communications Lauren Iossa Executive Vice President, Chief Marketing Officer, Marketing & Communications Pam Workman Senior Vice President, Marketing & Communications Erik Philbrook Vice President & Creative Director, Marketing & Communications Cat Seligman Vice President, Senior Marketing Strategist, Marketing & Communications Josie Diels Vice President, Head of Events Cathy Halgas Nevins Assistant Vice President, Public Relations, Marketing & Communications Etan Rosenbloom Assistant Vice President, Marketing & Communications Kate Cordova Senior Director of Social Media, Marketing & Communications Membership Group REST IN PEACE: John Titta Executive Vice President, Membership & Chief Creative Officer October 23, 2024: John Titta, Executive Vice President and Chief Creative Officer at ASCAP, has died after a two-year battle with cancer. “All of us at ASCAP are heartbroken,” commented ASCAP President & Chairman, songwriter Paul Williams. “John Titta was one of a kind, and truly one of the most beloved music industry executives I have known, with deep ties to songwriters across genres and generations. John – you had a song in your heart always, and you will always be in our hearts. I miss you already.”ASCAP CEO Elizabeth Matthews added, “John Titta’s warmth, his humor, his kindness, his love of family, and his passion for music were infectious. He was a north star for me personally, and for all of us at ASCAP. John was instrumental in the success of so many songwriters throughout his storied career, and he shared his love of music and songwriters so freely that we all felt the joy. All of us in the ASCAP family are devastated by his passing. Titta – we love you.”John is survived by his wife Lana Titta, his sons Alex and Julian, his daughter Martine, his grandson Mason, and his brother Michael. The family is planning a private service to be followed by a memorial at a later date.John was a lifelong resident of Staten Island, where he graduated from Wagner College with a degree in music. In addition to his position at ASCAP, Titta was a Board member of the Songwriters Hall of Fame.John Titta started his life in music as a musician, songwriter and music teacher. He began his publishing career with Screen Gems/EMI Music as Professional Manager, signing such acts as Surface and The Smithereens. He worked with legendary songwriters Carole King and Lou Reed, and had songs covered by Tina Turner, Grover Washington Jr., Alice Cooper, Joan Jett and Dave Edmunds.He then moved to PolyGram Music Publishing as Vice President of A&R, signing artists Bon Jovi, Richie Sambora, Pearl Jam, Brian McKnight, k.d. lang, Billy Ray Cyrus and songwriter Jimmy Webb. He was also responsible for individual hit songs including “Save the Best for Last” by Vanessa Williams and “The Folks That Live on the Hill” by Tony Bennett. Titta was credited for his A&R work on the compilation album Two Rooms: Celebrating the Songs of Elton John and Bernie Taupin and multiple movie soundtracks, such as Young Guns II: Blaze of Glory, Days of Thunder, Scream, Bruce Almighty, Varsity Blues and more.From 1993 - 2006, Titta served as Senior Vice President / General Manager of Warner Chappell Music, Inc. in New York, where he signed such acts as Trey Songz, Fat Joe, Missy Elliott, Kid Rock, Collective Soul, India.Arie, Gavin DeGraw, Cassandra Wilson, Dan Wilson (Semisonic), Uncle Kracker, Shaggy, Simple Plan, Duane Eddy and Bruce Hornsby. He also scored success with individual hits such as the Grammy Award-winning “Smooth” by Santana feat. Rob Thomas, “Cry Me a River” by Justin Timberlake, “Lean Back” by Terror Squad, “Waiting for Tonight” by Jennifer Lopez, “One of Us” by Joan Osborne, “I Love You Always Forever” by Donna Lewis, “Pon de Replay” by Rihanna and many more, including songs recorded by Celine Dion, Ricky Martin, Patty Loveless and Marc Anthony.In 2006, Titta struck out on his own to become President and CEO of his independent company, MPCA Music Publishing and Recordings, that featured the catalog of blues legend Robert Johnson and songs by Sammy Cahn and Jack Wolf, among others, with songs recorded by Led Zeppelin, Frank Sinatra, Billie Holiday, John Mayer, Bob Dylan, Cyndi Lauper, Aretha Franklin and more.He has performed on albums by Ringo Starr and Gizelle D’Cole and has played with Michael McDonald, The Doobie Brothers, Duane Eddy, Richie Sambora and Omi.Always an avid supporter of songwriters and their rights, Titta moved to ASCAP in 2013, where he served as Executive Vice President and Chief Creative Officer until his passing. At ASCAP, he led the entire membership team and was responsible for signing and working with all of ASCAP’s members, including the top names in music across genres and generations.Other accomplishments include his work with Bon Jovi keyboardist David Bryan on the Tony Award-winning musical Memphis, and producer and A&R work on albums by Dionne Warwick, Todd Rundgren, Melinda Doolittle, Smash Mouth and Donny & Marie Osmond.In lieu of flowers, donations can be made to the John and Rose Titta Fund at The ASCAP Foundation, which John set up in memory of his parents, and which is used to help children on the autism spectrum through music programs. Anyone wishing to make a contribution in honor of John Titta to The John and Rose Titta Fund at The ASCAP Foundation, can donate here, or by sending a check to The ASCAP Foundation, 250 West 57th Street, New York, NY 10107. In the memo section write: John and Rose Titta Fund. Read more Nicole George-Middleton Senior Vice President, Membership, ASCAP & Executive Director, The ASCAP Foundation Gabriela Gonzalez Senior Vice President, International Affairs and Latin Membership Loretta Muñoz Assistant Vice President, Membership Membership Group - Film & TV/Visual Media Shawn LeMone Senior Vice President, Film & TV/Visual Media Michael Todd Assistant Vice President, Film & TV/Visual Media Jennifer Harmon Assistant Vice President, Film & TV/Visual Media Amanda Shoffner Senior Director, Film & TV/Visual Media Membership Group - Latin Karl Avanzini Assistant Vice President, Latin Membership Roberto Rivera Senior Director, Latin Membership Jorge F. Rodriguez Senior Director, Latin Membership Luis Castro Director, Latin Membership Membership Group - London Simon Greenaway Vice President, Membership UK/Continental Europe David Ryan Jordan Senior Director, Membership UK/Continental Europe Membership Group - Musical Theatre & Cabaret Michael Kerker Vice President, Musical Theatre & Cabaret Membership Group - Nashville Mike Sistad Vice President, Nashville Kele Currier Assistant Vice President, Strategic Services, Nashville Evyn Mustoe Assistant Vice President, Nashville Duane Hobson Associate Director, Nashville Emilia James Manager, Nashville Membership Group - Pop/Rock Marc Emert-Hutner Vice President, Pop/Rock Jody Klein Assistant Vice President, Membership Jason Silberman Assistant Vice President, Pop/Rock Kaitlyn Sugarman Associate Director, Pop/Rock Membership Group - Rhythm & Soul Jonathan Jones Assistant Vice President, Rhythm & Soul J. Marie Jones Director, Rhythm & Soul Jason Reddick Director, Rhythm & Soul Membership Group - Concert Cia Toscanini Vice President, Concert Music Michael Spudic Membership Representative, Concert Music Operations Brian Roberts Executive Vice President, COO & CFO Peter Boyle Executive Vice President & Chief Economist Kevin Neal Senior Vice President, Distribution & Repertory Seth Saltzman Senior Vice President, Global Services Project Leader Shefalee Shah Head of Engineering Irene Abramsky Vice President, Software Engineering Pratap Sanikommu Vice President, Software Engineering Gyda Coley-Macklin Assistant Vice President, Distribution Administration Strategy & Digital Products Nicholas Lehman Executive Vice President, Chief Strategy & Digital Officer Brooke Eplee Senior Vice President, Strategy & Business Development Ed Razzano Senior Vice President, Administration Services Michelle Rivera Senior Vice President, Product and Project Management Jason Wallace Vice President, Business Development Elizabeth Matthews Chief Executive Officer Close Modal Elizabeth Matthews is Chief Executive Officer of ASCAP, the American Society of Composers, Authors & Publishers (ASCAP), a membership association of more than one million US composers, songwriters, lyricists and music publishers of every kind of music. ASCAP licenses the public performance of its members' music, collects license fees, tracks performances and distributes to its members royalties based on their performances. Under her leadership, ASCAP has achieved record-breaking financial results, topping $1 billion in revenue for eight consecutive years and driving record-high distributions of royalties to ASCAP songwriters, composers and music publishers. ASCAP is the only US performing rights organization that operates on a not-for-profit basis, and delivers nearly 90 cents on every dollar collected back to its members as royalties.Beth has been instrumental in leading ASCAP’s advocacy efforts to modernize music licensing. She has spearheaded a transformative six-year strategic plan to meet the future needs of ASCAP’s members and licensing partners, and has closed major deals with key licensees, including top streaming, broadcast, audio and audio-visual licensees that are yielding higher royalties for ASCAP songwriters, composers and music publishers. Under Beth’s leadership, ASCAP has launched pioneering transparency initiatives and technology innovations and has annually processed trillions of performances of the more than 18 million works in the ASCAP repertory. Beth has become an industry leader on Artificial Intelligence (AI), with ASCAP as the only US PRO to formally adopt principles that will protect songwriters and guide the organization’s decisions on the technology. Other AI-related initiatives she has implemented include creator education sessions, start-up incubation and policy advocacy on Capitol Hill. She has earned a spot on Billboard’s Power 100 list seven times since 2016 and has been named as one of Billboard’s Most Powerful Executives in its Women in Music issue. She also serves on the Board of Directors for the International Confederation of Societies of Authors and Composers (CISAC) as well as on the Board of the Songwriters Hall of Fame, among others.Beth joined ASCAP in 2013 as Executive Vice President and General Counsel, overseeing the ASCAP Business & Legal Affairs department. In that role, she oversaw business affairs, litigation, strategic alliances, and legislative and copyright policy matters. Previously, she worked at Viacom Media Networks (formerly MTV Networks), where she held the position of Executive Vice President & Deputy General Counsel. She managed and oversaw the VMN Business and Legal Affairs teams covering Advertising, Content Distribution and Marketing, New Business Development, Global Digital and New Media and the VMN Mergers and Acquisitions Pipeline, Research and various Ancillary Businesses. Beth was also responsible for drafting, structuring, reviewing and negotiation of strategic and complex commercial transactions across Viacom Media Networks’ programming services, including MTV, Comedy Central, VH1, CMT, Spike and Nickelodeon, among others. Prior to Viacom Media Networks, Matthews worked in the Intellectual Property and Corporate Groups for Chadbourne & Parke and the Business Technology Group for Milbank, Tweed, Hadley & McCloy. Beth received her BA from Purdue University and her JD from Emory School of Law. Clara Kim Executive Vice President, Chief Legal & Business Affairs Officer Greg Morgado Executive Vice President & Deputy General Counsel, Business & Legal Affairs Mina Farbood Senior Vice President, Business & Legal Affairs Alex Grout Senior Vice President, Membership and Business & Legal Affairs Wayne Josel Senior Vice President, Business & Legal Affairs Richard Reimer Senior Vice President, Business & Legal Affairs Lale Uner Senior Vice President, Business & Legal Affairs and Distribution Innovation Jackson Wagener Senior Vice President, Business & Legal Affairs Bill Ferullo Vice President, Business & Legal Affairs Julia Fisherman Vice President, Business & Legal Affairs Leslie Greene Vice President, Business & Legal Affairs Sam Mosenkis Vice President, Business & Legal Affairs Andrea Sobolewski Counsel, Business & Legal Affairs Daniel Marrone Senior Vice President, Finance & Operations Jasmine Rosner Senior Vice President, Finance & Controller Elizabeth Valentine Vice President, Assistant Controller Tony Dunaif Executive Vice President & Head of International Affairs Stephanie Ruyle Executive Vice President, Head of Licensing Matthew J. DeFilippis Senior Vice Pre'''
