title = "ASCAP Citizen"
description = "Your music has the power to change the world. Join the ASCAP Citizen campaign to make sure you're exercising your right to be heard in our democracy, and help encourage others to do the same."
full_description = '''<div class="no-js"> This page requires Javascript to be enabled. Please enable javascript in your browser preferences. </div> We All Benefit When Music Creators Vote As the only US PRO founded and governed by a Board of music creators elected by our members, ASCAP has democracy in our DNA. State and federal laws dictate how music creators, like you, license your work and often how it is valued in the marketplace – and that has a direct impact on how much you get paid. It’s unbelievably important to stay engaged with democracy so that you have a voice in Congress and that starts with voting. We’ve teamed up with our friends at HeadCount to make sure you and your communities are ready to vote in the 2024 election. ASCAP Empowers Music Creators to Vote in Major Election Year as Congressional Debate Focuses on Artificial Intelligence Top ASCAP members Leon Thomas, Madison Love, Jimmy Jam, Pinar Toprak and more encourage music community to vote. Read More var _emailSignUpFormdataSourceId = "57b0ffde-0316-4001-903c-1567efe059f9"; ASCAP Citizen Alerts Be the first to know about policy debates that directly impact your career. Sign up for the ASCAP Advocacy email list. Email Address Submit ga('send', 'event', 'ascap-citizen', 'Email Subscription -signup up for the first time - Module', 'impression'); $("#emailAddress").on("change", function() { ga('send', 'event', 'ascap-citizen', 'Email Subscription -signup up for the first time - Module', 'text entered'); }); $("#EmailSignUp").on("click", function () { ga('send', 'event', 'ascap-citizen', 'Email Subscription -signup up for the first time - Module', 'click - submit'); }); $("#EmailSignUp").on("PrefCenter:EmailVerified", function () { ga('send', 'event', 'ascap-citizen', 'Email Subscription -signup up for the first time - Module', 'submit-success'); }); $("#EmailSignUp").on("PrefCenter:EmailError", function (arg1, arg2) { ga('send', 'event', 'ascap-citizen', 'Email Subscription -signup up for the first time - Module', 'error: ' + arg2); }); $("#EmailSignUp").on("PrefCenter:EmailAlreadySubscribed", function () { ga('send', 'event', 'ascap-citizen', 'Small Email Subscription Module - already subscribed at this email', 'impression'); }); $("#EmailSignUp").on("PrefCenter:SubmitStart", function () { $("#EmailSignUp span.text").text("Submitting"); $("#EmailSignUp span.c-spinner-dots").addClass("in-progress"); }); $("#EmailSignUp").on("PrefCenter:SubmitEnd", function () { $("#EmailSignUp span.text").text("Submit"); $("#EmailSignUp span.c-spinner-dots").removeClass("in-progress"); }); ASCAP Citizen Pledge As creators, we know music has the power to bring people together. When music creators make our voices heard in our democracy, it inspires our elected officials to come together and find common ground on issues that are critical to creators' lives and livelihoods. Let's show our elected officials that they should listen to more than just our songs -- because Music Creators Vote. function toggleArrowGAFAQ(element, val) { var span = element.className; if (span.toLowerCase().indexOf("show-answer") >= 0) { ga('send', 'event', 'FAQ', 'collapse question', val.replace(",", "").replace("'","")); } else { ga('send', 'event', 'FAQ', 'expand question', val.replace(",", "").replace("'", "")); } } Frequently Asked Questions A Guide to ASCAP Citizen ASCAP Citizen FAQ What does it mean to be an ASCAP Citizen? Being an ASCAP Citizen means exercising your right to be heard in our democracy and encouraging others to do the same. It starts with voting, but it doesn’t end there. We want ASCAP members to be active citizens all year long, staying informed, engaging in civic debate and communicating with the officials elected to represent you at all levels of government. As music creators, your voice is important. And we want to help make sure your voice is heard. Why are voting and advocacy important for ASCAP members? Most people don’t realize that American songwriters, composers and music publishers are some of the most heavily regulated small business owners in the country. Roughly three-quarters of a songwriter’s income is regulated by the federal government. State and federal laws dictate how music creators, like you, license your work and often how it is valued in the marketplace – and that has a direct impact on how much you get paid. It’s important that elected officials not only understand the unique challenges facing music creators today, but also that they hear from you on a regular basis. How do I register to vote? ASCAP has partnered with HeadCount to make it easy for you to verify your voter registration status, register to vote, and find out how to vote in your state. Just go to www.headcount.org/ascap. I’m already registered to vote – what else should I do? That’s great! But first, it’s always a good idea to double-check your registration status and make sure it’s up to date. You can start that process at www.headcount.org/ascap. Once you’ve confirmed your registration, you should make a plan for how and where you are going to vote -- whether it’s in person or by mail, early or on Election Day – and make sure you’re aware of all of the relevant deadlines in your state. Finally, you can encourage others to do the same! Do I need to update my voter registration? Good question! If you’ve recently moved, you need to make sure you are registered to vote at your current address. If you’ve recently changed your name or party affiliation, you may also need to update your voter registration. You can start that process at www.headcount.org/ascap. What are the voter registration deadlines in my state? Deadlines and requirements vary by state. But the voter registration deadline for the November general election in most states is early October. You can find detailed information for your state on HeadCount’s website – just scroll down to find your state. Here are quick links to information pages for California, New York, Tennessee and Florida. What if I move around a lot and I’m not sure where I’ll be during the election? The best thing to do is to register now wherever you have a permanent mailing address. Vote in that district and bring some proof of identification and/or residency, or apply for an absentee ballot if you will be away during the election. Can I vote before Election Day? Many states allow no-excuse absentee voting by mail (which you can complete before Election Day). More than half of U.S. states offer in-person early voting as well. Visit the Headcount Early and Absentee Voting page to get more information or request an absentee ballot. What is ASCAP’s advocacy mission? Through its advocacy efforts, ASCAP strives to protect the rights of music creators and defend the value of music. In service of that mission, we often call upon our more than one million members across the country to weigh in with their elected officials on policy issues that matter most to music creators. How can I get involved and be an ASCAP Citizen year-round? Lawmakers in Washington need to hear from songwriters like you. You can be the first to know about important developments by signing up for ASCAP Advocacy alerts. We may ask you to post on social media, sign a petition or email your member of Congress or US Senator. And we’ll provide you with all the tools and information you need to be an effective ASCAP Citizen in the fight to Stand With Songwriters.'''
