["https://ascap.com/news-events/articles/2025/02/sundance2025"]
title = "Snow Business: The 2025 Sundance ASCAP Music Café Lights Up this Year’s Film Festival with Top Songwriters and Composers"
description = "As it has for over 40 years, the Sundance Film Festival took place in place in Park City, Utah in January, drawing creatives from around the world and tens of thousands of passionate movie lovers eager to share in the annual tradition of celebrating the marriage of visual art and music, storytelling and community."
full_description = "Snow Business: The 2025 Sundance ASCAP Music Café Lights Up this Year’s Film Festival with Top Songwriters and Composers By Erik Philbrook, ASCAP Editor in Chief • February 12, 2025 As it has for over 40 years, the Sundance Film Festival took place in place in Park City, Utah in January, drawing creatives from around the world and tens of thousands of passionate movie lovers eager to share in the annual tradition of celebrating the marriage of visual art and music, storytelling and community. This year’s festival showcased 94 feature-length and episodic works and 57 short films curated from a total of 15,775 submissions across different categories, including 4,138 feature-length film submissions and 484 episodic submissions. As it has for 27 years of the festival, the Sundance ASCAP Music Café celebrated music’s essential role in film and charged up this year’s audiences with two days of powerful live performances by songwriters and bands and conversations with composers and filmmakers at the Acura House of Energy. Presented in partnership with Acura, longtime Presenting Sponsor and Official Vehicle of Sundance Film Festival, the Café was packed for two consecutive days on January 26-27, and presented performances from a mix of chart-topping and up-and-coming songwriters and composers."
year_published = 2025
