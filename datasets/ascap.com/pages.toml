["https://ascap.com/news-events/articles/2024/12/year-end-billboard-charts-lit-up-2024"]
title = "ASCAP's 2024 Year in Review | Year's most successful songwriters, feat. Beyoncé, Charli xcx, Chappell Roan, Jack Antonoff, Ashley Gorley, Shaboozey & more"
description = '''ASCAP members soared in 2024. Our global family wrote the #1 songs on 41 separate Billboard Year-End charts, and released the most universally acclaimed album of the year (Charli xcx). They tied the record for longest-running #1 song in Billboard history (Shaboozey's "A Bar Song (Tipsy)"), earned more nominations than any other person in Grammy history (Beyoncé), and powered the highest-grossing Broadway film adaptation ever (Stephen Schwartz's Wicked). Thanks to our more than 1 million ASCAP members for lighting the way in 2024.'''
full_description = '''2024 Year in Review: ASCAP Members Brightened Our Year December 14, 2024 Click for our full-size ad in Billboard's year-end issue ASCAP members soared in 2024. Our global family wrote the #1 songs on 41 separate Billboard year-end charts, and released the most universally acclaimed album of the year (Charli xcx’s brat). They tied the record for longest-running #1 song in Billboard Hot 100 history (Shaboozey's "A Bar Song (Tipsy)"), broke the Spotify record for highest single-day streams (“Fortnight,” co-written by Jack Antonoff), and powered the highest-grossing Broadway film adaptation ever (Wicked, songs by Stephen Schwartz). With her staggering 11 nominations for the 67th annual Grammys, Beyoncé became the most-nominated person in Grammy history, with 99 total. From Pasek & Paul’s EGOT to Hilary Hahn’s Avery Fisher Prize, Ashley Gorley’s unprecedented 80th #1 country song to Chucho Valdés’s NEA Jazz Masters Fellowship, ASCAP members proved over and over in 2024 that their music is the most popular, and the most respected, in the world. Our ASCAP family also headlined the most spectacular live events of 2024, like Usher’s command performance at the Super Bowl, and Gojira’s metallic “bonjour” at the opening ceremony of the Paris Olympics. Meanwhile Coldplay’s Music of the Spheres World Tour set a stellar record as the most-attended tour of all time. Beyoncé, Ashley Gorley, Charli xcx, Usher Across the genre spectrum, ASCAP members reminded us of the power of music to shatter glass ceilings and change our culture. Beyoncé and Shaboozey became the first Black artists with #1 singles on the country charts. Pop phenom Chappell Roan broke through with her unforgettable queer anthem “Good Luck, Babe!” (co-written by ASCAP members Daniel Nigro & Justin Tranter). And composer Andrea Datzman became the first woman to score a Pixar feature film, Inside Out 2 – the world’s biggest box office hit of 2024. We had endless opportunities to honor ASCAP’s GOATs in 2024, too. The Songwriters Hall of Fame opened its hallowed doors to Hillary Lindsey, Timbaland and Donald Fagen & Walter Becker of Steely Dan, and Diane Warren earned its Johnny Mercer Award. Bonnie Raitt, Arturo Sandoval and The Grateful Dead were awarded Kennedy Center Honors. The beloved Finnish composer-conductor Esa-Pekka Salonen won the prestigious Polar Prize, and the Rock & Roll Hall of Fame inducted an entire pantheon of ASCAP greats: Mary J. Blige, Cher, Foreigner, Peter Frampton, Kool and the Gang, Alexis Korner, Dave Matthews Band, John Mayall, MC5, Ozzy Osbourne and A Tribe Called Quest, plus ASCAP member Suzanne de Passe with the Ahmet Ertegun Award. Thanks to our more than 1 million ASCAP members for lighting the way in 2024 with your chart-topping, record-breaking music. (l-r) Jack Antonoff, Kenya Grace, Tommy Richman, Noah Sebastian (Bad Omens), Xavi ASCAP MEMBERS ON THE BILLBOARD 2024 YEAR-END SONGWRITER & PRODUCER CHARTS JACK ANTONOFF | #1 Hot 100 Producers KENYA GRACE | #1 Hot Dance/Electronic Songwriters TOMMY RICHMAN | #1 Hot R&B Songwriters NOAH SEBASTIAN | #1 Hot Hard Rock Songwriters & Producers XAVI | #1 Hot Latin Songwriters 21 Savage 310babii Aaron Dessner AJ Correa Ammo Amy Allen Artemas Ashley Gorley Austin Nivarel Beyoncé Bnyx Brad Petering Brandon Lake Cardi B Chakra Chalko Chappell Roan Charli xcx Chris Stapleton Cirkut Cody Quistad Colby Wedgeworth Connor McDonough Cris MJ Daniel Nigro Dani Dani Blau Dann Huff Danny L. Harle The Dare David Baron David Guetta Deryck Whibley Digital Farm Animals Don Gilmore Dua Lipa Etdrick Bohannon Evan Blair Feid Frank King Gabe Simon Gale Gidi Hunter Phelps Ilya J-Kwon Jared Marc Jean-Baptiste Kouame Jessi Alexander Joakim Karlsson Joe “Capo” Kent Johnny Marks Jonah Roy Jonathan Zibi Josh Holiday J Lloyd Josiah Queen Jowan Kacey Musgraves Keith Thomas Keityn Kellie Gamble Leon Thomas Louis Bell Lumi Athena Mannyvelli Mark Hoppus Matthew West Maurice White Max Martin Micah Nichols Mike Elizond