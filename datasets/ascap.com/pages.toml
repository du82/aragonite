description = "The ASCAP Legislative Fund for the Arts (ALFA) is a political action committee, or PAC, formed for the purpose of protecting the rights of music creators and furthering the interests of songwriters, composers and publishers in Washington."
full_description = "The ASCAP Legislative Fund for the Arts (ALFA) is a political action committee, or PAC, formed for the purpose of protecting the rights of music creators and furthering the interests of songwriters, composers and publishers in Washington. ALFA plays an instrumental role in our efforts to educate candidates and members of Congress on the music performing rights industry. The PAC allows us to engage with members of Congress using a united, collective voice to pursue our common goals. Through this united voice, we work to elevate ALFA’s presence and name recognition, which helps to build relationships with our leaders in Congress and aid in beneficial and thoughtful policy-making. Thank you in advance for your support. Support Music Questions about the ASCAP Legislative Fund for the Arts? Contact: Haley Buske 212-621-8372 or hbuske@ascap.com"
