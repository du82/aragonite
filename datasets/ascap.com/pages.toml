["https://ascap.com/news-events/articles/2025/01/2025-grammy-winners-beyonce-chappell-roan-dan-nigro"]
title = "2025 ASCAP Grammy winers | Beyoncé, Chappell Roan, Charli XCX, Daniel Nigro, Jon Batiste"
description = "Our global ASCAP family had an enormous night at the 67th annual Grammys, with wins in 48 categories. We celebrated major wins from Chappell Roan (Best New Artist), Amy Allen (Songwriter of the Year), Daniel Nigro (Producer of the Year) and Mustard (Record of the Year for “Not Like Us”). Beyoncé, Charli XCX and St. Vincent each racked up three honors, while Gustavo Dudamel, Samara Joy and ASCAP Board member Jon Batiste earned two apiece. Alicia Keys accepted the Dr. Dre Global Impact Award, in addition to a Grammy for the musical about her life and music, Hell's Kitchen."
full_description = '''Beyoncé, Charli XCX, Chappell Roan, St. Vincent, Amy Allen, Daniel Nigro, Mustard Lead ASCAP's Grammy Winners By Etan Rosenbloom & Sarah Finegold, Marketing & Communications • February 3, 2025 Our global ASCAP family had an enormous night at the 67th annual Grammys, with wins in 48 categories. We celebrated major wins from Chappell Roan (Best New Artist), Amy Allen (Songwriter of the Year), Daniel Nigro (Producer of the Year) and Mustard (Record of the Year for “Not Like Us”). Beyoncé, Charli XCX and St. Vincent each racked up three honors, while Gustavo Dudamel, Samara Joy and ASCAP Board member Jon Batiste earned two apiece. Alicia Keys accepted the Dr. Dre Global Impact Award, in addition to a Grammy for the musical about her life and music, Hell's Kitchen. Queen Bey has another night for the ages. Already the winningest person in Grammy history, Beyoncé earned her first Album of the Year for Cowboy Carter, which also won for Best Country Album. We were thrilled to congratulate our special merit award recipients. Rockers The Clash and hip-hop pioneer Roxanne Shante received Lifetime Achievement Awards, while jazz pianist Erroll Garner and decorated composer Tania León received Trustees Awards. The Harry Belafonte Best Song for Social Change Award went to "Deliver," co-written and performed by ASCAP member Iman Jordan. All of these were presented at the Special Merit Awards Ceremony on February 1 at the Wilshire Ebell Theatre. In addition to the awards themselves, a stunning collection of ASCAP stars took the stage to perform during the telecast, including Chappell Roan, Charli XCX, Shaboozey, St. Vincent, Chris Martin and Brad Paisley. Stevie Wonder, Cynthia Erivo, Jacob Collier and Janelle Monaé took to the stage to pay tribute to the late great ASCAP writer-producer-composer, Quincy Jones. It was a night to remember, and to be grateful for the talent, strength and resilience of the music creator community. Congratulations to ALL of our winners on another phenomenal year at the Grammys! Record of the Year Award to the Artist(s), Album Producer(s), Recording Engineer(s), and/or Mixer(s), and Mastering Engineer(s) if other than the artist. "Not Like Us" Mustard, producer; Nicolas de Porcel, mastering engineer Album of the Year Award to Artist(s) and to Featured Artist(s), Songwriter(s) of new material, Producer(s), Recording Engineer(s), Mixer(s) and Mastering Engineer(s) credited with 20% or more playing time of the album.) COWBOY CARTER – Beyoncé Beyoncé, Terius "The-Dream" Gesteelde-Diamant & Dave Hamelin, producers; Beyoncé, Terius "The-Dream" Gesteelde-Diamant, Dave Hamelin, S. Carter & Raphael Saadiq, songwriters Best New Artist This category recognizes an artist whose eligibility-year release(s) achieved a breakthrough into the public consciousness and notably impacted the musical landscape. Chappell Roan Producer of the Year, Non-Classical A Producer's Award. (Artists' names appear in parentheses.) (S) stands for Single, (T) stands for Track, and (A) stands for Album. Daniel Nigro • "Can’t Catch Me Now (From The Hunger Games: The Ballad Of Songbirds & Snakes)" (Olivia Rodrigo) (S) • Chappell Roan The Rise and Fall of a Midwest Princess (Chappell Roan) (A) • "girl i’ve always been" (Olivia Rodrigo) (T) • "Good Luck, Babe!" (Chappell Roan) (S) • "so american" (Olivia Rodrigo) (T) • "stranger" (Olivia Rodrigo) (T) Songwriter of the Year, Non-Classical A Songwriter's Award. (Artists' names appear in parentheses.) (S) stands for Single, (T) stands for Track, and (A) stands for Album. Amy Allen • "Chrome Cowgirl" (Leon Bridges) (S) • "Espresso" (Sabrina Carpenter) (S) • "High Road" (Koe Wetzel & Jessie Murph) (S) • "Please Please Please" (Sabrina Carpenter) (S) • "run for the hills" (Tate McRae) (S) • "scared of my guitar" (Olivia Rodrigo) (T) • "Selfish" (Justin Timberlake) (S) • "Sweet Dreams" (Koe Wetzel) (S) • "Taste" (Sabrina Carpenter) (S) Best Dance/Electronic Recording For solo, duo, group or collaborative performances. Vocal or Instrumental. Singles or tracks only. "Neverender" Vincent Taurelle, mixer Best Dance Pop Recording For solo, duo, group or collaborative performances. Vocal or Instrumental. Singles or tracks only. "Von dutch" — Charli XCX Best Dance/Electronic Album For vocal or instrumental albums. Albums only. BRAT — Charli XCX Best Rock Performance For new vocal or instrumental solo, duo/group or collaborative rock recordings. "Now and Then" — The Beatles Best Metal Performance For new vocal or instrumental solo, duo/group or collaborative metal recordings. "Mea Culpa (Ah! Ça ira!)" — Gojira & Victor Le Masne Best Rock Song A Songwriter(s) Award. Includes Rock, Hard Rock and Metal songs. A song is eligible if it was first released or if it first achieved prominence during the Eligibility Year. (Artist names appear in parentheses.) Singles or Tracks only. "Broken Man" — Annie Clark, songwriter (St. Vincent) Best Rock Album For albums containing greater than 75% playing time of new rock, hard rock or metal recordings. Hackney Diamonds — The Rolling Stones Best Alternative Music Performance For new vocal or instrumental solo, duo/group or collaborative Alternative music recordings. "Flea" — St. Vincent Best Alternative Music Album Vocal or Instrumental. All Born Screaming — St. Vincent Best R&B Performance For new vocal or instrumental R&B recordings. "Made For Me (Live On BET)" — Muni Long Best R&B Song A Songwriter(s) Award. A song is eligible if it was first released or if it first achieved prominence during the Eligibility Year. (Artist names appear in parentheses.) Singles or Tracks only. "Saturn" — Cian Ducrot, Jared Solomon & Scott Zhang, songwriters (SZA) Best Melodic Rap Performance For a solo or collaborative performance containing both elements of R&B melodies and Rap. "3" — Rapsody, featuring Erykah Badu Best Jazz Performance For new vocal or instrumental solo, duo/group or collaborative jazz recordings. "Twinkle Twinkle Little Me" — Samara Joy Best Jazz Vocal Album For albums containing greater than 75% playing time of new vocal jazz recordings. A Joyful Holiday — Samara Joy Best Large Jazz Ensemble Album For albums containing greater than 75% playing time of new large ensemble jazz recordings. Bianca Reimagined: Music for Paws and Persistence — Dan Pugach Big Band Best Latin Jazz Album For vocal or instrumental albums containing greater than 75% playing time of newly recorded material. The intent of this category is to recognize recordings that represent the blending of jazz with Latin, Iberian-American, Brazilian, and Argentinian tango music. Cubop Lives! — Zaccai Curtis Best Contemporary Instrumental Album For albums containing greater than 75% playing time of new contemporary instrumental recordings. Plot Armor — Taylor Eigsti Best Musical Theater Album For albums containing greater than 51% playing time of new recordings. Award to the principal vocalist(s), and the album producer(s) of 50% or more playing time of the album. The lyricist(s) and composer(s) of 50% or more of a score of a new recording are eligible for an Award if any previous recording of said score has not been nominated in this category. Hell’s Kitchen — Shoshana Bean, Brandon Victor Dixon & Kecia Lewis, principal vocalists; Adam Blackstone & Alicia Keys, producers (Alicia Keys, composer & lyricist) (Original Broadway Cast) Best Country Solo Performance For new vocal or instrumental solo country recordings. "It Takes A Woman" — Chris Stapleton Best Country Duo/Group Performance For new vocal or instrumental duo/group or collaborative country recordings. "II MOST WANTED" — Beyoncé Best Country Song A Songwriter(s) Award. A song is eligible if it was first released or if it first achieved prominence during the Eligibility Year. (Artist names appear in parentheses.) Singles or Tracks only. "The Architect" — Kacey Musgraves & Josh Osborne, songwriters (Kacey Musgraves) Best Country Album For albums containing greater than 75% playing time of new country recordings. COWBOY CARTER — Beyoncé Best Regional Roots Music Album For albums containing greater than 75% playing time of new vocal or instrumental regional roots music recordings. Kuini — Kalani Pe'a Best Gospel Performance/Song This award is given to the artist(s) and songwriter(s) (for new compositions) for the best traditional Christian, roots gospel, or contemporary gospel single or track. "One Hallelujah" — Tasha Cobbs Leonard & Erica Campbell, featuring Jekalyn Carr; Tasha Cobbs Leonard, songwriter Best Contemporary Christian Music Performance/Song This award is given to the artist(s) and songwriter(s) (for new compositions) for the best contemporary Christian music single or track (including pop, rap/hip-hop, Latin, or rock). "That's My King" — Taylor Agan & Kellie Gamble, songwriters Best Música Mexicana Album (Including Tejano) For albums containing greater than 75% playing time of new regional Mexican (banda, norteño, corridos, gruperos, mariachi, ranchera and Tejano) recordings. Boca Chueca, Vol. 1 — Carín León Best Global Music Performance For new vocal or instrumental Global music recordings. "Bemba Colorá" — Sheila E. Best Reggae Album For albums containing greater than 75% playing time of new reggae recordings. Bob Marley: One Love - Music Inspired By The Film (Deluxe) — (Various Artists) Best New Age, Ambient, or Chant Album For albums containing greater than 75% playing time of new vocal or instrumental new age recordings. Triveni — Wouter Kellerman & Chandrika Tandon Best Children's Music Album For albums containing greater than 75% playing time of new musical or spoken word recordings that are created and intended specifically for children. Brillo, Brillo! — Lucky Diaz And The Family Jam Band Best Compilation Soundtrack For Visual Media Award to the principal artist(s) and/or ‘in studio’ producer(s) of a majority of the tracks on the album. Award also goes to appropriately credited music supervisor(s). Maestro: Music By Leonard Bernstein – Jason Ruder, compilation producer Best Score Soundtrack For Visual Media (Includes Film And Television) Award to Composer(s) for an original score created specifically for a current motion picture, television show, or series. Dune: Part Two — Hans Zimmer, composer Best Song Written For Visual Media A Songwriter(s) award. For a song (melody & lyrics) written specifically for a motion picture, television, video game or other visual media. Singles or Tracks only. "It Never Went Away" [From American Symphony] — Jon Batiste & Dan Wilson, songwriters (Jon Batiste) Best Music Film For concert/performance films or music documentaries. Award to the artist, video director, and video producer. American Symphony — Jon Batiste Best Recording Package For the best artistic package of an album. BRAT — Charli xcx, art director (Charli xcx) Best Instrumental Composition A Composer's Award for an original composition (not an adaptation) first released during the Eligibility Year. Singles or Tracks only. "Strands" — Pascal Le Boeuf, composer (Akropolis Reed Quintet, Pascal Le Boeuf & Christian Euman) Best Arrangement, Instrumental or A Cappella An Arranger's Award. (Artist names appear in parentheses.) Singles or Tracks only. "Bridge Over Troubled Water" — Jacob Collier & Tori Kelly, arrangers (Jacob Collier Featuring John Legend & Tori Kelly) Best Arrangement, Instruments and Vocals An Arranger's Award. (Artist names appear in parentheses.) Singles or Tracks only. "Alma" — Johnaye Kendrick, arranger (säje Featuring Regina Carter) Best Orchestral Performance Award to the conductor and the orchestra. "Ortiz: Revolución Diamantina" — Gustavo Dudamel, conductor (Los Angeles Philharmonic) Best Opera Recording Award to the conductor, album producer(s), and principal soloists, and to the composer and librettist (if applicable) of a world premiere Opera recording only. "Saariaho: Adriana Mater" — Esa-Pekka Salonen, conductor (San Francisco Symphony; San Francisco Symphony Chorus; Timo Kurkikangas) Best Chamber Music/Small Ensemble Performance Award to the ensemble and conductor if applicable. "Rectangles and Circumstance" — Caroline Shaw & Sō Percussion Best Classical Compendium Award to the artist(s) and to the album producer(s) and engineer(s) of over 50% playing time of the album, and to the composer and librettist (if applicable) with over 50% playing time of a world premiere recording only. Ortiz: Revolución Diamantina — Gustavo Dudamel, conductor'''
