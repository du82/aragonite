full_description = '''<div class="no-js"> This page requires Javascript to be enabled. Please enable javascript in your browser preferences. </div> Topping the charts, rocking the clubs. Join ASCAP today. It's now FREE to join our global family of professional music creators. Join now Snow Business: The 2025 Sundance ASCAP Music Café Lights Up this Year’s Film Festival with Top Songwriters and Composers Full coverage ASCAP @ Sundance 2025 Music is essential to the art of filmmaking. The Sundance ASCAP Music Café honors the love affair between music and film with performances from artists and songwriters you need to know, and conversations with the composers who are powering the Sundance Film Festival 2025 selections. See what's happening Behind the Songs With Amy Allen Amy Allen’s list of collaborators includes Sabrina Carpenter, Olivia Rodrigo, Harry Styles, Charli XCX and many more. She also recently released her acclaimed debut album. Read on to get exclusive session stories and process details from the most in-demand songwriter out there. Go behind the songs Killer Mike, Joan Baez, Guster, Muna and More Help Celebrate Newport Folk Festival’s 65th Anniversary From an unannounced set by Beck and his band to folk royalty Joan Baez reading her poetry to a hushed audience of thousands to Conan O’Brien’s closing night jam with special guests such as Jack White, Nick Lowe, Nathaniel Rateliff and others, this year’s festival hit all of its marks. And ASCAP songwriters were front and center. Full event coverage The 2024 ASCAP Pop Music Awards Pictured: ASCAP Global Impact Award winner Charli XCX (right) with Chappell Roan On May 8, the ASCAP family gathered in celebration of our 2024 ASCAP Pop Music Awards winners – the songwriters, producers and publishers of the biggest hits of the past year. Read more ASCAP Pop Music Video Playlist Our favorite pop songwriters & rock bands, caught on tape being awesome. Watch more Icon Right Chevron ASCAP Pop Workshops ASCAP Foundation Harold Adamson Workshop Learn more ASCAP Foundation NYC Songwriters Workshop Learn more View all ASCAP workshops Say hello to your neighborhood ASCAP Pop/Rock rep. Meet the team Rock out. Cash in. Get paid when you play your music live with ASCAP OnStage. Get started Tips. Advice. Inspiration. Find it all at the ASCAP Help Center. Read more Rock ‘n’ roll is one of the greatest things, because it makes you feel good, but done at its very best, you feel cool. And that’s a great reward. — Tom Petty at the 2014 ASCAP Pop Awards'''
