["https://ascap.com/music-creators/genres/latin"]
title = "Latin"
description = "The latest news, events, articles and opportunities important to ASCAP members working in the Latin pop, urban, tropical and regional Mexican music genres."
full_description = '''<div class="no-js"> This page requires Javascript to be enabled. Please enable javascript in your browser preferences. </div> Bienvenidos a ASCAP. Únete a ASCAP hoy. Hazte miembro de nuestra familia global de creadores profesional de música. Únete hoy. Ayuda El Premio ASCAP 2024 ASCAP reunited our Spanish-language songwriting family on April 2, 2024 at a party in Miami celebrating the writers and publisher of the biggest ASCAP Latin songs of the past year. Leer más Conozca a su representante de ASCAP Latino. Conozca al equipo Acclaimed Colombian Singer-Songwriter Carlos Vives to Receive the ASCAP Founders Award The prestigious award is presented to songwriters and composers who have made pioneering contributions to music by inspiring and influencing their fellow music creators. Read more function toggleArrowGAFAQ(element, val) { var span = element.className; if (span.toLowerCase().indexOf("show-answer") >= 0) { ga('send', 'event', 'FAQ', 'collapse question', val.replace(",", "").replace("'","")); } else { ga('send', 'event', 'FAQ', 'expand question', val.replace(",", "").replace("'", "")); } } Preguntas Frecuentes General Registro de Obras en Línea Regalías Regalías de Transmisión en Línea ¿Dónde puedo obtener una solicitud de ASCAP? Las solicitudes para membresías de escritores y editores de ASCAP se pueden obtener en nuestro sitio web; www.ascap.com/join. ¿Cuánto cuesta afiliarse a ASCAP? Afiliarse con ASCAP es gratis para todos los nuevos miembros escritores de ASCAP. Si se une como escritor y editor al mismo tiempo, no le cobraremos ninguna tarifa de solicitud. Si sólo se une como editor, hay una tarifa de procesamiento de solicitud no reembolsable de $ 50 dólares por única vez, pero ASCAP no cobra cuotas anuales ni cuotas recurrentes. ¿Por qué ASCAP suspende la tarifa de solicitud de $50 dólares? Los últimos dos años han sido difíciles para los creadores de música. Suspender la tarifa temporalmente ayudará a los a los nuevos creadores de música a lanzar sus carreras y comenzar a ganar dinero más rápido. ASCAP está aquí para apoyar a los creadores en cada etapa de su vida en la música. ¿Esto se aplica a todos los nuevos miembros de ASCAP? Estamos renunciando a la tarifa para todos los nuevos miembros escritores de ASCAP. Si se une como escritor y editor al mismo tiempo, no le cobraremos ninguna tarifa de solicitud. ¿Por qué no suspendemos la tarifa para los miembros que se unen como editores? Nuestro objetivo al suspender la tarifa de solicitud es eliminar uno de los obstáculos para que los nuevos escritores y compositores comiencen a ganar dinero con su música. La mayoría de nuestros nuevos miembros escritores aún no tienen una entidad editorial, por lo que ahora pueden prepararse para ganar el 100% de sus regalías de ASCAP, sin costo alguno para ellos. Es un gran paso unirse a ASCAP como editor, incluso con la tarifa de solicitud de $ 50 dólares para los editores que no se unen como escritores al mismo tiempo. Cuando ASCAP distribuye regalías por una interpretación de su música, el 50 % va a los escritores y el otro 50 % a los editores. Si desea cobrar su parte de editor, deberá tener una editorial con ASCAP. Haga clic aquí para conocer otras razones por las que un escritor de ASCAP también debería unirse como editor. ¿Por cuánto tiempo se suspenderá la tarifa de solicitud? Estamos suspendiendo las tarifas de solicitud temporalmente para ayudar a los nuevos creadores de música que tuvieron dificultades para comenzar sus carreras durante la pandemia. El próximo año, evaluaremos como el cambio ha impactado a ASCAP y nuestra membresía y decidiremos si continuamos. Me uní a ASCAP antes de que suspendieran la tarifa. ¿Puedo obtener un reembolso? Solo eximiremos de las tarifas a los nuevos miembros que se unan el13 de febrero de 2023 o después. Si ya soy miembro escritor de ASCAP, ¿puedo unirme sólo como editor de forma gratuita? Sólo estamos renunciando a la tarifa para las nuevas membresías de editores de ASCAP si están conectados a un nuevo escritor que se une simultáneamente. El objetivo aquí es alentar a los nuevos creadores de música para quienes una tarifa de solicitud podría ser un obstáculo para comenzar a ganar dinero con su música. Todavía resulta un gran paso unirse a ASCAP como editor. Cuando distribuimos regalías por una interpretación de su música, el 50 % va a los escritores y el otro 50 % a los editores. Si desea cobrar la parte de su editor, deberá configurar una empresa editorial con ASCAP. Haga clic aquí para conocer otras razones por las que un escritor de ASCAP también debería unirse como editor. No poseo una identificación fiscal de USA. ¿Por qué tengo que enviar la información de mi tarjeta de crédito si ASCAP no cobra una tarifa de solicitud? Nuestro proceso de solicitud implica verificar su identidad a través de su identificación fiscal. Dado que no tiene una identificación fiscal de USA para verificar, necesitamos usar la información de su tarjeta de crédito en su lugar. ¡No se preocupe, no haremos ningún cargo en su tarjeta! ¿Por qué ASCAP cobra una tarifa de solicitud? Cobramos una tarifa de solicitud única para los nuevos miembros que deciden unirse sólo como editores. Las tarifas únicas ayudan a compensar algunos de los costos administrativos asociados con la elección de nuevos miembros. A partir del 13 de febrero del 2023, suspenderemos temporalmente las tarifas de solicitud para los nuevos miembros escritores. Si se une como escritor y editor al mismo tiempo, no le cobraremos ambas tarifas. Si me uno a ASCAP gratis como escritor y luego quiero unirme como editor, ¿aún tengo que pagar la tarifa de procesamiento? Por el momento, si se une como escritor y editor al mismo tiempo, no pagará la tarifa de solicitud para ambas membresías. Si se une sólo como escritor ahora, puede hacerlo gratis. Pero deberá pagar una tarifa de solicitud de $ 50 dólares si decide unirse como editor posteriormente. Si pago $50 dólares para aplicar como editor de ASCAP, pero luego cambio de opinión, ¿puedo recuperar mi dinero? La tarifa de procesamiento de la solicitud no es reembolsable. ¿Por qué la tarifa no es reembolsable? La tarifa está asociada con los costos de procesamiento de la solicitud de membresía y por lo tanto, no se puede devolver. No tengo una tarjeta de crédito para pagar la tarifa de procesamiento de la solicitud de mi membresía de editor. ¿Puedo enviar otra forma de pago? Si no tiene una tarjeta de crédito o débito Visa, MasterCard o American Express emitida en USA, primero debe proporcionar a ASCAP otra forma de pago utilizando el Formulario de tarifa de procesamiento de ASCAP. Al recibir y procesar su pago, se le darán instrucciones para completar su solicitud. El cargo por procesar un cheque, giro postal o pago con tarjeta de crédito extranjera es de $50 dólares. Tenga en cuenta que esto se suma a la tarifa de solicitud de editor de $50 dólares. Cómo registro mis temas en ASCAP? Puedes registrar tus temas en tu cuenta de Member Access (members.ascap.com) Para facilitar este proceso sigue estas instrucciones. (Ingles básico es necesario). Visita nuestra página de internet en www.ascap.com Selecciona “Manage Account", bajo la seccion de Music Creators Ingresa a tu cuenta de Member Access usando tu nombre de usuario y contraseña. Si no has activado tu cuenta de Member Access, podes activar tu cuenta hoy haciendo click en “Activate Your Account Now!” Haz click en “Register A Work” y sigue las instrucciones para registrar sus canciones. ¿Debo registrar mi canción en la Libreria del Congreso? Es importante, aunque no obligatorio, que registres tus temas en la Biblioteca del Congreso para proteger tus temas. Para mas informacion por favor visite www.copyright.gov. ¿Cómo inicio sesión en el sistema de Registro de Obras en Línea por primera vez? Para comenzar a usar el sistema de Registro de Obras en Línea de ASCAP, inicie sesión en Member Access (Acceso para miembros) y haga clic en "Register a Work" (Registrar una obra) en el menú "Works" (Obras) en la barra izquierda de navegación. ¿Me pueden guiar durante el registro? Visite las Preguntas Frecuentes sobre el Registro de Obras para obtener ayuda sobre cómo registrar su obra o utilice las descripciones que encontrará en el formulario. Quiero registrar más títulos, pero olvidé mi contraseña. ¿Debo abrir otra cuenta? No es necesario abrir otra cuenta. Simplemente haga clic en el enlace "Forgot Password?" (¿Olvidó la contraseña?) en la página Member Access (Acceso para miembros) para recuperar su contraseña. ¿Cómo puedo consultar los autores, editores o participaciones en un título que ya haya presentado? Solo puede consultar una obra que usted haya registrado originalmente en línea. Para consultar la parte con derechos o compartir información de una obra, haga clic en "View/Edit an Existing Title" (Ver/editar un título existente) en la barra de navegación. Si los cambios que realiza le indican a ASCAP que debe eliminar una parte con derechos que no sea usted o que debe reducir la participación de otra parte con derechos, ASCAP puede requerir una correspondencia firmada de esa parte que confirme el cambio. Necesito que se realicen cambios específicos a una obra en mi catálogo que no registré. ¿Cómo edito esta obra? Los cambios a una obra que no registró se pueden realizar a través de Member Access (Acceso para miembros). Haga clic en “Messages” (Mensajes) y cree un “New Message” (Nuevo mensaje). Seleccione la categoría “My Catalog” (Mi catálogo) y el tema “Work Record Update” (Actualización del registro de una obra). Se le asignará un número de consulta y se le informará cuando se haya actualizado la obra. ¿Cómo decido los porcentajes de regalías para cada uno de los autores y editores? Usted y sus colaboradores tienen la única decisión sobre los porcentajes de regalías. Consulte con ellos para determinar las divisiones acordadas de la participación antes de registrar su música en ASCAP. Si bien no es obligatorio, le recomendamos que establezca estos porcentajes por escrito. Visite nuestra página de Splitsville, EE. UU. para obtener más información sobre cómo realizar una división. ¿Por qué los porcentajes del autor y el editor deben sumar hasta un 50 % cada uno, en lugar de 100 %? Las regalías que pagamos por una ejecución de la música de nuestros miembros se dividen de manera uniforme entre los autores y editores. Cuando registra música en ASCAP, asegúrese de que la división entre todos los autores sume 50 %, y que la división entre todos los editores sume 50 %, para alcanzar un total de 100 %. Si usted es el editor o coeditor de sus propias obras, recibirá su porción de las regalías como autor y como editor. Tengo una membresía de autor y de editor en ASCAP. ¿Debo registrar los títulos dos veces? No. Los títulos solo deben registrarse una vez y aparecerán automáticamente en los catálogos de cada parte que figure en el registro inicial. Tenga en cuenta lo siguiente: si usted no edita sus obras, preferimos que únicamente el editor que representa sus intereses registre las obras. Soy autor conjunto de una obra musical, y el otro autor ya la registró. ¿Debo registrarla también? Si el otro autor registró la obra en ASCAP, no es necesario registrar la canción nuevamente, aunque es una buena idea consultar con su coautor para asegurarse de que la haya registrado correctamente. Si su coautor pertenece a otro PRO, también deberá registrar su obra en ASCAP para que podamos realizar un seguimiento y entregarle su pago. Soy productor. ¿Cómo puedo agregarme a una canción si las únicas opciones son “Autor” y “Editor”? ASCAP paga regalías por las ejecuciones a nuestros miembros por escribir o editar música. Con frecuencia, los productores contribuyen a la composición subyacente de la música. Si esto se aplica a su caso, sus contribuciones como “autor” o “coautor” pueden recibir créditos por la canción que registra. En definitiva, la decisión es suya y de sus coautores. Su registro en ASCAP debe coincidir con el acuerdo que haya implementado con sus colaboradores. Olvidé mi número de miembro. ¿Pueden enviarme mi número? Debido a nuestra política de privacidad, no podemos enviarle su código de miembro por correo electrónico. Sin embargo, puede encontrarlo en su cuenta de Member Access (Acceso para miembros), en un estado de cuenta de regalías de ASCAP o llamando a Servicios Globales al 1-800-95-ASCAP. ¿Puedo registrar mi música si aún no se ejecutó? ¡Sí, puede registrar una obra musical en cuanto la escriba! Una vez que se ejecuta, agregue el nombre del artista al registro, editando su obra directamente, o enviando un mensaje a través de su cuenta de Member Access (Acceso para miembros) (categoría: “My Catalog” [Mi catálogo], tema: “Work Record - Update Other Details” [Registro de obras - Actualizar otros detalles]). ¿Debo registrar las versiones instrumentales de todas mis canciones? Si los autores y editores con derechos y porcentajes de participación no se modifican, no es necesario registrar las versiones diferentes de sus canciones. Todas se considerarán como la misma obra para los fines del pago. Si las diferentes versiones de la canción se conocen bajo títulos diferentes, puede agregar títulos alternativos a un registro existente para cubrir todas las versiones posibles de la canción. Si sus versiones adicionales tienen diferentes autores o una división diferente en la participación, regístrelas como obras separadas con títulos que las diferencien de la obra original. ¿Debo registrar ritmos incluso si no se incluyen en una canción completa? Solo las canciones completas pueden registrarse en ASCAP. Recuerde que solo pagamos regalías después de que la música se “ejecutó públicamente”. Entonces, si no quiere que su música se escuche en algún lugar en su forma actual, considere esperar hasta que esté terminada. ¿Puedo registrar una obra musical que contenga una muestra de la música de otra persona? Si toma una muestra de una grabación existente de la música de otra persona, necesitará obtener el permiso de dos titulares de los derechos de autor: 1. Los titulares de los derechos de autor de la grabación maestra original de la que toma una muestra, con frecuencia la discográfica que lanzó la grabación. 2. Los autores y editores de la composición subyacente de la que toma una muestra. Puede registrar música original en ASCAP que incluya una muestra de la obra de otra persona protegida por derechos de autor, pero deberá acordar cómo dividir la participación en las regalías con los autores y los editores de la música de la que tomó una muestra. Un buen primer paso es buscar la música de la que tomó una muestra en la búsqueda de repertorio de ASCAP (www.ascap.com/repertory). Luego contacte al editor directamente para realizar la división. ¿Qué es un "Administrador/Subeditor"? Un Administrador es el agente comercial de otro editor de ASCAP. Un subeditor es un agente comercial en los EE. UU. de un editor extranjero que no es miembro directo de ASCAP. Si tiene un'''
