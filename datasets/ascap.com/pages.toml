["https://ascap.com/international"]
title = "ASCAP International"
description = "ASCAP International"
full_description = '''<div class="no-js"> This page requires Javascript to be enabled. Please enable javascript in your browser preferences. </div> ASCAP International Our music is the world’s music. In 1919, ASCAP signed our first agreement with a foreign performing rights organization (PRO). Today we have agreements with foreign PROs representing nearly every country that has laws protecting copyright. We are proud to work closely with our global partners to ensure that music creators and publishers get paid, wherever their music is heard. Our partners around the world 2024 ASCAP London Awards Celebration Watch the recap 2023 ASCAP London Summer Party Watch the recap How we collect international royalties When ASCAP music gets played overseas, our international sister societies monitor the performances and send the royalties to ASCAP. Then we distribute them to our members in our quarterly international distributions. Read more ASCAP On the Come Up: United Kingdom Watch exclusive performances and interviews with emerging songwriters from Great Britain Watch now Our international advantage From our involvement in international music organizations to the innovative programs we’ve developed to make international royalty tracking more efficient, ASCAP is a global leader in music rights. Why music creators choose ASCAP Are you a member of PRS? ASCAP is the “home away from home” for the greatest music makers from the UK, including Paul McCartney, Annie Lennox, Stormzy, Radiohead, Lewis Capaldi, Lianne La Havas and so many more. We’d love to represent your music in America, too. Here’s why choosing ASCAP is a great decision. Read more ASCAP Latino Representamos a los mas grandes creadores de música en todo el mundo Latino. Visite la página de ASCAP International resources for ASCAP members How to Maximize Your ASCAP International Royalties Here are five ways to make sure you're getting everything you deserve. Read more International Statement Guide Our quarterly international statements provide data on the country and medium in which your music is performed. Here's how to understand yours. Read more International Tax Reporting Guide If you earned performance royalties from a foreign society that withheld taxes, you may be able to reduce your US tax liability. Read more ASCAP is always looking out for the best interests of songwriters, and everything they do comes from the heart. It is great to be a songwriter with ASCAP in your corner. — Carlos Vives Say hello to your ASCAP International rep. Learn more'''
