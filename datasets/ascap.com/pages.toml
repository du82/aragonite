description = """
Subscribe List                                                                          Inside the Industry                                      Regular news and updates about the music industry, as well as ASCAP’s “Inside Music” newsletter and occasional chances to provide feedback and participate in surveys                                                                                                                                  ASCAP Experience                                      News and special offers about ASCAP’s signature event: the premier gathering for the music creator community (formerly the ASCAP “I Create Music” EXPO)                                                                                                                                  ASCAP Advocacy                                      Periodic updates about legislation and legal issues that will impact the music community, and vital information on how you can help ASCAP uphold the value of your music.                                                                                                                                  Play Along                                      Notifications about competitions, scholarships, workshops and other ways to participate in all of the events that ASCAP offers music creators                                                                                                                                  Daily Brief                                      A newsletter containing a curated selection of articles exploring the latest trends in music and technology every weekday                                                                                                                                  ASCAP Foundation                                      Updates on how The ASCAP Foundation (a 501(c)(3) charitable organization) is helping to nurture the music talent of tomorrow, and how you can support their mission                                                                                                                                  The ASCAP Lab                                      Be the first to know about new ASCAP Lab events, initiatives, and ways to get involved"""
