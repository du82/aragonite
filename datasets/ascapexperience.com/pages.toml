["https://ascapexperience.com/faq-press"]
title = "2025 ASCAP Experience | Frequently Asked Questions and Information"
description = "Get answers to the most frequently asked questions about ASCAP Experience. Learn how to access panels and programs and join our music creator community."
full_description = "EVENT INFO What is the ASCAP Experience? The ASCAP Experience is a full day of workshops, networking and inspiration to help you achieve your goals and navigate the future of music. Is the ASCAP Experience 2025 in LA still happening?Given the evolving and uncertain situation in the wake of the Los Angeles fires, we have decided to cancel our ASCAP Experience that was scheduled for February 27, 2025. Our venue for the event is in an area currently still under evacuation. We are disappointed not to be able to move forward at this time. All registrants will be given a full refund.I already bought a ticket. How can I get a refund? Refunds will be made automatically to the payment method used for your registration, within 10 business days. There is no need for you to do anything. It's been 10 days and I haven't received my refund. Who can I contact? Reach out to us at experience@ascap.com and we will look into it.Will you have another ASCAP Experience later this year? We haven't determined that yet. Make sure you’re signed up for our email list and you’ll be the first to know about our plans.What is ASCAP doing to help music creators impacted by the fires? Many ASCAP members have been impacted by the LA fires and need immediate assistance. With a desire to support the recovery efforts, ASCAP has set up an emergency relief fund of $1 million for our songwriter and composer members who have suffered from loss and damage to their homes and studios or been evacuated from their homes.I have a question about the ASCAP Experience that wasn't answered here. Who can I contact?Write to us at experience@ascap.com.PRESS How do I contact the Press team? Send an email to ascapexperience@shorefire.com."
year_published = 2025
clearnet = "https://ascapexperience.com/faq-press"
