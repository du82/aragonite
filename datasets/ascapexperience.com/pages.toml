["https://ascapexperience.com/email-signup"]
title = "Sign up for ASCAP email"
description = """
Subscribe List                                                                          ASCAP Experience                                      News and special offers about ASCAP’s signature event: the premier gathering for the music creator community"""
full_description = '''<div class="no-js"> This page requires Javascript to be enabled. Please enable javascript in your browser preferences. </div> Success Icon Thanks for subscribing! Go check your inbox! We just emailed a verification link to confirm your subscriptions. Envelope Icon Sign Up! Click the checkbox below to receive emails about the ASCAP Experience. Name Information First Name Last Name Contact Information Email Address Confirm Email Address Subscribe List ASCAP Experience News and special offers about ASCAP’s signature event: the premier gathering for the music creator community Manage emails for your ASCAP Member Account Comments Submit Preferences var gcaptchaToken = ""; //Disable the submit button until at least one list is selected $(document).ready(function () { $("#submitSignUp").attr("disabled", true); var checkSubmitButton = function () { if ($('#subscribeGroup input:checked').length == 0) { $("#submitSignUp").attr("disabled", true); } else { $("#submitSignUp").attr("disabled", false); } } $("#subscribeAllEmail").on("click", function () { setTimeout(function () { checkSubmitButton(); }, 100); }); $('#subscribeGroup input[type="checkbox"]').change(function () { checkSubmitButton(); }); }); $("#signup-form").submit(function (e) { e.preventDefault(); if (typeof (grecaptcha) != 'undefined' && grecaptcha.getResponse() != "") { $('#gcaptchaField').text('').hide(); if (!isValidEmailAddress($("#emailAddress").val())) { $("#emailField").text("Please enter a valid email address.").show(); $('html, body').animate({ scrollTop: $("#signup-form").offset().top }, 2000); } else if ($("#emailAddress").val().toLowerCase() === $("#confirmationEmailAddress").val().toLowerCase()) { $("#emailFieldset").hide(); $("#emailConfirmField").text("").hide(); $("#emailField").text("").hide(); $("#submitSignUp").attr("disabled", true); $("#submitSignUp .c-spinner-dots").addClass("in-progress"); var gresponse = grecaptcha.getResponse(); ValidateEmail($("#emailAddress").val(), gresponse); } else { $("#emailConfirmField").text("Emails do not match").show(); $('html, body').animate({ scrollTop: $("#signup-form").offset().top }, 2000); } } else { $('#gcaptchaField').text("The captcha is not valid.").show(); } }); function isValidEmailAddress(emailAddress) { var pattern = /^([a-z\d!#$%&'*+\-\/=?^_`{|}~\u00A0-\uD7FF\uF900-\uFDCF\uFDF0-\uFFEF]+(\.[a-z\d!#$%&'*+\-\/=?^_`{|}~\u00A0-\uD7FF\uF900-\uFDCF\uFDF0-\uFFEF]+)*|"((([ \t]*\r\n)?[ \t]+)?([\x01-\x08\x0b\x0c\x0e-\x1f\x7f\x21\x23-\x5b\x5d-\x7e\u00A0-\uD7FF\uF900-\uFDCF\uFDF0-\uFFEF]|\\[\x01-\x09\x0b\x0c\x0d-\x7f\u00A0-\uD7FF\uF900-\uFDCF\uFDF0-\uFFEF]))*(([ \t]*\r\n)?[ \t]+)?")@(([a-z\d\u00A0-\uD7FF\uF900-\uFDCF\uFDF0-\uFFEF]|[a-z\d\u00A0-\uD7FF\uF900-\uFDCF\uFDF0-\uFFEF][a-z\d\-._~\u00A0-\uD7FF\uF900-\uFDCF\uFDF0-\uFFEF]*[a-z\d\u00A0-\uD7FF\uF900-\uFDCF\uFDF0-\uFFEF])\.)+([a-z\u00A0-\uD7FF\uF900-\uFDCF\uFDF0-\uFFEF]|[a-z\u00A0-\uD7FF\uF900-\uFDCF\uFDF0-\uFFEF][a-z\d\-._~\u00A0-\uD7FF\uF900-\uFDCF\uFDF0-\uFFEF]*[a-z\u00A0-\uD7FF\uF900-\uFDCF\uFDF0-\uFFEF])\.?$/i; return pattern.test(emailAddress); } function ValidateEmail(emailAddress, gresponse) { $('#gcaptchaField').text('').hide(); var url = window.location.protocol + "//" + window.location.hostname + (window.location.port ? ':' + window.location.port : '') + "/scapi/PrefCenter/IsValidEmail"; $.ajax({ url: url, data: { emailAddress: emailAddress, recaptcha: gresponse }, cache: false, type: "POST", timeout: 10000, success: function (result) { PCValidateEmailCallback(result); }, error: function (result, textStatus) { if (textStatus === "timeout") { // Accept email as valid and start Verification PCVerifyEmail(emailAddress); } else { PCValidateEmailCallback(result); } } }); } function PCValidateEmailCallback(status) { if (status.Success === false) { //Google Captcha failed $('#gcaptchaField').html(status.ResponseMessage).show(); $('#submitSignUp').prop('disabled', false); $("#submitSignUp .c-spinner-dots").removeClass("in-progress"); if (typeof (grecaptcha) != 'undefined') { grecaptcha.reset(); } } else { //Acept all of the following FINDING V, VS, CO, CE, XB, XE, XD, XL, XF, XR var accept = ["V", "VS", "CO", "CE", "XB", "XE", "XD", "XL", "XF", "XR"]; var info = JSON.parse(status.ResponseMessage); if (accept.includes(info.COMMENT_CODE)) {// Validated - pass through and begin verification PCVerifyEmail(info.EMAIL); } else { //Everything else just means it failed -- show error $("#submitSignUp").attr("disabled", false); $("#submitSignUp .c-spinner-dots").removeClass("in-progress"); $("#emailField").text(info.ASCAP_ERROR_RESPONSE).show(); if (typeof (grecaptcha) != 'undefined') { grecaptcha.reset(); } $('html, body').animate({ scrollTop: $("#signup-form").offset().top }, 2000); } } } function PCVerifyEmail(email) { var url = window.location.protocol + "//" + window.location.hostname + (window.location.port ? ':' + window.location.port : '') + "/scapi/PrefCenter/IsVerifiedEmail"; var selected = []; $('#subscribeGroup input:checked').each(function () { selected.push($(this).attr('name')); }); var appData = { firstName: $("#firstName").val(), lastName: $("#lastName").val(), listIds: selected }; $.ajax({ url: url, data: { email: email, appData: JSON.stringify(appData) }, cache: false, type: "POST", dataType: "json", timeout: 25000, success: function (result) { //This email address is already subscribed! You'll get an email from us shortly. Follow the link inside to manage your subscriptions. result.ResponseMessage = JSON.parse(result.ResponseMessage); $("#submitSignUp").attr("disabled", false); $("#submitSignUp .c-spinner-dots").removeClass("in-progress"); switch (result.StatusCode) { default: case 1200: $("#emailFieldset").html("This email address is already subscribed! You'll get an email from us shortly so you can manage your subscriptions.").show(); break; case 1203: case 1400: case 1404: case 2200: case 2201: $("#formPage").remove(); $("#tyPage").show(); break; case 1401: $("#emailConfirmField").html("Oh no! You've exceeded the number of attempts to sign up. Please enter a different email address.").show(); break; case 1500: $("#submitSignUpError").html("Oh no! Something went wrong. Please try again.").show(); break; case 2208: $("#formPage").remove(); $("#tyPage").show(); break; case 2400: $("#emailConfirmField").html("Oh no! This email cannot be contacted. Please enter a different email address.").show(); break; case 2401: $("#emailConfirmField").html("Oh no! You've exceeded the number of attempts to sign up. Please enter a different email address.").show(); break; case 2417: case 2500: $("#emailConfirmField").html("Oh no! Something went wrong. Please try again.").show(); break; } $('html, body').animate({ scrollTop: 300 }, 2000); }, error: function (result, textStatus) { $("#submitSignUp").attr("disabled", false); $("#submitSignUp .c-spinner-dots").removeClass("in-progress"); if (textStatus === "timeout") { // What to do here if the call timedout? } else { } } }); } document.addEventListener('DOMContentLoaded', function (event) { if (document.getElementById('subscribeAllEmail') != null) { let toggle = new ToggleCheckbox( document.getElementById('subscribeAllEmail'), ); } });'''
