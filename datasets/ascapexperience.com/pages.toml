["https://ascapexperience.com/home"]
title = "ASCAP Experience 2025 | Music. Truth. Community."
description = "Welcome to ASCAP Experience: a full day of workshops, networking and inspiration to help you achieve your goals and navigate the future of music. Brought to you by ASCAP, where creators come first."
full_description = "@layer moda.styles { .m-style-feature-row-26449895 { & { --section-shape: var(--section-shape-wave-2); } } } To our dear ASCAP Experience communityWe understand how devastating and challenging these past few weeks have been for the Los Angeles community. Given the evolving and uncertain situation in the wake of the Los Angeles fires, we have decided to cancel our ASCAP Experience that was scheduled for February 27. Our venue for the event is in an area currently still under evacuation. All registrants will be given a full refund. Refunds will be made automatically to the payment method used for your registration.Many ASCAP members have been impacted by the LA fires and need immediate assistance. With a desire to support the recovery efforts, ASCAP has set up an emergency relief fund of $1 million for our songwriter and composer members who have suffered from loss and damage to their homes and studios or been evacuated from their homes.We know how powerful our community can be when we can come together for a common purpose. All of us at ASCAP were looking forward to being with our ASCAP Experience attendees, and we are disappointed not to be able to move forward at this time. Our goal, as always, is to provide you with the best advice, tools, networking opportunities and more that you need to achieve your creative aspirations, and we will keep you apprised of future plans.Thank you for being part of our community,The ASCAP TeamPosted January 17, 2025 @layer moda.styles { .m-style-feature-row-25589947 { & { --section-shape: var(--section-shape-wave-1); } } } JOIN OUR EMAIL LISTBe the first to hear about registration, programming updates and opportunities to get heard. SIGN UP"
year_published = 2025
clearnet = "https://ascapexperience.com/home"
