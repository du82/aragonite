["https://ashfurrow.com/blog/building-compassionate-software"]
title = "Building Compassionate Software | Ash Furrow"
description = "Update : I've since presented this content  as a talk , which you can watch below if that's more your jam. Skip to 4:30 to avoid an introduction from the meetup. If you make a mistake, you would want a colleague to point it out to you, right? Just like you would hope a colleague would ask a question when they don't…"
full_description = "Update: I’ve since presented this content as a talk, which you can watch below if that’s more your jam. Skip to 4:30 to avoid an introduction from the meetup. If you make a mistake, you would want a colleague to point it out to you, right? Just like you would hope a colleague would ask a question when they don’t understand something, and just like you want everyone on your team to speak up with ideas, even if they’re unconventional. But chances are that you’ve been in the position to speak up before and haven’t. Why? It feels like those scenarios represent a good team dynamic, but what effect do they have on a team’s performance? And how can we begin to change a team’s dynamic to improve its performance? Today we’re going to take a look at psychological safety and how it can help your team perform better. My goal is to give you the evidence you need to take back to your team so we can all improve our workplaces – with enough of us, we can begin to make significant change in our industry and beyond. I’ve had this topic on my mind for a long time, and I’m really excited to get started. Let’s dive in! So I’ve written about this before, but I’ll say it again: feelings matter. It might sound obvious to you – it might not – so it really does need to be repeated: feelings matter. Compassionate software can’t be built without compassion for each other. Feelings matter, a lot. We’ve actually researched this: students who learned about the struggles that scientists went through on their way to achieving success did a lot better in science class. And students who didn’t learn started doing worse. Learning how successful scientists struggle helped students when they inevitably struggled. That’s because struggling is normal, but when we neglect to mention the struggles of history’s great scientists, we present the incorrect view that they just were great. And that’s not true, everyone struggles sometimes. Students no longer felt like outsiders when they started to struggle."
year_published = 2016
year_updated = 2016
