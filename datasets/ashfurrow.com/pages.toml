["https://ashfurrow.com/blog/building-better-software-by-building-better-teams"]
title = "Building Better Software by Building Better Teams | Ash Furrow"
description = "On March 16, 2018, I delivered the opening keynote for  Appdevcon , which was titled  Building Better Software by Building Better Teams . Slides are  here . This post serves as a kind of pseudo-transcript of the talk. I also did  an interview  with the conference organizers after my talk. Hello! I’m Ash Furrow, and I…"
full_description = "On March 16, 2018, I delivered the opening keynote for Appdevcon, which was titled Building Better Software by Building Better Teams. Slides are here. This post serves as a kind of pseudo-transcript of the talk. I also did an interview with the conference organizers after my talk. Hello! I’m Ash Furrow, and I’ve been writing iOS apps since 2009. I’ve also helped build business-critical systems in Swift, Objective-C, Node, Scala, Rails, React – all kinds of stuff. And today we’re going to talk about how we can build better software by building better teams. Two and a half years ago I wrote this blog post about building online communities. It was inspired by seeing a talk by Justin Searls called The Social Coding Contract about online communities. That month I wrote another post about how the next step in my career was going to become a community-builder: someone who builds teams. I ran that idea by my manager at Artsy, and then by our CTO, and I had their full support. I began researching team dynamics, community structures, and online empathy. Part of my job became to learn about team building and apply it to Artsy. I’m not an expert in this field, but I’ve focused the past two and a half years on learning how to build teams, online and in-person, both in open source and business contexts. … believing in something isn’t enough to make it happen. It takes planning and consistent action. I’m still learning, and I’m still working on these skills. And today, I’m really excited to share some of what I’ve learned with all of you. So let’s get started! My goal today is to convince you that team building improves software quality, and to provide you with a vocabulary to discuss team quality. Before we discuss how to use the quality of a team to influence the quality of the software produced, we need to define the relationship between team quality and software quality. So let’s step back and think at a slightly higher level. Developers often think that software teams are unique or special among teams, but that’s not true from an organizational perspective. We tend to think that building software is unique among other types of work, that we have unique needs and distinct characteristics that mean that organizational behaviour principles don’t apply to us. But every type of worker is unique and every field has their own distinct way of working. We can acknowledge what makes building software unique while still looking to other fields for lessons in structuring teams."
year_published = 2018
year_updated = 2018
