["https://ashfurrow.com/blog/personal-timeline"]
title = "Personal Timeline | Ash Furrow"
description = "This week at work, I'm participating in a group event where we share personal timelines of ourselves, to get to know each other better. I thought I'd share my timeline in case anyone was interested."
full_description = "This week at work, I’m participating in a group event where we share personal timelines of ourselves, to get to know each other better. I thought I’d share my timeline in case anyone was interested. I attended UNB Fredericton from 2006–2011 for Computer Science. It's a five-year co-op degree, something I always feel obliged to mention. While at UNB, I participated in competitive computer programming competitions, eventually leading my team to North East North American regionals, where we tied for last place. I was awarded a free student ticket from Apple to attend their World Wide Developer Conference in 2010. It kick-started my whole career. My wife and I moved to Toronto in 2011. I started working, mostly at startups and mostly at companies that weren't later exposed to be real estate scams. I bought my first camera, which made sense working at a photography software company. I got really into it, eventually developing my own film. My wife and I moved to Amsterdam in 2014. Why? Basically, on a whim. But we knew that our mid-twenties was the time to go have an adventure. In 2014, I started working for Artsy. I was inspired by their mission: to make all the world's art accessible to anyone with an internet connection. We moved to New York in 2015. It still feels like a dream. Here are my two cats at the Artsy office while we waited for our apartment to become available. For five years, I organized a Saturday morning meetup at Artsy's office for software developers to work together on side projects. I made it a whole thing Starting around 2013 and continuing until 2020, I frequently gave conference presentations about software development. I've given talks in Australia, Belarus, Canada, the Czech Republic, Denmark, France, Germany, Hungary, Italy, Japan, The Netherlands, Poland, Portugal, Russia, Spain, Switzerland, Turkey, and The United States. Sometime around 2016, I started to learn guitar. It ended up replacing photography as my main creative pursuit. The novel coronavirus pandemic of 2020 led my wife and I to re-evaluate what we wanted from life. We decided to move home to Canada, and back to Fredericton."
