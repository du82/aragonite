["https://ashfurrow.com/blog/year-of-recovery"]
title = "Year of Recovery | Ash Furrow"
description = "This post comes with a content warning for a medical discussion. In late 2019, I discovered I had a health condition that needed surgery to correct. Not life-threatening, but it was the first major acute physical health issue that I've encountered as an adult.  That led to a surgery  while I still lived in New York…"
full_description = "In late 2019, I discovered I had a health condition that needed surgery to correct. Not life-threatening, but it was the first major acute physical health issue that I’ve encountered as an adult. That led to a surgery while I still lived in New York. 2020 was not a great time for medical treatment in New York. The cab driver taking me to the hospital pointed out the freezer trucks along the East River being used as makeshift morgues. My recovery didn’t go great, but I was cleared to travel home to Canada. Unfortunately, the problem recurred and I needed surgery again. After about a year on a waitlist, I had a different operation to resolve the same problem. Exactly one year ago today. That’s right, surgery on Halloween. I tried to put a cool spin on it – like that’s pretty metal, right? Surgery on Halloween? Could be a cool story. And I wish I could tell you a cool story, but the fact is that it sucked. It was a more invasive procedure than last time. Canadian hospitals are great in some ways, but are also overcrowded. I was admitted overnight and it was hell. I worked with a physiotherapist in the months leading up to the procedure to strengthen my core muscles for better post-operation outcomes. I started going for daily walks the very first day I returned home from the hospital. Once cleared by my surgeon, I started strengthening exercises with my physiotherapist: about six weeks after the surgery. Ever since then, I have been training. Training from the inside out and from the bottom up. I used to consider core workouts a kind of warmup to the actual weightlifting training at the gym. But when I started training again last year, with a focus on safety, core workouts were all I had. And I started from scratch: laying on my back and engaging my core as I exhaled. First, the health problem that required surgery in the first place is being managed. I am not “as good as new”, I never will be, and I need to work within that reality. Safety while training is more paramount than ever. On the other hand, believing yourself to be fragile is a great way to get injured. So it’s been a balance, literally and figuratively."
year_published = 2024
year_updated = 2024
