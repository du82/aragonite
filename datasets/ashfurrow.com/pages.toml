["https://ashfurrow.com/blog/new-keyboard"]
title = "New Keyboard | Ash Furrow"
description = "A few months ago, I came across  this amazing video from Christian Selig detailing how he built his own keyboard . And I mean  built  it. Unknown to me up to that point, there exists both the tools and community such that anyone could design and build, from scratch, their own custom computer keyboard. The printed…"
full_description = "A few months ago, I came across this amazing video from Christian Selig detailing how he built his own keyboard. And I mean built it. Unknown to me up to that point, there exists both the tools and community such that anyone could design and build, from scratch, their own custom computer keyboard. The printed circuit board, the case, the microcontroller firmware – everything. I had been using an ErgoDox-EZ keyboard since 2020 and so I was familiar with the concept of custom keyboard firmware. But I had no idea that the custom hardware was so accessible. Building something from scratch wasn’t something I was interested in doing, but I did start tinkering with my ErgoDox layout. It was a tonne of fun! Since I was tinkering with the layout, I started thinking about my home office ergonomics more broadly. A lot has changed since I last talked about my home office setup. My RSI pain is something that I have under control, but it is something that takes active management. I looked up how to adjust my chair. I had someone watch me work. I bought a keyboard tray to sit under my desk. And, I bought a new keyboard. The thing with my ErgoDox was, I never really made the most of it after I got over the initial learning curve. I kept some bad typing habits. I had a lot of unused keys. I could have solved these problems, and would have, but the physical size of the ErgoDox also presented some challenges on my desk setup. The keyboard is tall and wide and I wanted something lower profile. So I bought ZSA’s Voyager. It is also a split mechanical keyboard, smaller, and with low profile keys. It feels great! I got the clickiest key switches and they feel so satisfying. It’s also much smaller. ZSA has a to-scale printout of all their keyboards, so here is the Voyager on top of the ErgoDox-EZ. I’ve been using it for a few weeks now and have mostly regained my typing speed. It has fewer keys that the ErgoDox, which has pushed me to be creative with my layout. Honestly, I have been having a blast! My layer is open source if you’re interested. I have made fifty changes so far and forked it twice."
