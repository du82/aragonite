["https://ashfurrow.com/blog/keyboard-rabbit-hole"]
title = "Keyboard Rabbit Hole | Ash Furrow"
description = "Content warning: this post contains medical discussions. Quickly after I began my career as a full-time software developer, I developed pain in my left wrist. At first, it was only occasional. But it became consistent. Then it started showing up in my right wrist. I wish that I had done something about my wrist pain…"
full_description = "Quickly after I began my career as a full-time software developer, I developed pain in my left wrist. At first, it was only occasional. But it became consistent. Then it started showing up in my right wrist. I wish that I had done something about my wrist pain sooner. And I wish that I had sought professional help sooner, too. Don’t worry, though, because the story has a happy ending. It turns out that my posture was the root of my pain. Through exercise, stretching, and physiotherapy, I improved my posture and mostly relieved my pain. Today, the pain is something I manage. It still flares up, but I now have the tools I need to deal with it. One of those tools has been ergonomics. I’ve tried wrist splints, better chairs, sit-stand desks, and… ergonomic keyboards. With keyboards, people often ask about typing speed. And I simply do not care about speed. People online often ask if an ergonomic keyboard will help them type faster, and I doubt it. Maybe! But who cares. My goal is avoiding RSI injuries. For what it’s worth, I currently type at around 80wpm. That is fast enough for me. The biggest takeaway from my experience is: you should not meet the keyboard, the keyboard should meet you. If you have to reach for the keyboard, move it closer to you. Everything in the blog post applies this principle in one way or another. This blog post is about the rabbit hole that I’ve been falling down in spurts and starts for over a decade. Let’s start from the beginning. In 2015, I bought my first “split keyboard”, a Kinesis Freestyle 2 with the “VIP” tenting kit. This is a great keyboard and it remains my go-to recommendation for any programmer who wants a better keyboard. It’s basically a “ten key-less” keyboard, with an “inverted T” arrow cluster. The keyboard is split into two halves. It “tents”, which means the two halves are raised in the middle. Both of these are important for ergonomics because it gives you more degrees of control to “bring the keyboard to you.” It also has integrated palm rests, which some people prefer (I did at the time). It comes in both Mac and Windows variants, and they’ve added mechanical switch variants since then too (mine was a membrane keyboard). One downside is that the two halves are connected by a wire that you can’t change; the halves can only be 9 inches apart."
year_published = 2024
year_updated = 2024
