["https://ashfurrow.com/blog/empathetic-civilization"]
title = "Empathetic Civilization | Ash Furrow"
description = "A few months ago, I wrote about  normalizing struggle  a discussion of failure and a call-to-action for everyone to be more open about that fact that they struggle (because  everyone  does). Well,  some science happened  and it more than validates my viewpoint. So what's up? Well,  they  divided some 10th-grade…"
full_description = "A few months ago, I wrote about normalizing struggle a discussion of failure and a call-to-action for everyone to be more open about that fact that they struggle (because everyone does). So what’s up? Well, they divided some 10th-grade students into three groups, who read three different different descriptions of Curie, Einstein, and Faraday. The first group only read about the scientists’ accomplishments; the second group read about the scientists’ personal struggles against sexism, classism, and Nazis; and the third group read about the scientists’ intellectual struggles of how difficult it was to accomplish their respective achievements. In other words, the second two groups were shown how similar the scientists were to themselves – they were shown to empathize with the scientists. After six weeks, the two groups who learned about how the scientists struggled significantly improved their science grades and increased their motivation to study science. The lowest performing students showed the greatest gains. Meanwhile, the students who learned only about the scientists’ achievements performed worse. They believed the scientists were innately gifted—unlike themselves. Normalizing struggle helped students learn. But more than that, the students who needed the most help got the most out of this experience. Think about that: not only is this an effective means of improving academic performance, but it’s more effective the more it’s needed. As far as bang-for-buck analysis of educational tools go, this is a no-brainer! But consider the last nugget: students who only learned of the achievements of these scientists got worse. That’s remarkable – it suggests that not only does normalizing struggle help students, but failing to do so actually harms students. The implications are striking: not only is this empathetic approach to education an effective way of helping students, but the educational status quo actually does more harm than good. I’m growing more and more convinced that we need a complete social and educational reform that centres how we organize ourselves on empathy for our fellow humans. Anything less than that will lead us to our own extinction."
year_published = 2016
year_updated = 2016
