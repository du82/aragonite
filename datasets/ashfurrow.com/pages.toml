["https://ashfurrow.com/blog/one-year-at-float"]
title = "One Year At Float | Ash Furrow"
description = "Last August,  after much reflection ,  I joined Float . After a year, I thought it was important to check in with myself and see how I'm doing. How I'm feeling. The tl;dr here is: I am proud of what I've accomplished at Float so far and I feel like I still have much more to accomplish. This is a good state of mind for…"
full_description = "Last August, after much reflection, I joined Float. After a year, I thought it was important to check in with myself and see how I’m doing. How I’m feeling. The tl;dr here is: I am proud of what I’ve accomplished at Float so far and I feel like I still have much more to accomplish. This is a good state of mind for me, it’s what kept me at Artsy for seven years. My plan is to continue making Float the kind of place where I want to be for a long time. Most of my career has been spent in startups of various sizes. Recently, I tried working at a large publicly-traded company. Upon reflection, I don’t think my time was well spent there. The work I did was good, but not great. The scale of my impact was impressive, relatively speaking. My work was valuable, if not valued. I joined in late August to lead mobile development and by early December, Float had launched its mobile app on Android and iOS. Financial services was a whole new domain to me and I had to get up to speed fast. I learned Float’s existing products, met with Float’s customers, and asked so many questions. At the same time, I guided our small team through the planning, design, build, test, and deploy phases of a new product. It turns out that I actually respond really well to external pressure. This seems obvious to me now, but I had forgotten at some point. The only catch is: I need to understand why something is important. Extrinsic motivation doesn’t drive me, but when I understand why something is important then my intrinsic motivation kicks in. For example, just two days before our app launch, we discovered a show-stopping bug. The kind of bug that would scupper the launch. Fixing the bug demanded some after-hours work with other team members. Everyone understood the importance of fixing the bug to unblock the launch. That understanding gave me the intrinsic motivation – the drive – to get it done. We identified the problem, fixed it gracefully, and deployed that fix to unblock our launch."
year_published = 2024
year_updated = 2024
