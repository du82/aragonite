["https://ashfurrow.com/blog/perspective-of-the-polyglot"]
title = "Perspective of the Polyglot | Ash Furrow"
description = "In 2015,  I wrote  about my next steps in  Artsy's engineering career ladder . I laid out the steps that I would be focusing on, like multiplying effectiveness of cross-team work and having an obvious technical impact on the team's strategic trajectory. I've made progress on these points, to varying degrees, but that's…"
full_description = "In 2015, I wrote about my next steps in Artsy’s engineering career ladder. I laid out the steps that I would be focusing on, like multiplying effectiveness of cross-team work and having an obvious technical impact on the team’s strategic trajectory. I’ve made progress on these points, to varying degrees, but that’s not what I want to talk about. Back then, after listing all the things I wanted to focus on, I casually mention some other items that I’d skipped. In hindsight, I maybe treated these “technical things” as though they were inevitable and would just happen on their own. But just like the community-oriented qualifications, technical skills are things that I need to consciously practice to improve at. To some extent, I might have neglected them. I mean, don’t get me wrong. I made occasional contributions (mostly in Ruby), I built new open source tools (mostly in Ruby), I even rewrote my website (in Ruby). I stayed in my comfort zone – heck, I didn’t even learn Rails! That changed about a year ago, when I talked to my manager about breaking outside of the iOS developer box. I told him that I wanted to contribute to mission-critical backend systems, to help build web frontends written in new languages, to experiment with unproven technologies and evaluate their applications at Artsy. It’s been a slow process. I haven’t just been learning new things, I’ve also been helping other team members contribute to Artsy’s iOS code. I can’t just leave the iOS codebases – I have responsibilities. I was doing things like pairing on our Scala codebase, which was totally new to me, while also pairing on our iOS codebases, which I helped write. My progress was stunted at times by setbacks in my depression treatment. Sometimes I would take one step forward and two steps back. That sucked. I made progress where I could and tried to accept that developing new skills takes time. Contributions to non-iOS codebases were minor at first: arduous pull requests that changed some button’s text or added some field to a model object. Simple stuff. I was making contributions, but each one was a challenge."
year_published = 2017
year_updated = 2017
