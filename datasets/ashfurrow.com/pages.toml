["https://ashfurrow.com/portfolio"]
title = "Ash Furrow"
description = "Ash Furrow's Professional Portfolio"
full_description = "I began my career as an “iOS developer” but I have learned, I have struggled, and I have grown. The problems I want to work on now simply cannot be solved with iOS software alone. I am interested in building teams as much as I am interested in building software. My first five years and my second five years of professional software development are openly documented, if you want an in-depth look. I started leading Artsy's Mobile Experience team in 2019, but my technical leadership spans back much further. Artsy encouraged to expand my impact so in 2015, I began learning about team dynamics and applying what I learned in my team as an individual contributor. Over the years, I expanded my technical impact by learning new systems and technologies, and expanded my cultural impact by learning how to foster healthy, empathetic, and productive work environments. My approach to guiding product development centres learning as its goal. Developers build new products in complicated business contexts, and we don't know the answers upfront. I help teams learn how to solve the problem effectively and efficiently. We end up building a great product, but we do so by focusing on the learning rather than the building. This focus means creating a team environment where we are constantly learning and then teaching what we have learned, often across disciplines. This foundation of learning has helped me scale up Artsy's mobile software expertise across many product teams to become a genuinely mobile-first product organization. I excel at creating self-improving systems that distribute knowledge and responsibility across teams. At Artsy, I gave away responsibility for the engineering-wide sync. At Shopify, I built up our release management rotation so every shift made things easier for the next one. My approach to technical leadership keeps me hands-on. Sometimes I work out ahead of the team, prototyping new ideas or helping avoid upcoming problems. However, most of my work is leading from behind. My intuition tells me what needs to be done most and I make sure it gets done."
