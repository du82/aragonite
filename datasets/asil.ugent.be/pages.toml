["https://asil.ugent.be/projects/barry-bibber"]
title = "Barry Bibber – ASIL"
full_description = 'Barry Bibber – Immersive audio experience for children Keywords Arts, Immersive, Krook, culture, music Research Groups inArts & Media Project Duration 01/11/2022 – 30/11/2022 Contact Bart Moens Ambisonics recording & VR video Use your headphones, watch in Google Chrome browser, and control with your mouse. To view this video please enable JavaScript, and consider upgrading to a web browser that supports HTML5 video var hoast360 = new HOAST360(); var ambisonicsOrder = 3; hoast360.initialize("https://asil.ugent.be/hoast360/media/barry/", "https://asil.ugent.be/hoast360/irs/", ambisonicsOrder); Thanks to IEM’s Thomas Deppisch and Nils Meyer-Kahlen authors of HOAST360 player for support for 4th order ambisoncis (https://git.iem.at/thomasdeppisch/hoast360). For VR View in Chromium-based desktop browsers the following flags must be set via chrome://flags for WebXR to work: enable #webxr set the correct runtime via #webxr-runtime disable #xr-sandbox Summary 3D Immersive audio experience for kids, made by Studio Spook. Presented at the ‘Voorleesweek 2022’ in the Krook. Studio Spook maakt griezelige producties voor kinderen vanaf 7 jaar. Hun nieuwste creatie werd exclusief ontwikkeld voor De Krook en is een uniek luisterverhaal in 3D. Barry Bibber is de angst in eigen persoon. Hij jaagt je de stuipen op het lijf, maar doet je ook nadenken over je eigen angsten. Een ideale activiteit, om na afloop met je kind te bespreken. Voor klassen is er ook een pedagogisch pakket beschikbaar. Credits: Tekst, stem & montage: Filip De Koning Extra Stem: Elodie Van den Bossche Stemopname en postproductie: Bart Moens & Peter De Koning Drones: Peter De Koning Finale versie en 3D-creatie: Bart Moens Illustraties en ontwerp: Jurgen Walschot Educatief Pakket: Liesbeth Van Bogaert & Filip De Koning Dank aan: Eva Rupus, Sanne Van Britsom, De Krook, ASIL, IPEM (Universiteit Gent)'
