["https://asil.ugent.be/projects/mikromedas"]
title = "Mikromedas AdS/CFT 001 [AV] – ASIL"
description = """
Sonification of black hole data
Spatial audio performance by Valery Vermeulen
Visuals by Jaromir Mulders
— 1 December 2023 @ 20:15 —
— ASIL Labs, Krook, Ghent —"""
full_description = '''Mikromedas AdS/CFT 001 – Spatial AV performance by Valery Vermeulen Summary Mikromedas AdS/CFT 001: For IPEM 60, Valery Vermeulen and Jaromir Mulders will play the live audiovisual concert Mikromedas AdS/CFT 001 [AV]. The concert resides within Mikromedas, a data-driven project musical project in which compositions are elaborated using data stemming from space, deep space and astrophysical simulation models. The latest production with this project is the album Mikromedas AdS/CFT 001. This album is entirely produced using data streams coming from simulation models of astrophysical black holes and regions with extreme gravitational fields. Mikromedas AdS/CFT 001 was released on the London based label Ash International, subsidiary of the renowned Touch label (https://touch33.net/). Upon release it was picked up in 28 countries worldwide and was featured in several international news outlets and magazines such as Music Radar, Tech Radar, The Wire (UK), BBC6, Electronic Sound Magazine, New Scientist, Neural Magazine, DJ Mag, Mixmag (UK, Asia and Korea), Trax Magazine, Future Music (Es), FazeMag (DE), on national radio stations Deutschland Funk (DE), Deutschland Funk Kultur (DE), Radio Eins (DE), Radio Canada (CA), Yle Radio1 (FI), The Wire UK on Air (UK), VRT Radio1 (BE) and VRT Radio2 (BE). In 2022 the album was awarded with an Honorary Mention for the STARTS Prize – Ars Electronica issued on behalf of the European Commission (https://starts-prize.aec.at/en/mikromedas). For IPEM60 Mikromedas AdS/CFT 001 will be presented as a live audiovsual concert with data driven visuals produced by multimedia artist Jaromir Mulders. Mikromedas AdS/CFT 001 was released in co production with Concertgebouw Brugge (BE), Baltan Laboratories (NL) and with the scientific support of UAntwerp (BE), KULeuven (BE) and The University of Alabama (US). Pubplic Performance: Practical information Friday 01/12/2023, 20:15 ASIL Labs (-2, Krook, Miriam Makebaplein 1, 9000 Gent) Meeting Point: entrance at bike parking (-1) Media 2 dimensional visualisation of gravitational waves emitted by black hole merger: picture by Valery Vermeulen <div class='avia-iframe-wrap'><iframe title="Mikromedas AdS/CFT 001 (Preview)" width="1500" height="844" src="https://www.youtube.com/embed/mSSBuKF5_Dk?feature=oembed&autoplay=0&loop=0&controls=1&mute=0" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>Bio Dr. Valery Vermeulen is an electronic musician, mathematician, visiting professor at the School of Arts Ghent (BE), lecturer at Master ArtScience KABK Den Hague (NL) and researcher at Antwerp University (BE). He holds a Phd in Mathematics and Masters degree in Music Composition. In his practice Vermeulen focuses on the intersection between music, mathematics, physics and data science. Topics in his work cover a broad range of disciplines including algorithmic music, AI, theoretical physics and data sonification. His most recent internationally acclaimed work, Mikromedas AdS/CFT 001, was awarded with an Honorary Mention for the STARTS Prize – Ars Electronica in 2022. More info www.valeryvermeulen.net Contact Email: valery@valeryvermeulen.net Instagram: @valeryvermeulen.studio Jaromir Mulders is a programmer, composer and designer. His main interest is creating systems that produce sound based on visual input. For instance taking algorithms from nature and searching for the boundaries and limitations of those algorithms. In these processes new sounds, shapes or textures are created, processed and fed back into the algorithm. Designing and programming his own synthesizers, effects and video is an important part of his work.By creating his own tools he creates new and interesting ways of interaction between different media. More info www.jaromirmulders.nl'''
