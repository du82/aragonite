["https://asil.ugent.be/projects/synthi-100-wintercircus-03-2024"]
title = "Synthi 100 @ Wintercircus (03/2024) – ASIL"
description = """
2-day event in the brand new Wintercircus Concert hall
16 & 17 March 2024"""
full_description = "Concept FTI – Flanders Technology & Innovation – was a big event in Flanders, promoting innovative research & enterpreneurship towards both consumers and busnisses. The opening event took place in the Wintercircus; our next-door neighboor. The opening party was hosted by Despacio – DEEWEE & LCD Soundsystem – on the magical ‘middenpiste’ of the new building. However, in the basement, the brand new immersive concert hall ‘Muziekclub Wintercircus’ was still empty. IPEM collaborated with FTIGent on 16 & 17 March 2024 to host the ‘chill room’ in EMS Synthi 100 style; having multiple artists a take at it during the opening party. 9 artists were invited to perform a set, which could take in total 45 minutes (preparation, play & breakdown): Micha Volders, Köhn, Floris Vanhoof, Ambisynics, Sagat, Roman Hiele, Mika Oki, Ossia and Indrė Jurgelevičiūtė. Why wasn’t this announced ? The Despacio event was unfourtunately sold out before even the idea of the ‘synthi chill room’ was born. But, we see it as the start of a new era for our synthi – so stay tuned for more synthi-centered events in the future! Live sessions: Lineup & recordings Floris Vanhoof Bio Floris VanhoofFloris Vanhoof – Everything Is Connected Floris Vanhoof is interested in hybrid forms of music, film and other arts. Modular synth sounds and 16mm film projections are central to his work. Working with synths, whereby electronic sound modules are connected by cables, Vanhoof became convinced that all possible instruments and ideas can be connected. Today, he translates sound into image (and vice versa) by connecting media that are not always compatible. How does our perception work and what new perspectives emerge that way? How does this change the way we look and listen? And how are observations coloured by our imagination? The artist makes his instruments and installations himself. They are laboratory models that explore the interface between image, light and sound. As a media archaeologist, he also likes nothing more than to confront the modern, digital viewer with flickering 16mm film and slideshows – things that are doomed to disappear. He deliberately chooses those analogue technologies because of the transparency of the working process and the broad dynamic range. At the same time, Vanhoof aims to question our current viewing and listening patterns through things that used to be considered high-tech. Köhn Bio KöhnKöhn – Experimenting with Sound Manipulation, Synthesizing, Sampling and Overdubbing Jürgen De Blonde has been (de)constructing music as Köhn since 1997. He works at the forefront of Belgian avant-garde, experimenting with techniques like sound manipulation, synthesizing, sampling and overdubbing. As such, he injects a wide variety of influences into his work, resulting in a blend of hypnagogic pop, abstract noise and everything in between (i.e. IDM, glitch, shoegaze, krautrock, ambient, musique concrète, etcetera). De Blonde was also part of the legendary post-rock band De Portables, and he is now a guest lecturer (on both Sound & Editing and 3D Sound) at LUCA School of Arts in Ghent, where also runs the LUCAsound Lab. At FTI Gent, he is one of nine musicians to play the EMS Synthi 100. In fact, De Blonde has already made music on the legendary synthesizer! “It’s a beautiful and gigantic piece of furniture that looks like the control panel of a spaceship. It also feels like playing Battleship when you’re pushing pins in the patch bays – you don’t use patch cables but connector pins. It all looks impressive and a tad intimidating at first, until you get to know the machine.” Micha Volders Bio Micha VoldersMicha Volders – Creating a Harmonious Aesthetic from Broken and Destroyed Sounds Micha Volders is a Belgian producer, musician and imagemaker. Since his teenage years – he’s a kid of the 1990s – Volders has been experimenting with 4-track cassettes, lo-fi recording and electronica. Later on, as an avid illustrator and stop-motion adept, he also obtained a master’s degree in animation. As a musician, Volders is particularly interested in creating a harmonious aesthetic from broken and destroyed sounds, regularly using homemade or modified equipment and unorthodox recording methods. With his background in film, he often visually contextualises his music, in a search for tactile sound worlds. Besides his own projects, such as Vermin Twins and Meteor Musik, he has produced albums for Gruppo Di Pawlowski and The Germans, amongst others. Since 2021, Micha Volders has been releasing his work under his own label Mutropia. Ambisynics Bio AmbisynicsAmbisynics – Experimenting with Live Music in Any Way, Shape or Form Ambisynics is a dynamical and anonymous band, which consists of Ghent University’s Institute for Psychoacoustics and Electronic Music musicologists. They play any instrument, both old and new electronic analogue nano, within an ambisonic experimental setup at De Krook. Or in this case, inside the brand-new Wintercircus music club with its legendary EMS Synthi 100 synthesizer. With Ambisynics, instruments may vary. Band members too. But they all have one thing in common: sharing their love for experimentation and live music in any way, shape or form. Ossia Sagat Roman Hiele, Roman Hiele, Indrė Jurgelevičiūtė Bio Mika OkiMika Oki – Spatial Design Through Music and Light Sculptures Mika Oki is dealing with spatial design, whether through the music she makes or the light sculptures she creates. The French-Japanese visual artist works with video, sound and electroacoustics to create abstract textures and mental imagery that perfectly intersect the worlds of club rhythm and ambient experimentation. In the past, Oki has created 24-hour performance pieces involving dancers and poets, played infamous festivals such as Atonal (Berlin) and Nyege Nyege (Kampala), and started the Brussels chapter of LYL Radio. Recently, she served up Stuck in It, a song for the second compilation of Le Motel’s superbly forward-looking Maloca label. Bio Roman HieleRoman Hiele – Mixing Roguish Electronica, Synthetic Jazz & Sonoric Underwater Fun The impressive list of impressive labels on which (Roman) Hiele has already released records ought to say something about his impressive oeuvre. The labels in question are Stroom, Ultra Eczema, Ekster, YYAA Recordings and his own boutique Universal Exports. How to describe his oeuvre? That’s really up for debate, as nothing will ever completely cover the load. Let’s give it a try anyway: a mix of roguish electronica, synthetic jazz and sonoric underwater fun. Also good to know: over the past ten years, Hiele has made music for films, theatre productions, performances, catwalks and art installations. And during FTI Gent, he’ll make some on the legendary EMS Synthi 100. Bio Indrė JurgelevičiūtėIndrė Jurgelevičiūtė – Creating Tranquil and Other-Worldly Soundscapes Indrė Jurgelevičiūtė is a Lithuanian sound artist, composer, singer and kanklės player. In her music, she creates tranquil and other-worldly soundscapes, weaving together elements of Lithuanian folk songs and acoustic + electronic sounds with improvisation. She performs both as a solo artist and with her band Merope (a collab with Belgian guitarist and electronic artist Bert Cools). Her work is represented by the art platform granvat, whereas Merope’s latest album Salos (performed with the Vilnius chamber choir Jauna Muzika) was released on Stroom and granvat. Jurgelevičiūtė has collaborated with a diverse array of musicians including Shahzad Ismaily, Tsubasa Hori, Gyda Valtysdottir, Solo Cissokho, Efterklang and Toma Gouband. She has also composed for theatre and multimedia. In fact, she recently wrote the music for Lisaboa Houbrechts’ Yerma adaptation – commissioned by the Stockholm Dramaten theatre."
