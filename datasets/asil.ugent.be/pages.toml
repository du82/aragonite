["http://www.asil.ugent.be"]
title = "ASIL – Art Science Interaction Lab"
description = "eXtended Reality research center to better understand the human mind and behavior"
full_description = "What is XR? XR allows to step into computer-generated 3D environments, experience these with all our senses, and interact within. We use XR research to better understand the human mind and behavior, in musical, technological & social contexts. More information about XR Mission and Goals Immersive XR spaces function as “extended” research laboratories, where we can optimize ecological validity and experimental control in the human-centered sciences. We offer a platform where scientist, entrepreneurs and societal stakeholder can drive XR-based societal impact. Explore our goals & vision Lab Modalities The Art and Science Interaction Lab is a highly flexible modular facility to bring, analyse and test experiences and interactions in virtual contexts as well as to conduct research on next-gen immersive technologies. It brings together engineers, performers, designers and scientists creating solutions shaping the lives of people. The XR facility encompasses the ASIL, Pluriversum and Maker Space labs, each tailored towards specific research setups. See the labs & technology Interdisciplinary consortium With a focus on intersciplinarity, we tackle the XR paradigm from different perspectives: visual (IDLab), auditory (IPEM) and user-centered (MICT). These groups gathered with the explicit intent to form an integrated research consortium with a shared research program. See the consortium Project highlights POTAPracticing Odin Teatret’s ArchiveSynthi 100 @ Wintercircus (03/2024)IPEM's Synthi 100 x FTIConbotsRobot-assisted XR music learningEMS Synthi 100Legendary EMS Synthi 100 (1971), fully restored and playable!Broadband Exp for Arts & CultureCollaboration with MinardExperience DNASmart spaces research in ASIL Artistic and public events Day of Science 2024Open lab days @ IPEMSeminar: Educating Through MusicSymposium about the modelling of rhythmic interactionsGone for EggsSpatial audio composisition by Philippe Macnab-SeguinPerplexityPerplexity 2024 Festi