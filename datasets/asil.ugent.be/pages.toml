["https://asil.ugent.be/projects/artists-in-residence"]
title = "Artists in Residence – ASIL"
full_description = "Artistic residencies 2019-2022 Keywords Artist, cultural, music Research Groups inArts & Media Project Duration 01/01/2020 – 31/12/2022 Contact Guy Van Belle Artistic residencies 2019-2022 Keywords Artist, cultural, music Research Groups inArts & Media Project Duration 01/01/2020 – 31/12/2022 Contact Guy Van Belle Artistic residencies 2019-2022 Keywords Artist, cultural, music Research Groups inArts & Media Project Duration 01/01/2020 – 31/12/2022 Contact Guy Van Belle Anouk De Clercq explores the potential of audiovisual language to create possible worlds. She is interested in what lies behind ‘reality’ or in between the visible and the imaginary. She has received several awards, including the Illy Prize at Art Brussels in 2005 and a Prix Ars Electronica Honorary Mention in 2014. Her work has been shown in Tate Modern, Centre Pompidou, Museo Nacional Centro de Arte Reina Sofia, MAXXI, Centre d’Art Contemporain Genève, International Film Festival Rotterdam, Berlinale, Ars Electronica, among others. Anouk De Clercq is affiliated to the School of Arts University College Ghent as an artistic researcher. For further information… In preparation of a new work for BOZAR, Helga Humming, together with the electronic artist Vessel and Helga Davis, she was working on the spatial design of the installation. Charo Calvo studied Physic Sciences at Universidad Autonoma de Madrid. She arrived in 1987 to Brussels as a founding member of the dance company ‘Ultima Vez’ directed by Wim Vandekeybus, for their first performance ‘What the body does not remember’. Giving up dancing in 1992, she started her studies on Electroacustic Composition at Conservatoire de Mons. Since then she has collaborated as composer and sound designer with many Belgium and international dance and theatre companies. She also worked on soundtrack for film and radio, and won several prizes for her compositions and realisations. She is now Professor Assistant in Composition for the Media at Mons Conservatory and guest Professor at Rits Hogeschool. She is also responsable for the coaching on Sound Design for DocNomads Joint Master Degree Documentary Film Directing, (Erasmus Mundus ). For further information…"
