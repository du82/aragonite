["https://asil.ugent.be/mission-goals"]
title = "Mission & Goals – ASIL"
full_description = "Mission & Goals The Art Science interaction labs aims to have a high impact in fundamental science, with a sociatal impact. This page further elaborates the goals of the labs and the consortium. https://www.ugent.be/en/research/science-society/impact XR: A new research space for human-centered sciences XR immerses people in (partly) computer-generated 3D multisensory environments, in which people experience the feeling of presence; the feeling of “being there” (see ‘What is XR’). At ASIL, we explore how XR environments open up new spaces for research on human experience, behavior and interaction; what we call, extended research spaces. Accordingly, we trust that XR has major potential for human-centered experimental research, solving some important limitations of traditional research: XR can simulate realistic objects, contexts and scenarios within controlled laboratory conditions: XR offers game-changing technologies for bridging ecological validity and experimental control, in terms of stimuli control and corresponding measurement of human behavior and responses. XR can create objects, contexts and scenarios, not possible in the physical world: Because of various constraints (physical, time/space, practical, financial, etc.), it is often not possible to study human interaction with(in) physical environments, objects, other people, etc. In addition, extra-ordinary, imaginary stimuli and illusions offer unprecedented ways of studying the human mind and behavior. The ASIL positions itself at the forefront of XR-based innovation in human-centered experimental sciences. The power of the ASIL lies in the integration of a wide set of state-of-the-art XR technologies, including multisensory immersive displays – for stimuli creation – and embodied interfaces and measurement technology – for allowing interaction with XR content and for assessing human behavior and (neuro)physiological responses (see ‘Labs and Technologies’). Accordingly, ASIL offers an interdisciplinary research hub for XR-based research at UGent, leveraging innovative research in a wide range of scientific domains, including: Cognitive and social (neuro)science Arts and creative culture Psychology and communication Design and prototyping of products, environments, and services User-centered XR engineering and data science Education and pedagogy Philosophy"
year_published = 2025
clearnet = "https://asil.ugent.be/mission-goals"
