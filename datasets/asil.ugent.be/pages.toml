["https://asil.ugent.be/projects/pota"]
title = "POTA – ASIL"
description = "training transmission, interaction and creativity"
full_description = "The POTA project in brief Practicing Odin Teatret’s Archive (POTA) is an interdisciplinary research project (2021-2025, 450K, 2 PhD students) funded by the Flanders Research Council (FWO). The aim is to investigate what it means to develop, practice and perform an archive through the activation of Odin Teatret’s (DK) embodied legacy in a virtual environment, addressing the translation of technique through Mixed Reality whilst developing dramaturgical approaches to archival practices. Resume to activate Odin’s embodied legacy in a digital and virtual environment, articulating new possibilities for the (pedagogical) transmission of Odin Teatret’s training techniques. to create new navigation systems that allow for an interactive and creative transmission of embodied theatre practices. to re-fashion Odin Teatret’s genealogies of theatre techniques into immersive and augmented technologies like motion capture (MoCap) systems and virtual reality (VR) devices. to consider embedded embodied knowledge as a tool for investigating the complex web of techniques that link performers to particular subjectivities, histories, aesthetics, and to each other. Entangling Practices By elaborating on hybrids of both physical and virtual spaces, we allow a user to drift towards a new awareness of embodied knowledge transmission, production and distribution, in which the freedom of a theatre laboratory provides the space for an interactive and creative encounter with codified artistic techniques and practices through virtual reality immersion. In this sense, the archive becomes a dramaturgical tool for the actor, dancer and performer, an ‘architecture of access’ to find one’s way through the great amount of data available nowadays through lived experience. By treating archive/embodied heritage as an interactive tool where the main focus is on an interdisciplinary functionality of one’s experience, this research gives voice to its potential on fostering innovative expressive communication."
year_published = 2025
