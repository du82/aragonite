["https://asil.ugent.be/projects/day-of-science-2023"]
title = "Day of Science 2023 – ASIL"
description = """
Open lab days @ IPEM
— 26 November 2023 @ 10:00 – 17:00 —
— ASIL Labs, Krook, Ghent —"""
full_description = "Dag van de Wetenschap 2023 / Day of Science 2023 Summary IPEM participated to the national Day of Science 2023 with an open-lab day. Everybody was welcome to explore our labs, experience spatial audio or jam on the Synthi100! Thanks to Joren Six, Ivan Schepers, Jasper Maes, Pieter-Jan Maes, Guy van Belle & Bart Moens for guiding the people around and showing them the origins of IPEM’s studio’s towards the new immersive audio world, to the Krook & UGent for all practical organisation and of course to the numerous enthousiastic visitors we’ve shown around! ASIL: spatial audio works “Al gehoord van immersive audio experiences? Dat zijn indrukwekkende geluidservaringen die je helemaal meeslepen met 3D-geluid. En jij kan zo’n experiences komen beleven tijdens de Dag van de Wetenschap. We verwachten jou en je oren in ons accoustisch labo ASIL waar onze 80 luidsprekers je meevoeren in een viertal van die immersive audio experiences. Oehs, aahs en wows gegarandeerd!” Ways of Water (Alexander Baboian (US)): a generative spatial sound art piece that aims to capture the essence of water as a subject of artistic investigation and present it with a fresh perspective in an immersive sonic experience with poignant psychological nuances. More info Being Hungry (Tineke De Meyer): written at the beginning of the lockdowns, devoted to the practice of just walking, aimlessly. More info Barry Bibber (Studio Spook): 3D Immersive audio experience for kids, made by Studio Spook. Presented at the ‘Voorleesweek 2022’ in the Krook. More info Strangers Again (Yokan): Spatial audio version of the song Strangers Again by Yokan Heritage Instruments: Synthi 100, DX7, NextCube “Gepassioneerde fan van synthesizers of al lang aan het uitkijken naar je eerste synthesiser met magie in? Dan ben je bij ons aan het juiste adres. IPEM (Institute for Psychoacoustics and Electronic Music) stelt tijdens de Dag van de Wetenschap z’n synthesizer-archief voor! Kom spelen op de legendarische EMS Synthi 100, Yamaha DX7 of IRCAM’s historische NeXTCube interface.” EMS Synthi 100 & EMT140: interactive workshop & demo about this iconic synthisiser. More info NextCube & DX7: Demo about the first soundcard & real-time DSP on the PC platform (nextCube). More info Virtual Heritage: 3D scans brought the ring modulators of IPEM studio’s in the 60’s back to life in VR! Open lab days: Practical information Snday 26/11/2023, 10:00 – 17:00 ASIL Labs (-2, Krook, Miriam Makebaplein 1, 9000 Gent) Follow signs from the main entrance No registration required Family-friendly activity Media Ways of Water in ASIL"
