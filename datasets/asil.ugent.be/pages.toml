["https://asil.ugent.be/projects/day-of-science-2024"]
title = "Day of Science 2024 – ASIL"
description = """
Open lab days @ IPEM
— 24 November 2024 @ 10:00 – 17:00 —
— ASIL Labs, Krook, Ghent —"""
full_description = "Day of Science 2024 IPEM opened its labs on the Day of Science, 24/11/2024. Everybody was welcome to explore our labs, experience spatial audio, relax in the experience room or explore an immersive theatre experience. Event hosted for the Day Of Science 2024 festival. Activities / activiteiten “Al gehoord van immersive audio experiences? Dat zijn indrukwekkende geluidservaringen die je helemaal meeslepen met 3D-geluid. En jij kan zo’n experiences komen beleven tijdens de Dag van de Wetenschap. We verwachten jou en je oren in ons accoustisch labo ASIL waar onze 80 luidsprekers je meevoeren in een viertal van die immersive audio experiences. Oehs, aahs en wows gegarandeerd!” Gone For Eggs (Philippe Macnab-Seguin; McGill, CA) ‘Every night, we experience a small taste of death when we lose consciousness in the depths of sleep. Every morning, we are born anew. Gone For Eggs takes this fundamental experience as a starting point to explore the oscillation between day and night, consciousness and unconsciousness, life and death.’ More info about ‘Gone For Eggs’ To our old neighbour (Natasha Pirard) Een compositie komende uit een residentie en een eerste samenwerking tussen IPEM & VIERNULVIER, gemaakt met de legendarische EMS Synthi 100 en opgenomen op tape. Door Natasha Pirard; in samenwerking met 404 De Oversteek (Ilke de Vries) Wandelen is een park kan heerlijk zijn. In ‘De oversteek’, een ruimtelijk audio verhaal, neemt een bijna blind persoon jou mee op haar pad. Het is een participatief project gerealiseerd door audiovisueel kunstenares Ilke De Vries in samenwerking met blinden en slechtzienden. Meer info is te vinden op de website www.ilkedevries.com. Being Hungry (Tineke De Meyer) Written at the beginning of the lockdowns, devoted to the practice of just walking, aimlessly. Being Hungry, from The House Was Alright by Duncan Speakman and Tineke De Meyer More info Bandcamp link Maker Space: Theatre movement in VR This artwork is part of a research project called the “Practicing Odin Teatret Archive,” developed at Ghent University. The project focuses on exploring and reimagining the way people learn through physical movement in theatre. Using Virtual Reality (VR), it allows users to experience and practice theatre exercises in an innovative and immersive way. More information about the POTA project The Experience Room In the basement of de Krook, the Ghent library, in between the big lab of the ASIL and the room with the legendary modular synthesizer EMS Synthi 100, there is a hidden room. This secret room will become the experience room where projects around the impact of music on the listener will find a home. A first experiment will start in spring 2025, where music for meditation will be tested in all forms, created by Reinhard Vanbergen (Charlotte & Reinhard, Rheinzand, Das Pop, Hercules & Love Affair, Novastar). The room will be completely dressed in soft long-haired fur in an attempt to disconnect the listener from the outside world. You are welcome to enjoy a first meditative composition of 5 minutes especially created for this event. This composition will be all about synchronizing the breath to the music. You can help us to perfect the room by leaving some feedback to get it in shape for the future experiments."
