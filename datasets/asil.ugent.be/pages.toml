["https://asil.ugent.be/team"]
title = "Research groups – ASIL"
full_description = "Consortium Members The XRHIL labs is hosted by a unique interdisciplinary research consortium at UGent. The consortium comprises of three core research groups from three different academic disciplines (IPEM, Faculty of Arts and Philosophy; IDLab, Faculty of Engineering and Architecture; mict, Faculty of Political and Social Sciences), joining collaborative forces. These groups gathered with the explicit intent to form an integrated research consortium with a shared research program. The main thread of this program is the focus on digital innovation from an explicit human-oriented approach (user interaction, user experience, ethical aspects, etc.). We study interactions between people, society and technology, leveraging on fundamental technological and methodological advancements, in which knowledge on human behavioral, affective, and cognitive principles is central."
