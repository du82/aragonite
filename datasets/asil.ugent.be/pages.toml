["https://asil.ugent.be/infrastructure"]
title = "Labs & Technologies – ASIL"
description = "Explore our different labs and technological platforms"
full_description = "Multisensory displays – Spatial audio Speakers: ASIL is equipped a room-encompassing audio system consisting out of 80 Martin Audio speakers. Under the hood, this system is powered by 12 OTTOCANALI 4K4 DSP+D amplifiers, a 64 channel Barco IOSONO core and synched with a 48kHz Nanosync. The Dante protocol allows for a very flexible routing of all sound sources and destinations within the audio network. Spatial Audio playback is supported: up to 7th order ambisonics (IEM plugin Suite, SPAT, …), Wavefield synthesis (Barco IOSONO), Binaural audio (tracked open-back headphones) and room reverb simulation (evertims). PreviousNext12345678PreviousNext1234 Virtual Reality: two wireless HTC Vive Pro’s allow untethered free roaming on an 8m by 8m surface, enabling compelling and interactive virtual reality experiences. Next to the two wireless systems, the ASIL also has 2 spare wired HTC Vive Pro kits and 2 HTC Vive Pro Eye kits at its disposal. Augmented Reality: two Microsoft Hololens 2 headsets allow for an untethered mixed reality experience. Projection: Acoustic transparant projection screen of 7m wide by 4m height, combined with a Barco 7k4 4K projector, allow for encomassing visual experience in the ASIL. Motion Traking Full body Motion Capture: Both ASIL & Maker Space labs are equipped with a Qualisys motion capture system. The system consists out of 14 fixed infrared and 4 fixed RGB camera’s, allowing a precision of approximately 1mm2 in a 8m by 8m by 3m volume (ASIL) and 9 Micqus camera’s for a 5x4m space (Maker Space). Furthermore, both system are extendable with 4 extra mobile infrared and 1 extra mobile RGB cameram allowing even more precise tracking in certain regions. PreviousNext12Eye gaze tracking in VR: Vive Pro Precision eye tracking powered by Tobii. Track and interpret eye movements to enable lifelike interactions, better manage GPU workload, and simplify input and navigation. Eye gaze tracking in XR: HoloLens 2 allows for a new level of context and human understanding within the holographic experience by providing developers with the ability to use information about what the user is looking at."
