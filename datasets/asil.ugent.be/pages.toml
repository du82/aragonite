["https://asil.ugent.be/projects/experience-dna"]
title = "Experience DNA – ASIL"
full_description = '''ExperienceDNA – User Experience Measurement in Virtual Smart Spaces Keywords Extended Reality, Smart product Design, User Experience, Virtual RealityResearch Groups inFrontpageProjects, ResearchProject Duration 01/01/2020 – 31/12/2022 Contact Jelle Saldien Summary How can we provide a positive user experience in our future smart spaces, given the strong growth of smart devices, each demanding attention with their own visual, auditory and tactile interactions? We will define a framework that is able to map the user experience journey in which all possible interactions between the user the products and the smart environment are measured in detail. In order to achieve this, we will create a Unity workspace to simulate smart environments by combining spatial audio, virtual reality and tactile interactions. In this workspace we will explore psychophysiological markers of the user’s personal experience of these interactions (blink rate, skin conductance and heart rate) and assess the practical feasibility for user evaluation. Furthermore we will setup a protocol to capture all relevant interactions that occur in the context of a smart environment based on our HCCI (Human Computer Context Interaction) framework. This will be implemented via a Proof of Concept based on the smart kitchen environment <div class='avia-iframe-wrap'><iframe title="ExperienceDNA - What is it?" width="1500" height="844" src="https://www.youtube.com/embed/MDLq3xVeUxc?feature=oembed&autoplay=0&loop=0&controls=1&mute=0" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>'''
