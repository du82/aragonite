["https://asil.ugent.be/projects/ems-synthi-100"]
title = "EMS Synthi 100 – ASIL"
description = "Legendary EMS Synthi 100 (1978),  fully restored and playable!"
full_description = "EMS Synthi 100 (#30) bought from EMS, imported by Trans European Music Het IPEM slaagt er als enige Belgische instelling in één van de 29 exemplaren van de Synthi 100 van Electronic Music Studios (EMS) aan te kopen. Het toestel wordt in de IPEM-BRT studio van de Muinkkaai geplaatst. Restauration by Constantin Papageorgiadis & Ivan SchepersFrom 2015 to 2017, the Synthi 100 was completely serviced by Constantin Papageorgiadis, a technician with expertise in EMS gear. It was restored on voluntary basis; with the aim to be played again by musicians. 2015 Restauration – Photo by Katrien Van Remortel 2015 Restauration – Photo by Katrien Van Remortel 2015 Restauration – Photo by Katrien Van Remortel Evening on Klara about the EMS Synthi 100 Evening on Klara (classical radio) about the EMS Synthi 100 (28/05/2020) Late Night Shift stelt op donderdag 28 mei graag de nieuwe plaat van David & Stephen Dewaele aan je voor. EMS Synthi 100, het resultaat van hun verkenningstocht op de legendarische EMS Synthi 100 van het Gentse IPEM, het Instituut voor Psychoacustica en Elektronische Muziek. En met Ivan Schepers, Pieter-Jan Maes en Bavo Van Kerrebroeck van het IPEM gaan we ook dieper in op de geschiedenis van het IPEM en deze unieke synth. Klara, Blijf Verwonderd! Paul Pignon Creatures Talk GlobalThis is a project involving three Synth 100’s in different parts of the globe communicating over a peer-to-peer internet connection: Athens, Beograd, Gent. On each of them I created what I call a Zoetic Engine, consisting of several “creatures”, patches which are autonomously active, alive I like to say, or one could just say “automata”, but also responsive to sound input from the outside world. http://database.unearthingthemusic.eu/Paul_Pignon Ocean Of Sound: Synthi performance on 4D Monom Sound system (Stuk, Leuven). Patching by Bart MoensMilestone Content goes here Synthi repair by Ivan Schepers, Orson Wouters & Johan RobaeysIn preparation for the upcoming events, the synthi has again been serviced by the talented team of Ivan Schepers, Orson Wouters & Johan Robaeys; with the kind help and advice from Jari Suominen. Lights, sliders, knobs & potmeters have been cleaned and fixed for smooth operation; Johan and Ivan repaired the original frequency counter with nixies. Future plans are being made to fix the sequencer (which never did work, even just after purchase) and the voltmeter!"
