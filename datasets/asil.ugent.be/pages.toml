["https://asil.ugent.be/projects/educatingthroughmusic"]
title = "Seminar: Educating Through Music – ASIL"
full_description = "Meet the Jury: Educating Through Music – Cognitive Approaches, Cultural Contexts, and Technological Tools10th of October 2024 – 10:00 to 13:00 Symposium This symposium brings together international experts in systematic musicology to explore various approaches to music education and music research, focusing on cognition, cultural contexts, and technology. The program will feature four 20-minute talks followed by 10 minutes of Q&A: 10:00: Welcome by Prof. Leman & Aleksandra Michalko 10:10: Dr. Makiko Sadakata: The boundary between speech and music, and the influence of linguistic background 10:40: Dr. Andrea Schiavio: Musical minds and the cognitive humanities: Sketches for theory and research 11:10: coffee break 11:30: Dr. Evangelos Himonides: Lessons learned from exploring evidence about the Power of Music 12:00: Prof. Luc Nijs: Technology in Music Education: On Well-trodden paths and roads less travelled 12:30: General discussion moderated by Aleksandra Michalko The event will also include an open forum to encourage discussion on interdisciplinary research. The symposium is aimed at those interested in systematic musicology, psychology, music education, linguistics, pedagogy, and philosophy. Participants are invited to bring questions related to their own research for a broader conversation. It offers a chance to reflect on current research in music education and related fields. This symposium is organised as a ‘Meet the Jury’ event on occasion of Aleksandra Michalko’s PhD defense, which will take place after the symposium at 14:30. The PhD dissertation is titled High Tech Technology and Sensorimotor Skill Acquisition in Instrumental Music Training. You are welcome to attend both events! Register here Meet the speakers Makiko Sadakata (University of Amsterdam)Makiko Sadakata is an assistant professor at the University of Amsterdam and a principal investigator of the Music Cognition Group at the Institute for Logic, Language and Communication. She specializes in the perception and cognition of musical elements, with her current focus being on investigating the association between music and language. Alongside various related topics, she is particularly interested in understanding how and why we perceive sounds as musical, and how individuals learn to identify musical qualities in sounds. Andrea Schiavio (University of York)Andrea Schiavio is a Senior Lecturer at the University of York. His research explores musical skill acquisition, performance, and creativity through the lens of 4E cognitive science (embodied, embedded, extended, enactive). He has published over 50 journal articles and book chapters, as well as the co-authored monograph Musical Bodies, Musical Minds (MIT Press). Andrea is the Past President of the European Society for the Cognitive Sciences of Music and co-founder and editor of the book series Music as Art and Science (OUP). Evangelos Himonides (University College London)Evangelos Himonides is Professor of Technology, Education, and Music at UCL, where he leads a number of courses and supervises doctoral and post-doctoral research. He is co-founder of the Music-Education-Technology International Conference (MET), associate editor of Frontiers in Psychology, the Journal of Music, Technology and Education, and past associate editor of Logopedics Phoniatrics Vocology. Evangelos has developed the free online technologies for Sounds-of-Intent (2003-2023), Inspire-Music, and the Online Afghan Rubab Tutor. He is fellow of the RSA and Chartered Fellow of the British Computer Society. When time is available, Evangelos likes to handcraft guitars in order to raise funds for charity. Luc Nijs (University of Luxembourg / Ghent University)Luc Nijs is associate professor in early childhood music education at the University of Luxembourg, head of the bachelor in music education at the University of Luxembourg and visiting professor at Ghent University, affiliated to IPEM and to the Academic Chair Jonet on Social Action and Music Making (co-founder). He holds a Ph.D. in arts sciences (systematic musicology), MA degrees in music performance (clarinet) and philosophy, and a teacher certificate (clarinet, sax, ensemble playing). His research integrates theory development, empirical studies and practice, focusing on the musician–instrument relationship, on the role of body movement in the instrumental learning processes and on the role of technology in provoking an embodied approach to instrumental music education. He is associate editor (Europe, Middle East) for the International Journal of Music in Early Childhood (IJMEC), guest editor for several Research Topics at Frontiers in Psychology/Education, and member of the scientific committee of the International Conference of Dalcroze Studies (ICDS). Flyer Practical Info Date: 10/10/2024 (10:00 – 13:00) Location: Paviljoen Vandenhove Rozier 1 9000 Ghent, BE Contact Aleksandra Michalko"
