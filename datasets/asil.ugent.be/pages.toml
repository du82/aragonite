["https://asil.ugent.be/projects/ways-of-water"]
title = "Ways of Water – ASIL"
full_description = '''Ways of Water – Spatial audio composition by Alexander Baboian Summary Ways of Water is a generative spatial sound art piece that aims to capture the essence of water as a subject of artistic investigation and present it with a fresh perspective in an immersive sonic experience with poignant psychological nuances. The word “ways” having a meaning of not only directional movement but also manner of behavior, the natural dynamic shapes, 3-dimensional movement patterns, and frequency spectrum content, as well as the general aesthetic of water form the basis of the piece. Composed of various blocks of sound constantly rearranging themselves in new ways to create an atmosphere as beginning-less and endless as the subject matter itself, the piece is intended to provide a thoughtful space for the listener to take time out of their day to reflect in. Alexander Baboian (US) will present the result of his experimental sessions with the 80-speaker ambisonics spatial audio system in the ASIL lab as a sound art piece. The piece will serve as graduation requirements from the Live Electronics master’s program at Royal Conservatoire Antwerpen and the presence of interested minds is warmly welcomed. More information about Alexander can be found on his website: https://baboshouse.com/ Contact Alexander Baboian Public Performance: Practical information Thursday 15/06/2023, 13:00 – 16:00 (continious installation, open door concept) ASIL Labs (-2, Krook, Miriam Makebaplein 1, 9000 Gent) Media (Binaural mix, use headphones) <div class='avia-iframe-wrap'><iframe title="&quot;Ways of Water&quot; -- Immersive sound art piece by Alexander Baboian (Binaural mix) @ IPEM, Gent" width="1500" height="844" src="https://www.youtube.com/embed/D3T1Po9lHaM?feature=oembed&autoplay=0&loop=0&controls=1&mute=0" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>'''
