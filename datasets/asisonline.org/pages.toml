["https://asisonline.org/certification/professional-certified-investigator-pci"]
title = "Professional Certified Investigator (PCI)"
description = "By earning your PCI, security professionals worldwide will recognize your mastery of investigative techniques and case management and presentation."
full_description = "Proof of Excellence The Professional Certified Investigator (PCI®) credential is a powerful career development tool that validates your specialized capabilities. By earning your PCI, security professionals worldwide will recognize your mastery of investigative techniques and case management and presentation. Start your certification journey today. Apply for PCI Provide Evidence of Your Abilities Make the case for your investigative expertise by adding the Professional Certified Investigator designation to your resume. With your skill set, you give your organization an edge against threats; with the PCI, you give your career an edge over the competition. Watch this video to learn more about each certification and what you need to get started – and check out our step-by-step application guide. PCI Eligibility Requirements The Professional Certified Investigator certification is designed for individuals with three to five years' investigations experience, including at least two years in case management. Additional requirements include: Full-time employment in a security-related role Have not been convicted of any criminal offense that would reflect negatively on the security profession, ASIS, or the certification program Willingness to sign and agree to abide by the ASIS Certification Code of Conduct Willingness to agree to abide by the policies of the ASIS Certification programs as outlined in the Certification Handbook Why Earn the PCI Designation? Need a few more great reasons to start your application? Validate your security investigation expertise Gain global recognition by your peers and the industry Get a competitive edge in the marketplace Enhance your career and earnings potential Enjoy personal satisfaction and professional achievement Start Your Application Self-Assessment Guide Start with our Self-Assessment Guide (descargar en español) to determine which exam is right for you and to assess your exam readiness. Certification Handbook Review the Certification Handbook (descargar en español) for more details on policies, procedures, eligibility requirements, testing options (test center or remotely proctored exams), and fees for the ASIS certification program. It also contains the domains, tasks, and knowledge statements for all four of our certifications."
