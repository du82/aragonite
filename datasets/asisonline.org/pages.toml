["https://asisonline.org/get-involved/global-and-regional-governance"]
title = "Global and Regional Governance"
full_description = "ASIS volunteer leaders are the heart of ASIS. ASIS is committed to creating a diverse, equitable, and inclusive volunteer community and providing opportunities for security professionals around the world to participate at the highest levels of strategic leadership supporting our regional and global boards of directors. The Global and Regional Boards help determine and support the direction for ASIS International around the world or in their region. The Nominating Committees identify and select officer and director candidates to serve on ASIS Boards Mark Folmer, CPP, PSP, North American Regional Board of Directors, Chair Erik de Vries, European Regional Board of Directors, Chair Alvar Orellana McBride, CPP, Latin America Caribbean Regional Board of Directors, Member Tim McCreight, CPP, Global Board of Directors, Past President Go to previous slide. Go to next slide. Want to know more about global governance – what it is and how you can participate? Check out our FAQs. What skills and competencies should someone have to serve on a Nominating Committee?Members considering a role on an ASIS Nominating Committee must have a passion for the organization to ensure the leaders selected will do their duty to guide the organization to meet the mission of the organization and the global security profession Who is eligible to serve on Nominating Committee?Ideal candidates for a Nominating Committee must have been a member of ASIS and have served as a volunteer in a leadership role (Chapter Chair, Chapter Vice Chair, Community Chair, Community Vice Chair, global or regional board committee member, member of the PSB, PCB, Foundation BOT, CSO Center Board, etc.) for no less than 5 years. What are the roles and responsibility for Nominating Committees?In addition to selecting its own members, Nominating Committees identify and select officer and director candidates to serve on ASIS Boards who meet the desired competencies and characteristics identified for the overall composition of the Board. They will ensure that the selection process is properly implemented as prescribed in the association’s policies. In many respects, the nominating committees are the most important committees at ASIS; these committees are responsible for the selection of the leaders of the organization at the global and regional level. What skills and competencies should someone have to serve on a Board of Directors?To serve on a Board of Directors, candidates must have a global or regional view of the profession, want to elevate the profession by identifying opportunities for ASIS to support and advance security worldwide, and be a servant leader – putting the needs of ASIS members before individual needs. A complete list of skills and competencies are listed in our FAQs. Who is eligible to serve on Board of Directors?Ideal candidates for a Nominating Committee must have been a member of ASIS and have served as a volunteer in a leadership role (Chapter Chair, Chapter Vice Chair, Community Chair, Community Vice Chair, global or regional board committee member, member of the PSB, PCB, Foundation BOT, CSO Center Board, etc.) for no less than 5 years. What are roles and responsibilities for Board Directors?The Global Board of Directors provide strategic guidance, high-level oversight, and resource allocation for global direction of the organization. This is the ultimate fiduciary body of the organization, and its primary function is to determine resource strategy globally. Regional Boards of Directors, reporting to and working in concert with the Global Board of Directors, determine the business plan that meets the needs of members in a specific region in alignment with the global strategic plan that is locally, regionally, and culturally relevant. Regional boards carry out strategy, policy, and standard operating procedures in their respective regions. Download All FAQs"
year_published = 2025
