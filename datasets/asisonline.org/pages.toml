["https://asisonline.org/certification/recertification"]
title = "How to Recertify"
description = "To stay current with your certification, you must recertify your designation every three years by completing 60 continuing professional education credits."
full_description = "Maintain Your ASIS Certification Earning your APP®, CPP®, PCI®, or PSP® credential took hard work and dedication to mastering security’s essential domains. Ensure your certification stays active — and as meaningful today as the day you earned it — by recertifying with 60 hours of continuing professional education every three years. Want to talk to a recertification specialist? Email us at [email protected]. Earning Your Required CPEs You must complete 60 Continuing Professional Education (CPE) hours during your three-year certification cycle to remain certified. Recertification credits are earned only for security-, business-, or safety-related learning, teaching, or service activities that are not part of your regular job duties or company-specific training. CPEs must link to the domains of your certification exam and may be earned in the following categories: Membership (max. 24 CPEs) Educational Instructor (max. 30 CPEs) Author Volunteer (max. 30 CPEs) Certification, Standards & Guidelines Program Service Public Service Other Accomplishments NOTE: Safety-related learning is allowed a maximum of 21 CPE across all categories in a three-year certification cycle. A total of 10 CPEs may be claimed each three-year certification cycle for podcast or vlog creation and publishing (Author Credit Category 4). Tracking and Submitting CPEs All recertification CPEs and related documents must be stored and submitted using the online ASIS portal, which allows you to easily upload CPEs as they’re earned. Your recertification application may be submitted anytime in the third year of your certification cycle. Get step-by-step instructions for completing your recertification application. With the exception of ASIS membership, ASIS volunteer leadership, ASIS Global Access Live, and the Global Security Exchange (GSX), all ASIS-related activities will no longer be uploaded to your online certification account by ASIS. You will receive a certificate of completion or other documentation for all other ASIS-related activities from your ASIS leader. This documentation, which you must upload into your account, will be guaranteed CPE credit. For the CPEs that are loaded into your account by an ASIS staff member, please allow 4-6 weeks after the activity has ended for your CPEs to appear in your account. For ASIS webinars and ASIS online programs, your participation will upload no more than 48 hours after the webinar. NOTE: Use the Calculate Hours button in your ASIS portal account before adding new CPE credits to ensure your total CPE hours are accurate. For a full overview of the process of tracking and submitting credits, refer to ASIS’s Recertification Guide. It provides detailed explanations for each of the categories listed and the documentation you must provide to verify completion of your CPEs. Recertification Guide Guia De Recertificacion"
year_published = 2025
