full_description = "Achieve Your Professional Best Physical security assessments, designs, applications, implementations, and integrations—the Physical Security Professional (PSP®) certification shows your mastery of them all. By earning the PSP, you’ll have the knowledge to stay ahead of physical security threats and safeguard your organization. Start your certification journey today. Apply for PSP Confirm Your Expertise Your organization knows you’re the expert on physical security—earn the credential that lets the world know it, too. The PSP certification elevates your status, and your competitive advantage, in this all-important field. You are seen and acknowledged for exceptional skill in protecting your organization’s assets—its people, property, and information. Earning this credential isn’t just a significant professional accomplishment—it’s an international symbol of excellence that reinforces your credibility. Watch this video to learn more about each certification and what you need to get started – and check out our step-by-step application guide. PSP Eligibility Requirements The Physical Security Professional certification is designed for individuals with three to five years of relevant physical security experience. Additional requirements include: Full-time employment in a security-related role. Have not been convicted of any criminal offense that would reflect negatively on the security profession, ASIS, or the certification program. Willingness to sign and agree to abide by the ASIS Certification Code of Conduct. Willingness to agree to abide by the policies of the ASIS Certification programs as outlined in the Certification Handbook. Why Earn the PSP Designation? Need a few more great reasons to start your application? Validate your physical security expertise Gain global recognition by your peers and the industry Get a competitive edge in the marketplace Enhance your career and earnings potential Enjoy personal satisfaction and professional achievement Start Your Application"
