full_description = "Amid DEI Challenges, Organizations Choose to Focus on Inclusion A wide body of research has found that employees who perceive their organizations are inclusive, diverse, and equitable make better business decisions, feel more engaged at work, and less likely to look for new employment options.Proponents of DEI practices agree that some DEI programs can be wasteful, misapplied, or uneven, but they warn against throwing out the baby with the bathwater. Continue Reading How Well-Being Can Bring Value Back to In-Office Work By acknowledging and accommodating the variety of styles through which people accomplish their jobs, companies foster a culture of inclusivity and respect, creating an environment where employees feel valued for their unique contributions. Read More Corporate Security Is Curious about AI, But Is It Useful Yet? Data from the 2025 ASIS Security Trends study shows security professionals have begun dabbling in artificial intelligence applications and think there is great potential in the near future. Read More Fostering Employee Success and Retention Through Inclusive Workplace Safety Training Language barriers can impact the effectiveness of safety training, leaving non-native speakers at a disadvantage and reducing overall training retention. Read More Security Technology: Facing the Fraudsters Consumers lost more than $4.6 billion to investment fraud scams in 2023, while occupational fraudsters netted more than $3.1 billion during that same period. With fraudsters continue to rake in payouts, security practitioners are looking to new tools, technologies, and partnerships to counter them. Read the Issue When Considering Liability, Don’t Overlook Your Parking Lots and Incident Reports Everybody enters facilities through parking lots or parking garages, but these areas are often an afterthought for security, says lawyer Michael Haggard. But considering crimes of opportunity as well as liability issues, that uneven focus can be costly for organizations and commercial property owners. Also in this episode of SM Highlights, Eddie Sorrells, CPP, PCI, PSP, president of DSI Security Services and vice-president of ASIS International, digs into the who, what, when, where, and—most importantly—the why behind security incident reports. Listen Now"
