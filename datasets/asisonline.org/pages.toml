["http://www.asisonline.org/security-management-magazine/articles/2025/03/inclusion/workplace-safety-training"]
title = "Fostering Employee Success and Retention Through Inclusive Workplace Safety Training"
description = "Language barriers can impact the effectiveness of safety training, leaving non-native speakers at a disadvantage and reducing overall training retention."
full_description = "Illustration by iStock; Security Management. Physical and operational security Security awareness and education Fire and life safety Fostering Employee Success and Retention Through Inclusive Workplace Safety Training By Clare Epstein 1 March 2025 Focus on Inclusion at Work Security Management has partnered with FMJ, the publication of the International Facility Management Association (IFMA), to bring you relevant articles on key workplace topics and strategies. Workplaces are evolving more rapidly than ever as a result of major technological advancements, including artificial intelligence (AI) and automation. Providing workers with a safe environment has always been important, but in this quickly changing landscape, it is growing more difficult to navigate. Companies must balance the pace of innovation with the well-being and expertise of their workforce. Despite the increasingly available access to training materials and safety resources, a growing number of workers face on-the-job dangers. Work-related deaths are on the rise, with an estimated 2.9 million annual deaths globally attributed to work-related diseases and occupational injuries. Implementing comprehensive company training programs is crucial in addressing these challenges. Organizations that implement strong safety training programs have experienced a 24 percent reduction in injuries compared to those that do not. Additionally, nearly half of workers believe that their employer could do more to reduce workplace incidents, emphasizing the need for enhanced safety measures and support from employers. Employers have a growing responsibility to cultivate safe environments for their staff, and to do so, they need to invest in comprehensive, engaging and accessible training. This, in turn, helps foster a culture focused on worker well-being and long-term success. The State of Workplace Safety Training Many workers find themselves navigating their roles without the right preparation or guidance needed to ensure their safety and well-being. The current labor shortage is worsening by the ongoing knowledge gaps left by older workers reaching retirement age, often referred to as the “silver tsunami.” This is impacting industry turnover, with 75 percent of global employers in 2024 having reported difficulty in filling roles. With a focus on closing employment gaps, employers need to retain the operational knowledge and skills from retirement workers. This will help keep new and current employees aware of proper protocols and procedures to keep them safe on the job. Shortfalls in education on safety protocols can not only heighten the risk of workplace accidents, but also contribute to increased turnover rates, further worsening the already troubling skills gap. Not only is education on safety protocols necessary, but retention of this information is key to long term employee well-being and success. One hurdle that can impact the effectiveness of safety training is language barriers, which can leave non-native speakers at a disadvantage and reduce overall training retention. OSHA requires training to be delivered in a language that is spoken by employees, but unfortunately, for many, this may not necessarily be the language in which they are most fluent. With half of non-native English speakers reporting that their company does not offer training in their native language, it is clear companies are not prioritizing workers who do not speak the same first language as their employer. The inability to effectively understand training materials can significantly impact the comprehension and retention of safety protocols among employees. An over-reliance on traditional, in-person training methods also poses its own limitations in making training accessible and engaging. While face-to-face training offers direct interaction with employers, it is often inaccessible due to language barriers, inefficient due to logistical or scheduling challenges, or too time-consuming to keep employee attention. These factors can result in crucial information slipping through the cracks. Workplace safety training must go beyond simply teaching accident prevention and instead look to constantly prioritize the dynamic needs of the workplace. By fostering safe environments, organizations can reduce accidents and improve existing procedures. This approach also cultivates higher levels of employee morale, enhancing overall motivation and productivity among staff. How to Improve Training Programs Safety training is an essential part of every job, yet it is an aspect that can often fall short of expectations. There is no better time than now for employers to re-evaluate their safety training procedures and meet these modern problems head on with modern solutions. Nearly a third of employees who are dissatisfied with their training are considering leaving their job as a result. To retain these workers, employers need to take proactive measures to improve the delivery and content of their training. With a growing global labor shortage, providing accessible and timely opportunities for learning through comprehensive training programs demonstrates to workers that their long-term success is worth investing in - keeping them both well-informed and motivated to work hard. Here are a few tips for employers to enhance their training programs: Proactive versus reactive training. To keep up with the needs of staff in a dynamic work setting, employers should ensure that their training processes are proactive rather than reactive. Anticipating potential hazards and addressing them before they result in incidents shows employees that their safety is always in consideration. Additionally, alerting employees to upcoming changes in regulations before they are mandated allows them time to become comfortable with any adjustments that they may need to make ahead of time. Incorporating proactive training into a workplace involves conducting regular risk assessments, updating safety protocols, and providing employees with continuous education about new and existing risks. Making regular updates to the content, as well as incorporating refresher microlearning training, can help keep this information relevant and fresh long after it is introduced. Utilizing technology. With new technology like VR and AI available to create immersive simulations and interactive content, employers have more options than ever to help employees understand and apply what they have learned. Technology can help create engaging personalized courses, individualized feedback, and realistic scenarios that can better prepare workers for challenges they may face on the job. Additionally, digital natives may come to expect this technology to be implemented in their workplace training now that it has been established across many modern workplaces. To deliver effective training leveraging technology, employers should also consider competency and skill assessments via online surveys to determine individual training needs. This ensures that workers are only being trained in what they do not already know, which makes for a better learning experience for the employee and creates more efficient processes for the employer. In the same vein, pre- and post-course assessments are also helpful in maintaining retention by tracking employee growth in one centralized place. Industry-based real-world scenarios. Another key aspect for employers to consider when implementing training methods is to focus on the specific needs and challenges faced by their workforce. Companies can leverage training that incorporates real-world scenarios and problem-solving exercises specific to their day-to-day operations. For example, construction workers might benefit from hands-on training with machinery, while those in mechanical engineering could benefit from in-depth simulations of complex repairs. Providing these opportunities to learn in a practice setting allows employees to feel more comfortable trying new things and making mistakes, as it allows them to grow and gain experience relevant to their role. Inclusive training programs. Most non-native English speakers feel uncomfortable reporting workplace hazards in their English-dominant workplaces, and many often feel pressured to prioritize productivity over safety in the workplace. On top of this, a large number of companies do not offer training in enough languages to meet the needs of their diverse workforce, making access and comprehension difficult for non-native speakers. This can lead to severe gaps in understanding key processes, and in extreme cases could potentially result in work-related injuries or deaths. It can also lead to feelings of exclusion or feeling unvalued in the workplace. Employers should ensure they offer training in multiple languages to address these disparities, as it shows their commitment to employee well-being. When training cannot be offered in multiple languages in-person, employers should explore offering online training that can cater to a variety of languages. Online training programs can help in this regard, as they could translate materials through AI with human oversight. It is essential for everyone to understand safety protocols and work together as a team to reduce the risk of accidents, and part of that is ensuring that nothing becomes lost in translation when it comes to safety. Conclusion Safety is the foundation of any successful workplace environment, and it is crucial to ensure that workers feel secure in their daily responsibilities. Safety incidents can occur at any time, but nearly half of industrial employers believe that their employers can be doing more to reduce safety incidents. In addition, most people who have experienced workplace incidents said that they could have been prevented through improved safety measures. Employers have a vital role to play in shaping safety culture, and by implementing training programs to suit the diverse needs of their workforce, they can ensure every employee has the knowledge to navigate any workplace scenario. By integrating strategies to improve their safety training protocols, employers will be more likely to retain their workers and ensure they are safer and smarter. These updated processes can enhance employee retention and recruitment, thereby helping to close the labor gap. Having a system set in place for continuous feedback where employees can share their suggestions to improve training processes is essential for employers when considering what training programs to implement. Showing genuine care for employee well-being through these strategies will help improve the state of worker safety across industries. Clare Epstein serves as general manager, commercial, at Vector Solutions, bringing more than 20 years of leadership experience working with safety training and technology solutions. As general manager, Epstein is responsible for driving strategy, execution, and growth for Vector’s commercial market segment which serves customers across manufacturing, oil and gas, property management, engineering, and construction. She first came to Vector after the company’s acquisition of IndustrySafe, a leading provider of EHS software, where she was the chief operating officer. Her experience also includes leadership roles at Civis Analytics and theEMPLOYEEapp. Epstein holds a master’s degree of city planning from the Massachusetts Institute of Technology and a bachelor’s degree in urban studies from the University of Pennsylvania. © 2024 IFMA. This article is reprinted from FMJ with permission from IFMA. All rights reserved. MOST POPULAR ARTICLES 1. United States Designates 8 Cartels as Terrorist Organizations 2. Keeping Convenience Stores Safe from Physical Threats 3. Making Coordination with Law Enforcement More Convenient See Latest Headlines"
