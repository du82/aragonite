["https://asisonline.org/get-involved/awards--scholarships"]
title = "Awards & Scholarships"
description = "ASIS International is committed to honoring outstanding achievements and nurturing the next generation of leaders. Through our prestigious awards, scholarships, and grants, we celebrate the dedication, innovation, and impact of individuals and organizations who elevate the security management profession."
full_description = "ASIS International is committed to honoring outstanding achievements and nurturing the next generation of leaders. Through our prestigious awards, scholarships, and grants, we celebrate the dedication, innovation, and impact of individuals and organizations who elevate the security management profession. Explore how you can nominate deserving candidates or apply for opportunities that invest in your potential. We are stronger together! Apply Online by 30 April 2025. Apply Now President's Award of MeritThis award is bestowed by the President of ASIS International to an individual member for distinguished service, achievement, and/or contributions. This award does not accept nominations. Women in Security Global Community Karen Marquez HonorsThis award honors an ASIS International female member who has consistently worked for the betterment of the security industry. NextGen of the Year AwardThis award recognizes an ASIS member under age 40 who demonstrates a dedication to the security industry through strong leadership, teamwork, and innovation while continually developing their knowledge and experience. Roy N. Bordes, CPP Community Member Award of ExcellenceThis award recognizes an ASIS International member who has exhibited selfless devotion as a volunteer, emphasizing significant contributions at the subject area community level over an extended period of time. Ralph Day Memorial Security Officer Heroism AwardThis award recognizes heroism in circumstances where a private security officer risks their life to protect or save lives and/or property. Don Walker Memorial CSO Center Security Executive AwardThis award recognizes a senior level executive who demonstrates commitment to security management education, certification, and standards and guidelines for the executive management level of the security discipline in a given enterprise. E.J. Criscuoli, Jr., CPP Memorial Volunteer Leadership AwardThis award recognizes an ASIS International member who has exhibited selfless devotion at the volunteer level, emphasizing significant contributions at the chapter and regional levels over an extended period of time. PCB Outstanding Achievement AwardThe award recognizes an individual for service rendered to the advancement and promotion of the ASIS Certification designations of CPP, PCI, PSP, and APP, in which they have displayed outstanding leadership and commitment to the profession. Distinguished Service AwardDistinguished Service Awards recognize individuals (up to 10 annually) who have demonstrated exceptional dedication, commitment, and outstanding contributions to ASIS International during the award year."
