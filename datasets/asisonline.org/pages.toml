title = "ASIS Foundation"
description = "ASIS International’s Foundation offers scholarships and grants for private security and cybersecurity professionals for ASIS certification and education."
full_description = "The ASIS Foundation helps security professionals achieve their career goals with certification scholarships, practical research, member hardship grants, and more. Your Foundation is supported by generous donations from ASIS members, chapters, and organizations. Become an ASIS Foundation Fitness Challenge Sponsor. Available Sponsorships The ASIS Foundation was founded as an affiliate of ASIS International in 1966 to serve the security industry through scholarship and research. The Foundation provides an opportunity to give back to security industry colleagues and awards more than 100 grants and scholarships annually to support security professionals. It is governed by a volunteer Board of Trustees and managed by a staff manager. The Foundation’s work is made possible by generous gifts from individuals, chapters, councils and organizations. EducationWe offer Scholarship and grant opportunities for those pursuing physical security and cybersecurity careers ResearchWe conduct timely security research on contemporary threats, best practices, and regulations providing valuable and actionable knowledge for the security profession. The Foundation’s work is made possible by generous gifts from individuals, chapters, councils and organizations. Donate Today New! Donate via PayPal. Europe Conference Pin Donate $20 or more to the ASIS Foundation and receive an exclusive ASIS Europe Commemorative Conference Pin! Limited Supply! Donors must be available to pick their pins up during the ASIS Europe Conference on March 4-5, 2025 at the Convention Centre Dublin (CCD) Spencer Dock, North Wall Quay, Dublin, Ireland. No pins will be mailed. Autonomous Vehicles: Threats, Risks, and Opportunities Autonomous vehicles are no longer technology to be aware of on the periphery; they have arrived. The use of consumer grade drones as weapons of destruction and invaluable reconnaissance in Ukraine and Gaza serves as a warning that such systems are effective and can be put to any number of creative uses. While many of the headlines are negative, autonomous cars demonstrate just how far those systems have come. There are many opportunities for corporate security to use autonomous vehicles to enhance their security posture. Of course, the technology also presents new threats, which present a new set of risks organizations must consider. In this extensive research project, researchers Ishmael Bhila and Peter Lee from the University of Portsmouth and Alison Wakefield from the University of West London, guide readers to a greater understanding of autonomous vehicles, including those that operate in the air, on land, on the water, and underwater. They examine how they have been used, what potential they have, and how they have evolved. They discuss how artificial intelligence is affecting their capability, and they discuss both what regulations currently exist around the world and what direction future regulations may take. Read the Executive Summary | Full Report View All Research Reports"
