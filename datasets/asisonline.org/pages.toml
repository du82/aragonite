title = "New Member Portal"
full_description = "Jump-Start Your Journey at a New Member Orientation Hit the ground running with ASIS by attending a new member orientation session, where you’ll gain insight on how to make the most of your membership and connect with other new members. You can choose to attend one or more of the following sessions by clicking on the link to register. 2025 Orientation Schedule 11 March - 11am ET 08 July - 11am ET 13 May - 11am ET 09 September - 11am ET 10 June - 11am ET (Spanish Orientation) 18 November - 11am ET Please note that orientations will be recorded and available on-demand. To access these recordings, you will need to be signed in to ASIS Connects. Create Your Member Profile and Tell us About Yourself Log into your ASIS Account to share your background, communication preferences, and add a photo to personalize your profile so members can put a face to your name. Be sure to fill out your profile fully so like-minded peers can easily find and connect with you. Then download the ASIS logo and learn more about your ASIS Members Badge which allows you to validate and share on social media sites your affiliation with ASIS International. To access the ASIS logo and Member badge, you will need to be signed in. Connect with Security Professionals Around the World ASIS’s global community is highly engaged and eager to help every member of the profession succeed—and it’s connecting as we speak. Ready to see what your colleagues are saying? Log on to ASIS Connects, your 24/7 link to ASIS’s 34,000 professionals, to ask questions, share stories, contribute knowledge, grow your network, and collaborate on the challenges you face in our Subject Area Communities. Check out your New Members Community for pointers of how to get started. To access the New Member Community, please note you will need to be signed in. Get Involved in Your Local Chapter Leveraging local ASIS connections is a great way to build your nearby network and raise your profile in the community. Reach out to your local chapter’s leadership to start taking advantage of events and professional development happening closer to home. Find your chapter leadership via the My Chapters link in the right column of your My Account page and learn how you can get involved."
