["https://asisonline.org/certification/prepare-for-test-day"]
title = "Prepare for Test Day"
description = "You’ve worked hard to prepare for your certification exam - review test day requirements carefully so you’re ready for success."
full_description = "Are You Ready for Your Exam? ASIS board certification validates your security expertise, gives you a competitive edge, and elevates your professional standing—but first you have to take the exam. We strongly encourage you to review test day requirements carefully so you’re ready for success. Want to talk to a certification specialist? Email us at [email protected]. ASIS certification exams are offered year-round in-person and remotely. All exams are administered by Prometric—learn more and schedule your test today. To take the exam remotely, please review the FAQs to ensure you have the technology to successfully take the exam on your own computer. To take the exam at a Prometric test center, first go to prometric.com/asis to locate the nearest testing facility. Whether you prefer to test in-person or remote, you’ll need the following to schedule your exam: Your Eligibility ID, which can be found on your Authorization to Test letter (your ASIS Contact Number or Member ID) The first four letters of your last name (surname) Once your exam appointment is confirmed, Prometric will send you an email with your exam time and confirmation number. Make sure to save this information. You will need the confirmation number and two (2) valid government-issued photo identifications with signatures before you are permitted to test. Proper ID can include a driver’s license or passport. Social Security cards are not accepted. The name on your identification MUST exactly match the name of your confirmation email. Test day requirements differ depending on if you are taking your exam in-person or remote. Carefully review the important information below before your exam appointment to ensure you’re prepared and confident on test day. Want to get answers to commonly asked questions? Check out our Ask Me Anything: Test Admin and Test Taking Strategies session. In-Person Testing As noted above, you’ll need to bring your exam confirmation number as well as two (2) valid, signed, government-issued photo IDs to the test center for verification. Prometric advises arriving at least 30 minutes before your exam time to complete the check-in process. Review Prometric’s frequently asked questions to learn more about scheduling, test administration, and more."
year_published = 2025
