["https://asisonline.org/link/0cb62b41583f452697d45a04d685ada1.aspx"]
title = "Executive Leadership"
full_description = "​​​​If you need a photo, wish to speak with ASIS leadership, or need more information about ASIS programs and services​, please contact ASIS public relations at [email protected] or +1.703.518.1415. Joe Olivarez Jr., MBA 2025 ASIS International President Joe Olivarez Jr., MBA, is the 70th president of ASIS International. Oliverez is an American citizen with more than 25 years of experience working in international security. He is currently the vice president of the Operational Center of Excellence and CSO at Jacobs. Olivarez has been a member of ASIS for 35 years and a member of the CSO Center for over a decade. He has served on a variety of different committees and boards across the organization. Olivarez has a Bachelor of Arts in Criminal Justice with an emphasis in legal research from Stephen F. Austin State Univeristy and a Master of Business Administration from the University of Houston. View a list of previous ASIS presidents. William Tenney Chief Executive Officer William “Bill” Tenney is a Navy veteran and recognized professional in the fields of corporate security, intelligence, and business resilience. He has built and led high-performing teams in financial services, technology, media, and retail sectors in the U.S. and overseas. In the private sector, Bill has built and led corporate security teams at MetLife, Bloomberg LP and Target. Bill began his career in the U.S. Navy, serving in the U.S., Japan, and London, and deployed aboard the USS Midway and USS Independence. He also served in the foreign service in Washington, D.C., the U.S. Embassy in Ankara, Turkey, and the U.S. Mission to the United Nations in New York. He earned a master's degree in National Security Studies from Georgetown University’s School of Foreign Service, and a Bachelor of Arts in Political Science from St. Olaf College. ASIS International Global Board of Directors Executive Committee President Joe M. Olivarez Jr., MBAJacobs | Houston, TX, USA President-Elect Edd