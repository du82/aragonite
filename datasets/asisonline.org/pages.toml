title = "Public-Private Partnerships (P3) Day"
description = "The International Association of Chiefs of Police (IACP), the National Sheriffs’ Association (NSA), and ASIS International (ASIS) are very pleased to announce the initiation of the Public Law Enforcement/Private Security Partnership Day. Public-Private Partnership (P3) Day is a long-term collaborative effort between all three founding organizations and was approved by the boards of directors from all three partner organizations. It will occur on the fourth Thursday of April every year, with the inaugural P3 Day occurring on Thursday, April 25, 2024."
full_description = "Public-Private Partnerships The mission of P3 Day is to foster and support the development of strong, robust, and enduring partnerships between the public safety community and the private security industry. It will occur on the fourth Thursday of April every year, with the inaugural P3 Day occurring on Thursday, April 25, 2024. The International Association of Chiefs of Police (IACP), the National Sheriffs’ Association (NSA), and ASIS International (ASIS) are very pleased to announce the initiation of the Public Law Enforcement/Private Security Partnership Day. Public-Private Partnership (P3) Day is a long-term collaborative effort between all three founding organizations and was approved by the boards of directors from all three partner organizations. View the Public-Private Partnership Day presentation (pdf) Read the Press Release There are a number of ways your chapter can get involved in P3 Day. Create a role for a law enforcement liaison sub-committee in your chapter leadership Invite representatives from local law enforcement to your chapter meetings Apply to the annual Matthew Simeone Award Share your stories of successful public-private partnerships Public-Private Partnerships: A Keystone for Safer Communities WorldwidePublished by: ASIS International Police and Private Security Partnerships: Collaborating to Meet Growing ChallengesPublished by: Community Policing Dispatch Public–Private Partnership Case Study: OSACPublished by: Security Management Leaning into Public–Private Partnerships to Create Cultures of SafetyPublished by: Security Management Enduring Security Framework (ESF) — Bringing public & private sectors together on Intelligence-driven, shared cybersecurity challengesPublished by: National Security Agency (NSA)"
