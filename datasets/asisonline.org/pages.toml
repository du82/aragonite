description = "Founded in 1955, ASIS International is the world's largest membership organization for security management professionals. With hundreds of chapters across the globe, ASIS is recognized as the premier source for learning, board-certification, networking, standards, and research."
full_description = "Happy Member Appreciation Month This month, we celebrate YOU! Every day we are reminded of what makes ASIS so dynamic—our members. Through this global network of over 34,000+ members worldwide, members are supporting one another by sharing industry best practices, resources, and insightful advice. Discover new member-only content releases, webinars, and sales! Explore Recent Blog Posts CSO Center Security Insights: Decision Making Sex Trafficking: Misinformation Isn’t Helping Anyone Today in Security History: The First ASIS Board Get to Know the 2025 ASIS Board Chairs Congratulations to Our Newly Board-Certified Security Practitioners for January 2025 A Super Bowl Security Tailgate Blog View All Blog Posts... Security Management Articles United States Designates 8 Cartels as Terrorist Organizations Keeping Convenience Stores Safe From Physical Threats Making Coordination With Law Enforcement More Convenient Europol Publishes Framework on Ethical Use of New Technology in Law Enforcement U.S. Organizations Debate How to Comply to New DEI Guidelines and Restrictions Read the Latest Security News March is Member Appreciation Month! Every day we are reminded of what makes ASIS so dynamic—our members. Through this global network of over 34,000+ members worldwide, members are supporting one another by sharing industry best practices, resources, and insightful advice. This month, discover new member-only content releases, webinars, and sales! Learn More Applications Open for Awards & Scholarships ASIS International is committed to honoring outstanding achievements and nurturing the next generation of leaders. Through our prestigious awards, scholarships, and grants, we celebrate the dedication, innovation, and impact of individuals and organizations who elevate the security management profession. Explore how you can nominate deserving candidates or apply for opportunities that invest in your potential. Apply online by 30 April 2025. Learn More ASIS Foundation Gives Back to the Security Industry The ASIS Foundation helps security professionals achieve their career goals with certification scholarships, practical research, member hardship grants, and more. Your Foundation is supported by generous donations from ASIS members, chapters, and organizations. Learn more about the ASIS Foundation. Donate Now"
