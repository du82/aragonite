full_description = "How Can I Get Involved? ASIS is a vibrant professional organization where getting involved will help you get the most out of your membership. We offer many different opportunities to engage as a member. Whether you are new to the industry or have been a security management professional for decades, we have opportunities for you. Chapters Chapters are the heart and soul of the ASIS community, creating professional development and networking opportunities at the local and regional level. ASIS members are assigned to one of 240+ chapters around the world. Learn More Global Events As the preeminent organization for security management professionals, ASIS International offers a dynamic calendar of events to advance your professional development. From executive education to global exchanges, our events work together to help you reach new heights in your career. Learn More Subject Area Communities ASIS International’s Communities offer ways for you to connect with others in your industry on a global scale, share best practices, ask questions, and collaborate on new resources for specific sectors of security management. Learn More Mentoring Program The ASIS' Security Leaders Mentoring program offers a unique online networking and career development tool, helps you find, connect, and share experiences with others. Your mentor or mentee can be in the same city or on the other side of the world. Regardless, the relationship can be life changing! Learn More Volunteer Opportunities Volunteering with ASIS International allows you to engage and connect with fellow professionals while empowering yourself and the community. Explore current volunteer opportunities and make a commitment to yourself and the profession View Opportunities ASIS Connects Your trusted community for global security professionals. ASIS is where security professionals including CEOs, directors and managers collaborate on ideas, share lessons learned and build new partnerships. With many opportunities for cross-market networking across a global community of 34,000 members. Participate Now"
