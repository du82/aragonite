title = "Associate Protection Professional (APP)"
description = "The APP certification confirms the expertise you’ve acquired after one year of experience in the security field. Apply today."
full_description = "Make the Smart Move Where do you want to go in your security career? The Associate Protection Professional (APP®) certification will help you get there. This globally recognized designation from ASIS International opens new pathways for professionals who have recently entered the security field. Get started today. APPLY FOR APP Ready to Launch? Whether you’ve recently obtained your degree or made the switch from an entirely different sector, the APP certification is your first step in advancing your security career. This designation, which you can earn with only a year of applicable experience, shows hiring managers that you have an assured grasp of the fundamental security skills you need to level up your career. Build confidence in your security skills and knowledge—earn your APP credential now. Watch this video to learn more about each certification and what you need to get started – and check out our step-by-step application guide. APP Eligibility Requirements The Associate Protection Professional certification is designed for entry-level security professionals with one or more years of related, compensated experience (or six months of related, compensated experience if you have obtained a related, approved certification). Additional requirements include: Full-time employment in a security-related role Have not been convicted of any criminal offense that would reflect negatively on the security profession, ASIS, or the certification program Willingness to sign and agree to abide by the ASIS Certification Code of Conduct Willingness to agree to abide by the policies of the ASIS Certification programs as outlined in the Certification Handbook Why Earn the APP Designation? Need a few more great reasons to start your application? Validate your security expertise Gain global recognition by your peers and the industry Get a competitive edge in the marketplace Enhance your career and earnings potential Enjoy personal satisfaction and professional achievement Start Your Application"
