["https://asisonline.org/link/632cc07b6b5f474fb48735b3726eda13.aspx"]
title = "Privacy Policy"
full_description = "ASIS Homepage Privacy Policy Effective 08 July 2020 Contents IntroductionData Protection OfficerHow we collect and use (process) your personal information 1. Personal information you give to us: 1. Membership 2. Live events and web conferences 3. Publications 4. Professional Development 5. Certification 6. Your correspondence with ASIS 7. Purposes for processing your data 8. Payment card information 2. Personal information we get from third parties 3. What happens if you don’t give us your dataUse of ASIS WebsiteCookies and web beacon How is ASIS using cookies? Categories of ASIS cookies: Authentication Security Preferences, features and services Marketing Performance, Analytics and Research How are cookies used for advertising purposes?Website TrackingWhen and how we share information with others Member DirectoryTransferring personal data from the EU to the USData subject rightsSecurity of your informationData storage and retentionChanges and updates to the Privacy PolicyQuestions, concerns or complaints Introduction ASIS International (ASIS) is a global community of security practitioners, each of whom has a role in the protection of assets—people, property, and/or information. Our members represent virtually every industry in the public and private sectors, and organizations of all sizes. From entry-level managers, CSOs and CEOs to security veterans, consultants, and those transitioning from law enforcement or the military, the ASIS community is global and diverse. We understand that you are aware of and care about your own personal privacy interests, and we take that seriously. This Privacy Policy and Conditions of Use describes ASIS’s policies and practices regarding its collection and use of your personal data and sets forth your privacy rights. We recognize that information privacy is an ongoing responsibility, and so we will from time to time update this Privacy Policy as we undertake new personal data practices or adopt new privacy policies. As a general practice, we do not knowingly attempt to solicit or receive information from children. Data Protection Officer ASIS is headquartered in Virginia, in the United States. ASIS has appointed an internal data protection officer for you to contact if you have any questions or concerns about ASIS’s personal data policies or practices. ASIS’s data protection officer’s name and contact information are as follows: Jason Porter 1625 Prince St.Alexandria, VA USA [email protected] How we collect and use (process) your personal information Personal information you give to us: 1. Membership When you become an ASIS member, we collect information about you including (but not limited to) your name, your employer’s name, your work address (including your country location), information about your professional position, eligibility information, and your email address. We may also collect:Your personal email address, a personal mailing address, and a mobile phone number. We ask members to voluntarily provide additional information in their membership profile, such as information about their educational background, number of years in the industry, and the like. Members may edit their profile at any time to change, add, or remove personal information. We process your personal information for membership administration, to deliver member benefits to you, and to inform you of ASIS-related events, content, and other benefits or opportunities associated with your ASIS membership. ASIS may also use this information to help us understand our members’ needs and interests to better tailor our products and services to meet your needs. ASIS relies on fulfillment of contract as the lawful basis under GDPR Article 6 for processing members’ personal information. 2. Live events and web conferences ASIS hosts or sponsors many events throughout the year. These include in-person conferences like the Global Security Exchange (GSX) and ASIS Europe, for example, as well as live web conferences and classroom programs (collectively “events”). If you register for one of our events and you are a member, we will access the information in your member account to provide you with information and services associated with the event. If you are not a member and you register for one of our events, we will collect your name and contact information, which we will store in our database(s) and use to provide you with information and services associated with the event. We process this information to fulfill the order you have made to receive the event or web conference services. If you are a presenter at one of our events, we will collect information about you including your name, employer, contact information, and headshot, and we may also collect information provided by event attendees who evaluated your performance as a presenter. We may also make and store a recording of your voice and likeness in certain instances. ASIS relies on a legitimate interest basis for collecting, storing, and processing this information. We keep a record of your participation in ASIS events as an attendee or presenter. This information may be used to provide you with membership and certification services (for example, keeping track of your continuing professional education (CPE) credits, or to tell you about other events and publications). It may also be used to help ASIS understand our members’ needs and interests to better tailor our products and services to meet your needs. In association with attending one of or more of our events, you may have the option to download an “ASIS Events App” to help you navigate the event and plan your schedule. The ASIS Events App may require the device identifier associated with the device you use it on. Information may also be collected from you when you register on the App, enter information, write posts/comments, add content to favorites, provide ratings or submit educational content (such as documents, videos, narrations and images), are active on an educational activity, download materials, create content (such as quizzes), and when you use mobile device resources (such as camera or microphone) to scan Quick Response (QR) codes, submit photos, record narrations and send educational materials. Some of our events are sponsored in a way that attendance is free of charge. For these events (such as Webinars), ASIS provides a post-event registration list to sponsors and/or co-sponsors. Any such event will include notification verbiage on the registration page with a clear ask for opt-in. Exhibitors at ASIS events may wish to scan your badge so they can contact you with more information. ASIS uses MCI to provide badge scanning services to exhibitors who request it. By allowing an exhibitor to scan your badge, you are consenting to have MCI and ASIS provide the exhibitor with your contact information, and thereafter you may be contacted by the exhibitor post-event. To manage your personal information with the exhibitor, please communicate directly with the exhibitor. 3. Publications ASIS offers a great deal of content for our members. In addition to producing original content, ASIS also subscribes to news feeds and blogs produced by others, which we often link to from our website or provide via an email. This means you may find yourself on the ASIS website or reading an email from the ASIS publications team and we will offer you a link to another organization’s website where you will find content on interesting topics that we find relevant and useful to you. At these times, you will be leaving the ASIS website. ASIS is not responsible or liable for content provided by these third-party websites or personal information they may happen to gather from you. You may wish to subscribe to ASIS’s publications without becoming a member of ASIS. For example, many people sign up to receive ASIS’s newsletters even though they are not ASIS members. To receive ASIS content by email, you will need to create an account with us, which involves providing ASIS with at least your first name, last name and an email address. In some cases, ASIS shares this information with a third party who curates and sends the content on our behalf. We rely on a contract basis to process your personal information for purposes of fulfilling your request to receive our publications. You may at your own option choose to subscribe to ASIS News and updates. You may manage your ASIS subscriptions by subscribing or unsubscribing at any time. If you have any difficulties managing your email or other communication preferences with ASIS, please contact us at [email protected]. ASIS uses Google Analytics to track how often people gain access to or read our content. We use this information in the aggregate to understand what content our members find useful or interesting, so we can produce the most valuable content to meet your needs. Google's Privacy policy can be found here. Information on Google's use of data for its Analytics product can be found here. We also conduct surveys that we use to produce original research on the security profession. We do not track individuals but look at information in the aggregate only. Participation in surveys is voluntary. 4. Professional Development If you participate in ASIS professional development, you may sign up directly through ASIS in which case we collect your name and contact information directly from you. You may, alternatively, sign up for professional development—or be signed up for professional development—by or through a third party such as one of our partners, or your own employer. We may also use independent contractors to conduct professional development and third parties to provide the venue. Your personal information will be stored in our database (hosted by a cloud service provider) and may also be shared with our education partners, trainers, and/or the venue hosting the event (to verify your identity when you arrive). ASIS may use a third-party data hosting service to transfer the information from partners to ASIS. ASIS’s professional development partners, trainers, venue hosts, and data transfer hosts have agreed not to share your information with others and not to use your personal information other than to provide you with ASIS products and services. ASIS relies on fulfillment of a contract to process personal data associated with providing professional development services. 5. Certification When you sign up to take one of ASIS’s certification exams, we will collect your name and contact information. This information may be shared with our exam hosting service. The exam hosting service may also share with us information you provide to them to verify your identity in taking the exam. ASIS will collect your exam results and, in conjunction with maintaining your certification(s), your record of participation in continuing professional education. Only authorized employees within ASIS have access to your certification exam scores and personal information pertaining to any special accommodations you may request. ASIS relies upon a contract fulfillment basis to process personal data associated with providing certification services. 6. Your correspondence with ASIS If you correspond with us by email, the postal service, or other form of communication, we will retain such correspondence and the information contained in it and use it to respond to your inquiry; to notify you of ASIS conferences, publications, or other services; or to keep a record of your complaint, accommodation request, and the like. If you wish to have ASIS refrain from communicating with you, please contact us at [email protected]. Note: if you ask ASIS not to contact you by email at a certain email address, ASIS will retain a copy of that email address on its “master do not send” list in order to comply with your no-contact request. ASIS has a legitimate interest in maintaining personal information of those who communicate voluntarily with ASIS. 7. Purposes for processing your data As explained above, ASIS processes your data to provide you with the goods or services you have requested or purchased from us, including membership services, events, publications and other content, certification, and professional development. We use this information to refine our goods and services to better tailor them to your needs and to communicate with you about other services ASIS offers that may assist you in your career or otherwise help you do your job as a security professional. Most of the time, ASIS needs to process your personal data to fulfill an order for goods or services—including membership services, with all the attendant benefits and professional opportunities ASIS provides. Sometimes ASIS has a legitimate interest in processing data to better understand the needs, concerns, and interests of ASIS members and customers so ASIS can operate optimally as an association and as a business. And sometimes, ASIS relies upon your consent, in which case we will keep a record of it and honor your choices. 8. Payment card information You may choose to purchase goods or services from ASIS using a payment card. Typically, payment card information is provided directly by users, via the ASIS website, into the PCI/DSS-compliant payment processing service to which ASIS subscribes, and ASIS does not, itself, process or store the card information. Occasionally, members or customers ask ASIS employees to, on their behalf, enter payment card information into the PCI/DSS-compliant payment processing service to which ASIS subscribes. We strongly encourage you not to submit this information by email. When ASIS employees receive payment card information from customers or members by email, fax, phone, or mail, it is entered as instructed and then deleted or destroyed. Personal information we get from third parties From time to time, ASIS receives personal information about individuals from third parties. This may happen if your employer is a corporate member of ASIS and signs you up for professional development, certification, or membership. One of our third-party professional development partners may also share your personal information with ASIS when you sign up for professional development, certification, or membership through that professional development partner. What happens if you don’t give us your data You can enjoy many of ASIS’s services without giving us your personal data. Much of the information on our website is available even to those who are not ASIS members. To access information outside of the information on our public website, some personal information is necessary so that ASIS can supply you with the services you have purchased or requested, and to authenticate you so that we know it is you and not someone else. You may manage your ASIS subscriptions and you may opt-in or opt-out of receiving marketing communications at any time. Use of ASIS Website As is true of most other websites, ASIS’s website collects certain information autom"
year_published = 2025
