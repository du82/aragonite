["https://asisonline.org/certification/why-get-certified"]
title = "Why Get Certified?"
description = "ASIS board certification demonstrates your mastery of core security principles and skills essential to the best practices of security management."
full_description = '''Realize Your Potential Earning an ASIS board certification is a visible acknowledgment that you possess a mastery of core security principles and skills essential to the best practice of security management. It shows you are committed to excellence, professional growth, and a code of conduct. Are you ready to achieve your personal and professional best? More possibilities. More responsibilities. More trust. An ASIS International certification offers limitless opportunities to advance in your career. Whether you’re new to the field or a security management veteran, you can find a credential that aligns with your objectives and raises your profile among our global community of security professionals. Our four certifications are widely recognized symbols of excellence that establish your mastery. This expertise gives you an unmatched advantage in your threat-prevention strategies—and in the marketplace. Associate Protection Professional (APP®) The Associate Protection Professional (APP) designation provides the first "rung" on the security professional’s career ladder. It is for those with 1 or more years of compensated security experience and measures the professional’s knowledge of security fundamentals, business operations, risk management, and response management. Explore APP Professional Certified Investigator (PCI®) The Professional Certified Investigator (PCI) certification provides demonstrable proof of an individual's knowledge and experience in case management, evidence collection, and preparation of reports and testimony to substantiate findings. Requirements include 3-5 years of investigations experience, with at least two years in case management. Explore PCI Certified Protection Professional (CPP®) The Certified Protection Professional (CPP) is considered the "gold standard" for security management professionals. This certification validates your knowledge in all areas of security management. Eligibility requirements include 5-7 years of security experience and 3 years in responsible charge of a security function. Explore CPP Physical Security Professional (PSP®) The Physical Security Professional (PSP) demonstrates your knowledge in physical security assessments, application, design, and integration of physical security systems, and implementation of security measures. Eligibility requirements include 3-5 years of experience in the physical security field. Explore PSP'''
