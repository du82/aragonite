["https://asisonline.org/certification/certified-protection-professional-cpp"]
title = "Certified Protection Professional (CPP)"
description = "The Certified Protection Professional (CPP)Ⓡ is considered the “gold standard” certification for security management professionals. The CPP is a generalist exam that covers all aspects of security management."
full_description = "Exemplify Excellence Earning the Certified Protection Professional (CPP®) credential isn’t the end of your achievement—it’s only the beginning. The internationally recognized and respected “gold standard” in security management expands your career potential like nothing else. Translate your expertise into a competitive advantage today. APPLY FOR CPP Rise to the Top The CPP certification confirms the all-around expertise you’ve acquired after at least five years’ experience in the security management field and three years of responsible charge. With a CPP, you gain added credibility in your decision-making because you are fluent in security best practices. You show consummate leadership that draws on your well-rounded expertise. And you possess confidence in conversations with senior leadership, clients, and team members. No matter your role or goal, the CPP helps you fulfill your aspirations and moves you ahead in security management. Watch this video to learn more about each certification and what you need to get started – and check out our step-by-step application guide. CPP Eligibility Requirements The Certified Protection Professional certification is designed for senior-level security managers with five to seven years of related experience, with at least three years in responsible charge of a security function. Additional requirements include: Full-time employment in a security-related role Have not been convicted of any criminal offense that would reflect negatively on the security profession, ASIS, or the certification program Willingness to sign and agree to abide by the ASIS Certification Code of Conduct Willingness to agree to abide by the policies of the ASIS Certification programs as outlined in the Certification Handbook Why Earn the CPP Designation? Need a few more great reasons to start your application? Validate your security expertise Gain global recognition by your peers and the industry Get a competitive edge in the marketplace Enhance your career and earnings potential Enjoy personal satisfaction and professional achievement Start Your Application"
