["https://asisonline.org/link/5f6acc853c3f4ff9bb3cf29ee1bc5264.aspx"]
title = "Get to Know the 2025 ASIS Board Chairs"
description = "With 2025 off to a great start, we wanted to get to know some of the volunteers that will be leading ASIS this year. We sat down with the chairs of nine different boards that direct different parts of the association. Read on to hear what they had to say."
full_description = "ASIS Homepage News Blog Leadership News Get to Know the 2025 ASIS Board Chairs 12 February 2025 With 2025 off to a great start, we wanted to get to know some of the volunteers that will be leading ASIS this year. We sat down with the chairs of nine different boards that direct different parts of the association. Read on to hear what they had to say. From the Global Board: President Joe Olivarez Jr., MBA What are you most looking forward to doing with ASIS in 2025? For me, it is all about the people. I look forward to being out with our constituents around the globe – getting to know them, listening to their needs, celebrating our collective successes and hearing about how the industry is re-shaping around the world. What is a fun fact about you? Two things - My favorite sports teams are the Houston Astros (2-time world series champions) and the Houston Texans (still waiting but always supporting). Second, I spent a lot of time in the past acting and directing. I look forward to getting back to the stage or film in the near future. From the European Regional Board: Chair Andy Williams, CPP What are you most looking forward to doing with ASIS in 2025? Attending ASIS Europe Dublin, GSX New Orleans and taking time to raise a glass or two to celebrate the Platinum 70th Year ASIS International anniversary. What is a fun fact about you? I have a passion for travel. During one 15-year period of my life, I was never in the same country for more than 2 weeks! From the Latin America Caribbean Regional Board: Chair Marco Vega, CPP What are you most looking forward to doing with ASIS in 2025? This year is particularly significant for ASIS International as we celebrate the 70th anniversary of its founding. In Latin America and the Caribbean, the Board of Directors has developed a series of initiatives to commemorate this important milestone. Key activities include webinars, meetings with regional chapters, and the fourth edition of the ASIS Latin America and Caribbean Security Congress, which will take place in Mexico City this coming August. A top priority this year is the consolidation of four regional working committees, formed with the valuable support of volunteer leaders from across the region. Our commitment is to work diligently to create value for the more than 2,800 members across 30 chapters in the region. Additionally, we aim to foster the development of new regional volunteer leaders, with a special focus on strategic communities such as Next Gen and Women in Security (WIS). What is a fun fact about you? Something interesting about me is my passion for enjoying nature in my country, Costa Rica. I feel fortunate to live in a paradise, and whenever I have the chance, I love visiting national parks with my wife, hiking mountain trails, exploring volcanoes, rivers, or, of course, relaxing at the beach. These activities are, without a doubt, my favorites. If you ever want to visit Costa Rica, you’ve got a friend here! Don’t hesitate to send me a message for advice or recommendations. From the North American Regional Board: Chair Mark Folmer, CPP, PSP What are you most looking forward to doing with ASIS in 2025? I am most looking forward to listening, contributing, and leading. As Chair of the North American Regional Board, I’m proud of our progress and so excited for what’s ahead. This role, along with a seat on the Global Board, offers invaluable insights and learning from exceptional leaders. What is a fun fact about you? I’m a coffee enthusiast who starts most days grinding local beans and brewing an Americano for my wife and me. I also love riding motorcycles, especially on single-lane highways off the beaten track. Combine those two passions, and that makes for a great day! From the Asia Pacific Regional Board: Chair Danny Chan What are you most looking forward to doing with ASIS in 2025? As the chair of the newly stood up ASIS Board of Directors for Asia-Pacific, I would be most excited about several initiatives in 2025: Enhancing regional security collaboration by strengthening partnerships with local and regional security organizations and governments and facilitating forums and workshops where security professionals can share best practices and innovative solutions. Advancing professional development with tailored training programs that cater specifically to the unique security needs of the Asia Pacific region, as well as promoting ASIS certifications to enhance the skills and credibility of security professionals in the region. Expanding membership by reaching out to underrepresented areas and industries within the region and creating a strong sense of community among members through regular events, both online and in-person. Promoting inclusion within the security industry by establishing support networks for security professionals of all experience levels and backgrounds. What is a fun fact about you? I have a deep passion for French cooking. To pursue this, I attended the Culinary Institute of America and trained to become a professional chef. This experience honed my skills and deepened my appreciation for French cuisine but also allowed me to return to the security world with a fresh perspective. Now, I enjoy creating elegant and flavorful dishes for my friends in the security fraternity and beyond. From the Professional Certification Board: Chair James Cawood, CPP, PCI, PSP What are you most looking forward to doing with ASIS in 2025? This year will be busy for the PCB, and I am looking forward to continuing our work regarding making all our exams more accessible and our processes more transparent. A priority is escalating our efforts to educate industry members on the importance of certification for every member, regardless of the time they have spent in the industry. Continued education and objective proof of professional knowledge enhance the credibility of the individual, as well as the industry, in the eyes of our important stakeholders and the communities we serve. What is a fun fact about you? I have always loved music and am now on the journey to learn the alto saxophone, starting with no history of playing instruments since the recorder in the 4th grade. Every journey starts with the first step. From the Professional Standards Board: Chair David Feeney, CPP, PSP What are you most looking forward to doing with ASIS in 2025? The Standards Board has been working hard on ideas to update the way the Board operates and delivers value to ASIS International and its members. In 2025, I’m looking forward to seeing the Board’s ideas begin to be socialized and implemented. What is a fun fact about you? I’ve always loved coaching my son’s athletic teams. This was easier when he was 6 and only played basketball. Now that he’s 10, he’s in travel leagues for football, basketball, and lacrosse and rec-league flag football. So, it’s become like a second job - but I do love it. From the CSO Center Board: Chair Mark Landry, CPP What are you most looking forward to doing with ASIS in 2025? I always cherish the networking and professional development opportunities that come with GSX and Secure Horizons, the CSO Center has become some of my most trusted peers within the industry. They have contributed to my growth immensely. I consider the CSO Center to be my security family, so seeing them every year is something I really look forward to. What is a fun fact about you? I am passionate about road cycling and Peloton. I have traversed across the entire state of Iowa four times on my road bike, and I have completed numerous century rides (100+ mile rides), including one last year in Memphis. From the Foundation Board of Trustees: Chair Martin Gill What are you most looking forward to doing with ASIS in 2025? The ASIS Foundation is publishing a new report on Operational Resilience and new scholarships are planned. This summer we have the Foundation Fitness Challenge, getting fit and raising funds at the same time. I love ASIS Europe and GSX and this year I am planning to attend regional events in Singapore and India too. What is a fun fact about you? Last year I started singing lessons and made my debut on stage, more brave than competent. I will be helping my first grandchild (Alfie Martin, named after me!) to be a footballer, and my second grandchild is due in the spring, and I am sure he wants to be a footballer too! I hope to be a less useless golfer."
year_published = 2025
