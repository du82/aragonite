["https://asisonline.org/certification/apply-for-certification"]
title = "Apply for Certification"
description = "Ready to earn your security management designation? Review what you’ll need to have on hand as you begin your ASIS certification journey."
full_description = '''Take the First Step Ready to earn your internationally-recognized security management designation? Review what you’ll need to have on hand as you begin your ASIS certification journey–you’re just a few screens away from a successful online application. Want to talk to a certification specialist? Email us at [email protected]. What You Need to Apply Before you start your application, review the eligibility requirements for the certification you plan to pursue. You can learn more about the four ASIS board certification options below. As you begin your application, you’ll need: Your resume and or CV that includes your relevant work experience. Make sure to align your experience with your chosen certification’s domains. An unofficial copy of your university transcript (if applicable). Names and contact information for three references who can verify your work experience. The name of a supervisor who can verify your employment. Payment for the application and exam fees. Not sure where to start? Download our Self-Assessment Guide to better understand which certification is the best fit for you. Associate Protection Professional (APPⓇ) The Associate Protection Professional (APP) designation provides the first "rung" on the security professional’s career ladder. It is for those with 1 or more years of compensated security experience and measures the professional’s knowledge of security fundamentals, business operations, risk management, and response management. EXAM FEES ASIS Members: $300 Emerging Market 1: $270 Emerging Market 2: $260 Nonmembers: $620 Emerging Market 1: $510 Emerging Market 2: $490 RETAKE FEES ASIS Members & Nonmembers: $250 Emerging Market 1: $240 Emerging Market 2: $220 Explore APP Professional Certified Investigator (PCIⓇ) The Professional Certified Investigator (PCI) certification provides demonstrable proof of an individual's knowledge and experience in case management, evidence collection, and preparation of reports and testimony to substantiate findings. Requirements include 3-5 years of investigations experience, with at least two years in case management. EXAM FEES ASIS Members: $580 Emerging Market 1: $480 Emerging Market 2: $460 Nonmembers: $910 Emerging Market 1: $720 Emerging Market 2: $680 RETAKE FEES ASIS Members & Nonmembers: $480 Emerging Market 1: $360 Emerging Market 2: $330 Explore PCI'''
