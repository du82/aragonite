["https://ask.clojure.org/index.php/10735/prepl-warnings-remain-buffered-until-explicit-flushing-client"]
title = "prepl warnings remain buffered until explicit flushing from the client - Clojure Q&A"
description = "In a prepl session, Clojure warnings remain buffered and won't be sent to the client without flushing ... to flush the error stream on a timely basis?"
full_description = "In a prepl session, Clojure warnings remain buffered and won't be sent to the client without flushing explicitly from the client side. Here is an example prepl session using netcat (the lines starting with ;; indicate responses from the prepl server): This seems to be caused by the fact that prepl's *err* PrintWriter is not autoFlush-enabled and that most of the Clojure warnings are not flushed explicitly. Is this an issue to be addressed? Or is it an intended behavior and it's the client's responsibility to flush the error stream on a timely basis? However, in the case of io-prepl which is a prepl client maintained in the same ns, the io-prepl or its clients cannot force flushes so the error messages are lost. I have assumed that execution is complete once a :ret tag is received. I'm not sure how else a prepl client program is meant to understand the completion of the execution. The code suggests that it is intended to be the last message but I understand that it's subject to change. In any case, some signal of completion is required if it isn't that one. This is a simple fix and ensures that all prepl clients receive errors in a timely fashion and in correct order (ie before :ret). Without this fix in core, I have had to fork the prepl and io-prepl as there is no other obvious way around this from external code. For the sake of completion, another possibility floated by Slack user @flowthing was to add an option to PrintWriter-on, or another PrintWriter wrapper, to make the underlying Writer auto-flush. Clients must pass an outfn to the prepl and the function passed by io-prepl binds *flush-on-newline* to true which is respected by prn - called on every value. A similar mechanism to prn for *err* that observed *flush-on-newline* could also provide the parts needed for a solution."
author = "Shogo Ohta"
year_published = 2024
clearnet = "https://ask.clojure.org/index.php/10735/prepl-warnings-remain-buffered-until-explicit-flushing-client"
