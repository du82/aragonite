title = "Are there plans for official docs (rationale and guide) on datafy / nav? - Clojure Q&A"
description = "If Clojure is to become (even) more data oriented, these are powerful tools to  ... : https://gist.github.com/sashton/56a14d275c71d7ce3e224c11c9a16bd4"
full_description = "If Clojure is to become (even) more data oriented, these are powerful tools to achieve that goal. The community needs support to encourage adoption. The current state of documentation for datafy and nav is not sufficient IMHO to encourage independent learning on a broad scale. There is no canonical source of such documentation in the community despite some valiant efforts (eg @SeanCorfield who has a great blog post and is an active proponent). Examples are difficult to find around the internet ... here's a good one from a Slack recommendation by @Frederick on there. We know that there are problems with Slack since we cannot easily search history so keeping it here might help people find it in the meantime. It would be good to have a rationale explaining the problem it is solving, the general approach and some specifics on the design. Likewise a guide on how it should be used with a worked example and some hints and tips on how to approach implementations."
