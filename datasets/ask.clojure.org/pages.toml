["https://ask.clojure.org/index.php/14325/create-a-vector-with-a-non-get-ifn"]
title = "Create a vector with a non-`get` IFn - Clojure Q&A"
description = "**Goal:** Create a new flavor of vector that is identical to the built-in vector, except when  ... , `extends`, etc. I greatly appreciate any help."
full_description = '''Goal: Create a new flavor of vector that is identical to the built-in vector, except when invoked, uses a different function (a variadic function defined by me, but concat is a good stand-in for demonstration purposes) instead of get. No matter what we create to accomplish this task, the standard vector should behave exactly as before. The new flavor of vector would behave ever-so-slightly differently. First, some example definitions using a new function, foo-vector. The only difference would appear when a "foo-vector" is invoked: Instead of an implied get, it's an implied concat (or some other variadic function, but concat works well for discussion). In all respects, "foo-vectors" B, C, and D are vectors, with the exception that when appearing as the first element of a list (i.e., in the function position), an alternative function is called (in our example, concat) instead of get. I do not know where to begin researching this problem other than regurgitating terms like IFn, deftype, extends, etc. I greatly appreciate any help. I'll preface this by saying that you probably should not do this - changing the semantics of data structures like this is confusing to users of your code/data. The best solution is probably to just make a function that does what you want. That said, Clojure's core APIs generally do not rely on concrete types but rather core interfaces and you can use deftype to create your own implementation that implements those interfaces (presuming you want to do this in Clojure). This is an oldie but a goldie helper function for this (https://gist.github.com/semperos/3835392), which you can use to get the scaffolding. Vectors are most importantly implementations of clojure.lang.IPersistentVector: If you create a deftype with that impl, wrapping a concrete vector and deferring all of those methods to the internal vector, then you have effectively created a custom vector wrapper with your own type. Missing from the scaffold above is the thing that actually makes concrete vectors a function, namely, clojure.lang.IFn:'''
author = "Brad Losavio"
year_published = 2025
