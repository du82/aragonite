["https://ask.clojure.org/index.php/12012/auto-gensym-in-recursive-macros"]
title = "Auto-gensym in recursive macros - Clojure Q&A"
description = "I think auto-gensym (using `#` syntax) can shadow itself when used recursively, which seems like a bug. ... x11096 2] (conj (conj [] x11095) x11096)))"
full_description = '''I think auto-gensym (using # syntax) can shadow itself when used recursively, which seems like a bug. jumar confirmed this happens in 1.10.3, 1.6.0, 1.3.0, and 1.0.0 I would expect recursive-macro-1 to produce the same results as recursive-macro-2 but you can see, from running clojure.walk/macroexpand-all on these forms, that the shadowing prevents this: in order for auto gensym to gensym at macroexpand time, the syntax quote reader could be altered to produce a let binding. currently: user=> (read-string "`(x#)") (clojure.core/seq (clojure.core/concat (clojure.core/list (quote x__9__auto__)))) user=> would become: user=> (read-string "`(x#)") (clojure.core/let [foo (gensym 'x)] (clojure.core/seq (clojure.core/concat (clojure.core/list foo))) user=> a consequence of that change would be a macro like clojure.core/and (picking a commonly used macro that uses gensyms at random) would gensym new symbols everytime it was expanded instead of once when the implementation is read. That might be fine? gensyming should be fast, the new symbols are used when compiling then forgotten about, the counter for gensym names can count really high.'''
author = "Tom Dalziel"
year_published = 2022
clearnet = "https://ask.clojure.org/index.php/12012/auto-gensym-in-recursive-macros"
