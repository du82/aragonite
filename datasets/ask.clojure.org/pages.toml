["https://ask.clojure.org/index.php/10692/clojure-cli-report-incompatible-with-x"]
title = "Clojure CLI: --report incompatible with -X ? - Clojure Q&A"
description = "**Background:** 1. My build runs in a container where I have no access to temporary files ( ...  perhaps? [1]: https://github.com/seancorfield/depstar"
full_description = '''When a clojure command line includes the -X option, it doesn't appear that there's any way to also include --report stderr option. Here's some sample output: So the question is: how can I ensure any uncaught exceptions thrown out of a -X function (in this case Depstar, but it could be anything) are written to stdout or stderr, rather than a temporary file that I can't access? Does -X bypass that (irritating) default behaviour of writing exception details to a temporary file, perhaps? The --report option is a feature of clojure.main (not the clojure CLI). (And just FYI, there is an equivalent Java system property way to do this with clojure.main - see https://clojure.org/reference/repl_and_main#_as_launcher) Using clj -X, you are not using clojure.main, so this option does not exist, but also -X should never do the thing that writes to a temp file, so I'm confused why you would need it at all with -X? depstar shells out to run the AOT compilation process and that does use clojure.main but there isn't an easy way to pass --report to that subprocess. You can, however, pass :jvm-opts to depstar which will in turn pass them to that subprocess: Using -X does execute clojure.main but only for the CLI API stub which then invokes one or more "exec functions". You can't pass --report to it, but you can use the JVM option:'''
