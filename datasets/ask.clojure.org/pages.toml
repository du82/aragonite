title = "Partial parses and complete source info (i.e. info on atoms without metadata) - Clojure Q&A"
description = "It would be very nice to support partial parsing and to provide an AST or some way of ... these abilities baked into this already very capable reader."
full_description = "It would be very nice to support partial parsing and to provide an AST or some way of getting complete source info for each of the atoms in the parsed result. It seems that there are many examples of projects having to write their own ad-hoc parsers for Clojure to meet these needs. It would benefit tool authors to have these abilities baked into this already very capable reader. Hi Bruce, this seems like it's 2 separate feature requests: - supporting parsing to AST rather than directly reading - supporting partial parsing I'm not opposed to either (in fact 1 gets requested quite often), but they're pretty big and I don't know if/when I'll have the time to work on them. It's more likely that I'll have time to work on the first one (which I'm personally more interested in) than the second one, but no promises made."
