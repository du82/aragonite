description = "context: I have parsed some extensive XML data from the internet. Now I want to explore/filter/drill  ... for example. But yeah, this is not great.)"
full_description = '''context: I have parsed some extensive XML data from the internet. Now I want to explore/filter/drill down in the REPL. I have a LazySeq named xs of unknown length and of unknown content. I would like to explore the first few elements of xs at the REPL. For convenience, I would like to def some Vars like so: This is tedious to type, especially when it needs to be done repeatedly, as I develop my "drill down"-function. Is there a convenience function (or macro) that can do this for me, perhaps like this I tried to write a function for this. It uses eval and is unsecure (and has other drawbacks as well). So, my questions are: (if (nth xs i nil) is a LazySeq or a list then eval will try to interpret it as a function call. This can be tested for and converted to a vector, for example. But yeah, this is not great.) You don't need eval for this (which also isn't insecure in your context since you control all that's actually being evaled): But, instead of doing things like this, I would strongly suggest tap>ing that data and using tools like Portal, Reveal, REBL. Incomparably more convenient than browsing complex nested data in a plain text REPL.'''
