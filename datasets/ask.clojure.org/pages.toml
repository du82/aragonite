["https://ask.clojure.org/index.php/13960/inconsistencies-clojures-functional-interface-conversion"]
title = "Inconsistencies between Clojure's new functional interface conversion and Java's - Clojure Q&A"
description = "While implementing Cursive's support for the new functional interface conversion, I found some  ...  useful use case for not enforcing this."
full_description = '''While implementing Cursive's support for the new functional interface conversion, I found some inconsistencies between how Java sees these and how Clojure does. I wanted to check whether these were deliberate or not. Regarding (1): https://ask.clojure.org/index.php/13908/expand-fi-adapting-to-sam-types-not-marked-as-fi 1) Our goal here was to find places where Clojure functions have a semantic match to Java constructs and make their use in that place implicit. Functional interfaces marked as such must have a single method and have clearly stated that intent. SAM interfaces, while structurally similar, do not have that stated intent and may not be a semantic match to Clojure functions (instead being "procedures" or some non-functional idea). That said, the combination of SAMs and method values is an interesting convergence point that we are still working on. If you are passing a method value to a method taking a SAM, that is a point where we can directly adapt (as Java does with method references) without creating a method value wrapper and adapting that. That is a use where there is no Clojure function and no need for a semantic match and we may support that, still TBD. 2) maybeFIMethod checks that the class has the @FunctionalInterface annotation, which can only exist on interfaces, and thus it is redundant to check if it is an interface.'''
author = "Colin Fleming 1"
year_published = 2024
clearnet = "https://ask.clojure.org/index.php/13960/inconsistencies-clojures-functional-interface-conversion"
