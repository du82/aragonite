["https://ask.clojure.org/index.php/14434/qualified-versus-simple-classnames-using-compiled-classes"]
title = "qualified versus simple classnames when using `gen-class` compiled classes - Clojure Q&A"
description = "Using the qualified name of a subclass compiled by `gen-class` to access the  ... /classes/ com.example.TestExtendSomeClass aStaticMethod received 123"
full_description = "Using the qualified name of a subclass compiled by gen-class to access the superclass' members throws an exception. Using the simple name proceeds as expected. Here's an example that I've tried to cut down as much as possible, but it's still lengthy. All files are relative to the project root directory, indicated as <project root>. Define a class in file <project root>/src/com/example/SomeClass.java with two members, a static field and a static method. Define a subclass in file <project root>/src/com/example/SomeSubClass.java that extends the previous class. All fine and good: Clojure can resolve the superclass members aField and aStaticMethod by using the qualified name com.example.SomeSubClass. Now, in file <project root>/src/com/example/ExtendSomeClass.clj, define another subclass --- ExtendSomeClass --- this time using Clojure's gen-class. ExtendSomeClass.class ExtendSomeClass.class$fn__NNNN.class ExtendSomeClass.class$loading__NNNN__auto__NNNN.class ExtendSomeClass__init.class I would expect the behavior of the gen-class-compiled ExtendSomeClass to be substantially the same as the javac-compiled SomeSubClass. However, I obtain an exception when I attempt to access the static members inherited from the superclass with the qualified classname. Q: How can I understand the difference in the behavior of a gen-class-compiled subclass and the javac-compiled subclass. Should I double-check how the classpaths align to the directory structure?"
author = "Brad Losavio"
year_published = 2025
