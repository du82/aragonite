["https://ask.clojure.org/index.php/12700/feature-request-clojure-command-create-minimal-deps-project"]
title = "Feature request for Clojure CLI: Command to create minimal deps project - Clojure Q&A"
description = "This is for onboarding newcomers, including those for whom installing additional tools is nontrivial. ... onboarding of some communities of new users."
full_description = 'This is for onboarding newcomers, including those for whom installing additional tools is nontrivial. From my perspective as a teacher it would be really sweet if an absolutely minimal project could be created with the CLI tools alone. "It must be done by hand or use a 3rd party tool" is an impediment to some of my students, and presumably to other newcomers. In a class setting, with students using different machines and OSes and having different backgrounds, a variety of issues that will seem trivial to developers (such as OSes that add hidden file extensions, editors that encode text, OS path issues, etc.) can produce a lot of discouraging friction. By "absolutely minimal project" I mean a directory containing a deps.edn that contains {}, and also containing a src folder that contains a single subfolder with the same name as the top-level folder, that in turn contains a single file (might as well be called core.clj) that just contains a minimal ns expression, with a namespace name matching the folder and file names, and nothing else. I understand that there would be a lot to think about regarding the more general question of whether the CLI tools should support more robust project creation facilities, and if so then what kinds of projects it should create, how this would be organized, etc. But my request here is for something so minimal that I hope it could be considered independently of questions concerning more general facilities. I also hope that this minimal-project-creation feature can be considered independently of the more general issues because I think it would significantly ease the onboarding of some communities of new users.'
