["https://ask.clojure.org/index.php/4850/repl-input-broken"]
title = "REPL input broken - Clojure Q&A"
description = '''REPL doesn't handle backspace character correctly, even backing up over the "user=>" prompt, yet  ... is what happens when I type "**clojure "'''
full_description = '''REPL doesn't handle backspace character correctly, even backing up over the "user=>" prompt, yet apparently not being captured at all during evaluation. Also, this is what happens when I type "clojure " <----space, instead of "clojure-" <----dash, while trying to evaluate "clojure-version": $ mono Clojure.Main.exe Clojure 1.5.0 user=> clojure CompilerException System.InvalidOperationException: Unable to resolve symbol: clojure in this context at clojure.lang.Compiler.ResolveIn (clojure.lang.Namespace n, clojure.lang.Symbol symbol, Boolean allowPrivate) (link: 0x00000) in :0 at clojure.lang.Compiler.Resolve (clojure.lang.Symbol symbol) (link: 0x00000) in :0 at clojure.lang.Compiler.AnalyzeSymbol (clojure.lang.Symbol symbol) (link: 0x00000) in :0 at clojure.lang.Compiler.Analyze (clojure.lang.CljCompiler.Ast.ParserContext pcontext, System.Object form, System.String name) (link: 0x00000) in :0 , compiling: (NO_SOURCE_PATH:0:0) Markup mangled my bug report obviously, whoops. I meant that I hit space after asterisk clojure instead of a dash. This has been a problem on Mono from the beginning. I've asked several people about it, but I don't have a solution. I'll put a query up on the mailing list and see if anyone has a suggestion. For what it's worth, a C1. REPL comes bundled with Mono which works well. The REPL code is a 900-line program which uses a 1000-line getline library. The latter has no dependencies outside of the System namespace, which is good, but I have no clue as to how it'd work with MS .NET. Anyway, I've attached it for your consideration (path in Ubuntu "mono" package source is mcs/tools/csharp/getline.cs).'''
