["https://ask.clojure.org/index.php/13839/why-does-running-an-uberjar-reload-namespaces"]
title = "Why does running an uberjar reload namespaces? - Clojure Q&A"
description = '''Consider this basic project: (ns whatever.core (:gen-class)) (def some-var (doto (System/getenv " ... 's driving me crazy! Many thanks in advance...'''
full_description = "If I make an uberjar out of this, I can see that during compilation, nil is printed (as expected). However, when I run it with environment variables, I expect nil, but I can see that the correct value is printed and some-var is actually re-bound! Even though that sounds kind of 'convenient' (for this use-case), I fail to understand why it happens...Since I AOT'ed the namespace, I would expect to have to defer getting the env-var until runtime (e.g. via delay or something), for this work. Also what are the implications of this double loading? What if I had some very expensive computation in a def, and really wanted to pre-compute it once (and only once)? From what I can tell all def expressions (reachable from -main) are loaded anew when the program starts, regardless of AOT... Help me understand this please, as it's driving me crazy! There's no double loading or reloading. Code compilation in Clojure actually runs that code (meaning, it runs all the top-level forms, it won't actually run your -main function unless it's called at the top level). And running the code in an uberjar, well, also runs the code. It's a completely separate step, separate loading. The main one is that a namespace declaration should be free of side-effects and referentially transparent (barring implicitly changing the current namespace by all the defs). What if I had some very expensive computation in a def, and really wanted to pre-compute it once (and only once)? If you don't want for the expensive computation to be run at compile time, you can use delay. If you want to inline the results of a computation during compilation, you can use a macro."
author = "Dimitrios Piliouras"
year_published = 2024
clearnet = "https://ask.clojure.org/index.php/13839/why-does-running-an-uberjar-reload-namespaces"
