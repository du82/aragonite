full_description = '''I basically just want to launch clj in an inferior mode and then pipe in the code from the code blocks. I'm trying to leverage add-lib so I can dynamically add libraries in literate blocks (and eshew the whole deps.edn project structure). However I've hit a weird issue (hash is from the official Clojure blog post here ) I can then copy paste the test code in and I get the desired result - it prints: [:circle {:cx "0.00", :cy "1.00", :r 6}] I don't really know enough JVM to understand this error. It looks to me that it's trying to compile the file - and this doesn't play nice with add-lib. Is there some way I can have clj evaluate without compiling? FYI, that version of add-lib is quite old now and is unlikely to work well with the current clojure CLI. You can probably crib the latest from https://github.com/seancorfield/dot-clojure/blob/develop/deps.edn#L202-L228 The way this stuff works is to climb up the classloader structure to find a DynamicClassLoader, then use the facilities there to add new jars to the classloader. For that to work, you actually have to have a DynamicClassLoader available to you, which is not necessarily the case in every way you can load and run Clojure code. You can see in that link above a trick Sean is playing to install one - you can do similar in your own code if you like.'''
