["https://ask.clojure.org/index.php/13123/functions-which-inside-evaluate-arguments-before-executing"]
title = "Why functions which are used inside macro do not evaluate their arguments before executing? - Clojure Q&A"
description = "(defmacro test [expr] (letfn [(helper [expr] (println expr) (rest expr))] (func expr) (helper  ... -called-by-macro), but it was not good enough."
full_description = '''It is very counterintuitive as both the internal defined function (helper) and external (func) behave similarly by not evaluating (+ 1 2). There was an answer to this on stackoverflow.com (https://stackoverflow.com/questions/54394977/evaluation-of-arguments-in-function-called-by-macro), but it was not good enough. The evaluation happens prior to invocation (so it's not "the function" that is doing the evaluation but the call site invoking it). Here, the argument to func and helper is the symbol expr. Symbols are evaluated by resolving that "name" to a value in the current lexical context, here defined in the defmacro parameters. It resolves to a list (+ 1 2). That list is passed to the function. Evaluating that list would require evaluating the argument twice!'''
author = "GorMartirosian"
year_published = 2023
