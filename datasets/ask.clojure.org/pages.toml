["https://ask.clojure.org/index.php/14283/confusing-error-message-on-deps-edn-wrong-git-url-dependency"]
title = "Confusing error message on deps.edn wrong git/url dependency - Clojure Q&A"
description = "When you misspell the `:git/url` of a git dependency (or the dep name used to infer a url)  ...  followed by the url instead of the local folder also?"
full_description = '''When you misspell the :git/url of a git dependency (or the dep name used to infer a url) the error says : I find the the 3 sentences confusing since they mention classpath, a local folder, username, and terminal prompts disabled. It would be great if it more clearly can express that no repo could be found with the provided URL, or at least remove the last sentence fatal: could not read Username for 'https://github.com': terminal prompts disabled which I find misleading. Error building classpath. Unable to clone /home/user/.gitlibs/_repos/https/github.com/MISSPELLED-ORG-OR-REPO-PATH fatal: could not read Username for 'https://github.com': terminal prompts disabled This is actually an error turducken combining info from three places: 1. "Error building classpath" is from the Clojure CLI catching an unexpected error floating out of classpath construction - it doesn't know what happened, just something bad, so very generic. 2. The "Unable to clone " part is from tools.gitlibs when it gets an error from shelling out to git,and I agree that it would make more sense to list at least the git url or maybe both url and path there (can be errors with read/write perms on the path too). I will update that for next release. 3. The "fatal: ..." is from git itself basically saying that it tried to authenticate a repository url (https so http auth) but terminal prompts are disabled so it could not do that. I think you will get better errors if you are authenticated about invalid repo at that point. I am curious what you see for echo $GIT_TERMINAL_PROMPT before the CLI call - is this set to 0 in your environment for some reason? Similarly, if you can authenticate to github before running the CLI command, you should be seeing either success or a better error.'''
author = "Juan Monetta"
year_published = 2024
clearnet = "https://ask.clojure.org/index.php/14283/confusing-error-message-on-deps-edn-wrong-git-url-dependency"
