["https://ask.clojure.org/index.php/13760/create-short-lived-remote-prepl-such-that-gracefully-shutdown"]
title = "How to create a short-lived remote-prepl such that it can be gracefully shutdown? - Clojure Q&A"
description = 'TLDR: How can I start a "one time use" remote-prepl connection that ... /f06ef8ad0b3d3ca5cbea64f55e416de1065a65e0/src/clj/clojure/core/server.clj#L341'
full_description = '''TLDR: How can I start a "one time use" remote-prepl connection that runs a single command, gets the return value, and then releases all resources used? I asked this in slack but didn't receive a response. It's probably not usually a big deal in practice but it's been bothering me, so I figured I would more formally log it here. I was under the impression that short lived remote-prepl clients is an intended usage. That it should enable one to connect to the remote, eval something, get the return value and disconnect. Some example code I found to this effect is here: https://github.com/Olical/how-to-be-a-repl-sorcerer/blob/b6bd530f3d0c6b165248d980d7ce6cd28e8da51f/src/sorcery/main.clj#L20 I've found no way to get "DONE" to print, signifying the stopping of the prepl thread loop, with any combination of closing the streams used. Looking at the remote-prepl source code a bit, it seems like this line here will call close on the reader, but it will be called when the reader is already closed. But at least in the example above, I've found that this causes things to hang forever when close is called the second time. I'm guessing this is related to the issue described here: https://stackoverflow.com/a/45703662, related to the PipedReader/Writer setup. Seems like this may be same issue as https://ask.clojure.org/index.php/10735/prepl-warnings-remain-buffered-until-explicit-flushing-client ?'''
