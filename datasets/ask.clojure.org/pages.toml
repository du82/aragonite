["https://ask.clojure.org/index.php/13756/cljs-core-test-does-not-work-as-the-docstring-describes"]
title = "cljs.core/test does not work as the docstring describes - Clojure Q&A"
description = "`cljs.core/test` does not work according to its docstring description. The definition of cljs.core/ ...  is simply unused and redundant at this point?"
full_description = '''It's intended use, as far as I understand it, is as such (example copied from the documented Clojure version of the same function at ClojureDocs, https://clojuredocs.org/clojure.core/test#example-542692cac026201cdc326b8a ): So, cljs.core/test enables functions to self-document their capabilities via tests made available in metadata under the :test key. The interesting thing is that, given that I evalated the above in a CLJS REPL, the metadata is available, as far as I can tell: I spoke to @theller and @hiredman about this on the Clojurians Slack, and they speculated that cljs.core/test has been repurposed to execute the body of deftests, since the two pieces seem to fit together. Observe: The deftest body is executed and the keyword :ok is returned (regardless of the is result), as can also be gathered from reading definition of cljs.core/test. A) If it ever were the intent that cljs.core/test should enable testing :test assertions for defns, that no longer holds. B) The docstring of cljs.core/test is somewhat misleading. The first bit of the docstring, "test [v] finds fn at key :test in var metadata and calls it", may be technically correct, but mentions no connection with deftest, and therefore somewhat unhelpful. The second bit of the docstring, ", presuming failure will throw exception", is certainly not correct when used for deftest - the cljs.test/is macro, which I think is fair to say that most deftests use, catches exceptions and reports instead. I think the original intent is that the execption is thrown, so :ok is not returned, but in this context, that construct fails. The docstring seems to be a carbon copy of the Clojure version, so possibly, it warrants an update. Or maybe cljs.core/test is simply unused and redundant at this point?'''
author = "Søren Knudsen"
year_published = 2024
clearnet = "https://ask.clojure.org/index.php/13756/cljs-core-test-does-not-work-as-the-docstring-describes"
