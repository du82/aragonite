["https://ask.clojure.org/index.php/12869/clojure-cli-has-specify-namespace-repl-like-leiningen-init"]
title = "Clojure CLI has a way to specify namespace to REPL like Leiningen :init-ns? - Clojure Q&A"
description = "After installing https://github.com/seancorfield/deps-new I created a project with the command ...  to begin my contributions to Clojure community."
full_description = "After installing https://github.com/seancorfield/deps-new I created a project with the command clojure -Tnew app :name clojure-backend and followed pedestal component guide http://pedestal.io/guides/pedestal-with-component. The repo is in: https://github.com/cloped/clojure-backend I'm trying to achieve the same thing as I used to do on Leiningen project, start my REPL on Cursive on the namespace where the component start function is declared and call it. Reading the nREPL doc https://nrepl.org/nrepl/usage/server.html there is a :init-ns on Leiningen, that makes this work. After some several discussions on Clojure slack thread https://clojurians.slack.com/archives/C0744GXCJ/p1681750400843819, and many attempts to load a desired namespace on Cursive REPL and Clojure CLI we understood that this may be some functionally that could go to Clojure CLI Colin helped me to find where this is implemented on Leiningen: https://github.com/technomancy/leiningen/blob/24fb93936133bd7fc30c393c127e9e69bb5f2392/src/leiningen/repl.clj#L175-L195 I'm wondering if this is something that makes sense to Clojure CLI. And if it is I am excited to help implement this to begin my contributions to Clojure community. Defining a custom user namespace has been a long standing approach to managing component lifecycle (start, stop, restart) during development that is not editor, tool or component library dependant, i.e. it works with everything. Create a dev/user.clj file in the project that defines a user namespace. Code in this namespace is loaded during REPL startup, unless it is in comment forms. The repl starts in the user namespace, so functions defined in dev/user.clj are immediately available without having to switch to a different namespace or use fully qualified names. Defining functions that manage components in the custom dev/user.clj user namespace makes them immediately available in the default namespace used by the REPL. The added benefit of this approach is cleaner code and a clear separation between development support code and production code."
author = "Eduardo Lopes"
year_published = 2023
