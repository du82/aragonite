["https://ask.clojure.org/index.php/13810/compilation-referencing-class-failing-static-initializer"]
title = "Why does compilation of fn fail when referencing a class with a failing static field initializer? - Clojure Q&A"
description = "Given a Clojure function which references a class, if that class has a static field with an  ...  https://github.com/clj-commons/aleph/issues/703"
full_description = "Given a Clojure function which references a class, if that class has a static field with an initializer which fails when run, the function will fail to compile because the compiler (needlessly) runs the initializer even if the respective field is not accessed. Notably, this does not happen when storing the class in a var and then referencing it through that instead (see workaround below). Could the compiler support the direct reference here? (The following code is also available at https://github.com/bevuta/clojure-fn-compilation-issue-repro) Here, the bar function references the io.netty.handler.codec.compression.BrotliOptions class. That class has a package-private static field named DEFAULT with an initializer. That initializer depends on a class which is provided by an optional third-party library. However, even though bar never references that field, the initializer gets run and fails because that library is not present. The issue can be worked around by putting the class value into a separate def and using that in the function instead: Almost certainly the compiler is emitting a Class.forName() somewhere instead of the variation of that with initialize=false, causing the static initializer to run before its needed."
author = "Moritz Heidkamp"
year_published = 2024
clearnet = "https://ask.clojure.org/index.php/13810/compilation-referencing-class-failing-static-initializer"
