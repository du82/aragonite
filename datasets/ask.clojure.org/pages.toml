["https://ask.clojure.org/index.php/13297/update-vals-documentation-string-has-a-typo"]
title = "update-vals documentation string has a typo - Clojure Q&A"
description = '(doc update-vals) ------------------------- clojure.core/update-vals ([m f]) m f => {k  ...  values of m. Says "...returns a new map where the >>>keys'
full_description = 'Says "...returns a new map where the >>>keys<<< of m are mapped to...". This should be "values," not "keys." Probably a cut/paste holdover from the update-keys doc string. The doc string is correct. In a map, the keys are mapped to their values. update-vals returns a new map where the keys are mapped to the new values. "Mapped" in those cases means "linked to" and not "being passed to some function". I think the docstring is correct as written. f is applied to the values of m (as it says). The map returned is a map from the original keys to the new values.'
author = "Dave Roberts"
year_published = 2023
