title = "`doseq` and `for` expands body twice - Clojure Q&A"
description = "The bodies of `doseq` and `for` seem to be duplicated in their  ... ://github.com/clojure/clojure/commit/1abb7a56de1678321054af7fce183184f06974dd"
full_description = "I found the same problem in ClojureScript. I could not find an existing discussion about this so I'm not sure if this is by design, apologies if so. I'm aware that these macros have a large code footprint and that doseq cannot use closures (the usual way to prevent exponential expansion), but I missed this detail. This might be especially relevant to core.async, where placing go under doseq is idiomatic, since go is expensive in both expansion time and code size. It also leads to duplicated reflection warnings from the fully expanded forms, which is how I found this problem. I believe the exponential expansion for doseq was introduced in Clojure 1.1.0 with support for chunked seqs with this commit. At first I wasn't sure if this was hopeless, but I think doseq is fixable fusing the chunked and non-chunked cases like so:"
