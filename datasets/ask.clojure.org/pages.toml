["https://ask.clojure.org/index.php/11449/macroexpanding-macro-with-crashes-with-did-not-conform-spec"]
title = 'Macroexpanding a macro with `fn` crashes with "fn did not conform to spec" - Clojure Q&A'
description = "The following code crashes: (defmacro m [] `(fn [x])) (macroexpand '(m)) The error is: > Call to  ...  piece of code? Why does it run `fn` at all?"
full_description = '''How does the first snippet crash when the macro should just be returning a quoted piece of code? Why does it run fn at all? Not sure what version of Clojure or editor you're using but Clojure 1.10.3 gives more useful output in the standard repl: As you can see it is not running your code but (recursively) macroexpanding when the problem is encountered. The first expansion will become: clojure.core/fn is itself a macro that is expanded. During that expansion, the fn macro is checked against the fn spec (this is on by default for macros). The spec finds user/x and sees it as "extra input" in the :params because it does not conform to any expected parameter form (unqualified symbols usually, but also all recursive destructuring forms). Really, the problem here is user/x instead of x.'''
author = "Hassan El-Mehalawi"
year_published = 2022
clearnet = "https://ask.clojure.org/index.php/11449/macroexpanding-macro-with-crashes-with-did-not-conform-spec"
