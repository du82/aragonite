["https://ask.clojure.org/index.php/12369/clojure-stacktrace-print-throwable-fails-data-unprintable"]
title = "clojure.stacktrace/print-throwable fails if ex-data is unprintable - Clojure Q&A"
description = "If an exception is thrown that contains unprintable `ex-data`, calling `print-stack-trace ...  compromise here to allow for easier debugging."
full_description = 'If an exception is thrown that contains unprintable ex-data, calling print-stack-trace will fail because print-throwable will throw an exception, making it very hard to debug certain failures. Unprintable ex-data could include a third-party record type that implements multiple interfaces that conflict for print-method but did not anticipate making the record printable. Wrapping that (pr info) in (try .. (catch Throwable t and printing something like (str "<unprintable ex-data: " (ex-message t)">)" might be a reasonable compromise here to allow for easier debugging.'
