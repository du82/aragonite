title = "core.async mult test is passing accidentally - Clojure Q&A"
description = "Think I've found a bug in core.async tests, the following test for mult working seems purely coincidental: ;; ASYNC- ... t-3) (close! t-3) (is (= 1 ("
full_description = "Think I’ve found a bug in core.async tests, the following test for mult working seems purely coincidental: The docstring of core.async/mult states that: Items received when there are no taps get dropped. Following this statement, the 3 items put by to-chan! should be dropped, as when the mult is created, it would start consuming them without taps yet on the mult.My suspicion is that it passes because the go’s created inside mult and to-chan! might be slow enough to create so that the taps get executed before the mult starts consuming. EDIT: Found this issue https://clojure.atlassian.net/browse/ASYNC-246 which seems to be related, in that case probably hangs because the items might be properly dropped and then (<!! t-1) hangs mult launches a go block internally. There is no happens-before relationship between that launched go block and the taps happening in the let binding. It is a perfectly normal ordering for the taps to happen before the mult starts distributing vals."
