["https://ask.clojure.org/index.php/11008/instaparse-and-an-s-exp-language-how-do-i-deal-with-comments"]
title = "instaparse and an s-exp language: how do i deal with comments? - Clojure Q&A"
description = "I am trying to write a parser for an s-expression-based language. It has the usual `;` to  ...  my-parser ... :auto-whitespace ws-or-comments)"
full_description = '''I am trying to write a parser for an s-expression-based language. It has the usual ; to the end of line comments. My problem is that I don't want to strip the comments (my original goal was to write a pretty-printer/formatter), and the comments can appear anywhere in the code. I have been working on an instaparse grammar for lua (eventually writing a little analyzer and optimizing compiler for it). I ran into similar issues w.r.t. comments (in-line and block). I currently have defined comments in the grammar so they parse into the data structure. Now I have the unfun task of preventing parsing -- (the comment syntax) as two unary - - operators. You should have no such problem in sexpr language though. I am still picking up instaparse, so low mileage. There are probably better answers. Another option that comes to mind is to have a 2 pass parsing; first pass scrapes out comments but retains them for printing, second pass parses the "normal" code.'''
