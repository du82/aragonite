["https://ask.clojure.org/index.php/12346/potential-race-condition-in-requiring-resolve"]
title = "Potential race condition in requiring-resolve? - Clojure Q&A"
description = "Hello! I've been using a few of the functions from `clojure.tools.build.api` in a `future`  ... -resolve` could be modified to be thread safe? Thanks!"
full_description = "Hello! I've been using a few of the functions from clojure.tools.build.api in a future and I sporadically see this error... ...the code is only really using requiring-resolve to execute another function. Diving deeper into requiring-resolve I can see that the first call to resolve is not synchronized with the same lock that the serialized-require function uses... First, is it possible requiring-resolve is actually returning clojure.lang.Var$Unbound from the first call to resolve when another thread is in the process of requiring that namespace via serialized-require? Assuming so, should tools.build (and I guess by extension most Clojure code) avoid using the ((requiring-resolve 'some-other/function)) pattern? Is it possible requiring-resolve could be modified to be thread safe? The intent of requiring-resolve is to be thread-safe, so if anything, this should be treated as an issue for Clojure. Really, requiring-resolve is a halfway point to making require itself thread-safe which is a bigger and more complicated issue (example report at https://clojure.atlassian.net/browse/CLJ-1876). The tendrils of this go pretty deep and are ultimately related to namespaces not being inmutable (we should know better!)."
author = "Aaron Lahey"
year_published = 2022
year_updated = 2023
