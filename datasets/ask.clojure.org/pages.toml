full_description = "Hi, I've found some weird behaviour when attempting to play a sound using a javax.sound.sampled.SourceDataLine. The following code illustrates the problem: Compiling this with Clojure 1.12.0 using Leiningen, play1 does what it's supposed to, but play2 gives me the following error: I get this error using both OpenJDK 21.0.5.11-hotspot and Oracle's JDK 23. Also with Clojure 1.11.0 and 1.10.0, but 1.9.0 works fine. Anyone know why this is happening? I suspect the latter case is using reflection (because you've lost the interface return type of getSourceDataLine), and you are thus searching the concrete class for the method, which may not be accessible due to module visibility. That flows the interface type into play2 where it should be able to make the same calculation as in play1."
