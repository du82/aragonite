["https://ask.clojure.org/index.php/14027/type-inference-in-defn"]
title = "Type inference in defn? - Clojure Q&A"
description = "(ns graalvm-list-issue.main (:require [clojure.java.io :as io])  ... /src/jvm/clojure/lang/Compiler.java#L4286-L4290"
full_description = "The first println line has no reflection, the second println line has reflection, and an error occurs during execution in GraalVM. I see no difference between the two calls, and since it is obvious that it is io/file as the return value of local-dir, it should be type-inferred as java.io.File. What do you think? Key function is hasJavaClass and getJavaClass. https://github.com/clojure/clojure/blob/8c8e4f6ef21f3d0f59deb60cdc7e1b584f596d59/src/jvm/clojure/lang/Compiler.java#L359-L361 FnExpr: https://github.com/clojure/clojure/blob/8c8e4f6ef21f3d0f59deb60cdc7e1b584f596d59/src/jvm/clojure/lang/Compiler.java#L4450-L4454 InvokeExpr: https://github.com/clojure/clojure/blob/8c8e4f6ef21f3d0f59deb60cdc7e1b584f596d59/src/jvm/clojure/lang/Compiler.java#L4286-L4290 local-dir effectively returns Object, as all functions do in Clojure without return type hints. There is no inference here. While this seems obvious in this example, once you introduce conditionals / multiple tail positions, and primitives, it becomes quite a bit more complicated. With multiple tail positions, it's pretty common for the answer to really be multiple answers - presumably you would need to then find a common supertype or omit in that case. Also, because type hints are primarily useful for Java interop, the cases where you actually need the return type hint are relatively small (many programs may have no cases of it). At the current time, the effort involved to produce something of limited use is probably not worth it, but maybe something to look at in the future."
