["https://ask.clojure.org/index.php/14357/why-does-await-fire-off-an-agent-s-watch"]
title = "Why does `await` fire off an `agent`'s watch? - Clojure Q&A"
description = "I'm having trouble understand how `await` works on agents. From the doc string reads > Blocks the  ... changed and yet it's fired What's going on?"
full_description = '''Blocks the current thread (indefinitely!) until all actions dispatched thus far, from this thread or agent, to the agent(s) have occurred. So sounds like it should wait for any tasks running on a given agent or any work that agent has dispatched itself (say to other agents or threads). So if I send something then I can await for it to finish. Whenever the reference's state might have been changed, any registered watches will have their functions called. If you look at the source of await, you'll see it send a function to each agent provided as arguments, that counts down a latch (and returns the agent's value). A watch is triggered every time a fn is sent to that agent -- because any fn "might have [..] changed" the state.'''
author = "kxygk"
year_published = 2025
