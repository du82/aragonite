title = "Type hints getting ignored, reverting to java.lang.Object - Clojure Q&A"
description = "(deftype l [^java.util.List x]) (use '[clojure.reflect :as r]) (:members (r/reflect (l. ... ) that does > not return a Collection or an array."
full_description = "Have been specifically trying to get an optaplanner example working in 100% clojure https://github.com/joinr/optaplanner-clj/tree/163d326a6433b88ca9811e33d30758ceff42b91f . The code is evaluating but this error keeps occurring on running (solve (->problem)) Others besides me can answer more authoritatively here, but I am pretty sure that methods created by the Clojure compiler for Clojure functions, and deftype methods, can have one of the three types java.lang.Object, primitive long, or primitive double for parameter types and return types. Anything other than those, and your most effective bet is using something other than the Clojure compiler to create the JVM byte code, e.g. write some Java wrapper code and compile with javac, or learn some library for generating JVM byte code like the asm library that the Clojure library does. For reference, it looks like clojure.tools.emitter.jvm DOES preserve the type of non-primitive fields...."
