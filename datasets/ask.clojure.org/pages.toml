description = '''Clojure beginner here. I've created a leiningen project "adventofcode" and I've created a file "src/ ...  I wouldn't mind a comment on that too.'''
full_description = '''I've created a leiningen project "adventofcode" and I've created a file "src/adventofcode/2024/day7.clj" with this namespace: Now when I run lein repl the prompt is adventofcode.core. How can I call a function in the file above? Or switch to the namespace adventofcode.2024? Tab completion suggests that this namespace doesn't exist. Do I manually have to load the file somehow? I'm just starting out. If I'm making my life unnecessarily hard with this project structure I wouldn't mind a comment on that too. Using adventofcode.2024.day7, you have to require it as adventofcode.2024.day7, not as adventofcode.2024. Tab completion might not work properly because the middle part of the namespace is a number, but I'm not sure - in any case, don't rely on tab-completion alone. So, suppose you have a function f in that namespace. Require it as [adventofcode.2024.day7 :as day7] or with some other alias that you prefer, and call f from adventofcode.core as (day7/f), that's it. The only problem with that naming is if you decide to use the generated classes from Java-the-language. It doesn't support numeric package segments, even though JVM does support them.'''
