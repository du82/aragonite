title = "best way to conditionally def a symbol and do some side effect if symbol does not exist? - Clojure Q&A"
description = "I was surprised that this code in dev/user.clj doesn't run at start up: (ns  ... ]: https://clojurians.slack.com/archives/C053AK3F9/p1683882344251029"
full_description = "Something like this was also suggested to me in the clojurians [https://clojurians.slack.com/archives/C053AK3F9/p1683882344251029][Slack] : Without seeing your full project I can’t be certain, but I am guessing that your user namespace is configured to be AOT-compiled (compiled to a Java class ahead of time, rather than being compiled from Clojure source at startup time). When that happens, the compiler often optimizes things that can be done at compile time instead of startup time, so your println probably happens once when the project is being compiled, rather than every time your application is run. This often trips people up who are trying to do things like capture the time an application started in a var; they end up seeing the last time the project was compiled. Understanding the lifecycle of top-level forms can be tricky and subtle, especially when it comes to compilation and the interaction between Clojure and the JVM. Not having to grapple with them is one of the benefits you can derive by adopting a state-management library like Component or system."
author = "James Pratt"
