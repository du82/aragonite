["https://ask.clojure.org/index.php/11234/help-me-understand-the-var-basics-in-clojure"]
title = "Help me understand the var basics in Clojure. - Clojure Q&A"
description = "We know that when we send a symbol to REPL, Clojure will resolve the symbol to  ... ://drive.google.com/file/d/1HaqwYCRFiKs9ZvJrK33RsIZgNGZSxvap/view"
full_description = "We know that when we send a symbol to REPL, Clojure will resolve the symbol to var, and get the value which is currently the var's bindings. And we also know that var object is stable when it is interned by namespace, so we can dynamically modify the runtime behavior of a program(by re-def-ing the var's bindings). But here comes a strange things that I don't understand. Screenshot of the REPL process The first question: where is the value 99 resides? It used to being resolved from #'a, but it seems being like a lexical bindings after #'a being unmapped. Is it? The second question: why the #'a is interned back with unbound state after execute (var a) in another namespace(which has a refering to #'a)? Seems it create a new var to fullfill the state. It might be helpful to step back to concepts a bit. A namespace holds a set of names (symbols) mapped to vars. A var is a box for a value. def maps a name to a var in the current namespace. refer maps the name in the current namespace to the var in a different namespace. Q1: ns-unmap removes the mapping in ns-a from symbol to var, but it does not destroy the var. The var still exists (and is referenced by the refer in ns-b). Q2: var is a special form (implemented in the compiler) and is maybe doing something different than what you think. var will resolve to the var object (here the symbol a in ns-b resolves to the var at compile time which is #'ns-a/a (not the var object, but this token!!). That is then evaluated by looking up the var for a in ns-a (which does not exist). I think it's this special form compilation that's the confusing bit here (and only happens due to var)."
author = "Jian Zhang"
year_published = 2021
clearnet = "https://ask.clojure.org/index.php/11234/help-me-understand-the-var-basics-in-clojure"
