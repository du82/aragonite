["https://ask.clojure.org/index.php/9662/is-clojure-a-good-first-language"]
title = "Is Clojure a good first language? - Clojure Q&A"
description = "I am new to programming. I have started to learn C++ and even some python My background is  ...  any insights/advice, tips. Thanks in advance, Baye"
full_description = "I am new to programming. I have started to learn C++ and even some python My background is Economics. I have strong quantitative background (Math and Econ) and I know STATA. In general, I would like to use programming (1) for ML/AI in economics topics+other utilities such as webcraping, and other data driven analyses (2) for it, fintech matchmaking platforms In particular, I just recently discovered I love programming. I am old (35) as a beginner but I have set a goal to become a fully capable programmer by 40...Hopefully I can learn 2 languages well enough by then. If jobs opportunities are present then, I can switch careers although I still like my career path. I could always use my programming skills for either my job, a start up, or become a full fledge prgrammer. Online research has led me to think that Clojure might be an excellent language to focus on because they say it is an excellent for rapid development (If I want to use it for a start up, lone developer), data-driven (econ and ML), and provide a path to be a great programmer. My Apprehension is that Clojure doesn't seem widely used so might issues with doing ML projects with few libraries (compare to Python for ex), and future job prospects, etc... Clojure demands a lot from you in terms of learning But I think it's got the most to teach in terms of pragmatism I'd recommend installing clj-kondo early on and get really comfortable With your editor and sending forms to your REPL using rich comments There's not much out there that can top a fast well oiled REPL editor Workflow it's like having a conversation with your program I think Clojure is wonderful as a first language. That's an easy thing to say and hard to back up though — Clojure wasn't my first language, and I knew Java before I started learning Clojure. I think programming in general has a pretty steep learning curve because there is a very comlpex mapping from code in the text file to the behavior of the program when it's executed. As a software developer, you need to have a virtual machine in your head that can execute the code while you write it. The longer the feedback loop from writing code to seeing its execution results, the bigger the load on your mental virtual machine, the harder it is to progress. Other mainstream programming languages try to solve this problem with type systems and IDEs, and I think they are not good enough at that, because:"
