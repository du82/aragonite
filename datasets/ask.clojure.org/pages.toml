title = "Self-Like Pattern Using Multi-Methods - Clojure Q&A"
description = "Hello, I've reading about the Self language, and got experimenting with multi-methods to mimick ...  messages with multiple keywords. Thanks, - Quenio"
full_description = '''I’ve reading about the Self language, and got experimenting with multi-methods to mimick Self-style messages. I was curious what folks think about this pattern: Do you find this pattern interesting, useful? The example doesn’t show it, but there could be messages with multiple keywords. You could also look at building something on top of clojure.core.match. Do not feel boxed-in by multimethods! Or you might be able to get closer to the ideal by writing your own macros to do the dispatching. One thing to watch out for, using Clojure's built-in multimethods dispatching by keys, is that message maps must not have any "extra" keys. For the most part, Clojure patterns embrace the idea that you can stuff extra keys into a map without breaking contracts.'''
