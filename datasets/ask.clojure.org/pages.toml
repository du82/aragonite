["https://ask.clojure.org/index.php/13056/poor-errors-when-derefing-a-non-ideref-non-future"]
title = "Poor Errors when deref'ing a non-IDeref/non-Future - Clojure Q&A"
description = "# Problem Statement The function `clojure.core/deref` throws a hard-to-decipher `ClassCastException` when  ... /read-eval-print--9206 (main.clj:437)"
full_description = '''The function clojure.core/deref throws a hard-to-decipher ClassCastException when given an object that's not an instance of clojure.lang.IDeref or java.util.concurrent.Future. In my experience on-boarding new Clojure users (at my job and in my open source projects), this comes up and can be quite confusing as it doesn't point to anything obvious in the code. Even with the stack trace, it just points to deref-future's definition (instead of a specific line within the function body), which further confuses. On Slack, I proposed changing the implementation of deref to be something like (cond (instance? clojure.lang.IDeref ref) ... (instance? java.util.concurrent.Future ref) ... :else (throw (IllegalArgumentException (str ref " cannot be deref'd as it is of type " (class ref) ".")). Sean Corfield brought up that such a fix would cost performance for all non-IDeref uses of deref, which I acknowledged but find acceptable.'''
