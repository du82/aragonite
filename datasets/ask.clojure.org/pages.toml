["https://ask.clojure.org/index.php/12996/there-performance-difference-between-creating-vector-into"]
title = "Is there any performance difference between creating vector via (into [] xs) or (vec xs)? - Clojure Q&A"
description = "I can create set/map/vector by two ways: (into #{} xs) ;; creates PersistentHashSet (set xs) ...  is an established idiom what to use when? Thanks!"
full_description = "(into r xs): - defines generic algorithm by conj!-ing input sequence 1 by 1 to passed result collection (uses transient/persistent trick) (ctor xs): - defines precisely type of result data structure - passes xs sequence as an argument to constructor (which is static java function) so every ctor may define its own logic of creation (maybe by not conj-ing input sequence 1 by 1) Are there any performance differences between these two ways? Maybe there is an established idiom what to use when? This isn't exactly right in that hash-map does not take xs, it takes individual key value elements, like (hash-map :a 1 :b 2) vs (into {} [[:a 1] [:b 2]]). For that one, what you have in hand will drive. If you have a collection of pairs then into is preferred. If you are building a literal map, it's probably best to just use { ... } and make a literal map vs hash-map (which you will rarely use unless as a higher order function). The implementations for vec and set are similar to what you'll get with into (reduction over elements into transient collection), so I would expect performance to be similar. vec and set are shorter to type, but into can take transducers, so that's the tradeoff."
author = "Andray Shotkin"
year_published = 2023
