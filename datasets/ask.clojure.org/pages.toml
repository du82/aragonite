["https://ask.clojure.org/index.php/13479/somehow-i-have-to-loop-after-all"]
title = "Somehow I have to loop after all - Clojure Q&A"
description = "I know some little Lisp, but Clojure feels a bit different: (defn mojorate [] (let [v (vec (range 1 11)) max (-  ...  v i) 2)))) (if (= i max) (do ("
full_description = "You have way too many go blocks, not only in terms of their amount in the code but also in terms of how many are executed. That first go block in the loop doesn't block - it lets the execution continue immediately. There's no guarantee that by the time that same block is executed again the previous block has had enough time to put the value into the channel. It's a race condition. To confirm, simply run this code: (set (repeatedly 10000 mojorate)). Increase the number if all you get is a set of one element. The first half of the sentence is an implementation detail that's beside the point from the perspective of the user of the function. If the only thing you need to do is to get a vector of 10 numbers starting from 1 divided by 2, then it's (mapv #(/ % 2) (range 1 11)) of course. If you need something else, then please describe in detail so we're not stuck in the XY problem. There are multiple ways in which the original function can be rewritten - none of which could potentially be correct if your real problem demands something specific."
author = "Karl Goethebier"
year_published = 2023
clearnet = "https://ask.clojure.org/index.php/13479/somehow-i-have-to-loop-after-all"
tags = ["agents", "answer", "atom", "atoms", "beginner", """
