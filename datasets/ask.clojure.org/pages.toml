["https://ask.clojure.org/index.php/12536/performance-penalty-numeric-benchmark-alleviated-doubles"]
title = "Odd performance penalty on numeric benchmark alleviated by going to doubles... - Clojure Q&A"
description = "I happened across the performance benchmark [here][1] and I was curious why clojure was  ... niklas-heer/speed-comparison/blob/master/src/leibniz.java"
full_description = "I happened across the performance benchmark here and I was curious why clojure was getting beaten by java. So I tossed it into the profiler (after modifying their version to use unchecked math - which didn't help) and nothing shows up. hmm. decompile and find that So looks like the double/long boundary is costing us at least a method lookup maybe in Numbers.divide? So I just coerce everything to double (even our index variable): Any ideas why the java implementation not paying the same penalty for division? [both versions are implemented with unchecked-math at :warn-on-boxed]. I also tried a variant with fastmath's primitive math operators and actually got slower. So far nothing has beaten coercing the loop index i into a double (which I would normally never do). I won't have time to take a look at this for a while, but it is pretty easy to fall into boxing at the loop/recur boundary which will cause substantial slowdowns, but it's easiest to tell for sure by looking at the bytecode."
author = "Tom"
year_published = 2023
