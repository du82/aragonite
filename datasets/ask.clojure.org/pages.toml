["https://ask.clojure.org/index.php/12567/multi-threaded-cache-stampede-in-core-cache"]
title = "Multi-threaded cache stampede in core.cache - Clojure Q&A"
description = "We recently deployed core.cache in a web context, and we found out that there  ...  https://clojurians.slack.com/archives/C03S1KBA2/p1674040460264619"
full_description = "We recently deployed core.cache in a web context, and we found out that there was a cache stampede for multi-threaded access. It was obvious in retrospect, but the references to stampede in the docs made me think that this was handled. lookup-or-miss seems to have a concurrency bug indeed. On line 57 and 67 the deref-ed value of a delay is inserted in the cache via a swap! . This delay can only be executed once, however when many threads have a cache miss for the same value at the same time, many threads will deref a value. As a result there will be many executions before the value is inserted in the cache. https://github.com/clojure/core.cache/blob/master/src/main/clojure/clojure/core/cache/wrapped.clj#L57 https://github.com/clojure/core.cache/blob/master/src/main/clojure/clojure/core/cache/wrapped.clj#L67 To fix this the wrapped namespace will have to store the delay in the cache and deref these delay only on retrieval."
author = "Orestis Markou"
year_published = 2023
