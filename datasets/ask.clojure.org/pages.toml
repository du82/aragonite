["https://ask.clojure.org/index.php/11362/bug-in-clojurescript-type-inference"]
title = "Bug in ClojureScript type inference? - Clojure Q&A"
description = "Further to a recent conversation in the ClojureScript topic in Slack, Dan Sutton suggested that I  ...  But that gives me exactly the same error."
full_description = "Further to a recent conversation in the ClojureScript topic in Slack, Dan Sutton suggested that I create an issue here. I think I may have found a bug in ClojureScript's type inference. I've created a minimal reproduction here: ^js/number is not a valid hint for numbers. Anything starting with js/ is treated a hint for externs inference and therefore won't affect the warning in this case. It should just be ^number without the js ns. Also note that ocall is a macro so whether or not it applies the metadata you supplied to the source form to the output form is up to that macro. Therefore it might not actually arrive in the compiler to where it needs to be. Also consider using just (js/Math.random) instead of ocall. This is safe from renaming like all standard functions are. That'll also preserve the typehint properly."
author = "Paul Butcher"
year_published = 2021
