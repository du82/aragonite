full_description = "I'm starting with Clojure, better yet, re-starting after trying it several years ago. There are some new tools like Babashka that I'm trying to use for this. Run an external process with 'ansible-inventory' against one host at a time, or all hosts, let's see... So you already came up with str/split-lines for your first bullet, to get a sequence of lines. For the second bullet you can use drop-while to get rid of all the lines before the one that is just your opening {. At that point I would probably just rejoin the rest of the lines and feed that entire string to a JSON parser, telling it to parse one object. But you could use take-while to get all the lines up to (but not including) the one that is }, then join those and tack the } back on as well. With the caveat that your chosen JSON parser does not seem to like strings enclosed in single quotes. so I had to edit a.txt to use double quotes instead, as well as adding some trailing post-JSON lines to test that they get stripped properly too, the following seems to work:"
