["https://ask.clojure.org/index.php/10897/is-this-a-bug-in-cl-format"]
title = "Is this a bug in cl-format - Clojure Q&A"
description = 'The following call to cl-format results in a Java level null pointer exception. (cl-format false "  ... .AFn/run Thread.java: 834 java.lang.Thread/run'
full_description = "Of course that code sample is pretty meaningless. The real example which lead to this minimum test case was the following. As near as I can tell the problem seems to be in dealing with the final ~@ where the clojure code seems to (I'm guessing) destructure the nil return value of extract-params in the function compile-directive in cl_format.clj. After a bit of research I now understand the error better. The format string given to cl-format may contain zero or more directives. Each directive begins with ~ and ends with a dispatch character such as % or a or s etc. between the ~ and the dispatch character several intervening things can be found. such as : or @ in either order, and potentially arguments such as ~2,4f or ~3,-4s or ~3,-4:@s. the : and @ are simply Boolean flags to pass to the dispatch function. IN my case I gave it ~@ followed by end of string, so cl-format should ideally detect that end-of-string was reached before the dispatch character was found."
author = "Jim Newton"
year_published = 2021
clearnet = "https://ask.clojure.org/index.php/10897/is-this-a-bug-in-cl-format"
