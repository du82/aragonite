full_description = "Hi, I've been testing the new clojure.core.async 1.8.711-beta1, and suspected that since the default fixed thread pool was replaced with a cached thread pool, it could be possible for the system to create a very large number of OS threads, in the order of hundreds or thousands depending on the size of the workload. I am wondering if this was intended or if there might be a better middle-ground such as still using a CachedThreadPool but potentially accepting maximum sizes for each pool type via sys props, with reasonable defaults. There's so much stuff in this example, it's hard to tell what actual use case you're trying to think through. Yes, mechanically it's possible, but I can't tell what's important here or if this is just poorly structured - are you trying to make a point about io-thread or the change in go or the use of them together? You're eagerly spinning task-count number of blocking tasks. Before io-thread, you would have used thread for that, which is no different. (In the future io-thread will be able to utilize JVM virtual threads when available, which will be ideal for this in resource usage.)"
