["https://ask.clojure.org/index.php/10744/clojure-deftest-exception-reporting-lists-useless-frames"]
title = "clojure.test deftest exception reporting lists many useless stack frames - Clojure Q&A"
description = "If an exception occurs during a clojure.test deftest, the error goes to clojure.test/report with :error key ... be a dyn var to not filter if needed)."
full_description = "If an exception occurs during a clojure.test deftest, the error goes to clojure.test/report with :error key which will (by default) print the entire stack trace. The stack includes the test framework itself and (if invoked via an external test runner like lein test, clojure.main etc), yielding a stack depth of ~60 stack frames which is all incidental noise that is irrelevant. There is a dyn var clojure.test/stack-trace-depth that defaults to nil (all). This dynvar can be bound around calls to the clojure.test runner to see less stack trace when an exception occurs during a test, but this is both difficult to set for external test runners and error prone. It would be most useful to filter the framework noise from the bottom of the stack and present only the relevant frames. the reported error (here from lein test, but any external runner is similar), only the top 2 lines are relevant, the rest is incidental noise: We are doing things elsewhere to filter frames and I don't think it would be that hard to filter this to improve the default experience (could still be a dyn var to not filter if needed)."
author = "alexmiller"
year_published = 2021
