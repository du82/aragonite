["https://ask.clojure.org/index.php/9978/best-test-integer-including-integer-multimethod-dispatch"]
title = "Best way to test for an integer (including java.lang.Integer) in a multimethod dispatch? - Clojure Q&A"
description = "It seems (?) like Clojure makes all integers instances of java.lang.Long. I recently found a library I ... ) (defmethod int-or-nil :default [not-int])"
full_description = "It seems (?) like Clojure makes all integers instances of java.lang.Long. I recently found a library I use (which wraps a Java lib) was returning java.lang.Integer instead. This broke a multimethod I have which was dispatching on class. My solution was to simply make a new defmethod to handle java.lang.Integer. It's exactly like the defmethod for handling java.lang.Long. Is there a more elegant way to do this? Can a defmethod be made to handle a set of dispatch values? There is a common ancestor class for Integer and Long, java.lang.Number, but I don't want to use that because it will catch floats, which should fall through. I suppose I could rewrite the dispatch to test if the class of input is Integer or Long and just dispatch those as :int and then dispatch java.lang.String as :string, although that actually may end up being more code :) Clojure lets you write defmulti definitions with any dispatch function you choose, not only class as you have shown in your example. and then a defmethod with dispatch value :integer will be called for any value x such that (integer? x) returns true. You can give Long and Integer a common ancestor in a custom hierarchy that you tie to the multimethod."
author = "Ryan Tate"
year_published = 2022
