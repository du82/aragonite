["https://ask.clojure.org/index.php/4243/issue-defining-a-defrecord-protocol-method-named-clear"]
title = 'Issue defining a defrecord protocol method named "clear" - Clojure Q&A'
description = 'There seems to be a problem in trying to define a protocol with a method named "clear" ( ... return types, since Collection.clear() returns void??)'
full_description = '''=> CompilerException java.lang.ClassFormatError: Duplicate method name&signature in class file xxxx/Foo, compiling:(NO_SOURCE_PATH:1:1) I assume this is due to a name conflict with the Java method Collection.clear() in the underlying implementation. However the error is very unclear about this, and the potential for conflict appears to be undocumented as far as I can see. There seem to be two possible approaches to fixing this: a) Disallow the use of "clear" as a protocol method name (in which case the error should be more informative, and the rule should be documented) b) Find a way to support this in the class file format (possibly by overloading on JVM return types, since Collection.clear() returns void??) Mike, the jvm doesn't support return type overloading so your second suggestion is not technically possible. Reading the doc for defrecord {quote} The class will have implementations of several (clojure.lang) interfaces generated automatically: IObj (metadata support) and IPersistentMap, and all of their superinterfaces. {quote} It might be out of the scope of this ticket, but protocol method conflicts can cause some other kinds of errors: CompilerException java.lang.VerifyError: (class: user/R1, method: finalize signature: ()Ljava/lang/Object;) Unable to pop operand off an empty stack, compiling: ... user=> (defprotocol P2 (wait [this])) P2 user=> (defrecord R2 [] P2 (wait [this])) user.R2 user=> (def r (->R2)) user=> (wait r) CompilerException java.lang.IllegalArgumentException: No single method: wait of interface: user.P2 found for function: wait of protocol: P2, compiling: ... user=> ` "Note that there may be more than one matching method in a class because while the Java language forbids a class to declare multiple methods with the same signature but different return types, the Java virtual machine does not. This increased flexibility in the virtual machine can be used to implement various language features. For example, covariant returns can be implemented with bridge methods; the bridge method and the method being overridden would have the same signature but different return types."'''
author = "jira"
year_published = 2015
