["https://ask.clojure.org/index.php/11395/hash-collisions-case-statements-try-evaluate-the-constants"]
title = "Hash collisions in case statements try to evaluate the constants - Clojure Q&A"
description = 'When `case` statements use hashing and have a hash collision, they embed a `condp` expression.  ... entries will be tested sequentially..*\r?\n"'
full_description = "When case statements use hashing and have a hash collision, they embed a condp expression. However, this expression inserts the constants directly, without quoting. If any constants include a symbol, then these will lead to an error. This shows a call to case*. The first and second arguments are 0, 1. When these are used with clojure.core/shift-mask both '#{a} and 'a will hash to 0. This condp block contains unquoted values for #{a} and a, so they will incorrectly attempt to match on the value of the current binding for a (if such a binding exists). Since case will interpret every test-constant as a literal (explicitly stating that they need not be quoted), these values should be quoted when they appear in an embedded Clojure expression like this this condp."
author = "Paula Gearon"
