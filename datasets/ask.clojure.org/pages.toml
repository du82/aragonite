["https://ask.clojure.org/index.php/13246/useful-macro-for-output-redirection-feature-request"]
title = "Useful macro for output redirection (feature request) - Clojure Q&A"
description = "I think it would be useful to add a macro which redirects the standard output to `*err*`: (with-err-out [& body] `(binding [*out* *err*] ~@body))"
