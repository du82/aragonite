["https://ask.clojure.org/index.php/9910/multimethods-resolutions-when-they-have-same-dispatch-value"]
title = "Multimethods resolutions when they have the same dispatch value - Clojure Q&A"
description = "When two multimethods have the same dispatch value, what is the method of resolution? In order ...  or infirm my hypothesis? Best regards, David"
full_description = '''In order to answer this questions, I experimented by creating four files (core.cljs, a.clj, b.clj, interface.clj [where `defmulti` is defined]), implemented some methods in a and b namespace with the same dispatch value. Finally in core namespace, I required a and b, and observed the resolution was given by the order of the import of the namespace. However, in a bigger project, the order did not have an impact: I was overriding a multimethod in a library, and I suspect the resolution was made with respect to the folder in the classpath. Each "defmulti" knows at-most-one method with any particular dispatch value. If a second "defmethod" comes along, it replaces the first. This is a cornerstone of REPL-based development. On the other hand, there is some interesting work behind-the-scenes to dispatch a multimethod call in cases when the dispatch function returns a value that is related (by the relevant hierarchy) to more than one method's dispatch value. In that case, see prefer-method.'''
author = "davidpham87"
year_published = 2020
