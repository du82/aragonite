["https://ask.clojure.org/index.php/10856/bug-format-that-does-not-pretty-print-corresponding-argument"]
title = "Is it  a bug in `cl-format` that `~A` does not pretty-print the corresponding argument ? - Clojure Q&A"
description = "The documentation of `cl-format` claims that it is **fully** compatible with the CL version of format ... str (pprint data))` rather than `print-str`."
full_description = '''The documentation of cl-format claims that it is fully compatible with the CL version of format. However, in CL the ~A directive (print aesthetically) pretty-prints the corresponding argument. For example (format out "~A" some-list) outputs the same as (pprint some-list out) However, in clojure (cl-format out "~A" some-list) outputs the contents of some-list all on a single line. Does anyone know whether it is possible to make this work correctly? I've seen the dynamic variable print-pretty which seems to have no effect on ~A. After a bit of searching, I've found what I think is the culprit. According to line 1338 of cl_format.clj it seems ~A dispatches unconditionally to print-str rather than to some form of pprint-to-str. I suspect that is a bug, because I don't see any comment there explaining how the pretty-printer is intended to be triggered here. It seems like it should use something like (fn [data] (with-out-str (pprint data)) rather than print-str. I think maybe you want ~W instead? Per http://www.ai.mit.edu/projects/iiip/doc/CommonLISP/HyperSpec/Body/sec_22-3-4-3.html, "An argument, any object, is printed obeying every printer control variable (as by write). " This seems to do what you're asking for on an example (matches pprint). The only real detailed doc for cl-format in Clojure is http://clojure.github.io/clojure/doc/clojure/pprint/CommonLispFormat.html from the author, but it has not been actively developed for a very long time (although we have done maintenance on it occasionally). I do see a note at http://www.cs.cmu.edu/afs/cs.cmu.edu/project/ai-repository/ai/html/cltl/clm/node200.html related to ~A and ~W and pretty printing that relates to some confusion on requirements there.'''
author = "Jim Newton"
year_published = 2021
