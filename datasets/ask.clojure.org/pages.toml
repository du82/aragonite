["https://ask.clojure.org/index.php/11282/what-canonical-share-bundles-predicates-generators-clojure"]
title = "What is the canonical way to share bundles of predicates + generators in clojure spec? - Clojure Q&A"
description = "I've been trying out Clojure spec and I often face situations in which I have to come  ... date :myproject.specs/localdate) What are the alternatives?"
full_description = '''I've been trying out Clojure spec and I often face situations in which I have to come up with a custom predicate function. Then sometimes these predicate functions require a custom generator. How can I share this predicate+generator bundle between different attributes? I've come to the conclusion that the right way to do that would be to define an attribute in a namespace (e.g myprojec.specs) in which I create an attribute with that spec I think you're on the right path for sure. I think maybe a useful intermediate point is that you could def (not s/def) the (s/with-gen local-date local-date-generator) - that is a spec+custom generator, named in a var. That's somewhat orthogonal to whether you want to define a named attribute (users of this spec+generator may want to put it on other attributes). Really, they can do either, by referring to spec var or by aliasing to a named attribute you create. The tradeoffs are subtle and may change with spec 2 in the future. With respect to bundling multiple things - namespaces are the way to bundle either vars referring to specs, or consolidate the loading of attributes. You may want to separate those two if you want to give users the maximum flexibility (a namespace for specs+generators, a namespace that defines attributes). There's a lot of options, and a fair amount of "it depends", so sorry I can't give more prescriptive advice.'''
author = "Michel Henrique Dib"
year_published = 2021
