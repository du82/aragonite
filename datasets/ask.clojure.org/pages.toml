title = 'Vector comparisons raise "clojure.lang.PersistentVector cannot be cast to java.lang.Number" exception - Clojure Q&A'
description = "Hi, when I try to compare certain vectors, I get the above-mentioned error message. I tried  ... .com/eNotchy/Advent-of-Code-2022/tree/main/Day13"
full_description = "Hi, when I try to compare certain vectors, I get the above-mentioned error message. I tried in Clojure 1.10.3 and babashka v1.0.168. These are some of the offending vectors: I came across this while doing one of the Advent of Code programming exercises yesterday. It asks you to compare a number of vectors, see https://adventofcode.com/2022/day/13 I did solve the exercise by implementing my own vector comparator, according to the specifications given in the exercise. I uploaded the source code in case you want it for testing purposes: https://github.com/eNotchy/Advent-of-Code-2022/tree/main/Day13 Comparing vectors will compare the elements in each index. For the example you have, the second elements are a number and a vector. The default comparator (which is the compare function) is not a universal comparator - there is no defined comparison between a number and a vector. So you will get a ClassCastException trying to compare them. You can use functions like sort or sort-by that also take a custom comparator. More on comparators here: https://clojure.org/guides/comparators"
