description = "We have `some->` and `some->>` which are great for pipelines where `nil` is a terminating value but there  ...  ~(if (empty? steps) g (last steps)))))"
full_description = "We have some-> and some->> which are great for pipelines where nil is a terminating value but there are a lot of times where you might want a pipeline to halt with more information. At work, for example, we have an image processing pipeline where each step either produces enhanced image information or an error hash map explaining why the pipeline cannot proceed. We currently have to explicitly code the error check into every step of the pipeline. Adding pred-> and pred->> macros which accept [pred expr & forms] but were similar in structure to some-> and some->> would make this a lot cleaner."
