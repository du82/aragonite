["https://ask.clojure.org/index.php/11441/how-have-repl-namespace-the-same-the-namespace-defined-file"]
title = "How can I have a clj REPL namespace be the same as the namespace defined in my file.clj? - Clojure Q&A"
description = "I am using Emacs/Cider to launch a `clj` REPL. I do this by first opening my file which  ...  this has already been asked and I missed it. Thanks"
full_description = "I am using Emacs/Cider to launch a clj REPL. I do this by first opening my file which defines a new namespace. I then use cider-jack-in-clj to launch the REPL. The REPL namespace is “user”. I can only use fully qualified functions within the REPL. If I enter user=> (ns myns) in the REPL, this works and changes the namespace as expected. I would like to automate this so that every time I launch a REPL from a file the REPL namespace changes as well. Within the emacs buffer for the code, I am able to get all the unqualified functions, but within the REPL, I need to use: I’ve searched online and through this forum, but I haven’t been able to figure this out. I’m sorry in advance if this has already been asked and I missed it. I hope someone comes along with a good answer for you. Clojure's initialisation process is a jungle with many moving parts. In this case there are at least 4 components which might be possible to configure to get good results: While we're waiting for someone who understands any of that; here is a really ugly brute forcing method using CIDER functions in an Emacs hook (ie, this is for ~/.emacs): When you run it inside a Clojure file buffer, it will switch the REPL to the current file's namespace. (cider-repl-set-ns NS) Switch the namespace of the REPL buffer to NS. If called from a cljc buffer act on both the Clojure and ClojureScript REPL if there are more than one REPL present. If invoked in a REPL buffer the command will prompt for the name of the namespace to switch to."
author = "prairie-guy"
