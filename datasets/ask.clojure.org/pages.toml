title = "Null pointer error when using filter - Clojure Q&A"
description = "Bumped into this quirk when repling around today: `(filter zero? [:hi])` throws a ` java.lang. ... . I am using Clojure version 1.11.1.1347 ."
full_description = "Bumped into this quirk when repling around today: (filter zero? [:hi]) throws a java.lang.ClassCastException without a proper stack trace. So it seems that either the tools that you're using with Clojure hide it from you for some reason (in which case knowing the exact steps you perform to not get a stacktrace would be helpful) or you didn't look in the right place. And in case you mean that the stacktrace seems to be pointing away from where you call filter - that's because filter doesn't actually filter anything, it creates a lazy seq that filters things out when it's being iterated over. So the stacktrace will might not include where filter is called but will include where the resulting lazy seq is being realized."
