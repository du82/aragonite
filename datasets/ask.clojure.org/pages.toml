["https://ask.clojure.org/index.php/11415/pesky-loop-resulting-0xffffffff-with-bufferedreader-interop"]
title = "Pesky loop bug resulting in 0xFFFFFFFF with BufferedReader (java interop) - Clojure Q&A"
description = "Hello -- I'm learning Clojure and its Java interop stuff. I am trying to emulate this function:  ... ... Any help is greatly appreciated.` -- Hank"
full_description = "Den typiska impulsiva olycksfågeln är en ung man som kraschar flera bilar, och ofta skryter lite med det, i varje fall när han är tillsammans med sina vänner._. För dem har otur i det närmaste blivit en livsstil, och de råkar konstant ut för olyckor, stora som små. Olycksfåglar kallar vi dem. Hur många det finns kan ingen med säkerhet säga, för det finns inga konkreta definitioner på denna grupp, och heller ingen given avgränsning av den. Att de finns, råder det emellertid ingen tvekan om, varken på sjukhusens akutmottagningar eller i försäkringsbranschen What in the world could be causing this (NOTE: I am not a Java programmer)? Here is the hex dump of the file text file: I then changed the code (see below), because of some suggestions that the problem might be my use of recur. And now it complains that a previous form that was working '(.append etc..') doesn't and the same error remains. If you prefer an interactive chat experience for asking such questions, the #beginners channel on the Clojurians Slack community at https://clojurians.slack.com is a good place for such questions. Either here or there, it can be helpful if you are willing to publish longer code samples you are working on in a public place such as Github.com. To your questions, your first function pt%% assigns a value to val before the loop begins, and then val always has the same value from that point onwards, never changing. Thus regardless of what is done inside of the loop, it will be an infinite loop, unless an exception occurs, which is what happens in your case. I have not tried to diagnose exactly why that particular exception occurs, because of the infinite loop issue and val never changing. pt5 has the same issue that val is always the same, because (recur val) occurs in a context where val is bound to the same value as when the loop began. In pt5, try using val as an argument to the tocChars method, and change the recur expression to (recur (.read bfr)) and see how that goes. And think about why that behaves differently than your version in the question."
author = "hank-lenzi"
year_published = 2021
