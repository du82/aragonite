["https://ask.clojure.org/index.php/10532/memory-leak-using-the-default-method-of-a-multimethod"]
title = "Memory leak using the default method of a multimethod - Clojure Q&A"
description = "An easy way to reproduce: Clojure 1.10.2 user=> (defmulti f identity) #'user/f user=> ... every single value that was matched with the default method."
full_description = '''The culprit seems to be MultiFn.findAndCacheBestMethod caching every single value that was matched with the default method. I don't know if this is a leak so much as a design assumption that the number of dispatch values is bounded. At one time we did not cache the dispatch values resulting in :default case and this made the :default very slow (this was the primary reason multimethods were considered "slow" for a long time). In 1.8, http://dev.clojure.org/jira/browse/CLJ-1429 changed this and it was a substantial performance boost for a lot of real programs.'''
author = "Eugene Pakhomov"
