["https://ask.clojure.org/index.php/736/gc-issue-81-compile-gen-class-fail-when-class-returns-self"]
title = "GC Issue 81:    compile gen-class fail when class returns self - Clojure Q&A"
description = '``` Reported by davidhaub, Feb 14, 2009 When attempting to compile the following program, clojure  ... returnMe [] "badgenclass"] Any thoughts? ```'
full_description = '''When attempting to compile the following program, clojure fails with a ClassNotFoundException. It occurs because one of the methods returns the same class that is being generated. If the returnMe method below is changed to return an Object, the compile succeeds. Beware when testing! If the classpath contains a class file (say from a prior successful build when the returnMe method was changed to return an object), the compile will succeed. Always clear out the clojure.compile.path prior to compiling. rm -rf classes mkdir classes java -cp lib/clojure.jar:classes:. -Dclojure.compile.path=classes \ clojure.lang.Compile badgenclass Attached is a patch that accepts strings or symbols for parameter and return class names, and generates the appropriate bytecode without calling Class/forName. It fixes this issue, but because 'ns' doesn't resolve :gen-class's arguments, class names aren't checked as early anymore. :gen-class-created classes with invalid parameter or return types can even be instantiated, and no error will be reported until the broken method is called. One possible alternative would be to call Class/forName on any symbols given, but allow strings to use the method given by this patch. To return your own type, you'd need a method defined like: Converted from http://www.assembla.com/spaces/clojure/tickets/84 Attachments: genclass-allow-unresolved-classname.patch - https://www.assembla.com/spaces/clojure/documents/cWS6Aww30r3RbzeJe5afGb/download/cWS6Aww30r3RbzeJe5afGb richhickey said: Updating tickets (#8, #19, #30, #31, #126, #17, #42, #47, #50, #61, #64, #69, #71, #77, #79, #84, #87, #89, #96, #99, #103, #107, #112, #113, #114, #115, #118, #119, #121, #122, #124) The approach take in the initial patch (delaying resolution of symbols into classes) is fine: gen-class makes no promise about when this happens, and the dynamic approach feels more consistent with Clojure. I think the proposed (but not implemented) use of string/symbol to control when class names are resolved is a bad idea: magical and not implied by the types.'''
