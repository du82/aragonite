["https://ask.clojure.org/index.php/11027/should-tools-build-functions-respect-with-from-tools-alpha"]
title = "Should tools.build functions respect with-dir (from tools.deps.alpha)? - Clojure Q&A"
description = "I ran across this issue with `depstar` but observed that `tools.build` behaves the same, possibly  ... where I definitely consider it to be a bug)."
full_description = "I ran across this issue with depstar but observed that tools.build behaves the same, possibly incorrect, way. If you wrap (b/create-basis ..) in with-dir from tools.deps.alpha, it calculates the basis from the deps.edn file in the context of the with-dir location. However, if you use that basis with tools.build functions, they do not behave correctly -- even if they are also wrapped in the same with-dir context. The dependencies come from the project deps.edn (Clojure 1.9.0 in this example) but the src used is from the root of the repo, not from the project folder. This is counter-intuitive (and took me a while to track down with depstar -- where I definitely consider it to be a bug). tools.build sits on top of tools.deps.alpha. If you're using tools.build, you should set its directory context via https://clojure.github.io/tools.build/clojure.tools.build.api.html#var-set-project-root.21. Why would you use the underlying lib's dir control in this context? What's the actual use case for that?"
