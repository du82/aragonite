["https://ask.clojure.org/index.php/14349/clojure-java-data-builder-fails-with-overloaded-setter"]
title = "clojure.java.data.builder fails with overloaded setter - Clojure Q&A"
description = "Trying to run make-chat-model (ns problem.problem (:require [clojure.java.data.builder :as  ...  following repo: https://github.com/gavlooth/problem"
full_description = '''Since modelName is not supplied as a property, in this case it could just ignore that setter altogether -- so I consider that one bug (java.data will fail if there are overloaded setters that you don't care about). In the case where you are trying to build with a property that is overloaded, java.data would have to perform some sort of overload resolution to try to pick a "best match" which would be fairly complex. What it could do is pick one setter for which instance? is true of the parameter type and the property value -- and complain if more than one setter satisfies that. That would still be somewhat overprescriptive but it would be less restrictive than the status quo.'''
