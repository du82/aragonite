["https://ask.clojure.org/index.php/10584/could-clojure-zip-next-docstring-be-misleading-to-some"]
title = "Could `clojure.zip/next` docstring be misleading to some? - Clojure Q&A"
description = "I'm wondering if the [docstring][1] for `clojure.zip/ ...  https://clojure.org/reference/other_libraries#_zippers_functional_tree_editing_clojure_zip"
full_description = "Moves to the next loc in the hierarchy, depth-first. When reaching the end, returns a distinguished loc detectable via end? If already at the end, stays there. Some people might assume, without more guidance, that the end of the zipper is the last node in the zipper and that calling next at that point will leave the zipper located at the last node. As far I understand it (which may be not far), the Clojure zipper end state is hit when you’ve called next after the last node in the zipper, after which: The next docstring might want to talk more about what “end” is and what reaching the end state means. Maybe something like: Moves to the next loc in the hierarchy, depth-first. When reaching the end, which is after the last node, returns a distinguished loc detectable via end?. If already at the end, stays there. When at end, valid calls are end?, next and root. Webster's Second Unabridged (1956) defines \"distinguished\" as \"distinct; differentiated\". As for a computer-science definition of \"distinguished value\", I did not find one online, but OpenAI Chat got it right, so it must be out there somewhere: 'the term \"distinguished value\" typically refers to a specific value within a data structure or system that has a special meaning or purpose. This value is often used as a marker or sentinel to indicate the beginning or end of a certain section of data or to signal a certain condition or state. For example, in a linked list data structure, the value \"NULL\" is often used as a distinguished value to indicate the end of the list..'"
author = "Lee Read"
year_published = 2021
clearnet = "https://ask.clojure.org/index.php/10584/could-clojure-zip-next-docstring-be-misleading-to-some"
