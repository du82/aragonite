["https://ask.clojure.org/index.php/12603/need-help-using-slurp-json"]
title = "Need help using Slurp & JSON - Clojure Q&A"
description = "I'm completely new with Clojure and I'm trying to do some basic stuff with Slurp and JSON. I found some ... ) :city)] (core/prn city-name) city-name))"
full_description = "I found some code (doesn't work) that I'm using as an example to try to learn some basics. The following code is supposed to get some JSON data from Ipinfo.io and then pull JUST the City name from it and print it. I'm getting so many errors with the namespaces that I can't even get to testing the actual code. :-( By default data.json will read json as string keys, so everything above worked, except the :city part. It helps in Clojure to work interactively with a REPL and do one step at a time - you could then quickly see that read-str returned a map with string keys. To find docs for this function, use (doc json/read-str) to see the docstring, which refers to read where this is documented: (doc json/read). There is a :key-fn option which defaults to identity but you can use keyword function to construct keyword keys instead. Once you do that, you'll want to use -> instead of ->> to thread first."
author = "BuilderGuy1"
year_published = 2023
