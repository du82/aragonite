["https://ask.clojure.org/index.php/13339/tools-better-detect-errors-coming-existing-methods-fields"]
title = "How can tools better detect errors coming from non-existing methods/fields? - Clojure Q&A"
description = '`(.a "")`, rightfully, throws an IllegalArgumentException without a [:phase][1]. One  ... ? [1]: https://clojure.org/reference/repl_and_main#_at_repl'
full_description = '''One can consider, however, that this IllegalArgumentException is "compiler-like", while it doesn't seem primarily distinguishable of other IllegalArgumentExceptions that may be thrown in more "runtime-like" situations. My problem is that, as a tool maker, without such a distinction, all IllegalArgumentExceptions will be given the same treatment, while users would want a more concise treatment (e.g. no stacktraces shown) for compiler-like ones. I would not consider this to be "code that is invalid to begin with" or compiler-like. It is syntactically valid code. When the member is not recognized it falls back to a reflective call which may fail at runtime. So, you could consider it a "Clojure runtime exception" or something, but we do not have any consistent thing that happens in that case, and there are probably 100s of places like this. Runtime exceptions are generally not wrapped because we want to flow what was thrown. Throwing some kind of consistent exception from within the Clojure runtime that carried additional info might be useful, but I don't know that that is feasible to change at this point. Instead of using (.a ""), use the Class/member syntax. In this case, (String/.a ""). This will either compile (indicating that the Clojure compiler found a single method that matches the provided inputs), or it will throw a syntax exception (indicating that it found either 0 matching methods or multiple matching methods). By only using this syntax, you can be sure that you're always matching against specific methods with no reflection.'''
author = "vemv"
year_published = 2023
clearnet = "https://ask.clojure.org/index.php/13339/tools-better-detect-errors-coming-existing-methods-fields"
