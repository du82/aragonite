full_description = "It seems to be no participation in Google Summer of Code since 2017. https://summerofcode.withgoogle.com/archive/2017/organizations/5054104644616192/ Is there any specific reason for that? I think it might be just because no one participated in 2017 Clojure project. We did it for several years and then had a couple years where they did not accept Clojure as a project. I ran the administrative aspects of it prior to that via Cognitect, not really something I'm eager to take on again, but would be happy to cheerlead someone else doing so. Related discussion at the mailing list: https://groups.google.com/g/clojure/c/sVAmYgk5lMI/m/Hw9Wey-HFgAJ"
