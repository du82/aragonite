["https://ask.clojure.org/index.php/14411/comparing-ratios-with-bigdecimals-can-throw"]
title = "Comparing ratios with BigDecimals can throw - Clojure Q&A"
description = "Observe: (< 1/4 0.5M) ;=> true ; as expected (< 1/3 0.5M) ; Execution error ( ... [it] compares numbers and collections in a type-independent manner ."
full_description = '''This worked (and produced expected results) in Clojure up to 1.2.1; the current behaviour is from 1.3.0 onwards. Not sure whether this is a bug or expected behaviour; in either case, I haven’t seen it documented. I’ve also noticed that = can’t determine whether a ratio is equal to a bigdec, although < and > do sometimes produce a good answer: This seems contrary to the docstring of =, which states that „[it] compares numbers and collections in a type-independent manner”. = will return false if two numbers are compared across different numeric partitions (int+ratio+bigint, float, bigdec). This one is kind of special. You say "= works" above but I don't think it works presumably meaning it does not throw, but it will always return false for cross-partition, e.g. (= 1/2 0.5M). Other numeric comparison operators coerce args to matching type, then compare. This includes == which thus does = across partitions. There are some cases where the coercion cannot occur - I think maybe irrational fraction to bigdecimal is the obvious (only?) case and in that case there is available coercion. I consider this expected behavior, not sure where we could document it but open to ideas. Maybe bigdec docstring, or at https://clojure.org/reference/data_structures#Numbers ? Where did you look first?'''
author = "Daniel Janus"
year_published = 2025
