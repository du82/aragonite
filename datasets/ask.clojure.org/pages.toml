full_description = "hi folks, I am trying out Integrant library for state management. It's quite intuitive when it comes to managing (starting/halting) servers but I am confused regarding a certain use case. I want to use integrant to instantiate and destroy an object. As usual I defined defmethods init-key and halt-key! . The problem is that I want a reference to the initialised object from init-key . Is there an idiomatic way to do this? Should I just have it available in an atom during init-key ? When you call (ig/init config), it calls ig/init-key in the dependency order of your config map and returns a map where each key is one of the defined init-keys. In your case, it will return {:my-space/my-key #<MyObject…>}. Depending on how you’ve structured your app, you can put this map into a var or an atom, or you can pass it as an argument to your ring middleware so every request has a reference, etc. You use that :my-space/my-key as a parameter to another component, that component will then receive the instance of MyObject that got created."
author = "Ashwin Bhaskar"
