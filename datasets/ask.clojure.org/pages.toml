["https://ask.clojure.org/index.php/13866/is-still-possible-compile-cljr-files-dll-exe-dotent-and-above"]
title = "Is it still possible to compile cljr files to dll/exe on dotent 6 and above? - Clojure Q&A"
description = "Is it still possible to compile cljr files to dll/exe on dotent 6 and above? I get the repl woking ,but don't know to how to make a exe out of it."
full_description = "It is not currently possible. Starting as far back as the first Core release, .NET disabled the call to save dynamically generated assemblies to files. That continues through .NET 8. All available third-party solutions that I've tried were not up to the task. The good news is that the Save method appears to be coming back in .NET 9: https://learn.microsoft.com/en-us/dotnet/fundamentals/runtime-libraries/system-reflection-emit-assemblybuilder#persisted-dynamic-assemblies-in-net-framework [The linked document has some caveats that indicate the capability will not be re-enabled simply by restoring the call to Save. If you are interested in why there will be problems in implementing the Clojure model, I'm happy to share.]"
