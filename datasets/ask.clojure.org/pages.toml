["https://ask.clojure.org/index.php/14260/providing-nil-for-long-option-tools-cli-does-seem-work-readme"]
title = "Providing nil for long option in tools.cli does not seem to work per readme - Clojure Q&A"
description = 'Hi, A very simplified tools.cli call: (let [cli-opts [["-m" "--mode MODE" "Application mode"]]]  ... . Am I doing something wrong, or is tools.cli? :)'
full_description = '''I get the same behaviour with long option = "", "--mode", and "MODE"; the only way it seems to work is with the full "--mode MODE". Setting the short option to nil works as I'd expect. When there's no long option in the form of --option ARG, the parameter is treated as a boolean flag, so you have to explicitly tell tools.cli that an argument is required by the parameter. As pointed out in the comments, this is an incorrect answer. Even as maintainer of tools.cli, I misunderstood the implications of the documentation! The required argument example can only be part of a long option. When you have no long option, it is assumed to be a Boolean switch argument. It is not possible to have a required argument without having a long option.'''
