full_description = "Now, the problem is, that output that came from a thread may be printed anytime, maybe 1 minute from now. So in absence of an ID, a message like {:tag :out, :val 1} lacks sufficient context to be able to track where it's coming from. Output and error are streams and not tied to any particular request - there is no general way to correlate these, so no that does not seem like a good idea."
