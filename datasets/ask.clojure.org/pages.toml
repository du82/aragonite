full_description = "I have the following piece of code to create a dropdown list with items that have a checkbox next to them. The problem is that the checkbox cannot be removed. When the user clicks on an already selected checkbox, nothing happens. And in this case, it should become deselect. Don't know for absolute certain, but it seems that by passing :checked, you have made the checkbox component controlled - it will not react to anything apart from a change to that value, and you have to do that yourself by also providing an :on-change function and changing the underlying value. Also note that you shouldn't be using sequential indices as React keys. Either don't use keys at all by avoiding lazy collections or figure out a natural key for components. As a final note, IMO it's better to ask such specific support questions on the Clojurians Slack where we have multiple channels. For this case, there's #reagent. It's much easier to have an ongoing conversation there."
