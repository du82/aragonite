["https://ask.clojure.org/index.php/12599/let-binding-does-not-infer-primitive-type-type-hinted-global"]
title = "let binding does not infer primitive type of type hinted global var - Clojure Q&A"
description = "When you type hint a var such as: (def ^{:tag 'long} k 100) And refer to it in ...  && e.hasJavaClass() && ((MaybePrimitiveExpr)e).canEmitPrimitive())"
full_description = "It looks like it might be caused by a bug in the Compiler where for some reason, the expression of the var k is marked as not having a java class, even though it has one: I suspect that the compiler checks for .hasJavaClass before calling .getJavaClass, and since .hasJavaClass is erroneously false here, it would cause the compiler to think it isn't, and that the type can't be inferred. I'm not too sure where in the Compiler this is, but I found the following: https://github.com/clojure/clojure/blob/master/src/jvm/clojure/lang/Compiler.java#L1341 Regardless of the type hint here, vars are always Objects and it will be a boxed value in the example usage (so not a primitive). However, if marked as a ^:const AND a primitive, the compiler will inline the var in the let with a primitive long and in that case it will be a primitive."
author = "didibus"
year_published = 2023
