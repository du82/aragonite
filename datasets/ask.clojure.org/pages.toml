["https://ask.clojure.org/index.php/13691/hash-map-without-arguments-returns-array-despite-docstring"]
title = "`hash-map` without arguments returns an array map, despite the docstring - Clojure Q&A"
description = "The docstring of `hash-map` states that it returns a hash map. However, there's an arity with ... there's a discrepancy between the docs and the impl."
full_description = '''The docstring of hash-map states that it returns a hash map. However, there's an arity with no arguments that returns an empty array map. The point of confusion here is that "persistent hash map" is the abstraction here, but there are two concrete implementations: hash-map (PersistentHashMap) and array-map (PersistentArrayMap), and the latter changes type to the former based on map size. hash-map is a constructor for the abstraction of persistent hash maps (generic), and makes no promises about the returned concrete type. However array-map IS (explicitly) a constructor for array-maps. There is no constructor function explicitly for PersistentHashMap.'''
author = "Eugene Pakhomov"
year_published = 2024
