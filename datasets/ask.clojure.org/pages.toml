description = "I've been encountering some issues when attempting to load libraries using clojure-clr in .NET  ... . Your assistance and input are much appreciated!"
full_description = '''I've been encountering some issues when attempting to load libraries using clojure-clr in .NET 7 (core.async and clojure.tools.nrepl) With the recent inclusion of NREPL, I was keen to explore its functionality. However, I'm met with an error when I try to require the namespace, stating: "Could not locate clojure/tools/nrepl with extensions .cljr, .cljc, .cljr, .cljr.dll, .cljc.dll, or .clj.dll on load path." It's interesting to note the distinction between the clojure-clr nrepl library and core.async, particularly in comparison to libraries like clojure.test.generative. The latter, for example, is compiled to .NET Standard 2.1 and functions correctly. To aid in addressing this problem, I've created a repository which reproduces the nrepl bug. You can find it here: https://github.com/Dangercoder/clojure-clr-bug-report-1 Furthermore, I believe that resolving the issues with core.async is crucial since it would enable interoperability with https://learn.microsoft.com/en-us/dotnet/api/system.threading.tasks.task?view=net-7.0. This feature is prevalent throughout the .NET environment. Thank you for the very clear example. It was easy to track down. When I added support for .cljr files, I missed a location -- that's what is failing here. (Embedded resource in loaded assembly.)'''
author = "Dangercoder"
year_published = 2023
clearnet = "https://ask.clojure.org/index.php/12954/clojure-clr-nrepl-net-standard-2-1-does-not-work-with-net-7"
