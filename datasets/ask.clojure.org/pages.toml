["https://ask.clojure.org/index.php/13072/feature-request-clojure-specify-conditional-values-local"]
title = "Feature request for Clojure CLI: Some way to specify OS-conditional values for :local/root in deps.edn - Clojure Q&A"
description = "This problem arose trying to run a Clojure project on WSL2 from a project originally built on  ... support any general way to handle this problem.)"
full_description = '''This problem arose trying to run a Clojure project on WSL2 from a project originally built on Windoze. The original :local/root paths started with "C:/..." but on WSL2 (running Ubuntu 22) they need to be converted to "/mnt/c/..." to run. Imagining automatic conversion rules feels dreadful, it would be better if we could simply specify OS-specific values. Maybe something like: At runtime, the correct local-path should be selected for the value based on the OS on which the JVM is running. Surely this can also be a problem on MacOS running Parallels, where file system integration is also tight but the Guest OS can have different values for the same paths on the Host. And knowing what these might be a priori is probably not practical, given the Cambrian explosion of Linux distributions, Windows editions, and MacOS versions. It would be the developer's responsibility to set these values based on a concrete development setup. So, IMHO, it would be enough optionally to offer some ability to provide a map with certain high-level OS options in place of a string. It also seems obvious to me that these values will always be developer-centric and possibly subject to employer devops policies. (Yes, this is my implementation bias, but I would gladly support any general way to handle this problem.) FWIW I would recommend just using relative paths for :local/root. Absolute paths are not necessary and just makes things complicated. In my own setup I have all my projects in ~/code. So ~/code/project and ~/code/some-lib, in deps.edn I just use :local/root "../some-lib" from the project and everything works. Regardless of whether thats executing in WSL/Windows or whatever else. I also have setups where everything is in the same ~/code/project and ~/code/project/packages/some-lib where I again just use :local/root "packages/some-lib" instead of the absolute path.'''
author = "Bob Calco"
year_published = 2023
clearnet = "https://ask.clojure.org/index.php/13072/feature-request-clojure-specify-conditional-values-local"
