title = "Artifacts / SHA256 updated on August 26th - Clojure Q&A"
description = "Hello Clojure community I'm one of the Java buildpacks maintainers and we recently discovered a  ... releases?page=2) where all older releases ("
full_description = "I'm one of the Java buildpacks maintainers and we recently discovered a discrepancy in the releases for this repository: https://github.com/clojure/brew-install/ The issue is that releases artifacts seem to have been republished / repushed after their initial release, effectively overwriting tags and artifacts attached to it; but since the paketo buildpack for clojure rely on SHA256 signatures to make sure the archive is the one that we expected, it basically broke them. We believe the user named puredanger has mass-overwritten Github releases, potentially changing content of the published releases, on August 26th; the reason to think this is to look at this releases page where all older releases (<1360) were updated We just wanted to make sure this issue was known and, if possible, would not happen frequently since it can break downstream redistribution channels, such as Paketo buildpacks. (we just updated and released to one of the latest clojure release, but users set on older versions could be impacted) Yes, I did this on a handful of old releases to relocate some traffic from old (download.clojure.org) to new (github) download locations. No plans to do any more."
