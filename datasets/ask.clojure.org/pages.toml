full_description = "The ClojureCLR version of io/as-file returns a FileInfo object, which can only represent a file (and not a directory as those are represented by the DirectoryInfo class). JVM CLojure OTOH returns a File object, which can represent both. This leads to different outcomes in evaluation: Suggested fix would be to return a FileSystemInfo object, which is the parent class of both FileInfo and DirectoryInfo, and as such is capable of representing both, similar to the Java File class."
