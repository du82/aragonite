title = "clojure.tools.reader.edn/read can cause incorrect column number for token at end of input - Clojure Q&A"
description = "**Context** A user reported that [rewrite-clj column number metadata can be incorrect for a  ... src/main/clojure/clojure/tools/reader/edn.clj#L54-L63"
full_description = "Context A user reported that rewrite-clj column number metadata can be incorrect for a token at the end of input. Rewrite-clj uses clojure.tools/reader to read clojure source. It uses clojure.tools.reader.reader-types/get-column-number to discover the current column offset. Symptom When the element at end of input is a token, after it is read, the column number is one less than it should be. Notice after :bip we see the correct :col-number 5, but after :bop we see the incorrect :col-number 9; it should be :col-number 10. Next Steps Happy to contribute a patch if the above makes sense to you and you think it is worthwhile to fix."
author = "Lee Read"
