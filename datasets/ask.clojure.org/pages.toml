["https://ask.clojure.org/index.php/10380/when-to-use-simple-qualified-keywords"]
title = "When to use simple/qualified keywords? - Clojure Q&A"
description = 'Is there any "official" guidance on this? Clojure.spec uses both: (s/def ::foo (s ... -log.clojureverse.org/clojure/2021-03-26/1616759029.465400'
full_description = "The current usecase I'm wondering about is an internal API I'm working on. It is pretty clear that top-level keys in the api response benefit from being qualified. How about keywords in value positions? Spec's guidance on this can be best found at https://clojure.org/about/spec#_global_namespaced_names_are_more_important - spec strongly encourages the use of qualified attribute spec names as map keys when the data is likely to be shared with others, or composed with data from other libraries or sources. However, this is not the only concern - we are also concerned about readability, write-ability, etc. In some cases, an attribute (or a value) may only exist in a context, such that qualification is not necessary and can be inferred from the container. In the example above, I'm not sure there is a ton of value in qualifying the value - it will presumably only be set/compared in the context of its attribute, which is qualified."
author = "Imre Kószó"
year_published = 2021
