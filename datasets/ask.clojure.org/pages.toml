["https://ask.clojure.org/index.php/2385/clojure-functions-reified-objects-identify-proper-clojure"]
title = "Clojure functions and reified objects should expose a public static field to identify their proper Clojure name - Clojure Q&A"
description = "There are several examples of frameworks that attempt to de-mangle a Java class name into ... and unambiguously identify what purpose the class plays."
full_description = "There are several examples of frameworks that attempt to de-mangle a Java class name into a Clojure symbol (including namespace); this is useful for writing out an improved, Clojure-specific stack trace when reporting exceptions. Existing libraries are based on regular expression matching and guesswork, and can occasionally give incorrect results, such as when a namespace or function name actually contains an underscore. It would be helpful for authors of such frameworks if Clojure would expose a static final field on such classes with the proper name that should appear in the stack trace; libraries would then be able to use reflection to access the proper name of the field, without the current guesswork. Other Clojure class constructs beyond functions, such as reified types and protocol implementations, would also benefit, though it is less obvious what exact string value would properly and unambiguously identify what purpose the class plays. FYI, there is a patch on the way in for 1.6 that contains a new demunge function in Compiler. However, the munged name is not always reversible so having the original around is a good idea. Howard, there seems to be some overlap in the intent between this ticket and CLJ-1278. I guess either of them could be done without the other, but wanted to check. I welcome any input on how this should really work. In particular, any ideas on how to best deal with {{defn}}s that are not top-level forms. Patch CLJ-1284-store-demunged-names.patch dated Aug 20 2014 does not apply cleanly to latest master after some commits were made to Clojure on Aug 29, 2014. I have not checked whether it applied cleanly before that day, nor have I checked how easy or difficult it might be to update this patch."
author = "jira"
year_published = 2013
clearnet = "https://ask.clojure.org/index.php/2385/clojure-functions-reified-objects-identify-proper-clojure"
