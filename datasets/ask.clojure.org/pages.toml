["https://ask.clojure.org/index.php/14345/namespace-remove-remove-outgoing-dependencies-dependents"]
title = "tools.namespace remove-node does not remove outgoing dependencies from :dependents - Clojure Q&A"
description = "## Problem I noticed that when a dependency, `example.one`, was removed from another  ... I misunderstanding the intended behavior of this function?"
full_description = '''I noticed that when a dependency, example.one, was removed from another namespace, example.two, example.one still showed up under [::track/deps :dependents 'example.two] in the tracker after an invocation of repl/scan. After digging into this for some time, I saw that the implementation of remove-node in MapDependencyGraph didn't make any changes to the :dependents attribute. Removes the node from the dependency graph without removing it as a dependency of other nodes. That is, removes all outgoing edges from node. This removes outgoing edges from dependencies, but if dependents is effectively an inverse of dependencies, then I'd expect to see some sort of removal from dependents as well. Instead, dependents remains unmodified. If this is indeed a bug, and not a misunderstanding on my part, I have a fix here along with a couple tests on my behavioral-tests branch that removes node from values in the dependents map. Does this align with the expected behavior of remove-node, or am I misunderstanding the intended behavior of this function? I don't actually know the original intent but the docstring you quote says "without removing it as a dependency of other nodes" which sounds like what it does?'''
