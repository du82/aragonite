["https://ask.clojure.org/index.php/12942/feedback-on-the-new-clojure-java-process-namespace"]
title = "Feedback on the new clojure.java.process namespace - Clojure Q&A"
description = "The newest Clojure alpha added a clojure.java.process namespace. I had a  ... /src/clj/clojure/java/process.clj#L75)"
full_description = '''The newest Clojure alpha added a clojure.java.process namespace. I had a need for better process spawning handling in a Clojure program I'm working on, so I investigated if it makes sense to update my Clojure dependency to 1.12.0-alpha2, and I want to give you feedback on functionality and bugs I encountered when evaluating this namespace. Error stream -> stdout redirection does not work When supplying :err :stdout opt, the launched process does not redirect the output to stdout, because (.redirectErrorStream pb) on line 89 is a getter. It should be (.redirectErrorStream pb true) instead. You can test it with (exec {:out :inherit :err :stdout} "bash" "-c" "ls >&2") There is no way to remove env vars Removing env vars is a useful feature when launching the process, and it's even documented in an example in ProcessBuilder's Javadoc. I suggest adding support for the removal of env vars by treating nil env values as a request to remove the env var from the launched process env. It's impossible to override exec's :err :inherit option Exec documentation states that it's possible to override exec's default options, but on line 137 the default options take precedence over user-supplied options, it should be (merge {:err :inherit} opts) instead. Capture kv-opt is :buffer-size, not :buffer On line 119, capture docstring says that its kv-opts are the same as in jio/copy — :buffer and :encoding, but jio/copy's kv-opts are :buffer-size and :encoding. Nitpick: checks for the truthiness of in/out/err/dir are unnecessary Lines 85-90 perform checks if the opts exist, which is unnecessary because defaults are provided on line 75'''
author = "vlaaad"
year_published = 2023
