["https://ask.clojure.org/index.php/7164/sub-entries-with-the-same-name-cant-be-selected"]
title = "Sub Entries with the same Name can't be selected - Clojure Q&A"
description = 'I want to select the content of an XML element named "Group" which itself is in an element named " ... . 1 failures, 0 errors. Tests failed. ```'
full_description = '''I want to select the content of an XML element named "Group" which itself is in an element named "Group" using xml-zip/xml1. Instead of returning the content of the inner "Group" the outer "Group" element matches. The approach of how to select this does not work and I suspect this might be a defect. FAIL in (parsing-group-elements) (core_test.clj:34) selecting the name of inner expected: (= "Inner" (zip-xml/xml1-> root :Root :Group :Group :Name zip-xml/text)) actual: (not (= "Inner" "Outer")) It seems the first expression in {{tag=}} matching the element itself in the {{or}} expression is the problem in my case. I suspect it can be used to select the root element. Is there any other need for it? Commit that changed behaviour is https://github.com/clojure/data.zip/commit/c5d6ca25c128f9fe937b11505c7c9736cfa2dd9a (deftest same-nested-tags (is (= "1" (xml1-> nestedxml :area :area text))) (is (= "033" (xml1-> nestedxml :area :unit text)))) ` For what is worth, I've just been hit by this regression too. I hope a proper fix can be released soon! Thanks in advance. My example does not work with 0.1.1 either, I doubt it is just a regression. @Denis Shilov maybe you want to create another ticket for this. This worked for us with 0.2.0-alpha2 when copying the latest implementation of {{tag=}} without the {{or}} part as Benjamin Peter suggested. I'm not sure what the best fix is here seems tricky to accommodate the previous patch to allow it to match the root, clearly matching descendants it is more frequent case so perhaps a {{root=}} predicate is preferred over introducing something like {{descendant=}} through all the xml-> matchers. Of course if there's some fix to {{tag=}} which can support both that I'm not seeing that would be best but seems tricky. Ran into the same thing just today. Posted this (https://stackoverflow.com/questions/46535423/cant-access-deeply-nested-xml-with-clojure-data-zip-xml) a bit ago, but now that I've found this I know I'm not alone/crazy. @bpeter thanks for the workaround. Does anyone know if fixing this is making it into 0.1.2/is there anything I can do to help make that happen?'''
