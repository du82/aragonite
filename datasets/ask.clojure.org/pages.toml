title = "Request to find and eliminate virtual thread pinning - Clojure Q&A"
description = "Asking this here because I can't post to https://clojure.atlassian.net/jira/software/c/ ... , since virtual threads are extremely useful. Thanks!"
full_description = "Asking this here because I can't post to https://clojure.atlassian.net/jira/software/c/projects/CLJ/issues/CLJ-2771. https://github.com/clojure/clojure/blob/4090f405466ea90bbaf3addbe41f0a6acb164dbb/src/jvm/clojure/lang/Delay.java#L35 This took significant engineering effort and sanity to debug, as -Djdk.tracePinnedThreads reported precisely nothing. As it stands, we're needing to reimplement a virtual-thread-friendly (non-synchronized) clojure.core/delay, and as many clojure.core functions as we need to ensure virtual threads don't get pinned. As always, I'm amazed by the Clojure team's work! Just wanted to highlight the virtual-thread-unfriendliness of some of its API and get it prioritized if possible, since virtual threads are extremely useful. Clojure 1.12.0-alpha5 is now available and modifies lazy-seq and delay to use locks instead of synchronized. Thanks, definitely interested in preparing Clojure for virtual threads. I'm curious what you had in your delay?"
