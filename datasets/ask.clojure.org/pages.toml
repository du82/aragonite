["https://ask.clojure.org/index.php/12235/can-alias-already-exists-in-namespace-be-fixed"]
title = 'Can: "Alias already exists in namespace" be fixed? - Clojure Q&A'
description = "When defining a namespace alias in an `ns` form, and then later changing the namespace that alias  ...  vars, why can't we redefine namespace aliases?"
full_description = "When defining a namespace alias in an ns form, and then later changing the namespace that alias refers to, you get an error: That's a pretty gnarly sharp edge. Many people won't find a better solution than restarting their REPLs. Experienced Clojure developers will tell you to do and re-evaluate the ns form, but that's a pretty silly workaround. The right thing to do would be to drop the old alias and pick up the new one. You'd (I supposed) still have to re-evaluate the code that uses the alias before it gets picked up, but that's fairly consistent with Clojure's mental model IMO. It's a mischaracterization to say that use of ns-unalias in this case is silly -- it handles exactly the issue that you describe and does so in a way that's congruent with the value proposition of using a Lisp. A guarantee that Clojure attempts to provide is the stability of references. The behavior of Vars is a good example since you mentioned it as a motivating case. When you eval something like (def x 42) a mapping is created in the current namespace of x->#'myns.x with a root binding of 42. However, if the then eval (def x 108) then the mapping to the same Var instance as before remains in place but with a new root binding of 108. The reference remained stable despite a redefinition. An alias is an indirection to Var context and the intent to maintain stability is a motivating factor for disallowing auto-realiasing. Instead, Clojure provides a mechanism via ns-unalias that allows users to opt-in to breaking that guarantee. All of that said, I do think that it's reasonable to fix the error message such that it recommends the use of ns-unalias much like the error related to changing ns mappings recommends the use of ns-unmap. I logged this as https://clojure.atlassian.net/browse/CLJ-2727. It needs a bit more thought, but I think this could be done. Just for the sake of documentation, another workaround is to use clojure.tools.namespace.repl/refresh #_(-all). I agree that allowing ns alias redefintion (with a warning to stop me shooting myself in my foot) would be a good enhancment."
author = "Arne Brasseur"
year_published = 2022
clearnet = "https://ask.clojure.org/index.php/12235/can-alias-already-exists-in-namespace-be-fixed"
