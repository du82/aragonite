description = 'Hello, I am trying to read and output the data from a device connected to my desktop using "/dev/input ... data as it comes in? What am I doing wrong?'
full_description = '''Hello, I am trying to read and output the data from a device connected to my desktop using "/dev/input/js0" (a ps4 controller). I would like to display the data as it is coming in, like how cat /dev/input/js0 does. When I use the cat /dev/input/js0 command I can see the output immediately as I click buttons on my controller, which is what I wish to do. I've found the issue. It is the use of print which does not automatically flush the output. Once I switched to using println, which flushes the output, I was able to print the data out as it came. clojure.java.io/input-stream by default returns a java.io.BufferedInputStream so it's possible that is causing the delay in seeing your input.'''
