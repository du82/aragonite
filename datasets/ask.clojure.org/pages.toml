title = "How to use the AWS S3 Java API v2 `S3Configuration`? - Clojure Q&A"
description = "I want to turn this Java code into Clojure S3Client.builder() .serviceConfiguration(S3Configuration.builder( ...  what is the point of this Construct?"
full_description = '''Maybe someone can point me into the right direction, or has already used this specific part of the API. And can someone tell me why, is an API design like this advantageous for Java Developers, what is the point of this Construct? Given the Java code, the .build() method on the third line must also return an instance of Consumer. So there's no need to reify anything, you should be able to use this: This pattern, where you create a builder, call a bunch of configuration methods on it, and then call .build to get the final object that you actually need, is called a... "builder". :) In the OOP world, it's quite helpful when you want to ensure encapsulation and that there are no partially built objects. It can also help in cases where you need to have multiple different builder using the same interface that behave differently. Or in cases where you have to separate creation of an object across different contexts.'''
