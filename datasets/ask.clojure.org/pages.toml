["https://ask.clojure.org/index.php/13974/deadlock-with-clojure-java-shell-sh"]
title = "Deadlock with clojure.java.shell/sh - Clojure Q&A"
description = "The `clojure.java.shell/sh` function has this construct at the end: (with-open [stdout (. ...  smart to do some sort of mitigation for this."
full_description = '''So the outputs of a process are read in two futures, while the current thread awaits for process to end (and generate exit code). If an exception happens during an execution of a future, that exception is stored and thrown (wrapped in ExecutionException), when futures are derefed (in this case this is after process ends). I've had a case where I was calling git with sh and the generated output was large enough to produce OutOfMemoryError. And here's where you get a "deadlock" (it's not one technically). This can happen with any type of exception during one of those 2 future's reads. Another realistic scenario would be if I specify an encoding and underlying process returns some bytes that cannot be parsed in that encoding. This "bug" was quite frustrating because there is no error message and very little indication of what is wrong. In my case it happened sporadically in production and it was quite hard to track down.'''
author = "Rok Lenarčič"
year_published = 2024
