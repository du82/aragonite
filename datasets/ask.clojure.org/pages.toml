full_description = "Clojure (get {:x (reduced 10)} :x) => #object[clojure.lang.Reduced 0x28494b99 {:status :ready, :val 10}] (get-in {:x (reduced 10)} [:x]) => #object[clojure.lang.Reduced 0x28494b99 {:status :ready, :val 10}] Clojurescript (get {:x (reduced 10)} :x) => #object[cljs.core.Reduced] ; Same behavior as Clojure (get-in {:x (reduced 10)} [:x]) => 10 The CLJS implementation of get-in uses reduce in the default case which means that when the reduced object is found in look-up it's unwrapped by the reduce logic. If this is causing error then a temporary work-around would be to provide a not-found value to get-in which will use the same logic as Clojure. I think a ticket to the CLJS team to address this would be a reasonable ask."
