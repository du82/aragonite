description = "Maybe there's a good reason why it doesn't, but it seems to me it would be great  ... /9167/infer-hint-from-return-type-hint-function-call-initializes"
full_description = "Maybe there’s a good reason why it doesn’t, but it seems to me it would be great if def would automatically infer type hint: Related jira: https://clojure.atlassian.net/browse/CLJ-2851 Related question: https://ask.clojure.org/index.php/9167/infer-hint-from-return-type-hint-function-call-initializes the last time I recall some discussion about this, I think rhickey rejected it because vars are mutable and type hints effect compilation, so if if you type hint a var as some type X later code will be compiled to depend on it, and won't be recompiled if you change the hinted type (which would be more likely to happen if the hint was automatic). so hints on vars are opt in not opt out."
