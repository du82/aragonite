["https://ask.clojure.org/index.php/4270/avoid-compile-static-initialization-classes-inheritance"]
title = "Avoid compile-time static initialization of classes when using inheritance - Clojure Q&A"
description = "I'm working on a project using Clojure and RoboVM. We use AOT compilation to compile Clojure  ... /objc/src/main/java/org/robovm/objc/ObjCObject.java"
full_description = '''I'm working on a project using Clojure and RoboVM. We use AOT compilation to compile Clojure to JVM classes, and then use RoboVM to compile the JVM classes to native code. In our Clojure code, we call Java APIs provided by RoboVM, which wrap the native iOS APIs. But we've found an issue with inheritance and class-level static initialization code. Many iOS APIs require inheriting from a base object and then overriding certain methods. Currently, Clojure runs a superclass's static initialization code at compile time, whether using ":gen-class" or "proxy" to create the subclass. However, RoboVM's base "ObjCObject" class (link: 1), which most iOS-specific classes inherit from, requires the iOS runtime to initialize, and throws an error at compile time since the code isn't running on a device. CLJ-1315 addressed a similar issue by modifying "import" to load classes without running static initialization code. I've written my own patch which extends this behavior to work in ":gen-class" and "proxy" as well. The unit tests pass, and we're using this code successfully in our iOS app. Here's some sample code that can be used to demonstrate the current behavior (Full demo project at (link: https://github.com/figly/clojure-static-initialization)): (ns clojure-static-initialization.gen-class-demo (:gen-class :extends clojure_static_initialization.Demo)) (link: 1) https://github.com/robovm/robovm/blob/master/objc/src/main/java/org/robovm/objc/ObjCObject.java Just a few lines of Java (a class with static initializer that printed) and Clojure code (for gen-class and proxy extending it) here in the test description that could be used to demonstrate the problem. Should not have any dependency on iOS or other external dependencies. I'm affected by this bug too. A function in a namespace calls a static Java variable which is initialized in place. Another namespace which is genclassed calls that function. Now at compile time, the static java is initialized and it makes building fail, because that static java initialization needs resources which don't exist on the build machine.'''
author = "jira"
year_published = 2015
year_updated = 2020
clearnet = "https://ask.clojure.org/index.php/4270/avoid-compile-static-initialization-classes-inheritance"
