full_description = '''i have two Leiningen project that compiles well, and worked well before sharing some functions in a common included file. Both project runs on a tomcat server First project create a .jar file used as a library for java code compiled from java source. it has been created with: lein new eu.oca.jclojure and compile this way: lein uberjar The other project is a full clojure web application running also on tomcat. it has been created with: (load-file "src/sidonie_admin2/sidonie-common.clj") in the second project and in the first like this (and both compile without errors) (load-file "../sidonie-admin2/src/sidonie_admin2/sidonie-common.clj") the problem come of the file having common definitions that is not included in the war file and probably not in the jar file and i have this error when running one project: java.io.FileNotFoundException: ../sidonie-admin2/src/sidonie_admin2/sidonie-common.clj and this error with other project: Caused by: java.io.FileNotFoundException: src/sidonie_admin2/sidonie-common.clj (Aucun fichier ou dossier de ce type) those are same type of error complaining about missing source file in JVM byte code ! a bit surprising ,i admit in case of error print stack trace needs some info to give line number of error. 08-Oct-2019 12:40:51.275 SEVERE [http-nio-127.0.0.1-8080-exec-8] org.apache.catalina.core.StandardWrapperValve.invoke Servlet.service() for servlet [eu.oca.ApplicationConfig] in context with path [/Sidonie] threw exception [org.glassfish.jersey.server.ContainerException: java.lang.ExceptionInInitializerError] with root cause java.io.FileNotFoundException: ../sidonie-admin2/src/sidonie_admin2/sidonie-common.clj (Aucun fichier ou dossier de ce type) 08-Oct-2019 12:21:42.761 SEVERE [http-nio-127.0.0.1-8080-exec-11] org.apache.catalina.core.StandardContext.listenerStart Exception lors de l'envoi de l'évènement contexte initialisé (context initialized) à l'instance de classe d'écoute (listener) sidonie_admin2.listener Synta