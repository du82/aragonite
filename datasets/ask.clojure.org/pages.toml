["https://ask.clojure.org/index.php/13539/classcastexception-when-misplacing-nth-args"]
title = "`ClassCastException` when misplacing `nth` args - Clojure Q&A"
description = "I accidentally misplaced the args to `nth` and was presented with the following error and stacktrace:  ...  in module java.base of loader 'bootstrap')"
full_description = '''I was having a hard time spotting the problem, as I was changing a few things at once. Ultimately I realized that I've misplaced the collection and the index arguments to nth, but the stacktrace did little to help me realize that: there is no mention of call to nth there, and the line numbers are not pointing exactly to the problematic line. The complete example code here: https://github.com/a1exsh/advent-of-clerk/blob/cddd42fcd60da2efcda37f222666328cd37fb616/src/advent_of_clerk/year_2023/day_04.clj#L84 (this is the correct code — to get the error swap the arguments like this: (nth i untouched)) The environment where I was hitting this is evaluating the single loop form in CIDER (Emacs) with C-x C-e. Not really an answer but more of a long note. And yeah, I agree that it would be helpful if line numbers were exact and the actual problematic form or at least the function name was printed. Somewhat ironic - I can't start your project as the README describes because Clerk gives me Unhandled java.util.concurrent.RejectedExecutionException without any useful details. But no matter, I just used a regular REPL. The top error that you see uses an "exception prettifier" that often makes things harder to figure out, so I would recommend ditching it. IMO it's not that much help that it formats an exception in this particular way and elides some not-so-useful frames, and it's definitely unhelpful that it elides useful things. A full exception has this line: Syntax error macroexpanding at (day_04.clj:79:3). It's not much, and the reported line is "close enough" and not exact, but it's a detail that might've helped you with figuring things out. In this case, the only form anywhere near close to that line that works with both a vector and a number is (nth ...), and the error talks about macroexpanding because nth has :inline metadata.'''
author = "a1exsh"
year_published = 2023
clearnet = "https://ask.clojure.org/index.php/13539/classcastexception-when-misplacing-nth-args"
