["https://ask.clojure.org/index.php/13990/wrong-implementation-iblockingderef-clojure-process-start"]
title = "Wrong implementation of IBlockingDeref for clojure.java.process/start - Clojure Q&A"
description = "The `IBlockingDeref` for the reification in clojure.java.process/start is not ... /src/clj/clojure/java/process.clj#L113"
full_description = "The IBlockingDeref for the reification in clojure.java.process/start is not implemented according to specification in deref doc-string. The 3-arity IBlockingDeref expects timeout in milliseconds, and that the third argument is a timeout-val. The implementation in clojure.java.process (line 113, linked below) wrongly expects the two arguments to be a timeout with its unit specified in last argument as a java.util.concurrent.TimeUnit. When given some j.u.c.TimeUnit as timeout-val, it will still return nil after the timeout. Expected: That this implementation of IBlockingDeref always assumes the timeunit to be hardcoded as TimeUnit/MILLISECONDS, and that the given timeout-val is returned if the deref to IBlockingDeref times out. Thanks! Logged as https://clojure.atlassian.net/browse/CLJ-2865 - we will get that fixed before 1.12 release."
author = "Linus Ericsson"
