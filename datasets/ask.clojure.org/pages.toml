description = "Java version : openjdk 18.0.2-ea 2022-07-19 OpenJDK Runtime Environment ( ... execution-error-sqlexception-at-java-sql-drivermanager-getconnection"
full_description = '''It's asked in Clojure: Execution error (SQLException) at java.sql.DriverManager/getConnection (DriverManager.java:702) and already have answered, but the only answer in there is using :deps or deps.edn (as far i know, this is Maven repository), so how about leiningen? Or did i miss something about leiningen and Maven? And i even restarting my pc, text editor, and nREPL but nothing change. You're using the old clojure.java.jdbc format of db-spec hash map instead of the (simpler) next.jdbc format. You want to remove :classname, :subprotocol, and :subname and use :dbtype "postgresql" :dbname "reporting" instead. That simpler format works with clojure.java.jdbc too -- and is the recommended approach there too. The format you are using is really a legacy format that hasn't been recommended for a while.'''
