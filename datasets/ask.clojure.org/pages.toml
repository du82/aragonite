title = "ClojureScript and the deprecation of Google Closure Library - Clojure Q&A"
description = "Google [announced recently](https://github.com/google/closure-library/issues/1214) that they  ...  impact ClojureScript in any meaningful way? Thanks!"
full_description = "ClojureScript itself is not affected. It uses very little of the library itself, which could easily be replaced if needed. However, what might be affected is Projects/Libraries that use other things the Closure Library provides. While these things aren't going anywhere, they'll also receive no further updates. Given how mature and stable most of the things are that is fine, but may warrant starting to look for alternatives. Given that there are very few things making actual use of goog.* stuff I'd say there is no meaningful impact to worry about. See David Nolen's update here in the latest ClojureScript release: https://clojurescript.org/news/2024-01-24-release"
