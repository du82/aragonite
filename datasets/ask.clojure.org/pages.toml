["https://ask.clojure.org/index.php/2817/lighter-weight-aliasing-for-keywords"]
title = "Lighter-weight aliasing for keywords - Clojure Q&A"
description = "It is useful to make qualified keywords, and particularly so with spec. Using namespace aliases ... lighter-weight aliasing for keywords. Details TBD."
full_description = "It is useful to make qualified keywords, and particularly so with spec. Using namespace aliases helps a lot in working with a lot of qualified keywords. However, currently creating an aliased namespace requires that the namespace actually exists. This ticket is a placeholder to do something more with lighter-weight aliasing for keywords. Details TBD. The rationale in my predecessor ticket, CLJ-2030, was to create a construct to allow for auto-aliasing in .cljc files, which I would like to submit as a requirement. The obvious place for cljs to declare an auto-alias is the ns clause. So if we don't want to grow alias for that use case, I would propose to grow the ns clause with a declaration for keyword - aliases. Let's give it a working title of (:kwns-alias ..) for this comment. One open question is, how :kwns-alias should interact with alias. i.e. whether the namespace of ::qualified/keyword should always expand to the same as the one of a qualified/symbol or if they should be allowed to differ. I'd argue they should always be the same, because of the rule of simplicity. That means, that - alias will need to check if the sym is already in :kwns-alias and throw, if so - :kwns-alias will need to also work on `qualified/keywords probably shouldn't have knws in its name any more I think adding anything to ns is likely off the table, but until I learn more about what Rich has in mind, I can't really suggest anything more. In any case, I'll be very interested in Rich's idea to do this outside of the ns clause and still have it fit well with clojurescript (or even clojure, for that matter, ...) Do you have any rationale, why growing ns for this is a bad idea? Since ns is essential to how a namespace is set up in clojure, I'd imagine a fix for that problem (of ns doing too much) to imply some rather drastic changes to the state of the art. As we won't break ns, I'd imagine either some sort of ns2 or a way to do namespace setup outside of the ns clause. I'm curious either way."
author = "jira"
year_published = 2021
clearnet = "https://ask.clojure.org/index.php/2817/lighter-weight-aliasing-for-keywords"
