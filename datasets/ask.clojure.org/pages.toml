full_description = '''Docs for the handy new stream interop functions (stream-seq!, stream-into! etc) say they "are terminal stream operations (they consume the stream)." I ask because I use these functions with the stream returned from java.nio.file.Files/list and when I'm benchmarking the app I sometimes get "too many open files" Java errors. I can't think where else I might conceivably be leaving a file handle open, beyond that I'm almost entirely just using slurp (for now at least). (Naively, I would expect everything except stream-seq! to close out the stream by the time it returns, and stream-seq! I would expect to close once the seq is consumed and/or garbage collected) Should they? maybe, will discuss but for now you should close the stream yourself (with-open is a good use here).'''
