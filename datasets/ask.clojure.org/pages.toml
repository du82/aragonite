full_description = '''I was trying to build ClojureCLR on Arch Linux but I was getting (link: http://sprunge.us/MVUX text: this error) with both MonoDevelop and xbuild (following the directions (link: https://github.com/clojure/clojure-clr/wiki/Developing-ClojureCLR#building text: here)). The attached patch fixes the problem and it works out of the box with MonoDevelop, but it requires an extra step to download the dependencies via NuGet when using xbuild: nuget restore Clojure/ClojureCLR.sln xbuild Clojure/build.proj /target:Dist /p:Configuration="Release 4.0" /p:Platform="Any CPU" /p:Runtime="Mono" ` I didn't have a chance to test it on Windows but I think it should work with a recent (>2.7) version of NuGet. I just tested on Mac OSX, the same nuget/xbuild commands work fine. On Windows, Vistual Studio 2015 seems to be working fine as well.'''
