full_description = "Native support for BigInt in JavaScript has been around since 2020. (https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/BigInt) Would be nice to be able to use this as a number in numeric ops and as a key in hash maps. Also, cljs.core could be extended with functions like bigint and integer? from clojure.core. Supporting them as keys in hash maps should be fairly straightforward. Supporting them in numeric ops is more challenging as big integers and JavaScript double values cannot be used together which is a big departure from Clojure's numeric tower. Some experimental work has been done to assess but it will take more thought."
