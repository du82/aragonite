["https://ask.clojure.org/index.php/11575/built-clojurescript-functions-which-results-things-minified"]
title = "Built-in ClojureScript functions lose `^js` tags which results in wrong things being minified - Clojure Q&A"
description = "This started as a discussion with David Nolen on Slack at https://clojurians.slack.com/archives/C07UQ678E/ ... ` tag is used on a JS object/array."
full_description = '''This started as a discussion with David Nolen on Slack at https://clojurians.slack.com/archives/C07UQ678E/p1644422895167709 It seems to be a common pattern nowadays to rely on JS interop syntax along with ^js at places where the compiler warns the user with "Cannot infer target type". At the same time, it doesn't seem to be uncommon to use built-in CLJS functions and macros like first, seq, when-first, etc. on JS objects and arrays - after all, the support for them is explicitly there. This leads to a problem that makes it incredibly easy to introduce issues to an optimized build that are impossible to guard against, unless you put ^js everywhere you do JS interop. This case above is problematic because the compiler doesn't warn you if you omit the ^js in front of the track binding. But without that tag, names of all the functions called on track will be minified. One potential solution to this is to introduce an opt-in warning when a CLJS function that doesn't preserve the ^js tag is used on a JS object/array.'''
author = "Eugene Pakhomov"
year_published = 2022
