full_description = "It is useful to add custom behavior for program entry points. Examples of such behavior: - calling (shutdown-agents) to ensure graceful shutdown; - calling (Platform/exit) for JavaFX applications to ensure graceful shutdown; - rebinding System/out and System/err in test runners to collect all output. One property of these behaviors is that they might be very useful for entry points, but they affect JVM in such a way that these programs might be impossible to integrate into longer-running programs. The situation with -X-invokable functions is where this property is problematic because these are supposed to be invokable both as an entry point and as a part of a longer-running program called by the user of the dependency, but there is no way to tell those apart from inside the function."
