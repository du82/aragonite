full_description = "Clojure-1.12 added a clojure.java.process namespace. I'm confused about why clojure.java.process/capture is exposed as a public API, since it does basically the same thing as slurp except for minor differences in options. It is a good question, and capture started life doing more things, which have slowly stripped away such that it's now mostly the same as slurp. Trimming output is something I have constantly found myself doing in parsing the output of shell calls, but maybe having it in capture (which could really be slurp) is not right. I think there is still one more round of adjustments we're going to need to make in this area."
