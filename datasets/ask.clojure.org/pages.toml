["https://ask.clojure.org/index.php/14169/fn-and-multimethods"]
title = "fn? and multimethods - Clojure Q&A"
description = 'The docstring for `clojure.core/fn?` says "Returns true if x implements  ... /blob/111cd4aa21ee23552742701bfe52e593b65fb0f8/src/such/types.clj#L30-L33'
full_description = '''The docstring for clojure.core/fn? says "Returns true if x implements Fn, i.e. is an object created via fn.", defined in this commit from 2008. Multimethods semantically act as functions. They're not collections (maps), they're not pieces of data that work like functions for ease (keywords), they're procedures with behavior and input and output. Protocol methods semantically act like functions as well. However, multimethods don't respond to fn? because they don't implement clojure.lang.Fn, they implement clojure.lang.AFn, whereas protocol methods do respond to fn? because they are created with fn* in the defprotocol macro. This has led to confusion in my code where I have a sequence of function-like objects and in certain cases I want to select only the "semantically function" objects. It has forced me to write fn+? which is implemented as (or (fn? x) (instance? clojure.lang.MultiFn x)). Now, having written it, it works fine and my immediate problem is solved. However, I think this points to an underlying semantic mismatch between multimethods and their implementation.'''
author = "Noah"
year_published = 2024
clearnet = "https://ask.clojure.org/index.php/14169/fn-and-multimethods"
