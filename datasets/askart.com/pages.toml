["https://askart.com/Price_Artwork.aspx"]
title = "What's My Art Worth: Price Art"
description = "askART pricing artwork page.  Here we explain some of the fundamentals of pricing art.   What's my art worth?  Am I paying the right prices?"
full_description = "Art auction prices, upcoming auction alerts, sales analysis tools, signatures, artist research and more ... If there are auction records, you may wish to compare your own artwork to those works with estimates and/or sale prices. This will require a one-day or longer subscription (please click here for information). If you are certain you have an original oil, watercolor, or sculpture - or a signed and/or numbered work by the artist, proceed with the other valuation questions. If you are unsure, we suggest you let a local frame shop or art gallery help you determine if you have an original work versus a reproduction. (Prints, photographs, and reproductions are mediums where we regret we are unable to help with valuation). Look for a legible signature or notation on the artwork, including the back, and also on the bottom if it is a sculpture. If you are unable to determine the artist’s name, you might provide photos (or jpgs) to dealers and auction houses (not museums) carrying similar works. The size of an artwork is very often a factor in its value. In addition, some artists are especially known for certain subject matter. If an artwork contains quintessential details, it may be more valuable. The year the work was painted is relevant as well, as many artists have their 'peak' most valuable periods. In addition to looking for notation of a signature on the work, it is important to note any markings identifying the foundry, and the edition number of the work. All else equal, a sculpture will likely be more valuable if it is one of only 6 cast, as opposed to being one of 600. The condition of your artwork will make a significant difference to its value. Look for any rips, or signs of in-painting, or over-cleaning. Has the work been relined? Have the colors faded, or is there water damage? Often an ideal situation is when an artwork has never been touched up, even though it might need cleaning badly. You may need advice from a restorer to determine what condition your art is in, especially if it is an older work."
