["https://askart.com/Help_Submit.aspx"]
title = "askART - Help Submit"
description = "askART Help Submit page.  Here we help submit help issues and questions."
full_description = '''askART Updates to Artist Biographies, Images, etc. Submitting Information Contact askART Copyright © 1999-2025 askART.com and underlying auction houses. All Rights Reserved. Digital copying of these images and content strictly prohibited; violators will be subject to the law including the Digital Millennium Copyright Act. Submitting Biographies from Premier Dealers and Museum Professionals Submitting Biographies from Artists, non-Premier Dealers, Art Professionals, Researchers, Family Members, Friends, etc. Artists’ Birth Dates, Death Notices, and Obituaries Suggesting Corrections to askART Content - errata Submitting Artists Not Currently Listed in the Database Sending Images Photographs of Artists Books or Catalogues about Artists Adding Artists to Museum Listings Links to Artist Websites Auction Records You Wish to Contribute for Individual Artists Adding a New Auction House to Our Database Inquiries About Artists and Artwork Contacting askART 1. To Submit Biographies from Premier Dealers and Museum Professionals Dealers and museums may submit bio information directly to askART. Others are welcomed to email or contact us with additional biographical facts. For dealers and museums, "Sign In" to your account and navigate to your list of artists from the My Artists and Ads menu (under My Account). Find (or Add) the artist of interest. Click on "Add a bio" and follow the guidelines on the Submit Artist Bio page. 2. To Submit Biographies from Artists, non-Premier Dealers, Art Professionals, Researchers, Family Members, Friends, etc. We receive valuable biographical information from a broad range of contributors, so we welcome your input. Biographies for our listed artists range from complete to partial, and for some artists we have yet to gather any information. Our goal is to have full biographies for all our artists, and with this endeavor in mind, we welcome your help. We invite you to submit any relevant data to either create a biography where none exists, or build on material already there. It is necessary for us to cite our sources for submitted material, so please give your background on your knowledge about the artist. If you prefer anonymity and are able to provide us with your credentials, we will be happy to accommodate special circumstances. Before sending biographical information, we encourage you to first read The askART Sample Biography for artist Andrew Newell Wyeth (click here). How to Submit an Artist’s Biography to askART The artist biography that you submit will be featured under the heading of your establishment if you are an askART Premier Dealer or a Museum, which in turn, underscores your professional expertise. We encourage a well-organized, comprehensive biography, written in sentence case and conversational style. Just the facts, please. Our editors are trained to delete any hype or advertising verbiage such as “most famous,” “internationally renowned,” and “extraordinarily beautiful works.” Please include in your biography answers to as many of the following questions as possible: 1) Subjects and styles and other distinctive characteristics for which the artist’s work is best known. 2) Formal education and training and other professional influences such as individual artists. 3) Geographical areas of special interest to the artist's career. 4) Art Movements of special influence. 5) Relevant Personal Background such as places lived, family, studio locations, etc. 6) Art Organization Memberships. 7) Special Awards. 8) Museums (name, city, and state) that hold works by the artist in their permanent collections. 9) Required: Sources for the above information and name of person submitting. We appreciate your participation in askART. If you have any questions about submitting biographies, please send them to registrar@askart.com Submit biographies via email or e-mail attachment to registrar@askART.com. In the subject box of the email, please reference the name of the artist. At the top of the biography, please write your name and how you are an authority on this artist. Once our Content Manager receives your information, it will be reviewed and posted if adhering to our guidelines. If we have any questions, we will get back to you via email. 3. Artists’ Birth Dates, Death Notices, and Obituaries We strive to keep our records accurate and current, so please send correct dates if you see an omission or error. Copies of obituaries are welcome because they often provide little known details about the artists’ lives that we may be able to integrate into their biographical information. (Please cite the newspaper.) · This data should be sent to registrar@askart.com. 4. To Suggest Corrections to askART Content - errata “To err is human and to forgive is divine.” If you find an error, be divine, and let us know by sending us an email to registrar@askart.com. We will review the matter and post a correction as soon as possible. 5. Submitting Artists Not Currently Listed in the Database Adding new artists, living and deceased, is very important to our growing database. · If you have any questions about adding or updating artist information in our database click here to contact our registrar. 6. How to Send Images The askART images for each artist are often artworks that have traded through public auction. If you find an artist is lacking an image, we would welcome your sending an example to us as follows: · Images should be in .JPG or .gif format. Maximum file size is 200KB. · Send to images@askART.com. Although we will reference that the work is “An example of this artist's work”, please include in the email as much information as possible such as the title, date of work, medium (oil, watercolor etc.), dimensions (in inches) for our internal documentation. Also include who you are, so we may respond with any questions. · Please send only one image per artist. 7. Photographs of Artists askART is archiving photographs and self-portraits of artists from family members and other reliable sources to be added to the website. You may send them to images@askART.com. Please note for photography, copyright permission must be given by you. 8. Books or Catalogues about Artists This area of the askART site lists resources for additional research about artists, and additions are most welcome. Email alerts will be sent to users who have requested them, so they may know when listings for particular artists are augmented. · Send email to registrar@askart.com with the following completed: Title and Subtitle of the book Author or Authors Date Published Number of Pages in the Book Color Reproductions Yes/No Artist(s) names referenced in this book If a reference includes numerous names, please copy the index, indicate the artists you feel receive significant mention, and contact us. 9. Adding Artists to Museum Listings askART is eager to have accurate museum records noting the permanent collections that represent the artists’ works. If you wish us to add a museum reference to an artist record, · First check the Museum section of that artist’s record to make sure your entry would not be a duplicate. If the museum is not listed in our directory, we will need the Institution’s name, address, phone, email and website addresses. · Send your message to registrar@askart.com with the name of the artist, name of the museum, city and state. It is our policy to contact a museum representative to verify information. 10. Links to Artists’ Web Sites askART may include an artist’s website address as a reference if we receive useful biographical material from that website for use in the artist’s biography. We will give credit to the source and provide the URL for the artist’s site (at this time, without live links). · Please email biographical material and the website address (URL) to registrar@askart.com. 11. Auction Records You Wish to Contribute for Individual Artists askART has recorded the auction transactions for nearly 1,000 major international auction houses, and lists numerous others. This list may be accessed from the askART Auction House Directory. To add an overlooked auction record for auction houses in our directory, please send an email to registrar@askart.com with the following: 1. Auction House 2. Auction Date 3. Artist 4. Lot Number 5. Title of Work 6. Medium 7. Ground 8. Low/high estimate 9. Price realized If we have made an error, we welcome your corrections. Please provide data as specified above. 12. Adding a New Auction House to Our Database If you represent an auction house that is not on our list, but does provide timely pre-sale data, with images and post-sale results for original artworks, please contact registrar@askart.com. 13. Inquiries About Artists and Artwork Not Answered on the Site We regret that we are unable to answer special questions you may have regarding an artist, artwork, appraisal, identification of a signature or artist, or other such queries. We are unable to provide custom research services at this time, but we make every effort to update our site with the most complete and accurate information available. 14. Contacting askART If your questions were not addressed in the text above, please contact registrar@askart.com. (Reminder: askART displays all our available information on the site, and we are not able to provide custom answers to queries or research services at this time.)'''
year_published = 2025
