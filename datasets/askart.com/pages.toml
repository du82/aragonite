["https://askart.com/art/Regional_Interests/8/y/Alaska"]
title = "Regional Essays Alaska: Artist Research"
description = "askART art topics research page: Regional Essays : Alaska:Essay.  Research topics of interest.  askART:  Art auction results + records, artwork prices, appraisers, signatures and artist biographies."
full_description = "Personal challenge, physical and spiritual adventures, encounters with other cultures, the prospect of riches, a desire to build different societies -all of these are reasons artists have looked to Alaska for a new frontier. Unlike the rich tradition of Native art in Alaska, which is thousands of years old, European and American artwork of Alaska has a precise and much more recent starting point. These early works were attempts to understand and describe a new and 'exotic' people and place, to fit them into a more familiar version of the world. Beginning with the Russian voyage led by Danish navigator Vitus Bering in 1741, American, English, French, Spanish, and Russian explorers made more than 100 voyages to Alaska during the 18th and 19th centuries. Although the making of artistic pictures was not a premier motivation for these voyages, virtually all the expeditions included documentary artists in their entourages, to document the discoveries made by captains and their crews. Prior to the Gold Rush, painters confined themselves to coastal settlements. Trained professional artists of some reputation produced the majority of surviving images, but their work was unvaryingly under strict restrictions against any distortion, embellishment, or interpretation. Today, our awareness that artists were directed to depict what they saw with complete and accurate 'realism' makes it even more interesting that interpretive cultural biases are nonetheless evident in their work. For example, explorer art often emphasized exaggerated details such as Native women with bared breasts, or facial tattooing, perhaps to underline the artists' cultural perception of their 'uncivilized' state. Widely associated with the years of early Alaskan exploration is the much published art of John Webber (1751- 1793), the prolific official artist for British Captain James Cook's landmark voyage of discovery from 1776-1780. Official artist Gaspard Duche de Vancy (d. 1788) recorded the French voyage of explorer Jean Francois Galaup de la Perouse, from 1785 to 1788. Louis Choris (1795-1828), who accompanied the Russian voyage of Otto von Kotzebue, between 1815 and 1817, succeeded in conveying reality perhaps more than most of the artists who accompanied explorations in the late 18th and 19th centuries. Choris managed to produce empathetic, insightful images of Alaska's native people, capturing an astonishing variety of details of the material culture, without the stereotyping that is typical of much 'expedition art'."
year_published = 2025
