["https://askart.com/Info_Listing_Services.aspx"]
title = "Auction Listing Services"
description = "askART Listing Services information page.  What are the features and terms of askART Listing Services? askART:  Art auction results + records, artwork prices, appraisers, signatures and artist biographies."
full_description = "Let us help you successfully list your auctions. Feel free to reach us by phone, our contact page or email (at info@askart.com). Also, check out our FAQ below. Posting your upcoming fine art auctions on askART helps you connect your auction to the art world. We are a fine art marketplace and research database covering over 350,000 artists from around the world and have 450,000 “unique” visitors per month, which doesn’t include all of our subscribers. Our database is used by auction houses, collectors, dealers, librarians, curators, educators, appraisers, museums, artists, art aficionados and students, giving your information a wide audience of potential buyers as well as consignors. Let us help you get your upcoming auction in front of them. Our site is all about art auction records! We are happy to list your fine art auction lots and results on askART which includes creating a listing for your company in our Directory of Auction Houses with your auction details. Customers interested in finding upcoming works by their favorite artists can also find your lots listed on the Upcoming at Auction search page. Searching for upcoming lots on individual artist pages is probably the top way that users browse new auction records. Many users subscribe to askART alerts to receive emails notifying them of upcoming artist auctions. Auction lots are also listed by Auction House. Many users view all the lots in a particular auction by browsing them together in sequence. Please keep in mind, consignors take note and appreciate when their lots are posted on askART. Your lots are forever linked to Artist records, which in turn creates a great marketing tool to drive future sales and consignments. First, we ask that you send us the information about your upcoming auction about two weeks prior to the auction. Our staff will then enter all qualifying fine art lots on our site and arrange payment. As soon as your auction goes live on askART alerts will be sent out to interested clients and potential customers. askART was the first one to launch the artist alerts feature over 15 years ago, so we have a huge database of opt-in alert subscribers. Our minimum fee for this service is $50, which covers the posting of 10 auction lots. Additional lots are assessed at $5 per lot up to a maximum amount of $350. In other words, you never pay more than $350 per auction, even if the lot count goes above 70. We require that you submit all qualifying fine art lots for each auction. Once the auction is complete you will submit the results to us within a week for posting."
