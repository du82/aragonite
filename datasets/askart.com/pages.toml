["https://askart.com/art/Groups/1612/y/Barbizon%20School"]
title = "Artist Groups, Schools, Etc. Barbizon, France: Artist Research"
description = "askART art topics research page: Artist Groups, Schools, Etc. : Barbizon, France:Essay.  Research topics of interest.  askART:  Art auction results + records, artwork prices, appraisers, signatures and artist biographies."
full_description = "The term Barbizon refers to a style of plein-air landscape painting that combines elements of Tonalism, Impressionism and The Munich School. Scenes are peaceful in agrarian, bucolic settings, and sometimes have farm animals and/or peasant figures. However, the overall mood is not tranquil because shadows and monochromatic dark colors, blurred features such as trees and streams suggest ongoing sadness or tragedy. In the 1830s a group of French naturalist painters originated Barbizon painting when they left their studios to paint directly with their easels in landscape in the village of Barbizon on the outskirts of the Forest of Fontainebleau. Most of them had a background of academic training in Paris, but in Barbizon they had no rigid agreed-upon style and no particular commitment to rebellion. However, in art history, Barbizon artists are credited as being revolutionary because of their painting directly from nature, their choice of landscape as the primary subject, and their emotional involvement in the process that is evident from the tone of their canvases. In other words, nature was a worthwhile subject in its own right rather than something vague, romanticized and sublime. And for the first time in paintings by reputable artists, working peasants were depicted, a subject that was also startling because it was a turn from gentle subjects that opened the door to the 20th Century movement of Social Realism. Adopting a new philosophy that man cannot be separated from nature, Barbizon artists created works that drew the viewer into the scene, not as a bystander but as active participant. Chief among them were French artists Camille Corot (1796-1875), Jean Francois Millet (1814-1875), Theodore Rousseau (1812-1867), and Charles Daubigny (1817-1878). Winckworth Allen Gay (1821-1910), a student of Constant Troyon in 1847, was the first American painter to study directly with a Barbizon artist. William Babcock (1826-1899) is credited as “perhaps the first to become friendly with Millet and to move (about 1849) to Barbizon.” (Baigell 24). However William Morris Hunt (1824-1879) remains the American artist most closely associated with the early Barbizon movement in France. He studied with Millet for two years, from 1852 to 1854, and then influenced other Americans in the style as a painter and teacher when he returned to New England in 1854. Early-American Barbizon | Return to Top"
year_published = 2025
