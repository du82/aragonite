["https://askubuntu.com/questions/1213701/zoom-with-scroll-wheel"]
title = "zooming - Zoom with scroll wheel? - Ask Ubuntu"
description = """
I'm baffled I've not found an answer to this on Google.

I want to be able to zoom in / magnify parts of screens when recording tutorial videos. On my Mac I just turned on the zoom accessibility fe..."""
full_description = '''Zoom with scroll wheel? Ask Question Asked 5 years ago Modified today Viewed 4k times 0 I'm baffled I've not found an answer to this on Google. I want to be able to zoom in / magnify parts of screens when recording tutorial videos. On my Mac I just turned on the zoom accessibility feature and could zoom in and out with control button + scroll wheel. I can't find an equivalent feature in Ubuntu 18.04 when using Simple Screen Recorder. I see magnify in accessibility but this is either on or off, so not much help and would not result in a nice seamless video. Is there such a setting or tool? I know I can zoom in in the edit but that's a real faff. Thanks Update #1 18.04, Ubuntu, not virtual. Using Simple Screen Recorder. zooming Share Improve this question Follow edited Mar 6, 2020 at 16:20 K7AAY 17.6k99 gold badges4949 silver badges8080 bronze badges asked Feb 28, 2020 at 17:28 Roger06Roger06 13322 silver badges1212 bronze badges 2 I've still not found anything... – Roger06 Commented Mar 6, 2020 at 9:48 are you on GNOME or Unity? – Zany_Zachary1 Commented Mar 6, 2020 at 16:21 Add a comment | 3 Answers 3 Sorted by: Reset to default Highest score (default) Date modified (newest first) Date created (oldest first) 0 A review of the app you use, Simple Screen Recorder shows it's not listed as a feature in that app. Therefore. please use the Zoom component of the Universal Access features as described in https://help.ubuntu.com/stable/ubuntu-help/a11y-mag.html.en : Open the Activities overview and start typing Universal Access. Click on Universal Access to open the panel. Press on Zoom in the Seeing section. Switch the Zoom switch in the top-right corner of the Zoom Options window to on. You can now move around the screen area. By moving your mouse to the edges of the screen, you will move the magnified area in different directions, allowing you to view your area of choice. Share Improve this answer Follow edited Mar 10, 2020 at 15:53 answered Mar 6, 2020 at 16:19 K7AAYK7AAY 17.6k99 gold badges4949 silver badges8080 bronze badges 3 I'm using Gnome. I don't really see this as a feature of the screen recorder. A screen recorder just records on the screen, the OS should allow me to zoom in and out. It's so easy on a Mac, I'm surprised there doesn't seem to be an equivalent for Linux, for accessibility if nothing else. – Roger06 Commented Mar 9, 2020 at 19:40 I am NOT looking for this feature in a screen recorder! I am wondering if there's a way to zoom in / magnify a portion of the screen using the scroll wheel of a mouse. Whether it's been recorded or not is irrelevant - I often want to zoom in to a screen to see something better or perhaps highlight a particular area. – Roger06 Commented Mar 10, 2020 at 15:50 @Roger06 - I know this is 18 months after you asked, but (in case you haven’t worked out how) - zoom in /out in a window by holding down ctrl and scrolling the mouse wheel, or on a laptop hold down ctrl and slide 2 fingers up / down the touchpad. – Will Commented Oct 25, 2021 at 16:00 Add a comment | 0 It may not be much help (now) but the Unity desktop and Compiz has this feature. I am on Ubuntu 20.04 and will upgrade to 22.04 when it is available but I will be sticking with Unity mostly because of its ability to do mouse wheel zoom. All right I do like 'wobbly windows' as well, and, yes, desktop cube! In the CompizConfig Settings Manager look in 'Accessibility and then Enhanced Desktop Zoom. Share Improve this answer Follow edited Oct 25, 2021 at 14:18 answered Oct 25, 2021 at 14:00 M. A. WheadonM. A. Wheadon 11611 silver badge88 bronze badges Add a comment | 0 Install the Compiz window manager and zoom in/out with the mouse wheel: sudo apt install compizconfig-settings-manager This Magnify works like Linux Mint Cinnamon Magnifying or Linux Lite Magnifying using mouse. I found that it also works on Ubuntu Mate just replace the macro with compiz. If you want to change the settings, go to MATE Tweak → Windows → Window manager → select Compiz → click CCSM → Accessibility → Enable enhanced zoom Desktop. Then you should have: Super+mouse wheel up = zoom in Super+mouse wheel down = zoom out Share Improve this answer Follow edited Jul 30, 2022 at 17:58 BeastOfCaerbannog 16.3k1111 gold badges5858 silver badges9595 bronze badges answered Jul 30, 2022 at 17:34 N.AhmedN.Ahmed 14166 bronze badges Add a comment | You must log in to answer this question. Not the answer you're looking for? Browse other questions tagged zooming. The Overflow Blog Our next phase—Q&A was just the beginning “Translation is the tip of the iceberg”: A deep dive into specialty models Featured on Meta bigbird and Frog have joined us as Community Managers Recapping Stack’s first community-wide AMA (Ask Me Anything) My answer has been edited 11 times by one user over five years to the point... Related 18 How to activate super+scroll to zoom? 46 How to zoom in & zoom out 74 How can I disable Alt-Scroll zoom in XFCE4 (Xubuntu) 6 Zoom a Single Window 1 how to zoom out on desktop with kubuntu 3 Zoom with Control+Mouse-wheel in Ubuntu 22.04 (Gnome) 1 Ctrl + Mouse Wheel fixed to changing between workspaces in 22.04.5 -- Can't zoom in with Mouse Wheel $(function() { $(".js-gps-related-questions .spacer").on("click", function () { fireRelatedEvent($(this).index() + 1, $(this).data('question-id')); }); function fireRelatedEvent(position, questionId) { StackExchange.using("gps", function() { StackExchange.gps.track('related_questions.click', { position: position, originQuestionId: 1213701, relatedQuestionId: +questionId, location: 'sidebar', source: 'Baseline' }); }); } }); Hot Network Questions How should I handle a revision that superficially addresses a major literature issue? Can I use a commercial appliance in my home? In The Silence of the Lambs, why did Lecter send Clarice to Yourself Storage? How should introductory statistics material explain sample size estimation for means in the case of unknown population variance? Short story about a mind-reading boyfriend Blackjack game for assignment Would domestic animals be much rarer if humans could digest grass Origin of "foo", "bar", and "baz" Do I need to replace my water-softener? Was the meaning of ... (ellipsis) for buttons and menus already defined in MS DOS? What base moulding profile has a curved face and a small flat top? How can a parabolic trajectory be the path of an object orbiting a star? GE Flat Drop-In Cooktop Burner stuck on high Is it possible to force clipping an audio signal to 0.4Vpp? Does there exist a simple closed curve in R^3 whose projections down onto the three coordinate planes are simply connected What did mill owners do in the winter? When a coalition government like Germany's fails, how is a "snap" election supposed to fix it? (Explain it like I'm five) Movie where they're searching for the base of monsters. Have to sneak into Russia to find the cave and destroy it before these monsters spread You have guessed the word! (successfully or not necessarily?) Do RPM spec's for %changelog change when the upstream source is updated? Determine two ellipses common tangent via degenerate conics / linear algebra Light always travels in straight line but what about diffraction? Why is the United States willing to sell F-35 fighter jets to India despite India being a Russian S-400 SAM operator? How many Nightriders can be safely placed on a chess board? more hot questions Question feed Subscribe to RSS Question feed To subscribe to this RSS feed, copy and paste this URL into your RSS reader. StackExchange.ready(function(){$.get('/posts/1213701/ivc/d8e5?prg=d4ced881-d668-4fa8-8b72-9713bcd55d45');}); <div><img src="/posts/1213701/ivc/d8e5?prg=d4ced881-d668-4fa8-8b72-9713bcd55d45" class="dno" alt="" width="0" height="0"></div> {"doMarkObsolete":false,"doTimeOnPage":false,"sendAnswerEditorEventsToAEH":false,"sendAnswerEditorEventsToPrizm":false,"questionId":1213701,"sendAuthQuestionVisitToAEH":false,"sendAuthQuest