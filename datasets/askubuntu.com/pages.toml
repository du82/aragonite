title = "Is this normal for a UEFI update? - Ask Ubuntu"
description = "So I just got this notification telling me I have an available update for UEFI dbx, specifically from 20230501 to 20241101. Not usually something I'd be worried about, but the fact that the notific..."
full_description = '''Is this normal for a UEFI update? Ask Question Asked today Modified today Viewed 33 times 0 So I just got this notification telling me I have an available update for UEFI dbx, specifically from 20230501 to 20241101. Not usually something I'd be worried about, but the fact that the notification is from an unknown app is throwing me off. So I'm wondering if this is normal. I have never seen a system update outside of when I manually start it within the shell or from the Software/Firmware Updater applications. I am using a Dell OptiPlex 7040 with an Intel Core i5-6500x4 running Ubuntu 24.04.2 LTS. Any help figuring this out would be appreciated. updatesuefinotification Share Improve this question Follow edited 1 hour ago ketatech asked 4 hours ago ketatechketatech 333 bronze badges New contributor ketatech is a new contributor to this site. Take care in asking for clarification, commenting, and answering. Check out our Code of Conduct. 1 I got a somewhat similar message on my box here a week or more ago (sorry I forget), I'm using a dell optiplex 7050 and running a newer release than your 24.04, and whilst I don't recall the message specifically (esp. dates within it); it looked pretty much as yours. I took my notification as coming from firmware-updater (snap package) and let it update WHEN I next rebooted; and thus forgot it. A quick look at what's included on 24.04 Desktop manifest (releases.ubuntu.com/24.04.2/…) and your appear to be using the same app. – guiverc Commented 4 hours ago Add a comment | 1 Answer 1 Sorted by: Reset to default Highest score (default) Date modified (newest first) Date created (oldest first) 1 I got a somewhat similar message on my box here a week or more ago (sorry I forget), I'm using a dell optiplex 7050 and running a newer release than your 24.04 (Ubuntu plucky), and whilst I don't recall the message specifically (esp. dates within it); it looked pretty much as yours. I took my notification as coming from firmware-updater (snap package) and let it update WHEN I next rebooted; and thus forgot it. A quick look at what's included on 24.04 Desktop manifest (https://www.releases.ubuntu.com/24.04.2/ubuntu-24.04.2-desktop-amd64.manifest) and your appear to be using the same app (snap packaged firmware-updater) snap:firmware-updater 1/stable/ubuntu-24.04 167 My notification looked different, but I was likely not running the GNOME desktop (I forget, but as I have a multi-desktop install, selecting which desktop I use when I login I could have been using GNOME, Xfce, LXQt ..) & have themed my desktop different, so it looked different for me. Share Improve this answer Follow answered 4 hours ago guivercguiverc 32.7k55 gold badges5151 silver badges8787 bronze badges 2 So it's likely just a naming error with the notification service and nothing I should worry about? I guess I'll manually update the UEFI dbx version and see if the notification still pops up afterwards. – ketatech Commented 1 hour ago I can't recall full details on that message sorry; and my uptime says up for 7 days 14:50 hours which means it was a week+ ago that I upgraded my box here.. My release differs (plucky not noble) so how it presented may have differed too (I don't recall a "Unknown app" at all!), but the text message looks the same; I just don't recall date/version detail of dbx. ( I reboot this machine every 10-14 days; and I recall the update message was there a couple of days before I was willing to reboot & thus applied my upgrade ) – guiverc Commented 1 hour ago Add a comment | You must log in to answer this question. Not the answer you're looking for? Browse other questions tagged updatesuefinotification. The Overflow Blog Our next phase—Q&A was just the beginning “Translation is the tip of the iceberg”: A deep dive into specialty models Featured on Meta bigbird and Frog have joined us as Community Managers Recapping Stack’s first community-wide AMA (Ask Me Anything) My answer has been edited 11 times by