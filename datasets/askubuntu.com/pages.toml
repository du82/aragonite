I want to use it because I give the hell up trying to get my built in soundcard to work with my current setup (it was"""
full_description = '''How do I get an Asound-cm106 (USB) sound card to work? Ask Question Asked 11 years, 6 months ago Modified today Viewed 6k times 5 I have a USB sound device asound-cm106 which apparently has the cm6206 chipset. I want to use it because I give the hell up trying to get my built in soundcard to work with my current setup (it was always fine before) I can sudo modprobe snd-hda-intel to get the refusing-to-do-anything built in card to appear in the sound card list but I have been left feeling like a useless idiot trying to figure out my way around this unity thing to try and make the USB device show up short of virgin sacrifice and prayers to dark gods. Clearly sound is a lot more complicated than, say, running my companies Apache servers and coding OO-PHP. The forums have been unusually unhelpful with every thread having wildly different answers which all seem to consist of downloading stuff, writing epics scripts in sub-voodoo languages, replacing the entire sound stack, patching the kernel or otherwise doing stuff that is so far over my head as to be incomprehensible. Threads I've found: https://bugs.launchpad.net/ubuntu/+source/alsa-driver/+bug/535476 http://ubuntuforums.org/archive/index.php/t-1208429.html https://lists.ubuntu.com/archives/ubuntu-uk/2009-June/019046.html All I want is to plug the silly thing in and get sound out of my speakers. Could someone offer me a solution that any fool could follow. You may collect my geek card on your way through. I am using Ubuntu 12.04 LTS (64bit) with an AMD Phenom(tm) II X2 555 Processor. 12.04soundpulseaudioalsa Share Improve this question Follow edited Aug 31, 2013 at 18:16 Jorge Castro 73.3k127127 gold badges468468 silver badges655655 bronze badges asked Aug 20, 2013 at 1:56 Matthew Brown aka Lord MattMatthew Brown aka Lord Matt 1,07844 gold badges1717 silver badges3939 bronze badges 4 Every on-board HDA device is wired differently, so you need a new kernel for new hardware; 12.04 is quite outdated by now. On a properly configured system, disabling the on-board device and just plugging the USB device in should work. – CL. Commented Aug 20, 2013 at 8:24 Please add the links to the forum posts you've checked out to your question, it might provide clues for the answerers! – Jorge Castro Commented Aug 31, 2013 at 17:54 3 Could you try to run 13.04 from a Live CD and see if it works? Hardware support may only appear in newer Ubuntu versions. – gertvdijk Commented Aug 31, 2013 at 18:10 1 Is your sound card recognized in ubuntu as an audio device? – Mihai Commented Sep 12, 2013 at 9:37 Add a comment | 1 Answer 1 Sorted by: Reset to default Highest score (default) Date modified (newest first) Date created (oldest first) 0 You could use alsamixer. Open terminal (Ctrl+Alt+T) and type following: $ alsamixer Then press F6 to Select your sound card, and change settings for it (increase/decrease volume, mute/unmute). After you have made the changes, press Esc to exit. To save alsamixer changes for reboots: $ sudo alsactl store Links: https://en.wikipedia.org/wiki/Alsamixer http://alsa.opensrc.org/Alsamixer Share Improve this answer Follow edited Sep 14, 2013 at 16:39 Simon 4,83388 gold badges3636 silver badges5252 bronze badges answered Sep 14, 2013 at 14:27 abchk1234abchk1234 1,86911 gold badge1616 silver badges2424 bronze badges 1 1 Alsamixer correctly detects the extra channels, but this doesn't help with sound from the desktop. Even speaker-test still downmixes to 2 channels – Gordon Williams Commented Oct 7, 2016 at 11:32 Add a comment | You must log in to answer this question. Not the answer you're looking for? Browse other questions tagged 12.04soundpulseaudioalsa. The Overflow Blog Our next phase—Q&A was just the beginning “Translation is the tip of the iceberg”: A deep dive into specialty models Featured on Meta bigbird and Frog have joined us as Community Managers Recapping Stack’s first community-wide AMA (Ask Me Anything) My answer has been edited 11 times by 