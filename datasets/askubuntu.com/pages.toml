full_description = '''How is Restart Different from a Cold Start? Ask Question Asked 4 days ago Modified today Viewed 69 times 1 I have Ubuntu 24.04 running on a Lenovo ThinkPad T420. This machine was setup as dual boot between Windows 10 and Ubuntu but the other day I reinstalled Ubuntu 24.04 from a flash drive. I chose the option to use the full disk for Ubuntu and wipe out any other operating systems. The system runs fine from a cold start, and boots directly into Ubuntu 24.04. However, when Ubuntu does a Restart, either as part of an upgrade or when I choose Restart from the Shutdown menu, I get a bunch of error messages and then a menu with Ubuntu, Windows Boot Loader and other options, such as the memory test. This menu is not operative. I can move the highlight to different options but when I hit Enter none are executed. I always use the Power button to turn the machine off and then back on. At that point it boots normally into Ubuntu. I had the same issue when the system was configured as dual boot, but I thought getting rid of Windows and having only Ubuntu on the machine would fix the problem, but it hasn't. How is Restart different from a cold start, and why do I still have a Windows boot menu option after I told Ubuntu to overwrite the old Windows installation? How can I get rid of this "extra" Restart menu? Thanks in advance for any help. Update on 2/28/2025 . I've added a picture of the menu that appears after a warm boot. I can move the cursor up and down, and change menu with TAB but pressing Enter or waiting 10 seconds does not activate anything. Based on the fact that I edited Grub to remove the Windows 10 option, this is Grub, not the EFI Boot Manager. See below for that information. sudo efibootmgr BootCurrent: 0019 Timeout: 0 seconds BootOrder: 0019,000A,001A,000D,0006,0007,0008,0009,000B,000C,000E,000F,0010,0011,0012,0013 Boot0000 Setup FvFile(721c8b66-426c-4e86-8e99-3457c46ab0b9) Boot0001 Boot Menu FvFile(126a762d-5758-4fca-8531-201a7f57f850) Boot0002 Diagnostic Splash Screen FvFile(a7d8d9a6-6ab0-4aeb-ad9d-163e59a7a380) Boot0003 Startup Interrupt Menu FvFile(f46ee6f4-4785-43a3-923d-7f786c3c8479) Boot0004 ME Configuration Menu FvFile(82988420-7467-4490-9059-feb448dd1963) Boot0005 Rescue and Recovery FvFile(665d3f60-ad3e-4cad-8e26-db46eee9f1b5) Boot0006* USB CD VenMsg(bc7838d2-0f82-4d60-8316-c068ee79d25b,86701296aa5a7848b66cd49dd3ba6a55) Boot0007* USB FDD VenMsg(bc7838d2-0f82-4d60-8316-c068ee79d25b,6ff015a28830b543a8b8641009461e49) Boot0008* ATAPI CD0 VenMsg(bc7838d2-0f82-4d60-8316-c068ee79d25b,aea2090adfde214e8b3a5e471856a35401) Boot0009* ATA HDD2 VenMsg(bc7838d2-0f82-4d60-8316-c068ee79d25b,91af625956449f41a7b91f4f892ab0f602) Boot000A* ATA HDD0 VenMsg(bc7838d2-0f82-4d60-8316-c068ee79d25b,91af625956449f41a7b91f4f892ab0f600) Boot000B* ATA HDD1 VenMsg(bc7838d2-0f82-4d60-8316-c068ee79d25b,91af625956449f41a7b91f4f892ab0f601) Boot000C* USB HDD VenMsg(bc7838d2-0f82-4d60-8316-c068ee79d25b,33e821aaaf33bc4789bd419f88c50803) Boot000D* PCI LAN VenMsg(bc7838d2-0f82-4d60-8316-c068ee79d25b,78a84aaf2b2afc4ea79cf5cc8f3d3803) Boot000E* ATAPI CD1 VenMsg(bc7838d2-0f82-4d60-8316-c068ee79d25b,aea2090adfde214e8b3a5e471856a35403) Boot000F* ATAPI CD2 VenMsg(bc7838d2-0f82-4d60-8316-c068ee79d25b,aea2090adfde214e8b3a5e471856a35404) Boot0010 Other CD VenMsg(bc7838d2-0f82-4d60-8316-c068ee79d25b,aea2090adfde214e8b3a5e471856a35406) Boot0011* ATA HDD3 VenMsg(bc7838d2-0f82-4d60-8316-c068ee79d25b,91af625956449f41a7b91f4f892ab0f603) Boot0012* ATA HDD4 VenMsg(bc7838d2-0f82-4d60-8316-c068ee79d25b,91af625956449f41a7b91f4f892ab0f604) Boot0013 Other HDD VenMsg(bc7838d2-0f82-4d60-8316-c068ee79d25b,91af625956449f41a7b91f4f892ab0f606) Boot0014* IDER BOOT CDROM PciRoot(0x0)/Pci(0x16,0x2)/Ata(0,1,0) Boot0015* IDER BOOT Floppy PciRoot(0x0)/Pci(0x16,0x2)/Ata(0,0,0) Boot0016* ATA HDD VenMsg(bc7838d2-0f82-4d60-8316-c068ee79d25b,91af625956449f41a7b91f4f892ab0f6) Boot0017* ATAPI CD: VenMsg(bc7838d2-0f82-4d60-8316-c068ee79d25b,aea2090adfde214e8b3a5e471856a354) Boot0018* PCI LAN VenMsg(bc7838d2-0f82-4d60-8316-c068ee79d25b,78a84aaf2b2afc4ea79cf5cc8f3d3803) Boot0019* Ubuntu HD(1,GPT,2cc46b1a-cc31-482d-890c-0be652fed966,0x800,0x219800)/File(\EFI\ubuntu\shimx64.efi) Boot001A Windows Boot Manager HD(1,GPT,62a6bdd6-c675-4ed5-8938-e1ea1dece5be,0x800,0x32000)/File(\EFI\Microsoft\Boot\bootmgfw.efi)57494e444f5753000100000088000000780000004200430044004f0042004a004500430054003d007b00390064006500610038003600320063002d0035006300640064002d0034006500370030002d0061006300630031002d006600330032006200330034003400640034003700390035007d00000000000100000010000000040000007fff0400 dual-bootstartupreboot Share Improve this question Follow edited 5 hours ago user68186 36.9k1313 gold badges9595 silver badges129129 bronze badges asked Feb 25 at 22:19 VicVic 1133 bronze badges New contributor Vic is a new contributor to this site. Take care in asking for clarification, commenting, and answering. Check out our Code of Conduct. 8 To the OS itself, I'm not sure of any difference, however as restarting/cold-starts are controlled by machine firmware, your machine firmware can cause there to be differences. Also at cold-start the RAM will have unknown contents; where on restart the contents of RAM will be whatever was there prior to restart. Machine firmware is device specific; ie. make/model & also impacted by firmware version as that is the code that runs first on boot. – guiverc Commented Feb 25 at 22:57 1 I think you probably are seeing the UEFI one time boot menu. UEFI entries are not erased unless you do that separately. You may also have in the ESP - efi system partition a /EFI/Microsoft folder with UEFI boot files for Windows. Some systems only want to boot Windows by default, so removing Windows may need additional UEFI changed. What does this show? sudo efibootmgr And the -b xxxx -B parameters can be used to delete an entry, see man efibootmgr & askubuntu.com/questions/1198221/… – oldfred Commented Feb 26 at 16:55 I added a photo of the menu that appears after a warm boot. (The phrase I should have used from the start. In this menu I can move the cursor up and down with the arrow keys and change menus with the TAB key, but when the cursor is on Ubuntu, nothing happens when I press ENTER or wait for 10 seconds or more. I also took a video of the warm boot process but have not yet figured out how to link to that. – Vic Commented yesterday I ran sudo efibootmgr and the results are in the text file at this link. drive.google.com/file/d/1lpXJiwdDq8r8N4EnS6KFUhs-SFlp6sFJ/… – Vic Commented yesterday 1 @vic nope. A cold boot is used to clear system errors, reset hardware components. A warm boot skips those And that is indeed the UEFI boot menu. . – Rinzwind Commented yesterday | Show 3 more comments 0 Sorted by: Reset to default Highest score (default) Date modified (newest first) Date created (oldest first) You must log in to answer this question. Browse other questions tagged dual-bootstartupreboot. The Overflow Blog Our next phase—Q&A was just the beginning “Translation is the tip of the iceberg”: A deep dive into specialty models Featured on Meta bigbird and Frog have joined us as Community Managers Recapping Stack’s first community-wide AMA (Ask Me Anything) My answer has been edited 11 times by one user over five years to the point... Linked 2 Cloning SSD also cloned boot options Related 0 UEFI boot option disappeared for Ubuntu installed on secondary drive 1 Dual boot Ubuntu 16 and Windows 10 on different devices 1 How do I force BIOS to boot to shimx64.efi file when you turn OFF the computer? No dual boot needed 1 How do I tell the Ubuntu bootloader to boot from a different drive? 4 Getting grub menu to work on dual boot Ubuntu 22.04 Windows 11. Currently boots in a loop $(function() { $(".js-gps-related-questions .spacer").on("click", function () { fireRelatedEvent($(this).index() + 1, $(this).data('question-id')); }); function fireRelatedEvent(position, questionId) { StackExchange.using("gps", function(