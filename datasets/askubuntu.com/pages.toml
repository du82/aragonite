title = "Why Ubuntu 20.04 userspace boot time is so slow - Ask Ubuntu"
description = "My ubuntu system is taking over a minute to boot up. I have checked systemd-analyze and it is the userspace that is taking this much time alone. I have already checked other similar problems on ask..."
full_description = '''Why Ubuntu 20.04 userspace boot time is so slow Ask Question Asked 4 years ago Modified today Viewed 5k times 4 My ubuntu system is taking over a minute to boot up. I have checked systemd-analyze and it is the userspace that is taking this much time alone. I have already checked other similar problems on askubuntu and else but nothing has worked. I have disabled wayland but to no effect. $ systemd-analyze Startup finished in 3.924s (firmware) + 4.194s (loader) + 4.731s (kernel) + 1min 3.616s (userspace) = 1min 16.466s graphical.target reached after 1min 2.908s in userspace This time it is little fast (usually it takes 1min 30-40s). $ systemd-analyze blame 30.726s plymouth-quit-wait.service 18.379s systemd-journal-flush.service 13.680s networkd-dispatcher.service 8.956s udisks2.service 7.800s dev-sda5.device 7.009s libvirtd.service 6.799s accounts-daemon.service 6.638s NetworkManager.service 5.179s polkit.service 4.520s avahi-daemon.service 4.433s ModemManager.service 4.237s gpu-manager.service 4.105s switcheroo-control.service 4.093s thermald.service 4.083s wpa_supplicant.service 4.078s systemd-logind.service 4.071s systemd-machined.service 3.682s systemd-fsck@dev-disk-by\x2duuid-6CF4\x2dF74D.service 3.478s rsyslog.service 3.396s systemd-resolved.service 2.933s apport.service 2.679s grub-common.service 2.250s gdm.service 1.829s e2scrub_reap.service 1.776s apparmor.service 1.510s systemd-tmpfiles-setup.service 1.508s systemd-backlight@backlight:intel_backlight.service 1.489s media-avatar\x2dhiro-Data.mount 1.452s systemd-udevd.service Here it is mentioned plymouth-quit-wait.service is not the main culprit. and I have checked and configured the systemd-journal-flush.service from here. There are no external peripherials connected (I am on laptop). I am on the end of my rope. P.S. I have installed Ubuntu 20.04 couple of months ago on the same machine and it worked great. Then I moved to windows temporarily. I moved to Ubuntu 20.04 as my primary os last week and this problem comes up for the first time. Edit 2: After, sudo gedit /etc/default/grub and remove everything from GRUB_CMDLINE_LINUX_DEFAULT="" as kannzzmm2 suggested, bootup time has improved avatar-hiro@Laptop-Ubuntu:~$ systemd-analyze Startup finished in 3.890s (firmware) + 4.390s (loader) + 5.362s (kernel) + 32.779s (userspace) = 46.423s graphical.target reached after 31.152s in userspace avatar-hiro@Laptop-Ubuntu:~$ sudo systemd-analyze critical-chain The time when unit became active or started is printed after the "@" character. The time the unit took to start is printed after the "+" character. graphical.target @31.152s └─multi-user.target @31.151s └─libvirt-guests.service @30.830s +319ms └─libvirtd.service @24.991s +5.831s └─network.target @24.782s └─NetworkManager.service @19.516s +5.263s └─dbus.service @19.509s └─basic.target @19.408s └─sockets.target @19.407s └─libvirtd-ro.socket @19.405s └─libvirtd.socket @19.381s +20ms └─sysinit.target @19.116s └─systemd-timesyncd.service @18.669s +445ms └─systemd-tmpfiles-setup.service @17.107s +1.538s └─systemd-journal-flush.service @3.895s +13.209s └─systemd-remount-fs.service @3.579s +291ms └─systemd-journald.socket @3.320s └─-.mount @3.266s └─system.slice @3.266s └─-.slice @3.266s bootdual-boot20.04plymouth Share Improve this question Follow edited Feb 18, 2021 at 6:05 Hiro asked Feb 16, 2021 at 6:10 HiroHiro 11322 silver badges88 bronze badges 11 It would be helpful to see the output of sudo systemd-analyze critical-chain. Also what kind of drive is this installed on and how long did it take to boot before? – PonJar Commented Feb 16, 2021 at 9:05 open the file using sudo gedit /etc/default/grub and remove everything from GRUB_CMDLINE_LINUX_DEFAULT="" (leave it empty) and then run sudo update-grub and see if this helps – kannzzmm2 Commented Feb 16, 2021 at 11:30 @PonJar sudo systemd-analyze 's output is same as without sudo. I have ubuntu installed on hdd (which has three partitions, second for windows and third shared data partition), and it used to take 20-30s before. – Hiro Commented Feb 16, 2021 at 13:17 @kannzzmm2 it gave a little boost (this time 1m 7.767s to boot) and it removed the splash screen. – Hiro Commented Feb 16, 2021 at 13:20 2 Ok, some of this doesn’t make sense. Your systemd-analyse critical-chain output should show the same results as the systemd-analyse output for userspace so they must have been taken from different boots. That suggests that the most recent boot is about 4 + 4 + 25 seconds in getting to the stage where you enter your password. There is then another wait to get to the desktop. This seems roughly what I would expect for a HDD. My Ubuntu VM takes a total of 12.6 seconds to reach userspace and then at least the same again to reach the desktop after entering the password. This is a SSD though – PonJar Commented Feb 17, 2021 at 21:41 | Show 6 more comments 2 Answers 2 Sorted by: Reset to default Highest score (default) Date modified (newest first) Date created (oldest first) 0 I had this same problem after doing a windows reinstall on a machine with Ubuntu 24.04. The solution was to get a virtual terminal by pressing Ctrl+alt+f6, logging in, then editing the fstab by removing all NTFS volumes from it Share Improve this answer Follow answered 10 hours ago thelostsouldownthelostsouldown 111 bronze badge 1 This does not provide an answer to the question. Once you have sufficient reputation you will be able to comment on any post; instead, provide answers that don't require clarification from the asker. - From Review – zx485 Commented 8 hours ago Add a comment | 0 Lol its an old question, but I just learned about this command recently, and wanted to share. You can analize your boot process by looking at a picture of it using this command: systemd-analyze plot > boot.svg then look at the image with your favorite image viewer. You might have to zoom in a lot to see all the processes, but the way its laid out is that the longer , darker red lines are indicating processes taking a longer amount of time to load. You could try reducing the number of processes running on boot, or simply try to eliminate the processes that take the longest amount of time to load. Share Improve this answer Follow answered 4 hours ago j0hj0h 15.3k3333 gold badges120120 silver badges198198 bronze badges Add a comment | You must log in to answer this question. Not the answer you're looking for? Browse other questions tagged bootdual-boot20.04plymouth. The Overflow Blog Our next phase—Q&A was just the beginning “Translation is the tip of the iceberg”: A deep dive into specialty models Featured on Meta bigbird and Frog have joined us as Community Managers Recapping Stack’s first community-wide AMA (Ask Me Anything) My answer has been edited 11 times by one user over five years to the point... Linked 43 Slow boot issue due to plymouth-quit-wait.service + ubuntu 18.04 44 What is the use of systemd-journal-flush.service? 3 Why is Ubuntu 22.04 taking a lot of time to boot up after upgrading from 20.04 to 22.04 Related 1 boot startup speedup Ubuntu 18.04 0 Ubuntu 20.04 slow boot issue 0 Booting Very slow Ubuntu 18.04 3 Why is Ubuntu 22.04 taking a lot of time to boot up after upgrading from 20.04 to 22.04 $(function() { $(".js-gps-related-questions .spacer").on("click", function () { fireRelatedEvent($(this).index() + 1, $(this).data('question-id')); }); function fireRelatedEvent(position, questionId) { StackExchange.using("gps", function() { StackExchange.gps.track('related_questions.click', { position: position, originQuestionId: 1316770, relatedQuestionId: +questionId, location: 'sidebar', source: 'Baseline' }); }); } }); Hot Network Questions When a coalition government like Germany's fails, how is a "snap" election supposed to fix it? (Explain it like I'm five) Script to fix filenames in the wrong encoding How can a parabolic trajectory be the path of an object orbiting a star? How does backpropagation in a transformer work? 