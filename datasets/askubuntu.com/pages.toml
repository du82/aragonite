sting ban is to positively contribute to the site; automatic bans never expire or “time out“. Visit <a href="/help/question-bans">our help page</a> for more details.</p> <p>To prevent your post from being blocked, it must have:</p> <ul> <li>A clear title.</li> <li>A reasonable explanation of what your question is. Add as much detail as you can.</li> <li>Any background research you&#x27;ve tried but wasn&#x27;t enough to solve your problem.</li> <li>Correct use of English spelling and grammar to the best of your ability.</li> </ul> <p>Visit our <a href="/help/quality-standards-error">quality standards help page</a> for more details.</p> <p>Questions that need additional work or that are not a good fit for this site may be closed by experienced community members. While questions are closed, they can be edited to make them eligible for reopening.</p> <p>This form should only be used to report Ask Ubuntu suspensions &#x2014; either site suspensions, review suspensions, or chat suspensions &#x2014; that you feel were inappropriate or unwarranted. If your suspension is 7 days or less in duration, we may not be able to review your request before the suspension ends, but we will still review your case.</p> <p><b>If you are question or answer banned</b>, please review the information available in the Help center <a href="/help/question-bans">question ban</a> and <a href="/help/answer-bans">answer ban</a> articles for more information. We will not be able to address your situation through this form.</p> <p>This should only be used to report (1) threats to the stability of a community and/or the company&#x27;s reputation or (2) an immediate and credible threat to the safety of a user or their long term reputation.</p> <p>Otherwise, please post on <a href="https://meta.stackexchange.com">Meta Stack Exchange</a> for a normal review process.</p> <p>We will respond to this report within 12 hours. Share as much information as possible including links and screenshots. Visit the <a h