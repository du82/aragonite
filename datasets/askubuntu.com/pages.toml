full_description = '''My system was crashing when trying to boot Ubuntu and now it is crashing after Ubuntu has been installed. Please help! Ask Question Asked today Modified today Viewed 6 times 0 First video: https://youtu.be/oBYaS3f3MTM Second video: https://youtu.be/f5fAVcIiBbc Third video: https://youtu.be/tlPR16LAtrw Hello, my name is Samuel and I’ve been experiencing issues with Ubuntu. Initially, I couldn’t even reach the installer screen because it would constantly crash. (In the attached video, you can see that this video was recorded after I eventually managed to boot into Ubuntu—even though error messages still appear briefly, they no longer cause a crash, and the system continues to boot. I suspect this is the same underlying problem as before.) After several attempts (I encountered various errors, and sometimes it seemed to work without any clear changes), I updated my BIOS to the latest version and reinstalled Windows (which I didn’t have before). Once Windows was installed, I was finally able to reach the Ubuntu installer screen and complete the installation. Now that I can boot into Ubuntu, I ran commands like: dmesg | less journalctl -p 3 -xb and, as expected, errors appeared (see the second and third videos). However, the main issue is that after I log into the system—when I, for example, open the browser—the entire system crashes after about five minutes, forcing me to shut down the laptop using the power button. Does anyone have any ideas about what might be causing this problem and how I can fix it? If you need any additional information, please let me know so I can provide it. Thank you! boot24.04crash Share Improve this question Follow asked 50 mins ago SamuelSamuel 1 New contributor Samuel is a new contributor to this site. Take care in asking for clarification, commenting, and answering. Check out our Code of Conduct. Add a comment | 0 Sorted by: Reset to default Highest score (default) Date modified (newest first) Date created (oldest firs