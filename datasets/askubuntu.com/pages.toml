title = "wireless - Why can't I download bcmwl-kernel-source? - Ask Ubuntu"
description = """
I have a wireless issue with my HP netbook.

I found a fix here: How do I get an Acer Npilfy 802.11 (BCM43225) wireless card working?
but when I type sudo apt-get install --reinstall bcmwl-kernel-s..."""
full_description = '''Why can't I download bcmwl-kernel-source? Ask Question Asked 12 years ago Modified today Viewed 7k times 2 I have a wireless issue with my HP netbook. I found a fix here: How do I get an Acer Npilfy 802.11 (BCM43225) wireless card working? but when I type sudo apt-get install --reinstall bcmwl-kernel-source it tells me that bcmwl-kernel-source could not be downloaded! Any suggestions? The command lspci -nn gives me the number 14e4:4727 for the controller, so that's why I thought this fix above would help. (I am using Ubuntu 12.10.) wireless Share Improve this question Follow edited Apr 13, 2017 at 12:23 CommunityBot 1 asked Feb 19, 2013 at 12:30 Andreas MaurepAndreas Maurep 2111 silver badge22 bronze badges 4 possible duplicate of How to Install Broadcom / STA Wireless card (BCM43XX) Look for the 4313 models. – Luis Alvarado Commented Feb 19, 2013 at 12:42 run sudo apt-get update first, then try sudo apt-get install --reinstall bcmwl-kernel-source. If that doesn't help, post the actual error output. – phipsalabim Commented Feb 19, 2013 at 12:58 Connect via an Ethernet (also known as LAN) cable to run the commands so it can download. Once you have run the commands unplug to test. If it does not work post the output of these commands. – Warren Hill Commented Feb 19, 2013 at 13:59 I get the same error:family@family-HP-Pavilion-dm1-Notebook-PC:~$ sudo apt-get install --reinstall bcmwl-kernel-source Reading package lists... Done Building dependency tree Reading state information... Done Reinstallation of bcmwl-kernel-source is not possible, it cannot be downloaded. 0 upgraded, 0 newly installed, 0 to remove and 1 not upgraded. family@family-HP-Pavilion-dm1-Notebook-PC:~$ – Andreas Maurep Commented Feb 19, 2013 at 15:50 Add a comment | 1 Answer 1 Sorted by: Reset to default Highest score (default) Date modified (newest first) Date created (oldest first) 0 Thanks to https://ubuntuforums.org/archive/index.php/t-1427221.html I solve my "No WiFi Adapter found" + the same "cannot download" probleme by following this : In terminal type the following: sudo rm /var/lib/dpkg/info/bcmwl-kernel-source.{postinst,prerm,postrm} sudo apt-get remove --purge bcmwl-kernel-source sudo apt-get clean then do: sudo apt-get update sudo apt-get upgrade and reboot And Finally reinstall with the GUI : Open hardware drivers and activate the broadcom STA wireless driver which should be there. Share Improve this answer Follow answered Aug 30, 2021 at 19:23 GeodorGeodor 101 Add a comment | You must log in to answer this question. Not the answer you're looking for? Browse other questions tagged wireless. The Overflow Blog Our next phase—Q&A was just the beginning “Translation is the tip of the iceberg”: A deep dive into specialty models Featured on Meta bigbird and Frog have joined us as Community Managers Recapping Stack’s first community-wide AMA (Ask Me Anything) My answer has been edited 11 times by one user over five years to the point... Linked 413 Installing Broadcom Wireless Drivers 16 How do I get an Acer Npilfy 802.11 (BCM43225) wireless card working? Related 0 WiFi is not working in Xubuntu 12.10 2 How to downgrade Broadcom wireless drivers bcmwl-kernel-source? 0 Problems with installing bcmwl-kernel-source. ubuntu 13.10 on MacBook Pro 1 Wireless card not working? (Broadcom 4311) $(function() { $(".js-gps-related-questions .spacer").on("click", function () { fireRelatedEvent($(this).index() + 1, $(this).data('question-id')); }); function fireRelatedEvent(position, questionId) { StackExchange.using("gps", function() { StackExchange.gps.track('related_questions.click', { position: position, originQuestionId: 258197, relatedQuestionId: +questionId, location: 'sidebar', source: 'Baseline' }); }); } }); Hot Network Questions Limit of normal CDF When can I equip a secondary weapon? Can analytical philosophers make expressible, negative claims about an ineffable reality? How is maintenance, repair and refueling done on satellites currently? Light always travels in straight line but what about diffraction? Can radar indicators be manipulated? Are all Bernoulli measure preserving homeomorphisms of the Cantor space eventually tree automorphisms? Series of books about a crew including a native American possibly called Raven trying to destroy a computer How many Nightriders can be safely placed on a chess board? Hit Lynel with ancient arrow and it vanished - did I kill it? How is it determined what celestial objects are considered to be part of the milky way galaxy How to understand parking rules in Austria (street parking) What is the source of the common claim that 3.0 material which has not been updated or replaced is still legally valid for use in 3.5 games? How can implicit Euler numerical method solve these ODEs? Where does the electron go in Béchamp reduction? Are the literals "" and "\0" identical? Unidirectional File Transfer (write only) Using Serial Adapter? Are these disks with holes homeomorphic? Movie where they're searching for the base of monsters. Have to sneak into Russia to find the cave and destroy it before these monsters spread How do you prove (A ∧ C) ∨ (A ∧ (B → C)) , B ⊢ C ∨ D? Determine the chess knight’s tour of a 6x6 chessboard given some hints Why do swivel head ratchets have a gap down the middle of the handle? Eigenvalues[{A, B}] is slower than Eigenvalues[LinearSolve[B, A]] for generalized eigenvalue problems Origin of "foo", "bar", and "baz" more hot questions Question feed Subscribe to RSS Question feed To subscribe to this RSS feed, copy and paste this URL into your RSS reader. StackExchange.ready(function(){$.get('/posts/258197/ivc/d8e5?prg=09dcf594-9143-4aef-b6e6-c585178884ea');}); <div><img src="/posts/258197/ivc/d8e5?prg=09dcf594-9143-4aef-b6e6-c585178884ea" class="dno" alt="" width="0" height="0"></div> {"doMarkObsolete":false,"doTimeOnPage":false,"sendAnswerEditorEventsToAEH":false,"sendAnswerEditorEventsToPrizm":false,"questionId":258197,"sendAuthQuestionVisitTo