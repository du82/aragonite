Installation has gone smoothly and the"""
full_description = '''SABnzbdplus will not start on boot but running the init.d script runs fine Ask Question Asked 12 years, 7 months ago Modified today Viewed 6k times 10 I am running the Ubuntu 12.04 server edition (static LAN IP) and was tying to install SABnzbdplus using the apt as per instructions here: Ubuntu PPA Repository Installation has gone smoothly and the server downloads etc no problem! The problem is that I have edited /etc/default/sabnzbdplus as the directions provided to: # This file is sourced by /etc/init.d/sabnzbdplus # # When SABnzbd+ is started using the init script, the # --daemon option is always used, and the program is # started under the account of $USER, as set below. # # Each setting is marked either "required" or "optional"; # leaving any required setting unconfigured will cause # the service to not start. # [required] user or uid of account to run the program as: USER=omar # [optional] full path to the configuration file of your choice; # otherwise, the default location (in $USER's home # directory) is used: CONFIG= # [optional] hostname/ip and port number to listen on: HOST=0.0.0.0 PORT=8080 # [optional] extra command line options, if any: EXTRAOPTS= My (omar) runlevel is N 2. Not quite sure what to do because executing: /etc/init.d/sabnzbdplus Works fine and error free. Not sure what to do here. Advice and assistance would be greatly appreciated! Thanks, init.d Share Improve this question Follow edited Jul 21, 2012 at 21:49 Jorge Castro 73.3k127127 gold badges468468 silver badges655655 bronze badges asked Jul 21, 2012 at 8:49 Omar MirOmar Mir 31311 gold badge33 silver badges1010 bronze badges Add a comment | 1 Answer 1 Sorted by: Reset to default Highest score (default) Date modified (newest first) Date created (oldest first) 0 The guide forgot sudo update-rc.d sabnzbdplus defaults This command will add the links at the correct runlevels so that sabnzbdplus starts and stops when booting, rebooting, shutting down, etc. edit: if you get the message that those links are already in place have a look at this question edit2: or this one Share Improve this answer Follow edited Apr 13, 2017 at 12:24 CommunityBot 1 answered Jan 1, 2013 at 20:53 Gerhard BurgerGerhard Burger 9,54966 gold badges4545 silver badges5959 bronze badges 2 I tried that and it didn't work. I just switched to Debian and all works well. – Omar Mir Commented Jan 2, 2013 at 1:11 Oh that's too bad, glad you got it working though! – Gerhard Burger Commented Jan 2, 2013 at 9:20 Add a comment | You must log in to answer this question. Not the answer you're looking for? Browse other questions tagged init.d. The Overflow Blog Our next phase—Q&A was just the beginning “Translation is the tip of the iceberg”: A deep dive into specialty models Featured on Meta bigbird and Frog have joined us as Community Managers Recapping Stack’s first community-wide AMA (Ask Me Anything) My answer has been edited 11 times by one user over five years to the point... Linked 3 init.d script startup problems 2 Services in rc.d, not starting automatically at boot Related 12 Start / stop init.d script without root access 2 Custom daemon script: works, but does not run at boot / startup 2 how to read init.d script start argument 2 Cannot automatically start JIRA via init.d script 1 Running service spacenavd start not same as /etc/init.d/spacenavd start 3 init.d script is not executed 1 init scripts don't run 1 Why does changing a init.d service start script makes no difference? The /etc/init.d/ script has a stale ExecStart $(function() { $(".js-gps-related-questions .spacer").on("click", function () { fireRelatedEvent($(this).index() + 1, $(this).data('question-id')); }); function fireRelatedEvent(position, questionId) { StackExchange.using("gps", function() { StackExchange.gps.track('related_questions.click', { position: position, originQuestionId: 166278, relatedQuestionId: +questionId, location: 'sidebar', source: 'Baseline' }); }); } }); Hot Network Questions 