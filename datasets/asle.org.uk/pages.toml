["https://asle.org.uk/transitions-abstracts-individual-papers"]
title = "‘Transitions’ Individual Paper Abstracts | ASLE-UKI"
description = "Association for the Study of Literature and Environment (UK & Ireland)"
full_description = "‘Transitions’ Individual Paper Abstracts Abstracts of Papers These are the abstracts of individually submitted papers. They are presented in alphabetical order by surname. Switch to Abstracts of Roundtables and Preformed Panels. Amal Al Rowisan (University of Birmingham) Denise Levertov’s ‘A Tree Telling of Orpheus’: A Narrative of Transition and Evolving Consciousness Panel 4.1, Thursday 31 August, 9.00am – 10.45am, Lecture Theatre 1 This paper examines the ecological narrative of awareness, revolution, and unity in Denise Levertov’s poem ‘A Tree Telling of Orpheus’ from Relearning the Alphabets. The poem is powerful in narrating the trees’ painful gradual transition from observing to emerging against environmental destiny. The poem was written during the years of change and upheaval of the Vietnam War and Levertov’s political activism. Levertov asserts the liveliness and vitality of trees by means of figurations through the trees’ awakening consciousness inspired by Orpheus’ song. The tree thus possesses human abilities to think, move, and inspire as emphasized by Material Ecocriticism. Thus, the poem embodies both Levertov’s perception of environmental degradation and her recognition of nonhuman agency. Through the collective revolution of the trees, the poem alludes to Levertov’s political and aesthetic revolution that motivates others to respond by a parallel act of awakening. Besides this political consciousness and assertion of nonhuman agency, this paper examines how the transition in the poem aims for ecological unity and is manifested through poetic devices. The trees move between binary oppositions like death and life, stillness and trembling, I and they, up and down, roots and buds, and dryness and water. The transition between these extremes indicates an attempt to blur them and propose unity in the recognition of the consciousness of the tree. Levertov’s employment of figuration like anthropomorphism and dendromorphism helps to achieve imaginative unity against the factual reality of division. Furthermore, various sensory images describe the stages of the transition and the affective manifestation. However, at the end of the poem, this imaginative transition is interrupted by Orpheus’ absence in which trees start to retain past agonies. The return to stillness asserts that ecological crisis can never be solved through personal efforts or artistic inspiration but necessitates a collective cultural and ethical reconstruction. Laura Albertini (University of St Andrews) Narrating the River Po – Discussing Transitions in Personification of Water Panel 4.2, Thursday 31 August, 9.00am – 10.45am, Teaching Room 4 With its 652 kilometers, the River Po is the longest Italian river. From its source on Mount Monviso in Piedmont, to its mouth in the Adriatic Sea, the river traverses four Italian regions. The Po’s basin constitutes the major geographical feature in Northern Italy, the River Po Valley, or Pianura Padana. Despite the geographical, economic, and demographic local and national importance of the area, the River Po has long been characterised as a liminal or regional space within the national imaginary. Contrasting the scarce geopolitical relevance of this waterway, the river appears in numerous works within the Italian cultural panorama, especially from the second half of the twentieth century. A recurring strategy of representation of this waterscape is personification. Considering theoretical discussions on representation of non-human entities and agency, my paper offers a comparative analysis of a number of Italian contemporary texts – such as those by Giovannino Guareschi, Gianni Brera, Guido Ceronetti, and Paolo Rumiz – to investigate changes in the literary imaginary connected to the River Po. A chronological analysis of these texts demonstrates a transition in the interpretation of the River’s agency, from a strong antagonistic force to a pre-secular entity, whose agency is negated by human actions. At the same time, the authorial use of personification as a rhetorical strategy perpetuates gendered representations of water and the waterscape, imposing binary and essentialistic distinctions to non-human entities. -Tim Ingold, The Perception of the Environment: Essays in Livelihood, Dwelling and Skill (New York: Routledge, 2000) -Bruno Latour, ‘Agency and the Time of the Anthropocene’, New Literary History, 45:1 (2014), 1-18. -Davide Papotti, ‘La navigazione fluviale nella fonte letteraria: note geografiche su due resoconti narrativi di discesa del fiume Po’, Semestrale di Studi e Ricerche di Geografia, 1 (2019), 61-74 -Veronica Strang, The Meaning of Water(Oxford: Berg, 2004) Veronika Arutyunyan (University of Hamburg) Transformations of Lyric Voice in Contemporary Ecopoetry Panel 2.2, Wednesday 30 August, 1.30pm – 3.00pm, Teaching Room 4 In the work of Rebecca Dunham, Craig Santos Perez, and Allison Cobb poetic voice figures as temporally and spatially situated and determined by racial, gender, and class conditions. Echoing the tenets of material ecocriticism, they portray the unstable boundary between human and non-human subjects, but their speaker does not dissolve in a net of relations. Although their ecopoetics enacts a decentering of the human, it resists “flat” ontologies and perspectives of dehierarchized co-existence that material ecocriticism favors, highlighting instead material interdependencies between environmental conditions and people’s everyday lives in the Anthropocene. Their highly personal voice conveys the tensions embedded in the universalist implications of the Anthropocene, as the poetic persona acquires a variety of differing positions from which to perceive the Anthropocene. This is achieved through the emplacement of voice in cultural, historical, economic, and political context that foregrounds the poetic persona’s positionality to their environment and enables self-recognition that extends to the reader. This personal lyric speaker, aware of their own role in shaping the environment, does not erase but manifests the difference between the human and the non-human and adequately portrays humanity’s ambivalent position—both of having immense power and a complete lack of control. In Perez’ chants that instruct the reader to speak out loud against environmental injustice voice becomes a tool of defiance. In Dunham’s documentary lyrics the voice assumes different personas—these multiple perspectives render the inequalities inherent in the Anthropocene discourse. Cobb’s lyric address ties voice to a sensual experience of a gendered body, saturated with “streams of chemicals”. In this paper, I argue that personal voice in these poets’ work overcomes the pitfalls of Anthropocene discourse as it remains attuned to its complexities. This signals a transition in lyric poetry from a detached personal voice to a personal voice that is enmeshed in environmental relations. Enaie Maire Azambuja (School of Advanced Study, University of London) Zen-inflected transitions in E. E. Cummings’ ecopoetic imagination Panel 2.6, Wednesday 30 August, 1.30pm – 3.00pm, Flex 2 E. E. Cummings is widely recognised for his use of a high level of experimentation in poems that emphasise materiality, particularly that of language. However, the relationship between this experimentation and the openness of his poetics to the realisation of a markedly spiritual experience has been little acknowledged. In E. E. Cummings: Poetry and Ecology, Etienne Terblanche suggests that Cummings’ poetics involves a ‘religious imagination’, namely ‘an imagination inclined to wholeness and an imaginative poetic ability to render avenues back to that wholeness’. This paper argues that such a path toward wholeness was paved by the impact of Zen and Taoism on Cummings’ poetics. It analyses the underexplored affinities between East Asian spirituality and his poetics of environmental resonance. His interest in East Asian thought and aesthetics flourished in the 1930s and 1940s, coinciding with the peak of his poetic experimentation, characterised by elements such as iconicity; non-linearity and open-endedness; active use of blank space; typographic, syntactic, and semantic deviations; and a primary focus on non-human themes. Such aesthetic transitions engender heightened states of awareness since they demonstrate that his poetics rejects traditional uses of language and decentres the human self in favour of poetic expressions of planetary entanglement. Indeed, his contact with Zen and Taoism foregrounds his development of a cosmological and materially-grounded poetic imagination that actualises the interpenetration of human and more-than-human agencies and semiosis. Such an integrative poetics anticipates what Jane Bennett calls the agentic assemblages that exist among diverse and dynamic material beings and forces. By developing heterogeneous agentic assemblages, Cummings’ cosmological vision of the poetic imagination enables processes of becoming that transform the products of the human self into a universal metamorphic effort involving all beings. These processes, I suggest, help reframe and expand current definitions of ecopoetics into what I define as cosmopoetics. Denise Baden (University of Southampton) Thrutopia: a fictional roadmap to a sustainable society Panel 4.4, Thursday 31 August, 9.00am – 10.45am, Lecture Theatre 3 The impact of arts, culture and literature in the transition towards a more sustainable society can be subliminal yet powerful. Stories can shape values, trigger reflection, enable creative visioning of alternative possibilities, build democratic dialogues and challenge the power dynamics of vested interests. Stories focussed on transitions to a new society set in the future are typically dystopian, showing us what terrible consequences will result if we don’t act now. In this paper I will present my research showing how solution-focussed narratives in news, education and fiction are a more effective means to encourage pro-social behaviour change than fear-based narratives. I will also draw upon psychological theories showing how eliciting fear is more likely to result in self-protective behaviours than the desired sustainable behaviours. This paper will discuss the concept of ‘Thrutopia’, a term presented by Rupert Reid to encompass the idea of stories that present positive visions of what a sustainable society might look like and how we can get there. An alternative term, analogous to science fiction, is ‘social-science fiction’. Thus just as science fiction explores the possible impacts of new technologies on society, for better or worse, social science fiction allows writers to explore the more systemic socio-political, legal and economic alternatives that can steer us towards more sustainable policies and practices. These may include citizens assemblies that allow more long-term decision making; switching from the GDP as a measure of success to a wellbeing index, or personal carbon allowances to harness innovation production and consumption towards low-carbon products and activities. In this paper I will discuss some current initiatives to encourage such writing in both the literary and film/TV space. These include the Green Stories Project, the Thrutopian Council, and Climate Spring. Kathrin Bartha-Mitchell (Goethe University Frankfurt, Germany) Transitioning to Intergenerational Justice: Reimagining Generational Crises through Transcultural Anglophone Fiction Panel 6.2, Friday 1 September, 11.00am – 12.30pm, Teaching Room 4 ‘Intergenerational Justice’ has become one of the leitmotifs of the 21st century and today mostly refers to the rights of future generations for a healthy environment and a stable social order. While justice between generations has emerged as a central need of our climate changing world, the academic field of Intergenerational Justice has largely been theorised in the social sciences and philosophy and evinces a tendency towards theoretical abstraction and eurocentrism. My talk will give an insight into my postdoctoral project, in which I explore an aspect of generational justice that has so far been neglected: its cultural dimension. Starting with narratives of (post-) World Wars, spanning the 20th century, and reaching up to the present day and into the imagined future, my project aims to compare generational crises across time and place. Reading transcultural fiction from the Caribbean, Europe, Asia, Africa, Australasia and North America, I seek to show that the current environmental calamity throws a different light on previous generational crises, and vice versa. To exemplify this, I zoom in on two texts: Kazuo Ishiguro’s An Artist of the Floating World (1986) and Alexis Pauline Gumbs’ Undrowned (2020). While Ishiguro dramatises the aftermath of World War II Japan, showing uneasy relations between generations within a family, Gumbs conception of generations is broader, encompassing marine mammals, ancestors, and the yet-to-come. Comparing these two texts, I explore how they depict responsibility across different time-scales, including a responsibility both towards the future and the past. The broad societal aim here is to deepen and to complicate, as well as to strengthen the increasingly ubiquitous planetary significance of generational justice. Put differently, transitioning to intergenerational thought and practice is becoming increasingly essential. Hannes Bergthaller (National Taiwan Normal University) Falling into the Anthropocene: Taiwan’s Great Acceleration, According to Huang Chun-ming Panel 6.6, Friday 1 September, 11.00am – 12.30pm, Flex 1 Current consensus in the Earth System Sciences has it that the Anthropocene began during the postwar and early Cold War period. It is during this “Great Acceleration” that patterns of life which had first been established in Europe and North America start to spread to the rest of the globe – a process that has traditionally been described as “modernization” or “Westernization.” One of the places where this process played out in an exemplary fashion is Taiwan. Under the auspices of the Sino-American Commission for Rural Reconstruction, the “Republic of China” turned from a primarily agricultural society into a modern industrialized nation over the course of a few short decades. As Dipesh Chakrabarty has argued, established critiques of modernity tend to attribute all agency in this process to the “original moderns,” casting the newly modernized societies in Asia and elsewhere as mere imitators or passive victims of a monolithic West. But such an account obscures the degree to which modernization was embraced by many as a path out of indigence and powerlessness. In this talk, I will examine the work of Huang Chun-ming, one of the leading figures of Taiwan’s “nativist” movement in the 1960s and 70s, in order to draw a more nuanced picture of the island’s fall into the Anthropocene. In his short story “The Taste of Apples,” in"
