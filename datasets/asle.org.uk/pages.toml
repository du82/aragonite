full_description = "CFP: ASLE-UKI Biennial Conference 2022 Call for Papers Association for the Study of Literature and Environment, UK and Ireland, Biennial Conference 2022 ‘Epochs, Ages, and Cycles: Time and the Environment’ 6–8 September 2022, Northumbria University, Newcastle upon Tyne Plenary Speakers include: Samantha Walton (Bath Spa University) Elizabeth-Jane Burnett (Northumbria University) Northumbria University is delighted to host the 2022 Biennial Conference of the Association for the Study of Literature and Environment, UK and Ireland ‘in person’ on 6 to 8 September 2022. While papers on any aspect of literature, culture, and environment are welcome, this conference in particular invites contributions that address the theme of ‘Epochs, Ages, and Cycles: Time and the Environment’. Read the full call for papers and Submit a Proposal… Please submit proposals for 20-minute papers, preformed panels of three, or exceptionally four, papers, and round table discussion panels with three to five participants, by Monday 6 June 2022. Posted by Vera Fibisan on 18th January 2022."
