full_description = "CFP: Green Letters – Special Issue on Environmental Humanities. Deadline 30 Sept 2018 Green Letters: Studies in Ecocriticism 23(1): Environmental Humanities Green Letters invites papers of up to 6000 words in length for a special issue, guest-edited by Prof Graham Huggan (University of Leeds) on the environmental humanities. Based on an informed cross-disciplinary approach to contemporary and historical environmental issues, environmental humanities is a rapidly growing field worldwide. The issue aims to include creative as well as critical work, and encourages individual, co-written and thematically clustered papers that reflect on the practical implications as well as theoretical foundations of environmental humanities work. Full details HERE. Posted by Vera Fibisan on 9th March 2018."
