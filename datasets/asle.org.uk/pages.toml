full_description = "CFP: ASLE-UKI Biennial Conference 2023 ASLE-UKI Biennial Conference: Liverpool 2023 Call for Papers Association for the Study of Literature and Environment, UK and Ireland, Biennial Conference 2023 ‘Transitions’ 30 August – 1 September 2023, University of Liverpool Confirmed Keynote Speakers: Brycchan Carey, Nandini Das, Caroline Edwards, Graeme MacDonald, Chris Pak, Craig Santos Perez The 2023 conference for the Association for the Study of Literature and Environment, UK and Ireland (ASLE-UKI) will be hosted by the Literature and Science Hub at the University of Liverpool. ASLE-UKI welcomes participation from scholars, readers, and creative practitioners interested in the relationships between literatures, environments and cultures – past, present, or future from anywhere in the world. As with previous ASLE-UKI conferences we are happy to receive papers on any aspect of literature, culture, and environment, but we particularly welcome responses that address the conference theme of ‘Transitions’. Read the full call for papers and submit a proposal here Please submit proposals for 20-minute papers, preformed panels, and roundtable discussions sessions via the conference webpage by 1st June 2023. For more information and contact details, please visit the regularly updated conference webpage. ASLE-UKI Biennial Conference: Liverpool 2023 Posted by Vera Fibisan on 28th November 2022."
