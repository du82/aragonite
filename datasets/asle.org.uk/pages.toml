full_description = "Conferences ASLE-UKI organises a biennial conference and a biennial postgraduate conference, taking place in alternate years. This page provides information about our upcoming conferences as well as an archive of conference programmes from previous years. Several of the programmes before 2015 are missing. If you have a copy, please let us know! ASLE-UKI BIENNIAL CONFERENCE 2025 THE UNIVERSITY OF GALWAY, 12-14 AUGUST 2025 ‘Erosion – Creimeadh’ The next biennial ASLE-UKI Conference will be hosted by The University of Galway, Ireland, in August 2025. The theme and more information will be announced shortly. Read the call for papers and submit a proposal Past ASLE-UKI Conferences 2024. ‘Arts of Noticing: Attention and the Environment’. The University of Edinburgh, 5-6 September 2024. Plenary Speakers: Alycia Pirmohamed, Eva Haifa Giraud. 2024 Conference Programme 2023. ‘Transitions’. University of Liverpool, 30 August – 1 September 2023 with a virtual day on 29 August. Plenary Speakers: Brycchan Carey, Nandini Das, Caroline Edwards, Graeme Macdonald, Chris Pak, Craig Santos Perez. 2023 Conference Programme 2022. ‘Epochs, Ages, and Cycles: Time and the Environment. Northumbria University, 6-8 September with a virtual day on 5 September. Plenary Speakers: Elizabeth-Jane Burnett, Todd Borlik, Andrew Crumey, Greg Lynall, Tess Somervell, Sam Walton. 2022 Conference Programme 2020. ‘Out of the Blue’ (Postgraduate Conference), A Virtual Conference organised by the University of Sheffield, 2-4 September. Plenary speaker: Pippa Marland. 2020 Conference Programme 2019. ‘Co-emergence, Co-creation, Co-existence’. University of Plymouth, 4-6 September. Plenary speakers: Greg Garrard, David Higgins, Adeline Johns-Putra, Harriet Tarlo, Judith Tucker. 2019 Conference Programme 2018. ‘A Place on the Edge?’ (Postgraduate Conference, in association with Orkney Science Week), University of the Highlands and Islands, Orkney, 5-7 September. Plenary speakers: David Borthwick, Gareth Davies, Rachel Dowse, Alec Finlay, Laura Watts. 2018 Conference Programme 2017. ‘Cross, Multi, Inter, Trans’ (with Land2). Sheffield Hallam University, 6-8 September. Plenary speakers: Ine Gevers, Kevin Hutchings, Jonathan Skinner. 2017 Conference Programme 2016. ‘A Change of (S)cene: Reviewing our Place in a New Geo.logical Epoch’ (Postgraduate Conference) University of Lincoln, 31 August – 2 September. Plenary speakers: Duncan French, Adeline Johns-Putra, Kate Rigby. 2016 Conference Programme 2015. ‘Green Knowledge’, Murray Edwards College, University of Cambridge, 2-4 September. Plenary speakers: Roger Harrabin, Ursula Heise, Ann Fisher Wirth, Louise Westling. 2015 Conference Programme 2014. ‘Locating Ecocriticism: Systems, Methodologies, Contexts’ (Postgraduate Conference) University College Dublin, 30-31 July. Plenary Speakers: Brycchan Carey, Sharae Deckard, Anne Milne, Pablo Mukherjee. 2013: ‘Ecological Encounters: Agency, Identity, Interactions’, University of Surrey, 29-31 August. Plenary speakers: Mike Hulme, Sheila Jasanoff, Catriona Sandilands. 2013 Conference Programme 2012, ‘Composting Culture’, University of Worcester, 5-8 September. 2010, ‘Environmental Change – Cultural Change’, University of Bath, 1-4 September. Plenary speakers: Robert Watson, Timo Maran, Sidney Dobrin, Georgina Endfield 2010 Conference Programme 2008, ‘Activism, Apocalypse, and the Avant Garde’, University of Edinburgh, 10-13 July. Plenary Speakers: Timothy Morton, Kate Rigby, Rebecca Solnit. 2007: ‘Modern Environments: Contemporary Readings in Green Studies’ (Inaugural Graduate Conference of ASLE-UK) University of Glasgow, 7-8 September. Plenary Speakers: Greg Garrard, Lee Rozelle, Richard Kerridge. 2007 Conference Programme 2006, ‘Discordant Harmonies: Ecocriticism in the 21st Century’, University of Lincoln, 8-10 September. (2006 Call for Papers) 2004, ‘Cross-Fertilisations: Literature, Science and Nature’, University College Chichester, 16-18 July. 2002, ‘Creativit