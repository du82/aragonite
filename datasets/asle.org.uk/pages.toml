full_description = "‘Transitions’ Panel and Roundtable Abstracts Abstracts of Preformed Panels and Roundtables These are the abstracts of of roundtables and preformed panels . They are presented in alphabetical order by panel title. Switch to abstracts of individually submitted papers Blue Humanities in Transition Panel 6.8, Friday 1 September, 11.00am – 12.30pm, Lecture Theatre 3 Hannah Boast (University of Edinburgh): Blue Humanities in Japan Susanne Ferwerda (Utrecht University): Underwater and Outer Space: Blue Humanities in the Pacific Ashley Cahillane (University College Dublin): Transnational thinking with hydrofictions: keeping us grounded The Blue Humanities has moved from a marginal concern in Environmental Humanities to a central theme. Its increasing importance reflects a wider acknowledgement in the social sciences and policy worlds of the centrality of water to the future of life on Earth. The UN now states that ‘climate change is primarily a water crisis’, and recently held its first freshwater conference in 50 years. If debate on water is thriving, the Blue Humanities remains loosely defined. This panel takes this as an opportunity to reflect on the meaning of the ‘Blue Humanities’ and what its key disciplinary, aesthetic and political concerns are and ought to be, including how Blue Humanities scholars might effectively intervene in public conversations about water. By bringing together scholars working on fresh and saltwater, across different geographies, the panel offers a snapshot of the field and invites a dialogue between panel and audience about the identity and future of the Blue Humanities. Hannah Boast’s paper, ‘Blue Humanities in Japan’ uses the work of Japanese activist-writer Ishimure Michiko (1927-2018) as an entry point into reading Japanese environmental history through Blue Humanities methods. Boast shows how this context can enrich Blue Humanities thinking on hydromodernity, hydrocolonialism and hydropower at a time of transition away from megadams. Ishimure is often described as ‘the Japanese Rachel Carson’, a nickname that reflects her campaigning on Minamata Disease, a form of severe mercury poisoning that affected the city of Minamata’s fishing community in the mid-twentieth century. Ishimure published widely on Japan’s twentieth-century industrial development and its uneven impacts nationally. Her novel Lake of Heaven (1997, trans. by Bruce Allen) focuses on a fictional village destroyed for the construction of a dam. It addresses Japan’s status as one of the most dammed countries in the world and the impacts of this policy on Japan’s marginalised rural populations. Japan exported its enthusiasm for megadams to its colonies in East Asia, yet was also the site of Asia’s first dam removal project in 2014. This talk situates Lake of Heaven in relation to Ishimure’s work on Minamata, showing how both events reflected the supremacy of hydromodernist approaches to water in postwar Japan over alternative water ontologies represented by Minamata’s fishing community and the displaced villagers. These alternative ontologies resonate with contemporary Japanese efforts to decommission dams and daylight urban rivers. The second talk, ‘Transnational thinking with hydrofictions: keeping us grounded’, by Ashley Cahillane, examines the manifold material and symbolic meanings of water in contemporary British and South African literature. Cahillane analyses the global imaginaries of two contemporary novels about water resources: Niall Bourke’s Line (2021) and Damon Galgut’s The Promise (2021). Line is (probably) set in England, whereas The Promise is set in South Africa. Cahillane argues that both novels respond to freshwater issues and imaginaries that cross local, national, and global scales. Both evoke Astrida Neimanis’s (2017) notion of ‘bodies of water’—water-mediated interconnections between multiple human bodies, places, nonhuman entities, and politico-economic forces. Yet freshwater in the texts also connects individuals to larger global forces of climate and capitalism. Freshwater allows these two texts to renegotiate borders: between human bodies, human communities, nonhuman entities, places, and nations. Combining world-literary and Blue Humanities approaches, Cahillane argues that freshwater inspires us to think transnationally. Freshwater is mobile: it can cross bodies, borders, and territories in its various forms. Yet Cahillane also argues that freshwater loses much of its use value for humans (and many other species) when separated too severely from land. As Jamie Linton (2010) argues, neoliberal capitalism also imagines freshwater as ‘global’, with detrimental effects for people, water, and ecosystems. The capitalist world-system is represented in Line and The Promise, where freshwater is also a vehicle for closing down borders—around individuals, communities, places, and nations who are left precarious or dry as a result of open trade borders. Cahillane concludes that freshwater necessitates temperate transnational thinking, attuned to the ongoing significance of keeping it tied to land. The final paper, ‘Underwater and Outer Space: Blue Humanities in the Pacific’ by Susanne Ferwerda, moves to another geographical region and hydrological zone: Australian and Pacific oceanic literatures. In the Pacific region, the lived reality of rising sea levels and changing coastlines has increased attention to living with oceans in transition. Analysing contemporary writing by Gina Cole and Ellen van Neerven, Ferwerda considers the speculative potential of blue literatures in changing oceanic environments. Via Pasifikafuturist (Cole 2022) oceanic and outer space exploration, as well as resistance to continued settler colonialism, Na Viro (2022) by Gina Cole and “Water” (2014) by Ellen van Neerven reimagine pasts, presents and futures of oceanic life. Their work employs literary tropes well known in Western scifi—from tentacular creatures that rise from the sea to space ships, robots and human enhancement—from Aboriginal and Indigenous Pacific ways of thinking and being. They reframe these tropes via the Pacific ocean to foreground elements of alien invasion, dispossession, progress and survival, which have long been part of the region’s history into the present. Van Neerven’s “Water” extrapolates Australian settler colonialism to offshore terraforming and Aboriginal resistance that rises from the water to entangle land and sea. And in a time of increased attention to ‘blue’ commercial space exploration—think Jeff Bezos’ Blue Origin project—Na Viro extends the ocean into outer space via Pacific wayfinding. Ferwerda ultimately asks: how do oceanic representations and ‘bodies of water’ (Neimanis) in flux add to the growing Blue Humanities discourse that no longer universalizes the Western imagination, to urge us to think of worlds in which the oceanic extends even beyond imagined Earthly confines? What does Pasifikafuturism do for a Blue Humanities in transition? These papers show the range of scholarship occurring under the heading of the Blue Humanities, looking to the diverse meanings of water as energy, scarce resource, space and symbolic connection, in the different geographies of Japan, the UK, South Africa, and the Pacific. In doing so, they invite conversation between panellists and audience about key themes and priorities of Blue Humanities and its future directions. Ecologies of Reparation and Maintenance Panel 5.6, Friday 1 September, 9.00am – 10.45am, Lecture Theatre 1 Henry Ivry (University of Glasgow) Arthur Rose (University of Exeter) Aaron Rosenberg (King’s College London) Rebecca Macklin (University of Edinburgh) As this year’s CFP makes clear, there is a dangerous understanding in many of the popular and political discourses that focus on “transition” – who, after all, is transitioning into what? In this rendering, transition is depoliticized in order to emphasize a neutral version of change, one that does not interrogate the preexisting conditions prior to transition. Our roundtable seeks to repoliticize transition by supplementing it with two terms pertaining to the political management of transition, maintenance and reparation. Drawing on the dialectic relation between maintenance and reparation, we seek to unseat the depoliticized hegemony of transition and its accompanying vision of progress. We ask, what are the other ways of imagining a world on the brink of climatic collapse? How might terms like both maintenance and reparation, help us develop an alternate lexicon for otherwise worlds? Through our discussion, we hope to develop ecologies of both reparation and maintenance, a way of thinking and reading with “fissures and flaws to build the conditions for other worlds and forms of life” (Nemser and Johnson). At the same time, we also understand the need to avoid some sort of Edenic return to a pre-Anthropocene past. We take these terms to be indicative of what Steven Jackson calls “broken world thinking.” Indeed, at the center of this exploratory ecology is a way of imagining practices that seeks to both work from and outside of entrenched epistemes. This is a repair, in other words, that AbdouMaliq Simone describes as “recognizing both that the brokenness cannot be fixed within the master’s domain or within his terms and how such brokenness is the very means of reestablishing a relationship with this world from an outside, from a relationship to it that is broken.” This theoretical framework provides the backbone of our conversation as we ask questions including: What is the role of literature and/or literary studies in reparation and/or maintenance? What and where are the infrastructures of repair? What are the forms of reparation? How about the forms of maintenance? How does a politics of reparation or maintenance alternate our relations to ideas of transition? Eco-Medievalisms I: Landscapes of Apocalypse, Flood, and Wilderness Panel 1.6, Wednesday 30 August, 11.00am – 12.45pm, Teaching Room 6 Emma Nudding (The University of York): Reading Fenland with the Monastic Ecopoetics of Henry de Avranches’ Vita Guthlaci Lynn Butzlaff (The University of York): Re-thinking Wilderness in the Poetic Edda Abigail Bleach (Manchester University): Navigating the Eco–Medieval with Paul Kingsnorth’s ‘The Wake’ This panel steps beyond the bounds of central spaces in medieval worlds to explore their edgelands: wilderness, fenland, untethered space and post-medieval apocalyptic landscape. It finds precedent in studies such as the works of Richard Hoffman and Alfred Siewers, intersecting these environmental historical approaches with contemporary queer-eco theories, such as those of Jack Halberstam and Heide Estes. Thus, we read medieval and post-medieval ecopoetics in medieval religious narratives, in hagiography and mythology, and in spaces in and under flux, in the floating and fragile archive of Bill Griffith’s boat and the equally-fragile archetype of apocalypse in Paul Kingsnorth’s medieval-appropriated landscapes. We find new ways of understanding contemporary ecological crisis in environmental landscapes of the medieval and post-medieval, in the tensions between centre and edge that hold them together. In transitioning away from established central spaces of monastery, mythology, and traditional medievalism we ask the following questions: How do we define edgelands in medieval texts in contrast with established centres of religious and economic power? Is it helpful to call these outer spaces ‘wilderness’ in terms of a medieval eco-poetics? What constitutes a post-medieval eco-poetics: must this apply to medieval texts alone or might it also apply to post-medieval, neo-medieval, and otherwise medievally-influenced texts? What can medieval ecopoetic texts teach us about contemporary ecological crisis; and conversely how does our relationship with a fast-changing ecological environment intersect with, frame, and undeniably influence our study of medieval environments? What fresh understandings does stepping away from more traditional ways of studying medieval texts bring to the field? What frameworks exist for these journeys away from the centre and how should we thus proceed? Emma Nuding reads Henry de Avranches’ thirteenth-century Vita Guthlaci, a life of the eighth-century hermit St Guthlac of Crowland, as shaped by the priorities of Crowland Abbey, the monastic community which later grew up around the site of Guthlac’s hermitage. Simultaneously, she argues that Avranches’ text is also shaped by the fenland landscape around that abbey, whose fertility and shifting sands resulted in endless disputes over which humans had the right to use its resources. She investigates how these two shaping factors of Avranches’ text connect by arguing that the Vita is attuned to the actualities and particularities of the fenland landscape primarily because of such monastic agendas. Thus, the ecopoetics of Avranches’ Vita is co-opted by a particular kind of anthropocentrism: it is a monastic ecopoetics shaped for institutional needs and desires. She argues that identifying these agendas for what they are can allow us to read beyond them to reconstruct an environmental history of the fens: in doing so, we learn much about the fenland’s fishes, turves and peat, and its miraculous deeps. Lynn Butzlaff argues that a constructed ‘Wilderness’ was not only a central tenet of Old Norse pre-christian ontology but that the Poetic Edda (thirteenth century) does not offer a greener relationship with nature based upon reciprocity. In doing so she complicates Lynn White’s contrast between a ‘green’ paganism with an environmentally exploitative Christianity. Drawing on the theories of Jack Halberstam to suggest a colonial relationship based on the marginalisation of the natural world as ‘Wilderness’ in the Edda’s clear distinction between Midgarðr/Ásgarðr and Jötunheim, she seeks to re-shape our understanding of the Edda’s ‘Wilderness’ to include ‘another-world’ rather than simply ‘Otherworld’. Abigail Bleach uses Paul Kingsnorth’s controversial novel The Wake (2014) to think through the kinds of ‘eco‘ thought that early medieval narratives facilitate. She argues that, rather than viewing Kingsnorth’s work as an example of ‘bad’ anachronistic medievalism, we can instead use it as a kind of roadmap—a tool to help us work our way through the epistemological and ideological questions that accompany ecological crisis Eco-Medievalisms II: Avian Landscapes, Languages, and Travels Panel 6.4, Friday 1 September, 11.00am – 12.30pm, Teaching Room 6 Becca Drake (The University of York): The Avian Journeys and Environments of ‘Örvar-Odds saga’ Jessie Summerhayes (The University of York): Occupying Bird-Space in Anglo-Saxon Literature Shona Turner (The University of York): Cuthbert’s Interactions with Birds in the ‘Vitae’ This panel turns its gaze upwards and outwards to the bird-spaces of medieval art and literature, laying its exploratio"
