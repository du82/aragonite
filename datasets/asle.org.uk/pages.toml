full_description = "ASLE-UKI Online Seminar: ‘Victorian Ecologies’ Next ASLE-UKI Online Seminar 26 May 2022 Victorian Ecologies Convenor: Sophia Jochem Date and Time: 26 May 2022, 5.00 pm How to Take Part: Register via www.eventbrite.co.uk Join us on 26 May 2022, 17:00 BST, for a free online ASLE UKI seminar on ecocritical approaches to Victorians and their relationship to the world around them. Confirmed Speakers and Titles: Mary Bowden (University of Delaware) Megan Kuster (University College Dublin) Francesca Mackenney (University of Leeds) Joan Passey (University of Bristol) Please register online via www.eventbrite.co.uk. Registration is free but please register in advance. If you enjoyed the seminar, please do consider making a small donation to help cover costs. Posted by Vera Fibisan on 7th April 2022."
