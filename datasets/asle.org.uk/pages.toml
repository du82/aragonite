["https://asle.org.uk/transitions-full-online-day"]
title = "‘Transitions’ Full Online Day | ASLE-UKI"
description = "Association for the Study of Literature and Environment (UK & Ireland)"
full_description = "‘Transitions’ Full Online Day Online Programme: Tuesday 29 August 2023 Date: Tuesday 29 August 2023 Time: 9am – 4.30pm UK time (British Summer Time/BST) We are delighted to offer an online conference day, also included in our in-person conference registration fees as well as available to attend separately. You do not need to be an ASLE-UKI member to attend the online conference, although we encourage you to join us if you are not a member. Zoom Link for online day: https://liverpool-ac-uk.zoom.us/j/95185917921?pwd=ZjJGT3RmdDZZcy93MStodDNGVms3dz09 Meeting ID: 951 8591 7921 Passcode: D9?0&^1f This page only includes the programme for the online day on Tuesday 29 September. Follow this link for the full conference programme. Programme summary 9.00-9.15am Opening Remarks and Housekeeping 9.15-11.00am Panel 1 – Troubled Waters 11.00-11.15am – Break 11.15-12.30pm Panel 2 – Transitions, Transformations, and the Nonhuman 12.30-1.15pm – Lunch break 1.15-3.00pm Panel 3 – Farm and Field 3.00-3.15pm – Break 3.15-4.15pm Keynote: Craig Santos Perez 4.15-4.30pm Closing Remarks Detailed Programme 9.00 – 9.15am: Opening Remarks and Housekeeping Speaker: Dr John Miller (The University of Sheffield) President of ASLE-UKI 9.15 – 11.00am: Panel 1 – Troubled Waters Chair: Vera Fibisan (University of Sheffield) Călina-Maria Moldovan (Babeș-Bolyai University of Cluj-Napoca, Romania) Liquid Ontologies and Planetary Assemblages. Representations of Water in Contemporary Norwegian Literature Carolyn Lau (Department of English, Chinese University of Hong Kong) Relational Ethics in End Times: A Posthuman Reading of Alan Moore’s Saga of the Swamp Thing Saba Pirzadeh (Lahore University of Management Sciences) Glacial Decline and Indigenous Livelihood in Uzma Khan’s Thinner Than Skin Mars Briones (Multidisciplinary Environmental Studies in the Humanities (MESH), University of Cologne) Tracing Transitions: Turns in Disaster Discourses and Tropes of Catastrophe 15 minute BREAK 11.15am – 12.30pm: Panel 2 – Transitions, Transformations, and the Nonhuman Chair: Jasmin Kirkbride (City, University of London) Domonique Davies (University of Reading) Breaths of Mountains and Man in Wallace Stevens’s ‘Chocorua to Its Neighbour’ Seda Bahar Pancaroglu (Çankaya University) Embracing the Inevitable: Arboreal Perspectives on Death and Transformation in Contemporary Fiction Veronika Arutyunyan (University of Hamburg) Transformations of Lyric Voice in Contemporary Ecopoetry 45 minute LUNCH BREAK 1.15pm – 3.00pm: Panel 3 – Farm and Field Chair: Sofie Schrey (Northumbria University) Pippa Marland (University of Bristol) From land stealers to land healers: transitions in contemporary farming and agrarian literature David Robinson (University of Johannesburg) Man’s best friend in Craig Higginson’s The Dream House Simon Ryle (University of Split) Old Rendering Plant: Marx’s gelatine & Levinasian flesh Holly Nelson (University of Michigan) Absolving Matelda: Engaging with Ecofeminism in Dante Alighieri’s Purgatorio 15 minute BREAK 3.15pm- 4.15pm: Keynote – Craig Santos Perez: Transitions and Poetic Thresholds For this keynote, Pacific Island author and scholar Craig Santos Perez will read poetry from his award-winning book, Habitat Threshold. This collection addresses themes of indigenous ecological knowledge, climate change, human-animal relations, environmental justice, and the anthropocene. These poems explore what it means to live in thresholds and entanglements of our transitional and precarious times. 4.15pm – 4.30pm: Closing Remarks ‘Online Day’ Contact: asleuki2023@gmail.com"
