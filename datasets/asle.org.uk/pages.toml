["https://asle.org.uk/awards"]
title = "ASLE-UKI Awards and Prizes | ASLE-UKI"
description = "Association for the Study of Literature and Environment (UK & Ireland)"
full_description = "ASLE-UKI Awards and Prizes ASLE-UKI has a small amount of money available to support prizes, bursaries, and other activities, and we hope in future to be able to increase the amount we can offer to help support research in the environmental humanities. This page offers information on the funding we are currently able to offer, including application details where appropriate. The amount of funding we can offer depends on our income from membership and donations. If you are not currently a member of ASLE-UKI, then please join us to help support our work. You can also give a donation via PayPal at any time. Thank you! Conference Bursaries ASLE-UKI is able to support postgraduate students and early career researchers with the costs of presenting at the association’s conferences. The award takes the form of a bursary which is paid directly to the award holder. The amount offered and the number of bursaries on offer varies from year to year, depending on the amount raised by donations and through the conference raffle. Eligibility. Applications are welcome from ASLE-UKI members who are currently registered as postgraduate students or are within three years of their viva and not yet in full-time or permanent employment. Please see the application page for full criteria. Application Closing Date. We are now accepting applications for bursaries to attend the 2025 Biennial Conference in Galway. The closing date for applications is midnight GMT on Friday 21 March 2025. How to Apply. Applications must be made online on the bursary application page. Bursary further details and application form Postgraduate Conference Funding ASLE-UKI supports the organisation and costs of our biennial postgraduate conference, which is normally organised by postgraduate students with the support of the ASLE-UKI Executive Committee. The award takes the form of a funding allocation to enable conference organisers to meet upfront costs such as room hire and catering deposits, and to set conference registration rates at a below-cost price, thus benefiting all conference delegates. The amount available varies from year to year. Eligibility: Funding is allocated to postgraduate students who are ASLE-UKI members and have agreed to organise one of the ASLE-UKI’s biennial postgraduate conferences. The award holder will work with the ASLE-UKI Treasurer who will arrange for relevant payments such as deposits to be made. Application Closing Date: This scheme has no formal closing date, but we encourage those who would like to organise a postgraduate conference to contact the ASLE-UKI Executive Committee between 18 months and two years in advance of the proposed conference. How to Apply: There is no formal application procedure. If you are interested in organising a postgraduate conference, please get in touch with the ASLE-UKI Postgraduate/Early Career Representatives for more information. ASLE-UKI Book Prize ASLE-UKI is delighted to offer biennial prizes for the best publications in both the critical and creative environmental humanities. The award takes the form of a small cash payment. Eligibility: Nominations can be made for books published in the previous two years. Precise dates for each round will be posted here when they are available. Application Closing Date: This scheme is currently closed. We will shortly be opening nominations for the next round. How to Apply: The initial long list will be drawn up from nominations received from members of ASLE-UKI, our international affiliates, or from publishers. Members are welcome to nominate their own books. Nominations will be restricted to one per person (or publisher) for each category. Information on how to nominate a book will be added shortly. Other Funding Opportunities We hope to introduce other funding schemes in the future. Please come back soon."
