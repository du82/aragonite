["https://asle.org.uk/transitions-thursday-full-programme"]
title = "‘Transitions’ Thursday Full Programme | ASLE-UKI"
description = "Association for the Study of Literature and Environment (UK & Ireland)"
full_description = "‘Transitions’ Thursday Full Programme Programme: Thursday 31 August 2023 This page includes the programme for Thursday 31 August 2023. Abstracts for all papers and panels are available by following the links below. Abstracts of individually submitted papers Abstracts of roundtables and preformed panels All events take place in 502 Teaching Hub, University of Liverpool. 8.30am: Registration and Refreshments 9.00am: Parallel Sessions 4 Zoom link for ALL THURSDAY PANELS (click link and then choose the breakout room that corresponds to the physical room in which the panel is taking place) https://liverpool-ac-uk.zoom.us/j/91063667477?pwd=TjRuZlpsVjJDSmhxVDJtYkk4RElEQT09 Meeting ID: 910 6366 7477 Passcode: uQi.+8i1 4.1 Knock on Wood: Arboreal Explorations Time: Thursday 31 August 2023, 9.00am – 10.45am Chair: Cathy Turner Room: Lecture Theatre 1 Anna Burton (University of Derby) Planting for “posterity”: Wordsworthian Tree Planting in the English Lake District Ilka Tampke (La Trobe University, Melbourne, Australia) Written by the forest Roberta Sala (University of Turin) Semiotic Transitions through the Forest-Border. An Ecocritical Analysis of “Kollektivnye Dejstvija”’s Early Actions Amal Al-Rowisan (University of Birmingham) A Tree Telling of Orpheus’: A Narrative of Transition and Evolving Consciousness 4.2 Questions of Travel Time: Thursday 31 August, 9.00am – 10.45am Chair: Julia Ditter Room: Teaching Room 4 Lauren Cullen (University of Oxford) Wilkie Collins’s Extraterritorial Plots: Heart and Science and “the wilds of Canada” Laura Albertini (University of St Andrews) Narrating the River Po – Discussing Transitions in Personification of Water Leah Miller (Iowa State University) Unsettled Settlers: Uncanny Travel of Home-Sick Westerners via Midsommar and Fauna Ava Siena Cohen (Trinity College Dublin) Anti-Ocularcentric travel: the importance plausibility over visibility in Ariosto’s Orlando furioso (1516/32) and Calvino’s Le città invisibili (1972) 4.3 Apocalypse When Time: Thursday 31 August 2023, 9.00am – 10.45am Chair: Richard Kerridge Room: Flex 2 Edith Hall (University of Durham) The Homeric Iliad as poem of Crisis and Transition Charlotte Lancaster (Bath Spa University) The Biblical Flood Myth Revisited: Representations of Flood and Deluge in Climate Fiction Jane Hibbert-Nicolov (Birkbeck College, University of London) The Lost Village: Yordan Radichkov’s Memories of Horses and the destruction of Kalimanitsa village in the building of the Ogosta Reservoir Adrian Tate (Independent Scholar) and Terry Gifford (Bath Spa University) Transitions: A Critical and Creative Response to D. H. Lawrence’s Apocalypse 4.4 Speculative Friction Time: Thursday 31 August 2023, 9.00am – 10.45am Chair: Julia Hoydis Room: Lecture Theatre 3 Denise Baden (University of Southampton) Thrutopia: a fictional roadmap to a sustainable society Adam Maric-Cleaver (University of East Anglia) From a hi-fi to a lo-fi ecology: noise, mediation, and environmental collapse in John Christopher’s The Death of Grass and Anna Kavan’s Ice Oliver Case (University of Worcester) Imagining the Future in Virginia Woolf’s ‘Between the Acts’ and Vita Sackville-West’s ‘Grand Canyon’ Kennedy Dragt (Université catholique de Louvain) An Inquiry Into the Strangeness of Things: Indigenous Speculative Fiction, Humour, and Faith in Louise Eldrich’s The Future Home of the Living God 4.5 Green & Blue Transitions I: Thinking Back with the Ocean & Unlearning Marine Science Epistemes (Roundtable) Time: Thursday 31 August 2023, 9.00am – 10.45am Chair: Alison Glassie Room: Lecture Theatre 2 Participants: Susanne Ferwerda (Utrecht University) Rhys Madden (London School of Economics) Meghan Judge (Stellenbosch University) 4.6 On Mermaids and Metamorphosis: Underwater Women in Anthropocene Writing Time: Thursday 31 August 2023, 9.00am – 10.45am Chair: Mandy Bloomfield Room: Flex 1 Lisa Billard (Independent Scholar) Welsh Mermaids and Tidal Ecolinguistics: a Poetic Enquiry Melanie Ebdon (Staffordshire University) Ecomagical Transformations in Our Wives Under the Sea (J. Armfield) and The Mermaid of Black Conch (M. Roffey) Philippa Holloway (Staffordshire University) ‘You Know Where You Are With Water’: Short fiction Athira Unni (Leeds Beckett University) Transitions and Oceanic Posthumanism in The Mermaid of Black Conch (2020) 4.7 Welsh Fictions: Extraction, Energy, and Environmental Justice Time: Thursday 31 August 2023, 9.00am – 10.45am Chair: Jamie Harris Room: Teaching Room 6 Elizabeth Edwards (Centre of Advanced Welsh and Celtic Studies, University of Wales Trinity St David) Racial and Environmental Justice: Ann Julia Hatton’s Gonzalo de Baldiva (1817) Aidan Byrne (Wolverhampton University) History, Memory and Injustice: contemporary fiction about Tryweryn Andy Webb (Bangor University) Welsh Petrofictions 4.8 ‘Verse with wings of skill’: Examining Transitions Between Literary and Practical Texts in the Early Modern Period Time: Thursday 31 August 2023, 9.00am – 10.45am Chair: Jemima Matthews Room: Teaching Room 5 Edward Stein (University of Cambridge) ‘Turning and returning’: Adapting Genre and Evolving Mentalities in John Taylor’s Verses on the Mine at Culross (1618) Emily Naish (The University of Sheffield) Transforming fenlands into poetry in Michael Drayton’s Poly-Olbion Todd Borlik (University of Huddersfield) Shakespeare and Snake Handlers Chloe Fairbanks (University of Oxford) ‘Experience by view, and due observation’: perambulation and embodied knowledge in Henry IV and King Lear 10.45am: Break 11.00am: Plenary 2: Nandini Das Time: Thursday 31 September, 11.00am – 12.30pm Chair: Rosamund Paice Room: Lecture Theatre 2 Zoom link for plenary: https://liverpool-ac-uk.zoom.us/j/95730891255?pwd=d0VXRFYxQWZTNWQwN0xmaGtwaWNRQT09 Meeting ID: 957 3089 1255 Passcode: D+eNex8h 12.30pm: Lunch 1.30pm: Excursions or free time Excursions will leave at 1.30pm sharp from the main entrance to 502 Teaching Hub apart from the Burton Mere bird trip which will leave at 1pm. All the excursions are outside so you are reminded to dress appropriately! If you are attending Hidden Environmental Histories of Merseyside you are encouraged to bring headphones and download this Spotify playlist. (if you unable to do so don’t worry: it won’t impact on your experience of the tour in any significant way). There are also some text and images here that we’ll be looking at on the walk (no need to look at this in advance). 6.30pm: Conference Dinner and Drinks at LEAF on Bold Street Please note the conference dinner is currently fully booked but we will announce if there are any extra spaces Find LEAF on Google Maps"
