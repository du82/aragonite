full_description = "Conference Bursary Application Form ASLE-UKI is able to offer a limited number of bursaries to assist postgraduate students and early career researchers with the costs of travel and accommodation at its conferences. The precise number of bursaries and their value varies from year to year. We are currently offering up to six bursaries of £200 (approximately €230) to assist with the costs of attending the 2025 conference at the University of Galway. Eligibility To apply for this bursary, you must: Be a registered postgraduate research student (PhD or equivalent) or an early career researcher within three years of your viva and not yet in full-time or permanent employment. Be a paid-up member of ASLE-UKI. Have submitted a proposal to deliver a paper in-person at the ASLE-UKI 2025 conference. You can submit your bursary application before you have heard whether your proposal has been accepted, but only applicants whose proposals are accepted will be considered for a bursary. Application Process Applications should be made on the online application form, below. Please complete all the fields fully as incomplete submissions will not be accepted. The deadline for submissions is midnight GMT on Friday 21 March 2025. You will be informed of the outcome before the conference. The ASLE-UKI treasurer will contact you to arrange payment. This will be made by bank transfer shortly after the conference ends. Please contact the conference organisers if you have any queries about this bursary. Terms and Conditions Successful applicants will be required to deliver their paper in person at the 2025 ASLE-UKI conference at the University of Galway. Successful applicants agree to inform the conference organisers as soon as possible if they are unable to attend. The decision of the judges is final. ASLE-UKI does not provide feedback on its decisions, nor will it enter into any correspondence with applicants about the merits of their application. Unless otherwise set out in law, ASLE-UKI accepts no liability to applicants for any losses (including expenditure) incurred by them in the process of applying for a bursary. Application Form Please enable JavaScript in your browser to complete this form.Name *FirstLastEmail *Your Current Status *I am currently registered as a postgraduate research student (PhD or equivalent)I passed my PhD viva within the past three years, and am affiliated with an institution, but do not have a full-time or permanent position (give viva date below)I recently passed my PhD viva but do not have a current academic affiliation (give viva date below)Other (please give details below)Your Institution *If none, or you selected 'other', above, please give most recent institution and PhD viva date ASLE-UKI Your the Your Paper Title *Please paste in the title of your proposed paper exactly as you submitted it to the conference call for papers page.Your Paper Proposal *Please paste in your paper proposal exactly as you submitted it to the conference call for papers page.You and the ASLE-UKI Conference *In 100 words or fewer, tell us how attending the ASLE-UKI conference will help you to develop your engagement with the environmental humanities.Confirmation *I confirm that I am eligible for this bursary and that I have read and accept the terms and conditions. ( function() { const style = document.createElement( 'style' ); style.appendChild( document.createTextNode( '#wpforms-2950-field_6-container { position: absolute !important; overflow: hidden !important; display: inline !important; height: 1px !important; width: 1px !important; z-index: -1000 !important; padding: 0 !important; } #wpforms-2950-field_6-container input { visibility: hidden; } #wpforms-conversational-form-page #wpforms-2950-field_6-container label { counter-increment: none; }' ) ); document.head.appendChild( style ); document.currentScript?.remove(); } )(); Submit"
