["https://asle.org.uk/author/verafibisanyahoo-com/page/4"]
title = "Vera Fibisan | ASLE-UKI | Page 4"
description = "Association for the Study of Literature and Environment (UK & Ireland)"
full_description = "CFP: ASLE (US) Biennial Conference, University of California Davis, 26-30 June 2019. Proposal deadline now passed. If as Rebecca Solnit contends, “paradise arises in hell,” when democratic communities are built from the ground up during times of disaster that leave us “free to live and act another way,” what might life in catastrophic times entail for the environmental humanities? How should we write, teach, protest, live, and act during this era when “paradise” is on fire, figuratively and literally? The Biennial ASLE Conference “Paradise on Fire” explores the connections among storytelling, real and imagined landscapes, future-making, activism, environed spaces, differential exclusions, long histories, and the disaster-prone terrains of the Anthropocene. Plenary addresses will be given by Ursula Heise, Cherríe Moraga, Melissa K. Nelson, and Nnedi Okorafor. Full details HERE. Posted by Vera Fibisan on 15th June 2018. INSPIRE Lecture Winner Announced – Congratulations Helen Moore We are delighted to announce that award-winning ecopoet Helen Moore will present her work entitled Is Love the Answer? Personal and Planetary Wellbeing through the Lens of Poetry at this year’s Hay Festival on May 31. Helen is the winner of the annual Institute for Sustainable Practice, Innovation and Resource Effectiveness (INSPIRE) Lecture, organised by the University of Wales Trinity Saint David (UWTSD) and the Association for the Study of Literature and the Environment, UK & Ireland (ASLE-UKI). Helen is an award-winning poet based in Scotland. She has published two poetry collections. Her debut volume, Hedge Fund, and Other Living Margins (Shearsman Books, 2012), persuades us, in the words to Sean Borodale, ‘that poetry can drive a vital empathy into the fabric of a fragile bio-sphere’. A third collection, The Mother Country, is due in 2019. Helen has collaborated on a range of ecologically oriented projects, and in July 2016 completed a 21 month long residency with ‘Last Tree Dreaming’, a Heritage Lottery funded community project raising awareness of the heritage and future of Selwood Forest in Somerset. Further details can be found on her personal website HERE The lecture will be followed by a public discussion between Helen, Dr Jane Davidson, UWTSD Pro Vice-Chancellor for Sustainability and Engagement, Director of INSPIRE and former Welsh Government Minister for Sustainability, and Professor Brycchan Carey, Chair of ASLE-UKI. Further information HERE. Posted by Vera Fibisan on 23rd April 2018."
