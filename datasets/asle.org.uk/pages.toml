full_description = "Wednesday 7 September: Full Programme Programme: Wednesday 7 September This page includes the programme for Wednesday 7 September. Follow this link for the outline programme. Abstracts for all papers and panels are available by following the links below. Abstracts of individually submitted papers Abstracts of roundtables and preformed panels All events take place in City Campus East One (CCE1). Plenary sessions, refreshments, etc, are on the ground floor. Breakout sessions are on the second floor – with the exception of the two short films (session 4.3) which will be shown in the ground floor lecture theatre 002. 8.30 am: Coffee and Registration (Lobby) 9.00 am: Parallel Sessions 4 4.1. ‘Our future is still the future of 1973’: Militant Ecologies and the Work/Energy Crisis (Roundtable) Time: Wednesday 7 September, 9.00 am – 10.45 am Chair: Daniel Eltringham (University of Sheffield) Room: 226 Participants: Fred Carter (University of Amsterdam) Tom Crompton (University of Warwick) Daniel Eltringham (University of Sheffield) Natalie Joelle (Birkbeck College, University of London) Emila Weber (University College London) 4.2. Deep-Time Ecopoetics Time: Wednesday 7 September, 9.00 am – 10.45 am Chair: Vera Fibisan (University of Sheffield) Room: 213 Amal Al-Rowisan (University of Birmingham) Robinson Jeffers’s Perception of and Responses to Modernization: A Critique of historical Cycles Vs Deep Time Jeremy Davies (University of Leeds) Recent Geologic Time Chao Xie (Zhejiang Gongshang University/ University of Cambridge) On “Deep Time” and Environmental Ethics in Gillian Clarke’s Ecological Poetry 4.3. Two Short Films: ‘Newland’ and ‘Fawley’ (Preformed Panel) Time: Wednesday 7 September, 9.00 am – 10.45 am Chair: Matthew Kelly (Northumbria University) Room: 002 Short Film: ‘Newland: New Vision for a Wilder Future’ Short Film: ‘Fawley’ Followed by discussion of the films led by Pippa Marland (Bristol) and Matt Kelly (Northumbria) 4.4. Temporal and Environmental Imaginaries Time: Wednesday 7 September, 9.00 am – 10.45 am Chair: Hilary Bedder (Anglia Ruskin University) Room: 214 Lee Barron (Northumbria University) Imagining the Novacene: Artificial Intelligence and Visions of Technological Environmental Futures Gemma Curto (University of Sheffield) Writing a green geometry of chaotic forms: intersections in Stoppard’s Arcadia Evelyn O’Malley (University of Exeter) ‘Peace and Quiet and Open Air’: New York weather in screen musicals of the Covid-19 pandemic Evy Varsamopoulou (University of Cyprus) Temporal Imaginaries in a World Without Time 4.5. The Historical Novel Time: Wednesday 7 September, 9.00 am – 10.45 am Chair: Mandy Haggith (University of the Highlands and Islands) Room: 222 Mariadele Boccardi (University of the West of England) Time, scale, representation and environmental historical fiction: Jim Crace’s Harvest (2013) and Ian McGuire’s The North Water (2016) Kennedy Dragt (Université Catholique de Louvain) Apocalyptic Visions: Medieval Mysticism as Future-past Speculative Hope in Two Contemporary Novels Jane Hibbert-Nicolov (Birkbeck College, University of London) A Balkan Pastoral: Anton Donchev’s historical novel ‘Time of Parting’ Sadhna Swayamsidha (Indian Institute of Technology, Madras) Anthropo-timescapes: Rethinking the Landscapes of Oppression in Mamang Dai’s The Black Hill 4.6. Writing for a Changing World Time: Wednesday 7 September, 9.00 am – 10.45 am Chair: David Tierney (University of Liverpool) Room: 223a Melanie Ebdon (Staffordshire University) “At midnight when the year turned”: shifting cycles and the pastoral posthuman in Jon McGregor’s ‘Reservoir 13’ Bernadette McBride (University of Liverpool) Cruel Optimism and Climate Crisis Kat Waters (University of Leeds) Primitive Futures: Nostalgia and Modernity in the work of Paul Kingsnorth Penelope Wells (Bournemouth University) Weird weather, women, and why they are powerless against climate change in contemporary eco-novels: a socio-political ecocritical perspective. 4.7. Water Works: Responding to Seventeenth- and Eighteenth-Centuries Water Systems (Preformed Panel) Time: Wednesday 7 September, 9.00 am – 10.45 am Chair: Catherine Evans (University of Manchester) Room: 221 Rosamund Paice (Northumbria University) Milton versus the Medici: Controlling Water in the Gardens of Eden and the Pratolino Claudine van Hensbergen (Northumbria University) Gabriel Caius Cibber’s ‘Curious Works’: Charles II’s Fountain in Soho Square (1681) Jodie Matthews (University of Huddersfield) Lucid Undulation’: Erasmus Darwin, Josiah Wedgwood and the Industrial Canal 10.45 am: Coffee (Lobby) 11.15 am: Plenary 2: Roundtable Discussion on Time and the Environment Time: Wednesday 7 September, 11.15 am – 12.45 am Chair: Brycchan Carey (Northumbria University) Room: 002 Participants: Todd Borlik (University of Huddersfield) Andrew Crumey (Northumbria University) Greg Lynall (University of Liverpool) Tess Somervell (University of Oxford) 12.45 pm: Lunch (Ground Floor Hub) 1.30 pm: Excursions or self-guided time (CCE1 Main Entrance) Excursions will leave at 1.30 pm sharp from the main entrance to CCE1. If you have booked on an excursion, please check your email for precise information about the trip. You will need to pay any fees on the day. 7.30 pm: pre-dinner drinks in the Lobby of the Sutherland Building 8.00 pm: Conference Dinner in the Great Hall of the Sutherland Building The Sutherland building is on Northumberland Road at the centre of the main city campus. Find the Sutherland Building on Google Maps Campus Map (the Sutherland Building is building number 27)"
