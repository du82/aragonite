title = "Panel and Roundtable Abstracts | ASLE-UKI"
description = "Association for the Study of Literature and Environment (UK & Ireland)"
full_description = "Panel and Roundtable Abstracts Abstracts of Preformed Panels and Roundtables These are the abstracts of of roundtables and preformed panels . They are presented in alphabetical order by panel title. Switch to abstracts of individually submitted papers American Indian Literature Charting New Literary Territory Panel 7.1. Thursday 8 September, 1.30 pm – 3.00 pm, room 221 Chair: Todd Borlik (University of Huddersfield) Brianna Burke (Iowa State University). Remaking, Rewriting, Reimagining the world in Thomas King’s The Back of the Turtle. Anik Chartrand (Brandeis University). Beyond Storytelling: James Welch’s Fools Crow as Contemporary a Native American Bundle System. Abbey Ballard (University of Worcester). ‘Coax Stories out of the Permafrost’: Stories from the Ice Within Tanya Tagaq’s Split Tooth. This panel explores the work of American Indian authors as they chart new literary territory. Starting with the novel *The Back of the Turtle*, this panel explores King’s work as it charts new territory by combining the Skywoman creation story with Genesis, creating a new hybrid and distinctly American religion for the 21st century that ultimately argues that creation is ever unfolding and that humans have a responsibility to work for paradise right here on Earth. The second paper argues for a new understanding of James Welch’s *Fools Crow*, a rarely analyzed novel by the well-known Blackfeet and Gros Ventre writer, arguing that bringing a distinctly American Indian ethos to analyzing the novel — that of the medicine bundle — reveals whole new understandings of Welch’s work. We will need a 3rd (and perhaps 4th) panelist. Animal Histories Panel 6.1. Thursday 8 September, 11.15 am – 12.45 pm, room TBA Chair: John Miller (University of Sheffield) Laura Gelfand (Utah State University). Love, Respect, and the Legacy of the Lupa Romana. Indigo Gray (University of Sheffield). Slime and Protoplasm: Evolution and Descent in the Animalia of Germinal. Mo O’Neill (University of Sheffield). The Vegetarian Limits of Edward Carpenter’s Modernist Self-fashioning. “Love, Respect, and the Legacy of the Lupa Romana”, Laura D. Gelfand (Utah State University) Five years ago, two young wolves were captured on video walking through a nature reserve just outside Rome, and the return of the animals to this major metropolis was met with mostly positive responses from the city’s residents. This is a stark contrast to the apprehension and violent reception wolves usually receive when they resettle areas where they have previously been eradicated in most of Europe and the US. Rome was said to have been founded by Romulus, who together with his twin brother that he subsequently killed, was suckled by a she-wolf. Roman warriors were favorably compared to wolves, and the image of the she-wolf with her human foundlings appeared on Roman coins, armor, and elsewhere throughout the extensive reach of the Roman empire. Rome’s founding myth, with its positive associations with wolves, differs dramatically from stories told about wolves elsewhere in antiquity where they were almost universally characterized as monstrous. Thanks to these negative representations wolves were completely eradicated from England and Scotland by the 17th century. Once they were no longer present in the environment, artists and others were able to further exaggerate the size and ferocity of wolves without having to worry that their exaggerated depictions would be contradicted by an encounter with a wolf in the wild. Wolves were hunted extensively throughout Europe and the US, but thanks to their long, positive associations with them, wolves were not pursued in Italy with the destructive zeal or the goal of complete eradication found elsewhere. Mika Rissansen described the ancient Roman approach to the wolf as closely akin to totemism, and this deep, historical connection seems to have continued to the present day. In this paper, I investigate how the positive associations established by Romans in antiquity came to influence later representations of wolves in Italian literature and art, together with their treatment in reality, in areas that were part of the Roman empire. I contrast this with more negative representations of wolves elsewhere in Europe—which may also have originated in associations of Roman warriors with wolves¬—and compare how these negative representations continue to influence perceptions of wolves thousands of years after their initial invention. “Slime and Protoplasm: Evolution and Descent in the Animalia of Germinal”, Indigo Gray (University of Sheffield) Emile Zola’s Germinal (1884) is ostensibly a novel about the local political struggles of coalminers in 1860s France, their attempts to strike and demand appropriate wages inevitably thwarted as they struggle against industrial capitalism, dehumanisation and a hungry ‘beast’ of a mine. Attention to representations of species in Zola’s novel, however, elucidates a complex network of human and animal actors whose bodies coalesce with one another and with their damp surroundings. Informed by TH Huxley’s 1868 theory of protoplasm, I argue that the presence of slime in Germinal – from coal-blackened phlegm to the ebbing tide within the mine – allows for questions about animality, evolution and origins to seep into the text. Huxley’s formulation of the ‘semi-liquid’ or ‘limpid liquid’ protoplasm as the origin of all life situates Germinal’s miners in direct contact with this primordial soup as they excrete and dip their toes into the slime of their environment. Tracking working bodies of humans, animals and the mine itself, I illustrate Zola’s narratives of evolution and an oscillating march of progress as his characters look back at their lowly, slimy origins and forward at ‘new men […] starting into life, a black army of vengeance slowly germinating in the furrows.’ “The Vegetarian Limits of Edward Carpenter’s Modernist Self-fashioning”, Mo O’Neill (University of Sheffield) My thesis-in-progress concerns the more-than-human thought of the essayist, poet, and social reformer Edward Carpenter (1844-1929). This paper addresses the complex question of Carpenter’s historical positionality: critics have variously characterised Carpenter as either late Victorian, or the product of a specific moment of either Edwardian or fin de siècle political radicalism. Others have emphasised his affinities with literary modernism. But which of these categories is most useful for the purpose of conceptualising Carpenter’s critically understudied contributions to pro-animal thought? I contend that exploring Carpenter’s vegetarianism provides a route into answering this question. Both his vegetarian thought and the wider nineteenth-century vegetarian movement complexly related to questions of temporality: vegetarianism simultaneously emblematised both ‘back-to-nature’ primitivism, and the utopian emergence of progressive modes of relation to nonhuman animals and environments. Echoing broader anti-vegetarian rhetoric, Carpenter’s critics also used his vegetarianism to stress the ‘faddish’ ephemerality of his thought, highlighting the diet’s contingency in shaping his historical reputation. First, this paper assesses Carpenter’s attempts to navigate this association with faddism through his own vegetarian self-fashioning, presenting his dietary practices as modern, flexible, and undogmatic. Next, I examine two important aspects of Carpenter’s vegetarianism: his health-based vegetarian advocacy, and the broader agricultural politics he developed through practicing farming at his smallholding in Millthorpe, Derbyshire. I argue that, despite his modern self-fashioning, Carpenter’s emphasis on small-scale, individualised, ‘clean’ production and consumption was incommensurate with the challenges posed by the intensification of animal agriculture within industrial modernity. His vegetarianism provides a microcosm of a broader over-optimism in his utopian thought regarding the longevity and expansivity of the industrial capitalist system that he critiqued. However, I contend that his contributions to the nascent fin de siècle animal rights movement render him a transitional figure, who helped to advance the development of modern pro-animal thought. Animal Temporalities Panel 7.2. Thursday 8 September, 1.30 pm – 3.00 pm, room TBA Chair: John Miller (University of Sheffield) Vera Fibisan (University of Sheffield). Temporality and Hydromateriality in Elizabeth-Jane Burnett’s Of Sea. Christie Oliver-Hobley (University of Sheffield). Sad, deserted shore, your fickle friends are leaving’: Time, Melancholy and Migration. Dominic O’Key (University of Sheffield). The Rewilding Plot: Writing Conservation Futures in the Sixth Extinction. “Temporality and Hydromateriality in Elizabeth-Jane Burnett’s Of Sea”, Vera Fibisan (University of Sheffield) Elizabeth-Jane Burnett’s latest collection of poems, Of Sea, is a key text of contemporary landscape poetry, which builds on her previous swimwork in Swims (2018). The collection gathers invertebrate ‘encounters through swimming’ (Burnett, 2021), closely linked to posthumanist notions advocated by Rosi Braidotti and Karen Barad, which see these encounters from the non-hierarchical perspective of the human body immersed and lowered in a body of water. This paper will examine the synergies between hydromateriality and posthumanism in light of the threats of terrestrial and blue extinction. In addition to the blue conceptions of space and place, this collection also considers the land from the perspective Of Sea or being immersed as a swimmer in a challenging environment. The sea and the field are mouths that are ‘plaited’ (Burnett 2021, p.17), a collective voice, song, and cry of the more-than-human, often finding itself in a perpetual realm of nullity. Furthermore, this paper investigates whether this work be considered ecoelegiac, and if so, why? Burnett’s renewed swimwork is an aquatic escape that is simultaneously liberating and intoxicating, the more-than-human body balancing between the desire for exploration and self-preservation. Wild swimming is proposed here as an extinction ritual, where the act of extinction is seen as a lessening, a diminishing of certain species towards a permanent return to nondescript matter rather than a past event. Simultaneously, Burnett’s poems build on the notion of loss as the ‘bodily bringing together [of] the different structures of nothingness – tracing their entanglements – that the world can mourn’ (Barad 2017, p.56) and energetically name. These individual encounters challenge anthropocentric perspectives by broadening them to more-than-human scales where water is only one conductive element between the here and now of swimwork and the broader implications of climate destruction. “The Rewilding Plot: Writing Conservation Futures in the Sixth Extinction.”, Dominic O’Key (University of Sheffield) This paper sets out to theorize the “rewilding plot”, a developing modality of contemporary literary realism in which ecological restoration is not simply described but forms the main social and environmental drama of a given work’s narrative. It will do so by focusing in particular on two novels that differently imagine and dramatise wolf reintroduction projects in the north of Britain: Sarah Hall’s The Wolf Border (2015) and Charlotte McConaghy’s Once There Were Wolves (2021). At their best, I argue, both texts model different futures and new natures; Hall and McConaghy harness the heteroglossia of the novel form to think through the concomitant contestations and convivialities of conservation coalition-building. Yet I will also be interested in showing how these texts, which both feature female protagonists who become pregnant, end up tethering their speculative pathways to reproductive futures which risk subordinating rewilding to the stories’ open-ended social closure. Thus even the rewilding plot, a drama of uneven human–animal relations in the Sixth Extinction, might ultimately use nature as metaphorical foil for a redemptive and human protagonicity. ‘“Sad, deserted shore, your fickle friends are leaving’: Time, Melancholy and Migration”, Christie Oliver-Hobley (University of Sheffield) Martin Heidegger’s writings on the nonhuman have been received by animal-studies researchers with disdain, chiefly due to his notorious thesis that ‘the animal’ is ‘poor in world’, while human Dasein is ‘world-building’. Time plays a pivotal role in the logic of this exceptionalism; humans enjoy an ‘ecstatic’ relationship with time, Heidegger claims, while nonhumans are unable to apprehend their own temporality. Heidegger argues that humans’ relationship to time is revealed, partly, in melancholia (Schwermut), a ‘disclosive’ mood within Heidegger’s philosophy, which exposes Dasein’s ostensibly unique capacity to mark what has been, hence what has been lost. Yet Heidegger acknowledges a problem with this notion of an atemporal animality via a bizarre act of ventriloquism: “Migratory birds! You, now the winter is coming, now we must soon depart.” I will think through this rare moment of Heideggerian uncertainty via two musings on time, melancholy and migration: Sandy Denny’s Who knows where the time goes? and J.A. Baker’s The Peregrine. Released/published in 1967, five years after Rachel Carson’s Silent Spring, these cultural texts depict bird migrations from the perspective of humans who struggle to grapple with their incomprehension and resultant feelings of bereavement. Both narrativize, in their own modes, melancholia towards a passing moment, while asserting nonhuman capacities to apprehend both time and loss. My paper will explore the implications of this more-than-human melancholy, de-humanising Heideggerian phenomenology in the context of theAnthropocene. Contaminated Landscapes in Historical, Deep and Cyclical Time Panel 2.1. Tuesday 6 September, 1.30 pm – 3.00 pm, room 221 Chair: Elizabeth Edwards (University of Wales Centre for Advanced Welsh and Celtic Studies) Mary-Ann Constantine (University of Wales Centre for Advanced Welsh and Celtic Studies). Avernus in Paradise: poisoned water in the landscapes of Romantic-era Wales. Andrew Webb (Bangor University). ‘the deep dark zero’: Dylan Thomas and the contaminated landscapes of the future. Jamie Harris (Aberystwyth University). After Chernobyl: Welsh poetry and nuclear power. This panel explores the ways in which landscapes are imagined and represented as sites of renewal and destruction across three kinds of time frame: historical, cyclical and deep. It focuses in particular on accounts of contamination, from the lead and copper works of the early industrial revolution, to the imagined nuclear holocausts of Dylan Thomas’s late poetry, to the ways in which more contemporary poetry registers the radionuclides that fell as rain after Chernobyl. While each of the papers explores writing about a particular moment in history, our aim is t"
