title = "CFP: Flows – Environmental History Workshop, 13 Sept 2019, Northumbria Univ., Newcastle. Proposals due 18 March. | ASLE-UKI"
description = "Association for the Study of Literature and Environment (UK & Ireland)"
full_description = "CFP: Flows – Environmental History Workshop, 13 Sept 2019, Northumbria Univ., Newcastle. Proposals due 18 March. The world around us today is shaped by a multitude of flows. Flows know no nation and create a transnational world. The way in which humans, animals, money, commodities, and natural resources have moved around our landscapes, and the way in which these movements have been managed, has left its mark on today’s world. This one day event hosted by Northumbria University will bring together academics, early career researchers and PhD students for the Second Annual Environmental History Workshop, which aims to continue the work begun at the 2018 inaugural workshop, providing space and stimulus for dialogue between UK-based environmental historians. Full details HERE Posted by Vera Fibisan on 6th March 2019."
