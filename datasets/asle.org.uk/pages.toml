["https://asle.org.uk/events/seminars"]
title = "Seminars | ASLE-UKI"
description = "Association for the Study of Literature and Environment (UK & Ireland)"
full_description = "Seminars ASLE-UKI Online Seminar Series. ASLE-UKI starting running regular online seminars in February 2021 as a response to the global pandemic. These have been very popular and we intend to continue running them into the future. This page provides information about our upcoming seminars as well as an archive of previous seminar topics. Seminars are normally held in January, March, May, and November and are open to all, although advance registration is usually required. We welcome ideas for future seminars. If you would be interested in organising a seminar, or for any other queries, please contact the seminar series coordinator, Dr. John Miller. Seminars are free to attend, but there are some costs involved in their organisation. If you enjoyed the seminar, please do consider making a small donation to help cover our costs. Next Seminar 19 February 2025, 2:00-4:00pm GMT Common Ground: Explorations of Soil across Research Disciplines Date and Time: 19 February 2025, 2:00-4:00pm GMT Confirmed Speakers and Bios (Alphabetical Order) Adenike Amoo’s research focuses on soil microbial ecology and its impact on ecosystem functioning. Her work spans diverse areas including forest soil microbiomes, plant-microbe interactions, and the effects of land use changes on soil biodiversity. Adenike has made significant contributions to understanding rhizosphere communities, microbial adaptations to extreme conditions, and the role of microorganisms in plant growth promotion. Her recent study on soil functioning in South African forests highlights the importance of soil microbes in ecosystem health. Adenike’s expertise in metagenomics and bioinformatics adds a cutting-edge dimension to soil ecology research. Indigo Gray is a third year PhD student in the School of English at the University of Sheffield. Her research investigates the ways in which literature about coal and coal mining portrays the human and animal body, for example through stories of hunched backs, black phlegm and blue tattoos. Reading novels from the Industrial Revolution, she examines the changing relationship between humans and the environment in the nineteenth and early twentieth centuries. Indigo’s interest in soil arises from the Victorian fascination with the ancient plants and animals that form coal, and the distinctions between different forms of geological presence in fiction. Alex Hibberts is a postdoctoral research fellow based at the Institute of Historical Research, University of London. His research explores changing coastal landscapes in pre-modern Britain, and how communities have responded to flooding, storm surges and erosion. He is currently a visiting researcher at the University of Bern where he is working on using early modern weather records for reconstructing past weather and climate. In this session, Alex will discuss how shifting estuarine wetlands from saltwater to freshwater based socio-ecologies both created new opportunities for sedentary agriculture, but also novel vulnerabilities. In particular, he will focus on late medieval soils and drainage schemes on Romney Marsh, Kent. Owen Hurcum is a PhD Candidate at the University of York. Their research project Trowels, Trenches, and #TransRights: Archaeology as Transgender Activism researches the connections between archaeology and transgender equalities within, and beyond, the discipline. They are funded by the AHRC through WRoCAH. They are also a member of the Leverhulme Trust funded Heritage for Global Challenges Research Centre. Their interest in soil stems from the stories it chooses to say about the past, viewing soil as an agential actor of history co-creating historic narratives through what it chooses to preserve, or destroy, from the archaeological record. Owen is Non-Binary and uses they/them pronouns. Jacob Wylie completed his undergrad and master’s at the University of Sheffield and now studies at the University towards a PhD exploring the interactions between arbuscular mycorrhizal fungi and nitrogen cycling microbial communities. His work focuses on how these below ground interactions can reduce greenhouse gas emissions (N2O) from agricultural soils. His interest in soil science stems from his passion for sustainable food production. With over 95% of global food production relying on soil, sustainable innovations are key if we are to conserve food production and equality for future generations. BOOK HERE: https://www.eventbrite.co.uk/e/common-ground-explorations-of-soil-across-research-disciplines-tickets-1237217864939?aff=oddtdtcreator Future Seminars The Animal and the Other in Science Fiction Convenor: David Tierney Confirmed Speakers: TBC Date: Thursday, 17th April 2025 Creative and Critical Practice Convenor: Richard Kerridge Confirmed Speakers: TBC Date: TBC The Eighteenth-Century Environment Convenor: Brycchan Carey Confirmed Speakers: TBC Date: TBC If you would be interested in organising an ASLE-UKI Online Seminar, please contact the seminar series coordinator, Dr John Miller. Previous Seminars Psychedelic Ecologies (17 January 2025) Convened by John Miller and Peter Sands with contributions from Richard Doyle, Neşe Devenot, and Christine Hauskeller. Petroculture and popular music (9 October 2024) Convened by John Miller (Sheffield) and Josie Taylor (UCD) with contributions from Ben Kritikos, Rachael Finney, Sam Solnick, Matthew Cheeseman, Beate Peter, and Annette Davison and Lara Ryazanova-Clarke Literature and Climate Trauma (15 May 2024) Convened by Ray Davenport with contributions from Matthias Stephan, Sarah K. Jackson, and Ray Davenport. Ice Ecocriticism (6 March 2024) Convened by Vera Fibisan and David Tierney with contributions from Daniel Abdalla, Sarah Hymas, and Svenja Engelmann-Kewitz. Petro-Noir (7 December 2023) Convened by Ruth Hawthorne with contributions from Sharae Deckard, Nathan Ashman, and Ruth Hawthorn. Cute Ecologies (7 November 2023) Convened by Hannah Boast with contributions from Joshua Paul Dale, Isabel Galleymore, and Caroline Harris. Global South Ecologies (2 June 2023) Convened by Ana Victoria Mazza with contributions from Lenka Filipova, Mònica Tomàs, Saba Pirzadeh, and Ana Victoria Mazza. Victorian Ecologies (26 March 2022) Discussed ecocritical approaches to Victorians and their relationship to the world around them. Convened by Sophia Jochem with contributions from Mary Bowden, Megan Kuster, Francesca Mackenney, and Joan Passey. Environmental Displacement (17 March 2022) Papers discussed the meaning of displacement in a warming world. Convened by Jasmin Kirkbride, Demi Wilton, and Vera Fibsian with contributions from Jos Smith, Charne Lavery, and Giovanni Bettini. Farming, Literature, and Environment (18 November 2021) Talks on framing, rewilding, and writing, convened by Pippa Marland with contributions from Ewan Allinson, Terry Gifford, Patrick Laurie, Lynn Cassells, and Sophie Yeo. Early Modern Ecologies: Green Heritage (19 June 2021) Ecocritical approaches to Shakespeare, Spencer, Milton, and others, convened by Todd Borlik and Rosie Paice with contributions from Claire Eager, Bonnie Lander Johnson, Jennifer Munroe, and Rosie Paice. Blue Extinction: Biodiversity Loss in Aquatic Environments (27 May 2021) A day of talks convened by Vera Fibisan at the University of Sheffield. Participants: Killian Quigley (The University of Sydney), Tom Bristow (James Cook University), Maria Beger (University of Leeds), Steve Mentz (St. John’s University), Dolly Jørgensen (University of Stavanger), Dr Tom Webb (The University of Sheffield). ‘In Vitro Meat: Ethics and Culture’ (1 February 2021) An afternoon of talks convened by the Sheffield Animal Research Centre (ShARC). Participants: Joshua Bulleid (Monash University), Nora Castle (University of Warwick), Josh Milburn (University of Sheffield), John Miller (University of Sheffield), Alexandra Sexton (University of Sheffield), Neil Stephens (Brunel University London)."
