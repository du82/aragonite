["https://asle.org.uk/author/verafibisanyahoo-com/page/2"]
title = "Vera Fibisan | ASLE-UKI | Page 2"
description = "Association for the Study of Literature and Environment (UK & Ireland)"
full_description = "ASLE-UKI Conference Programme Now Available The draft programme for the ASLE-UKI Biennial Conference at Northumbria University is now available to view on the following page: Conference Outline Programme Follow the links below for the detailed programme for each day, which will open in a new page. Information about the online day will be posted shortly. Saturday Online Programme Tuesday Full Programme Wednesday Full Programme Thursday Full Programme Abstracts for all papers and panels are available by following the links below. Abstracts of individually submitted papers Abstracts of roundtables and preformed panels Posted by Vera Fibisan on 30th July 2022. 2022 Biennial Conference – Registration Now Open Registration is now open for the 2022 ASLE-UKI Biennial Conference. The following registration fees will apply. There is an ‘early bird’ rate for those registering before 22 July. Full Delegate Rate: £150.00 Early Bird Rate (before 22 July): £125.00 Concessionary Rate (students, unwaged/low waged): £95.00 Early Bird Concessionary Rate (before 22 July): £75.00 To register, please go to the Northumbria University registration page (now closed). As well as registration, you will be given an option to select one or two tickets to the conference dinner (you are welcome to bring a guest who is not attending the conference) and you will also be able to reserve a place on your preferred excursion (or none). Numbers are limited on excursions, and are first come, first served. If an excursion is no longer showing, then it is fully booked. You will not be charged for excursions at this stage as they are either free, or pay on the day. MORE INFORMATION For more information about the conference, including details of the dinner and excursions, travel, locations, and the outline programme, please visit the main conference page. Visit the Main Conference Page Posted by Vera Fibisan on 2nd July 2022. ASLE-UKI 2021 Book Prize Announcement We are delighted to announce the winners of the 2021 ASLE-UKI Book Prize. ASLE-UKI offers two prizes: one for the best work in ecocriticism and the other for the best work of creative writing with an environmental theme. The winner of this year’s critical prize is Evelyn O’Malley for Weathering Shakespeare. The winner of this year’s creative prize is Ben Smith for Doggerland. Evelyn O’Malley, Weathering Shakespeare (Bloomsbury) Informed by the latest developments in ecocritical theory and extensive fieldwork at outdoor theatres throughout the UK, Weathering Shakespeare offers a hard-headed appraisal of open-air Shakespeare as a forum for ecological advocacy. Recognizing that the outdoor/indoor binary is as complex and tenuous as the nature/culture divide, O’Malley is rightly wary of apple-eyed assumptions that al fresco Shakespeare is intrinsically eco-conscious by mere virtue of its setting. Instead this book advances the provocative argument that much outdoor theatre enacts anthropocentricism in its blithe disregard for the non-human surroundings. Chardonnay-sipping audiences soak up an enchanting atmosphere that has little to do with ecological re-enchantment or enlightenment. This commendable scepticism means that the hard-earned efforts to discern moments of genuine consciousness-raising are all the more compelling. More information about Weathering Shakespeare Ben Smith, Doggerland (Fourth Estate) The judges were impressed by this remarkable first novel by a young British writer. Doggerland gives us a bleak but wryly presented future, further on in the Anthropocene. The setting is a lonely decaying windfarm in the North Sea. A boy and an old man live there, responsible for keeping the windmills turning. Their relationship is tense and teasing and then unexpectedly tender. Similarly, the bleakness of the whole setting occasionally lets in a bright shaft of beauty. A disturbing, depleted world of wreckage and endless, possibly futile effort is pierced sometimes, overwhelmingly, by humour and brightness. Beckett meets The Road with touches of Pincher Martin and Steptoe and Son – all in a brutal ecological scenario that makes us desperate for any sign of renewal. We congratulate this year’s winners on their excellent books! Posted by Vera Fibisan on 21st June 2022."
