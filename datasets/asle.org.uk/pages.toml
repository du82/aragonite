full_description = "Hay Festival Anthology An Anthology of Essays on the Theme of Literature and Sustainability To commemorate 10 years of the UWTSD INSPIRE/ASLE UK competition at the Hay Festival For ten years (with a short Covid-enforced break) ASLE-UKI and The Institute of Sustainable Practice, Innovation, and Resource Effectiveness (INSPIRE) at The University of Wales, Trinity St. David, worked together to sponsor a prize-winning essay to be delivered as a public lecture at the Hay Literary Festival. That competition has now sadly come to an end, but we are delighted to be able to make the prize-winning essays available as a free downloadable PDF. The essays offer short and accessible insights into current research and creative writing in literature and sustainability, with topics as diverse as Shakespeare’s grain dealing, starlings in literature, fracking and poetry, to love, trees, and solar power! The anthology includes contributions from: Jayne Elisabeth Archer Brycchan Carey Catherine Charlwood Rachel Dowse Hugh Dunkerley Hayden Gabriel Adeline Johns-Putra Richard Kerridge Greg Lynall Helen Moore Howard Thomas Richard Marggraf Turley Download the Hay Festival Anthology As well as all the prize winners, would would like to thank Jane Davidson, Director of INSPIRE at UWTSD, and Andy Fryers, Sustainability Director, Hay Festival, for their support during the ten years of this competition. Thanks everyone! Posted by Vera Fibisan on 28th May 2023."
