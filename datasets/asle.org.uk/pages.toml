["https://asle.org.uk/call-for-applications-co-editor-of-green-letters-deadline-8-february-2021"]
title = "Call for Applications: Co-editor of Green Letters. Deadline 8 February 2021 | ASLE-UKI"
description = "Association for the Study of Literature and Environment (UK & Ireland)"
full_description = "Call for Applications: Co-editor of Green Letters. Deadline 8 February 2021 Co-editor of Green Letters: call for applications Green Letters: Studies in Ecocriticism is looking for a new co-editor! John Parham is stepping down from his role as editor. Although he is obviously irreplaceable, we are looking for a keen new co-editor to join Samantha Walton in running the journal. Green Letters publishes four editions a year, online and in print. Editions are either themed or unthemed, edited by us or by guest editors. The new co-editor will need to oversee two editions a year. This mainly entails seeing articles through from submission to publication, or commissioning and advising guest editors to do the same. Other tasks include meeting with the publisher to negotiate contracts and page counts; seeking peer reviewers; reporting to ASLE-UKI at conferences; collaborating with our reviews editor, editorial and publishing assistants; and holding editorial board meetings, in person or online. We work on an online system, ScholarOne, so the new editor will need to be confident working with this system, following training. There are obviously many benefits to taking on this role, chief of which is being able to take a lead in commissioning and supporting new work in ecocriticism. Reflecting the interests and concerns of the membership is a real pleasure, and the finished editions — both online and in print — are beautiful and satisfying things to bring into the world. On a professional level, line managers and promotions committees often look kindly on editorial appointments like this one. More convivially, the work of editing, commissioning, providing editorial feedback and seeking peer reviewers will help you connect with a lively, international community of like-minded scholars. As is the norm in academic publishing, this role is unpaid. For this reason, we’re really looking for a new editor who holds a permanent (‘tenured’) academic position. While we recognise that this will exclude many ASLE scholars who would otherwise be perfectly suited for the role, we are also conscious that unpaid academic labour is exploitative and that the burden of unpaid work tends to fall unfairly on the most precarious in our academic communities. GL is committed to celebrating and amplifying the work of ECRs and precarious academics through publishing, guest editing and other mentoring opportunities with the journal, but we would rather this position went to someone who is recompensed in some way for their time through their academic position. If you would like to put yourself forward for the role, we ask that you email Samantha at s.walton@bathspa.ac.uk and John j.parham@worc.ac.uk to introduce yourself and your research specialisms, and to tell us why you’re interested in becoming a co-editor. To help us make a fair decision, we’d be very interested if you could suggest a theme for a future special edition. The deadline for expressions of interest is 8th February 2021, and we’d be very happy to answer informal questions before then. Posted by Vera Fibisan on 30th January 2021."
year_published = 2024
