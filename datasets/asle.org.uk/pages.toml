["https://asle.org.uk/cfp-asle-us-biennial-conference-university-of-california-davis-26-30-june-2019-proposal-deadline-1-sept-2018"]
title = "CFP: ASLE (US) Biennial Conference, University of California Davis, 26-30 June 2019. Proposal deadline now passed. | ASLE-UKI"
description = "Association for the Study of Literature and Environment (UK & Ireland)"
full_description = "CFP: ASLE (US) Biennial Conference, University of California Davis, 26-30 June 2019. Proposal deadline now passed. If as Rebecca Solnit contends, “paradise arises in hell,” when democratic communities are built from the ground up during times of disaster that leave us “free to live and act another way,” what might life in catastrophic times entail for the environmental humanities? How should we write, teach, protest, live, and act during this era when “paradise” is on fire, figuratively and literally? The Biennial ASLE Conference “Paradise on Fire” explores the connections among storytelling, real and imagined landscapes, future-making, activism, environed spaces, differential exclusions, long histories, and the disaster-prone terrains of the Anthropocene. Plenary addresses will be given by Ursula Heise, Cherríe Moraga, Melissa K. Nelson, and Nnedi Okorafor. Full details HERE. Posted by Vera Fibisan on 15th June 2018."
year_published = 2024
