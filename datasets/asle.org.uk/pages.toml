full_description = "ASLE-UKI Online Seminar: ‘Blue Extinction: Biodiversity Loss in Aquatic Environments’. Thursday 27 May 2021 ASLE-UKI Online Seminar Series Next Seminar: Thursday 27 May 2021 Blue Extinction: Biodiversity Loss in Aquatic Environments Convenor: Vera Fibisan (University of Sheffield) Date and Time: Thursday 27 May 2021, 10.00 am to 4.00 pm. How to Take Part: free but please register to attend via Eventbrite. Morning panel, 10.00 am BST (Moderator: Vera Fibisan) Dr Killian Quigley (The University of Sydney) – ‘The Incredible Refuse of the Sea’: Cemetery Ecologies of the Ocean Floor Dr Tom Bristow (James Cook University) – ‘nothing but the start of terror’ Dr Maria Beger (University of Leeds) – Title TBC Afternoon panel, 2.00 pm BST (Moderator: Dr Rachel Murray) Prof Steve Mentz (St. John’s University) – ‘We Will All Be Marine Mammals Soon’: Oceanic Dislocation and Extinction from Shakespeare to the Left-to-Die Boat Prof Dolly Jørgensen (University of Stavanger) – ‘Extinction remains: Museum collection practices and the hunt for Caribbean monk seals’ Dr Tom Webb (The University of Sheffield) – ‘Extinction in the sea: what do we know, and what can we expect?’ Registration is free but please register in advance. Register Now. To find out more about future ASLE-UKI events, please click here. Our seminars are free to attend, but there are some costs involved in their organisation. If you enjoyed the seminar, please do consider making a small donation to help cover our costs. Donate Now via PayPal Posted by Vera Fibisan on 21st March 2021."
