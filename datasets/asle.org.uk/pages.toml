["https://asle.org.uk/events/galway-2025"]
title = "ASLE-UKI Biennial Conference: Galway 2025 | ASLE-UKI"
description = "Association for the Study of Literature and Environment (UK & Ireland)"
full_description = "ASLE-UKI Biennial Conference: Galway 2025 Call for Papers Association for the Study of Literature and Environment, UK and Ireland, Biennial Conference 2025 ‘Erosion – Creimeadh’ 9th August (Online Day); 12th-14th August 2025, University of Galway The deadline for proposals has now passed. Confirmed Keynote Speakers: John Brannigan, Nessa Cronin, Malcolm Sen, Lisa McInerney The 2025 conference for the Association for the Study of Literature and Environment, UK and Ireland (ASLE-UKI) will be hosted by the University of Galway, Ireland. ASLE-UKI welcomes participation from scholars, readers, and creative practitioners interested in the relationships between literatures, environments and cultures – past, present, or future from anywhere in the world. The theme of the 2025 conference is Erosion – Creimeadh. (Creimeadh is the Irish word for erosion: pronounced ‘crem-oo’). Erosion is a slow, gradual type of degradation. It is hard to perceive, with its effects often only becoming visible over time through generational knowledge, art, or technology. Yet, erosion also contains the risk of suddenness, as once it reaches a certain point, disasters such as floods, mudslides, or avalanches can strike. Erosion is a salient example of Rob Nixon’s concept of “slow violence” (2011), or Timothy Morton’s concept of the “hyperobject” (2013), which express the difficulty of dealing with nonhuman scales when there are calls for action. How can literature and culture be a way to perceive, theorise, or address erosion? As with previous ASLE-UKI conferences we are happy to receive papers on any aspect of literature, culture, and environment, but we particularly welcome responses to the conference theme. Topics may include, but are not limited to, the following: Scale: erosion invites us to reflect on that which exceeds the usual operational scales of political action, at institutional, infrastructural, interpersonal, and organisational levels. Can we use ecocriticism to face open scales, regardless of how and where we live? How can we re-think time and space at larger scales, in secular or nonsecular ways, enabled and demanded by what we now face as our political and ecological long-term horizons? And how do we still acknowledge and address the risks of sudden local catastrophes? Temporality: erosion elicits a sense of slow and ancient time. In postcolonial contexts such as Ireland, there is often a longstanding sense that landscapes, language, culture, or economic sovereignty are being eroded. Yet, concepts of slow and ancient time can relegate postcolonial contexts to the past and obscure their imbrication in present networks of economy and power. How do we situate ourselves within temporalities of erosion? Resistance: can resistance to ecological, social, neo-colonial, or economic oppressions be forces of counter-erosion, chipping away at destructive processes? How does one respond to erosion when it has been caused unjustly through exploitation, extraction, pollution, colonialism, politics, or economics? What are the sources of ideological inspiration for subcultures that are developing in the face of ecological or indeed imminent landscape collapse? Language and materiality: how does one write from the perspective of the eroded, whether it be an ecosystem, a species, a language, a culture, or an economy? who are the ‘natural’ actors in erosion processes? What materialities are at play when objects collide with each other during erosion? How might erosion contradict ideas of the aesthetic itself as the ‘natural’ dwelling place of the speculative, the prophetic, the sublime, and other modes of limitlessness? As the conference is being held in the west of Ireland, we also particularly invite papers that consider the conference theme and/or the broader topics of literature, culture, and environment in the UK and Ireland, and which consider the interrelationships in these islands between histories, languages (including English, Irish, Scots Gaelic, Welsh, and others), literatures, and/or ecologies. Proposal formats may include: Individual scholarly, creative-critical, or creative papers/performances of 20 minutes. Preformed panels of three or four papers/dialogues/performances. Roundtable discussion panels with three to five participants. We can facilitate hybrid participation where possible. All delegates must be members of ASLE-UKI or an ASLE affiliate association. Membership information can be found at: https://asle.org.uk/membership/. For more information, please contact us at: asleuki2025@gmail.com. A note about our location in Galway, Ireland. Situated at the edge of the Atlantic Ocean, the west of Ireland suffered intensely from the Great Famine (1845-49), yet maintained its Irish language communities and traditional heritage despite colonisation. Galway currently constitutes one of the most youthful and diverse communities in Ireland. Ireland’s literature is strongly linked to west of Ireland landscapes, traditions, wildlife, and waterways – with Galway in particular having strong links with William Butler Yeats (whose home Thoor Ballylee is approximately 30 KM from the conference venue), James Joyce (whose wife Nora Barnacle grew up in the immediate environs of the University of Galway), John Millington Synge (whose plays were inspired by the Aran Islands off Galway’s coast), and Lady Augusta Gregory (whose Coole Park home was the birthplace of the Irish literary revival). In the contemporary period, the region is home to many writers, artists, and theatre-makers; the University of Galway itself includes amongst its staff Elaine Feeney (longlisted for the Booker Prize in 2023) and Mike McCormack (longlisted for the Booker Prize in 2017, and awarded the Goldsmith’s Prize in 2016). Participants to the conference will have many opportunities to experience these distinctive – and in many ways unique – natural, cultural, and scholarly features. Galway and its university are also closely connected to Irish-language literature and culture. The Gaeltacht (Irish-speaking regions of Ireland) stretches out from the west of the city, encompassing Conamara and the Aran Islands. An Taibhdhearc (Ireland’s national Irish language theatre) is located in the city centre. Many Irish-language literary figures are associated with the city and county, including Máirtín Ó Direáin, Pádraic Ó Conaire, Eoghan Ó Tuairisc, Caitlín Maude, Joe Steve Ó Neachtain, Seán Ó Curraoin, and Sorcha Ní Ghuairim. Information about conference venue, travel, and accommodation Conference Venue University of Galway is located within a 15-minute walk of Galway city centre. Our conference venue is located within a 15-minute walk of campus accommodation. The University can also be reached through certain routes on the main city bus service run by Bus Éireann: https://www.buseireann.ie/routes-pages/galway-city-services Galway city is served by an extensive public transport network linking Dublin (2 hours 30 minutes by car/bus), Shannon (1 hour 5 minutes by car/bus), and Knock (1 hour 5 minutes by car/bus) airports. Travelling to Ireland Ferry There are regular ferry routes from England, Wales, Scotland, and France to the following ports: Dublin Port (dublinport.ie), located approximately 2 hours 30 minutes’ drive from Galway city Belfast Harbour (www.belfast-harbour.co.uk/port/), located approximately 4 hours’ drive from Galway city Rosslare Harbour (www.rosslareeuroport.ie/en-ie/), located approximately 4 hours’ drive from Galway city Visit www. irishferries.com or www.stenaline.ie for further information. Most ferry companies offer Sail & Rail packages to combine ferry and rail tickets for a discounted price—enquire via the company website or contact office. Air There are daily direct flights to Ireland from a wide range of cities in the United Kingdom, Europe, and the United States, along with flights from the Emirates. Airports include: Ireland West Airport Knock (www.irelandwestairport.com), located just over 1 hour’s drive from Galway city Shannon International Airport (www.shannonairport.com), located just over 1 hour’s drive from Galway city Dublin Airport (www.dublinairport.com), located approximately 2 hours and 30 minutes’ drive from Galway city Getting to Galway Galway city is served by an extensive public transport network linking Dublin, Shannon, and Knock airports. This includes: Irish Rail (www.irishrail.ie), offering numerous daily train transfers from Dublin and other cities with travel time from 2 hours 30 minutes Regular bus services operated by Bus Éireann and Citylink, with fully air-conditioned coaches equipped with free Wi-Fi. The motorway from Dublin Airport to Galway City allows for travel time from 2 hours 30 minutes, with direct bus services operating every half hour (Dublin Airport Terminal to Galway City Centre). Knock and Shannon Airports are currently serviced by Bus Éireann. Accommodation University Accommodation The University’s campus residences are located within a 15-minute walk of the conference venue. Conference delegates will be able to avail of a special discounted rate for the campus residence, Dunlin Village: approximately €87.50 per night for single occupancy rooms, and €112.50 per night for double occupancy rooms (double bed only, no twin beds)–these rooms and prices are subject to availability. Booking details will be available during the conference registration Alternatively, delegates can book their own campus accommodation via the tab “Summer Stays” on the campus accommodation website: https://www.campusaccommodation.ie/students/ Other Accommodation Many fine hotels, bed & breakfasts, guesthouses, and holiday home/apartment rentals are within easy walking distance of the conference venue. Conference Bursaries ASLE-UKI is able to support up to six postgraduate students and early career researchers with the costs of presenting at the association’s conferences. The award takes the form of a £200 bursary which is paid directly to the award holder. Applications are welcome from ASLE-UKI members who are currently registered as postgraduate students or are within three years of their viva and not yet in full-time or permanent employment. Please see the application page for full criteria. How to Apply. Applications must be made online on the bursary application page. The closing date for applications is midnight GMT on Friday 21 March 2025. Bursary further details and application form Conference committee: Ashley Cahillane and Tina-Karen Pusse (co-leads); Laoighseach Ní Choistealbha; Patrick Lonergan; Maureen DeLeo; Eavan O’Dochartaigh, Henry Obi Ajumeze. #ASLEUKI2025"
