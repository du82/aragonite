["https://asle.org.uk/transitions-friday-full-programme"]
title = "‘Transitions’ Friday Full Programme | ASLE-UKI"
description = "Association for the Study of Literature and Environment (UK & Ireland)"
full_description = "‘Transitions’ Friday Full Programme Programme: Friday 1 September 2023 This page includes the programme for Friday 1 September 2023. Follow this link for the outline programme. Abstracts for all papers and panels are available by following the links below. Abstracts of individually submitted papers Abstracts of roundtables and preformed panels All events take place in 502 Teaching Hub, University of Liverpool. 8.30am: Registration and Refreshments 9.00am: Parallel Sessions 5 Zoom link for ALL FRIDAY PANELS (click link and then choose the breakout room that corresponds to the physical room in which the panel is taking place): https://liverpool-ac-uk.zoom.us/j/97354521316?pwd=dDJqVUwxcExPRzNzbVB3NjcwZmZaQT09 Meeting ID: 973 5452 1316 Passcode: t^T2XDuB 5.1 Gardeners Whirled Time: Friday 1 September 2023, 9.00am – 10.45am Chair: Daniel Abdalla Room: Teaching Room 4 Jude Piesse (Liverpool John Moores University) Darwin’s ecological vision and the garden at The Mount Alice Burns (University of Liverpool) The Transformation of Beatrix Potter: Author, Landowner, Conservationist Benjamin Ong (University of St Andrews) From Kew to Kiew: Habits and habitats in transition Andrea Raso (Roma Tre University, Rome, Italy) Com-posting New Ecological Memory: Derek Jarman’s Modern Nature as a Sympoietic Transition towards Death 5.2 Ecopoetic Energies Time: Friday 1 September 2023, 9.00am – 10.45am Chair: Harriet Tarlo Room: Flex 1 Sarah Daw (Cardiff University) Quantum Physics and Concrete Ecopoetics: Eric Mottram and Allen Fisher Martin Schauss (University of Edinburgh) Transitioning Ecopoetic Energies Fred Carter (The University of Glasgow) Forms of Exhaustion: Poetry, Entropy, & Kinetic Aesthetics Marc Charron (University of Ottawa) Recycling Translations as an Eco-Responsible Creative Practice 5.3 Transitional Aesthetics Time: Friday 1 September 2023, 9.00am – 10.45am Chair: Enaie Maire Azambuja Room: Flex 2 Helen Tookey (Liverpool John Moores University) Thinking with the Swerve: Carola Luther’s Poetics of Engagement Matthew Lear (The University of Edinburgh) Rewriting as Transition: Thick Language and the Ecological Stuplime in Juliana Spahr’s Well There Then Now (2011) Sreya Chatterjee (University of Leeds) An Ocean of Stories: Tentacular Thinking in Amruta Patil’s Adi Parva Aedín Ní Loingsigh (University of Stirling) Hedged in? Branching out? The hedge as symbol of transition in Jean-Loup Trassard’s L’Homme des haies [The Hedges Man] 5.4 Communicating and Co-Creating Transitions Time: Friday 1 September 2023, 9.00am – 10.45am Chair: Jasmine Kirkbride Room: Teaching Room 5 Hannah Little (The University of Liverpool) The Cultural Evolution of Climate Science Stories David Shackleton (Cardiff University) Inspiring Transitions: Afrofuturist Counter-Moods and Environmental Activism Sophia Brown (Freie Universität Berlin) Literary prize culture, ecofiction and environmental displacement: A case study of Jesmyn Ward’s Salvage the Bones 5.5. ‘Verse with wings of skill’: Examining Transitions Between Literary and Practical Texts in the Early Modern Period (Moved to Thursday Morning) 5.6 Ecologies of Reparation and Maintenance (Roundtable — Cancelled!) 5.7 Green & Blue Transitions II: Thinking Forward with the Ocean for more Sustainable Futures Time: Friday 1 September 2023, 9:00am – 10.45am Chairs: Giulia Champion and Alison Glassie Room: Lecture Theatre 2 Participants: Yi Fong Loh (University of Minnesota-Twin Cities) JR Carpenter (University of Southampton) Anna Selby (Manchester Metropolitan University) Julia Jung (German Marine Research Alliance) 5.8 (Un)Just Transitions: Modelling Intergenerational Climate Futures in Recent Anglophone Fiction and Non-Fiction Time: Friday 1 September 2023, 9:00am – 10.45am Chairs: Adeline Johns-Putra Room: Lecture Theatre 3 David Higgins (University of Leeds) Procreation, Modelling, and Uncertainty in the Climate Essay Julia Hoydis (University of Klagenfurt) Resilience, Routines, and the Figure of the Child to Come in Realist Disaster Novels Roman Bartosch (University of Cologne) Teaching the Future Imperfect: Intergenerational (In)Justice and Future-Making in the Literature Classroom 10.45am: Break 11.00am: Parallel Sessions 6 6.1 Coastal Zones and Littoral Literatures Time: Friday 1 September 2023, 11.00am – 12.30pm Chair: Carolin Böttcher Room: Teaching Room 6 Jayd Green (University of Suffolk) Coastal pastoral: Exploring retreat and return in coastal towns through creative writing Christian Schmitt-Kilb (University of Rostock, Germany) Genre and the Anthropocene: Focusing the Coast in Recent Literary Texts Eleanor Rees (Liverpool Hope University) Stone to Sand: A Posthuman Lyric ‘I’? 6.2 Temporalities of Transition Time: Friday 1 September 2023, 11.00am – 12.30pm Chair: Sam Walton Room: Teaching Room 4 Adeline Johns-Putra (Monash University Malaysia) Cultural Histories of Climate: The View from China Kathrin Bartha-Mitchell (Goethe University Frankfurt, Germany) Transitioning to Intergenerational Justice: Reimagining Generational Crises through Transcultural Anglophone Fiction Berna Köseoğlu (Kocaeli University, Kocaeli, Turkey) The Transition from the Agricultural to the Industrial System in J.G. Ballard’s The Drought: A Novel: Ecological Destruction, Water Crisis and Environmental Disaster 6.3 Metamorphoses and the More-Than-Human Time: Friday 1 September 2023, 11.00am – 12.30pm Chair: Jill Rudd Room: Teaching Room 5 Madeleine Rose (University of Oxford) ‘You can hear the whole world whispering’: Transitions Between Human and Non-human Language in Charlotte Mew’s Dramatic Monologues Alison Sharrock (The University of Manchester) Hunter and hunted: metamorphic relations Jasmine Walker (The University of York) Transecology in Emmanuelle Pagano’s Les Adolescents Troglodytes 6.4 Migration and Diaspora Time: Friday 1 September 2023, 11.00am – 12.30pm Chair: Vera Fibisan Room: Lecture Theatre 2 Stanislav Kolář (University of Ostrava, Czech Republic) Searching for the Pastoral in Anti-pastoral Environments in Jewish American Fiction Mònica Tomàs (Rutgers University) Animal transformations and forced assimilation in Horacio Quiroga’s “Juan Darién” and Karen Russell’s “St. Lucy’s Home for Girls Raised by Wolves” Annie Webster (University of Edinburgh) Shadow Play and Migrant Justice at COP26: Tracing the Literary History of Little Amal Through Syria’s khayāl al-ẓill (shadow theatre) 6.5 Infrastructures for Transition Time: Friday 1 September 2023, 11.00am – 12.30pm Chair: Philip Dickinson Room: Lecture Theatre 1 Xiaoxiao Ma (University of Leeds) ‘Stately roads / Easy and bold’: Transport and Transition in Wordsworth’s The Excursion Anna-Tina Jedele (Tampere University, Finland) Promising Infrastructures? Imagining the Transition to Clean Energy in Ben Smith’s dystopia Doggerland Madonna Kalousian (The University of Cambridge) The Cairene Ecocide: Carers, Carriers, and the Nature of Events 6.6 Re-thinking Crisis Time: Friday 1 September 2023, 11.00am – 12.30pm Chair: Axel Goodbody Room: Flex 1 Matthew Griffiths (Independent Scholar) ‘No more returning’: Djuna Barnes’ interwar p/Pastoral as stalled transition Tanya Gautam (The European University for Well-Being, Central Office, Cologne, Germany) Lyric Vulnerability and Multispecies Kinship in Contemporary Ecopoetry Hannes Bergthaller (National Taiwan Normal University) Falling into the Anthropocene: Taiwan’s Great Acceleration, According to Huang Chun-ming 6.7 Estranged Earth: Terraforming Beyond the Human Time: Friday 1 September 2023, 11.00am – 12.30pm Chair: Chris Pak Room: Flex 2 Peter Sands (University of York) Between Hopepunk and Misanthropy: Species Revival, Terraforming and Queer Planetary Futures Samantha Hind (The University of Sheffield) Wilderness States: Speculative Conservation Zones and Rewilding in Diane Cooke’s The New Wilderness (2020) Christie Oliver-Hobley (Independent Scholar) Terra Beneath the Waves: The Earth-sculpting Aliens of John Wyndham’s The Kraken Wakes (1953) 6.8 Blue Humanities in Transition Time: Friday 1 September 2023, 11.00am – 12.30pm Chair: Rebecca Macklin Room: Lecture Theatre 3 Hannah Boast (University of Edinburgh) Blue Humanities in Japan Susanne Ferwerda (Utrecht University) Underwater and Outer Space: Blue Humanities in the Pacific Ashley Cahillane (Galway/UCD) Transnational thinking with hydrofictions: keeping us grounded 12.30pm: Lunch 1.30pm: Plenary 3: Brycchan Carey “An Unnatural Trade: The Ecopoetics of Antislavery” (Lecture Theatre 2) Chair: Paul Baines This will be a condensed version of the final chapter of my forthcoming book The Unnatural Trade which shows how abolitionists made use of natural history writing as evidence for the antislavery cause. This paper will concentrate on three poets, the Scot James Grainger and the Liverpool poets William Roscoe and Edward Rushton. It will show how they used the three Virgilian poetic forms – georgic, epic, and eclogue – to construct an argument that the slave trade was not ‘merely’ cruel and inhuman, but unnatural as well, disturbing the natural balance in Africa and the Caribbean. Zoom link for plenary:vhttps://liverpool-ac-uk.zoom.us/j/97402150058?pwd=WTZDeE95elYxQ0tzTS9LZzFFdHNJZz09 Meeting ID: 974 0215 0058 Passcode: ^.kpcF=5 3.00pm: Closing Remarks and Raffle: Samantha Walton (incoming ASLE-UKI President) and Conference organisers (Lecture Theatre 2) 4.00 pm: Conference ends"
