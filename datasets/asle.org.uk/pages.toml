full_description = "CFP: ASLE-UKI Biennial Conference, Univ. of Plymouth, 4-6 September 2019. Proposal deadline 1 April 2019. The University of Plymouth is delighted to be hosting the 2019 Biennial Conference of the Association for the Study of Literature and the Environment, UK and Ireland. Confirmed Plenary Speakers: Greg Garrard (University of British Columbia) David Higgins (University of Leeds) Adeline Johns-Putra (University of Surrey) Harriet Tarlo (Sheffield Hallam University) While proposals on all and any aspects and periods of environmental literature are welcome, this year’s theme is ‘Co-emergence, Co-creation, Co-existence’. We invite proposals for individual (20-minute) papers, or pre-formed panels (90 minutes) which may comprise traditional panels of 3 or 4 papers, roundtables or paper jams with 6 or more speakers, or other innovative formats. We welcome proposals for creative contributions or creative-critical dialogues. The deadline for proposals is April 1st 2019. More details HERE Posted by Vera Fibisan on 23rd October 2018."
