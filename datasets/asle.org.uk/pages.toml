["https://asle.org.uk/cfp-without-end-documents-of-research-univ-of-northampton-16-feb-2018-proposals-due-1-nov-2017"]
title = "CFP: Without End – Documents of Research, Univ. of Northampton, 16 Feb 2018. Proposal deadline now passed | ASLE-UKI"
description = "Association for the Study of Literature and Environment (UK & Ireland)"
full_description = "CFP: Without End – Documents of Research, Univ. of Northampton, 16 Feb 2018. Proposal deadline now passed The intent of this interdisciplinary symposium and exhibition is to reflect on the research process, of being in research, and the documents which facilitate and inform it. The term ‘document’ is open ended, it may refer to text or image; audio or visual; object, artefact or specimen. A document can look forward and back; it can be ‘reached in to’ as a source of ideas and it can be ‘reaching’ in its speculations. From notebook to soil sample, post-it note to statistical data, the document may be the marker of a thought or a way to manage the restless plurality of thinking. Whatever they be, what is of interest is how documents operate as research and the possibilities they enshrine. Full details HERE Posted by Vera Fibisan on 1st August 2017."
year_published = 2024
