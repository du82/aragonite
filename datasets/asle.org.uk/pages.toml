full_description = "Abstracts Abstracts of Papers These are the abstracts of individually submitted papers. They are presented in alphabetical order by surname. Switch to Abstracts of Roundtables and Preformed Panels. Ana Alho (University of Lisbon) Iconographic reading of the gargoyles and the respective hydraulic system in the Westminster Abbey. Panel 1.1, Tuesday 6 September, 11.00 am – 12.45 pm, Room 214 Westminster Abbey is a particular case in the history of English medieval architecture. Its construction began in 1245, having emerged by the will of a single person: King Henry III. It was he who financed the work almost in its entirety. This monarch sought to strengthen the position of the English monarchy in relation to powerful France. Saint Edward was his trump card, since there was still, at that time, no saint in the lineage of French kings. The reconstruction of King Edward’s tomb thus represented a part of the enormous efforts undertaken towards the revaluation of the English royal house. The new Westminster Abbey was not only to become one of the most magnificent churches in the West, supplanting all the great buildings in the kingdom, but also, and above all, to overcome competition from the great French cathedrals. This is how Westminster became the most “French” church in English Gothic. For this international congress, we will focus our attention on the hydraulic system of Westminster Abbey, from the collection, distribution and evacuation of the water, to the registration, description and iconographic analysis of the gargoyles present in the built complex. Amal Al-Rowisan (University of Birmingham) Robinson Jeffers’s Perception of and Responses to Modernization: A Critique of historical Cycles Vs Deep Time Panel 4.2, Wednesday 7 September, 9.00 am – 10.45 am, Room 213 With the development of the science of ecology, ecopoetry extends the ecocritical critique by critiquing the socio-political and economic ideologies behind the human and nonhuman relationship and advocating ethical relations. Through this critique, it presents the contrast of this relationship in different historical periods through themes of Ages and cycles. This paper presents Robinson Jeffers’s poetry on modernity as an example of ecopoetic critique of historical cycles. It aims at presenting Jeffers’s perception and response to modernization. Consequently, this modernization results in exploitation and ecological violence for the prosperity of the culture which makes it different from deep time. Jeffers responds to these rapid cultural changes that impact both humans and their environment in three different responses. First, Jeffers responds to the cultural changes and humans’ acts of prosperity by accepting them as part of the historical cycles while at the same time socially withdrawing from the culture. He accepts the emergence of this historical time as an inevitable which he tries to shield from. Jeffers’s “Shine, Perishing Republic” relates the necessity of physical withdrawal as a retreat from modernization and cultural destructive expansion. Secondly, Jeffers proposes a restoration to basic enduring values of deep time through his contrast with the permanence and the enduring power of nature and its basic symbols such as the rock, hawk, and the mountains. “Gray Weather,” presents Jeffers’s admiration of timelessness and celebration of deep time in contrast to shallowness and the changes of modernity. Thirdly, Jeffers’s response develops into a direct critique of the cultural changes that are motivated by excessive power in the context of WWII instigated by his accumulated apathy and a prolonged withdrawal. “Prescription of Painful Ends” presents a critique of present social destructive change through a contrast between the concept of change in the past and present. Andrea Ashworth (Edge Hill University, Ormskirk) ‘Maybe the Birds’: A Short Story Contemplating Environmental Disaster Panel 6.3, Thursday 8 September, 11.15 am – 12.45 pm, Room 213 Ecological upheavals, extreme weather, extinction threats – barely a week goes by without us hearing of yet another disaster, either at home or overseas. It is no wonder then, that writers are starting to engage deeply with the natural world in their work. Indeed, not only this, but many are now actively foregrounding nature, in a bid to ensure it plays as prominent a role as possible in their writing. My own practice-based research engages with the natural world in a deep way also, and involves the creation of new short stories, which aim to provide a fictional space for the environment. One story, ‘Maybe the Birds’, considers the notion of future time and imagines what might happen should an unspecified environmental disaster threaten all life on Earth. As writer Ben Okri says, in a recent article calling for creatives to engage with the climate crisis, ‘Sometimes I think we must be able to imagine the end of things, so that we can imagine how we will come through that which we imagine’. In my story, most life has succumbed to an unknown illness in the aftermath of an ecological catastrophe. One woman, a sculptor, has already lost her partner and, fearing she is becoming ill also, decides to make ceramic bird syrinxes – or voice boxes – in order to try and keep birdsong alive at least. In what may be a final act of artistic activism, she hangs these in the trees so her dog can hear them when the wind blows, her legacy being to ‘leave him the birds’ after she has gone. The story was shortlisted for the inaugural Short Fiction Wild Writing Prize in 2021 and my 20-minute presentation will feature a brief introduction and a reading from it. Lee Barron (Northumbria University) Imagining the Novacene: Artificial Intelligence and Visions of Technological Environmental Futures Panel 4.4, Wednesday 7 September, 9.00 am – 10.45 am, Room 214 This paper focuses on a science-fiction-infused mode of environmental philosophy and technological speculation. As such, the paper is based on the examination and discussion of James Lovelock’s 2019 book, Novacene: The Coming Age of Hyperintelligence. Novacene represents a distinctive artificial intelligence (AI) inspired vison of Lovelock’s long-argued Gaia thesis, based on the view that living organisms can form a self-regulating system to maintain life on Earth. In Novacene, Lovelock argues that as the planet develops from the Anthropocene, the age defined by human activity and its influence on planetary eco-systems, it will evolve into the Novacene period – the age of machine hyperintelligence. While critics such as Nick Bostrom (2017) flag dangers inherent with such an advance in artificial machine intelligence, Lovelock envisions this future as an era of benevolence because as it will not be ‘the violent machine takeover seen in many science-fiction books and films. Rather, humans and machines will be united because both will be needed to sustain Gaia, the Earth as a living planet’ (2019: xii). The paper argues that the book adds a novel ecologically-focused addition to the ‘Singularity’ prognosis for mid-twenty-first century artificial intelligence – the creation of general artificial intelligence. Hence, while critics of AI stress its negative environmental impacts (the extraction of minerals for batteries, the growing consumption of electricity to power datacentres), Lovelock envisions AI as the means of staving off ecological degradation as the Novacene epoch will be characterised by a ‘new electronic life’ or the ‘new IT Gaia’ (2019: 111). While fictional and theoretical, it is significant that a technology initiated in the 1950s and reflecting the computer-speculations of Alan Turing regarding machine thinking, Lovelock envisions AI as the key to the humanity’s environmental future, and the future of humanity. Michelle Bastian (University of Edinburgh) Engaging with phenology to understand more-than-human climate change temporalities Panel 1.4, Tuesday 6 September, 11.00 am – 12.45 pm, Room 213 Many scholars have argued that the climate crisis is in part a problem of time, with ecological, political and social systems thought to be out of sync or mistimed. Discussions of time and environment are often interdisciplinary, necessitating a wide-ranging use of methods and approaches. However to date there has been little to no engagement from humanities or the social sciences with the scientific field of phenology, the scientific study of life cycle timing across species, including plants, animals and insects. Eco-literary studies has been one exception where the phenological work of Henry Thoreau, Aldo Leopard and Gilbert White, have drawn increasing attention. In this paper I will discuss findings from a new field philosophy project that works with ecologists and citizen scientists to ask ‘what is time?’ via the study of phenology. I will suggest that phenology can offer environmental humanities scholars novel inroads to thinking through temporal relations across species and environments. Drawing on Elaine Gan and Anna Tsing’s (2018) interest in the way time participates in processes of ‘how things hold’ I’m interested in how the flexibility of time and timing, issues at the heart of phenology, play a role in adaptation to change. What can we learn about the range of temporal strategies that plants, animals, fungi and others use to respond to changing climates, and what can we learn from them? In particular, what kinds of research possibilities might open up from more interdisciplinary conversations? In sum, this paper will propose phenology as a novel and fascinating avenue for thinking about the role of time in multispecies efforts to recuperate, repair and transform in a time of climate change. Jenny Bavidge (University of Cambridge) ‘A place of endless magic’: Childhood and Time in the work of Robert Westall Panel 5.3, Thursday 8 September, 9.00 am – 10.45 am, Room 223a This paper will examine the landscapes of Robert Westall’s North-East England, both realist and fantastical. Westall was an important and popular writer of the twentieth century but is now perhaps less read than authors who share some of his style and concerns, such as Alan Garner. Like Garner’s novels, Westall’s writing for children invites his readers to think and travel in deep time, activating, to use Nick Campbell’s term, ‘the archaeological imagination’ of post-war British children’s fiction. Focusing on Westall’s The Wind Eye (1976) and the time-slip story The Watch House (1977), plus a trip west to look at the folk-horror of The Scarecrows (1981), this paper will seek to add to existing discussions of Westall’s representation of the North-East in the light of ecocritical thinking. Westall’s landscapes are constructed through anthropocenic layering of pastoral memory and industrial ruin and I will argue that the novels are narrated in a mode of specifically Geordie eco-gothic, in which the afterlife of the Tyne’s industries is set against and connected to the dark ‘endless magic’ of Northumberland. Hilary Bedder (Anglia Ruskin University) ‘The individual … perishes, the whole remains’. Exploring long-term continuous and multi-species life in Olive Schreiner’s The Story of an African Farm Panel 5.1, Thursday 8 September, 9.00 am – 10.45 am, Room 221 This paper explores the fiction of Olive Schreiner and how her use of long-term temporal frameworks emphasise life as a continuum. Focussing on The Story of an African Farm (1883), I analyse her positioning of the individual within a world of transience and humanity as a collective. I also examine how Schreiner pinpoints the human mind as problematic in that it hinders acceptance of our own transience and a long-term perspective. My paper considers Schreiner’s use of complex structural patterning which enables her to embed the long-term but also to demonstrate how cyclical time and reiterations are also integral to the temporality of life. Through presenting humankind as a species, a viewpoint advocated by Dipesh Chakrabarty (2009), I argue that Schreiner repudiates critique of the novel as unsuited to a long-term perspective. I use a vegetal perspective, particularly that of Michael Marder’s radical vegetal philosophy, to open up new readings of Schreiner’s work. Such an approach recognises how vegetal ontology blurs the boundaries between multiple and individual, life and death, temporal linearity and cyclicity, showing such boundaries to be zoocentric. I also examine Schreiner’s collective standpoint through the lens of Schopenhauer’s philosophy of the continuous nature of the ‘will’, a view that Schreiner herself recognised as having an affinity with her own vision. A Schopenhauerian perspective is also helpful in exploring Schreiner’s presentation of an evolutionary connectivity between all lifeforms that is both material and metaphysical. She promotes such connectivity as that which enables humanity to find its place within a unified and interconnected life: part of a ‘living thing, a One’. There has been little ecocritical attention paid to Schreiner, but my reading frames her work as relevant to current environmental debates, and offers Schreiner as an ecological thinker who positions humankind within a long-term and multi-species world. Armelle Blin-Rolland (Bangor University) 180 days, 100 000 years: Factory Farms, Industrial Slaughterhouses, Nuclear Sites and More-than-human Spacetimes in Contemporary France Panel 3.3, Tuesday 6 September, 3.30 pm – 5.00 pm, Room 222 180 days, the title of a 2013 novel by Isabelle Sorrente, is the duration of a pig’s life on a factory farm. 100 000 years, the title of a 2020 comics reportage by Pierre Bonneau, Gaspard d’Allens and Cécile Guillard, is the length of time during which high- and level-medium nuclear waste must remain undisturbed once buried underground. This paper thinks through these two extremes – the factory farm’s inhumane compression of a nonhuman animal’s lifecycle to industrial slaughter, the staggering beyond-human timescale of radioactive waste in deep geological repositories to-be-built – to explore narratives and counter-narratives of time and space for life on a changing planet. With a focus on the environmental history of contemporary France as a nuclear and industrial-agricultural nation, this paper analyses factory farms, industrial slaughterhouses and nuclear sites as what I term hyper-sites: as materialisations of ‘hyper-separated’ binaries (Plumwood 1993), and sites of complex more-than-human entanglements, interlocked in and opening onto – like a hypertext – broader networks of power and resistance across space and through time. It draws on a corpus that includes comics, podcasts, literature, film, art, political discourse and direct action, as texts that expose and contest the anthropocentric, gendered, (neo-)colonial, capitalist and nationalistic divisions of space and time that factory farms, industrial slaughterhouses and nuclear sites materialise, and their u"
