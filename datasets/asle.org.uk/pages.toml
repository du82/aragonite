title = "INSPIRE Lecture Winner Announced – Congratulations Helen Moore | ASLE-UKI"
description = "Association for the Study of Literature and Environment (UK & Ireland)"
full_description = "INSPIRE Lecture Winner Announced – Congratulations Helen Moore We are delighted to announce that award-winning ecopoet Helen Moore will present her work entitled Is Love the Answer? Personal and Planetary Wellbeing through the Lens of Poetry at this year’s Hay Festival on May 31. Helen is the winner of the annual Institute for Sustainable Practice, Innovation and Resource Effectiveness (INSPIRE) Lecture, organised by the University of Wales Trinity Saint David (UWTSD) and the Association for the Study of Literature and the Environment, UK & Ireland (ASLE-UKI). Helen is an award-winning poet based in Scotland. She has published two poetry collections. Her debut volume, Hedge Fund, and Other Living Margins (Shearsman Books, 2012), persuades us, in the words to Sean Borodale, ‘that poetry can drive a vital empathy into the fabric of a fragile bio-sphere’. A third collection, The Mother Country, is due in 2019. Helen has collaborated on a range of ecologically oriented projects, and in July 2016 completed a 21 month long residency with ‘Last Tree Dreaming’, a Heritage Lottery funded community project raising awareness of the heritage and future of Selwood Forest in Somerset. Further details can be found on her personal website HERE The lecture will be followed by a public discussion between Helen, Dr Jane Davidson, UWTSD Pro Vice-Chancellor for Sustainability and Engagement, Director of INSPIRE and former Welsh Government Minister for Sustainability, and Professor Brycchan Carey, Chair of ASLE-UKI. Further information HERE. Posted by Vera Fibisan on 23rd April 2018."
year_published = 2024
