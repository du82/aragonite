["https://asle.org.uk/the-2019-asle-inspire-lecture-competition-call-for-entries"]
title = "The 2019 ASLE/INSPIRE Lecture Competition – CALL FOR ENTRIES | ASLE-UKI"
description = "Association for the Study of Literature and Environment (UK & Ireland)"
full_description = "The 2019 ASLE/INSPIRE Lecture Competition – CALL FOR ENTRIES THE 2019 ASLE/INSPIRE PUBLIC LECTURE on LITERATURE AND SUSTAINABILITY Winning lecture to be delivered at the 2019 Hay Festival, Hay-on-Wye, May-June 2019 Sustainability is a matter of culture as much as it is about politics or environmental science. The stories we tell, the poems we compose, the dramas we enact—all provide spaces for inspiration, imagination, and debate over what it means to live sustainably. This competition invites submissions that explore how literature, in any of its forms, responds to the past, present, or future environment or to environmental concerns, be it through engagements with nature, place, and landscape, with the life sciences, ecology, or environmental science, or in the context of debates around sustainability, energy use, or climate change. Entrants should submit the text of a half-hour public lecture which is appropriate for a broad public audience which may include school children, interested lay-people, activists, literary critics, or sustainability practitioners. The winner of the competition will be invited to deliver her/his submission as ‘The 2019 INSPIRE Lecture on Literature and Sustainability’ at the 2019 Hay Festival of Literature and the Arts (Hay-on-Wye, 23 May – 2 June 2019). The lecture will be followed by a public discussion between the competition winner and Jane Davidson, Director of INSPIRE and former Welsh Government Minister for Sustainability, and Brycchan Carey, Chair of ASLE-UKI. Full details HERE Posted by Vera Fibisan on 9th December 2018."
