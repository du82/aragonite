full_description = "New ASLE-UKI Podcast Now Available Green Listening: Discussions in Ecocriticism The second in our series of podcasts run by the ASLE-UKI Postgraduate and Early Career Representatives is now available, introduced by Sarah Bezan from the University of York. Our podcast series is hosted by Spotify but you can listen online without needing a Spotify subscription. Episode 2, “Prospective Anthropocenes and Speculative Environments”, explores creative modes of representation that engage with problems of nature trauma. Hosted at University College Dublin, it takes the form of two tête à têtes between four scholars from Ireland and the UK. Paula McGrath (UCD) and Sam Solnick (Liverpool) talk about theatre, performance, and creative writing; Sarah Bezan (York) and Ailise Bulfin (UCD) discuss species loss and climate change. Follow the link below to listen free of charge. https://open.spotify.com/episode/2dxDjENSVfPeNTnYiHuU38?si=5929de1bddda4420&nd=1 Posted by Vera Fibisan on 18th November 2022."
