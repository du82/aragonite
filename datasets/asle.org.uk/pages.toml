["https://asle.org.uk/call-for-entries-the-2020-asle-uki-inspire-public-lecture-on-literature-and-sustainability-at-the-hay-festival-deadline-for-entries-28-february-2020"]
title = "Call for Entries: The 2020 ASLE-UKI/INSPIRE Public Lecture on Literature and Sustainability at the Hay Festival. Deadline for entries 28 February 2020. | ASLE-UKI"
description = "Association for the Study of Literature and Environment (UK & Ireland)"
full_description = "Call for Entries: The 2020 ASLE-UKI/INSPIRE Public Lecture on Literature and Sustainability at the Hay Festival. Deadline for entries 28 February 2020. The competition for the 2020 ASLE-UKI/INSPIRE Public Lecture on Literature and Sustainability at the Hay Festival is now open. The winning lecture will be delivered at the 2020 Hay Festival, Hay-on-Wye, 28 May 2020 Sustainability is a matter of culture as much as politics or environmental science. The stories we tell, the poems we compose, the dramas we enact—all provide spaces for inspiration, imagination, and debate over what it means to live sustainably. This competition invites submissions that explore how literature, in any of its forms, responds to the past, present, or future environment or to environmental concerns, be it through engagements with nature, place, and landscape, with the life sciences, ecology, or environmental science, or in the context of debates around sustainability, energy use, or climate change. Entrants should submit the text of a half-hour public lecture appropriate for a broad public audience which may include school children, interested lay-people, activists, literary critics, and sustainability practitioners. Lectures should be lively and accessible, avoid academic jargon or complex theorisation, and should aim to be both thought-provoking and entertaining. Unrevised academic papers will not be considered. The competition is jointly organised by the Institute of Sustainable Practice, Innovation and Resource Effectiveness (INSPIRE) at the University of Wales, Trinity St. David (www.uwtsd.ac.uk/inspire), and the Association for the Study of Literature and Environment, UK and Ireland (ASLE-UKI; www.asle.org.uk). The winner of the competition will be invited to deliver her/his submission as ‘The 2020 INSPIRE Lecture on Literature and Sustainability’ at the 2020 Hay Festival of Literature and the Arts (Hay-on-Wye, 21–31 May 2020). The lecture will take place on Thursday 28 May and is followed by a public discussion between the competition winner and Jane Davidson, Director of INSPIRE and former Welsh Government Minister for Sustainability, and Brycchan Carey, Vice-President of ASLE-UKI. ASLE-UKI will pay one night’s accommodation and reasonable travel expenses to Hay within the UK. Entry to the competition is free. Only one entry per person is permitted. Please submit the text of your lecture, any accompanying power point presentation, and include a brief (50 words) biography as well as your contact details. Entries should be submitted by email to the Competition Chair and Vice-President of ASLE-UKI, Professor Brycchan Carey: brycchan.carey@northumbria.ac.uk The closing date for entries is Friday 28 February 2020. Posted by Vera Fibisan on 6th December 2019."
year_published = 2024
