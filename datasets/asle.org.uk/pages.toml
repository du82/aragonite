["https://asle.org.uk/asle-uki-book-prize-2023"]
title = "ASLE-UKI Book Prize 2023 | ASLE-UKI"
description = "Association for the Study of Literature and Environment (UK & Ireland)"
full_description = "ASLE-UKI Book Prize 2023 ASLE-UKI Book Prize 2023 We are pleased to announce that the competition is now open for the 2023 biennial ASLE-UKI book prizes. There will be two categories. the best academic monograph in ecocriticism and the environmental humanities published at any time in 2021 or 2022 (please note this does not include edited collections). the best work of creative writing in any form or genre with an ecological theme published at any time in 2021 or 2022. The initial long list will be drawn up from nominations received from members of ASLE-UKI, our international affiliates, or from publishers. Members are welcome to nominate their own books. Nominations will be restricted to one per person (or publisher) for each category. The judging panel will be drawn from the current ASLE-UKI committee. For a book to be considered, either two hard copies or one hard copy and a PDF copy (or e-book) will need to be supplied to the judging panel. We will not be considering edited collections, but may introduce additional categories in future years. The winners will be announced in Autumn 2023 and each will receive a cash prize of £100. Please send nominations to the following members of the committee by January 31st, 2023, stating whether you are nominating as an ASLE-UKI member, a member of one of our affiliates, or as a publisher: Academic monograph prize: Mandy Bloomfield (mandy.bloomfield@plymouth.ac.uk) Creative writing prize: Richard Kerridge (r.kerridge@bathspa.ac.uk) Regulations The prize will be awarded to the monograph or work of creative writing that in the view of the judging panel makes the most significant new contribution to ecocriticism and/or the environmental humanities. For the critical monograph prize, the judging panel will assess the scholarly quality of the work, its quality as an aptly innovative critical response to the developing ecological crisis, and its contribution to the development of public ecological and environmental awareness and feeling. For the creative writing prize, the judging panel will assess the literary quality of the work, its quality as an aptly innovative literary response to the developing ecological crisis, and its contribution to the development of public ecological and environmental awareness and feeling. The judging panel will be drawn from members of the ASLE-UKI committee but may also include expert readers nominated by the committee. Edited collections will not be considered. For books to be considered they must have been published at any point in 2021 and 2022. Books written by members of the committee can be considered (whether self-nominated or nominated by another member), but that committee member will not take any part in the judging process in that year. Nominations can be received from members of ASLE-UKI, from members of its international affiliates or from publishers. Nominations will be limited to one per category per person. Nominations must be made by January 31st, 2023. The prize winners will be announced in Autumn 2023 and each will receive a cash prize of £100. Posted by Vera Fibisan on 21st November 2022."
