title = "The 2018 ASLE/INSPIRE Public Lecture Competition. Deadline passed. | ASLE-UKI"
description = "Association for the Study of Literature and Environment (UK & Ireland)"
full_description = "The 2018 ASLE/INSPIRE Public Lecture Competition. Deadline passed. Winning lecture to be delivered at the 2018 Hay Festival, Hay-on-Wye, Thursday 31 May 2018 Sustainability is a matter of literature as much as it is about politics or environmental science. The stories we tell, the poems we compose, the dramas we enact—all provide spaces for inspiration, imagination, and debate over what it means to live sustainably. This competition invites submissions that explore how literature, in any of its forms, responds to the past, present, or future environment or to environmental concerns, be it through engagements with nature, place, and landscape, with the life sciences, ecology, or environmental science, or in the context of debates around sustainability, energy use, or climate change. Full details HERE Posted by Vera Fibisan on 16th February 2018."
