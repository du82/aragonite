description = "Association for the Study of Literature and Environment (UK & Ireland)"
full_description = "ASLE-UKI Online Seminar: ‘Early Modern Ecologies: Green Heritage’, Saturday 19 June 2021, 3pm ASLE-UKI Online Seminar Series Early Modern Ecologies: Green Heritage Convenors: Todd Borlik and Rosie Paice Date and Time: Saturday 19 June 2021, 3pm – 5pm BST How to Take Part: Register now via Eventbrite The third ASLE-UKI Online Seminar offers four talks on early modern literature and the environment. We welcome those who can join us for all or part of this seminar. Part 1 3.05 Bonnie Lander Johnson, ‘Trees and iconoclast controversy in Shakespeare and the early modern ballad tradition’ 3.25 Jennifer Munroe, ‘Colonial Botany, Knowledge-Making, and Environmental Justice: Mary Somerset’s “innocent diversion of gardening”’ 5-minute Break Part 2 3.50 Claire Eager, ‘Kenilworth and Kilcolman: Spenser’s Landscape Architectures’ 4.10 Rosie Paice, ‘Eden versus the Pratolino: Lost Gardens in Life and Art’ 4.30 Q & A Registration is free but please register in advance. Register Now. Posted by Vera Fibisan on 3rd June 2021."
