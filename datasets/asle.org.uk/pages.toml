full_description = "Association for the Study of Literature and Environment (UK and Ireland) The Association for the Study of Literature and Environment (UK and Ireland) was founded in 1998. Our aim is to represent and support scholars and writers in the UK, Republic of Ireland, and beyond who are interested in the environment and its expression in the cultural imagination. We provide a forum for ecocriticism, the environmental humanities, and cognate fields such as animal studies. Our members’ work explores the intricate relationships between human and nonhuman environments and creatures, today, in any historical period, and in a diverse range of cultural and geographical contexts. We are motivated by a commitment to ecologically progressive practices and politics, but, above all, we seek to foster a spirit of open dialogue and intellectual curiosity about how nature, environment, and animals exist in our lives. Tweets by asleuki"
