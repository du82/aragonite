full_description = "ASLE-UKI Book Prize 2021: Shortlist Announcement The ASLE-UKI committee is delighted to announce the shortlists for the ASLE-UKI Book Prize 2021. Congratulations to all those listed for making it this far in what was — for both categories — a very competitive field. We would also like to thank all those who nominated books for providing us with some really fabulous reading and making coming up with these shortlists very difficult indeed! Shortlisted titles for the Best Academic Monograph in ecocriticism and the environmental humanities Hannah Boast, Hydrofictions: Water, Power and Politics in Israeli and Palestinian Literature. Edinburgh University Press, 2020. Heather Houser, Infowhelm. Columbia University Press, 2020. Evelyn O’Malley, Weathering Shakespeare: Audiences and Open-air Performance. Bloomsbury Publishing, 2020. Samantha Walton, The Living World: Nan Shepherd and Environmental Thought. Bloomsbury Publishing, 2020. Laura A. White, Ecospectrality: Haunting and Environmental Justice in Contemporary Anglophone Novels. Bloomsbury Publishing, 2020. Shortlisted titles for the Best Work of Creative Writing in any form or genre with an ecological theme Kazim Ali, Northern Light. Milkweed Editions. (Environmental memoir) Kerri Arsenault, Mill Town. Macmillan. (Memoir) Catherine Bush, Blaze Island. Quill & Quire. (Novel) Marisol Cortez, Luz at Midnight. Flowesong Press. (Novel) Jorie Graham, Runaway. Carcanet. (Poetry) Alexis Pauline Gumbs, Dub. Duke University Press. (Poetry) Julian Hoffman, Irreplaceable. Penguin. (Non-fiction) Paul Huebener, Nature’s Broken Clocks. University of Regina Press. (Non-fiction) Craig Santos Perez, Habitat Threshold. Omnidawn Publishing. (Poetry) Ben Smith, Doggerland. Fourth Estate. (Novel) Alice Tarbuck, A Spell in the Wild. Two Roads. (Non-fiction) Posted by Vera Fibisan on 21st November 2021."
