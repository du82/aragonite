["https://asle.org.uk/john-parham"]
title = "John Parham | ASLE-UKI"
description = "Association for the Study of Literature and Environment (UK & Ireland)"
full_description = "John Parham We are deeply saddened to announce the death of our dear friend and colleague John Parham. John was a key driving force in ASLE-UKI and in the environmental humanities for more than two decades. As ASLE-UKI Secretary and editor of Green Letters for many years, he played a pivotal role in shaping the association. He was a brilliant scholar with a remarkably diverse array of interests: from Gerard Manley Hopkins to comedy to Australian punk to cultural theory (and much more besides). Ecocriticism has lost one of its most significant voices. We will miss his conviviality, kindness, humour, intellect and solidarity. There will be an opportunity to celebrate his life and work at our conference in Liverpool in August 2023. John Miller President, ASLE-UKI, 21 June 2023. Posted by Vera Fibisan on 21st June 2023."
