["https://www.asle.org/category/stay-informed/asle-ecocast"]
title = "ASLE   » ASLE EcoCast"
full_description = "What ‘Might’ The World Be, What Might It Become? Carolyn Fornoff’s Subjunctive Aesthetics 17 Feb 2025McIntyre Amy0 This podcast begins a slight turn toward ecoaesthetics in the next few episodes, and we begin with Carolyn Fornoff’s new book Subjunctive Aesthetics: Mexican Cultural Production in the Era of Climate Change (2024). Carolyn spoke to us about subjunctivity, a grammatical mood characterized by hypotheticals, and how its imaginative style has sprouted up in recent Mexican film, activism, and texts not to depict climate change in an “evidentiary” sense (a typical narrative style of eco-literature and scholarship to highlight society’s quantifiable effect on ... Fighting Extinction in the Field: A Conversation with Two North Carolina Extinction Biologists 22 Jan 2025McIntyre Amy0 In the final episode of our extinction series, we chatted with two extinction biologists, Hope Sutton and Sara Schweitzer, who work for the North Carolina Wildlife Resources Commission. Sara is the assistant chief and wildlife diversity program director and Hope is the eastern wildlife diversity supervisor. We discussed their challenges in the aftermath of Hurricane Helene in Asheville and their triumphs in the successful rehabilitation of some of the more than 100 endangered animals under their purview! While their work is field-focused, they ... Frameworks of Extinction and Negation in Cinema: A conversation with Jean-Thomas Tremblay and Steven Swarbrick 02 Dec 2024McIntyre Amy0 In this second episode of our ongoing extinction series, we sit down with Jean-Thomas Tremblay and Steven Swarbrick to discuss their thought-provoking co-written manuscript, Negative Life: The Cinema of Extinction. Our conversation with them touches not only on the concrete topics of extinction and cinema, but also explores the theoretical potential of negations and contradictions as frameworks for understanding the relationship (or not) between humans and the more-than-human world. Listen on Podbean Listen on Apple Podcasts Listen on Spotify For more from Jean-Thomas and Steven: https://jeanthomastremblay.carrd.co/ https://www.stevenswarbrick.com/ Episode recorded September 26, 2024. CC BY-NC-ND ..."
