["https://www.asle.org/join-our-community/creative-writers-and-artists"]
title = "ASLE   » Creative Writers & Artists"
full_description = "ASLE celebrates and supports the creative arts. We value the role of the arts in celebrating the natural world, raising awareness about environmental issues, allowing the expression of ideas and emotions, stimulating new ways of thinking through imaginative wordplay, exploring our relationship to place, helping us to connect to the energy of the natural world, communicating across different cultures, and bringing the activist message to a general audience. In 2014 ASLE joined the Association of Writers and Writing Programs (AWP) as a Writers’ Conferences & Centers member. With this affiliation, we hope to increase create more ways for ASLE to connect with and support creative writers. Read more about this membership and its benefits in the ASLE News article. The AWP has announced the 2017 WC&C Scholarship Competition. AWP offers three annual scholarships of $500 each to emerging writers who wish to attend a writers’ conference, center, retreat, festival, or residency. We encourage writers of fiction, poetry, and creative nonfiction to enter. The scholarships are applied to fees for winners who attend one of the member programs in AWP’s Directory of Conferences & Centers. Winners and six finalists also receive a one-year individual membership in AWP. Submissions are made through Submittable and are open through March 30, 2017. Details about the scholarship can be found through their website: https://www.awpwriter.org/contests/wcc_scholarships_overview. Winners will be announced in May. ASLE keeps tabs on journals and literary magazines, publishers, residencies, grants, and workshops for environmental and place-based writers. We also include below a list of organizations that support the environmental arts. You can find more information about opportunities in the Research & Write section: The ASLE Creative Caucus is the site for artists, musicians, readers, and any ASLE member who values the creative energy at the core of ASLE."
