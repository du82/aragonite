["https://www.asle.org/explore-our-field/ecocriticism-and-environmental-humanities/member-perspectives"]
title = "ASLE   » Member Perspectives"
full_description = "I’m a card-carrying scientist. A physical scientist. Member #1897955 of the Geological Society of America. I received my card in 1973 as an eager undergraduate in looking forward to an exciting career. And I kept it valid through a Ph.D. program at the University of Washington and as a field geologist working for the U.S. Geological Survey before leaving Alaska for New England in 1984. Generativity does not slide off the tongue easily. But this six-syllable word that is gangly knees and elbows has been growing on Julianne Lutz Warren. It is a word by which twentieth century developmental psychologist Erik Erikson meant taking intimate responsibility for others, particularly future generations. More recently, Warren noticed that Journey of the Universe authors Brian Swimme and Mary Evelyn Tucker used “generativity” to describe the nature of the Cosmos wherein, over fourteen … Ursula K. Heise, Professor of English at UCLA and author of Sense of Place, Sense of Planet: The Environmental Imagination of the Global, assesses the field of the environmental humanities for the American Comparative Literature Association’s state of the field report in March 2014. Writer and activist Janisse Ray addresses theme “A Cascade of Loss, an Ethics of Recovery” at the Center for Humans and Nature’s Forum on Ethics and Nature. Joni Adamson, Professor of English and Environmental Humanities at ASU and author of American Indian Literature, Environmental Justice and Ecocriticism, addresses addresses the Princeton Environmental Institute (PEI) in 2013. Rob Nixon, Rachel Carson Professor of English at the University of Wisconsin-Madison and author of Slow Violence and the Environmentalism of the Poor, delivers the keynote address at the Utrecht Edward Said Memorial Conference in 2013. Check out, too, Nixon’s exclusive interview with ASLE members Robert P. Marzec and Allison Carruth for a 2014 special issue of the journal Public Culture. Stacey Alaimo, Professor of English at the University of Oregon and author of Bodily Natures: Science, Environment, and the Material Self, investigates the relationships between science studies and the environmental humanities."
