["https://www.asle.org/explore-our-field/diversity-justice-access-equity/diversity-caucus"]
title = "ASLE   » Diversity Caucus"
full_description = "The ASLE Diversity Caucus is a community dedicated to increasing and supporting demographic and disciplinary diversity, and to addressing issues of equity and inclusion, in the association. Its goals evolve to meet the needs and interests of ASLE members. For example, prior to the 2017 biennial conference, the Caucus formed an Access Initiative Working Group and produced a set of Access Guidelines for the conference. Since then, work has been undertaken to add a diversity statement to the Call for Proposals for the conference, support co-international liaisons to build networks across the world, and to advocate for diversity in all aspects of the conference, from the awarding of travel grants to plenary speakers. The Diversity Caucus is open to all members of the ASLE community. The Caucus meets in person at the Biennial ASLE conference and communicates between the conferences using the ASLE Diversity Caucus listserv and ad-hoc working groups. To learn more about the work of the Diversity Caucus or join the Diversity Caucus email list please contact Gisela Heffes (gisela.heffes@rice.edu) or Laura Barbas-Rhoden (barbasrhodenlh@wofford.edu)."
