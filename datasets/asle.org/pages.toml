["https://www.asle.org/join-our-community/asle-around-the-world"]
title = "ASLE   » ASLE Around the World"
full_description = "For twenty-five years ASLE has supported the intellectual work of its members around the world. The formation of ASLE-Japan in 1994 signaled an international orientation that continues in our many active affiliates in countries around the world today. These sister organizations represent a wide range of institutions, fields and interests and connect with ASLE and one another to organize lectures, readings and conference panels and to collaborate on projects and initiatives. Find out more about them by visiting their websites (click on logos below). If you are interested in forming a new international affiliate of ASLE in your respective region or nation, please consult our ASLE International Affiliate Guidelines prior to application. To apply for affiliate status, contact the current ASLE President. In addition, ASLE is committed to encouraging scholarship in literature and environment internationally. It is a growing field in many countries, but yet to be explored in many more. To promote an exchange of ideas and experiences we have initiated several new programs. Links to these are provided below the logos/links to our affiliates. Update: In May of 2019, ASLE officers reviewed the relationship with the EFSLE/FSLE organization in India, and voted to disaffiliate as the group was unable to uphold the mission of ASLE or the standards of our community."
