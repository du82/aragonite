["https://www.asle.org/explore-our-field/environmental-writing-art/member-perspectives"]
title = "ASLE   » Member Perspectives"
full_description = "Set yourself up for success by approaching peer review as a goal, not a roadblock, and by keeping your values at the heart of both your work and your writing process. So you want to publish an academic article. You’re in good company! In August 2020, ASLE graduate students gathered in Zoom University’s palatial quad to begin demystifying academic publishing in the humanities. Joining us was Dr. Anthony Lioi, a Professor of Liberal Arts and English at The Juilliard School, and one of the editors-in-chief of Resilience: A Journal of Environmental Humanities. The third and final entry in our end-of-year series of recommendations turns to connections with the nonhuman: cephalopods, marine mammals, trees, and more. Stacy Alaimo, Christy Tidwell, Heidi Hong, and Jennifer Ladino highlight four projects that cultivate and reinforce positive, joyful, and wonder-filled human relationships with other species. The second entry in our end-of-the-year series of recommendations focuses on connections between people and across cultures. These recommendations – from Jenna Gersie, Cajetan Iheka, Rina Garcia Chua, and Laura Barbas-Rhoden – are sometimes joyful (and danceable!) but sometimes more serious. Even the more serious ones, however, offer possibilities for comfort, fruitful work, expanded horizons – and hope. 2020 has been challenging, and we at ASLE would like to offer some possibilities for hope and joy. This is the first entry in a short series featuring recommendations of environmental literature, art, and media from some of ASLE’s leadership. Here, find recommendations from Heidi Scott, Mika Kennedy, and Bridgitte Barclay. They take us from Detroit to Japan, first pointing to ways of thinking differently about food and then illustrating the potential for meaning in unexpected places (animated asparagus, prehistoric turtle kaiju). Since 2013 I have been working with what I term “Soft Rebellions” as a way of questioning the representation of certain post-industrial cities in relation to my position as a woman born and bred in the city of Sheffield in the UK. These are cities whose “reason for being”, their industry, has transformed so significantly that the use of their nicknames: “The Potteries” (Stoke-on-Trent, UK), “The Motor City (Detroit, USA), “The Steel City” (Sheffield, UK), becomes a melancholy gesture that talks about the past, not the now, nor the future."
