["https://www.asle.org/discussion-list"]
title = "ASLE   » Discussion"
full_description = "The ASLE Discussion List offers an accessible public forum for conversations related to the environmental humanities. ASLE currently hosts its list in Google Groups. The list is open to anyone who adheres to our rules of conduct and has an interest in posts about the environmental humanities. If you wish to join, please follow these instructions: If you have an account with Google (e.g. you’ve already signed up for Gmail, Google Docs or Google Groups) click on this link to join: https://groups.google.com/forum/?hl=en#!forum/asle-discussion-list/join. If you do not have an account with Google, click on the “create an account for free” link on the Google Accounts homepage (https://accounts.google.com/signup) to create a new Google Account. Then click on the link above. If you don’t want a gmail address as part of the signup, click on “I prefer to use my current email address” in the form. If you don’t want a Google account, you can still send and receive regular email posts, but you won’t be able to access the discussion or archives online, or manage your settings. To sign up in this way, please email info@asle.org and ask to be added to the ASLE discussion list. Please state your mail delivery preference: Abridged Email: one summary email of new activity per day Digest Email: up to 25 full new messages in a single email All Email: send each message as it arrives. Subscribers agree to follow generally accepted etiquette and the list moderator reserves the right to remove anyone from the list for violation of the discussion guidelines."
