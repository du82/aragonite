title = "ASLE   » Donate"
full_description = "We encourage you to consider a donation to ASLE. Your donation to ASLE helps us continue to inspire and promote the environmental humanities and arts. We are so grateful for you! Our members and supporters are the forces that shape and sustain ASLE, and have done so for thirty years. We continue to advocate for the importance of the humanities and the arts in crucial conversations about the environment, and hope you can help us ensure that our programs continue to support the environmental humanities and arts, and its practitioners, during a time of duress. Please consider a donation in any amount to ASLE. Your gift can help ASLE fund the program of your choice, including: The ASLE book awards in the areas of ecocriticism and environmental creative writing have recognized excellence in the field since their inception in 2007. Read more about this year’s finalists. ASLE is a nonprofit organization as outlined in Section 501(c)(3) of the Internal Revenue Service code. donations to ASLE are tax deductible in accordance with United States IRS regulations. Our federal identification number is 54-1640944. For further information or questions about donating to ASLE, contact Amy McIntyre, Managing Director of ASLE at info@asle.org or 603-357-7411 (phone and fax)."
