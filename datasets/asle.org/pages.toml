["https://www.asle.org/join-our-community"]
title = "ASLE   » Become A Member"
full_description = "Recommended Yearly Membership Rates: We offer a 10% discount on multi-year memberships Lifetime Membership: $1500 Patron Membership: $250 Sustaining Membership: $150 Yearly income over $100,000: $130 Yearly income $84,000 – $100,000: $115 Yearly income $72,000 – $84,000: $100 Yearly income $60,000 – $72,000: $85 Yearly income $48,000 – $60,000: $70 Yearly income $36,000 – $48,000: $55 Yearly income $24,000 – $36,000: $40 Yearly income under $24,000: $30 Applying online for membership in ASLE is fast and easy. Just click the button to Apply or Renew Online and complete the application form. Please note: membership is for individuals only. Institutions who would like a subscription to ISLE journal need to go through the publisher, Oxford University Press. Consult the ISLE website for fees and information. Or if you prefer to mail or fax your application, print out our Membership Form, fill it out and send it in. For almost twenty years, ASLE has enriched my life as a kind of professional home base; I look forward to each conference or new issue of ISLE as a reunion of old friends and a source of intellectual and creative inspiration. – Bernard Quetchenbach, Professor of English, Montana State University Billings ASLE is the wellspring of inspiration, a global one. When I became a member of ASLE in 2005, I knew I had arrived at a thrilling ecocriticism-filled academic landscape. But ASLE has not only been an invaluable intellectual home for me, it is also a much valued platform for true collegiality and lasting friendships. I look forward to every ASLE conference, because I am fascinated by the cutting-edge work being done in environmental humanities by members and the spirit of warm friendship that always prevails at the conference. – Serpil Oppermann, Professor of English Language and Literature, Cappadocia University (Turkey) ASLE has created a network of friends and colleagues from across the world; I have made connections with like-minded people who know how to balance their fierce intellects with the ability to have fun, who are driven by a desire to save the world while maintaining an ability to enjoy being in it, so going to the biennial conference feels a little bit like summer camp with the smart kids. – Suzanne Roberts, writer"
