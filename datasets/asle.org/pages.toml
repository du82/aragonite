["https://www.asle.org/conference/biennial-conference/participant-information"]
title = "ASLE   » Participant Information"
full_description = "For information on scheduled speakers, workshops, and events, head on over to the Schedule and Events Page. For information on travel, lodging, and dining in College Park, visit the Travel and Stay Page. The rates for registration will be set soon. In-person registration will give attendees access to all conference events, including sessions, plenary talks, lunch, events and receptions. Virtual registration will give access to live virtual concurrent sessions and recorded plenary talks; there are two virtual workshop options as well. About Registration Fees: ALL conference participants must register and pay the advertised fee including discussion leaders; presenters; chairs; co-chairs; topic and session organizers, and general attendees. Sponsors and Exhibitors who are eligible will receive codes for complimentary registration. ASLE members: Once registration opens, you may find your member discount code by logging into your account at https://www.asle.org/login/ and it will be displayed on the Member Account page, in the Additional Benefits section. If your membership has expired, you will be prompted to renew before being able to view this page. International ASLE affiliate members: contact info@asle.org and provide verification of current membership to receive the code. Code of Conduct: ALL conference participants agree to abide by the Conference Code of Conduct, posted in the tab below. Refunds/Cancellation Fee: Requests for conference registration fee refunds must be received by May 15. Refunds will be processed in the following way: 72 hours after registering, 100%. Through May 1, 75%. Between May 2-15, 50%. All registration fees are nonrefundable after May 15, 2025. Transfers: Attendee substitutions are allowed, but they must be submitted in writing to 2025asleconf@gmail.com. The substitute must be equal or less in price, or additional registration fees may be required. No refunds will be given for transfers to lower cost registration tiers. Nonmembers are welcome to join ASLE prior to registration to take advantage of the member rates. Early Bird rates will be available through May 15."
