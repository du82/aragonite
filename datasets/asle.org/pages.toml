["https://www.asle.org/explore-our-field/jobs-fellowships"]
title = "ASLE   » Jobs & Fellowships"
full_description = "If you would like to post information about a job, fellowship, or related professional opportunity, please contact the ASLE Managing Director at info@asle.org. Listings are free of charge, and will be posted if they are suitably relevant to ASLE members and constituents. Deadline for applications: February 24, 2025, 11:59 PM CST. Postdoctoral Associate in Environmental Humanities, Humanities Research Center at Rice University. The Humanities Research Center (HRC) at Rice University seeks to appoint one Postdoctoral Associate in Environmental Humanities, with an affiliation with the Center for Environmental Studies (CES). The Humanities Research Center is an internationally recognized hub that fosters innovative humanities and arts research at Rice University and builds collaborations with local, national, and global partners. We seek emergent interdisciplinary scholars pursuing research in Environmental Humanities and who have demonstrated expertise in oral history, interviews, or other related methodologies. We encourage applications from candidates working across disciplines that might use oral history methods, including but not limited to Art History, English, History, Latin American & Latinx Studies, Media Studies, Religious Studies, and Transnational Asian Studies. Supporting the invaluable work of local nonprofits, NGOs, and environmental advocates is central to the mission of the Center for Environmental Studies. We especially encourage applicants with an interest in community-engaged research, and who would benefit from and contribute to the CES’s community partnerships. The Postdoctoral Associate will have interdisciplinary homes and faculty mentors at Rice. The Associate will have an office within the HRC and will be affiliated with the Center for Environmental Studies. The successful applicant will teach the course “ENST 301: Environmental Justice” during their first semester at Rice. In other semesters, the postdoctoral associate will work with the Center for Environmental Studies director on their teaching assignment, with the possibility of teaching pre-existing core courses or new elective courses in the Environmental Studies program."
