title = "ASLE   » Member News"
full_description = "In Memoriam: Byron Santangelo 20 Aug 2024McIntyre Amy0 Byron James Morrison Santangelo died earlier this spring, in Bloomington, Indiana at age 62. He was a beloved father, husband, friend, and teacher, whose original and insightful scholarship profoundly shaped post-colonial ecocriticism, African Studies, and the environmental humanities, and whose personal kindness, wit, charm, and unflinching loyalty made him the very best friend and colleague one could ever wish to have. Born in 1961 in Queens, New York, Byron spent his early childhood in Binghamton, NY and Washington, DC. His family moved to La ... ASLE Seeks Digital Strategies Coordinator 26 Apr 2024McIntyre Amy0 ASLE is seeking a Digital Strategies Coordinator (DSC). The coordinator’s responsibilities are listed below. If you are interested in serving in this role, applications for DSC are due by September 30, 2024, and should include a letter of interest and a CV or resume. Please send all application materials, via email as PDF or Word attachments, to info@asle.org. Digital Strategies Coordinator (Term: 2024-2026) The Digital Strategies Coordinator (DSC) is an appointed position; the DSC is requested to make a commitment of three years, with renewal of appointment ... 26 Feb 20240 Regeneration: Environment, Art, Culture Journal Regeneration: Environment, Art, Culture is an open-access, peer-reviewed journal of the environmental humanities that brings humanists, activists, artists, and scientists into conversation around environmental matters. Published three times a year by the Open Library of Humanities, Regeneration prioritizes collaborative work that places different fields, disciplines, ways of knowing, and research archives in dialogue, and invites work that challenges the conventional essay form in the humanities. We welcome a wide range of submissions, particularly those that take full advantage of a multi-modal format, that ... John Parham 23 Jun 2023McIntyre Amy0 We share, via our colleagues at ASLE-UKI, the very sad news that John Parham, one of the UK’s leading ecocritics, editor of Green Letters for many years, has died: https://asle.org.uk/john-parham/ Many member of ASLE knew and loved John and his work. For those who were not as familiar, here is a link to a featured article about his Green Media pedagogy on our website: https://www.asle.org/features/green-media/"
