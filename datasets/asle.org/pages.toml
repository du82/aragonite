["https://www.asle.org/discover-asle/vision-history"]
title = "ASLE   » Vision & History"
full_description = "The Association for the Study of Literature and Environment offers access to emerging conversations and debates, innovative classroom work, as well as some of the finest environmental writing you will find anywhere. Our association works with professors, practicing writers and artists, environmental educators and activists, and environmentally concerned citizens by: There are many ways to explore what we do. Find inspiration in the field-defining statements of our members. Learn more about our intellectual commitments through our member spotlights. Check out our association journal, ISLE: Interdisciplinary Studies in Literature and Environment. Discover opportunities in our featured course and research spotlights. Seek materials for education and enrichment in our resource pages and archives. Or simply experience the fellowship of people who celebrate the joy, wonder, and gratitude that comes from active engagement with the living world by joining us as a member. Whether you are a college and university professor, a student in the environmental humanities, a practicing writer or artist, an environmental educator or activist, or an environmentally concerned citizen, we invite you to make ASLE your intellectual home. The Association for the Study of Literature and Environment (ASLE) seeks to inspire and promote intellectual work in the environmental humanities and arts. Our vision is an inclusive community whose members are committed to environmental research, education, literature, art and service, environmental justice, and ecological sustainability. ASLE was founded in 1992 by a group of scholars and writers interested in exploring the meanings of the natural environment and the complexities of human relationships with each other, and with the more-than-human world, and to deepening the impact of these explorations both within and beyond the classroom. While ecocritical teaching and scholarship developed in literary and cultural studies, our members include writers and educators who also work in interdisciplinary fields such as ecology, conservation biology, environmental history, environmental philosophy, and environmental law."
