["https://www.asle.org/explore-our-field/member-spotlights"]
title = "ASLE   » Member Spotlights"
full_description = "Kristin George Bagdanov is ASLE’s outgoing Graduate Student Liaison as well as a poet. Tova Fleming talked with her about her debut book of poetry Fossils in the Making, her work in ecocriticism as a PhD candidate at UC Davis, and her successful community-building. Cheryll Glotfelty is a co-founder of ASLE and the first professor of literature and environment in the United States. After a 30-year career at the University of Nevada, Reno, (UNR) she is retiring. To celebrate her contributions to the field of literature and environment and to ASLE, Digital Strategies Coordinator Tova Fleming spoke with her about her career, her inspirations, and her aspirations for retirement. Julianne Lutz Warren has a Ph.D. in conservation ecology and wildlife biology from the University of Illinois Urbana-Champaign, and currently serves as a Fellow with the Center for Humans and Nature. She is author of Aldo Leopold’s Odyssey (2006). Juan Carlos Galeano was born in the Amazon region of Colombia. He is the author of Baraja Inicial (poetry, 1986), Pollen and Rifles (1997) a book on the poetry of violence, and Amazonia (poetry, 2003), Sobre las cosas (poetry, 2010), Amazonia y otros poemas (poetry, 2011), and Historias del viento (poetry, 2013). Ursula K. Heise holds the Marcia H. Howard Term Chair in Literary Studies in the Department of English and the Institute of the Environment and Sustainability at UCLA, and is co-founder and Director of the Lab for Environmental Narrative Strategies (LENS). “It’s difficult to define the field of environmental studies, but I would say that it is an interdisciplinary and emerging field that is concerned with creating a sustainable and just future.”"
