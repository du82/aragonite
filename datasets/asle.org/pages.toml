title = "ASLE   » Scholar of the Month"
full_description = "Siobhan Angus: February 2025 Scholar of the Month 28 Feb 2025Bavley Madeleine0 ASLE’s Scholar of the Month for February 2025 is Siobhan Angus. Siobhan Angus works at the intersections of art history, media studies, and the environmental humanities. Her current research explores the visual culture of resource extraction with a focus on materiality, labor, and environmental justice. She is an assistant professor of Media Studies at Carleton University and holds a Ph.D. in Art History and Visual Culture from York University where her dissertation was awarded the Governor General’s Gold Medal. Prior to joining Carleton, ... Jeremy Chow: January 2025 Scholar of the Month 09 Jan 2025McIntyre Amy0 ASLE’s Scholar of the Month for January 2025 is Jeremy Chow. Jeremy Chow is an assistant professor of English at Bucknell University, which occupies the ancestral homelands of the Susquehannock peoples. Chow is the author of The Queerness of Water: Troubled Ecologies in the Eighteenth Century (2023) as well as three edited collections: Eighteenth-Century Environmental Humanities (2023), Unsettling Sexuality: Queer Horizons in the Eighteenth Century (2025) with Shelby Johnson, and The Edinburgh Companion to Queer Reading (2025) with Declan Kavanagh. How did you become interested ... ALISON MAAS: JUNE 2024 SCHOLAR OF THE MONTH 07 Jun 2024Ponce de Leon Alejandro0 ASLE’s Scholar of the Month for June 2024 is Alison Maas. Alison Maas is a PhD. Candidate in English with a Designated Emphasis in Critical Theory at the University of California, Davis. Her work has appeared in The Routledge Companion to Politics and Literature in English, Atlantic Studies, and Comparative American Studies. She is creator and producer of the podcast series “California’s Eroding Coastline” funded by the Bilinski Fellowship at Bodega Bay Marine Lab, co-editor of the Searchable Sea Literature website run by Williams Mystic, ... MICHELLE YATES: MAY 2024 SCHOLAR OF THE MONTH 10 May 2024Ponce