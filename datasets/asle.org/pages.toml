["https://www.asle.org/discover-asle/faqs"]
title = "ASLE   » FAQs"
full_description = "If you have any questions not addressed here, please get in touch with Amy McIntyre, Managing Director, at info@asle.org. There are numerous ways to participate in ASLE and its programs. Here are a few suggestions for how to become involved in our association: Become a Member Membership in ASLE is the easiest way to get connected to the activities of the organization. Read about membership and its benefits. Attend or Host an ASLE Conference In odd years we hold our ASLE Biennial Conference; in even years we sponsor ASLE-sponsored regional symposia. Find out more about these events at our Biennial Conference and Affiliated Symposia pages. Keep up on Our Latest Activities Through Social Media To promote the daily exchange of ideas between colleagues interested in the field of literature and environment or particular issues within the field, we encourage you to join in the conversations on Facebook, Twitter, and the ASLE Discussion List. Several groups within ASLE have social media sites as well, such as the Diversity Caucus and Graduate Students. Run for Office or Apply for an Appointed Position ASLE holds an election each year to elect officers (depending on the year, these offices include President, Vice President, Executive Councilors, Diversity Officer, and Graduate Student Liaison). These positions afford office holders a vote on issues of relevance to the organization. There are also numerous non-voting appointments that help ASLE to fulfill its mission, including Digital Strategies Editor, Professional Liaison Coordinator, International Liaisons, and Awards Coordinators. We also have an active Graduate Student Working Group that is always looking for volunteer members to help with projects related to student programming. To learn more or find out what positions are open now or in the future, please contact the current ASLE Co-Presidents. There are a number of points of entry for exploring our field, but our Ecocriticism and Environmental Humanities Page is a good place to start."
year_published = 2025
