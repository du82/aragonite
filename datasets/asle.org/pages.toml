full_description = "22 Feb 20250 ASLE-Sponsored Panel at the 2025 Western Literature Association Conference ASLE-Sponsored Panel at the 2025 Western Literature Association Conference Oklahoma City, OK, Sept. 21-24 Open Topic: The Association for the Study of Literature and Environment invites innovative paper proposals on any topic that integrates western North American literary/cultural studies with environmental themes or concerns. We particularly welcome proposals from graduate students and contingent faculty. WLA 2025 is a call to action to critically examine and celebrate the multicultural foundations of western literature. We look forward to your contributions in shaping this important dialogue. The conference theme ... 19 Feb 20250 ASLE-Sponsored Panel Calls for MLA 2026 The Association for the Study of Literature and Environment will sponsor one guaranteed session at MLA 2026 (January 8-11 in Toronto, ON, Canada), and also has the option of supporting an additional non-guaranteed session. At MLA 2025 in New Orleans, we had a crowd well over 100 for our guaranteed session on Donna Haraway, and were also successful in supporting a second, nonguaranteed panel on carceral environments, so there is recent momentum for strong ASLE sessions at this conference. For 2026, there is no ... 05 Jan 20250 29th Annual IAEP Meeting CFP: 29th Annual IAEP Meeting When: May 22-24, 2025 Location: Denison University The IAEP Executive Committee is excited to announce our 2025 annual meeting. To reduce the environmental impact of our environmental philosophy, we hold conferences in-person/hybrid in odd-numbered years, and fully remotely in even-numbered years. But we recognize the value of in-person conferences. This year, perhaps more than ever, we are grateful to gather in-person to strategize and energize around how our work can better pursue justice and support for our human and more-than-human kin. Our ... 05 Jan 20250 Weather(ing)s in Sinophone literature and media: ASLE 2025 Panel Panel CFP for ASLE 2025: Collective Atmospheres July 8-11, 2025 University of Maryland, College Park Weather has proven a multilayered site and methodology for ecological thinking: for Astrida Neimanis and Rachel Loewen Walker, “weathering” goes beyond endurance to a transcorporeal experience of climatic time, while for Sarah Wright, “becoming weather” entails modes of responsiveness and thick engagement that challenge coloniality and environmental injustice. This panel examines Sinophone literature and media that mobilize such atmospheres—from meteorological phenomena to the political, social, and cultural climates co-experienced by humans ..."
