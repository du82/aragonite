full_description = "ASLE Spotlight 2022, Episode 4: Nature and Memory 06 Sep 2022McIntyre Amy0 This episode was recorded Friday, June 10, 2022 Co-Hosts: Suzanne Roberts and Ryan Hediger FEATURED GUESTS/WORKS: Kazim Ali, Northern Light: Power, Land, and the Memory of Water Kazim Ali’s memoir of growing up on unceded First Nations land in Northern Manitoba reflects on responsibility, memory, immigration, and environmental justice. The child of South Asian migrants, Kazim Ali was born in London, lived as a child in the cities and small towns of Manitoba, and made a life in the United States. As a man passing through disparate ... ASLE Spotlight 2022, Episode 3: Beyond Human 06 Sep 2022McIntyre Amy0 This episode was recorded Friday, May 20, 2022 Co-Hosts: Gisela Heffes and George Handley FEATURED GUESTS/WORKS: Mandy-Suzanne Wong, Listen, we all bleed. In the literary essay collection Listen, we all bleed, radical artists from around the world use recordings of nonhuman voices to plead for an end to violence against nonhuman animals. The essays, novelistic and acutely personal, listen to fishes, whales, coyotes, elephants, chickens, and more. Central to this work is the importance of listening—just listening—as a creative effort that’s also an activist act. An EcoLit ... ASLE Spotlight 2022, Episode 2: Entangled Geographies 06 Sep 2022McIntyre Amy0 This episode was recorded Friday, April 22, 2022 Co-Hosts: Matt Henry and Jennifer Ladino FEATURED GUESTS/WORKS: Elizabeth Carolyn Miller, Extraction Ecologies and the Literature of the Long Exhaustion Extraction Ecologies and the Literature of the Long Exhaustion examines the rise of large-scale industrial mining in the British imperial world and considers how literature from the 1830s to the 1930s reckoned with a new vision of extraction-based life. The threatening horizon of resource exhaustion worked its way into narrative form as part of the discursive and imaginative process ... ASLE Spotlight 2022, Episode 1: Public Engagement and Performance 06 Sep 2022McIntyre Amy0 This episode was recorded Friday, March 18, 2022 Co-Hosts: Brandon Galm and Joshua Calhoun FEATURED GUESTS/WORKS: Janisse Ray, Wild Spectacle: Seeking Wonder in a World Beyond Humans (Use code ASLE25 valid now through 4/15/22 for a 25% discount) Looking to honor life on earth, Janisse Ray has repeatedly immersed herself in wildness. From overwintering with butterflies in Mexico to counting birds in Belize, her stories capture the joys of heart-pounding amazement, reflect on the sights of explorers like Bartram and Sacagawea, and document experiences rare in an ..."
