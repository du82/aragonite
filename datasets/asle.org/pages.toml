full_description = "18 Dec 20230 Open Rivers Call for Papers: Rights, Conflict, Water Open Rivers: Rethinking Water, Place, and Community seeks abstract submissions for features or columns for our 2025 issue on Rights, Conflict, and Water. We seek contributions that foreground the complexities and intersections of water rights and water conflicts. How is the right to water enacted in different contexts? How do “rights” and practices reciprocally inform each other? How are water rights allocated? How is water mobilized in sociopolitical practices and how is it weaponized? How does water contribute to larger social discord? How ... ASLE Spotlight 2023-24, EPISODE 2: WATERY ECOLOGIES 18 Dec 2023McIntyre Amy0 This episode was recorded Friday, December 1, 2023 Co-hosts: Serpil Oppermann and Gisela Heffes FEATURED GUESTS/WORKS: Jeremy Chow, The Queerness of Water This book reconsiders canonical long eighteenth-century narratives through the conjoined lenses of queer studies and the environmental humanities. Moving from Daniel Defoe’s Robinson Crusoe and Jonathan Swift’s Gulliver’s Travels to Gothic novels including Mary Shelley’s Frankenstein, Jeremy Chow investigates the role that bodies of water play in reading these central texts. Chow navigates various representations and phases of water to magnify the element’s furtive yet pronounced effects on narrative, theory, ... 18 Dec 20230 Religions Journal Special Issue “Postcolonial Literature and Ecotheology” Call Online: https://www.mdpi.com/journal/religions/special_issues/79339W639K Dear Colleagues, Secular criticism, as Edward Said defined it, has been central to the study of postcolonial literature (understood to include the literatures of the global south and the developing world, including Asian, African, Middle Eastern, Pacific Islands, Caribbean and Latin American literatures). It is also clear, however, that traditionally secularist readings of postcolonial literature have not given full account of the ways in which both religious and spiritual connections to the natural world (including monotheistic, polytheistic, and idiosyncratic conceptions of metaphysics ..."
