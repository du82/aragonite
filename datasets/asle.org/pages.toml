["https://www.asle.org/conference/biennial-conference"]
title = "ASLE   » Biennial Conference"
full_description = "If you wish to sponsor, exhibit, or advertise at the conference, please see our Sponsor, Exhibitor, and Advertiser Prospectus for details. As we have in the past, we will hold a number of pre-conference workshops on important and emerging topics that reflect the diversity of our approaches and our membership. These workshops will be held on the morning of Tuesday, July 8, prior to the start of general sessions in the afternoon. Anyone can sign up for a workshop during the conference registration process for an additional $20 fee; limit 15 persons per workshop. ASLE will make a small number of $500 travel awards available, as we have at past conferences. The purpose of the travel award is to substantively support members who are in precarious employment or students, who lack institutional funding, and who can reasonably demonstrate that an award will make attending the conference possible. Relatedly, the awards support members whose presence contributes to ASLE’s mission of “promoting equity, diversity, inclusion, and accessibility on behalf of the membership.” Applications for these awards will open in late .February. As environmental humanists, we recognize that in-person meetings such as the ASLE conference are largely made possible by fossil fuels and thereby contribute to climate change. Guided by the goals outlined in the 2020-2026 ASLE Strategic Plan, we selected this conference site due to its relative proximity to the majority of ASLE members as well as its connectivity to interstate rail transit. Additionally, College Park is located on the Green Line of the DC light rail metro system, and we encourage attendees to utilize it when possible. The stop is about a mile from campus. https://www.wmata.com/rider-guide/stations/college-park.cfm# The nearby area boasts several projects and landmarks of interest, including ECO City Farms, the Hyattsville Food Forests, the Rachel Carson House, and the Chesapeake & Ohio Canal. As per tradition, the conference will include field trips to such sites, as well as a local “cultural crawl.”"
