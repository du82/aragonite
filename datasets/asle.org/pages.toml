full_description = "GHOSTS AND THEIR HOSTS: The Colonization of the Invisible World in Early America 03 Feb 2025Bavley Madeleine0 By Sladja Blažan. University of Virginia Press, 2024. Still dominant today, psychological readings of ghosts have obscured the precariousness of lives affected by colonial structures of the early republic. Ghosts and Their Hosts demonstrates that in the transcultural U.S. American context, ghostly figurations were able to express human entanglements with nonhuman environments, which are explored here for the first time. Not only a corrective to metaphysical accounts, a materialist reading of ghosts is crucial to understanding the colonial history and legacy of the ... Floreana 16 Oct 2024McIntyre Amy0 By Midge Raymond. Little A, 2024. “After ten years away to build a family, Mallory returns to Floreana Island in the Galápagos, and to Gavin, the mentor with whom she had a long-ago affair. Their project is to build nests to revive the vulnerable penguin population. But Mallory doesn’t dare tell Gavin why she’s really come back. Then she discovers old journals hidden in a lava cave―confessions of another woman who needed to disappear. In 1929, Dore Strauch left the life she knew to create ... Climate Change Fiction and Ecocultural Crisis: The Industrial Revolution to the Present 16 Oct 2024McIntyre Amy0 By Tatiana Konrad. University of Nevada Press, 2024. From the publisher’s website: “Concentrating on a powerful, emerging genre, Tatiana Konrad’s Climate Change Fiction and Ecocultural Crisis provides a survey of popular narratives that further our understanding of climate change in contemporary fiction. Konrad advocates for the expansion and redefinition of the cli-fi genre and argues that industrial fiction from the nineteenth century is the first example of climate change fiction. Tracing the ways through which cli-fi outlines a history of our modern ecocultural crisis, this ... Disability, the Environment, and Colonialism 16 Oct 2024McIntyre Amy0 By Tatiana Konrad. Temple University Press, 2024. From the publisher’s website: “Drawing on contemporary and historic literary and media examples of Western colonialism and Anglophone writings, Disability, the Environment, and Colonialism traces how the perverse nature of colonialism continues to dominate the globe today. The editor and contributors provide a careful analysis of the intersection of disability, the environment, and colonialism to understand issues such as eco-ableism, environmental degradation, homogenized approaches to environmentalism, and climate change. They also look at the body as a site of ..."
