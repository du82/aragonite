title = "ASLE   » Diversity, Justice, Access & Equity"
full_description = "ASLE is dedicated to disciplinary and demographic diversity. The ASLE Diversity Officer and members of the ASLE Diversity Caucus (see link below) focus attention on issues of accessibility, equity, and inclusion within ASLE as an organization and within the environmental humanities and environmental arts more broadly. With this in mind, we have crafted a set of Accessibility Guidelines for our conferences that was first implemented in 2015, and all future committees will work closely with the ASLE to implement these inclusive measures. We are actively trying to gather and post more resources related to these issues, if you know of any that would be of interest please email us at info@asle.org. The following ASLE members have served as Diversity Officer, and we recognize here their important contributions to this work: The ASLE Diversity Caucus is a community dedicated to increasing and supporting the demographic and disciplinary diversity, and to addressing issues of equity and inclusion, in the association. Visit the Diversity Caucus page under Join Our Community to find out more."
