iation Professor of English at the University of South Florida Website http://myweb.fsu.edu/jgaleano/ Bio Juan Carlos Galeano was born in the Amazon region of Colombia. He is the author of Baraja Inicial (poetry, 1986), Pollen and Rifles (1997) a book on the poetry of violence, and Amazonia (poetry, 2003), Sobre las cosas (poetry, 2010), Amazonia y otros poemas (poetry, 2011), and Historias del viento (poetry, 2013). He teaches Latin American poetry and cultures of the Amazon basin at Florida State University. He is working in the Peruvian Amazon on ..."
