["https://www.asle.org/conference/biennial-conference/travel-and-stay"]
title = "ASLE   » Travel and Stay"
full_description = "As environmental humanists, we recognize that in-person meetings such as the ASLE conference are largely made possible by fossil fuels and thereby contribute to climate change. Guided by the goals outlined in the 2020-2026 ASLE Strategic Plan, we selected this conference site due to its relative proximity to the majority of ASLE members as well as its connectivity to interstate rail transit. Additionally, College Park is located on the Green Line of the DC light rail metro system, and we encourage attendees to utilize it when possible. The stop is about a mile from campus. https://www.wmata.com/rider-guide/stations/college-park.cfm# The nearby area boasts several projects and landmarks of interest, including ECO City Farms, the Hyattsville Food Forests, the Rachel Carson House, and the Chesapeake & Ohio Canal. As per tradition, the conference will include field trips to similar sites, as well as a local “cultural crawl.” The University of Maryland, College Park is the state’s flagship university, located just outside Washington, D.C. One of the nation’s preeminent public research universities with an enrollment nearly 41,000, UMD has a commitment to environmental and social values, such as the programs, projects, and events offered through the Office of Sustainability’s SustainableUMD network and the School of Public Policy’s Do Good Institute. Attendee Message Board for seeking Rideshares, Roommates, Childcare/Activities for Families: Please use THIS LINK to post/search under your topic at the padlet message board. Room blocks have been arranged at several local facilities. Your stays at one of these places means ASLE won’t be on the hook for unfilled blocks, so we really encourage you to book your stay at one of them! Dorm rooms at the University of Maryland will be available for 4 or 5 night stays only. Singles and doubles are available on the South Campus. Breakfast/Lunch is included in stay packages. Approximate costs for 4 nights is $385 double or $575 single, 5 nights is $485 for double occupancy, $720 for single. Book via conference registration, more details coming soon!"
year_published = 2025
