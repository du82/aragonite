full_description = "LUCIEN DARJEUN MEADOWS: NOVEMBER 2023 SCHOLAR OF THE MONTH 01 Nov 2023Ponce de Leon Alejandro0 ASLE’s Scholar of the Month for November 2023 is Lucien Darjeun Meadows. Lucien Darjeun Meadows was born in Virginia and raised in West Virginia. A Ph.D. graduate from the University of Denver (June 2023), his Ph.D. dissertation studies the queer ecology of clouds in nineteenth-century British poetics, so as to show how lyrical writing on clouds, within works from poems to scientific treatises, destabilizes human subject/environmental object hierarchies and instead offers subject/subject relationships. Across his interests in environmental studies, Indigenous studies, queer theory, and working-class poetics, as ... ASLE Spotlight 2023-24 Lineup and Registration 01 Nov 2023McIntyre Amy0 We are delighted to announce the themes and participants in our 2023-24 ASLE Spotlight series. Each of our four ASLE Spotlight episodes will feature moderated conversations with ASLE members who have produced new critical and creative work in the environmental humanities. Episodes follow a theme, and highlight publicly engaged scholarship. They will be recorded for later viewing, and posted to ASLE Spotlight and to our Spotlight Channel on YouTube. Registration is free but required for the live episodes, and space is limited. Priority will be ..."
