full_description = "18 Feb 20250 Deceleration (Bioregionally-Based Grassroots EJ Media Project) Looking to widen the activist reach of your scholarship? Consider submitting to Deceleration (deceleration.news). We are a nonprofit online journal producing original news and analysis responding to our shared ecological, political, and cultural crises. We write at the intersection of environment and justice—journalistically, academically, and creatively—with emphasis on our home communities and bioregion (the watersheds of San Antonio, South Texas, and the Gulf South, broadly). Deceleration is dedicated to cultivating radical imagination that goes to the roots of climate disturbance in historical systems of ... 15 Feb 20250 Special Issue: African American Environmental Narratives in the Anthropocene: Vulnerability, Resilience, Resistance Call for Papers for a Special Issue of the Journal Zeitschrift für Anglistik und Amerikanistik (ZAA) “African American Environmental Narratives in the Anthropocene: Vulnerability, Resilience, Resistance” Edited by: Matthias Klestil & Claudia J. Ford Submission Timeframe: If you would like to contribute a paper to this special issue, please send a 300-word abstract and short bio by 24 March 2025. Authors will be informed of acceptance of their abstract by mid-April 2025. Completed articles of 5000-6000 words including notes and bibliography for original, unpublished work that is ... 06 Feb 20250 Edited Collection: Haunted by Hydrocarbons: Petrogothic and Petrohorror in the Contemporary Imagination Edited Collection: Haunted by Hydrocarbons: Petrogothic and Petrohorror in the Contemporary Imagination Deadline for proposal submission: August 31, 2025 Editors: Madalynn L. Madigar (Cherokee Nation, University of Oregon), Jennifer Schell (University of Alaska, Fairbanks) Contact Emails: mmadigar@uoregon.edu, jschell5@alaska.edu For this edited collection, we invite proposals for essays that focus on and engage with petrogothic and petrohorror,