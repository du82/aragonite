title = "ASLE   » Leadership & Staff"
full_description = "Amy Hamilton is Professor of English and Director of Gender and Sexuality Studies at Northern Michigan University. Cristin Ellis is Associate Professor of English and Co-Director of the Environmental Studies Program at the University of Mississippi. Lucien Darjeun Meadows is a PhD candidate in English at the University of Denver, managing editor of Denver Quarterly, and poetry editor of The Hopper. Suvankur Sukul is a PhD candidate and Regents Fellow in the Department of English at University of California, Santa Barbara. Dr. Katherine (Kate) Huber holds a Ph.D. in English and a M.Ed. in Education from the University of Oregon. Karla Armbruster is professor of English and the chair of the Sustainability Studies Committee at Webster University in St. Louis, MO. Karla has previously served as ASLE President and Executive Council member. Alejandro Ponce de León is a Ph.D. Candidate in Cultural Studies with an emphasis in Science and Technology Studies at The University of California, Davis. Nate Otjen is incoming Assistant Professor of Sustainability and Environmental Studies at Ramapo College. KT Thompson is Associate Professor of creative nonfiction and critical theory at Northern Arizona University. David Taylor is Associate Professor and Faculty Director of the Environmental Humanities track in the Sustainability Studies Program in the School of Marine and Atmospheric Sciences at Stony Brook University. Ching-In Chen teaches at University of Washington Bothell and serve as Writer in Residence at Hugo House."
