["https://www.asle.org/conference/affiliated-symposia"]
title = "ASLE   » Affiliated Symposia"
full_description = "In addition to our biennial conference, we sponsor smaller regional symposia in our non-conference years. “Green Fire” is an in-person symposium that will be held in 2024 (see CFP below), we are also open to proposals for other potential virtual or in-person events next year. If you would like ASLE to sponsor a regional conference or symposium, please see our Off-Year Symposia Guide, and then use the online form on the Propose a Symposium page to apply. ASLE has sponsored virtual symposia in 2018 and 2020, and due to the pandemic, we held our biennial conference virtually in 2021 as well. If you’d like to find out more about nearly carbon-neutral (NCN) conferences, this short video and White Paper explain the rationale and approach. The concept of energy has a history that long pre-dates any dreams of resource extraction or electrification. Cultures around the world have viewed different energies, plural, as living forces. Depending on the context, the word “energy” might call up images of interconnected beings, landforms, species, and worldviews. Phases of existence have even been understood in terms of energy, since spirits of the dead are often thought to exert their energies on behalf of, or in opposition to, the living. Robin Wall Kimmerer’s explanation of the Potawatomi word puhpowee—“the force which causes mushrooms to push up from the earth overnight”—pertains to conceptions of energy in many different Indigenous cultures. According to this paradigm, humans are just one of the many types of life-forms inhabiting a “world of being, full of unseen energies that animate everything.” Kimmerer stresses that humans have the responsibility to regulate our personal energies in reciprocal relationships with the energies of the nonhumans with whom we share the world. Aldo Leopold’s famous description of the “fierce green fire” leaving the eyes of a mother wolf he helped kill, along with his definition of land as “a fountain of energy” rather than mere property, shows how similar ideas have taken shape in Western cultures."
year_published = 2025
clearnet = "https://www.asle.org/conference/affiliated-symposia"
