yre Amy0 This episode was recorded Friday, January 26, 2024 Co-hosts: Dominic O’Key and Sumita Chakraborty FEATURED GUESTS/WORKS: Kate Rigby (Meditations on Creation in an Era of Extinction) This book revives the ancient Christian tradition of meditations on the six days of creation to reflect upon current concerns around biodiversity loss, climate disruption, ecological unravelling and environmental injustice, and how these wrongs are being redressed by an array of faith-based initiatives around the world. Kate Rigby is Alexander von Humboldt Professor of Environmental Humanities and Director of the Multidisciplinary Environmental Studies ..."
