["https://asm.sourceforge.net/articles/startup.html"]
title = "Startup state of a Linux/i386 ELF binary"
description = "Document describes startup state of ELF executable"
full_description = "All information provided here has derived from my own research. So, mistakes and deficiencies could exist. If you find any -- please contact me. The objective of this document is to describe several startup process details and the initial state of the stack & registers of an ELF binary program, for Linux Kernel 2.2.x and 2.0.x on i386. Portions of material represented here may be applicable to any ELF-based IA-32 OS (FreeBSD, NetBSD, BeOS, etc). Please note that in general case you can apply this information only to plain assembly programs (gas/nasm); some things described here (stack/registers state) are not true for anything compiled/linked with gcc (C as well as assembly) -- gcc inserts its own startup code which is executed before control is passed to main() function. Main source and authority of information provided below is Linux Kernel's fs/binfmt_elf.c file. If you want all details of the startup process -- go read it. You can download program suite that was used while writing this document at the Linux Assembly (binaries, source). Every program is executed by means of sys_execve() system call; usually one just types program name at the shell prompt. In fact a lot of interesting things happen after you press enter. Shortly, startup process of an ELF binary can be represented with the following step-by-step figure: Layout of segment created for an ELF binary shortly can be represented with Figure 2. Yellow parts represent correspondent program sections. Shared libraries are not shown here; their layout duplicates layout of program, except that they reside in earlier addresses. Program takes at least two pages of memory (1 page == 4 KB), even if it consists of single sys_exit(); at least one page for ELF data (yellow color), and one for stack, arguments, and environment. Stack is growing to meet .bss; also you can use memory beyond .bss section for dynamic data allocation. Note: this information was gathered from fs/binfmt_elf.c, include/linux/sched.h (task_struct.addr_limit)."
year_published = 2025
