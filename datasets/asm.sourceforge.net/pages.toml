["https://asm.sourceforge.net/articles/audio.html"]
title = "linuxassembly.org - Using the audio device under Linux"
full_description = "This is a short explanation how you can use the OSS interface of the kernel to output audio samples. If you find mistakes or have suggestions, mail me. The example code below is very simple. It doesn't check if your soundcard supports the options required (44.1 kHz mono/stereo 16 Bits signed). This causes wrong output if your soundcard doesn't support this. Of course your kernel has to have loaded the correct driver for your soundcard in order to get this work. Mostly all of the ioctl's used here are read/write this means the address given in edx must be writable, because the kernel writes the real parameter for your sound options back to this address (if you want to set 48 kHz but your soundcard only supports 44.1 kHz you will find this value in your variable addressed with edx). Therefore placing such a variable in section .text is a bad idea. Notice: if you look at the kernel sources (especially /usr/src/linux/include/linux/soundcard.h) you will find multiple names for the same ioctl (example: SNDCTL_DSP_CHANNELS is equal to SOUND_PCM_WRITE_CHANNELS). If you want to use sound output in your program you should do something more than this sample code. Here some more interesting ioctl's: It is always a good idea to write as much data as possible at once, because every syscall consumes extra cpu cycles. The sample code below makes 2 outputs. First a simple sawtooth waveform and second it tries to open the file audio.raw and if it exists it is played. This file should be in the format 44.1 kHz, stereo, 16 Bit signed."
