["http://asm.sourceforge.net/articles/modex.html"]
title = "linuxassembly.org - Using ModeX via direct VGA access under Linux"
full_description = "Accessing the VGA Card under Linux is different from DOS, the big difference is that you can't use any VGA BIOS routines. So switching to the well known 320x200 Mode is more complicated, because you have to do all the work on your own. This example offers some ModeX resolutions. You can select a mode at start of the source code. Most of these modes should be available on every VGA Card although they are called non-standard. All relevant values for the video mode are in the subroutine modex_switch_mode, they are mostly taken from the svgalib and vga256fb source or from libraries running under DOS. The memory address of a pixel under ModeX is different compared to that you would expect under the framebuffer device. Because of the VGA specification there are 4 planes, this means you have 4 pixels at the same memory address they only differ in the plane they resist (this is true for all modes except 320X200P and 256X256P. These are examples for planar addressing: one pixel per address. This is possible, because all pixels are addressable in a 64K range). There are also different write and read modes for this planes. Hint: if you want to move video memory use write mode 1 in combination with dword access (4 planes * 4 pixels = 16 pixels). If you don't know what i mean read the VGA description mentioned above. If you like you may optimize the register accesses in the modex_set_* routines, you can combine some of the 8 bit out instructions (out word dx, al) to 16 bit out instructions (out word dx, ax). Using this example of direct VGA register access with a running fb driver other than vga16fb probably does not work. I also strongly recommend signal handlers in your program, you should ensure that your program exits correctly even if something wents wrong. It is mostly not a good idea to leave the user with a broken console if your code Segfaults ;-) If your console runs in text mode then you should backup the video memory, because there seem to lie the charset at the beginning used for text display. I don't know if the charset is always placed on this position or if it is device dependent, please drop me a note if you find out more. Therefore this example code saves the whole 256 KB of VGA memory and restores it when exiting."
