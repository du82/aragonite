["http://asm.sourceforge.net/articles/fb.html"]
title = "linuxassembly.org - Using the framebuffer device under Linux"
full_description = "This is a short explanation, how you can use the linux framebuffer device in assembler language. If you find mistakes or have suggestions, mail me. If you use color depths less or equal than 8 bpp you have to set a color palette in order to see that what you draw (default: first 16 colors are set to the normal terminal ANSI colors, the rest should be black). Linux uses 16 bit for every color component (red, green, blue, transparent). In this example we use STDIN as file descriptor for sys_ioctl. This is ok as long as nobody redirects it to a file or pipe. If you want that the program even works in this cases: open /dev/tty and use that file descriptor instead."
