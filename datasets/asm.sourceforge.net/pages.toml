["http://asm.sourceforge.net/asmutils.html"]
title = "a s m u t i l s"
full_description = "Asmutils no longer come with precompiled binaries. Instead, a Linux distribution based on asmutils called a-Linux is available. It is a single-floppy mini-distribution, you can download it here. It is in the early stage of development, and eventually will become a completely individual project. At the point, current version of a-Linux is still based on previous version of asmutils (0.17). arch basename cal cat ccd cda2raw chmod chown chroot chvt cmp cp cpuinfo cpuspeed cut date dc dd deallocvt deflate df dirname dmesg domainname du echo eject env extname factor false fdisk finger fingerd free fromdos ftpd getty gi grep halt head hexdump host hostname httpd (532 bytes, the worlds' smallest http server) id idea ifconfig inflate init kill killall killall5 ksyms less ln ls lsmod lsusb lzss m_inetd md5 md5sum mesg mkdir mkfifo mkfs.minix mknod mkswap more mount mv nc netstat nice nm nohup od paste pidof ping pop3d poweroff proxy ps pwd rc6crypt readelf readkey readlink reboot renice rm rmdir rmdsum rmmod rot13 route scan scons sh sha1sum size sleep sln softdog strings swapoff swapon sync sysctl tail tar tee telnet telnetd test todos touch tr true truss tty umount uname update uptime users usleep uuencode watch wc wget which whoami write yes asmutils is a set of miscellaneous utilities written in assembly language, targeted on embedded systems and small distributions (e.g. installation or rescue disks); also it contains a small libc and a crypto library. It features the smallest possible size and memory requirements, the fastest speed, and offers fairly good functionality. Now project supports Linux and BSD family (FreeBSD, OpenBSD, NetBSD); Unixware, Solaris, and AtheOS support is in beta stage (also there's no more supported BeOS port), and it is /theoretically/ possible to port it to any i386 OS. Another goal of this package is to provide a *portable* framework, and to encourage assembly programmers to write for Linux/UNIX. Usually UNIX is associated with C, and no one wants to deal with assembly.. Browse the source, look -- it is simple. Read the docs, start to write, and you will like it; assembly programming is a lot of fun, especially when you deal with a UNIX-like operating systems."
