["http://asm.sourceforge.net/articles/vt.html"]
title = "linuxassembly.org - Using Virtual Terminals under Linux"
full_description = "This code shows how to control the virtual terminal switching. As a standalone example it doesn't make much sense, but in connection with the framebuffer or ModeX example code it is quite useful. The switching between the virtual terminals is normally controlled by the kernel. The key combinations ALT-F1, ALT-F2, ..., ALT-CURSORLEFT, ALT-CURSORRIGHT are reserved for that. But it is also possible to tell the kernel that you want to get a signal if the user wants to leave the virtual terminal of your program (in this context it is called release signal) and which signal you want to get when the user switches back to the virtual terminal your program runs on (acquire signal). In this example SIGUSR1 and SIGUSR2 are used for this purpose. The according handlers are registered with sys_sigaction. Now lets have a closer look how this example works: Instead of tinkering around with the release signal, you can set the release signal in VT_SETMODE to 0, so you won't get one. To still recognize that the user wants to switch the vt, you can enable raw keyboard mode and look yourself for ALT-F1. Use VT_ACTIVATE and VT_WAITACTIVE to switch the vt manually, but you need root rights for this. It is also possible to place the switch code in the signal handlers itself, but you have to ensure that the underlying program knows that the switch happened to determine if graphics activity is allowed or not. In the framebuffer and ModeX code we make use of the KDSETMODE ioctl to switch to KD_GRAPHICS. It is not necessary to switch back to KD_TEXT if a terminal switch is going to happen, because the kernel manages this flag for every virtual terminal. In this example we use STDIN as file descriptor for sys_ioctl. This is ok as long as nobody redirects it to a file or pipe. If you want that the program even works in this cases: open /dev/tty and use that file descriptor instead."
