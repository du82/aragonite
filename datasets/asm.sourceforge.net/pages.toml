["http://asm.sourceforge.net/howto/doyouneed.html"]
title = "Chapter 2. Do you need assembly?"
full_description = "Well, I wouldn't want to interfere with what you're doing, but here is some advice from the hard-earned experience. you can control the exact code behavior in critical sections that might otherwise involve deadlock between multiple software threads or hardware devices you can break the conventions of your usual compiler, which might allow some optimizations (like temporarily breaking rules about memory allocation, threading, calling conventions, etc) you can build interfaces between code fragments using incompatible conventions (e.g. produced by different compilers, or separated by a low-level interface) you can get access to unusual programming modes of your processor (e.g. 16 bit mode to interface startup, firmware, or legacy code on Intel PCs) you can produce reasonably fast code for tight loops to cope with a bad non-optimizing compiler (but then, there are free optimizing compilers available!) you can produce hand-optimized code perfectly tuned for your particular hardware setup, though not to someone else's you can write some code for your new language's optimizing compiler (that is something what very few ones will ever do, and even they not often) Assembly is a very low-level language (the lowest above hand-coding the binary instruction patterns). This means your code will be optimized only for a certain implementation of a same architecture: for instance, among Intel-compatible platforms each CPU design and its variations (relative latency, through-output, and capacity, of processing units, caches, RAM, bus, disks, presence of FPU, MMX, 3DNOW, SIMD extensions, etc) implies potentially completely different optimization techniques. CPU designs already include: Intel 386, 486, Pentium, PPro, PII, PIII, PIV; Cyrix 5x86, 6x86, M2; AMD K5, K6 (K6-2, K6-III), K7 (Athlon, Duron). New designs keep popping up, so don't expect either this listing and your code to be up-to-date. you spend more time on a few details and can't focus on small and large algorithmic design, that are known to bring the largest part of the speed up (e.g. you might spend some time building very fast list/array manipulation primitives in assembly; only a hash table would have sped up your program much more; or, in another context, a binary tree; or some high-level structure distributed over a cluster of CPUs)"
