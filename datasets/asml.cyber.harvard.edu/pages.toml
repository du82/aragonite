title = "Chelsea Baltierra Johnson - Applied Social Media Lab at Harvard University"
description = "Chelsea Baltierra Johnson is a Principal Engineer at the Applied Social Media Lab. An experienced software engineer and social impact organizer, Chelsea explores how social media can better support communities, particularly those who are least served or most harmed by it. Chelsea is an engineering leader and sociotechnical strategist with over a decade of experience..."
full_description = "Chelsea Baltierra Johnson chjohnson@law.harvard.edu LinkedinChelsea Baltierra Johnson is a Principal Engineer at the Applied Social Media Lab. An experienced software engineer and social impact organizer, Chelsea explores how social media can better support communities, particularly those who are least served or most harmed by it. Chelsea is an engineering leader and sociotechnical strategist with over a decade of experience building scalable software and growing engineering teams. She earned her degree in Computer Science from the University of California San Diego, where she co-founded its first undergraduate Women in Computing organization. Following her studies, she developed software and led engineering projects for enterprise companies such as Salesforce and Tableau, where she has also authored technical content and served as a featured technical speaker. Leveraging her additional background in founding social impact startups, Chelsea is passionate about delivering community-centered tech with measurable impact. Before joining ASML, she was the Director of Technology for Tiny News Collective, where she built technology solutions for small local newsrooms serving diverse communities across the U.S. Chelsea looks forward to exploring ASML’s interdisciplinary approach to tech building and focus on community-centered solutions. When she’s not building tech, she loves mentoring early-career engineers, crafting, and laughing at funny pet videos."
