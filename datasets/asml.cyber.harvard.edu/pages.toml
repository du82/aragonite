["https://asml.cyber.harvard.edu/person/brendan-miller"]
title = "Brendan Miller - Applied Social Media Lab at Harvard University"
description = "Brendan A. Miller is a Principal Engineer with the Applied Social Media Laboratory. He researches and develops innovative protocols, architectures and interactive processes that advance digital democracy and civil rights online, and a healthier social media experience for all.  Brendan was most recently employed as the Chief Software Architect and Lead Engineer for TBF, a..."
full_description = "Brendan Millerbrmiller@law.harvard.edu Linkedin GithubBrendan A. Miller is a Principal Engineer with the Applied Social Media Laboratory. He researches and develops innovative protocols, architectures and interactive processes that advance digital democracy and civil rights online, and a healthier social media experience for all. Brendan was most recently employed as the Chief Software Architect and Lead Engineer for TBF, a digital creative agency in Los Angeles, focusing on the development of sophisticated web applications that are a joy to use as well as creative promotional campaigns for a range of Fortune 500 companies and major movie studios. In this position, he partnered closely with user experience researchers and designers to iterate to excellence. For the past several years, he has taken a partial leave of absence to research and experiment in decentralized social media and collective action online. He maintains a guide to relevant platforms, protocols and concepts on Github. Brendan also researched and wrote the first Green Economy Plan for the State of New Mexico under Governor Bill Richardson, driven by an extensive stakeholder planning process. He has experience performing qualitative research on national service, and providing group facilitation and training in deliberative democracy, systems thinking and adaptive leadership. He also served for two years as an AmeriCorps volunteer. Brendan has a Bachelors of Science in Math – Computer Science from Brown University, an MPA from the Harvard Kennedy School and an MBA from MIT’s Sloan School of Management. He lives with his wife in Venice Beach, CA, where he tries to be outdoors whenever he is not in front of a computer."
