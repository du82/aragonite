["https://asml.cyber.harvard.edu/beyond-discourse-dumpster-fires-strategies-and-tools-for-better-online-civil-space"]
title = "Event - Applied Social Media Lab at Harvard University"
description = "The Lab at Harvard’s Berkman Klein Center is home to technologists building an Internet for the public good. This is for them, and also for memes"
full_description = "Last year some economists documented something both surprising and sensible about social media: many people would pay a lot to keep using their favorite platforms, and they would pay a lot if all those platforms could disappear for everyone. They describe today’s major social media as a “collective trap”: the traffic accident that people regret, but also can’t help but want to slow down and see. The Berkman Klein Center’s new Applied Social Media Lab at Harvard University is pleased to host, in person and livestreamed, an afternoon of discussions and presentations of new tools and ideas around civil discourse. Join us on Thursday, September 12th, 2024, from 1:30-5:00 pm ET for a series of panels featuring leading technologists, researchers, and civil society leaders to learn more about the technological and other interventions the ASML is exploring to foster healthier, more satisfying discourse. A student-focused lunch and learn event, offering an opportunity to connect with BKC staff and representatives from tech-related campus organizations and centers at Harvard. Discover ways to get involved with the Berkman Klein Center, including research and student work, events, and immersing in the BKC community. BKC Faculty Director Jonathan Zittrain hosts a panel discussion to explore how to reboot social media to foster healthy and thriving human interactions. How can we create and refine spaces and processes where people can share their earnest views without fear, explore common ground, and grow intellectually and personally? Does the answer lie in new technology, new practice, or some combination of the two? What role can the University play in building a healthier future? Professor Charles Nesson, founder of the Berkman Klein Center, invites audience members to participate in a demo of Nymspace, an online communication platform that enables pseudonymous discussion in closed-group environments. Nesson has used the tool in his classrooms since 2015 as a complement to face-to-face conversation to improve discussion satisfaction and promote group trust."
year_published = 2025
year_updated = 2024
