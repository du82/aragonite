title = "Meg Marco - Applied Social Media Lab at Harvard University"
description = "Meg is the Interim Senior Director of the Applied Social Media Lab, focusing on building public interest technology that helps make information available and understandable to researchers, journalists, civil society organizations and the general public. She has held senior editorial positions at WIRED, ProPublica and The Wall Street Journal. At ProPublica her team’s work was..."
full_description = "Meg Marcommarco@law.harvard.edu Linkedin Website ThreadsMeg is the Interim Senior Director of the Applied Social Media Lab, focusing on building public interest technology that helps make information available and understandable to researchers, journalists, civil society organizations and the general public. She has held senior editorial positions at WIRED, ProPublica and The Wall Street Journal. At ProPublica her team’s work was honored with the 2021 National Magazine Award for Social Media, and she co-edited the coverage of the coronavirus pandemic that was a finalist for the 2021 Pulitzer Prize for Public Service. She is also formerly the editor and head of product of Consumerist, a Gawker Media publication that was acquired by Consumer Reports. During her tenure, Consumerist produced deeply reported coverage of topics such as fraud, surprise medical bills, for-profit colleges, telecom policy, consumer privacy and product safety. Meg enjoys photography, collecting movie posters and trying to thrift practically everything."
