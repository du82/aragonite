["https://asml.cyber.harvard.edu/person/johnny-richardson"]
title = "Johnny Richardson - Applied Social Media Lab at Harvard University"
description = "Johnny is a Senior Software Engineer at the Applied Social Media Lab working on making social media discourse safer and more democratic while protecting privacy and verifying identity. Over the past 15 years, he has developed numerous web and mobile applications and games across a wide array of tech stacks, either at a variety of..."
full_description = "Johnny RichardsonJohnny is a Senior Software Engineer at the Applied Social Media Lab working on making social media discourse safer and more democratic while protecting privacy and verifying identity. Over the past 15 years, he has developed numerous web and mobile applications and games across a wide array of tech stacks, either at a variety of startups, independently, or in academia. These ranged from a social game based on Game of Thrones, experimental virtual reality experiences, a mobile game targeted at improving child hygiene in Tamil Nadu, to countless responsive web apps. Prior to joining the ASML, his work was dedicated to advancing civic technology and building solutions that addressed complex social issues at the Engagement Lab @ Emerson College for nearly a decade. Johnny prides himself on working in collaboration with an equal diversity of disciplines and stakeholders; not just designers, product managers, and engineers, but academics, government officials, social workers, teachers, healthcare providers, and filmmakers, to name a few. He lives on the Lynn Shore with his wife and dog. When not working, you might find him cooking, playing video games, hiking, cycling, home-brewing beer, and fixing up his fixer-upper."
