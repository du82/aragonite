title = "Jennifer Hickey - Applied Social Media Lab at Harvard University"
description = "Jennifer Hickey comes to ASML with a passion for public interest technology and years of experience as a software engineer, civil rights attorney, legal scholar, and nonprofit founder and leader.  Jennifer has architected and coded open-source software tools used by millions of developers (Spring Framework and related projects), including simplified datastore access, cloud deployment platforms,..."
full_description = "Jennifer Hickey jhickey@cyber.harvard.edu LinkedinJennifer Hickey comes to ASML with a passion for public interest technology and years of experience as a software engineer, civil rights attorney, legal scholar, and nonprofit founder and leader. Jennifer has architected and coded open-source software tools used by millions of developers (Spring Framework and related projects), including simplified datastore access, cloud deployment platforms, application runtimes, and application monitoring. She recently completed a four-year postdoctoral fellowship at The Vulnerability and the Human Condition Initiative at Emory Law, where she taught and published on the application of Vulnerability Theory in a number of substantive areas, including tech, and on the legal regulation of intimacy. She is looking forward to building software that centers themes of vulnerability, intimacy, and trust in social media. In her spare time, Jennifer enjoys running, kickboxing, reading, and bouncing on trampolines with her adorable son."
