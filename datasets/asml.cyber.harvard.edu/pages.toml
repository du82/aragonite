full_description = "Jay Kempjkemp@law.harvard.edu Jay is the team’s newly-minted Executive Assistant, working in tripartite under the Berkman Klein Center’s Managing Director, the Executive Director of Institutes, and the Senior Director of the Applied Social Media Lab. Prior to joining Harvard, Jay was the Artificial Intelligence and Social Impact Fellow at The Burnes Center for Social Change, building up, generating research for, and staffing the Reboot Democracy blog, newsletter, and lecture series. They bring a wealth of administrative and process improvement experience from their roles interning for Senator Edward Markey and Representative Ayanna Pressley, as the scheduling and executive assistant for then-Attorney General Maura Healey, and as a marketing staff member for the Center for Communication, Media Innovation, and Social Change at Northeastern (NU CCMISC). Jay holds a master’s degree from Northeastern’s Media Advocacy program, which is co-hosted between CAMD Journalism and the School of Law. In this program, they focused on innovative media and journalistic strategies in social justice contexts, including building and hosting the ongoing Bot Beat podcast about AI innovation within journalism. They also organized and led successful, cross-campus reproductive health initiatives to improve access to necessary care for the community."
