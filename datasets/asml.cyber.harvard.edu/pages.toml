["https://asml.cyber.harvard.edu/person/jonathan-zittrain"]
title = "Jonathan Zittrain - Applied Social Media Lab at Harvard University"
description = "Jonathan Zittrain is the George Bemis Professor of International Law at Harvard Law School and the Harvard Kennedy School of Government, Professor of Computer Science at the Harvard School of Engineering and Applied Sciences, Director of the Harvard Law School Library, and Co-Founder of the Berkman Klein Center for Internet & Society. His research interests include..."
full_description = "Jonathan ZittrainJonathan Zittrain is the George Bemis Professor of International Law at Harvard Law School and the Harvard Kennedy School of Government, Professor of Computer Science at the Harvard School of Engineering and Applied Sciences, Director of the Harvard Law School Library, and Co-Founder of the Berkman Klein Center for Internet & Society. His research interests include the ethics and governance of artificial intelligence; battles for control of digital property; the regulation of cryptography; new privacy frameworks for loyalty to users of online services; the roles of intermediaries within Internet architecture; and the useful and unobtrusive deployment of technology in education. Zittrain established the Assembly Program, a three-track fellowship program that convenes cohorts of experts, professionals, and students to develop solutions to complex technology policy issues, including those in cybersecurity, AI, and online disinformation. He also championed the development of the Caselaw Access Project, which has expanded free public access to U.S. case law. Zittrain is a member of the American Academy of Arts and Sciences and the Board of Directors of the Electronic Frontier Foundation. He has served on the Board of Advisors for Scientific American, as a Trustee of the Internet Society, and as a Forum Fellow of the World Economic Forum, which named him a Young Global Leader. He was the Distinguished Scholar-in-Residence at the Federal Communications Commission, where he chaired the Open Internet Advisory Committee. His book, The Future of the Internet ─ And How to Stop It, predicted the end of general purpose client computing and the corresponding rise of new gatekeepers. It is available from Yale University Press and Penguin UK, and under a Creative Commons license. That and other works may be found at <http://www.jz.org>."
year_published = 2025
