["https://asml.cyber.harvard.edu/event/from-insight-to-action-combating-journalist-harassment-online"]
title = "From Insight to Action: Combating Journalist Harassment Online - Applied Social Media Lab at Harvard University"
description = "The online harassment of journalists is a rapidly growing problem, particularly affecting women and intersectional populations. According to the International Center for Journalists (ICFJ) and UNESCO’s 2022 report “The Chilling,” 73% of women journalists have experienced online harassment. The divisiveness in the political and social climate has created a cesspool of hate, while the proliferation..."
full_description = "July 9, 2024From Insight to Action: Combating Journalist Harassment OnlineThe Applied Social Media Lab welcomes Project Fellow Adesola Sanusi to present her approach to addressing online harassment of journalists. The online harassment of journalists is a rapidly growing problem, particularly affecting women and intersectional populations. According to the International Center for Journalists (ICFJ) and UNESCO’s 2022 report “The Chilling,” 73% of women journalists have experienced online harassment. The divisiveness in the political and social climate has created a cesspool of hate, while the proliferation of advanced technology has emboldened bad actors, making their tactics more sophisticated and pervasive. Join us for an engaging discussion led by the Applied Social Media Lab’s Project Fellow Adesola Sanusi as she presents key insights from her action plan to combat journalist harassment online. Adesola will draw from personal experiences that have shaped her approach, emphasizing the pivotal roles of empowerment, community support, and policy advocacy in creating safer online environments. By addressing the root causes and exploring innovative solutions, Adesola advocates for a comprehensive approach to mitigating the spread and impact of journalist harassment online. This event promises to inspire and inform, fostering a dialogue on how to create lasting change in combating harassment in digital spaces. Adesola Sanusi (Presenter) Adesola Sanusi is a global tech professional currently working on strategic initiatives at NALA, an African fintech enabling cross-border payments. She is a Project Fellow at the Applied Social Media Lab, exploring interventions to combat journalist harassment online. Adesola has a diverse background blending 4+ years in product management and 2+ years in strategy, operations, and marketing – across advertising, AI technology, and fintech sectors in both the US and African markets. Before Nala, she was the Chief of Staff and previously a Product Manager at Okra, a B2B open banking fintech startup based in Lagos, Nigeria. Prior to Okra, Adesola served as a Product Manager within Google’s Jigsaw team, focusing on using AI technology to combat online toxicity and harassment. She also spent time on the Google Display & Video 360 team, driving efforts to expand audio advertising in the platform. Adesola, a Nigerian-American immigrant, holds a Bachelor’s Degree in Computer Science from Harvard University. Outside of her professional endeavors, Adesola mentors students and remains a strong advocate for female representation in the technology industry, continuously striving to inspire and support the next generation of tech leaders. Dedicated to leveraging technology for global impact, she uses her expertise to foster innovation and drive positive change. In her free time, she enjoys traveling, cooking, and watching football and basketball. Next EventsSeptember 12, 2024Beyond Discourse Dumpster Fires: Strategies and Tools for Better Online Civil SpaceJuly 30, 2024Public Interest Social Media Solutions WorkshopThe Applied Social Media Lab seeks applications for a workshop dedicated to imagining and building new public interest technology."
