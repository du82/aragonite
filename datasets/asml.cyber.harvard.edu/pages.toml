full_description = "Kathy Qiankqian@law.harvard.edu Kathy Qian is a Senior Software Engineer at the Applied Social Media Lab. Her engineering work is focused on creating functional and thoughtfully designed products that help people thrive. Kathy has several years of experience in tech startups as both a founder and a founding software engineer, where she has worked as a full-stack engineer and released web and mobile apps. She is excited about the ASML as a unique opportunity to apply her startup experience and work on tech products in an environment where the well-being of people and communities is the primary focus. Kathy completed her undergraduate studies in Computer Science at Harvard. In addition to software engineering, she is interested in music and visual art as other means of creating and sharing realities."
