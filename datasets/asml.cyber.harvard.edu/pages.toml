description = "Rebecca is the Executive Director of the Institute for Rebooting Social Media and Applied Social Media Lab within the Berkman Klein Center. She helps drive the initiative’s strategy and execution alongside Faculty Directors Jonathan Zittrain and James Mickens. An experienced digital and communications strategist, Rebecca draws on her background across government and the private sector..."
full_description = "Rebecca RinkevichRebecca is the Executive Director of the Institute for Rebooting Social Media and Applied Social Media Lab within the Berkman Klein Center. She helps drive the initiative’s strategy and execution alongside Faculty Directors Jonathan Zittrain and James Mickens. An experienced digital and communications strategist, Rebecca draws on her background across government and the private sector to guide the institute’s strategic planning, public outreach, and cross-organization collaboration. Prior to the Institute for Rebooting Social Media, Rebecca was the Deputy Director of Digital Strategy at the White House where she oversaw the day-to-day of the White House and President Biden’s digital communications. Previously, she was the Rapid Response Director for then Vice President Biden’s 2020 presidential campaign and the Director of Politics at Bully Pulpit Interactive where she ran large-scale advertising programs and advised political organizations on how to effectively scale their digital operations."
