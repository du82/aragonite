["https://asml.cyber.harvard.edu/asml-fellowship-program"]
title = "ASML Fellowship Program - Applied Social Media Lab at Harvard University"
description = "The Lab at Harvard’s Berkman Klein Center is home to technologists building an Internet for the public good. This is for them, and also for memes"
full_description = "The Applied Social Media Lab (ASML) at Harvard University’s Berkman Klein Center for Internet and Society invites mid-to-senior-career responsible tech contributors who have an active role in the social media field—or who have recently left a technology firm—to apply for the ASML Fellowship Program. ASML Fellows will engage in a collaborative, interdisciplinary environment to advance technology in the public interest. The program aims to provide participants the space, time, and connections to develop new approaches to social media technology by advancing projects that prioritize the public interest. During their fellowship, ASML Fellows will drive projects of their own interest and design that connect to one of four existing focus areas, and share their insights with the broader ASML community and beyond. The ASML Fellowship Program offers six-week or four-month timelines for project-based work. We invite prospective participants to apply via this link and include their CV, a two-page project proposal, and responses to a few survey questions. Applicants can select their ideal timeline for participation, with options for a six-week or four-month program (from September to December or February to May). For the six-week program, ASML Fellows will receive a total stipend of $5,000. For the four-month program, ASML Fellows will receive a total stipend of $18,000. While this fellowship is remote, participants will be encouraged to visit the Lab in Cambridge, MA, at least once during their appointment, subject to mutual interest and availability. Travel and accommodation support for this visit may be available upon request. Area 1: Spaces for civil discourse and collaboration that offer new ways for people to exchange views and deliberate constructively online and that can be adopted by other platforms. Area 2: Transparency tools that make detailed information about social media platforms available and understandable to researchers, journalists, civil society organizations, and the general public."
