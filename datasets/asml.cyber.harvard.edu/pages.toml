description = "Shelby El Otmani (she/her) is a Communications Coordinator for Berkman Klein Center’s Institute for Rebooting Social Media and Applied Social Media Lab. Shelby began a career in podcast production and radio journalism. She has been a producer at GBH News, New Hampshire Public Radio, and EF Education First, and her work has also been aired..."
full_description = "Shelby El OtmaniEmail: selotmani@cyber.harvard.edu Twitter/X LinkedinShelby El Otmani (she/her) is a Communications Coordinator for Berkman Klein Center’s Institute for Rebooting Social Media and Applied Social Media Lab. Shelby began a career in podcast production and radio journalism. She has been a producer at GBH News, New Hampshire Public Radio, and EF Education First, and her work has also been aired on WCAI, KCRW’s The Organist, and Benjamen Walker’s Theory of Everything. She is also the author of The Book of Superstitions: Black Cats, Yellow Flowers, Broken Mirrors, Cracked Sidewalks, and More Cultural Behaviors and Myths Explained, published by Cider Mill Press in 2023. Shelby’s interest in the Berkman Klein Center’s work flourished after completing the center’s CopyrightX course in 2019. She has since been fascinated with learning more about how the Internet influences our beliefs and wellbeing, and how we can develop healthier social media habits. Outside of work, Shelby enjoys practicing martial arts (including Kung Fu, Tai Chi, Sanda, Shuai Jiao, and Brazilian Jiu-Jitsu), surfing, and listening to electronic music—especially techno."
