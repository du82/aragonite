["https://asml.cyber.harvard.edu/person/kalie-mayberry"]
title = "Kalie Mayberry - Applied Social Media Lab at Harvard University"
description = "Kalie Mayberry serves as the Project Manager for the Applied Social Media Lab, working alongside faculty members across the university to develop public interest technology projects designed to experiment on redesigning social media. Kalie Mayberry is a social impact researcher, educator, and project manager, working at the intersection of public and private for the last..."
full_description = "Kalie Mayberrykmayberry@cyber.harvard.edu Twitter/XKalie Mayberry serves as the Project Manager for the Applied Social Media Lab, working alongside faculty members across the university to develop public interest technology projects designed to experiment on redesigning social media. Kalie Mayberry is a social impact researcher, educator, and project manager, working at the intersection of public and private for the last decade. Her prior work has explored corporate and employee activism, with a particular interest in the role of technology corporations and platforms for use in social movements. Kalie previously served as BKC’s Senior Research Coordinator, working closely with Professor Jonathan Zittrain and his portfolio of projects, as well as assisted in teaching courses on digital technologies. Prior to joining BKC, she focused primarily on management research, inclusive community engagement, and project management for academic and nonprofit organizations, including Columbia Business School, Wharton School of Business, Temple University, Urban Affairs Coalition, and The Food Trust. Originally hailing from California, Kalie holds a double Bachelors from the University of California Santa Barbara (UCSB) and a Masters in Public Administration (MPA) from the University of Pennsylvania’s Fels Institute of Government. She served two terms as an AmeriCorps National Volunteer, and is actively involved in mentoring high school girls, and advocating for civic engagement and hunger alleviation. When she’s not at work, you can find her playing with her two cats Nick & Stevie, trying to make a dent in her ever-growing reading list (and always open to recommendations to make it longer), and competing in various running events and triathlons (just for fun)."
