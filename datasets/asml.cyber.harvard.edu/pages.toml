["https://asml.cyber.harvard.edu/person/zoe-robert"]
title = "Zoe Robert - Applied Social Media Lab at Harvard University"
description = "Zoe is a Principal Engineer at the Applied Social Media Lab. Her work focuses on preserving news media, facilitating platform transparency, and building public interest technology. She is particularly interested in how the collection, movement, and regulation of data impacts our digital rights. Zoe is a software engineer, computer science educator, and creative technologist. She..."
full_description = "Zoe Robertzrobert@law.harvard.edu LinkedinZoe is a Principal Engineer at the Applied Social Media Lab. Her work focuses on preserving news media, facilitating platform transparency, and building public interest technology. She is particularly interested in how the collection, movement, and regulation of data impacts our digital rights. Zoe is a software engineer, computer science educator, and creative technologist. She earned an undergraduate degree in Computer Science and a Master’s in Artificial Intelligence from Stanford University. Zoe began her career at Facebook working on content moderation, news identification & ranking, journalist protections, and community help exchange. Subsequently, she helped build Column, a public benefit startup that facilitates the public notice process in local newspapers across the US. Zoe recently completed a master’s in interactive media arts from NYU Tisch School of the Arts. Her artworks seek to creatively convey the potential harms of modern technology to the public. At ASML, Zoe is thrilled to be able to explore some of the internet’s thorniest problems without profit incentives and with the support of the larger BKC community. When time permits, Zoe loves to teach computer programming, play extreme board games, and be outside!"
