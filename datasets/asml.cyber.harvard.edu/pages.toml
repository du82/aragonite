title = "Toni Gardner - Applied Social Media Lab at Harvard University"
description = "Antoinette (Toni) Gardner is the Director of Operations for Berkman Klein Center’s Institute for Rebooting Social Media and Applied Social Media Lab. A Licensed Master of Social Work, Toni is interested in how physical world problems are alleviated, exacerbated, and otherwise impacted by and within online spaces. Prior to joining BKC, she designed and coordinated..."
full_description = "Toni Gardner Antoinette (Toni) Gardner is the Director of Operations for Berkman Klein Center’s Institute for Rebooting Social Media and Applied Social Media Lab. A Licensed Master of Social Work, Toni is interested in how physical world problems are alleviated, exacerbated, and otherwise impacted by and within online spaces. Prior to joining BKC, she designed and coordinated multiple youth and young adult-centered programs related to technology and society, including Columbia University’s AI4ALL. Toni received her MSW from Columbia University School of Social Work, working closely with Dr. Desmond Patton and the SAFElab. A Jersey-girl at heart, she received her BA in social work from Seton Hall University, where she also minored in musical theatre. She has performed in New York City and around the United States in various staged productions, most notably the National Tour of The Magic Treehouse: LIVE!. She hopes to continue to combine her social work and theatre backgrounds to find creative and effective solutions to social media’s most urgent problems."
