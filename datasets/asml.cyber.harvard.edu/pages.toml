["https://asml.cyber.harvard.edu/person/alberto-leon"]
title = "Alberto Leon - Applied Social Media Lab at Harvard University"
description = "Alberto Leon is a senior software engineer specializing in decentralized identity architecture and mobile technologies, with extensive contributions to the open-source community. He has focused on architecting and maintaining self-sovereign identity (SSI) solutions and digital identity frameworks, working closely with standards organizations such as W3C and open-source projects under the Hyperledger Foundation. Alberto helps lead..."
full_description = "Alberto Leonaleon@law.harvard.edu Twitter/X Linkedin GithubAlberto Leon is a senior software engineer specializing in decentralized identity architecture and mobile technologies, with extensive contributions to the open-source community. He has focused on architecting and maintaining self-sovereign identity (SSI) solutions and digital identity frameworks, working closely with standards organizations such as W3C and open-source projects under the Hyperledger Foundation. Alberto helps lead the development of an embeddable wallet SDK solution focused on managing Verifiable Credentials for mobile applications, enabling true decentralized identity solutions. Alberto earned his degree in Computer Science from the Instituto Tecnológico de Estudios Superiores de Monterrey in Mexico, where he developed his foundation in software engineering and digital systems. His expertise spans the development of mobile SDKs, integrating decentralized systems, and advancing interoperability within the digital identity ecosystem. At the Berkman Klein Center, Alberto’s research focuses on the role of decentralized protocols in enhancing digital privacy and trust in social media ecosystems."
