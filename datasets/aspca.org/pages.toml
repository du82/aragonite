full_description = '<img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate <img src="https://www.aspca.org/sites/default/files/styles/inner_page_banner/public/field/image/section/nyc_title-background_0.jpg?itok=w58B4ZK0" width="2000" height="430" alt="" /> New York City ASPCA in NYCNYC ResourcesLatest News ASPCA Services in NYC ASPCA Adoption Center Offering remote adoptions in the New York City area! Read more Mobile Adoption Calendar & Locations Our NYC mobile events may have the furry friend you’re looking for! Check our calendar and find an event near you. Read more ASPCA Veterinary & Spay/Neuter Services Learn about the ASPCA Animal Hospital, Spay/Neuter clinics and Community Veterinary Centers. Read more Get Involved in NYC Fostering for the ASPCA Learn more about our animal foster care program and get started today! Read more Volunteering at the ASPCA See volunteer opportunities and find out how to get involved. Read more Veterinary Training Opportunities Veterinary students can choose from different programs where they can learn from ASPCA expert veterinarians. Read more NYC Resources NYC FAQ Answers to common questions from NYC pet parents and animal advocates. Read more Community Engagement In NYC’s five boroughs, the ASPCA works to provide assistance and improve access to critical care and services for animals in need. Read more NYC Covid-19 Response & Policy Priorities [PDF] Our commitment to providing New Yorkers increased support during the pandemic. Read more Found Kittens Outside? Follow this chart to decide the best course of action you can take for the kittens.Read more <img src="https://www.aspca.org/sites/default/files/styles/inner_page_basic_teaser/public/field/image/blog/20240829_as_ben_thumb.jpg?itok=gL_ESkoS" width="335" height="335" alt="" /> August 29, 2024 Golden Boy Ben Is S