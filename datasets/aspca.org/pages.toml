full_description = '<img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate <img height="500" width="1040" class="media-element file-default" data-delta="3" src="https://www.aspca.org/sites/default/files/crc-landing-page-img.jpg" alt="" title="" /> You are hereAnimal Care and Recovery Cruelty Recovery Center <img height="500" width="1040" class="media-element file-default" data-delta="3" src="https://www.aspca.org/sites/default/files/crc-landing-page-img.jpg" alt="" title="" /> The Cruelty Recovery Center (CRC) is part of the ASPCA’s multipronged approach to fighting cruelty nationwide. The CRC partners with several other ASPCA teams to provide local agencies and shelters with the resources they need to make large-scale criminal cases possible. With our deep bench of expertise in investigations, field operations, criminal law, forensics, relocation and placement, as well as in specialized shelter operations, animal behavior and shelter medicine, we can support lifesaving work while sharing what we know to help communities respond more independently to cruelty in the future.The CRC’s team of 44 staff, supported by volunteers, responders and foster caregivers, provides sheltering and enrichment, veterinary care and behavioral care for rescued victims of neglect, abuse and natural disasters. The CRC’s work takes place at the CRC facility in Columbus, Ohio, and in temporary field shelters nationwide.The CRC is part of our Rehabilitation Services group of teams, which also includes the Behavioral Rehabilitation Center in Weaverville, North Carolina, the Learning Lab and the future Recovery and Rehabilitation Center (R&R), which will be located in Pawling, New York.Fostering for the CRCHelp us give animal victims of neglect, cruelty, abuse and natural disasters the best chance to live happy lives by becoming a foster caregiver!Read moreVolunteering for the CRCJoin the CRC volunteer program in Columbus, Ohio, and help support animals in need.Read moreOhio: Adoptable Dogs and CatsThe ASPCA has dogs and cats from our Cruelty Recovery Center ready to find loving homes in the Columbus, Ohio area! Meet them today.Read more Other Ways to Help: Become a Monthly Member Take the Cruelty Pledge Join the Advocacy Brigade Advocate for Animals Volunteer or Foster Share this page: <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/facebook.png" alt="Facebook" /> <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/twitter.png" alt="Twitter" /> <img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate'
