title = "Annual Report | ASPCA"
description = "To learn more about our achievements and efforts to protect and help animals, read our most recent Annual Report."
full_description = '''<img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate You are hereAbout Us Annual Report We are pleased to present our 2023 Annual Report to everyone who shares our passion for animals and dedication to their welfare and protection.The mission of the ASPCA is to provide effective means for the prevention of cruelty to animals throughout the United States. For more than 150 years, the ASPCA has worked to create a world in which animals are safe and respected. We SAVE animals by rescuing them from emergencies and cruelty. We TRANSFORM their lives through compassionate, hands-on care and offer training, consulting and assistance to veterinary professionals and shelters. We PROTECT animals through advocacy and our work to improve public policy, fighting systemic cruelty such as factory farming, horse slaughter and puppy mills.This annual report — alongside our 2023 IRS Form 990 [PDF] and Audited Financial Statement [PDF] — offers a snapshot of the ASPCA's work in 2023. While the Report, our Form 990 and financial statement provide an overview and examples of the work we accomplished, the materials are not meant to comprehensively account for everything we do. Please learn more about the ASPCA by reading answers to frequently asked questions and by visiting our site for animal welfare professionals, ASPCApro.org.Read the 2023 Annual Report ASPCA Financial StatementsThe ASPCA provides our latest financial statements for our donors and the general public in an effort to operate with transparency and accountability.20232023 IRS Form 990 [PDF]ASPCA Audited Financial Statements 2023 [PDF]20222022 IRS Form 990 [PDF]ASPCA Audited Financial Statements 2022 [PDF]20212021 IRS Form 990 [PDF]ASPCA Audited Financial Statements 2021 [PDF]20202020 IRS Form 990 [PDF]ASPCA Audited Financial Statements 2020 [PDF] The American Society for the Prevention of Cruelty to Animals (ASPCA) is committed to efficiency and transparency. We communicate with our members, supporters, prospects and donors by postal mail and other means, both to request contributions to our cause, and to educate the public about various animal welfare issues around the country. These efforts help advance our mission to provide effective means for the prevention of cruelty to animals throughout the United States. As a result, in accordance with the Financial Accounting Standards Board (FASB) guidelines and Internal Revenue Service (IRS) guidance, the ASPCA allocates a portion of our fundraising costs to program services. As nonprofit organization that is exempt from federal taxation, we ensure our donors’ money is spent on helping animals across the country as efficiently and effectively as possible. Other Ways to Help: Become a Monthly Member Join the Advocacy Brigade Advocate for Animals Volunteer or Foster Share this page: <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/facebook.png" alt="Facebook" /> <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/twitter.png" alt="Twitter" /> <img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate'''
