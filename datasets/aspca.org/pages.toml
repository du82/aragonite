full_description = '<img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate <img alt="a pitbull in a subaru" class="media-element file-default" data-delta="2" src="https://www.aspca.org/sites/default/files/blog_subaru-stl-anouncement_040419_main.jpg" width="1040" height="500" title="" /> You are hereAbout Us Strategic Cause Partnerships Subaru Subaru VIP Program VIP Deal for ASPCA Guardians and Founders <img alt="a pitbull in a subaru" class="media-element file-default" data-delta="2" src="https://www.aspca.org/sites/default/files/blog_subaru-stl-anouncement_040419_main.jpg" width="1040" height="500" title="" /> Subaru of America, Inc. invites all eligible ASPCA Guardian and Founder’s Society members to participate in the Subaru VIP Program. As an ASPCA Guardian or Founder, you may qualify for this special offer from Subaru when you purchase or lease a new Subaru!ELIGIBILITY Eligible Guardian members must be active and contributing members for at least six consecutive months to participate. Qualified Founder’s Society members include those who contribute $500 or more annually. Founders are eligible for the VIP Program 30 days after making their donation to the ASPCA.If interested and eligible, please submit the VIP Verification Form Request below. The ASPCA must verify your Guardian or Founder’s Society membership status to confirm eligibility before submitting your request to Subaru. You will then receive the Subaru VIP Retailer Visit Authorization form via email from Subaru.IMPORTANT DETAILSYou must receive your Subaru VIP Retailer Visit Authorization form BEFORE contacting your participating Subaru retailer to qualify for this offer. If you purchase or lease a new Subaru without this form, you will not be eligible to receive the VIP Program offer.Due to the high volume of requests, please allow up to 5 business days for your form to be processed.The VIP Program offer cannot be retroactively applied. Please note that each form is valid for 45 days or until the date of delivery, provided a factory order was placed during the initial 45-day eligibility period. If your form has expired and an order was not placed, you can request a renewal simply by sending an inquiry to [email protected] or by calling (646) 706-4900.Subaru VIP Retailer Visit Authorization forms will only be issued to the eligible member and his or her spouse or domestic partner residing in the same household (address verification required). The VIP Program offer is non-transferable and does not extend to family members such as parents, siblings, children, etc.Limited time offer subject to change without notice. All sales are subject to availability and retailer discretion. Valid in the U.S. only, except Hawaii. Terms and conditions apply. Prior sales excluded. Certain models may be excluded. May not be combined with all Subaru incentives. Other Ways to Help: Become a Monthly Member Advocate for Animals Join the Advocacy Brigade Volunteer or Foster Share this page: <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/facebook.png" alt="Facebook" /> <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/twitter.png" alt="Twitter" /> <img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate'
