["https://aspca.org/about-us/press-releases/nearly-90-equines-seized-court-order-breeding-operation-madison-county-mont"]
title = "Nearly 90 Equines Seized by Court Order from Breeding Operation in Madison County, Mont. | ASPCA"
full_description = '''Other Ways to Help: Become a Monthly Member Advocate for Animals Join the Advocacy Brigade Volunteer or Foster You are hereAbout Us Press Releases Nearly 90 Equines Seized by Court Order from Breeding Operation in Madison County, Mont. ASPCA, Madison County Sheriff’s Office partner to support horses after Court Order seizure as part of an investigation into alleged animal cruelty January 28, 2025 Madison County, Mont. – At the request of the Madison County Sheriff's Office, the ASPCA® (American Society for the Prevention of Cruelty to Animals®) is assisting with the care of nearly 90 Morgan horses from a property in Madison County, Mont. The horses were seized under court order as part of an investigation into alleged animal cruelty. Some of the horses appeared to be underweight and suffering from untreated medical conditions, injuries, and hoof issues. The Humane Society of Western Montana (HSWM) has been collaborating with the Madison County Sheriff's Office (MCSO), and with the generous support of two community members, providing basic care and hay. HSWM and MCSO then sought the support of the ASPCA for ongoing and in-depth care.The ASPCA is on the ground, providing these horses with daily care and veterinary services. With this collaborative effort, MCSO and the ASPCA will ensure the horses receive the support they need until legal disposition is determined. The ASPCA is leading efforts to ensure the horses receive proper husbandry and medical care and is supporting the criminal case to help ensure best legal outcomes for these animals.Animal cruelty charges have been filed based on evidence collected by the Madison County Sheriff's Office, and the Madison County Attorney's Office is prosecuting the case. Should the ASPCA be granted ownership of the animals, all involved parties are committed to finding appropriate, safe, and loving homes for them, taking into consideration the genetic importance of this population as well as their individual needs.The ASPCA deploys nationally to assist local authorities in animal cruelty cases including animal fighting, hoarding, and puppy mills. It also provides local communities with resources including grant funding, training, and subject matter expertise to effectively assist animals during cruelty and disaster situations and has a dedicated Equine Welfare team with expertise in sheltering, rehabilitation, behavioral assessment and training, placement and adoption. ###About the ASPCA®Founded in 1866, the ASPCA® (The American Society for the Prevention of Cruelty to Animals®) was the first animal welfare organization to be established in North America and today serves as the nation’s leading voice for vulnerable and victimized animals. As a 501(c)(3) not-for-profit corporation with more than two million supporters nationwide, the ASPCA is committed to preventing cruelty to dogs, cats, equines, and farm animals throughout the United States. The ASPCA assists animals in need through on-the-ground disaster and cruelty interventions, behavioral rehabilitation, animal placement, legal and legislative advocacy, and the advancement of the sheltering and veterinary community through research, training, and resources. For more information, visit aspca.org, and follow the ASPCA on Facebook, X, Instagram, and TikTok. Other Ways to Help: Become a Monthly Member Advocate for Animals Join the Advocacy Brigade Volunteer or Foster Share this page: <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/facebook.png" alt="Facebook" /> <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/twitter.png" alt="Twitter" />'''
