["https://www.aspca.org/news/5-ways-were-helping-puppy-mill-dogs-and-how-you-can-take-action-too"]
title = "5 Ways We’re Helping Puppy Mill Dogs and How You Can Take Action, Too! | ASPCA"
description = "The cruel puppy mill industry is still all too prevalent with over 250,000 dogs across the U.S. living in federally licensed commercial breeding facilities. See what we're doing to help puppy mill dogs and how you can take action, too!"
full_description = '<img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate <img alt="small puppy mill dog with her puppies" height="500" width="1040" class="media-element file-default" data-delta="1" src="https://www.aspca.org/sites/default/files/blog_5-ways-help-pm-dogs_main.jpg" title="" /> You are hereNews 5 Ways We’re Helping Puppy Mill Dogs and How You Can Take Action, Too! September 18, 2024 <img alt="small puppy mill dog with her puppies" height="500" width="1040" class="media-element file-default" data-delta="1" src="https://www.aspca.org/sites/default/files/blog_5-ways-help-pm-dogs_main.jpg" title="" /> Right now, a quarter of a million dogs across the United States live in federally licensed puppy mills. They are bred over and over again until their bodies give out. They live their whole lives in filthy, small, cramped cages, never given the chance to see the sun or breathe fresh air, or they are kept outside in extreme temperatures, without protection from the wind and rain. They are denied exercise, adequate veterinary care, and clean food and water. They are treated like products rather than living beings who deserve love.September 21 is Puppy Mill Awareness Day, a time to remind animal lovers that this shadowy and cruel industry is still all too prevalent. Dogs deserve so much better than this. Here’s how we’re helping puppy mill dogs and how you can take action, too!1. Working to strengthen enforcement of the federal Animal Welfare Act. The U.S. Department of Agriculture (USDA) is the federal agency authorized to enforce the Animal Welfare Act, the only federal law that sets requirements for the care of animals in commercial breeding facilities, which includes dogs in puppy mills. Yet time and again, the USDA has neglected its responsibility and failed to enforce those requirements. Goldie’s Act is a federal bill named after a Golden Retriever who lived and died in a licensed puppy mill that would strengthen enforcement of the Animal Welfare Act. Use our easy online form to ask your members of Congress to support Goldie’s Act.2. Shutting down the puppy mill-to-pet-store pipeline. States across the country, like California, Maryland and New York, have shut down the puppy mill-to-pet-store pipeline by ending the sale of cruelly bred dogs in their states’ pet stores. Right now, New Jersey lawmakers are considering a bill to stop the retail sale of dogs, cats and rabbits. It’s an issue actor Edie Falco is passionate about — watch her video to learn more. If you live in New Jersey, urge your lawmakers to support the bill to shut down the puppy mill pipeline into your state.3. Exposing the truth about puppy mills. In one of the most in-depth investigations to date, the Los Angeles Times recently published an investigative story exposing the horrific journey of puppy mill puppies, using public records — including some provided by the ASPCA — to show where these puppies end up and the lengths to which the industry will go to deceive unsuspecting pet lovers. Read the article for an up-close view of the inhumane puppy mill industry.4. Suing the USDA for failing to release animal welfare records. The USDA is hiding records that show how dogs in federally licensed commercial breeding facilities are treated, and we’re holding the agency accountable. These records, which we frequently request under the Freedom of Information Act, shed light on the USDA’s enforcement (or lack thereof) of the Animal Welfare Act. The agency routinely fails to disclose these records despite being required to by law, so we’re taking it to court.5. Reminding dog lovers to never buy a dog from a pet store or online. Brick-and-mortar and online pet store puppies come from commercial breeding facilities. If you or someone you know is considering adding a new pet to the family, adopt from a local shelter or rescue or find a responsible breeder. Use our handy infographic to make sure you are not supporting the cruel puppy mill industry.This Puppy Mill Awareness Day, let’s remember the hundreds of thousands of dogs and puppies who have suffered at the hands of this cruel industry. We will continue to fight for them, and we hope you will join us! Other Ways to Help: Become a Monthly Member Take the Cruelty Pledge Join the Advocacy Brigade Advocate for Animals Volunteer or Foster Related News These Adoptable Pups Are Ready for the Red Carpet — The 2025 Paw-scars Winners Are Here! Honor and Defend Horses on National Horse Protection Day Siblings Adopting Siblings: How Shayan and Ilma Found Charlie and Mark Share this page: <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/facebook.png" alt="Facebook" /> <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/twitter.png" alt="Twitter" /> <img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate'
