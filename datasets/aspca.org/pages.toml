full_description = '''<img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate <img src="https://www.aspca.org/sites/default/files/styles/inner_page_banner/public/field/image/section/fir_puppymill_mio_mi_2015dec14_0009.jpg?itok=-LqUJDRR" width="2000" height="430" alt="" /> Ways to Give As a non-profit organization, the ASPCA depends entirely on donations from kindhearted people like you. Donate to the ASPCA and Help Animals For over 150 years, the ASPCA has worked tirelessly to put an end to animal abuse and neglect. We are a national leader in animal rescue, protection and placement, and your tax-deductible donation will help fight cruelty and make a life-changing difference for animals across America. MAKE A ONE-TIME DONATION Monthly Donation Monthly giving is an easy, efficient and tax-deductible way to make a difference for animals all year long. Become an ASPCA Guardian today. Read more Memorial and Honor Gifts Honor a person or pet by making a gift in their name. Choose to send a Memorial, Honor or Birthday card. Read more Planned Giving Support our work for animals while also fulfilling your own financial goals and objectives. Read more Founder's Society ASPCA Founders are generous supporters who make a gift of $500 or more. Read more Heroes Circle Heroes Circle donors provide critical support of $10,000 or more, enabling the ASPCA to be there for animals when they need us the most. Read more Pet Care Items From Chewy.com When you shop for pet care supplies from this page, your purchase may benefit the ASPCA! Read more Wish Lists Donate needed animal care products directly to our program locations through the donation tool Donative. Read more Got Room In Your Heart for Me? Join the ASPCA Today Donate Now: Credit Card Checking or Savings Account Other Ways to Give: Donate Your Car Peer to Peer Fund