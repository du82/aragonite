["https://aspca.org/ways-to-give/workplace-giving"]
title = "Workplace Giving l Employee Donations l Ways to Give l ASPCA"
description = "Did you know that you can donate to the ASPCA seamlessly through payroll deductions? And since companies often match employee contributions, workplace giving provides you with the opportunity to directly influence your company's philanthropic endeavors."
full_description = '''<img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate You are hereWays to Give Workplace Giving Did you know that you can donate to the ASPCA seamlessly through payroll deductions? And since companies often match employee contributions, workplace giving provides you with the opportunity to directly influence your company's philanthropic endeavors. Set Up a Workplace Giving Program at Your CompanyWorkplace giving can help a business demonstrate community benefit, contribute to corporate social responsibility objectives, build business reputation and profile, and achieve or maintain status as a “workplace of choice.” It can also build employee morale and loyalty, and develop a corporate culture of giving.The following companies provide workplace giving program services and payroll deductions. Click on the links below to learn more:www.benevity.comwww.cybergrants.comwww.frontstream.comwww.yourcause.com Payroll DeductionsPrivate Company EmployeesCheck with your payroll administrator to see if the ASPCA is on your company's list of approved charities in your workplace contribution campaign. If we are not listed, ask if you can write us in or have us added to the list. Here is some information that will help you put us on your company's list of approved charities:Tax ID/EIN number:13-1623829Full Name:The American Society for the Prevention of Cruelty to Animals (ASPCA)Address:424 East 92nd StreetNew York, NY 10128Federal EmployeesOur CFC number is 11645If you are a federal employee, please keep in mind that you can give to the ASPCA through the Combined Federal Campaign (CFC), which runs from September through December each year. Whether you donate $1, $10 or more per paycheck, or make a one-time donation, your contribution will go a long way in helping us prevent cruelty to animals. .City and State EmployeesIn addition to the CFC, the ASPCA participates in a variety of workplace campaigns as a member of Independent Charities of America (ICA) and Animal Charities of America. We are usually included in these state campaigns: California, Connecticut, Illinois, Massachusetts, Maryland, Michigan, Mississippi, North Carolina, New Jersey, New York, Pennsylvania, Rhode Island, Texas, Utah, Virginia, Washington and Wisconsin. Please look for us in your workplace giving campaign brochure. Matching GiftsDid you know that some companies will match employee donations so you can double your impact? Check if Your Company Will Match Your Gift.More Ways to Give Through Your WorkplaceCreate a Facebook FundraiserFacebook now gives you the option to create a fundraising campaign to help drive crucial funds to animals in need across the country by donating to the ASPCA. This is a fun and simple way to engage your employees as well as the rest of your social media followers. Your employees can easily share the campaign with their friends and family, too!Facebook fundraisers provide great exposure for your brand by demonstrating your company’s commitment to helping animals in need. To further showcase your commitment, your company could also pledge to match all fundraiser donations up to a certain match amount. This is a very exciting way to create social buzz and motivate your employees and the public to give. Find out more and get started today.Please contact [email protected] for more information. Other Ways to Help: Become a Monthly Member Advocate for Animals Join the Advocacy Brigade Volunteer or Foster Share this page: <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/facebook.png" alt="Facebook" /> <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/twitter.png" alt="Twitter" /> <img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate'''
