full_description = '<img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate <img src="https://www.aspca.org/sites/default/files/styles/inner_page_banner/public/field/image/section/top-nav_banner-image_people-and-pets_b.jpg?itok=pwLzg1q0" width="2000" height="430" alt="" /> Helping Shelters, People and Pets The ASPCA works to keep more animals in loving homes by protecting animals from harmful situations through community engagement, preventative action and providing resources and care when needed. Shelter Collaboration The ASPCA works with animal welfare organizations to help animals across the country. Read more Keeping Animals in Homes Common, recurring issues can prevent willing adopters from adopting pets or keeping animals in their homes. Read more Shelter Intake & Surrender Overwhelming intake rates can prohibit shelters from re-homing all the animals who come through their doors. Read more Animal Hoarding Animal hoarding is a complex issue that occurs when a person houses more animals than they can care for, which often leads to neglect. Read more Animal Relocation The ASPCA transports animals to participating shelters to save pets’ lives Read more Spay/Neuter The ASPCA performs spay/neuter operations on both coasts, and shares best practices with shelters nationwide. Read more Animal Poison Control Crucial information for all pet parents to protect their furry friends. Read more Found Kittens Outside? Follow this chart to decide the best course of action you can take for the kittens.Read more Other Ways to Help: Become a Monthly Member Join the Advocacy Brigade Advocate for Animals Volunteer or Foster Related Links for Professionals Adoption Ambassadors Fee-Waived Adoptions Share this page: <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/facebook.png" alt="Facebook" /> <img sr