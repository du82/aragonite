full_description = '''<img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate <img src="https://www.aspca.org/sites/default/files/styles/inner_page_banner/public/field/image/section/adopt-a-pet_title_background.jpg?itok=QcpdV9al" width="2000" height="430" alt="" /> Adopt a Pet ASPCA AdoptionsLocal SheltersHappy Tails Adopt a Pet from the ASPCA Thank you for your interest in adopting from the ASPCA! Please take a look at our adoptable dogs and cats below, and if you’re interested in adopting, click the “Adopt Me” button or complete the adoption survey linked for that pet. If our team determines that you and the pet you’ve applied for are a good match, you’ll hear from us with more information about our adoption process—which may take up to a week.If you are adopting from New York City, please wait to visit the Adoption Center in-person until you’ve heard from our team, as we operate by appointment.Our Los Angeles adoption program is entirely foster-based and currently offering remote adoptions. Adopting a pet in the New York City, Los Angeles, Asheville or Columbus area? The ASPCA’s wonderful adoptable dogs and cats are waiting for you right now! View adoptable animals below. NYC: Adoptable Dogs The ASPCA has plenty of dogs available for adoption and waiting for loving homes. Read more NYC: Adoptable Cats If you're in the New York City area and would like to adopt a cat or kitten who really needs you, you're in the right place. Read more Los Angeles: Adoptable Cats The ASPCA in Los Angeles has cats available for adoption from ASPCA foster volunteer homes. Read more North Carolina: Adoptable Dogs If you’re in the Asheville, North Carolina area, meet our BRC graduate dogs who are looking for homes! Read more Ohio: Adoptable Dogs and Cats The ASPCA has dogs and cats from our Cruelty Recovery Center ready to find loving homes in the Columbus, Ohio area! Meet them today. Read more Nationwide: Adoptable Horses My Right Horse lists adoptable and fosterable horses from the ASPCA’s trusted network of equine Adoption Partners. Read more Pet of the Week: Guppy Guppy is looking for a home in the Columbus, Ohio, area. Adopt this sweet, goofy guy who loves toys and treats! Read more ASPCA Adoption Center in NYC The ASPCA Adoption Center is a spacious, state-of-the-art shelter with highly qualified veterinarians and behavior counselors on staff. Read more Adoption Tips We’ve put together some tips to help you chose the right pet—and to help prepare your home for a new furry friend! Read more Adopt a Pet Locally Read on for all the information you need to prepare to adopt a cat, kitten, dog or puppy from an animal shelter or rescue group in your area. Find a Shelter Our helpful guide for ways to identify animal shelters and adoptable pets in your area. Read more Adoptable Dogs in Your Local Shelter Check out our nationwide database of dogs looking for good homes. Read more Adoptable Cats in Your Local Shelter Browse adoptable kitties near you and find your new best friend. Read more Read MoreRead More Adoptable Horses Visit My Right Horse to see hundreds of adoptable horses located all around the country. Read more Adoption Tips We’ve put together some tips to help you chose the right pet—and to help prepare your home for a new furry friend! Read more <img src="https://www.aspca.org/sites/default/files/styles/inner_page_basic_teaser/public/field/image/blog/ht_mark-charlie_022625_thumb.jpg?itok=6-1qvAOy" width="335" height="335" alt="Mark and Charlie" /> February 26, 2025 Siblings Adopting Siblings: How Shayan and Ilma Found Charlie and Mark <img src="https://www.aspca.org/sites/default/files/styles/inner_page_basic_teaser/public/field/image/blog/ht_iris_021925_thumb.jpg?itok=GHxJY3hr" width="335" height="335" alt="Iris" /> February 19, 2025 Though Short on Vision and Small in Stature, Iris Is Large on Love <img src="https://www.aspca.org/sites/default/files/styles/inner_page_basic_teaser/public/field/image/blog/ht_russer_021225_thumb.jpg?itok=fCP42Irq" width="335" height="335" alt="Russer with Cam and Lia" /> February 12, 2025 Underdog Russer Helps Fill the Hole in One Couple’s Broken Hearts <img src="https://www.aspca.org/sites/default/files/styles/inner_page_basic_teaser/public/field/image/blog/ht_ben_020525_thumb.jpg?itok=lR40qM7x" width="335" height="335" alt="Ben with front paws crossed" /> February 5, 2025 Gentle Ben’s Big Break <img src="https://www.aspca.org/sites/default/files/styles/inner_page_basic_teaser/public/field/image/blog/ht_polka_012925_thumb.jpg?itok=H0ONw2un" width="335" height="335" alt="Polka" /> January 29, 2025 Speckled and Freckled, This Polka Is Living a Well-Rounded Life Load more Other Ways to Help: Become a Monthly Member Advocate for Animals Join the Advocacy Brigade Volunteer or Foster Share this page: <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/facebook.png" alt="Facebook" /> <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/twitter.png" alt="Twitter" /> <img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate'''
