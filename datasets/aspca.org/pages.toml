["https://aspca.org/animal-care-recovery/kitten-nursery"]
title = "ASPCA Kitten Nursery | Caring for Neonatal Cats| ASPCA"
description = "During the summer feline breeding season, known as kitten season, animal shelters across the country are flooded with homeless and newborn cats. To accommodate this seasonal influx of felines, the ASPCA opened a new facility in 2014 dedicated to the care and treatment of neonatal (newborn) kittens."
full_description = '<img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate <img height="402" width="1040" class="media-element file-default" data-delta="1" src="https://www.aspca.org/sites/default/files/our-response_kitten-nursery_tab-image.jpg" alt="" title="" /> You are hereAnimal Care and Recovery Kitten Nursery <img height="402" width="1040" class="media-element file-default" data-delta="1" src="https://www.aspca.org/sites/default/files/our-response_kitten-nursery_tab-image.jpg" alt="" title="" /> During the summer feline breeding season, known as kitten season, animal shelters across the country are flooded with vulnerable newborn cats. To accommodate this seasonal influx of felines, the ASPCA opened a facility in 2014 dedicated to the care and treatment of neonatal (newborn) kittens. The city’s first high-volume Kitten Nursery provides care for felines too young to survive on their own.... <!--//--><![CDATA[// ><!-- var cpo = []; cpo["_object"] ="cincopa_d24a85"; cpo["_fid"] = "AMIAf9MnKbFy"; var _cpmp = _cpmp || []; _cpmp.push(cpo); (function() { var cp = document.createElement("script"); cp.type = "text/javascript"; cp.async = true; cp.src = "https://rtcdn.cincopa.com/libasync.js"; var c = document.getElementsByTagName("script")[0]; c.parentNode.insertBefore(cp, c); })(); //--><!]]> Caring for newborn cats is a time-consuming and resource-intensive process, as these young animals require round-the-clock attention. Now, more than ever, the Nursery relies on foster volunteers to aid in this care. Kittens spend the majority of their time in foster homes, with only those requiring close medical monitoring staying on-site at the ASPCA. The Nursery serves both nursing cats with litters and orphaned kittens that are taken in by Animal Care Centers of New York City (ACC) throughout the five boroughs on a daily basis.Frequently Asked QuestionsWhat kind of kittens does the Nursery help?The Nursery serves both nursing cats with litters and orphaned kittens up to eight weeks old. These kittens usually come to us through Animal Care Centers of New York City (ACC) and from the public throughout the five boroughs. The Nursery has a particular focus on kittens with greater medical needs, helping them through the most vulnerable stage of their lives, until they are old enough and healthy enough for adoption. How can I help?There are many ways you can help kittens! Consider becoming a kitten foster for the ASPCA in NYC or at a shelter near you!What can I expect with kitten fostering?Most kittens that come to us require frequent visits to the Nursery for recheck appointments due to medical needs and will stay with foster caregivers until they are adopted. The time commitment varies based on the kitten’s age, but the average foster period for kittens is between two to eight weeks. If this sounds like right fit for you, learn more about how to apply to foster with us!What if I found a kitten?Follow our step-by-step found kitten guide and get all the information you need for next steps.Can I adopt a Nursery kitten?Kittens are available for adoption after they are spayed or neutered. The ASPCA Adoption Center consistently has kittens available for adoption during the summer months. Other Ways to Help: Become a Monthly Member Advocate for Animals Join the Advocacy Brigade Volunteer or Foster Share this page: <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/facebook.png" alt="Facebook" /> <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/twitter.png" alt="Twitter" /> <img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate'
