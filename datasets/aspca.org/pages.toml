["https://www.aspca.org/news/expanding-support-oklahoma-horses-through-education"]
title = "Expanding Support for Oklahoma Horses Through Education | ASPCA"
description = "The ASPCA recently welcomed 31 Oklahoma law enforcement personnel from 14 agencies for a full day of equine training. Attendees learned horse handling and behavior, investigation tips, cruelty laws and more, providing important equine education to use immediately in their communities."
full_description = '<img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate <img alt="group photo at ETAC event" height="500" width="1040" class="media-element file-default" data-delta="1" src="https://www.aspca.org/sites/default/files/blog_ok-horse-education_121224_main.jpg" title="" /> You are hereNews Expanding Support for Oklahoma Horses Through Education December 12, 2024 <img alt="group photo at ETAC event" height="500" width="1040" class="media-element file-default" data-delta="1" src="https://www.aspca.org/sites/default/files/blog_ok-horse-education_121224_main.jpg" title="" /> On November 20, 2024, the ASPCA worked with community partners to host our first full-day, equine-focused law enforcement training in Oklahoma. Thirty-one Oklahoma law enforcement personnel from 14 statewide agencies attended the training. The eight-hour course was certified through the Oklahoma Council on Law Enforcement Education & Training and was held at the ASPCA’s Equine Transition and Adoption Center (ETAC) outside of Oklahoma City.Attendees participated in sessions that covered a wide range of equine-related topics such as horse handling and behavior, equine medical evaluation and triage, investigation tips, evidence identification and documentation and cruelty laws.... <!--//--><![CDATA[// ><!-- var cpo = []; cpo["_object"] ="cincopa_b9ff40"; cpo["_fid"] = "A8KARfvDaR8Z"; var _cpmp = _cpmp || []; _cpmp.push(cpo); (function() { var cp = document.createElement("script"); cp.type = "text/javascript"; cp.async = true; cp.src = "https://rtcdn.cincopa.com/libasync.js"; var c = document.getElementsByTagName("script")[0]; c.parentNode.insertBefore(cp, c); })(); //--><!]]> “The course was an extension of an effort we began with Oklahoma animal control officers in 2021,” said Tom Persechino, senior director of ETAC. “This incredible collaboration allows us to make Oklahoma a model for equine welfare. The level of interest in the training was incredible and having ASPCA teach and host these professionals could not have been more impactful.”The training will have a ripple effect as the attendees bring back their learnings and implement them in counties across Oklahoma. As Deputy Patricia Benavidez of the Payne County Sheriff’s Office, who attended, said: “The information gathered here will be beneficial to others at my agency and will drive home the point of a thorough investigation and the importance of looking into these cases.”Increasing educational opportunities for law enforcement officials aligns with ASPCA’s holistic approach to improving equine welfare in Oklahoma. Through ETAC, equine owners can access cost-free veterinary care with the goal of keeping their horse safe in a loving home; euthanasia services, if needed; or safe relinquishment options. For horses being relinquished, ETAC provides behavioral and medical rehabilitation before finding the horses adoptive homes.The ASPCA is working to plan additional equine law enforcement trainings in Oklahoma in 2025. Interested in joining a future training? Email us at [email protected]. Other Ways to Help: Become a Monthly Member Join the Horse Action Team Join the Advocacy Brigade Related News Honor and Defend Horses on National Horse Protection Day ‘We Don’t Ever Want to Be Without Horses’: Oklahoma Family Welcomes Two New Horses to Their Herd Celebrate Last Year’s Big Wins! Share this page: <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/facebook.png" alt="Facebook" /> <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/twitter.png" alt="Twitter" /> <img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate'
