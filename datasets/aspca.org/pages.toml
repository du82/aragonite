["https://aspca.org/improving-laws-animals/public-policy/horse-slaughter"]
title = "Horse Slaughter Is Not Euthanasia | Learn More | ASPCA"
description = "Approximately 20,000 American horses are slaughtered for human consumption every year. Learn more and join the 80% of American voters who favor a ban."
full_description = '<img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate You are hereImproving Laws for Animals Public Policy Horse Slaughter <img src="https://www.aspca.org/sites/default/files/styles/inner_page_tab_background/public/field/image/subsection/horse-slaughter_tabbed-image.jpg?itok=iqzeMPYx" width="1040" height="402" alt="Horse Slaughter" title="Horse Slaughter" /> The IssueLatest News Horse Slaughter Is Not Euthanasia.In the year 2024, approximately 19,000 American horses were trucked over our borders to be slaughtered for human consumption. Until this practice is banned and Congress passes a law against slaughter here in the U.S., no horse is safe.The term “horse slaughter” refers exclusively to the killing horses for human consumption. Horse slaughter is NOT humane euthanasia. While “euthanasia” is defined as a gentle, painless death provided in order to prevent suffering, slaughter is a brutal and terrifying end for horses.Horses bound for slaughter (who may include pregnant mares, foals and horses who are injured or blind) are commonly and legally shipped for more than 24 hours at a time in crowded trucks without food, water or rest. The methods do not uniformly provide quick, painless deaths for all, and there are documented instances in which horses have been observed conscious during dismemberment. As flight animals, horses commonly respond to a noisy environment where they see, smell and sense danger by flinging their heads in the kill box, creating obvious potential for multiple injuries during stunning.Horse Slaughter in the United StatesThe last three U.S. slaughterhouses — two in Texas and one in Illinois, all foreign-owned — were shuttered in 2007. In 2006, these facilities killed more than 104,000 horses for human consumption, shipping the meat overseas.Slaughterhouses have proved to be environmentally damaging as well as economically draining to the communities that have housed them. Notably, communities with experience hosting horse slaughter facilities do not want them back: Texas and Illinois have enacted laws that specifically ban selling, giving and possessing horse meat intended for human consumption.Meet Camille, Mama and Twister, Phoenix and Journey, who were bound for slaughter before fate stepped in. Their miraculous stories inspire our work to create brighter futures for equines.Horse Slaughter AbroadThough exports have been dropping in recent years, tens of thousands of American equines continue to be shipped to slaughter across our borders annually. In 2024, 19,000 horses were trucked over our borders to slaughter facilities in Mexico and Canada.Reopening slaughterhouses in America is not the answer to ending this form of cruelty. In fact, even when horse slaughter facilities operated in the United States, tens of thousands of American horses were still exported to other countries for slaughter.Additionally, long-distance transport without welfare and safety protocols that are enforced is an inherently cruel aspect of this industry. A recent peer-reviewed study found that 79% of slaughtered horses had excessive bruising from transport-related injuries, and the USDA’s own inspection documents revealed similar gruesome injuries when horse slaughter plants were operating in the U.S.Impacts on the Equine Community Despite horse slaughter’s end within the U.S., the underground industry continues to prey on horse owners, trainers, businesses, and adoption organizations throughout the country. At auctions, “kill buyers” — individuals that routinely sell equines to slaughter for profit — actively outbid good homes and adoption organizations, forcing them to spend precious resources to save an animal that may otherwise have had a safe place to go. These individuals also often pose as good homes to owners looking to rehome their beloved equine partner, and later sell the animals to abattoirs in Canada and Mexico. The fear that this predatory behavior strikes into the equine community can create additional risks to equine welfare. The ASPCA is at the forefront of addressing risks on the ground, but such negative outcomes will persist so long as American horses are shipped across our borders for meat. The FutureUntil a ban is in place, every American horse is at risk of meeting this fate. Fortunately, the Save America’s Forgotten Equines (SAFE) Act is expected to be reintroduced in Congress in early 2025. The bill would prohibit the slaughter of horses for human consumption in the United States and ban their export abroad for that purpose — but we need your help to ensure Congress passes this important legislation.End Horse Slaughter <img src="https://www.aspca.org/sites/default/files/styles/inner_page_basic_teaser/public/field/image/blog/blog_nhpd_022725_thumb.jpg?itok=kKszs0v0" width="335" height="335" alt="4 horses in a pasture" /> February 27, 2025 Honor and Defend Horses on National Horse Protection Day <img src="https://www.aspca.org/sites/default/files/styles/inner_page_basic_teaser/public/field/image/blog/thumb-pettitte_a0049924744_2023jan17_0040.jpg?itok=4OYvKQYf" width="335" height="335" alt="A german shepherd with their head tilted" /> January 10, 2025 Celebrate Last Year’s Big Wins! <img src="https://www.aspca.org/sites/default/files/styles/inner_page_basic_teaser/public/field/image/blog/farmbillthumb5.jpg?itok=4BrYHqZR" width="335" height="335" alt="Calf and mother" /> May 3, 2024 Big News for Animals: Farm Bill Framework Finally Unveiled <img src="https://www.aspca.org/sites/default/files/styles/inner_page_basic_teaser/public/field/image/blog/335x335-phoenix-9-22-2021-longmeadow-staff.png?itok=FjqkuROg" width="335" height="335" alt="Brown horse" /> March 19, 2024 Stories of Survival (Equine Edition): Phoenix <img src="https://www.aspca.org/sites/default/files/styles/inner_page_basic_teaser/public/field/image/blog/335x335-camille-3.png?itok=HpccWIWE" width="335" height="335" alt="Camille" /> March 18, 2024 Stories of Survival (Equine Edition): Camille Load more Lorem Ipsum Lorem Ipsum Lorem ipsum dolor sit amet, consectetur adipiscing elit. Read more Lorem Ipsum Lorem Ipsum Lorem ipsum dolor sit amet, consectetur adipiscing elit. Read more Latest News Other Ways to Help: Become a Monthly Member Join the Horse Action Team Join the Advocacy Brigade Related Links for Professionals Equine Webinars Join the Warm-Up Ring Vet Direct Safety Net Share this page: <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/facebook.png" alt="Facebook" /> <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/twitter.png" alt="Twitter" /> <img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate'
