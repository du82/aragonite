description = "The ASPCA hosts a variety of events throughout the year that appeal to animal lovers with various animal welfare interests. Please stay tuned for more information about opportunities to attend an ASPCA Signature Event."
full_description = '<img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate You are hereAbout Us ASPCA Events <img src="https://www.aspca.org/sites/default/files/styles/inner_page_tab_background/public/field/image/subsection/about-us_aspca-events_signature-events_tab-image.jpg?itok=NiBiUkJH" width="1040" height="402" alt="" /> EventsLatest News Signature Events The ASPCA hosts a variety of events throughout the year that appeal to animal lovers with various animal welfare interests. By taking part in an ASPCA Signature Event, you’ll help spread awareness about animal cruelty and show your support for the ASPCA’s work to help animals in need nationwide. Please stay tuned for more information about opportunities to attend an ASPCA Signature Event. ASPCA Humane Awards Luncheon An annual event celebrating extraordinary animals and heroic people. Read more Animal-Interest Events Throughout the year, the ASPCA hosts, participates in and elevates virtual or in-person events that help bring awareness to our critical, lifesaving work. From adoption events and virtual celebrations to consumer-education campaigns, we provide ways for everyone to get involved and help animals in need. Adopt a Horse Month The ASPCA recognizes every May as Adopt a Horse Month, which we founded in 2021 in order to find homes for more horses and ensure good welfare for all equines. Read more <img src="https://www.aspca.org/sites/default/files/styles/inner_page_basic_teaser/public/field/image/blog/blog_ce-vaccine-event_121924_thumb.jpg?itok=VM9Gfovo" width="335" height="335" alt="A woman holding her dog while ASPCA staff gives it a vaccine" /> December 19, 2024 ASPCA Hosts ‘Paws and Police’ Vaccine Event Providing Free Vaccinations to Community Pets <img src="https://www.aspca.org/sites/default/files/styles/inner_page_basic_teaser/publi