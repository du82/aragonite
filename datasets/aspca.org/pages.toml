["https://www.aspca.org/animal-care-recovery/cruelty-recovery-center/crc-adoptables/guppy"]
title = "Guppy | ASPCA"
description = "Guppy is a 1-year-old, 37-pound neutered male with a heart full of love and a playful spirit. He’s social, excitable and loves playing with other dogs, especially in chase and interactive play."
full_description = 'You are hereAnimal Care and Recovery Cruelty Recovery Center CRC Adoptables Guppy Sex: Male Age: 1 year Weight: 37 lb. Guppy is a 1-year-old, 37-pound neutered male with a heart full of love and a playful spirit. He’s social, excitable and loves playing with other dogs, especially in chase and interactive play. Toys are his ultimate motivator — he’ll toss them around and keep himself entertained for hours. Guppy is also treat-motivated and eager to learn, picking up commands like "sit" in no time!Guppy is looking for his second chance at a loving home. He did great on an offsite trip to the park, enjoying walks and sniffing around with his dog friends. He’s a sweet and goofy boy who will bring endless joy to any family willing to give him the love and care he deserves.Want to adopt Guppy? Fill out an adoption application to schedule a meet-and-greet with him! Foster for the CRC Help us give animal victims of neglect, cruelty, abuse and natural disasters the best chance to live happy lives by becoming a foster caregiver! Apply Now Other Ways to Help: Become a Monthly Member Advocate for Animals Join the Advocacy Brigade Volunteer or Foster Share this page:'
