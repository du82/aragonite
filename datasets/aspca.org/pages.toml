["https://aspca.org/grants"]
title = "ASPCA Grants | ASPCA"
description = "The ASPCA is the nation’s second-largest animal-welfare grant maker, supporting a wide range of activities that further our mission."
full_description = '<img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate <img src="https://www.aspca.org/sites/default/files/styles/inner_page_banner/public/field/image/section/top-nav_banner-image_v2-.jpg?itok=7uhJa6gs" width="2000" height="430" alt="" /> ASPCA Grants Grants FundingLatest News The ASPCA is one of the nation’s largest animal welfare grant makers, providing support to organizations and programs that further our mission to provide effective means for the prevention of cruelty to animals throughout the United States. We believe that giving grants to other animal welfare organizations is vital to our work and advancing the collective goals of the animal welfare community. Since 2001, we have given more than $200 million in grants to over 3,500 animal shelters, municipal and governmental agencies, rescue groups, universities and other mission-aligned organizations and programs nationwide.Our grants serve a variety of purposes, including:Building and sustaining local and regional capacity across the country to advance animal welfare.Supporting direct response to disasters, cruelty and other emergencies.Researching new approaches and developing and testing pilot programs to improve impact.Implementing and disseminating best practices to ensure that animals everywhere are benefitting from the knowledge that the ASPCA and others have gained from years of research and hands-on experience.Increasing protections for animals and/or decreasing their suffering through legislation, policy initiatives or shifts in practices or perceptions by the public, law enforcement, industry or others.Animal welfare organizations interested in our current grant opportunities can learn more here. <img src="https://www.aspca.org/sites/default/files/styles/inner_page_basic_teaser/public/field/image/blog/blog_helene-grants_100824_thumb_0.jpg?itok=dtgYsqOE" width="335" height="335" alt="moving rescued pets into transports" /> October 8, 2024 ASPCA Announces $3 Million in Hurricane Helene Disaster Response and Relief Grants <img src="https://www.aspca.org/sites/default/files/styles/inner_page_basic_teaser/public/field/image/blog/blog_feff_092624_thumb.jpg?itok=6OuWjiVW" width="335" height="335" alt="cows in a field surrounded by yellow wild flowers" /> September 26, 2024 Announcing: 2024 ASPCA Fund to End Factory Farming Grant Winners <img src="https://www.aspca.org/sites/default/files/styles/inner_page_basic_teaser/public/field/image/blog/blog_farmer-grants_062524_thumb.png?itok=mAAYTekk" width="335" height="335" alt="pigs" /> June 25, 2024 ASPCA Provided 18 Fund-a-Farmer Grants This Year, Building a More Humane Farming System <img src="https://www.aspca.org/sites/default/files/styles/inner_page_basic_teaser/public/field/image/blog/blog_farm-rfp_012324_thumb.jpg?itok=44Q1JiVm" width="335" height="335" alt="cows in a field" /> January 23, 2024 2024 Fund to End Factory Farming Now Accepting Applications! <img src="https://www.aspca.org/sites/default/files/styles/inner_page_basic_teaser/public/field/image/blog/blog_pioneering-change_110923_thumb.jpg?itok=zRETBFq2" width="335" height="335" alt="cows in a pasture at sunrise" /> November 9, 2023 Pioneering Change: Meet the Recipients of the ASPCA 2023 Fund to End Factory Farming Load more Other Ways to Help: Become a Monthly Member Join the Advocacy Brigade Advocate for Animals Volunteer or Foster Related Links for Professionals Grant Opportunities Share this page: <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/facebook.png" alt="Facebook" /> <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/twitter.png" alt="Twitter" /> <img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate'
