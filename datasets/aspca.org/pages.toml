["https://www.aspca.org/about-us/faq"]
title = "FAQ | ASPCA"
description = "Our Most Frequently Asked Questions...and Their Answers!"
full_description = '''<img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate You are hereAbout Us FAQ We are committed to helping you find answers to your questions, so we've compiled the questions that we most frequently receive. Please check this list before contacting our Member Support. General FAQ Donating to the ASPCA About Our Work General FAQ How can I find the ASPCA on social media? Facebook X Instagram LinkedIn YouTube TikTok Where can I purchase ASPCA merchandise? The ASPCA has an online store hosted through Amazon. You can visit the ASPCA's Amazon Store to purchase ASPCA accessories and apparel. How can I change my email address? Please email your old and new email addresses to [email protected]. How do I unsubscribe from ASPCA newsletters and emails? Please click the unsubscribe link at the bottom of any email you have received from the ASPCA. If you have already deleted all ASPCA emails, you can send an unsubscribe request to [email protected]. To stay up to date on the latest news from the ASPCA, please follow us on ASPCA social media: Facebook X Instagram LinkedIn YouTube TikTok I'm a member of the media—where can I find press information? News media professionals, please contact the ASPCA Media & Communications team using our media request form or call (212) 876-7700, ext. 4655. For current media news, please visit our online pressroom. Can I use articles/logos/photos from the ASPCA website for my website/magazine/newspaper? The ASPCA authorizes permission to reprint specific articles, photos, and other educational information on a case-by-case basis. To consider your reprint request, please provide the ASPCA with the following information: The full legal name of the organization requesting permission to reprint. Contact information (organization name, address, phone number, email). The type of organization requesting reprint authorization (e.g., for-profit or not-for-profit). The location and date the requested information appeared on the ASPCA website. How the requested reprint will be used. Information may be provided via email or regular mail to the following addresses: ASPCA Attn.: Legal Department 424 E. 92nd Street New York, NY 10128 [email protected] Please allow at least two weeks for processing after all information has been received by the ASPCA Legal Department. The ASPCA's failure to reply to any reprint request is NOT implied or explicit permission to use such materials. Permission to reprint any ASPCA material is made on a one-time-only basis; additional reprint requests must be approved by the ASPCA. How can I submit a photo to the ASPCA? You may submit your photo to us using this form. Is the ASPCA affiliated with my local SPCA or shelter? The ASPCA is a national organization with programs and operations in states across the U.S. We work closely with animal welfare organizations across the country, providing specialized expertise and resources, including to help find loving homes for animals in need. However, we are not an umbrella organization; we do not directly oversee or operate local shelters or rescues, except in New York where the ASPCA Adoption Center is located.Our work with those independent shelters and other organizations helps to prevent animal suffering nationwide. For example, our Shelter Medicine team regularly consults with and supports animal shelters in local communities across the country by providing guidance and resources related to: infectious diseases, shelter management, population management, general medical health and physical well-being, and more. Our partnerships with and direct grants to shelters and rescues is just one part of the work of ASPCA. We also: assist and partner with local animal welfare and law enforcement agencies nationwide on animal cruelty cases, quickly deploy teams and resources in support of disaster response efforts and to rescue victimized animals, and train thousands of animal welfare professionals around the country on how to rehabilitate animals to give them the best chance of finding a loving home. What we learn through our work, we share with thousands of animal welfare professionals around the country. And we engage the American public to take action on behalf of animals. Where can I find information and resources for shelter professionals? ASPCApro.org provides training, research, and resources for animal welfare professionals. How can I adopt an animal from the ASPCA? Thank you for opening your heart and home to an animal in need! Visit our Adopt section for information on adopting ASPCA dogs and cats in NYC, Los Angeles, Ohio and North Carolina, or to find a horse available for adoption near you. Here are some quick links: ASPCA dogs in NYC ASPCA cats in NYC ASPCA cats in Los Angeles ASPCA dogs in North Carolina ASPCA dogs and cats in Ohio ASPCA My Right Horse I would like to volunteer at the ASPCA. Visit our Volunteer Opportunities page for more information on opportunities across our facilities and program areas. I would like to foster an animal for the ASPCA. Thank you for opening your heart and home to animals who need a little extra TLC. Here are some quick links to find more information on fostering opportunities with the ASPCA: Animal fostering in NYC Dog fostering in North Carolina Animal fostering in Ohio Feline fostering in Los Angeles How is executive salary determined at the ASPCA? Our compensation practices are designed to attract and retain the talent required to support our mission-based programs effectively. The ASPCA partners with an external consultant specializing in non-profit compensation, who determines staff salaries that are in line with those at comparable organizations and in accordance with IRS guidelines for reasonable nonprofit compensation. As documented in our latest available IRS Form 990 (2023) and audited financial statements, approximately 75 cents of every dollar reported as an ASPCA expenditure was used for programmatic services that directly advance the ASPCA’s mission. Compensation, as noted in our Form 990, is only a small fraction of our total administrative costs, and the combined average total compensation over the last three years of our entire executive leadership team and CEO salary at the ASPCA amounted to 1.19% of our total operating expenses—a slim margin in any industry, including the nonprofit space. We’re committed to transparency about leadership compensation, and you can learn more in our Annual Report page and our most recent IRS Form 990 for a comprehensive overview. What is the ASPCA CEO salary? Our compensation practices are designed to attract and retain the talent required to support our mission-based programs effectively. Compensation, as noted in our latest available IRS Form 990 (2023), is only a small fraction of our total administrative costs. The ASPCA partners with an external consultant specializing in non-profit compensation, who determines staff salaries—including the ASPCA CEO salary—that are in line with those at comparable organizations and in accordance with IRS guidelines for reasonable nonprofit compensation. Our executive leadership team's combined average total compensation over the last three years represented 1.19% of our total operating expenses, a slim margin in any industry, including the nonprofit space. We’re committed to transparency about leadership compensation, and you can learn more in our Annual Report page and our most recent IRS Form 990 for a comprehensive overview. How do I report animal cruelty? Procedures for reporting animal cruelty vary state by state and even city by city. Always start with your local police department and animal control. You can also visit our Report Animal Cruelty page for more information. If you live in NYC and want to report suspected animal abuse or neglect, please call 311. For crimes in progress, call 911. Help, I found a hurt or orphaned wild animal! If you have found an injured or orphaned wild animal, please contact the National Wildlife Rehabilitators Association for a list of resources in your area. I found a kitten outside. What should I do? If you’ve found a kitten outside, please use our online tool to determine the best steps to take. How can I help get animal-friendly legislation passed in my state? Help get legislation passed by joining the ASPCA Advocacy Brigade. As a member of our Advocacy Brigade, you will receive regular updates informing you of the introduction and status of various bills pending in your state legislature and Congress and what you can do to help. Active involvement by concerned individuals like you is extremely important to secure the passage of legislation to better protect animals. Does the ASPCA endorse candidates running for elected office? As a 501(c)(3) tax-exempt organization, the ASPCA is prohibited from endorsing candidates or engaging in discussions on issues related to a candidate’s campaign for elected office. This applies to all levels of government, including federal, state and local candidates. I think my pet is sick. Who can help me? The ASPCA does not provide emergency medical advice over phone, email or social media. We urge you to take your pet to a local vet immediately. If you suspect your pet may have been poisoned or has ingested a toxic substance, please call the 24-hour ASPCA Animal Poison Control Center at (888) 426-4435. A consultation fee may apply. I need financial help with my vet bills. While the ASPCA does provide free and low-cost services at our hospital and clinics, we are unfortunately unable to provide financial help with an individual’s veterinary bills. We suggest that you consider asking your animal hospital or private vet if they provide payment plans. Your local shelter or rescue group may also have information about organizations in your area that assist pet owners. I can no longer keep my pet. What can I do? The ASPCA encourages any pet owner who may be considering rehoming their pet to reach out to a shelter or rescue organization in their area, as the staff can often provide advice and assistance. Help—I think my pet has eaten something poisonous! The ASPCA Animal Poison Control Center is your best resource for any animal poison-related emergency, 24 hours a day, 365 days a year. It is the premier animal poison control center in America, assisting hundreds of thousands of animals each year and providing lifesaving information to pet owners and veterinarians. If you think your pet may have ingested a potentially poisonous substance, call (888) 426-4435. A consultation fee may apply. Visit our APCC page for more information. How can I spay/neuter my pet for free or at a low cost? For more information regarding our spay/neuter services, visit our ASPCA Veterinary and Spay/Neuter Services in NYC page. Outside of NYC: Visit our Low-Cost Spay/Neuter Programs page for more information. My pet is lost! If you haven't done so already, we recommend calling your local animal control agencies, animal shelters (both municipal and private), and rescue groups; one of them could have your pet in custody already. We've also gathered resources you can use to know what to do when a pet goes missing. Donating to the ASPCA How can I contact ASPCA Member Support? Member Support can be reached at (800) 628-0028, but please review the FAQs below to see if the information you're looking for has been addressed. Is the ASPCA a 501(c)(3) charity? Yes, the ASPCA is a 501(c)(3) charity, and your donation may be tax-deductible to the extent allowed under applicable law. What is your Employer Identification Number (EIN) or Tax Identification Number (TIN)? 13-1623829 How do I know I'm donating to the ASPCA? Online: All of our secure donation forms on the ASPCA website have a URL that starts with "https://secure.aspca.org." Our emails are sent from email addresses that include @aspca.org or @e.aspca.org. Learn more about the ways to give to the ASPCA. If you suspect an email or website may be fraudulent, please contact the ASPCA directly at [email protected] to verify if we are aware of the situation, have authorized the use of our name, and do, in fact, receive support from them. Phone Calls: The ASPCA periodically uses a paid fundraiser to call on behalf of the ASPCA. This ensures we can maintain the funding necessary to continue our lifesaving programs. Any call placed on behalf of the ASPCA will clearly state that the call is being made on behalf of the ASPCA and will provide the name of the company calling. The caller will also be able to confirm your member ID number. If you suspect a phone call may be fraudulent, please contact Member Support at (800) 628-0028 and provide the name of the company and phone number from which you were called to verify we have authorized them to make calls on our behalf. What portion of donations to the ASPCA goes to animals? All of the ASPCA’s lifesaving work is dedicated to rescuing, protecting, and caring for animals in need. Based on our latest available financial data, approximately 75 cents of every dollar we spend advances the ASPCA's mission through lifesaving programs and services around the country. More information on how donations are put to work can be found here. Where can I access the ASPCA’s annual report and latest financial reports and see what percentage of my donation goes to animals? Approximately 75 cents of every dollar we spend goes directly to the ASPCA’s lifesaving programs around the country. Please visit our Annual Report page to see our latest annual report and our most recently filed IRS Form 990. Can I request that the ASPCA use my donation in a particular way or allocate it to a particular area or fund? Although donations cannot be specified or designated to a particular program or fund, rest assured that the support of our members is greatly appreciated and the ASPCA will use those donations in the area of greatest need. Can I send a money order or check? Of course! Please make your money order or check payable to the ASPCA and send it to: ASPCA Gift Processing Center, P.O. Box 96929, Washington, DC 20090-6929. If you would like to make a donation of $5,000 or above, please refer to our Major Giving page for our mailing address, online major gift donation form and other information. Where can I get a matching gift form? You can obtain a matching gift form from your human resources department and return it to the ASPCA, or you can search for your company and complete a matching gift form online. You can also email [email protected] if you have any other questions about our matching gift program or call Member Support at (800) 628-0028. How do I donate my car to the ASPCA? It's easy! You can donate any car, truck, R.V., or boat—in any condition and from any location—to help us save animals and get a tax deduction at the same time. Visit our v'''
