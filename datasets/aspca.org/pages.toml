["https://aspca.org/adopt-pet/find-shelter"]
title = "Find a Shelter | Adopt or Foster a Pet l Local Shelter l ASPCA"
description = "Whether you’re looking to adopt or foster an animal, volunteer to help homeless pets in your community, or report animal cruelty or a lost or found animal, your best bet is reaching out to your local animal shelter."
full_description = '''<img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate You are hereAdopt a Pet Find Local Shelter Resources If you’re looking to adopt or foster a dog or cat, volunteer to help homeless pets in your community, or report a lost or found animal, your best bet is to identify and contact your local animal shelter.You can locate a municipal or nonprofit shelter or rescue organization near you by using Petfinder's shelter list. If you live in New York City, Los Angeles, or North Carolina, the ASPCA operates specialized programs in these areas that provide second chances to cats and dogs who are often overlooked. AdoptFor a list of ASPCA animals who are available for adoption, select one of the following:Dogs and Cats in NYC »Cats in Los Angeles »Dogs in North Carolina »Horses in Oklahoma »Use our national database below to see animals looking for homes at municipal and nonprofit shelters and rescue organizations across the country.Dogs in Your Local Shelters »Cats in Your Local Shelters »Horses Available for Adoption Locally »You could also consider finding your new furry family member through owner-to-owner adoption. Visit Home To Home, an online community where people looking to adopt a pet can connect with people who need to find their pet a new home. Volunteer or FosterIn NYCHelp animals in NYC by volunteering your time at the ASPCA Adoption Center or Animal Care Centers of New York City (ACC) in one of the city’s five boroughs or consider fostering a pet.Outside NYCTo learn how you can volunteer or help foster animals in your community, use Petfinder’s shelter list to locate and contact an independent shelter or rescue near you.Foster Cats from the ASPCA in Los Angeles »Foster Dogs from the ASPCA Cruelty Recovery Center in Ohio »Foster Dogs from the ASPCA Behavioral Rehabilitation Center »Volunteer at the ASPCA Cruelty Recovery Center in Ohio »Volunteer at the ASPCA Behavioral Rehabilitation Center in North Carolina »Where to Report Found AnimalsIf you’ve found a lost pet or stray animal in your area, contact your local shelter for guidance on the best steps to take. For those located in New York City, you can find more information on how to report a stray animal on NYC311. Residents of Los Angeles can reference the LA Animal Services website. When coming across stray kittens outdoors, be sure to review the ASPCA’s online resource about the best course of action to take to avoid unintentionally orphaning kittens who are being cared for by their mother. *The external links on this page are not an indication of any direct or indirect endorsement or partnership with the listed sites. Other Ways to Help: Become a Monthly Member Advocate for Animals Join the Advocacy Brigade Volunteer or Foster Share this page: <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/facebook.png" alt="Facebook" /> <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/twitter.png" alt="Twitter" /> <img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate'''
