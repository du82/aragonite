["https://aspca.org/about-us"]
title = "About Us | Our Mission | History | Leadership | ASPCA"
description = "The ASPCA was founded in 1866 to provide effective means for the prevention of cruelty to animals throughout the U.S. Learn more about how we help animals."
full_description = "About Us <!--/*--><![CDATA[/* ><!--*/ .embed-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; } .embed-container iframe, .embed-container object, .embed-container embed { position: absolute; top: 0; left: 0; width: 100%; height: 100%; } .mapwrapper_d { display:none; } @media (max-width: 900px) { .mapwrapper_d{ display:block;} } /*--><!]]>*/ We Are Their VoiceThe ASPCA® (American Society for the Prevention of Cruelty to Animals®) has been at the forefront of animal rescue and protection since our founding as the first animal welfare organization in North America in 1866. For more than 150 years, we have been the leading voice in animal welfare, bringing the critical protection of animals to the forefront of society.We’ve led the way in fighting cruelty, rescuing and securing adoptions for animals in need, and driving significant legislative change that protects their lives and welfare — ultimately transforming how Americans value and care for animals.The modern challenges facing animals are wide-ranging and complex, but we tackle these challenges head-on and in innovative ways, including providing vital veterinary care, responding to disasters, pioneering adoption and behavioral rehabilitation programs, conducting critical animal welfare research, training law enforcement and shelter professionals, and advocating for more effective laws. We also partner with and support shelters, veterinarians, and others who share our commitment to a safer, more compassionate world for animals.Rather than directly operating a network of shelters, our role as a well-established national organization—and as envisioned by our founder, Henry Bergh — is to collaborate with and offer training and support to hundreds of local agencies, including shelters, rescues, clinics, and others committed to addressing their communities' needs. This position enables us to advance animal welfare innovations and respond promptly to animal crises throughout the country.Every year, our hands-on work directly impacts hundreds of thousands of animals, with our lasting solutions benefiting millions more. Join us in creating a brighter future for animals. Together, we can make a meaningful difference in their lives.Explore an interactive map showcasing key aspects of our ASPCA programs and collaborations from the past five years dedicated to helping vulnerable animals survive and thrive across the country. You can also read our latest Annual Report for highlights of our 2023 efforts and impact. @media (max-width: 767px) { .page-about-us.landing-level-one .body-text, .page-about-us.landing-level-one .quick-links { clear:both; }}Quick Links Board of Directors Executive Leadership Policies & Positions Annual Report & Form 990 Matt's Blog History of the ASPCA Press Releases ASPCA Action Strategic Cause Partnerships ASPCA Events Careers Diversity, Equity, and Inclusion FAQ .embed-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; } .embed-container iframe, .embed-container object, .embed-container embed { position: absolute; top: 0; left: 0; width: 100%; height: 100%; } .mapwrapper_m{ padding-left: 17%; padding-right: 14%; } @media (max-width: 1134px) { .mapwrapper_m{ padding-left: 8.4745762712%; padding-right: 8.4745762712%;} } @media (max-width: 900px) { .mapwrapper_m{ display:none;} } .embed-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; } .embed-container iframe, .embed-container object, .embed-container embed { position: absolute; top: 0; left: 0; width: 100%; height: 100%; } .page-about-us.landing-level-one .quote { margin-bottom: -20px; } Matthew Bershadker ASPCA President & CEO Read Matt's Blog Helping vulnerable animals and keeping pets in safe and loving homes requires a commitment from all of us—advocates, pet owners, shelters, leaders, and entire communities. When we work together under a common cause, we’re both saving lives and elevating our society and its laws to ensure cruelty victims and other at-risk animals receive the protection and care they deserve. Help the ASPCA Put a Stop to Animal CrueltyDonate"
