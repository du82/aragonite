["https://aspca.org/pet-care/animal-poison-control"]
title = "Animal Poison Control | (888) 426-4435 | ASPCA"
description = "Call the ASPCA Animal Poison Control Center at (888) 426-4435. Did your pet eat chocolate, xylitol, or another potentially poisonous substance?"
full_description = '<img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate You are herePet Care Animal Poison Control Poison ControlLatest News ASPCA Animal Poison Control Center Phone Number: (888) 426-4435 The ASPCA Animal Poison Control Center (APCC) is your best resource for any animal poison-related emergency, 24 hours a day, 365 days a year. If you think your pet may have ingested a potentially poisonous substance, call (888) 426-4435. A consultation fee may apply. Are you a veterinarian or animal healthcare professional? See the APCC’s Clinic Resources page for more information. Our Poison Control experts have also provided valuable information below to help parents recognize and protect their pets from poisonous substances including plants, human foods, human medications and more. Poisonous Plants A guide containing images and information about toxic and non-toxic plants. Read more People Foods to Avoid Feeding Your Pet Read our handy list of the top toxic people foods to avoid feeding your pet. Read more Poisonous Household Products Poison Control experts set the record straight on the safety risks of a variety of household substances. Read more For additional animal poison control information, listen to podcasts from APCC experts below. To hear more, please visit our full APCC podcast feed. <img src="https://www.aspca.org/sites/default/files/styles/inner_page_basic_teaser/public/field/image/blog/20240307_apcc_leptospirosis_thumb.jpg?itok=5wU5p4c_" width="335" height="335" alt="" /> March 3, 2025 Is Your Pet in Danger of Contracting Leptospirosis? <img src="https://www.aspca.org/sites/default/files/styles/inner_page_basic_teaser/public/field/image/blog/20240111_apcc_fact_vs_myth_edit_thumb.jpg?itok=2RxxeZP_" width="335" height="335" alt="" /> February 27, 2025 Fake Mews? Find Out Which of These Pet Toxin Beliefs Is Myth and Which Is Fact <img src="https://www.aspca.org/sites/default/files/styles/inner_page_basic_teaser/public/field/image/blog/appc_biscuit-day_022025_thumb.jpg?itok=7IO2a1mW" width="335" height="335" alt="Man in a gray ASPCA shirt feeding a dog biscuits from his palm" /> February 20, 2025 Celebrate National Biscuit Day with These Delicious Pet Treats! <img src="https://www.aspca.org/sites/default/files/styles/inner_page_basic_teaser/public/field/image/blog/20240207_apcc_valentines_day_thumb.jpg?itok=3aqP74I3" width="335" height="335" alt="" /> February 12, 2025 3 Expert Tips for a Pet-Safe Valentine’s Day <img src="https://www.aspca.org/sites/default/files/styles/inner_page_basic_teaser/public/field/image/blog/20240208_apcc_superbowl_safety_thumb.jpg?itok=VFi72f38" width="335" height="335" alt="" /> February 6, 2025 Game Day Do’s and Don’ts to Keep Your Pets Safe! Load more Add Us As a Contact! Other Ways to Help: Become a Monthly Member Advocate for Animals Join the Advocacy Brigade Volunteer or Foster Share this page: <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/facebook.png" alt="Facebook" /> <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/twitter.png" alt="Twitter" /> <img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate'
