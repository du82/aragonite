["https://aspca.org/about-us/press-releases/celebrate-national-horse-protection-day-lawmakers-reintroduce-bipartisan"]
title = "To Celebrate National Horse Protection Day, Lawmakers Reintroduce Bipartisan Legislation to End Horse Slaughter | ASPCA"
full_description = 'Other Ways to Help: Become a Monthly Member Advocate for Animals Join the Advocacy Brigade Volunteer or Foster You are hereAbout Us Press Releases To Celebrate National Horse Protection Day, Lawmakers Reintroduce Bipartisan Legislation to End Horse Slaughter Endorsed by leading animal welfare and industry groups, the Save America’s Forgotten Equines (SAFE) Act would expand the Dog and Cat Meat Prohibition Act to include equines, permanently protecting American horses from slaughter. February 27, 2025 WASHINGTON, DC (February 27, 2025) – In honor of National Horse Protection Day on March 1, a bipartisan group of federal lawmakers today reintroduced the Save America’s Forgotten Equines (SAFE) Act to permanently protect American horses from commercial slaughter. Sponsored by Sens. Lindsey Graham (R-S.C.) and Ben Ray Luján (D-N.M.), and Reps. Vern Buchanan (R-Fla.) and Jan Schakowsky (D-Ill.), joined by 100 original cosponsors in the House, the SAFE Act would expand the Dog and Cat Meat Prohibition Act – which passed as part of the 2018 Farm Bill – to include equines, prohibiting the commercial slaughter of horses in the U.S. and ending their export for that purpose abroad.According to recent surveys, the American public overwhelmingly (83 percent) opposes horse slaughter – and for good reason. The entire process is inherently cruel, subjecting animals to long and dangerous transportation and brutal treatment at slaughterhouses, culminating in ineffective stunning methods that can leave horses conscious during dismemberment. This industry preys on healthy horses who could potentially find new homes and also makes rescuing horses more difficult.The SAFE Act received strong bipartisan support last Congress, with more than half of the U.S. House of Representatives signing on as cosponsors, and is supported by leading animal welfare groups, including the ASPCA® (The American Society for the Prevention of Cruelty to Animals®), the Animal Welfare Institute (AWI), Humane World for Animals, Humane World Action Fund, and Return to Freedom Wild Horse Conservation.This legislation is also endorsed by equine industry groups, including The Jockey Club, the U.S. Trotting Association, the U.S. Harness Racing Alumni Association, the Stronach Group, the Breeders’ Cup, the Thoroughbred Owners and Breeders Association, the Jockeys’ Guild, the New York Racing Association, Del Mar Thoroughbred Club, and the Maryland Horse Council. These groups partnered with animal welfare organizations to form the “Final Stretch Alliance to End Horse Slaughter,” a collaborative effort urging federal lawmakers to pass a permanent ban on slaughter.Last year, approximately 19,000 horses were exported to Canada and Mexico for slaughter–the lowest number in at least 45 years. Even one horse being shipped to slaughter is one too many, however, and now is an opportune time to pass a ban.“The slaughter of horses for human consumption is barbaric and has no place in America,” said Congressman Buchanan. “As Co-Chairman of the Animal Protection Caucus, I look forward to continuing to lead this effort with Congresswoman Schakowsky to protect these beautiful creatures.”“As a former horse owner, I have been a leader in efforts to ban horse slaughter in the United States for many years,” said Congresswoman Jan Schakowsky. “I am once again partnering with Congressman Vern Buchanan in introducing the SAFE Act to amend the Agriculture Improvement Act of 2018 to prohibit the slaughter of equines for human consumption, both domestically and abroad. It is beyond time to end this brutal and dangerous practice. Horses are not food. As a proud animal lover, we owe it to our horse companions to protect their welfare.”“I’m proud to join my colleagues to introduce bipartisan legislation to permanently ban the slaughter of horses for human consumption. Unlike cattle, horses aren’t raised as food animals in the United States,” said Senator Luján. “I look forward to working with my colleagues to pass this bill to protect our nation’s horses while maintaining support for meat and poultry markets.”“Despite overwhelming public opposition to horse slaughter, a legal loophole still allows tens of thousands of American horses to be shipped to other countries for slaughter each year. Not only is horse slaughter cruel and unnecessary, but the existence of the slaughter pipeline itself stifles rescue and rehoming efforts, putting equine welfare at risk,” said Nancy Perry, senior vice president of Government Relations for the ASPCA. “Equine industry and animal welfare groups are working daily to solve equine welfare issues on the ground, but we cannot fully succeed while the slaughter pipeline remains open. We are so grateful to Senators Graham and Luján and Representatives Buchanan and Schakowsky for their dedication to starting a new chapter for America’s equines and championing the SAFE Act to secure an end to horse slaughter.”“Although the overall decline in American horses being exported for human consumption is a sign of progress, more than 19,000 horses are still being trucked across the border each year as part of the predatory horse slaughter pipeline. This industry needs to be shut down once and for all, said Susan Millward, executive director and chief executive officer at the Animal Welfare Institute. “We are immensely grateful to Congressman Buchanan, Congresswoman Schakowsky, Senator Graham, and Senator Luján for their outstanding leadership on the SAFE Act and we hope that Congress will move quickly to protect America’s horses from slaughter.”“The pipeline to slaughter is a death sentence for horses, with the worst sort of suffering before they are killed. These majestic animals, who have helped build this nation, are deserving of compassion and kindness, not cruelty,” said Sara Amundson, president of Humane World Action Fund. "Horse slaughter for human consumption is an industry that shows an utter disregard for these loyal and noble animals. We call on lawmakers to support Senators Graham and Luján and Representatives Buchanan and Schakowsky in their efforts to pass the Save America’s Forgotten Equines (SAFE) Act and put an end to this inhumane practice for all time.”“This bipartisan legislation would at last put an end to the thousands of unnecessary, inhumane deaths suffered each year by American horses, both domestic and wild, while saving the government time and money that are currently being wasted on a shrinking, foreign-driven industry,” said Neda DeMayo, president of Return to Freedom Wild Horse Conservation. “We commend Representatives Buchanan and Schakowsky and Senators Graham and Luján for their unwavering dedication to ending the slaughter of all horses through passage of the SAFE Act.”America’s equine adoption community is working swiftly to match the horses in their care with foster and adoptive families, increasing the number of adoptions every year, and research shows that 2.3 million Americans have both the interest and resources to adopt a horse. This means that there are options available for the tens of thousands of horses who were exported to slaughter last year. Many could have a home waiting, if given the opportunity to find it, or compassionate end-of-life care provided by a veterinarian close to home. As long as the financial incentive for slaughter exists, however, it will continue to hamper the lifesaving efforts of rescue and welfare groups to provide humane care to equines. The horse slaughter industry not only exploits horses who must endure grueling journeys and inhumane deaths, but also harms the broader equine community, including horse owners, riders, and rescues. Kill buyers – those who buy horses to ship to slaughter in Canada and Mexico – attend auctions and often outbid individuals who could provide those horses loving homes, which also forces rescue groups to divert limited resources from other lifesaving work to compete with this industry. Kill buyers have also been known to pose as good homes in response to ads from horse owners who can no longer care for their animals. Many owners are so afraid their horses could end up at slaughter that they may even keep them beyond the point that they can afford basic care, causing further suffering.Members of the public are encouraged to contact their U.S. senators and representatives to urge them to cosponsor the SAFE Act and secure its swift passage to protect horses, their caregivers, and consumers. ###About the ASPCA®Founded in 1866, the ASPCA® (The American Society for the Prevention of Cruelty to Animals®) was the first animal welfare organization to be established in North America and today serves as the nation’s leading voice for vulnerable and victimized animals. As a 501(c)(3) not-for-profit corporation with more than two million supporters nationwide, the ASPCA is committed to preventing cruelty to dogs, cats, equines, and farm animals throughout the United States. The ASPCA assists animals in need through on-the-ground disaster and cruelty interventions, behavioral rehabilitation, animal placement, legal and legislative advocacy, and the advancement of the sheltering and veterinary community through research, training, and resources. For more information, visit aspca.org, and follow the ASPCA on Facebook, X, Instagram, and TikTok. Other Ways to Help: Become a Monthly Member Advocate for Animals Join the Advocacy Brigade Volunteer or Foster Share this page: <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/facebook.png" alt="Facebook" /> <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/twitter.png" alt="Twitter" />'
