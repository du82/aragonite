["https://www.aspca.org/news/2023-subaru-share-lover-event-raises-over-24-million-vulnerable-animals"]
title = "The 2023 Subaru Share the Love® Event Raises Over $2.4 Million for Vulnerable Animals | ASPCA"
description = "In 2023, for the sixteenth consecutive year, the ASPCA was one of four national charities to participate in the Subaru Share the Love® Event. Read on to learn more about how this event raised money for vulnerable animals!"
full_description = '<img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate <img height="500" width="1040" class="media-element file-default" data-delta="1" src="https://www.aspca.org/sites/default/files/20240532_subaru_stl_announcement_main.jpg" alt="" title="" /> You are hereNews The 2023 Subaru Share the Love® Event Raises Over $2.4 Million for Vulnerable Animals May 21, 2024 <img height="500" width="1040" class="media-element file-default" data-delta="1" src="https://www.aspca.org/sites/default/files/20240532_subaru_stl_announcement_main.jpg" alt="" title="" /> In 2023, for the sixteenth consecutive year, the ASPCA was one of four national charities to participate in the Subaru Share the Love® Event, which took place between November 16, 2023, and January 2, 2024. During this time, Subaru of America, Inc. and its retailers donated a minimum of $300 to charity for every new Subaru vehicle purchased or leased at participating Subaru retailers nationwide. As a result, Subaru helped raise awareness for animals in need and $2,423,515 for our nation’s most vulnerable animals.Last year, we partnered with Subaru to distribute over $765,000 of grant funding to 189 animal welfare organizations throughout the U.S. This funding supported a variety of pet events in collaboration with local Subaru retailers. In addition to adoptions, many of these events provided critical services for animals in need, including microchipping, vaccinations, spay/neuter surgeries and more. The 2023 program positively impacted a reported total of more than 13,375 animals.Since the inception of our partnership with Subaru in 2008, the ASPCA has received over $38 million in critical, life-saving funds, which has helped impact the rescue, transport, well-being and adoption of more than 134,000 animals across the United States.“The Subaru Share the Love Event continues to illuminate what is possible when dedicated, compassionate communities, individuals, animal shelters and Subaru retailers across America work together to help vulnerable animals receive essential services and find safe and loving homes,” said Matt Bershadker, ASPCA President and CEO. “Over the course of 16 years, we’ve been able to provide care and adoption opportunities for over 134,000 animals – a truly phenomenal outcome we enthusiastically share and celebrate with all involved.”We sincerely thank Subaru of America for another successful year. We also would like to thank everyone who supported the ASPCA through not only the 2023 Subaru Share the Love Event, but every event since this collaboration began in 2008.To learn more about the Subaru Share the Love Event, please visit www.subaru.com/share. Other Ways to Help: Become a Monthly Member Take the Cruelty Pledge Join the Advocacy Brigade Advocate for Animals Volunteer or Foster Related News A Helper Cat Boosts a Fearful Feline’s Confidence These Adoptable Pups Are Ready for the Red Carpet — The 2025 Paw-scars Winners Are Here! Siblings Adopting Siblings: How Shayan and Ilma Found Charlie and Mark Share this page: <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/facebook.png" alt="Facebook" /> <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/twitter.png" alt="Twitter" /> <img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate'
