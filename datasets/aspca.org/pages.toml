["https://aspca.org/about-us/press-releases/aspca-statement-confirmation-brooke-rollins-secretary-agriculture"]
title = "ASPCA Statement on Confirmation of Brooke Rollins as Secretary of Agriculture | ASPCA"
full_description = 'Other Ways to Help: Become a Monthly Member Advocate for Animals Join the Advocacy Brigade Volunteer or Foster You are hereAbout Us Press Releases ASPCA Statement on Confirmation of Brooke Rollins as Secretary of Agriculture February 13, 2025 WASHINGTON, DC – The ASPCA® (The American Society for the Prevention of Cruelty to Animals®) released the below statement following the U.S. Senate’s confirmation of Brooke Rollins as the next Secretary of Agriculture, where she will oversee the U.S. Department of Agriculture (USDA):“Americans care deeply about animal welfare, and no federal agency impacts the lives of animals more than the USDA. We hope to find opportunities to work closely with Secretary Rollins on the wide range of issues concerning companion and farm animals, including enhancing enforcement of the various laws protecting vulnerable dogs in puppy mills and the more than 10 billion animals raised for food in the United States every year,” said Nancy Perry, senior vice president of Government Relations for the ASPCA. “We urge Secretary Rollins to strengthen the agency’s Animal Welfare Act enforcement and meet with farmers who support a national transition to more humane farming practices.” “During her confirmation hearing, Secretary Rollins suggested she might be willing to support a federal effort to gut popular animal welfare and consumer protections, which would override the will of millions of voters and undermine state authority,” added Perry. “We are grateful that Secretary Rollins expressed her openness to hearing farmers’ perspectives, and we look forward to connecting her with the many farmers and ranchers across this country who oppose legislation like the EATS Act because it would directly harm them by undercutting the investments they have made in more humane practices.” For more information about the ASPCA’s work to enhance protections for animals, please visit www.aspca.org. ###About the ASPCA®Founded in 1866, the ASPCA® (The American Society for the Prevention of Cruelty to Animals®) was the first animal welfare organization to be established in North America and today serves as the nation’s leading voice for vulnerable and victimized animals. As a 501(c)(3) not-for-profit corporation with more than two million supporters nationwide, the ASPCA is committed to preventing cruelty to dogs, cats, equines, and farm animals throughout the United States. The ASPCA assists animals in need through on-the-ground disaster and cruelty interventions, behavioral rehabilitation, animal placement, legal and legislative advocacy, and the advancement of the sheltering and veterinary community through research, training, and resources. For more information, visit aspca.org, and follow the ASPCA on Facebook, X, Instagram, and TikTok. Other Ways to Help: Become a Monthly Member Advocate for Animals Join the Advocacy Brigade Volunteer or Foster Share this page: <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/facebook.png" alt="Facebook" /> <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/twitter.png" alt="Twitter" />'
