["https://www.aspca.org/news/celebrate-last-years-big-wins"]
title = "Celebrate Last Year’s Big Wins! | ASPCA"
description = "As confetti settles and we dive into new year, let’s pause to reflect on 2024’s progress and the most impactful policy victories made possible by animal advocates like you."
full_description = '''<img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate <img alt="A german shepherd with their head tilted next to a woman" height="500" width="1040" class="media-element file-default" data-delta="1" src="https://www.aspca.org/sites/default/files/1040x500-pettitte_a0049924744_2023jan17_0040.jpg" title="" /> You are hereNews Celebrate Last Year’s Big Wins! January 10, 2025 <img alt="A german shepherd with their head tilted next to a woman" height="500" width="1040" class="media-element file-default" data-delta="1" src="https://www.aspca.org/sites/default/files/1040x500-pettitte_a0049924744_2023jan17_0040.jpg" title="" /> As we dive into the new year, let’s pause to reflect on some of 2024’s progress and the most impactful policy victories made possible by animal advocates like you. You showed up for us and the animals by contacting your lawmakers, attending committee hearings, volunteering and taking action for animals, and it all made a difference.Expanding Access to Veterinary CareWe collaborated with Florida animal advocates to win lawmakers’ support for the Providing Equity in Telehealth Services (PETS) Act, which gives people with pets better access to telehealth technology for veterinary care. While our team was on the ground meeting government officials, animal advocates used their voices to encourage lawmakers to pass this groundbreaking bill. The PETS Act finally crossed the finish line in June when Governor DeSantis signed it into law, and it went into effect on July 1.Thanks to this new law, Florida pet owners are able connect with veterinarians from their smartphones or computers, reducing the requirement for in-person visits in certain circumstances and enabling more animals to receive care. This victory is long overdue because in-person veterinary visits can be a major barrier for pet owners and a source of unnecessary stress for pets.Learn more about the importance and many benefits of veterinary telehealth and how the ASPCA is working to ensure that people, pets and vets in all 50 states can access it.Months after Florida’s win, voters passed Proposition 129 to expand access to veterinary care in Colorado. Prop 129, spearheaded by the Dumb Friends League in Denver with support from a coalition of animal shelters and advocates, establishes a career pathway for a Veterinary Professional Associate, or Veterinary PA, akin to a physician assistant in human medicine. These professionals will hold a master’s degree, be licensed and regulated by the state Veterinary Medical Board and work under the supervision of a licensed veterinarian. By empowering veterinarians to utilize veterinary PAs to provide quality, routine medical care, more families will be able to access care for their animals.A signature-gathering effort led by Dumb Friends League earned Prop 129 a spot on Colorado’s 2024 ballot, and voters enacted the measure by a decisive 53-47% vote. Thank you to the hundreds of volunteers who supported Prop 129 to give more animals a chance to live longer, healthier, happier lives.Protecting People and Pets from Hazardous WeatherNatural disasters and extreme weather events are on the rise, and hurricanes, wildfires, floods and other crises all pose a threat to people and their pets. Unfortunately, most states still lack pet-friendly emergency shelters or co-shelters — where people can safely stay with their pets — and people who are denied shelter with their pets may refuse evacuation or be forced to leave their pets behind.Colorado passed a law requiring localities to include pets in all levels of disaster-response planning. It also requires officials to create at least one dedicated pet-friendly sheltering site per locality to give people a safe and comfortable place to go with their pets. This new law went into effect in April and offers tangible hope that families can stay together during emergencies.Similarly, Washington established a grant program to improve the state’s ability to support people during periods of extremely hot or cold weather or when wildfire smoke reduces air quality. These grants can be used to retrofit warming and cooling centers to be pet-friendly and reimburse the costs associated with transporting people with pets.California voters approved Proposition 4 in another Election Day victory for animals. It authorized $10 billion in bonds for climate-related projects, including wildfire prevention. We successfully secured language in Prop 4 that qualifies projects involving retrofitting or developing pet-friendly resiliency centers to be eligible for payment from a dedicated $60 million fund. Pet-friendly resilience centers are critical because they enable families to evacuate with their pets when disaster strikes.Preventing Puppy Mill CrueltyNew York’s Puppy Mill Pipeline Act went into effect on December 15, 2024, finally prohibiting the retail sale of dogs, cats and rabbits in New York State. Dogs sold in pet stores come from commercial breeding operations — commonly known as “puppy mills” — that are designed to prioritize profit over the well-being of animals. By ending the sale of cruelly bred puppy mill dogs in state pet shops, New York is shutting down the pipeline that enables retail sellers and commercial breeders to profit from cruelty.Goldie’s Act would protect vulnerable animals who are held in federally licensed commercial facilities, including a quarter of a million dogs, and it continued to earn support from lawmakers in both parties. In 2024, Goldie’s Act was introduced for the first time in the U.S. Senate by Senators Blumenthal (D-CT) and Scott (R-FL). It was also endorsed by the Problem Solvers Caucus — a bipartisan group of 62 members of Congress — and secured more than 100 cosponsors in the U.S. House of Representatives.We are eager to support the reintroduction and passage of Goldie’s Act in the new session of Congress. Become a member of our Puppy Mill Action Team to get the latest news and receive alerts when Goldie’s Act and other important bills need your voice this year.Building a Better World for Farm AnimalsThe Industrial Agriculture Conversion Act (IACA) was introduced for the first time by Representatives Adams (D-NC) and McGovern (D-MA) and Senator Booker (D-NJ). This bill would create a grant program dedicated to assisting farmers currently in the factory farm system who want to transition from factory farming to either more humane pasture-based animal farming or growing crops. By investing in these transitions, the IACA would be a promising step toward ending factory farming.Another piece of federal legislation that dominated much of 2024 was the Farm Bill. Though Congress extended the current Farm Bill into 2025, we saw progress for farm animals throughout the process. For example, the dangerous EATS Act and any related language has been kept out of the Farm Bill extension, protecting millions of animals and safeguarding state animal welfare laws across the country. Additionally, the Senate Farm Bill draft included two historic provisions calling for funding to support transitions away from factory farming and mandatory reporting on cruel depopulation. Both provisions result from years of advocacy and outreach about the harm of factory farming and the need for solutions.Work with us to create a more humane farming system in the new session of Congress. Join our Factory Farming Task Force to get the latest news and receive alerts when farm animals need your voice.Safeguarding Equines from Suffering and SlaughterHorse slaughterhouses were prevented from operating within the United States for another fiscal year. However, tens of thousands of American equines are still trucked across our borders each year to be slaughtered in Canada and Mexico. To fully protect America’s horses, Congress must permanently ban the slaughter of horses for human consumption in the U.S. and their export abroad for that same purpose.In 2024, wild horses and burros retained important protections. Congress ensured that they cannot be killed or sold to slaughter as part of the government’s strategy for managing wild herds. Additionally, Congress provided the Bureau of Land Management with funding to humanely manage wild horses and burros, including a directive to implement a robust and humane fertility control strategy.The program’s continued funding is a big win, but last year its funding was reduced by nearly $6 million. For the agency to sustainably ensure healthy herds and land, continued investment in the Wild Horse and Burro Program is necessary. The ASPCA will continue fighting for increased support of the Program.Your New Year's ResolutionA new, two-year session of Congress began this month, and there are new people in office who need to hear from you about these issues. Make advocating for animals one of your New Year’s resolutions. Join the ASPCA Advocacy Brigade to receive breaking news and urgent alerts when animal-protection legislation needs your voice. Other Ways to Help: Become a Monthly Member Take the Cruelty Pledge Join the Advocacy Brigade Advocate for Animals Volunteer or Foster Related News A Helper Cat Boosts a Fearful Feline’s Confidence These Adoptable Pups Are Ready for the Red Carpet — The 2025 Paw-scars Winners Are Here! Honor and Defend Horses on National Horse Protection Day Share this page: <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/facebook.png" alt="Facebook" /> <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/twitter.png" alt="Twitter" /> <img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate'''
