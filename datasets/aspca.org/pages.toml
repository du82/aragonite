description = "Right now, animals’ lives are at risk. Learn how the ASPCA takes on animal cruelty cases and large-scale rescue operations, and how to report animal cruelty."
full_description = '<img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate <img src="https://www.aspca.org/sites/default/files/styles/inner_page_banner/public/field/image/section/top-nav_banner-image_investigations-and-rescue_a_0_0.jpg?itok=FZzfZGTk" width="2000" height="430" alt="Man rescuing cat from flooded house" /> Investigations and Rescue No matter the location or scale of deployment, the ASPCA is prepared to take on animal cruelty cases when needed—from assisting initial investigations to securing final placement of rescued animals in homes.Recognizing and Reporting Animal Cruelty and NeglectLearn how to recognize and report animal cruelty in your area.Read moreRescue Work and Field Deployments See how the ASPCA executes large-scale animal rescue operations to help victims of animal cruelty, neglect and natural disasters.Read moreASPCA Disaster Relief EffortsHow we help animals nationwide when disaster strikes through rescue, relocation and sheltering.Read moreForensic InvestigationsThe ASPCA collects and processes forensic evidence to help build cases against animal abusers.Read moreLegal Advocacy and InvestigationsWe assist with animal cruelty investigations to provide a voice for animals in court.Read moreDogfighting Although a felony in 50 states, the ASPCA continues to take on dogfighting cases, in which dogs are forced to fight for the entertainment and/or profit of spectators.Read moreCost of Care Legislation Learn how Cost of Animal Care laws provide relief to animal shelters, law enforcement and taxpayers.Read moreNYC Cruelty ResponseWe work with local law enforcement to support animal cruelty cases in NYC, and provide animal cruelty victims with critical care.Read more Other Ways to Help: Become a Monthly Member Take the Cruelty Pledge Join the Advocacy Brigade Advocate for Animals Volunteer or Foster Share this page: <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/facebook.png" alt="Facebook" /> <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/twitter.png" alt="Twitter" /> <img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate'
