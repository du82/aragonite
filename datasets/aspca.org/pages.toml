["https://www.aspca.org/news/though-short-vision-and-small-stature-iris-large-love"]
title = "Though Short on Vision and Small in Stature, Iris Is Large on Love | ASPCA"
description = "Vanesa, a registered veterinary technician at the ASPCA, took immediate notice when a community cat gave birth to four kittens in her backyard – especially when one of the kittens appeared to be in very poor condition. Find out how Vanesa helped the tiny kitten and where she is today!"
