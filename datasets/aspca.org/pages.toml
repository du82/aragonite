["https://aspca.org/about-us/press-releases/aspca-continues-supporting-wildfire-animal-relief-efforts-southern"]
title = "ASPCA Continues Supporting Wildfire Animal Relief Efforts in Southern California Alongside Local Shelters, National Partners, and Government Agencies | ASPCA"
full_description = '''Other Ways to Help: Become a Monthly Member Advocate for Animals Join the Advocacy Brigade Volunteer or Foster You are hereAbout Us Press Releases ASPCA Continues Supporting Wildfire Animal Relief Efforts in Southern California Alongside Local Shelters, National Partners, and Government Agencies The ASPCA has assisted more than 900 animals through on-the-ground disaster relief efforts including animal search-and-rescue, daily shelter support and care of displaced pets, disaster management guidance, supply distribution, and more January 31, 2025 LOS ANGELES – Since January 9, the ASPCA® (American Society for the Prevention of Cruelty to Animals®) disaster response team has been on the ground in Southern California at the request of Pasadena Humane, Los Angeles County, and Los Angeles City officials assisting more than 900 animals in the aftermath of the devastating Eaton and Palisades Fires.The ASPCA, alongside local and national partners including the International Fund for Animal Welfare (IFAW), American Humane Society (AHS), San Diego Humane Society, the San Diego Department of Animal Services, and the North Valley Animal Disaster Group, has assisted with immediate animal needs through search and rescue, feeding-in-place operations and sheltering support. To date, the ASPCA’s disaster response team has responded to more than 520 service calls from community members requiring assistance with lost and found pets, emergency veterinary care, pet supply needs and more."Providing vulnerable animals, pet owners, and shelters with lifesaving assistance in the aftermath of the devastating wildfires in Los Angeles has been a collaborative effort, and the ASPCA is dedicated to working with our local and national partners to continue providing critical rescue, care, and shelter support for as many animals as we can,” said Matt Bershadker, ASPCA President and CEO. “The ASPCA immediately mobilized to assist ongoing relief efforts, and we are immensely grateful to work alongside the many disaster response partners who have stepped up to ensure the safety of displaced animals and help impacted families care for their beloved pets.”Ongoing Response Efforts Highly trained ASPCA disaster response personnel have been assisting Pasadena Humane with daily shelter support and field operations including animal search and rescue in collaboration with Los Angeles County Animal Care & Control. The ASPCA has also been supporting animal reunification efforts, providing disaster management guidance, and assisting with pet supply distribution and other critical aid. These efforts have supported needs stemming from the Eaton Fire, which decimated areas of Pasadena, Altadena and surrounding communities after setting ablaze the evening of Jan. 7.At the request of Los Angeles Animal Services (LAAS), the ASPCA has also facilitated animal search and rescue in areas devastated by the Palisades Fire in the Pacific Palisades neighborhood of the city. National Animal Rescue & Sheltering Coalition (NARSC) partners IFAW and American Humane Rescue, a program of AHS, are on the ground at the request of the ASPCA, supporting this vital work and assisting with planning and coordination, animal search and rescue, feed-in-place operations as well as pet reunifications in the field and at local shelters.Through collaboration with LAAS and the office of Los Angeles Mayor Karen Bass, the ASPCA has helped enhance field rescue operations in impacted communities to maximize the number of animals rescued and reunited with their owners. In addition, the ASPCA’s Los Angeles-based Community Medicine team has provided LAAS with veterinary support to help local shelters prepare animals for adoption, foster, and relocation by assisting with vaccinations, health certifications, and spay/neuter.Reuniting Pets with OwnersHeartwarming pet reunifications include the story of three courageous cats who were rescued from their homes after the wildfires tore through their neighborhoods. ASPCA responders found black cats Shadow and Bandit in their home after their owner had to evacuate at a moment’s notice without them. A 14-year-old cat, Bella, was also happily reunited with her owner after ASPCA disaster responders retrieved her from a humane trap her owner had set up when evacuating her property.Additionally, the ASPCA assisted LAAS with the unique rescue of a 29-fish koi pond, which miraculously survived the fires. LAAS conducted an animal welfare call for the group of koi fish living in the backyard pond of two Pacific Palisades residents. The koi are all that remain after the fire destroyed the owners’ home.ASPCA Celebrity Ambassadors Visit Pasadena HumaneASPCA Ambassadors Nathan Lane, Eric McCormack, Dr. Evan Antin, Juan Pablo Espinosa, Maxwell Jenkins, Alexandra Shipp, and Bobby Newberry recently volunteered at Pasadena Humane to help care for shelter animals and pets displaced by the wildfires (photos and quotes). The ambassadors assisted Pasadena Humane staff and ASPCA disaster response teams with animal socialization and enrichment, meeting pets separated from their owners—including dogs, cats, a tortoise, and a bearded dragon and posting them on social media in the hopes of reuniting them with their owners.California Wildfire Disaster Relief FundRecognizing the need for immediate funding to address critical wildfire-related needs, as well as to better safeguard against future disasters, the ASPCA launched a $5 million California Wildfire Response & Preparedness Fund to provide critical funding to animal welfare organizations responding to animal needs due to the wildfires. Funding is also available to prepare for and build capacity to defend against future fires and other disasters. For more information about the eligibility requirements and to apply, please visit ASPCApro.org/wildfiregrants.For more information on the ASPCA's ongoing efforts to help animals impacted by the Los Angeles wildfires, please visit aspca.org/lawildfireresponse. ###About the ASPCA®Founded in 1866, the ASPCA® (The American Society for the Prevention of Cruelty to Animals®) was the first animal welfare organization to be established in North America and today serves as the nation’s leading voice for vulnerable and victimized animals. As a 501(c)(3) not-for-profit corporation with more than two million supporters nationwide, the ASPCA is committed to preventing cruelty to dogs, cats, equines, and farm animals throughout the United States. The ASPCA assists animals in need through on-the-ground disaster and cruelty interventions, behavioral rehabilitation, animal placement, legal and legislative advocacy, and the advancement of the sheltering and veterinary community through research, training, and resources. For more information, visit aspca.org, and follow the ASPCA on Facebook, X, Instagram, and TikTok. Other Ways to Help: Become a Monthly Member Advocate for Animals Join the Advocacy Brigade Volunteer or Foster Share this page: <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/facebook.png" alt="Facebook" /> <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/twitter.png" alt="Twitter" />'''
