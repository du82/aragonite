["https://aspca.org/about-us/press-releases/annual-aspca-report-puppy-mill-cruelty-reveals-usda-failed-protect"]
title = "Annual ASPCA Report on Puppy Mill Cruelty Reveals the USDA Failed to Protect Vulnerable Dogs | ASPCA"
full_description = '''Other Ways to Help: Become a Monthly Member Advocate for Animals Join the Advocacy Brigade Volunteer or Foster You are hereAbout Us Press Releases Annual ASPCA Report on Puppy Mill Cruelty Reveals the USDA Failed to Protect Vulnerable Dogs In 2024, more than 800 animal welfare violations were documented at USDA licensed commercial dog breeding facilities but not a single dog was removed February 12, 2025 WASHINGTON, DC – Today, the ASPCA® (The American Society for the Prevention of Cruelty to Animals®) released its annual report on puppy mill cruelty, which provides an analysis of U.S. Department of Agriculture (USDA) data on inspections, documented violations, and enforcement actions against Animal Welfare Act licensed facilities. Based on the ASPCA’s analysis of USDA data, federal inspectors documented over 800 instances where licensed dog dealers failed to meet the minimum standards of care in 2024, with violations that included failure to provide dogs with shelter, clean food and water or veterinary care. Forty-five percent of commercial dog dealers licensed in 2024 never had a compliance inspection, and of the ones that did receive inspections, one out of every five inspection uncovered failures.“The USDA saw over 200,000 dogs in licensed commercial facilities in 2024, many of whom were suffering as a result of a dealer’s failure or unwillingness to provide appropriate care. Despite having the authority to issue penalties and warnings, revoke licenses and remove animals, the agency's overwhelming response was to do nothing,” said Robert Hensley, Senior Counsel, ASPCA Legal Advocacy and Investigations. “No federal agency impacts animals more than the USDA, and with Brooke Rollins expected to be confirmed as the new Secretary of Agriculture soon, we hope she will take this opportunity to strengthen the agency’s Animal Welfare Act enforcement to ensure animals in federally licensed facilities get the protections they deserve.”There are a quarter of a million dogs in USDA licensed commercial breeding facilities, and countless examples of facilities where dogs were suffering, yet in the vast majority of cases, the USDA took no action at all. Examples of the USDA’s failure to act in 2024, include:Dogs without shelter, clean food and water, or veterinary careDogs who could not walk, dogs living in waste, dogs with painful wounds, and dogs suffering contagious and deadly diseasesDogs who died in barn fires, in fights with other dogs, from the cold, or with no explanation at allTo address the USDA’s ongoing failures, a bipartisan team of federal lawmakers led by U.S. Reps. Nicole Malliotakis (R-N.Y.), Raja Krishnamoorthi (D-Ill.), Mike Quigley (D-Ill.), Brian Fitzpatrick (R-Pa.), Chris Smith (R-N.J.), and Zach Nunn (R-IA), re-introduced Goldie’s Act (H.R. 349) in January. Named after a Golden Retriever who suffered and died in an Iowa puppy mill, this bill would require the USDA to conduct more thorough inspections, impose penalties for violations, and report suspected cruelty to local law enforcement. Last year, Goldie’s Act was introduced in the Senate by Sens. Richard Blumenthal (D-Conn.) and Rick Scott (R-Fla.), and endorsed by the bipartisan Problem Solvers Caucus, while also garnering support from nearly 150 animal welfare, law enforcement and shelter organizations.To read the ASPCA’s report, please visit www.aspca.org/puppymills2024. ###About the ASPCA®Founded in 1866, the ASPCA® (The American Society for the Prevention of Cruelty to Animals®) was the first animal welfare organization to be established in North America and today serves as the nation’s leading voice for vulnerable and victimized animals. As a 501(c)(3) not-for-profit corporation with more than two million supporters nationwide, the ASPCA is committed to preventing cruelty to dogs, cats, equines, and farm animals throughout the United States. The ASPCA assists animals in need through on-the-ground disaster and cruelty interventions, behavioral rehabilitation, animal placement, legal and legislative advocacy, and the advancement of the sheltering and veterinary community through research, training, and resources. For more information, visit aspca.org, and follow the ASPCA on Facebook, X, Instagram, and TikTok. Other Ways to Help: Become a Monthly Member Advocate for Animals Join the Advocacy Brigade Volunteer or Foster Share this page: <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/facebook.png" alt="Facebook" /> <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/twitter.png" alt="Twitter" />'''
