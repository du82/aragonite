["https://www.aspca.org/animal-care-recovery/cruelty-recovery-center/crc-adoptables"]
title = "Ohio Adoptable Dogs and Cats | ASPCA"
description = "The ASPCA Cruelty Recovery Center (CRC) is a permanent facility located in Columbus, Ohio, that provides high-quality, holistic care to animal victims of cruelty, neglect and natural disasters. The CRC’s dedicated team of sheltering, medical and behavior professionals work to prepare rescued dogs and cats for loving, adoptive homes."
full_description = 'You are hereAnimal Care and Recovery Cruelty Recovery Center Ohio Adoptable Dogs and Cats The ASPCA Cruelty Recovery Center (CRC) is a permanent facility located in Columbus, Ohio, that provides high-quality, holistic care to animal victims of cruelty, neglect and natural disasters. The CRC’s dedicated team of sheltering, medical and behavior professionals work to prepare rescued dogs and cats for loving, adoptive homes.Below are some of our available dogs and cats from the CRC who are looking for their new homes! If you’re interested in one of our adorable friends, check out their profile for more information on adopting. If you’re interested in an animal that is not currently listed, you can still fill out an adoption application here.Please Note: Our CRC facility is not open to the public. All meet and greets for potential adopters will be scheduled by a staff member via email or phone once an application has been submitted. Dogs Age 1 year - 3 years 4 years - 8 years 9 years - 12 years SexMaleFemale Faith <img src="https://www.aspca.org/sites/default/files/styles/list_thumb_180x120/public/field/image/crc-adoptable/list/faith-img_0736-thumb.jpg?itok=Z8XfG0-c" width="516" height="516" alt="" /> Faith Guppy <img src="https://www.aspca.org/sites/default/files/styles/list_thumb_180x120/public/field/image/crc-adoptable/list/guppy-img_4759-thumb.jpg?itok=d2sN_boU" width="516" height="516" alt="" /> Guppy Radio <img src="https://www.aspca.org/sites/default/files/styles/list_thumb_180x120/public/field/image/crc-adoptable/list/radio-valentines-day-2-thumb.jpg?itok=OZ-yXQ1n" width="516" height="516" alt="" /> Radio Viktor <img src="https://www.aspca.org/sites/default/files/styles/list_thumb_180x120/public/field/image/crc-adoptable/list/viktor-valentines-day-2-thumb.jpg?itok=-mhltLeL" width="516" height="516" alt="" /> Viktor If you don’t see your match here, there are plenty of other dogs and cats in Ohio looking for homes at Columbus Humane and Citizens for Humane Action. Cats Age0 - 1 year1 year - 2 years3 years - 10 years11 years + SexMaleFemale Blaze <img src="https://www.aspca.org/sites/default/files/styles/list_thumb_180x120/public/field/image/crc-adoptable/list/blaze-5-thumb.jpg?itok=UmEhS5lG" width="516" height="516" alt="" /> Blaze Phantom <img src="https://www.aspca.org/sites/default/files/styles/list_thumb_180x120/public/field/image/crc-adoptable/list/phantom-9-thumb.jpg?itok=uzOhYEJx" width="516" height="516" alt="" /> Phantom Foster for the CRC Help us give animal victims of neglect, cruelty, abuse and natural disasters the best chance to live happy lives by becoming a foster caregiver! Apply Now Other Ways to Help: Become a Monthly Member Advocate for Animals Join the Advocacy Brigade Volunteer or Foster Share this page: <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/facebook.png" alt="Facebook" /> <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/twitter.png" alt="Twitter" />'
