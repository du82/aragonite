["https://www.aspca.org/nyc/aspca-veterinary-spayneuter-services-new-york-city/mobile-spay-neuter-clinic"]
title = "NYC Mobile Spay/Neuter Clinic | Calendar | Vaccine | ASPCA"
description = "The ASPCA offers low-cost spay/neuter surgery via five Mobile Spay/Neuter Clinics that travel to many NYC neighborhoods! See calendar and locations."
full_description = '''<img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate You are hereNYC ASPCA Veterinary and Spay/Neuter Services in New York City ASPCA Mobile Spay/Neuter Services <!--/*--><![CDATA[/* ><!--*/ @media (min-width: 1140px) and (max-width: 1365px) { .panel-2col-stacked .panel-col-first, .panel-2col-stacked-mixed .panel-col-first, .panel-2col .panel-col-first, .panel-3col-mixed-stacked .left-col { width:100%; } /*--><!]]>*/ Español »The ASPCA offers free and low-cost spay/neuter surgery for cats and dogs in New York City. The ASPCA Mobile Spay/Neuter clinics are staffed with professionally trained, fully licensed veterinarians and technicians. While our wish is to be able to assist every animal possible, services are extremely limited due to staffing shortages and high demand.EligibilityNote that in order to provide the best experience possible, our eligibility requirements have changed. Please read carefully.Currently serving residents within the following zip codes of:Brooklyn: 11205, 11206, 11216, 11221, 11233Bronx: 10458, 10463, 10467, 10468, 10471Manhattan: 10032, 10033, 10034, 10040 Queens: 11354, 11355, 11356, 11357, 11358, 11359, 11365, 11366, 11367Staten Island: 10301, 10304, 10305 Owner must be at least 18 years old to sign a surgery consent form for their petPets must be between two months and nine years old with no known medical problemsTwo pets per household maximumEffective December 2022, zip codes eligible for services each month will be listed here and residents within those zip codes may join the waitlist on scheduled clinic dates.Not eligible? Search for a spay/neuter clinic near you on SpayUSA.org.Hours & LocationsYou are required to sign up for the waitlist starting at 6:00 A.M. on the morning of the clinic. The exact location of the mobile spay/neuter clinic will be shared once you are accepted onto the waitlist. No walk-ins are accepted.Currently serving residents within the following zip codes of:Brooklyn: 11205, 11206, 11216, 11221, 11233On these dates: March 13, 19, 28 Bronx: 10458, 10463, 10467, 10468, 10471On these dates: March 3, 11, 24 Manhattan: 10032, 10033, 10034, 10040On these dates: March 4, 10, 18, 31 Queens: 11354, 11355, 11356, 11357, 11358, 11359, 11365 11366, 11367On these dates: March 11, 25 Staten Island: 10301, 10304, 10305On these dates: March 18, 27 How to sign up for spay/neuter:1Complete the eligibility survey and add a maximum of two pets to the virtual waitlist, which opens at 6:00 A.M. At the end of the survey, you will be notified if you have been added to the waitlist.2If your pet(s) are able to be seen for surgery, you will receive a text confirmation. If you do not receive a confirmation text, please try again another time.3After the confirmation text, you will receive another text message to check-in online. Please start to make your way to the clinic location at 7:00 A.M. so we can promptly start intake at 7:30 A.M.4We will send a text notification when we are ready for you and your pet(s) to approach the clinic. Please do not approach the clinic until you receive the text to minimize crowding. If you do not arrive within 10 minutes of the “ready” notification, you may lose your place on the list.* As part of the intake process, animals will be examined by a veterinarian to determine if they appear healthy and can undergo surgery. Your pet may not be seen for services due to medical or capacity reasons after you’ve arrived.5You will receive a text message confirming when your pet's intake is complete with a time to return for your pet’s discharge that afternoon.What to do if there is no room on the waitlist:We continue to experience high demand for our services and capacity at our mobile spay/neuter clinics is extremely limited at this time due to ongoing staffing shortages. For other low-cost spay/neuter options, please refer to the SpayUSA.org website.PricingWithout proof of public assistance: $125 payable by cash and card.With proof of public assistance: No costAs part of the Animal Population Control Program, the NYC Department of Health & Mental Hygiene (DOHMH) reimburses the ASPCA for surgeries performed for income-qualifying residents of the five boroughs. This funding allows us to help more animals across New York City.What to BringA Photo ID: Driver license, NYC ID, Passport, Benefit card with photoProof of NYC address: NYS Driver license/ID, NYC ID, Rent/Gas/Electric/Cable billProof of Public Assistance (if applicable): Resident of public housing (NYCHA rent bill or Section 8 voucher/letter), Medicaid, SSI, Disability/SSD, Welfare, TANF, Food Stamps, Senior Citizen or Disability reduced fare MetroCardIf transporting a pet for someone who is disabled or elderly, bring that person's proof of public assistance and photo identification.Additional Services AvailablePlease note—we only provide additional services to animals who are undergoing spay/neuter procedures.Rabies vaccine (If your pet is up to date, please bring vaccine records with you)FVRCP vaccine for cats; DA2PP vaccine for dogsNail trimSmall tattoo, placed close to the incision site to indicate the animal is spayed/neuteredE-collar (plastic pet cone to prevent your pet from licking their incision)MicrochipCOVID-19 SafetyIn order to help us continue to serve pets in need, we ask that clients who are confirmed positive for COVID-19 or are feeling ill to please have another caregiver/family member bring your pet or wait until a later date.FAQWill my pet be accepted for spay/neuter surgery?All animals will be examined by a veterinarian to determine if they appear healthy and can undergo surgery aboard a Mobile Spay/Neuter Clinic.The animals generally accepted:Healthy dogs and catsPuppies and kittens who are at least eight weeks old and weigh at least two poundsFemale dogs in heatFemale cats in heatPregnant cats and dogs, depending on the health of the animal and term of pregnancyLarge dogs (Certain giant breeds may not be accepted.)Mobile Spay/Neuter Clinics will NOT accept:Ferrets, rabbits, or any animal who is not a cat or dogUnhealthy animals or those with contagious illnesses (Animals should not be coughing or sneezing, and should not have watery eyes, runny noses, mange, or ringworm.)Doberman Pinschers without proof of a normal blood work test for von Willebrand factor, a blood clotting protein.Cats and dogs in the care of an animal welfare or rescue organization. To learn more, visit our rescue professionals page.Certain animals may be accepted on a case-by-case basis, depending on the outcome of the veterinary examination:Female dogs and cats who are nursing puppies and kittens (It is ideal to wait to spay until one month after she weans her litter.)Male animals with only one testicleShort-nosed (brachycephalic) breeds, such as bulldogs, pugs and Persian catsWhat additional services are provided at the Mobile Spay/Neuter Clinic?These are the additional services provided for your pet while they are with us for spay/neuter surgery. Please note we only provide these services to animals who are being spayed/neutered.E-collarNail trimRabies vaccineFVRCP vaccine for cats/DA2PPV vaccine for dogsSmall tattoo placed close to the incision site when an animal is spayed/neutered (Tattoos let shelters and veterinarians easily identify that an animal has already been spayed/neutered. This is especially important for female animals, as presence of a tattoo can help the animal avoid undergoing an unnecessary surgery in the future.)Microchip offered for an additional $10 per animalFlea and tick treatment offered for an additional $10 per animalHow should I prepare my pet(s) for spay/neuter surgery?Animals younger than four months old should eat a small meal at about 6 AM on the morning of surgery.Animals older than four months should have access to food or treats removed at around midnight prior to surgeryAlways provide your pet access to fresh drinking water; do not withhold water from your pet prior to surgeryBring cats in carriers – limit to one cat per carrier if possibleBring dogs on leashes to prevent accidental escape or fighting with other dogs during intake and dischargeWhat occurs when I arrive at the site of a Mobile Spay/Neuter Clinic?An ASPCA representative will arrive no later than 7:00 AM to set up the clinic.The first person on the waitlist will be seen by 7:30 AM.You will receive a text message from an on-site ASPCA staff member, please only approach the clinic when you get that text message.Please wait nearby, failure to arrive in a timely manner could mean that we will not be able to see your pet that day.The waitlist will be closed when we are certain that we cannot serve any additional animals for the day. We hope to get to everyone on the waitlist but if we do not and you wish to come to another clinic, you must repeat the waitlist process on the morning of the next clinic you attend. Information will not be stored by the ASPCA and will not roll over to other clinic events.We cannot take any pets after 9:00 AM or once we have reached maximum capacity of 20-25 dogs and cats.Please note that there is no advantage to arriving onsite prior to 7:00 AM, we will see pets in the order of the electronic waitlist.Be prepared to pick up your pet at approximately 3:30 PM. Pickup times vary, so check with the onsite ASPCA representative for actual time during check-in. Pets may be mildly unsteady from the anesthesia, but will be awake and able to walk a short distance home on a leash.While waiting, please be courteous and considerate of neighbors, fellow clients and private property.How should I care for my pet after surgery?Since your pet has had a surgical procedure, they will need specific post-operative care until they have fully healed. Please review the instructions on aspca.org/aftercare to help with your pet’s recovery.Will the clinic be canceled if there’s inclement weather?Mobile Spay/Neuter Clinics may be canceled in the event of inclement weather. In the event of a clinic cancellation, our online calendar will be updated as early as possible. If you have already signed up for the waitlist and a clinic must be canceled, you will be notified via text message.I run a local rescue group in New York City. Where can I bring my cats and dogs to be spayed/neutered?Spay/neuter surgery and transport services provided are available to animal rescuers through our Stationary Spay/Neuter Clinic in Queens, ASPCA Community Veterinary Clinic in Brooklyn and ASPCA Community Veterinary Clinic in the Bronx. The ASPCA's two NYC clinic locations provide high-quality spay/neuter services to dogs and cats managed by local animal rescuers only. To learn more, visit our rescue professionals page. <img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate'''
