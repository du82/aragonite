["https://www.aspca.org/aspca-spay-neuter-alliance"]
title = "ASPCA Spay/Neuter Alliance | Asheville | Low-cost S/N Clinic"
description = "Pet overpopulation is a real problem that leads to the unnecessary euthanasia of millions of otherwise-adoptable cats and dogs every single year. We’re helping combat this epidemic by providing low-cost, high-quality spay/neuter surgery to underserved communities. Learn more."
full_description = '''<img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate ASPCA Spay/Neuter Alliance <img src="https://www.aspca.org/sites/default/files/styles/inner_page_tab_background/public/field/image/subsection/our-response_spay-neuter-services-ha_tab-image-a.jpg?itok=0CcqcQYy" width="1040" height="402" alt="Humane Alliance" title="Humane Alliance" /> Our ServicesAbout UsDirections Due to the impact of Hurricane Helene on our community, we are currently providing spay/neuter services again in a limited capacity. If you are in need of veterinary care, please see www.ncvma.org for a list of veterinary facilities and their status. Our ServicesThe ASPCA Spay/Neuter Alliance offers high-quality, low-cost spay/neuter services to the communities of Western North Carolina.If you reside in Buncombe County or the surrounding areas, please click on the "Book Online" link below to make a spay/neuter appointment for your pet.Appointments and transport services are also available through our partnerships with local shelters and rescue organizations in 17 surrounding western North Carolina counties, including Buncombe County.Please check out the "Directions" tab above to find contact information for our spay/neuter partners operating outside of Buncombe County. You may get an appointment more quickly through one of them. Surgical FeesThere is no additional cost for pregnant, in-heat or cryptorchid animals or community cat ear-tips.Female dog$65Male dog$65Female cat$50Male cat$35Microchip$10Umbilical hernia repair$0 (free)Nail trim$0 (free)We accept debit and credit cards only. Financial assistance may be available. Please email [email protected] for details. Vaccine FeesAdministered only with surgery.Required VaccinesRabies (if not up-to-date)$0 (free)Optional Canine VaccinesDA2PP (distemper)$15Bordetella (kennel cough)$15Optional Feline VaccinesFVRCP (distemper/upper respiratory)$15Important Instructions for PatientsBefore Surgery | After SurgeryPlease read before booking! We have very limited public appointments at this time and do our best to provide them to pets and their owners most in need. We respectfully ask that if you are able to afford a traditional veterinary provider, you seek a spay/neuter appointment with them. We appreciate your consideration.Book Online for Asheville, NCIf you are finding it difficult to get an appointment directly through us, please see the Directions tab (above) for partner organizations who also offer spay/neuter appointments. Not in Asheville? Find a clinic near you.ASPCA Spay/Neuter Alliance adheres to the standards for Spay/Neuter Medical Care Guidelines developed in 2008, and updated in 2016, by the Association of Shelter Veterinarians' Veterinary Task Force to Advance Spay/Neuter. About UsASPCA Spay/Neuter Alliance has worked to provide a solution to pet overpopulation in Western North Carolina since 1994, and we continue to expand our reach nationally through spay/neuter training programs.Since opening, we have spayed and neutered over 500,000 cats and dogs.Our 11 licensed veterinarians and 35 medical support staff are leaders in providing high-quality spay/neuter procedures and have been described as “setting the gold standard” across the nation by those who have trained with us. All of our veterinarians are compassionate animal lovers who have collectively performed hundreds of thousands of spay/neuter operations. At the ASPCA Spay/Neuter Alliance, your beloved pet is in safe, caring, and professional hands. HoursThe ASPCA Spay/Neuter Alliance is operating on a modified schedule with limited public appointments available. You may make a spay/neuter appointment here. You may make a post-operative recheck appointment by calling (855) 434-9285. Tour Our FacilityTake a virtual stroll through ASPCA Spay/Neuter Alliance's campus <!--/*--><![CDATA[/* ><!--*/ .embed-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; } .embed-container iframe, .embed-container object, .embed-container embed { position: absolute; top: 0; left: 0; width: 100%; height: 100%; } /*--><!]]>*/ Contact UsEmail us at [email protected].DirectionsFind Us on Google Maps »From the NorthTake the US 19/US 23 South to the I-240 West, exiting at 3A (Patton Avenue). Turn right onto Leicester Highway and drive approximately 7/10 mile, turning right onto Heritage Drive (between the GO Grocery and the Enmark gas station). Bear right at the fork, then left, following the signs for "Building A."From the EastTake the I-40 West to the I-240 West, exiting at 3A (Patton Avenue). Turn right onto Leicester Highway and drive approximately 7/10 mile, turning right onto Heritage Drive (between the GO Grocery and the Enmark gas station). Bear right at the fork, then left, following the signs for "Building A."From the SouthTake the I-26 West to the I-240 East, exiting at 3A (Patton Avenue). Turn right onto Leicester Highway and drive approximately 7/10 mile, turning right onto Heritage Drive (between the GO Grocery and the Enmark gas station). Bear right at the fork, then left, following the signs for "Building A."From the WestTake the I-40 East to the I-240 East, exiting at 3A (Patton Avenue). Turn right onto Leicester Highway and drive approximately 7/10 mile, turning right onto Heritage Drive (between the GO Grocery and the Enmark gas station). Bear right at the fork, then left, following the signs for "Building A."Transportation ServicesWe offer transportations of pets through our 24 animal welfare transport partners in 17 counties of Western North Carolina.Highly skilled and dedicated employees pick up scheduled patients at a pre-arranged location that is supervised by a local transport partner. The patients are then brought to our facility in safe, climate-controlled vehicles for surgery, and then returned to the drop-off location the next day.If you are interested in having your pet transported to our clinic, please contact your local humane organization, listed below, to schedule an appointment through them. Avery CountyAvery Humane SocietyPhone: (828) 733 - 2333Buncombe CountyAsheville Humane Society / Community Solutions - Safety NetPhone: (828) 761 - 2008Email: [email protected]; [email protected]Mountain Pet RescuePhone: (828) 778 - 7728Email: [email protected]Asheville Cat Weirdos (Cats Only)Email: [email protected]FurEver Friends (Cats Only)Phone: (828) 348 - 7198Email: [email protected]Labor of Love Transport RescueEmail: [email protected]Caldwell CountyCaldwell Humane SocietyPhone: (828) 729 - 6242Email: [email protected]Cherokee CountyValley River Humane SocietyPhone: (828) 837 - 2304Haywood CountyHaywood Animal Welfare AssociationPhone: (828) 425 - 1329Email: [email protected]Sister Kitten (Cats Only)Phone: (828) 400 - 0223Email: [email protected]Operation Spay HaywoodPhone: (828) 550 - 1252Email: [email protected]Henderson CountyBRHS - Spay Neuter Incentive Program (SNIP)Phone: (828) 698 - 4481Email: [email protected]Jackson CountyCashiers Highlands Humane SocietyPhone: (828) 743 - 5752Email: [email protected]Jackson County Humane SocietyPhone: (877) 273 - 5262Email: [email protected]Catman2 (Cats Only)Phone: (828) 293 - 0892Email: [email protected]Lincoln CountyHumane Society of Lincoln CountyPhone: (704) 732 - 9022Email: [email protected]Macon CountyAppalachian Animal Rescue CenterPhone: (828) 524 - 4588Email: [email protected]Madison CountyFriends Of Madison County (FOMCA)Phone: (828) 649 - 9798Email: [email protected]McDowell CountyPaws and Claws OutreachPhone: (828) 317 - 7401Email: [email protected]Mitchell CountyMitchell County Animal RescuePhone: (828) 765 - 6952Email: [email protected]Rutherfordton CountyPAWS of Rutherford CountyPhone: (888) 422 - 7303Email: [email protected]Swain CountyPlacing Animals Within Society (PAWS Animal Shelter)Phone: (828) 488 - 0418Email: [email protected]Transylvania CountyTransylvania Animal Alliance GroupPhone: (828) 966 - 3166Email: [email protected]Watauga CountyWatauga County Humane SocietyPhone: (828) 264 - 7865Email: [email protected]Yancey CountyYancey Humane SocietyPhone: (828) 682 - 9510Email: [email protected]Not in Asheville? Find a clinic near you. Join Our Team!We’re seeking qualified candidates in the Asheville, North Carolina, area to fill open positions at the ASPCA Spay/Neuter Alliance. Put your compassion for animals to work today as part of our team.The ASPCA offers a competitive compensation, great benefits, and the ASPCA Spay/Neuter Alliance is currently offering relocation assistance and a signing bonus for Registered Veterinary Technicians who join our team.Apply Now Community Cat Program:We are currently offering free spay/neuter surgeries and rabies vaccinations for trapped community cats.LEARN MORE Share this page: <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/facebook.png" alt="Facebook" /> <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/twitter.png" alt="Twitter" /> <img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate'''
