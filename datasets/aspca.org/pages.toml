title = "ASPCA, Kanawha-Charleston Humane Association Facilitate Emergency Transport of More Than Four Dozen Dogs to ASPCA Emergency Shelter | ASPCA"
full_description = '''Other Ways to Help: Become a Monthly Member Advocate for Animals Join the Advocacy Brigade Volunteer or Foster You are hereAbout Us Press Releases ASPCA, Kanawha-Charleston Humane Association Facilitate Emergency Transport of More Than Four Dozen Dogs to ASPCA Emergency Shelter The dogs were transported due to flooding at Kanawha-Charleston Humane Association as a result of historic rainfall in the region February 27, 2025 KANAWHA COUNTY, W.Va. – This week, the ASPCA® (The American Society for the Prevention of Cruelty to Animals®) assisted the Kanawha-Charleston Humane Association (KCHA) with the emergency transport of 41 dogs from the shelter in Charleston, West Virginia. The dogs, who were evacuated from KCHA due to historic rainfall and severe flooding in the area, arrived at the ASPCA Cruelty Recovery Center located in Columbus, Ohio, on Tuesday, February 25. The CRC takes in animals displaced by emergency situations including disasters caused by extreme weather. The dogs are currently undergoing medical and behavioral evaluations. In the coming weeks, they will be available for adoption both directly through the CRC and through the ASPCA’s shelter partners.“This has been an incredible experience from start to finish,” says Julie Hypes, animal behaviorist and animal care director at Kanawha-Charleston Humane Association. “We are blown away by the kindness of the ASPCA team to help our shelter and community in our time of need!"“The ASPCA works with a network of shelters to place animals coming from a variety of disaster situations, like the extreme flooding taking place in West Virginia,” says Amanda Kruczynski, senior operations director at the ASPCA Cruelty Recovery Center. “We are grateful to be in a position to help the Kanawha-Charleston Humane Association by getting these dogs out of harm’s way due to dangerous flooding in the area. This emergency transport to the CRC ensures these dogs' safety and gets them one step closer to finding loving homes.”In addition to this emergency transport, the ASPCA helped facilitate an additional transport of six dogs from KCHA to the Humane Society of Charlotte in Charlotte, North Carolina. The dogs arrived on Monday, February 24, and are receiving medical and behavioral care before they are made available for adoption.### About Kanawha-Charleston Humane AssociationKanawha-Charleston Humane Association is a private 501(c)3 organization serving Kanawha County, WV. KCHA is committed to saving the lives of animals through sheltering, adoption, foster care, spay and neuter programs, cruelty prevention, and community outreach. For more information, visit www.adoptcharleston.com. ###About the ASPCA®Founded in 1866, the ASPCA® (The American Society for the Prevention of Cruelty to Animals®) was the first animal welfare organization to be established in North America and today serves as the nation’s leading voice for vulnerable and victimized animals. As a 501(c)(3) not-for-profit corporation with more than two million supporters nationwide, the ASPCA is committed to preventing cruelty to dogs, cats, equines, and farm animals throughout the United States. The ASPCA assists animals in need through on-the-ground disaster and cruelty interventions, behavioral rehabilitation, animal placement, legal and legislative advocacy, and the advancement of the sheltering and veterinary community through research, training, and resources. For more information, visit aspca.org, and follow the ASPCA on Facebook, X, Instagram, and TikTok. Other Ways to Help: Become a Monthly Member Advocate for Animals Join the Advocacy Brigade Volunteer or Foster Share this page: <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/facebook.png" alt="Facebook" /> <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/twitter.png" alt="Twitter" />'''
