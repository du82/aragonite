["https://aspca.org/barred-from-love/puppy-mills-101"]
title = "A Closer Look at Puppy Mills | Dog Breeding | ASPCA"
description = "Like you, we love dogs. They’re members of the family—often our favorite members! But too many dogs in America don’t know this kind of love. Victims of the high-volume puppy industry, they’re bred for profit and kept in tiny, filthy cages. These dogs don’t receive any affection, exercise or proper veterinary care. And when they can no longer produce puppies, they are discarded. Learn how this shadowy industry uses sophisticated but dishonest techniques to market its adorable “product.”"
full_description = 'Home Puppy Mills 101 How to Avoid Cruelty Laws & Rules Take Action You are hereBarred From Love Puppy Mills 101 Countless dogs are bred for profit and kept in cruel conditions just to keep the puppy industry in business. Learn how this shadowy industry works and how it hurts dogs.More Puppies, More ProfitsThere’s a reason the retail pet industry doesn’t show you where its puppies come from. To turn a profit, corners need to be cut, which means poor care for dogs in puppy mills.The Puppy PipelineWho gets the puppies from the breeder to the pet stores? Between points A and B, there’s a lesser-known side industry at work that perpetuates and profits from animal cruelty.It Happened to MeNothing Prepares You for What You WitnessRead moreA Long Road Ahead for a Former Puppy Mill DogRead moreLife-Long Health Issues for Pug Rescued from Puppy MillRead moreA Badly Bred Pet Store Puppy and His Unbelievable Disease ProgressionRead moreFormer Puppy Mill Dog Still Has Challenges Read moreTheir Dog Died at 3 Years Old: What Marley’s Family Wants You to KnowRead morePuppy Mill "Mom” Beats the Odds, but Carries the TraumaRead moreAdorable Pup Victimized by Careless BreedingRead moreThis Mother’s Day, We’re Thinking of SummerRead moreNot What I Expected: My Sick Pet Store PuppyRead moreAdorable Pup Doesn’t Deserve ThisRead moreWe Were Misled into Buying a Sick Pet Store PuppyRead moreDwarf German Shepherd Victim of Cruel Breeding IndustryRead more Share Your StoryDid you purchase a puppy from a pet store or online? Did you rescue a puppy mill dog? Your story and photos could aid us tremendously as we work to educate the public and expose inhumane breeders. Tell us about your experience.'
