["https://aspca.org/protecting-farm-animals"]
title = "Protecting Farm Animals from Abuse and Suffering | ASPCA"
description = "All animals deserve to live cruelty-free. Together we can create a more humane world for farm animals, advocate for stronger laws, and fight factory farms."
full_description = '''<img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-farm.jpg.jpeg" width="2000" height="300" alt="" /> Help the ASPCA Put a Stop to Animal Cruelty Donate <img src="https://www.aspca.org/sites/default/files/styles/inner_page_banner/public/field/image/section/protecting-farm-animals_title-background-b-r1.png?itok=A3Curzke" width="2000" height="430" alt="Brown chicken" /> Protecting Farm Animals <!--/*--><![CDATA[/* ><!--*/ @media (max-width: 767px){ .teaser-list.arrowlink .teaser .text { padding-right:100px; padding-left: 10px; } } /*--><!]]>*/ Our Vision More than 9.5 billion chickens, turkeys, pigs and cows are slaughtered every year for food in the United States. The vast majority of these animals are raised on “factory farms,” where they are confined in huge numbers in barren, industrial settings. These facilities are not just inhumane, they are also environmentally unsound and dangerous for public health. But it doesn’t have to be this way. The ASPCA is calling for increased transparency in animal agriculture, an end to the cruelest factory farming practices, and adequate funding for a more humane food system. Learn more about our work and how you can be a part of this movement to protect billions of farmed animals. Revealing the Problem with Factory Farming Understand how factory farming harms animals, consumers, farmers, workers, communities and the planet. Read more Empowering Food Shoppers Our Shop With Your Heart program provides resources that make more compassionate grocery shopping easier. Read more Advocating for Stronger Laws Passing new laws to protect farm animals and support more humane farming is critical. Learn about our legislative work and take action today. Read more Collaborating with Farmers and the Food Industry Explore our resources for farmers and food companies who are committed to building a more humane food system. Read more Grants to Help Farm Animals Find funding opportunities and learn about projects we've supported to end the suffering of farmed animals. Read more Public Opinion Surveys on Farm Animal Welfare National polls show just how much Americans care about farm animals and protecting them from suffering. Read more Latest News Together, we are building a more humane world for farm animals. See the results of your advocacy and get the latest news on farm animal welfare. Read more Share this page: <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/facebook.png" alt="Facebook" /> <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/twitter.png" alt="Twitter" /> <img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-farm.jpg.jpeg" width="2000" height="300" alt="" /> Help the ASPCA Put a Stop to Animal Cruelty Donate'''
