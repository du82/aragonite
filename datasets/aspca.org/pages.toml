full_description = '<img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate You are hereAdopt a Pet North Carolina Adoptable Dogs The ASPCA Behavioral Rehabilitation Center (BRC) is the first facility in the United States dedicated to the rehabilitation of severely fearful dogs. Here, homeless dogs from across the country undergo months-long rehabilitation treatment to prepare them for lives in loving homes.We place some graduates from the program through direct adoption, and others are transferred to our national network of Placement Partner shelters for adoption. Here are a few recent BRC graduates who are looking for very special families to call their own!Please note, our facility is not open to the public. All meet and greets will be scheduled by a staff member. Filter by: AgeYoung: 1 year - 3 yearsAdult: 4 years - 8 yearsSenior: 9 years - 12 years SexMaleFemale Hettie <img src="https://www.aspca.org/sites/default/files/styles/list_thumb_180x120/public/field/image/nc-dog/list/hettie-profile-picture-thumb.jpg?itok=m0LOGFzX" width="516" height="516" alt="" /> Hettie If you don’t see your match here, consider becoming a foster caregiver! Please see our foster page at aspca.org/BRCfoster to learn more. Also, there are plenty of other dogs in North Carolina looking for homes at Brother Wolf Animal Rescue and Asheville Humane Society. Other Ways to Help: Become a Monthly Member Advocate for Animals Join the Advocacy Brigade Volunteer or Foster Share this page: <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/facebook.png" alt="Facebook" /> <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/twitter.png" alt="Twitter" /> <img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies 