["https://aspca.org/animal-care-recovery/aspca-behavioral-rehabilitation-center"]
title = "Behavioral Rehabilitation Center for Cruelty Victims | ASPCA"
description = "The ASPCA Behavioral Rehabilitation Center allows extremely fearful dogs the opportunity to overcome their fears and improve their quality of life through an intensive program of enrichment and behavior modification. Learn more about this groundbreaking and life-saving program."
full_description = '<img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate You are hereAnimal Care and Recovery Behavioral Rehabilitation Center <img src="https://www.aspca.org/sites/default/files/styles/inner_page_tab_background/public/field/image/subsection/our-response_rehabilitation-center_tab-image.jpg?itok=7aUmyj8m" width="1040" height="402" alt="" /> Our ResponseLatest News In March 2013, the ASPCA launched the ASPCA Behavioral Rehabilitation Center (BRC), a pilot program located at St. Hubert’s Animal Welfare Center in Madison, New Jersey. It was the first and only facility dedicated to providing behavioral rehabilitation for severely fearful, unadoptable dogs, such as those confiscated from puppy mills and hoarding situations. Due to the success of the pilot program, which had 237 graduates over four years, the ASPCA has expanded its program and built a permanent facility in Weaverville, North Carolina. The state-of-the-art facility can house up to 65 dogs at a time. It includes several teaching spaces where shelter professionals can learn how we treat fearful dogs, how our integrated care team works together to make rehabilitation successful and how they can best support shelter animals’ psychological welfare at their own facilities. Homeless dogs of all ages and backgrounds are eligible for the program, as long as they meet our behavioral and medical inclusion criteria. Only dogs whose fear compromises their quality of life and makes adoption impossible are accepted. The Weaverville facility has individual kennels, along with “real-life rooms,” designed to help dogs get used to life in home environments, outdoor play areas, and a large indoor training area. On average, rehabilitation requires 16 weeks of treatment. However, that timing depends heavily on the severity of each dog’s behavior problems and how responsive he or she is to treatment. Once the dogs have completed the program, most transformed graduates are placed within our network of partner shelters and rescue groups to be made available for adoption. We place a smaller percentage directly from our Weaverville facility. One of our goals at the BRC is to help partner organizations elevate their own shelter behavior programs. Therefore, we collaborate with the ASPCA’s Learning Lab to share the lessons we’ve learned about effectively supporting the quality of life and psychological needs of behaviorally challenged animals. Our expert staff serve as advisors in the development and delivery of the Learning Lab’s interactive educational programs for shelters nationwide. These include in-person retreats and training at the BRC for select shelter partners as well as online learning opportunities open to all shelter professionals and volunteers. By sharing what we have learned and collaborating with other shelters across the country, we aim to maximize the impact of our work for some of the nation’s most vulnerable animals. The Behavioral Rehabilitation pilot program is featured in an award-winning ASPCA documentary, “Second Chance Dogs,” which you can watch below or access for free on YouTube. .embed-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; } .embed-container iframe, .embed-container object, .embed-container embed { position: absolute; top: 0; left: 0; width: 100%; height: 100%; } If you are located in the Weaverville, North Carolina, area and have a passion for animal welfare, learn more about volunteer and foster opportunities at the ASPCA Behavioral Rehabilitation Center today. If you are interested in adopting an animal from the ASPCA Behavioral Rehabilitation Center, please see our North Carolina adoptable dogs who are looking for loving homes. <img src="https://www.aspca.org/sites/default/files/styles/inner_page_basic_teaser/public/field/image/blog/catalina-new-profile-picutre-thumb.jpg?itok=LXLnI9uc" width="335" height="335" alt="Catalina" /> September 26, 2024 Adoptable Catalina’s Love Language Is Quality Time – Will You Spend Some With Her? <img src="https://www.aspca.org/sites/default/files/styles/inner_page_basic_teaser/public/field/image/blog/20240925_ht_sonic_thumb.jpg?itok=wD9tFI8w" width="335" height="335" alt="" /> September 25, 2024 A Meaningful Foster Experience Leads to Adoption of a Once Injured and Abandoned Feline <img src="https://www.aspca.org/sites/default/files/styles/inner_page_basic_teaser/public/field/image/blog/20240828_ht_bailee_thumb.jpg?itok=Ehl8iPIL" width="335" height="335" alt="" /> August 28, 2024 Rehabilitation Transforms a Once-Fearful Dog Into a Confident Companion <img src="https://www.aspca.org/sites/default/files/styles/inner_page_basic_teaser/public/field/image/blog/20240822_as_arnold_thumb.jpg?itok=08IgQd6_" width="335" height="335" alt="" /> August 22, 2024 Arnold Is a Paw-fect House Guest and He’s Ready to Be Your Loving Companion! <img src="https://www.aspca.org/sites/default/files/styles/inner_page_basic_teaser/public/field/image/blog/20240819_apcc_fosters_thumb.jpg?itok=ApUqFHdD" width="335" height="335" alt="" /> August 19, 2024 Did You Know There Are Different Types of Animal Foster Caregivers? Load more Other Ways to Help: Become a Monthly Member Take the Cruelty Pledge Join the Advocacy Brigade Advocate for Animals Volunteer or Foster Share this page: <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/facebook.png" alt="Facebook" /> <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/twitter.png" alt="Twitter" /> <img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate'
