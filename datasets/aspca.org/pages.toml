full_description = '<img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate <img height="500" width="1040" class="media-element file-default" data-delta="1" src="https://www.aspca.org/sites/default/files/about-us_contact-us_main-image.jpg" alt="" title="" /> You are hereAbout Us Contact Us <img height="500" width="1040" class="media-element file-default" data-delta="1" src="https://www.aspca.org/sites/default/files/about-us_contact-us_main-image.jpg" alt="" title="" /> Thank you for contacting the ASPCA. To help us answer your question most efficiently, please visit our Frequently Asked Questions first to see if your question has already been answered. Helping AnimalsReport Cruelty: In New York City: 311 (or 911 for crimes in progress)Outside NYC: Visit our Report Animal Cruelty page. Found/Lost/Stray Animals: NYC Only: Animal Care & Control of NYC (AC&C) at 311Outside of NYC: Find a Shelter Humane Legislation and Lobbying: [email protected] Volunteer:Volunteer Opportunities at the ASPCAOutside of NYC: Contact your local shelter for volunteer opportunities. AdoptionNYC Only: (212) 876-7700, ext. 4120 or visit the Adoption Center online for a list of available dogs and cats, applications, directions and hours. Outside of NYC: Find a Shelter Taking Care of Your PetAnimal Poison Control Center: (888) 426-4435 (Visit our Animal Poison Control section for more information) Medical Emergencies: The ASPCA does not provide medical emergency advice over the phone or email. We urge you to take your pet to a local vet immediately. New York City Services(Read our NYC FAQ)ASPCA Adoption Center: (212) 876-7700, ext. 4120 (Adoptable Animal List)Barking Dogs: 311 ASPCA Animal Hospital: 844-692-7722 (844-MYASPCA) Report Cruelty: 311 or 911 Dog Licenses: NYC Residents / NY State Residents Found/Lost/Stray Animals: Animal Care & Control of NYC (AC&C) at 311 Pet Loss: (Visit our End of Life Care page for information) Spay/Neuter Clinic: View calendar and upcoming locations. Supporting the ASPCAMonthly Donation Updates: Please call us at (800) 628-0028, Monday-Friday, 8:00am-8:00pm ET Donations & Member Support: Please visit our Frequently Asked Questions before contacting our Member Support. If you are unable to find the answer, please call us at (800) 628-0028Strategic Cause Partnerships: View Partners Founders Society: (866) 319-7870 Misc.General Inquiries: Please visit our Frequently Asked Questions first to see if your question has already been answered. If you are unable to find the answer, please contact [email protected] or (888) 666-2279Media Inquiries: (212) 876-7700, ext. 4655, submit your request online.Email Unsubscribe Requests: [email protected] Mailing List Address Change Or Removal: [email protected] General Phone Number:If these topics do not address your concerns, please call (212) 876-7700 during normal business hours, Monday-Friday, 9:00 A.M. to 5:00 P.M. ET Write to Us:American Society for the Prevention of Cruelty to Animals (ASPCA)424 E. 92nd StNew York, NY 10128-6804 Other Ways to Help: Become a Monthly Member Join the Advocacy Brigade Advocate for Animals Volunteer or Foster Share this page: <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/facebook.png" alt="Facebook" /> <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/twitter.png" alt="Twitter" /> <img src="https://www.aspca.org/sites/default/files/field/image/donate-bar/donate_image_footer-puppies_wide_0.jpg" width="2000" height="300" alt="puppies behind fence" /> Help the ASPCA Put a Stop to Animal Cruelty Donate'
