["https://aspca.org/about-us/press-releases"]
title = "Press Room | Releases | Media Resources | ASPCA"
description = "Read the latest press releases from the ASPCA, including vital news, updates and information. Contact our Media Team or find public contact information."
full_description = 'Other Ways to Help: Become a Monthly Member Advocate for Animals Join the Advocacy Brigade Volunteer or Foster You are hereAbout Us Press Releases Members of the MEDIA ONLY should contact the ASPCA Media & Communications team using our media request form or by calling (212) 876-7700, ext. 4655. Please be sure to include your media outlet, the nature of your query and daytime telephone number.Members of the public should visit our Contact Us page. Your views and concerns are important to us, and we request you to contact us according to these guidelines so that we can continue to assist you in the best and most efficient way possible. Thank you for your interest in, and support of, the ASPCA! Latest Press Releases Start Date Start Date Date E.g., 2025-03-05 End Date End Date Date E.g., 2025-03-05 To Celebrate National Horse Protection Day, Lawmakers Reintroduce Bipartisan Legislation to End Horse Slaughter Thursday, February 27, 2025 ASPCA, Kanawha-Charleston Humane Association Facilitate Emergency Transport of More Than Four Dozen Dogs to ASPCA Emergency Shelter Thursday, February 27, 2025 ASPCA Statement on Confirmation of Brooke Rollins as Secretary of Agriculture Thursday, February 13, 2025 Annual ASPCA Report on Puppy Mill Cruelty Reveals the USDA Failed to Protect Vulnerable Dogs Wednesday, February 12, 2025 ASPCA Continues Supporting Wildfire Animal Relief Efforts in Southern California Alongside Local Shelters, National Partners, and Government Agencies Friday, January 31, 2025 Nearly 90 Equines Seized by Court Order from Breeding Operation in Madison County, Mont. Tuesday, January 28, 2025 ASPCA Announces $5 Million California Wildfire Response & Preparedness Fund Monday, January 13, 2025 ASPCA Deploys to Southern California, Assists Pasadena Humane with Disaster Relief Efforts in Response to Catastrophic Wildfires Friday, January 10, 2025 ASPCA Commends Senate Agriculture Committee for Including Critical Animal Welfare Provisions in Sena