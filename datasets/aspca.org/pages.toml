title = "ASPCA Deploys to Southern California, Assists Pasadena Humane with Disaster Relief Efforts in Response to Catastrophic Wildfires | ASPCA"
full_description = 'Other Ways to Help: Become a Monthly Member Advocate for Animals Join the Advocacy Brigade Volunteer or Foster You are hereAbout Us Press Releases ASPCA Deploys to Southern California, Assists Pasadena Humane with Disaster Relief Efforts in Response to Catastrophic Wildfires January 10, 2025 LOS ANGELES – In response to the devastating wildfires burning across Southern California, the ASPCA disaster response team is currently on the ground, at the request of Pasadena Humane, to provide subject matter expertise and critical support for impacted communities. In addition, the ASPCA is ensuring the safety of its own staff based in Southern California, including those who oversee the ASPCA Kitten Foster Program in Los Angeles. More than 30 cats and kittens in the care of the ASPCA near the disaster zone have been relocated as a precautionary measure and are now safely in foster care in currently unaffected areas."Wildfires are incredibly destructive, and the current series of unprecedented fires burning throughout Los Angeles are no exception, severely impacting people and their pets," said Susan Anderson, director of ASPCA Disaster Response. "The ASPCA is dedicated to collaborating closely with our partners in California, including organizations directly affected by the fires and agencies outside the disaster zone supporting our relief efforts, to safeguard the health and safety of displaced pets and shelter animals."The ASPCA is continuing to communicate with animal welfare organizations and emergency management agencies across the impacted areas to assess where we can continue to best support the most critical needs. The ASPCA is grateful to its partners outside of the disaster zone, including the San Diego Department of Animal Services and the San Diego Humane Society, for their assistance with these urgent response efforts.For lifesaving tips for pet owners who may be preparing to potentially evacuate from their homes, visit aspca.org/disasterprep. For those in need of immediate assistance with an animal, please contact the local agency within your community that handles animal disaster response, which may be your emergency management agency, law enforcement, animal services, or local animal shelter.For those interested in supporting animal response efforts, consider donating to or volunteering with one of the many local animal welfare organizations in Southern California – including Pasadena Humane – that are working tirelessly to keep California’s animals and pet owners safe. Some animal welfare organizations outside of the disaster zone, such as San Diego Humane Society, are also taking in displaced homeless animals and may be looking for adopters and foster caregivers. Anyone interested in directly supporting the ASPCA’s lifesaving efforts can visit aspca.org/lawildfire. ###About the ASPCA®Founded in 1866, the ASPCA® (The American Society for the Prevention of Cruelty to Animals®) was the first animal welfare organization to be established in North America and today serves as the nation’s leading voice for vulnerable and victimized animals. As a 501(c)(3) not-for-profit corporation with more than two million supporters nationwide, the ASPCA is committed to preventing cruelty to dogs, cats, equines, and farm animals throughout the United States. The ASPCA assists animals in need through on-the-ground disaster and cruelty interventions, behavioral rehabilitation, animal placement, legal and legislative advocacy, and the advancement of the sheltering and veterinary community through research, training, and resources. For more information, visit aspca.org, and follow the ASPCA on Facebook, X, Instagram, and TikTok. Other Ways to Help: Become a Monthly Member Advocate for Animals Join the Advocacy Brigade Volunteer or Foster Share this page: <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/facebook.png" alt="Facebook" /> <img src="https://www.aspca.org/sites/all/themes/aspca_2015/images/twitter.png" alt="Twitter" />'
