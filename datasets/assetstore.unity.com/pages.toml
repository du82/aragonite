["https://assetstore.unity.com/publishing/submission-guidelines"]
title = "The Best Assets for Game Making | Unity Asset Store"
description = "Discover the best assets for game making. Choose from our massive catalog of 2D, 3D models, SDKs, templates, and tools to speed up your game development process."
full_description = '''Over 13,000 top-rated assetsRated by 85,000+ customersSupported by 100,000+ forum membersEvery asset moderated by UnityAsset Store Submission Guidelines Last updated: December 4, 2024 What’s changed: We updated our Asset Store Submission Guidelines to provide clarity that they inform publishers solely about technical compatibility expectations. Please review the full text of the updated Asset Store Submission Guidelines. You can view the prior version of our Asset Store Submission Guidelines here. OverviewThis guide informs new and existing publishers about what is expected of products submitted to the Unity Asset Store for technical compatibility. To ensure that content meets a consistent standard, the Asset Store team checks your incoming submissions against these guidelines during your product’s review. If your product is rejected, you need to fix any issues mentioned in the rejection before re-submitting your product. While the Asset Store team intends the review process to catch and inform you of all the reasons why your product has been rejected, more issues might be found in your product even if your resubmission has addressed all the initial issues. The Asset Store team will not provide suggestions for features, design aspects, or further development of packages. If you have received a rejection, you can reply to the rejection email, for example, if you are not sure about the communicated issue or disagree with the rejection. OurAsset Store Terms and Asset Store Content Policy outlines other restrictions for Assets submitted to the Unity Asset Store. In rare instances, even if your submission has gone through multiple resubmissions, some products might be deemed unfit for the Unity Asset Store. If you have any issues regarding your submission, package, or publisher account, please open a support ticket. 1. Content Restrictions1.1 General1.1.a Content submitted is professionally designed, constructed, and suitable for use in a professional development pipeline. The marketing presentation, visual quality of the content, and functional quality of the content are also subject to review. 1.1.b Submissions made with AI-aided generation tools have significant value and usability in a professional development pipeline. Submissions might be rejected if they contain anatomical errors that reduce the usability of the asset, resemble third-party and/or copyrighted work, plagiarize the art products of other Asset Store publishers, or do not provide significant value to customers. Content generated with the aid of AI, completely or in part, must transparently disclose this information in the marketing data. The specific AI tools used and the content generated using AI must be disclosed in the “AI description” field in plain terms, without marketing language, and describing all modifications made that adds value beyond the result of the generation. 1.1.c Packages do not throw any errors or warnings that originate from package content after setup is complete. Handled exceptions, or errors and warnings that have no effect on the usability of the package, or errors and warnings that are due to Unity engine bugs, are acceptable; such cases are transparently and completely disclosed in the package's marketing data and documentation, with explanations or workarounds explained where applicable. 1.1.d Assets with dependencies from the Unity Package Manager only include the necessary packages for the asset to work. Packages with unnecessary dependencies are rejected. Packages that depend on UPM packages, but do not include them, list the dependencies in the package description and documentation. 1.1.e Your product’s title, description, keywords, folders, scripts, and documentation do not contain an excessive amount of spelling or grammar mistakes. Text is readable and reasonably understandable. 1.1.f Submissions are not more than 6GB in size. 1.1.g Submissions to the 3D, 2D, VFX, Animation, and Template categories include demo scenes that showcase the package's content. Tool submissions that manipulate external assets (for example audio files, texture files, mesh files) include sample assets for demonstration. These assets can be incorporated into submitted products for demonstration purposes. 1.1.h Packages are rejected if they include potentially non-secure content, such as proxy servers, handling of sensitive or identifying information, unsafe code, or other areas of an asset where safety cannot be reasonably guaranteed. 1.1.i Publication on the Asset Store is not guaranteed and is contingent on the Asset Store Content Operations team’s approval of each asset, in Unity’s sole discretion. 1.1.j The display of the Asset must not impact the integrity of Unity servers (i.e., Unity's end users are unable to access such Asset or otherwise experience difficulty), Unity may demand that Provider fixes the Asset. 1.2 Legal 1.2.a Your submission includes a Third-Party Notices text file listing fonts, audio, and other third-party components with dependent licenses. You are responsible for ensuring that dependent licenses are compatible with the Asset Store EULA and include a license file detailing the component that it is covering. The product description on the Asset Store also contains a notice stating the third party licensing included in the package. For example:"Asset uses [name of component] under [name of license]; see Third-Party Notices.txt file in package for details." 1.2.b Submissions do not contain dependent licenses that require a product to maintain open-sourced or limited usability in commercial products such as GLP, LGPL, or any Creative Commons/Apache 2.0 license that requires attribution.1.3 Versions of Unity1.3.a New assets use Unity version 2021.3 or newer versions. Already published assets receive updates starting with Unity version 2020.3 or newer versions. All versions of Unity Editor can be found in Unity download archive. 1.3.b If you are unable to make your package compatible across Unity versions, you can upload your package using multiple versions of Unity. Alternatively, you can provide reasoning why an asset is not compatible with a specific version of Unity within the description text. For example:“Due to a bug in Unity 2021.3.0f1, [this asset or aspect of the asset] will not work.”1.4 Restrictive Content and Lite products1.4.a Submissions do not include any functionality that restricts users from using content or features to their full extent, including digital rights management (DRM), time restrictions, registration, or paying extra costs (such as subscription-based payments). First-party API based solutions may use the Publisher’s Invoice API to authorize users, and may have functionally necessary or third-party limitations (e.g. API throttling), all of which must be transparently disclosed in the description and documentation of the package. 1.4.b Packages do not include watermarks or otherwise obstruct the use of the product. 1.4.c Submissions do not have any artificial limits implemented on functionality or usability. You can provide a "lite" (smaller/cheaper/indie/free) version of your package with fewer features compared with the full product, provided that each included feature has identical functionality to your main product.1.5 Applications and Services1.5.a Until further notice, the Asset Store is not accepting any submissions that include executables (for example, .exe, .apk, or other executables), embedded inside the package or as separate dependencies located in other websites.1.5.b Packages that include functionality using third-party APIs clearly describe how the API keys are stored within the package. Third-party API keys are not stored in ways that would incorporate the key into project builds (for example, inside any script or GameObject that would be included in a scene).1.5.c Packages that interact with third-party APIs must have Terms of API usage and additional costs, if applicable, clearly and transparently portrayed at the top of the listing’s description and in the documentation.1.5.d If you are an online service such as a monetization service, ad-network, back-end hosting service, analytics system, decentralization solution (including Web3 technology), or other service where a variable amount of money changes hands after the user downloads your SDK or plugin, consider joining our Verified Solutions program here. 2. Product Specifications2.1 Organization2.1.a Packages are nested under one "root" folder. Exceptions include assets in the folders outlined in the Special Folders and Script Compilation Order documentation (for example, "Gizmos" or "Editor Default Resources").2.1.b Assets are sorted into appropriate folders. Folders are named depending on the type of assets they contain (for example, “Mesh”, “Script”, or “Material”). Packages do not have a large range of file types included under a singular folder, or a range of the same file types in unrelated folders. Package content is sorted by type (all meshes in one "Mesh" folder, all materials in one "Materials" folder, and so on) or by relationship (a folder called "Creature" containing meshes, materials, textures that apply to the Creature character, and so on) Pictured: Two examples of organized and properly named folders.2.1.c Packages do not contain any duplicate, unusable, or redundant files. 2.1.d Content is not included in any folder named "AssetStoreTools" or any variation of that name, because that folder is automatically removed when your content is uploaded. 2.1.e File names are not excessively lengthened. File paths for assets are under 140 characters. 2.1.f Multiple submissions by one publisher containing largely identical content to already published packages are rejected. Updates to published submissions are not contained in separate package drafts, unless a Major Upgrade system is set up. Packages that have similar content, but are aimed at different render pipelines, are exempt from this rule. 2.1.g Package bundles contain the entirety of the marketed content, or the Lite Edition system of Upgrades is set up for each published package that the bundle contains. For more information on how bundles are constructed, please visit this page.(Access to the publisher forum required: access is available via a survey form received in the acceptance email when your first asset is published) 2.1.h Resubmitting previously rejected content without modification as an attempt to circumvent the vetting process is not allowed and might warrant publisher account termination. This applies to resubmissions via the same draft, as well as resubmissions of the same content in different drafts.2.2 Compressed Files2.2.a Submissions do not contain .unitypackage or archive files that obscure the majority of the content. Exceptions are made for .unitypackage files that include setup preferences, settings, supplemental files for other Asset Store products, or alternative render pipeline content. 2.2.b .zip files are acceptable if they are compressing files that do not natively function in the Unity Editor (for example, Blender, HTML Documentation, or Visual Studio Projects.) Such files include "source" in the file name (for example, "Blender_source", "PSDSource", etc.)2.3 Documentation2.3.a Documentation is required if your package includes code or shaders (See also - 2.3.d), has configuration options, or requires setup. Local (offline) documentation must either be comprehensive and complete; or include setup instructions and link to online documentation. 2.3.b Documentation files use .txt, .md, .pdf, .html, or .rtf. file types. 2.3.c Video documentation or tutorials are not included in your package, but may be hosted on online services (e.g. YouTube, Vimeo).2.4 Art 2.4.a Mesh assets are either .fbx, .dae, .abc, or .obj file types. 2.4.b All visible meshes have a paired set of textures and/or materials assigned to them. A corresponding prefab is also set up with variations of textures/meshes/materials. 2.4.c Large environments and models with many distinct geometries are broken up and put into individual containers (E.g. .fbx). 2.4.d Prefabs have their position/rotation set to 0, and their scale set to 1. Meshes have their positive Z axis facing forward. 2.4.e Meshes are at a 1 unit : 1 meter scale. 2.4.f All meshes have a local pivot point positioned at the bottom center of the GameObject, in the same corner of any modular objects, or where the object would logically pivot/rotate/animate. 2.4.g Before submission, photoscanned or AI generated data is retopologized and optimized to a state that users can edit if needed. 2.4.h Assets do not have an unreasonably excessive mesh density or topology that can inhibit mesh deformation quality. 2.4.i Models marked as "Static" have colliders assigned to them. Colliders fit the model's size. 2.4.j Models with level of detail (LOD) meshes have prefabs that contain an LOD Group component with all the LOD meshes set up. 2.4.k Rigged 3D models have anatomically accurate or otherwise reasonable and smooth weight painting. 2.4.l Models or images do not contain genitalia.2.4.1 Animations2.4.1.a Character models are weighted to an accompanying rig. The rig is either set up with Unity’s Mecanim system or includes your own animations. 2.4.1.b When set to animations, rigs do not show any obvious creases or unusual deformations. 2.4.1.c Bipedal (humanoid) characters are correctly mapped with Unity’s default “Humanoid” rig or include their own generic animations, provided that this is transparently disclosed in the marketing data. 2.4.1.d Animations are sliced prior to submission so that submissions do not contain a single, long animation clip. 2.4.1.e Each animation clip has a unique name. 2.4.1.f Submissions do not include unprocessed, unsliced, or reasonably unusable animations developed from motion capture (mocap) data. 2.4.1.g Animations have fluid movement without any jarring transitions. 2.4.1.h Animation asset submissions have a video demonstration in their marketing material, showcasing the included animations.2.4.2 Sprites and Particles2.4.2.a Sprite sheets are imported with the “Sprite” import settings, correctly sliced and named. 2.4.2.b Sprite animations are spliced, named, and set up as proper clips. 2.4.2.c Particle systems are saved as prefabs.2.4.3 Textures, Materials and GUI Packs2.4.3.a Image files are in a lossless compression format such as .png, .tga, .psb or .psd. Exceptions are assets in the Tools, Add-Ons, and Audio categories. 2.4.3.b Packages using physically based rendering (PBR) include at least one texture map (as a separate or packed map) from the following list: albedo, normal, metallic (or specular), or smoothness (or roughness). 2.4.3.c Tileable textures tile without any seams or obvious edges. 2.4.3.d Textures and materials are optimized and usable. 2.4.3.e Maps with an alpha channel are paired with a shader that can read that channel. Materials are paired with a shader that su'''
