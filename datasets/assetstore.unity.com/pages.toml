["https://assetstore.unity.com/publishing/release-updates"]
title = "The Best Assets for Game Making | Unity Asset Store"
description = "Discover the best assets for game making. Choose from our massive catalog of 2D, 3D models, SDKs, templates, and tools to speed up your game development process."
full_description = '''Over 13,000 top-rated assetsRated by 85,000+ customersSupported by 100,000+ forum membersEvery asset moderated by UnityPublisher updatesUpdates to Unity Asset Store Submission GuidelinesJune 30, 2023Versions of UnityThe lowest Unity version required for new assets and updates has been updated. New assets must use Unity version 2021.3 LTS or newer. Already published assets can still receive updates from Unity version 2019.4 or newer.AI-Generated ContentAs new generative AI tools are quickly being developed and introduced to the public, we have added new guidelines for AI-generated content. Submissions made with AI-aided generation tools must bring value to users and not resemble any copyrighted work.Content generated with the aid of AI, completely or in part, must mention this information in the marketing data. (This includes the use of AI in code and other non-art use cases)Art ContentSome small updates to the Art Content section to add some leeway. For textures, the .psb format has been officially added to the list of acceptable image file types. For 3D models and animation, humanoid characters can now have their own generic animations instead of solely having to be mapped to Unity's "Humanoid" rig.AudioChanged requirement for audio tracks to not exceed -0.3 dB on peak meters. This means your tracks cannot exceed -0.3 dB, or they will be rejected.Compressed filesRemoved .rar files from the acceptable archive types listAdded a requirement to have "source" in the titles of .zip filesDownload your own packagesDecember 7, 2022As of now, you can download your own packages on the new Publisher Portal. The feature is currently available only for packages in the Draft status. To download packages from a published, rejected or deprecated asset, you would need to create a new draft of this asset first.User managementSeptember 23, 2022The ability to add and remove users to/from a publisher organisation has been made available on the new publisher portal.Asset Store Tools updateJuly 20, 2022The Verified Solutions QA team has used some of its engineering resources to make another big update to Asset Store Tools!FeaturesAdded Feedback windowAdded category, size, and last modified date next to the packageAdded a link to the publishing portal next to the packageNew uploading flow - “Pre-exported .unitypackage”Special Folders can now be selected and uploaded together with the package’s main folder (i.e. StreamingAssets, Plugins)You can now upload to multiple packages at the same time without waiting for the first one to finishPackage can now be validated in the Uploading window by pressing the “Validate” button(Experimental) Custom exporter - will export your package ~2 times faster, but may miss some asset previews in the final product. To enable it - click three dots on the top right side of the window and enable “Use Custom Exporting” Improvements and ChangesAll brand new code to simplify the maintenance and modularityUpdated package validation tool with easier to understand descriptions, new tests and new UI. (This tool will scan your package for potential reasons for rejection and provide feedback)Brand new UX with multiple upload workflowsLogin window: Improved layout with ability to login through Unity Cloud ServicesLogin window: Errors are now more elaborate and user-friendlyUpload window: New Tooltips are now added to each upload process stepUI has been reworked using UI ToolkitImproved top bar, including search and sortingDraft packages moved to the topAdded refresh and logout buttons to the bottom toolbar for easier accessPackages caching: package information will no longer be redownloaded every time you open the Uploader window during the same Editor session FixesPrevious uploading flow (folder selection) has been renamed to “From Assets Folder”Dependencies check has been renamed to “Include Package Manifest” for clarity FAQWill my old downloaded version of the tools still work?— The older "Asset Store Tools" will continue to function after this update is released (If you are feeling nostalgic). We understand that some of you already have specific processes set up when uploading and we do not wish to cause interruptions with your current flow.Is there a way to download the older version of the tools?— We will not be supporting an official way to retrieve the older versions of the tools, but if we find the update is disruptive to publishers work, then we will consider reverting to the previous version ASAP.Accepted Unity versionsJuly 20, 2022As the Unity Editor keeps evolving, we have updated the lowest Unity version required for new packages and updates. New assets must use Unity version 2020.3 LTS or newer. Assets which are already published should use Unity version 2019.4 or newer. Publishers may want to consider removing package uploads from previous versions, as our editor version usage data indicates that fewer than 4% of our users are using 2018.x or previous versions.Updates to Unity Asset Store Submission GuidelinesJuly 20, 2022Content RestrictionsGeneral1.1.b: Added a guideline for AI-aided and generated content1.1.j: Added requirement for demo scenes and assets for art and content-manipulating toolsLegalRephrased guidelines to cover all legal documentation, including Copyright Policy, Trademark Guidelines, EULA, and Asset Store Provider Agreement1.2.i: Added restrictions for non-fungible token (NFT) content1.2.j: Added restrictions for offensive contentVersions of Unity1.3.a: Updated the lowest Unity version required for new packages and package updatesRestrictive Content and Lite products1.4.a: Added API throttling as an exception to the guidelineProduct ContentContent Organization2.1.b: Specified another file organization system as appropriate for submissions2.1.f: Added a guideline specifying that content that is largely identical to an already submitted package will not be acceptedCompressed Files2.2.a: Clarified that archive files must not obscure all or most of the package contentArt Content2.4.a: Added the .dae format to the list of acceptable model file types2.4.c: Added requirement for models with many distinct geometries to be split into individual meshes2.4.h: Added requirement for meshes to have topology that does not inhibit mesh deformation quality (for organic models only)2.4.j: Added a guideline for models with LOD meshes2.4.1.c: Specified that bipedal animations are humanoid animations2.4.1.d: Specified that non-bipedal animations are generic animations2.4.3.b: Added permission to include packed texture mapsScripts2.5.1.c: Specified which purposes are acceptable for unique windowsAudio2.7.b: Clarified that audio files must be clear and audible2.7.c: Changed the .wav format requirement to be for Audio and Templates categories only; permission to use .mp3 or .ogg files in Tools or Add-ons categories added2.7.d: Added guideline about SFX audio being free of background noisesProduct Marketing3.1.b: Added render pipelines as a necessary metadata detail3.1.c: Added distinction between the older and newer Publisher Portals3.1.f: Added permission for the Upgrade system3.2.a: Added clarification and visual examples of acceptable features of key images; clarified language about key images3.2.b: Added examples of sale-related graphicsPublisher Guide4.1.a: Added clarification about restrictions for publisher profilesClarified language about personal sales Removed guidelinesTesting packages on the latest version of the EditorBeta Editor version restrictionsIncremental naming standards for asset filesRequirement to have a support email in the documentationBasic setup instructions for server-based plug-insRestriction on containing animations in prefabs for unique charactersRestriction on the count of materials that can be assigned to modelsNote about Project Setting inclusion in Complete Projects or Templates categoriesAudio file normalizationRequirement for title uniqueness (now handled in the Publisher Portal)Requirements for publisher profile informationInvoice verificationNovember 4, 2021On the Publisher portal, you can check if a user has officially acquired your asset on the Asset Store. Ask a user to provide the invoice number, order ID or product code they receive upon asset acquisition, go to the Invoices panel and verify the purchase.Curation status indicationOctober 28, 2021Curation status indicates the expected waiting time / position in the queue for the packages that are being curated (1) and gives feedback for rejected packages (2). A lightning icon next to a pending package (3) means this package was set to auto-publish mode upon submission and will be published automatically once accepted. The packages that were not set to be auto-published require manual publishing.A detailed explanation of rejection reasons (4) is available on the individual package page.Review managementAugust 26, 2021The updated review management panel is made available on the new publisher portal. It enables publishers to Organise reviews by utilising a set of filters Search for specific reviews with keywordsRespond to reviews from the publisher portalBrowse review history The review history feature appends timestamps to all original, edited and deleted reviews and replies, so that publishers can keep track on their communication with customers.Accepted Unity versionsAugust 12, 2021Asset submissions on Publisher Portal are now following Unity Editor LTS cycles to ensure consistent user support and adoption of new technology.New assets need to be uploaded from Unity version 2019.4 LTS or higher.Existing assets can remain on the store as they are.Updates must be uploaded from Unity version 2018.4 or higher. This means that updates to assets will not be accepted from Unity 2018.3 and older Editor versions.Check Unity Forum post* for more information and discussion. * You can request access to the private Asset Store Publisher Forum by submitting this form.Analytics presetsAugust 6, 2021The assets in the Analytics panel can now be grouped and saved as presets for quick access.To create a preset, (1) open the Assets filter, (2) select several assets, (3) click Create preset, (4) give your preset a name and (5) save it. Next time you need to access the stats for this group of assets only, (6) select your preset, make sure to (7) unselect All assets and (8) click Apply.To remove or add items to a preset, (9) expand the list of assets under your preset and (10) click Edit. Make changes to your preset and (11) confirm by clicking Save.﻿Business analyticsJune 17, 2021﻿New featureThe first release of the publisher analytics tracks and reports sales and user behaviour data. The available report helps you better understand the performance of your assets and make informed business decisions. Learn moreImprovementsAdded media query for extra large viewports to better fit data tables on the screenAdded system response to guide users who attempt to edit published/pending/disabled/deprecated/rejected packagesLaunch discount, improvements and bug fixesApril 19, 2021﻿New featureLaunch discount is introduced as part of the asset submission workflow. This self-service feature allows publishers to apply a discount to new asset packages at launch. Discounts can be applied to any new asset priced $15 or more when it is first published. Publishers get to decide the discount amount (10%, 30%, or 50%) and duration (one or two weeks) themselves.ImprovementsIncreased the All packages page speed by adding paginationEnabled auto-saving for SRP compatibility inputs Added failed package upload indicatorFormatted all timestamps as UTC Bug fixesFixed an issue where the changelog breaks upon creation of a new draft from an existing package. Now, a new draft package contains last release notes.Bug fixesMarch 12, 2021Fixed email link behaviour in rich text fieldsFixed cover media issue: a video placed in the first slot of the product page gallery replaces a cover image when published on the storefront. If you still experience the issue, update the package and re-publish your asset.Fixed formatting issue: Change log bullet points show up in Preview now Improved responsive experienceMarch 2, 2021In this update, we’ve optimized the mobile experience and fixed accessibility and responsive behavior issues. Publishers can now access and edit package information along with profile settings on mobile devices.ImprovementsAdded responsive breakpoints to fit layout to any screen widthAdjusted font size and contrast ratio of the text hints for better accessibilityImproved filters visibility in All packages viewMiscellaneous UI fixesBug fixesFixed issues on Preview mismatching with descriptions when updating a draft package Aligned the default template for Technical details with selected asset categoryA few users experienced missing metadata when switching from old portal to beta version, it was caused by an undisplayed error message which should have reminded the user the content is not saved, this is now fixed.Publisher Portal 2.0 Beta release February 1, 2021The public beta release of Publisher Portal 2.0 is available as of February 1, 2021. We will continue to add features over time as we evolve the portal's design and functionality. This first release includes package creation, management and submission functionality, updated localization capability and an improved experience for first-time users.Package creation and managementUpdated the list of package categories according to the storefront category structureAdded Compatibility info text field to specify important information about Unity version or URP/HDRP compatibilityAdded Summary and Technical details text fields to match the updates on the product pageEnabled rich text formatting in product description fieldsEnabled AI-driven keyword suggestionsAdded image cropper for key images Package submission and vettingIntroduced the communication of next steps and a timeline after submission of the draftAdded statuses and estimated position in the vetting queue for pending packagesAdded rejection reasonsFirst time user experienceModified publisher profile creation flowEnabled mobile view for Profile page'''
