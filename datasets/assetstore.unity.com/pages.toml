full_description = "“I launched Gaia on the Asset Store in 2015, and the response has gone beyond my wildest dreams. I’ve traveled the world to interact and collaborate with our amazing community. Unity has been incredibly supportive over the years, and is well-positioned as a creation platform for the future. I genuinely love what I do and would do it again in a heartbeat.”Procedural Worlds “Unity has made my dream job come to life. I wake up each day feeling blessed to be in the position to do what I love, and to share that with others by selling my assets on the Unity Asset Store. It’s great to get such inspiring feedback from developers of all levels; to see how I’ve become part of their own dreams by empowering them to do what they love.”3DForge “We initially published on the Asset Store for some side revenue, but had no idea that it would turn into what it has! The Asset Store has given us so many opportunities that we otherwise would not have had. We've been able to meet some really amazing people, work from anywhere in the world, and see our tools be used in many outstanding projects.”Opsive"
