["https://www.asterisk.org/asterisk-news/asterisk-22-2-0-now-available"]
title = "Asterisk 22.2.0 Now Available ⋆ Asterisk"
description = "The Asterisk Development Team would like to announce the release of asterisk-22.2.0. The release artifacts are available for immediate download at"
full_description = "The release artifacts are available for immediate download at https://github.com/asterisk/asterisk/releases/tag/22.2.0 and https://downloads.asterisk.org/pub/telephony/asterisk This release resolves issues reported by the community and would have not been possible without your participation. Users can now redial the last number called if the lastnumredial setting is set to yes. Resolves: #437 Bundled pjproject has been upgraded to 2.15.1. For more information visit pjproject Github page: https://github.com/pjsip/pjproject/releases/tag/2.15.1 The pjsip.conf AOR section now has a “qualify_2xx_only” option that can be set so that only 2XX responses to OPTIONS requests used to qualify a contact will mark the contact as available. use the p option of AddQueueMember() for paused member state. Optionally, use the r(reason) option to specify a custom reason for the pause. The current processed call count is now returned as CoreProcessedCalls from the CoreStatus AMI Action. The following new configuration options are now available in the res_curl.conf file, and the CURL() function: ‘ssl_verifyhost’ (CURLOPT_SSL_VERIFYHOST), ‘ssl_cainfo’ (CURLOPT_CAINFO), ‘ssl_capath’ (CURLOPT_CAPATH), ‘ssl_cert’ (CURLOPT_SSLCERT), ‘ssl_certtype’ (CURLOPT_SSLCERTTYPE), ‘ssl_key’ (CURLOPT_SSLKEY), ‘ssl_keytype’, (CURLOPT_SSLKEYTYPE) and ‘ssl_keypasswd’ (CURLOPT_KEYPASSWD). See the libcurl documentation for more details. You can now set the “unknown_tn_attest_level” option in the attestation and/or profile objects in stir_shaken.conf to enable sending Identity headers for callerid TNs not explicitly configured. Two commits in this release… ‘Add SHA-256 and SHA-512-256 as authentication digest algorithms’ ‘res_pjsip: Add new AOR option “qualify_2xx_only”‘ …have modified alembic scripts for the following database tables: ps_aors, ps_contacts, ps_auths, ps_globals. If you don’t use the scripts to update your database, reads from those tables will succeeed but inserts into the ps_contacts table by res_pjsip_registrar will fail."
year_published = 2025
clearnet = "https://www.asterisk.org/asterisk-news/asterisk-22-2-0-now-available"
