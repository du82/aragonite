title = "Astricon - Workshop"
description = "Open source convention celebrating open source projects featuring Asterisk and FreePBX. Consisting of multiple tracks, sessions, and EXPO hall, AstriCon offers various levels of education sessions and provides attendees networking opportunities with some of the best in the open source community."
full_description = '''Welcome to AstriCon, the annual event for developers, enterprises, and service providers that have built (or plan to build) solutions based on the popular Asterisk open source software. This conference is your gateway to invaluable insights and connections in the VoiP world, including innovators from the Asterisk and FreePBX communities - Engaging Educational Sessions: Dive into a rich lineup of diverse sessions led by top experts from the open-source community. Learn from the best and expand your knowledge on the latest in Asterisk and FreePBX development. - Networking Opportunities: Connect with fellow developers, enterprises, and service providers. Participate in our famous "hallway conversations" where you can share experiences and discuss all things Asterisk & FreePBX. - Exclusive Demos: Experience exciting demonstrations that showcase the latest innovations and applications built on Asterisk or FreePBX. - Training Workshops: New to Asterisk or FreePBX? Gain valuable hands-on experience by participating in our pre-event basic training sessions led by industry experts. Upgrade your MSP portfolio by learning some new steps towards becoming a Voice Service Provider. - Dedicated Space at ITEXPO #TECHSUPERSHOW: AstriCon will take place in a dedicated section of the Broward County Convention Center, allowing you to focus on Asterisk while also engaging with other participants at the #TECHSUPERSHOW. Catch up on past AstriCon events! Explore recorded event sessions on our official Asterisk YouTube channel. Some highlights include: Join us in 2026 for an unforgettable experience that blends learning and networking in the vibrant world of open source communications. Secure your spot today and be part of the growth of the Asterisk and FreePBX communities. We can't wait to see you there! CYBER WEEK SPECIAL: Get a $100 Amazon Gift Card* when you purchase a Diamond Pass, Super Pass, Enterprise Pass or Platinum Pass. Expires Friday, December 1. *Standard cancellation policies apply.'''
