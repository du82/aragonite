["https://www.asterisk.org/community"]
title = "Community ⋆ Asterisk"
description = "The Asterisk Community Asterisk is the product of over twenty-five years of work by a community of thousands worldwide. The Asterisk Community is made up"
full_description = "Asterisk is the product of over twenty-five years of work by a community of thousands worldwide. The Asterisk Community is made up of more than 86,000 registered users, developers and advocates who have contributed their time and effort to make Asterisk the world’s most widely adopted open source communications project. Want to contribute to the project? Learn the basics of Asterisk development, along with best practices and guidelines for coding, and get access to project resources for both the new and experienced Asterisk developer. Need to have an in-depth developer discussion or generally talk about development? Joining the Asterisk developer mailing list is an easy way to engage with some Asterisk developers. Connect live and in person at the annual AstriCon user conference and expo. Take advantage of three days of expert sessions on a variety of topics, including VoIP, call center applications, IP phones, SIP services, cloud solutions, and more. A home for the community’s commercial products and applications built on or integrated wth Asterisk. Online marketplace listings include software, hardware and complete business communication solutions."
