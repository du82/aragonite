["https://astro.build/partnerships"]
title = "Partner with Astro | Astro"
description = "Want to partner with Astro?"
full_description = "Let’s improve the web, together! Sponsors and official partners The easiest way to partner with Astro is to become a sponsor! Your financial contributions support the open-source project’s ongoing maintenance and developent. We recognize some levels of sponsorship with a logo and/or link on Astro sites such as our homepage, GitHub README, and docs website. To sponsor: visit Open Collective or GitHub Sponsors and choose from a list of contribution tiers. Thank you for supporting Astro! If you don’t see your desired level of sponsorship listed, please contact us at partner@astro.build! We are always happy to work directly with larger sponsors ($2000+ per month) to create a custom sponsorship package. There are also limited options for being an exclusive “official” partner for a particular category ($10,000+ per month). Current official sponsors include: Official Deployment Partner: Netlify Official App Monitoring Partner: Sentry Official Online Editor Partner: Google Project IDX About Astro 📦 1.6M monthly downloads NPM downloads 🌐 80k X/Twitter Followers @astrodotbuild ⭐ 49k GitHub Stars withastro/astro 🏆 #1 in developer retention State of JS 2024 💜 #1 in developer interest State of JS 2024 📈 3x growth in usage State of JS 2024 Other ways to partner with Astro Astro maintains relationships with companies, content creators, and other open-source projects. Reach out to partner@astro.build to explore activities such as: Co-marketing Building or funding feature development Providing a technical case study Inviting us on podcasts or live streams Creating video content Submitting third-party guides to our docs site Co-marketing We can partner to amplify each others’ message, content, or resources to the benefit of both of our communities. If you create or build something with or featuring Astro, we’re happy to share it! This could take the form of a social media post or boost, a blog post announcing our joint feature, or placement in our newsletter. For larger coordinated efforts, reach out to us to discuss a potential partnership with a financial arrangement. To co-market: email partner@astro.build a brief summary of what you want us to amplify, where you want us to amplify it, and how it helps Astro users. Development Astro stays lightweight, environmentally friendly, and blazingly fast thanks to a focused set of core features with minimal dependencies. That’s why Astro’s integration ecosystem is so powerful! Astro integrations extend basic functionality on an opt-in basis. Creating an Astro integration for your product or service is a great way to make it easy for people to use you in their Astro project, and grows the entire ecosystem! Don’t have the time or expertise to build an Astro integration for your company or product? You can partner with us to directly fund development of an integration. This allows Astro to prioritize the functionality you need, and create a plug-and-play way for Astro projects to use your service. Is Astro missing a core feature that would allow you to use or migrate to it? As an open-source project, we welcome community contributors! Check out our public roadmap and submit a proposal for missing features that you’d like to see added. If accepted, you are welcome to build it yourself with support and oversight of a core maintainer. We also work with partners who are able to fund the development of these core features, so get in touch! To directly fund feature development: email partner@astro.build with a brief summary of who you are, and the feature or integration you need. Technical case studies We’d love to interview companies that have used Astro for a unique or complex use-case in production. Case studies inspire confidence in using Astro and showcase your organization as an Astro adopter. To book an interview: email partner@astro.build with a description of your project. Podcasts and live streams Let’s get together to talk about Astro or a related topic! We can help coordinate booking different members of the core team as guests for your show. To book: email partner@astro.build with the name of your show or channel and available recording times. Video content Have an idea for compelling Astro content? Reach out and let us know how we can be involved! To record: email partner@astro.build with your idea, timeline, and resources. Third-party guides Astro is proud of its commitment to documentation, and developers love our docs! Developers rely heavily on high quality documentation and written resources when they build for the web. When they don’t get it, they move on and choose something else. Astro accepts third-party guides for installing, configuring, and integrating services with Astro (e.g. content management systems, deploy hosts, storage solutions etc.) on a case-by-case basis. If accepted, our docs team will work with you to ensure a high quality, polished product up to the standard of our own documentation. These guides let Astro users know that your product or service can be used with Astro, and shows them exactly how to get started! Please be advised that these documents can require extensive writing, testing, and editing to produce content that meets our documentation standards. Therefore, we may not always have the available resources to review and accept submissions. To help us include yours, you can directly fund our docs team to work with you on guides about using your product or service with Astro. To propose a guide or fund additional docs work: email partner@astro.build with your service, timeline, and resources."
year_published = 2025
