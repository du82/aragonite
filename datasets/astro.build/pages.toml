title = "What’s new in Astro - September 2024 | Astro"
description = "September 2024 - Beta 5.0, Astro Storefront, $100,000 Ecosystem Fund update, and more!"
full_description = '''Some exciting news from around the Astro ecosystem this month. Let’s dive in! Updates from Mission Control 🤿 Content Layer API deep dive 🛍 Astro Storefront 🌟 Swagger docs now built with Astro & Starlight Releases Astro 5.0 beta Starlight 0.27, 0.28, and highlights of the last few major releases Community Astro wouldn’t be what it is without its community. From Discord support, to documentation improvements, to translations, to code contributions, Astro welcomes it all. Community Awards August These are some of the people who went above and beyond last month to make all our lives just a little (or a lot!) better: 🌟 $500 to @Fryuni for amazing contributions to all corners of the Astro ecosystem. 🚀 $250 to @ph1p for valuable contributions to Astro’s core packages. 🎈 $250 to @dragomano for fantastic contributions to Starlight translations. 🎊 $250 to @ArmandPhilippot for outstanding contributions to docs. 🧁 $250 to @Nin3lee for exceptional effort translating docs. Check them out and learn more about the Astro Community Awards on our community website. $100,000 Astro Ecosystem Fund Fall Update Congratulations to the latest recipients of Astro’s ecosystem grants! Check out these projects that have made a huge impact: 🖌 @hippotastic ($10,000) for work on the Expressive Code advanced syntax highlighter that powers many Astro websites, and is built-in to Starlight by default! 👜 @martrapp ($5,000) for work on VTBOT (View Transitions Bag of Tricks) exploring the bleeding edge of view transitions in Astro and the larger web platform, with pre-built components you can use, examples, demos and more! Read the full Ecosystem Fund fall upate for more details. Showcase Content Here’s what caught our attention this month: 📶 A growing list of content collections loaders on GitHub for you to try! ⚡ We had some SSRious fun with Docs on Demand, a demo site of server-rendered Starlight docs showcasing auth, personalized content, and more! (Which Houston did you pick??)