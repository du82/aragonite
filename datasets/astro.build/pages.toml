["https://astro.build/blog/future-of-astro-zero-js-view-transitions"]
title = "Zero-JavaScript View Transitions | Astro"
description = "Part one of our series on The Future of Astro. Browser-native page transitions are now possible with zero JavaScript required."
full_description = 'This is Part 1 of our series on “The Future of Astro” covering three major new features we have planned for Astro in 2024. This post introduces an update to the View Transitions API that Astro can now leverage for native, app-like page navigation without a single line of JavaScript required. The View Transitions API is a set of new platform APIs that unlock native browser transitions between pages. Historically this has only been possible in JavaScript-heavy Single Page Applications (SPAs), but recent advances are now bringing native page transitions to the web platform. Astro users have had early access to view transitions since Astro 2.9. Due to initial limitations in the browser, our early support worked by injecting a JavaScript router onto the page to manage the animations for you. This was never meant as a long-term solution, but it successfully created an early playground for our users to explore: Sorry, your browser doesn’t support embedded videos.Watch Joe Bell demo view transitions.Sorry, your browser doesn’t support embedded videos.Try out this live demo by Maxi Ferreira. Our bet was that the major web browsers would continue to improve and one day we could remove our JavaScript router shim entirely. One day, when a user clicked a link, that click could trigger a transition animation in the browser as part of its normal flow from page to page. I’m excited to announce that that day has finally arrived. Chrome 126 (released last week) and Microsoft Edge 126 (releasing this week) both support “cross-document view transitions” unlocking zero-JavaScript view transitions in Astro. Demo Both Chrome and Edge rollout new browser versions gradually, so check that you are on version 126 before running the demo. In Chrome, you can see your current version at chrome://settings/help. If an upgrade isn’t available yet for your browser, check back later or use a Beta or Canary release channel instead. Open the astro-zerojs-transitions.vercel.app demo to experience zero-JavaScript view transitions in your browser. You can explore your browser’s Network Panel to verify that every link click triggers a full page load, and zero JavaScript is being sent to the browser. If your browser supports it, the demo should look like this: Sorry, your browser doesn’t support embedded videos.Spotify clone built with Astro View Transitions If your browser does not support the latest cross-domain view transitions, then your website will still run and display content as expected. However, the animations will be disabled and page navigation will behave like any other navigation in your browser (without animation). Enable Zero-JavaScript View Transitions To take advantage of the native new View Transition API, it’s as simple as adding the @view-transition at-rule to your website. Here’s all the CSS you need: <style> @view-transition { navigation: auto; /* enabled! */ }</style> Note: The built-in CSS syntax highlighter in some code editors (ex: VSCode) may struggle to parse the newer @view-transition at-rule syntax. You can add a comment like /* enabled! */ to your CSS as a short-term fix for your highlighter. To enable cross-document view transitions, both “ends” of the transition must include this rule. A shared page layout component can be a good place to add this to your codebase. Upgrade an Existing Project If you were already using Astro View Transitions powered by our <ViewTransitions /> component, then it is now safe to remove that component and replace it with the at-rule. This will remove the injected backwards-compatible JavaScript router from your page, reducing the overall complexity of your client-side code. --- import { ViewTransitions } from "astro:transitions";---<head> <ViewTransitions fallback="none" /> <style> @view-transition { navigation: auto; } <style></head> If you would still like your view transitions to run in older browsers, you are welcome to keep using our backwards-compatible <ViewTransitions /> component instead. You can migrate whenever you are ready. We have no plans to remove support for the <ViewTransitions /> component at this time. What about transition:persist? Persistent element transitions became a popular feature in Astro. The transition:persist directive told Astro to persist an element across navigation without interrupting or disrupting its state. This enabled UI like audio and video players to continue to play across pages, like in Maxi Ferreira’s music player demo. Unfortunately, this feature is not yet supported by native cross-document navigation in the browser. Native support for persistent audio and video players may be coming in the future, but in the meantime you can continue to use our <ViewTransitions /> component if you need this additional functionality. The Future of Astro Using links to navigate is a foundational behavior of the web. We believe this is one of the most significant advancements to come out of Chromium and the browser spec process in recent memory. We are excited to continue partnering with Google Chrome and other browser vendors as they roll out this new API. Developers can take advantage of native view transitions today or wait as it rolls out to more users. Whenever you’re ready to enable (or migrate) it’s essentially a one-line change of CSS to do so. To get started, you can learn more about Astro View Transitions. We will be updating our documentation over the next few weeks to include using these new native browser APIs.'
