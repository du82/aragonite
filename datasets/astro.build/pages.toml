full_description = '''Use this template by running:npm create astro@latest -- --template SofiDevO/portfolio-sofidev-garrux Crafting Your PortfolioYour portfolio is your digital storefront, where potential clients and employers can get a glimpse of your skills and expertise. With the Portfolio Template, you can create a visually stunning showcase that leaves a lasting impression.Getting StartedTo begin crafting your portfolio, head over to /src/data/portfolioData.js. Here, you'll find a structured format to add details about each of your projects, including images, titles, descriptions, and relevant URLs.// Sample Portfolio Data Format export const portfolioData = [ { imgSrc: 'https://example.com/project1.png', title: 'Project 1', skills: ['React', 'StyledComponents'], description: 'A brief description of your project.', demoURL: '', repoURL: '', anim: 'fade-right', }, // Add more projects here ]; Adding Icons with IconifyEnhance your project listings with icons using Iconify. Simply specify the icon identifier in your data and include the Iconify script in your project.<!-- Example Icon Usage --> <iconify-icon icon="logos:react" width="27" height="27"></iconify-icon> Leveraging Modern TechnologiesBehind the scenes, the Portfolio Template makes use of cutting-edge technologies to deliver a seamless experience.Astro: A modern static site builder that optimizes for performance by shipping less JavaScript.React: A powerful JavaScript library for building user interfaces.Tailwind CSS: A utility-first CSS framework that enables rapid styling and customization.Styled Components: A popular library for styling React components with ease.Iconify: A comprehensive library for accessing thousands of icons from different collections.Bringing Your Design to LifeWith the Portfolio Template, you have the flexibility to customize every aspect of your portfolio to reflect your unique style and personality. Whether you're a designer, developer, or creative professional, this template provides the perfect canvas to showcase your work.Designing with FigmaTo help you get started, we've provided a Figma design link where you can explore and edit the visual elements of the template. Let your creativity run wild and make your portfolio truly stand out!Figma Design LinkConnect with UsWe're constantly improving and updating the Portfolio Template to meet the needs of our users. If you encounter any bugs or have suggestions for new features, we'd love to hear from you!Author and LicenseAuthor: SofiDev / GarruxLicense: MITGet InvolvedJoin the community on GitHub and contribute to the ongoing development of the Portfolio Template. Together, we can build something truly remarkable!GitHub RepositoryStart Building TodayReady to take your portfolio to the next level? Download the Portfolio Template and begin crafting your masterpiece. Whether you're a seasoned professional or just starting out, this template has everything you need to showcase your talent and expertise.Download Portfolio Template﻿SUPPORT ME on ko-fi 💜If this theme was useful for you, you can support my work by buying me a coffe 💜https://ko-fi.com/sofidev'''
