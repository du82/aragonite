title = "Stablo Blog Template | Astro"
description = "Stablo is a free and open-source blog template that is designed to be minimal and easy to use. It is built using Astro, Tailwind CSS, and MDX."
full_description = '''Stablo is a free and open-source blog template that is designed to be minimal and easy to use. It is built using Astro, Tailwind CSS, and MDX. With Stablo, you can launch a fully functional blog for your personal website or startup in just a few minutes. Some of the key features of Stablo include: Built with Astro, MDX and Tailwind CSS Stablo is built using Astro, MDX and Tailwind CSS. Together, these tools provide a solid foundation for building a sleek and functional blog template. Fully mobile responsive template Stablo is designed to be fully mobile responsive, meaning that it will automatically adjust its layout and design to look great on any device, whether it's a desktop computer, a laptop, a tablet, or a smartphone. This is important because it ensures that your blog will be accessible and easy to use for all of your visitors. Clean, modern, and minimal design Stablo has a clean, modern, and minimal design that is perfect for a blog. It has a simple and uncluttered layout that is easy to navigate and focused on the content. The template is also designed to be easy on the eyes, with a color palette that is pleasing to look at and easy to read. Configurable dark and light themes Stablo comes with both a dark & light theme along with System "Auto" which allows the template to automatically adapt its theme based on the system theme of the device it is being viewed on. About and Archive pages Stablo includes about and archive pages that you can use to provide more information about yourself or your blog, and to organize and categorize your content. Working Contact page Stablo comes with a working contact page that is powered by Web3Forms. This allows you to easily set up a contact form on your blog so that your readers can get in touch with you. The form is easy to use and can be customized to suit your needs. This template is sponsored by Web3Templates, so it is available to use for free. Links Learn More Documentation Twitter Astroship Pro Astroship Pro is a SAAS, Startup Astro Website Template and Landing Page built with Astro & Tailwind CSS. Web3Templates Paid'''
