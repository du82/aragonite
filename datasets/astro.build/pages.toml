["https://astro.build/blog/sentry-official-monitoring-partner"]
title = "Sentry: Our Official Monitoring Partner | Astro"
description = "Sentry is Astro's new official monitoring partner. To celebrate, we're featuring Spotlight, a rich debug overlay from Sentry."
full_description = "We are thrilled to announce Sentry as Astro’s new Official Monitoring Partner, which includes a new $5,000 monthly donation towards the ongoing open-source maintenance and development of Astro. Astro is the web framework for building content-driven websites including blogs, marketing, and e-commerce. When you go to deploy an Astro website, it’s a good idea to set up live monitoring for insights into performance issues and JavaScript errors that your users might encounter. That’s where Sentry comes in. David Cramer, Founder and CTO of Sentry, had this to say: Astro is one of the most promising technologies we’ve seen in the last few years, and we’re excited to be working more closely with the Astro community. With the launch of @sentry/astro, integration is now plug n’ play, and we’re thrilled to count Astro as a launch partner for Spotlight. — David Cramer, Founder and CTO The Astro core team has even relied on Sentry in the past to help find and fix difficult bugs in production. This console warning, for example, would only appear in very specific circumstances on mobile Safari once a user had scrolled for longer than 30 seconds. Apparently, this happens more often than you would think! Thanks to a Sentry user the warning was identified, reported, and fixed in Astro for the benefit of everyone. Introducing Spotlight: A Better Local Debugging Experience, Designed for Astro Astro 4.0 introduced the new Dev Toolbar — a new way to enhance and extend your local development experience with browser tooling. As part of this new partnership, we are excited to feature Spotlight as a launch-day app from Sentry. Sorry, your browser doesn’t support embedded videos. Spotlight brings a rich debug overlay into your Astro development environment. Spotlight shows errors, traces, and important context right in your browser during local development. To use Spotlight, run astro add in the terminal to add it to your project. Then, start up your Astro development environment and click the new “Spotlight” logo in your Dev Toolbar to open the new Spotlight app. npx astro add @sentry/astro @spotlightjs/astro Copied! Astro ❤️ Sentry Astro is honored and excited to have Sentry as our new official monitoring partner. We are grateful for the support of David Cramer and the entire Sentry team for their help and evangelism of open-source software. It’s because of support from companies like Sentry that we are able to receive ongoing maintenance and keep developing Astro in an open, financially sustainable way. You can learn more about how we use these funds by reading our FUNDING.md document on GitHub. Thanks, Sentry!"
year_published = 2023
