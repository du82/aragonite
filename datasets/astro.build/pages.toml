full_description = 'The Astro team proudly presents the new Astro REPL: compile Astro right in your browser. Use it to explore Astro’s HTML-based component language, debug issues, or even prototype an entire webpage. It’s powered by Astro’s new WASM compiler (written in Go) that runs anywhere and can rebuild files in an instant. Try the REPL now! To learn more about our new compiler, join us on Discord and tune in to Astro Demo Days next Monday, September 20, 2021 at 11am PST. September 17, 2021 Introducing the Astro REPL By Drew Powers The Astro team proudly presents the new Astro REPL: compile Astro right in your browser. Use it to explore Astro’s HTML-based component language, debug issues, or even prototype an entire webpage. It’s powered by Astro’s new WASM compiler (written in Go) that runs anywhere and can rebuild files in an instant. Try the REPL now! To learn more about our new compiler, join us on Discord and tune in to Astro Demo Days next Monday, September 20, 2021 at 11am PST. {"@context":"https://schema.org","@type":"BlogPosting","@id":"https://astro.build/blog/astro-repl/","headline":"Introducing the Astro REPL","description":"The power of Astro, right in your browser.","thumbnailUrl":"https://astro.build/_astro/astro-repl-social.RNjUkSao.webp","image":["https://astro.build/_astro/astro-repl-social.RNjUkSao.webp"],"datePublished":"2021-09-17T00:00:00.000Z","potentialAction":[{"@type":"ReadAction","target":["https://astro.build/blog/astro-repl/"]}],"author":[{"@type":"Person","@id":"https://astro.build/blog/#/author/drew","name":"Drew Powers","sameAs":"https://bsky.app/profile/pow.rs","image":"https://astro.build/_astro/drew.CS08dpqa.webp"}]}'
