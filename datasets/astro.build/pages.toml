title = "Introducing Astro: Ship Less JavaScript | Astro"
description = "We're excited to announce Astro as a new way to build static websites and deliver lightning-fast performance without sacrificing a modern developer experience."
full_description = "There’s a simple secret to building a faster website — just ship less. Unfortunately, modern web development has been trending in the opposite direction—towards more. More JavaScript, more features, more moving parts, and ultimately more complexity needed to keep it all running smoothly. Today I’m excited to publicly share Astro: a new kind of static site builder that delivers lightning-fast performance with a modern developer experience. To design Astro, we borrowed the best parts of our favorite tools and then added a few innovations of our own, including: Bring Your Own Framework (BYOF): Build your site using React, Svelte, Vue, Preact, web components, or just plain ol’ HTML + JavaScript. 100% Static HTML, No JS: Astro renders your entire page to static HTML, removing all JavaScript from your final build by default. On-Demand Components: Need some JS? Astro can automatically hydrate interactive components when they become visible on the page. If the user never sees it, they never load it. Fully-Featured: Astro supports TypeScript, Scoped CSS, CSS Modules, Sass, Tailwind, Markdown, MDX, and any of your favorite npm packages. SEO Enabled: Automatic sitemaps, RSS feeds, pagination and collections take the pain out of SEO and syndication. This post marks the first public beta release of Astro. Missing features and bugs are still to be expected at this early stage. There are still some months to go before an official 1.0 release, but there are already several fast sites built with Astro in production today. We would love your early feedback as we move towards a v1.0 release later this year. To learn more about Astro and start building your first site, check out our Getting Started guide. Getting Started Starting a new project in Astro is easy: # create your projectmkdir new-project-directorycd new-project-directorynpm init astro # install your dependenciesnpm install # start the dev server and open your browsernpm run dev How Astro Works Astro works a lot like a static site generator. If you have ever used Eleventy, Hugo, or Jekyll (or even a server-side web framework like Rails, Laravel, or Django) then you should feel right at home with Astro. In Astro, you compose your website using UI components from your favorite JavaScript web framework (React, Svelte, Vue, etc). Astro renders your entire site to static HTML during the build. The result is a fully static website with all JavaScript removed from the final page. No monolithic JavaScript application required, just static HTML that loads as fast as possible in the browser regardless of how many UI components you used to generate it. Of course, sometimes client-side JavaScript is inevitable. Image carousels, shopping carts, and auto-complete search bars are just a few examples of things that require some JavaScript to run in the browser. This is where Astro really shines: When a component needs some JavaScript, Astro only loads that one component (and any dependencies). The rest of your site continues to exist as static, lightweight HTML. In other full-stack web frameworks this level of per-component optimization would be impossible without loading the entire page in JavaScript, delaying interactivity. In Astro, this kind of partial hydration is built into the tool itself. You can even automatically defer components to only load once they become visible on the page with the :visible modifier. This new approach to web architecture is called islands architecture. We didn’t coin the term, but Astro may have perfected the technique. We are confident that an HTML-first, JavaScript-only-as-needed approach is the best solution for the majority of content-based websites. Embracing the Pit of Success A well-designed system makes it easy to do the right things and annoying (but not impossible) to do the wrong things Jeff Atwood, Falling Into The Pit of Success Poor performance is often framed as a failure of the developer, but we respectfully disagree. In many cases, poor performance is a failure of tooling. It should be difficult to build a slow website. Astro’s main design principle is to lead developers into what Rico Mariani dubbed “the pit of success”. It is our goal to build every site “fast by default” while also delivering a familiar, modern developer experience. By building your site to static HTML by default, Astro makes it difficult (but never impossible 😉) to build a slow site. Long-Term Sustainability Astro is built by the team of open source developers behind Snowpack and Skypack, with additional contributions from the community. Astro is and always will be free. It is an open source project released under the MIT license. We care deeply about building a more sustainable future for open source software. At the same time, we need to support Astro’s development long-term. This requires money (donations alone aren’t enough.) We’re inspired by the early success of projects like Tailwind, Rome, Remix, Ionic, and others who are experimenting with long-term financial sustainability on top of Open Source. Over the next year we’ll be exploring how we can create a sustainable business to support a 100% free, open source Astro for years to come. If your company is as excited about Astro as we are, we’d love to hear from you. Finally, I’d like to give a HUGE thanks to the 300+ developers who joined our earliest private beta. Your feedback has been essential in shaping Astro into the tool it is today. If you’re interested in getting involved (or just following along with development) please join us on Discord."
year_published = 2021
clearnet = "https://astro.build/blog/introducing-astro"
