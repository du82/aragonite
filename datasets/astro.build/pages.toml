ch as breakpoints, button classes, font settings, resets and outlines in src/assets/scss/baseAstro's View TransitionsGetting startedClone the repository or use as a templatenpm install Installs dependencies npm run dev Starts local dev server at localhost:4321 npm run build Build your production site to ./dist/npm run preview Preview your build locally, before deployingRead the documentation to learn more 🚀"
