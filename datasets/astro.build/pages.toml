full_description = "February 28, 2025 What's new in Astro - February 2025 February 2025 - Storyblok live previews, Astro integrations at TheJam.dev, behind the scenes at Astro Together, and more! February 25, 2025 Astro 5.4 Astro 5.4 brings remote image optimization in Markdown, enhanced security for dev and preview servers, RegExp support for Vercel ISR excludes, and more! February 17, 2025 Starlight 0.32 The latest Starlight features unlock new possibilities on our path to v1. Let’s meet route middleware, plugin i18n APIs, and multisite search. February 13, 2025 Astro 5.3 Astro 5.3 is here with faster page rendering, easier setup for experimental sessions, and more! January 31, 2025 What's new in Astro - January 2025 January 2025 - Starting the year off with a bang! January 30, 2025 Astro 5.2 Astro 5.2 is now available! The first minor release of 2025 includes Tailwind 4 support, a new way to access config values in your pages, better trailing slash handling, and support for external redirects. January 17, 2025 2024 year in review Revisit everything that happened in Astro last year: new feature releases, survey results, Astro Together, and more! December 31, 2024 What's new in Astro - December 2024 December 2024 - Astro 5, State of JS, Google IDX partnership, and more! December 19, 2024 Astro 5.1 Astro 5.1 is now available. This includes a new experimental sessions feature, improved caching for images, and new tools for building Astro Actions. December 3, 2024 Astro 5.0 Astro 5.0 brings exciting new features like the Astro Content Layer for seamless content loading from any source, and Server Islands for effortlessly combining static and dynamic personalized content. December 2, 2024 Google IDX: Our Official Online Editor Partner We are happy to announce that Google IDX has become Astro’s official online editor partner, donating $10,000 each month towards the ongoing open-source maintenance and development of Astro. November 30, 2024 What's new in Astro - November 2024 November 2024 - Astro joins Bluesky, Vite 6, and more!"
