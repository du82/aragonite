["https://astro.build/blog/year-in-review-2024"]
title = "2024 year in review | Astro"
description = "Revisit everything that happened in Astro last year: new feature releases, survey results, Astro Together, and more!"
full_description = '''Editor’s Note This is a guest post written by Shinya Fujino, an active Astro community member and contributor. This article first appeared on Zenn.dev, and we would like to thank Shinya for providing this English translation to share on our blog! Introduction Astro is a web framework well-suited for content-driven websites. Its Islands Architecture allows you to combine static pages with dynamic elements, striking a balance between performance and interactivity. Beyond that, you can leverage SSR, middleware, and endpoints to build applications that run on the server side, too. Recent updates have especially emphasized features for building dynamic sites, hinting at Astro’s evolution into a robust, full-stack framework. For a more detailed introduction to Astro, check out the official Why Astro? docs. In this post, I’ll summarize what I see as the most significant happenings in the Astro ecosystem in 2024. I’ll also touch on what might be coming in 2025, as far as I’m aware. If you’re interested, I’ve also published a 2023 edition (in Japanese) of this article. Feel free to check it out for a look back at Astro’s progress in 2023. Project health indicators Release Versions As of the start of 2024, Astro was at v4.0.8, and by the time of writing this article near the end of the year, v5.1.1 has been released. Including beta versions, there were a total of 169 releases in 2024. That’s almost on par with the number of releases in 2023, which was 175. In 2023, the major version jumped from 1 to 4, giving the impression of a rapid pace of feature additions and improvements. In 2024, the major version only went from 4 to 5, and the pace of version bumps seems to have eased somewhat. For those who are curious about the details of each release, you can check the full list of Astro releases on GitHub. GitHub Stars According to GitHub Star History, Astro’s GitHub stars were around 37,000 in early 2024 but increased to around 48,000 by the end of the year. Although that’s a bit slower than 2023’s increase of 15,000, it’s still a jump of over 10,000 for the year. It’s fair to say Astro’s star count is still on a healthy upward trend. NPM Downloads Based on npm trends, weekly downloads of Astro were 185,902 at the start of 2024, climbing to 364,201 as of December 15. That’s approximately double, so Astro is clearly growing at a steady pace here as well. State of JavaScript In the Meta Frameworks category of State of JavaScript 2024 published in December, Astro ranked #1 in: Interest (the proportion of positive sentiment among respondents having heard about an item) Retention (the proportion of positive sentiment among respondents having used an item) Positivity (the proportion of positive sentiment among respondents who expressed a sentiment) On top of that, its Usage (the proportion of respondents having used an item) rose from 4th to 2nd this year, trailing only Next.js: Astro also climbed to 5th place in Awareness (the proportion of respondents having heard about or used an item). Overall, every metric was either “an improvement over last year” or “still holding the #1 spot”. Based on the State of JavaScript survey, 2024 can be seen as a pivotal year of progress for Astro. New and Updated Features Content Layer Content Collections were introduced in Astro 2.0 as a way for type-safe handling of local content written in Markdown, etc. In Astro 5.0, the new Content Layer API was added to expand how content is defined, making it even more flexible and powerful for various use cases. Previously, Astro’s Content Collections could only handle content like Markdown or MDX files located locally in the reserved src/content directory: - src/content/ - blog/ - post-1.md - post-2.md Your content configuration schema could then validate the frontmatter of each Markdown file, provide editor autocompletion when dealing with content data retrieved by the getCollection function, and so on. With the new Content Layer API introduced in v5.0, you can keep the validation and autocompletion benefits while extending definitions for your content. For example, you can now “load” external API data as a collection with the new loader property: import { defineCollection, z } from "astro:content"; const countries = defineCollection({ loader: () => fetch("https://api.example.com/countries").then(res => res.json()), schema: z.object({ /* schema definition here */ }),}); export const collections = { countries }; Under this new Content Layer, type (which you previously provided to defineCollection) is now considered legacy, and the loader is where you specify how data should be loaded, making it possible to handle any kind of data source, not just local files. In v5, you get two built-in loaders for your local content, glob() and file(), making it easy to do things like: const blog = defineCollection({ loader: glob({ pattern: "**/*.md", base: "./src/data/blog" }), schema: z.object({ /* schema definition here */ }),}); This blog collection behaves similar to the old local file-based approach. Meanwhile, because loader can be any function, you can also pull data from external APIs or databases, or even generate content on the fly. In this way, the new Content Layer generalizes how content is handled in Astro and also allows you to freely define and distribute custom data loaders, significantly expanding Astro’s capabilities around content. The Content Loader API for building custom loaders also comes with handy features like the meta key-value store for storing metadata about your content and the rendered field for storing rendered output. With the newly refreshed Content Collections backed by the Content Layer API, go ahead and create your own loader—if it turns out well, publish it as an npm package and share it with the Astro community in the “Content Loaders” category of the integrations library! For instance, Storyblok, Cloudinary, and Hygraph have already released their own loaders, so you can fetch data from these services without having to write your own loader from scratch. Check out the official docs to learn more about Content Collections. Astro Actions Astro already offered endpoints for handling HTTP requests on the server side. But in v4.15, Astro Actions were introduced to make it easier to call backend services less boilerplate-y and more type-safe. Some of the benefits of Astro Actions include: Automatic input validation using Zod Automatic generation of type-safe functions that invoke your actions Standardized error handling through the ActionError type and the isInputError function Here’s an example of how you might define an Action in src/actions/index.ts: import { defineAction } from "astro:actions";import { z } from "astro:schema"; export const server = { // Define an action that takes a name and returns a greeting getGreeting: defineAction({ // The schema for the input sent to this action input: z.object({ name: z.string(), }), // The server-side handler for this action handler: async (input) => { return `Hello, ${input.name}!`; // input is validated and can be accessed type-safely } })} Note that you don’t see code for checking Content-Type, performing input validation, etc. Astro Actions handle that boilerplate so that you can focus on the core business logic. Then, on the client side: ------ <button>Get greeting</button> <script>// Import the `actions` object that contains the `getGreeting` actionimport { actions } from "astro:actions"; const button = document.querySelector("button");button?.addEventListener("click", async () => { // Call the `getGreeting` action const { data, error } = await actions.getGreeting({ name: "Actions" }); // Show the result in an alert if there's no error if (!error) alert(data);})</script> By importing actions from astro:actions, you get a function to call your getGreeting action. Thanks to the schema you provided, you can call getGreeting type-safely. And of course, you can hover over the action in your editor to see the input and return types or cmd+click to jump to its definition. Moreover, you can use the isInputError function to check if error is a validation error, or throw ActionError within your action handler to set specific HTTP status codes, etc. Given its name, Astro Actions are influenced by React’s Server Actions (Functions). Both attempt to solve similar problems, but Astro Actions seems to go a step further with out-of-the-box validation and structured error handling. You might not need extensive server-side communication in an Astro project, but you can slot Actions in as needed—for example, adding a Like feature on a blog post. Check out the official docs to learn more about Astro Actions. Server Islands A new rendering approach called Server Islands has been introduced in Astro 5.0. Astro’s Islands Architecture has always allowed selective hydration of certain portions of a page, but now Server Islands extends that concept to let you render parts of your page on the server. Below is the image shared in the initial announcement for Server Islands: As shown, you can embed server-rendered content into a static page. The static parts can be cached by a CDN, while the server-rendered parts are fetched lazily after initial page load, maintaining fast initial load speed while increasing the content’s flexibility. This approach achieves a level of performance that wasn’t possible with traditional SSR. To enable Server Islands, you simply add the server:defer directive to your Astro components. For example, suppose you have a component that fetches a user’s avatar on the server side: ---import { getUserAvatar } from "../sessions";const userSession = Astro.cookies.get("session");const avatarURL = await getUserAvatar(userSession);--- <img alt="User avatar" src={avatarURL} /> In the page that uses this component, you just add the server:defer directive: ---import Avatar from "../components/Avatar.astro";--- <!-- Other content here --> <Avatar server:defer /> And that’s it! The page is statically generated, while the Avatar component is server-rendered on demand. In addition, you can also specify fallback content to display while the server island is being loaded, akin to React’s Suspense: ---import Avatar from "../components/Avatar.astro";import GenericAvatar from "../components/GenericAvatar.astro";--- <Avatar server:defer> <GenericAvatar slot="fallback" /></Avatar> If you’d like a deeper explanation of how Server Islands differ from Astro’s standard Prerendering or On-demand Rendering, check out my article (in Japanese). It compares Next.js’s rendering methods and Astro’s Server Islands, giving you a broader understanding of modern rendering techniques. Check out the official docs to learn more about Server Islands. Astro DB In March 2024, Astro introduced the @astrojs/db package for database management. At first release, it was intended that production environments would connect to a managed database service called Astro Studio. As of now, you can connect to any libSQL server. For more about Astro Studio, see Related Projects. To use Astro DB, you first need to define your table schema in db/config.ts file: import { defineTable, column } from "astro:db"; const Author = defineTable({ columns: { id: column.number({ primaryKey: true }), name: column.text(), }}); const Comment = defineTable({ columns: { authorId: column.number({ references: () => Author.columns.id }), body: column.text(), }}); export default defineDb({ tables: { Author, Comment },}); Then, in db/seed.ts, export a function that seeds your database: import { db, Comment, Author } from "astro:db"; export default async function() { await db.insert(Author).values([ { id: 1, name: "Kasim" }, { id: 2, name: "Mina" }, ]); await db.insert(Comment).values([ { authorId: 1, body: "Hope you like Astro DB!" }, { authorId: 2, body: "Enjoy!"}, ])} When you spin up the development server, the database is automatically created and seeded. Querying the database go through the Drizzle client. The db client imported from astro:db is automatically configured to connect to the correct database, so you can just start querying right away: ---import { db, Comment } from "astro:db"; const comments = await db.select().from(Comment);--- <h2>Comments</h2> { comments.map(({ author, body }) => ( <article> <p>Author: {author}</p> <p>{body}</p> </article> ))} With Astro DB, you can combine Astro’s simplicity of setup with the powerful query capabilities of Drizzle to manage databases in your Astro projects. Although it seems to be in the early stages yet, Astro DB already offers more than enough functionality for smaller features requiring a database. Definitely consifer testing it out in your next project! Check out the official docs for more details on Astro DB. By the way, in 2024, I built an Astro version of the Next.js tutorial project from Learn Next.js, which might serve as a reference if you’re interested. It uses Astro DB, Actions, Server Islands, and other features to build a dashboard app deployed on Vercel. It was a fresh and fun way to try out these new 2024 server-side features. If you’re curious, check out the source code! astro:env Astro 5.0 introduced astro:env, a new way for handling environment variables type-safely. With astro:env, you can: Specify usage context (client or server) to clarify how/where variables can be used Mark variables as secrets so they won’t be exposed to clients or inlined into the server build Specify whether a variable is required or optional, and verify required variables are set at server startup Define variable types, removing the need for manual type conversions in your application You define your environment variable schema in your Astro config file: import { defineConfig } from "astro/config"; export default defineConfig({ env: { schema: { // ... } }}); Then use the envField helper to define fields: import { defineConfig, envField } from "astro/config"; export default defineConfig({ env: { schema: { API_URL: envField.string({ context: "client", access: "public", optional: true }), PORT: envField.number({ context: "server", access: "public", default: 4321 }), API_SECRET: envField.string({ context: "server", access: "secret" }), } }}); Here, we use options like context, access, and optional to specify properties like the context in which the variable can be accessed, whether it’s a secret, and if it’s optional. The variable types are declared by helper functions like envField.string or envField.number. You can then import and use these variables from astro:env/*: ---import { API_URL } from "astro:env/client";import { PORT } from "astro:env/server";import { API_SECRET } from "astro:env/server";--- Although it looks like a small feature, environment variables are often a source of headaches in application development, so having a built-in, type-safe approach is quite helpful. Check out the official docs for setting up type-safe environment variables. Request Rewriting Astro 4.13 introduced Request Rewriting, a feature'''
