title = "When Worlds Collide... | Asymptotia"
description = "This morning I had a really fantastic meeting with some filmmakers about scientific aspects of the visuals (and other content) for a film to appear on your screens one day, and also discussed finding  time to chat with one of the leads in order to help them get familiar with aspects of the world (and perhaps mindset) of a theoretical physicist. (It was part of a long series of very productive meetings about which I can really say nothing more at the current time, but I'm quite sure you'll hear about this film in the fullness of time.)  Then a bit later I had a chat with my wife about logistical aspects of the day so that she can make time to go down to Los Angeles and do an audition for a role in something. So far, so routine, and I carried on with some computations I was doing (some lovely clarity had arrived earlier and various piece of a puzzle fell together marvellously)...  But then, a bit later in the morning while doing a search, I stumbled upon some mention of the recent Breakthrough Prize ceremony, and found the video below [...] Click to continue reading this post →"
full_description = "When Worlds Collide… By Clifford | May 21, 2024 - 3:07 pm |May 21, 2024 entertainment, movies, science, science in the media, work This morning I had a really fantastic meeting with some filmmakers about scientific aspects of the visuals (and other content) for a film to appear on your screens one day, and also discussed finding time to chat with one of the leads in order to help them get familiar with aspects of the world (and perhaps mindset) of a theoretical physicist. (It was part of a long series of very productive meetings about which I can really say nothing more at the current time, but I’m quite sure you’ll hear about this film in the fullness of time.) Then a bit later I had a chat with my wife about logistical aspects of the day so that she can make time to go down to Los Angeles and do an audition for a role in something. So far, so routine, and I carried on with some computations I was doing (some lovely clarity had arrived earlier and various piece of a puzzle fell together marvellously)… But then, a bit later in the morning while doing a search, I stumbled upon some mention of the recent Breakthrough Prize ceremony, and found the video below (one of several). It’s as though I fell asleep at my desk and was having one of those strange dreams where two parts of your life that have little to do with each other get intertwined: Robert Downey Jr (RDJ) and Da’Vine Joy Randolph (DJR) doing a “bit” about statistical physics, quantum field theory, and symmetries, and then John Cardy and Alexander Zamolodchikov come on stage… -cvj Share this:TwitterFacebookMastodonBlueskyLike this:Like Loading... Related Bookmark the permalink."
