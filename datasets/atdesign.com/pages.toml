["https://atdesign.com/ru/about"]
title = ""
full_description = "АНДРЕЙ ТКАЧЕНКО Андрей Ткаченко — промышленный дизайнер. Главная тема его работ и его страсть — винтажные советские автомобили и фантазии на тему ушедшей эпохи. Автомобили, роботы и другие фантастические механизмы: художник создает свою альтернативную вселенную — СССР, которого не было. “Вся моя жизнь с детства и до нынешней работы связана с автомобилями. Их многообразие всегда впечатляло: разные марки, модели, модификации. Вот только мне и этого было мало. Однажды я узнал, что есть такие художники, которые берут стандартные автомобили и дорабатывают их, создавая новые истории. Дают новую жизнь современным и ставшим историей автомобилям, по-своему интерпретируя суть каждой модели! Это знакомство перевернуло мою жизнь. Я получил культурный шок, а мир заиграл новыми красками. Так началась моя история с параллельным СССР и «Секретным гаражом» Надеюсь, что вы откроете что-то интересное и близкое для себя, фантазируя и погружаясь в мир параллельного СССР…” Андрей Ткаченко ВЫ МОЖЕТЕ ЗАПОЛНИТЬ ФОРМУ ОБРАТНОЙ СВЯЗИ, и мы с Вами свяжемся или Отправить ПОДПИШИТЕСЬ НА НАШИ НОВОСТИ"
