title = "Besakih Temple - Atlas Obscura"
description = "Bali’s Mother Temple, a breathtaking complex that rises serenely up the side of an active volcano."
full_description = 'About As you draw closer to the base of Pura Besakih in Bali, the complex of Hindu temples rises above you and its enormity begins to fully set in. This is Bali’s mother temple, the holiest place of all for the four-million adherents of Balinese Hinduism, and it is remarkable. Besakih, sometimes called the great temple, sits about one-third of the way up Mount Agung, a 10,000-foot active volcano on Bali’s eastern side. The clouds that usually enshroud Agung’s higher reaches feel close at Besakih, complementing the mystery and awe a visitor can feel. Twenty-three temples make up the complex; they’re built upon six terraces. At its center is Pura Penataran Agung, the most important of the temples, with a split stone gateway called a candi bentar at its entry. This is an active place of worship that is not open to tourists, but visitors are welcome to watch respectfully from the perimeter of the central temple. Wander through the open-air structures. The architectural contrasts become more striking the higher you climb into Besakih, and get a fuller good look at its buildings. The symmetrical serenity of the meru, the thatched pagoda-like structures, stands in stark contrast to the murti, statues representing the divine (or simply the decorative). From the very top of the complex, you may be able to see the Indian Ocean. Ceremonies large and small take place about 70 days a year at Besakih, with Bali’s familiar marigold-colored fabrics—and plenty of white and red, too—draped at key points in the temples. Trees are interspersed with stone throughout the complex, adding more color, along with flowers and lotus ponds. Nearly the entire Balinese Hindu population comes to Besakih at some point during the year. Besakih keeps some secrets to itself, including its age. Inscriptions found at Besakih have been dated to 1007, AD; other sources note some of its structures may go back 2,000 years. Eruptions in 1963 and 1964 claimed between 1,100 and 1,600 lives and displaced more than 86,000 people. Astonishingly, the lava flows stopped just short of Besakih. (function () { if (document.querySelector(".place-body-ad")) return; const script = document.createElement("script"); script.async = true; script.id = "AV66a0ba0179e14f55900231eb"; script.type = "text/javascript"; script.src = "https://tg1.ad-adapex.io/api/adserver/spt?AV_TAGID=66a0ba0179e14f55900231eb&AV_PUBLISHERID=61236c658d8f39735560c155"; const adContainer = document.createElement("div"); adContainer.classList.add("flex", "flex-col", "items-center", "justify-center", "place-body-ad"); adContainer.appendChild(script); const firstP = document.querySelector( ".place-body p:first-of-type" ); if (firstP) { firstP.insertAdjacentElement("afterend", adContainer); } })(); Related Tags Temples Hinduism Know Before You Go Hiring a car or joining a tour is by far the most hassle-free way to get to Besakih. Most sources list travel time to Besakih as 90 minutes from Ubud and two hours from the more touristy spots to its south. Remember, Bali’s traffic gridlock can lengthen any estimates of travel time. As of late 2024, admission was 150,000 IDR (about $10 in USD or 9 Euro). An open-air shuttle bus ferries visitors from the entrance up a fairly long climb to the base of the temple complex. This is not a handicapped-accessible location. Dress respectfully; shoulders and knees should be covered. Visitors are loaned a sarong that goes around the waist and it’s mandatory. Posted without further comment: At the admission area, a sign tells visitors that menstruating women are prohibited from visiting the temple complex. Community Contributors Added By Allison Sandve Published February 17, 2025 Edit this listing Make an Edit Add Photos'
