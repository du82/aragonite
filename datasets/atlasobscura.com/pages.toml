title = "Bosnia and Herzegovina Trip - Group Travel | Atlas Obscura Adventures"
description = "Atlas Obscura has trips for adventure seekers. For food lovers and history buffs. For art, biology, and nature enthusiasts. Because exploration is for everyone."
full_description = "Romania • 12 days, 11 nights Legends of Romania: Castles, Ruins & Culinary Delights From $3,930 USD Iceland • 10 days, 9 nights Iceland in Summer: Journey through the South Coast & the Westman Islands From $6,830 USD Armenia • 15 days, 14 nights NEW - Caucasus Road Trip: Azerbaijan, Georgia & Armenia From $5,435 USD Trip Navigation Overview Itinerary Dates Info From $3,870 USD See dates Contact us Overview Balkans Road Trip: Serbia, Croatia & Bosnia and Herzegovina Continent Europe Days 9 days Nights 8 nights Group Size 12 people Activity Easy Interest History & Culture Created in Partnership with Experience a transformative road trip filled with dramatic history and spectacular scenery as you travel across Serbia, Croatia, and Bosnia and Herzegovina in search of lasting memories of the former Yugoslavia. Visit fortresses and skyscrapers, ruined factories, surreal war memorials known as spomeniks, and extraordinary works of Modernist architecture, and hear from locals about their experiences of the war. Special Access: Traverse the ruins of Yugoslavia's biggest underground airport. Travel with Purpose: Support the preservation of local history with a visit to Kadinjača, a striking mountaintop memorial complex honoring those who died resisting Nazi occupation. Highlights Visit three charismatic capital cities: Belgrade, Sarajevo & Zagreb. Explore what may, or may not, be a Bosnian pyramid. Traverse the ruins of an underground airport in Yugoslavia. Visit Kadinjača, a striking mountaintop memorial honoring those who died resisting Nazi occupation. Enjoy the pristine lakes and waterfalls of Plitvice National Park in Croatia. Discover an abandoned Olympic bobsleigh track, which became a front line during the conflict. Bosnia and Herzegovina • 9 days • 8 nights Traverse the beauty and history of the Balkans through locals' stories. Day 1 Belgrade Arrival Welcome to Belgrade! Arrive at the Belgrade airport, where a car and driver will be waiting to take you to your hotel in the Old Town area of Belgrade. You’ll meet the group this evening in the hotel lobby – then head out to admire the sights before settling down for a traditional Serbian dinner and an opportunity to get to know your fellow travelers. Read more about day 1 Belgrade Arrival Welcome to Belgrade! Arrive at the Belgrade airport, where a car and driver will be waiting to take you to your hotel in the Old Town area of Belgrade. You’ll meet the group this evening in the hotel lobby – then head out to admire the sights before settling down for a traditional Serbian dinner and an opportunity to get to know your fellow travelers. Belgrade City Hotel or similar, Belgrade Welcome Dinner Show more about day 1 Belgrade City Hotel or similar, Belgrade Welcome Dinner Day 2 Exploring the Serbian Capital Exploring the streets of Belgrade This morning, you’ll set out for a walking tour of Belgrade, taking in sights such as Republic Square and the Kalemegdan Fortress. You’ll get a sense of the city’s diverse architecture, ranging from Serbo-Byzantine through Baroque and Classical, to striking works in the Modernist style. In the afternoon you’ll visit an abandoned factory on the outskirts of Belgrade where you’ll wander through the ruins of a once-thriving site of Yugoslav manufacturing. Finish off the day with a tour of a local brewery and a dinner of modern Serbian cuisine. Read more about day 2 Exploring the Serbian Capital Exploring the streets of Belgrade This morning, you’ll set out for a walking tour of Belgrade, taking in sights such as Republic Square and the Kalemegdan Fortress. You’ll get a sense of the city’s diverse architecture, ranging from Serbo-Byzantine through Baroque and Classical, to striking works in the Modernist style. In the afternoon you’ll visit an abandoned factory on the outskirts of Belgrade where you’ll wander through the ruins of a once-thriving site of Yugoslav manufacturing. Finish off the day with a tour of a local brewery and a dinner of modern Serbian cuisine. Belgrade City Hotel or similar, Belgrade Breakfast, Dinner Show more about day 2 Belgrade City Hotel or similar, Belgrade Breakfast, Dinner Day 3 Monuments and Memorials Kosmaj Monument in Koracica, Serbia This morning your vehicle will collect you from the hotel and you’ll make your first stop at the partisan monument on Mount Kosmaj. You’ll then drive south west, making a few stops to take in local heritage sites, and to eat lunch against a breathtaking mountain backdrop. Your last stop of the day will be the Kadinjača Memorial Complex, before arriving for dinner, and your accommodation for the night in Užice. Read more about day 3 Monuments and Memorials Kosmaj Monument in Koracica, Serbia This morning your vehicle will collect you from the hotel and you’ll make your first stop at the partisan monument on Mount Kosmaj. You’ll then drive south west, making a few stops to take in local heritage sites, and to eat lunch against a breathtaking mountain backdrop. Your last stop of the day will be the Kadinjača Memorial Complex, before arriving for dinner, and your accommodation for the night in Užice. Hotel Aria or similar, Užice Breakfast, Dinner Show more about day 3 Hotel Aria or similar, Užice Breakfast, Dinner Day 4 Užice & Višegrad The picturesque town of Višegrad Užice is a paradise for architecture geeks. You’ll take a walk through the city in the morning, admiring some truly remarkable examples of the Brutalist and Modernist styles. Then bid Serbia “Zbogom” as you cross the border into Bosnia and Herzegovina. You’ll visit the extremely picturesque town of Višegrad – made famous by the Ivo Andrić novel, The Bridge on the Drina – before driving to the capital, Sarajevo. Read more about day 4 Užice & Višegrad The picturesque town of Višegrad Užice is a paradise for architecture geeks. You’ll take a walk through the city in the morning, admiring some truly remarkable examples of the Brutalist and Modernist styles. Then bid Serbia “Zbogom” as you cross the border into Bosnia and Herzegovina. You’ll visit the extremely picturesque town of Višegrad – made famous by the Ivo Andrić novel, The Bridge on the Drina – before driving to the capital, Sarajevo. Hotel Halvat or similar, Sarajevo Breakfast, Dinner Show more about day 4 Hotel Halvat or similar, Sarajevo Breakfast, Dinner Day 5 A Break in the Mountains Olympic bobsleigh track. Get your first taste of the Bosnian capital this morning on a guided walk, discovering vibrant art and colorful mosques and learning about the city’s thriving craft beer scene. You'll also have the opportunity to learn about the Bosnian War and the 1992-96 Siege of Sarajevo. Survivors of the conflict will share their stories as you walk around Bascarsija market, and the abandoned Olympic bobsleigh track, which became a front line during the conflict. Check into your boutique hotel with time to freshen up before heading out to dinner at a family-run local restaurant. Read more about day 5 A Break in the Mountains Olympic bobsleigh track. Get your first taste of the Bosnian capital this morning on a guided walk, discovering vibrant art and colorful mosques and learning about the city’s thriving craft beer scene. You'll also have the opportunity to learn about the Bosnian War and the 1992-96 Siege of Sarajevo. Survivors of the conflict will share their stories as you walk around Bascarsija market, and the abandoned Olympic bobsleigh track, which became a front line during the conflict. Check into your boutique hotel with time to freshen up before heading out to dinner at a family-run local restaurant. Hotel Halvat or similar, Sarajevo Breakfast, Dinner Show more about day 5 Hotel Halvat or similar, Sarajevo Breakfast, Dinner Day 6 Exploring Sarajevo Visočia, the Bosnian Pyramid of Visoko Leaving Sarajevo in the morning, you’ll drive northward. You’ll stop in Visoko to investigate what may - or may not - be a Bosnian pyramid, alleged to be larger and older than the pyramids of Egypt. In the historic city of Zenica, you’ll learn more about Bosnia & Herzegovina’s Islamic heritage during an architectural tour. By late afternoon, you’ll arrive in Banja Luka, the largest city in Bosnia’s 'Republika Srpska' region. Here you’ll take a look around the city center before gathering for dinner in a modern local restaurant. Read more about day 6 Exploring Sarajevo Visočia, the Bosnian Pyramid of Visoko Leaving Sarajevo in the morning, you’ll drive northward. You’ll stop in Visoko to investigate what may - or may not - be a Bosnian pyramid, alleged to be larger and older than the pyramids of Egypt. In the historic city of Zenica, you’ll learn more about Bosnia & Herzegovina’s Islamic heritage during an architectural tour. By late afternoon, you’ll arrive in Banja Luka, the largest city in Bosnia’s 'Republika Srpska' region. Here you’ll take a look around the city center before gathering for dinner in a modern local restaurant. Zepter Palace Hotel or similar, Banja Luka Breakfast, Dinner Show more about day 6 Zepter Palace Hotel or similar, Banja Luka Breakfast, Dinner Day 7 Churches, Castles, and Ghosts of Zagreb Exploring Zagreb Today you’ll explore the Croatian capital and its Old Town in the company of a local expert, stopping at various unconventional attractions and abandoned buildings around the city. We'll explore the history behand the Zeljava Airbase, once the biggest underground airport in the Balkans lies in ruins. The remainder of the day is yours to relax or explore on your own. Read more about day 7 Churches, Castles, and Ghosts of Zagreb Exploring Zagreb Today you’ll explore the Croatian capital and its Old Town in the company of a local expert, stopping at various unconventional attractions and abandoned buildings around the city. We'll explore the history behand the Zeljava Airbase, once the biggest underground airport in the Balkans lies in ruins. The remainder of the day is yours to relax or explore on your own. Time Out Heritage Hotel or similar, Zagreb Breakfast Show more about day 7 Time Out Heritage Hotel or similar, Zagreb Breakfast Day 8 Kozara Plitvice National Park, Croatia Today you’ll enjoy a scenic day trip to the breathtaking Plitvice National Park. The pristine lakes and waterfalls has made this one of Croatia’s most beloved attractions. Expect postcard-perfect views, and a delicious lakeside lunch. Later we’ll make our way back towards Zagreb for our last group dinner together. Along the way though, look out for a surprise stop at what ought to be a very memorable location. Read more about day 8 Kozara Plitvice National Park, Croatia Today you’ll enjoy a scenic day trip to the breathtaking Plitvice National Park. The pristine lakes and waterfalls has made this one of Croatia’s most beloved attractions. Expect postcard-perfect views, and a delicious lakeside lunch. Later we’ll make our way back towards Zagreb for our last group dinner together. Along the way though, look out for a surprise stop at what ought to be a very memorable location. Time Out Heritage Hotel or similar, Zagreb Breakfast, Lunch, Dinner Show more about day 8 Time Out Heritage Hotel or similar, Zagreb Breakfast, Lunch, Dinner Day 9 Farewell & Departure A public map in Zagreb. Today’s breakfast will be your last group meal—but the fun doesn’t have to end here. You’ll find plenty more to explore in Zagreb. Check out the Atlas Obscura Guide to Zagreb for inspiration. Until next time! Read more about day 9 Farewell & Departure A public map in Zagreb. Today’s breakfast will be your last group meal—but the fun doesn’t have to end here. You’ll find plenty more to explore in Zagreb. Check out the Atlas Obscura Guide to Zagreb for inspiration. Until next time! Breakfast Show more about day 9 Breakfast Expand itinerary What is included? Accommodations throughout the trip. Most meals (as described in the itinerary). Transportation (as described in the itinerary), including airport transfers. Admission/entry to ac