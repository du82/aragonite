["https://atlasobscura.com/places/bonhomme-de-fer-iron-man"]
title = "‘Bonhomme de Fer’ (‘The Iron Man’) - Atlas Obscura"
description = "This human-shaped statue is actually a geodesic station."
full_description = 'About From far away, this cast iron statue looks eerily like the silhouette of a man. Upon closer inspection, the inscription on its side gives away its true purpose:"Borne géodésique," meaning geodesic terminal. In 1863, the military engineers were given the task of mapping Belgium. Triangulations were made from high monuments. In areas that had no visual landmarks, geodetic stations were added. A total of 86 were gradually installed. The Iron Man of Braine-le-Comte was put in place in 1890. To make it more visible in the landscape, it was initially topped by a 98-foot-high wooden structure. This structure was equipped with a concealed pulley that made it possible to lift the upper part of the Iron Man. This allowed access to the base of the geodetic marker: A perfectly horizontal surface whose height is known with precision. The last measurements were taken from the top of the marker in 1953. (function () { if (document.querySelector(".place-body-ad")) return; const script = document.createElement("script"); script.async = true; script.id = "AV66a0ba0179e14f55900231eb"; script.type = "text/javascript"; script.src = "https://tg1.ad-adapex.io/api/adserver/spt?AV_TAGID=66a0ba0179e14f55900231eb&AV_PUBLISHERID=61236c658d8f39735560c155"; const adContainer = document.createElement("div"); adContainer.classList.add("flex", "flex-col", "items-center", "justify-center", "place-body-ad"); adContainer.appendChild(script); const firstP = document.querySelector( ".place-body p:first-of-type" ); if (firstP) { firstP.insertAdjacentElement("afterend", adContainer); } })(); Related Tags Monuments Geographic Markers Community Contributors Added By duaner Published February 28, 2025 Edit this listing Make an Edit Add Photos Sources http://bornesetsommets.canalblog.com/archives/2023/09/15/40042105.html https://www.rtbf.be/article/decouvrez-un-lieu-insolite-le-bonhomme-de-fer-de-braine-le-comte-8059231 https://www.braine-le-comte.be/qualite-de-vie/tourisme/office-du