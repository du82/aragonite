["https://atlasobscura.com/places/george-washington-bust-in-george-wa"]
title = "George Washington Bust in George, WA - Atlas Obscura"
description = "A bust of the first president welcomes visitors to the only town in America called George, Washington."
full_description = '''About In the early 1950s, 339 acres of land in Washington state was set aside by the U.S. Bureau of Land Management to build a town to support the nearby agricultural areas. A pharmacist named Charlie Brown bid $100,000 for the site and with the help of a city planning instructor from the nearby University of Washington, started to build his town. On July 4, 1957 the city of George, Washington was incorporated. The town’s website claims that the name was first suggested by a man from the Bureau of Reclamation who, in a conversation with Brown, suggested that somebody should “get smart” and name a town after the nation's first president. (Perhaps he had never visited Washington, D.C. or another of the over 250 towns, cities, and boroughs named after Washington.) Still, Brown took his advice to heart, and decided that George would be an appropriate name for a town in Washington. Notably, while there are other places named “Georgetown” in the country, Brown’s city is the only one named “George” in the United States. Today, true to theme, the City of George, WA boasts a popular Fourth of July celebration (during which they bake the largest cherry pie in the world) and a grand birthday party on President’s Day. Also, just off Interstate 90 at exit 149, a large bust of George Washington greets visitors as they pass by Shree’s Truck Stop & Gas Station. The bust is a copy of the one created by Avard Fairbanks for the nation’s bicentennial. The original bronze bust is installed at George Washington University in Washington, D.C. (function () { if (document.querySelector(".place-body-ad")) return; const script = document.createElement("script"); script.async = true; script.id = "AV66a0ba0179e14f55900231eb"; script.type = "text/javascript"; script.src = "https://tg1.ad-adapex.io/api/adserver/spt?AV_TAGID=66a0ba0179e14f55900231eb&AV_PUBLISHERID=61236c658d8f39735560c155"; const adContainer = document.createElement("div"); adContainer.classList.add("flex", "flex-col", "items-center", "justify-center", "place-body-ad"); adContainer.appendChild(script); const firstP = document.querySelector( ".place-body p:first-of-type" ); if (firstP) { firstP.insertAdjacentElement("afterend", adContainer); } })(); Related Tags Names Presidents Statues Know Before You Go Park at the Shree's Truck Stop and Gas Station. The bust is in the corner under the sign. Community Contributors Added By R Stemple Edited By Taterchips Taterchips Published September 20, 2017 Edit this listing Make an Edit Add Photos Sources http://www.cityofgeorge.org/history/history.htm http://www.roadsideamerica.com/tip/2941 https://www2.gwu.edu/~bradyart/brady/envisioning_gw/env/sub/s2/fairbanks.html https://en.wikipedia.org/wiki/George,_Washington'''
