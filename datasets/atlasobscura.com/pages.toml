["https://atlasobscura.com/places/don-parkss-yards"]
title = "Don Parks’ Yard of Statues and Stuff - Atlas Obscura"
description = "Phoenix man has two yards full of vintage signs and antiques."
full_description = '''About Don Parks first began collecting miscellaneous antiques in high school, when his grandfather gifted him a 1923 Ford Model T. In the late 1960s, he began decorating his house with his prized possessions, including a Paul Bunyan Muffler Man purchased from a Bay Area gas station. In 1971, Parks bought his current home. Since, its yard has become filled to the brim with many kinds of outdoor decor, from signage to statues. Over the years, Parks sourced items from second-hand stores, swap meets, and anywhere else that might sell such antiques. The collection's first item, the 23-foot-tall statue of Paul Bunyan, was sold in 2024. Although he does occasionally sell pieces, his collection has generally continued to grow. Parks even bought a second property across the street to more than double the space available, in addition to items he keeps in his houses and backyards. Many of the statues are taken from pop culture, while others are from the defunct Legend City amusement park near Papago Park. There are also a myriad of highway signs from various states, as well as mock signs for outer space. Spot the McDonald's Golden Arches on one roof, and the dog with a giant pair of glasses on the other. (function () { if (document.querySelector(".place-body-ad")) return; const script = document.createElement("script"); script.async = true; script.id = "AV66a0ba0179e14f55900231eb"; script.type = "text/javascript"; script.src = "https://tg1.ad-adapex.io/api/adserver/spt?AV_TAGID=66a0ba0179e14f55900231eb&AV_PUBLISHERID=61236c658d8f39735560c155"; const adContainer = document.createElement("div"); adContainer.classList.add("flex", "flex-col", "items-center", "justify-center", "place-body-ad"); adContainer.appendChild(script); const firstP = document.querySelector( ".place-body p:first-of-type" ); if (firstP) { firstP.insertAdjacentElement("afterend", adContainer); } })(); Related Tags Collections Signs Antiques Know Before You Go This is private property, but the owner encourages visitors to admire his collection from the sidewalk. Don may be willing to coordinate tours over the phone. Call (480) 381-6332. Community Contributors Added By cdanesh Edited By Anna Minster Anna Minster Published February 28, 2025 Edit this listing Make an Edit Add Photos Sources https://www.phoenixnewtimes.com/arts/don-parks-massive-collection-of-yard-art-statues-and-phoenix-relics-6563116 https://www.roadsideamerica.com/story/20624'''
