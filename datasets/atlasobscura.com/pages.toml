full_description = "Romania • 12 days, 11 nights Legends of Romania: Castles, Ruins & Culinary Delights From $3,930 USD Trip Navigation Overview Itinerary Dates Info From $6,825 USD See dates Contact us Overview NEW - Wild Brazil: Rivers, Dunes & the Amazon Continent South America Days 11 days Nights 10 nights Group Size 12 people Activity Moderate Interest Wildlife & Nature Created in Partnership with Journey through the Amazon and beyond on this adventure through the rainforest, mangroves, and dunes of Northeast Brazil. From Manaus to São Luís, float your way through otherworldly waterscapes on the river, along hidden creeks, and by the sea. Learn first hand about indigenous Amazonian culture and learn about life in the rainforest. Take in colorful colonial towns and soak up the sounds of reggae and sertanejo music. Special Access: Visit a village built on the disappearing sand-spit that separates the river from the ocean. The village has had to relocate twice due to the tides. Travel with Purpose: Support a local lodge committed to ecological, socio-cultural, and economic sustainability. Highlights Paddle through Amazonian creeks & go for a dip with pink dolphins. Ride across the famed dunes of Maranhão in a 4x4. Visit a local village built on disappearing sand-spit. Visit UNESCO world heritage towns filled with Afro-Brazilian culture. Stay a local lodge committed to ecological, socio-cultural, and economic sustainability. Brazil • 11 days • 10 nights Explore Amazon villages, fish for piranha, and cool off in lagoon-covered sand dunes. Day 1 Welcome to Brazil Teatro Amazonas Opera House. Welcome to Manaus, the largest city in the Amazon! Take a private transfer from the Manaus airport to your hotel in Manaus, known as the gateway to the Brazilian Rainforest. Meet the rest of your group over a delicious welcome dinner in one of Manaus’s best restaurants, overlooking the exquisite Teatro Amazonas opera house. This stunning music venue is said to have been commissioned by 19th-century rubber barons in order to entice the great opera singer Enrico Caruso to come and perform for them. Read more about day 1 Welcome to Brazil Teatro Amazonas Opera House. Welcome to Manaus, the largest city in the Amazon! Take a private transfer from the Manaus airport to your hotel in Manaus, known as the gateway to the Brazilian Rainforest. Meet the rest of your group over a delicious welcome dinner in one of Manaus’s best restaurants, overlooking the exquisite Teatro Amazonas opera house. This stunning music venue is said to have been commissioned by 19th-century rubber barons in order to entice the great opera singer Enrico Caruso to come and perform for them. Juma Opera Hotel or similar, Manaus Welcome Dinner Show more about day 1 Juma Opera Hotel or similar, Manaus Welcome Dinner Day 2 Juma Jungle Adventure & Nighttime Nature Pink dolphins of the Amazon. Your day kicks off with a combination of speed boat rides and drives into Juma, deep in the Amazon. Witness the mesmerizing Meeting of the Waters, where the Solimões and Negro rivers flow side by side without mixing, and feel the temperature change as you cruise past this unique natural phenomenon. Arriving at your Amazon lodge, you’ll be welcomed with a delicious lunch blending regional and international flavors. Later, hop on a canoe and glide through the igarapés (creeks) and igapós (flooded forests), looking out for pink dolphins. You could opt for a refreshing dip too. This evening, embark on a nighttime expedition to spot caimans and other nocturnal wildlife. Read more about day 2 Juma Jungle Adventure & Nighttime Nature Pink dolphins of the Amazon. Your day kicks off with a combination of speed boat rides and drives into Juma, deep in the Amazon. Witness the mesmerizing Meeting of the Waters, where the Solimões and Negro rivers flow side by side without mixing, and feel the temperature change as you cruise past this unique natural phenomenon. Arriving at your Amazon lodge, you’ll be welcomed with a delicious lunch blending regional and international flavors. Later, hop on a canoe and glide through the igarapés (creeks) and igapós (flooded forests), looking out for pink dolphins. You could opt for a refreshing dip too. This evening, embark on a nighttime expedition to spot caimans and other nocturnal wildlife. Juma Opera Hotel or similar, Manaus Breakfast, Lunch, Dinner Show more about day 2 Juma Opera Hotel or similar, Manaus Breakfast, Lunch, Dinner Day 3 Sunrise Serenade & Sunset Fishing Fishing on the Amazon. Start your day at sunrise, soaking in the dawn chorus of birds with binoculars in hand. After breakfast featuring tropical fruits and regional delicacies, set off on an immersive jungle hike led by an expert guide who will reveal some of the Amazon’s many secrets, from edible flora to medicinal plants. Back at the lodge for lunch, spend time exploring its unique architecture (it’s built on stilts), and gain an insight into local sustainability practices. In the late afternoon, set sail on a fishing trip and learn all about the native piranha as the sun sets over the river. You can have your own fresh-caught fish for dinner while chatting with a local guide and your co-travelers. Read more about day 3 Sunrise Serenade & Sunset Fishing Fishing on the Amazon. Start your day at sunrise, soaking in the dawn chorus of birds with binoculars in hand. After breakfast featuring tropical fruits and regional delicacies, set off on an immersive jungle hike led by an expert guide who will reveal some of the Amazon’s many secrets, from edible flora to medicinal plants. Back at the lodge for lunch, spend time exploring its unique architecture (it’s built on stilts), and gain an insight into local sustainability practices. In the late afternoon, set sail on a fishing trip and learn all about the native piranha as the sun sets over the river. You can have your own fresh-caught fish for dinner while chatting with a local guide and your co-travelers. Juma Opera Hotel or similar, Manaus Breakfast, Lunch, Dinner Show more about day 3 Juma Opera Hotel or similar, Manaus Breakfast, Lunch, Dinner Day 4 Indigenous Insight Amazon rainforest hike. Set out on a jungle hike this morning, spotting rare birds and wildlife. Stop for a delicious lunch cooked over an open fire in the middle of the forest, then take some time to relax in hammocks like the locals do. In the afternoon, we'll be welcomed into a local home to learn firsthand about indigenous culture and the Amazon’s medicinal plants. Learn how to prepare manioc flour, a local staple used to make a range of dishes from fresh breads to stews. Return to the lodge to relax amidst the sounds of the jungle and have dinner. Read more about day 4 Indigenous Insight Amazon rainforest hike. Set out on a jungle hike this morning, spotting rare birds and wildlife. Stop for a delicious lunch cooked over an open fire in the middle of the forest, then take some time to relax in hammocks like the locals do. In the afternoon, we'll be welcomed into a local home to learn firsthand about indigenous culture and the Amazon’s medicinal plants. Learn how to prepare manioc flour, a local staple used to make a range of dishes from fresh breads to stews. Return to the lodge to relax amidst the sounds of the jungle and have dinner. Juma Opera Hotel or similar, Manaus Breakfast, Lunch, Dinner Show more about day 4 Juma Opera Hotel or similar, Manaus Breakfast, Lunch, Dinner Day 5 Exploring the Capital of Amazonas Floating market in Manaus. After breakfast, make your way back to Manaus, stopping along the river en route to see giant native Pirarucu fish, some of which grow to 10 feet long and 440 lbs! Back in Manaus, enjoy free time to explore the city. For dinner, we recommend Biatüwi, a restaurant specializing in Amazonian indigenous food including fish stews, maniwara ants, and guaraná juice, made from red Amazonian berries. Read more about day 5 Exploring the Capital of Amazonas Floating market in Manaus. After breakfast, make your way back to Manaus, stopping along the river en route to see giant native Pirarucu fish, some of which grow to 10 feet long and 440 lbs! Back in Manaus, enjoy free time to explore the city. For dinner, we recommend Biatüwi, a restaurant specializing in Amazonian indigenous food including fish stews, maniwara ants, and guaraná juice, made from red Amazonian berries. Juma Opera Hotel or similar, Manaus Breakfast Show more about day 5 Juma Opera Hotel or similar, Manaus Breakfast Day 6 Exploring São Luis Welcome to São Luís. Say hello to São Luís, the colorful capital of Maranhão and your gateway to the breathtaking landscapes of the Lençóis Maranhenses! After landing and checking into the hotel, the day is yours to explore this UNESCO-recognized city brimming with Afro-Brazilian culture. Stroll through the atmospheric historic center lined with cobbled streets and pastel colonial mansions. Dive into the city’s lively reggae scene or try tiquira at one of São Luís many markets, an indigenous cassava-based spirit that has been made here for millennia. Read more about day 6 Exploring São Luis Welcome to São Luís. Say hello to São Luís, the colorful capital of Maranhão and your gateway to the breathtaking landscapes of the Lençóis Maranhenses! After landing and checking into the hotel, the day is yours to explore this UNESCO-recognized city brimming with Afro-Brazilian culture. Stroll through the atmospheric historic center lined with cobbled streets and pastel colonial mansions. Dive into the city’s lively reggae scene or try tiquira at one of São Luís many markets, an indigenous cassava-based spirit that has been made here for millennia. Blue Tree Towers Sao Luis or similar, São Luís Breakfast Show more about day 6 Blue Tree Towers Sao Luis or similar, São Luís Breakfast Day 7 Parnaíba Delta Paradise Amazon river boat excursion. Head out towards to the seaside village of Tutóia, then set sail on a boat tour of the Parnaíba Delta. Experience a kaleidoscopic blend of landscapes: a mix of dunes, mangroves, islands, and even a slice of tropical Amazon rainforest. You'll visit the Port of Armadillos on Santa Isabel Island and glide through creeks and rivers, spotting monkeys, iguanas, and scarlet ibis along the way. Enjoy the delta sunset before returning to Tutóia for the night, where your accommodation is just steps from the beach. Read more about day 7 Parnaíba Delta Paradise Amazon river boat excursion. Head out towards to the seaside village of Tutóia, then set sail on a boat tour of the Parnaíba Delta. Experience a kaleidoscopic blend of landscapes: a mix of dunes, mangroves, islands, and even a slice of tropical Amazon rainforest. You'll visit the Port of Armadillos on Santa Isabel Island and glide through creeks and rivers, spotting monkeys, iguanas, and scarlet ibis along the way. Enjoy the delta sunset before returning to Tutóia for the night, where your accommodation is just steps from the beach. Pousada Delta Village or similar, Tutóia Breakfast Show more about day 7 Pousada Delta Village or similar, Tutóia Breakfast Day 8 Hidden Beaches & Rolling Dunes Dunes adventure by 4x4. Start your day with a short trip to Paulino Neves, nestled in the protected Rio Novo region. From there, embark on a 30 km off-road adventure through North-East Brazil's iconic dunes and hidden beaches. By midday, your journey ends in Cabure, a unique village built on a shifting sand-spit separating the river from the ocean. Cross the river to Atins, a once small fishing village now on the cusp of a tourism boom thanks to its proximity to the Lençóis Maranhenses National Park. Check in to your hotel and enjoy lunch, before heading out in 4x4s to explore the nearby dunes for a breathtaking sunset. Return to your hotel for the night. Read more about day 8 Hidden Beaches & Rolling Dunes Dunes adventure by 4x4. Start your day with a short trip to Paulino Neves, nestled in the protected Rio Novo region. From there, embark on a 30 km off-road adventure through North-East Brazil's iconic dunes and hidden beaches. By midday, your journey ends in Cabure, a unique village built on a shifting sand-spit separating the river from the ocean. Cross the river to Atins, a once small fishing village now on the cusp of a tourism boom thanks to its proximity to the Lençóis Maranhenses National Park. Check in to your hotel and enjoy lunch, before heading out in 4x4s to explore the nearby dunes for a breathtaking sunset. Return to your hotel for the night. Pousada Jurara or similar, Atins Breakfast Show more about day 8 Pousada Jurara or similar, Atins Breakfast Day 9 Otherworldly Landscapes of Grandes Lençó Lençóis Maranhenses National Park. Today you'll be bedazzled by the beauty of our planet. Set off on a boat trip up the Rio Preguiça (Lazy River), passing the Mandacaru Lighthouse for sweeping 360° views of the different landscapes, and enjoy the mesmerizing color contrasts between these different eco-systems that rarely meet. Explore Vassouras, a fishing community known for its friendly monkeys, before heading to Barreirinhas. Check into your hotel, then hop into a 4x4 for an exhilarating ride across Rio Preguiça into the Grandes Lençóis Maranhenses National Park, home to the world’s only desert with freshwater lakes. Each one beckons travelers to trek across the sand and dive into its miraculous turquoise waters. This will be a day you will never forget. Read more about day 9 Otherworldly Landscapes of Grandes Lençó Lençóis Maranhenses National Park. Today you'll be bedazzled by the beauty of our planet. Set off on a boat trip up the Rio Preguiça (Lazy River), passing the Mandacaru Lighthouse for sweeping 360° views of the different landscapes, and enjoy the mesmerizing color contrasts between these different eco-systems that rarely meet. Explore Vassouras, a fishing community known for its friendly monkeys, before heading to Barreirinhas. Check into your hotel, then hop into a 4x4 f