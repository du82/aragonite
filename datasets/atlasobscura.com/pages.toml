title = "Cookie Policy - Atlas Obscura"
description = "Definitive guidebook and friendly tour-guide to the world's most wondrous places. Travel tips, articles, strange facts and unique events."
full_description = '''Cookie Policy Last updated 12/1/2021 What is a Cookie? Other Technologies Data Collected via Website Technology Types of Cookies Utilized by Atlas Obscura Website Cookie Settings This Cookie Policy covers use of our websites under atlasobscura.com and other related sites (the "Website”). By clicking to accept cookies, you are consenting to our use of cookies in accordance with this Cookie Policy. Cookies used for functionality are considered necessary, or essential, and are collected from all users based on legitimate interest and for a business purpose, such as bot detection, security, and user accounts, and similar uses. If you do not wish to accept non-essential cookies from our website, you can follow the link in our cookie footer and/or pop-up, and you will be directed to a page where you can enable/disable certain cookies, and you may disable cookies in your browser (consult this resources for more information: allaboutcookies.org/manage-cookies). Although you are not required to accept cookies when you visit the Website, you may be unable to use all of the functionality of the website if you reject certain cookies. We use cookies and similar tracking technologies to track the activity on our Website. The cookies we use or allow are an accepted part of ecommerce and important to your use of the Website. The information collected by cookies does not personally identify you; it includes general information about your computer settings, your connection to the Internet (e.g. operating system and platform, IP address, your browsing patterns, and timings of browsing on the website) and your location. Details about the types of cookies that Atlas Obscura utilizes can be found below. Any personal information you do provide us through the Website would be governed by Atlas Obscura’ Privacy Policy. What is a Cookie? Cookies are pieces of data issued that may include an anonymous unique identifier. Cookies are used by a website that, among other things, allow your computer to utilize all the features on the website. If and when your computer accepts a cookie, the cookie may be stored on the computer’s hard drive. Below we provide more information about the specific types of cookies utilized by the Website, and what those cookies do. Other tracking technologies are also used such as beacons, tags and scripts to collect and track information and to improve and analyze our Website. In addition to Cookies, our Website may utilize other technology to automatically track certain information: Other Technologies Log File Information: Atlas Obscura's servers automatically record certain information that your web browser sends whenever you visit the Website. These server logs may include information such as your web request, Internet Protocol ("IP") address, browser type, browser language, referring / exit pages and URLs, platform type, number of clicks, domain names, landing pages, pages viewed and the order of those pages, the amount of time spent on particular pages, the date and time of your request, and one or more cookies that may uniquely identify your browser. Information Collected by "Clear GIFs": Atlas Obscura may employ "clear GIFs" (a.k.a. Web Beacons), which are used to track the online usage patterns anonymously (i.e., in a non-personally-identifiable manner). In addition, Atlas Obscura may also use clear GIFs in HTML-based emails sent to users to track which emails are opened by recipients. Data Collected via Website Technology Each time a device visits the Website we may collect certain data from that device. This data is automatically collected from the device’s web browser and may include data such as the following: the type of web browser software the computer uses (for example, Google Chrome or Internet Explorer); the name of the domain from which the computer accessed the Internet; the Internet address of the website from which the computer linked directly to the Website; the date and time the computer accessed the Website. We may use this data to help us make the Website more useful to you and for other business purposes as described below. Types of Cookies Utilized by Atlas Obscura Website Cookies can either be session cookies or persistent cookies. A session cookie does not identify you personally and automatically expires when you close your browser. A persistent cookie will remain until it expires or you delete your cookies. By assigning your computer a unique identifier through a persistent cookie, we are able to create a database of your previous choices and preferences which can be provided by us automatically, saving you time and effort on future visits. In addition, third parties may place and read cookies on your browser or use web beacons or similar technologies to collect data. We use a number of different third-party resources in order to utilize cookies, including Google Analytics. A description of the specific functionality of the cookies used by the Website is provided below. Necessary Cookies Necessary cookies enabling basic functions on the Website, like page navigation and access to secure areas. The Website cannot function properly without these cookies. Necessary cookies are used for the following purposes, including: Preserving your session state across page requests; Distributing traffic to the Website across several servers in order to optimize response times and improve your experience; Identifying trusted web traffic to keep the Website secure; Storing your cookie consent state for the current web page you’re visiting. Preference Cookies Preference cookies enable the Website to remember information that changes the way the Website behave or look during your experience, like your preferred language or the region that you are in. Preference cookies are used to establish a unique user ID that recognizes you on returning visits in order to improve and personalize your experience. Statistics Cookies Statistic cookies help us understand how visitors interact with the Website by collecting and reporting information anonymously. Statistics cookies are used for the following purposes: Anonymously logging details about your browser and computer through Google Analytics; Collecting anonymous data on your visits to the Website, such as the number of visits, average time spent on the Website, and what pages have been loaded, in order to generate reports for optimizing the Website’ content; Determining what type of device (smartphones, tablets, computers, TVs etc.) is being used to access the Website; Gathering anonymous technical information regarding your browser, operating system, IP address and screen resolution as well as your navigation on the Website. Advertising/Marketing Cookies Marketing cookies are used to track visitors across the Website. The intention is to display ads that are relevant and engaging for individual users. Marketing cookies are used for the following purposes: Registering a unique ID that identifies your device for the purpose of targeted ads, auto-populating forms, validating if certain contact information is correct, keeping statistics about third party sites used/accessed through the Website; Registering anonymized user data, such as IP address, geographical location, visited websites, and what ads you have clicked, with the purpose of optimizing ad display based on your movement on websites that use the same ad network; Collecting data on your visits to the Website, such as what pages have been accessed, number of visits, average time spent on the Website, in order to categorize your interest and demographic profiles in terms of resales for targeted marketing, identifying traffic patterns on the Website, and carrying out surveys to better understand your preferences; Remarketing service to advertise on third party websites (including Google) to previous visitors to the Website; Evaluating efficacy of advertisements and likelihood of groups to engage with the Website and purchase Atlas Obscura products; Registering your sharing of content via social media. Third-Party Ad Networks: As discussed in the Privacy Notice, Atlas Obscura may allow other companies, called third-party ad servers or ad networks, to serve advertisements within the Website. These third-party ad servers or ad networks use technology to send, directly to your browser, the advertisements and links that appear on the Website. They automatically receive your IP address when this happens. They may also use other technologies (such as cookies, JavaScript, or Web Beacons) to measure the effectiveness of their advertisements and to personalize the advertising content you see. You should consult the respective privacy policies of these third-party ad servers or ad networks for more information on their practices and for instructions on how to opt-out of certain practices. This Privacy Notice does not apply to them, and Atlas Obscura cannot control their activities. We may use data from Google’s Interest-based advertising or 3rd-party audience data (such as age, gender and interests) with Google Analytics. You can opt-out of Google Analytics for Display Advertising and customize Google Display Network ads via Google Ads Settings, or opt out of general interested-based advertising via the NAI Consumer Opt Out. You may also be interested in the Google Analytics opt-out browser add-on.'''
