title = "Uzbekistan Trip - Group Travel | Atlas Obscura Adventures"
description = "Atlas Obscura has trips for adventure seekers. For food lovers and history buffs. For art, biology, and nature enthusiasts. Because exploration is for everyone."
full_description = "Trip Navigation Overview Itinerary Dates Info From $5,830 USD See dates Contact us Overview Central Asia Road Trip: Backroads & Bazaars Continent Asia Days 15 days Nights 14 nights Group Size 12 people Activity Moderate Interest History & Culture Created in Partnership with Join us on an epic, two-week, four-country road trip as we wind through Kazakh bazaars, wade in Kyrgyzstan’s glassy Issyk-kul lake, discover Soviet relics in Tajikistan, and wander through Uzbekistan’s ancient Silk Road cities. As you make your overland journey, you’ll cover over 2,000 miles, enjoying a dazzling diversity of art, music, and architecture; and over two millennia of history. Highlights Spend a night under the stars in a yurt next to a pristine alpine lake surrounded by mountains. Explore the colorful and fragrant stalls of Central Asia's most famous bazaars. Discover Samarkand’s spectacular ancient history, from mosques to mausoleums. Learn how to prepare some of the best Uzbek delicacies during a hands-on cooking class. Explore the ancient ruins, fortresses, cathedrals, mausoleums, memorials & mosaics that dot the Silk Road. Uzbekistan • 15 days • 14 nights A 2-Week, 4-Country Odyssey. Day 1 Almaty Arrival and Welcome Dinner A view of Almaty. Welcome to Kazakhstan! Arrive at Almaty International Airport and transfer to your boutique hotel near the city center. Take some time to settle in before we meet for introductions and walk to dinner, where you’ll take your first bites of Kazakh cuisine and discuss the adventure ahead of us. Read more about day 1 Almaty Arrival and Welcome Dinner A view of Almaty. Welcome to Kazakhstan! Arrive at Almaty International Airport and transfer to your boutique hotel near the city center. Take some time to settle in before we meet for introductions and walk to dinner, where you’ll take your first bites of Kazakh cuisine and discuss the adventure ahead of us. Resident City Hotel or similar, Almaty Welcome Dinner Show more about day 1 Resident City Hotel or similar, Almaty Welcome Dinner Day 2 Almaty, City of Apple Trees Zankov&#39;s Cathedral in central Almaty. Today, you’ll explore Almaty, the former capital of Soviet Kazakhstan. Nowadays, it’s both a bustling cultural center and a leafy oasis—its name translates loosely to ‘city of apple trees.’ Almaty is filled with treasures from the U.S.S.R. as well as a diverse mix of inhabitants from all around the region. It also happens to be home to the highest ice skating rink in the world. You'll dive head first into the history of the region wandering through the city’s colorful markets, such as the Zelionyj Bazaar, traditional cathedrals, sprawling parks, and lively cafes, all set against the dramatic backdrop of the snow-capped Tian Shan mountains. Later, enjoy an exclusive private performance of traditional Kazakh musical instruments and nomadic chants. If you’ve still got the energy, join us for a nighttime walking tour, your final hurrah in the great city of Almaty. Read more about day 2 Almaty, City of Apple Trees Zankov&#39;s Cathedral in central Almaty. Today, you’ll explore Almaty, the former capital of Soviet Kazakhstan. Nowadays, it’s both a bustling cultural center and a leafy oasis—its name translates loosely to ‘city of apple trees.’ Almaty is filled with treasures from the U.S.S.R. as well as a diverse mix of inhabitants from all around the region. It also happens to be home to the highest ice skating rink in the world. You'll dive head first into the history of the region wandering through the city’s colorful markets, such as the Zelionyj Bazaar, traditional cathedrals, sprawling parks, and lively cafes, all set against the dramatic backdrop of the snow-capped Tian Shan mountains. Later, enjoy an exclusive private performance of traditional Kazakh musical instruments and nomadic chants. If you’ve still got the energy, join us for a nighttime walking tour, your final hurrah in the great city of Almaty. Resident City Hotel or similar, Almaty Breakfast, Lunch Show more about day 2 Resident City Hotel or similar, Almaty Breakfast, Lunch Day 3 Kyrgyzstan by the Backdoor Charyn Canyon. Embark on an adventurous journey along the Kazakh side of the Tian Shan, one of the most beautiful mountain ranges in Central Asia. Your first stop will be the wondrous Charyn Canyon (Kazakhstan’s Grand Canyon), whose sedimentary red sandstone has been shaped by millions of years of erosion. After lunch, continue on to the border town of Karkara traveling across an idyllic landscape of green pastures and remote settlements. Later, you'll enter the Republic of Kyrgyzstan and head straight for the traditional market town of Karakol. Weave through a series of unique bazaars offering goods ranging from Soviet memorabilia to spices and dried fruit. Take some time to wander on your own before dinner, when we’ll track down some delicious Muslim-Chinese fare, such as cold and spicy ashlan fu. Read more about day 3 Kyrgyzstan by the Backdoor Charyn Canyon. Embark on an adventurous journey along the Kazakh side of the Tian Shan, one of the most beautiful mountain ranges in Central Asia. Your first stop will be the wondrous Charyn Canyon (Kazakhstan’s Grand Canyon), whose sedimentary red sandstone has been shaped by millions of years of erosion. After lunch, continue on to the border town of Karkara traveling across an idyllic landscape of green pastures and remote settlements. Later, you'll enter the Republic of Kyrgyzstan and head straight for the traditional market town of Karakol. Weave through a series of unique bazaars offering goods ranging from Soviet memorabilia to spices and dried fruit. Take some time to wander on your own before dinner, when we’ll track down some delicious Muslim-Chinese fare, such as cold and spicy ashlan fu. Muras Hotel or similar, Karakol Breakfast, Lunch Show more about day 3 Muras Hotel or similar, Karakol Breakfast, Lunch Day 4 Cosmonaut Rocks and Roadside Ruins Lake Issyk-Kul. Today you’ll travel west along the southern shore of Lake Issyk-Kul, the second-largest alpine lake in the world. Dip your feet into the water while taking in breathtaking views of the shimmering lake and snow-capped peaks looming in the distance. En route to Barksoon, we’ll take in natural wonders such as the unusual rock formations of Jeti-Ögüz (which, legend has it, gets its bright red color from a very bloody history…) and the snow-capped Terskey Alatau mountains. You'll explore Barksoon and its valley, where the face of Yuri Gagarin, the first man to reach space, has been carved into the side of a massive boulder. Then you’ll visit the ruins of Aalam Ordo, an unfinished complex once intended to be a center for culture, spirituality, and science. You’ll finish in the picturesque town of Bokonobaevo where you’ll spend the night in a traditional guesthouse. Read more about day 4 Cosmonaut Rocks and Roadside Ruins Lake Issyk-Kul. Today you’ll travel west along the southern shore of Lake Issyk-Kul, the second-largest alpine lake in the world. Dip your feet into the water while taking in breathtaking views of the shimmering lake and snow-capped peaks looming in the distance. En route to Barksoon, we’ll take in natural wonders such as the unusual rock formations of Jeti-Ögüz (which, legend has it, gets its bright red color from a very bloody history…) and the snow-capped Terskey Alatau mountains. You'll explore Barksoon and its valley, where the face of Yuri Gagarin, the first man to reach space, has been carved into the side of a massive boulder. Then you’ll visit the ruins of Aalam Ordo, an unfinished complex once intended to be a center for culture, spirituality, and science. You’ll finish in the picturesque town of Bokonobaevo where you’ll spend the night in a traditional guesthouse. Guest House, Bokonbaevo Breakfast, Lunch Show more about day 4 Guest House, Bokonbaevo Breakfast, Lunch Day 5 Lakes, Highlands and Yurts At the bazaar. Today you’ll continue your journey west along the salty shores of the Issyk-Kul. After a few more photo stops at the various Soviet-era remnants slowly fading away into oblivion, we’ll reach the charming bazaar town of Kochkor, where we'll stock up on food before heading up to Song Kol, an alpine lake surrounded by mountains. Tonight we'll spend the night close to its shores in comfortable shared yurts. Read more about day 5 Lakes, Highlands and Yurts At the bazaar. Today you’ll continue your journey west along the salty shores of the Issyk-Kul. After a few more photo stops at the various Soviet-era remnants slowly fading away into oblivion, we’ll reach the charming bazaar town of Kochkor, where we'll stock up on food before heading up to Song Kol, an alpine lake surrounded by mountains. Tonight we'll spend the night close to its shores in comfortable shared yurts. Yurt Camp, Song Kol Lake Breakfast, Lunch Special note The shared yurt overnight at Song Kol is subject to weather conditions. These are prone to change erratically. The safety and well-being of our guests is our absolute priority, we’ll assess on-site whether an overnight stay in the mountains is feasible. If rough weather conditions are forecasted, we’ll descend instead to the nearby village of Kyzyl-Oi (see following day’s itinerary) for the night and reach Osh a day earlier. There is also a low risk of altitude sickness associated with an overnight stay in Song-Kol. An emergency car will be available to those guests wishing to descend for the night. PLEASE NOTE: A single supplement is subject to availability and not guaranteed when staying in the Yurt Camp at Song Kol Lake. Show more about day 5 Yurt Camp, Song Kol Lake Breakfast, Lunch Special note Day 6 Flaming Mountains and Lost Hamlets The Moldo Ashuu pass. Today, enjoy a leisurely morning on Song Kol. Stroll along its shores, meet with local nomadic herders, or, for the courageous among us, try plunging into its icy waters. After an early lunch you’ll then descend towards Chaek, a village in a scenic narrow mountain valley. We’ll check out the Arab mausoleums this village is renowned for, before moving on to the dreamlike hamlet of Kyzyl-Oi, a traditional Central Asian village tucked away in an isolated gorge of flaming red mountains and whitewater streams. Read more about day 6 Flaming Mountains and Lost Hamlets The Moldo Ashuu pass. Today, enjoy a leisurely morning on Song Kol. Stroll along its shores, meet with local nomadic herders, or, for the courageous among us, try plunging into its icy waters. After an early lunch you’ll then descend towards Chaek, a village in a scenic narrow mountain valley. We’ll check out the Arab mausoleums this village is renowned for, before moving on to the dreamlike hamlet of Kyzyl-Oi, a traditional Central Asian village tucked away in an isolated gorge of flaming red mountains and whitewater streams. Guest House, Kyzyl-Oi Breakfast, Lunch Show more about day 6 Guest House, Kyzyl-Oi Breakfast, Lunch Day 7 Legendary Giants and a Flyover Two local workers., Gianluca Pardelli Prepare for an early wakeup this morning, as today you’ll be setting out on the longest leg of our journey, driving for six to seven hours towards Kyrgyzstan’s capital Bishkek. As we travel through the valleys of southern Kyrgyzstan, enjoy spectacular views of rolling foothills and vast, arid landscapes. We'll take frequent stops to soak up the scenery and admire Soviet-era bus stops, memorials, mosaics, and heirlooms from the heyday of the Silk Road. In the early afternoon arrive in Bishkek. After a quick USSR-heritage-themed visit, you’ll head for the airport for your evening flight to Tashkent, the vibrant capital of Uzbekistan. Read more about day 7 Legendary Giants and a Flyover Two local workers., Gianluca Pardelli Prepare for an early wakeup this morning, as today you’ll be setting out on the longest leg of our journey, driving for six to seven hours towards Kyrgyzstan’s capital Bishkek. As we travel through the valleys of southern Kyrgyzstan, enjoy spectacular views of rolling foothills and vast, arid landscapes. We'll take frequent stops to soak up the scenery and admire Soviet-era bus stops, memorials, mosaics, and heirlooms from the heyday of the Silk Road. In the early afternoon arrive in Bishkek. After a quick USSR-heritage-themed visit, you’ll head for the airport for your evening flight to Tashkent, the vibrant capital of Uzbekistan. Hotel Tashkent, or similar, Tashkent Breakfast, Lunch Show more about day 7 Hotel Tashkent, or similar, Tashkent Breakfast, Lunch Day 8 Tajikistan Khujand, Tajikistan. Explore the treasures of Tashkent today, on a guided walk taking in its Soviet-era grandeur, imposing monuments, and the intricate designs of its richly decorated metro stations. Explore meandering street markets brimming with local treasures and flavors. Following an early lunch, you’ll set out for northern Tajikistan. Arrive in Khujand this afternoon and take some time to relax and explore the city solo. Follow your nose to Panjshanbe Bazaar for dinner, where you can pick up, amongst other things; plov, skewered meats, fried bread, lamb-stuffed manti, and kurut: pungent, cheese-like balls made of dried yogurt. Read more about day 8 Tajikistan Khujand, Tajikistan. Explore the treasures of Tashkent today, on a guided walk taking in its Soviet-era grandeur, imposing monuments, and the intricate designs of its richly decorated metro stations. Explore meandering street markets brimming with local treasures and flavors. Following an early lunch, you’ll set out for northern Tajikistan. Arrive in Khujand this afternoon and take some time to relax and explore the city solo. Follow your nose to Panjshanbe Bazaar for dinner, where you can pick up, amongst other things; plov, skewered meats, fried bread, lamb-stuffed manti, and kurut: pungent, cheese-like balls made of dried yogurt. Hotel Khujand, or similar, Khujand Breakfast, Lunch Show more about day 8 Hotel Khujand, or similar, Khujand Breakfast, Lunch Day 9 Khujand A ceiling in Khujand. Khujand, for a time known as Leninabad, has a rich, documented history that dates back thousands of years before Lenin came into the picture. You’ll trace the city’s many lives through its architecture, glimpsing 20th century bas-reliefs and mosaics alongside ancient mausoleums, mosques, and fortresses. Read more about day 9 Khujand A ceiling in Khujand. Khujand, for a time known as Leninabad, has a rich, documented history that dates back thousands of years before Lenin came into the picture. You’ll trace the city’s many lives through its architecture, glimpsing 20th century bas-reliefs and mosaics alongside ancient mausoleums, mosques, and fortresses. Grand Hotel, or similar, Khujand Breakfast, Lunch Show more about day 9 Grand Hotel, or similar, Khujand Breakfast, Lunch Day 10 Ancient Frescoes & Lingering Lenins Lenin statue in Khujand. After breakfast, we’ll drive to Istaravshan, where a larger-than-life Lenin statue has found a new home gazing out across a municipal r"
