title = "About Us - Atlas Obscura"
description = "Definitive guidebook and friendly tour-guide to the world's most wondrous places. Travel tips, articles, strange facts and unique experiences."
full_description = "Our small-group adventures are inspired by our Atlas of the world's most fascinating places, the stories behind them, and the people who bring them to life. At Atlas Obscura, our mission is to inspire wonder and curiosity about the incredible world we all share. We are a global community of explorers, who have together created a comprehensive database of the world’s most wondrous places and foods —30,261 of them contributed by our community so far, and more every day, from a secret apartment atop the Eiffel Tower to bridges built out of living roots, from a temple shaped like a chicken to an island ruled by cats, from a fruit that tastes like chocolate pudding to a spicy chutney made out of red ants. We are a publisher of best-in-class journalism about hidden places, incredible history, scientific marvels, and gastronomical wonders. Our first book, Atlas Obscura: An Explorer’s Guide to the World’s Hidden Wonders, was a No. 1 bestseller on Amazon and in the New York Times. We hold extraordinary events all over the country, every week. In nine U.S. cities, Atlas Obscura Societies create intimate, wondrous experiences for our community. From back-room tours to workshops with the world’s most remarkable people, we give our community access to the rarest experiences. We lead the world’s most unusual trips to the world’s most remarkable places. Atlas Obscura takes small groups of travelers on adventures, from Bhutan’s mountaintop temples to the ruins of Meroe in Sudan, and into the kitchens of renowned local chefs from Mexico to Italy. We create multi-media content, special events, and creative advertising programs for some of the world’s most interesting brands. These integrated campaigns lead to direct results and memorable programming for our brand partners. Photo Credits: Baobab Juice: T.K. NALIAKA/CC BY-SA 4.0, Exit Stamp of Algeria: REDA KERBOUCHE/CC BY-SA 3.0"
