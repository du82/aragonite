title = "Iceland Trip - Group Travel | Atlas Obscura Adventures"
description = "Atlas Obscura has trips for adventure seekers. For food lovers and history buffs. For art, biology, and nature enthusiasts. Because exploration is for everyone."
full_description = '''Romania • 12 days, 11 nights Legends of Romania: Castles, Ruins & Culinary Delights From $3,930 USD Bosnia and Herzegovina • 9 days, 8 nights Balkans Road Trip: Serbia, Croatia & Bosnia and Herzegovina From $3,870 USD Armenia • 15 days, 14 nights NEW - Caucasus Road Trip: Azerbaijan, Georgia & Armenia From $5,435 USD Trip Navigation Overview Itinerary Dates Info From $6,830 USD See dates Contact us Overview Iceland in Summer: Journey through the South Coast & the Westman Islands Continent Europe Days 10 days Nights 9 nights Group Size 12 people Activity Easy Interest Wildlife & Nature Created in Partnership with Between strange encounters with peculiar elves and supernatural creatures, Icelanders have their fair share of mythical tales. In a land renowned worldwide for its sensational scenery and extraordinary natural wonders, beneath the surface lies a unique history waiting to be discovered. On this tour, we’ll traverse the paths of ancient legends and discover the natural secrets of this astonishing land. Our expert guides will lead us on a circumnavigation of Iceland with a focus on storytelling as they reveal the geologic, human, and mystical history of this land. This is a truly unforgettable experience for the intrepid traveler who is looking for a tour that combines ancient history with breathtaking natural beauty. Special Access: Explore the Westman Archipelago, catching a glimpse of the World's Loneliest House and learning about the puffin patrol,an effort to save young birds that have wandered from their nests. Global Community: On our August 16 departure, meet Erpur Hansen, a biologist working in the Westman Islands to study and help preserve the local puffin population. Travel with Purpose: Visit Iceland's only Puffin Rescue Center, which takes in pufflings (baby puffins) that need some extra care. Looking for 2024 dates? Click here! We also offer an Iceland in Winter adventure. Highlights Visit the extraordinary Jökulsárlón Glacier Lagoon. Feel the mist on your face as you get up close to Iceland’s most spectacular waterfalls. Explore the quirky streets of Reykjavik, the world’s most northerly capital city. Travel by boat to the breathtaking Vestmannaeyjar Archipelago, Iceland’s best kept secret. Marvel at the steaming vents and chimneys of the Geysir Geothermal Area. Iceland • 10 days • 9 nights Explore Iceland's Myths, Wonders, & Landscapes. Day 1 Welcome to Reykjavik Welcome to Iceland! Welcome to Iceland! You’ll arrive at Iceland’s Keflavík International Airport and make your way to the group hotel in Reykjavik via a shared shuttle service. Depending on your arrival time, you may have time to explore the capital city. We recommend checking out the wonderful National Museum of Iceland and learning about the Viking history of the region, or discovering the architectural wonder that is Hallgrímskirkja, one of the most striking churches in the world and where you can find exceptional views over the city from the tower. Meet your fellow intrepid travelers over a welcome dinner at a local restaurant that showcases the best of Icelandic cuisine and raise a glass to the beginning of your Iceland adventure. Read more about day 1 Welcome to Reykjavik Welcome to Iceland! Welcome to Iceland! You’ll arrive at Iceland’s Keflavík International Airport and make your way to the group hotel in Reykjavik via a shared shuttle service. Depending on your arrival time, you may have time to explore the capital city. We recommend checking out the wonderful National Museum of Iceland and learning about the Viking history of the region, or discovering the architectural wonder that is Hallgrímskirkja, one of the most striking churches in the world and where you can find exceptional views over the city from the tower. Meet your fellow intrepid travelers over a welcome dinner at a local restaurant that showcases the best of Icelandic cuisine and raise a glass to the beginning of your Iceland adventure. Alda Hotel, or similar, Reykjavik Welcome Dinner Show more about day 1 Alda Hotel, or similar, Reykjavik Welcome Dinner Day 2 The Golden Circle Iceland&#39;s tiny elf doors. Kick off your Icelandic escapades with an enchanting morning in the seaside town of Hafnarfjörður, home to Iceland’s largest colonies of elves, trolls, and mythical creatures Let these tiny creatures cast their spell as you stroll along paths where tiny wooden elf doors adorn boulder and tree. Then, embark on the legendary Golden Circle route, a trifecta of natural wonders. At Þingvellir National Park, you'll walk along the great continental divide between the North American and Eurasian tectonic plates. Nearby, the geothermal fields of Geysir will dazzle with their erupting fumaroles and hot springs. Then visit Fridheimar Tomato Farm where you’ll refuel with a farm-fresh lunch featuring the beloved Icelandic crop - tomatoes! Afterwards head to the thundering Gullfoss waterfall, feel the mist on your face as you marvel at this spectacular natural wonder. Read more about day 2 The Golden Circle Iceland&#39;s tiny elf doors. Kick off your Icelandic escapades with an enchanting morning in the seaside town of Hafnarfjörður, home to Iceland’s largest colonies of elves, trolls, and mythical creatures Let these tiny creatures cast their spell as you stroll along paths where tiny wooden elf doors adorn boulder and tree. Then, embark on the legendary Golden Circle route, a trifecta of natural wonders. At Þingvellir National Park, you'll walk along the great continental divide between the North American and Eurasian tectonic plates. Nearby, the geothermal fields of Geysir will dazzle with their erupting fumaroles and hot springs. Then visit Fridheimar Tomato Farm where you’ll refuel with a farm-fresh lunch featuring the beloved Icelandic crop - tomatoes! Afterwards head to the thundering Gullfoss waterfall, feel the mist on your face as you marvel at this spectacular natural wonder. Hotel Stracta, or similar, Hella Breakfast, Dinner Show more about day 2 Hotel Stracta, or similar, Hella Breakfast, Dinner Day 3 The South Coast Skógafoss waterfall. Discover Iceland’s picturesque South Coast today, punctuated by several spectacular stops. You’ll see the 200-foot tall Seljalandsfoss waterfall and the impressive Skógafoss waterfall. Keep your eyes peeled as we continue our drive past Drangurinn Rock, a landscape feature that, according to local folklore, was ripped from a mountain by an outlaw and then became a home for elves. A little further on and you’ll find yourself at Reynisfjara, a picturesque beach with enormous columns of basalt rising from its distinctive black sands. Your last stop is Jökulsárlón, a stunning glacial lagoon renowned for its icy blue waters speckled with icebergs from the surrounding Breiðamerkurjökull glacier. End our day in the fishing town of Höfn at the base of the Vatnajökull ice cap. Read more about day 3 The South Coast Skógafoss waterfall. Discover Iceland’s picturesque South Coast today, punctuated by several spectacular stops. You’ll see the 200-foot tall Seljalandsfoss waterfall and the impressive Skógafoss waterfall. Keep your eyes peeled as we continue our drive past Drangurinn Rock, a landscape feature that, according to local folklore, was ripped from a mountain by an outlaw and then became a home for elves. A little further on and you’ll find yourself at Reynisfjara, a picturesque beach with enormous columns of basalt rising from its distinctive black sands. Your last stop is Jökulsárlón, a stunning glacial lagoon renowned for its icy blue waters speckled with icebergs from the surrounding Breiðamerkurjökull glacier. End our day in the fishing town of Höfn at the base of the Vatnajökull ice cap. Hali Country Hotel, or similar, Höfn Breakfast, Dinner Special note Gueshouse Gerdi, or similar, Höfn Show more about day 3 Hali Country Hotel, or similar, Höfn Breakfast, Dinner Special note Day 4 Vestmannaeyjar Archipelago Vestmannaeyjar Port. Leave the mainland today and take a short ferry ride to the nearby Vestmannaeyjar - or Westman Island, Iceland’s best-kept secret. Part of an archipelago of 15 islands and 30 rock stacks off the South Coast, Vestmannaeyjar is famous for its spectacular scenery, and being home to the world’s largest puffin colony. A 1974 volcano eruption resulted in the archipelago increasing 20% in size, visit the Eldheimar Museum to learn more about this remarkable volcanic eruption. Read more about day 4 Vestmannaeyjar Archipelago Vestmannaeyjar Port. Leave the mainland today and take a short ferry ride to the nearby Vestmannaeyjar - or Westman Island, Iceland’s best-kept secret. Part of an archipelago of 15 islands and 30 rock stacks off the South Coast, Vestmannaeyjar is famous for its spectacular scenery, and being home to the world’s largest puffin colony. A 1974 volcano eruption resulted in the archipelago increasing 20% in size, visit the Eldheimar Museum to learn more about this remarkable volcanic eruption. Hotel Vestmannaeyjar, or similar, Vestmannaeyjabær Breakfast, Dinner Show more about day 4 Hotel Vestmannaeyjar, or similar, Vestmannaeyjabær Breakfast, Dinner Day 5 Exploring Volcano Island Westman Island puffins. Today promises plenty of feathery fun as we set our sights on Iceland's most adored winged residents - the puffin! Our August 16th departure will see a Puffin Biologist accompany us on our puffin hunt. After a scenic island drive, we'll stake out a prime puffin-viewing spot, hoping to catch these comical little sea parrots waddling along the coastal cliffs with their beaks stuffed full of fish. Catch a glimpse of the World’s Loneliest House, before heading to the innovative Beluga Sea Life Trust, a pioneering sanctuary for puffins, whales, and marine life conservation. Then hop on a zippy RIB boat tour around the islands. The rest of the afternoon is yours to embrace Iceland's great outdoors however you wish - perhaps take a hike up the slumbering Eldfell volcano or an exhilarating ATV adventure over the rugged lava fields. We'll reconvene in the evening to recount our feathered friend sightings over dinner. Read more about day 5 Exploring Volcano Island Westman Island puffins. Today promises plenty of feathery fun as we set our sights on Iceland's most adored winged residents - the puffin! Our August 16th departure will see a Puffin Biologist accompany us on our puffin hunt. After a scenic island drive, we'll stake out a prime puffin-viewing spot, hoping to catch these comical little sea parrots waddling along the coastal cliffs with their beaks stuffed full of fish. Catch a glimpse of the World’s Loneliest House, before heading to the innovative Beluga Sea Life Trust, a pioneering sanctuary for puffins, whales, and marine life conservation. Then hop on a zippy RIB boat tour around the islands. The rest of the afternoon is yours to embrace Iceland's great outdoors however you wish - perhaps take a hike up the slumbering Eldfell volcano or an exhilarating ATV adventure over the rugged lava fields. We'll reconvene in the evening to recount our feathered friend sightings over dinner. Hotel Vestmannaeyjar, or similar, Vestmannaeyjar Breakfast, Dinner Show more about day 5 Hotel Vestmannaeyjar, or similar, Vestmannaeyjar Breakfast, Dinner Day 6 A Bridge Between Two Continents Thingvellir National Park. Wave goodbye to the Westman Islands as we return to the mainland, bound for the otherworldly landscapes of the Reykjanes Peninsula. This fissure-fractured wonderland promises a glimpse into the inner workings of our dynamic planet. You'll literally straddle the great continental rift at the Bridge Between Continents, before exploring the surreal, steam-billowing geothermal fields of Seltun and mystical Kleifervatn lake. Learn about the legendary elves and trolls believed to roam this lunar-like terrain as your local guide recounts Iceland's rich folklore. After a full immersion into the peninsula's volcanic vistas, you'll head back to culture-rich Reykjavik for an evening exploring the colorful charms of the world's northernmost capital at your leisure. Read more about day 6 A Bridge Between Two Continents Thingvellir National Park. Wave goodbye to the Westman Islands as we return to the mainland, bound for the otherworldly landscapes of the Reykjanes Peninsula. This fissure-fractured wonderland promises a glimpse into the inner workings of our dynamic planet. You'll literally straddle the great continental rift at the Bridge Between Continents, before exploring the surreal, steam-billowing geothermal fields of Seltun and mystical Kleifervatn lake. Learn about the legendary elves and trolls believed to roam this lunar-like terrain as your local guide recounts Iceland's rich folklore. After a full immersion into the peninsula's volcanic vistas, you'll head back to culture-rich Reykjavik for an evening exploring the colorful charms of the world's northernmost capital at your leisure. Alda Hotel, or similar, Reykjavik Breakfast Show more about day 6 Alda Hotel, or similar, Reykjavik Breakfast Day 7 Snæfellsnes Peninsula Snæfellsjökull volcano. Today we'll delve into the storybook landscapes of the Snæfellsnes Peninsula, your home for the next two nights. But first, a detour to the spellbinding Borgarfjordur region to witness the mesmerizing waterfalls of Hraunfossar and Barnafossar, where crystalline rivulets seem to magically appear from beneath ancient lava fields. Then it's onward to the peninsula's crown jewel - the glacier-cloaked Snæfellsjökull volcano, which looms large as the fabled "journey to the center of the earth" entry point imagined by Jules Verne. At its base lies Gufuá Farm, tucked amidst lush birch forests, salmon-rich rivers, and gorges sculpted by ancient glaciers. You'll practically be able to hear the echoes of the Peninsula's infamous Viking settlers reverberating across the millenias! Read more about day 7 Snæfellsnes Peninsula Snæfellsjökull volcano. Today we'll delv