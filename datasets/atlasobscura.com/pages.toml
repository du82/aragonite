["https://atlasobscura.com/articles/skulls-art-ron-mueck-ngv-triennial"]
title = "This Australian Art Museum Is Filled With Giant Skulls - Atlas Obscura"
description = "Sculptor Ron Mueck's work echoes the use of skulls in Western art history."
full_description = '''This Australian Art Museum Is Filled With Giant Skulls Sculptor Ron Mueck’s work echoes the use of skulls in Western art history. by Sarah Laskow January 16, 2018 This Australian Art Museum Is Filled With Giant Skulls Copy Link Facebook Twitter Reddit Flipboard Pocket function copyURLWithConfirm () { copyCurrentUrlToClipboard(); $('.DDPNavbarItem[data-toggle="tooltip"]').tooltip('show'); window.setTimeout(function () { $('.DDPNavbarItem[data-toggle="tooltip"]').tooltip('destroy'); }, 1500) } $(function (){ $('.js-BTFNav__popover-trigger').popover({ trigger: 'click', html: true, placement: 'bottom', template: '<div class="BTFNav__share-popover popover" role="tooltip"><div class="arrow"></div><h3 class="popover-title"></h3><div class="popover-content"></div></div>', content: function () { return $($('.js-BTFNav__popover-content').html()); }, delay: { hide: 100 } }); }) In This Story Place Phnom Penh Memorial Stupa 5,000 skulls in memorial to those killed by the Khmer Rouge. Place Catacombes de Paris The vast, legendary catacombs hold secrets much stranger than stacked bones. Installation view of Mass by Ron Mueck, 2017 on display at NGV Triennial at NGV International, 2017 Sean Fennessy Sculptor Ron Mueck started off creating figures that weren’t meant to be human, exactly. They were puppets and dolls, often meant for children’s television and film. As an artist, though, his primary concern has been the human body: His first major work, “Dead Dad,” was a sculpture of his father, who had recently passed away. That first work was about half the size of a real-life human. Some of his works are larger than life, but they’re never to human scale. “I never made life-size figures because it never seemed to be interesting. We meet life-size people every day,” he told Sculpture magazine. Installation view of Mass by Ron Mueck, 2017 on display at NGV Triennial at NGV International, 2017 Eugene Hyland For an installation now on view at the National Gallery of Victoria Triennial, Mueck created 100 giant human skulls, which are piled around and on top of each other. The work, the museum notes, recalls the piles of bones in the Paris catacombs, as well as the killing fields of Cambodia and other places where people have slaughtered each other en masse. The skull has a long history as a symbol in Western art, too. In the still life paintings of the 16th and 17th centuries, skulls would represent the certainty of death and the fleetingness of life on Earth. But these shapes also have an aesthetic allure. The work, according to NGV, was “inspired by the complex biological structure of the human skull—which the artist considers beautiful and extraordinary.” Installation view of Mass by Ron Mueck, 2017 on display at NGV Triennial at NGV International, 2017 Tom Ross Installation view of Mass by Ron Mueck, 2017 on display at NGV Triennial at NGV International, 2017 Sean Fennessy Installation view of Mass by Ron Mueck, 2017 on display at NGV Triennial at NGV International, 2017 Sean Fennessy Installation view of Mass by Ron Mueck, 2017 on display at NGV Triennial at NGV International, 2017 Tom Ross var bodyViewedPercentageLogger = debounce( function() { logPercentBelowViewport( $('#article-body'), 'contentViewed' ); // Chase campaign: Simple Reach reporting %> // END Chase campaign }, 16); $(window).on('scroll resize', bodyViewedPercentageLogger); Read next Watch a Man Masterfully Flip Roti Prata Into Perfection He makes it look so easy. skullsnewsart Want to see fewer ads? Become a Member. Want to see fewer ads? Become a Member.'''
