["https://atlasobscura.com/articles/britain-englad-braeburn-apples-big-fruit-weather"]
title = "The Story Behind Britain's Unexpected Mega-Apples - Gastro Obscura"
description = "How one of the country's favorite apples went from pint-sized to pound-sized."
full_description = '''The Story Behind Britain’s Unexpected Mega-Apples How one of the country’s favorite apples went from pint-sized to pound-sized. by Anne Ewbank December 8, 2017 The Story Behind Britain's Unexpected Mega-Apples Copy Link Facebook Twitter Reddit Flipboard Pocket function copyURLWithConfirm () { copyCurrentUrlToClipboard(); $('.DDPNavbarItem[data-toggle="tooltip"]').tooltip('show'); window.setTimeout(function () { $('.DDPNavbarItem[data-toggle="tooltip"]').tooltip('destroy'); }, 1500) } $(function (){ $('.js-BTFNav__popover-trigger').popover({ trigger: 'click', html: true, placement: 'bottom', template: '<div class="BTFNav__share-popover popover" role="tooltip"><div class="arrow"></div><h3 class="popover-title"></h3><div class="popover-content"></div></div>', content: function () { return $($('.js-BTFNav__popover-content').html()); }, delay: { hide: 100 } }); }) In This Story Destination Guide England 144 Articles 2164 Places Two Braeburns, side by side. Morrisons Over the next two weeks, British supermarket Morrisons will be selling unexpectedly supersized apples. Red-yellow Braeburn apples are known for their tart flavor, and not usually for their size. But unusual climate conditions this year resulted in some giant fruits. According to a Morrisons press release, their 120,000 mega-Braeburns will be the largest apples the store has ever sold. A typical Braeburn apple, per Morrisons, weighs around 170 grams, or nearly six ounces. But the big Braeburns weigh almost a pound. In terms of number of apples, however, the Braeburn crop was smaller than in years past. The explanation seems to lie in 2017’s erratic weather. Winter didn’t let up its grip in Britain until relatively late, leading to fears back in May that the year’s whole fruit crop would be stunted. It’s the biggest apple the supermarket has ever sold. Morrisons Dr. Theodore DeJong has an idea of what happened. He’s a pomologist emeritus at UC Davis (pomology is the study of fruit trees), and he believes that the April frost destroyed many apple flowers. Usually, he says, there are five apple flowers on the end of each tree shoot. But if cold weather (like this year’s frost) or an apple grower removes flowers early in the season, trees can provide more nutrients to the remaining fruits. The result is bigger apples. Giant fruit is also more achievable in northern latitudes. With long summer days along with cool temperatures, trees get lots of sunlight but don’t use up sugars as quickly. Giant apples might not be the end of it, either. “Many fruit have a greater potential to grow large than we often see in the supermarket,” DeJong says. But they rarely reach their maximum size because too many are left on the tree. As the climate changes, the effects on agriculture are hard to imagine. As with the Braeburns, we might see larger (but fewer) fruit. Gastro Obscura covers the world’s most wondrous food and drink. Sign up for our regular newsletter. var bodyViewedPercentageLogger = debounce( function() { logPercentBelowViewport( $('#article-body'), 'contentViewed' ); // Chase campaign: Simple Reach reporting %> // END Chase campaign }, 16); $(window).on('scroll resize', bodyViewedPercentageLogger); Read next Found: A Hidden Drawing in Sir Isaac Newton's Childhood Home The famed scientist was known for his habit of using walls as sketchpads. applesweatherclimate changefruittreesplantsfoodnews Want to see fewer ads? Become a Member. Want to see fewer ads? Become a Member.'''
