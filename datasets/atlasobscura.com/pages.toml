["https://atlasobscura.com/places/kuwabara-thunder-well"]
title = "Kuwabara Thunder Well - Atlas Obscura"
description = "Electricians pray for luck at this place where, according to legend, the god of thunder was once trapped."
full_description = '''About In Japanese culture, the mantra of kuwabara kuwabara is traditionally uttered when one hears the sound of thunder, or to ward off bad luck and disasters. It is similar to the English phrases knock on wood, but its literal meaning is "mulberry field." Kuwabara is also a common place name and many of such places claim to be the origin of the phrase. Kuwabara in the city of Izumi, Osaka, is one of them, and there exists a storied well to seemingly back up this claim. Tucked away in the grounds of Saifuku-ji Temple, the "Thunder Well" of Kuwabara is nothing but an unassuming well without context. According to local legend, however, the God of Thunder once fell into this well just as a monk performed a rain-making ritual, and trapped inside by an old laundrywoman. Thunder begged for mercy, and the laundrywoman let him go on condition that it would never strike Kuwabara again. It is said that Kuwabara has never been hit by a lightning since then, and that this legend is the origin of the mantra kuwabara kuwabara. Interestingly, due to the temple's association with thunder, electricians are also known to come here to pray for good luck. (function () { if (document.querySelector(".place-body-ad")) return; const script = document.createElement("script"); script.async = true; script.id = "AV66a0ba0179e14f55900231eb"; script.type = "text/javascript"; script.src = "https://tg1.ad-adapex.io/api/adserver/spt?AV_TAGID=66a0ba0179e14f55900231eb&AV_PUBLISHERID=61236c658d8f39735560c155"; const adContainer = document.createElement("div"); adContainer.classList.add("flex", "flex-col", "items-center", "justify-center", "place-body-ad"); adContainer.appendChild(script); const firstP = document.querySelector( ".place-body p:first-of-type" ); if (firstP) { firstP.insertAdjacentElement("afterend", adContainer); } })(); Related Tags Legends Temples Know Before You Go Visitors are asked to behave respectfully at this active place of worship. Atlas Obscura Adventures