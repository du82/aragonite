full_description = '''Bosnia and Herzegovina • 9 days, 8 nights Balkans Road Trip: Serbia, Croatia & Bosnia and Herzegovina From $3,870 USD Iceland • 10 days, 9 nights Iceland in Summer: Journey through the South Coast & the Westman Islands From $6,830 USD Armenia • 15 days, 14 nights NEW - Caucasus Road Trip: Azerbaijan, Georgia & Armenia From $5,435 USD Trip Navigation Overview Itinerary Dates Info From $3,930 USD See dates Contact us Overview Legends of Romania: Castles, Ruins & Culinary Delights Continent Europe Days 12 days Nights 11 nights Group Size 12 people Activity Easy Interest History & Culture Created in Partnership with Unlock the secrets of Romania's magnificent medieval castles, citadels and ruins, from Bucharest to Transylvania. See for yourself the complex legacy that’s been left behind by Communist rule and a millennia of invasions, counter-invasions and occupations. Fall in love with the spellbinding landscapes of rural Romania and the Carpathian mountains and taste its culinary treasures from tangy ciorbă (sour soup) to scrumptious plum brandy. Hidden Wonders: Take a walk through Hoia-Baciu, a haunted-feeling forest sometimes called "Romania's Bermuda Triangle." Travel with Purpose: Visit the village of Viscri and its Fortified Church. where we learn about its many purposes throughout the years in preserving local heritage and economic sustainability in rural Transylvania and Maramures. Join us on our October departures for a Halloween-themed adventure Highlights Walk in the footsteps of Vlad the Impaler at "Dracula's Castle." Explore the Belle Époque streets of Bucharest and see inside Ceaușescu’s Palace. Discover Romania’s prettiest towns and villages, from Brașov to Sighișoara. Take a boat ride around an underground lake at Salina Turda salt mine. Absorb the Neo-Renaissance splendor of Peleș Castle, once home to the Romanian royal family. Visit the Viscri village with an organization dedicated to preserving local heritage. Take a walk through Hoia-Baciu, a haunted-feeling forest sometimes called "Romania's Bermuda Triangle." Romania • 12 days • 11 nights Discover Romania's Medieval Castles & Culture. Day 1 Welcome to Bucharest! Street scene in Bucharest. Bună ziua! After settling into your hotel, enjoy a welcome dinner in a historic restaurant with the rest of your travel companions and your local guide. Then you can choose to get an early night’s sleep or go out and explore Bucharest by night. Ask your guide to recommend their favorite night time haunts in the city. Read more about day 1 Welcome to Bucharest! Street scene in Bucharest. Bună ziua! After settling into your hotel, enjoy a welcome dinner in a historic restaurant with the rest of your travel companions and your local guide. Then you can choose to get an early night’s sleep or go out and explore Bucharest by night. Ask your guide to recommend their favorite night time haunts in the city. Grand Hotel Continental or or similar, Bucharest Welcome Dinner Show more about day 1 Grand Hotel Continental or or similar, Bucharest Welcome Dinner Day 2 Exploring Bucharest Palace of Parliment. Get to know Bucharest this morning, on a walking tour of the capital city once dubbed “the Paris of Eastern Europe.” You’ll see the Romanian Athenaeum, wander around the old town, wander around Piata Unirii, one of Europe's largest squares, and explore the seemingly never-ending interior of the Palace of Parliament, also known as the People's House. Built by the Communist dictator Nicolae Ceaușescu, the Palace boasts 1,100 rooms, hundreds of chandeliers, 220,000 square meters of carpet, and a total area of over 365,000 square meters. Enjoy some free time in the afternoon to rest or explore further on your own. Read more about day 2 Exploring Bucharest Palace of Parliment. Get to know Bucharest this morning, on a walking tour of the capital city once dubbed “the Paris of Eastern Europe.” You’ll see the Romanian Athenaeum, wander around the old town, wander around Piata Unirii, one of Europe's largest squares, and explore the seemingly never-ending interior of the Palace of Parliament, also known as the People's House. Built by the Communist dictator Nicolae Ceaușescu, the Palace boasts 1,100 rooms, hundreds of chandeliers, 220,000 square meters of carpet, and a total area of over 365,000 square meters. Enjoy some free time in the afternoon to rest or explore further on your own. Grand Hotel Continental or similar, Bucharest Breakfast, Lunch Show more about day 2 Grand Hotel Continental or similar, Bucharest Breakfast, Lunch Day 3 Peleș & Bran Castles Bran Fortress, or, &quot;Dracula&#39;s Castle&quot;. Today you’ll visit two of Romania’s most impressive castles. First up, the striking 19th century Peleș Castle, nestled in the foothills of the Bucegi Mountains. This beautiful former summer home of the Romanian royal family boasts 160-plus rooms, including an enormous Weapons Room, Music Room, and a frescoed movie theater. After a tasty lunch at a pretty winery in the Prahova Valley, known for its sparkling rosé, we'll continue on to Bran, a commune in Brașov County. As darkness approaches, we'll take a peek inside the imposing Bran Fortress, also known as ‘Dracula’s Castle.’ While this ancient fortress earned foreign fame thanks to the Irish novelist Bram Stoker, its history is more fascinating than any vampiric folktale. Spend the evening exploring picturesque Brașov by yourself before turning in for the night. Read more about day 3 Peleș & Bran Castles Bran Fortress, or, &quot;Dracula&#39;s Castle&quot;. Today you’ll visit two of Romania’s most impressive castles. First up, the striking 19th century Peleș Castle, nestled in the foothills of the Bucegi Mountains. This beautiful former summer home of the Romanian royal family boasts 160-plus rooms, including an enormous Weapons Room, Music Room, and a frescoed movie theater. After a tasty lunch at a pretty winery in the Prahova Valley, known for its sparkling rosé, we'll continue on to Bran, a commune in Brașov County. As darkness approaches, we'll take a peek inside the imposing Bran Fortress, also known as ‘Dracula’s Castle.’ While this ancient fortress earned foreign fame thanks to the Irish novelist Bram Stoker, its history is more fascinating than any vampiric folktale. Spend the evening exploring picturesque Brașov by yourself before turning in for the night. Aro Palace or similar, Brașov Breakfast, Lunch Special note Halloween Departures: On this spooky Halloween night, you’ll tour Bran castle at night, diving deep into Dracula's history and Bran Castle's haunted tales, then have a delicious Vampire-themed feast in Queen Marie's Tea Room at the foot of the castle. Show more about day 3 Aro Palace or similar, Brașov Breakfast, Lunch Special note Day 4 Brașov Explorations The &#39;Black Church&#39;. Discover the delights of Brașov city center today. Visit the Gothic-style 14th century Biserica Neagră (Black Church), one of the largest churches in Romania, wander around the pretty town square lined with historic buildings, and take a cable car up to Brașov’s version of the Hollywood sign. This afternoon, take some time to relax and wander on your own. Depending on your interests, your guide can suggest and help arrange optional activities—such as a nature trek in the Seven Ladders Canyon. Meet up with your group again in the evening for a meal at one of your guide’s favorite restaurants. Read more about day 4 Brașov Explorations The &#39;Black Church&#39;. Discover the delights of Brașov city center today. Visit the Gothic-style 14th century Biserica Neagră (Black Church), one of the largest churches in Romania, wander around the pretty town square lined with historic buildings, and take a cable car up to Brașov’s version of the Hollywood sign. This afternoon, take some time to relax and wander on your own. Depending on your interests, your guide can suggest and help arrange optional activities—such as a nature trek in the Seven Ladders Canyon. Meet up with your group again in the evening for a meal at one of your guide’s favorite restaurants. Aro Palace or similar, Brașov Breakfast, Dinner Special note October departures will include a private 4-course, vampire-themed dinner and out of hours tour of Bran Castle, diving deep into the castle's many haunted tales. Show more about day 4 Aro Palace or similar, Brașov Breakfast, Dinner Special note Day 5 Viscri to Sighișoara Fortified Church in Transylvania. Your first stop today is Rupea Citadel, one of the most spectacular and best-conserved medieval structures in Transylvania. This massive medieval fortress once sat on the frontlines of the Ottoman expansion into central Europe. You’ll then take a look around the UNESCO World Heritage listed 13th century fortified church in Viscri, a charming rural town in the Transylvanian countryside followed by a relaxed, homemade lunch with a local family. Make a quick stop at King Charles III’s house for tea before heading to the medieval city of Sighișoara. Built at the turn of the 13th century by a group of German settlers known as the Transylvanian Saxons, colorful Sighisoara went on to play a key strategic role in the region. The evening is yours to explore on your own and grab some dinner. Read more about day 5 Viscri to Sighișoara Fortified Church in Transylvania. Your first stop today is Rupea Citadel, one of the most spectacular and best-conserved medieval structures in Transylvania. This massive medieval fortress once sat on the frontlines of the Ottoman expansion into central Europe. You’ll then take a look around the UNESCO World Heritage listed 13th century fortified church in Viscri, a charming rural town in the Transylvanian countryside followed by a relaxed, homemade lunch with a local family. Make a quick stop at King Charles III’s house for tea before heading to the medieval city of Sighișoara. Built at the turn of the 13th century by a group of German settlers known as the Transylvanian Saxons, colorful Sighisoara went on to play a key strategic role in the region. The evening is yours to explore on your own and grab some dinner. Fronius Residence Hotel or similar, Sighișoara Breakfast, Lunch Special note Halloween Departures: Visit the Famous clock tower (known to be haunted) and the house where the famous Wallachian King, Vlad the Impaler, known worldwide as Dracula, born in 1431. End your eerie tour with dinner at a local restaurant. Show more about day 5 Fronius Residence Hotel or similar, Sighișoara Breakfast, Lunch Special note Day 6 Sighisoara Sightseeing Picturesque Sighișoara. Enjoy a guided tour of Sighișoara, a UNESCO world heritage site. See the 14th century Clock Tower that dominates the skyline (and offers 360 views from the top), and climb the 176 creaking covered steps that connect the upper and lower parts of town to reach the so-called Church on the Hill. The afternoon is yours for further exploration or relaxation. Meet up with your group in the evening for dinner. Read more about day 6 Sighisoara Sightseeing Picturesque Sighișoara. Enjoy a guided tour of Sighișoara, a UNESCO world heritage site. See the 14th century Clock Tower that dominates the skyline (and offers 360 views from the top), and climb the 176 creaking covered steps that connect the upper and lower parts of town to reach the so-called Church on the Hill. The afternoon is yours for further exploration or relaxation. Meet up with your group in the evening for dinner. Fronius Residence Hotel or similar, Sighișoara Breakfast, Dinner Show more about day 6 Fronius Residence Hotel or similar, Sighișoara Breakfast, Dinner Day 7 Salt Mine and Medieval Dinner The lights of Salina Turda. Salina Turda is a former salt mine-turned-art theme park, boasting more than 2,000 years of history. Mining here was introduced by the Romans and continued all the way until 1932. The space is now fitted with bright lights and pedestrian walkways, not to mention an amphitheater, ferris wheel, and underground lake. You’ll have an opportunity to row across the lake, which is 400 feet below the Earth’s surface, and possibly ride the ferris wheel too. After lunch, head to the unofficial capital of Transylvania - Cluj-Napoca. Tonight, enjoy a traditional Transylvanian feast. Read more about day 7 Salt Mine and Medieval Dinner The lights of Salina Turda. Salina Turda is a former salt mine-turned-art theme park, boasting more than 2,000 years of history. Mining here was introduced by the Romans and continued all the way until 1932. The space is now fitted with bright lights and pedestrian walkways, not to mention an amphitheater, ferris wheel, and underground lake. You’ll have an opportunity to row across the lake, which is 400 feet below the Earth’s surface, and possibly ride the ferris wheel too. After lunch, head to the unofficial capital of Transylvania - Cluj-Napoca. Tonight, enjoy a traditional Transylvanian feast. Hotel Beyfin or similar, Cluj Napoca Breakfast, Dinner Show more about day 7 Hotel Beyfin or similar, Cluj Napoca Breakfast, Dinner Day 8 The Haunted Forest Hoia-Baciu Forest, Daniel Mirlea/Alamy Explore the most haunted forest in the world today. There is an eerie atmosphere at Hoia-Baciu Forest. According to local legends, ghosts and spirits lurk among the crooked trees, but most modern-day Romanians ignore the myths and simply enjoy the beauty of the area, which has become a recreational space. Enjoy a bit of free time before another group dinner this evening. Read more about day 8 The Haunted Forest Hoia-Baciu Forest, Daniel Mirlea/Alamy Explore the most haunted forest in the world today. There is an eerie atmosphere at Hoia-Baciu Forest. According to local legends, ghosts and spirits lurk among the crooked trees, but most modern-day Romanians ignore the myths and simply enjoy the beauty of the area, which has become a recreational space. Enjoy a bit of free time before another group dinner this evening. Hotel Beyfin or similar, Cluj Napoca Breakfast, Dinner Show more about day 8 Hotel Beyfin or similar, Cluj Napoca Breakfast, Dinner Day 9 Hunedoara Castle Hunedoara Castle. Discover the tranquil village of Coltesti in the Trascău Mountains this morning. Enjoy a guided walk around the village, which offers picturesque panoramas of the surrounding landscape. Then try traditional Szekler food for lunch. Visit one of the largest castles in Europe later today. Hunedoara Castle, also known as Corvinilor or Corvin Castle, was built in 1446 by Ioan de Hunedoara, ruler of Transylvania and Regent of Hungary. Roam the castle’s interiors, including its watchtowers, and bedrooms, and see the ‘bear pit,’ where prisoners and traitors were said to have been thrown in. The rest of your day is yours to delve deeper into the secrets of Hunedoara. Read more about day 9 Hunedoara Castle Hunedoara Castle. Discover the tranquil village of Coltesti in the Trascău Mountains this morning. Enjoy a guided walk around the village, which offers picturesque panoramas of t'''
