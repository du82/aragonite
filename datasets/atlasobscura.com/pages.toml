title = "Cannon of Banastarim - Atlas Obscura"
description = "This 16th-century cannon is thought to be the oldest piece of forge-welded wrought iron in India."
full_description = '''About On the promenade in Campal, a neighborhood in the western area of Panaji, one can see a huge cannon opposite Dr. F. L. Gomes Garden. In 1515, the Cannon of Banastarim, sometimes referred to as the Cannon at Campal, would have been a force to be reckoned with in Goa. Fernando Anes, also known as Francisco Anes, was behind the design of this particular masterpiece. A nearly identical cannon, thought to also represent his handiwork, resides in the Lisbon Military Museum in Portugal. The Portuguese brought this formidable piece of military technology to the Subcontinent, changing the rules of warfare in the process. Not only is this cannon possibly the oldest datable cannon in India, but it's also considered the earliest piece of forge-welded wrought iron in India. Although it now lies dormant, it is believed to been used against the Turkish forces of Adil Shah of Bijapur. (function () { if (document.querySelector(".place-body-ad")) return; const script = document.createElement("script"); script.async = true; script.id = "AV66a0ba0179e14f55900231eb"; script.type = "text/javascript"; script.src = "https://tg1.ad-adapex.io/api/adserver/spt?AV_TAGID=66a0ba0179e14f55900231eb&AV_PUBLISHERID=61236c658d8f39735560c155"; const adContainer = document.createElement("div"); adContainer.classList.add("flex", "flex-col", "items-center", "justify-center", "place-body-ad"); adContainer.appendChild(script); const firstP = document.querySelector( ".place-body p:first-of-type" ); if (firstP) { firstP.insertAdjacentElement("afterend", adContainer); } })(); Related Tags Colonialism Military History War History Weapons Know Before You Go The cannon is located on the promenade opposite Dr. F. L. Gomes Garden. Atlas Obscura Adventures Delhi and Rajasthan: Colors of India Discover Colorful Rajasthan: From Delhi to Jaipur and Beyond. Book Now Community Contributors Added By Vivek Gadre Edited By samus samus Published January 31, 2025 Edit this listing Make an Edit Add