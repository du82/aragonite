["https://atlasobscura.com/membership"]
title = "Atlas Obscura Membership"
description = "Atlas Obscura members directly support our mission of inspiring wonder and curiosity about the incredible world we all share. In these uncertain times, it's more important than ever that we keep that sense of wonder alive. Our new membership program aims to unite our community so that Atlas Obscura can continue to thrive."
full_description = '''Membership Join the Atlas Obscura Membership Program! Atlas Obscura's mission has always been to inspire wonder and curiosity about the incredible world we all share. Atlas Obscura Membership is your passport to even more wonder and curiosity, no matter where you are! By becoming a member, you're joining a community of like-minded explorers who believe deeply in our shared mission, and you're gaining exclusive access to benefits including: A $100 credit toward your next Atlas Obscura Trip An exclusive badge on your Atlas Obscura account profile Monthly members-only newsletter featuring the best of Atlas Obscura Far fewer ads and no pop-ups Become a Member Pick your price, with monthly payments starting at just $5 per month. Monthly $5/month $10/month $20/month $50/month Annual $50/year $100/year $200/year $500/year If you have any questions, please email us at membership@atlasobscura.com. FAQ What is the difference between payment amounts? All members receive the same perks no matter the payment amount. Our increased payment options simply allow you to further contribute to Atlas Obscura, should you desire. What is the difference between my current free Atlas Obscura account and my membership? Your Atlas Obscura account lets you contribute and edit community place pages, and gives you access to our suite of travel tools. Paid members also receive discounts on trips, and see fewer ads on the site. Are Atlas Obscura articles still accessible to non-members? Yes! Our editorial content will remain free and accessible to everyone. How do I redeem my $100 trip credit? After booking your Atlas Obscura trip, send an email to trips@atlasobscura.com and we'll provide instructions for applying the credit. Note that the credit applies to your final payment, not your deposit, so please email us prior to making your final payment. What do you mean by "far fewer ads"? When logged in to your member account, you will only see advertisements from trusted brand partners that Atlas Obscura works with directly. While percentages vary month to month, you can expect a 90% reduction in ads. How do I change the billing information associated with my membership? Memberships automatically renew monthly or annually. If you need to update your billing information please visit your profile and click "Manage Billing". How do I cancel my membership? You are free to cancel your membership at any time. Unfortunately, we are unable to offer full or prorated refunds once you have been charged. To cancel, visit your profile and click "Manage Billing". I have another question. No problem, just email us at membership@atlasobscura.com. We'd love to hear from you. Members will be subscribed to a members-only mailing list. This is to let you know when member events are happening, how to access new features before anyone else, and other announcements related to being a member. You'll also receive emails from our payment processor Stripe regarding your payment, including invoices and renewal notices. Your email address and personal information will never be given to anyone for any purpose.'''
