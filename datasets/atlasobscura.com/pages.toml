["https://atlasobscura.com/articles/womens-wrongs"]
title = "Women’s Wrongs: Our Favorite Reads - Atlas Obscura"
description = "You can champion women’s rights and still revel in the tales of their most infamous wrongs."
full_description = '''Women’s Wrongs: Our Favorite Reads You can champion women’s rights and still revel in the tales of their most infamous wrongs. by Roxanne Hoorn February 21, 2025 Women’s Wrongs: Our Favorite Reads Copy Link Facebook Twitter Reddit Flipboard Pocket function copyURLWithConfirm () { copyCurrentUrlToClipboard(); $('.DDPNavbarItem[data-toggle="tooltip"]').tooltip('show'); window.setTimeout(function () { $('.DDPNavbarItem[data-toggle="tooltip"]').tooltip('destroy'); }, 1500) } $(function (){ $('.js-BTFNav__popover-trigger').popover({ trigger: 'click', html: true, placement: 'bottom', template: '<div class="BTFNav__share-popover popover" role="tooltip"><div class="arrow"></div><h3 class="popover-title"></h3><div class="popover-content"></div></div>', content: function () { return $($('.js-BTFNav__popover-content').html()); }, delay: { hide: 100 } }); }) Marm Mandelbaum, who ran her own school for criminals, is among one of many women making history in all the wrong ways. LC-DIG-ppmsca-28344 / Library of Congress / Public Domain “Well-behaved women seldom make history.” So said Laurel Thatcher Ulrich, a historian whose work demonstrates that women’s important contributions to society are often overlooked. Taken wildly out of context, the quote could apply to any of the women highlighted in our five stories below. Often born into struggle and fed up with the men who underestimated them, these women stole, schemed, and conned their way into history. The Victorian Influencer Who Peddled Poisonous Beauty Elixirs By Sabrina Imbler Sarah Rachel Russell grew up poor in London’s East End. After selling rabbit furs, working as a fortune teller, and a brief stint as a prostitute, she set her sights on the beauty industry. Russell sold exotic makeup with a dark twist: it contained a heavy dose of highly toxic arsenic. How the ‘Queen of Thieves’ Conned French Riviera Wealthy By Caroline Elenowitz-Hess From the late 19th century into the early 20th century, Comtesse de Monteil—a cat burglar, jewel thief, and fake countess—wreaked havoc across the Mediterranean’s most lavish tourist destinations. She led a crew of highly skilled thieves, targeting only the wealthiest of victims and establishments until her arrest in 1908. The French Riviera has been synonymous with glitz and glamour for well over a century, including in 1880, when this image of its famed promenade was taken. Boudet Editeur 38, Av. de la Gare / Public Domain How We Forgot the Bobbed Haired Bandit By Lauren Young The Roaring ‘20s were known for jazz music, speakeasies, and a new generation of female criminals. Celia Cooney wasn’t America’s only “Bobbed Haired Bandit,” just one of several robbers the press glorified as provocative women’s rights icons. Was Minnie Dean Really the Wickedest Woman in New Zealand History? By Natasha Frost The only woman ever executed in New Zealand, Minnie Dean, was labeled a baby farmer, a murderer, and a monster—but was she really any of these things? What we do know is that Frost took in kids without a home, 17 died in her care, and three were buried in her garden. Was she a killer, a crook, or a woman doing what she could to help? Enterprising people sold baby dolls in hatboxes outside the trial. NZ History / Public Domain New York’s First Female Crime Boss Started Her Own Crime School By Eric Grundhauser Prussian immigrant Marm Mandelbaum, also known as the Queen of Fences, was one of the most influential crime bosses in New York’s history. Not only was she well-versed as a con artist and financial fraud, but she started her own school of crime for young people living on the streets. var bodyViewedPercentageLogger = debounce( function() { logPercentBelowViewport( $('#article-body'), 'contentViewed' ); // Chase campaign: Simple Reach reporting %> // END Chase campaign }, 16); $(window).on('scroll resize', bodyViewedPercentageLogger); Read next The Artist Who Turned Dublin's Pubs Into Galleries Harry Kernoff found inspiration and camaraderie in the city's watering holes. our favorite readswomen's historycrimewomen Want to see fewer ads? Become a Member. Want to see fewer ads? Become a Member.'''
