full_description = "Community Guidelines Last updated August 5, 2022 At Atlas Obscura, our highly engaged audience regularly communicates with us on our owned and operated site and social media channels. We wouldn’t exist without that community, and encourage the exchange of intelligent and informed commentary on our channels. Negative comments will remain posted as long as they adhere to our community standards. To keep our community a welcome place for all people, we’ve put the following guidelines in place, in addition to our community standards on each social platform: Keep it civil: We encourage respectful, productive conversations within our community. No name-calling, abusive language, or personal attacks. Harassment, trolling, and doxxing will not be tolerated. Exploration is for everyone: No racism, sexism, homophobia, or any other kind of discriminatory language is permitted. Stay on topic: No spam, promotional content, or comments irrelevant to the post or discussion at hand. If you have a problem with a comment or user, please reach out to an admin or moderator for review."
