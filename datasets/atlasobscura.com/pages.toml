title = "Café De Dokter - Atlas Obscura"
description = "The smallest bar in Amsterdam has stayed in the family since 1798."
full_description = 'About Tucked away just a few steps from the bustling Kalverstraat, Amsterdam’s main shopping street, Café de Dokter (literally meaning ‘The Doctor’) is more than just another traditional Dutch brown bar with dark wood paneling and furnishings. Founded in 1798 by a surgeon from a nearby hospital, the bar initially served as a meeting point for doctors and medical students. More than two centuries later, it attracts a more diverse public but is still run by the seventh generation of that same family. You will be greeted by Maria and Henry, an elderly couple who treat this bar as their second living room. They took over the bar’s management from Maria’s parents, who worked there for almost 50 years, carrying on the family tradition. The locals fondly call this spot ‘Het Doktertje’ (‘The Little Doctor’), and this diminutive reflects the tiny size of the bar. With an 18 square-meter area, ‘Het Doktertje’ is considered the smallest bar in Amsterdam, or at least one of the smallest—but it is not its only quirk. The interior is filled with antique trinkets, from clocks to bird cages to old-fashioned lusters, intentionally covered by a thick layer of dust (but the glasses for guests are crystal clear). Anytime you come here, you will hear the sounds of jazz and have a chance to try the ‘Dokters Recept’ jenever — a variation of the traditional Dutch juniper-flavored alcoholic beverage, made according to an old family recipe. Of course, simply drinking a beer or two is also possible. (function () { if (document.querySelector(".place-body-ad")) return; const script = document.createElement("script"); script.async = true; script.id = "AV66a0ba0179e14f55900231eb"; script.type = "text/javascript"; script.src = "https://tg1.ad-adapex.io/api/adserver/spt?AV_TAGID=66a0ba0179e14f55900231eb&AV_PUBLISHERID=61236c658d8f39735560c155"; const adContainer = document.createElement("div"); adContainer.classList.add("flex", "flex-col", "items-center", "justify-center", "place-body-ad"); adContainer.appendChild(script); const firstP = document.querySelector( ".place-body p:first-of-type" ); if (firstP) { firstP.insertAdjacentElement("afterend", adContainer); } })(); Related Tags Time Capsule Bar Know Before You Go The bar is open Wednesday through Saturday from 4 p.m. till 1 a.m. Community Contributors Added By Olga Lisina Edited By Vicki Arkoff Vicki Arkoff Published February 14, 2025 Edit this listing Make an Edit Add Photos Sources https://www.facebook.com/p/Cafe-De-Dokter-100063656104401/ https://www.parool.nl/ps/cafe-t-doktertje-wil-nooit-subsidie-dan-worden-we-erfgoed-en-moeten-er-perzische-kleedjes-op-tafel-en-levensliederen-aan~b4bda639/'
