k is busy. Req’s 0% APR 36-mo. agmt. Well-qualified customers. 128GB for $5.99/mo. after credits over 36 mos. Credits start w/in 3 bills. If svc cancelled, credits stop & device balance due. For new lines, if svc. on other lines cancelled w/in 90 days credits stop. No credit for optional $10/mo. Next Up Anytime upgrade feature, if applicable. $35 Activ./Upgrade, taxes & other terms apply."
