description = "AT&T Fiber is rated #1 in perceived value. Get the fastest internet plans, including speeds up to 2 GIG & 5 GIG, with no annual contract and no data caps."
full_description = "Fiber broadband (sometimes called Fiber internet) is an internet service delivered over fiber optic cable. This is different from traditional cable internet, which transmits information by sending data over copper wires. Fiber has the potential to transmit data at faster speeds than DSL or cable-based internet.In particular, AT&T Fiber now delivers the fastest internet service of any major provider¹, with speeds of up to 5 GIGs. These days, we rely on the internet for so many important tasks. We use our internet connection to check the news, stream entertainment, telecommute for work, stay in touch with loved ones, play video games, and much more. It’s understandable to expect fast, reliable internet. To provide this level of service, AT&T Fiber offers five plans: Internet 300, Internet 500, Internet 1000, 2 GIG Internet, and 5 GIG Internet. Put your devices into a Wi-Fi® fast lane with our intelligent Smart Home Manager app¹. The app lets you set parental controls, track data usage by device, and manage screen time², all in one place. Fiber optic internet is a type of internet service where information is delivered over fiber optic cables. This is different from traditional cable internet, which typically delivers information over copper wires. You can read answers to common questions here. Fiber internet is internet service brought into your home by high-speed fiber-optic cables.Wi-Fi technology allows that internet service to be used wirelessly with Wi-Fi enabled devices. Your Wi-Fi devices, such as smartphones and laptops, connect wirelessly to your Wi-Fi router instead of using an ethernet cable. Hyper-gig internet represents a family of plans that includes 1 GIG, 2 GIG and 5 GIG internet speed tiers available from AT&T. All three hyper-gig plans also include AT&T All-Fi, a next-generation Wi-Fi experience for all of your devices.1 If you’re interested, you can go here to see if hyper-gig speeds might be available at your address.2 AT&T Fiber installation may require a technician to come to your home, even if you already have other AT&T services. Fiber services require different types of cable and equipment, and the technician will upgrade the internet lines to your home to be sure you have our most up-to-date fiber optic technology."
