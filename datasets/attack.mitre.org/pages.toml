["https://attack.mitre.org/resources/learn-more-about-attack"]
title = "Learn More About ATT&CK | MITRE ATT&CK®"
full_description = "The featured presentations highlight applications, new techniques, and current topics of interest to ATT&CK. All MITRE presentations were developed by members of the ATT&CK team at MITRE. This presentation from Black Hat walks through the story of a fictional organization in order to explain how different teams can use ATT&CK as a powerful force to improve defenses. This presentation introduces ATT&CK's newer categorization of Campaigns - a method of classification that more easily enables the tracking of the abilities and sophistication over time, in addition to enabling stakeholders to better identify potential targets based on industry. This presentation provides a high-level explanation of the ATT&CK framework for MacOS and its components, then walks through the application of the ATT&CK framework to a real-world campaign using Pandas as a model. Emphasizes community-driven aspects of ATT&CK. Using MITRE ATT&CK for Cyber Threat Intelligence Training by Katie Nickels and Adam Pennington provides several modules to help you learn how to apply ATT&CK and improve your threat intelligence practices. These materials provide an in-depth look at why we created these ATT&CK domains, how we maintain and update them, and what the community commonly uses them for. This paper outlines the process MITRE used to create ATT&CK, and the philosophy that has developed for curating new content. For individuals already familiar with ATT&CK, this document can be viewed as an extension to the ATT&CK Design and Philosophy whitepaper above that highlights unique, as well as some common, aspects of the design and philosophy of ATT&CK for ICS."
year_published = 2025
