["https://attack.mitre.org/techniques/T1001"]
title = "Data Obfuscation, Technique T1001 - Enterprise | MITRE ATT&CK®"
description = "Adversaries may obfuscate command and control traffic to make it more difficult to detect.[1] Command and control (C2) communications are hidden (but not necessarily encrypted) in an attempt to make the content more difficult to discover or decipher and to make the communication less conspicuous and hide commands from being seen. This encompasses many methods, such as adding junk data to protocol traffic, using steganography, or impersonating legitimate protocols."
full_description = 'Adversaries may obfuscate command and control traffic to make it more difficult to detect.[1] Command and control (C2) communications are hidden (but not necessarily encrypted) in an attempt to make the content more difficult to discover or decipher and to make the communication less conspicuous and hide commands from being seen. This encompasses many methods, such as adding junk data to protocol traffic, using steganography, or impersonating legitimate protocols. DarkGate will retrieved encrypted commands from its command and control server for follow-on actions such as cryptocurrency mining.[2] Gamaredon Group has used obfuscated VBScripts with randomly generated variable names and concatenated strings.[5] Okrum leverages the HTTP protocol for C2 communication, while hiding the actual messages in the Cookie and Set-Cookie headers of the HTTP requests.[7] During Operation Wocao, threat actors encrypted IP addresses used for "Agent" proxy hops with RC4.[8] RDAT has used encoded data within subdomains as AES ciphertext to communicate from the host to the C2.[9] SLOTHFULMEDIA has hashed a string containing system information prior to exfiltration via POST requests.[11] Network intrusion detection and prevention systems that use network signatures to identify traffic for specific adversary malware can be used to mitigate some obfuscation activity at the network level. Analyze network data for uncommon data flows (e.g., a client sending significantly more data than it receives from a server). Processes utilizing the network that do not normally have network communication or have never been seen before are suspicious. Analyze packet contents to detect communications that do not follow the expected protocol behavior for the port that is being used. [13]'
year_published = 2025
clearnet = "https://attack.mitre.org/techniques/T1001"
