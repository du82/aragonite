["https://attack.mitre.org/datasources"]
title = "Data Sources | MITRE ATT&CK®"
full_description = "Data sources represent the various subjects/topics of information that can be collected by sensors/logs. Data sources also include data components, which identify specific properties/values of a data source relevant to detecting a given ATT&CK technique or sub-technique. A database and set of services that allows administrators to manage permissions, access to network resources, and stored data objects (user, group, application, or devices) Events collected by third-party services such as mail servers, web applications, or other appliances (not by the native OS or platform) Data sources with information about the set of devices found within the network, along with their current software and configurations A digital document, which highlights information such as the owner's identity, used to instill trust in public keys used while encrypting network communications Infrastructure, platforms, or software that are hosted on-premise or by third-party providers, made available to users through network connections and/or APIs Data object storage infrastructure hosted on-premise or by third-party providers, made available to users through network connections and/or APIs A directive given to a computer program, acting as an interpreter of some kind, in order to perform a specific task A standard unit of virtualized software that packages up code and all its dependencies so the application runs quickly and reliably from one computing environment to another Information obtained (commonly through registration or activity logs) regarding one or more IP addresses registered with human readable names (ex: mitre.org) A non-volatile data storage device (hard drive, floppy disk, USB flash drive) with at least one formatted partition, typically mounted to the file system and/or assigned a drive letter A computer program that operates or controls a particular type of device that is attached to a computer. Provides a software interface to hardware devices, enabling operating systems and other computer programs to access hardware functions without needing to know precise details about the hardware being used"
