["https://attack.mitre.org/techniques/T1001/002"]
title = "Data Obfuscation: Steganography, Sub-technique T1001.002 - Enterprise | MITRE ATT&CK®"
description = "Adversaries may use steganographic techniques to hide command and control traffic to make detection efforts more difficult. Steganographic techniques can be used to hide data in digital messages that are transferred between systems. This hidden information can be used for command and control of compromised systems. In some cases, the passing of files embedded using steganography, such as image or document files, can be used for command and control."
full_description = "Adversaries may use steganographic techniques to hide command and control traffic to make detection efforts more difficult. Steganographic techniques can be used to hide data in digital messages that are transferred between systems. This hidden information can be used for command and control of compromised systems. In some cases, the passing of files embedded using steganography, such as image or document files, can be used for command and control. When the Duqu command and control is operating over HTTP or HTTPS, Duqu uploads data to its controller by appending it to a blank JPG file.[3] LightNeuron is controlled via commands that are embedded into PDFs and JPGs using steganographic methods.[5] LunarMail can parse IDAT chunks from .png files to look for zlib-compressed and AES encrypted C2 commands.[6] During Operation Ghost, APT29 used steganography to hide the communications between the implants and their C&C servers.[7] RDAT can process steganographic images attached to email messages to send and receive C2 commands. RDAT can also embed additional messages within BMP images to communicate with the RDAT operator.[8] SUNBURST C2 data attempted to appear as benign XML related to .NET assemblies or as a faux JSON blob.[10][11][12] ZeroT has retrieved stage 2 payloads as Bitmap images that use Least Significant Bit (LSB) steganography.[13][14] Network intrusion detection and prevention systems that use network signatures to identify traffic for specific adversary malware can be used to mitigate some obfuscation activity at the network level. Analyze network data for uncommon data flows (e.g., a client sending significantly more data than it receives from a server). Processes utilizing the network that do not normally have network communication or have never been seen before are suspicious. Analyze packet contents to detect communications that do not follow the expected protocol behavior for the port that is being used.[15]"
year_published = 2025
clearnet = "https://attack.mitre.org/techniques/T1001/002"
