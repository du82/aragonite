["https://www.atticabank.gr/el/companies/anaptyxiaka-programmata/programmata-ellinikis-anaptyxiakis-trapezas/delfi"]
title = "Development Law Financial Instrument Guarantee Fund (DeLFI GF) - Attica Bank"
description = """
Η Δράση αφορά στη χορήγηση εγγυημένων δανείων ύψους μέχρι €10.000.000 με ευνοϊκούς όρους στις ελληνικές ΜμΕ , για την υλοποίηση των εγκεκριμένων/ενταγμένων  επενδυτικών τους σχεδίων σε καθεστώς του ν. 4887/2022 «Αναπτυξιακός Νόμος – Ελλάδα Ισχυρή Ανάπτυξη».
Tα δάνεια θα χορηγούνται προς νεοσύστατες και υφιστάμενες βιώσιμες ΜμΕ με σκοπό α) τη χρηματοδότηση μέρους της ιδιωτικής συμμετοχής του ενταγμένου επενδυτικού πλάνου σε ένα εκ των καθεστώτων του νέου Αναπτυξιακού Νόμου, με τη χορήγηση μεσο-μακροπρόθεσμου δανείου, ή/και β) τη χρηματοδότηση του μέρους της Επιχορήγησης, με τη χορήγηση βραχυπρόθεσμου δανείου . Τα δάνεια θα είναι εγγυημένα από το Ταμείο σε ποσοστό 80%.
Η επιχείρηση μετά την υποβολή αίτησης ένταξης του επενδυτικού της σχεδίου σε ένα εκ των (13) καθεστώτων του νέου Α.Ν. 4887/2022, μπορεί οποιαδήποτε στιγμή να υποβάλλει αίτηση χρηματοδότησης στο Ταμείο. Προϋπόθεση για την υποβολή αίτησης χρηματοδότησης στην πλατφόρμα KYC της ΕΑΤ είναι η ΜΗ έναρξη των εργασιών του επενδυτικού σχεδίου (χαρακτήρας κινήτρου). Η ημερομηνία υπογραφής της δανειακής Σύμβασης δεν θα προηγείται ωστόσο, σε καμία περίπτωση της ημερομηνία της απόφασης υπαγωγής."""
full_description = "Με μια γρήγορη ματιά Με στρατηγικό στόχο την ολοκληρωμένη υποστήριξη της ελληνικής επιχειρηματικότητας ως βασικού μοχλού για την επανεκκίνηση και ανάπτυξη της ελληνικής οικονομίας, η Attica Bank επεκτείνει την υφιστάμενη συνεργασία της με την Ελληνική Αναπτυξιακή Τράπεζα (ΕΑΤ), μέσω της συμμετοχής της στο Ταμείο Εγγυοδοσίας “Development Law Financial Instrument Guarantee Fund (DeLFI GF)”. Η χρηματοδότηση παρέχεται από το Ταμείο Εγγυοδοσίας με την επωνυμία “Development Law Financial Instrument Guarantee Fund (DeLFI GF)” της ΕΑΤ, που χρηματοδοτείται από το Ελληνικό Δημόσιο. Ο στόχος του προγράμματος με μια γρήγορη ματιά Τι αφορά Η Δράση αφορά στη χορήγηση εγγυημένων δανείων ύψους μέχρι €10.000.000 με ευνοϊκούς όρους στις ελληνικές ΜμΕ , για την υλοποίηση των εγκεκριμένων/ενταγμένων επενδυτικών τους σχεδίων σε καθεστώς του ν. 4887/2022 «Αναπτυξιακός Νόμος – Ελλάδα Ισχυρή Ανάπτυξη». Tα δάνεια θα χορηγούνται προς νεοσύστατες και υφιστάμενες βιώσιμες ΜμΕ με σκοπό α) τη χρηματοδότηση μέρους της ιδιωτικής συμμετοχής του ενταγμένου επενδυτικού πλάνου σε ένα εκ των καθεστώτων του νέου Αναπτυξιακού Νόμου, με τη χορήγηση μεσο-μακροπρόθεσμου δανείου, ή/και β) τη χρηματοδότηση του μέρους της Επιχορήγησης, με τη χορήγηση βραχυπρόθεσμου δανείου . Τα δάνεια θα είναι εγγυημένα από το Ταμείο σε ποσοστό 80%. Η επιχείρηση μετά την υποβολή αίτησης ένταξης του επενδυτικού της σχεδίου σε ένα εκ των (13) καθεστώτων του νέου Α.Ν. 4887/2022, μπορεί οποιαδήποτε στιγμή να υποβάλλει αίτηση χρηματοδότησης στο Ταμείο. Προϋπόθεση για την υποβολή αίτησης χρηματοδότησης στην πλατφόρμα KYC της ΕΑΤ είναι η ΜΗ έναρξη των εργασιών του επενδυτικού σχεδίου (χαρακτήρας κινήτρου). Η ημερομηνία υπογραφής της δανειακής Σύμβασης δεν θα προηγείται ωστόσο, σε καμία περίπτωση της ημερομηνία της απόφασης υπαγωγής. Προϋπολογισμός δράσης Ανέρχεται στο συνολικό ποσό των εκατό εκατομμυρίων Ευρώ (€100.000.000,00) και θα χρηματοδοτηθεί από τις επιστροφές των κεφαλαίων του ΤΕΠΙΧ. Τα δάνεια που τελικά θα χορηγηθούν με τη μόχλευση μέσω του τραπεζικού συστήματος αναμένεται να ανέλθουν στα 500 εκατ. ευρώ. Βασικά χαρακτηριστικά δανείων Περιγραφή βασικών χαρακτηριστικών DELFI Δικαιούχοι δράσης / επιλέξιμες επιχειρήσεις Είναι επιχειρήσεις για τις οποίες συντρέχουν αθροιστικά οι κάτωθι προϋποθέσεις, Είναι Πολύ Μικρές, Μικρές και Μεσαίες επιχειρήσεις (ορισμός ΜμΕ_Παράρτημα Ι του ΕΚ 651/2014, όπως εκάστοτε ισχύει), οι οποίες έχουν υπαχθεί σε καθεστώς ενίσχυσης μέσω του Αναπτυξιακού Νόμου 4887/2022. Έχουν εγκατάσταση και λειτουργούν νόμιμα στην Ελλάδα έως και τον χρόνο υποβολής της αίτησης χρηματοδότησης στην Τράπεζα. Η επιχείρηση μπορεί να δανειοδοτηθεί από το Ταμείο εάν δεν έχει προβεί σε έναρξη των εργασιών της1 πριν την υποβολή του αιτήματος δανειοδότησης στην πλατφόρμα KYC («Know Your Customer») της ΕΑΤ. Δεν θεωρούνται προβληματικές επιχειρήσεις (υπό την έννοια του άρθρου 2, σημείο 18 του Καν. 651/2014, όπως εκάστοτε ισχύει). Κρίνονται πιστοληπτικά αποδεκτές σύμφωνα με την ισχύουσα πιστωτική πολιτική και τις εσωτερικές διαδικασίες της Τράπεζας. Δεν έχουν υπαχθεί σε συλλογική διαδικασία αφερεγγυότητας, ούτε πληρούν τις προϋποθέσεις με βάση την εγχώρια νομοθεσία στην οποία υπόκειται για να υπαχθούν σε συλλογική διαδικασία αφερεγγυότητας, κατόπιν αιτήσεως των δανειστών τους. Να είναι επιχειρήσεις οι οποίες δεν έχουν λάβει ενίσχυση διάσωσης ή αναδιάρθρωσης, ή οι Επιχειρήσεις έχουν λάβει ενίσχυση διάσωσης, αλλά έχουν αποπληρώσει το δάνειο και έχουν λύσει τη σύμβαση εγγύησης ή οι επιχειρήσεις έχουν λάβει ενίσχυση αναδιάρθρωσης, η οποία έχει ολοκληρωθεί. Είναι τραπεζικά ενήμερες ή σε καθυστέρηση μικρότερη ή ίση των 90 ημερών κατά την ημερομηνία της αίτησης χρηματοδότησης. Δεν συντρέχουν λόγοι αποκλεισμού του άρθρου 40 του νόμου 4488/17 (ΦΕΚ Α΄137/13.09.2017), όπως ισχύει. Δεν εκκρεμεί εντολή ανάκτησης προηγούμενης παράνομης και ασύμβατης κρατικής ενίσχυσης βάσει απόφασης ΕΕ ή ΔΕΕ. Εάν έχουν ενταχθεί σε προγράμματα της ΕΑΤ (πρώην ΕΤΕΑΝ), τα οποία ολοκληρώθηκαν ή βρίσκονται σε ισχύ και δεν έχουν εμφανίσει δυσμενή συναλλακτική συμπεριφορά στην αποπληρωμή των οφειλών τους (καταγγελία δανείου ή ληξιπρόθεσμες οφειλές για διάστημα μεγαλύτερο των ενενήντα (90) ημερών) ή έχουν εμφανίσει δυσμενή συναλλακτική συμπεριφορά (καταγγελία δανείου) αλλά έχουν εξοφλήσει πλήρως τις οφειλές του πριν την υποβολή της αίτησης χρηματοδότησης ή εφόσον πρόκειται για πρόγραμμα εγγυοδοσίας, δεν έχει καταβληθεί το ποσό εγγύησης από πλευράς της ΕΑΤ ή εφόσον έχει βεβαιωθεί η εν λόγω οφειλή στην αρμόδια Δ.Ο.Υ., αυτή έχει ενταχθεί σε καθεστώς ρύθμισης, η οποία συνεχίζει να είναι σε ισχύ κατά την ημερομηνία υποβολής της αίτησης χρηματοδότησης. Δεν ανήκουν στις Μη Επιλέξιμες Επιχειρήσεις. 1 Ως «έναρξη των εργασιών» νοείται: το πρώτο χρονικά μεταξύ είτε της έναρξης των κατασκευαστικών εργασιών που αφορούν την επένδυση είτε της πρώτης νομικά δεσμευτικής ανάληψης υποχρέωσης για την παραγγελία εξοπλισμού είτε άλλης ανάληψης υποχρέωσης που καθιστά μη αναστρέψιμη την επένδυση. Η αγορά γης και οι προπαρασκευαστικές εργασίες, όπως η λήψη αδειών και η εκπόνηση μελετών σκοπιμότητας, δεν θεωρούνται έναρξη των εργασιών. Για τις εξαγορές, ως «έναρξη των εργασιών» νοείται η στιγμή απόκτησης των στοιχείων ενεργητικού που συνδέονται άμεσα με την αποκτηθείσα εγκατάσταση. Δείτε τις Εξαιρούμενες Επιχειρήσεις και Δαπάνες εδώ. Επιλέξιμες δαπάνες Η τεκμηρίωση των δαπανών λαμβάνει χώρα έναντι των παραστατικών για δαπάνες σύμφωνες με το κατατεθειμένο επιχειρηματικό σχέδιο (business plan) της επιχείρησης. Είναι επιλέξιμες οι ακόλουθες δαπάνες: (i) Επενδυτικές δαπάνες σε ενσώματα και άυλα στοιχεία ενεργητικού, (ii) Το εκτιμώμενο μισθολογικό κόστος που προκύπτει από τη δημιουργία θέσεων εργασίας ως αποτέλεσμα αρχικής επένδυσης, υπολογιζόμενο σε περίοδο δύο ετών ή, (iii) Ο συνδυασμός που αναφέρονται στα στοιχεία i) και ii), εφόσον το συνολικό ποσό δεν υπερβαίνει το ποσό του i) ή του ii), ανάλογα με το ποιο είναι μεγαλύτερο. Επιπλέον: Οι ενισχύσεις χορηγούνται για αρχική επένδυση Οι δαπάνες δεν θα πρέπει να έχουν εξοφληθεί πριν από την ημερομηνία υποβολής της αίτησης χρηματοδότησης στο πιστωτικό ίδρυμα. Η ημερομηνία έναρξης των εργασιών θα πρέπει να είναι μεταγενέστερη της ημερομηνίας υποβολής της αίτησης ένταξης του επενδυτικού σχεδίου στις διατάξεις του Ν. 4887/2022, καθώς και της ημερομηνίας υποβολής της αίτησης χρηματοδότησης στην Πλατφόρμα KYC («Know Your Customer») της ΕΑΤ. Η επένδυση διατηρείται στην περιοχή όπου χορηγείται η ενίσχυση για τουλάχιστον τρία (3) έτη, μετά την ολοκλήρωση της επένδυσης. Η ένταση της ενίσχυσης, εκφραζόμενη σε ακαθάριστο ισοδύναμο επιχορήγησης, δεν υπερβαίνει τη μέγιστη ένταση ενίσχυσης που προσδιορίζεται στον χάρτη περιφερειακών ενισχύσεων. Ο δικαιούχος της ενίσχυσης παρέχει χρηματοδοτική συνεισφορά τουλάχιστον 25 % των επιλέξιμων δαπανών μέσω των ιδίων πόρων του ή μέσω εξωτερικής χρηματοδότησης, σε μορφή απαλλαγμένη από οποιαδήποτε δημόσια στήριξη σύμφωνα με τον Αναπτυξιακό Νόμο και σε κάθε περίπτωση σε μορφή που δεν περιέχει στοιχεία κρατικής ενίσχυσης. Απαγορεύεται η (α) αναχρηματοδότηση/αποπληρωμή υφιστάμενων δανείων και πιστωτικών γραμμών, (β) η χρηματοδότηση προγράμματος καταβολής μερισμάτων ή αγοράς μετοχών, (γ) η χρηματοδότηση Εξαγορών και Συγχωνεύσεων και (δ) χρηματοδότηση δευτερευουσών οφειλών (subordinated and mezzanine debt) Δείτε αναλυτικά τις επιλέξιμες δαπάνες εδώ. Κρατική ενίσχυση ια την εγγύηση που χορηγεί η ΕΑΤ θα λαμβάνει από την επιχείρηση την κατάλληλη προμήθεια «Προμήθεια Εγγύησης». Το Ταμείο θα λειτουργήσει:– είτε χωρίς στοιχείο ενίσχυσης (με όρους αγοράς) στην περίπτωση που καταβάλλεται η κατάλληλη προμήθεια εγγύησης βάσει των προμηθειών του ασφαλούς λιμένα της Ανακοίνωσης της Ευρωπαϊκής Επιτροπής για τις εγγυήσεις (2008/C 155/02) για ΜΜΕ βάσει της πιστοληπτικής διαβάθμισης της επιχείρησης, ως κάτωθι πίνακας: Για επιχειρήσεις που δεν έχουν χρηματοπιστωτικό ιστορικό ή βαθμολογία που βασίζεται στον Ισολογισμό (π.χ. ορισμένες εταιρίες ειδικού σκοπού ή επιχειρήσεις στη φάση της εκκίνησης start-ups), η προμήθεια ασφαλούς λιμένα καθορίζεται στο 3,8% και δεν μπορεί να είναι ποτέ χαμηλότερη από εκείνη που θα εφαρμοζόταν για τη μητρική επιχείρηση. Σ΄ αυτή την περίπτωση το ποσό της καταβαλλόμενης Προμήθειας εγγύησης δεν λογίζεται ως κρατική ενίσχυση. – είτε με στοιχείο ενίσχυσης, όπου η λήψη της εγγύησης συνεπάγεται την παροχή ενίσχυσης υπό τη μορφή Ακαθάριστου Ισοδύναμου Επιχορήγησης (ΑΙΕ) όπως ορίζουν οι όροι του άρθρου 14 του Γενικού Απαλλακτικού Κανονισμού της ΕΕ (ΓΑΚ 651/2014), όπως τροποποιείται και ισχύει. Στην περίπτωση αυτή η επιχείρηση καταβάλλει μειωμένη Προμήθεια εγγύησης ύψους 0,20% επί του εγγυημένου κεφαλαίου, η οποία λογίζεται ως κρατική ενίσχυση και υπολογίζεται το Ακαθάριστο Ισοδύναμο Επιχορήγησης (ΑΙΕ). Το Ακαθάριστο Ισοδύναμο Επιχορήγησης (ΑΙΕ εγγύησης σε ευρώ) ορίζεται ως η διαφορά της προμήθειας εγγύησης που θα πλήρωνε η επιχείρηση βάσει των προμηθειών εγγύησης της αγοράς (προμήθειες αναφοράς) και της προμήθειας εγγύησης ποσοστού 0.20% που καταβάλει. Η ένταση ενίσχυσης (% ΑΙΕ) δεν θα υπερβαίνει το ανώτατο όριο που ισχύει για τις περιφερειακές ενισχύσεις, όπως αυτό ορίζεται στο Χάρτη Περιφερειακών Ενισχύσεων, όπως ισχύει κατά την ημερομηνία χορήγησης της ενίσχυσης στη συγκεκριμένη περιοχή.Δείτε τον τρέχοντα Χάρτη των Περιφερειακών Ενισχύσεων εδώ. Οι επιχειρήσεις επιπλέον θα πρέπει να έχουν υποβάλλει αίτημα χρηματοδότησης στο Πληροφοριακό Σύστημα ΚΥC («Know Your Customer») της ΕΑΤ πριν την έναρξη εργασιών του επενδυτικού σχεδίου (άρθρο σημ. 23 του Κανονισμού ΕΕ (ΕΕ) 651/2014), ώστε να πληρείται ο χαρακτήρας κινήτρου της ενίσχυσης του άρθρου 6 του ΓΑΚ. Περίοδος διάθεσης Εκταμίευση των δανείων παράλληλα με τα καθεστώτα του Α.Ν. μέχρι 31.12.2025 με δυνατότητα παράτασης με τη σύμφωνη γνώμη της Επενδυτικής Επιτροπής. Υποβολή αιτήσεων Οι ενδιαφερόμενοι (υποψήφιες προς χρηματοδότηση επιχειρήσεις), μετά την υποβολή της αίτησης ένταξης του επενδυτικού τους σχεδίου στον Α.Ν. 4887/2022 και εφόσον δεν έχουν προβεί σε έναρξη εργασιών, υποβάλλουν αίτηση στην πλατφόρμα KYC («Know Your Customer») της ΕΑΤ, μέσω του δικτυακού τόπου hdb.gr. Μέσω της πλατφόρμας, υπό την προϋπόθεση συναίνεσης για τη συλλογή και επεξεργασία των προσωπικών δεδομένων, και ύστερα από μία σειρά αξιολογήσεων κριτηρίων (έλεγχο της ύπαρξης φορολογικής και ασφαλιστικής ενημερότητας και φερεγγυότητας των υποψήφιων προς χρηματοδότηση επιχειρήσεων), η αίτηση προωθείται στην Τράπεζα επιλογής του κατ΄ εντολή του ενδιαφερομένου, για την υποβολή μη δεσμευτικής προσφοράς. Εν συνεχεία ο ενδιαφερόμενος, για τον οποίο η Τράπεζα εκδήλωσε το «μη δεσμευτικό» ενδιαφέρον χρηματοδότησης, υποβάλλει το αίτημα στο ΠΣΚΕ μέσω του δικτυακού τόπου https://www.ependyseis.gr/ , στο οποίο αναγράφεται και ο μοναδικός αριθμός αίτησης από την πλατφόρμα KYC της ΕΑΤ."
