title = "Υποβολή παραπόνου - Attica Bank"
description = "Η συμπλήρωση των πεδίων με αστερίσκο είναι υποχρεωτική. Η Attica Bank συλλέγει και επεξεργάζεται τα προσωπικά σας δεδομένα, που υποβάλλονται μέσω της παρούσας φόρμας, με μοναδικό σκοπό την εξέταση του αιτήματός σας, και θα προβεί στη διαγραφή τους μετά από πέντε έτη. Ενημερωθείτε αναλυτικά για την επεξεργασία των δεδομένων προσωπικού χαρακτήρα από την Τράπεζα από το έντυπο «Ενημέρωση για την επεξεργασία δεδομένων προσωπικού χαρακτήρα της Attica Bank Ανώνυμης Τραπεζικής Εταιρείας»."
full_description = "Please enable JavaScript in your browser to complete this form.Please enable JavaScript in your browser to complete this form.Ονοματεπώνυμο *ΠρώτοΤελευταίοΑΦΜ *Τηλέφωνο *Email *Φυσικό/Νομικό Πρόσωπο *Είστε Φυσικό ή Νομικό Πρόσωπο;Φυσικό ΠρόσωποΝομικό ΠρόσωποΕίστε πελάτης: *Attica BankΠρ. Παγκρήτιας ΤράπεζαςΚαι των δύο ΤραπεζώνΔεν είμαι πελάτηςΚατάστημα ή Υπηρεσία που αφορά το παράπονο *Κατάστημα Attica BankΚατάστημα Πρ. Παγκρήτιας ΤράπεζαςΥπηρεσίαΆλλοΚατάστημα Attica BankΑγία ΠαρασκευήΑλεξανδρούποληΒέροιαΒόλοςΓιαννιτσάΓλυφάδαΗλιούποληΙωάννιναΚαβάλαΚαλαμαριάΚαλαμάταΚατερίνηΚέρκυραΚοζάνηΚόρινθοςΛαμίαΛάρισαΜητροπόλεωςΝέα ΕρυθραίαΝέα ΙωνίαΝέα ΣμύρνηΝίκαιαΞάνθηΠανεπιστημίουΠατησίωνΠάτραΠειραιάςΠεριστέριΡέθυμνοΣέρρεςΣταυρούποληΤρίκαλαΧαλάνδριΧαλκίδαΧανιάΧίοςΚατάστημα Πρ. Παγκρήτιας Τράπεζας25ης Αυγούστου62 ΜαρτύρωνΑγία ΒαρβάραΑγία ΠαρασκευήΆγιος ΝικόλαοςΑθήναΑκρωτήριΑρκαλοχώριΑρχάνεςΒούλαΓλυφάδαΗράκλεια ΣερρώνΘέρισοςΘεσσαλονίκη – ΜητροπόλεωςΘεσσαλονίκη – ΤσιμισκήΙεράπετραΙκάρουΚαλαμαριάΚαλαμάταΚαλλιθέα ΡεθύμνουΚαστέλλιΚατερίνηΚηφισιάΛ. ΔημοκρατίαςΛεπτοκαρυάΛεωφόρος ΚνωσσούΜάλιαΜαρούσιΜεσογείωνΜήλοςΜοίρεςΜυλοπόταμοςΝ. ΑλικαρνασσόςΝέα ΣμύρνηΠαγκράτιΠαλαιό ΦάληροΠάτραΠειραιάςΠεριστέριΡόδοςΣέρρεςΣητείαΤρίποληΧανιάΧερσόνησοςΧίοςΧολαργόςΨυχικόΥπηρεσίαΣτεγαστικά ΔάνειαΚαταναλωτικά ΔάνειαΕπιχειρηματικά Δάνειαe-bankingΚάρτεςΛογαριασμοί/ΚαταθέσειςΕπενδυτικάATMPOSΚίνηση Κεφαλαίων/ΠληρωμέςΔίκτυο ΚαταστημάτωνΔιέυθυνση ΟφειλώνΛοιπάΠεριγράψτε μας το θέμα που σας απασχολεί *Αρχείο Κάντε κλικ ή σύρετε ένα αρχείο σε αυτήν την περιοχή για μεταφόρτωση. ΕΝΗΜΕΡΩΣΗ ΓΙΑ ΤΗΝ ΕΠΕΞΕΡΓΑΣΙΑ ΤΩΝ ΔΕΔΟΜΕΝΩΝ ΠΡΟΣΩΠΙΚΟΥ ΧΑΡΑΚΤΗΡΑ *Έλαβα γνώση των παραπάνω όρωνΗ συμπλήρωση των πεδίων με αστερίσκο είναι υποχρεωτική. Η Attica Bank συλλέγει και επεξεργάζεται τα προσωπικά σας δεδομένα, που υποβάλλονται μέσω της παρούσας φόρμας, με μοναδικό σκοπό την εξέταση του αιτήματός σας, και θα προβεί στη διαγραφή τους μετά από πέντε έτη. Ενημερωθείτε αναλυτικά για την επεξεργασία των δεδομένων προσωπικού χαρακτήρα από την Τράπεζα από το έντυπο «Ενημέρωση για την επεξεργασία δεδομένων προσωπικού χαρακτήρα της Attica Bank Ανώνυμης Τραπεζικής Εταιρείας».Αποστολή Συχνές Ερωτήσεις Απάντηση στο μήνυμα σας Η Attica Bank σας ενημερώνει ότι η απάντηση στο μήνυμά σας θα σας γνωστοποιείται μέσω ηλεκτρονικής αλληλογραφίας (e-mail). Η απάντηση θα αποστέλλεται στην ηλεκτρονική διεύθυνση που έχετε δηλώσει στο σχετικό πεδίο της ειδικής ηλεκτρονικής φόρμας παραπόνου που υποβάλλεται ηλεκτρονικά μέσω της παρούσας ιστοσελίδας ή εγγράφως στο δίκτυο καταστημάτων, εντός 45 ημερολογιακών ημερών, όπως ορίζεται στην ΠΕΕ 157/02.04.2019. Σημεία υποβολής παραπόνου Υποβολή παραπόνου σχετικά με τα προϊόντα και τις υπηρεσίες της Τράπεζας, πραγματοποιείται στα ακόλουθα σημεία: Δίκτυο Καταστημάτων/ Μονάδα Εξυπηρέτησης:Μπορείτε να υποβάλετε παράπονο μέσω καταστήματος εξυπηρέτησης, γραπτώς συμπληρώνοντας το ειδικό έντυπο παραπόνου που είναι αναρτημένο στα γκισέ του δικτύου καταστημάτων της Attica Bank. ΤαχυδρομικάΜε επιστολή μέσω αλληλογραφίας στην ταχυδρομική διεύθυνση: Παλαιών Πατρών Γερμανού 3-5, 105 61 Αθήνα ΗλεκτρονικάΜέσω της παρούσας ιστοσελίδας της Τράπεζας με καταχώρηση του παραπόνου στην ειδική φόρμα «Υποβολή Παραπόνου». Τηλεφωνικό Κέντρο Εξυπηρέτησης Πελατών (Call Center):Παρέχεται η δυνατότητα να υποβάλλετε παράπονα και μέσω της Γραμμής Εξυπηρέτησης Πελατών στο 210-3669000. Αρμόδιος Φορέας:Μπορείτε να υποβάλλετε γραπτό παράπονο προς την Τράπεζα μέσω των αρμόδιων φορέων, σε μορφή επιστολής μέσω αλληλογραφίας/ φαξ/ e-mail ή με ιδιόχειρη παράδοση στα καθορισμένα σημεία υποδοχής του κάθε φορέα.Ενδεικτικά, οι φορείς αυτοί μπορεί να είναι: Ελληνικός Χρηματοοικονομικός Μεσολαβητής – Αστική Μη Κερδοσκοπική Εταιρεία Εναλλακτικής Επίλυσης Διαφορών (ΕΧΜ-ΕΕΕΔ) Γενική Γραμματεία Καταναλωτή Συνήγορος του Καταναλωτή Καταναλωτικές & Λοιπές Οργανώσεις (ΕΚΠΟΙΖΩ, ΙΝΚΑ κ.λ.π.)Οι παραπάνω φορείς διαβιβάζουν στην αρμόδια Μονάδα της Τράπεζας, το γραπτό παράπονό σας. Επισημαίνουμε ότι στο είδος των πληροφοριών που χρειάζεται να παρέχετε κατά την υποβολή του παραπόνου σας στην Τράπεζα, προκειμένου να διερευνηθεί η υπόθεση, περιλαμβάνονται τα εξής στοιχεία:Ονοματεπώνυμο, Όνομα πατρός, ΑΔΤ, ΑΦΜ, Διεύθυνση κατοικίας/αλληλογραφίας, Τηλέφωνο, email, Κατάστημα Εξυπηρέτησης, Κατάστημα/Υπηρεσία που αφορά το παράπονο και τέλος τα στοιχεία του υπεύθυνου Καταστήματος/Υπηρεσίας. Χειρισμός παραπόνου Κατά την παραλαβή του παραπόνου από την Διεύθυνση Ελέγχου, Εξασφάλισης Ποιότητας και Διαχείρισης Παραπόνων της Τράπεζας σας παρέχεται βεβαίωση παραλαβής. Η Διεύθυνση Ελέγχου, Εξασφάλισης Ποιότητας και Διαχείρισης Παραπόνων Πελατών Attica Bank σε συνεργασία με τις αρμόδιες μονάδες της Τράπεζας, θα διερευνήσει το θέμα με αντικειμενικότητα και θα σας απαντήσει εγγράφως σύμφωνα με τα χρονικά πλαίσια που ορίζονται από το ισχύον ρυθμιστικό πλαίσιο. Σε περίπτωση που απαιτείται περαιτέρω χρόνος για τη διαχείρισή του, θα ενημερωθείτε σχετικά. Κατόπιν σχετικού αιτήματός σας η Τράπεζα παρέχει ενημέρωση για την πορεία εξέτασης της υπόθεσής σας. Το αποτέλεσμα της εξέτασης ή η σχετική θέση της Τράπεζας, θα σας γνωστοποιηθεί εντός 45 ημερολογιακών ημερών, όπως ορίζεται στην ΠΕΕ 157/02.04.2019. Εάν η απάντηση της Διεύθυνσης Ελέγχου, Εξασφάλισης Ποιότητας και Διαχείρισης Παραπόνων δε σας ικανοποίησε, μπορείτε να απευθυνθείτε για την εξωδικαστική διευθέτηση της διαφοράς, στον Ελληνικό Χρηματοοικονομικό Μεσολαβητή-Αστική Μη Κερδοσκοπική Εταιρεία Εναλλακτικής Επίλυσης Διαφορών (ΕΧΜ-ΕΕΕΔ) (Μασσαλίας 1, 10680 Αθήνα, www.hobis.gr Τηλ.: 10 4 40, 210 3376700 Fax: 210-3238821, e-mail: info@hobis.gr), ως φορέα Εναλλακτικής Επίλυσης Διαφορών (ΕΕΔ), ο οποίος βρίσκεται καταχωρημένος στο Μητρώο Φορέων ΕΕΔ που τηρείται στην ιστοσελίδα της Γενικής Γραμματείας Εμπορίου και Προστασίας Καταναλωτή, του Υπουργείου Οικονομίας και Ανάπτυξης. Σε περίπτωση που η διαφορά αφορά συμβατικές υποχρεώσεις δυνάμει ηλεκτρονικής σύμβασης παροχής υπηρεσιών, ο Πελάτης δύναται να υποβάλει το αίτημά του για την εξωδικαστική διευθέτηση της διαφοράς, μέσω της πλατφόρμας Ηλεκτρονικής Επίλυσης Διαφορών – ΗΕΔ στην ιστοσελίδα webgate.ec.europa.eu/odr."
