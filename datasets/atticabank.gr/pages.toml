["https://www.atticabank.gr/el/ataxinomita/prosfora-pros-tin-koinonia"]
title = "Προσφορά προς την Κοινωνία - Attica Bank"
description = "Η εταιρική υπευθυνότητα αποτελεί για την Attica Bank μια ιδιαίτερα σημαντική προτεραιότητα. Η Attica Bank αναγνωρίζει την ευθύνη που της αναλογεί απέναντι στην κοινωνία και ιδιαίτερα στα πιο ευάλωτα…"
full_description = "Η εταιρική υπευθυνότητα αποτελεί για την Attica Bank μια ιδιαίτερα σημαντική προτεραιότητα. Η Attica Bank αναγνωρίζει την ευθύνη που της αναλογεί απέναντι στην κοινωνία και ιδιαίτερα στα πιο ευάλωτα στρώματα, αλλά και ελπιδοφόρα κομμάτια της, όπως είναι τα παιδιά, η εκπαίδευση και η παροχή ίσων και δικαίων ευκαιριών στην Παιδεία, ενώ προάγει και υποστηρίζει τον εθελοντισμό, τον πολιτισμό και την προστασία του περιβάλλοντος. Η Attica Bank επιδεικνύει σταθερά ιδιαίτερη ευαισθησία και ενεργό συμμετοχή σε θέματα Εταιρικής Κοινωνικής Ευθύνης και στοχεύει στον εμπλουτισμό των δράσεων της, ώστε οι ωφελούμενοι να αυξάνονται με την πάροδο του χρόνου. Το 2023 ήταν μια χρονιά που ενισχύθηκαν ιδιαίτερα ο αθλητισμός και ο πολιτισμός, ενώ μέσω υποστήριξης φορέων, δράσεων και εθελοντικών ενεργειών στηρίχθηκαν ευπαθείς κοινωνικές ομάδες. Παράλληλα, προωθήθηκαν δράσεις για την εκπαίδευση, την επιχειρηματικότητα και το περιβάλλον, ενσωματώνοντας τις αρχές του ESG (Environmental, Social, Governance) στη δραστηριότητα της τράπεζας. Εκπαίδευση Στον τομέα της Εκπαίδευσης, η Attica Bank συμπράττει με μία από τις μεγαλύτερες ενημερωτικές ιστοσελίδες, το Infokids.gr, το οποίο απευθύνεται σε γονείς, εκπαιδευτικούς και επαγγελματίες που ασχολούνται με θέματα που αφορούν το παιδί και την οικογένεια, για τον εξοπλισμό βιβλιοθηκών σε δημόσια σχολεία της χώρας μας, με βιβλία, ηλεκτρονικούς υπολογιστές, έπιπλα για το αναγνωστήριο κ.ά. Για το 2023, με την έναρξη της συνεργασίας αυτής, εξοπλίστηκαν τρεις βιβλιοθήκες σε σχολεία του Δήμου Κερατσινίου: στο Ειδικό Δημοτικό Σχολείο, στο 13ο και 21ο Δημοτικό Σχολείο. Η Τράπεζα και μέσα στο 2023 προσέφερε δωρεάν μηχανογραφικό και ηλεκτρονικό εξοπλισμό σε δημόσια σχολεία ανά την Ελλάδα, συνεισφέροντας έτσι στον εκσυγχρονισμό τους και στην βελτίωση και αναβάθμιση της εκπαίδευσης των μαθητών. Ενδεικτικά, τη χρονιά που πέρασε δόθηκαν ηλεκτρονικοί υπολογιστές, πολυμηχανήματα και εκτυπωτές σε 5 Δημόσια Σχολεία, καθώς και σε Σχολεία των Φυλακών Κορυδαλλού. Επίσης, μεταξύ άλλων, διέθεσε σχολικά είδη μέσω voucher σε μαθητές των σχολείων του Παλαμά Καρδίτσας στο πλαίσιο των ευρύτερων πρωτοβουλιών υποστήριξης των πληγέντων στη Θεσσαλία μετά τις καταστροφικές πλημμύρες. Συνεχίζοντας στον τομέα της εκπαίδευσης, η Τράπεζα παρείχε δεκαπέντε (15) υποτροφίες φοιτητών στα προπτυχιακά προγράμματα σπουδών του ΕΑΠ (Ελληνικό Ανοικτό Πανεπιστήμιο), ενισχύοντας έτσι οικονομικά στην ολοκλήρωση των σπουδών τους. Κοινωνική προσφορά Η Attica Bank ενσωματώνει την Εταιρική Κοινωνική Ευθύνη στη στρατηγική της, προσφέροντας με τις χορηγίες και τις δωρεές της σε διάφορους τομείς που αφορούν στον Άνθρωπο και την Κοινωνία. Η Attica Bank το 2023 ενίσχυσε τη συνεργασία της με το Make-A-Wish (Κάνε Μια Ευχή Ελλάδος) ως Μεγάλος Χορηγός – Δωρητής, συνδράμοντας το έργο του Οργανισμού που εκπληρώνει ευχές, οι οποίες έχουν τη δύναμη να μεταμορφώσουν τις ζωές παιδιών με πολύ σοβαρές ασθένειες και αποτελούν αναπόσπαστο μέρος του ταξιδιού για τη θεραπεία τους. Από το 1996, που ιδρύθηκε, το Make-A-Wish (Κάνε-Μια-Ευχή Ελλάδος) έχει εκπληρώσει περισσότερες από 3.000 ευχές. Με 400 εθελοντές σε όλη τη χώρα, το Make-A-Wish εκπληρώνει κατά μέσο όρο μια ευχή κάθε 38 ώρες. Επιπλέον, για τρίτη συνεχόμενη χρονιά, η Τράπεζα ενισχύει το έργο της Αστικής Μη Κερδοσκοπικής Εταιρείας «Emfasis» συμμετέχοντας στην χριστουγεννιάτικη εκστρατεία «Merry Streetmas». Το Emfasis Foundation από το 2013 εργάζεται αδιάκοπα για την αποκατάσταση της αξιοπρέπειας των ατόμων που βιώνουν πολλαπλές μορφές αστεγίας. Τέλος, το 2023 υποστηρίχθηκαν με δωρεές η Εθελοντική Ομάδα Καπανδριτίου Πολυδενδρίου για την αγορά πυροσβεστικού εξοπλισμού, ο Φιλανθρωπικός μη Κερδοσκοπικός Σύλλογος Γονέων και Κηδεμόνων ΑμεΑ Ν. Ημαθίας «ΤΑ ΠΑΙΔΙΑ ΤΗΣ ΑΝΟΙΞΗΣ» για την ολοκλήρωση ανέγερσης κτιρίου κάλυψης διημέρευσης, φροντίδας και απασχόλησης ΑμεΑ κ.ά. Αθλητισμός και πολιτισμός Στον τομέα του Αθλητισμού, η Attica Bank ήταν χορηγός στην ανδρική ομάδα μπάσκετ του Γυμναστικού Συλλόγου Αμαρουσίου, για τη συμμετοχή στο ελληνικό πρωτάθλημα καλαθοσφαίρισης ανδρών στην Α1 Εθνική Κατηγορία (Basket League) της αθλητικής σεζόν 2023-2024. Την σεζόν 2022-23, η ανδρική ομάδα μπάσκετ αναδείχθηκε Πρωταθλήτρια της Elite League – Ερρίκος Ντυνάν (πρώην Α2) και εξασφάλισε την επιστροφή της έπειτα από 11 χρόνια στην Basket League, την κορυφαία κατηγορία της χώρας (Α1) και μια θέση ανάμεσα στα μεγαλύτερα brands του ελληνικού αθλητισμού. Με τη χορηγική συμμετοχή, η Attica Bank στήριξε αφενός την πορεία της ανδρικής ομάδας μπάσκετ στην υψηλότερη κατηγορία της χώρας (Α1) και αφετέρου ενίσχυσε την προσπάθεια ενός ιστορικού Συλλόγου να φέρει τις νέες και τους νέους κοντά στον αθλητισμό, βελτιώνοντας παράλληλα και την προπονητική εμπειρία των αθλητών. Αξιοσημείωτη ήταν η προσφορά της Attica Bank μέσα στο 2023 και στο κομμάτι του Πολιτισμού. Με στόχο την ανάδειξη της εθνικής μας κληρονομιάς, η Attica Bank, συμμετείχε ως χορηγός στη συναυλία του διεθνούς φήμης τενόρου Plácido Domingo, η οποία διεξήχθη τον Ιούλιο 2023 στη Μονή Τοπλού στη Σητεία Κρήτης. Η συναυλία του τελευταίου θρύλου της όπερας, Plácido Domingo εκτός από μία ιστορική στιγμή για τη Μονή Τοπλού, έγινε ορόσημο για την περιοχή του νομού Σητείας και εν γένει της Κρήτης, καθώς χαρακτηρίστηκε ως κορυφαίο πολιτιστικό γεγονός του καλοκαιριού για την Κρήτη και πανελλαδικά. Επιπλέον, καθ’ όλη τη διάρκεια του έτους, η Attica Bank ήταν χορηγός σε δράσεις που ενίσχυσαν την επιχειρηματικότητα, όπως ενδεικτικά στα 5α Επιχειρηματικά Βραβεία ‘‘ΘΑΛΗΣ Ο ΜΙΛΗΣΙΟΣ’’, στο 2ο Διεθνές Φόρουμ Γυναικείας Επιχειρηματικότητας κ. ά. Η Attica Bank τη χρονιά που πέρασε ήταν χορηγός Συνεδρίων που αφορούσαν σε θέματα που άπτονται των δραστηριοτήτων της και συνδέονται άμεσα με τους στρατηγικούς της στόχου για τη βιωσιμότητα. Ειδικότερα, υπήρξε και φέτος χορηγός του Συνεδρίου «Green Deal Greece 2023» που διοργανώθηκε για 3η συνεχόμενη χρονιά από το Τεχνικό Επιμελητήριο Ελλάδος και το economix.gr και είχε τίτλο: «Η Ανθεκτικότητα υποδομών και περιοχών, σήμερα και αύριο: προκλήσεις, απειλές και ευκαιρίες, για τον πράσινο μετασχηματισμό». Εθελοντισμός Σημαντικό κομμάτι των δράσεων της Εταιρικής Κοινωνικής Ευθύνης της Τράπεζας στηρίζεται στον εθελοντισμό των εργαζομένων της, με στόχο μέσα από την συμμετοχή και την αλληλεγγύη να ενισχύσει κοινωνικά ευπαθείς ομάδες, αλλά και συνανθρώπους μας που έχουν έκτακτες ανάγκες, επιδεικνύοντας ιδιαίτερη ευαισθησία απέναντι στα παιδιά. Με την εθελοντική συμμετοχή των εργαζομένων, τα τελευταία χρόνια προσφέρονται στην αρχή κάθε σχολικής χρονιάς τα απαραίτητα σχολικά είδη προς τους μαθητές. Το 2023 η Attica Bank και οι εργαζόμενοί της συγκέντρωσαν και προσέφεραν σχολικά είδη στα Παιδικά Χωριά SOS. Με μεγάλη ευαισθησία και ενεργά αντανακλαστικά, οι εργαζόμενοι της Τράπεζας κινητοποιήθηκαν αμέσως μετά τις πλημμύρες στη Θεσσαλία, συγκεντρώνοντας είδη πρώτης ανάγκης, σχολικά, παιχνίδια κτλ. για τους πληγέντες συμπολίτες μας, τα οποία διατέθηκαν σε συνεργασία με το Εθνικό Συντονιστικό Κέντρο Εθελοντών «HelpHellas» στο πλαίσιο της πρωτοβουλίας «HelpThessalia». Επίσης, για την κάλυψη των πρώτων αναγκών των πληγέντων στην περιοχή, η Τράπεζα απέστειλε περισσότερες από 2.600 συσκευασίες νερού (6Χ1,5l). Η Τράπεζα ενίσχυσε και επιπλέον με δωρεά τον Οργανισμό HelpHellas για την κάλυψη των αναγκών του στο πλαίσιο των προσπαθειών παροχής βοήθειας προς τους κατοίκους της Θεσσαλίας. Τέλος, με την εθελοντική συμμετοχή των ανθρώπων της Attica Bank συγκεντρώθηκαν είδη πρώτης ανάγκης και παραδόθηκαν στον Ελληνικό Ερυθρό Σταυρό, ως ανθρωπιστική βοήθεια στους πληγέντες του φονικού σεισμού στην Τουρκία και τη Συρία."
