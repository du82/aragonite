["https://www.atticabank.gr/el/companies/anaptyxiaka-programmata/programmata-ellinikis-anaptyxiakis-trapezas/tameio-engyodosias-ependytikon-daneion-dikaiis-anaptyxiakis-metavasis"]
title = "Ταμείο Εγγυοδοσίας Επενδυτικών Δανείων Δίκαιης Αναπτυξιακής Μετάβασης - Attica Bank"
description = """
Τα νέα δάνεια που είναι εγγυημένα από το Ταμείο σε ποσοστό 80% , δύναται να χρηματοδοτήσουν:

την ιδιωτική συμμετοχή των ΜμΕ υφισταμένων και υπό ίδρυση επιχειρήσεων σε πράξεις που συμμετέχουν στις δράσεις επιχορήγησης του Προγράμματος Δίκαιης Αναπτυξιακής Μετάβασης 2021-2027 καθώς και σε άλλες επιχορηγούμενες δράσεις
καθώς και  κάθε οποιαδήποτε επιχειρηματική και επενδυτική δραστηριότητα,

στις περιοχές ΔΑΜ και ειδικότερα στην Περιφέρεια Δυτικής Μακεδονίας (Κοζάνη, Γρεβενά, Φλώρινα, Καστοριά) και στους Δήμους Μεγαλόπολης, Τρίπολης, Γορτυνίας και Οιχαλίας. Παράλληλα, το Ταμείο θα παρέχει επιδότηση επιτοκίου ύψους 3% ετησίως για τα πρώτα δυο έτη της χρηματοδότησης των Επιχειρήσεων, περίοδο χάριτος, καθώς και δυνατότητα επιχορήγησης της προμήθειας εγγύησης.
Το Ταμείο θα λειτουργήσει με βάση τον Γενικό Απαλλακτικό Κανονισμό (Καν. ΕΕ 651/2014) όπως τροποποιήθηκε και ισχύει, και ειδικότερα βάσει του άρθρου 21 (παρ. 3 & 18)."""
full_description = "Με μια γρήγορη ματιά Η Αttica Bank με τη συμμετοχή της στο Ταμείο στηρίζει τις επιχειρήσεις των περιοχών ΔΑΜ, συμβάλλοντας εμπράκτως στον αναπτυξιακό μετασχηματισμό των εν λόγω περιοχών, στη δημιουργία νέων θέσεων εργασίας και εν γένει στην στήριξη της τοπικής κοινωνίας.Συγχρόνως γίνεται αρωγός στην εθνική προσπάθεια για μετάβαση στη μεταλιγνιστική εποχή, με στόχο την αποδοτικότερη ενεργειακή διαχείριση και την εξοικονόμηση πόρων και βελτίωση του περιβαλλοντικού αποτυπώματος. Το δάνειο παρέχεται στο πλαίσιο του «Ταμείο Εγγυοδοσίας Επενδυτικών Δανείων Δίκαιης Αναπτυξιακής Μετάβασης», το οποίο διαχειρίζεται η Ελληνική Αναπτυξιακή Τράπεζα (ΕΑΤ), και συγχρηματοδοτείται από την Ευρωπαϊκή Ένωση, μέσω του Προγράμματος «Δίκαιη Αναπτυξιακή Μετάβαση 2021-2027». Το πρόγραμμα Τι αφορά Τα νέα δάνεια που είναι εγγυημένα από το Ταμείο σε ποσοστό 80% , δύναται να χρηματοδοτήσουν: την ιδιωτική συμμετοχή των ΜμΕ υφισταμένων και υπό ίδρυση επιχειρήσεων σε πράξεις που συμμετέχουν στις δράσεις επιχορήγησης του Προγράμματος Δίκαιης Αναπτυξιακής Μετάβασης 2021-2027 καθώς και σε άλλες επιχορηγούμενες δράσεις καθώς και κάθε οποιαδήποτε επιχειρηματική και επενδυτική δραστηριότητα, στις περιοχές ΔΑΜ και ειδικότερα στην Περιφέρεια Δυτικής Μακεδονίας (Κοζάνη, Γρεβενά, Φλώρινα, Καστοριά) και στους Δήμους Μεγαλόπολης, Τρίπολης, Γορτυνίας και Οιχαλίας. Παράλληλα, το Ταμείο θα παρέχει επιδότηση επιτοκίου ύψους 3% ετησίως για τα πρώτα δυο έτη της χρηματοδότησης των Επιχειρήσεων, περίοδο χάριτος, καθώς και δυνατότητα επιχορήγησης της προμήθειας εγγύησης. Το Ταμείο θα λειτουργήσει με βάση τον Γενικό Απαλλακτικό Κανονισμό (Καν. ΕΕ 651/2014) όπως τροποποιήθηκε και ισχύει, και ειδικότερα βάσει του άρθρου 21 (παρ. 3 & 18). Προϋπολογισμός δράσης Ο αρχικός προϋπολογισμός του Ταμείου ανέρχεται στο ποσό των 20εκατ. ευρώ και οι πόροι προέρχονται από το Πρόγραμμα ΕΣΠΑ Δίκαιης Αναπτυξιακής Μετάβασης 2021-2027 (Πυλώνας 1 του ΣΔΑΜ). Για τη συνεισφορά σε κεφάλαια δανείων θα αξιοποιηθεί ποσό 16εκατ. ευρώ περίπου, ενώ το υπόλοιπο ποσό θα καλύψει το κόστος των επιδοτούμενων τόκων και λοιπές αμοιβές. Με τη μόχλευση αναμένεται η χορήγηση δανείων συνολικής αξίας περίπου 100 εκατ. ευρώ. Βασικά χαρακτηριστικά δανείων Βασικά χαρακτηριστικά Δανείων «Ταμείου Εγγυοδοσίας Επενδυτικών Δανείων Δίκαιης Αναπτυξιακής Μετάβασης» Δικαιούχοι της Δράσης / Επιλέξιμες Επιχειρήσεις Δικαιούχοι της Δράσης / Επιλέξιμες Επιχειρήσεις Εξαιρέσεις Δραστηριοτήτων και Δαπανών Εξαιρέσεις Δραστηριοτήτων και Δαπανών Κριτήρια Επιλεξιμότητας Δανείων Κριτήρια Επιλεξιμότητας Δανείων Επιλέξιμες Δαπάνες Επιλέξιμες Δαπάνες Κρατική Ενίσχυση Κρατική Ενίσχυση Περίοδος Διάθεσης Ως καταληκτική ημερομηνία ορίζεται η 31η/12/2029 ή μέχρι εξαντλήσεως των κονδυλίων. Υποβολή Αιτήσεων 1 Οι ενδιαφερόμενοι (υποψήφιες προς χρηματοδότηση επιχειρήσεις) υποβάλλουν αίτηση στην πλατφόρμα KYC («Know Your Customer») της ΕΑΤ, μέσω του δικτυακού τόπου www.kyc.hdb.gr. 2 Μέσω της πλατφόρμας, υπό την προϋπόθεση συναίνεσης για τη συλλογή και επεξεργασία των προσωπικών δεδομένων, και ύστερα από μία σειρά αξιολογήσεων κριτηρίων (έλεγχο της ύπαρξης φορολογικής και ασφαλιστικής ενημερότητας και φερεγγυότητας των υποψήφιων προς χρηματοδότηση επιχειρήσεων), η αίτηση προωθείται στην Τράπεζα επιλογής του κατ΄ εντολή του ενδιαφερομένου, για την υποβολή μη δεσμευτικής προσφοράς. 3 Εν συνεχεία ο ενδιαφερόμενος, για τον οποίο η Τράπεζα εκδήλωσε το «μη δεσμευτικό» ενδιαφέρον χρηματοδότησης, υποβάλλει το αίτημα στο ΟΠΣΚΕ μέσω του δικτυακού τόπου https://app.opske.gr//, στο οποίο αναγράφεται και ο μοναδικός αριθμός αίτησης από την πλατφόρμα KYC της ΕΑΤ. 4 Σημειώνεται ότι προ υποβολής της αίτησης χρηματοδότησης στο ΟΠΣΚΕ οι ενδιαφερόμενες επίσης επιχειρήσεις θα πρέπει να έχουν υποβάλει το ερωτηματολόγιο αυτοαξιολόγησης στην πλατφόρμα ESG tracker της ΕΑΤ https://esgtracker.hdb.gr/en/home/ , καθώς και να έχουν εγγραφεί στο Μητρώο Πραγματικών Δικαιούχων. Απαιτείται η προσκόμιση ESG Tracker Report με στοιχεία του προηγούμενου έτους (έτος αναφοράς) από το έτος υποβολής της αίτησης χρηματοδότησης. Δύναται, ωστόσο, για τις αιτήσεις που θα υποβληθούν έως και 31.03.2025 να γίνουν αποδεκτά και τυχόν υφιστάμενα ESG Reports υποβληθέντα το 2024 (έτος αναφοράς 2023)."
