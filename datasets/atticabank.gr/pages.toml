title = "Εγγύηση καταθέσεων και επενδύσεων - Attica Bank"
description = """
Η Attica Bank είναι μία από τις Τράπεζες που συμμετέχουν στο Ταμείο Εγγύησης Καταθέσεων και Επενδύσεων (ΤΕΚΕ).
Η Τράπεζα διασφαλίζει τις καταθέσεις που τηρούνται σε αυτήν, ανεξαρτήτως νομίσματος, μέσω της κάλυψης που παρέχεται από το Σκέλος Κάλυψης Καταθέσεων (ΣΚΚ) του Ταμείου Εγγύησης Καταθέσεων και Επενδύσεων (ΤΕΚΕ), βάσει των όσων ορίζονται στον Ν. 4370/2016, όπως αυτός εκάστοτε ισχύει.
Στην περίπτωση που ενδεχομένως θα ενεργοποιούνταν η διαδικασία καταβολής αποζημίωσης από το ΤΕΚΕ, για τον υπολογισμό της γίνεται συμψηφισμός των πιστωτικών υπολοίπων των λογαριασμών καταθέσεων με τις πάσης φύσεως ανταπαιτήσεις που έχει η Τράπεζα κατά του δικαιούχου καταθέτη, οι οποίες έχουν καταστεί ληξιπρόθεσμες και απαιτητές κατά ή πριν από την ημερομηνία αδυναμίας, σύμφωνα με όσα ορίζονται από τον Αστικό Κώδικα, τα στοιχεία και οι πληροφορίες που παρέχει στο ΤΕΚΕ ο εκκαθαριστής του πιστωτικού ιδρύματος και το νομικό και συμβατικό πλαίσιο που διέπει τη συνολική σχέση μεταξύ του καταθέτη και του υπό εκκαθάριση πιστωτικού ιδρύματος.
Σημειώνεται ότι το ΤΕΚΕ δεν καταβάλλει αποζημίωση, όταν μέσα στους τελευταίους 24 μήνες δεν έλαβε χώρα συναλλαγή σχετική με την κατάθεση και όταν η αξία της κατάθεσης είναι μικρότερη από το διοικητικό κόστος που δυνητικά θα μπορούσε να προκαλέσει στο ΤΕΚΕ η υποχρέωση καταβολής της αποζημίωσης αυτής. Με τον όρο συναλλαγή νοείται κάθε πραγματική συναλλαγή δικαιούχου, καταθέτη ή τρίτου που ενεργεί κατ’ εντολή οποιουδήποτε δικαιούχου, όπως και κάθε αίτημα που υποβάλλει ο δικαιούχος προς την Τράπεζα με σκοπό να ενημερωθεί σχετικά με το υπόλοιπο του καταθετικού του λογαριασμού.
Οι πελάτες της Τράπεζας μπορούν να ενημερώνονται για όλα όσα αφορούν τη λειτουργία του ΤΕΚΕ και την εγγύηση των καταθέσεων καθώς και τις τυχόν εξαιρέσεις ορισμένων κατηγοριών καταθέσεων από τον δικτυακό τόπο του ΤΕΚΕ (www.teke.gr) και από το παρόν έντυπο που διατίθεται και στα Καταστήματα της Τράπεζάς μας.
Μπορείτε να κατεβάσετε το έντυπο εδώ."""
full_description = "Αναλυτικά Εγγύηση Καταθέσεων Η Attica Bank είναι μία από τις Τράπεζες που συμμετέχουν στο Ταμείο Εγγύησης Καταθέσεων και Επενδύσεων (ΤΕΚΕ). Η Τράπεζα διασφαλίζει τις καταθέσεις που τηρούνται σε αυτήν, ανεξαρτήτως νομίσματος, μέσω της κάλυψης που παρέχεται από το Σκέλος Κάλυψης Καταθέσεων (ΣΚΚ) του Ταμείου Εγγύησης Καταθέσεων και Επενδύσεων (ΤΕΚΕ), βάσει των όσων ορίζονται στον Ν. 4370/2016, όπως αυτός εκάστοτε ισχύει. Στην περίπτωση που ενδεχομένως θα ενεργοποιούνταν η διαδικασία καταβολής αποζημίωσης από το ΤΕΚΕ, για τον υπολογισμό της γίνεται συμψηφισμός των πιστωτικών υπολοίπων των λογαριασμών καταθέσεων με τις πάσης φύσεως ανταπαιτήσεις που έχει η Τράπεζα κατά του δικαιούχου καταθέτη, οι οποίες έχουν καταστεί ληξιπρόθεσμες και απαιτητές κατά ή πριν από την ημερομηνία αδυναμίας, σύμφωνα με όσα ορίζονται από τον Αστικό Κώδικα, τα στοιχεία και οι πληροφορίες που παρέχει στο ΤΕΚΕ ο εκκαθαριστής του πιστωτικού ιδρύματος και το νομικό και συμβατικό πλαίσιο που διέπει τη συνολική σχέση μεταξύ του καταθέτη και του υπό εκκαθάριση πιστωτικού ιδρύματος. Σημειώνεται ότι το ΤΕΚΕ δεν καταβάλλει αποζημίωση, όταν μέσα στους τελευταίους 24 μήνες δεν έλαβε χώρα συναλλαγή σχετική με την κατάθεση και όταν η αξία της κατάθεσης είναι μικρότερη από το διοικητικό κόστος που δυνητικά θα μπορούσε να προκαλέσει στο ΤΕΚΕ η υποχρέωση καταβολής της αποζημίωσης αυτής. Με τον όρο συναλλαγή νοείται κάθε πραγματική συναλλαγή δικαιούχου, καταθέτη ή τρίτου που ενεργεί κατ’ εντολή οποιουδήποτε δικαιούχου, όπως και κάθε αίτημα που υποβάλλει ο δικαιούχος προς την Τράπεζα με σκοπό να ενημερωθεί σχετικά με το υπόλοιπο του καταθετικού του λογαριασμού. Οι πελάτες της Τράπεζας μπορούν να ενημερώνονται για όλα όσα αφορούν τη λειτουργία του ΤΕΚΕ και την εγγύηση των καταθέσεων καθώς και τις τυχόν εξαιρέσεις ορισμένων κατηγοριών καταθέσεων από τον δικτυακό τόπο του ΤΕΚΕ (www.teke.gr) και από το παρόν έντυπο που διατίθεται και στα Καταστήματα της Τράπεζάς μας. Μπορείτε να κατεβάσετε το έντυπο εδώ. Εγγύηση Επενδύσεων Μπορείτε να κατεβάσετε το έντυπο εδώ"
