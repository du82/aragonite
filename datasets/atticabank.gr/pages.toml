full_description = "Με μία γρήγορη ματιά Με το χρηματοδοτικό πρόγραμμα Attica Hospitality Sustain, η Attica Bank στέκεται στο πλευρό των ξενοδοχειακών επιχειρήσεων στην πορεία τους προς τη βιωσιμότητα και την ενεργειακή απόδοση, προσφέροντας πρακτικές και οικονομικά βιώσιμες λύσεις. Το Attica Hospitality Sustain καλύπτει ευρύ φάσμα ενεργειακών και βιώσιμων επενδύσεων: Αγορά και εγκατάσταση φωτοβολταϊκών συστημάτων. Αντικατάσταση κουφωμάτων και θερμομόνωσης. Αναβάθμιση συστημάτων ψύξης και ζεστού νερού με ΑΠΕ. Παρεμβάσεις εξοικονόμησης ενέργειας και smart home λύσεις. Όσα χρειάζεται να γνωρίζετε 1 Ύψος ΧρηματοδότησηςΈως €200.000 μέσω δανείων τακτής λήξης και προϊόντων leasing. 2 Διαδικασία ΈγκρισηςΆμεση έγκριση εντός 10-15 ημερών με πλήρη υποβολή δικαιολογητικών. 3 ΕπιτόκιοΑνταγωνιστικό, για οικονομικά αποδοτικές επενδύσεις. 4 ΑσφάλειαΑσφαλιστικό προϊόν Hospital Services σε ιδιαίτερα ανταγωνιστική τιμή και με παρεχόμενες καλύψεις όπως: – Επείγουσα αερομεταφορά– Τηλεφωνικές ιατρικές συμβουλές 24/7 σε πέντε γλώσσες– Οργάνωση επαναπατρισμού για όλα τα περιστατικά– Υπεύθυνη ιατρική κατεύθυνση και υποστήριξη για θέματα Covid-19 5 Περίοδος ΧάριτοςΠερίοδος χάριτος έως 9 μήνες για προσαρμογή στις επενδύσεις. 6 Διάρκεια ΔανείουΑποπληρωμή σε περίοδο 3 ετών. 7 ΑποπληρωμήΤριμηνιαίες χρεολυτικές δόσεις για ευκολία στην αποπληρωμή. Επιπλέον Οφέλη Χρήση προϊόντων Leasing για νέους εξοπλισμούς. Εκταμίευση δανείου με απευθείας πληρωμές σε προμηθευτές. Έκπτωση έως 30% στο διαχειριστικό κόστος POS της Attica Bank. Εκπτώσεις σε εμβάσματα και εντολές πληρωμής. Εταιρικές πιστωτικές κάρτες και προνομιακά επιτόκια σε καταθετικά. Δείτε επίσης Hospitality Develop για να καλύψετε επενδυτικές ανάγκες και να αναπτύξετε την επιχείρησή σας Hospitality Operate για την ενίσχυση της ρευστότητας της επιχείρησής σας Ενημερωθείτε Επισκεφθείτε ένα κατάστημά μας. Φροντίστε να έχετε μαζί σας όλα τα απαραίτητα έγγραφα."
