["https://www.atticabank.gr/el/anoigma-meridas-logariasmou-s-a-t-tou-chrimatistiriou-athinon-gia-tous-metochous-tis-pagkritias-trapezas"]
title = "Άνοιγμα μερίδας & λογαριασμού Σ.Α.Τ. του Χρηματιστηρίου Αθηνών για τους μετόχους της Παγκρήτιας Τράπεζας - Attica Bank"
description = "Στο πλαίσιο της σκοπούμενης συγχώνευσης με απορρόφηση της Παγκρήτιας Τράπεζας από την Attica Bank και εφόσον ληφθούν οι απαιτούμενες εγκρίσεις από όλες τις αρμόδιες αρχές και τις Γενικές Συνελεύσεις…"
full_description = "Στο πλαίσιο της σκοπούμενης συγχώνευσης με απορρόφηση της Παγκρήτιας Τράπεζας από την Attica Bank και εφόσον ληφθούν οι απαιτούμενες εγκρίσεις από όλες τις αρμόδιες αρχές και τις Γενικές Συνελεύσεις των δύο τραπεζών, οι μέτοχοι της Παγκρήτιας θα δικαιούνται να λάβουν μετοχές της Attica Bank κατά την προτεινόμενη σχέση ανταλλαγής μετοχών Ως δικαιούχος μέτοχος της Παγκρήτιας Τράπεζας και προκειμένου να παραλάβετε τις νέες μετοχές σας από την Attica Bank θα πρέπει να διαθέτετε λογαριασμό αξιογράφων στο Σύστημα Άυλων Τίτλων (Σ.Α.Τ) που διαχειρίζεται το Ελληνικό Κεντρικό Αποθετήριο Τίτλων. Αν δεν διαθέτετε Μερίδα και Λογαριασμό Αξιογράφων στο Σ.Α.Τ. μπορείτε να επισκεφτείτε οποιαδήποτε Τράπεζα ή/και χρηματιστηριακή εταιρεία και μεταξύ άλλων και τα καταστήματα του δικτύου της Attica Bank για να υποβάλλετε την αίτηση σας. Σε περίπτωση που προσέλθετε στην Attica Bank θα αναλάβουμε εμείς την ολοκλήρωση της διαδικασίας ανοίγματος με το Ελληνικό Αποθετήριο Τίτλων. Διαδικασία ανοίγματος λογαριασμού αξιογράφων στο Σ.Α.Τ. Εαν δεν είστε πελάτης της Attica BankΘα χρειαστεί να προβείτε σε άνοιγμα Κωδικού Πελάτη, προσκομίζοντας στο κατάστημα τα απαραίτητα δικαιολογητικά. Εαν είστε ήδη πελάτης της Attica BankΘα χρειαστεί να προβείτε στην επικαιροποίηση των στοιχείων σας, εφόσον απαιτείται. Για την επίσκεψη σας στα καταστήματα της Attica Bank δεν απαιτείται ραντεβού Ποια δικαιολογητικά χρειάζεται να μας προσκομίσετε Βρείτε εδώ τα δικαιολογητικά που είναι απαραίτητα για την πιστοποίηση των προσωπικών σας στοιχείων. Εάν είστε Έλληνας και μόνιμος κάτοικος Ελλάδας, φυσικό πρόσωπο, μισθωτός ιδιωτικού ή δημοσίου τομέα, ελεύθερος επαγγελματίας ή ατομική επιχείρηση, τότε έχετε την επιλογή να πιστοποιήσετε τα προσωπικά σας στοιχεία μέσω της υπηρεσίας eGOV-KYC. Θα χρειαστεί να έχετε μαζί σας τους κωδικούς σας TAXISnet και το Δελτίο της Αστυνομικής σας Ταυτότητας. Τα φυσικά πρόσωπα θα πρέπει επίσης να έχουν διαθέσιμο το ΑΜΚΑ τους, ενώ τα Νομικά Πρόσωπα θα πρέπει να γνωρίζουν το LEI. Μετά το άνοιγμα του λογαριασμού αξιογράφων στο Σ.Α.Τ, θα πρέπει άμεσα να ενημερώσετε την Παγκρήτια Τράπεζα, όπως περιγράφεται αναλυτικά στη σχετική ανακοίνωση."
