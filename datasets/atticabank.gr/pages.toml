title = "Attica Bank API Portal - Attica Bank"
description = "Το πλαίσιο PSD2 (Payment Services Directive 2) αποτελεί τη νέα Οδηγία για τις Υπηρεσίες Πληρωμών, η οποία ενσωματώθηκε στο Ελληνικό Δίκαιο με τον Ν.4537/2018. Στόχος της Οδηγίας 2015/2366/"
full_description = "Oδηγία PSD2 Το πλαίσιο PSD2 (Payment Services Directive 2) αποτελεί τη νέα Οδηγία για τις Υπηρεσίες Πληρωμών, η οποία ενσωματώθηκε στο Ελληνικό Δίκαιο με τον Ν.4537/2018. Στόχος της Οδηγίας 2015/2366/ΕΕ είναι η ενίσχυση της ασφάλειας και της ταχύτητας των ηλεκτρονικών συναλλαγών καθώς και η ρύθμιση των νέων υπηρεσιών πληρωμών. Διευκολύνονται οι διασυνοριακές συναλλαγές, ώστε οι παρεχόμενες υπηρεσίες να είναι πιο διαφανείς και ασφαλείς για τους χρήστες και να ενισχύεται η ανταγωνιστικότητα και η καινοτομία. Οι διατάξεις του Νόμου εφαρμόζονται στις υπηρεσίες πληρωμών που παρέχονται εντός του Ευρωπαϊκού Οικονομικού Χώρου (ΕΟΧ). Οι Τράπεζες καλούνται να προσαρμόσουν τα συστήματα και τους όρους παροχής υπηρεσιών τους στις νέες διατάξεις του Ν.4537/2018, με σκοπό την εξυπηρέτηση των συναλλασσόμενων με καινοτόμες και ασφαλείς ηλεκτρονικές λύσεις. Σύμφωνα με την οδηγία PSD2, οι τράπεζες θα παρέχουν APIs σε Third Party Providers (TTPs), όπως εταιρείες FinTech, κατασκευαστές εφαρμογών και startups, επιτρέποντας την ασφαλή online επικοινωνία και πιστοποίηση τραπεζικών στοιχείων. Attica Bank API Portal Τι είναι τα APIs Η τεχνολογία API (Application Programming Interface) ή Διεπαφή Προγραμματισμού Εφαρμογών που παρέχεται μέσω του Atticabank API Portal, επιτρέπει την ανταλλαγή δεδομένων, όπως πληροφορίες λογαριασμών και υπηρεσίες εκκίνησης πληρωμών. Σε ποιους απευθύνονται τα APIs Aπευθύνονται σε παρόχους TPPs (Third Party Providers) όπως: AISPs (Παρόχους υπηρεσιών πληροφοριών λογαριασμών / Account Information Service Providers ) – Πρόκειται για παρόχους υπηρεσιών συγκέντρωσης οικονομικών δεδομένων πελατών τους, από διαφορετικές τράπεζες, σε μία τοποθεσία. PISPs (Παρόχους υπηρεσιών εκκίνησης πληρωμών / Payment Initiation Service Providers) – Πρόκειται για παρόχους ψηφιακών υπηρεσιών για άμεση μεταφορά χρημάτων μεταξύ λογαριασμών εντολέα και δικαιούχου. Η συνεργασία μεταξύ τραπεζών και TPPs επιτρέπει την ενίσχυση της εμπειρίας των πελατών, ώστε να τους προσφέρει σημαντικά οφέλη: Αυξημένη προστασία των δεδομένων τους. Μεγαλύτερη ασφάλεια στις online συναλλαγές. Πρόσβαση σε καινοτόμα προϊόντα και υπηρεσίες. Οι πελάτες έχουν το δικαίωμα να επιλέξουν τον TPP με τον οποίο θέλουν να συνεργαστούν. Οι TPPs πρέπει να εξασφαλίσουν τη ρητή συγκατάθεση των πελατών πριν αποκτήσουν πρόσβαση στα δεδομένα τους. Το Attica Bank API Portal Σε συμμόρφωση με τα οριζόμενα στο πλαίσιο της PSD 2, η Attica Bank ανέπτυξε το Attica Bank API Portal, που επιτρέπει σε τρίτους παρόχους (TPPs), όπως εταιρείες FinTech, και StartUps να κάνουν χρήση των APIs στα νέα προϊόντα και υπηρεσίες που αναπτύσσουν. Αρχικά οι TPPs μπορούν να κάνουν εγγραφή και να εξετάσουν την τεχνολογία API της Attica Bank σε δοκιμαστικό περιβάλλον (Sandbox). Το Attica bank ΑPI Portal είναι σε παραγωγικό περιβάλλον και πλήρως λειτουργικό από 24.05.2019. Ανακοίνωση Στατιστικών Στοιχείων Στο πλαίσιο PSD2 (Payment Services Directive 2), η Attica Bank σε τριμηνιαία βάση προβαίνει σε δημοσίευση αναφορών με ημερήσια στοιχεία σχετικά με τη Διαθεσιμότητα και Επίδοση των: Open APIs, που παρέχονται μέσω του Atticabank API Portal Υπηρεσίας Attica e-banking Υπηρεσίας Attica Mobile Οι Αναφορές περιλαμβάνουν τους παρακάτω δείκτες: ΔΕΙΚΤΕΣ ΟΡΙΣΜΟΙ Uptime (%) Ημερήσιο Ποσοστό Χρόνου Διαθεσιμότητας Downtime (%) Ημερήσιο Ποσοστό χρόνου Μη Διαθεσιμότητας PISP Single Response (ms) Μέσος ημερήσιος Χρόνος (σε χιλιοστά του δευτερολέπτου) που απαιτείται ανά αίτημα, για την παροχή των απαραίτητων πληροφοριών στον Πάροχο εκκίνησης Πληρωμών (PISP) AISP Response (ms) Μέσος ημερήσιος Χρόνος (σε χιλιοστά του δευτερολέπτου) που απαιτείται για ένα αίτημα, για την παροχή των απαραίτητων πληροφοριών λογαριασμού (αίτημα ανάκτησης υπολοίπου λογαριασμού ή αίτημα ανάκτησης ιστορικών κινήσεων) στον πάροχο Πληροφοριών Λογαριασμού (AISP) CoF Response (ms) Μέσος ημερήσιος Χρόνος (σε χιλιοστά του δευτερολέπτου) που απαιτείται ανά αίτημα, για το Confirmation of Funds Error Rate (%) Ημερήσιο Ποσοστό απαντήσεων με σφάλμα API Portal SandboxAPI Portal Αναφορές στατιστικών 2024 Αναφορά Διαθεσιμότητας και Επίδοσης Διεπαφών 01/01/2024 – 31/03/2024 Statistics_Q1_2024 Αναφορά Διαθεσιμότητας και Επίδοσης Διεπαφών 01/04/2024 – 30/06/2024 Statistics Q2 2024 Αναφορά Διαθεσιμότητας και Επίδοσης Διεπαφών 01/07/2024 – 30/09/2024 Statistics Q3 2024 Αναφορά Διαθεσιμότητας και Επίδοσης Διεπαφών 01/10/2024 – 31/12/2024 Statistics Q4 2024 Αναφορές στατιστικών 2023 Αναφορά Διαθεσιμότητας και Επίδοσης Διεπαφών 01/01/2023 – 31/03/2023 Statistics_Q1_2023 Αναφορά Διαθεσιμότητας και Επίδοσης Διεπαφών 01/04/2023 – 30/06/2023 Statistics_Q2_2023 Αναφορά Διαθεσιμότητας και Επίδοσης Διεπαφών 01/07/2023 – 30/09/2023 Statistics_Q3_2023 Αναφορά Διαθεσιμότητας και Επίδοσης Διεπαφών 01/10/2023 – 31/12/2023 Statistics_Q4_2023 Αναφορές στατιστικών 2022 Αναφορά Διαθεσιμότητας και Επίδοσης Διεπαφών 01/01/2022 – 31/03/2022 Statistics_Q1_2022 Αναφορά Διαθεσιμότητας και Επίδοσης Διεπαφών 01/04/2022 – 30/06/2022 Statistics_Q2_2022 Αναφορά Διαθεσιμότητας και Επίδοσης Διεπαφών 01/07/2022 – 30/09/2022 Statistics_Q3_2022 Αναφορά Διαθεσιμότητας και Επίδοσης Διεπαφών 01/10/2022 – 31/12/2022 Statistics_Q4_2022"
