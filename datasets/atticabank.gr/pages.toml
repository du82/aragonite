full_description = "Με μια γρήγορη ματιά! Χρηματοδοτικό Πρόγραμμα σχεδιασμένο για να καλύπτει τις ανάγκες σε κεφάλαιο κίνησης επιχειρήσεων με εξαγωγική δραστηριότητα. Σε ποιες επιχειρήσεις απευθύνεται Το Attica Export απευθύνεται σε εξαγωγικές επιχειρήσεις ασφαλισμένες στην Export Credit Greece (ECG) ή σε άλλο ασφαλιστικό φορέα που πληρούν τις παρακάτω προϋποθέσεις: Έχουν κύκλο εργασιών άνω των €2.500.000 Η εξαγωγική τους δραστηριότητα είναι άνω του 10% του κύκλου εργασιών για την προηγούμενη διετία με ίδιο εξαγωγικό αντικείμενο και συναλλακτικό κύκλωμα προμηθευτών –πελατών Οφέλη για την επιχείρηση Προχρηματοδότηση συμβάσεων ή και παραγγελιών για την προετοιμασία των προς εξαγωγή προϊόντων Ανταγωνιστικοί όροι για την επιχείρηση Fast track διαδικασίες αξιολόγησης, έγκρισης και εκταμίευσης Ενίσχυση της ρευστότητας και ενδυνάμωση του εξαγωγικού προσανατολισμού Όσα χρειάζεται να γνωρίζετε 1 Ύψος χρηματοδότησηςΈως € 1.000.000 ανακυκλούμενη χρηματοδότηση σε δυο (2) φάσεις: στην 1η φάση προχρηματοδοτείται έως και το 60% του ύψους της παραγγελίας ή της σύμβασης (αφαιρούμενης της προκαταβολής εάν η σχετική συμφωνία το προβλέπει) στην 2η φάση με την έκδοση του τιμολογίου, χρηματοδοτείται έως και το 90% της υπόλοιπης αξίας αυτού και μέχρι το 100% του δικαιώματος ασφαλιστικής αποζημίωσης Το όριο ανανεώνεται κάθε 12 μήνες 2 Διαδικασία έγκρισηςFast track διαδικασία έγκρισης βάσει κριτηρίων και με πλήρη υποβολή των απαιτούμενων δικαιολογητικών 3 ΕπιτόκιοΠρονομιακοί όροι τιμολόγησης με ανταγωνιστικό επιτόκιο 4 Διάρκεια ΔανείουΜέχρι την ημερομηνία πληρωμής των χρηματοδοτούμενων τιμολογίων, με μέγιστη διάρκεια 6 μήνες 5 Αποπληρωμή Πληρωμή κεφαλαίου, με την εξόφληση των τιμολογημένων πωλήσεων στο εξωτερικό Πληρωμή τόκων ανά 3μηνο, μόνο για το κεφάλαιο που έχει χρησιμοποιηθεί 6 ΕξασφαλίσειςΔεν απαιτείται η λήψη εμπράγματων εξασφαλίσεων, πλην της εκχώρησης του δικαιώματος εκ της ασφαλιστικής αποζημίωσης και (τυχόν) προσωπικών εγγυήσεων των φορέων Ενημερωθείτε Επισκεφθείτε ένα κατάστημά μας. Φροντίστε να έχετε μαζί σας όλα τα απαραίτητα έγγραφα."
