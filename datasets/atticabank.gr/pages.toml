full_description = "Η ATTICA BANK ΑΝΩΝΥΜΗ ΤΡΑΠΕΖΙΚΗ ΕΤΑΙΡΕΙΑ, η οποία εδρεύει στην Αθήνα, επί της οδού Παλαιών Πατρών Γερμανού αρ. 3-5, Τ.Κ 105 61, (τηλ. επικοινωνίας 210 3669000) (εφεξής «Τράπεζα» ), υπό την ιδιότητά της ως Υπεύθυνης Επεξεργασίας, σας παρέχει την ακόλουθη ενημέρωση για την επεξεργασία των προσωπικών σας δεδομένων στο πλαίσιο της συναλλακτικής σας σχέσης με την Τράπεζα, σύμφωνα με τον Κανονισμό (ΕΕ) 2016/679 (εφεξής «ΓΚΠΔ»), τον Ν. 4624/2019 και τις σχετικές διατάξεις της κείμενης ελληνικής και ενωσιακής νομοθεσίας περί προστασίας δεδομένων προσωπικού χαρακτήρα. Ειδικότερα, η παρούσα ενημέρωση αφορά σε φυσικά πρόσωπα -υποκείμενα προσωπικών δεδομένων που, υπό οποιαδήποτε ιδιότητα, έχουν συναλλακτική σχέση με την Τράπεζα, όπως ενδεικτικά σε ενεργούς, υποψήφιους και πρώην πελάτες, διερχόμενους πελάτες, πρόσωπα, που έχουν παράσχει εγγύηση ή ασφάλεια υπέρ των ως άνω προσώπων, εν γένει συναλλασσόμενους, προμηθευτές και συνεργάτες της Τράπεζας, ομολογιούχους δανειστές, πραγματικούς δικαιούχους νομικών προσώπων ή οντοτήτων, τρίτα πρόσωπα σχετιζόμενα με τους ανωτέρω {ενδεικτικά: πληρεξούσιους, εκπροσώπους, αντιπροσώπους, εργαζομένους τους/συνεργάτες, μετόχους, αντισυμβαλλόμενους/ συναλλασσόμενους πελατών, όπου απαιτείται για την παροχή υπηρεσιών λ.χ. πληρωτές ή δικαιούχους σε συναλλαγές υπηρεσιών πληρωμών, μέλη οικογένειας, δικηγόρους, αντικλήτους κ.λπ.}. Η παρούσα ενημέρωση ενδέχεται να συμπληρώνεται με ειδικότερες κατά περίπτωση ενημερώσεις (ενδεικτικά: σε περιπτώσεις επεξεργασίας δεδομένων ειδικών κατηγοριών, cookies, εικόνων από τα συστήματα βιντεοεπιτήρησης της Τράπεζας κ.λπ.). Συχνές Ερωτήσεις 1. Ποια προσωπικά σας δεδομένα συλλέγουμε και από πού; H Τράπεζα συλλέγει και επεξεργάζεται τα προσωπικά δεδομένα, που είναι απαραίτητα για την επίτευξη του εκάστοτε επιδιωκόμενου σκοπού επεξεργασίας. Τα δεδομένα προσωπικού χαρακτήρα συλλέγονται, είτε απευθείας από εσάς, είτε στο πλαίσιο της συμβατικής σας σχέσης με την Τράπεζα είτε από δημόσιες αρχές, φορείς και τρίτες εταιρείες και πάντοτε με τρόπο θεμιτό και νόμιμο , σύμφωνα με όσα ειδικώς αναφέρονται κατωτέρω:1.1. Δεδομένα ταυτοποίησής σας, όπως ονοματεπώνυμο, πατρώνυμο, μητρώνυμο, στοιχεία Δελτίου Ταυτότητας ή Διαβατηρίου, ΑΦΜ, ΑΜΚΑ, φύλο, ημερομηνία και τόπος γέννησης, υπηκοότητα, δεδομένα υπογραφής. 1.2. Δεδομένα επικοινωνίας σας, όπως διεύθυνση κατοικίας, διεύθυνση αλληλογραφίας, ηλεκτρονική διεύθυνση, σταθερό και κινητό τηλέφωνο, όπως αυτά προκύπτουν από λογαριασμούς ΔΕΚΟ και εταιρειών σταθερής και κινητής τηλεφωνίας.Τα υπό 1.1 και 1.2. δεδομένα, συλλέγονται/επαληθεύονται/ επικαιροποιούνται απευθείας από εσάς ή από την Τράπεζα όπου αυτό επιτρέπεται, μέσω βάσεων δεδομένων με ή χωρίς σχετική εντολή/εξουσιοδότησή σας (π.χ. eGov-KYC της Γενικής Γραμματείας Πληροφοριακών Συστημάτων), ή μέσω δημόσια προβάσιμων πηγών ως τέτοιων νοούμενων, ενδεικτικά, των υποθηκοφυλακείων, κτηματολογικών γραφείων, δικαστηρίων, μητρώων, κ.λπ., ή/και από συνεργαζόμενες με την Τράπεζα εταιρείες ενημέρωσης οφειλετών (Ν. 3758/2009, όπως ισχύει), εταιρείες διαχείρισης απαιτήσεων (Ν. 4354/2015 όπως ισχύει κατόπιν της δημοσίευσης του Ν. 5072/2023), ή δικηγόρους και δικηγορικές εταιρείες, δικαστικούς επιμελητές και εν γένει φυσικά ή νομικά πρόσωπα, που αναλαμβάνουν για λογαριασμό της Τράπεζας την επικαιροποίηση των στοιχείων επικοινωνίας σας σε περίπτωση, που έχετε οι ίδιοι παραλείψει να γνωστοποιήσετε σχετική μεταβολή στην Τράπεζα.1.3. Δεδομένα οικονομικής, περιουσιακής και οικογενειακής κατάστασης όπως επαγγελματικά στοιχεία και διεύθυνση εργασίας, αποδοχές, φορολογικά έντυπα Ε1, Ε9, ΕΝΦΙΑ και εκκαθαριστικά σημειώματα, αντίγραφα μισθοδοσίας, βεβαιώσεις ασφαλιστικής ή/και φορολογικής ενημερότητας, έγγραφα κτήσης ή μεταβίβασης κινητής ή ακίνητης περιουσίας, φορολογική κατοικία, έγγαμη ή μη κατάσταση, εξαρτώμενα μέλη, κ.λπ.Τα εν λόγω δεδομένα συλλέγονται/επαληθεύονται/επικαιροποιούνται είτε απευθείας από εσάς ή από εξουσιοδοτημένα από εσάς πρόσωπα, ή από την Τράπεζα όπου αυτό επιτρέπεται μέσω βάσεων δεδομένων με ή χωρίς σχετική εντολή/εξουσιοδότησή σας (π.χ. eGov-KYC της Γενικής Γραμματείας Πληροφοριακών Συστημάτων, e-ΕΦΚΑ του Εθνικού Φορέα Κοινωνικής Ασφάλισης κ.λπ.), ή μέσω δημόσια προβάσιμων πηγών ως τέτοιων νοούμενων, ενδεικτικά, των υποθηκοφυλακείων, κτηματολογικών γραφείων, δικαστηρίων, φορολογικών αρχών ή από αρχεία δεδομένων της ΤΕΙΡΕΣΙΑΣ Α.Ε. (βλ. κατωτέρω).1.4. Δεδομένα αθέτησης των οικονομικών σας υποχρεώσεων, όπως ακάλυπτες επιταγές, καταγγελίες συμβάσεων δανείων και πιστώσεων, διαταγές πληρωμής, κατασχέσεις και επιταγές πληρωμής, αιτήσεις και αποφάσεις για υπαγωγή σε διαδικασίες προπτωχευτικές, πτωχευτικές ή εξυγιαντικές.1.5. Δεδομένα που αφορούν στην πιστοληπτική σας ικανότητα, όπως οφειλές σας σε πιστωτικά ή/και χρηματοδοτικά ιδρύματα από δάνεια και πιστώσεις, εγγυητικές επιστολές ή/και ενέγγυες πιστώσεις κ.λπ. 1.6. Δεδομένα πιστωτικής σας βαθμολόγησης (credit scoring – credit profiling) 1.7. Δεδομένα της συναλλακτικής σας συμπεριφοράς, όπως δεδομένα που προκύπτουν από τη λειτουργία της σύμβασης (-εων) σας με την Τράπεζα, στις οποίες μετέχετε ως αντισυμβαλλόμενος ή με οποιαδήποτε άλλη ιδιότητα, δεδομένα από τη χρήση προϊόντων και υπηρεσιών της Τράπεζας καθώς και από έγγραφα και δικαιολογητικά, που προσκομίζετε ή αποστέλλετε στην Τράπεζα, όπως επίσης , από ερωτηματολόγια που συμπληρώνετε είτε κατά τη διάρκεια της συμβατικής σας σχέσης είτε σε προσυμβατικό στάδιo.Τα υπό 1.4. -1.7. δεδομένα, παράγονται και συλλέγονται από τα πληροφοριακά συστήματα της Τράπεζας στα πλαίσια των συναλλακτικών σας σχέσεων με αυτή ή/και από άλλα πιστωτικά ή/και χρηματοδοτικά ιδρύματα, όπου αυτό επιτρέπεται, ή/και από αρχεία δεδομένων οικονομικής συμπεριφοράς, κυρίως από τα συστήματα της εταιρείας ΤΕΙΡΕΣΙΑΣ Α.Ε. (βλ. κατωτέρω), καθώς και από συνεργαζόμενες με την Τράπεζα εταιρείες ενημέρωσης οφειλετών (Ν. 3758/2009 όπως ισχύει), εταιρείες διαχείρισης απαιτήσεων (Ν. 4354/2015 όπως ισχύει) ή δικηγόρους και δικηγορικές εταιρείες, για σχετικές υποθέσεις, που τους ανατίθενται από την Τράπεζα.1.8. Δεδομένα διενέργειας πράξεων πληρωμών και παροχής υπηρεσιών πληρωμών, όπως ενδεικτικά δεδομένα για την εκτέλεση εντολών μεταφοράς χρημάτων από/σε λογαριασμό πληρωμών, εμβασμά¬των, εντολών άμεσης χρέωσης, συναλλαγών με την χρήση μέσων πληρωμής κ.λπ. Τα δεδομένα αυτά συλλέγονται είτε από εσάς είτε από παρόχους υπηρεσιών πληρωμών κατ’ εντολή σας. Στα δεδομένα αυτά, είναι δυνατό, εκτός από τα δικά σας δεδομένα, να περιλαμβάνονται και δεδομένα τρίτων προσώπων που συνδέονται µε την πράξη πληρωμής µε την ιδιότητα του πληρωτή ή του δικαιούχου. 1.9. Δεδομένα συμβάσεων για την αποδοχή και εκκαθάριση καρτών (αcquiring), οι οποίες έχουν καταγγελθεί από τα συνεργαζόμενα με εσάς πιστωτικά ιδρύματα ή εταιρείες έκδοσης και διαχείρισης καρτών, για λόγους, που συνιστούν αθέτηση των συγκεκριμένων όρων των σχετικών συμβάσεων (π.χ. αποδοχή καρτών που έχουν δηλωθεί ως απωλεσθείσες, εικονικές συναλλαγές, αυτοχρηματοδότηση κ.λπ.).Τα δεδομένα αυτά συλλέγονται από την Τράπεζα ή/και από την εταιρεία ΤΕΙΡΕΣΙΑΣ Α.Ε. (βλ. κατωτέρω).1.10. Δεδομένα επενδυτικού προφίλ και συναλλαγών όπου συμπεριλαμβάνονται δεδομένα σχετικά με τις γνώσεις και την εμπειρία σας στον επενδυτικό τομέα, τη χρηματοοικονομική σας κατάσταση, το επίπεδο ανοχής σας στον κίνδυνο, τους επενδυτικούς σας στόχους, καθώς και δεδομένα που προκύπτουν από τις επενδυτικές σας συναλλαγές ή/και την απόκτηση επενδυτικών προϊόντων. Επιπλέον, περιλαμβάνονται δεδομένα των κεφαλαίων και χρηματοπιστωτικών μέσων, που κατέχετε και αποκτήθηκαν μέσω της Τράπεζας ή φυλάσσονται σε αυτήν, σύμφωνα με την εκάστοτε εφαρμοστέα νομοθεσία. Τα δεδομένα αυτά συλλέγονται απευθείας από εσάς ή/και από την Τράπεζα στο πλαίσιο των επενδυτικών σας συναλλαγών με αυτή.1.11. Δεδομένα συναλλαγών επί χρηματοπιστωτικών μέσων και ανταλλαγής ή παροχής χρηματοοικονομικών πληροφοριών, που συλλέγονται στο πλαίσιο της συμμόρφωσης με εφαρμοστέες νομικές ή κανονιστικές διατάξεις (όπως ο Κανονισμός (ΕΕ) 648/2012 (EMIR), ο Κανονισμός (ΕΕ) 600/2014 (MIFIR), FATCA, CRS, δηλωτέες διασυνοριακές ρυθμίσεις (DAC6) κ.λπ.) και τις σχετικές διεθνείς υποχρεώσεις της Ελλάδας.1.12. Δεδομένα που σχετίζονται με τη χορήγηση ασφαλιστικών προϊόντων με τη διαμεσολάβηση της Τράπεζας, όπως δεδομένα που απαιτούνται για την σύναψη της ασφαλιστικής σύμβασης και τους καλυπτόμενους κινδύνους, καθώς και από το νομικό και κανονιστικό πλαίσιο. Τα δεδομένα αυτά συλλέγονται απευθείας από εσάς. 1.13. Δεδομένα που προκύπτουν από ασφάλειες/εξασφαλίσεις (συμπεριλαμβανομένων και των ασφαλίσεων) στο όνομα ή υπέρ της Τράπεζας.1.14. Δεδομένα αξιολόγησης του κινδύνου νομιμοποίησης εσόδων από παράνομες δραστηριότητες ή/και χρηματοδότησης της τρομοκρατίας, τα οποία συλλέγονται απευθείας από εσάς, από τις πραγματοποιούμενες συναλλαγές σας, από την ΤΕΙΡΕΙΣΙΑΣ Α.Ε. (βλ. κατωτέρω) και από αρχές και φορείς, που είναι επιφορτισμένοι με την πρόληψη και καταστολή των προαναφερθέντων αδικημάτων.1.15. Δεδομένα πραγματικών δικαιούχων νομικών προσώπων ή οντοτήτων που είναι ενεργοί, υποψήφιοι ή πρώην πελάτες της Τράπεζας ή εν γένει συναλλασσόμενοι.1.16. Δεδομένα αναγνωριστικά της ηλεκτρονικής σας ταυτότητας και σύνδεσης σας σε υπηρεσίες ηλεκτρονικής Τραπεζικής (π.χ. e-banking, mobile banking), δεδομένα συναλλακτικής συμπεριφοράς που αφορούν την εν γένει παροχή υπηρεσιών ηλεκτρονικής τραπεζικής και τη χρήση ηλεκτρονικών ή/και ψηφιακών προϊόντων, υπηρεσιών και εφαρμογών της Τράπεζας όπως διευθύνσεις διαδικτυακού πρωτοκόλλου (IP Addresses) ή άλλα επιγραμμικά/online αναγνωριστικά στοιχεία, όπως δεδομένα θέσης, δεδομένα πλοηγήσεως στο διαδίκτυο (cookies), τα οποία μόνα τους ή συνδυαστικά με μοναδικά αναγνωριστικά στοιχεία ταυτότητας, δύναται να χρησιμοποιηθούν για την ταυτοποίησή σας.Τα εν λόγω δεδομένα συλλέγονται απευθείας από εσάς, από τα συστήματα ή τις εφαρμογές της Τράπεζας που χρησιμοποιείτε, καθώς και από συνεργαζόμενους με την Τράπεζα παρόχους υπηρεσιών (π.χ. Google).1.17. Δεδομένα τηλεφωνικών σας επικοινωνιών ή βιντεοκλήσεων με την Τράπεζα, που καταγράφονται κατόπιν προηγούμενης ενημέρωσής σας, σύμφωνα και με όσα προβλέπει η κείμενη νομοθεσία.1.18. Δεδομένα εικόνας από τα συστήματα βιντεοσκόπησης των χώρων της Τράπεζας, στους οποίους υπάρχουν οι σχετικές κατά νόμο σημάνσεις (π.χ. εισόδους καταστημάτων και κεντρικών κτηρίων της Τράπεζας, ταμεία συναλλαγών, ΑΤΜ).1.19. Ειδικές κατηγορίες δεδομένων, όπως δεδομένα υγείας σας ή/και των εξαρτώμενων μελών της οικογένειάς σας, που υποβάλλονται στην Τράπεζα από εσάς τους ίδιους, σε ειδικές περιπτώσεις (π.χ. για τη ρύθμιση τυχόν οφειλών σας) μόνο κατόπιν δική σας πρωτοβουλίας, εφόσον εσείς τα επικαλείστε, καθώς και βιομετρικά δεδομένα που αφορούν στα χαρακτηριστικά της ηλεκτρονικής υπογραφής σας και στην εικόνα του προσώπου σας υπό τη μορφή δυναμικού αυτοπορτρέτου (dynamic-selfie), που υποβάλλετε στο πλαίσιο της εξ αποστάσεως διαδικασίας ταυτοποίησης για τη χορήγηση προϊόντων και υπηρεσιών της Τράπεζας. Τα δεδομένα αυτά συλλέγονται και επεξεργάζονται από την Τράπεζα μόνο εφόσον συντρέχουν οι εκάστοτε νόμιμες προϋποθέσεις. 1.20. Δεδομένα για τη διεξαγωγή και τη συμμετοχή σας σε κληρώσεις, διαγωνισμούς και προγράμματα επιβράβευσης της Τράπεζας, τα οποία συλλέγουμε από εσάς ή από τη λειτουργία σύμβασης (-εων) σας με την Τράπεζα ή από τη διενέργεια συναλλαγών καθώς και από τη χρήση προϊόντων ή υπηρεσιών της Τράπεζας.1.21. Το εγκεκριμένο πιστοποιητικό ηλεκτρονικής υπογραφής σας, το οποίο εκδίδεται και συλλέγεται από τους Εγκεκριμένους Παρόχους Υπηρεσιών Εμπιστοσύνης με τους οποίους συνεργάζεται η Τράπεζα, σύμφωνα με το εκάστοτε ισχύον θεσμικό πλαίσιο. 1.22. Δεδομένα ανηλίκων (άτομα που δεν έχουν συμπληρώσει το 18ο έτος της ηλικίας τους), τα οποία συλλέγει και επεξεργάζεται η Τράπεζα με την προϋπόθεση της προηγούμενης συγκατάθεσης των γονέων ή των ασκούντων τη γονική μέριμνα αυτών, εκτός εάν άλλως ορίζεται από τον νόμο. Σημειώνεται ότι:• με εξαίρεση τα δεδομένα σας υπό 1.1. και 1.2., που είναι απολύτως απαραίτητα για κάθε συναλλακτική ή συμβατική σας σχέση με την Τράπεζα, το είδος και το πλήθος των λοιπών δεδομένων που συλλέγονται, εξαρτάται σε κάθε περίπτωση από το είδος της σύμβασης, που είτε θα συναφθεί είτε υφίσταται με την Τράπεζα, ή/ και το προσφερόμενο ή παρεχόμενο προϊόν ή/και υπηρεσία. • Σε περίπτωση που παρέχετε στην Τράπεζα προσωπικά δεδομένα τρίτων προσώπων, πρέπει να τους έχετε προηγουμένως ενημερώσει προσηκόντως (ενδεικτικά και μέσω παραπομπής στην παρούσα ενημέρωση) και να έχετε εξασφαλίσει τη σχετική συγκατάθεσή τους, όπου τυχόν αυτή απαιτείται.Η εταιρία με την επωνυμία «Τραπεζικά Συστήματα Πληροφορικής ΑΕ» και τον διακριτικό τίτλο «ΤΕΙΡΕΣΙΑΣ ΑΕ» είναι υπεύθυνη επεξεργασίας δεδομένων οικονομικής συμπεριφοράς για λογαριασμό του τραπεζικού συστήματος της χώρας, με κύριο σκοπό την αξιολόγηση του αναλαμβανόμενου από τα πιστωτικά ιδρύματα πιστωτικού κινδύνου. Η εταιρία εδρεύει επί της οδού Αλαμάνας 2, 151 25 Μαρούσι, έχει τηλ. επικοινωνίας: 210 3676700 και η διεύθυνση του ιστοτόπου της είναι: www.teiresias.gr. Η πρόσβαση στα αρχεία της «ΤΕΙΡΕΣΙΑΣ ΑΕ» είναι δυνατή χωρίς προηγούμενη συγκατάθεσή σας, εφόσον κρίνεται απαραίτητη για την έναρξη ή τη διατήρηση των συναλλακτικών σας σχέσεων με την Τράπεζα. Μπορείτε να ενημερωθείτε για την επεξεργασία των δεδομένων σας στην οποία προβαίνει η ΤΕΙΡΕΣΙΑΣ Α.Ε., καθώς και για την άσκηση των σχετικών δικαιωμάτων σας στο ανωτέρω τηλέφωνο επικοινωνίας ή/και στον ανωτέρω ιστότοπο.Η Τράπεζα ενδέχεται να συλλέγει δεδομένα των ιδίων κατηγοριών, με αυτά, που τηρεί η ΤΕΙΡΕΣΙΑΣ ΑΕ και από άλλα αρχεία εταιρειών που λειτουργούν νόμιμα στην Ελλάδα ή σε άλλο κράτος-μέλος της Ευρωπαϊκής Ένωσης. 2. Γιατί συλλέγουμε τα προσωπικά σας δεδομένα και ποιες νομικές βάσεις χρησιμοποιούμε για την επεξεργασία τους; Η Τράπεζα συλλέγει και επεξεργάζεται τα προσωπικά σας δεδομένα, που είναι κάθε φορά αναγκαία βασιζόμενη στους κατωτέρω νόμιμους λόγους/νομικές βάσεις επεξεργασίας και τους αντίστοιχους σκοπούς, ως αναλυτικότερα αναφέρονται παρακάτω:2.1. Για την εκτέλεση σύμβασης ή την αξιολόγηση της σχετικής αίτησής σας πριν τη σύναψη αυτήςΤα υπό 1 αναφερόμενα δεδομένα προσωπικού χαρακτήρα αποτελούν αντικείμενο επεξεργασίας για τους κάτωθι σκοπούς : 2.1.1. Για την ταυτοποίηση και επαλήθευση των στοιχείων σας. 2.1.2. Για την επικοινωνία μαζί σας κατά το στάδιο τόσο της προσυμβατικής όσο και της συμβατικής σχέσης μαζί σας, καθώς και για ζητήματα, που αφορούν οποιαδήποτε άλλη συναλλαγή ή συνεργασία σας με την Τράπεζα, όπως ενδεικτικά, την ενημέρωσή σας σχετικά με την καλύτερη αξιοποίηση των προϊόντων ή υπηρεσιών που η Τράπεζα σας παρέχει (λ.χ. τις δυνατότητες, τις ευκαιρίες χρήσης, τις νέες λειτουργικότητες και τις εξελίξεις αυτών), την ενημέρωση σας για συμμετοχή σε προγράμματα επιβράβευσης, κληρώσεις, διαγωνισμούς της Τράπεζας και την τυχόν ανάδειξή σας ως νικητή. 2.1.3. Για την αξιολόγηση των εν γένει αιτημάτων σας, την κατάρτιση και την ορθή εκτέλεση των συμβάσεων μαζί σας, την εκπλήρωση των εντεύθεν υποχρεώσεων της Τράπεζας προς εσάς, καθώς και την εξυπηρέτηση, υποστήριξη και παρακολούθηση των συναλλαγών σας.2.1.4. Σε περίπτωση χορήγησης "
