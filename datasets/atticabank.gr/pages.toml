["https://www.atticabank.gr/el/companies/anaptyxiaka-programmata/programmata-ellinikis-anaptyxiakis-trapezas/prasina-synchrimatodotoumena-daneia"]
title = "Πράσινα Συγχρηματοδοτούμενα Δάνεια - Attica Bank"
description = """
Τα δάνεια απευθύνονται σε Μικρομεσαίες επιχειρήσεις για την υλοποίηση επενδύσεων σε έργα πράσινης μετάβασης, με απώτερο στόχο την μείωση των ρυπογόνων εκπομπών και την προστασία του περιβάλλοντος. Μέσω της Δράσης, θα εκταμιευθούν δάνεια με  συνεπένδυση κεφαλαίων της Attica Bank και του Ταμείου Συγχρηματοδότησης το οποίο διαχειρίζεται η ΕΑΤ Α.Ε., σε αναλογία 1,5:1 (ή 60% : 40% αντίστοιχα).
Τα δάνεια ύψους μέχρι και €8.000.000 χορηγούνται ως δάνεια τακτής λήξης με προνομιακό επιτόκιο, καθώς εφαρμόζεται μηδενικό επιτόκιο για το 40% του δανείου που προέρχεται από τα κεφάλαια του Ταμείου, ενώ για το  επιτόκιο που επιβάλλει η Τράπεζα στα κεφάλαια που εισφέρει σε έκαστο δάνειο (το 60%) εφαρμόζεται:

μείωση περιθωρίου επιτοκίου τουλάχιστον κατά 25 μονάδες βάσης, σε σχέση με αντίστοιχη χρηματοδότηση χωρίς ενίσχυση από δημόσιους πόρους
διετή επιδότηση επιτοκίου ύψους 3% ετησίως."""
full_description = "Με μια γρήγορη ματιά Η Attica Bank μέσω της συμμετοχής της στη Δράση «Πράσινα Συγχρηματοδοτούμενα Δάνεια (Green Co-Financing Loans)» του Ταμείου «Business Growth Fund» θα συμβάλλει ουσιαστικά στη στήριξη επενδυτικών σχεδίων που στοχεύουν σε ανάπτυξη υποδομών, παραγόμενων προϊόντων ή/και παρεχόμενων υπηρεσιών και βέλτιστων πρακτικών σε θέματα ενεργειακής αναβάθμισης και κυκλικής οικονομίας. Η Τράπεζα μέσω των σχεδιαζόμενων προϊόντων που θα ενταχθούν στα τρία (3) Ταμεία της Δράσης και θα χορηγούνται με μειωμένο χρηματοοικονομικό κόστος, θα συμβάλλει εμπράκτως στην προσαρμογή των μικρομεσαίων επιχειρήσεων στις νέες συνθήκες πράσινης μετάβασης. Η υποστηριζόμενη χρηματοδότηση πραγματοποιείται από το Ταμείο με την επωνυμία «Πράσινα Συγχρηματοδοτούμενα Δάνεια» που διαχειρίζεται η Ελληνική Αναπτυξιακή Τράπεζα Α.Ε. (ΕΑΤ) με πόρους που χρηματοδοτούνται από το Ελληνικό Δημόσιο μέσω του Προγράμματος Δημοσίων Επενδύσεων και την Ευρωπαϊκή Τράπεζα Επενδύσεων. O στόχος του προγράμματος Τι αφορά Τα δάνεια απευθύνονται σε Μικρομεσαίες επιχειρήσεις για την υλοποίηση επενδύσεων σε έργα πράσινης μετάβασης, με απώτερο στόχο την μείωση των ρυπογόνων εκπομπών και την προστασία του περιβάλλοντος. Μέσω της Δράσης, θα εκταμιευθούν δάνεια με συνεπένδυση κεφαλαίων της Attica Bank και του Ταμείου Συγχρηματοδότησης το οποίο διαχειρίζεται η ΕΑΤ Α.Ε., σε αναλογία 1,5:1 (ή 60% : 40% αντίστοιχα). Τα δάνεια ύψους μέχρι και €8.000.000 χορηγούνται ως δάνεια τακτής λήξης με προνομιακό επιτόκιο, καθώς εφαρμόζεται μηδενικό επιτόκιο για το 40% του δανείου που προέρχεται από τα κεφάλαια του Ταμείου, ενώ για το επιτόκιο που επιβάλλει η Τράπεζα στα κεφάλαια που εισφέρει σε έκαστο δάνειο (το 60%) εφαρμόζεται: μείωση περιθωρίου επιτοκίου τουλάχιστον κατά 25 μονάδες βάσης, σε σχέση με αντίστοιχη χρηματοδότηση χωρίς ενίσχυση από δημόσιους πόρους διετή επιδότηση επιτοκίου ύψους 3% ετησίως. Προϋπολογισμός δράσης Ο συνολικός προϋπολογισμός ανέρχεται στο ποσό των €188.570.000 και χρηματοδοτείται από το Πρόγραμμα Δημοσίων Επενδύσεων (ποσό €102.070.000) και την Ευρωπαϊκή Τράπεζα Επενδύσεων (ΕΤΕπ) (ποσό €86.500.000). Ποσό €15.570.000 προερχόμενα από το Πρόγραμμα Δημοσίων Επενδύσεων θα διατεθούν για την επιδότηση του επιτοκίου. Τα κεφάλαια του Ταμείου κατανέμονται σε 3 Yποταμεία ως ακολούθως:(1) Ανάπτυξης της Πράσινης Κινητικότητας (Green Mobility Loans): κεφάλαια ύψους €20.000.000(2) Ενεργειακής Αναβάθμισης (Loans for energy upgrade): κεφάλαια ύψους €65.000.000(3) Ανανεώσιμες Πηγές Ενέργειας (Green Renewable Energy Loans): κεφάλαια ύψους €88.000.000 Mε τη μόχλευση αναμένεται η χορήγηση δανείων και στα τρία υποπρογράμματα συνολικής αξίας €432.500.000. Βασικά χαρακτηριστικά δανείων Περιγραφή βασικών χαρακτηριστικών Πράσινων Συγχρηματοδοτούμενων Δανείων Δικαιούχοι της δράσης / επιλέξιμες επιχειρήσεις Είναι επιχειρήσεις για τις οποίες συντρέχουν αθροιστικά οι κάτωθι προϋποθέσεις, Είναι Πολύ Μικρές, Μικρές και Μεσαίες επιχειρήσεις (ορισμός ΜμΕ_Παράρτημα Ι του ΕΚ 651/2014, όπως εκάστοτε ισχύει), που λειτουργούν νόμιμα στην Ελλάδα, εκτός των εξωχώριων, των εταιριών συμμετοχών σε άλλες εταιρίες, των επιχειρήσεων του χρηματοπιστωτικού τομέα, των δημοσίων φορέων και των θυγατρικών τους, των ΟΤΑ και των θυγατρικών τους. Διατηρούν εγκατάσταση και λειτουργούν νόμιμα στην Ελλάδα και έχουν συσταθεί έως και τον χρόνο υποβολής της αίτησης χρηματοδότησης στην Τράπεζα. Δεν θεωρούνται προβληματικές επιχειρήσεις (υπό την έννοια του άρθρου 1 παρ. 4(*) και του σημείου 18 του άρθρου 2 του Καν. 651/2014, όπως εκάστοτε ισχύουν). Κρίνονται πιστοληπτικά αποδεκτές σύμφωνα με την ισχύουσα πιστωτική πολιτική και τις εσωτερικές διαδικασίες της Τράπεζας. Δεν έχουν υπαχθεί σε καθεστώς αφερεγγυότητας. Είναι τραπεζικά ενήμερες ή δεν παρουσιάζουν ληξιπρόθεσμη οφειλή μεγαλύτερη των 90 ημερών κατά την ημερομηνία της αίτησης χρηματοδότησης. Δεν συντρέχουν λόγοι αποκλεισμού του άρθρου 40 του νόμου 4488/17 (Α 137/139/17), όπως ισχύει. Δεν έχουν πραγματοποιήσει έναρξη εργασιών του επενδυτικού σχεδίου (όπως αυτή ορίζεται στο Άρ.2, σημείο 23 του ΓΑΚ) πριν από το χρόνο υποβολής γραπτής αίτησης χρηματοδότησης στην Τράπεζα, ώστε να πληρούται ο χαρακτήρας κινήτρου της ενίσχυσης του άρθρου 6 του ΓΑΚ. Δεν εκκρεμεί εντολή ανάκτησης προηγούμενης παράνομης και ασύμβατης κρατικής ενίσχυσης βάση απόφασης ΕΕ ή ΔΕΕ. Εάν έχουν ενταχθεί σε προγράμματα της ΕΑΤ (πρώην ΕΤΕΑΝ), τα οποία ολοκληρώθηκαν ή βρίσκονται σε ισχύ και δεν έχουν εμφανίσει δυσμενή συναλλακτική συμπεριφορά στην αποπληρωμή των οφειλών τους (καταγγελία δανείου ή ληξιπρόθεσμες οφειλές για διάστημα μεγαλύτερο των ενενήντα (90) ημερών) ή στην περίπτωση όπου έχουν εμφανίσει δυσμενή συναλλακτική συμπεριφορά (καταγγελία δανείου ή ληξιπρόθεσμες οφειλές για διάστημα μεγαλύτερο των ενενήντα (90) ημερών), έχουν εξοφλήσει πλήρως τις οφειλές του πριν την υποβολή της αίτησης χρηματοδότησης ή εφόσον πρόκειται για πρόγραμμα εγγυοδοσίας, δεν έχει καταβληθεί το ποσό εγγύησης από πλευράς της ΕΑΤ κατά την υπογραφή της δανειακής σύμβασης της επιχείρησης ή εφόσον έχει βεβαιωθεί η εν λόγω οφειλή στην αρμόδια Δ.Ο.Υ., αυτή έχει ενταχθεί σε καθεστώς ρύθμισης, η οποία συνεχίζει να είναι σε ισχύ κατά την ημερομηνία υποβολής της αίτησης χρηματοδότησης. Δεν έχουν αποκλειστεί με απόφαση αποκλεισμού από την ΕΤΕπ τόσο κατά τον χρόνο υποβολής αιτήματος χρηματοδότησης προς την Τράπεζα όσο και κατά το χρόνο σύναψης της δανειακής σύμβασης της επιχείρησης σύμφωνα με την Πολιτική Αποκλεισμού της ΕΤΕπ (https://www.eib.org/en/about/accountability/anti-fraud/exclusion/index). Δεν ανήκουν στις Μη Επιλέξιμες Επιχειρήσεις και δραστηριοποιούνται σε επιλέξιμες δραστηριότητες, όπως αυτές θα προσδιορίζονται στον Πίνακα επιλέξιμων Κωδικών Αριθμών Δραστηριότητας (ΚΑΔ), ο οποίος θα περιλαμβάνεται στον Οδηγό Εφαρμογής του Ταμείου. Δείτε τις Μη επιλέξιμες επιχειρήσεις και Εξαιρούμενες δραστηριότητες και δαπάνες εδώ. (*) Δεν τίθεται σε εφαρμογή η κατά παρέκκλιση εφαρμογή της τελευταίας πρότασης της παρ. 4γ του Άρ.1 του ΓΑΚ σύμφωνα με την οποία δύναται να ενισχυθούν επιχειρήσεις οι οποίες που δεν ήταν προβληματικές την 31η Δεκεμβρίου 2019, αλλά κατέστησαν προβληματικές κατά την περίοδο από 1ης Ιανουαρίου 2020 έως την 31η Δεκεμβρίου 2021. Επιλέξιμες δαπάνες Για τη χρηματοδότηση των πάσης φύσεως δαπανών είναι υποχρεωτική η προσκόμιση business plan και σχετικών παραστατικών δαπανών. Οι επιλέξιμες δαπάνες δεν θα πρέπει να έχουν πραγματοποιηθεί/συμβασιοποιηθεί (να μην έχει προηγηθεί της αίτησης χρηματοδότησης οριστικό γεγονός που καθίσταται μη αναστρέψιμο) πριν την υποβολή της αίτησης χρηματοδότησης στην Τράπεζα. Ειδικότερα, οι επιχειρήσεις θα πρέπει να αποδεικνύουν μέσω του υποβληθέντος επιχειρηματικού σχεδίου και κατά την υλοποίηση με την υποβολή σχετικών παραστατικών ότι τα έργα μετασχηματισμού αφορούν έναν ή περισσότερους από τους ακόλουθους βασικούς τομείς/υποταμεία (υποβάλλοντας ξεχωριστά επιχειρηματικά σχέδια): 1. Δάνεια Πράσινης Κινητικότητας για τη χρηματοδότηση επενδυτικών σχεδίων με σκοπό: την ανάπτυξη δικτύων υποδομών φόρτισης και ανεφοδιασμού οχημάτων τεχνολογίας μηδενικών ή χαμηλών ρύπων (ηλεκτροκίνητων/υβριδικών ή υδρογόνου) την αναβάθμιση εγκαταστάσεων σταθμών ενέργειας σε σταθμούς φόρτισης την παραγωγή ή αποθήκευση ενέργειας μέσω ΑΠΕ 2. Δάνεια Ενεργειακής αναβάθμισης για τη χρηματοδότηση επενδυτικών σχεδίων με σκοπό: την αναβάθμιση της ενεργειακής απόδοσης επαγγελματικών χώρων/κτιρίων (βιομηχανικούς, βιοτεχνικούς, εμπορικούς ή άλλους αποκλειστικά επαγγελματικού σκοπού) πιστοποιήσεις κυκλική οικονομία (ανακύκλωση υλικών, μελέτες, δαπάνες R&D Μετά τη δημοσίευση στην Εφημερίδα της ΕΕ της τροποποποίησης του ΓΑΚ σύμφωνα με την Ανακοίνωση C(2023) 1712 final και της έναρξης ισχύος του νέου Άρ. 38b, το Υποπρόγραμμα θα χρηματοδοτεί απευθείας και Εταιρείες Ενεργειακών Υπηρεσιών (ESCos) προκειμένου αυτές να υλοποιούν επενδυτικά σχέδια ως ανωτέρω για λογαριασμό τρίτων. 3. Ανανεώσιμες Πηγές Ενέργειας για τη χρηματοδότηση επενδυτικών σχεδίων και προς ΜμΕ αφορά πάντα νέες εγκαταστάσεις ώστε να προβούν στην αγορά και εγκατάσταση του εξοπλισμού, τη διαμόρφωση του χώρου, την παραγωγή, αποθήκευση, διανομή και μετάδοση της παραγόμενης ενέργειας, που προέρχεται από ανανεώσιμες πηγές, ήτοι: Ηλιακή Ενέργεια, Αιολική Ενέργεια, Γεωθερμική Ενέργεια, Παραγωγή Ενέργειας από Βιομάζα / Βιορευστά ή Βιοαέριο (υπό προϋποθέσεις). Επιπρόσθετα: Η χρηματοδότηση των δαπανών θα γίνεται με την προσκόμιση των σχετικών παραστατικών στην Τράπεζα και σε καμία περίπτωση δεν πρέπει να έχουν υλοποιηθεί κατά την ημερομηνία αίτησης χρηματοδότησης στην Τράπεζα και συνακόλουθα να μην έχουν εξοφληθεί τα αντίστοιχα παραστατικά. Παραστατικά που εξοφλούνται εξ ιδίων διαθεσίμων μετά την ημερομηνία αίτησης στην Τράπεζα και πριν την εκταμίευση, χρηματοδοτούνται και το προϊόν της εκταμίευσης πιστώνεται στον όψεως της επιχείρησης. Ο ΦΠΑ δεν χρηματοδοτείται. Τα παραστατικά πρέπει να τηρούνται στον δανειακό φάκελο της Τράπεζας. Δείτε αναλυτικά τις επιλέξιμες δαπάνες ανά Υπο-ταμείο εδώ. Κρατική ενίσχυση Η ενίσχυση που λαμβάνει η επιχείρηση μέσω της εφαρμογής στο δάνειο μηδενικού/μειωμένου επιτοκίου ή και του ποσού επιδότησης του επιτοκίου που τυχόν θα λάβει μέσω του Ταμείου Συγχρηματοδότησης παρέχονται με την επιφύλαξη των κανόνων Κρατικών Ενισχύσεων. Το Ταμείο εφαρμόζεται σύμφωνα με τον Κανονισμό ΕΕ 651/2014 (ΓΑΚ) και συγκεκριμένα ανάλογα με το Υποταμείο στο οποίο εντάσσεται το κάθε επενδυτικό σχέδιο ισχύουν τα ακόλουθα άρθρα: (α) Ανάπτυξη της Πράσινης Κινητικότητας: άρθρο 17 του ΓΑΚ (β) Εξοικομόμηση Αναβάθμισης: άρθρα 39 του ΓΑΚ και 38b μετά τη δημοσίευσή του και τη θέση του σε ισχύ (αφορά στην απευθείας χρηματοδότηση των Εταιριών Ενεργειακών Υπηρεσών (ESCos), προκειμένου να υλοποιούν σχέδια για λογαριασμό τρίτων) (γ) Ανανεώσιμες Πηγές Ενέργειας: άρθρο 41 του ΓΑΚ. Σε κάθε περίπτωση ισχύουν οι γενικοί όροι του Κανονισμού σύμφωνα με τα άρθρα 1,2,4,5,6,8,9. Περίοδος διάθεσης Μέχρι την 30.06.2025 και σε κάθε περίπτωση μέχρι εξαντλήσεως των κονδυλίων. Υποβολή αιτήσεων Οι ενδιαφερόμενοι (υποψήφιες προς χρηματοδότηση επιχειρήσεις)) υποβάλλουν αίτηση στην πλατφόρμα KYC («Know Your Customer») της ΕΑΤ, μέσω του δικτυακού τόπου hdb.gr. Μέσω της πλατφόρμας, υπό την προϋπόθεση συναίνεσης για την συλλογή και επεξεργασία των προσωπικών δεδομένων, και ύστερα από μία σειρά αξιολογήσεων κριτηρίων (έλεγχο της ύπαρξης φορολογικής και ασφαλιστικής ενημερότητας και φερεγγυότητας των υποψήφιων προς χρηματοδότηση επιχειρήσεων), η αίτηση προωθείται στην Τράπεζα επιλογής του κατ’ εντολή του ενδιαφερομένου, για την υποβολή μη δεσμευτικής προσφοράς. Εν συνεχεία ο ενδιαφερόμενος, για τον οποίο η Τράπεζα εκδήλωσε το «μη δεσμευτικό» ενδιαφέρον χρηματοδότησης, υποβάλλει το αίτημα στο ΠΣΚΕ μέσω του δικτυακού τόπου https://www.ependyseis.gr/, προκειμένου να αξιολογηθεί από τα αρμόδια στελέχη της Τράπεζας. Δικαιολογητικά Δείτε τη λίστα των απαιτούμενων δικαιολογητικών εδώ Ευρωπαϊκή Τράπεζα Επενδύσεων Η Ευρωπαϊκή Τράπεζα Επενδύσεων, το χρηματοπιστωτικό ίδρυμα της Ευρωπαϊκής Ένωσης που ιδρύθηκε δυνάμει του άρθρου 309 της Συνθήκης για τη λειτουργία της Ευρωπαϊκής Ένωσης, συμμετέχει παράλληλα με την ΕΑΤ, το Ελληνικό Δημόσιο και τα Χρηματοπιστωτικά Ιδρύματα στη χρηματοδότηση επενδυτικών προγραμμάτων που αποτελούν μέρος των στόχων της Ευρωπαϊκής Ένωσης. Δείτε περισσότερα για τη δραστηριότητα της Ευρωπαϊκής Τράπεζας Επενδύσεων υπέρ των επιχειρήσεων εδώ."
