full_description = "Στις 27/08/2014, η Τράπεζα της Ελλάδος θέσπισε τον Κώδικα Δεοντολογίας του Ν. 4224/2013, βάσει του οποίου τα πιστωτικά ιδρύματα της χώρας καλούνται να προσαρμόσουν τη διαδικασία αντιμετώπισης των πελατών τους που παρουσιάζουν ή ενδέχεται να παρουσιάσουν αδυναμία στην κάλυψη των δανειακών τους υποχρεώσεων. Ο Κώδικας Δεοντολογίας εφαρμόζεται στο σύνολο των πελατών των Πιστωτικών Ιδρυμάτων, φυσικά ή νομικά πρόσωπα και στο σύνολο των δανείων που χορηγούνται από αυτά. Στο πλαίσιο αυτό, η Attica Bank σχεδίασε τη Διαδικασία Επίλυσης Καθυστερήσεων με γνώμονα την έγκαιρη αντιμετώπιση οικονομικών προβλημάτων που τυχόν αντιμετωπίζει ο δανειολήπτης και την εξεύρεση κατάλληλης λύσης καθώς και τη γρήγορη και αποτελεσματική εξυπηρέτησή σας. Πως λειτουργεί Διαδικασία Επίλυσης Καθυστερήσεων (Δ.Ε.Κ.) Η ΔΕΚ αφορά Δανειολήπτες, Φυσικά ή Νομικά Πρόσωπα και ισχύει για όλους τους ενεχόμενους στην οφειλή (συνοφειλέτες / εγγυητές). Εξαιρούνται από τη ΔΕΚ, οφειλές των οποίων η σύμβαση έχει καταγγελθεί ή για τις οποίες έχει ορισθεί δικάσιμος στο πλαίσιο του Ν.3869/2010 Περιλαμβάνει τα εξής στάδια: Στάδιο 1: Έγγραφη συστημένη επικοινωνία με τον δανειολήπτη μετά το πέρας 30 ημερών καθυστέρησης, με σκοπό την τακτοποίηση της οφειλής του / την ενημέρωσή του για τα απαιτούμενα έγγραφα και δικαιολογητικά για την εξέταση αιτήματος διευθέτησης της οφειλής του. Στάδιο 2: Κατάθεση απαιτούμενων δικαιολογητικών (ενδεικτικά: ΤΥ.Κ.Ο.Π., Ε1, Ε9, Οικονομικές Καταστάσεις Επιχειρήσεων) στα πλαίσια της ένταξης του δανειολήπτη στη ΔΕΚ . Στάδιο 3: Αξιολόγηση όλων των υποβληθέντων στοιχείων σε συνδυασμό με άλλα οικονομικά δεδομένα καθώς και τις οικονομικές καταστάσεις των επιχειρήσεων. Στάδιο 4: Έγγραφη ενημέρωση του δανειολήπτη μέσω του Τυποποιημένου Εγγράφου Πρότασης Λύσεων Ρύθμισης ή Οριστικής Διευθέτησης. Μετά από την παρουσίαση της προτεινόμενης λύσης, θα πρέπει ο δανειολήπτης να ανταποκριθεί εγγράφως εντός δεκαπέντε (15) εργάσιμων ημερών, προκειμένου είτε να συναινέσει, είτε να αντιπροτείνει ή να αρνηθεί την πρόταση την οποία έλαβε. Στάδιο 5: Με την κατηγοριοποίηση του δανειολήπτη ως μη συνεργάσιμου, του παρέχεται η δυνατότητα υποβολής ένστασης εντός 15 ημερολογιακών ημερών από τη λήψη της σχετικής επιστολής για θέματα τήρησης των διαδικασιών στο πλαίσιο του Κώδικα. Η δυνατότητα υποβολής ενστάσεως παρέχεται μόνο μία φορά. Για αναλυτικές οδηγίες προς τους δανειολήπτες με οικονομικές δυσχέρειες, πατήστε εδώ. Έντυπα και Δικαιολογητικά Ενημερωτικό Φυλλάδιο Κώδικα Δεοντολογίας Τυποποιημένη Οικονομική Κατάσταση (Τ.Ο.K) Δικαιολογητικά που οφείλουν να προσκομίζουν οι ιδιώτες και οι ατομικές επιχειρήσεις Δικαιολογητικά που οφείλουν να προσκομίζουν οι Επιχειρήσεις – Νομικά Πρόσωπα Έντυπο Ενστάσεων Συνεργάσιμος Δανειολήπτης Όπως αποφασίστηκε στο Κυβερνητικό Συμβούλιο Διαχείρισης Ιδιωτικού Χρέους του Ν. 4224/2013, ο δανειολήπτης ορίζεται ως «συνεργάσιμος» απέναντι των δανειστών του όταν: Παρέχει πλήρη και επικαιροποιημένα στοιχεία επικοινωνίας στους δανειστές ή σε όποιον ενεργεί νομίμως για λογαριασμό τους και προβαίνει σε ορισμό συγγενικού ή φιλικού προσώπου, ως αντικλήτου επικοινωνίας για κάθε περίπτωση που ο ίδιος δεν είναι διαθέσιμος, Είναι διαθέσιμος σε επικοινωνία με το δανειστή ή με όποιον ενεργεί νομίμως για λογαριασμό του και ανταποκρίνεται με ειλικρίνεια και σαφήνεια σε κλήσεις και επιστολές του δανειστή ή όποιου ενεργεί νομίμως για λογαριασμό του, αυτοπροσώπως είτε διά του αντικλήτου του, με κάθε πρόσφορο τρόπο, εντός 15 εργάσιμων ημερών Προβαίνει, είτε αυτοπροσώπως, είτε διά του αντικλήτου του, σε πλήρη και ειλικρινή γνωστοποίηση πληροφοριών προς το δανειστή ή όποιον ενεργεί νομίμως για λογαριασμό του, αναφορικά με την τρέχουσα οικονομική του κατάσταση, εντός 15 εργάσιμων ημερών από την ημέρα μεταβολής της ή εντός 15 εργάσιμων ημερών από την ημέρα που θα ζητηθούν ανάλογες πληροφορίες από το δανειστή ή όποιον ενεργεί νομίμως για λογαριασμό του Προβαίνει, είτε αυτοπροσώπως, είτε διά του αντικλήτου του, σε πλήρη και ειλικρινή γνωστοποίηση πληροφοριών προς το δανειστή ή όποιον ενεργεί για λογαριασμό του, οι οποίες θα έχουν σημαντικές επιπτώσεις στη μελλοντική οικονομική του κατάσταση, εντός 15 εργάσιμων ημερών από την ημέρα που θα περιέλθουν σε γνώση του Συναινεί σε διερεύνηση εναλλακτικής πρότασης αναδιάρθρωσης με το δανειστή ή όποιον ενεργεί νομίμως για λογαριασμό του, σύμφωνα με τα προβλεπόμενα στον Κώδικα Δεοντολογίας Μη Συνεργάσιμος Δανειολήπτης Σε περίπτωση χαρακτηρισμού του δανειολήπτη ως “μη συνεργάσιμου” ενδέχεται να επέλθουν οι εξής νομικές και οικονομικές επιπτώσεις: Έναρξη νομικών/ δικαστικών ενεργειών για την είσπραξη της οφειλής Ρευστοποίηση τυχόν εξασφαλίσεων που έχουν παρασχεθεί από τον δανειολήπτη ή λοιπούς ενεχομένους στη σύμβαση. Το σύνολο των ενεχομένων θα εξακολουθεί να είναι υπόχρεο για τυχόν εναπομένον υπόλοιπο. Εύλογες Δαπάνες Διαβίωσης Κατά την αξιολόγηση από το πιστωτικό ίδρυμα των οικονομικών στοιχείων του δανειολήπτη λαμβάνεται υπόψη σύμφωνα με τον Κώδικα, μεταξύ άλλων πηγών πληροφόρησης, και το επίπεδο των «εύλογων δαπανών διαβίωσης». Ο υπολογισμός των εύλογων δαπανών διαβίωσης στηρίζεται στα στοιχεία της στατιστικής Έρευνας Οικογενειακών Προϋπολογισμών (ΕΟΠ) που διενεργείται κάθε χρόνο από την Ελληνική Στατιστική Υπηρεσία. Οι πιο βασικές δαπάνες για τη διαβίωση του νοικοκυριού περιλαμβάνονται στην 1η ομάδα των εύλογων δαπανών διαβίωσης, όπως αυτή καθορίζεται με βάση την επίσημη μεθοδολογία προσδιορισμού τους και είναι οι εξής: Όλες οι δαπάνες διατροφής (δημητριακά, γαλακτοκομικά προϊόντα, κρέας, ψάρια, έλαια και λίπη, φρούτα, λαχανικά, γλυκά κτλ) και των μη αλκοολούχων ποτών (καφές, τσάι, κακάο, μεταλλικά νερά, αναψυκτικά, χυμοί φρούτων, κτλ) καθώς και έξοδα σε καντίνες και κυλικεία εργασίας, σχολείων, πανεπιστημίων, γραφείων (καφέδες, αναψυκτικά, χυμοί, σάντουιτς, τοστ, τυρόπιτες, γλυκά, κλπ.). Όλες οι δαπάνες ένδυσης και υπόδησης (αγορά ειδών ένδυσης και υπόδησης (ανδρικά, γυναικεία, παιδικά) καθώς και οι επιδιορθώσεις αυτών). Όλες οι δαπάνες που σχετίζονται με την κατοικία (ηλεκτρισμός, ύδρευση, θέρμανση, υλικά και υπηρεσίες συντήρησης και επισκευής της κατοικίας). Όλα τα έξοδα κίνησης, συντήρησης και επισκευής μεταφορικών μέσων (καύσιμα, λιπαντικά, ανταλλακτικά, σέρβις κτλ) καθώς και τα ασφάλιστρα αυτοκινήτου-μηχανής. Όλες οι δαπάνες χρήσης αστικών και υπεραστικών μέσων μαζικής μεταφοράς (λεωφορεία, τρόλεϊ, ταξί, τρένα, τραμ, μετρό, επιβατικά πλοία κτλ.). Δαπάνες που σχετίζονται με την επισκευή και τη συντήρηση των διαρκών αγαθών οικιακής χρήσης (έπιπλα, οικιακές συσκευές, κτλ.). Όλα τα αγαθά για τη συνήθη οικιακή κατανάλωση (σαπούνια, απορρυπαντικά, είδη καθαρισμού, σκούπες, χαρτιά υγείας, χαρτομάντηλα, κτλ.). Δαπάνες αγαθών και υπηρεσιών ατομικής καθαριότητας και καλλωπισμού (κομμωτήρια, κουρεία, ξυριστικές μηχανές, ξυραφάκια, οδοντόβουρτσες, οδοντόκρεμες, αρώματα, κολόνιες, καλλυντικά, αποσμητικά, σαπούνια μπάνιου, σαμπουάν κλπ) και λοιπά προσωπικά είδη (τσάντες, πορτοφόλια, γυαλιά ηλίου, ομπρέλες κτλ) καθώς και δαπάνες σχετικά με τα κατοικίδια ζώα (τροφές, λουριά, κτλ.). Δαπάνες σχετικά με την ενημέρωση και τη μόρφωση (βιβλία, εφημερίδες, περιοδικά, είδη χαρτοπωλείου, γραφική ύλη, τετράδια, μολύβια, στυλό, κτλ.). Όλες οι δαπάνες υπηρεσιών τηλεφωνίας και ταχυδρομικών υπηρεσιών (λογαριασμοί σταθερού τηλεφώνου, κινητού τηλεφώνου, internet, ταχυδρομείων κτλ). Δαπάνες ειδών και υπηρεσιών υγείας (φάρμακα, παυσίπονα, επίδεσμοι, γάζες, θερμόμετρα, ιατρικές υπηρεσίες κάθε ειδικότητας, οδοντιατρικές υπηρεσίες, κτηνιατρικές υπηρεσίες κ.α.). Όλες οι δαπάνες υπηρεσιών εκπαίδευσης (παιδικοί σταθμοί, φροντιστήρια, ξένες γλώσσες, εκπαιδευτικές εκδρομές κτλ.). Δαπάνες υπηρεσιών κοινωνικής προστασίας (γηροκομεία, ιδρύματα και σχολεία για άτομα με ειδικές ανάγκες, βρεφονηπιακών (παιδικών) σταθμών, παιδότοποι κτλ.). Δαπάνες για λοιπές οικονομικές υπηρεσίες (αμοιβές φοροτεχνικών, διοικητικά τέλη, αμοιβές δικηγόρων, αμοιβές συμβολαιογράφων, συνδρομές σε επαγγελματικά σωματεία, ενώσεις, κτλ.). Όλα τα ανωτέρω περιλαμβάνονται στην 1η ομάδα δαπανών που θεωρούνται οι πιο βασικές για τη διαβίωση του νοικοκυριού. Τα ποσά των εύλογων δαπανών διαβίωσης είναι καθαρά μετά την αφαίρεση των φόρων (όπως προκύπτουν στο εκκαθαριστικό σημείωμα της εφορίας) και αφού αφαιρεθεί η δόση του δανείου για τους δανειολήπτες και το ποσό του ενοικίου για τους ενοικιαστές. Κάθε νοικοκυριό αντιμετωπίζεται ως μια ξεχωριστή περίπτωση με διαφορετικές ανάγκες. Γι’αυτό και ο προσδιορισμός των εύλογων δαπανών, θα γίνεται σε εξατομικευμένη βάση, με χρήση ειδικών συντελεστών στάθμισης ανάλογα με τη σύνθεση του νοικοκυριού. Το πιστωτικό ίδρυμα οφείλει να λαμβάνει υπόψη τις εύλογες δαπάνες διαβίωσης του οφειλέτη, κατά την αξιολόγηση της δυνατότητας αποπληρωμής. Συγκεκριμένα, στην Τυποποιημένη Κατάσταση Οικονομικής Πληροφόρησης, ο οφειλέτης θα δηλώνει στοιχεία για τις δαπάνες διαβίωσης του νοικοκυριού, τα οποία θα συσχετίζονται με τις προσδιορισμένες εύλογες δαπάνες διαβίωσης. Οι πληροφορίες αυτές θα αξιοποιούνται, σε συνδυασμό με άλλα στοιχεία, ώστε να αξιολογηθεί: η οικονομική κατάσταση του δανειολήπτη, το συνολικό ύψος και η φύση των χρεών του δανειολήπτη, η τρέχουσα ικανότητα αποπληρωμής του δανειολήπτη, το ιστορικό οικονομικής συμπεριφοράς του δανειολήπτη, και η προβλεπόμενη και αναμενόμενη ικανότητα αποπληρωμής του δανειολήπτη, λαμβάνοντας υπόψη το επίπεδο των εύλογων δαπανών διαβίωσης. Μετά από αυτή την αξιολόγηση κάθε ίδρυμα προτείνει προς τον οφειλέτη που καλύπτεται από τον Κώδικα και θεωρείται συνεργάσιμος, μία ή περισσότερες εναλλακτικές λύσεις ρύθμισης ή οριστικής διευθέτησης στον οφειλέτη. Σε κάθε περίπτωση, εφόσον ο οφειλέτης δεν μπορεί να εξυπηρετήσει την παρεχόμενη ρύθμιση διατηρεί το δικαίωμα προσφυγής του στο ν. 3869/2010, όπως τροποποιήθηκε από το ν. 4161/2013, όπου δικαστικά θα προσδιοριστεί η διευθέτηση της οφειλής. Θεσμικό Πλαίσιο ΝΟΜΟΣ 4224/ (ΦΕΚ 288/31.12.2013) ΝΟΜΟΣ 4224 (ΦΕΚ 2376/02.08.2016) ΕΓΚΥΚΛΙΟΣ ΤΗΣ ΤτΕ 5 ΔΕΚ 2014Διευκρινίσεις για την εφαρμογή του Κώδικα Δεοντολογίας του Ν.4224/2013 ΠΡΑΞΗ ΕΚΤΕΛΕΣΤΙΚΗΣ ΕΠΙΤΡΟΠΗΣ ΤΗΣ ΤτΕ 42/2014 (ΦΕΚ Β’ 1582/16.6.2014) ΚΩΔΙΚΑΣ ΔΕΟΝΤΟΛΟΓΙΑΣ του Ν. 4224/2013 (ΦΕΚ Β’ 2289/27.8.2014) ΚΑΘΟΡΙΣΜΟΣ ΤΩΝ ΟΡΩΝ ΚΑΙ ΤΗΣ ΔΙΑΔΙΚΑΣΙΑΣ ΤΗΣ ΜΕΣΟΛΑΒΗΣΗΣ ΤΟΥ ΣΥΝΗΓΟΡΟΥ ΤΟΥ ΚΑΤΑΝΑΛΩΤΗ ΣΤΟ ΠΛΑΙΣΙΟ ΤΟΥ Ν. 4224/2013 (ΦΕΚ Β’ 92/20.1.2015) ΤΡΟΠΟΠΟΙΗΣΗ ΤΟΥ ΚΩΔΙΚΑ ΔΕΟΝΤΟΛΟΓΙΑΣ του Ν. 4224/2013 – (ΦΕΚ Β΄486/31.3.2015) ΑΠΟΦΑΣΗ ΕΠΑΘ 148/10/5.10.2015 (ΦΕΚ Β 2219/15.10.2015) Φορείς για την Παροχή Συμβουλευτικής Συνδρομής Εξουσιοδοτημένοι φορείς για παροχή συμβουλευτικής συνδρομής, στους οποίους μπορείτε να απευθυνθείτε: Πιστοποιημένες Πρωτοβάθμιες και Δευτεροβάθμιες Ενώσεις Καταναλωτών Γραφεία και Κέντρα Ενημέρωσης και Υποστήριξης Δανειοληπτών της Ειδικής Γραμματείας Διαχείρισης Ιδιωτικού Χρέους (http://www.keyd.gov.gr/). Φορείς Εξωδικαστικής Επίλυσης Διαφορών Συνήγορος του Καταναλωτή (Λ. Αλεξάνδρας 144, 11471 Αθήνα, Τηλέφωνα: 210-6460862 / 210-6460814 / 210-6460612 / 210-6460734 / 210-6460458, e-mail:α) Κεντρική Γραμματεία Συνηγόρου του Καταναλωτή: grammateia@synigoroskatanaloti.grβ) Γραμματεία Αναπληρωτή Συνηγόρου του Καταναλωτή: grama@synigoroskatanaloti.grγ) Γραμματεία Βοηθού Συνηγόρου του Καταναλωτή: gramb@synigoroskatanaloti.gr Ελληνικό Χρηματοοικονομικό Μεσολαβητή-Αστική Μη Κερδοσκοπική Εταιρεία Εναλλακτικής Επίλυσης Διαφορών (ΕΧΜ-ΕΕΕΔ) (Μασσαλίας 1, 10680 Αθήνα, Τηλ.: 10 4 40, Fax: 210-3238821, e-mail: info@hobis.gr ) Ενημέρωση για την διαβίβαση προσωπικών δεδομένων Attica Bank: Τιτλοποίηση χαρτοφυλακίου μη εξυπηρετούμενων δανείων και ανάθεση διαχείρισής τους Attica Bank – Ενημέρωση για τη Διαβίβαση Προσωπικών Δεδομένων Attica Bank – Ανακοίνωση της 27.12.2017 Ενημέρωση για τη διαβίβαση προσωπικών δεδομένων (άρθρο 11 και 1 του Ν. 2472/1997 και Απόφαση 23/2018 της Ολομέλειας της Αρχής Προστασίας Δεδομένων Προσωπικού Χαρακτήρα)"
