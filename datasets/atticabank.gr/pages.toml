["https://www.atticabank.gr/el/digital-bank/attica-e-banking/companies-digital-bank/pin-by-sms-2"]
title = "PIN by SMS - Attica Bank"
description = "Με τη νέα δωρεάν υπηρεσία PIN by SMS, μπορείτε πλέον να λαμβάνετε το ΡΙΝ της κάρτας σας με ευκολία, ταχύτητα και ασφάλεια στον αριθμό του κινητού σας τηλεφώνου που έχετε δηλώσει στην Τράπεζα!"
full_description = "Με τη νέα δωρεάν υπηρεσία PIN by SMS, μπορείτε πλέον να λαμβάνετε το ΡΙΝ της κάρτας σας με ευκολία, ταχύτητα και ασφάλεια στον αριθμό του κινητού σας τηλεφώνου που έχετε δηλώσει στην Τράπεζα! Πώς λειτουργεί Συνδεθείτε με τους προσωπικούς σας κωδικούς στο Attica e-banking ή Attica Mobile και επιλέξτε οποιαδήποτε από τις ενεργές Χρεωστικές, Πιστωτικές ή Προπληρωμένες κάρτες σας Από τις διαθέσιμες επιλογές του μενού «Ρυθμίσεις Κάρτας» (εικονίδιο στα apps), επιλέξτε «Υπενθύμιση PIN». Ελέγξτε τα στοιχεία που εμφανίζονται στην οθόνη σας (αριθμός και τύπος κάρτας, αριθμός κινητού τηλεφώνου που έχετε δηλώσει στην Τράπεζα, τρόπος αποστολής PIN), διαβάστε και αποδεχτείτε τους Όρους Χρήσης της υπηρεσίας Επιλέγοντας «Υποβολή» και προκειμένου να ολοκληρώσετε το αίτημα για την αποστολή του PIN στον αριθμό του κινητού σας τηλεφώνου, θα χρειαστεί να εγκρίνετε αρχικά τη συναλλαγή σας είτε με εισαγωγή Κωδικού μιας Χρήσης μέσω SMS (OTP), είτε μέσω ειδοποίησης (Push Notification) εφόσον χρησιμοποιείται το Attica e-banking. Μέσω Attica Mobile, η αρχική έγκριση πραγματοποιείται είτε με χρήση των βιομετρικών σας στοιχείων είτε με χρήση του PIN που έχετε ορίσει για την είσοδό σας στην εφαρμογή Για την ασφάλειά σας, τόσο μέσω Attica e-banking όσο και μέσω Attica Mobile, θα χρειαστεί επιπλέον να εγκρίνετε τη συναλλαγή σας εισάγοντας τον Κωδικό μιας Χρήσης που θα λάβετε και μέσω του email που έχετε δηλώσει στην Τράπεζα Με την ολοκλήρωση των παραπάνω βημάτων, το PIN σας αποστέλλεται άμεσα στον αριθμό του κινητού σας τηλεφώνου μέσω SMS μηνύματος. Σας συνιστούμε να απομνημονεύστε το PIN της κάρτας σας και να διαγράψτε το σχετικό SMS μήνυμα αμέσως μετά. Σημειώνεται ότι σε περίπτωση που έχετε προβεί σε αλλαγή του αριθμού κινητού τηλεφώνου σας στην Τράπεζα την ημέρα που πραγματοποιείτε Υπενθύμιση PIN μέσω SMS, τότε το PIN σας θα αποσταλεί στον παλαιό αριθμό του κινητού σας τηλεφώνου. Εάν επιθυμείτε να αλλάξετε τον αριθμό του κινητού τηλεφώνου στον οποίο θα λαμβάνετε το μήνυμα της υπηρεσίας ΡΙΝ by SMS, μπορείτε να απευθυνθείτε σε οποιοδήποτε Κατάστημα του Δικτύου της Attica Bank. Σε περίπτωση που δεν επιθυμείτε να λαμβάνετε το ΡΙΝ της κάρτας μέσω της υπηρεσίας PIN by SMS στον αριθμό του κινητού σας τηλεφώνου, μπορείτε να απευθυνθείτε σε οποιοδήποτε Κατάστημα της Attica Bank ή να καλέσετε στο Τηλεφωνικό Κέντρο Εξυπηρέτησης Πελατών, στο τηλέφωνο 210-3669000. Σε αυτή την περίπτωση, το ΡΙΝ της κάρτας θα αποστέλλεται στο εξής έγχαρτα (μέσω PIN mailer) στην ταχυδρομική διεύθυνση που έχετε δηλώσει στην Τράπεζα, μέσω συστημένης επιστολής."
