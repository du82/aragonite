title = "Επιχειρήσεις - Attica Bank"
full_description = "Πώς μπορούμε να βοηθήσουμε; Κεφάλαιο Κίνησης Leasing-Factoring Χρηματοδότηση ξενοδοχειακών επιχειρήσεων Χρηματοδότηση μικροπιστώσεων EaSI Χρηματοδότηση εξαγωγικών επιχειρήσεων Ταμείο εγγυοδοσίας ΕΑΤ-ΤΜΕΔΕ Λογαριασμοί για τον επαγγελματία Οι ανάγκες μιας επιχείρησης δεν σταματούν ποτέ. Έχουμε τα εργαλεία για κάθε σας ανάγκη, ώστε η επιχείρησή σας να συνεχίσει να αναπτύσσεται IRIS payments Λογαριασμός όψεως Έντοκος λογαριασμός όψεως κλιμακούμενου επιτοκίου Τερματικές συσκευές POS Κάρτες για επαγγελματίες και επιχειρήσεις Επιλέξτε την κατάλληλη κάρτα, χρεωστική ή πιστωτική και πραγματοποιήστε τις συναλλαγές σας εύκολα και με ασφάλεια Δείτε τις κάρτες Οι ψηφιακές σας συναλλαγές δεν ήταν ποτέ πιο εύκολες Πραγματοποιήστε τις καθημερινές τραπεζικές σας συναλλαγές μέσα από ένα σύγχρονο, εύχρηστο και ασφαλές περιβάλλον Περισσότερα Κατεβάστε σήμερα το Attica Mobile App στο κινητό ή το tablet σας Ανακαλύψτε την ανανεωμένη εμφάνιση και τις νέες δυνατότητες του! Ασφαλιστικά προγράμματα για επαγγελματίες και επιχειρήσεις Υπεύθυνες λύσεις για ό,τι θέλετε να καλύψετε με το πλέον ανταγωνιστικό κόστος Ασφαλίσεις μεγάλων επιχειρήσεων Ασφαλίσεις μικρομεσαίων επιχειρήσεων Αστική ευθύνη επιχειρήσεων Επαγγελματική αστική ευθύνη Τελευταία Νέα 20-12-2024 Attica Bank: Καταργεί χρεώσεις σε περισσότερες τραπεζικές συναλλαγές, πέραν των κυβερνητικών ανακοινώσεων 05-03-2025 AtticaWealth: Διαχείριση περιουσίας των πελατών από επαγγελματίες με κύρος σε παγκόσμιο επίπεδο 26-02-2025 Ανακοίνωση – Αλλαγή Έδρας Τράπεζας 26-02-2025 Ανακοίνωση – Συγκρότηση νέου Διοικητικού Συμβουλίου σε Σώμα. Σύνθεση Επιτροπών Δ.Σ. 26-02-2025 Ανακοίνωση – Αποφάσεις της Έκτακτης Γενικής Συνέλευσης των μετόχων της Attica Bank Ανώνυμη Τραπεζική Εταιρεία"
