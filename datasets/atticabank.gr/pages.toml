title = "Χρηματοδοτική μίσθωση (Leasing) - Attica Bank"
description = "Το Leasing (Χρηματοδοτική Μίσθωση) είναι ένας σύγχρονος τρόπος χρηματοδότησης, που επιτρέπει σε μια επιχείρηση ή σε έναν ελεύθερο επαγγελματία να αποκτήσει τη χρήση (και τελικά την κυριότητα) κινητών…"
full_description = "Το Leasing (Χρηματοδοτική Μίσθωση) είναι ένας σύγχρονος τρόπος χρηματοδότησης, που επιτρέπει σε μια επιχείρηση ή σε έναν ελεύθερο επαγγελματία να αποκτήσει τη χρήση (και τελικά την κυριότητα) κινητών και ακινήτων επενδυτικών αγαθών. Στην Ελλάδα η χρηματοδοτική μίσθωση ξεκίνησε με την εφαρμογή του νόμου 1665/86, όπως τροποποιήθηκε με τους νόμους 2367/95 και 2682/99 και ισχύει έως σήμερα. Η Attica Bank, μέσω της χρηματοδοτικής μίσθωσης, παραχωρεί στον μισθωτή (επιχείρηση ή ελεύθερος επαγγελματίας) για συγκεκριμένο χρονικό διάστημα τη χρήση κινητού εξοπλισμού ή ακινήτου έναντι μισθώματος.Ο μισθωτής καταβάλει στην Τράπεζα μίσθωμα για συγκεκριμένο χρονικό διάστημα (τουλάχιστον 3 έτη για κινητό εξοπλισμό και 10 έτη για ακίνητα) και μετά τη λήξη της σύμβασης αποκτά την κυριότητα του πράγματος έναντι προσυμφωνημένου τιμήματος.Καθ’ όλη τη διάρκεια της σύμβασης χρηματοδοτικής μίσθωσης, η Τράπεζα διατηρεί την κυριότητα του πράγματος και ο μισθωτής την κατοχή και χρήση. Μορφές χρηματοδοτικής μίσθωσης 1 Leasing κινητού εξοπλισμούH Τράπεζα αγοράζει εξοπλισμό επιλογής της επιχείρησης (από την Ελλάδα ή το εξωτερικό) και στη συνέχεια το εκμισθώνει στην ίδια έναντι συμφωνηθέντος μισθώματος. 2 Direct leasing ακινήτωνΗ Τράπεζα αγοράζει το ακίνητο καθ’ υπόδειξη της επιχείρησης και στη συνέχεια της το εκμισθώνει έναντι συμφωνηθέντος μισθώματος. 3 Sale & Leaseback ακινήτων και εξοπλισμούΗ Τράπεζα αγοράζει τον κινητό εξοπλισμό ή το επαγγελματικό ακίνητο από την επιχείρηση και το επαναμισθώνει στην ίδια με τους όρους που έχουν προσυμφωνηθεί. 4 Vendor LeasingΗ Τράπεζα δύναται να συνεργασθεί με προμηθευτές παγίου εξοπλισμού, όπως οχημάτων, μηχανημάτων έργου, ιατρικών μηχανημάτων κ.α., με σκοπό την προώθηση του Leasing στις ενδιαφερόμενες επιχειρήσεις. Χρηματοδοτική μίσθωση – Συχνές ερωτήσεις Σε ποιους απευθύνεται Ελεύθερους επαγγελματίες Ατομικές επιχειρήσεις Νομικά Πρόσωπα Ιδιωτικού Δικαίου (Α.Ε., Ε.Π.Ε, Ι.Κ.Ε, Ε.Ε, Ο.Ε. κ.ά) Νομικά Πρόσωπα Δημοσίου Δικαίου Τι χρηματοδοτείται μέσω leasing Μηχανήματα παραγωγής, έργου ή γραφείου Ιατρικά και διαγνωστικά μηχανήματα Οχήματα και αυτοκίνητα κάθε είδους Εξοπλισμός γραφείου, ξενοδοχείων, εκπαίδευσης, μηχανολογικός εξοπλισμός εργοστασίων, αποθηκών, ηλεκτρονικοί υπολογιστές Αιολικά και φωτοβολταϊκά πάρκα Κτήρια για επιχειρηματική / επαγγελματική δραστηριότηταΑεροσκάφη κάθε είδους ή οποιοδήποτε άλλο επενδυτικό αγαθό Δεν χρηματοδοτούνται μέσω leasing Πλοία και πλωτά μέσα Οικόπεδα Αναλώσιμα Εργασίες συντήρησης Παροχή υπηρεσιών Άδειες λειτουργίας και software Γιατί σας συμφέρει 1 ΧρηματοδότησηΧρηματοδοτείται μέχρι και το 100% της αξίας του παγίου και του Φ.Π.Α 2 ΡευστότηταΜέσω του leasing αποφεύγεται η δέσμευση κεφαλαίων και ενισχύεται η ρευστότητα της επιχείρησης 3 Σύνδεση με επενδυτικά προγράμματαΟι χρηματοδοτήσεις μέσω leasing δύναται να συνδυαστούν με την υπαγωγή τους σε Αναπτυξιακό Νόμο, σύμφωνα με τις προϋποθέσεις που ορίζονται από αυτόν 4 ΦορολόγησηΤο leasing ακινήτων απαλλάσσεται από τον φόρο μεταβίβασης στη λήξη. Η επιχείρηση που μεταβιβάζει ακίνητο στην Τράπεζα, κατά τη σύναψη συμβάσης Sale & Leaseback, απαλλάσσεται του φόρου μεταβίβασης. Οι τόκοι μισθωμάτων και οι αποσβέσεις του μισθίου θεωρούνται λειτουργικές δαπάνες, οι οποίες εκπίπτουν από τα ακαθάριστα έσοδα του μισθωτή 5 Όροι ΜίσθωσηςΑνταγωνιστικοί όροι μίσθωσης σε σχέση με τον τραπεζικό δανεισμό 6 ΕυελιξίαΣτους όρους αποπληρωμής, σύμφωνα με τις οικονομικές δυνατότητες της επιχείρησης (εποχικότητα, εμπροσθοβαρή ή οπισθοβαρή μισθώματα) 7 Άλλα Χαρακτηριστικά Ταχύτητα και ευελιξία στην υλοποίηση της επένδυσης Δημιουργία ρευστότητας από τα υπάρχοντα περιουσιακά στοιχεία της επιχείρησης Δυνατότητα πρόωρης λύσης της μίσθωσης και απόκτησης κυριότητας του πράγματος Φορολογικό και Λογιστικό ΠλαίσιοΒάσει του νόμου 4172/2013, ο μισθωτής υποχρεούται στη διενέργεια αποσβέσεων, για όσες συμβάσεις έχουν υπογραφεί μετά την 01/01/2014. Με την ψήφιση του νόμου 4223/13 (άρθρο 26) για όσες συμβάσεις έχουν υπογραφεί έως την 31/12/2013, ο μισθωτής υποχρεούται στη διενέργεια αποσβέσεων μετά την 01/01/2019. Τέλος, με βάση τον νόμο 4308/14 (άρθρο 18), το μισθωμένο πάγιο αναγνωρίζεται στον ισολογισμό του μισθωτή και ενεργούνται αποσβέσεις βάσει της σχετικής φορολογικής νομοθεσίας. Παράλληλα, αναγνωρίζεται ισόποση υποχρέωση προς τον εκμισθωτή, η οποία αντιμετωπίζεται ως δάνειο και το καταβαλλόμενο μίσθωμα διαχωρίζεται σε χρεολύσιο και τόκο. Στα αποτελέσματα χρήσης, ο τόκος του μισθώματος και η απόσβεση του μισθίου εκπίπτουν από τα ακαθάριστα φορολογικά έσοδα του μισθωτή. Ενημερωθείτε Επισκεφθείτε ένα κατάστημά μας. Φροντίστε να έχετε μαζί σας όλα τα απαραίτητα έγγραφα."
year_published = 2024
year_updated = 2024
