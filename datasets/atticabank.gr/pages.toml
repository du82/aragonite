["https://www.atticabank.gr/el/digital-bank/attica-mobile/companies-mobile/synallages-meso-e-banking"]
title = "Λίστα Διαθέσιμων Συναλλαγών - Attica Bank"
description = "Οι τραπεζικές σας συναλλαγές γίνονται σήμερα πιο εύκολες από ποτέ. Δείτε με μια γρήγορη ματιά τις δυνατότητες που σας προσφέρει το Attica e…"
full_description = "Οι τραπεζικές σας συναλλαγές γίνονται σήμερα πιο εύκολες από ποτέ. Δείτε με μια γρήγορη ματιά τις δυνατότητες που σας προσφέρει το Attica e-banking Διαθέσιμες συναλλαγές 1 Θέση πελάτη Δείτε σε πραγματικό χρόνο τα υπόλοιπα και τις κινήσεις των καταθετικών σας λογαριασμών, των καρτών σας, τις προθεσμιακές σας καταθέσεις, τα δάνειά σας, τις ασφάλειές σας και τα επενδυτικά σας προϊόντα. Επιπλέον, μπορείτε με πολύ εύκολο τρόπο να κατεβάσετε και να αποθηκεύσετε το ιστορικό των λογαριασμών σας σε μορφή pdf, xls και CSV. 2 Μεταφορές Μπορείτε να πραγματοποιήσετε μεταφορές χρημάτων μεταξύ δικών σας λογαριασμών, προς άλλους λογαριασμούς εντός της Attica Bank και προς λογαριασμούς άλλων τραπεζών που βρίσκονται στην Ελλάδα ή στο εξωτερικό (μέσω ΔΙΑΣ). Το κόστος που επιβαρύνεστε σε κάθε εκτέλεση της συναλλαγής σας προς άλλες Τράπεζες αναγράφεται στους Ειδικούς Όρους Τραπεζικών Εργασιών της τράπεζας (δείτε στο τέλος της σελίδας το σχετικό αρχείο). 3 IRIS payments Είστε Ελεύθερος Επαγγελματίας ή έχετε Ατομική Επιχείρηση; Με την εγγραφή σας στην υπηρεσία IRIS payments μπορείτε να δέχεστε άμεσα και εύκολα πληρωμές ανεξαρτήτως αριθμού συναλλαγών, έως €500 για κάθε συναλλαγή. Ακόμη, μπορείτε να αποστέλλετε χρήματα άμεσα σε όσους είναι ήδη εγγεγραμμένοι στην υπηρεσία IRIS Payments έως €500 ημερησίως, ανεξαρτήτως αριθμού συναλλαγών, μόνο με τη χρήση του αριθμού κινητού τηλεφώνου του παραλήπτη ή απλά σκανάροντας τον IRIS payments QR Code τους. Τέλος, μπορείτε να προσθέσετε τον IRIS payments QR Code στο ψηφιακό σας πορτοφόλι, και να επιδεικνύετε στους πελάτες σας τον κωδικό μέσα από το wallet σας, και εκείνοι σκανάροντάς τον μέσω του mobile app της δικής τους τράπεζας εκτελούν την πληρωμή πληκτρολογώντας μόνο το ποσό. 4 Πληρωμές λογαριασμών Πληρώστε τους λογαριασμούς σας και τις οφειλές σας σε Οργανισμούς Ενέργειας, Ύδρευσης, Τηλεπικοινωνιών και ιδιωτικών Ασφαλειών και σε Δημόσιους Φορείς. Σας παρέχεται η δυνατότητα να πληρώσετε είτε επιλέγοντας τον οργανισμό από μια λίστα, είτε επιλέγοντας την πληρωμή με κωδικό RF όπου καταχωρείτε τον 25ψήφιο Κωδικό Πληρωμής που ξεκινά πάντα με τα χαρακτηριστικά γράμματα RF και περιέχει όλες τις πληροφορίες που αφορούν τον Οργανισμό ή την Εταιρεία. Το κόστος που επιβαρύνεστε σε κάθε εκτέλεση της συναλλαγής σας αναγράφεται στους Ειδικούς Όρους Τραπεζικών Εργασιών της τράπεζας (δείτε στο τέλος της σελίδας το σχετικό αρχείο). 5 Πληρωμές καρτών Έχετε τη δυνανότητα πληρωμής πιστωτικής κάρτας δικής σας ή τρίτου στην Attica Bank, όπως επίσης και σε οποιαδήποτε άλλη Τράπεζα επιλέγοντας να χρεώσετε τον τραπεζικό σας λογαριασμό. 6 Πάγιες εντολές Αποκτήστε τώρα ευκολία στην εξόφληση των λογαριασμών σας μέσω της ενεργοποίησης μιας πάγιας εντολής για οποιοδήποτε οργανσιμό επιθυμείτε χωρίς κόστος για την ανάθεση της εντολής σας. Την ημερομηνία εξόφλησης του λογαριασμού σας, η πληρωμή του εκτελείται αυτόματα με χρέωση του τραπεζικού σας λογαριασμού. Το κόστος που επιβαρύνεστε σε κάθε εκτέλεση της συναλλαγής σας αναγράφεται στους Ειδικούς Όρους Τραπεζικών Εργασιών της τράπεζας (δείτε στο τέλος της σελίδας το σχετικό αρχείο). 7 Αίτηση χορήγησης καρνέ επιταγών Μέσω του Attica e-banking μπορείτε να αποστείλετε αίτηση χορήγησης καρνέ επιταγών και θα χρειαστεί να μια επίσκεψη σε κατάστημα της επιλογής σας για να το παραλάβετε. 8 Υπηρεσία μαζικών πληρωμών (Mass Payments) Εξοικονομήστε χρόνο και μειώστε το λειτουργικό κόστος, με την υπηρεσία Μαζικών πληρωμών με χρήση ηλεκτρονικού αρχείου που σας προσφέρει το Attica e-banking. Έχετε την δυνατότητα για ομαδική πληρωμή τόσο σε λογαριασμούς τρίτων της Attica Bank, όσο και σε λογαριασμούς άλλων τραπεζών με αντίστοιχη χρέωση. Για να εκτελέσετε ένα αρχείο Μαζικών Πληρωμών (Μισθοδοσία), θα πρέπει πρώτα να δημιουργήσετε το κατάλληλο αρχείο, το οποίο υποστηρίζει πολλαπλές μεταφορές σε λογαριασμούς Τρίτων στην Attica Bank με μία χρέωση του λογαριασμού σας. Οι συναλλαγές του αρχείου θα εκτελεστούν στο χρονικό σημείο που ορίζεται από την Τράπεζα ως χρόνος λήξης των ημερήσιων εργασιών της. Εάν ο χρόνος λήψης της εντολής συμπίπτει με ημέρα που δεν είναι εργάσιμη, η εντολή θα θεωρείται ληφθείσα την αμέσως επόμενη εργάσιμη ημέρα. 9 Συναλλαγές POS Σε περίπτωση που έχετε στην κατοχή σας τερματικό/ά POS μπορείτε να δείτε και να αποθηκεύσετε, αν το επιθυμείτε, το ιστορικό κινήσεων όλων των συναλλαγών που πραγματοποιήθηκαν μέσα από το ή τα POS τα αποία είναι συνδεδεμένα στο λογαριασμό σας. Μπορείτε να δείτε όλα τα είδη συναλλαγών που αφορούν σε «Αγορές», «Αγορές με Δόσεις» ή «Αγορές με Δόσεις και Προπληρωμή» και την κατάσταση της κάθε συναλλαγής που μπορεί να είναι «Επιτυχής» ή «Ανεπιτυχής». Μέχρι την ημερομηνια έκδοσης του statement, μπορείτε να δειτε όλες τις συναλλαγές σας. Επίσης μπορείτε να επιλέξετε εσείς το χρονικό διάστημα για το οποίο επιθυμείτε να δείτε τις συναλλαγές. Η προεπιλογή που έχετε διαθέσιμη αναφέρεται σε διάστημα τριών ημερών. 10 Εμφάνιση στοιχείων σας που λαμβάνετε alerts & OTPs Μέσω του Attica e-banking & Attica Mobile, μπορείτε να δείτε τα προσωπικά στοιχεία που έχετε δηλώσει στην Τράπεζα για να λαμβάνετε τους μοναδικούς κωδικούς μέσω SMS αλλά και μέσω e-mail. Οδηγίες χρήσης για μεταφορές & μαζικές πληρωμές Εγκριτικά σχήματα & συναλλαγές Πληρωμές οργανισμών/εταιριών & με κωδικό RF"
