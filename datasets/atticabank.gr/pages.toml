title = "Χρήσιμες συμβουλές - Attica Bank"
description = "H Attica Bank σας υπενθυμίζει ότι δεν θα σας ζητήσει ποτέ προσωπικούς κωδικούς πρόσβασης με κανένα τρόπο (τηλεφωνικά ή μέσω e-mail/viber/sms). Σε περίπτωση οποιασδήποτε υπόνοιας απάτης…"
full_description = "H Attica Bank σας υπενθυμίζει ότι δεν θα σας ζητήσει ποτέ προσωπικούς κωδικούς πρόσβασης με κανένα τρόπο (τηλεφωνικά ή μέσω e-mail/viber/sms). Σε περίπτωση οποιασδήποτε υπόνοιας απάτης, παρακαλούμε επικοινωνήστε άμεσα μαζί μας καλώντας στο 210 3669000. Ακολουθήστε τα παρακάτω για ασφαλείς συναλλαγές Ασφαλής πλοήγηση Βεβαιωθείτε ότι χρησιμοποιείτε την υπηρεσία Attica e-banking αποκλειστικά μέσω της επίσημης ιστοσελίδας και όχι μέσω συνδέσμων (links) σε άλλες ιστοσελίδες από μηχανές αναζήτησης ή e-mails, όταν πληκτρολογείτε τους κωδικούς πρόσβασης. Διασφαλίστε τους κωδικούς και την κάρτα σας Οι κωδικοί Username (Κωδικός Πελάτη) και Password (Μυστικός Κωδικός) που χρησιμοποιείτε για την είσοδό σας στο e-banking και στο mobile banking είναι αυστηρά προσωπικοί. Επιλέγετε σύνθετο Password(Μυστικό Κωδικό) και αποφεύγετε τις φόρμες αυτόματης συμπλήρωσης κωδικών. Η διαφύλαξη των κωδικών πρόσβασης είναι ευθύνη σας. Σε περίπτωση που διαπιστώσετε ή υποπτευθείτε κλοπή ή υποκλοπή, οφείλετε να ειδοποιήσετε αμέσως την Attica Bank. Ελέγχετε καθημερινά ότι η κάρτα σας βρίσκεται στην κατοχή σας και ενημερώστε άμεσα την Τράπεζα για οποιαδήποτε μη εξουσιοδοτημένη χρήση από τρίτους. Το PIN είναι απόλυτα εμπιστευτικό και δεν πρέπει να το γνωρίζει κανένας άλλος εκτός από εσάς. Το PIN δεν θα πρέπει να φυλάσσεται ποτέ μαζί με την κάρτα σας. Αποφύγετε να χρησιμοποιείτε ως PIN προσωπικά σας στοιχεία, που μπορούν εύκολα να γίνουν αντιληπτά από τρίτους (π.χ. έτος ή ημερομηνία γέννησης δικά σας ή μελών της οικογενείας σας) ή να χρησιμοποιείτε το ίδιο PIN για περισσότερες από μία κάρτες. Κατά τη χρήση της κάρτας σας σε ATMή POS καλύπτετε πάντα το πληκτρολόγιο κατά την εισαγωγή του PIN σας. Μην εμπιστεύεστε για οποιοδήποτε λόγο τη χρήση της κάρτας σας σε τρίτους, γνωστοποιώντας τους το PIN σας. Η Attica Bank δεν θα σας ζητήσει ποτέ και με κανέναν τρόπο (τηλεφωνικά ή μέσω e-mail/sms) τους κωδικούς σας. Παραπλανητικά μηνύματα (fishing-mails) μέσω ηλεκτρονικού ταχυδρομείου ή και sms έχουν στόχο να υποκλέψουν προσωπικά σας στοιχεία. Τα μηνύματα αυτά υποτίθεται ότι έχουν αποσταλεί από την Attica Bank και προτρέπουν τον παραλήπτη να μεταβεί σε συγκεκριμένη σελίδα, προκειμένου να πληκτρολογήσει τα προσωπικά του στοιχεία (π.χ. Username, Password κ.λ.π.). Διαγράψτε αμέσως τυχόν e-mails που σας προτρέπουν να δώσετε προσωπικά σας στοιχεία ή στοιχεία σύνδεσης στις ψηφιακές υπηρεσίες της Τράπεζας, να επισκεφθείτε ιστοσελίδες ή να ανοίξετε συνημμένα αρχεία. Τηλεφωνικές κλήσεις (voicefishing) από υποτιθέμενους εκπροσώπους της Τράπεζας έχουν στόχο να υποκλέψουν προσωπικά σας στοιχεία (π.χ. αριθμό λογαριασμού, κωδικό πελάτη, ΑΦΜ, ΑΔΤ, κ.λ.π.) και πρέπει να αγνοούνται. Προστατέψτε τον υπολογιστή / κινητό σας από κακόβουλες ενέργειες Ενημερώνετε με νεότερες εκδόσεις το λειτουργικό σύστημα του υπολογιστή σας και τα προγράμματα πλοήγησης (browsers) ή τυχόν εφαρμογές. Θωρακίστε τον υπολογιστή και το κινητό σας με προγράμματα προστασίας, όπως Firewall, Antivirus, Antispyware, τα οποία θα πρέπει πάντα να έχετε ενεργοποιημένα και ενημερωμένα με την τελευταία διαθέσιμη έκδοση. Πραγματοποιήστε τις συναλλαγές σας από ασφαλή δίκτυα και διαδικτυακούς τόπους. Αποφεύγετε τη χρήση υπολογιστών σε δημόσιους χώρους ή τη χρήση υπολογιστών τρίτων. Χρησιμοποιείτε την υπηρεσία Attica e-banking μόνο μέσω των επίσημων ιστοσελίδων της Attica Bank (https://www.atticabank.gr, ή απευθείας στο https://ebanking.atticabank.gr) και όχι μέσω συνδέσμων (links) που εμπεριέχονται σε άλλες ιστοσελίδες (sites), μηχανές αναζήτησης ή e-mail. Επαναφέρετε το κινητό σας στις εργοστασιακές ρυθμίσεις, πριν το μεταβιβάσετε σε άλλο πρόσωπο ή το ανακυκλώσετε."
