title = "Επικαιροποίηση Στοιχείων μέσω της Υπηρεσίας eGov-KYC - Attica Bank"
description = "Μέσω του Attica e-banking (δεν παρέχεται μέσω Attica Mobile) και με χρήση της υπηρεσίας Συστηθείτε – eGov-KYC (Know Your Customer) της Ενιαίας Ψηφιακής Πύλης της Δημόσιας Διοίκησης…"
full_description = "Μέσω του Attica e-banking (δεν παρέχεται μέσω Attica Mobile) και με χρήση της υπηρεσίας Συστηθείτε – eGov-KYC (Know Your Customer) της Ενιαίας Ψηφιακής Πύλης της Δημόσιας Διοίκησης, μπορείτε να επικαιροποιήσετε τα προσωπικά σας στοιχεία που έχετε δηλώσει στην Τράπεζα, χωρίς να απαιτείται επίσκεψη σε κατάστημα. Επιλέγετε ποια από τις παρακάτω κατηγορίες που παρέχονται προς επικαιροποίηση επιθυμείτε ή ποια απο αυτές είναι υποχρεωτικά προεπιλεγμένη από το σύστημα: Στοιχεία ταυτότητας (Ελληνικό Αστυνομικό Δελτίο Ταυτότητας Στοιχεία επικοινωνίας(διεύθυνση διαμονής, διεύθυνσης επικοινωνίας, τηλέφωνο επικοινωνίας σταθερό – κινητό και e-mail) Στοιχεία εισοδήματος Στοιχεία επαγγελματκής δραστηριότητας (επάγγελμα, διεύθυνση εργασίας) Στη συνέχεια χρειάζεται να αποδεχτείτε τους όρους χρήσης και να συνδεθείτε με τους προσωπκούς σας κωδικούς TaxisNet. Για να ολοκληρωθεί η διαδικασία πρέπει να συναινέσετε στη διάθεση των στοχείων σας. Εφόσον η συναλλαγή ολοκληρωθεί με επιτυχία επιστρέφετε αυτόματα στο Attica e-banking. Σε περίπτωση αποτυχίας της συναλλαγής, εμφανίζεται μήνυμα σφάλματος . Σημειώνεται ότι η υπηρεσία δεν είναι διαθέσιμη για τις κάτωθι κατηγορίες: Άνεργοι Φοιτητές Συνταξιούχοι Οικιακά Σε αυτές τις περιπτώσεις μπορείτε να πραγματοποιήσετε Επικαιροποίηση Στοιχείων σε ένα κατάστημα Attica Bank."
