title = "Yπολογιστής IBAN - Attica Bank"
description = "Ο ΙΒΑΝ (International Bank Account Number) είναι ένας τραπεζικός λογαριασμός δομημένος σύμφωνα με τις προδιαγραφές που έχει φτιάξει η Ευρωπαϊκή Επιτροπή Τραπεζικών Προϊόντων."
full_description = "Τι είναι ο ΙΒΑΝ; Ο ΙΒΑΝ (International Bank Account Number) είναι ένας τραπεζικός λογαριασμός δομημένος σύμφωνα με τις προδιαγραφές που έχει φτιάξει η Ευρωπαϊκή Επιτροπή Τραπεζικών Προϊόντων. Κάθε τραπεζικός λογαριασμός ο οποίος τηρείται στην τράπεζα μας, μπορεί να μετατραπεί σε λογαριασμό ΙΒΑΝ. Ποιος ο σκοπός του ΙΒΑΝ; Σκοπός του ΙΒΑΝ είναι να διευκολύνει την αυτόματη επεξεργασία κυρίως των διασυνοριακών μεταφορών κεφαλαίων. Με τη χρήση του ΙΒΑΝ διασφαλίζεται η σωστή μετάδοση του Αριθμού Λογαριασμού, καθώς περιορίζεται η χειρογραφική επέμβαση κατά την πίστωσή του. Παράλληλα, βελτιώνονται η ποιότητα εξυπηρέτησης του πελάτη και η ταχύτητα εκτέλεσης των συναλλαγών. Κατάστημα … ΑΓΙΑΣ ΠΑΡΑΣΚΕΥΗΣ ΑΓΙΟΥ ΔΗΜΗΤΡΙΟΥ ΑΓΡΙΝΙΟΥ ΑΙΓΑΛΕΩ ΑΚΑΔΗΜΙΑΣ ΑΛΕΞΑΝΔΡΟΥΠΟΛΗΣ ΑΜΑΡΟΥΣΙΟΥ ΑΝΟΙΞΗΣ ΑΝΩ ΓΛΥΦΑΔΑ ΑΝΩ ΠΑΤΗΣΙΩΝ ΑΣΠΡΟΠΥΡΓΟΥ ΑΧΑΡΝΩΝ (ΜΕΝΙΔΙΟΥ) ΒΑΡΗΣ ΒΑΣΙΛΙΣΣΗΣ ΟΛΓΑΣ ΒΕΡΟΙΑΣ ΒΟΛΟΥ ΓΑΛΑΤΣΙΟΥ ΓΙΑΝΝΙΤΣΩΝ ΓΛΥΦΑΔΑΣ ΔΙΑΒΑΤΑ ΔΡΑΜΑΣ ΗΛΙΟΥΠΟΛΗΣ ΗΡΑΚΛΕΙΟ – Λ.ΔΗΜΟΚΡΑΤΙΑΣ ΗΡΑΚΛΕΙΟΥ ΘΕΡΜΗ ΘΕΣΣΑΛΟΝΙΚΗΣ ΙΛΙΟΝ ΙΩΑΝΝΙΝΩΝ ΚΑΒΑΛΑΣ ΚΑΛΑΜΑΡΙΑΣ ΚΑΛΑΜΑΤΑΣ ΚΑΛΛΙΘΕΑΣ ΚΑΤΕΡΙΝΗΣ ΚΕΝΤΡΙΚΟ ΘΕΣΣΑΛΟΝΙΚΗΣ ΚΕΡΑΤΣΙΝΙΟΥ ΚΕΡΚΥΡΑΣ ΚΗΦΙΣΙΑΣ ΚΟΖΑΝΗΣ ΚΟΜΟΤΗΝΗΣ ΚΟΡΙΝΘΟΥ ΚΟΡΥΔΑΛΛΟΥ ΚΟΡΩΠΙΟΥ ΛΑΜΙΑΣ ΛΑΡΙΣΑΣ ΛΕΩΦΟΡΟΥ ΑΘΗΝΩΝ ΛΙΒΑΔΕΙΑΣ ΜΕΤΑΜΟΡΦΩΣΗΣ ΜΗΤΡΟΠΟΛΕΩΣ ΜΟΝΑΣΤΗΡΑΚΙΟΥ ΜΟΥΣΕΙΟΥ ΝΕΑΣ ΕΓΝΑΤΙΑΣ ΝΕΑΣ ΕΡΥΘΡΑΙΑΣ ΝΕΑΣ ΙΩΝΙΑΣ ΝΕΑΣ ΚΗΦΙΣΙΑΣ ΝΕΑΣ ΣΜΥΡΝΗΣ ΝΕΟΥ ΨΥΧΙΚΟΥ ΝΙΚΑΙΑΣ ΞΑΝΘΗΣ ΟΜΗΡΟΥ ΠΑΓΚΡΑΤΙΟΥ ΠΑΛΛΗΝΗΣ ΠΑΝΕΠΙΣΤΗΜΙΟΥ ΠΑΝΟΡΜΟΥ ΠΑΤΡΑΣ ΠΕΙΡΑΙΑ ΠΕΙΡΑΙΑ ΚΕΝΤΡΙΚΟ ΠΕΡΙΣΤΕΡΙΟΥ ΠΥΛΑΙΑΣ ΠΥΡΓΟΥ ΡΕΘΥΜΝΟΥ ΡΟΔΟΥ ΣΕΡΡΩΝ ΣΤΑΥΡΟΥΠΟΛΗΣ ΤΑΥΡΟΥ ΤΡΙΚΑΛΩΝ ΤΣΙΜΙΣΚΗ ΧΑΛΑΝΔΡΙΟΥ ΧΑΛΚΙΔΑΣ ΧΑΝΙΩΝ ΧΙΟΥ ΧΟΛΑΡΓΟΥ Επιλέξτε προσεκτικά το κατάστημα στο οποίο τηρείται ο λογαριασμός που θα δηλώσετε. Εάν δεν είστε σίγουροι για το κατάστημα συνεργασίας σας, παρακαλούμε επικοινωνήστε με την Τράπεζα. Αριθμός Λογαριασμού Μετατροπή IBAN Έλεγχος IBAN Διάγραμμα χρήσης του ΙΒΑΝ στη μεταφορά κεφαλαίων Ο ΙΒΑΝ γνωστοποιείται στον Δικαιούχο από την Τράπεζά του.Ο Δικαιούχος διαβιβάζει τον ΙΒΑΝ του στον εντολέα.Ο Εντολέας υποβάλλει μια διασυνοριακή εντολή μεταφοράς κεφαλαίου, που περιέχει τον ΙΒΑΝ του δικαιούχου.Ο ΙΒΑΝ του δικαιούχου ελέγχεται ως προς την ορθότητά του από την τράπεζα του εντολέα και στη συνέχεια η εντολή προωθείται στην τράπεζα του δικαιούχου, η οποία το παραλαμβάνει και με βάση τον ΙΒΑΝ, πιστώνει τον λογαριασμό του δικαιούχου. Πως είναι δομημένος ο ΙΒΑΝ; ΙΒΑΝ έχει σταθερό πλήθος χαρακτήρων για κάθε χώρα με μέγιστο μήκος 34 αλφαριθμητικούς χαρακτήρες. Στην Ελλάδα έχει σταθερό μήκος 27 αλφαριθμητικών χαρακτήρων όπου: οι δύο πρώτοι αλφαβητικοί χαρακτήρες καθορίζουν τη χώρα, στην οποία τηρείται ο λογαριασμός (GR για την Ελλάδα). οι δύο επόμενοι είναι ψηφία ελέγχου που επικυρώνουν ολόκληρο τον ΙΒΑΝ και το τελευταίο τμήμα του είναι ο Βασικός Αριθμός Λογαριασμού (Basic Bank Account Number ή ΒΒΑΝ), ο οποίος εμπεριέχει την Τράπεζα, το Κατάστημα και τον Αριθμό Λογαριασμού του πελάτη. για να μετατραπεί σε ΙΒΑΝ, πρέπει ο κωδικός της Ελλάδας και τα δύο ψηφία ελέγχου να προηγηθούν του βασικού αριθμού λογαριασμού, ως ακολούθως: Στην Ελλάδα ο Βασικός Αριθμός Λογαριασμού (ΒΒΑΝ) αποτελείται από: Τρία (3) ψηφία για τον κωδικό της Τράπεζας Τέσσερα (4) ψηφία για τον κωδικό του Καταστήματος και Δεκαέξι (16) ψηφία για τον αριθμό Λογαριασμού του πελάτη. Όταν τα ψηφία του αριθμού λογαριασμού του πελάτη είναι λιγότερα από 16 τότε η Τράπεζα φροντίζει να τον συμπληρώσει με μηδενικά που τοποθετούνται στην αρχή του. Παράδειγμα ΙΒΑΝ Έστω πως στο κατάστημα Πανεπιστημίου της τράπεζάς μας υφίσταται ο αριθμός λογαριασμού 12345678. Ο βασικός αριθμός λογαριασμού (ΒΒΑΝ) είναι: 01600650000000012345678 όπου: 016 ο κωδικός της τράπεζας μας 0065 ο κωδικός του καταστήματος Πανεπιστημίουκαι 0000000012345678 ο αριθμός λογαριασμού του πελάτη. Στην Ελλάδα, ο βασικός αυτός αριθμός Λογαριασμού (ΒΒΑΝ) 01600650000000012345678 Πως αναγράφεται ο ΙΒΑΝ; Ο ΙΒΑΝ μπορεί να χρησιμοποιηθεί σε ηλεκτρονική και σε έντυπη μορφή. Η έντυπη μορφή του είναι ίδια με την ηλεκτρονική με τη μόνη διαφορά: Ο έντυπος ΙΒΑΝ αναγράφεται σε ομάδες των 4 χαρακτήρων διαχωρισμένες με κενό. Παράδειγμα ελληνικού ΙΒΑΝ Βασικός αριθμός λογαριασμού (ΒΒΑΝ)01101250000000012300695 ΙΒΑΝ σε ηλεκτρονική μορφήGR1601101250000000012300695 ΙΒΑΝ σε έντυπη μορφήGR16 0110 1250 0000 0001 2300 695 Για περισσότερες πληροφορίες, παρακαλούμε απευθυνθείτε σε ένα από τα καταστήματα της Attica Bank."
