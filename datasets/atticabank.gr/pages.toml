title = "Διαθέσιμες συναλλαγές - Attica Bank"
description = "Στην Attica Bank, μένουμε πάντα δίπλα σας για κάθε σας ανάγκη. Έτσι, δημιουργήσαμε μία νέα, προσωποποιημένη υπηρεσία με την ονομασία “Your Attica”, με στόχο να εξυπηρετείστε από όπου κι αν βρίσκεστε…"
full_description = "Στην Attica Bank, μένουμε πάντα δίπλα σας για κάθε σας ανάγκη. Έτσι, δημιουργήσαμε μία νέα, προσωποποιημένη υπηρεσία με την ονομασία “Your Attica“, με στόχο να εξυπηρετείστε από όπου κι αν βρίσκεστε, όπως σε ένα φυσικό κατάστημα Attica Bank. Καλέστε μας στο 210 366 9009 για να σας εξυπηρετήσουμε με τις απλές, καθημερινές σας τραπεζικές συναλλαγές αλλά και για να συζητήσουμε τις πιο σύνθετες ανάγκες σας όπως ένα δάνειο ή ένα αποταμιευτικό προϊόν. Καλέστε μας χωρίς χρέωση Μιλήστε με τα έμπειρα τραπεζικά μας στελέχη Διευρυμένο ωράριο, Δευτέρα έως Παρασκευή, από τις 09:00 έως τις 17:00 Διαθέσιμες συναλλαγές Κάντε τις καθημερινές τραπεζικές σας συναλλαγές, αιτηθείτε για ένα δάνειο ή για μια πιστωτική κάρτα και ανοίξτε μια απο τις προθεσμιακές καταθέσεις της Attica Bank που ανταποκρίνεται στις δικές σας ανάγκες. Τα έμπειρα τραπεζικά μας στελέχη είναι στη διάθεσή σας να συζητήσετε την κάθε σας ανάγκη. Οι συναλλαγές που μπορείτε να εκτελέσετε είναι: Άνοιγμα και διαχείριση προθεσμιακής κατάθεσης Μεταφορές χρημάτων σε λογαριασμούς άλλων Τραπεζών Μεταφορές χρημάτων σε λογαριασμούς εντός Attica Bank Αίτηση καταναλωτικού δανείου Αίτηση έκδοσης κάρτας (χρεωστική / πιστωτική / προπληρωμένη) Επανέκδοση PIN καρτών Πληρωμές οργανισμών για την εξόφληση λογαριασμών και οφειλών σας Αίτηση για νέα πάγια εντολή και διαχείριση ενεργών παγίων εντολών Αίτημα αμφισβήτησης συναλλαγής"
