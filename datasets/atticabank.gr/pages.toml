full_description = "Τι είναι και πώς επωφελείστε; Με το τοκοχρεωλυτικό καταναλωτικό δάνειο “New Start” μπορείτε να καλύψετε προσωπικές και καταναλωτικές ανάγκες με ανταγωνιστικό επιτόκιο.Αποκτήστε το γρήγορα, οποιαδήποτε στιγμή σε ένα κατάστημά μας. Με μια γρήγορη ματιά 1 Ποσό χορήγησηςΑπό €1.000 έως €25.000 2 Επιτόκιο9,50% σταθερό για όλη τη διάρκεια του δανείου (πλέον εισφ. Ν128/75, σήμερα 0,60%) Συνολικό Ετήσιο Πραγματικό Ποσοστό Επιβάρυνσης (ΣΕΠΠΕ) Ενδεικτικό Σ.Ε.Π.Π.Ε.: 11,40% Για εφάπαξ εκταμίευση συνολικού ποσού πίστωσης 10.000 € με αποπληρωμή σε 60 μηνιαίες συνεχείς τοκοχρεολυτικές δόσεις από την πλήρη εκταμίευση του ποσού της πίστωσης, δαπάνη εξέτασης δανείου καταναλωτικής πίστης New Start 170 € και επιτόκιο 9,50% (σταθερό), πλέον εισφοράς Ν. 128/75 σήμερα 0,60%. (Το ποσοστό αυτό ισχύει μόνο με την προϋπόθεση ότι τα δεδομένα του παραδείγματος δεν θα μεταβληθούν) Κλείσιμο 3 ΕκταμίευσηΕφάπαξ στον καταθετικό λογαριασμό που τηρείτε στην Attica Bank 4 Διάρκεια– Από 6 έως 60 μήνες για ποσό δανείου €1.000 – €5.000– Από 6 έως 84 μήνες για ποσό δανείου €5.000,01 – €25.000 5 ΑποπληρωμήΣε μηνιαίες τοκοχρεωλυτικές δόσεις 6 Πρόωρη αποπληρωμήΔυνατότητα ολικής ή μερικής πρόωρης αποπληρωμής του δανείου χωρίς επιβάρυνση Ενημερωθείτε Επισκεφθείτε ένα κατάστημά μας. Φροντίστε να έχετε μαζί σας όλα τα απαραίτητα έγγραφα."
