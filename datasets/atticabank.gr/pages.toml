title = "Κάντε την εγγραφή σας online - Attica Bank"
description = """
Συμπληρώστε τα στοιχεία σας:

Τον ΑΦΜ σας
Ημερομηνία γέννησης
Αριθμό ταυτότητας ή διαβατηρίου
Αριθμό κινητού τηλεφώνου
Διεύθυνση email

Επιπλέον, θα πρέπει να δώσετε ένα από τα εξής:

Τον αριθμό του λογαριασμού σας στην Attica Bank
Τον αριθμό της χρεωστικής σας κάρτας ή της πιστωτικής σας κάρτας

Μετά τη συμπλήρωση των στοιχείων σας, πατήστε «Επόμενο». Αν υπάρχει πρόβλημα με κάποιο προσωπικό σας στοιχείο, θα ενημερωθείτε με σχετικό μήνυμα και η διαδικασία θα διακοπεί. Για τη διαδικασία επικαιροποίησης των στοιχείων σας μπορείτε να ενημερωθείτε μέσω της Υπηρεσίας μας Εξυπηρέτησης Πελατών στο 2103669000 ή μέσω ενός καταστήματος της Attica Bank."""
full_description = "Για να εγγραφείτε online στις ψηψιακές υπηρεσίες Attica e-banking & Attica Mobile, επισκεφθείτε τη σελίδα μας στο Attica e-banking και επιλέξτε «Online Εγγραφή στο Attica e-banking». Η online εγγραφή αποτελείται από 4 βήματα. Θα πρέπει να έχετε διαθέσιμο τον αριθμό λογαριασμού σας ή τον αριθμό της Attica Bank κάρτας σας (χρεωστική είτε πιστωτική). Απαραίτητη προυπόθεση είναι να έχετε δηλώσει στην Τράπεζα το κινητό σας τηλέφωνο και το προσωπικό σας e-mail. Με την ολοκλήρωση της διαδικασίας, λαμβάνετε άμεσα τους προσωπικούς σας κωδικούς πρόσβασης στο e-mail σας και στο κινητό σας τηλέφωνο, με τους οποίους μπορείτε να συνδεθείτε αμέσως στο Attica e-banking και στο Attica Mobile. Σημαντική σημείωση Για να έχετε τη δυνατότητα εκτέλεσης συναλλαγών μέσω του Attica e-banking, θα χρειαστεί να ενεργοποιήσετε την Υπηρεσία Αποστολής Kωδικών Μιας χρήσης μέσω SMS. Μετά την επιτυχημένη σύνδεσή σας στο Attica e-banking επιλέγετε την κατηγορία Εργασίες Χρήστη. Για να χρησιμοποιήστε το Attica Μobile, θα χρειαστεί να εγκαταστήσετε την εφαρμογή στη συσκευή του κινητού σας Online εγγραφή 1ο Βήμα: Προσωπικά στοιχεία Συμπληρώστε τα στοιχεία σας: Τον ΑΦΜ σας Ημερομηνία γέννησης Αριθμό ταυτότητας ή διαβατηρίου Αριθμό κινητού τηλεφώνου Διεύθυνση email Επιπλέον, θα πρέπει να δώσετε ένα από τα εξής: Τον αριθμό του λογαριασμού σας στην Attica Bank Τον αριθμό της χρεωστικής σας κάρτας ή της πιστωτικής σας κάρτας Μετά τη συμπλήρωση των στοιχείων σας, πατήστε «Επόμενο». Αν υπάρχει πρόβλημα με κάποιο προσωπικό σας στοιχείο, θα ενημερωθείτε με σχετικό μήνυμα και η διαδικασία θα διακοπεί. Για τη διαδικασία επικαιροποίησης των στοιχείων σας μπορείτε να ενημερωθείτε μέσω της Υπηρεσίας μας Εξυπηρέτησης Πελατών στο 2103669000 ή μέσω ενός καταστήματος της Attica Bank. 2ο Βήμα: Επιβεβαίωση στοιχείων Μετά την επιτυχή ταυτοποίηση των στοιχείων σας, θα λάβετε ένα SMS στο κινητό σας με έναν μοναδικό κωδικό ασφαλείας. Θα πρέπει να εισάγετε αυτόν τον κωδικό στο πεδίο «Κωδικός Επαλήθευσης» για να επιβεβαιώσετε τον αριθμό του κινητού σας. Ο κωδικός ισχύει για 2 λεπτά. Αν δεν τον χρησιμοποιήσετε εντός αυτού του χρονικού πλαισίου, μπορείτε να ζητήσετε να σας σταλεί ένας νέος κωδικός επιλέγοντας «Επαναποστολή». Αν κάνετε λάθος τρεις φορές στην εισαγωγή του κωδικού, για λόγους ασφαλείας, θα πρέπει να περιμένετε 24 ώρες πριν δοκιμάσετε ξανά. 3ο Βήμα: Επαλήθευση ασφαλείας Μετά την επιτυχή επαλήθευση του αριθμού του κινητού σας τηλεφώνου, λαμβάνετε στο e-mail σας έναν δεύτερο κωδικό ασφαλείας, τον οποίο θα πρέπει να εισάγετε στο πεδίο «Κωδικός Επαλήθευσης». Ο κωδικός ισχύει για 2 λεπτά. Σε περίπτωση που λήξει αυτό το διάστημα χωρίς να εισάγετε τον «Κωδικό Επαλήθευσης», επιλέξτε την «Επαναποστολή» ώστε να λάβετε νέο κωδικό. Αν κάνετε λάθος τρεις φορές στην εισαγωγή του κωδικού, για λόγους ασφαλείας, θα πρέπει να περιμένετε 24 ώρες πριν δοκιμάσετε ξανά. 4ο Βήμα: Ολοκλήρωση εγγραφής και σύνδεση Στο σημείο αυτό, θα πρέπει να συμπληρώσετε τον Κωδικό Πελάτη και τον Μυστικό Κωδικό τους οποίους θέλετε να χρησιμοποιήσετε για την είσοδό σας στο Attica e-banking. Για την επιλογή τους, παρακαλούμε ακολουθήστε τους κανόνες που αναφέρονται στο κάτω μέρος της οθόνης. Προκειμένου να ολοκληρωθεί η διαδικασία, απαιτείται να ενημερωθείτε και να συμφωνήσετε με τους Όρους Χρήσης των Συστημάτων Ψηφιακών Υπηρεσιών και τη Σύμβαση Παροχής Τραπεζικών Υπηρεσιών μέσω Ψηφιακών Συστημάτων επιλέγοντας την επιλογή «Αποδοχή Όρων». Πατώντας «Υποβολή», η διαδικασία ολοκληρώνεται και εμφανίζεται μήνυμα που σας ενημερώνει για την επιτυχημένη εγγραφή σας στην υπηρεσία καθώς και για το e-mail επιβεβαίωσης που θα λάβετε. Με την ολοκλήρωση της διαδικασίας, μπορείτε άμεσα να συνδεθείτε στην υπηρεσία Attica e-banking πληκτρολογώντας τον Κωδικό Πελάτη και τον Μυστικό Κωδικό της επιλογής σας. Για να έχετε τη δυνατότητα εκτέλεσης συναλλαγών συνδεθείτε πρώτα στο Attica e-banking και ενεργοποιήσετε την υπηρεσία SMS Token. Στη συνέχεια μπορείτε να χρησιμοποιήσετε και το Attica Mobile με τους ίδιους κωδικούς πρόσβασης."
