title = "Προγράμματα ΕΣΠΑ 2021-2027 - Attica Bank"
description = """
Η Δράση αφορά στην ενίσχυση της επιχειρηματικότητας και ανταγωνιστικότητας υπό ίδρυση ή νέων πολύ μικρών, μικρών και μεσαίων επιχειρήσεων που δραστηριοποιούνται σε επιλεγμένους ΚΑΔ του τουρισμού.Συγχρηματοδοτείται από το Ευρωπαϊκό Ταμείο Περιφερειακής Ανάπτυξης (ΕΤΠΑ) και από το Ελληνικό Δημόσιο.Ενισχύονται αιτήσεις χρηματοδότησης ύψους από €80.000 έως €400.000.Το ποσοστό Δημόσιας Χρηματοδότησης ανέρχεται έως 45% του προϋπολογισμού της αίτησης χρηματοδότησης.
Προσαύξηση κατά:

10% εφόσον η επένδυση πραγματοποιηθεί σε απομακρυσμένη ή σεισμόπληκτη ή πυρόπληκτη ή πλημμυροπαθή περιοχή ή μικρά νησιά
επιπλέον 5% με τη δήλωση κατά την υποβολή της αίτησης χρηματοδότησης στόχου απασχόλησης τουλάχιστον 0,2 ΕΜΕ, τον πρώτο χρόνο μετά την ολοκλήρωση της επένδυσης

Η συνολική Δημόσια Δαπάνη ανέρχεται σε εκατόν εξήντα εκατομμύρια ευρώ (€160.000.000)
Επιλέξιμες Επιχειρήσεις
Υπό ίδρυση και νεοσύστατες μεσαίες, μικρές και πολύ μικρές επιχειρήσεις που αναμένεται να δραστηριοποιηθούν ή δραστηριοποιούνται στον κλάδο του τουρισμού.Ως νεοσύστατες ορίζονται οι επιχειρήσεις για τις οποίες δεν έχει παρέλθει 12μηνο συνεχούς λειτουργίας από την ημερομηνία έναρξης της επιχείρησης έως και την ημερομηνία προκήρυξης της δράσης.
Υποβολή Αιτήσεων υπαγωγής στη Δράση από Δευτέρα 18.12.2023 (15:00) έως την Παρασκευή 22.03.2024 (15:00).

Ενημερωθείτε αναλυτικά για τη δράση
Συχνές ερωτήσεις"""
