title = "Εγκρίσεις Συναλλαγών (Επιχειρήσεις) - Attica Bank"
description = "Οι εταιρικοί πελάτες (Νομικά Πρόσωπα – Επιχειρήσεις) έχουν παραπάνω από έναν χρήστες οι οποίοι έχουν διαφορετικούς, διακριτούς ρόλους ανάλογα με τα καθήκοντά τους. Οι χρήστες διακρίνονται σε…"
full_description = "Οι εταιρικοί πελάτες (Νομικά Πρόσωπα – Επιχειρήσεις) έχουν παραπάνω από έναν χρήστες οι οποίοι έχουν διαφορετικούς, διακριτούς ρόλους ανάλογα με τα καθήκοντά τους. Οι χρήστες διακρίνονται σε καταχωρητές, εγκρίνωντες, και καταχωρητές & εγκρίνωντες. Για οποιαδήποτε τροποποίηση σχετικά με τους εταιρικούς χρήστες που έχουν πρόσβαση στο Attica e-banking & Attica Mobile, είναι απαραίτητη η επικοινωνία σας με το κατάστημα διαχείρισης του χαρτοφυλακίου σας. Καταχωρητής (Maker): Ο Maker καταχωρεί εγχρήματες συναλλαγές που αποθηκεύονται στο σύστημα του Attica e-banking ως εκκρεμείς ώστε άλλος χρήστης ή χρήστες (αναλόγως του εγκριτικού σχήματος του Εταιρικού Πελάτη) με το ρόλο του Εγκρίνοντα να προχωρήσουν στην έγκριση των συναλλαγών αυτών. Μπορεί επίσης να εκτελεί και ορισμένες διαχειριστικές συναλλαγές σε σχέση με τους λογαριασμούς και τις συναλλαγές που του έχουν ανατεθεί ή σχετικές με τους κωδικούς πρόσβασης και τις ειδοποιήσεις που λαμβάνει αυτόματα από την εφαρμογή. Τέλος, μπορεί να έχει πρόσβαση σε πληροφορίες σχετικά με τα οικονομικά στοιχεία των λογαριασμών που του έχουν ανατεθεί. Εγκρίνων(Authorizer): Ο Εγκρίνων εγκρίνει τις εγχρήματες συναλλαγές που έχουν καταχωρηθεί από τον ή τους καταχωρητές του εταιρικού σχήματος. Αμέσως μόλις οι συναλλαγές εγκριθούν υποβάλλονται αυτόματα προς εκτέλεση. Μπορεί επίσης να εκτελεί ορισμένες διαχειριστικές συναλλαγές σε σχέση με τους λογαριασμούς που του έχουν ανατεθεί ή σχετικές με τους κωδικούς πρόσβασης και τις ειδοποιήσεις που λαμβάνει αυτόματα από την εφαρμογή. Τέλος μπορεί να έχει πρόσβαση σε πληροφορίες σχετικά με τα οικονομικά στοιχεία των λογαριασμών που του έχουν ανατεθεί. Καταχωρητής & Εγκρίνων (Maker & Authorizer): Ο Καταχωρητής & Εγκρίνων μπορεί και να καταχωρήσει και να εγκρίνει μια εγχρήματη συναλλαγή. Μπορεί να εκτελεί διαχειριστικές συναλλαγές σε σχέση με τους λογαριασμούς ή σχετικές με τους κωδικούς πρόσβασης και τις ειδοποιήσεις που λαμβάνει αυτόματα από την εφαρμογή. Τέλος μπορεί να έχει πρόσβαση σε πληροφορίες σχετικά με τα οικονομικά στοιχεία των λογαριασμών."
