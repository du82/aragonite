["https://www.atticabank.gr/el/digital-bank/attica-mobile/individuals-mobile/synallages-meso-e-banking-3"]
title = "Λίστα με τις διαθέσιμες συναλλαγές - Attica Bank"
description = "Οι καθημερινές τραπεζικές σας συναλλαγές γίνονται πιο εύκολες από ποτέ και με ασφάλεια. Δείτε όλες τις δυνατότητες που σας προσφέρει το Attica e-banking & Attica Mobile."
full_description = "Οι καθημερινές τραπεζικές σας συναλλαγές γίνονται πιο εύκολες από ποτέ και με ασφάλεια. Δείτε όλες τις δυνατότητες που σας προσφέρει το Attica e-banking & Attica Mobile. Διαθέσιμες συναλλαγές 1 Θέση πελάτη Δείτε σε πραγματικό χρόνο τα υπόλοιπα και τις κινήσεις των καταθετικών σας λογαριασμών, των καρτών σας, τις προθεσμιακές σας καταθέσεις, τα δάνειά σας, τις ασφάλειές σας και τα επενδυτικά σας προϊόντα. Επιπλέον, μπορείτε με πολύ εύκολο τρόπο να κατεβάσετε και να αποθηκεύσετε το ιστορικό των λογαριασμών σας σε μορφή pdf, xls και csv. 2 Μεταφορές Μπορείτε να πραγματοποιήσετε μεταφορές χρημάτων μεταξύ δικών σας λογαριασμών, προς άλλους λογαριασμούς εντός της Attica Bank και προς λογαριασμούς άλλων τραπεζών που βρίσκονται στην Ελλάδα ή στο εξωτερικό (μέσω ΔΙΑΣ). Το κόστος που επιβαρύνεστε σε κάθε εκτέλεση της συναλλαγής σας προς άλλες Τράπεζες αναγράφεται στους Ειδικούς Όρους Τραπεζικών Εργασιών της τράπεζας (δείτε στο τέλος της σελίδας το σχετικό αρχείο). 3 IRIS payments Με την υπηρεσία IRIS Payments σας δίνεται η δυνατότητα να μεταφέρετε και να λαμβάνετε χρήματα δωρεάν μέσω Attica e-banking & Attica Mobile, άμεσα σε οποιονδήποτε επιθυμείτε με ημερήσιο όριο συναλλαγών €500.Επιπλέον, μπορείτε να κάνετε πληρωμές σε επαγγελματίες με τον ΑΦΜ ή τον αριθμό κινητού τηλεφώνου τους ή απλά σκανάροντας το IRIS payments QR code τους. Ακόμη, μπορείτε να προσθέσετε τον IRIS payments QR Code σας στο ψηφιακό σας πορτοφόλι. Το μόνο που χρειάζεται να κάνει ο αποστολέας είναι να σκανάρει τον κωδικό σας μέσω του mobile app της δικής του τράπεζας, και να εκτελέσει την πληρωμή πληκτρολογώντας μόνο το ποσό. 4 Πληρωμές λογαριασμών Πληρώστε τους λογαριασμούς σας και τις οφειλές σας σε Οργανισμούς Ενέργειας, Ύδρευσης, Τηλεπικοινωνιών και ιδιωτικών Ασφαλειών και σε Δημόσιους Φορείς. Σας παρέχεται η δυνατότητα να πληρώσετε είτε επιλέγοντας τον οργανισμό από μια λίστα, είτε επιλέγοντας την πληρωμή με κωδικό RF όπου καταχωρείτε τον 25ψήφιο Κωδικό Πληρωμής που ξεκινά πάντα με τα χαρακτηριστικά γράμματα RF και περιέχει όλες τις πληροφορίες που αφορούν τον Οργανισμό ή την Εταιρεία. Το κόστος που επιβαρύνεστε σε κάθε εκτέλεση της συναλλαγής σας αναγράφεται στους Ειδικούς Όρους Τραπεζικών Εργασιών της τράπεζας (δείτε στο τέλος της σελίδας το σχετικό αρχείο). 5 Πληρωμές καρτών Έχετε τη δυνανότητα πληρωμής πιστωτικής κάρτας δικής σας ή τρίτου στην Attica Bank, όπως επίσης και οποιασδήποτε άλλης Τράπεζας επιλέγοντας να χρεώσετε τον τραπεζικό σας λογαριασμό. 6 Προπληρωμένες κάρτες H διαδικασία έκδοσης προπληρωμένης κάρτα γίνεται online, μέσω του υπολογιστή ή του κινητού σας τηλεφώνου. Ακολουθήστε τα παρακάτω βήματα: Βήμα 1ο: Ξεκινήστε επιλέγοντας «Έκδοση κάρτας» από το μενού «Συναλλαγές». Βήμα 2ο: Συμπληρώστε τα απαιτούμενα στοιχεία κάρτας, συμπεριλαμβανομένου του ποσού φόρτισης, το οποίο πρέπει να είναι μεταξύ 30,00 € και 3.000 €. Βήμα 3ο: Επιλέξτε τον τρόπο αποστολής της κάρτας και του PIN «Ταχυδρομικά στη Διεύθυνσή σας». Βήμα 4ο: Επιλέξτε το λογαριασμό που θέλετε να χρεωθεί για το ποσό φόρτισης κάρτας και τα έξοδα φόρτισης. Βήμα 5ο: Κάντε υποβολή και περιμένετε τον έλεγχο των στοιχείων σας. Στην οθόνη επιβεβαίωσης, εισάγετε τον κωδικό μιας χρήσης που θα λάβετε με SMS. Φορτίστε άμεσα και εύκολα την προπληρωμένη κάρτα σας στο μέλλον και αποκτήστε τον απόλυτο έλεγχο στις αγορές σας. 7 Πάγιες εντολές Αποκτήστε τώρα ευκολία στην εξόφληση των λογαριασμών σας μέσω της ενεργοποίησης μιας πάγιας εντολής για οποιοδήποτε οργανσιμό επιθυμείτε χωρίς κόστος για την ανάθεση της εντολής σας. Την ημερομηνία εξόφλησης του λογαριασμού σας, η πληρωμή του εκτελείται αυτόματα με χρέωση του τραπεζικού σας λογαριασμού. Το κόστος που επιβαρύνεστε σε κάθε εκτέλεση της συναλλαγής σας αναγράφεται στους Ειδικούς Όρους Τραπεζικών Εργασιών της τράπεζας (δείτε στο τέλος της σελίδας το σχετικό αρχείο). 8 Αίτηση χορήγησης καρνέ επιταγών Μέσω του Attica e-banking μπορείτε να αποστείλετε αίτηση χορήγησης καρνέ επιταγών και θα χρειαστεί να μια επίσκεψη σε κατάστημα της επιλογής σας για να το παραλάβετε. 9 Αίτηση για χρεωστική κάρτα Η διαδικασία υποβολής αίτησης για χρεωστική κάρτα έχει γίνει πιο απλή από ποτέ, καθώς μπορείτε να την ολοκληρώσετε εύκολα μέσω του υπολογιστή ή του κινητού σας. Ακολουθήστε τα παρακάτω βήματα: Βήμα 1ο: Από το μενού «Συναλλαγές» επιλέξτε «Έκδοση κάρτας» για να ξεκινήσετε την αίτηση Βήμα 2ο: Επιλέξτε το προϊόν Χρεωστικής Κάρτας που επιθυμείτε, π.χ., Attica Debit Visa. Βήμα 3ο: Επιλέξτε τους λογαριασμούς (Ταμιευτηρίου ή/και Τρεχούμενους) που θέλετε να συνδέσετε με την χρεωστική κάρτα Βήμα 4ο: Επιλέξτε τον τρόπο αποστολής της κάρτας και του PIN (Μεσω ταχυδρομείου στη διεύθυνσή σας) Βήμα 5ο: Κάντε κλικ στην επιλογή «Υποβολή» και εισάγετε τον κωδικό μιας χρήσης που θα λάβετε μέσω SMS 10 Συναλλαγές POS Σε περίπτωση που έχετε στην κατοχή σας τερματικό/ά POS μπορείτε να δείτε και να αποθηκεύσετε, αν το επιθυμείτε, το ιστορικό κινήσεων όλων των συναλλαγών που πραγματοποιήθηκαν μέσα από το ή τα POS τα οποία είναι συνδεδεμένα στον λογαριασμό σας. Μπορείτε να δείτε όλα τα είδη συναλλαγών που αφορούν σε «Αγορές», «Αγορές με Δόσεις» ή «Αγορές με Δόσεις και Προπληρωμή» και την κατάσταση της κάθε συναλλαγής που μπορεί να είναι «Επιτυχής» ή «Ανεπιτυχής». Μέχρι την ημερομηνία έκδοσης του statement, μπορείτε να δείτε όλες τις συναλλαγές σας. Επίσης μπορείτε να επιλέξετε εσείς το χρονικό διάστημα για το οποίο επιθυμείτε να δείτε τις συναλλαγές. Η προεπιλογή που έχετε διαθέσιμη αναφέρεται σε διάστημα τριών ημερών. 11 Επικαιροποίηση στοιχείων μέσω eGov-KYC Μέσω του Attica e-banking (δεν παρέχεται μέσω Attica Mobile) και με χρήση της υπηρεσίας Συστηθείτε eGov-KYC (Know Your Customer) της Ενιαίας Ψηφιακής Πύλης της Δημόσιας Διοίκησης, μπορείτε να επικαιροποιήσετε τα προσωπικά σας που έχετε δηλώσει στην Τράπεζα. Σε περίπτωση αλλαγής κάποιου προσωπικού σας στοιχείου σας όπως η εργασία σας, είτε σε περίπτωση που τα προσωπικά σας στοιχεία χρήζουν επικαιροποίησης, τότε μπορείτε μέσα από το Attica e-banking να επιλέξετε να επικαιροποιήσετε την ταυτότητά σας (Ελληνικό Αστυνομικό Δελτίο Ταυτότητας), το εισόδημα, τα στοιχεία επικοινωνίας (διεύθυνση διαμονής, διεύθυνσης επικοινωνίας, τηλέφωνο επικοινωνίας σταθερό – κινητό και e-mail) καθώς και την επαγγελματική σας δραστηριότητα (επάγγελμα, διεύθυνση εργασίας) χωρίς να απαιτείται επίσκεψη σε κατάστημα εύκολα και γρήγορα. 12 Εμφάνιση στοιχείων σας που λαμβάνετε alerts & OTPs Μέσω του Attica e-banking & Attica Mobile, μπορείτε να δείτε τα προσωπικά στοιχεία που έχετε δηλώσει στην Τράπεζα για να λαμβάνετε τους μοναδικούς κωδικούς μέσω SMS αλλά και μέσω e-mail. Εάν επιθυμείτε να μεταβάλλετε κάποιο από τα παραπάνω προσωπικά σας στοιχεία μπορείτε να το πραγματοποιήσετε online μέσω μόνο του Attica e-banking επιλέγοντας τη δυνατότητα επικαιροποίησης στοιχείων μέσω eGov-KYC."
