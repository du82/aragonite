["https://www.atticabank.gr/el/companies/business-banking/factoring"]
title = "Factoring - Attica Bank"
description = "Αναλαμβάνουμε τη διαχείριση και είσπραξη των τιμολογίων σας, ενώ ταυτόχρονα σας χρηματοδοτούμε, εξασφαλίζοντας την απαραίτητη ρευστότητα για την ανάπτυξη της επιχείρησής σας. Στην πορεία της σχέσης μας αξιολογούμε την πιστοληπτική ικανότητα των υφιστάμενων και των νέων πελατών σας και παράλληλα σας ενημερώνουμε έγκαιρα για οποιαδήποτε εξέλιξη."
full_description = "Το Factoring είναι ένα ευέλικτο χρηματοοικονομικό προϊόν στην εγχώρια αγορά, που δίνει τη δυνατότητα στην επιχείρησή σας να εκχωρήσει τις απαιτήσεις της μαζί με το λειτουργικό κόστος που τις συνοδεύει (εισπράξεις) στην Τράπεζά μας, η οποία αναλαμβάνει τη διαχείρισή τους. Επιπλέον, η Attica Bank χρηματοδοτεί τις απαιτήσεις αυτές, αξιολογεί σε συνεχή βάση τη φερεγγυότητα των χρεωστών σας και παρέχει ασφάλιση του πιστωτικού κινδύνου σε περίπτωση αδυναμίας πληρωμής τους. Συγκεκριμένα, το Factoring μπορεί να περιλαμβάνει μέρος ή και το σύνολο των πιο πάνω υπηρεσιών και μπορεί να προσαρμόζεται στις δικές σας επιχειρηματικές ανάγκες. Αναλαμβάνουμε τους ακόλουθους τύπους Factoring: Εγχώριο factoring με δικαίωμα αναγωγής Αναλαμβάνουμε τη διαχείριση και είσπραξη των τιμολογίων σας, ενώ ταυτόχρονα σας χρηματοδοτούμε, εξασφαλίζοντας την απαραίτητη ρευστότητα για την ανάπτυξη της επιχείρησής σας. Στην πορεία της σχέσης μας αξιολογούμε την πιστοληπτική ικανότητα των υφιστάμενων και των νέων πελατών σας και παράλληλα σας ενημερώνουμε έγκαιρα για οποιαδήποτε εξέλιξη. Εγχώριο factoring χωρίς δικαίωμα αναγωγής Αναλαμβάνουμε τη διαχείριση και είσπραξη των τιμολογίων σας, ενώ ταυτόχρονα σας χρηματοδοτούμε και σας εξασφαλίζουμε από ενδεχόμενη αδυναμία πληρωμής των οφειλετών σας. Σας απαλλάσσουμε από τη χρονοβόρα διαδικασία της διαχείρισης και της είσπραξης και δημιουργούμε τις κατάλληλες προϋποθέσεις για την ασφαλή ανάπτυξη της επιχείρησής σας. Προεξόφληση τιμολογίων υπο ειδικούς όρους και προϋποθέσεις Διαχειριζόμαστε τα τιμολόγιά σας και σας χρηματοδοτούμε, ωστόσο οι εισπράξεις πραγματοποιούνται από την επιχείρησή σας, η οποία λειτουργεί ως Αντιπρόσωπός μας. Συγκεκριμένα, αναλαμβάνετε την είσπραξη των αξιογράφων (ή μετρητών) και τα αποδίδετε άμεσα στην Τράπεζα. Έτσι διατηρείτε εσείς την επαφή και επικοινωνία με τους πελάτες σας και ταυτόχρονα εξασφαλίζετε την απαραίτητη ρευστότητα για την ανάπτυξη της επιχείρησής σας. Η σχέση με την Τράπεζα μπορεί είτε να γνωστοποιηθεί στους πελάτες σας (Agency factoring), είτε όχι (Εμπιστευτικό factoring). Σε ιδιαίτερες περιπτώσεις παρέχεται η δυνατότητα ασφαλιστικής κάλυψης του πιστωτικού κινδύνου. Εγχώριο factoring μόνο για διαχείρηση απαιτήσεων Αναλαμβάνουμε τη διαχείριση και είσπραξη των τιμολογίων σας, απελευθερώνοντάς σας από τη χρονοβόρα διαδικασία των εισπράξεων και της λογιστικής τους παρακολούθησης, βοηθώντας σας να επικεντρωθείτε στις πωλήσεις σας. Ροή Εργασιών Στις περιπτώσεις εγχωρίου Factoring η διαδικασία που συνήθως ακολουθείται είναι η εξής: Με την πώληση των προϊόντων/υπηρεσιών μεταξύ της εταιρείας σας (Α) και των πελατών σας (Β), την έκδοση τιμολογίου και την παραλαβή των προϊόντων (1) (με την προϋπόθεση ότι η Τράπεζά μας έχει εξετάσει τη φερεγγυότητα των πελατών σας και έχει συμφωνήσει για την εκχώρηση των συγκεκριμένων τιμολογίων), μας αποστέλλετε τα αντίγραφα των τιμολογίων (2) μας ενημερώνετε για τυχόν ιδιαίτερες συμφωνίες πληρωμής. Κατόπιν ενημερώνονται και οι πελάτες σας (Β) για την εκχώρηση των τιμολογίων στην Attica Bank. Η Τράπεζά μας, μετά τον έλεγχο των τυπικών στοιχείων επί των τιμολογίων, χρηματοδοτεί την αξία των τιμολογίων (3) στο προσυμφωνημένο ποσοστό και αναλαμβάνει τη διαχείριση και την είσπραξη των συγκεκριμένων απαιτήσεων. Με το πέρας της περιόδου πίστωσης και την είσπραξη των απαιτήσεων από εμάς (4) γίνεται η τελική εκκαθάριση (5) Κατά την επανάληψη και εξέλιξη της παραπάνω διαδικασίας παρακολουθούμε τη ροή των συναλλαγών και τις εξελίξεις στον συγκεκριμένο κλάδο δραστηριοποίησης και σας ενημερώνουμε άμεσα για τη φερεγγυότητα των πελατών/χρεωστών σας ή για οποιοδήποτε άλλο πρόβλημα προκύψει. Ποια είναι τα πλεονεκτήματα Εξασφάλιση και ενίσχυση ρευστότητας σε συνεχή βάση, ανάλογα με τις πωλήσεις σας. Αποτελεσματική διαχείριση και είσπραξη των απαιτήσεων σας. Μείωση λειτουργικού κόστους διαχείρισης και είσπραξης των απαιτήσεων σας. Βελτίωση των όρων πωλήσεων και της ανταγωνιστικότητας. Άμεση εκμετάλλευση επιχειρηματικών ευκαιριών. Συνεχής προληπτικός έλεγχος πιστωτικού κινδύνου. Δημιουργία ασφαλών συνθηκών ανάπτυξης για την επιχείρησή σας (Kάλυψη πιστωτικού κινδύνου). Βελτίωση της εικόνας του ισολογισμού, στις περιπτώσεις factoring χωρίς αναγωγή. Ενημερωθείτε Επισκεφθείτε ένα κατάστημά μας. Φροντίστε να έχετε μαζί σας όλα τα απαραίτητα έγγραφα."
