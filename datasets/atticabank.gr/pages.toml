title = "Τιμολόγιο Προμηθειών - Attica Bank"
description = "Τα αναφερόμενα τιμολόγια είναι σύμφωνα με την ΠΔΤΕ 2501/31-10-2002, υπόκεινται σε περιοδική αναθεώρηση και δύνανται να εξειδικευθούν κατά περίπτωση με ειδική συμφωνία."
full_description = "Τα αναφερόμενα τιμολόγια είναι σύμφωνα με την ΠΔΤΕ 2501/31-10-2002, υπόκεινται σε περιοδική αναθεώρηση και δύνανται να εξειδικευθούν κατά περίπτωση με ειδική συμφωνία. Ορισμένες ειδικές και εξειδικευμένες εργασίες καθώς και η τιμή συναλλάγματος δεν αναφέρονται στο παρόν φυλλάδιο. Οι πελάτες παρακαλούνται να απευθύνονται στις αρμόδιες Υπηρεσίες του Καταστήματος για τους πλήρεις και λεπτομερείς όρους κάθε προϊόντος ή υπηρεσίας. Τιμολόγιο Τραπεζικών Εργασιών Προμήθειες – Έξοδα Κατεβάστε το αρχείο (972kb) Συμμετέχουσες Εταιρείες στο Dias Credit Transfer (Εντολές Πληρωμής) Κατεβάστε το αρχείο (2mb) Συμμετέχουσες Εταιρείες Dias Direct Debit Κατεβάστε το αρχείο (488kb)"
