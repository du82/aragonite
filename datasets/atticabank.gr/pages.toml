description = "Στις 15 Μαΐου 2014 η Ευρωπαϊκή Ένωση υιοθέτησε την Οδηγία 2014/65/ΕΕ (Markets in Financial Instruments Directive II – MiFID II) και τον Κανονισμό (ΕΕ) αριθ. 600/2014 (MiFIR), τα οποία…"
full_description = "Στις 15 Μαΐου 2014 η Ευρωπαϊκή Ένωση υιοθέτησε την Οδηγία 2014/65/ΕΕ (Markets in Financial Instruments Directive II – MiFID II) και τον Κανονισμό (ΕΕ) αριθ. 600/2014 (MiFIR), τα οποία, σε συνδυασμό με τις κατ’ εξουσιοδότηση αυτών πράξεις, αναφέρονται από κοινού ως «πλαίσιο MiFID II», με ισχύ από την 3η Ιανουαρίου 2018. Το πλαίσιο MiFID II αποσκοπεί στην ενίσχυση της αποτελεσματικότητας, της ανθεκτικότητας και της ακεραιότητας των χρηματοπιστωτικών αγορών, ιδίως μέσω: της επίτευξης μεγαλύτερης διαφάνειας, της προσέλκυσης περισσότερων συναλλαγών σε ρυθμιζόμενους τόπους διαπραγμάτευσης, της εκπλήρωσης των δεσμεύσεων της Ένωσης στο πλαίσιο της G20 για τα παράγωγα, της διευκόλυνσης της πρόσβασης σε κεφάλαια για τις ΜΜΕ, της ενίσχυσης της προστασίας των επενδυτών, της παρακολούθησης των τεχνολογικών εξελίξεων, της θέσπισης διατάξεων για την αμερόληπτη πρόσβαση στις υπηρεσίες συναλλαγών και ολοκλήρωσης των συναλλαγών στη διαπραγμάτευση χρηματοπιστωτικών μέσων, κυρίως για χρηματιστηριακά παράγωγα, της ενίσχυσης και εναρμόνισης των κυρώσεων καθώς και της διασφάλισης της αποτελεσματικής συνεργασίας μεταξύ των σχετικών αρμόδιων αρχών. Από τις 28 Μαρτίου 2024, τέθηκε σε ισχύ ο Κανονισμός (ΕΕ) 2024/791, ο οποίος τροποποιεί τον Κανονισμό (ΕΕ) 600/2014 (MiFIR) ’’MiFIR Review’’ και περιλαμβάνει διατάξεις για την ενίσχυση της διαφάνειας των δεδομένων, την άρση των εμποδίων στην εμφάνιση ενοποιημένων δελτίων συναλλαγών και τη βελτιστοποίηση των υποχρεώσεων διαπραγμάτευσης. Επίσης, δημοσιεύθηκε στην Επίσημη Εφημερίδα της Ευρωπαϊκής Ένωσης, η Οδηγία (ΕΕ) 2024/790, η οποία τροποποιεί την Οδηγία (ΕΕ) 2014/65/ΕΕ (MiFID II)’’MiFID review’’ και τα κράτη μέλη καλούνται να την ενσωματώσουν στο εθνική τους νομοθεσία έως την 29η Σεπτεμβρίου 2025. Προσυμβατικό Πληροφοριακό Έντυπο MIFID II Κατεβάστε το αρχείο (491kb) Η Πολιτική Σύγκρουσης Συμφερόντων Κατεβάστε το αρχείο (463kb) Η Πολιτική Βέλτιστης Εκτέλεσης Κατεβάστε το αρχείο (527kb) Αναφορά Best Execution για το έτος 2021 Κατεβάστε το αρχείο (530kb)"
year_published = 2025
