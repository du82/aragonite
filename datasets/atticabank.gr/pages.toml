title = "Ταμείο Εγγυοδοσίας ΤΕΠΙΧ ΙΙΙ - Attica Bank"
description = """
Ο προϋπολογισμός του Ταμείου ανέρχεται στο συνολικό ποσό των τριακοσίων εκατομμυρίων ευρώ (€300.000.000) κατανεμημένος ως ακολούθως:

Για το Υποταμείο «Γενική Επιχειρηματικότητα»: €230εκατ.
Για το Υποταμείο «Επιχειρηματικότητα Νεοσύστατων Επιχειρήσεων»: €30εκατ.
Ποσό ύψους €40εκατ. θα καλύψει την επιδότηση των τόκων και λοιπές αμοιβές.

Τα δάνεια που τελικά θα χορηγηθούν με τη μόχλευση μέσω του τραπεζικού συστήματος αναμένεται να ανέλθουν:

Για το Υποταμείο «Γενική Επιχειρηματικότητα» στο ποσό των €1.642,2 εκατ.
Για το Υποταμείο «Επιχειρηματικότητα Νεοσύστατων Επιχειρήσεων» στο ποσό των €150εκατ."""
full_description = "Με μια ματιά Η Δράση αφορά στη χορήγηση εγγυημένων δανείων με ευνοϊκούς όρους προς τις ελληνικές μικρομεσαίες επιχειρήσεις (ΜμΕ) για την κάλυψη αναγκών κεφαλαίου κίνησης ειδικού σκοπού (τακτής λήξης και ανακυκλούμενης πίστωσης) και δανείων επενδυτικού σκοπού, κατόπιν υποβολής επιχειρηματικού σχεδίου. Παράλληλα, το Ταμείο θα παρέχει επιδότηση επιτοκίου μέχρι ύψους 2% ή 3% (ανάλογα την Περιφέρεια) για τα πρώτα δυο έτη της χρηματοδότησης των Επιχειρήσεων που πληρούν συγκεκριμένα κριτήρια, καθώς και μηδενική προμήθεια εγγύησης. Η χρηματοδότηση παρέχεται στο πλαίσιο του «Ταμείου Εγγυοδοσίας ΤΕΠΙΧ ΙΙΙ», το οποίο διαχειρίζεται η Ελληνική Αναπτυξιακή Τράπεζα (ΕΑΤ), με πόρους που συγχρηματοδοτούνται από την Ευρωπαϊκή Ένωση και συγκεκριμένα το Ευρωπαϊκό Ταμείο Περιφερειακής Ανάπτυξης και το Ελληνικό Δημόσιο μέσω του Προγράμματος «Ανταγωνιστικότητα» του ΕΣΠΑ 2021-2027. Ταμείο Εγγυοδοσίας Το Ταμείο Εγγυοδοσίας διακρίνεται σε δύο υποπρογράμματα/υποταμεία ανάλογα με τα χαρακτηριστικά των επιλέξιμων επιχειρήσεων: Υποταμείο «Γενική Επιχειρηματικότητα» (αφορά στις ΜμΕ) Υποταμείο «Επιχειρηματικότητα Νεοσύστατων Επιχειρήσεων» (αφορά στις Πολύ Μικρές και Μικρές επιχειρήσεις έως 5 χρόνια λειτουργίας). Tα δάνεια του Υποταμείου «Γενική Επιχειρηματικότητα» θα είναι εγγυημένα από το Ταμείο σε ποσοστό 70%, ενώ τα δάνεια του Υποταμείου «Επιχειρηματικότητα Νεοσύστατων Επιχειρήσεων» θα είναι εγγυημένα από το Ταμείο σε ποσοστό 80%. Ενημερωτική Μπροσούρα Κατεβάστε το αρχείο (701kb) Βασικά χαρακτηριστικά δανείων “Ταμείο Εγγυοδοσίας ΤΕΠΙΧ ΙΙΙ” Κατεβάστε το αρχείο (250kb) Η δράση αναλυτικά Προϋπολογισμός Δράσης Ο προϋπολογισμός του Ταμείου ανέρχεται στο συνολικό ποσό των τριακοσίων εκατομμυρίων ευρώ (€300.000.000) κατανεμημένος ως ακολούθως: Για το Υποταμείο «Γενική Επιχειρηματικότητα»: €230εκατ. Για το Υποταμείο «Επιχειρηματικότητα Νεοσύστατων Επιχειρήσεων»: €30εκατ. Ποσό ύψους €40εκατ. θα καλύψει την επιδότηση των τόκων και λοιπές αμοιβές. Τα δάνεια που τελικά θα χορηγηθούν με τη μόχλευση μέσω του τραπεζικού συστήματος αναμένεται να ανέλθουν: Για το Υποταμείο «Γενική Επιχειρηματικότητα» στο ποσό των €1.642,2 εκατ. Για το Υποταμείο «Επιχειρηματικότητα Νεοσύστατων Επιχειρήσεων» στο ποσό των €150εκατ. Δικαιούχοι της Δράσης / Επιλέξιμες Επιχειρήσεις Είναι επιχειρήσεις για τις οποίες συντρέχουν αθροιστικά οι κάτωθι προϋποθέσεις (Κριτήρια Επιλεξιμότητας) κατά την ημερομηνία ηλεκτρονικής υποβολής της αίτησης χρηματοδότησης και της υπογραφής της δανειακής Σύμβασης και 1ης εκταμίευσης: Λειτουργούν νόμιμα στην Ελλάδα (συμπεριλαμβανομένων απαιτούμενων αδειών λειτουργίας-εφόσον απαιτούνται). Είναι Πολύ Μικρές, Μικρές και Μεσαίες επιχειρήσεις σύμφωνα με τον ορισμό ΜμΕ που αναγράφεται στο Παράρτημα Ι του ΕΚ 651/2014, όπως εκάστοτε ισχύει. Έχουν συσταθεί έως και τον χρόνο υποβολής της αίτησης χρηματοδότησης στην πλατφόρμα KYC. Πριν την υποβολή της Αίτησης Χρηματοδότησης στο ΟΠΣΚΕ να έχουν εγγραφεί στο Μητρώο Πραγματικών Δικαιούχων του άρθρου 20 του ν. 4557/2018 (Α΄139), ως ισχύει. Σε περίπτωση μη υποχρέωσης εγγραφής στο μητρώο Πραγματικών Δικαιούχων του άρθρου 20 του ν. 4557/2018 (Α΄139), ως ισχύει, θα προσκομίζεται σχετική τεκμηρίωση από την επιχείρηση. Δραστηριοποιούνται σε οποιονδήποτε επιλέξιμο ΚΑΔ ανάλογα με το Υποπρόγραμμα και των αντίστοιχων προϋποθέσεων που ισχύουν ανάλογα με το υποπρόγραμμα (άρθρο 22 και άρθρο 21 παρ. 3 και 18) (δείτε το αρχείο με τους επιλέξιμους ΚΑΔ εδώ). Πληρούν τις προϋποθέσεις του άρθ. 1 (Κεφάλαιο Ι) του Καν. 651/2014. Κρίνονται πιστοληπτικά αποδεκτές σύμφωνα με την ισχύουσα πιστωτική πολιτική και τις εσωτερικές διαδικασίες της Τράπεζας. Είναι τραπεζικά ενήμερες ή έχουν καθυστερημένη οφειλή μικρότερη των 90 ημερών. Είναι επιχειρήσεις για τις οποίες δεν συντρέχουν λόγοι αποκλεισμού του άρθρου 40 του νόμου 4488/17 (Α 137/139/17), όπως ισχύει. Είναι φορολογικά και ασφαλιστικά ενήμερες, τόσο κατά τον χρόνο υποβολής αίτησης εκδήλωσης ενδιαφέροντος μέσω της KYC της ΕΑΤ, όσο και κατά τον χρόνο εκταμίευσης των δανείων. Επιπλέον, δεν παρουσιάζουν στοιχεία αφερεγγυότητας, σύμφωνα με τα τηρούμενα στοιχεία της ΤΕΙΡΕΣΙΑΣ ΑΕ, τόσο κατά τον χρόνο υποβολής αίτησης εκδήλωσης ενδιαφέροντος μέσω της ΚYC της ΕΑΤ, όσο και κατά τον χρόνο εκταμίευσης των δανείων. Είναι επιχειρήσεις για τις οποίες δεν εκκρεμεί εντολή ανάκτησης προηγούμενης παράνομης και ασύμβατης κρατικής ενίσχυσης βάσει απόφασης ΕΕ ή ΔΕΕ. Δεν έχουν λάβει ενίσχυση διάσωσης ή αναδιάρθρωσης ή η επιχείρηση έχει λάβει ενίσχυση διάσωσης, αλλά έχει αποπληρώσει το δάνειο και έχει λύσει τη σύμβαση εγγύησης ή η επιχείρηση έχει λάβει ενίσχυση αναδιάρθρωσης, η οποία έχει ολοκληρωθεί. Δεν έχουν υπαχθεί σε συλλογική πτωχευτική διαδικασία και δεν πληρούν τις προϋποθέσεις του Ν.4738/2020, όπως εκάστοτε ισχύει. Δεν είναι προβληματικές επιχειρήσεις (σε επίπεδο ενιαίας/δεδομένης επιχείρησης) όπως ορίζονται στο σημείο 18 του άρθρου 2 του Καν. ΕΕ 651/2014 κατά τη στιγμή της πρώτης εκταμίευσης (εφάπαξ ολικής ή τμηματικής). Εάν έχουν ενταχθεί σε προγράμματα της ΕΑΤ (πρώην ΕΤΕΑΝ/ΤΕΜΠΜΕ) που έληξαν ή βρίσκονται σε ισχύ, δεν έχουν εμφανίσει δυσμενή συναλλακτική συμπεριφορά στην αποπληρωμή των οφειλών τους (καταγγελία δανείου ή ληξιπρόθεσμες οφειλές για διάστημα μεγαλύτερο των 90 ημερών) ή έχουν εμφανίσει δυσμενή συναλλακτική συμπεριφορά (καταγγελία δανείου) αλλά έχουν εξοφλήσει πλήρως τις οφειλές τους πριν την υποβολή της αίτησης χρηματοδότησης ή εφόσον πρόκειται για πρόγραμμα εγγυοδοσίας, δεν έχει καταβληθεί το ποσό οφειλής εγγύησης από πλευράς της ΕΑΤ, ή εφόσον έχει βεβαιωθεί η εν λόγω οφειλή στην αρμόδια Δ.Ο.Υ., αυτή έχει ενταχθεί σε καθεστώς ρύθμισης, η οποία συνεχίζει να είναι σε ισχύ κατά την ημερομηνία υποβολής της αίτησης χρηματοδότησης. Έχουν ολοκληρώσει τη διαδικασία αυτοαξιολόγησης για τα Κριτήρια ESG στο ESG Tracker της ΕΑΤ, και έχουν υποβάλλει στην Τράπεζα κατά την υποβολή της αίτησης χρηματοδότησης το ESG Tracker Performance Report (σε pdf) , όπου αποτυπώνεται η απόδοση της επιχείρησης στα κριτήρια αυτά. Εναλλακτικά, κατά την υποβολή της αίτησης χρηματοδότησης στην Τράπεζα δύνανται να υποβληθεί επιβεβαίωση για την ολοκληρωμένη υποβολή του ερωτηματολογίου αυτοαξιολόγησης στο ESG Tracker (Submission Confirmation σε μορφή pdf ή mail) με την ρητή υποχρέωση υποβολής του ESG Tracker Performance Report έως την υπογραφή της σύμβασης Δανείου. Σημειώνεται ότι τα αποτελέσματα της αυτοαξιολόγησης μέσω του ESG Tracker δεν αποτελούν κριτήρια επιλεξιμότητας του τελικού αποδέκτη, και δεν επηρεάσουν την πιστοληπτική ικανότητα της Τράπεζας. Η διαδικασία υποβολής και έκδοσης των αποτελεσμάτων παρέχεται δωρεάν από την HDB. Δεν χρησιμοποιούνται για τη χρηματοδότηση επενδυτικού σχεδίου που περιλαμβάνει ίδια ή παρεμφερή δραστηριότητα που έχει προκύψει από ή υπαχθεί σε μετεγκατάσταση κατά τα τελευταία δύο χρόνια από έδαφος άλλου συμβαλλόμενου μέρους της συμφωνίας ΕΟΧ. Για το υποταμείο «Γενική Επιχειρηματικότητα», το οποίο θα λειτουργήσει σε καθεστώς ενίσχυσης βάσει του άρθρου 21 του Καν. 651/2014, οι επιχειρήσεις, πλην των ανωτέρω, θα πρέπει επιπλέον να πληρούν τις κάτωθι προϋποθέσεις: Σε περίπτωση δανειοδότησης βάσει της παρ. 18 του άρθρου 21 του Καν. 651/2014, (επενδύσεις χρηματοδότησης επιχειρηματικού κινδύνου προς ΜμΕ που δεν πληρούν τις προϋποθέσεις της παραγράφου 3 του ίδιου άρθρου), τότε η ενίσχυση θα πρέπει να πληροί τις προϋποθέσεις του Καν. 2831/2023 για τις ενισχύσεις που χορηγούνται σε επιχειρήσεις σε όλους τους τομείς, εκτός από τις Εξαιρέσεις Δραστηριοτήτων ως κατωτέρω. Σε περίπτωση δανειοδότησης βάσει της παρ. 3 του άρθρου 21 του Καν. 651/2014, οι μη εισηγμένες ΜμΕ τη στιγμή της χρηματοδότησης θα πρέπει να πληρούν τουλάχιστον μία από τις ακόλουθες προϋποθέσεις της παρ. 3 (α) ή (β) ή (γ) του Καν. 651/2014 (σε επίπεδο «ενιαίας» επιχείρησης): (α) να μην ασκούν δραστηριότητες σε καμία αγορά ή (β) να δραστηριοποιούνται σε οποιαδήποτε αγορά για οποιοδήποτε από τα ακόλουθα: i) λιγότερο από 10 έτη μετά την καταχώρησή τους, ή ii) λιγότερο από 7 έτη μετά την πρώτη εμπορική τους πώληση. Όταν έχει εφαρμοσθεί μία από τις περιόδους επιλεξιμότητας που αναφέρονται στα σημεία (α) και (β) σε μια δεδομένη επιχείρηση (ενιαία), μόνο αυτή η περίοδος μπορεί να εφαρμόζεται και σε κάθε μεταγενέστερη ενίσχυση για χρηματοδότηση επιχειρηματικού κινδύνου προς την ίδια επιχείρηση. Για επιχειρήσεις που έχουν εξαγοράσει άλλη επιχείρηση ή έχουν συσταθεί μέσω συγχώνευσης, η περίοδος επιλεξιμότητας που εφαρμόζεται περιλαμβάνει επίσης τις δραστηριότητες της εξαγορασθείσας επιχείρησης ή των συγχωνευθεισών επιχειρήσεων, αντίστοιχα, με εξαίρεση τις εξαγορασθείσες ή συγχωνευθείσες επιχειρήσεις των οποίων ο κύκλος εργασιών αντιστοιχεί σε λιγότερο από το 10% του κύκλου εργασιών της αποκτώσας επιχείρησης κατά το οικονομικό έτος που προηγείται της εξαγοράς, ή, στην περίπτωση επιχειρήσεων που έχουν συσταθεί μέσω συγχώνευσης, λιγότερο από το 10% του συνδυασμένου κύκλου εργασιών των συγχωνευόμενων επιχειρήσεων κατά το οικονομικό έτος που προηγείται της συγχώνευσης. Για τις επιχειρήσεις που δεν υπόκειται σε καταχώριση η περίοδος επιλεξιμότητας αρχίζει από τη στιγμή που η επιχείρηση ξεκινά την οικονομική της δραστηριότητα, ή από στιγμή που καθίσταται υπόχρεη καταβολής φόρου για την οικονομική της δραστηριότητα, όποια από τις δύο χρονικές στιγμές προηγείται. ή (γ) χρειάζονται αρχική επένδυση η οποία, βάσει επιχειρηματικού σχεδίου που καταρτίζεται ενόψει μιας νέας οικονομικής δραστηριότητας, είναι υψηλότερη του 50% του μέσου ετήσιου κύκλου εργασιών τους κατά τα προηγούμενα πέντε έτη. Το όριο αυτό περιορίζεται στο 30% όσον αφορά τις ακόλουθες επενδύσεις, οι οποίες θεωρούνται αρχικές επενδύσεις σε νέα οικονομική δραστηριότητα:– επενδύσεις που βελτιώνουν σημαντικά τις περιβαλλοντικές επιπτώσεις της δραστηριότητας, σύμφωνα με το άρθρο 36 παρ. 2,– άλλες περιβαλλοντικά βιώσιμες επενδύσεις όπως ορίζονται στο άρθρο 2 σημείο 1) του Καν. (ΕΕ) 2020/852 και– επενδύσεις που αποσκοπούν στην αύξηση της ικανότητας εξόρυξης, διαχωρισμού, διύλισης, επεξεργασίας ή ανακύκλωσης κρίσιμης πρώτης ύλης που παρατίθεται στο Παράρτημα IV του Καν. 651/2014. «Αρχική επένδυση: ένα από τα ακόλουθα α) Η επένδυση σε ενσώματα και άυλα στοιχεία ενεργητικού σε σχέση με τη δημιουργία νέας επιχειρηματικής εγκατάστασης, την επέκταση της δυναμικότητας υφιστάμενης επιχειρηματικής εγκατάστασης, τη διαφοροποίηση της παραγωγής μιας επιχειρηματικής εγκατάστασης σε προϊόντα που δεν έχουν παραχθεί ποτέ σ` αυτή, ή τη θεμελιώδη αλλαγή του συνόλου της παραγωγικής διαδικασίας υφιστάμενης επιχειρηματικής εγκατάστασης, ή β) Η απόκτηση στοιχείων ενεργητικού που ανήκουν σε επιχειρηματική εγκατάσταση που έχει κλείσει ή θα είχε κλείσει αν δεν είχε αγορασθεί και η οποία αγοράζεται από επενδυτή που δεν σχετίζεται με τον πωλητή και αποκλείει την απλή εξαγορά των μετοχών μιας επιχείρησης και την επένδυση αντικατάστασης». Η Εγγύηση μπορεί επίσης να καλύπτει επενδύσεις συνέχειας που πραγματοποιούνται σε επιλέξιμες επιχειρήσεις, ακόμη και μετά την περίοδο επιλεξιμότητας που αναφέρεται στην παρ. 3 στοιχείο (β) του ΓΑΚ 651/2014, εφόσον πληρούνται οι ακόλουθες σωρευτικές προϋποθέσεις: δεν γίνεται υπέρβαση του συνολικού ποσού της χρηματοδότησης επιχειρηματικού κινδύνου που αναφέρεται στην παρ. 8 του άρθρου 21 του ΓΑΚ η δυνατότητα επενδύσεων συνέχειας είχε προβλεφθεί στο αρχικό επιχειρηματικό σχέδιο η επιχείρηση που λαμβάνει τις επενδύσεις συνέχεια δεν έχει καταστεί «συνδεδεμένη επιχείρηση», κατά την έννοια του άρθρου 3 παρ. 3 του Παραρτήματος Ι του Καν. 651/2014, με άλλη επιχείρηση εκτός από την Τράπεζα ή τον ανεξάρτητο ιδιώτη επενδυτή που παρέχει κεφάλαια χρηματοδότησης επιχειρηματικού κινδύνου στο πλαίσιο του μέτρου, εκτός εάν η νέα οντότητα είναι ΜμΕ. Για το υποταμείο «Επιχειρηματικότητα Νεοσύστατων Επιχειρήσεων», το οποίο θα λειτουργήσει σε καθεστώς ενίσχυσης βάσει του άρθρου 22 του Καν. 651/2014, οι επιχειρήσεις, επιπλέον των ανωτέρω κοινών προϋποθέσεων που αφορούν και τα δύο Υποταμεία, θα πρέπει να πληρούν σωρευτικά και τις κάτωθι προϋποθέσεις: Είναι Μικρές ή Πολύ Μικρές επιχειρήσεις σύμφωνα με τον Καν. (ΕΕ) 651/2014 της Επιτροπής της 17ης Ιουνίου 2014 για την κήρυξη ορισμένων κατηγοριών ενισχύσεων ως συμβατών με την εσωτερική αγορά κατ΄ εφαρμογή των άρθρων 107 και 108 της Συνθήκης (ΕΕ L187/1 της 26.6.2014, σ. 70), όπως εκάστοτε ισχύει. Είναι μη εισηγμένες στο χρηματιστήριο, έως και πέντε έτη μετά την καταχώρησή τους έως και την ημερομηνία καταχώρησης της αίτησης στο ΟΠΣΚΕ, που πληρούν τις κάτωθι σωρευτικές προϋποθέσεις: δεν έχουν αναλάβει τη δραστηριότητα άλλης επιχείρησης, εκτός εάν ο κύκλος εργασιών της αναληφθείσας δραστηριότητας αντιπροσωπεύει λιγότερο από το 10% του κύκλου εργασιών της επιλέξιμης επιχείρησης κατά το οικονομικό έτος που προηγείται της εξαγοράς δεν έχουν ακόμη προβεί σε διανομή κερδών δεν έχουν εξαγοράσει άλλη επιχείρηση ή δεν έχουν συσταθεί μέσω συγχώνευσης, εκτός εάν ο κύκλος εργασιών της εξαγορασθείσας επιχείρησης αντιπροσωπεύει λιγότερο από το 10% του κύκλου εργασιών της επιλέξιμης επιχείρησης κατά το οικονομικό έτος που προηγείται της εξαγοράς, ή ο κύκλος εργασιών της επιχείρησης που προέκυψε από τη συγχώνευση υπερβαίνει κατά λιγότερο από 10% τον συνολικό κύκλο εργασιών των συγχωνευόμενων επιχειρήσεων κατά το οικονομικό έτος που προηγείται της συγχώνευσης. Για τις επιλέξιμες επιχειρήσεις που δεν υπόκεινται σε καταχώριση, η πενταετής περίοδος επιλεξιμότητας αρχίζει από τη στιγμή που η επιχείρηση ξεκινά την οικονομική της δραστηριότητα ή από τη στιγμή που καθίσταται υπόχρεη καταβολής φόρου για την οικονομική της δραστηριότητα αναλόγως με το ποια από τις δύο χρονικές στιγμές προηγείται. Κατά παρέκκλιση από το στοιχείο 3) του παραπάνω εδαφίου, οι επιχειρήσεις που έχουν συσταθεί μέσω συγχώνευσης επιχειρήσεων επιλέξιμων για ενίσχυση δυνάμει του παρόντος άρθρου θεωρούνται επίσης επιλέξιμες επιχειρήσεις, έως και πέντε έτη μετά την ημερομηνία καταχώρισης της παλαιότερης από τις συγχωνευόμενες επιχειρήσεις. Οι επιχειρήσεις θα πρέπει να έχουν συσταθεί, ήτοι να διαθέτουν νομική μορφή και ΑΦΜ, ή να έχουν κάνει έναρξη σε περίπτωση ατομικής επιχείρησης, κατά την ημερομηνία υποβολής της αίτησης χρηματοδότησης στις πλατφόρμες ΚΥC και OΠΣΚΕ. Επισημαίνεται ότι: Επιτρέπεται ανά ΑΦΜ η υποβολή αίτησης χρηματοδότησης μόνο σε ένα (1) Υποταμείο. Οι επιχειρήσεις που έχουν ήδη επιλέξει Υποταμείο, αποκτούν δικαίωμα υποβολής αίτησης χρηματοδότησης σε έτερο Υποταμείο μόνο στην περίπτωση που η αίτησή τους στο Υποταμείο της αρχικής επιλογής τους απορριφθεί, ή αποσυρθεί κατόπιν σχετικού αιτήματός τους. Επιχειρήσεις ωστόσο που έχουν ήδη υποβάλει αίτηση χρηματοδότησης σε ένα από τα δύο Υποταμεία κα έχει εγκριθεί η αίτησή τους, έχουν υπογράψει δανειακή σύμβαση και εκταμιεύσει δάνειο, έχουν δικαίωμα υποβολής αίτησης σε έτερο Υποταμείο, σε μεταγενέστερο χρόνο για διαφορετικό επενδυτικό σχέδιο ή τροποποίηση/επέκταση του αρχικού επενδυτικού σχεδίου ή για κεφάλαιο κίνησης ειδικού σκοπού εφόσον δεν έχουν λάβει, υπό την προϋπόθεση ελέγχου των ορίων σώρευσης κρατικών ενισχύσεων και των ορίων του μέγιστου ύψους δανείου. Εξαιρέσεις Δραστηριοτήτων και Δαπανών, Απαγορευμένοι Τομείς Δεν είναι Επιλέξιμες οι Επιχειρήσεις, και χρηματοδοτούμ"
