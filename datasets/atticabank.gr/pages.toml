["https://www.atticabank.gr/el/companies/anaptyxiaka-programmata/programmata-ellinikis-anaptyxiakis-trapezas/tameio-engyodosias-eat-tmede"]
title = "Ταμείο Εγγυοδοσίας ΕΑΤ-ΤΜΕΔΕ - Attica Bank"
description = """
Το Πρόγραμμα αφορά στην παροχή εγγυήσεων από το Ταμείο Εγγυοδοσίας ΕΑΤ-ΤΜΕΔΕ μέσω της Ελληνικής Αναπτυξιακής Τράπεζας (HDB), προς πιστωτικά ιδρύματα, με σκοπό τη χορήγηση δανείων τακτής λήξης, προς τους Έλληνες μηχανικούς, μελετητές και κατασκευαστές της χώρας.
Τα δάνεια χορηγούνται για την κάλυψη αναγκών κεφαλαίου κίνησης με ευνοϊκούς όρους, καθώς είναι εγγυημένα σε ποσοστό 80% και με μηδενική προμήθεια εγγύησης."""
full_description = "Με μια γρήγορη ματιά Στην Attica Bank, στηρίζουμε το όραμα των μικρομεσαίων επιχειρήσεων για την εκτέλεση δημόσιων έργων. Η Attica Bank στην έμπρακτη προσπάθειά της να συμβάλλει δυναμικά στην επανεκκίνηση της οικονομίας και επιδιώκοντας την ουσιαστική ενίσχυση της ρευστότητας των επιχειρήσεων του κατασκευαστικού και μελετητικού τομέα, αξιοποιεί όλα τα διαθέσιμα εργαλεία χρηματοδοτικής στήριξης, με τη συμμετοχή της στο Ταμείο Εγγυοδοσίας ΕΑΤ – ΤΜΕΔΕ. Η υποστηριζόμενη χρηματοδότηση πραγματοποιείται με την εγγύηση που παρέχεται από το Ταμείο Εγγυοδοσίας ΕΑΤ-ΤΜΕΔΕ της ΕΑΤ, που συγχρηματοδοτείται από το Ελληνικό Δημόσιο και το ΤΜΕΔΕ. Ο στόχος του προγράμματος Τι αφορά Το Πρόγραμμα αφορά στην παροχή εγγυήσεων από το Ταμείο Εγγυοδοσίας ΕΑΤ-ΤΜΕΔΕ μέσω της Ελληνικής Αναπτυξιακής Τράπεζας (HDB), προς πιστωτικά ιδρύματα, με σκοπό τη χορήγηση δανείων τακτής λήξης, προς τους Έλληνες μηχανικούς, μελετητές και κατασκευαστές της χώρας. Τα δάνεια χορηγούνται για την κάλυψη αναγκών κεφαλαίου κίνησης με ευνοϊκούς όρους, καθώς είναι εγγυημένα σε ποσοστό 80% και με μηδενική προμήθεια εγγύησης. Τι είναι το Ταμείο Εγγυοδοσίας ΕΑΤ – ΤΜΕΔΕ Λειτουργεί ως χρηματοοικονομικό εργαλείο, το οποίο έχει δημιουργηθεί με κεφάλαια του Ελληνικού Δημοσίου κατά 70% και του Ταμείου Μηχανικών Εργοληπτών Δημοσίων Έργων (ΤΜΕΔΕ) κατά 30%. Διαχειριστής του Ταμείου είναι η Ελληνική Αναπτυξιακή Τράπεζα (HDB). Προϋπολογισμός Δράσης: ο προϋπολογισμός του Ταμείου ανέρχεται σε 28.000.000- ευρώ, προερχόμενων από α) συνεισφορά κεφαλαίων του Προγράμματος Δημοσίων Επενδύσεων προς την ΕΑΤ ΑΕ ύψους 19.600.000 ευρώ και β) κεφάλαια του Ταμείου Μηχανικών Εργοληπτών Δημοσίων Έργων (ΤΜΕΔΕ) ύψους 8.400.000 ευρώ. Επιπρόσθετα χρηματοδοτική συνεισφορά πόρων έως 1.800.000 ευρώ μέσω του Προγράμματος Δημοσίων Επενδύσεων, θα καλύψει την επιχορήγηση προς τους δανειολήπτες της προμήθειας για την παροχή εγγύησης. Στοιχεία δανείων Περιγραφή βασικών χαρακτηριστικών Δανείων Ταμείου Εγγυοδοσίας ΕΑΤ-ΤΜΕΔΕ της ΕΑΤ Επιλέξιμα δάνεια Χορήγηση ΝΕΩΝ δανείων Σκοπός η κάλυψη αναγκών Κεφαλαίου Κίνησης Εκταμίευση δανείων μέχρι την 31.12.2025 Δάνεια τακτής λήξης, με διάρκεια από ένα (1) έως πέντε (5) έτη (συμπεριλαμβανομένης τυχόν περιόδου χάριτος). Απαγορεύεται η αναχρηματοδότηση/αποπληρωμή υφιστάμενων δανείων και πιστωτικών γραμμών, η χρηματοδότηση προγράμματος καταβολής μερισμάτων ή αγοράς μετοχών, η χρηματοδότηση Εξαγορών και Συγχωνεύσεων. Δικαιούχοι δράσης / Επιλέξιμες επιχειρήσεις Όλες οι επιχειρήσεις (ήτοι κάθε οντότητα, ανεξάρτητα από τη νομική της μορφή-συμπεριλαμβανομένων αυτοαπασχολούμενων και οικογενειακών επιχειρήσεων, που ασκεί οικονομική δραστηριότητα) και λειτουργούν νόμιμα στην Ελλάδα, οι οποίες, Είναι μικρομεσαίες επιχειρήσεις (ορισμός ΜΜΕ_Παράρτημα Ι του ΕΚ 651/2014), Επιθυμούν να αναλάβουν ή έχουν αναλάβει την εκτέλεση έργου ή/και μελέτης δημοσίου συμφέροντος ανεξαρτήτως σταδίου εκτέλεσης του έργου ή της μελέτης, Δραστηριοποιούνται στους κάτωθι κλάδους: δραστηριότητες αρχιτεκτόνων και μηχανικών και συναφείς δραστηριότητες παροχής τεχνικών συμβούλων ( ΚΑΔ 71.1), εκτός του «Υπηρεσίες μελετών και επιβλέψεων ναυπηγού μηχανικού» (ΚΑΔ 71.12.19.12) τεχνικές δοκιμές και αναλύσεις ( ΚΑΔ 71.2), εκτός του «Υπηρεσίες επιθεώρησης και άλλων δοκιμών πλοίων» (ΚΑΔ 71.20.19.05) κατασκευές κτιρίων (ΚΑΔ 41) «Έρευνα και πειραματική ανάπτυξη στις φυσικές επιστήμες και τη μηχανική» (ΚΑΔ 72.1), εξειδικευμένες κατασκευαστικές δραστηριότητες ( ΚΑΔ 43), εκτός των κάτωθι ΚΑΔ: «Υπηρεσίες εγκατάστασης συστημάτων συναγερμού (πυρκαγιάς, αντικλεπτικών, κ.λπ.) σε ακίνητα» (ΚΑΔ 43.21.10.05) «Υπηρεσίες εγκατάστασης καλωδιώσεων τηλεπικοινωνιών και δικτύων» (ΚΑΔ 43.21.10.06) «Υπηρεσίες επισκευής και συντήρησης ανελκυστήρων» (ΚΑΔ 43.29.19.02) «Υπηρεσίες επισκευής και συντήρησης κυλιόμενων κλιμάκων και κυλιόμενων πεζοδρομίων» (ΚΑΔ 43.29.19.03) «Υπηρεσίες εγκατάστασης ανελκυστήρων, κυλιόμενων κλιμάκων και κυλιόμενων πεζοδρομίων» (ΚΑΔ 43.29.19.04) «Υπηρεσίες εγκατάστασης, επισκευής και συντήρησης περιστρεφόμενων και αυτόματων πορτών» (ΚΑΔ 43.29.19.05) «Υπηρεσίες πλαστικής επικάλυψης δεξαμενών κολυμβητηρίων, κ.λπ.» (ΚΑΔ 43.99.90.08) Δεν ασκούν Μη Επιλέξιμη Δραστηριότητα, Έχουν συσταθεί έως και το χρόνο υποβολής της αίτησης χρηματοδότησης την Τράπεζα, Δεν είναι προβληματική επιχείρηση (κατά την έννοια του άρθρου 1 παρ. 4 και του άρθρου 2, σημείο (18) του Κανονισμού (ΕΕ) 651/2014 σε επίπεδο ενιαίας /δεδομένης επιχείρησης) κατά τη στιγμή χορήγησης της ενίσχυσης, Πληρούν τις προϋποθέσεις του άρθρου 1 (Κεφάλαιο Ι) του ΓΑΚ και των αντίστοιχων προϋποθέσεων που ισχύουν στο άρθρο 21, παρ. 18 και δεν εξαιρούνται σύμφωνα με τον Καν. (ΕΕ) 2831/2023 De Minimis, Δεν έχουν λάβει σε επίπεδο «ενιαίας/δεδομένης» επιχείρησης στο πλαίσιο του Καν. (ΕΕ) 2831/2023 σύνολο ενισχύσεων De minimis που υπερβαίνει τις 300.000 ευρώ, εντός οποιαδήποτε περιόδου τριών (3) ετών (κυλιόμενη βάση), Κρίνονται πιστοληπτικά αποδεκτές σύμφωνα με την ισχύουσα πιστωτική πολιτική και τις εσωτερικές διαδικασίες των πιστωτικών ιδρυμάτων, Είναι τραπεζικά ενήμερες (έχουν οφειλή < 90 ημερών) κατά τον χρόνο υποβολής του αιτήματος χρηματοδότησης, Επιχειρήσεις για τις οποίες δεν συντρέχουν λόγοι αποκλεισμού του άρθρου 40 του νόμου 4488/17 (Α 137/139/17), όπως ισχύει, Επιχειρήσεις για τις οποίες δεν εκκρεμεί εντολή ανάκτησης προηγούμενης παράνομης και ασύμβατης κρατικής ενίσχυσης βάση απόφασης ΕΕ ή ΔΕΕ, Επιχειρήσεις που δεν έχουν υπαχθεί σε συλλογική διαδικασία αφερεγγυότητας ούτε πληρούν τις προϋποθέσεις με βάση την εγχώρια νομοθεσία στην οποία υπόκειται για να υπαχθούν σε συλλογική διαδικασία αφερεγγυότητας κατόπιν αιτήσεων των δανειστών τους, Εάν έχουν ενταχθεί σε προγράμματα της ΕΑΤ (πρώην ΕΤΕΑΝ) που έληξαν ή βρίσκονται σε ισχύ δεν έχουν εμφανίσει δυσμενή συναλλακτική συμπεριφορά στην αποπληρωμή των οφειλών τους (καταγγελία δανείου ή ληξιπρόθεσμες οφειλές για διάστημα μεγαλύτερο των 90 ημερών) ή έχουν εμφανίσει δυσμενή συναλλακτική συμπεριφορά (καταγγελία δανείου) αλλά έχουν εξοφλήσει πλήρως τις οφειλές τους πριν την υποβολή της αίτησης χρηματοδότησης ή εφόσον πρόκειται για πρόγραμμα εγγυοδοσίας, δεν έχει καταβληθεί το ποσό οφειλής εγγύησης από πλευράς της ΕΑΤ, ή εφόσον έχει βεβαιωθεί η εν λόγω οφειλή στην αρμόδια Δ.Ο.Υ., αυτή έχει ενταχθεί σε καθεστώς ρύθμισης, η οποία συνεχίζει να είναι σε ισχύ κατά την ημερομηνία υποβολής της αίτησης χρηματοδότησης. Δεν έχουν λάβει σε επίπεδο “ενιαίας” επιχείρησης σύνολο ενισχύσεων De minimis εντός περιόδου τριών οικονομικών ετών που υπερβαίνει τα όρια σώρευσης όπως αυτά καθορίζονται στον Καν. (ΕΕ) 1407/2013 Εξαιρέσεις δραστηριοτήτων (Μη επιλέξιμη Δραστηριότητα): Κλάδος των οπλικών συστημάτων (παραγωγή και εμπορία όπλων και πυρομαχικών οποιοδήποτε είδους). Αυτός ο περιορισμός δεν ισχύει στο βαθμό που τέτοιες δραστηριότητες αποτελούν μέρος ή παρεπόμενες σε ρητές πολιτικές της Ευρωπαϊκής Ένωσης και του Ελληνικού Κράτους. Επιχειρήσεις Καπνού (παρασκευή, επεξεργασία και εμπορία καπνού και προϊόντων καπνού και προϊόντων καπνού). Γενετικά μεταλλαγμένα τρόφιμα Παράνομες δραστηριότητες (παραγωγή, εμπόριο ή άλλη δραστηριότητα) σύμφωνα με την ελληνική και κοινοτική νομοθεσία, όπως ισχύει («Παράνομη Οικονομική Δραστηριότητα»).Η ανθρώπινη κλωνοποίηση για αναπαραγωγικούς σκοπούς θεωρείται παράνομη οικονομική δραστηριότητα. Παροπλισμός ή κατασκευή πυρηνικών σταθμών ηλεκτροπαραγωγής. Κρατική ενίσχυση επιχορήγησης προμήθειας εγγύησης Οι εγγυήσεις του Ταμείου Εγγυοδοσίας ΕΑΤ-ΤΜΕΔΕ παρέχονται με μηδενική προμήθεια εγγυοδοσίας, με την επιφύλαξη των κανόνων Κρατικών Ενισχύσεων. Η μηδενική προμήθεια εγγυοδοσίας συνεπάγεται την παροχή ενίσχυσης προς την επιχείρηση υπό τη μορφή του Ακαθάριστου Ισοδύναμου Επιχορήγησης (ΑΙΕ). Το καθεστώς κρατικών ενισχύσεων που εμπίπτει το Ταμείο Εγγυοδοσίας ΕΑΤ-ΤΜΕΔΕ από 01/07/2024 είναι ο Γενικός Απαλλακτικός Κανονισμός (ΕΕ) 651/2014 και ειδικότερα το άρθρο 21 παρ. 18, αντί του μέχρι πρότινος Κανονισμού (ΕΕ) 1407/2013 de minimis που ολοκληρώθηκε στις 30/06/2024. Παράλληλα με τις διατάξεις της παρ. 18 του άρθρου 21 του Καν. 651/2014 θα εφαρμόζονται και οι διατάξεις του Καν. (ΕΕ) 2831/2023 ενισχύσεων ήσσονος σημασίας (de minimis). Για επιχειρήσεις των επιλέξιμων κλάδων βάσει των Κανονισμών ΓΑΚ και De minimis και για αιτήσεις υποβληθείσες στο Πληροφοριακό Σύστημα Κρατικών Ενισχύσεων (ΠΣΚΕ)_από 01/07/2024 και έως τη λήξη της περιόδου επιλεξιμότητας, ισχύουν τα όρια σώρευσης του νέου Κανονισμού De minimis (Kαν. ΕΕ 2831/2013). Για επιχειρήσεις που δραστηριοποιούνται σε περισσότερους του ενός τομείς στους οποίους ισχύουν διαφορετικά μέγιστα ποσά, θα διασφαλίζεται με κατάλληλα μέσα όπως ο λογιστικός διαχωρισμός, ότι για καθεμία από τις δραστηριότητες αυτές τηρείται το σχετικό ανώτατο όριο. Απαγορεύεται η σώρευση ενισχύσεων ήσσονος σημασίας με άλλες κρατικές ενισχύσεις για τις ίδιες επιλέξιμες δαπάνες ή με κρατικές ενισχύσεις για το ίδιο μέτρο χρηματοδότησης υψηλού κινδύνου, αν η σώρευση αυτή οδηγεί σε υπέρβαση της υψηλότερης σχετικής έντασης ενίσχυσης ή του ποσού ενίσχυσης που έχει καθοριστεί με βάση τα συγκεκριμένα δεδομένα κάθε περίπτωσης σε κανονισμό απαλλαγής κατά κατηγορία ή απόφαση που έχει εκδώσει η Ευρωπαϊκή Επιτροπή. Οι ενισχύσεις ήσσονος σημασίας οι οποίες δεν χορηγούνται για συγκεκριμένες επιλέξιμες δαπάνες ή δεν μπορούν να αποδοθούν σε συγκεκριμένες επιλέξιμες δαπάνες μπορούν να σωρεύονται με άλλες κρατικές ενισχύσεις που χορηγούνται βάσει κανονισμού απαλλαγής κατά κατηγορία ή απόφασης που έχει εκδώσει η Ευρωπαϊκή Επιτροπή. Υποβολή αιτήσεων Οι ενδιαφερόμενοι υποβάλλουν το αίτημά τους στον ηλεκτρονικό σύνδεσμο https://www.ependyseis.gr/, επιλέγοντας την Attica Bank ως την Τράπεζα από την οποία επιθυμούν να χρηματοδοτηθούν. Περισσότερες πληροφορίες για τους όρους και τις προϋποθέσεις του προγράμματος, διατίθενται μέσω των καταστημάτων της Attica Bank και της τηλεφωνικής εξυπηρέτησης πελατών, καλώντας στο 210 3669000. Η εγγύηση παρέχεται από το Ταμείο Εγγυοδοσίας ΕΑΤ – ΤΜΕΔΕ της ΕΑΤ, που συγχρηματοδοτείται από το Ελληνικό Δημόσιο και το ΤΜΕΔΕ"
