title = "Κωδικοί μιας χρήσης (OTPs) μέσω SMS - Attica Bank"
description = "H Attica Bank, αξιοποιώντας σύγχρονες τεχνολογίες, σας παρέχει τη δυνατότητα να πραγματοποιείτε τις συναλλαγές σας μέσω των ψηφιακών καναλιών Attica e-banking και Attica Mobile εύκολα…"
full_description = "H Attica Bank, αξιοποιώντας σύγχρονες τεχνολογίες, σας παρέχει τη δυνατότητα να πραγματοποιείτε τις συναλλαγές σας μέσω των ψηφιακών καναλιών Attica e-banking και Attica Mobile εύκολα, γρήγορα και με ασφάλεια, με την εισαγωγή ενός Κωδικού Μιας Χρήσης που αποστέλλεται με γραπτό μήνυμα SMS στο κινητό σας τηλέφωνο (SMS Token). Αναλυτικές οδηγίες Η αποστολή κωδικών μιας χρήσης μέσω SMS πραγματοποιείται στο κινητό σας τηλέφωνο που έχετε ήδη δηλώσει στην Τράπεζα. Στην περίπτωση που δεν έχετε δηλώσει τον αριθμό του κινητού σας τηλεφώνου στην Τράπεζα ή επιθυμείτε να τον αλλάξετε, θα πρέπει να απευθυνθείτε στο κοντινότερο κατάστημα της Attica Bank για να ενημερώσετε τα στοιχεία σας. Κατά την επίσκεψή σας βεβαιωθείτε ότι έχετε δηλώσει στην Τράπεζα και το προσωπικό σας e-mail, το οποίο είναι απαραίτητο για να έχετε δυνατότητα εκτέλεσης συναλλαγών μέσω των ψηφιακών υπηρεσιών. Η ενεργοποίηση της υπηρεσίας γίνεται από εσάς στην πρώτη σας είσοδο στο Attica e-banking αφού ολοκληρώσετε την online εγγραφή σας στις ψηφιακές υπηρεσίες. Κάθε φορά που εκτελείτε μια συναλλαγή, ο κωδικός μιας χρήσης που λαμβάνετε στο κινητό σας τηλέφωνο μέσω SMS έχει ισχύ για 2 λεπτά και αντιστοιχεί σε μια και μοναδική συναλλαγή."
