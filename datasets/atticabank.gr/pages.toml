title = "Όμιλος - Attica Bank"
full_description = "Πώς μπορούμε να βοηθήσουμε; Όμιλος Attica Bank, η Ιστορία μας Διοικητικό Συμβούλιο Εταιρική Διακυβέρνηση Κανονιστική Συμμόρφωση Οικονομικά Στοιχεία Εταιρική Υπευθυνότητα Τελευταία Νέα 20-12-2024 Attica Bank: Καταργεί χρεώσεις σε περισσότερες τραπεζικές συναλλαγές, πέραν των κυβερνητικών ανακοινώσεων 05-03-2025 AtticaWealth: Διαχείριση περιουσίας των πελατών από επαγγελματίες με κύρος σε παγκόσμιο επίπεδο 26-02-2025 Ανακοίνωση – Αλλαγή Έδρας Τράπεζας 26-02-2025 Ανακοίνωση – Συγκρότηση νέου Διοικητικού Συμβουλίου σε Σώμα. Σύνθεση Επιτροπών Δ.Σ. 26-02-2025 Ανακοίνωση – Αποφάσεις της Έκτακτης Γενικής Συνέλευσης των μετόχων της Attica Bank Ανώνυμη Τραπεζική Εταιρεία Όλες οι ανακοινώσεις Στοιχεία Μετοχής Γενικά στοιχεία μετοχής & τρέχουσα τιμή μετοχής Ανάλυση γενικών στοιχείων μετοχής και ενημέρωση για την τρέχουσα τιμή μετοχής. Μάθετε περισσότερα για την εταιρεία και την αξία των μετοχών της Περισσότερα Ανθρώπινο δυναμικό, γιατί να επιλέξετε την Attica Bank Οι άνθρωποί μας είναι η κινητήριος δύναμη ανάπτυξης και επιτυχίας σε κάθε στόχο που θέτουμε Περισσότερα Διαθέσιμες θέσεις εργασίας Επενδύουμε στους ανθρώπους μας και διασφαλίζουμε άριστες συνθήκες εργασίας και ίσες ευκαιρίες για εξέλιξη. Δείτε τις θέσεις εργασίας"
