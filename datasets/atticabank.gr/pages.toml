["https://www.atticabank.gr/el/neos-pelatis"]
title = "Ανοίξτε λογαριασμό σε ένα κατάστημα της Attica Bank! - Attica Bank"
full_description = "Γίνετε πελάτης μας Θα χαρούμε να σας συναντήσουμε και να συζητήσουμε όλες τις ανάγκες σας, από τις πιο μικρές και τις πιο απλές έως τις πιο μεγάλες και τις πιο σύνθετες. Σκοπός μας είναι οι υπηρεσίες και τα προϊόντα μας να διευκολύνουν την καθημερινότητά σας αλλά και να σας βοηθήσουν να υλοποιήσετε τα μελλοντικά σας σχέδια. Επισκεφθείτε ένα κατάστημά μας, όποτε εσείς το επιθυμείτε, για να ανοίξουμε άμεσα τον πρώτο σας λογαριασμό, συνδέοντάς τον με τη χρεωστική κάρτα Visa Debit και με τις ψηφιακές μας υπηρεσίες Attica e-banking & Attica Mobile. Τι δικαιολογητικά χρειάζεται να μας προσκομίσετε Κατά την επίσκεψή σας σε ένα κατάστημα Attica Bank, θα χρειαστεί να μας προσκομίσετε τα απαραίτητα δικαιολογητικά που θα δείτε εδώ και τα οποία πιστοποιούν τα προσωπικά σας στοιχεία. Εάν είστε Έλληνας και μόνιμος κάτοικος Ελλάδας, φυσικό πρόσωπο, μισθωτός ιδιωτικού ή δημοσίου τομέα, ελεύθερος επαγγελματίας ή ατομική επιχείρηση, τότε έχετε την επιλογή να πιστοποιήσετε τα προσωπικά σας στοιχεία μέσω της υπηρεσίας eGOV-KYC. Θα χρειαστεί να έχετε μαζί σας τους κωδικούς σας TAXISnet και το Δελτίο της Αστυνομικής σας Ταυτότητας. Ενημερωθείτε για τα καταστήματά μας και επισκεφθείτε μας για να συζητήσουμε τις ανάγκες σας Συμπληρώστε τη φόρμα με τα στοιχεία σας και θα επικοινωνήσουμε εμείς μαζί σας Δείτε όλα τα δικαιολογητικά που χρειάζεται να μας προσκομίσετε για να ανοίξουμε τον λογαριασμό σας"
