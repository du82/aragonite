["https://www.atticabank.gr/el/companies/anaptyxiaka-programmata/programmata-ellinikis-anaptyxiakis-trapezas/tameio-synchrimatodotisis-daneia-refstotitas-epicheiriseon"]
title = "Ταμείο Συγχρηματοδότησης «Δάνεια Ρευστότητας Επιχειρήσεων» - Attica Bank"
description = """
Η δράση αφορά στη χορήγηση νέων δανείων με ευνοϊκούς όρους προς ΜμΕ επιχειρήσεις (υφιστάμενες και νεοσυσταθείσες), με σκοπό τη στήριξη των μικρομεσαίων επιχειρήσεων. Συγκεκριμένα η δράση αφορά στη χορήγηση δανείων με  συνεπένδυση κεφαλαίων της Τράπεζας και του Ταμείου Συγχρηματοδότησης το οποίο διαχειρίζεται η ΕΑΤ Α.Ε., σε αναλογία 1,5:1 (ή 60% : 40% αντίστοιχα).
Τα δάνεια ύψους μέχρι και €1.500.000 χορηγούνται ως κεφάλαια κίνησης, με προνομιακό επιτόκιο καθώς εφαρμόζεται μηδενικό επιτόκιο για το 40% του δανείου που προέρχεται από τα κεφάλαια του Ταμείου, ενώ για το  επιτόκιο που επιβάλλει η Τράπεζα στα κεφάλαια που εισφέρει σε έκαστο δάνειο (ήτοι το 60%):

μείωση περιθωρίου επιτοκίου τουλάχιστον κατά 25 μονάδες βάσης, σε σχέση με αντίστοιχη χρηματοδότησης χωρίς ενίσχυση από δημόσιους πόρους,
διετή επιδότηση επιτοκίου ύψους 3% στις ΜμΕ που δεν έχουν λάβει χρηματοδότηση από άλλο πρόγραμμα της ΕΑΤ."""
full_description = "Με μια γρήγορη ματιά Η Attica Bank επεκτείνει την υφιστάμενη συνεργασία της με την Ελληνική Αναπτυξιακή Τράπεζα (ΕΑΤ), μέσω της συμμετοχής της στο Ταμείο Συγχρηματοδότησης «Δάνεια Ρευστότητας Επιχειρήσεων (Liquidity Co–Financing Loans») του Ταμείου «Business Growth Fund». Η υποστηριζόμενη χρηματοδότηση πραγματοποιείται από το Ταμείο Ρευστότητας Επιχειρήσεων «Liquidity Co-Financing Loans» που διαχειρίζεται η Ελληνική Αναπτυξιακή Τράπεζα Α.Ε. (ΕΑΤ) με πόρους που χρηματοδοτούνται από το Ελληνικό Δημόσιο μέσω του Προγράμματος Δημοσίων Επενδύσεων και την Ευρωπαϊκή Τράπεζα Επενδύσεων. Η Τράπεζα μέσω της εν λόγω δράσης θα συμβάλλει ουσιαστικά στη στήριξη της ελληνικής ιδιωτικής επιχειρηματικότητας στη χώρα μας, διευκολύνοντας την πρόσβαση των μικρομεσαίων επιχειρήσεων σε δανειακά κεφάλαια για την κάλυψη των αναγκών τους σε ρευστότητα (χορήγηση κεφαλαίου κίνησης) με ευνοϊκούς όρους. Μέσω του εν λόγω χρηματοδοτικού εργαλείου, οι επιχειρήσεις θα επωφεληθούν άτοκης χρηματοδότησης για το 40% του δανείου. Επιπλέον, οι επιχειρήσεις που δεν έχουν ενισχυθεί από έτερο πρόγραμμα της ΕΑΤ, θα λάβουν διετή επιδότηση μέρους του επιτοκίου που εφαρμόζεται στο υπόλοιπο 60% του δανείου, ύψους 3% σταθερό. Ο στόχος του προγράμματος Τι αφορά Η δράση αφορά στη χορήγηση νέων δανείων με ευνοϊκούς όρους προς ΜμΕ επιχειρήσεις (υφιστάμενες και νεοσυσταθείσες), με σκοπό τη στήριξη των μικρομεσαίων επιχειρήσεων. Συγκεκριμένα η δράση αφορά στη χορήγηση δανείων με συνεπένδυση κεφαλαίων της Τράπεζας και του Ταμείου Συγχρηματοδότησης το οποίο διαχειρίζεται η ΕΑΤ Α.Ε., σε αναλογία 1,5:1 (ή 60% : 40% αντίστοιχα). Τα δάνεια ύψους μέχρι και €1.500.000 χορηγούνται ως κεφάλαια κίνησης, με προνομιακό επιτόκιο καθώς εφαρμόζεται μηδενικό επιτόκιο για το 40% του δανείου που προέρχεται από τα κεφάλαια του Ταμείου, ενώ για το επιτόκιο που επιβάλλει η Τράπεζα στα κεφάλαια που εισφέρει σε έκαστο δάνειο (ήτοι το 60%): μείωση περιθωρίου επιτοκίου τουλάχιστον κατά 25 μονάδες βάσης, σε σχέση με αντίστοιχη χρηματοδότησης χωρίς ενίσχυση από δημόσιους πόρους, διετή επιδότηση επιτοκίου ύψους 3% στις ΜμΕ που δεν έχουν λάβει χρηματοδότηση από άλλο πρόγραμμα της ΕΑΤ. Προϋπολογισμός δράσης Ο συνολικός προϋπολογισμός ανέρχεται στο ποσό των €302.000.000 και χρηματοδοτείται από το Πρόγραμμα Δημοσίων Επενδύσεων (ποσό €155.000.000) και την Ευρωπαϊκή Τράπεζα Επενδύσεων (ΕΤΕπ) βάσει της υπ΄αριθμ. 92.378/22.06.2021 Συμφωνίας Χρηματοδότησης μεταξύ της Ελληνικής Δημοκρατίας και της ΕΤΕπ (ποσό €147.000.000). Ποσό €8.000.000 προερχόμενα από το Πρόγραμμα Δημοσίων Επενδύσεων θα διατεθούν για την επιδότηση του επιτοκίου. Με τη μόχλευση αναμένεται η χορήγηση δανείων συνολικής αξίας €735.000.000. Βασικά χαρακτηριστικά δανείων Περιγραφή βασικών χαρακτηριστικών Δανείων Ρευστότητας Επιχειρήσεων Δικαιούχοι δράσης / επιλέξιμες επιχειρήσεις Είναι επιχειρήσεις για τις οποίες συντρέχουν αθροιστικά οι κάτωθι προϋποθέσεις, Είναι Πολύ Μικρές, Μικρές και Μεσαίες (ΜμΕ) επιχειρήσεις (ορισμός ΜμΕ_Παράρτημα Ι του ΕΚ 651/2014, όπως εκάστοτε ισχύει), που λειτουργούν νόμιμα στην Ελλάδα, εκτός των εξωχώριων, των εταιριών συμμετοχών σε άλλες εταιρίες, των επιχειρήσεων του χρηματοπιστωτικού τομέα, των δημοσίων φορέων και των θυγατρικών τους, των ΟΤΑ και των θυγατρικών τους. Διατηρούν εγκατάσταση και λειτουργούν νόμιμα στην Ελλάδα και έχουν συσταθεί έως και τον χρόνο υποβολής της αίτησης χρηματοδότησης στην Τράπεζα. Δεν θεωρούνται προβληματικές επιχειρήσεις. Κρίνονται πιστοληπτικά αποδεκτές σύμφωνα με την ισχύουσα πιστωτική πολιτική και τις εσωτερικές διαδικασίες της Τράπεζας. Δεν έχουν υπαχθεί σε Καθεστώς Αφερεγγυότητας. Δεν παρουσιάζουν ληξιπρόθεσμη οφειλή μεγαλύτερη των 90 ημερών κατά την ημερομηνία της αίτησης χρηματοδότησης. Δεν συντρέχουν λόγοι αποκλεισμού του άρθρου 40 του νόμου 4488/17 (Α 137/139/17), όπως ισχύει. Δεν εκκρεμεί εντολή ανάκτησης προηγούμενης παράνομης και ασύμβατης κρατικής ενίσχυσης βάση απόφασης ΕΕ ή ΔΕΕ. Δεν έχουν λάβει ενίσχυση διάσωσης ή αναδιάρθρωσης, ή η επιχείρηση έχει λάβει ενίσχυση διάσωσης, αλλά έχει αποπληρώσει το δάνειο και έχει λύσει τη σύμβαση εγγύησης ή η επιχείρηση έχει λάβει ενίσχυση αναδιάρθρωσης, η οποία έχει ολοκληρωθεί. Εάν έχουν ενταχθεί σε προγράμματα της ΕΑΤ (πρώην ΕΤΕΑΝ), τα οποία ολοκληρώθηκαν ή βρίσκονται σε ισχύ και δεν έχουν εμφανίσει δυσμενή συναλλακτική συμπεριφορά στην αποπληρωμή των οφειλών τους (καταγγελία δανείου ή ληξιπρόθεσμες οφειλές για διάστημα μεγαλύτερο των ενενήντα (90) ημερών) ή στην περίπτωση όπου έχουν εμφανίσει δυσμενή συναλλακτική συμπεριφορά (καταγγελία δανείου ή ληξιπρόθεσμες οφειλές για διάστημα μεγαλύτερο των ενενήντα (90) ημερών), έχουν εξοφλήσει πλήρως τις οφειλές του πριν την υποβολή της αίτησης χρηματοδότησης ή εφόσον πρόκειται για πρόγραμμα εγγυοδοσίας, δεν έχει καταβληθεί το ποσό εγγύησης από πλευράς της ΕΑΤ κατά την υπογραφή της Σύμβασης Τελικού Αποδέκτη ή εφόσον έχει βεβαιωθεί η εν λόγω οφειλή στην αρμόδια Δ.Ο.Υ., αυτή έχει ενταχθεί σε καθεστώς ρύθμισης, η οποία συνεχίζει να είναι σε ισχύ κατά την ημερομηνία υποβολής της αίτησης χρηματοδότησης. Δεν έχουν αποκλειστεί με απόφαση αποκλεισμού από την ΕΤΕπ τόσο κατά τον χρόνο υποβολής αιτήματος χρηματοδότησης προς την Τράπεζα όσο και κατά το χρόνο σύναψης της Δανειακής Σύμβασης σύμφωνα με την Πολιτική Αποκλεισμού της ΕΤΕπ https://www.eib.org/en/about/accountability/anti-fraud/exclusion/index). Δεν ανήκουν στις Μη Επιλέξιμες Επιχειρήσεις και δραστηριοποιούνται σε επιλέξιμες δραστηριότητες, όπως αυτές θα προσδιορίζονται στον Πίνακα επιλέξιμων Κωδικών Αριθμών Δραστηριότητας (ΚΑΔ), ο οποίος θα περιλαμβάνεται στον Οδηγό Εφαρμογής του Ταμείου. Δείτε τις Μη επιλέξιμες επιχειρήσεις και Εξαιρούμενες δραστηριότητες και δαπάνες εδώ Επιλέξιμες δαπάνες Σκοπός χορήγησης των Δανείων είναι η κάλυψη αναγκών κεφαλαίου κίνησης. Για τη χρηματοδότηση των πάσης φύσεως δαπανών είναι υποχρεωτική η προσκόμιση επιχειρηματικού σχεδίου (business plan). H προσκόμιση παραστατικών δαπανών κεφαλαίου κίνησης δεν είναι υποχρεωτική. Οι επιχειρήσεις οφείλουν να τηρούν ξεχωριστή λογιστική μερίδα για τις συναλλαγές που αφορούν στο συγκεκριμένο χρηματοδοτικό εργαλείο. Απαγορεύεται: (α) η αναχρηματοδότηση/αποπληρωμή υφιστάμενων δανείων και πιστωτικών γραμμών, (β) η χρηματοδότηση προγράμματος καταβολής μερισμάτων ή αγοράς μετοχών και (γ) η χρηματοδότηση Εξαγορών και Συγχωνεύσεων. Επιπλέον, οι Επιλέξιμες Δαπάνες δεν θα αφορούν: Την αγορά γης, εκτός εάν είναι τεχνικώς απαραίτητη για την επένδυση, όπου σε αυτή την περίπτωση μπορεί να χρηματοδοτηθεί ως το 10% του συνολικού επιχειρηματικού σχεδίου. Την αγορά γεωργικής γης. Την αγορά υπεραξίας, αδειών ή δικαιωμάτων εκμετάλλευσης ορυκτών πόρων και δικαιωμάτων παραγωγής στον γεωργικό τομέα. Τους δασμούς, τους φόρους, τα τέλη και τις εισφορές. Κρατική ενίσχυση Η ενίσχυση που λαμβάνει η επιχείρηση μέσω της εφαρμογής στο δάνειο μηδενικού/μειωμένου επιτοκίου ή και του ποσού επιδότησης του επιτοκίου που τυχόν θα λάβει μέσω του Ταμείου Συγχρηματοδότησης παρέχονται με την επιφύλαξη των κανόνων Κρατικών Ενισχύσεων. Το Ταμείο εφαρμόζεται σύμφωνα με τον Κανονισμό ΕΕ 1407/2013 (De Minimis). To Ακαθάριστο Ισοδύναμο Επιχορήγησης (ΑΙΕ) συντίθεται από: α) από το ΑΙΕ που αφορά το όφελος από το μειωμένο μεσοσταθμικό επιτόκιο που εφαρμόζεται στο συνολικό ποσό του δανείου λόγω της άτοκης συμμετοχής των κεφαλαίων του Ταμείου κατά 40% και β) από το ΑΙΕ που αντιστοιχεί στο ποσό των επιδοτούμενων τόκων των δύο (2) πρώτων ετών, στην περίπτωση που η επιχείρηση δεν έχει ενισχυθεί από άλλο Πρόγραμμα/Ταμείο της ΕΑΤ και επομένως τους δικαιούται. Ως ανώτατο ποσό δημόσιας χρηματοδότησης (ενίσχυση ήσσονος σημασίας) που μπορεί να λάβει μία επιχείρηση (σε επίπεδο «ενιαίας» επιχείρησης), εντός περιόδου τριών (3) οικονομικών ετών, ορίζεται το ποσό των 200.000 ευρώ, ή 100.000 ευρώ για τις επιχειρήσεις που δραστηριοποιούνται στον τομέα των οδικών εμπορευματικών μεταφορών. Περίοδος διάθεσης Μέχρι την 30.06.2025 και σε κάθε περίπτωση μέχρι εξαντλήσεως των κονδυλίων. Υποβολή αιτήσεων Οι ενδιαφερόμενοι (υποψήφιες προς χρηματοδότηση επιχειρήσεις) υποβάλλουν αίτηση στην πλατφόρμα KYC («Know Your Customer») της ΕΑΤ, μέσω του δικτυακού τόπου hdb.gr. Μέσω της πλατφόρμας, υπό την προϋπόθεση συναίνεσης για την συλλογή και επεξεργασία των προσωπικών δεδομένων, και ύστερα από μία σειρά αξιολογήσεων κριτηρίων (έλεγχο της ύπαρξης φορολογικής και ασφαλιστικής ενημερότητας και φερεγγυότητας των υποψήφιων προς χρηματοδότηση επιχειρήσεων), η αίτηση προωθείται στην Τράπεζα επιλογής του κατ’ εντολή του ενδιαφερομένου, για την υποβολή μη δεσμευτικής προσφοράς. Εν συνεχεία ο ενδιαφερόμενος, για τον οποίο η Τράπεζα εκδήλωσε το «μη δεσμευτικό» ενδιαφέρον χρηματοδότησης, υποβάλλει το αίτημα στο ΠΣΚΕ μέσω του δικτυακού τόπου https://www.ependyseis.gr/, προκειμένου να αξιολογηθεί από τα αρμόδια στελέχη της Τράπεζας. Δικαιολογητικά Δείτε τη λίστα των απαιτούμενων δικαιολογητικών εδώ Ευρωπαϊκή Τράπεζα Επενδύσεων Η Ευρωπαϊκή Τράπεζα Επενδύσεων, το χρηματοπιστωτικό ίδρυμα της Ευρωπαϊκής Ένωσης που ιδρύθηκε δυνάμει του άρθρου 309 της Συνθήκης για τη λειτουργία της Ευρωπαϊκής Ένωσης, συμμετέχει παράλληλα με την ΕΑΤ, το Ελληνικό Δημόσιο και τα Χρηματοπιστωτικά Ιδρύματα στη χρηματοδότηση επενδυτικών προγραμμάτων που αποτελούν μέρος των στόχων της Ευρωπαϊκής Ένωσης. Δείτε περισσότερα για τη δραστηριότητα της Ευρωπαϊκής Τράπεζας Επενδύσεων υπέρ των επιχειρήσεων εδώ."
