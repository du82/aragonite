title = "Δικαιολογητικά έναρξης συνεργασίας - Attica Bank"
description = "Για να ξεκινήσετε τη συνεργασία σας μαζί μας, θα πρέπει να προσκομίσετε ορισμένα…"
full_description = "Για να ξεκινήσετε τη συνεργασία σας μαζί μας, θα πρέπει να προσκομίσετε ορισμένα δικαιολογητικά: Φυσικά Πρόσωπα Προσωπικά στοιχεία ταυτοποίησης Για Έλληνες πολίτες: Δελτίο Αστυνομικής Ταυτότητας ή Διαβατήριο σε ισχύ ή Ταυτότητα υπηρετούντων στα Σώματα Ασφαλείας και στις Ένοπλες Δυνάμεις Πολίτες Ευρωπαϊκής Ένωσης (ΕΕ) Διαβατήριο σε ισχύ ή Ταυτότητα πολίτη χώρας ΕΕ ( δίγλωσση και με λατινικούς χαρακτήρες) Πολίτες Τρίτης Χώρας Διαβατήριο σε ισχύ ή Δελτίο Ταυτότητας Αλλοδαπού (έκδοση ΕΛ.ΑΣ.) ή Ειδικό Δελτίο Ταυτότητας Ομογενούς (έκδοση ΕΛ.ΑΣ.) και Άδεια διαμονής (στην περίπτωση που διαμένετε μόνιμα στην Ελλάδα) Φορολογικά στοιχεία Τελευταία Πράξη Διοικητικού Προσδιορισμού Φόρου (πρόσφατο εκκαθαριστικό) για Έλληνα Πολίτη ή Πολίτη χώρας ΟΟΣΑ. Βεβαίωση περί μη υποχρέωσης σε υποβολή φορολογικής δήλωσης σύμφωνα με τις σχετικές διατάξεις του Κώδικα Φορολογίας Εισοδήματος (προσκομίζεται για την πιστοποίηση του εισοδήματος και όχι του Α.Φ.Μ.) ή Πιστοποιητικό Φορολογικής Κατοικίας για Πολίτες χωρών ΟΟΣΑ ή ΕΕ (για την πιστοποίηση του ΑΦΜ) Ασκούμενο επάγγελμα και παρούσα επαγγελματική διεύθυνση Βεβαίωση εργοδότη ή Αντίγραφο τελευταίας μισθοδοσίας ή Επαγγελματική ταυτότητα σε ισχύ (εκδιδόμενη από επαγγελματικό σύλλογο με τη μορφη ΝΠΔΔ) ή Δήλωση έναρξης επιτηδεύματος ή Παραστατικό Φορέα Κοινωνικής Ασφάλισης ή Μισθωτήριο συμβόλαιο επαγγελματικής στέγης που έχει κατατεθεί σε Δ.Ο.Υ. Λοιπά στοιχεία Παρούσα διεύθυνση κατοικίας Πρόσφατος Λογαριασμός ενέργειας ή τηλεπικοινωνιών ή ύδρευσης ή σταθερής τηλεφωνίας (για Κατοίκους Εξωτερικού) ή Μισθωτήριο συμβόλαιο κατοικίας που έχει κατατεθεί σε Δημόσια Οικονομική Υπηρεσία (ΔΟΥ) ή Βεβαίωση Κατοικίας από Δημόσια Αρχή της χώρας κατοικίας του Πελάτη (για Κατοίκους Εξωτερικού) Τηλέφωνο επικοινωνίας Πρόσφατος λογαριασμός τηλεπικοινωνιών ή Βεβαίωση παρόχου ή αντιπροσώπου κινητής τηλεφωνίας ή Συμβόλαιο εταιρίας κινητής τηλεφωνίας Εκτυπώστε τη λίστα Ατομικές Επιχειρήσεις / Ελεύθεροι Επαγγελματίες Έγγραφα νομιμοποίησης της επιχείρησης Εγγραφή στο ΓΕΜΗ/ΥΜΣ (ή/και έναρξη στην εφορία) Έγγραφα πιστοποίησης της επιχείρησης Λογαριασμός τηλέφωνου της επιχείρησης όπου αναφέρεται το τηλέφωνο επικοινωνίας καθώς και η έδρα της. Στοιχεία τελευταίας οικονομικής χρήσης επικυρωμένα ηλεκτρονικά από την αρμόδια φορολογική αρχή. Δημοσιευμένες οικονομικές καταστάσεις ή περιοδικές δηλώσεις ΦΠΑ τρέχοντος έτους ή βεβαίωση έναρξης εργασιών. *Μετά την εξέταση των ανωτέρω εγγράφων, ενδέχεται να ζητηθούν συμπληρωματικά έγγραφα και/ή διευκρινίσεις για την ολοκλήρωσή της. Έγγραφα πιστοποίησης φορέων επιχείρησης / πραγματικού δικαιούχου Ταυτότητα ή Διαβατήριο σε ισχύ Πρόσφατο Εκκαθαριστικό εφορίας ή Ε1 Βεβαίωση μισθοδοσίας ή/και Ε3 (αν υπάρχουν εισοδήματα από ελεύθερα επαγγέλματα) ή/και Ε2 (αν υπάρχουν εισοδήματα από ακίνητα) Πρόσφατη βεβαίωση παρόχου κινητής τηλεφωνίας ή λογαριασμός κινητής τηλεφωνίας (με την αναγραφή του αριθμού τηλεφώνου) Πρόσφατος λογαριασμός τηλεφώνου ή λογαριασμός Ρεύματος ή Νερού (οικίας) Εάν υπάρχει και άλλη φορολογική κατοικία εκτός Ελλάδος δικαιολογητικά για τον ισοδύναμο ΑΦΜ στο εξωτερικό καθώς και λογαριασμούς κοινής ωφέλειας της κατοικίας του εξωτερικού (παρακαλούμε όπως επικοινωνήσετε με τους λειτουργούς του καταστήματος και τους δηλώσετε τη χώρα κατοικίας σας προκειμένου να σας δοθούν και τα αντίστοιχα έντυπα προς συμπλήρωση και υπογραφή (W9 ή W8BEN) *Μετά την εξέταση των ανωτέρω εγγράφων, ενδέχεται να ζητηθούν συμπληρωματικά έγγραφα και/ή διευκρινίσεις για την ολοκλήρωσή της. Εκτυπώστε τη λίστα Ομόρρυθμη / Ετερόρρυθμη Εταιρεία Έγγραφα νομιμοποίησης της επιχείρησης Καταστατικό (Καταστατικό Σύστασης και τροποποιήσεις αυτού όπως έχουν καταχωρηθεί στο ΓΕΜΗ/Υ.Μ.Σ.) Πρόσφατο Πιστοποιητικό ΓΕΜΗ περί των γενόμενων μεταβολών (μηνός) Υπεύθυνη δήλωση (υπογεγραμμένη από τον νόμιμο εκπρόσωπο): ότι τα προσκομισθέντα έγγραφα-πιστοποιητικά (τα οποία και θα αναφέρονται αναλυτικά επί της δηλώσεως) περιγράφουν την αληθή και πραγματική ισχύουσα εταιρική κατάσταση και εκπροσώπηση, ότι δεν έχουν επέλθει τροποποι