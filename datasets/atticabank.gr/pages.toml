title = "Εγγύηση Επιχειρηματικών Δανείων - Ταμείο Εγγυοδοσίας Καινοτομίας της ΕΑΤ - Attica Bank"
description = """
Η Δράση αφορά στη χορήγηση δανείων τακτής λήξης,  προς καινοτόμες ΜμΕ επιχειρήσεις, με μηδενική προμήθεια εγγύησης και δυνατότητα παροχής επιχορήγησης σε περίπτωση επίτευξης συγκεκριμένων κριτηρίων καινοτομίας και κριτηρίων επίτευξης ESG πρακτικών (Περιβαλλοντικά, Κοινωνικά και Εταιρικής Διακυβέρνησης).
Τα δάνεια, ύψους από €25.000- μέχρι και €400.000-, θα χορηγούνται με σκοπό την χρηματοδότηση επενδυτικών σχεδίων με σκοπό την έρευνα και καινοτομία (συμπεριλαμβανομένου κεφαλαίου κίνησης), με ευνοϊκούς όρους και μειωμένες εξασφαλίσεις, καθώς θα είναι εγγυημένα από το Ταμείο σε ποσοστό 80%."""
full_description = "Με μια γρήγορη ματιά Με στρατηγικό στόχο την ολοκληρωμένη υποστήριξη της ελληνικής επιχειρηματικότητας ως βασικού μοχλού για την ανάπτυξη της ελληνικής οικονομίας, η Attica Bank επεκτείνει την υφιστάμενη συνεργασία της με την Ελληνική Αναπτυξιακή Τράπεζα (ΕΑΤ), μέσω της συμμετοχής της στο Ταμείο Εγγυοδοσίας Καινοτομίας. Μέσω του εν λόγω Προγράμματος, η Attica Bank χρηματοδοτεί με ιδιαιτέρως ευνοϊκούς όρους και δυνατότητα παροχής επιχορήγησης σε περίπτωση επίτευξης συγκεκριμένων κριτηρίων, καινοτόμες μικρομεσαίες επιχειρήσεις με εξωστρεφή χαρακτήρα που προάγουν την έρευνα και επιθυμούν να δημιουργήσουν νέα πρωτοποριακά προϊόντα ή υπηρεσίες. Η υποστηριζόμενη χρηματοδότηση πραγματοποιείται με την εγγύηση που παρέχεται από το Ταμείο Εγγυοδοσίας Καινοτομίας της Ελληνικής Αναπτυξιακής Τράπεζας – HDB, που χρηματοδοτείται από το Ελληνικό Δημόσιο. Ο στόχος του προγράμματος Τι αφορά Η Δράση αφορά στη χορήγηση δανείων τακτής λήξης, προς καινοτόμες ΜμΕ επιχειρήσεις, με μηδενική προμήθεια εγγύησης και δυνατότητα παροχής επιχορήγησης σε περίπτωση επίτευξης συγκεκριμένων κριτηρίων καινοτομίας και κριτηρίων επίτευξης ESG πρακτικών (Περιβαλλοντικά, Κοινωνικά και Εταιρικής Διακυβέρνησης). Τα δάνεια, ύψους από €25.000- μέχρι και €400.000-, θα χορηγούνται με σκοπό την χρηματοδότηση επενδυτικών σχεδίων με σκοπό την έρευνα και καινοτομία (συμπεριλαμβανομένου κεφαλαίου κίνησης), με ευνοϊκούς όρους και μειωμένες εξασφαλίσεις, καθώς θα είναι εγγυημένα από το Ταμείο σε ποσοστό 80%. Τι είναι το Ταμείο Εγγυοδοσίας Καινοτομίας Το Ταμείο Εγγυοδοσίας Καινοτομίας λειτουργεί ως ανεξάρτητη χρηματοδοτική μονάδα εντός της Ελληνικής Αναπτυξιακής Τράπεζας ΑΕ (HDB) η οποία εκτελεί χρέη διαχειριστή του Ταμείου, μέσω του οποίου παρέχεται εγγύηση σε πιστωτικά ιδρύματα για τη χορήγηση δανείων με ευνοϊκούς όρους, με σκοπό την ενίσχυση της ανταγωνιστικότητας των καινοτόμων πολύ μικρών, μικρών και μεσαίων επιχειρήσεων (ΜμΕ) για την υλοποίηση των επενδυτικών τους σχεδίων με στόχο την έρευνα και καινοτομία, καθώς και δυνατότητα παροχής επιχορήγησης σε περίπτωση επίτευξης συγκεκριμένων κριτηρίων καινοτομίας. Προϋπολογισμός Δράσης: ο προϋπολογισμός του Ταμείου ανέρχεται σε 52.900.000- ευρώ, προερχόμενος από χρηματοδοτική συνεισφορά από το Πρόγραμμα Δημοσίων Επενδύσεων (ΠΔΕ) προς την ΕΑΤ. Ποια είναι τα οφέλη Τα οφέλη των τελικών δικαιούχων αφορούν σε: Μειωμένες (εμπράγματες) εξασφαλίσεις, ενώ δεν θα επιτρέπεται για δάνεια ύψους μέχρι €50.000- η παροχή εμπράγματων εξασφαλίσεων Μειωμένο κόστος χρηματοδότησης Επιχορήγηση 15% του κεφαλαίου του δανείου με την επίτευξη συγκεκριμένων στόχων καινοτομίας και επιπλέον ποσοστού 5% σε περίπτωση επίτευξης τριών (3) τουλάχιστον κριτηρίων σε τουλάχιστον δύο (2) από τις τρεις (3) κατηγορίες εφαρμογής ESG πρακτικών, που απομειώνει ανάλογα το υπόλοιπο του προς αποπληρωμή κεφαλαίου του δανείου. Άνευ προμήθειας εγγύησης Βασικά χαρακτηριστικά δανείων Περιγραφή βασικών χαρακτηριστικών Δανείων με την εγγύηση του Ταμείου Εγγυοδοσίας Καινοτομίας Δικαιούχοι δράσης / Επιλέξιμες επιχειρήσεις Οι υπό σύσταση (που διαθέτουν ΑΦΜ), νεοσύστατες, νέες και υφιστάμενες επιχειρήσεις, οιασδήποτε νομικής μορφής (ήτοι κάθε οντότητα που ασκεί οικονομική δραστηριότητα, ατομικές, ΟΕ, ΕΕ, ΕΠΕ, ΑΕ, ΙΚΕ, κ.λπ.) και για τις οποίες συντρέχουν αθροιστικά οι κάτωθι προϋποθέσεις, Είναι μικρομεσαίες επιχειρήσεις (ορισμός ΜΜΕ_Παράρτημα Ι του ΕΚ 651/2014, όπως εκάστοτε ισχύει), με έδρα και τόπο επένδυσης εντός της Ελληνικής Επικράτειας. Δεν ασκούν Μη Επιλέξιμη Δραστηριότητα (δείτε τις Μη Επιλέξιμες Δραστηριότητες/Δαπάνες και τους Απαγορευμένους Τομείς παρακάτω). Τηρούν διπλογραφικά βιβλία κατά το χρόνο υποβολής της αίτησης χρηματοδότησης στην Τράπεζα. Παρουσιάζουν καινοτόμο χαρακτήρα, ήτοι καλύπτουν τις προϋποθέσεις συμμετοχής – κριτήρια αξιολόγησης καινοτομίας με την αποδεδειγμένη εκπλήρωση (απαραίτητα δικαιολογητικά ή επιχειρηματικό σχέδιο) τουλάχιστον ενός (1) από τα δώδεκα (12) κριτήρια καινοτομίας. (δείτε εδώ) Δεν βρίσκονται σε συλλογική διαδικασία αφερεγγυότητας βάσει του εθνικού δικαίου και δεν έχουν λάβει ενίσχυση διάσωσης ή ενίσχυση αναδιάρθρωσης ή δεν έχουν κηρυχτεί σε αναγκαστική διαχείριση από τους πιστωτές. Έχουν συσταθεί νόμιμα έως και τον χρόνο υποβολής του αιτήματος χρηματοδότησης μέσω του Πληροφοριακού Συστήματος Κρατικών Ενισχύσεων. Πληρούν τις προϋποθέσεις του άρθρου 1 (Κεφάλαιο Ι) του ΓΑΚ 651/2014. Δεν θεωρούνται Προβληματικές Επιχειρήσεις (υπό την έννοια του άρθρου 1 παρ. 4 και στου σημείου 18 του άρθρου 2 του Κανονισμού 651/2014, όπως εκάστοτε ισχύουν), κατά της στιγμή της χορήγησης της ενίσχυσης (σε επίπεδο ενιαίας/δεδομένης επιχείρησης). Δεν έχουν υπαχθεί σε συλλογική πτωχευτική διαδικασία και δεν πληρούν τις προϋποθέσεις του Ν. 4738/2020, όπως ισχύει. Κρίνονται πιστοληπτικά αποδεκτές σύμφωνα με την ισχύουσα πιστωτική πολιτική και τις εσωτερικές διαδικασίες του Πιστωτικού Ιδρύματος. Είναι τραπεζικά ενήμερες (έχουν καθυστερημένη οφειλή < 90 ημερών) κατά το χρόνο υποβολής αιτήματος χρηματοδότησης προς το Πιστωτικό Ίδρυμα και σύμφωνα με την πολιτική εκάστου Πιστωτικού Ιδρύματος. Είναι επιχειρήσεις για τις οποίες δεν συντρέχουν λόγοι αποκλεισμού του άρθρου 40 του νόμου 4488/17 (Α 137/139/17), όπως ισχύει. Είναι επιχειρήσεις για τις οποίες δεν εκκρεμεί εντολή ανάκτησης προηγούμενης παράνομης και ασύμβατης κρατικής ενίσχυσης βάση απόφασης ΕΕ ή ΔΕΕ. Εάν έχουν ενταχθεί σε προγράμματα της HDB (πρώην ΕΤΕΑΝ) που έληξαν ή βρίσκονται σε ισχύ, δεν έχουν εμφανίσει δυσμενή συναλλακτική συμπεριφορά στην αποπληρωμή των οφειλών τους (καταγγελία δανείου ή ληξιπρόθεσμες οφειλές για διάστημα μεγαλύτερο των 90 ημερών) ή έχουν εμφανίσει δυσμενή συναλλακτική συμπεριφορά (καταγγελία δανείου) αλλά έχουν εξοφλήσει πλήρως τις οφειλές τους πριν την υποβολή της αίτησης χρηματοδότησης ή εφόσον πρόκειται για πρόγραμμα εγγυοδοσίας, δεν έχει καταβληθεί το ποσό οφειλής εγγύησης από πλευράς της HDB πριν την υποβολή της αίτησης χρηματοδότησης, ή εφόσον έχει βεβαιωθεί η εν λόγω οφειλή στην αρμόδια Δ.Ο.Υ., αυτή έχει ενταχθεί σε καθεστώς ρύθμισης, η οποία συνεχίζει να είναι σε ισχύ κατά την ημερομηνία υποβολής της αίτησης χρηματοδότησης. Δεν δραστηριοποιούνται στην πρωτογενή παραγωγή προϊόντων αλιείας και υδατοκαλλιέργειας. Δεν δραστηριοποιούνται στη μεταποίηση και την εμπορία προϊόντων αλιείας και υδατοκαλλιέργειας, εφόσον το ποσό της ενίσχυσης καθορίζεται με βάση την τιμή ή την ποσότητα των προϊόντων που αγοράζονται ή διατίθενται στην αγορά. Δεν δραστηριοποιούνται στην πρωτογενή παραγωγή γεωργικών προϊόντων. Δεν δραστηριοποιούνται στον τομέα της μεταποίησης και της εμπορίας γεωργικών προϊόντων, στις ακόλουθες περιπτώσεις: όπου το ποσό της ενίσχυσης καθορίζεται με βάση την τιμή ή την ποσότητα τέτοιων προϊόντων που πωλούνται από πρωτογενείς παραγωγούς ή διατίθενται στην αγορά από τις οικείες επιχειρήσεις, όπου η ενίσχυση συνοδεύεται από την υποχρέωση απόδοσής της εν μέρει ή εξ ολοκλήρου σε πρωτογενείς παραγωγούς. Δεν έχουν δραστηριότητες που σχετίζονται με εξαγωγές προς τρίτες χώρες ή προς κράτη μέλη, ιδίως δε ενισχύσεις που συνδέονται άμεσα με τις εξαγόμενες ποσότητες, με τη δημιουργία και λειτουργία δικτύου διανομής ή με άλλες τρέχουσες δαπάνες που σχετίζονται με την εξαγωγική δραστηριότητα. Δεν έχουν δραστηριότητες στις οποίες τίθεται ως όρος η χρήση εγχώριων αγαθών αντί των εισαγόμενων. Οι επιχειρήσεις οφείλουν να τηρούν ξεχωριστή λογιστική μερίδα για τις συναλλαγές που αφορούν στο συγκεκριμένο χρηματοδοτικό εργαλείο. Επιλέξιμες δαπάνες Σκοπός χορήγησης των Δανείων είναι η υλοποίηση επενδυτικού πλάνου που περιλαμβάνει επενδύσεις σε ενσώματα ή άυλα πάγια περιουσιακά στοιχεία και κεφάλαιο κίνησης που είναι απαραίτητο για την ολοκλήρωση του επενδυτικού σχεδίου. Συγκεκριμένα, επιλέξιμες στο πλαίσιο του Ταμείου είναι οι δαπάνες που περιλαμβάνονται στο επενδυτικό πλάνο της Επιχείρησης και είναι είτε αμιγώς επενδυτικές είτε συνδυασμός επενδυτικών δαπανών με κεφάλαια κίνησης ως μέρος του επενδυτικού πλάνου, είτε αμιγώς κεφάλαια κίνησης εφόσον πιστοποιούνται ως δαπάνες καινοτομίας. Οι δαπάνες που έχουν υλοποιηθεί ως προς το οικονομικό και φυσικό τους αντικείμενο πριν την ημερομηνία αίτησης χρηματοδότησης στο Πιστωτικό Ίδρυμα, δεν χρηματοδοτούνται. Η χρηματοδότηση των πάσης φύσεως δαπανών θα γίνεται με την προσκόμιση των σχετικών παραστατικών στην Τράπεζα. Αποδεκτά είναι παραστατικά επί πιστώσει που έχουν ημερομηνία έκδοσης μέχρι και έξι (6) μήνες πριν την ημερομηνία υποβολής της αίτησης χρηματοδότησης στο Πιστωτικό Ίδρυμα (το προϊόν της εκταμίευσης πιστώνεται στον εκδότη του χρηματοδοτούμενου παραστατικού, καθώς και παραστατικά που έχουν εξοφληθεί εξ ιδίων διαθεσίμων μετά την ημερομηνία υποβολής της αίτησης στο Πιστωτικό ίδρυμα και πριν την εκταμίευση (το προϊόν εκταμίευσης πιστώνεται στον όψεως της επιχείρησης). Παραστατικά τα οποία έχουν εξοφληθεί ολοσχερώς πριν την ημερομηνία υποβολής της αίτησης χρηματοδότησης στο Πιστωτικό Ίδρυμα, δεν είναι επιλέξιμα προς χρηματοδότηση. Παραστατικά μερικώς εξοφλημένα, δεν είναι αποδεκτά μόνο ως προς το εξοφλημένο μέρος, ενώ το ανεξόφλητο μέρος χρηματοδοτείται. Ο ΦΠΑ αποτελεί επιλέξιμη δαπάνη, ανεξαρτήτως καθεστώτος της επιχείρησης (ανακτήσιμος ή μη). Όσον αφορά στις δαπάνες κεφαλαίου κίνησης, επιλέξιμες είναι οι δαπάνες που σχετίζονται με τον εμπορικό και συναλλακτικό κύκλο και την επέκταση/ανάπτυξη της επιχείρησης, πιστοποιούνται ως δαπάνες καινοτομίας και αποτυπώνονται στο επενδυτικό πλάνο που υποβάλει η επιχείρηση. Ενδεικτικά, χρηματοδοτούνται δαπάνες προμηθευτών, αμοιβές προσωπικού, εργοδοτικές εισφορές, αμοιβές τρίτων, ενοίκια, αναλώσιμα, κλπ. Οι δαπάνες αυτές, δύναται να αφορούν: ανάγκες επιχειρήσεων σε πρώιμα στάδια κεφάλαιο για την επέκταση επιχείρησης κεφάλαιο για την ενίσχυση των λειτουργικών δαπανών μια επιχείρησης που σχετίζονται με το επενδυτικό σχέδιο για δαπάνες σε έρευνα και καινοτομία της επιχείρησης υλοποίηση νέων έργων (όπως π.χ. μια νέα εκστρατεία μάρκετινγκ, νέα διπλώματα ευρεσιτεχνίας) διείσδυση σε νέες αγορές εκπαίδευση προσωπικού για τις ανάγκες υλοποίησης του επενδυτικού σχεδίου. Οποιαδήποτε άλλη δαπάνη που, βάσει επιχειρηματικού σχεδίου, σχετίζεται με την εξυπηρέτηση του λειτουργικού κυκλώματος της επιχείρησης, με σκοπό, την επίτευξη των στόχων που έχουν τεθεί για τη λήψη της Επιχορήγησης και τη διατήρηση κριτηρίων καινοτομίας. Απαγορεύεται η (α) αναχρηματοδότηση/αποπληρωμή υφιστάμενων δανείων και πιστωτικών γραμμών, (β) η χρηματοδότηση προγράμματος καταβολής μερισμάτων ή αγοράς μετοχών και (γ) η χρηματοδότηση Εξαγορών και Συγχωνεύσεων. Εξαιρέσεις Δραστηριοτήτων / Δαπανών Δείτε τις μη επιλέξιμες δραστηριότητες και δαπάνες εδώ. Λήψη επιχορήγησης – επίτευξη κριτηρίων καινοτομίας και ESG Με την επίτευξη εντός τριάντα έξι (36) μηνών από την 1η εκταμίευση, συγκεκριμένων κριτηρίων καινοτομίας δύναται η λήψη επιχορήγησης σε ποσοστό 15% επί του ποσού του εκταμιευθέντος κεφαλαίου δανείου και επιπλέον ποσοστού 5% σε περίπτωση επίτευξης τριών (3) τουλάχιστον κριτηρίων σε τουλάχιστον δύο (2) από τις τρεις (3) κατηγορίες εφαρμογής ESG πρακτικών. Συγκεκριμένα μετά την υλοποίηση του επενδυτικού πλάνου της επιχείρησης, και τουλάχιστον 12 μήνες μετά την 1η εκταμίευση έως και 6 μήνες μετά το πέρας της 3ετίας από την 1η εκταμίευση, η επιχείρηση δύναται να αιτηθεί τον έλεγχο από την Τράπεζα για την τήρηση των συνθηκών των δύο (2) βασικών κατηγοριών κριτηρίων (Καινοτομίας και ESG). Δείτε τα κριτήρια Καινοτομίας και ESG εδώ. Σε περίπτωση που διαπιστωθεί η εκπλήρωση των κριτηρίων και ανάλογα με το τελικό αιτούμενο ποσό επιχορήγησης, θα πραγματοποιείται ξανά επανυπολογισμός του Ακαθάριστου Ισοδύναμου Επιχορήγησης (ΑΙΕ) και έλεγχος σώρευσης, ώστε να επιβεβαιώνεται τη συγκεκριμένη χρονική στιγμή η τήρηση του ανώτατου ορίου σώρευσης των €300.000-, βάσει του εφαρμοζόμενου καθεστώτος κρατικής ενίσχυσης . Το ποσό της επιχορήγησης θα κατευθύνεται στην ολική/μερική αποπληρωμή του υπολοίπου δανειακού κεφαλαίου, μειώνοντας έτσι την υποχρέωση της επιχείρησης και το κόστος εξυπηρέτησης του υπολειπόμενου δανεισμού. Το ποσό του εναπομείναντος κεφαλαίου θα πρέπει να είναι ≥ από το ποσό της δικαιούμενης επιχορήγησης. Σε περίπτωση που δεν δύναται να επιβεβαιωθεί η εκπλήρωση ενός τουλάχιστον εκ των κριτηρίων κατά τη λήξη της προβλεπόμενης περιόδου, δηλαδή για το χρονικό διάστημα, κατά μέγιστο 36 μήνες από την 1η εκταμίευση, δεν καταβάλλεται το ποσό της επιχορήγησης και η οφειλή εξακολουθεί να αποπληρώνεται από την πιστούχο επιχείρηση, διατηρώντας ωστόσο της ωφέλεια της εγγύησης της HDB. Κρατική ενίσχυση Η μηδενική προμήθεια εγγύησης καθώς και το ποσό της επιχορήγησης συνιστούν κρατική ενίσχυση. Η μηδενική προμήθεια εγγυοδοσίας, συνεπάγεται την παροχή ενίσχυσης προς τις επιχειρήσεις Τελικούς Αποδέκτες υπό την μορφή Ακαθάριστου Ισοδύναμου Επιχορήγησης (ΑΙΕ), στο οποίο θα υπολογιστεί επιπλέον και το ποσό της επιχορήγησης (κατά τη χρονική στιγμή της λήψης του). Οι ενισχύσεις (ΑΙΕ) που παρέχονται μέσω του Ταμείου λόγω λήξης ισχύος του Κανονισμού 1407/2013 De Minimis στις 31.12.2023 και της 6μηνης παράτασης αυτού στις 30.06.2024, από 01.07.2024 υπάγονται τόσο στον Γενικό Απαλλακτικό Κανονισμό ΕΕ 651/2014 (ΓΑΚ) όπως τροποποιήθηκε και ισχύει, και ειδικότερα το άρθρο 21 παρ. 18 και θα πρέπει να εφαρμόζονται οι αναφερόμενες στο εν λόγω άρθρο προϋποθέσεις καθώς και οι πρόνοιες των κοινών διατάξεων του εν λόγω Κανονισμού (Κεφ.Ι, άρθρα 1-9), όσο και στον Καν. ΕΕ 2831/2023, σχετικά με την εφαρμογή των άρθρων 107 και 108 της Συνθήκης για τη λειτουργία της Ευρωπαϊκής Ένωσης στις ενισχύσεις ήσσονος σημασίας (De Minimis), ως απόρροια των διατάξεων του άρθρου 21 παρ. 18 του Καν. 651/2014, όπως τροποποιήθηκε και ισχύει. Ως ανώτατο ποσό δημόσιας χρηματοδότησης (ενίσχυση ήσσονος σημασίας) που μπορεί να λάβει μία επιχείρηση (σε επίπεδο «ενιαίας/δεδομένης» επιχείρησης), εντός περιόδου (κυλιόμενη βάση) τριών (3) ετών, ορίζεται το ποσό των 300.000 ευρώ. Περίοδος διάθεσης Ως καταληκτική ημερομηνία ορίζεται η 31η/12/2025 ή μέχρι εξαντλήσεως των κονδυλίων Υποβολή αιτήσεων Οι ενδιαφερόμενοι υποβάλλουν το αίτημά τους στον ηλεκτρονικό σύνδεσμο https://www.ependyseis.gr/mis, επιλέγοντας την Attica Bank ως την Τράπεζα από την οποία επιθυμούν να χρηματοδοτηθούν. Οι επιχειρήσεις επίσης που υποβάλλουν από 1η Νοεμβρίου 2023 αίτηση συμμετοχής στο Ταμείο Εγγυοδοσίας Καινοτομίας θα πρέπει να προσκομίζουν υποχρεωτικά το δικαιολογητικό ESG Tracker Report. Το εν λόγω δικαιολογητικό εξάγεται μέσω της εισόδου της επιχείρησης σε ένα νέο ψηφιακό εργαλείο της ΕΑΤ, με την ονομασία «ESG Tracker by HDB». Συγκεκριμένα, η επιχείρηση που επιθυμεί να υποβάλλει αίτηση δανειοδότησης μέσω του Ταμείου Εγγυοδοσίας Καινοτομίας, θα πρέπει να εισέλθει στην ιστοσελίδα της ΕΑΤ https://esgtracker.hdb.gr/ και να συμπληρώσει τα ζητούμενα πεδία, προκειμένου να καταγραφεί το στάδιο βιώσιμης ανάπτυξης στο οποίο κατατάσσεται, όπως προκύπτει βάσει επιλεγμένων ESG κριτηρίων. Με την ολοκλήρωση της χρήσης του εργαλείου ESG Tracker εκτυπώνεται η σχετική αναφορά («ESG Tracker Report») η οποία αποτυπώνει την ως άνω επίδοση και η οποία θα προσκομίζεται στην Τράπεζα Δικαιολογητικά Δείτε τη λίστα των απαιτούμενων δικαιολογητικών εδώ."
