full_description = "Πώς μπορούμε να βοηθήσουμε; Καταναλωτικό δάνειο “New Start” Πρόγραμμα επιστροφής μετρητών IRIS payments Στεγαστικό δάνειο “Attica My Home” Εξόφληση οφειλών δημοσίου Πρόγραμμα ανταμοιβής συνεπών πελατών Δάνεια Προσφέρουμε μια ολοκληρωμένη σειρά δανείων ικανά να καλύψουν κάθε δική σας ανάγκη Καταναλωτικά Στεγαστικά Eco καταναλωτικά Πρόγραμμα “Εξοικονομώ 2023” “Αναβαθμίζω το σπίτι μου” Καταθετικά προϊόντα Στην Attica Bank δημιουργούμε προϊόντα που εξελίσσονται μαζί με τη ζωή των πελατών μας Ενημερωθείτε αναλυτικά Οι ψηφιακές σας συναλλαγές δεν ήταν ποτέ πιο εύκολες Πραγματοποιήστε τις καθημερινές τραπεζικές σας συναλλαγές μέσα από ένα σύγχρονο, εύχρηστο και ασφαλές περιβάλλον Περισσότερα Κατεβάστε σήμερα το Attica Mobile App στο κινητό ή το tablet σας Ανακαλύψτε την ανανεωμένη εμφάνιση και τις νέες δυνατότητες του! Ασφαλιστικά προγράμματα για Ιδιώτες Ενημερωθείτε για τα ασφαλιστικά προγράμματα που προσφέρουμε και επιλέξτε το κατάλληλο για εσάς Ασφάλεια ζωής Ασφάλεια σπιτιού Ασφάλεια αυτοκινήτου Personal cyber insurance Τελευταία Νέα 20-12-2024 Attica Bank: Καταργεί χρεώσεις σε περισσότερες τραπεζικές συναλλαγές, πέραν των κυβερνητικών ανακοινώσεων 05-03-2025 AtticaWealth: Διαχείριση περιουσίας των πελατών από επαγγελματίες με κύρος σε παγκόσμιο επίπεδο 26-02-2025 Ανακοίνωση – Αλλαγή Έδρας Τράπεζας 26-02-2025 Ανακοίνωση – Συγκρότηση νέου Διοικητικού Συμβουλίου σε Σώμα. Σύνθεση Επιτροπών Δ.Σ. 26-02-2025 Ανακοίνωση – Αποφάσεις της Έκτακτης Γενικής Συνέλευσης των μετόχων της Attica Bank Ανώνυμη Τραπεζική Εταιρεία Όλες οι Ανακοινώσεις"
