description = "Ο Λογαριασμός Όψεως σας εξασφαλίζει αποδοτική και ευέλικτη διαχείριση στις καθημερινές ανάγκες και συναλλαγές σας, είτε είστε ελεύθερος επαγγελματίας είτε μικρή επιχείρηση."
full_description = "Τι είναι Ο Λογαριασμός Όψεως σας εξασφαλίζει αποδοτική και ευέλικτη διαχείριση στις καθημερινές ανάγκες και συναλλαγές σας, είτε είστε ελεύθερος επαγγελματίας είτε μικρή επιχείρηση. Προσφέροντας εύκολες και γρήγορες λύσεις για την εξυπηρέτηση των ταμειακών σας αναγκών, αποτελεί την ιδανική επιλογή για φυσικά και νομικά πρόσωπα με εμπορική δραστηριότητα! Με μια γρήγορη ματιά 1 Ο λογαριασμός προσφέρεται και σε ξένο νόμισμα 2 Χορήγηση χρεωστικής κάρτας Attica Business Debit, στα επιλεγμένα από την επιχείρηση στελέχη της 3 Δυνατότητα πληρωμής λογαριασμών μέσω πάγιων εντολών που συνδέονται με τον λογαριασμό ή μέσω της υπηρεσίας Attica e-banking 4 Πληρωμή Οφειλών (Δημόσιο, Προμηθευτές κλπ.) 5 Δυνατότητα χορήγησης καρνέ επιταγών µε προτυπωµένο το ονοματεπώνυμο του δικαιούχου ή την επωνυμία της επιχείρησης Ο Λογαριασμός Όψεως της Attica Bank είναι η ιδανική επιλογή για επαγγελματίες και επιχειρήσεις που επιθυμούν να διατηρήσουν τον έλεγχο των ταμειακών τους ροών με απλότητα, ασφάλεια και αποδοτικότητα. Η ταχύτητα, η ευκολία και η ασφάλεια που παρέχει αυτός ο λογαριασμός καθιστά την καθημερινή διαχείριση των χρημάτων σας μία απλή διαδικασία. Πώς θα τον αποκτήσετε Επισκεφθείτε ένα κατάστημά μας. Ανοίξτε τον λογαριασμό σας online. Φροντίστε να έχετε μαζί σας όλα τα απαραίτητα έγγραφα."
