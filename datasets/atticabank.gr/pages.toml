title = "Συχνές ερωτήσεις - Attica Bank"
description = "Η συγχώνευση της Attica Bank και της Παγκρήτιας Τράπεζας δημιουργεί έναν νέο ισχυρό χρηματοπιστωτικό οργανισμό, ο οποίος στοχεύουμε να αποτελέσει τον 5ο πυλώνα του ελληνικού τραπεζικού συστήματος…"
full_description = "Τι σημαίνει η συγχώνευση των δύο Τραπεζών; Η συγχώνευση της Attica Bank και της Παγκρήτιας Τράπεζας δημιουργεί έναν νέο ισχυρό χρηματοπιστωτικό οργανισμό, ο οποίος στοχεύουμε να αποτελέσει τον 5ο πυλώνα του ελληνικού τραπεζικού συστήματος εξασφαλίζοντας ισχυρά οφέλη για το σύνολο των πελατών της ενωμένης Τράπεζας. Η συνένωση των δύο τραπεζικών οργανισμών θα αναπτυχθεί σε δύο φάσεις: αρχικά με τη νομική συγχώνευση η οποία θα ολοκληρωθεί μετά τις απαιτούμενες εποπτικές εγκρίσεις, τις αποφάσεις των Γενικών Συνελεύσεων και την έγκριση της Σύμβασης Συγχώνευσης από το ΓΕΜΗ και σε επόμενο χρόνο, με τη λειτουργική συγχώνευση και την πλήρη ενοποίηση των πληροφοριακών συστημάτων των δυο τραπεζών. Με την ολοκλήρωση της νομικής συγχώνευσης, κατά το πρώτο βήμα – ήδη η Attica Bank αναλαμβάνει το σύνολο των υποχρεώσεων και των δικαιωμάτων της Παγκρήτιας Τράπεζας."
