title = "Ασφάλεια συναλλαγών - Attica Bank"
description = "Η Attica Bank σας δίνει τη δυνατότητα να κάνετε τις συναλλαγές σας μέσω των ψηφιακών της καναλιών σε ένα υψηλού επιπέδου προστατευμένο περιβάλλον, εξασφαλίζοντας τη μέγιστη δυνατή ασφάλεια."
full_description = "Η Attica Bank σας δίνει τη δυνατότητα να κάνετε τις συναλλαγές σας μέσω των ψηφιακών της καναλιών σε ένα υψηλού επιπέδου προστατευμένο περιβάλλον, εξασφαλίζοντας τη μέγιστη δυνατή ασφάλεια. Εξειδικευμένα Συστήματα Ηλεκτρονικής Ασφάλειας: Τα συστήματα της Attica Bank ελέγχουν και καταγράφουν όλες τις προσβάσεις, εμποδίζοντας τις μη εξουσιοδοτημένες ενέργειες. Κρυπτογράφηση 2048 bits: Τα δεδομένα που ανταλλάσσονται σε κάθε συναλλαγή γίνονται με κρυπτογράφηση υψηλού επιπέδου, ένα σύστημα που έχει πιστοποιηθεί από διεθνούς κύρους εταιρεία με ειδίκευση σε θέματα ασφάλειας συναλλαγών. Περιηγητές: Η πρόσβαση στο Attica e-Banking και Attica Mobile επιτρέπεται μόνο μέσω των πιο πρόσφατων εκδόσεων περιηγητών για αυξημένη ασφάλεια. Login: Πολλαπλές αποτυχημένες προσπάθειες εισόδου θα αποκλείσουν την πρόσβαση για λόγους ασφαλείας. Μυστικοί Κωδικοί: Η Attica Bank σας ζητά να αλλάζετε τον Μυστικό σας Κωδικό ανά τακτά χρονικά διαστήματα καθώς και σε περιπτώσεις που εντοπίζεται ύποπτη συναλλακτική συμπεριφορά. Επίσης εισάγετε σύνθετους Μυστικούς Κωδικούς για περισσότερη ασφάλεια από υποκλοπές. Κωδικοί Μιας Χρήσης: Οι κωδικοί αυτοί έχουν έχουν ισχύ για μόνο 2 λεπτά και αντιστοιχούν σε μία και μοναδική συναλλαγή. Ισχυρή Ταυτοποίηση Πελάτη: Απαιτείται επιπλέον επαλήθευση για τις παρακάτω σημαντικές συναλλαγές μέσω ενός Κωδικού Μιας Χρήσης που θα λαμβάνετε στο email που έχετε δηλώσει στην τράπεζα: Μεταφορά Χρημάτων σε Τρίτους Εντός και Εκτός Τράπεζας Αλλαγή Κωδικού Πελάτη (Username) και Μυστικού Κωδικού (Password) Εγγραφή και Μεταβολή Συσκευής Κινητού Τηλεφώνου ή Τάμπλετ Μεταβολή Ημερήσιων Ορίων για Μεταφορές & Πληρωμές Ενημέρωση Προσωπικών Στοιχείων ή Αριθμού Κινητού Τηλεφώνου μέσω eGov-KYC. Περιορισμοί στις Συναλλαγές: Δεν μπορείτε να προχωρήσετε σε συναλλαγές μετά από σειρά αποτυχημένων προσπαθειών εισαγωγής του κωδικού μιας χρήσης. Αυτόματη Αποσύνδεση: Αποσυνδέεστε αυτόματα από το σύστημα, αφού περάσει ένα συγκεκριμένο χρονικό διάστημα, κατά το οποίο δεν έχετε προβεί σε κάποια ενέργεια ή συναλλαγή. Ρύθμιση Ορίων: Δυνατότητα προσαρμογής των ημερήσιων και ανά συναλλαγή ορίων από τον ίδιο τον πελάτη. Ειδοποιήσεις: Άμεση ενημέρωση μέσω e-mail ή SMS για αλλαγές στους κωδικούς πρόσβασης και στις εγχρήματες συναλλαγές."
