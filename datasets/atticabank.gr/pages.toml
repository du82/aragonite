title = "Συνήθεις τρόποι εξαπάτησης - Attica Bank"
description = "Η ενίσχυση της ασφάλειας των συναλλαγών σας αποτελεί μόνιμη προτεραιότητα για εμάς στην Attica Bank. Η ηλεκτρονική απάτη έχει πολλά πρόσωπα. Μπορείτε να μάθετε να τα αναγνωρίζετε αλλά και να…"
full_description = "Η ενίσχυση της ασφάλειας των συναλλαγών σας αποτελεί μόνιμη προτεραιότητα για εμάς στην Attica Bank. Η ηλεκτρονική απάτη έχει πολλά πρόσωπα. Μπορείτε να μάθετε να τα αναγνωρίζετε αλλά και να εκπαιδευτείτε σε σωστούς τρόπους αντιμετώπισής τους.Οι τρόποι που οι επιτήδειοι χρησιμοποιούν για να εξαπατήσουν είναι πολλοί και συνεχώς αλλάζουν. Τρόποι εξαπάτησης Δείτε πιο κάτω τους συνηθέστερους από αυτούς. απάτη του CEO (CEO Fraud), απάτη μέσω τιμολογίων και λοιπών παραστατικών (invoice Fraud), απατηλές τηλεφωνικές κλήσεις (vishing), απατηλά μηνύματα SMS (smishing), απατηλά μηνύματα ηλεκτρονικού ταχυδρομείου (phishing), απατηλές ιστοσελίδες τραπεζών (spoofed bank websites), απάτη μέσω διαδικτυακών ραντεβού (romance scam), κλοπή δεδομένων προσωπικού χαρακτήρα (personal data theft), απάτες σχετιζόμενες με επενδύσεις (investment scams), απάτες σε αγορές μέσω διαδικτύου (online shopping scams), απάτες υποτιθέμενης τεχνικής υποστήριξης, ηλεκτρονικές απάτες μέσω τηλεφωνικής επικοινωνίας, κλοπές στοιχείων ταυτότητας, και απάτες μέσω αλλαγής κάρτας SIM (SIM Swapping) Δείτε σχετικό βίντεο της Ελληνικής Ένωσης Τραπεζών Κάποιες κλήσεις είναι καλύτερο να μένουν αναπάντητες – YouTube Για περισσότερες πληροφορίες μπορείτε επίσης να επισκεφθείτε την ιστοσελίδα της Ελληνικής Ένωσης Τραπεζών και την ιστοσελίδα της Europol με συμβουλές ενάντια σε προσπάθειες εξαπάτησης στον Κυβερνοχώρο. Δείτε σχετικά infographic για τους τρόπους εξαπάτησης Κατεβάστε το αρχείο (15mb)"
