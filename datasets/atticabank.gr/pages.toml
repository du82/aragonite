title = "Πολιτική Cookies - Attica Bank"
description = """
Τα cookies είναι μικρά αρχεία με πληροφορίες που μια ιστοσελίδα (συγκεκριμένα ο εξυπηρετητής ιστού – web server) αποθηκεύει στον υπολογιστή, το κινητό ή άλλη ηλεκτρονική συσκευή ενός χρήστη, ώστε κάθε φορά που ο χρήστης συνδέεται στην ιστοσελίδα, η τελευταία να ανακτά τις εν λόγω πληροφορίες και να προσφέρει στο χρήστη σχετικές με αυτές υπηρεσίες. Γενικώς, τα cookies επιτελούν πολλές λειτουργίες και διαχωρίζονται σε διάφορες κατηγορίες αναλόγως του σκοπού που εξυπηρετούν και του τρόπου που λειτουργούν. Υπάρχουν cookies που είναι απαραίτητα για τη λειτουργία ενός ιστότοπου (χωρίς αυτά δεν θα ήταν τεχνικά εφικτή η παροχή υπηρεσιών από τον ιστότοπο), καθώς και cookies που διευκολύνουν την περιήγησή σας από τη μια ιστοσελίδα στην άλλη, αποθηκεύουν τις προτιμήσεις σας και γενικά βελτιώνουν την εμπειρία της περιήγησης σας στην ιστοσελίδα. Χαρακτηριστικό παράδειγμα τέτοιων πληροφοριών είναι οι προτιμήσεις του χρήστη σε μια ιστοσελίδα, όπως αυτές δηλώνονται από τις επιλογές που κάνει ο χρήστης στη συγκεκριμένη ιστοσελίδα (π.χ. επιλογή συγκεκριμένων «κουμπιών», αναζητήσεων, διαφημίσεων, κ.λπ.).Ο σκοπός των cookies είναι η ασφάλεια, η αποτελεσματικότερη εμφάνιση πληροφοριών, η καλύτερη εξυπηρέτηση και η διευκόλυνση στην περιήγηση ενός χρήστη. Επιπλέον, τα cookies μάς βοηθούν να αναλύουμε πώς χρησιμοποιείτε τον διαδικτυακό τόπο και εάν αντιμετωπίζετε προβλήματα κατά την περιήγησή σας. Μέσω των cookies δεν συλλέγονται προσωπικές πληροφορίες ούτε μπορεί να γίνει ταυτοποίηση του χρήστη.
Tα cookieς μπορεί να είναι Προσωρινά (session cookies) ή Μόνιμα (persistent cookies):

Tα Προσωρινά cookies (session cookies) παραμένουν στη συσκευή σας μέχρι να εγκαταλείψετε τον διαδικτυακό τόπο μας. Τα cookies αυτά βοηθούν για παράδειγμα στην ασφάλεια περιήγησης στον ιστότοπο μας.
Τα Μόνιμα cookies (Persistent cookies) παραμένουν στη συσκευή σας για μεγαλύτερο χρονικό διάστημα ή μέχρι να τα διαγράψετε εσείς. Η διάρκεια παραμονής τους στη συσκευή σας εξαρτάται από τη διάρκεια ζωής του συγκεκριμένου cookie και τις ρυθμίσεις του browser σας."""
full_description = "Μάθετε τι είναι τα cookies, ποια cookies χρησιμοποιούμε και πώς μπορείτε να τα διαγράψετε ή να απενεργοποιήσετε τη χρήση τους Τι είναι τα cookies Τα cookies είναι μικρά αρχεία με πληροφορίες που μια ιστοσελίδα (συγκεκριμένα ο εξυπηρετητής ιστού – web server) αποθηκεύει στον υπολογιστή, το κινητό ή άλλη ηλεκτρονική συσκευή ενός χρήστη, ώστε κάθε φορά που ο χρήστης συνδέεται στην ιστοσελίδα, η τελευταία να ανακτά τις εν λόγω πληροφορίες και να προσφέρει στο χρήστη σχετικές με αυτές υπηρεσίες. Γενικώς, τα cookies επιτελούν πολλές λειτουργίες και διαχωρίζονται σε διάφορες κατηγορίες αναλόγως του σκοπού που εξυπηρετούν και του τρόπου που λειτουργούν. Υπάρχουν cookies που είναι απαραίτητα για τη λειτουργία ενός ιστότοπου (χωρίς αυτά δεν θα ήταν τεχνικά εφικτή η παροχή υπηρεσιών από τον ιστότοπο), καθώς και cookies που διευκολύνουν την περιήγησή σας από τη μια ιστοσελίδα στην άλλη, αποθηκεύουν τις προτιμήσεις σας και γενικά βελτιώνουν την εμπειρία της περιήγησης σας στην ιστοσελίδα. Χαρακτηριστικό παράδειγμα τέτοιων πληροφοριών είναι οι προτιμήσεις του χρήστη σε μια ιστοσελίδα, όπως αυτές δηλώνονται από τις επιλογές που κάνει ο χρήστης στη συγκεκριμένη ιστοσελίδα (π.χ. επιλογή συγκεκριμένων «κουμπιών», αναζητήσεων, διαφημίσεων, κ.λπ.).Ο σκοπός των cookies είναι η ασφάλεια, η αποτελεσματικότερη εμφάνιση πληροφοριών, η καλύτερη εξυπηρέτηση και η διευκόλυνση στην περιήγηση ενός χρήστη. Επιπλέον, τα cookies μάς βοηθούν να αναλύουμε πώς χρησιμοποιείτε τον διαδικτυακό τόπο και εάν αντιμετωπίζετε προβλήματα κατά την περιήγησή σας. Μέσω των cookies δεν συλλέγονται προσωπικές πληροφορίες ούτε μπορεί να γίνει ταυτοποίηση του χρήστη. Tα cookieς μπορεί να είναι Προσωρινά (session cookies) ή Μόνιμα (persistent cookies): Tα Προσωρινά cookies (session cookies) παραμένουν στη συσκευή σας μέχρι να εγκαταλείψετε τον διαδικτυακό τόπο μας. Τα cookies αυτά βοηθούν για παράδειγμα στην ασφάλεια περιήγησης στον ιστότοπο μας. Τα Μόνιμα cookies (Persistent cookies) παραμένουν στη συσκευή σας για μεγαλύτερο χρονικό διάστημα ή μέχρι να τα διαγράψετε εσείς. Η διάρκεια παραμονής τους στη συσκευή σας εξαρτάται από τη διάρκεια ζωής του συγκεκριμένου cookie και τις ρυθμίσεις του browser σας. Πώς μπορείτε να διαχειριστείτε τα cookies; Μπορείτε να επιλέξετε και να αλλάξετε ελεύθερα τις προτιμήσεις σας σχετικά με τα Cookies ακολουθώντας τον παρακάτω σύνδεσμο «Διαχείριση Cookies». Μπορείτε, επίσης, να διαγράψετε όλα τα cookies που έχουν αποθηκευτεί στον υπολογιστή σας ή οποιαδήποτε άλλη φορητή συσκευή σας, καθώς και να ρυθμίσετε τους περισσότερους φυλλομετρητές, ώστε να αποτρέπουν την αποθήκευσή τους ακολουθώντας τις οδηγίες παρακάτω. Ωστόσο αν το κάνετε αυτό ενδεχομένως ορισμένες λειτουργίες και δυνατότητες πλοήγησης στον ιστότοπο να μη λειτουργούν. Διαχειριστείτε τα cookies επιλέγοντας ‘Διαχείριση Cookies’ παρακάτω Διαχείριση Cookies ήαπό το εικονίδιο που εμφανίζεται κάτω αριστερά στην οθόνη σας (μετά την πρώτη σας ενέργεια). Περισσότερες πληροφορίες σχετικά με τα cookies μπορείτε να βρείτε στον διαδικτυακό τόπο www.allaboutcookies.org. Ποια cookies χρησιμοποιεί η Attica Bank; Α. Τα Απολύτως Απαραίτητα cookies Τα cookies αυτά επιτρέπουν να κάνετε περιήγηση στον διαδικτυακό τόπο και να χρησιμοποιείτε τις λειτουργίες του, χωρίς να αποθηκεύουν πληροφορίες που σας ταυτοποιούν. Αυτά τα cookies είναι απολύτως απαραίτητα για τη σωστή λειτουργία του διαδικτυακού τόπου μας. Χωρίς αυτά, πολλές εφαρμογές του διαδικτυακού μας τόπου δεν μπορούν να λειτουργήσουν αποτελεσματικά. Tα απολύτως απαραίτητα cookies που χρησιμοποιεί η Attica Bank είναι τα παρακάτω: Όνομα Cookie: cc_cookie Τύπος: ΜόνιμοΠάροχος: Attica BankΣκοπός: Αποθηκεύει την αποδοχή των cookiesΔιάρκεια: 180 Ημέρες Όνομα Cookie: BIGipServerPortal_IP_Pool Τύπος: ΠροσωρινόΠάροχος: Attica BankΣκοπός: Χρησιμοποιείται για την ορθή λειτουργία του διαδικτυακού τόπουΔιάρκεια: Συνεδρίας Β. Cookies στατιστικών χρήσης Χρησιμοποιούμε αυτά τα cookies για να βελτιώσουμε την απόδοση του διαδικτυακού τόπου μας. Τα cookies στατιστικών χρήσης μας βοηθούν να συλλέξουμε πληροφορίες σχετικά με τον χρόνο και τον τρόπο που οι επισκέπτες αλληλεπιδρούν με τον διαδικτυακό τόπο μας και τις υπηρεσίες που προσφέρει. Για παράδειγμα, πόσες φορές είδε ο επισκέπτης ένα συγκεκριμένο προϊόν ή υπηρεσία και εάν επέλεξε να το κοινοποιήσει σε κάποια πλατφόρμα κοινωνικής δικτύωσης. Τα cookies στατιστικών χρήσης, αποθηκεύονται στη συσκευή σας μόνο εφόσον δώσετε τη συγκατάθεσή σας και είναι τα παρακάτω: Όνομα Cookie: _ga Τύπος: ΜόνιμοΠάροχος: Google Inc.Σκοπός: Συλλέγει πληροφορίες σχετικά με τη χρήση του διαδικτυακού τόπου από τους επισκέπτεςΔιάρκεια: 2 έτη Όνομα Cookie: _ga_XXXXXXXXXX Τύπος: ΜόνιμοΠάροχος: Google Inc.Σκοπός: Συλλέγει πληροφορίες σχετικά με τη χρήση του διαδικτυακού τόπου από τους επισκέπτεςΔιάρκεια: 2 έτη Πρόκειται για web analytics cookies τα οποία παρέχει η Google Inc. Χρησιμοποιούνται για να συλλέγουν πληροφορίες σχετικά με τη χρήση του διαδικτυακού τόπου από τους επισκέπτες. Για να μάθετε πώς χρησιμοποιεί η Google τα cookies και τις επιπλέον πληροφορίες που συλλέγει μέσω του διαδικτυακού τόπου μας, διαβάστε την πολιτική απορρήτου για τις υπηρεσίες Google Analytics. Εάν δεν θέλετε η Google να συλλέγει αυτές τις πληροφορίες, μπορείτε να μην δεχθείτε την εγκατάστασή τους ακολουθώντας τη διαδικασία άρνησης χρήσης cookies. Ορισμένες από τις ιστοσελίδες μας ή δευτερεύοντες ιστότοποι ίσως χρησιμοποιούν επιπλέον ή διαφορετικά cookies από τα προαναφερθέντα. Στην περίπτωση αυτή, θα βρείτε λεπτομέρειες για τα cookies στην αντίστοιχη ενημερωτική σελίδα. Ίσως σας ζητηθεί να συμφωνήσετε στην αποθήκευση αυτών των cookies. Πώς μπορείτε να διαγράψετε τα cookies Εάν επιθυμείτε να διαγράψετε ή να απενεργοποιήσετε τα cookies, επιλέξτε τον browser που χρησιμοποιείτε και ακολουθήστε τις οδηγίες: Chrome Safari Firefox Εάν χρησιμοποιείτε κάποιον άλλον browser, συμβουλευτείτε τις πληροφορίες του παρόχου του. Ανανέωση – Αλλαγή Παρούσας Πολιτικής Διατηρούμε το δικαίωμα να κάνουμε οποιεσδήποτε αλλαγές και διορθώσεις στην παρούσα Πολιτική ώστε να είναι πάντα σύμφωνη με τις νομικές απαιτήσεις και τον τρόπο λειτουργίας του παρόντος ιστοτόπου. Παρακαλούμε να ανατρέχετε στην παρούσα σελίδα ανά τακτά χρονικά διαστήματα, για να ενημερώνεστε για την πιο πρόσφατη έκδοση της Πολιτικής, ώστε να ελέγχετε τις παρούσες και τυχόν νέες επιπρόσθετες πληροφορίες."
