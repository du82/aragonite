["https://www.atticabank.gr/el/digital-bank/attica-e-banking/odigies-chrisis/chreostikes-kartes-2"]
title = "Μεταφορές - Attica Bank"
description = "Έχετε τη δυνατότητα μεταφοράς χρημάτων μεταξύ των δικών σας λογαριασμών, σε λογαριασμούς Attica Bank τρίτων, και σε λογαριασμό άλλης τράπεζας μέσω ΔΙΑΣ."
full_description = "Έχετε τη δυνατότητα μεταφοράς χρημάτων μεταξύ των δικών σας λογαριασμών, σε λογαριασμούς Attica Bank τρίτων, και σε λογαριασμό άλλης τράπεζας μέσω ΔΙΑΣ. Δείτε ποιες μεταφορές μπορείτε να πραγματοποιήσετε Μεταφορά χρημάτων μεταξύ των δικών σας λογαριασμών Με αυτή τη συναλλαγή, μπορείτε να μεταφέρετε χρήματα μεταξύ των λογαριασμών σας. Χρειάζεται να επιλέξετε το λογαριασμό χρέωσης και το λογαρισμό πίστωσης, αν θέλετε η συναλλαγή να εκτελεστεί μεμονωμένα, κατά την τρέχουσα ημερομηνία ή σε άλλη μελλοντική ημερομηνία (μεταχρονολογημένη), ή επαναλαμβανόμενα, ξεκινώντας είτε από την τρέχουσα είτε από μια μελλοντική ημερομηνία με τη συχνότητα και την περίοδο επανάληψης που θα ορίσετε. Επιλέξτε «Υποβολή» και «Επιβεβαίωση». Εφόσον αυτή ολοκληρωθεί με επιτυχία, εμφανίζεται η οθόνη ολοκλήρωσης της συναλλαγής που εμπεριέχει την «Απόδειξη συναλλαγής». Επιλέγοντάς το έχετε δυο επιμέρους επιλογές: να κατεβάσετε και να αποθηκεύσετε την απόδειξη στον υπολογιστή σας είτε να την αποστείλετε με ηλεκτρονικό ταχυδρομείο. Σε περίπτωση αποτυχίας της συναλλαγής, εμφανίζεται μήνυμα σφάλματος που σας ενημερώνει για την αιτία. Μπορείτε, αν θέλετε, να αποθηκεύσετε τη συναλλαγή σαν πρότυπη συναλλαγή. Μεταφορά χρημάτων σε λογαριασμούς Attica Bank τρίτων Με την συγκεκριμένη επιλογή μπορείτε να μεταφέρετε χρήματα σε λογαριασμό της Attica Bank τρίτου προσώπου. Χρειάζεται να επιλέξετε το λογαριασμό χρέωσης, να συμπληρώσετε τον 8-ψήφιο αριθμό λογαριασμού δικαιούχου και το ποσό που επιθυμείτε, αν θέλετε η συναλλαγή να εκτελεστεί μεμονωμένα, κατά την τρέχουσα ημερομηνία ή σε άλλη μελλοντική ημερομηνία (μεταχρονολογημένη), ή επαναλαμβανόμενα, ξεκινώντας είτε από την τρέχουσα είτε από μια μελλοντική ημερομηνία με τη συχνότητα και την περίοδο επανάληψης που θα ορίσετε. Επιλέξτε «Υποβολή» και θα μεταφερθείτε στην σελίδα «Επιβεβαίωσης» όπου και θα σας ζητηθεί Κωδικός Μιας Χρήσης είτε μέσω συσκευής κωδικών μιας χρήσης είτε μέσω αποστολής του κωδικού μιας χρήσης με SMS στο κινητό σας τηλέφωνο. Στη συνέχεια, επιλέξτε «Επιβεβαίωση».Εφόσον επιβεβαιώσετε την συναλλαγή και αν αυτή ολοκληρωθεί με επιτυχία, εμφανίζεται η οθόνη ολοκλήρωσης της συναλλαγής που εμπεριέχει την «Απόδειξη συναλλαγής». Επιλέγοντάς το έχετε δυο επιμέρους επιλογές: να κατεβάσετε και να αποθηκεύσετε την απόδειξη στον υπολογιστή σας είτε να την αποστείλετε με ηλεκτρονικό ταχυδρομείο. Σε περίπτωση αποτυχίας της συναλλαγής, εμφανίζεται μήνυμα σφάλματος που σας ενημερώνει για την αιτία. Μπορείτε, αν θέλετε, να αποθηκεύσετε τη συναλλαγή σαν πρότυπη συναλλαγή. Μεταφορά χρημάτων σε λογαριασμό άλλης τράπεζας μέσω ΔΙΑΣ Με αυτή τη συναλλαγή μπορείτε να μεταφέρετε χρήματα σε λογαριασμό δικαιούχου άλλης Τράπεζας εσωτερικού ή εξωτερικού. Χρειάζεται να συμπληρώσετε το λογαριασμό χρέωσης, τον αριθμό λογαριασμού δικαιούχου σε μορφή ΙΒΑΝ, το ονοματεπώνυμο δικαιούχου και το ποσό που επιθυμείτε. Εναλλακτικά, μπορείτε να επιλέξετε «Δικαιούχο» αν έχετε αποθηκεύσει δικαιούχους. Στα επιπλέον στοιχεία μπορείτε να επιλέξετε αν η προμήθεια της συγκεκριμένης συναλλαγής θα επιβαρύνει τον εντολέα ή θα γίνει επιμερισμός εξόδων.Στις περιπτώσεις των μεταφορών σε Τράπεζα του εσωτερικού, η χρέωση μπορεί να είναι δική σας (Εντολέα) ή να επιμερίζεται σε σας και τον παραλήπτη (Επιμερισμός), ενώ για μεταφορά σε Τράπεζα του Εξωτερικού η χρέωση επιμερίζεται υποχρεωτικά (Επιμερισμός).Μπορείτε να επιλέξετε αν η συναλλαγή να εκτελεστεί μεμονωμένα, κατά την τρέχουσα ημερομηνία ή σε άλλη μελλοντική ημερομηνία (μεταχρονολογημένη), ή επαναλαμβανόμενα, ξεκινώντας είτε από την τρέχουσα είτε από μια μελλοντική ημερομηνία με τη συχνότητα και την περίοδο επανάληψης που θα ορίσετε.Επιλέξτε «Υποβολή» και θα μεταφερθείτε στην σελίδα «Επιβεβαίωσης» όπου και θα σας ζητηθεί Κωδικός Μιας Χρήσης είτε μέσω συσκευής κωδικών μιας χρήσης είτε μέσω αποστολής του κωδικού μιας χρήσης με SMS στο κινητό σας τηλέφωνο. Στη συνέχεια, επιλέξτε «Επιβεβαίωση».Εφόσον επιβεβαιώσετε την συναλλαγή και αν αυτή ολοκληρωθεί με επιτυχία, εμφανίζεται η οθόνη ολοκλήρωσης της συναλλαγής που εμπεριέχει την «Απόδειξη συναλλαγής». Επιλέγοντάς το έχετε δυο επιμέρους επιλογές: να κατεβάσετε και να αποθηκεύσετε την απόδειξη στον υπολογιστή σας είτε να την αποστείλετε με ηλεκτρονικό ταχυδρομείο. Σε περίπτωση αποτυχίας της συναλλαγής, εμφανίζεται μήνυμα σφάλματος που σας ενημερώνει για την αιτία. Μπορείτε, αν θέλετε, να αποθηκεύσετε τη συναλλαγή σαν πρότυπη συναλλαγή. Υπηρεσία μαζικών μεταφορών/πληρωμών μέσω αρχείου συναλλαγών (Επιχειρήσεις) Μέσω του Attica e-banking, μπορείτε να εκτελείτε μαζικά μεταφορές χρημάτων σε λογαριασμούς εντός Attica Bank μέσω φόρτωσης αρχείων συναλλαγών. 1. Φόρτωση αρχείου συναλλαγών για πολλαπλές Μεταφορές σε Λογαρισμούς Τρίτων εντός Attica Bank με χρέωση ενός Λογαριασμού σας (One To Many): Ο τύπος του αρχείου υποστηρίζει πολλαπλές μεταφορές σε λογαριασμούς Τρίτων στην Attica Bank με χρέωση ενός λογαριασμού σας. Οι υποστηριζόμενοι τ αρχείων είναι csv, txt και xml. Για περισσότερες πληροφορίες σχετικά με το αρχείο Μαζικών Πληρωμών συμβουλευτείτε τις οδηγίες . Για περισσότερες πληροφορίες σχετικά με το αρχείο Μισθοδοσίας συμβουλευτείτε τις οδηγίες . 2. Φόρτωση αρχείου συναλλαγών για πολλαπλές Μεταφορές σε Λογαρισμούς τρίτων εντός Attica Bank ή σε άλλη τράπεζα, με χρέωση πολλαπλών Λογαριασμών σας (Many to Many): Το αρχείο Many to Many υποστηρίζει πολλαπλές μεταφορές σε λογαριασμούς τρίτων στην Attica Bank ή άλλης Τράπεζας με δυνατότητα χρέωσης διαφορετικών λογαριασμών σας. Οι συναλλαγές του αρχείου Many to Many εκτελούνται άμεσα. Οι υποστηριζόμενοι τύποι αρχείων και για τα δύο προαναφερόμενα αρχεία είναι csv, txt και xml. Υπηρεσία μαζικών μεταφορών/πληρωμών μέσω αρχείου δικαιούχων (Επιχειρήσεις) Μπορείτε να πραγματοποιήσετε ομαδικές πληρωμές σε πολλούς ενδοτραπεζικούς λογαριασμούς ταυτόχρονα, ακολουθώντας το εγκριτικό σχήμα που έχει οριστεί. Στο αρχείο μπορείτε να προσθέσετε δικαιούχους με λογαριασμό Attica Bank. Δημιουργείτε ένα αρχείο excel με τους δικαιούχους που επιθυμείτε, σύμφωνα με τα πρότυπα που ορίζονται από την Τράπεζα. Από την επιλογή φόρτωση αρχείου δικαιούχων επιλέγετε περιήγηση και ανεβάζετε το αρχείο από την τοποθεσία που είναι αποθηκευμένο στον υπολογιστή σας πατώντας Open. Θα οδηγηθείτε στην επόμενη οθόνη όπου και θα σας ζητηθεί Κωδικός Μιας Χρήσης μέσω SMS προκειμένου να επιβεβαιώσετε την ενέργειά σας. Εισάγετε τον κωδικό μιας χρήσης στο εμφανιζόμενο πεδίο και εφόσον συμφωνείτε με τα δεδομένα που εμφανίζονται στη σελίδα, επιλέξτε «Επιβεβαίωση». Για περισσότερες πληροφορίες συμβουλευτείτε τις οδηγίες."
