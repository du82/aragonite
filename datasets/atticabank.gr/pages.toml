title = "Attica Business POS - Attica Bank"
description = "Το Attica Business POS είναι Ανοιχτός Αλληλόχρεος Λογαριασμός Κεφαλαίου Κίνησης που σας εξασφαλίζει ρευστότητα και κάλυψη των βραχυπρόθεσμων αναγκών της επιχείρησής σας. Επιλέξτε στην Attica Bank τις…"
full_description = "Το Attica Business POS είναι Ανοιχτός Αλληλόχρεος Λογαριασμός Κεφαλαίου Κίνησης που σας εξασφαλίζει ρευστότητα και κάλυψη των βραχυπρόθεσμων αναγκών της επιχείρησής σας. Συνδέεται με τις πωλήσεις της επιχείρησης, μέσω των τερματικών POS ή e-commerce υπηρεσιών της Attica Bank. Ανάλογα με το ετήσιο ποσό των συναλλαγών που διενεργούνται μέσω του τερματικού POS ή του ηλεκτρονικού καταστήματος (e-commerce) της Attica Bank, παρέχεται η δυνατότητα χορήγησης ορίου, το οποίο θα αποπληρώνεται μέσω των μελλοντικών συναλλαγών που θα πραγματοποιηθούν από τα τερματικά της επιχείρησης. (α) Συγκεκριμένα, παρακρατείται αυτόματα ένα προσυμφωνημένο ποσοστό (έως και το 35%) των καθαρών εισπράξεων εισφοράς μέσω της εκκαθάρισης των πωλήσεων των τερματικών POS/e-commerce, όπου αποπληρώνει αυτόματα το χρησιμοποιούμενο όριο, ενώ το υπόλοιπο ποσοστό πιστώνεται στον συνδεδεμένο καταθετικό λογαριασμό της επιχείρησης ή του επαγγελματία. (β) Υφίσταται επιπλέον η δυνατότητα καταβολών εξ ιδίων διαθεσίμων για γρηγορότερη αποπληρωμή, εφόσον αυτό είναι επιθυμητό από την επιχείρηση ή τον επαγγελματία. Επιλέξτε στην Attica Bank τις λύσεις που σας προσφέρουν την ασφαλή χρηματοδότηση της επιχείρησής σας και επωφεληθείτε από την τερματική συσκευή POS, ενισχύοντας τη ρευστότητά της. Με μια γρήγορη ματιά 1 Ύψος Χρηματοδότησης Από €5.000 2 ΕπιτόκιοΚυμαινόμενο επιτόκιο, 3Μ Euribor πλέον περιθωρίου (spread) από 3,50% έως 7,90% πλέον Εισφοράς Ν.128/75 (σήμερα 0,60%). Το επιτόκιο εξαρτάται από την πιστοληπτική ικανότητα του πελάτη. 3 ΔιάρκειαΑόριστη με ετήσια ανανέωση 4 ΕκτοκισμόςΤριμηνιαίος 5 Τύπος ΧρηματοδότησηςΑνακυκλούμενο Όριο / Ανοιχτός Αλληλόχρεος Λογαριασμός. 6 ΑποπληρωμήΣταδιακή αποπληρωμή του κεφαλαίου της χρηματοδότησης μέσω των εισπράξεων της επιχείρησης με χρήση του POS μέσω αυτόματης παρακράτησης έως και του 35% των καθαρών εισπράξεων για την αποπληρωμή του κεφαλαίου της χρηματοδότησης. 7 Έξοδα ΔανείουΠάγιο €300 / ετήσια έξοδα ανανέωσης ορίου πιστοδότησης Ενημερωθείτε Επισκεφθείτε ένα κατάστημά μας. Φροντίστε να έχετε μαζί σας όλα τα απαραίτητα έγγραφα."
