["https://www.atticabank.gr/el/ypochreotiki-diavivasi-dedomenon-sti-psifiaki-platforma-mydata-tis-a-a-d-e"]
title = "Attica Bank - Διασύνδεση με Ψηφιακή Πλατφόρμα myDATA της Α.Α.Δ.Ε. - Attica Bank"
description = "Η Attica Bank όπως και όλα τα Πιστωτικά Ιδρύματα που λειτουργούν στη χώρα μας υποχρεούται, σύμφωνα με την ισχύουσα φορολογική νομοθεσία και ειδικότερα την υπ’ αριθμ. Α.1138/2020…"
full_description = "Η Attica Bank όπως και όλα τα Πιστωτικά Ιδρύματα που λειτουργούν στη χώρα μας υποχρεούται, σύμφωνα με την ισχύουσα φορολογική νομοθεσία και ειδικότερα την υπ’ αριθμ. Α.1138/2020 Κοινή Απόφαση του Υφυπουργού Οικονομικών και του Διοικητή Α.Α.Δ.Ε, να διαβιβάζει στην ΑΑΔΕ αναλυτικά τα παραστατικά των εσόδων της, καθώς και των τόκων καταθέσεων (έξοδά της) που εκδίδει στους πελάτες/ επιχειρήσεις (νομικά πρόσωπα, ατομικές επιχειρήσεις, λοιπούς ελεύθερους επαγγελματίες). Στο πλαίσιο αυτό οι πελάτες της άνω κατηγορίας, θα λαμβάνετε από την Τράπεζα τα παραστατικά συναλλαγών που αυτή έχει εκδώσει και διαβιβάσει στην ΑΑΔΕ και αφορούν την επαγγελματική σας δραστηριότητα, ώστε να ανταποκρίνεστε στις φορολογικές υποχρεώσεις σας. Η αποστολή θα γίνεται μέσω ηλεκτρονικού ταχυδρομείου στην ηλεκτρονική διεύθυνση που έχετε δηλώσει στην Τράπεζα. Σε περίπτωση που επιθυμείτε την οποιαδήποτε τροποποίηση/επικαιροποίηση της ηλεκτρονικής διεύθυνσης της εταιρείας σας, παρακαλούμε όπως επισκεφθείτε ένα από τα καταστήματα της Attica Bank. Για διευκρινίσεις επί των τιμολογίων, μπορείτε να επικοινωνείτε στο myData@atticabank.gr. Συχνές Ερωτήσεις Γιατί διαβιβάζει η Attica Bank τα τιμολόγια στην ΑΑΔΕ; Σύμφωνα με την υπ’ αριθ. Α.1138/2020 Κοινή Απόφαση του Υφυπουργού Οικονομικών και Διοικητή Α.Α.Δ.Ε., όλα τα πιστωτικά ιδρύματα θα διαβιβάζουν στην ψηφιακή πλατφόρμα myDATA της Α.Α.Δ.Ε., τα τιμολόγια που εκδίδουν για σκοπούς προσδιορισμού του λογιστικού και φορολογικού αποτελέσματος των οντοτήτων, για υπηρεσίες και αγαθά που παρέχουν ή παραδίδουν προς Νομικά Πρόσωπα και Φυσικά Πρόσωπα επιτηδευματίες. Με ποια συχνότητα θα γίνεται η έκδοση των τιμολογίων και η διαβίβαση αυτών στην ψηφιακή πλατφόρμα της ΑΑΔΕ; Η έκδοση των τιμολογίων, θα πραγματοποιείται από την Attica Bank ημερησίως όπως και η διαβιβασή τους. Εσείς θα το παραλαμβάνετε μέσω email κάθε εβδομάδα. Πού θα απευθύνεται ο πελάτης για να λάβει πληροφόρηση ή καθοδήγηση για το Τιμολόγιο που έλαβε; Ο πελάτης θα απευθύνεται μέσω email στο myData@atticabank.gr , για διευκρινίσεις επί τιμολογίου. Για θέματα ορθότητας & επικαιροποίησης στοιχείων θα πρέπει να απευθυνθεί σε Κατάστημα της Attica Bank. Πως θα λαμβάνει ο πελάτης το τιμολόγιο; Μέσω ηλεκτρονικής αλληλογραφίας / email στο δηλωμένο email στην Attica Bank. Είναι απαραίτητη η επικαιροποίηση των στοιχείων του; Ναι. Ώστε να παραλαμβάνει τα σχετικά τιμολόγια στην σωστή ηλεκτρονική διεύθυνση. Σε ποιες περιπτώσεις εκδίδεται και διαβιβάζεται Τιμολόγιο; Το φορολογικό στοιχείο, τιμολόγιο, εκδίδεται και διαβιβάζεται αναλυτικά στην ψηφιακή πλατφόρμα ηλεκτρονικών βιβλίων myData της ΑΑΔΕ, όπως προβλέπεται από το νόμο 4308/2014 για τα έσοδα που λογιστικοποιούνται στα λογιστικά αρχεία της Attica Bank και, συγκεκριμένα, για συναλλαγές που αφορούν σε Επαγγελματικό προϊόν ή διενεργούνται από Νομικό Πρόσωπο (Β2Β συναλλαγή)."
year_published = 2025
