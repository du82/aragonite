["https://www.atticabank.gr/el/oroi-chrisis"]
title = "Όροι Χρήσης - Attica Bank"
description = "Ο επισκέπτης/χρήστης των σελίδων και των υπηρεσιών του Δικτυακού μας τόπου οφείλει να διαβάσει προσεκτικά τους όρους χρήσης και τις προϋποθέσεις παροχής υπηρεσιών που ακολουθούν πριν από την επίσκεψη…"
full_description = "Γενική Ενημέρωση Ο επισκέπτης/χρήστης των σελίδων και των υπηρεσιών του Δικτυακού μας τόπου οφείλει να διαβάσει προσεκτικά τους όρους χρήσης και τις προϋποθέσεις παροχής υπηρεσιών που ακολουθούν πριν από την επίσκεψη ή τη χρήση των σελίδων και των υπηρεσιών μας και σε περίπτωση διαφωνίας οφείλει να μην κάνει χρήση τους, ειδάλλως τεκμαίρεται ότι τους αποδέχεται και παραχωρεί τη συγκατάθεσή του. Οι κατωτέρω όροι χρήσης ισχύουν για ό,τι γενικά περιλαμβάνεται στις σελίδες του Δικτυακού μας τόπου. Η Attica Bank Ανώνυμη Τραπεζική Εταιρεία (εφεξής η Δικαιούχος), δύναται οποτεδήποτε να τροποποιεί τους όρους χρήσης και τις προϋποθέσεις, οι δε χρήστες/επισκέπτες οφείλουν να ελέγχουν για ενδεχόμενες αλλαγές και, εφόσον εξακολουθούν τη χρήση, τούτο σημαίνει ότι αποδέχονται τις αλλαγές που επήλθαν στους όρους και τις προϋποθέσεις. Σε περίπτωση που οι χρήστες/επισκέπτες δεν συμφωνούν με τις επελθούσες αλλαγές, οφείλουν να απέχουν από τη χρήση και επίσκεψη του Δικτυακού τόπου της Τράπεζας. Δικαιώματα πνευματικής και βιομηχανικής ιδιοκτησίας Τα πνευματικά δικαιώματα κάθε στοιχείου με οποιαδήποτε μορφή που εμφανίζεται στον Δικτυακό τόπο της Δικαιούχου και περιέχεται στις ιστοσελίδες αυτού αποτελεί αντικείμενο πνευματικής ιδιοκτησίας της Δικαιούχου και διέπεται από τις εθνικές και διεθνείς διατάξεις περί πνευματικής ιδιοκτησίας, εκτός από τα ρητώς αναγνωρισμένα δικαιώματα τρίτων. Απαγορεύεται κάθε πράξη ή ενέργεια που γίνεται χωρίς την έγγραφη συναίνεση της Δικαιούχου και αφορά την με οποιονδήποτε τρόπο και μορφή αντιγραφή και αναπαραγωγή, καθώς και εκμετάλλευση του κάθε μορφής υλικού που εμφανίζεται και περιέχεται στον Δικτυακό τόπο της Δικαιούχου. Το σύνολο των πληροφοριών που υποβάλλεται στη Δικαιούχο μέσω του παρόντος Δικτυακού τόπου θα θεωρείται και θα παραμένει ιδιοκτησία της Δικαιούχου, η οποία θα είναι ελεύθερη να χρησιμοποιεί, για κάθε σκοπό, κάθε ιδέα, σύλληψη, τεχνογνωσία ή τεχνική μέθοδο που περιέχεται στις πληροφορίες, που οι επισκέπτες του Δικτυακού τόπου παρέχουν στην Τράπεζα μέσω του Δικτυακού τόπου αυτής. Υποχρεώσεις επισκέπτη/χρήστη Ο επισκέπτης/χρήστης του Δικτυακού μας τόπου οφείλει κατά την επίσκεψη και χρήση αυτού, να ακολουθεί τους κανόνες και τις ρυθμίσεις του Ελληνικού και Διεθνούς Δικαίου και να απέχει από κάθε παράνομη, καταχρηστική και μη προσήκουσα συμπεριφορά και πράξη κατά τη χρήση του Δικτυακού τόπου, ευθυνόμενος, σε αντίθετη περίπτωση, για κάθε ζημία που ήθελε τυχόν προκληθεί από την παράνομη και μη προσήκουσα χρήση του Δικτύου. Περιορισμός Ευθύνης Δικαιούχου Αν στον Δικτυακό τόπο της Δικαιούχου εμφανίζονται σήματα και προϊόντα πνευματικής ιδιοκτησίας τρίτων, τούτο ουδεμία ευθύνη δημιουργεί ή συνεπάγεται για τη Δικαιούχο και θεωρείται ότι το γεγονός αυτό δεν έχει καμία σχέση με τον Δικτυακό μας τόπο. Η Δικαιούχος δεν εγγυάται την ακρίβεια, επάρκεια ή πληρότητα των πληροφοριών και του υλικού του Δικτυακού τόπου, καθόσον όλο αυτό το υλικό παρέχεται ως έχει και ρητά αποποιείται κάθε ευθύνης, συμπεριλαμβανομένης και της περίπτωσης αμέλειας, για λάθη ή παραλείψεις, διακοπές, ελαττώματα, καθυστέρηση λειτουργίας ή εκπομπής των ηλεκτρονικών υπολογιστών, σχετικά με αυτό το πληροφοριακό υλικό, ακόμη και αν οι εκπρόσωποι της Δικαιούχου έχουν ενημερωθεί σχετικά με την πιθανότητα ζημιών ή απωλειών από τα περιστατικά αυτά. Η Δικαιούχος δεν εγγυάται την έλλειψη «ιών», είτε στον Δικτυακό της τόπο, είτε σε άλλο site server, μέσω του οποίου λαμβάνεται το περιεχόμενο του Δικτυακού της τόπου. Διακριτική ευχέρεια αξιολόγησης του περιεχομένου του Δικτυακού τόπου από τους Χρήστες Οτιδήποτε παρέχεται στους χρήστες/επισκέπτες μέσω του Δικτυακού μας τόπου δεν αποτελεί σε καμία περίπτωση, ευθέως ή εμμέσως, παρότρυνση, συμβουλή ή προτροπή για τη διενέργεια οποιασδήποτε επενδυτικής ή άλλης πράξης με οικονομικό αποτέλεσμα, αλλά εναπόκειται στη διακριτική ευχέρεια και αποκλειστική ευθύνη των χρηστών/επισκεπτών να αξιολογήσουν ό,τι τους παρέχεται και να ενεργήσουν βασιζόμενοι στην ιδιωτική τους βούληση, αποκλειομένης οποιασδήποτε δικής μας ευθύνης κατά τα ως άνω οριζόμενα. “Δεσμοί” (links) προς άλλους Δικτυακούς τόπους Ο Δικτυακός μας τόπος δεν ευθύνεται για το περιεχόμενο και τις υπηρεσίες άλλων δικτυακών τόπων στους οποίους παραπέμπει μέσω «δεσμών», hyperlinks ή διαφημιστικών banner, ούτε εγγυάται τη διαθεσιμότητά τους. Προβλήματα που τυχόν προκύψουν κατά την επίσκεψη/ χρήση των Δικτυακών τόπων στους οποίους παραπέμπουμε, ανάγονται αποκλειστικά και μόνο στη σφαίρα ευθύνης των αντίστοιχων δικτυακών τόπων, όπου και οφείλετε να απευθύνεστε. Η παραπομπή σε άλλους δικτυακούς τόπους γίνεται προς διευκόλυνση των χρηστών του Δικτυακού τόπου της Δικαιούχου και σε καμία περίπτωση δεν δημιουργεί οιασδήποτε μορφής δέσμευση για οιονδήποτε. Αποζημίωση Ρητά συμφωνείται με την παρούσα ότι σε περίπτωση που ασκηθεί κατά του φορέα του Δικτυακού μας τόπου οποιαδήποτε αγωγή ή αξίωση, απορρέουσα από οποιασδήποτε μορφής παράβαση του επισκέπτη/χρήστη, αυτός αναλαμβάνει την υποχρέωση αφενός να παρέμβει στη σχετική διαδικασία και αφετέρου να αποζημιώσει τον φορέα του Δικτυακού μας τόπου, στην περίπτωση που υποχρεωθεί σε καταβολή αποζημίωσης ή άλλης δαπάνης. Εφαρμοστέο δίκαιο και λοιποί όροι Η συγκεκριμένη σύμβαση χρήσης διέπεται από τις διατάξεις του Ελληνικού Δικαίου, τις Οδηγίες και τους Κανονισμούς του Ευρωπαϊκού Δικαίου και τις σχετικές διατάξεις, ερμηνεύεται δε με βάση τους κανόνες της καλής πίστης, των χρηστών συναλλακτικών ηθών και του οικονομικού και κοινωνικού σκοπού του δικαιώματος. Αν κάποια διάταξη κριθεί, με βάση το ισχύον νομικό καθεστώς, άκυρη ή ακυρώσιμη, παύει αυτοδικαίως να ισχύει, χωρίς σε καμία περίπτωση να θίγεται η ισχύς των λοιπών όρων. Καμία τροποποίηση των όρων της συγκεκριμένης σύμβασης δεν θα λαμβάνεται υπόψη και δεν θα αποτελεί τμήμα αυτής, αν δεν έχει διατυπωθεί εγγράφως και δεν έχει ενσωματωθεί σε αυτή. Αρμόδια δικαστήρια για την επίλυση τυχόν αναφυόμενων διαφορών εξ αφορμής της εν λόγω σύμβασης, για την ισχύ της σύμβασης καθώς και για την ερμηνεία αυτής είναι ΑΠΟΚΛΕΙΣΤΙΚΑ τα Δικαστήρια Αθηνών."
