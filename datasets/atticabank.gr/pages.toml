["https://www.atticabank.gr/el/companies/anaptyxiaka-programmata/tameio-anakampsis-kai-anthektikotitas/daneia-tameiou-anakampsis-kai-anthektikotitas"]
title = "Δάνεια Ταμείου Ανάκαμψης και Ανθεκτικότητας - Attica Bank"
description = """
Χρηματοδοτικό σχήμα επενδυτικών σχεδίωνΤο χρηματοδοτικό σχήμα για κάθε επενδυτικό σχέδιο που θα υποβληθεί στο ΤΑΑ, θα έχει την ακόλουθη δομή:

Επισημάνσεις

Το Δάνειο ΤΑΑ δύναται να είναι κάθε τύπου περιλαμβανομένων των Ομολογιακών Δανείων (τα οποία και απαλλάσσονται της εισφοράς Ν. 128/75)
Το Δάνειο ΤΑΑ και το Δάνειο Συγχρηματοδότησης δύναται να χορηγούνται βάσει κοινών ή διακριτών, ή βάσει κοινοπρακτικών συμβάσεωνΣε κάθε περίπτωση Διαχειριστής/Πληρεξούσιος Καταβολών & Εκπρόσωπος Ομολογιούχων (στην περίπτωση Ομολογιακών Δανείων) είναι η Τράπεζα
Οι εξασφαλίσεις που θα δίδονται θα είναι ίδιες και θα εξασφαλίζουν κατ’ ελάχιστον σύμμετρα (pari passu) τις απαιτήσεις από αμφότερες τις αντίστοιχες συμβάσεις
Η Τράπεζα παρακολουθεί το Δάνειο ΤΑΑ και την τήρηση των υποχρεώσεων της δανειοδοτούμενης επιχείρησης. Αποφασίζει για αποκλίσεις υποχρεώσεων, απαντά σε αιτήματα Επενδυτή για waivers / τροποποιήσεις κλπ. Καθ’ υπέρβαση του ποσοστού του Δανείου Συγχρηματοδότησης, υπάρχει δυνατότητα να χορηγηθεί πρόσθετο δάνειο για την κάλυψη των μη επιλέξιμων δαπανών του επενδυτικού σχεδίου
Τα Ιδία Κεφάλαια δύναται να προέρχονται από ίδια χρηματικά διαθέσιμα ή/και δάνεια μειωμένης εξοφλητικής προτεραιότητας που λαμβάνει η επιχείρηση από τους μετόχους ή εταίρους ή άλλες συνδεδεμένες εταιρείες, συμπεριλαμβανομένων και τυχόν εισφορών σε είδος έως το δέκα τοις εκατό (10%) του επιλέξιμου επενδυτικού κόστους"""
full_description = "Η Attica Bank συγχρηματοδοτεί με το Ταμείο Ανάκαμψης και Ανθεκτικότητας και δίνει ώθηση στην ελληνική επιχειρηματικότητα Η Attica Bank υπέγραψε Επιχειρησιακή Συμφωνία με το Ελληνικό Δημόσιο (ΕΔ), ενεργοποιώντας την συμμετοχή της στο Εθνικό Σχέδιο Ανάκαμψης και Ανθεκτικότητας με τίτλο «Ελλάδα 2.0». Για πρώτη φορά η ελληνική επιχειρηματικότητα λαμβάνει μέσω της Ευρωπαϊκής Ένωσης μία πρωτοφανούς μεγέθους ώθηση της τάξης των €16,7 δις με στόχο την καθοριστική της ανάπτυξη και καινοτομία. Συγχρηματοδοτούμε ελληνικές επιχειρήσεις μέσω του Ταμείου Ανάκαμψης και Ανθεκτικότητας, στοχεύοντας σε επενδύσεις που θα συμβάλουν στην ουσιαστική ενίσχυση των ελληνικών επιχειρήσεων με το βλέμμα στραμμένο σε ένα πιο αειφόρο και προηγμένο μέλλον. Πυλώνες προγράμματος Το αναθεωρημένο πρόγραμμα Ελλάδα 2.0 του Ταμείου Ανάκαμψης και Ανθεκτικότητας, προβλέπει συνολικά 36 δισ. ευρώ εκ των οποίων τα 16,7 δισ. ευρώ αφορούν σε δανειοδοτήσεις σε 5 θεματικές κατευθύνσεις/Πυλώνες: Πράσινη μετάβαση Ψηφιακός μετασχηματισμός Καινοτομία – R&D Ανάπτυξη οικονομιών κλίμακας Εξωστρέφεια Για την υλοποίηση των επενδυτικών σας σχεδίων, το πρόγραμμα προβλέπει χαμηλότοκη χρηματοδότηση έως 50% με κεφάλαια του Ταμείου. Τουλάχιστον 20% ίδια κεφάλαια. Το υπολειπόμενο ποσοστό θα καλυφθεί με χρηματοδότηση από την Τράπεζα. Δάνεια Ταμείου Ανάκαμψης και Ανθεκτικότητας Χρηματοδοτικό σχήμα Χρηματοδοτικό σχήμα επενδυτικών σχεδίωνΤο χρηματοδοτικό σχήμα για κάθε επενδυτικό σχέδιο που θα υποβληθεί στο ΤΑΑ, θα έχει την ακόλουθη δομή: Επισημάνσεις Το Δάνειο ΤΑΑ δύναται να είναι κάθε τύπου περιλαμβανομένων των Ομολογιακών Δανείων (τα οποία και απαλλάσσονται της εισφοράς Ν. 128/75) Το Δάνειο ΤΑΑ και το Δάνειο Συγχρηματοδότησης δύναται να χορηγούνται βάσει κοινών ή διακριτών, ή βάσει κοινοπρακτικών συμβάσεωνΣε κάθε περίπτωση Διαχειριστής/Πληρεξούσιος Καταβολών & Εκπρόσωπος Ομολογιούχων (στην περίπτωση Ομολογιακών Δανείων) είναι η Τράπεζα Οι εξασφαλίσεις που θα δίδονται θα είναι ίδιες και θα εξασφαλίζουν κατ’ ελάχιστον σύμμετρα (pari passu) τις απαιτήσεις από αμφότερες τις αντίστοιχες συμβάσεις Η Τράπεζα παρακολουθεί το Δάνειο ΤΑΑ και την τήρηση των υποχρεώσεων της δανειοδοτούμενης επιχείρησης. Αποφασίζει για αποκλίσεις υποχρεώσεων, απαντά σε αιτήματα Επενδυτή για waivers / τροποποιήσεις κλπ. Καθ’ υπέρβαση του ποσοστού του Δανείου Συγχρηματοδότησης, υπάρχει δυνατότητα να χορηγηθεί πρόσθετο δάνειο για την κάλυψη των μη επιλέξιμων δαπανών του επενδυτικού σχεδίου Τα Ιδία Κεφάλαια δύναται να προέρχονται από ίδια χρηματικά διαθέσιμα ή/και δάνεια μειωμένης εξοφλητικής προτεραιότητας που λαμβάνει η επιχείρηση από τους μετόχους ή εταίρους ή άλλες συνδεδεμένες εταιρείες, συμπεριλαμβανομένων και τυχόν εισφορών σε είδος έως το δέκα τοις εκατό (10%) του επιλέξιμου επενδυτικού κόστους Βασικοί όροι δανείου ΤΑΑ Κρατική ενίσχυση Τα δάνεια του ΤΑΑ δύναται να χορηγηθούν με πολύ χαμηλό επιτόκιο (ευνοϊκότερο των κρατούντων στην τραπεζική αγορά για ανάλογες περιπτώσεις επενδυτικών σχεδίων), γι’ αυτό τον λόγο πρέπει να εξεταστεί η συμβατότητα με τους κανόνες κρατικών ενισχύσεων. Εάν το επιτόκιο του δανείου ΤΑΑ είναι μικρότερο από το επιτόκιο αναφοράς (reference rate) που προκύπτει για την επιχείρηση βάσει της πιστοληπτικής της διαβάθμισης και των ειδικότερων χαρακτηριστικών του εγκεκριμένου δανείου (ποσό, εξασφαλίσεις), τότε η διαφορά των εν λόγω επιτοκίων για το δάνειο ΤΑΑ αποτελεί κρατική ενίσχυση και εφαρμόζονται τα οριζόμενα στους Καν. (ΕΕ) 651/14 (ΓΑΚ), όπως τροποποιήθηκε με τον Καν. (ΕΕ) 1315/2023, ή τον Καν. (ΕΕ) 2831/2023 (De minimis), ή τον Καν. (ΕΕ) 2472/2022 (Αγροτικός Απαλλακτικός Κανονισμός), ανάλογα με την επιλογή του καθεστώτος κρατικών ενισχύσεων του επενδυτή. Κρατική ενίσχυση_Ακαθάριστο Ισοδύναμο Επιχορήγησης (ΑΙΕ)Ως κρατική ενίσχυση ορίζεται το όφελος που προκύπτει για την επιχείρηση, από το γεγονός ότι το Δάνειο ΤΑΑ δύναται να εκτοκίζει με χαμηλότερο επιτόκιο σε σχέση με το επιτόκιο αναφοράς, όπως καθορίζεται σύμφωνα με την «Ανακοίνωση της Επιτροπής σχετικά με την αναθεώρηση της μεθόδου καθορισμού των επιτοκίων αναφοράς και προεξόφλησης» (2008/C14/02). Ήτοι όφελος ή ενίσχυση για την επιχείρηση είναι η διαφορά (σε παρούσα αξία) των συνολικών τόκων που θα καταβάλλει η επιχείρηση, λόγω του μειωμένου επιτοκίου που χρεώνει το ΤΑΑ στα κεφάλαιά του, με τους τόκους που θα κατέβαλλε η επιχείρηση, εάν το ΤΑΑ χρέωνε για τη συνεισφορά του «επιτόκιο αγοράς», λαμβάνοντας ως «επιτόκιο αγοράς», το επιτόκιο αναφοράς. Επιτόκιο ΤΑΑ ≥ Επιτόκιο αναφοράςΣτην περίπτωση που το επιτόκιο από το δάνειο του ΤΑΑ είναι ίσο ή μεγαλύτερο από το επιτόκιο αναφοράς (reference rate), το Δάνειο ΤΑΑ δεν αποτελεί κρατική ενίσχυση και ο έλεγχος συμβατότητας ολοκληρώνεται θετικά ως προς τις κρατικές ενισχύσεις. Επιτόκιο ΤΑΑ < Επιτόκιο αναφοράςΣτην περίπτωση που το αιτούμενο επιτόκιο δανείου ΤΑΑ είναι μικρότερο του επιτοκίου αναφοράς, τότε το Δάνειο ΤΑΑ αποτελεί κρατική ενίσχυση και υπολογίζεται το Ακαθάριστο Ισοδύναμο Επιχορήγησης (ΑΙΕ) και ελέγχεται η συμβατότητα με τα ανώτατα κατά περίπτωση βάσει της επιλογής από τον επενδυτή του Κανονισμού κρατικών ενισχύσεων (ΓΑΚ ή De minimis), όρια σώρευσης. Επιλέξιμοι φορείς Επιλέξιμη για χορήγηση δανείου ΤΑΑ αποτελεί κάθε φυσικό ή νομικό πρόσωπο που πρόκειται να υλοποιήσει επιλέξιμη επένδυση και: Αποτελεί:– ιδιωτική επιχείρηση– επιχείρηση στο μετοχικό κεφάλαιο της οποίας, η κρατική συμμετοχή είναι μικρότερη ή ίση του πενήντα τοις εκατό (50%) του συνολικού μετοχικού κεφαλαίου και– επιχείρηση ανεξαρτήτως του ποσοστού κρατικής συμμετοχής στο μετοχικό κεφάλαιό της, που έχει στην κυριότητά της ή/και διαχειρίζεται δίκτυα ενέργειας, που αποτελούν φυσικό μονοπώλιο Δεν αποτελεί πρόσωπο που έχει την έδρα ή εγκατάστασή του σε χώρες/κράτη που εντάσσονται:– στον εκάστοτε ισχύοντα ενωσιακό κατάλογο μη συνεργάσιμων περιοχών δικαιοδοσίας [Παράρτημα Ι των Συμπερασμάτων του Συμβουλίου για τον αναθεωρημένο ενωσιακό κατάλογο μη συνεργάσιμων περιοχών φορολογικής δικαιοδοσίας (2021/C 66/10)],– σε χώρες που περιλαμβάνονται στο Παράρτημα του κατ’ εξουσιοδότηση κανονισμού (ΕΕ) 2016/1675 (L 254), όπως εκάστοτε ισχύει (Τρίτες Χώρες Υψηλού Κινδύνου),– στα «μερικώς συμμορφούμενα», «προσωρινά μερικώς συμμορφούμενα» ή «μη- συμμορφούμενα» χώρες/κράτη από τον Οργανισμό Οικονομικής Συνεργασίας και Ανάπτυξης (ΟΟΣΑ) και το Παγκόσμιο φόρουμ αυτού για τη Διαφάνεια και την Ανταλλαγή Πληροφοριών για Φορολογικούς Σκοπούς με βάση το διεθνές πρότυπο για την ανταλλαγή πληροφοριών κατόπιν αιτήματος, όπως εκάστοτε ισχύει,– στη «Δημόσια Δήλωση» (Public Statement) της Ομάδας Χρηματοοικονομικής Δράσης (Financial Action Task Force – FATF) όπως εκάστοτε ισχύει δηλ. χώρες ή δικαιοδοσίες με τόσο σοβαρές στρατηγικές ελλείψεις όπου η FATF καλεί τα μέλη και τα μη μέλη της να εφαρμόσουν αντίμετρα ή για το οποίο η FATF καλεί τα μέλη της να εφαρμόσουν ενισχυμένα μέτρα δέουσας επιμέλειας,– στη δήλωση «Improving Global AML/CFT Compliance: On Going Process», όπως εκάστοτε ισχύει (δηλ. κράτος ή δικαιοδοσία με στρατηγικές αδυναμίες στα μέτρα τους για την πρόληψη ξεπλύματος χρήματος και την καταπολέμηση της χρηματοδότησης της τρομοκρατίας (AML/CFT) αλλά τα οποία έχουν δεσμευτεί σε ανάπτυξη σχεδίου δράσης με την FATF) Επιλέξιμες δαπάνες Οι επιλέξιμες δαπάνες που δύναται να περιλαμβάνονται στα επιλέξιμα επενδυτικά σχέδια που χρηματοδοτούνται με δάνεια του ΤΑΑ θα πρέπει να πραγματοποιούνται εντός της ελληνικής επικράτειας και να περιλαμβάνουν: Αγορά, χρήση (αποσβέσεις/μισθώσεις) και διαμόρφωση γηπέδων Αγορά / κατασκευή και χρήση κτηρίων (αποσβέσεις/μισθώσεις) Αγορά / κατασκευή και χρήση εξοπλισμού (αποσβέσεις/μισθώσεις) Αγορά και χρήση οχημάτων (αποσβέσεις/μισθώσεις) Αγορά / κατασκευή και χρήση άυλων παγίων (αποσβέσεις/συνδρομές) (π.χ. εμπορικά σήματα, λογισμικά Η/Υ, συμφωνίες αδειών χρήσης κ.α.) Μετακινήσεις / εξοδολόγια Υπηρεσίες τρίτων Αναλώσιμα Λειτουργικά (επικοινωνία, ενέργεια, συντήρηση, μισθώματα, έξοδα διοίκησης, ασφάλιση κλπ.) Κόστος κεφαλαίων Μισθοδοσία συνδεδεμένη με το επενδυτικό σχέδιο Κεφάλαιο κίνησης (δαπάνες λειτουργίας, δαπάνες σχετικές με το συναλλακτικό κύκλωμα της επιχείρησης, ΦΠΑ, κ.λπ.) Δαπάνες προώθησης και επικοινωνίας (Marketing) ΕπισημάνσειςΗ αγορά γηπέδου είναι επιλέξιμη εφόσον είναι συνυφασμένη με το επενδυτικό σχέδιο και δεν ξεπερνά το 30% των επιλέξιμων δαπανών του επενδυτικού σχεδίου.Το άθροισμα του κεφαλαίου κίνησης και των δαπανών προώθησης και επικοινωνίας δεν μπορούν να ξεπερνούν το 30% των επιλέξιμων δαπανών του επενδυτικού σχεδίου. Αποκλειόμενες δραστηριότητες Αποκλείονται της χρηματοδότησης μέσω των δανείων του ΤΑΑ συγκεκριμένες δραστηριότητες, ή προϊόντα, που σχετίζονται με: Απαγορεύσεις από την κείμενη διεθνή/ευρωπαϊκή/εθνική νομοθεσία Περιορισμό ή παραβίαση των ατομικών δικαιωμάτων και ελευθεριών Αμυντικές δραστηριότητες που απαγορεύονται από το ισχύον διεθνές δίκαιο Τον καπνό (παραγωγή, διανομή, μεταποίηση και εμπόριο) Εξαιρέσεις των οικείων διατάξεων του Κανονισμού Horizon Europe Τυχερά παιχνίδια Εμπόριο του σεξ και συναφείς υποδομές, υπηρεσίες και μέσα Ζώντα ζώα για πειραματικούς και επιστημονικούς σκοπούς, εφόσον δεν υπάρχει εγγύηση για τη συμμόρφωση με την σχετική Ευρωπαϊκή Σύμβαση Ανάπτυξη ακινήτων (εξαιρούνται οι δραστηριότητες που σχετίζονται με τους στόχους του ΤΑΑ) 1 Χρηματοπιστωτικές δραστηριότητες που αποσκοπούν σε εκποίηση περιουσιακών στοιχείων καθώς και δραστηριότητες Τραπεζικών ιδρυμάτων και συνδεδεμένων επιχειρήσεων (εξαιρούνται επενδυτικά σχέδια εταιριών συνδεδεμένων με Τράπεζες οι οποίες δεν ασκούν χρηματοπιστωτικές και ασφαλιστικές δραστηριότητες και οι συμβάσεις συνάπτονται με τρίτο τραπεζικό ίδρυμα) Πυρηνικούς σταθμούς ηλεκτροπαραγωγής Ορυκτά καύσιμα, πετρέλαιο και άντληση φυσικού αερίου2 Το πλαίσιο του συστήματος εμπορίας δικαιωμάτων εκπομπής της ΕΕ (ΣΕΔΕ) για την επίτευξη των προβλεπόμενων εκπομπών αερίων του θερμοκηπίου που δεν είναι χαμηλότερες από τους σχετικούς δείκτες αναφοράς που ορίζονται στον Εκτελεστικό Κανονισμό (ΕΕ) 2021/447 της Επιτροπής Χώρους υγειονομικής ταφής αποβλήτων, αποτεφρωτήρες για την επεξεργασία αποβλήτων και μονάδες μηχανικής βιολογικής επεξεργασίας Μακροπρόθεσμη διάθεση αποβλήτων που μπορεί να βλάψει το περιβάλλον2 1 Ο εν λόγω αποκλεισμός δεν ισχύει ενδεικτικά για: α) κατασκευή νέων ενεργειακά αποδοτικών κτιρίων, β) επίτευξης ενεργειακής απόδοσης μέσω ανακαίνισης υφιστάμενου οικιστικού αποθέματος. 2 Ο εν λόγω αποκλεισμός δεν ισχύει για επενδύσεις για την παραγωγή ηλεκτρικής ενέργειας και/ή θερμότητας, καθώς και για σχετικές υποδομές μεταφοράς και διανομής, με χρήση φυσικού αερίου, τα οποία πληρούν τους όρους που καθορίζονται στο παράρτημα III της τεχνικής καθοδήγησης σχετικά με την εφαρμογή της αρχής της «μη πρόκλησης σημαντικής βλάβης» (2021/C 58/01), όπως: α) έργα για τα οποία δεν υπάρχει βιώσιμη εναλλακτική τεχνολογία, β) έργα που συνδέονται με την πρόληψη και τον έλεγχο της ρύπανσης, γ) έργα που διαθέτουν εγκαταστάσεις δέσμευσης και αποθήκευσης ή δέσμευσης και χρήσης διοξειδίου του άνθρακα, δ) βιομηχανικά ή ερευνητικά έργα που οδηγούν σε σημαντική μείωση των εκπομπών αερίου θερμοκηπίου σε σύγκριση με τους ισχύοντες δείκτες αναφοράς του συστήματος εμπορίας δικαιωμάτων εκπομπής. Διαδικασία Υποβολής Αίτησης Υποβάλλετε το αίτημά σας μέσω της πλατφόρμας Go Beyond greeceΗ Τράπεζα το προεγκρίνει και έπειτα αξιολογείται από Ανεξάρτητο Αξιολογητή. Εφόσον οριστικοποιηθεί η έγκριση, υπογράφεται η σύμβαση και εκταμιεύεται άμεσα το ποσό. Δείτε τις οδηγίες χρήσης της πλατφόρμας Go Beyond για την υποβολή της αίτησης σας. Δείτε αναλυτικά τα βήματα σε κάθε στάδιο της διαδικασίας, ώστε να αποκτήσετε γρήγορα και εύκολα δάνειο ΤΑΑ με συγχρηματοδότηση από την Αttica Bank. Δικαιολογητικά για το φάκελο του επενδυτικού σχεδίου Η λίστα με τα απαιτούμενα δικαιολογητικά, την Αίτηση Χρηματοδότησης και τα υποδείγματα των Υπεύθυνων Δηλώσεων αποτελούν Παράρτημα της Πρόσκλησης (Παράρτημα 1). Δείτε εδώ ενδεικτικά τα δικαιολογητικά που πρέπει να προσκομίσετε για την αξιολόγηση του επενδυτικού σχεδίου σας. Παρουσίαση Παρουσίαση Ταμείου Ανάκαμψης και Ανθεκτικότητας Κατεβάστε το αρχείο (6mb) Παρουσίαση Ταμείου Ανάκαμψης και Ανθ