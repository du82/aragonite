title = "Συμβουλές για ασφαλείς συναλλαγές από την Attica Bank - Attica Bank"
description = "Η ασφάλεια των συναλλαγών σας είναι προτεραιότητά μας. Ενημερωθείτε για τους ψηφιακούς κινδύνους και πώς να προστατευθείτε. Σας υπενθυμίζουμε ότι δεν θα σας ζητήσουμε ποτέ προσωπικούς κωδικούς…"
full_description = "Η ασφάλεια των συναλλαγών σας είναι προτεραιότητά μας. Ενημερωθείτε για τους ψηφιακούς κινδύνους και πώς να προστατευθείτε. Σας υπενθυμίζουμε ότι δεν θα σας ζητήσουμε ποτέ προσωπικούς κωδικούς πρόσβασης με κανένα τρόπο (τηλεφωνικά ή μέσω e-mail/viber/sms). Βεβαιωθείτε ότι χρησιμοποιείτε την υπηρεσία Attica e-banking αποκλειστικά μέσω της επίσημης ιστοσελίδας και όχι μέσω συνδέσμων (links) σε άλλες ιστοσελίδες από μηχανές αναζήτησης ή e-mails, όταν πληκτρολογείτε τους κωδικούς πρόσβασης. Σε περίπτωση οποιασδήποτε υπόνοιας απάτης, επικοινωνήστε άμεσα μαζί μας. Ενημερωθείτε για τους ψηφιακούς κινδύνους και πώς να προστατευθείτε. Ασφαλείς συναλλαγές Χρήσιμες συμβουλές για ασφαλείς συναλλαγές Στην Attica Bank έχοντας ως γνώμονα τη βέλτιστη εξυπηρέτησή σας, συνεχίζουμε να σας προσφέρουμε ένα λειτουργικό περιβάλλον υψηλού επιπέδου, για να πραγματοποιείτε με ασφάλεια και αξιοπιστία τις συναλλαγές σας. Παρακάτω παραθέτουμε μερικές χρήσιμες συμβουλές που θα διατηρήσουν την ασφάλεια στις συναλλαγές σας. Διασφαλίστε τους κωδικούς και την κάρτα σας: Οι κωδικοί Username (Κωδικός Πελάτη) και Password (Μυστικός Κωδικός) που χρησιμοποιείτε για την είσοδό σας στο e-banking και στο mobile banking είναι αυστηρά προσωπικοί. Επιλέγετε σύνθετο Password (Μυστικό Κωδικό) και αποφεύγετε τις φόρμες αυτόματης συμπλήρωσης κωδικών. Η διαφύλαξη των κωδικών πρόσβασης είναι ευθύνη σας. Σε περίπτωση που διαπιστώσετε ή υποπτευθείτε κλοπή ή υποκλοπή, οφείλετε να ειδοποιήσετε αμέσως την Attica Bank. Ελέγχετε καθημερινά ότι η κάρτα σας βρίσκεται στην κατοχή σας και ενημερώστε άμεσα την Τράπεζα για οποιαδήποτε μη εξουσιοδοτημένη χρήση από τρίτους. Το PIN είναι απόλυτα εμπιστευτικό και δεν πρέπει να το γνωρίζει κανένας άλλος εκτός από εσάς. Το PIN δεν θα πρέπει να φυλάσσεται ποτέ μαζί με την κάρτα σας. Αποφύγετε να χρησιμοποιείτε ως PIN προσωπικά σας στοιχεία, που μπορούν εύκολα να γίνουν αντιληπτά από τρίτους (π.χ. έτος ή ημερομηνία γέννησης δικά σας ή μελών της οικογενείας σας) ή να χρησιμοποιείτε το ίδιο PIN για περισσότερες από μία κάρτες. Κατά τη χρήση της κάρτας σας σε ATM ή POS καλύπτετε πάντα το πληκτρολόγιο κατά την εισαγωγή του PIN σας. Μην εμπιστεύεστε για οποιονδήποτε λόγο τη χρήση της κάρτας σας σε τρίτους, γνωστοποιώντας τους το PIN σας. Η Attica Bank δεν θα σας ζητήσει ποτέ και με κανέναν τρόπο (τηλεφωνικά ή μέσω e-mail/sms) τους κωδικούς σας. Παραπλανητικά μηνύματα (phishing-mails) μέσω ηλεκτρονικού ταχυδρομείου ή και sms έχουν στόχο να υποκλέψουν προσωπικά σας στοιχεία. Τα μηνύματα αυτά υποτίθεται ότι έχουν αποσταλεί από την Attica Bank και προτρέπουν τον παραλήπτη να μεταβεί σε συγκεκριμένη σελίδα, προκειμένου να πληκτρολογήσει τα προσωπικά του στοιχεία (π.χ. Username, Password κ.λ.π.). Διαγράψτε αμέσως τυχόν e-mails που σας προτρέπουν να δώσετε προσωπικά σας στοιχεία ή στοιχεία σύνδεσης στις ψηφιακές υπηρεσίες της Τράπεζας, να επισκεφθείτε ιστοσελίδες ή να ανοίξετε συνημμένα αρχεία. Τηλεφωνικές κλήσεις (voice-phishing [vishing]) από υποτιθέμενους εκπροσώπους της Τράπεζας έχουν στόχο να υποκλέψουν προσωπικά σας στοιχεία (π.χ. αριθμό λογαριασμού, κωδικό πελάτη, ΑΦΜ, ΑΔΤ, κλπ.) και πρέπει να αγνοούνται. Προστατέψτε τον υπολογιστή / κινητό σας από κακόβουλες ενέργειες: Ενημερώνετε με νεότερες εκδόσεις το λειτουργικό σύστημα του υπολογιστή σας και τα προγράμματα πλοήγησης (browsers) ή τυχόν εφαρμογές. Θωρακίστε τον υπολογιστή και το κινητό σας με προγράμματα προστασίας, όπως Firewall, Antivirus, Antispyware, τα οποία θα πρέπει πάντα να έχετε ενεργοποιημένα και ενημερωμένα με την τελευταία διαθέσιμη έκδοση. Πραγματοποιήστε τις συναλλαγές σας από ασφαλή δίκτυα και διαδικτυακούς τόπους. Αποφεύγετε τη χρήση υπολογιστών σε δημόσιους χώρους ή τη χρήση υπολογιστών τρίτων. Χρησιμοποιείτε την υπηρεσία Attica e-banking μόνο μέσω των επίσημων ιστοσελίδων της Attica Bank (https://www.atticabank.gr, ή απευθείας στο https://ebanking.atticabank.gr) και όχι μέσω συνδέσμων (links) που εμπεριέχονται σε άλλες ιστοσελίδες (sites), μηχανές αναζήτησης ή e-mail. Επαναφέρετε το κινητό σας στις εργοστασιακές ρυθμίσεις, πριν το μεταβιβάσετε σε άλλο πρόσωπο ή το ανακυκλώσετε. Συνήθεις τρόποι Εξαπάτησης Με αφορμή την ενίσχυση της ασφάλειας των συναλλαγών σας, που αποτελεί μόνιμη προτεραιότητα για εμάς στην Attica Bank, θα θέλαμε να σας προσφέρουμε τρόπους για να προσττευτείτε. Η ηλεκτρονική απάτη έχει πολλά πρόσωπα. Μπορείτε να μάθετε να τα αναγνωρίζετε αλλά και να εκπαιδευτείτε σε σωστούς τρόπους αντιμετώπισής τους.Οι τρόποι που οι επιτήδειοι χρησιμοποιούν για να εξαπατήσουν είναι πολλοί, οι συνηθέστεροι εκ των οποίων είναι οι ακόλουθοι: Caller ID Spoofing (αλλαγή ταυτότητας του αριθμού κλήσης και υποκλοπή πραγματικού αριθμού) απάτη του CEO (CEO Fraud), απάτη μέσω τιμολογίων και λοιπών παραστατικών (invoice Fraud), απατηλές τηλεφωνικές κλήσεις (vishing), απατηλά μηνύματα SMS (smishing), απατηλά μηνύματα ηλεκτρονικού ταχυδρομείου (phishing), απατηλές ιστοσελίδες τραπεζών (spoofed bank websites), απάτη μέσω διαδικτυακών ραντεβού (romance scam), κλοπή δεδομένων προσωπικού χαρακτήρα (personal data theft), απάτες σχετιζόμενες με επενδύσεις (investment scams), απάτες σε αγορές μέσω διαδικτύου (online shopping scams), απάτες υποτιθέμενης τεχνικής υποστήριξης, ηλεκτρονικές απάτες μέσω τηλεφωνικής επικοινωνίας, κλοπές στοιχείων ταυτότητας, και απάτες μέσω αλλαγής κάρτας SIM (SIM Swapping) Δείτε τα σχετικά infographic πατώντας εδώ Για περισσότερες πληροφορίες μπορείτε επίσης να επισκεφθείτε την ιστοσελίδα της Ελληνικής Ένωσης Τραπεζών και την ιστοσελίδα της Europol με νέες συμβουλές ενάντια σε προσπάθειες εξαπάτησης στον Κυβερνοχώρο. Ισχυρή Ταυτοποίηση Πελάτη Ενημέρωση των καταναλωτών για την ασφάλεια των συναλλαγών τους με κάρτες πληρωμών σε περιβάλλον ηλεκτρονικού εμπορίου Από τον Ιανουάριο του 2021, ξεκίνησε σε πανευρωπαϊκό και εθνικό επίπεδο, σύμφωνα με την Οδηγία (ΕΕ) 2015/2366 «για τις υπηρεσίες πληρωμών στην εσωτερική αγορά» (PSD 2) και τον Νόμο 4537/2018 (ΦΕΚ Α’ 84), η «ισχυρή ταυτοποίηση πελάτη» (strong customer authentication). Η σχετική διαδικασία είναι απαραίτητη όταν ένας καταναλωτής διενεργεί συναλλαγή πληρωμής με κάρτα σε περιβάλλον ηλεκτρονικού εμπορίου. Οι απαιτήσεις για την ισχυρή ταυτοποίηση συνιστούν υποχρέωση για όλους τους παρόχους υπηρεσιών πληρωμών (π.χ. τράπεζες, ιδρύματα πληρωμών, ιδρύματα ηλεκτρονικού χρήματος, κ.λπ.), και τέθηκαν, προκειμένου να επιτευχθεί η μέγιστη δυνατή ασφάλεια στις συναλλαγές των πελατών-κατόχων καρτών πληρωμών (χρεωστικών, πιστωτικών και προπληρωμένων). Ως εκ τούτου, οι τράπεζες μέλη της ΕΕΤ, ακολουθώντας τους κανόνες της ισχύουσας νομοθεσίας, δεν αποδέχονται και απορρίπτουν συναλλαγές που δεν ανταποκρίνονται στις νέες απαιτήσεις ασφάλειας. Οι μη αποδεκτές συναλλαγές οφείλονται κατά κύριο λόγο στην έλλειψη προσαρμογής της επιχείρησης ηλεκτρονικού εμπορίου ή/και στη μη έγκαιρη υιοθέτηση από τους κατόχους των καρτών πληρωμής των οδηγιών της τράπεζας συνεργασίας τους. Τι είναι η ισχυρή ταυτοποίηση πελάτη; Η ισχυρή ταυτοποίηση πελάτη είναι ένα νέο σύνολο κανόνων, οι οποίοι μεταβάλλουν τον τρόπο με τον οποίο ταυτοποιούνται οι καταναλωτές όταν πραγματοποιούν αγορές σε περιβάλλον ηλεκτρονικού εμπορίου, προκειμένου να προστατευτούν ακόμα περισσότερο από περιστατικά απάτης. Πιο συγκεκριμένα, ως «ισχυρή ταυτοποίηση πελάτη» νοείται η διαδικασία ελέγχου της ταυτότητας του κατόχου της κάρτας πληρωμών με τη χρήση δυο (2) ή περισσότερων στοιχείων που αφορούν: γνώση (κάτι που μόνο ο χρήστης γνωρίζει), όπως ένα μυστικό κωδικό ή την απάντηση σε μία ερώτηση που μπορεί να απομνημονευθεί, κατοχή (κάτι που μόνο ο χρήστης κατέχει), όπως κατοχή ενός SMS OTP που έλαβε ή το κινητό του τηλέφωνο, και κάποιο μοναδικό φυσικό (εγγενές) χαρακτηριστικό του, όπως το δακτυλικό του αποτύπωμα. Τα στοιχεία αυτά απαιτείται αφενός να είναι ανεξάρτητα, με την έννοια ότι η παραβίαση του ενός δεν θέτει σε κίνδυνο την αξιοπιστία των υπολοίπων, και αφετέρου να είναι σχεδιασμένα κατά τέτοιο τρόπο, ώστε να προστατεύεται η εμπιστευτικότητα των δεδομένων ταυτοποίησης. Για παράδειγμα, ο εκδότης (π.χ. τράπεζα) μιας κάρτας πληρωμών μπορεί να χρησιμοποιήσει έναν από διάφορους τρόπους για να επαληθεύσει την εκτέλεση μιας πράξης πληρωμής, όπως κωδικός μιας χρήσης (ΟΤΡ) μέσω γραπτού μηνύματος SMS/Viber σε συνδυασμό με κωδικό/κωδικούς που μόνο ο πελάτης γνωρίζει (π.χ. κωδικούς Web Banking), ειδική εφαρμογή (app) φορητής συσκευής (για κινητό τηλέφωνο, tablet), χρήση βιομετρικού στοιχείου (π.χ. δακτυλικό αποτύπωμα) του πελάτη στο mobile banking της τράπεζας, κ.λπ. Οι τράπεζες-μέλη της Ελληνικής Ένωσης Τραπεζών προχώρησαν στις αναγκαίες αλλαγές προκειμένου να επιτρέψουν στους καταναλωτές πελάτες τους να ταυτοποιούνται με τρόπο σύμφωνο προς τις νέες απαιτήσεις της ευρωπαϊκής και ελληνικής νομοθεσίας. Για περισσότερες πληροφορίες ενημερωθείτε εδώ"
