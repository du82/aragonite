description = "Η δύναμη της άμεσης χρηματοδότησης βρίσκεται στο πρόγραμμα Προεξόφλησης Άτοκων Δόσεων από την Attica Bank. Μέσω αυτής της υπηρεσίας, εξασφαλίζετε αυξημένη ευελιξία στις πωλήσεις και προσφέρετε στους…"
full_description = "Η δύναμη της άμεσης χρηματοδότησης βρίσκεται στο πρόγραμμα Προεξόφλησης Άτοκων Δόσεων από την Attica Bank. Μέσω αυτής της υπηρεσίας, εξασφαλίζετε αυξημένη ευελιξία στις πωλήσεις και προσφέρετε στους πελάτες σας ελκυστικά προγράμματα άτοκων δόσεων με την επιλογή του αριθμού των δόσεων. Παράλληλα, διασφαλίζετε τη διατήρηση της ρευστότητας ενισχύοντας την ανάπτυξη και την ευελιξία της επιχείρησής σας. Με μια γρήγορη ματιά 1 Ύψος ΧρηματοδότησηςΑπό €10.000 2 Έξοδα ΔανείουΠάγιο €300 / ετήσια έξοδα ανανέωσης ορίου πιστοδότησης 3 Τύπος ΧρηματοδότησηςΑνοιχτός Αλληλόχρεος Λογαριασμός χρηματοδότησης ανάλογα με το ύψος των πωλήσεων της επιχείρησης (αφορά πώληση προϊόντων και όχι υπηρεσιών), με άτοκες δόσεις μέσα από τα POS της Attica Bank 4 ΕπιτόκιοΚυμαινόμενο επιτόκιο, 3Μ Euribor πλέον περιθωρίου (spread) από 3% έως 6,75% (πλέον Εισφοράς Ν.128/75, σήμερα 0,60%). Το επιτόκιο εξαρτάται από την πιστοληπτική ικανότητα του πελάτη. 5 ΔιάρκειαΑόριστη με ετήσια ανανέωση. 6 Πλήθος δόσεων προεξόφλησηςΑπό 2 έως 36 άτοκες δόσεις 7 ΕκτοκισμόςΤριμηνιαίος Επιπλέον Παροχές Άμεση έγκριση και ενεργοποίηση του προγράμματος. Οn line παρακολούθηση όλων των πιστώσεων που πραγματοποιούνται στον επαγγελματικό λογαριασμό, με Attica e-banking και Attica Mobile. Aνάληψη των ποσών που πιστώνονται στον λογαριασμό σας με τη χρήση της χρεωστικής κάρτας Visa Debit Business. Ενημερωθείτε Επισκεφθείτε ένα κατάστημά μας. Φροντίστε να έχετε μαζί σας όλα τα απαραίτητα έγγραφα."
