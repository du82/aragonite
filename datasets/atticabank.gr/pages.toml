full_description = "Συχνές Ερωτήσεις Τι είναι το Attica Mobile; Το Attica Mobile είναι η υπηρεσία Mobile Banking της Attica Bank. Μέσω αυτής, αφού την εγκαταστήσετε στην συσκευή σας (κινητό τηλέφωνο ή tablet), σας δίνεται η δυνατότητα να διαχειρίζεστε τους λογαριασμούς σας και να πραγματοποιείτε εγχρήματες συναλλαγές, μέσω πληθώρας επιλογών, 24 ώρες το 24ωρο, 7 μέρες την εβδομάδα εύκολα, γρήγορα και με ασφάλεια. Η εφαρμογή Attica Mobile είναι διαθέσιμη σε Google Play και App Store. Ποιες εκδόσεις υποστηρίζονται; Οι υποστηριζόμενες εκδόσεις λειτουργικών συστημάτων για το Attica Mobile είναι οι εξής: Android: 11, 12, 13 iOS: 15, 16, 17 Πώς εγγράφομαι στο Attica Mobile; Eπιλέξτε την On-line Εγγραφή στο Attica e-banking και ακολουθήστε ένα-ένα τα βήματα. Η διαδικασία είναι απλή και κρατάει μόλις λίγα λεπτά. Απαραίτητη προϋπόθεση για την εγγραφή σας είναι: να έχετε τουλάχιστον έναν ενεργό λογαριασμό ή μία ενεργή πιστωτική ή χρεωστική κάρτα στην Attica Bank να έχετε δηλώσει τον αριθμό του κινητού σας τηλεφώνου στην Τράπεζα να έχετε δηλώσει τη διεύθυνση του ηλεκτρονικού σας ταχυδρομείου (e-mail) στην Τράπεζα Οι κωδικοί σας εκδίδονται online και μπορείτε άμεσα να συνδεθείτε στην υπηρεσία Attica Mobile & Attica e-banking Εναλλακτικά, μπορείτε να εγγραφείτε στην υπηρεσία σε οποιοδήποτε κατάστημα της Attica Bank. Πώς συνδέομαι στο Attica Mobile; Για να συνδεθείτε στην εφαρμογή του Attica Mobile υπάρχουν τρείς (3) διαφορετικοί τρόποι: Μέσω των Κωδικών Πρόσβασης: Εισάγετε τον Κωδικό Πελάτη (username) και το Μυστικό Κωδικό (password) που χρησιμοποιείτε στο Attica e-banking. Μέσω PIN: Επιλέξτε το user avatar και αν η συσκευή σας είναι εγγεγραμμένη θα μεταφερθείτε στην αντίστοιχη οθόνη που πρέπει να εισάγετε τον κωδικό PIN που έχετε ορίσει κατά τη «Διαχείριση Συσκευών». Μέσω Fingerprint ή Faceid (εφόσον η συσκευή σας το υποστηρίζει): Επιλέξτε το user avatar και αν η συσκευή σας είναι εγγεγραμμένη θα μεταφερθείτε στην αντίστοιχη οθόνη που σας ενημερώνει για το πότε πρέπει να εισάγετε το fingerprint σας είτε για το πότε πρέπει να αναγνωριστεί το faceid από τη συσκευή σας. Έχω ξεχάσει τους Κωδικούς μου Πρόσβασης, τι πρέπει να κάνω; Σε περίπτωση που έχετε κλειδώσει ή έχετε ξεχάσει το Μυστικό σας Κωδικό (Password), μπορείτε να πραγματοποιήσετε ξελείδωμα χρήστη και αποστολή νέου Μυστικού Κωδικού (Password), μέσω του Attica e-banking ή Attica Mobile. Εναλλακτικά, επικοινωνήστε με την Υπηρεσία Τηλεφωνικής Εξυπηρέτησης Πελατών της Attica Bank στο τηλέφωνο 210-3669000 και ζητήστε την αποστολή νέων κωδικών πρόσβασης στις ψηφιακές υπηρεσίες. O λογαριασμός μου έχει μπλοκαριστεί. Ποιά είναι η διαδικασία που πρέπει να ακολουθηθεί; Για την προστασία σας, ο λογαριασμός του Χρήστη μπλοκάρεται μετά από μια σειρά ανεπιτυχών προσπαθειών εισαγωγής του Μυστικού Κωδικού Πελάτη. Σε αυτήν την περίπτωση, επικοινωνήστε με επικοινωνήστε, 24χ7, με την Εξυπηρέτηση Πελατών της Attica Bank στο τηλέφωνο 210-3669000 (από σταθερό τηλέφωνο εντός Ελλάδας, με χρέωση μίας αστικής μονάδας). Οι αρμόδιοι υπάλληλοι θα σας καθοδηγήσουν σχετικά με τις ενέργειες που πρέπει να ακολουθηθούν ανάλογα με το λόγο για τον οποίο μπλοκαρίστηκε ο λογαριασμός σας. Σε οποιαδήποτε περίπτωση η Τράπεζα δεν θα σας ζητήσει ποτέ να αποκαλύψετε τον Μυστικό Κωδικό Πελάτη. Υπάρχει δυνατότητα αλλαγής των Κωδικών μου Πρόσβασης; Ναι, έχετε τη δυνατότητα να αλλάξετε τους Κωδικούς Πρόσβασής σας μέσω του Attica Mobile. Επιλέγοντας το εικονίδιο «Χρήστης», θα βρείτε τις επιλογές «Αλλαγή Κωδικού Πελάτη» και «Αλλαγή Μυστικού Κωδικού» όπου μπορείτε να αλλάξετε αντίστοιχα τους προαναφερθέντες κωδικούς. Σας υπενθυμίζουμε ότι σε περίπτωση αλλαγής των Κωδικών Πρόσβασης μέσω ενός καναλιού (Attica e-banking ή Attica Mobile), αυτόματα η αλλαγή αυτή τίθεται σε ισχύ και αφορά στην είσοδό σας σε οποιοδήποτε κανάλι. Σημειώνεται ότι ο Μυστικός Κωδικός (Password) δεν πρέπει να περιέχει τον Κωδικό Πελάτη (Username), και θα ισχύει για 3 μήνες. Τι είναι οι Κωδικοί Μιας Χρήσης (One–Time–Password ή OTP); Για να έχετε πλήρη πρόσβαση και δυνατότητα διενέργειας συναλλαγών (διαχειριστικών και εγχρήματων), θα χρειάζεται να εισάγετε Κωδικό μιας Χρήσης (OTP). Ο Κωδικός μιας Χρήσης (One-Time-Password ή OTP) ενισχύει ακόμη περισσότερο την ασφάλεια των συναλλαγών σας, καθώς δημιουργείται βάσει των στοιχείων της συναλλαγής που έχετε επιλέξει να ολοκληρώσετε και μπορεί να χρησιμοποιηθεί αποκλειστικά και μόνο για την συγκεκριμένη συναλλαγή. Πιο συγκεκριμένα, για να έχετε πλήρη πρόσβαση και δυνατότητα διενέργειας συναλλαγών (διαχειριστικών και εγχρήματων), θα χρειάζεται να εισάγετε Κωδικό μιας Χρήσης (OTP) για επιπλέον ασφάλεια για την εκτέλεση της συναλλαγής. Ο Κωδικός μιας Χρήσης αποστέλλεται μέσω γραπτού μηνύματος SMS στην συσκευή κινητού τηλεφώνου που έχετε δηλώσει στην Τράπεζα κατά την αίτησή σας και στο e-mail που έχετε δηλώσει. Ο πρόσθετος κωδικός μιας χρήσης θα σας ζητείται μόνο σε: Μεταφορά χρημάτων σε τρίτους εντός και εκτός τράπεζας και μέσω IRIS payments (μόνο εφόσον ξεπεράσετε το ποσό των €1000 αθροιστικά μέσα στην ίδια ημέρα, κάνοντας είτε μια μεμονωμένη συναλλαγή είτε περισσότερες) Αλλαγή κωδικού πελάτη (Username) και μυστικού κωδικού (Password) Εγγραφή και μεταβολή συσκευής κινητού τηλεφώνου ή τάμπλετ Μεταβολή ημερήσιων ορίων για μεταφορές & πληρωμές Ενημέρωση προσωπικών στοιχείων ή αριθμού κινητού τηλεφώνου μέσω eGov-KYC. Εάν χάσετε την τηλεφωνική σας συσκευή, επικοινωνήστε άμεσα με την Υπηρεσία Τηλεφωνικής Εξυπηρέτησης Πελατών της Attica Bank στο 210-3669000 για να απενεργοποιηθεί η υπηρεσία αποστολής Κωδικών μιας Χρήσης μέσω SMS. Εισάγω τον Κωδικό μιας Χρήσης (One–Time–Password ή OTP) και αυτός δεν γίνεται αποδεκτός. Γιατί μπορεί να συμβαίνει αυτό; Ο Κωδικός μιας Χρήσης δεν γίνεται αποδεκτός στις εξής περιπτώσεις: Έχει ξεπεραστεί ο μέγιστος «χρόνος ζωής» του Κωδικού μιας Χρήσης που είναι τα 2 λεπτά. Έχουν προηγηθεί 3 συνεχόμενες λανθασμένες προσπάθειες εισαγωγής του Κωδικού μιας Χρήσης. Όταν έχετε ζητήσει 5 συνεχόμενες φορές Κωδικό μιας Χρήσης και δεν τον έχετε χρησιμοποιήσει. Όταν προσπαθείτε να καταχωρήσετε Κωδικό μιας Χρήσης που παραλάβατε από διαφορετική συναλλαγή Όταν η συσκευή παραγωγής Κωδικών μιας Χρήσης (Hardware Token) έχει αποσυγχρονιστεί. Στις παραπάνω περιπτώσεις, επικοινωνήστε με την Εξυπηρέτηση Πελατών της Attica Bank στο τηλέφωνο 210-3669000 , 210-3669600 ή 801-11-500900 (από σταθερό τηλέφωνο εντός Ελλάδας, με χρέωση μίας αστικής μονάδας). Ποιες εγχρήματες συναλλαγές μπορώ να πραγματοποιήσω; Οι συναλλαγές που μπορείτε να πραγματοποιήσετε μέσω της υπηρεσίας Attica Mobile είναι οι εξής: Μεταφορές μεταξύ των λογαριασμών σας Μεταφορές σε λογαριασμούς τρίτων της Attica Bank Μεταφορές μέσω ΔΙΑΣ σε άλλες τράπεζες του εσωτερικού ή του εξωτερικού (εντός SEPA) Πληρωμή λογαριασμών σε Οργανισμούς/Εταιρείες Κοινής ωφέλειας Φόρτιση προπληρωμένης κάρτας Πληρωμή Πιστωτικών καρτών της Attica Bank Πληρωμή Πιστωτικών καρτών άλλων τραπεζών Δημιουργία Πάγιων Εντολών για Πληρωμή λογαριασμών Πώς μπορώ να παραλάβω απόδειξη για κάποια εγχρήματη συναλλαγή που έχω πραγματοποιήσει μέσω του Attica Mobile; Απόδειξη συναλλαγής μπορείτε να πάρετε με δυο τρόπους: 1. Αφού πραγματοποιήσετε κάποια εγχρήματη συναλλαγή μέσω του Attica Mobile, κι αυτή ολοκληρωθεί με επιτυχία, τότε εμφανίζεται στην οθόνη σας η επιλογή «Απόδειξη Συναλλαγής». Επιλέγοντάς την, εμφανίζεται στην οθόνη σας η Απόδειξη Συναλλαγής. Επιλέγοντας «Κοινή χρήση», έχετε δυο επιμέρους επιλογές: να αποθηκεύσετε την απόδειξη στην συσκευή σαςνα αποστείλετε την απόδειξη μέσω κάποιας άλλης εφαρμογής (π.χ email) 2. Επιλέγοντας «Ιστορικό ενεργειών» από το μενού που εμφανίζεται με την επιλογή του εικονιδίου «Χρήστης», μπορείτε να δείτε τις εγχρήματες συναλλαγές που έχετε πραγματοποιήσει και να «κατεβάσετε» (download) τις αποδείξεις παραλαβής. Τι είναι οι αγαπημένοι λογαριασμοί στο Attica Mobile; Οι αγαπημένοι λογαριασμοί είναι οι λογαριασμοί που ορίζετε εσείς, για να εμφανίζονται κατά την είσοδό σας στην εφαρμογή Attica Mobile. Για να ορίσετε έναν Λογαριασμό ως αγαπημένο, επιλέγετε το εικονίδιο «καρδούλα» που βρίσκεται άνω δεξιά (iOS) είτε μέσα στην καρτέλα του κάθε λογαριασμού (Android). Μπορώ να αποθηκεύσω συναλλαγές που εκτελώ συχνά; Μέσω της συναλλαγής “πρότυπα” μορείτε να έχετε αποθηκευμένες συναλλαγές που χρησιμοποιείτε για μεταφορές ή/και πληρωμές και τις επαναλαμβάνετε συχνά. Με τη δημιουργία προτύπων η διαδικασία εκτέλεσης μιας συναλλαγής γίνεται πιο γρήγορα και η περίπτωση λανθασμένης πληκτρολόγησης των στοιχείων της συναλλαγής μειώνεται. Τα πρότυπα χωρίζονται σε δυο (2) βασικές κατηγορίες : Πρότυπα εγχρήματης συναλλαγής.Πρότυπα δικαιούχου Μπορείτε να δημιουργήσετε πρότυπο εγχρήματης συναλλαγής στο στάδιο λήψης της απόδειξης συναλλαγής σε μια εγχρήματη συναλλαγή σας που ολοκληρώσατε επιτυχώς. Επίσης έχετε τα “πρότυπα δικαιούχων”, όπου μπορείτε να τα δημιουργήσετε μέσω του Attica e-banking μόνο. Μπορείτε να τα χρησιμοποιήσετε ως αποθηκευμένους δικαιούχους για τις εγχρήματες συναλλαγές σας μέσω του Attica Mobile και μέσω του Attica e-banking. Τι είναι οι ειδοποιήσεις (Alerts); Για την προστασία σας και την ενημέρωσή σας σχετικά με την αλλαγή των Κωδικών Πρόσβασής σας στο Attica e-banking ή στο Attica Mobile, η Τράπεζα σας αποστέλλει Ειδοποιήσεις (Alerts) στο κινητό σας τηλέφωνο μέσω αποστολής SMS ή/και στο e-mail σας. Τις Ειδοποιήσεις αυτές δεν έχετε την επιλογή να μην τις παραλάβετε, για να αποφευχθεί οποιαδήποτε περίπτωση παραβίασης ασφάλειας ή πιθανής απάτης. Για τις εγχρήματες συναλλαγές σας μέσω του Attica e-banking ή Attica Mobile μπορείτε ο ίδιος να επιλέξετε αν θα λαμβάνετε ή όχι ειδοποιήσεις. Οι ειδοποιήσεις αυτές μπορούν να λαμβάνονται στο κινητό σας τηλέφωνο μέσω αποστολής SMS ή/και στο e-mail σας και αφορούν την ενημέρωσή σας σχετικά με κάποια εγχρήματη συναλλαγή που έχει πραγματοποιηθεί. Τι είναι τα secure messages; Μέσω της λειτουργικότητας των secure messages, επικοινωνείτε με την Τράπεζα με ασφαλή τρόπο. Μπορείτε να μας στείλετε ένα μήνυμα για οποιοδήποτε θέμα σας ενδιαφέρει, να επισυνάψετε κάποιο συνοδευτικό αρχείο και θα επικοιωνήσουμε εμείς μαζί σας. Μπορώ να βλέπω το αφορολόγητο; Μέσα από την εφαρμογή Attica e-banking και Attica Mobile μπορείτε να πληροφορηθείτε για το «Αφορολόγητο», δηλαδή για το ποσό των δαπανών που πραγματοποιήσατε με χρήση των ηλεκτρονικών μέσων πληρωμής από οποιοδήποτε κανάλι και οι οποίες λαμβάνονται υπόψη στο αφορολόγητο ποσό. Υπάρχει ανάλυση των δαπανών αυτών ανά κατηγορία για τα δύο τελευταία οικονομικά έτη. Πώς πρέπει να προστατεύω τους Κωδικούς Πρόσβασής μου; Οι Κωδικοί Πρόσβασης χρησιμεύουν για την αναγνώρισή σας από το σύστημα ως χρήστη για τη σύνδεσή σας στο Attica Mobile. Για την δική σας μέγιστη ασφάλεια: Ο Μυστικός Κωδικός Πελάτη (Password) είναι αυστηρά προσωπικός και απόρρητος. Σας συνιστούμε να μην τον καταγράφετε και να μην τον αποκαλύπτετε σε τρίτους Μην χρησιμοποιείτε Μυστικούς Κωδικούς που εύκολα μπορεί κάποιος να υποθέσει όπως π.χ. ημερομηνίες γέννησης, ονόματα, τηλέφωνα κ.λ.π Εάν υποψιαστείτε ότι με οποιονδήποτε τρόπο έχει διαρρεύσει ο Μυστικός σας Κωδικός (Password), τροποποιείστε τον άμεσα μέσω της επιλογής «Αλλαγή Μυστικού Κωδικού» στο μενού που θα εμφανιστεί μετά την επιλογή του εικονιδίου «Χρήστης» Αποφεύγετε να κάνετε συναλλαγές στο Attica Mobile από smartphones και tablets τρίτων. Πόσο ασφαλής είναι η υπηρεσία του Attica Mobile; Η Attica Bank φροντίζει για την μέγιστη δυνατή ασφάλεια των συναλλαγών σας, εφαρμόζοντας συστήματα προηγμένης τεχνολογίας και αναγνωρισμένα πρωτόκολλα ασφαλείας για την πρόσβασή σας στις υπηρεσίες Attica e-banking. Παρέχουμε προηγμένες μεθόδους διασφάλισης των συναλλαγών που πραγματοποιούνται μέσω Internet, Smartphone ή Tablet διασφαλίζοντας έτσι το απόρρητο των προσωπικών και τραπεζικών σας δεδομένων. Από την πλευρά σας, είναι σημαντικό να χρησιμοποιείτε υπολογιστές και συσκευές που ελέγχετε οι ίδιοι και να μην αποκαλύπτετε σε τρίτους τους κωδικούς σας. Επιπλέον, ο 8ψήφιος κωδικός (One Time Password) που λαμβάνετε κάθε φορά που επιθυμείτε να πραγματοποιήσετε τόσο διαχειριστικές όσο και εγχρήματες συναλλαγές, ενισχύει ακόμη περισσότερο την ασφάλεια των συναλλαγών σας, καθώς δημιουργείται βάσει των στοιχείων της συναλλαγής που έχετε επιλέξει να ολοκληρώσετε και μπορεί να χρησιμοποιηθεί αποκλειστικά και μόνο για την συγκεκριμένη συναλλαγή. Γιατί να χρησιμοποιήσω το Attica Mobile; Με τη χρήση της υπηρεσίας Attica Mobile εξασφαλίζετε: Πρόσβαση στους λογαριασμούς σας 24/7 Ευκολία και ταχύτητα στην ενημέρωση και στην πραγματοποίηση των καθημερινών τραπεζικών συναλλαγών σας. Υψηλή ασφάλεια μέσω αναγνωρισμένων πρωτοκόλλων ηλεκτρονικής ασφάλειας. Διασφάλιση του απορρήτου των προσωπικών και τραπεζικών δεδομένων σας."
