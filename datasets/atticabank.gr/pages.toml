title = "Tαμείο Συγχρηματοδότησης “Ταμείο Δανείων Δίκαιης Αναπτυξιακής Μετάβασης” - Attica Bank"
description = """
Η δράση «Ταμείο Δανείων ΔΑΜ» αφορά στη χορήγηση νέων δανείων με ευνοϊκούς όρους προς ΜμΕ επιχειρήσεις (υφιστάμενες και νεοσυσταθείσες) επιλέξιμων ΚΑΔ, οι οποίες δραστηριοποιούνται στις  περιοχές Δίκαιης Αναπυξιακής Μετάβασης (ΔΑΜ), για την κάλυψη των χρηματοδοτικών τους αναγκών (κεφάλαια κίνησης ειδικού σκοπού και δάνεια επενδυτικού σκοπού), με σκοπό την ομαλή και δίκαιη μετάβαση στη μεταλιγνιτική εποχή.
Τα δάνεια θα παρέχονται με χαμηλότερο χρηματοοικονομικό κόστος:

λόγω της άτοκης συμμετοχής των κεφαλαίων του Ταμείου στο δάνειο κατά 50%,
της εφαρμογής περιθωρίου επιτοκίου στα κεφάλαια της Τράπεζας χαμηλότερου σε σχέση με το περιθώριο που θα εφαρμοζόταν σε ανάλογη χρηματοδότηση εκτός Ταμείου, αλλά και
της μερικής τριετούς επιδότησης του επιτοκίου έως 3% ετησίως."""
full_description = "Με μια γρήγορη ματιά Η Attica Bank συμμετέχει στα Ταμεία Δίκαιης Μετάβασης, συμβάλλοντας ουσιαστικά στη στήριξη και ενίσχυση της ανταγωνιστικότητας των μικρομεσαίων επιχειρήσεων στις περιοχές ΔΑΜ και ειδικότερα στην Περιφέρεια Δυτικής Μακεδονίας (Κοζάνη, Γρεβενά, Φλώρινα, Καστοριά) και στους Δήμους Μεγαλόπολης, Τρίπολης, Γορτυνίας και Οιχαλίας της Περιφέρειας Πελοπoννήσου. Το δάνειο παρέχεται μέσω του Ταμείου Δανείων Δίκαιης Αναπτυξιακής Μετάβασης (ΔΑΜ), το οποίο διαχειρίζεται η Ελληνική Αναπτυξιακή Τράπεζα (ΕΑΤ) και συγχρηματοδοτείται από την Ευρωπαϊκή Ένωση, μέσω του Προγράμματος “Δίκαιη Αναπτυξιακή Μετάβαση 2021-2027” Το πρόγραμμα Τι αφορά Η δράση «Ταμείο Δανείων ΔΑΜ» αφορά στη χορήγηση νέων δανείων με ευνοϊκούς όρους προς ΜμΕ επιχειρήσεις (υφιστάμενες και νεοσυσταθείσες) επιλέξιμων ΚΑΔ, οι οποίες δραστηριοποιούνται στις περιοχές Δίκαιης Αναπυξιακής Μετάβασης (ΔΑΜ), για την κάλυψη των χρηματοδοτικών τους αναγκών (κεφάλαια κίνησης ειδικού σκοπού και δάνεια επενδυτικού σκοπού), με σκοπό την ομαλή και δίκαιη μετάβαση στη μεταλιγνιτική εποχή. Τα δάνεια θα παρέχονται με χαμηλότερο χρηματοοικονομικό κόστος: λόγω της άτοκης συμμετοχής των κεφαλαίων του Ταμείου στο δάνειο κατά 50%, της εφαρμογής περιθωρίου επιτοκίου στα κεφάλαια της Τράπεζας χαμηλότερου σε σχέση με το περιθώριο που θα εφαρμοζόταν σε ανάλογη χρηματοδότηση εκτός Ταμείου, αλλά και της μερικής τριετούς επιδότησης του επιτοκίου έως 3% ετησίως. Προϋπολογισμός δράσης Ο αρχικός προϋπολογισμός του Ταμείου ανέρχεται στο ποσό των 50εκατ. ευρώ και οι πόροι προέρχονται από το Πρόγραμμα Δίκαιης Αναπτυξιακής Μετάβασης 2021-2027. Με τη μόχλευση αναμένεται η χορήγηση δανείων συνολικής αξίας περίπου 87 εκατ. ευρώ. Βασικά χαρακτηριστικά Δανείων Βασικά χαρακτηριστικά Δανείων «Ταμείου Δανείων Δίκαιης Αναπτυξιακής Μετάβασης» Δικαιούχοι της Δράσης / Επιλέξιμες Επιχειρήσεις Δικαιούχοι της Δράσης / Επιλέξιμες Επιχειρήσεις Εξαιρέσεις Δραστηριοτήτων και Δαπανών Εξαιρέσεις Δραστηριοτήτων και Δαπανών Κριτήρια Επιλεξιμότητας Δανείων Κριτήρια Επιλεξιμότητας Δανείων Επιλέξιμες Δαπάνες Επιλέξιμες Δαπάνες Κρατική Ενίσχυση Η ενίσχυση που λαμβάνει ο Τελικός Αποδέκτης μέσω της εφαρμογήςστο δάνειο μηδενικού/μειωμένου επιτοκίου ή και του ποσού επιδότησης του επιτοκίου που τυχόν θα λάβει μέσω του Ταμείου Συγχρηματοδότησης παρέχονται με την επιφύλαξη των κανόνων Κρατικών Ενισχύσεων. Το καθεστώς κρατικών ενισχύσεων που εφαρμόζεται στο Ταμείο είναι ο Καν. (ΕΕ) 2831/2023 για τις ενισχύσεις ήσσονος σημασίας De Minimis (αρ. 4 παρ. 3 α και γ), όπως εκάστοτε ισχύει. Ως ανώτατο ποσό δημόσιας χρηματοδότησης (ενίσχυση ήσσονος σημασίας) που μπορεί να λάβει μία επιχείρηση (σε επίπεδο «ενιαίας» επιχείρησης), εντός οποιασδήποτε περιόδου τριών (3) ετών (κυλιόμενη ημερολογιακή βάση), ορίζεται το ποσό των €300.000. Περίοδος Διάθεσης Ως καταληκτική ημερομηνία ορίζεται η 31η/12/2029 ή μέχρι εξαντλήσεως των κονδυλίων. Υποβολή Αιτήσεων 1 Οι ενδιαφερόμενοι (υποψήφιες προς χρηματοδότηση επιχειρήσεις) υποβάλλουν αίτηση στην πλατφόρμα KYC («Know Your Customer») της ΕΑΤ, μέσω του δικτυακού τόπου www.kyc.hdb.gr. 2 Μέσω της πλατφόρμας, υπό την προϋπόθεση συναίνεσης για τη συλλογή και επεξεργασία των προσωπικών δεδομένων, και ύστερα από μία σειρά αξιολογήσεων κριτηρίων (έλεγχο της ύπαρξης φορολογικής και ασφαλιστικής ενημερότητας και φερεγγυότητας των υποψήφιων προς χρηματοδότηση επιχειρήσεων), η αίτηση προωθείται στην Τράπεζα επιλογής του κατ΄ εντολή του ενδιαφερομένου, για την υποβολή μη δεσμευτικής προσφοράς. 3 Εν συνεχεία ο ενδιαφερόμενος, για τον οποίο η Τράπεζα εκδήλωσε το «μη δεσμευτικό» ενδιαφέρον χρηματοδότησης, υποβάλλει το αίτημα στο ΟΠΣΚΕ μέσω του δικτυακού τόπου https://app.opske.gr//, στο οποίο αναγράφεται και ο μοναδικός αριθμός αίτησης από την πλατφόρμα KYC της ΕΑΤ. 4 Σημειώνεται ότι προ υποβολής της αίτησης χρηματοδότησης στο ΟΠΣΚΕ οι ενδιαφερόμενες επίσης επιχειρήσεις θα πρέπει να έχουν υποβάλει το ερωτηματολόγιο αυτοαξιολόγησης στην πλατφόρμα ESG tracker της ΕΑΤ https://esgtracker.hdb.gr/en/home/ , καθώς και να έχουν εγγραφεί στο Μητρώο Πραγματικών Δικαιούχων. Απαιτείται η προσκόμιση ESG Tracker Report με στοιχεία του προηγούμενου έτους (έτος αναφοράς) από το έτος υποβολής της αίτησης χρηματοδότησης. Δύναται, ωστόσο, για τις αιτήσεις που θα υποβληθούν έως και 31.03.2025 να γίνουν αποδεκτά και τυχόν υφιστάμενα ESG Reports υποβληθέντα το 2024 (έτος αναφοράς 2023)."
