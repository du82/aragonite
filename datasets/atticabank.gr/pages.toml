["https://www.atticabank.gr/el/group/attica-bank/history-profile/principles-and-history"]
title = "Η Ιστορία μας - Attica Bank"
description = "Η Attica Bank ξεκινά τη διαδρομή της την πρώτη δεκαετία του Μεσοπολέμου, δυο χρόνια μετά τη Μικρασιατική Καταστροφή. Ως Τράπεζα Αττικής είναι «παιδί» των μεγάλων ζυμώσεων που συντελέστηκαν σε πολιτικό…"
full_description = "Attica Bank 1924-2024 Η Attica Bank ξεκινά τη διαδρομή της την πρώτη δεκαετία του Μεσοπολέμου, δυο χρόνια μετά τη Μικρασιατική Καταστροφή.Ως Τράπεζα Αττικής είναι «παιδί» των μεγάλων ζυμώσεων που συντελέστηκαν σε πολιτικό, οικονομικό και κοινωνικό επίπεδο κατά την περίοδο του Μεσοπολέμου. Η ελληνική πραγματικότητα των δεκαετιών του 1920 και του 1930 καθορίζεται από τα κληροδοτήματα των βαλκανικών στρατιωτικών αναμετρήσεων και του Πρώτου Παγκοσμίου Πολέμου. Η Ελλάδα της εποχής είναι μια χώρα των αντιφάσεων: έχει διπλασιάσει την έκταση και τον πληθυσμό της, αναμετριέται με το στοίχημα της ενσωμάτωσης των «νέων χωρών» στον εθνικό κορμό, υποφέρει από τις πολυεπίπεδες επιπτώσεις του Εθνικού Διχασμού, διαχειρίζεται μια από τις σφοδρότερες ανθρωπιστικές κρίσεις του 20ου αιώνα, ως απόρροια της Μικρασιατικής Καταστροφής, και επιδιώκει τον αστικό της εκσυγχρονισμό. Στα τέλη του 1924, ένας εμποροβιομήχανος με καταγωγή από τα μέρη της Κυνουρίας αποφασίζει να προχωρήσει στο τολμηρό εγχείρημα ίδρυσης ενός χρηματοπιστωτικού οργανισμού. Πρόκειται για τον Ανδρέα Σπυράκη. Η ίδρυση της Τράπεζας Αττικής υπήρξε φυσικό επακόλουθο της επιχειρηματικής εξέλιξης του Σπυράκη. Τον Νοέμβριο του 1924, επικεφαλής μιας μικρής ομάδας κεφαλαιούχων προχωρά στη σύσταση της, που εγκρίνεται επισήμως με προεδρικό διάταγμα στις 17 Ιανουαρίου του 1925 και δημοσιεύεται στην Εφημερίδα της Κυβερνήσεως στις 4 Φεβρουαρίου του ίδιου έτους. Στις 12 Φεβρουάριου του 1925 «ο Πρόεδρος αναγγέλλειν […] την ενοικίασιν καταστήματος προς εγκατάστασίν των γραφείων της Τραπέζης, εις τω αναγειρομένω μεγάρω της Λαϊκής Τραπέζης, μετά της οποίας υπέγραψε δια λ/σμού της Τραπέζης Αττικής συμβόλαιον ενοικιάσεως δια μιαν τριετίαν αρχομένην από της παραδόσεως, μέρους του επί της οδού Ναυαρίνου οικοδομήματος αυτής αντί ενοικίου μηνιαίου δραχμών 7.500 και λιρών Αγγλίας 25».Η Τράπεζα Αττικής επιτυγχάνει να ισορροπήσει καθ’ όλη την περίοδο του μεσοπολέμου, να συμβαδίσει με τις εξελίξεις και τα νέα δεδομένα της εγχώριας τραπεζικής αγοράς και να αποδειχθεί χρήσιμο πιστωτικό εργαλείο για την πειραϊκή επιχειρηματικότητα.Το 1946 η Τράπεζα Αττικής συγκαταλέγεται στα δεκαπέντε ιδρύματα που θα λάβουν πιστώσεις από την Τράπεζα της Ελλάδος με βάση των κύκλων των εργασιών τους κατά το 1939, προκειμένου να τροφοδοτηθεί η βιομηχανία και το εμπόριο.Την ίδια χρονιά, το διοικητικό συμβούλιο της Τράπεζας αποφασίζει τη σύμπραξη με την Τράπεζα Χίου, στην οποία παραχωρεί το μισθωμένο κεντρικό της κατάστημα στον Πειραιά και αναθέτει όλη την τραπεζική λειτουργία. Η Τράπεζα Αττικής διατηρεί δικαίωμα διαχείρισης μόνο ορισμένων περιουσιακών της στοιχείων, καθώς και των φιλανθρωπικών ιδρυμάτων που υποστηρίζει. Τον Ιούνιο του 1961 καθήκοντα προέδρου του διοικητικού συμβουλίου της Τράπεζας Αττικής αναλαμβάνει ο καθηγητής Στρατής Ανδρεάδης, σηματοδοτώντας τη δεύτερη περίοδο ανάπτυξης της Τράπεζας.Το 1964 η Τράπεζα εξαγοράστηκε από τον Όμιλο εταιρειών της Εμπορικής Τράπεζας και εισήχθη για πρώτη φορά στο Χρηματιστήριο. Η Τράπεζα αποκτά με γοργό ρυθμό ένα δίκτυο καταστημάτων, δίνοντας έμφαση στην προσέλκυση και την εξυπηρέτηση της μεσαίας επιχείρησης. Το πελατολόγιό της περιλαμβάνει μεταξύ άλλων ορισμένες από τις εμβληματικότερες βιομηχανίες τσιμέντων, χάλυβα, αυτοκινήτων, χαλκού και αλουμινίου, βάμβακος, βωξίτη, επεξεργασίας μαλλιού και κλωστοϋφαντήρια. Η κατάργηση της Νομισματικής Επιτροπής στις αρχές της δεκαετίας του 1980 σηματοδοτεί αλλαγές στην αντιμετώπιση του τραπεζικού συστήματος. Η Τράπεζα περνά στον έλεγχο του δημοσίου και δίνει ιδιαίτερη βαρύτητα στην υποστήριξη του βιοτεχνικού κλάδου. Τα επόμενα χρόνια, η Τράπεζα Αττικής υλοποιεί μια σειρά αποφάσεων που αποβλέπουν στην προσέλκυση αποταμιευτών, στη βελτίωση των υπηρεσιών προς τους βιοτέχνες και δίνει ιδιαίτερη έμφαση στη δημιουργία τομέα μελετών προς αυτή την κατεύθυνση. Τον Ιούνιο του 1997 η Εμπορική Τράπεζα μεταβίβασε μέσω του Χρηματιστηρίου Αξιών Αθηνών μέρος των μετοχών που κατείχε στο Ταμείο Συντάξεων Μηχανικών και Εργοληπτών Δημοσίων Έργων (ΤΣΜΕΔΕ) και στο Ταμείο Παρακαταθηκών και Δανείων, διατηρώντας έως τον Σεπτέμβριο 2012 περίπου το 17% των μετοχών της Τράπεζας, το οποίο, εν συνεχεία, μεταβιβάστηκε στο Ταχυδρομικό Ταμιευτήριο.Το 2006, η Τράπεζα Αττικής θα μετονομαστεί σε Attica Bank και, στο πλαίσιο μιας διαρκώς μεταβαλλόμενης αγοράς, θα επεκταθεί σε όλο το φάσμα των τραπεζικών προϊόντων, όπως ορίζεται στο άρθρο 2 του καταστατικού της:«Ο σκοπός της Τράπεζας είναι ο ευρύτερος δυνατός και συμπεριλαμβάνει κάθε εργασία, έργο, υπηρεσία και γενικώς δραστηριότητα που είτε εκ παραδόσεως είτε στο πλαίσιο των τεχνικών, οικονομικών και κοινωνικών εξελίξεων, αποτελούν εκάστοτε εργασίες, έργα, υπηρεσίες και γενικώς δραστηριότητες δυνάμενες εκάστοτε να ασκούνται από πιστωτικό ίδρυμα».Κατά τη διάρκεια των ετών 2013-2018, η Τράπεζα προχώρησε στην έκδοση Μετατρέψιμου Ομολογιακού Δανείου καθώς και σε διαδοχικές αυξήσεις μετοχικού κεφαλαίου, με στόχο την εξυγίανση του ισολογισμού της και την ολοκλήρωση της αναδιάρθρωσης του μοντέλου λειτουργίας της.Τον Απρίλιο του 2023 ολοκληρώθηκε με πλήρη κάλυψη η αύξηση μετοχικού κεφαλαίου της Τράπεζας ύψους €473,3 εκατ., με την εισαγωγή νέου στρατηγικού ιδιώτη επενδυτή, την Thrivest. «Η εκατόχρονη πορεία της Attica Bank δεν είναι παρά μια ιστορία για την ανθεκτικότητα και την ευρηματικότητα του ελληνικού επιχειρείν. Η παρουσία της στον τραπεζικό τομέα αποτελεί μια διαρκή υπενθύμιση της αναγκαιότητας τόσο της κοινωνικοποίησης, όσο και του κοσμοπολιτισμού της οικονομίας»."
