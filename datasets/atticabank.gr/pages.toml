["https://www.atticabank.gr/el/digital-bank/attica-e-banking/deite-edo-tis-sychnes-erotiseis-2"]
title = "Ερωτήσεις για το Attica e-banking - Attica Bank"
full_description = "Συχνές Ερωτήσεις Τι είναι το Attica e-banking; Το Attica e-banking είναι η υπηρεσία Internet Banking της Attica Bank. Μέσα από μια σύγχρονη και ευέλικτη εφαρμογή, σας δίνεται η δυνατότητα, να διαχειρίζεστε τους λογαριασμούς σας και να πραγματοποιείτε εγχρήματες συναλλαγές, με μια πληθώρα επιλογών, 24 ώρες το 24ωρο, 7 μέρες την εβδομάδα, εύκολα, γρήγορα και με ασφάλεια. Ποια είναι τα οφέλη από την χρήση του Attica e-banking; Με τη χρήση της υπηρεσίας Attica e-banking εξασφαλίζετε: Πρόσβαση στα τραπεζικά σας προϊόντα 24/7 Ευκολία, ασφαλεια και ταχύτητα στην πραγματοποίηση των καθημερινών σας τραπεζικών συναλλαγών Πώς μπορώ να γίνω χρήστης του Attica e-banking; Εγγραφείτε on-line και δωρεάν στην υπηρεσία πατώντας εδώ. Η διαδικασία είναι απλή και κρατάει μόλις λίγα λεπτά. Απαραίτητη προϋπόθεση για την εγγραφή σας online είναι να έχετε τουλάχιστον έναν ενεργό λογαριασμό ή ενεργή πιστωτική ή χρεωστική κάρτα στην Attica Bank και να έχετε δηλώσει τον αριθμό του κινητού σας τηλεφώνου και τη διεύθυνση του ηλεκτρονικού σας ταχυδρομείου (e-mail) στην Τράπεζα. Οι κωδικοί σας εκδίδονται online και μπορείτε άμεσα να συνδεθείτε στο Attica e-banking και στο Attica Mobile. Εναλλακτικά, μπορείτε να εγγραφείτε σε οποιοδήποτε φυσικό κατάστημα της Attica Bank. Πόσο ασφαλές είναι το Attica e-banking; Η Attica Bank φροντίζει για την μέγιστη δυνατή ασφάλεια των συναλλαγών σας, εφαρμόζοντας συστήματα προηγμένης τεχνολογίας και αναγνωρισμένα πρωτόκολλα ασφαλείας για την πρόσβασή σας στις ψηφιακές υπηρεσίες. Παρέχουμε προηγμένες μεθόδους διασφάλισης των συναλλαγών που πραγματοποιούνται μέσω Internet, Smartphone ή Tablet διασφαλίζοντας έτσι το απόρρητο των προσωπικών και τραπεζικών σας δεδομένων. Από την πλευρά σας, είναι σημαντικό να χρησιμοποιείτε υπολογιστές και συσκευές που ελέγχετε οι ίδιοι και να μην αποκαλύπτετε σε τρίτους τους κωδικούς σας. Επιπλέον, ο 8ψήφιος κωδικός (One Time Password) που λαμβάνετε κάθε φορά που επιθυμείτε να πραγματοποιήσετε τόσο διαχειριστικές όσο και εγχρήματες συναλλαγές, ενισχύει ακόμη περισσότερο την ασφάλεια των συναλλαγών σας, καθώς δημιουργείται βάσει των στοιχείων της συναλλαγής που έχετε επιλέξει να ολοκληρώσετε και μπορεί να χρησιμοποιηθεί αποκλειστικά και μόνο για την συγκεκριμένη συναλλαγή. Τι πρέπει να κάνω εάν αλλάξω αριθμό κινητού τηλεφώνου ή/και e-mail; Σε περίπτωση αλλαγής του αριθμού του κινητού τηλεφώνου σας ή/και της διεύθυνσης ηλεκτρονικής αλληλογραφίας (e-mail) σας, έχετε δύο επιλογές: επισκεφτείτε ένα από τα καταστήματα της Attica Bank και δηλώστε τα νέα σας στοιχεία, προσκομίζοντας για τον αριθμό του κινητού σας τηλεφώνου ένα πρόσφατο λογαριασμό είτε έχοντας μαζί σας τους κωδικούς σας σύνδεσης TAXISnet ωστε να χρησιμοποιήσετε την υπηρεσία επικαιροποίησης στοιχείων μέσω eGov-KYC συνδεθείτε στο Attica e-banking και επιλέξτε από τις Εργασίες Χρήστη την Επικαιροποίηση Στοιχείων Πελάτη μέσω eGov-KYC. Απαραίτητη προϋπόθεση είναι να έχετε ήδη ενημερώσει με το νέο σας αριθμό κινητού τηλεφώνου και με το e-mail σας, το σύστημα του Εθνικού Μητρώου Επικοινωνίας (Ε.Μ.Επ.). Έχω ξεχάσει τους Κωδικούς Πρόσβασης μου, τι πρέπει να κάνω; Σε περίπτωση που έχετε κλειδώσει ή έχετε ξεχάσει το Μυστικό σας Κωδικό (Password), μπορείτε να πραγματοποιήσετε ξελείδωμα χρήστη και αποστολή νέου Μυστικού Κωδικού (Password), μέσω του Attica e-banking ή Attica Mobile. Εναλλακτικά, επικοινωνήστε με την Υπηρεσία Τηλεφωνικής Εξυπηρέτησης Πελατών της Attica Bank στο τηλέφωνο 210-3669000 και ζητήστε την αποστολή νέων κωδικών πρόσβασης στις ψηφιακές υπηρεσίες. Η πρόσβασή μου έχει μπλοκαριστεί, τι πρέπει να κάνω; Για την προστασία σας, ο λογαριασμός του Χρήστη μπλοκάρεται μετά από μια σειρά ανεπιτυχών προσπαθειών εισαγωγής του Μυστικού Κωδικού Πελάτη. Σε αυτήν την περίπτωση, επικοινωνήστε με την Υπηρεσία Τηλεφωνικής Εξυπηρέτησης Πελατών της Attica Bank στο 210-3669000. Οι αρμόδιοι υπάλληλοι θα σας καθοδηγήσουν σχετικά με τις ενέργειες που πρέπει να ακολουθηθούν ανάλογα με το λόγο για τον οποίο μπλόκαρε η πρόσβασή σας. Σημείωση: σε καμία περίπτωση η Τράπεζα δεν θα σας ζητήσει ποτέ να αποκαλύψετε τον Μυστικό Κωδικό Πελάτη. Υπάρχει δυνατότητα αλλαγής των Κωδικών Πρόσβασής μου; Έχετε τη δυνατότητα να αλλάξετε τους Κωδικούς Πρόσβασής σας από το μενού «Εργασίες Χρήστη». Υπάρχουν οι επιλογές «Αλλαγή Κωδικού Πελάτη» και «Αλλαγή Μυστικού Κωδικού Πελάτη» όπου μπορείτε να αλλάξετε αντίστοιχα τους προαναφερθέντες κωδικούς. Σε περίπτωση αλλαγής των Κωδικών Πρόσβασης μέσω ενός καναλιού (Attica e-banking ή Attica Mobile), αυτόματα η αλλαγή αυτή τίθεται σε ισχύ και αφορά στην είσοδο του χρήστη σε οποιοδήποτε κανάλι. Σημειώνεται ότι ο Μυστικός Κωδικός (Password) δεν πρέπει να περιέχει τον Κωδικό Πελάτη (Username), και θα ισχύει για 3 μήνες. Πώς πρέπει να προστατεύω τους Κωδικούς Πρόσβασής μου; Οι Κωδικοί Πρόσβασης χρησιμεύουν για την αναγνώριση σας από το σύστημα ως χρήστη για τη σύνδεσή σας στο Attica e-banking. Για την δική σας μέγιστη ασφάλεια: Ο Μυστικός Κωδικός Πελάτη (Password) είναι αυστηρά προσωπικός και απόρρητος. Σας συνιστούμε να μην τον καταγράφετε και να μην τον αποκαλύπτετε σε τρίτους. Μην χρησιμοποιείτε Μυστικούς Κωδικούς που εύκολα μπορεί κάποιος να υποθέσει όπως π.χ. ημερομηνίες γέννησης, ονόματα, τηλέφωνα κ.λ.π.Εάν υποψιαστείτε ότι με οποιονδήποτε τρόπο έχει διαρρεύσει ο Μυστικός σας Κωδικός (Password), τροποποιείστε τον άμεσα μέσω της επιλογής «Αλλαγή Μυστικού Κωδικού» στο μενού «Εργασίες Χρήστη». Αποφεύγετε να κάνετε συναλλαγές στο Attica e-banking από υπολογιστές κοινής χρήσης. Τι είναι οι Κωδικοί μιας Χρήσης (One–Time–Password ή OTP); Για να έχετε πλήρη πρόσβαση και δυνατότητα διενέργειας συναλλαγών (διαχειριστικών και εγχρήματων), θα χρειάζεται να εισάγετε Κωδικό μιας Χρήσης (OTP). Ο Κωδικός μιας Χρήσης (One-Time-Password ή OTP) ενισχύει ακόμη περισσότερο την ασφάλεια των συναλλαγών σας, καθώς δημιουργείται βάσει των στοιχείων της συναλλαγής που έχετε επιλέξει να ολοκληρώσετε και μπορεί να χρησιμοποιηθεί αποκλειστικά και μόνο για την συγκεκριμένη συναλλαγή. Πιο συγκεκριμένα, για να έχετε πλήρη πρόσβαση και δυνατότητα διενέργειας συναλλαγών (διαχειριστικών και εγχρήματων), θα χρειάζεται να εισάγετε Κωδικό μιας Χρήσης (OTP) για επιπλέον ασφάλεια για την εκτέλεση της συναλλαγής. Ο Κωδικός μιας Χρήσης αποστέλλεται μέσω γραπτού μηνύματος SMS στην συσκευή κινητού τηλεφώνου που έχετε δηλώσει στην Τράπεζα κατά την αίτησή σας και στο e-mail που έχετε δηλώσει. Ο πρόσθετος κωδικός μιας χρήσης θα σας ζητείται μόνο σε: Μεταφορά χρημάτων σε τρίτους εντός και εκτός τράπεζας και μέσω IRIS payments (μόνο εφόσον ξεπεράσετε το ποσό των €1000 αθροιστικά μέσα στην ίδια ημέρα, κάνοντας είτε μια μεμονωμένη συναλλαγή είτε περισσότερες) Αλλαγή κωδικού πελάτη (Username) και μυστικού κωδικού (Password) Εγγραφή και μεταβολή συσκευής κινητού τηλεφώνου ή τάμπλετ Μεταβολή ημερήσιων ορίων για μεταφορές & πληρωμές Ενημέρωση προσωπικών στοιχείων ή αριθμού κινητού τηλεφώνου μέσω eGov-KYC. Εάν χάσετε την τηλεφωνική σας συσκευή, επικοινωνήστε άμεσα με την Υπηρεσία Τηλεφωνικής Εξυπηρέτησης Πελατών της Attica Bank στο 210-3669000 για να απενεργοποιηθεί η υπηρεσία αποστολής Κωδικών μιας Χρήσης μέσω SMS. Εισάγω τον Κωδικό μιας Χρήσης (OTP) και αυτός δεν γίνεται αποδεκτός. Γιατί μπορεί να συμβαίνει αυτό; Ο Κωδικός μιας Χρήσης δεν γίνεται αποδεκτός στις εξής περιπτώσεις: Έχει ξεπεραστεί ο μέγιστος «χρόνος ζωής» του Κωδικού μιας Χρήσης που είναι τα 2 λεπτά. Έχουν προηγηθεί 3 συνεχόμενες λανθασμένες προσπάθειες εισαγωγής του Κωδικού μιας Χρήσης. Έχετε ζητήσει 5 συνεχόμενες φορές Κωδικό μιας Χρήσης και δεν τον έχετε χρησιμοποιήσει. Προσπαθείτε να καταχωρήσετε Κωδικό μιας Χρήσης που παραλάβατε από διαφορετική συναλλαγή Για οποιαδήποτε βοήθεια επικοινωνήστε με την Υπηρεσία Τηλεφωνικής Εξυπηρέτησης Πελατών της Attica Bank στο τηλέφωνο 210-3669000 και θα εξυπηρετηθείτε άμεσα. Ποιες εγχρήματες συναλλαγές μπορώ να πραγματοποιήσω μέσω του Attica e-banking; Οι συναλλαγές που μπορείτε να πραγματοποιήσετε είναι οι εξής: Μεταφορές μεταξύ των λογαριασμών σας. Μεταφορές σε λογαριασμούς τρίτων της Attica Bank. Μεταφορές μέσω ΔΙΑΣ σε άλλες τράπεζες του εσωτερικού ή του εξωτερικού (εντός SEPA). Πληρωμή λογαριασμών σε Οργανισμούς/Εταιρείες Κοινής ωφέλειας. Φόρτιση προπληρωμένης κάρτας. Πληρωμή Πιστωτικών καρτών της Attica Bank. Πληρωμή Πιστωτικών καρτών άλλων τραπεζών. Δημιουργία Πάγιων Εντολών για Πληρωμή λογαριασμών Επικαιροποίηση των στοιχείων σας μέσω eGOV-KYC Επιπλέον έχετε τη δυνατότητα να αιτηθείτε On-line την Έκδοση Χρεωστικής και Προπληρωμένης κάρτας Attica Bank. Πώς μπορώ να λάβω απόδειξη για κάποια εγχρήματη συναλλαγή που έχω πραγματοποιήσει μέσω του Attica e-banking; Απόδειξη συναλλαγής μπορείτε να πάρετε με δυο τρόπους: 1. Αφού πραγματοποιήσετε εγχρήματη συναλλαγή μέσω του Attica e-banking, κι αυτή ολοκληρωθεί με επιτυχία, τότε εμφανίζεται στην οθόνη σας η επιλογή «Απόδειξη Συναλλαγής». Επιλέγοντάς την, έχετε δυο επιμέρους επιλογές: «να κατεβάσετε» (download) και να αποθηκεύσετε την απόδειξη στον υπολογιστή σας να αποστείλετε την απόδειξη μέσω ηλεκτρονικής αλληλογραφίας (e-mail). 2. Μπορείτε επίσης, επιλέγοντας «Ιστορικό Ενεργειών» από το μενού «Εργασίες Χρήστη» να δείτε τις εγχρήματες συναλλαγές που έχετε πραγματοποιήσει και να «κατεβάσετε» (download) τις αποδείξεις παραλαβής. Πώς μπορώ να τροποποιήσω τα Ημερήσια Όρια στις συναλλαγές μου; Έχετε την δυνατότητα να τροποποιήσετε τα ημερήσια όρια των εγχρήματων συναλλαγών που πραγματοποιείτε μέσω του Attica e-banking και Attica Mobile επιλέγοντας «Διαχείριση Ημερησίων Ορίων» από το μενού «Εργασίες Χρήστη». Θα πρέπει να σημειωθεί ότι τα όρια που μπορείτε να ορίσετε δεν μπορεί να έχουν μεγαλύτερη τιμή από αυτήν που έχει προκαθοριστεί ως ανώτατη τιμή από την Τράπεζα. Τα Ημερήσια Όρια ορίζονται ανά κατηγορία συναλλαγών (Ενδοτραπεζικές Μεταφορές, Πληρωμές Οργανισμών και Μεταφορές ΔΙΑΣ) και μπορεί να είναι διαφορετικά ανά κανάλι (Attica e-banking, Attica Mobile). Στην περίπτωση που επιθυμείτε να αυξήσετα το συνολικό ημερήσιο όριο των συναλλαγών σας πάνω από το ανώτατο όριο που έχει ορίσει η Τράπεζα, τότε έχετε την επιλογή να το αιτηθείτε μέσω της υπηρεσίας Τηλεφωνικής Εξυπηρέτησης Πελατών της Attica Bank στο 21ο-3669000 και μέχρι του ποσού των 24.οοο€. Για ημερήσιο όριο συναλλαγών άνω των 24.οοο€ μπορείτε να το αιτηθείτε μέσω ενός καταστήματος της Attica Bank. Πώς μπορώ να κάνω αίτηση για χορήγηση καρνέ επιταγών; Αίτηση για χορήγηση καρνέ επιταγών μπορείτε να πραγματοποιήσετε μέσω της επιλογής «Αίτηση χορήγησης καρνέ επιταγών» στο μενού «Συναλλαγές». Μπορείτε να αιτηθείτε καρνέ επιταγών, εφόσον διαθέτετε τρεχούμενο λογαριασμό. Το καρνέ επιταγών θα το παραλάβετε απο το κατάστημα της Attica Bank που σας εξυπηρετεί κατι το οποίο θα το επιλέξετε κατά την online αίτησή σας. Τι είναι τα Πρότυπα; Τα Πρότυπα είναι συναλλαγές που μπορείτε να τις αποθηκεύσετε γιατί τις εκτελείτε συχνά. Συγκεκριμένα μπορείτε να δημιουργήσετε πρότυπα σε μεταφορές αλλά και σε πληρωμές που επαναλαμβάνετε συχνά. Με τη δημιουργία προτύπων η διαδικασία εκτέλεσης μιας συναλλαγής γίνεται πιο γρήγορα και η περίπτωση λανθασμένης πληκτρολόγησης των στοιχείων της συναλλαγής μειώνεται. Τα Πρότυπα που μπορείτε να δημιουργήσετε βρίσκονται στην επιλογή του μενού “Εργασίες Χρήστη” χωρίζονται σε δυο (2) βασικές κατηγορίες: Διαχείριση προτύπων: για μεταφορές χρημάτων εντός και εκτός Attica Bank αλλά και για πληρωμές Διαχείριση δικαιούχων: για αποθήκευση δικαιούχων με λογαριασμούς εντός και εκτός Attica Bank Επιπλέον μπορείτε να δημιουργήσετε πρότυπο στο τελευταίο βήμα της συναλλαγής σας, αφού αυτή ολοκληρωθεί επιτυχώς, επιλέγοντας το Σώστε τη Συναλλαγή σας σαν Πρότυπη. Μπορώ να διαχειριστώ τους λογαριασμούς μου που βλέπω μέσω του Attica e-banking; Ναι, μέσω του μενού «Εργασίες Χρήστη» και επιλέγοντας «Διαχείριση Λογαριασμών», μπορείτε να επεξεργαστείτε τους λογαριασμούς σας. Συγκεκριμένα, μπορείτε να επιλέξετε μια φιλική ονομασία για κάθε ένα λογαριασμό σας, καθώς και το εάν επιθυμείτε να μην τους βλέπετε καθόλου μέσω των Attica e-Banking & Attica Mobile ή να τους βλέπετε μόνο χωρίς να μπορείτε να τους χρεώνετε. Έχετε επιπλέον τη δυνατότητα να μετακινείτε (drag & drop) και να αλλάζετε τη σειρά που εμφανίζονται οι κατηγορίες των λογαριασμών σας στην οθόνη του χαρτοφυλακίου σας, όπως επίσης και τη σειρά εμφάνισης των λογαριασμών σας σε κάθε κατηγορία. Τι είναι οι Ειδοποιήσεις (Alerts); Για την προστασία σας και την ενημέρωσή σας σχετικά με την αλλαγή των Κωδικών Πρόσβασής σας στο Attica e-banking ή στο Attica Mobile, η Τράπεζα σας αποστέλλει Ειδοποιήσεις (Alerts) στο κινητό σας τηλέφωνο μέσω αποστολής SMS ή/και στο e-mail σας. Τις Ειδοποιήσεις αυτές δεν έχετε την επιλογή να μην τις παραλάβετε, για να αποφευχθεί οποιαδήποτε περίπτωση παραβίασης ασφάλειας ή πιθανής απάτης. Για τις εγχρήματες συναλλαγές σας μέσω του Attica e-banking ή Attica Mobile μπορείτε ο ίδιος να επιλέξετε αν θα λαμβάνετε ή όχι Ειδοποιήσεις. Οι Ειδοποιήσεις αυτές μπορούν να λαμβάνονται στο κινητό σας τηλέφωνο μέσω αποστολής SMS ή/και στο e-mail σας και αφορούν την ενημέρωσή σας σχετικά με κάποια εγχρήματη συναλλαγή που έχει πραγματοποιηθεί. Τι είναι τα secure messages; Μέσω της λειτουργικότητας των secure messages, λαμβάνετε με ασφαλή τρόπο ενημερωτικά μηνύματα από την Attica Βank και έχετε τη δυνατότητα να στέλνετε και τα δικά σας μηνύματα προς την Τράπεζα. Στα μηνύματα αυτά μπορείτε να μας αποστείλετε και κάποιο έντυπο με αίτημά σας και θα το εκτελέσουμε άμεσα. Τι είναι το Αφορολόγητο; Μέσα από την εφαρμογή Attica e-banking και Attica Mobile μπορείτε να πληροφορηθείτε για το «Αφορολόγητο», δηλαδή για το ποσό των δαπανών που πραγματοποιήσατε με χρήση των ηλεκτρονικών μέσων πληρωμής από οποιοδήποτε κανάλι και οι οποίες λαμβάνονται υπόψη στο αφορολόγητο ποσό. Υπάρχει ανάλυση των δαπανών αυτών ανά κατηγορία για τα δύο τελευταία οικονομικά έτη."
