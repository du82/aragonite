full_description = "Η Τειρεσίας Α.Ε. είναι ιδιωτική εταιρεία, με μετόχους ελληνικές τράπεζες. Ως το μοναδικό Γραφείο Πίστης στην Ελλάδα, μέλος του Ευρωπαϊκού Οργανισμού Γραφείων Πίστης ACCIS, παρέχει αξιόπιστες πληροφορίες για την αξιολόγηση των πιστωτικών κινδύνων, τόσο στις τράπεζες όσο και στις επιχειρήσεις. Η Τειρεσίας φροντίζει να παρέχει με ασφάλεια και διαφάνεια έγκαιρη και ολοκληρωμένη πληροφόρηση σε ιδιώτες και επιχειρήσεις, σχετικά με τα δεδομένα που τους αφορούν και τηρεί στα αρχεία της. Ενημερωτικό υλικό για την Τειρεσίας Α.Ε. Κατεβάστε το αρχείο (252kb)"
