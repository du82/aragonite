["https://www.atticabank.gr/el/digital-bank/attica-e-banking/individuals-ebanking/iris-payments-gia-idiotes"]
title = "IRIS payments για Iδιώτες - Attica Bank"
description = "Με την υπηρεσία IRIS payments σας δίνεται η δυνατότητα να μεταφέρετε και να λαμβάνετε χρήματα δωρεάν μέσω Attica e-banking & Attica Mobile, άμεσα σε οποιονδήποτε επιθυμείτε με ημερήσιο όριο συναλλαγών…"
full_description = "Με την υπηρεσία IRIS payments σας δίνεται η δυνατότητα να μεταφέρετε και να λαμβάνετε χρήματα δωρεάν μέσω Attica e-banking & Attica Mobile, άμεσα σε οποιονδήποτε επιθυμείτε με ημερήσιο όριο συναλλαγών €500.Επιπλέον, μπορείτε να κάνετε πληρωμές σε επαγγελματίες με τον ΑΦΜ ή τον αριθμό κινητού τηλεφώνου τους ή απλά σκανάροντας το IRIS payments QR code τους. Πώς θα εγγραφείτε στην υπηρεσία IRIS payments Για να εγγραφείτε στην υπηρεσία IRIS payments, θα πρέπει να ακολουθήσετε τα παρακάτω βήματα: Συνδεθείτε με τους προσωπικούς σας κωδικούς στο Attica e-banking ή Attica Mobile, και από το μενού «Εργασίες χρήστη» επιλέξτε «Διαχείριση IRIS payments» Επιλέγετε τον αριθμό του κινητού σας τηλεφώνου και έναν από τους διαθέσιμους Τραπεζικούς σας λογαριασμούς που επιθυμείτε να συνδέσετε για να λαμβάνετε τις πληρωμές σας Ολοκληρώστε την διαδικασία εγγραφής με την εισαγωγή των Κωδικών μιας Χρήσης μέσω SMS (OTP) Με την ολοκλήρωση της εγγραφής δημιουργείται αυτόματα στο Attica Mobile ο κωδικός σας QR code που συνδέεται με τον τραπεζικό σας λογαριασμό. Μπορείτε να επιδεικνύετε τον Κωδικό για να λαμβάνετε άμεσα χρήματα, μέσω του Attica Mobile (από το μενού Χρήστης > Προβολή IRIS payments QR code). Για την λήψη χρημάτων μέσω IRIS payments, λαμβάνετε ενημερωτικό Viber ή SMS μήνυμα στον αριθμό του κινητού σας τηλεφώνου. Πώς πραγματοποιείτε τις συναλλαγές σας Με την εγγραφή σας στην υπηρεσία, μπορείτε: να αποστέλλετε χρήματα άμεσα σε όσους είναι ήδη εγγεγραμμένοι στην υπηρεσία IRIS payments έως €500 ημερησίως, ανεξαρτήτως αριθμού συναλλαγών και μόνο με τη χρήση του αριθμού κινητού τηλεφώνου του παραλήπτη αντίστοιχα να λαμβάνετε χρήματα έως €500 ανά συναλλαγή, είτε με τη χρήση του αριθμού κινητού τηλεφώνου σας, είτε επιδεικνύοντας τον προσωπικό σας κωδικό QR Code από το μενού Χρήστης > Προβολή IRIS payments QR code να πληρώνετε επαγγελματίες καταχωρώντας τον ΑΦΜ τους, τον αριθμό κινητού τους τηλεφώνου ή απλά σκανάροντας το IRIS payments QR Code τους. Για να μπορέσετε να ολοκληρώσετε την πληρωμή, ο δικαιούχος πρέπει να είναι εγγεγραμμένος στην υπηρεσία IRIS payments. Σε περίπτωση που δεν έχει πραγματοποιήσει εγγραφή, εμφανίζεται στην οθόνη σας σχετικό μήνυμα. Με την εκτέλεση της μεταφοράς σας μέσω IRIS payments προς τρίτους, λαμβάνετε αυτόματα ενημερωτικό SMS μήνυμα. Πώς να προσθέσετε τον IRIS payments QR Code στο Ψηφιακό σας Πορτοφόλι Συνδεθείτε με τους προσωπικούς σας κωδικούς στο Attica Mobile, και επιλέξτε «IRIS payments QR Code» από την αρχική οθόνη Εφόσον είστε εγγεγραμμένος στην υπηρεσία θα εμφανιστεί η επιλογή «Προσθήκη στο Πορτοφόλι Google» για Android και «Προσθήκη στο Πορτοφόλι Apple» για iOS. Εάν δεν έχετε ολοκληρώσει την εγγραφή σας, μεταφέρεστε αυτόματα στην οθόνη εγγραφής στην υπηρεσία IRIS payments Πατώντας την Προσθήκη μεταφέρεστε στο Ψηφιακό σας Πορτοφόλι για να ολοκληρώσετε την διαδικασία Ο κωδικός σας προστέθηκε! Πλέον μπορείτε να επιδεικνύετε σε τρίτους τον QR Code σας μέσα από το wallet σας για να πραγματοποιήσετε τις συναλλαγές σας. Το μόνο που χρειάζεται να κάνει ο αποστολέας είναι να σκανάρει τον κωδικό σας μέσω του mobile app της δικής του τράπεζας, και να εκτελέσει την πληρωμή πληκτρολογώντας μόνο το ποσό. Για να δείτε τους Όρους και Προϋποθέσεις εγγραφής και χρήσης της υπηρεσίας IRIS payments, πατήστε εδώ."
