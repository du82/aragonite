title = "Συχνές ερωτήσεις για άνοιγμα online λογαριασμού - Attica Bank"
full_description = "Συχνές ερωτήσεις! Τι απαιτείται για να γίνω πελάτης online; Για να γίνετε πελάτης στην Attica Bank online θα πρέπει: Να είστε φυσικό πρόσωπο ιδιωτικός ή δημόσιος υπάλληλος είτε ελεύθερος επαγγελματίας 18 ετών & άνω Έλληνας υπήκοος Να διαθέτετε ελληνικό δελτίο αστυνομικής ταυτότητας Να είστε κάτοχος κωδικών Taxisnet Να έχετε επικαιροποιημένα τα στοιχεία σας στο Εθνικό Μητρώο Επικοινωνίας. Για να ολοκληρώσετε την online διαδικασία, θα ακολουθήσετε τα παρακάτω βήματα: Επιβεβαιώνετε το e-mail σας και το κινητό σας τηλέφωνο Δηλώνετε τους κωδικούς σας πρόσβασης για τις ψηφιακές υπηρεσίες Συνδέεστε στην υπηρεσία eGov-KYC με τους κωδικούς σας Taxisnet για την παροχή προς την τράπεζα όλων των προσωπικών σας στοιχείων Ανεβάζετε αντίγραφο της αστυνομικής σας ταυτότητας (π.χ. jpeg, pdf) Κάνετε βιντεοκλήση με εκπρόσωπό μας για την ταυτοποίηση σας Αποδέχεστε τους όλους σχετικούς όρους χρήσης και τους λαμβάνετε στο e-mail σας Είστε πλέον πελάτης της Attica Bank! Συνδέεστε στο Attica e-banking ή στο Attica Mobile, βλέπετε τα προϊόντα σας και μπορείτε να κάνετε τις πρώτες σας συναλλαγές. Τη χρεωστική σας κάρτα Visa Debit θα την παραλάβετε σε 5 εργασιμες μέρες στη διεύθυνση κατοικίας σας ενώ το PIN της θα το λάβετε την επόμενη εργάσιμη ημέρα μέσω SMS στο κινητό σας τηλέφωνο. Ποια προσωπικά μου στοιχεία χρειάζεστε για την online διαδικασία; Για την ολοκλήρωση της online διαδικασίας θα χρειαστούμε τα παρακάτω στοιχεία σας: Τα οικονομικά σας στοιχεία (π.χ. ΑΦΜ, ΔΟΥ, εισόδημα) Την επαγγελματική σας δραστηριότητα Τη διεύθυνση της μόνιμης κατοικίας σας Τα στοιχεία επικοινωνίας σας Η μεταφορά των προσωπικών σας στοιχείων γίνεται μέσω της υπηρεσίας eGov-KYC. Θα χρειαστεί να χρησιμοποιήσετε τους προσωπικούς σας κωδικούς για το Taxisnet και αφού δώσετε τη συγκατάθεσή σας, τα στοιχεία σας που είναι αποθηκευμένα στο eGov μεταφέρονται στην τράπεζα. Απαραίτητη προϋπόθεση πριν ξεκινήσετε τη διαδικασία είναι να έχετε ενημερώσει τα προσωπικά σας στοιχεία σας, διεύθυνση κατοικίας και κινητό τηλέφωνο, στο Εθνικό Μητρώο Επικοινωνίας (Ε.Μ.Επ.). Είμαι κάτοικος εξωτερικού. Μπορώ να γίνω πελάτης online; Μπορείτε εφόσον πληρείτε τις ακόλουθες προύποθέσεις: Να είστε φυσικό πρόσωπο, ιδιωτικός ή δημόσιος υπάλληλος ή ελεύθερος επαγγελματίας 18 ετών & άνω Έλληνας υπήκοος Να διαθέτετε ελληνικό δελτίο αστυνομικής ταυτότητας Να είστε υπόχρεος φορολογικής δήλωσης στην Ελλάδα Να είστε κάτοχος κωδικών Taxisnet Να έχετε επικαιροποιημένα τα στοιχεία σας στο Εθνικό Μητρώο Επικοινωνίας. Να έχετε στην Υπηρεσία eGov-K.YC, τόπο γέννησης στην Ελλάδα και χώρα γέννησης την Ελλάδα. Για να ολοκληρώσετε την online διαδικασία, θα ακολουθήσετε τα παρακάτω βήματα: Επιβεβαιώνετε το e-mail σας και το κινητό σας τηλέφωνο Δηλώνετε τους κωδικούς σας πρόσβασης για τις ψηφιακές υπηρεσίες Συνδέεστε στην υπηρεσία eGov-KYC με τους κωδικούς σας Taxisnet για την παροχή προς την τράπεζα όλων των προσωπικών σας στοιχείων Ανεβάζετε αντίγραφο της αστυνομικής σας ταυτότητας (π.χ. jpeg, pdf) Κάνετε βιντεοκλήση με εκπρόσωπό μας για την ταυτοποίηση σας Αποδέχεστε τους όλους σχετικούς όρους χρήσης και τους λαμβάνετε στο e-mail σας Ποιους λογαριασμούς μπορώ να ανοίξω online; Μπορείτε να ανοίξετε online το λογαριασμό καταθέσων Attica My Account κατάλληλος για τις καθημερινές σας συναλλαγές και πληρωμές ή ένα λογαριασμό για την καταβολή της μισθοδοσίας σας τον Attica Μισθοδοσία. Εάν είστε ελεύθερος επαγγελματίας μπορείτε να ανοίξετε online ένα λογαριασμό όψεως που σας εξασφαλίζει αποδοτική και ευέλικτη διαχείριση στις καθημερινές ανάγκες και συναλλαγές σας. Αν δεν είστε πελάτης μας και είστε ελεύθερος επαγγελματίας μπορείτε να ανοίξετε online ένα λογαριασμό Όψεως. Στη συνέχεια, εφόσον θέλετε, μπορείτε να ανοίξετε και άλλους τύπους λογαριασμών, με επίσκεψή σας σε ένα Κατάστημα του Δικτύου της Attica Bank. Μπορώ να γίνω online πελάτης ανεξαρτήτως επαγγέλματος; Μπορείτε να γίνετε πελάτης online εφόσον είστε φυσικό πρόσωπο, ιδιωτικός ή δημόσιος υπάλληλος αλλά και ελεύθερος επαγγελματίας. Τα επαγγελματικά σας στοιχεία θα πρέπει να ειναι ενημερωμένα στην υπηρεσία eGov-KYC, την οποία και θα χρησιμοποιήσετε για να τα μεταφέρετε στην τράπεζα. Δεν θα μπορέσετε να γίνετε πελάτης online, αν η ιδιότητά σας είναι συνταξιούχος, φοιτητής, άνεργος και οικιακά. Σε αυτές τις περιπτώσεις θα χαρούμε να σας εξυπηρετήσουμε χωρις κάποιο ραντεβού σε οποιοδήποτε κατάστημα του Δικτύου της Attica Bank. Υπάρχει ελάχιστο αρχικό ποσό κατάθεσης για το άνοιγμα του λογαριασμού; Όχι. Μπορείτε να ανοίξετε online με 0€ αρχικό ποσό κατάθεσης είτε έναν καταθετικό λογαριασμό τον Attica My Account, ένα λογαριασμό για τη μισθοδοσία σας τον Attica Μισθοδοσία, ή έναν επαγγελματικό λογαριασμό Όψεως. Μπορώ να προσθέσω συνδικαιούχο online στο λογαριασμό μου; Όχι, κατά τη διαδικασία του online ανοίγματος λογαριασμού δεν είναι εφικτό να προσθέσετε κάποιον συνδικαιούχο. Μετά την ολοκλήρωση της online διαδικασίας ωστόσο και εφόσον το επιθυμείτε, μπορεί να ακολουθήσει την online διαδικασία οποιοδήποτε φυσικό πρόσωπο επιθυμείτε να προσθέσετε ως συνδικαιούχο στο λογαριασμό σας (αρκεί να τηρούνται οι απαραίτητες προϋποθέσεις). Στη συνέχεια θα πρέπει να επισκεφθείτε ένα κατάστημα του Δικτύου της Attica Bank, για να τον προσθέσετε ως συνδικαιούχο στο λογαριασμό που θα έχετε ήδη ανοίξει online. Τι είδους κάρτα θα αποκτήσω; Αν είστε φυσικό πρόσωπο, ιδιωτικός ή δημόσιος υπάλληλος, θα αποκτήσετε μια χρεωστική κάρτα Visa Debit, ενώ αν είστε ελεύθερος επαγγελματίας θα αποκτήσετε τη χρεωστική κάρτα Visa Debit Business. Πώς θα λάβω τη χρεωστική κάρτα μου; Η νέα σας κάρτα, θα αποσταλεί μέσω courier στη διεύθυνση οικίας που δηλώσατε κατά τη διαδικασία του οnline ανοίγματος λογαριασμού. Είναι η διεύθυνση που είναι καταχωρημένη στα στοιχεία σας στο eGov, τα οποία συναινέσατε να διαβιβαστουν στην Attica Bank. Πώς θα λάβω το PIN της χρεωστικής κάρτας μου; Το PIN της νέας σας κάρτας θα το λάβετε μέσω SMS, στον αριθμό κινητού που δηλώσατε κατά την έναρξη της online διαδικασίας ανοίγματος λογαριασμού. Μπορώ να διακόψω την online διαδικασία και να τη συνεχίσω αργότερα; Αν διακόψετε την online διαδικασία, δεν θα μπορέσετε να τη συνεχίσετε από το σημείο στο οποίο το οποίο την διακόψατε. Θα χρειαστεί να την ξεκινήσετε από την αρχή. Τι θα γίνει, αν κατά τη διάρκεια της βιντεοκλήσης με τον εκπρόσωπο της Attica Bank η κλήση διακοπεί; Σε αυτή την περίπτωση, θα χρειαστεί να ξεκινήσετε τη online διαδικασία από την αρχή. Σε περίπτωση που αντιμετωπίσω κάποιο πρόβλημα κατά τη διάρκεια της online διαδικασίας, που μπορώ να απευθυνθώ; Για οτιδήποτε χρειαστείτε μπορείτε να επικοινωνήσετε με την εξυπηρέτηση πελατών της Attica Bank 24Χ7, τηλεφωνικά στο +30 210 366 9000, ή μέσω e-mail στο info@atticabank.gr. Ξεκινήστε εδώ!"
