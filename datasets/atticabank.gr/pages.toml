["https://www.atticabank.gr/el/digital-bank/attica-e-banking/odigies-chrisis/thesi-pelati"]
title = "Θέση Πελάτη - Attica Bank"
description = "Από τη θέση πελάτη επιλέγοντας το χαρτοφυλάκιό μου, μπορείτε να δείτε αναλυτικά και ανά κατηγορία, το σύνολο των Τραπεζικών σας λογαριασμών καθώς και τα δάνεια, τις προθεσμιακές σας καταθέσεις…"
full_description = "Από τη θέση πελάτη επιλέγοντας το χαρτοφυλάκιό μου, μπορείτε να δείτε αναλυτικά και ανά κατηγορία, το σύνολο των Τραπεζικών σας λογαριασμών καθώς και τα δάνεια, τις προθεσμιακές σας καταθέσεις, τις χρεωστικές, πιστωτικές και προπληρωμένες σας κάρτες. Δίπλα από κάθε επικεφαλίδα ανά κατηγορία υπάρχει το σύμβολο (+ ή -). Επιλέγοντας αντίστοιχα, κάνετε ορατά τα στοιχεία της κάθε κατηγορίας ή ελαχιστοποιείτε τις πληροφορίες. Έχετε επίσης τη δυνατότητα αλλαγής της σειράς εμφάνισης των κατηγοριών αλλά και των επιμέρους προϊόντων επιλέγοντας το σύμβολο στα δεξιά της οθόνης και στη συνέχεια με drag and drop τους μετακινείτε ανάλογα με τη σειρά που επιθυμείτε να φαίνονται."
