title = "Καταναλωτικό δάνειο Green Move - Attica Bank"
description = "Με το καταναλωτικό δάνειο Green Move σας δίνεται η δυνατότητα να αποκτήσετε το δικό σας οικολογικό μεταφορικό μέσο (αυτοκίνητο, μηχανή ή ποδήλατο), καινούργιο ή μεταχειρισμένο, γρήγορα και οικονομικά."
full_description = "Τι είναι και πώς επωφελείστε; Με το καταναλωτικό δάνειο Green Move σας δίνεται η δυνατότητα να αποκτήσετε το δικό σας οικολογικό μεταφορικό μέσο (αυτοκίνητο, μηχανή ή ποδήλατο), καινούργιο ή μεταχειρισμένο, γρήγορα και οικονομικά. Με μια γρήγορη ματιά 1 Ποσό δανείου Από €1.000 έως €50.000 για αγορά καινούριου οικολογικού αυτοκινήτου Από €1.000 έως €25.000 για αγορά μεταχειρισμένου οικολογικού αυτοκινήτου Από €1.000 έως €20.000 για αγορά καινούριας ηλεκτρικής μηχανής ή ηλεκτρικού ποδηλάτου 2 Επιτόκιο Σταθερό για όλη τη διάρκεια του δανείου 6,75% για αγορά καινούριου οικολογικού αυτοκινήτου από επιχείρηση εμπορίας αυτοκινήτων, ή καινούριας ηλεκτρικής μηχανής από επιχείρηση εμπορίας μηχανών ή ηλεκτρικού ποδήλατου 9,75 % για αγορά μεταχειρισμένου (παλαιότητας μέχρι 5 ετών) οικολογικού αυτοκινήτου από επιχείρηση εμπορίας αυτοκινήτων Τα παραπάνω επιτόκια επιβαρύνονται με εισφ. Ν128/75 (σήμερα 0,60%) Συνολικό Ετήσιο Πραγματικό Ποσοστό Επιβάρυνσης (ΣΕΠΠΕ). Ενδεικτικό ΣΕΠΠΕ: 7,89%, κατά την 10/01/2024, για αγορά καινούριου οικολογικού αυτοκινήτου, ποσό δανείου €20.000, διάρκεια αποπληρωμής 72 μήνες, επιτόκιο 6,75% σταθερό (πλέον εισφ. Ν.128/75: 0,60%) και εφάπαξ δαπάνη εξέτασης δανείου €150.Μηνιαία δόση: €344,35 για 72 δόσεις.Συνολικό Κόστος Πίστωσης: €24.943,30 Το ανωτέρω ΣΕΠΠΕ υπολογίστηκε με τις ακόλουθες παραδοχές Το έτος υπολογίζεται στις 365 ημέρες Το επιτόκιο παραμένει αμετάβλητο σε όλο το διάστημα αποπληρωμής Οι πληρωμές των δόσεων του δανείου πραγματοποιούνται εμπρόθεσμα Κλείσιμο 3 Διάρκεια Από 6 έως 84 μήνες για αγορά καινούριου οικολογικού αυτοκινήτου Από 6 έως 60 μήνες για αγορά μεταχειρισμένου οικολογικού αυτοκινήτου Από 6 έως 60 μήνες για αγορά καινούριας ηλεκτρικής μηχανής ή ηλεκτρικού ποδηλάτου 4 Αποπληρωμή Σε μηνιαίες δόσεις, ενώ δίνεται η δυνατότητα ολικής ή μερικής πρόωρης αποπληρωμής του δανείου χωρίς επιβάρυνση. Ασφαλιστική Κάλυψη Ενημερωθείτε για τα ασφαλιστικά προγράμματα που μπορεί να σας προσφέρει η Attica Bank σε συνεργασία με την Anytime by Interamerican. Χρηματοδότηση Το μέγιστο ποσό στο οποίο μπορεί να φτάσει η χρηματοδότηση του δανείου είναι το μικρότερο ποσό από τις δύο ακόλουθες περιπτώσεις: Είτε το 80% του ποσού της προσφοράς ή του προτιμολογίου του εμπόρου που ο πελάτης προσκομίζει στην Τράπεζα, Είτε το ποσό της προσφοράς ή του προτιμολογίου του εμπόρου αυτοκινήτων που ο πελάτης προσκομίζει στην Τράπεζα μετά την αφαίρεση τυχόν κρατικής επιδότησης. Ενημερωθείτε Επισκεφθείτε ένα κατάστημά μας. Φροντίστε να έχετε μαζί σας όλα τα απαραίτητα έγγραφα."
