["https://www.atticabank.gr/en/digital-banking/attica-mobile/individuals-mobile/iris-payments-for-individuals"]
title = "IRIS payments for Individuals - Attica Bank EN"
description = "With the IRIS payments service, you are given the opportunity to transfer and receive money for free via Attica e-banking & Attica Mobile, directly to anyone you wish with a daily transaction limit of…"
full_description = "With the IRIS payments service, you are given the opportunity to transfer and receive money for free via Attica e-banking & Attica Mobile, directly to anyone you wish with a daily transaction limit of €500.In addition, you can make payments to professionals with their VAT number or mobile phone number or simply by scanning their IRIS payments QR code. How to Register for the IRIS payments Service To register for the IRIS payments service, you must follow the steps below: Log in with your personal credentials to Attica e-banking or Attica Mobile, and from the “User Actions” menu, select “IRIS payments Management”. Select your mobile phone number and one of your available business bank accounts that you wish to connect for receiving payments. Complete the registration process by entering the One-Time Password (OTP) sent via SMS. Upon completing the registration, your QR Code linked to your bank account is automatically created in Attica Mobile. You can display the QR Code to receive money instantly (via Attica Mobile, from the User menu > View IRIS payments QR Code). To receive money via IRIS payments, you will receive an informative Viber or SMS message to your mobile phone number. How to Make Payments Once registered for the service, you can: send money instantly to anyone already registered with the IRIS payments service up to €500 daily, regardless of the number of transactions, using just the recipient’s mobile phone number. respectively, receive money up to €500 per transaction, either by using your mobile phone number, or by showing your personal QR Code from the User menu > View IRIS payments QR code pay professionals by entering their VAT number, mobile phone number, or simply by scanning their IRIS payments QR Code. To complete a payment, the beneficiary must be registered with the IRIS payments service. If they have not registered, a relevant message will appear on your screen. By making your transfer through IRIS payments to third parties, you automatically receive an informative SMS message. How to add the IRIS payments QR Code to your Digital Wallet Log in with your personal codes to Attica Mobile, and select “IRIS payments QR Code” from the home screen As long as you are subscribed to the service you will see the ‘Add to Google Wallet’ option for Android and ‘Add to Apple Wallet’ for iOS. If you have not completed your registration, you are automatically transferred to the registration screen for the IRIS payments service By pressing Add you are taken to your Digital Wallet to complete the process Your code has been added! Now you can show your QR Code to third parties through your wallet to make your transactions. All the sender needs to do is scan your code through their bank’s mobile app and make the payment by typing only the amount. To see the Terms and Conditions for registering for and using the IRIS payments service, click here."
year_published = 2024
year_updated = 2024
