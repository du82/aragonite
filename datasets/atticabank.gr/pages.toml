full_description = "Τι είναι και πώς επωφελείστε Επωφεληθείτε από την υψηλή απόδοση και την ασφάλεια της προθεσμιακής κατάθεσης New Start, με τα εξής χαρακτηριστικά: 1 ΝόμισμαΔιαθέσιμη σε Ευρώ και Δολάριο ΗΠΑ 2 Διάρκεια προθεσμιακής3 μήνες 3 Επιτόκιο σε Ευρώ 2,00% σταθερό σε όλη τη διάρκεια της προθεσμιακής σε USD 3,65% σταθερό σε όλη τη διάρκεια της προθεσμιακής Συνολική Ετήσια Πραγματική Απόδοση (ΣΕΠΑ) Σ.Ε.Π.Α. : Η Συνολική Ετήσια Πραγματική Απόδοση (ΣΕΠΑ) υπολογίσθηκε με την παραδοχή ότι, η διάρκεια είναι τρεις μήνες (92 ημέρες), το κεφάλαιο της προθεσμιακής παραμένει αμετάβλητο και οι τόκοι καταβάλλονται στη λήξη της προθεσμιακής. Ως αποτέλεσμα, η ΣΕΠΑ απεικονίζεται με τα παρακάτω ποσοστά, μετά την φορολόγηση των τόκων (15%). Σε ευρώ 1,70% Σε USD 3,10% Κλείσιμο 4 Καταβολή τόκωνΣτη λήξη της προθεσμιακής κατάθεσης οι τόκοι καταβάλλονται στον συνδεδεμένο λογαριασμό Οι τόκοι υπόκεινται σε φορολόγηση (σήμερα 15%) 5 Ποσό Κατάθεσης Από €10.000 έως €100.000 για καταθέσεις σε Ευρώ Από $10.000 έως $100.000 για καταθέσεις σε Δολάριο ΗΠΑ 6 Πρόωρη εξόφλησηΕχετε δυνατότητα πρόωρης μερικής ή ολικής εξόφλησης της προθεσμιακής σας 7 ΕνημέρωσηΜέσω του Attica e-banking & Attica Mobile, έχετε 24ωρη πρόσβαση στα στοιχεία της προθεσμιακής σας κατάθεσης και, εφόσον το επιθυμείτε, κατά το άνοιγμά της μπορείτε να δηλώσετε να ενημερωθείτε μέσω μηνύματος SMS για τη λήξη της *Το προϊόν παρέχεται για νέα κεφάλαια. Πώς θα την αποκτήσετε Επισκεφθείτε ένα κατάστημά μας Φροντίστε να έχετε μαζί σας όλα τα απαραίτητα έγγραφα"
