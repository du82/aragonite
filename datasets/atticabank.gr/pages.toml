["https://www.atticabank.gr/el/companies/business-banking/asfalistika-programmata-gia-epicheiriseis/asfaliseis-mikromesaion-epicheiriseon"]
title = "Ασφαλίσεις Μικρομεσαίων Επιχειρήσεων - Attica Bank"
description = "Γνωρίζουμε πόσο σημαντική είναι η επιχείρησή σας τόσο για εσάς, όσο και για την οικογένειά σας. Για να σχεδιάζετε το μέλλον με ασφάλεια και να συνεχίζετε να φροντίζετε τους ανθρώπους που αγαπάτε…"
full_description = "Γνωρίζουμε πόσο σημαντική είναι η επιχείρησή σας τόσο για εσάς, όσο και για την οικογένειά σας. Για να σχεδιάζετε το μέλλον με ασφάλεια και να συνεχίζετε να φροντίζετε τους ανθρώπους που αγαπάτε, ακόμα κι αν συμβεί ένα απρόβλεπτο γεγονός στην επιχείρησή σας, έχουμε διαμορφώσει 3 ολοκληρωμένα προγράμματα ασφάλισης BUSINESS σε συνεργασία με την Interamerican. Προγράμματα 1 CLASSICΕξασφαλίζει την επιχείρησή σας από μια σειρά κινδύνων, όπως φωτιά και πλημμύρα, αλλά και από ζημιές που μπορεί να υποστεί σε περίοδο ταραχών. 2 EXTRAΕκτεταμένη ασφαλιστική προστασία και σιγουριά, με καλύψεις που πέρα από τη βασική προστασία, εξασφαλίζουν την επιχείρηση και τον εξοπλισμό σας από κλοπή ή ληστεία, αλλά και τη δική σας ευθύνη απέναντι σε τρίτους. 3 TOTALΈνα ολοκληρωμένο πρόγραμμα που προστατεύει εσάς, τους ανθρώπους και την επιχείρησή σας από κάθε κίνδυνο με καλύψεις σχεδιασμένες ώστε να διασφαλίζουν τη συνεχή λειτουργία της κάτω από όλες τις συνθήκες. Ποια είναι τα πλεονεκτήματα των προγραμμάτων Πρωτοποριακές καλύψεις που προστατεύουν τόσο το κτίριο όσο και το περιεχόμενο της επιχείρησης, με όλο το εμπόρευμα, τον εξοπλισμό και τις βελτιώσεις που έχετε πραγματοποιήσει στο κτίριο. Ιδιαίτερα οικονομικά και προσιτά ασφάλιστρα που ανταποκρίνονται στη σύγχρονη εποχή. Άμεση αποζημίωση σε αξία καινούργιου, ώστε να μπορείτε να αποκαταστήσετε τις ζημιές στην επιχείρηση. Ενημερωθείτε Επισκεφθείτε ένα κατάστημά μας. Φροντίστε να έχετε μαζί σας όλα τα απαραίτητα έγγραφα."
