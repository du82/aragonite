title = "Attica Μισθοδοσία - Attica Bank"
description = "Τί είναι και πώς επωφελείστε; Το Attica Μισθοδοσία είναι ένα νέο πρόγραμμα μισθοδοσίας με πραγματική υπεραξία για την επιχείρηση και τους εργαζομένους σας. Επωφεληθείτε από τις απλές και σύγχρονες…"
full_description = "Τί είναι και πώς επωφελείστε; Το Attica Μισθοδοσία είναι ένα νέο πρόγραμμα μισθοδοσίας με πραγματική υπεραξία για την επιχείρηση και τους εργαζομένους σας.Επωφεληθείτε από τις απλές και σύγχρονες διαδικασίες ανοίγματος και διαχείρισης, εξασφαλίζοντας τα πλέον ανταγωνιστικά προνόμια σε προϊόντα και υπηρεσίες της Attica Bank για το προσωπικό σας. Σε ποιους απευθύνεται; Ο λογαριασμός Attica Μισθοδοσία, απευθύνεται σε επιχειρήσεις με προσωπικό έως 15 άτομα. Πλεονεκτήματα για την επιχείρησή σας Εύκολη ενεργοποίησηΜε την υποστήριξη και καθοδήγηση του καταστήματος συνεργασίας, χωρίς χρονοβόρες διαδικασίες για την επιχείρηση και το προσωπικό σας, με ραντεβού στον χρόνο που σας εξυπηρετεί Καταβολή της μισθοδοσίαςΑπλά και με ασφάλεια, μέσα από το Attica e-banking για επιχειρήσεις. Άμεση πρόσβαση στα ιστορικά αρχεία πληρωμών μισθοδοσίας Συνεχής υποστήριξηΕνημέρωση και καθοδήγηση των εργαζόμενων της επιχείρησής σας, σχετικά µε το πρόγραμμα προνομίων που προσφέρουμε, στον χώρο της επιχείρησής σας Πλεονεκτήματα για το προσωπικό σας 1 Λογαριασμός Attica Μισθοδοσία με υψηλό επιτόκιο για κάθε ευρώ 0,85% για ποσά έως €1.500 0,15% για ποσά άνω των €1.500 2 Χρεωστική κάρτα – Visa Debit Για συναλλαγές σε Ελλάδα και Εξωτερικό, χωρίς κόστος ανανέωσης και δωρεάν ειδοποιήσεις στο κινητό.Δωρεάν αναλήψεις και από τα ΑΤΜ του πανελλαδικού Δικτύου ΑΤΜ της Euronet 3 Δυνατότητα χορήγησης πιστωτικής κάρτας – Visa Credit Χωρίς συνδρομή Προνομιακό επιτόκιο Δωρεάν δύο πρόσθετες κάρτες Πρόγραμμα επιβράβευσης συναλλαγών 4 Ευέλικτες χρηματοδοτικές λύσεις Άμεση αξιολόγηση Δωρεάν έξοδα εξέτασης καταναλωτικών δανείων 50% έκπτωση στα έξοδα εξέτασης στεγαστικών δανείων 5 Εύκολες καθημερινές συναλλαγές Νέο Attica e-banking & Attica Mobile Δωρεάν εισερχόμενα εμβάσματα (SEPA & Swift) 30% έκπτωση στα εξερχόμενα εμβάσματα μέσω ηλεκτρονικών καναλιών (SEPA) Δωρεάν όλες οι πάγιες εντολές 6 Προνομιακά ασφαλιστικά προγράμματα και παροχέςΔωρεάν ασφάλιση ζωής με βάση το υπόλοιπο του λογαριασμού μισθοδοσίας Αναλυτικές πληροφορίες ασφαλιστικών προγραμμάτων Δωρεάν Ομαδικό πρόγραμμα ασφάλισης ζωής, στο οποίο οι μισθοδοτούμενοι εντάσσονται αυτόματα με το άνοιγμα του λογαριασμού Παροχές προγράμματος ασφάλισης: Καλύπτεται ο κίνδυνος του Θανάτου, Διαρκούς Ολικής ή Μερικής Ανικανότητας του Ασφαλισμένου από ατύχημα Ασφαλιζόμενο ποσό: Το ασφαλιζόμενο ποσό είναι ίσο με το 100% του υπολοίπου ποσού του λογαριασμού μισθοδοσίας (την ημέρα επέλευσης του κινδύνου), με ελάχιστο όριο τα €100 και μέγιστο όριο τα €60.000 Ασφαλιζόμενα πρόσωπα: Οι μισθοδοτούμενοι, εφόσον είναι μόνιμοι κάτοικοι Ελλάδας και η ηλικία είναι άνω των 18 ετών και μικρότερη των 70 ετών, κατά την ημερομηνία έναρξης ασφάλισης Κλείσιμο Η επιχείρησή σας απασχολεί περισσότερα από 15 άτομα; Δημιουργήσαμε για εσάς τον λογαριασμό Attica Μισθοδοσία Plus με πλήθος προνομίων για την επιχείρηση και το προσωπικό σας. Μάθετε περισσότερα πατώντας εδώ! Πληροφορίες Ενημερωθείτε αναλυτικά επικοινωνώντας με τον επιχειρηματικό συνεργάτη του καταστήματος της Attica Bank που σας εξυπηρετεί ή στείλτε μας email στο info@atticabank.gr Πώς θα τον αποκτήσετε Επισκεφθείτε ένα κατάστημά μας. Ανοίξτε τον λογαριασμό σας online. Φροντίστε να έχετε μαζί σας όλα τα απαραίτητα έγγραφα."
