description = "Αγοράστε οικόπεδο ή αποκτήστε, επισκευάστε, ανακαινίστε ή επεκτείνετε την επαγγελματική σας στέγη και κινηθείτε με σιγουριά προς την επιτυχία. Επενδύστε στο μέλλον της επιχείρησής σας και ενισχύστε…"
full_description = "Αγοράστε οικόπεδο ή αποκτήστε, επισκευάστε, ανακαινίστε ή επεκτείνετε την επαγγελματική σας στέγη και κινηθείτε με σιγουριά προς την επιτυχία. Επενδύστε στο μέλλον της επιχείρησής σας και ενισχύστε τις αναπτυξιακές ανάγκες σας. Με μια γρήγορη ματιά 1 Ύψος ΧρηματοδότησηςAπό €10.000 2 ΕπιτόκιοΚυμαινόμενο επιτόκιο, 3Μ Euribor πλέον περιθωρίου (spread) από 3,50% έως 7,10% πλέον Εισφοράς Ν.128/75 (σήμερα 0,60%). Το επιτόκιο εξαρτάται από το είδος των παρεχόμενων εξασφαλίσεων αλλά και από την ενεργειακή κλάση του υπό αγορά/ανακαίνιση ακινήτου. 3 Διάρκεια ΔανείουΑπό 24 έως 240 μήνες 4 Περίοδος ΧάριτοςΔυνατότητα περιόδου χάριτος έως 36 μήνες, εφόσον υπάρχει κατασκευαστική περίοδος, χωρίς κεφαλαιοποίηση τόκων 5 ΑποπληρωμήΜηνιαίες ή τριμηνιαίες τοκοχρεωλυτικές δόσεις 6 Πρόωρη ΑποπληρωμήΥπάρχει η δυνατότητα είτε για ολική (πλήρη εξόφληση) είτε κατά ένα μέρος (μερική εξόφληση), όποτε επιθυμείτε Ποια είναι τα πλεονεκτήματα Με το δάνειο προκαθορισμένης διάρκειας Attica Business Στέγη: Χρηματοδοτείτε τις αναπτυξιακές ανάγκες της επιχείρησής σας με την αγορά επαγγελματικής στέγης ή την αναβάθμιση των εγκαταστάσεών σας χωρίς να διαταράσσετε τη ρευστότητα της επιχείρησης ή να εξαντλήσετε τα κεφάλαιά της. Απολαμβάνετε προνομιακό επιτόκιο, εφόσον η επαγγελματική σας στέγη κατατάσσεται σε υψηλή ενεργειακή κατηγορία. Καλύπτετε την άμεση ανάγκη στέγασης της επιχείρησής σας αντικαθιστώντας τη μηνιαία επαναλαμβανόμενη καταβολή του μισθώματος με επαναλαμβανόμενες μηνιαίες / τριμηνιαίες καταβολές στη δόση του δανείου σας αυξάνοντας τις επενδύσεις της επιχείρησής σας. Μεγάλη διάρκεια δανείου. Επιλέγετε τη συχνότητα αποπληρωμής και τη διάρκεια του δανείου επιτυγχάνοντας καλύτερο προγραμματισμό των υποχρεώσεων της επιχείρησης. Αξιοποιείτε περιουσιακά στοιχεία για τη μείωση του κόστους του δανείου. Ενημερωθείτε Επισκεφθείτε ένα κατάστημά μας. Φροντίστε να έχετε μαζί σας όλα τα απαραίτητα έγγραφα."
