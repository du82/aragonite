description = "Καλύψτε τις ανάγκες της επιχείρησής σας για κεφάλαιο κίνησης και εξασφαλίστε ρευστότητα με προνομιακούς όρους. Το νέο επιχειρηματικό δάνειο New Start μπορεί να καλύψει καθημερινές…"
full_description = "Καλύψτε τις ανάγκες της επιχείρησής σας για κεφάλαιο κίνησης και εξασφαλίστε ρευστότητα με προνομιακούς όρους. Το νέο επιχειρηματικό δάνειο New Start μπορεί να καλύψει καθημερινές, έκτακτες και αναπτυξιακές σας ανάγκες. Με μια γρήγορη ματιά 1 Ύψος χρηματοδότησηςΧρηματοδότηση από €30.000 έως €200.000 2 ΕπιτόκιοΣταθερό 4,5% σταθερό για όλη τη διάρκεια του δανείου, πλέον εισφοράς Ν.128/75 (σήμερα 0,60%) Συνολικό Ετήσιο Πραγματικό Ποσοστό Επιβάρυνσης Συνολικό Ετήσιο Πραγματικό Ποσοστό Επιβάρυνσης (ΣΕΠΠΕ): 5,48% κατά την 18/09/2024 Ποσό Δανείου: €50.000 Διάρκεια Δανείου: 5 έτη (60 μήνες) Σταθερό Επιτόκιο 4,50% (πλέον εισφοράς Ν. 128/75, 0,60%) Μηνιαίες δόσεις Ποσό σταθερής δόσης €947,81 Εφάπαξ Δαπάνη : € 300Συνολικό ποσό αποπληρωμής € 56.849,22 Το ανωτέρω ενδεικτικά Σ.Ε.Π.Π.Ε. υπολογίστηκε με τις εξής παραδοχές: 1.Το έτος υπολογίζεται σε 360 ημέρες 2.Το επιτόκιο παραμένει αμετάβλητο καθ’ όλο το διάστημα της αποπληρωμής του δανείου. 3.Οι πληρωμές των δόσεων του δανείου πραγματοποιούνται εμπρόθεσμα Κλείσιμο 3 Έξοδα δανείου Πάγιο €300 για ποσό δανείου έως €100.000 Πάγιο € 600 για ποσό δανείου άνω των €100.000 4 Διάρκεια δανείουΑπό 2 έως 5 έτη 5 ΑποπληρωμήΕξυπηρέτηση δανείου με τοκοχρεολυτικές δόσεις (μηνιαίες ή τριμηνιαίες) 6 Εκταμίευση ΔανείουΕφάπαξ, με γρήγορες και ευέλικτες διαδικασίες 7 Πρόωρη εξόφλησηΥπάρχει η δυνατότητα μερικής ή ολικής πρόωρης εξόφλησης του δανείου, χωρίς κόστος Ενημερωθείτε Επισκεφθείτε ένα κατάστημά μας Φροντίστε να έχετε μαζί σας όλα τα απαραίτητα έγγραφα"
