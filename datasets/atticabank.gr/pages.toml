full_description = "H Attica Bank προσφέρει στους πελάτες της τη δυνατότητα εξόφλησης μέσω των πιστωτικών καρτών Visa Credit & Visa Credit Gold, εφάπαξ ή με δόσεις, των οφειλών Δημοσίου. Αναλυτικά 1 Βεβαιωμένες οφειλές ΔΟΥέως 12 δόσεις 2 ΕΦΚΑέως 24 δόσεις 3 Τέλη Κυκλοφορίαςέως 12 δόσεις 4 Ελληνικό Κτηματολόγιοέως 12 δόσεις Το επιτόκιο των συναλλαγών είναι μηδενικό, εφόσον αποπληρώνεται το σύνολο της μηνιαίας οφειλής.Στην περίπτωση που αποπληρώνεται μέρος της μηνιαίας οφειλής, με ελάχιστη ή μερική μηνιαία εξόφληση αυτής, παραμένει το ισχύον επιτόκιο συναλλαγών της πιστωτικής κάρτας. Η εξόφληση των οφειλών Δημοσίου με τις Πιστωτικές Κάρτες Visa Credit & Visa Credit Gold είναι δυνατή τόσο μέσω της υπηρεσίας Attica e-banking & Attica Mobile όσο και μέσω του δικτύου Καταστημάτων της Attica Bank."
