full_description = "Τα αναφερόμενα επιτόκια αφορούν τα προϊόντα της Τράπεζας σε λογαριασμούς και προθεσμιακές καταθέσεις. Εξαιρούνται τα προϊόντα με διαπραγματεύσιμο επιτόκιο, το οποίο ορίζεται από τη διατραπεζική αγορά, ανάλογα με τη διάρκεια και το ποσό κατάθεσης. Οι πελάτες παρακαλούνται να απευθύνονται στις αρμόδιες Υπηρεσίες του Καταστήματος για τους πλήρεις και λεπτομερείς όρους κάθε προϊόντος ή υπηρεσίας. Επιτόκια Καταθέσεων – Χορηγήσεων Κατεβάστε το αρχείο (505kb)"
