nk – Αποφάσεις Έκτακτης Γενικής Συνέλευσης των Μετόχων Ανακοινώσεις 30 Αυγούστου 2024 Attica Bank – Ανακοίνωση – Έγκριση Συγχώνευσης Attica Bank – Παγκρήτιας Τράπεζας από την Επιτροπή Ανταγωνισμού Ανακοινώσεις 29 Αυγούστου 2024 Attica Bank – Ανακοίνωση – Έγκριση Συγχώνευσης Attica Bank – Παγκρήτιας Τράπεζας από την Τράπεζα της Ελλάδος Ανακοινώσεις 26 Αυγούστου 2024 Attica Bank – Τοποθέτηση Chief Insurance Business Officer Ανακοινώσεις 7 Αυγούστου 2024 Attica Bank – Ενημέρωση για τη διαβίβαση προσωπικών δεδομένων Ανακοινώσεις 26 Ιουλίου 2024 Attica Bank – Ανακοίνωση Ανακοινώσεις 24 Ιουλίου 2024 Attica Bank – Ενημέρωση Επενδυτικού Κοινού ‹12345›»"
