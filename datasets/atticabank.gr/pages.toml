full_description = "Τί είναι και πώς επωφελείστε; Το Attica Μισθοδοσία Plus είναι ένα νέο πρόγραμμα μισθοδοσίας με πραγματική υπεραξία για την επιχείρηση και τους εργαζομένους σας.Επωφεληθείτε από τις απλές και σύγχρονες διαδικασίες ανοίγματος και διαχείρισης, εξασφαλίζοντας τα πλέον ανταγωνιστικά προνόμια σε προϊόντα και υπηρεσίες της Attica Bank για το προσωπικό σας. Σε ποιους απευθύνεται Ο λογαριασμός Attica Μισθοδοσία Plus, απευθύνεται σε επιχειρήσεις με προσωπικό άνω των 15 ατόμων. Πλεονεκτήματα για την επιχείρησή σας Εύκολη ενεργοποίησηΧωρίς καμία ταλαιπωρία για εσάς, στην έδρα της επιχείρησής σας και σε χρόνο που σας εξυπηρετεί. Μαζικό άνοιγμα λογαριασμών και απόδοσης προνομίων (για επιχειρήσεις άνω των 50 μισθοδοτούμενων) Καταβολή της μισθοδοσίαςΑπλά και με ασφάλεια, μέσα από το Attica e-banking για επιχειρήσεις. Άμεση πρόσβαση στα ιστορικά αρχεία πληρωμών μισθοδοσίας Συνεχής υποστήριξη από εξειδικευμένη ομάδαΓια ό,τι χρειαστεί η επιχείρηση και το προσωπικό σας Πλεονεκτήματα για το προσωπικό σας 1 Λογαριασμός Attica Μισθοδοσία Plus με υψηλό επιτόκιο για κάθε ευρώ 1,00% για ποσά έως €1.500 0,50% για ποσά άνω των €1.500 2 Χρεωστική κάρτα – Visa DebitΓια συναλλαγές σε Ελλάδα και Εξωτερικό, χωρίς κόστος ανανέωσης και δωρεάν ειδοποιήσεις στο κινητό. Δωρεάν αναλήψεις και από τα ΑΤΜ του πανελλαδικού Δικτύου ΑΤΜ της Euronet 3 Δυνατότητα χορήγησης πιστωτικής κάρτας – Visa Credit Gold Χωρίς συνδρομή Προνομιακό επιτόκιο Δωρεάν δύο πρόσθετες κάρτες Πρόγραμμα επιβράβευσης συναλλαγών 4 Ευέλικτες χρηματοδοτικές λύσεις Άμεση αξιολόγηση Δωρεάν έξοδα εξέτασης καταναλωτικών δανείων 50% έκπτωση στα έξοδα εξέτασης στεγαστικών δανείων 5 Εύκολες καθημερινές συναλλαγές Νέο Attica e-banking & Attica Mobile Δωρεάν εισερχόμενα εμβάσματα (SEPA & Swift) 50% έκπτωση στα εξερχόμενα εμβάσματα μέσω ηλεκτρονικών καναλιών (SEPA) Δωρεάν όλες οι πάγιες εντολές 6 Προνομιακά ασφαλιστικά προγράμματα και παροχές Δωρεάν ασφάλιση ζωής με βάση το υπόλοιπο του λογαριασμού μισθοδοσίας Έκπτωση στα προγράμματα ασφάλισης αυτοκινήτου και κατοικίας μέσω του Αnytime@Work Ειδικά προνόμια στα πολυιατρεία Medifirst και Αθηναϊκή Κλινική Αναλυτικές πληροφορίες ασφαλιστικών προγραμμάτων Ασφάλιση Καταθετών Δωρεάν Ομαδικό πρόγραμμα ασφάλισης ζωής, στο οποίο οι μισθοδοτούμενοι εντάσσονται αυτόματα με το άνοιγμα του λογαριασμού Παροχές: Καλύπτεται ο κίνδυνος του Θανάτου, Διαρκούς Ολικής ή Μερικής Ανικανότητας του Ασφαλισμένου από ατύχημα Ασφαλιζόμενο ποσό: Το ασφαλιζόμενο ποσό είναι ίσο με το 100% του υπολοίπου ποσού του λογαριασμού μισθοδοσίας (την ημέρα επέλευσης του κινδύνου), με ελάχιστο όριο τα €100 και μέγιστο όριο τα €60.000 Ασφαλιζόμενα πρόσωπα: Οι μισθοδοτούμενοι, εφόσον είναι μόνιμοι κάτοικοι Ελλάδας και η ηλικία είναι άνω των 18 ετών και μικρότερη των 70 ετών, κατά την ημερομηνία έναρξης ασφάλισης Anytime @Work Ομαδική προσφορά ασφάλισης, η οποία απευθύνεται σε επιχειρήσεις με πολυπληθή αριθμό προσωπικού (>50). Για να ισχύουν οι εκπτώσεις του προγράμματος η επιχείρηση θα πρέπει να συμβληθεί με την Interamerican μέσω ασφαλιστηρίου συμβολαίου. Παροχές Προσφέρει 5% επιπλέον έκπτωση στα προγράμματα ασφάλισης αυτοκινήτου και κατοικίας της Anytime μέσω ειδικού κωδικού έκπτωσης Ασφαλιζόμενα πρόσωπα: Οι Μισθοδοτούμενοι και συγγενείς 1ου βαθμού Παροχές Πρωτοβάθμιας Περίθαλψης Πρόγραμμα πρωτοβάθμιας περίθαλψης στα Medifirst και στην Αθηναϊκή Κλινική, με ιδιαίτερα ανταγωνιστικές τιμές Παροχές προγράμματος: Περιλαμβάνονται, επισκέψεις σε ιατρούς, διαγνωστικές εξετάσεις, ιατρικές πράξεις Κλείσιμο Η επιχείρησή σας απασχολεί λιγότερα από 15 άτομα; Δημιουργήσαμε για εσάς τον λογαριασμό Attica Μισθοδοσία με πλήθος προνομίων για την επιχείρηση και το προσωπικό σας. Μάθετε περισσότερα πατώντας εδώ! Πληροφορίες Ενημερωθείτε αναλυτικά επικοινωνώντας με τον Relationship Officer της Attica Bank που σας εξυπηρετεί ή στείλτε μας email στο info@atticabank.gr"
