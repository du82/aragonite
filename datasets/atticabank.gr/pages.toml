title = "Ασφάλεια Ζωής - Attica Bank"
description = "Στην Attica Bank, προσφέρουμε ασφαλιστικές λύσεις για τη ζωή σας που είναι σχεδιασμένες για να σας παρέχουν ηρεμία και ασφάλεια."
full_description = "Γιατί να επιλέξετε ασφάλεια ζωής Στην Attica Bank, προσφέρουμε ασφαλιστικές λύσεις ζωής, σε συνεργασία με την Anytime by Interamerican, που είναι σχεδιασμένες για να σας παρέχουν ηρεμία και ασφάλεια, ακόμη και σε απρόβλεπτες καταστάσεις. Η ασφάλεια ζωής προσφέρει: Άμεση αντιμετώπιση τρεχόντων εξόδων οικογένειας Αποπληρωμή δανειακών υποχρεώσεων Αποπληρωμή φόρων κληρονομιάς Διασφάλιση μελλοντικής προοπτικής (σπουδές, αναπτυξιακός και επαγγελματικός προγραμματισμός) Η ασφάλεια ζωής σας προστατεύει ουσιαστικά αν είστε: Οικογενειάρχης ή έχετε εξαρτώμενα μέλη Με αυξημένες υποχρεώσεις (δάνεια, πιστωτικές κάρτες κ.λπ.) Επιχειρηματίας, που επιθυμείτε να εξασφαλίσετε την ομαλή συνέχιση της λειτουργίας της εταιρίας σε περίπτωση θανάτου του ενός εκ των συνεταίρων Καλύπτουμε τις ανάγκες σας με δύο βασικά προγράμματα ασφάλισης ζωής: 1 Attica Απλή Ασφάλεια ΖωήςTο πρόγραμμα παρέχει κάλυψη για απώλεια ζωής εντός προκαθορισμένης περιόδου, με ελάχιστη διάρκεια ασφάλισης 5 χρόνια και ελάχιστο ποσό ασφάλισης €10.000. 2 Attica Απλή Ασφάλεια Ζωής Ετήσιας ΔιαρκείαςΠροσφέρει τις ίδιες καλύψεις με το πρόγραμμα Απλής Ασφάλειας Ζωής, αλλά με διάρκεια μόνο για ένα χρόνο, με δυνατότητα ανανέωσης. Επιπλέον, προσφέρουμε δύο επιπρόσθετες και πολύτιμες καλύψεις: Απαλλαγή Πληρωμής Ασφαλίστρων: Σε περίπτωση αδυναμίας εργασίας λόγω ατυχήματος ή ασθένειας, αυτή η κάλυψη εξασφαλίζει ότι τα ασφάλιστρα θα πληρώνονται, διατηρώντας την ασφάλισή σας. Μόνιμη Ολική Ανικανότητα Εφάπαξ Κεφαλαίου: Προσφέρει ένα εφάπαξ ποσό σε περίπτωση μόνιμης ανικανότητας που σας εμποδίζει να εργαστείτε. *Ενδεικτικό παράδειγμα κόστους και οφέλους: Με ετήσιο κόστος €253 η οικογένεια μπορεί να λάβει €50.000, σε περίπτωση απώλειας ζωής του ασφαλισμένου. ( ισχύει άνδρα ηλικίας 40 ετών, υπάλληλο γραφείου. Το πρόγραμμά του είναι ATTICA ΑΠΛΗ ΑΣΦΑΛΕΙΑ ΖΩΗΣ, διάρκεια ασφαλιστικής κάλυψης 25 χρόνια, με τιμολόγηση Μαΐου 2021). Το ασφάλιστρο ανεβαίνει στα €338, εάν προστεθούν οι καλύψεις «Απαλλαγή Πληρωμής Ασφαλίστρων» και «Μόνιμη Ολική Ανικανότητα Εφάπαξ Κεφαλαίου» €50.000."
