title = "Δικαιολογητικά νομιμοποίησης - Attica Bank"
description = """
πρόσφατο (μηνός) πιστοποιητικό ΓΕΜΗ περί εταιρικών μεταβολών 
Υπεύθυνη δήλωση υπογεγραμμένη από τον νόμιμο εκπρόσωπο της εταιρείας: ότι τα προσκομισθέντα έγγραφα-πιστοποιητικά (τα οποία και θα αναφέρονται αναλυτικά επί της δηλώσεως) περιγράφουν την αληθή και πραγματική ισχύουσα εταιρική κατάσταση και εκπροσώπηση, ότι δεν έχουν επέλθει τροποποιήσεις ή αλλαγές, καθώς και ότι αναλαμβάνεται η υποχρέωση για άμεση γνωστοποίηση στην Τράπεζα κάθε μελλοντικής τροποποίησης του καταστατικού ή της τυχόν μεταβολής καθ’ οιονδήποτε τρόπο της εταιρικής κατάστασης και εκπροσώπησης.

*Μετά την εξέταση των ανωτέρω εγγράφων, ενδέχεται να ζητηθούν συμπληρωματικά έγγραφα και/ή διευκρινίσεις για την ολοκλήρωσή της."""
full_description = "Μπορείτε να κάνετε το αίτημα ανανέωσης ή τροποποίησης της γνωμάτευσης νομιμοποίησης της επιχείρησης σας μέσω του καταστήματος συνεργασίας σας. Ατομικές Επιχειρήσεις / Ελεύθεροι Επαγγελματίες Έγγραφα νομιμοποίησης της επιχείρησης πρόσφατο (μηνός) πιστοποιητικό ΓΕΜΗ περί εταιρικών μεταβολών Υπεύθυνη δήλωση υπογεγραμμένη από τον νόμιμο εκπρόσωπο της εταιρείας: ότι τα προσκομισθέντα έγγραφα-πιστοποιητικά (τα οποία και θα αναφέρονται αναλυτικά επί της δηλώσεως) περιγράφουν την αληθή και πραγματική ισχύουσα εταιρική κατάσταση και εκπροσώπηση, ότι δεν έχουν επέλθει τροποποιήσεις ή αλλαγές, καθώς και ότι αναλαμβάνεται η υποχρέωση για άμεση γνωστοποίηση στην Τράπεζα κάθε μελλοντικής τροποποίησης του καταστατικού ή της τυχόν μεταβολής καθ’ οιονδήποτε τρόπο της εταιρικής κατάστασης και εκπροσώπησης. *Μετά την εξέταση των ανωτέρω εγγράφων, ενδέχεται να ζητηθούν συμπληρωματικά έγγραφα και/ή διευκρινίσεις για την ολοκλήρωσή της. Ομόρρυθμη / Εταιρόρρυθμη Εταιρεία Έγγραφα νομιμοποίησης της επιχείρησης Πρόσφατο Πιστοποιητικό ΓΕΜΗ περί των γενόμενων μεταβολών (μηνός) Αν υφίσταται τροποποίηση καταστατικού, την προσκόμιση του τροποποιημένου καταστατικού Υπεύθυνη δήλωση υπογεγραμμένη από τον νόμιμο εκπρόσωπο της εταιρείας: ότι τα προσκομισθέντα έγγραφα-πιστοποιητικά (τα οποία και θα αναφέρονται αναλυτικά επί της δηλώσεως) περιγράφουν την αληθή και πραγματική ισχύουσα εταιρική κατάσταση και εκπροσώπηση, ότι δεν έχουν επέλθει τροποποιήσεις ή αλλαγές, καθώς και ότι αναλαμβάνεται η υποχρέωση για άμεση γνωστοποίηση στην Τράπεζα κάθε μελλοντικής τροποποίησης του καταστατικού ή της τυχόν μεταβολής καθ’ οιονδήποτε τρόπο της εταιρικής κατάστασης και εκπροσώπησης. Πρόσφατα οικονομικά στοιχεία της εταιρείας και των διαχειριστών της *Μετά την εξέταση των ανωτέρω εγγράφων, ενδέχεται να ζητηθούν συμπληρωματικά έγγραφα και/ή διευκρινίσεις για την ολοκλήρωσή της. Εκτυπώστε τη λίστα Ιδιωτική Κεφαλαιουχική Εταιρεία Έγγραφα νομιμοποίησης της εταιρείας Πρόσφατο Πιστοποιητικό ΓΕΜΗ περί τ