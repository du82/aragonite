["https://www.atticabank.gr/el/companies/anaptyxiaka-programmata/programmata-evropaikou-tameiou-ependyseon/parochi-mikropistoseon-easi"]
title = "Παροχή Μικροπιστώσεων EaSI - Attica Bank"
description = """
Ανώτατο Ποσό Δανείου: €50.000 (€25.000 ανά σύμβαση δανείου)
Διάρκεια: έως 6 έτη
Επιτόκιο: Το τελικό επιτόκιο (εξαιρουμένης της εισφοράς του Ν.128/75) δε μπορεί να υπερβαίνει το 6,5% και είναι μειωμένο σε σχέση με μια ανάλογη χρηματοδότηση από ίδια κεφάλαια της Τράπεζας κατά τουλάχιστον 0,5%, σε σχέση με το επιτόκιο που θα είχε η επιχείρηση αν χρηματοδοτούνταν με προϊόν της Τράπεζας χωρίς την εγγύηση του ΕΤαΕ.
Τρόπος αποπληρωμής: Με ισόποσες μηνιαίες ή τριμηνιαίες χρεωλυτικές δόσεις
Περίοδος χάριτος: μέχρι 6 μήνες
Εξασφαλίσεις: Δεν ζητούνται εξασφαλίσεις πέραν μόνο τυχόν ενοχικών (προσωπικών) εγγυήσεων
Κόστος: Εφάπαξ δαπάνη εξέτασης αιτήματος: €150"""
full_description = "Η Attica Bank, σε συνεργασία με το Ευρωπαϊκό Ταμείο Επενδύσεων (εφεξής ΕΤαΕ), συμμετέχει στο Πρόγραμμα Εγγυήσεων «EaSI» με στόχο την ενίσχυση ελεύθερων επαγγελματιών και πολύ μικρών επιχειρήσεων, παρέχοντας δάνεια με ιδιαιτέρως προνομιακούς όρους. Οι υποστηριζόμενες χρηματοδοτήσεις επωφελούνται από την υποστήριξη της Ευρωπαϊκής Ένωσης δυνάμει του μηχανισμού εγγυήσεων που συστάθηκε βάσει του κανονισμού (ΕΕ) αριθ. 1296/2013 του Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου για τη θέσπιση προγράμματος της Ευρωπαϊκής Ένωσης για την απασχόληση και την κοινωνική καινοτομία («EaSI») και του Ευρωπαϊκού Ταμείου Στρατηγικών Επενδύσεων («ΕΤΣΕ»), που συστάθηκε στο πλαίσιο του επενδυτικού σχεδίου για την Ευρώπη. Σκοπός του ΕΤΣΕ είναι να συμβάλει στην υποστήριξη της χρηματοδότησης και εφαρμογής παραγωγικών επενδύσεων στην Ευρωπαϊκή Ένωση και να διασφαλίσει αυξημένη πρόσβαση στη χρηματοδότηση. Περισσότερες πληροφορίες για το ΕΤΣΕ διατίθενται στην ιστοσελίδα της Ευρωπαϊκής Επιτροπής. Μία γρήγορη ματιά στο πρόγραμμα 1 Μέσω του Προγράμματος «EaSI» επιδιώκεται η παροχή χρηματοδοτικής στήριξης υφιστάμενων, νεοσύστατων και start-up (νεοφυείς, καινοτόμες κ.λπ.) πολύ μικρών επιχειρήσεων και επαγγελματιών, οι οποίες: απασχολούν έως 10 εργαζομένους εμφανίζουν ετήσιο κύκλο εργασιών έως 2 εκ. ευρώ είναι ασφαλιστικά ενήμερες κατά την εκταμίευση της χρηματοδότησης είναι οικονομικά βιώσιμες σύμφωνα με τους πιστωτικούς κανόνες και τα κριτήρια της Τράπεζας. 2 Ειδικότερα, μέσω του προγράμματος EaSI, διευκολύνεται η πρόσβαση των δικαιούχων σε μικροπιστώσεις μέχρι €50.000 με την εγγύηση του ΕΤαΕ, για κάλυψη αναγκών: κεφαλαίου κίνησης ή/και υλοποίησης επενδύσεων σε πάγια στοιχεία (εξοπλισμός, επαγγελματική στέγη, άυλα πάγια, κ.λπ.) Στο πλαίσιο διάθεσης του Προγράμματος, η Attica Bank παρέχει εστιασμένα προγράμματα συμβουλευτικής υποστήριξης και καθοδήγησης (υπηρεσίες Mentoring) για την υποστήριξη των δικαιούχων που θα ενταχθούν στο πρόγραμμα. Η επιλογή της χρήσης ή μη των υπηρεσιών Mentoring, επαφίεται στη διακριτική ευχέρεια των πιστούχων. Ειδικότερα Η χρηματοδότηση Ανώτατο Ποσό Δανείου: €50.000 (€25.000 ανά σύμβαση δανείου) Διάρκεια: έως 6 έτη Επιτόκιο: Το τελικό επιτόκιο (εξαιρουμένης της εισφοράς του Ν.128/75) δε μπορεί να υπερβαίνει το 6,5% και είναι μειωμένο σε σχέση με μια ανάλογη χρηματοδότηση από ίδια κεφάλαια της Τράπεζας κατά τουλάχιστον 0,5%, σε σχέση με το επιτόκιο που θα είχε η επιχείρηση αν χρηματοδοτούνταν με προϊόν της Τράπεζας χωρίς την εγγύηση του ΕΤαΕ. Τρόπος αποπληρωμής: Με ισόποσες μηνιαίες ή τριμηνιαίες χρεωλυτικές δόσεις Περίοδος χάριτος: μέχρι 6 μήνες Εξασφαλίσεις: Δεν ζητούνται εξασφαλίσεις πέραν μόνο τυχόν ενοχικών (προσωπικών) εγγυήσεων Κόστος: Εφάπαξ δαπάνη εξέτασης αιτήματος: €150 Κριτήρια επιλεξιμότητας Επιλέξιμες επιχειρήσεις:O τελικός δικαιούχος του Προγράμματος θα πρέπει να: έχει έδρα και να δραστηριοποιείται νόμιμα στην Ελλάδα ή εφόσον είναι φυσικό πρόσωπο, να είναι κάτοικος Ελλάδας, να μην είναι εγκατεστημένος/έχει ιδρυθεί σε κάποια χώρα που δεν συνεργάζεται με την Ευρωπαϊκή Ένωση σε σχέση με την εφαρμογή του διεθνώς συμφωνημένου φορολογικού προτύπου (ήτοι κάθε δικαιοδοσία που εκάστοτε χαρακτηρίζεται ως «μη συμμορφούμενη» από τον Οργανισμό Οικονομικής Συνεργασίας και Ανάπτυξης [ΟΟΣΑ] και το Διεθνές Φόρουμ αυτού για τη Διαφάνεια και την Ανταλλαγή Πληροφοριών για Φορολογικούς Σκοπούς, εκτός εάν υπάρξει διαφορετική ενημέρωση από το ΕΤαΕ). μην έχει περιέλθει σε καθεστώς πτώχευσης, χρεοκοπίας ή σε παρόμοιες καταστάσεις και δεν συντρέχουν στην περίπτωσή του οι προϋποθέσεις, σύμφωνα με την εθνική νομοθεσία, για να υπαχθεί σε οποιαδήποτε συλλογική διαδικασία λόγω αφερεγγυότητας (π.χ. πτωχευτική διαδικασία) κατόπιν αιτήματος των πιστωτών του, μην εμπλέκεται στο πλαίσιο επιχειρηματικής του δραστηριότητας, σε οποιαδήποτε δραστηριότητα που είναι παράνομη σύμφωνα με την εθνική νομοθεσία, (το εν λόγω κριτήριο θα πρέπει να τηρείται καθόλη της διάρκεια της χρηματοδότησης). Ως παράνομες δραστηριότητες νοούνται οποιεσδήποτε από τις ακόλουθες παράνομες δραστηριότητες ή δραστηριότητες που πραγματοποιούνται για παράνομους σκοπούς: φοροδιαφυγή, φορολογική απάτη, απάτη, διαφθορά, εξαναγκασμός, συμπαιγνία, παρεμπόδιση, νομιμοποίηση εσόδων από παράνομες δραστηριότητες, χρηματοδότηση της τρομοκρατίας ή οποιαδήποτε άλλη παράνομη δραστηριότητα, που δύναται να επηρεάσει τα οικονομικά συμφέροντα της Ευρωπαϊκής Ένωσης, σύμφωνα με το εφαρμοστέο δίκαιο, δεν είναι πρόσωπο στο οποίο έχουν επιβληθεί κυρώσεις, δεσμεύσεις , κατασχέσεις ή περιορισμοί («sanctioned person»), λ.χ. σύμφωνα με το άρ. 215 της Συνθήκης για την λειτουργία της Ευρωπαϊκής Ένωσης ή σύμφωνα με το άρ. 29 της Συνθήκης για την Ευρωπαϊκή Ένωση (το εν λόγω κριτήριο θα πρέπει να τηρείται καθόλη της διάρκεια της χρηματοδότησης), κρίνεται πιστοληπτικά αποδεκτός σύμφωνα με την ισχύουσα πιστωτική πολιτική και τις εσωτερικές διαδικασίες της Τράπεζας, μην έχει αντικείμενο δραστηριότητας που περιλαμβάνεται στη λίστα των απαγορευμένων κλάδων του ΕΤαΕ ή σε αυτές των καταστάσεων αποκλεισμού όπως ορίζονται κάτωθι. Απαγορευμένοι τομείς: Παράνομες Οικονομικές Δραστηριότητες Οποιαδήποτε παραγωγή, εμπόριο ή άλλη δραστηριότητα, η οποία είναι παράνομη σύμφωνα με την ελληνική και κοινοτική νομοθεσία. Η ανθρώπινη κλωνοποίηση για αναπαραγωγικούς σκοπούς θεωρείται παράνομη οικονομική δραστηριότητα. Επιχειρήσεις Καπνού και αλκοολούχων ποτών Επιχειρήσεις που δραστηριοποιούνται στην παρασκευή, επεξεργασία και εμπορία καπνού και προϊόντων καπνού ή αποσταγμένων αλκοολούχων ποτών και συναφών προϊόντων Παραγωγή και εμπόριο όπλων και πυρομαχικών Η χρηματοδότηση της παραγωγής και του εμπορίου όπλων και πυρομαχικών οποιουδήποτε είδους. Αυτός ο περιορισμός δεν ισχύει στο βαθμό που τέτοιες δραστηριότητες αποτελούν μέρος ή παρεπόμενες σε ρητές πολιτικές της Ευρωπαϊκής Ένωσης και του Ελληνικού Κράτους. Καζίνο Καζίνο και συναφείς δραστηριότητες. Περιορισμοί τομέων Πληροφορικής Έρευνα, ανάπτυξη ή τεχνικές εφαρμογές που σχετίζονται με προγράμματα ή λύσεις ηλεκτρονικών δεδομένων, οι οποίες: στοχεύουν συγκεκριμένα: υποστήριξη οποιασδήποτε δραστηριότητας που περιλαμβάνεται στους περιορισμένους τομείς που αναφέρονται στα σημεία 1. έως 4. (συμπεριλαμβανομένου) ανωτέρω διαδικτυακά τυχερά παιχνίδια και διαδικτυακά καζίνο ή πορνογραφία, ή που προορίζονται να επιτρέψουν παράνομα: την πρόσβαση σε ηλεκτρονικά δίκτυα δεδομένων ή την λήψη ηλεκτρονικών δεδομένων. Περιορισμοί στον τομέα των βιοεπιστημών Κατά την παροχή υποστήριξης για τη χρηματοδότηση της έρευνας, ανάπτυξης ή τεχνικών εφαρμογών που σχετίζονται με: ανθρώπινη κλωνοποίηση για ερευνητικούς ή θεραπευτικούς σκοπούς · και Γενετικά Τροποποιημένους Οργανισμούς («ΓΤΟ»). Καταστάσεις αποκλεισμού Ο δικαιούχος θα πρέπει να μην βρίσκεται: Σε κατάσταση πτώχευσης ή εκκαθάρισης ή αναγκαστικής διαχείρισης ή αναστολής της επιχειρηματικής του δραστηριότητας, ούτε να έχει κινηθεί σε βάρος του ανάλογη διαδικασία για τα θέματα αυτά ή σε οποιαδήποτε άλλη ανάλογη κατάσταση που απορρέει από παρόμοια διαδικασία και προβλέπεται από τις εθνικές νομοθετικές ή κανονιστικές διατάξεις, ούτε και να έχει έρθει κατά τα τελευταία πέντε (5) χρόνια σε συμφωνία με πιστωτές ή καταχωρημένος στην κεντρική βάση δεδομένων αποκλεισμού, η οποία έχει δημιουργηθεί και λειτουργεί από την Ευρωπαϊκή Επιτροπή δυνάμει του Κανονισμού της Ευρωπαϊκής Επιτροπής υπ’ αριθ. 1302/2008 και της 17ης Δεκεμβρίου 2008. κατά τα τελευταία πέντε (5) έτη πριν από τη σχετική ημερομηνία: ο ίδιος ή οποιοδήποτε άλλο πρόσωπο με δικαίωμα εκπροσώπησης ή λήψης αποφάσεων ή άσκησης ελέγχου στο νομικό πρόσωπο του τελικού δικαιούχου, να μην έχει καταδικαστεί για αδίκημα που αφορά στην επαγγελματική δεοντολογία με δικαστική απόφαση που έχει ισχύ δεδικασμένου, το οποίο (γεγονός) θα επηρέαζε τη δυνατότητα του τελικού δικαιούχου να εκπληρώσει τις υποχρεώσεις του που απορρέουν από τη Σύμβαση χρηματοδότησης ή να μην έχει εκδοθεί κατά του ιδίου ή οποιουδήποτε άλλου προσώπου με δικαίωμα εκπροσώπησης ή λήψης αποφάσεων ή άσκησης ελέγχου στο νομικό πρόσωπο του τελικού δικαιούχου, δικαστική απόφαση με ισχύ δεδικασμένου για απάτη, διαφθορά, συμμετοχή σε εγκληματική οργάνωση, ξέπλυμα μαύρου χρήματος ή κάθε άλλη παράνομη δραστηριότητα, η οποία είναι επιβλαβής για τα οικονομικά συμφέροντα της Ευρωπαϊκής Ένωσης. Απαραίτητα δικαιολογητικά Αίτηση Δανείου Μικροπιστώσεις EaSI Βεβαίωση Έναρξης Εργασιών από τη Δ.Ο.Υ. (taxis) & τυχόν μεταβολές Γενική Υπεύθυνη Δήλωση πλήρωσης κριτηρίων Επιλεξιμότητας Υπόδειγμα Δήλωσης ΜΜΕ Γενικό Πιστοποιητικό ΓΕΜΗ έκδοσης τρέχοντος μηνός / Ενιαίο Πιστοποιητικό Δικαστικής Φερεγγυότητας Αναλυτικές περιοδικές δηλώσεις (Α.Π.Δ) ΙΚΑ τελευταίου έτους ή Βεβαίωση ΙΚΑ περί μη απασχόλησης προσωπικού ή Υπεύθυνη Δήλωση του Νόμιμου Εκπροσώπου ότι η επιχείρηση δεν απασχολεί προσωπικό ή (σε περίπτωση υπό-σύσταση ή νεοσύστατων επιχειρήσεων) Υπεύθυνη Δήλωση του νόμιμου εκπροσώπου της επιχείρησης ότι κατά το έτος υποβολής της αίτησης θα απασχολήσει λιγότερους από 10 εργαζομένους σε ΕΜΕ ή η επιχείρηση δε θα απασχολήσει προσωπικό Αντίγραφα E3 τριών τελευταίων διαχειριστικών χρήσεων Αντίγραφο Ε1 της τελευταίας φορολογικής δήλωσης (προκειμένου για ατομικές επιχειρήσεις) Δημοσιευμένοι Ισολογισμοί τριών κλεισμένων διαχειριστικών χρήσεων με ανάλυση Αποτελεσμάτων και με το αντίστοιχο Προσάρτημα Πρόσφατο Ισοζύγιο Α’ βάθμιων και Β’ βάθμιων Λογαριασμών Γενικού Καθολικού της τρέχουσας χρήσης καθώς και το Ισοζύγιο της αντίστοιχης χρονικής περιόδου της προηγούμενης χρήσης Εκκαθαριστικές – περιοδικές δηλώσεις Φ.Π.Α. τρέχοντος έτους (για επιχ/σεις με Β’ κατηγ. βιβλία) Εκκαθαριστικές – περιοδικές δηλώσεις Φ.Π.Α. προηγούμενου έτους (για επιχ/σεις με Β’ κατηγ. βιβλία) Έντυπο περιγραφής επιχειρηματικού σχεδίου (εφόσον απαιτείται) Αντίγραφο Ε9/ΕΝΦΙΑ της επιχείρησης Δικαιολογητικά φυσικών προσώπων (μετόχων/εταίρων ΚΑΙ τυχόν εγγυητών) (εκκαθαριστικό Φορολογίας Εισοδήματος του τελευταίου έτους ή αντίγραφο Ε1, αντίγραφο E9, ταυτότητα ή διαβατήριο) Παροχή συμβουλευτικών υπηρεσιών Στο πλαίσιο του προγράμματος για την Απασχόληση και την Κοινωνική Καινοτομία (EaSI), εξειδικευμένοι συνεργάτες της Attica Bank παρέχουν στους δικαιούχους του προγράμματος, συμβουλευτικές και εκπαιδευτικές υπηρεσίες για την υποστήριξη της ίδρυσης ή της ανάπτυξης της επιχείρησής τους.Με σκοπό την ανάπτυξη των απαραίτητων δεξιοτήτων για τη βελτίωση της απόδοσης και βιωσιμότητας των πολύ μικρών επιχειρήσεων και την υποστήριξη των δικαιούχων, σχεδιάστηκαν και αναπτύχθηκαν εξειδικευμένα εκπαιδευτικά προγράμματα με κριτήρια, μεταξύ άλλων, την παροχή βασικών γνώσεων στην εκπόνηση ενός επιχειρηματικού σχεδίου, αλλά και με περιεχόμενο που δύναται να προσαρμοστεί στις ανάγκες της εκάστοτε επιχείρησης. Οι υπηρεσίες που παρέχονται περιλαμβάνουν: α) δωρεάν εκπαιδευτική ασύγχρονη τηλεκπαίδευση (e-learning) διάρκειας οκτώ (8) ορών, με βασικό αντικείμενο εκπαίδευσης την ανάπτυξη των απαραίτητων δεξιοτήτων για την κατάρτιση ενός επιχειρηματικού σχεδίου (Business Plan). β) εξατομικευμένες συμβουλευτικές υπηρεσίες (consulting) και υπηρεσίες καθοδήγησης (coaching) διάρκειας μίας (1) ώρας. Η εν λόγω παροχή είναι προαιρετική και επιβαρύνει τον δικαιούχο και καταβάλλεται στη συνεργαζόμενη εταιρία, δεν σχετίζεται δε, με την τιμολόγηση/έξοδα του δανείου.Περισσότερες πληροφορίες σχετικά με τα εκπαιδευτικά προγράμματα και τις συμβουλευτικές υπηρεσίες μπορείτε να αναζητήσετε στο δίκτυο καταστημάτων της Attica Bank. Περίοδος Διάθεσης Προγράμματος Το Πρόγραμμα διατίθεται μέχρι 31.12.2025 ή μέχρι εξαντλήσεως των διαθέσιμων κονδυλίων. Επιπλέον πληροφορίες Για περισσότερες πληροφορίες σχετικά με το πρόγραμμα EaSI μπορείτε να ανατρέξετε στις παρακάτω ιστοσελίδες ενημέρωσης της Ευρωπαϊκής Ένωσης και του Ευρωπαϊκού Ταμείου Επενδύσεων: https://ec.europa.eu/social/main.jsp?catId=1081&langId=elhttp://ec.europa.eu/social/microfinancehttps://www.eif.org/what_we_do/microfinance/easi/https://www.eif.org/easi"
