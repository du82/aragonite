description = "Με το στεγαστικό δάνειο Attica My Home έχετε τη δυνατότητα να αγοράσετε, να ανακαινίσετε ή να επεκτείνετε την κατοικία σας. Η διαδικασία είναι απλή."
full_description = "Τι είναι και πώς επωφελείστε; Με το στεγαστικό δάνειο Attica My Home έχετε τη δυνατότητα να αγοράσετε νέα κατοικία ή να πραγματοποιήσετε εργασίες ανέγερσης, αποπεράτωσης, επέκτασης ανακαίνισης ή επισκευής της κατοικίας σας, ενώ μπορείτε να προχωρήσετε και στην αγορά οικοπέδου για ανέγερση (εφόσον υφίσταται οικοδομική άδεια σε ισχύ) καθώς και στην αποπληρωμή στεγαστικού δανείου άλλης τράπεζας και μεταφοράς του στην Attica Bank.Η διαδικασία είναι απλή, ευέλικτη και προσαρμοσμένη στις ανάγκες σας. Με μια γρήγορη ματιά 1 Ποσό χορήγησηςΑπό €20.000 2 ΕπιτόκιοΣταθερό καθ’ όλη τη διάρκεια του δανείουΣταθερό για τα πρώτα έτη από 3%* και εν συνεχεία κυμαινόμενο βάσει Euribor 3m πλέον περιθωρίου (spread) από 1,60%* ήΚυμαινόμενο βάσει Euribor 3m πλέον περιθωρίου (spread) από 1,60%* καθ’ όλη τη διάρκεια του δανείου*Το τελικό ύψος του επιτοκίου εξαρτάται από το ποσοστό χρηματοδότησης. Τα ανωτέρω αναφερόμενα επιτόκια είναι ονομαστικά και επιβαρύνονται με Εισφορά του Ν.128/75 (σήμερα 0,12%) Συνολικό Ετήσιο Πραγματικό Ποσοστό Επιβάρυνσης (ΣΕΠΠΕ) Συνολικό Ετήσιο Πραγματικό Ποσοστό Επιβάρυνσης (ΣΕΠΠΕ): 5,277% κατά την 26/07/2024Ποσό Δανείου: €100.000Διάρκεια Δανείου: 15 έτη (180 μήνες)Ποσό δόσης € 776,28 σταθερή για 180 δόσειςΣταθερό επιτόκιο για τα 15 έτη: 4,60% (πλέον εισφοράς Ν. 128/75, 0,12%)Ποσοστό δανείου σε σχέση με την εκτιμώμενη αξία του χρηματοδοτούμενου ακινήτου (LTV): από 60% έως 80%Εφάπαξ Δαπάνη για Έρευνα, Έλεγχο του Αιτήματος & Έγκρισης δανείου Attica My Home 480,00 συνολικές άλλες εφάπαξ δαπάνες: 742 € και συνολικών εξόδων ασφάλισης : 2.250 €Συνολικό ποσό αποπληρωμής € 143.202,40 Κλείσιμο 3 ΔιάρκειαΑπό 3 έως 30 έτη. 4 Ασφαλιστική ΚάλυψηΥποχρεωτική ασφάλεια ακινήτου πυρός- σεισμού για όλη τη διάρκεια του δανείου. Προαιρετική ασφάλεια ζωής δανειολήπτη.Ενημερωθείτε για τα ασφαλιστικά προγράμματα που μπορεί να σας προσφέρει η Attica Bank σε συνεργασία με την Interamerican. 5 ΑποπληρωμήΣε μηνιαίες δόσεις που αποπληρώνουν τόκο και κεφάλαιο αυτόματα από τον καταθετικό λογαριασμό σας, ενώ έχετε τη δυνατότητα:Tμηματικών εκταμιεύσεων.Πρόωρης εξόφλησης του δανείου χωρίς κόστος.Παροχής περιόδου χάριτος έως και 24 μήνες. Χρηματοδότηση Χρηματοδότηση που ανέρχεται έως και στο 80% της εκτιμηθείσας αξίας ακινήτου (με εξασφάλιση την εγγραφή προσημείωσης υποθήκης επί ακινήτου) ή έως και το 100% της εκτιμηθείσας αξίας του ακινήτου (με εξασφάλιση ενεχυρίαση μετρητών) και έως το 100% του συμβολαίου αγοράς. Έκπτωση Επιτοκίου Εξασφαλίστε έκπτωση 0,15% για ακίνητα κατηγορίας Α+ ή Α, Β+ ή Β, βάσει του Πιστοποιητικού Ενεργειακής Απόδοσης του ακινήτου σας. Ενημερωθείτε Επισκεφθείτε ένα κατάστημά μας. Φροντίστε να έχετε μαζί σας όλα τα απαραίτητα έγγραφα."
