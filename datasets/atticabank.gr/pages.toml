title = "Personal Cyber Insurance - Attica Bank"
description = "Με το Πρόγραμμα Personal Cyber Insurance για ασφαλείς ηλεκτρονικές συναλλαγές, δίνεται έμφαση στην προστασία των δεδομένων και την ασφάλεια των συναλλαγών σας."
full_description = "Τι είναι και πώς επωφελείστε Η Attica Bank, σε συνεργασία με την Anytime by Interamerican, προσφέρει το πρόγραμμα Personal Cyber Insurance για ασφαλείς ηλεκτρονικές συναλλαγές, δίνοντας έμφαση στην προστασία των δεδομένων και την ασφάλεια των συναλλαγών σας. Σχετικά με το πρόγραμμα Το πρόγραμμα καλύπτει τον ασφαλισμένο για διαδικτυακές αγορές και διαδικτυακές συναλλαγές πληρωμών. Με μια γρήγορη ματιά 1 Ασφαλιστική κάλυψηΤο Πρόγραμμα προσφέρει ασφαλιστική κάλυψη για διαδικτυακές αγορές και συναλλαγές πληρωμών. Συγκεκριμένα, καλύπτει περιπτώσεις όπου προϊόντα αγορασμένα διαδικτυακά είτε δεν παραδόθηκαν είτε διέφεραν από τα επιλεγμένα ή παρουσίασαν υλικές ζημιές κατά την παραλαβή τους. Επιπλέον, καλύπτει υπηρεσίες που αγοράστηκαν διαδικτυακά αλλά δεν παρασχέθηκαν τη συμφωνημένη ημερομηνία. Αναφορικά με τις διαδικτυακές συναλλαγές πληρωμών, το πρόγραμμα καλύπτει συναλλαγές που έγιναν χωρίς την έγκριση του ασφαλισμένου, είτε από τον τραπεζικό λογαριασμό είτε από την πιστωτική ή χρεωστική κάρτα του, καθώς και από τις τραπεζικές ηλεκτρονικές εφαρμογές πληρωμών του, όπως το e-banking και τις εφαρμογές mobile banking. 2 Όριο κάλυψηςΑνώτατο όριο κάλυψης €1.500 για κάθε κάλυψη και συνολικά €3.000 με απαλλαγή €50 σε κάθε ζημιά (ανά συναλλαγή). 3 Ασφάλιστρα€25 τον χρόνο Ποιοι μπορούν να ασφαλιστούν Άτομα ηλικίας 18+ που διαμένουν στην Ελλάδα τα οποία: κάνουν online αγορές ακόμα κι αν το προϊόν/υπηρεσία που αγοράζουν πληρωθεί με αντικαταβολή διατηρούν ενεργούς ελληνικούς τραπεζικούς λογαριασμούς στο όνομά τους και συναλλάσσονται με αυτούς"
