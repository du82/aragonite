["https://www.atticabank.gr/el/individuals/insurance-products/asfalistika-programmata-gia-idiotes/asfaleia-spitiou"]
title = "Ασφάλεια Σπιτιού - Attica Bank"
description = "Μπορείτε σήμερα να ασφαλίσετε το σπίτι και το εξοχικό σας με ευελιξία και προνόμια. Επωφεληθείτε από προσιτά ασφάλιστρα, ευέλικτες καλύψεις."
full_description = "Ασφαλιστικά Προγράμματα Anytime Home Μπορείτε σήμερα να ασφαλίσετε το σπίτι και το εξοχικό σας με ευελιξία και προνόμια. Η Attica Bank σε συνεργασία με την Anytime by Interamerican σας προσφέρει ασφαλιστικά προγράμματα σχεδιασμένα για να καλύπτουν όλες σας τις ανάγκες. Αποκτήστε πρόσβαση σε: 1 Πλήρη προγράμματα ασφάλισης 2 Προσιτά ασφάλιστρα 3 Ευέλικτες καλύψεις 4 Απλούς και ξεκάθαρους όρους Εάν νοικιάζετε ένα σπίτι μπορεί το ίδιο το ακίνητο να μην είναι δικό σας, αλλά τα αντικείμενα αποτελούν την περιουσία σας και μπορούν να ασφαλιστούν με ελάχιστο κόστος. Εάν είστε ιδιοκτήτης, είτε κατοικείτε στο σπίτι σας, είτε το νοικιάζετε σε τρίτους, ο συνδυασμός καλύψεων και τιμής που θα σας προτείνουμε, θα σας καλύψει με μοναδικό τρόπο. Ασφαλίστε σήμερα την κατοικία σας και κερδίστε έως 10% έκπτωση στον ΕΝΦΙΑ (αποδίδεται από το Υπουργείο Οικονομίας και Οικονομικών). Ανακαλύψτε τα ασφαλιστικά προγράμματα Σας προσφέρουμε τρία (3) ευέλικτα προγράμματα ασφάλισης κατοικίας που καλύπτουν την οικία σας και ό,τι βρίσκεται μέσα σε αυτήν. Economic Το βασικό πρόγραμμα κατάλληλο για στεγαστικά δάνεια Value Προστατεύει την κατοικία σας από κλοπή ή κακόβουλες ενέργειες Premium Η απόλυτη κάλυψη για την κατοικία σας, για κάθε κίνδυνο Προαιρετικές καλύψεις 1 ΣεισμόςΠροστασία από ζημιές που προκλήθηκαν από σεισμική δραστηριότητα. 2 Καιρικά ΦαινόμεναΚάλυψη για ζημιές από ακραία καιρικά φαινόμενα. 3 Διαρροή ΣωληνώσεωνΠροστασία από ζημιές λόγω διαρροής σωληνώσεων. Αντικατάσταση Κλειδαριάς Στα προγράμματα Value και Premium προσφέρεται δωρεάν η εξαιρετικά χρήσιμη κάλυψη “Αντικατάσταση Κλειδαριάς”. Γνωρίστε τα μοναδικά πλεονεκτήματα Πλήρη προγράμματα και προσιτά ασφάλιστρα. Σας εξασφαλίζουμε τις καλύψεις που χρειάζεστε στη σωστή τιμή, ανάλογα με τις ανάγκες του σπιτιού σας ή του εξοχικού σας. Απλοί, ξεκάθαροι όροι και σύγχρονες καλύψεις. Ασφαλίζουμε την κατοικία σας με εύκολες και γρήγορες διαδικασίες, κατανοητούς όρους και πολύ χαμηλές ή και μηδενικές απαλλαγές. Σας παρέχουμε περισσότερα για κάθε σημείο της οικίας σας. Οι εξωτερικοί ή βοηθητικοί χώροι (parking, αποθήκες) του σπιτιού σας καλύπτονται με την ασφάλιση των κύριων χώρων και χωρίς καμία επιπλέον επιβάρυνση. Σας εξασφαλίζουμε αποζημίωση σε πραγματική αξία. Με την Anytime αποζημιώνεστε δίκαια και γρήγορα, στην πραγματική αξία αποκατάστασης της ζημιάς που έχετε υποστεί."
