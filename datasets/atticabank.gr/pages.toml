["https://www.atticabank.gr/el/companies/mikres-epicheiriseis-kai-epangelmaties/iris-payments/ypiresia-iris-payments"]
title = "IRIS payments για Επαγγελματίες και Ατομικές Επιχειρήσεις - Attica Bank"
description = "Με την εγγραφή σας στην υπηρεσία IRIS payments μπορείτε να πραγματοποιείτε και να δέχεστε άμεσα και με ασφάλεια πληρωμές χωρίς τη χρήση αριθμού IBAN"
full_description = "Είστε Ελεύθερος Επαγγελματίας ή έχετε Ατομική Επιχείρηση; Με την εγγραφή σας στην υπηρεσία IRIS payments μπορείτε τώρα να πραγματοποιείτε και να δέχεστε άμεσα και με ασφάλεια πληρωμές χωρίς τη χρήση αριθμού IBAN του λογαριασμού σας. Μόνο με τον ΑΦΜ ή τον αριθμό κινητού τηλεφώνου σας ή απλά σκανάροντας το IRIS payments QR Code σας. Προσφορά της υπηρεσίας IRIS payments για τους Ελεύθερους Επαγγελματίες και Ατομικές Επιχειρήσεις Ενεργοποιήστε σήμερα την υπηρεσία IRIS payments μέσω του Attica e-banking και Attica Mobile και δεχθείτε πληρωμές από τους πελάτες σας χωρίς κανένα κόστος! Η προσφορά ισχύει μέχρι την 31η Δεκεμβρίου 2025* * Η Τράπεζα διατηρεί το δικαίωμα να ανακαλέσει την προσφορά, ανά πάσα στιγμή κατά την απόλυτη διακριτική της ευχέρεια και για οποιονδήποτε λόγο ή για λόγους ανωτέρας βίας κατόπιν ενημέρωση των πελατών της. Σε αυτήν την περίπτωση, οι συμμετέχοντες στην προσφορά δε δικαιούνται αποζημίωσης ούτε έχουν κάποια άλλη αξίωση από την Τράπεζα. Πώς θα εγγραφείτε στην υπηρεσία IRIS payments Για να ξεκινήσετε να λαμβάνετε πληρωμές στο λογαριασμό σας στην Attica Bank, αρκεί να είστε εγγεγραμμένος στις ψηφιακές υπηρεσίες Attica e-banking & Attica Mobile και να ακολουθήσετε τα παρακάτω βήματα: Συνδεθείτε με τους προσωπικούς σας κωδικούς στο Attica e-banking ή Attica Mobile, και από το μενού «Εργασίες χρήστη» επιλέξτε «Διαχείριση IRIS payments». (Αν δεν έχετε ενεργοποιημένο το Attica e-banking ή Attica Mobile, ενεργοποιήστε το online εδώ ) Επιλέγετε τον ΑΦΜ σας και εάν το επιθυμείτε, επιλέγετε και εγγραφή με τον αριθμό του κινητού σας τηλεφώνου. Κατόπιν επιλέγετε έναν από τους διαθέσιμους επαγγελματικούς Τραπεζικούς σας λογαριασμούς στον οποίο θα λαμβάνετε τις πληρωμές σας. Σύμφωνα με την ισχύουσα νομοθεσία ο λογαριασμός που θα δηλώσετε για την υπηρεσία IRIS payments πρέπει να έχει δηλωθεί ως επαγγελματικός λογαριασμός. Αν δεν τον έχετε δηλώσει κάντε το με ένα πολύ απλό βήμα στην ηλεκτρονική σελίδα της ΑΑΔΕ. Ολοκληρώστε την διαδικασία εγγραφής με την εισαγωγή των Κωδικών μιας Χρήσης μέσω SMS (OTP). Με την ολοκλήρωση της εγγραφής δημιουργείται αυτόματα στο Attica Mobile ο κωδικός σας QR Code που συνδέεται με τον τραπεζικό σας λογαριασμό. Μπορείτε να επιδεικνύετε αυτό τον κωδικό QR για να λαμβάνετε άμεσα χρήματα (μέσω του Attica Mobile, από το μενού Χρήστης > Προβολή IRIS payments QR Code). Μπορείτε επίσης να αποθηκεύετε τον κωδικό QR στο ψηφιακό σας πορτοφόλι Apple Pay ή Google Pay για ακόμα μεγαλύτερη ευκολία. Πώς λαμβάνετε χρήματα Με την εγγραφή σας στην υπηρεσία, μπορείτε να δέχεστε άμεσα και εύκολα πληρωμές ανεξαρτήτως αριθμού συναλλαγών, έως €500 για κάθε συναλλαγή, ως εξής: επιδεικνύοντας στον πελάτη σας τον προσωπικό σας κωδικό QR Code που δημιουργείται μετά την εγγραφή σας και τον οποίο μπορείτε να βρείτε μέσω του Attica Mobile ή δίνοντας τον ΑΦΜ σας ή τον αριθμό του κινητού σας τηλεφώνου (εάν το επιλέξατε κατά την εγγραφή σας). Τα χρήματα σας είναι άμεσα διαθέσιμα στον λογαριασμό που έχετε συνδέσει για να λαμβάνετε τις πληρωμές σας, τον οποίο μπορείτε να ελέγξετε μέσω του Attica e-banking ή Attica Mobile από το ιστορικό συναλλαγών. Για τη λήψη χρημάτων μέσω IRIS payments, λαμβάνετε ενημερωτικό Viber ή SMS μήνυμα στον αριθμό του κινητού σας τηλεφώνου. Πώς πραγματοποιείτε τις πληρωμές Με την εγγραφή σας στην υπηρεσία μπορείτε: να αποστέλλετε χρήματα άμεσα σε όσους είναι ήδη εγγεγραμμένοι στην υπηρεσία IRIS payments έως €500 ημερησίως, ανεξαρτήτως αριθμού συναλλαγών και μόνο με τη χρήση του αριθμού κινητού τηλεφώνου του παραλήπτη. να πληρώνετε επαγγελματίες καταχωρώντας τον ΑΦΜ τους, τον αριθμό κινητού τους τηλεφώνου ή απλά σκανάροντας το IRIS payments QR Code τους. Για να μπορέσετε να ολοκληρώσετε την πληρωμή, ο δικαιούχος πρέπει να είναι εγγεγραμμένος στην υπηρεσία IRIS payments. Σε περίπτωση που δεν έχει πραγματοποιήσει εγγραφή, εμφανίζεται στην οθόνη σας σχετικό μήνυμα. Με την εκτέλεση της μεταφοράς σας μέσω IRIS payments προς τρίτους, λαμβάνετε αυτόματα ενημερωτικό SMS μήνυμα. Πώς να προσθέσετε τον IRIS payments QR Code στο Ψηφιακό σας Πορτοφόλι Συνδεθείτε με τους προσωπικούς σας κωδικούς στο Attica Mobile, και επιλέξτε «IRIS payments QR Code» από την αρχική οθόνη Εφόσον είστε εγγεγραμμένος στην υπηρεσία θα εμφανιστεί η επιλογή «Προσθήκη στο Πορτοφόλι Google» για Android και «Προσθήκη στο Πορτοφόλι Apple» για iOS. Εάν δεν έχετε ολοκληρώσει την εγγραφή σας, μεταφέρεστε αυτόματα στην οθόνη εγγραφής στην υπηρεσία IRIS payments Πατώντας την Προσθήκη μεταφέρεστε στο Ψηφιακό σας Πορτοφόλι για να ολοκληρώσετε την διαδικασία Ο κωδικός σας προστέθηκε! Πλέον μπορείτε να επιδεικνύετε στους πελάτες σας τον QR Code σας μέσα από το wallet σας, και εκείνοι σκανάροντάς τον μέσω του mobile app της δικής τους τράπεζας εκτελούν την πληρωμή πληκτρολογώντας μόνο το ποσό. Για να δείτε τους Όρους και Προϋποθέσεις εγγραφής και χρήσης της υπηρεσίας IRIS payments, πατήστε εδώ."
