["https://www.atticabank.gr/el/individuals/insurance-products/asfalistika-programmata-gia-idiotes/asfaleia-aftokinitou"]
title = "Ασφάλεια Αυτοκινήτου - Attica Bank"
description = "Προσφέρουμε την Ασφάλεια Αυτοκινήτου που χρειάζεστε, εξασφαλίζοντας προσιτά ασφάλιστρα, ευέλικτες καλύψεις και πρόσβαση σε δωρεάν υπηρεσίες."
full_description = "Στην Attica Bank, γνωρίζουμε πόσο σημαντικές είναι οι μετακινήσεις με το αυτοκίνητό σας. Για αυτό συνεργαζόμαστε με την Anytime by Interamerican, για να σας προσφέρουμε την ασφάλεια που χρειάζεστε, εξασφαλίζοντας προσιτά ασφάλιστρα, ευέλικτες καλύψεις και πρόσβαση σε δωρεάν υπηρεσίες. Επιλέξτε το πρόγραμμα που σας ταιριάζει περισσότερο! H Anytime διαθέτει 3 πλήρη προγράμματα ασφάλισης αυτοκινήτου προσαρμοσμένα στις ανάγκες σας: Basic: Είναι ιδανικό για όσους επιθυμούν τις νομικά απαιτούμενες καλύψεις, συμπεριλαμβανομένης της μεταφοράς του οχήματος μετά από ατύχημα. Value: Πρόκειται για μια ολοκληρωμένη επιλογή που προσφέρει πέραν των βασικών καλύψεων, εκτεταμένη οδική βοήθεια και προστασία από φωτιά, κλοπή, πλημμύρες και άλλα πολλά. Premium: Προσφέρει πλήρη κάλυψη για κάθε ενδεχόμενο, ανεξάρτητα από το ποιος φέρει την ευθύνη, μέσω μιας μικτής ασφαλιστικής συμφωνίας. Απολαύστε μοναδικά πλεονεκτήματα και υπηρεσίες 1 Ανταγωνιστικά ασφάλιστραH Anytime έχει από τα πιο προσιτά ασφάλιστρα της αγοράς και σας εξασφαλίζει τη δυνατότητα να επιλέξετε τη διάρκεια και τον τρόπο πληρωμής που επιθυμείτε. 2 Μικτή ασφάλιση με την πιο εύκολη διαδικασίαΑποκτάτε κάλυψη Ιδίων ζημιών (καλύπτεστε είτε ευθύνεστε είτε όχι) με τον πιο γρήγορο τρόπο κι έχοντας πολύ μικρή απαλλαγή (€350 στα συνεργαζόμενα συνεργεία της Interametican ή €600 σε συνεργείο της επιλογής σας). 3 Αποζημίωση χωρίς ποσό απαλλαγήςΔεν έχετε καμία συμμετοχή σε πιθανή ζημιά (εκτός της κάλυψης των ιδίων ζημιών). 4 24ωρη ανθρώπινη εξυπηρέτησηΣε περίπτωση ατυχήματος καλείτε το 1158 κι ένας εξειδικευμένος συνεργάτης της Anytime θα αναλάβει όλες τις διαδικασίες. Επιπλέον, το όχημά σας μεταφέρεται δωρεάν στο πλησιέστερο συνεργείο. 5 Drive On Mobile app Οδικής ΒοήθειαςΜε ένα κλικ από το κινητό σας ειδοποιείτε μέσω της εφαρμογής Drive On την Οδική Βοήθεια που εντοπίζει την ακριβή τοποθεσία σας, χωρίς να χρειάζεται να τη δηλώσετε. 6 Ολοκληρωμένη εξυπηρέτηση για υλικές ζημιέςΆμεση και υπεύθυνη επισκευή του αυτοκινήτου σας σε ένα ευρύ και αξιόπιστο δίκτυο συνεργείων ή στο CAR POINT, την Πρότυπη Μονάδα Αποζημίωσης & Επισκευής της Interamerican. Επιπλέον Με την ασφάλιση του αυτοκινήτου σας στην Anytime έχετε 5% έκπτωση στην ασφάλιση ενός 2ου οχήματος και 10% έκπτωση στην ασφάλιση της κατοικίας σας. Ακόμα αποκτάτε πρόσβαση σε υπηρεσίες που διευκολύνουν την καθημερινότητά σας, όπως αλλαγή μπαταρίας, έκπτωση στο service ή στην αγορά μεταχειρισμένου αυτοκινήτου."
