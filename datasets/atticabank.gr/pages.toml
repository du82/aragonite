full_description = "Οι Συναλλαγές POS αφορούν πελάτες που έχουν στην κατοχή τους τερματικό/ά POS. Μπορείτε να δείτε και να αποθηκεύσετε το ιστορικό κινήσεων όλων των συναλλαγών που πραγματοποιήθηκαν μέσα από όλα τα τερματικά POS τα οποία είναι συνδεδεμένα στους λογαριασμούς σας. Για να βρείτε το ιστορικό κινήσεων μπορείτε να χρησιμοποιήσετε τα φίλτρα αναζήτησης που περιλαμβάνουν τον κωδικό εμπόρου, το χρονικό διάστημα μέσα στο οποίο έχουν εκκαθαριστεί οι συναλλαγές, τον τύπο συναλλαγής και την κατάσταση της συναλλαγής. Με εφαρμογή τους μπορείτε να πάρετε την λίστα με το ιστορικό των συναλλαγών που έχετε επιλέξει. Υπάρχει η δυνατότητα λήψης των αποτελεσμάτων αναζήτησης ως αρχεία xlsx, pdf και csv. Ο μέγιστος αριθμός εγγραφών που μπορεί να περιέχει το αρχείο είναι 3.000."
