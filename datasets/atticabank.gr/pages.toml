["https://www.atticabank.gr/el/digital-bank/attica-mobile/companies-mobile/odigies-online-engrafis-sto-attica-e-banking-3"]
title = "Οδηγίες εγγραφής - Attica Bank"
description = "Εάν είστε νέος πελάτης και δεν έχετε ήδη συνεργασία με την Attica Bank, επισκεφθείτε ένα κατάστημα μας και θα είναι χαρά μας να συνεργαστούμε σύμφωνα με τις ανάγκες της επιχείρησής σας."
full_description = "Εάν είστε νέος πελάτης και δεν έχετε ήδη συνεργασία με την Attica Bank, επισκεφθείτε ένα κατάστημα μας και θα είναι χαρά μας να συνεργαστούμε σύμφωνα με τις ανάγκες της επιχείρησής σας. Εφόσον είστε ήδη πελάτης της Attica Bank, θα πρέπει ο νόμιμος εκπρόσωπος είτε ο διαχειριστής της εταιρίας σας, να επισκεφθεί το κατάστημα συνεργασίας σας. Κατά την επίσκεψή σας, μας ενημερώνετε για τα παρακάτω τα προσωπικά στοιχεία του κάθε χρήστη (Ονοματεπώνυμο, e-mail, αριθμό κινητού τηλεφώνου) που θέλετε να έχει πρόσβαση στο Attica e-banking και στο Attica Mobile για λογαριασμό της επιχείρησής σας το ρόλο που θα έχει ο κάθε χρήστης (καταχωρεί συναλλαγές, εγκρίνει συναλλαγές, καταχωρεί και εγκρίνει συναλλαγές) εάν υπάρχουν περιορισμοί πρόσβασης σε κάθε χρήστη σχετικά με τα όρια, τα είδη συναλλαγών και τους λογαριασμούς της εταιρίας που θα διαχειρίζεται τα εγκριτικά σχήματα που θέλετε να εφαρμόζονται στις συναλλαγές σας Στη συνέχεια εμείς ανατρέχουμε στα δικαιολογητικά νομιμοποίησης της επιχείρησής σας, που είναι αποθηκευμένα στο σύστημά μας και εντός 2-3 εργάσιμες ημέρες η πρόσβαση όλων των χρηστών ενεργοποιείται. Ολοκλήρωση εγγραφής Με την ολοκλήρωση των εργασιών εγγραφής της επιχείρησής σας από την Τράπεζα, ο κάθε χρήστης που μας δηλώσατε λαμβάνει: Τον Κωδικό Πελάτη (username) μέσω SMS στο κινητό του τηλέφωνο Το Μυστικό Κωδικό (password) στο προσωπικό του e-mail Οι χρήστες μπορούν να συνδεθούν αμέσως στο Attica e-banking και στο Attica Mobile με τους παραπάνω προσωπικούς τους κωδικούς. Σημαντική ενημέρωση Προτού λήξει η νομιμοποίηση της εταιρίας σας στα συστήματα της Τράπεζας, ενημερώνεστε τουλάχιστον 1 μήνα πριν μέσω σχετικού μηνύματος μετά τη σύνδεσή σας στο Attica e-banking και στο Attica Mobile. Εάν δεν προχωρήσετε σε ανανέωσή της μέσα στο χρονικό διάστημα για το οποίο ενημερώνεστε, αυτόματα διακόπτεται η πρόσβαση στις ψηφιακές υπηρεσίες για όλους τους χρήστες της εταιρίας σας έως ότου ολοκληρώσετε τη διαδικασία που απαιτείται."
