description = "Το Διοικητικό Συμβούλιο της Attica Bank, αποτελείται από δεκατρία (13) επίλεκτα μέλη τα οποία συγκαταλέγονται μεταξύ αξιοσημείωτων προσωπικοτήτων της εγχώριας και διεθνούς οικονομικής και κοινωνικής…"
full_description = "Το Διοικητικό Συμβούλιο της Attica Bank, αποτελείται από δεκατρία (13) επίλεκτα μέλη τα οποία συγκαταλέγονται μεταξύ αξιοσημείωτων προσωπικοτήτων της εγχώριας και διεθνούς οικονομικής και κοινωνικής ζωής. Η σύνθεση του Διοικητικού Συμβουλίου έχει ως εξής: Κωνσταντίνος Ηροδότου του Μιχάλη, Πρόεδρος, Ανεξάρτητο Μη Εκτελεστικό Μέλος Κωνσταντίνος Μακέδος του Γεωργίου, Α΄ Αντιπρόεδρος, Μη Εκτελεστικό Μέλος Αβραάμ (Μίνος) Μωυσής του Εσδρά, Β΄ Αντιπρόεδρος, Μη Εκτελεστικό Μέλος, Εκπρόσωπος του Ταμείου Χρηματοπιστωτικής Σταθερότητας το οποίο απορροφήθηκε από την ΕΕΣΥΠ Ελένη Βρεττού του Χρήστου, Διευθύνουσα Σύμβουλος, Εκτελεστικό Μέλος Βασιλική (Βάλερυ) Σκούμπα του Χρήστου, Εκτελεστικό Μέλος Νικόλαος Βουγιούκας του Δημητρίου, Μη Εκτελεστικό Μέλος Δέσποινα Δοξάκη του Ιωάννη, Μη Εκτελεστικό Μέλος Νικόλαος Μπάκος του Δημητρίου, Μη Εκτελεστικό Μέλος Χρήστος Αλεξάκης του Απόλλωνα, Ανεξάρτητο Μη Εκτελεστικό Μέλος Αιμίλιος Γιαννόπουλος του Πολύκαρπου, Ανεξάρτητο Μη Εκτελεστικό Μέλος Ιωάννης Ζωγραφάκης του Γεωργίου, Ανεξάρτητο Μη Εκτελεστικό Μέλος Παναγιώτης Λιαργκόβας του Γεωργίου, Ανεξάρτητο Μη Εκτελεστικό Μέλος Αιμίλιος Στασινάκης του Κωνσταντίνου, Ανεξάρτητο Μη Εκτελεστικό Μέλος"
