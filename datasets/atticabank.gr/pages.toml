["https://www.atticabank.gr/el/companies/anaptyxiaka-programmata/draseis-tepich-iii/tameio-daneion-tepich-iii"]
title = "Ταμείο Δανείων ΤΕΠΙΧ ΙΙΙ - Attica Bank"
description = """
Ο συνολικός προϋπολογισμός ανέρχεται στο ποσό των 200εκατ. ευρώ και οι πόροι προέρχονται από το πρόγραμμα «Ανταγωνιστικότητα» του ΕΣΠΑ 2021 – 2027.
Με τη μόχλευση αναμένεται η χορήγηση δανείων συνολικής αξίας περίπου 450 εκατ. ευρώ."""
full_description = "Η Attica Bank στηρίζει την ελληνική επιχειρηματικότητα. Συμμετέχει στο «Ταμείο Δανείων ΤΕΠΙΧ ΙΙΙ» παρέχοντας δάνεια με ευνοϊκούς όρους για την κάλυψη των χρηματοδοτικών αναγκών των ελληνικών επιχειρήσεων, με σκοπό την ενίσχυση της παραγωγικής τους δραστηριότητας και τη βελτίωση της ανταγωνιστικότητάς τους. Μέσω των σχεδιαζόμενων προϊόντων που θα ενταχθούν στα υποπρογράμματα του Ταμείου θα συμβάλλει εμπράκτως στη στήριξη της ελληνικής ιδιωτικής επιχειρηματικότητας στη χώρα μας, διευκολύνοντας την πρόσβαση των μικρομεσαίων επιχειρήσεων σε δανειακά κεφάλαια τόσο για την υλοποίηση των επενδυτικών τους σχεδίων όσο και για την κάλυψη των αναγκών τους σε ρευστότητα (χορήγηση κεφαλαίου κίνησης) με χαμηλότερο χρηματοοικονομικό κόστος. Η χρηματοδότηση παρέχεται μέσω του «Ταμείου Δανείων ΤΕΠΙΧ ΙΙΙ», το οποίο διαχειρίζεται η Ελληνική Αναπτυξιακή Τράπεζα (ΕΑΤ) και συγχρηματοδοτείται από την Ευρωπαϊκή Ένωση, μέσω του Προγράμματος «Ανταγωνιστικότητα» 2021-2027. Τι είναι το Ταμείο Δανείων ΤΕΠΙΧ III Η δράση αφορά στη χορήγηση νέων δανείων με ευνοϊκούς όρους προς ΜμΕ επιχειρήσεις (υφιστάμενες και νεοσυσταθείσες) για την κάλυψη των χρηματοδοτικών τους αναγκών (δάνεια επενδυτικού σκοπού και κεφάλαια κίνησης για την επέκταση και ανάπτυξη της δραστηριότητας της επιχείρησης), με συνεπένδυση κεφαλαίων της Τράπεζας και του Ταμείου Συγχρηματοδότησης το οποίο διαχειρίζεται η ΕΑΤ Α.Ε., σε αναλογία 1,5:1 (ή 60% : 40% αντίστοιχα). Τα δάνεια χορηγούνται ως δάνεια τακτής λήξης με προνομιακό επιτόκιο, καθώς εφαρμόζεται μηδενικό επιτόκιο για το 40% του δανείου που προέρχεται από τα κεφάλαια του Ταμείου, ενώ για το επιτόκιο που επιβάλλει η Τράπεζα στα κεφάλαια που εισφέρει σε έκαστο δάνειο (ήτοι το 60%) προβλέπεται: μείωση επιτοκίου τουλάχιστον κατά 25 μονάδες βάσης, σε σχέση με αντίστοιχη χρηματοδότηση χωρίς ενίσχυση από δημόσιους πόρους διετή επιδότηση επιτοκίου ύψους 3% ετησίως (υπό προϋποθέσεις). Ενημερωτική Μπροσούρα Κατεβάστε το αρχείο (701kb) Βασικά χαρακτηριστικά δανείων “Ταμείο Δανείων ΤΕΠΙΧ ΙΙΙ” Κατεβάστε το αρχείο (265kb) Η Δράση Αναλυτικά Προϋπολογισμός Δράσης Ο συνολικός προϋπολογισμός ανέρχεται στο ποσό των 200εκατ. ευρώ και οι πόροι προέρχονται από το πρόγραμμα «Ανταγωνιστικότητα» του ΕΣΠΑ 2021 – 2027. Με τη μόχλευση αναμένεται η χορήγηση δανείων συνολικής αξίας περίπου 450 εκατ. ευρώ. Δικαιούχοι της Δράσης / Επιλέξιμες Επιχειρήσεις Είναι επιχειρήσεις για τις οποίες συντρέχουν αθροιστικά οι κάτωθι προϋποθέσεις (Κριτήρια Επιλεξιμότητας) κατά την ημερομηνία έγκρισης-υπαγωγής στο χαρτοφυλάκιο Δανείων και της υπογραφής της δανειακής Σύμβασης: Είναι Πολύ Μικρές, Μικρές και Μεσαίες επιχειρήσεις σύμφωνα με τον ορισμό ΜμΕ που αναγράφεται στο Παράρτημα Ι του ΕΚ 651/2014, όπως εκάστοτε ισχύει. Λειτουργούν νόμιμα στην Ελλάδα (συμπεριλαμβανομένων απαιτούμενων αδειών λειτουργίας-εφόσον απαιτούνται). Δραστηριοποιούνται σε οποιοδήποτε επιλέξιμο ΚΑΔ ανάλογα με το Υποπρόγραμμα σύμφωνα με το αρχείο των επιλέξιμων ΚΑΔ (δείτε εδώ). Τηρούν τα κριτήρια επιλεξιμότητας και τα όρια σώρευσης ενισχύσεων ανάλογα με τον κανονισμό Κρατικών Ενισχύσεων που εφαρμόζεται. Πληρούν τις προϋποθέσεις του αρ. 1 (Κεφάλαιο Ι) του ΓΑΚ και των αντίστοιχων προϋποθέσεων που ισχύουν ανάλογα με το Υποπρόγραμμα Κρίνονται πιστοληπτικά αποδεκτές σύμφωνα με την ισχύουσα πιστωτική πολιτική και τις εσωτερικές διαδικασίες του Πιστωτικού Ιδρύματος. Δεν έχουν λάβει ενίσχυση διάσωσης ή αναδιάρθρωσης, ή η επιχείρηση έχει λάβει ενίσχυση διάσωσης, αλλά έχει αποπληρώσει το δάνειο και έχει λύσει τη σύμβαση εγγύησης ή η επιχείρηση έχει λάβει ενίσχυση αναδιάρθρωσης, η οποία έχει ολοκληρωθεί. Δεν έχουν υπαχθεί σε συλλογική πτωχευτική διαδικασία και δεν πληρούν τις προϋποθέσεις του Ν.4738/2020, όπως εκάστοτε ισχύει Δεν θεωρούνται προβληματικές (υπό την έννοια του άρθρου 1 παρ. 4 και του σημείου 18 του άρθρου 2 του Καν. 651/2014,όπως εκάστοτε ισχύει), κατά τη στιγμή υπογραφής των δανειακών συμβάσεων (σε επίπεδο ενιαίας/δεδομένης επιχείρησης). Είναι τραπεζικά ενήμερες (έχουν καθυστερημένη οφειλή ≤ 90 ημερών) κατά την ημερομηνία υποβολής της αίτησης και συνακόλουθα κατά την ημερομηνία υπογραφής της δανειακής σύμβασης. Είναι επιχειρήσεις για τις οποίες δεν συντρέχουν λόγοι αποκλεισμού του άρθρου 40 του νόμου 4488/17 (Α 137/139/17), όπως ισχύει. Είναι φορολογικά και ασφαλιστικά ενήμερες, τόσο κατά το χρόνο υποβολής αίτησης εκδήλωσης ενδιαφέροντος μέσω της KYC της ΕΑΤ, όσο και κατά το χρόνο εκταμίευσης των δανείων. Επιπλέον, δεν παρουσιάζουν στοιχεία αφερεγγυότητας, σύμφωνα με τα τηρούμενα στοιχεία της ΤΕΙΡΕΣΙΑΣ ΑΕ, τόσο κατά τον χρόνο υποβολής αίτησης εκδήλωσης ενδιαφέροντος μέσω της ΚYC της ΕΑΤ, όσο και κατά τον χρόνο εκταμίευσης των δανείων. Είναι επιχειρήσεις για τις οποίες δεν εκκρεμεί εντολή ανάκτησης προηγούμενης παράνομης και ασύμβατης κρατικής ενίσχυσης βάση απόφασης ΕΕ ή ΔΕΕ. Εάν έχουν ενταχθεί σε προγράμματα της ΕΑΤ (πρώην ΕΤΕΑΝ/ΤΕΜΠΜΕ) που έληξαν ή βρίσκονται σε ισχύ, δεν έχουν εμφανίσει δυσμενή συναλλακτική συμπεριφορά στην αποπληρωμή των οφειλών τους (καταγγελία δανείου ή ληξιπρόθεσμες οφειλές για διάστημα μεγαλύτερο των 90 ημερών) ή έχουν εμφανίσει δυσμενή συναλλακτική συμπεριφορά (καταγγελία δανείου) αλλά έχουν εξοφλήσει πλήρως τις οφειλές τους πριν την υποβολή της αίτησης χρηματοδότησης ή εφόσον πρόκειται για πρόγραμμα εγγυοδοσίας, δεν έχει καταβληθεί το ποσό οφειλής εγγύησης από πλευράς της ΕΑΤ, ή εφόσον έχει βεβαιωθεί η εν λόγω οφειλή στην αρμόδια Δ.Ο.Υ., αυτή έχει ενταχθεί σε καθεστώς ρύθμισης, η οποία συνεχίζει να είναι σε ισχύ κατά την ημερομηνία υποβολής της αίτησης χρηματοδότησης. Έχουν εγγραφεί στο μητρώο Πραγματικών Δικαιούχων του άρθρου 20 του ν. 4557/2018 (Α΄139), ως ισχύει, πριν την ημερομηνία υποβολής της αίτησης χρηματοδότησης. Σε περίπτωση μη υποχρέωσης εγγραφής στο μητρώο Πραγματικών Δικαιούχων του άρθρου 20 του ν. 4557/2018 (Α΄139), ως ισχύει, θα προσκομίζεται σχετική τεκμηρίωση από την επιχείρηση. Έχουν ολοκληρώσει τη διαδικασία αυτοαξιολόγησης για τα Κριτήρια ESG στο ESG Tracker της ΕΑΤ (https://esgtracker.hdb.gr/en/home/#), και έχουν υποβάλλει στο Πιστωτικό ίδρυμα κατά την υποβολή της αίτησης χρηματοδότησης το ESG Tracker Performance Report (σε pdf) , όπου αποτυπώνεται η απόδοση της επιχείρησης στα κριτήρια αυτά. . Εναλλακτικά, κατά την υποβολή της αίτησης χρηματοδότησης στην Τράπεζα δύνανται να υποβληθεί επιβεβαίωση για την ολοκληρωμένη υποβολή του ερωτηματολογίου αυτοαξιολόγησης στο ESG Tracker (Submission Confirmation σε μορφή pdf ή mail) με την ρητή υποχρέωση υποβολής του ESG Tracker Performance Report έως την υπογραφή της σύμβασης Δανείου. Σημειώνεται ότι τα αποτελέσματα της αυτοαξιολόγησης μέσω του ESG Tracker δεν αποτελούν κριτήρια επιλεξιμότητας του τελικού αποδέκτη, και δεν επηρεάσουν την πιστοληπτική ικανότητα της Τράπεζας. Η διαδικασία υποβολής και έκδοσης των αποτελεσμάτων παρέχεται δωρεάν από την HDB. Για τη Δράση 1.2 (επενδυτικά δάνεια μέσω ΓΑΚ) θα πρέπει ΕΠΙΣΗΣ οι ΜμΕ επιχειρήσεις: 1) να πληρούν τη στιγμή της υπαγωγής στο χαρτοφυλάκιο, μία από τις ακόλουθες επίσης προϋποθέσεις (σε επίπεδο ενιαίας/δεδομένης επιχείρησης): (α) να μην ασκούν δραστηριότητες σε καμία αγορά ή (β) να δραστηριοποιούνται σε οποιαδήποτε αγορά για οποιοδήποτε από τα ακόλουθα: i) λιγότερο από 10 έτη μετά την καταχώρησή τους, ή ii) λιγότερο από 7 έτη μετά την πρώτη εμπορική τους πώληση. ή (γ) χρειάζονται αρχική επένδυση, η οποία, βάσει επιχειρηματικού σχεδίου που καταρτίζεται ενόψει μιας νέας οικονομικής δραστηριότητας, είναι υψηλότερη του 50% του μέσου ετήσιου κύκλου εργασιών τους κατά τα προηγούμενα πέντε έτη. Το όριο αυτό περιορίζεται στο 30% όσον αφορά τις ακόλουθες επενδύσεις, οι οποίες θεωρούνται αρχικές επενδύσεις σε νέα οικονομική δραστηριότητα:– επενδύσεις που βελτιώνουν σημαντικά τις περιβαλλοντικές επιπτώσεις της δραστηριότητας, σύμφωνα με το άρθρο 36 παρ. 2,– άλλες περιβαλλοντικά βιώσιμες επενδύσεις όπως ορίζονται στο άρθρο 2 σημείο 1) του Καν. (ΕΕ) 2020/852 και– επενδύσεις που αποσκοπούν στην αύξηση της ικανότητας εξόρυξης, διαχωρισμού, διύλισης, επεξεργασίας ή ανακύκλωσης κρίσιμης πρώτης ύλης που παρατίθεται στο Παράρτημα IV του Καν. 651/2014. Εξαιρέσεις Δραστηριοτήτων και Δαπανών Δεν είναι επιλέξιμες επιχειρηματικές δραστηριότητες που εξαιρεί ο Καν. (ΕΕ) αριθ. 2831/2023 (De Minimis) ή ο Καν. (ΕΕ) 651/2014 (ανάλογα με τη Δράση), καθώς και οι δραστηριότητες που δεν χρηματοδοτούνται από το Πρόγραμμα «Ανταγωνιστικότητα». Για τις Δράσεις μέσω De Minimis (Δράσεις 1.1 και 2.1): Δεν είναι Επιλέξιμες οι: I. Ενισχύσεις προς επιχειρήσεις που δραστηριοποιούνται στον τομέα της μεταποίησης και της εμπορίας γεωργικών προϊόντων, σε μία από τις ακόλουθες περιπτώσεις: • όταν το ποσό της ενίσχυσης καθορίζεται με βάση την τιμή ή την ποσότητα των εν λόγω προϊόντων που αγοράζονται από πρωτογενείς παραγωγούς ή διατίθενται στην αγορά από τις οικείες επιχειρήσεις· • όταν η ενίσχυση συνοδεύεται από την υποχρέωση απόδοσής της εν μέρει ή εξολοκλήρου σε πρωτογενείς παραγωγούς.II. Ενισχύσεις που χορηγούνται για δραστηριότητες που σχετίζονται με εξαγωγές προς τρίτες χώρες ή προς κράτη μέλη, ιδίως δε τις ενισχύσεις που συνδέονται άμεσα με τις εξαγόμενες ποσότητες, με τη δημιουργία και τη λειτουργία δικτύου διανομής ή με άλλες τρέχουσες δαπάνες που σχετίζονται με την εξαγωγική δραστηριότητα.III. Ενισχύσεις για τις οποίες τίθεται ως όρος η χρήση εγχώριων αγαθών και υπηρεσιών αντί εισαγόμενων. Για τη Δράση μέσω ΓΑΚ (Δράσεις 1.2):Δεν είναι Επιλέξιμες:I. Ενισχύσεις προς επιχειρήσεις που δραστηριοποιούνται στον τομέα της μεταποίησης και της εμπορίας γεωργικών προϊόντων, σε μία από τις ακόλουθες περιπτώσεις: • όταν το ποσό της ενίσχυσης καθορίζεται με βάση την τιμή ή την ποσότητα των εν λόγω προϊόντων που αγοράζονται από πρωτογενείς παραγωγούς ή διατίθενται στην αγορά από τις οικείες επιχειρήσεις· • όταν η ενίσχυση συνοδεύεται από την υποχρέωση απόδοσής της εν μέρει ή εξολοκλήρου σε πρωτογενείς παραγωγούς.II. Ενισχύσεις που χορηγούνται για δραστηριότητες που σχετίζονται με εξαγωγές προς τρίτες χώρες ή προς κράτη μέλη, ιδίως δε τις ενισχύσεις που συνδέονται άμεσα με τις εξαγόμενες ποσότητες, με τη δημιουργία και τη λειτουργία δικτύου διανομής ή με άλλες τρέχουσες δαπάνες που σχετίζονται με την εξαγωγική δραστηριότητα.III. Ενισχύσεις που διευκολύνουν την παύση λειτουργίας μη ανταγωνιστικών ανθρακωρυχείων, που εμπίπτουν στην απόφαση 2010/787/ΕΕ του Συμβουλίου. Για όλες τις Δράσεις:Εξαιρούνται επίσης οι επιχειρήσεις που δραστηριοποιούνται:I. Στην πρωτογενή παραγωγή προϊόντων αλιείας και υδατοκαλλιέργειας.II. Στη μεταποίηση και την εμπορία προϊόντων αλιείας και υδατοκαλλιέργειας.III. Στην πρωτογενή παραγωγή γεωργικών προϊόντων.IV. Στους κάτωθι τομείς που εξαιρούνται από το Πρόγραμμα «Ανταγωνιστικότητα»:• Εξόρυξη λιγνίτη, λιθάνθρακα, την άντληση πετρελαίου, άντληση και παραγωγή φυσικού αερίου, παραγωγή υδρογονανθράκων και παραγώγων τους και οποιαδήποτε άλλη δραστηριότητα που αφορά τα εν λόγω προϊόντα (μεταφορά, διακίνηση, πώληση κοκ), συμπεριλαμβανομένου της προμήθειας οχημάτων συμβατικών καυσίμων.• Ναυπήγηση πολεμικών πλοίων και δεξαμενόπλοιων για τη μεταφορά αργού πετρελαίου, προϊόντων πετρελαίου, χημικών προϊόντων, υγροποιημένου αερίου.• Παραγωγή ηλεκτρικής ενέργειας από αεροστροβιλικές μονάδες πετρελαίου, λιγνιτικές μονάδες, φυσικού αερίου, σταθμούς συμπαραγωγής ηλεκτρισμού και θερμότητας, σταθμούς εσωτερικής καύσης.• Επεξεργασία λυμάτων.• Αεροπορικές μεταφορές. Β) ΑΠΑΓΟΡΕΥΜΕΝΟΙ ΤΟΜΕΙΣ Για όλες τις Δράσεις εξαιρούνται οι επιχειρήσεις που δραστηριοποιούνται στους κάτωθι Απαγορευμένους Τομείς: • Στην παραγωγή και εμπορία όπλων και πυρομαχικών.• Στην παρασκευή, επεξεργασία και εμπορία καπνού και προϊόντων καπνού.• Καζίνο και τυχερά παιχνίδια/στοιχηματισμός.• Σε δραστηριότητες Τεχνολογίας Υγείας που συνδέονται με ανθρώπινη κλωνοποίηση για ερευνητικούς ή θεραπευτικούς σκοπούς και Γενετικά Μεταλλαγμένους Οργανισμούς /Τρόφιμα.• Σε δραστηριότητες Πληροφορικής που συνδέονται με διαδικτυακά εγχρήματα τυχερά παιχνίδια, καζίνο και παράνομες δραστηριότητες (πορνογραφία, παράνομη διείσδυση σε ηλεκτρονικά δίκτυα, παράνομη υπεξαίρεση ηλεκτρονικών δεδομένων).• Σε δραστηριότητες στον τομέα του παροπλισμού ή κατασκευής πυρηνικών σταθμών ηλεκτροπαραγωγής.• Σε παράνομες δραστηριότητες σύμφωνα με το εθνικό δίκαιο. Όταν μια επιχείρηση δραστηριοποιείται τόσο στους τομείς που εξαιρούνται όσο και στους τομείς που εμπίπτουν στο πεδίο εφαρμογής του προγράμματος και των σχετικών κανονισμών, τότε τα κριτήρια επιλεξιμότητας και οι σχετικοί κανονισμοί εφαρμόζονται στις ενισχύσεις που χορηγούνται στους τομείς ή δραστηριότητες της δεύτερης αυτής περίπτωσης, υπό την προϋπόθεση ότι εξασφαλίζεται, με τα κατάλληλα μέσα, ο διαχωρισμός των δραστηριοτήτων ή η διάκριση των δαπανών, και ότι οι δραστηριότητες που ασκούνται στους εξαιρούμενους τομείς δεν επωφελούνται από τις ενισχύσεις που χορηγούνται σύμφωνα με τις διατάξεις του προγράμματος και των σχετικών κανονισμών στους επιλέξιμους τομείς. Επίσης αποκλείονται: Τα Νομικά Πρόσωπα Δημοσίου Δικαίου, οι Οργανισμοί Τοπικής Αυτοδιοίκησης 1ου και 2ου βαθμού, οι Δημοτικές και Δημόσιες Επιχειρήσεις, οι Δημόσιοι Οργανισμοί. Τα Νομικά Πρόσωπα ή Ενώσεις Προσώπων ή Εταιρείες μη κερδοσκοπικού χαρακτήρα (σωματεία, σύλλογοι, όμιλοι, ΜΚΟ κλπ.). Οι επιχειρήσεις που είναι εισηγμένες στο χρηματιστήριο. Οι εξωχώριες επιχειρήσεις ή εταιρείες συμμετοχών σε άλλες εταιρείες ή τα υποκαταστήματα αυτών στην Ελλάδα. Οι επιχειρήσεις του χρηματοπιστωτικού τομέα. Οι επιχειρήσεις που έχουν υπαχθεί σε συλλογική διαδικασία αφερεγγυότητας / ή και Καθεστώς Αφερεγγυότητας, ή πληρούν τις προϋποθέσεις με βάση την εγχώρια νομοθεσία στην οποία υπόκειται για να υπαχθούν σε συλλογική διαδικασία αφερεγγυότητας κατόπιν αιτήσεως των δανειστών τους. Οι επιχειρήσεις που θεωρούνται προβληματικές, υπό την έννοια του σημείου 18 του άρθρου 2 του Καν. 651/2014, όπως εκάστοτε ισχύει. Κριτήρια Επιλεξιμότητας Δανείων Τα Δάνεια που θα ενταχθούν στο χαρτοφυλάκιο του Ταμείου Δανείων ΤΕΠΙΧ ΙΙΙ θα πρέπει καθ΄ όλη της διάρκεια ισχύος της δανειακής Σύμβασης να πληρούν σωρευτικά τα κάτωθι κριτήρια: 1.Θα συναφθούν και θα εκταμιευθούν εντός τους Περιόδου Διάθεσης (μετά την έναρξη του προγράμματος, εντός των προβλεπόμενων χρονικών προθεσμιών και το αργότερο έως 31.12.2029). 2. Χορηγούνται για την υλοποίηση των επενδυτικών σχεδίων των επιχειρήσεων ή/και την παροχή κεφαλαίου κίνησης για τις ανάγκες του συναλλακτικού κύκλου των επιχειρήσεων στα βάση υποβληθέντος επιχειρηματικού σχεδίου, και για τα στοιχεία αυτά του επενδυτικού/επιχειρηματικού σχεδίου που δεν έχουν υλοποιηθεί πλήρως (ήτοι ολοκληρωθεί ως προς το φυσικό αντικείμενό τους και εξοφληθεί) κατά την ημερομηνία ειδοποίησης υπαγωγής. 3. Οι όροι χορήγησής τους είναι συμβατοί με τους όρους χρηματοδότησης όπως αυτοί καθορίζονται από την Πρόσκληση Εκδήλωσης Ενδιαφέροντος (ενδεικτικά ποσό και διάρκεια δανείου, μείωση του επιτοκίου δανεισμού, μέγιστο ύψος εμπράγματων εξασφαλίσεων, μέγιστο περιθώριο επιτοκίου όπως δηλώθηκε από την Τράπεζα). 4. Αφορούν νέες χρηματοδοτήσεις επιχειρήσεων, εκφρασμένες σε ευρώ 5. Δεν αξιοποιούνται (α) για την αναχρηματοδότηση/αποπληρωμή υφιστάμενων δανείων και πιστωτικών γραμμών, (β) τη χ"
