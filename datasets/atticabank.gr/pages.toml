title = "Αστική Ευθύνη Επιχειρήσεων - Attica Bank"
description = "Γνωρίζουμε πόσο σημαντικό είναι να δημιουργείτε ένα ασφαλές περιβάλλον μέσα στο οποίο θα μπορείτε να εξασκείτε το επάγγελμά σας και να εξυπηρετείτε τους πελάτες σας, προάγοντας καθημερινά τη φήμη της…"
full_description = "Γνωρίζουμε πόσο σημαντικό είναι να δημιουργείτε ένα ασφαλές περιβάλλον μέσα στο οποίο θα μπορείτε να εξασκείτε το επάγγελμά σας και να εξυπηρετείτε τους πελάτες σας, προάγοντας καθημερινά τη φήμη της επιχείρησής σας. Για να εξασφαλίσετε την ομαλή λειτουργία της από κάθε απρόσμενο περιστατικό που μπορεί να προκύψει, είτε από εργαζόμενό σας είτε από κάποιον πελάτη, έχουμε διαμορφώσει ολοκληρωμένα προγράμματα ασφάλισης Αστικής ευθύνης σε συνεργασία με την Interamerican. Καλύψεις προγράμματος 1 Η ασφάλιση Αστικής ευθύνης προστατεύει την επιχείρησή σας με πληρότητα.Σας εξασφαλίζει την αστική σας ευθύνη απέναντι σε τρίτους αν άθελά σας εσείς ή το προσωπικό σας προκαλέσει υλικές ζημιές ή σωματικές βλάβες σε τρίτους. 2 Σας παρέχει επιπλέον καλύψεις όπως: πυρκαγιά, έκρηξη, βραχυκύκλωμα, διαρροή σωληνώσεων, ζημιές τρίτων από περιβαλλοντική ζημιά, κ.α. 3 Επιλογή προαιρετικής κάλυψης Αστικής ευθύνης εργοδότη Ευέλικτες επιλογές και προσιτά ασφάλιστρα Η Ασφάλιση Αστικής ευθύνης επιχειρήσεων σας εξασφαλίζει μεγάλο εύρος επιλογών στα ασφαλιζόμενα όρια, από €100.000 μέχρι €1.000.000, ανάλογα με το βαθμό προστασίας που επιθυμείτε. Παράλληλα έχει ιδιαίτερα προσιτά ασφάλιστρα, που μπορούν να γίνουν ακόμη πιο οικονομικά, εάν διατηρείτε στην Interamerican ασφάλιση Περιουσίας για την επιχείρηση σας. Ποια είναι τα πλεονεκτήματα των προγραμμάτων Ολοκληρωμένη κάλυψη από τη λειτουργία των εγκαταστάσεων της επιχείρησης και του προσωπικού. Δυνατότητα επιλογής του ορίου ασφάλισης ανάλογα με τις ανάγκες σας. Δυνατότητα επιλογής της κάλυψης Ευθύνης εργοδότη. Ασφάλιστρα που προσαρμόζονται στο μέγεθος της κάθε επιχείρησης. Ενημερωθείτε Επισκεφθείτε ένα κατάστημά μας. Φροντίστε να έχετε μαζί σας όλα τα απαραίτητα έγγραφα."
