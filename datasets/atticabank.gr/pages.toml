title = "Πληρωμές - Attica Bank"
description = "Μπορείτε να κάνετε τις πληρωμές σας σε Οργανισμούς και Εταιρείες Κοινής Ωφέλειας. Πληκτρολογώντας μέρος από την επωνυμία του Οργανισμού/Εταιρείας ή αριθμούς από τον κωδικό τους…"
full_description = "Μπορείτε να κάνετε τις πληρωμές σας σε Οργανισμούς και Εταιρείες Κοινής Ωφέλειας. Πληκτρολογώντας μέρος από την επωνυμία του Οργανισμού/Εταιρείας ή αριθμούς από τον κωδικό τους, μπορείτε εύκολα να πραγματοποιήσετε τις πληρωμές σας. Δείτε πως πραγματοποιείτε τις πληρωμές σας Οργανισμοί/Εταιρείες με μόνο ένα πεδίο Κωδικού Πληρωμής Στην περίπτωση αυτή, χρειάζεται να επιλέξετε τον λογαριασμό χρέωσης, να πληκτρολογήστε στο επόμενο πεδίο μέρος από την επωνυμία του Οργανισμού/Εταιρείας ή αριθμούς από τον κωδικό του, ώστε να μειωθεί η λίστα που ακολουθεί και να επιλέξετε τον Οργανισμό/Εταιρεία για τον οποίο επιθυμείτε να κάνετε την πληρωμή. Συμπληρώστε το ποσό και επιλέξτε αν η συναλλαγή θα είναι μεμονωμένη ή επαναλαμβανόμενη. Στη συνέχεια, χρειάζεται να συμπληρώσετε το ονοματεπώνυμο υπόχρεου και τον κωδικό πληρωμής. Θα οδηγηθείτε στην επόμενη οθόνη όπου και θα σας ζητηθεί Κωδικός Μιας Χρήσης μέσω SMS προκειμένου να επιβεβαιώσετε την ενέργειά σας. Εισάγετε τον κωδικό μιας χρήσης στο εμφανιζόμενο πεδίο και εφόσον συμφωνείτε με τα δεδομένα που εμφανίζονται στη σελίδα, επιλέξτε «Επιβεβαίωση». Εφόσον επιβεβαιώσετε την συναλλαγή και αυτή ολοκληρωθεί με επιτυχία, εμφανίζεται η οθόνη ολοκλήρωσης της συναλλαγής που εμπεριέχει την «Απόδειξη συναλλαγής». Επιλέγοντάς το έχετε δυο επιμέρους επιλογές: να κατεβάσετε και να αποθηκεύσετε την απόδειξη στον υπολογιστή σας ή να αποστείλετε την απόδειξη με ηλεκτρονικό ταχυδρομείο. Σε περίπτωση αποτυχίας της συναλλαγής, σας εμφανίζεται μήνυμα λάθους που σας ενημερώνει για την αιτία αποτυχίας. Μπορείτε, αν θέλετε, να αποθηκεύσετε τη συναλλαγή σαν πρότυπη συναλλαγή. Πληρωμή με κωδικό RF Η Πληρωμή με Κωδικό RF είναι μια μέθοδος Πληρωμής όπου δεν χρειάζεται να γίνει αναζήτηση του Οργανισμού/Εταιρείας που θέλετε να πληρώσετε. Το μόνο που χρειάζεται για αυτή την συναλλαγή είναι ο 25ψήφιος Κωδικός Πληρωμής που ξεκινά πάντα με τα χαρακτηριστικά γράμματα RF και περιέχει όλες τις πληροφορίες που αφορούν τον Οργανισμό ή την Εταιρεία. Χρειάζεται να καταχωρίσετε το ποσό, το ονοματεπώνυμο υπόχρεου και τον κωδικό πληρωμής, και να επιλέξετε αν η πληρωμή θα είναι επαναλαμβανόμενη ή μεταχρονολογημένη. Επιλέξτε «Υποβολή» και θα μεταφερθείτε στην σελίδα «Επιβεβαίωσης» όπου και θα σας ζητηθεί Κωδικός Μιας Χρήσης είτε μέσω συσκευής κωδικών μιας χρήσης είτε μέσω αποστολής του κωδικού μιας χρήσης με SMS στο κινητό σας τηλέφωνο. Στη συνέχεια, επιλέξτε «Επιβεβαίωση».Εφόσον επιβεβαιώσετε τη συναλλαγή και αν αυτή ολοκληρωθεί με επιτυχία, εμφανίζεται η οθόνη ολοκλήρωσης της συναλλαγής που εμπεριέχει την «Απόδειξη συναλλαγής». Επιλέγοντάς το έχετε δυο επιμέρους επιλογές: να κατεβάσετε και να αποθηκεύσετε την απόδειξη στον υπολογιστή σας είτε να την αποστείλετε με ηλεκτρονικό ταχυδρομείο. Σε περίπτωση αποτυχίας της συναλλαγής, εμφανίζεται μήνυμα σφάλματος που σας ενημερώνει για την αιτία. Μπορείτε, αν θέλετε, να αποθηκεύσετε τη συναλλαγή σαν πρότυπη συναλλαγή."
