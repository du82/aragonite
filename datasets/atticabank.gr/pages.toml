title = "Κάρτες - Attica Bank"
description = "Μέσω των ψηφιακών καναλιών Attica e-banking & Attica mobile έχετε τη δυνατότητα να προχωρήσετε σε προσωρινή διακοπή χρήσης της κάρτας σας, σε επαναφορά χρήσης της και σε υπενθύμιση του PIN της."
full_description = "Μέσω των ψηφιακών καναλιών Attica e-banking & Attica mobile έχετε τη δυνατότητα να προχωρήσετε σε προσωρινή διακοπή χρήσης της κάρτας σας, σε επαναφορά χρήσης της και σε υπενθύμιση του PIN της. Δείτε πως μπορείτε να διαχειριστείτε τις κάρτες σας Πιστωτικές κάρτες Προσωρινή Διακοπή Χρήσης Προκειμένου η κάρτα σας να απενεργοποιηθεί προσωρινά και να απορρίπτονται όλα τα αιτήματα εγκρίσεων συναλλαγών, ακολουθείτε τα παρακάτω βήματα:Επιλέγετε από το Χαρτοφυλάκιό σας την κάρτα σας που θέλετε να απενεργοποιήσετε προσωρινά και μεταβαίνετε στην οθόνη που εμφανίζονται οι λεπτομέρειες της κάρτας. Από τις «Ενέργειες Κάρτας» επιλέγετε «Προσωρινή Διακοπή Χρήσης Κάρτας». Πατώντας «Υποβολή» θα σας ζητηθεί Κωδικός μιας Χρήσης μέσω SMS προκειμένου να επιβεβαιώσετε την ενέργειά σας. Εισάγετε τον Kωδικό μιας Xρήσης στο αντίστοιχο πεδίο και εφόσον συμφωνείτε με τα δεδομένα που εμφανίζονται στη σελίδα, επιλέγετε «Επιβεβαίωση». Με την επιτυχή εκτέλεση της συναλλαγής, η κάρτα εμφανίζεται στο Χαρτοφυλάκιό σας με το χαρακτηρισμό «Προσωρινά Απενεργοποιημένη».ΠΡΟΣΟΧΗ: Η διαδικασία αυτή δεν αντικαθιστά τις ενέργειες που πρέπει να κάνετε σε περίπτωση απώλειας ή κλοπής κάρτας, όπου σε αυτήν την περίπτωση επικοινωνείτε με την υπηρεσία μας τηλεφωνικής εξυπηρέτησης στο 210 3669000, 24Χ7, και δηλώνετε το συμβάν. Επαναφορά Χρήσης Κάρτας Εάν το επιθυμείτε, μπορείτε να προχωρήσετε εκ νέου σε «Επαναφορά Χρήσης Κάρτας» και να χρησιμοποιείτε κανονικά την κάρτα σας για τις συναλλαγές σας, ακολουθώντας τα παρακάτω βήματα:Επιλέγετε από το “Χαρτοφυλάκιό σας” την κάρτα που έχει χαρακτηριστεί «Προσωρινά Απενεργοποιημένη» και μεταβαίνετε στην οθόνη που εμφανίζονται οι λεπτομέρειες της κάρτας. Από τις «Ενέργειες Κάρτας» επιλέγετε «Επαναφορά Χρήσης Κάρτας». Πατώντας «Υποβολή» θα σας ζητηθεί Κωδικός Μιας Χρήσης μέσω SMS προκειμένου να επιβεβαιώσετε την ενέργειά σας. Εφόσον συμφωνείτε με τα δεδομένα που εμφανίζονται στη σελίδα, επιλέγετε «Επιβεβαίωση». Με την επιτυχή εκτέλεση της συναλλαγής, η κάρτα εμφανίζεται στο χαρτοφυλάκιό σας «Ενεργή» και μπορείτε να την χρησιμοποιήσετε για τις συναλλαγές σας. Υπενθύμιση PIN κάρτας Έχετε τη δυνατότητα να προχωρήσετε σε «Υπενθύμιση PIN κάρτας » σε περίπτωση που δεν θυμάστε το PIN της κάρτας σας ως εξής:Επιλέγετε από το Χαρτοφυλάκιό σας την κάρτα σας και μεταβαίνετε στην οθόνη που εμφανίζονται οι Λεπτομέρειες κάρτας. Από τις «Ενέργειες Κάρτας» επιλέγετε «Υπενθύμιση PIN Κάρτας».Από την dropdown list “Τρόπος Αποστολής PIN”, θα επιλέξετε τον τρόπο που επιθυμείτε: Παραλαβή από Κατάστημα ή Ταχυδρομικά στην Διεύθυνσή σας.• Στην περίπτωση παραλαβής PIN από Κατάστημα, θα πρέπει να επιλέξετε επίσης σε ποιο κατάστημά μας επιθυμείτε να γίνει η παραλαβή του.• Στην περίπτωση παραλαβής PIN Ταχυδρομικά, αυτό θα αποσταλεί στη Διεύθυνση Κατοικίας που έχετε δηλώσει στην Τράπεζα. Για να προχωρήσετε, είναι απαραίτητο να αποδεχτείτε τους Όρους Χρήσης που αντιστοιχούν στους αρχικούς όρους σύμβασης χορήγησης της κάρτας σας. Στη συνέχεια, πατήστε «Υποβολή».Θα οδηγηθείτε στην επόμενη οθόνη όπου και θα σας ζητηθεί Κωδικός Μιας Χρήσης μέσω SMS προκειμένου να επιβεβαιώσετε την ενέργειά σας. Εισάγετε τον κωδικό μιας χρήσης στο εμφανιζόμενο πεδίο και εφόσον συμφωνείτε με τα δεδομένα που εμφανίζονται στη σελίδα, επιλέξτε «Επιβεβαίωση».Λαμβάνοντας το θετικό αποτέλεσμα συναλλαγής, μπορείτε να κατεβάσετε στον υπολογιστή σας την Απόδειξη Συναλλαγής. Το PIN σας θα αποσταλεί εντός 4-6 εργάσιμων ημερών μετά την καταχώρηση της αίτησής σας. Χρεωστικές Κάρτες Υπενθύμιση PIN κάρτας Έχετε τη δυνατότητα να προχωρήσετε σε «Υπενθύμιση PIN κάρτας » σε περίπτωση που δεν θυμάστε το PIN της κάρτας σας ως εξής:Επιλέγετε από το Χαρτοφυλάκιό σας την κάρτα σας και μεταβαίνετε στην οθόνη που εμφανίζονται οι Λεπτομέρειες κάρτας. Από τις «Ενέργειες Κάρτας» επιλέγετε «Υπενθύμιση PIN Κάρτας».Από την dropdown list “Τρόπος Αποστολής PIN”, θα επιλέξετε τον τρόπο που επιθυμείτε: Παραλαβή από Κατάστημα ή Ταχυδρομικά στην Διεύθυνσή σας.• Στην περίπτωση παραλαβής PIN από Κατάστημα, θα πρέπει να επιλέξετε επίσης σε ποιο κατάστημά μας επιθυμείτε να γίνει η παραλαβή του.• Στην περίπτωση παραλαβής PIN Ταχυδρομικά, αυτό θα αποσταλεί στη Διεύθυνση Κατοικίας που έχετε δηλώσει στην Τράπεζα. Για να προχωρήσετε, είναι απαραίτητο να αποδεχτείτε τους Όρους Χρήσης που αντιστοιχούν στους αρχικούς όρους σύμβασης χορήγησης της κάρτας σας. Στη συνέχεια, πατήστε «Υποβολή».Θα οδηγηθείτε στην επόμενη οθόνη όπου και θα σας ζητηθεί Κωδικός Μιας Χρήσης μέσω SMS προκειμένου να επιβεβαιώσετε την ενέργειά σας. Εισάγετε τον κωδικό μιας χρήσης στο εμφανιζόμενο πεδίο και εφόσον συμφωνείτε με τα δεδομένα που εμφανίζονται στη σελίδα, επιλέξτε «Επιβεβαίωση».Λαμβάνοντας το θετικό αποτέλεσμα συναλλαγής, μπορείτε να κατεβάσετε στον υπολογιστή σας την Απόδειξη Συναλλαγής. Το PIN σας θα αποσταλεί εντός 4-6 εργάσιμων ημερών μετά την καταχώρηση της αίτησής σας. Προπληρωμένες Κάρτες Φόρτιση προπληρωμένης κάρτας Προκειμένου να φορτίσετε με επιπλέον χρήματα την ενεργή προπληρωμένη κάρτα σας, επιλέγετε «Συναλλαγές», «Φόρτιση Προπληρωμένης Κάρτας» και στη συνέχεια επιλέ το «Λογαριασμό Χρέωσης», την «Προπληρωμένη Κάρτα» και συμπληρώνετε το «Ποσό» φόρτισης . Επιλέγετε «Υποβολή» και στο επόμενο βήμα επιλέγετε την «Επιβεβαίωση» εφόσον συμφωνείτε με τα στοιχεία της συναλλαγής σας.Αν έχετε μόνο μια κάρτα, τότε το πεδίο «Προπληρωμένη Κάρτα» εμφανίζεται προσυμπληρωμένο. Το ελάχιστο και το μέγιστο ποσό φόρτισης καθορίζονται από την Τράπεζα. Προσωρινή Διακοπή Χρήσης Προκειμένου η κάρτα σας να απενεργοποιηθεί προσωρινά και να απορρίπτονται όλα τα αιτήματα εγκρίσεων συναλλαγών, ακολουθείτε τα παρακάτω βήματα:Επιλέγετε από το Χαρτοφυλάκιό σας την κάρτα σας που θέλετε να απενεργοποιήσετε προσωρινά και μεταβαίνετε στην οθόνη που εμφανίζονται οι λεπτομέρειες της κάρτας. Από τις «Ενέργειες Κάρτας» επιλέγετε «Προσωρινή Διακοπή Χρήσης Κάρτας». Πατώντας «Υποβολή» θα σας ζητηθεί Κωδικός μιας Χρήσης μέσω SMS προκειμένου να επιβεβαιώσετε την ενέργειά σας. Εισάγετε τον Kωδικό μιας Xρήσης στο αντίστοιχο πεδίο και 