title = "Κωδικοί μιας χρήσης μέσω e-mail - Attica Bank"
description = "Στο πλαίσιο της συνεχούς αναβάθμισης του επιπέδου ασφάλειας που παρέχουμε μέσω των ψηφιακών υπηρεσιών Attica e-banking & Attica Mobile ενεργοποιήσαμε την εφαρμογή ενός πρόσθετου μηχανισμού…"
full_description = "Στο πλαίσιο της συνεχούς αναβάθμισης του επιπέδου ασφάλειας που παρέχουμε μέσω των ψηφιακών υπηρεσιών Attica e-banking & Attica Mobile ενεργοποιήσαμε την εφαρμογή ενός πρόσθετου μηχανισμού επιβεβαίωσης συναλλαγών με τη χρήση του προσωπικού σας e-mail. Κάθε φορά που πραγματοποιείτε κάποια από τις παρακάτω συναλλαγές, θα σας ζητείται επιπλέον επιβεβαίωση της συναλλαγής σας μέσω του πρόσθετου κωδικού μιας χρήσης τον οποίο θα λάβετε στο e-mail που έχετε δηλώσει στην Τράπεζα. Συναλλαγές που απαιτείται ο πρόσθετος κωδικός: Μεταφορά χρημάτων σε τρίτους εντός και εκτός τράπεζας Αλλαγή κωδικού πελάτη (Username) και μυστικού κωδικού (Password) Εγγραφή και μεταβολή συσκευής κινητού τηλεφώνου ή τάμπλετ Μεταβολή ημερήσιων ορίων για μεταφορές & πληρωμές Ενημέρωση προσωπικών στοιχείων ή αριθμού κινητού τηλεφώνου μέσω eGov-KYC. H χρήση του πρόσθετου κωδικού μιας χρήσης που θα λαμβάνετε μέσω email για μεταφορές σε λογαριασμούς τρίτων εντός και εκτός Attica Bank και για μεταφορές μέσω IRIS payments, θα ζητείται μόνο εφόσον ξεπεράσετε το ποσό των €1000 αθροιστικά μέσα στην ίδια ημέρα, κάνοντας είτε μια μεμονωμένη συναλλαγή είτε περισσότερες. Σας υπενθυμίζουμε ότι η τράπεζα δεν θα σας ζητήσει σε καμία περίπτωση και με κανένα τρόπο (τηλεφωνικά, μέσω email, Viber, SMS), να αποκαλύψετε τους προσωπικούς σας κωδικούς και εμπιστευτικά στοιχεία όπως μυστικό κωδικό, PIN κάρτας, κωδικούς μιας χρήσης (OTP)."
