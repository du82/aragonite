full_description = "Making your shell magicalSync, search and backup shell history with Atuincurl --proto '=https' --tlsv1.2 -LsSf https://setup.atuin.sh | sh Get startedTrusted by engineers at Proudly open source20K+GitHub Stars200+Contributors200M+Synced historyFeaturesWhat you get with AtuinShell history syncSync your shell history to all of your machines, wherever they areEnd-to-end encryptionAll data is encrypted, and can only be read by youEfficient searchSearch decades of shell history, and recall it in an instant. Atuin offers configurable full text or fuzzy search, filterable by host, directory, etc.Open sourceAtuin is open source with a permissive license, and has a growing communityData importBring your existing history with you - Atuin supports importing from a wide variety of formatsStore extra contextAtuin stores extra context with your commands - working directory, exit code, and more!Accelerate your productivity in 2 minutesStep 1: Run the install scriptRun our install script to get setup with the Atuin binary and shell pluginStep 2: RegisterOptionally sign up for Atuin Cloud Sync, or self-host your own sync serverStep 3: SearchEnjoy enhanced ctrl-r, and keep your history foreverFAQsFrequently Asked Questions Can you read my shell history?No. Atuin is fully end-to-end encrypted. Without your key, nobody can see a thing. Read more about our encryption here! Do I have to register?If you would like to sync your shell history, registration is required. Otherwise, you can use Atuin locally as a fully-offline enhanced history search tool What if I still don't trust your server?If you would rather operate + maintain your own sync server then we have a guide here! Atuin supports self-hosting. What technology does Atuin use?Atuin is written in Rust, and stores your data in SQLite. Both technologies are known for being fast and reliable What shells can I use Atuin with?Atuin currently supports Bash, ZSH, Fish and NuShell What if I have more questions?Our docs go into much further detail, but if your question is still not answered then please do feel free to drop in on our DiscordAtuinMaking your shell magical Get started"
