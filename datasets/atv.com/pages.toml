title = "AIROH Helmets Rolls into the U.S. with Innovation & Racing Pedigree | ATV.com"
description = "AIROH Helmets, an Italian manufacturer known for its involvement in motorsports and helmet technology, is entering the U.S.market with a new distribution facility in Temecula, California.The company, which has secured over 150 world titles in racing, has appointed Dennis Bloch, affiliated with SEVEN MX, to lead its distribution, marketing, and sales efforts in the United States."
full_description = "Top stories Best Off-Road Trails Getting Hitched With Moose Utility Off-Road Trails: South Dakota See Edits 440 Views AIROH Helmets Rolls into the U.S. with Innovation & Racing Pedigree by ATV.com Staff (IC: employee) Published: February 20th, 2025 Share AIROH Helmets, an Italian manufacturer known for its involvement in motorsports and helmet technology, is entering the U.S. market with a new distribution facility in Temecula, California. The company, which has secured over 150 world titles in racing, has appointed Dennis Bloch, affiliated with SEVEN MX, to lead its distribution, marketing, and sales efforts in the United States. Company Background and ExpansionFounded by Antonio Locatelli in Bergamo, Italy, AIROH Helmets has focused on developing head protection for various types of riders. The company has an in-house wind tunnel and testing lab, which it uses to refine helmet designs for safety and performance. AIROH remains a family-run business, with Locatelli’s daughter now involved in its operations. Helmet Lineup and FeaturesAIROH offers helmets for a range of riding applications, including off-road, adventure, and street use.Adventure (ADV) Helmets: These helmets are designed with versatility in mind, offering features such as removable sun visors. They are intended for riders who require durability and comfort across varying terrains.Off-Road & Dirt Helmets: AIROH’s off-road helmets prioritize weight reduction, ventilation, and impact protection. Models like the Aviator III, Strycker, and Twist 3 incorporate streamlined designs and materials to maintain airflow and reduce strain during extended use. Racing Involvement and AmbassadorsAIROH helmets are used by riders in various competitive disciplines, including Supercross, Motocross, Enduro, and Adventure racing. Athletes such as Jason Anderson, Tom Vialle, and Cooper Abbott in the U.S., as well as international competitors like Jeffrey Herlings and Antonio Cairoli, wear AIROH helmets in professional events. U.S. Availability and Market PlansAIROH helmets will be available through AIROH USA starting in Spring 2025. The company aims to provide direct access to its products for American riders while expanding its dealer network. AIROH’s expansion into the U.S. represents an effort to bring its European-developed helmet technology to a broader audience. The company’s focus remains on refining head protection for various riding conditions while maintaining its presence in competitive racing. Share Print #NewsAnnouncements #AIROH #AIROHHelmets #News #Announcements #Utv #Atv #Quad #SXS #Sidebyside #UtilityTerrainVehicle #AllTerrainVehicle #Helmet #ProtectiveGear #Safety #SafetyGear #Armour #protection #RidingGear Add/Edit + Add Hashtags ATV.com Staff More by ATV.com Staff Published February 20th, 2025 1:31 AM Comments Join the conversation Sign Up to Comment Best Off-Road Trails New Rider's Hub Get Started Find your ATV ATV Specs Classifieds Category Sport Sport UTV Utility Utility UTV Youth Make AlphaSports Arctic Cat Argo Bad Boy Bennche Bobcat Bombardier Can-Am Case IH CFMOTO Cub Cadet E-ton Hisun Honda Hyosung John Deere Kawasaki Kayo KIOTI KTM Kubota Kymco Land Pride Landmaster Mahindra Massimo New Holland Polaris QLINK Segway Powersports SSR Motorsports Suzuki SYM Textron Off Road Tomberlin Tracker Off Road United Motors Vanderhall Vento Yamaha Year 2026 2025 2024 2023 2022 2021 2020 2019 2018 2017 2016 2015 2014 2013 2012 2011 2010 2009 2008 2007 2006 2005 2004 Model Find ATV Manufacturer Arctic Cat Bennche Bobcat Bombardier Can-Am CFMOTO Cub Cadet Hisun Honda John Deere Kawasaki KTM Kubota Kymco Mahindra Polaris SSR Motorsports Suzuki Textron Off Road Yamaha Other Find ATV Top Brands Honda Yamaha Polaris Suzuki Kawasaki Arctic Cat Can-Am John Deere Kymco CFMoto Argo Other Popular Articles RZR v Maverick: The Ford v Ferrari of SXS Racing From Pit Dreams to King of the Hammers: Rediscovering Joy in Racing Putting the 2025 Can-Am Outlander XT-P 1000