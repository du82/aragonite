ing, the exciting rivalry between teams riding Polaris RZRs and Can-Am Maverick Rs. In sanctioned series like SCORE, NORRA, BITD, and countless others, RZR vs. Maverick is genuinely the Ford v Ferrari of UTV racing. Don't take it from us. ATV.com was pleased to sit down with competitors from both sides of the RZR vs. Maverick feud to hear their perspectives on this rapidly intensifying rivalry. Read more Benny Kirk Feb 27, 2025 Kawasaki Debuts NAV 4e, Company's First Electric "PTV" There's a new electric "golf" cart on the block. Kawasaki has announced its NAV 4e, the brand's first-ever electric four-wheeled vehicle. The brand calls it a Personal Transportation Vehicle (PTV), or Neighborhood Activity Vehicle—hence the NAV moniker. Prices start at $12,999 and go up to $19,999, coming to market in March of this year. Read more Ross Ballot Feb 27, 2025 From Pit Dreams to King of the Hammers: Rediscovering Joy in Racing If you told young(er) Vanessa that she would one day own her own race car and run her own race program, she might not believe you. Growing up in an off-road family, motorsports runs deep in my blood. Being present while my dad competed in Baja is one of my favorite childhood memories. I vividly remember sitting in the chase vehicle, watching all the competitors go by, waiting for my dad and his truck to pull in — like it was just yesterday. Now, the tables have turned, and my dad waits anxiously for his daughter to come into the pits race after race as her crew chief. Read more Vanessa Tortolero Mar 01, 2025 Kawasaki Teases "Project H2" Might Have Supercharged Motor (Shhh) Kawasaki's Ninja H2 motorcycle is one of the wildest machines in any category. Its 998cc four-cylinder engine makes anywhere from 210 to 310 horsepower, numbers that would make many sports cars go shy. H2 means a lot to the brand, and a lot to the motorcycle world, and now it seems Kawasaki might be putting its craziest powerplant into a UTV. This could be one for the ages. Read more Ross Ballot Feb 26, 2025 How to Get Your ATV or SxS Insured Your ATV or Side-by-Side (SxS) represents a significant investment, and one that you will likely want to protect with some form of insurance policy. In fact, many banks will require some form of insurance to cover the machine if you have any form of loan out for buying it. But how do you get your ATV or SxS insured? It’s not as tricky as it may seem, nor is it going to be overly expensive in most cases. Read more Derrek Sigler Feb 25, 2025 We Want to Know... What’s the Worst Upgrade You’ve Ever Done? We’ve all been there—chasing the dream of the ultimate build, only to end up with a lighter wallet and a heavier sense of regret. What’s your worst mod mistake? Tell us in the comments! Read more ATV.com Staff Mar 01, 2025 AIROH Helmets Rolls into the U.S. with Innovation & Racing Pedigree AIROH Helmets, an Italian manufacturer known for its involvement in motorsports and helmet technology, is entering the U.S. market with a new distribution facility in Temecula, California. The company, which has secured over 150 world titles in racing, has appointed Dennis Bloch, affiliated with SEVEN MX, to lead its distribution, marketing, and sales efforts in the United States. Read more ATV.com Staff Feb 20, 2025 Can-Am Maverick R, Outlander Pro, and More Win 2024 Design Awards 2024 was a good year for Can-Am's parent company BRP, with the Canadian brand bringing home 17 design awards. These acknowledgements are for everything from Outlander ATVs to Sea-Doo PWCs, and recognize the company for things like technology, form, and function. Read more Ross Ballot Feb 18, 2025 How to Choose the Right Helmet and Why You Need to Wear One You need to wear a helmet. Let us rephrase that - You NEED to wear a helmet. When you are riding an ATV or riding/driving in a Side-by-Side (SxS), you need to wear a helmet because you need to stay safe. You might as well get used to this idea, too. You need to find the right helmet for your head, and then you need to use it - both your head and your helmet. We want you to stay safe, and one of the best things you can do for your own personal safety when out on your machine is to wear the appropriate safety gear. Not sure how to choose the right helmet, and/or why you need to wear one? We will explain. Read more Derrek Sigler Feb 18, 2025 Putting the 2025 Can-Am Outlander XT-P 1000R to Work A recent need to move some rocks around the yard led to an opportunity to put our 2025 Can-Am Outlander XT-P 1000R test machine to work. This might not be as much fun as letting the quad’s 999cc, 101-horsepower Rotax V-twin loose on the trail, but the Outlander is still a utility machine at heart, and on this occasion, that’s exactly what we tasked it with. The escapade would test its strength and low-speed capability, and we took the chance to revel in every second of using it to help get the job done. Read more Ross Ballot Feb 27, 2025 Powersports Deals | Now Let's Put in the Work We’re out here combing the web, constantly searching great deals on powersports gadgets, gear, parts & accessories, so you don't have to... This post updates each week with the latest sales, so you can your hands on quality items for a fraction of the price. Keep checking here for the new hotness. Better yet, let us remind you every Friday by joining our newsletter! (It only gets easier from here.) Read more ATV.com Staff Feb 17, 2025 Can-Am, Tread Lightly! Launch Free "Responsible Rider" Masterclass Need to brush up on what it takes to be a responsible rider, or think you know everything and still want to hear from the leaders in the off-road space? Can-Am's parent company BRP and perennial do-gooder organization Tread Lightly! have announced a partnership that will bring a series of Masterclass sessions to help better your abilities as a rider and participant in the powersports space alike. Read more Ross Ballot Feb 15, 2025 Can-Am's Kyle Chaney Dominates King Of the Hammers 4400 Unlimited Race King of the Hammers is a huge event in the off-road community, and now it's one that will forever hold a place in the hearts of Can-Am and Kyle Chaney, with the pairing taking home a massive victory 4400 Unlimited Race at King of the Hammers. Chaney and co-driver Terry Madden dominated in their Maverick R, beating their closest competitor by over 30 minutes. Read more Ross Ballot Feb 14, 2025 We Want To Know... What's the Best Trail Near You? There’s something about hitting the trails that never gets old. Whether you’re chasing a thrill or just soaking in the natural beauty, off-roading always delivers. The roar of the engine, the rugged terrain, and the places you can only reach by getting your wheels dirty—it's a feeling that never gets old. Whether you prefer riding solo to clear your head or cruising with a group for some company, the trail is always there, waiting for you. Read more ATV.com Staff Feb 14, 2025 VIDEO | First Ride the Kawasaki 2025 Teryx KRX 1000 Blackout Edition We took on the diverse desert wilderness of Southern Utah to put Kawasaki’s 2025 Teryx KRX 1000 Blackout Edition to the test—a side-by-side built for both grit and style. From the 999cc parallel-twin engine to the high-clearance suspension and blackout trim, we put its features through their paces. Rocky climbs? Conquered. Sandy washes? Sliced through. We also felt the difference from the Fox 2.5 Podium shocks in the whoops and pushed the on-demand front diff lock in tight technical spots. Want the full breakdown? Check out our complete review here. Otherwise, stick around for the video and decide if the Blackout Edition lives up to its bold looks. Also, check out the in-depth review from our first ride of the "Night Rider". Read more Kyra Sacdalan Feb 14, 2025 How to Change Your Own Oil You can save yourself a lot of expense and headaches by doing some of the regular maintenance to your ATV on your own. One of the easiest things you can do is to change your oil regularly. It is a vital part of the maintenance routine and if you don’t know how to do it, don’t worry. It’s not that hard to learn how to change your own oil. Read more Derrek Sigler Feb 11, 2025 1 2 3 4 5 6 7 8 9 Best Off-Road Trails New Rider's Hub Get Started Top Brands Honda Yamaha Polaris Suzuki Kawasaki Arctic Cat Can-Am John Deere Kymco CFMoto Argo Other Popular Articles RZR v Maverick: The Ford v Ferrari of SXS Racing From Pit Dreams to King of the Hammers: Rediscovering Joy in Racing Putting the 2025 Can-Am Outlander XT-P 1000R to Work We Want to Know... What’s the Worst Upgrade You’ve Ever Done? AIROH Helmets Rolls into the U.S. with Innovation & Racing Pedigree About Privacy Terms Contact us Advertising Staff and Contributors Copyright Follow us © 2025 VerticalScope Inc. All rights reserved.'''
