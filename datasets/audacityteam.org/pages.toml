["https://audacityteam.org/blog/openvino-ai-effects"]
title = "Audacity ® | Introducing OpenVINO AI effects for Audacity"
description = "Intel has built a suite of AI tools for Audacity, useful for spoken word audio and music alike. These AI features run 100% locally on your PC."
full_description = "Introducing OpenVINO AI effects for Audacity By Leo Wattenberg Tuesday, January 2, 2024 Intel has built a suite of AI tools for Audacity, useful for spoken word audio and music alike. These AI features run 100% locally on your PC. AI tools for podcasts For spoken word content, the OpenVINO effects contain a noise supression and a transcription plugin. The Noise Suppression does what it says on the tin - it suppresses noise. As such it behaves similar to Audacity’s built-in Noise Removal effect. More information on noise suppression The Transcription powered by Whisper.cpp can both transcribe and translate words and outputs to a label track. If you want to export these transcriptions, you can do so via File → Export Other → Export Labels. More information on transcription AI tools for music For music, both generation and separation plugins are part of the OpenVINO effects. Music Generation and Music Style Remix use Stable Diffusion (and Riffusion in particular) to generate new music from a prompt, or based on pre-existing music, respectively. More information on Music Generation and Music Style Remix Music Separation can split a song into either it’s vocal and instrumental parts, or into vocals, drums, bass and a combined “anything else” part. This is ideal for creating covers and playalongs. More information on music separation Download and installation The OpenVINO plugins are currently available for download here: https://github.com/intel/openvino-plugins-ai-audacity/releases. Currently, only a Windows version is available for download. The project may be compiled on Linux and macOS, though no instructions are available for the latter yet. If you have any questions or comments, feel free to post them to the plugin’s issue tracker."
