["https://www.audacityteam.org/blog/audacity-3-6"]
title = "Audacity ® | Audacity 3.6"
description = "Audacity 3.6: Master channel, new effects, new themes and more!"
full_description = "Audacity 3.6 By Leo Wattenberg Tuesday, July 16, 2024 Watch the release video Major changes in Audacity 3.6 Master effects Audacity now features master effects. Master effects are effects which apply to the entire project at once. More information can be found at Audacity Support: Using master effects & realtime effects. New compressor and limiter A new compressor and limiter has been added, replacing the previous versions. A gain reduction history has been added to these effects when they’re used as a realtime effect. Factory Presets suitable for a wide range of use cases for these effects have been provided by Vladislav Isaev and Marek Iwaszkiewicz, available via the Presets & Settings button. New themes Audacity now features new and improved dark and light themes. You can switch between themes via Preferences -> Interface. The theme previously used still is around as the Classic theme, and themes even older than that can be optionally installed as custom themes. Updated instructions on creating custom themes can be found here. Increased performance Audacity is now quite a bit snappier than before, especially when working on larger projects and on larger screens. See the full changelog"
