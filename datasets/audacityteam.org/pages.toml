title = "Audacity ® | Cookie Policy"
description = "Audacity is the world's most popular audio editing and recording app. Edit, mix, and enhance your audio tracks with the power of Audacity. Download now!"
full_description = "Last updated: 13. October 2023 About this Policy This Cookie Policy (“Policy”) explains how we use cookies and other similar technologies to recognise you when you visit our website https://www.audacityteam.org (“Website”). It explains what these technologies are and why we use them, as well as your rights to control our use of them. Please take the time to read this Policy carefully. If you have any questions or comments, please contact us via email at [email protected]. A note about your personal information When you arrive on AudacityTeam.org, your IP address is anonymised before being stored on our servers by default. This makes it impossible for us to ever identify you. What are cookies? Cookies are small data files that are placed on your computer or mobile device when you visit a website. Cookies are used by website owners in order to understand how you are using the website, by providing usage statistics which helps to maintain and improve it. Cookies have many different features, such as allowing you to navigate between pages efficiently, remembering your preferences, and generally improving your user experience. Cookies set by the Website itself (in this case, https://www.audacityteam.org) are called “first party cookies“. Please note that our Website does not use any third party cookies. How do we use cookies? When you visit our Website, we place the following types of cookies: Necessary cookies: These cookies are strictly necessary to provide you with the services available through our Website and to use some of its features, such as security or cookies consent storage. Because these cookies are strictly necessary to deliver the Website to you, you cannot refuse them. Statistics (non-necessary) cookies: These cookies collect information that is used either in aggregate form to help us understand how our Website is being used, which helps us make improvements to it. By default we collect statistics that track the number of site visits as well as the number of downloads of Audacity. These analytics are anonymously collected: your IP address is anonymised before storage and by default, we do not collect any other personal information of any kind. You still have the option to disable the processing of these anonymized statistical cookies through the settings in our cookie banner (please refer section “How can I control cookies?” below for more info). On our Website we use only first party cookies, which means that all your cookie data will be stored on our side in accordance with the rules applicable to the protection of privacy in the electronic communications sector. CookieDurationDescriptionTypeaudacity-consent1 yearStores your cookie preferencesNecessary__cf_bm30 minCloudflare Bot ManagementNecessarycf_clearance30 minCloudflare challenge clear proofNecessaryCookies starting with:_pk..., mtm...VariesMatomo cookies. Details…Analytics How can I control cookies? In addition to the preferences that you set within the cookie banner, you can set or amend your web browser controls to accept or refuse some cookies. You also can delete existing cookies in the web browser. If you choose to reject cookies, you may still use our Website. As means by which you can refuse cookies through your web browser controls vary from browser-to-browser, you should visit your browser’s help menu for more information. The cookies that were sent in the past If you have disabled one or more cookies, we can use information collected by these cookies before the deactivation. Information collected before deactivation will expire after a maximum of 13 months. However, we cease to collect information via the opted-out cookie. Updates to this Notice We may update this Policy from time to time in response to changing legal, technical or business developments. When we update our Policy, we will take appropriate measures to inform you, consistent with the significance of the changes we make. You can see when this Policy was last updated by checking the “last updated” date displayed at the top of this Policy."
