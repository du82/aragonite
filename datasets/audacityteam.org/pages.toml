["https://audacityteam.org/blog/new-website"]
title = "Audacity ® | Our new website"
description = "We've been working on a new website Audacity and here it is!"
full_description = "Our new website By Leo Wattenberg Wednesday, October 11, 2023 Hello everyone! This is a quick note to let you know we updated our website. Audacity itself will get a new look soon-ish as well, though that is a Herculean task which is better measured in years than weeks. This new website no longer uses Wordpress, opting for a much more lightweight static site generator instead. Additionally, things have been slimmed down a bit. Old posts got archived and the page structure has been consolidated. If you encounter any issues or have suggestions for this website in particular, feel free to leave a comment in our forum. In the future, we want to translate this website into more languages, too. We’ll let you know when we’re opening up translations here. In the meantime, you can get involved in translating Audacity if translation is your thing. If you’d rather help other users, you can do so in our Forum (which also has a new look as of earlier this year) or on Discord. And that’s it! Let us know what you think!"
