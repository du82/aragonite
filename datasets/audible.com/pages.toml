pe); } observer.disconnect(); } } }; const observer = new MutationObserver(callback); observer.observe(adblPageElement, { attributeFilter: ["data-faded-in"] }); } } We've got what everyone's listening to Bestsellers. New releases. That story you've been waiting for. The Let Them Theory By: Mel Robbins Onyx Storm By: Rebecca Yarros Fourth Wing By: Rebecca Yarros Iron Flame By: Rebecca Yarros Atomic Habits By: James Clear Harry Potter and the Sorcerer's Stone, Book 1 By: J.K. Rowling Quicksilver By: Callie Hart A Court of Thorns and Roses By: Sarah J. Maas The House of My Mother By: Shari Franke The Crash By: Freida McFadden The Wedding People By: Alison Espach The Commuter By: James Patterson, and others The Ratcatcher By: Anthony Khaseria The Housemaid By: Freida McFadden Dungeon Crawler Carl By: Matt Dinniman Project Hail Mary By: Andy Weir This Inevitable Ruin By: Matt Dinniman Butcher & Blackbird By: Brynne Weaver Harry Potter and the Chamber of Secrets, Book 2 By: J.K. Rowling The Women By: Kristin Hannah Explore new worlds From epic stories to self-improvement, there are audiobooks for everyone. All categories Self Development Romance Thrillers Literature & Fiction Kids Biographies & Memoirs Health & Wellness Science Fiction Religion & Spirituality Business History Only from Audible Groundbreaking Originals and exclusives from A-list celebs and emerging talent. The listening never has to stop Thousands of included titles. No cap on listening time. A Court of Thorns and Roses By: Sarah J. Maas The Commuter By: James Patterson, and others The Ratcatcher By: Anthony Khaseria The Day She Disappeared By: Sam Genever Always a Bridesmaid By: Erin Clark, and others Red Rising By: Pierce Brown What Kind of Mother By: Anna-Lou Weatherley The Things We Leave Unfinished By: Rebecca Yarros The Signal By: Eric Buchman, and others Self-Conscious with Chrissy Teigen By: Chrissy Teigen A Court of Thorns and Roses (Part 1 of 2) (Dramatized Adaptation) By: Sarah J. Maas The Fellowship of the Ring By: J. R. R. Tolkien Trial of the Sun Queen By: Nisha J Tuli Twisted Love By: Ana Huang The Life We Bury By: Allen Eskens George Orwell’s 1984 By: George Orwell, and others Wicked By: Gregory Maguire Sound Therapy: Bliss (396Hz) By: Audible Sleep, and others He Who Fights with Monsters: A LitRPG Adventure By: Shirtaloon, and others Do Not Disturb By: Freida McFadden Prime member exclusive New Audible subscribers get 2 free audiobooks with trial Love books? You'll Love Audible. Transform your day Replace endless scrolling with endless listening. Chores can be fun. Reach your reading goals From daily commutes to epic road trips, go with the best in audio entertainment. Carry your entire Library Your stories go where you go. Audiobooks don’t weigh a thing. Listen and learn Discover stories that can change your mind, your well-being, and your life. Listen everywhere Download titles to listen offline, wherever you are in the world. Find your niche With thousands of titles to explore, there’s something for everyone. Get Started An app designed for how you listen Find the right speed Use player controls to slow down the narration or pick up the pace. Set a timer Perfect for winding down or multitasking. Timer pauses your story for you. Listen with Car Mode Listen on the go with bigger, simplified controls and a screen that never sleeps. Listen anytime, anywhere Download titles and listen offline, wherever you are. Frequently asked questions How does the free trial work? Audible is a membership service that provides customers with the world's largest selection of audiobooks as well as podcasts, exclusive originals and more. Your Audible membership is free for 30 days. If you enjoy your Audible trial, do nothing and your membership will automatically continue. We'll send you an email reminder before your trial ends. Download the free Audible app to start listening on your iOS or Android device. You can also listen on any Alexa-enabled device, compatible Fire tablets, Kindles, Sonos devices and more. You can cancel anytime before your trial ends and you won’t be charged. There are no commitments and no cancellation fees. How much does Audible cost? Plans start at $14.95 per month after free trial. Visit our Plans & Pricing page to learn more. What is included with my Audible membership? As an Audible member, your subscription includes: Premium Plus members get credit(s) good for any titles in our premium selection (1 credit = 1 title)* Access to exclusive member sales and discounts on all additional purchases. All members can listen all they want to thousands of included audiobooks, podcasts, originals, and more in the Plus Catalog. *Number of credits varies based on your membership plan. Credits expire after one year. Are there additional benefits for Amazon Prime members? Amazon Prime members are invited to start their first Audible trial with 2 free credits (1 credit = 1 title) that can be used on any bestsellers or new releases. Returning Prime members who have previously received 2 credits with trial will only be eligible for the standard trial. A standard trial includes 1 credit. After trial, all members receive 1 credit per month. Do I have to commit for any period of time? There are no commitments. You can easily cancel your membership at anytime. All titles purchased with a credit are yours to keep forever.'''
