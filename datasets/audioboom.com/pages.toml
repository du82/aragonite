e of the platform and record your email address and/or IP address, operating system and browser type, for system administration and to report aggregate information to our advertisers. We may also collect non-personal aggregated statistics data about visitors to the platform and sales and traffic patterns. This is statistical information about our users' browsing actions and patterns and does not identify any individual."
