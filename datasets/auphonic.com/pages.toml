full_description = "Automate your audio workflows or integrate our powerful algorithms into your service offering using the Auphonic API. Streamline your file transfer process with our external service integrations. Our system allows you to easily transfer files between a server and Auphonic without requiring manual up- and downloading. Save time and effort by letting our service handle the work for you. Automatically publish your results to podcasting, audio, and video hosting services. If you operate your own podcast hosting service or a similar platform, you can integrate it as a publishing target within Auphonic. Discover the convenience of watch folders, batch productions and our Zapier interface, which allow you to automate podcast workflows and integrate hundreds of web services without any coding. Completely integrate Auphonic into your digital audio workstations, content distribution platforms, and other relevant tools with custom algorithms and pricing. With Auphonic, you can enhance your existing product with custom algorithms and pricing options. Improve your service offerings with Auphonic and make it easier to deliver a superior experience to your users. With our API integration you can completely transform your business model. Yes, our software has a developer API available. The API allows you to build custom integrations and applications that can interact with the software. You can check it out here. Yes, we provide technical support for integrations and the API. Whether you need help setting up an integration or have questions about using the API, our support team is here to assist you. We are happy to receive your support request at support@auphonic.com. Yes, certain features like batch productions or watch folders for workflow automation are only available for premium users. You can find out more about our premium features on our pricing page. The time it takes for the AI algorithms to improve your audio file will depend on the size and complexity of the file, but on average, it typically takes about 10% of the length of the audio file. For example, if your audio file is one hour long, it would take about 6 minutes for our algorithms to improve it."
