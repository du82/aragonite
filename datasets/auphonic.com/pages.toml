full_description = '''New Auphonic Website, Free Advanced Algorithms and More Examples Written by Manuel Weilharter, Anastasia Orlova, Gabriel Zirkovits, Georg Holzmann on March 1, 2023 To start a new decade of automatic audio post production with Auphonic, we are happy to launch a few updates: New Website Design Opening the new homepage today, you might have noticed that our website looked different from what you had been used to before. Keeping our customers’ feedback from last year in mind, we designed a new vision for Auphonic. Our new website features a refreshed look with an improved, more engaging, and functional user experience. Moreover, a more straightforward, intuitive, and accessible navigation will give you a seamless workflow and a comfortable exploration of Auphonic’s features. We hope ... Continue reading → Discussions : No comments yet. Be first to comment! New Auphonic AutoEQ Filtering (Beta) Written by Manuel Pagavino, Georg Holzmann, Isabell Bühler on Jan. 24, 2023 table, th, td{ border: 1px solid black; border-collapse: collapse; border-color: #999; font-family: Helvetica,"Helvetica Neue",Arial,sans-serif; font-size: 11px; line-height: 22.5px; color: #555; text-align: center } td:nth-child(odd), th:nth-child(odd){ background-color: #eee; } In addition to our Leveler, Denoiser, and Adaptive 'Hi-Pass' Filter, we now release the missing equalization feature with the new Auphonic AutoEQ. The AutoEQ automatically analyzes and optimizes the frequency spectrum of a voice recording, to remove sibilance (De-esser) and to create a clear, warm, and pleasant sound - listen to the audio examples below to get an idea about what it does. Screenshot of manually ... Continue reading → Discussions : No comments yet. Be first to comment! Auphonic Speech Recognition Engine using Whisper by OpenAI (Beta) Written by Isabell Bühler, Gabriel Zirkovits, Lukas Timpl, Georg Holzmann on Nov. 8, 2022 Today we release our first self-hosted Auphonic Speech Recognition Engine using the open-source Whisper model by OpenAI! With Whisper, you can now integrate automatic speech recognition in 99 languages into your Auphonic audio post-production workflow, without creating an external account and without extra costs! Whisper Speech Recognition in Auphonic So far, Auphonic users had to choose one of our integrated external service providers (Wit.ai, Google Cloud Speech, Amazon Transcribe, Speechmatics) for speech recognition, so audio files were transferred to an external server, using external computing powers, that users had to pay for ... Continue reading → Discussions : No comments yet. Be first to comment!'''
