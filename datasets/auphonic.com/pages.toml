full_description = '''So that you can use our website and/or services, we need to collect certain data from you. Be assured though, it is Auphonic’s policy to fully respect your privacy regarding any information we may collect from you. Please be aware that by using our website and/or services you agree to give Auphonic permission to process and store the data uploaded as described in this privacy policy. If you have questions about deleting or correcting your personal data please contact us at support@auphonic.com. Auphonic.com ("Auphonic", "we", "us", "our") is an audio post production service, owned and operated by Auphonic GmbH. As a registered user of our "Service", you ("you", "your") can upload audio, video, image, and text files, and other data or information (together, "Content") and encapsulate them in "Productions" on our "Website" auphonic.com. Auphonic GmbH is a data controller for the purposes of the applicable data protection legislation in respect of the data it gathers from you and other users of our Website and/or Services. So you can understand what will happen to your data, this privacy statement sets out how we will deal with any data which can personally identify you or which can be used together with other information we are likely to have access to identify you (“Personal Data”). Auphonic is compliant with the General Data Protection Regulation of the European Union. Not only is this strict and transparent regulation applied to our EU customers, but it is also applied to all our customers worldwide. This ensures a higher degree of protection of our customers' personal data. Auphonic does only work with EU companies and partners who comply with the GDPR regulation themselves, or with US-American companies who comply with GDPR and the EU-US Privacy Shield. We provide a Data Processing Agreement for paying Auphonic customers which process personal data of third parties on request. Where you have ordered or contracted with us for any Services, we may also be provided with your personal data via organizations we interact with in the relevant sector, such as our billing providers. We only use this data in order to deliver our Services.'''
