["https://auphonic.com/help/web/preset.html"]
title = "Preset — Auphonic Help 2024 documentation"
full_description = "Preset Presets can store common metadata, intros/outros, file format and algorithms settings, external services, etc. for a group of recordings (e.g. a podcast series). You can select your preset when creating a new Production or when using the Auphonic API. Click here to create a new preset in our web system: https://auphonic.com/engine/preset/ Click here to create a new preset for Multitrack Productions: https://auphonic.com/engine/multitrack/preset/ Intro and Outro Automatically add an Intro/Outro to your production. Audio and video files are supported, with video files being limited to a length of 1 minute. As intros/outros are intended to be used multiple times, they are only Loudness Normalized to match the loudness of your production without further Auphonic processing (no leveling, filtering, noise reduction, etc.). Therefore you should edit/process your intro/outro before. For a detailed description of our intro/outro feature, please see the blog post Automatic Intros and Outros in Auphonic. Select Intro FileSelect your intro audio from a local file (in productions only), HTTP or an External Service (Dropbox, SFTP, S3, Google Drive, SoundCloud, etc. - please register the service first). NOTE: We store audio files only for a limited number of days, therefore you have to use intro/outro files in presets from HTTP or an External Service. In productions, you can upload intro/outro files directly. Intro OverlapSet overlap time in seconds of intro end with main audio file start, for details see Overlapping Intros/Outros. IMPORTANT: ducking must be added manually to intro audio file! Select Outro FileSelect your outro audio from a local file, HTTP or an External Service (Dropbox, SFTP, S3, Google Drive, SoundCloud, etc. - please register the service first). Outro OverlapSet overlap time in seconds of outro start with main audio file end, for details see Overlapping Intros/Outros. IMPORTANT: ducking must be added manually to outro audio file! Basic Metadata Basic metadata (title, cover image, artist, album, track) for your production. Metadata tags and cover images from input files will be imported automatically in empty fields! We correctly map metadata to multiple Output Files. For details see the following blog posts: ID3 Tags Metadata (used in MP3 output files), Vorbis Comment Metadata (used in FLAC, Opus and Ogg Vorbis output files) and MPEG-4 iTunes-style Metadata (used in AAC, M4A/M4B/MP4 and ALAC output files). Metadata fields can make use of Variables and Placeholders. Cover ImageAdd a cover image or leave empty to import the cover image from your input file. If a Video Output File or YouTube export is selected, Auphonic generates a video with cover/chapter image(s) automatically! Extended Metadata Extended metadata (subtitle, summary, genre, etc.) for your production. Metadata tags from input files will be imported automatically in empty fields! We correctly map metadata to multiple Output Files. For details see the following blog posts: ID3 Tags Metadata (used in MP3 output files), Vorbis Comment Metadata (used in FLAC, Opus and Ogg Vorbis output files) and MPEG-4 iTunes-style Metadata (used in AAC, M4A/M4B/MP4 and ALAC output files). Metadata fields can make use of Variables and Placeholders. SubtitleA subtitle for your production, must not be longer than 255 characters! Summary / DescriptionHere you can write an extended summary or description of your content. Append Chapter Marks to SummaryAppend possible Chapter Marks with time codes and URLs to your Summary. This might be useful for audio players which don’t support chapters! Create a Creative Commons LicenseLink to create your license at creativecommons.org. Copy the license and its URL into the metadata fields License (Copyright) and License URL! Tags, KeywordsTags must be separated by comma signs! Output Files Add one or multiple output file formats (MP3, MP4, Ogg, WAV, Video, …) with bitrate, channel and filename settings to a production (see Audio File Formats and Bitrates for Podcasts). All Metadata Fields and Chapter Markers will be mapped to multiple output files. See below for a list of other, specialized output formats. With Auphonic you can process video input files as well, or automatically generate a video output file from input audio using Cover and Chapter images - for details see Video Input and Output. Supported audio output file formats: MP3: see MP3 Details and bitrate suggestions MP3 Variable Bitrate: see Lossy Audio Formats AAC (M4A, MP4, M4B): see AAC Details and bitrate suggestions Opus: see Opus Details and bitrate suggestions Ogg Vorbis: see Lossy Audio Formats FLAC: see FLAC Details and bitrate suggestions ALAC (M4A, MP4): see Lossless Audio Formats WAV 16-bit PCM: see Uncompressed Audio Formats WAV 24-bit PCM: see Uncompressed Audio Formats Other output file formats: Video: Video Output for a video input file (we process the audio track only) or for an audio input file (we generate a video from your Cover and Chapter images) Audiogram (Waveform Video): generates a Shareable Audiogram Video from your input audio, including a dynamically generated waveform and your Cover Image (or possible Chapter Images) as background Individual Tracks: exports all individual, processed tracks of a Multitrack Production as separate files in WAV or FLAC format Unprocessed Input File: original (unprocessed) audio/video Input File Chapters File: chapter marks in MP4chaps Text Format Podlove Simple Chapters: chapter marks in Podlove Simple Chapter format (XML or JSON) Podcasting 2.0 Chapters: chapter marks in Podcasting 2.0 Chapters format (JSON) Cover Image: a copy of the Cover Image in full resolution Production Description: complete Description Of Your Production with all metadata, audio processing statistics, etc. (in JSON, XML or YAML) Audio Processing Statistics: loudness stats, music/speech, speaker activity, etc. in TXT, JSON or YAML format - see Audio Statistics Waveform Data File: data generated by audiowaveform for audio visualization - see Render Audio Waveforms in Browsers Transcript: human-readable HTML Transcript from Speech Recognition results Speech Data: machine-readable JSON or XML Data File with Speech Recognition results Subtitles: Subtitles/Captions File in WebVTT or SRT format with Speech Recognition results Cut List (Filler and Silence): export Filler Cuts and Silence Cuts as Cut Lists in Audacity, Adobe Audition, Reaper or EDL format Output File BasenameSet basename (without extension) for all output files or leave it empty to take the original basename of your input file. Output File FormatFor an overview of audio formats see Output Files. Audio Bitrate (all channels)Set combined bitrate of all channels of your audio output file. For details see Audio File Formats and Bitrates for Podcasts. Filename Suffix (optional)Suffix for filename generation of the current output file, leave empty for automatic suffix! Filename Ending, ExtensionFilename extension of the current output file. Mono MixdownClick here to force a mono mixdown of the current output file. Split on ChaptersIf you have Chapter Marks, this option will split your audio in one file per chapter. All filenames will be appended with the chapter number and packed into one ZIP output file. Speech Recognition Auphonic built a layer on top of multiple engines to offer affordable automatic speech recognition (ASR) in over 100 languages. Please select our internal Auphonic Whisper ASR or an External ASR Engine when creating a new Production or Preset. We send small audio segments to the speech recognition engine and then combine the results, add punctuation and apply some structuring to produce three types of Output Result Files: an HTML transcript, a WebVTT/SRT subtitle file and a JSON/XML speech data file. If you use a Multitrack Production, we can automatically assign speaker names to all transcribed audio segments. IMPORTANT: Speech Recognition is only available for paying users! Using our internal Auphonic Whisper ASR, you have the following benefits: No external account is needed to run ASR in Auphonic. Your data doesn’t leave our Auphonic servers for ASR processing. No extra costs for the ASR services. Additional Auphonic pre- and post-processing for more accurate ASR, especially for Multitrack Productions. The quality of Whisper ASR is absolutely comparable to the “best” services in our comparison table. Whisper also provides a reliable automatic language detection feature. Note: If you want to use an external speech recognition engine, you first have to connect to an external Speech Recognition Service at the External Services page! For Auphonic Whisper ASR you do NOT need to register an external service! For more details about our speech recognition system, the available engines, the produced output files and for some complete examples in English and German, please also visit Speech Recognition and our blog post about Auphonic Whisper ASR. Select ServiceFor Automatic Speech Recognition you can select Auphonic Whisper ASR or an external service. For external services please register the service first! Select LanguageSelect a language/variant for speech recognition. Auphonic Whisper ASR Select ServiceFor Auphonic Whisper ASR you do NOT need to register an external service! Speaker DiarizationAutomatically detect different speakers and add them to the transcript. The number of speakers can be auto-detected or selected manually. Speaker NamesAdd a comma-separated list of speaker names for speaker detection. List them in the order they appear in your input audio file. Google Speech API Word and Phrase HintsAdd Word and Phrase Hints to improve speech recognition accuracy for specific keywords and phrases. Metadata (chapters, tags, title, artist, album) will be added automatically! Wit.ai Speech Recognition Wit.ai LanguageThe language must be set directly in your Wit.ai App. IMPORTANT: If you need multiple languages, you have to add an additional Wit.ai service for each language! Amazon Transcribe Custom VocabularyAdd Custom Vocabularies to improve speech recognition accuracy for specific keywords and phrases. Metadata (chapters, tags, title, artist, album) will be added automatically! Speechmatics Custom DictionaryAdd your Custom Dictionary to improve speech recognition accuracy for specific keywords and phrases. Metadata (chapters, tags, title, artist, album) will be added automatically! Automatic Shownotes and Chapters You can automatically generate shownotes and chapters by checking the Automatic Shownotes and Chapters Checkbox in the Auphonic singletrack or multitrack Production Form with any of our ASR Services enabled. Once your production is done, the generated data will show up in your transcript result files and in the Auphonic Transcript Editor above the speech recognition transcript section. Unless you have manually entered content before, the generated data will also be stored in your audio files’ metadata. For more details and a description how to edit the autogenerated data, see Automatic Shownotes and Chapters Algorithm. Shownotes Summary ExamplePersonalize the generated summary by providing a sample of one of your own summaries. This way, the shownotes model will try to imitate your style, and the generated summary will better match your existing self-written ones. Additionally, you can use this feature to make the generated summary match your formatting, such as bullet points, HTML tags, or Markdown. Publishing / External Services Copy one or multiple result files to any External Service (Dropbox, YouTube, (S)FTP, SoundCloud, GDrive, LibSyn, Archive.org, S3, etc.): 1. First you have to connect to an external service at the External Services page. 2. Then you can select the service when creating a new Production or Preset. When exporting to Podcasting/Audio/Video Services (SoundCloud, YouTube, Libsyn, Spreaker, Blubrry, Podlove, etc.), all metadata will be exported as well. For a complete list and details about all supported services, see Auphonic External Services. Review before PublishingEnable this option to require a review before publishing results to services. You are able to publish the results on the status page after processing. Select ServiceSelect an external service for outgoing file transfers. Please register your service first! Output Files to copySelect which Output File should be copied to the current external service. YouTube Service YouTube Privacy SettingsSet your video to Public (everyone can see it), Private (only your account can see it) or Unlisted (everyone who knows the URL can see it, not indexed by YouTube). YouTube CategorySelect a YouTube category. Facebook Service Facebook Distribution SettingsPost to News Feed: The exported video is posted directly to your news feed / timeline. Exclude from News Feed: The exported video is visible in the videos tab of your Facebook Page/User (see for example Auphonic’s video tab), but it is not posted to your news feed (you can do that later if you want). Secret: Only you can see the exported video, it is not shown in the Facebook video tab and it is not posted to your news feed (you can do that later if you want). For more details and examples please see the Facebook Export blog post. Facebook EmbeddableChoose if the exported video should be embeddable in third-party websites. SoundCloud Service SoundCloud SharingSet your exported audio to Public or Private (not visible by other users). SoundCloud DownloadableSelect if users should be able to download your audio on SoundCloud, otherwise only streaming is allowed. SoundCloud TypeSelect a SoundCloud type/category. SoundCloud Audio File ExportSelect an audio output file which should be exported to SoundCloud. If set to Automatic, Auphonic will automatically choose a file. Spreaker Service Spreaker Draft StatusCheck this option to add this episode as draft to Spreaker without actually publishing it. Spreaker Collection / ShowSelect your Spreaker Collection where this track should be published. Each Collection has a separate RSS feed and can be created in your Spreaker Account. Spreaker SharingSet your exported audio to Public or Private (not visible by other users). Spreaker DownloadableIf disabled, listeners won’t be offered the option to download this track and it won’t be included in your RSS feed. PodBean Service PodBean Draft StatusCheck this option to add this episode as draft at PodBean without actually publishing it. PodBean Episode TypeSelect which audience you wish to publish this episode to. The exact list of options will vary based on your PodBean subscription model and settings. If you recently changed your subscription and miss some option here, please reauthorize us to see the updated list. Captivate Service Captivate Draft StatusCheck this option to add this episode as draft at Captive without actually publishing it. Episode TypeThe episode type to mark this podcast in feeds and some apps as. Normal"
