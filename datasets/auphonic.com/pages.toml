title = "Desktop Programs [Discontinued] — Auphonic Help 2024 documentation"
full_description = "Desktop Programs [Discontinued] Auphonic Leveler Batch Processor Auphonic Multitrack Processor Warning Most of our new algorithms use custom hardware, therefore it is unfortunately not possible for us to update the current desktop apps - please consider using our web service instead! They also do not work on macOS >= Ventura anymore! Our two desktop programs include the basic audio algorithms only. The algorithms will be computed offline on your device and are exactly the same as implemented in our Web Service. Our desktop programs are available for macOS < Ventura and Windows 7+ (32bit or 64bit). Note Metadata (tagging), chapter marks management, video/audiogram support, speech recognition, advanced algorithm parameters, external services integrations and automatic content deployment features of our Web Service are not included in our desktop programs! Furthermore all desktop programs are not scriptable, please use the Auphonic API instead! The Auphonic Leveler Batch Processor is a batch audio file processor and includes all our (Singletrack) Audio Post Production Algorithms. It can process multiple productions at once. The Auphonic Multitrack Processor includes our Multitrack Post Production Algorithms and requires multiple parallel input audio tracks, which will be analyzed and processed individually as well as combined to create one final mixdown. This program is built for advanced users and for multitrack productions only (you need at least 2 input tracks/files) - please read our Multitrack Best Practice."
