["https://auphonic.com/help/web/services.html"]
title = "External Services — Auphonic Help 2024 documentation"
full_description = "External Services Use external services to Copy Files from and to a server automatically (no manual up- and downloading is necessary), to create Watch Folders, to publish your result files to Podcasting/Audio/Video Hosting Services and to connect to external Speech Recognition Engines. Further integrations are available through the Auphonic API and our Zapier Interface. Note If you run/use a podcast hosting (or similar) service, it is possible to integrate your service as publishing target within Auphonic! Click here to create a new external service in our web system: https://auphonic.com/engine/services/ List of all supported external services: Incoming/Outgoing File Transfers FTP SFTP Dropbox Google Drive OneDrive Amazon S3 Generic S3 and Google Cloud Storage Archive.org WebDAV Zapier Podcasting/Audio/Video Services YouTube Libsyn Spreaker Blubrry Facebook SoundCloud LetsCast.fm Podlove Buzzsprout PodBean Captivate Podcaster.de SquadCast Hindenburg Adobe Automatic Speech Recognition Services Auphonic Whisper ASR Google Speech API Wit.ai Speech Recognition Amazon Transcribe Speechmatics Incoming/Outgoing File Transfers FTP Connect to any FTP or FTPS server to import/export files to/from Auphonic. Account NameEnter any name you prefer to remember this account when creating a production/preset. Server HostnameHostname of the server (without protocol), e.g. auphonic.com, my-server.jp, etc. FTP PortThe default FTP port is 21. Directory on ServerExact path on your server, where files should be copied. Server UsernameYour FTP server username. Leave empty for anonymous login! Server PasswordYour FTP server password. Leave empty for anonymous login! HTTP Base URLBase URL on your web server, where files will be downloadable. Used to construct full URLs of all your results files! SFTP Connect to any SFTP server to import/export audio and video files to/from Auphonic. If you don’t want to use a password, we automatically generate a public key for SFTP transfers (optional). Copy the public key to your SFTP server and add it to the file ~/.ssh/authorized_keys. For more information about public key authentication see Getting started with SSH. Account NameEnter any name you prefer to remember this account when creating a production/preset. Server HostnameHostname of the server (without protocol), e.g. auphonic.com, my-server.jp, etc. SFTP PortThe default SFTP port is 22. Directory on ServerExact path on your server, where files should be copied. Server UsernameYour SFTP server username. SFTP Server PasswordNo password is required for Public Key Authentication! HTTP Base URLBase URL on your web server, where files will be downloadable. Used to construct full URLs of all your results files! File PermissionsUnix style permissions for output files in octal notation, see Unix Permissions Calculator! Leave empty for default values of your server. Dropbox Connect to a Dropbox account to import/export audio and video files to/from Auphonic. Input files must be in the directory /Apps/auphonic/ of your Dropbox, result files will be written to /Apps/auphonic/auphonic-results. NOTE: Auphonic has access rights only inside the directory /Apps/auphonic and cannot see all other files of your Dropbox! Google Drive You can use Google Drive to import/export audio and video files to/from Auphonic. Input files must be uploaded via Google Picker within the Production Form. Result files will be written to auphonic/auphonic-results. NOTE: Google provides two different storage services: Google Cloud Storage and Google Drive. If you want to use Google Cloud Storage, please use Generic S3 and Google Cloud Storage. OneDrive Connect to a Microsoft OneDrive Account to import/export audio and video files to/from Auphonic. Input files must be in the directory /Apps/Auphonic/ of your OneDrive and result files will be written to /Apps/Auphonic/auphonic-results. NOTE: For personal OneDrive accounts, Auphonic has access rights only inside the directory /Apps/Auphonic and cannot see any other files of your OneDrive account! However, unfortunately that’s not possible for OneDrive business accounts. Here Microsoft requires that we use Files.ReadWrite.All permissions (have full access to all files the user can access) - see Permissions for OneDrive API. Amazon S3 Amazon S3 is the famous cloud storage by Amazon. You can use any existing Amazon S3 Bucket to import/export audio and video files to/from Auphonic. For more information see our Amazon S3 blog post. NOTE: If you need a generic (non-Amazon) S3 storage, please use our Generic S3 Storage Service instead! Account NameEnter any name you prefer to remember this account when creating a production/preset. S3 Bucket NameS3 buckets must be already created, e.g. with the S3 Management Console. Amazon S3 Access KeyFind and create your Access Key at AWS credentials page. Amazon S3 Secret KeyGet your Secret Access Key at AWS credentials page. S3 Key PrefixPrefix for all files which are exported from Auphonic to S3. Use e.g. my-prefix/ to simulate folders. Access Control (ACL)Permissions for files exported from Auphonic to S3, see Canned ACL Overview for details. Generic S3 and Google Cloud Storage Use any S3-compatible storage providers like Google Cloud Storage, DreamHost and many more to import/export audio and video files to/from Auphonic. For more information see Google Cloud Storage or Generic S3 Storage setup. NOTE: If you want Amazon S3, please use our Amazon S3 Service instead! Account NameEnter any name you prefer to remember this account when creating a production/preset. S3 Storage Endpoint (Base URL)Endpoint of the S3 service API, e.g. for Google it’s storage.googleapis.com. For detailed information, please see S3 storage blog post. S3 Bucket NameS3 buckets must be already created, for Google use the Cloud Storage Browser. S3 Access KeyFor Google, get/create your Access Key in tab Interoperability here. S3 Secret KeyFor Google, get/create your Secret in tab Interoperability here. S3 Key PrefixPrefix for all files which are exported from Auphonic to S3. Use e.g. my-prefix/ to simulate folders. Access Control (ACL)Permissions for files exported from Auphonic to S3, see Canned ACL Overview for details. Archive.org Transfer your result files to the Internet Archive (archive.org) for free audio/video file hosting. Archive.org automatically creates an HTML page from the metadata of your Auphonic production, including all output file formats. For more details see our Archive.org blog post. Please create an Archive.org Account and API key first! Account NameEnter any name you prefer to remember this account when creating a production/preset. Archive.org Access KeyCreate your Access Key at the Archive.org API page. Archive.org Secret KeyGet your Secret Key at the Archive.org API page. WebDAV Connect to any WebDAV server (Nextcloud, ownCloud, and many more) to import/export files to/from Auphonic. For detailed information see our WebDAV blog post. Account NameEnter any name you prefer to remember this account when creating a production/preset. WebDAV Server URLShould include the protocol (http or https), hostname, path and port (optional), e.g. https://dav.example.at, http://myserver.com/foo/, https://auphonic.com:8008/dav HTTP Base URLBase URL on your web server, where files will be downloadable. Used to construct full URLs of all your results files! Zapier Zapier is a tool that allows users to connect APIs and services without any coding: Automate podcast workflows, use watch folders for Auphonic processing and connect to hundreds of web services on Zapier in just a few clicks. Zapier offers a free tier of 100 tasks per month, which should be enough for most podcasters. Documentation of the Auphonic Zapier Integration: Zapier Integration Help Podcasting/Audio/Video Services YouTube With Auphonic, you can export all your processed audio or video files to YouTube. If your production is audio-only, we automatically generate a video track from your Cover Image (and Chapter Images)! Auphonic metadata fields are also exported to YouTube: the Auphonic Title becomes the YouTube Title Summary the YouTube Description a Cover Image will be used as the YouTube video Thumbnail Tags are exported to YouTube Keywords Chapter Marks will be shown in the YouTube timeline and as clickable links in the YouTube description If you want to add an Audiogram (audio waveform visualization) to your YouTube video, please add an Audiogram Output File to your production - see also Auphonic Audiogram Generator: Waveform Videos for Podcasts and Audio Files. For more information about our YouTube export read the blog post YouTube Export. Libsyn Libsyn (Liberated Syndication) is a U.S. podcast hosting company which supports automatic RSS feed generation, web pages and more. It offers a monthly subscription model, see features and pricing. You must setup a Libsyn FTP password first, please see Uploading using FTP. The Show slug is displayed as Show ID under Settings -> Podcast (click the FTP Settings option). Auphonic always exports an MP3 audio format to libsyn, see Auphonic to Libsyn details. The title, summary and cover image can be used in libsyn’s RSS feed. Show SlugA unique alpha numeric identifier for the show. This must be configured in your libsyn show settings! The Show slug is displayed as Show ID under Settings -> Podcast (click the FTP Settings option). Libsyn UsernameMust be your full email address, as registered at Libsyn! Libsyn FTP PasswordYour Libsyn FTP Password (this is not your Libsyn account password). Please setup your Libsyn FTP password first! Server DirectoryThe server directory setting defines your publishing workflow: Quickcast: The quickcast folder is used to immediately publish content to all destinations setup on your show. This feature works by pulling out the title, description and artwork for the episode from the media file (if present). Public: The public folder is used to publish media files as ‘file for download only’. These are media files that are made publicly accessible but are not published to any destinations. Dropbox: The dropbox folder is used to upload media files but not have them be published immediately. Files uploaded here you can find in the Libsyn Dashboard under: Content -> FTP/Unreleased. To publish a file from there create your new episode and select the ‘ADD MEDIA’ button. Then select the ‘FTP/Unreleased’ option and choose your file. Then continue to publish as you normally would. The dropbox folder can also be used to replace existing media files. If you have an existing media file and you upload a new version of it (with an identical file name) to the dropbox folder your new version will automatically replace the existing one. For more details, please see Uploading using FTP. Spreaker Spreaker is a podcast hosting company which offers audio file hosting with web page, RSS feed generation for multiple shows, chapter marks, advanced audio analytics, embeddable audio player widget, live streaming and more. Auphonic fully supports the export and import to/from Spreaker including all metadata: We automatically encode an optimal output file format for Spreaker (MP3, 128kbps) and all metadata tags entered in our interface, including Chapter Marks, are also available in the file hosted at the Spreaker servers. Additionally, all Metadata, Chapter Marks (including URLs and Images) and the Cover Image is used to create a web page for your episode at spreaker.com. For more information see our blog post Connecting Spreaker and Auphonic. Blubrry Blubrry Media Hosting is a U.S. podcast hosting company which provides download statistics, generates an RSS feed and a web page for your episodes. For more information see our Blubrry blog post. Blubrry Program KeywordThe unique identifier for your show as displayed in your Blubrry settings: at http://publish.blubrry.com/settings/general.php, see Listing Keyword Blubrry UsernameMust be your full email address, as registered at Blubrry! Facebook Facebook is not only a social media giant, the company also provides valuable tools for broadcasting. The following workflows are possible with Facebook and Auphonic: Use Facebook for live streaming, then import, process and distribute the audio/video with Auphonic. Post your Auphonic audio or video productions directly to the news feed of your Facebook Page. Please note that Facebook no longer allows us to export videos directly to your user timeline! Use Facebook as a general media hosting service and share the link or embed the audio/video on any webpage (also visible to non-Facebook users). Auphonic can import audio or video files from your Facebook user accounts and pages, as well as export processed files to your Facebook pages. Metadata fields (Title, Description, Cover Image) and Speech Recognition results will be exported/imported as well. If your production is audio-only, we automatically generate a video track from your Cover Image (and Chapter Images). Add an Audiogram Output File if you want to add an Audiogram (audio waveform visualization) to your Facebook video. In case you don’t see all your Facebook pages in the select box, please update the Facebook permissions for the Auphonic integration accordingly. For more details and examples please see the Facebook Export blog post. Choose Facebook User or PageSelect your Facebook User or any Page connected to your account. It is always possible to remove or edit the connection in your Facebook Settings (Tab Apps). SoundCloud SoundCloud is one of the biggest audio hosting companies and also offers a podcasting program including an RSS feed. Our SoundCloud integration enables the export and import of audio files to and from SoundCloud. Auphonic metadata will be mapped to SoundCloud metadata: Auphonic Title to SoundCloud Title Summary to SoundCloud Description Cover Image to SoundCloud Image Genre to SoundCloud Genre Tags to SoundCloud Tags Auphonic Chapter Marks become SoundCloud Comments, directly visible in the timeline of the SoundCloud player! License: a Creative Commons License is automatically exported to the correct SoundCloud License For more information see our blog post SoundCloud Integration. LetsCast.fm LetsCast.fm is a podcasting hosting company based in Germany. Besides an Auphonic integration, the service offers unlimited podcasts and episodes in each plan. The feature set also includes your own podcast website, a modern web player and Dynamic Ad Insertion. You can connect your Auphonic account to LetsCast.fm to export processed podcasts from Auphonic to LetsCast.fm. Metadata fields, the cover image, and chapter marks (including chapter URLs and images) will be imported by LetsCast.fm automatically. Podlove The Podlove Podcast Publisher is an open source Wordpress plugin. It offers powerful analytics, the Podlove Subscribe Button, custom templating, automatic checks that everything runs smoothly and much more. The Podlove Publisher "
