["https://auphonic.com/help/api/details.html"]
title = "JSON API: Details of Productions and Presets — Auphonic Help 2024 documentation"
full_description = '''JSON API: Details of Productions and Presets The basic syntax for creating and changing productions and presets is very similar, only the URLs are different. Create a production/preset:https://auphonic.com/api/{presets|productions}.json This creates a new Production or Preset, where {presets|productions} should be either presets or productions. All details can be set in JSON format, see Set all Details in one Request for an example. Upload local files:https://auphonic.com/api/{preset|production}/{uuid}/upload.json Local file uploads must be handled in an additional request (encoded in multipart/form-data, not JSON). Set the field image to add a cover image and set input_file to upload an audio or video file (in productions only). See Image and Audio Upload Example. Start a production:https://auphonic.com/api/production/{uuid}/start.json This starts the audio post production of the Production with the given UUID. You can also start a production by adding "action": "start" as a parameter to the production create/change request (see example Upload Files with HTTP). Publish a production to Outgoing File Transfers:https://auphonic.com/api/production/{uuid}/publish.json Publishes the audio post production of the Production with the given UUID to all Outgoing File Transfers. This will only take effect if the production contains Outgoing File Transfers and in_review is true. Change a production/preset:https://auphonic.com/api/{preset|production}/{uuid}.json Here {uuid} is the UUID of the preset/production you want to change. All sub-dictionaries can be changed in the same format as in the Set all Details in one Request example. See also Update a Production or Preset and Reset Data. For the creation of multitrack productions and presets, see Multitrack Productions and Presets. Create a Production with Detailed Audio Metadata Audio Metadata can be set using the metadata parameter: curl -X POST -H "Content-Type: application/json" \ https://auphonic.com/api/productions.json \ -H "Authorization: bearer {api_key}" \ -d '{ "metadata": { "title": "Production Title", "artist": "The Artist", "album": "Our Album", "track": 1, "subtitle": "Our subtitle", "append_chapters": true, "summary": "Our very long summary.", "genre": "Podcast", "year": 2012, "publisher": "that's me", "url": "https://auphonic.com", "license": "Creative Commons Attribution 3.0 Austria", "license_url": "http://creativecommons.org/licenses/by/3.0/at/", "tags": ["podcast", "auphonic api", "metadata"], "location": { "latitude": "47.070", "longitude": "15.439" } } }' Note Metadata tags, chapters and cover images from input files are imported automatically if they are not set here! Hint Metadata fields can make use of Variables and Placeholders. The response contains the UUID of the created production/preset: { "status_code": 200, ... "data": { ... "uuid": "KKw7AxpLrDBQKLVnQCBtCh", ... } } Now let’s add an input file and a cover image to the newly created production: curl -X POST https://auphonic.com/api/production/KKw7AxpLrDBQKLVnQCBtCh/upload.json \ -H "Authorization: bearer {api_key}" \ -F "input_file=@/home/user/your_audio_file.mp3" \ -F "image=@/home/user/your_cover_image.jpeg" You may also add a cover image by just referencing a valid picture URL: curl -X POST -H "Content-Type: application/json" https://auphonic.com/api/production/KKw7AxpLrDBQKLVnQCBtCh.json \ -H "Authorization: bearer {api_key}" \ -d '{"image": "https://auphonic.com/static/images/logo.png"}' Output Files Add Output Files to an existing production: curl -H "Content-Type: application/json" -X POST \ https://auphonic.com/api/production/{uuid}.json \ -H "Authorization: bearer {api_key}" \ -d '{ "output_files": [ {"format":"mp3", "bitrate":"96"}, {"format":"aac", "bitrate":"64"}, {"format":"flac"} ] }' The following Output Files are available (among others): mp3 mp3-vbr: MP3 with variable bitrate encoding vorbis: Ogg Vorbis opus: Opus Codec aac (MP4/M4A) flac alac (MP4/M4A) wav: uncompressed WAV 16-bit PCM wav-24bit: uncompressed WAV 24-bit PCM video: Video Output, format is the same as the input video audiogram: Audiogram (Waveform Video) output file input: unprocessed original input audio/video file, same format as input descr: Production Description in xml/json/yaml stats: Audio Processing Statistics in txt/json/yaml chaps: Chapter Marks as txt file (as used by mp4chaps) psc: Chapter Marks in Podlove Simple Chapters format cut-list: Filler and Silence Cuts in a list format image: a copy of the Cover Image waveform: Waveform Image of output audio file wavedat: Waveform Data File To query all available formats, bitrates and filename endings, use the following request: curl https://auphonic.com/api/info/output_files.json which returns: { "status_code": 200, ... "data": { "mp3": { "type": "lossy", "bitrates": ["32", "40", "48", ... ], "bitrate_strings": ["32 kbps (~14MB/h)", "40 kbps (~18MB/h)" , ...], "display_name": "MP3", "default_bitrate": "96", "endings": ["mp3"] }, "opus": { "type": "lossy", "bitrates": ["6", "12", "16", ...], "bitrate_strings": ["~6 kbps (~3MB/h)", "~12 kbps (~5MB/h)", ...], "display_name": "Opus", "default_bitrate": "48", "endings": ["opus"], }, "aac": { "type": "lossy", "bitrates": ["24", "32", "40", "48", ... ], "bitrate_strings": ["24 kbps, HE AAC (~11MB/h)", "32 kbps, HE AAC (~14MB/h)", ...], "display_name": "AAC (M4A, MP4, M4B)", "default_bitrate": "64", "endings": ["mp4", "m4a", "m4b"] }, "vorbis": { "type": "lossy", "bitrates": ["32", "40", "48", ... ], "bitrate_strings": ["~32 kbps (~14MB/h)", "~40 kbps (~18MB/h)" , ...], "display_name": "Ogg Vorbis", "default_bitrate": "80", "endings": ["ogg", "oga"] }, "flac": { "type": "lossless", "bitrate_strings": ["optimal (stereo ~125MB/h, mono ~62MB/h)"], "display_name": "FLAC", "endings": ["flac"] }, "alac": { "type": "lossless", "bitrate_strings": ["optimal (stereo ~130MB/h, mono ~65MB/h)"], "display_name": "ALAC (M4A, MP4)", "endings": ["mp4", "m4a"] }, "mp3-vbr": { "type": "lossy", "bitrates": ["32", "40", "48", ... ], "bitrate_strings": ["~32 kbps (~14MB/h)", "~40 kbps (~18MB/h)" , ...], "display_name": "MP3 Variable Bitrate", "default_bitrate": "96", "endings": ["mp3"] } "wav": { "type": "lossless", "bitrate_strings": ["optimal (stereo ~635MB/h, mono ~318MB/h)"], "display_name": "WAV 16-bit PCM", "endings": ["wav"] } "video": { "display_name": "Video (same format as input)", "bitrate_strings": ["same bitrate as input"], "type": "video" }, "chaps": { "type": "description", "display_name": "Chapters File", "endings": ["chapters.txt"] }, "psc": { "type": "description", "display_name": "Podlove Simple Chapters", "endings": ["psc", "xml"] }, "image": { "type": "description", "display_name": "Cover Image" }, "stats": { "display_name": "Audio Processing Statistics", "type": "description", "endings": ["txt", "json", "yaml"] }, ... } } If no bitrate is specified in lossy audio formats, the default_bitrate is taken - type can be lossy for lossy audio files, lossless for lossless audio files, video for video output files and description for data about a production. If you want to create a Mono Mixdown or use the Split On Chapters feature, set a flag in JSON: [ {"format": "mp3", "bitrate": "96"}, {"format": "wav", "mono_mixdown": true}, {"format": "vorbis","bitrate": "64", "split_on_chapters": true, "mono_mixdown": true}, {"format": "video", "mono_mixdown": true} ] For further details, please see Output Files. Setting Filenames It’s possible to control how output filenames are constructed: {"format":"mp3", "bitrate":"48", "filename":"MyFilename.mp3", "mono_mixdown":true}Directly generates the file MyFilename.mp3. Must have a correct ending! {"format":"aac", "bitrate":"64", "ending":"mp4"}This will take the input file basename and adds mp4 as ending, e.g. original-filename.mp4. {"format":"aac", "bitrate":"32", "suffix":"-small", "ending":"m4a"}Takes the input file basename and adds suffix and ending, e.g. original-filename-small.m4a. A filename in auphonic consists of an output_basename, suffix and an ending. The output basename can be set using the URL https://auphonic.com/api/productions.json or https://auphonic.com/api/production/{uuid}.json: curl -X POST -H "Content-Type: application/json" https://auphonic.com/api/productions.json \ -H "Authorization: bearer {api_key}" \ -d '{ ... "output_basename": "production-filename", "output_files": [ {"format":"aac", "bitrate":"32", "suffix":"-small", "ending":"m4a"} {"format":"aac", "bitrate":"128", "ending":"m4a"} ] ... }' This will create the output files production-filename-small.m4a and production-filename.m4a. It’s also possible to set the full output filename for an output format. The full filename has priority over the single components like suffix, basename, etc.: curl -X POST -H "Content-Type: application/json" \ https://auphonic.com/api/production/KKw7AxpLrDBQKLVnQCBtCh.json \ -H "Authorization: bearer {api_key}" \ -d '{ ... "output_basename": "production-filename", "output_files": [ {"format":"mp3", "bitrate":"48", "filename":"MyFilename1.mp3", "suffix": "-small"} {"format":"aac", "bitrate":"96", "filename":"MyFilename2.mp4", "ending": "m4a"} ] ... }' This will create the output files MyFilename1.mp3 and MyFilename2.mp4. Cut Lists With the Cut Fillers and the Cut Silence algorithms you can automatically cut your audio file. Depending on whether you activate any cutting algorithm you can export the cuts in list form. This allows you to check if the cuts work for you. See Export Cut Lists for more details and all available cut list formats. In the API, you can select a specific cut list format using the ending field. In this example, we select Reaper regions and the DaVinci Resolve CMX3600 EDL format as the output formats: -d '{ ... "output_files": [ {"format": "cut-list", "ending": "ReaperRegions.csv"}, {"format": "cut-list", "ending": "DaVinciResolve.edl"} ] ... }' Outgoing File Transfers Similar to Upload Files with External Services (SFTP/FTP/Dropbox/etc.), External Services can be referenced for outgoing file transfers: curl -H "Content-Type: application/json" -X POST \ https://auphonic.com/api/production/{uuid}.json \ -H "Authorization: bearer {api_key}" \ -d '{ "outgoing_services": [ {"uuid": "{service1_uuid}"}, {"uuid": "{service2_uuid}"}, ... ], "review_before_publishing": false }' where {service1_uuid}, {service2_uuid}, etc. is the UUID of the external service you want to add for outgoing file transfers. review_before_publishing: true or false (Default: false) - Require a review before publishing results to services. If you set review_before_publishing to true and there are any defined outgoing_services, this will set in_review to true. After the production is done, you are able to Publish the production to Outgoing File Transfers if you are satisfied with the results. For some outgoing file transfer services, additional parameters are available: Captivate: draft: true or false (Default: false) type: “normal”, “trailer” or “bonus” – episode type as documented by Apple Facebook: distribution: everywhere (Post to News Feed: exported video is posted directly to your timeline), no_story (Exclude from News Feed: not posted to your timeline, but visible in the videos tab) or secret (only you can see the video) embeddable: true or false PodBean: draft: true or false type: “public”, “premium” or “private” – not all of these are allowed for every Podcast and the exact set allowed values depends on your subscription model and settings on PodBean Note: There is currently no way to query the exact set of allowed values using the Auphonic API, please contact support if this is something you need! SoundCloud: downloadable: true or false sharing: public or private track_type: as returned by Query Service Types (same values as documented in the SoundCloud API Reference) Spreaker: downloadable: true or false sharing: public or private show: one of your available shows on Spreaker, as returned by Query Service Types YouTube: privacy: public or private category: YouTube category, as returned by Query Service Types For example, an outgoing file transfer to SoundCloud: curl -H "Content-Type: application/json" -X POST \ https://auphonic.com/api/production/{uuid}.json \ -H "Authorization: bearer {api_key}" \ -d '{ "outgoing_services": [ {"uuid": "gxr975w3MzRS9ywnWsu6tL", "downloadable": true, "sharing": "public", "track_type": "podcast"} ] }' They support the same values as documented in the SoundCloud API Reference. It’s also possible to query all registered External Services of a user: curl https://auphonic.com/api/services.json -H "Authorization: bearer {api_key}" which returns: { "status_code": 200, ... "data": [ { "display_name": "Georg Holzmann", "type": "dropbox", "uuid": "UC6aoChNZNt7KYZNxJTgUn", "email": "georg@myserver.at", "incoming": true, "outgoing": true }, { "display_name": "my soundcloud account", "type": "soundcloud", "uuid": "Asu5PxueRRxtqfZhe7zdia", "incoming": true, "outgoing": true }, { "display_name": "my youtube vids", "type": "youtube", "uuid": "esSfxaPe6U2bNX2K9GGMeT", "incoming": false, "outgoing": true }, { "display_name": "Auphonic Spreaker Account", "type": "spreaker", "uuid": "UL7MZvjR3tntbCvbxu5Jsi", "outgoing": true, "incoming": true }, { "display_name": "my ftp server", "path": "mirror/", "host": "ftp.myserver.at", "type": "ftp", "uuid": "r6MSycBwyeWFAJYqUKtGeX", "port": 21, "base_url": "", "permissions": "", "incoming": true, "outgoing": true }, { "display_name": "myserver.at SFTP" "path": "/home/user/path", "host": "myserver.at", "type": "sftp", "uuid": "jm7yLuiyGwQe27gQUz869K", "port": 22, "base_url": "http://myserver.at/audiofiles/", "permissions": "664", "incoming": true, "outgoing": true }, { "outgoing": true, "display_name": "mypodcast /quickcast", "uuid": "h9KHD96Mks5JyfFuXYPXHk", "libsyn_show_slug": "mypodcast", "base_url": "http://traffic.libsyn.com/mypodcast/", "port": 21, "host": "ftp-server.libsyn.com", "path": "/mypodcast/quickcast", "incoming": false, "type": "libsyn", "libsyn_directory": "quickcast" }, { "outgoing": true, "display_name": "auphonic bucket 1", "uuid": "gRNT7i5NVxPiGCG8TmhpgF", "type": "amazons3", "bucket": "auphonic1", "incoming": true, "canned_acl": "public-read", "key_prefix": "my-podcast/" }, { "type": "archiveorg", "outgoing": true, "display_name": "archive", "uuid": "PQaZpL58TqvK9NvDnHu5Hj", "incoming": false }, { "outgoing": true, "display_name": "My WebDAV Server", "uuid": "9k27BXTmvsKCdeoyXkHjVB", "url": "https://mywebdav.com/myfiles/", "base_url": "http://files.mywebdav.com/myfiles/", "incoming": true, "type": "webdav" }, { "outgoing": true, "display_name": "Auphonic Blubrry Account", "uuid": "xJTES9PCAu3uvLE3gwSjAN", "program_keyword": "auphonic_blubrry_account", "base_url": "http://content.blubrry.com/auphonic_blubrry_account", "incoming": false, "type": "blubrry" }, { "uuid": "mggo5JuLNLhVBkSpEA4tsg", "display_name": "Auphonic PodBean Account", "type": "oauthhoster.podbean", "incoming": false, "outgoing": true'''
