["https://auphonic.com/features/multitrack"]
title = "Features"
description = "The automatic audio post production webservice."
full_description = "Please click inside the waveform to zoom and scroll through the audio - each example is divided into multiple segments and annotated with details about the algorithms. We recommend listening with headphones so you can hear all the details! The first audio example consists of three speech and one music track from Operation Planlos. It demonstrates how the Multitrack Adaptive Leveler adjusts the loudness between speakers and music segments. Disturbing noises from inactive tracks are removed by the Adaptive Noise Gate. In example 2, recorded in a very reverberant room at a conference by Das Sendezentrum, it is possible to hear reverb and the spill (crosstalk) between the three active microphones. The examples show how the Crossgate and our Dynamic Denoiser are able to remove ambience and reverb. Example 3 is from the from Bits Of Berlin podcast and contains four tracks - one music, one male speech and two female speech tracks and demonstrates the combination of all algorithms. The first segment in the music track (the intro) is classified as foreground, the second segment (at the end) as background music and therefore automatically gets a lower level during the mixdown. Now an audio example from the Einfacheinmal.de Podcast with two female and one male speech track. The Adaptive Noise Gate is able to remove most of the background noises from other tracks, the rest is eliminated by our Noise Reduction algorithms. Example 5, a constructed excerpt from NSFW084, illustrates the parameter Fore/Background and our Automatic Ducking feature. It includes two male speech and one music track. The default setting of parameter Fore/Background is Auto, which is shown in example 3."
