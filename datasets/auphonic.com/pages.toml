["https://auphonic.com/features"]
title = "Features"
description = "The automatic audio post production webservice."
full_description = 'The Adaptive Leveler corrects level differences between speakers, between music and speech and applies dynamic range compression to achieve a balanced overall loudness. We use classifiers to carefully process music segments and prevent amplification of unwanted noises. Based on over five years of training with audio files from our web service, the algorithm keeps learning and adapting to new data every day. It is most suitable for programs, where dialog or speech is the most prominent content such as podcasts, radio, broadcast, lecture and conference recordings, film and videos, screencasts etc. Define whether Auphonic should remove only static or also fast-changing noises and if we should keep or eliminate music. Do you want to eliminate any ambient sounds from your audio to get a clean speech file? Or do you just want to get rid of static background noises while keeping the singing bird outside your window on record? With our advanced AI denoising algorithms, you have the choice! Our classifiers also detect segments containing music or breathings, so you can decide if music is part of the content and should remain in your production or if you want to completely isolate the spoken content and remove all breathings and mouth noises. For even greater speech intelligibility control, it is possible to separately adjust the amount of noise, reverb or breath reduction to strike the perfect balance between clarity and ambiance. Our AutoEQ algorithm automatically analyzes and optimizes the frequency spectrum of a voice recording, removing sibilance (De-Esser) and creating a clear, warm, and pleasant sound. The equalization of multi-speaker audio can be complex and time-consuming, as each voice requires its own unique frequency spectrum equalization. Our AutoEQ simplifies this process by creating separate, time-dependent EQ profiles for each speaker, ensuring a consistent and pleasant sound output despite any changes in the voices during the recording. Automatically cut silent segments, pauses, and filler words like "ah", "uhm", "mh", or "ähm" in multiple languages.'
