full_description = "Introducing Auphonic Team Accounts Written by Manuel Weilharter, Christoph Grasser on Aug. 14, 2024 The new Auphonic team accounts streamline billing for companies, teams, or groups and are available to business users. A team account's owner can invite team members and admins, all of whom share the team account's credits for their productions. The team account feature only impacts billing. Team members cannot access each other’s productions, presets, etc. If you're interested in switching to a team account, please contact us! What are Auphonic Teams? A team consists of an Owner with Members and optional Admins. The Owner and Admins can add and remove team members as well as change their ... Continue reading → Discussions : No comments yet. Be first to comment! Speaker Identification in Single Track Productions Written by Lukas Timpl, Christoph Grasser on Aug. 5, 2024 We're excited to announce the release of our new speaker diarization feature! With our latest update, we can now detect individual speakers within a single audio recording, allowing users to see precisely who said what and when. This information is then reflected in the transcript. Previously, this feature was only available in Multitrack Productions. What is Speaker Diarization? Speaker diarization is the process of identifying different speakers and segmenting an audio file accordingly, making it easier to accurately determine who said what. This is particularly useful in scenarios like meeting recordings, interviews, and podcasts involving ... Continue reading → Discussions : No comments yet. Be first to comment! New Auphonic Transcript Editor Written by Manuel Weilharter, Christoph Grasser on March 21, 2024 We're excited to roll out an upgraded version of our Transcript Editor, focusing on enhancing your transcription workflow and making it more intuitive, especially for mobile users. This overhaul introduces several key improvements and features designed to streamline the transcription process. Click here for a Live Demo What's new? Line by Line Editing Your transcript is being rendered line by line. This allows for precise editing of every single timestamp. Depending on the speech recognition engine editing can be done on word or phrase level. For optimal results, we suggest utilizing our Auphonic Whisper ASR engine. A paragraph ... Continue reading → Discussions : No comments yet. Be first to comment!"
