["https://auphonic.com/help/api/index.html"]
title = "Auphonic API — Auphonic Help 2024 documentation"
full_description = "Auphonic API Auphonic Simple API JSON API: Start Productions using Presets JSON API: Details of Productions and Presets Query Data Update and Delete existing Resources Multitrack Productions and Presets Authentication Webhooks External Service Integration using the Auphonic API API Examples The Auphonic REST API allows you to integrate our complete services and algorithms into your scripts, external workflows and third-party applications. If you run/use a podcast hosting (or similar) service, it is also possible to integrate your service as publishing target within Auphonic. Note Also take a look at Watch Folders and our Zapier Interface, which helps in automating podcast workflows and integrates hundreds of web services without any coding. Our API comes in two flavours: A Simple API for quick shell scripts and batch processing of multiple files. A complete JSON API for full control. The Simple API can upload files, set metadata, save and start productions in a single request by referencing an existing Preset, without storing an internal state. This makes it ideal for quick shell scripts and batch processing of multiple files. If you want to have full control, like detailed file formats or outgoing services without the use of predefined presets, you should use our JSON API. The JSON-based API might require multiple requests and parsing of the JSON response (when uploading files and sending JSON data). Please see JSON API: Start Productions using Presets and JSON API: Details of Productions and Presets. The Auphonic APIs can be used by any tool or programming language which is able to perform HTTP requests. All examples in this documentation utilize the command line tool curl for demonstration purpose. Resources (presets, productions, services, etc.) are always referenced using an UUID, which is a unique string of 22 characters out of [a-zA-Z0-9]. Authentication is possible with API Key Authentication, HTTP Basic Authentication and OAuth 2.0 Authentication. All documentation examples use API Key Authentication, which is our recommended method for accessing your own resources. Warning Third party applications for multiple Auphonic user accounts should use OAuth 2.0 Authentication! If you have any further questions or need a special feature, don’t hesitate to contact us at support@auphonic.com!"
