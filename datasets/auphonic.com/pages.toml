full_description = "Opus, the revolutionary open audio codec for podcasts and internet audio Written by Florian Hollerweger on Sept. 26, 2012 We are very happy that Opus, an exciting new open audio codec, is now officially standardized by the Internet Engineering Task Force (IETF). Opus is particularly interesting for podcasts, radio books and internet audio in general due to its suitability for both, music and speech, and its outstanding sound quality at also very low bitrates. In this article, we will listen to some examples of the Opus codec in action and have a closer look at the codec and how audio producers can benefit from it. Why Opus? Opus is a lossy audio codec that has ... Continue reading → Discussions : No comments yet. Be first to comment! Automatic Content Deployment: Video, YouTube and SoundCloud Integration Written by Georg Holzmann on Sept. 4, 2012 This summer, we proudly released three important new features: video support, YouTube export for audio/video and the SoundCloud integration! These features make it possible to use Auphonic for the automatic deployment of podcasts, screencasts, recordings, etc. to multiple platforms - see External Services. The combination of SoundCloud and Auphonic provides a complete package for podcast post production, hosting, RSS feed generation and more. Furthermore, the YouTube export function allows you to increase your audience through YouTube's content discovery mechanism, including listeners that you could not reach through a podcast RSS feed. All file metadata, images and chapter marks ... Continue reading → Discussions : No comments yet. Be first to comment!"
