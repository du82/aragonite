["https://auphonic.com/help/algorithms/speech_recognition.html"]
title = "Automatic Speech Recognition, Shownotes and Chapters — Auphonic Help 2024 documentation"
full_description = "Automatic Speech Recognition, Shownotes and Chapters Auphonic has built a layer on top of Automatic Speech Recognition Services: Our classifiers generate metadata during the analysis of an audio signal (music segments, silence, multiple speakers, etc.) to divide the audio file into small and meaningful segments, which are then processed by the speech recognition engine. The speech recognition services support multiple languages and return text results for all audio segments. The results from all segments are then combined, and meaningful timestamps, simple punctuation and structuring are added to the resulting text. With enabled Automatic Shownotes and Chapters Feature, you can also get AI-generated summaries, tags and chapters from your audio, that automatically show up in your result files and in your audio files’ metadata. This is especially interesting when used with our Multitrack Algorithms, where all speakers have been recorded on separate tracks: In Multitrack Speech Recognition, all the tracks are processed by the speech recognition service individually, so there is no crosstalk or spill and the recognition is much more accurate, as it is only dealing with one speaker at a time. This also means that we can show individual speaker names in the transcript output file and audio player because we know exactly who is saying what at any given time. Automatic Speech Recognition (ASR) is most useful to make audio searchable: Although automatically generated transcripts won’t be perfect and might be difficult to read (spoken text is very different from written text), they are very valuable if you try to find a specific topic within a one hour audio file or the exact time of a quote in an audio archive. We also include a complete Transcript Editor directly in our HTML output file, which displays word confidence values to instantly see which sections should be checked manually, supports direct audio playback, HTML/PDF/WebVTT export and allows you to share the editor with someone else for further editing. Our WebVTT-based audio player with search in speech recognition transcripts and exact speaker names of a Multitrack Production. How to use Speech Recognition within Auphonic To activate speech recognition within Auphonic, you can either select our self-hosted Auphonic Whisper ASR service or one of the integrated external services in the section Speech Recognition and Automatic Shownotes when creating a new Production or Preset. If you want to use an external service, you first have to connect your Auphonic account to an external speech recognition service at the External Services page. This connection process is very different depending on the speech recognition provider, therefore please visit our step-by-step tutorials. Once that is done, you will have the option to choose whichever service you signed up for. For our self-hosted service, you can skip the connection process and directly select Auphonic Whisper ASR as service: The speech recognition transcripts will be combined with our other Audio Algorithms and generate different Output Formats, depending on your selections. Automatic Shownotes and Chapters With this feature you can fully automate the time-consuming process of summarizing and structuring the content of your recording to find useful positions for chapter marks and to create shownotes. The autogenerated data is also stored in the metadata of your recording. Shownotes usually contain short summaries of the main topics of your episode, links and other information, while inserted chapter marks allow you to timestamp sections with different topics of a podcast or video. They make your content more accessible and user-friendly, enabeling listeners to quickly navigate to specific sections of the episode or find a previous episode to brush up on a particular topic. Besides the obvious use of creating shownotes and chapters for podcasts, you can also use this feature to easily generate an abstract of your lecture recording, take the summary of your show as the starting point for a social media post, or choose your favorite chapter title as the podcast name. How does it work? When the Automatic Shownotes and Chapters feature is selected, the first step is speech transcription by either our internal Auphonic Whisper ASR or any integrated External ASR Service of your choice. Some open source tools and ChatGPT will then summarize the ASR resulting text in different levels of detail, analyze the content to identify sections with the different topics discussed, and finally complete each section with timestamps for easy navigation. Beginning with the generation of a Long Summary, the number of characters is further reduced for a Brief Summary and from the brief summary a Subtitle and some Keywords for the main topics are extracted. Depending on the duration of the input audio or video file, the level of detail of the thematic sections is also slightly adjusted, resulting in a reasonable number of chapters for very short 5-minute audio files as well as for long 180-minute audio files. Automatically Generate Data You can automatically generate shownotes and chapters by checking the Automatic Shownotes and Chapters Checkbox in the Auphonic singletrack or multitrack Production Form with any of our ASR Services enabled. Once your production is done, the generated data will show up in your transcript result files and in the Auphonic Transcript Editor above the speech recognition transcript section, like you can see in our Example Production. By clicking on a chapter title in the Chapters section of the transcript editor, you can jump directly to that chapter in your transcript to review and edit that section. Unless you have manually entered content before, the generated data will also be stored in your audio files’ metadata as follows: Generated Long Summary stored in metadata field Summary. Generated Subtitle stored in metadata field Subtitle. Generated Keywords stored in metadata field Tags. Generated Timestamps for thematic sections stored as Start Time of Chapters Marks. Generated Headlines for thematic sections stored as Chapter Title of Chapters Marks. Please note that not all of our supported Output File Formats are designed to use metadata. For details about metadata see our previous blog posts: ID3 Tags Metadata (used in MP3 output files), Vorbis Comment Metadata (used in FLAC, Opus and Ogg Vorbis output files) and MPEG-4 iTunes-style Metadata (used in AAC, M4A/M4B/MP4 and ALAC output files). CustomizationYou can use the field Summary Example to personalize the generated summary. Here, you can paste a summary from one of your existing shownotes, which will be passed to the model as an example so it can match your writing style. Your Summary Example may also include formatting such as Markdown or HTML syntax so the model can match your formatting. Edit Autogenerated Data If you are unhappy with any detail in the generated keywords, summaries or chapters used as metadata, you can return to your production’s status page and click Edit Production under the feedback section. The previously generated metadata will now show up in the production form (as Extended Metadata and Chapter Marks) for you to edit. When you are finished editing, simply rerun the production to update your changes to your audio file’s metadata. Re-running the production will NOT cost you any additional credits on your Auphonic account if you only change the metadata and settings, but do NOT change the inputfile! Manually edited metadata would not be overwritten, however, we do recommend turning off Speech Recognition and Shownote Generation for the second run to save time and avoid additional costs for external ASR services. Of course, you could also use any third-party software of your choice to edit the metadata after downloading. Auphonic Whisper ASR Using OpenAI’s open-source model Whisper, we offer a self-hosted automatic speech recognition (ASR) service. For an overview and comparison to our integrated external ASR services, please see our Services Comparison Table. Most important facts about Auphonic Whisper ASR: Price and Supported languagesWhisper supports transcriptions in about 100 languages, which you can integrate into your Auphonic audio post-production workflow without creating an external account and at no additional cost. Except for strong accents Whisper also provides a reliable language autodetection feature. Timestamps, Confidence Values and PunctuationWhisper returns timestamps and confidence values, that allow you to locate specific phrases in your recording, and combined with our Transcript Editor, you can easily find sections that should be checked manually. ASR Speed and QualityBy using Auphonic Whisper ASR, your data does not have to leave our Auphonic servers for speech recognition processing, which speeds up ASR processing. The quality of Whisper transcripts is absolutely comparable to the “best” services in our comparison table. Besides the fact, that Whisper is integrated in the Auphonic web service per default and you need no external account, causing extra costs, the outstanding feature with Whisper is the automatic language detection. Integrated Speech Recognition Services Besides our self-hosted Auphonic Whisper ASR (automatic speech recognition) service, we also support the following integrated external ASR services: Wit.ai, Google Cloud Speech API, Amazon Transcribe and Speechmatics. For an overview and comparison, please see our Services Comparison Table. Wit.ai Wit.ai, owned by Facebook, provides an online natural language processing platform, which also includes speech recognition. Wit is free, including for commercial use. See FAQ and Terms . It supports many languages, but you have to create a separate Wit.ai service for every language you use! Google Cloud Speech API Google Cloud Speech API is the speech to text engine developed by Google and supports over 100 languages. 60 minutes of audio per month and model are free, for more see Pricing (about $1.5/h for default model). For English (en-US), we use the more expensive Enhanced Model (about $2.2/h for enhanced model), which gives much better results. In your Google Cloud account you can optionally give Google permission to apply Data Logging to reduce your costs to ~$1/h default and ~$1.5/h enhanced model. It is possible to add keywords to improve speech recognition accuracy for specific words and phrases or to add additional words to the vocabulary. For details see Word and Phrase Hints. A great feature of the Google Speech API is the possibility to add keywords (also available in Amazon Transcribe and Speechmatics), which can improve the recognition quality a lot! We automatically send words and phrases from your metadata (title, artist, chapters, track names, tags, etc.) to Google and you can add additional keywords manually (see screenshot above). This provides a context for the recognizer and allows the recognition of nonfamous names (e.g the podcast host) or out-of-vocabulary words. Amazon Transcribe Amazon Transcribe offers accurate transcriptions in many languages at low costs, including keywords, word confidence, timestamps, and punctuation. PricingThe free tier offers 60 minutes of free usage a month for 12 months. After that, it is billed monthly at a rate of $0.0004 per second ($1.44/h). More information is available at Amazon Transcribe Pricing. Custom Vocabulary (Keywords) SupportCustom Vocabulary (called Keywords in Auphonic) gives you the ability to expand and customize the speech recognition vocabulary, specific to your case (i.e. product names, domain-specific terminology, or names of individuals). The same feature is also available in the Google Cloud Speech API and in Speechmatics. Timestamps, Word Confidence, and PunctuationAmazon Transcribe returns a timestamp and confidence value for each word so that you can easily locate the audio in the original recording by searching for the text. It also adds some punctuation, which is combined with our own punctuation and formatting automatically. The high quality, especially in combination with keywords, and low costs of Amazon Transcribe make the service very attractive. However, the processing time of Amazon Transcribe is much slower compared to all our other integrated services! Speechmatics Speechmatics offers accurate transcriptions in many languages including word confidence values, timestamps, punctuation and custom dictionary (called Keywords in Auphonic). Languages and KeywordsSpeechmatics supports all major European, American and some Asiatic languages and takes a global language approach. That means various accents and dialects, like Indian English or Austrian German, are very well recognized even though you cannot explicitly select a specific language region. Also the Custom Dictionary feature (called Keywords in Auphonic), which does further improve the results, is now available in the Speechmatics API. Model AccuracyThere are two levels of accuracy for Speechmatics that you can choose when you create the Service within Auphonic for the first time. The Standard Model works much faster than the Enhanced Model, is lower in costs but still in equal accuracy range as the other services. For the Enhanced Model you have to be more patient, as processing takes nearly as long as with Amazon Transcribe, but the quality of the result is correspondingly high. In terms of punctuation and small details in pronunciation the Enhanced Model of Speechmatics is incomparably good. Note If you want to use both Standard and Enhanced Model of Speechmatics once in a while, you need to create two separate services (one service for each model) in your Auphonic account! Timestamps, Word Confidence, and PunctuationLike Amazon Transcribe, Speechmatics creates timestamps, word confidence values, and punctuation for every single word. PricingSpeechmatics offers 4 hours of free speech recognition per month (2h standard model plus 2h enhanced model). Once you exceed these 4 hours, however, Speechmatics is at similar cost to the Google Cloud Speech API (or lower). Pricing starts at $1.25 per hour of audio for Standard Model up to $1.90/h for Enhanced Model. They offer significant discounts for users requiring higher volumes. If you process a lot of content, you should contact them directly at hello@speechmatics.com and say that you wish to use it with Auphonic. More information is available at Speechmatics Pricing. Services Comparison Table Auphonic Speech Recognition Services Comparison Auphonic Whisper Wit.ai Google Speech API Amazon Transcribe Speechmatics Standard Speechmatics Enhanced Price free, also for commercial free, also for commercial 1+1h free per month (Enhanced + Default Model), then ~$0.96-$2.16/h (depending on user settings) 1h free per month (first 12 months), then ~$1.44/h cheaper for high volumes 2h free per month, then ~$1.25/h, much cheaper for high volumes 2h free per "
