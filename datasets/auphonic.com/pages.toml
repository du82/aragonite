["https://auphonic.com/pricing"]
title = "Pricing"
description = "The automatic audio post production webservice."
full_description = "Auphonic is free for 2 hours of processed audio per month. Need more? Add Recurring or One-Time Credits. Billing is based on the duration of the audio files sent for processing in milliseconds, with the minimum processing time for billing being 3min. If you process a 20min audio file with a 1min intro file, the processing time is 21min. You can use as many output files (MP3, AAC, ...) or input tracks (multitrack productions) as you want, the charged processing time will always stay the same. When processing very short files, we charge at least 3min of credits per production to avoid spam attacks. Recurring processing credits are reset every month according to its plan (Auphonic S to 9h, Auphonic M to 21h, etc.). If you don't use all credits in the current month, you cannot save them for the next month! One-Time processing credits are used after recurring monthly credits (added on top of them), but before free credits, and are valid for an unlimited amount of time. Recurring monthly credits are used first, one-time credits are added on top of them. Combine one-time credits with recurring credits, if you occasionally want to process more audio material. Yes. You can edit your production without additional costs, as long as you use the same input files in the same production. If you change one of your input files or create a new production, you will be charged again! Yes, please use the Refund credits link on the production page to send us a description of the problem and all used credits will be refunded. In the same way as all other productions, based on the duration of the output audio file. For example, a 1 hour, 4 track production (4 files of 1 hour each) will produce a 1 hour output file and will require 1 hour of credits."
