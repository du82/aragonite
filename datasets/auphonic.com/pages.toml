["https://auphonic.com/help/algorithms/multitrack.html"]
title = "Multitrack Post Production Algorithms — Auphonic Help 2024 documentation"
full_description = "Multitrack Post Production Algorithms An Auphonic Multitrack post production takes multiple parallel input audio tracks/files, analyzes and processes them individually as well as combined and creates the final mixdown automatically. Leveling, dynamic range compression, gating, noise and hum reduction, crosstalk removal, ducking and filtering can be applied automatically according to the analysis of each track. Loudness normalization and true peak limiting is used on the final mixdown. All algorithms were trained with data from our web service and they keep learning and adapting to new audio signals every day. Auphonic Multitrack is most suitable for programs, where dialogs/speech is the most prominent content: podcasts, radio, broadcast, lecture and conference recordings, film and videos, screencasts etc. It is not built for music-only productions. Multitrack Adaptive Leveler Adaptive Noise Gate Crossgate: Crosstalk (Spill, Reverb) Removal Noise and Reverb Reduction Multitrack Dynamic Denoiser Multitrack Speech Isolation Multitrack Static Denoiser Automatic Ducking, Foreground and Background Tracks Adaptive Filtering Multitrack High-Pass Filtering Multitrack Voice AutoEQ Filtering Loudness Specifications and True Peak Limiter Automatic Cutting Cut Silence Cut Fillers Export Cut Lists Cut Videos Audio examples with detailed explanations what our algorithms are doing can be found at: https://auphonic.com/features/multitrack Warning Please read the Multitrack Best Practice before using our multitrack algorithms! Multitrack Adaptive Leveler Adaptive Leveler in Master Track: Leveling Parameters in Individual Tracks: Similar to our singletrack Adaptive Leveler, the Multitrack Advanced and Adaptive Levelers correct level differences between tracks, speakers, music and speech within one audio production. Using the knowledge from signals of all tracks allows us to produce much better results compared to our singletrack version. The Multitrack Advanced Leveler analyses which parts of each audio track should be leveled, how much they should be leveled, and how much dynamic range compression should be applied to achieve a balanced overall loudness in the final master track. For all parameters please see Multitrack Advanced Leveler Settings In addition to these track specific parameters, you can switch the Multitrack Adaptive Leveler in the Master Track Audio Algorithms to Broadcast Mode and therewith control the combined leveling strength. Volume changes of our leveling algorithms will be adjusted, so that the final mixdown of the multitrack production meets the given MaxLRA, MaxS, or MaxM target values – as it is done in the Singletrack Broadcast Mode. For all parameters please see Multitrack Adaptive Leveler Settings We analyze all input audio tracks to classify speech, music and background segments and process them individually: We know exactly which speaker is active in which track and can therefore produce a balanced loudness between tracks. Loudness variations within one track (changing microphone distance, quiet speakers, different songs in music tracks etc.) are corrected. Dynamic range compression is applied on each speech track automatically (see also Loudness Normalization and Compression). Music segments are kept as natural as possible. Background segments (noise, wind, breathing, silence etc.) are classified and won’t be amplified. (see also Automatic Ducking, Foreground and Background Tracks) Each track is processed with your selected stereo panorama factor to create a stereo mix with a spatial impression. Annotated Multitrack Adaptive Leveler Audio Examples: Please listen to our Multitrack Audio Example 1, Multitrack Audio Example 3 and the Singletrack Adaptive Leveler Audio Examples. They include detailed annotations to illustrate what our algorithms are doing! Adaptive Noise Gate If audio is recorded from multiple microphones and all signals are mixed, the noise of all tracks will add up as well. The Adaptive Noise Gate decreases the volume of segments where a speaker is inactive, but does not change segments where a speaker is active. This results in much less noise in the final mixdown. Our classifiers know exactly which speaker or music segment is active in which track. Therefore we can set all parameters of the Gate / Expander (threshold, ratio, sustain, etc.) automatically according to the current context. Annotated Adaptive Noise Gate Audio Examples: Please listen to our Multitrack Audio Example 2 and the other Multitrack Audio Examples. They include detailed annotations to illustrate what our algorithms are doing! Crossgate: Crosstalk (Spill, Reverb) Removal When recording multiple people with multiple microphones in one room, the voice of speaker 1 will also be recorded in the microphone of speaker 2. This Crosstalk / Spill results in a reverb or echo-like effect in the final audio mixdown. If you try to correct that using a Noise Gate / Expander, it is very difficult to set the correct parameters, because the crosstalk might be very loud. Our multitrack algorithms know exactly when and in which track a speaker is active and can therefore remove the same or correlated signals (the crosstalk) from all other tracks. This results in a more direct signal and decreases ambience and reverb. Annotated Crossgate Audio Examples: Please listen to our Multitrack Audio Example 4 and the other Multitrack Audio Examples. They include detailed annotations to illustrate what our algorithms are doing! Noise and Reverb Reduction In the Auphonic Web Service, you can use three methods to define which kind of noise you want to reduce: The Static Denoiser only removes stationary, technical noises, while our Dynamic Denoiser removes everything but voice and music. Select Speech Isolation if you only want to keep speech, so all noise and even music will be removed. You can specify your favorite denoising algorithms for every individual track. Therefore, multitrack noise reduction algorithms can produce much better results compared to our singletrack Noise and Reverb Reduction algorithms. A possible setup could be: Track1: static denoiser for speaker1 to keep sound effect and remove static hiss and hum Track2: dynamic denoiser for speaker2 to keep music jingles but remove construction noises Track3: speech isolation for speaker3 to remove background chatter, wind noises and music Track4: no denoiser for pure music track without noise For maximum flexibility, with Speech Isolation and Dynamic Denoiser, you can also separately control the reduction amounts for each track: Remove Noise: Reduce this amount, if you don’t want to completely eliminate the noise, but keep some atmosphere. Remove Reverb: Reduce this amount to quietly keep the reverberation for a spatial impression. Remove Breathings: Reduce this amount to keep the breathing sounds in your breath meditation recording. These parameters allow you to increase the speech intelligibility while preserving a natural feel if desired. For more details about all available parameters, please see Noise Reduction Settings. Annotated Multitrack Noise Reduction Audio Examples: Please listen to our Multitrack Audio Examples and Noise Reduction Audio Examples. Multitrack Dynamic Denoiser The Dynamic Denoiser preserves speech and music signals but removes everything else from your audio or video file. It is perfectly used with tracks, that contain fast-changing and complex noises in situations like: Crowded Places: Chatter and noises from people in the background. Outdoor Recordings: Clean up background noises like wind or traffic. Breakfast Interview: Get rid of mouth noises from eating during a recording session. Large rooms: Eliminate echo and reverberation. Enthusiastic Speech: Remove unwanted inhalation and exhalation sounds. During the analysis of an audio signal, there is metadata generated, classifying contents such as spoken word, music in the foreground or background, different types of noises, silence, and more. Based on this metadata, every selected track is processed with AI algorithms, that are permanently changing over time, to apply the best matching settings for every tiny segment of your audio. These adaptive noise reduction algorithms take care, that a consistent, high sound quality is produced throughout the entire recording while removing as many unwanted noises as possible. Please pay attention not to use the Dynamic Denoiser, if you want to keep sound effects or ambient sounds in any kind of audio play content! Multitrack Speech Isolation Our Speech Isolation algorithms do only isolate speech, but remove everything else, including music, from your audio or video file. It is perfectly used for speech tracks containing music and fast-changing, complex noises. For example: Videos: Increase the speech intelligibility by reducing or completely removing the background music of your video. Bar Interview: Silence music, clinking glasses, and chatter from the background. Home Recordings: Clean up noise from your neighbor rumbling and practicing piano. During the analysis of an audio signal, there is metadata generated, classifying contents such as spoken word, music in the foreground or background, different types of noises, silence, and more. Based on this metadata, every selected track is processed separately with AI algorithms, that are permanently changing over time, to apply the best matching settings for every tiny segment of your audio. These adaptive noise reduction algorithms take care, that a consistent, high sound quality is produced throughout the entire recording while removing as many unwanted music and noises as possible. Please pay attention not to use Speech Isolation algorithms, if you want to keep jingles, sound effects, or ambient sounds in any kind of audio play content! Multitrack Static Denoiser Our Static Denoiser algorithms only remove broadband background noise and hum from audio files with slowly varying backgrounds. Therefore, static denoising is perfectly used for tracks with any kind of audio play content, where you want to keep sound effects or ambient sounds, like a singing bird in your ornithology podcast. First, the audio of each selected track is analyzed and segmented into regions with different background noise characteristics, and subsequently, Noise Prints are extracted for each region. Per default, there is also Hum Reduction activated with the Static Denoiser. If any hum is present in the recording, the hum base frequency (50Hz or 60Hz) and the strength of all its partials (100Hz, 150Hz, 200Hz, 250Hz, etc.) are also identified for each region. Based on this metadata of all analyzed audio regions, our classifier finally decides how much noise and hum reduction is needed in each region and automatically removes the noise and hum from the audio signal of every selected track. You can also manually set the parameter Remove Noise for every individual track, if you prefer more noise reduction. However, be aware that high noise reduction amounts might result in artifacts! For best results, please also find our Usage Tips for Static Denoiser. Automatic Ducking, Foreground and Background Tracks The parameter Fore/Background controls whether a track should be in foreground, in background, ducked, or unchanged. Ducking automatically reduces the level of a track if speakers in other tracks are active. This is useful for intros/outros, translated speech, or for music, which should be softer if someone is speaking. If Fore/Background is set to Auto, Auphonic automatically analyzes each segment of your track and decides if it should be in foreground or background: Speech tracks will always be in foreground. In music tracks, all segments/clips (songs, intros, etc.) are classified as background or foreground segments and are mixed to the production accordingly. Each clip will be leveled individually, therefore all relative loudness differences between clips in this track will be lost. The automatic fore/background classification should work most of the time. However, in special or artistic productions, like a very complex background music track or if you do the ducking and all relative level changes manually in your audio editor, you can force the track to be in foreground, in background, or unchanged: Background: Each segment/clip of the track is mixed to be in background (softer compared to foreground speech). Foreground: The track is mixed to be in foreground (same level as foreground speech). Each segment/clip (songs, intros, etc.) of the track will be leveled individually, therefore all relative loudness differences between clips in this track will be lost. Unchanged (Foreground): Level relations within this track won’t be changed at all. It will be added to the final mixdown so that foreground/solo parts of this track will be as loud as (foreground) speech from other tracks. See also How should I set the Parameter Fore/Background. Annotated Multitrack Fore/Background/Ducking Audio Examples: Please listen to the Automatic Ducking Audio Example and to the Fore/Background Example. They include detailed annotations to illustrate what our algorithms are doing! Adaptive Filtering Multitrack High-Pass Filtering Our adaptive High-Pass Filtering algorithm cuts disturbing low frequencies and interferences, depending on the context of each track. First we classify the lowest wanted signal in every track segment: male/female speech base frequency, frequency range of music (e.g. lowest base frequency), noise, etc. Then all unnecessary low frequencies are removed adaptively in every audio segment, so that interferences are removed but the overall sound of the track is preserved. We use zero-phase (linear) filtering algorithms to avoid asymmetric waveforms: in asymmetric waveforms, the positive and negative amplitude values are disproportionate - please see Asymmetric Waveforms: Should You Be Concerned?. Asymmetrical waveforms are quite natural and not necessarily a problem. They are particularly common on recordings of speech, vocals and can be caused by low-end filtering. However, they limit the amount of gain that can be safely applied without introducing distortion or clipping due to aggressive limiting. Multitrack Voice AutoEQ Filtering The AutoEQ (Automatic Equalization) automatically analyzes and optimizes the frequency spectrum of a voice recording, to avoid speech that sounds very sharp, muddy, or otherwise unpleasant. Using Auphonic AutoEQ, spectral EQ profiles are created for each track and each speaker separately and permanently changing over time. The aim of those time-dependent EQ profiles is to create a constant, warm, and pleasant sound in the output file even if there are slightly changing voices within a track, for example, due to modified speaker-microphone positions. For more details, please also read our blog post about Auphonic AutoEQ Filtering. Loudness Specifications and True Peak Limiter Loudness Normalization and a T"
year_published = 2025
