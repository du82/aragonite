["https://auphonic.com/help/web/multitrack.html"]
title = "Multitrack — Auphonic Help 2024 documentation"
full_description = "Multitrack A multitrack production takes multiple parallel input audio tracks, processes them individually as well as combined and creates the final mixdown automatically. Leveling, dynamic range compression, gating, noise and hum reduction, crosstalk removal, ducking and filtering can be applied automatically according to the analysis of each track. Our Master Audio Algorithms loudness normalization, true peak limiting, and silence cutting are used on the final mixdown. For more details see Multitrack Post Production Algorithms. Auphonic Multitrack is built for speech-dominated programs. All tracks must be opened as separate files and start at the same time: speech tracks recorded from multiple microphones, music tracks, remote speakers via phone, skype, etc. Click here to create a new multitrack production in our web system: https://auphonic.com/engine/multitrack/ Note If you want to process a single (master) mono or stereo audio file, please use a Singletrack Production instead! Warning Multitrack is much more complicated to use compared to our Singletrack Version. Please read and understand the Multitrack Best Practice in detail before creating a Multitrack Production! Audio Algorithms for Individual Tracks Select one audio source file per track and configure track-specific audio algorithms. See the overview below for a description of all track-specific audio algorithm parameters and an overview for the Master Track algorithms in section Audio Algorithms for Master Track. For further information about all Multitrack Post Production Algorithms, please click here. Please activate more settings by clicking the slider icon on the right side of your selected audio algorithms. You can upload files directly in the browser, use HTTP links or any supported External Services (FTP, Dropbox, S3, Google Drive, SFTP, WedDAV and many more - please register the service first). Supported filetypes: MP2, MP3, MP4, M4A, M4B, M4V, WAV, OGG, OGA, OPUS, FLAC, ALAC, MPG, MOV, AC3, EAC3, AIF, AIFC, AIFF, AIFFC, AU, GSM, CAF, IRCAM, AAC, MPG, SND, VOC, VORBIS, VOX, WAVPCM, WMA, ASF, ALAW, APE, CAF, MPC, MPC8, MULAW, OMA, RM, TTA, W64, SPX, 3PG, 3G2, 3GPP, 3GP, 3GA, TS, MUS, AVI, DV, FLV, IPOD, MATROSKA, WEBM, MPEG, OGV, VOB, MKV, MK3D, MKA, MKS, QT, MXF. Please let us know if you need an additional format. For lossy codecs like MP3, please use a bitrate of 192k or higher! Track IdentifierEnter a name for the current audio track. This field is used as the speaker name in Speech Recognition. Adaptive Filtering Settings Filtering MethodHere you can select the desired filtering algorithm for your production: Adaptive high-pass filtering cuts disturbing low frequencies and interferences, depending on the context. Unnecessary low frequencies are removed adaptively in every audio segment, but the overall sound of the audio is preserved. For more information, please see Adaptive high-pass filtering. Voice AutoEQ automatically removes sibilance (De-Esser) and optimizes the frequency spectrum of a voice recording, to avoid speech that sounds very sharp, muddy, or otherwise unpleasant. The Voice AutoEQ is always applied in combination with the Adaptive high-pass filtering. For more information, please see Voice AutoEQ. Noise and Reverb Reduction Settings Removes static and fast-changing noises including reverb from audio files. For more details, see Noise Reduction Algorithms. Denoising MethodDefine whether Auphonic should remove only static or also fast-changing noises including reverb or breathings and if we should keep or eliminate music. The Static Denoiser removes stationary, technical noises, while our Dynamic Denoiser removes everything but voice and music. Select Speech Isolation if you only want to keep speech, so all noise and even music will be removed. Please listen to the differences between the algorithms in our Noise Reduction Audio Examples and find more details about Noise Reduction here. Remove NoiseRegardless of which denoising method is selected, you can set the maximum noise reduction amount in dB. The default value is 100 dB (full) noise reduction. Set to a lower value if you prefer less or no noise reduction. For Static Denoiser in Auto mode, a classifier decides if and how much noise reduction is necessary. Be aware, that custom set higher values might result in artifacts or destroy music segments! Remove ReverbFor Dynamic Denoiser or Speech Isolation, you can remove or reduce reverb caused by large rooms from your recordings. The default value is 100 dB (full) reverb reduction. Set to a custom value if you prefer less or no reverb reduction to keep some ambiance. Remove BreathingsIf you enable Remove Breathings for Dynamic Denoiser or Speech Isolation, all distracting inhalation and exhalation sounds will be reduced or removed from your recordings. Set higher values to get more breathing sound reduction. Parameters for Static DenoisingIn addition to the parameter Remove Noise, we offer two more parameters for the Static Denoiser to control the combination of our Static Noise and Hum Reduction algorithms. Behavior of our Noise and Hum Reduction parameter combinations: Remove Noise Hum Base Frequency Hum Reduction Amount Auto Auto Auto Automatic hum and noise reduction Auto or > 0 Disabled No hum reduction, only denoise Off 50Hz Auto or > 0 Force 50Hz hum reduction, no denoise Off Auto Auto or > 0 Automatic dehum, no denoise 12dB 60Hz Auto or > 0 Always do dehum (60Hz) and denoise (12dB) Hum Reduction Base Frequency For Static Denoising, set the hum base frequency to 50Hz or 60Hz (if you know it), or use Auto to automatically detect the hum base frequency in each speech region. Hum Reduction Amount For Static Denoising, set the maximum hum reduction in dB. Higher values remove more hum but carry the risk of worsening. In Auto mode, a classifier decides how much hum reduction is necessary for each speech region. Set it to a custom value (> 0), if you prefer more hum reduction or want to bypass our classifier. Use Disable Dehum to disable hum reduction and use our noise reduction algorithms only. Advanced Leveler Settings More parameters for our Multitrack Leveler to customize which parts of every single audio track should be leveled, how much they should be leveled, and how much dynamic range compression should be applied. It’s also possible to set the stereo panorama (balance) of each track. Leveler StrengthThe Leveler Strength controls how much leveling is applied: 100% means full leveling, 0% means no leveling at all. Changing the Leveler Strength increases/decreases the dynamic range of this track. For example, if you want to increase the dynamic range of this track by 3dB compared to 100% leveling, just set the Leveler Strength parameter to 70% (~3dB). We also like to call this concept Loudness Comfort Zone: above a maximum and below a minimum level (the comfort zone), no leveling is applied; the higher the Leveler Strength, the smaller the comfort zone (more leveling necessary). So if your track input file already has a small dynamic range (is within the comfort zone), our leveler will be just bypassed. Example Use Case: Lower Leveler Strength values should be used if you want to keep more loudness differences in dynamic narration or dynamic music recordings (live concert/classical). CompressorSelect a preset value for micro-dynamics compression: A compressor reduces the volume of short and loud spikes like the pronunciation of “p” and “t” or laughter (short-term dynamics) and also shapes the sound of your voice (making the sound more or less “processed” or “punchy”). Possible values are: Auto: The compressor setting depends on the selected Leveler Strength. Medium compression is used for strength values <= 100%, Hard compression for strength values > 100% (Fast Leveler and Amplify Everything). Soft: Uses less compression. Medium: Our default setting. Hard: More compression, especially tries to compress short and extreme level overshoots. Use this preset if you want your voice to sound very processed, our if you have extreme and fast-changing level differences. Off: No short-term dynamics compression is used at all, only mid-term leveling. Switch off the compressor if you just want to adjust the loudness range without any additional micro-dynamics compression. MusicSpeech Classifier SettingSelect between the Speech Track and Music Track Adaptive Leveler. If set to On, a classifier will decide if this is a music or speech track. Stereo Panorama (Balance)Change the stereo panorama (balance for stereo input files) of the current track. Possible values: L100, L75, …. Center, … R75 and R100. (from 100% left to 100% right) Fore/Background Settings The parameter Fore/Background controls whether a track should be in foreground, in background, ducked, or unchanged. Ducking automatically reduces the level of a track if speakers in other tracks are active. This is useful for intros/outros, translated speech, or for music, which should be softer if someone is speaking. For more details, please see Automatic Ducking, Foreground and Background Tracks. Track GainIncrease/decrease the loudness of this track compared to other tracks. This can be used to add gain to a music or a specific speech track, making it louder/softer compared to other tracks. Level of Background SegmentsSet the level of background segments/tracks (compared to foreground segments) in background and ducking tracks. By default, background and ducking segments are 18dB softer than foreground segments. Ducking Fade TimeSet fade down/up length (attack/release) for ducking segments in ms. The default value is 500ms. Intro and Outro Automatically add an Intro/Outro to your production. Audio and video files are supported, with video files being limited to a length of 1 minute. As intros/outros are intended to be used multiple times, they are only Loudness Normalized to match the loudness of your production without further Auphonic processing (no leveling, filtering, noise reduction, etc.). Therefore you should edit/process your intro/outro before. For a detailed description of our intro/outro feature, please see the blog post Automatic Intros and Outros in Auphonic. Select Intro FileSelect your intro audio from a local file (in productions only), HTTP or an External Service (Dropbox, SFTP, S3, Google Drive, SoundCloud, etc. - please register the service first). NOTE: We store audio files only for a limited number of days, therefore you have to use intro/outro files in presets from HTTP or an External Service. In productions, you can upload intro/outro files directly. Intro OverlapSet overlap time in seconds of intro end with main audio file start, for details see Overlapping Intros/Outros. IMPORTANT: ducking must be added manually to intro audio file! Select Outro FileSelect your outro audio from a local file, HTTP or an External Service (Dropbox, SFTP, S3, Google Drive, SoundCloud, etc. - please register the service first). Outro OverlapSet overlap time in seconds of outro start with main audio file end, for details see Overlapping Intros/Outros. IMPORTANT: ducking must be added manually to outro audio file! Basic Metadata Basic metadata (title, cover image, artist, album, track) for your production. Metadata tags and cover images from input files will be imported automatically in empty fields! We correctly map metadata to multiple Output Files. For details see the following blog posts: ID3 Tags Metadata (used in MP3 output files), Vorbis Comment Metadata (used in FLAC, Opus and Ogg Vorbis output files) and MPEG-4 iTunes-style Metadata (used in AAC, M4A/M4B/MP4 and ALAC output files). Metadata fields can make use of Variables and Placeholders. Cover ImageAdd a cover image or leave empty to import the cover image from your input file. If a Video Output File or YouTube export is selected, Auphonic generates a video with cover/chapter image(s) automatically! Extended Metadata Extended metadata (subtitle, summary, genre, etc.) for your production. Metadata tags from input files will be imported automatically in empty fields! We correctly map metadata to multiple Output Files. For details see the following blog posts: ID3 Tags Metadata (used in MP3 output files), Vorbis Comment Metadata (used in FLAC, Opus and Ogg Vorbis output files) and MPEG-4 iTunes-style Metadata (used in AAC, M4A/M4B/MP4 and ALAC output files). Metadata fields can make use of Variables and Placeholders. SubtitleA subtitle for your production, must not be longer than 255 characters! Summary / DescriptionHere you can write an extended summary or description of your content. Append Chapter Marks to SummaryAppend possible Chapter Marks with time codes and URLs to your Summary. This might be useful for audio players which don’t support chapters! Create a Creative Commons LicenseLink to create your license at creativecommons.org. Copy the license and its URL into the metadata fields License (Copyright) and License URL! Tags, KeywordsTags must be separated by comma signs! Chapter Marks Chapter marks, also called Enhanced Podcasts, can be used for quick navigation within audio files. One chapter might contain a title, an additional URL and a chapter image. Chapters are written to all supported output file formats (MP3, AAC/M4A, Opus, Ogg, FLAC, ALAC, etc.) and exported to Soundcloud, YouTube and Spreaker. If a video Output File or YouTube export is selected, Auphonic generates a video with chapter images automatically. For more information about chapters and which players support them, please see Chapter Marks for MP3, MP4 Audio and Vorbis Comment (Enhanced Podcasts). Chapter marks can be entered directly in our web interface or we automatically Import Chapter Marks from your input audio file. It’s also possible to import a simple Text File Format with Chapters, upload markers from various audio editors (Audacity Labels, Reaper Markers, Adobe Audition Session, Hindenburg, Ultraschall, etc.), or use our API for Adding Chapter Marks programmatically. For details, please see How to Import Chapter Marks in Auphonic. Chapter Start TimeEnter chapter start time in hh:mm:ss.mmm format (examples: 00:02:35.500, 1:30, 3:25.5). NOTE: You don’t have to add the length of an optional Intro File here! Chapter TitleOptional title of the current chapter. Audio players show chapter titles for quick navigation in audio files. Chapter URLEnter an (optional) URL with further information about the current chapter. Chapter ImageUpload an (optional) image with visual information, e.g. slides or photos. The image will be shown in podcast players while listening to the current chapter, or exported to video Output Files. Import Chapter Marks from FileSelect a Text File Format with a timepoint (hh:mm:ss[.mmm]) and a chapter title in each line or Import Chapter Marks from Audio Editors. NOTE: We automatically import chapter marks form your input audio file! Output Files Add one or multiple output file formats (MP3, MP4, Ogg, "
