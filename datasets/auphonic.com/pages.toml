full_description = "Speaker Identification in Single Track Productions Written by Lukas Timpl, Christoph Grasser on Aug. 5, 2024 We're excited to announce the release of our new speaker diarization feature! With our latest update, we can now detect individual speakers within a single audio recording, allowing users to see precisely who said what and when. This information is then reflected in the transcript. Previously, this feature was only available in Multitrack Productions. What is Speaker Diarization? Speaker diarization is the process of identifying different speakers and segmenting an audio file accordingly, making it easier to accurately determine who said what. This is particularly useful in scenarios like meeting recordings, interviews, and podcasts involving ... Continue reading → Discussions : No comments yet. Be first to comment! Eliminate Breathing Sounds and Mouth Noises Written by Manuel Pagavino, Isabell Bühler, Lukas Timpl, Gabriel Zirkovits on Nov. 29, 2023 No matter how good your technical equipment might be, it is almost impossible to avoid capturing unwanted in-/exhaling sounds and mouth noises during voice recordings. After some users asked for an automatic removal of such sounds to improve the audio quality, we got to work and are now proud to present a major upgrade to our Denoiser, including the automatic removal of mouth noises and a new “Remove Breathings” option! Check out our Audio Examples and the Getting Started Guide below. What is new? Remove Breathings: When the new “Remove Breathings” option is enabled, all the inhalation ... Continue reading → Discussions : No comments yet. Be first to comment! Export Cuts for Audio/Video Editors and Filler Cutting Updates Written by Lukas Maier, Isabell Bühler, Lukas Timpl, Gabriel Zirkovits on Nov. 15, 2023 For those of you who like to be in control of every applied cut, we are introducing an update for our Automatic Silence and Filler Word Cutting Algorithms today: The export of Cut Lists allows you to import cuts into your favorite audio/video editor to check and apply the cuts to your files manually. Thanks to your great feedback, we were able to update our “Filler Word Cutting” algorithm as well. Cut Lists Export We now provide the export of various formats of “Cut Lists” in the Auphonic Web Service. You can use these formats to modify and ... Continue reading → Discussions : No comments yet. Be first to comment!"
