full_description = '''Independently control Noise, Reverb and Breath Reduction Amounts Written by Manuel Pagavino, Isabell Bühler, Gabriel Zirkovits on May 16, 2024 Responding to your feedback, we are now proud to present new separate parameters for noise, reverb, and breath reduction to give you more flexible control for your individual, best output results. Find all the new parameters below and listen to the Audio Examples to get a closer impression of the upgrade. What's the update about? Before Previously, you could only set the Denoising Method and one reduction amount, that was used for all elements. Depending on the selected method, you were already able to decide whether music, static, or changing noises should be removed, but there was no setting ... Continue reading → Discussions : No comments yet. Be first to comment! Eliminate Breathing Sounds and Mouth Noises Written by Manuel Pagavino, Isabell Bühler, Lukas Timpl, Gabriel Zirkovits on Nov. 29, 2023 No matter how good your technical equipment might be, it is almost impossible to avoid capturing unwanted in-/exhaling sounds and mouth noises during voice recordings. After some users asked for an automatic removal of such sounds to improve the audio quality, we got to work and are now proud to present a major upgrade to our Denoiser, including the automatic removal of mouth noises and a new “Remove Breathings” option! Check out our Audio Examples and the Getting Started Guide below. What is new? Remove Breathings: When the new “Remove Breathings” option is enabled, all the inhalation ... Continue reading → Discussions : No comments yet. Be first to comment! New Auphonic AutoEQ Filtering (Beta) Written by Georg Holzmann, Manuel Pagavino, Isabell Bühler on Jan. 24, 2023 table, th, td{ border: 1px solid black; border-collapse: collapse; border-color: #999; font-family: Helvetica,"Helvetica Neue",Arial,sans-serif; font-size: 11px; line-height: 22.5px; color: #555; text-align: center } td:nth-child(odd), th:nth-child(odd){ background-color: #eee; } In addition to our Leveler, Denoiser, and Adaptive 'Hi-Pass' Filter, we now release the missing equalization feature with the new Auphonic AutoEQ. The AutoEQ automatically analyzes and optimizes the frequency spectrum of a voice recording, to remove sibilance (De-esser) and to create a clear, warm, and pleasant sound - listen to the audio examples below to get an idea about what it does. Screenshot of manually ... Continue reading → Discussions : No comments yet. Be first to comment!'''
