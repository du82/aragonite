["https://auphonic.com/help/resources/hindenburg.html"]
title = "Auphonic Integration in Hindenburg — Auphonic Help 2024 documentation"
full_description = "Auphonic Integration in Hindenburg This integration allows you to process sessions from the Hindenburg audio editor through the Auphonic algorithms. You can automatically transfer the downmixed audio file from Hindenburg for further post production without manual downloads and uploads to Auphonic. What is Hindenburg? Hindenburg is an audio editing software that has always kept podcasters’ and storytellers’ needs and demands in mind. As a result, Hindenburg has a range of products for every taste and level of expertise in audio production and editing. From podcasting to radio and audiobook production, Hindenburg simplifies and automates your spoken-word workflow so that you can spend more time doing what is most important. You can easily record, edit and publish professional audio without being an audio engineer. On the Hindenburg website you can check out the features for Hindenburg Lite, Hindenburg Pro and other solutions and pricing plans. How to make the integration work Edit your audio as usual in the Hindenburg product of your choice to the point you are satisfied with the outcome and want to go to the next step of implementing additional improvements to the sound in Auphonic. Then click on the “Publish” icon in the title bar to open the list of target options. By clicking on “+” at the bottom of the “Publish” window you can choose Auphonic as publishing target and give a name to your production. After selecting your desirable audio settings and clicking on “Run Authorization” you will be asked to log in to your Auphonic account and to allow Hindenburg app to connect with your account. Now you are ready to press the “Finish” button in Hindenburg, give a name to your file and start uploading. Once your upload is complete, you can return to the Auphonic page by clicking “Show in Browser”. This will redirect you to the “Edit Production” site, where you can start your Auphonic production directly. If you have already entered metadata, this will also be transferred to your Auphonic production. Supported metadata tags: title, action/save, artist, album, track, subtitle, summary/description, genre, year/date, url/link, tags/keywords Note At the moment, this integration only supports singletrack productions! Your tracks will be downmixed in Hindenburg and then uploaded to Auphonic. Video Tutorial You can also watch this video tutorial kindly prepared by Hindenburg:"
