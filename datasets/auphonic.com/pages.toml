title = "Mobile Apps — Auphonic Help 2024 documentation"
full_description = "Mobile Apps Auphonic Edit: Audio Editor and Recorder for Android Auphonic Recorder for iOS Our mobile apps for Android and iOS include a high-quality audio recorder with focus on ease of use, audio quality and stability. They offer an easy workflow to export audio from a mobile devices to our Web Service, so that it’s possible to record, edit, post process, encode, tag and publish your podcasts, interviews, music recordings on the go with a single click. Auphonic Edit for Android also includes a non-destructive, mobile audio editor to cover the most common audio editing tasks (cut, copy&paste, gain, fades, etc.). Lots of audio editing apps are already available on iOS, therefore the Auphonic Recorder for iOS does not include an additional audio editor (besides cutting start/stop). But you can use any other iOS audio app and share the results with our app to export mobile audio from iOS to our Web Service."
