2-devel from the dependencies and was able to build fine without it. @sfiveo13 Something seems to be wrong with your mirrors, as glib2-devel is in the core repo. Also please take a look at this commit. sfiveo13 commented on 2024-06-26 02:23 (UTC) I'm not sure why he was having issues without glib2-devel, but for some reason my pacman couldn't find it so I manually cloned and removed glib2-devel from the dependencies and was able to build fine without it. puxplaying commented on 2024-06-21 10:41 (UTC) @assisken Thanks for letting me know, I've pushed mutter and g-c-c rebuilds with glib2-devel. assisken commented on 2024-06-21 08:55 (UTC) (edited on 2024-06-21 09:24 (UTC) by assisken) Please add glib2-devel as deps. I had a trouble building this package without this package rossome commented on 2024-03-30 11:23 (UTC) (edited on 2024-04-02 09:59 (UTC) by rossome) Anyone having luck getting this to work with multiple monitors? edit: Awesome, gnome-control-center-x11-scaling got multi-monitor working! edit 2: Getting some funky bug with fullscreen apps (mpv and totem so far). They seems to be tweaking the display order. aeonblue commented on 2023-08-26 04:41 (UTC) @puxplaying Yes clearing the cache fixed it, thanks. puxplaying commented on 2023-08-25 14:08 (UTC) @aeonblue @beautyyuyanli Clean your cache... You both have obviously the old patch in the build directory. aeonblue commented on 2023-08-25 12:25 (UTC) Failing to install... ==> Making package: mutter-x11-scaling 44.4-1 (Fri 25 Aug 2023 22:21:16) ==> Retrieving sources... -> Updating mutter git repo... -> Found x11-Add-support-for-fractional-scaling-using-Randr.patch ==> WARNING: Skipping verification of source file PGP signatures. ==> Validating source files with b2sums... mutter ... Skipped x11-Add-support-for-fractional-scaling-using-Randr.patch ... FAILED ==> ERROR: One or more files did not pass the validity check! -> error downloading sources: /home/nrb/.cache/yay/mutter-x11-scaling context: exit status 1 :