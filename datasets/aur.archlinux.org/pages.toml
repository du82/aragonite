s with allowed images, or images derived from allowed images. Fixed a bug that prevented Docker Desktop from entering Resource Saver mode again immediately after an engine restart. For Linux: The Software Updates page in settings, now points to the latest available version available. Latest Comments 1 2 3 4 5 6 7 Next › Last » xeeynamo commented on 2025-03-05 15:04 (UTC) Bump to 4.39.0 New: The Docker Desktop CLI is now generally available. You can now also print logs with the new docker desktop logs command. Docker Desktop now supports the --platform flag on docker load and docker save. This helps you import and export a subset of multi-platform images. Upgrades: Docker Compose v2.33.1 Docker Buildx v0.21.1 Kubernetes v1.32.2 Docker Engine v28.0.1 Docker Scout CLI v1.16.3 Bugfixes and enhancements: Ask Gordon now offers deeper context on Docker images, containers, and volumes, delivers faster support, and enables more user actions via Docker Desktop and the Docker CLI. Support multi-platform images via enabling users to pick a specific platform in docker history Fixed an issue that caused clients other than the CLI and Docker Desktop to see a delay of 3 seconds whenever a container with port-mappings exists. See docker/for-mac#7575 Fixed a bug in the ECI Docker socket permissions which caused it to sometimes block Docker socket mounts on containers with allowed images, or images derived from allowed images. Fixed a bug that prevented Docker Desktop from entering Resource Saver mode again immediately after an engine restart. For Linux: The Software Updates page in settings, now points to the latest available version available. xeeynamo commented on 2025-01-30 16:31 (UTC) Bump to 4.38.0 New: Docker Compose, Docker Scout, the Docker CLI, and Ask Gordon can now be updated independently of Docker Desktop and without a full restart (Beta). Bake is now GA, with support for entitlements and composable attributes. You can now create multi-node Kubernetes clusters in Docker Desktop. Ask Gordon is more widely available. It is still in Beta. Upgrades: containerd v1.7.24 Docker Buildx v0.20.1 Docker Compose v2.32.4 Docker Engine v27.5.1 Docker Scout CLI v1.16.1 Runc v1.2.2 NVIDIA Container Toolkit v1.17.4 Kubernetes v1.31.4 Docker Debug v0.0.38 Bugfixes: Fixed a bug where access tokens generated by the docker login web flow could not be refreshed by Docker Desktop. Fixed a bug where container creation via the Docker API using curl failed when Enhanced Container Isolation was enabled. Fixed a bug where the RAM policy was not refreshed after the refresh period had elapsed. Fixed a bug in Enhanced Container Isolation when mounting the Docker socket into a container, and then creating Docker containers with bind-mounts from within that container. Fixed an issue that caused a discrepancy between the GUI and the CLI, the former forcing the 0.0.0.0 HostIP in port-mappings. This caused default binding IPs configured through Engine's ip flag, or through the bridge option com.docker.network.bridge.host_binding_ipv4, to not be used. Fixed a bug where the pac setting was ignored in admin-settings.json. For Linux: Added support for gvisor networking. Users with an incompatible version of qemu (8.x) will stay on qemu networking, and others will be migrated automatically. Deprecation: Deprecate com.docker.diagnose check|check-dot|check-hypervisordetect-host-hypervisor. leandrocunha commented on 2025-01-20 20:01 (UTC) Since the 16th, Zpecter keeps classifying this package as out of date and as you can see in the screenshot, there are currently no updates except for Mac. See https://imgur.com/a/GTLxiKN So please stop notifying me for no reason. Thank you! leandrocunha commented on 2025-01-16 11:16 (UTC) (edited on 2025-01-16 22:02 (UTC) by leandrocunha) When classifying software with an update (flag out-of-date (2025-01-16)), check the release notes first. 4.37.2 has fixes for MacOS and can be seen below. There are no releases for platforms other than Mac