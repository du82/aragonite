ero-7.0.0-beta.95+694ccecf4 at 2024.07.06. this package is outdated for one month, @qubidt could you please update it? v4u6h4n commented on 2024-05-18 09:43 (UTC) Thanks! <3 cphyc commented on 2024-05-06 08:02 (UTC) (edited on 2024-05-06 08:10 (UTC) by cphyc) Patch for the (at the time of writing) latest version: diff --git a/.SRCINFO b/.SRCINFO index 2dbe197..e617a33 100644 --- a/.SRCINFO +++ b/.SRCINFO @@ -1,6 +1,6 @@ pkgbase = zotero-beta-bin pkgdesc = Zotero is a free, easy-to-use tool to help you collect, organize, cite, and share research. - pkgver = 7.0.0beta.74+2e8073ab9 + pkgver = 7.0.0beta.77+adaa61f2c pkgrel = 1 url = https://www.zotero.org/support/dev_builds arch = x86_64 @@ -15,9 +15,9 @@ pkgbase = zotero-beta-bin conflicts = zotero source = zotero-absolute-path-fix.patch sha256sums = 7a633ebad3a2d7bec604cc6fdb2aae13fd6c707975978ddccd39a526f933f585 - source_x86_64 = Zotero-7.0.0-beta.74+2e8073ab9_linux-x86_64.tar.bz2::https://download.zotero.org/client/beta/7.0.0-beta.74%2B2e8073ab9/Zotero-7.0.0-beta.74%2B2e8073ab9_linux-x86_64.tar.bz2 - sha256sums_x86_64 = 946f4aa4e2d71bbbd16948d434d48772c041cf02e716c1a9c3a92dd7c6f50dfd - source_i686 = Zotero-7.0.0-beta.74+2e8073ab9_linux-x86_64.tar.bz2::https://download.zotero.org/client/beta/7.0.0-beta.74%2B2e8073ab9/Zotero-7.0.0-beta.74%2B2e8073ab9_linux-x86_64.tar.bz2 - sha256sums_i686 = 946f4aa4e2d71bbbd16948d434d48772c041cf02e716c1a9c3a92dd7c6f50dfd + source_x86_64 = Zotero-7.0.0-beta.77+adaa61f2c_linux-x86_64.tar.bz2::https://download.zotero.org/client/beta/7.0.0-beta.77%2Badaa61f2c/Zotero-7.0.0-beta.77%2Badaa61f2c_linux-x86_64.tar.bz2 + sha256sums_x86_64 = 46530aef983d7417ea43d0b5a7d0687cbbcd9187f1b11439fa27ead6c91adaa7 + source_i686 = Zotero-7.0.0-beta.77+adaa61f2c_linux-i686.tar.bz2::https://download.zotero.org/client/beta/7.0.0-beta.77%2Badaa61f2c/Zotero-7.0.0-beta.77%2Badaa61f2c_linux-i686.tar.bz2 + sha256sums_i686 = bc730e1542ecd9d7bcfd69431ee9e81ed277293e6287488f29c5448796954ac5 pkgname = zotero-beta-bin 