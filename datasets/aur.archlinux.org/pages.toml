stions - Community Report bugs - GitHub Request features - GitHub Latest Comments 1 2 3 4 5 6 7 Next › Last » brave-prerelease commented on 2025-02-06 13:55 (UTC) Find answers - FAQ, Help Center Ask questions - Community Report bugs - GitHub Request features - GitHub gregbunk commented on 2025-01-22 21:07 (UTC) I no longer have time to maintain this package. Denjia74 commented on 2024-07-15 13:10 (UTC) Yeah, it's really weird. I tried installing with makepkg and everything installed fine. Thanks for the reply and for your work. gregbunk commented on 2024-07-15 11:56 (UTC) Looks like a Q for the yay people. I just installed with paru no problems. Denjia74 commented on 2024-07-15 11:52 (UTC) When trying to update brave with the command "yay -S brave-nightly-bin", an error occurs. Here is the result: AUR Explicit (1): brave-nightly-bin-1.69.106-1 :: PKGBUILD updated, skipped download: brave-nightly-bin -> merge error /home/denjia74/.cache/yay/brave-nightly-bin: fatal: No current branch. I tried clearing .cache/yay, it didn't help me. gregbunk commented on 2023-11-22 14:16 (UTC) (edited on 2023-11-22 14:18 (UTC) by gregbunk) Not sure what to say. Here's my ~/.config/brave-nightly-flags.conf: --disable-gpu-vsync --disable-gpu-driver-bug-workarounds --enable-features=VaapiVideoDecoder --ignore-gpu-blocklist --enable-gpu-rasterization --enable-zero-copy And here's what I get when I run brave-nightly script: exec /opt/brave.com/brave-nightly/brave-browser --disable-gpu-vsync --disable-gpu-driver-bug-workarounds --enable-features=VaapiVideoDecoder --ignore-gpu-blocklist --enable-gpu-rasterization --enable-zero-copy --disable-gpu-driver-bug-workarounds heelowoorl commented on 2023-11-21 19:52 (UTC) @gregbunk unfortunately I tried many formats but they did not work no matter how I formatted them. only a single flag works even when they are space separated. heelowoorl commented on 2023-11-16 22:29 (UTC) Thanks for the reply I'm putting each flag on a single line maybe that's why. gregbunk commented on 2023-11-16 09:44 (UTC) Thanks for your work on this, @heelowoorl. I think this works as-is, with the flags on a single line. For example, my flags are: --disable-gpu-vsync --disable-gpu-driver-bug-workarounds --enable-features=VaapiVideoDecoder --ignore-gpu-blocklist --enable-gpu-rasterization --enable-zero-copy And when I run this command: brave-nightly foo It expands to: exec /opt/brave.com/brave-nightly/brave-browser --disable-gpu-vsync --disable-gpu-driver-bug-workarounds --enable-features=VaapiVideoDecoder --ignore-gpu-blocklist --enable-gpu-rasterization --enable-zero-copy --disable-gpu-driver-bug-workarounds foo Is that not what we want? 1 2 3 4 5 6 7 Next › Last » aurweb v6.2.16 Report issues here. Copyright © 2004-2025 aurweb Development Team. AUR packages are user produced content. Any use of the provided files is at your own risk.'''
