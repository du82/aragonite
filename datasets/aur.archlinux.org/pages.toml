full_description = '''العربية Asturianu Català Český Dansk Deutsch Ελληνικά English Español Español (Latinoamérica) Suomi Français עברית Hrvatski Magyar Italiano 日本語 Norsk Nederlands Polski Português (Brasil) Português (Portugal) Română Русский Slovenčina Srpski Türkçe Українська 简体中文 正體中文 AUR Home Packages Register Login Search Criteria Enter search criteria Search by Name, Description Name Only Package Base Exact Name Exact Package Base Keywords Maintainer Co-maintainer Maintainer, Co-maintainer Submitter Keywords Out of Date All Flagged Not Flagged Sort by Name Votes Popularity Voted Notify Maintainer Last modified Sort order Ascending Descending Per page 50 100 250 Go Orphans Package Details: google-cloud-cli-gke-gcloud-auth-plugin 513.0.0-1 Package Actions View PKGBUILD / View Changes Download snapshot Search wiki Git Clone URL: https://aur.archlinux.org/google-cloud-cli-gke-gcloud-auth-plugin.git (read-only, click to copy) Package Base: google-cloud-cli-gke-gcloud-auth-plugin Description: A google-cloud-cli component that provides a kubectl authentication plugin for GKE. Upstream URL: https://cloud.google.com/blog/products/containers-kubernetes/kubectl-auth-changes-in-gke Keywords: auth gcloud gke google kubectl plugin sdk Licenses: Apache-2.0 Submitter: rew1red Maintainer: rew1red Last Packager: rew1red Votes: 8 Popularity: 0.72 First Submitted: 2023-03-08 16:55 (UTC) Last Updated: 2025-03-05 14:42 (UTC) Dependencies (2) google-cloud-cliAUR (google-cloud-cli-liteAUR) kubectl (rancher-desktop-gitAUR, kbenv-binAUR, kubectl-binAUR, kuberlr-binAUR, rancher-desktopAUR) Required by (0) Sources (1) https://dl.google.com/dl/cloudsdk/release/downloads/for_packagers/linux/google-cloud-cli-gke-gcloud-auth-plugin_513.0.0.orig_amd64.tar.gz Latest Comments 1 2 Next › Last » mjboa commented on 2023-10-26 12:30 (UTC) Can we get rid of google-cloud-cli-gke-gcloud-auth-plugin.sh and google-cloud-cli-gke-gcloud-auth-plugin.install from this package now? Arch users are very unlikely to be using this package and kubectl < v1.26 vgs commented on 2023-08-21 12:22 (UTC) When I install with pamac it show next issue: $ pamac install google-cloud-cli-gke-gcloud-auth-plugin Warning: google-cloud-cli-gke-gcloud-auth-plugin is only available from AUR Preparing... Cloning google-cloud-cli-gke-gcloud-auth-plugin build files... Generating google-cloud-cli-gke-gcloud-auth-plugin information... ==> ERROR: install file (google-cloud-cli-gke-gcloud-auth-plugin.install) does not exist or is not a regular file. Error: Failed to prepare transaction: Failed to generate google-cloud-cli-gke-gcloud-auth-plugin information galdor commented on 2023-07-25 13:51 (UTC) FYI you have a typo in the PKGBUILD: "gooogle-cloud-sdk-gke-gcloud-auth-plugin" should be "google-cloud-sdk-gke-gcloud-auth-plugin" (extra 'o' at the beginning). meijin commented on 2023-03-12 20:35 (UTC) Please add a replace and/or conflict with google-cloud-sdk-gke-gcloud-auth-plugin rew1red commented on 2023-03-08 17:00 (UTC) Google decided to rename google-cloud-sdk to google-cloud-cli. When this happened, the packager of (google-cloud-sdk)[https://aur.archlinux.org/packages/google-cloud-sdk] created a new package, (google-cloud-cli)[https://aur.archlinux.org/packages/google-cloud-cli] to mirror Google's uneccesary name change. In order to keep this plugin consistent in naming, and to allow it to conform to the changed directory structure, this package, too, has been replaced with a new package: (google-cloud-cli-gke-gcloud-auth-plugin)[https://aur.archlinux.org/packages/google-cloud-cli-gke-gcloud-auth-plugin] rew1red commented on 2022-10-28 12:52 (UTC) Hey @deepu105-- It looks like pamac is trying to install this package as the root user, which when run is attempting to write something in /root/ (for which your current user does not have permission. This is probably unintended and undesirable. While I'm not personally familiar with pamac-- many of the AUR helper utilities activley discourage (or in the case of utilities like YAY-- flat out reject) any use as root. Does your installation work without using sudo? deepu105 commented on 2022-10-28 12:44 (UTC) Unable to install this package. I'm new to Arch ecosystem, started with Manjaro and when running sudo pamac install google-cloud-sdk-gke-gcloud-auth-plugin I get the below error I found this relevant issue https://github.com/sudoforge/pkgbuilds/issues/14 ==> Removing existing $srcdir/ directory... ==> Extracting sources... -> Extracting google-cloud-sdk_404.0.0.orig.tar.gz with bsdtar ==> Starting prepare()... ==> Entering fakeroot environment... ==> Starting package()... Traceback (most recent call last): File "/var/cache/private/pamac/google-cloud-sdk/pkg/google-cloud-sdk/opt/google-cloud-sdk/lib/googlecloudsdk/core/util/files.py", line 1299, in _FileOpener return io.open(path, mode, encoding=encoding, newline=newline) PermissionError: [Errno 13] Permission denied: '/root/.config/gcloud/active_config' During handling of the above exception, another exception occurred: Traceback (most recent call last): File "/var/cache/private/pamac/google-cloud-sdk/pkg/google-cloud-sdk/opt/google-cloud-sdk/lib/googlecloudsdk/core/configurations/named_configs.py", line 537, in _ActiveConfigNameFromFile config_name = file_utils.ReadFileContents(path) File "/var/cache/private/pamac/google-cloud-sdk/pkg/google-cloud-sdk/opt/google-cloud-sdk/lib/googlecloudsdk/core/util/files.py", line 1076, in ReadFileContents with FileReader(path) as f: File "/var/cache/private/pamac/google-cloud-sdk/pkg/google-cloud-sdk/opt/google-cloud-sdk/lib/googlecloudsdk/core/util/files.py", line 1200, in FileReader return _FileOpener(path, 'rt', 'read', encoding='utf-8') File "/var/cache/private/pamac/google-cloud-sdk/pkg/google-cloud-sdk/opt/google-cloud-sdk/lib/googlecloudsdk/core/util/files.py", line 1306, in _FileOpener raise exc_type('Unable to {0} file [{1}]: {2}'.format(verb, path, e)) googlecloudsdk.core.util.files.Error: Unable to read file [/root/.config/gcloud/active_config]: [Errno 13] Permission denied: '/root/.config/gcloud/active_config' During handling of the above exception, another exception occurred: Traceback (most recent call last): File "/var/cache/private/pamac/google-cloud-sdk/pkg/google-cloud-sdk/opt/google-cloud-sdk/bin/bootstrapping/install.py", line 12, in <module> import bootstrapping File "/var/cache/private/pamac/google-cloud-sdk/pkg/google-cloud-sdk/opt/google-cloud-sdk/bin/bootstrapping/bootstrapping.py", line 46, in <module> from googlecloudsdk.core import execution_utils File "/var/cache/private/pamac/google-cloud-sdk/pkg/google-cloud-sdk/opt/google-cloud-sdk/lib/googlecloudsdk/core/execution_utils.py", line 37, in <module> from googlecloudsdk.core import log File "/var/cache/private/pamac/google-cloud-sdk/pkg/google-cloud-sdk/opt/google-cloud-sdk/lib/googlecloudsdk/core/log.py", line 849, in <module> _log_manager = _LogManager() File "/var/cache/private/pamac/google-cloud-sdk/pkg/google-cloud-sdk/opt/google-cloud-sdk/lib/googlecloudsdk/core/log.py", line 584, in __init__ self.Reset(sys.stdout, sys.stderr) File "/var/cache/private/pamac/google-cloud-sdk/pkg/google-cloud-sdk/opt/google-cloud-sdk/lib/googlecloudsdk/core/log.py", line 597, in Reset std_console_formatter = _ConsoleFormatter(stderr) File "/var/cache/private/pamac/google-cloud-sdk/pkg/google-cloud-sdk/opt/google-cloud-sdk/lib/googlecloudsdk/core/log.py", line 371, in __init__ console_log_format = properties.VALUES.core.console_log_format.Get() File "/var/cache/private/pamac/google-cloud-sdk/pkg/google-cloud-sdk/opt/google-cloud-sdk/lib/googlecloudsdk/core/properties.py", line 3485, in Get property_value = self.GetPropertyValue(required, validate) File "/var/cache/private/pamac/google-cloud-sdk/pkg/google-cloud-sdk/opt/google-cloud-sdk/lib/googlecloudsdk/core/properties.py", line 3505, in GetPropertyValue named_configs.ActivePropertiesFile.Load(), File "/var/cache/private/pamac/google-cloud-sdk/pkg/google-cloud-sdk/opt/google-cloud-sdk/lib/googlecloudsdk/core/configurations/named_configs.py", line 448, in Load [config.Paths().installation_properties_path, ActiveConfig( File "/var/cache/private/pamac/google-cloud-sdk/pkg/google-cloud-sdk/opt/google-cloud-sdk/lib/googlecloudsdk/core/configurations/named_configs.py", line 488, in ActiveConfig config_name = _EffectiveActiveConfigName() File "/var/cache/private/pamac/google-cloud-sdk/pkg/google-cloud-sdk/opt/google-cloud-sdk/lib/googlecloudsdk/core/configurations/named_configs.py", line 513, in _EffectiveActiveConfigName config_name = _ActiveConfigNameFromFile() File "/var/cache/private/pamac/google-cloud-sdk/pkg/google-cloud-sdk/opt/google-cloud-sdk/lib/googlecloudsdk/core/configurations/named_configs.py", line 549, in _ActiveConfigNameFromFile raise NamedConfigFileAccessError( googlecloudsdk.core.configurations.named_configs.NamedConfigFileAccessError: Active configuration name could not be read from: [/root/.config/gcloud/active_config]. Ensure you have sufficient read permissions on required active configuration in [/root/.config/gcloud/configurations]. Unable to read file [/root/.config/gcloud/active_config]: [Errno 13] Permission denied: '/root/.config/gcloud/active_config' ==> ERROR: A failure occurred in package(). Aborting... Finished with result: exit-code Main processes terminated with: code=exited/status=4 gromez commented on 2022-06-17 07:42 (UTC) OK, I found the issue with my config, I added USE_GKE_GCLOUD_AUTH_PLUGIN=True in my .bashrc but I forgot to export it, so with export USE_GKE_GCLOUD_AUTH_PLUGIN=True, it works like a charm. Bluesboy commented on 2022-06-15 17:23 (UTC) For those who still getting deprecation messages even after you installed this plugin, you need to create environment variable USE_GKE_GCLOUD_AUTH_PLUGIN with True value and after that renew k8s config with gcloud container clusters get-credentials <cluster_name> --region <region> after that everything should be fine. gromez commented on 2022-06-15 14:29 (UTC) (edited on 2022-06-15 14:44 (UTC) by gromez) Here is the output with community/kubectl $ $ echo $USE_GKE_GCLOUD_AUTH_PLUGIN True $ kubectl get pods W0615 16:21:23.248731 267602 gcp.go:120] WARNING: the gcp auth plugin is deprecated in v1.22+, unavailable in v1.25+; use gcloud instead. To learn more, consult https://cloud.google.com/blog/products/containers-kubernetes/kubectl-auth-changes-in-gke $ kubectl version W0615 16:24:02.725448 267984 gcp.go:120] WARNING: the gcp auth plugin is deprecated in v1.22+, unavailable in v1.25+; use gcloud instead. To learn more, consult https://cloud.google.com/blog/products/containers-kubernetes/kubectl-auth-changes-in-gke WARNING: This version information is deprecated and will be replaced with the output from kubectl version --short. Use --output=yaml|json to get the full version. Client Version: version.Info{Major:"1", Minor:"24", GitVersion:"v1.24.1", GitCommit:"3ddd0f45aa91e2f30c70734b175631bec5b5825a", GitTreeState:"archive", BuildDate:"2022-05-27T18:33:09Z", GoVersion:"go1.18.2", Compiler:"gc", Platform:"linux/amd64"} Kustomize Version: v4.5.4 Server Version: version.Info{Major:"1", Minor:"23", GitVersion:"v1.23.5-gke.1501", GitCommit:"d722d90777bdbd0ce2bbe9c16e970738fba5cabc", GitTreeState:"clean", BuildDate:"2022-04-15T02:20:45Z", GoVersion:"go1.17.8b7", Compiler:"gc", Platform:"linux/amd64"} With aur/kubectl-gke-stable-bin I don't have this issue but maybe it's only because it's an old version (1.21.13) and warning is not managed. And I have installed gcloud with aur/google-cloud-sdk. 1 2 Next › Last » aurweb v6.2.16 Report issues here. Copyright © 2004-2025 aurweb Development Team. AUR packages are user produced content. Any use of the provided files is at your own risk.'''
