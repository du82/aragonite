title = "Profile for vlad - Aussie Bushwalking"
description = "Aussie Bushwalking profile for vlad"
full_description = "This Year 0 Number of Walks Ticked 0.0m Total Distance Ticked All Time 18 Number of Walks Ticked 95.4km Total Distance Ticked Ticks Name Date Difficulty Distance/Duration Mt Warning Summit Trail (Wollumbin National Park) 8 Mar, 2020 Hard 8.3km return 5 hrs i have been hiking for a while ,just joined this site so wanting to put some of my walks on. it was a hard one, i was 53 and i hadn't done any hiking for a few years so found it tough especially the last 1/3 to the top had a few breaks but got there :) a bit too busy for my liking a lot of people there so getting a car park is hard so get in early for an early start, i camped at the bottom at the camping ground so it was nice we did OK for the time i'm not that fit anymore but we still made it a fair bit under the recommended time, personally i was underwhelmed with the view in my opinion at my stage in life not really worth the effort unless you want to say you have done it for picturesque scenery i would do Bunya mountains and other rain forest walks before this unless its on your list to do :) Table Top Loop (Toowoomba) 8 Mar, 2020 Hard 2km return 2 hrs again ticking off walks as i have just joined been hiking for a while this was a fair bit of rock hopping and the last scramble up the rocks to the top you have to be careful :) i can see how some people slip but if ya take care ya should be ok no rushing :) we did it from toowoomba side :) Pardalote Walk (Toowoomba) 8 Mar, 2020 Easy 1.9km one-way 1 hr nice stroll :) Picnic Point to Table Top (Toowoomba) 8 Mar, 2020 Hard 12km return 4 hrs did the picnic point section separate to the table top . would only class the table top part as hard the other section is just long, was ok but not that nice for scenery in my opinion Noosa Headland Circuit (Sunshine Coast) 8 Mar, 2020 Easy 7.3km return 2.5 hrs done this many a time :) its easy but you can make it as hard as you want by pushing yourself to do it quicker :) always a great view but ya got to get in early for an early start as parking is impossible even after 7am on some days it can get quite busy Hell's Gates (Sunshine Coast) 8 Mar, 2020 Easy 5.4km return 90 mins great view for a relaxing walk get in early to get a park can get very busy Somerset Trail (D'Aguilar National Park) 8 Mar, 2020 Medium 13km return 3 hrs easy stroll but got a bit of distance there is a nice lookout at the end to overlook the dams :) ok to do but if you have a 4x4 or a bit of a bush basher car ya can drive to the lookout and get the view with out the effort LoL nice place to picnic at the gantry :) Bulls Falls (D'Aguilar National Park) 8 Mar, 2020 Easy 1.1km return 30 mins great to do with family or just for a short walk have a picnic at the gantry and makes a great arvo or morning :) Uluru Base Walk (Uluru-Kata Tjuta National Park) 8 Mar, 2020 Easy 11.8km return 4 hrs i would hardly say its medium just long , do it early like any other walk take water as usual not much to see rock to the left or right depending on which way ya start lol sparse trees to the other . on the northen side you don't get that close to the rock for local reasons :( not sure what we would see or not alowed to see in my oppinion not worth the long walk you can drive around and see just as much and pull in in a few lookouts along the way . we did it cause the climb was closed due to winds :( when we got near the end we saw the climb open so it was worth it instead of sitting in the car and waiting . other wise i recommend the Olga's but the pick is kings canyon just north :) Southern Wall Walk (Watarrka National Park) 8 Sep, 2019 Medium 4.5km return 2 hrs great views must do if you are in the area my pick over the Olga's and Ayers rock walks Devil's Peak Trail (South Australia) 8 Sep, 2019 Hard 2.4km return 3 hrs did this on the way back from Ayers rock to bris was cool in September love it was nice with nice views worth a detour :) Walpa Gorge (Uluru-Kata Tjuta National Park) 8 Sep, 2019 Easy 2.9km return 75 mins nice views of cliffs but not much more we went out through the back and around the long way back to the car but wasn't really worth the walk i would recommend just walk in to see the cliffs and walk out again :) Valley Of the Winds (Uluru-Kata Tjuta National Park) 8 Sep, 2019 Medium 7.4km return 2.5 hrs did this but would not bother again would only recommend the short walk here unless you like walking without much to look at a bit like going around the base of Ayers rock just sparse bush Uluru Summit (Uluru-Kata Tjuta National Park) 8 Sep, 2019 Hard 3.5km return 3 hrs it was challenging in parts but not as bad as a lot of people make out especially the media :( i am glad we did it for the sake of doing it before the closure :) did it with my kids 27y & 26y great views though :D especially to the Olga's we did it respectfully i feel and a shame more people can't experience it now :( walking around the base was ok sparse bush but not worth the distance to go to the rock if you can't climb it anymore :( Mala Walk (Uluru-Kata Tjuta National Park) 8 Sep, 2019 Easy 2km return 1 hr ok not a great deal to see sparse bush and a few open caves Kings Canyon Rim Walk (Watarrka National Park) 8 Sep, 2019 Medium 6.6km return 4 hrs hands down the best walk over the Olga's and Ayers rock Must do if you are near there i would defiantly make the detour to here spectacular views the first part is straight up but if you pace yourself and make it past that with a few stops you will be glad you did the highlight form my trip to Ayers rock Baldwin Swamp (Wide Bay Burnett) Sometime... Easy 3.3km return 1 hr nice stroll if your near :) « Ticks 1-17 of 17 »"
