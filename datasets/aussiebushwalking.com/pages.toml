description = """
Carrolls Creek Loop - Trailhead at Bald Rock day use area.
Walk includes Little Bald Rock and two creek crossings (sturdy bridges). 4km are on the Bald Rock access road"""
full_description = "Menu Edit this walk Navigate to... Trailhead at Bald Rock day use area.Walk includes Little Bald Rock and two creek crossings (sturdy bridges). 4km are on the Bald Rock access road Lookouts Picnic Facilities BBQ Toilets No Dogs Permitted Camping Permitted Swamp or Wetland Eucalypt Forest Add to My Wishlist Remove fromMy Wishlist Tick Walk (adsbygoogle = window.adsbygoogle || []).push({}); Getting there How do you get to the start of the walk? From Tenterfield take the Mount Lindesay Road north and then turn left into Bald Rock Access Road and follow this for 5km to the car park and picnic area. From Stanthorpe drive towards Amosfield, then south along the Woodenbong Road/Mount Lindesay Road towards Tenterfield. The road is partially unsealed, with the turnoff into Bald Rock Access Road on the right. Maps Which maps cover the area? Route/Trail notes A detailed description of the walk! Permits/Costs Do you need any permits? What's the cost? Other References How can I find more info? Any guide books? GPS Tracks No GPS available for this walk yet. Comments Little Bald Rock is the highlight you want to enjoy with a bit of time. Wanderlust on 27 Jan, 2025 « Comments 0-1 of 1 » Tick this walk and add your own comments (adsbygoogle = window.adsbygoogle || []).push({}); This will report the image to moderators for review. Are you sure this image is offensive? Aussie Bushwalking users can maintain a wishlist of walks for you but you need to be a member. Click here to login if you're already a member, otherwise go here to register for your free account. Navigation to some bushwalks can be difficult. Automated navigation using Google Maps or Apple Maps may not be accurate. Additionally, Aussie Bushwalking doesn't always have accurate positions for where to park for a walk. Please read the walk description for special directions and take extra care. Medium 19.7km return 4.5hrs These values are provided by users. Your evaluation may differ. Where Click here to