full_description = "This Year 0 Number of Walks Ticked 0.0m Total Distance Ticked All Time 11 Number of Walks Ticked 66.2km Total Distance Ticked Ticks Name Date Difficulty Distance/Duration Mount Tibrogargan Summit (Glass House Mountains National Park) 30 Sep, 2019 Very Hard 2.7km return 2 hrs Absolutely loved every minute of the challenge. Not much margin for error on this beauty Mt Warning Summit Trail (Wollumbin National Park) 26 Sep, 2019 Hard 8.3km return 5 hrs Was engulfed in cloud and missed the sunrise Mt Ngungun (Glass House Mountains National Park) 12 Sep, 2019 Medium 2.8km return 90 mins Nice new track Mt Cordeaux (Main Range National Park) Sep, 2019 Medium 6.8km return 2.5 hrs Nice easy hike Bare Rock track and Morgan's Walk (Main Range National Park) Sep, 2019 Medium 13km 4.5 hrs Linked it in with caudeaux nice and pleseant Mount Beerwah (Glass House Mountains National Park) Sep, 2019 Very Hard 3.6km return 3 hrs Absolutely magical!!! Mt Barney - East Peak - South Ridge (Mt Barney National Park) 14 Aug, 2019 Very Hard 17km return 10 hrs Challenging and rewarding mountain!Had cloud engulf the mountain and then micro hail stones hit us out of nowhere making everything just a dificult to descend Mount Coolum (Sunshine Coast) 24 Jul, 2019 Medium 2.6km return 90 mins Tough little mountain with gorgeous views of the coast Mt Cooroora (Sunshine Coast) 24 Jul, 2019 Hard 2.6km return 2.5 hrs Absolutely love this mountain. Pushes the fitness and have to think on foot placement. Stunning views!!! Mt Ninderry (Sunshine Coast) 23 Jul, 2019 Medium 3.3km return 90 mins Small but quite enjoyable views Mount Beerburrum (Glass House Mountains National Park) 23 Jul, 2019 Medium 3.5km return 90 mins Paved but very steep little mountain with rewarding views at the summit « Ticks 1-11 of 11 »"
