["https://aussiebushwalking.com/qld/se-qld/brisbane-forest-park-d-aguilar-np/mt-coot-tha/mahogany-trail"]
title = "Mahogany Trail - Aussie Bushwalking"
description = "Mahogany Trail - An alternate track to the Summit Trail at Mt Cootha Brisbane that is shared with bikes and horse riders"
full_description = "Menu Edit this walk Navigate to... An alternate track to the Summit Trail at Mt Cootha Brisbane that is shared with bikes and horse riders Bird Watching Picnic Facilities BBQ Toilets Dogs Permitted Horses Permitted Cycling Permitted Eucalypt Forest Add to My Wishlist Remove fromMy Wishlist Tick Walk (adsbygoogle = window.adsbygoogle || []).push({}); Getting there This walk begins at JC Slaughter Falls Picnic Area, to the left of the driveway, about a quarter of the way along Maps https://www.brisbane.qld.gov.au/sites/default/files/20160729-mt_coot-tha_forest_track_map.pdf Route/Trail notes This track is quite wide and well kept. It is of an uphill grade from JC Slaughter Falls Picnic Area to the Summit where there is a cafe and gift shop. There are mild humps all the way along, probably for the benefit of bike riders. You can choose to return either by the same route or by the Summit trail which heads back from the same place at the top and returns to the far end of the picnic area. Permits/Costs No costs required. Other References How can I find more info? Any guide books? GPS Tracks No GPS available for this walk yet. Comments Started at the top and walked to J.C Slaughter Falls. A wide graded track with humps at intervals for cyclists. An easy walk although the surface was a little loose in places. Trev C on 21 Jul, 2021 I am a 12yr old who is writing a review on the Summit and Mahogany trail in Mt Coot-tha. When we did this trail we went up the Summit trail and down the Mahogany trail. Talking about the Summit trail, this trail is 1.9KM till the lookout at the top. When we went up it was steep the whole way up, but the track is wide and well marked and there are water drinking fountains to drink out of the whole way up, there are also ones for dogs too. When you get to the top you can walk up the road to the top of the hill and you can get a really good view of the whole city. You can also get some lunch and ice cream up there too, and there is also a souvenir shop there where you can get a souvenir. When you go back down, the Mahogany trail will be next to the map of Mt Coot-Tha. The track should be a wide dirt track, and really steep downhill. This track is around 2.6KM long till you get the picnic area. When you are walking down the Mahogany trail be aware of Mountain bikes because this is a horse and Mt bike trail too, and you might think this trail will be all downhill but don't be deceived like I said this is a horse and Mt bike trail too. Unlike the Summit trail the Mahogany trail does not have any drinking fountains and it is an extra 700m than the Summit trail to the bottom. We didn't have a picnic but it will be nice to have one at the end because there are lots of nice picnic areas around JC Slaughter Falls Picnic Area, there are also BBQs there too to cook some bacon and eggs. Even though it's only 4.5KM it is still really bone aching walk and your bones will be really tired the next day. BTW, the Summit trail is No.(58) and the Mahogany trail is No.(66) on the Brisbane City Council map. Hope this info is useful and have a nice day! XD TheN8tureBoy on 2 Jul, 2020 I did the Summit Track on the way up and Mahogany Trail on the way down (I parked at the beginning of JC Slaughter Falls picnic area). All up was 5.5km and took me 1 hour (not including stopping at the lookout at the top). The Summit Track was busy, lots of small children and dogs, so is not a very peaceful walk if you're looking for that. Mahogany Trail on the way back had less people but is more of a rocky track (good for mountain bike riding I would expect). The lookout was VERY busy but a great view of the city. Glad I've done it but probably won't do it again as I like my walks a bit more peaceful and in nature. ChasingWaterfalls on 13 Jun, 2020 Great summit hike - I preferred this to the proper Cootha Summit track. Gentle rise virtually the whole way, good views, less populated than Summit. 30 minutes up, 20 minutes down jogging. Shaun on 20 Feb, 2020 Up mahogany track good hill climb 40 min Kmxfitness on 23 Aug, 2019 This walk was extremely busy today, compounded by a public holiday and the temporary closure of the summit trail. Regardless it was a very pleasant walk to the lookout and back. The trailhead was very easy to find due to additional signage diverting summit trail traffic to this trailhead otherwise it wouldn't have been so easy. Look for one of the map locations on the left as you drive in. It's not very far from the main entrance just past the first main car park. Bobbe on 25 Apr, 2019 This walk was extremely busy today, compounded by a public holiday and the temporary closure of the summit trail. Regardless it was a very pleasant walk to the lookout and back. The trailhead was very easy to find due to additional signage diverting summit trail traffic to this trailhead otherwise it wouldn't have been so easy. Look for one of the map locations on the left as you drive in. It's not very far from the main entrance just past the first main car park. Bobbe on 25 Apr, 2019 Walked this trail on the way down after the summit trail. Easy walk, nice and peaceful. Only saw a handful of people around, though I was there during the day on a Monday. Daisy on 17 Sep, 2018 We descended from the summit via this track (after doing the aboriginal art trail and summit track). It’s a wide dirt track. The kids were pleased for the loose gravel under foot as a change from the well trodden summit track. But do be careful not to slip on any loose dry areas. Otherwise it’s an easy track to descend. The Pages and co on 15 Apr, 2018 We took this one on the way down from doing the Summit track. It was a really pleasant way to go back. There were lots of people there and everyone was so lovely. I wouldn't take my dog though as a few people have their dogs walk without leads. Moveurmojo on 21 Jan, 2018 Walked back on Mahogany after walking up to Summit from JC Slaughter Falls on the Summit Trail. Easy walk. Pleasant couple of hours all up with a coffee at the Summit Cafe. Bruce on 15 May, 2017 Would be a bit boring on its own but combined with the Summit Trail makes a nice walk luvwalking on 15 Apr, 2017 It was way too hot for doing this walk today. We were so grateful for the cafe at the Summit to pick up an ice block and cold drink. We took the Summit Trail on the way back. Ian and Sue on 21 Jan, 2017 « Comments 0-13 of 13 » Tick this walk and add your own comments (adsbygoogle = window.adsbygoogle || []).push({}); This will report the image to moderators for review. Are you sure this image is offensive? Aussie Bushwalking users can maintain a wishlist of walks for you but you need to be a member. Click here to login if you're already a member, otherwise go here to register for your free account. Navigation to some bushwalks can be difficult. Automated navigation using Google Maps or Apple Maps may not be accurate. Additionally, Aussie Bushwalking doesn't always have accurate positions for where to park for a walk. Please read the walk description for special directions and take extra care. Medium 2.6km one-way 40mins These values are provided by users. Your evaluation may differ. Where Click here to load this map. Nearby Walks JC Slaughter Falls (Mt. Coot-tha) Powerful Owl Trail (Mt. Coot-tha) Australian Rainforest Trail (Mt. Coot-tha) Botanic Gardens to Mt Coot-tha (Mt. Coot-tha) Aboriginal Artwork Track/ Hoop Pine Trail (Mt. Coot-tha) Done this walk? This walk has been ticked 74 times Aussie Bushwalking can keep track of your bushwalks. Login/signup to tick this walk off."
