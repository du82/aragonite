full_description = '''Menu Edit this walk Navigate to... A steep, short walk between Channel 9 and the Bellbird Trail. Eucalypt Forest Add to My Wishlist Remove fromMy Wishlist Tick Walk (adsbygoogle = window.adsbygoogle || []).push({}); Getting there Either access from Channel 9 on Samuel Smith Drive or from the Gap Creek Reserve Maps BCC Mt. Cootha map Route/Trail notes Short and steep. Permits/Costs None required GPS Tracks No GPS available for this walk yet. Comments Excellent work out. Not recommended downhill. Wanderlust on 16 Feb, 2025 Bloody steep, I started running and that didn’t last long🤣Then I was puffed the rest of the way walking. Should have know. By the name of the trail!!! Good workout on the calves. Kent on 7 Mar, 2022 Very steep. Go down, not up! Clem on 18 Dec, 2020 Only went upwards, very steep incline the entire way, a great challenge. ebbers on 10 Aug, 2019 Steep with loose gravel Jason on 19 Apr, 2019 Wicked Steep slowpoke on 31 Mar, 2018 Short, steep and great drewmac on 28 Oct, 2017 Agree with the previous comments. I wouldn't rate this track as hard apart from the steep uphill section. This section has lots of loose rock so good boots/ shoes are a must. Walking poles are an advantage. Gave me a good workout as I started the walk mid morning. Whew! Bit hot😅 Woody on 15 Aug, 2017 Took our time up - plenty of rests. Up in 30 minutes and back down in 15. It is quite steep, and solid shoes are a must. Bruce on 17 May, 2017 Honestly, this should not be in the "hard" basket. Was a lovely walk, quite a pretty trail... However my heart rate wasn't really pushed and the view rewards you get from other walks were non existent. Pretty, but not worth a drive if you aren't close by. Brad on 30 Nov, 2016 Pree steep, not recommendable for people who consider themselves unfit, otherwise, very short. Federico on 10 Feb, 2016 « Comments 0-11 of 11 » Tick this walk and add your own comments (adsbygoogle = window.adsbygoogle || []).push({}); This will report 