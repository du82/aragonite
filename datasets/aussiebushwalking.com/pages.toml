full_description = "This Year 0 Number of Walks Ticked 0.0m Total Distance Ticked All Time 2 Number of Walks Ticked 10.9km Total Distance Ticked Ticks Name Date Difficulty Distance/Duration Mt Cooroora (Sunshine Coast) 24 Aug, 2019 Hard 2.6km return 2.5 hrs My favourite walk by far to date. I’ve done this four times. I keep going back as this is absolute heart pounding. Stamina galore. It’s not dangerous at all. Light scrambling. There are three sets of stairs you need to get over then then about a 5 minutes scramble. Love it, love it, love it. It’s tough, but only on legs and heart. Mt Warning Summit Trail (Wollumbin National Park) 17 Aug, 2019 Hard 8.3km return 5 hrs If you’re used to walking this is extremely easy walk. I don’t like it at all. The scramble in the end is level 1. You can hardly call it scrambling. It took me 3 hours and 10 mins, and I spent like 15 mins on the top and was bored. Don’t run up or down, you’re likely to get injured. « Ticks 1-2 of 2 »"
