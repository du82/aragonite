["https://aussiebushwalking.com/nsw/bald-rock-national-park/border-walk-loop"]
title = "Border Walk Loop - Aussie Bushwalking"
description = "Border Walk Loop - Easy walk along the New South Wales and Queensland border."
full_description = '''Menu Edit this walk Navigate to... GPS Tracks Border walk loop (GPX) Easy walk along the New South Wales and Queensland border. Lookouts Bird Watching Picnic Facilities BBQ Toilets No Dogs Permitted Camping Permitted Eucalypt Forest 1179m Maximum Elevation 207m Total Climb Add to My Wishlist Remove fromMy Wishlist Tick Walk (adsbygoogle = window.adsbygoogle || []).push({}); Getting There: From Tenterfield take the Mount Lindesay Road north and then turn left into Bald Rock Access Road and follow this for 5km to the car park and picnic area. From Stanthorpe drive towards Amosfield, then south along the Woodenbong Road/Mount Lindesay Road towards Tenterfield. The road is partially unsealed, with the turnoff into Bald Rock Access Road on the right. Maps: Bald Rock National Park Route/Trail Notes: Take the Little Bald Rock track, 1km down the path you get to a Y Junction indicating Little Bald Rock to your left and Border trails to your right. All route is clearly signposted. 7km down the road from here you have another junction with the options to go up 1km to the Northern Viewpoint to panoramic views of Bald Rock, then backtrack to the junction and carry on to Bald Rock Campsite. Permits/Costs: National Park entry fee applies (2023 = $8 per vehicle/day). Park entry fees and camping permits can only be purchased online from National Parks NSW. The campgrounds are just behind the car park. Other References/Commets: Not very popular walk, we did not meet any another person and it was during the Labour Day weekend. A LOT of mosquitoes in October. GPS Tracks Border walk loop (GPX) Comments Make sure not to miss the Bookookoorara Lookout detour. Wanderlust on 26 Jan, 2025 Really enjoyed this 14km walk - it's a super pleasant stroll through varying landscapes - predominantly tall gum forests. The track is very well maintained and comfortably soft under foot. A good walk to stretch the legs without having to push through hectic hills - it's a pretty easy day out and just perfect if you feel the need to get some distance in the legs without having to exert huge amounts of energy. There's an 18km walk that starts from the same place here in Bald Rock - it's called the "Carrolls Creek" walk - if you feel you need an extra 4km. Bald Rock National Park is sensational - situated around 27km from Tenterfield on a very well maintained, sealed road. What a beautiful part of the world this is!! Bush Talker on 29 May, 2018 « Comments 0-2 of 2 » Tick this walk and add your own comments (adsbygoogle = window.adsbygoogle || []).push({}); This will report the image to moderators for review. Are you sure this image is offensive? Aussie Bushwalking users can maintain a wishlist of walks for you but you need to be a member. Click here to login if you're already a member, otherwise go here to register for your free account. Navigation to some bushwalks can be difficult. Automated navigation using Google Maps or Apple Maps may not be accurate. Additionally, Aussie Bushwalking doesn't always have accurate positions for where to park for a walk. Please read the walk description for special directions and take extra care. Medium 14.2km return 3.5hrs These values are provided by users. Your evaluation may differ. Where Click here to load this map. Nearby Walks Bungoona Walk (Bald Rock National Park) Bald Rock Summit (Bald Rock National Park) Little Bald Rock (Bald Rock National Park) Carrolls Creek Loop (Bald Rock National Park) Aztec Temple (Girraween National Park) Done this walk? This walk has been ticked 9 times Aussie Bushwalking can keep track of your bushwalks. Login/signup to tick this walk off.'''
