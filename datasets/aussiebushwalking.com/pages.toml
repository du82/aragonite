description = "Birnam Range - Walk along the spine of the Birnam Range. The trail along the range stretches for 7-8kms starting in the South from the end of Monmouth Ct or the main Mundoolun Road and finishing in the North at Currawong Ct. Outlined in this walk is a section of the trail along the highest part of the range starting from and returning to Mona Dr which is one of a few additional enterance points."
full_description = "Menu Edit this walk Navigate to... Walk along the spine of the Birnam Range. The trail along the range stretches for 7-8kms starting in the South from the end of Monmouth Ct or the main Mundoolun Road and finishing in the North at Currawong Ct. Outlined in this walk is a section of the trail along the highest part of the range starting from and returning to Mona Dr which is one of a few additional enterance points. Lookouts Eucalypt Forest 243m Maximum Elevation 299m Total Climb Add to My Wishlist Remove fromMy Wishlist Tick Walk (adsbygoogle = window.adsbygoogle || []).push({}); Getting there How do you get to the start of the walk? Many access points as described in overview although as outlined here this walk starts at Mona Dr. Maps Which maps cover the area? Maps of Birnam Range Route/Trail notes A detailed description of the walk! From Mona Dr walk the short trail up onto the spine of the Birnam Range and turn left. You shall now be heading roughly Northeast up the spine of the range to its highest point. Once reached retrace steps. Permits/Costs Do you need any permits? What's the cost? Free Other References How can I find more info? Any guide books? GPS Tracks No GPS available for this walk yet. Comments Nobody has commented on this walk yet. If you've done it then tick it off and add a comment. Tick this walk and add your own comments (adsbygoogle = window.adsbygoogle || []).push({}); This will report the image to moderators for review. Are you sure this image is offensive? Aussie Bushwalking users can maintain a wishlist of walks for you but you need to be a member. Click here to login if you're already a member, otherwise go here to register for your free account. Navigation to some bushwalks can be difficult. Automated navigation using Google Maps or Apple Maps may not be accurate. Additionally, Aussie Bushwalking doesn't always have accurate positions for where to park for a walk. Please read the walk description for special direction