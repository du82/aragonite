["https://aussiebushwalking.com/qld/wide-bay-burnett/mt-walsh-np/mt-walsh-waterfall-creek-utopia-falls-"]
title = "Mt Walsh Waterfall Creek (Utopia Falls) - Aussie Bushwalking"
description = """
Mt Walsh Waterfall Creek (Utopia Falls) - This pleasant moderate grade walk to the rock pool area—a nice place to picnic, cool off in the shade beside the rock pools or just enjoy nature. 
The walk begins in hoop pine dominated dry rainforest and vine thickets fringing a moist gully. Further on, open forests and grassy woodlands feature and merge into shrubby heath along Waterfall Creek.
The creek cascades through a series of rock pools that have potholed into the granite by years of water erosion. Cabbage palms, (Livistona decora), growing near the rock pools occur here at their most western limit. Further along Waterfall Creek, impressive water gums, (Tristaniopsis laurina), grow to over 25m high and wrap buttressed roots around rocks.
Look for wildlife as you walk. You might see wonga pigeons in the dark shaded understorey of the rainforest or catch a glimpse of white-throated treecreepers in the open forest and woodland. Swamp wallabies also use the track and red-necked wallabies often feed around the rainforest fringes.
Caution is required when accessing the creek as rocks may be slippery and unstable."""
full_description = "Menu Edit this walk Navigate to... GPS Tracks Waterfall Creek and Utopia Falls Track (GPX) This pleasant moderate grade walk to the rock pool area—a nice place to picnic, cool off in the shade beside the rock pools or just enjoy nature. The walk begins in hoop pine dominated dry rainforest and vine thickets fringing a moist gully. Further on, open forests and grassy woodlands feature and merge into shrubby heath along Waterfall Creek.The creek cascades through a series of rock pools that have potholed into the granite by years of water erosion. Cabbage palms, (Livistona decora), growing near the rock pools occur here at their most western limit. Further along Waterfall Creek, impressive water gums, (Tristaniopsis laurina), grow to over 25m high and wrap buttressed roots around rocks.Look for wildlife as you walk. You might see wonga pigeons in the dark shaded understorey of the rainforest or catch a glimpse of white-throated treecreepers in the open forest and woodland. Swamp wallabies also use the track and red-necked wallabies often feed around the rainforest fringes.Caution is required when accessing the creek as rocks may be slippery and unstable. Waterfalls Swimming No Dogs Permitted No Camping Permitted Add to My Wishlist Remove fromMy Wishlist Tick Walk (adsbygoogle = window.adsbygoogle || []).push({}); Getting there Waterfall Creek car park Utopia Road off Innooroolbar Rd Maps Qld Park and Services Route/Trail notes A detailed description of the walk! Permits/Cost None. Other References How can I find more info? Any guide books? GPS Tracks Waterfall Creek and Utopia Falls Track (GPX) Comments Went there to enjoy the waterfall. Bruno on 6 Jan, 2022 Easy walk to the rock pool area. Starts in dry rainforest and parallels the gully. There are a series of granite rock pools with cascading water. Care needs to be taken on the rocks. David Eke on 12 Apr, 2021 Great easy walk with an inviting swim when you arrive always best after some good rain to freshen up the rock pools. Greg on 27 Mar, 2021 I did this walk recently and found the rock pools were quite full, however the cascades had slowed to a trickle. It says about an hour return on the sign at the car park but if you are moderately fit, it is obviously a lot quicker. I think half an hour each way is not a bad estimate. The walk to and from the rock pools varies in terrain, that it is both uphill and downhill and there's some negotiating of rocks once you arrive at the creek where the rock pools are located. I would say the walk is relatively easy but some care is required at the pools. Lots of loose rock underfoot and around the pools it can get slippery. An absolutely beautiful place to take in the rugged and rocky mountain tops and surrounding bushland . Highly recommend this walk due to it being a short walk to such a special and natural place . My navigation app told me to turn left twice upon arriving at the National Park which I soon realised I should ignore because both turns lead to private property. Just follow the main road and signs all the way to the car park and take it slow if driving a 2WD vehicle when entering the car park. Wayne's Walking Adventures on 19 Aug, 2020 Lovely track to warm up our stiff legs after doing Mt Walsh Tassels track. EchidnaScout on 19 Jul, 2020 Quite an easy walk to the rock pools. Beautiful to look at and wonderful to swim in. Very popular and welcoming to all ages. I will be bringing the kids next time. Renee Thomas on 7 Mar, 2020 Short hot walk loads of butterflies , great swimming holes Dave on 22 Feb, 2020 Easy walk to the falls, and you take the same track back to the parking lot. Beautiful place to go for a swim. Wish I went during summer! Tegan Atkins on 29 Jun, 2019 It took me a long time to figure how to get here. So many different directions. I finally made it. To get here you don't need a 4wd like some say. Maybe if there was a lot of rain. Anyway we parked at the entry. I set my walking app. It told me I had done 4.33klms (remember this is an app so is probably wrong still ) and took me a little over 2 hours. Reason being I have bad legs so I go slow besides I am in no hurry. When we got there it was beautiful. An enjoyable walk. It's amazing what you see when going that bit slower. Patricia on 19 Jun, 2019 Easy walk to the rockpools, more care is required when navigating around the pools themselves, as some areas are quite steep and rocky, as well as being slippery when wet.Did this walk on a damp day, but still enjoyable. Water was lovely and the other walkers went swimming. Young children may struggle with the rocky surrounds of the rockpools, especially when wet. Fine for most older children and adults. LaurenLiz on 7 May, 2018 Nice easy walk to some beautiful rock pools. Best after some rainfall. Rhiannon Brooks on 18 Feb, 2018 Starts off easy on fire track then becomes narrow as closer to the creek , rocky areas with plenty of small rock pools. Nice walk ! J on 13 Sep, 2014 Went back just to photograph the butterflies. Wasn't disappointed!! Stellar on 24 May, 2014 Easy walk to the rock pools. Was an amazing experience being surrounded by thousands of butterflies. Saw a turtle in the deepest pool. Stellar on 10 May, 2014 walked in multiple times with friends Anonymous on Sometime... « Comments 0-15 of 15 » Tick this walk and add your own comments (adsbygoogle = window.adsbygoogle || []).push({}); This will report the image to moderators for review. Are you sure this image is offensive? Aussie Bushwalking users can maintain a wishlist of walks for you but you need to be a member. Click here to login if you're already a member, otherwise go here to register for your free account. Navigation to some bushwalks can be difficult. Automated navigation using Google Maps or Apple Maps may not be accurate. Additionally, Aussie Bushwalking doesn't always have accurate positions for where to park for a walk. Please read the walk description for special directions and take extra care. Easy 3km return 1hr These values are provided by users. Your evaluation may differ. Where Click here to load this map. Nearby Walks Mt Walsh Tassels Track (Mount Walsh National Park) Mt Walsh (Mount Walsh National Park) Coongara Falls (Mount Walsh National Park) Coongara Rock (Mount Walsh National Park) Coalstoun Lakes (Wide Bay Burnett) Done this walk? This walk has been ticked 47 times Aussie Bushwalking can keep track of your bushwalks. Login/signup to tick this walk off."
