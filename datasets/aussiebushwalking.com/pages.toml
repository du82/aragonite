["https://aussiebushwalking.com/nsw"]
title = "New South Wales - Aussie Bushwalking"
description = "New South Wales - New South Wales (NSW), is a state found on the east coast of Australia."
full_description = "Menu Browse all walks Browse latest walks Add a region Edit this region Add a walk Popular Walks Mt Warning Summit Trail (756 ticks) Minyon Falls Loop (114 ticks) Bald Rock Summit (108 ticks) Fingal Head Lighthouse Walk (71 ticks) Grand Canyon Track (54 ticks) Sub-Regions Bald Rock National Park Barren Grounds Nature Reserve Barrington Tops National Park Basket Swamp National Park Blue Mountains National Park Boonoo Boonoo National Park Border Ranges National Park Cathedral Rock National Park Dorrigo National Park Gibraltar Range National Park Greater Sydney Guy Fawkes River National Park Hat Head National Park Koreelah National Park Kosciuszko National Park Ku-ring-gai Chase National Park Kwiambal National Park Lord Howe Island Morton National Park Mount Kaputar National Park Mt Jerusalem National Park Mt Kosciusko Mt Warning National Park New England National Park Nightcap National Park Oxley Wild Rivers National Park Pilliga Nature Reserve Royal National Park Warrumbungle National Park Wollumbin National Park Summary New South Wales (NSW), is a state found on the east coast of Australia. (adsbygoogle = window.adsbygoogle || []).push({}); Popular Walks Mt Warning Summit Trail (756 ticks) Minyon Falls Loop (114 ticks) Bald Rock Summit (108 ticks) Fingal Head Lighthouse Walk (71 ticks) Grand Canyon Track (54 ticks) Sub-Regions Bald Rock National Park Barren Grounds Nature Reserve Barrington Tops National Park Basket Swamp National Park Blue Mountains National Park Boonoo Boonoo National Park Border Ranges National Park Cathedral Rock National Park Dorrigo National Park Gibraltar Range National Park Greater Sydney Guy Fawkes River National Park Hat Head National Park Koreelah National Park Kosciuszko National Park Ku-ring-gai Chase National Park Kwiambal National Park Lord Howe Island Morton National Park Mount Kaputar National Park Mt Jerusalem National Park Mt Kosciusko Mt Warning National Park New England National Park Nightcap National Park Oxley Wild Rivers National Park Pilliga Nature Reserve Royal National Park Warrumbungle National Park Wollumbin National Park Other Information ... Contact details NSW National Parks and Wildlife Servicehttps://www.nationalparks.nsw.gov.au/ Regions ... Walks in New South Wales Easy 2 km return 1 hr Allyn River Rainforest Trail A rain forest walk through blue gums and strangler figs with epiphytes and ferns in Allyn River Forest Park just south of Mt Allyn in Barrington Tops National Park. Medium 4.2 km return 2.5 hrs Alum Mountain Trail Forest trail to a natural rock cliff lookout without barriers. First part quite steep. Later some steps included. On the way passing the Worimi Cultural Area with traditional tree carvings. Easy 2 km return 1 hr Angourie Point and Blue and Green pools A walk from the public parking on The Crescent to the blue pool then green pool and to Angourie point and back. Easy 72 km return 2 days Angourie to Illaroo This was my first solo walk, under the strick instructions of my family i was to make sure i didnt do something too hard if i was going to be doing this myself... I really enjoyed this, as there was not much water supplies i ahd to carry alot of water making my full pack about 17kgs. I did plan to do this walk in 4 days. Angoruie to Brooms head, Brooms head to illaroo and then back, however as i was by myself i powered through and did 36km each day, silly me got huge blisters and had to turn back in the morning otherwise i wouldve kept going. Great beach walk, nice and easy. Easy 2.6 km return 1 hr Arakwal NP Circuit Arakwal blends the convenience of Byron Bay with the appeal of a secluded beach retreat, offering birdwatching, whale watching, swimming, fishing, and picnicking. Remnant of Coastal clay heath. Medium 8 km return 3 hrs Baltzer Lookout (Hanging Rock) This walk to Baltzer Lookout along Burramoko Ridge rewards you with excellent scenery and a view over the stunning Hanging Rock (aka the Finger). The track is mainly management trail, and would be great on a mountain bike (to the end of the management trail). The large cliff edges are unfenced and quite exposed, so do take care. Although short and relatively unchanging in scenery, the walk to Baltzer Lookout is well worth it. Medium 10 km one-way 3 hrs Barrenjoey Lighthouse to Avalon Spectacular coastal walk on a convict-built track, along idyllic surf beaches and over dramatic headlands.This walk is also part of the The Sydney Coastal Walk. Medium 2 km return 45 mins Barrenjoey Lighthouse track To get there, take an steep and picturesque walk along Barrenjoey track for 1km. The walk to the top requires moderate fitness and will take about 30 minutes each way from Governor Phillip parking area. Hard 13 km one-way 6 hrs Basin Campsite to Watagan Valley (GNW) This varied walk travels north through the Watagans. Leaving the Basin campsite behind, the walk traverses the Wollombi Brook via the Lyrebird trail. The Wollombi Brook Pool is a great spot to stop (and take a swim) on a hot day. From the pool, the walk climbs into the Warrawolong Flora Reserve using a combination of bush tracks and dirt roads. Along the way, a side trip to Mt Warrawolong offers views on the way to the highest point in the area. This walk finishes by descending into the beautiful Watagan Valley. Hard 7 km return Basin Loop Track This track is an extension of the Hidden Treasure track, if you would like a more strenuous, longer walk. « Walks 1-10 of 496 » (adsbygoogle = window.adsbygoogle || []).push({});"
