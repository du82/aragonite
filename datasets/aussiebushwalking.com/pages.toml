["https://aussiebushwalking.com/nsw/bald-rock-national-park/bald-rock-summit"]
title = "Bald Rock Summit - Aussie Bushwalking"
description = "Bald Rock Summit - Bald Rock is the largest granite monolith in Australia, situated near the Queensland - New South Wales Border just north of Tenterfield. The relatively short walk provides great views of surrounding Bald Rock National Park and neighbouring Girraween National Park."
full_description = "Menu Edit this walk Navigate to... GPS Tracks 4) Bald Rock Summit Track (GPX) Bald Rock is the largest granite monolith in Australia, situated near the Queensland - New South Wales Border just north of Tenterfield. The relatively short walk provides great views of surrounding Bald Rock National Park and neighbouring Girraween National Park. Lookouts Picnic Facilities BBQ Toilets Scrambling or Climbing No Dogs Permitted Camping Permitted Eucalypt Forest 1280m Maximum Elevation 185m Total Climb Add to My Wishlist Remove fromMy Wishlist Tick Walk (adsbygoogle = window.adsbygoogle || []).push({}); Getting there: From Tenterfield take the Mount Lindesay Road north and then turn left into Bald Rock Access Road and follow this for 5km to the car park and picnic area. From Stanthorpe drive towards Amosfield, then south along the Woodenbong Road/Mount Lindesay Road towards Tenterfield. The road is partially unsealed, with the turnoff into Bald Rock Access Road on the right. Maps: Bald Rock National Park Route/Trail notes: From the car park, take the walk to Bald Rock. After a couple of hundred meters cross the bridge and take the right fork. This is the hardest way up. Keep following the track until you come out of the bush and meet the bottom of Bald Rock. From here, there are white discs marking the direction upwards. As usual follow the standard white markings up. Take your own water supply, as none is available on the trail. Permits/Costs: Park entry fee applies (2023 = $8 per vehicle/day) Part entry fees and camping permits can only be purchased online from National Parks NSW. The camp grounds are just behind the car park. Other References/Comments: Base yourself at Bald Rock Camp Grounds and take advantage of a spectacular sunrise or sunset from the top of Bald Rock. GPS Tracks 4) Bald Rock Summit Track (GPX) Comments Well marked up the rock. The summit deserves time to enjoy. Wanderlust on 26 Jan, 2025 Gorgeous granite and rock orchids in bloom! Molly Krupa on 30 Sep, 2024 Took the Bungoona Walk to the summit, & returned down the Rockface. So glad we chose to go this way, as the rock face is steep & would have been a killer to walk up!The Bungoona Walk is definitely worth doing. It has some interesting sections with large rock formations.Fantastic views from the top of the climb. The colours within the rockface of Bald Rock are amazing. Another wow moment!As this is a NSW National Park there is a park fee. It was $8 at the time we went. Make sure you take the correct amount of cash & have a pen to fill out the form, which you must display on your car's windscreen. Suz on 10 Sep, 2023 Ascend via the rockface if fit enough but descend via Bungoona walking trail if elderly. Or do the summit via Bungoona trail if not up for the rockface. Stunning views of the scenic rim & over to the walking tracks at Girraween National park. Take plenty to drink as it gets hot on the exposed granite. Cheryl on 17 Mar, 2023 Took this route on the way down - definitely not recommended for this with bad knees as it is quite step. Well marked and amazing scenery Anne on 26 Jul, 2022 Gets the majority of the climb done going up the first slab then the gradient tapers right off as you sidle along the top to the trig at the highest point. Offers great 360 views. Lahs on 12 Jan, 2022 Tried to hike this back in 2019 but it was closed due to fires. Finally able to go today and what a beautiful day out. Wouldn't classify this as hard as you can avoid the rock face part of the track by returning down the East track of you desire. That said, the rock face isn't that steep and with good shoes and reasonable fitness it's no trouble. JayWalker on 15 Dec, 2021 Great walk. Gets the heart going up the rock face. Reminded me of Ayres rock climb but without the chain. Will do this one again. Boots on 16 Jun, 2021 Super fun hike. Minimal effort for great reward. Brilliant 360 degree views. BeckNWood on 21 Apr, 2021 Really fun walk, quite similar to the Pyramid although probably not quite as steep. There are really fantastic 360 degree views at the top. Definitely worth stopping in if you are in the area, doesn't take very long to go up and down it (even if the sign recommends 3 hours). Probably took us less than an hour return to do it with photo stops along the way. Vonsnrub on 10 Oct, 2020 Remember to bring $8 for car registration - Went up and down rock face for sunset! Another cloudy day however this walk was really good! CL on 27 Jan, 2019 Stunning walk. I walked up the long way, down the steep way, which is heaps easier. Path winds through large boulders, ending with 360 degree view. Definitely head up to the summit where the summit marker is. Not a difficult walk, well worth it. Do not go in the wet! Lobster on 27 Dec, 2018 Absolutely stunning! Walked up rock face and downntrack. Highly recommend. Chantelle on 3 Jun, 2018 I actually enjoyed this rock a lot more than the pyramid in Giraween which I did one the day before. It’s hard to describe the scale of this thing: such a large slab of granite. Had the place all to myself which was hard to understand considering how magnificent it is. Juiced Pixels on 14 Dec, 2017 It is twelve years since I was here last and now it was time to camp at the base and take my grandchildren to the top to witness a fantastic sunset. F.A.B. on 25 Oct, 2017 Fabulous views and worth the climb. Lots of wildflowers too. Lesley Chenoweth on 28 Aug, 2017 We actually did this walk a few years ago and hadn't logged it on Aussie Bushwalking. (oops)This walk is a great walk with interesting scenery, boulder formations and great views. The track up going through the bush up to the summit had lots to look at. The last portion across the granite escarpment to the summit has excellent views and a little challenging when the wind is blowing hard. The return walk, straight down the granite face is shorter, fun to walk and, again, had great views. Mim & Pop on 1 Oct, 2016 this rock is pretty bald Ignacio Rico on 1 Oct, 2016 An easy walk up the face of Bald rock. It is a bit steep and can get a bit daunting for young kids and those scared of heights. There is an alternative slightly longer track if you dont feel comfortable walking straight up the face of the rock. Wonderful view from the top but what i love most about bald rock is its uniqueness. Annalise Burton on 16 Jul, 2016 Omg not for unfit people. I struggled the climb up Bald Rock 1km on an 8 degree angle but the view was magnificent. The walk down around the rocks was also cool and so many boulders to climb into the walk was worth it. Yvette on 9 Dec, 2015 « Comments 0-20 of 34 » Tick this walk and add your own comments (adsbygoogle = window.adsbygoogle || []).push({}); This will report the image to moderators for review. Are you sure this image is offensive? Aussie Bushwalking users can maintain a wishlist of walks for you but you need to be a member. Click here to login if you're already a member, otherwise go here to register for your free account. Navigation to some bushwalks can be difficult. Automated navigation using Google Maps or Apple Maps may not be accurate. Additionally, Aussie Bushwalking doesn't always have accurate positions for where to park for a walk. Please read the walk description for special directions and take extra care. Medium 2.9km return 90mins These values are provided by users. Your evaluation may differ. Where Click here to load this map. Nearby Walks Bungoona Walk (Bald Rock National Park) Border Walk Loop (Bald Rock National Park) Little Bald Rock (Bald Rock National Park) Carrolls Creek Loop (Bald Rock National Park) Aztec Temple (Girraween National Park) Done this walk? This walk has been ticked 123 times Aussie Bushwalking can keep track of your bushwalks. Login/signup to tick this walk off."
