["https://aussiebushwalking.com/users/30864"]
title = "Profile for RosieG - Aussie Bushwalking"
description = "Aussie Bushwalking profile for RosieG"
full_description = "This Year 0 Number of Walks Ticked 0.0m Total Distance Ticked All Time 16 Number of Walks Ticked 133.3km Total Distance Ticked Ticks Name Date Difficulty Distance/Duration Purling Brook Falls Circuit (Springbrook National Park) 1 Jan, 2021 Medium 4km return 2 hrs It was an amazing walk, its an easy walk; I was with a large group; many had not much experience in the bush. They loved it. The waterfall is brilliant after rain, standing on the rocks near the base, I was saturated from the spray. Very exhilarating. Purling Brook Falls Circuit (Springbrook National Park) 12 Dec, 2020 Medium 4km return 2 hrs Just a lovely walk, we did it with a very slow 84 year old, she loved it had a great time. Daves Creek Circuit (Lamington National Park) 19 Sep, 2020 Hard 12km return 4 hrs One of my favourites, stunning at this time of year. Always fun. Climbing Surprise Rock, discovering the cave. Great walk to take new walkers on. Warrie Circuit (Springbrook National Park) 18 Jul, 2020 Hard 17km return 5 hrs Love this walk, Its great for relatively inexperienced hikers who want to stretch themselves. Brilliant waterfalls. My 3rd time and I always love it. Pages Pinnacle (South East Queensland) 20 Jun, 2020 Hard 6.7km return 2.5 hrs Pages Pinnacle has two entrance points. One on Springbrook Road by Polly's cafe and one on Pine Creek Road. The Pine Creek one is not as steep. Maybe better for children. The Pages Pinnacle tree has etched on it a nice big PP if you can't see that. You have the wrong tree. This is a great walk, lots of fun at the pinnacle. There is also a circuit you can do which is about 14km. Lots of different options. This is definitely going on my favourites list Clagiraba Creek Trail (South East Queensland) 30 Mar, 2020 Easy 4.4km return 90 mins It was a fantastic walk to take two 80+ year olds in this time of social distancing. We met one person only, who had walked in from the Beechmont end. It seemed to be roughly half way and the trail became rougher. It had taken us 30 mins walking slowly so we turned back to Clagiraba. I walked hellfire pass a few years ago and wondered if thats where it was leading to. The walk was lovely, very peaceful, creek crossings and stepping stones a bit of fun. Tracks in good condition. Great family walk. Box Forest (Lamington National Park) 14 Mar, 2020 Medium 10.6km 5 hrs We had so much fun on this walk. The waterfalls are still amazing. We were in and out of water, clambering over rocks, gazing in awe at the massive Brush Box Trees. We saw blue crays, a snake (enjoying the sun, luckily he moved off the path) , pademelons, a fairy wren, bush turkeys (ha ha always see bush turkey) Just a fantastic walk, Even small children can go as far as picnic rock and play in the water. Killen Falls (New South Wales) 15 Feb, 2020 Medium 3km return 20 mins Very easy walk, 1km from carpark down to falls. The Falls were magnificent after all the rain. Fun in the water, Just a beautiful place Minyon Falls Loop (Nightcap National Park) 15 Feb, 2020 Medium 6.8km return 3 hrs Minyon Falls was incredible. At the base of the falls it was like being in a storm the wind and water from the falls plunging down was so strong. Even if you didn't get in the water you got saturated. The boulders up to the base are quite tricky. Because of all the rain everything was very wet. It was very funny to see everyone arriving at the falls pristine, trying to cross the river without getting wet. Then after they visited the base, wet through, disheveled with huge smiles. We didn't do the loop, walked down and back up the same way. Which was a great walk. We started the day at Byron Lighthouse, then Killen Falls then Minyon so it was a huge day out. But what a day. Still smiling. Byron Lighthouse walk from Wategos Beach (New South Wales) 15 Feb, 2020 Medium 4km return 90 mins Beautiful ocean views, Palm Beach Parklands (Gold Coast) 27 Jan, 2020 Very Easy 3.5km return 1 hr Just love this area, so diverse, so beautiful, We spent the day there with my 3 year old grandsons, We played in the park, walked the track, swim in the creek, rode bikes round the paths. All ages and fitness levels can enjoy this walk Mt Warning Summit Trail (Wollumbin National Park) 25 Jan, 2020 Hard 8.3km return 5 hrs I love this walk it had been a few years though. We started at 3 am and made the summit for sunrise. Just working out when I can go back again Tallebudgera Creek Circuit (Gold Coast) 16 Nov, 2019 Easy 8km return 2 hrs A lovely gentle stroll, bush, creek and ocean and of course coffee Warrie Circuit (Springbrook National Park) 19 Oct, 2019 Hard 17km return 5 hrs A beautiful walk, very dry, but still had a dip in the pool. Great fun Lower Bellbird Circuit (Lamington National Park) 24 Aug, 2019 Medium 12km return 3 hrs Just a beautiful walk. Lots of great lookouts. I did the extra 3k down to Ballanjui falls. Well worth it. Next time I'll park close to where you come out and walk the 2k down the road at the beginning. Daves Creek Circuit (Lamington National Park) 22 Jun, 2019 Hard 12km return 4 hrs Lovely walk, not difficult. Although signposted there was one place just before the lookout 4.8km in we weren't sure of the path GPS showed edge of cliff to left so we took that way and it was the right choice. Lookout was about 100m or so past the 6km mark. Later bought the bushwalking book from the lodge and found out where weren't sure of the direction was a lookout. So we were not at any risk of being lost. Binna Burra has great signage « Ticks 1-16 of 16 »"
