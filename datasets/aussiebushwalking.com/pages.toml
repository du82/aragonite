["https://aussiebushwalking.com/nsw/wollumbin-national-park/mt-warning-summit-trail"]
title = "Mt Warning Summit Trail - Aussie Bushwalking"
description = """
Mt Warning Summit Trail - MOUNT WARNING SUMMIT TRAIL IS NOW PERMANENTLY CLOSED.

A trail to the summit of Mt Warning offers beautiful 360 degree views of the Great Dividing Range from the peak. Lots of steps, can be slippery. A steep climb to the summit using chains, but the views from the top are worth it!"""
full_description = '''Menu Edit this walk Navigate to... GPS Tracks 25 Mt Warning Summit Trail (GPX) MOUNT WARNING SUMMIT TRAIL IS NOW PERMANENTLY CLOSED.A trail to the summit of Mt Warning offers beautiful 360 degree views of the Great Dividing Range from the peak. Lots of steps, can be slippery. A steep climb to the summit using chains, but the views from the top are worth it! Lookouts Toilets Scrambling or Climbing No Dogs Permitted No Camping Permitted Rainforest 1156m Maximum Elevation 730m Total Climb Add to My Wishlist Remove fromMy Wishlist Tick Walk (adsbygoogle = window.adsbygoogle || []).push({}); The Mt Warning Summit Trail is currently closed See details on the closure from NSW National Parks here: https://www.nationalparks.nsw.gov.au/-/media/visitor/files/pdf/wollumbin-summit-track-closure-extended-nov-2020.pdf Getting there: You can drive to the base of Mt Warning in a normal vehicle by following roads out of Murwillumbah. Wollumbin National Park is located 12km south-west of Murwillumbah, off Kyogle Road. From Murwillumbah: take the Kyogle Rd towards Uki. Around 10km from Murwillumbah, before you reach Uki, turn right into Mt Warning Road. Continue 3.5km to the end of Mt Warning Rd, where you’ll reach Breakfast Creek car park in the National Park. Maps: Mount Warning Route/Trail notes: The walk up is through subtropical and temperate rainforest, wet sclerophyll forest and heath shrubland. The final 10% of the journey involves scrambling up a rock face using chains as a guide and help. The top of the mountain has well established seating and lookout areas that have 360 degree views Permits/Costs: None. Other References/Comments: Mount Warning Hike - track notes GPS Tracks 25 Mt Warning Summit Trail (GPX) Comments You can still climb it. Just have to be out there very early to dodge the security guards Matt on Sep, 2023 Just about everything NSW NPWS say about this walk is contestable. My comments posted at http://righttoclimb.blogspot.com/2021/01/chain-and-post-removed-at-mount-warning.html MarcH on 4 Jan, 2021 Closed currently due to Covid19 Helimeg on 20 Jul, 2020 Very hard , long and steep. Marlaina Embling on 20 Jun, 2020 i have been hiking for a while ,just joined this site so wanting to put some of my walks on. it was a hard one, i was 53 and i hadn't done any hiking for a few years so found it tough especially the last 1/3 to the top had a few breaks but got there :) a bit too busy for my liking a lot of people there so getting a car park is hard so get in early for an early start, i camped at the bottom at the camping ground so it was nice we did OK for the time i'm not that fit anymore but we still made it a fair bit under the recommended time, personally i was underwhelmed with the view in my opinion at my stage in life not really worth the effort unless you want to say you have done it for picturesque scenery i would do Bunya mountains and other rain forest walks before this unless its on your list to do :) vlad on 8 Mar, 2020 Sadly closed now but a great hike with good views at the top. Little Rock scramble towards the top Kel on Mar, 2020 I love this walk it had been a few years though. We started at 3 am and made the summit for sunrise. Just working out when I can go back again RosieG on 25 Jan, 2020 Did this twice, once in winter and another one a couple of days ago in summer on 3 Jan 2020. In winter: Track can be slippery and muddy after rain, not the best way to walk for hours but the rainforest is absolutely surreal, got caught in a storm from balcony down the steep face, slipped on the way down but was fortunate to hook my legs on a pole, it is cold up at the summit so bring a windbreaker at least.In summer: 1hr 45mins up and 1 hr 30mins down at a steady pace, nice and easy but a part of those chains on the steep face has broken off, not too big of an issue really just have your footholds done properly.Saw a boy no more than 10 years of age on the way up and injured with a deep knee gash on the way down, ambo had to come by. Wai on 3 Jan, 2020 Great idea to hike up.on 1st Jan to watch the sunrise. Well so did half the Gold Coast too.Fantastic hike. The last bit with the chain is my favorite. Do not go in the rain. Would not recommend children under 7!! Maria R on 1 Jan, 2020 Climbed the mountain with my 9yo daughter. Unfortunately the view was obscured by smoke but that didn't stop quite a few people from making the climb. Richard Mason on 10 Nov, 2019 Most of it is in rainforest and easy apart from the climb at the top which is hard. Very enjoyable walk. Joel Bideganeta on 10 Nov, 2019 Very hot in summer. Take lots of water.If you have an average level of fitness like myself you’ll complete it in about 4.5-5hrs.The view at the top is magic.There are lots of big flies at the top so take insect repellant.DON’T go up there in inclement weather. There are lightning rods attached to the viewing platform and people have died up there trying to camp during storms. Remy on 6 Nov, 2019 My first "testing" hike. Did the walk solo and found it really easy to navigate through the track as it's clearly marked and laid out.My legs were not use to climbing 74 trillion steps so by the time it got to the scramble to the summit I was pretty gassed.Tried to practice my scrambling and not rely on the assistance chain but it did come in handy. I'm super unfit so I had a few breaks on the way but overall a pretty easy track only 3 and a half to 4 hrs return if you have a steady pace.I personally thought the views just before reaching the summit where better than from the peak I'm not sure if that's because it felt more natural and vast as a posed to being on the "balcony" Korina Meagher on 31 Oct, 2019 Amazing. A group of us went up - 6 adults and 8 children aged between 7 and 14. They all loved it. Took about 6hrs return including many snack stops and lunch at the top.If you have to go to the bathroom please be prepared to take your mess with you! Views were beautiful, chains at the end were good fun. Everyone was very helpful and friendly. Janielle Pyne on 6 Oct, 2019 Was engulfed in cloud and missed the sunrise Deon Krahe on 26 Sep, 2019 Really beautiful walk. Did it with a 12 and 9 year old very comfortably. The view at the top is spectacular. Disappointing to see that people just drop their rubbish though. Really not hard to take everything back in your bag with you. Curry Bunch on 31 Aug, 2019 Awesome walk. The path is very eroded rather than smooth, like it used to be. So most of the track is going over big rocks and steps. Took 5 hrs as the kids needed lots of breaks. Scardykats on 25 Aug, 2019 If you’re used to walking this is extremely easy walk. I don’t like it at all. The scramble in the end is level 1. You can hardly call it scrambling. It took me 3 hours and 10 mins, and I spent like 15 mins on the top and was bored. Don’t run up or down, you’re likely to get injured. Gabriel on 17 Aug, 2019 Awesome walk, challenging in parts but so rewarding when you get to the top alex on 28 Jul, 2019 It was rewarded when got to the summit. Penny on 11 Jul, 2019 « Comments 0-20 of 259 » Tick this walk and add your own comments (adsbygoogle = window.adsbygoogle || []).push({}); This will report the image to moderators for review. Are you sure this image is offensive? Aussie Bushwalking users can maintain a wishlist of walks for you but you need to be a member. Click here to login if you're already a member, otherwise go here to register for your free account. Navigation to some bushwalks can be difficult. Automated navigation using Google Maps or Apple Maps may not be accurate. Additionally, Aussie Bushwalking doesn't always have accurate positions for where to park for a walk. Please read the walk description for special directions and take extra care. Hard 8.3km return 5hrs These values are provided by users. Your evaluation may differ. Where Click here to load this map. Nearby Walks Brummies Lookout (Wollumbin National Park) Clarrie Ha