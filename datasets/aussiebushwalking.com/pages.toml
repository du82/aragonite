["https://aussiebushwalking.com/articles/detailed-bushwalking-gear"]
title = "Detailed Bushwalking Gear - Aussie Bushwalking"
description = "Detailed Bushwalking Gear - Backpacking Gear checklist"
full_description = "Menu (adsbygoogle = window.adsbygoogle || []).push({}); I've been bushwalking for approx 25 years and along the way i've found a few things have been helpful. Some haven't but I thought i'd share some of the items I take with me. Generally when I go out bushwalking I carry a little more than what's neccessary. Sometimes you might want to enjoy the view a little longer and then if you have to stay the night it's not a miserable time. Maybe this might help the novice walker. - CLOTHES - Walking poles (3 piece collapasible type, less size when strapped to your pack) - Gaitors ,choose the length right for you, I find the flat strap types last longer - Hiking boots, choose very well, you spend a long time in them - Socks, a thicker type adds to the comfort when walking - Pants, shirt, choose what works well for you, an oversized long sleeve shirt for the sun - Waterproof pants and top, gore-tex is a good option but stays wetter longer - Hats, cap and wide brim - Gloves, good when scrambling and reduces risk of ant bites and other little insects - CAMPING GEAR - Backpack, look for the strongest you can, half to full day 30-50 litres longer 70+ liters - Backpack cover, essential to keeping your pack dry, wet pack=heavy :( - Hiking tent, they are lighter, your gear equals one person in a tent - Sleeping bag, removable liner adds to the adapatability of your bag - Sleeping mat, I've found an inflatable type helps. sleep well, walk well the next day - Water/ Water filter/ treatment, long trips filters help, unknown water boil for 3 mins - Waterbladders, eg. camelbak are great for drinking on the move - Toilet paper + shovel, bury 100m from water and 15cms deep - Never wash gear close to streams - Cooking + utensils, I use old military gear seems to be stronger and cheaper - Stove + fuel, some parks are fuel stoves only - Store your gear inside plastic dry bags inside your pack - OTHER GEAR - Rope, good for scrambling and emergencies - Camera, capture those great moments - Notepad + pen, ideal for track notes - GPS, have maps updated regularly - Watch, outdoors watches are great - Headlamp, with red light (keeps nightvision) LED lights have longer battery life - Torch, always choose LED type and use alkaline batteries - Light reading, your favourite magazine. sit back and read while enjoying the view - Sandals, at the end of the day good to get out of those boots around camp - Thermos, hot choc on a cold day......... yummy - Insect repellent, The bushman extra strength type is fantastic keeps leeches away - Spare Clothes, dry old clothes on your pack when walking or sleeping - Binoculars - Altimeter - Map + Compass, make sure you know how to use them - Sunglasses + sunscreen, SLIP, SLOP, SLAP, SHADE - Knife, strong medium size blade - Wire saw, available from good camping stores - Cord, help build emergency shelter - Whistle, louder and travels further than human voice - Food + Water, take more, if your rained in helps keep morale up - First Aid Kit, - Space blanket, - Fire starter, flint works even when wet - Extra clothes, if your wet your not happy, enjoy your time outdoors - LEAVE YOUR TRAVEL PLANS WITH SOMEONE RESPONSIBLE The above is only a guide. Depending on your distance of travel items maybe needed or deleted. ALWAYS Practice with your gear before going out, know how to put up your tent, read a map. Start a fire with a flint and keep a little bit of cotton wool in with your fire kit."
