["https://aussiebushwalking.com/vic/grampians-np/the-balconies"]
title = "The Balconies - Aussie Bushwalking"
description = "The Balconies - From the same car park as Reed’s Lookout you can walk to The Balconies for panoramic views of Victoria Valley and the surrounding ranges. The unusual rock formations that stick out of the mountain make this spot particularly unique. The Balconies are a great spot for fresh misty mornings and sunset views."
full_description = "Menu Edit this walk Navigate to... GPS Tracks The Balconies (GPX) From the same car park as Reed’s Lookout you can walk to The Balconies for panoramic views of Victoria Valley and the surrounding ranges. The unusual rock formations that stick out of the mountain make this spot particularly unique. The Balconies are a great spot for fresh misty mornings and sunset views. Lookouts Wheelchair Accessibility No Dogs Permitted No Camping Permitted Eucalypt Forest 762m Maximum Elevation 58m Total Climb Add to My Wishlist Remove fromMy Wishlist Tick Walk (adsbygoogle = window.adsbygoogle || []).push({}); Getting there: Take Mt Victoria Road (C222) just north of Halls Gap for about 14km before turning left (signposted) into Reed’s and The Balconies car park. Maps: The Balconies Route/Trail notes: From the bottom of the car park follow the signposted track out to The Balconies Lookout. Return by the same route. Permits/Costs: None. Other References/Comments: From the same car park you can also do the Reed’s Lookout walk. The Grampians are a haven for bushwalkers from short strolls to multiday adventures. From Very Easy to Hard. You could spend a couple of weeks here and still not complete them all. There are a number of Bush Camps in the area, but most people would stay in Halls Gap where there is plenty of accommodation options. GPS Tracks The Balconies (GPX) Comments A leisurely stroll along the winding path out to the spectacular views from the Balconies lookout. Fun that when they cut down a few trees then shaped the bottom of the trunks into seats. Unfortunately three people had ignored the signs and barriers and at their own peril had climbed down and out along the overhang rock formation.As I write this walk up one months to the day, the area is now engulfed by an out of control bushfire. Halls Gap where we stayed is evacuated and I feel so sorry for the wildlife of kangaroos and deer that surrounded our cabin. F.A.B. on 20 Nov, 2024 Was very busy with many tourists and hard to get a park. Nice views to be seen from Reeds Lookout and The Balconies. Don't miss the lookout from the area next to the fire watch tower. rob.bushman on 28 Dec, 2016 A nice short walk to an interesting rock feature. Ian and Sue on Jan, 2014 « Comments 0-3 of 3 » Tick this walk and add your own comments (adsbygoogle = window.adsbygoogle || []).push({}); This will report the image to moderators for review. Are you sure this image is offensive? Aussie Bushwalking users can maintain a wishlist of walks for you but you need to be a member. Click here to login if you're already a member, otherwise go here to register for your free account. Navigation to some bushwalks can be difficult. Automated navigation using Google Maps or Apple Maps may not be accurate. Additionally, Aussie Bushwalking doesn't always have accurate positions for where to park for a walk. Please read the walk description for special directions and take extra care. Very Easy 2.1km return 45mins These values are provided by users. Your evaluation may differ. Where Click here to load this map. Nearby Walks Reeds Lookout (Grampians National Park) Broken Falls Lookout (Grampians National Park) MacKenzie Falls Walk (Grampians National Park) MacKenzie Falls Lookout (Grampians National Park) Boroka Lookout (Grampians National Park) Done this walk? This walk has been ticked 7 times Aussie Bushwalking can keep track of your bushwalks. Login/signup to tick this walk off."
