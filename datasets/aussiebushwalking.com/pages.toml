["https://aussiebushwalking.com/qld/se-qld/brisbane-forest-park-d-aguilar-np/mt-coot-tha/curlew-and-ironbark-circuit"]
title = "Curlew and Ironbark Circuit - Aussie Bushwalking"
description = "Curlew and Ironbark Circuit - Wide tracks but plenty of medium difficulty up and down as you criss cross ridges and creeks. Downhill can be a bit slippery on the gravel."
full_description = "Menu Edit this walk Navigate to... Wide tracks but plenty of medium difficulty up and down as you criss cross ridges and creeks. Downhill can be a bit slippery on the gravel. Picnic Facilities Toilets Eucalypt Forest Add to My Wishlist Remove fromMy Wishlist Tick Walk (adsbygoogle = window.adsbygoogle || []).push({}); Getting there Drive to the Gap Creek Reserve on Gap Creek Road. Maps BCC Mt. Cootha map Route/Trail notes From the reserve car park head west across the road and the obvious track entry. Follow the Curlew Circuit signs to the West to take a clockwise route that includes Goanna (8), Ironbark (10) and Curlew (11) - numbers from the BCC map above. At it's peak the walk is about 80m higher than the reserve. Permits/Costs No permits or costs and it is dog friendly. GPS Tracks No GPS available for this walk yet. Comments Good exercise. Flat parts in between to recover. Wanderlust on 16 Feb, 2025 Great walk with hills, just keep an eye for dogs off the lead. I prefer to dfo this loop anti clockwise as the ironbark track is quite steep at the southern end where it meets Curlew circuit, definitively easier to walk up than down it as the ground can be loose and gravely. HR on 7 May, 2020 Great walk to get the heart pumping. All in all took me 45 minutes, with a slight detour off onto an adjoining track for a quick look. Handful of steep sections, the ascent clockwise would be easier than going anti-clockwise. Really dry, would be fantastic after some good rain. Shaun on 15 Jan, 2020 Nice easy morning walk. Took 40 mins so not at all challenging. Bobbe on 19 May, 2019 Great walk today with the fiancé and husky. Some steep sections but a nice way to start the day. Took us about 45 minutes and enjoyed a BBQ at Gap Creek Reserve picnic area afterwards. JenBrendanShadow on 2 Apr, 2018 Enjoyable walk with a couple of steep hills. Zach on 13 Aug, 2016 « Comments 0-6 of 6 » Tick this walk and add your own comments (adsbygoogle = window.adsbygoogle || []).push({}); This will report the image to moderators for review. Are you sure this image is offensive? Aussie Bushwalking users can maintain a wishlist of walks for you but you need to be a member. Click here to login if you're already a member, otherwise go here to register for your free account. Navigation to some bushwalks can be difficult. Automated navigation using Google Maps or Apple Maps may not be accurate. Additionally, Aussie Bushwalking doesn't always have accurate positions for where to park for a walk. Please read the walk description for special directions and take extra care. Medium 3km return 1hr These values are provided by users. Your evaluation may differ. Where Click here to load this map. Nearby Walks Bellbird trail, Kokoda trail, Jacksonia trail circuit from Gap Creek Reserve (Mt. Coot-tha) Gap Creek to Mt Coot-tha Botanic Gardens (Mt. Coot-tha) Jacksonia Trail, Bellbird Trail, and Kokoda Trail Circuit (Mt. Coot-tha) Kokoda Track (Mt. Coot-tha) Ghost Hole Track (Mt. Coot-tha) Done this walk? This walk has been ticked 28 times Aussie Bushwalking can keep track of your bushwalks. Login/signup to tick this walk off."
