title = "Bushwalking Tracks of the World - Aussie Bushwalking"
description = "A full list of all tracks on Aussie Bushwalking - from throughout Australia, New Zealand and the world"
full_description = "Menu Browse latest walks Add a region Add a walk Popular Walks Mt Ngungun (1117 ticks) Mount Coolum (848 ticks) Mt Warning Summit Trail (756 ticks) Mt Cordeaux (645 ticks) Twin Falls Circuit (613 ticks) Sub-Regions Queensland Victoria New South Wales Tasmania South Australia Western Australia Northern Territory Overseas Australian Capital Territory United Car Removals Sunshine Coast Stewart island New Zealand Hideaway Bay qld Shakira Laggan (adsbygoogle = window.adsbygoogle || []).push({}); Popular Walks Mt Ngungun (1117 ticks) Mount Coolum (848 ticks) Mt Warning Summit Trail (756 ticks) Mt Cordeaux (645 ticks) Twin Falls Circuit (613 ticks) Sub-Regions Queensland Victoria New South Wales Tasmania South Australia Western Australia Northern Territory Overseas Australian Capital Territory United Car Removals Sunshine Coast Stewart island New Zealand Hideaway Bay qld Shakira Laggan Walks in Australian Capital Territory Medium 5.4 km return 2 hrs Black Mountain Summit Trail A steep walk to the top of Black Mountain. Hard 11.6 km 4 hrs Camels Hump This walk begins at Mountain Ck Car park within Tidbinbilla nature Reserve. The track is a fire trail, Quite steep at first then becoming moderate until 'Camels Back' (signed) beyond this a 500 mtr, unmarked but quite well defined track will lead you to the summit. The veiws of Canberra and surrounds from this last section are spectacular. Well worth the $10 reserve entrance fee (unless you get there between 730 and 9 am. Medium 7.7 km 3 hrs Gibraltar Peak Gibraltar Peak (1,038m), is a rocky outcrop with extensive views over the ACT, including Canberra and Black Mountain to the east. It's accessible via a walking trail or fire trail, or combine the two to form a loop. Locatted in the Tidbinbilla Nature Reserve, it's only 45min from the Canberra city centre. Medium 7 km one-way 3 hrs Kambah Pool to Pine Island A scenic and rewarding trail which includes views over Red Rock Gorge on the Murrumbidgee River. This walk is one part of the longer Murrumbidgee Discovery Track from Casuarina Sands to Point Hut Crossing. Very Easy 5 km return 2 hrs Lake Burley Griffin Circuit (Bridge to Bridge) Stroll around Lake Burley Griffin and enjoy the national attractions, cafes and parks you’ll find along the way. Do as the locals do and do the ‘bridge to bridge’ walk (Commonwealth Bridge to Kings Avenue Bridge), then make your way to Commonwealth Park, the home of Floriade in spring, but perfect for visiting at any time of year. Easy 4.5 km return 2 hrs Mount Ainslie Summit Hike A good little walk to the top of Mount Ainslie in the ACT. Easy 1 km return 30 mins Mount Arawang Mount Arawang Summit Walk is part of the Cooleman Ridge Nature Reserve and is a park of the mountains, hills and Ridges surrounding Canberra. Easy 2 km return 1 hr Mount Taylor A short hike up to the summit of Mount Taylor will reward you with excellent views of Canberra and beyond. It is a good alternative to Black Mountain and Mt Ainslie that enables you to avoid all the tourists and actually hike up a mountain you couldn't just drive up. Very Easy 100 m return 10 mins Mt Ainslie Lookout Walk, cycle or drive to Mt Ainslie Lookout with spectacular views over Canberra. Medium 8.4 km return 2 hrs One Tree Hill A moderate walk that is very well travelled and a known tourist route. It has excellent views over North Canberra. « Walks 1-10 of 2181 » (adsbygoogle = window.adsbygoogle || []).push({});"
