description = "Central Queensland - Central Queensland goes the entire length from the east coast to western Queensland."
full_description = "Menu Browse all walks Browse latest walks Add a region Edit this region Add a walk Popular Walks Amphitheatre (79 ticks) Moss Garden (74 ticks) Boolimba Bluff (73 ticks) Art Gallery (68 ticks) Big Bend (61 ticks) Parent Regions Queensland Sub-Regions Blackdown Tableland National Park Byfield National Park Carnarvon National Park Expedition National Park Idalia National Park Kroombit Tops National Park Minerva Hills National Park Mount Etna Caves National Park Nuga Nuga National Park Summary Central Queensland goes the entire length from the east coast to western Queensland. (adsbygoogle = window.adsbygoogle || []).push({}); Popular Walks Amphitheatre (79 ticks) Moss Garden (74 ticks) Boolimba Bluff (73 ticks) Art Gallery (68 ticks) Big Bend (61 ticks) Parent Regions Queensland Sub-Regions Blackdown Tableland National Park Byfield National Park Carnarvon National Park Expedition National Park Idalia National Park Kroombit Tops National Park Minerva Hills National Park Mount Etna Caves National Park Nuga Nuga National Park History Any interesting history for the region? Features Like the rest of QLD the majority of stuff to do is on the East coast. With some jumpups heading out west in the desert country. Access How do you get there? Include all access points if there are many? Maps Which maps cover the region? Council Areas: Diamantina Shire Boulia Shire Winton Shire Barcoo Shire Blackall Tambo Regional Longreach Regional Barcaldine Regional Central Highlands REgional Banna Shire Gladstone Regional Rockhampton Regional Contact details See QLD national Parks for information Walks in Central Queensland Medium 2.3 km return 90 mins Bluff Point Walking Track Good enjoyable walk, I'd say it a medium difficulty level for beginners. Use to run it everyday with incredible lookouts over to the islands and overall an enjoyable time. Easy 1.4 km return 45 mins Bracken Fern Way A short walk at the top of Mt Archer to a lookout over southern Rockhampton. Medium 15 km 4 hrs Curtis Island This walk takes you along the eastern coastline of Curtis Island, starting from South End. There are two established camp sites along the eastern coast (Turtle St - about 15km, and Joey Lees - about 29km), and another at the northern end (Yellow Patch). This is a fairly exposed walk, along the beach in some areas and along the top of the headland in others. It would be much too hot in summer. The views are pretty spectacular the whole way and it is not busy at all - we walked on a long weekend and met one group of 4WD'ers, and no other walkers. There are no facilities along the way- you will need to bring all of your own water. Easy 2.1 km return 45 mins Discovery Trail This circular walk around Agnes Water Headland, including its Lookout, provides great views north up Agnes Water Beach to 1770 Headland and to the south along Chinaman's Beach. Hard 800 m return 40 mins Double Head - Northern Peak A steep climb up the northern peak of Double Head at Rosslyn near Yeppoon. Medium 700 m return 40 mins Double Head Track This is a council maintained track up the southern peak of Double Head at Rosslyn near Yeppoon. It takes you to Fan Rock and a lookout towards the northern Peak. Easy 720 m return 30 mins Ganoonga Noonga Lookout Enjoy a short, steep climb to panoramic views over the eastern lowlands and mountain ranges to the west.Pass through grassy, open woodland with bloodwood trees and rusty gums on this steep lookout walk. With sensational views over the surrounding coastal lowlands, the steep trip is well worth the effort—just make sure you bring your camera!From the vantage point 60m above sea level, you can view the Ganoonga Noonga (low grounds) of swamps and heath that cover the parallel dunes below.Enjoy sweeping vistas of Munro Range to the west, and Bray Hills and Bustard Bay to the north. Keen eyes might also spy Bustard Head Lighthouse on the rocky headlands to the north. Easy 850 m return 30 mins Grass Tree Trail From the Fraser Park amphitheatre, stroll through open forest to Grasstree lookout. Catch panoramas of the Fitzroy River along the way. Enjoy views of the three peaks of Mount Badger, Sleipner and Berserker from the lookout. Medium 2 km return 45 mins Healing Circle White Station Short walk to healing circle Medium 1.9 km return 1 hr Humpy Island Ridgetop Trail A rough track with an intial steep section, leaves from the camping area and takes you through the island's different habitats. Views from the island's high points are spectacular. Don't forget to look for marine life such as whales, dolphins and large fish in the surrounding waters. Looking north from the ridge top you will see Halfway Island and Cathedral Rock between Humpy and Great Keppel Island. « Walks 1-10 of 87 » (adsbygoogle = window.adsbygoogle || []).push({});"
