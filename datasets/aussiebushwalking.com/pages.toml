["https://aussiebushwalking.com/nsw/clarrie-hall-dam"]
title = "Clarrie Hall Dam - Aussie Bushwalking"
description = "Clarrie Hall Dam - Water views south and west across the dam"
full_description = "Menu Edit this walk Navigate to... GPS Tracks Clarrie Hall Dam (GPX) Water views south and west across the dam Lookouts Bird Watching Picnic Facilities BBQ Swamp or Wetland Add to My Wishlist Remove fromMy Wishlist Tick Walk (adsbygoogle = window.adsbygoogle || []).push({}); Getting there 3.3km south west of Uki, NSW. Drive to the end of the paved Clarrie Hall Dam Rd, Uki NSW. Maps Which maps cover the area? Route/Trail notes Start at the end of the paved road. Permits/Costs Nil Other References Byron Trails p100, ISBN 9780994560100 GPS Tracks Clarrie Hall Dam (GPX) Comments A nice bush walk as long as you don't take the left turn at the end of the walk. The left turn takes you to a very steep and long climb which ends with no view or scenic point... So good for the sport of it, but don't expect too much... Noam Hillel on 10 Apr, 2023 A nice bush walk as long as you don't take the left turn at the end of the walk. The left turn takes you to a very steep and long climb which ends with no view or scenic point... So good for the sport of it, but don't expect too much... Noam Hillel on 10 Apr, 2023 A nice bush walk as long as you don't take the left turn at the end of the walk. The left turn takes you to a very steep and long climb which ends with no view or scenic point... So good for the sport of it, but don't expect too much... Noam Hillel on 10 Apr, 2023 Nice walk with few hills for a little cardio Sophie S on 13 Dec, 2020 Easy and nice track - but the super steep hill towards the end was a surprising twist that neither of us were fit enough for at the time. It's fine though - you don't have to complete this section to enjoy the walk up to this point if you don't wish to do the hill. BeckNWood on Aug, 2020 Follow the track from the car park for about 2 km then you can either turn left on a non stop assent until flat where you can climb again on the left to a summit without a view but it’s a descent effort (and tricky downhill return) but going the other way lead to the lake with a possible loop back to that “crossroads”. matthias levy on 19 Jul, 2020 Awesome walk. Lots of hills but not so hard. If you go to the right at the signs at the end there is a lovely lookout over the dam but keep in mind it is very steep. Not for the faint hearted. Suzanne on 21 Jul, 2019 Nice walk, note that there is a controlled entry and the gate closes at either 5 or 6 depending on day light saving. Rbanni on 1 Jan, 2019 A little hilly but a few nice view points along the way. Was a bit muddy due to recent rain. The end section to the final viewpoint (not part of the Dam Wall Trail) had knee high grass. Be cautious of snakes. rob.bushman on 26 Dec, 2017 « Comments 0-9 of 9 » Tick this walk and add your own comments (adsbygoogle = window.adsbygoogle || []).push({}); This will report the image to moderators for review. Are you sure this image is offensive? Aussie Bushwalking users can maintain a wishlist of walks for you but you need to be a member. Click here to login if you're already a member, otherwise go here to register for your free account. Navigation to some bushwalks can be difficult. Automated navigation using Google Maps or Apple Maps may not be accurate. Additionally, Aussie Bushwalking doesn't always have accurate positions for where to park for a walk. Please read the walk description for special directions and take extra care. Medium 5.4km return 2hrs These values are provided by users. Your evaluation may differ. Where Click here to load this map. Nearby Walks Mt Warning Summit Trail (Wollumbin National Park) Rowlands Creek (Mt Jerusalem National Park) Hell Hole Falls (Mt Jerusalem National Park) Unicorn Falls (Mt Jerusalem National Park) Mt Chowan (Mt Jerusalem National Park) Done this walk? This walk has been ticked 18 times Aussie Bushwalking can keep track of your bushwalks. Login/signup to tick this walk off."
