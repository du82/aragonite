full_description = '''Personal details (including email address) are not passed on to any third party unless explicitly requested by the user, required to by law or as the direct fulfillment of the offered service. Aussie Bushwalking reserves the right to send emails to its members. Becoming a member of Aussie Bushwalking includes agreeing to receive emails from Aussie Bushwalking. Membership cancellations may be requested via email to eval(unescape("%70%7a%6c%68%73%39%30%3d%5b%27%25%36%31%25%36%34%25%36%64%25%36%39%25%36%65%27%2c%5b%27%25%36%33%25%36%66%25%36%64%27%2c%27%25%36%31%25%37%35%25%37%33%25%37%33%25%36%39%25%36%35%25%36%32%25%37%35%25%37%33%25%36%38%25%37%37%25%36%31%25%36%63%25%36%62%25%36%39%25%36%65%25%36%37%27%5d%2e%72%65%76%65%72%73%65%28%29%2e%6a%6f%69%6e%28%27%2e%27%29%5d%2e%6a%6f%69%6e%28%27%40%27%29%3b%62%61%63%63%6b%30%35%3d%75%6e%65%73%63%61%70%65%28%70%7a%6c%68%73%39%30%29%3b%64%6f%63%75%6d%65%6e%74%2e%77%72%69%74%65%28%62%61%63%63%6b%30%35%2e%6c%69%6e%6b%28%27%6d%61%69%27%2b%27%6c%74%6f%3a%27%2b%70%7a%6c%68%73%39%30%29%29%3b"));. All personal data will be removed when your membership is cancelled. The site will not store user's passwords in plain text. Passwords are not recoverable. Passwords may be reset using the "Forgotten Password" feature. The site does not use a secure communications channel during login, so passwords will be transmitted unencrypted over the Internet. For this reason it is recommended that users do not reuse passwords from other sites. Users may choose to make their accounts public to allow some of their statistics to be viewable. Users may control this through their profile page. Aussie Bushwalking may use account information for deriving aggregate statistical information. For example, Aussie Bushwalking may derive most popular walks based on site usage. Aussie Bushwalking may target internal services, commercial offers, or advertising based on account information. In such a case, Aussie Bushwalking will NOT transfer personal information, that identifies you, to any third party. (For example we may make a commercial offer to walkers in a specific area, on behalf of another organization, but we will NOT supply the details of who we made the offer to). We use third-party advertising companies to serve ads when you visit our website. These companies may use information (not including your name, address, email address, or telephone number) about your visits to this and other websites in order to provide advertisements about goods and services of interest to you. If you would like more information about this practice and to know your choices about not having this information used by these companies, view the network advertising website.'''
