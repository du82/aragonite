["https://aussiebushwalking.com/users/31098"]
title = "Profile for Curry Bunch - Aussie Bushwalking"
description = "Aussie Bushwalking profile for Curry Bunch"
full_description = "This Year 0 Number of Walks Ticked 0.0m Total Distance Ticked All Time 16 Number of Walks Ticked 99.3km Total Distance Ticked Ticks Name Date Difficulty Distance/Duration Caves Track (Lamington National Park) 25 Sep, 2020 Medium 5.2km return 90 mins Half of this walk is still closed from 2019 fires. Enter from just down the hill of the Tea house. All down hill to the caves which is 1 cave but much bigger than we imagined. Really spectacular and worth the trip. Gorgeous rainforest to enjoy through and a soft path underfoot from all they leaf litter. You currently return the same way you enter. Saw a number of black cockatoos and heard lots of birds. There is a definite line of fire affected bush and then suddenly, no affect at all, quite incredible to see it. Will post a pic but it won't do it justice. Tullawallal Circuit (Lamington National Park) 24 Sep, 2020 Easy 5km return 90 mins A lovely, easy grade walk in beautiful forest. No real view at the end, just sitting on rocks in amongst the trees. Lots of birds to listen to. Greenes Falls via Rainforest Circuit + Cypress Grove Circuit (D'Aguilar National Park) 25 Jul, 2020 Medium 4.3km return 2 hrs Walked this in the rain today and it was stunning. Not a difficult walk, gentle up hill on the return leg but very achievable. Not very muddy, great board walk sections and gravel sections. Muddy puddles were limited, 10 yr old would have liked more. Very well maintained track. Table Top Loop (Toowoomba) 1 Jul, 2020 Hard 2km return 2 hrs A short walk but it is straight up and a rock scramble for much of it. Our boys loved it! Took half an hour up and down again, around 20mins up top taking in the magical view. Mount Kiangarow (Bunya Mountains) 29 Jun, 2020 Medium 2.3km return 1 hr Great spot for a sunset. Easy walk. Mt Mitchell (Main Range National Park) 14 Jun, 2020 Medium 10.98km 3.5 hrs Easy walk, path slowly climbs well defined track. Nothing difficult about the climb. Went when it was raining the whole time, cold and windy and saw absolute nothing but LOVED it! The 2 10yr olds had the time of their lives. Will climb again in good weather and do My Cordeaux on the same day. This walk is very achievable and takes around an hour to go up, faster on the way back. Goolman Lookout via Rocky Knoll (Ipswich - Flinders Goolman Conservation Estate) 7 Jun, 2020 Medium 7.4km 2 hrs An enjoyable walk. We went in a clockwise direction via Rocky Knoll first then onto the lookout. The track had recently been graded so coming down was easy on a mostly smooth path. The way down was steeper than the track up and we found this much easier to manage. Recommend going clockwise via Rocky Knoll first. Took an hour up and 40mins down with 3 kids in tow. Cradle Mountain Summit (Cradle Mountain-Lake St Clair National Park) 24 Dec, 2019 Hard 18km return 7 hrs We started at Ronny Creek and followed the Overland Track the summit base at Kitchen Hut. Marion's Lookout was a great snack stop. Crater Creek and Crater Lake were beautiful on the way. The climb up the summit is hard. Big rocks, big gaps between and big drops but so very, very worth the effort to make it to the very top. We climbed it with a 9 and 12 yr old. Slow going at times but plenty of chances to enjoy the view. Horsetail Falls (West Coast Tasmania) Dec, 2019 Easy 800m return 20 mins After seeing images of this online it was a must! The boardwalk is awesome, very easy walk with beautiful views of a different world landscape. Very little water flowing but so pleased we did it. Mt Warning Summit Trail (Wollumbin National Park) 31 Aug, 2019 Hard 8.3km return 5 hrs Really beautiful walk. Did it with a 12 and 9 year old very comfortably. The view at the top is spectacular. Disappointing to see that people just drop their rubbish though. Really not hard to take everything back in your bag with you. Buhot Creek Circuit (Daisy Hill Conservation Park) 25 Aug, 2019 Easy 9km return 3 hrs Enjoyable walk through Daisy Hill. Thought we were following the map so well until we were suddenly way off course. Oh well, still enjoyed the walk even if signage around the Neville Laurie Reserve was where we went wrong. Mt Cotton (South East Queensland) 11 Aug, 2019 Medium 3.5km return 75 mins Enjoyed this walk. Not too taxing, steep climbs but very manageable. Took 25mins to get to the top. Continued beyond the lookout to see great views to the west. We started from 640 West Mount Cotton Rd and after walk, drive down the steep hill and wandered around the little creek at the bottom, really lovely walking along the edge of the steam. Small Cave (Plunkett Conservation Park) (South East Queensland) 28 Jul, 2019 Medium 4km return 2 hrs Not too challenging all at. Walked with a 9 & 12 yr old who loved the cave and rock hopping. After visiting the cave, we explored the rocks a little higher up and further along to the right. Lots of fun. Great directions to ensure we made it up the right track to the top, multiple walking trails in this area. Flinders Peak (Ipswich - Flinders Goolman Conservation Estate) 14 Jul, 2019 Hard 6.5km return 3.5 hrs What a fantastic walk. Took our 9 & 12 yr old who loved it. A hard walk but with such a step walk, the views are impressive from very early. The first 3rd of the walk is nothing special, steep, loose underfoot and dull. Once you get to the rocks it is awesome. The view from the top is breathtaking. Will do it again for sure. Box Forest (Lamington National Park) 9 Jul, 2019 Medium 10.6km 5 hrs Great walk. Plenty of rain in the last 2 weeks made the track really muddy in patches which added to the adventure. Beautiful waterfalls with lots of water flowing. 3 water crossings in total, 2 easy and 1 requiring a little more thought. We walked clockwise thanks to the suggestions and definitely the way to go. Wild Horse Mountain (Glass House Mountains National Park) 2015 Medium 1.4km return 30 mins Great view from the top. Steep but it's over quickly. « Ticks 1-16 of 16 »"
