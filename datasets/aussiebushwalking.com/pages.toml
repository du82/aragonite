["https://aussiebushwalking.com/nsw/shelley-head-camp-ground-from-angourie-"]
title = "Shelley Head Camp Ground (From Angourie) - Aussie Bushwalking"
description = "Shelley Head Camp Ground (From Angourie) - This campground is a lovely spot to walk to for a day picnic, swim and explore. It also has overnight walk in camps available if you wish to saty. You can access it from Angourie, heading south for 6km's or Lake Arragan, walking north for 7km's. This walk makes up part of the larger Yuraygir Coastal Walk."
full_description = "Menu Edit this walk Navigate to... This campground is a lovely spot to walk to for a day picnic, swim and explore. It also has overnight walk in camps available if you wish to saty. You can access it from Angourie, heading south for 6km's or Lake Arragan, walking north for 7km's. This walk makes up part of the larger Yuraygir Coastal Walk. Swimming Bird Watching Picnic Facilities BBQ Coastal Add to My Wishlist Remove fromMy Wishlist Tick Walk (adsbygoogle = window.adsbygoogle || []).push({}); Getting there Access from the North is via the Angourie Back Beach car park. Other References More information can be found on the NSW National Parks Website https://www.nationalparks.nsw.gov.au/camping-and-accommodation/campgrounds/shelley-head-campground GPS Tracks No GPS available for this walk yet. Comments Beautiful views the whole way!! Angourie Coastal Trek is gorgeous. If you love the beach, exploring and collecting rocks or shells, this is the hike for you. It isn't a difficult hike, and there are plenty of places to stop and bask in the beauty around you. Make sure you slip, slop, slap though, as there is no coverage, you will be hiking out in the sunshine. :) Don't forget to visit the cave at the very end of the hike before you turn around to trek back - it is worth it. Faith on 29 Jun, 2024 Perfectly ideal beach & headland walk Angus Small on Mar, 2017 Travelled across from Iluka for a family fun day of walking. We walked through to Lake Arragon and returned which was 18 kms with a bit of exploring along the way Aussie Weekend Warrior on 29 Dec, 2015 « Comments 0-3 of 3 » Tick this walk and add your own comments (adsbygoogle = window.adsbygoogle || []).push({}); This will report the image to moderators for review. Are you sure this image is offensive? Aussie Bushwalking users can maintain a wishlist of walks for you but you need to be a member. Click here to login if you're already a member, otherwise go here to register for your free account. Na