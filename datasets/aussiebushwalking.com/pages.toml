["https://aussiebushwalking.com/qld/main-range/mt-cordeaux"]
title = "Mt Cordeaux  - Aussie Bushwalking"
description = """
Mt Cordeaux  - Mt Cordeaux forms the Northern side of Cunningham's Gap. The track ends at a platform just below the main peak and is ideal for viewing South, down the length of Main Range National Park. There are also good views of the Moogerah Peaks, Mt Barney and North to the Mistake Mountains.

National Parks signage officially lists this walk as Grade 4 difficulty (most of the track is unsealed, with hazards such as tree roots/rocks, muddy sections and occasional tree-falls across the path). Walkers with a moderate level of fitness should find this a comfortable walk and be able to complete it in under the given timeframe."""
full_description = "Menu Edit this walk Navigate to... GPS Tracks Mount Cordeaux (GPX) Mt Cordeaux forms the Northern side of Cunningham's Gap. The track ends at a platform just below the main peak and is ideal for viewing South, down the length of Main Range National Park. There are also good views of the Moogerah Peaks, Mt Barney and North to the Mistake Mountains.National Parks signage officially lists this walk as Grade 4 difficulty (most of the track is unsealed, with hazards such as tree roots/rocks, muddy sections and occasional tree-falls across the path). Walkers with a moderate level of fitness should find this a comfortable walk and be able to complete it in under the given timeframe. Lookouts Bird Watching Toilets No Dogs Permitted Rainforest Eucalypt Forest 1135m Maximum Elevation Add to My Wishlist Remove fromMy Wishlist Tick Walk (adsbygoogle = window.adsbygoogle || []).push({}); Getting there From Brisbane follow the Cunningham Highway towards Cunningham's Gap. Due to road construction, hikers must park at West Gap picnic area, which is west of the gap! Then walk Box Track to the regular trailhead for Mt Cordeaux. This adds an easy 5 km to the entire hike up to Mt Cordeaux and back. Maps The track is clearly marked so no map is required, however the Sunmap Cunninghams Gap sheet covers the area. Further Walks The Mt Cordeaux track continues on to Bare Rock/Morgan's Walk and is worth the effort if you have the time. Allow 4.5 hours to complete the full track. GPS Tracks Mount Cordeaux (GPX) Comments Beautiful hike. Saw The Green Catbird and heard it's bird call. Absolutely surprised by its sound like a cat. The view from the top is amazing. Hike down our track was blocked by a huge monitor. Had to wait 5 minutes for it to go in the bushes. The extra hike due to car park closure is a pain though, hopefully they finish the roadworks soon. Smiley on 19 Jan, 2025 You will need to park at West Gap parking lot because of the road construction. According to the park service, it adds 5 km total to the hike to Mt Cordeaux. Lots of big Box trees on this “extra” hike along Box Track, but admittedly there is a lot of road noise. Still a great hike though! Molly Krupa on 1 Oct, 2024 12.5k return with the Box Trail walk from the temp car park, my son went on a birthday walk with friends and their parents and my daughter and I walked ahead, beautiful day, just slightly marred by some bush burning which made the view from the top a bit hazy, easier walk that Mt Mitchell.. great for kids..did not care for the few ticks that hitched a ride on my jumper though. Will Walk For Food on 11 Aug, 2024 I've been up here many times. This was the worst. The good part was no one on the path, up or down; an explicable miracle maybe. I left at 8am, but there were major roadworks and I had to park 3km down the road at the picnic areas and then follow a boring track paralleling the road back to the memorial and the start of the Mt Cordeaux track. The roadworks cover about 6km and look like they will continue for most of a year. Beware as this diversion adds 7km to the walk. I didn't see anyone until I was back on this extension track at 10:30am - then I passed 7 groups going up in pouring rain, which had started when I reached the summit. It was also a white-out up there. I had wanted to do the Bare Rock ridge extension, but the weather was too horrible. Solo trip. Should have gone to my gym class instead. Kaz Manley on 8 Jul, 2024 Walked Mt Cordeaux for first time. Great, well-formed, and safe track. 1 hr 15 mins up and a bit quicker back down. Very quiet track leaving at 5.30am. Incredible wildlife - lots of potoroos, and stoked to see 2x Albert's Lyrebirds. qldnick on 26 May, 2024 We did this walk with 14yo, 12yo and 9yo. Really enjoyable, mainly out and back with a small loop section at the bottom. Rainforedt, a bit muddy, but good adventure stuff. Pretty busy due to public holiday, but didnt matter. Marcus coleman on 6 May, 2024 Such a beautiful walk. Very humid in the summer but walking across the saddle to bare rock is spectacular. pulsade on 10 Jan, 2024 A few Giant Spear Lilies still in bloom. Was a good season for those plants. Wanderlust on 2 Oct, 2023 Nice winter walk ⛰️ Took an hour up from the Crest Carpark at a very brisk pace. IMO the views are way better at Bare Rock. I would also recommend checking out the little crevice with the gold miner's sign; it's cool to walk through the gaps between the mountain :) :) on 4 Aug, 2023 2nd time hiking Mt Cordeaux. We did a late afternoon hike so we could make it to Bare Rock for sunset. It took us about 1 hour to get to Mt Cordeaux lookout at a moderate pace.Such a great hike with beautiful views! Suz on 8 Jul, 2023 Loved this hike! The fact that the hike was pretty much covered the majority of the way by lush rainforest was in my books - 'perfect'. I would class this one of the more enjoyable hikes that I've done, and will definitely do it again. The views from the top are magnificent! Make sure you pack a picnic to enjoy at the peak. 🙂 Faith on 27 May, 2023 as of May 2023 you can't go all the way to the top. Its been blocked off because of Fragile Enviromental reasons. The views are quite nice from that place but if you wanted to get to the highest point....well you can't Jozef KESEG on 8 May, 2023 Brilliant walk - this was my 5th time and I'm still itching to do it again. Perfect weather today & cool enough at the moment for a lunchtime walk. Easy to handle for kids with lots of changes in vegetation/views to keep things interesting. I overheard my 8 year old telling my 6 year old it was just like the changes in landscape in Minecraft. Steph T on 11 Apr, 2023 One of the most visually spectacular walks I've done in SEQld!! Not a technically difficult walk, took Miss 11 and Miss 8 who started to tire in the last 20 mins (we also did the Bare Rock walk). Carpark was full when we arrived at 0830 on a Saturday. Tegan on 21 Jan, 2023 Nice walk, started 5am thursday morning and didn't encounter anyone else. Added Bare Rock which was worth the extra couple of KMs. Total distance 12.65km, 495 elevation gain, 2h 35m elapsed time. Brent on 19 Jan, 2023 First night hike to see new year in. Bit slower in the dark lots of slippery rocks and roots. Got to top with 20 minutes to spare. Only saw faint flashes of the fireworks in Brisbane city 110klms away through the clouds. The clouds lifted about 15minutes to late. Back down and tucked up in bed by 4.30am. ian parker on 31 Dec, 2022 Nice easy well-graded walk. A few steps but nothing too strenuous. Nice compliment to Mt Mitchell if you have climbed that and are wanting to explore more of Main Range. We coupled it with Bare rock, which was only a few kms past the summit. Jess&JonM on 27 Dec, 2022 Fun easy walk, switchbacks made it very relaxed. Had a nice nap at the summit and hung out with a young Currawong (don't feed the wildlife!) and then hiked back down again. Total hiking time 1.5 hours. Sasha Thiedeke on 17 Aug, 2022 A great morning walk, not too difficult. I started at first light and there were already people there. Saw loads of wildlife - wallabies, lyre birds etc. Would 100% recommend continuing on the Bare Rock track if you have time. Was pretty muddy in parts and there was an icy wind towards the top. Jose on 8 Aug, 2022 It's easier than I thought it would be as grade 4 listed. Mai.H on 10 Jul, 2022 « Comments 0-20 of 209 » Tick this walk and add your own comments (adsbygoogle = window.adsbygoogle || []).push({}); This will report the image to moderators for review. Are you sure this image is offensive? Aussie Bushwalking users can maintain a wishlist of walks for you but you need to be a member. Click here to login if you're already a member, otherwise go here to register for your free account. Navigation to some bushwalks can be difficult. Automated navigation using Google Maps or Apple Maps may not be accurate. Additionally, Aussie Bushwalking doesn't always have accurate positions for where to park for a walk. Please read the walk description for special directions and take extra care. Medium 6.8km return 2.5hrs These values are provided by users. Your evaluation may differ. Where Click here to load this map. Nearby Walks Palm Grove Circuit (Main Range National Park) Cunninghams Gap to Mount Castle (Main Range National Park) Gap Creek Falls (Main Range National Park) Cunninghams Gap to Laidley Creek Falls (Main Range National Park) Box Forest Track (Main Range National Park) Done this walk? This walk has been ticked 714 times Aussie Bushwalking can keep track of your bushwalks. Login/signup to tick this walk off."
