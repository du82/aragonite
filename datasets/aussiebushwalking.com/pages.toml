full_description = "This Year 0 Number of Walks Ticked 0.0m Total Distance Ticked All Time 27 Number of Walks Ticked 109.2km Total Distance Ticked Ticks Name Date Difficulty Distance/Duration Mt Maroon (Mt Barney National Park) 29 Sep, 2023 Hard 6km return 4 hrs With two boys 12 and 9 years old, we took 4 hours return. The end of the trail, it is very challenging. Flinders Peak (Ipswich - Flinders Goolman Conservation Estate) 8 Oct, 2022 Hard 6.5km return 3.5 hrs We took 5.5hours return. When came down, we got lost to go to other way, and we saw a big cave. Somebody is cliff climbing there which is very cool. Normally we should took 4.5hours. Mt Mitchell (Main Range National Park) 3 Oct, 2022 Medium 10.98km 3.5 hrs It is a bit muddy after a rainy day. It’s a easy walk at the end it has some steps. Mount Coolum (Sunshine Coast) 24 Sep, 2022 Medium 2.6km return 90 mins It’s really excellent track. You can spot whales on the top. Coochiemudlo Island Walk (Moreton Island National Park) 28 May, 2022 Easy 5km return 2 hrs Not very long to walk around the island. The residents are very friendly. Coochiemudlo Island Walk (Moreton Island National Park) 28 May, 2022 Easy 5km return 2 hrs Not very long to walk around the island. The residents are very friendly. Koala Discovery to Paperbark Trail (Daisy Hill Conservation Park) 16 Jan, 2022 Very Easy 800m return 20 mins Easy leisure walk Koala Discovery to Paperbark Trail (Daisy Hill Conservation Park) 16 Jan, 2022 Very Easy 800m return 20 mins Easy leisure walk Barker Creek Circuit (Bunya Mountains) 4 Jan, 2022 Easy 10km return 3 hrs It’s nice to see lots of Bunya pine tree. There is a kind of plant which leaves are prickly. Mount Kiangarow (Bunya Mountains) 4 Jan, 2022 Medium 2.3km return 1 hr Easy walk to see the beautiful view Coomba Water Hole (Wide Bay Burnett) 4 Jan, 2022 Easy 800m return 30 mins The rocks are beautiful Scenic Circuit (Bunya Mountains) 3 Jan, 2022 Easy 4km return 80 mins Good to see Bunya’s special pine tree. The Cliffs Boardwalk (Brisbane City Council Local Walks) 2022 Very Easy 2km one-way 30 mins Kangaroo point has great view Buhot Creek Circuit (Daisy Hill Conservation Park) 7 Sep, 2021 Easy 9km return 3 hrs We ride along the track, not too hard. Natural Bridge (Springbrook National Park) 1 Jul, 2021 Very Easy 1km return 30 mins Family friendly walk track Table Top Loop (Toowoomba) 27 Jun, 2021 Hard 2km return 2 hrs A bit challenging to climb it, but really fun. My boys’ favourite mountain. Purling Brook Falls Circuit (Springbrook National Park) 11 Apr, 2021 Medium 4km return 2 hrs The two waterfalls are amazing . Good to see the rainbow. Simpsons Falls and Eugenia Circuit (Mt. Coot-tha) 29 Jan, 2021 Easy 4km 90 mins Good for exercise King Island (South East Queensland) 2021 Easy 2km return 1 hr It is fun to walk to an island. Morans Falls (Lamington National Park) 28 Sep, 2019 Easy 4.4km return 90 mins Nice view, and nice waterfall even it is no rain for a long time. « Ticks 1-20 of 27 »"
