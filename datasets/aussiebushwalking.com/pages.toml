["https://aussiebushwalking.com"]
title = "Aussie Bushwalking"
description = "Aussie Bushwalking is a user-supplied list of bushwalking and hiking tracks in Australia - made by bushwalkers, for bushwalkers. Find walks, share track conditions and track your hiking activities."
full_description = "It's like Wikipedia... but for Bushwalkers! Aussie Bushwalking is a user-supplied list of bushwalking and hiking tracks in Australia - made by bushwalkers, for bushwalkers. It helps bushwalkers find new walks, share walks and track conditions and remember their Australian bushwalking/hiking activities. Find a walk Share a walk Remember a walk Join for free New Walks Birnam Range (South East Queensland - 7km return) Walk along the spine of the Birnam Range. The trail along the range stretches for 7-8kms starting in the South from the end of Monmouth Ct or the main Mundoolun Road and finishing in the North at Currawong… Enoggera Creek walk (Brisbane City Council Local Walks - 13km one-way) Walk along the Enoggera Creek from the Enoggera Reservoir to Bowen Bridge, where the creek joins Breakfast Creek and Brisbane River. Crossing the suburbs The Gap, Ashgrove, Newmarket, Herston and many… Carrolls Creek Loop (Bald Rock National Park - 19.7km return) Trailhead at Bald Rock day use area.Walk includes Little Bald Rock and two creek crossings (sturdy bridges). 4km are on the Bald Rock access road Birdcage - Bayview Conservation Area (Queensland - 1.9km one-way) An easy 1900m walk that is one of the many trails through the Bayview Conservation Area. Glimpses of the ever-growing suburbia nearby at times but feels like a million miles away. Narrow track winds through… Basin Lake (Great Sandy National Park - 5.6km return) Walk through lush rainforest and woodlands to what is regarded by many as the island’s most beautiful lake. Recent Articles Bushwalking Clubs (Queensland) A list of bushwalking and hiking clubs in Queensland, including Brisbane and South-East Queensland. Getting started with hiking How do you start hiking, bushwalking or tramping? This page will give you some tips for somebody who wants to get out and enjoy the Aussie bush. Turtle Rock (Girraween National Park) Find out what it takes to be a real Girraween photographer... Racecourse Creek (Girraween National Park) A lyrical reflection on a magical campsite in Girraween National Park. Other Websites Aussie Bushwalking doesn't contain all the world's bushwalking knowledge (yet) so here's some other sites to fill in your time when you're stuck at home. News Ships Stern Circuitwas ticked by ian parker 23 hours ago Third time around this track. This time I did it anticlockwise. It's not a hard hike but it is a long one. Took me 7.5 hours including stops. Lots of palm waste littering the track more or less the whole way round. Mahogany Trailwas ticked by Kent yesterday Mt. Coot-tha Summit Trackwas ticked by Kent yesterday Imbil Brooloo Rail Trailwas ticked by Jasmin 2 days ago A beautiful trail for the whole family. Lots of native wildlife, so keep an eye and an ear out! Amama Walkwas ticked by Jasmin 2 days ago Go after some rain for the best experience of the cascades, be prepared for some slippery rocks and mud. Such a beautiful walk and easy to do with kids, I even took my grandparents who managed the trail easily. Forest Lakeside Ewen Maddock Dam was ticked by Jasmin 2 days ago Lots of wildlife on this track, absolutely beautiful scenery Mt Warning Summit Trail New South Wales A trail to the summit of Mt Warning that has beautiful 360 degree views of the great dividing range. Mt Cordeaux Queensland A great track walk with an outstanding view."
