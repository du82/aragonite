["https://aussiebushwalking.com/qld/ddsw/girraween-np/aztec-temple"]
title = "Aztec Temple - Aussie Bushwalking"
description = "Aztec Temple - An off track walk from the end of the Underground Creek Trail containing a field of fascinating large stone pillars of various sizes, some of which (Main Pillar) can only be scales with ropes and shackles."
full_description = "Menu Edit this walk Navigate to... GPS Tracks Aztec Temple (GPX) An off track walk from the end of the Underground Creek Trail containing a field of fascinating large stone pillars of various sizes, some of which (Main Pillar) can only be scales with ropes and shackles. Waterfalls Scrambling or Climbing No Dogs Permitted No Camping Permitted Rainforest Eucalypt Forest 1013m Maximum Elevation 40m Total Climb Add to My Wishlist Remove fromMy Wishlist Tick Walk (adsbygoogle = window.adsbygoogle || []).push({}); Getting there: Girraween NP is situated approximately 260km by road south-west of Brisbane. To reach the park, turn off the New England Highway 26km south of Stanthorpe or 30km north of Tenterfield onto Pyramids Road. The winding bitumen road continues a further 9km east through the Wyberba Valley to the park's Information Centre. Continue along the gravel section of the road for a further 3.5km to the Underground Creek car park. An alternative road from Stanthorpe to Girraween via Eukey and Storm King Dam has some gravel sections. Maps: None found. You won’t find this mentioned on any Girraween National Park website. Route/Trail notes: From the car park go to Underground Creek where the track continues across a water covered ledge to the right and around the main rock feature. Don’t climb the rock, but head straight out along its side till you cross the fire trail (Peak Trail). From here you head up the gradual ridge until you reach these amazing granite formations. Once you reach the boulders, it is suggested that you circle them anti clockwise. There is no given trail to follow. Return by the same route. Due to the creek crossing at Underground Creek it is not possible to complete this walk after heavy rain. Permits/Costs: None. Other References/Comments: With so many bushwalking options in the park, why not take advantage of the excellent camping facilities at Castle Rock. Girraween National Park GPS Tracks Aztec Temple (GPX) Comments Nobody has commented on this walk yet. If you've done it then tick it off and add a comment. Tick this walk and add your own comments (adsbygoogle = window.adsbygoogle || []).push({}); This will report the image to moderators for review. Are you sure this image is offensive? Aussie Bushwalking users can maintain a wishlist of walks for you but you need to be a member. Click here to login if you're already a member, otherwise go here to register for your free account. Navigation to some bushwalks can be difficult. Automated navigation using Google Maps or Apple Maps may not be accurate. Additionally, Aussie Bushwalking doesn't always have accurate positions for where to park for a walk. Please read the walk description for special directions and take extra care. Medium 5km return 3hrs These values are provided by users. Your evaluation may differ. Where Click here to load this map. Nearby Walks Underground Creek (Girraween National Park) Dr Roberts Waterhole (Girraween National Park) Mt Norman (Girraween National Park) Castle Rock (Girraween National Park) Peak and Creek Trails (Girraween National Park) Done this walk? This walk has been ticked 5 times Aussie Bushwalking can keep track of your bushwalks. Login/signup to tick this walk off."
