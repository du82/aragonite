description = "Stringybark Circuit to Daisy Hill Quarry - This is a well-rounded walk through the Daisy Hill Conservation Park bushland out to the Old Quarry. Note, this is a shared trail for walkers, bikes and horses. A pleasant walk with a few easy hills. From the car park at Daisy Hill Road the route follows mostly unsealed/gravel road until you reach the quarry."
