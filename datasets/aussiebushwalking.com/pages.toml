["https://aussiebushwalking.com/qld/se-qld/sunshine-coast/imbil-brooloo-rail-trail"]
title = "Imbil Brooloo Rail Trail - Aussie Bushwalking"
description = "Imbil Brooloo Rail Trail - Opened in July 2019, this rail corridor has thankfully been restored to provide a beautiful track for walkers, cyclist and horse riders. A highlight is its passage through Bell Bird Park, where a colony of more than 120 Bell Birds provide a continual chorus for visitors."
full_description = "Menu Edit this walk Navigate to... GPS Tracks 275 Imbil Brooloo Rail Trail (GPX) Opened in July 2019, this rail corridor has thankfully been restored to provide a beautiful track for walkers, cyclist and horse riders. A highlight is its passage through Bell Bird Park, where a colony of more than 120 Bell Birds provide a continual chorus for visitors. Bird Watching Heritage Sites Wheelchair Accessibility Dogs Permitted Horses Permitted Cycling Permitted Eucalypt Forest 162m Maximum Elevation 28m Total Climb Add to My Wishlist Remove fromMy Wishlist Tick Walk (adsbygoogle = window.adsbygoogle || []).push({}); Getting there: Head for Imbil and at the Railway Hotel turn into William Street and follow this to the end, where you take a right into Selwyn Street and immediately left into the trail's car park. Maps: Imbil Brooloo Rail Trail Imbil Brooloo Rail Trail Map . Courtesy of 'Where to Mountain Bike in South East Queensland'. Route/Trail notes: From the car park, head through the gate and onto the trail, which you follow all the way to Brooloo and return by the same route. You pass through various gates as you cross access roads, and where there was once a bridge, you now have a concreted path down to the creek and back up the far side. Permits/Costs: None. Other References/Comments: This is a shared trail for walkers, cyclists, dog walkers, horse riders and on the day I was there, even a mobility scooter. There is a proposal to extent the walk back across Imbil bridge, through the tunnel to Melawondi and on to Kandanga and Amamoor to link with the Mary Valley Rattler rail line. If you are staying over, there are a number of campsites: Imbil Camping Retreat, Deer Park and Lake Borumba Caravan & Camping Ground. GPS Tracks 275 Imbil Brooloo Rail Trail (GPX) Comments This is a little gem. Easy; gradient so slight as to be unnoticeable; good surface. Native bush on one side, hoop pine plantation on the other. Birds, birds, birds; pademelons; signs of significant bandicoot activity; a few stray cattle. The bellbird habitat is the highlight; said to number well over 150. They are everywhere; in trees; in bushes; on the ground. Get straight to the bellbirds from the sign about 2km out of Brooloo, on the Imbil/Boorloo Road; take the dirt road and drive a few hundred meters where you will come across the rail trail and the bellbirds. dennis round on 27 Jul, 2021 Good Jeffrey Nuttall on 29 Jun, 2021 Nice short walk with lovely scenery. A very well maintained, easy trail. Annie M on Jul, 2020 A beautiful trail for the whole family. Lots of native wildlife, so keep an eye and an ear out! Jasmin on May, 2020 What a great little walk for all the family (well the kids cycled), with its abundance of bird life. There are no facilities at either end of the trail, so a walk back into Imbil along the rail line and a well deserved drink at the Railway Hotel was on the cards. F.A.B. on 20 Oct, 2019 « Comments 0-5 of 5 » Tick this walk and add your own comments (adsbygoogle = window.adsbygoogle || []).push({}); This will report the image to moderators for review. Are you sure this image is offensive? Aussie Bushwalking users can maintain a wishlist of walks for you but you need to be a member. Click here to login if you're already a member, otherwise go here to register for your free account. Navigation to some bushwalks can be difficult. Automated navigation using Google Maps or Apple Maps may not be accurate. Additionally, Aussie Bushwalking doesn't always have accurate positions for where to park for a walk. Please read the walk description for special directions and take extra care. Easy 9.6km return 3hrs These values are provided by users. Your evaluation may differ. Where Click here to load this map. Nearby Walks Kenilworth Bluff - Wilcox Family Park Trail (Sunshine Coast) Mt Borumba (Conondale National Park) Amama Walk (Amamoor State Forest) Macadamia Walk (Amamoor State Forest) Cambroon Lane to Charlie Moreland Camping Area (Conondale National Park) Done this walk? This walk has been ticked 17 times Aussie Bushwalking can keep track of your bushwalks. Login/signup to tick this walk off."
