["https://aussiebushwalking.com/latest"]
title = "Latest Walks - Aussie Bushwalking"
description = "The latest walks on Aussie Bushwalking."
full_description = "Menu Search on map Search Browse walks (adsbygoogle = window.adsbygoogle || []).push({}); Very Easy 7 km return 2 hrs Jim Soorley Bikeway and Wetlands A shared bike way along the Schulz Canal into a wetland area with plenty of bird life. Medium 7 km return 2 hrs Birnam Range Walk along the spine of the Birnam Range. The trail along the range stretches for 7-8kms starting in the South from the end of Monmouth Ct or the main Mundoolun Road and finishing in the North at Currawong Ct. Outlined in this walk is a section of the trail along the highest part of the range starting from and returning to Mona Dr which is one of a few additional enterance points. Easy 13 km one-way 4 hrs Enoggera Creek walk Walk along the Enoggera Creek from the Enoggera Reservoir to Bowen Bridge, where the creek joins Breakfast Creek and Brisbane River. Crossing the suburbs The Gap, Ashgrove, Newmarket, Herston and many of the local parks. Easy 3 km return 1 hr Mt Walsh Waterfall Creek (Utopia Falls) This pleasant moderate grade walk to the rock pool area—a nice place to picnic, cool off in the shade beside the rock pools or just enjoy nature. The walk begins in hoop pine dominated dry rainforest and vine thickets fringing a moist gully. Further on, open forests and grassy woodlands feature and merge into shrubby heath along Waterfall Creek.The creek cascades through a series of rock pools that have potholed into the granite by years of water erosion. Cabbage palms, (Livistona decora), growing near the rock pools occur here at their most western limit. Further along Waterfall Creek, impressive water gums, (Tristaniopsis laurina), grow to over 25m high and wrap buttressed roots around rocks.Look for wildlife as you walk. You might see wonga pigeons in the dark shaded understorey of the rainforest or catch a glimpse of white-throated treecreepers in the open forest and woodland. Swamp wallabies also use the track and red-necked wallabies often feed around the rainforest fringes.Caution is required when accessing the creek as rocks may be slippery and unstable. Medium 7 km 2.3 hrs Mt Rooper/ Swamp Bay An excellent walk on well made linked tracks to the top of Mt Rooper and Swamp Bay in the Conway National Park. Medium 3 km return 1 hr Curlew and Ironbark Circuit Wide tracks but plenty of medium difficulty up and down as you criss cross ridges and creeks. Downhill can be a bit slippery on the gravel. Medium 2 km return 1 hr Kokoda Track A steep, short walk between Channel 9 and the Bellbird Trail. Hard 14 km return 4 hrs Holmans break This is a beautiful walk around a large section of the bushland in which Enoggera Reservoir sits. You will walk through lots of varied vegetation, keep an eye out for goannas, lots of different birds and turtles sunning themselves on a log in the dam. A great way to spend 4 hours! I do recommend that you have a map - you can purchase the topographical map from Walkabout Creek.Start out from the bottom carpark at Walkabout Creek, take the small track to the far right that follows Mt Nebo road. There is a very steep hill right in front of you! Follow this track for about 2 km, (turn around every now & again and you will catch glimpses of The Brisbane City skyline), The track will split - stay on the track that is to the right, still following Mt Nebo road, which is also on your right (you can't really see the road) for about another 1km. You will come to a bit of a clearing under the power lines - turn around and enjoy the view out over The Gap! There are great views of Mt Cootha on your left and the mountain range in the distance (that I don't know the name of!). There is quite a steep descent down to a beautiful creek - take some time to enjoy a rest here as there is a VERY steep ascent ahead of you! It's probably about a 600 metre climb, which will bring you out under another power tower. Look over to the next tower - that is where you are heading! Continue along the trail for about another 1 km and you will come to a T junction, stay left for another couple hundred metres to another junction - go left again onto Fire Break 69. Don't forget to look over to your left when you reach the power tower and see how far you have come! Continue down Fire Break 69 until you reach another junction - this is McDonalds Loop. We went to the left and followed it down to the end where it hooks up to the Enoggera Reservoir loop - again we went left and followed the trail back along the reservoir to Walkabout Creek. Medium 50 km return 2.5 hrs Northern Rivers Rail Trail - Tweed Section A 50km return walk or cycle along the old rail line between Murwillumbah and Crabbes Creek. Medium 3.3 km one-way 90 mins Baxter Falls - Northern Approach This walk leads through open eucalypt forest, dropping almost 300m down to the suspension bridge across Baxter Creek and the Falls to your left. The water falls into a 'bowl', before cascading into the bottom of the creek. Access to the 'bowl' is thought to be by bush bash to the left, but was not tracked. Medium 19.7 km return 4.5 hrs Carrolls Creek Loop Trailhead at Bald Rock day use area.Walk includes Little Bald Rock and two creek crossings (sturdy bridges). 4km are on the Bald Rock access road Medium 7.5 km return 3.5 hrs Westray's Grave from Christmas Creek Hike from Christmas Creek to Westray's Grave along the South Branch of Christmas Creek. An enjoyable hike with obstacles to traverse to reach Westray's Grave. A chance for a swim on a hot day! Return trip is approximately 3-4 hours depending on conditions. Medium 5.6 km return 2 hrs Basin Lake Walk through lush rainforest and woodlands to what is regarded by many as the island’s most beautiful lake. Easy 1.9 km one-way 30 mins Birdcage - Bayview Conservation Area An easy 1900m walk that is one of the many trails through the Bayview Conservation Area. Glimpses of the ever-growing suburbia nearby at times but feels like a million miles away. Narrow track winds through natural bushland with many native grass trees, commonly known as 'black boys'. Can loop around and head back along the wider fire trail that joins Birdcage or join another track and walk for much longer. This trail starts at the Kidd Street entrance, Redland Bay. Medium 4 km return 2 hrs Pile Valley Circuit Wander through magnificent stands of K'gari Satinay in lush rainforest, and discover the extraordinary tale of their survival and regeneration. Medium 2 km return 40 mins Fern Gully Follow an old bench trail up a man-fern filled gully abundant with natives, and then back down the creek bed. Easy 5.7 km return 90 mins Stringybark Circuit to Daisy Hill Quarry This is a well-rounded walk through the Daisy Hill Conservation Park bushland out to the Old Quarry. Note, this is a shared trail for walkers, bikes and horses. A pleasant walk with a few easy hills. From the car park at Daisy Hill Road the route follows mostly unsealed/gravel road until you reach the quarry. Medium 6 km one-way 3 hrs Shelley Head Camp Ground (From Angourie) This campground is a lovely spot to walk to for a day picnic, swim and explore. It also has overnight walk in camps available if you wish to saty. You can access it from Angourie, heading south for 6km's or Lake Arragan, walking north for 7km's. This walk makes up part of the larger Yuraygir Coastal Walk. Easy 6.2 km return 2.5 hrs Burringbar Range Tunnel A nice easy walk along the old abandoned Murwillumbah to Casino railway line (1894 to 2004) from Stokers Siding to the biggest tunnel (524m) on that line, with plenty of glow worms and some micro bats.This section of the track is now contained within the Northern Rivers Rail Trail - Tweed Section (2023). Very Easy 2.1 km return 45 mins The Balconies From the same car park as Reed’s Lookout you can walk to The Balconies for panoramic views of Victoria Valley and the surrounding ranges. The unusual rock formations that stick out of the mountain make this spot particularly unique. The Balconies are a great spot for fresh misty mornings and sunset views. « Walks 1-20 of 2181 » (adsbygoogle = window.adsbygoogle || []).push({});"
year_published = 2025
