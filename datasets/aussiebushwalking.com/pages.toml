title = "Girraween National Park - Aussie Bushwalking"
description = "Girraween National Park - Girraween is a national park which sits on the Queensland-New South Wales border near Stanthorpe. The park lies in the Granite Belt and is very popular for its granite landscape and wildflowers"
full_description = "Menu Browse all walks Browse latest walks Add a region Edit this region Add a walk Popular Walks The Pyramid (295 ticks) Castle Rock (172 ticks) Granite Arch (168 ticks) The Sphinx and Turtle Rock (122 ticks) The Junction (95 ticks) Parent Regions Darling Downs South West Queensland Summary Girraween is a national park which sits on the Queensland-New South Wales border near Stanthorpe. The park lies in the Granite Belt and is very popular for its granite landscape and wildflowers (adsbygoogle = window.adsbygoogle || []).push({}); Popular Walks The Pyramid (295 ticks) Castle Rock (172 ticks) Granite Arch (168 ticks) The Sphinx and Turtle Rock (122 ticks) The Junction (95 ticks) Parent Regions Darling Downs South West Queensland History Dr Spencer Roberts, a doctor from Stanthorpe, is largely responsible for the creation of Girraween and it's NSW neighbour Bald Rock National Park. The park started as Bald Rock Creek National Park, created in 1930 and Castle Rock National Park, created in 1932. When Napier Gunn offered his property to the government in 1966 the two parks were merged and became Girraween National Park Features Wildflowers and granite scenery! That nearly sums up the main reasons people walk in Girraween. The park includes a well maintained collection of walking tracks visiting the main features. Visit in Spring to witness spectacular wildflower displays. The park also receives snow occasionally during Winter. Access The primary access point to the park is from the New England Highway just South of Ballandean. Just follow the signposts onto Pyramids Rd, approximately 7km South of Ballandean or 11km North of Wallangarra. Pyramids Rd gives access to both Bald Rock Creek and Castle Rock camping grounds and the majority of the park's bushwalking trails. Maps A free national park map can be downloaded from http://www.derm.qld.gov.au/media/parks_and_forests/parks/girraween_national_park.pdf Hema maps publish a great map which covers Girraween, Bald Rock and Boonoo Boonoo National Parks. Accommodation Camping One National Park camping ground is available - Castle Rock. Other Numerous other accommodation options are available in the surrounding area. Just search for accommodation in the Stanthorpe area. More Info Official website - https://parks.des.qld.gov.au/parks/girraween Vanessa and Chris Ryan have a great website on Girraween with comprehensive info - http://www.rymich.com/girraween/ Walks in Girraween National Park Medium 5 km return 3 hrs Aztec Temple An off track walk from the end of the Underground Creek Trail containing a field of fascinating large stone pillars of various sizes, some of which (Main Pillar) can only be scales with ropes and shackles. Easy 4 km return 1 hr Bald Rock Creek Circuit This circuit is ideal for a sample of Girraween’s finest features, with ample opportunity to see some of Giraween’s feathered, furred or scaly residents.Cross Bald Rock Creek and follow it downstream along The Junction Track until it meets the track from the camping area. Use the stepping stones to cross the creek again and return to the day-use area via the camping area. Hard 4.4 km return 90 mins Castle Rock Panoramic views from Castle Rock are breathtaking including The Pyramids and Mt Norman.Officially rated Grade 4/Hard, this walk requires a moderate fitness level, some scrambling skills and confidence with heights. Easy 1.4 km return 30 mins Dr Roberts Waterhole Take the gently sloping track to gaze at reflections in the still waters of Bald Rock Creek. Ground orchids, banksias, conesticks, geebungs and crinkle bushes are prominent in spring, as are the many colourful bird species living among them. Medium 40 km return 3 days Eastern Peaks Circuit Girraween A multi day hike (3 days comfortably but could be done in 2) that visits all major east peaks in Girraween. Wonderful scenery, wildflowers and wildlife. Medium 46 km 2 days Girraween to Bald Rock Circuit The route we took was a mix of bush tracks; fire trails and off track. There were quite a number of opportunities to replenish your water supply either at the Nat Park's camp grounds and creeks. Easy 1.7 km return 30 mins Granite Arch If time is limited, or if you prefer an easy stroll, this circuit track is ideal. Cross bald Rock Creek and wind through blackbutt and stringybark forest to Girraween's very own natural stone archway. Hard 10.4 km return 4 hrs Mt Norman The highest point in Girraween - Mt Norman provides some great views of the park and also visits the Eye of the Needle. Medium 17 km return 4 hrs Peak and Creek Trails Today we drove the Mt Norman day use area on mt Norman road and set off on the Peak trail. A non strenuous walk with a lovely view of Mt Norman. Until we got to the end of Peak trail where there is a junction to join creek trail. We chose to take the left fork after a few hundred meters we came to a pretty rock clearing with lovely water path ways across it. It has been raining a fair bit and was drizzling at the time. Finding the exit from this rocky outcrop was really hard there were no visible markers and after much hunting we found a trodden path and followed it. After about 1 km we found ourselves at underground creek which we had been to the day before so thankfully knew where we were, as underground creek has no signage at it. These two paths are not even meant to meet up, clearly the well trodden path we had taken is one many others have found themselves confused by and ended up at. We carried on to the dr Roberts day use area and trekked back along Pyramids road and back onto mt Norman road to the northern day use area and set ourselves back on course of the creek track. To be honest after the lovely view of mt Norman there’s isn’t really much else going for the hike. It’s quite a monotonous hike, but if you want to mountain bike it it would be an awesome challenge. The great thing for us was we didn’t see anyone else at all. Very Hard 4.8 km return 2.5 hrs Second Pyramid THIS IS AN OFF TRACK WALK. Long way round + 1.4km. Short way round and up +0.9km. Very good scrambling skills or medium rock climbing skills required. As always do not attempt to climb just before, during or just after rain as the rock face can be extremely slippery. « Walks 1-10 of 16 » (adsbygoogle = window.adsbygoogle || []).push({});"
