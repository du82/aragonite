["https://aussiebushwalking.com/users/32543"]
title = "Profile for ian parker - Aussie Bushwalking"
description = "Aussie Bushwalking profile for ian parker"
full_description = "This Year 3 Number of Walks Ticked 46.7km Total Distance Ticked All Time 86 Number of Walks Ticked 823.1km Total Distance Ticked Ticks Name Date Difficulty Distance/Duration Ships Stern Circuit (Lamington National Park) 1 Mar, 2025 Medium 21km 7 hrs Third time around this track. This time I did it anticlockwise. It's not a hard hike but it is a long one. Took me 7.5 hours including stops. Lots of palm waste littering the track more or less the whole way round. Warrie Circuit (Springbrook National Park) 22 Feb, 2025 Hard 17km return 5 hrs 2nd time around this track. Very wet muddy and slippery almost the whole way round. Loads of leeches so a good idea to spray boots and socks etc with aeroguard or similar. Good idea to start as early as possible as the car park fills up quick. Waterfalls were pumping and quite a few water crossings to keep it interesting. Had a tree come down across springbrook road which closed the road blocking our drive home. Firies were out with their chainsaws and one helpful guy let us know another way down going down Repeater Station Rd and then Lyrebird Ridge Rd. Always good getting down for a steak and a beer at the Canungra pub. Pages Pinnacle Eastern Approach via Neranwood Break (Springbrook National Park) 8 Feb, 2025 Hard 8.7km return 4 hrs Fourth time across the pinnacles never disappoints. Perfect weather and so glad to have started out at 5am as it was hot in the sun. Larapinta Falls (Lamington National Park) 16 Nov, 2024 Hard 15km return 5 hrs Gruelling hike in very slippery conditions. Awesome waterfall after the recent rains. So many leeches. Well marked track on both sides of the creek past Westgrays grave. Definitely need good footwear as it would be so easy to turn a ankle. Daves Creek Circuit (Lamington National Park) 26 Oct, 2024 Hard 12km return 4 hrs 4th time on this quite easy but beautiful hike. Always like climbing up and along surprse rock. Pages Pinnacle (South East Queensland) 12 Oct, 2024 Hard 6.7km return 2.5 hrs 3rd time up and back. Glad we started early around 5.45 am. Beat the heat and had the ridges to ourselves. Steep track to the pad to the 1st Ridge. Steep drop off's on 2 sides but keep low and your good. Love this hike. Mt Blaine Summit Trail (Ipswich - Flinders Goolman Conservation Estate) 28 Sep, 2024 Hard 5km return 3 hrs Only a short hike as far as distance goes but definitely a hard one as it's very steep and the track is quite unstable as in loose rocks etc. We did it after a small ammount of rain which made most of the track soft muddy and slippery. Wouldn't like to go after heavy rain. Easy to lose the track coming down and had a bit of a battle with overgrown shrubbery across the track. And most of the tree trunks we used for hand holds were prickly. Enjoyed the challenges of this hike. Would be tough on a hot day. Crows Nest Falls Circuit (Crows Nest National Park) 10 Aug, 2024 Medium 4.5km return 2 hrs Nice easy hike. Crows nest creek was very dry. Good leg stretcher with plenty of steps. Mount Barney South East Ridge (Mt Barney National Park) 22 Jun, 2024 Very Hard 15km return 11 hrs Big day. Very hard very steep both up and down. We took 10 hours up and back with some short breaks. Fantastic hike not for the faint hearted as there is some quite nervey spots. Greenes Falls via Rainforest Circuit + Cypress Grove Circuit (D'Aguilar National Park) 18 May, 2024 Medium 4.3km return 2 hrs Nice easy walk. Nice picnic area for after the hike. Good toilet facilities. Mt Greville (Moogerah Peaks National Park) 30 Mar, 2024 Hard 6km return 3 hrs Hiked Mt Greville for the 4th time. Started about 6.20 am and got back to carpark about 6 hours later. Up waterfall gorge out to Slab Rock for a break and photos. Up to the summit then down via the south east ridge. Much easier than going down palm gorge. Paid to start early and we saw nobody until we arrived back to a overflowing carpark. Love Creek Falls (D'Aguilar National Park) 16 Mar, 2024 Medium 4.7km return 3 hrs Hiked this today. Found it hard going lots of rock hopping and scrambling along bush tracks. We found it slow picking the easiest and safest way to place our feet. Very slippery in places especially the last 200 metres or so to get right up to the falls. Definitely need good footwear for this one. Lots of amazing waterfalls and waterholes to cool off in. My Garmin recorded it at 12.05 klm and we spent 6.5 hours on the track. Not sure where the 4.9 klm comes from that some guides are saying. Really nice walking creekside all day. Coomera Circuit (Lamington National Park) 24 Feb, 2024 Medium 17.4km 6 hrs Did this hike today in overcast and wet conditions with fine rain the last 7 klms. My gps watch said 25klms. Easy hike but long. Didn't have any problems with leeches only had one. Gave the socks and boots a good spray first with aeroguard and bushman's. Loads of waterfalls pumping and we counted around 20 Creek crossings of coomera Creek and its tributaries. Started in the dark at 5am and finished at midday. West Canungra Creek Circuit (Lamington National Park) 27 Jan, 2024 Hard 18km 6 hrs Hiked this today starting at 5am from car park and finishing in 6 hours. Plenty of water in the creek made for wet feet on the 8 or so creek crossings. Hiking poles definitely made for safer crossings. Nice scenery and plenty of blue lamington spiny crayfish about on the tracks. Some Gympie Gympie plants trackside made for a bit of discomfort. I didn't think the hike was as hard as suggested. Larapinta Falls (Lamington National Park) 21 Oct, 2023 Hard 15km return 5 hrs Did this hike today. Glad we went early as car park was full on returning. Bit of a scramble come rock hopping hike. Need to watch your feet on the tree roots and rocks and your head on the many trees and branches accross the track. Bit hard to get lost if you follow the creek. Did cross back and forth a few times. Surprised at the end on how spectacular larapinta falls are. We did it in 6.5 hours and my sat nav watch said 18klm. Larapinta Falls (Lamington National Park) 21 Oct, 2023 Hard 15km return 5 hrs Did this hike today. Glad we went early as car park was full on returning. Bit of a scramble come rock hopping hike. Need to watch your feet on the tree roots and rocks and your head on the many trees and branches accross the track. Bit hard to get lost if you follow the creek. Did cross back and forth a few times. Surprised at the end on how spectacular larapinta falls are. We did it in 6.5 hours and my sat nav watch said 18klm. Mt Greville: Waterfall Gorge/Palm Gorge circuit (Moogerah Peaks National Park) 23 Sep, 2023 Hard 6.5km return 4 hrs Third time up. Big day. Left car park at 6.45 am and got back to car at 1.15 am. Flinders Peak (Ipswich - Flinders Goolman Conservation Estate) 15 Sep, 2023 Hard 6.5km return 3.5 hrs Second time I've done this but today I did a solo hike. From start to finish including many short breaks and a good 45 minutes at the top it took me 5 hours. Cool at the bottom at 6.30 am but very warm near the top and all the way down. Very steep most of the way and very dry. You need plenty of water. Mount Coolum (Sunshine Coast) 16 Jun, 2023 Medium 2.6km return 90 mins Did the sunrise walk today. Nice heart starter but once the legs kicked in it was okay. Loads of people. Good track with a nice view at the top. Lower Bellbird Circuit (Lamington National Park) 3 Jun, 2023 Medium 12km return 3 hrs Early start at track entrance below information centre. We walked till it joined the ships stern circuit and decided to do that instead of heading back to Binna Burra. Up until that it was a easy pleasant walk under all the towering cliffs. « Ticks 1-20 of 86 »"
