["http://www.aussiebushwalking.com/overseas"]
title = "Overseas - Aussie Bushwalking"
description = """
Overseas - We all know Australia is the place for bushwalking... New Zealand has some good tracks too... but surprisingly the rest of the world has some places worth visiting too! (imaging that!)

This is the place to share walks from outside of Australia/New Zealand."""
full_description = "Menu Browse all walks Browse latest walks Add a region Edit this region Add a walk Popular Walks Hooker Valley Track (20 ticks) Tongariro Alpine Crossing (17 ticks) Milford Track (14 ticks) Everest Base Camp (14 ticks) Kepler Track (13 ticks) Sub-Regions Albania Antarctica Argentina Canada China Cook Islands Croatia Czech Republic Egypt Fiji France Germany Greece Guatemala Hawaii Ireland Italy Japan Jordan Malaysia Nepal New Zealand Norfolk Island Papua New Guinea Peru Poland Seychelles Singapore South Africa South Georgia Island South Korea Spain Spitsbergen (Svalbard) Taiwan Turkey United Kingdom United States of America Vietnam Summary We all know Australia is the place for bushwalking... New Zealand has some good tracks too... but surprisingly the rest of the world has some places worth visiting too! (imaging that!)This is the place to share walks from outside of Australia/New Zealand. (adsbygoogle = window.adsbygoogle || []).push({}); Popular Walks Hooker Valley Track (20 ticks) Tongariro Alpine Crossing (17 ticks) Milford Track (14 ticks) Everest Base Camp (14 ticks) Kepler Track (13 ticks) Sub-Regions Albania Antarctica Argentina Canada China Cook Islands Croatia Czech Republic Egypt Fiji France Germany Greece Guatemala Hawaii Ireland Italy Japan Jordan Malaysia Nepal New Zealand Norfolk Island Papua New Guinea Peru Poland Seychelles Singapore South Africa South Georgia Island South Korea Spain Spitsbergen (Svalbard) Taiwan Turkey United Kingdom United States of America Vietnam Walks in Overseas Medium 6.8 km return 3 hrs Piton de la Petite Rivière Noire A relatively short walk and scramble up to the highest mountain in Mauritius where you will find a bench of reflection and 360 degree views. Hard 14.3 km return 10 hrs Piton des Neiges A long steep hike up to the roof of the Indian Ocean - the summit of Piton des Neiges on Reunion Island near Madagascar. At just over 10,000ft this volcano towers over the tiny island. Walks in Albania Medium 480 km one-way 28 days Via Egnatia This a walk that follows, where possible, the ancient roman road, the Via Egnatia, from Durres in Albania to Thessaloniki in Greece. I only walked sections, in Albania and Northern Macedonia. The highlights of the walk are spending several days walking on the remains of the Roman road, which are well preserved in one mountainous section of the walk, walking along the shores of Lake Ohrid and walking over the mountains from Ohrid to Resen. Walks in Antarctica Easy 11 km one-way 3 hrs Cape Armitage Loop From McMurdo Station walk along road to Scott Base and then out onto the sea-ice and return to McMurdo Station. Once again, just sharing this walk that I did whilst working in Antarctica. I know that it is not accessible to everyone. Easy 8 km return 2.5 hrs Castle Rock Loop I worked for the Australian Antarctic Division in 2009/10 and undertook this walk whilst transiting through the US base, McMurdo Station, on route to Casey Station. We were not given permission to do the full loop and walked half way and returned. I just wanted to share although I know that it is not accessible to everyone. Walks in Ushuaia Region (Argentina) Very Hard 12 km return 6 hrs Cerro Bridges . Hard 18.5 km return 7 hrs Cerro Cinco Hermanos and Cerro Cloche Iconic mountain. Hiked to the furthest south 'Hermano', looks like you will need climbing gear to get up some of the others Medium 6 km return 3 hrs Cerro Cortez Short but steep hike with amazing views over Ushuaia and the backside towards the north. Easy 4 km one-way 90 mins Cerro de Los Loros Walk behind Ushuaia that goes through the local forest, following the winter cross-country ski tracks Medium 12 km return 4 hrs Cerro del Medio A beautiful walk that is popular with the locals. Lots of different vegetation. Short and possible to walk from the port or town « Walks 1-10 of 279 » (adsbygoogle = window.adsbygoogle || []).push({});"
