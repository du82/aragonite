["https://aussiebushwalking.com/users/33233"]
title = "Profile for Wanderlust - Aussie Bushwalking"
description = "Aussie Bushwalking profile for Wanderlust"
full_description = '''This Year 13 Number of Walks Ticked 92.5km Total Distance Ticked All Time 365 Number of Walks Ticked 1,893.8km Total Distance Ticked Ticks Name Date Difficulty Distance/Duration Enoggera Creek walk (Brisbane City Council Local Walks) 23 Feb, 2025 Easy 13km one-way 4 hrs The first section along the creek after the reservoir feels like miles away from urban development. Bally Mountain (Gold Coast) 20 Feb, 2025 Hard 9.5km return 4 hrs “Well done” GC council! Parking, well signed and a stunning view from the top. (quite different to my last visit some 10 years ago) Enoggera Reservoir Tunnel (Brisbane Forest park D'Aguilar National Park) 16 Feb, 2025 Medium 4km return 90 mins Options 1 and 2 are difficult to find without GPS. Ended up with option 2 , not recommended. Walked out option 3. Kokoda Track (Mt. Coot-tha) 16 Feb, 2025 Medium 2km return 1 hr Excellent work out. Not recommended downhill. Curlew and Ironbark Circuit (Mt. Coot-tha) 16 Feb, 2025 Medium 3km return 1 hr Good exercise. Flat parts in between to recover. Holmans break (Brisbane Forest park D'Aguilar National Park) 9 Feb, 2025 Hard 14km return 4 hrs A few serious inclines. Enoggera Creek crossing in the valley was picturesque. Little Bald Rock (Bald Rock National Park) 27 Jan, 2025 Medium 7.8km return 2 hrs Up in the clouds due to change of weather. Fantastic! Carrolls Creek Loop (Bald Rock National Park) 27 Jan, 2025 Medium 19.7km return 4.5 hrs Little Bald Rock is the highlight you want to enjoy with a bit of time. Tooloom Lookout (New South Wales) 27 Jan, 2025 Easy 400m return 15 mins Wide view towards the west. Tooloom Walking Track (New South Wales) 27 Jan, 2025 Easy 1km return 30 mins Flat walk with a few newly installed info boards, Border Walk Loop (Bald Rock National Park) 26 Jan, 2025 Medium 14.2km return 3.5 hrs Make sure not to miss the Bookookoorara Lookout detour. Bald Rock Summit (Bald Rock National Park) 26 Jan, 2025 Medium 2.9km return 90 mins Well marked up the rock. The summit deserves time to enjoy. Undercliffe Falls (New South Wales) 17 Jan, 2025 Medium 1km return 15 mins The water runs over a huge rock face. More interesting could be the long gorge that follows downstream. Liston has a well-maintained rest area. Mt Wagawn (Lamington National Park) 31 Dec, 2024 Medium 18km return 7 hrs Remarkable how dry the Border track approach was and how wet the forest after the Wagawn/ Hobwee branch off became. Gwongoorool Rock Pools (Lamington National Park) 27 Dec, 2024 Medium 6km 2.5 hrs Not even one leech! What's wrong this year? Apple Tree Park to Little Nerang Creek Falls (Springbrook National Park) 22 Dec, 2024 Medium 6km return 3 hrs Good amount of water, no leeches. Surprise! Warringa Pool Track (Springbrook National Park) 22 Dec, 2024 Easy 2km return 45 mins Middle part of the track with the creek flowing underneath a huge root system is a real highlight. Great Walk! Gold Coast Hinterland (Lamington National Park) 22 Dec, 2024 Medium 54km one-way 3 days Completed the walk in sections over time. Accessibility from many parts of the trail. The Needles Walk (Gibraltar Range National Park) 17 Dec, 2024 Medium 6km 2.5 hrs A rainy day made for a "no view" walk. Dandahra Crags Walk (Gibraltar Range National Park) 16 Dec, 2024 Medium 6km return 2.5 hrs Scenic walk along a healthy wetland and an easy rock scramble. « Ticks 1-20 of 364 »'''
