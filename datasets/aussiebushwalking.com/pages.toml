["https://aussiebushwalking.com/qld/mackay-isaac-and-whitsunday/mt-rooper-swamp-bay"]
title = "Mt Rooper/ Swamp Bay - Aussie Bushwalking"
description = "Mt Rooper/ Swamp Bay - An excellent walk on well made linked tracks to the top of Mt Rooper and Swamp Bay in the Conway National Park."
full_description = "Menu Edit this walk Navigate to... An excellent walk on well made linked tracks to the top of Mt Rooper and Swamp Bay in the Conway National Park. No Dogs Permitted Coastal Swamp or Wetland Add to My Wishlist Remove fromMy Wishlist Tick Walk (adsbygoogle = window.adsbygoogle || []).push({}); Getting there From Airlie Beach drive along the Shute Harbour Rd toward Shute Harbour for approximately 8 km. Turn into the car park at the Conway National Park Swamp Bay and Mt Rooper sign. Maps Which maps cover the area? Route/Trail notes From the car park, a short 300 m walk takes you to the turn off to the track up to Mt Rooper. The 2.1 km walk is a steady climb to the top. The steaper sections have switch backs to lesson the grade. From the lookout the track continues and desends down Mt Rooper and links up to the Swamp Bay track. Distance to Swamp bay from the top is 3 km or 1.9 km from the car park. Permits/Costs Camping permit required for Swamp bay. Other References How can I find more info? Any guide books? GPS Tracks No GPS available for this walk yet. Comments Walked half of the walk to Coral Beach return. Nath M on 27 Aug, 2022 Did this walk for the sunset as it doesn't take too long to get to the top - around 30 minutes. The view is great, certainly not as great the honeyeater lookout, but still a nice rewards for making it to the top. The track is very well maintained and ascends quite gradually. Vonsnrub on 16 Apr, 2021 I lovely walk a little bit washed out after weeks of rain great view from Mount Rooper Look out , easy downhill walk to Swamp Bay track . Nice freshwater Creek on the way to the beach Rae on 31 Jan, 2021 Nice little walk up to Mt Rooper, Once you get through the single file slightly overgrown track you make it high enough to catch the sea breeze from the harbour. View over to South Mole and Daydream Island from the top.Swamp Bay was like another world at low tide, felt very isolated and unearthly, very interesting. I recommend heading north over the small rocky headland to the other beach. Watch out for Prickly Pear climbing down the rocks but its amazing on the other side. Plus seen a dinosaur sized Green Sea Turtle feeding - he hung around for hours as the sun went down.Nice walk. Simon Hutchen on 29 Jun, 2019 Great walk with amazing views over the Whitsunday passage & Whitsunday islands. Goannas, brush turkeys, wrens, kites, honeyeaters, ulysses butterflies and even echidnas. Absolute Airlie provide guided tours of trails in the area. www.absoluteairlie.com.au Absolute Airlie on 21 Oct, 2018 Beautiful view at the look-out located at the top of Mt Rooper. Moderately difficult for a beginner, but an experienced bushwalker could handle the inclines with ease. Beautiful plant and wildlife, and can see over the Whitsunday islands at the top. complikate on 5 Oct, 2015 With limited time we didn't take the Mt Roper loop, only the 2.1km trail direct to Swamp Bay. The well made path starts in grassland with grass trees, and crosses open forest and closed in dry rainforest. Small wooden bridges cross little creeks which would be delightful with water in them. Lots of birdlife and the odd wallaby. The bay at the end has a rocky beach and shelter shed for campers. stryker on 28 Sep, 2015 « Comments 0-7 of 7 » Tick this walk and add your own comments (adsbygoogle = window.adsbygoogle || []).push({}); This will report the image to moderators for review. Are you sure this image is offensive? Aussie Bushwalking users can maintain a wishlist of walks for you but you need to be a member. Click here to login if you're already a member, otherwise go here to register for your free account. Navigation to some bushwalks can be difficult. Automated navigation using Google Maps or Apple Maps may not be accurate. Additionally, Aussie Bushwalking doesn't always have accurate positions for where to park for a walk. Please read the walk description for special directions and take extra care. Medium 7km 2.3hrs These