["https://aussiebushwalking.com/users/392"]
title = "Profile for Richard Mason - Aussie Bushwalking"
description = "Aussie Bushwalking profile for Richard Mason"
full_description = "This Year 0 Number of Walks Ticked 0.0m Total Distance Ticked All Time 82 Number of Walks Ticked 380.0km Total Distance Ticked Ticks Name Date Difficulty Distance/Duration Yellowpinch Summit (Mt Barney National Park) 12 Aug, 2023 Medium 3km 1 hr Quick trip up here with my 11yo son. Great views as always. Kid is starting to handle the climbs easier than me! Bare Rock track and Morgan's Walk (Main Range National Park) 4 Aug, 2023 Medium 13km 4.5 hrs Surprised Bare Rock now provides 360 degree views - last time the scrub prevented views to the West. Great walk as always. Gheerulla Valley Circuit (Mapleton National Park) 10 Dec, 2022 Hard 22km 6 hrs Did it as part of a Scout hike, staying at Thilba Thalba and Ubajee. Beautiful as always. Stopped for a dip in the creek as well over lunch. Gheerulla Valley Circuit (Mapleton National Park) 17 Apr, 2022 Hard 22km 6 hrs Beautiful walk. We did it as an overnighter, sleeping at Thilba Thalba. Had previously done it clockwise, but prefer anti-clockwise going from the carpark past the falls and down the valley before the short and sharp climb up to Mt Thilba Thalba and then across to the campsite. Cedar Creek Falls (Tamborine National Park) 25 Jan, 2022 Easy 1km return 30 mins Plenty of water in the creek. Went early to get a park. Daves Creek Circuit (Lamington National Park) 19 Sep, 2021 Hard 12km return 4 hrs Goomoolahra Falls and Rainbow Falls (Springbrook National Park) 23 Jan, 2021 Medium 4.4km return 90 mins Great addition to Twin Falls. Did this easily with kids (10 & 8yo) Twin Falls Circuit (Springbrook National Park) 19 Sep, 2020 Medium 4.6km return 90 mins Trip with Underwood Scouts. Great walk. Not too busy. Decent water and as a bonus got to see a couple get engaged! Best Of All Lookout (Springbrook National Park) 19 Sep, 2020 Very Easy 700m return 30 mins Trip with Underwood Scouts. A clear day gave a fantastic view. Always amazing. Natural Bridge (Springbrook National Park) 19 Sep, 2020 Very Easy 1km return 30 mins A lovely finish to the day with Underwood Scouts. Not too busy - had the cave to ourselves for a decent time. Flinders Peak (Ipswich - Flinders Goolman Conservation Estate) 11 Jul, 2020 Hard 6.5km return 3.5 hrs Took my 8 and 10 year old kids up. It was tough for them but they enjoyed it. Wickham Peak - Calytrix Circuit (Wickham Timber Reserve) (South East Queensland) 23 May, 2020 Medium 7km return 2 hrs Took the kids up starting from Quinzeh Creek Rd and continued on to Grass Tree Lookout after Wickham Peak. Lovely walk however Wickham Peak has a lot of broken glass and cans. Mt Warning Summit Trail (Wollumbin National Park) 10 Nov, 2019 Hard 8.3km return 5 hrs Climbed the mountain with my 9yo daughter. Unfortunately the view was obscured by smoke but that didn't stop quite a few people from making the climb. Leven Canyon Lookout (Tasmania) 29 Oct, 2019 Medium 1.8km return 45 mins We stopped here on our way out from Cradle Mountain. Fantastic walk which easily fit in with our drive. Hansons Peak (Cradle Mountain-Lake St Clair National Park) 28 Oct, 2019 Hard 5km return 2 hrs Fantastic walk with some different angles on the Dove Lake area. Chain section was not difficult for anybody with scrambling experience. Wind was quite strong and chilly. Enchanted Walk (Cradle Mountain-Lake St Clair National Park) 28 Oct, 2019 Very Easy 1.1km one-way 30 mins Yet another lovely walk at Cradle Mountain. Since this is a short walk we added it at the end of a day when we didn't have time to fit in a bigger walk. Marions Lookout (Cradle Mountain-Lake St Clair National Park) 27 Oct, 2019 Hard 7.5km return 3 hrs Amazing walk! Unfortunately the lookout was covered in cloud but we still got amazing views on the way up and got to enjoy the snow on the ground and falling! Dove Canyon (Cradle Mountain-Lake St Clair National Park) 26 Oct, 2019 Medium 6.3km return 2.5 hrs A lovely walk. Great variety of vegetation and a good opportunity to check the discovery centre at the same time. Dove Lake Circuit (Cradle Mountain-Lake St Clair National Park) 25 Oct, 2019 Easy 5.7km return 2 hrs Lovely walk which we used as an intro to the park. Felt like we stopped every 5m to get yet another photo from a slightly different angle. Goolman Lookout via Rocky Knoll (Ipswich - Flinders Goolman Conservation Estate) 14 Aug, 2019 Medium 7.4km 2 hrs Took the family who did it with no trouble (two 7yo and a 9yo). Nice views from the top but not the most exciting walk we've done. « Ticks 1-20 of 73 »"
