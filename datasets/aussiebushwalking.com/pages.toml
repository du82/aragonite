full_description = "Menu Edit this walk Navigate to... GPS Tracks Northern Rivers Rail Trail (GPX) A 50km return walk or cycle along the old rail line between Murwillumbah and Crabbes Creek. Dogs Permitted Cycling Permitted Rainforest Eucalypt Forest 175m Maximum Elevation 172m Total Climb Add to My Wishlist Remove fromMy Wishlist Tick Walk (adsbygoogle = window.adsbygoogle || []).push({}); Getting there: The walk starts from Bray Street in Murwillumbah in the north or Wooyung Road at Crabbes Creek. It can also be accessed at numerious points along the way. Maps: Northern Rivers Rail Trail Route/Trail notes: See website. Permits/Costs: None. Other References/Comments: None provided. GPS Tracks Northern Rivers Rail Trail (GPX) Comments We walked this rail trail in sections and plan to return for a day ride into the future. It’s a lovely rail trail and has shade which isn’t often the case on these types of trails. Bobbe on Jan, 2024 A pleasant ride. samkramer on 11 Jun, 2023 « Comments 0-2 of 2 » Tick this walk and add your own comments (adsbygoogle = window.adsbygoogle || []).push({}); This will report the image to moderators for review. Are you sure this image is offensive? Aussie Bushwalking users can maintain a wishlist of walks for you but you need to be a member. Click here to login if you're already a member, otherwise go here to register for your free account. Navigation to some bushwalks can be difficult. Automated navigation using Google Maps or Apple Maps may not be accurate. Additionally, Aussie Bushwalking doesn't always have accurate positions for where to park for a walk. Please read the walk description for special directions and take extra care. Medium 50km return 2.5hrs These values are provided by users. Your evaluation may differ. Where Click here to load this map. Nearby Walks Burringbar Range Tunnel (New South Wales) Burringbar Mountain (New South Wales) Hanging Rock Bushwalk (Gold Coast) Cougal Cascades (Springbrook National Park) Cougal Cascades to Boyd’s Butte and Mt Cougal East Peak (Springbrook National Park) Done this walk? This walk has been ticked 5 times Aussie Bushwalking can keep track of your bushwalks. Login/signup to tick this walk off."
