["https://aussiebushwalking.com/articles/qld/ddsw/girraween-np"]
title = "Girraween National Park Articles - Aussie Bushwalking"
description = "Girraween National Park - Girraween is a national park which sits on the Queensland-New South Wales border near Stanthorpe. The park lies in the Granite Belt and is very popular for its granite landscape and wildflowers"
full_description = "Menu Browse all articles Add a region Edit this region Add a walk Summary Girraween is a national park which sits on the Queensland-New South Wales border near Stanthorpe. The park lies in the Granite Belt and is very popular for its granite landscape and wildflowers (adsbygoogle = window.adsbygoogle || []).push({}); Articles Girraween National Park Darling Downs South West, Queensland Racecourse Creek A lyrical reflection on a magical campsite in Girraween National Park. Turtle Rock Find out what it takes to be a real Girraween photographer... Articles 1-2 of 2 History Dr Spencer Roberts, a doctor from Stanthorpe, is largely responsible for the creation of Girraween and it's NSW neighbour Bald Rock National Park. The park started as Bald Rock Creek National Park, created in 1930 and Castle Rock National Park, created in 1932. When Napier Gunn offered his property to the government in 1966 the two parks were merged and became Girraween National Park Features Wildflowers and granite scenery! That nearly sums up the main reasons people walk in Girraween. The park includes a well maintained collection of walking tracks visiting the main features. Visit in Spring to witness spectacular wildflower displays. The park also receives snow occasionally during Winter. Access The primary access point to the park is from the New England Highway just South of Ballandean. Just follow the signposts onto Pyramids Rd, approximately 7km South of Ballandean or 11km North of Wallangarra. Pyramids Rd gives access to both Bald Rock Creek and Castle Rock camping grounds and the majority of the park's bushwalking trails. Maps A free national park map can be downloaded from http://www.derm.qld.gov.au/media/parks_and_forests/parks/girraween_national_park.pdf Hema maps publish a great map which covers Girraween, Bald Rock and Boonoo Boonoo National Parks. Accommodation Camping One National Park camping ground is available - Castle Rock. Other Numerous other accommodation options are available in the surrounding area. Just search for accommodation in the Stanthorpe area. More Info Official website - https://parks.des.qld.gov.au/parks/girraween Vanessa and Chris Ryan have a great website on Girraween with comprehensive info - http://www.rymich.com/girraween/"
