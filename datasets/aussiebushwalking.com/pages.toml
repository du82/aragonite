["https://aussiebushwalking.com/nsw/wollumbin-national-park/brummies-lookout"]
title = "Brummies Lookout - Aussie Bushwalking"
description = "Brummies Lookout - A nice return walk along a rising forestry trail through tall forest and rainforest, then on to a foot trail ending at a small peak with great views towards nearby Mt Warning and the Border Ranges."
full_description = "Menu Edit this walk Navigate to... A nice return walk along a rising forestry trail through tall forest and rainforest, then on to a foot trail ending at a small peak with great views towards nearby Mt Warning and the Border Ranges. Lookouts Rainforest Eucalypt Forest 819m Maximum Elevation 416m Total Climb Add to My Wishlist Remove fromMy Wishlist Tick Walk (adsbygoogle = window.adsbygoogle || []).push({}); Getting there Access from Swifts Rd near Tyalgum, NSW. Park near end of dirt track before the gates on the boundary of Wollumbin National Park. To note, when driving to the park it looks like you are driving into a private property but the vehicle track does run along the edge of the private property, ignore the road closed sign. We had a 2WD and parked about a 100 metres before the park gate as it looked like better clearance was required than what we had. Maps Unknown Route/Trail notes Walk about 1hr from the national park gates along Brummies Rd, a rising well maintained logging trail through tall forest and rainforest. A few other logging roads turn off Brummies Rd along the way. The turnoff to Brummies Lookout is a steep foot track on the left going up hill through forest and takes another 20 minutes to reach the summit. I believe this foot track isn't too far from the end of Brummies Rd. Permits/Costs Nil Other References I recorded the walk on Wikiloc as 'Brummies Lookout': https://www.wikiloc.com/hiking-trails/brummies-lookout-30774599 Byron trails website: https://byrontrails.com/brummies-lookout/ GPS Tracks No GPS available for this walk yet. Comments A great walk with a spectacular view at the end.Not easy to follow though, but with GPS we worked it out.When you turn into Swifts road to get there, be careful to keep right and continue on Tyalgum ridge road to reach starting point of trail.You effectively feel like you're walking into private property at first so best to park in front of gates. Phaedra on 31 Jul, 2020 Ignore the road closed sigh. I've added a picture.Excellent walk, with great views. samkramer on 13 Oct, 2019 Lovely walk, semi-obstructed views from the top, but great views of the mountains Emmalea on 18 Aug, 2019 « Comments 0-3 of 3 » Tick this walk and add your own comments (adsbygoogle = window.adsbygoogle || []).push({}); This will report the image to moderators for review. Are you sure this image is offensive? Aussie Bushwalking users can maintain a wishlist of walks for you but you need to be a member. Click here to login if you're already a member, otherwise go here to register for your free account. Navigation to some bushwalks can be difficult. Automated navigation using Google Maps or Apple Maps may not be accurate. Additionally, Aussie Bushwalking doesn't always have accurate positions for where to park for a walk. Please read the walk description for special directions and take extra care. Medium 8.5km return 3hrs These values are provided by users. Your evaluation may differ. Where Click here to load this map. Nearby Walks Mt Warning Summit Trail (Wollumbin National Park) Pinnacle Walk and Lookout (Border Ranges National Park) Clarrie Hall Dam (New South Wales) Falcorostrum Loop Walking Track (Border Ranges National Park) Bar Mountain Circuit (Border Ranges National Park) Done this walk? This walk has been ticked 8 times Aussie Bushwalking can keep track of your bushwalks. Login/signup to tick this walk off."
