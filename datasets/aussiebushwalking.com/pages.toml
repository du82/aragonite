["https://aussiebushwalking.com/qld/se-qld/sunshine-coast/forest-lakeside-ewen-maddock-dam-"]
title = "Forest Lakeside Ewen Maddock Dam  - Aussie Bushwalking"
description = "Forest Lakeside Ewen Maddock Dam  - Peaceful, flat and easy walk on smooth track through forest used by the occasional mountain biker and galloping dog. After about 5 minutes you reach the lake. Beautiful view"
full_description = '''Menu Edit this walk Navigate to... Peaceful, flat and easy walk on smooth track through forest used by the occasional mountain biker and galloping dog. After about 5 minutes you reach the lake. Beautiful view Lookouts Swimming Bird Watching Picnic Facilities Toilets No Dogs Permitted Horses Permitted Cycling Permitted Swamp or Wetland Add to My Wishlist Remove fromMy Wishlist Tick Walk (adsbygoogle = window.adsbygoogle || []).push({}); Getting there How do you get to the start of the walk? Off Bruce Hwy take Steve Irwin Way, sign for Dam on right. Begin the walk on the western side of the car park there is a bike track on the eastern side but walkers are advised that they take this track at their own risk. Maps Which maps cover the area? Route/Trail notes A detailed description of the walk! Permits/Costs No fees or permits required. Other References How can I find more info? Any guide books? Managed by seqwater. Maps and facilities here: http://www.seqwater.com.au/water-supply/dam-operations/ewen-maddock-dam GPS Tracks No GPS available for this walk yet. Comments Lots of wildlife on this track, absolutely beautiful scenery Jasmin on 12 Nov, 2023 Serenity. COOKIE on 1 Jan, 2022 Easy and short- not much to see Gemma Stevens on 8 Aug, 2021 Great walk, note signage looks to have changed and it now says no dogs! :-( Leese85 on 29 Apr, 2021 Nice short walk. Well signposted with good parking and facilities. Sometimes there is a coffee van there as well.. Graeme "Watto" on 26 May, 2020 Nice litte walks lots of snakes out. Keegan on 12 Jan, 2019 Dam bit full after all that rain which also makes the walk so fresh ! J on 20 May, 2017 Nice easy walk to the side of Ewen Maddock Dam. There are lots of picnic tables and seats along the path. We found a different track to walk back on so made it a loop. Note there are no toilets here. Ian and Sue on 12 May, 2017 « Comments 0-8 of 8 » Tick this walk and add your own comments (adsbygoogle = window.adsbygoogle || []).push({}); This will report the image to moderators for review. Are you sure this image is offensive? Aussie Bushwalking users can maintain a wishlist of walks for you but you need to be a member. Click here to login if you're already a member, otherwise go here to register for your free account. Navigation to some bushwalks can be difficult. Automated navigation using Google Maps or Apple Maps may not be accurate. Additionally, Aussie Bushwalking doesn't always have accurate positions for where to park for a walk. Please read the walk description for special directions and take extra care. Easy 1km return 15mins These values are provided by users. Your evaluation may differ. Where Click here to load this map. Nearby Walks Ewen Maddock Dam - Trail 1 (Sunshine Coast) Merdian Hill, Mooloolah River National Park (Sunshine Coast) Dularcha NP - Roses Circuit (Sunshine Coast) Dularcha NP - Tunnel Track (Sunshine Coast) Melaleuca Trail, Jowarra Section (Sunshine Coast) Done this walk? This walk has been ticked 33 times Aussie Bushwalking can keep track of your bushwalks. Login/signup to tick this walk off.'''
