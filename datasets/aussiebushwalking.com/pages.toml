full_description = "This Year 0 Number of Walks Ticked 0.0m Total Distance Ticked All Time 19 Number of Walks Ticked 90.7km Total Distance Ticked Ticks Name Date Difficulty Distance/Duration Flinders Peak (Ipswich - Flinders Goolman Conservation Estate) 22 Aug, 2024 Hard 6.5km return 3.5 hrs Mount Beerburrum (Glass House Mountains National Park) 22 Aug, 2024 Medium 3.5km return 90 mins The Pyramid (Girraween National Park) 22 Aug, 2024 Hard 3.8km return 2 hrs The Sphinx and Turtle Rock (Girraween National Park) 22 Aug, 2024 Medium 7km return 2.5 hrs Walsh's Pyramid (Wooroonooran National Park) 22 Aug, 2024 Very Hard 6.2km return 7 hrs Witches Chase (Tamborine National Park) 22 Aug, 2024 Medium 2.6km return 2 hrs Mt Cooroora (Sunshine Coast) 1 Oct, 2022 Hard 2.6km return 2.5 hrs Mt Mitchell (Main Range National Park) 26 Sep, 2022 Medium 10.98km 3.5 hrs Mt Ninderry (Sunshine Coast) 26 Sep, 2021 Medium 3.3km return 90 mins Mt Cordeaux (Main Range National Park) 18 Sep, 2021 Medium 6.8km return 2.5 hrs Mount Tibrogargan Summit (Glass House Mountains National Park) 13 Oct, 2019 Very Hard 2.7km return 2 hrs Amazing! Quite mentally challenging for me but was lucky enough to run into some experienced hikers on the way up who helped us to the top. I was more worried about getting down but they were right - getting down was way easier. Would recommend going with someone who has done this before. It's worth it. I was blown away by how helpful and caring everyone on the track was. Everyone helps each other and is good for a few words of guidance and encouragement. Mt Warning Summit Trail (Wollumbin National Park) 6 Oct, 2019 Hard 8.3km return 5 hrs Amazing. A group of us went up - 6 adults and 8 children aged between 7 and 14. They all loved it. Took about 6hrs return including many snack stops and lunch at the top.If you have to go to the bathroom please be prepared to take your mess with you! Views were beautiful, chains at the end were good fun. Everyone was very helpful and friendly. Twin Falls Circuit (Springbrook National Park) 4 Oct, 2019 Medium 4.6km return 90 mins Amazing. Kids loved it. Kondalilla Falls Circuit (Kondalilla National Park) 25 Sep, 2019 Medium 4.7km 2 hrs White Rock Ridge Hike (White Rock - Spring Mountain Conservation Estate) 14 Aug, 2019 Hard 6.5km 2 hrs Table Top Loop (Toowoomba) 3 Jul, 2019 Hard 2km return 2 hrs Great climb/scramble. Took my kids up - aged 8, 10 and 14. They loved it. Best to keep an eye on them and take water and first aid (just in case).Suck a great walk though. Mount Coolum (Sunshine Coast) 5 Apr, 2019 Medium 2.6km return 90 mins Mt Ngungun (Glass House Mountains National Park) 4 Jan, 2019 Medium 2.8km return 90 mins Carlo Sandblow (Great Sandy National Park) 30 Jul, 2018 Easy 3.2km return 90 mins « Ticks 1-19 of 19 »"
