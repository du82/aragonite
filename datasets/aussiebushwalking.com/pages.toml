full_description = "Menu Edit this walk Navigate to... GPS Tracks Kedron Brook Bikeway and Wetlands (GPX) A shared bike way along the Schulz Canal into a wetland area with plenty of bird life. Bird Watching Picnic Facilities Toilets Dogs Permitted Cycling Permitted Swamp or Wetland Add to My Wishlist Remove fromMy Wishlist Tick Walk (adsbygoogle = window.adsbygoogle || []).push({}); Getting there Start at the end of Hedley Ave, Nundah QLD Walk towards the wetland area along the Schulz Canal Maps Which maps cover the area? Route/Trail notes A detailed description of the walk! Permits/Costs Nil Other References How can I find more info? Any guide books? GPS Tracks Kedron Brook Bikeway and Wetlands (GPX) Comments Flat & sunny. Ideal in winter. Wanderlust on 11 Aug, 2024 We walked from Grinstead Park Stafford to the Toombul train station which was just over 8km. Nice quick train ride into the city and then we walked the 5km home from there.Lovely flat bikeway walk beside kedron brook which is really pretty in places. A very hot day but only a few spots were in direct sun as there is a fair bit of shade along this walk. Bobbe on 26 Jan, 2021 There were an amazing number of cormorants on the water today. We’ve never seen so many. Ian and Sue on 5 Jul, 2019 Flat and easy, surprisingly a lot of wildlife in the area. Keep left to avoid the bicycles. rob.bushman on 22 Oct, 2017 We walked this path all the way from Boondall wetlands to Stafford. Lovely walk for cooler weather. Ian and Sue on Jul, 2015 « Comments 0-5 of 5 » Tick this walk and add your own comments (adsbygoogle = window.adsbygoogle || []).push({}); This will report the image to moderators for review. Are you sure this image is offensive? Aussie Bushwalking users can maintain a wishlist of walks for you but you need to be a member. Click here to login if you're already a member, otherwise go here to register for your free account. Navigation to some bushwalks can be difficult. Automated navigation using Google Ma