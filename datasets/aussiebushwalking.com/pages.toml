["https://aussiebushwalking.com/users/31788"]
title = "Profile for Korina Meagher - Aussie Bushwalking"
description = "Aussie Bushwalking profile for Korina Meagher"
full_description = '''This Year 0 Number of Walks Ticked 0.0m Total Distance Ticked All Time 22 Number of Walks Ticked 123.5km Total Distance Ticked Ticks Name Date Difficulty Distance/Duration Mt Maroon (Mt Barney National Park) 5 Jun, 2020 Hard 6km return 4 hrs Wild Horse Mountain (Glass House Mountains National Park) 18 May, 2020 Medium 1.4km return 30 mins Gorge Falls (Springbrook National Park) 5 Apr, 2020 Medium 4km return 2 hrs Morans Falls (Lamington National Park) 1 Apr, 2020 Easy 4.4km return 90 mins Purling Brook Falls Circuit (Springbrook National Park) 29 Mar, 2020 Medium 4km return 2 hrs Flinders Peak (Ipswich - Flinders Goolman Conservation Estate) 26 Mar, 2020 Hard 6.5km return 3.5 hrs Hell Hole Falls (Mt Jerusalem National Park) 13 Mar, 2020 Medium 5.1km return 105 mins Bally Mountain (Gold Coast) 1 Jan, 2020 Hard 9.5km return 4 hrs Probably the most challenging hike to date just due to my terrible fitness and the relentless steep incline to summit was actually a relief to do a bit of scrambling to get up to the peak. Best views I've seen so far Pages Pinnacle (South East Queensland) 30 Dec, 2019 Hard 6.7km return 2.5 hrs Absolutely loved this one as not many people seem to know about it so we almost had the whole experience without seeing another soul. Larapinta Falls (Lamington National Park) 30 Dec, 2019 Hard 15km return 5 hrs Stunning waterfall definitely put this one on your list! Mount Beerwah Summit (Glass House Mountains National Park) 8 Dec, 2019 Very Hard 2.9km return 3 hrs Absolutely loved this climb most challenging to date but so worth it definitely dont attempt it in high temperatures and make sure you have good grip shoes for the slab extreamly slippery due to the worn track Mount Tibrogargan Summit (Glass House Mountains National Park) 27 Nov, 2019 Very Hard 2.7km return 2 hrs Had an amazing climb Was invited with a group that included a couple of other beginners. Definitely wouldnt recommend doing this one alone for the first time unless you are an avid and confident climber with good fitness as it's pretty steep and a decent scramble. Will do it a few more times with a guide before I would be confident to map out the path and climb it alone Trachyte Circuit (Glass House Mountains National Park) 16 Nov, 2019 Medium 5.9km return 2 hrs Booyong Walk (Treetop Walk) (Lamington National Park) 16 Nov, 2019 Easy 800m return 30 mins Kondalilla Falls Circuit (Kondalilla National Park) 15 Nov, 2019 Medium 4.7km 2 hrs Easy walk would be better to go after some rain as the waterfalls didnt have much going on but the view from the lookout made it worth it Mount Coolum (Sunshine Coast) 14 Nov, 2019 Medium 2.6km return 90 mins Nice easy walk left to walk up at 4am to get the sunrise Box Forest (Lamington National Park) 13 Nov, 2019 Medium 10.6km 5 hrs Not a hard walk at all but I can imagine in wetter months its being g pretty slippery the waterfalls were amazing there where so many and loads of wildlife along the way Mount Beerburrum (Glass House Mountains National Park) 7 Nov, 2019 Medium 3.5km return 90 mins Steep slug to the top good for a work out and some pretty nice views along the way Mt Ngungun (Glass House Mountains National Park) 7 Nov, 2019 Medium 2.8km return 90 mins Loved this walk super easy track and the caves along the way where cool. Felt good reaching the last steps to the top to expose an amazing view and array of butterflies and birds. Great views but highly recommended a sunrise or sunset trip went in the middle of the day and it got pretty scorching at the summit Mt Warning Summit Trail (Wollumbin National Park) 31 Oct, 2019 Hard 8.3km return 5 hrs My first "testing" hike. Did the walk solo and found it really easy to navigate through the track as it's clearly marked and laid out.My legs were not use to climbing 74 trillion steps so by the time it got to the scramble to the summit I was pretty gassed.Tried to practice my scrambling and not rely on the assistance chain but it did come in handy. I'm super unfit so I had a few breaks on the way but overall a pretty easy track only 3 and a half to 4 hrs return if you have a steady pace.I personally thought the views just before reaching the summit where better than from the peak I'm not sure if that's because it felt more natural and vast as a posed to being on the "balcony" « Ticks 1-20 of 22 »'''
