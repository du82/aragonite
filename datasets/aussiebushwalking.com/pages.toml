["https://aussiebushwalking.com/nsw/bald-rock-national-park/bungoona-walk"]
title = "Bungoona Walk - Aussie Bushwalking"
description = "Bungoona Walk - Take a more gentle walk up the eastern side of Bald Rock through the ‘cairn garden’ and The Arches to meet up with the main track to the summit of Bald Rock."
full_description = "Menu Edit this walk Navigate to... GPS Tracks 408 Bungoona Walk (GPX) Take a more gentle walk up the eastern side of Bald Rock through the ‘cairn garden’ and The Arches to meet up with the main track to the summit of Bald Rock. Lookouts Picnic Facilities BBQ Toilets No Dogs Permitted Camping Permitted Eucalypt Forest 1280m Maximum Elevation 185m Total Climb Add to My Wishlist Remove fromMy Wishlist Tick Walk (adsbygoogle = window.adsbygoogle || []).push({}); Getting there: From Tenterfield take the Mount Lindesay Road north and then turn left into Bald Rock Access Road and follow this for 5km to the car park and picnic area. From Stanthorpe drive towards Amosfield, then south along the Woodenbong Road/Mount Lindesay Road towards Tenterfield. The road is partially unsealed, with the turnoff into Bald Rock Access Road on the right. Maps: Bald Rock National Park Route/Trail notes: Take the main summit track to Bald Rock and once across the bridge take the left hand track. The Bungoona Walk takes a smoother approach, working its way up the gentler eastern side of Bald Rock, past the ‘cairn garden’ and then through the amazing Arches before meeting up with the main track that then crosses the saddle to the summit. Permits/Costs: National Park entry fee applies (2023 = $8 per vehicle/day). Park entry fees and camping permits can only be purchased online from National Parks NSW. The campgrounds are just behind the car park. Other References/Comments: Base yourself at Bald Rock Campground and take advantage of a spectacular sunrise or sunset from the top of Bald Rock. GPS Tracks 408 Bungoona Walk (GPX) Comments We have always climbed to the summit of Bald Rock via the main track and rock face, so to take the Bungoona Walk was an enjoyable alternative. Despite the campsite being full, we were the only ones to brave the cold and see the sunset from the summit. F.A.B. on 21 May, 2023 Took this route on the way up. Amazing scenery Anne on 26 Jul, 2022 Really enjoyed this walk with my family including our youngest who is 8. Some parental anxiety kicked in at the summit but the path was well marked and the views were amazing. ScottJM on 18 Jul, 2022 Many interesting boulder formations along the way. Wanderlust on 18 Apr, 2022 A scenic walk through large granite boulders saw two lyrebirds. Lahs on 12 Jan, 2022 We took the quick route up then the more gentle walk back along the Bungoona track on the way back. Outstanding views. You wouldn't visit the park without going up the rock, right! Richard Mason on Apr, 2007 Awesome view along the top! Well worth the trek up the steep rock. Belinda Cruickshank on Apr, 2007 « Comments 0-7 of 7 » Tick this walk and add your own comments (adsbygoogle = window.adsbygoogle || []).push({}); This will report the image to moderators for review. Are you sure this image is offensive? Aussie Bushwalking users can maintain a wishlist of walks for you but you need to be a member. Click here to login if you're already a member, otherwise go here to register for your free account. Navigation to some bushwalks can be difficult. Automated navigation using Google Maps or Apple Maps may not be accurate. Additionally, Aussie Bushwalking doesn't always have accurate positions for where to park for a walk. Please read the walk description for special directions and take extra care. Medium 5.4km return 90mins These values are provided by users. Your evaluation may differ. Where Click here to load this map. Nearby Walks Border Walk Loop (Bald Rock National Park) Bald Rock Summit (Bald Rock National Park) Little Bald Rock (Bald Rock National Park) Carrolls Creek Loop (Bald Rock National Park) Aztec Temple (Girraween National Park) Done this walk? This walk has been ticked 22 times Aussie Bushwalking can keep track of your bushwalks. Login/signup to tick this walk off."
