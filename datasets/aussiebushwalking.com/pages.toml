full_description = "This Year 0 Number of Walks Ticked 0.0m Total Distance Ticked All Time 12 Number of Walks Ticked 32.2km Total Distance Ticked Ticks Name Date Difficulty Distance/Duration Dularcha NP - Tunnel Track (Sunshine Coast) 7 Mar, 2024 Easy 6.6km return 2 hrs Went after some intense rain, the track was muddy and very slippery but still easy to manage. It was very peaceful and quiet, not a lot of foot traffic. The bats in the tunnel was a really cool experience, just keep your distance or alternatively you can bypass the tunnel and continue the track. Forest Lakeside Ewen Maddock Dam (Sunshine Coast) 12 Nov, 2023 Easy 1km return 15 mins Lots of wildlife on this track, absolutely beautiful scenery Bushrangers Cave (Springbrook National Park) 1 Oct, 2023 Medium 4.2km return 2 hrs Natural Bridge (Springbrook National Park) 30 Sep, 2023 Very Easy 1km return 30 mins Baxter Falls - Southern Approach (Kondalilla National Park) 14 Feb, 2023 Medium 7.6km return 3 hrs Beautiful scenic walk, the stairs are a killer though Imbil Brooloo Rail Trail (Sunshine Coast) May, 2020 Easy 9.6km return 3 hrs A beautiful trail for the whole family. Lots of native wildlife, so keep an eye and an ear out! Amama Walk (Amamoor State Forest) 2017 Medium 2.2km return 1 hr Go after some rain for the best experience of the cascades, be prepared for some slippery rocks and mud. Such a beautiful walk and easy to do with kids, I even took my grandparents who managed the trail easily. « Ticks 1-7 of 7 »"
