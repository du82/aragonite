["https://aussiebushwalking.com/users/34031"]
title = "Profile for Remy - Aussie Bushwalking"
description = "Aussie Bushwalking profile for Remy"
full_description = "This Year 0 Number of Walks Ticked 0.0m Total Distance Ticked All Time 24 Number of Walks Ticked 111.8km Total Distance Ticked Ticks Name Date Difficulty Distance/Duration Toolona Creek Circuit (Lamington National Park) 3 Sep, 2020 Medium 19.8km return 7 hrs This is a great walk, HOWEVER. If you use the shortcuts at the switchbacks you’ll miss the track split from Box Forest CCT to Toolana Creek CCT. We wandered around Box Forest for about 2 hours (and added an extra 10km to our trip) before backtracking far enough to realise our mistake..Total trip for our group was about 28km. We left the car park at 7.30am and got back at about 3.30pmSeptember is the right time of year for this one, not too cold, not too hot. I used 2 x 600ml bottles of water which was plenty. My fitness level is only about 5/10.Note that the cafe closes at 2.30 so if you leave this one too late in the day you’ll miss out on lunch when you get back. Box Forest (Lamington National Park) 3 Sep, 2020 Medium 10.6km 5 hrs I was part of a group doing the Toolana Creek CCT walk, however we took a shortcut at one of the switchbacks and ended up on this track by accident. We wandered for about 10km before we realised our mistake, eventually completing the Toolana Creek CCT as planned.I have left a detailed review on the Toolana Creek CCT page Mount Larcom Walk (Central Queensland) 1 Aug, 2020 Hard 7km return 4 hrs 3.5 hours return - 2hrs up 1.5hrs down (my level of fitness is only 5/10)Winter is the best time of month to do this. Cool start and then ~20deg days are beautiful.I did the walk on a Saturday morning, there was plenty of other walkers (the car park was almost full) and everyone was super friendly to one another along the track.I used 2 x 600ml bottles of water which was enough given I did it during the cooler months.The track is well marked with yellow and blue paint.It gets windy at the peak so be careful! Powerful Owl Trail (Mt. Coot-tha) 15 May, 2020 Medium 5.6km return 90 mins Ghost Hole Track (Mt. Coot-tha) 15 May, 2020 Easy 1km return 30 mins Nice easy track - nothing really left to see of the mines but cool to know about the work that used to go on here. Hemmant Quarry Reserve (Brisbane City Council Local Walks) 4 May, 2020 Very Easy 1.2km return 20 mins Nice easy stroll. Good place to take the dog.Sometimes there’s a bit of broken glass near the tables that overlook the water.BCC are doing a burn off this winter (2020) so hopefully that will clear it up a bit. Warrie Circuit (Springbrook National Park) 5 Mar, 2020 Hard 17km return 5 hrs Too many leeches to enjoy this walk I’m afraid :( Flinders Peak (Ipswich - Flinders Goolman Conservation Estate) 31 Jan, 2020 Hard 6.5km return 3.5 hrs 4 hours return (my level of fitness is only 5/10)I wouldn’t suggest doing it in summer - it’s too bloody hot!I used 3 x 600ml bottles of water and wished I took more.There were heaps of march/blowflies at the top. Take insect repellant! Piper Comanche Wreck (D'Aguilar National Park) 21 Nov, 2019 Hard 7.5km return 2 hrs This is a great track that requires some navigational skills.Walk the main track to the rock mound and then turn left and head down into the rainforest. There are arrows gouged into tree trunks to aid navigation. If you get to the large fallen tree that you have to walk along and clamber under, you’re going the right way!Don’t forget to sign the book that’s safely stored in the wreckage in the old ammo box.Take plenty of water.If there hasn’t been any rain you shouldn’t have issues with leeches. Mt Warning Summit Trail (Wollumbin National Park) 6 Nov, 2019 Hard 8.3km return 5 hrs Very hot in summer. Take lots of water.If you have an average level of fitness like myself you’ll complete it in about 4.5-5hrs.The view at the top is magic.There are lots of big flies at the top so take insect repellant.DON’T go up there in inclement weather. There are lightning rods attached to the viewing platform and people have died up there trying to camp during storms. Best Of All Lookout (Springbrook National Park) 2018 Very Easy 700m return 30 mins Natural Bridge (Springbrook National Park) 2018 Very Easy 1km return 30 mins I recommend doing this at night. Take a torch (don’t shine it at the worms) and go for a wander - it’s beautiful.Heaps of wildlife to see too (birds, snakes, frogs, the glow worms..) Cudgen Creek Estuary (New South Wales) 2008 Easy 5.8km return 90 mins Beautifully serene.I recommend doing this one early morning just after sunrise. Booyong Walk (Treetop Walk) (Lamington National Park) Sometime... Easy 800m return 30 mins Purling Brook Falls Circuit (Springbrook National Park) Sometime... Medium 4km return 2 hrs Minnippi Parkland Circuit (Brisbane City Council Local Walks) Sometime... Very Easy 4km return 1 hr Whites Hill Circuit (Brisbane City Council Local Walks) Sometime... Easy 2km 40 mins Grass Tree Track (Brisbane City Council Local Walks) Sometime... Easy 1km return 10 mins Oxley Creek Common-Secret Forest Walk (Brisbane City Council Local Walks) Sometime... Easy 4.6km return 1 hr Rainforest Circuit (Gold Coast) Sometime... Easy 2.3km return 1 hr Deceptively hot in summer. Watch for snakes.The view from the platform at the top is amazing « Ticks 1-20 of 21 »"
