title = "Rowlands Creek - Aussie Bushwalking"
description = "Rowlands Creek - A nice easy walk down to Rowlands Creek via Middle Ridge and Clay Pots Fire Trails."
full_description = "Menu Edit this walk Navigate to... GPS Tracks Rowlands Creek (GPX) A nice easy walk down to Rowlands Creek via Middle Ridge and Clay Pots Fire Trails. No Dogs Permitted Horses Permitted Cycling Permitted No Camping Permitted Rainforest 292m Maximum Elevation 268m Total Climb Add to My Wishlist Remove fromMy Wishlist Tick Walk (adsbygoogle = window.adsbygoogle || []).push({}); Getting there: Leave Mullumbimby on Main Arm Road. It becomes Skyline Road just before you enter Mt Jerusalem NP and then Manns Road beyond the junction of Middle Ridge Road, which will ultimately take you all the way to Uki. There are great views of the imposing cliffs of Mt Boogarem to your left. After 16.8km (the last 2.5km are gravel road), turn left into Middle Ridge Road and travel a further 1km to where you will see a gated track to the right called Middle Ridge Trail. There is room to leave cars here. This is the same starting point for Hell Hole Maps: None found. Route/Trail notes: From the Middle Ridge Track gate, follow the trail down for 1.3km till you reach a fork and take the track to your right. The left fork takes you down to Hell Hole Falls. Continue for a further 400mm and take Clay Pot Trail to your left that leads down steeply to Rowland's Creek. Permits/Costs: None. Other References/Comments: None provided. GPS Tracks Rowlands Creek (GPX) Comments Nic easy walk, we road our bikes. samkramer on 1 Jul, 2023 « Comments 0-1 of 1 » Tick this walk and add your own comments (adsbygoogle = window.adsbygoogle || []).push({}); This will report the image to moderators for review. Are you sure this image is offensive? Aussie Bushwalking users can maintain a wishlist of walks for you but you need to be a member. Click here to login if you're already a member, otherwise go here to register for your free account. Navigation to some bushwalks can be difficult. Automated navigation using Google Maps or Apple Maps may not be accurate. Additionally, Aussie Bushwalking doesn't always have accurate positions for where to park for a walk. Please read the walk description for special directions and take extra care. Medium 6.8km return 2hrs These values are provided by users. Your evaluation may differ. Where Click here to load this map. Nearby Walks Hell Hole Falls (Mt Jerusalem National Park) Unicorn Falls (Mt Jerusalem National Park) Mount Jerusalem (Mt Jerusalem National Park) Mt Chowan (Mt Jerusalem National Park) Clarrie Hall Dam (New South Wales) Done this walk? This walk has been ticked 1 times Aussie Bushwalking can keep track of your bushwalks. Login/signup to tick this walk off."
