["https://austinkleon.com/speaking"]
title = "Speaking - Austin Kleon"
description = "“Kleon isn’t a prototypical business guru—he’s an artist who has some fantastic insights about creativity.” —Business Insider"
full_description = "Speaking Creativity is not magic. Creativity is for everyone. That’s the message I’ve delivered with hand-drawn slides and a sense of humor to folks all over the world, from keynote speeches in front of thousands to fireside chats with a few members of a Fortune 500 company. To inquire about my rates and availability for an in-person or virtual speaking engagement, drop me a line. Virtual: All the inspiration of a keynote with the intimacy of a studio visit. During the COVID-19 pandemic, my clients and I experimented with a new kind of live (or pre-recorded) presentation that leverages digital tools for desktop demonstrations and deeper conversations. The result is a more interactive, comfortable, and meaningful experience for everyone involved. Talks, workshops, Q&A, and more… Whether our event is in-person or virtual, I offer three different formats, which can be combined or mixed together: talks, workshops, and moderated Q&A sessions. Talks Below are two examples of talks I give, both based on material from my bestselling books. They can be customized, or we can start from scratch. “Creative is Not a Noun!” 10 principles to help anyone — regardless of their job title — do more creative work in the digital world. A few of the things we’ll learn: to think of new ideas as mashups or remixes of previous ideas how sharing process builds a more innovative work culture the value of using analog tools for better ideas This is a great talk for a broad audience of people with different skill sets and abilities, and it’s especially good for people who don’t consider themselves creative. “How To Keep Going” 10 ways to stay focused, resilient, and creative in good times and bad. A few of the things we’ll learn: the value of repeatable daily habits for long-term success how to disconnect from the world so we can connect with ourselves simple tips to recharge and recapture our attention This is a great talk for teams going through a rough patch and audiences in need of a creative booster shot. Workshops My workshops are designed with fun, easy, hands-on activites to put participants back in touch with the creative energy we once experienced as children at play. A few options: Creative journaling (using exercises from The Steal Like An Artist Journal) Basic drawing for non-artists Newspaper blackout poetry How to make a zine The calm of collage Moderated Q&A Sessions I love talking one-on-one about the creative life and big ideas. In this format, a moderator interviews me about my work and then opens up to questions from the audience. (This works especially well online.) Praise “Kleon isn’t a prototypical business guru — he’s an artist who has some fantastic insights about creativity.” —Business Insider “[He’s] figured out the secret to making his talks and writings on fostering creativity both supremely useful and mercifully devoid of arty huckster ham-handedness…. Kleon is a new kind of creative mentor for the digital age.” —San Antonio Current “Positively one of the most interesting people on the Internet.” —The Atlantic Let’s work together! To inquire about my rates and availability, drop me a line."
