full_description = "Newspaper Blackout A bestselling book of poetry made by redacting newspaper articles with a permanent marker. Get a signed copy. Buy it now: Amazon • B&N • IndieBound • Bookpeople About the book Newspaper Blackout was released in 2010 and “helped fuel a movement” (Oprah Magazine) of blackout poetry across the internet. The companion site, NewspaperBlackout.com, was named “a must-see Tumblr blog” by Time magazine, and at the height of its popularity, published poems from all over the world to an audience of 140,000 readers. How to make a blackout poem You can read more about how I got started making the poems here. Teachers and educators: here are galleries of blackout poems in the classroom on Twitter and on Tumblr. Praise for the book: 2010 Poetry Foundation Best Seller 2010 Goodreads Choice Awards Best Poetry American Library Association 2011 Alex Award Nominee “Instead of starting with a blank page, poet Austin Kleon grabs the New York Times and a permanent marker and eliminates the words he doesn’t need.” —NPR’s Morning Edition “[The poems] resurrect the newspaper when everyone else is declaring it dead.” —The New Yorker “Brilliant.” —New York Magazine “Redacted masterpieces.” —Time Magazine “A kind of Rorschach approach to reading newspapers.” —The Wall Street Journal “Turns out Richard Nixon wasn’t our nation’s most gifted redactor.” —Time Out Chicago “Funny, profound, and clever poems sculpted like statues from the marble of newspaper articles.” —American Library Association Buy it now: Amazon B&N Powell’s IndieBound iBooks Ebooks.com"
