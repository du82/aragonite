["https://austinkleon.com/page/3"]
title = "Love is a mixtape - Austin Kleon"
description = "The latest newsletter."
full_description = "Love is a mixtape Sunday, January 19, 2025 I think of my Friday newsletters like mixtapes. The latest one begins: “There are all kinds of mix tapes. There is always a reason to make one,” writes Rob Sheffield in his memoir, Love is a Mix Tape. “I believe that when you’re making a mix, you’re making history. You ransack the vaults, you haul off all the junk you can carry, and you rewire all your ill-gotten loot into something new.” Read the rest: “Love is a mixtape” Permalink Nurturing the inner child Thursday, January 16, 2025 I thought my monthly mixtape project was complete, but I was wrong! Here is a new mix I really love: Spotify | Apple | Youtube I made it from a sealed, pre-recorded cassette I got for 99 cents at the record store. I taped over the cassette’s protection tabs and then I taped over the music and then I taped over the artwork. This one I wanted to have a wintry, childlike feel to it, because that’s the way I wanted to feel while finishing the first draft of the book I’m working on, Don’t Call It Art, which is all about what I learned about being creative from my kids. The record function on my good cassette deck went screwy on me, so I dragged out the trusty old Sony boombox I bought my son Owen when he first started getting into CDs: Here’s the tracklist: SIDE ONE – Paul McCartney, “Every Night” – Grizzly Bear, “Ready, Able” – The Beach Boys, “All I Wanna Do” – Robert Wyatt, “Heaps Of Sheeps” – Here We Go Magic, “Collector” – William Onyeabor, “Atomic Bomb” – Chino Yoshio, “193193 (For Marimba)” SIDE TWO – Francis Bebey, “Pygmy Love Song” – Herman’s Hermits, Mrs. Brown, You’ve Got A Lovely Daughter – Harry Nilsson, Listen, The Snow Is Falling – Timmy Thomas, Why Can’t We Live Together – Broadcast, Echo’s Answer – Radiohead, “Kid A” – Norma Fraser, “First Cut Is The Deepest” – Buddy Emmons, “Singing Strings Of Steel” You can listen to the mix on Spotify or Apple Music or Youtube. I also added it to a big 10+ hour playlist of all the mixes I’ve made so far. Filed under: mixtapes Permalink"
