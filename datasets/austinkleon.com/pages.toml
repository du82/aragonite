["https://austinkleon.com/page/624"]
title = "Austin Kleon – Page 624"
full_description = "VOICEMAIL Monday, September 12, 2005 FROM THE VAULT: the best voicemail I’ve ever received. Ever. Giving it a context or a backstory would only muddy the genius. (A____ B______, if you’re out there, God bless you.) Permalink RULES OF THE ROAD RUNNER Friday, September 9, 2005 Rules the writers and artists followed in making the Coyote-Road Runner series: 1. The Road Runner cannot harm the coyote except by going “Beep-beep!” 2. No outside force can harm the coyote—only his own ineptitude or the failure of the Acme products. 3. The coyote can stop any time—if he were not a fanatic. (Repeat: “A fanatic is one who redoubles his effort when he has forgotten his aim.”–George Santayana) 4. There may be no dialogue ever, except “beep-beep!” The coyote may, however, speak to the audience through wooden signs that he holds up. 5. The Road Runner must stay on the road —otherwise, logically, he would not be called “Road Runner”. 6. All action must be confined to the natural environment of the two characters—the southwest American desert. 7. All materials, tools, weapons, or mechanical conveniences must be obtained from the Acme Corporation. 8. Whenever possible, gravity should be made the coyote’s greatest enemy. 9. The coyote is always more humiliated than harmed by his failures. (from Chuck Amuck, the biography of animator Chuck Jones) Permalink"
