["https://austinkleon.com/2023/03/02/reading-about-animals"]
title = "Reading about animals - Austin Kleon"
description = "Going down a rabbit hole."
full_description = "Reading about animals Thursday, March 2, 2023 I finished Temple Grandin’s Visual Thinking and in the chapter on animal consciousness she mentions Michel de Montaigne’s great line from his An Apology for Raymond Sebond, “When I play with my cat who knows if I am not a pastime to her more than she is to me?” Serendipity: The next day, in preparation for my celebration of Montaigne’s birthday with Sam Anderson, I read his essay about animal voyages: “To return home from an animal voyage is to become, yourself, a new animal living in your old habitat.” Sam’s piece led me to John Berger’s wonderful essay, Why Look at Animals? (“The pet offers its owner a mirror to a part that is otherwise never reflected.”) Now I’ve picked Ed Yong’s An Immense World back up and I am enjoying it immensely. Filed Under: Reading Tagged: animals, ed yong, john berger, michel de montaigne, sam anderson, temple grandin"
