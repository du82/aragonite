["https://austinkleon.com/2025/02/11/soup-lessons"]
title = "Soup Lessons - Austin Kleon"
description = "A sign, a zine, pulled out of the soup."
full_description = "Soup lessons Tuesday, February 11, 2025 Last Friday I wrote a newsletter called “In The Soup”: It’s still soup season. Last month I tweeted, “Soup has a few lessons to teach us. One is: Sometimes things get better tomorrow.” A few days ago The Soup Peddler here in Austin, Texas posted an elegant edit: “Soup teaches us some things get better tomorrow.” (Note: some things, not all things.) I got to wondering what the other lessons of soup would be, so I made a zine called Soup Lessons: I’ve been thinking a lot about this back-and-forth chain-smoking process, how you throw out one thing, see how people react, throw out another thing based on that, and just keep doing this until you get somewhere interesting. It’s really obvious, but: The way you keep this process going is you… do stuff. You do one thing, and one thing leads to another. Filed Under: Miscellany Tagged: chain smoking, newsletter, one thing leads to another, soup, zines"
year_published = 2025
