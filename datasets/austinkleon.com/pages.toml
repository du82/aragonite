["https://austinkleon.com/on-this-date"]
title = "On this date"
full_description = "Reading about animals Thursday, March 2, 2023 I finished Temple Grandin’s Visual Thinking and in the chapter on animal consciousness she mentions Michel de Montaigne’s great line from his An Apology for Raymond Sebond, “When I play with my cat who knows if I am not a pastime to her more than she is to me?” Serendipity: The next day, in preparation for my celebration of Montaigne’s birthday with Sam Anderson, I read his essay about animal voyages: “To return home from an animal voyage is to become, yourself, a new animal living in your old habitat.” Sam’s piece led me to John Berger’s wonderful essay, Why Look at Animals? (“The pet offers its owner a mirror to a part that is otherwise never reflected.”) Now I’ve picked Ed Yong’s An Immense World back up and I am enjoying it immensely. Permalink How I prepare for an interview Wednesday, March 2, 2022 In this week’s newsletter, I shared these notes for my chat with Sarah Ruhl and how I prepare for an interview. Permalink Author Edward Carey on writing and drawing The Swallowed Man Tuesday, March 2, 2021 One result of the pandemic is that I’m actually able to attend author events at the same frequency I did before I had children. Last week I watched Edward Carey discuss writing and drawing his re-telling of Geppetto’s time in the belly of the whale, The Swallowed Man (and one of my favorite reads of last spring), while highlighting treasures from the Ransom Center here in Austin, Texas. (You can watch the whole talk on YouTube.) Here are my notes: Permalink Neil Postman’s advice on how to live the rest of your life Monday, March 2, 2020 I am a big fan of writer Neil Postman — especially Teaching as a Subversive Activity and Amusing Ourselves To Death, which I put at the very top of the recommended reading in Keep Going — so it was a delight to come across his general life advice compiled by his former student and colleague, Janet Sternberg, who worked closely with Postman over the years. She begins: A prolific writer, Postman authored numerous books, essays, articles, and speeches. Yet he never formalized in writing certain material that he presented in classes he taught at New York University in the Media Ecology Program. Almost every year, Postman ritually delivered several lectures, among them an enduring favorite which became known as his lecture on “How to Live the Rest of Your Life.” In his own personal notes, Postman titled this material simply his “Final Lecture,” describing it as “a lecture based on the supposition that American culture is in the process of decomposition. Technology has attacked all social institutions and although we may yet revive the culture, the problem to be solved is, how to survive until that happens.” I don’t agree with all of it, but I’ve cut and pasted some of my favorites below: 2. Do not watch TV news shows or read any tabloid newspapers. 3. Do not read any books by people who think of themselves as “futurists” 7. Establish as many regular routines as possible. 11. “As a general rule, do not take in any more information after seven or eight o’clock at night.” 12. “Work, friends, and family are the areas where what you think and do matters.” 14. With exceptions to be noted further ahead, avoid whenever possible reading anything written after 1900. 16. Weingartner’s Law: 95% of everything is nonsense. 18. Take religion more seriously than you have. 19. Divest yourself of your belief in the magical powers of numbers. 20. “You should distrust writers that English professors favor… read good writers despised by English professors.” 21. Patriotism is a squalid emotion. 22. New is rotten, big is rotten, and fast is rotten. You can read the whole thing here. Janet was also kind enough to send me a link to his rules on public speaking. If you want to get a feel for Postman’s voice and delivery, I recommend this 1997 lecture, “The Surrender of Culture to Technology,” which includes his 7 questions for a new technology: 1. What is the problem to which technology claims to be a solution? 2. Whose problem is it? 3. What new problems will be created because of solving an old one? 4. Which people and institutions will be most harmed? 5. What changes in language are being promoted? 6. What shifts in economic and political power are likely to result? 7. What alternative media might be made from a technology? Of course, the best way to get to know a new writer is through their books! Permalink"
