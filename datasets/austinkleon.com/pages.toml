["https://austinkleon.com/contact"]
title = "Contact - Austin Kleon"
description = "Email and mailing address for the author."
full_description = "Contact me Email • Mailing address • A note for students Email Due to the overwhelming number of emails I receive, I can barely even read them all, let alone get back to everybody. Forgive me in advance: austin@austinkleon.com The best way to stay in touch with me is to become a newsletter subscriber. (Every week we chat in the comments.) Mailing address The address below is always up-to-date. There is no top-secret special address that I will divulge if you email me. Somebody checks the box every week: Austin Kleon 1101 West 34th Street Box #102 Austin, TX 78705 No need to ask permission to send me things! I don’t know if I’ll be interested in your thing until I see it. I love getting books and other goodies in the mail, but please note I’m not a book reviewer or creative writing professor. I only read and share things that genuinely interest me. Please don’t send me unpublished manuscripts or anything that needs to be returned. If you’re worried about whether I will receive something, please use a tracking number. If you’re dying to hear back from me, you can increase the likelihood I’ll write back by including a self-addressed and stamped envelope. Students: Pretend I’m dead! Students! I love you, but, unfortunately, I can’t answer questions for your projects. If you have a question about my work, the best thing to do is research me as if I’ve been dead for a while. Read my books, check out my interviews, watch videos, Google me, etc. (And feel free to share this policy with your teacher!) A good place to start your research is my about page — there’s a ton of information there. If you’re looking for advice, all the advice I have to give about getting started and getting your work out there is in my books. You can also read more recent writing on my blog."
