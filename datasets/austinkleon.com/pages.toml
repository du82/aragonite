title = "The Steal Like An Artist Journal"
full_description = "The Steal Like An Artist Journal A notebook for creative kleptomaniacs. Get a signed copy. Buy now: Amazon – B&N – IndieBound – Powell’s – BookPeople Paperback, 224 pages, ISBN: 9780761185680 For years, people have asked me what kind of notebook I recommend, so I went ahead and made the notebook I always wished existed. Based on my New York Times best-selling book, The Steal Like An Artist Journal will help get your creative juices flowing and record new (and stolen) ideas, thoughts, and discoveries. Think of it as a daily course in creativity: a portable workshop and coursebook, jammed full of inspiration, prompts, quotes, and exercises designed to turn you into a creative kleptomaniac. The journal has an elastic band for place-marking and a special pocket in the back — a “swipe file” to store bits and pieces of inspiration. Because if you want to steal like an artist, you need a place to keep your loot… Buy it now: Amazon B&N IndieBound Powell’s BookPeople See more images from the journal on Instagram: #stealjournal A quick video introduction https://www.instagram.com/p/BtweA9JHYqe Learn how to journalize Watch a talk I gave about the benefits of journaling. See how others are using the journal Browse a gallery of journal pages on Pinterest. Buy it now: Amazon B&N IndieBound Powell’s BookPeople"
