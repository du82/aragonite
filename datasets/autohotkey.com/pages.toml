["https://autohotkey.com"]
title = "AutoHotkey"
description = "Free keyboard macro program. Supports hotkeys for keyboard, mouse, and joystick. Can expand abbreviations as you type them (AutoText)."
full_description = "Define hotkeys for the mouse and keyboard, remap keys or buttons and autocorrect-like replacements. Creating simple hotkeys has never been easier; you can do it in just a few lines or less! AutoHotkey is a free, open-source scripting language for Windows that allows users to easily create small to complex scripts for all kinds of tasks such as: form fillers, auto-clicking, macros, etc. AutoHotkey has easy to learn built-in commands for beginners. Experienced developers will love this full-fledged scripting language for fast prototyping and small projects. AutoHotkey gives you the freedom to automate any desktop task. It's small, fast and runs out-of-the-box. Best of all, it's free, open-source (GNU GPLv2), and beginner-friendly. Why not give it a try? AutoHotkey provides a simple, flexible syntax allowing you to focus more on the task at hand rather than every single little technicality. It supports not only the popular imperative-procedural paradigm, but also object-oriented and command-based programming. Feel free to look at the source code, make some contributions. Maybe, try out some of the forks of this project. Source code (at Github) AutoHotkey source code AutoHotkey documentation (de) ahk2exe source code AHKScript Github organisation Forks AutoHotkey_H + AutoHotkey.dll Pocket PCs (WinCE) KeySharp, a .NET rewrite (cross-platform, alpha stage), a continuation of IronAHK. Communities AutoHotkey forum (de, 中文, es, ru) (phpBB) Archived forum (de) (IPBoards) Stackoverflow Superuser Reddit ZEEF 中文论坛 (Chinese, autoahk.com) Русскоязычный форум (Russian, forum.script-coding.com) 한국어 (Korean, autohotkey.co.kr) Documentation & Tutorials Documentation (de - 帮助 - 한국어) Community tutorials (Forums) Community tutorials (Archive forum) YouTube AutoHotkey tutorials Book (work in progress) Rosettacode (code examples) 日本語 AutoHotkey Wiki (Japanese, ahkwiki.net) Jack Dunning's AHK Page (Scripts, examples) Pnal's AutoHotkey tutorials v1 | v2 (Korean, 한국어)"
year_published = 2025
clearnet = "https://autohotkey.com"
