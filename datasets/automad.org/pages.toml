full_description = "Changelog v2.0.0-alpha.21 Sun, 16 Feb 2025 13:15:28 +0100 New Features bring back full error reporting when debugging is enabled (0bdcc1b7d) enable page caching also when get, post or session are not empty (38cd4725e) Bugfixes fix navigating to the homepage from the dashboard in safari (a6d809e1f) v2.0.0-alpha.20 Mon, 10 Feb 2025 21:02:46 +0100 Bugfixes fix infinite loop in breadcrumb api when editing pages with secondary language in dashboard and language routing is enabled (cf44ff921) v2.0.0-alpha.19 Sun, 9 Feb 2025 13:23:36 +0100 New Features allow certain configuration settings to be defined as environment variables (1b68cbbd1) include actual configuration and server environment in json log files (268cd8754) v2.0.0-alpha.18 Sat, 8 Feb 2025 14:22:11 +0100 New Features add configuration option to enable open_basedir restriction (4d067f7ea) add option to add account details when creating users with the console (bafa155ea) add option to hide caching, debug and mail settings from users (824ebc7f5) add option to put server in maintenance mode and make content read-only (1cf051b9c) improve console and add config commands (3cebd17f6) v2.0.0-alpha.17 Sat, 1 Feb 2025 16:57:15 +0100 New Features add reusable component block type (254a62a2d) add support for php 8.4 (a8ff6ce06) ignore existing but empty path info server var when resolving request (38315cd0a) improve mail error messages (639d35070) improve open-graph image style (61df95c02) replace urlify package with slugify (dbdb3b581) revert merging localized homepage data with shared data (5523abebe) show component block content as read-only preview in editor (174f9e2b9) use configured email for from field and visitor email for reply-to field (10b3ef01d) Bugfixes fix language routing for language codes with more than two characters (dde411dee) v2.0.0-alpha.16 Sat, 14 Dec 2024 22:58:39 +0100 New Features add charset meta tag to rendered pages automatically (82512bcb2) update standard theme to version 1.