full_description = "Live Demo #Preview #v2 Version 2 is currently under active development and soon will be stable enough to be used in production. However, you can try already now the latest version of Automad 2 in a free live-demo. No sign-up is required! Before you continue and try out Automad online, please take a quick look at the limitations below. Start a demo now ⟶ Limitations Please note that in order to keep hosting costs under control, all demos are running on minimal hardware and expire after one hour. Expired demo instances will be discarded automatically. It is only possible to try out the latest release. This also includes unstable versions and therefore bugs are expected. This is especially true for the alpha phase. Reporting occuring issues is much appreciated and helps to improve Automad. Related ☀ Version 2 It took some time, but the release of Automad 2 is finally getting close. Many things have changed, however, the main concept and goals are still the same — a flexible and fast file-base content management system and templating engine. Read on below to find out more about ..."
