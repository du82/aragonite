["https://automad.org/developer-guide/cheat-sheets/creating-theme-packages"]
title = "Automad / Creating Theme Packages"
description = "This guide describes step by step the workflow of setting up and publish a new theme. It assumes you're familiar with Visual Code Studio and working on a system with a Bash shell or similar &mdash; like macOS or Linux."
full_description = '''Creating Theme Packages #Cheat Sheet #Package #Theme This guide describes step by step the workflow of setting up and publish a new theme. It assumes you're familiar with Visual Code Studio and working on a system with a Bash shell or similar — like macOS or Linux. The Local Package It's a good practice to start developing a new package outside of the Automad packages directory. Therefore change to some directory outside of Automad where you want to develop your new theme. Let's assume you want to put your package into a directory called dev within your home folder. cd ~/dev Create new skeleton theme in your dev directory using Composer. composer create-project automad/theme-skeleton my-theme Change to the new theme directory and edit the composer.json and theme.json files. VS Code is used here as the editor. At least change the vendor and theme name. cd my-theme code composer.json Also edit the name in theme.json. code theme.json Now change to your Automad root directory. For example ~/Sites/automad-site. cd ~/Sites/automad-site Edit the composer.json file of the Automad installation. code composer.json Add the following snippet to Automad's composer file (note the path to your package). { ... "repositories": [ { "type": "path", "url": "~/dev/my-theme" } ], ... } Still in the Automad directory run the following Composer command. composer require my-vendor/my-theme:@dev Now let's create a repository for your theme. Create a Git Repository When developing is done, it's time to publish your work. Init new Git repository and commit files. cd ~/dev/my-theme git init git add . git commit -m "First commit" Create a first release tag for your finished theme following the semantic versioning scheme. git tag -a 1.0.0 -m "my version 1.0.0" Create a new repository on GitHub. Now, add its URL as a remote to your local repository and push changes. When creating a repository, the URL will be printed on the GitHub page. git remote add origin /remote/URL/of/your/new/repo git push -u origin master Register Your Package Now it's time to submit your theme package to Packagist. After succseffuly registering it, it will automatically show up in the package browser. Related System ⁄ Installing Packages — System Automad can be easily extended by installing custom packages. A package can be a theme or a PHP extension or a combination of both. The easiest way to install packages is to use the Packages section on the Automad dashboard. It also helps you to get an overview about available ... Developer Guide ⁄ Building Themes — Developer Guide Themes are an essential part of a content management system. They define the way your content is presented to the visitors of your website. Automad's flexible and intuitive template language enables also inexperienced developers or beginners to create themes and templates on ... Building Themes ⁄ theme.json — Building Themes Every theme needs a theme.json to work. As mentioned before, all subdirectories of the packages directory containing a theme.json side by side with at least one template are to be considered as valid themes. Please see the list below for all required fields. Building Themes ⁄ Template Language — Building Themes Automad's template language provides a flexible and safe way to render content dynamically. In contrast to other generic template engines, the Automad core functions are integrated into the engine. That includes such things as image processing as well as a the access to an even ... Building Themes ⁄ Block Layouts — Building Themes Aside from just stacking blocks on top of each other, Automad's block editor provides some handy features to create flexible layout directly in the block editor. It is possible to stretch a block to the full with of the parent container to make it stand out as well as to arrange ... Building Themes ⁄ Customizing Blocks — Building Themes Most of the blocks only consist of pure HTML tags without classes and just inherit theme styles when being displayed. However the default styling of more complex blocks like the mail form or the gallery block might not be matching a theme out of the box. You can use CSS custom ... Building Themes ⁄ Plain PHP — Building Themes Automad supports plain PHP in template files. However, variables used in plain PHP blocks will not show up automatically in the dashboard and mixing PHP with Automad's template engine should be done carefully. Therefore it is not recommended to use plain PHP in normal templates. ... Developer Guide ⁄ Developing Extensions — Developer Guide The extension interface provides a convenient way of extending Automad's core functionality with custom PHP code while still offering Automad's template syntax. There are basically two types of template language extensions: generic extensions and custom pipe functions. Check out ... Developing Extensions ⁄ Generic Extensions — Developing Extensions In case you are missing any advanced feature while developing themes using Automad's template language, you are able to implement that functionality as a generic extension written in plain PHP. Developing Extensions ⁄ Custom Pipe Functions — Developing Extensions Automad provides already some basic string manipulation functions to be used with the pipe operator. However, in some cases it my be necessary to use a custom function to modify the content of a variable. Custom pipe functions can be written in plain PHP. Thier basic setup is ... Developer Guide ⁄ Publishing Packages — Developer Guide Automad uses Composer as dependency manager. Therefore packages can be made public by submitting them as Composer packages to the Packagist website. Published Automad packages also automatically appear in the package browser. The process of releasing a package is basically the ... Developer Guide ⁄ Cheat Sheets — Developer Guide In case you prefer to start developing a theme or extension without reading the full documention, the cheat sheets below are a good point to start. In addition to this page there is also the theme skeleton package available to help you getting started. Cheat Sheets ⁄ Useful Template Snippets — Cheat Sheets Find below a collection of useful snippets for common tasks using Automad's template language. Cheat Sheets ⁄ Plain PHP Snippets — Cheat Sheets In case you want to develop a new extension or use PHP in your templates, the collection of common code snippets below might help you getting started quickly. Packages Browse free Composer packages and install themes and extensions for your Automad site.'''
