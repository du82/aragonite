["https://automad.org/developer-guide/building-themes/template-language"]
title = "Automad / Template Language"
description = "Automad's template language provides a flexible and safe way to render content dynamically. In contrast to other generic template engines, the Automad core functions are integrated into the engine. That includes such things as image processing as well as a the access to an even wider range of methods through PHP ..."
full_description = '''Template Language #Theme Automad's template language provides a flexible and safe way to render content dynamically. In contrast to other generic template engines, the Automad core functions are integrated into the engine. That includes such things as image processing as well as a the access to an even wider range of methods through PHP extensions. Due to its close relation to the core, the template engine's syntax is clean and intuitive and reduces overhead to a minimum. Introduction Please check out the Cheat Sheets and the theme skeleton to get started. Automad's template language consists out of several different components. Those components can be split in two main groups - content and statements. As with other template languages, content and statements can be simply mixed with the template's HTML markup. <html> <head>...</head> <body> <@ header.php @> <# Some comment. #> <div class="nav"><@ navTop @></div> <h1>@{ title }</h1> <p>@{ text | markdown }</p> <@ footer.php @> </body> </html> Content All variables you define for a page as well as shared and runtime variables are considered content. A value of such a variable can be used in a template like this: @{ variable } A variable's value can also be modified by some functions or basic mathematical operations using the pipe syntax: @{ variable | function } @{ variable | +5 } Statements The group of available statements includes function calls, extension methods, control structures, snippet definitions and includes of other files. The basic statement syntax works as follows: <@ function { key: 'Value' } @> <@ snippet @> <@ file.php @> However, some statements like control structures or snippet definitions can also wrap a block of code: <@ foreach in pagelist @> ... <@ end @> Note the pagelist object in the example above. There are several types of objects which can be accessed by control structure during runtime. Context The context defines the page associated with a variable within the template. The default context is always the currently requested page reflected by the URL. It is possible to change that context using a foreach loops or a with statement. <# By default the current context is the requested page (URL) #> <@ with '/some-page' @> <# Within this block the context has changed to the page with the URL '/some-page' #> <h2>@{ title }</h2> <@ end @> Extending Templates Themes in most cases constist of multiple templates that share a lot of redundant code and only differ in minor details. To reduce such redundancy, it is recommended to extend one master template and just override those elements that have to be different. Using inheritance in order to follow the DRY principle will lead to much cleaner code and better organization of a project. Stripping Whitespace When building complex template structure, it can happen that actually generated output of a template contains a lot of unnecessary whitespace. That can for example also affect the functionality of a generated JSON response. Therefore Automad's template language allows for stripping unwanted whitespace as follows: <# Removing all whitespace before a statement. #> <@~ statement @> <# Removing all whitespace after a statement. #> <@ statement ~@> Commenting Things As with other languages, commenting your code is always a good practice. Comments are removed from the markup during rendering and can be used as follows: <# Some comment #> More in Template Language Variables Pipe Toolbox Objects Control Structures Snippets Includes Inheritance Using Extensions Recursive Navigations Working with Images Multilingual Content Related Developer Guide ⁄ Building Themes — Developer Guide Themes are an essential part of a content management system. They define the way your content is presented to the visitors of your website. Automad's flexible and intuitive template language enables also inexperienced developers or beginners to create themes and templates on ... Building Themes ⁄ theme.json — Building Themes Every theme needs a theme.json to work. As mentioned before, all subdirectories of the packages directory containing a theme.json side by side with at least one template are to be considered as valid themes. Please see the list below for all required fields. Building Themes ⁄ Block Layouts — Building Themes Aside from just stacking blocks on top of each other, Automad's block editor provides some handy features to create flexible layout directly in the block editor. It is possible to stretch a block to the full with of the parent container to make it stand out as well as to arrange ... Building Themes ⁄ Customizing Blocks — Building Themes Most of the blocks only consist of pure HTML tags without classes and just inherit theme styles when being displayed. However the default styling of more complex blocks like the mail form or the gallery block might not be matching a theme out of the box. You can use CSS custom ... Building Themes ⁄ Plain PHP — Building Themes Automad supports plain PHP in template files. However, variables used in plain PHP blocks will not show up automatically in the dashboard and mixing PHP with Automad's template engine should be done carefully. Therefore it is not recommended to use plain PHP in normal templates. ... Developer Guide ⁄ Cheat Sheets — Developer Guide In case you prefer to start developing a theme or extension without reading the full documention, the cheat sheets below are a good point to start. In addition to this page there is also the theme skeleton package available to help you getting started. Cheat Sheets ⁄ Useful Template Snippets — Cheat Sheets Find below a collection of useful snippets for common tasks using Automad's template language. Cheat Sheets ⁄ Plain PHP Snippets — Cheat Sheets In case you want to develop a new extension or use PHP in your templates, the collection of common code snippets below might help you getting started quickly. Cheat Sheets ⁄ Creating Theme Packages — Cheat Sheets This guide describes step by step the workflow of setting up and publish a new theme. It assumes you're familiar with Visual Code Studio and working on a system with a Bash shell or similar — like macOS or Linux.'''
year_published = 2025
