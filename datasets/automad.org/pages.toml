full_description = "Index Show All Show All ✓ Blocks Case Cheat Sheet Command Line Interface Composer Condition Configuration Content Context Dashboard Date Development Extension File Filelist Filter Find HTML Headless Image Inheritance Installation Language Layout Loop Math Method Navigation Object PHP Package Pagelist Pipe Preview Recursion Regex SEO Session Snippet Sort Statement Strip Theme URL Variable v2 100 pages found Developer Guide ⁄ Building Themes — Developer Guide Themes are an essential part of a content management system. They define the way your content is presented to the visitors of your website. Automad's flexible and intuitive template language enables also inexperienced developers or beginners to create themes and templates on ... System ⁄ Caching — System Caching is essential to speed up your site and should generally be enabled. However under some circumstances you might want to disable or clear your cache. The dashboard provides an easy way to change your cache's behavior with a few clicks. User Guide ⁄ Creating Pages — User Guide Managing pages using the dashboard is quite self-explanatory. Pages can be added by hitting the  button on the right side of the navigation bar on top. To navigate to an existing page, you can browse the site tree on the left sidebar or start typing some letters of the page ... Developing Extensions ⁄ Generic Extensions — Developing Extensions In case you are missing any advanced feature while developing themes using Automad's template language, you are able to implement that functionality as a generic extension written in plain PHP. Getting Started Automad is a PHP application and therefore requires a web server to run. However, the list of system requirements is rather short. You can choose between three installation options: Composer, Docker or manual download. In case all this is new for you and you just want to get ... Objects ⁄ Pagelist — Objects The pagelist contains by default all pages which are not hidden and therefore has no defined type. Changing the pagelist type to one of the following available types will update the selection of pages accordingly. The main purpose of this object is to provide an easy way of ... Variables ⁄ Reserved Variables — Variables Some variables have reserved names and are always defined. They can be found on top of the page/shared data section in the dashboard. Reseverd variables can be used like normal page variables. Building Themes ⁄ theme.json — Building Themes Every theme needs a theme.json to work. As mentioned before, all subdirectories of the packages directory containing a theme.json side by side with at least one template are to be considered as valid themes. Please see the list below for all required fields. →"
