full_description = '''Developing Extensions #Development #Extension #PHP #Package #Pipe The extension interface provides a convenient way of extending Automad's core functionality with custom PHP code while still offering Automad's template syntax. There are basically two types of template language extensions: generic extensions and custom pipe functions. Check out the source of the MetaTags extension to quickly get started with a simple example. Generic Extensions Generic extension allow for developing more complex and customized template functions of any kind having full access to all content and core functions of Automad. They can be used like standard Toolbox functions. <@ Namespace/Function { key: "Value", ... } @> Find out more about developing and structuring generic functions here. Pipe Functions In contrast to generic extensions, custom pipe functions are specifically meant to modify the content of a variable by using the pipe operator. They can be used in templates like any other pipe function. @{ variable | Namespace/Function } You can find more information about developing custom pipe functions here. More in Developing Extensions Generic Extensions Custom Pipe Functions Related System ⁄ Debugging — System During development of extensions it can be handy to see what Automad is doing. Therefore it is possible to send logging information to your browser's console. You can log any item, object or just a text notice using the following method in your extension or theme. System ⁄ Installing Packages — System Automad can be easily extended by installing custom packages. A package can be a theme or a PHP extension or a combination of both. The easiest way to install packages is to use the Packages section on the Automad dashboard. It also helps you to get an overview about available ... Developer Guide Extensibility is one of the most important features of any software. Basically there are two types of packages to extend the functionality of Automad: themes and 