title = "Automad / Debugging"
description = "During development of extensions it can be handy to see what Automad is doing. Therefore it is possible to send logging information to your browser's console. You can log any item, object or just a text notice using the following method in your extension or theme."
full_description = '''Debugging #Configuration #Development During development of extensions it can be handy to see what Automad is doing. Therefore it is possible to send logging information to your browser's console. You can log any item, object or just a text notice using the following method in your extension or theme. <?php \Automad\Core\Debug::log($element, $description); ?> The console output is only visible, when debugging is enabled and therefore you can leave all calls for the Debug::log() method permanetly within your code. You can enable debugging in the Debug Mode tab of the System Settings section. Related System Automad is designed to be extremely configurable. Managing system settings and running updates can be done by using the browser-based dashboard or a simple text editor and the console. System ⁄ Caching — System Caching is essential to speed up your site and should generally be enabled. However under some circumstances you might want to disable or clear your cache. The dashboard provides an easy way to change your cache's behavior with a few clicks. System ⁄ Users — System After successfully installing Automad, there is only one registered user. You can change the account information such as the username, email address and the password in the Users tab. Here you can also add, remove or invite other users to collaborate with you on your site. System ⁄ Language — System You can change the language used in the dashboard in the Language tab of the system settings. There are several languages available for the Dashboard. The translations are created automatically. This feature is still in an experimental phase and therefore some translations might ... System ⁄ Allowed File Types — System To increase the security of your Automad installation, it is only allowed to upload files which are on the whitelist of allowed file types. All common media file types are already on that list by default. In case you want to extend the whitelist, you can edit the ... System ⁄ Securing the Dashboard — System The default URL of Automad's dashboard is /dashboard. To add an extra layer of security to your site you can set a custom URL or disable the dashbaord entirely. Developer Guide Extensibility is one of the most important features of any software. Basically there are two types of packages to extend the functionality of Automad: themes and extensions. While Automad's template language allows beginners to develop their own themes, it is also possible to use ... Developer Guide ⁄ Building Themes — Developer Guide Themes are an essential part of a content management system. They define the way your content is presented to the visitors of your website. Automad's flexible and intuitive template language enables also inexperienced developers or beginners to create themes and templates on ... Developer Guide ⁄ Developing Extensions — Developer Guide The extension interface provides a convenient way of extending Automad's core functionality with custom PHP code while still offering Automad's template syntax. There are basically two types of template language extensions: generic extensions and custom pipe functions. Check out ... Developer Guide ⁄ Editor Plugins — Developer Guide To make the development of themes more efficient, it is recommended to install one of the Automad plugins for the editors listed below. Those plugins will add syntax highlighting for the Automad template engine as well as the most common snippets for autocompletion. Developer Guide ⁄ Cheat Sheets — Developer Guide In case you prefer to start developing a theme or extension without reading the full documention, the cheat sheets below are a good point to start. In addition to this page there is also the theme skeleton package available to help you getting started. Headless Mode Activating the headless mode turns Automad into a back-end only content management system without a presentation layer that focuses entirely on content creation. While the Dashboard can still be used to manage content, all data and files are made accessible via a read-only JSON ...'''
