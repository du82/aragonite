title = "Automad / Useful Template Snippets"
description = "Find below a collection of useful snippets for common tasks using Automad's template language."
full_description = '''Useful Template Snippets #Cheat Sheet #Theme Find below a collection of useful snippets for common tasks using Automad's template language. Content Defining a default value in case a variable is empty: @{ text | def ('Hello there') } Shorten a text to 100 chars: @{ text | 100 } Finding the first paragraph in a variable to be used in a page preview card or similar: <# Markdown variable #> @{ text | markdown | findFirstParagraph } <# Blocks #> @{ +main | findFirstParagraph } Getting the src of the first image in a variable to be used in a page card: <# Markdown variable #> @{ text | markdown | findFirstImage } <# Blocks #> @{ +main | findFirstImage } For example within a pagelist loop: <@ foreach in pagelist @> <@ set { :img: @{ +main | findFirstImage } } <@ if @{ :img } @> <img src="@{ :img }"> <@ end @> <@ end @> Loops Looping over a list of files with resizing and cropping: <@ foreach in "*.png, *.jpg" { width: 400, height: 400, crop: true } @> <img src="@{ :fileResized }" alt="@{ :basename }"> <@ end @> Create a recursive navigation tree: <# Create snippet to be used recursively #> <@ snippet tree @> <# Only show children/siblings in current path #> <@~ if @{ :currentPath } @> <# Only create new list in case the current context has children #> <@~ if @{ :pagelistCount } @> <ul> <@~ foreach in pagelist @> <li<@ if @{ :current } @> class="active"<@ end @>> <a href="@{ url }">@{ title | stripTags }</a> <# Call tree snippet recursively #> <@~ tree ~@> </li> <@~ end @> </ul> <@~ end @> <@~ end @> <@~ end ~@> <# Create new pagelist including all children adapting to the current context. #> <@~ newPagelist { type: 'children' } ~@> <# Change context to the homepage #> <@~ with "/" @> <# Call recursive tree snippet #> <@~ tree @> <@~ end @> Looping over page tags to create a comma separate list of tags with links to the parent page: <@~ foreach in tags ~@> <@~ if @{ :i } > 1 @>,&nbsp;<@ end ~@> <a href="@{ :parent }?filter=@{ :tag }">@{ :tag }</a> <@~ end ~@> Related Developer Guide ⁄ Building Themes — Developer Guide Themes are an essential part of a content management system. They define the way your content is presented to the visitors of your website. Automad's flexible and intuitive template language enables also inexperienced developers or beginners to create themes and templates on ... Building Themes ⁄ theme.json — Building Themes Every theme needs a theme.json to work. As mentioned before, all subdirectories of the packages directory containing a theme.json side by side with at least one template are to be considered as valid themes. Please see the list below for all required fields. Building Themes ⁄ Template Language — Building Themes Automad's template language provides a flexible and safe way to render content dynamically. In contrast to other generic template engines, the Automad core functions are integrated into the engine. That includes such things as image processing as well as a the access to an even ... Building Themes ⁄ Block Layouts — Building Themes Aside from just stacking blocks on top of each other, Automad's block editor provides some handy features to create flexible layout directly in the block editor. It is possible to stretch a block to the full with of the parent container to make it stand out as well as to arrange ... Building Themes ⁄ Customizing Blocks — Building Themes Most of the blocks only consist of pure HTML tags without classes and just inherit theme styles when being displayed. However the default styling of more complex blocks like the mail form or the gallery block might not be matching a theme out of the box. You can use CSS custom ... Building Themes ⁄ Plain PHP — Building Themes Automad supports plain PHP in template files. However, variables used in plain PHP blocks will not show up automatically in the dashboard and mixing PHP with Automad's template engine should be done carefully. Therefore it is not recommended to use plain PHP in normal templates. ... Developer Guide ⁄ Cheat Sheets — Developer Guide In case you prefer to start developing a theme or extension without reading the full documention, the cheat sheets below are a good point to start. In addition to this page there is also the theme skeleton package available to help you getting started. Cheat Sheets ⁄ Plain PHP Snippets — Cheat Sheets In case you want to develop a new extension or use PHP in your templates, the collection of common code snippets below might help you getting started quickly. Cheat Sheets ⁄ Creating Theme Packages — Cheat Sheets This guide describes step by step the workflow of setting up and publish a new theme. It assumes you're familiar with Visual Code Studio and working on a system with a Bash shell or similar — like macOS or Linux.'''
