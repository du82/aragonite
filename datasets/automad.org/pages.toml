["https://automad.org/user-guide/creating-pages"]
title = "Automad / Creating Pages"
description = "Managing pages using the dashboard is quite self-explanatory. Pages can be added by hitting the  button on the right side of the navigation bar on top. To navigate to an existing page, you can browse the site tree on the left sidebar or start typing some letters of the page title into the search bar on top. There ..."
full_description = "Creating Pages #Content #Dashboard Managing pages using the dashboard is quite self-explanatory. Pages can be added by hitting the  button on the right side of the navigation bar on top. To navigate to an existing page, you can browse the site tree on the left sidebar or start typing some letters of the page title into the search bar on top. There you can upload files, change the page settings and edit the page content. Note that you can also edit your text content directly while browsing your site. The In-Page edit mode is available as soon as you get logged in. Dashboard The Data & Settings tab contains all text content and settings of a page. At the top you can change the page title and define whether your page should be private or public. All other settings and page content is subdivided into five sections — Page Settings, Content, Colors, Template Settings and Unused Variables. Page Settings Here you can define the basic properties of the page: Choose a template for the page Hide the page form navigations and menus by activating the hidden toggle Define the order of the page in pagelists and navigations by adding a prefix — note that prefixes are invisible to visitors and will be stripped from URLs Define a custom name for the page directory that will be used as URL slug Redirect the page to another URL Set a date for your post Tag the page with some labels or categories Content The content section contains all text and block vaiables in the currently selected template. Click the little light bulp icon next to the variable label to get tooltips and descriptions for a variable. Text and block variables can be opened in a fullscreen editor for a more distraction free user experience. Just click the little expand icon on on the top right of the input to change to the fullscreen mode. More About Blocks Colors and Settings In case a theme provides a customizable color scheme, all available color options are listed here in the Colors section. All other settings that are in a way specific to the template in use and control the behavior of a page can be found in the Template Settings section. This section also contains settings such as pagelist configurations, menu options and teaser images. Unused Variables All variables which do not occur in the currently applied template can be found here. Private Pages You can use the privacy switch below the page title to make a page private. Private pages can only be viewed by people that are logged in. As long as a page is private, the page itself as well as all its children are not publicly visible. In-Page Edit Mode When being logged in, you can change a text directly on the page without changing to the dahboard. Just click the blue editing button next to a text to open a text editor in a modal window. Related System Automad is designed to be extremely configurable. Managing system settings and running updates can be done by using the browser-based dashboard or a simple text editor and the console. System ⁄ Language — System You can change the language used in the dashboard in the Language tab of the system settings. There are several languages available for the Dashboard. The translations are created automatically. This feature is still in an experimental phase and therefore some translations might ... System ⁄ Securing the Dashboard — System The default URL of Automad's dashboard is /dashboard. To add an extra layer of security to your site you can set a custom URL or disable the dashbaord entirely. User Guide Automad ships with an intuitive and clean user interface called the Dashboard. While it is recommended to use the dashboard to edit content and pages, it is also possible to use Automad with just a text editor and a file browser. User Guide ⁄ Using Blocks — User Guide Blocks are little pieces of content like a text paragraph, a header, a gallery, a slideshow or many others. You can even add dynamic content like pagelists, filelists or custom snippets. The block editor provides an intuitive editing experience and enables users to freely compose ... User Guide ⁄ General Data and Files — User Guide Basically general or shared content is just content without a page context. Usually that is the place to store site logos and content which is identical on all pages across your website. You can also choose your globally used theme here. Conceptually, shared content can be seen ... User Guide ⁄ Linking to Files and Pages — User Guide There are multiple places where you need to specify URLs to pages or paths to media files within your content. That may be a link within your markdown or a parameter for a tool or extension represented by a variable. Most of the times you would just use the buttons in the editor ... User Guide ⁄ Resizing Images — User Guide To optimize the speed of your website it is required to use images of an appropriate size. Images can be resized inline or by using the file manager. When using the image selection dialog, it is therefore possible and recommended to add the appropriate dimensions in pixels. User Guide ⁄ Key-Combos — User Guide Key-combos make content editing more efficient. Automad provides a very basic list of key-combos to navigate to pages or save changes. Variables ⁄ Reserved Variables — Variables Some variables have reserved names and are always defined. They can be found on top of the page/shared data section in the dashboard. Reseverd variables can be used like normal page variables."
year_published = 2025
