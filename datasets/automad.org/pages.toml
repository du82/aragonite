title = "Automad / Snippets"
description = "The snippet statement allows for defining reusable code snippets and is therefore also the basis for any kind of recursion in Automad. A snippet always inherits the context of the calling code. To use a snippet, it is enough to put the snippet's name in statement delimiters."
full_description = '''Snippets #Inheritance #Recursion #Snippet #Statement The snippet statement allows for defining reusable code snippets and is therefore also the basis for any kind of recursion in Automad. A snippet always inherits the context of the calling code. To use a snippet, it is enough to put the snippet's name in statement delimiters. <# Define snippet with the name "example". #> <@ snippet example @> <# Some code ... #> <@ end @> <# Use snippet somewhere later. #> <@ example @> Snippets have to be defined before being used. Recursion A simple example for a recursive usage of snippets is a site tree. Please also take a look at the menu snippet of the Skeleton theme. <div class="menu"> <@ snippet navigation @> <@ if @{ :pagelistCount } @> <ul class="menu-list"> <@ foreach in pagelist @> <li> <a href="@{ url }" <@ if @{ :current } ~@> class="has-background-info has-text-white" <@~ end @> > @{ title } </a> <@ if @{ :currentPath } @> <@ navigation @> <@ end @> </li> <@ end @> </ul> <@ end @> <@ end @> <@ newPagelist { type: 'children', excludeHidden: false } @> <@ with '/' @> <@ navigation @> <@ end @> </div> View Snippet on GitHub Inheritance The fact the snippets in a template file can be overridden after including it is part of the basic principle of inheritance in Automad. Read more about extending templates and reusing their code in the inheritance guide. Related Template Language ⁄ Toolbox — Template Language The Toolbox provides a collection of essential functions for templates. While some are just convenient shorthand functions for more complex statements, others provide the main interface to interact with objects, create redirects and work with query strings. Template Language ⁄ Control Structures — Template Language As in other languages, control structures in Automad are statements that dynamically determine the flow of an application or website based on evaluating content or variables. Automad knows four different statements to control the flow of the application: for, foreach, if and ... Template Language ⁄ Includes — Template Language In many cases, different templates across a theme use recurring components such as a header, a navbar or a footer. Those elements can be stored in separate files and included whenever needed. To include such an external snippet, simply wrap its path relative to the current file ... Template Language ⁄ Inheritance — Template Language In Automad, inheritance can be used to extend a template by simply including it into another one. To be able to actually change details in the derived version of a template it is important to understand how snippets work and how they can be used to override parts on an atomic ... Template Language ⁄ Using Extensions — Template Language Extensions provide a convenient way of turning custom PHP code into Automad statements. Besides the fact that extensions have to be called by their names including their namespace, the syntax is the same as for Toolbox or pipe functions. Template Language ⁄ Recursive Navigations — Template Language Navigations and menus represent an essential part of any webiste. Automad provides convenient methods to iterate over the collection of pages recursively and therefore allows for creating site trees in a few simple steps. The basic concept behind a navigation tree in Automad is ...'''
