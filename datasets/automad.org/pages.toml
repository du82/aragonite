veloping Extensions ⁄ Custom Pipe Functions — Developing Extensions Automad provides already some basic string manipulation functions to be used with the pipe operator. However, in some cases it my be necessary to use a custom function to modify the content of a variable. Custom pipe functions can be written in plain PHP. Thier basic setup is ... Developer Guide ⁄ Publishing Packages — Developer Guide Automad uses Composer as dependency manager. Therefore packages can be made public by submitting them as Composer packages to the Packagist website. Published Automad packages also automatically appear in the package browser. The process of releasing a package is basically the ... Developer Guide ⁄ Editor Plugins — Developer Guide To make the development of themes more efficient, it is recommended to install one of the Automad plugins for the editors listed below. Those plugins will add syntax highlighting for the Automad template engine as well as the most common snippets for autocompletion. Cheat Sheets ⁄ Useful Template Snippets — Cheat Sheets Find below a collection of useful snippets for common tasks using Automad's template language. Cheat Sheets ⁄ Plain PHP Snippets — Cheat Sheets In case you want to develop a new extension or use PHP in your templates, the collection of common code snippets below might help you getting started quickly. Cheat Sheets ⁄ Creating Theme Packages — Cheat Sheets This guide describes step by step the workflow of setting up and publish a new theme. It assumes you're familiar with Visual Code Studio and working on a system with a Bash shell or similar — like macOS or Linux. Headless Mode Activating the headless mode turns Automad into a back-end only content management system without a presentation layer that focuses entirely on content creation. While the Dashboard can still be used to manage content, all data and files are made accessible via a read-only JSON ..."
