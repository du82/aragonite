description = "A pipe | allows for using the value of a variable to be the input value for a function. It is also possible to chain multiple functions together, so that the output of one function is used as input for the next one. Therefore a pipe can be used to modify the value of a variable in place. Several functions as well as ..."
full_description = '''Pipe #Math #Pipe #Variable A pipe | allows for using the value of a variable to be the input value for a function. It is also possible to chain multiple functions together, so that the output of one function is used as input for the next one. Therefore a pipe can be used to modify the value of a variable in place. Several functions as well as basic mathematical operations can be used together with pipes. Mathematical Operations Mathematical operations when using pipes are limited to elementary arithmetic: addition +, subtraction-, multiplication * and division /. The syntax looks like this: @{ variable | +1 } @{ variable | /2 | -5 | *2 } Other variables can be used as well as operands. The following example will first set variable to the value of x if not defined. In a second step, the value of y or a default of 5 is added: @{ variable | def (@{ x }) | +@{ y | def (5) } } Functions The syntax for functions looks as follows: @{ text | markdown } Paramters can be passed to functions optionally: @{ text | markdown (true) } Those function parameters can be numbers, strings, boolean or even other variables. As you can see below, pipe functions can also be used for such nested variables: @{ date | dateFormat (@{ format | def ('Y') }) } There is also a special shorthand syntax for shortening text variables. The following example shortens the value of a variable to 100 characters whithout cutting words: @{ text | 100 } Examples The following example will first strip all markdown and HTML tags from the textTeaser variable and then shorten the text to 150 characters: @{ textTeaser | stripTags | 150 } Note that single quotes as well as double quotes can be used to wrap strings. Both examples below will produce the same output: <# Output: This is a "Test String" #> @{ text | def ('This is a "@{ variable }"') } @{ text | def ("This is a \"@{ variable }\"") } Variables used as function parameters only need to be quoted when being combined with strings. In case you just want to use a variable, quotes can be omitted: @{ text | def (@{ variable }) } More in Pipe ceil dateFormat def escape findFirstImage findFirstParagraph floor markdown match replace round sanitize shorten stripEnd stripStart stripTags strlen strtolower strtoupper ucwords Related Template Language ⁄ Variables — Template Language The actual value of a variable is depending on the current context. In most cases the context is the currently requested page. However, control structures can change the context to any other page during runtime, for example when iterating over a list of pages. In case a variable ... Variables ⁄ Reserved Variables — Variables Some variables have reserved names and are always defined. They can be found on top of the page/shared data section in the dashboard. Reseverd variables can be used like normal page variables. Variables ⁄ Runtime Variables — Variables There are some variables defined by Automad during runtime. The names of those runtime variables are always preceded with a colon as follows: @{ :basename } Runtime variables can be subdivided into two types - context related variables and variables created within control ... Pipe ⁄ ceil — Pipe Returns the next highest integer value by rounding up a variable if necessary. This function doesn't expect any parameters. Pipe ⁄ floor — Pipe Returns the next lowest integer value by rounding down a variable if necessary. This function doesn't expect any parameters. Pipe ⁄ round — Pipe Returns a rounded value of a variable as integer. This function doesn't expect any parameters. Toolbox ⁄ queryStringMerge — Toolbox Creates a query string containing the specified paramters as key/value pairs merged with the existing query string of the current URL. This method can be used to create links for adding or replacing some parameters of the query string without touching the other ones. A standard ... Toolbox ⁄ set — Toolbox Sets shared, session or runtime variables by passing key/value pairs as option array. Template Language ⁄ Using Extensions — Template Language Extensions provide a convenient way of turning custom PHP code into Automad statements. Besides the fact that extensions have to be called by their names including their namespace, the syntax is the same as for Toolbox or pipe functions. Developer Guide ⁄ Developing Extensions — Developer Guide The extension interface provides a convenient way of extending Automad's core functionality with custom PHP code while still offering Automad's template syntax. There are basically two types of template language extensions: generic extensions and custom pipe functions. Check out ... Developing Extensions ⁄ Custom Pipe Functions — Developing Extensions Automad provides already some basic string manipulation functions to be used with the pipe operator. However, in some cases it my be necessary to use a custom function to modify the content of a variable. Custom pipe functions can be written in plain PHP. Thier basic setup is ...'''
