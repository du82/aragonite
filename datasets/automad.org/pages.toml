["https://automad.org/developer-guide/building-themes/template-language/control-structures/foreach"]
title = "Automad / foreach"
description = "The foreach loop iterates over objects. Depending of the type of the object in use, Automad provides different runtime variables within the code block of the loop to refer to items of the object. The :i variable refers to the index of the current iteration in the loop."
full_description = '''foreach #Context #File #Filelist #Loop #Pagelist The foreach loop iterates over objects. Depending of the type of the object in use, Automad provides different runtime variables within the code block of the loop to refer to items of the object. The :i variable refers to the index of the current iteration in the loop. Usage The foreach loop has a simple syntax. When iteration over images, it is possible to pass a set of options to be applied to each file. It is also possible to define an else block to be processed instead when the list in use has no items. <@ foreach in ... { options } @> ... <@ else @> ... <@ end @> Pagelist When iterating over the pagelist object, the context changes with each iteration to the current page in the loop. Every variable used in the loop's code block is then associated with the current page in the loop. Take a look at this template to get started. <@ foreach in pagelist @> <li><a href="@{ url }">@{ :i }. @{ title }</a></li> <@ else @> <li>No pages here!</li> <@ end @> Runtime Variables :i The index of the page in the pagelist. Files To iterate over a set of files you can either use the filelist object or one (or more) glob pattern(s) as string or stored in a variable. Options can be applied to process each image within the resulting set of images. Check out the images template of the theme skeleton for more details. Note that glob patterns are always relative to the current page, unless they begin with a /. Patterns starting with a / are always relative to Automad's base URL. <@ foreach in "*.jpg, *.png" { width: 400, height: 300, crop: true } @> <img src="@{ :fileResized }" alt="@{ :basename }" title="@{ :file }" width="@{ :widthResized }" height="@{ :heightResized }" /> <p>@{ :caption }</p> <@ else @> <p>No images found!</p> <@ end @> Using a variable instead of a string: <@ foreach in @{ images | def('*.jpg') } { width: 400 } @> <img src="@{ :fileResized }" alt="@{ :basename }" /> <@ end @> Using the filelist object: <@ filelist { glob: @{ files | def('*.png') }, sort: 'asc' } @> <@ foreach in filelist { width: 400 } @> <img src="@{ :fileResized }" alt="@{ :basename }" /> <@ end @> Runtime :caption A caption associated with the current file in a loop. :i The index of the file in the list. :file The full path of the original file. :basename The basename (filename) of the original file. :width The original width in pixels. :height The original height in pixels. :fileResized The path to the resized version of the file. Every size has its own unique filename. :widthResized The resulting width after processing the file in pixes. :heightResized The resulting height after processing the file in pixes. Tags and Filters You can iterate over the list of tags associated with current context (page) as follows: <ul> <@ foreach in tags @> <li>@{ :tag }</li> <@ end @> </ul> To iterate over a list of tags associated with all pages in the current pagelist, you can use the filters object. The example below demonstrates how to use the filters object to create a simple menu to filter a pagelist: <ul> <@ foreach in filters @> <li> <a href="?<@ queryStringMerge { filter: @{ :filter } } @>"> @{ :filter } </a> </li> <@ end @> </ul> Related User Guide ⁄ Linking to Files and Pages — User Guide There are multiple places where you need to specify URLs to pages or paths to media files within your content. That may be a link within your markdown or a parameter for a tool or extension represented by a variable. Most of the times you would just use the buttons in the editor ... User Guide ⁄ Resizing Images — User Guide To optimize the speed of your website it is required to use images of an appropriate size. Images can be resized inline or by using the file manager. When using the image selection dialog, it is therefore possible and recommended to add the appropriate dimensions in pixels. Template Language ⁄ Variables — Template Language The actual value of a variable is depending on the current context. In most cases the context is the currently requested page. However, control structures can change the context to any other page during runtime, for example when iterating over a list of pages. In case a variable ... Variables ⁄ Runtime Variables — Variables There are some variables defined by Automad during runtime. The names of those runtime variables are always preceded with a colon as follows: @{ :basename } Runtime variables can be subdivided into two types - context related variables and variables created within control ... Toolbox ⁄ filelist — Toolbox Updates the configuration of the filelist object. A foreach loop can be used to iterate over the files in the list. This method has no output. Toolbox ⁄ img — Toolbox Creates an image tag for the first image file matching the specified glob pattern. The image can also be cropped by defining a maximum width and height. Toolbox ⁄ newPagelist — Toolbox Creates a new pagelist object. The current pagelist will be replaced. A foreach loop can be used to iterate over the pagelist object. This method does not have any output. To only update the configuration of the current pagelist, without resetting all other parameters, the ... Toolbox ⁄ pagelist — Toolbox Modifies the currently defined pagelist pagelist object. Only specified options will be changed, all others will be preserved. To restore a default pagelist and reset all options, the newPagelist method can be used. Template Language ⁄ Objects — Template Language Objects in Automad are conceptually just lists containing iteratable items to be used in foreach loops. Such lists are automatically populated with default sets of elements while rendering a page. They always exist. The actual content of any object is depending on the current ... Objects ⁄ Pagelist — Objects The pagelist contains by default all pages which are not hidden and therefore has no defined type. Changing the pagelist type to one of the following available types will update the selection of pages accordingly. The main purpose of this object is to provide an easy way of ... Objects ⁄ Filelist — Objects The filelist contains by default all image files of the current page. The selection of files can be modified by using the filelist function. Check out this detailed example of how to use a filelist. Similar to the pagelist object, it is possible to get the number of files in the ... Objects ⁄ Filters — Objects The filters object is a unique list of tags associated with pages of the current pagelist. A good example of the usage of the filters object can be found here. You can use the :filter variable to get the current filter tag while looping over the filters object. Template Language ⁄ Control Structures — Template Language As in other languages, control structures in Automad are statements that dynamically determine the flow of an application or website based on evaluating content or variables. Automad knows four different statements to control the flow of the application: for, foreach, if and ... Control Structures ⁄ for — Control Structures The for loop iterates over a range of numeric values of type integer. Control Structures ⁄ with — Control Structures The with statement allows for processing code associated with a given page or file. When using a page's URL or one of the keywords prev and next as an argument, the context within the block of code changes to that page. When using a file path, it is possible to access related ... Template Language ⁄ Recursive Navigations — Template Language Navigations and menus represent an essential part of any webiste. Automad provides convenient methods to iterate over the collection of pages recursively and therefore allows for creating site trees in a few simple steps. The basic concept behind a navigation tree in Automad is ... Template Language ⁄ Working with Images — Template Language Images are the most important type of media used in the internet and are essential for any kind of blog or portfolio. Automad's template language provides handy methods for basic image processing like resizing and cropping. When using a single image or iterating a set of images, ...'''
