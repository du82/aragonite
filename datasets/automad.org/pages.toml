i (2019c80ea) v1.8.6 Tue, 31 Aug 2021 21:01:29 +0200 Bugfixes system: update Composer to version 2.1.6 in order to fix issues on Windows (81cc05972) ui: fix block editor toolbar on small devices (6c81c4378) v1.8.5 Fri, 13 Aug 2021 01:21:26 +0200 Bugfixes ui: remove slug input from homepage settings (38a0ca8e5) v1.8.4 Thu, 12 Aug 2021 22:24:51 +0200 New Features core: add Str::slug() method to sanitize ids and directory names (4ee87a3bc) ui: add chinese, japanese and korean translations (a287a740e) ui: add option to define a custom slug for a page (c593fa29d) Bugfixes ui: fix typo in text modules (ba8702a87) ui: fix updating links that are wrapped in quotes (4417468d6) v1.8.3 Mon, 9 Aug 2021 23:21:36 +0200 New Features core: use a shortened md5 hash as directory slug in case a sanitized title is too short (d6d5e57cd) Bugfixes ui: fix updating links to images that belong to the page they are used on (723a6be37)"
