title = "Automad / Headless Mode"
description = "Activating the headless mode turns Automad into a back-end only content management system without a presentation layer that focuses entirely on content creation. While the Dashboard can still be used to manage content, all data and files are made accessible via a read-only JSON API."
full_description = "Headless Mode #Development #Headless Activating the headless mode turns Automad into a back-end only content management system without a presentation layer that focuses entirely on content creation. While the Dashboard can still be used to manage content, all data and files are made accessible via a read-only JSON API. The headless mode only has a single template to generate JSON formatted responses. It is possible to create a custom template to replace the default one directly from within the dashboard or with any external text editor. Due to security reasons, a headless template can only be written in Automad's template languange without any PHP. Custom Templates The recommended way of creating and editing a custom JSON template is to use the Dashboard as shown in the image above. However, to override the default JSON response template without using the Dashboard, a custom template file named headless.json has to be created in Automad's config directory manually. As long as that file exists, it will be used to render the response instead of the default one. It is good practice to copy the default JSON template from /automad/headless/json.php to /config/headless.json to get started quickly. Note that the custom JSON template has the .json extension! Related System ⁄ Debugging — System During development of extensions it can be handy to see what Automad is doing. Therefore it is possible to send logging information to your browser's console. You can log any item, object or just a text notice using the following method in your extension or theme. Developer Guide Extensibility is one of the most important features of any software. Basically there are two types of packages to extend the functionality of Automad: themes and extensions. While Automad's template language allows beginners to develop their own themes, it is also possible to use ... Developer Guide ⁄ Building Themes — Developer Guide Themes are an essential part of a content management system. They define the way your content is presented to the visitors of your website. Automad's flexible and intuitive template language enables also inexperienced developers or beginners to create themes and templates on ... Developer Guide ⁄ Developing Extensions — Developer Guide The extension interface provides a convenient way of extending Automad's core functionality with custom PHP code while still offering Automad's template syntax. There are basically two types of template language extensions: generic extensions and custom pipe functions. Check out ... Developer Guide ⁄ Editor Plugins — Developer Guide To make the development of themes more efficient, it is recommended to install one of the Automad plugins for the editors listed below. Those plugins will add syntax highlighting for the Automad template engine as well as the most common snippets for autocompletion. Developer Guide ⁄ Cheat Sheets — Developer Guide In case you prefer to start developing a theme or extension without reading the full documention, the cheat sheets below are a good point to start. In addition to this page there is also the theme skeleton package available to help you getting started."
