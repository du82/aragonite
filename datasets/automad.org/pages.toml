erflow breaking card layouts (2bdfe5fa3) ui: fix datetime input field style on ios (166e1dc7b) fix download links in file info modal (0b81320a4) fix navbar spacing in inpage edit form (0fd31f749) fix position of inpage edit overlay in dom (486a455ed) fix processing email addresses inside of markdown blocks (af569f032) fix small display alert being copied with editor content (cb7a6c73a) fix template name display in page data form (451101ded) v2.0.0-alpha.9 Sat, 9 Nov 2024 19:24:22 +0100 New Features ui: add undo and redo button tooltips (e5def55b6) ui: improve highlighting of matches in search results (4586f54bb) add option to discard changes and revert content to the last published version (2a40c1e74) add public pagelist api (6967a5faa) add select field type (45a7e1569) improve handling of usernames and emails (847b80aab) purge unused fields when changing page templates (1a23b56c4) purge unused fields when changing the main theme (b9f1da599) Bugfixes ui: fix several styling issues (3e0641ad8) fix image editor button and modal window style issues (2db554413) fix percentage unit input field (b6df22c5f) v2.0.0-alpha.8 Sun, 27 Oct 2024 19:34:06 +0100 New Features add customization editor placeholders with shared values (8aa92e3c6) hide block editor on small devices and show alert instead (2b3f644ee) improve customization field labels and add customization section info (a08ce16df) improve urls of remote images (ab6514de1) merge data of localized home page with shared data when language router is enabled (81165de58) replace custom js and css file fields with custom html fields (38be7bab4) Bugfixes i18n: fix home page url when language router is enabled (02391e2f1) ui: fix disappearing block when dragging onto itself (d3a3d4a9b) ui: fix hidden dropdown items on small devices (0800a93dc) ui: fix text overflow in jump bar (03109a60c) ui: fix text overflow of autocomplete dropdowns (45cd0b25d) enable text wrap in code editors in order to fix invisble text (fa107781c) fix deleting image caption not triggering change event (1960fb0be) v2.0.0-alpha.7 Sun, 13 Oct 2024 20:56:43 +0200 New Features add disk usage monitoring (bd6495852) add option to define a disk quota (de39719aa) add option to filter the list of allowed packages (b525156b2) deduplicate form submissions (a6ded4e63) improve naming of resized images in cache (075b45fec) Bugfixes blocks: fix pasting and merging blocks (c811131f9) ui: fix visibility of sidebar items on medium size devices (de2e6fe40) fix dashboard redirections when saving pages the are aliases for the home page (4cb37fd55) fix wrong file overwriting errors when editing page and shared data (1e4903f09) v2.0.0-alpha.6 Sun, 15 Sep 2024 19:37:00 +0200 New Features ui: improve button loading animation (7fbb813ef) add customization fields for CSS and JS code and files (660691c24) add support for remote webp images (0f1885dd9) move mail config to a separate file (b48b25329) Bugfixes ui: fix visibility of navbar items on medium size screens (2f3258822) fix processing of nested in-page editing buttons (4fa5eb0d3) v2.0.0-alpha.5 Sun, 30 Jun 2024 19:41:20 +0200 New Features add better button loading state (f2eaf3696) Bugfixes history: fix missing revisions when using in-page edit mode (4a87da80c) fix delete button state for empty file lists (c9617f0ac) fix image previews when pretty urls are disabled (2cc2afa80) fix remote code execution vulnerability in file editor (85e23bc67) set proper response code when uploading unsupported file type (66f369c30) v2.0.0-alpha.4 Sat, 13 Apr 2024 00:13:36 +0200 New Features engine: add syntax highlighting for code blocks and markdown variables (e9d14ae1d) migration: map legacy standard theme to new standard-v1 composer package (94b3714fb) ui: add syntax highlighting theme selection field to page and shared settings (cf85d6ae8) add line numbers and copy button for code blocks (ca6c70014) add syntax highlighting for the automad template language (94aefa355) Bugfixes blocks: fix gallery count