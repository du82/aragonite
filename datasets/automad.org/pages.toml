["https://automad.org/system/caching"]
title = "Automad / Caching"
description = "Caching is essential to speed up your site and should generally be enabled. However under some circumstances you might want to disable or clear your cache. The dashboard provides an easy way to change your cache's behavior with a few clicks."
full_description = '''Caching #Configuration Caching is essential to speed up your site and should generally be enabled. However under some circumstances you might want to disable or clear your cache. The dashboard provides an easy way to change your cache's behavior with a few clicks. Caching in Automad is divided into multiple levels of chached information to speed up your website and process your content efficently. Pages are only rendered when necessary or their maximum lifetime is reached and content is only crawled when changes have been made to pages, files or settings. Check out the detailed information for all available settings and actions on the Caching tab in the System Settings section. Cache Settings in config.json As described before, you can also directly edit the caching preferences in config/config.json. Note that all time settings are defined in seconds. { "AM_CACHE_ENABLED": true, "AM_CACHE_LIFETIME": 43200, "AM_CACHE_MONITOR_DELAY": 120 } Related System Automad is designed to be extremely configurable. Managing system settings and running updates can be done by using the browser-based dashboard or a simple text editor and the console. System ⁄ Users — System After successfully installing Automad, there is only one registered user. You can change the account information such as the username, email address and the password in the Users tab. Here you can also add, remove or invite other users to collaborate with you on your site. System ⁄ Language — System You can change the language used in the dashboard in the Language tab of the system settings. There are several languages available for the Dashboard. The translations are created automatically. This feature is still in an experimental phase and therefore some translations might ... System ⁄ Debugging — System During development of extensions it can be handy to see what Automad is doing. Therefore it is possible to send logging information to your browser's console. You can log any item, object or just a text notice using the following method in your extension or theme. System ⁄ Allowed File Types — System To increase the security of your Automad installation, it is only allowed to upload files which are on the whitelist of allowed file types. All common media file types are already on that list by default. In case you want to extend the whitelist, you can edit the ... System ⁄ Securing the Dashboard — System The default URL of Automad's dashboard is /dashboard. To add an extra layer of security to your site you can set a custom URL or disable the dashbaord entirely.'''
