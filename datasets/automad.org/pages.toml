["https://automad.org/system/updating-automad"]
title = "Automad / Updating Automad"
description = "Keeping software up to date is always a good idea. Updating Automad takes only a couple of seconds. Initiating updates can be done via the dashboard or using the command line interface."
full_description = "Updating Automad #Command Line Interface #Installation Keeping software up to date is always a good idea. Updating Automad takes only a couple of seconds. Initiating updates can be done via the dashboard or using the command line interface. Note that it is always recommended to backup your site before running updates! In case you are running Automad on Windows, make sure all files of your installation are closed in any program on your computer before updating! Dashboard You can always verify whether your installation is up to date and trigger updates when needed in the Update tab in the System Settings section. Command Line Automad can also be updated by using the console. To initiate updates, run the following command in your command line interface within Automad's installation directory. php automad/console update Related Getting Started Automad is a PHP application and therefore requires a web server to run. However, the list of system requirements is rather short. You can choose between three installation options: Composer, Docker or manual download. In case all this is new for you and you just want to get ... Getting Started ⁄ Local Installation — Getting Started You might want to install Automad first on your local Mac or Windows computer to get familiar with the system or start developing your site. Like any other CMS, Automad requires a webserver to be running. The easiest way to achive this, is to install a complete webserver package ... Getting Started ⁄ System Requirements — Getting Started Automad is primarily designed to be installed on shared hosting environments. Therefore Automad is tested on several Apache and Nginx web servers. Other environments are untested! The list of system requirements is rather short: Apache or Nginx webserver PHP 7.4-8.1 including ... Getting Started ⁄ Terms of Use — Getting Started Automad is released under the MIT license and is free to use - for private websites as well as for commercial projects. Note that Automad takes the privacy of its users very serious and therefore only a very minimum of telemetry data is transmitted from time to time. At no point ... System ⁄ Users — System After successfully installing Automad, there is only one registered user. You can change the account information such as the username, email address and the password in the Users tab. Here you can also add, remove or invite other users to collaborate with you on your site. System ⁄ Installing Packages — System Automad can be easily extended by installing custom packages. A package can be a theme or a PHP extension or a combination of both. The easiest way to install packages is to use the Packages section on the Automad dashboard. It also helps you to get an overview about available ... System ⁄ Console — System Automad provides a basic and minimal console to run system tasks using the command line interface."
