["https://automad.org"]
title = "Automad / A Flat-File CMS and Template Engine"
description = "Automad is a fast and lightweight flat-file content management system and template engine for creatives that can be used in a monolithic or headless mode."
full_description = "The elegant dashboard including the block editor and the in-page edit mode provide a convenient and intuitive way of editing pages No database is required — all content is stored in human readable text files which makes it easy to put a whole site under version control While being file based, database features like searching and tagging are still a fundamental feature and directly implemented in the core Use an elegant browser-based dashboard to configure system settings, upload images, install themes or write a blog post by using a clean and responsive user interface. Blocks are little pieces of content like a text paragraph, a header, a gallery, a slideshow or many others. The block editor provides an intuitive editing experience and enables editors to freely compose a post from several blocks. Edit your pages directly while browsing your website. The In-Page Edit Mode is active as soon as you get logged in. Automad works out of the box. It includes two elegant portfolio and blog themes. In case you are missing a feature, Automad is designed to be easily extendable. Activating the headless mode turns Automad into a CMS without a presentation layer that focuses entirely on content creation. While the Dashboard can still be used to manage content, all data and files are made accessible via a read-only JSON API. Automad’s template interpreter is written in pure PHP and processes templates on the fly. No extra build process is required. The list of system requirements is also rather short. A web server with is enough to run a site. Create your own professional templates using Automad's flexible template language without the need of PHP. And in case you are missing any advanced feature, it can be easily implemented as a PHP extension. You can also use the Theme Skeleton tutorial package to get started quickly with your own custom theme. Follow Automad on Twitter to stay always up to date and get the latest news about features and releases."
