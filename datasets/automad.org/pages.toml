title = "Automad / Local Installation"
description = "You might want to install Automad first on your local Mac or Windows computer to get familiar with the system or start developing your site. Like any other CMS, Automad requires a webserver to be running. The easiest way to achive this, is to install a complete webserver package on your computer - for example XAMPP. ..."
full_description = 'Local Installation #Installation You might want to install Automad first on your local Mac or Windows computer to get familiar with the system or start developing your site. Like any other CMS, Automad requires a webserver to be running. The easiest way to achive this, is to install a complete webserver package on your computer - for example XAMPP. The following steps will guide you through that process. Installing XAMPP Go to the XAMPP website, download the right package for your operating system and start the installer. There should be also a video tutorial on the XAMPP landing page which visualizes the whole process. Make sure that the GD PHP extension is enable and working properly by following these steps precisely: Open the XAMPP control panel Click on the Config button for Apache and open the php.ini file In the php.ini search for ;extension=gd (note the ; at the beginning) and remove the ; in order to enable the extension Save and close the file Start Apache using the Start button Installing Automad After successfully installing and starting your new webserver, navigate to the document root folder called htdocs. On Windows computers it is normally located at C:\xampp\htdocs While on a Mac, it can be found here /Applications/XAMPP/htdocs Create a new directory for your website, for example my-site inside the htdocs directory Download Automad and extract the .zip file in the directory you created in the step before In case you have a Mac, you will have to recursively set the correct permissions for your my-site directory. Take a look at this Stack Overflow post for detailed instructions Navigate to http://localhost/my-site in your browser to verify that the installation is working Naviagte to http://localhost/my-site/dashboard to create an user account When your test phase is over you simply have to copy your Automad installation over to your webspace to get your site online. Related Getting Started Automad is a PHP application and therefore requires a web server to run. However, the list of system requirements is rather short. You can choose between three installation options: Composer, Docker or manual download. In case all this is new for you and you just want to get ... Getting Started ⁄ System Requirements — Getting Started Automad is primarily designed to be installed on shared hosting environments. Therefore Automad is tested on several Apache and Nginx web servers. Other environments are untested! The list of system requirements is rather short: Apache or Nginx webserver PHP 7.4-8.1 including ... Getting Started ⁄ Terms of Use — Getting Started Automad is released under the MIT license and is free to use - for private websites as well as for commercial projects. Note that Automad takes the privacy of its users very serious and therefore only a very minimum of telemetry data is transmitted from time to time. At no point ... System ⁄ Updating Automad — System Keeping software up to date is always a good idea. Updating Automad takes only a couple of seconds. Initiating updates can be done via the dashboard or using the command line interface. System ⁄ Installing Packages — System Automad can be easily extended by installing custom packages. A package can be a theme or a PHP extension or a combination of both. The easiest way to install packages is to use the Packages section on the Automad dashboard. It also helps you to get an overview about available ...'
