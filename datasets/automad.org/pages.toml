["https://automad.org/developer-guide/building-themes/block-layouts"]
title = "Automad / Block Layouts"
description = "Aside from just stacking blocks on top of each other, Automad's block editor provides some handy features to create flexible layout directly in the block editor. It is possible to stretch a block to the full with of the parent container to make it stand out as well as to arrange blocks in a flexbox section. While the ..."
full_description = '''Block Layouts #Blocks #Layout #Theme Aside from just stacking blocks on top of each other, Automad's block editor provides some handy features to create flexible layout directly in the block editor. It is possible to stretch a block to the full with of the parent container to make it stand out as well as to arrange blocks in a flexbox section. While the heavy lifting is done by Automad's render engine in the background, templates and their styles have to be prepared in order to make the layout work as expected. Implementing Layouts Implementing layout support — stretching and flexbox sections — is very straight forward and requires the following two steps: The applied style sheet has to contain the following CSS cutom properties in order to configure the basic settings for the markup that is rendered by the block engine. :root { --am-block-max-width: 50rem; --am-block-margin-top: 2em; --am-container-padding: 2rem; --am-flex-gap: 2rem; --am-flex-min-block-width: 18rem; } The --am-block-max-width defines the maximum width of a block without being stretched. The auto-margins are applied automatically and therefore blocks are centered by default. The --am-block-margin-top defines the margin on top of a block that is not the first element. The --am-container-padding is very important and is needed to calculate the bleeding of stretched blocks and should just reflect the actual horizontal container padding of your theme. The last two properties --am-flex-gap and --am-flex-min-block-width control the default behavior of blocks within a flexbox section. The required CSS for the layout is added automatically to the header by the render engine as a separate file. There is no further action required. A full list of custom properties can be found here. The best results can be achieved when wrapping a block variable in a container element that has a certain given maximum width and some horizontal padding. <div class="some-container"> @{ +main } </div> The actual container class doesn't matter at all and is fully dependent on the CSS you use to style your theme. Aligning Other Elements The above paragraph describes how the layout of elements created by the blocks editor is handled. However, there might be additional elements on a page that have to be aligned with those centered blocks such as a headline or a tag list. All blocks have one specific class — the .am-block class — that controls their width and auto-margins. As mentioned above the required styles are added automatically by the render engine. Therefore you can simply add the .am-block class to any other element that is a direct child of the container that contains the block variable as follows: <div class="container"> <h1 class="am-block">@{ title }</h1> @{ +main } </div> Examples The following figure demonstrates what actually happens when blocks are stretched and how the behave in relation to their siblings. Note that any of the shown elements can be also part of the template markup. In other words, it is very much possible to mix generated blocks with other markup while keeping the layout tidy at the same time. .container max-width: 80rem; margin: auto; h1.am-block max-width: 50rem; margin: 2em auto; am-stretched p.am-block max-width: 100%; width: 100%; p.am-block max-width: 50rem; margin: 2em auto; The second figure shows some nested paragraphs in a flexbox section. Note that the captions represent the generated DOM selectors. h1.am-block am-stretched > am-section > am-flex am-1-3 > p.am-block am-2-3 > p.am-block am-1-2 > p.am-block am-1-2 > p.am-block p.am-block Related User Guide ⁄ Using Blocks — User Guide Blocks are little pieces of content like a text paragraph, a header, a gallery, a slideshow or many others. You can even add dynamic content like pagelists, filelists or custom snippets. The block editor provides an intuitive editing experience and enables users to freely compose ... Developer Guide ⁄ Building Themes — Developer Guide Themes are an essential part of a content management system. They define the way your content is presented to the visitors of your website. Automad's flexible and intuitive template language enables also inexperienced developers or beginners to create themes and templates on ... Building Themes ⁄ theme.json — Building Themes Every theme needs a theme.json to work. As mentioned before, all subdirectories of the packages directory containing a theme.json side by side with at least one template are to be considered as valid themes. Please see the list below for all required fields. Building Themes ⁄ Template Language — Building Themes Automad's template language provides a flexible and safe way to render content dynamically. In contrast to other generic template engines, the Automad core functions are integrated into the engine. That includes such things as image processing as well as a the access to an even ... Template Language ⁄ Variables — Template Language The actual value of a variable is depending on the current context. In most cases the context is the currently requested page. However, control structures can change the context to any other page during runtime, for example when iterating over a list of pages. In case a variable ... Building Themes ⁄ Customizing Blocks — Building Themes Most of the blocks only consist of pure HTML tags without classes and just inherit theme styles when being displayed. However the default styling of more complex blocks like the mail form or the gallery block might not be matching a theme out of the box. You can use CSS custom ... Building Themes ⁄ Plain PHP — Building Themes Automad supports plain PHP in template files. However, variables used in plain PHP blocks will not show up automatically in the dashboard and mixing PHP with Automad's template engine should be done carefully. Therefore it is not recommended to use plain PHP in normal templates. ... Developer Guide ⁄ Cheat Sheets — Developer Guide In case you prefer to start developing a theme or extension without reading the full documention, the cheat sheets below are a good point to start. In addition to this page there is also the theme skeleton package available to help you getting started. Cheat Sheets ⁄ Useful Template Snippets — Cheat Sheets Find below a collection of useful snippets for common tasks using Automad's template language. Cheat Sheets ⁄ Plain PHP Snippets — Cheat Sheets In case you want to develop a new extension or use PHP in your templates, the collection of common code snippets below might help you getting started quickly. Cheat Sheets ⁄ Creating Theme Packages — Cheat Sheets This guide describes step by step the workflow of setting up and publish a new theme. It assumes you're familiar with Visual Code Studio and working on a system with a Bash shell or similar — like macOS or Linux.'''
