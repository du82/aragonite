full_description = "Home We are passionate about making the web a better place. WordPress.com Your blog or website has a (free!) home on the web. Your story, your way. Beeper Tower of Babel fragmented messaging woes you need a Beeper. Tumblr Where your interests connect you to your people, one post at a time. Day One Capture private thoughts. Journal for posterity. All your days distilled. WooCommerce Selling online? Woo! Hang your digital shingle with this free plugin. Jetpack Safety, growth, and speed. The first and the best plugin your WordPress site needs. WP VIP Meta, Salesforce, Slack run the web with VIP: Enterprise WordPress. Pocket Casts Built by podcasters for your listening pleasure. Discover new shows. Akismet Did someone say spam? Akismet filters it out. Nothing to see here. Longreads Great storytelling, long enough to dig into. Find it and share it. Newspack Tools to publish great stories, drive revenue, and build your audience. Gravatar Global avatar— “Gravatar,” get it? One pic for all your profiles. We also contribute to a number of non-profit and Open Source projects, like: WordPress.org From many, one tool. Find strength in community for a better web. WP for iOS Updates on the go? Your site’s everywhere you are with the iPhone app. WP for Android Same goes for Android! No matter your devices, there’s an app for you. P2 Collaborating? Never send email again. This will change your life. BuddyPress Without connections, there’s no such thing as a web. Make your site social. bbPress Blogs sometimes restrain community discussion. Forums, the new black. WordCamps WordPress fans, unite! Come out from behind your screens, connect, and celebrate. WP Job Manager Need to make a hire? Put your site to work for you. Online job listings! Five for the Future When we give back time WordPress can change the whole world sooner and faster. We don’t make software for free, we make it for freedom. “We are much better at writing code than haiku.” — Matt Mullenweg, founder of Automattic Inspired by you. Striving to create good. Nothing* is perfect. * Including this."
