["https://automattic.com/2024/04/09/automattic-acquires-beeper"]
title = "The World’s Best Inbox Just Got Better – Automattic"
description = "Automattic welcomes Beeper to the family."
full_description = "Announcements Heat Up Your Brand’s Reach With Blaze Pro June 25, 2024 Automattic welcomes Beeper to the family. Company News Every Automattician Is Now an Owner of Automattic October 14, 2024 Automattic welcomes Beeper to the family. Announcements Automattic Welcomes Pedraum Pardehpoosh as VP of Product September 3, 2024 Automattic welcomes Beeper to the family. News/Announcements The World’s Best Inbox Just Got Better Automattic · January 14, 2025 Messaging today is a mess. We have endless chat apps on our phones, each with different contacts and notification settings, making it all too easy to accidentally ghost family and friends. That’s why we’re excited to announce today that Automattic has acquired Beeper, a universal messaging app that combines 14 different chat networks in one inbox. We began investing in messaging last year when we acquired Texts.com. Now, two of the most exciting teams in tech will work together to push the boundaries of messaging, giving us one app that will improve our focus and the way we communicate. Turning messaging from closed to open At Automattic, our core belief is that communication is a fundamental human right; it should be accessible, encrypted, and open source where possible. Merging Texts with Beeper is our next step toward the dream of combining all online conversations in a safe, secure, and effective way. Both teams have already built best-in-class messaging apps; now, we’re confident that by joining forces, they’ll bring even more people back to the promise of the open web. The best and only messaging app you’ll ever need Beeper has been a leader in simplifying chat apps with a focus on streamlined user experiences. As the teams go through organizational changes, Texts and Beeper will merge under the Beeper brand. But the good stuff you already loved isn’t changing! End-to-end encryption helps keep your conversations secure, and you’ll have access to well over a dozen app integrations, with even more to come. We’ll share another update when a phased plan is in place to fully merge the Texts app with Beeper. For now, keep enjoying both apps—and know that the future of open messaging just got even brighter. Beeper is now available for download on Android, iPhone/iPad, ChromeOS, macOS, Windows, and Linux. Visit beeper.com/download for more. Share this:Click to share on Tumblr (Opens in new window)Click to share on Mastodon (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on X (Opens in new window)Click to share on Threads (Opens in new window)Click to share on Bluesky (Opens in new window)Click to share on WhatsApp (Opens in new window)Like Loading... Related Share this Share this:Click to share on Tumblr (Opens in new window)Click to share on Mastodon (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on X (Opens in new window)Click to share on Threads (Opens in new window)Click to share on Bluesky (Opens in new window)Click to share on WhatsApp (Opens in new window) Like Loading... Tagged Business Communication Keep reading Announcements Heat Up Your Brand’s Reach With Blaze Pro June 25, 2024 Automattic welcomes Beeper to the family. Company News Every Automattician Is Now an Owner of Automattic October 14, 2024 Automattic welcomes Beeper to the family. Announcements Automattic Welcomes Pedraum Pardehpoosh as VP of Product September 3, 2024 Automattic welcomes Beeper to the family."
