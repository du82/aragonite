title = "Looking Ahead – Automattic"
description = "This week, Automattic undertook a strategic realignment to better pursue our core values and operational goals. In keeping with the transparency that has marked our longtime commitment to the open source community, we’re sharing here that we offered our employees a generous buy-out package. The offer underscores our dedication to mutual compatibility and respect within…"
full_description = "News/Company News Looking Ahead Automattic · January 14, 2025 This week, Automattic undertook a strategic realignment to better pursue our core values and operational goals. In keeping with the transparency that has marked our longtime commitment to the open source community, we’re sharing here that we offered our employees a generous buy-out package. The offer underscores our dedication to mutual compatibility and respect within our organization. It was designed to provide departing employees with a significant financial cushion ($30,000 or six months of salary, whichever is higher), and ensures that every Automattician’s career trajectory aligns with their personal and professional aspirations. While 159 people chose to accept the offer, 91.6% of employees chose to stay—and we’re excited for what we can all accomplish together. We remain deeply grateful to all our employees, past and present. For those who have chosen new paths, we sincerely wish them the best, and thank them for helping make Automattic what it is today. We emerge from this chapter with a renewed vigor and clarity in our mission. As always, Automattic continues to champion open source as a cornerstone of the digital ecosystem, and we look forward to sustaining and expanding these efforts with the dedication and passion that have always defined us. Share this:Click to share on Tumblr (Opens in new window)Click to share on Mastodon (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on X (Opens in new window)Click to share on Threads (Opens in new window)Click to share on Bluesky (Opens in new window)Click to share on WhatsApp (Opens in new window)Like Loading... Related Share this Share this:Click to share on Tumblr (Opens in new window)Click to share on Mastodon (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on X (Opens in new window)Click to share on Threads (Opens in new window)Click to share on Bluesky (Opens in new window)Click to share on WhatsApp (Opens in new window) Like Loading... Tagged automattic Communication"
