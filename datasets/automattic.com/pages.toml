full_description = "Collaborate with your team in Automattic for Agencies September 19, 2024 Simon Keating Feature Releases You asked, and we listened. The highly anticipated Teams feature is here, designed to help you collaborate more efficiently with your colleagues within the Automattic for Agencies program. Start building your team now Log into your Automattic for Agencies account and click on the ‘Team’ section in the left sidebar, or you can access it directly here. Click on the ‘Invite a team member’ button, and add the email address or WordPress.com username of the colleague you would like to invite. When an invite is accepted, you will be notified via email. The new team member’s status will be updated on the team members page, where you can track all your current team members and pending invitations. If your team members have already created individual accounts, choose one as your agency’s primary account. Then, invite the rest of your team to join the agency associated with that primary account. When they accept the invite, they will join your agency and will be required to dissociate themselves from any previously created agency accounts. If you have any questions or require support, see our Teams article on the Automattic for Agencies Knowledge Base or contact our dedicated support team, who are ready to help. If you’d like to learn more about the Automattic for Agencies program and how it can help you grow your agency business, check out our site. You can sign up for free in just a couple of minutes. Share this:Click to share on Tumblr (Opens in new window)Click to share on Mastodon (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on X (Opens in new window)Click to share on Threads (Opens in new window)Click to share on Bluesky (Opens in new window)Click to share on WhatsApp (Opens in new window)Like Loading... Related Simon Keating Simon has worked in marketing and product development for over 10 years, previously at HubSpot, Workday, and now Automattic. He has a varied education, with a degree in chemical engineering and a masters in computer science to his name. His passion is helping people and their businesses grow. Ready to join the program? Sign up now and become an Agency Partner. The Automattic for Agencies program is ready to help you boost your business. Join the program"
