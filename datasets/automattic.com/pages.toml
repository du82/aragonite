full_description = "Get Acquainted Home > Employee Field Guide > Howdy! > Get Acquainted Automattic company culture The Human League (HR) takes care of many things people-related at Automattic, including compensation, administration, health and wellness, and career guidance. They are a friendly bunch and are here to help you, so don’t be afraid to get in touch and introduce yourself. If you’re not sure about who your dedicated HR wrangler is, you can check in the left hand side of your team’s page on the Org Chart. WordPress We love WordPress quite a bit (although we are not the parent company of WordPress). Every year Matt gives the State of the Word address. It recaps the year in all things WordPress and talks about where things are headed. The Culture Buddy Program The Culture Buddy Program is designed to provide Newmatticians with insight into the culture of Automattic, along with guidance and help in acclimating to a distributed environment in general, and at Automattic in particular. You’ll be added to a small group of folks who are also new to Automattic, led by an experienced Automattician as your Culture Buddy. Keep an eye out for a Slack ping inviting you to your group! Next: Get Connected → Employee Field Guide First Day at AutomatticHowdy!Get AcquaintedGet ConnectedGet DressedGet Going, You’ve Got This!Get HappyGet OrganizedGet ScheduledGet SocialGet TerminologyGet Travelling"
