title = "Jobs at Automattic – Automattic"
description = "Jobs at Automattic Beware of job scammers We’ve recently learned that some people have been contacted by scammers pretending to be part of the Automattic hiring team, using names like “Caelia Bassett.” Please know that this individual is not connected to us. Our hiring process happens only through our official careers page: automattic.com/work-with-us. You’ll always receive messages from us using…"
full_description = "Jobs at Automattic Beware of job scammers We’ve recently learned that some people have been contacted by scammers pretending to be part of the Automattic hiring team, using names like “Caelia Bassett.” Please know that this individual is not connected to us. Our hiring process happens only through our official careers page: automattic.com/work-with-us. You’ll always receive messages from us using an @automattic.com email address. If someone reaches out claiming to be from Automattic but uses a different email domain, take a moment to verify their identity. Scams like these can look very real, so it’s always okay to double-check! Here’s a helpful guide offering more tips on how to spot and avoid scams. Stay safe out there, everyone!"
