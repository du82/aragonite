description = "https://www.youtube.com/watch?v=8Jq8kjolxzs Some people seek alternative sources of energy out of a sense of responsibility. Others do so because they have no choice. And in communities without access to electricity, nonprofit company Little Sun is helping transform lives: its portable solar-powered lamp allows people in off-grid areas to enjoy clean, affordable light.  The lamp charges during…"
full_description = "News/Customer Stories Powering the World, Powered by Automattic Automattic · February 18, 2025 Some people seek alternative sources of energy out of a sense of responsibility. Others do so because they have no choice. And in communities without access to electricity, nonprofit company Little Sun is helping transform lives: its portable solar-powered lamp allows people in off-grid areas to enjoy clean, affordable light. The lamp charges during the day and provides up to 50 hours of light, making it a game-changer for children studying after dark, healthcare workers providing evening care, and families going about their nightly routines. But Little Sun doesn’t just bring light to underserved areas; it also creates jobs and fosters economic growth. “On one hand, sustainability, and on the other hand, justice and equality,” says sales director Christian Van Wickeren. The company has long used Little Sun’s website to share its mission and vision, but when the time came to relaunch the sites for both its nonprofit work and its social business, Automattic presented them a cleaner way forward. Now, with a powerful integration of WordPress, Jetpack CRM, and WooCommerce, all seamlessly hosted on Pressable, everything Little Sun comes together in one easy-to-manage place—crucial for a small team like theirs. Small companies don’t mean small dreams, though. Little Sun aims to expand into 200 community energy hubs in Zambia over the coming years, powering farmers and supporting the global transition to net zero. You can be part of this journey at littlesun.org. Get started today Featured Products Jetpack Security, performance, and marketing tools made for WordPress sites by the WordPress experts.jetpack.com Pressable Fully managed from top to bottom, WordPress hosting that means business.pressable.com WooCommerce Our WordPress-based ecommerce platform helps merchants and developers build successful businesses for the long term.woocommerce.com Share this:Click