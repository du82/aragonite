title = "About Us – Automattic"
description = "All around the world, building a new web, and a new workplace. Join us! We are the people behind WordPress.com, Woo, Jetpack, WordPress VIP, Simplenote, Longreads, The Atavist, WPScan, Akismet, Gravatar, Crowdsignal, Cloudup, Tumblr, Day One, Pocket Casts, Newspack, Beeper, and more. We believe in making the web a better place. We’re a distributed company…"
full_description = "About Us All around the world, building a new web, and a new workplace. Join us! We are the people behind WordPress.com, Woo, Jetpack, WordPress VIP, Simplenote, Longreads, The Atavist, WPScan, Akismet, Gravatar, Crowdsignal, Cloudup, Tumblr, Day One, Pocket Casts, Newspack, Beeper, and more. We believe in making the web a better place. We’re a distributed company with 1,771 Automatticians in 90 countries speaking 116 different languages. We’re committed to diversity, equity, and inclusion, and our common goal is to democratize publishing and commerce so that anyone with a story can tell it, and anyone with a product can sell it, regardless of income, gender, politics, language, or where they live in the world. We believe in Open Source and the vast majority of our work is available under the GPL. We strive to live by the Automattic Creed. Automattic is a Most Loved Company and Disability Confident Committed. (Here’s what that might mean for you.) Come work with us. We Iterate 1,194 Deployments made this week view graph Deploys by day in the past week We Communicate 513,394 Messages sent this week view details How we communicate Slack Messages: 497,084 P2 Posts: 4,835 P2 Comments: 11,475 We Make People Happy 21,161 Support interactions this week view graph Support interactions by day The Team We call ourselves Automatticians Where We Are (embiggen)"
