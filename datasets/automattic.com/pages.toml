title = "Library – Automattic"
description = "There are many books that have been hugely influential in building and evolving Automattic, and we want to share them here. We surveyed our leads on the top books they recommend, here's the ranking by number of votes: The Effective Executive by Peter Drucker Quiet: The Power of Introverts in a World that Can't Stop…"
full_description = "Library There are many books that have been hugely influential in building and evolving Automattic, and we want to share them here. We surveyed our leads on the top books they recommend, here’s the ranking by number of votes: The Effective Executive by Peter Drucker Quiet: The Power of Introverts in a World that Can’t Stop Talking by Susan Cain Drive by Daniel Pink The Five Dysfunctions of a Team by Patrick Lencioni Crucial Conversations: Tools for Talking When Stakes Are High by Kerry Patterson, Joseph Grenny, and Ron McMillan Deep Work by Cal Newport Radical Candor by Kim Scott Orbiting the Giant Hairball: A Corporate Fool’s Guide to Surviving with Grace by Gordon MacKenzie Daring Greatly by Brene Brown How to Win Friends and Influence People by Dale Carnegie Leadership & Self-Deception: Getting out of the box by Arbinger Institute The Elements of Style by Strunk & White The Power of Habit by Charles Duhigg The Life Changing Magic of Tidying Up by Marie Kondo The 7 Habits of Highly Effective People by Stephen Covey The Manager’s Path: A Guide for Tech Leaders Navigating Growth and Change by Camille Fournier Thanks for the Feedback: The Science and Art of Receiving Feedback Well by Douglas Stone and Shelia Heen The Coaching Habit: Say Less, Ask More & Change the Way You Lead Forever by Michael Bungay Stanier Words that Work by Frank Luntz Reinventing Organizations by Frederic Laloux Start with Why by Simon Sinek High Output Management by Andrew Grove The Score Takes Care of Itself by Bill Walsh Turn the Ship Around! by David Marquet When Teams Work Best by Frank LaFasto and Carl Larson Gamestorming: A Playbook for Innovators, Rulebreakers, and Changemakers by Gray, Dave, Brown, Sunni, and James Macanufo Little Red Book of Selling by Jeffrey Gitomer What Got You Here Won’t Get You There by Marshall Goldsmith and Mark Reiter Lincoln on Leadership by Donald Phillips Spark : How to Lead Yourself and Others to Greater Success by Angie Morgan, Courtney Lynch, and Sean Lynch Meditations by Marcus Aurelius All the HBR 10 Must Reads by Leadership: Theory and Practice by Peter Northouse Redesigning Leadership by John Maeda and Rebecca Bermont A Curious Mind , The Secret to a Bigger Life by Brian Grazer Product Leadership by Richard Banfield, Nate Walkingshaw, and Martin Erikkson The Progress Principle by Teresa Amabile, and Steven Kramer The Rhythm of Life by Matthew Kelly Management 3.0 by Jurgen Appelo Design for Real Life by Sara Wachter-Boettcher and Eric Meyer Getting Things Done by David Allen The First 90 Days by Michael Watkins Making Space: How the Brain knows where things are by Jennifer M. Groh Read This Before our Next Meeting by Al Pittampalli Projects Without Boundaries by Martinelli, Russ et al Managing Humans by Michael Lopp Leading Change by John P. Kotter Recommendations from Automattic’s bespoke Reboot leadership training: The Fifth Discipline by Peter M. Senge Time to Think by Nancy Kline The Fearless Organization by Amy C. Edmondson Reboot: Leadership and the Art of Growing Up by Jerry Colonna Difficult Conversations by Douglas Stone, Bruce Patton and Sheila Heen Your Brain at Work by David Rock Dialogue: The Art Of Thinking Together by William Isaacs The First Minute by Chris Fenning Essentialism: The Disciplined Pursuit of Less by Greg Mckeown Conscious Business by Fred Kofman Transitions: Making Sense of Life’s Changes by William Bridges Further reading: John Maeda’s book list (former Design Lead at Automattic) Excerpts from The Prophet Excerpts from The Four Agreements If you’re an Automattician, we are happy to promote your professional development by paying for any book that promotes continuous learning. Interested? Come work with us!"
