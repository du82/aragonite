["https://automattic.com/de/privacy"]
title = "Datenschutzerklärung – Automattic"
description = "Der Schutz deiner personenbezogenen Daten hat für uns einen hohen Stellenwert. Wir bei Automattic haben einige grundlegende Prinzipien: Wir überlegen uns genau, um welche personenbezogenen Informationen wir dich bitten, und welche personenbezogenen Informationen wir über dich im Rahmen des Betriebs unserer Dienste erfassen. Wir speichern personenbezogene Daten nur so lange, wie es nötig ist. Wir…"
full_description = "Datenschutzerklärung Der Schutz deiner personenbezogenen Daten hat für uns einen hohen Stellenwert. Wir bei Automattic haben einige grundlegende Prinzipien: Wir überlegen uns genau, um welche personenbezogenen Informationen wir dich bitten, und welche personenbezogenen Informationen wir über dich im Rahmen des Betriebs unserer Dienste erfassen. Wir speichern personenbezogene Daten nur so lange, wie es nötig ist. Wir möchten es dir so einfach wie möglich machen zu steuern, welche Informationen auf deiner Website öffentlich geteilt (oder nicht), von Suchmaschinen indiziert und dauerhaft gelöscht werden. Wir helfen dir, dich davor zu schützen, staatliche Anforderungen im Hinblick auf deine personenbezogenen Informationen überzuerfüllen. Unser Ziel ist es, die Erfassung, Verwendung und Weitergabe deiner personenbezogenen Informationen vollständig transparent zu machen. Unten findest du unsere Datenschutzerklärung, in der diese Prinzipien verkörpert und verdeutlicht werden. Wer wir sind und worauf sich diese Erklärung bezieht Hallo! Wir sind diejenigen, die hinter den zahlreichen Produkten und Diensten stehen, die jedem – von Bloggern über Fotografen bis hin zu Kleinunternehmern und Konzernen – erlauben, von den Vorteilen und dem Versprechen des offenen Internets zu profitieren. Unser Ziel ist, das Veröffentlichen von Inhalten zu ermöglichen, damit jeder, der etwas zu erzählen hat, seine Geschichte mit anderen teilen und mit seinen tollen Ideen seinen Lebensunterhalt verdienen kann. Wir setzen uns für ein offenes Internet mit Open-Source-Code ein und können mit Stolz sagen, dass der Großteil unserer Arbeit unter der GPL (General Public License) verfügbar ist. Da unser GPL-Code öffentlich ist, kannst du dir diesen Code herunterladen und ansehen, um zu verstehen, wie er funktioniert. Bei den meisten anderen Diensten ist das nicht der Fall. Diese Datenschutzerklärung bezieht sich auf Informationen, die wir über dich sammeln, wenn du Folgendes verwendest: Unsere Websites (darunter automattic.com, wordpress.com, jetpack.com, woocommerce.com, crowdsignal.com, gravatar.com, intensedebate.com, vaultpress.com, akismet.com, simplenote.com, simperium.com, leandomainsearch.com, cloudup.com, longreads.com, atavist.com, mailpoet.com, automatewoo.com, jetpackcrm.com, happy.tools, wpcourses.com, wpscan.com, newspack.pub und wp.cloud); Unsere mobilen Anwendungen (einschließlich der mobilen WordPress-App für Android und iOS); Unsere anderen Automattic-Produkte, -Dienste und -Funktionen, die auf oder über unsere(n) Websites verfügbar sind (z. B. WordPress.com-Tarife, die Zahlungsfunktion, der „Bezahlen mit PayPal“-Block, Jetpack, die Woo-Erweiterung Shipping & Tax, Gravatar, das IntenseDebate-Kommentarverwaltungssystem, Akismet-Tarife, Simplenote, Simperium, Cloudup, Longreads, MailPoet, AutomateWoo, Jetpack CRM, Happy Tools, WordPress.com-Kurse, WPScan und Newspack); und Websites anderer Benutzer, die unsere Dienste verwenden, während du in deinem Konto bei uns angemeldet bist. Diese Datenschutzerklärung gilt auch für Informationen, die wir sammeln, wenn du dich auf eine Stelle bei Automattic oder einem unserer Tochterunternehmen bewirbst. In dieser Datenschutzerklärung werden unsere Websites, mobilen Anwendungen und sonstigen Produkte durchgehend unter dem Oberbegriff „Dienste“ zusammengefasst. Weitere Informationen dazu, welches Automattic-Unternehmen der Verantwortliche für Informationen über dich ist, findest du unten im Abschnitt zu Verantwortlichen und verantwortlichen Unternehmen. Beachte bitte, dass diese Datenschutzerklärung für keine Produkte oder Dienste von uns wie Tumblr gilt, für die es eine eigene Datenschutzerklärung gibt. Im Folgenden wird erklärt, wie Informationen über dich erfasst, verwendet und weitergegeben werden, und es werden die Entscheidungen erläutert, die du in Bezug auf diese Informationen treffen kannst. Creative Commons-Weitergabe unter gleichen Bedingungen-Lizenz Wir haben uns dazu entschieden, diese Datenschutzerklärung unter einer Creative Commons-Weitergabe unter gleichen Bedingungen-Lizenz zur Verfügung zu stellen. Auf GitHub kannst du diese Datenschutzerklärung und andere Rechtsdokumente herunterladen. Du kannst sie gerne kopieren, ändern und für deine eigenen Zwecke anpassen. Achte nur darauf, den Text so anzupassen, dass deine Erklärung deine tatsächlichen Praktiken widerspiegelt. Wenn du sie verwendest, würden wir uns außerdem freuen, wenn du irgendwo auf deiner Website einen Verweis auf Automattic und einen entsprechenden Link einfügst. Informationen, die von uns erfasst werden Wir sammeln nur Informationen über dich, wenn wir einen Grund dazu haben, etwa um unsere Dienste bereitzustellen, mit dir zu kommunizieren oder unsere Dienste zu verbessern. Wir erfassen diese Informationen aus drei Quellen: falls und wenn du uns Informationen lieferst, automatisch im Rahmen des Betriebs unserer Dienste und von externen Quellen. Sehen wir uns die Informationen, die wir sammeln, genauer an. Informationen, die du uns lieferst Es überrascht wahrscheinlich nicht, dass wir Informationen sammeln, die du uns direkt lieferst. Hier einige Beispiele: Grundlegende Kontoinformationen: Wir bitten dich um grundlegende Informationen, um dein Konto einzurichten. So fordern wir z. B. Personen, die sich für ein WordPress.com-Konto registrieren, auf, eine E-Mail-Adresse und ein Passwort sowie einen Benutzernamen oder Namen anzugeben. Das ist alles. Du machst vielleicht weitere Angaben und teilst uns etwa deine Adresse und andere Informationen mit, die du teilen willst – aber wir benötigen diese Informationen nicht, um ein WordPress.com-Konto zu erstellen. Öffentliche Profilinformation: Wenn du ein Konto bei uns hast, erfassen wir die Informationen, die du für dein öffentliches Profil angibst. Wenn du z. B. ein WordPress.com-Konto hast, ist dein Benutzername Teil dieses öffentlichen Profils, zusammen mit anderen Informationen, die du möglicherweise in deinem öffentlichen Profil hinterlegt hast, wie z. B. ein Foto oder eine „Über mich“-Beschreibung. Deine öffentlichen Profilinformationen sind, wie der Name schon sagt, öffentlich. Vergiss dies nicht, wenn du entscheidest, welche Informationen du angeben willst. Zahlungs- und Kontaktinformationen: Du kannst uns auf verschiedenen Wegen Zahlungs- und damit verbundene Kontaktinformationen zur Verfügung stellen. Zum Beispiel: Wenn du etwas bei uns kaufst oder mit deiner Website Geld verdienst, erfassen wir Informationen, um diese Zahlungen zu verarbeiten und mit dir Kontakt aufzunehmen. Wenn du etwas bei uns kaufst, z. B. ein Abonnement für einen WordPress.com-Tarif, ein Premium-Theme, eine individuelle Domain oder einen Longreads-Swag, oder wenn du einer Person oder einem Unternehmen über deren WordPress.com-Website eine Gebühr bezahlst (z. B. über die Zahlungsfunktion oder den „Bezahlen mit PayPal“-Block), gibst du zusätzliche personenbezogene Daten und Zahlungsinformationen an. Dazu zählen dein Name, deine Kreditkarteninformationen und deine Kontaktdaten. Wir führen auch Aufzeichnungen über deine Käufe. Wenn du unsere E-Commerce-Dienste verwendest (einschließlich Shops auf WordPress.com, Woo Shipping & Tax und WooPayments), musst du ein WordPress.com-Konto erstellen oder ein bestehendes Konto verknüpfen und – bei einigen Diensten – die URL deiner Website angeben. Du stellst uns möglicherweise auch Kontoangaben zur Verfügung, um eine Zahlungsintegration einzurichten. Dazu können die E-Mail-Adresse für dein Stripe- oder PayPal-Konto oder deine Bankkontodaten zählen. Falls du WooPay nutzt, um Einkäufe auf anderen Websites zu tätigen, speichern wir außerdem deine Kontakt- und Zahlungsinformationen, um diesen Dienst anbieten zu können. Wenn du an einem Revenue-Sharing-Modell für deine Website wie WordAds teilnimmst, stellst du zusätzliche Angaben zur Verfügung. Dazu zählen eine Steuernummer oder andere identifizierende Informationen, damit wir Zahlungen an dich verarbeiten können. Unternehmensprofil: Einige unserer Produkte erfassen für die Erstellung eines Benutzer/Kundenprofils zusätzliche Informationen über dich. Wenn du beispielsweise Jetpack CRM-Kunde bist, fügen wir dich mit den von dir angegebenen Informationen wie deinem Namen, Arbeitgeber, Jobtitel oder deiner Rolle sowie deine Kontaktdaten und Kommunikation mit uns zu unserer (von Jetpack CRM betriebenen) Customer-Relationship-Datenbank hinzu. Wenn du Happy Tools-Benutzer bist, verwenden wir von dir angegebene Informationen wie deine Zeitzone, deinen Standort und deine Kontaktdaten sowie Informationen zu deinem Unternehmen und Team, um dein Konto einzurichten und die Funktionen des Dienstes zu ermöglichen. Informationen über Inhalte: Möglicherweise stellst du uns in Entwürfen und veröffentlichten Inhalten Informationen über dich zur Verfügung (in einem Blogbeitrag oder Kommentar, der biografische Informationen über dich enthält, oder in Medien oder Dateien, die du hochlädst). Anmeldedaten: Je nachdem, welche Dienste du verwendest, lieferst du uns möglicherweise Anmeldedaten für deine selbst gehostete Website (wie Benutzername und Passwort für SSH, FTP und SFTP). Jetpack- und VaultPress-Benutzer liefern uns möglicherweise diese Anmeldedaten, um unsere Wiederherstellungsfunktion mit nur einem Klick zu verwenden, wenn sie ein Problem mit ihrer Website haben, oder um uns zu erlauben, Probleme schneller zu beheben. Kommunikation mit uns (Hallo!): Du lieferst uns möglicherweise auch Informationen, wenn du an unseren Umfragen teilnimmst, mit unseren Support-Mitarbeitern über eine Supportfrage sprichst, eine Frage in unseren öffentlichen Foren veröffentlichst oder dich für einen Newsletter anmeldest, wie z. B. für den, den wir über Longreads senden. Wenn du mit uns über Formulare, E-Mail, Telefon, WordPress.com-Kommentare oder auf anderem Wege kommunizierst, speichern wir eine Kopie unserer Unterhaltung (einschließlich aller Anrufaufzeichnungen, soweit gesetzlich zulässig). Informationen von Stellenbewerbern: Du bewirbst dich auf eine Stelle bei uns. Das ist toll! Im Rahmen des Bewerbungsverfahrens stellst du uns möglicherweise Informationen wie deinen Namen, deine Kontaktdaten, deinen Lebenslauf, berufliche oder persönliche Referenzen, ähnliche berufliche oder stellenbezogene Daten und eine Bestätigung deiner Arbeitserlaubnis zur Verfügung. Wir erfassen im Rahmen der Bewerbersuche möglicherweise auch zusätzliche Informationen wie z. B. Hintergrund- und Bonitätsprüfungen der Bewerber (in bestimmten Ländern und nur für bestimmte Stellen). Du wirst uns ggf. auch demografische Informationen zur Verfügung stellen, wenn dies gesetzlich vorgeschrieben ist oder der Unterstützung unserer Initiativen zur Förderung von Vielfalt am Arbeitsplatz dient. Dies kann Merkmale wie Geschlecht, Rasse, ethnische Zugehörigkeit, Veteranenstatus oder Behinderung umfassen, vorausgesetzt, dass du diese Informationen freiwillig als Teil deiner Bewerbung angibst. Wir erfassen demografische Daten in Übereinstimmung mit geltendem Recht und fordern keine demografischen Daten in Ländern an, in denen dies verboten ist. Wir werden diese sensiblen Informationen nur verwenden, um Behinderung oder Krankheit zu berücksichtigen, gesetzliche Verpflichtungen zu erfüllen, die Gesundheit und Sicherheit unserer Mitarbeiter zu schützen und unsere internen Programme in Bezug auf Vielfalt, Integration und Antidiskriminierung zu fördern. Informationen, die von uns automatisch erfasst werden Außerdem werden einige Informationen automatisch erfasst: Protokollinformationen: Wie die meisten Onlinedienstanbieter sammeln wir Informationen, die normalerweise von Webbrowsern, Mobilgeräten und Servern zur Verfügung gestellt werden. Dazu zählen Browsertyp, IP-Adresse, eindeutige Geräte-IDs, Spracheinstellung, verweisende Website, Datum und Uhrzeit des Aufrufs, Betriebssystem und Informationen zum Mobilnetzwerk. Wir sammeln Protokollinformationen, wenn du unsere Dienste verwendest, z. B. wenn du deine Website auf WordPress.com erstellst oder Änderungen daran vornimmst. Transaktionsinformationen: Wenn du über unsere Dienste einen Kauf tätigst, sammeln wir Informationen über die Transaktion, darunter Produktdetails, Kaufpreis sowie Datum und Ort der Transaktion. Dies gilt sowohl für Käufe von unseren angebotenen Produkten und Diensten als auch, wenn du unsere Dienste (wie WooPay) nutzt, um etwas von einem Drittanbieter zu kaufen. Nutzungsinformationen: Wir sammeln Informationen über die Nutzung unserer Dienste. So sammeln wir z. B. Informationen über die Aktionen, die Website-Administratoren und Benutzer auf einer Website durchführen, die unsere WordPress.com- oder Jetpack-Dienste verwendet. Mit anderen Worten: Wir erfassen, wer was wann gemacht hat (z. B. [WordPress.com-Benutzername] hat „[Beitragstitel]“ um [Uhrzeit/Datum] gelöscht). Unsere WooCommerce-Nutzungsverfolgung zeichnet auch Informationen wie deine E-Mail-Adresse, WooCommerce-Einstellungen und PHP-Einstellungen sowie Informationen über deinen Onlineshop wie die Gesamtzahl der Bestellungen und Kunden auf. Wir sammeln auch Informationen darüber, was geschieht, wenn du unsere Dienste verwendest (z. B. Seitenaufrufe, Suchen in Supportdokumenten auf de.support.wordpress.com, für deine Website aktivierte Funktionen, Interaktionen mit unserer Adminleiste und anderen Teilen unserer Dienste) sowie Informationen über dein Gerät (z. B. Bildschirmgröße, Name des Funknetzwerks und Mobilgerätehersteller). Wir verwenden diese Informationen etwa dazu, um dir unsere Dienste bereitzustellen, Einsichten darüber zu erhalten, wie unsere Dienste genutzt werden, damit wir unsere Dienste verbessern können, und um die Benutzerbindung besser zu verstehen und entsprechende Vorhersagen treffen zu können. Standortinformationen: Wir können anhand deiner IP-Adresse den ungefähren Standort deines Geräts ermitteln. Wir sammeln und verwenden diese Informationen z. B., um zu berechnen, wie viele Personen unsere Dienste in bestimmten geografischen Regionen besuchen. Eventuell sammeln wir über unsere Mobil-Apps auch Informationen über den genauen Standort (z. B. wenn du ein Foto mit Standortinformationen veröffentlichst). Voraussetzung dafür ist, dass du uns dies über die Berechtigungen des Betriebssystems deines Mobilgeräts erlaubst. Gespeicherte Informationen: Wir greifen über unsere Mobil-Apps möglicherweise auf Informationen zu, die auf deinem Mobilgerät gespeichert sind. Wir greifen auf diese gespeicherten Informationen über die Berechtigungen des Betriebssystems deines Geräts zu. Wenn du uns z. B. erlaubst, auf die Fotos in der Camera Roll deines Mobilgeräts zuzugreifen, greifen unsere Dienste möglicherweise auf die auf deinem Gerät gespeicherten Fotos zu, wenn du ein wirklich tolles Foto vom Sonnenaufgang auf deine Website hochlädst. Interaktionen mit Websites anderer Benutzer: Wir sammeln Informationen über deine Interaktionen mit Websites anderer Benutzer, während du bei deinem Konto bei uns angemeldet bist. Dabei kann es sich z. B. um deine „Likes“ und "
