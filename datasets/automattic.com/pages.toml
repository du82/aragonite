["https://automattic.com/for-agencies/blog/wordpress-security-checklist"]
title = "28-Step WordPress Security Checklist for Website Managers & Agencies – Automattic"
description = """
Pablo Postigo
\t\t\t\t\t\t\t\tPablo is a web enthusiast who has been using WordPress since 2008. 

He is currently part of the Growth & Strategy team in Automattic. Before joining Automattic, he was the co-founder & CEO of Frontity, the best framework to build React frontends for WordPress."""
full_description = "28-Step WordPress Security Checklist for Website Managers & Agencies September 30, 2024 Pablo Postigo Performance & Security Although WordPress is very secure, it can be subject to vulnerabilities just like anything else. Hackers can try to exploit these weaknesses to distribute malware and steal sensitive data. If a site’s server isn’t configured properly, or the custom code and plugins used aren’t well-maintained, they’re more likely to gain access to the website. There are various ways to secure a website and prevent online attacks. It starts simple, with choosing a secure hosting provider like Pressable and regularly updating software. But agencies and developers will also want to consider more advanced measures like implementing security headers and disabling PHP reports. In this post, we’ll look at 28 steps to secure a WordPress site. We’ll also introduce you to an incredible program, just for agencies, that makes for happier clients and higher profits. We’ve organized the checklist into six categories: Hosting environment User authentication and access WordPress core security Plugins and themes Advanced WordPress hardening Additional checklist items for WordPress agencies Let’s get to it! Hosting environment To kickstart this WordPress security checklist, let’s first take a look at some key measures to secure your hosting environment. 1. Choose a secure hosting provider Web hosts store your site and make your content publicly accessible. Therefore, you’ll want to choose companies that take preventative measures to protect your server from cyber threats. For instance, they should provide web application firewalls (WAFs) and network monitoring. Some providers also offer malware detection or distributed denial of service (DDoS) protection. You’ll also want to prioritize companies that include regular backups in their plans. This way, if something does go wrong, you’ll have a recent copy of the site that you can restore. WordPress.com offers essential security features including real-time backups, malware scanning, DDoS and WAF protection, and more. It also gives you access to a staging environment, where you can carry out updates safely. Plus, you’ll get expert support. Alternatively, Pressable offers fully-managed WordPress plans with an impressive 100 percent uptime guarantee and superior support. You’ll also get real-time backups with one-click restores, built-in two-factor authentication, DDoS and WAF protection, and more. Both WordPress.com and Pressable are built on top of WP Cloud — Automattic’s hosting platform. This provides the ultimate environment for security, performance, and management. 2. Ensure server software is up-to-date WordPress is predominantly built on PHP, but it also uses HTML, CSS, and JavaScript. And beyond the WordPress core software, you also have plugins and themes to think about. As you may already know, updates come with new features and functionality. But they often include bug fixes and patches for known vulnerabilities. Therefore, you’ll want to regularly check your site for updates. You’ll find these in Dashboard → Updates, although you’ll usually see a notification when updates are available. It’s also a good idea to enable auto-updates, which you can do from the Plugins page. Additionally, you’ll want to make sure that you’re running the latest versions of PHP. WordPress recommends that you use PHP 7.4 or greater. You can check this by going to Tools → Site Health. Then, switch to the Info tab and expand the Server section. WordPress websites store information in a MySQL database. This should use version 8.0 of MySQL or later. You can check this by following the steps above but expanding the Database tab instead. If your web host doesn’t support the latest versions, you might want to switch to a different hosting provider. 3. Ensure that SSL encryption (HTTPS) is enabled Lots of data gets exchanged between browsers and servers, including credit card details and personal information like passwords. Malicious actors may conduct man-in-the-middle (MITM) attacks to steal this data. You can install an SSL certificate and use a HTTPS connection to encrypt this sensitive information. The data will be replaced with random strings of numbers and letters, making it unreadable if hackers do succeed in accessing it. Beyond security purposes, Google also favors websites that use HTTPS instead of HTTP. You’ll know if you’re using HTTPS if you open your website in a browser and see a lock icon beside the domain. The domain should also be preceded by “https” rather than “http”. If you don’t have an SSL certificate, you’ll need to purchase one from a valid certificate authority (CA). That said, you’ll often find that many web hosting companies offer free and auto-SSL certification. 4. Disable directory indexing Directory indexing is a server feature that plays an important role in how your website functions. If the server can’t find a file in the directory, it will either return an error or display the contents of the directory. But this means that anyone can see what’s inside your directory, which makes it easier for malicious users to access sensitive information like personal details or configuration files. Therefore, it’s best to disable directory indexing to safeguard this data. Most WordPress sites are set up with an Apache configuration. In this instance, you’ll need to access the .htaccess file via SFTP. Once inside the file, add the line: Options -Indexes to stop the server from listing your directory contents. User authentication and access Next in this WordPress security checklist, we’ll explore key measures that involve user authentication and access. 5. Enforce strong username and password policies It’s very important to use and enforce strong passwords across your site. They should contain a mix of uppercase and lowercase letters, numbers, and special characters. Even then, passwords can still be cracked instantly if they’re fewer than seven characters. Therefore, it’s best to prioritize long passwords. But, you also need to ensure that every user on your site sets strong passwords and usernames. You’ll find that many general-purpose security plugins come with the ability to define a minimum password strength. There are also dedicated solutions including Password Policy Manager. If you have a multi-author site, it can be useful to educate contributors about password security. 6. Require 2FA for all user accounts Even with strong usernames and passwords, your website can still be susceptible to a brute- force attack. This occurs when hackers guess different combinations of credentials until they gain unauthorized access to your site. Therefore, you’ll need to add a layer of security to the login process. With two-factor authentication, users have to supply extra verification (besides a password). Usually, this is a code generated in real time and sent to the user’s mobile device or email. Some companies also use authenticator apps. 7. Implement role-based access control Role-based access control is a key part of any good WordPress security checklist. It enables you to provide different users with different privileges, reducing the number of people who have more (or full) control over a site. WordPress comes with a handful of default user roles including subscribers, authors, editors, and administrators. You’ll also find that some plugins create additional roles. For example, if you use WooCommerce, you’ll have new roles like customers and store managers. Every role corresponds to a different set of permissions. A subscriber has the fewest permissions. All they’re able to do is edit their own profiles, read posts, and leave comments. At the other end of the spectrum is the administrator role. This grants full access to the site. As a general rule of thumb, there should only be one admin per site. This way, even if a hacker manages to crack a user’s password and access a site, the damage can be contained. If a hacker gets hold of an admin account, they could wreak havoc on your site. But if they break into a subscriber account, there isn’t much damage they could do. Administrators for a site can change user roles by going to Users → All Users. Then, clicking on a specific user account and scrolling down to the Roles section. Here, the administrator should check the box beside the roles to modify access. 8. Review and remove inactive user accounts If you have loads of user accounts on a site, it gives hackers more opportunities to break into it. Therefore, it’s good practice to regularly review user accounts in the WordPress dashboard. If you find old accounts from previous employees or contributors, it’s best to delete them. You might also like to remove inactive accounts with suspicious activity. The way to identify inactive accounts depends on the website type and size. For instance, if you manage an ecommerce site, it might seem strange if a user sets up an account but never purchases a product. 9. Limit the number of login attempts As mentioned earlier, brute force attacks occur when hackers trial hundreds of password and username combinations until they gain access. A great way to reduce the potential harm from these attacks is to limit the number of login attempts. For instance, users may get three chances to log into their accounts successfully. After that, they’ll have to wait 15 minutes before they can try again. There are several WordPress security plugins that provide this functionality. For instance, Limit Login Attempts Reloaded comes with customizable lockout times and lockout email notifications. WordPress core security Next up, let’s take a look at some essential steps to secure WordPress core software. 10. Ensure that WordPress core is up to date Earlier, we talked about the importance of keeping software up-to-date to make it more resilient to security threats. New software tends to be less susceptible to hacks, partly because it’s just been released so hackers haven’t identified backdoors and vulnerabilities yet. Additionally, many updates come with security enhancements. For example, WordPress 6.6.1 featured seven bug fixes in WordPress core and nine in the block editor. If you’re not sure whether you’re running the latest version of WordPress, go to Tools → Site Health → Info and expand the WordPress tab. Or, you can head to Dashboard → Updates to see if a new version of WordPress is available to install. If there is, it’s important to take some precautions to update your site safely. First off, you’ll want to make a fresh backup. That way, if you encounter an error, you can restore an up-to-date version of your site. Additionally, it’s a good idea to test the update in a staging environment before you deploy it on your live site. 11. Change the default “admin” username Another great way to secure your WordPress site is to choose a custom name for your WordPress admin account. By default, WordPress sets “admin” as the username. But this makes it easier for hackers to access your site since they only have to guess the password. To do this, you’ll have to access the WordPress database via cPanel. Here, locate the wp_users table and find your admin username on the list. Click on the Edit button and insert new values where “admin” is displayed. At the very least, you’ll need to change the user_login field to change the username. But it’s also best to edit the user_nicename and display_name. When you’re done, remember to save the changes before exiting phpMyAdmin. 12. Change the default database prefix The WordPress database is a prime target for hackers since it contains every piece of information about your site. Plus, WordPress uses the default “wp_” database prefix which makes it easier for hackers to launch mass attacks. The good news is that you can change the prefix. To do this, connect to your site using SFTP and open the wp-config.php file. Look out for the line that reads: $table_prefix = “wp_”; You can change this value to anything you want or you might simply follow up the default prefix with additional letters or numbers. Next, you’ll need to access phpMyAdmin via your cPanel dashboard. Here, the goal is to change the prefix of the default WordPress tables, but doing this manually takes some time. Click on the SQL tab at the top, then enter the following SQL query: RENAME table `wp_commentmeta` TO `wp_a123456_commentmeta`; RENAME table `wp_comments` TO `wp_a123456_comments`; RENAME table `wp_links` TO `wp_a123456_links`; RENAME table `wp_options` TO `wp_a123456_options`; RENAME table `wp_postmeta` TO `wp_a123456_postmeta`; RENAME table `wp_posts` TO `wp_a123456_posts`; RENAME table `wp_terms` TO `wp_a123456_terms`; RENAME table `wp_termmeta` TO `wp_a123456_termmeta`; RENAME table `wp_term_relationships` TO `wp_a123456_term_relationships`; RENAME table `wp_term_taxonomy` TO `wp_a123456_term_taxonomy`; RENAME table `wp_usermeta` TO `wp_a123456_usermeta`; RENAME table `wp_users` TO `wp_a123456_users`; Remember to change the prefix to the new one you applied in the wp-config.php file. 13. Change the default /wp-admin and /wp-login.php URLs Another potential WordPress vulnerability is that it labels the login pages the same for every website. Usually, it’s your domain followed by either “wp-login” or “wp-admin”. This makes it easy for hackers to find your login page and try to access your site. Therefore, you can improve WordPress security by choosing a custom login URL that’s hidden from untrusted sources. To do this, you can use a free plugin like WPS Hide Login. But if you don’t want to rely on a plugin, you’ll need to access the wp-login.php file via SFTP. It’s best to download a copy of this file to your computer and use a text editor with a search-and-replace function to identify every instance of “wp-login.php”. Then, you can change this value to your desired login URL. Save the changes and rename the file to whatever you’ve chosen as your desired login URL. Then, you can upload the file back to the WordPress root directory using SFTP. 14. Disable file editing to prevent malicious changes By default, WordPress gives admin users access to plugin file editors and theme file editors. This poses a huge problem if hackers manage to gain access to your account where they might modify theme and plugin files, or inject malicious code into your site. To disable file editing in the WordPress dashboard, you’ll need to connect to your site using SFTP and open the wp-config.php file. Above the final line of the file, add the following code: define(‘DISALLOW_FILE_EDIT’,true); Make sure to save the file. Then, log into the WordPress dashboard and check to see if it worked. Go to Appearance → Editor and Plugins → Editor. These tools shouldn’t be available anymore, even with the admin account. 15. Disable WordPress version disclosure Leaving your WordPress version number visible can make your site an easier target for hackers. It enables them to exploit vulnerab"
