full_description = "Press We’re happy to answer your questions about Automattic, or about any of our products. Drop us a line or sign up to receive news updates. Fact Sheet Automattic wants to make the web a better place. Our family includes WordPress.com, Woo, Jetpack, WordPress VIP, Simplenote, Longreads, The Atavist, WPScan, Akismet, Gravatar, Crowdsignal, Cloudup, Tumblr, Day One, Pocket Casts, Newspack, Beeper, and more. With WordPress.com, you can create beautiful websites and blogs for free and enhance those sites with our premium services. A fully distributed company, Automattic has more than 1,774 employees working from 90 countries. Company Name: Automattic Inc.Founded: August 2005Founder & CEO: Matt MullenwegCFO: Mark DaviesStaff: 1,774Headquarters: San Francisco, CA, USAStaff locations: 90 countries, speaking 116 languagesKey Investors: Tiger Global Management, Salesforce Ventures, Insight Venture Partners, ICONIQ Capital, True Ventures, Wellington Management, BlackRock, Alta Park Capital, Addition, Schonfeld, New York Times Company.Status: Privately held and independent, in later-stage growth phase. Journalists, Please Note Automattic owns and operates WordPress.com, which is a hosted version of the open source WordPress software with added features for security, speed and support. Please append “.com” when referencing our product name. WordPress is open source software, which is written, maintained, and supported by thousands of independent contributors worldwide. Automattic is a major contributor to the WordPress open source project. If you would like to contribute to the WordPress open source project, learn more at make.wordpress.org. Facts & Figures Internal: WordPress.com/activityExternal: W3Techs, BuiltWith Company Photo – DownloadGrand Meetup, 2019 Matt Mullenweg – DownloadFounder & CEO Looking for another product logo or additional images? See all of our brand materials. Recent News All the latest news Automattic Acquires Harper Harper—which is named after novelist Harper Lee—delivers grammar and language suggestions in under 20 milliseconds. Automattic Acquires WPAI WPAI is known for its innovative products like CodeWP, an AI integrated development environment (IDE) for WordPress developers, and AgentWP. Every Automattician Is Now an Owner of Automattic On October 7, 2024, every human being who works at Automattic was made a co-owner of the company. Automattic Welcomes Pedraum Pardehpoosh as VP of Product Pedraum will oversee product excellence across Automattic, beginning by immersing himself in the open source WordPress ecosystem that drives innovation for 43% of the Internet. Defending Open Source Our Legal Response to WP Engine’s Meritless Complaint Read our most recent statement. Protecting the Future of WordPress Read about how we are protecting the community against Silver Lake and WP Engine. Automattic at WordCamp Europe 2024Automattic YouTube channel Logos Automattic Color LogoPNG · PDF White LogoPNG · PDF WordPress.com WordPress.com Brand Kit Looking for another product logo or images? See all of our brand materials."
