["https://automattic.com/creed/help-a-colleague"]
title = "I will never pass up an opportunity to help out a colleague – Automattic"
description = '''It doesn't matter who you report to or what division you're in. If you're an Automattician, every other Automattician is your colleague. A culture where we always try to help one another is the one we all want to work in. Taken more broadly, "colleague" is all those in the same role in the world.…'''
full_description = "The Automattic Creed/I will never pass up an opportunity to help out a colleague I will never pass up an opportunity to help out a colleague It doesn’t matter who you report to or what division you’re in. If you’re an Automattician, every other Automattician is your colleague. A culture where we always try to help one another is the one we all want to work in. Taken more broadly, “colleague” is all those in the same role in the world. Can you write a blog post or give a talk that will help everyone who is exposed to it? Part of helping someone is communicating clearly. This doesn’t mean saying “yes” to every request. The distance between saying you’ll help someone and actually helping them is a gap often created with the best intentions. But when we don’t bridge that gap, accountability suffers throughout the organization. Our desire to help might make it tempting to tell someone we’ll do something, but we should always be impeccable with our word. « Return to the creed"
