["https://automattic.com/creed/communication-is-oxygen"]
title = "I will communicate as much as possible, because it’s the oxygen of a distributed company – Automattic"
description = "This is probably true in all relationships, but especially in the long-distance ones we're in during most of the year at Automattic. This is one of the areas where we differ from the late, great Douglas Adams who wrote of the Babel fish: Meanwhile, the poor Babel fish, by effectively removing all barriers to communication…"
full_description = "The Automattic Creed/I will communicate as much as possible, because it’s the oxygen of a distributed company I will communicate as much as possible, because it’s the oxygen of a distributed company This is probably true in all relationships, but especially in the long-distance ones we’re in during most of the year at Automattic. This is one of the areas where we differ from the late, great Douglas Adams who wrote of the Babel fish: Meanwhile, the poor Babel fish, by effectively removing all barriers to communication between different races and cultures, has caused more and bloodier wars than anything else in the history of creation. Repeatedly in our work, we find the opposite: poor communication (and understanding) is at the root of every disagreement, conflict, and poorly managed project. When people understand each other, difficulties melt away. (Most true conflict in a work environment is imagined.) The reference to oxygen is not accidental: too much oxygen can be fatal as well. As a group scales past the level where it’s most efficient for everyone to keep up with everything, it’s important to invest time from an editorial mindset making sure that the right information isn’t just published, but it’s heard and understood by those who need to. « Return to the creed"
