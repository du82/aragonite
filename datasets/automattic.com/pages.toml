["https://automattic.com/2024/12/04/from-iraq-with-love"]
title = "From Iraq, With Love – Automattic"
description = "Automattic welcomes new people all the time. In April, 2021, backend engineer Martin Akram (pictured above, with his parents) was one of those people. But just a year after joining Automattic, Martin’s life took a dramatic turn—and the events that rapidly unfolded put the very notion of “workplace support” to the test.Martin was Automattic’s first…"
full_description = "News/Inside Automattic From Iraq, With Love L. Jeffrey Zeldman · January 30, 2025 Automattic welcomes new people all the time. In April, 2021, backend engineer Martin Akram (pictured above, with his parents) was one of those people. But just a year after joining Automattic, Martin’s life took a dramatic turn—and the events that rapidly unfolded put the very notion of “workplace support” to the test.Martin was Automattic’s first hire following our acquisition of Parse.ly, an analytics platform for newsrooms and content marketers. He started on the solutions engineering team and later transitioned to the backend team at Parse.ly. Martin’s onboarding was seamless. He found his home here, and his work was going beautifully. But then, one year into Martin’s Automattic journey, his mother back home was diagnosed with stage four metastatic colon cancer. A family crisis Martin had been living in the U.S. since 2006, but his parents remained in Iraq. With poor healthcare available there, the family had already begun the immigration process for Martin’s parents, but the news of his mother’s cancer expedited their need to relocate to the U.S. for treatment. The situation became critical when his mother’s surgeon in Iraq revealed that her longterm prospects would be grim if she remained in that country. Martin immediately flew to Iraq to be by his mother’s side, expecting to be there for a week or two. But the gravity of the situation forced him to extend his stay, and Automattic’s HR team stepped in to provide immediate and unwavering support. Martin’s team lead, who was every bit as supportive as his HR wranglers, informed him about family medical leave options. When Martin decided to take advantage of these services, the HR team stepped in and handled all the paperwork remotely, freeing Martin to focus entirely on his mother’s care. Meanwhile, Martin worked with his immigration lawyer, who specialized in medical immigration, to expedite his parents’ visas. Automattic’s HR department quickly provided essential documents to support the immigration process. “They just helped” “I needed a bunch of paperwork,” Martin explains, “so while I was in Iraq on family leave, the HR team here stepped up even more, and sent me all the documentation about my employment history, compensation, and so on. They worked around the clock. I could even call them about something urgent at 3:00 AM. Nobody complained. They just helped.” Within just two months of his mother’s diagnosis, Martin’s parents were able to move to the U.S. for treatment. His mother underwent a successful, seven-hour liver surgery at the University of Pennsylvania, one of the country’s top cancer research hospitals. Through it all, Martin often feared that his frequent absences for medical appointments would strain his team, but Automattic’s flexible policies and compassionate work culture allowed him to balance work and personal life without guilt: “Every time I talked to my HR person, she’d say, ‘Dude, that’s what we’re here for. Taking an hour or two is not going to negatively impact your work or your job security. We know you’re going to make the time back up, and we know your own mental health is important to the success of the team.’ “In tech spaces, you often hear that you’re encouraged to prioritize your physical and mental health, and that it’s fine to take time off whenever you need it to take care of your family. You hear this at many jobs, but you don’t really believe it. You think it’s just talk for the purposes of, you know, ticking off a box saying ‘we care about work-life balance.’ But talk about work-life balance at Automattic couldn’t be more accurate, in my opinion.” At the same time, Martin’s team lead became a close confidant, constantly checking in and offering emotional support. Though he has since left the company, they remain good friends to this day. The family afterward Fast forward to three years later: Martin’s mother is stable, and he attributes much of her survival and the quality of her life to the support he received from Automattic: “My mom is closing in on three years post-diagnosis,” he says. “She’s healthy. She’s not cancer free—she’s never going to be cancer free—but she’s stable. If you look at her, you wouldn’t know she has stage four cancer. Her oncologist initially gave her only a few months to live! “My mom means the world to me. I love her more than life itself. I know that one day she won’t be here, but I’m just so grateful for all the extra time we have together, and I credit that to Automattic. I get to see my mom and my dad every day after work, because they live two blocks away.” Initially, in taking care of his parents, Martin found his own health deteriorating in 2022 and 2023. But because Automattic offers employees robust medical and health care, Martin was able to hire his own nutritionist and cardiologist to help him get his own health back on track—and today, he’s doing better than ever: “It’s such a testament to the kind of place that we’ve created here. What’s more, getting all this support has made me more committed to my team, and to the success of the product and our department. I can never repay Automattic for what they’ve done for my family and me.” Martin is deeply grateful for the company’s human-centered work culture, which genuinely prioritizes employees’ mental health and family needs, and says that this unwavering support has only strengthened his dedication to his role and team.The humans of Automattic make the web a better place by creating experiences for more than a billion people each month through our work on WordPress.com, WooCommerce, Tumblr, Jetpack, Pocket Casts, Day One, and many other products. Join us! Share this:Click to share on Tumblr (Opens in new window)Click to share on Mastodon (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on X (Opens in new window)Click to share on Threads (Opens in new window)Click to share on Bluesky (Opens in new window)Click to share on WhatsApp (Opens in new window)Like Loading... Related Share this Share this:Click to share on Tumblr (Opens in new window)Click to share on Mastodon (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on X (Opens in new window)Click to share on Threads (Opens in new window)Click to share on Bluesky (Opens in new window)Click to share on WhatsApp (Opens in new window) Like Loading... Tagged automattic benefits caring culture healthcare humanism work-life balance"
