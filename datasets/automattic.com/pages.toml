c. 60 29th Street #343 San Francisco, CA 94110 Phone: (877) 273-8550 Fax: (415) 840-0710 You must include the following: A physical or electronic signature of the copyright owner or a person authorized to act on their behalf; An identification of the copyrighted work claimed to have been infringed; A description of the nature and exact location of the material that you claim to infringe your copyright, in sufficient detail to permit Automattic to find and positively identify that material. For example we require a link to the specific post (not just the name of the blog) that contains the material and a description of which specific portion of the post – an image, a link, the text, etc. your complaint refers to; Your name, address, telephone number and email address; A statement that you have a good faith belief that use of the material in the manner complained of is not authorized by the copyright owner, its agent, or the law; and A statement that the information in the notification is accurate, and under penalty of perjury, that you are authorized to act on behalf of the owner of an exclusive right that is allegedly infringed.'''
