["https://automattic.com/2024/10/14/automattic-employee-stock-grant"]
title = "Every Automattician Is Now an Owner of Automattic – Automattic"
description = "A recent stock grant gave more than 1,700 Automattic employees a stake in the company."
full_description = "Company News Looking Ahead October 4, 2024 A recent stock grant gave more than 1,700 Automattic employees a stake in the company. Company News Automattic—WP Engine Term Sheet October 1, 2024 A recent stock grant gave more than 1,700 Automattic employees a stake in the company. Company News Defending Open Source: Our Legal Response to WP Engine’s Meritless Complaint October 31, 2024 A recent stock grant gave more than 1,700 Automattic employees a stake in the company. News/Company News Every Automattician Is Now an Owner of Automattic Automattic · January 14, 2025 On October 7, 2024, every human being who works at Automattic was made a co-owner of the company. On that date, Automattic CEO Matt Mullenweg announced the granting of 200 A12 shares to every single Automattician. The A12 program is unusual in several respects. The shares are more liquid than common shares or options, and the program includes an internal marketplace with a twice-a-year window: after a one-year vesting period, employees get a chance to buy more shares every six months, or sell shares every three months. That opportunity to sell remains even if an employe leaves the company. “For your entire life, you are now a shareholder of Automattic,” Mullenweg said while announcing the move to employees. “You are an owner. And I want you all to have the mentality of an owner.” The stock grant serves as a thank-you to the many Automatticians who declined the company’s generous six-month severance offer, as well as an inducement for all employees to think like owners, while still putting customer needs above all else. Automattic is the people behind WordPress.com, Woo, Jetpack, WordPress VIP, Simplenote, Longreads, The Atavist, WPScan, Akismet, Gravatar, Crowdsignal, Cloudup, Tumblr, Day One, Pocket Casts, Newspack, Beeper, and more. Our mission is to democratize publishing and commerce so anyone with a story can tell it, and anyone with a product can sell it, regardless of income, gender, politics, language, or where they live in the world. Share this:Click to share on Tumblr (Opens in new window)Click to share on Mastodon (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on X (Opens in new window)Click to share on Threads (Opens in new window)Click to share on Bluesky (Opens in new window)Click to share on WhatsApp (Opens in new window)Like Loading... Related Share this Share this:Click to share on Tumblr (Opens in new window)Click to share on Mastodon (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on X (Opens in new window)Click to share on Threads (Opens in new window)Click to share on Bluesky (Opens in new window)Click to share on WhatsApp (Opens in new window) Like Loading... Tagged automattic Keep reading Company News Looking Ahead October 4, 2024 A recent stock grant gave more than 1,700 Automattic employees a stake in the company. Company News Automattic—WP Engine Term Sheet October 1, 2024 A recent stock grant gave more than 1,700 Automattic employees a stake in the company. Company News Defending Open Source: Our Legal Response to WP Engine’s Meritless Complaint October 31, 2024 A recent stock grant gave more than 1,700 Automattic employees a stake in the company."
