full_description = 'Work With Us / Tumblr Migration Howdy! 👋 We’re migrating Tumblr’s back‑end to run on WordPress. This will be one of the largest technical migrations in internet history. It won’t be easy. But at the end of it, we expect to make both Tumblr and WordPress better. Both Tumblr and WordPress run on PHP primarily. So strong PHP skills are a must. But there are a ton of components and services and languages that go into scaling large properties like Tumblr and WordPress.com. So we’ll need to hop into and out of codebases as necessary. In fact, both systems are so large that no single person holds the whole thing in their head. We need people with top‑notch programming skills. But equally important is the willingness to drop into an unfamiliar codebase and quickly learn and adapt. If you’re an experienced programmer… if you’re a SQL‑slinger… if you’ve worked on other big audacious projects like this… if Gordian knots tremble in your presence, we want to work with you! Please reach out below and tell us about yourself. Tell us why this project matters to you. And tell us about relevant experiences and skills that you can bring to make this migration a success. Name(required) Email(required) Your site Tell us about you(required) Human Check Work With Us Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); Share the word'
