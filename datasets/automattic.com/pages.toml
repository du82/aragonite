title = "Benefits – Automattic"
description = "Jobs  We are always open to hearing from talented people in countries worldwide. If you are interested in working at Automattic, check out our current openings. How We Work This isn’t your typical work-from-home job. Learn more about our culture, our creed, and life as an Automattician. Read more Benefits Professional growth, open vacation policy,…"
full_description = "Benefits Jobs We are always open to hearing from talented people in countries worldwide. If you are interested in working at Automattic, check out our current openings. How We Work This isn’t your typical work-from-home job. Learn more about our culture, our creed, and life as an Automattician. Read more Benefits Professional growth, open vacation policy, generous parental leaves, wellness support, sabbaticals, and more. We support our fellow Automatticians with great benefits. In addition to those listed below, other benefits vary by location and can be found here. Professional Development · I will never stop learning” is part of our company creed. From leadership development to improving your writing skills, we have a comprehensive list of programs and resources available to everyone, and we’re also happy to pay for any hardware, software, books, or conferences that promote continued learning. Wellness · We offer mental wellness benefits including an Employee Assistance Program, a monthly subscription to a mindfulness app (including Calm, Headspace, Ten Percent Happier, Waking up, and Insight timer), and virtual ergonomic consultations and access to a wealth of virtual ergonomic tips, stretch videos and yoga exercises. Career Coaching · Coaching sessions to help you set and achieve professional goals are available for all Automatticians – team members and team leads. This benefit resets each calendar year. Parental leave · Open parental leave (including maternity, paternity, LGBTQ+, and adoption for all parents). If you’ve been with Automattic for 12 months, your leave up to 6 months is fully paid. Time off · Our open vacation policy (no set number of days per year) is designed to help you to be at your best! There is no minimum or maximum, but we encourage you to take at least 25 days of time off per year. Anniversary Awards · Paid three-month sabbatical encouraged every five years and other cool anniversary surprises. Read all about it! Home Office · We offer home office setup and coworking allowances. Working from a coffee shop? You can use your coworking allowance for the requisite latte! Automattic StockCheck out Buying and selling Automattic Stock! Life Insurance · Company-sponsored life insurance. Compensation· We attract talent around the world and pay global salary ranges. We prioritize internal equity and review your pay every 12-18 months. Read more about our compensation philosophy. Interested? Come work with us!"
