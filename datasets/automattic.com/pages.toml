full_description = "The Automattic Creed/I am more motivated by impact than money I am more motivated by impact than money Money is totally fine, and it’s completely necessary in our current socioeconomic system for everything we want to accomplish as a company — and for many things individually. A good attitude is summed up in this Walt Disney quote, which Facebook bogarted in Zuck’s letter in their S-1: We don’t make movies to make money, we make money to make more movies. Making money is okay — in fact, it’s one of the freedoms enabled by the GPL, and no one should feel embarrassed about discussing compensation with HR. But we work for more than just a paycheck. « Return to the creed"
