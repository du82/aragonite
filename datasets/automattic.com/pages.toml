description = "If you believe that material available on our sites, including those hosted at WordPress.com, infringes on your copyright(s), please notify us by submitting a copyright infringement notice. After we receive a valid and complete notice, we will investigate, remove the material, and make a good faith attempt to contact the user who uploaded the material,…"
full_description = '''Copyright Policy If you believe that material available on our sites, including those hosted at WordPress.com, infringes on your copyright(s), please notify us by submitting a copyright infringement notice. After we receive a valid and complete notice, we will investigate, remove the material, and make a good faith attempt to contact the user who uploaded the material, via email. Learn more about our process here. Please note that we are unable to process notices that refer to sites hosted on third-party servers that use self-hosted WordPress.org software. Please refer to this page for more information on the differences between WordPress.com and WordPress.org. WordPress.com is a publishing platform where site owners often use copyrighted materials in commentary or journalism, or transform the materials into something original. As such, before submitting a notice, it’s important to consider whether the material used falls under fair use. If you are not sure whether material located on a WordPress.com site infringes on your copyright, or if it is subject to fair use protections, you should first consider seeking legal advice. You may be liable for damages (including costs and attorneys’ fees) if you materially misrepresent that material or activity infringes on your copyright. We have and will highlight such abuses and seek to collect those damages. Your notice will be forwarded to the party that made the material available, and also may be sent to third parties such as LumenDatabase.org. A note will also be placed on the site in question detailing the name of the copyright owner who submitted the notice. In addition, you are required to consider the possible fair use implications, as a result of Lenz v. Universal. We reserve the right to challenge abuses of this process, and your use of this form does not waive that right. Please follow these steps to file a notice: Verify that the site in question is hosted by Automattic. We have no control over sites that say “Powered by WordPress.” Those sites use the open source WordPress.org software and are not hosted by us. Please contact the appropriate web host with complaints. Contact the site owner directly. Go to the post in question and leave a comment with your complaint to see if the matter can be resolved directly between you and the site owner. If commenting isn’t currently enabled on the site, you may wish to check if the site owner has included a contact form which you can use to reach out. Send your complaint to our designated agent via the form below, if the issue cannot be resolved directly with the site owner. We have a policy to terminate users and/or sites that we consider to be repeat infringers. Although we won’t share the specifics of our repeat infringer policy (we don’t want anyone to game the system, after all), we believe that it strikes the right balance: it protects the rights of copyright owners and protects legitimate users from wrongful termination. Please note that notices that are successfully countered, rejected on fair use grounds, or deemed to be fraudulent are not counted against a user or site. First Name Last Name Company Name Address City State/Region/Province Country \n\t\t== Please Choose == Afghanistan Åland Islands Albania Algeria American Samoa Andorra Angola Anguilla Antarctica Antigua and Barbuda Argentina Armenia Aruba Australia Austria Azerbaijan Bahamas Bahrain Bangladesh Barbados Belarus Belgium Belize Benin Bermuda Bhutan Bolivia Bosnia and Herzegovina Botswana Bouvet Island Brazil British Indian Ocean Territory Brunei Darussalam Bulgaria Burkina Faso Burundi Cambodia Cameroon Canada Cape Verde Cayman Islands Central African Republic Chad Chile China Christmas Island Cocos (Keeling) Islands Colombia Comoros Congo Congo, the Democratic Republic of the Cook Islands Costa Rica Côte d'Ivoire Croatia Cuba Cyprus Czech Republic Denmark Djibouti Dominica Dominican Republic Ecuador Egypt El Salvador Equatorial Guinea Eritrea Estonia Ethiopia Falkland Islands (Malvinas) Faroe Islands Fiji Finland France French Guiana French Polynesia French Southern Territories Gabon Gambia Georgia Germany Ghana Gibraltar Greece Greenland Grenada Guadeloupe Guam Guatemala Guernsey Guinea Guinea-Bissau Guyana Haiti Heard Island and McDonald Islands Holy See (Vatican City State) Honduras Hong Kong Hungary Iceland India Indonesia Iran, Islamic Republic of Iraq Ireland Isle of Man Israel Italy Jamaica Japan Jersey Jordan Kazakhstan Kenya Kiribati Korea, Democratic People's Republic of Korea, Republic of Kuwait Kyrgyzstan Lao People's Democratic Republic Latvia Lebanon Lesotho Liberia Libya Liechtenstein Lithuania Luxembourg Macao Macedonia, the former Yugoslav Republic of Madagascar Malawi Malaysia Maldives Mali Malta Marshall Islands Martinique Mauritania Mauritius Mayotte Mexico Micronesia, Federated States of Moldova, Republic of Monaco Mongolia Montenegro Montserrat Morocco Mozambique Myanmar Namibia Nauru Nepal Netherlands Netherlands Antilles New Caledonia New Zealand Nicaragua Niger Nigeria Niue Norfolk Island Northern Mariana Islands Norway Oman Pakistan Palau Palestinian Territory, Occupied Panama Papua New Guinea Paraguay Peru Philippines Pitcairn Poland Portugal Puerto Rico Qatar Réunion Romania Russian Federation Rwanda Saint Barthélemy Saint Helena Saint Kitts and Nevis Saint Lucia Saint Martin Saint Pierre and Miquelon Saint Vincent and the Grenadines Samoa San Marino Sao Tome and Principe Saudi Arabia Senegal Serbia Seychelles Sierra Leone Singapore Slovakia Slovenia Solomon Islands Somalia South Africa South Georgia and the South Sandwich Islands Spain Sri Lanka Sudan Suriname Svalbard and Jan Mayen Swaziland Sweden Switzerland Syrian Arab Republic Taiwan Tajikistan Tanzania, United Republic of Thailand Timor-Leste Togo Tokelau Tonga Trinidad and Tobago Tunisia Turkey Turkmenistan Turks and Caicos Islands Tuvalu Uganda Ukraine United Arab Emirates United Kingdom United States United States