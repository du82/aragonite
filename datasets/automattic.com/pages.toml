["https://automattic.com/2024/09/03/welcome-pedraum-pardehpoosh"]
title = "Automattic Welcomes Pedraum Pardehpoosh as VP of Product – Automattic"
description = "Automattic is excited to welcome Pedraum Pardehpoosh as our new VP of Product."
full_description = "Announcements The World’s Best Inbox Just Got Better April 9, 2024 Automattic is excited to welcome Pedraum Pardehpoosh as our new VP of Product. Announcements ‘The Atavist’ Wins Three Awards for Its Longform Journalism July 29, 2024 Automattic is excited to welcome Pedraum Pardehpoosh as our new VP of Product. Announcements Live the Suite Life With Automattic For Agencies June 5, 2024 Automattic is excited to welcome Pedraum Pardehpoosh as our new VP of Product. News/Announcements Automattic Welcomes Pedraum Pardehpoosh as VP of Product Automattic · January 14, 2025 At Automattic, we believe exceptional products result from visionary leadership and unparalleled expertise. Today, we’re excited to welcome Pedraum Pardehpoosh as our new VP of Product. Pedraum, a seasoned product leader, brings decades of deep experience in tech across start-ups and Fortune 500 companies. Most notably, he spent the early part of his career at Walmart, leading integrations between Walmart.com and Walmart Stores. Next, he joined Apple, first overseeing product for the company’s online store and then as the head of product for the App Store, where he oversaw the launch of features like in-app purchases, ratings and reviews, and the App Store Today tab. Most recently, Pedraum was the Director of Product, Quality, and Reliability at Airbnb, responsible for improving the guest experience and increasing the reliability of hosts. As VP of Product, Pedraum will oversee product excellence across Automattic, beginning by immersing himself in the open source WordPress ecosystem that drives innovation for 43% of the Internet. We’re excited to have Pedraum on board and look forward to his impact across Automattic’s products and services. Welcome! Share this:Click to share on Tumblr (Opens in new window)Click to share on Mastodon (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on X (Opens in new window)Click to share on Threads (Opens in new win