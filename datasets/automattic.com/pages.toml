["https://automattic.com/for-agencies/blog/wordpress-accessibility"]
title = "How to Ensure Accessibility in WordPress: Best Practices in 2024 – Automattic"
description = """
Pablo Postigo
\t\t\t\t\t\t\t\tPablo is a web enthusiast who has been using WordPress since 2008. 

He is currently part of the Growth & Strategy team in Automattic. Before joining Automattic, he was the co-founder & CEO of Frontity, the best framework to build React frontends for WordPress."""
full_description = "How to Ensure Accessibility in WordPress: Best Practices in 2024 October 8, 2024 Pablo Postigo Tutorials & How-Tos Imagine that you’ve arrived on a website to find the answer to a question or purchase a product that you’ve heard great things about. But once you get to the site, it’s impossible to navigate to the page you want or read the information that you came to find. That’s a real scenario for people with visual, auditory, cognitive, or motor disabilities who land on sites that aren’t accessible. When you’re developing a website, your job is to make it user-friendly for every single visitor, and accessibility is a huge part of that. So let’s dive into what accessibility is and why it’s important. We’ll discuss what it takes to create an accessible WordPress website in 2024. We’ll also briefly introduce you to the Automattic for Agencies program, which helps agencies work more efficiently and raise profits, all while improving the quality of everything they do — from performance and security to user experience. What is web accessibility? Web accessibility is the practice of making a website usable and engaging for everyone, including those with auditory, cognitive, neurological, physical, speech, and visual disabilities. 42.5 million Americans live with a disability — and if you don’t make websites easy to use for them, you’ll be under-serving a big portion of visitors. But web accessibility also benefits people without long-term disabilities. If you’ve ever broken an arm, used a slow internet connection, had to squint to see in a super sunny location, or tried to watch a video in a quiet doctor’s office, you know how difficult websites can be to use. By prioritizing accessibility when building a website, rather than making it an afterthought, you can truly create an inclusive environment — which is best for visitors, the business, and the community. An overview of accessibility standards Accessibility standards are in place to guide developers and site owners on how they can prioritize people of all abilities when creating websites and other materials. Let’s take a closer look at some of these. Web Content Accessibility Guidelines (WCAG) Web Content Accessibility Guidelines (WCAG) are maintained through an organization called W3C, with the goal of creating a single global standard for accessibility across the web. WCAG 2.0 has 13 guidelines, which are organized into four groupings: perceivable, operable, understandable, and robust. We’ll dive into each of these in just a bit. Section 508 and ADA compliance Section 508 is part of the Rehabilitation Act of 1973, which was created to prohibit discrimination based on disabilities, particularly in federal programs and programs that receive federal aid. This section addresses accessibility across information and communication technology, including websites. Even if a business isn’t required to comply with Section 508, it’s a great resource for understanding and optimizing for accessibility. The Americans with Disabilities Act (ADA) is a U.S. civil rights law that provides protection for those with disabilities, ensuring that they have the same opportunities as the rest of the population. It includes guidance for websites, in addition to other areas. Key principles of WCAG We already briefly mentioned the four principles of WCAG 2.0. Let’s explore each one in detail. Perceivable Everyone who visits a website should be able to perceive the information found there. This means that, if they don’t have use of one or more of their senses, they should be able to interpret pages with a different sense. Here are some examples of how you can make content perceivable: Add descriptive alt text to images Add captions or transcripts for podcasts and videos Make sure button text describes the purpose of the button Don’t rely solely on color to convey information Essentially, this means having different versions of your content that apply to different senses. Operable All visitors should be able to operate the website, even if using assistive technology like keyboard navigation. Here are some examples of how you can make your content operable: Ensure that all functionality is accessible using only a keyboard to navigate Avoid flashing content that could trigger seizures or cause dizziness Make it easy for everyone to navigate through pages and understand where they are on the website Understandable You want all text content to be as understandable as possible, to everyone, but particularly to the target audience. Here are some examples of how you can make content understandable: Provide a definition for technical terms used throughout the site Make sure that the native language of content is defined When possible, write content at a lower secondary education level (typically children around 11-14 years old) Expand on or define abbreviations Robust Content needs to be robust, so that a variety of user agents, from different browser versions to screen readers and braille readers, can successfully interpret it. The goal is to ensure that it’s compatible with both current and future user agents. Here are some examples of how you can make content robust: Make sure your HTML is valid, so user agents can parse it successfully Provide descriptive metadata, like page titles Why accessibility matters for WordPress sites So why exactly should you prioritize accessibility on a WordPress site? We’ve touched on this a bit already, but here are some important reasons: To meet ethical and legal considerations The first consideration, of course, is an ethical one. Everyone should be able to easily use any website they’d like, regardless of their situation or abilities. By making a site accessible, you’re contributing to a better, kinder online world. But there are also legal considerations. There are laws, some of which we discussed earlier, that require websites to reach a certain standard of accessibility. Some types of organizations — like those in government or healthcare — have to meet stricter requirements. Websites that don’t comply may face legal fees and penalties. It’s important that you understand your specific situation, based on business type and location, so it may be a good idea to consult with a lawyer. To provide a better user experience One in six people across the globe have a disability of some sort. Even more than that have a temporary condition — such as a broken arm — that affects how they use the internet. To put it simply, if a site doesn’t cater to them, you fail to reach a significant portion of its audience. Focusing on accessibility makes it easier for everyone to use your site, ultimately leading to better connections, more conversions, and more sales. To reach a broader audience Again, since so many people around the world have a disability, whether permanent or temporary, accommodating their needs helps you reach a broader audience. And reaching a broader audience means more success for your agency and your clients. To meet the requirements of search engines Search engines, like Google, want to present their users with the highest-quality results for their queries. And just like search engines prioritize performance and responsiveness, they also value accessibility. Strategies that improve your site’s accessibility also improve other aspects of search engine optimization. For example, adding alt text to images is great for screen readers and crawlers. Descriptive page titles provide guidance for users and bots. And quality link anchor text is valuable for accessibility tools and search engines — both of which want to understand how content is related. In the vast majority of cases, if you optimize for accessibility, you’re also going to improve your search engine optimization. Common accessibility issues Let’s explore some common accessibility issues found on websites. Lack of alt text Typically, people with vision impairments use screen readers to consume content on a website. These tools either use a speech synthesizer or braille display to “read” the page to a user. When an image has alt text, screen readers will read it so that users can still understand the gist of the photo or graphic. And while it’s easy to just throw images up on a site, if you skip over alt text, you’re doing your visitors a huge disservice. Why? Because if there isn’t alt text, the screen reader will either skip over the graphic altogether or read the file name out loud, which could be very jarring and ruin the user experience. That’s also why you don’t want to just stuff keywords in and call it a day. Descriptive alt text ensures that everyone gets the benefit of the graphics you add to the site. We’ll touch a bit more on this later. Examples of good and bad color contrast from https://www.csun.edu/universal-design-center/web-accessibility-criteria-color-contrast Poor color contrast Color contrast is an incredibly important part of legibility, for both those with vision impairments and those without. Vision impairments can cover everything from vision loss to color blindness, and the idea of minimum contrast works to make text readable for everyone. To put it simply, the color of text must be different enough from the background color or image behind it. Ideally, you want a contrast rating of 4.5:1 for body text and 3:1 for heading text. Tools like contrastchecker.com can analyze your design and let you know if it meets accessibility standards. You also want to take color blindness into consideration. Around 8% of men and 0.5% of women have some form of color blindness. Red-green color blindness is most common, so avoid putting these colors on top of one another if at all possible. Again, we’ll explore all of this in more detail momentarily. Inaccessible forms Forms serve a variety of purposes across a website. Visitors use them to ask questions, complete surveys, make purchases, sign up for email lists, leave comments, and more. And since they’re so important, you definitely want them to be accessible to everyone. Even if they’re a bit bulky, using field labels in addition to placeholders can go a long way towards helping screen readers understand your form. You also want to make sure that everything from required fields and formatting instructions to error messages are clear and descriptive. And forms should be easy to navigate and fill out using only a keyboard. Missing or low-quality link text When you don’t add descriptive link text, accessible technology has a harder time understanding and navigating your site. Instead of just saying “click here” or “read more,” you want to describe the purpose of the link or the page you’re linking to. Let’s say you’re building an online store and want to link to one of the products. Instead of linking “click here to learn more about our book set,” you would be better off linking “learn more about our book set.” Essentially, the link text should make sense if taken entirely out of context. Inaccessible media Videos and other types of media are an amazing way to explain concepts, engage visitors, and demonstrate how things work — but only if your audience can successfully interact with them. If you include videos or audio files on pages, make sure to add captions, so that those who have trouble hearing can still understand what’s being said. You can also use audio descriptions or transcripts to describe what’s going on in your videos, so screen readers can interpret the content for those with vision impairments. Lack of a quality heading structure Headings are an important structural component of site design. They make pages and posts skimmable and categorize content so that it’s easier to understand and navigate. And for screen readers, they’re absolutely critical. You see, screen readers largely use headings to jump between sections or skim content — without them, users may be confused or have trouble finding the information they’re looking for. Headings should also be in the correct hierarchical order. Here’s a basic example: H1 H2 H3 H3 H2 H3 H3 H3 H2 Key components of accessibility in WordPress Now let’s dive deeper into the key components of WordPress accessibility. 1. Navigational accessibility Every single person who visits a site wants to find what they’re looking for quickly and efficiently, so improving your navigational setup will help everyone. But this is even more important for accessibility tools that rely on a quality website structure to successfully interpret content. Here are some things to consider: Keyboard navigation When someone has trouble using a mouse or trackpad, keyboard navigation is their primary means of moving through a website. But other types of assistive technology, like screen readers, also rely on keyboard accessibility. Keyboard navigation primarily uses the following components: Tab key: Jump from one element to another (e.g. links, form fields, media player controls, menus, etc.) Enter key: Activate elements like buttons or links Arrow keys: Navigate between items in a dropdown Escape key: Exit windows, pop-ups, apps, etc. The menu items on Jetpack’s site, for example, are outlined when selected with the “tab” key. Testing for keyboard accessibility is pretty simple — try to navigate through the entire website using only your keyboard. Ask yourself: When I select an item, is there a visual change? This could be an outline, underline, or highlight, for example. Are there keyboard traps? These occur when you can’t navigate away from or out of an element using just your keyboard. Can you navigate through the page in a logical order? Your keyboard should automatically follow the visual flow of the page, from left to right and top to bottom. Is there a “skip to main content” link? This allows visitors to drop down to the main content, skipping items they’re not interested in. Can you open, use, and exit out of all elements? This includes things like pop-ups, modals, and forms. Learn more about keyboard navigation. Accessible menus and links Menus are very important components of your site, and everyone should be able to navigate through them easily. Start by ensuring that your menu items are descriptive, and that it’s immediately clear what a visitor will find on each page. Submenus can be a big hangup when it comes to accessibility, so you’ll want to spend a little extra time optimizing these. Here are some steps to take: Add arrows or other symbols to indicate submenus Use the correct HTML elements, like <ul> for menus and <li> for items Add ARIA roles to your menu Make sure that your dropdown menus don’t disappear so quickly after hover that those with fine motor control difficulties can’t use them Make sure there’s enough space between menu items, especially on mobile, so that visitors can easily select the page they want And what about links and buttons? Of course, those need to be accessible as well, especially since they often play an important role in turning site visitors into subscribers or customers."
