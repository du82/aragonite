title = "Automattic for Agencies Partner Earnings – Automattic"
description = "Automattic for Agencies Partners can generate income with referrals and bulk purchases of Automattic products by: Referring customers to Automattic.  Buying products in bulk at a discounted rate and reselling those products to your customers.  (Note that your earnings will fluctuate based on the volume of business you do with Automattic.) To be eligible to…"
full_description = "For Agencies/Automattic for Agencies Partner Earnings Automattic for Agencies Partner Earnings Automattic for Agencies Partners can generate income with referrals and bulk purchases of Automattic products by: Referring customers to Automattic. Buying products in bulk at a discounted rate and reselling those products to your customers. (Note that your earnings will fluctuate based on the volume of business you do with Automattic.) To be eligible to earn commission on referrals and resales, your customer purchases must be: 1. Trackable via the Automattic for Agencies plugin. OR 2. Purchased through an Automattic for Agencies cart, or via another method determined by Automattic. In scenario two, Automattic for Agencies owns the billing relationship with the end customer. We may offer you a revenue share for those referrals as outlined in the table below. Commissions are calculated on a 60-day payout period and are net of refunds and chargebacks. The second method is bulk purchase at volume discount. Volume discounts do not earn a revenue share, though they may be eligible for other incentives as outlined below. Below are the incentives and additional terms for referrals and wholesale/volume purchases. To be eligible to earn on purchases of hosting, referrals, or migrations, you must purchase the plan and install that plugin within thirty (30) days of migration, or in advance of a purchase, in the case of non-migrations. To be eligible to earn on extension purchases or renewals, the plugin must be installed. REFERRALS Hosting and Product Referrals (Customer Purchase) ProductsEarningsAdditional TermsWordPress.com or Pressable.com hostingYou will receive a 20% revenue share on the sale of hosting subscriptions for new sites until June 30, 2025 (and renewals of those subscriptions).To continue earning a revenue share, you must refer at least one new subscriber to a WordPress.com or Pressable.com hosting plan each year, starting from the date you joined the Automattic for Agencies program.Jetpack products and Woo-owned extensionsYou will earn a 50% revenue share on Jetpack products and Woo-owned extensions until June 30, 2025 (and renewals of those subscriptions). For clarity, no revenue share is payable for third party extensions.To continue earning a revenue share on Jetpack products and Woo-owned extensions, you must refer at least one new subscriber to a WordPress.com or Pressable.com hosting plan each year, starting from the date you joined the Automattic for Agencies program.WordPress VIP hostingYou will earn a one-time 5% commission on the sale of hosting subscriptions for new sites until June 30, 2025. Migration Incentives (Customer Purchase) ProductsEarningsAdditional TermsWordPress.com and Pressable.com hosting migrationFor migrated sites, you will earn a 20% revenue share on the sale of subscriptions until June 30, 2025 (and renewals of those subscriptions).Special Limited-Time Migration Offer: You will receive a $100 bonus* for each migrated site until July 31, 2025.* WP Engine Customers: You will receive $100 per successful site migration up to $10,000. If you have an existing contract, we’ll host your site(s) for free until your existing WP Engine contract ends.For any other host: You will receive $100 per successful site migration up to $3,000.To continue earning a revenue share, you must refer at least one new subscriber to a WordPress.com or Pressable.com hosting plan each year, starting from the date you joined the Automattic for Agencies program.Agencies may not earn revenue share by moving between Automattic hosting products.The sites being migrated must have existed for the last six months, or longer.If we are offering to host your WP Engine sites until your existing contract expires, you must submit a copy of your invoice or contract to validate how long you have prepaid for or are locked into a contract for. Your Automattic for Agencies account will be credited with this amount once validated. Migration Incentives (Agency Purchase) ProductsEarningsAdditional TermsWordPress.com or Pressable.com hostingSpecial Limited-Time Migration Offer: You will receive a $100 bonus* for each migrated site until July 31, 2025.* WP Engine Customers: You will receive $100 per successful site migration up to $10,000. If you have an existing contract, we’ll host your site(s) for free until your existing WP Engine contract ends.For any other host: You will receive $100 per successful site migration up to $3,000.Not eligible for sites that are existing customers of WordPress.com or Pressable.com.The sites being migrated must have existed for the last six months, or longer.If we are offering to host your WP Engine sites until your existing contract expires, you must submit a copy of your invoice or contract to validate how long you have prepaid for or are locked into a contract for. Your Automattic for Agencies account will be credited with this amount once validated. To be eligible to receive any migration incentive, you must meet the following criteria: The site must be pre-existing and already built on a non-Automattic hosting company’s infrastructure, The site must be migrated to an Automattic hosting property (WordPress.com, Pressable, or WordPress VIP), The site must be tagged as a migrated site in your Automattic for Agencies dashboard, The DNS must be set to point to Automattic, and The site must remain active on Automattic’s infrastructure for a minimum of six (6) months. In the event Automattic suspects or determines there has been any fraudulent activity related to migrations, or that you have not complied with the preceding terms in any migration, Automattic may withhold payment, or require you to pay back any previously-earned incentives. WooPayments Referrals ProductsEarningsAdditional TermsWooPayments You will receive a revenue share of 5 basis points on new Total Payments Volume (“TPV”) on client sites through June 30, 2025. For example, if your client’s store generates $1M in TPV per year, your revenue share for that year would be $500. WHOLESALE/VOLUME DISCOUNTS ProductsDiscount Rates for Annual LicensesJetpack– Security 10 GB– Complete– AI– Akismet– Boost– Creator– Monitor– Scan Daily– Search– Social Advanced Beta– Social Basic– Stats– VaultPress 10 GB– VideoPress5 license bundle: 10% off per license10 license bundle: 20% off per license20 license bundle: 40% off per license50 license bundle: 70% off per license100 license bundle: 80% off per licenseWoo– AutomateWoo– Bookings– Min/Max Quantities– Product Add-Ons– Product Bundles– Subscriptionsand more5 license bundle: 10% off per license10 license bundle: 15% off per license20 license bundle: 20% off per license50 license bundle: 40% off per license100 license bundle: 50% off per license Pressable.com Hosting1-Site: $25/month3-Sites: $45/month5-Sites: $60/month10-Sites: $90/month20-Sites: $155/month50-Sites: $350/month80-Sites: $545/month100-Sites: $675/monthFor additional custom plans and pricing, please contact us.WordPress.com HostingSites / Monthly price / Price per site1 / $25.00 / $25.00 2 / $50.00 / $25.00 3 / $50.00 / $16.67 4 / $60.00 / $15.00 5 / $62.50 / $12.50 6 / $70.00 / $11.67 7 / $77.00 / $11.00 8 / $80.00 / $10.00 9 / $84.00 / $9.33 10 / $85.00 / $8.50And $8.50 for every additional site above 10."
