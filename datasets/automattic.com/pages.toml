["https://automattic.com/four-agreements"]
title = "Four Agreements – Automattic"
description = "Don Miguel Ruiz wrote a great book called The Four Agreements. Which are summarized on his website: 1. Be Impeccable with your Word Speak with integrity. Say only what you mean. Avoid using the Word to speak against yourself or to gossip about others. Use the power of your Word in the direction of truth…"
full_description = "Library/Four Agreements Four Agreements Don Miguel Ruiz wrote a great book called The Four Agreements. Which are summarized on his website: 1. Be Impeccable with your Word Speak with integrity. Say only what you mean. Avoid using the Word to speak against yourself or to gossip about others. Use the power of your Word in the direction of truth and love. 2. Don’t Take Anything Personally Nothing others do is because of you. What others say and do is a projection of their own reality, their own dream. When you are immune to the opinions and actions of others, you won’t be the victim of needless suffering. 3. Don’t Make Assumptions Find the courage to ask questions and to express what you really want. Communicate with others as clearly as you can to avoid misunderstandings, sadness, and drama. With just this one agreement, you can completely transform your life. 4. Always Do Your Best Your best is going to change from moment to moment; it will be different when you are healthy as opposed to sick. Under any circumstance, simply do your best, and you will avoid self-judgment, self-abuse, and regret. We withhold judgement on whether the agreements are comprehensive, but we disagree with nothing in any of them. They are particularly important in the long-distance relationship that is distributed work; distance and the fact that we primarily communicate via text means there is so much opportunity to misunderstand, misinterpret, and hurt feelings. These are highly related to Postel’s Law. « Return to Library"
