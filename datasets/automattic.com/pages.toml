title = "Jeff Gothelf’s Recipe for Success: Clear Goals, User-Focused Design, and Automattic – Automattic"
description = "Putting something new into the world is a big undertaking with lots of moving parts: conceptualizing a new product, making it real, and making it useful. Jeff Gothelf's mission is to make that big undertaking feel a little bit easier."
full_description = "News/Customer Stories Jeff Gothelf’s Recipe for Success: Clear Goals, User-Focused Design, and Automattic Automattic · February 18, 2025 Putting something new into the world is a big undertaking with lots of moving parts: conceptualizing a new product, making it real, and making it useful. Jeff Gothelf’s mission is to make that big undertaking feel a little bit easier for his clients. As a coach, trainer, speaker and writer, Jeff helps organizations build better products and cultures. There’s one basic question at the heart of his work, and it resonates with us here at Automattic: “How do we keep the human at the center of every conversation?” Since people learn in different ways and need different tools at different times, Jeff offers a range of services, from one-on-one coaching to keynotes to books to online courses. That means he needs a multi-functional website that explains who he is, clarifies what services he offers, and lets him sell and grant access to his digital offerings. Enter: WordPress. With a WordPress website that uses the Sensei learning management system and WooCommerce—and lots of VideoPress—Jeff can do it all with one integrated set of tools. That’s something that was particularly useful when launching his newest online course inspired by his book of the same name, Forever Employable. “I’m able to create the course, launch the course, sell the course, and do all the customer service from one interface rather than dealing with four or five different service providers,” he explains. And thanks to his recent adoption of WooPayments, he can even process and receive payments with ease. The word he uses most often to describe his online HQ? “Simple.” With all the other hats he wears, growing and adapting his services shouldn’t be something Jeff needs to worry about; thankfully, WordPress’s rich ecosystem means “there’s a plugin for literally everything you can think of.” Are you getting ready to take your new idea public? Every new product needs a website, and you can build yours with the same powerful tool Jeff uses. Get started today Featured Products Sensei Create and sell courses that your students will love.senseilms.com VideoPress The best tool for videographers, creators, filmmakers, educators, and bloggers seeking to upload high-quality video to WordPress.videopress.com WooCommerce Our WordPress-based ecommerce platform helps merchants and developers build successful businesses for the long term.woocommerce.com Share this:Click to share on Tumblr (Opens in new window)Click to share on Mastodon (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on X (Opens in new window)Click to share on Threads (Opens in new window)Click to share on Bluesky (Opens in new window)Click to share on WhatsApp (Opens in new window)Like Loading... Related Share this Share this:Click to share on Tumblr (Opens in new window)Click to share on Mastodon (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on X (Opens in new window)Click to share on Threads (Opens in new window)Click to share on Bluesky (Opens in new window)Click to share on WhatsApp (Opens in new window) Like Loading... Tagged Sensei VIdeoPress WooCommerce WooPayments wordpress"
