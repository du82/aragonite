["https://automattic.com/creed"]
title = "The Automattic Creed – Automattic"
description = "I will never stop learning. I won’t just work on things that are assigned to me. I know there’s no such thing as a status quo. I will build our business sustainably through passionate and loyal customers. I will never pass up an opportunity to help out a colleague, and I’ll remember the days before…"
full_description = "The Automattic Creed I will never stop learning. I won’t just work on things that are assigned to me. I know there’s no such thing as a status quo. I will build our business sustainably through passionate and loyal customers. I will never pass up an opportunity to help out a colleague, and I’ll remember the days before I knew everything. I am more motivated by impact than money, and I know that Open Source is one of the most powerful ideas of our generation. I will communicate as much as possible, because it’s the oxygen of a distributed company. I am in a marathon, not a sprint, and no matter how far away the goal is, the only way to get there is by putting one foot in front of another every day. Given time, there is no problem that’s insurmountable. For some context, check out Matt’s post “Why Your Company Should Have A Creed.” Another manifesto or creed we like is Acumen’s. We love Gitlab’s values. Amazon has great leadership principles. If there are others we should have on our radar please let us know. Automattician Greg Brown compares it to the Bill Walsh Standard. These principles are great for a printed poster or digital wallpaper: Check out this cool visualization of the creed by Patrick Rauland and Clark Wolter, and this colorful art poster made by the Automattic Design team. Does this inspire you? Join the team."
