["https://automattic.com/for-agencies/blog/agency-client-onboarding"]
title = "Agency Client Onboarding: 17-Step Checklist for a Smooth Start – Automattic"
description = """
Pablo Postigo
\t\t\t\t\t\t\t\tPablo is a web enthusiast who has been using WordPress since 2008. 

He is currently part of the Growth & Strategy team in Automattic. Before joining Automattic, he was the co-founder & CEO of Frontity, the best framework to build React frontends for WordPress."""
full_description = "Agency Client Onboarding: 17-Step Checklist for a Smooth Start October 10, 2024 Pablo Postigo Agency Growth & Management When onboarding a new client, it’s important to think about a variety of factors beyond just signing contracts and sending over relevant files. You’re not just creating deliverables for clients — you’re developing a relationship. Success will require a deeper understanding between both parties, consistent and clear communication, and tangible ways to track and analyze project timelines and product performance. A successful onboarding process builds trust, sets expectations, and provides a predictable framework that sets the tone for future collaborations. It can also help bridge any gaps that might occur as a result of separate sales and operational teams. A disorganized “handoff” from the sales team to an account manager or creative group charged with completing the work can result in miscommunications and is often jarring or confusing for clients. To help agencies create a strong foundation for each new client relationship, we’ve put together this agency/client onboarding checklist. The most powerful tool for WordPress agencies: Automattic for Agencies provides a streamlined way to offer elite WordPress hosting, plugins, and services to clients while improving operations and bolstering income. Work more efficiently with site management from a central dashboard, bill clients more intuitively with the Build-a-Cart Referrals feature, and collect commissions for using the top-tier tools you already recommend to clients. Learn more here. 1. Perform in-depth research on the client If you’ve closed a new deal, you’re probably already familiar with your client’s basic needs. Perhaps they even outlined a good bit about their market position, challenges, and project objectives. Now it’s time to go a bit further and take an outside, independent view. How the client sees themselves may be much different than a third-party perspective. Wrestling with these differences is key to not only creating an end product that the client loves, but creating one that the market understands and loves as well. Begin by taking a fresh look at the client’s current website and writing down your interpretation of their mission and vision, as well as your perception of their products and company size. Compare this to how the client talks about the same subjects to identify how you can better present their business to site visitors. Then, zoom out even further. Look into the industry at large, including market size, growth trends, and potential developments. These factors make it easier to anticipate the challenges and opportunities clients face. Getting a grasp on key competitors helps, too. Assess their strengths and weaknesses, and determine what makes the client stand out amongst them. What seems just the same as everyone else? Beyond visiting your client’s and competitors’ sites and social media, you’ll likely want to invest into some more advanced tools. Crunchbase works well for finding out company information, funding rounds, and market trends. Search engine research tools — ahrefs, SEMRush, Moz, and others — can provide fairly in-depth details about your new client’s current standing in the market and that of key competitors. 2. Mail a personalized welcome package When bringing on a new client, you should also send over a personalized welcome package to make them feel valued from the outset. A welcome package should contain key project details, like an overview of the team members working on the account, the project timeline, and any immediate next steps. This helps set clear expectations and gives the client a roadmap for what’s to come. This is also an opportunity to explain the agency’s workflow and the tools that will be used. If your team uses project management software like Asana or Trello and communication platforms like Slack or P2, now is the time to introduce your clients to them. Offering tutorials or access links will help them get used to the tools right away. And don’t forget to include a handwritten note or a personalized message that addresses the client by name and acknowledges their specific needs or goals. Adding a personal touch shows that you’ve put thought into the package and that it’s not some generic thing. Each welcome package doesn’t have to be entirely bespoke, though. In particular, if you work with a high volume of clients, you might create pre-packaged onboarding kits with various swag, templated instructions, and onboarding docs that are largely the same. Then, you can include branded shipping materials, leaving space to add personalized items unique to each client. 3. Send a client onboarding questionnaire Sending a client onboarding questionnaire is essential for understanding the client’s specific needs, preferences, and expectations. And it ensures that an agency knows exactly what the client’s goals are from the start. But wait, shouldn’t you already know a lot of this from the sales pitch? Yes and no. Depending on the scope of the pitch, you may not have gotten very deep into details. And even so, this is your chance to ensure that the handoff from sales to operations doesn’t result in a fatal miscommunication. Plus, since the sales process can sometimes be unpredictable and less linear, having a standardized questionnaire gives your operations team a consistent base to work off of for every project. But instead of annoying your new client by asking the same questions as your sales team, you might pre-fill answers to some of the things you already know. You might say, “We’ve filled out part of the questionnaire based on our understanding of your current situation. Did we get it all right? Please point out what we got wrong or expand on our understanding.” What’s included in the questionnaire will depend on the industry and the client but generally, it’s good to gather details about things like: Target audience Brand voice Project goals Staff capabilities and contacts (Do they have internal programming, marketing, and sales teams that your agency will work directly with?) Specific KPIs they want to focus on The questions should be designed to help fully understand the client’s business and any challenges they foresee. While it’s important to gather detailed information, the questionnaire should be thorough, yet not overwhelming. Focus on key areas like project scope, timelines, communication preferences, and any existing materials the client wants to share. A well-structured questionnaire helps set clear expectations and avoids scope creep. A mix of open-ended questions and more structured options like yes-or-no or multiple-choice is helpful, too. Open-ended questions allow people to express their thoughts and provide insights that aren’t captured otherwise, while specific questions help quickly gather essential data. 4. Collect all necessary logins and access Another thing to think about when bringing on a new client is providing logins and access credentials for management platforms and communication tools. But this goes both ways. If the client has an existing website, they’ll need to provide access, and the agency will likely need to manage migration. For Automattic for Agencies partners, this process is streamlined. Partners receive professional migration support, alongside flexible billing and a centralized dashboard. Plus, there’s an exclusive, dedicated support hub with rapid issue resolution for all Automattic products. Begin this information sharing process by listing all the access points the team will need, like website credentials, hosting accounts, social media logins, analytics tools, CRM systems, and any third-party integrations. Then, use secure methods for sharing credentials. Avoid unsecured channels like email. Instead, use password management tools like LastPass and 1Password. These tools make it easy to share access securely without anyone revealing passwords directly. Work with the client to determine who needs access to different tools and platforms. Everyone should not have the same access. Set up roles and permissions according to each team member’s responsibilities to minimize security risks. 5. Assign a dedicated onboarding specialist Assign a dedicated onboarding specialist to ensure nothing is missed during this process and that clients feel supported and valued right from the start. To do this, select someone who is well-versed in the agency’s processes, has strong communication skills, and can effectively manage client expectations. This person will serve as the primary point of contact. The onboarding specialist should then work closely with the client to understand their specific needs, goals, and challenges. The specialist can then communicate this information back to the team. This doesn’t have to be reserved for just the onboarding process. Continuing to offer support, addressing issues that arise, and ensuring the client feels comfortable and confident as the project progresses is essential to a winning client management strategy. 6. Conduct a kickoff meeting with the client A kickoff meeting is a pivotal step in client onboarding, too. And it can set the tone for the entire project. A good meeting takes all the data gathered during the information-gathering steps and presents it to the client and the agency team to make sure everyone is fully on the same page. It also provides an organized way to introduce new agency team members to the client or officially pass things off between teams. To do this right, create a detailed agenda for the big meeting covering all essential topics like introductions, project scope, timelines, communication preferences, and key deliverables. Share this agenda with the client ahead of time to help them prepare and to ensure the meeting stays on track. Once in the meeting, introduce all key team members involved in the project, and invite the client to do the same with their team. Then, clearly articulate the project’s goals, scope, and key milestones to the client. Use this time to ensure there’s a shared understanding of what success looks like, addressing any potential challenges upfront to prevent scope creep and manage expectations effectively. This also gives the client a chance to interject with revisions or clarifications. Go over the project timeline at this point and identify when key deliverables can be expected. Then, double check preferred communication methods and set expectations for response times. Determine how often meetings or check-ins will occur and clarify who will be responsible for different aspects of communication to avoid misunderstandings. At the end of the meeting, be sure to leave time for the client to ask questions or raise concerns. 7. Hold an internal meeting to align on the project After the client kickoff meeting, hold an internal meeting to discuss what was learned and to put together action items. It doesn’t need to be elaborate, but it should include everyone who will be involved on the client’s project. Start by recapping the main points from the client kickoff meeting, focusing on the client’s goals, expectations, and any specific requirements they’ve shared. Be sure to clearly define each team member’s role and responsibilities within the project as well. Assign specific tasks and make sure everyone understands their part in the overall project plan. Go over the project timeline in detail. Point out major milestones, deadlines, and dependencies. Address any potential bottlenecks early and adjust the timeline if necessary. If more information from the client is needed before moving on to the next step in the project now is the time to figure that out — not right before it’s due. Then establish how the team will communicate internally about the project, including preferred tools (like Slack or project management software) and meeting schedules. Decide on the frequency of internal check-ins and ensure that everyone knows how to escalate issues if they arise. 8. Create a detailed project journey and timeline The next task is to create a roadmap of sorts that details how the project will be carried out (and when). Break the project down into clear, distinct phases. Each phase should include specific tasks and milestones that need to be completed before moving on to the next. And set milestones for each phase so progress stays on track. Assign realistic deadlines to these milestones to keep the project on schedule, accounting for potential delays. Also clearly outline what deliverables are expected at each stage of the project. Be clear about the format, content, and criteria for acceptance, and communicate these with the team and the client. Mark dependencies clearly along the timeline. This gives your client plenty of time to provide whatever information is necessary well before that portion of the project is due. Plan for regular check-ins and feedback loops, too. And allot enough time for the client to review what’s been completed and provide input. 9. Establish reporting metrics and schedule Set clear reporting metrics and a consistent schedule to keep the agency and client informed about project progress. To do this, determine the most relevant key performance indicators (KPIs) that align with the client’s goals. These could be metrics like website traffic, conversion rates, social media engagement, return-on-investment (ROI), or other project-specific deliverables. Use what makes the most sense for the client. And be sure to use tools that accurately track and report on the selected KPIs. Platforms like Google Analytics can aggregate data into a single, easy-to-read format. And these reports can be easily exported to different specifications. If the client is in the ecommerce space and relies on WooCommerce, making use of the built-in analytics helps keep tabs on performance. WooCommerce support is included in Automattic for Agencies as well. Don’t just focus on the numbers, though. Add qualitative insights to these reports. Explain what the metrics mean, highlight any significant changes, and provide recommendations for next steps. This context helps the client understand the data and make informed decisions. And lastly, as the project progresses, revisit and adjust the KPIs if necessary. If the client’s goals evolve or new challenges arise, tweak the metrics to ensure they continue to provide the information that’s needed. 10. Provide a client portal that’s genuinely useful A client portal offers a base hub for communication. But customizing this to your client’s needs can improve things even further. Yes, it takes more time upfront, but it can be well worth it. To do this, make the portal a one-stop shop for all project-related information, including contracts, timelines, deliverables, progress reports, and invoices. Centralizing these documents means clients can easily find what they need without having to dig through emails. Incorporate features like live chat, di"
