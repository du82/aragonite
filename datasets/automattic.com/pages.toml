full_description = "The Automattic Creed/I know there’s no such thing as a status quo I know there’s no such thing as a status quo We should never do something just because that’s the way it’s been done before. Decisions in the past were (hopefully) made with the best information available at the time, but if we’re always learning then our future selves will be infinitely better suited to discern and decide a course of action. (Corollaries: If you are not embarrassed by your old code, you’re not learning enough. If you’re not embarrassed when you ship your first version, you waited too long.) Work from first principles, and make sure you understand (really understand) what came before you. « Return to the creed"
