title = "Work With Us – Automattic"
description = "Want to make the web a better place for more than a billion people each month? We’re hiring."
full_description = "Work with us from wherever you like Explore the remote job opportunities at Automattic. Work from anywhere, and make the web a better place for everyone, everywhere. Check out today’s open jobs. View open jobs We’re 1,774 Automatticians in 90 countries speaking 116 languages. We democratize publishing and commerce so anyone with a story can tell it, and anyone with a product can sell it, regardless of income, gender, politics, language, or country. Our hiring process This is our standard process; however, the hiring steps may differ by role to ensure we choose candidates who will thrive as Automatticians. Application You submit a formal application for a current job opening, giving us a sense of your communication style. We assess based on criteria that vary depending on the opening and the needs of the team, and pay close attention to your answers — so share as much relevant information as possible! Interview One of the first steps in the application process is a Slack or Zoom interview. While some roles start with a written interview on Slack, others require Zoom interviews, so we can get to know you better live. Trial Our jobs involve a paid trial in the application process, which is a short project or set of tasks that will be assessed by our hiring teams. You will have the chance to work on something that’s closely aligned with the role you’re interviewing for, and tackle a specific, real problem. Final Interview Once a candidate successfully completes their trial, many teams require a final interview — typically conducted by an executive leader within the business unit — before proceeding to the offer stage. The Offer Our HR folks will share feedback from the hiring process and tender a formal offer to join Automattic — one that takes account of your compensation expectations, interview feedback, work experience, and trial performance. Welcome aboard! Learn more Open jobs We value diversity, equity, and inclusion At Automattic, we want people to love their work and show respect and empathy to all. We welcome differences and strive to increase participation from traditionally underrepresented groups. Our DEI committee involves Automatticians across the company and drives grassroots change. For example, the group has facilitated private online spaces for affiliated Automatticians to gather, and helps run a monthly DEI People Lab series for further learning. Diversity, Equity, and Inclusion is a priority at Automattic, though our dedication influences far more than just Automatticians: we make our products freely available and translate our products into and offer customer support in numerous languages. We require unconscious bias training for our hiring teams and ensure our products are accessible across different bandwidths and devices. Learn more about our dedication to diversity, equity, and inclusion and our Employee Resource Groups. “I am a creative. What I do is alchemy. It is a mystery. I do not so much do it, as let it be done through me.” Jeffrey Zeldman Read more Our remote first-culture This isn’t your typical work-from-home job. Everyone works from the location they choose, during the hours they choose. We’re spread out all over the world. We track about 70 percent of our projects on P2-themed WordPress.com blogs, 25 percent in private chat rooms, and the rest on Slack. Because of the geographic variance, we’re active 24/7. But don’t let that worry you. This is not a work-’til-you-drop place. We encourage work-life balance, and care about the work you produce, not the hours you put in. Read more Why you’ll love working here Making the web a better place is rewarding in its own right, but we also provide professional growth, an open vacation policy, generous parental leaves, wellness support, sabbaticals, and more. Our main benefits are listed here. Additional benefits vary by location. Read more We also meet(up) live Since the pandemic, we’ve focused on smaller groups, division meetups, and so on, that accomplish bonding and coworking on a manageable scale. We’re also bringing back full-company meetups, holding one every five years; the next, coming in 2025, will take place in Anaheim, California. Other awesome places we’ve met include San Francisco, California; La Paz, Mexico; Oracle, Arizona; Breckenridge, Colorado; Mont-Sainte-Anne, Québec; Seaside, Florida; Budapest, Hungary; San Diego, California; Santa Cruz, California; Park City, Utah; Whistler, Canada; Orlando, Florida; London, England; Dubai, United Arab Emirates; Madrid, Spain; Amsterdam, The Netherlands; Montreal, Québec; and many more.In addition to our larger meetups, individual teams meet for five to seven days to brainstorm team-level strategy and bond in locales ranging from Boulder to Buenos Aires, Las Vegas to Lisbon, Montréal to Mexico City, and Vienna to Vietnam. If you join our merry band, expect to travel three to four weeks per year. Read more Read job application tips from Automattic’s Talent team, learn about our hiring process, and discover what to do after applying to Automattic."
