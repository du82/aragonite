["https://automattic.com/for-agencies"]
title = "For Agencies – Automattic"
description = "Welcome to a new era of partnership with Automattic. We’re on a mission to help your agency prosper and thrive with the best of what Automattic has to offer."
full_description = '''Looking to switch from WP Engine? Learn More Blog Log in Join Welcome to a new era of partnership with Automattic Become an Automattic partner and gain access to discounted pricing, commissions on referrals, premier support, and cutting-edge tooling so you can get the most out of our suite of best-in-class products. Join the program Watch the video See why the best WordPress agencies pick Automattic for Agencies World-Class Hosting Scalable hosting solutions for every client Whether you’re building new sites or migrating existing ones, our infrastructure is the perfect place to host them — built specifically for WordPress. Limited time offer: Migrate your sites to Pressable or WordPress.com and earn up to $10,000 From now until July 31, 2025, you’ll receive $100 for each site you migrate to Pressable or WordPress.com, up to $10,000. If you’re a WP Engine customer, we’ll also cover any costs associated with breaking your contract. Contact us to learn more ↗ See full terms ↗ *The migration limit is $10,000 for WP Engine and $3,000 for other hosts. We needed a hosting provider that was as knowledgeable about WordPress as we are. With Pressable’s affiliation with Automattic, the same people behind WordPress.com and WordPress VIP, we knew we’d found the right home for our client portfolio. Ben GiordanoFounderfreshysites.com ↗ WordPress.com has been crucial to my agency’s growth. Its intuitive UI allows me to quickly create sleek, functional websites for my clients, and their reliable hosting and support enable me to rest easy, knowing my sites are in good hands. Brian LalliPresidentmoonrooster.com ↗ WordPress.com really stands out with its exceptional performance and strong security. It’s a versatile platform that’s great for users at any skill level, and their support team is always incredibly helpful. For managed sites, we definitely think WordPress.com is the way to go. Sonia GaballaPartnernudge.design ↗ We aimed to provide clients with a reliable hosting service we could endorse without hesitation, ultimately resulting in satisfied clients. We found that service with WordPress.com. Ajit BohraFounderlubus.in ↗ As an agency with hundreds of clients, Pressable changed the game for our ability to grow as a business and offer best-in-class products for our clients. With fantastic support, superior uptime, and solutions to make even the largest challenges possible, Pressable is always there. Justin BarrettDirector of Technologyautoshopsolutions.com ↗ Flexible Marketplace Boost your income with a flexible marketplace We recognize agencies work with clients in different ways. Purchase products directly and enjoy volume discounts, or refer them to clients at retail price to earn recurring commissions. Exclusive volume discounts Get substantial discounts when you purchase WordPress.com and Pressable hosting, Woo Extensions, and Jetpack products directly. Centralized management Purchase and manage all Automattic products and licenses from a central place. Consolidated billing Each month, you’ll get a single bill for any active products issued in the Automattic for Agencies dashboard. Earn commission on client purchases Refer our products to your clients and get up to a 50% commission on those client purchases. Build a cart of products and send to clients Tailor your referral order to meet the needs of each client. Choose from over 60 products and hosting, compile your cart, and send the request for payment within seconds. Upfront commission visibility See your estimated commissions within every referral order, so you’re never left guessing on how much you’ll earn. Uncomplicated payouts Commissions are paid out every quarter. Simply add your bank details and tax documentation and you’re good to go. Harness Our Network Expand your reach and grow your business Get exclusive access to multiple agency directory listings across Automattic brands and connect with new clients. Showcase your expertise Define your industry, services, budget, and location to help clients find you. Expand your reach Grow your business with placement in multiple directory listings for Woo, Jetpack, WordPress.com, and Pressable. Get found Harness the power of Automattic’s network to get new client leads. More Benefits Await But wait, there’s more We’re on a mission to help your agency prosper and thrive with the best of what Automattic has to offer. Dedicated support Support hub with rapid issue resolution for many popular Automattic products. Improved workflow Centralize your billing and manage all of your clients’ sites and licenses from one dashboard. Grow your eCommerce business Get the support, services, and expertise you need to help your clients sell on WooCommerce. Professional migrations support Get priority individual support from our team of expert Happiness Engineers for migrating your sites to our platform. Flexible billing to suit your needs We bill monthly and only for used products. Billing stops immediately when you stop working with a client. Product evolution Get regular product updates and early access to new launches. Let’s Partner Ready to join the program? Sign up now and become an Agency Partner. The Automattic for Agencies program is ready to help you boost your business. Join the program Frequently Asked Questions What is Automattic? Automattic is the company behind WordPress.com, WooCommerce, WordPress VIP, Pressable, Jetpack, Tumblr, and more. It is known for its contribution to the open-source WordPress project and offers a range of products and services related to publishing, e-commerce, and security. What is Automattic for Agencies? Automattic for Agencies is the ultimate partnership to access agency pricing, referral earnings, premier support, and cutting-edge tooling for agencies using WordPress.com, Pressable, WooCommerce, Jetpack, and more. Joining is cost-free. How can our agency benefit from partnering with Automattic? By joining the Agency program, your agency will get access to specialized support, economic incentives on Automattic products, training, and resources that could help improve the deployment of Automattic products on sites, increase operational efficiencies, and enhance your offerings to clients. For more details, please check the Agency Partner Earnings page. How do I join? We’re excited to welcome agencies to sign up and take full advantage of our offerings. As participants, you’ll gain immediate access to new tools and resources crafted to enhance your work with clients. Your expertise and input will be instrumental in continuously improving the program to meet the diverse needs of agencies across different sizes and specialties. Sign up for the program today and start benefiting from our specialized tools and resources tailored just for you. Are there any costs associated with joining the program? Joining the program has no associated costs. Your progression within the program is propelled by the cumulative revenue you generate within Automattic’s ecosystem. As you continue integrating or recommending our products for client sites, your agency will unlock enhanced benefits and support, allowing you to derive even greater value from the partnership. Do I need to host my sites with Automattic to join? No. You’re free to participate in the Automattic for Agencies program with whichever host you prefer. Are there exclusive features or services available to program members? Agency partners will receive access to the Automattic for Agencies dashboard. This platform allows agencies to manage their websites conveniently from any hosting location. Additionally, members are entitled to economic incentives on various Automattic products and can benefit from dedicated educational resources and technical support services. What’s the difference between the Automattic Affiliate Program and the Automattic for Agencies Program? Can I join both? The Automattic Affiliate Program provides an opportunity for content creators, influencers, educators, businesses, or anyone with an audience to earn additional income by promoting Automattic products, including WordPress.com, WooCommerce Marketplace, Pressable, Sensei, WP Job Manager, Jetpack, and more. The program is designed for those creating content to easily generate commissions and earn one-time, lump-sum payments for every referral. Automattic for Agencies, on the other hand, is designed for agencies who sell custom, 1:1 solutions based on a client’s unique needs. This would typically involve recommending, implementing, and managing Automattic products—including WordPress.com, WooCommerce, WordPress VIP, Pressable, and Jetpack—on behalf of their clients. The program has been set up to offer a suite of tools and services that streamline the website management process for multi-user teams and expand revenue opportunities through profit sharing and bulk discounts. It’s certainly possible to join both programs, taking advantage of the benefits of each one to target different audiences, but members will need to make sure they’re following the respective guidelines. Agencies in particular should note that if they’re hosting a client’s site through their Automattic for Agencies account, they can’t simultaneously receive affiliate commissions for that same client. We recommend taking a look at the terms of service for more details. Join the program Still have questions? Contact us Contact Automattic for Agencies Your Name(required) Email Address(required) What Automattic product(s) are you curious about? WordPress.com hosting Pressable hosting Jetpack WooCommerce Automattic for Agencies in general How can we help? Submit Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); Contact Automattic for Agencies Name(required) Email(required) Number of sites What Automattic hosting product are you considering? Select one option WordPress.com Pressable Don't know Is there anything else you would like to share? Submit Δdocumen