["https://automattic.com/about"]
title = "About Us – Automattic"
description = "Around the world, building the internet’s operating system—and a better way to work. In a world of tech companies fighting for growth at any cost, imagine one that gives away its most successful product for free—and has been doing it for 20 years. Whereas an increasing number of tech firms spend their energy locking customers into closed,…"
full_description = "About Us Around the world, building the internet’s operating system—and a better way to work. In a world of tech companies fighting for growth at any cost, imagine one that gives away its most successful product for free—and has been doing it for 20 years. Whereas an increasing number of tech firms spend their energy locking customers into closed, ever-worsening platforms designed to extract value at any cost (including the customer’s right to privacy), picture yourself working at a company that prioritizes and protects our customers’ freedom to use all the tools of the open web. Including those we don’t make ourselves. With a founding product so successful, schoolchildren know it by name. A product so ubiquitous, it powers over 40% of all websites. And that’s just one of the things we make. Welcome to Automattic. We’re the people behind WordPress.com, WooCommerce, Tumblr, Simplenote, Jetpack, Longreads, Day One, PocketCasts, and more. We believe in making the web a better place. There are 1,776 of us Automatticians in nearly every corner of the globe, speaking 116 different languages. Enriched by this diversity, we’re united by a singular mission: to democratize publishing, commerce, and messaging so anyone with a story can tell it, anyone with a product can sell it, and everyone can manage their communications from a single source. In short, we help maintain a balance in society, creating and continually refining powerful tools people can use to compete fairly—regardless of income, gender, politics, language, or where they live in the world. Speaking of which, where in the world would you like to work? A better way to work. In a time when companies are demanding employees return to the office or lose their jobs, we’ve been a remote-first company since our founding in 2005. Meaning we don’t force Automatticians to work in the same building and smell each other’s sandwiches at lunchtime, and we don’t tell them where or when to work. That’s the virtue of our asynchronous, fully distributed ecosystem. We value impact, not how much time you put in. Effectiveness over busyness. Quality, not quantity. We firmly believe that work can and should be fun while also being challenging and providing essential services. That workers should be trusted by giving them autonomy over the choices they make and the projects they take on. And that makers deserve to see real-world results of their efforts. We believe in Open Source, and the vast majority of our work is available under the GPL. And we’ve proven you can build an open-source-driven business—earning half a billion $US in annual revenue!—while providing top shelf, future-friendly services that help our customers build their own businesses, tell their own stories, and manage their work and family lives. If you’re independent, creative, skilled, smart, and looking to do the most meaningful work of your career, on your own turf and your own terms, and with a high-impact footprint improving the lives of millions of people worldwide, we’d love to hear from you . . . and you’ll love working here. Automattic is a Most Loved Company and Disability Confident Committed. (Here’s what that might mean for you.) Learn more about our dedication to diversity, equity, and inclusion and our Employee Resource Groups. We Iterate 1,699 Deployments made this week view graph Deploys by day in the past week We Communicate 476,891 Messages sent this week view details How we communicate Slack Messages: 450,951 P2 Posts: 13,171 P2 Comments: 12,769 We Make People Happy 22,193 Support interactions this week view graph Support interactions by day The Team We call ourselves Automatticians Where We Are (embiggen)"
year_published = 2005
year_updated = 2025
