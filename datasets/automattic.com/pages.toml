["https://automattic.com/fieldguide/howdy/get-scheduled"]
title = "Get Scheduled – Automattic"
description = "Next: Get Social → Employee Field Guide"
full_description = "Get Scheduled Home > Employee Field Guide > Howdy! > Get Scheduled Understanding how to organize your calendar. Google Calendars All Automatticians receive an @a8c.com account, which is actually a Google G Suite account. We use it for the following services: Google Calendar Google Docs Email The Field Guide G Suite page has more guidance on adding calendars to your account. We use calendars for projects, meetups, and to mark our time off. Time off We have no official company holidays and we have no set number of vacation days. We encourage employees to take at least 25 days of time off per year. Time off includes vacation, sick days, holidays, and time off to do errands. For more information on how to schedule time off, see the Field Guide’s ‘Time Off’ section, on the Vacations page. Time off work is essential to your health and wellbeing, so it’s important for us that all Automatticians take time AFK (Away from Keyboard) to relax and recharge. Setting up and balancing your work day As an Automattician, you should plan to work about 40 hours a week. Most teams run on eight-hour workdays, but there is great variation between teams, so check with your team lead. We encourage you to find a schedule that works best for you. Make sure not to go overboard with work time, especially when you first start out. Check out these pages with tips for Finding Balance, Managing Internal Notifications and Dealing with Digital Distractions. The ability to balance work and family life in the midst of any kind of crisis is not easy. Make sure you’ve read over the In Case of Emergency guidelines to familiarize yourself with our emergency procedures. Please also share your contact info with a8c for an emergency, as well as share a8c info with your family/emergency contact. Please feel welcome to reach out to your team lead, or to anyone in The Human League (your friendly HR team) if you have any questions. Weekly updates The process for this will vary among teams. In general, Automatticians post weekly updates on their team P2, and a team member then posts a weekly update to the Thursday Updates P2. Thursday Updates is a great P2 to follow to keep up to date on what other teams are working on and what they’ve accomplished. Next: Get Social → Employee Field Guide First Day at AutomatticHowdy!Get AcquaintedGet ConnectedGet DressedGet Going, You’ve Got This!Get HappyGet OrganizedGet ScheduledGet SocialGet TerminologyGet Travelling"
