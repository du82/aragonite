full_description = "Get Going, You’ve Got This! Home > Employee Field Guide > Howdy! > Get Going, You’ve Got This! You’re an A11n now: get in the know As you get started with all things Automattic, we wanted to take a minute to introduce you to some common Automattic things and insider info. You’ll find your new co-workers reference these quite a bit. Welcome to the weird, but most often wonderful, world of Automattic! You may also find yourself involved in some of these fun and quirky company rituals (and many others, not listed here) before you know it. Contributing to Blank in a Blank. Sharing your Office Today. Sending a gift to an a11n on the other side of the world during the annual a8c Holiday Gift Exchange. Running with your colleagues during the Sun Never Sets on Automattic Relay. Chuckling over So many puns from days gone by, when you need a good laugh. Thanks to Karen for this great reminder. … And that brings us to the end of Welcomemattic, and to the beginning of your new role here at Automattic! Remember to embrace the Automattic Way, and keep putting one foot in front of the other. For anything else you might need to know, don’t hesitate to ask your fellow Automatticians or delve in to a world of knowledge via MGS. Next: Get Happy → Employee Field Guide First Day at AutomatticHowdy!Get AcquaintedGet ConnectedGet DressedGet Going, You’ve Got This!Get HappyGet OrganizedGet ScheduledGet SocialGet TerminologyGet Travelling"
