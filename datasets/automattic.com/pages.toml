["https://automattic.com/fr/privacy"]
title = "Politique de confidentialité – Automattic"
description = "Votre confidentialité est à nos yeux d’une importance capitale. Chez Automattic, nous avons quelques principes fondamentaux : Nous sommes attentifs aux informations personnelles que nous vous demandons de nous fournir ainsi qu’à celles vous concernant que nous recueillons dans le cadre de nos services. Nous ne les conservons que pendant la durée nécessaire. Notre objectif est…"
full_description = "Politique de confidentialité Votre confidentialité est à nos yeux d’une importance capitale. Chez Automattic, nous avons quelques principes fondamentaux : Nous sommes attentifs aux informations personnelles que nous vous demandons de nous fournir ainsi qu’à celles vous concernant que nous recueillons dans le cadre de nos services. Nous ne les conservons que pendant la durée nécessaire. Notre objectif est de vous permettre de contrôler le plus simplement possible quelles informations sur votre site Web sont partagées publiquement (ou conservées en privé), indexées par les moteurs de recherche et supprimées définitivement. Nous vous aidons à vous protéger contre les exigences excessives des pouvoirs publics concernant vos informations personnelles. Notre objectif est de vous garantir une transparence totale sur la façon dont nous recueillons, utilisons et partageons vos informations personnelles. Vous trouverez ci-dessous notre politique de confidentialité, qui intègre et clarifie ces principes. Qui sommes-nous et que couvre cette politique ? Salutations ! Nous sommes à l’origine d’une variété de produits et de services conçus pour permettre à chacun — des blogueurs aux photographes, en passant par les petits entrepreneurs et les grandes entreprises — de profiter pleinement de la puissance et des promesses de l’Internet ouvert. Notre mission vise à démocratiser la publication et le commerce afin que toute personne ayant une histoire à raconter puisse le faire et que chacun puisse gagner sa vie en concrétisant son idée géniale. Nous croyons au pouvoir de l’Internet ouvert avec un code qui est open source et nous sommes fiers de dire que la grande majorité de notre travail est disponible sous licence publique générale (« GPL »). Contrairement à la plupart des autres services, parce que notre code GPL est public, vous pouvez en fait le télécharger et y jeter un coup d’œil pour découvrir son fonctionnement. La présente Politique de confidentialité s’applique aux informations vous concernant que nous recueillons lorsque vous utilisez le service : Nos sites Web (y compris automattic.com, wordpress.com, jetpack.com, woocommerce.com, crowdsignal.com, gravatar.com, intensedebate.com, vaultpress.com, akismet.com, simplenote.com, simperium.com, leandomainsearch.com, cloudup.com, longreads.com, atavist.com, mailpoet.com, automatewoo.com, jetpackcrm.com, happy.tools, wpcourses.com, wpscan.com, newspack.pub et wp.cloud) ; Nos applications mobiles (y compris l’application mobile WordPress pour Android et iOS) ; Nos autres produits, services et fonctionnalités Automattic qui sont disponibles sur ou via nos sites Web (par exemple, les plans WordPress.com, la fonctionnalité Paiements, le bloc Payer avec PayPal, Jetpack, l’extension Woo Shipping & Tax, Gravatar, le système de gestion des commentaires IntenseDebate, les plans Akismet, Simplenote, Simperium, Cloudup, Longreads, MailPoet, AutomateWoo, Jetpack CRM, Happy Tools, les cours WordPress.com, WPScan et Newspack) ; Les sites Web des autres utilisateurs qui utilisent nos Services, pendant que vous êtes connecté à votre compte chez nous. La présente politique de confidentialité s’applique également aux informations que nous recueillons lorsque vous postulez à un emploi chez Automattic ou dans l’une de nos filiales. Tout au long de cette Politique de confidentialité, nous désignerons collectivement nos sites Web, applications mobiles et autres produits et services sous le terme de « Services ». Et si vous souhaitez en savoir plus sur la société Automattic qui est responsable du traitement des informations vous concernant, consultez la section ci-dessous sur les responsables du traitement et les sociétés responsables. Veuillez noter que cette politique de confidentialité ne s’applique à aucun de nos produits ou services, comme Tumblr, qui ont une politique de confidentialité distincte. Nous vous expliquons ci-dessous comment nous recueillons, utilisons et partageons les informations vous concernant, ainsi que les choix qui s’offrent à vous en ce qui concerne ces informations. Licence Creative Commons Sharealike (Partage des conditions initiales à l’identique) Nous avons décidé de mettre à disposition cette Politique de confidentialité sous une licence Creative Commons Sharealike (Partage des conditions initiales à l’identique). Vous pouvez obtenir une copie de cette politique de confidentialité et des autres documents juridiques sur GitHub. Vous pouvez bien entendu la copier, l’adapter et la réutiliser pour votre propre usage. Assurez-vous simplement de réviser la langue afin que votre politique reflète vos pratiques réelles. Si vous l’utilisez, nous apprécierions qu’un crédit et un lien vers Automattic figurent sur votre site. Les informations que nous recueillons Nous ne recueillons des informations vous concernant que si nous avons une raison de le faire : pour fournir nos Services, communiquer avec vous ou améliorer nos Services, par exemple. Nous recueillons ces informations à partir de trois sources : si et quand vous nous fournissez des informations, automatiquement par le biais de l’exploitation de nos Services, et à partir de sources extérieures. Passons en revue les informations que nous recueillons. Les informations que vous nous fournissez Il n’est probablement pas surprenant que nous recueillions des informations que vous nous fournissez directement. Voici quelques exemples : Informations de base du compte : nous vous demandons des informations de base afin de configurer votre compte. Nous demandons notamment aux personnes qui s’inscrivent pour créer un compte WordPress.com de fournir une adresse e-mail et un mot de passe, ainsi qu’un identifiant ou un nom, et c’est tout. Vous pouvez nous fournir d’autres informations — comme votre adresse et d’autres informations que vous souhaitez partager — mais nous n’en avons pas besoin pour la création d’un compte WordPress.com. Informations sur le profil public : si vous avez un compte chez nous, nous recueillons les informations que vous fournissez pour votre profil public. Par exemple, si vous avez un compte WordPress.com, votre nom d’utilisateur fait partie de ce profil public, au même titre que toute autre information que vous mettez dans votre profil public, comme une photo ou une description « À propos de moi ». Les informations de votre profil public sont justement publiques. Gardez cela à l’esprit lorsque vous déciderez des informations que vous souhaitez inclure. Informations de paiement et coordonnées : vous pouvez nous faire parvenir vos informations de paiement et les coordonnées associées de plusieurs manières. Par exemple, si vous achetez quelque chose chez nous ou si vous générez des revenus par le biais de votre site, nous collectons des informations pour traiter ces paiements et vous contacter. Si vous achetez quelque chose chez nous — un abonnement à un plan WordPress.com, un thème premium, un domaine personnalisé, un pack Longreads — ou si vous payez des frais à une personne ou une entreprise par le biais de son site WordPress.com (par exemple via la fonction Paiements ou le bloc Payer avec PayPal), vous fournirez des informations personnelles et de paiement supplémentaires comme votre nom, les informations de votre carte bancaire et vos coordonnées. Nous conservons également un relevé des achats que vous avez effectués. Si vous utilisez nos services d’eCommerce (y compris la boutique sur WordPress.com, Woo Shipping & Tax et WooPayments), vous devrez créer un compte WordPress.com ou vous connecter à un compte existant et, pour certains services, fournir l’URL de votre site. Vous pouvez également nous fournir des détails financiers pour mettre en place une intégration de paiements, comme l’adresse e-mail de votre compte Stripe ou PayPal ou vos informations bancaires. En outre, si vous utilisez WooPay pour effectuer des achats sur d’autres sites, nous enregistrerons les coordonnées et les informations de paiement communiquées à ce service. Par ailleurs, si vous participez à une opportunité de partage de revenus pour votre site, comme WordAds, vous fournirez des informations supplémentaires, par exemple, un identifiant fiscal ou un autre identifiant afin que nous puissions traiter les paiements qui vous sont destinés. Profil de l’entreprise : certains de nos produits recueillent des informations supplémentaires auprès de vous dans le cadre de la création d’un profil utilisateur/client. Par exemple, si vous êtes un client de la CRM de Jetpack, nous pouvons vous ajouter à notre base de données de relations clients (alimentée par la CRM de Jetpack !) en utilisant les informations que vous nous fournissez, y compris votre nom, votre employeur, votre intitulé de poste ou votre fonction, vos coordonnées et vos communications avec nous. Si vous êtes un utilisateur de Happy Tools, nous utilisons les informations que vous nous fournissez comme votre fuseau horaire et votre localisation, les informations sur votre entreprise et votre équipe, et vos coordonnées, pour configurer votre compte et alimenter les fonctionnalités du Service. Informations sur le contenu : vous pouvez nous fournir des informations vous concernant dans un contenu en version brouillon et publiée (un article de blog ou un commentaire qui comprend des informations biographiques vous concernant, ou tout média ou fichier que vous chargez). Identifiants de connexion : en fonction des Services que vous utilisez, vous pouvez nous fournir des identifiants de connexion pour votre site Web auto-hébergé (comme le nom d’utilisateur et le mot de passe SSH, FTP et SFTP). Les utilisateurs de Jetpack et de VaultPress peuvent nous fournir ces identifiants de connexion afin d’utiliser notre fonctionnalité de restauration en un clic en cas de problème sur leur site, ou pour nous permettre de résoudre les problèmes plus rapidement. Communications avec nous (bonjour !) : vous pouvez également nous fournir des informations lorsque vous répondez à des sondages, communiquez avec nos Happiness Engineers à propos d’une question d’assistance, posez une question dans nos forums publics ou vous inscrivez à une lettre d’information comme celle que nous envoyons par le biais de Longreads. Lorsque vous communiquez avec nous via un formulaire, un e-mail, par téléphone, via un commentaire sur WordPress.com ou autre, nous conservons une copie de nos communications (y compris tout enregistrement d’appel tel qu’autorisé par la loi applicable). Informations sur les candidats à un poste : si vous postulez à un emploi chez nous, c’est génial ! Vous pouvez être amené à nous fournir des informations telles que votre nom, vos coordonnées, votre CV, des références professionnelles ou personnelles, d’autres données professionnelles et liées à l’emploi, ainsi que la vérification de votre autorisation de travail dans le cadre du processus de candidature. Nous pouvons également recueillir des informations complémentaires à votre sujet lors du processus, notamment les vérifications de crédits et d’antécédents (dans les juridictions applicables et seulement pour certains postes). Vous pouvez également nous fournir des informations démographiques lorsque la loi l’exige ou pour soutenir nos initiatives de diversité sur le lieu de travail, notamment votre sexe, vos origines ethniques, votre statut de vétéran ou un quelconque handicap si vous mentionnez volontairement ces informations dans le cadre de votre candidature. Nous recueillons les informations démographiques conformément à la loi applicable et nous ne les demandons pas dans les juridictions où cela est interdit. Nous utiliserons ces informations sensibles uniquement pour prévoir des arrangements en cas de handicap ou de maladie, pour respecter nos obligations légales, pour protéger la santé et la sécurité de nos employés et faciliter nos programmes internes en matière de diversité, d’inclusion et de lutte contre la discrimination. Les informations que nous recueillons automatiquement Nous recueillons également certaines informations automatiquement : Informations de connexion : comme la plupart des fournisseurs de services en ligne, nous recueillons des informations que les navigateurs Web, les appareils mobiles et les serveurs mettent généralement à disposition, notamment le type de navigateur, l’adresse IP, les identifiants uniques des appareils, la langue préférée, le site de référence, la date et l’heure d’accès, le système d’exploitation et les informations sur le réseau mobile. Nous recueillons des informations de journal lorsque vous utilisez nos Services – par exemple, lorsque vous créez ou apportez des modifications à votre site Web sur WordPress.com. Informations sur les transactions : lorsque vous effectuez un achat en utilisant nos Services, nous collectons les informations sur la transaction, tels que les détails du produit, le prix d’achat, ainsi que la date de le lieu de la transaction. Cela inclut le moment où vous achetez un produit vendu par nos soins ou le moment où vous utilisez nos Services (tels que WooPay) pour acheter quelque chose auprès d’un tiers. Informations d’utilisation : nous recueillons des informations sur votre utilisation de nos Services. Nous recueillons notamment des informations sur les actions que les administrateurs et les utilisateurs effectuent sur un site en utilisant nos services WordPress.com ou Jetpack — en d’autres termes, qui a fait quoi et quand (par exemple, [identifiant WordPress.com] a supprimé « [titre de l’article] » à [heure/date]). Notre outil de suivi de l’utilisation de WooCommerce suit également des informations comme votre adresse e-mail, les réglages WooCommerce et PHP, ainsi que des informations sur votre boutique en ligne, comme le nombre total de commandes et de clients. Nous recueillons également des informations sur ce qui se passe lorsque vous utilisez nos Services (par exemple, les pages vues, les recherches de documents d’assistance sur fr.support.wordpress.com, les fonctionnalités activées pour votre site Web, les interactions avec notre barre d’administration et d’autres parties de nos Services) ainsi que des informations sur votre appareil (par exemple, la taille de l’écran, le nom du réseau cellulaire et le fabricant de l’appareil mobile). Nous utilisons ces informations pour, par exemple, vous fournir nos Services, obtenir des informations sur la façon dont les gens utilisent nos Services afin de pouvoir améliorer nos Services, et comprendre et faire des prévisions sur la rétention des utilisateurs. Informations de localisation : nous pouvons déterminer l’emplacement approximatif de votre appareil à partir de votre adresse IP. Nous recueillons et utilisons ces informations pour, par exemple, calculer le nombre de personnes qui visitent nos Services dans certaines régions géographiques. Nous pouvons également recueillir des informations sur votre emplacement précis via nos applications mobiles (comme lorsque vous publiez une photo avec des informations de localisation) s"
