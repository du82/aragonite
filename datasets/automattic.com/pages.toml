["https://automattic.com/compensation"]
title = "Compensation – Automattic"
description = "How compensation is determined during the hiring process We ask candidates to share their compensation expectations as part of the application process for the role they are applying for. The ‘starting salary’ ranges for our open roles are included on the Work With Us Page. Please make sure you’ve checked out the salary range for…"
full_description = "Compensation How compensation is determined during the hiring process We ask candidates to share their compensation expectations as part of the application process for the role they are applying for. The ‘starting salary’ ranges for our open roles are included on the Work With Us Page. Please make sure you’ve checked out the salary range for the specific role you are applying for, before sharing this information with us. When receiving an offer, Automattic’s team considers several factors, such as the initial expectations provided, role experience, and feedback during the process in line with the salary range benchmarks internally. We do this to create an equitable and attractive package. Offers are communicated by our HR team, who you will get to meet during the process. Compensation Philosophy We believe compensation is not just a financial transaction but a reflection of our organization’s values. At Automattic, we ensure that our compensation philosophy is a testament to our appreciation for collaboration, transparency, merit, and continuous growth that every Automattician brings to the table, playing a vital role in our collective success. Fairness and equity are at the core of our mission and are mirrored in our pay philosophy and practices. We are a fully distributed company that believes that our talent pool is global rather than local, and we want to attract and retain a diverse and highly talented group of people, wherever they live. We pay global ranges and prioritize internal equity regardless of where someone lives in the world. We want to work with folks who embody our Creed, are motivated by our mission, who want to excel, and who want to do the best work of their careers. When you join us, our commitment to you is that we will reward you in exchange for the impact you make in creating value for customers, being mission-focused, and generating revenue to sustain Automattic’s future. We’ll review your pay regularly (typically every 12–18 months), checking your compensation against the impact of your individual contribution, business performance, and our global ranges (which are expressed and paid in your local currency wherever possible). All of that said, we’re still human and make mistakes and if you think a mistake has been made please don’t hesitate to contact us. We recognize that recharging and thriving are essential for high performance. Self-care is necessary and we want Automatticians to look after themselves—we offer open AFK time off, sabbaticals every five years, wellness support, and other leaves of absence including parental and medical leaves. Our compensation philosophy goes beyond base salary; we’ve created an approach where “I will never stop learning” is embedded in our day-to-day work—we experiment, make mistakes, and learn from them. We also foster a culture where feedback isn’t just encouraged; it’s imperative to make sure we continuously learn, develop, and contribute to an anti-fragile company. We offer 1-1 coaching as well as other learning and development opportunities. We are proud of our generous benefits package."
