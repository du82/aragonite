["https://automattic.com/es/privacy"]
title = "Política de privacidad – Automattic"
description = "Tu privacidad es extremamente importante para nosotros. En Automattic, tenemos algunos principios fundamentales: Nos preocupamos por la información personal que pedimos que nos proporciones y por la que recogemos sobre ti al ofrecer nuestros servicios. Almacenamos la información personal solo durante el tiempo en que es necesario hacerlo. Nuestra intención es que te sea lo…"
full_description = "Política de privacidad Tu privacidad es extremamente importante para nosotros. En Automattic, tenemos algunos principios fundamentales: Nos preocupamos por la información personal que pedimos que nos proporciones y por la que recogemos sobre ti al ofrecer nuestros servicios. Almacenamos la información personal solo durante el tiempo en que es necesario hacerlo. Nuestra intención es que te sea lo más sencillo posible controlar la información de tu sitio web que se comparte públicamente (o se mantiene en privado), la que se indexa por los buscadores y la que se elimina permanentemente. Contribuimos a protegerte de las exigencias excesivas de los gobiernos en cuanto a tu información personal. Queremos ser completamente transparentes sobre la forma en que recogemos, usamos y compartimos tu información personal. A continuación tienes nuestra política de privacidad, que incluye y explica con claridad estos principios. Quiénes somos y qué aspectos cubre esta política ¡Hola! Somos los encargados de una variedad de productos y servicios diseñados para que todos los usuarios (ya sean blogueros, fotógrafos o dueños de pequeñas o grandes empresas) puedan sacar el máximo partido de la potencia y la eficacia de la Web abierta. Nuestra misión es democratizar la publicación de contenido y el comercio para que todo el mundo pueda contar su historia y cualquiera pueda hacer de una gran idea su sustento. Creemos en la idea de impulsar la red pública Internet con código abierto y estamos orgullosos de poder decir que la mayoría de nuestro trabajo está disponible con licencia pública general (“GPL”). Al contrario de lo que pasa con la mayoría de servicios, como nuestro código de GPL es público, puedes descargarlo y mirarlo para saber cómo funciona. Esta política de privacidad se aplica a la información que recogemos sobre ti cuando usas lo siguiente: Nuestros sitios web (como automattic.com, wordpress.com, jetpack.com, woocommerce.com, crowdsignal.com, gravatar.com, intensedebate.com, vaultpress.com, akismet.com, simplenote.com, simperium.com, leandomainsearch.com, cloudup.com, longreads.com, atavist.com, mailpoet.com, automatewoo.com, jetpackcrm.com, happy.tools, wpcourses.com, wpscan.com, newspack.pub y wp.cloud); Nuestras aplicaciones móviles (como la aplicación móvil de WordPress para Android y iOS). Los productos, servicios y funciones de Automattic que tenemos disponibles en nuestros sitios web o a través de ellos (por ejemplo, los planes de WordPress.com, la función Pagos, el bloque Pay with PayPal, Jetpack, la extensión Woo Shipping & Tax, Gravatar, el sistema de gestión de comentarios IntenseDebate, los planes de Akismet, Simplenote, Simperium, Cloudup, Longreads, MailPoet, AutomateWoo, Jetpack CRM, Happy Tools, WordPress.com Courses, WPScan y Newspack). Los sitios web de los usuarios que utilizan nuestros Servicios cuando te conectas a la cuenta que tienes con nosotros. Esta Política de privacidad también se aplica a la información que recopilamos cuando solicitas un puesto de trabajo en Automattic o en una de nuestras filiales. En esta Política de privacidad haremos referencia a nuestros sitios web, aplicaciones móviles y otros productos o servicios conjuntamente como “Servicios”. Si quieres obtener más información sobre la empresa de Automattic responsable del tratamiento de datos sobre ti, consulta la sección de más abajo Responsables del tratamiento de datos y empresas responsables. Recuerda que esta política de privacidad no se aplica a ningún producto o servicio (como Tumblr) que tenga otra política de privacidad. Más abajo explicamos cómo recogemos, usamos y compartimos información sobre ti, además de las opciones que tienes en cuanto a dicha información. Licencia de Creative Commons CompartirIgual Hemos decidido poner esta Política de privacidad a tu disposición con una licencia de Creative Commons CompartirIgual. Puedes conseguir una copia de esta Política de privacidad y otros documentos legales en GitHub. Tienes toda nuestra aprobación para copiarlos, adaptarlos y cambiarles la finalidad según tus necesidades. Solo tienes que comprobar el texto para que tu política refleje tus prácticas reales. Además, si lo haces, te agradeceríamos que nos mencionaras en tu sitio web y añadieras un enlace a Automattic. Información que recogemos Recogemos información sobre ti solo si tenemos un motivo para hacerlo. Por ejemplo, si la necesitamos para proporcionar nuestros Servicios, comunicarte noticias o mejorar nuestros Servicios. Recopilamos esta información de tres fuentes: cuando nos proporcionas información, al usar nuestros Servicios (se recopila automáticamente) y a través de fuentes externas. A continuación, te indicamos la información que recogemos. Información que nos proporcionas Probablemente no te sorprenda que recojamos la información que nos proporcionas directamente. Estos son algunos ejemplos: Información básica de la cuenta: te pedimos información básica para poder configurar tu cuenta. Por ejemplo, pedimos a los usuarios que se registran en WordPress.com para crear una cuenta que nos proporcionen una dirección de correo electrónico y una contraseña junto con un nombre de usuario o nombre real, dependiendo del servicio. Eso es todo. Puedes proporcionarnos más datos (como tu dirección y otros datos que quieras compartir), pero no los necesitamos para crear una cuenta de WordPress.com. Información del perfil público: si tienes una cuenta con nosotros, recopilamos la información que proporcionas para tu perfil público. Por ejemplo, si tienes una cuenta de WordPress.com, el nombre de usuario se muestra en el perfil público junto con otros datos que introduces al crearlo, como la foto o la descripción en «Sobre mí». La información de tu perfil público es pública (como su nombre indica) así que tenlo en cuenta a la hora de decidir qué información quieres incluir. Información de pago y contacto: puedes proporcionarnos la información de pago y contacto asociada mediante varias formas. Por ejemplo, si compras alguno de nuestros productos u obtienes ingresos a través de nuestro sitio, recopilaremos información para procesar esos pagos y ponernos en contacto contigo. Si compras alguno de nuestros productos (como una suscripción a un plan de WordPress.com, un tema premium, un dominio personalizado o un obsequio de Longreads) o si pagas tarifas a una persona o un negocio a través de su sitio de WordPress.com (por ejemplo, a través de la función Pagos o el bloque Pay with PayPal), nos deberás proporcionar más información personal y de pago como tu nombre, la información de la tarjeta de crédito y los datos de contacto. También conservaremos un registro de las compras que hayas realizado. Si usas nuestros Servicios de e-commerce (por ejemplo, la Tienda en WordPress.com, Woo Shipping & Tax y WooPayments), tendrás que crear una cuenta de WordPress.com o vincular una de las que tengas. Además, para algunos de los servicios, tendrás que proporcionar la URL de tu sitio. También es posible que nos proporciones tus datos financieros para configurar la integración de los pagos, como la dirección de correo electrónico de tu cuenta de Stripe o PayPal o los datos de tu cuenta bancaria. Además, si utilizas WooPay para hacer compras en otros sitios, almacenaremos la información de contacto y pago que proporciones a este servicio. También si participas en un reparto de ingresos de tu sitio, por ejemplo, a través de WordAds, deberás proporcionar información adicional, como el número de identificación fiscal u otro identificador para que podamos procesar los pagos que te hagamos. Perfil de empresa: algunos de nuestros productos recopilan información adicional de ti durante la creación de un perfil de usuario o cliente. Por ejemplo, si eres un cliente de Jetpack CRM, podemos añadirte a nuestra base de datos de relaciones con los clientes (con la tecnología de Jetpack CRM) usando la información que nos hayas proporcionado, como tu nombre, empresa, puesto de trabajo o función, tus datos de contacto y tus comunicaciones con nosotros. Si eres usuario de Happy Tools, utilizamos los datos que nos proporciones, como la información sobre tu zona horaria, ubicación, empresa y equipo, así como tus datos de contacto, para configurar tu cuenta y activar las funciones del Servicio. Información de contacto: puede que nos proporciones información sobre ti en borradores y contenido publicado (una entrada de blog o un comentario que incluya información biográfica sobre ti o archivos o elementos multimedia que subas). Credenciales: en función de los Servicios que uses, es posible que nos proporciones las credenciales de tu sitio web autoalojado, como el nombre de usuario y la contraseña de SFTP, SSH y FTP. Puede que los usuarios de Jetpack y VaultPress nos proporcionen dichas credenciales con el fin de usar la función de restauración en un clic si se produce un problema en su sitio para permitirnos solucionar los problemas más rápido. Comunicaciones con nosotros (¡hola!): también puede que nos proporciones información al responder a nuestras encuestas, al comunicarte con nuestros Happiness Engineers para recibir soporte, al publicar una pregunta en nuestros foros públicos o al suscribirte a un boletín como el que enviamos a través de Longreads. Cuando te comunicas con nosotros a través de un formulario o un comentario de WordPress.com, por correo electrónico, por teléfono o de cualquier otra manera, almacenamos una copia de nuestras comunicaciones (incluidas las grabaciones de llamadas en la medida en que lo permita la legislación pertinente). Información de la persona que solicita un puesto de trabajo: si solicitas un puesto de trabajo con nosotros, ¡genial! Como parte del proceso de solicitud, podrías tener que proporcionarnos información como tu nombre, datos de contacto, CV, referencias profesionales o personales, datos relacionados con tu historial laboral o experiencia profesional similar, y verificación del permiso de trabajo. También podremos recopilar información adicional sobre ti durante el proceso, como antecedentes y comprobaciones crediticias (en las jurisdicciones aplicables y solo para determinados puestos laborales). También podrías proporcionarnos información demográfica, si así lo exige la ley o para contribuir con nuestras iniciativas de diversidad en el lugar de trabajo. Esta información puede incluir: sexo, raza u origen étnico, condición de veterano de guerra y estado de discapacidad en caso de que envíes estos datos de forma voluntaria como parte de tu solicitud. Recopilamos información demográfica de conformidad con la legislación aplicable y no la solicitamos en las jurisdicciones en las que podría estar prohibida su recopilación. Solo usaremos esta información confidencial para atender los requisitos de una discapacidad o enfermedad, cumplir con las obligaciones legales, proteger la salud y seguridad de nuestros empleados, e implantar programas internos relacionados con la diversidad, inclusión y lucha contra la discriminación. Información que recogemos automáticamente También recogemos algunos datos automáticamente: Información de registro: del mismo modo que la mayoría de los proveedores de servicios en línea, recopilamos la información que los navegadores web, dispositivos móviles y servidores suelen poner a nuestra disposición, como el tipo de navegador, la dirección IP, los identificadores únicos de dispositivo, la preferencia de idioma, el sitio de referencia, la fecha y la hora de acceso, el sistema operativo y la información sobre la red móvil. Recogemos información de registro cuando usas nuestros Servicios. Por ejemplo, al crear o modificar un sitio web en WordPress.com. Información sobre las transacciones: cuando haces una compra a través de nuestros Servicios, recopilamos información sobre la transacción, como los detalles del producto, el precio de la compra y la fecha y el lugar de la transacción. También lo hacemos cuando compras algún producto que vendemos o cuando utilizas nuestros Servicios (como WooPay) para comprar a un tercero. Información de uso: recopilamos información sobre el uso que haces de nuestros Servicios. Por ejemplo, las acciones que los administradores de sitios y usuarios hacen en un sitio que usa los servicios de WordPress.com o Jetpack. Es decir, qué acción se ha hecho, quién y cuándo la ha hecho (p. ej., [nombre de usuario de WordPress.com] eliminó “[título de la entrada]” a las [hora/fecha]). Nuestra herramienta de seguimiento del uso de WooCommerce también hace un seguimiento de la información, como la dirección de correo electrónico, la configuración de WooCommerce y PHP, así como de otras funciones de tu tienda en línea, como el número total de pedidos y clientes. También recopilamos información de las acciones que se producen cuando usas nuestros Servicios (p. ej., las visualizaciones de páginas, las búsquedas de documentos de soporte en es.support.wordpress.com, las funciones habilitadas en tu sitio web, las interacciones con nuestra barra de administración y otras partes de nuestros Servicios), junto con la información sobre tu dispositivo (p. ej., el tamaño de la pantalla, el nombre de la red móvil y el fabricante del dispositivo móvil). Usamos esta información para proporcionarte nuestros Servicios, además de para obtener detalles sobre la manera en que los usuarios utilizan nuestros Servicios con el fin de poder mejorarlos y para entender y predecir la retención de usuarios. Información de ubicación: podemos determinar la ubicación aproximada de tu dispositivo a partir de tu dirección IP. Recogemos y usamos esta información para calcular el número de usuarios que han visitado nuestros Servicios en regiones específicas, por ejemplo. También podemos recoger información sobre tu ubicación precisa a través de nuestras aplicaciones móviles (cuando publicas una foto con información de ubicación, por ejemplo), siempre que nos permitas hacerlo a través de los permisos del sistema operativo de tu dispositivo móvil. Información almacenada: es posible que accedamos a la información almacenada en tu dispositivo móvil a través de nuestras aplicaciones móviles y mediante los permisos del sistema operativo de tu dispositivo. Por ejemplo, si nos das permiso para acceder a las fotos que hay en el álbum de la cámara de tu dispositivo móvil, nuestros Servicios puede que accedan a las fotos almacenadas en tu dispositivo cuando subas aquella preciosa foto de un amanecer a tu sitio web. Interacciones con los sitios de otros usuarios: recopilamos determinada información sobre tus interacciones con los sitios de otros usuarios cuando te conectas a la cuenta que tienes con nosotros como, por ejemplo, los «Me gusta» o comentarios que haces en determinadas entradas. Así, podemos recomendarte entradas que pensamos que pueden interesarte, entre otras cosas. Otro ejemplo: recogemos información sobre los comentarios de IntenseDebate que los usuarios hacen mientras están conectados a su cuenta y la usamos para obten"
