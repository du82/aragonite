title = "Automattic Affiliate Program"
description = "Join the Automattic Affiliate Program and unlock the power of partnership with WordPress.com, Woo, Jetpack, and more. Earn commissions by promoting leading products and services trusted by millions worldwide. Join us today and start monetizing your influence!"
full_description = "Unleash Your Earning Potential with Automattic’s Affiliate Program Get up to 100% affiliate payouts across a bundle of trustworthy, profitable brands from WordPress.com to Woo. All with a hassle-free single dashboard to manage and track your earnings across every product. Sign up and start earning One program,one link, no hassle Every product in one place Make your affiliate marketing easier as you manage and track all your promotions for Automattic products with just one dashboard. High paying commissions Automattic Affiliates earn high-paying commissions with secure, streamlined, reliable payments. 30-day conversion period Thanks to the 30-day Cookie Period, we offer you the chance to earn commissions that extend beyond immediate conversions. Earning is beautiful Elevate your earnings with eye-catching creative assets designed to drop in place and turn visitors into buyers, faster. Transparent, meet simple With transparent reporting, dedicated account support, and multi-currency transactions, we’re here to help you succeed. Promote what’s good Count on higher conversion rates by promoting open source products trusted by millions, like Woo, WordPress.com, or Jetpack. Our brands From hosting and domains to course management, design services, and ecommerce—with Automattic Affiliates, you’ll find a range of products to promote and earn from, all in one place. Websites, domains, and hosting WordPress.com hosting Lightning-fast, secure hosting designed from the ground up for WordPress. WordPress.com domains Promote 350+ domain extensions, from .com to .xyz, and everything in between. Express Website Design Service High value, tailored sites from the WordPress.com team of experts. Pressable Boutique managed WordPress hosting trusted by thousands of businesses and organizations. Ecommerce and earning Sensei The best plugin to create and sell interactive online courses with WordPress. WooCommerce Marketplace An extensive range of vetted WooCommerce extensions, themes, and services. WP Job Manager The open source job board plugin, powering job listings for 100,000+ Security, performance, and protection Jetpack Security, performance, and marketing tools made for WordPress sites by the WordPress experts. Akismet Scalable AI-powered comment, form, and text spam filtering with 99.99% accuracy. How to get started Sign up and start earning Sign up Drop in your details, get verified by our experts, and you’ll be ready to access your own personal affiliate dashboard. Build your campaign Get started with a compelling affiliate marketing campaign: select from our range of products and services, create engaging content, and track your success with advanced reporting tools. Learn, analyze, and optimize Monitor your campaign’s performance, make data-driven adjustments and optimizations on the fly, and watch your conversions soar in no time. Seamless payouts Easily manage and keep tabs on all your payments with reliable, timely, secure payouts, and everything from tax details to multi-currency transactions. Everything you need to know What is an affiliate program and who is it for? An affiliate program is a partnership that allows for individuals or brands (affiliates) to earn commissions by promoting another company’s products or services. Becoming an affiliate is a great option for anyone interested in making money online through promotion, including bloggers, influencers, business owners, and more. How does the Automattic Affiliate Program work? Signing up takes seconds. Join the program right from this page and our team of experts will verify your account. Once you’re approved, you’ll get access to start creating affiliate campaigns across all of Automattic’s products—from one easy dashboard. What makes the Automattic Affiliate Program unique? The Automattic Affiliate Program makes it easy to spin up affiliate campaigns across the full range of Automattic’s well-loved, profitable products and manage all of your campaigns and products from a single, easy dashboard. You can promote one or more brands including WordPress.com hosting, WordPress.com domain registration, Woo, WooExpress, Woo Marketplace, Jetpack, and Sensei, all without having to sign up for separate affiliate programs. Automattic brands are recognizable, open source, and trustworthy, helping result in higher conversion rates for you. What are the payouts/commissions? Your earnings will depend on which and how many Automattic brands you chose to affiliate for and how much affiliate traffic you drive each month. The payout terms for each brand are as follows: WordPress.com Hosting Includes annual and monthly paid plans Payout of 100% of the first-year plan up to $300 or 100% of the initial monthly purchase No recurring monthly payouts Cookie duration: 30 days New users only WordPress.com Domain Registration All domains 5% payout Cookie duration: 30 days New users only Sensei, WP Job Manager, WordPress.com Express Website Design Service 20% payout Cookie duration: 30 days New users only WooCommerce Marketplace All products included. Free products have no payout. 30% payout for a user’s first paid purchase and 10% for returning customers Cookie duration: 30 days Jetpack & Akismet Includes: Akismet Anti-Spam, Scan, Site Search, Complete, VaultPress Backup, AI Assistant, Stats, Social, Creator, Boost, Security, VideoPress 40% payout Cookie duration: 30 days New Users Only Pressable Includes annual and monthly plans $200 payout for any purchase. The account must remain active for at least 3 months before the payout. Cookie duration: 90 days How will I get paid? After you set up your payment information you’ll automatically receive payments at regular intervals based on the performance of your campaigns. You can track your success with any of the products you’re promoting from a single dashboard, so you’ll never be in the dark as to what to expect. What’s the difference between the Automattic Affiliate Program and the Automattic for Agencies Program? Can I join both? The Automattic Affiliate Program provides an opportunity for content creators, influencers, educators, businesses, or anyone with an audience to earn additional income by promoting Automattic products, including WordPress.com, WooCommerce Marketplace, Pressable, Sensei, WP Job Manager, Jetpack, and more. The program is designed for those creating content to easily generate commissions and earn one-time, lump-sum payments for every referral. Automattic for Agencies, on the other hand, is designed for agencies who sell custom, 1:1 solutions based on a client’s unique needs. This would typically involve recommending, implementing, and managing Automattic products—including WordPress.com, WooCommerce, WordPress VIP, Pressable, and Jetpack—on behalf of their clients. The program has been set up to offer a suite of tools and services that streamline the website management process for multi-user teams and expand revenue opportunities through profit sharing and bulk discounts. It’s certainly possible to join both programs, taking advantage of the benefits of each one to target different audiences, but members will need to make sure they’re following the respective guidelines. Agencies in particular should note that if they’re hosting a client’s site through their Automattic for Agencies account, they can’t simultaneously receive affiliate commissions for that same client. We recommend taking a look at the terms of service for more details. Where can Automattic affiliates find support resources? Check out the Automattic Affiliate Program’s Knowledge Base for all the support and guidance you need. Whether you’re just starting out with affiliate marketing or looking for detailed product information and promotional strategies, you’ll find everything to help you succeed. Who can I talk to for help with other questions? We’re here for it. Send us any questions at affiliates@automattic.com and we’d be happy to help."
