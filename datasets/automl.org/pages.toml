["https://www.automl.org/automated-algorithm-design/dac/literature-overview"]
title = "AutoML | Literature Overview"
description = "The technical storage or access is strictly necessary for the legitimate purpose of enabling the use of a specific service explicitly requested by the subscriber or user, or for the sole purpose of carrying out the transmission of a communication over an electronic communications network."
full_description = "Literature Overview Maintained by Steven Adriaensen. The following list considers papers related to dynamic algorithm configuration. It is by no means complete. If you miss a paper on the list, please let me know. Please note that dynamic configuration has been studied in many different communities (under many different names) and each community has developed a slightly different focus or evaluation criteria. Our criteria for maintaining this literature list are as follows: Does the presented work change (hyper-)parameters on the fly (i.e., during the run of a target algorithm)? Is this done in an automated fashion (e.g., via a learned update policy)? Does it have a meta-learning component (i.e., can the configuration policies be transferred to problems that it has not been ‘learned’ on)? All years 555520252024202320222021202020192018201720162015201420132012201020092008200520042002200120001994199019880000 202341. Sabbioni, Luca; Corda, Francesco; Restelli, MarcelloStepsize Learning for Policy Gradient Methods in Contextual Markov Decision Processes Unpublished 2023.Abstract | Links | BibTeX@unpublished{sabbioni-arxiv23a, title = {Stepsize Learning for Policy Gradient Methods in Contextual Markov Decision Processes}, author = {Luca Sabbioni and Francesco Corda and Marcello Restelli}, url = {https://arxiv.org/abs/2306.07741}, year = {2023}, date = {2023-06-13}, abstract = {Policy-based algorithms are among the most widely adopted techniques in model-free RL, thanks to their strong theoretical groundings and good properties in continuous action spaces. Unfortunately, these methods require precise and problem-specific hyperparameter tuning to achieve good performance, and tend to struggle when asked to accomplish a series of heterogeneous tasks. In particular, the selection of the step size has a crucial impact on their ability to learn a highly performing policy, affecting the speed and the stability of the training process, and often being the main culprit for poor results. In this paper, we tackle these issues with a Meta Reinforcement Learning approach, by introducing a new formulation, known as meta-MDP, that can be used to solve any hyperparameter selection problem in RL with contextual processes. After providing a theoretical Lipschitz bound to the difference of performance in different tasks, we adopt the proposed framework to train a batch RL algorithm to dynamically recommend the most adequate step size for different policies and tasks. In conclusion, we present an experimental campaign to show the advantages of selecting an adaptive learning rate in heterogeneous environments.}, keywords = {}, pubstate = {published}, tppubtype = {unpublished} } ClosePolicy-based algorithms are among the most widely adopted techniques in model-free RL, thanks to their strong theoretical groundings and good properties in continuous action spaces. Unfortunately, these methods require precise and problem-specific hyperparameter tuning to achieve good performance, and tend to struggle when asked to accomplish a series of heterogeneous tasks. In particular, the selection of the step size has a crucial impact on their ability to learn a highly performing policy, affecting the speed and the stability of the training process, and often being the main culprit for poor results. In this paper, we tackle these issues with a Meta Reinforcement Learning approach, by introducing a new formulation, known as meta-MDP, that can be used to solve any hyperparameter selection problem in RL with contextual processes. After providing a theoretical Lipschitz bound to the difference of performance in different tasks, we adopt the proposed framework to train a batch RL algorithm to dynamically recommend the most adequate step size for different policies and tasks. In conclusion, we present an experimental campaign to show the advantages of selecting an adaptive learning rate in heterogeneous environments.Closehttps://arxiv.org/abs/2306.07741Close40. Chen, Deyao; Buzdalov, Maxim; Doerr, Carola; Dang, NguyenUsing Automated Algorithm Configuration for Parameter Control Conference Proceedings of the 17th ACM/SIGEVO Conference on Foundations of Genetic Algorithms., 2023.Abstract | Links | BibTeX@conference{chen2023using, title = {Using Automated Algorithm Configuration for Parameter Control}, author = {Deyao Chen and Maxim Buzdalov and Carola Doerr and Nguyen Dang}, url = {https://arxiv.org/abs/2302.12334}, year = {2023}, date = {2023-01-01}, urldate = {2023-01-01}, booktitle = {Proceedings of the 17th ACM/SIGEVO Conference on Foundations of Genetic Algorithms.}, journal = {arXiv preprint arXiv:2302.12334}, pages = {38-49}, abstract = {Dynamic Algorithm Configuration (DAC) tackles the question of how to automatically learn policies to control parameters of algorithms in a data-driven fashion. This question has received considerable attention from the evolutionary community in recent years. Having a good benchmark collection to gain structural understanding on the effectiveness and limitations of different solution methods for DAC is therefore strongly desirable. Following recent work on proposing DAC benchmarks with well-understood theoretical properties and ground truth information, in this work, we suggest as a new DAC benchmark the controlling of the key parameter λ in the (1+(λ,λ)) Genetic Algorithm for solving OneMax problems. We conduct a study on how to solve the DAC problem via the use of (static) automated algorithm configuration on the benchmark, and propose techniques to significantly improve the performance of the approach. Our approach is able to consistently outperform the default parameter control policy of the benchmark derived from previous theoretical work on sufficiently large problem sizes. We also present new findings on the landscape of the parameter-control search policies and propose methods to compute stronger baselines for the benchmark via numerical approximations of the true optimal policies.}, keywords = {}, pubstate = {published}, tppubtype = {conference} } CloseDynamic Algorithm Configuration (DAC) tackles the question of how to automatically learn policies to control parameters of algorithms in a data-driven fashion. This question has received considerable attention from the evolutionary community in recent years. Having a good benchmark collection to gain structural understanding on the effectiveness and limitations of different solution methods for DAC is therefore strongly desirable. Following recent work on proposing DAC benchmarks with well-understood theoretical properties and ground truth information, in this work, we suggest as a new DAC benchmark the controlling of the key parameter λ in the (1+(λ,λ)) Genetic Algorithm for solving OneMax problems. We conduct a study on how to solve the DAC problem via the use of (static) automated algorithm configuration on the benchmark, and propose techniques to significantly improve the performance of the approach. Our approach is able to consistently outperform the default parameter control policy of the benchmark derived from previous theoretical work on sufficiently large problem sizes. We also present new findings on the landscape of the parameter-control search policies and propose methods to compute stronger baselines for the benchmark via numerical approximations of the true optimal policies.Closehttps://arxiv.org/abs/2302.12334Close202239. Adriaensen, Steven; Biedenkapp, André; Shala, Gresa; Awad, Noor; Eimer, Theresa; Lindauer, Marius; Hutter, FrankAutomated Dynamic Algorithm Configuration Journal Article In: Journal of Artificial Intelligence Research (JAIR), vol. 75, pp. 1633-1699, 2022.Abstract | Links | BibTeX@article{adriaens-arxiv22a, title = {Automated Dynamic Algorithm Configuration}, author = {Steven Adriaensen and André Biedenkapp and Gresa Shala and Noor Awad and Theresa Eimer and Marius Lindauer and Frank Hutter}, url = {https://doi.org/10.1613/jair.1.13922 https://github.com/automl/2022_JAIR_DAC_experiments, code}, year = {2022}, date = {2022-12-30}, urldate = {2022-05-30}, journal = {Journal of Artificial Intelligence Research (JAIR)}, volume = {75}, pages = {1633-1699}, abstract = {The performance of an algorithm often critically depends on its parameter configuration. While a variety of automated algorithm configuration methods have been proposed to relieve users from the tedious and error-prone task of manually tuning parameters, there is still a lot of untapped potential as the learned configuration is static, i.e., parameter settings remain fixed throughout the run. However, it has been shown that some algorithm parameters are best adjusted dynamically during execution. Thus far, this is most commonly achieved through hand-crafted heuristics. A promising recent alternative is to automatically learn such dynamic parameter adaptation policies from data. In this article, we give the first comprehensive account of this new field of automated dynamic algorithm configuration (DAC), present a series of recent advances, and provide a solid foundation for future research in this field. Specifically, we (i) situate DAC in the broader historical context of AI research; (ii) formalize DAC as a computational problem; (iii) identify the methods used in prior art to tackle this problem; and (iv) conduct empirical case studies for using DAC in evolutionary optimization, AI planning, and machine learning.}, keywords = {}, pubstate = {published}, tppubtype = {article} } CloseThe performance of an algorithm often critically depends on its parameter configuration. While a variety of automated algorithm configuration methods have been proposed to relieve users from the tedious and error-prone task of manually tuning parameters, there is still a lot of untapped potential as the learned configuration is static, i.e., parameter settings remain fixed throughout the run. However, it has been shown that some algorithm parameters are best adjusted dynamically during execution. Thus far, this is most commonly achieved through hand-crafted heuristics. A promising recent alternative is to automatically learn such dynamic parameter adaptation policies from data. In this article, we give the first comprehensive account of this new field of automated dynamic algorithm configuration (DAC), present a series of recent advances, and provide a solid foundation for future research in this field. Specifically, we (i) situate DAC in the broader historical context of AI research; (ii) formalize DAC as a computational problem; (iii) identify the methods used in prior art to tackle this problem; and (iv) conduct empirical case studies for using DAC in evolutionary optimization, AI planning, and machine learning.Closehttps://doi.org/10.1613/jair.1.13922codeClose38. Xue, Ke; Xu, Jiacheng; Yuan, Lei; Li, Miqing; Qian, Chao; Zhang, Zongzhang; Yu, YangMulti-agent Dynamic Algorithm Configuration Proceedings Article In: Proceedings of the 36th International Conference on Advances in Neural Information Processing Systems (NeurIPS'22), 2022.Abstract | Links | BibTeX@inproceedings{xue-neurips22a, title = {Multi-agent Dynamic Algorithm Configuration}, author = {Ke Xue and Jiacheng Xu and Lei Yuan and Miqing Li and Chao Qian and Zongzhang Zhang and Yang Yu}, url = {https://arxiv.org/abs/2210.06835v1, arxiv}, year = {2022}, date = {2022-11-28}, urldate = {2022-11-28}, booktitle = {Proceedings of the 36th International Conference on Advances in Neural Information Processing Systems (NeurIPS'22)}, abstract = {Automated algorithm configuration relieves users from tedious, trial-and-error tuning tasks. A popular algorithm configuration tuning paradigm is dynamic algorithm configuration (DAC), in which an agent learns dynamic configuration policies across instances by reinforcement learning (RL). However, in many complex algorithms, there may exist different types of configuration hyperparameters, and such heterogeneity may bring difficulties for classic DAC which uses a single-agent RL policy. In this paper, we aim to address this issue and propose multi-agent DAC (MA-DAC), with one agent working for one type of configuration hyperparameter. MA-DAC formulates the dynamic configuration of a complex algorithm with multiple types of hyperparameters as a contextual multi-agent Markov decision process and solves it by a cooperative multi-agent RL (MARL) algorithm. To instantiate, we apply MA-DAC to a well-known optimization algorithm for multi-objective optimization problems. Experimental results show the effectiveness of MA-DAC in not only achieving superior performance compared with other configuration tuning approaches based on heuristic rules, multi-armed bandits, and single-agent RL, but also being capable of generalizing to different problem classes. Furthermore, we release the environments in this paper as a benchmark for testing MARL algorithms, with the hope of facilitating the application of MARL.}, keywords = {}, pubstate = {published}, tppubtype = {inproceedings} } CloseAutomated algorithm configuration relieves users from tedious, trial-and-error tuning tasks. A popular algorithm configuration tuning paradigm is dynamic algorithm configuration (DAC), in which an agent learns dynamic configuration policies across instances by reinforcement learning (RL). However, in many complex algorithms, there may exist different types of configuration hyperparameters, and such heterogeneity may bring difficulties for classic DAC which uses a single-agent RL policy. In this paper, we aim to address this issue and propose multi-agent DAC (MA-DAC), with one agent working for one type of configuration hyperparameter. MA-DAC formulates the dynamic configuration of a complex algorithm with multiple types of hyperparameters as a contextual multi-agent Markov decision process and solves it by a cooperative multi-agent RL (MARL) algorithm. To instantiate, we apply MA-DAC to a well-known optimization algorithm for multi-objective optimization problems. Experimental results show the effectiveness of MA-DAC in not only achieving superior performance compared with other configuration tuning approaches based on heuristic rules, multi-armed bandits, and single-agent RL, but also being capable of generalizing to different problem classes. Furthermore, we release the environments in this paper as a benchmark for testing MARL algorithms, with the hope of facilitating the application of MARL.ClosearxivClose37. Biedenkapp, AndréDynamic Algorithm Configuration by Reinforcement Learning PhD Thesis 2022.Abstract | Links | BibTeX@phdthesis{biedenkapp22, title = {Dynamic Algorithm Configuration by Reinforcement Learning}, author = {André Biedenkapp}, url = {https://freidok.uni-freiburg.de/data/230869, UniFreiburg https://ml.informatik.uni-freiburg.de/wp-content/uploads/2022/11/2022_Dissertation_Andre_Biedenkapp.pdf, pdf}, year = {2022}, date = {2022-10-14}, abstract = {The performance of algorithms, be it in the domain of machine learning,"
