full_description = "Literature on Neural Architecture Search Maintained by Difan Deng and Marius Lindauer. The following list considers papers related to neural architecture search. It is by no means complete. If you miss a paper on the list, please let us know. Please note that although NAS methods steadily improve, the quality of empirical evaluations in this field are still lagging behind compared to other areas in machine learning, AI and optimization. We would therefore like to share some best practices for empirical evaluations of NAS methods, which we believe will facilitate sustained and measurable progress in the field. If you are interested in a teaser, please read our blog post or directly jump to our checklist. Transformers have gained increasing popularity in different domains. For a comprehensive list of papers focusing on Neural Architecture Search for Transformer-Based spaces, the awesome-transformer-search repo is all you need. All years 555520252024202320222021202020192018201720162015201420132012201020092008200520042002200120001994199019880000 All types Journal ArticlesBachelor ThesesBooksBookletsCollectionsConferencesBook ChaptersBook SectionsProceedings ArticlesTechnical ManualsMiscellaneousPhD ThesesTechnical ReportsUnpublishedWorkshops All authors -, Hao -, Hossein Ghanei -, Hsien -, Hung -, Jack Parker -, Julia Guerrero -, Kuan -, Kwang -, Massih -, Min -, Pierce I -, Seyed Mojtaba Marvasti -, Sian -, Silvina Caíno -, Tie -, Tien -, Wei -, Xue -, Yi -, Yu Cai, Weifeng chen, Xue Cui, Can Fei, Ke Li, Qi Xu, Xinxin Xue, Benshan *, Iqbal H. Sarker nez, Manuel López-Ibá á, Luk á, Tom A, Yong A., Revathi Aach, Marcel Abadijou, Sadegh Abati, Davide Abbas, Hazem M. Abbas, Mahmoud Abbasi, Ahmed Abbasi, Saad Abbasnejad, Ehsan M Abdel-Mottaleb, Mohamed Abdelfattah, Mohamed S Abdelfattah, Mohamed S. Abdelgawad, M. Abdelhamid, Abdelaziz A. Abdelsalam, Mahmoud Abdeltawab, Hussein Hassan Abdul-Mageed, Muhammad Abdullah, Monir Abdullah, Muhammad Abdullahi, Mo