["https://avidfolk.com/podcasts"]
title = "Avidfolk — Podcasts — Avidfolk Consulting, LLP"
description = "V.H. Belvadi’s personal website and blog"
full_description = "Podcasts Yet another Stoicism podcast Stoicism beyond the self-help checklist RSS Apple Podcasts Spotify S01 E06 Reading session: Enchiridion 1–5 Stoicism is so often learnt by discussing critical old writings and in our reading session today, we discuss five points from Enchridion, where we talk about the famous idea of the dichotomy of control, briefly touch upon attachment, and finally address how our attitudes and perceptions colour our world. S01 E05 Stoic feminism Are the ancient ideas of Stoicism consistent with modern-day feminism? Are modern-day Stoics necessarily feminists? This is a complex question with an episode-long answer, but we are in the good hands of accomplished scholars who have thought deeply about the first question. As for the second question, the answer is simple: yes. S01 E04 Living according to nature Stoicism advocates for living according to nature. But what does this mean? And what did the Stoics mean by nature? We also explore how this idea leads to an egalitarian society and hints at anti-racism and feminism. S01 E03 Reading session: Seneca’s letters 1 and 2 Stoicism is so often learnt by discussing critical old writings and in our reading session today, let us look at Seneca’s letters to Lucilius. We focus on letters 1 and 2 in today’s episode. S01 E02 What is Stoicism? A bird's eye view of Stoicism, an attempt to define it, and all about the Stoic egg. S01 E01 Does the world need another podcast on Stoicism? Why does this show even exist? We kick off by listing five objectives that might set this show apart from all the other podcasts out there that talk about Stoicism. Everyday nothing A podcast about nothing in particular. From culture to science to lifestyle, everything goes. RSS Apple Podcasts Spotify Amazon Stitcher Pandora Google Podcasts Youtube Music PocketCasts RadioPublic CastBox S02 E01 Why do people watch vlogs anyway? Nearly 100 million people watch vlogs every single day on Youtube. We wondered why, and we sat down to discuss it. No judgement, just an invitation to an open discussion. What is it about vlogs that draws viewers in? S01 E08 Learning at 2x We've been learning since we were cave-dwellers, but learning itself has changed—sometimes for better, sometimes for worse. And that's what we discuss in this episode in the least condescending way we possibly can. Here's wishing more power to everyone setting off on new journeys of learning. S01 E07 Food, science and influencers The food industry is gaining more attention these days and things don’t seem to be too different from the fossil fuel or cigarette industries of yesteryear. S01 E06 Globetrotting from our couch We talk about traveling. Why do we love it? Is it a luxury? When can it become a bore? Are you a mountain man or a beach bum? S01 E05 Childhood cartoons—Part II The one where we sit down (again) to discuss even more cartoons from our childhood and discover topics like classism, religion and the general downward trend of cartoons after our own childhood. This episode follows Part I from last week. S01 E04 Childhood cartoons—Part I The one where we sit down to discuss cartoons from our childhood and discover that there were as many similarities as there were differences in the shows with which we grew up. Part II will follow. S01 E03 Answering Proust’s questions When he was 14, the French author Marcel Proust answered a bunch of questions that later sold for over 100,000 euros. Vanity Fair has asked celebrities these questions regularly for several years. But at last, the most important people to answer these questions are here: us. S01 E02 Spherical chickens in a vacuum We sit down to crack jokes for 30 minutes straight. Who in their right mind can say no to that? Jokes sourced from Psychology Today, Reddit, Bored Panda, The Readers’ Digest and The Guardian. S01 E01 Purity control In our pilot episode we sit down for a conversation on the death of ‘wokeness’, Derry girls, adolescence and more."
