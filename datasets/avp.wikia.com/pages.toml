artists. It was released on February 21, 2024. In Marvel's Alien comics line, Alien: Black, White & Blood was preceded by Alien: Descendant and was published concurrently with Aliens: What If.... Contents 1 Overview 2 Publisher's summary 3 Stories included 4 Reprint History 5 Trivia 6 Gallery 6.1 Issue covers 6.2 Variant covers Overview[] ALIEN: BLACK, WHITE & BLOOD will be four issues of unbridled violence with shocking stories crafted by some the industry’s hottest talents. Previous BLACK, WHITE & RED installments have spotlighted deadly icons, from Wolverine to Darth Vader. Now, it’s time for the Xenomorphs to be unleashed in this epic format! Marvel Comics and 20th Century Studios present this kill-fest of an anthology in chest-rending artistic detail, brought to life in bold, black, white, red—and, when things get extra dangerous—GREEN! Publisher's summary[] #1: THE ALIEN UNIVERSE AS ONLY MARVEL COULD IMAGINE IT! Black, white, red – and GREEN! Marvel Comics and 20th Century Studios present a kill-fest of an anthology in chest-rending artistic detail! Superstars Collin Kelly & Jackson Lanzing (Captain America: Cold War, Guardians of the Galaxy) and brilliant artist Michael Dowling (Black Cat, Amazing Spider-Man) kick off a generations-spanning story that will continue through all four issues! Fan-favorite writer Ryan Cady explores the limits of compassion in “Maternal Instincts.” And rising stars Stephanie Phillips and Marcelo Ferreira bring you “The Hunt,” a tale of guts, glory and the most exhilarating of games… #2: THE ALIEN LEGACY CONTINUES IN A BOLD AND BLOODY ANTHOLOGY SERIES! Collin Kelly, Jackson Lanzing and Michael Dowling’s generations-spanning epic continues! Then legendary writer Paul Jenkins explores the chemistry of fear in a story that will leave you with a whole new and terrifying understanding of the Xenomorph species. And Stephanie Williams thrills with a story of a marine’s first – and possibly last – day on the job. Marvel’s landmark BLACK, WHITE & BLOOD series takes horror to another level! #3: THE STAR-STUDDED KILLFEST CONTINUES! In "Utopia," Collin Kelly, Jackson Lanzing and Michael Dowling take you through the collapse of a civilization that believed it could overcome the worst of human nature to live in permanent peace. But in the war against the Xenomorphs overtaking their home, the citizens of the ship Forward find themselves breaking every principle… Then, in "Gear in the Machine," Cody Ziglar goes guts-deep into the core of human evil, while in "Lucky," Steve Foxe flips the viewpoint in a way that will tug at the heartstrings of even the most seasoned Alien fan. An unmissable piece of the universe-spanning franchise! #4: THE SLICKEST, SICKEST, MOST SADISTIC ISSUE YET! Collin Kelly, Jackson Lanzing and Michael Dowling's "Utopia" reaches its final generation, the worst of human nature on full display. Then in Bryan Hill's "Break Out," a man will do anything to provide a safe home for his daughter. And Weyland-Yutani is here to help… Then Eisner and Harvey-award winner Pornsak Pichetshote brings his horror chops to the Alien universe! With more to be revealed, ALIEN: BLACK, WHITE & BLOOD is a must-have for any Alien fan! Stories included[] Utopia The Hunt Maternal Instinct Morsel First Day Gear in the Machine Lucky Hide & Seek Mother Reprint History[] The four issue series Alien: Black, White & Blood will collected as a trade paperback and is set to be released on November 19, 2024. Trivia[] Alien: Black, White & Blood will be the first anthology series in the Alien franchise to be released in comic book format. As its title suggests, the entire series was illustrated in black and white with colored accents in both red and green to represent human and Xenomorph blood respectively. Gallery[] Issue covers[] <img style="" src="https://static.wikia.nocookie.net/avp/images/f/f9/Alien_Black_White_and_Blood_1.png/revision/latest/scale-to-width-down/120?cb=20231018131112" title="Alien Black White and Bloo