be written by Declan Shalvey, illustrated by Danny Earls with creature design by Andrea Broccardo, colored by Ruth Redmond, lettered by VC's Clayton Cowles, and edited by Sarah Brunstad. Cover art was provided by Declan Shalvey, while variant cover art was provided my Marco Mastrazzo and Daniel Warren Johnson. The one-shot comic was released on October 4, 2023. Alien: Annual #1 serves as a tie-in to a multi-arc storyline that started with Alien: Thaw and continued with Alien: Descendant. In Marvel's Alien comics line, Alien: Annual #1 was preceded by Alien: Thaw, and will be followed by Alien: Descendant and Alien: Black, White & Blood. Contents 1 Publisher's summary 2 Plot 3 Reprint history 4 Trivia 5 Gallery 5.1 Issue covers 5.2 Variant covers Publisher's summary[] Alien vs. Alien: Pity the Xeno! A Xenomorph queen and her hive descend on a dark world. As always, they’re eager to eliminate any species they encounter and stand poised to overrun this planet like they have so many others. Until the native life fights back… Plot[] In 2156, an unnamed spacecraft, infested with Xenomorphs, crash-landed on the ice-moon LV-695, where, within the wreckage, the surviving Queen established it's hive. Soon after, one of the moon's indigenous fauna, an undocumented species of giant insectoid, crossed paths with the alien creatures. In a violent fight for autonomy, the local fauna ultimately became hosts for the alien parasites, and produced a hybrid offspring. Reprint history[] Alien: Annual #1 was collected alongside the four-issue comic book series Alien: Descendant as a trade paperback titled Alien Vol. 2: Descendant. It was released on April 2, 2024 and reused Alien: Annual's cover art by Declan Shalvey. Trivia[] The one-shot comic's subtitle, Regicide, refers to the act of killing a king. The concept of a "civil war" between differing strains of Xenomorph was previously explored in the 1991 comic book series Aliens: Genocide, its novelisation, and the 2006 novel Aliens: DNA War. Gallery[] Issue covers[] <img style="" src="https://static.wikia.nocookie.net/avp/images/4/44/Alien_Annual_1_2023.png/revision/latest/scale-to-width-down/121?cb=20230720004901" title="Alien Annual 1 2023.png (3.09 MB)" class="thumbimage" alt="Cover to Alien: Annual #1 by Declan Shalvey." height="185" width="185" data-image-name="Alien Annual 1 2023.png" data-image-key="Alien_Annual_1_2023.png" data-relevant="1" data-caption="Cover to &lt;i&gt;Alien: Annual&lt;/i&gt; #1 by Declan Shalvey.">Cover to Alien: Annual #1 by Declan Shalvey. Variant covers[] <img style="" src="https://static.wikia.nocookie.net/avp/images/a/a5/Alien_Annual_1_2023_Warren_Johnson_variant.png/revision/latest/scale-to-width-down/120?cb=20230906133717" title="Alien Annual 1 2023 Warren Johnson variant.png (2.82 MB)" class="thumbimage" alt="Variant cover to Alien: Annual #1 by Daniel Warren Johnson." height="185" width="185" data-image-name="Alien Annual 1 2023 Warren Johnson variant.png" data-image-key="Alien_Annual_1_2023_Warren_Johnson_variant.png" data-relevant="1" data-caption="Variant cover to &lt;i&gt;Alien: Annual&lt;/i&gt; #1 by Daniel Warren Johnson.">Variant cover to Alien: Annual #1 by Daniel Warren Johnson.<img style="" src="https://static.wikia.nocookie.net/avp/images/0/04/Alien_Annual_1_2023_Mastrazzo_variant.png/revision/latest/scale-to-width-down/120?cb=20230906133516" title="Alien Annual 1 2023 Mastrazzo variant.png (3.25 MB)" class="thumbimage" alt="Variant cover to Alien: Annual #1 by Marco Mastrazzo." height="185" width="185" data-image-name="Alien Annual 1 2023 Mastrazzo variant.png" data-image-key="Alien_Annual_1_2023_Mastrazzo_variant.png" data-relevant="1" data-caption="Variant cover to &lt;i&gt;Alien: Annual&lt;/i&gt; #1 by Marco Mastrazzo.">Variant cover to Alien: Annual #1 by Marco Mastrazzo.<img style="" src="https://static.wikia.nocookie.net/avp/images/1/12/Alien_Annual_1_2023_Mastrazzo.png/revision/latest/scale-to-width-down/119?cb=20230905181547" title="Alien Annual 1 2023 Mastrazzo.png (2.41 MB)" class="thumbimage" alt="Virgin variant cover to Alien: Annual #1 by Mastrazzo." height="185" width="185" data-image-name="Alien Annual 1 2023 Mastrazzo.png" data-image-key="Alien_Annual_1_2023_Mastrazzo.png" data-relevant="1" data-caption="Virgin variant cover to &lt;i&gt;Alien: Annual&lt;/i&gt; #1 by Mastrazzo.">Virgin variant cover to Alien: Annual #1 by Mastrazzo. Categories Categories: Alien: Annual 1 (2023) Alien (Marvel Comics) One-shots Tie-in comics Stories set in the 22nd century Stories set in the 23rd century Community content is available under CC-BY-SA unless otherwise noted. More Fandoms Horror Sci-fi'''
