full_description = '''English Deutsch Español Français Magyar 日本語 Polski Русский Українська Home View source History Talk (122) <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Welcome to Xenopedia,The vs. Wiki BUILDING BETTER WORLDS SINCE 5. 26. 06 Welcome, <insert name here>! Xenopedia is a comprehensive collaborative database documenting everything in the official Alien, Predator and Alien vs. Predator universe, including Prometheus. Users are currently editing 8,426 articles started since May 26, 2006, and you can help! Now we got have our Discord https://discord.gg/3hMegG5Smr About this wiki · Recent changes · Active users · Policies and guidelines · Manual of style · Administrators ATTENTION: THIS WIKI CONTAINS UNMARKED SPOILERS Touch down on a Game Preserve in Predator!! Marvel Comics releases a new Predator comic series! Read more > Explore bone-shilling new depths in Marvel's Alien! Marvel Comics is set to release a new Alien comic series this April! Read more > Visit the Comanche nation in Prey! 20th Century Studios releases a new film in the Predator franchise titled Prey! Read more > Featured Article <a href="https://static.wikia.nocookie.net/avp/images/9/99/Aliens_Live.jpg/revision/latest?cb=20170830125711" class="image"><img alt="Aliens Live" src="https://static.wikia.nocookie.net/avp/images/9/99/Aliens_Live.jpg/revision/latest/scale-to-width-down/250?cb=20170830125711" decoding="async" loading="lazy" width="250" height="141" class="thumbimage" data-image-name="Aliens Live.jpg" data-image-key="Aliens_Live.jpg" data-relevant="1" data-src="https://static.wikia.nocookie.net/avp/images/9/99/Aliens_Live.jpg/revision/latest/scale-to-width-down/250?cb=20170830125711" /></a> Aliens Live logo. Aliens Live was a special screening of Aliens held at the Royal Albert Hall in London on November 6, 2016, as part of the venue's Films in Concert programme. As with other screenings from the Films in Concert series, the movie was accompanied by a live concert performance of its soundtrack, performed by the Royal Philharmonic Concert Orchestra. The film was shown in its extended Special Edition cut. The one-off event was dedicated to the film's composer James Horner, who had passed away the previous year, and consisted of two screenings of the movie, a matinee performance and an evening performance attended by James Cameron, Sigourney Weaver and Gale Anne Hurd. The orchestra for the event was conducted by Ludwig Wicki. A special commemorative booklet was also produced, containing behind the scenes images from the film, articles on its production and interviews with the cast, crew and personnel involved in the live performances. Read more > Nominate an article · Archive Featured Video Featured Image Alien Day 2017 approaches. Nominate a video · Archive Jean-Claude Van Damme, the original actor who played the Jungle Hunter, on set with Carl Weathers. Nominate an image · View · Edit · Archive Improvement Drive <a href="https://static.wikia.nocookie.net/avp/images/3/36/Weyland-Yutani_Coporation_Logo.jpg/revision/latest?cb=20141113111101" class="image"><img alt="Weyland-Yutani Coporation Logo" src="https://static.wikia.nocookie.net/avp/images/3/36/Weyland-Yutani_Coporation_Logo.jpg/revision/latest/scale-to-width-down/225?cb=20141113111101" decoding="async" loading="lazy" width="225" height="105" class="thumbimage" data-image-name="Weyland-Yutani Coporation Logo.jpg" data-image-key="Weyland-Yutani_Coporation_Logo.jpg" data-relevant="1" data-src="https://static.wikia.nocookie.net/avp/images/3/36/Weyland-Yutani_Coporation_Logo.jpg/revision/latest/scale-to-width-down/225?cb=20141113111101" /></a> <a href="https://static.wikia.nocookie.net/avp/images/3/36/Weyland-Yutani_Coporation_Logo.jpg/revision/latest?cb=20141113111101" class="image"><img alt="Weyland-Yutani Coporation Logo" src="https://static.wikia.nocookie.net/avp/images/3/36/Weyland-Yutani_Coporation_Logo.jpg/revision/latest/scale-to-width-down/225?cb=20141113111101" decoding="async" loading="lazy" width="225" height="105" class="thumbimage" data-image-name="Weyland-Yutani Coporation Logo.jpg" data-image-key="Weyland-Yutani_Coporation_Logo.jpg" data-relevant="1" data-src="https://static.wikia.nocookie.net/avp/images/3/36/Weyland-Yutani_Coporation_Logo.jpg/revision/latest/scale-to-width-down/225?cb=20141113111101" /></a> The current Improvement Drive is for: Articles related to Alien vs. Predator Please improve this/these article/s in any way you can. Featured Poll Have an idea for a Featured Poll? Tell us here. · Archive Official Friends News The Motion Tracker April 2025 26 Titan Books is set to release the reference book Alien Film Franchise Encyclopedia. November 2024 6 Marvel Comics is set to release issue #2 of the crossover comic book series Aliens vs. Avengers. October 2024 29 Titan Books is set to release the novel Alien: Seventh Circle. 16 Marvel Comics is set to release the one-shot tie-in comic book Alien: Romulus. September 2024 25 Marvel Comics is set to release issue #2 of the crossover comic book series Predator versus Black Panther. August 2024 28 Marvel Comics is set to release issue #1 of the crossover comic book series Aliens vs. Avengers. 21 Marvel Comics is set to release issue #1 of the crossover comic book series Predator versus Black Panther. 16 20th Century Studios is set to release the feature film Alien: Romulus in theaters. July 2024 30 Blackstone Audio releases the audiobook version of the novel Alien: Uncivil War. 30 Titan Books releases the novel Alien: Uncivil War. 17 Marvel Comics releases issue #5 of Aliens: What If.... 09 20th Century Studios & A Golden Book releases the children's book A is for Alien: An ABC Book. June 2024 05 Marvel Comics releases issue #4 of Aliens: What If.... May 2024 22 Marvel Comics releases the omnibus Predator: The Original Years Volume 2. 22 Marvel Comics releases issue #4 of Predator: The Last Hunt. 15 Marvel Comics releases issue #4 of Alien: Black, White & Blood. 15 Marvel Comics releases issue #3 of Aliens: What If.... April 2024 26 Alien Day 2024! 25 Marvel Comics is set to release issue #3 of Predator: The Last Hunt. 10 Marvel Comics releases issue #2 of Aliens: What If.... 03 Marvel Comics releases issue #3 of the anthology comic book series Alien: Black, White & Blood. March 2024 27 Marvel Comics releases issue #2 of Predator: The Last Hunt. 13 Marvel Comics releases issue #2 of the anthology comic book series Alien: Black, White & Blood. 06 Marvel Comics releases issue #1 of the comic book series Aliens: What If.... February 2024 21 Marvel Comics releases issue #1 of the comic book series Predator: The Last Hunt. 21 Marvel Comics releases issue #1 of the anthology comic book series Alien: Black, White & Blood. 07 Marvel Comics releases issue #4 of Alien: Descendant. January 2024 17 Marvel Comics releases issue #3 of Alien: Descendant. 16 Free League Publishing releases a second "campaign module" for Alien: The RPG titled Building Better Worlds. December 2023 27 Marvel Comics releases issue #4 of Predator versus Wolverine. 20 Marvel Comics releases issue #2 of Alien: Descendant. 12 Lightstorm Entertainment releases the digital 4K version of Aliens Ultimate Collectors Edition. 12 Blackstone Audio releases the audiobook version of the novel Aliens: Bishop. 05 Titan Books releases the novel Aliens: Bishop. November 2023 29 Marvel Comics releases issue #3 of Predator versus Wolverine. 15 Marvel Comics released issue #1 of the comic book series Alien: Descendant. 14 Titan Books released the search-and-find puzzle book Find the Xenomorph. 07 Titan Books releases the novel collection The Complete Alien Collection: Symphony of Death. October 2023 25 Marvel Comics releases issue #2 of Predator versus Wolverine. 04 Marvel Comics releases a one-shot, tie-in comic book titled Alien: Annual #1. 03 20th Century Studios releases a 4K UltraHD Blu-Ray SteelBook for the 2022 feature film Prey. September 2023 20 Marvel Comics releases issue #1 of the crossover comic book series Predator versus Wolverine. August 2023 16 Marvel Comics releases issue #5 of Alien: Thaw. July 2023 26 Marvel Comics releases issue #5 of Predator: The Preserve. 19 Marvel Comics releases issue #4 of Alien: Thaw. June 2023 28 Marvel Comics releases issue #3 of Alien: Thaw. 28 Marvel Comics releases issue #4 of Predator: The Preserve. 20 Focus Entertainment releases the isometric real-time strategy game Aliens: Dark Descent. May 2023 31 Marvel Comics releases issue #2 of Alien: Thaw. 17 Marvel Comics releases issue #3 of Predator: The Preserve. 09 Marvel Comics releases the trade paperback collection of the comic book series Alien: Icarus. April 2023 26 Ubitus releases a version of Aliens: Fireteam Elite for Nintendo Switch. 26 Marvel Comics releases a new comic book series titled Alien: Thaw. 26 Alien Day 2023! 18 Marvel comics releases the trade paperback collection of the comic book series Predator: Day of the Hunter. 12 Marvel Comics releases issue #2 of Predator: The Preserve. March 2023 14 Marvel Comics releases an omnibus collection titled Aliens Epic Collection: The Original Years. 14 Marvel Comics releases an omnibus collection titled Aliens: The Original Years Omnibus Volume 4. 14 Blackstone Audio releases the audiobook version of Alien: Enemy of My Enemy. 14 Titan Books releases the novel Alien: Enemy of My Enemy. 08 Marvel Comics releases a new comic book series titled Predator: The Preserve. February 2023 28 TED Conference, 2023 hosts Sir Peter Weyland to discuss Weyland Industries' plans for the future. 21 Titan Books releases the e-book version of Alien: Enemy of My Enemy. 08 Marvel Comics releases issue #6 of the comic book series Alien: Icarus. February 2020 17 Disney officially rebrands 20th Century Studios, reports New York Times here. The Motion Tracker is named in tribute to the news section that appeared in Aliens magazine. View · Edit · Archive Did You Know? The crew on Alien nicknamed the full-grown creature "Little Rascal". Peter Keyes' name is a reference to the character "Keys" from E.T. the Extra-Terrestrial. Both characters are antagonistic government agents in pursuit of an alien lifeform for study. According to Sigourney Weaver, the idea of including a ninth Ripley clone in Alien Resurrection was discussed at one point. "Ripley 9" would be, essentially, an evil version of Ripley 8. The concept was ultimately not pursued. The Phased Plasma Pulse Rifle, SHARP Rifle and Electroshock Grenade available as pre-order bonuses or DLC for Aliens: Colonial Marines are based on boasts made by Private Hudson in the Special Edition of Aliens. Los Angeles did not actually have a subway network at the time Predator 2 was made (1990), but did by the year the film was set (1997) — the first underground metro line in the city, the Red Line, opened in January 1993. View · Edit Blogs Purge Recent Blogs THEDEMIS • 28 July 2024 1 www.bay12store.com Ive discovered i pretty neat store that focuses on the Alien franchise. Its not bad at all. Take a look if your interested. Read Full Post D1981 • 29 June 2023 1 What if Newt had been cloned instead of Ripley? As Alien 3 concluded, we saw Lt. Ellen Ripley destroy the xenomorph creature on Fury 161, and confront Weyland Yutani face to face as they tried to a… Read Full Post The Creature Slayer • 9 October 2022 0 Deciphering the downfall of the USCSS Theseus and the fate of its crew I wasn't sure whether to do this as a blog or a test page, but I thought it is probably best in a blog — here, I'll be trying to decipher the mess th… Read Full Post See more > Science Fiction Movies Go to these sites for info or for help with your own wiki! Alien • Alien vs. Predator • Back to the Future • Blade Runner • Bumilangit Universe • Cloverfield • Star Wars • Ender's Game • Ghostbusters • Judge Dredd • The Matrix • Men in Black • Pacific Rim • Real Steel • Riddick • Terminator