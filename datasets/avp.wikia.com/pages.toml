description = "Xenopedia is a wiki-based, comprehensive collaborative database documenting everything in the official Alien, Predator and Alien vs. Predator universe, including Prometheus. Founded in 2006, Xenopedia users are currently editing almost 6,000 articles started since May 26, 2006, and you can help!"
full_description = '''Commodore223456·2/23/2025in Xenopedia FeedbackWhy is Aliens: Colonial Marines listed as "Non-canon"?As the title says, I'm wondering why the game Aliens: Colonial Marines is constantly referred to as non-canon on this wiki? I get that it is widely regarded as a terrible entry into the franchise from both a gameplay and narrative perspective, but all the research I have done shows that the official position of 20th Century Fox is that the game is, indeed, canon. And nothing I've seen seems to indicate that they have officially altered or reversed that stance. Just because the story was terrible doesn't change the fact that it is still part of series canon until the owner of the IP (Fox/Disney) officially says otherwise.Not to mention, labeling Aliens: Colonial Marines as non-canon just for having a bad story that creates plot holes is inconsistent with the standards applied to other source material. After all, if Aliens: Colonial Marines gets rejected by this wiki/community for creating plot holes, why isn't the same standard applied to the film Alien: Covenant? That movie was just as bad from a narrative consistency standpoint as Aliens: Colonial Marines, yet one gets rejected from series canon by the fans and the other isn't.13 Astuteintoecy·2/22/2025in GeneralPersonal Favourite Alien Film?AliensAlien Alien 3Alien RomulusPrometheus Alien covenant Vote23 Votes in PollAlien (franchise)35 Optimus Magnum Over Lord·1/30/2025in AvP FilmsWolf Was Really The Only Really Good Thing in AVPRHe was a badass fighter, taking on all the Xenomorphs and Predalien all on his own.Plus he had the 2 shoulder blasters.42 Optimus Magnum Over Lord·1/28/2025in Predator FilmsFavorite of My Favorite Hunters?ScarCity HunterJungle HunterFeral PredatorCelticWolfVote41 Votes in Poll64 Optimus Magnum Over Lord·1/24/2025in Predator FilmsFavorite "Predator" Movie? (Excluding AVP & AVPR)PredatorPredator 2PredatorsThe PredatorPreyOne Ugly MotherF*****Vote45 Votes in Poll43 Mando2007·1/23/2025in GeneralWorst Predator product?PredatorsThe Predator(2018)Archie vs PredatorVote42 Votes in Poll22'''
