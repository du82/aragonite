om A to Z. With fun illustrations, this light-hearted reimagining of the iconic movie Alien will delight fans young and old, as well as Little Golden Book collectors throughout the universe. Since 1979, Alien has been an iconic franchise that has thrilled viewers around the world. Gallery[] <img style="" src="https://static.wikia.nocookie.net/avp/images/e/ec/From_the_publisher_A_is_for_Alien.png/revision/latest/scale-to-width-down/185?cb=20240709104115" title="From the publisher A is for Alien.png (2.68 MB)" class="thumbimage" alt="An ad for A is for Alien: An ABC Book." height="184" width="185" data-image-name="From the publisher A is for Alien.png" data-image-key="From_the_publisher_A_is_for_Alien.png" data-relevant="1" data-caption="An ad for &lt;i&gt;A is for Alien: An ABC Book&lt;/i&gt;.">An ad for A is for Alien: An ABC Book.<img style="" src="https://static.wikia.nocookie.net/avp/images/8/8d/Alien_Anthology_A_is_for_Alien_ad.png/revision/latest/scale-to-width-down/185?cb=20240709232404" title="Alien Anthology A is for Alien ad.png (1.08 MB)" class="thumbimage" alt="Ditto." height="184" width="185" data-image-name="Alien Anthology A is for Alien ad.png" data-image-key="Alien_Anthology_A_is_for_Alien_ad.png" data-relevant="1" data-caption="Ditto.">Ditto. See also[] Jonesy: Nine Lives on the Nostromo - Another illustrated children's book based on the 1979 feature film Alien. Categories Categories: Children's books Community content is available under CC-BY-SA unless otherwise noted. More Fandoms Horror Sci-fi'''
