 Los Angeles, California, the City Hunter preys on warring gangmembers, members of the LAPD and the secretive OWLF taskforce. Deaths[] El Scorpio Ramon Vega Gold Tooth Daniel "Danny Boy" Archuleta King Willie Jerry Lambert Peter Keyes City Hunter Real World Events[] January[] Issue #117 of Dark Horse Presents, containing the short story Aliens: Headhunters, is released. 25[] Artist Dan Barry passes away. March[] The comic Aliens: Pig is released. Issue #119 of Dark Horse Presents, containing the short story Predator: No Beast So Fierce, is released. Issue #1 of the comic series Batman/Aliens is released. 31[] The novel Predator: Cold War, written by Nathan Archer, is published. April[] Issue #1 of the comic series Predator: Hell & Hot Water is released. 25[] Stunt performer John Lees passes away. 26[] Actress Amber Midthunder is born. May[] Issue #121 of Dark horse Presents, containing the short story Aliens: Border Lines, is released. 1[] Actress Ariel Gade is born. June[] Issue #1 of the comic series Aliens: Havoc is released. The comic Aliens: Special is released. 27[] The book Alien: The Special Effects is published. July[] Issue #1 of the comic series Predator: Primal is released. 24[] Actor Brian Glover passes away. August[] The comic Aliens: Purge is released. Issue #124 of Dark Horse Presents, containing the short story Predator: Bump in the Night, is released. September[] Issue #1 of the comic series Aliens: Alchemy is released. October[] Issue #1 of the comic series Predator versus Judge Dredd is released. November[] 26[] Alien Resurrection, the sequel to the 1992 film Alien3 and the fourth film in the Alien franchise, is released into theaters. 27[] The novelization Alien Resurrection, written by A. C. Crispin and Kathleen O'Malley,[1] is published. 28[] The book The Making of Alien Resurrection is published. December[] Issue #1 of the comic series Aliens: Kidnapped is released. Issue #1 of the comic series Predator: Nemesis is released. Issue #1 of the comic series Batman versus Predator III: Blood Ties is released. Appearances[] Predator 2/novel/comic References[] ↑ "A.C. Crispin - BOOKS & PROJECTS > PUBLISHED WORKS". Retrieved on 2019-07-116. Categories Categories: 1990s Community content is available under CC-BY-SA unless otherwise noted. More Fandoms Horror Sci-fi'''
