blished by Blackstone Audio. Contents 1 Publisher's summary 2 Audiobook 3 External links 4 Navigation Publisher's summary[] While a moon hurtles toward certain destruction, taking with it a Weyland-Yutani bioweapons lab, talks on a nearby colony could lead to all-out war among the colonies. Hygeia, an outer rim colony, is doomed as the moon on which it was built hurtles toward an inevitable collision with the dead planet Hephaestus. When a distress signal arrives from a Weyland-Yutani biowarfare outpost near the colony, a desperate plan is launched to evacuate the trapped scientists and colonists. Their destination: LV-846, a key United Americas colony where high-level talks are scheduled to address the galaxy-wide hostilities between the colonies. Once there the evacuees, including a contingent of Colonial Marines, discover a plot that could plunge the colonies into all-out war. Their only hope may be an alliance with the deadliest ally imaginable. BONUS MATERIAL: exclusive to this book, a new RPG scenario from Free League, publishers of the award-winning Alien role-playing game. Audiobook[] Alien: Enemy of My Enemy audiobook narrated by Shiromi Arserio. Blackstone Audio produced an unabridged audiobook of Alien: Enemy of My Enemy, read by Shiromi Arserio. The audiobook runs for 8 hours 49 minutes and was released on February 21, 2023. External links[] Alien: Enemy of My Enemy at Titanbooks.com Navigation[] v • d • e Novels Alien(s)Earth Hive (1992) · Nightmare Asylum (1993) · The Female War (1993) · Genocide (1993) · Alien Harvest (1995) · Rogue (1995) · Labyrinth (1996) · Music of the Spears (1996) · Berserker (1998) · Original Sin (2005) · DNA War (2006) · Cauldron (2007) · Steel Egg (2007) · Criminal Enterprise (2008) · No Exit (2008) · Out of the Shadows (2014) · Sea of Sorrows (2014) · River of Pain (2014) · Invasion (2016) · Bug Hunt (2017) · Covenant - Origins (2017) · The Cold Forge (2018) · Echo (2019) · Isolation (2019) · Prototype (2019) · Phalanx (2020