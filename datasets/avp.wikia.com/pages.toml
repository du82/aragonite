 = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Alien: Descendant Written by Declan Shalvey Penciled by Andrea Broccardo (present day)Declan Shalvey (flashbacks) Colored by Ruth Redmond (present day)Declan Shalvey (flashbacks) Lettered by Clayton Cowles Cover(s) by Javier Fernández Edited by Sarah Brunstad Publisher Marvel Comics Release date(s) November 15, 2023 Pages 40 Chronology Preceded by Alien: Annual #1 Followed by Alien: Black, White & Blood Alien: Descendant, originally titled Alien, also known as Alien Vol. 2: Descendant, is a four-issue comic book series that was published by Marvel Comics. The story was written by Declan Shalvey, illustrated by Andrea Broccardo (present day) and Declan Shalvey (flashbacks), colored by Ruth Redmond (present day) and Declan Shalvey (flashbacks), lettered by VC's Clayton Cowles, and edited by Sarah Brunstad. Cover art was provided by Javier Fernández while variant cover art was provided by various artists. It was released on November 15, 2023. The series was preceded by a one-shot tie-in prequel comic titled Alien: Annual #1. Alien: Descendant serves as the second installment of a multi-arc storyline that started with Alien: Thaw. In Marvel's Alien comics line, Alien: Descendant was preceded by Alien: Annual #1, and will be followed by Alien: Black, White & Blood. Contents 1 Publisher's summary 2 Plot 3 Reprint history 4 Gallery 4.1 Issue covers 4.2 Variant covers Publisher's summary[] #1: EVERYONE WILL HEAR YOU SCREAM! In deep space spins a world infected by the universe’s greatest killers. Most people – sane people – would construct a barrier thicker than the hulls of ten Nostromos and leave it to rot. But where most people see a death trap, Weyland-Yutani sees the biggest payout in the history of civilization. And if it costs a few human lives to secure? Those come cheap here. Corporate corruption, personal betrayals and extraordinary violence – Declan Shalvey and Andrea Broccardo’s next and greatest Alien story starts here! #2: BODIES, BODIES, BODIES! Looking for that perfect combination of sex, suspicion and slaughter? Boy, has the Weyland-Yutani Corporation got a deal for you! Come aboard the Descendant for a dip into the exotic waters of an icy moon – stay for the pulse-pounding adventure of a lifetime! Scour the ocean floor for buried treasures from a lost vessel and uncover secrets from a legendary disaster. Select participants will receive a special gift from Jun Yutani himself. Don’t miss a trip worth dying for! #3: STAY FROSTY! The Yutani family has decided to settle the invasion of LV-695 personally. But no corporate executive has the authority to tell a Xenomorph what to do…unless the order is “slaughter”! And knowing the Weyland-Yutani Corp? It just might be. Trapped between an avalanche and a watery death, the mysterious “Cole” makes her hardest decisions yet. #4: THE PERFECT ORGANISM MEETS ITS MATCH?! When Xenomorphs crash-landed on moon LV-695, they did what they do best: SLAUGHTER. And…transformed. The native kaiju of this icy rock thought themselves apex predators, but they were no match for Xenomorph fury. Now a hybrid creature has emerged…is this the evolutionary twist that ends Xenomorphs? And will any humans live to tell the tale? Jun Yutani springs his final trap! Plot[] 2208. Thirteen years after the destruction of Glacier Base VI, the crew of the Descendant were on a mission to pull a ship from its watery grave on LV-695. Reprint history[] The four-issue comic book series Alien was collected alongside Alien: Annual #1 (2023) as a trade paperback titled Alien Vol. 2: Descendant. It was released on April 2, 2024 and reused cover art from Alien :Annual #1 (2023) by Declan Shalvey. Gallery[] Issue covers[] <img style="" src="https://static.wikia.nocookie.net/avp/images/6/6c/Alien_Descendant_1_javi.png/revision/latest/scale-to-width-down/122?cb=20230905181008" title="Alien Descendant 1 javi.png (2.34 MB)" class="thumbimage" alt="Cover to issue #1 by Javi Fernández." height="185" width="185" data-image-name="Alien Descendant 1 javi.png" data-image-key="Alien_Descendant_1_javi.png" data-relevant="1" data-caption="Cover to issue #1 by Javi Fernández.">Cover to issue #1 by Javi Fernández.<img style="" src="https://static.wikia.nocookie.net/avp/images/f/ff/Alien_Descendant_2_javi.png/revision/latest/scale-to-width-down/121?cb=20231018135718" title="Alien Descendant 2 javi.png (2.88 MB)" class="thumbimage" alt="Cover to issue #2 by Fernández." height="185" width="185" data-image-name="Alien Descendant 2 javi.png" data-image-key="Alien_Descendant_2_javi.png" data-relevant="1