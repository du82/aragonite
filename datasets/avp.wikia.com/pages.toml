n check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> 20th Century Studios Headquarters: Fox Plaza, Los Angeles, California Founded by: Joseph M. SchenckDarryl F. Zanuck Years active: 1935–present Major activities: Film studio 20th Century Studios, formerly 20th Century Fox, is an American film studio and a subsidiary of The Walt Disney Company, based in the Century City area of Los Angeles, California. It was founded in 1935 by Joseph M. Schenck and Darryl F. Zanuck, through the merger of the Fox Film Corporation and Twentieth Century Pictures. It is the rights holder to the Alien, Predator and Alien vs. Predator franchises, and has distributed every film in the Alien, Predator and Alien vs. Predator series. The company's headquarters are located in Fox Plaza (which famously doubled for the Nakatomi Plaza skyscraper in the 1988 film Die Hard, directed by John McTiernan) and their principle film production site is at the nearby Fox Studios. Aside from the Alien and Predator series, 20th Century's most popular film franchises include X-Men, Anastasia, Ice Age, Rio, Die Hard, Planet of the Apes and Home Alone, plus famous TV shows such as Batman, M*A*S*H, The X-Files, Cops, In Living Color, The Simpsons, Futurama, Family Guy, American Dad!, The Cleveland Show and 24. Among the most famous actresses to come out of this studio were Shirley Temple, who was 20th Century's first film star, Betty Grable, Gene Tierney, Marilyn Monroe and Jayne Mansfield. The studio also contracted the first African-American cinema star, Dorothy Dandridge. 20th Century was the distributor (under its previous name 20th Century Fox) of the first six Star Wars movies (although the studio only owned the first film), until The Walt Disney Company bought Lucasfilm on October 30, 2012.[1] 20th Century Fox was itself later acquired by Disney in early 2019,[2] who subsequently rebranded the studio 20th Century Studios.[3] Contents 1 History 1.1 Purchase of copyrights by Disney 1.2 Post-acquisition 2 Gallery 3 References 4 Sources History[] The company was founded on May 31, 1935, as the result of the merger of Fox Film Corporation, founded by William Fox in 1915, and Twentieth Century Pictures, founded in 1933 by Darryl F. Zanuck, Joseph Schenck, Raymond Griffith and William Goetz. 20th Century Fox is a member of the Motion Picture Association of America (MPAA). Purchase of copyrights by Disney[] <a href="https://static.wikia.nocookie.net/avp/images/3/3b/Disney-Fox.jpg/revision/latest?cb=20180814150627" class="image"><img alt="Disney-Fox" src="https://static.wikia.nocookie.net/avp/images/3/3b/Disney-Fox.jpg/revision/latest?cb=20180814150627" decoding="async" loading="lazy" width="212" height="141" class="thumbimage" data-image-name="Disney-Fox.jpg" data-image-key="Disney-Fox.jpg" data-relevant="0" data-src="https://static.wikia.nocookie.net/avp/images/3/3b/Disney-Fox.jpg/revision/latest?cb=20180814150627" /></a> On December 14, 2017, The Walt Disney Company announced that it was acquiring most of Fox's parent company, 21st Century Fox, including the film studio.[4] On May 7, 2018, shares of Fox rose 5.1% when a report was released that Comcast was in talks with investment banks and firms in order to obtain bridge-financing for an all-cash bid, reportedly worth $60 billion, that threatened the Disney-Fox deal.[5] On May 29, it was reported that Disney was looking into making its own all-cash counter-offer for Fox assets in the event that Comcast went through with their offer.[6] The next day, Disney and Fox announced that they have set their shareholder vote meetings for July 10, though both companies have stated that Fox's meeting could be postponed if Comcast came through with their offer.[7] On June 12, AT&T was given approval by District Judge Richard J. Leon to acquire Time Warner, easing concerns Comcast had regarding whether government regulators would block their bid for Fox. Consequently, the next day, Comcast mounted a bid of $65 billion for the 21st Century Fox assets that were set to be acquired by Disney.[8][9] On June 18, it was reported that Disney will add to its already existing $52 billion claim to contest Comcast's proposed counteroffer for the Fox assets.[10] On June 20, Disney and Fox announced that they had amended their previous merger agreement, upping Disney’s offer to $71.3 billion (a 10% premium over Comcast's $65 billion offer), while also offering shareholders the option of receiving cash instead of stock.[11][12] On June 21, Murdoch said in response to Disney's higher offer: "We are extremely proud of the businesses we have built at 21st Century Fox, and firmly believe that this combination with Disney will unlock even more value for shareholders as the new Disney continues to set the pace at a dynamic time for our industry." That still does not prevent other companies from making a bid, as the deal needed to be voted on by shareholders.[13] Iger explained the reasoning behind the bid: "Direct-to-consumer distribution has actually become an even more compelling proposition in the six months since we announced the deal. There has just been not only a tremendous amount of development in that space, but clearly the consumer is voting—loudly."[14] On June 27, the United States Department of Justice gave antitrust approval to Disney under the condition of selling Fox's 22 regional sports channels, to which the company has agreed.[15] On July 9, a Fox shareholder filed a lawsuit to stop the acquisition from Disney citing the absence of financial projections for Hulu.[16][17] On the same day, CNBC reported that Comcast was looking for companies that could take over Fox's Regional Sports Networks. This would make easier Comcast's legislative problems regarding the takeover of Fox assets, preparing to make a new all cash counter-offer before July 27, 2018.[18] On July 12, the Department of Justice (DOJ) filed a notice of appeal with the D.C. Circuit to reverse the District Court's approval for AT&T's acquisition of Time Warner (now WarnerMedia). Although analysts say that the chances of a DOJ win are small, they say it is the "final nail in the coffin for Comcast's Fox chase. This is a clear gift to Disney."[19] On the next day, CEO of AT&T Randall Stephenson gave an interview with CNBC, about Comcast's bid for Fox: "It probably can't help it. You're in a situation where two entities are bidding for an asset, and this kind of action can obviously influence the outcome of those actions."[20] On July 13, Disney received the support of the Institutional Shareholder Services and Glass Lewis, the two most prominent proxy adviser firms in the world. Fox shareholders were recommended by the advisers as means to provide for Disney's future.[21] On July 16, CNBC reported that Comcast is unlikely to continue its bidding war to acquire Fox from Disney in favor of Sky.[22] On July 19, Comcast officially announced that it was dropping its bid on the Fox assets in order to focus on their bid for Sky. The CEO of Comcast, Brian L. Roberts, said "I'd like to congratulate Bob Iger and the team at Disney and commend the Murdoch family and Fox for creating such a desirable and respected company."[23] On July 25, TCI Fund Management, the second largest shareholder of 21st Century Fox, voted to approve the Fox-Disney deal.[24] On July 27, Disney and Fox shareholders approved Disney's purchase of Fox's entertainment assets. The acquisition's completions should be in the first half of 2019.[25] On the same day, Bloomberg News reported that out of all 15 nations yet to approve the deal, China could become the biggest threat to the merger since the trade war with the USA resulted in the merger between Qualcomm and NXP not being realized.[26] On August 9, it was reported that Viacom CEO Robert Bakish wants to license its TV ad targeting tech to the entire industry, starting with Fox.[27] On August 12, the Competition Commission of India approved the Disney-Fox deal.[28] On September 17, the European Commission announced plans of deciding what to do with the Disney-Fox deal by October 19.[29] On October 5, Disney announced the commencement of exchange offers and consent solicitations for 21st Century Fox.[30] On October 8, Disney announced that 21st Century Fox's top television executives would join the company, including Peter Rice, Gary Knell, John Landgraf, and Dana Walden. Rice will serve as Chairman of Walt Disney Television and co-chair of Disney Media Networks, succeeding Ben Sherwood while Walden is to be named Chairman of Disney Television Studios and ABC Entertainment.[31] On October 10, it was reported that the new, post-merger organizational structure of "New Fox" would be implemented by January 1, 2019, ahead of the closure of the Disney sale (which is still expected to occur during the first half of 2019).[32] On October 15, Disney offered a list of concessions to the European Commission, which extended the review deadline to November 6.[33] On October 18, Disney announced a new organizational structure for The Walt Disney Studios.[34] On November 6, the sale was cleared by the European Commission, pursuant to the divestment of certain factual television networks in Europe owned by the Disney/Hearst joint venture A&E Networks, including Blaze, Crime & Investigation, History, H2, and Lifetime. Disney will continue to be a 50 percent owner of A&E in areas outside of the European Economic Area.[35] On November 19, Chinese regulators approved the Disney-Fox deal, without any conditions, with regulatory approval from several countries still remaining.[36] After obtaining approval from Chinese regulators, Disney reported that it still needed to obtain regulatory approval from several other regulators, though the approvals from the United States, European Union, and China were considered the most important hurdles to clear.[37] On November 21, Disney expected to get approval from Brazil's antitrust division, the Administrative Council for Economic Defense (CADE), within two weeks.[38] On December 3, CADE stated that the deal would concentrate the market of cable sports channels. CADE recommended remedial measures, and has until March 23, 2019 to issue a decision; the deadline may be extended for 90 days.[39] On December 13, Disney announced a new organizational structure for its international operations and the individuals who would join the company, including Rebecca Campbell, Jan Koeoppen, Diego Lerner and Uday Shankar. Shankar who currently serves as Chairman and President Fox Networks Group Asia and Star India will lead Disney's Asian operations and will become the new Chairman of Disney India.[40] By December 14, the merger was subjected to regulation in Mexico, where Disney/Fox would account for 27.8% of content distribution across all genres. Sports broadcasting was Mexico's main concern.[41] On December 26, NBC News reported that the deal is expected to close on the last week of January 2019.[42] On January 3, 2019, Bloomberg reported that Brazil's Administrative Council for Economic Defense (CADE) is expected to approve the media-asset deal without pressing for any property sales. CADE is expecting to see a proposal from the two companies that includes behavioral changes after some back-and-forth meetings in December. Concerns centered on the sports impact from the combination of ESPN and Fox Sports. According to the report, CADE is aware that other services compete in sports broadcasting. A ruling could come as soon as January 30, when regulators come back from year-end recess.[43] On January 7, 21st Century Fox filed a registration statement with the U.S. Securities and Exchange Commission to create Fox Corporation, the company to be sp'''
