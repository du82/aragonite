full_description = '''Recent Blog Posts Blog posts 574 posts <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> THEDEMIS • 28 July 2024 1 www.bay12store.com Ive discovered i pretty neat store that focuses on the Alien franchise. Its not bad at all. Take a look if your interested. Read Full Post D1981 • 29 June 2023 1 What if Newt had been cloned instead of Ripley? As Alien 3 concluded, we saw Lt. Ellen Ripley destroy the xenomorph creature on Fury 161, and confront Weyland Yutani face to face as they tried to attain the one last specimen- an alien queen - growing inside of her. Rather than letting this happen, Ripley made the ultimate sacrifice by falling into the prison's giant furnace, ending her life and all possibilities for the xenomorph queen to propogate. It seemed to be a pretty definitive ending for the character, and for all intents and purposes, the final chapter of the Alien Trilogy had been written. There was, however, interest in continuing the series even though Sigourney Weaver was done with the Ripley character. Jorge Saralegui, 20th Century Fox's executive vice-president of producti… Read Full Post The Creature Slayer • 9 October 2022 0 Deciphering the downfall of the USCSS Theseus and the fate of its crew I wasn't sure whether to do this as a blog or a test page, but I thought it is probably best in a blog — here, I'll be trying to decipher the mess that is the order of events and characters of the story of the from AvP: The Hunt Begins' main two campaigns (the base game and Hot Landing Zone) as well as the various add-on expansions and the Unleashed mode. Hopefully, this will allow me to get a stable base ground set up from which can be referenced for the creation of THB related pages. 1 Chronology 1.1 Cat Roulette — 1 hour before emergency status 1.2 Cat Roulette — 15 minutes before emergency status 1.3 Cat Roulette — 5 minutes after emergency status 2 Characters 3 Other important notes Captain LeGrand and Rebecca are in the canteen, the latter checking … Read Full Post HadAnd0426 • 25 August 2022 3 Another channel stealing info without credit Got another esteemed Alien/Predator 'lore' channel that seems to just be reading Xenopedia extracts without credit. Named 'VK'. https://www.youtube.com/watch?v=wC7kjBtFJII He's clearly just reading from the wiki whilst he talks. Its quite laughable. I bought up the issue and he seems to have since shadowbanned my reply. Surprise, surprise. HadAnd0426 (talk) (Contribs) 23:16, 25 August 2022 (UTC) Read Full Post Darth Crucible 01 • 4 August 2022 2 time travel could/should time travel be introduced to the Alien saga Read Full Post Darth Crucible 01 • 2 August 2022 2 new Alien 3 should there be a new Alien 3 Read Full Post SynthNorbert • 11 June 2022 1 Alien Alien: Revival #12 X Queen II Read Full Post Cityhunter90 • 11 May 2022 0 i am back just got back from my holiday, so i might be around a bit more just probably not as much as i used to Read Full Post Fox357magnum • 2 May 2022 1 Aliens: Fireteam weapons Read Full Post Cityhunter90 • 23 April 2022 1 The Reason im not around as much anymore so some people may have noticed im not replying to anything most of the time well that is because soon im going on holiday therefore i may not reply to anything this month, thats all i wanted to say, stay safe everyone Read Full Post JungleHunter11 • 3 April 2022 2 'Prey' I am literally so excited for the film Prey to be released this summer!!! I feel like it's a countdown until the faithful day of its debut. I am really excited and can't believe it's already the fifth Predator movie already! All I want is for it to 1) NOT SUCK and 2) bring up crap from modern society. If it doesn't do either of those things that it automatically makes it a descent movie. Although (in my opinion) Shane Black recently made a Predator film back in 2018 which I though was phenomenal!!! If Prey is that good, then I will be happy. Read Full Post Cityhunter90 • 12 March 2022 1 Just saying i wont be replying to much stuff anymore its just not much stuff is getting posted and it got quite boring so you might not see me much Read Full Post JungleHunter11 • 1 March 2022 2 NECA Figures Does anybody think NECA should make more ALIEN and PREDATOR figures? Recently, they realised an Elder Predator, but besides the hundreds of figures they've made is there anyone(s) that you would like to see in the markets? Read Full Post Cityhunter90 • 20 February 2022 3 If you want to ask anything leave the questions here im leaving this here for people who want to ask me anything so go ahead Read Full Post SynthNorbert • 3 January 2022 1 The vital substance of robotics. Recently, I have been on a quest to find every last description of the white fluid that flows through a synthetic human's artificial veins to ultimately determine the best official name for the substance. Below, I am working on compiling every description I can find regarding the stuff. Please feel free to add to the conversation! While Alien: The Weyland-Yutani Report makes mention of a patent for the realistic skin used for synthetics, it makes no mention of a patent for "synthesized blood" to my knowledge. "Thick white ichor–the substance that flowed through a synthetic's artifical veins–rained down from the ceiling.." - Aliens: Prototype Personally, I feel like "ichor" is the most suitable word to be an official name for the "circulating fl… Read Full Post MUTHUR9000 • 24 December 2021 1 Inferno's Fall Hello, So surprise! This was part of the reason I had to step back from my duties in the fandom. I hope you will enjoy the story Pip and I will be bringing into Alien canon. Alien: Inferno's Fall is out July 26, 2022! Make sure you pre-order at your local book store. This is muthur9000 signing off... Read Full Post SynthNorbert • 13 November 2021 2 PREY / 1715 The new Predator film PREY is set to be a prequel about Comanches fighting the Yautja dating back 300 years from its release in 2022. Anyone else think this movie might offer up some detailed lore surrounding the infamous pistol engraved with the year 1715 from Predator 2?? Read Full Post SynthNorbert • 29 October 2021 0 Aliens: Dead Orbit - A chronological edit The Plot of Aliens: Dead Orbit in chronological order: First contact In 2295, an unknown vessel approached the Sphacteria, a fueling depot orbiting the gas giant Pylos. Park identifies the unmarked ship as an old Wey-Yu freighter that had been sold at auction to a private buyer, She also informed Captain Hassan that the ship contained Hypersleep chambers, and that the crew of presumed salvagers may still be in stasis. Communications Officer Rook is less than enthusiastic about the whole event, believing they may be pirates. Captain Hassan tells Wascylewski and Park they are all going to shuttle to and board the unmarked vessel, alongside Medical Officer Harrow and Security Officer Torrenson, leaving Rook behind. Once aboard, the five crew-members … Read Full Post HadAnd0426 • 10 August 2021 0 Pred Character Template redundant? Hi all. I would like to know everyone's take on my opinion regarding character templates. Upon comparing the generic character template and Pred template, it seems that the Predator Character template is actually inferior to just simply adding them to the normal character template - Homeworld is almost always going to be Yautja prime, and Clan/Affiliation will almost always be the same thing (i.e Berserker's affilaited with the Super Predator Clan which will immediately repeated with 'Clan' directly underneath), it is essentially just repeating the same thing twice. Beyond that, it is pretty interchangeable from the normal character template, which begs the question if we should just use the Character template for Yautja characters. I for … Read Full Post MUTHUR9000 • 7 August 2021 0 Farewell It has been a very long time since I have had a chance to write let alone breathe. Between working full time and running 2 businesses and being a mum of two it was a very difficult decision to step back from Studio Yutani. When I can I still post, I am looking for people who are passionate to take over the blog but it is difficult to find someone who has the time to keep up with all the regular social media posting. In the meantime I have made my final edits on the Alien Timeline on my page https://yutani.studio/alien-timeline/ I still love Alien dearly and it takes up my every thought, I have high hopes for the future of the franchise and I am so happy there will be many more fans who will enjoy it. For now farewell Read Full Post Juoig7799 • 10 July 2021 0 Test SPECIAL ORDER TEST 223-11 Begin log >Hello there , and welcome to this stupid blog post with no purpose. (you are cool by the way) End log Read Full Post KylaraE • 3 June 2021 0 FandomDesktop opt-in is LIVE Check it out, and let me know your thoughts! Report bugs and feedback to me here. To access the new FandomDesktop skin: Go to Special:Preferences In the top menu, select "Appearance" Under "Skin" select "FandomDesktop" Select any FandomDesktop preferences you want such as default light/dark mode, content width, and right rail collapse. (Personally I am all about that WIDE WIDTH experience.) Click "Save" at the bottom You can also opt-out the same way, just go to Special:Preferences and switch the Skin from FandomDeskop back to Oasis. Helpful links! New blog post about opt-in FandomDesktop preparation guide FandomDesktop highlights with links to staff blog posts For admin: Blog about the customization policy If you find a bug, please let me know about i… Read Full Post Xhosayande • 16 May 2021 0 Community Convo regarding Bueracrat I have created a conversation regarding a concern I have about Xenopedia's moderation. If you wish to engage with your own input, concerns, ect. please join here! Please remember to follow the Good Faith and Behavior rules laid out in the Wikia. Thank you! - Xhos Read Full Post Xhosayande • 15 May 2021 0 Predaliens Read Full Post Xhosayande • 15 May 2021 0 Runner 2020 )}} |notable = The Dragon |skincolor = Bronze, Black |othernames=Dog AlienOx AlienScout}} The Runner, Sentry — The mature form of a Runner. Crusher — A stage 6 evolution of the Sentry. Prowler -- A similar caste to the runner. Read Full Post Xhosayande • 15 May 2021 0 Queen 2020 Special Edition)}}{{Infobox Species |image = |imagecaption = The Antarctica Queen with a Drone. |name = Queen |homeworld = Xenomorph Prime, potentially any planet |height = 4.5 metres (typical) Read Full Post Xhosayande • 15 May 2021 0 Praetorian 2021 )}} |skincolor = Black |notable = Specimen 6 Gunnison Predalien}} Praetorians Read Full Post Xhosayande • 13 May 2021 0 New Drone Page (Workshop) Read Full Post Resident4ever • 16 April 2021 1 Complete Timeline As I promised, I started to gather all comic, book, etc. and put here with a timeline, to help out this wiki. Sometimes the dates are given in the book or comic, but somehow the articles here don't mentions it. So far it's not a complete list, I will update it as soon as I have time for it. Note: the years only shows the main story's placement, not flashbacks, memories, etc. Predator: 1718 – 1718 Predator: God's Truth - 1926 Predator: Strange Roux – 1931 july Predator: Demon’s Gold – during WW2 Aliens: Earth Angels – 1950s Aliens: A Comic Book Adventure – 2257 Aliens: Dead Orbit - 2295 AvP (Atari Jaguar) - 2329 AvP (SNES) – 2493 AvP: The Last of his Clan - 2593 Read Full Post Resident4ever • 31 March 2021 1 Timeline Greetings! First let me intruduce myself: I am the creator of the hungarian AvP wikia and a huge fan of the franchise. I just noticed, that here the Timeline is missing a lot of years. For example I have mine: https://alienspredatoraliens-versus-predator.fandom.com/hu/wiki/Id%C5%91vonal This don't have all the source materials, I still need to finish a bunch of comics, books, etc. but as you can see I have a lot of dates, that are written in the books/comics (Aliens: Music of the Spears for example set in 2223 and 2224), or Aliens: Defiance (2137 december to 2138). When I use the ' marking, it's means it's just a relativ date, the event happens around this period and I give clues why I think its there. Is there a reason why Xenopedia don't s… Read Full Post M$. B0yee • 19 February 2021 0 Is the company evil The company asked my coworker Greg to conduct some "tests." It's been 3 weeks and I found his arm in the hallway. Just. His. Arm. Read Full Post Fox357magnum • 4 February 2021 0 NECA Figures Biographies 1 Films 1.1 Predator 2 1.1.1 Armored Lost Predator (Ultimate) 1.1.2 Scout Predator (Ultimate) 1.1.3 Stalker Predator (Ultimate) 1.1.4 Guardian Predator (Ultimate) 1.1.5 Battle Damaged City Hunter Predator (Ultimate) 1.1.6 Warrior Predator (Ultimate) 1.1.7 Shaman Predator (Ultimate) 1.1.8 Boar Predator (Ultimate) 1.1.9 Snake Predator (Ultimate) 1.1.10 Elder Predator (Ultimate) 1.2 Alien vs. Predator 1.2.1 Celtic 1.2.2 Chopper 1.2.3 Scar 1.2.4 Elder Predator 1.2.5 Ancient Warrior Predator 1.2.6 Temple Guard Predator 1.2.7 Ancient Warrior Predator 1.3 Predators 1.3.1 Berserker Predator 1.3.2 Falconer Predator 1.3.3 Tracker Predator 2 Comics 2.1 Predator: Life and Death 2.1.1 Cracked Tusk Predator 2.1.2 Hive Wars Predator 3 Games 4 Alien vs. Predator - Arcade Game 4.1 Chrysalis (Xenomorph Variant XX121A… Read Full Post HadAnd0426 • 8 January 2021 0 Insights and popular pages gone Following the wiki overhaul, I can't seem to locate wiki statistics on page views anymore, specifically the popular pages section seems to have just totally disappeared. Anyone know how to access this? HadAnd0426 (talk) (Contribs) 12:27, 8 January 2021 (UTC) Read Full Post TheAntennaGamer • 7 December 2020 2 Alien: Blackout I think it's great! I would love to play it. And it is really similar to FNAF (not that i'm a real fan of FNAF). And I heard the main character is Amanda Ripley, so that's cool unto itself. So the game might be in the time-period when Ellen Ripley is in Hyper Sleep. And that's all I have to say about it. Read Full Post HadAnd0426 • 28 November 2020 1 WY Report or Alien RPG handbook For those who has both sources, which book do you think serves as a better encyclopedia for the franchise?? the Weyland Yutani report or the handbook that comes with the Alien Roleplaying Game?? I would very much like to hear peoples opinions on this, as I am seeking to invest in the handbook myself, though Im cautious as to whether it will be a waste of money or not.HadAnd0426 (talk) (Contribs) 18:38, 28 November 2020 (UTC) Read Full Post Fenris Wolfbrother • 8 October 2020 1 color Okay so I get that we're using a different software and all but can the articles get some color because it's kinda hard to read them? I dont mind the new software stuff or whatever, but the articles like yautja, and engineers are hard to read when they're gray words on a white background or whatever. Read Full Po'''
