["https://www.awa.asn.au/resources"]
title = "Resources | Australia’s water professional network | AWA"
description = "Explore the podcast, publications, and jobs platform from Australia’s largest water network. Ask AWA."
full_description = '''Home Resources RESOURCES Research, publications and go-to source of water knowledge MEMBER MAGAZINE Latest Issue, April 2024 Current magazine is part of the comprehensive communications suite for our 5,000 members. Launched just prior to Ozwater each year and serving as the official Ozwater magazine, Current publishes news and analysis, case studies, and the latest in scientific research and water policy. Each edition also includes 8-14 technical paper executive summaries. hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, 'b61971e9-eb7c-4b13-a6b6-5186d80fc141', {"useNewLoader":"true","region":"na1"}); hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, 'c349955c-46b8-41af-bfe9-3260a4867a09', {"useNewLoader":"true","region":"na1"}); LATEST NEWS 27 Feb 2025 2025 ACT Water Awards winners revealed This year’s winners of the Australian Water Association’s (AWA) 2025 ACT Water Awards were celebrated at the ACT Water Leaders Dinner & Awards on 27 February at Old Parliament House. The ACT Water Awards recognise members whose leadership, innovative research and projects make a meaningful impact on advancing the water sector. AWA Chief Executive Corinne Cheeseman praised the finalists and winners for their outstanding contributions and dedication to driving excellence in the sector. "Congratulations to the winners of the ACT Water Awards. Each… Read more 27 Feb 2025 Smart solutions to future-proof Australia's water security Imagine a future where Australians don’t have access to readily available water. As the driest inhabited continent in the world, Australia knows the importance of water security all too well. With its history of droughts, unpredictable… Read more 27 Feb 2025 Why inclusion is about more than just opening doors The WaterAble Leadership Program is helping to redefine what inclusion looks like in the Australian water community. Designed to empower people with disability through leadership development, the program offers practical tools and peer… Read more 27 Feb 2025 Week in water: updates from across the water community This week in water, Jacobs has been recognised as one of the world’s top environmental and sustainability consultancies, while Aurecon continues its streak as Australia’s most popular engineering employer. Across the states, Sydney Water… Read more View all news WATER E-JOURNAL Climatic influences on Warragamba water quality Q Ollivier, L Oliveira, L Hamilton Understanding the role that a changing climate has played on the source water quality of Sydney’s water supply systems is necessary for long term strategic supply planning. This paper analyses 22 years of water quality data ... ... Read paper The treatment of PFAS-impacted groundwater using novel regenerable ion exchange resin: A five-year case study D M Kempisty, C Gordon, J Haxen, O Mowla, M G Nickelsen, S Woodard This paper will provide an update on PFAS treatment using regenerable resin data from bench-, pilot-, and full-scale systems ... ... Read paper Water e-Journal Papers Submit a Technical Paper Editorial Guideline Advertising googletag.cmd.push(function() { googletag.display('div-gpt-ad-1634877755266-0'); }); PODCAST SERIES Podcast Series 01 Playlist Podcast Series 02 Playlist Podcast Series 03 Playlist Podcast Series 04 Playlist View all podcasts Advertising googletag.cmd.push(function() { googletag.display('div-gpt-ad-1634878182685-0'); }); Careers in Water A WATER JOBS PLATFORM Careers in Water is the hub for water jobs and career development. Employers can find their next team member by searching for talent, and job seekers can search for vacancies and register for tailored job alerts. FIND YOUR NEXT WATER ROLE ABOUT AUSTRALIA'S BIGGEST WATER NETWORK The Australian Water Association shares information and knowledge, connects our members and stakeholders, and inspires positive change through advocacy. OUR HISTORY OUR TEAM OUR BOARD & GOVERNANCE STRATEGY'25 ANNUAL REPORT'''
