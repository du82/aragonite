["https://www.awa.asn.au/resources/water-e-journal"]
title = "Water e-Journal"
description = "Water e-Journal is Australia's number one online platform for high-quality water, technical science papers in Australia. These Papers go through rigorous quality control and peer-review before publication and cover a broad range of topics relating to our most precious asset."
full_description = '''Using artificial intelligence to improve pipe condition assessment Q Bechet, X Philoleau, M Mellado-Ruiz, A Siqueira, M Aguilar 3 Home Resources Water e-Journal WATER E-JOURNAL Technical papers online Water e-Journal is your online hub for high-quality technical water papers in Australia. Papers go through rigorous quality control and peer-review before publication and cover a broad range of topics relating to our most precious asset. AWA members unlock exclusive access to newly published papers for 3 months. Not a member, but would like instant access to all papers?Find out more and join here. Why submit a paper to the Water e-Journal? Water e-Journal is the premier online journal for urban water science and technical issues in Australia. Publishing in the Water e-Journal can provide valuable networking opportunities, collaborations, and discussions that can further your research, work and career. All technical papers that are submitted will be assessed for publication in Water e-Journal, with a one-page Executive Summary also considered for publication in Current magazine. Papers published in the journal also qualify for the prestigious Guy Parker Award, which is announced at Ozwater each year. See the Best Paper Honour Roll here. The Water e-Journal is proud to showcase a special edition dedicated to student research each year. We invite submissions from students working on water-related projects either in progress, or completed within the calendar year of submission. This edition offers a platform for emerging researchers to share their findings with the water community, providing insights into innovative solutions and future developments. Find out more about Student Edition guidelines and how to submit and be a part of advancing the water sector. Submissions for 2024 close Friday 20 December 2024. The Water e-Journal is a peer-reviewed journal that publishes high quality technical papers about all aspects of the water industry. By publishing in Water e-Journal, you are contributing to the collective body of knowledge in the field of water-related matters. Your work can help address important issues and contribute to solutions for global water challenges. Journals play a vital role in increasing the discoverability of your work, as they are regularly accessed by communities of interested readers. Submitting to the Water e-Journal can enhance the visibility of your work, extending beyond your close network of contacts and colleagues. Water-related research often spans multiple disciplines, and Water e-Journal attracts a diverse readership and can potentially lead to invaluable interdisciplinary collaborations. The Water e-Journal and its predecessor WATER also provide a valuable resource and historical record of the technical challenges and changes the Australian Water industry has faced over the past 45 years. Back issues can be viewed here and current contributions help to maintain that record. hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, 'cfac3e41-2002-4ef2-adef-5267ee477c6c', {"useNewLoader":"true","region":"na1"}); Archive 2019 2020 2021 2022 2023 2024 Student Edition Guy Parker Award | Winning Paper 2024 Digital tool for driving circular economy outcomes in the Australian red meat industryThis study presents the development of a novel digital tool aimed at facilitating the preliminary sizing and economical evaluation of integrated resource management facilities for wastewater treatment in red meat processing plants. See paper Watch webinar LATEST PAPERS Per- and polyfluoroalkyl substances (PFAS) degradation and defluorination involving ultraviolet and ultrasonication activated advanced oxidation and reduction D Wanninayake, D Hamilton, J Yu, A Busch The objective of this research was to adapt currently available water treatment techniques for micropollutants for improving PFAS breakdown efficiency ... Read Full Paper Advancing wastewater treatment with UV/peracetic acid-biofiltration synergy S Ajaz, M J Radke, A A Hassan, P Kaparaju, R N Michael, F D L Leusch This study evaluates a novel approach that combines UV/peracetic acid (UV/PAA) advanced oxidation process (AOP) with biological activated carbon filtration to degrade OMPs ... Read Full Paper Impact of organic contents on sludge rheology and dewaterability S Tabatabaei This study analyses the effect of different conditioning technologies on the non-degradable organic matter in sludge and their impact on dewatering performance and rheological behaviour ... Read Full Paper Containment and removal of sewage overflows from impacted surface waters - Sydney Water’s current practices and optimisation opportunities Y Yan This practical research project focused on helping Sydney Water to determine improvements that could be made ... Read Full Paper Biomimetic membrane technology developments relevant to sustainable reuse of resources M Arsic, C Byrt, A D Rosa, P Hilder, S Iqbal, S McGaughey, S P Nandala, C O’Sullivan, X Wu, Z Xie Membrane technologies are increasingly soughtto provide solutions for processes in industrial and municipal wastewater ... Read Full Paper Transforming land use management to enhance water quality in catchments G T Ayele, B Yu and David P Hamilton A groundbreaking PhD study has explored the impacts of afforestation in a small temperate catchment, demonstrating its potential to enhance water quality while addressing ... Read Full Paper Metagenomic analysis of foaming anaerobic digesters T Micallef This research will contribute to the understanding of foaming mechanisms, which is necessary for developing methods for management and prediction of foaming events ... Read Full Paper Tannin-based coagulants application in the food processing industry F Tessele, J Hales, L Moreno This study evaluates the performance of an organic coagulant derived from tannins sourced from Acacia tree bark in wastewater treatment ... Read Full Paper Climatic influences on Warragamba water quality Q Ollivier, L Oliveira, L Hamilton Understanding the role that a changing climate has played on the source water quality of Sydney’s water supply systems is necessary for long term strategic supply planning. This paper analyses 22 years of water quality data ... Read Full Paper The treatment of PFAS-impacted groundwater using novel regenerable ion exchange resin: A five-year case study D M Kempisty, C Gordon, J Haxen, O Mowla, M G Nickelsen, S Woodard This paper will provide an update on PFAS treatment using regenerable resin data from bench-, pilot-, and full-scale systems ... Read Full Paper Editorial Committee Chair:Daniel Visser (Chair) Secretary:Robert Ford Committee Members:Dr Dharma DharmabalanProf Ted Gardner Dr Lionel Ho Mr Asoka Jayaratne Dr Tim Muster Ms Karen Rouse Ms Kala Senathirajah Mr Nick Swain RECOMMENDED READS Recycled Water for a Greener Parkes J Fyfe, C Li, G Oliveira, H Al Kabanchi, S Trad, A Francis 1 Low-carbon future opens opportunities for water sector N Tawona 2 Using artificial intelligence to improve pipe condition assessment Q Bechet, X Philoleau, M Mellado-Ruiz, A Siqueira, M Aguilar 3 Indigenous water sensitive urban design T Brockbank, E Afoa 4 Anaerobic Digestion and the Circular Economy F Tessele, J B van Lier 5 USEFUL LINKS Editorial Guidelines and How to Submit a Paper Get in touch'''
