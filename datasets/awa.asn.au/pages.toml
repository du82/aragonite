title = "Awards Honour Roll"
description = "View the Australian Water Association State and National Awards Honour Roll"
full_description = "AWARDS HONOUR ROLL Recognising outstanding achievement Find past recipients of the prestigious Australian Water Association's Water Awards. National Awards Honour Roll 2024 ORGANISATIONAL AWARDS R&D Excellence Award (Sponsored by WaterRA)Ecosystem Functions in the Murray-Darling Basin (Investing in New Knowledge to Adapt the Murray-Darling Basin Plan) - CSIRO and Murray Darling Basin Authority The Ecosystem Functions project addressed key ecosystem functions knowledge gaps at a basin-scale to inform improved management and delivery of water for the environment within the Murray-Darling Basin. Organisational Excellence Award (Sponsored by Hydroflux) Waterwise Perth Action Plan 2019 - Department of Water & Environmental Regulation, Water Corporation and other contributing organisations The WA Government’s Waterwise Perth Action Plan is a successful example of whole-of-government action to tackle the challenge of a growing city in a changing climate. Lead by the Department of Water and Environmental Regulation, eight agencies working together have made great progress towards transforming Perth into a leading waterwise city by 2030. Infrastructure Project Innovation Award (Regional) (Sponsored by SMEC) Laramba Water Treatment Plant: Improving the Health of a Remote Community - Power and Water Corporation and Clean TeQ Water Power and Water Corporation, in collaboration with Clean TeQ Water, have successfully delivered a water treatment solution for the removal of naturally occurring uranium from the groundwater at Laramba community. The project has delivered on Power and Water's commitment to safe, sustainable and secure drinking water for all Territorians. Infrastructure Project Innovation Award (Metro) (Sponsored by SMEC) Eastern Treatment Plant Biogas Handling System Stage 1 Upgrade - Melbourne Water and John Holland-KBR Joint Venture The ETP Biogas Handling Plant Upgrade project is an industry leading example of Melbourne Water delivering the necessary operational requirements while ensuring immediate and on-going social, economic, and environmental benefits. The project team worked collaboratively, to ensure the Plant’s biogas conversion to bioenergy is maximised supporting their Net Zero strategy. Water Industry Safety Excellence Award (Sponsored by WSAA) Innovative and Safe Solution for Water Distribution System Maintenance - Portable Chlorine Disinfection Skid - SUEZ, SA Water and other contributing organisations An innovative solution for water distribution system maintenance. A portable secondary disinfection unit, that ensures safe and efficient tank disinfection. With full automation and ground-level dosing, it eliminates WHS challenges while meeting ADWG standards. Customer Experience Award (Sponsored by WSAA) School Education Waterwise Experience - Water Corporation INDIVIDUAL AWARDS Water Professional of the Year Award (Sponsored by KSB) Prof. Leslie (Phil) Duncan, Galambany Professorial Fellow Phil has over 40 years’ experience working with communities and the government to improve the lives of Aboriginal people through his employment and active volunteer community work. Phil is extremely passionate about promoting greater partnerships and collaboration using two way knowledge exchanges and enhancing the voices of Traditional Owners in land and water management. Young Water Professional of the Year Award (Sponsored by Xylem) Dr Samuel Skinner, Lead Process Engineer, Aurecon Dr Sam Skinner is a Lead Process Engineer, Water at Aurecon who leads hydrogen, energy, water, and oxygen (HEWO) projects supporting many water utilities. He focuses on the water industry’s path to net zero and beyond. Sam completed his PhD at Melbourne University on improving water recycling and sludge handling. Best Water E-Journal Paper – In honour of Guy Parker Digital Tool for Driving Circular Economy Outcomes in the Australian Red Meat Industry Authors: Fabiana Tessele Fabiana is a dedicated water and wastewater treatment expert. Her paper presents the development of a novel digital tool aimed at facilitating the preliminary sizing and economical evaluation of integrated resource management facilities for wastewater treatment in red meat processing plants. STUDENT AWARDS Student Water Prize (Sponsored by Guidera O’Connor) Deep Learning for Prognostics of Wastewater Treatment Facilities Maria Alvi, The University of Western Australia This project developed a cost-effective prognostic framework using machine learning that approximates/forecasts key-parameters of wastewater processes ahead of time to enable enhanced decision support, averting costly failures. An automated state extraction enhances system insights for monitoring remote-site events. The framework improves treatment efficiency, advancing knowledge in sustainability and resource optimization. Australian Stockholm Junior Water Prize (Sponsored by Xylem) Hey-sop! Fix-up! and Avo-clean Water System Lily Rofail, PLC Sydney Growing up in Sydney, Lily has always been interested scientific, environmental, and social issues around water. At 16 years old, this budding young scientist is interested in solving global water problems and how she can make a difference. Her project investigates the use of water hyssop and avocado skin powder in removing heavy metals from aquatic environments. 2023 ORGANISATIONAL AWARDS R&D Excellence Award (Sponsored by WaterRA)Goyder Institute Healthy Coorong, Healthy Basin Research Program - Department for Environment and Water, Flinders University, The University of Adelaide, The University of South Australia, and other contributing organisations The Goyder Institute Healthy Coorong, Healthy Basin Research Program generated critical knowledge and capability for the future of the Coorong. Involving 72 researchers and 13 organisations in 5 collaborative and transdisciplinary teams, the research is informing management decisions for the Coorong, ensuring that the Coorong continues to provide important ecological, cultural, social and economic values. Organisational Excellence Award (Sponsored by Stantec) Activating South Australia’s Reservoir Reserves for Recreation - SA Water Underpinned by the best-available science and supported by leading-edge technologies, opening South Australian reservoir reserves for recreational access has proven that drinking water utilities can play an even broader role supporting the health, sustainability, and prosperity of our community. Infrastructure Project Innovation Award (Regional) (Sponsored by SMEC) Jubullum Aboriginal Community Water Project - Department of Planning and Environment, Clarence Valley Council and EcoTeam Safe, clean, reliable drinking water was delivered to the Aboriginal community of Jubullum, which suffered critical water supply challenges after a series of natural disasters. The Aboriginal Communities Water and Sewerage Program worked closely with residents to build new water infrastructure and implement a culturally led water efficiency and leak repair campaign, ensuring long-term water solutions. Infrastructure Project Innovation Award (Metro) (Sponsored by SMEC) Australia’s First Biosolids Gasification Facility - The Logan Water Partnership: Logan Water, Downer, WSP and Stantec, and ARENA Logan Water has pioneered an Australian-first – a facility which transforms biosolids into renewable energy and a sustainable biochar. Biosolids gasification destroys chemicals like persistent organic pollutants and micro and nano-plastics, while reducing carbon emissions by about 6,000 tonnes a year. It also saves operating costs and creates a new revenue stream for Logan City. Water Industry Safety Excellence Award (Sponsored by WSAA ) Epsom Main Sewer Relining - Melbourne Water Melbourne Water rehabilitated the Epsom Road Main Sewer by installing a bespoke mechanical plug and bypass network, diverting flows and enabling relining with Cured in Place Pipe. These safety initiatives delivered positive worker health and safety outcomes and reduced the project duration and community impact. Customer Experience Award (Sponsored by WSAA) Leak Alert Program - South East Water Southeast Water’s leak alert program is empowering customers who have a digital meter to detect leaks and save money and water. Digital meters allow us to alert customers about continuous water usage. We send them a notification and step them through some simple checks to identify the cause of the potential leak. INDIVIDUAL AWARDS Water Professional of the Year Award Ian Law, Principal, IBL Solutions Ian is an internationally recognised and awarded thought leader. He is described as the embodiment of professional excellence in urban water solutions, an ambassador for the water industry, and is dedicated to building a secure water future for all. Young Water Professional of the Year Award (Sponsored by Xylem) Chelsea Hayward, Senior Process Engineer, Jacobs Chelsea strives to use her technical capabilities and excellent people skills for good. She is driven to give back to her community, bettering the lives of all through access to clean water and sanitation. She is well connected across the water industry and is an ardent learner and considered mentor. Best Water E-Journal Paper – In honour of Guy Parker Evaluating and Comparing Circular Economy options in Yarra Valley Water’s 2030 Strategy Authors: Lisa Ehrenfried, Jodie Bricout, Tim Grant and Francis Pamminger This paper delves into the innovative strategy that resulted in the development of a circular baseline analysis framework specially adapted for water utilities and identified new opportunities that go far beyond the water cycle impacts and benefits. STUDENT AWARDS Student Water Prize (Sponsored by Guidera O’Connor) Turning Waste into a Resource: Developing Novel End-Use Pathways for Water Treatment Sludge Minh Duc Nguyen, Deakin University Minh Duc Nguyen has recently completed his PhD on a collaborative research project between Water Research Australia, Deakin University and Barwon Water to develop innovative technologies to reuse and manage water treatment sludge. Minh Duc was awarded the 2020 Nancy Millis Memorial PhD Award and an Australia Award in 2013. Australian Stockholm Junior Water Prize (Sponsored by Xylem) SolarCyanoSlayer - An Eco-Friendly Elimination of Cyanobacteria Mikayla Rodger, Meriden School Raised in a Wiradjuri family, the interrelation between conserving water to preserve country has always been apparent to Mikayla. The 15-year old’s scientific curiosity drew her to this project that investigates how cyanobacteria threaten farmer’s water sources and the food we eat. The SolarCyanoSlayer was made to eliminate reproduction of cyanobacteria in standing and eutrophicated waterbodies using solar-powered circulation, filtration, and oxygenation. Mikayla goes on to represent Australia at the Stockholm Junior Water Prize in Sweden. 2022 ORGANISATIONAL AWARDS R&D Excellence Award (Sponsored by WaterRA) The Department for Environment and Water, CSIRO Flinders University, The University of Adelaide and The University of South Australia’s; Goyder Institute for Water Research - Second Term Research Program The Goyder Institute collaboration delivered high-quality, independent research to inform priority government policies. The research is supporting the wellbeing of First Nations; delivering economic outcomes through sustainable use of recycled water and the discovery of new outback water; increasing carbon sequestration; and improving the health of the River Murray. Organisational Excellence Award (Sponsored by Stantec) Barwon Water’s Aboriginal Employment and Retention Strategy Project The strategy is a key commitment under the Barwon Water Innovate Reconciliation Action Plan. At the heart of this framework is understanding and embedding Aboriginal Cultural Values and the holistic wellbeing of Aboriginal Peoples. It provides the foundations for creating and delivering culturally appropriate, respectful and meaningful outcomes for Aboriginal employees. Infrastructure Project Innovation Award (Regional) (Sponsored by SMEC) Torres Strait Island Regional Council’s, Mer (Murray) Island Water Network Management Program Following the successful implementation of an integrated leak reduction and network management approach conducted by the Torres Strait Island Council, the remote Mer (Murray) Island community in the Torres Straits has had strict water restrictions lifted for the first time in 20 years. The program was also in collaboration with Assetlife Alliance, Department of Local Government, Racing and Multicultural Affairs and Torres Strait Regional Authority. Infrastructure Project Innovation Award (Metro) (Sponsored by SMEC) SA Water, KBR and Aurecon’s SA Water’s Zero Cost Energy Future Program SA Water’s industry-leading Zero Cost Energy Future is a highly innovative approach to the optimisation of energy generation and use. Solar PV and battery storage at multiple locations works with sophisticated technology that manages the use and export of electricity to reduce operating costs and improve the sustainability of services. This project was also in collaboration with KBR, Aurecon Enerven and Clutch Consulting. Water Industry Safety Excellence Award (Sponsored by WSAA) Logan Water, Downer, and Mass Products’ project: Lock It In: An Innovation for Safer Network Isolations Logan Water, Downer and Mass Products have engineered an innovative isolation lock for buried water valves. The lock enables physical control of a water network isolation; providing confidence that hazardous stored energy is controlled while maintenance occurs. It fits common B and D class valve boxes and is commercially available. Customer Experience Award (Sponsored by WSAA) SA Water's Our Customers Program Drawing on customer feedback and insights, the Our Customers program is building and strengthening SA Water’s customer-focused culture. It is helping improve customer experiences and outcomes by building connections between customers and our people across the organisation. INDIVIDUAL AWARDS Water Professional of the Year Award Eamonn Kelly, General Manager, Major Program Delivery at Melbourne Water General Manager, Major Program Delivery, Melbourne Water by day. Social justice champion by night. Eamonn Kelly, is a visionary who leads by example. From safety, delivery, sustainability and social value, Eamonn continues to leave his mark - not only on the water sector, but more importantly on the lives of many in our State and Country. Young Water Professional of the Year Award (Sponsored by Xylem) Michael Carter, Principal Process Engineer at Hunter H2O Michael is a passionate and inspiring young principal engineer, with a vision for all water supplies across regional NSW to be safe and resilient. Still a farm boy at heart, his regional background has cultivated meaningful impact throughout the water industry and has inspired collaboration across divisions. Best Water E-Journal Paper – In honour "
