["https://www.awa.asn.au/events/national-water-week-2024"]
title = "National Water Week 2024"
description = "National Water Week makes a splash across Australia every third week in October, inspiring individuals, communities and organisations to build awareness around the value of water."
full_description = '''Home Programs National Water Week National Water Week Making a splash across Australia every third week in October About the Week ____________ National Water Week inspires individuals, communities, and organisations to build awareness around the value of water. Access to clean water is hugely important to our daily lives, and it’s down to all of us to protect our water environments and resources and use water wisely. As the national host for the week, we encourage organisations, schools, and communities to create, take part in, organise, and promote National Water Week events, activities, and educational resources. #NationalWaterWeek hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, '7fede8c9-12b7-4687-9cfd-99496ac5772a', {"useNewLoader":"true","region":"na1"}); 2024 theme: Accelerating Action Water ____________ The 2024 National Water Week theme is Accelerating Action. It serves as a powerful rally cry for our community to address water's vital role in the current climate crisis. Together, we will spark a collective movement towards a sustainable water future, taking concrete steps to bring about enduring change. We invite the community to accelerate action this National Water Week and contribute to shaping a sustainable water future for generations to come, urging everyone to be part of this transformative movement. #AcceleratingAction #NationalWaterWeek hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, '7fede8c9-12b7-4687-9cfd-99496ac5772a', {"useNewLoader":"true","region":"na1"});'''
