description = "The Future of Water - The Australian Context survey was developed by the Australian Water Association and Arup."
full_description = '''Home Resources Future of Water Report The Future Of Water The Australian Context About the Report ____________ The Australian Water Association (AWA), in partnership with Arup, has produced The Future of Water Report – the Australian Context from data collected from a 2022 survey distributed across Australia. The survey captured over 750 responses, highlighting how individuals and communities across Australia value and interact with water and key priorities for future water management at both a local and national level. Responses received were from a diverse range of geographies, industries and demographics.What makes The Future of Water Report particularly valuable is a user-friendly data visualisation tool developed to allowing interested parties to delve into various sub-sets of respondent data based on age, geographical location and other metrics. #futureofwaterreport hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, 'e544f194-bd91-49f6-bddf-a29143398d4e', {"useNewLoader":"true","region":"na1"});'''
