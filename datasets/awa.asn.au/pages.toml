full_description = '''National Biosolids Conference 2025 17 Mar, 2025 - 18 Mar, 2025 | 8:30am – 5:00pm AEST | Hotel Grand Chancellor Hobart The biennial Australian & New Zealand Biosolids Partnership's National Biosolids Conference is heading to Hobart in 2025. Held over two days, this conference will examine key developments in the industry, focusing on the role of industry, regulators, and the community as champions for sustainable biosolids management and end-use. The future of biosolids is filled with both challenges and opportunities. Under this year's theme, Biosolids: Future Possibilities, the conference aims to empower participants to embrace the uncertainties ahead. By shifting the focus from potential obstacles to the vast possibilities within the biosolids sector, presentations will highlight the significant contributions that biosolids can make to the circular economy. hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, '42dc745e-d3ff-4ecc-b4a7-76328ee689ec', {"useNewLoader":"true","region":"na1"}); Day 1 Keynote Speaker: Sarah Wilcox We’re excited to announce Sarah Wilcox, a Pakana woman from lutruwita/Tasmania, as Day 1 keynote speaker for the National Biosolids Conference. Sarah, with her background in communications and community, will Honour Country and speak on “Layna nayri, milaythina nayri Palawa nayri” – the crucial link between healthy waterways, healthy Country, and healthy Tasmanian Aboriginal people. Her insights on environmental and cultural sustainability will set the tone for an impactful conference. Day 2 Keynote Speaker: Per Henrik Nielsen We're excited to announce Per Henrik Nielsen, a Project Director in VCS Denmark, as Day 2 keynote speaker for the National Biosolids Conference. As Project Director, Mr. Per Henrik Nielsen serves as a focal point for development of optimization possibilities in VCS Denmark. The work over the past years has been aiming at making the major treatment facilities energy producing and to prepare VCS Denmark for wastewater treatment of the future. The development related to resource recovery and obtaining CO2 neutrality for the entire utility is a part of the assignment in one of the leading utilities in Denmark. Mr. Nielsen brings more than 35 years of experience leading and participating in multi-disciplinary teams in a large number of sanitary infrastructure projects and general environmental projects. Mr. Nielsen has a broad background including work as consultant and managerial role in utility. Event Details Conference & Exhibition: Date Monday 17 & Tuesday 18 March, 2025 Venue Hotel Grand Chancellor Hobart Address 1 Davey St, Hobart, TAS 7000 Site Tours: Date Wednesday 19 March Time 8:00am - 11:00am Collection Point Hotel Grand Chancellor Hobart Lobby, 1 Davey St, Hobart, TAS 7000 Cost Member $45 | Non-Member $56 [available as an add on to a conference registration] Details Join us on one of two site tour thanks to TasWater.Site Tour One - Blackmans Bay Wastewater Treatment PlantSite Tour Two - Bryn Estyn Water Treatment PlantFind out more.If you have registered for the conference and would like to register for a site tour, please email vgaldas@awa.asn.au Ticket Prices Please note all ticket prices include GST.* Early Bird Rate ends Tuesday, 4 February. Registration Type Member Concession Non-Member Early BirdRate* StandardRate Early BirdRate* StandardRate Early BirdRate* StandardRate Full Registration All-day catering + conference dinner $968 $1075 $726 $806 $1355 $1505 One Day Registration Morning tea, lunch and afternoon tea for one day only + option to purchase a ticket to the conference dinner $500 $555 $375 $417 $702 $780 Full Registration + 1 year membershipAll-day catering + conference dinner + 1 year membership $1193 $1325 hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, 'ab4b8099-6960-46d4-9e25-8593b461a7f7', {"useNewLoader":"true","region":"na1"}); hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, '23088c81-7b36-4bdd-a43e-3e58950e35a7', {"useNewLoader":"true","region":"na1"}); hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, '0c55b056-cac1-485f-a920-d9144ec7096e', {"useNewLoader":"true","region":"na1"}); Accommodation: Make it a stay Discounted accommodation rates are available at The Hotel Grand Chancellor Hobart on Sunday 16 to Wednesday 19 March. To book, please use the link below. Conference City Side Room $260 per night Conference Harbour View Room $ 310 per night Rates are room only for single occupancy and do not include breakfast. Discount rates will be available until 13 February 2025 or sold out. From 13 February, pending availability, the Hotel will quote best available rates. Please note these discounted rates required to be guaranteed by credit card. Cancellations are accepted free of charge until 7 days prior to arrival. Any cancellations after this time, of if you fail to arrive on the day, you will incur full accommodation charges. hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, '9d9e6ed6-02f1-4fe1-acd8-c59899dc9763', {"useNewLoader":"true","region":"na1"}); Sponsorship and Exhibition Opportunities Organisations can get involved by sponsoring or exhibiting at the National Biosolids Conference 2025. Download Prospectus here. Want to find out more? Submit an enquiry now, and a member of our team will reach out: Submit a Sponsorship Enquiry here and an Exhibition Enquiry here. If you would like more information about this event, please contact:Conference & EventVerina Galdas, Event Manager | Ph: 02 9436 0055 | E: vgaldas@awa.asn.au ExhibitionMichael Silber, Exhibition Manager | Ph: 02 9467 8428 | E:msilber@awa.asn.au Sponsorship Troy Waite, Partnerships, Sponsorships and Advertising Manager | Ph: 0418 404 692 | E: twaite@awa.asn.au Paul Darvodelsky ScholarshipLocus Liu, Project Office, ANZBP | Ph: 02 9467 8407 | E: lliu@awa.asn.au Thank You to our Sponsors Platinum Sponsor Conference Dinner Sponsor Coffee Cart Sponsor Conference Session Sponsors Silver Sponsor Conference Feature