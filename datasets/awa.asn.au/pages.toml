["https://www.awa.asn.au/programs/mentoring"]
title = "Mentoring"
description = "AWA Mentoring Program"
full_description = '''Home Programs Mentoring NATIONAL MENTORING PROGRAM Connecting aspiring water professionals to a community of passionate members. Registrations for the 2025 National Mentoring Program are now open!The new national program leverages a purpose-built digital platform to ensure seamless mentor-mentee matching, communication, and progress tracking. This exclusive program for AWA members is structured to foster meaningful relationships, whether you’re in a major city or a remote location. For Mentees: You’ll receive guidance from seasoned professionals, helping you broaden your professional network and achieve personal and career goals with structured support. For Mentors: This program allows you to give back to the industry by supporting the next generation, while also enhancing your leadership and coaching skills and expanding your professional network across Australia.The program is at no cost to members in our pilot year. Additionally, employees of Corporate Members who are not members may also participate as Mentors at no cost and as Mentees for $100. If you are not a member, join AWA today. Register now to be a Mentor or Mentee! Registrations close 6 March for the 2025 program.Thank you to our National Mentoring Program Supporters AECOM and SMEC - Solving Complex Challenges. Empowering Mentorship: Anna West's Journey in the AWA Mentoring Program Discover the power of mentorship with Anna West, Technical Principal - Water Infrastructure at SMEC, as she shares her unique journey and experience, both as a mentee and a mentor in the AWA Mentoring Program. READY TO TAKE THE PLUNGE? Mentor Registration AWA Members and employees of Corporate Members can register to be a Mentor through the digital platform. Mentor Registration Mentee Registration AWA Members can register to be a Mentee through the digital platform from 6 February. Mentee Registration Complete Profile Information Mentors and Mentees complete profile details in the platform including career details and focus for mentoring. Mentoring Matching Mentees request Mentors from suggested matches. Mentors review requests and confirm mentoring pairings before 6 March. Virtual Program Launch Mentors and Mentees to attend the virtual Mentoring Program Launch in March. Start Mentoring Mentors and Mentees to connect via the digital platform to set goals and plan the mentoring journey. Meet Regularly Use our platform to schedule your virtual meetings and discuss progress, challenges, and opportunities. WHAT TO EXPECT FROM THE PROGRAM Participant GuideMentoring Checklist Accelerate Your Career Gain a competitive edge by learning from seasoned professionals Expand Your Network Connect with diverse mentors and fellow mentees, creating lasting relationships Personalised Guidance Our mentors tailor their advice to your aspirations, helping you set meaningful goals Build Your Confidence Excel professionally through constructive feedback from experienced mentors Contribute to the Industry Be part of a community committed to advancing the water sector with sustainable solutions FAQs About the National Mentoring Program What is the AWA National Mentoring Program? The AWA National Mentoring Program is an evolution of our successful state and territory based mentoring programs, designed to connect water professionals across Australia. Through our new digital platform, it offers structured guidance, networking, and knowledge-sharing opportunities to help individuals grow professionally and contribute to the water industry. What are the benefits of participating in the AWA Mentoring program? Mentors Enhance your leadership, coaching, and communication skills by guiding future industry professionals. Gain fresh perspectives and insights that can inspire your own career and approaches. Build your professional network and connect with a diverse group of mentees and fellow mentors committed to industry advancement. Mentees Receive one-on-one support from experienced mentors across the water sector, tailored to your specific career stage and professional interests. Connect with water professionals from around the country, expanding your industry contacts and knowledge. With a structured approach, the program offers resources and milestones to help you stay on track and measure your progress Why did you change the program from Branch based programs to a National Program? We transitioned from state and territory based mentoring programs to a national, digital platform enabled framework to be a more accessible, supported, professional development program for participants. The new online platform facilitates a seamless matching process. It also offers greater reach and inclusivity of members from remote, rural, and international locations and those who may be unable to attend in-person networking or professional development events. Who is eligible to participate in the National Mentoring Program? The program is an exclusive benefit available to AWA Members and employees of AWA Corporate Members. Non-members who are interested in participating can join AWA to unlock access to mentoring and other great benefits. What are the costs involved in the mentoring program? Mentors and mentees must have an active Australian Water Association (AWA) membership to take part in the program, or be an employee of a Corporate Member. There is no cost for mentors, as they generously contribute their knowledge, skills, and expertise. For mentees, participation in this pilot year is free of charge for current financial members. Corporate members may add employees who are not currently members, to participate as Mentees for $100 per employee. What are the dates for the 2025 National Mentoring Program? Mentor Registrations for the 2025 program open through the digital platform on 16 January 2025. Mentee Registration opens on 6 February and matching commences. Registration and matching will be completed by 27 February with a Virtual Launch event on 6 March 2025. How long do I need to commit to the mentoring program? The AWA National Mentoring Program requires a 10-month commitment. During this time, it is suggested that participants meet approximately once a month, though specific meeting schedules should be agreed upon by the mentor and mentee. How do I sign up for the National Mentoring Program? Registrations are now open for Mentors only (from January 16 2025) Follow the unique registration link https://www.pushfar.com/mentor-registration/iKeUZ8LcJK/group/b4d36f8b-5d62-11ef-b49e-0a58a9feac02/ Complete the Platform Registration Form by entering personal details, including name, email, location, career level, job title, and organisation. Provide a short introductory sentence that highlights your background. Set your Mentoring Preferences and specify your areas of expertise, professional experience, and mentoring preferences. Save Preferences and finalise your registration by saving all inputs and submitting the form. This initial submission grants limited access to the platform. Once approved by program administrators, mentors receive a welcome email with login credentials, granting full access to the PushFar mentoring platform. Enhance the profile for optimal matches with additional details like educational background, career experience, and specific mentoring goals to improve matching quality. Update your settings with details such as your time zone and notification preferences. *Registration for Mentees opens on 6 February 2025. The Mentoring Program What do I need to do to start Mentoring? To start mentoring, you’ll need to complete a few essential steps to set yourself up for success in the AWA National Mentoring Program. These include registering on our digital platform, completing your profile, updating your platform settings, and preparing for your mentoring journey. Once matched, you’ll collaborate with your mentee to set goals, schedule regular meetings, and track progress. For a detailed step-by-step guide, please review our Mentoring Checklist to ensure you’re ready to make the most of your mentoring experience.What is the matching process? In the registration form and after registration, mentors and mentees will be asked to create their profile with the expertise they are seeking or possess. Once a mentee has set up their profile, the platform will consider the profile information to suggest the most appropriate mentor matches considering things like interest areas and career goals so make sure you spend time on your profile. Mentees will then request to connect with a Mentor, and once that is accepted, the mentoring relationship can commence. Can I be both a mentor and a mentee? Yes, the platform allows you to sign up as both a mentor and a mentee. You can indicate your preferences during registration. Can I mentor more than one mentee? Yes, mentors can choose to be matched with up to two mentees at a time, depending on their availability and preference. How often should mentors and mentees meet? The suggested commitment is to meet approximately once a month over the 10-month program with a minimum of 5 meetings through the course of the mentoring relationship. Given we are trying to open Mentoring to a wider pool of water professionals in dispersed geographic locations, you will most likely meet virtually. If you live nearby you can opt to meet in person. What steps should I take during the first meeting with my mentor or mentee? During the first meeting, it’s important to establish clear goals for the relationship, define expectations, and agree on how and when to meet. Be sure to discuss communication preferences, confidentiality, and how you will evaluate progress. How do I get the most out of the mentoring relationship? Set clear objectives for your mentoring journey and communicate them with your mentor. Use the mentoring digital platform tools and resources to help scheduling meetings, preparing for discussions, and following through on action items. What resources are available for mentors and mentees? The AWA National Mentoring digital platform provides various resources, including guides, templates, and training, to help both mentors and mentees succeed in their roles. You can access these resources through the platform's resource. What should I do if issues arise in the mentor-mentee relationship? First, try to resolve any issues through open communication with your mentor or mentee. If the problem persists, you can contact the AWA mentoring team for further assistance or mediation. If necessary, a new mentor or mentee may be assigned. What is the process for ending a mentoring relationship? Mentoring relationships can conclude when the mentee’s goals have been achieved, or if personal circumstances change. It’s important to agree on an ending process that is amicable and respects the efforts made by both parties. If the relationship is not working, you may decide to end it with a no-fault agreement. The Mentoring Digital Platform How does the digital mentoring platform work? PushFar is the digital platform that supports the AWA National Mentoring Program. It facilitates the registration process, matches mentors and mentees, and provides tools for managing your mentoring relationship, such as scheduling meetings, setting goals and tracking progress. How will I know how to navigate the platform? You can find some ‘How to’ instructions for the most used features on this page of the website. And there is also a number of resources and guides within the Pushfar platform. Go to the lightbulb icon/tab to access them. How are mentors and mentees matched? The AWA Mentoring platform uses a matching algorithm based on Mentor and Mentee profiles provided during registration including areas of expertise mentors can provide and areas of development mentees are looking for. If necessary, the AWA team can assist in helping to find an appropriate match. How soon after signing up will I be assigned a mentor or mentee in the platform? The matching process begins shortly after the Mentor registration period closes. Once mentee registrations open, mentors can expect to start receiving match requests on the platform.• Mentees will register and initiate match requests from 6 February.• Mentors review and confirm matches through the platform, with all pairings finalised by 27 February.The exact timing may vary depending on how quickly mentees submit match requests and mentors review them. You will receive notifications through the platform and emails are matches are requested and accepted. If you encounter any delays or need assistance, the AWA Mentoring Team is available to help. What resources are available for mentors and mentees? The AWA National Mentoring digital platform provides various resources, including guides, templates, and training, to help both mentors and mentees succeed in their roles. You can access these resources through the platform's resource hub. What if I have technical issues with the AWA National Mentoring platform? If you encounter any technical difficulties while using the platform, you should first consult the platform’s help features and resources. If you can’t find the answer you're looking for then please reach out to the AWA National Mentoring team at mentoring@awa.asn.au. How is privacy and confidentiality handled in the program? All information shared during the application process and throughout the mentoring relationship is kept confidential according to AWA's privacy policies. Mentors and mentees are also encouraged to maintain confidentiality within their mentoring discussions. TESTIMONIALS Natalie Muir Mentor I am constantly blown away by the talent that exists in our YWPs. Chantal was no exception! So much energy and drive. So many things that she has done in her career already. It was a great experience and I love getting to know new people! I’ve already registered for the 2023 program Danika Smith Mentee I’ve gotten a lot out of the program so far and I’d like to do it again. It’s such a good way to learn about the industry and how to build your career from someone who is willing to share their experiences and their knowledge. Once I have some more experience behind me, I would definitely like to offer my services as a mentor. :root { --swiper-theme-color: #8A8F99; } hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, 'b524a720-310c-4943-ba03-5fc25c05f667', {"useNewLoader":"true","region":"na1"}); Welcome SMEC and AECOM as National Mentoring Program Supporters.'''
year_published = 2025
clearnet = "https://www.awa.asn.au/programs/mentoring"
