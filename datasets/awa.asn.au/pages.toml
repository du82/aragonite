["https://www.awa.asn.au/guy-parker-award"]
title = "Guy Parker Award"
description = "The Guy Parker Award, presented for the Best Technical Paper at the Australian Water Awards, is a testament to Guy Parker's enduring contribution to water sector innovation and professional development."
full_description = '''Home Awards Guy Parker Award Overview The Guy Parker Award honours the legacy of Cecil David (Guy) Parker, a founding figure in the Australian water sector. One of the original minds behind the Australian Water Association, Parker's influence extended beyond national borders, impacting international water standards through his work with the World Health Organisation. Known for his visionary role in unifying disparate professional bodies into a cohesive water management community, Parker was instrumental in establishing the Australian Water and Wastewater Association in 1962. As the Association's President, he launched its first journal, evolving into today's Water e-Journal. Parker's early career achievements include identifying a corrosive bacterium affecting Melbourne's sewer system, later named Thermithiobacillus parkerensis in his honour. The Guy Parker Award, presented for the Best Technical Paper at the Australian Water Awards, is a testament to his enduring contribution to water sector innovation and professional development. The recipient will be awarded at the Australian Water Awards ceremony during Ozwater. Eligibility Anyone can submit a paper to the Water e-Journal. You do not need to be a member of the Australian Water Association. This award is open to all authors whose papers have been published in Water e-Journal. Judging Criteria Click here for more info Closing Date Papers must be published in Water e-Journal in 2024. hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, '52f6e061-a416-42cc-8cc2-b82bb8971aac', {"useNewLoader":"true","region":"na1"});'''
