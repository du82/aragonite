title = "Outstanding achievements recognised at the 2023 NT Water Awards"
description = "The winners of the 2023 Australian Water Association’s NT Water Awards have been announced at the NT Water Awards Dinner on Thursday, 12 October at the Wharf One in Darwin."
full_description = '''Outstanding achievements recognised at the 2023 NT Water Awards Oct 13, 2023 | 1 mins read by Water Source The winners of the 2023 Australian Water Association’s NT Water Awards have been announced at the NT Water Awards Dinner on Thursday, 12 October at the Wharf One in Darwin. The NT Water Awards recognise the contribution of the Association's members for their inspiring leadership and innovative research, programs and infrastructure projects. AWA Board Member, Eric Vanweydeveld and AWA Member Engagement WA & NT, Kyllie Whitehead, congratulated all the finalists and winners for their significant contribution and outstanding achievements. "We would like to congratulate all finalists and winners, as they embody our purpose to inspire and drive a sustainable water future." This year's NT Water Award winners will represent the state in the national Australian Water Awards, which will be presented at the Association's annual water conference and exhibition, Ozwater'24, in Melbourne. Winners: Organisational Excellence Award: NT Government agencies and Power and Water Corporation – Territory Water Plan The Territory Water Plan is the Northern Territory’s first whole of government strategic plan for water. Launched in June 2023, the plan aims to deliver water security for all Territorians, now and into the future. Infrastructure Project Innovation Award (REGIONAL): Power and Water Corporation and Clean TeQ Water – Laramba Water Treatment Plant: Improving the Health of a Remote Community Power and Water Corporation, in collaboration with Clean TeQ Water, have successfully delivered a water treatment solution for the removal of naturally occurring uranium from the groundwater at Laramba community. The project has delivered on Power and Water's commitment to safe, sustainable and secure drinking water for all Territorians. Young Water Professional of the Year (sponsored by Xylem): Skye Haigh, Practice Lead - Remote Development at Ekistica Skye lives and works in the Northern Territory, and with her passion for working in remote communities, hopes to continue to drive positive change and deliver impactful projects in the water sector. Water Professional of the Year: Steven Tickell, Principal Hydrogeologist at Department of the Environment, Parks and Water Security, Northern Territory Government Steve is regarded as the resident authority of groundwater systems in the Territory, which sustain culturally significant sites, dependent ecosystems and provide water supply to over 90% of our communities. The Association congratulates all the award finalists and winners and thanks our partners and sponsors for supporting this event and these important industry awards. View photo gallery Conference and Awards Dinner Sponsor National Young Water Professional of the Year Award Sponsor National R&D Excellence Award Sponsor Awards Australian Water Awards Northern Territory (NT) NT Water Awards Share RELATED NEWS Celebrating the Territory’s high achievers at the NT Water Awards Alex Morrison The Australian Water Association's Northern Territory (NT) Water Awards winners have been announced at the NT Water Awards Dinner… Read Full Paper NT Water Award winners reimagining our water future Water Source The winners of the Australian Water Association's Northern Territory (NT) Water Awards have been announced at the Water in the Bush… Read Full Paper A night of celebration for the Northern Territory’s water sector Water Source The winners of the Australian Water Association's (AWA) Northern Territory Water Awards were announced at the Water in the Bush 30… Read Full Paper'''
