["https://www.awa.asn.au/upcoming-events/iwd25webinar"]
title = "International Women's Day Webinar 2025 - March Forward: Empowerment, safety and equity in the water sector"
description = "Join us Tuesday 06 March to celebrate International Women's Day 2025."
full_description = '''International Women's Day Webinar 2025 - March Forward: Empowerment, safety and equity in the water sector 6 Mar, 2025 | 12.30pm AEDT Join us Thursday 06 March to celebrate International Women's Day 2025. Aligned with the UN’s theme March Forward, join us for a powerful online panel session hosted by WSAA and the AWA . This year’s discussion will focus on the national emergency that is domestic, family and sexual violence, a crisis that sees one Australian woman killed every four days by a current or former partner, a crisis that impacts every Australian. Our panellists will explore: How domestic, family and sexual violence affects everyone, whether directly or through someone we know and work with The lasting consequences of domestic, family and sexual violence, including financial abuse The crucial role of leaders in our sector to drive change and contribute to the solution The responsibility of organisations in fostering a supportive environment for customers and employees, and creating a culture of respect and safety Be part of this vital conversation as we work together to march forward and end domestic, family and sexual violence.If you or someone you know has experienced domestic, family and sexual violence, call 1800RESPECT on 1800 737 732, text 0458 737 732 or visit www.1800RESPECT.org.au for online chat and video call services. Speakers Stacey Nelan Project Manager - DFSV Workforce, SA Water Stacey is a survivor-advocate of domestic, family and sexual violence and dedicated to driving social change. As a speaker, facilitator, and workplace culture expert, she helps organisations establish supportive environments for staff affected by domestic, family, and sexual violence. Stacey spent three years as senior advisor in White Ribbon Australia’s workplace accreditation team, coaching over 150 organisations to build safer workplace cultures.A prominent survivor-advocate in South Australia, Stacey was part of the SA’s DFSV delegation at the 2021 Women’s Safety Summit, she testified for the ACTU’s campaign for paid domestic violence leave, and over the past year she worked in her advocacy capacity with the Essential Services Commission of Victoria on their Safety by Design project.Stacey co-founded Adelaide’s Pay Our Respects to Australian Murdered Women event, now in its 7th year, honouring the lives of women lost to violence. Since March 2023, she has been the Corporate Compliance Manager at SA Water and has provided expert advice to meet the Essential Services Commission of SA’s requirements for safeguarding customers facing financial hardship due to DFSV. Stacey is also about to begin a secondment to lead a company-wide project supporting staff who may disclose domestic, family, and sexual violence. Damian WellsManaging Director, Coliban Water Damian’s career has included work in technical and leadership roles in water, environment and regulation. Under Damian’s leadership, Coliban Water were the first Australian water utility to sign the “Respect and Protect” pledge to include financial abuse in their terms and conditions. After early-career technical roles in catchment management and water, Damian held an operational leadership role at Goulburn-Murray Water before being appointed CEO of North Central Catchment Management Authority in 2008. In 2015 Damian was appointed an Executive Director at the Environment Protection Authority Victoria where he led the statewide regulatory operations. Damian also has over 10 years’ experience as a Non-Executive Director having previously served on the Board of Anglicare Victoria and its predecessor organisations.Damian is Chair of Zero Emissions Water (ZEW), the La Trobe University Bendigo Advisory Board and a former Board member of Anglicare Victoria. Sarah De YoungGeneral Manager People Infrastructure, John Holland GroupSarah De Young is the General Manager People Infrastructure at John Holland. John Holland is committed to providing support for employees experiencing domestic and family violence, and financial support for crisis services. Meg DallingCustomer Advocate, ANZ BankMeg Dalling is the Customer Advocate for ANZ Bank. She aims to be a voice for customers, building trust, helping to influence fair customer and community outcomes, and building and sustaining a banking culture based on strong ethical foundations.Meg is responsible for leading ANZ’s strategic approach to customer vulnerability and accessibility and provides advice on sensitive and complex cases. She meets regularly with community organisations and participates in industry forums to listen, learn and ensure ANZ’s approach to consumer issues is informed by best practice and lived experience.A lawyer by background, Meg has deep experience in governance and regulatory engagement. Prior to joining ANZ, Meg worked at a number of Australian law firms and at a Philippines law firm. Meg has been an active volunteer in the community legal sector and in refugee and disability mentoring programs and has served as a Director on a number of community boards. Event Details Date Thursday 6th March 2025 Time 12:30pm - 1:30pm AEDT Webinar Link Register below - webinar link will be sent via email the day prior Registration hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, 'ccd2904c-763d-4861-bfe4-13dbd6e8f3cc', {"useNewLoader":"true","region":"na1"}); Membership benefits:If you wish to find out more about AWA's membership benefits, contact membership@awa.asn.au. If you work for a water utility and are interested in collaborating on how to support customers and employees impacted by family violence contact info@wsaa.asn.au For more information please contact: E: events@awa.asn.au Webinar Women in Water International Women's Day Share Terms & Conditions By registering for an Australian Water Association (AWA) Event, you agree to accept the following Terms and Conditions. Click here to view AWA’s privacy policy.'''
year_published = 2025
