title = "Student Awards"
description = "Student Water Awards - Recognising outstanding achievement"
full_description = "Home Awards Student Awards STUDENT WATER AWARDS Recognising outstanding achievement Our student water awards recognise individual and organisational achievement and innovation. Students enjoy free entry to the Student Water Prize for university or tertiary institute students and the Australian Stockholm Junior Water Prize for high school students. CATEGORIES Student Water Prize Australian Stockholm Junior Water Prize Conditions of Entry View Conditions of Entry Student Water Prize Overview The Student Water Prize aims to encourage and reward students for excellence in water-related studies and research, and provides a forum for students to display their academic excellence, innovation, and/or research findings to future employees, clients and the water industry.Student Water Prizes are awarded at state or territory level. Winners will receive one year of AWA membership and are invited to present papers as part of the Ozwater conference program, where a national winner is awarded. Eligibility Open to students and recent graduates of an Australian university or tertiary institute focused on water-related topics. Open to both members and non-members of the Australian Water Association. Conditions of Entry Click for more info Judging Criteria What is the relevance of your project to the water industry? (250 words) Explain your research hypothesis and methodology (250 words) Outline key outcomes of your project (500 words) Outline how the outcomes of your research could be further developed for the water industry (500 words) Closing Dates Nominations for the 2025 season are closed. Nominations for the 2026 season will open in June 2025. FREQUENTLY ASKED QUESTIONS Do I need to be a member of AWA to enter the Student Awards? The Student Award is open to students and recent graduates of an Australian university or tertiary institute focused on water-related topics. You do not need to be a member of AWA. Why enter? Be recognised for water excellence and innovation Showcase your solutions for current and future water challenges Raise your profile as you embark on your water career Receive one year of complimentary AWA Membership Inspire peers to make positive change in how we work with water Connect with like-minded students nationally and internationally"
