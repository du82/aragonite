["https://www.awa.asn.au/resources/latest-news/celebrating-our-wa-winners-for-2023"]
title = "Celebrating our WA Winners for 2023"
description = "The Australian Water Association's (AWA) Western Australian (WA) Water Award winners have been announced at the WA Water Awards Dinner on 3 November at The Ritz-Carlton Perth."
full_description = '''Celebrating our WA Winners for 2023 Nov 6, 2023 | 3 mins read by Water Source The Australian Water Association's (AWA) Western Australian (WA) Water Award winners have been announced at the WA Water Awards Dinner on 3 November at The Ritz-Carlton Perth. The WA Water Awards recognise the contribution of the Association's members for their inspiring leadership and innovative research, programs and infrastructure projects. AWA CEO Corinne Cheeseman congratulated all the finalists and winners for their hard work and outstanding achievements. “AWA’s Water Awards recognise the important and ground-breaking work our members do for the water sector and for their communities,” Cheeseman said. “The WA Water Award finalists and winners showcase the best examples of innovation and are a reflection of our members' collective contribution towards our sustainable water future. “From transforming Perth to a leading waterwise city by 2030 to machine learning for prognostics of wastewater treatment facilities, the people and projects we are celebrating demonstrate the excellent work being done across Western Australia.” This year's WA Water Award winners, will represent the state in the national Australian Water Awards, which will be presented at the Association's annual water conference and exhibition, Ozwater'24, in Melbourne. Winners: Organisational Excellence Award: Department of Water & Environmental Regulation, Water Corporation and other contributing organisations – Waterwise Perth Action Plan 2019 The WA Government’s Waterwise Perth Action Plan is a successful example of whole-of-government action to tackle the challenge of a growing city in a changing climate. Eight agencies working together have made great progress towards transforming Perth into a leading waterwise city by 2030. R&D Excellence Award (Sponsored by Water Research Australia): Claire Doll, The University of Western Australia – The Economics of Public Open Spaces Under Water Scarcity Claire Doll is a PhD candidate at the University of Western Australia. As an environmental economist, much of her work focuses on estimating values for environmental goods and services. Through her quantitative research and focus on stakeholder engagement, she aims to contribute to sustainable land use policy and planning. Infrastructure Project Innovation Award (Regional): Water Corporation, Curtin University, and contributing organisations – Horrocks WTP Continuous Electrochlorination (CEC) Upgrade In June 2023, the Water Corporation of Western Australia commissioned the world’s first benign full-scale CEC aesthetics removal water treatment plant at Horrocks. Application of benign CEC electrochemical technology at Horrocks is the first example of its kind. It is a game changer for the water industry. Student Water Prize (Sponsored by GHD): Maira Alvi, The University of Western Australia – Deep Learning for Prognostics of Wastewater Treatment Facilities This project developed a cost-effective prognostic framework using machine learning that approximates/forecasts key-parameters of wastewater processes ahead of time to enable enhanced decision support, averting costly failures. An automated state extraction enhances system insights for monitoring remote-site events. The framework improves treatment efficiency, advancing knowledge in sustainability and resource optimization. A high commendation was also awarded to Ashley Granado, Curtin University of Technology for her project: Improving Biofiltration Treatment of Light-Greywater: The Effect of Hydraulic Loading Rate on Nature-Based Filtration Efficiency This year we recognised GHD’s 20th year supporting the Student Water Prize in WA. Young Water Professional of the Year (Sponsored by Xylem): Liz Duguid, Electrical Engineer, Water Corporation Liz Duguid is an Electrical Engineer working for Water Corporation. She's passionate about renewable energy and encouraging the next generation of engineers. Water Professional of the Year: Cristiano Carvalho, Water Corporation Cristiano is a qualified professional mechanical engineer with 20 years’ experience performing technical and management roles in the Water sector. Cristiano has had the opportunity to work in both a metropolitan and regional Western Australian context and is actively engaged in volunteering in Water Sanitation projects in Australia and overseas. Water Sensitive Urban Design*: LD Total, City of Canning, Water Corporation – Lake Street Urban Stream Lake Street Urban Stream has seen an open channel drain turn into a thriving urban space, providing key habitat within an ecological corridor for a multitude of fauna and flora, and an attractive space for visitors to stop and relax. *State based award only The Association congratulates all the award finalists and winners and thanks our partners and sponsors, Department of Water and Environmental Regulation, Water Corporation, Sacyr Water Australia, Acciona Agua, Eurofins ARL, Steel Mains, GHD, Xylem and Water Research Australia for supporting this event and these important industry awards. hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, '1f5dc07d-60e3-43a7-835f-480b64baa036', {"useNewLoader":"true","region":"na1"}); View Gallery THANK YOU TO OUR GALA DINNER & AWARDS SPONSORS: Diamond Partners Platinum Partners Gold Partners Student Water Prize (proudly supporting the WA SWP for 20 years) National Young Water Professional of the Year Award Sponsor National R&D Excellence Award Sponsor Awards Australian Water Awards Western Australia (WA) WA Water Awards Share RELATED NEWS 2024 WA Water Awards: acknowledging commitment and passion Water Source The Australian Water Association’s (AWA) Western Australian Water Awards were celebrated at the The Ritz-Carlton in Elizabeth Quay,… Read Full Paper WA Water Award winners announced as part of National Water Week Water Source The winners of the Australian Water Association's Western Australian (WA) Water Awards have been announced at the Water Awards… Read Full Paper WA marks National Water Week with water awards Water Source The winners of the Australian Water Association's (AWA) Western Australian Water Awards were announced last week at the WA Water… Read Full Paper'''
year_published = 2023
clearnet = "https://www.awa.asn.au/resources/latest-news/celebrating-our-wa-winners-for-2023"
