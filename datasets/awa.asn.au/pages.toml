["https://www.awa.asn.au/resources/latest-news/2024-wa-water-awards-acknowledging-commitment-and-passion"]
title = "2024 WA Water Awards: acknowledging commitment and passion"
description = "The Australian Water Association’s (AWA) Western Australian Water Awards recognise efforts that drive sustainable water solutions and resilience."
full_description = '''2024 WA Water Awards: acknowledging commitment and passion Nov 2, 2024 | 2 mins read by Water Source The Australian Water Association’s (AWA) Western Australian Water Awards were celebrated at the The Ritz-Carlton in Elizabeth Quay, Perth, on 1 November, recognising efforts that drive sustainable water solutions and enhance resilience under a changing climate. The Western Australian Water Awards recognise the contribution of the Association’s members for their inspiring leadership and research, and innovative programs. AWA Chief Executive Corinne Cheeseman commended the finalists and winners for their remarkable contributions to the sector. "I extend my heartfelt congratulations to all the winners and finalists of this year’s Western Australian Water Awards,” she said. “These achievements are a true testament to the passion, creativity and resilience that drive our sector forward. From sustainable water solutions to groundbreaking research and leadership, each accomplishment highlights the power of innovation and collaboration. “It is inspiring to see such a strong commitment to shaping a more sustainable water future, ensuring we can meet the challenges ahead with purpose and impact." This year’s Western Australian Water Award winners will go on to represent the state in the national Australian Water Awards, with winners presented at the AWA’s annual water conference and exhibition, Ozwater’25, in Adelaide. WINNERS Organisational Excellence Award Water Corporation, Department of Water and Environmental Regulation, and Murdoch University – WaterSmart Farms Water Security and Resilience in a Drying Climate The WaterSmart Farms project supports the adoption of on-farm desalinisation plants in agricultural regions to process brackish groundwater into a suitable resource for livestock, crop agronomy and other agribusiness activities. R&D Excellence (sponsored by Water Research Australia) Tessele Consultants – Novel Low-Field Nuclear Magnetic Resonance Monitoring of Anaerobic Digestate During Solid-Liquid Separation This research revolutionises wastewater treatment by applying low-field nuclear magnetic resonance and magnetic resonance imaging technologies to optimise the dewatering of anaerobic digestate. The findings enhance operational efficiency, reduce costs and support sustainable waste management, contributing to a circular economy and advancing Australia’s water industry towards greater environmental sustainability. Innovating for Sustainable Water and Environmental Outcomes (sponsored by the Department of Water and Environmental Regulation, and Water Corporation) Moerk Water – Solar-Powered Closed-Loop Sustainable Water Treatment at an Indigenous Australian Vocational School The Wongutha CAPS Solar-Powered Water Treatment System is an innovative solution addressing water scarcity in remote Indigenous communities. This off-grid system provides sustainable clean water while promoting environmental stewardship through renewable energy and circular economy principles, setting a new standard for water management in challenging environments. Student Water Prize (sponsored by GHD) Emanuel Bertizzolo – University of Western Australia Novel Low-Field Nuclear Magnetic Resonance Monitoring of Anaerobic Digestate During Solid-Liquid Separation Emanuel, a Lead R&D Scientist at Tessele Consultants and PhD Candidate at The University of Western Australia, pioneers innovative strategies to enhance the monitoring of solid-liquid separation processes. His research, particularly in flocculation and mechanical separation, employs cutting-edge nuclear magnetic resonance techniques to drive advancements in this critical field. Young Water Professional of the Year (sponsored by Xylem) Andres Mansilla – Discipline Lead, Process Engineering, SMEC Andres is the Chartered Process Engineering Discipline Lead within SMEC's Water Infrastructure team. He is a committee member for both IChemE and AWA. With a wide range of international work experience, he specialises in the technical design and project delivery of water and wastewater treatment infrastructure. Water Professional of the Year (sponsored by KSB) Daniel Visser – Technical Director, Water Treatment & Desalination, GHD A chartered engineer with over 20 years' experience in the water industry, Daniel has collaborated across diverse industry sectors including government, mining, oil and gas, and utilities. Daniel is actively involved in the water sector through technical advisory on industry committees, supporting mentorship programs and advocating for neurodiversity awareness. The Association congratulates all the award finalists and winners and thanks all sponsors – Department of Water and Enviromental Regulation, Water Corporation, Sacyr, Steel Mains, Eurofins, Saltire Infrastructure, Acciona, GHD, Water Research Australia, Xylem and KSB – for their support of this event and these important industry awards. Thank you to our Program Partners Diamond Partners and Innovating for Sustainable Water and Environmental Outcomes Award Partners Platinum Program Partner Gold Partners Student Water Prize Award Partner National R&D Excellence Award Sponsor Celebrating 21 years of partnership National Young Water Professional Award Sponsor WA Water Professional of the Year Sponsor Awards Australian Water Awards Eurofins West Australian Department of Water WA Water Awards Water Corporation Water Research Australia XYLEM KSB Sacyr Steel Mains Saltire Infrastructure Acciona Share RELATED NEWS Celebrating our WA Winners for 2023 Water Source The Australian Water Association's (AWA) Western Australian (WA) Water Award winners have been announced at the WA Water Awards… Read Full Paper WA Water Award winners announced as part of National Water Week Water Source The winners of the Australian Water Association's Western Australian (WA) Water Awards have been announced at the Water Awards… Read Full Paper Celebrating the winners of the ACT Water Awards Alex Morrison The winners of the Australian Water Association’s ACT Water Awards have been announced at the ACT Water Leaders Dinner on 17… Read Full Paper'''
year_published = 2024
