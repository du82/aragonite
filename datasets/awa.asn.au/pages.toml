full_description = '''Home Resources Reconciliation Action Plan Reflect Reconciliation Action Plan At the Heart of all Life The Australian Water Association is proud to have completed our Reflect Reconciliation Action Plan (RAP) and is currently developing our Innovate RAP. This marks an important step as we continue to embed greater awareness of cultural safety and values into all that we do, while sharing our learnings and resources with our members to build trust and foster meaningful relationships with Aboriginal and Torres Strait Islander communities. DOWNLOAD RAP About the artwork and the artist To bring our RAP to life and help tell the story of our reconciliation journey, we engaged Amy Allerton a proud Gumbaynggirr and Bundjalung woman and contemporary Aboriginal artist from Tamworth, NSW. Allerton said her process and artwork is driven by her personal and professional vision that every story is given value and a voice, to revitalise communities, reconnect to culture and restore identities to build a stronger future. hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, 'f391315f-9a8a-4b15-812f-7cf476655f22', {"useNewLoader":"true","region":"na1"});'''
