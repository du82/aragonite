["https://www.awa.asn.au/young-water-professionals"]
title = "Young Water Professionals"
description = "Empowering Australia’s young water professionals and emerging leaders to build water networks, grow their knowledge, and sharpen their leadership skills. Ask the AWA."
full_description = '''Home Membership for me Young Water Professionals YOUNG WATER PROFESSIONALS Build career-long industry connections The Young Water Professionals program empowers Australia’s young water professionals and emerging leaders to build water networks, grow their knowledge, and sharpen their leadership skills as committee members. With a focus on water professionals below the age of 35 or with less than 10 years of water experience, the program supports early career development for people working with water. Mentoring Program One of our most successful programs connecting experienced water professionals with YWPs. The new national program leverages a purpose-built digital platform to ensure seamless mentor-mentee matching, communication, and progress tracking. hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, '4949cff7-a1a5-441e-b313-c49008bdd116', {"useNewLoader":"true","region":"na1"}); National Events YWP events at Ozwater, and their own biennial conference, focus on water innovation, research and government collaboration. hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, '8642adde-8dae-4237-aaf6-f59444109bf9', {"useNewLoader":"true","region":"na1"}); Local Networking Get to know local water peers to exchange ideas, share resources, and be inspired to drive a sustainable water future. hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, 'c72a93a8-3389-4596-8865-26f0c0a94565', {"useNewLoader":"true","region":"na1"}); YWP Branch Subcommittees Connect with the YWP Subcommittee in your local Branch. hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, 'd9c27333-36e4-4af2-bc55-ae627f97c669', {"useNewLoader":"true","region":"na1"}); YWP of the Year This annual award recognises the positive contributions and achievements of emerging water leaders. hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, '06ace983-7395-42f0-b90c-62285355b72a', {"useNewLoader":"true","region":"na1"}); Connect Online Stay up to date by connecting with our social channels dedicated to young water professionals. YWP National Taskforce This special advisory panel of YWP representatives supports the AWA Board to serve YWP members and develop emerging water leaders across Australia. Get In Touch MY WATER STORY Bendora reservoir provides water to my city, of which I now model its level to ensure that we have enough water to supply our population Sabrina Moir, ACT I spent my graduate year at Cronulla WWTP in Sydney. Wastewater is an important part of our future circular economy – so many possibilities! Matthew Schnelle, NSW This photo of me sampling at a Riverland Water Treatment Plant in 2015 captures one of the most pivotal moments in my water career. Florence Choo, SA The irrigation channel in Coleambally represents the life-bringing nature, engineering challenges and opportunities faced in the work that we do. Nick Convery, QLD :root { --swiper-theme-color: #8A8F99; }'''
