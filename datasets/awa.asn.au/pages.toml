["https://www.awa.asn.au/resources/latest-news/2024-victorian-water-award-winners-revealed-at-annual-gala-dinner"]
title = "2024 Victorian Water Award winners revealed at annual Gala Dinner"
description = "The 2024 Victorian Water Awards were celebrated at the Victoria Gala Dinner & Awards on 23 October, with the spotlight on collaborative approaches to creating a sustainable water future."
full_description = '''2024 Victorian Water Award winners revealed at annual Gala Dinner Oct 25, 2024 | 3 mins read by Water Source This year's winners of the Australian Water Association’s (AWA) 2024 Victorian Water Awards were celebrated at the Victoria Gala Dinner & Awards on 23 October, with the spotlight on particularly collaborative and innovative approaches to creating a sustainable water future. The Victorian Water Awards honour members whose leadership, innovative research and projects significantly advance the water sector. AWA Chief Executive Corinne Cheeseman commended the finalists and winners for their remarkable contributions to the sector. "This year’s Victorian Water Awards winners exemplify what can be achieved when passion meets purpose,” she said. “These projects demonstrate true organisational excellence and innovation, with each achievement highlighting the critical role of smart technology, sustainable practices and community engagement in shaping our sustainable water future. “I am inspired to see such a wide range of efforts, from cooling urban environments with green infrastructure to advancing inclusive leadership in water. These innovators remind us of the power of collaboration and creativity in making meaningful change." This year’s Victorian Water Award winners will go on to represent the state in the national Australian Water Awards, with winners presented at the AWA’s annual water conference and exhibition, Ozwater’25, in Adelaide. WINNERS Organisational Excellence Award (sponsored by Fulton Hogan) Wadawurrung Traditional Owners Aboriginal Corporation, Barwon Water and SMEC – Managing Porronggitj Karrong, Place of the Brolga Wadawurrung is walking alongside Barwon Water and project partner SMEC to transform the 66 hectares of land into a new living Cultural landscape and community precinct, to create a balanced ecological system incorporating Wadawurrung values for the whole community to connect, listen and learn from Country. R&D Excellence (sponsored by Water Research Australia) South East Water, University of Melbourne and Water Sensitive Cities Australia – Demonstrating the Cooling Benefits of Irrigating Green Space and Misting at Aquarevo House and Burnley This project shows how we need to shift our thinking towards smart irrigation that optimises soil moisture by irrigating at the right time and place to deliver up to 1C cooling benefit in the urban environment. Infrastructure Project Innovation Award (REGIONAL) (sponsored by John Holland) Grampians Wimmera Mallee Water – GWMWater's First Fully Off-Grid Facility, The Elmhurst Water Treatment Plant GWMWater has successfully upgraded Elmhurst’s water supply to meet drinking water standards by implementing a new off-grid water treatment plant. The stand-alone power system addressed concerns regarding native vegetation disturbance, avoids the need to access customers’ land, and ensures a more reliable supply without increasing costs for customers. Infrastructure Project Innovation Award (METRO) (sponsored by John Holland) John Holland Group and Melbourne Water – Hobsons Bay Main Sewer Duplication Project Innovation and creativity are at the heart of the Hobsons Bay Main Sewer Project delivering outstanding results in the areas of sustainability, social value and community. Setting new benchmarks for best practice in the water industry, the project will be the first independently verified net-zero carbon infrastructure project in Australia. Student Water Prize (sponsored by Eurofins) Nilufa Sultana – RMIT University Development of a Novel Grease Interceptor to Remove Fat, Oil and Grease from the Wastewater Generated From Food Service Establishments Passionate about protecting our planet’s most precious resource, Nilufa is at the forefront of designing an innovative grease interceptor, developing a cutting-edge technology in the field of wastewater treatment research that reduces fat, oil and grease loading in sewer networks, ensuring a sustainable solution for increasing sewer integrity. Young Water Professional of the Year (sponsored by Xylem) Dr. Flora Markis – Senior Process Engineer, Arup Dr. Flora Markis is a leader in the water industry known for advancing sustainable infrastructure solutions. With expertise in research, strategic planning and project management, she has driven innovations in water resilience, circular economy and drought adaptation. Flora is also a passionate advocate for minority groups and women in water. Water Professional of the Year (sponsored by KSB) Celeste Morgan – Australasia Integrated Water Management Lead, Arup With over 20 years of experience in integrated water management, Celeste is known for her ability to drive interdisciplinary solutions at a city-scale. As a leader in the water industry, she champions ambitious policy, innovation and cross-industry collaboration while advocating for underrepresented groups, including emerging professionals and women in engineering. The Association congratulates all the award finalists and winners and thanks our sponsors – GHD, Greater Western Water, South East Water, Melbourne Water, Yarra Valley Water, Arup, John Holland, Water Research Australia, Fulton Hogan, Eurofins, Xylem and KSB – for their support of this event and these important industry awards. Thank you to our Sponsors Principal Sponsor Principal Partners Major Sponsor VIC Water Professional of the Year Award Sponsor VIC Student Water Prize Sponsor National R&D Excellence Award Sponsor National Young Water Professional of the Year Award Sponsor Organisational Excellence Award Sponsor Infrastructure Project Innovation Award (Metro and Regional) Sponsor Innovation Awards Greater Western Water Australian Water Awards Eurofins South East Water Arup John Holland Yarra Valley Water Fulton Hogan GHD Water Research Australia XYLEM Melbourne Water VIC Water Awards KSB Share RELATED NEWS AWA Victorian Water Awards winners celebrated Alex Morrison The Australian Water Association's Victorian (VIC) Water Awards winners have been announced at the VIC Gala Dinner and Awards Night… Read Full Paper VIC Gala Night & Awards Sophie Barton The Victorian water sector gathered in numbers to spotlight its highest achievers at the AWA VIC Gala Dinner and Awards Night on… Read Full Paper 2021 Victorian Water Awards Madeleine Greenlee What a surreal feeling it is to be back in-person in Melbourne. Nobody quite knows whether to bump elbows, shake hands, or go in… Read Full Paper'''
