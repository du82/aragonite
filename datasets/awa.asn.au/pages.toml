["https://www.awa.asn.au/upcoming-events/industrial-webinar"]
title = "AWA and Isle Utilities - Industrial Technology Webinar"
description = "Join us for a webinar to discuss innovative solutions to building more resilient cities and systems across many social-technical contexts - from cities in advanced economies to developing cities, from large cities to small island states. ."
full_description = '''AWA and Isle Utilities - Industrial Technology Webinar 11 Mar, 2025 - 11 Mar, 2025 | 1:00pm – 2.30pm AEDT | Online via Zoom Join us as we explore the intersection of industry and utilities, unlocking water intelligence, and co-designing a collaborative program. This workshop will leverage the water intelligence of a network of water utilities, industry and technology providers. Build business capabilty to be resilient to water scarcity, understand water quality and the benefits to be gained in the water-energy nexus. We have 2 objectives: 1. Access 3 novel technologies forging the way in addressing these opportunities. 2. Co-design a new collaborative forum to share knowledge, test and respond rapidly to this rapidly evolving challenge. Understand the context of water scarcity and water quality challenges and corresponding impacts on the industrial sectors. Explore the water-energy nexus and the opportunities to save on energy costs, build business resilience and optimise your processes for greater efficiencies. hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, '0b8f8c8a-4615-4591-9551-1188cc095e28', {"useNewLoader":"true","region":"na1"}); Workshop Agenda 1pm Welcome, acknowledgment of country and workshop overview 1:05pm What's the challenge and how collaboration can help 1:15pm Technology Presentation 1 1:25pm Technology Presentation 2 1:35pm Technology Presentation 3 1:45pm Context for co-design 1:55pm Breakout room co-design 2:05pm Feedback and next instruction 2:15pm Breakout room discussion 2:25pm Feedback 2:30pm Next steps and close Event Details Date Tuesday, 11 March 2025 Time 1pm - 2.30pm AEDT Venue Webinar - Online Registration This webinar is free. Please register to receive the zoom link. Nicola Nelson - Head of International and Industry Programs email: nnelson@awa.asn.au Webinar International NSW ACT VIC SA QLD NT WA TAS Share Terms & Conditions By registering for an Australian Water Association (AWA) Event, you agree to accept the following Terms and Conditions. Click here to view AWA’s privacy policy.'''
