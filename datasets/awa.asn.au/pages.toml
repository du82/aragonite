["https://www.awa.asn.au/events/ozwater"]
title = "Ozwater Conference & Exhibition"
description = "Register for Australia’s premier water conference, Ozwater, and exhibit at the largest water exhibition in the Southern Hemisphere. Ask AWA."
full_description = '''Home Events Ozwater OZWATER Australia’s premier water conference and exhibition Connect with water peers, upskill your organisation, and grow your water career with Ozwater. hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, 'c53120ab-02b7-44ab-acac-49f9e4f14272', {"useNewLoader":"true","region":"na1"}); A Proud History Formerly known as the Federal Convention held for the first time in 1964, Ozwater has grown to be Australia’s premier water conference. The program of speakers, papers, and workshops is developed by and for people working with water to support water excellence, networking opportunities and international engagement. The annual three-day, multi-stream conference is complemented by 200+ exhibitors making up the largest water exhibition in the Southern Hemisphere. Ozwater'25 Adelaide Convention Centre Tuesday, 20 May – Thursday, 22 May 2025 The 2025 theme, "Looking back, moving forward," invites us to reflect on the past while embracing a future where water is central to sustainable growth. At Ozwater'25, we will harness the invaluable historical and contemporary knowledge of our diverse and passionate communities to guide our progress in the water sector. Our focus will be on valuing water—from sustainable resources to resilient services that nurture healthy, thriving communities. Exhibit at Ozwater Showcase your water products, technologies and services at the largest trade exhibition for water in the Southern Hemisphere. Exhibit at Ozwater Sponsorship Opportunities Support Ozwater and connect your business with Australia’s largest water professional network and build your brand. Support Ozwater How to register Registrations will open soon. Ozwater Dates Ozwater’24Melbourne Convention and Exhibition CentreTuesday 30 April – Thursday 2 May 2024 ___________________________ Future Ozwater Locations Ozwater’25 – Adelaide Convention Centre Conference: Tuesday, 20 May – Thursday, 22 May 2025 Gala Dinner: Wednesday, 21 May 2025 Ozwater’26 – Brisbane Convention and Exhibition Centre Conference: Tuesday, 26 May – Thursday, 28 May 2026 Gala Dinner: Wednesday, 27 May 2026 Ozwater’27 – International Convention Centre, Sydney Conference: Tuesday, 4 May – Thursday 6 May 2027 Gala Dinner: Wednesday, 5 May 2027 Find out more TESTIMONIALS Julian Briggs Design Director Water and Wastewater Treatment , Aurecon THE Australian event where professionals from all areas of water come together to take our industry forward. If you want to be part of the journey or just connect, make it a priority! Catherine Cleary Manager, Corporate Engagement , Sydney Water The team from AWA seamlessly hosted a hybrid event that broadened accessibility to a diverse audience and enabled attendees to network, learn about innovative technologies and approaches being adopted in other jurisdictions, and offered valuable professional development opportunities for our people. The breadth of the program, in particular, enabled participation, inspiration and engagement on topics that are critical to not just the water industry, but to broader environmental, city shaping and customer focused outcomes. Eric Vanweydeveld Director, AQUANEX Consulting The workshops were relevant and very helpful. I especially liked the selection of keynote speakers. The speakers did really challenge our thinking and they made us realise, through their research and stories, the critical role of our industry will have in the future. I notice every year the Australian Water Association is lifting the bar in terms of quality, relevance and value. I am looking forward to attending next year’s conference. Steve Simmons Director, Detection Services We have exhibited at Ozwater for close to 20 consecutive years, we have received nothing but professional and reliable support and service from the team. The events are always well prepared and professionally managed, a real credit to the events team, we will continue to exhibit into the future and highly recommend the event to others. :root { --swiper-theme-color: #8A8F99; } FREQUENTLY ASKED QUESTIONS How can I get involved? There are a number of ways to be part of Ozwater: Share your insights, projects and learnings by submitting an abstract – more details on abstract, technical paper, case study or video pitch can be found on the Call for Papers page of the website. Each year the Call for Papers opens in August and closes in September. Submit an Expression of Interest for a Workshop or Panel. Each year the EOI opens in August and closed in September. Become a reviewer. Are you an AWA member with experience and knowledge of any of the conference themes? We would love to hear from you! Volunteering at the event, contact ozwater@awa.asn.au for further information. How can my organisation get involved? Are you looking to connect your business with Australia's largest water professional network? Or broaden your reach and build your brand across digital channels and face-to-face experiences? There is a diverse range of sponsorship opportunities available, or we can tailor a package to suit your organisation’s needs. Participate in the largest trade exhibition for water in the Southern Hemisphere. Exhibition opportunities are now available. Apply to host a pre or post-event site tour. What are the benefits of attending Ozwater? Connect with peers from across the industry in the multiple networking opportunities. Build new relationships with peers and suppliers that can be taken back to your organisation. Hear from inspiring industry leaders and gain new knowledge that will help you become more efficient and effective in your job. Learn about new products/services in the industry at the trade exhibition that can be taken back to your organisation.'''
