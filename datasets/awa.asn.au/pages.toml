full_description = '''Announcing the 2024 National Water Awards Finalists Mar 4, 2024 | 3 mins read by Water Source Congratulations to the 2024 Australian Water Awards Finalists! Winners will be announced at the Ozwater’24 Gala Dinner this May. Laura Steffan, (Award Secretariat at the Australian Water Association) says: “The Australian Water Awards recognise outstanding achievements of organisations, individuals and students. They are an opportunity for the water community to showcase innovation, leadership and the way we are addressing the challenges of driving a sustainable water future. Each year, the nominations we receive remind us of the very high calibre of people we have in the water community and the critical and inspirational work they do." "That was definitely the case again this year, with so many high quality nominations received. The judges had a very difficult task in choosing the finalists and winners in each state and territory for each category. I’d like to thank our judges for their efforts and the time they give to consider all of the nominations. I look forward to celebrating this year’s achievements at the Australian Water Awards coming up at Ozwater’24.” ANZ is proud to sponsor the Australian Water Awards, which celebrates significant community contribution and exceptional performance of all the finalists. These are ambitions ANZ share, admire and are proud to be associated with. ORGANISATIONAL EXCELLENCE AWARD Sponsored by: eMission Possible Plan Icon Water and Aurecon (ACT)Video Urban Plunge Sydney Water (NSW) Territory Water Plan Office of Water Security, The Department of Environment, Parks and Water Security, Power and Water Corporation with Contributing Government Agencies (NT)Video Planning Our Journey to Excellence and Empowered People Urban Utilities, Stantec, KBR and AJile (Aurecon and Jacobs) (QLD)Video Women in Trades Fulton Hogan (SA)Video TasWater Asset Painting Program - Connecting Communities Through Art TasWater (TAS)Video Env