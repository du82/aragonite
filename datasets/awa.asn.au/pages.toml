title = "Chris Davis AM Fellowship | Awards | AWA"
description = "Showcase organisational water expertise, innovation and excellence at Australia’s leading state and national water awards. Ask AWA."
full_description = "Home Awards Chris Davis AM Fellowship Overview The Chris Davis AM Fellowship is to be awarded to an individual that is leading a project, initiative or research activity that will contribute to sustainable water management in Australia. AWA is very keen to support individuals that embody what Chris Davis AM valued and championed in making an impact. The AWA wants to create leaders through the Fellowship.The Fellowship criteria for eligibility will be based on the values of Chris Davis AM and his ability to share knowledge and leave a legacy of success. The individual will be an aspiring leader who is passionate, professional, visionary, and leading a project, initiative or activity that has the potential to transform sustainable water management in Australia.The recipients will be awarded during National Water Week. Eligibility Must be a current and financial AWA Member Open to an individual or an individual leading a team project. The nominee’s project must be addressing a key issue in sustainable water management in Australia. The nominee must have a letter of support from their employer. Conditions of Entry Click here for more info Judging Criteria Click here for more info Closing Date 2024 submissions are closed. Please contact your Member Engagement Manager for further information."
