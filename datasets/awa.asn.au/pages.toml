full_description = '''Where water professionals connect Network with peers and employers Access water insights JOIN OUR COMMUNITY Lead a sustainable water future Partner with your peers Recruit the best water professionals EXPLORE THE CORPORATE MEMBER OPTIONS AUSTRALIA’S BIGGEST WATER NETWORK Water is our greatest resource hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, 'fccb08fb-1d15-4e4e-9e88-40da4903a7a8', {"useNewLoader":"true","region":"na1"}); Ozwater'25 Join us in Adelaide – 20-22 May hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, 'b6d34814-750c-46b2-b990-47c497ac4c77', {"useNewLoader":"true","region":"na1"}); Week in water Updates from across the water community hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, 'ef5969d0-e9e7-472a-995d-7a9db5b4efbd', {"useNewLoader":"true","region":"na1"}); Membership Join Australia's largest water network hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, 'f73449e9-0ccb-46a4-b3d4-3b1e80e020d0', {"useNewLoader":"true","region":"na1"}); Discover our resources section Your one-stop shop for the latest from Water Source, Water e-Journal, Podcasts and the latest jobs in the water sector. hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, '16bf319b-c9a0-4e25-b91c-f0ccfd98d015', {"useNewLoader":"true","region":"na1"}); :root { --swiper-theme-color: #8A8F99; } The home of water professionals We share knowledge, connect people with purpose, and inspire positive change. Our members are connected by water. They have diverse careers across disciplines including scientists, engineers, urban designers and planners, treatment plant operators, consultants, academics, researchers, educators, communications, community consultation, policy makers, regulators, people and culture advisors, managers, data analysts, data scientists, information technology, business development, strategists, asset managers, water and catchment managers, field workers, manufacturers, trades and more. FIND OUT MORE GET INVOLVED Awards Be recognised at state and national levels for inspiring projects driving a sustainable water future. Open to members and students for individual or organisation achievement. International Partnerships Our international program connects water professionals through aid and trade, shares Australian expertise and technology, and inspires a sustainable water future. Specialist Networks Members share water management knowledge and expertise across 11 Specialist Networks including Asset Management and Desalination. National Water Week Every October, National Water Week makes a splash across Australia, inspiring individuals, communities and organisations to value water. WHY JOIN INDIVIDUAL ORGANISATION Where water professionals connect Network with peers and employers Access water insights JOIN OUR COMMUNITY Lead a sustainable water future Partner with your peers Recruit the best water professionals EXPLORE THE CORPORATE MEMBER OPTIONS EVENTS & NETWORKING Monday, 17 Mar 2025 National Biosolids Conference 2025 The biennial Australian & New Zealand Biosolids Partnership's National Biosolids Conference is returning to Hobart in 2025, with the theme Biosolids: Future Possibilities. … Read more Thursday, 6 Mar 2025 International Women's Day Webinar 2025 - March Forward: Empowerment, safety and equity in the water sector Join us Thursday 6 March to celebrate International Women's Day 2025. … Read more Tuesday, 11 Mar 2025 AWA and Isle Utilities - Industrial Technology Webinar Join us as we explore the intersection of industry and utilities, unlocking … Read more Wednesday, 12 Mar 2025 WA Regional Tour 2025 Join us for our next WA Regional Tour as we visit sites in and around … Read more Friday, 14 Mar 2025 NSW Heads of Water Forum, Gala Dinner & Awards 2025 Join us for the 2025 NSW Heads of Water Forum, Gala Dinner and Awards in Sydney … Read more PRINCIPAL MEMBERS :root { --swiper-theme-color: #8A8F99; } WHAT OUR MEMBERS SAY ABOUT US Adam Jones Principal Engineer The AWA is the main industry association that I engage with. In my experience they have consistently facilitated an active and relevant dialogue on water efficiency in a way that no other industry association has. Also the diversity of membership seems to span all spheres of the water industry - I think a 'broad church' like this is the best place to thrash out our key water management ideas and issues. Tasneem Kanpurwala Water Regulation Officer AWA is a one stop shop for all water services. This includes national conferences to small networking events and webinars. Great exposure to the water world in Australia and beyond. Professor Jeff Camkin Adj. Professor (Water Resource Management) The AWA is the best forum for anyone in Australia wishing to connect with water issues as professionals or just people with an interest in water. It is the best way to meet other people interested in water issues in Australia and to support personal and professional growth in the water space. :root { --swiper-theme-color: #8A8F99; } UPDATES TO YOUR INBOX Looking for the latest water news, insights, and events? Keen to get a better understanding of what the AWA community is? Just enter your email below to sign up.'''
