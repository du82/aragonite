["https://www.awa.asn.au/awards-tas"]
title = "TAS Water Awards | Australia’s water professional network | AWA"
description = "Celebrate water excellence and innovation with the TAS Water Awards from Australia’s largest water practitioners and professionals network."
full_description = "TAS WATER AWARDS Recognising Australian water innovation and excellence Our state and national water awards program recognises outstanding achievements of individuals, organisations and students. The awards showcase innovation, leadership, infrastructure and inspiring positive change to drive a sustainable water future. TAS Honour Roll Previous TAS Winners Water Professional of the Year Award2024 Sarah Jones, Manager, -Water, Pinion Advisory2023 Anthony Allan, Operational Improvement Lead, TasWater2022 Tim Gardner – Chairman, Stornoway2021 Kathryn Pugh, Team Leader Water, City of Launceston2020 Stephen Westgate, Senior Water Quality Scientist, TasWater2019 Chris Thompson, Principal Consultant, Macquarie FranklinYoung Water Professional of the Year Award (Gary Ingram Memorial Award)2024 Josh Clark2023 Isaac Probert2022 Akira Weller-Wong2021 Ryan Francis2020 Adela Parnell2019 Cassandre Tickner-Smith2018 Matthew Robertson2017 Rebecca Sayles Student Water Prize2024 Kurt Debruille, University of Tasmania - Portable IC with Dual LED-Based Detectors and 3D-Printed Post-Column Heated Micro-Reactor for the Simultaneous Determination of Ammonium, Nitrite, and Nitrate. Infrastructure Project Innovation Award (Regional)2024 Bryn Estyn Water Treatment Plant (WTP) upgrade - TasWater and Jacobs2023 Recycled Water Land Suitability Assessment Tool – Supporting Sewer Master Planning Across Tasmania with Automated Geospatial Analysis - The TasWater Alliance (TasWater, CPB Contractors Limited, UGL and WSP)2022 TasWater, WSP and ADS Environmental Services2021 Sewage Intrusion Program, NRM North and Partners2020 Trevallyn Downstream Bypass, Hydro Tasmania2019 24 Glasses, TasWater TAS Award Categories Individual Awards Water Professional of the Year Young Water Professional of the Year Organisational Awards Infrastructure Project Innovation (Regional) Organisational Excellence Important DatesNominations close: 27 September 2024Winners announced: 21 November 2024 Resources Winners announced at the 2023 TAS Galah Dinner & Awards Sponsors Young Water Professional of the Year Award Sponsor Infrastructure Project Innovation (Regional) Awards for organisations Open to AWA member organisations, nominate your projects for infrastructure innovation, organisational excellence, research, safety, and customer experience. Find out more Awards for individuals Open to AWA members and corporate member employees, have your commitment recognised as Water Professional of the Year or Young Water Professional of the Year. Be recognised Awards for students Students can enter the Student Water Prize showcasing excellence in water studies and research, and the prestigious Australian Stockholm Junior Water Prize for high school students. Grow your profile Conditions of Entry FREQUENTLY ASKED QUESTIONS What is the difference between State and National awards? To compete in the Australian Water Awards, entries will first be judged at the appropriate State Awards, with winners automatically entered as a finalist for the National awards (aside from our two National Award only categories).In addition to the 10 national award categories, each state runs independently other award categories. These programs, like the national, recognise and reward individuals and organisations for innovation, commitment and leadership in the Australian water sector. Who is eligible to enter? All Awards, aside from the Student Water Prize and Australian Stockholm Junior Water Prize, are open to AWA members only. The Innovating for Sustainable Water and Environmental Outcomes Award (WA only) is also open to non members, however the lead organisation must be a not-for-profit, local government body, non-government organisation, school or small business. For organisational awards, the lead organisation/s must be a current Corporate Member. Any partner organisations listed in the submission must also be a current Corporate Member to receive recognition if announced as a finalist and/or winner. This recognition includes the organisation/s being listed as a finalist on award collateral (online and print), on email communications announcing the finalists and/or winners, on any certificates and/or trophies, on the awards visual presentation (if applicable) and on media release statements.If the partner organisation/s listed in the submission are not current Corporate AWA Members, they will not receive the recognition as listed above.For individual awards, the nominee must be a current individual AWA Member or an employee of a current Corporate Member.To enter, nominations must be submitted using the online entry forms. Please note when your relevant State or Territory award submissions close. How much does it cost? There is no entry fee associated with the AWA Awards program. Can I nominate the same individual or project/program for more than one award category or in more than one state or territory? Duplicate nominations are not permitted in the awards program. This means that you cannot nominate the same individual or project/activity for more than one award category or more than one state or territory in the same year. You can enter more than one award in the same year, as long as it is not with the same project/activity. When do entries close? The submission close dates are specific to the state or territory award being entered. Please click your relevant state/territory button on this page to view the closing dates. How do you submit a nomination? All nominations must be submitted via the online nomination form. Please check the relevant award category page to view the requirements to complete the nomination form. How are the applications assessed? State judging is coordinated by the relevant Member Engagement Manager and committee. Each state convenes a panel of experts to assess the applications.National judging is coordinated by the National Awards Manager. The panels of experts are approved by the Honours & Awards Sub-committee of the Board to take part in the judging. Each panel includes at least three judges and is chaired by an AWA Board Director.At both state and national levels, judges score each nominee based on how well they address the award criteria. The panel then meets to review the scoring and discuss the merits of all submissions. Final scoring and ranking is based on a majority vote from all eligible members of the judging panel.All judges adhere to a code of conduct which includes a policy to prevent conflicts of interest. The judges’ decision is final and no discussion about the merits of entries will be entered into with nominees. How are the Awards presented? Award finalists and winners of the State Awards will be announced at their relevant state or territory event. Winners of the 2023 Australian Water Awards are presented at the Ozwater Gala Dinner, to be held in Sydney in May 2023."
year_published = 2025
clearnet = "https://www.awa.asn.au/awards-tas"
