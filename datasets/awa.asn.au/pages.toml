["https://www.awa.asn.au/about-us/our-history"]
title = "Our History"
description = "A history of the AWA through the decades."
full_description = '''Home About Us Our History OUR HISTORY The role of the Australian Water Association has been to support the water industry in Australia as it faces the challenges of managing our water environment. At AWA's inception in 1962, post-war installation of water and sanitation was high on the agenda.Today's challenges include the need to address the current professional skills shortage, uncertainty arising from the impacts of climate change, stressed water resources on a national scale, and water reuse and recycling. hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, 'cb45e776-7a3f-407f-b9f6-af077c2a877c', {"useNewLoader":"true","region":"na1"}); hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, '593d06d2-cfc4-48ae-9098-25b3f0593c65', {"useNewLoader":"true","region":"na1"}); The Australian Water Association has been operating for over five decades. The following section provides a short summary, for each reporting (financial) year, listing key milestones in the growth and development of the organisation. 2010s 2019 After more than 11 years in the same premises our head office in St Leonards was refitted with new open plan workspaces, upgraded meeting rooms, video conferencing facilities, and a more contemporary look. To lift productivity and enhance our member services, the Association undertook upgrades during the year to our finance system, our event registration system, and our intranet platform. Reflecting both industry and community trends, our members and stakeholders are increasingly turning to our digital platforms and publications as their preferred way to share, connect, and inspire. Current magazine, available in both digital and print form, continues to be well received by members. The year saw the Association’s Water Utility Improvement Program expanded to rural areas of Vietnam and extended into Cambodia and Indonesia. Ozwater’19, which was held in Melbourne, exceeded expectations and ended up being the most successful in the history of the event. The Association’s next three-year strategic plan, Strategy’22, was launched at Ozwater’19 by President Carmel Krogh OAM. Developed by and for our members, the plans sets out to inspire and drive a sustainable water future. 2018The Association exceeded its membership growth and retention targets with total membership growing by over 300 to 5,493. We’ve been able to provide water professionals across the country with over 100 opportunities to meet each other and grow their professional networks. These have included conferences, technical seminars, forums and, in a move to become truly digital, webinars. Ozwater'18 in Brisbane achieved some record breaking results with 4,275 conference attendees. Our Young Water Professionals (YWPs) were further recognised by the establishment of a new National YWP Taskforce that has been charged with the task of building a strong national program for our younger members. In November, we launched our online information hub, Water Source as part of our digital strategy. Articles, technical papers and Current magazine feature stories are published under four key categories: Technology, Community, Environment and Business. We also increased the amount of digital content on our YouTube and podcast channels as videos and podcasts remain a popular source of water information for our members and the wider community. 2017This year the Australian Water Association, in collaboration with the Australian Water Partnership and sponsor ANZ Bank, introduced a new program focused on increasing equality and diversity in the water sector. The Channeling Change program was officially launched at Ozwater’17 in Sydney by Association President-Elect Francois Gouws, and members of the water industry shared their stories of struggle and success in this space. We also launched our own video interview series. It started off small and has grown to incorporate interviews with professionals who are channeling change in their workplace and speakers from our many events. We also launched our very own podcast series where we interview local, national and global water professionals on breaking research, innovative projects, and smart practices. The Australia-Vietnam relationship reached a new high with AWA facilitating the largest Australian delegation to ever visit Vietnam as part of Vietwater’17. The Association's National Water Awards received more nominations than ever before with a 54% increase in the number of award nominations totalling 179. Adjustments were made to the specialist networks in December 2017. As a result, there are 14 Specialist Networks with 121 committee members providing relevant content and information to members through our existing newsletters and social media channels. 2016In 2016 the Association continued to implement its revised business strategy to drive Australia's prosperity with water information, expertise and collaboration. In February, a new members' magazine called "Current" was launched, receiving overwhelming positive feedback from members and stakeholders for its relevant content and presentation. A new online "Water e-Journal" was also launched, providing technical content to a wider reading audience. In May, the Association delivered an outstanding Ozwater'16 event in Melbourne which exceeded expectations in both delegate attendance and exhibition revenue. 2015In 2015, the Association continued to develop alliances with similar organisations overseas. This resulted in several inbound and outbound trade delegations to promote Australia's products and expertise internationally - specifically Vietnam (including the Association’s first delegation to Vietwater’15), Thailand, India and the United States. The Association also improved its water awards program on both national and state levels. This culminated in a great showcase of winners at the Ozwater'15 Gala Dinner in Adelaide. During Ozwater, Peter Moore stepped up as President replacing Graham Dooley. At the end of the year a new website and CRM system went live to ensure increased engagement of members. 2014In 2014, a new business plan was introduced which focused on three "pillars of value". These were relevant information on water, professional development, and networking and collaboration. To help members develop new business in domestic and overseas markets, as well as promote new water innovations, a new Industry Development Team was established. The Association continued its long tradition of providing relevant conferences and exhibitions including the introduction of a new key event, the National Water Policy Summit. Australia’s biggest water conference and exhibition, Ozwater’14, held in Brisbane, was another success. All the highlights can be viewed here. 2013The Association saw a change in both the Chief Executive and President roles in 2013. Jonathan McKeown replaced Tom Mollenkopf as Chief Executive, and Graham Dooley replaced Lucia Cade as President. Under the 2012 – 2015 Strategic Plan, some of the key initiatives and activities actively pursued by AWA included investment in professional development and vocational education and completion of the Water Industry Capacity Development University Project. AWA organised and produced a large number of successful events throughout the financial year and Ozwater continued to be Australia’s must-attend water conference and exhibition, although there was an anticipated reduction in delegates attending due to the conference being held in Perth. There was also a slight contraction in membership numbers for the year, with a -2% growth rate. 20122012 marked AWA’s 50th Anniversary, and over the 12 months the Association continued to grow its membership and reach. Membership increased for the 6th consecutive year with over 5,700 members. Communication continued to be one of AWA’s strongest assets as information was shared through both print and digital platforms. 2012 saw over 20 media releases and 8 issues of Water Journal produced – each one receiving an average of 15,000 readers. There was a 15% increase in readership of E-news and our social media outlets also grew. Ozwater’12 was another success! Held in Sydney with over 6,000 participants, 31 countries represented, 252 speakers and 212 exhibitors. A new Strategic Plan for 2012 – 2015 was released outlining the priorities for the next three years. 2011In 2011, AWA increased its role in the policy and advocacy space in response to member feedback. Through industry submissions, the Association raised the profile of the sector to state, territory and federal governments, as well as the media and general public. The H2Oz jobs website expanded its reach in January 2011 when it opened its recruitment advertising space to the public, resulting in a 135% increase in site visits. May 2011 saw the 25th national Ozwater conference and exhibition held in Adelaide, attracting 3000+ participants and 183 exhibitors, and generating over 1.2 million website hits. 2011 also saw the number of subscribers to Water e-news reach 6,700 and estimated readership of the Water Journal exceeded 15,000. In addition, net membership increased for the fifth consecutive year. 2010Lucia Cade was named President-Elect of AWA. The new AWA website was launched and the implementation of AWA's new financial system and upgrade to the CRM system was completed. The Water Quality Monitoring and Analysis Specialist Network held its first event and the Water Industry Capacity Development Industry Program presented its first workshop. A review of Biosolids Guidelines in Australia and New Zealand was completed. TasWater'10 attracted record numbers. The first national conference by the Source Management Specialist Network was delivered. 2000s 2009A new strategic plan for 2009-2012 was developed during the reporting year. AWA made a number of submissions to government enquiries. The Sustainability Specialist Network was created and a series of workshops in Sustainability Implementation took place. The Australasian Biosolids Partnership gave way to the Australian and New Zealand Biosolids Partnership. The Community of Practice for Environmental Water managers industry program was developed. WaterAUSTRALIA was established. AWA hosted and chaired the Water Industry Skills Taskforce. The H2Oz careers in water website was launched at National Water Week. Ozwater'09 set a new record for delegate participation and trade exhibition. AWA's first training course online was delivered. An enhanced awards program was presented including the AWA YWP Award and the administration of the 2010 Prime Minister's Water Wise Award. Key system upgrades were developed and the IT capability expanded.2008Rebranding took place introducing the new AWA logo and visual identity. Two new Specialist Networks were introduced. Published the production of branch and volunteer guidelines. AWA became a regional affiliate for the International Desalination Association. Enviro'08 conference extended into energy and sustainable cities. A decision was undertaken to hold Ozwater annually. Review of the National Awards Program. Introduction of a new course: Australian Water Industry Essentials. AWA Membership grew by 10%. The Community of Experts was created. Most AWA Branches saw growth in member activity. Ongoing development of web and online functionality. 2007This year was one of change and renewal for the AWA, starting with the appointment of the new CEO, Tom Mollenkopf. A strategic plan for the years 2007-2011 was developed. An in-house Events team took over the management of all key conferences. Ozwater achieved record delegate registrations. Development of Platinum Packages to customise membership and services for corporate members took place. Reform of the governance structure continued with the election of the second skills based Board and the centralisation of financial and accounting functions. The improvement of the website in terms of speed, looks and functionality, continued. 2006First broad stakeholder strategic planning session held. PT Policy Officer appointed. Marketing and Communications position expanded following secondment of Clare Porter to Melbourne Water for 2 years. Given national focus on water issues brought on by continuing drought, awareness and profile of AWA reached all time high. Branch and remote staff provided online access and integration with AWA HO systems. Early phases of further web site improvement. 2005IWA Australia Committee became a Branch of AWA. Fundamental governance reform including a major reworking of financial management, with rigorous cost allocations introduced for the first time, global, integrated budgeting. Reform establishes nine member Board elected by Strategic Advisory Council who represent members through branch structures. Succession Planning Committee established to assist with securing nomination of suitable persons as director and for senior staff appointments. Ozwater Convention and Exhibition in Brisbane, Chaired by Steve Posselt set new standards and benchmarks. Increase in awareness about AWA nationally. 2004Establishment of the WaterAid charity. The Water Education Network (WEN) established under management of Corinne Cheeseman. Plans for governance reform rolled out through a series of branch consultative meetings. Enviro 04 in Melbourne. Rod Lehmann from Brisbane takes over as President. Began implementation of new membership database and management system, coupled with a revamp of web site.2003New management and reporting systems implemented to facilitate better performance in all facets of operation with annual business plan tied to budget portfolios. Michael Seller employed to specifically target membership recruitment and retention. Lee Devereaux employed as specific national events manager. Active across a broader spectrum of activities, including awards for students; community education and development aid. Creation of the Australia Water Partnership as a policy forum and a link with the Global Water Partnership. Ozwater Convention in Perth was well done and delivered a good margin. Audit and Governance Review Committee established to monitor probity and compliance. The Water Treatment Alliance began operation, in a joint venture with the Water Services Association. 2002The second Enviro Conference was held in Melbourne, in conjunction with the exhibition, now renamed the Enviro exhibition for operation with the Enviro series of events. The We All Use Water suite of water information was published after several years of work by Jenifer Simpson and a team in Queensland. Publication of the Crosscurrent newsletter as a separate title ceased and the content was included in the journal, "Water". The first TECHNOtour went over to Sweden, Germany and the Netherlands, to see integrated water management concepts. The first of the new Water Industry Master Class series were held, in Sydney and Melbourne. Students from Newton Moore High School in Bunbury, WA, won the Australian Junior'''
year_published = 2025
clearnet = "https://www.awa.asn.au/about-us/our-history"
