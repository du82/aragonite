description = "Celebrate water excellence and innovation with the Queensland awards from Australia’s largest water practitioners and professionals network."
full_description = "QUEENSLAND AWARDS Recognising Australian water innovation and excellence Our state and national water awards program recognises outstanding achievements of individuals, organisations and students. The awards showcase innovation, leadership, infrastructure and inspiring positive change to drive a sustainable water future. QLD Honour Roll Previous QLD Winners Water Professional of the Year Award2024 Cameron Jackson, Water Utilities2023 Anthony Domanti, WSP 2022 Emma O'Neill, Aurecon2021 Abel Immaraj, Aurecon2020 Professor Zhiguo Yuan AM, The University of Queensland2019 Daryl Ross, Logan City Council2018 Richard Savage, GHD2017 Colin Hester, Queensland Urban Utilities2016 Aneurin Hughes, CardnoYoung Water Professional of the Year Award2024 Lindsay Stafford, Team Lead and Senior Civil Engineer , AECOM2023 Amber Craig, Senior Project Officer / Hydro-Climate Analyst, Murray-Darling Basin Authority 2022 Johanna Johnson, Logan Water2021 Samuel Koci, Arup2020 Dr Lachlan Guthrie, International WaterCentre2019 Aidan Symons, SMEC2018 William Speirs, Unitywater2017 Dr Katrin Doederer, The University of Queensland2016 Alycia Moore, CleanawayStudent Water Prize2024 Sophie Barrett, The University of Queensland The effects of urban densification and climate change on residential urban water balance in sub-tropical climate 2023 Zhetai Hu, Australian Centre for Water and Environmental Biotechnology, The University of Queensland Novel Usages of Iron Salts for Achieving Sustainable Water Management 2022 Zhigang Yu , The University of Queensland Novel Disinfection to Combat Antibiotic Resistance2021 Tao Liu, The University of Queensland Towards Net-Zero Emission and Energy Neutrality, a Novel Technology to Utilise Methane Produced in Wastewater Treatment2020 Zhiyao Wang, The University of Queensland An Innovative Way of Treating Wastewater and Sludge Employing a Novel Ammonia-Oxidizing Bacteria Genus Candidatus Nitrosoglobus2019 Ji Lu, The University of Queensland Unravelling Roles of Emerging Environmental Contaminants in Promoting the Spread of Antibiotic Resistance2018 Lindsay Stafford, Gladstone Regional Council Controlling and Monitoring Algae Blooms in Effluent Storage Ponds2017 Adam Rose, CQUniversity Understanding the Ecological Basis for Human Health Risks associated with Drinking Water Drawn from a Sub-Tropical Freshwater CatchmentInfrastructure Project Innovation Award2024 Regional: Coolmunda Dam Variable Counterweight Project – Sunwater Ltd and other contributing Organisations2023 Regional: Callide Dam Gates –Sunwater2023 Metro: How Queensland’s Oldest and Largest Sewer was Upgraded While the City Slept – Interflow and Urban Utilities2021 Regional: Mer (Murray) Island Water Network Management Program – Torres Strait Island Regional Council2022 Regional: Cleveland Bay Purification Plant Process Upgrade Project – AECOM, Townsville City Council, Beca HunterH2O, Evoqua Water Technologies, and Monadelphous Engineering2022 Metro: Australia’s First Biosolids Gasification Facility – Logan Water2021 Regional: Mer (Murray) Island Water Network Management Program – Torres Strait Island Regional Council2021 Metro: Mer (Murray) Island Water Network Management Program – Torres Strait Island Regional Council2020 Regional: Port Stewart Water Supply – Arup and Centre for Appropriate Technology2020 Metro: Cedar Grove Environmental Centre – Logan City Council, Downer, WSP and Cardno (High Commendation: Virtual Assist – Urban Utilities)2019 Townsville CBD Utilities Upgrade – BMD Constructions, Townsville City Council and GHD (servicing under 250,000 end users) Going Green at Kenilworth – Unitywater (servicing over 250,000 end users)2018 Bowen Water Treatment Plant Solar Plant and Resilience Upgrade – Whitsunday Regional Council (under 250,000 end users) Sun and Salt: Logan’s Water Quality Solution – Logan City Council, Downer, Cardno and WSP (over 250,000 end users)2017 Kingaroy Wastewater Treatment Plant Upgrade - Aquatec Maxcon Pty Ltd and South Burnett Regional Council2016 Flood Resilience Program - Queensland Urban UtilitiesR&D Excellence Award (previously known as the Research Innovation Award)2024 Control of BGA bloom using EarthTec at Kinbombi Weir – Gympie Regional Council and other contributing Organisations2023 A Living Laboratory - R&D at Yandina Creek Wetland and Blue Heart Sunshine Coast – Unitywater with Contributing Organisations2022 CRC-P: Transforming Wastewater Treatment in Regional Australia – Urban Utilities, Australian Centre for Water and Environmental Biotechnology, The University of Queensland, Power and Water Corporation, Department of Environment and Science, Queensland, and Aquatec Maxcon2020 Zero-Energy Sewage Treatment: Harnessing the Power of Biogas – The University of Queensland, Urban Utilities, City of Gold Coast, SA Water, Water Corporation and University of Technology Sydney2019 An Integrated Approach to Iron Salt Use in Urban Water Systems – University of Queensland, Queensland Urban Utilities, Seqwater and WaterRA2018 UGOLD – A Decentralised Technology for the Removal & Recovery of Valuable Nutrients From Source Separated Urine - Advanced Water Management Centre, The University of Queensland and Queensland Urban Utilities2017 Purple Phototrophic Bacteria for Resource Recovery from Wastewater - The University of Queensland and CRC for Water Sensitive Cities2016 Affordable and Sustainable Water Recycling through Optimal Technology Integration - The University of QueenslandOrganisational Excellence Award (formerly Program Innovation Award)2024 QLDwater Consortium for Research and Advocacy on Contaminants of Concern – Queensland Water Directorate and other contributing organisations2023 Urban Utilities – Planning Our Journey to Excellence and Empowered People – Urban Utilities, Stantec, KBR and AJile (Aurecon and Jacobs)2022 Fulton Hogan Utilities Schools STEM and Industry Immersion Program – Fulton Hogan Utilities2021 Water Future Program – Seqwater2020 Regional Water Industry Worker Pilot Program – Mackay Regional Council, Whitsunday Regional Council, Townsville City Council, Cairns Regional Council and Burdekin Shire Council2019 Smart Catchments: Saltwater Creek – Cairns Regional Council (servicing under 250,000 end users) Autonomous Motorised Monitoring Instrument – Seqwater (servicing over 250,000 end users)2018 MiSewer, Mackay Water Services – Mackay Regional Council (Under 250,000 end users) Queensland Water Regional Alliance Program (QWRAP) – Department of Natural Resources, Mines and Energy (Over 250,000 end users)2017 Cyanotoxin Based Recreational Water Quality Management Program - Seqwater2016 In Situ Calibration of Bulk Flow Meters - Queensland Urban Utilities and GHDDistinguished Service Award2024 Mark Trembath2023 Richard Savage2022 Kelly Hopewell2021 Mal Shepherd2020 David Cameron2019 Matt Dawson2018 Jenny Danslow2017 John Betts2016 John GrahamRegional Service Award2024 Anna Whelan2023 Narelle D’Amico 2022 Dr Lynne Powell2021 Moira Zeilinga2019 Arron Hieatt2018 Dr Rob Fearon2017 Steve Tansley2016 Jeff Ballard Individual Awards Water Professional of the Year Young Water Professional of the Year Student Awards Student Water Prize Organisational Awards Infrastructure Project Innovation (Metro) Infrastructure Project Innovation (Regional) Organisational Excellence R&D Excellence QLD Regional Service Award QLD Distinguished Service Award Important DatesNominations close: 5 August 2024Winners announced: 3 October 2024 Resources Celebrating the winners of the 2023 Queensland Water Awards SponsorsNational R&D Excellence Award Sponsor Water Professional of the Year Sponsor National Young Water Professional of the Year Sponsor Awards for organisations Open to AWA member organisations, nominate your projects for infrastructure innovation, organisational excellence, research, safety, and customer experience. Find out more Awards for individuals Open to AWA members and corporate member employees, have your commitment recognised as Water Professional of the Year or Young Water Professional of the Year. Be recognised Awards for students Students can enter the Student Water Prize showcasing excellence in water studies and research, and the prestigious Australian Stockholm Junior Water Prize for high school students. Grow your profile Conditions of Entry FREQUENTLY ASKED QUESTIONS What is the difference between State and National awards? To compete in the Australian Water Awards, entries will first be judged at the appropriate State Awards, with winners automatically entered as a finalist for the National awards (aside from our two National Award only categories).In addition to the 10 national award categories, each state runs independently other award categories. These programs, like the national, recognise and reward individuals and organisations for innovation, commitment and leadership in the Australian water sector. Who is eligible to enter? All Awards, aside from the Student Water Prize and Australian Stockholm Junior Water Prize, are open to AWA members only. The Innovating for Sustainable Water and Environmental Outcomes Award (WA only) is also open to non members, however the lead organisation must be a not-for-profit, local government body, non-government organisation, school or small business. For organisational awards, the lead organisation/s must be a current Corporate Member. Any partner organisations listed in the submission must also be a current Corporate Member to receive recognition if announced as a finalist and/or winner. This recognition includes the organisation/s being listed as a finalist on award collateral (online and print), on email communications announcing the finalists and/or winners, on any certificates and/or trophies, on the awards visual presentation (if applicable) and on media release statements.If the partner organisation/s listed in the submission are not current Corporate AWA Members, they will not receive the recognition as listed above.For individual awards, the nominee must be a current individual AWA Member or an employee of a current Corporate Member.To enter, nominations must be submitted using the online entry forms. Please note when your relevant State or Territory award submissions close. How much does it cost? There is no entry fee associated with the AWA Awards program. Can I nominate the same individual or project/program for more than one award category or in more than one state or territory? Duplicate nominations are not permitted in the awards program. This means that you cannot nominate the same individual or project/activity for more than one award category or more than one state or territory in the same year. You can enter more than one award in the same year, as long as it is not with the same project/activity. When do entries close? The submission close dates are specific to the state or territory award being entered. Please click your relevant state/territory button on this page to view the closing dates. How do you submit a nomination? All nominations must be submitted via the online nomination form. Please check the relevant award category page to view the requirements to complete the nomination form. How are the applications assessed? State judging is coordinated by the relevant Member Engagement Manager and committee. Each state convenes a panel of experts to assess the applications.National judging is coordinated by the National Awards Manager. The panels of experts are approved by the Honours & Awards Sub-committee of the Board to take part in the judging. Each panel includes at least three judges and is chaired by an AWA Board Director.At both state and national levels, judges score each nominee based on how well they address the award criteria. The panel then meets to review the scoring and discuss the merits of all submissions. Final scoring and ranking is based on a majority vote from all eligible members of the judging panel.All judges adhere to a code of conduct which includes a policy to prevent conflicts of interest. The judges’ decision is final and no discussion about the merits of entries will be entered into with nominees. How are the Awards presented? Award finalists and winners of the State Awards will be announced at their relevant state or territory event. Winners of the 2023 Australian Water Awards are presented at the Ozwater Gala Dinner, to be held in Sydney in May 2023."
