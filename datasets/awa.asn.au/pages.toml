["https://www.awa.asn.au/membership/individual"]
title = "Membership for me | Membership | AWA"
description = "Join Australia’s largest water professional network and take your membership with you across your water career. Ask the AWA."
full_description = 'Home Membership Membership for me MEMBERSHIP FOR ME Learn and grow with other water professionals Make meaningful connections to last through your water career when you join Australia’s largest water network. Be inspired by your peers, sharpen your leadership skills, and share knowledge with likeminded professionals and practitioners. Why join as a professional member Join a community of almost 5,000 individual members driving a sustainable water future through education, engagement, and connection. Discounted industry and Ozwater events Find your next job on the Careers in Water jobs board Award eligibility Exclusive access to specialist networks and subject matter experts Volunteer on our branch committees to build your profile and contribute to the water community Keep up with industry communications and research Build relationships through our International Program Discounted International Water Association membership Concession member Discounted membership is available for: Full-time students People under 25 Retired professionals Unemployed professionals As a student you will find our resources invaluable to support your study. Young water professionals under 25 enjoy member only access to our mentoring programs. Retired water professionals can continue to share knowledge and contribute to the water community. EVENTS & NETWORKING LEADERSHIP OPPORTUNITIES YOUNG WATER PROFESSIONALS COMMITTEES PROFESSIONAL DEVELOPMENT Join Now Check the benefits Get in touch CONNECT WHERE YOU LIVE State and territory branches coordinate industry programs, events, and awards through committees including Young Water Professionals. ACT NSW NT QLD SA TAS VIC WA IWAA SPECIALIST NETWORKS Share expertise with industry peers through AWA’s 11 member Specialist Networks. Each group provides a networking and learning platform focused on a water management niche or discipline. Asset Management Catchment Management Desalination Operations Regional, Rural & Remote Water Water for All Industrial Water & Trade Waste Water Literacy Water Efficiency Water Quality Water Recycling TESTIMONIALS Jessica Bohorquez Concession Member Water is important worldwide. Having the opportunity to see beyond the Australian borders into different water industries is challenging and sometimes confronting. But at the same time, having the chance to interact with inspiring YWPs in different countries has made me feel empowered and hopeful of the future of this industry." Dr Simon Fane Professional Member AWA membership allows valuable industry networking and also a means for working with a range of people from across the water sector on advocating for better outcomes and advancing knowledge." :root { --swiper-theme-color: #8A8F99; } FREQUENTLY ASKED QUESTIONS Am I entitled to a discounted individual membership if my organisation is a member? If your organisation is a corporate member you may be entitled to a discounted membership rate. You can find out what level membership your organisation has and if a discount would be applicable by using the contact us form or calling our office on +61 2 94360055. When does my membership start? Your annual individual membership begins from when your membership subscription payment has been made and is valid for 12 months from that time. Do I need to be a member to nominate for the Board, a committee or vote in elections? Yes. You require individual membership (professional or concession) to nominate for or vote at any branch or specialist network election. You must also be an individual member to nominate for the board and to have voting rights at the AGM. What if I am a student, under the age of 25, currently unemployed or retired? We offer a Concession level of membership for people who are full time students, under the age of 25, unemployed or retired. You will be asked to provide evidence of this status via a student ID, current enrolment notice, separation letter or seniors card. I have changed employers - does my membership stay with me or the company? It will depend on whether you were nominated by your previous employer to be a part of their corporate membership or if it was an individual membership. You can check the status of your membership online and should you wish to change the type or look at linking to your new employer you can contact the Membership Team to assist – use the contact us form or call our office on +61 2 94360055. Can I renew online? Yes. 30 days prior to your renewal date you will receive an email requesting your intention to renew. If you indicate ‘yes’ you will be able to renew online seamlessly with payment on our secure credit card gateway. How do I reset my password? If you have forgotten your password, you can click the ‘forgotten password’ link at time of login and follow the steps to re-set your password.'
