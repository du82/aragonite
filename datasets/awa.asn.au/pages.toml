["https://www.awa.asn.au/upcoming-events/wa-tour-2025-0"]
title = "WA Regional Tour 2025"
description = "Would you like to come with us as we explore Karlkurla/Kalgoorlie on 12 & 13 March 2025? On this two (2) day tour we will be visiting sites multiple site which will include a networking dinner on the first day, technical presentations and sundowner to finish off the tour on the second day."
full_description = "WA Regional Tour 2025 12 Mar, 2025 - 13 Mar, 2025 | 7.45am – 5.00pm WST | Kalgoorlie (Karlkurla), Western Australia PROGRAM AND REGISTRATION IS NOW AVAILABLE. Join us as we explore mine sites, regional water assets, inland waters, a historical look at remote and regional water and more, on Karlkurla/Kalgoorlie region alongside networking with people working in water? The tour will include networking dinners, an afternoon of technical presentations and a sundowner to finish off the tour.The program is now available and delegates can expect site visits, technical presentations and networking opportunities. What's on offer: St Ives Gold Mine site tour: In Pit Tailings Facility and supernatant decant water recovery water system, extensive fresh (potable) water distribution system, water storage facility at the Lefroy Gold Plant, presentation on water sources, challenges and water management Lynas Rare Earths Processing Facility; Australia's only downstream rare earth's processing facility - the tour will include the rotary kiln, rotainer system at receival facility, filter building and pond system Water Corporation assets including the Goldfields Water Supply Scheme (GWSS) and Binduli Reservoir Terminal Storage facility City of Kalgoorlie-Boulder sites including WWTP and a number of inland water supplies Museum of the Goldfields for a guided tour on the Paddy Hannon water story and CY O'Connor's Mundaring to Kalgoorlie pipeline (includes lunch at the museum) Afternoon of Technical presentations - refer below for speakers Networking Dinner with Keynote speaker - Mayor Glenn Wilson, City of Kalgoorlie-Boulder Networking opportunities and end of tour sundowner at The Beaten Track Brewery. You can view the final program below. Event DetailsIt is recommended delegates arrive into Kalgoorlie on Tuesday 11 March 2025. Tour Day One Date Wednesday 12 March 2025 Time 7.45am for 8.00am departure. Coach returns at 5.00pm Pickup Hospitality Inn, Kalgoorlie Address 560 Hannan Street, Kalgoorlie PPE Required Long pants with hi vis safety stripes, long sleeved hi vis safety shirt, wide brimmed hat, safety glasses and lace up steel capped boots. Safety helmets will be provided at the Goldfields/St Ives Mine tour. Please ensure you bring your own water bottle and sunscreen. Identification Photo identification will be required to be shown on arrival at the St Ives Mine tour. Please ensure you have your driver's licence, passport or photo ID with you. What's included Morning tea, lunch and an afternoon snack. Coach transport and the networking dinner is included in full tour registration. Networking Dinner Day One Date Wednesday 12 March 2025 Time 6:30 - 8.30pm Location The Plaza Hotel Address 45 Egan Street, Kalgoorlie Dress Code Smart Casual What's included 3 course dinner including beverages Networking Dinner Keynote Speaker Mayor Glenn Wilson, City of Kalgoorlie-Boulder Mayor Wilson was elected in 2023, after serving as Deputy Mayor since 2021 and as a Councillor since 2015. A digital media professional with extensive experience in media, mining and resources, his career began in radio broadcasting with Southern Cross Austereo. Passionate about local businesses and economic growth, Mayor Wilson actively supports community initiatives and is dedicated to serving Kalgoorlie-Boulder with integrity. Tour Day Two Date Thursday 13 March 2025 Time 8:45am for 9.00am departure. Coach returns at 5.00pm Pickup Hospitality Inn, Kalgoorlie Address 560 Hannan Street, Kalgoorlie Sundowner(optional) 5.00-6.00pm Sundowner Drinks at The Beaten Track Brewery PPE Required Long pants with hi vis safety stripes, long sleeved hi vis safety shirt, wide brimmed hat, safety glasses and lace up steel capped boots.Please ensure you bring your own water bottle and sunscreen. What's included Morning tea, lunch, afternoon tea and coach transport for full delegate registrations. The Technical Presentation Afternoon event is included in the full delegate registration. Technical Presentation Afternoon Date Thursday 13 March 2025 Time 2.00 - 4.30pm Location Graduates Hall, Curtin University Address 95 Egan Street, Kalgoorlie Dress Code Smart Casual. Clean PPE is acceptable. What's included Afternoon tea Technical Presentation Speakers Giselle Degebrodt, Principal Engineer, Water Infrastructure Science Engineering (WISE)Mind the Water Gap: Battery & Critical Minerals in the Goldfields of WA Giselle is the director of WISE Consulting and has over 25 years' experience in infrastructure planning, engineering design and project delivery. She has a focus on sustainable project outcomes, from remote services to facilitating the global clean energy transition objectives, with the approach that service levels and regulatory compliance can be delivered with a 'less is more' approach. This ethos is delivered with the WISE team across mining, agriculture, industrial and water utilities' sectors. Kris Starcevich, CEO, Goldfields Esperance Development CommissionRegional Drought Resilience Plan for the Goldfields-Esperance region Kris has been CEO of the Goldfields-Esperance Development Commission since May 2018 and has extensive experience working in regional WA in both the public and private sectors. With a background in teaching, he developed a passion for community development whilst working and living amongst several Pilbara communities, completing a Graduate Certificate in Community Relations in Mining. With over 10 years’ experience in the Public Service, Kris works closely with local stakeholders and government to drive social and economic outcomes for the region. Assoc. Professor Laurence Dyer, Deputy Head of School | Metallurgical Engineering, WA School of Mines Nano filtration process (membranes)Laurence has a passion for developing solutions that both improve business and sustainability outcomes, whose primary drive is to continue to produce high quality, job-ready graduates to service industry. His research is currently focused on development of new metal extraction processes, water treatment and the treatment of low grade material and industrial waste streams. He sees great potential in the adaptation of primary production technologies in recycling applications and a greater overlap between extraction, processing, materials science and manufacturing design for more robust and efficient value chains and minimising waste. Dr. Sasi Thamrongvoraporn, Manager – Assets, Midwest Region and Goldfields & Agriculture Region, Water Corporation's long term investment plans for Kalgoorlie pipelines Sasi is an Asset Manager for Mid West Region and Goldfields and Agricultural Region of the Water Corporation. With a background in Environmental science and over 20 years of experience in the water sector, Sasi specialises in water and wastewater treatment, wastewater recycling as well as asset management. Her key interest is sustainable water services in a challenging economy and changing climate Accommodation Travel to Kalgoorlie and accommodation, where required, will be at the cost of the attendee and is not covered in the registration cost. Due to the limited accommodation capacity in Kalgoorlie we have a number of rooms on hold at The Hospitality Inn in Kalgoorlie, which are on hold until 28 February 2025. After this date, accommodation will be subject to availability. Please use the Kalgoorlie Boulder Visitor Centre Booking form (available here ) to secure a room and return the booking form to Larissa via email to fohcoordinator@kalgoorlietourism.com or telephone on (08) 9021 1966 if you have any local accommodation queries. Accommodation Cancellation Policy: Cancelling more than 14 days prior to arrival, a 10% administration fee is payable. Cancelling within 14 days prior to arrival, 1 day cancellation fee per room cancelled. Cancelling within 7 days prior to arrival, 2 days cancellation fee per room cancelled. Program Partnership Opportunities Program partnership opportunities are available for this event. If you would like to partner with us for this event our opportunities include: Partnership Opportunity Investment (AUD excludes GST) Gold (one only) $4,200 Silver (one sold, two available) $2,100 Bronze (three available) $1,100 Student Delegate Sponsor $1,000 See the Program Partner Benefits flyer here. To secure a partnership opportunity or discuss further please contact: Troy Waite, Partnerships and Sponsorships Manager | P: 02 9467 8426 | E: twaite@awa.asn.au Any queries relating to this tour/event please contact: Kyllie Whitehead, Member Engagement Manager WA & NT | Ph: 02 9467 8420 | E: kwhitehead@awa.asn.auEsther Micah, Event Co-ordinator | P: (02) 9467 8434 | E: emicah@awa.asn.au Want more information on the Kalgoorlie-Boulder Region? Visit the Kalgoorlie-Boulder Visitor Centre website: Kalgoorlie Tourism How can I justify my attendance to my employer?We’ve developed a how-to guide to help you convey the direct benefits to your employer. Download and read the pack and adjust it to suit your needs. Registration and Pricing Ticketing Options Price (inclusive of GST) FULL TOUR (this option is for the full 2 day tour and includes the networking dinner on 12 March and Technical Presentation Afternoon on 13 March) Member/Employee of a Corporate Member $450 Concession Member (must be an AWA concession member to be eligible) $370 Non Member $610 Networking Dinner Only, on 12 March Member/Employee of a Corporate Member $140 Concession Member (must be an AWA concession member to be eligible) $105 Non Member $190 Technical Presentation Afternoon (includes afternoon tea) on 13 March Member/Employee of a Corporate Member $50 Concession Member (must be an AWA concession member to be eligible) $35 Non Member $70 The full 2-day tour includes coach transport across the two days from a central pickup/drop off point. All coach pick and return locations will be the Hospitality Inn, 560 Hannan Street, Kalgoorlie WA. Morning tea, lunch, afternoon snack and networking dinner on day one plus morning tea, lunch and afternoon tea on day two. An optional dinner is available Tuesday 11 March and optional sundowner on Thursday 13 March is also available to delegates. The costs of food and beverages for these optional networking opportunities are NOT included in the tour. *** Important Information for delegates attending the Full Tour ***At the time of registration you will be required to include your Identification by way of passport information. You will also need to complete a Confidentiality Agreement for Water Corporation and an online Induction for Goldfields/St Ives Mines visit which will be emailed to you separately. Please allow 10-15 minutes for your document completion, induction and uploading of the completed documentation. Failure to return the confidentiality agreement and induction documents by the due date will inhibit your ability to participate in those site visits that form part of the tour. Registration is due by Friday 28 February 2025. NOTE: IF YOU PURCHASE THE FULL TOUR OPTION YOU DO NOT NEED TO PURCHASE THE NETWORKING DINNER AND TECHNICAL AFTERNOON AS WELL. THESE ARE BOTH INCLUDED IN THE FULL TOUR REGISTRATION. Member/Employee of a Corporate Member Registration Register here Concession Member Registration Register here Non Member Registration Register here Thank you to our Program Partners Silver Program Partner Technical Afternoon Venue Host (Kalgoorlie Campus) Water Recycling Networking Rural and Remote Communities Wastewater Resource Recovery WA tour water in mining regional water Share Terms & Conditions By registering for an Australian Water Association (AWA) Event, you agree to accept the following Terms and Conditions. Click here to view AWA’s privacy policy."
