["https://www.awa.asn.au/membership"]
title = "Membership | Australia’s water professional network | AWA"
description = "Join Australia’s largest water industry professionals network as an individual or an organisation. Ask the AWA."
full_description = "Home Membership MEMBERSHIP Join Australia’s largest water network AWA is the professional network where water connections are made. If you’re starting out or an industry veteran, membership unlocks shared experiences with water peers. Join a community of almost 5,000 individual and 500 corporate members driving a sustainable water future through education, engagement, and connection. Our members are from: Water utilities and authoritiesLocal, state and federal government agenciesRegulators Energy providers Universities and research organisations Manufacturers and suppliers Laboratories and water testing companies Mining and resources Agriculture, aquaculture and irrigation Technology and IoT companiesInfrastructure partners Specialist contractors Consulting and advisory companies Share Information & Knowledge Research a project, find a service provider in our Digital Marketplace, and unlock leadership and professional development opportunities across events and publications. Connect with stakeholders Find your next job, get discounts on events including Ozwater and connect with likeminded water professionals through Specialist Networks mentoring and partnerships. Inspire Positive Change Australian water awards celebrating innovations, programs recognising diversity champions, and international engagement inspiring positive change. I'M INTERESTED IN MEMBERSHIP FOR ME Make meaningful connections to last through your water career Expand your water knowledge through exclusive research and learning opportunities, give and receive mentoring support, and sharpen your leadership skills across national and state-based committees. Find out more MEMBERSHIP FOR MY ORGANISATION Invest in professional and business development where water matters Connect your team with collaborators, raise your business profile across national and state events, and feature your services in the Australian water Digital Marketplace. Find out more OUR PRINCIPAL MEMBERS :root { --swiper-theme-color: #8A8F99; } FREQUENTLY ASKED QUESTIONS How do I become a member? For individual membership or Bronze & Silver corporate members, you can join online here or contact one of our membership team by using the Contact Us form. For Gold corporate memberships and above or education memberships, please contact us to be connected to a Member Engagement Manager who will guide you through the joining process. Who can I contact if I am having trouble joining online? You can contact one of our membership team by using the contact us form or calling our office on +61 2 9436 0055. When does my membership start? Your annual individual or corporate membership begins from when your membership subscription payment has been made and is valid for 12 months from that time. How can I find my membership number? You can find your membership number by logging into your member profile at the top of your screen. Your membership number can be found in your member record. To login your username will be your email address and the password will have been set by you. If you have forgotten your password, you can select the ‘Forgotten Password’ link. Do you need to be a member to nominate for a Water Award? For organisational awards, your organisation needs to be a corporate member. For Water Professional and Young Water Professional of the Year, you must have an individual membership or be an employee of a corporate member. The Student Water prize is open to all students regardless of membership status. Do you need to be a member to join a Specialist Network and specialist member circles? Yes. You require individual membership (professional or concession) to join a Specialist Network and their relevant member circles. This membership is also required should you wish to nominate for a Special Network committee Do you need to be a member to advertise or apply for a position on the AWA Careers in Water Jobs Board? No. You don’t have to be a member to advertise a position or apply for a position."
