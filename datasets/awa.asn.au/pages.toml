title = "Podcasts"
description = "Listen now to the Australian Water Association's Podcasts"
full_description = ".vertical-spacer hr { height: 1px; } The Accelerating Action Podcast series is proudly sponsored by Downer. Latest Podcast Episodes Episode 18 Carbon credits in the water sector In this episode of the Accelerating Action podcast, Kate Smith (Senior Consultant, Aurecon) and Anthony Williams (Manager for Carbon Markets and Strategy, Aurecon) sit down with the Australian Water Association to explore the role of carbon credits in the water sector. Read more Episode 17Indigenous-led youth outreach using real-world community water engineering challenges In this episode of the Accelerating Action podcast, Josh MacLeod (Pathways Outreach Program Manager, Engineers Without Borders Australia) sits down with the Australian Water Association to discuss an inspiring Indigenous-led youth outreach initiative. Read more Episode 16Biosolids production and end use in Australia and New Zealand: statistics and trends In the latest episode of the Accelerating Action podcast, Lauren Randall (Team Leader, Drinking Water Quality Program, Hunter Water) and Beatrice Yong (Senior Technical Advisor, Water Corporation) sit down with the Australian Water Association for an insightful conversation on biosolids management. Read more Episode 15Build it and they will come - Breaking down employment barriers for people with disabilities In the latest episode of the Accelerating Action podcast, Donald Hughan (Corporate Risk Coordinator, Goulburn-Murray Water, former WaterAble Chair, and WaterAble Life Member) and Sylvia Campbell (Process Improvement Lead, Greater Western Water) sit down with the Australian Water Association to explore the critical work being done to dismantle employment barriers for people with disabilities in the water sector. Read more Episode 14Incorporating First Nations knowledge into technical water projects In the latest episode of the Accelerating Action podcast, Jamie Kaye (Principal Scientist, Water Technology) sits down with the Australian Water Association to explore how First Nations knowledge is being integrated into water modelling and land management projects. Read more View more podcast recaps in the Accelerating Action series United by Water (2023 Series) United By Water Episodes (2023) Episode 22Net Zero in Water: Learnings from around the world In the final episode of our United by Water podcast, host Jo Taranto sits down with Lisa Zembrodt and Bradley Yager from Schneider Electric (who have a combined 41 years of working at SE) to discuss 'Net Zero in Water: Learnings from around the world'. Lisa Zembrodt is a Principal at Schneider Electric Sustainability Business and Bradley Yager is the water sector leader for Schneider Electric as well and we're talking today about learnings from around the world when it comes to Net Zero in water. Read more Episode 21Co-designing change: Town Water Risk Reduction Program Host Jo Taranto sits down with Amanda Chadwick, Carmel Krogh and Brendan Guiney to discuss co-designing change for the Town Water Risk Reduction Program. Amanda is the Executive Director of the performance division in the water group at the Department of Planning and Environment. Carmel is an independent consultant who's been working on the town water risk reduction program and Brendan is the Executive Officer for the Water Directorate.Read more Episode 20Increasing the Capacity of Aerobic Sludge Digester Using MBBR Configurations In the latest episode of our United by Water podcast, host Jo Taranto sits down with Paul McPhee, Process Technology Manager at Urban Utilities and Associate Professor Shihu Hu from the University of Queensland and today we're talking about enhancing sludge digestion performance. Read more View more podcast recaps in the United by Water series Previous Episodes"
