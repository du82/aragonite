full_description = '''Home Programs PROGRAMS Supporting a sustainable water future INTERNATIONAL Our AWA International Program creates trade and development opportunities for members, international partners, and the Australian Government to build partnerships, advance climate resilience, promote adaptive and integrated water management, and support inclusive sustainable development across the Asia-Pacific. hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, 'a02b7379-989a-4203-b302-b30835651289', {"useNewLoader":"true","region":"na1"}); MENTORING Our Mentoring Program is designed to connect aspiring water professionals with experienced mentors who can provide guidance, support, and valuable insights. This is your opportunity to receive personalised guidance and build confidence through the help of a water professional who has established themselves in the water industry. hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, '3b3b9f67-1fac-47b2-82d4-11f8c17d0956', {"useNewLoader":"true","region":"na1"}); NATIONAL WATER WEEK - 21-27 October 2024 National Water Week inspires individuals, communities, and organisations to build awareness around the value of water. As the national host for the week, we encourage organisations, schools, and communities to create, take part in, organise, and promote National Water Week events, activities, and educational resources. hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, '7fede8c9-12b7-4687-9cfd-99496ac5772a', {"useNewLoader":"true","region":"na1"}); ANZBP The Australian and New Zealand Biosolids Partnership (ANZBP) is a member-based group managed by AWA, supporting the sustainable management of biosolids. ANZBP develops resources to identify, assess, and manage opportunities and risks associated with biosolids, responding effectively to changing social and regulatory environments. hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, 'aabacff5-3990-44ac-bf25-980531d713c6', {"useNewLoader":"true","region":"na1"}); PROGRAM PARTNERS :root { --swiper-theme-color: #8A8F99; }'''
