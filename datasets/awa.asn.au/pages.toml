description = "The NSW Heads of Water Forum brings together leaders of the NSW water industry to discuss the current issues and future direction of our industry."
full_description = '''NSW Heads of Water Forum, Gala Dinner & Awards 2025 14 Mar, 2025 - 14 Mar, 2025 | 1:30pm – 11:00pm AEDT | AECOM Offices (Forum), Four Seasons Hotel (Dinner) Join us for the 2025 NSW Heads of Water Forum, Gala Dinner and Awards in Sydney as we hear from water leaders and celebrate the state's outstanding achievers. Heads of Water ForumThe NSW Heads of Water Forum brings together leaders of the NSW water community to discuss the current issues and opportunities for our water future. Theme: How NSW Regulators are tackling emerging risks: insights for the water sectorAs the water industry faces an unprecedented magnitude of risks through a changing climate, emergent chemicals of concern, heightened concerns with dam and catchment safety, energy use and production within the sector, and increasing demands from our communities for cleaner, safer water and greater levels of environmental protection, the industry needs to know how NSW Regulators are tackling these emerging risks. The Speakers at this year's forum will be: Chris Salkovic - CEO, Dams Safety NSWNicole Hogan - Assistant Commissioner - Director, Emergency Management, SESGrant Barnes - Chief Regulatory Officer, Natural Resources Access RegulatorAdditional speaker information to follow shortly. hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, '8a8d2440-1b80-4e71-9da7-baef29092ebd', {"useNewLoader":"true","region":"na1"}); Heads of Water Gala Dinner & AwardsThe NSW Gala Dinner & Awards is the highlight of the annual events calendar in the water industry.This prestigious event celebrates the outstanding achievements of innovative and outstanding projects and people. This is a great opportunity to meet with friends and colleagues across the water sector, celebrate an industry that sets out to make a real difference, and learn about the year that was - over a delicious dinner. Awards FinalistsWe're thrilled to announce the finalists for the NSW Heads of Water Awards. Congratulations to all finalists! hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, '837e34ca-9413-40d1-9dd2-86193a07611f', {"useNewLoader":"true","region":"na1"}); Event Details The Heads of Water Gala Dinner and Awards night will follow the Heads of Water Forum being held earlier in the day. Please note registration is required separately for both the Forum and the Dinner. Heads of Water Forum Date Friday, 14 March 2025 Time 1:30pm - 5:00pm AEDT Venue AECOM Sydney Offices Address Level 21/420 George St, Sydney NSW 2000 Dress Code Business casual (see 2024 Gallery here) Heads of Water Gala Dinner & Awards Date Friday, 14 March 2025 Time 6:30pm - 11:00pm AEDT Venue Four Seasons Sydney Address 199 George Street, Sydney, NSW, 2000 Dress Code After 5 (see 2024 Gallery here) Registrations Registration Type Forum Gala Dinner Member $70 $270 Non-Member $98 $375 Concession Member $50 $185 *Concession rates apply to AWA Concession Members (students, retirees and YWPs under the age of 25). THIS EVENTS ARE SOLD OUT Table Configuration and Corporate Tables at the Gala DinnerSeating at the dinner will be allocated with ten individuals to a table. To purchase a "Corporate Table" please purchase 10 x individual tickets. To purchase multiple individual tickets, select the "or add multiple" option displayed under a ticket type, and input the quantity required. GALA DINNER VENUE INFORMATION Discounted Accommodation Four Seasons is pleased to offer guests a 10% discount off the best available rate, subject to availability at time of request.Please call reservations for more information on (02) 9250 3100 and advise you are attending the NSW Heads of Water Dinner for the exclusive rate. Neighbouring hotels are pleased to offer guests a discounted accommodation rate subject to availability: TFE Hotels: Rendezvous Hotel Sydney The Rocks – 15% discount off the best available rate A by Adina Sydney – 15% discount off the best available rate Adina Darling Harbour – 15% discount off the best available rate Vibe Hotel Darling Harbour – 15% discount off the best available rate Please find the code below: Promo code: TH2697031 MembershipIf you wish to find out more about AWA's membership benefits visit our webpage here or contact membership@awa.asn.au ParkingFour Seasons offers guests valet parking. 0 - 4 hours is $49.00 per vehicle; over 4 hours is $89.00 per vehicle. Otherwise, there is a Wilson car park on Harrington street which is a 2 minute walk to the hotel. For more information please contact: Heads of Water Gala Dinner & Awards: Laura Gottsfritz, Events Manager Ph: (02) 9467 8427 | E: lgottsfritz@awa.asn.au Heads of Water Forum: Esther Micah, Events Coordinator Ph: (02) 9467 8434 |E: emicah@awa.asn.au Membership and Awards: Peter Fry, Member Engagement Manager Ph: 02 9467 8419 | E: pfry@awa.asn.au Sponsorship Opportunities: Troy Waite, Partnerships and Sponsorships ManagerPh: 02 9467 8426 | E: twaite@awa.asn.au Thank you to our Sponsors HEADS OF WATER FORUM EVENT HOST HEADS OF WATER DINNER SPONSORS PRINCIPAL SPONSOR MAJOR DINNER SPONSOR MAJOR SPONSORS WATER PROFESSIONAL OF THE YEAR SPONSOR INFRASTRUCTURE PROJECT INNOVATION (METRO AND REGIONAL) AWARD SPONSOR R&D EXCELLENCE AWARD SPONSOR ORGANISATIONAL EXCELLENCE AWARD SPONSOR YOUNG WATER PROFESSIONAL OF THE YEAR AWARD SPONSOR Gala Dinner Awards Networking NSW Share Terms & Conditions By registering for an Australian Water Association (AWA) Event, you agree to accept the following Terms and Conditions. Click here to view AWA’s privacy policy.'''
