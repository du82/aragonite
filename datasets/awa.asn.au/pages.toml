["https://www.awa.asn.au/programs/international"]
title = "International"
description = "AWA International Program"
full_description = "Home Programs International International Program Connecting Australian and international water communities International Program Connecting Australian and international water communities #widget_1731625485751_overlayText { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); width: 90%; } OVERVIEW AWA builds development partnerships and enhances trade cooperation across Australia and the Asia-Pacific, accelerating progress towards a sustainable water future for all. These opportunities are made possible through external funding mechanisms, including programs, grants and sponsorship. Development We connect AWA members with international development opportunities in the Asia-Pacific region, aligned with both Australian Government and international partner priorities. Trade We create member-driven opportunities to connect products and services with markets overseas and facilitate access to Australian Government assistance where available. TESTIMONIALS Lucy Habu Manager of Retail, Solomon Water Partnerships like this create lasting impact. They bring us closer together, empowering us to work hand in hand to combat the rising tide of challenges ahead. And in doing so, they help us fulfil the most important mandate of all: providing our communities with access to safe, clean water. Monique Byrne Senior Water Quality Scientist, Taswater Over one short week, I learnt that building our capacity to provide climate-resilient water services is a common challenge, progress happens together, and if we treat each other more like family, we might get there a lot faster. Ms Hang Thanh Ha Deputy Chairwoman, Head of International Cooperation Department – Vietnam Water Supply and Sewerage Association The most successful programs that AWA and VWSA have been facilitating are the Vietnam - Australia Water Utility Improvement Program and Partnerships for a Resilient and Climate Smart Water Sector. These programs have brought together 20 utilities across all Australia and Vietnam, approximately 1000 water professionals involved in the knowledge sharing focusing on areas such as Asset Management, Non-Revenue Water, Water Quality Management, Digital Transformation, resulting in improved water services for millions of customers in Vietnam. Additionally, these programs strengthen the bilateral relationship between Vietnam and Australia through not only sharing technical knowledge and experience in operation but also sharing cultural knowledge, supporting in responding to climate change and nurturing a sustainable water future. :root { --swiper-theme-color: #8A8F99; } OUR IMPACT Strong Water Sectors We collaborate closely with key regional associations and utilities to enhance their capabilities and foster sustainable water management practices across Southeast Asia and the Pacific. Association Capacity Building We engage with leading associations such as the Pacific Water and Wastewater Association (PWWA), Vietnam Water Supply and Sewerage Association (VWSA), Indonesian Water Supply Association, PERPAMSI, and Cambodian Water Supply Association (CWA). Through tailored workshops and strategic sessions, we focus on improving member engagement, policy advocacy, and impactful communications. These efforts strengthen collaboration and build essential capacity within the associations. Utility Capacity Building Through partnerships with utilities and service providers, we drive advancements in incident and risk management, introduce innovative approaches to non-revenue water, asset management, and water quality. Since 2022, more than 600 participants have benefited from our study tours and workshops, facilitating knowledge exchange and technical skill development. Business Development Fostering international business partnerships and creating opportunities for knowledge exchange and market expansion in the water sector. AWA regularly supports members to attend to regional conferences and exhibitions, as well as inbound delegations to connect with the Australian water sector. Fairness, Equity, and Inclusivity Our programs actively promote GEDSI (Gender, Equality, Disability, and Social Inclusion) by providing training and leadership opportunities for women and young professionals. By empowering diverse voices, we increase confidence and open pathways for career development within the water sector. Communication and Impact We play a pivotal role in shaping water policy development by collaborating with governments and stakeholders. Our communications for impact and advocacy efforts focus on promoting sustainable management practices, equitable distribution, improved governance, and international standards adoption. Risk and Resilience Sharing best practices, facilitating tailored training, and promoting collaborative initiatives to enhance adaptive capacity and sustainable water management. By connecting Australian and international partners, and embedding disaster, risk, resilience and climate change practices, we are building a more connected, resilient water sector. Leadership and Growth Connecting Young Water Professionals and leaders internationally by providing networking opportunities, mentorship programs, and platforms for knowledge exchange at global conferences and events. WHAT WE DO ✓ Utility-to-utility capacity building partnerships, including service providers ✓ Association-to-association collaboration and capacity building ✓ Outbound and inbound trade delegations ✓ Outbound and inbound study tours and exchange visits ✓ Communities of practice ✓ Young Water Professional collaboration and professional development ✓ Tailored programming and support for conference and exhibitions like Ozwater ✓ Policy forums, information exchange, and knowledge transfer programs OUR EXPERTISE In addition to having extensive water sector and technical expertise, our team is skilled in international program design and delivery, monitoring and evaluation, inclusive practices, and complex stakeholder engagement and management. GET INVOLVED Contact us today to find out more. PUBLICATIONS AND RESOURCES International Water Source Stories Report: Building Climate Resilient Water Utilities and Associations AWA International Program Videos"
year_published = 2025
clearnet = "https://www.awa.asn.au/programs/international"
