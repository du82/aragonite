["https://www.awa.asn.au/resources/latest-news/2024-water-awards-sa-spotlight-on-excellence"]
title = "2024 Water Awards SA: spotlight on excellence"
description = "This year’s winners of the Australian Water Association’s Water Awards SA were announced at the SA Gala Dinner & Awards on 8 November."
full_description = '''2024 Water Awards SA: spotlight on excellence Jan 9, 2025 | 2 mins read by Water Source This year’s winners of the Australian Water Association’s (AWA) Water Awards SA were announced at the SA Gala Dinner & Awards at the Adelaide Convention Centre on 8 November, with excellent projects and leadership celebrated from across the state. The Water Awards SA recognise the contribution of the Association’s members for their inspiring leadership and innovative research, programs and infrastructure projects. AWA Chief Executive Corinne Cheeseman said the winners showcase outstanding collaboration and innovation. "Congratulations to all the winners and finalists of this year’s Water Awards SA. Your achievements reflect the innovation, dedication and collaborative spirit that define our sector,” she said. “From enhancing water security in remote communities to groundbreaking infrastructure projects, each success showcases the diverse ways we can create a sustainable and prosperous water future. “It’s inspiring to see the passion and leadership that drives these efforts, reminding us all of the power of partnership in overcoming challenges and building a better future for water in South Australia." This year’s Water Award SA winners will go on to represent the state in the national Australian Water Awards, with winners presented at the AWA’s annual water conference and exhibition, Ozwater’25, in Adelaide. WINNERS Organisational Excellence Award Department for Environment and Water – Achieving Sustainable and Prosperous Futures for Self-Supplied Remote Communities Through innovative community engagement and the development of a risk assessment tool, communities at high risk of water insecurity have been identified. This knowledge base enables informed investment in co-designed, fit-for-purpose infrastructure to achieve sustainable and prosperous futures for self-supplied remote communities. R&D Excellence (sponsored by Water Research Australia) SA Water – Benthic Cyanobacteria and Where to Hopefully Find Them This study has helped SA Water understand the impact of benthic cyanobacteria on reservoirs and water treatment performance. The comprehensive approach provides a robust framework for managing cyanobacterial blooms, benefiting current and future water management practices in South Australia and beyond. Infrastructure Project Innovation Award (REGIONAL) (sponsored by John Holland) Ricardo and Beach Energy – Flood Modelling in the Cooper Creek to Safeguard SA's Energy Industry The remote Cooper Creek in northern South Australia experiences flooding 1.5 times larger than those of the Murray, putting Australia's energy sector at risk. Ricardo went from a pilot two-dimensional model to a sophisticated planning tool for their partners Beach Energy to assist with operations planning, risk mitigation and environmental assessment. Infrastructure Project Innovation Award (METRO) (sponsored by John Holland) Green Adelaide (Department for Environment and Water), SA Water and other contributing organisations – Breakout Creek Stage 3 Breakout Creek Stage 3 transformed 1.6km of River Torrens/Karrawirra Pari from an artificial drainage channel into a vibrant new ecosystem integrating significant community amenity, recreational opportunities and cultural reflections. Many stakeholders worked together to deliver the final piece of this 30-year journey for Breakout Creek/Purruna Pari. Hodgson Medal: Student Water Prize (sponsored by Office of Northern Water Delivery) Weiwei Duan – University of South Australia Utilising Alum-Based Water Treatment Residue in Producing Highly Durable Alkaline-Activated Material Weiwei's PhD research demonstrates the successful use of water treatment residue, a by-product from water treatment process, to create a sustainable construction material. This eco-friendly alternative to traditional cement offers improved durability, acid and corrosion resistance, while reducing carbon emissions and providing a circular solution for industrial waste management. Young Water Professional of the Year (sponsored by Xylem) Dr Jessica Bohorquez – Aurecon Jessica is a visionary leader combining technical expertise with a passion for communicating the value of water. From pioneering research on leak detection, contributing to water infrastructure projects and bringing water closer to the community, Jessica is on a mission to create water curiosity and solve our water challenges. Premier’s Water Medal: Water Professional of the Year (sponsored by Department for Environment and Water) Jeff Tyler – Principal Engineer, Tonkin During his 30-year career, and the past five years in particular, Jeff has demonstrated exceptional passion and commitment to the sector. His visionary yet down-to-earth leadership has inspired positive change, both through his work at Tonkin, and across the water sector more broadly.The Association congratulates all the award finalists and winners and thanks our sponsors – SA Water, Government of South Australia, Jacobs, Fulton Hogan, Guidera O’Connor, Department for Environment and Water, Office of Northern Water Delivery, John Holland, Water Research Australia and Xylem – for their support of this event and these important industry awards. Innovation Guidera O’Connor Australian Water Awards SA Water John Holland Jacobs Fulton Hogan Water Research Australia XYLEM SA South Australia (SA) Water Awards SA Office of Northern Water Delivery Department for Environment and Water Government of South Australia Share RELATED NEWS South Australian water sector celebrates its achievements at water awards Alex Morrison The Australian Water Association (AWA) Water Awards SA winners were announced at the SA Gala Dinner & Awards Night on Friday, 18… Read Full Paper Celebrating the Water Awards winners at the SA Gala Dinner and Awards Night Water Source The winners of the Australian Water Association’s Water Awards South Australia (SA) have been announced at the SA Gala Dinner and… Read Full Paper South Australia celebrates exceptional Members at the SA Gala Dinner and Awards Water Source The 2023 Australian Water Association's Water Awards SA (South Australia) winners have been announced at the SA Gala Dinner &… Read Full Paper'''
year_published = 2025
