["https://www.awa.asn.au/awards-nt"]
title = "NT Water Awards | Australia’s water professional network | AWA"
description = "Celebrate water excellence and innovation with the NT Water Awards from Australia’s largest water practitioners and professionals network."
full_description = "NT WATER AWARDS Recognising Australian water innovation and excellence Our Territory and National Water Awards Program recognises outstanding achievements of individuals, organisations and students. The awards showcase innovation, leadership, infrastructure and inspiring positive change to drive a sustainable water future. NT Honour Roll Previous NT Winners Water Professional of the Year Award2024 Kylie Collins, Power and Water Corporation2023 Steven Tickell, Department of the Environment, Parks and Water Security 2022 Terry Ward, Technical Director – Water, GHD2021 Prof Charlie Fairfield, Charles Darwin University2019 Eric Vanweydeveld, Power and Water Corporation2018 Darryl Day, ICE WaRM2016 Dr Kevin Boland, Tropical Water SolutionsYoung Water Professional of the Year Award2024 Dr Susannah Clement, Department of Environment, Parks and Water Security 2023 Skye Haigh, Practice Lead - Remote Development, Ekistica 2022 Daniel Lane, Senior Chemical Engineer, Trop Water2021 Jocelyn Ellero, SMEC2020 Andrea Georgiou, GHD2019 Christina Bruno, Tonkin2017 Isabel Caballero, Tropical Water Solutions2016 Cail Rayment, Power and Water CorporationStudent Water Prize2022 Vanessa Solano, Charles Darwin University Carbon Cycling Through Wetlands and Streams in the Wet-dry Tropics2020 Andrea Georgiou, Charles Darwin University Non-Revenue Water: The Effect of Pressure Reducing Valve Settings on a Reticulated Water Supply System2019 Alea Rose, Charles Darwin University Leanyer Sanderson Waste Stabilisation Pond Microbiology2017 Themelis Mousellis, Charles Darwin University Defining risk-based odour buffer zones for Darwin's wastewater treatment facilities: odour dispersion modelling and field olfactometryInfrastructure Project Innovation Award2024 Regional: Katherine PFAS Water Treatment Plant, Power and Water Corporation2023 Regional: Laramba Water Treatment Plant: Improving the Health of a Remote Community – Power and Water Corporation and Clean TeQ Water 2022 Regional: Remote Housing Program – Headworks, Power and Water Corporation2020 Regional: Ngukurr Leak Reduction Project - Power and Water Corporation2019 Borroloola Water Treatment System Upgrade: The Containerised Story – Power and Water Corporation and SUEZ2017 Mt Todd, Discharge Plan - GHD2016 Adelaide River Water Treatment Plant - Power and Water Corporation, SUEZ & Goodline (& National Winner)Organisational Excellence Award (formerly Program Innovation Award)2023 Territory Water Plan - NT Government agencies and Power and Water Corporation2022 Drinking Water Quality Management System Improvement: 2016 to 2021 - Power and Water Corporation2019 That’s My Water! – The Weather Web – Power and Water Corporation2017 Community Leak Program - Living Water Smart - Water Services, Power & Water Corporation (& National Winner)2016 Yurrawi integrated water efficiency trial - Power and Water Corporation in partnership with the Northern Territory Department of Housing and Community DevelopmentR&D Excellence Award (sponsored by Water Research Australia)2022 Water Conservation for Remote Dialysis - Purple House and Department of Agriculture, Water and the Environment Individual Awards Water Professional of the Year Young Water Professional of the Year Student Awards Student Water Prize Organisational Awards Infrastructure Project Innovation (Metro) Infrastructure Project Innovation (Regional) Organisational Excellence R&D Excellence Important DatesNominations close: 9 August 2024Winners announced: 9 October 2024 Resources Outstanding achievements recognised at the 2023 NT Water Awards SponsorsNational R&D Excellence Award Sponsor National Young Water Professional of the Year Sponsor Awards for organisations Open to AWA member organisations, nominate your projects for infrastructure innovation, organisational excellence, research, safety, and customer experience. Find out more Awards for individuals Open to AWA members and corporate member employees, have your commitment recognised as Water Professional of the Year or Young Water Professional of the Year. Be recognised Awards for students Students can enter the Student Water Prize showcasing excellence in water studies and research, and the prestigious Australian Stockholm Junior Water Prize for high school students. Grow your profile Conditions of Entry FREQUENTLY ASKED QUESTIONS What is the difference between State and National awards? To compete in the Australian Water Awards, entries will first be judged at the appropriate State Awards, with winners automatically entered as a finalist for the National awards (aside from our two National Award only categories).In addition to the 10 national award categories, each state runs independently other award categories. These programs, like the national, recognise and reward individuals and organisations for innovation, commitment and leadership in the Australian water sector. Who is eligible to enter? All Awards, aside from the Student Water Prize and Australian Stockholm Junior Water Prize, are open to AWA members only. The Innovating for Sustainable Water and Environmental Outcomes Award (WA only) is also open to non members, however the lead organisation must be a not-for-profit, local government body, non-government organisation, school or small business. For organisational awards, the lead organisation/s must be a current Corporate Member. Any partner organisations listed in the submission must also be a current Corporate Member to receive recognition if announced as a finalist and/or winner. This recognition includes the organisation/s being listed as a finalist on award collateral (online and print), on email communications announcing the finalists and/or winners, on any certificates and/or trophies, on the awards visual presentation (if applicable) and on media release statements.If the partner organisation/s listed in the submission are not current Corporate AWA Members, they will not receive the recognition as listed above.For individual awards, the nominee must be a current individual AWA Member or an employee of a current Corporate Member.To enter, nominations must be submitted using the online entry forms. Please note when your relevant State or Territory award submissions close. How much does it cost? There is no entry fee associated with the AWA Awards program. Can I nominate the same individual or project/program for more than one award category or in more than one state or territory? Duplicate nominations are not permitted in the awards program. This means that you cannot nominate the same individual or project/activity for more than one award category or more than one state or territory in the same year. You can enter more than one award in the same year, as long as it is not with the same project/activity. When do entries close? The submission close dates are specific to the state or territory award being entered. Please click your relevant state/territory button on this page to view the closing dates. How do you submit a nomination? All nominations must be submitted via the online nomination form. Please check the relevant award category page to view the requirements to complete the nomination form. How are the applications assessed? State judging is coordinated by the relevant Member Engagement Manager and committee. Each state convenes a panel of experts to assess the applications.National judging is coordinated by the National Awards Manager. The panels of experts are approved by the Honours & Awards Sub-committee of the Board to take part in the judging. Each panel includes at least three judges and is chaired by an AWA Board Director.At both state and national levels, judges score each nominee based on how well they address the award criteria. The panel then meets to review the scoring and discuss the merits of all submissions. Final scoring and ranking is based on a majority vote from all eligible members of the judging panel.All judges adhere to a code of conduct which includes a policy to prevent conflicts of interest. The judges’ decision is final and no discussion about the merits of entries will be entered into with nominees. How are the Awards presented? Award finalists and winners of the State Awards will be announced at their relevant state or territory event. Winners of the 2023 Australian Water Awards are presented at the Ozwater Gala Dinner, to be held in Sydney in May 2023."
year_published = 2025
