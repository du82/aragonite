full_description = "Events Ozwater | Webinars | NSW | QLD | VIC | WA | TAS | SA | ACT | NT | International | View all events PAST EVENT HIGHLIGHTS QWater'21 This year's QWater Conference explored the theme 'Embracing Positive Change Through Disruption'. The event was a terrific success, with 300 people in attendance across the two days, and multiple highlights across the 33 technical presentations, 30 exhibitors, four keynote speakers and the Safety... View Gallery WA Water Awards 2021 WA's Water industry leaders and professionals came together to recognise and celebrate the achievements of the WA Awards finalists and winners, and to discuss what the future holds. View the highlights from the evening here. View Gallery SA Gala Dinner and Awards Night 2021 A night spend celebrating the South Australian Water Award finalists and winners as they showcased their innovative contributions towards our sustainable water future. View the highlights from the evening here. View Gallery Past Event Galleries TESTIMONIALS Rachael Nuttall Business Development Manager, SUEZ Water AWA Events provide very good content that is relevant to my role in the Water sector. They are great networking opportunities. Dan Spackman National Manager – Water Infrastructure, SMEC Ozwater this year was a triumphant return. The Association has a wonderful formula that strikes the balance between technically informative, while providing the platform to engage face to face with industry peers. I am looking forward to 2022 and the opportunity to once again attend Ozwater in Brisbane, and other wonderful AWA events such as the ACT Water Leaders Dinner and ACT Water Matters Conference. Alan Toomey CWN Water – Director of Operations, Jacobs This year’s AWA breakfast in WA brought together senior members of industry organisations to discuss the role that water will play in achieving Net Carbon Zero. It was great to hear the positive intent from the speakers on collaborating to get there. AWA events provide a great platform for sharing, connecting, and inspiring the industry to drive towards a sustainable future. :root { --swiper-theme-color: #8A8F99; } OUR PRINCIPAL MEMBERS :root { --swiper-theme-color: #8A8F99; }"
