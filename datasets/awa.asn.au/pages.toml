["https://www.awa.asn.au/membership-specialist-water-networks"]
title = "Specialist Water Networks | Membership | AWA"
description = "Eleven AWA Specialist Networks provide members with niche water management expertise and resources. Ask the AWA."
full_description = "Home Membership for me Specialist Networks SPECIALIST NETWORKS Choose your water connections Our 11 Specialist Networks provide a platform for members to share expertise across water management specialisations. From catchment management to water literacy and efficiency, members opt-in to hear from the networks of their choice. The networks are overseen by multidisciplinary committees of water professionals and practitioners committed to sharing information to drive a sustainable water future. Asset Management Connects asset managers and professionals to build best practice strategies in the field, optimise asset value, and boost capability through community. Learn more Catchment Management Supports collaboration to inform integrated catchment management, and advocates for consistent national catchment management standards. Learn more Desalination Raises awareness of desalination technologies and the critical role they play in water security for peers and the community. Learn more Operations Gives an Australia-wide voice to public and private operations professionals across catchments, treatment and transport. Learn more Regional, Rural & Remote water Active advocates for regional water issues and the supply of safe drinking water, allocation of water resources, and the impacts of climate change. Learn more Water for All Supports equitable access to clean drinking water and sanitation across Australia by 2030 in line with Sustainable Development Goal 6. Learn more Industrial Water & Trade Waste Supports best practice industrial wastewater management to ensure safety and compliance, safeguard assets, and facilitate water recycling. Learn more Water Literacy & Education Drives increased water literacy and education in schools and the wider community to expand the scope, scale and impact of water education. Learn more Water Efficiency Leads the national conversation on water efficiency, affordability and resilience, and advocates for water efficiency as not just a crisis response. Learn more Water Quality Strengthens water quality technical and integrative expertise by evaluating new and emerging technologies, showcasing research, and supporting development of national standards. Learn more Water Recycling Sharing recycling knowledge and resources to ensure a reliable, climate-resilient and economically sound water source for Australian communities, industries and agriculture. Learn more VOLUNTEER PROFILE Yunal Kumar, Yarra Valley Water Water Recycling My motivation to promote potable reuse as a feasible option for a climate resilient future has allowed me to be an integral part of the AWA Water Recycling Specialist Network Committee. Taking the lead role has allowed me to voice the breadth of experience & knowledge of the committee members with respect to the future of water recycling. Greg Greene Catchment Management I was inspired to take a lead role on the Specialist Network as I wanted to advocate for the development of a national set of guiding principles for protecting drinking water source catchments, something I’m deeply passionate about. I also wanted to give something back to an industry that has provided me with many opportunities. Sally Williamson, Aurecon Water Quality I have worked within the water industry for nearly 20 years in a range of areas and am currently in the engineering space with experience in treatment planning and design for various water types. I see the Water Quality Specialist Network as a vehicle to achieve a connected water quality community where we can share ideas, challenges, solutions and successes. Cris Carvalho, Aqwest Bunbury Asset Management I have the privilege to manage the asset lifecycle section at Aqwest in Bunbury South West WA. I joined the Asset Management Specialist Network because it is a sector tailored group of people that focus on sharing the experiences in contemporary asset management across the country and across the whole service chain of the water cycle. :root { --swiper-theme-color: #8A8F99; } FREQUENTLY ASKED QUESTIONS Do you need to be a member to join a Specialist Network and specialist member circles? Yes. You require individual membership (professional or concession) to join a Specialist Network and their relevant member circles. This membership is also required should you wish to nominate for a Special Network committee. How do I join a Specialist Network? Just login as a Member (top right-hand corner of your screen) to select or update your specialist network preferences. It is recommended that you select no more than 3 or 4 specialist networks to ensure that you can maximise your engagement with those that are of most interest to you."
year_published = 2025
clearnet = "https://www.awa.asn.au/membership-specialist-water-networks"
