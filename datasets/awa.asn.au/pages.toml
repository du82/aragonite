["https://www.awa.asn.au/resources/latest-news/2024-queensland-water-awards-celebrating-the-state-s-top-projects-and-professionals"]
title = "2024 Queensland Water Awards: celebrating the state’s top projects and professionals"
description = "The 2024 Queensland Water Awards have honoured the state's best projects and professionals with a raft of impressive and inspiring environmental stewardship on display."
full_description = "2024 Queensland Water Awards: celebrating the state’s top projects and professionals Oct 4, 2024 | 3 mins read by Water Source The 2024 Queensland Water Awards have honoured the state's best projects and professionals with a raft of impressive and inspiring environmental stewardship on display. Announced at the Queensland Gala Dinner & Awards held at Brisbane City Hall on 3 October, the Queensland Water Awards recognise the contribution of the Association’s members for their inspiring leadership and innovative research, programs and infrastructure projects. AWA Chief Executive Corinne Cheeseman congratulated all the finalists and winners, noting their outstanding achievements and significant contribution towards creating a sustainable water future. “The dedication and innovative spirit shown by Queensland’s water professionals is truly exceptional. It’s inspiring to see their groundbreaking work recognised and celebrated,” Cheeseman said. “Queensland’s commitment to valuing the environment, community and health is evident in the outstanding achievements of our winners and finalists. They are not just participants but pioneers in water management excellence. “AWA congratulates these visionary water professionals and organisations who are leading the way towards a more resilient and sustainable water future.” This year’s Queensland Water Award winners will go on to represent the state in the national Australian Water Awards, which will be presented at the AWA’s annual water conference and exhibition, Ozwater’25, in Adelaide. Organisational Excellence Award Queensland Water Directorate and contributing organisations – qldwater Consortium for Research and Advocacy on Contaminants of Concern The qldwater Consortium for Research and Advocacy on Contaminants of Concern is a partnership among Queensland service providers to share information and partner with national research and policy programs on contaminants of emerging concern. R&D Excellence (sponsored by Water Research Australia) Gympie Regional Council – Control of BGA bloom using EarthTec at Kinbombi Weir The groundbreaking EarthTec trial at Kinbombi Ponds revolutionised blue-green algae control with eco-friendly solutions. Achieving over 99% reduction in algae blooms, this innovative approach ensures safer drinking water, significant cost savings and minimal environmental impact. Presented at major conferences, it's setting new standards for sustainable water management. Infrastructure Project Innovation Award (REGIONAL) Sunwater, Abergeldie Complex Infrastructure, Munster Services Group and contributing organisations – Coolmunda Dam Variable Counterweight Project Sunwater's Coolmunda Dam project showcases a unique approach to engineering challenges. The custom-designed lifting frame, a first-of-its-kind solution, ensured safe and efficient maintenance of the dam's spillway gates, while maintaining water supply. This innovation exemplifies adaptability and foresight in infrastructure management. Infrastructure Project Innovation Award (METRO) Unitywater – Restoring Caboolture River for Sustainable Sewerage Services To create more liveable communities and sustainable sewerage services, Unitywater has undertaken restoration work on 2.4kms of the Caboolture River with innovative stabilisation methods and 30,000 plants. This provides a nutrient offset and flexibility for the nearby wastewater treatment plant and contributes to sustainability goals to look after local waterways. Student Water Prize (sponsored by Fulton Hogan) Sophie Barrett – University of Queensland The effects of urban densification and climate change on residential urban water balance in sub-tropical climate As a master's student in architecture, Sophie believes that there is a significant gap between the architecture and water industries. She contends that architectural education needs to address the impact of the built environment on urban hydrology better for both industries to mitigate the impacts of climate change. Young Water Professional of the Year (sponsored by Xylem) Lindsay Stafford – Team Lead, Water Infrastructure and Senior Civil Engineer, AECOM With over six years’ experience in the water sector and current Team Lead of the Water Infrastructure team in Rockhampton, Lindsay is passionate about delivery of technical solutions. She centres her focus on people and culture, driving the growth of her team for the benefit of the local community. Water Professional of the Year (sponsored by KSB) Cameron Jackson – Futures Specialist Environment Water Quality, Urban Utilities Cameron has a passion for environmental science, biodiversity conservation and science-based decision making. He has been instrumental in achieving vital environmental outcomes for the water sector in his 34 years of service. His knowledge, experience and passion has resulted in him becoming a respected leader and role model to all. The Association congratulates all the award finalists and winners and thanks our sponsors – John Holland, Sequana, Pensar, 4020 consult, Water Research Australia, Fulton Hogan, Xylem and KSB – for their support of this event and these important industry awards. Take a look at photos from the evening here. Thank you to our Queensland Gala Dinner & Awards Sponsors: Principal Sponsor Networking Sponsor Dinner Sponsors Water Professional of the Year Award Sponsor Student Water Prize Sponsor National R&D Excellence Award Sponsor National Young Water Professional of the Year Award Sponsor Awards Queensland Water Awards Australian Water Awards Queensland QLD Share RELATED NEWS QLD Source: Queensland Gala Dinner 2024 Ming Zhou The AWA QLD Gala Dinner 2024 - Celebrating Success with a Supportive Community By Ming Zhou, Young Water Professional Committee… Read Full Paper Celebrating the winners of the NSW Water Awards 2024 Water Source The winners of the Australian Water Association’s New South Wales Water Awards have been announced at the NSW Heads of Water Gala &… Read Full Paper Queensland water achievements celebrated at AWA Gala Dinner Water Source The Australian Water Association's Queensland (QLD) Water Awards winners have been announced at the QLD Gala Dinner and Awards… Read Full Paper"
