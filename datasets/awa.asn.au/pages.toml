full_description = '''Home Branch committees ACT Branch Committee ACT BRANCH The ACT Branch is in a unique position with individual and corporate members including major federal agencies, and universities and students – our water leaders of the future. The ACT Branch serves its members and the broader water community by fulfilling AWA’s main objectives to share, connect & inspire. Branch Committee President: Nic MorganVice President: Maritsa Kacopieros Committee Members: Nicole VonarxCurtis GordonKlaus Joehnk Advait MadavRose McKennaSabrina MoirAnthony Slatyer Paul Everett Cherie Blackburn Ana Remedios Michael Wilson GET INVOLVED Be a leader in the ACT Branch by nominating for a future committee, join the ACT mentoring program, and support ACT events. hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, '412b39b3-e04e-46cd-837a-b306514fce16', {"useNewLoader":"true","region":"na1"}); hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, 'ef06f634-6f5c-45c9-8ffa-9c0b5f6bdc5a', {"useNewLoader":"true","region":"na1"}); hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, '1075da90-1fd8-4558-8e65-f9e22f0dc4e7', {"useNewLoader":"true","region":"na1"}); hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, '6fafd842-2218-4d95-a2ac-226e521634ae', {"useNewLoader":"true","region":"na1"}); Branch Partners & Sponsors ASK YOUR MEMBER ENGAGEMENT MANAGER Peter Frypfry@awa.asn.au(02) 9467 8419'''
