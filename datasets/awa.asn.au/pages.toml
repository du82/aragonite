title = "Australian Stockholm Junior Water Prize 2024"
description = "The Australian Stockholm Junior Water Prize is an annual water science competition for high school students. Students are challenged to create solutions for water challenges – with the national prize awarded at Ozwater."
full_description = '''Home Awards Australian Stockholm Junior Water Prize Australian Stockholm Junior Water Prize Overview The Australian Stockholm Junior Water Prize is an annual water science competition for high school students. Students are challenged to create solutions for water challenges – with the national prize awarded at Ozwater. The winner of the Australian competition is invited to participate in the Stockholm Junior Water Prize. The prestigious international award is awarded each World Water Week in Sweden. Meet our Australian Stockholm Junior Water Prize past winners Eligibility Open to high school students aged 15-20 who have conducted water-related projects of environmental, scientific, social or technological importance. Students may enter as individuals or groups of two. Both members and non-members of AWA are eligible to enter. Teachers Resources Google Slides Download Logo Zoom Background Social Media Graphic Flyer Judging Criteria Relevance Creative ability Methodology Subject knowledge Practical skills Report and presentation 2025 Key Dates October 2024: Australian Competition opened 28 March 2025: Submissions due April 2025: Shortlisted finalists present their projects to the national jury May 2025: Winner announced at the Australian Water Awards, presented during Ozwater’25 August 2025: International competition in Stockholm at World Water Week (date to be announced) hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, 'c04c077c-158f-4bdc-910a-b7cd38f0fd68', {"useNewLoader":"true","region":"na1"}); DOWNLOAD EDUCATORS TOOLKIT DOWNLOAD GUIDELINES & INFORMATION KIT MEET OUR PAST WINNERS Timeline Term 4 Work on your project Term 1 Submission of final project March Finalists present to the national jury August Competition in Stockholm at World Water Week REGISTER NOW FOR NEXT CYCLE Would you like some support or expertise to help with your project development? The Association would be happy to connect you with a Member who can provide some support, mentoring or expertise to assist you develop your project. Please fill out the form below and we'll be in touch. hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, '62490322-8569-4f6a-8c26-11ef1368dfeb', {"useNewLoader":"true","region":"na1"}); Thanks to our sponsor'''
