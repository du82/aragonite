["https://www.awa.asn.au/local-branch/iwaa"]
title = "IWAA Branch | Membership | AWA"
description = "The IWAA connects AWA and IWA members in Australian and globally. Ask the AWA."
full_description = '''Home Branch committees IWAA Branch Committee IWA AUSTRALIA (IWAA) AWA is the Governing Member for Australia for the International Water Association (IWA). The IWA is a global network of water professionals striving for a world in which water is wisely, sustainably and equitably managed, goals that align strongly with AWA and our community of water professionals. The IWAA is recognised as a branch of AWA and assists the AWA in fulfilling its responsibilities as a Governing Member whilst collaborating ongoingly with the broader IWA. IWAA aims to deliver initiatives that support both IWA & AWA members here in Australia. Committee Chair: Dr Annalisa Contos Vice Chair: Dr Michael Storey Immediate Past Chair: Kathryn Silvester Committee Members: Chelsea Hayward Chris Philpot Cris Carvalho Dami ChandrasekeraDaniel DeereDarryl DayDr Kuruvilla Mathew Helen StrattonIvan ReolonJason Mingo Kathryn HeatonLorena OliveiraMark Lewis Forbes Matthew RedshawPatrick Schnelle Soner BekirTom Mollenkopf YWP Subcommittee Chair: Chelsea Hayward Vice Chair: Patrick Schnelle Committee members: Akshay Kashyap Annabel Biddulph Chris Lee Conan Peterson Elliot Cichero Elyssa Kirton Mal Perera Miranda Rey-FlemingPhillip Meng Rex Ho GET INVOLVED The IWAA committee meets regularly and facilitates multiple initiatives such as supporting Australian bids for IWA conferences, Ozwater presentations and other events such as IWA / AWA National Young Water Professionals conference, and connecting IWA specialist groups with AWA specialist networks. If you are an IWA member in Australia and would like to support IWAA initiatives please get in touch with our Member Engagement Manager (see below). We invite new nominations for the committee every two years. Only joint IWA and AWA members are eligible to nominate and vote. hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, 'ba0971d9-fc69-4b69-b58d-9b6cc2bbb154', {"useNewLoader":"true","region":"na1"}); hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, '4009a121-a767-4396-89f4-6d705d8b6f29', {"useNewLoader":"true","region":"na1"}); hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, '6c6ab61d-2c95-47d8-822c-a1d3fec4f307', {"useNewLoader":"true","region":"na1"}); BECOME AN IWA MEMBER As an AWA member, you enjoy an exclusive discount on IWA membership hbspt.cta._relativeUrls=true;hbspt.cta.load(14568786, '575b0c69-f5bb-4f91-986e-c61f06bfde36', {"useNewLoader":"true","region":"na1"}); ASK YOUR MEMBER ENGAGEMENT MANAGER Natasha Sharrocknsharrock@awa.asn.au02 9467 8423'''
