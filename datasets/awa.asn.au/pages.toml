["https://www.awa.asn.au/membership/corporate"]
title = "Membership for my organisation | Membership | AWA"
description = "Grow your business in new markets when you join Australia’s largest water professional network. Ask AWA."
full_description = "Home Membership Membership for my organisation MEMBERSHIP FOR MY ORGANISATION Grow your business in Australia’s largest water marketplace Support your business and the water professionals who make it happen with AWA membership for your organisation. Unlock new markets and partnerships, get and keep top water talent, and access exclusive industry insights and research as part of a network of 500+ corporate members. Professional membership benefits Included and discounted individual memberships to support your team’s professional development Research and education resources Awards and mentoring programs Exclusive event access 100+ water industry events each year Up to 40% event discounts for all your staff Ozwater and state/territory conference exhibits Grow with Careers in Water Post job and graduate vacancies Showcase your opportunities Search a talent pool of water professionals Corporate Membership Benefits Education Membership Benefits Join now Get in touch B2B CONNECTIONS AWA connects water businesses, organisations, suppliers, contractors, consultants, government agencies and regulators to new partnerships and opportunities. Raise your organisations profile by showcasing your water solutions skills through events, networking, and Australia’s biggest water digital marketplace. EXHIBITIONS DIGITAL MARKETPLACE PROFILING ADVERTISING WATER AWARDS Be recognised for water innovation and excellence Showcase your contribution to sustainable water management and community with our state and national water awards. Open to members, our annual water awards recognise organisational and individual excellence, innovation and expertise. Organisational Excellence Infrastructure Project Innovation R&D Excellence Water Industry Safety Excellence Customer Experience CHOOSE YOUR MEMBERSHIP LEVEL Principal Feature in the Digital Marketplace, unlock 40 professional memberships, and post unlimited job adverts on Careers in Water Jobs Board. Membership suits: Industry leaders and large utilities. Platinum Showcase your organisation across AWA channels, and access 20 professional memberships. Membership suits: Large national and multi-national organisations . Gold Book discounted Ozwater exhibition space and tickets, and unlock 5 professional memberships. Membership suits: State and Federal government agencies, niche consultants and contractors or suppliers. Silver Represent your organisation with 40% event and exhibition discounts, and 2 professional memberships. Membership suits: Local councils and smaller organisations. Bronze Access an extensive online resources hub, and 1 professional membership. Membership suits: Sole operators, entrepreneurs and SMEs. Education Join for event and exhibition discounts, industry insights, student access and international water programs. Membership suits: Leading universities and education providers (Partner), and education departments and smaller universities (Member) TRUSTED BY Ovarro Silver Corporate Member We have really appreciated the support from AWA in growing our international presence. Their inclusion of culture and language at country briefings, and hosting social gatherings at outbound events, demonstrates an understanding of the importance of building strong personal relationships, that are the foundation of long-term business relationships. :root { --swiper-theme-color: #8A8F99; } FREQUENTLY ASKED QUESTIONS When will my organisations membership start? Your annual corporate membership begins from when your membership subscription payment has been made and is valid for 12 months from that time. My organisation is thinking of joining as a corporate member. How do I know what level we should join at? There are a number of levels of corporate membership to suit the size and nature of your business. Our Member Engagement Managers can discuss your organisation’s needs and suggest the best level of membership. To be connected to a Member Engagement Manager use the contact us form or call our office on +61 2 94360055. Does my organisation need to be a member to exhibit at Ozwater or other National and State/Territory conferences? Some of the many benefits of becoming a Corporate Member relate to discounts on Exhibition space at our State, Territory and National Events. For Ozwater, you must be a Silver Corporate Member or above to access discounted exhibition rates and the loyalty program that rewards you for consecutive years of exhibiting. Contact our Senior Exhibition Manager using the contact us form or call our office on +61 2 94360055."
