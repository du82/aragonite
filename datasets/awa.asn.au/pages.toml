title = "Individual | Awards | AWA"
description = "State and national water awards recognising outstanding individual achievement. Nominate yourself, or colleagues and business partners driving a sustainable water future. Ask AWA."
full_description = "Home Awards Individual Member Awards INDIVIDUAL AWARDS Recognising water career excellence Open to AWA members, our state and national water awards recognise outstanding individual achievement. Nominate yourself, or colleagues and business partners driving a sustainable water future. CATEGORIES Young Water Professional of the Year Water Professional of the Year Lifetime Achievement Award Exceptional Service Award Kamal Fernando Mentoring Award (NSW only) Chris Davis AM Fellowship Conditions of Entry View Conditions of Entry Young Water Professional of the Year Overview The Young Water Professional of the Year Award honours individuals whose contribution to the water sector aligns with the Australian Water Association’s purpose of inspiring and driving a sustainable water future. The awardee will be able to demonstrate their leadership, influence and passion for the water sector. State and territory Young Water Professionals of the Year compete at the national awards. Eligibility This award is open to all Professional AWA Members and Employees of Corporate AWA Members who are 35 years of age or younger at the time of submission to their state or territory award. National Sponsor Thank you to Xylem for supporting the Young Water Professional award across the country and your commitment to recognising water achievements. Conditions of Entry Click for more info Submission Criteria Describe how you have through your primary professional role contributed to the water sector? (500 words) Describe how you are promoting and inspiring a sustainable water future outside of your primary professional role, e.g. through roles you have volunteered for within your organisation or extra-curricular activities (500 words) Describe, providing examples, how the nominee is considered a water industry advocate and has displayed a commitment to outreach in terms of either cross-sectoral or community water awareness (500 words) Closing Dates Nominations for the 2025 season are closed. Nominations for the 2026 season will open in June 2025. Water Professional of the Year Overview The Water Professional of the Year honours individuals who, over the previous 5 years, have displayed passion and commitment, while also inspiring positive change in the water sector. The intention of this award is to celebrate the outstanding achievements of Water Professionals over 35 years of age. State and territory Water Professionals of the Year compete at the national awards. NOTE: Australian Water Association members who, through long and meritorious service, have made positive and demonstrable contribution to the Australian water sector should consider contacting their Member Engagement Manager for consideration of the Lifetime Achievement Award via the branch committee instead of the Water Professional of the Year Award. Eligibility This award is open to all Professional AWA Members and Employees of Corporate AWA Members. Conditions of Entry Click here for more info Submission Criteria Executive summary as to why the nominee should be awarded the Water Professional of the Year (250 words) Describe how the nominee has contributed professionally to the advancement of the sector over the past 5 years. This may be from a technical, policy or management perspective (500 words) Describe how the nominee’s leadership has positively supported a sustainable water future and inspired change in their organisation, the industry, the environment and/or society over the past 5 years, including though volunteer, secondary or extra-curricular roles (500 words) Describe how the nominee has supported diversity, inclusion and equality including inspiring leadership and capacity in others over the past 5 years (500 words) Describe, providing examples, how the nominee is recognised as a water industry advocate and has displayed a commitment to outreach in terms of either cross-sectoral or community water awareness over the past 5 years (500 words) Closing Dates Nominations for the 2025 season are closed. Nominations for the 2026 season will open in June 2025. Lifetime Achievement Award Overview The Lifetime Achievement Award is given to honour members of the Australian Water Association who have made positive and demonstrable contribution to water in Australia. The award recognises members who have: Displayed an exemplary personal and professional contribution in their field Provided leadership and influence amongst colleagues and peers Raised the profile of water careers Been held in high esteem for mentoring junior water professionals Fostered diversity, inclusion and equality Raised community water awareness Conditions of Entry Click for more info Eligibility Australian Water Association members with a minimum of 15 years membership (can be non-continuous) Nominations can only be made by an AWA Branch Committee, two or more Board members, or members of an Australian Water Association Specialist Network Committee Closing Date 28 February 2025 Please contact your Member Engagement Manager to nominate a member for this award. Exceptional Service Award Overview The Exceptional Service award is the Australian Water Association’s highest individual honour. It is awarded in recognition of long and meritorious service, and a positive and demonstrable contribution to the Association. Award Patron George Goffin worked tirelessly for AWA for many years. He was a Victorian branch committee member and president in the 1950s, before becoming National President in the 1970s for two successive terms. George was editor of the Water Journal for over twenty years. The award recognises someone who has shown:​ Exceptional service and active personal input to the Association (through a technical contribution or sustained administrative, organisational or leadership activity) ​ Valuable contribution towards AWA’s strategic objectives ​ The service of the individual has resulted in positive (and demonstrable) changes in AWA ​ A demonstrated commitment to be an AWA advocate and build the profile of the Association​ Conditions of Entry Click for more info Eligibility Australian Water Association members with a minimum of 15 years membership Nominations can only be made by an Australian Water Association Branch Committee, two or more Board members, or members of an AWA Specialist Network Committee Closing Date 28 February 2025 Please contact your Member Engagement Manager to nominate a member for this award. Kamal Fernando Mentoring Award (NSW only) Overview The Kamal Fernando Mentoring Award honours individuals in NSW working with water who have displayed outstanding passion and commitment in mentoring water professionals above and beyond expectations. The award is the legacy of our friend and colleague Kamal Fernando (former Principal Engineer of Water Supply, NSW Water Solutions, NSW Public Works) who sadly passed away unexpectedly in 2014. Over 24 years, Kamal made significant contributions to water in NSW. Kamal had a passion for mentoring, and the transfer of his outstanding skills and knowledge has led to many skilled practitioners. Through their work, his contribution continues. The award encourages and recognises excellence in water mentoring – a fitting tribute to Kamal’s tireless and generous efforts to share his knowledge. Eligibility This award is open to all Professional AWA Members and Employees of Corporate AWA Members who has predominately resided and mentored in NSW for at least the last five years. Conditions of Entry Click for more info Submission Criteria Demonstrates a long-term commitment to mentoring members and acts as a positive role model, developing trust and respect with the mentee Assists with a plan to guide the mentee’s future career path, including defining the purpose of the mentoring and the development of any career goals Facilitates the process of a mentee in acquiring the skills and resources needed to succeed as a professional who is making a significant contribution to the water industry. This may include developing focus areas such as improving effective communication, dealing with workplace challenges, organising work/life balance, increasing self confidence and gaining leadership skills Acts as a sounding board and advisor to mentees to improve networks, remove barriers to career development, navigate difficult situations in the workplace such as managing conflict, and addressing social inclusion barriers such as diversity and equity. Closing Date Nominations for the 2025 season are closed. Nominations for the 2026 season will open in June 2025. FREQUENTLY ASKED QUESTIONS Why enter? Showcase your water achievements and innovations Share water knowledge Connect with water peers Inspire sustainable water practices Promote your water career and leadership Who is eligible to enter? All Awards, aside from the Student Water Prize and Australian Stockholm Junior Water Prize, are open to AWA members only. For individual awards, the nominee must be a current individual AWA Member or an employee of a current Corporate Member. To enter, nominations must be submitted using the online entry forms. Please note when your relevant State or Territory award submissions close Can I nominate myself? Yes, self-nominations are accepted. How do I submit my nomination? All nominations must be submitted via the online nomination form. Please check the relevant award category page to view the requirements to complete the nomination form. How are the applications assessed? State judging is coordinated by the relevant Member Engagement Manager and committee. Each state convenes a panel of experts to assess the applications. National judging is coordinated by the National Awards Manager. The panels of experts are approved by the Honours & Awards Sub-committee of the Board to take part in the judging. Each panel includes at least three judges and is chaired by an AWA Board Director. At both state and national levels, judges score each nominee based on how well they address the award criteria. The panel then meets to review the scoring and discuss the merits of all submissions. Final scoring and ranking is based on a majority vote from all eligible members of the judging panel. All judges adhere to a code of conduct which includes a policy to prevent conflicts of interest. The judges’ decision is final and no discussion about the merits of entries will be entered into with nominees. Will AWA pay for me to attend the Awards Ceremony or the Ozwater Conference? AWA will not cover the costs of your travel, accommodation or attendance at the Ozwater Conference unless specifically stipulated as part of the prize (i.e. Student Water Prize). A complimentary Ozwater Gala Dinner ticket will be provided to national finalists who choose to sit on the reserved award tables."
