title = "Interview: Harvey Guillén Explores Guillermo's Journey and Identity in 'What We Do In the Shadows'... plus Some TV Topics - Awards Radar"
description = """
Steven Prusakowski has been a cinephile as far back as he can remember, literally. At the age of ten, while other kids his age were sleeping, he was up into the late hours of the night watching the Oscars. Since then, his passion for film, television, and awards has only grown. For over a decade he has reviewed and written about entertainment through publications including Awards Circuit and Screen Radar. He has conducted interviews with some of the best in the business - learning more about them, their projects and their crafts. He is a graduate of the RIT film program. You can find him on Twitter and Letterboxd as @FilmSnork – we don’t know why the name, but he seems to be sticking to it.
Email: filmsnork@gmail.com"""
full_description = '''Awards Season / Oscar Predictions Update: It’s Final Predictions Time as the Academy Gets Set for the Big Show on Sunday Awards Radar Podcast #229: Joey and Myles Share Their Final Oscar Predictions While Discussing What Might Happen on Sunday Night! in Interviews, Podcast, TV Interview: Harvey Guillén Explores Guillermo’s Journey and Identity in ‘What We Do In the Shadows’… plus Some TV Topics by Steven Prusakowski June 21, 2024, 10:44 am When season one of What We Do In The Shadows began, it would probably be described as a series about four vampires in Staten Island and their familiar Guilllermo (played by Harvey Guillén). For those who do not know, a familiar is a human who pledged themselves to serve the needs of a vampire. Fast forward to now and the dynamic has shifted a bit. Perhaps now people would describe is as a series about a familiar and the four vampires he serves. Guillén’s character has expanded vastly over the last five seasons and really serves as the heart of the series.Maybe this is because Guillermo is the only human or better yet, this may be due to all that Guillén brings to the character, a relatability especially for anyone who has felt unseen. The character gives us someone to root for because audiences can connect with him and his tribulations as he pursues not only the quest of becoming a vampire, but also to be more respected among his vampire counterparts. It does not take long to witness Guillén’s knack for comedy, his expressive looks and dead pan deliver provide some of the series’ biggest laugh, which is saying a lot in a series that is packed full of humor.Guillén sat with Awards Radar on the TV Topics podcast to discuss his work on the series and some of his television viewing history. As the series wraps its final episodes, Guillén reflects on his journey from the start of What We Do In the Shadows to its conclusion, including the last day of shooting. In addition the actor provides some insight as to where his comedy instincts originated, his chemistry with Kayvan Novak (Nandor), doing his own stunts, talking about his favorite television and much, much more. To hear it all listen for episode 17 of TV Topics (below). Some excerpts from the above conversation: On the TV show that he most connected with growing up: I remember watching reruns as well with my dad of Cantinflas which was a kind of like the male equivalent of I Love Lucy in black and white very farcical physical comedy. I tend to be very expressive and I can’t hide what I’m thinking – my face can’t hide it. So, you know all those mannerisms and facial expressions are just me trying to not try to show what I’m really thinking, but I’m definitely showing.I think that Lucille Ball, watching her and how it’s an art, you know, how to convey something without words and for the first part of the show Guillermo didn’t talk a lot in season one. He didn’t say much, Guillermo was a familiar, he was there as a right-hand man to Nandor. He was almost like an ornament and the story moved along without him saying much words. He said it with his face and so I think that’s that goes a long way, you know, like trying to tell a story where you don’t need subtitles, you don’t need any translation. You don’t even need words, the face can tell a whole story just by showing what you’re thinking. “WHAT WE DO IN THE SHADOWS” — “Local News” — Season 5, Episode 5 (Airs August 3) — Pictured (L-R): Kayvan Novak as Nandor, Harvey Guillén as Guillermo. CR: Russ Martin/ FX On his warm welcome to the set. It’s so funny because when I first met Natasia Demetriou, the first thing she said to me was not ‘Hello,’ the first thing she said was like ‘I’m Natasia, my brother was up for the part, I don’t know what you did, but you got it.” I don’t know that would be like, it’s be a different take on Guillermo if Jamie Demetriou did it, but that he was on hold for the role and it was just funny that the very last minute the very last minute I came in and kind of a swooped in and showed what I could do, and here we are. How did your casting changed the you know, the trajectory of Guillermo?Yeah I think there was always a sense that Guillermo, the relationship between him and Nandor was what kind of relationship is this a love relationship and can you be in love with the same-sex, you know? Employee and employer and is that healthy and is it sexual or is it? Admiration is it from afar, so early on I was very careful about the way that I play Guillermo. It’s not to feel like it was like he had admiration for his master and boss and whatnot, but it didn’t have to feel like it was crossing the line of love even though the fans really love that I needed to walk on that tightrope, because it’s still a workplace. At that point Guillermo was not talking about sexuality because like he quoted ‘he doesn’t kiss and tell because he doesn’t you know kiss.’ These vampires are very sexual they have multiple partners same-sex partners. They’re all queer all of the vampires, the energy vampire included, are all queer and so we’re a very queer show without it being known as being a queer show because it’s like it’s normalized. It’s like they’re just vampires. They do what they want.But it’s also like if the human, which is Guillermo, never talks about sexuality and when he finally does it takes a while for him to kind of come into his own and remember when people come out. They don’t really come out. It’s not the word coming out. It sounds so funny. It’s like you don’t wake up one day and say I’m queer. I’m gay. I’m gonna go tell everybody people who are queer know that they’re queer. They’re not coming out. The phrase should be changed to ‘letting you in.’ When they tell you who they are, they’re letting you in, they’re welcoming you into their home. They’re opening the door and saying hey, I want you to take a look. This is it. This is my home. This is my wallpaper. This is the furniture. This is a painting. Please don’t destroy my home. I’m vulnerable and letting you into my home. Please wipe your feet before you come in. “WHAT WE DO IN THE SHADOWS” — “Exit Interview” — Season 5, Episode 10 (Airs August 31) — Pictured (L-R): Kayvan Novak as Nandor, Harvey Guillén as Guillermo. CR: Russ Martin/FX How tough was it to say goodbye? How tough was that last day of shooting? So we wrapped on May 2nd, which is Matt Berry‘s birthday and so they have this big cake for Matt and whatnot. It was emotional. We were drinking champagne and crying – and at midnight, my birthday’s May 3rd. So at midnight someone said ‘oh, it’s your birthday.’ And I just completely was like wow, closing of a chapter and then starting of a new year around the Sun. It’s kind of this weird, cathartic way of letting go like, ‘Oh man! That’s so many years of my life in this set with these people so emotional but life is going on like we started a new birthday year. Which is nice to celebrate. I’m always grateful if it’s my birthday. I love working on my birthday because if I can work on my birthday and I have family and friends visit or if you know if I’m on set everything I love is tangible within five feet. So if it’s my birthday and I can see everyone that I love to work with see my family give them a hug and I’m working I’m doing what I love everything you love is within five feet. The first five full seasons of What We Do In the Shadows are now streaming on Hulu. Season six, the final season, is slated for a late 2024 premiere. You also listen to TV Topics where guests include Rose Byrne, Anna Sawai, Rhys Darby, Christina Ricci and more on Apple Podcasts or where ever you listen to your favorite podcasts. Share this:TwitterFacebookLike this:Like Loading... Related Comments Our site Facebook Subscribe Notify of new follow-up comments new replies to my comments Label {} [+] Name Email Website Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); Label {} [+] Name Email Website Δdocument.g