full_description = '''Awards Season / Oscar Predictions Update: It’s Final Predictions Time as the Academy Gets Set for the Big Show on Sunday Awards Radar Podcast #229: Joey and Myles Share Their Final Oscar Predictions While Discussing What Might Happen on Sunday Night! Marvel Studios in Editor, Reviews Film Review: ‘Captain America: Brave New World’ is the First Marvel Effort Not Worthy of the Big Screen by Joey Magidson February 12, 2025, 12:00 pm 33 Comments Marvel Studios At least on the big screen, I’m an easy mark for Marvel. With maybe two exceptions, I always find a Marvel Cinematic Universe effort to be at least decent. So, for me to leave Captain America: Brave New World with a distinct sense that what I just watched wasn’t worthy of being a film…that says something. I’ve fallen off on the television shows, while still defending the MCU. This movie, unfortunately, makes me see a lot of the points that detractors have been making. Captain America: Brave New World exists mostly to put a cap on loose ends left from Eternals and even The Incredible Hulk. If that has you scratching your head, well, you’re not alone. If this was the second season of The Falcon and the Winter Soldier, with some more focus on the political thriller aspects, Marvel might have been on to something. As a less than two hour flick, meant to be a blockbuster? It falls short of the mark. Marvel Studios Thaddeus “Thunderbolt” Ross (Harrison Ford) has just been elected President of the United States. Key to his first 100 days in office is a treaty with other major nations to share the precious resource found within the Celestial body sitting in the Indian Ocean after the events of Eternals. The element, known as adamantium, is meant to be more powerful than vibranium, as well as be shared by more nations than just Wakanda. Recognizing the need for Captain America, he summons Sam Wilson (Anthony Mackie), after a successful mission to recover a stolen sample of the element, to the White House during an event in support of the treaty, in the hopes that he can re-assemble The Avengers. Sam brings his right hand man in Joaquin Torres (Danny Ramirez), as well as Isaiah Bradley (Carl Lumbly). During the event, several Secret Service agents, as well as Isaiah, appear under mind control, attempting to assassinate Ross. Ross wants to keep the treaty alive at any cost, while Sam suspects that someone is trying to sabotage it, framing Isaiah. As Sam investigates the incident in the hopes of clearing Isaiah’s name, he runs into Sidewinder (Giancarlo Esposito) of the Serpent Society, as well as a shadowy figure who’s manipulating the entire situation. Who this person is, what they want, and how it leads to Ross eventually turning into Red Hulk (not a spoiler, as the marketing has made the appearance clear), I’ll leave for you to discover. Marvel Studios Anthony Mackie settles into the role of Captain America in such a way that you’re not spending the movie missing Chris Evans, which is a definite plus. Mackie hasn’t been showcased by Marvel like this before and he makes the most of it. On the other hand, Harrison Ford, while solid as Thaddeus Ross, never fully feels comfortable in the role. His grumbling fits during the political scenes, though when he has to do anything relating to CGI, he’s off the reservation. It could have been worse, to be sure, yet an actor of his caliber should have brought more to the part. Danny Ramirez doesn’t have a ton to do but brings a ton of charisma to the, at least for now, mostly thankless role. Giancarlo Esposito is wasted, while the likes of Carl Lumbly are afterthoughts. Supporting players include Shira Haas, Tim Blake Nelson, Xosha Roquemore, Liv Tyler, and more. Julius Onah directs a script that feels like about two dozen people wrote it. In reality, it’s just Rob Edwards, Peter Glanz, Dalan Musson, Onah, and Malcolm Spellman, with Edwards, Musson, and Spellman getting Story By credits as well. It’s a mess, too. Esposito’s character, added in reshoots, feels it, with every scene he appears in feeling tacked on. Focus keeps getting pulled in several directions, never fully landing on what the film should be. When the movie is trying to be a poor man’s Captain America: The Winter Soldier, it’s mostly decent. Sadly, the action sequences are all bland and even boring. Plus, the entire villain element of the flick falls flat. Moreover, this movie ends with its worst scenes, which is a rough way to go out. Captain America: Brave New World is, at times, boring, and that’s bad for the MCU. When it’s a pseudo sequel to The Incredible Hulk or addressing a major Eternals issue, it feels like the universe is cleaning up in anticipation of what’s to come. It’s otherwise self-contained, which isn’t bad to see, but it feels like scattershot execution, which is not fun. Hopefully Marvel is about to right the ship, because if they threaten to lose me, they’re going to be in trouble with the casual fan. SCORE: ★★1/2 Share this:TwitterFacebookLike this:Like Loading... Related Comments Our site 33 Facebook Subscribe Notify of new follow-up comments new replies to my comments Label {} [+] Name Email Website Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); Label {} [+] Name Email Website Δdocument.getElementById( "ak_js_2" ).setAttribute( "value", ( new Date() ).getTime() ); 33 Comments Inline Feedbacks View all comments Mike 16 days ago Obviously the reviewer has never seen The Marvel’s or Madame Web. Loading... 0 Reply Author Joey Magidson 16 days ago Reply to Mike I’ve seen both, obviously you didn’t check, and I prefer The Marvels. Loading... -1 Reply Anonymous 16 days ago I am a Mavel fan myself, however any movie that supports Isreal and by default the genocide they are committing, should be a flop at the theaters, in fact it should be completely boycotted. The mossaud agent role, even though it was drastically reduced from the original script, only supports the alleged legitimacy of a genocidal government. Loading... -9 Reply Anonymous 16 days ago Reply to Anonymous That is a completely ridiculous opinion. Loading... 7 Reply Author Joey Magidson 16 days ago Reply to Anonymous You clearly didn’t see the film, since there’s not actually a mossaud agent in it. So, yeah… Loading... 2 Reply Alejandro 16 days ago Reply to Anonymous I didn’t want to see it until I heard your complaint. Remind me quickly who invaded who on Oct. 7 and massacred women and children? Look up, is that a drone?* *I’m invoking politics that have nothing to do with a Marvel movie to get a reaction out of people. It’s sad, really. Loading... 1 Reply Author Joey Magidson 16 days ago Reply to Alejandro Completely irrelevant to this film, FYI Loading... 0 Reply Anonymous 16 days ago Reply to Anonymous Of course you want to remain anonymous…you’re a terrorist loving anti semite.* *My comment is ignorant and uncalled for. Loading... 1 Reply Author Joey Magidson 16 days ago Reply to Anonymous Keep in mind, you’re anonymous too, so pot meet kettle, regardless of who is right or wrong here. Loading... 0 Reply Anonymous 16 days ago Reply to Anonymous That’s why you guy’s are getting destroyed* *My comment is hateful and ignorant and if I realized what I was saying, I’d be ashamed and apologize, but I don’t, so this is doing it for me Loading... 0 Reply Anonymous 16 days ago Reply to Anonymous Charming story! Loading... 0 Reply Anonymous 12 days ago Reply to Anonymous Wakanda is one of the greatest nations on planet Earth! Loading... 0 Reply Author Joey Magidson 12 days ago Reply to Anonymous Not sure how that applies here… Loading... 0 Reply Fyourfeelings 11 days ago Reply to Anonymous Cut Loading... 0 Reply Anonymous 16 days ago *^Not the Only First Effort.. . Loading... 0 Reply Author Joey Magidson 16 days ago Reply to Anonymous Not a grammatically correct statement… Loading... 1 Reply Dave Raw 16 days ago Cut it out. I’ve seen the trailers. I was astonished by them. Y’all are hating and I don’t understand how y’all wanna do Anthony Mackie like that. He is comic book accurate as much as he can be and I’m proud for our culture that he is able to step into that role with the co-sign from Chris Evans. I don’t give a damn about the plot twist. This is historic. Loading... 0 Reply Author Joey Magidson 16 days ago Reply to Dave Raw He’s definitely the best part of a movie I wish I’d enjoyed more, given how much I usually enjoy a Marvel movie Loading... 0 Reply Silvia 16 days ago Reply to Dave Raw Nobody said anything against Anthony Mackie where are you getting this from? Loading... -1 Reply Robby 16 days ago Thanks for the review! I wish it could’ve been better. Not hating, I really wanted this movie to be great. I’m still going to go see it! Gotta form my own opinion, after all, but I appreciate the heads up before going in (I skimmed most of the story part you wrote to avoid spoilers). The only thing I didn’t like about the article was the font! Thanks for being so diligent and detailed with your review! Loading... 0 Reply Author Joey Magidson 16 days ago Reply to Robby Welcome. And 100%, see it and make up your own mind! Loading... 0 Reply Silvia 16 days ago Having Bucky Barnes with cap America would have saved the movie. Their chemistry is so great and they are so good together. I also miss Chris Evans. He will always be “cap” to me. I knew this movie would fall short. I’m hoping Thunderbolts and doomsday will be worth waiting for! Loading... 0 Reply Silvia 16 days ago People can we please have one freaking discussion without having politics thrown at us…chill it’s a movie. Loading... 0 Reply Robert Hamer 8 days ago Reply to Silvia This feels like an… unreasonable demand, in relation to, arguably, the most overtly political franchise of the Marvel Cinematic Universe. Loading... 0 Reply Anonymous 16 days ago From my perspective, it just seems like Marvel had a good pipeline of talent that simply dried up. There were a few releases after endgame that were good, but it just seems like the creative juices aren’t flowing at near the same volume. The movies that are Good, people will show for. It’s just the marginal movies that won’t live up to expectation… Why drop $50 for 2 disappointments? That’s a decent dinner for 2. Loading... 0 Reply Author Joey Magidson 16 days ago Reply to Anonymous There’s something to that. The build up and execution of Endgame was so well done, it was going to be hard to recapture. So far, it’s been a mixed bag Loading... 0 Reply Anonymous 16 days ago I can assure, they will double down, between Mackies comments and the movie itself, it’s pretty clear they got the message and they do not care they are gunna indoctrinate you even of it kills Disney. Loading... 0 Reply Author Joey Magidson 16 days ago Reply to Anonymous I’m baffled about what message/indoctrination you think this movie is trying to take part in? That it’s bad to turn into a Hulk? If so, I do think that’s something we can all get behind… Loading... 0 Reply Anonymous 16 days ago Only an IDIOT would think The Marvels was good🤦 Loading... 0 Reply Author Joey Magidson 16 days ago Reply to Anonymous But someone who decides to leave an anonymous insult on a website is…what? Loading... 0 Reply Iwipemyazzcrackonmyracism 15 days ago I will go see this tomorrow. This is a thread for discussion about a Marvel movie. Lest we forget… Loading... 0 Reply Snax 15 days ago The first!? GOOD ONE! Loading... 0 Reply Author Joey Magidson 13 days ago Reply to Snax Yes, the first. Loading... 0 Reply Loading… 0 Anthony MackieCaptain America: Brave New WorldDanny RamirezGiancarlo EspositoHarrison FordJulius OnahShira Haas Written by Joey Magidson See more Previous article VES Awards Led By ‘Dune: Part Two’ and ‘Kingdom of the Planet of the Apes’ Next article New Trailer for ‘How to Train Your Dragon’ Teases an Animated Classic Reimagined for Live-Action googletag.cmd.push(function() { googletag.display('div-gpt-ad-1612294741077-0'); }); MORE INTERVIEWS Take a Look at Sean Baker’s 30 Year Journey to Making ‘Anora’ Exclusive: Take a Look at the ‘Deadpool & Wolverine’ Sound Show Interview: Laura Dern and Jayme Lemons Talk About Making ‘Palm Royale’ a Family Affair With Bruce Dern Interview: Mark Duplass Returns to Discuss ‘The Morning Show’ and How This is the Perfect Role for Him Interview: ‘Rick and Morty’ Writer Heather Anne Campbell Discusses the Creative Process, the ‘Get Played’ Podcast, and More Our 2024 Emmys FYC in DRAMA Categories & Predictions Our 2024 Emmys FYC in COMEDY Categories & Predictions Interview: Molly Gordon Discusses Joining ‘The Bear’ and More PREDICTIONS ALL PREDICTIONS googletag.cmd.push(function() { googletag.display('div-gpt-ad-1612284623498-0'); }); Newsletter(function() { window.mc4wp = window.mc4wp || { listeners: [], forms: { on: function(evt, cb) { window.mc4wp.listeners.push( { event : evt, callback: cb } ); } } } })(); SUBSCRIBE TO ALWAYS BE ON OUR RADAR Email address Leave this field empty if you're human: Don't worry, we don't spam'''
