full_description = '''Awards Season / Oscar Predictions Update: It’s Final Predictions Time as the Academy Gets Set for the Big Show on Sunday Awards Radar Podcast #229: Joey and Myles Share Their Final Oscar Predictions While Discussing What Might Happen on Sunday Night! (L-R): Alexei Shostakov/Red Guardian (David Harbour), Ghost (Hannah John-Kamen), Bucky Barnes (Sebastian Stan), Yelena Belova (Florence Pugh), and John Walker (Wyatt Russell) in Marvel Studios' THUNDERBOLTS*. Photo courtesy of Marvel Studios. © 2024 MARVEL. in News, Trailers, TV A Roundup of Super Bowl Spots and Trailers by Maxance Vincent February 10, 2025, 12:01 am The Super Bowl is upon us, which means a plethora of trailers and television spots are being released as we speak! Check them all out below, and let us know which movie you’re looking forward to watch the most! A brand-new spot for F1 was released. Directed by Joseph Kosinski with a screenplay written by Ehren Kruger, the movie will star Brad Pitt, Damson Idris, Kerry Condon, Tobias Menzies, and Javier Bardem. Watch the spot below and see the movie in cinemas on June 27: After a trailer premiere this week, Jurassic World Rebirth now has a Big Game Spot. Directed by Gareth Edwards and written by David Koepp, the latest installment in the Jurassic Park franchise stars Scarlett Johansson, Jonathan Bailey, Mahershala Ali, and Rupert Friend. It will be released on July 2. Watch the spot below: After years of production, Mission: Impossible – The Final Reckoning is finally coming soon. Written and directed by Christopher McQuarrie, and co-written by Erik Jendresen, the final installment in the Mission: Impossible franchise will star Tom Cruise, Hayley Atwell, Ving Rhames, Simon Pegg, Vanessa Kirby, Esai Morales, Pom Klementieff, Henry Czerny, Janet McTeer, Angela Bassett, Holt McCallany, Hannah Waddingham, and Nick Offerman. Watch the spot below and see the movie in cinemas this May: We also had a football-themed spot for the upcoming Dean Fleischer Camp-directed Lilo & Stitch remake. Written by Chris Kekaniokalani Bright and Mike Van Waes, the movie stars Maia Kealoha, Chris Sanders, Sydney Agudong, Zach Galifianakis, Billy Magnussen, Tia Carrere, Courtney B. Vance, Hannah Waddingham, and Jason Scott Lee. Watch it below and see the movie in theatres on May 23: Speaking of Lilo & Stitch, the original movie’s co-director Dean DeBlois is bringing to life Cressida Cowell‘s How to Train Your Dragon in live-action! Starring Mason Thames, Gerard Butler, Nico Parker, Nick Frost, and Julian Dennison, the remake will be released in theatres on June 13. Watch the big game spot below: Finally, a full-length trailer was released for Thunderbolts*. Directed by Jake Schreier and written by Eric Pearson, Lee Sung Jin, and Joanna Calo, the film stars Florence Pugh, David Harbour, Sebastian Stan, Wyatt Russell, Olga Kurylenko, Hannah John-Kamen, Lewis Pullman, Geraldine Viswanathan, Wendell Pierce, and Julia Louis-Dreyfus. With the trailer release, Marvel also broke the news that Academy Award-nominated composers Rafiq Bhatia, Ian Chang, and Ryan Lott, also known as Son Lux, will be composing the score for the movie! Watch the new trailer below and see Thunderbolts* in theatres on May 2: Share this:TwitterFacebookLike this:Like Loading... Related Comments Our site Facebook Subscribe Notify of new follow-up comments new replies to my comments Label {} [+] Name Email Website Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); Label {} [+] Name Email Website Δdocument.getElementById( "ak_js_2" ).setAttribute( "value", ( new Date() ).getTime() ); 0 Comments Inline Feedbacks View all comments Loading… 0 filmNewssuper bowltrailers Written by Maxance Vincent Maxance Vincent is a freelance film and TV critic, and a recent graduate of a BFA in Film Studies at the Université de Montréal. He is currently finishing a specialization in Video Game Studies, focusing on the psychological effects re