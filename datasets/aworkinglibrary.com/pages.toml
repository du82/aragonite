description = "A working library is a blog about work, reading & technology by Mandy Brown."
full_description = "2024-09-04 Lifehouse Adam Greenfield Adam Greenfield proposes a strategy for surviving the climate crisis: Lifehouses, or a network of places of care, mutual aid, resource distribution, and solidarity. 2024-07-20 The Soul’s Code James Hillman Jungian psychoanalyst James Hillman posits that we are each accompanied by what he variously calls our “acorn,” “daimon,” or “angel”—that mystical being who both protects us and insists on driving us toward our soul’s calling. 2024-07-16 The Wall Marlen Haushofer On holiday in a hunting lodge in the Austrian mountains, a middle-aged woman wakes up to find that an invisible wall has descended all around her. 2024-06-21 The Other Side of Empathy Jade E. Davis “Empathy is an illusion at best, or simply—as is said in moments of deep reflection—bullshit!” 2024-06-08 Everything for Everyone M.E. O’Brien & Eman Abdelhadi On May 6, 2052, a sex worker named Miss Kelley joined with her neighbors in Hunts Point to take over a produce market and distribute the food to those in need. 2024-05-29 How Infrastructure Works Deb Chachra Good infrastructure is thankless. You only notice it when it fails. 2024-04-30 Witches, Witch-Hunting, and Women Silvia Federici Following the threads from the witch hunts in the sixteenth and seventeenth centuries to present-day gendered violence, Silvia Federici shows how—then as now—such oppression is not only a tool of capitalism but a critical component of it. 2024-04-25 Against the Grain James C. Scott Like another book with the same name, James C. Scott’s Against the Grain argues that the “just so” story of humans’ progression from barbarians to civilized agriculturalists is not the success story we might have thought. 2024-04-22 Dry Land B. Pladek In the woods of Wisconsin, a young forester named Rand Brandt learns that he can grow any plant he imagines in minutes, merely by touching the dirt."
