["https://aworkinglibrary.com/writing/grow-down"]
title = "Grow down | A Working Library"
description = "Psychologist James Hillman borrows from Plato and others and posits that we are each accompanied by a mystical, nonhuman being which accompanies us throughout our lives and through a series of whis..."
full_description = "2024-07-20 Grow down A Reading Note The “acorn theory,” proposed by psychoanalyst James Hillman, says that we are each accompanied by a mystical being which—through a series of whispers, nudges, accidents, silent exhortations, and mysterious excitements—directs us towards our purpose. As with any story, and with myths in particular, I’m interested in how this one works, how it acts upon the world. And one thing I notice is that, while the acorn theory has no answer to the age old question of the purpose of life, it positions each of us as obligated to seek out and move toward that purpose, as being called to do so. To ignore that calling is to invite distress, unease, even illness; while to pursue it is no guarantee of comfort. But the obligation remains. Contemplating our calling as an acorn also proposes a different way of thinking about what it means to “grow” in our skills and power: To be an adult is to be grown-up. Yet this is merely one way of speaking of maturity, and a heroic one at that. For even tomato plants and the tallest trees send down roots as they rise toward the light. Hillman, The Soul’s Code, page 41 That is, we grow not only up—not only skyward—but down, into the roots, back to that from which we came and to which we will, one day, return. We become, in time, more rooted and resilient, more capable of surviving the storm, less easily shaken away from ourselves by idle wind or rain. When I think about growing down instead of up, I think about becoming centered, about knowing what work is ours to do (and, critically, what work is not), about a slow, steady power rather than a rash and inconstant one. After all, as anyone who’s ever lived among city trees can tell you, neither brick nor concrete nor iron can stop a root as it seeks out water. We should be as steady in our search for that which nurtures our own lives. The Soul’s Code James Hillman Jungian psychoanalyst James Hillman posits that we are each accompanied by what he variously calls our “acorn,” “daimon,” or “angel”—that mystical being who both protects us and insists on driving us toward our soul’s calling."
