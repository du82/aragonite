["https://aworkinglibrary.com/about"]
title = "About | A Working Library"
full_description = "About I am a reader, writer, and work coach focused on helping people do their best work. In all my work, I read stories—whether written or spoken aloud—and seek to understand how they work, what holds them together, what they reveal about the world we live in, and where they point the way to new and better worlds. In past lives, I grew and led multi-disciplinary teams, including as CEO of Editorially and as VP of Product at Vox Media. As co-founder and former editor-in-chief of A Book Apart, I changed the way designers, developers, researchers and others work together with the publication of groundbreaking books about responsive web design, content strategy, and more. Begun in 2008, A Working Library is a project to explore the intersections of reading, technology, and the nature of work. The phrase “working library” usually refers to a collection of texts on a given subject; here, the collection is open-ended and the subjects are many and varied. As a generalist, I delight in making connections across disciplines, and in bringing together different ways of seeing and thinking. With adrienne maree brown, I read visionary science fiction and fantasy as a way of practicing the future. With Le Guin and Borges, I read all prose as fiction. And with Ursula Franklin, I believe technology is a practice—and that it is through practice that we learn and change. I live in Lenapehoking—aka Philadelphia—with my partner, the filmmaker Keith Ehrlich."
