["https://aworkinglibrary.com/collections/canon"]
title = "Books in the canon | A Working Library"
full_description = "Everything for Everyone M.E. O’Brien & Eman Abdelhadi On May 6, 2052, a sex worker named Miss Kelley joined with her neighbors in Hunts Point to take over a produce market and distribute the food to those in need. Caliban and the Witch Silvia Federici Silvia Federici, one of the creators of the wages for housework movement, digs in to the transition to capitalism and locates a critical and under-investigated element: the witch hunts. Mutual Aid Peter Kropotkin Kropotkin’s thesis is that it is mutual aid, cooperation, and solidarity—rather than competition—that permit evolution and survival among the species, both humans and more-than-humans. Nona the Ninth Tamsyn Muir In the third book of the Locked Tomb series, Nona lives with her friends Camilla, Palamedes, and Pyrrha in a cramped apartment in a tall building in a city menaced by a great hulking creature in the sky. Tao Te Ching Lao Tzu & Ursula K. Le Guin Turning to these poems at the end of many a dark day has felt like holding the gift of a small, fierce light. The Problem with Work Kathi Weeks A provocative and irresistable argument that the need to “work for a living” is not a natural order but rather an invention—and one that can change. Down Girl Kate Manne Kate Manne’s core premise is this: sexism is a set of beliefs that positions women as inferior to men, while misogyny is the system that enforces and polices women’s subordination. Staying with the Trouble Donna Haraway “Staying with the trouble does not require such a relationship to times called the future,” declares Donna Haraway in the opening paragraph of this astonishing book. Harrow the Ninth Tamsyn Muir In this sequel to the completely badass Gideon the Ninth, Harrow has become an immortal lyctor by consuming Gideon’s soul. Or has she? Emergent Strategy adrienne maree brown “I read sci-fi and visionary fiction as political, sacred, and philosophical text, and I engage with others who read it that way,” writes adrienne maree brown, in this astonishing, radical, and humane book."
