full_description = "2024-04-10 Being Wrong Kathryn Schulz Kathryn Schulz posits a vision of wrongness as both the inevitable human condition and a generative source from which creativity, art, brilliance, risk-taking, and so much more arises. 2024-03-26 A Half-Built Garden Ruthanna Emrys Judy Wallach-Stevens is woken one night to a warning about pollutants in the nearby Chesapeake Bay. With her wife and newborn in tow, she heads out to see what’s up—and ends up making first contact with a group of friendly aliens. 2024-03-23 The World of Silence Max Picard “Silence is not simply what happens when we stop talking. It is more than a mere negative renunciation of language; it is more than simply a condition we can produce at will.” 2024-02-27 God Went Like That Yxta Maya Murray In the middle of the last century, a research and development complex in California’s Simi Valley experienced multiple near-catastrophic accidents, leaking radiation and other toxins into the surrounding communities. 2024-02-19 The Absolute Book Elizabeth Knox When the murderer of Taryn Cornick’s sister is himself murdered just days after his release from prison, detective Jacob Berger is certain she has something to do with it. 2024-02-15 Against Technoableism Ashley Shew “Technoableism is a belief in the power of technology that considers the elimination of disability a good thing, something we should strive for.” 2024-02-13 The Saint of Bright Doors Vajra Chandrasekera In the seconds after Fetter is born, his mother kills his shadow. 2024-02-08 The Language of Power Rosemary Kirstein In the fourth and as yet final book of the Steerswoman series, Rowan and Bel return to Donner, where they last barely escaped an attack of dragons. 2024-02-05 The Lost Steersman Rosemary Kirstein Rowan arrives in Alemath, at the steerswomen’s Annex, searching for information. 2024-02-03 The Outskirter’s Secret Rosemary Kirstein The second book in the extraordinary Steerswoman Series follows Rowan and her companion, Bel, as they venture into the outskirts: a dangerous, inhospitable land marked by few sources of food and panoply of monsters intent on killing the humans who dare to live there."
