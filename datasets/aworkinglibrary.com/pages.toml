["https://aworkinglibrary.com/writing/undiscovered"]
title = "Undiscovered | A Working Library"
description = "One of the reasons we seem enamored with the early states, per James C. Scott’s excellent *Against the Grain*, is that they left records for us to read:"
full_description = "2024-04-25 Undiscovered A Reading Note One of the reasons we seem enamored with the early states, per James C. Scott’s excellent Against the Grain, is that they left records for us to read: Thus if you built, monumentally, in stone and left your debris conveniently in a single place, you were likely to be “discovered” and to dominate the pages of ancient history. If, on the other hand, you built with wood, bamboo, or reeds, you were much less likely to appear in the archaeological record. And if you were hunter-gatherers or nomads, however numerous, spreading your biodegradable trash thinly across the landscape, you were likely to vanish entirely from the archaeological record. Scott, Against the Grain, page 13 I think about this phenomena also with respect to the relative dearth of understanding of many pre-Christian “pagan” religions. (The word “pagan,” like its compatriot “barbarian,” was an insult.) Or indeed of women’s history in general, both before and after statehood. We have an unfortunate impulse to think that the history we can read is all the history there is—or all the history that matters. Which makes for some interesting questions about our current moment in time: what kind of marks will our digital and increasingly slippery present make in the archaeological record? What knowledge have we already lost? Elsewhere, Scott does signal a more positive note: But the oral epics of the Odyssey and the Iliad...date from precisely this dark age of Greece and were only later transcribed in the form in which we have come to know them. One might well argue, in fact, that such oral epics that survive by repeated performance and memorization constitute a far more democratic form of culture than texts that depend less on performance than on a small class of literate elites who can read them. Scott, Against the Grain, page 216 This brings to mind Rosemary Kirstein’s Steerswoman series. In the books, the steerswomen are literate travelers who wander the land, writing down all the things they learn. But when one of their number, Rowan, visits an annex where old logs are stored, she finds the books in disarray, with some missing and others imperiled by mold and bugs. Meanwhile, her outskirter (i.e., barbarian) friend, Bel, speaks often of the oral histories of her people, many of which contain wisdom and knowledge unknown to the steerswomen, and likely critical to the survival of both their peoples. Like the Greek epics, the outskirter’s histories are stories, told in verse and song, passed down by memory instead of pen. And maybe that’s a clue: perhaps a story well told can be trusted to outlast both paper and stone."
