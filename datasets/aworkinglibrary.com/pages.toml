["https://aworkinglibrary.com/reading/courage-to-create"]
title = "The Courage to Create | A Working Library"
description = "May sees creativity as the ultimate goal of all people (not merely those traditionally deemed “creative”) and links creativity to well-being and a desire to make the world a better place."
full_description = "The Courage to Create Author Rollo May Publisher Norton Year 1975 Buy this book Bookshop An approach to creativity from an existential psychologist. May sees creativity as the ultimate goal of all people (not merely those traditionally deemed “creative”) and links creativity to well-being and a desire to make the world a better place. 2009-07-06 Doubt The relationship between commitment and doubt is by no means an antagonistic one. Commitment is healthiest when it is not without doubt but in spite of doubt. To believe fully and at the same moment to have doubts is not at all a contradiction: it presupposes a greater respect for truth, an awareness that truth always goes beyond anything that can be said or done at any given moment. To every thesis there is an antithesis, and to this there is a synthesis. May, The Courage to Create, page 21 2009-07-09 A definition of creativity Creativity must be seen in the work of the scientist as well as in the artist, in the thinker as well as in the aesthetician; and one must not rule out the extent to which it is present in captains of modern technology as well as in a mother’s normal relationship with her child. Creativity, as Webster’s rightly indicates, is basically the process of making, of bringing into being. May, The Courage to Create, page 40 2009-07-13 The anxiety of creating Creative people, as I see them, are distinguished by the fact that they can live with anxiety, even though a high price may be paid in terms of insecurity, sensitivity, and defenselessness for the gift of the “divine madness,” to borrow the term used by the classical Greeks. They do not run away from non-being, but by encountering and wrestling with it, force it to produce being. They knock on silence for an answering music; they pursue meaninglessness until they can force it to mean. May, The Courage to Create, page 93 And: When I am engaged in writing something important to me, I find that if I engage in the customary twenty-minute meditation period before writing, my universe has become too straightened out, too orderly. Then I have nothing to write about. My encounter has vanished into thin air. My “problems” are all solved. I feel bliss, to be sure; but I cannot write. May, The Courage to Create, page 94"
