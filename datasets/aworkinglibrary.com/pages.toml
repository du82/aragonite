full_description = "2024-11-13 Stories Are Weapons Annalee Newitz Weapons used abroad always come home, and weapons of the mind are no different. 2024-10-25 The Wood at Midwinter Susanna Clarke In this short fable of midwinter, Susanna Clarke tells of the speech of dogs and pigs and foxes and the woods themselves, who talk to those who know how to listen. 2024-10-23 The Middle Passage James Hollis “Mid-way in life’s journey / I found myself in a dark wood, / having lost the way.” 2024-10-16 The Unaccountability Machine Dan Davies Dan Davies hypothesizes that organizations form “accountability sinks”—structures that serve to obscure, deflect, or otherwise insulate decision makers from the consequences of their decisions. 2024-09-30 When We Cease to Understand the World Benjamín Labutat A book that is both fiction and non-fiction, both wave and particle, both history and imagination, and somehow, something else entirely. 2024-09-21 The Ordinal Society Marion Fourcade & Kieran Healy Marion Fourcade and Kieran Healy dive into how the imperative to create, measure, and collect data wherever and whenever possible has scrambled our ways of knowing the world, each other, and crucially ourselves."
