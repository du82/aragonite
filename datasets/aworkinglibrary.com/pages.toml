title = "Yale University Press | A Working Library"
full_description = "The Craftsman Richard Sennet Sennett defines craftmanship as the desire to do a job well for its own sake. In so doing, he frees it of the bounds of carpentry or metalwork and extends the work of craft to that of the programmer, the doctor, and the parent. A Reader on Reading Alberto Manguel A series of essays from the author of A History of Reading that explores the reader’s perspective. Twitter and Tear Gas Zeynep Tufekci Zeynep Tufekci’s book spans the Zapatista uprisings in Mexico, the Occupy movement, a Turkish coup, Arab Spring, fake news, and more—and provides the most lucid analysis of the ways digital networked media has both enabled social justice movements and been used to thwart them. My Trade Is Mystery Carl Phillips An invitation to get lost, and to make oneself at ease in that place of mystery. Against the Grain James C. Scott Like another book with the same name, James C. Scott’s Against the Grain argues that the “just so” story of humans’ progression from barbarians to civilized agriculturalists is not the success story we might have thought."
