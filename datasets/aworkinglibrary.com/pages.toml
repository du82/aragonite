full_description = "The Unaccountability Machine Dan Davies Dan Davies hypothesizes that organizations form “accountability sinks”—structures that serve to obscure, deflect, or otherwise insulate decision makers from the consequences of their decisions. The Value of Nothing Raj Patel Raj Patel argues that the tragedy of the commons is one borne of privatization and corporatism, not an innate fact of the commoners themselves. Deep Economy Bill McKibben Bill McKibben indicts the current economic system for it’s single-minded pursuit of “more” without regard for whether or not it is (or can be) “better.” Small Is Beautiful E. F. Schumacher Schumacher brilliantly interrogates modern economics and proposes an alternative: a Buddhist economics that takes as its imperative the quality of human life, not the quantity of profit. Life Inc. Douglass Rushkoff A passionate, well-written text that argues that our centralized currency system is the key to the corporatism that has infected not only our government but our daily lives."
