full_description = "2025-02-04 Five Ways to Forgiveness Ursula K. Le Guin When the Hain first visit the Werelian system, they encounter a people living in a rigid and violently hierarchical system, separated into “owners” and “assets.” 2025-01-31 Discourse on Colonialism Aimé Césaire In the words of Robin D. G. Kelley’s introduction, this book is a “declaration of war.” 2025-01-17 Wildwood Roger Deakin Roger Deakin’s journey through trees takes him through the woods of Britain and Europe, to Kazakhstan and Australia, finding fellowship with a good many trees and the critters that live among them, as well as many lovely and interesting people. 2025-01-08 The Light Eaters Zoë Schlanger Amidst the noisy and nonsensical discourse about recognizing the intelligence of machines, Zoë Schlanger asks us to open our eyes to the intelligence that already surrounds us and upon which we wholly depend: that of plants. 2024-12-07 Mutual Aid Dean Spade A concise primer on the radical act of caring for each other while working to change the world. 2024-11-30 An Everlasting Meal Tamar Adler An Everlasting Meal is a modern-day How To Cook A Wolf—a practical, no-nonsense, and economical approach to cooking that eschews recipes for methods that can be remixed and adapted to whatever is on hand. 2024-11-30 How to Cook a Wolf M.F.K. Fisher First published in 1942 and then heavily amended and republished in 1951, M.F.K. Fisher’s How to Cook a Wolf is part cookbook, part war story, and all great writing. 2024-11-25 Practicing New Worlds Andrea J. Ritchie Andrea Ritchie draws from Black feminist abolitionist politics, emergent strategies, and speculative fiction to light up a path for surviving racial capitalism, growing fascism, and the climate crisis 2024-11-22 Who’s Afraid of Gender? Judith Butler Judith Butler looks hard at the rise of anti-gender ideology in order to break apart how it works, and what, in turn, we must do about it."
