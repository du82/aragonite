["https://aworkinglibrary.com/collections/food"]
title = "Books on food | A Working Library"
full_description = "An Everlasting Meal Tamar Adler An Everlasting Meal is a modern-day How To Cook A Wolf—a practical, no-nonsense, and economical approach to cooking that eschews recipes for methods that can be remixed and adapted to whatever is on hand. How to Cook a Wolf M.F.K. Fisher First published in 1942 and then heavily amended and republished in 1951, M.F.K. Fisher’s How to Cook a Wolf is part cookbook, part war story, and all great writing. Against the Grain James C. Scott Like another book with the same name, James C. Scott’s Against the Grain argues that the “just so” story of humans’ progression from barbarians to civilized agriculturalists is not the success story we might have thought. Salt, Fat, Acid, Heat Samin Nosrat Novice cooks will find this book does what it promises: teaches you how to cook well. But as an experienced (if amateur) cook myself, I also found a useful framework for thinking about my own cooking, not to mention a few new best practices. The Smitten Kitchen Cookbook Deb Perelman I’ve been a fan of Smitten Kitchen for years, so it’s delightful to see her recipes and photography pulled together into such a lovely package. Perelman’s style is enthusiastic and never fussy; the recipes are simple but attentive to just the right details. The Frankies Spuntino Kitchen Companion and Cooking Manual Frank Falcinelli, Frank Castronovo & Peter Meehan From one of my favorite local restaurants comes a lovely and instructive manual. An entire chapter is devoted to making Sunday sauce, complete with a timeline for the day. The Art of Simple Food Alice Waters A beautifully designed book that has served me well in the kitchen. King Arthur Flour Whole Grain Baking King Arthur Flour A wonderfully written primer on cooking with whole grains, with excellent recipes as well as guidance on equipment and techniques. Omnivore’s Dilemma Michael Pollan Worth the hype, not because of the widely-hailed subject matter but because of the extraordinary writing. Against the Grain Richard Manning A revisionist history that argues that we traded away much of our humanity in exchange for the little bit of security that agriculture promised."
