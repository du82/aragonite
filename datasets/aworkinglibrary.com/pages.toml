["https://aworkinglibrary.com/reading/everything-for-everyone"]
title = "Everything for Everyone | A Working Library"
description = "On May 6, 2052, a sex worker named Miss Kelley joined with her neighbors in Hunts Point to take over a produce market and distribute the food to those in need."
full_description = "Everything for Everyone An Oral History of the New York Commune, 2052-2072 Authors M.E. O’Brien Eman Abdelhadi Publisher Common Notions Year 2022 Collections Liberation The canon Buy this book Bookshop On May 6, 2052, a sex worker named Miss Kelley joined with her neighbors in Hunts Point to take over a produce market and distribute the food to those in need. This was the beginning of the New York Commune movement, recorded here in a series of oral histories from Miss Kelley and others who were there. The movement would soon spread to all five boroughs, and beyond, as a civil war brought about by the collapse of the US dollar made the old ways of living impossible. It was likewise impossible, as I was reading this, to not believe that it was already history—to not feel in my bones and flesh that this world, a world where everything is for everyone, is not only conceivable but being lived, day-by-day, and choice by choice. The choices aren’t easy or painless of course; this isn’t a utopia. But it’s real. It’s possible. And closer to hand than most of us dare to think. 2024-09-09 Who we wish to become In the final chapter of Everything for Everyone, M.E. O’Brien interviews Alkasi Sanchez in Brooklyn, on May 2, 2072. Sanchez is an historian of the Mid-Atlantic Free Assembly, a group that formed after the the first New York Commune was created in 2052. Sanchez concludes with this message: ...I think we should be done with nostalgia. To totally refuse nostalgia altogether. The next twenty years are a chance to turn outwards, to be seriously facing all the rapid and exciting changes humans are going through. There are huge tasks that will require a vast amount of human ingenuity, creativity, and effort. Like rebuilding ecological systems, restoring biodiversity, reversing climate change. Or, life in orbit and exploration of the solar system is really just starting. Earlier, I mentioned the proliferation of human body modifications. I think that sort of thing is going to continue in the coming decades and get more and more common. We can finally start really thinking creatively about who we are in this universe, who we wish to become. Nostalgia is a toxin for that expansive visioning that needs to happen. We need to be done with nostalgia. O’Brien & Abdelhadi, Everything for Everyone, page 239 Sanchez is a historian. They aren’t arguing for people to forget the past, or to disengage with it; quite the contrary. Rather, they are arguing that nostalgia—the sense that the past is a home we must return to—is an affliction when brought to the work of imagining change. As much so now, I think, as it will be in the future."
author = "Mandy Brown"
year_published = 2024
