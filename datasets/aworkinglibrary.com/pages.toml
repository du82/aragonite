["https://aworkinglibrary.com/writing/make-life-possible"]
title = "Make life possible | A Working Library"
description = "Five principles for embracing uncertainty."
full_description = "2025-02-14 Make life possible Uncertainty is the condition of not knowing what comes next, the fear of change that is beyond our control and likely at odds with our thriving. It is a state of worry, of insecurity, of a lack of faith in the systems that keep us alive and living. It is, so often, intolerable. And yet, as Le Guin reminds us, uncertainty is also the only thing that makes life possible. Without it, we would move like automatons through predetermined paths, unspirited, unaware, unliving. Our awareness of life, of its great variety and beauty and possibility, emerges out of uncertainty. Awareness, that sense of being awake to the world, is necessary only because we live in uncertainty. If we knew what was to come, we would have no need for sensemaking, no need to be alert to what’s around us, no need to ever open our eyes and ears and arms to each other. This is, perhaps, the great paradox of modern technologies: in a world without uncertainty, we would need only be aware of our screens—nothing else would matter. But in the deeply uncertain world we do live in, we cling to those screens because they promise the one thing we can never have. That is, screens and all the technologies that accompany them are tools to make the world seem more predictable and less uncertain: infinite scroll; autoplay; the always-on “live” news cycle; the steady drumbeat of notifications; the apps that summon servants to our doors, hiding all the labor and improvisation and accidents (often involving blood and bone) that go into moving atoms from one place to another. These tools train us in convenience, which is training in predictability, in the facade of certainty. And when that facade inevitably breaks, we often find ourselves at sea. In the brilliant and ever-relevant Seeing Like a State, James C. Scott outlines the many ways states fail; principle among them is an obsession with putting things in order, with simplification and efficiency. More often than not, that efficiency translates into brittleness and weakness, into systems so fragile they break the moment something unanticipated arises. Near the end of the book, he proposes four alternative patterns that hold promise for different ways of building worlds, worlds more attuned to human and more-than-human surviving and thriving in uncertain times, to the critical skills of flexibility and adaptability. I’ve found myself coming back to those patterns often, and thinking about how they work in other contexts—not only in the sense of states or governments making change, but of smaller groups of people—a few friends, a block, a neighborhood. Here is the version I’ve been playing with: Take small steps. Rather than trying to predict outcomes, aim to test, explore, and improvise. Consider each step or action you take to be a small, brief experiment. Try something, then step back and observe what happens. Then, try again. Remember that many small steps can add up to a great big change given a little time and persistence. Be ready to shift direction. A step may reveal ground that’s too soft or too loose or too steep to climb. An experimental approach admits of the possibility that the best route won’t be a straight one, but one that zigs and zags around sinkholes and obstacles both. When the ground is unpredictable, so is the path through it. Anticipate surprise. Expect that as you move and learn, there will be many lessons you couldn’t have planned for, could never have seen coming. A choice or habit that made sense a few miles back may no longer serve you. Don’t engage in hindsight; do be ready to relinquish old truths and accept new ones. Trust in creativity. A basic condition of life is the creative adaptation to changing conditions—and you, my friend, are alive and living. Trust in your own (and others’) ability to respond to unforeseen circumstances with inventiveness, playfulness, and ingenuity. To this, I will add a fifth principle: Go with friends. Whatever you do from here, do it with others. It’s a long-held maxim in movement circles that the people who work for liberation and freedom will always be outgunned and out monied by those who fight for precarity, oppression, and exploitation. Our power is not measured in weapons or cash but in humans; our power is with and through each other. Making life possible in uncertainty is to make room for more life, your own and many others. It is, as ever, to practice solidarity and reciprocity, to show up and to be present. To recognize that what happens next is—not now, not ever—written in stone. Related books The Left Hand of Darkness Ursula K. Le Guin A human envoy arrives on a planet known as “Winter.” His solitary mission is to welcome the people of Winter to a collection of planets, but to do so he must first find welcome himself. Seeing Like a State James C. Scott The classic opus about how states fuck up."
