full_description = "Five Ways to Forgiveness Ursula K. Le Guin When the Hain first visit the Werelian system, they encounter a people living in a rigid and violently hierarchical system, separated into “owners” and “assets.” The Wood at Midwinter Susanna Clarke In this short fable of midwinter, Susanna Clarke tells of the speech of dogs and pigs and foxes and the woods themselves, who talk to those who know how to listen. When We Cease to Understand the World Benjamín Labutat A book that is both fiction and non-fiction, both wave and particle, both history and imagination, and somehow, something else entirely. The Wall Marlen Haushofer On holiday in a hunting lodge in the Austrian mountains, a middle-aged woman wakes up to find that an invisible wall has descended all around her. Dry Land B. Pladek In the woods of Wisconsin, a young forester named Rand Brandt learns that he can grow any plant he imagines in minutes, merely by touching the dirt. A Half-Built Garden Ruthanna Emrys Judy Wallach-Stevens is woken one night to a warning about pollutants in the nearby Chesapeake Bay. With her wife and newborn in tow, she heads out to see what’s up—and ends up making first contact with a group of friendly aliens. God Went Like That Yxta Maya Murray In the middle of the last century, a research and development complex in California’s Simi Valley experienced multiple near-catastrophic accidents, leaking radiation and other toxins into the surrounding communities. The Absolute Book Elizabeth Knox When the murderer of Taryn Cornick’s sister is himself murdered just days after his release from prison, detective Jacob Berger is certain she has something to do with it. The Saint of Bright Doors Vajra Chandrasekera In the seconds after Fetter is born, his mother kills his shadow. The Language of Power Rosemary Kirstein In the fourth and as yet final book of the Steerswoman series, Rowan and Bel return to Donner, where they last barely escaped an attack of dragons. The Lost Steersman Rosemary Kirstein Rowan arrives in Alemath, at the steerswomen’s Annex, searching for information."
