["https://aworkinglibrary.com/reading/emergent-strategy"]
title = "Emergent Strategy | A Working Library"
description = "“I read sci-fi and visionary fiction as political, sacred, and philosophical text, and I engage with others who read it that way,” writes adrienne maree brown, in this astonishing, radical, and hum..."
full_description = "Emergent Strategy Shaping Change, Changing Worlds Author adrienne maree brown Publisher AK Press Year 2017 Collections Reading The canon Liberation Buy this book Bookshop “I read sci-fi and visionary fiction as political, sacred, and philosophical text, and I engage with others who read it that way,” writes adrienne maree brown, in this astonishing, radical, and humane book (39). brown uses the work of Octavia Butler—specifically, the concept of “shaping God” from the Earthseed verses in the Parables series—to document a strategy for building a healing and sustainable approach to the world. The book is meandering—fittingly, as she sketches out the elements and principles of what she calls “emergent strategy,” it’s only after reading and rereading many of her passages, incantations, and reflections that her ideas really begin to emerge. I found her philosophies about transforming the world compelling, but even more than that, I was awakened by her choice to read Octavia Butler as gospel. 2020-01-14 Change is constant adrienne maree brown outlines the principles of emergent strategy, drawing from the Earthseed verses in Octavia Butler’s Parables series, as well as other sources as diverse as Bruce Lee, Lao Tzu, and Rihanna: Small is good, small is all. (The large is a reflection of the small.) Change is constant. (Be like water.) There is always enough time for the right work. There is a conversation in the room that only these people at this moment can have. Find it. Never a failure, always a lesson. Trust the people. (If you trust the people, they become trustworthy.) Move at the speed of trust. Focus on critical connections more than critical mass—build the resilience by building the relationships. Less prep, more presence. What you pay attention to grows. brown, Emergent Strategy, page 41 That brown draws these principles from so many different sources pretty much guarantees that they aren’t revolutionary; but I find myself returning back to the collection often, and thinking about what it means to commit not to any one of them, but to them all."
