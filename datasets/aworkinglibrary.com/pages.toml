title = "The Order of Time | A Working Library"
description = "Is time *out there?* Or is it within us?"
full_description = "The Order of Time Author Carlo Rovelli Translators Erica Segre Simon Carnell Publisher Riverhead Year 2018 Buy this book Bookshop Is time out there? Or is it within us? Carlo Rovelli begins this book with our just-so stories about time, proceeds through the ancient beliefs about time, finds where they resonate (and diverge) from what present-day physics teaches us, and then concludes that time is as much as—perhaps more so—a part of us as it is a characteristic of the universe. That is, there is no time except that which we experience as change, and it is from that change that we can, in some way, come to know ourselves."
