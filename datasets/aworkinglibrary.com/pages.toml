["https://aworkinglibrary.com/reading/always-coming-home"]
title = "Always Coming Home | A Working Library"
description = "An archeology of the future."
full_description = "Always Coming Home Author Ursula K. Le Guin Publisher University of California Press Year 1985 Collections Fiction The canon Buy this book Bookshop Perhaps Le Guin’s most misunderstood book, Always Coming Home is an archaeology of the future. Instead of patiently digging in the dirt, Le Guin imagines the people who will live in California centuries hence: after the industrial age has poisoned the earth and left its mark in people’s genes, after the machines have built their own city, after the seas have risen and swallowed the old cities of men. The form of the book is, on the surface, the textbook or the treatise—a collection of stories, reports, histories, maps, recipes, poems. But Le Guin’s skill for narrative is so profound that she manages to weave all those pieces together, until they feel like a novel in your hands—as if you were given a bunch of broken shards but as you gazed upon them, they coalesced into a bowl or a small but sturdy bag. Within, we glimpse a people whose models of kinship and care refuse the ruins of their ancestors and, perhaps, show us how to build the kind of future we can live in. 2024-09-18 What we do not know In Always Coming Home, a woman named Stone Telling writes the story of her life. Of the writing, she says: A year before this now where I write this page, after the Madrone Lodge people had asked me to write the story of my life, I went to Giver Ire’s daughter, the story writer, and asked if she could teach me how to write a story, for I did not know how to go about it. Among other things Giver suggested to me was that in writing the story I try to be as I was at the time of which I am writing. This has been a good deal easier than I thought it would be, until now, this place now, where my father has come into the house. It is hard to remember how little I knew. And yet Giver’s advice is sound; for now that I know who my father was, why he was there and how he came, who the Condor people were and what they were doing, now that I am learned in such matters, it is my old ignorance, in itself valueless, that is valuable, useful, and powerful. We have to learn what we can, but remain mindful that our knowledge not close the circle, closing out the void, so that we forget that what we do not know remains boundless, without limit or bottom, and that what we know may have to share the quality of being known with what denies it. Le Guin, Always Coming Home, page 29 I think, perhaps, that one of the ways in which we live now—purportedly, with all the world’s knowledge at our fingertips—is the kind of forgetting that Stone Telling warns against here, a closing of the circle. As that knowledge becomes harder to grasp, as the systems which have made so much knowledge possible turn upon themselves and eat themselves from the inside-out, what might we be able to remember?"
