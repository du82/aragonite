["https://awsmaniac.com/aws-cdk-creating-our-first-vpc"]
title = "Creating our first VPC in AWS CDK | AWS Maniac"
description = "Today, we would like to start building our workshop infrastructure, which includes a dedicated VPC for each participant. VPC sounds hard, right? Let's see how we can implement it in AWS CDK."
full_description = '''Creating our first VPC in AWS CDK<picture><source type='image/webp' srcset="/static/3f80c202c6b9802e3b1ac007d8459c76/105ae/banner.webp 300w, /static/3f80c202c6b9802e3b1ac007d8459c76/9d51b/banner.webp 600w, /static/3f80c202c6b9802e3b1ac007d8459c76/3cc96/banner.webp 1200w" sizes="(max-width: 1200px) 100vw, 1200px" /><source srcset="/static/3f80c202c6b9802e3b1ac007d8459c76/0a74d/banner.png 300w, /static/3f80c202c6b9802e3b1ac007d8459c76/fa42c/banner.png 600w, /static/3f80c202c6b9802e3b1ac007d8459c76/77647/banner.png 1200w" sizes="(max-width: 1200px) 100vw, 1200px" /><img loading="lazy" sizes="(max-width: 1200px) 100vw, 1200px" srcset="/static/3f80c202c6b9802e3b1ac007d8459c76/0a74d/banner.png 300w, /static/3f80c202c6b9802e3b1ac007d8459c76/fa42c/banner.png 600w, /static/3f80c202c6b9802e3b1ac007d8459c76/77647/banner.png 1200w" src="/static/3f80c202c6b9802e3b1ac007d8459c76/77647/banner.png" alt="" style="position:absolute;top:0;left:0;opacity:1;width:100%;height:100%;object-fit:cover;object-position:center"/></picture>.css-1a66u1g{font-size:0.7rem;font-style:italic;}5 min read, last updated on 2020-12-22In the previous article, I have briefly explained what we are trying to build, but let’s do a quick recap. Our goal is to develop fully automated infrastructure scripts for setting up an environment for a workshop with multiple participants.You can easily imagine that each of our participants needs a dedicated VPC to host their resources there. It sounds like a nice and sizable piece to start, so let’s do it!PrerequisitesFirst, we need to install and configure AWS CLI. There is plenty of tutorials available over the internet for that, so feel free to do it and return back here.Second, We need to install Node.js in version at least 10.3.0 or higher to use CDK. It affects everybody, even those working in languages other than TypeScript or JavaScript.Next, we can install and test the tool:$ npm install -g aws-cdk # Waiting, waaaaaating, waaaaiting... $ cdk --versionYou can also find the complete source code of this example in the following repository: github.com/afronski/awsmaniac-aws-cdk. This particular example is under the name: part-1-creating-our-first-vpc.Bootstrapping new projectAfter that, we can start development. Let’s initialize our project from a template:$ cdk init app --language=typescriptIt buzzed, zapped, beeped, and at the end, created a bunch of files and directories that altogether represent the CDK Application.How is it organized?CDK Application is an additional abstraction that allows us to assemble a logical group and ease reusability between multiple templates and constructs.It would help if you thought of it as an infrastructure package for a part of the business domain (or bounded context). It has a special meaning in two areas - in the context of the infrastructure lifecycle, and it is the root of the infrastructure graph.In terms of lifecycle, we have a flow defined via the diagram posted below. It already provides a sneak peek in a few areas, e.g., in terms of deployment: Speaking about the root of the infrastructure graph, you can see that in the bin directory:#!/usr/bin/env node import 'source-map-support/register'; import * as cdk from '@aws-cdk/core'; import { VpcStack } from '../lib/vpc-stack'; const app = new cdk.App(); new VpcStack(app, 'FirstVPC');The App construct doesn’t require any initialization arguments because it’s the only construct used as a root for the construct tree.We can now use the App instance as a scope for defining a single instance of your stack.Creating resources with StacksIn the previous snippet, we have imported a stack definition named VpcStack. Let’s investigate its purpose:import * as cdk from '@aws-cdk/core'; export class VpcStack extends cdk.Stack { constructor(scope: cdk.Construct, id: string, props?: cdk.StackProps) { super(scope, id, props); } }In this example, by extending the cdk.Stack class, we provide a construct that will be responsible for generating a CloudFormation stack with given resources.However, we do not have any resources defined there - so the stack will be empty. That’s not helpful, so let’s address that.The Power of DefaultsIf you wrote or saw a CloudFormation template that defines a VPC, it is a sizeable chunk of YAML even in the simplest possible case. In order to create and configure VPC properly, we need to create a handful of subnets, routing tables, internet and NAT gateways, security groups, choose proper CIDR, and connect them all together.Additionally, AWS recommendations are clear: you should use at least 2 Availability Zones (or even better - 3 AZs) to achieve High Availability and fulfill SLA prerequisites. That directly transfers into having two subnets, and of course, not all subnets should be publicly available. Long story short: you need to codify all those requirements in YAML or JSON, and you are on your own.How we can handle that in CDK? In such case, we are beneficients of high-level abstractions:import * as cdk from '@aws-cdk/core'; import { Peer, Port, SecurityGroup, Vpc } from '@aws-cdk/aws-ec2'; export class VpcStack extends cdk.Stack { constructor(scope: cdk.Construct, id: string, props?: cdk.StackProps) { super(scope, id, props); const vpc = new Vpc(this, 'VPC', { maxAzs: 3, natGateways: 3 }); const ssh = new SecurityGroup(this, 'SSH-SG', { securityGroupName: 'open-ssh', vpc, allowAllOutbound: true }); ssh.addIngressRule(Peer.anyIpv4(), Port.tcp(22)); ssh.addIngressRule(Peer.anyIpv6(), Port.tcp(22)); } } If you see this and look like a Futurama Fry meme above, you are right. That does a lot under the hood, and I encourage you to read about all possible configuration knobs in the official documentation.The great thing about this abstraction above is that it already provides a VPC compliant with the AWS recommendations, and you can parametrize it to an impressive extent.So far, so good. It looks great for our use case - so let’s base on it and deploy our stack.DeploymentAssuming that you have AWS CLI credentials configured in your environment, you can invoke the following command to check if a deployment succeeds:# If credentials for AWS CLI are configured, invoke: $ cdk deployIt will ask for your confirmation, and after a long moment, you should see that stack succeeded. An excellent addition is that you can monitor the events in your command line during the whole process. TroubleshootingYou have to be aware that there is one pitfall related to installing aws-cdk globally.If you will experience and error looking similar to this one:Argument of type 'this' is not assignable to parameter of type 'Construct'.Just make sure that you have pinned precisely the same versions for all @aws-cdk libraries in your package.json file as the one you have installed globally. It’s essential to skip tilde (~) or a caret (^): "devDependencies": { "@aws-cdk/assert": "1.33.0", // ... }, "dependencies": { "@aws-cdk/aws-ec2": "1.33.0", "@aws-cdk/core": "1.33.0", // ... }Remember to nuke the node_modules directory and the package-lock.json file, too, before reinstalling the dependencies.What’s next?We have opened the chocolate box of possibilities here. I omitted the test directory, and we will tackle this opportunity in the next article right away. Some of you are not satisfied with my choice of a programming language - and I will address that as well. Last but not least - we have just scratched the surface when it comes to the abstractions available in the CDK.Today’s post is already a long one, so allow me to stop here and invite you for the next part.In the meantime, please tell me what do you think about such a VPC definition that I presented above - is it something you would consider helpful for your projects?'''
