["https://awsmaniac.com/start-here"]
title = "👉 Start here! | AWS Maniac"
description = "How to use this blog?"
full_description = '👉 Start here!Amazon Web Services (AWS) has an ever-growing list of services (175 in 2020). They release a massive number of updates annually (more than 500 in 2020). I am sure that you are aware of how insanely potent and powerful platform it is. However, leveraging its full potential requires time and knowledge to rapidly gain hands-on experience. It sounds like madness in such an environment, isn’t it?Indeed it is! That’s why you need an AWS maniac.I know that AWS from the outside looks like an overcomplicated mess. Those numbers provided above are overwhelming. When you read these words, there is a non-zero probability that they have released another service or at least updated an existing one in the portfolio.Yet, according to many sources and independent auditors (like Gartner presented above) Amazon Web Services is the unquestionable leader. The best, the most reliable, and most mature platform available on the market.Helpful maniacsYou are in the right place if you are:overwhelmed with such an extensive portfolio of services available on AWS platform,thinking how to tame an avalanche of announcements and updates coming from the cloud provider,looking for battle-tested solutions for leveraging the full power of Amazon Web Services,in need of help and eyes of an experienced cloud architect that may save your project,wondering what to avoid when working with the AWS portfolio,interested in building real and practical knowledge about particular services available there.Imagine that you have answers for those and many other important questions that are on your mind. You what to use, what to avoid, how to approach that, when to use what, how to grow and maintain your digital product and systems.You do not have to drink the kool-aid from the AWS firehose alone! Relieved? That’s why you should rely on maniacs like me.Why this term? The word maniac comes from the Greek phrase mania, which means:μᾰνῐ́ᾱ • (maníā) f (genitive μᾰνῐ́ᾱς); first declensionmadness, frenzy, enthusiasmmad desire, compulsionThat’s why I like it so much and why I chose this as a nickname. First: it’s much easier to remember than my name (I get it, it’s Polish 🇵🇱 - I am proud of that, but hey - it is unspeakable for most people 😉). Second: it represents my attitude towards the topic.Do not get me wrong: I am not blind. Google Cloud and Microsoft Azure are great platforms too, but AWS is my specialization, not by accident. Amazon Web Services platform is not only a leader, but they represent pragmatism and innovation at the same time.Why pragmatism? Because they focus on builders. Their motto and video series Now Go build describe it very well. Why is it essential for me? If I had to choose one reason why I am in IT, it is because of the possibility of creating unimaginable structures from literally nothing. And there is nothing more potent than seeing those structures in action. It is incredibly grateful for being able to observe your creation, a working software doing its job. It looks like a well designed, oiled machine, humming through a queue of business problems, and it does the job in a way that nobody else thought about.Speaking about innovation at AWS: you do not believe me, right? So, let’s go back to 2014 when AWS Lambda was announced. In November that year, they have invented serverless and provided it to the world. And that is not the only example: EC2, SQS, DynamoDB, S3, Redshift, Aurora, and others are the representation of the unsurpassed standards for our industry. And when they were announced (some in 2006), those services have paved the way in their categories.Now, when I have explained why AWS (probably some of you do not have to be persuaded), allow me to tell you how it can help you.How I and AWS can help you?Delivering software as an industry is classified as a part of science (it is a branch computer science). However, plenty of people identify with a snarky comment that it is not at all about computers, neither about science. I am not such a person.I always say that a sufficiently hard-working, patient, eager to learn, a diligently read person can be a programmer, administrator, you name it. I strongly believe in “deliberate practice”. It is an exercise that focuses on your boundaries’ systematic push and learning what you can do. Its essence is focused on a PDCA loop (Plan, Do, Check, Act) - everything based is on the feedback you will get and conclusions that you will draw from it for the next iterations.My goal is to experiment, practice, and document everything I learn about cloud computing and Amazon Web Services. And I will do my best, that it will be done in a way that provides the most significant value to you..css-h68h3m{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-wrap:wrap;-ms-flex-wrap:wrap;flex-wrap:wrap;-webkit-box-pack:center;-webkit-justify-content:center;-ms-flex-pack:center;justify-content:center;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;margin:0 auto 1.7rem auto;}.css-13vyaf6{padding:1rem;border:0.15rem solid rgba(0,0,0,0.1w5);box-shadow:0 0 1rem 0 rgba(0,0,0,0.3);}.css-13vyaf6 img{margin-bottom:0;}<picture><source srcset="/static/26eb55331008c6716b25b6c883c918dd/a05ce/logo.png 1x, /static/26eb55331008c6716b25b6c883c918dd/80e0d/logo.png 1.5x, /static/26eb55331008c6716b25b6c883c918dd/fa36e/logo.png 2x" /><img loading="lazy" width="200" height="200" srcset="/static/26eb55331008c6716b25b6c883c918dd/a05ce/logo.png 1x, /static/26eb55331008c6716b25b6c883c918dd/80e0d/logo.png 1.5x, /static/26eb55331008c6716b25b6c883c918dd/fa36e/logo.png 2x" src="/static/26eb55331008c6716b25b6c883c918dd/a05ce/logo.png" alt="Cover image" style="position:absolute;top:0;left:0;opacity:1;width:100%;height:100%;object-fit:cover;object-position:center"/></picture>.css-12y0vm2{font-size:1.1rem;padding:0 1.7rem;display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;text-align:center;max-width:22.1rem;}Subscribe to the newsletter and get notifications about new posts..css-1n69bap{font-weight:bold;text-transform:uppercase;}SubscribeA few words about meI am a very fortunate person. I had found my itch when I was 3 or 4 years old. How? My dad is a programmer. There is a funny story that, as a 4-year-old kid, I have learned letters in a visual way - because of the keyboard, so I could use DOS and play games on my own.It may sound like a cliche, but I love what I am doing and never worked a single day in my life so far. So it was natural for me to graduate and work in IT. As a typical computer nerd I wrote several 3D games (sigh, okay - mostly engines… 😅), played with less user-friendly Linux distributions (Gentoo, Arch) and window managers (XMonad), I dived into obscure computer science corners like distributed systems theory. In other words: I live and breathe everything that is IT related.It did not change after starting my commercial career. After 12 years, and I am not bored at all, still passionate about it as in day 1. During my career, I have participated in excellent and bad projects. I have worked in very different environments: giant corporations, product houses, software houses, start-ups.I have worked with Delphi, C, C++, C#, ASP.NET, JavaScript (mostly vanilla, but also AngularJS, Backbone.js, a butt load of Node.js, React.js, and TypeScript), Erlang and Elixir, Python, Java, Scala, Kotlin and many others (e.g., Clojure, Rust, R, Lua or Julia anyone?). And of course, I have my favorite languages (❤️ functional programming ❤️). However, I think that the programming language and library is just a tool for achieving the goal. And IT should be a servant to the business.I have worked with legacy systems older than I am, and I was an architect and team member that built a complete greenfield. The best projects I remember have one thing in common: they were either running or delivered to the production, and I could have worked with them for a longer time. That included support, monitoring, and maintenance. That’s how I have started to look further into DevOps, operations and cloud computing.This landscape provided me the thing that I have subconsciously desired in IT projects. Deliverability is the ultimate goal of an IT project. That’s the only way you can provide value, verify your work’s quality, and test your real skills in anger. When my career progressed, it became more comfortable and easier to deliver, thanks to the cloud providers - that’s how my journey with AWS started.As usual, it started from IaaS of course. EC2 machines (no Amazon VPC back then) were just the tip of an iceberg, and I have sunk like a Titanic. 🚢 The more I have learned about the platform, the more I was sure that I have found an ultimate tool to express and deliver my and my client’s ideas to the audience. I have earned the certificates presented above (you can verify them on my Credly account), but I treat this more like a side-effect of the hands-on experience and deliberate practice. After a few years of such, when I have observed a certain number of patterns and needs, together with my colleagues, we have created an IT consultancy company called Pattern Match, which is focused on advising and building digital products with the help of AWS.Outside of working hours, I am still enthusiastic about IT. I share my joy with others by organizing meetups (Functional Miners), building communities like AWS Community Builders or ŚwiatChmury.pl, giving talks, workshops, recording videos, podcasts, blogging, writing books and doing many other activities. All the above is related to cloud computing and Amazon Web Services.That was a mouthful introduction, but now you know what kind of maniac you are dealing with. 😁.css-17qch6y{background-color:#2b3d4f;color:#ffffff;padding:1.2rem 1.7rem 1.7rem 1.7rem;border-radius:4px;margin-left:-0.425rem;margin-right:-0.425rem;margin-bottom:1.55rem;box-shadow:0 0 1rem 0 rgba(0,0,0,0.3);}.css-1go9jo7{display:block;text-align:center;padding-bottom:1rem;font-family:Inter,Arial,sans-serif;font-weight:bold;text-transform:uppercase;}😅 off-topic.css-18rs2ws{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:row;-ms-flex-direction:row;flex-direction:row;-webkit-align-content:center;-ms-flex-line-pack:center;align-content:center;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;-webkit-box-pack:space-evenly;-webkit-justify-content:space-evenly;-ms-flex-pack:space-evenly;justify-content:space-evenly;}@media only screen and (max-width:600px){.css-18rs2ws{-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;}}.css-18rs2ws blockquote{color:rgba(255,255,255,0.59);border-left-color:rgba(255,255,255,0.59);font-size:1rem;}.css-18rs2ws a{color:#ff7f76;}.css-18rs2ws small,.css-18rs2ws div{padding-left:1rem;}<picture><source srcset="/static/0dd71f0b777485f44a1c91dcb8adceb0/11471/aws-community-builder-logo.png 1x, /static/0dd71f0b777485f44a1c91dcb8adceb0/623ab/aws-community-builder-logo.png 1.5x, /static/0dd71f0b777485f44a1c91dcb8adceb0/2a868/aws-community-builder-logo.png 2x" /><img loading="lazy" width="200" height="200" srcset="/static/0dd71f0b777485f44a1c91dcb8adceb0/11471/aws-community-builder-logo.png 1x, /static/0dd71f0b777485f44a1c91dcb8adceb0/623ab/aws-community-builder-logo.png 1.5x, /static/0dd71f0b777485f44a1c91dcb8adceb0/2a868/aws-community-builder-logo.png 2x" src="/static/0dd71f0b777485f44a1c91dcb8adceb0/11471/aws-community-builder-logo.png" alt="AWS Community Builders logo" style="position:absolute;top:0;left:0;opacity:1;width:100%;height:100%;object-fit:cover;object-position:center"/></picture>AWS Community Builders is a program that offers technical resources, mentorship, and networking opportunities to AWS enthusiasts and emerging thought leaders who are passionate about sharing knowledge and connecting with the technical community.If you have any questions, drop me an email at wgawronski [at] white-rook.pl or @afronski / @afronsky on social media.🖖P.S. I am practicing inbox zero, so it means that I review all my emails. Do not you believe me? I dare you to send me one.'
