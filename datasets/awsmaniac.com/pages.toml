["https://awsmaniac.com/troubleshooting-aws-cdk-part-2-explicit-dependencies"]
title = "Troubleshooting AWS CDK: part 2 - Explicit Dependencies | AWS Maniac"
description = "In the previous article, we have overcome two relatively straightforward and expected issues (especially if you have some experience with CloudFormation). Now we have a much bigger problem that we need to face."
full_description = '''Troubleshooting AWS CDK: part 2 - Explicit Dependencies<picture><source type='image/webp' srcset="/static/60decfad53a8ae860988e892b87697cf/105ae/banner.webp 300w, /static/60decfad53a8ae860988e892b87697cf/9d51b/banner.webp 600w, /static/60decfad53a8ae860988e892b87697cf/3cc96/banner.webp 1200w" sizes="(max-width: 1200px) 100vw, 1200px" /><source srcset="/static/60decfad53a8ae860988e892b87697cf/0a74d/banner.png 300w, /static/60decfad53a8ae860988e892b87697cf/fa42c/banner.png 600w, /static/60decfad53a8ae860988e892b87697cf/77647/banner.png 1200w" sizes="(max-width: 1200px) 100vw, 1200px" /><img loading="lazy" sizes="(max-width: 1200px) 100vw, 1200px" srcset="/static/60decfad53a8ae860988e892b87697cf/0a74d/banner.png 300w, /static/60decfad53a8ae860988e892b87697cf/fa42c/banner.png 600w, /static/60decfad53a8ae860988e892b87697cf/77647/banner.png 1200w" src="/static/60decfad53a8ae860988e892b87697cf/77647/banner.png" alt="" style="position:absolute;top:0;left:0;opacity:1;width:100%;height:100%;object-fit:cover;object-position:center"/></picture>.css-1a66u1g{font-size:0.7rem;font-style:italic;}2 min read, last updated on 2020-12-22In the previous article, we have overcome two relatively straightforward and expected issues (especially if you have some experience with AWS CloudFormation). Now we face a much bigger problem. InvestigationThe problem is with dependencies between resources. It turns out that we are creating NAT Gateways before our IGW will be created. It happens not always in that order. For some nested stacks, we do that in the right order. However, in some cases, we hit the reverse situation, and that is causing trouble.You need to be explicit!In a typical AWS CloudFormation stack, you would slap DependsOn on the affected resource, and that’s it. Here we have a bit more work to do - as everything is related to the infrastructure graph.To create an explicit dependency between resources, you need to select that affected resource and create an addiction to another node that you have to find. Sounds troublesome, isn’t it?Luckily in one of the previous posts, I have explained to you how AWS CDK names particular nodes so you can craft your path. So we need to do the following:// NAT Gateways must wait for IGW. // // We need to look for a NAT Gateway inside each // PublicSubnet according to the name convention // introduced in the AWS CDK pattern for VPC. // // After finding it, we are adding an explicit dependency // on the Internet Gateway. const igw = this.node.findChild('IGW'); for (let i = 1; i < this.availabilityZones.length + 1; ++i) { const nat = this.node.findChild(`PublicSubnet${i}`) .node.findChild('NATGateway'); nat.node.addDependency(igw); }And that is it! It will work in the same way as DependsOn, which can be observed with cdk synth and a resulting template:"ParticipantVpcForUser03PublicSubnet1NATGatewayAB30A51C": { "Type": "AWS::EC2::NatGateway", "Properties": { "AllocationId": { // ... }, "SubnetId": { // ... }, "Tags": [ // ... ] }, "DependsOn": [ "ParticipantVpcForUser03IGW3417B09D" ], "Metadata": { "aws:cdk:path": "..." } },Thanks to a call to addDependency, it created a DependsOn entry for each AWS::EC2::NatGateway resource.Summary Okay, so we fought overall issues, and we can rest now? Not exactly, as we can improve a few things here and there, including AWS CDK Aspects, and compare this approach with other tools like Terraform.'''
