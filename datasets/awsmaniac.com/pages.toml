["https://awsmaniac.com/using-aspects-in-aws-cdk"]
title = "Using aspects in AWS CDK | AWS Maniac"
description = "AWS CDK introduces not only tooling, wrappers, constructs, and patterns, but also additional elements that allow us to leverage the expressive power of programming languages. Today I'd like to show you such items: aspects that would enable us to do cool stuff that is very hard to achieve otherwise."
full_description = '''Using aspects in AWS CDK<picture><source type='image/webp' srcset="/static/342f1b683b92202aa6a65f6e89bed4ea/105ae/banner.webp 300w, /static/342f1b683b92202aa6a65f6e89bed4ea/9d51b/banner.webp 600w, /static/342f1b683b92202aa6a65f6e89bed4ea/3cc96/banner.webp 1200w" sizes="(max-width: 1200px) 100vw, 1200px" /><source srcset="/static/342f1b683b92202aa6a65f6e89bed4ea/0a74d/banner.png 300w, /static/342f1b683b92202aa6a65f6e89bed4ea/fa42c/banner.png 600w, /static/342f1b683b92202aa6a65f6e89bed4ea/77647/banner.png 1200w" sizes="(max-width: 1200px) 100vw, 1200px" /><img loading="lazy" sizes="(max-width: 1200px) 100vw, 1200px" srcset="/static/342f1b683b92202aa6a65f6e89bed4ea/0a74d/banner.png 300w, /static/342f1b683b92202aa6a65f6e89bed4ea/fa42c/banner.png 600w, /static/342f1b683b92202aa6a65f6e89bed4ea/77647/banner.png 1200w" src="/static/342f1b683b92202aa6a65f6e89bed4ea/77647/banner.png" alt="" style="position:absolute;top:0;left:0;opacity:1;width:100%;height:100%;object-fit:cover;object-position:center"/></picture>.css-1a66u1g{font-size:0.7rem;font-style:italic;}3 min read, last updated on 2020-12-22When it comes to the expressive power, AWS CDK does not stop on the Constructs (which I have explained here). We have more things available, and today I would like to show how we can leverage aspects in the AWS CDK Applications.AOP 101If you haven’t heard about Aspect-Oriented Programming, it is a programming paradigm that aims to increase modularity by separating cross-cutting concerns. It does so by adding additional behavior to existing code (formally named advice) without modifying the code itself, instead separately specifying which is adjusted via a pointcut specification.In other words, aspects are the way to apply an operation to all constructs in a given scope. And as our scope is the infrastructure graph with the root at the CDK Application, we need to talk about the Visitor pattern to understand the application mechanism.According to the Gang of Four Design Patterns Book, the Visitor pattern is defined as follows:Represent an operation to be performed on elements of an object structure. Visitor lets you define a new operation without changing the classes of the elements on which it operates.Design Patterns: Elements of Reusable Object-Oriented Software (Gamma, Helm, Johnson, Vlissides)So it’s a typical way to leverage the OCP principle from the SOLID acronym (classes should be open for extension but closed for modifications). It should be possible to define a new operation for (some) classes of an object structure without changing the classes.Aspect definition in TypeScript looks as follows:interface IAspect { visit(node: IConstruct): void; }And after instantiating a class that implements the following interface, we can apply it to the desired scope via this mechanism:const aspect = new SomeAspect(...); construct.node.applyAspect(aspect)With the great power comes great responsibilityOne thing worth mentioning in this context is that this can tremendously complicate your code and understanding. This is especially problematic because it is an approach and uses cases that may complicate and create a convoluted solution.A great heuristic, when to use it when you want to validate a specific prerequisite in a given scope (e.g., tagging, enabling a particular feature across the various applications).ExamplesLet’s start with the adjustments of the example that are described in the official documentation. In our case, it makes much more sense to check if all buckets are encrypted so that we will do so:import * as cdk from '@aws-cdk/core'; import * as s3 from '@aws-cdk/aws-s3'; export class BucketEncryptionChecker implements cdk.IAspect { public visit(node: cdk.IConstruct): void { if (node instanceof s3.CfnBucket) { if (!node.bucketEncryption) { node.node.addError('Bucket encryption is not enabled'); } } } } // ... // Apply to the given construct: app.node.applyAspect(new BucketEncryptionChecker()); Also, under the hood tagging mechanism in AWS CDK uses aspects. In this way, we can also apply a unified strategy for tagging our resources:Tag.add(myConstuct, 'Key', 'Value'); // Or you can apply them based on the resource type: Tag.add(myConstruct, 'Key', 'Value', { includeResourceTypes: ['AWS::Xxx::Yyy'], excludeResourceTypes: ['AWS::Xxx::Zzz'] });SummaryAspects are powerful addition, especially for horizontal (aka cross-cutting concerns) elements affecting many resources across our AWS CDK Applications.However, they look and work so cool that they can be abused very easily. Yet, this is true for almost anything introduced by this tool. Be careful and use it as a seasoning - to not spoil the main dish. 😉'''
author = "Wojciech Gawroński"
year_published = 2020
year_updated = 2020
