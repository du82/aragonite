["https://awsmaniac.com/aws-outages"]
title = "The Complete History of AWS Outages | AWS Maniac"
description = "... at least the most major ones. 😉 This is one of those posts that I wanted to prepare a few years ago. However, I couldn't do that in an approachable form. Now I have found a really viable and interesting visualization, which may help make the topic easier to comprehend. Enjoy!"
full_description = '''The Complete History of AWS Outages<picture><source type='image/webp' srcset="/static/f60bbd7babc7c42993648ef67e820b69/105ae/banner.webp 300w, /static/f60bbd7babc7c42993648ef67e820b69/9d51b/banner.webp 600w, /static/f60bbd7babc7c42993648ef67e820b69/3cc96/banner.webp 1200w" sizes="(max-width: 1200px) 100vw, 1200px" /><source srcset="/static/f60bbd7babc7c42993648ef67e820b69/0a74d/banner.png 300w, /static/f60bbd7babc7c42993648ef67e820b69/fa42c/banner.png 600w, /static/f60bbd7babc7c42993648ef67e820b69/77647/banner.png 1200w" sizes="(max-width: 1200px) 100vw, 1200px" /><img loading="lazy" sizes="(max-width: 1200px) 100vw, 1200px" srcset="/static/f60bbd7babc7c42993648ef67e820b69/0a74d/banner.png 300w, /static/f60bbd7babc7c42993648ef67e820b69/fa42c/banner.png 600w, /static/f60bbd7babc7c42993648ef67e820b69/77647/banner.png 1200w" src="/static/f60bbd7babc7c42993648ef67e820b69/77647/banner.png" alt="" style="position:absolute;top:0;left:0;opacity:1;width:100%;height:100%;object-fit:cover;object-position:center"/></picture>.css-1a66u1g{font-size:0.7rem;font-style:italic;}1 min read, last updated on 2021-12-20IntroductionHow many major outages AWS had in the past? 🤔Such a question hit me in 2017 when Amazon S3 had one of the worst outages in cloud history.So I decided to prepare content about that. The idea appeared in 2017, and yet, we need to have another big one in us-east-1 again, more than 3 years later, to force me to dust off the topic. So I have refurbished the notes I have prepared back then and prepared a timeline.It turned out it was an exciting journey, and I am sharing those results with you down below. I am doing that hoping that it won’t jinx anything. 🙈 Let’s go then!Resourcesdanluu/post-mortems: this is a great source, I strongly recommend it!It’s so great because it’s not only about AWS.AWS Post-Event SummariesMy spreadsheet, that I have used below.TimelineSummaryMy goal was to collect all the most critical outages of AWS cloud that happened over the years. However, did I collect every single one? I doubt it, so I encourage you in the comments to remind me which one I have missed! 🎯Also, I would love to hear horror stories that were the most painful for you personally - I intuitively feel that those most recent, related to Amazon S3 and Amazon Kinesis Data Streams will be at the top. But who knows? Maybe I am wrong? Share yours in the comments below.UPDATE (20.12.2021): I have added the most recent outage that happened in us-west-1 and us-west-2 on 15th of December, and I hope it concludes all outages that we had this year. 😅 I am looking forward to outage-free 2022!'''
author = "Wojciech Gawroński"
year_published = 2021
year_updated = 2021
