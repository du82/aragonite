title = "Privacy Policy | AWS Maniac"
description = "Your email and data are safe with me, and I am not using it for evil purposes because I am a nice guy. If you are not trusting me, you can read everything below. Cheers."
full_description = "Privacy PolicySince you’ve found this page, it means that the security of your data on the Internet is essential to you. Know that I care about the right one’s treatment of your personal data.Respecting your time, I have prepared a shortened version of the most important rules related to privacy protection. If the essential information turns out to be insufficient for you, below, you will find a broader description in which I explain how I handle the personal data entrusted to me by you.Basic informationThe administrator of personal data on the awsmaniac.com website is me, that is: Wojciech Gawroński.You can contact me at any time using the email address: wgawronski [at] white-rook.pl.Remember that providing personal data, as well as consent to their processing, is entirely voluntary. All personal data provided to me are processed only to the extent and for the purpose for which you have given your consent.You have the right to update or completely delete your personal data at any time. You can do it yourself or with my help.I take care of the proper protection of your personal data, guaranteeing that it will be processed only for the purpose for which you have given your consent, stored safely, and not made available to third parties if you have not consented to it.By subscribing to the newsletter or placing an order, you provide me with your personal data, and I guarantee that your data will remain secure and will not be made available to third parties without your express consent.I use analytical tools described below that anonymously collect information about your visits to the website. I also may use devices such as Facebook Pixel and Google AdWords that allow me to display ads to you.As is the case with almost every website, I also use cookies.AdministratorThe administrator of personal data on the: awsmaniac.com, i.e., the entity responsible for ensuring the security of your personal data is:Wojciech Gawroński,e-mail: wgawronski [at] white-rook.plYour rightsCurrent legal regulations grant you a number of rights related to the processing of your personal data:the right to access personal data,the right to rectify personal data,the right to delete personal data,the right to limit the processing of personal data,the right to object to the processing of personal data,the right to transfer data,the right to lodge a complaint with the supervisory body (the President of the UODO),the right to withdraw consent to personal data processing if you have given such consent.Remember that you can always ask me to provide you with more information about what data I have about you and what purposes I process it. All you need to do is send a message to the email address given above.The purposes for which I process your personal dataNewsletterBy subscribing to the newsletter, you provide me with your email address and name via the newsletter’s subscription form. Providing data is voluntary but necessary to subscribe to the newsletter.These data are used to send you the newsletter, and the legal basis for their processing is your consent. The data will be processed for the newsletter’s duration unless you unsubscribe earlier, which will delete your data from the database.You can correct your data stored in my newsletter database at any time, as well as request their removal by resigning from receiving the newsletter.Orders and issuing VAT invoicesWhen ordering any product on the website, you provide me with the data necessary to process the order (name and surname, billing address, email address, telephone number). Providing data is voluntary but necessary to place an order.The data provided to me in connection with the order are processed to fulfill the order, issue an invoice, include it in the accounting documentation, and be used for archival and statistical purposes.Data about orders will be processed for the time necessary to perform the order until the expiry of the limitation period for claims under the contract. After this deadline, the data may still be processed by me for statistical purposes. I am obliged to keep invoices for 5 years from the end of the tax year in which the VAT invoice was issued.In the case of data provided for the purpose of the contract, you cannot object to data processing and request the deletion of data until the expiry of the limitation period for claims under the contract.Complaints and withdrawal from the contractBy submitting a complaint or withdrawing from the contract, you provide me with the personal data in your statement (name and surname, address, telephone number, email address, and possibly bank account number).Providing this data is voluntary, but necessary to submit a complaint or withdraw from the contract. The data provided to me in connection with submitting a complaint or withdrawal from the contract are used to implement the complaint procedure or the procedure for withdrawing from the contract.The data will be processed for the time necessary to implement the complaint procedure or the withdrawal procedure. In the case of data contained in complaints and declarations of withdrawal from the contract, you cannot object to the processing of your data and request the deletion of data until the expiry of the limitation period for claims under the contract.Contact using the formWhen contacting via the contact form, at least you provide me with your email address. It is up to you whether you provide additional data in the content. Providing data is voluntary, but necessary to contact me.In this case, your data is processed to contact you. The basis for data processing is your consent. You have the right to request a history of correspondence, and you may request its removal unless the preservation of the correspondence is justified by my interest (e.g., protection against claims).CommentsThe comment system is operated by Disqus Inc., 301 Howard Street, Suite 300, San Francisco, CA94105, USA. Disqus is an independent administrator of your personal data, and the use of the system is based on your acceptance of Disqus’s terms of service.The data provided when adding a comment is used to publish the comment. The basis for their processing is your consent. The data will be processed for the blog comments’ duration unless you request removal of the comment in advance, which will delete your data from the database.You can correct your data assigned to comment at any time, as well as request its removal and transfer. You can exercise these rights directly under your user account in the Disqus system.Entrusting the processing of personal dataYour data may be processed by third parties to whom I commission the performance of individual activities related to ensuring the website’s proper functioning. Entities to whom I commission the processing of personal data guarantee the use of appropriate measures to protect and secure personal data required by law. Entities entrusted with data processing are:Amazon Web Services (publisher: Amazon Web Services Inc., 410 Terry Avenue North, Seattle, WA 98109-5210, USA) and their privacy policy for services AWS Amplify, Amazon S3, and Amazon CloudFront,ConvertKit (publisher: ConvertKit LLC, 505 W. Idaho Street, Boise, ID 83701, USA) and their privacy policy.Server logsWhen using my website, you send queries to the server on which my website is stored using your device. Logs include IP address, server date and time, information about the web browser and operating system you use. Logs are saved and stored on the server. The server logs are the only auxiliary material used to administer the website. Their content is not disclosed to anyone.The data stored in the server logs are not associated with specific people using the website and are not used to identify specific people.CookiesCookie files (so-called “cookies”) are IT data that is stored on your end device. I use two basic types of cookies on the website: session cookies and persistent cookies. Session cookies are temporary files stored on the user’s end device until logging out, leaving the website, or turning off the software (web browser). Persistent cookies are stored on your end device for the time specified in the cookie parameters or until you delete them.During your first visit to my website, you were shown information about the use of cookies on it. Accepting the message means that you agree to the use of cookies. You can change your cookie settings at any time.The settings for cookies can be changed in particular in such a way as to block the automatic handling of cookies in the settings of the web browser or inform about their every posting on your device. Detailed information on the possibilities and methods of handling cookies is available in the web browser software settings. Remember that disabling or limiting the use of cookies may cause difficulties in using my website.I use my own cookies to:ensuring the proper operation of the website,order processing,adequate function of pop-ups and forms.I also use third-party cookies:Google Analytics (publisher: Google LLC, 1600 Amphitheater Parkway, Mountain View, CA 94043, USA) - to create statistics and analyze them for website optimization,Disqus (publisher: Disqus Inc., 717 Market St. San Francisco, CA 94103) - for blog comments.Changing the security policy and cookiesI reserve the right to make changes to the privacy policy. Changes will be introduced if required by applicable law or the technological conditions of my website change’s functioning. The current text of the privacy policy and archived versions will always be on my website."
author = "Wojciech Gawroński"
year_published = 2020
