["https://awsmaniac.com/aws-cdk-and-tests"]
title = "AWS CDK and Tests | AWS Maniac"
description = "Now we need to talk about testability! AWS CDK gives us unique selling points and mechanisms related to testing."
full_description = '''AWS CDK and Tests<picture><source type='image/webp' srcset="/static/868a1c83f4ea862f23beb51046741c4b/105ae/banner.webp 300w, /static/868a1c83f4ea862f23beb51046741c4b/9d51b/banner.webp 600w, /static/868a1c83f4ea862f23beb51046741c4b/3cc96/banner.webp 1200w" sizes="(max-width: 1200px) 100vw, 1200px" /><source srcset="/static/868a1c83f4ea862f23beb51046741c4b/0a74d/banner.png 300w, /static/868a1c83f4ea862f23beb51046741c4b/fa42c/banner.png 600w, /static/868a1c83f4ea862f23beb51046741c4b/77647/banner.png 1200w" sizes="(max-width: 1200px) 100vw, 1200px" /><img loading="lazy" sizes="(max-width: 1200px) 100vw, 1200px" srcset="/static/868a1c83f4ea862f23beb51046741c4b/0a74d/banner.png 300w, /static/868a1c83f4ea862f23beb51046741c4b/fa42c/banner.png 600w, /static/868a1c83f4ea862f23beb51046741c4b/77647/banner.png 1200w" src="/static/868a1c83f4ea862f23beb51046741c4b/77647/banner.png" alt="" style="position:absolute;top:0;left:0;opacity:1;width:100%;height:100%;object-fit:cover;object-position:center"/></picture>.css-1a66u1g{font-size:0.7rem;font-style:italic;}1 min read, last updated on 2020-12-22Before we move forward, we need to talk about testability. AWS CDK gives us unique selling points and mechanisms related to testing. Let’s review them!The main problem with the Feedback LoopIf you are working with the AWS CloudFormation, you probably do not need to read another paragraph at all - you already feel the pain.When working with templates and iterating with infrastructure scripts, time is crucial. In most cases, we need to update or create a stack, wait, and we will discover errors in the runtime one by one. This is tedious, problematic, and wasteful.With pure CloudFormation, you have to fallback to additional tools or use a totally different tool (e.g., Terraform) to achieve testability and shortening the feedback loop.Luckily, we have exciting options related to testing tools.Unit Testing in AWS CDKWe need to start with an explanation that the unit tests are verifying the generated output and templates. This may sound like a simplistic and crude approach, but actually, it allows for more, as we can perform the following elements:Evaluating differences and snapshots (which represents the frozen state of the infrastructure graph after synthesis).Very precise assertions about resources and their condition.Testing validation rules (e.g., length of the attributes - like name and similar), passed parameters, and constructs.We will see all those techniques in practice in future blog posts!SummaryPlease bear in mind that all we talked about do not invalidate the need for integration tests. It helps with testability. It shortens the feedback loop and builds a safety net for our infrastructure scripts and infrastructure as code.'''
