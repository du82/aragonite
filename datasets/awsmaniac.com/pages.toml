["https://awsmaniac.com/introducing-aws-solutions-constructs"]
title = "Introducing AWS Solutions Constructs | AWS Maniac"
description = "AWS announced that they're presenting a library of predefined CDK constructs available to use. IMHO it is an awaited element that should be available from day zero. Let's investigate what it brings to the table!"
full_description = '''Introducing AWS Solutions Constructs<picture><source type='image/webp' srcset="/static/12547e5a198f20024edb222e9013645c/105ae/banner.webp 300w, /static/12547e5a198f20024edb222e9013645c/9d51b/banner.webp 600w, /static/12547e5a198f20024edb222e9013645c/3cc96/banner.webp 1200w" sizes="(max-width: 1200px) 100vw, 1200px" /><source srcset="/static/12547e5a198f20024edb222e9013645c/0a74d/banner.png 300w, /static/12547e5a198f20024edb222e9013645c/fa42c/banner.png 600w, /static/12547e5a198f20024edb222e9013645c/77647/banner.png 1200w" sizes="(max-width: 1200px) 100vw, 1200px" /><img loading="lazy" sizes="(max-width: 1200px) 100vw, 1200px" srcset="/static/12547e5a198f20024edb222e9013645c/0a74d/banner.png 300w, /static/12547e5a198f20024edb222e9013645c/fa42c/banner.png 600w, /static/12547e5a198f20024edb222e9013645c/77647/banner.png 1200w" src="/static/12547e5a198f20024edb222e9013645c/77647/banner.png" alt="" style="position:absolute;top:0;left:0;opacity:1;width:100%;height:100%;object-fit:cover;object-position:center"/></picture>.css-1a66u1g{font-size:0.7rem;font-style:italic;}2 min read, last updated on 2020-12-22Finally! I think this is an exciting announcement, especially since the community prepared something like this earlier (cdk-patterns). I do not have anything against a community-driven version, but it should be the creator’s responsibility to provide an initial release for it.Let’s investigate what it is and what it gives.What are AWS Solutions Constructs?AWS Solutions Constructs (Constructs) is an open-source extension of the AWS Cloud Development Kit (AWS CDK) that provides multi-service, well-architected patterns for quickly defining solutions in code to create predictable and repeatable infrastructure. The goal is to accelerate developers’ experience to build solutions of any size using pattern-based definitions for their architecture.Definition from the official documentation.In other words: it’s the way to create architecture in an opinionated way with the use of AWS best practices. It is also an excellent presentation of the AWS CDK capabilities (mostly reusability and modularity) and a model example of how it can work.Here, you can browse the full catalog of AWS Solutions Constructs patterns. Additionally, you can review the available examples in the form of the use cases that contain a complete and working implementation of a given problem (e.g., AWS Static S3 Website). So how can we add those to our projects? We need to add a dependency, and use it as a typical CDK construct:const { LambdaToS3 } = require("@aws-solutions-constructs/aws-lambda-s3"); new LambdaToS3(stack, "LambdaToS3Pattern", { lambdaFunctionProps: { runtime: lambda.Runtime.NODEJS_10_X, handler: "index.handler", code: lambda.Code.asset(`${__dirname}/lambda`) } });PitfallsAt the moment there a few problems with the library:AWS Solutions Constructs is supported on AWS CDK ≥ 1.46.0.It supports TypeScript, JavaScript, Python, and Java at this time - so no .NET.Each construct is marked as experimental when it comes to stability. So probably it will evolve, and potential updates may introduce breaking changes.I’d suggest pinning to a particular version, but it may propagate to a problem with AWS CDK versioning, as main can be in a higher version than solution construct, and we may face difficulties.What’s next?I think the first step should be to stabilize a few, the most popular solutions. It is a recent addition to the CDK (22nd of June 2002), so we need to be patient.Nevertheless, that’s something that I expected and wanted. This is a significant improvement in adopting AWS CDK and something that I missed in the AWS CloudFormation space (I do not count the plethora of sparse, official/unofficial templates here and there).'''
author = "Wojciech Gawroński"
year_published = 2020
year_updated = 2020
