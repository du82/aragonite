description = "As a functional programmer by training and passion, I could not resist and test how AWS CDK cooperates with functional languages. In this blog post, we will examine that from the perspective of the F#."
full_description = '''Functional Programming with AWS CDK<picture><source type='image/webp' srcset="/static/8cdf6b14ac3ec30c97d1808b98b0d071/105ae/banner.webp 300w, /static/8cdf6b14ac3ec30c97d1808b98b0d071/9d51b/banner.webp 600w, /static/8cdf6b14ac3ec30c97d1808b98b0d071/3cc96/banner.webp 1200w" sizes="(max-width: 1200px) 100vw, 1200px" /><source srcset="/static/8cdf6b14ac3ec30c97d1808b98b0d071/0a74d/banner.png 300w, /static/8cdf6b14ac3ec30c97d1808b98b0d071/fa42c/banner.png 600w, /static/8cdf6b14ac3ec30c97d1808b98b0d071/77647/banner.png 1200w" sizes="(max-width: 1200px) 100vw, 1200px" /><img loading="lazy" sizes="(max-width: 1200px) 100vw, 1200px" srcset="/static/8cdf6b14ac3ec30c97d1808b98b0d071/0a74d/banner.png 300w, /static/8cdf6b14ac3ec30c97d1808b98b0d071/fa42c/banner.png 600w, /static/8cdf6b14ac3ec30c97d1808b98b0d071/77647/banner.png 1200w" src="/static/8cdf6b14ac3ec30c97d1808b98b0d071/77647/banner.png" alt="" style="position:absolute;top:0;left:0;opacity:1;width:100%;height:100%;object-fit:cover;object-position:center"/></picture>.css-1a66u1g{font-size:0.7rem;font-style:italic;}3 min read, last updated on 2020-12-13.css-1s88ppd{background-color:#fdfd96;color:#2b3d4f;padding:1.2rem 1.7rem 1.7rem 1.7rem;border-radius:4px;margin-left:-0.425rem;margin-right:-0.425rem;margin-bottom:1.55rem;box-shadow:0 0 1rem 0 rgba(0,0,0,0.3);}.css-1go9jo7{display:block;text-align:center;padding-bottom:1rem;font-family:Inter,Arial,sans-serif;font-weight:bold;text-transform:uppercase;}⚠ caution.css-18rs2ws{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:row;-ms-flex-direction:row;flex-direction:row;-webkit-align-content:center;-ms-flex-line-pack:center;align-content:center;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;-webkit-box-pack:space-evenly;-webkit-justify-content:space-evenly;-ms-flex-pack:space-evenly;justify-content:space-evenly;}@media only screen and (max-width:600px){.css-18rs2ws{-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;}}.css-18rs2ws blockquote{color:rgba(255,255,255,0.59);border-left-color:rgba(255,255,255,0.59);font-size:1rem;}.css-18rs2ws a{color:#ff7f76;}.css-18rs2ws small,.css-18rs2ws div{padding-left:1rem;}Today's post is more like a fun experiment, not something production-ready and viable. However, this exercise confirmed my internal feelings about functional programming and provided me an interesting point about safety and correctness.You have been warned. Below, you may read unpragmatic ramblings about types and monads.I’m joking - we will talk about monads only. 😀MotivationAs a functional programmer by training and passion, I could not resist and test how AWS CDK cooperates with functional languages.My choice fell on F# as AWS CDK contains a template for that language, which is available here:https://github.com/aws/aws-cdk/tree/master/packages/aws-cdk/lib/init-templates/app/fsharp$ cdk init app --language=fsharpAfter initialization, we have received a typical F# project for the .NET Core environment. Sweet!The first experience is excellent. So far, so good.What You See Is What You GetThe next one wasn’t so pleasant - and that’s not the language’s fault (you will see in the next section why).The complete source code can be found in my repository with AWS CDK examples. However, let’s focus on the CDK Stack definition:namespace FSharpCDK open Utils open Amazon.CDK open Amazon.CDK.AWS.S3 type FSharpCDKStack(scope, id, props) as this = inherit Stack(scope, id, props) let expireAfter30Days = LifecycleRule(Enabled = Utils.nl true, Expiration = Duration.Days(30.0)) let bucketProps = BucketProps( Versioned = Utils.nl true, LifecycleRules = [| expireAfter30Days |], PublicReadAccess = Utils.nl false, BlockPublicAccess = BlockPublicAccess.BLOCK_ALL, RemovalPolicy = Utils.nl RemovalPolicy.DESTROY) do Bucket(this, "TestBucket", bucketProps) |> ignore ()At first sight, it does not look so different from the other languages (and for sure not so different from C#). But, some subtleties are pissing me off:Too much Nullable<T> - well, this “pattern” from TypeScript leaks here and forces you to do painful conversions using Option<T> or helper functions as I did with Utils.nl.Arrays instead of Lists - sigh, this looks to me as again TypeScript / JavaScript inheritance.Those elements are connected with the behavior of how SDKs for the other languages are generated. Libraries for the different programming languages are created with JSII, which means that JS definition is the foundation for all other SDKs. For sure, it had to introduce some compromises.What I Liked Is What You Don’t SeeHowever, the most significant benefit is related to the functional style of programming and type system. Fluency in writing caused by the combination of those two elements is very pleasant. Declarativeness, referential transparency, immutability, and type system itself help with writing more efficiently.Even that I’m using Visual Studio Code on Linux, still creating smaller and bigger programs felt frictionless. Most of the time, autocompletion and compiler guided me through the whole process.What about the other functional languages?Based on my experience, I am sure that the feeling will be similar for Scala or Clojure. You will face the same obstacles (typical interop with Java libraries).The truth is that if we do not see additional libraries dedicated to cover imperative SDKs, functional programming languages will offer just the traits available in the language itself. In some cases, it may be beneficial, but only if you are familiar with it.Peeking into declarative (functional) worldI hope this short blog post inspired you to look into the exciting world of functional programming languages. You may ask, why bother - and you are partially right. It was a fun exercise, definitely not pragmatic and not for production use.However, I would like to encourage you to expand your horizons. You should know why some things are the way they are. And isn’t infrastructure as code all about the declarative approach?'''
