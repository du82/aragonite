["https://awsmaniac.com/which-programming-language-is-the-best-for-aws-cdk"]
title = "Which Programming Language is the best for AWS CDK? | AWS Maniac"
description = "Controversial question? Well, maybe - however, I will try to find an objective answer for that critical question in the following blog post."
full_description = '''Which Programming Language is the best for AWS CDK?<picture><source type='image/webp' srcset="/static/cd570e41511bcd8072c8b043b2c36065/105ae/banner.webp 300w, /static/cd570e41511bcd8072c8b043b2c36065/9d51b/banner.webp 600w, /static/cd570e41511bcd8072c8b043b2c36065/3cc96/banner.webp 1200w" sizes="(max-width: 1200px) 100vw, 1200px" /><source srcset="/static/cd570e41511bcd8072c8b043b2c36065/0a74d/banner.png 300w, /static/cd570e41511bcd8072c8b043b2c36065/fa42c/banner.png 600w, /static/cd570e41511bcd8072c8b043b2c36065/77647/banner.png 1200w" sizes="(max-width: 1200px) 100vw, 1200px" /><img loading="lazy" sizes="(max-width: 1200px) 100vw, 1200px" srcset="/static/cd570e41511bcd8072c8b043b2c36065/0a74d/banner.png 300w, /static/cd570e41511bcd8072c8b043b2c36065/fa42c/banner.png 600w, /static/cd570e41511bcd8072c8b043b2c36065/77647/banner.png 1200w" src="/static/cd570e41511bcd8072c8b043b2c36065/77647/banner.png" alt="" style="position:absolute;top:0;left:0;opacity:1;width:100%;height:100%;object-fit:cover;object-position:center"/></picture>.css-1a66u1g{font-size:0.7rem;font-style:italic;}3 min read, last updated on 2020-12-22Such questions are sparking heated debates, which are downgrading from a professional dialogue to a squabble in an exponential way. Nevertheless, I will try to answer this question objectively and fairly. Let’s do it!It dependsThat will be a consultant way to answer any kind of question. You’re welcome. No, but really - let’s leave the “consulting mindset” aside. Can we objectively evaluate that?Let’s start with a simple heuristic and observations. My first steps go to the aws-samples/aws-cdk-examples repository on Github where you can see the following distribution of languages: So it looks like Python has the best set of examples, and next is Java. However, there is a trap there, as this language is well-known for its baroquesque and verbose syntax. Disappointed? Well, I said it will be a heuristic - although looking inside directories per language, Python and TypeScript have the broadest possible set of examples.Next, a few more observations:In the official documentation, we can see equal support for all programming languages mentioned in the AWS CDK FAQ.APIs are very similar between languages, but that’s a standard if you think about it, e.g., in the case of AWS SDK, we have the same story.Generally, support looks pretty uniform across languages, but in the documentation, you can find this article:Translating TypeScript AWS CDK code to other languagesTypeScript was the first language supported for developing AWS CDK applications, and for that reason, there is a substantial amount of example CDK code written in TypeScript. If you are developing in another language, it may be useful to compare how AWS CDK code is implemented in TypeScript and your language of choice, so you can, with a little effort, make use of these examples.Official AWS CDK DocumentationOkay, so if TypeScript was the first one, let’s move it to the top of my list regarding the evaluation order.Side note: I am not treating JavaScript as a separate option because CDK heavily relies on types, so it does not make sense to treat it separately as it will be more tedious and error-prone to work with this language.TypeScriptSo here are the following observations regarding this language:(+) Types are definitely a plus and tremendous help.(+) There are dedicated extensions for a rest framework (Jest) with custom assertions.Official guides for testing are covering this language - like here.(+) The most comprehensive documentation.(+) One of the broadest set of official examples.(+) The biggest library of blog posts on the internet.PythonNow it’s time for a snake. 🐍 It looks similarly as TypeScript, but I have observed additionally this:(+) It’s the kinda native language for DevOps Engineers, and thanks to that amount of resources on the internet are not smaller than for TypeScript, and this still grows.(-) Less than ideal support for testing tools.C#C# was added in the second batch, and that’s visible because:(-) It’s supported, but definitely, it is less popular in the community, so there are fewer examples available (both official and unofficial).(-) Less than ideal support in testing tools.(+) You can embrace functional programming via F# because it works really good.JavaLast but not least - it’s time for our baroquesque language. The situation is pretty similar as with the C#:(-) It’s supported, but definitely, it is less popular in the community, so there are fewer examples available (both official and unofficial).(-) Less than ideal support in testing tools.(+) You can embrace other languages - especially my favorite Kotlin.SummaryIn my opinion, the best choice is TypeScript. It just feels native for CDK, probably because it was a first language for the creators. 😉Python is really close to this position, but it still has some small inconveniences. The rest of the languages are a daily uphill battle with documentation and a lack of examples, especially in the beginning.For me, the choice is between Python and TypeScript, and we need to wait for more examples and better tooling around the rest. I firmly believe that eventually, it will behave as well as AWS SDK for various programming languages.'''
