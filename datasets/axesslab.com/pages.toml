["https://axesslab.com/sv/tjanster/tillganglighetsgranskning-av-expert"]
title = "Axess Lab |   Tillgänglighetsgranskning av en expert"
description = "Luta dig tillbaka och låt en expert göra jobbet! Vad du får Titta på en summering utav en av våra tillgänglighetsexperter. https://youtu.be/HbSztfpCjpY Hjälp att uppfylla…"
full_description = "Home/Tjänster/Tillgänglighetsgranskning av en expert Tillgänglighetsgranskning av en expert Luta dig tillbaka och låt en expert göra jobbet! Vad du får Titta på en summering utav en av våra tillgänglighetsexperter. Hjälp att uppfylla WCAG och andra tillgänglighetsstandarder. Och — framförallt — hjälp att göra din produkt användbar för så många som möjligt, oavsett funktionsförmåga. En lista av tillgänglighetsproblem sorterad utifrån prioritet. Lösningsförslag för varje problem. Förslagen består av kodexempel, videor, skärmdumpar och illustrationer. Fullständig tillgänglighetsredogörelse redo att publicera på din webbplats eller app för att uppfylla DOS-lagen. Se vår specifika produktsida för Tillgänglighetsredogörelse – Vi skapar den åt dig. Hur du får resultatet Du avgör vad som passar bäst för dig och ditt team. Kommunicera direkt med utvecklare? Skriftlig rapport? Möten – fysiska eller på distans? Slack? Vi är flexibla! Här får du ett exempel ur en rapport vi gjort för att visa hur det kan presenteras: Pris Du kan välja på tre olika nivåer för en tillgänglighetsgranskning: Stor: WCAG-granskning 75 000 kr (beror på omfång) En ingående, strukturerad granskning som ger dig allt du behöver veta för att nå en tillgänglig produkt som följer WCAG och andra tillgänglighetsstandarder. Vi går igenom närmare 100 kontrollpunkter och testar ingående med en bredd av olika hjälpmedel. Perfekt för dig som har stort fokus på att uppfylla lagkrav. Vill du specifikt ha en tillgänglighetsredogörelse – titta på vår produktsida: Tillgänglighetsredogörelse – vi skapar den åt dig!Jag vill veta mer Mellan 45 000 kr Vår mest populära produkt. Du får en stabil förståelse för de viktigaste tillgänglighetsproblemen och hur du löser dem. Vi utgår från vad som har störst påverkan på användarna och prioriterar resultaten så att du kan lägga fokus på det som gör störst nytta. Jag vill veta mer Liten 22 000 kr En ”quick ’n dirty” granskning som snabbt hjälper dig hitta några av de högst prioriterade problemen. Perfekt om du jobbar i agila projekt och vill lägga in tillgänglighetsgranskning i vissa sprinter. Jag vill veta mer Valbara tillägg Våra rapporter är mycket pedagogiska och innehåller skärmdumpar och förslag på lösningar som hjälper teamet att arbeta med problemen efter att vi är klara med en granskning. Det kan dock fortfarande finnas frågor om hur man bäst löser vissa saker inom kod och design. Och diskussioner om vad lagarna egentligen kräver, och vad som är mer ”nice to have” etc. Då är det skönt att ha en expert som guidar dig! ”Timbank” – stöd från tillgänglighetsspecialist När du beställer en granskning kan du lägga till en ”Timbank” med en av våra specialister för att stötta ditt team under månaderna efter granskningen. De kan skapa en delad Slack-kanal, boka tid för par-programmering eller rådgivningsmöten, eller bara vara tillgängliga på e-post för knepiga frågor. Om vi finns i ditt område kan vi också komma till dig på kontoret en dag i veckan eller mer. Att ha en timbank innebär att ditt team inte lämnas ensamt att hantera rapportresultaten – du har vår expert tillgänglig hela vägen till slutet! Stor timbank 100+ timmar 1100 kr/h Mellan timbank 40-100 timmar 1250 kr/h Liten timbank 10-40 timmar 1500 kr/h Acceptanstest Så, du har fått rapporten och överlämningsmötet från oss, och ditt team har åtgärdat alla problem. Eller – åtminstone tror ni det…. Men är ni säkra? Ofta vill våra kunder att vi ska testa produkten igen när teamet känner sig klara, för att säkerställa att alla problem har åtgärdats framgångsrikt, utan att oavsiktligt introducera nya buggar. Detta tar vanligtvis cirka 30 % av tiden för den ursprungliga granskningen. Och ja – vi brukar upptäcka att vissa saker inte är helt klara ännu, och att några nya utmaningar har dykt upp. Priset är 30 % av den ursprungliga granskningen, till exempel: Stor: WCAG-granskning – acceptanstest 22 500 kr Mellan granskning – acceptanstest 13 500 kr Liten granskning – acceptanstest 6 600 kr Rabatt om du kombinerar med användartester Användartester och tillgänglighetsgranskningar av experter kompletterar varandra väldigt bra. Speciellt om du både vill uppfylla tillgänglighetsstandarder (som du får i våra granskningar) och samtidigt erbjuda en bättre användarupplevelse för alla användare (huvudfokus i våra användartester). Vi vill så gärna att du kombinerar tillgänglighetsgranskning av experter med användartester att vi ger dig en rabatt på 20% på användartesterna om du beställer de här produkterna ihop. Skynda dig och beställ innan vi ändrar oss! 😉 Beställ en tillgänglighetsgranskning Berätta vad du vill beställa genom att mejla hello@axesslab.com eller ringa oss på +46 101 99 41 17. Vem är konsulten? Vi är säkra att du kommer älska att jobba med alla våra experter. De är supercharmiga och världsklass på sitt område. Låt oss veta om du vill prata med dem innan du bestämmer dig, så fixar vi det! Andra liknande produkter Användartester med personer med funktionsnedsättningar Hyr in en tillgänglighetskonsult Utbildning, föreläsning eller workshop om tillgänglighet Alla våra tjänster Hör av dig och berätta hur vi kan hjälpa dig. hello@axesslab.com"
