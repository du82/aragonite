["https://axesslab.com/sv/was-kurs"]
title = "Axess Lab |   WAS-kurs – en förberedande kurs till IAAP certifiering i tillgänglighet"
description = "Att certifiera sig är ett klockrent sätt att både öka din kunskap och stärka ditt förtroendet i ditt arbete för ökad tillgänglighet. Vi hjälper dig ro iland din certifiering!"
full_description = "WAS-kurs – en förberedande kurs till IAAP certifiering i tillgänglighet Att certifiera sig är ett klockrent sätt att både öka din kunskap och stärka ditt förtroendet i ditt arbete för ökad tillgänglighet. Vi hjälper dig ro iland din certifiering! WAS, eller Web Accessibility Specialist (WAS), är en av certifieringarna som International Association of Accessibility Professionals (IAAP) ger ut. Certifieringen är den mest prestigefyllda som finns för tillfället och kräver att du jobbat med tillgänglighet i minst 3 år. Se kommande kursstarter Detta ingår Coaching av en WAS-certifierad tillgänglighetsexpert med över 10 års erfarenhet i branschen 4 studera-ihop-tillfällen á 2 timmar. Du avgör om du deltar på plats eller på distans 50+ övningsfrågor liknande dem på provet En resursbank med allt studiematerial du behöver samlat på ett ställe Stöd i Slack eller annan chattgrupp fram till att du klarat provet Utbildning på svenska (kursen finns även på engelska). Utbildningen är på svenska men kan givetvis anpassas enligt önskemål mot offert. Träffas vi fysiskt så ordnar vi med frukost och lunch så ni kan fokusera på lärandet. Kursen ger en bra grund inför certifieringen eller som komplement till självstudier beroende på tidigare kunskapsnivå. Vi kan givetvis erbjuda fler utbildningar som djupdyker i särskilda delar som känns knepiga. Jag vill veta mer Vad tyckte våra kursdeltagare? Tanken på att ta certifieringen kändes läskig, men efter kursen känner jag mig mycket tryggare och vet vad jag behöver plugga extra på inför provet Pris 1 deltagare: 13 500 kr per person 2-3 deltagare: 11 800 kr per person 4 deltagare eller fler: 10 700 kr per person Tips, anmäl dig ihop med kollegor eller andra företag så får ni billigare pris per person! Boka en utbildning Vi erbjuder också Denna kurs ger många den hjälp de behöver på vägen till certifiering. Andra kan vilja ha lite extra stöd. Vi kan exempelvis ge er offert på andra upplägg som: Fråga vad som helst, när som helst och få blixtsnabbt svar. Vi sätter upp en kommunikationskanal mellan dig och våra experter. Fördjupningspass med särskilt fokus på delar du vill ha hjälp med. Individuell studieplan – få hjälp att lägga upp studierna och planera inför certifieringen. Återupprepning av innehållet dagen innan certifiering. Känns WAS lite för teknisk erbjuder vi även kurs för den bredare CPACC certifieringen. Skicka mig offert Kommande kursstarter Vi har datum för kursstart som du direkt kan fråga chefen om! 9 april 21 maj 28 augusti 30 september Funkar inte dessa datum är det bara höra av dig till oss med ett eget förslag! Anmäl dig på ett kursdatum Hör av dig och berätta hur vi kan hjälpa dig. hello@axesslab.com"
