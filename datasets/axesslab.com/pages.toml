description = "Under 2018 ska vi göra massor av spännande projekt som gör digitala världen mer tillgänglig. Vi letar efter utvecklare med hjärtat på rätt ställe som vill göra skillnad i världen!"
full_description = "Kom och jobba med oss på Axess Lab Publicerad 23 januari 2018, av Hampus Sethfors Under 2018 ska vi göra massor av spännande projekt som gör digitala världen mer tillgänglig. Vi letar efter utvecklare med hjärtat på rätt ställe som vill göra skillnad i världen! © Hampus: stolt fotograf, modell och bildredigerare av denna fenomenala bild! Lite om oss Vi på Axess Lab är en startup som bygger tillgänglig teknik, och vi växer. Vi är 4 nu och ska bli 6-8 under 2018. I år ska vi bland annat bygga en lärplattform för personer med utvecklingsstörning, webbappar för att få fler med funktionsnedsättningar i arbete med mera. Nu kanske du tänker, startup…låg lön, 12 timmars arbetsdagar, inga förmåner. Men vi är förbi den fasen. Vi har kollektivavtal, privatpension, friskvårdsbidrag, bra ersättning och massor av andra vuxenpoäng! Plus att man får jobba med att förbättra världen på riktigt, varje dag, och vara med på en ruggigt kul resa. Kika runt lite här på sajten, särskilt sidorna Artiklar och Produkter så får du nog en bra bild av vad vi pysslar med. Om du gillar att vara engagerad i open source världen så kommer du nog gilla detta också: Paying Employees to Work on Open Source Projects. Hör av dig! Släng iväg ett mail till hampus@axesslab.com med några rader om dig, så tar vi det därifrån! Get notified when we write new stuff About once a month we write an article about accessibility or usability, that's just as awesome as this one! #HumbleBrag Simply drop your email below. Email Email Get notified! Hör av dig och berätta hur vi kan hjälpa dig. hello@axesslab.com"
