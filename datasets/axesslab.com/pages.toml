["https://axesslab.com/sv/tjanster/ux-design-2"]
title = "Axess Lab |   UX-design"
description = "På Axess Lab brinner vi för att skapa exceptionella upplevelser för alla användare. Teama upp med våra grymma User Experience (UX) designers om du vill bygga användbara, vackra och inkluderande digitala produkter!"
full_description = "Home/Tjänster/UX-design UX-design På Axess Lab brinner vi för att skapa exceptionella upplevelser för alla användare. Teama upp med våra grymma User Experience (UX) designers om du vill bygga användbara, vackra och inkluderande digitala produkter! Du kan jobba med våra UX-designers på många olika sätt, men de tre vanligaste aktiviteterna vi gör är: User research Design workshops Prototyping Låt oss titta på dem en och en: User research På Axess Lab har vi alltid användarens behov i centrum. Användarnas beteenden och upplevelser av digital service bör ligga till grund för hur produkter och erbjudanden utformas, och vi har metoder för att mäta och analysera detta. De metoder vi oftast arbetar med är: Användartester med målgruppen Omvärldsanalys av existerande lösningar i området Intervjuer med målgrupper och experter i fältet Workshops med målgrupper och domänexperter En vanlig process är att vi identifierar beteendemönster enligt ovan, skapar användarresor och levererar en färdplan för vad som bör skapas. På detta sätt kan vi utveckla hypoteser för den lösning som skapar störst värde för användarna. Detta låter oss designa en ”Minsta Värdeskapande Produkt” (MVP) som vi kan få tidig feedback på genom till exempel användartester. Sedan itererar (uppdaterar) vi designen med de nya insikterna tills användarna är nöjda. Att testa med användare är en nyckelaktivitet för oss på Axess Lab. Användartester kan baseras på att testa tidiga koncept med skisser eller mer detaljerade funktioner på en färdig tjänst, allt beroende på var i utvecklingsprocessen projektet är just nu. På Axess Lab anser vi att tillgänglighet bör byggas in från början i alla digitala produkter, så vi involverar alltid användare med olika funktionsnedsättningar i våra metoder från intervjuer, workshops och användningstester i designprocessen. Vi lever och andas inkluderande design och älskar att designa tillgängliga produkter som fungerar bättre för alla användare, oavsett funktionsförmåga. Design workshops Vi utför och faciliterar workshops som en del av designfasen i projekt. Till exempel är vi extra förtjusta i ”designstudio” workshops, där teamet, intressenter och användare från målgruppen arbetar tillsammans med UX-designers för att generera idéer och skisser. Det här är ett fantastiskt sätt att hitta många möjliga lösningar och få in flera perspektiv för projektet. När teamet tillsammans hittar och prioriterar lösningar skapar det mervärde för slutresultatet och styr teamet bakom produkten i samma riktning. Vi genomför också workshops om färg och form, funktionalitet, innehåll eller annat som projektet behöver i olika faser. Prototyping När ett grundkoncept har utvecklats konkretiserar våra UX-designers idéerna genom att skapa prototyper. Det gör vi för att snabbt kunna validera eller avfärda hypoteserna om lösningen verkligen löser användarnas utmaningar. Vi gör antingen Lo-Fi-prototyper i form av pappersskisser och testar snabbt och ofta, eller Hi-Fi-prototyper i form av interaktiva prototyper i Adobe XD eller Axure RP. Hi-FI-prototyperna testas med användare och visas i demos för teamet och intressenter i projektet. På detta sätt får vi kontinuerligt feedback som möjliggör iterationer och är nyckeln till att uppnå en användarcentrerad och målinriktad lösning. Om det inte finns några grafiska profiler för projektet kan vi producera designsystem, logotyper, färgpaletter, teckensnitt och komponenter. Vi är också vana vid att arbeta i designsystem som Material UI och anpassa det till användarnas behov av de specifika produkterna vi designar. Eftersom alla UX-designers på Axess Lab är tillgänglighetsexperter är tillgängligheten inbyggd i designfasen! Det hjälper projektet att uppfylla tillgänglighetsbehov som textstorlek, färgkontraster, klickmålstorlekar, logik och innehåll. Naturligtvis testar vi detta med användare med olika funktionsförmåga för att säkerställa att det fungerar bra för alla. Priser Priset vi tar ut för UX-konsulter varierar mellan olika projekt. Mycket beror på uppdragets längd och hur senior eller junior konsulten är. För att ge dig en känsla så landar det vanligen omkring 1300 kr/h + moms. Kontakta oss för att ta diskussionen vidare! Maila gärna till hello@axesslab.com eller ring +46 101 99 41 17 så lyssnar vi på dina behov! Vi jobbar i hela världen men har huvudkontoret i Stockholm, Sverige. Hör av dig och berätta hur vi kan hjälpa dig. hello@axesslab.com"
