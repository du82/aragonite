["https://axesslab.com/sv/vi-anstaller"]
title = "Axess Lab |   Vi anställer!"
description = "Och kanske är du precis den vi letar efter! Du kanske är fantastiskt skicklig i din yrkesroll, gillar att lära dig nya saker och samtidigt bra på att vara dig själv på jobbet. Kanske är du allt det där – men det kan ändå vara så att du skulle föredra en annan arbetsplats än våran."
full_description = "Vi anställer! Och kanske är du precis den vi letar efter! Du kanske är fantastiskt skicklig i din yrkesroll, gillar att lära dig nya saker och samtidigt bra på att vara dig själv på jobbet. Kanske är du allt det där – men det kan ändå vara så att du skulle föredra en annan arbetsplats än våran. Det här kanske är ett konstigt sätt att inleda en jobbannons, men det är sant! Många vi träffar vill ha ett vanligt jobb med en chef som berättar vad du får och inte får göra. En chef som du kan framföra klagomål till och någon som fixar dina problem åt dig. Speciellt om dina problem ligger utanför din komfortzon, som att hantera konflikter på jobbet eller prata med kunder om förseningar i ditt projekt. Vi har inga chefer på Axess Lab Så om du känner igen dig i beskrivningen ovan så vill du förmodligen inte jobba här. Men om du fortfarande läser detta kanske du är intresserad av hur vi driver företaget utan chefer – och varför det leder till en fantastisk arbetsplats för oss som väljer att ta det till hjärtat! Istället för en ny chef får du följande saker första dagen hos oss: En personlig onboarding-plan med uppgifter att genomföra som tar dig genom alla våra processer och system. Ett företagskort utan gränser (gränsen är när vi inte har mer pengar) Full inblick i all finansiell data som löner, priser, aktieägare etc. (Vi har en radikal inställning till transparens) Fullständigt förtroende! Ett första uppdrag att vara med på tillsammans med dina nya kollegor. En lista med nya interna ansvar att välja från, lära dig och sedan börja utföra. Det kan vara t.ex. att ”skicka månatliga tidsrapporter för teamet till lönegruppen” eller ”planera och arrangera konferenser och företagsfester” eller ”hantera annonserna på Google Ads” Fullt ansvar för din egen arbetssituation. Tycker du inte om något? Ändra på det! En mall att använda när du motiverar och sätter din egen lön. Som du kanske förstår krävs det en del mod att anställa någon till Axess Lab! Vi måste vara säkra på att du kommer att kunna hantera det här arbetssättet, men också att du kommer trivas med det! Det är ingen idé att locka folk att börja jobba här som sen bara kommer att sakna att ha en chef när de väl börjar. Betyder ”ingen chef” att alla gör vad de vill? Nej! Tänk så här: när du normalt skulle ”fråga din chef” använder vi istället ”rådgivningsprocessen”. För små beslut som mest påverkar dig själv – gör det bara! För större beslut som berör andra: fråga en kollega med mer erfarenhet i frågan om råd – anpassa planen efter feedback och sen är det bara att göra det! Vi förväntas alla lägga omkring 10-20 % av vår tid på att arbeta med företagsrelaterade ansvar på lång sikt. Heltidsuppdrag är såklart OK, och en vanlig situation för oss konsulter. Men om alla gör heltidsuppdrag hela tiden så måste vi lösa frågan – vem ska hinna betala lönerna? Tänk på att vi inte har några chefer! Allt eftersom tiden går, och i takt med att kollegorna blir säkrare i sina yrkesroller, tar de på sig fler och svårare företagsansvar. Men det gör dem inte till en chef med makten att tvinga andra anställda att göra saker! Du kan föreslå förbättringar och göra dem för dig själv, men aldrig tvinga någon annan att göra dem. Så om du vill få till förändring måste du övertyga kollegor och kunder med bra argument och inspirerande ledarskap 😀 Vad gör vi när vi inte driver företaget? Det är upp till dig! Vi lyssnar alltid på vad som driver oss som jobbar här. Och det kan såklart ändras från år till år. I dagsläget har vi som jobbar här en sak gemensamt – vi är väldigt duktiga på teknik och har erfarenhet av mjukvaruutveckling, design eller projektledning. Vi vill också använda vår kunskap för att göra nytta i världen. Det har lett oss till att fokusera på digital tillgänglighet – att se till att webbplatser och appar fungerar bra för personer med funktionsnedsättning. Vi bygger dem och hjälper andra att bygga dem. Vi testar befintliga produkter och tjänster och hjälper våra kunder göra förbättringar så att deras produkter kan användas av alla. Vi utbildar och vi inspirerar. Vi sprider budskapet om digital tillgänglighet på alla sätt vi kan! Betyder det att vi alltid kommer att arbeta enbart med tillgänglighet? Inte nödvändigtvis! Om vi ​​får nya idéer och inspiration i andra riktningar, och dessutom hittar sätt att få dem hållbara som företagsinsatser så kan vi göra dem! Det finns ingen chef som anger en ”vision” som alla måste följa. Istället lyssnar vi. Vi lyssnar på marknaden – vad kunderna vill ha och behöver. Vi lyssnar på våra kollegors ambitioner – vad vill vi lära oss härnäst? Vi lyssnar på användarna – vad skulle hjälpa dem mest? Sedan anpassar vi oss. Vi förändras och vi utvecklas, lite som en levande organism som anpassar sig till sin omgivning. Men för tillfället, med en växande marknad och den känsla av mening vårt arbete ger så kommer vi nog att jobba mycket med digital tillgänglighet ett tag till 😀 Vad skulle du göra här? Just nu letar vi efter: Tillgänglighetsspecialist Frontend utvecklare Native utvecklare (iOS/Android) Om du inte matchar rollerna perfekt men tror att du skulle passa bra för oss ändå, skicka gärna en spontanansökan till hello@axesslab.com Oavsett vilken roll du har när du kommer in på företaget förväntas du driva företaget tillsammans med oss. Så istället för att tänka ”Någon annan borde fixa det här!” eller ”Det står inte i min arbetsbeskrivning” så får du makt, stöd och medel att genomföra förändringar själv! Och behöver du hjälp – fråga! Vi är väldigt hjälpsamma och förstående på Axess Lab! Behöver du lite tid att plugga på något innan du påbörjar ett uppdrag? Gör det! Behöver du gå en onlinekurs för att kunna ta ett nytt ansvar internt – gör det! Mjuka värderingar Vi bryr oss mer om att hitta rätt personer till teamet än om du har exakt rätt buzzwords på ditt CV, de kan man alltid lära sig! Här är en lång lista med yrkes- och personlighetsdrag som vi värderar högt på Axess Lab. Om du identifierar dig med många av dem är det ett bra första steg – men du behöver inte checka av allihopa! Förmedlar information så att andra lätt förstår den Får människor att engagera sig Agerar självständigt vid behov Hjälper andra aktivt Samarbetar med andra för att gemensamt lösa en uppgift Hanterar information och flera arbetsuppgifter parallellt Prioriterar utifrån helheten, vad som behöver göras och i vilken ordning Väljer den väg som tillför störst värde till företaget Bygger och stärker relationer Planerar och arbetar systematiskt Startar och driver aktivt förändringsarbete Utforskar utvecklingspotential Söker och vågar pröva okonventionella perspektiv och idéer Vi är alla hjälpsamma människor så om du någon gång känner dig osäker på något – fråga bara! Förmåner Vi är ett litet företag, men våra förmåner är mogna! Marknadslöner (dem sätter du själv ansvarsfullt) Kollektivavtal (Fremia) ITP1-pensioner Flexibla arbetstider för att förenkla livet Lägg till semesterdagar eller extra pension om du föredrar det framför extra lön 5000 kr/år friskvård Ditt eget kreditkort – köp allt du behöver för att jobba – och för att trivas på jobbet! Extra 10% föräldralön Arbeta var som helst (vi har dock ett centralt beläget kontor – använd det gärna) Utbildningar – hitta dem, köp dem, gör dem – använd kortet! Ta med barn och husdjur till kontoret <3 Mötestider anpassade till ”föräldralivet” Inga chefer! Det här sättet att jobba på – utan chef med mycket frihet under ansvar är inte för alla! Men vi tror att vi talar för alla på företaget när vi säger: Vi vill inte byta tillbaka! Josefin Wessman – Tillgänglighet & UX Hampus Sethfors – Tillgänglighet & strategi Daniel Göransson – Tillgänglighet & kod Hör av dig och berätta hur vi kan hjälpa dig. hello@axesslab.com"
