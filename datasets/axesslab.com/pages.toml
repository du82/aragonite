title = "Axess Lab |   CPACC training – preparation course for IAAP accessibility certification"
description = "Become CPACC certified to increase your knowledge and strengthen your confidence in working with accessibility. We will help you get there! CPACC, or Certified Professional…"
full_description = 'CPACC training – preparation course for IAAP accessibility certification Become CPACC certified to increase your knowledge and strengthen your confidence in working with accessibility. We will help you get there! CPACC, or Certified Professional in Accessibility Core Competencies, is one of the certifications offered by the International Association of Accessibility Professionals (IAAP). Axess Lab recommends this as a first certification in the accessibility field, as the content is general and fit most roles in your organization. See upcoming course dates About the course This course provides a solid foundation for certification or as a supplement to self-study, depending on your previous knowledge. If there are parts of the course that you find particularly difficult, we can offer deeper training sessions too. You will learn about: Disabilities. Accessibility and universal design. Accessibility-related standards, laws, and management strategies. This is included Our CPACC certified accessibility specialists will mentor you. 1 Course day in person or remote (10:00 – 15:00). If we meet in person, we’ll arrange breakfast and lunch so you can focus on learning. We offer the education in English and Swedish. Before the course day Self study material before the course day. 10 sections of 10–20 minutes each. After the course day 50+ practice questions similar to the exam. Deque CPACC course for self studies included. Support in booking a certification date. A nice accessibility t-shirt when you have booked certification date. I want to know more Course content video <span data-mce-type="bookmark" style="display: inline-block; width: 0px; overflow: hidden; line-height: 0;" class="mce_SELRES_start">﻿</span><span data-mce-type="bookmark" style="display: inline-block; width: 0px; overflow: hidden; line-height: 0;" class="mce_SELRES_start">﻿</span> What did our attendees say? A very good go-through and even though there were many hours I felt that it was not too much information to handle. Really good with the self study questions and to receive a clear overview over the setup and basic understanding of its content. I was also inspiring and fun! Perfect start on the journey to become the most inclusive company! A very good and inspiring course 🙂 Pricing 1 attendee: €800 per person 2 or 3 attendees: €750 per person 4 attendees or more: €660 per person Want a lower price? Register with colleagues or other companies to get the best deal. Book a course Please not that the cost for certification at IAAP is not included in the preparation course fee. We also offer This course offers many the help they need on the road towards certification. Others might want some extra support. This may consist of: Ask anything. Get answers super fast. We’ll set up a communication channel between you and our experts. In-depth sessions with a focus on the parts of the course you need help with. Individual study plan: Get help to set up your self-studies and plan for certification. Repetition of the course contents the day before certification. We also offer prep-courses for WAS-certification. Send me an offer Upcoming course dates We have course dates you can ask your boss about today! March 20th Book before February 4th to allow time for the preparatory parts. April 9th Book before March 6th to allow time for the preparatory parts. May 7th Book before April 4th to allow time for the preparatory parts. June 11th Book before May 6th to allow time for the preparatory parts. September 18th Book before August 13th to allow time for the preparatory parts. October 30th Book before September 19th to allow time for the preparatory parts. November 19th Book before October 16th to allow time for the preparatory parts. December 10th Book before November 6th to allow time for the preparatory parts. If these dates do not suit you, feel free to contact us with your own suggestion. Sign up for a course date We work world wide, if you need help send us an email! hello@axesslab.com'
