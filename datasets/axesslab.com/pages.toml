["https://axesslab.com/accessibility-tshirts"]
title = "Axess Lab |   Accessibility T-shirts! Look like the a11y nerd you are"
description = "It’s well known in the accessibility community that the road to an inclusive digital world is through awareness. And what better way to raise awareness than wearing an awesome, head-turning accessibility t-shirt?"
full_description = "Accessibility T-shirts! Look like the a11y nerd you are Published 23 February 2019, by Hampus Sethfors It’s well known in the accessibility community that the road to an inclusive digital world is through awareness. And what better way to raise awareness than wearing an awesome, head-turning accessibility t-shirt? Before we begin, you might be wondering how much we get paid to write this post. It’s zero. Zip. Nada. Just hopefully the admiration from other fellow accessibility nerds! So let’s dive in! A11y cats Flaunt your love for accessibility, cats and puns (alley cats..get it?!). Put this on your Tinder profile and you’re good to go! Get A11y cats t-shirt on Bonfire The future is accessible t-shirt Thinking about the future is can be scary these days. Finally, you have the chance to spread some positivity! Get this future t-shirt on Redbubble You can get a more sparkling version of the same statement. Get the sparkling future t-shirt on etsy Moose in wheelchair t-shirt We might be a bit partial since we’re based in Sweden, but moose are just irresistible! Almost as irresistible as everyone who’s working with accessibility. Perfect match! Get your moose t-shirt on Teepublic (there are also versions on the site with other animals like giraffes and even dinosaurs!) WCAG t-shirt Perfect for walking around the office quizzing colleagues. Do they know where the words come from? If not, send them off to accessibility training! Get your WCAG t-shirt at Redbubble Inclusive coder t-shirt Display your passion for accessibility alongside html, css and javascript. Get your inclusive coder t-shirt from Scott Vinkle Batman in wheelchair t-shirt A superhero t-shirt for all the superheroes working with inclusive design! Get your wheelchair batman t-shirt on Teepublic Wonderwoman in a wheelchair t-shirt From the same independent designer that brought you the Batman design above. Get your Wheelchair Wonder Woman t-shirt on Teepublic Accessibility matters t-shirt It’s not easy to find t-shirts raising awareness of hidden impairments like autism. But luckily we found this one! A great reason to go get it is that “50% or more of the proceeds from this design are donated directly to disabled individuals who are fundraising for a mobility aid or other accessibility device.” Get the accessibility matters t-shirt at Bonfire Closed captions t-shirt Videos lacking closed captions is one of the major accessibility issues on the web. This cc t-shirt gives you a great chance to talk about closed captions with everyone who asks what the “cc” means! Get your cc t-shirt at Redbubble Sign language be kind t-shirt While on the topic of hard-of-hearing-awareness, check out this great message in American sign language (ASL). Get your sign language t-shirt at Amazon Wheelchair trick t-shirt Finally, let’s challenge the classic sitting-still-in-a-wheelchair-disability-icon with this great print! Get your wheelchair trick t-shirt on Teepublic Whether or not you decide to buy this t-shirt: take a minute of your life to check out the guy who probably inspired it: Aaron “Wheelz” Fotheringham. Keep spreading awareness! Hope you found something to upgrade your wardrobe with, at the same time spreading some accessibility awareness. If you know of any other prints that you think we should add to the article, please tweet us and we’ll add them! Meanwhile, if you’d like to dig deeper into digital accessibility, check out our other articles. We guess that if you’ve made your way down here you’d appreciate some of our more nerdy posts. So here are a few of those: Disabled buttons suck Text splitting causes screen reader problems How to make your site accessible for screen magnifiers Your skip links are broken Get notified when we write new stuff About once a month we write an article about accessibility or usability, that's just as awesome as this one! #HumbleBrag Simply drop your email below. Email Email Get notified! We work world wide, if you need help send us an email! hello@axesslab.com"
