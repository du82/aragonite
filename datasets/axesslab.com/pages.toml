["https://axesslab.com/switches"]
title = "Axess Lab |   Assistive Technologies  – The Switch"
description = "A switch is an assistive technology primarily used by people with motor impairments to access and control computers, smartphones, electric wheelchairs, smart home appliances and more. Let’s look at some switches in action and go through how you design switch friendly interfaces."
full_description = "Assistive Technologies – The Switch Published 19 February 2018, by Hampus Sethfors A switch is an assistive technology primarily used by people with motor impairments to access and control computers, smartphones, electric wheelchairs, smart home appliances and more. Let’s look at some switches in action and go through how you design switch friendly interfaces. So what is a switch? At its core, a switch is simply a way for a user to activate a control. This can be done in multiple ways, and different users prefer different switches. The classic example of a switch looks like a big round button: This type of switch can be placed in the users’ hands, by their head, elbows, feet or wherever they feel most comfortable with it. On the screen, there’s usually a focus indicator moving automatically across the different objects, and the user clicks by activating the switch. Some users have multiple switches and can use one to move the cursor forward and another for clicking. Video editor Christopher Hills has multiple switches placed on his head rest. Here’s a video where he shows how he uses his switches together with Apple Switch Control. World famous theoretical physicist Stephen Hawking used a handheld switch, or “clicker”, earlier in his life. But as his control of his hand muscles decreased due to his Amyotrophic lateral sclerosis (ALS), he now uses a “cheek-switch”. If you look closely, you can see it in the video below. It’s a black sensor just below his glasses. So he moves his cheek to activate the switch. On Stephen’s screen, a focus cursor will move across his computer’s interface automatically, and he moves the cheeck-sensor to activate the object in focus. Most operating systems integrate with switches right out of the box, with no need to download special software or apps. For example, Apple devices have a setting called Switch Control (Settings, General, Accessiblity, Switch Control) and Android devices have Switch Access (Settings, Accessibility, Switch Access). You can use a Bluetooth keyboard with an iOS or Android device to try it out yourself. Or buy a switch, the cheapest ones cost around € 100. Another type of switch is a “Sip-and-puff”. In this case, the users activate the switch by either inhaling – sip – or exhaling – puff. Usually these types of switches come with a lip-controlled joystick that moves the mouse cursor on the screen. Here’s Mark Willits demonstrating how he uses a sip-and-puff switch Jouse in combination with voice recognition software and an on screen keyboard. https://www.youtube.com/watch?v=4_e_0fI7i3A Here’s a similar product, Integramouse. Not only people with motor impairments use switches. Some people with intellectual or learning impairments can find keyboards or game controllers too complex. They use switches to play simple games, communicate using digital boards or quickly access their favorite sites. How to design switch-friendly interfaces Here are some things for developers and designers to think about when designing digital interfaces for switch users. Make your interface keyboard accessible. That is, make sure you can control it only using the tab, space and arrow keys of your keyboard. If that doesn’t work, then switch users most likely will run into trouble. Place key information, buttons and links “above the fold” – visible without scrolling. Scrolling usually requires a lot more time and effort for switch users. With iOS Switch Control, a user needs to activate the switch seven times to scroll: 2 clicks to see the interaction menu, 3 clicks to navigate and activate the scroll and 2 clicks to remove the menu. Don’t require hover, click-and-drag or other advanced gestures. Although most switch interfaces have functionality for these gestures, they take a lot of effort to carry out and many less tech-savvy users will not know about them. Use a large text size as default. Many switch control users physically can’t lean close to a screen to read tiny, italics text. Avoid time limits. It will take most switch control users longer to complete a form or navigate your interface. So avoid using time limits. But if you do, make sure to give the user a way of increasing the time and give them a warning long before time’s up. There are – of course – more things to consider when creating switch accessible interfaces, but I think that is enough detail for this introductory article. Get in touch if you want a more complete checklist on switch accessibility: hello@axesslab.com! Hope you learned something new! Thanks for reading and leveling up your accessibility know-how! Get notified when we write new stuff About once a month we write an article about accessibility or usability, that's just as awesome as this one! #HumbleBrag Simply drop your email below. Email Email Get notified! We work world wide, if you need help send us an email! hello@axesslab.com"
