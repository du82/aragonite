["https://axesslab.com/accessible-tech-queue"]
title = "Axess Lab |   Accessible tech example: Queue management system"
description = "Standing in line isn’t fun for anyone, but it’s often extra annoying for people with low vision due to inaccessible technology. In a pharmacy in Stockholm we found an awesome, simple solution by Qmatic. Check out this 13 seconds video (captioned) to see it in action!"
full_description = "Accessible tech example: Queue management system Published 20 June 2017, by Hampus Sethfors Standing in line isn’t fun for anyone, but it’s often extra annoying for people with low vision due to inaccessible technology. In a pharmacy in Stockholm we found an awesome, simple solution by Qmatic. Check out this 13 seconds video (captioned) to see it in action! <p>Your browser don't seem to allow iframes.</p> What’s usually the problem? Below are some tasks that can be tricky for people with low vision when it comes to queue management systems: Where do I press? Physical buttons are easy to find, but today many have moved over to touch screens. What number is on my note? Usually the font is pretty big, but for people who are blind or have limited vision it can be impossible to read. What number is now being served? Often there is just a sound notifying that a new number is being served, but requires good vision to see the actual number. How they solved it Qmatic solved this with a few simple features: A tactile overlay on the touch screen, with braille writing for “low vision”. Even though most people with low vision can’t read braille, they’ll notice that it’s there and understand it’s for them. A machine voice speaks the number on the note when it’s printed. A machine voice speaks the number that is now being served. A great feature for anyone who doesn’t want to take their eyes of their phone! Placed at a “wheelchair-friendly” height, with a tilt so that tall, standing people also can access it. Great job Qmatic. This is a textbook example of how a few simple features can create an inclusive product and improve the user experience for everyone! Need help with making your tech accessible? Just contact us at hello@axesslab.com or say hi to us on Twitter @axesslab. Get notified when we write new stuff About once a month we write an article about accessibility or usability, that's just as awesome as this one! #HumbleBrag Simply drop your email below. Email Email Get notified! We work world wide, if you need help send us an email! hello@axesslab.com"
