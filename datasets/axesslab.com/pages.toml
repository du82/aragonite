title = "Axess Lab |   Accessibility consultants"
description = "Let's work together! Get accessibility consultants on your team to help you succeed in building accessible and usable products. What you'll get One or more…"
full_description = "Home/Services/Accessibility consultants Accessibility consultants Let’s work together! Get accessibility consultants on your team to help you succeed in building accessible and usable products. What you’ll get One or more awesome accessibility consultants at your disposal! Working with your team to make sure you build an inclusive, accessible and usable product that complies with WCAG, ADA and other standards. Help with what you need most right now. It could be coding, accessibility review, design feedback, content, user testing or something else. Tell us what you need and we’ll find you a great match. A perfect service if you work in lean and agile projects. Decide together on which activities to prioritize before each sprint. Price We usually charge by the hour. The price depends on the number of hours you want: Less than 40 hours: 120 euros per hour. 40-100 hours: 110 euros per hour. Over 100 hours: 99 euros per hour. Get the price in your currency (xe.com). We work worldwide. Learn more by sending us an e-mail! Who are the accessibility consultants? We’re confident you’ll love all our consultants! They are super charming and awesome at their work. We offer accessibility experts with long and proven experience, most of them with certifications in digital accessibility like CPACC and WAS. Let us know if you want to chat with them before deciding, and we’ll set it up. Make an order or ask us anything Get in touch by mailing hello@axesslab.com or call us at +46 101 99 41 17. Other similar products Accessibility review by an expert Training, workshops and talks on accessibility User testing with people with disabilities All our services We work world wide, if you need help send us an email! hello@axesslab.com"
