title = "Axess Lab | Konsulter inom digital tillgänglighet, granskningar och utveckling"
description = "Konsulter inom digital tillgänglighet, granskningar och utveckling"
full_description = "Vi är experter inom digital tillgänglighet, låt oss jobba tillsammans. Vi jobbar med att göra livet enklare för så många människor som möjligt genom att skapa tillgängliga produkter som alla kan använda. Kontakta oss Vad vi erbjuder Våra konsulttjänster Tillgänglighet Föreläsningar Workshops Användartest Tillgänglighets­redogörelse WCAG-granskning Tillgänglighetstjänster UX-design Research Koncept Användartest Workshops Wireframing UX-design-tjänster Utveckling Front-end Back-end Projektledning React Angular Ren vanilla JS Utvecklartjänster WCAG och användningstester För att personer med funktionsnedsättning ska kunna använda dina webbplatser och appar måste de följa kraven i WCAG. Vi hjälper dig gärna testa tillgängligheten och säkra att alla krav är uppfyllda, så att alla kan använda dina fantastiska produkter! Vi har även lång erfarenhet av användningstester och vi specialiserar oss på mångfald. Det betyder att vi även testar med användare med olika funktionsnedsättningar för att se till att dina produkter fungerar för alla. Nu gör vi även tester på distans via Zoom eller Teams! Läs mer om våra erbjudanden Artiklar Vi skriver artiklar om tillgänglighet på engelska. Easily check for web accessibility problems in ten minutes or less Does making your website accessible feel a bit intimidating or overwhelming? Are you unsure where to begin? Don’t worry, here are a few quick steps to look for low-hanging fruit, with no technical expertise required! Läs artikel European Accessibility Act (EAA) – What you need to know June 28, 2025. That’s the deadline for all banking services and e-commerce in the EU to be fully compliant with the European Accessibility Act (EAA). Here’s a straight-to-the-point summary of what you need to know! Läs artikel European Accessibility Act (EAA) – Kiosks, touch screens and physical devices In June 2025, the European Accessibility Act will be enforced. Most of the buzz is around websites and apps, but many physical devices will also be covered by the new legislation. Let’s look at that more closely and create some buzz around the accessibility of touch screens and other physical devices! Läs artikel Accessible QR Codes – The Ultimate Guide You may think QR codes are great for securing your login, or letting users read more online about a product marketed in a newspaper ad. But there’s a high risk of creating barriers for people with disabilities unless you use QR codes correctly. This article is your ultimate guide to accessible QR codes! Läs artikel Apple Vision Pro – with 1% vision I got a chance to try out the Apple Vision Pro for an hour. Having a vision impairment myself, I obviously dove straight into the accessibility settings to find out if this new, hyped technology would work for me. Let’s go through how it went. Läs artikel Alla Artiklar"
