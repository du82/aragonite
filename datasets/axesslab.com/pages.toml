title = "Axess Lab |   Om oss"
description = "På Axess Lab gör vi viktiga saker som leder till en mer tillgänglig och inkluderande värld. Vad vi gör Vi hjälper andra skapa produkter som…"
full_description = "Om oss Vad vi gör Vi hjälper andra skapa produkter som är tillgängliga och användbara. Vi kan hjälpa dig med utveckling, interaktionsdesign, användartester och tillgänglighetsgranskningar som hjälper dig uppfylla både dina användares behov och tillgänglighetsriktlinjer som WCAG, DOS-lagen och Tillgänglighetsdirektivet. Vi sprider medvetenhet och kompetens om digital tillgänglighet. Vi gör det genom att hålla föreläsningar, workshops och utbildningar. Vi bygger teknik som är enkel att använda tillsammans med personer med funktionsnedsättningar. Vi fokuserar ofta på kognitiva funktionsnedsättningar som autism och ADHD. Resultatet blir teknik som fungerar bra för alla, oavsett funktionsförmåga. Axess Lab heter formellt ”Axessibility Lab AB” och vårt huvudkontor ligger i centrala Stockholm. Jobba hos oss Vi letar alltid efter duktiga utvecklare och tillgänglighetsspecialister, särskilt i Stockholm! Läs mer om hur det är att jobba på Axess Lab och vilka roller vi söker just nu på sidan Vi anställer. Vilka vi är Sarah Skinner Rådgivare. 0793-528010 sarah@axesslab.com Hampus Sethfors Tillgänglighetsspecialist (CPWA). hampus@axesslab.com Karin Skog Tillgänglighetsspecialist och projektledare. karin@axesslab.com Joel Holmberg Tillgänglighetsspecialist och VD. joel@axesslab.com Daniel Göransson Tillgänglighetsspecialist och frontendutvecklare. daniel@axesslab.com Emilia Michanek Tillgänglighetsspecialist och frontendutvecklare (CPACC). emilia@axesslab.com Edson Carvalho Tillgänglighetsspecialist och frontendutvecklare. edson@axesslab.com Josefin Wessman Tillgänglighetsspecialist (WAS) och UX designer. josefin@axesslab.com Erik Gustafsson Tillgänglighetsspecialist (CPWA). erik@axesslab.com Erik Lindh Backendutvecklare (CPACC) erik.lindh@axesslab.com Anders Söderström Tillgänglighetsspecialist (CPWA) och frontendutvecklare. anders@axesslab.com Karin Toft Tillgänglighetsspecialist (CPWA) och frontendutvecklare. karin.toft@axesslab.com Nicko Syropoulos Produkt