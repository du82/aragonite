description = "Behöver du ett utvecklingsteam för att bygga din nya hemsida eller app? Då har du hittat rätt! Våra utvecklare, UX-designers och projektledare kan hjälpa dig bygga robusta, högpresterande och tillgängliga digitala produkter från grunden."
full_description = "Home/Tjänster/Utveckling och projektledning Utveckling och projektledning Behöver du ett utvecklingsteam för att bygga din nya hemsida eller app? Då har du hittat rätt! Våra utvecklare, UX-designers och projektledare kan hjälpa dig bygga robusta, högpresterande och tillgängliga digitala produkter från grunden. Våra utvecklingsteam lever och andas agil mjukvaruutveckling. De har byggt prisbelönta produkter och våra tidigare kunder verkar ganska nöjda med oss *humble brag*: I’m so happy with this product and how well it was received. You’re a fantastic team to work together with. Every one of you have been crucial for this project ❤️ Can’t thank you enough for your hard work this spring – for your tireless engagement to make this product accessible to everyone! Hooray! Such an unbelievable feeling and so great to have worked together with all of you. We’re such a power team! Stoked about continuing to work together! Våra utvecklare jobbar med ett brett spektrum av tekniker och språk så som: Java React Angular 5+ Heroku SQL Circle CI Spring HTML5 CSS WordPress SiteVision Och kom ihåg: när du jobbar med oss så kommer tillgänglighet inbyggt! Tidigare projekt Här är några tidigare projekt som våra utvecklare, scrum masters och projektledare är stolta över att ha skapat. Dit-i-tid SMS-påminnelser Ett missat möte är frustrerande, både för besökaren och arrangören. Med Dit-i-tid kan du som arrangerar möten hjälpa dina besökare komma ihåg mötet, hitta dit och komma i tid. Med ett leende på läpparna! Spara pengar, tid och energi med tillgängliga digitala påminnelser. Dit-i-tid:s webbplats Sparade möten: 11 058 Funkify Simulera funktionsnedsättningar på webben Vill du bygga en tillgänglig webbplats? Har du svårt att validera om en underleverantör uppfyller tillgänglighetskraven du gav dem? Testa din webbplats med Funkify, en simulator som gör att du snabbt och enkelt hittar och förstår tillgänglighetsproblem och du man fixar dem. Funkify:s webbplats (på engelska) Förmedlade insikter: 19 757 ResLedaren Reseplanerare för kollektivtrafiken Missar du eller någon du känner ofta bussen? Eller glömmer att ta med dig plånboken när du får bråttom iväg till tåget? Med den tillgängliga reseplanerare ResLedaren får du påminnelser och stöd före och under resor i kollektivtrafiken. Så att du känner dig trygg och har kontroll under resan. Ladda ner appen gratis: ResLedaren på App Store ResLedaren på Google Play Förenklade resor: 114 427. DigiJag Skol- och livsplattform DigiJag är en plattform för skolan och vuxenlivet för svenskar med intellektuell funktionsnedsättning. Plattformen erbjuder ett enkelt gränssnitt mot internet, kommunikation med vänner och bekanta, stödfunktioner i realtid samt tillgång till en bredd av appar. Apparna hjälper till att hantera pengar, relationer, kommunikation med mera, och kan kopplas till mål i vardagen eller till läroplanen för särskolan. Plattformen följer med användaren ut i livet även efter skolan för att tillgängliggöra den digitala världen och ge stöd så länge det behövs. Läs mer om Digijag Resultat: Under utveckling Anlita oss! Släng iväg ett mail till hello@axesslab.com eller ring +46 101 99 41 17 så ser vi hur vi kan hjälpa till. Om du letar efter UX-designers så har vi duktiga sådana också: UX designers Hör av dig och berätta hur vi kan hjälpa dig. hello@axesslab.com"
