["https://axesslab.com/sv/utbildning-forelasning-eller-workshop-om-tillganglighet"]
title = "Axess Lab |   Utbildning, föreläsning eller workshop om tillgänglighet"
description = "Digital tillgänglighet kan kännas nytt och läskigt men våra pedagogiska och certifierade utbildare hjälper till att göra det greppbart, enkelt och kul! Jag hade en…"
full_description = "Home/Tjänster/Utbildning, föreläsning eller workshop om tillgänglighet Utbildning, föreläsning eller workshop om tillgänglighet Digital tillgänglighet kan kännas nytt och läskigt men våra pedagogiska och certifierade utbildare hjälper till att göra det greppbart, enkelt och kul! Jag hade en helt annan inställning till tillgänglighet innan kursen, men det ändrades snabbt. Nu upplever jag det som jätteviktigt och nåt som jag definitivt ska inkludera i mitt framtida arbete. Vad du får Interaktiv utbildning, workshop och/eller föreläsning av en tillgänglighetsexpert. På plats eller online. De tekniker och den kunskap som behövs för att lyckas med tillgänglighet och inkluderande design. Skräddarsytt innehåll utifrån ditt teams behov. Introduktion eller djupdykning? För utvecklare, designers eller beslutsfattare? 1 timme eller 2 dagar? Vi skapar ett innehåll och upplägg som passar dig. Vi är flexibla och kan göra allt från små anpassningar till skräddarsydda workshops för just din organisation, prata med oss bara, så hittar vi tillsammans bästa lösningen för er! Men lita inte bara på oss..! Här kommer några citat från utvärderingar av några av de hundratals utbildningar, föreläsningar eller workshops vi gjort: 10 av 10! Jättebra engagemang och höjdpunkten av konferensen! En av de bästa utbildningar jag nånsin varit på. Att jobba med tillgänglig design känns väldigt viktigt, och efter den här utbildningen känns det som jag har ett ess i rockärmen i mitt framtida UX arbete. Kursledaren var toppen och man kan verkligen känna att han brinner för det han jobbar med. Det var väldigt inspirerande! Utbildningen var precis på rätt nivå, med både information och inspiration, både visioner och hands-on. Och med fokus på verkliga användare och riktiga exempel. Utbildningar för team Det här är utbildningssessioner och inspirerande föreläsningar vi gör live eller online för din organisation eller dina team. Vissa begränsningar av antalet deltagare kan gälla för att säkerställa att vi har tid för interaktioner och frågor från publiken. Prisintervall: 19 000 – 39 000 Introduktion till digital tillgänglighet Tillgänglig design Tillgänglig kod Tillgänglighetstester Tillgängligt innehåll och sociala medier Tillgängliga dokument och mallar Tillgänglighet för mobilappar Tillgänglighetsstrategi Enastående presentation, så rolig och informativ. Har massor av grejer som jag tar tillbaka till jobbet. Vi gör även inspirationsföreläsningar som är perfekta för konferenser och event, och innehållet kan anpassas till era produkter, vilket verkar uppskattas: Att låta någon med sin egen synnedsättning testa vår produkt och förklara problemen var verkligen, verkligen värdefullt! Måste bara säga TACK för att du tar upp riktiga exempel från vår sida. 🏅Det gav oss mer tillgänglighetsfeedback på 3 minuter än vi har fått under de senaste 3 åren totalt. För mer information, maila hello@axesslab.com! Workshops för team Workshops eller workshopserier är bra för team som har en grundläggande förståelse för vad tillgänglighet är men vill ha mer praktisk träning i hur man jobbar med det. Dessa workshops kombinerar insikter, kunskap, tekniker och processer för att hjälpa teamet att leverera tillgängliga resultat! Vi skräddarsyr ofta workshops för att matcha era behov, så prata med oss för att få ett förslag! Här är några vanliga workshops vi gjort ofta: Uppföljningsworkshop för team inom offentlig sektor (x2) Efter en introduktion till digital tillgänglighet känner många team i stora organisationer sig fortfarande osäkra på vilken del av en organisations tillgänglighet som är deras ansvar och vad ”andra kommer att lösa”. Denna workshopserie kommer att lära varje specifikt team vad de kan och bör göra – var deras ansvar börjar och slutar. Krav – Vi klargör vilka delar av lagen som påverkar detta team och deras produkt eller tjänst, samt vad deras ansvar är. Grundläggande tekniker – Tillsammans tittar vi på verktyg och tekniker som teamet kan använda idag för att säkerställa att de uppfyller åtminstone några grundläggande krav på tillgänglighet. I ett introduktionsmöte anpassar vi workshopen till din organisationsstruktur och dina krav tillsammans med dig. Efter dessa workshops kommer dina team att vara igång med några grundläggande tester och förbättrade processer, men de kommer inte att vara experter! Så när din organisation är redo för det rekommenderar vi att nästa steg är våra rollspecifika utbildningar för utvecklare, testare, designers och redaktörer. För mer information, maila hello@axesslab.com! Praktisk workshop för mjukvaruteam (x4) En kombination av övningar som lär ett team både varför tillgänglighet är viktigt, vad de behöver göra och hur man gör det! Möt användarna – träffa riktiga användare som använder din produkt med skärmläsare och annan hjälpmedelsteknik, och fråga dem vad som helst! Lär dig hur man testar – att hitta tillgänglighetsproblem är 90 % av arbetet. Tillsammans tittar vi på verktyg och tekniker som ni kan använda för att själva testa tillgänglighet redan idag! Fixa buggar tillsammans – Tillsammans med tillgänglighetsspecialister får ditt team fixa några av sina konkreta tillgänglighetsbrister i realtid och lär sig hur man undviker dem i framtiden! Hur håller vi igång det här? – En strategisk workshop om ansvar i teamet, nästa steg och processer som behövs för att säkra tillgängligheten långsiktigt! För mer information, maila hello@axesslab.com! Workshop – ”Live audits” (x3+ beroende på omfattning) I den här workshopserien kombinerar vi granskning av din programvara med att utbilda ditt team. Vi gör detta genom att bjuda in ditt team att sitta med oss medan vi granskar tillgängligheten för din programvara, pausar för frågor och lär ut specifika tekniker medan vi jobbar. Perfekt för QA, testare och utvecklare som vill lära sig att testa tillgänglighet själva och bli mer självgående. Det sista tillfället är en genomgång av de slutliga resultaten där du kan bjuda in andra i organisationen att vara med och ställa frågor. På det här sättet får du en genomförd tillgänglighetsgranskning när vi är klara, samtidigt som du har utbildat ditt team! För mer information, maila hello@axesslab.com! Interaktivt tillgänglighetslabb (halvdagsworkshop) Vi anordnar ett interaktivt tillgänglighetslabb där du får lära dig om tillgänglighet hands-on genom att testa tekniska hjälpmedel som skärmläsare, switchar och eye-tracking. Workshopen leds av två tillgänglighetsexperter, där minst en av dem använder hjälpmedel själv. Väldigt trevligt att få prova på olika hjälpmedel och att träffa användare som använder dem! Utbildningar för individer Om du vill förbättra ditt CV, öka din kompetens och kanske till och med bli certifierad i tillgänglighet så är dessa kurser för dig! De kan göras på distans och spridas ut över en längre studietid. Material och övningar skickas till dig via mail, och vi träffas för en avslutande workshop innan proven så att du kan ställa eventuella frågor och öva tillsammans med en certifierad specialist! De flesta av våra utbildningar ovan kan arrangeras för privatpersoner också, kontakta oss om du är intresserad så planerar vi ett datum och bjuder in andra att vara med. Om tillräckligt många anmäler sig så genomförs kursen! 🙂 Vi har några vanliga kurser med datum tillgängliga året runt: Förberedelse för IAAP:s CPACC-certifiering (100% lyckas med certifieringen efter vår kurs!) Förberedelse för IAAP:s WAS-certifiering Förberedelse för IAAP:s ADS-certifiering För mer information, maila hello@axesslab.com! Online Vi har möjlighet att genomföra alla våra utbildningar, workshops och föreläsningar på distans. En del verkar till och med föredra oss online än i person… Enda fördelen med pandemin har varit era online dragningar… Beställ Berätta vad du vill ha genom att mejla hello@axesslab.com eller ring oss på +46 101 99 41 17. Liknande produkter Hyr en tillgänglighetskonsult Tillgänglighetsgranskning av en expert Alla våra tjänster Hör av dig och berätta hur vi kan hjälpa dig. hello@axesslab.com"
