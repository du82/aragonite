title = "Axess Lab |   Tillgänglighetsredogörelse – vi skapar den åt dig!"
description = "Ska du ta fram en tillgänglighetsredogörelse inom ramen för Webbdirektivet? Våra certifierade tillgänglighetsexperter hjälper dig gärna genom processen! Axess Lab har varit en kunnig partner vi verkligen…"
full_description = "Home/Tjänster/Tillgänglighetsgranskning av en expert/Tillgänglighetsredogörelse – vi skapar den åt dig! Tillgänglighetsredogörelse – vi skapar den åt dig! Ska du ta fram en tillgänglighetsredogörelse inom ramen för Webbdirektivet? Våra certifierade tillgänglighetsexperter hjälper dig gärna genom processen! Axess Lab har varit en kunnig partner vi verkligen har kunnat lita på. Kommunikationen och upplägget var både tydligt och välorganiserat. Leveransen överskred våra förväntningar och vi har nu en tydlig väg framåt för att öka användarupplevelsen och tillgängligheten på vår webbplats. – Anna Zaborna-Ahlvik Lagen Enligt lagen om tillgänglighet till digital offentlig service (DOS-lagen) ska alla offentliga aktörers webbplatser, dokument, appar, interna system med mera vara tillgängliga. Mer precist ska de uppfylla den europeiska standarden EN 301 549 som – när det kommer till webbinnehåll – pekar på WCAG 2.1 nivå AA. Utöver detta ska användare kunna ”flagga” tillgänglighetsproblem och en redogörelse ska publiceras och uppdateras regelbundet där ni bland annat redovisar tillgänglighetsstatusen gentemot dessa krav. Detta kan kännas klurigt och omvälvande – särskilt att kartlägga status gentemot tillgänglighetskraven. WCAG och EN 301 549 är nämligen långa och relativt komplexa standarder. Som tur är kan våra IAAP certifierade tillgänglighetsexperter detta som rinnande vatten och leder er gärna genom processen! Vad vi kan hjälpa er med Vi inleder alltid med ett uppstartsmöte där vi lyssnar på era behov och anpassar insatsen efter dem. Men följande brukar vara våra huvudaktiviteter: Analysera er sajt utifrån de lagkrav som krävs av Webbdirektivet – alltså WCAG 2.1 nivå AA och EN 301 549 Skapa en prioriterad lista av problem och åtgärdsförslag Hjälpa er sätta ihop en tillgänglighetsredogörelse enligt myndigheten DIGG:s krav, redo att publiceras på er webbplats! Avsluta med ett överlämningsmöte där vi går igenom resultaten och svarar på era frågor Pris Omfattningen på sajten och vilka delar ni vill ha hjälp med att granska påverkar priset en hel del. Men om vi tänker oss en vanlig kommuns externa webbplats – exklusive e-tjänster och dokument — brukar det landa på omkring 86 000 kr + moms. Beställ eller fråga mer Hör av dig till oss på hello@axesslab.com eller +46 101 99 41 17 och berätta lite mer om vad du är ute efter, så tar vi det därifrån! Hör av dig och berätta hur vi kan hjälpa dig. hello@axesslab.com"
