full_description = "Articles Easily check for web accessibility problems in ten minutes or less Does making your website accessible feel a bit intimidating or overwhelming? Are you unsure where to begin? Don’t worry, here are a few quick steps to look for low-hanging fruit, with no technical expertise required! Read article European Accessibility Act (EAA) – What you need to know June 28, 2025. That’s the deadline for all banking services and e-commerce in the EU to be fully compliant with the European Accessibility Act (EAA). Here’s a straight-to-the-point summary of what you need to know! Read article European Accessibility Act (EAA) – Kiosks, touch screens and physical devices In June 2025, the European Accessibility Act will be enforced. Most of the buzz is around websites and apps, but many physical devices will also be covered by the new legislation. Let’s look at that more closely and create some buzz around the accessibility of touch screens and other physical devices! Read article Accessible QR Codes – The Ultimate Guide You may think QR codes are great for securing your login, or letting users read more online about a product marketed in a newspaper ad. But there’s a high risk of creating barriers for people with disabilities unless you use QR codes correctly. This article is your ultimate guide to accessible QR codes! Read article Apple Vision Pro – with 1% vision I got a chance to try out the Apple Vision Pro for an hour. Having a vision impairment myself, I obviously dove straight into the accessibility settings to find out if this new, hyped technology would work for me. Let’s go through how it went. Read article Inaccessible Marketing Emails Suck! I hate to see how many marketing emails that go to waste and frankly, suck! It really has irritated me throughout the years – so much it became my contribution to Axe-con 2024 and this article. Read article Top seven free color contrast checkers & analyzers Here are seven great free tools that help you measure color contrasts and create beautiful, accessible color schemes that fulfill the contrast requirements in the Web Content Accessibility Guidelines (WCAG). Read article Toggles suck! You’ve all seen them, tiny switches that let you toggle a setting. And maybe, just like me, you sometimes pause, thinking “…Is it on or off?” That’s because toggles suck! Read article Screen reader quick guide Looking for a free quick guide, a “cheat sheet” or a “one pager” for screen reader testing? You’ve come to the right place! Read article 143.75% font size sucks Interacting with our fan base is a fulfilling part of my job. Yesterday I got a request to write an article on why the font size on this site sucks. So let’s not waste any time and get straight to it! Read article Testing is a scary word Can you keep a secret? Here’s why you should keep testing your product with users, but not say that’s what you’re doing. Basically – how to test with users without anyone knowing! Read article What’s new in the European EN-standard update from 2.1.2 to 3.2.1? In the EU, the laws on digital accessibility for the public sector all point to a standard called EN 301 549. It’s been updated, and here in Europe a lot of people who work with web sites and apps are asking what this means for them. Read article The foot-in-door-somersault-strategy. Making accessibility laws your superpower Accessibility is exciting, user-centered and should make you jump out of bed each workday morning with a proud grin on your face. Accessibility legislation is boring, text-centered and makes you snooze your alarm at least four times before getting up. But let’s see how to use the boring laws to get to do exciting, high impact work! Read article Parent accessibility I’m a dad since a few weeks back. This means I spend my days trying to keep a tiny, helpless lump of life alive. Scary stuff! I’ve also realised that this dad-thing comes with a ton of accessibility needs. Read article Takeaway apps: Do they deliver accessibility? The world has changed due to Covid-19. A lot of people are in quarantine, voluntary or involuntary. Shops and restaurants are closed or have new rules to restrict crowding. One way to support local restaurants is to buy prepared meals in takeaway apps. But, how are these takeaway apps in terms of accessibility? Read article Neumorphism – the accessible and inclusive way There’s a new kid in design town: neumorphism. It’s predicted to become a big design trend ahead. Let’s look at what neumorphism is, the potential accessibility pitfalls and how to use it responsibly. Read article Becoming a climate positive company At Axess Lab we strive to make the world more accessible for people with disabilities. But what’s the point of an accessible world if we can’t survive in it? Read article What is a screen reader? A screen reader is an assistive technology, primarily used by people with vision impairments. It converts text, buttons, images and other screen elements into speech or braille. Let’s go through what a screen reader is, how it works and see blind people in action! Read article Videos of people with disabilities using tech There is no better way to understand the importance of accessibility and inclusive design than learning from actual users with disabilities. Here’s a collection of our favorite YouTube videos where people showcase how they use assistive technologies like screen readers, eye tracking, zoom and switches. Read article I used switch control for a day Stephen Hawking used something called a switch to communicate, author books and surf the web. Just like Stephen, millions of people around the world with motor impairments use switches to access technology. Sadly, the awareness and knowledge about this assistive technology is generally low. So it’s time to switch the spotlight on switch users! Read article Last impressions first – a flipped approach to web design Web teams usually spend a tremendous amount of time, money and energy on designing lovely, beautiful start pages. Let’s apply the psychological concept known as the peak-end rule to question that and introduce a flipped approach to web design. Read article Apple’s new feature a step towards digital apartheid To be honest, I don’t really have time to write this article. I’ve got loads of other things I should be doing. But it needs to be written. Now. So I’ve popped up my laptop on the bus and am angrily typing away. Read article Accessibility T-shirts! Look like the a11y nerd you are It’s well known in the accessibility community that the road to an inclusive digital world is through awareness. And what better way to raise awareness than wearing an awesome, head-turning accessibility t-shirt? Read article Axess Lab just got a 5-Star rating on Clutch Axess Lab is a team of IT professionals who want to make life easier for everybody. And it seems to be working! Read article Real Facts about the Elderly and the World Wide Web There are lots of stereotypes about the elderly and tech or the world wide web. Many portray the over-sixty crowd as being unable to cope with modern tech. Read article Instagram – You’ve been Axessified! Hi Instagram! We’re thrilled to see you’re improving your accessibility by making it possible to write alt-texts for images. As a token of appreciation, we’ve made you part of our Axessified-series! This means you get some top-notch, tailored inclusive design tips to help you take the next step on your accessibility journey! Read article Slides from Accessibility Scotland Hey Accessibility Scotland! I like you guys even though you invented golf… Read article Accessible Comics A lot of the accessibility initiatives today are focused on web sites and apps. But there’s of course more to the digital world than that. In this article we’ll look at a case where a team has done great work to make their digital comic accessible to people with visual impairments. Read article LGBTQ-inclusive web design It’s pride week here in Stockholm, Sweden! So we thought we’d celebrate by sharing a few tips on how to create a LGBTQ-inclusive digital environment. Read article Your skip links are broken Many websites have an accessibility feature called skip links that help some users navigate the site. However, there’s a problem with basically all skip links on mobile devices, which hurts your site’s accessibility instead of improving it. Read article Hand tremors and the giant-button-problem In this article we’ll examine an overlooked accessibility problem that mainly affects users with hand tremors. It’s in almost every interface out there, but barely ever highlighted in accessibility guidelines or discussions. It’s also super easy to fix! Read article Text Splitting Causes Screen Reader Problems I am a screen reader user, and I am annoyed! I repeatedly encounter the same problem on websites. It’s about text splitting up. Let me share my agony with you! Read article Assistive Technologies – The Switch A switch is an assistive technology primarily used by people with motor impairments to access and control computers, smartphones, electric wheelchairs, smart home appliances and more. Let’s look at some switches in action and go through how you design switch friendly interfaces. Read article Title Texts Suck Many people I meet think title texts, also known as tooltips, improve both the accessibility and usability of their sites. They don’t. In fact, they can even cause problems. Let’s see why! Read article Paying Employees to Work on Open Source Projects Open source is awesome and even though we’re a startup we’ve found a way to pay our employees to contribute to the community. Here’s how and why we do it. Read article Our Top Articles 2017 It’s been a great 2017 at Axess Lab! We celebrate by listing our most popular articles all year. Read article Practical Examples of Accessibility Improvements “It would be great to see actual examples of accessibility in action. Like before and after accessibility improvements.” I got this great comment from a woman in the audience at a meetup. So let’s make that idea a reality! Read article “Our Users Have no Disabilities” There are a lot of unfortunate misconceptions about people with disabilities. Many trickle down into IT-teams who use them as arguments not to care about accessibility. So it’s time to set some things straight! Read article 5 Ways to Make Your App More Accessible Users spend a large portion of their days in apps. However, there is not yet as much focus on app accessibility as web accessibility. It’s time to change that! Read article iPhone X – Welcome Screen Inaccessible to Blind Users I just got the new iPhone X. To my surprise, the first impression was not good at all for me as a user with a visual impairment. Apple usually don’t let me down, but now they seem to have made blunder. Read article Captchas Suck Captchas were invented to protect websites from spam. However, like the well-meaning invention of nuclear fusion, captchas too got some unethical and destructive side effects. Here’s why captchas suck and what to do instead. Read article Trends That Exclude Jumping on a new trend is risky business, both in fashion and web design! Here is why trends often hurt the user experience and exclude users with disabilities. I’ll also go through what you can do to avoid this from happening. Read article Alt-texts: The Ultimate Guide This post contains everything you need to know about alt-texts! When to use them and how to perfectly craft them. By me, Daniel, a web developer with vision impairment who use a screen reader in my day-to-day life. Read article Charming interfaces – make your users smile Using charm and humor in interfaces is a hugely underestimated technique that can make the user experience delightful, memorable and sharable. Here’s how to design, write and illustrate your way to smiling users! Read article Web Accessibility Directive – What it is and how to comply Worried about the new directive on accessibility that you need to follow? Great, you’re in the right place! Here’s everything you need to know about the directive and a seven step guide on how to comply. Read article Statistics on disabilities – the one stat you need to know We often get asked how many people have a disability. So here is everything we think you need to know about the statistics. Read article Skip the WCAG! User test with people with disabilities instead If you’re trying to make your website or app accessible, you’ve probably stumbled over the Web Content Accessibility Guidelines (WCAG). But don’t waste your energy trying to understand them. Just don’t. Read article Accessible datepickers Datepickers often cause problems to assistive technology users and fail several basic criteria in the Web Content Accessibility Guidelines (WCAG). But datepickers can – and should – be made accessible. Here is how to do it and a few examples you can steal or get inspired by! Read article Colorblind Accessibility on the Web – Fail and Success Cases It’s Colorblind Awareness Day today! To celebrate, we raise awareness by giving you some practical examples of how design can hurt or help users with color vision deficiencies. Read article Fonts don’t matter If you’re an art director or font fanatic, you might want to sit down for this. Take a few deep breaths. Go to your happy place. Because I’m going to explain why fonts are overrated and what actually matters for readability. Read article"
