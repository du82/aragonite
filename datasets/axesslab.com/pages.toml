description = "Att certifiera sig är ett klockrent sätt att både öka din kunskap och stärka ditt förtroendet i ditt arbete för ökad tillgänglighet. Vi hjälper dig ro i land din certifiering!"
full_description = "CPACC kurs – Förberedelse inför IAAP certifiering Att certifiera sig är ett klockrent sätt att både öka din kunskap och stärka ditt förtroendet i ditt arbete för ökad tillgänglighet. Vi hjälper dig ro i land din certifiering! CPACC, eller Certified Professional in Accessibility Core Competencies, är en av certifieringarna som International Association of Accessibility Professionals (IAAP) ger ut. Vi rekommenderar ofta att börja med denna certifiering då den är mer generellt utformad och då passar de flesta roller på företaget. Se kommande kursdatum Om kursen Kursen ger en bra grund inför certifieringen eller som komplement till självstudier beroende på tidigare kunskapsnivå. Vi kan givetvis erbjuda fler utbildningar som djupdyker i särskilda delar som känns knepiga. Du får lära dig om: Tillgänglighet och universell design. Funktionsnedsättningar. Standarder, lagar och ledningsstrategier. Detta ingår IAAP-certifierad kursledare som både utbildar och coachar dig rätt. En lärarledd utbildningsdag på plats eller online (10:00 – 15:00). Träffas vi fysiskt så ordnar vi med frukost och lunch så ni kan fokusera på lärandet. Utbildning på Svenska (utbildningen finns även på Engelska). Inför utbildningsdagen Material för självstudier innan utbildningsdagen. 10 avsnitt där du tar dig genom varje avsnitt på runt 10-20 minuter. Efter utbildningsdagen 50+ övningsfrågor liknande dem på provet. Deque CPACC kurs för självstudier inkluderad. Stöd att boka certifiering. En fin tillgänglighets T-shirt när du bokat certifiering. Jag vill veta mer Video om kursens innehåll Vad tyckte våra kursdeltagare? Väldigt bra genomgång och trots att det var många timmar kände jag inte att det blev för mycket info eller för svårt att ta till sig. Så bra med studiefrågorna och att få en tydlig överblick över upplägget och en grundförståelse för innehållet! Det kändes också inspirerande och kul! Perfekt start på resan mot att bli det mest inkluderande företaget! En riktigt bra och inspirerande utbildning 🙂 Pris 1 deltagare: 9 000 kr per person 2-3 deltagare: 8 500 kr per person 4 deltagare eller fler: 7 500 kr per person Tips, anmäl dig ihop med kollegor eller andra företag så får ni billigare pris per person! Boka en utbildning Avgiften för certifiering hos IAAP ingår inte i kostnaden för denna förberedande kurs. Vi erbjuder också Denna kurs ger många den hjälp de behöver på vägen till certifiering. Andra kan vilja ha lite extra stöd. Vi kan exempelvis ge er offert på andra upplägg som: Fråga vad som helst, när som helst och få blixtsnabbt svar. Vi sätter upp en kommunikationskanal mellan dig och våra experter. Fördjupningspass med särskilt fokus på delar du vill ha hjälp med. Individuell studieplan – få hjälp att lägga upp studierna och planera inför certifieringen. Återupprepning av innehållet dagen innan certifiering. Vi har även förberedelsekurs i WAS-certifiering. Skicka mig offert Kommande kursdatum Vi har kursdatum som du direkt kan fråga chefen om! 20 mars För att hinna med förberedelsemoment i lugn och ro, boka helst innan 4 februari. 9 april För att hinna med förberedelsemoment i lugn och ro, boka helst innan 6 mars. 7 maj För att hinna med förberedelsemoment i lugn och ro, boka helst innan 4 april. 11 juni För att hinna med förberedelsemoment i lugn och ro, boka helst innan 6 maj. 18 september För att hinna med förberedelsemoment i lugn och ro, boka helst innan 13 augusti. 30 oktober För att hinna med förberedelsemoment i lugn och ro, boka helst innan 19 september. 19 november För att hinna med förberedelsemoment i lugn och ro, boka helst innan 16 oktober. 10 December För att hinna med förberedelsemoment i lugn och ro, boka helst innan 6 november. Funkar inte dessa datum är det bara höra av dig till oss med ett eget förslag! Anmäl dig på ett kursdatum Mer om CPACC Krav på certifiering kommer allt oftare med i uppdragsbeskrivningar och upphandlingar som skall- och börkrav. Är du certifierad ger det en fördel jämfört med konkurrenter. IAAP Nordic CPACC information på Svenska. Hör av dig och berätta hur vi kan hjälpa dig. hello@axesslab.com"
