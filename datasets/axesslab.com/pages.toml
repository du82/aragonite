["https://axesslab.com/sv/checklista-for-skarmlasare"]
title = "Axess Lab |   Checklista för skärmläsare"
description = "Letar du efter en gratis snabbguide, en ”cheat sheet” eller en ”one pager” för hur man testar mjukvara med skärmläsare? Då är du på rätt plats!"
full_description = "Checklista för skärmläsare Publicerad 15 februari 2023, av Joel Holmberg Letar du efter en gratis snabbguide, en ”cheat sheet” eller en ”one pager” för hur man testar mjukvara med skärmläsare? Då är du på rätt plats! Där är den! Eller en bild av den i alla fall, det riktiga dokumentet finns tillgängligt via en länk längre ner. Så varför skapade vi den här? Vi är tillgänglighetsspecialister. Varje dag träffar vi teams som är nya till digital tillgänglighet. Teams som behöver börja ta små steg och lära sig testa sin mjukvara med några grundläggande hjälpmedel som personer med funktionsnedsättning använder. De flesta guider är långa och tunga och går igenom alla specialfunktioner som en skärmläsare har och det gör det svårt för nybörjare att veta vad de ska fokusera på! Med det här dokumentet försöker vi lösa det! Checklistan beskriver de funktioner som hjälper dig hitta den absoluta majoriteten av alla tillgänglighetsbrister som skärmläsaranvändare stöter på i din app eller webbplats, utan att du behöver lära dig alla detaljer om skärmläsare. Men det finns flera olika skärmläsare! Den vi visar här är för ”Windows Narrator”, men självklart har vi även en för JAWS, NVDA, VoiceOver och Talkback. Säg till så kan vi skicka över en sådan också, eller få tillgång till alla i vårt dokumentpaket ”checklistor”. Den här checklistan och andra liknande finns tillgängliga i vårt checklist-paket som vi erbjuder kunder som just inlett sin tillgänglighetsresa och som behöver en snabb och enkel kickstart. Den inkluderar rakt-på-sak en sida långa checklistor som: Checklistor skärmläsare Testa browserinställningar checklista Checklista för front end utvecklare Checklista för UX-designers Checklista för text & språk Checklista för innehåll och media Checklista för lagkrav i EU Checklista för lagkrav i USA Alla är skapade för att fungera som ett första enkelt steg som får igång teamet att jobba med digital tillgänglighet. Vi vet att checklistor inte är en heltäckande lösning för att nå inkludering i mjukvaruutveckling, eller att långsiktigt tackla digital tillgänglighet i organisationen! Användartester är troligen det absolut viktigaste för att säkra att allt fungerar för dina användare, vilket du kan läsa mer om här: Användartester med personer med funktionsnedsättning. Du kan också kontakta oss för hjälp med tillgänglighetsgranskningar och utbildningsinsatser av olika slag. Med det sagt så tycker vi att det finns en tid och en plats för checklistor som den ovan också. Glad läsning! Snabbguider för skärmläsare Skärmläsare snabbguide (Windows Narrator) Skärmläsare snabbguide (VoiceOver på macOS) Textversion av snabbguiden på bilden Skärmläsare Windows Narrator Starta / avsluta Ctrl + Windows + Enter Stega mellan element Caps lock + pilhöger / vänster Stega mellan klickbara element Tab / Shift + Tab ”Klicka” Retur / mellanslag Sökläge på/av Caps lock + mellanslag Nästa / föregående landmärke Sökläge → “D” / Shift + “D” Nästa / föregående rubrik Sökläge → “H” / Shift + “H” Hur testar jag? Blunda eller stäng av din skärm! Hittar du runt i gränssnittet, eller tappar du bort dig? Finns det landmärken och rubriker där du förväntar dig? Klarar du av att genomföra era vanligaste use case? OBS! Sökläge slås på automatiskt ibland så om kommandona ovan inte fungerar, slå av sökläget! Tips! Ctrl = Sluta prata! Get notified when we write new stuff About once a month we write an article about accessibility or usability, that's just as awesome as this one! #HumbleBrag Simply drop your email below. Email Email Get notified! Hör av dig och berätta hur vi kan hjälpa dig. hello@axesslab.com"
