full_description = "Home/Tjänster/Hyr in en tillgänglighetskonsult Hyr in en tillgänglighetskonsult Att samarbeta är alltid ett framgångsrecept! Låt oss hjälpa ditt team lyckas bygga tillgängliga och användbara produkter. Vad du får En tillgänglighetsexpert i ditt team. Som jobbar med dig för att hjälpa dig bygga en inkluderande, tillgänglig och användbar produkt. Hjälp med det du behöver precis nu. Det kan vara kodande, tillgänglighetsgranskning, designåterkoppling, innehåll, användartester eller något annat. Berätta för oss vad du behöver så hittar vi rätt person för dig. En perfekt tjänst för dig som jobbar i agila projekt. Avgör tillsammans vilka aktiviteter som prioriteras innan varje sprint. Pris För att komma igång väljer du om du behöver en konsult på 100%, 50% eller 25%. Du kan också börja litet med en timbank. Köper du en lite större timbank får du rabatt: Mindre än 40 timmar: 1 500 kr per timme. 40-100 timmar: 1250 kr per timme. Mer än 100 timmar: 1100 kr per timme. Vem är konsulten? Vi är säkra att du kommer älska att jobba med alla våra experter. De är supercharmiga och världsklass på sitt område. Vi anställer bara personer med lång och beprövad erfarenhet. Låt oss veta om du vill prata med dem innan du bestämmer dig, så fixar vi det! Hur beställer jag detta? Berätta vad du önskar genom att mejla hejsan@axesslab.com eller ring oss på +46 101 99 41 17. Andra liknande produkter Tillgänglighetsgranskning av en expert Användartester med personer med funktionsnedsättningar Utbildning, föreläsning eller workshop om tillgänglighet Alla våra tjänster Hör av dig och berätta hur vi kan hjälpa dig. hello@axesslab.com"
