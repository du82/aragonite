title = "Axess Lab |   Användartester"
description = "Låt användare med funktionsnedsättningar testa din produkt. Det är utan tvekan den bästa och säkraste vägen till ett mer användbart och tillgängligt gränssnitt för alla användare, oavsett funktionsförmåga."
full_description = "Home/Tjänster/Användartester Användartester Låt användare med funktionsnedsättningar testa din produkt. Det är utan tvekan den bästa och säkraste vägen till ett mer användbart och tillgängligt gränssnitt för alla användare, oavsett funktionsförmåga. Vad du får Din produkt blir testad av en grupp användare med olika förmågor. Till exempel personer med autism, svag syn och nedsatt motorik. Videoklipp från testerna. En prioriterad lista med problem och åtgärdsförslag. Presentation av resultaten från en av våra tillgänglighetsexperter. Bilder från tester En bild säger mer än tusen ord, så här kommer några foton från tidigare användartester vi genomfört. En blind användare navigerar sin iPad med en punktskriftdisplay: En äldre person använder en app för e-böcker: En ung man med nedsatt motorik använder ögonstyrning för att navigera på nätet och kommunicera: Varför det här är den bästa produkt vi har Att testa med användare med funktionsnedsättningar ger dig insikter som både kommer förbättra användbarheten och tillgängligheten på din produkt. Det är till och med bättre än att användartesta med personer utan funktionsnedsättningar (engelsk bloggartikel vi skrivit). Upplägg Vi jobbar alltid tillsammans med dig för att avgöra vilka uppgifter som ska testas och på vilka enheter. Varje testsession är ungefär 45 minuter långa och skärm och ljud spelas in. Du får både en vidoesammanfatting och alla videos från testsessionerna. Om du vill delta under testerna säg till så fixar vi det. Du avgör hur du vill ha resultaten. I en skriftlig rapport? Kommunicerade direkt till ditt team? Skypemöte? Vi är flexibla. Några av våra case Europeiska unionens råd Vi genomförde användartester på rådets webbplats consilium.europa.eu med användare med nedsatt syn, motorik, hörsel, kognition och läsförmåga. Vi kombinerade detta med en strukturerad granskning utifrån riktlinjerna WCAG. Tusen tack för en fantastisk presentation! Jag tyckte resultaten var beskrivna på ett tydligt sätt, även för våra mindre tekniska kollegor. Jag fick väldigt bra feedback från ledningen. De tyckte rapporten var tydlig och välstrukturerad. Presentationen var också väldigt uppskattad. Storytel, Nextory och Bookbeat Vi hjälpte företag som levererar e-böcker förbättra tillgängligheten i sina appar genom att genomföra tio användartester med personer med funktionsnedsättningar som påverkar deras förmåga att läsa. Varje testsession filmades och highlights presenterades för företagen. Projektet gjordes på uppdrag av Myndigheten för Tillgängliga Medier (MTM). Att se användare kämpa med väldigt grundläggande funktionalitet i appen…det känns. Vi behövde verkligen se detta. Tyresö kommun Vi hjälpte Tyresö kommun med deras arbete för att skapa en inkluderande extern webbplats. Vi genomförde bland annat användartester som visade på många lågt hängande frukter som kunde åtgärdas innan lansering. Webbplatsen fick sedan IDG:s pris för bästa kommunala webbplats 2019. Nästan alla förslag går snabbt att fixa. Tror vi får med 80% inom 2 sprinter. Plus att det blir bättre för alla, inte bara personer med funktionsnedsättningar. Priser Stor ~109 000 kr Stort användartest med 8 användare med olika funktionsnedsättningar. Vi rekryterar testdeltagare, planerar testsessionerna, genomför testerna och ger en detaljerad analys av resultaten. Vi skriver också ihop en artikel om ert fina arbete med tillgänglighet som vi delar i sociala medier. Mer info Mellan ~75 000 kr Användartest med 5 användare med olika funktionsnedsättningar. Vi rekryterar testdeltagare, planerar testsessionerna, genomför testerna och ger en detaljerad analys av resultaten. Vi skriver också ihop en artikel om ert fina arbete med tillgänglighet som vi delar i sociala medier. Mer info Liten ~52 000 kr Litet användartest med 3 användare med olika funktionsnedsättningar. Du ger oss testuppgifter och gör den mesta analysen själv. Vi fokuserar på rekrytering av testdeltagare, genomförande av testerna och att leverera resultaten snabbt. Mer info Beställ ett användartest Berätta vad du vill beställa genom att mejla hejsan@axesslab.com eller ringa oss på +46 101 99 41 17. Andra liknande produkter Tillgänglighetsgranskning av en expert Hyr in en tillgänglighetskonsult Utbildning, föreläsning eller workshop om tillgänglighet Alla våra tjänster Hör av dig och berätta hur vi kan hjälpa dig. hello@axesslab.com"
