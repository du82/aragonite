description = "Allgemeine Geschäftsbedingungen 1. Geltungsbereich Für alle Bestellungen über unseren Online-Shop durch Verbraucher und Unternehmer gelten die nachfolgenden AGB.Verbraucher ist jede natürliche Person, die ein Rechtsgeschäft zu Zwecken abschließt, die überwiegend weder ihrer gewerblichen noch ihrer selbständigen beruf"
full_description = 'AGB Allgemeine Geschäftsbedingungen 1. Geltungsbereich Für alle Bestellungen über unseren Online-Shop durch Verbraucher und Unternehmer gelten die nachfolgenden AGB.Verbraucher ist jede natürliche Person, die ein Rechtsgeschäft zu Zwecken abschließt, die überwiegend weder ihrer gewerblichen noch ihrer selbständigen beruflichen Tätigkeit zugerechnet werden können. Unternehmer ist eine natürliche oder juristische Person oder eine rechtsfähige Personengesellschaft, die bei Abschluss eines Rechtsgeschäfts in Ausübung ihrer gewerblichen oder selbständigen beruflichen Tätigkeit handelt.Gegenüber Unternehmern gelten diese AGB auch für künftige Geschäftsbeziehungen, ohne dass wir nochmals auf sie hinweisen müssten. Verwendet der Unternehmer entgegenstehende oder ergänzende Allgemeine Geschäftsbedingungen, wird deren Geltung hiermit widersprochen; sie werden nur dann Vertragsbestandteil, wenn wir dem ausdrücklich zugestimmt haben. 2. Vertragspartner Der Kaufvertrag kommt zustande mit AZ-Delivery Vertriebs GmbH ("wir", "uns" und "unser"). 3. Zustandekommen des VertragsDie Darstellung der Produkte im Online-Shop stellt kein rechtlich bindendes Angebot, sondern einen unverbindlichen Online-Katalog dar. Sie können unsere Produkte zunächst unverbindlich in den Warenkorb legen und Ihre Eingaben vor Absenden Ihrer verbindlichen Bestellung jederzeit korrigieren, indem Sie die hierfür im Bestellablauf vorgesehenen und erläuterten Korrekturhilfen nutzen. Durch Anklicken des Bestellbuttons geben Sie eine verbindliche Bestellung der im Warenkorb enthaltenen Waren ab. Die Bestätigung des Zugangs Ihrer Bestellung erfolgt per E-Mail unmittelbar nach dem Absenden der Bestellung. Wann der Vertrag mit uns durch unsere Annahme Ihres verbindlichen Angebots zustande kommt, hängt von der von Ihnen gewählten Zahlungsart ab (siehe unten). Wir bemühen uns, auf unserer Website und in unseren sonstigen Mitteilungen korrekte Informationen bereitzustellen. In solchen Fällen, in denen der Fehler für Sie hätte offensichtlich sein müssen (z. B. unangemessen niedriger Preis) und die Ausführung des Vertrags für uns unzumutbar wäre (z. B. zu einem erheblichen Verlust führen würde), behalten wir uns das Recht vor, solche Verträge im Einklang mit dem geltenden Recht zu kündigen. Rechnung Wir nehmen Ihre Bestellung durch Versand einer Annahmeerklärung in separater E-Mail oder durch Auslieferung der Ware innerhalb von zwei Tagen an. KreditkarteMit Abgabe der Bestellung übermitteln Sie uns gleichzeitig Ihre Kreditkartendaten. Nach Ihrer Legitimation als rechtmäßiger Karteninhaber fordern wir Ihr Kreditkartenunternehmen zur Einleitung der Zahlungstransaktion auf und nehmen dadurch Ihr Angebot an. PayPal Express Im Bestellprozess werden Sie auf die Webseite des Online-Anbieters PayPal weitergeleitet. Dort können Sie Ihre Zahlungsdaten angeben und die Zahlungsanweisung an PayPal bestätigen. Nach Abgabe der Bestellung im Shop fordern wir PayPal zur Einleitung der Zahlungstransaktion auf und nehmen dadurch Ihr Angebot an. SofortNach Abgabe der Bestellung werden Sie auf die Webseite des Online-Anbieters Sofort GmbH weitergeleitet, wo Sie die Zahlungsanweisung bestätigen. Dadurch kommt der Vertrag mit uns zustande. Bei der Bezahlung mit Sofort können bis zu 14 Tage vergehen, bis der Zahlungsdienstleister die Zahlung an uns bestätigt. Die Bestellung kann erst danach versendet werden. AbholungEine Abholung Ihrer Bestellung ist vor Ort leider nicht möglich. Zahlung per SEPA Lastschrift Der Käufer kann der AZ-Delivery Vertriebs GmbH ein SEPA-Basis-Mandat erteilen. Die Frist für die Vorabankündigung (Pre-Notification) wird auf einen Tag verkürzt. Der Käufer sichert zu, für die Deckung des Kontos zu sorgen. Kosten, die aufgrund von Nichteinlösung oder Rückbuchung der Lastschrift entstehen, gehen zu Lasten des Käufers, solange die Nichteinlösung oder die Rückbuchung nicht durch die AZ-Delivery Vertriebs GmbH verursacht wurde. 4. Vertragssprache, VertragstextspeicherungDie für den Vertragsschluss zur Verfügung stehenden Sprachen sind Deutsch und Englisch. Wir speichern den Vertragstext und senden Ihnen die Bestelldaten und unsere AGB per E-Mail zu. Der Vertragstext ist aus Sicherheitsgründen nicht mehr über das Internet zugänglich. 5. Lieferbedingungen Zuzüglich zu den angegebenen Produktpreisen kommen noch Versandkosten hinzu. Näheres zur Höhe der Versandkosten erfahren Sie bei den Angeboten. Wenn sich Ihre Lieferadresse außerhalb der EU befindet, kann Ihre Lieferung außerdem Einfuhrzöllen und -steuern unterliegen, die erhoben werden, sobald die Lieferung Ihr Land erreicht. Diese sind nicht in dem von uns berechneten Endpreis enthalten. Sie sind für die Zahlung aller zusätzlichen Gebühren für die Zollabfertigung verantwortlich. Wir empfehlen Ihnen, sich für weitere Informationen an Ihr örtliches Zollamt zu wenden. 6. Bezahlung In unserem Shop stehen Ihnen grundsätzlich die folgenden Zahlungsarten zur Verfügung: Kreditkarte Mit Abgabe der Bestellung übermitteln Sie uns gleichzeitig Ihre Kreditkartendaten. Nach Ihrer Legitimation als rechtmäßiger Karteninhaber fordern wir unmittelbar nach der Bestellung Ihr Kreditkartenunternehmen zur Einleitung der Zahlungstransaktion auf. Die Zahlungstransaktion wird durch das Kreditkartenunternehmen automatisch durchgeführt und Ihre Karte belastet. PayPal Express Im Bestellprozess werden Sie auf die Webseite des Online-Anbieters PayPal weitergeleitet. Um den Rechnungsbetrag über PayPal bezahlen zu können, müssen Sie dort registriert sein bzw. sich erst registrieren, mit Ihren Zugangsdaten legitimieren und die Zahlungsanweisung an uns bestätigen. Nach Abgabe der Bestellung im Shop fordern wir PayPal zur Einleitung der Zahlungstransaktion auf. Sofort Nach Abgabe der Bestellung werden Sie auf die Webseite des Online-Anbieters Sofort GmbH weitergeleitet. Um den Rechnungsbetrag über Sofort bezahlen zu können, müssen Sie über ein für die Teilnahme an Sofort freigeschaltetes Online-Banking-Konto mit PI