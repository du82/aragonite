full_description = "Versandinformation VersandoptionenPremiumversand mit Trackingnummer (je nach Lieferadresse ab 2 Werktage)DHL Expressversand (1 Werktag, bei Bestellung bis 12 Uhr) Zusatzoptionen Bevorzugte Bearbeitung Ihre Bestellung wird vor allen anderen Bestellungen bearbeitet und so auch früher versandt. Dies sollte gewährleisten, dass Ihre Bestellung binnen kürzester Zeit bearbeitet und versandt wird. BearbeitungszeitWir bearbeiten alle Bestellungen so schnell wie möglich. Die Abwicklung der Bestellung passiert im Normalfall innerhalb von einem Werktag und dauert (in Ausnahmefällen) bis zu 2 Werktage. Sie werden per E-Mail informiert, sobald die Ware versandt wurde! Bei Bezahlung mit Sofort können bis zu 14 Tage vergehen, bis der Zahlungsdienstleister die Zahlung an uns bestätigt. Die Bestellung kann erst danach versendet werden. Versandkosten Die Versandkosten innerhalb Deutschlands betragen bis zu einem Bestellwert von 24,99€ sind 2,90 €. Innerhalb der restlichen EU sind die Versandkosten mit nur 3,90€ ebenfalls sehr niedrig.Bestellungen mit einem Mindestbestellwert von 25,00 € werden innerhalb Deutschlands und in die gesamte EU kostenlos versendet.Sie können auch die Option Expressbearbeitung + Premiumversand wählen, bei der die Dauer 3-4 Werktage beträgt. Dies kostet 5,90€ für Bestellungen mit einem Wert bis zu 24,99€ und 2€ für Bestellungen mit einem Wert von mehr als 25€.Für den Versand nach Großbritannien und in die Schweiz sind die Versandkosten etwas höher und der Aufwand ist größer, so dass hierfür 7,90€ (bis 24,99€ Bestellwert) zu zahlen sind. Zwischen 24,99€ und 69,99€ Bestellwert fallen noch 3,90€ Versandkosten an.Sie können auch die Option Expressbearbeitung + Premiumversand wählen, bei der die benötigte Zeit 3-4 Arbeitstage beträgt. Dies kostet 5,90€ für Bestellungen mit einem Wert bis zu 24,99€ und 2€ für Bestellungen mit einem Wert von mehr als 25€. Lieferzeiten Innerhalb Deutschlands sollte die Ware innerhalb von 2-3 Werktagen geliefert werden. (Premium Versand) Außerhalb Deutschlands (EU) sollte die Ware innerhalb von 4-6 Werktagen geliefert werden. Ausnahmen: In Ausnahmefällen kann sich die Lieferzeit etwas verzögern (besonders zu bestimmten Jahreszeiten wie Oktober, November, Dezember), wir bitten um Verständnis. Sollten Sie Ihre Bestellung innerhalb von 4 Werktagen (Deutschland) bzw. 7 Werktage (EU) nicht erhalten haben, kontaktieren Sie uns bitte unter support@az-delivery.com. Benötigte Informationen für AuskünfteUm Ihnen Auskunft über den Status Ihrer Bestellung zu geben, brauchen wir eine oder mehrere der folgenden Informationen: Bestellnummer (Finden Sie in der Bestellbestätiguns-E-Mail, sowie auf der Bestätigungsseite nach Ihrem Kauf E-Mail Adresse mit Bestelldatum (hier muss es sich um die E-Mail Adresse handeln, die Sie bei der Bestellung verwendet haben) Vollständiger Name mit Bestelldatum (hier muss es sich um den Namen handeln, den Sie bei der Bestellung verwendet haben) Newsletter abonnieren und 15% sparen! Erfahren Sie immer gleich als Erster, wenn ein neues interessantes Projekt vorgestellt wird. Wir informieren Sie ebenfalls sofort, wenn Produkte zu einem unschlagbaren Preis im Angebot sind! Melden Sie sich jetzt an und erhalten Sie 15% Rabatt auf Ihre nächste Bestellung. Jetzt abonnieren document.querySelector('.klaviyo_form_trigger2').addEventListener('click', function (){ window._klOnsite = window._klOnsite || []; window._klOnsite.push(['openForm', 'VaHWB6']); });"
