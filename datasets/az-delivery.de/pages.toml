title = "Wer wir sind..."
description = "Wer istAZ-Delivery? Schön, dass Sie hier sind - und erstmal herzlich willkommen in der AZ-Delivery Community! Die Grundidee für AZ-Delivery kam von Albert und Andreas - den Gründern der AZ-Delivery Vertriebs GmbH. Die beiden entschlossen sich 2016 selbst Mikroelektronik anzubieten, nachdem sie selbst Mikrocontroller fü"
full_description = "Wer wir sind... Wer istAZ-Delivery? Schön, dass Sie hier sind - und erstmal herzlich willkommen in der AZ-Delivery Community! Die Grundidee für AZ-Delivery kam von Albert und Andreas - den Gründern der AZ-Delivery Vertriebs GmbH. Die beiden entschlossen sich 2016 selbst Mikroelektronik anzubieten, nachdem sie selbst Mikrocontroller für ihr Studium bestellen wollten und keinen passenden Anbieter finden konnten. So entstand AZ-Delivery mit dem Ziel genau das anzubieten, was sie sich selbst gewünscht hätten: Hochwertige Mikroelektronik mit kurzen Versandzeiten und zu fairen Preisen. Zusätzlich dazu noch Anleitungen und Datenblätter zu den Produkten, um auch Neulingen den Einstieg leicht zu machen. Preiswerte Qualitäts-Produkte mit ROHS Zertifizierung Bereits ab 25€ Einkaufswert kostenloser Versand! Schnelle Lieferung aus Deutschland Mittlerweile über 300 hochwertige Mikroelektronik-Produkte im Sortiment Das AZ-Delivery Team Durch einen direkten Einkauf ab Werk, große Einkaufsmengen und umfassende Qualitätskontrollen sorgen wir für gesicherte Qualität und niedrige Preise für Sie als Kunden. Unsere Marke steht dafür zu jeder Zeit mit einem besonderen Maß an Service, wöchentlich neuen, spannenden Projekten in unserem Blog und Newsletter und mit unserer E-Book-Bibliothek zur Einrichtung und Bedienung unserer Produkte zu überzeugen. Außerdem steht Ihnen bei uns ein deutschsprachiges Expertenteam zur Verfügung, um technische Probleme bei der Einrichtung unserer Produkte schnell und unkompliziert zu lösen. Von wo bekommen Sie Ihre Produkte? Wir versenden von unserem Standort im schönen Niederbayern - aus der Hochschulstadt Deggendorf kümmern wir uns um all ihre Anliegen. Unsere Produkte finden Sie hier in unserem Onlineshop, aber auch auf Amazon und Ebay. Egal für welche Plattform Sie sich entscheiden, wir garantieren einen schnellen Versand und Qualitäts-Produkte mit ROHS Zertifizierung. Bleiben Sie immer über News, Angebote und Blogs informiert, indem Sie unseren Newsletter abonnieren oder uns in den sozialen Medien folgen. Wo finden Sie uns noch? Wo finden Sie uns noch? <!-- @media screen and (max-width: 749px) { .hide-mobile{ display:none !important; } .hide-desktop{ display:block !important; } .about-header{ margin-top:0px !important; } } @media screen and (min-width: 750px) { .hide-mobile{ display:block; } .hide-desktop{ display:none; } } @media screen and (max-width: 749px) { tbody, tbody .h2-head { display: grid; width: 100%; } tbody .h2-head-td{ width: 100% !important; } tbody .pc-social{ width: 20% !important; } } .socialMedia{ position: relative; width: 100%; } .smImage { opacity: 0.2; display: block; width: 100%; height: auto; transition: .5s ease; backface-visibility: hidden; } .socialMedia:hover .smImage { opacity: 1; } a.conLink:link { color: #cb2900; } a.conLink:visited { color: #cb2900; } a.conLink:hover { color: #cb2900; } a.conLink:active { color: #cb2900; } --> Newsletter abonnieren und 15% sparen! Erfahren Sie immer gleich als Erster, wenn ein neues interessantes Projekt vorgestellt wird. Wir informieren Sie ebenfalls sofort, wenn Produkte zu einem unschlagbaren Preis im Angebot sind! Melden Sie sich jetzt an und erhalten Sie 15% Rabatt auf Ihre nächste Bestellung. Jetzt abonnieren document.querySelector('.klaviyo_form_trigger2').addEventListener('click', function (){ window._klOnsite = window._klOnsite || []; window._klOnsite.push(['openForm', 'VaHWB6']); });"
