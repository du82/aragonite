title = "Raspberry Pi Mini-Computer & Zubehör | AZ Delivery"
description = '''
Raspberry Pi Mini Computer
Der klassische Raspberry Pi ist ein leistungsstarker Ein-Platinen-Computer mit einer ARM-CPU im Scheckkartenformat.
Als der Raspberry Pi Modell 1 auf dem Markt kam war dieser noch mit einem Single-Core-SoC mit einer Taktfrequenz von 700MHz und einem Arbeitsspeicher von 256MB bzw. 512MB ausgestattet.
Im Laufe der Zeit sind mehrere unterschiedliche Versionen wie z.B. der Raspberry Pi 2, 3 und 4 sowie unterschiedliche Bauformen (Modell A, B und Compute-Module) erschienen. Aktuell sind die "Mini PCs" mit einer Multi-Core-CPU bis 1,8GHz Taktfrequenz und bis zu 8GB RAM erhältlich. 
Raspberry Pi Versionen
Die Auswahl an verfügbaren Raspberry Modulen wurde weiter ausgebaut, so existieren mittlerweile auch etwas kleinere Varianten wie der Raspberry Pi Zero (W) mit weniger Leistung und weniger Anschlüssen oder der Raspberry Pi Pico mit einem RP2040 Controller, der in etwa im Leistungsbereich der STM32 Prozessoren rangiert.
Während die Entwicklerboards der "Arduino-Familie" primär zum Erlernen von Kenntnissen im Bereich der Elektronik gedacht sind eignet sich der Raspberry Pi besser für Projekte aus dem Bereich der Informatik. Dank der 40-poligen GPIO-Headers des Raspberry Pis und Raspberry Pi Zeros vereinen die Raspberries die Welt der Elektronik mit den weiterführenden Elementen aus den Bereichen der Informationstechnik.
Aufgrund der hohen Leistungsfähigkeit und der üppigen Ausstattung kann der Raspberry Pi auch anspruchsvolle Aufgaben übernehmen.
So lassen sich problemlos auch Projekte mit Bilderkennung oder Bildverarbeitung und mit Elementen aus den Bereichen des Machine Learnings und AI Applikationen realisieren. Gerne findet der Raspberry Pi auch als Heimserver oder Mediacenter Verwendung.
Unser Sortiment umfasst neben dem Raspberry Pi Modell B und dem Raspberry Pi Pico auch umfangreiches Zubehör wie Sensoren, GPIO Expander, Displays oder Aktoren, die mit dem Raspberry Pi kompatibel sind.
Raspberry Programmieren
Da als zugrunde liegende Plattform ein Linux-Betriebssystem Anwendung findet, lassen sich so gut wie alle verfügbaren Programmiersprachen in Verbindung mit dem Raspberry Pi nutzen.
Python war schon bei der Namengebung des Raspberrys relevant (Raspberry PythonInterpreter) und so ist Python ohne Zweifel die Ideale Programmiersprache zur Verwendung mit dem Raspberry Pi.
Vorkonfigurierte Images für die SD-Karte und eine Vielzahl frei verfügbarer Bibliotheken erleichtern die Umsetzung eigener Ideen.
Raspberry Projekte
Der Raspberry eignet sich ideal für anspruchsvolle, komplexe oder leistungshungrige Projekte. Es existiert eine Vielzahl von Projektanleitungen wie z.B. für Überwachungslösungen mit Objekt- oder Gesichtserkennung, Drohnensteuerungen (pi0drone), Lösungen für 3D-Drucker wie Octoprint, autonome Rover, Smart Home Lösungen wie OPENHAB, Sortiermaschinen wie Blackpicker oder Mediaserver wie Libre- oder OpenELEC mit Kodi.
FAQ
Was kann man alles mit einem Raspberry Pi machen?
Mit dem Raspberry lassen sich anspruchsvolle und komplexe Projekte realisieren.
Was brauche ich alles, um mit Raspberry Pi zu arbeiten?
Neben dem Raspberry Pi ist eine SD-Karte mit 32GB oder 64 GB Speicherplatz sowie ein Netzteil und in einigen Fällen ein Display-Adapter notwendig.
Welches Betriebssystem auf dem Raspberry Pi?
Für den Raspberry stehen verschiedene Betriebssysteme, sowie vorkonfigurierte Images für die SD-Karte zur Verfügung.
                                                                           Mehr anzeigen'''
