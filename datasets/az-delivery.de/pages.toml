title = "Cookie Richtlinie"
description = "Cookie-Richtlinie  AZ-Delivery Vertriebs GmbH („wir“, „uns“, „unser“ oder „AZ-Delivery “) und unsere Partner verwenden Cookies und andere ähnliche Technologien auf unseren Websites und in unseren Marketingmitteilungen, um Ihnen den Zugang zu unserer Website mit einem maßgeschneiderten Erlebnis und relevanten Marketingm"
full_description = "Cookie Richtlinie Cookie-Richtlinie AZ-Delivery Vertriebs GmbH („wir“, „uns“, „unser“ oder „AZ-Delivery “) und unsere Partner verwenden Cookies und andere ähnliche Technologien auf unseren Websites und in unseren Marketingmitteilungen, um Ihnen den Zugang zu unserer Website mit einem maßgeschneiderten Erlebnis und relevanten Marketingmitteilungen zu ermöglichen und um Analysen durchzuführen. Was sind Cookies und andere ähnliche Technologien, die wir verwenden? Cookies sind kleine Textdateien, die geringe Mengen an Informationen enthalten und von Websites, die Sie besuchen, auf Ihrem Gerät abgelegt werden. Im Allgemeinen können Sie durch die in diesem Zusammenhang verarbeiteten Daten nicht direkt identifiziert werden, aber sie können Ihnen eine persönlichere Erfahrung bieten, indem sie Informationen über Sie, Ihre Vorlieben oder Ihr Gerät liefern. Zusätzlich zu Cookies verwenden wir Pixel, um mehr über Ihre Interaktionen mit unseren E-Mails oder Webinhalten zu erfahren, z. B. ob Sie mit Anzeigen oder Beiträgen interagiert haben. Ein Zählpixel ist ein winziges Bild, das in Websites und E-Mails eingebettet sein kann und einen Aufruf (der Geräte- und Besuchsinformationen liefert) an unsere Server erfordert, damit das Zählpixel auf diesen Websites und in diesen E-Mails dargestellt werden kann. Warum werden Cookies und andere ähnliche Technologien verwendet? Cookies werden in vier Kategorien eingeteilt, je nachdem, zu welchem Zweck sie verwendet werden: Streng notwendige Cookies (technisch unbedingt erforderliche Cookies): Diese Cookies sind für das sichere Funktionieren der Website erforderlich und können nicht abgeschaltet werden. Dazu gehören Cookies unserer Shop-Plattform (z. B. Warenkorb-Cookies, Aufzeichnung des Zustimmungsstatus, Sicherung von Sitzungen, Sicherheit des Shop-Systems, Zahlungsabwicklung), Cookies der verwendeten Content-Delivery-Networks (z. B. Ausspielung bestimmter Inhalte über externe Netzwerke zur Optimierung der Ladegeschwindigkeit, Stabilität und korrekten Darstellung von Inhalten) sowie Cookies, die zu Sicherheitszwecken verwendet werden (z. B. Google reCAPTCHA, um Schadsoftware von missbräuchlichen Aktivitäten auf der Website abzuhalten). Sie können Ihren Browser so einstellen, dass er diese Cookies blockiert oder Sie vor ihnen warnt, aber dann ist es nicht möglich, unseren Webshop oder bestimmte Funktionen zu nutzen Leistungs-Cookies (Analytik): Diese Cookies sind optional und ermöglichen es uns, Besuche und Verkehrsquellen zu zählen, damit wir die Leistung unserer Website messen und verbessern können. Sie helfen uns zu wissen, welche Seiten am beliebtesten und welche am unbeliebtesten sind, und zu sehen, wie sich die Besucher auf der Website bewegen (z. B. durch Klickpfade, Mausbewegungen und Heatmaps); Funktionale Cookies: Diese Cookies sind optional und ermöglichen es der Website, eine verbesserte Funktionalität und Personalisierung zu bieten. Wenn Sie diese Cookies nicht zulassen, kann es sein, dass einige oder alle dieser Dienste nicht richtig funktionieren; Zielgerichtete Cookies (Werbung): Diese Cookies sind optional und können auf unserer Website von uns oder unseren Werbepartnern gesetzt werden. Sie können von uns oder unseren Partnern verwendet werden, um ein Profil Ihrer Interessen zu erstellen und Ihnen relevante Werbung auf anderen Websites zu zeigen oder um Daten zusammenzuführen und zu verknüpfen (möglicherweise unter Einbeziehung anderer Parteien wie z. B. Herausgeber in Werbenetzwerken), um Provisionsansprüche für Werbematerial zu gewährleisten. Wenn Sie diese Cookies nicht zulassen, wird Ihnen möglicherweise weniger relevante Werbung angezeigt. Die Pixel werden verwendet, um die Leistung unserer Marketingkampagnen und deren Relevanz für Sie zu analysieren. Dies geschieht durch Beobachtung Ihrer Interaktionen mit unseren Inhalten (z. B. wenn Sie eine Marketing-E-Mail öffnen) und hilft uns, Ihre Interessen und Vorlieben zu verstehen. Welche Art von Daten wird von den Cookies und ähnlichen Funktionen verarbeitet? Die Cookies und andere Funktionen können die folgenden Kategorien von (personenbezogenen) Daten verarbeiten, wie im Cookie-Einwilligungsmechanismus angegeben: Inhaltsdaten: (z. B. Texteinträge, Fotos, Videos, Inhalte von Dokumenten/Dateien); Nutzungsdaten: (z. B. Historie auf unserer Website, Nutzung bestimmter Inhalte, Zugriffszeiten, Kontakt- oder Bestellhistorie); Verbindungsdaten: (z. B. Geräteinformationen, IP-Adressen, URL-Referrer); Standortdaten: (z. B. GPS-Daten, IP-Geolokalisierung, Zugangspunkte); und Diagnosedaten: (z. B. Absturzprotokolle, Leistungsdaten der Website/App, andere technische Daten zur Analyse von Störungen und Fehlern). Die optionalen Cookies werden auf Ihrem Gerät auf der Grundlage Ihrer Zustimmung gemäß den nationalen Gesetzen zur Umsetzung von Art. 5(3) der e-Privacy-Richtlinie (z.B. in Deutschland Art. 25(1) des Telekommunikations-Digitale-Dienste-Datenschutz-Gesetzes („TDDDG“). Die anwendbaren Rechtsgrundlagen, die je nach Cookie oder Funktion variieren können, für die Verarbeitung Ihrer personenbezogenen Daten im Zusammenhang mit dem Betrieb von Cookies und anderen Funktionen sind die Einwilligung (Artikel 6 Absatz 1 Buchstabe a) DSGVO), die Vertragserfüllung (Artikel 6 Absatz 1 Buchstabe b) DSGVO) und/oder berechtigte Interessen (Artikel 6 Absatz 1 Buchstabe f) DSGVO). Welche Datenkategorien von den einzelnen Cookies verarbeitet werden, entnehmen Sie bitte den Cookies, die im Mechanismus zur Einwilligung in Cookies angegeben sind. Weitere Informationen über die Verarbeitung personenbezogener Daten finden Sie in unserer Datenschutzrichtlinie. Welche Datenverarbeitungsvorgänge sind mit Cookies und ähnlichen Funktionen verbunden? Werbung und personalisierte Marketingmaßnahmen: Umfasst z.B. das Aufrufen von öffentlichen und ggf. zugangsbeschränkten Websites, Apps und/oder externen Seiten zur allgemeinen Information über unsere Produkte/Dienstleistungen (z.B. allgemeine Website über unser Unternehmen, Presseseiten, Social-Media-Seiten), personalisierte Kommunikation mit Nutzern, Interessenten und/oder Kunden (z.B. Newsletter), Ausspielung von (personalisierten) Empfehlungen und Werbemaßnahmen (z.B. personalisierte Newsletter, Einblendung von Werbung auf anderen Webseiten, Suchmaschinen, Social-Media-Seiten und/oder Apps und allgemein in Werbenetzwerken), Zusammenführung und Verknüpfung von Daten (ggf. unter Einbeziehung anderer Parteien wie z.B. Publisher in Werbenetzwerken) zur Gewährleistung von Provisionsansprüchen für Werbemittel; Analyse und Performance-Messung sowie die Optimierung von Produkten und/oder Dienstleistungen: Umfasst z.B. Meinungsumfragen und Votings, vergleichende Tests (sog. A/B-Testing), Analyse und (i.d.R. aggregierte) Auswertung des Nutzer-, Interessenten- und/oder Kundenverhaltens im Online- und/oder Offline-Bereich (z.B. durch Klickpfade, Mausbewegungen und Heatmaps), Analyse und Bewertung des Erfolgs von allgemeinen und ggf. personalisierten Marketingmaßnahmen, bedarfsgerechte Gestaltung unserer (digitalen) Produkte und Dienstleistungen auf Basis des analysierten Nachfrage- und/oder Nutzungsverhaltens; Informationssicherheit: Es werden Verarbeitungsvorgänge erfasst, die der Gefahrenabwehr und der Absicherung von IT-Systemen sowie der Erreichung der Schutzziele Vertraulichkeit, Verfügbarkeit und Integrität von Daten, Systemen und Prozessen dienen (z.B. Unterscheidung zwischen menschlichem und Bot-Zugriff, Erkennung und Abwehr von missbräuchlichen Zugriffen, sicherheitsrelevante Analyse der Nutzung digitaler Produkte und Dienste); und Nutzer- und/oder Kundensupport: Umfasst z.B. Kontaktformulare, Chatsysteme einschließlich Chatbots. Wann laufen die Cookies ab? Der Ablauf der Cookies hängt davon ab, ob es sich um so genannte Sitzungscookies handelt oder ob sie unter die Kategorie der dauerhaften Cookies fallen. Sitzungscookies verfallen am Ende einer Browsersitzung, d. h. in der Regel, wenn Sie Ihren Browser schließen, während dauerhafte Cookies zwischen den Sitzungen in Ihrem Browser gespeichert werden, es sei denn, Sie entfernen sie manuell. Genaue Informationen über den Ablauf der einzelnen Cookies finden Sie in den Informationen, die im Mechanismus zur Einwilligung in Cookies aufgeführt sind. Was sind Erstanbieter- und Drittanbieter-Cookies? Cookies können je nach der Domäne, die sie setzt, in Erstanbieter- und Drittanbieter-Cookies eingeteilt werden. Erstanbieter-Cookies werden direkt von uns auf der von Ihnen besuchten Website gesetzt. Drittanbieter-Cookies werden von einer anderen Domäne als unserer Website gesetzt, wenn Ihr Browser Elemente von solchen Drittanbieter-Websites abruft, z. B. Bilder, Plugins für soziale Medien oder Werbung. Wie können Sie Ihre Cookie-Einstellungen ändern oder Pixel deaktivieren? Sie können Ihre Präferenzen in Bezug auf optionale Cookies und andere ähnliche Technologien auf unserer Website ändern, indem Sie den Mechanismus der Cookie-Zustimmung verwenden. Mithilfe der Kippschalter in dem bereitgestellten Mechanismus können Sie jederzeit alle oder einige der optionalen Cookies und anderer ähnlicher Technologien entsprechend Ihrer Präferenzen aktivieren oder deaktivieren. Sie können die Cookie-Einstellungen auch direkt in Ihrem Browser ändern; weitere Anweisungen dazu finden Sie hier (Website eines Drittanbieters). Wenn Sie die in unseren Marketing-E-Mails enthaltenen Pixel deaktivieren möchten, können Sie dies tun, indem Sie das automatische Herunterladen von Bildern in Ihrer E-Mail blockieren. Sie können sich auch jederzeit von unseren Marketingmitteilungen abmelden, indem Sie den in der Mitteilung angegebenen Link verwenden oder sich gemäß der Datenschutzrichtlinie an uns wenden. Newsletter abonnieren und 15% sparen! Erfahren Sie immer gleich als Erster, wenn ein neues interessantes Projekt vorgestellt wird. Wir informieren Sie ebenfalls sofort, wenn Produkte zu einem unschlagbaren Preis im Angebot sind! Melden Sie sich jetzt an und erhalten Sie 15% Ra