["https://az-delivery.de/collections/arduino-kompatible-boards"]
title = "Arduino kompatible MCU"
description = """
Unsere Arduino Kompatiblen: Nano, Uno, Mega, Pro Mini und Mini
Was ist Arduino?
Als “Arduino” bezeichnet man eine Hard- und Softwareplattform zum Erlernen der Programmierung von Mikrocontrollern, die sich einer großen weltweiten Beliebtheit erfreut. Seit dem Aufkommen der Arduino-Plattform ist der Einstieg in die Welt der Mikrocontroller leichter geworden. Auch Einsteigern wie Schülern, Künstlern oder Maker wurde es damit ermöglicht die “Macht der Mikrocontroller” in Ihre Projekte zu integrieren.
Unsere Arduino Produkte
Unser Sortiment umfasst Arduino kompatible Boards in verschiedenen Baugrößen und mit unterschiedlichem Funktionsumfang. Alle auf den Modulen verwendeten 8-bit Prozessoren takten mit 16 MHz und bieten genügend Speicher für die meisten Anwendungen.Unsere kompatiblen Arduino Boards sind mit den originalen Arduino Controllern sowohl Pin- als auch Code-kompatibel und lassen sich so komfortabel in der Arduino IDE programmieren. In unserem Sortiment finden Sie eine große Auswahl an Zubehör wie Sensoren, Displays, Relais, Shields u.v.m., die mit der Betriebsspannung und dem Signalpegel der Arduino Boards arbeiten und dank freier Bibliotheken einfach in neue oder bestehende Projekte integriert werden können. In unseren praktischen Starter Kits finden Sie zudem eine Auswahl von Modulen und Komponenten mit Anleitungen, um bestmöglich in die Welt der Microcontroller einzusteigen. Auf den Produktdetailseiten unserer Arduino Produkte stehen wie gewohnt Pinouts, Datenblätter und Anleitungen zum Download zur Verfügung.
Arduino Mini / Pro-Bauform
Der Mini oder Mini Pro ist das kompakteste unserer Arduino kompatiblen Boards. Wie die größeren Bauformen ist auch dieses Modul mit einem ATmega328p von ATMEL ausgestattet und verfügt somit über die gleiche Leistungsfähigkeit sowie den gewohnten Speicherplatz für den Programmcode. Auf eine USB-Schnittstelle wurde bei diesem Design zugunsten der Bauform verzichtet. Der Mini / Mini Pro eignet sich also vor allem zum festen Einbau in Gehäusen oder zur Verwendung auf Platinen.
Arduino Nano-Bauform
Der Nano V3 ist nach dem Mini / Mini Pro das zweitkleinste Modul. Der Controller ist mit einer zusätzlichen USB-Schnittstelle ausgestattet, die das Handling wesentlich erleichtert. Da auf die seitlichen Pins des Mini / Pro verzichtet wurde ist das Modul besonders breadboardfreundlich und eignet sich sowohl für Einsteiger als auch für fortgeschrittene Benutzer. Der Nano V3 ist in mehreren Varianten verfügbar. Es sind Shields zum einfachen Aufstecken als Zubehör verfügbar
Arduino UNO-Bauform
Entwicklungsboards in UNO-Bauform sind die wohl bekanntesten und die am weitesten verbreiteten Arduino kompatiblen Boards. Es stehen viele Shields zum einfachen Aufstecken auf den Controller zur Verfügung. Die Shields erweitern nicht nur die Funktionalität des Controllers, sie minimieren auch den Verdrahtungsaufwand bei vielen Elektronik-Projekten. Prototyping Shields ermöglichen eine einfache Integration eigener Schaltungen. Alle Controller im UNO-Format besitzen neben der USB-Schnittstelle auch eine Hohlbuchse zur Stromversorgung. Es stehen unterschiedliche Ausführungen der Arduino kompatiblen Boards in UNO-Bauform zur Verfügung.
Arduino MEGA2650-Bauform
Der MEGA2650 ist das größte Arduino kompatible Board in unserem Sortiment. Bei diesem Modell wurde der bewährte ATmega328p durch den größeren ATmega2650 ersetzt, da dieser über deutlich mehr Schnittstellen und auch einen vielfach größeren Programmspeicher verfügt. Mit über 50 GPIOs ist der MEGA2650 auch für größere Projekte ausreichend dimensioniert. Selbstverständlich sind die Boards, wie die Controller in UNO-Bauform mit einer USB-Schnittstelle und einer praktischen Hohlbuchse zur Stromversorgung ausgestattet. Einige UNO-Shields lassen sich auch auf dem MEGA2650 nutzen.
FAQ
Was kann man mit einem Arduino machen?
Arduino kompatible Boards sind äußerst vielseitig einsetzbar. Auch wenn die Module ursprünglich zu Lernzwecken entwickelt wurden, finden die Module mittlerweile sogar in einigen Industriemodulen Anwendung. Beliebte Projekte sind z.B.: Datenlogger, LED-Installationen, Wetterstationen, 3D-Drucker, Cocktailautomaten und M&Ms Sortiermaschinen.
Welche Sensoren gibt es für Arduino?
Für den Arduino stehen unzählige Sensoren zur Verfügung, die es ermöglichen Werte zu erfassen und zu verarbeiten. Unser Sortiment umfasst beispielsweise: Licht-, UV-, IR- und Farbsensoren, Sensoren für Temperatur, Luftfeuchte, Bodenfeuchte, Luftdruck und Gase, Wägezellen, Touchsensoren, Lichtschranken, Linienfolger, Abstandsmesser, Kameras u.v.m.
In welcher Sprache wird Arduino programmiert?
Arduino kompatible Boards lassen sich ideal innerhalb der Arduino IDE programmieren. Arduino stellt hierzu eine eigene Sprachreferenz zur Verfügung und orientiert sich dabei sehr stark an C bzw. C++. Die Arduino kompatiblen Boards lassen sich jedoch auch mit professionelleren Programmierumgebungen wie PlatformIO oder Atmel Studio programmieren. Es stehen auch graphische Programmierumgebungen wie Visuino zur Verfügung.
                                                                           Mehr anzeigen"""
