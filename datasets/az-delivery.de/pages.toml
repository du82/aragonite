["https://az-delivery.de/blogs/azdelivery-blog-fur-arduino-und-raspberry-pi/diy-beleuchtung-mit-wled-smarte-lichtsteuerung-einfach-umgesetzt-teil-3"]
title = "DIY-Beleuchtung mit WLED: Smarte Lichtsteuerung einfach umgesetzt - Te"
description = "WLED hatten Sie in den letzten beiden Beiträgen bereits kennengelernt. Es ist sehr vielseitig einsetzbar. Wie Sie z.B. Befehle per HTTP senden, WLED in Philips Hue oder Home Assistant integrieren, wie Sie Ihre LEDs per Octoprint als Leuchtsignale verwenden, wie Sie sie im Takt Ihrer Partymusik pulsieren lassen und einiges mehr, das erfahren Sie in diesem Beitrag."
full_description = '''DIY-Beleuchtung mit WLED: Smarte Lichtsteuerung einfach umgesetzt - Teil 3 ESP-32Bastian BrumbiJan 27, 2025 Teilen 0 Kommentare Der letzte Beitrag handelte von Beispielen der Anwendung, aber auch schon grundlegenden Steuerungsoptionen, wie die Nutzung einer Fernbedienung. In diesem Teil werden die Steuerungsmöglichkeiten Schritt für Schritt erweitert.Um die Projekte in diesem Blogbeitrag einfacher umzusetzen zu können, wird Vorwissen aus den Vorherigen Teilen (Teil1, Teil2) benötigt. Steuerung mit Tastern und Bewegungssensor WLED bietet die Möglichkeit, physische Taster oder Bewegungssensoren zur Steuerung zu verwenden. So können Sie etwa mit einem einfachen Taster Lichteffekte schalten, oder Ihre Beleuchtung automatisch durch einen Bewegungssensor steuern. Taster Für dieses Projekt eignen sich einfache Drucktaster, die direkt an Ihr ESP8266- oder ESP32-Board wie folgt angeschlossen werden können: Öffnen Sie die WLED-Benutzeroberfläche wie in den vorherigen Teilen und navigieren Sie zu LED Preferences. Scrollen Sie nach unten zum Abschnitt Hardware Setup. Unter Button GPIO wählen Sie den entsprechenden GPIO-Pin (GPIO10). Unter Time & Macros können Sie festlegen, welches Preset beim einfachen Drücken, Gedrückthalten oder doppelt Drücken aufgerufen wird. Um Beispielsweise die Helligkeit zu erhöhen, erstellen Sie ein neues Preset und klicken Sie auf use current state, daraufhin sollte sich nun ein Textfeld APIcommand öffnen. Tragen Sie in dieses Feld API Befehle wie A=~10 ein, um Beispielsweise die Helligkeit in 10er Schritten zu erhöhen.Die wichtigsten API Befehle: &A= Helligkeit &R= Rot &G= Grün &B= Blau &FX= Effekt &FS= Effektgeschwindigkeit Mit ~ wird der Wert erhöht, mit ~- verringert und bei Beispielsweise ~10 wird der Wert um 10er Schritte erhöht, hier kann auch jeder beliebige Wert verwendet werden. Bewegungssensor Ein PIR-Bewegungssensor (Passive Infrared; reagiert auf Körperwärme) wie der HC-SR501 eignet sich hervorragend, um Bewegungen zu erkennen und entsprechend die LEDs zu steuern. Schließen Sie das Modul wie folgt an: HC-SR501 D1mini VCC 3v3 GND GND OUT GPIO12 Öffnen Sie die WLED-Oberfläche und navigieren Sie zu den LED Preferences. Wählen Sie unter PIR Sensor GPIO den GPIO-Pin, an den der Sensor angeschlossen ist (im obigen Beispiel: GPIO12). Unter Time & Macros können Sie wie auch bei den Tastern Presets einstellen, welche aktiviert werden, falls der Bewegungsmelder-Ausgang angeht oder ausgeht (mit dem APIcommand T=1 bzw. T=0 kann das Licht ein/ausgeschaltet werden).Auf dem PIR-Sensor befinden sich zwei kleine Potentiometer: eines zur Einstellung der Empfindlichkeit und eines zur Steuerung der Verzögerungszeit. Passen Sie diese an, um sicherzustellen, dass der Sensor korrekt auf Bewegungen reagiert und das Licht nur so lange aktiviert bleibt, wie gewünscht. Andere Kommunikationsprotokolle Neben der direkten Steuerung können Sie auch verschiedene Kommunikationsprotokolle nutzen, um Ihr Setup mit anderen Systemen zu verbinden, oder spezielle Anwendungen zu realisieren. Dies macht Ihre WLED-Installation noch flexibler. Artnet & E1.31 Diese Protokolle werden häufig bei professionellen Lichtshows verwendet, etwa bei Bühnenbeleuchtungen für Konzerte oder Events. Sie können WLED als Teil eines DMX-Netzwerks integrieren, um die Steuerungen darüber durchzuführen.Zum Testen installieren Sie eine Software, wie zum Beispiel Jinx!, die Artnet oder E1.31 unterstützt und verbinden sich mit demselben Netzwerk, in dem sich ihr WLED Board befindet. Öffnen Sie die WLED-Oberfläche, gehen Sie zu Sync Interfaces und gehen Sie zur Option E1.31/Artnet. Gleichen Sie hier die DMX-Startadresse und das Universum mit ihrer Steuerungssoftware ab.Verwenden Sie die DMX-Software oder ein Lichtpult, um Effekte und Szenen zu erstellen. Diese können Sie dann in Echtzeit an Ihr WLED-Gerät übertragen. Philips Hue Wenn Sie schon Philips Hue-Beleuchtung benutzen, können Sie WLED ganz einfach in Ihr bestehendes Hue-Netzwerk integrieren. So können Sie alle Lichter gemeinsam steuern.Öffnen Sie die WLED-Oberfläche und navigieren Sie zu Sync Interfaces. Geben Sie unter der Option Philips Hue Sync die IP-Adresse Ihrer Hue Bridge ein und wählen Sie aus, welche Parameter aktualisiert werden sollen. HTTP-Requests WLED bietet eine flexible HTTP-API, über die Sie das System von jeder Anwendung aus steuern können, die HTTP-Requests senden kann. Öffnen Sie einen Browser und geben Sie HTTP-Befehle ein, um Ihre LEDs zu steuern (siehe API-commands).Zum Beispiel: http://[WLED-IP]/win&T=1 // Schaltet die LED an http://[WLED-IP]/win&A=128 // Setzt die Helligkeit auf 50 %http://[WLED-IP]/win&R=255&G=255&B=255 // alle LED an UDP-Befehle verwenden UDP eignet sich besonders für Anwendungen, bei denen eine schnelle Reaktion auf Steuerbefehle nötig ist. Ein Beispiel hierfür ist das Hyperion Project, welches eine Ambilight Hintergrundbeleuchtung auch auf einem WLED Controller ermöglicht (Siehe Blog: DIY Ambilight mit D1 Mini ESP8266 und Hyperion ) Soundreactive WLED Mit der Soundreactive-Version von WLED wird Ihre LED-Installation auf Musik bzw. Audiosignale reagieren und somit Lichteffekte erzeugen, die mit dem Rhythmus synchronisiert sind. Dies ist ideal für Partys, um eine einfache und dynamische Effektbeleuchtung zu erzeugen. Als Mikrocontroller benötigen Sie einen ESP32, laden Sie wie im ersten Teil die WLED Software mit dem WLED-Installer auf dieses. Wählen Sie hier jedoch die spezielle Audioreactive-Version aus. Um die bisherige Konfiguration weiterhin zu benutzen, können Sie sie speichern. Öffnen Sie hierfür in den Settings, Security & Updates und klicken Sie auf Backup Configuration. Dadurch laden Sie die Konfiguration als Datei herunter. Diese kann auf dem neuen Board in der Zeile darunter wieder Hochgeladen werden. Schließen Sie als Nächstes ein I2S Mikrofon wie das INMP441 an. Mikrofon D1mini VCC 3v3 GND GND SD 32 SCK 16 WS 17 In den WLED-Einstellungen müssen Sie noch unter Usermods die Pinbelegung anpassen. Des Weiteren kann die Verstärkung (Gain), Rauschunterdrückung (Squelch), die Mathematische Umwandlung (logarithmisch, linear, ...) und die Dynamik der Lichtreaktion angepasst werden. Wenn Sie nun Musik abspielen und einen kompatiblen Effekt auswählen, bewegen sich die LEDs im Rhythmus. WLED Studio Mit WLED Studio können Sie zum Beispiel Fotos oder Videos auf eine Matrix streamen.Öffnen Sie auf ihrem Computer ein Terminal und installieren Sie, falls noch nicht vorhanden, das aktuellste Python und git. Als nächstes klonen Sie das Github Respository von WLED Studio mit folgendem Befehl: git clone https://github.com/BradyMeighan/WLED-Studio.git Und wechseln Sie in das Verzeichnis mit:cd WLED-Studio Danach kann das Programm mit folgenden Befehlen installiert werden: python3 -m venv venv source venv/bin/activate # On Windows use `venv\Scripts\activate` pip install -r requirements.txt Öffnen Sie WLED Studio mit python main.py im Terminal, tragen Sie die IP Ihres WLED-Nodes in das Feld Host ein und passen Sie die Pixelanzahl an. In der Software können Sie Youtubevideos, Fotos, Text oder Videos über UDP auf ihre WLED Matrix streamen. Home Assistant Integration Für Smart-Home-Benutzer ist die Integration von WLED in Home Assistant eine großartige Möglichkeit, Ihre Beleuchtung in Ihre Hausautomatisierung einzubinden. Sie können WLED beispielsweise mit Automatisierungen steuern, die auf Ereignissen oder der Anwesenheit von Personen basieren. Klicken Sie in der Home Assistant Seite unter den Einstellungen > Geräte auf Integration hinzufügen und suchen Sie nach WLED. Geben Sie die IP-Adresse Ihres WLED-Geräts ein, um es zu Home Assistant hinzuzufügen. Octoprint WLED OctoWLED ist eine Erweiterung, die speziell für Nutzer von 3D-Druckern mit dem OctoPrint Server entwickelt wurde. Damit können Sie den Status Ihres 3D-Druckers (Start, Pause, Fehler) durch visuelle Effekte auf den LED anzeigen lassen. Öffnen Sie die OctoPrint Benutzeroberfläche, gehen Sie in den Einstellungen auf den PluginManager, suchen Sie nach WLED und Installieren Sie das Plug-In. Oder fügen Sie folgenden Link in das Feld über externe URL installieren ein: https://github.com/cp2004/OctoPrint-WLED/releases/latest/download/release.zip Geben Sie in den Plug-In-Einstellungen die IP-Adresse Ihres WLED-Geräts ein und konfigurieren Sie die gewünschten Farben und Effekte für verschiedene Druckphasen.Die LEDs ändern ihre Farbe oder beginnen zu blinken, wenn bestimmte Ereignisse eintreten (z. B. Druck abgeschlossen, aufheizen). Über Das „+“-Icon können neue Effekte hinzugefügt werden. Nachdem Sie in diesem Teil schon die Kommunikation über externe Software kennengelernt haben, wird im nächsten Teil ein kleines Lichtsteuerpult mithilfe eines ESP32 gebaut. Viel Spaß beim Nachbauen :) Kategorien: Esp-32, Esp-8266, Projekte für anfänger, Smart home Teilen Vorheriger BeitragNächser Beitrag Kommentar hinterlassenAlle Kommentare werden von einem Moderator vor der Veröffentlichung überprüft Name Email Inhalt Kommentar veröffentlichen #block-newsletter { background: #ffffff; color: #2b323f; } Bleiben Sie auf dem Laufenden Jetzt 15% Rabattcode sichern!Erfahren Sie immer sofort, wenn wir ein neues spannendes Projekt vorstellen oder unschlagbare Angebote haben! Abonnieren document.querySelector('.klaviyo_form_trigger3').addEventListener('click', function (){ window._klOnsite = window._klOnsite || []; window._klOnsite.push(['openForm', 'VaHWB6']); }); 100% kostenlos, Jederzeit abbestellbar! Empfohlene Blogbeiträge ESP32 jetzt über den Boardverwalter installierenESP-32Aug 07, 2018 Internet-Radio mit dem ESP32 - UPDATEDisplaysMär 14, 2022 Arduino IDE - Programmieren für Einsteiger - Teil 1Grundlagen SoftwareMär 13, 2020 ESP32 - das MultitalentESP-32Aug 14, 2020 Empfohlene Produkte AZ-Touch MOD Wandgehäuseset mit 2,8 Zoll Touchscreen für ESP8266 und ESP32 Sonderpreisab €32.99 Normalpreis€95.97 Auf Lager ESP32 D1 Mini NodeMCU WiFi Modul + Bluetooth Internet Entwicklungsboard kompatibel mit Arduino Sonderpreisab €10.99 Auf Lager Smart Robot Car DIY Learning 2wd Ultraschall Sensor Infrarot Fernbedienung Starter Kit Sonderpreis€44.99 Normalpreis€49.99 Ausverkauft Follow us'''
