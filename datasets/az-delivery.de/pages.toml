description = """
ESP32 mit integriertem WLAN und Bluetooth
Unsere ESP32 Mikrocontroller
Der ESP32 übertrifft die Leistungsparameter des ESP8266 im Bereich RAM und Taktfrequenz und enthält auch eine Reihe interessanter neuer Funktionen.Der ESP32 wurde von dem chinesischen Unternehmen Espressif als Nachfolgeprodukt für den beliebten ESP8266 entwickelt. Neben der Ausführung als Dual-Core Prozessor wurde der Controller um eine Bluetooth Funktionalität ergänzt.
ESP32 technische Details
Als Nachfolger für den ESP8266 wurde der ESP32 von Espressif mit einem neuen, eigens angepassten Prozessorkern ausgestattet. Der Prozessor basiert auf einem Xtensa Dual-Core SoC, arbeitet mit 32-Bit und taktet mit bis zu 240 MHz. Neben der neuen Architektur wurde auch die Konnektivität erweitert. Der ESP32 unterstützt zusätzlich zu den üblichen WiFi Standards wie 802.11 b/g/n auch Bluetooth und BLE.
Auch die analogen Funktionen wurden beim ESP32 wesentlich verbessert. Neu ist auch die zweite I2C-Schnittstelle, die es ermöglicht zwei Module mit identischer Adresse ohne zusätzliche Hardware zu betreiben.Mittlerweile bietet Espressif mehrere Varianten des ESP32 an, so wurde das Sortiment kürzlich um Modelle mit Kryptokern, Singlecore und RISC-V Architektur sowie Varianten mit zusätzlichen I/O Kapazitäten erweitert.
Sie finden in unserem Sortiment Module zur Montage auf Platinen, Evaluierungs- und Entwicklungsplattformen mit unterschiedlichen USB-Schnittstellen, zusätzlichem Onboard Display, Ladereglern, Kamera u.v.m.
ESP32 Programmieren
Kaum ein anderer Microcontroller lässt sich auf so vielfältige Weise wie der ESP32 programmieren. Es stehen mehrere unterschiedliche Betriebssysteme mit Alleinstellungsmerkmalen und Entwicklungsumgebungen unterschiedlichster Hersteller zur Verfügung.
Während Einsteiger dank umfangreicher Dokumentation und vielen frei verfügbaren Bibliotheken mit der Arduino IDE in die Welt der Microcontroller starten, schätzen fortgeschrittene Benutzer besonders den hohen Freiheitsgrad bei der Realisierung von Projekten.
So deckt der ESP32 z.B. mit Micropython grundlegende Funktionen aus dem Bereich Machine Learning ab oder kann mit FreeRTOS direkt an AWS (Amazon Web Services) angebunden werden.
ESP32 Pinout
Der ESP32 bietet viele Schnittstellen wie z.B. einen integrierten DAC, zwei I2C Busse oder mehrere UARTs, die sich flexibel einsetzen lassen.Wie gewohnt finden Sie die Pinouts und Anschlussdiagramme zu all unseren Mikrocontrollern auf den jeweiligen Produktdetailseiten.
Projekte für ESP32
Der ideale Anwendungsbereich für den ESP32 beginnt dort, wo das Leistungsspektrum des ESP8266 endet. Neben der erweiterten Konnektivität durch das zusätzliche Bluetooth Interface lassen sich auch die GPIOs flexibler nutzen und den Anwendungsbereich somit auch flexibler gestalten.
FAQ
Was kann man mit einem ESP32 machen?
Die Möglichkeiten mit dem ESP32 sind sehr vielfältig. Realisieren Sie mit dem ESP32 z.B. Steuergeräte, Eingabegeräte, Wetterstationen, Überwachungskameras, Gesichtserkennung, Türschilder, Zutrittssysteme, Barcodeleser, App-Interfaces, BT Beacons und Tags, Präsenzscanner, Smart Home Geräte, Sensor Nodes, Sensor Meshes, Wearables oder auch Kunstinstallationen.
Hat ESP32 Bluetooth?
Unsere Module und Boards mit ESP32 unterstützen Bluetooth incl. BLE in unterschiedlichen Versionen.
Welche Entwicklungsumgebung für den ESP32?
Bei der Wahl der Entwicklungsumgebung sind Sie sehr flexibel. Geeignet sind z.B. Arduino IDE, PlatformIO, Espressif IDF, Mongoose OS, Whitecat DIE, Visual Studio, Thonnie DIE, EasyCoding Tuniot, u.v.m.
Welche Programmiersprache eignet sich für ESP32?
Der ESP32 lässt sich mit den Programmiersprachen C/C++, Micropython, Circuitpython, LUA, JavaScript, Ruby und Rust (nur C3) ansteuern.
                                                                           Mehr anzeigen"""
