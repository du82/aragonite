full_description = 'Home Die perfekten Mikrocontroller für Ihr Projekt | AZ Delivery Filter Verfügbarkeit Auf Lager (53) Nicht vorrätig (18) Preis € - € <button type="submit" class="button button--secondary button--full" style="margin-top: 10px">Ergebnisse anzeigen</button> Die perfekten Mikrocontroller für Ihr Projekt | AZ Delivery58 Produkte Zeigt 1 - 24 von 58 Produkten Mikrocontroller für Ihr Elektronikprojekt Wir bieten Mikrocontroller mit den unterschiedlichsten Architekturen, in verschiedenen Leistungsklassen und in vielfältigen Bauformen zu günstigen Preisen. Stöbern Sie durch unser breites Sortiment von Entwickler-Modulen für einen einfachen Einstieg in die Welt der Mikroelektronik Unsere Mikrocontroller: Arduino kompatible Boards Unsere Arduino kompatiblen Boards wie der Nano V3 oder unser Pro Mini bieten eine solide und vielseitig verwendbare Projektgrundlage. ESP32 und ESP8266 Bei den leistungsfähigeren Boards der ESP-Familie wurde die Kernfunktionalität um eine praktische WiFi-Schnittstelle erweitert. Produkte mit ESP32-Prozessor haben außerdem eine integrierte Bluetooth Funktion, sowie eine Dual-Core CPU. D1 Mini Unsere Mikrocontroller der D1-Mini Serie sind sowohl mit ESP8266 als auch mit ESP32 Modulen verfügbar. Es gibt viele Shields (Zubehör) mit identischer Bauform in einem praktischen Stecksystem. NodeMCU Die Boards der NodeMCU-Serie wurden speziell zur Verwendung mit dem Betriebssystem NodeMCU entwickelt und ermöglicht eine Programmierung in der Sprache LUA. Raspberry Pi Der Raspberry Pi bildet mit seinem leistungsfähigen System-on-a-Chip (SoC) und vielen Schnittstellen das obere Ende unseres Sortiments. Durch die vorhandenen GPIO-Pins kann der Raspberry auch Funktionen eines Arduino-kompatiblen Boards übernehmen. Was heißt Arduino kompatibel? „Arduino“ beschreibt in den meisten Fällen die Physical-Computing Plattform. Die Arduino Plattform besteht aus freien Hardware- und Softwarekomponenten. Unter Arduino kompatibler Hardware versteht man Entwicklerboards mit identischem Prozessor und Pinout sowie installiertem Bootloader wie beim Originalprodukt. Alle Arduino kompatiblen Boards können mit der Arduino IDE (Software) programmiert werden. Die Arduino IDE verbirgt unter der schlichten Oberfläche die vollständige Toolchain. In manchen Fällen kann jedoch eine zusätzliche Treiberinstallation notwendig sein. Was ist ein Arduino Klon? Als Arduino-Klon bezeichnet man Entwicklerboards die, manchmal mit kleinen Änderungen, nach den Layouts und Schaltplänen von Arduino LLC gefertigt wurden. ESP32 und ESP8266 Die Besonderheit des ESP8266 und dessen Nachfolger, der ESP32, ist ein fast vollständig hardwareseitig implementierter TCP/IP Stack. Für Anwender ist dies von Vorteil, da der softwareseitige Aufwand zur Verwendung der WiFi Funktion auf ein Minimum reduziert werden kann. So lässt sich beispielsweise in einigen Programmierumgebungen ein WiFi Accesspoint mit wenigen Zeilen Code erstellen. NodeMCU Bei unseren NodeMCU Boards handelt es sich um Evaluierungsplattformen für das freie Betriebssystem NodeMCU. Auch wenn diese Module ebenfalls über die Arduino IDE in C bzw. C++ oder mit der Thonny IDE in Micropython programmiert werden können, so ist die Nutzung mit dem NodeMCU Betriebssystem und LUA besonders komfortabel. Die Software wurde für den ESP8266 von Espressif erstellt. Es gibt jedoch mittlerweile auch Beta-Versionen, die mit der neuen ESP32 Architektur kompatibel sind. Einer der Vorteile dieser Lösung ist, dass das Betriebssystem mit den gewünschten Modulen über eine Webseite konfiguriert, kompiliert und heruntergeladen werden kann. D1 Mini Beim D1 Mini handelt es sich um ein praktisches Stecksystem mit minimalistischen Abmessungen. Auf den Boards ist neben dem ESP-Prozessor ein Festspannungsregler sowie ein USB-Seriell Chip mit Minimalbeschaltung vorhanden, um die kompakte Bauform mit dem leistungsstarken Prozessor beibehalten zu können. Mittlerweile wurde die D1 Mini Serie auch durch ein Modul mit ESP32 erweitert. Die D1 Mini Boards lassen sich mit der Arduino DIE in C/C++ sowie mit der Thonny IDE in Micropython oder auch mit fertiger Firmware wie Tasmota oder ESPEasy nutzen. Passend zu diesen Boards haben wir viele praktische Shields zum einfachen Aufstecken auf die D1 Mini Module in unserem Sortiment. Raspberry Pi Als leistungsstarker Mini-PC kann der Raspberry Pi Robotik-Projekte steuern oder auch als Media-Center oder Thin Client agieren. Der Raspberry Pi wird auch als kleiner Server in Heimnetzwerken gerne verwendet. Es stehen aktuell mehrere unterschiedliche Betriebssysteme sowie vorkonfigurierte Images zur Verfügung. Mithilfe seiner GPIO Pins des Raspberry kann der Raspberry Pi Aufgaben aus dem Anwendungsspektrum eines Arduino-Boards übernehmen, auch wenn der Aufwand für Konfiguration und Programmierung höher ist. FAQ Was ist ein Mikrocontroller? Einfach erklärt... Ein Mikrocontroller steckt heutzutage in so gut wie jedem elektronischen Gerät. Die kleinen Halbleiterchips werden mittels einer Programmierumgebung mit Programmcode bespielt und können so eine Vielzahl von Funktionen übernehmen. Viele Mikrocontroller bieten standardisierte Schnittstellen, um beispielsweise Sensoren auszulesen oder Displays anzusteuern. Welcher Mikrocontroller eignet sich für Anfänger? Mikrocontroller der Arduino-Familie sind für Einsteiger am geeignetsten. Für die robusten Controller stehen eine Vielzahl an freien Softwarebibliotheken zur Verfügung, um möglichst komfortabel in das Thema der Mikrocontrollerprogrammierung einzusteigen. Was ist besser Raspberry Pi oder Arduino? Das mögliche Aufgabenspektrum des Raspberry Pi ist deutlich höher als das der Arduino Boards, die meist mit 8-bit Controllern betrieben werden. Da der Raspberry ein anderes Aufgabenspektrum besitzt ist der direkte Vergleich etwas „unfair“. Das Arbeiten mit einem Arduino ist i.d.R. sehr hardwarenah, beim Raspberry steht der Software-Teil im Mittelpunkt. Mehr anzeigen Filter Zeigt 1 - 24 von 58 Produkten Anzeige: 24 p