title = "0,91 Zoll OLED Display I2C SSD1306 Chip 128 x 32 Pixel"
description = """
Beschreibung                    
                                                                  


Das AZ-Delivery 0.91 Zoll OLED I2C Display mit 128x32 Pixeln ist sehr kompakt und kompatibel mit Arduino, Raspberry Pi und andere Mikrocontroller.
Durch den hohen Kontrast der Anzeige ist das AZ-Delivery Display sehr gut ablesbar. Die Pins leuchten selbst und es wird keine Hintergrundbeleuchtung benötigt, was zu einem geringen Energieverbrauch beiträgt.
Dieses praktische Display ist ideal für die Verwendung mit Mikrocontrollern wie ESP32, ESP8266, STM32, AVR, DSP, ARM, PLC, TTL logic, etc. geeignet.
Die Steuerung erfolgt über die I2C-Schnittstelle, wodurch nur 4 Anschlusspins benötigt werden.
Mit den beiden Bibliotheken Adafruit GFX und Adafruit SSD1306, die auch Beispielskizzen enthalten, kann das Display schnell programmiert und verwendet werden.
Spezifikationen:

Größe der Platine: 38x12mm
Größe des Bildschirms: 26 x 9,5mm 
Punktmatrix: 128 x 32
Pixelgröße: 0,152 × 0,152 mm
Pixelabstand: 0,175 × 0,175 mm
Anzeige-Modus: Passive Matrix
Versorgungsspannung des Displays: 3,3V - 5V

 Im Paket enthalten:

1 x 0,91 Zoll I2C Display 
E-Book zum leichten Einstieg

Willkommen in der AZ-Delivery-Familie! Hier finden Sie qualitativ hochwertige Produkte für Ihre Projekte mit Raspberry Pi. Wir freuen uns, Ihnen eine Reihe von Anwendungsbeispielen, komplette Installationsanleitungen, E-Books, Bibliotheken und persönliche Unterstützung anbieten zu können. AZ-Delivery: Ihr Mikroelektronik-Experte!"""
