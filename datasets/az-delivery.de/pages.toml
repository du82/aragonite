["https://az-delivery.de/collections/nodemcu"]
title = "NodeMCU Boards mit ESP8266 oder ESP32 | AZ Delivery"
description = """
NodeMCU Boards mit Wlan
Bei den “NodeMCU-Boards” handelt es sich um Entwicklungsboards für das Betriebssystem NodeMCU, welche mit vorkompilierter modularer Firmware und der Skriptspache LUA programmiert werden können. Alle NodeMCU Boards sind mit einem ESP-Prozessor, einer USB-Schnittstelle und einer stabilisierten Stromversorgung ausgestattet. Während die ersten Boards noch mit einem ESP8266 12-E bestückt waren, gibt es mittlerweile auch neue Varianten mit ESP8266 12-F oder ESP32-Wroom Prozessor
Unsere NodeMCU Produkte
NodeMCU Amica V2
Das Amica V2 Board ist ein breadboardfreundlicher Controller mit einem ESP12-F Prozessor und einer CP2102 USB Schnittstelle.
NodeMCU LoLin V3
Das LoLin V3 Modul ist ebenfalls mit einem ESP12-F ausgestattet, besitzt jedoch eine USB-Schnittstelle mit CH340 Chipsatz. Die Stromversorgung wurde überarbeitet, wodurch sich die Baugröße geringfügig erhöht.
D1 mini ESP8266MOD
Der D1 Mini ist das kompakteste NodeMCU Board in unserem Sortiment und nur etwa halb so groß wie ein LoLin V3 Modul. Trotz des geringen Baufaktors steht weiter eine USB-Schnittstelle mit CH340 sowie die volle Leistung des ESP-Prozessors zur Verfügung.
NodeMCU ESP32
Beim NodeMCU ESP32 handelt es sich um ein angepasstes Design des Espressif ESP32 Dev Kit C V2, welches mit einem ESP32-Wroom Modul bestückt ist. Der ESP32-Prozessor ist eine Weiterentwicklung des ESP8266 mit mehr Leistung und Dual-Core Prozessor. Das NodeMCU Betriebssystem für den ESP32 befindet sich noch in der Beta-Phase.
Arduino kompatibel
Alle unsere NodeMCU Boards können mithilfe der Arduino IDE und der Arduino Sprachreferenz programmiert werden. Viele freie Bibliotheken für die Arduino Boards wurden mittlerweile auch für den ESP angepasst oder zusätzliche Versionen veröffentlicht. In vielen Fällen sind die NodeMCUs mit ESP den Arduino-Boards überlegen und besser zum Einstieg in das Thema IoT geeignet.
NodeMCU Programmierung
Die NodeMCU Boards können mit LUA und dem NodeMCU Betriebssystem programmiert werden. Eine vollständige Programmierung in der Arduino IDE ist nach der Installation des Plugins in der Arduino IDE ohne Einschränkungen möglich. Wie alle ESP8266 Module können die NodeMCU Boards in weiteren Sprachen wie z.B. Micropython programmiert werden. Auch eine grafische Programmierung ist möglich
NodeMCU Pinout
Selbstverständlich finden Sie wie gewohnt die Pinouts zu unseren Controllern, Datenblättern, Verbindungsdiagrammen und Anleitungen auf den jeweiligen Produktdetailseiten.
Typische Projekte für NodeMCU
Die NodeMCU Boards eignen sich ideal zum Einstieg in das Thema IoT. Dank der integrierten WLAN-Schnittstelle und dem komfortablen Handling der Netzwerkfunktionen lassen sich in Sekunden Sensorwerte über eine Webseite anzeigen, Daten via MQTT übertragen oder auch der Status eines WLANs in Empfangsreichweite überwachen. Beliebte Projekte sind Wetterstationen, Social Media Counter Displays oder Smart Home Geräte.
                                                                           Mehr anzeigen"""
