title = "Sensoren | AZ Delivery"
description = """
Unsere Sensoren
In unserem Sortiment finden Sie eine große Anzahl unterschiedlicher Sensoren für Arduinos, Raspberrys und ESPs. Unsere Produktpalette umfasst sowohl einfache Sensoren wie die KY-Sensormodule als auch neuere GY-Varianten mit digitalem Interface. Einige KY-Sensoren bieten wir zusätzlich auch mit einem einstellbaren Schaltkontakt an. In unseren günstigen Sensor Kits finden Sie auch eine sinnvolle Zusammenstellung von Sensoren, ideal zum Lernen oder Experimentieren.

Was ist ein Sensor?
Bei einem Sensor handelt es sich um ein Bauteil oder eine Baumgruppe zur Erfassung physikalischer Zustände bzw. Größen. Sensoren sind in der Lage, diese Zustände zu erfassen und als Signal auszugeben, deshalb werden sie auch Messumformer oder Messumsetzer genannt. Sensoren unterscheiden sich in der Regel nach Ihrem Verwendungszweck (Messgröße) und dem Funktionsprinzip (Messprinzip). Typische Messgrößen sind beispielsweise Temperatur oder Abstand die zusammen mit den unterschiedlichen Messprinzipien wie optoelektronisch oder mit Hilfe des elektrischen Widerstand zusammen dann als resistive Temperatursensoren (Widerstandsthermometer), optische Temperatursensoren (IR, Wärmebild) oder optische Abstandsmesser (ToF-Sensor, VL53L0X) bezeichnet werden können.

Wofür wird ein Sensor benötigt?
Sensoren sind für viele Anwendungen unverzichtbar geworden. Beispielsweise übernehmen sie zentrale Aufgaben im Bereich der Steuerungs-, Regel- und Automatisierungstechnik. Sensoren werden notwendig, sobald ein Gerät, eine Maschine oder auch eine Schaltung einen spezifischen Impuls benötigt, um eine Aktion auszuführen.

Welche Arten von Sensoren gibt es?
Da der Begriff Sensor recht weit gefasst ist, gibt es eine nahezu endlose Auswahl unterschiedlicher Sensoren. Man unterscheidet z.B. aktive und passive Sensoren oder nach dem Mess- bzw. Wirkprinzip wie: mechanisch, optisch, akustisch, magnetisch, kapazitiv u.v.m.Temperatursensoren sind gute Beispiele, da die Temperatur über sehr viele Messprinzipien gemessen werden kann. Einfache Varianten sind hier der klassische Bimetall Schalter, Heiß- bzw. Kaltleiter oder Thermoelemente. Es existieren jedoch auch aufwändige Varianten wie pyroelektrische oder faseroptische Temperatursensoren. Beim DS18B20 handelt es sich um einen Digitale Halbleiter-Temperatursensor, diese finden sich auch in Festkörperschaltkreisen wie Mikroprozessoren, die Messung erfolgt dann meist resistiv mithilfe eines Transistors. Als weiteres Beispiel kann unser Bewegungsmelder genannt werden, dabei handelt es sich um einen (optischen) Infrarot Sensor der Mithilfe des pyroelektrischen Effekts in der Lage ist Temperaturänderungen in elektrische Signale umzuwandeln und auszugeben.

Welchen Sensor benötige ich für mein Projekt?
Um einen möglichst ideal geeigneten Sensor für sein Projekt zu finden, ist es notwendig, die interne Funktionsweise des Sensors zu verstehen und genau zu prüfen, ob das zugrunde liegende Messprinzip für die gedachte Verwendung geeignet ist. In der Praxis ist dieser Weg jedoch oft Ingenieuren oder Technikern vorbehalten. In den meisten Fällen ist dies jedoch auch gar nicht notwendig und die Auswahl des Sensors kann anhand der angegebenen Messgröße und dem gewünschten Signalausgang als komfortabelste Lösung erfolgen.                                                                          Mehr anzeigen"""
