description = 'Wer sind wir und was ist der Geltungsbereich dieser Datenschutzerklärung? Als Datenverantwortlicher verarbeitet AZ-Delivery Vertriebs GmbH („wir“, „uns“ oder "unser") bestimmte personenbezogene Daten, damit Sie unseren E-Commerce-Shop auf unserer Website nutzen und unsere Produkte genießen können.'
full_description = "Privacy Policy Wer sind wir und was ist der Geltungsbereich dieser Datenschutzrichtlinie? Die AZ-Delivery Vertriebs GmbH („wir“, „uns“, „unser“ oder „AZ-Delivery“) verarbeitet als für die Verarbeitung Verantwortlicher bestimmte personenbezogene Daten, um Ihnen die Nutzung unseres E-Commerce-Shops auf unserer Website sowie den Genuss unserer Produkte zu ermöglichen. Diese Datenschutzerklärung beschreibt die Verarbeitung Ihrer persönlichen Daten und informiert Sie über Ihre Rechte in Bezug auf Ihre persönlichen Daten. Diese Datenschutzerklärung gilt für alle Websites, die unter unserer Domain (https://www.az-delivery.de/) betrieben werden, einschließlich unseres E-Commerce-Shops und der damit verbundenen Aktivitäten, wie z. B. die Organisation von Lieferungen und die Durchführung von Marketingmaßnahmen. Bitte beachten Sie, dass unsere Websites in einigen Fällen Links zu externen Websites Dritter enthalten können, die weder von uns betrieben werden noch unter diese Datenschutzrichtlinie fallen. Um mehr über die von diesen Dritten durchgeführten Datenverarbeitungsvorgänge zu erfahren, empfehlen wir Ihnen, deren Datenschutzrichtlinien zu lesen. Wenn Sie unsere Produkte über eine Website Dritter (z. B. Amazon) bestellen, können diese Dritten Ihre personenbezogenen Daten für ihre eigenen Zwecke verarbeiten und als für die Datenverarbeitung Verantwortliche auftreten. Weitere Informationen über deren Datenverarbeitungsvorgänge finden Sie in den jeweiligen Datenschutzrichtlinien. Wenn Sie mehr darüber erfahren möchten, welche Cookies und ähnliche Technologien wir verwenden, lesen Sie bitte unsere Cookie-Richtlinie. Wenn Sie im Vereinigten Königreich („UK“) ansässig sind, beziehen sich alle Verweise auf die Allgemeine Datenschutzverordnung („GDPR“) auf die entsprechenden Klauseln der UK General Data Protection Regulation („UK GDPR“). Welche personenbezogenen Daten verarbeiten wir, zu welchen Zwecken und aufgrund welcher Rechtsgrundlagen? Erbringung von Dienstleistungen Es ist notwendig, dass AZ-Delivery Ihre Kontaktinformationen, einschließlich Name, Telefonnummer, E-Mail-Adresse und Lieferanschrift, sowie Ihre Zahlungs- und Bestellinformationen (z. B. Zahlungsmethode, Produktinformationen, Bestelldatum und Versandmethode) verarbeitet, um: Die Kaufverträge auszuführen, einschließlich Versand, Lieferung und Zahlungsabwicklung; Beantwortung von Anfragen, Verwaltung Ihres Kontos und Erbringung sonstiger Kundendienstleistungen; Ansprüche zu verwalten und Rücksendungen, Beschwerden und Garantieansprüche zu bearbeiten; Bereitstellung von nicht werblichen Servicemitteilungen an Sie, z. B. zu technischen, sicherheitsrelevanten Themen und Vertragsangelegenheiten (z. B. Betrugswarnungen, Kontosperrungen oder Vertragsänderungen); Erbringung weiterer von Ihnen angeforderter Dienstleistungen. Darüber hinaus können wir, falls erforderlich, Ihre Sozialversicherungsnummer oder Ihr Geburtsdatum zum Zwecke der Kreditprüfung verarbeiten. Die rechtmäßige Grundlage für diese Kreditprüfung ist Art. 6(1)(f) GDPR. Unser berechtigtes Interesse ist die Vermeidung des Risikos von Zahlungsausfällen. Die Rechtsgrundlage für die Weiterverarbeitung dieser Daten zu den genannten Zwecken ist unser Vertrag gemäß Art. 6(1)(b) GDPR in Form unserer Allgemeinen Geschäftsbedingungen. Marketing Wir verarbeiten Ihre Kontaktinformationen, einschließlich E-Mail-Adresse und Telefonnummer, auch für Marketingzwecke. In dem Maße, in dem der Inhalt der Marketingmitteilungen personalisiert ist, können wir auch Ihre Bestellhistorie (d.h. zuvor gekaufte Produkte) sowie Ihre Interessen, wie sie durch die von Ihnen akzeptierten Cookies angezeigt werden, verarbeiten (für weitere Informationen siehe Cookie-Richtlinie). Zu den Marketingmaßnahmen gehören: das Versenden von Newslettern, Erinnerungen, Produktaktualisierungen, Empfehlungen, Werbeangeboten und anderen Werbemitteilungen an Ihre E-Mail Adresse; die Übermittlung von Werbebotschaften an Sie über Textnachrichten und die Anwendungen WhatsApp oder Facebook Messenger; das gezielte Senden von Werbeinhalten an Sie und an Dritte auf Social-Media-Plattformen wie Facebook, Instagram und TikTok; Senden von Push-Benachrichtigungen, einschließlich Marketingmitteilungen, an Sie. Die anwendbare Rechtsgrundlage für Marketingkommunikation und Social Media Targeting ist entweder die Einwilligung (Art. 6(1)(a) GDPR) oder das berechtigte Interesse von AZ-Delivery, Direktmarketing zu betreiben (Art. 6(1)(f) GDPR). Bitte beachten Sie, dass Push-Benachrichtigungen Ihre Einwilligung erfordern, die auch die rechtmäßige Grundlage für die Verarbeitung personenbezogener Daten ist, die zur Bereitstellung solcher Benachrichtigungen erhoben werden. Wenn Sie sich zum ersten Mal für die Dienste anmelden, möchte AZ-Delivery Ihre Daten für Marketingkommunikation und Social Media Targeting verarbeiten, um Ihnen Informationen über ähnliche Produkte oder Dienstleistungen zukommen zu lassen, an denen Sie Interesse gezeigt haben. AZ-Delivery gibt Ihnen die Möglichkeit, der Verwendung Ihrer personenbezogenen Daten für Marketingzwecke zu widersprechen, und zwar über die Abmeldelinks oder durch Änderung der Marketingeinstellungen in Ihrem Profil, falls zutreffend. Für den Fall, dass wir Sie stattdessen um Ihre Zustimmung zu unseren Marketingmaßnahmen bitten oder Sie dies später in Ihrem Profil oder über Funktionen unserer Website tun (z. B. um eine Benachrichtigung zu erhalten, sobald ein nicht mehr vorrätiges Produkt wieder verfügbar ist), ist die rechtmäßige Grundlage für die Verarbeitung Ihre Einwilligung. Um Ihr Einkaufserlebnis zu verbessern, Ihnen maßgeschneiderte Mitteilungen und Werbeaktionen zukommen zu lassen und Ihnen die Möglichkeit zu geben, Treuepunkte zu sammeln und personalisierte Rabatte zu erhalten, erfassen wir bestimmte Informationen, um Sie einem Kundensegment zuzuordnen und ein Kundenprofil zu erstellen. Zusätzlich zu den oben definierten personenbezogenen Daten, einschließlich Ihres Namens und Ihrer Adressdaten, basieren das zugewiesene Segment und das erstellte Profil auf: Ihrer Kaufhistorie; Ihren Geräte- und Netzwerkinformationen; Ihren Aktionen auf unserer Website und auf Websites Dritter, sofern Sie Cookies akzeptiert haben; Ihre Interaktion mit unserer Kommunikation, einschließlich der Seiten sozialer Medien über Pixel und personalisierte URLs; Ihr Geburtstag, wenn Sie ihn angegeben haben. Die rechtmäßige Grundlage für die Erstellung dieser Segmente und Profile sowie deren Verwendung zur Personalisierung der Dienste und Marketingmitteilungen ist unser berechtigtes Interesse an der Durchführung von personalisiertem Marketing und Ihr berechtigtes Interesse am Erhalt von personalisierten Rabatten und Empfehlungen auf der Grundlage Ihrer Interessen gemäß Art. 6(1)(f) GDPR. Blog Wir können einen Blog auf unserer Website betreiben. Dadurch haben Sie die Möglichkeit, mit unserem Blog und anderen Lesern zu interagieren, indem Sie Ihre Kommentare abgeben oder Benachrichtigungen abonnieren, wenn neue Kommentare oder Blogartikel veröffentlicht werden. Wenn Sie sich entscheiden, einen Kommentar zu hinterlassen, sind die verarbeiteten personenbezogenen Daten Ihr Name oder der von Ihnen gewählte Benutzername (Pseudonym), der auf der Website öffentlich zugänglich ist, sowie Ihre E-Mail-Adresse und Ihre IP-Adresse, die in nichtöffentlicher Weise verarbeitet werden. Die rechtmäßige Grundlage für die Verarbeitung dieser Daten sind unsere berechtigten Interessen gemäß Art. 6(1)(f) GDPR, um Ihnen die Interaktion mit unseren Bloggern und anderen Kommentatoren zu ermöglichen, sowie Ihr berechtigtes Interesse, dies zu tun. Wenn Sie sich für das Abonnement von Kommentarbenachrichtigungen entscheiden, ist die rechtmäßige Grundlage die Einwilligung gemäß Art. 6(1)(a) GDPR. Gemeinschaft Wir hoffen, dass Sie mit unseren Produkten zufrieden sind und begrüßen Ihr Feedback und Ihre Vorschläge für Verbesserungen oder neue Produkte. Zu diesem Zweck können wir eine Kunden-Community auf Facebook betreiben. Wir verarbeiten Metriken über die Gruppe, einschließlich der Aktivität und des Engagements der Mitglieder innerhalb der Gruppe, um z. B. zu verstehen, wie Sie sich innerhalb der Gruppe engagieren, um zu sehen, wer die aktivsten Gruppenmitglieder sind und um zu erfahren, welche Beiträge das größte Engagement haben. Die rechtmäßige Grundlage für die Verarbeitung solcher Gruppeninformationen sind unsere berechtigten Interessen gemäß Art. 6(1)(f) GDPR, mit unseren Kunden zu interagieren, um bessere Produkte zu entwickeln, und Ihr berechtigtes Interesse, mit uns in Kontakt zu treten und uns Feedback zu geben. Wir haben ein Empfehlungsprogramm eingerichtet, bei dem Sie uns und unsere Produkte an Ihre Freunde weiterempfehlen können. Zu diesem Zweck können Sie entweder Ihren persönlichen Code mit Ihren Freunden teilen oder die Kontaktdaten Ihrer Freunde übermitteln, die dann über den angegebenen Kanal (z. B. per E-Mail) benachrichtigt werden. Die rechtmäßige Grundlage für diese Verarbeitung sind unsere berechtigten Interessen, mit potenziellen neuen Kunden in Kontakt zu treten, Ihre berechtigten Interessen, Ihren Freunden Empfehlungen zu senden, und die berechtigten Interessen Ihrer Freunde, Empfehlungen zu erhalten, die sie interessieren könnten. Wir werden Ihren Freund über Ihre Empfehlung informieren und ihm in der ersten Mitteilung angemessene Informationen über unsere Datenschutzpraktiken geben. Sollte Ihr Freund kein Kunde werden, werden wir seine Kontaktdaten nicht speichern. Wenn Sie sich dafür entscheiden, Ihren Code weiterzugeben und Ihr Freund verwendet ihn, oder wenn Sie der Freund sind, der den Code verwendet, werden wir diese Informationen in Ihrem Kundenprofil speichern, um Ihnen die Rabatte oder andere Vorteile im Zusammenhang mit der Verwendung des Codes zukommen zu lassen. Andere Zwecke Wir können die oben genannten Kategorien personenbezogener Daten sowie weitere Daten, die als personenbezogene Daten definiert werden können, die durch unsere wesentlichen Cookies oder auf andere Weise erhoben werden, auch für die folgenden Zwecke verwenden: Aufrechterhaltung der Sicherheit unserer Website und Dienste, einschließlich der Verhinderung von Datenschutzverletzungen; Betrugsprävention; Forschung und Entwicklung unserer Website und Dienste, vorausgesetzt, die Daten liegen in zusammengefasster, pseudonymisierter oder anonymisierter Form vor; Einhaltung von Gesetzen oder gerichtlichen Anordnungen (z. B. zur Durchführung von anwendbaren Anti-Geldwäsche- oder Know-Your-Customer-Prüfungen); Begründung, Ausübung oder Verteidigung von Rechtsansprüchen. Für diese Vorgänge stützen wir uns auf unsere berechtigten Interessen zur Aufdeckung und Verhinderung von Betrug, zur Aufrechterhaltung der Sicherheit unserer Dienste und zur Verbesserung derselben sowie zur Verfolgung oder Abwehr von Rechtsansprüchen gemäß Art. 6(1)(f) GDPR). Wenn wir Ihre personenbezogenen Daten verarbeiten müssen, um rechtlichen Verpflichtungen nachzukommen, z. B. geltenden Gesetzen und Vorschriften oder gerichtlichen Anordnungen, ist die anwendbare Rechtsgrundlage für die Verarbeitung die rechtliche Verpflichtung gemäß Art. 6(1)(c) GDPR. Woher erhalten wir Ihre personenbezogenen Daten und mit wem teilen wir sie? Im Allgemeinen verarbeiten wir personenbezogene Daten, die uns direkt von Ihnen zur Verfügung gestellt werden oder die sich aus Ihrer Nutzung unserer Dienste ergeben. Im Rahmen unserer Geschäftstätigkeit müssen wir auch Dienstleister beauftragen, die uns bei der Bereitstellung unserer Dienstleistungen und Produkte für Sie unterstützen und die vorbehaltlich angemessener Vereinbarungen und Sicherheitsmaßnahmen Ihre personenbezogenen Daten an uns weitergeben oder mit denen wir Ihre personenbezogenen Daten teilen können. Zu diesen Dienstleistern können gehören: E-Commerce-Plattformen; Anbieter von Zahlungsdiensten; Kreditprüfungsagenturen; Plattformen für Kundenservice und Beziehungsmanagement; Kundensupportdienste (z. B. Chat-Anbieter); Marketing-Plattformen und -Dienste, einschließlich Social-Media-Plattformen und Conversion-Tracking-Dienste; Lieferunternehmen; Anbieter von Inkassodiensten; Anbieter von Treue-, Belohnungs- und Empfehlungsprogrammen; Unternehmen, die zum selben Konzern gehören wie wir; Berater, Wirtschaftsprüfer oder Versicherungsgesellschaften; Dritte bei einer Geschäftstransaktion (z. B. bei einer Fusion, einer Übernahme oder einer Liquidation). Darüber hinaus können wir Ihre Daten an Strafverfolgungsbehörden oder andere relevante Dritte weitergeben, wenn wir gesetzlich oder per Gerichtsbeschluss verpflichtet sind, Ihre personenbezogenen Daten offenzulegen, oder wenn wir dies zur Begründung, Ausübung oder Verteidigung von Rechtsansprüchen benötigen. Sind Sie verpflichtet, die personenbezogenen Daten bereitzustellen, und welche Folgen kann die Nichtbereitstellung dieser Daten haben? Soweit sich aus den obigen Ausführungen zu den anwendbaren Rechtsgrundlagen nichts anderes ergibt, sind Sie nicht verpflichtet, uns personenbezogene Daten zur Verfügung zu stellen oder zugänglich zu machen. In den in Art. 6 (1)(b) GDPR genannten Fälle sind die personenbezogenen Daten jedoch für den Abschluss oder die Erfüllung eines Vertrags erforderlich. Wenn Sie uns die entsprechenden personenbezogenen Daten nicht zur Verfügung stellen, können wir den Vertrag nicht abschließen oder erfüllen. Wenn Sie uns die Daten in den Fällen des Art. 6 (1)(a) und (f) GDPR genannten Fälle nicht zur Verfügung stellen, können Sie die entsprechenden Teile unserer Dienste nicht nutzen. Handelt es sich bei Dritten um gemeinsam für die Verarbeitung Verantwortliche? Wenn personenbezogene Ereignisdaten über Facebooks Social Plugins, Pixel oder Software Development Kits (SDKs) im Rahmen der Nutzung der Facebook Business Tools-Dienste durch AZ-Delivery verarbeitet werden, fungiert Meta Platforms Ireland Ltd als Mitverantwortlicher für die Verarbeitung. Dies gilt auch für die Verarbeitung personenbezogener Daten in Ereign