ockly) zur Verfügung. Fortgeschrittene Benutzer verwenden den ESP auch mit PlatformIO, Thonny IDE (Micropython), Visual Studio, Eclipse, mit dem Espressif-IDF oder auch dem NodeMCU Betriebssystem zur Programmierung mit LUA. ESP8266 Pinout Die Boards mit ESP8266 stellen viele hardwareseitige Schnittstellen wie z.B. UART, I2C oder SPI zur Verfügung. Neben den digitalen IO-Pins ist auch ein analoger Pin vorhanden, der mit Einschränkungen genutzt werden kann.Sie finden die Pinouts und Anschlussdiagramme der ESP8266 auf den jeweiligen Produktdetailseiten. Projekte für ESP8266 Der ESP8266 punktet vor allem in Projekten bei denen eine WiFi Verbindung erforderlich ist. So lassen sich z.B. besonders einfach Wetterstationen oder Uhren (mit NTP) umsetzten. Auf diese Weise lässt sich auch eine Steuerung per App für die eigenen Projekte integrieren. Dank dem Logiklevel von 3.3V ist der ESP8266 mit vielen Sensoren und Zubehör für den Raspberry Pi oder STM32 kompatibel. Mit dem ESP8266 können so beispielsweise Sensorwerte ausgelesen und über eine am ESP gehostete Website angezeigt werden. FAQ Was kann man mit einem ESP8266 machen? Der ESP8266 eignet sich als Stand-Allone-Controller sowie als WiFi-Interface für bereits bestehende Projekte. Online stehen viele Anleitungen für den Controller zur Verfügung. Durch den hohen Verbreitungsgrad und der umfangreichen Dokumentation ist ein Einstieg in die Welt der Microcontroller mit dieser Architektur besonders komfortabel. Eine OTA-Programmierung ist ebenfalls möglich. Was ist NodeMCU ESP8266? Bei den NodeMCU ESP8266 Modulen handelt es sich um Evaluierungsboards, die zur Verwendung mit dem NodeMCU Betriebssystem designt wurden. Die NodeMCU Firmware lässt sich über einen Online Cloud Service mit vorkonfigurierten Extensions (Bibliotheken) kompilieren. Hat der ESP8266 Bluetooth? Die ESP8266 Module sind alle mit WLAN ausgestattet. Wenn Sie auf der Suche nach einem Mikrocontroller mit Bluetooth sind, sollten Sie zu einem unserer ESP32 Boards greifen. Mehr anzeigen Filter Zeigt 1 - 15 von 15 Produkten Anzeige: 24 pro Seite Anzeige 24 pro Seite 36 pro Seite 48 pro Seite SortierungSortierung: meistverkauft Sortierung Ausgewählt meistverkauft Alphabetisch, A-Z Alphabetisch, Z-A Preis, niedrig nach hoch Preis, hoch nach niedrig Datum, alt zu neu Datum, neu zu alt Ansicht D1 Mini NodeMcu mit ESP8266-12F WLAN Modul kompatibel mit Arduino Sonderpreisab €6.99 Auf Lager Optionen wählenSchnellansichtEinsparung €11.48 NodeMCU Lua Lolin V3 Module ESP8266 ESP-12F WIFI Wifi Development Board mit CH340 Sonderpreisab €7.99 Normalpreis€19.47 Auf Lager Optionen wählenSchnellansichtEinsparung €13.98 D1 Mini V3 NodeMCU mit ESP8266-12F WLAN Modul kompatibel mit Arduino Sonderpreisab €6.99 Normalpreis€20.97 Auf Lager Optionen wählenSchnellansicht NodeMCU Lua Amica Modul V2 ESP8266 ESP-12F WIFI Wifi Development Board mit CP2102 Sonderpreisab €8.49 Auf Lager Optionen wählenSchnellansicht ESP8266 ESP-01S WLAN WiFi Modul für Raspberry Pi Sonderpreisab €6.99 Auf Lager Optionen wählenSchnellansicht AZ-Envy Wlan ESP8266-12F Umwelt Entwicklungsboard mit Feuchtigkeits- und Luftqualitätssensor (MQ-2 und SHT30) kompatibel mit Arduino Sonderpreisab €9.99 Auf Lager Optionen wählenSchnellansichtEinsparung €1.00 ESP8266-01S ESP-01S Wlan WiFi Modul 5V mit Relais Adapter Sonderpreisab €6.99 Normalpreis€7.99 Auf Lager Optionen wählenSchnellansicht D1 Board NodeMCU ESP8266MOD-12F WiFi Wlan Modul kompatibel mit Arduino Sonderpreisab €7.99 Auf Lager Optionen wählenSchnellansicht ESP8266 ESP-01S mit USB-Adapter Wlan WiFi Modul Sonderpreisab €7.49 Auf Lager Optionen wählenSchnellansicht ESP8266 Heltec NodeMCU Mikrocontroller mit integriertem 0.91" OLED Display Sonderpreisab €15.99 Auf Lager Optionen wählenSchnellansichtEinsparung €0.50 ESP8266 01S esp-01S Wlan WiFi Modul mit Breadboardadapter Sonderpreisab €6.49 Normalpreis€6.99 Auf Lager Optionen wählenSchnellansichtEinsparung €0.30 NodeMCU Lua Lolin V3 Module ESP8266 ESP-12F WIFI Development Board