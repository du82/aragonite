description = "Bei AZ-Delivery unterstützen wir Sie gerne, um Ihnen das bestmögliche Einkaufserlebnis zu bieten. Auf unserer Hilfe-Seite beantworten wir die häufigsten Fragen zum Bestellvorgang, zu E-Books, Blogs und vielem mehr. Kontaktieren Sie uns, falls Ihre Frage nicht dabei war. Wir von AZ-Delivery helfen Ihnen gerne."
full_description = '''FAQ & Hilfe <!-- .accordion { background-color: #fff; color: #444; cursor: pointer; padding: 18px; width: 100%; border: none; text-align: left; outline: none; font-size: 15px; transition: 0.4s; } .active, .accordion:hover { background-color: #cb2900; color: #ffffff; } .panel { padding: 0 18px; display: none; background-color: white; overflow: hidden; } --> Bevor Sie uns Ihr Anliegen per Email zusenden, empfehlen wir erst in den FAQs nach einer passenden Antwort zu suchen. Kundenkonto Wie kann ich mein Kundenkonto löschen? Es ist schade, dass Sie sich entschieden haben, Ihr AZ-Delivery Kundenkonto löschen zu lassen. Bitte wenden Sie sich in diesem Fall an den Kundensupport. Brauche ich ein Kundenkonto, um zu bestellen? Sie benötigen kein Kundenkonto, um zu bestellen. Sie können sich jedoch registrieren und ein Kundenkonto anlegen, in dem Sie alle Ihre Bestellungen bei AZ-Delivery sowie Ihre gespeicherten Adressen einsehen können. Wie kann ich mich bei AZ-Delivery registrieren? Oben im Shop von AZ-Delivery gibt es ein Icon, das Sie anklicken können. Sie können sich bei AZ-Delivery anmelden, indem Sie auf die Schaltfläche "Konto erstellen" klicken. Ich habe mein Passwort vergessen, was nun? Es ist kein Problem, wenn Sie Ihr Passwort vergessen haben; klicken Sie einfach auf "Anmelden" und wählen Sie dann "Passwort vergessen". Geben Sie Ihre E-Mail-Adresse ein, und wir schicken Ihnen eine Nachricht mit Anweisungen zu den folgenden Schritten. Ich würde gerne meine Adresse ändern. Wie kann ich das tun? Um Ihre Adresse zu ändern, gehen Sie bitte zu Ihrem AZ-Delivery-Konto und klicken Sie auf "Meine Adressen" und dann auf "Neue Adresse hinzufügen". Dort können Sie Ihre neue Adresse hinzufügen. Sie können auch wählen, ob Sie Ihre alte Adresse behalten oder löschen möchten. Blog & Newsletter Wie kann ich einen Blogbeitrag einreichen? Wir freuen uns auf jeden Blogbeitrag! Für weitere Informationen wenden Sie sich bitte an folgende E-Mail. Wie kann ich den Newsletter abbestellen? Es ist schade, dass Sie den AZ-Delivery Newsletter abbestellen möchten. Sie können den Newsletter abbestellen, indem Sie am Ende der erhaltenen E-Mail auf "abbestellen" klicken. Alternativ können Sie auch in Ihrem Kundenkonto in unserem Online-Shop auf der Seite mit den E-Mail-Einstellungen das Abonnement kündigen. Sollten Sie dennoch Hilfe benötigen, wenden Sie sich bitte an unseren Kundensupport. Er wird Ihnen gerne weiterhelfen. Ich habe meine E-Mail-Adresse geändert. Wie kann ich sie für den Newsletter aktualisieren? Wenn Sie ein Abonnent des Newsletters sind und E-Mails von AZ-Delivery an eine andere Adresse erhalten möchten, melden Sie sich bitte mit Ihrer neuen E-Mail-Adresse an. Sie können den Erhalt von E-Mails an die "alte" E-Mail-Adresse abbestellen. Warum erhalte ich keine AZ-Delivery-E-Mails auf meinem E-Mail-Konto? Es ist bedauerlich, dass AZ-Delivery Ihnen keine E-Mails schickt. Es kann sich um ein technisches Problem handeln oder die E-Mail-Adresse wurde falsch eingegeben. Um sicherzustellen, dass Sie unsere besten Angebote und Rabatte nicht verpassen, melden Sie sich bitte noch einmal für den AZ-Delivery Newsletter an. Produkte Wann ist das Produkt wieder verfügbar? Ausverkaufte Produkte sind in der Regel in den nächsten 2-4 Wochen wieder verfügbar. Wir empfehlen Ihnen jedoch, mehrmals in unserem Shop vorbeizuschauen, da die oben genannten Zeiten variieren können. Bestellungen Was sind die Zahlungsmöglichkeiten? PayPal Visa Mastercard PayPal Ratenzahlung Amerikanischer Express Sofortige Banküberweisung Kauf auf Rechnung (Klarna) Wo gebe ich bei der Bestellung im Shop meine Umsatzsteuer-ID ein? Sie können Ihre Umsatzsteuer-ID gerne in der Rechnungsadresse hinter Ihrem Firmennamen eintragen. Es ist kein spezielles Feld vorgesehen. Versand Wo finde ich meine Rechnung? Nachdem Ihre Bestellung bei uns eingegangen ist, erhalten Sie innerhalb von 48 Stunden Ihre Rechnung per E-Mail. Sie erhalten die Rechnung an die E-Mail-Adresse, die Sie bei der Bestellung angegeben haben. Achtung! Wenn Sie Ihre Rechnung nach 48 Stunden nicht erhalten haben, wenden Sie sich bitte an unseren Kundenservice. Wo befindet sich meine Bestellung? Nachdem Ihre Bestellung unser Haus verlassen hat, erhalten Sie eine Versandbestätigung. In der Versandbestätigung finden Sie eine Trackingnummer, mit der Sie Ihre Sendung verfolgen können. Achtung! Liegt der Lieferort außerhalb Deutschlands, kann es häufig zu Fehlern bei der Sendungsverfolgung kommen. In diesem Fall bitten wir Sie um Geduld. Sollte das Paket nicht innerhalb von 7 Werktagen bei Ihnen eintreffen, kontaktieren Sie bitte unseren Kundenservice und teilen Sie uns Ihr Anliegen sowie Ihre Bestellnummer und Lieferadresse mit. Wie sind die Bedingungen für den Versand? Wir versenden Ihre Bestellung mit DHL oder UPS. Bei beiden Dienstleistern bieten wir auch Expressversand an. Die Bestellung wird innerhalb von 1-2 Werktagen bearbeitet und versendet. Weitere Informationen finden Sie hier: Informationen zum Versand Ich habe die falsche Adresse angegeben, was passiert jetzt? Bitte setzen Sie sich so schnell wie möglich mit dem Kundenservice in Verbindung, wenn Sie eine falsche Adresse angegeben haben. Hinweis: Wir können keine Änderungen vornehmen, wenn die Bestellungen vor der Benachrichtigung des Kundendienstes versandt wurden. Bietet AZ-Delivery auch Expressversand an? Ja, AZ-Delivery bietet Expressversand an. Sie werden Ihre Bestellung innerhalb von 1-2 Tagen erhalten. Hinweis: Der Samstag gilt nicht als Werktag! Wie lange dauert der Versand und wie hoch sind die Kosten? Der Versand dauert 1-3 Arbeitstage. Bei einem Bestellwert unter 25 € wird eine Versandkostenpauschale von 2,90 € erhoben. Überall in der EU übernehmen wir die Lieferkosten, wenn Ihre Bestellung einen Wert von mehr als 25 € hat! Lieferung und Rückerstattung Wie kann ich meine Bestellung ändern oder stornieren? Eine Änderung der Bestellung ist nicht möglich. Sie können die Bestellung jedoch über unseren Kundendienst stornieren lassen, wenn sie noch nicht versandt wurde. Wenn die Bestellung bereits verschickt wurde, ist eine Stornierung nicht mehr möglich. Wie kann ich meine Bestellung zurücksenden? Senden Sie die Rücksendung an die folgende Adresse: AZ-Delivery Vertriebs GmbH Lärchenstraße 10 94469 Deggendorf Deutschland Achtung! Bitte fügen Sie den Retourenschein der Rücksendung bei. Hier finden Sie das Rückgabeformular Was kann ich tun, wenn ein Produkt offensichtlich defekt oder fehlerhaft ist? Wenn eines oder mehrere Ihrer Produkte offensichtlich defekt oder fehlerhaft sind, wenden Sie sich bitte direkt an unseren Kundenservice. Beschreiben Sie Ihr Anliegen in einer kurzen Nachricht. Wir bitten Sie, die Bestellnummer sowie die Lieferadresse der Nachricht bezüglich einer Nachlieferung beizufügen. Unsere Bestellnummer sieht immer aus wie "AZ-XXX .." oder "XXX-XXXXXX-XXXXXXXX". Meine Lieferung kam unvollständig an. Was kann ich tun? Wir entschuldigen uns, wenn Ihre Bestellung unvollständig war. Bitte setzen Sie sich mit unserem Kundendienst in Verbindung, wenn Ihr Paket nicht mit allen bestellten Produkten angekommen ist. Bitte werfen Sie den Karton noch nicht weg, da wir die Fotos für die weitere Bearbeitung benötigen könnten. Wann und wie erfolgt die Rückerstattung? Sie erhalten von uns eine Bestätigungs-E-Mail, sobald wir Ihre Rücksendung erhalten und bearbeitet haben. Der Gesamtbetrag der Rechnung, einschließlich der Versandkosten, wird dann oft innerhalb weniger Werktage (spätestens jedoch innerhalb von 14 Tagen) erstattet. Bitte beachten Sie, dass die Bearbeitung von Rücksendungen gelegentlich länger dauern kann als erwartet. Wenn Sie länger als 14 Tage auf eine Empfangsbestätigung warten, können Sie sich mit dem Kundenservice in Verbindung setzen. Bitte halten Sie die Tracking-Nummer der Rücksendung bereit. Rabatt-Gutscheine Mein Gutscheincode wurde nicht oder nur teilweise berechnet. Was ist der Grund? Das kann passieren, wenn der Gutschein nur für eine bestimmte Kategorie/Produkt gilt. Dies kann auch passieren, wenn bereits ein anderer Rabatt auf Produkte in Ihrem Warenkorb angewendet wurde. Ebook Wie kann ich das E-Book herunterladen? Klicken Sie auf den Reiter "Kostenlose E-Books" auf unserer Homepage. Wählen Sie nun Ihr gewünschtes E-Book aus und klicken Sie auf "Schnellansicht". Wählen Sie die gewünschte Sprache und klicken Sie auf "In den Warenkorb legen". Dann klicken Sie auf "Zur Kasse". Füllen Sie das Formular aus. Bitte achten Sie auf eine korrekte Schreibweise! Klicken Sie auf "Zahlung fortsetzen". Klicken Sie auf "Jetzt bezahlen". Sie erhalten nun Ihren Download-Link auf der Website. Wann ist das E-Book verfügbar? Die Fertigstellung unserer E-Books dauert in der Regel 4-5 Wochen. Unsere E-Books werden regelmäßig überarbeitet, um Ihnen die aktuellste Dokumentation zum Produkt anbieten zu können. Achtung! Wenn ein E-Book nicht in Ihrer Sprache verfügbar ist, bitten wir Sie, die englische Version herunterzuladen, da diese in der Regel früher verfügbar ist. Was beinhaltet das ebook? Das Ebook enthält detaillierte Anleitungen oder Anwendungsvorschläge für jedes Produkt. Außerdem erhalten Sie ausführliche Informationen zu dem von Ihnen gewählten Produkt. Geschäftskunden Wie kann ich als Geschäftskunde eine Bestellung aufgeben? Sobald Sie als Geschäftskunde registriert sind, können Sie sich in den B2B-Bereich unserer Website einloggen. Hier können Sie wie in jedem anderen Online-Shop Ihre Bestellung aufgeben. Wie kann ich mich als AZ-Delivery-Geschäftskunde registrieren? Der B2B-Bereich ist im Hauptmenü unseres Online-Shops sichtbar. Klicken Sie ihn einfach an und wählen Sie dann "Registrieren". Wo kann ich eine Übersicht über meine offenen Geschäftskundenbestellungen und Rechnungen sehen? Eine Übersicht über Ihre Bestellungen können Sie in Ihrem AZ-Delivery-Konto einsehen. Melden Sie sich einfach in Ihrem Konto an und klicken Sie auf "Meine Bestellungen". Für weitere Fragen steht Ihnen unser Kundenservice gerne zur Verfügung. Per Email: support@az-delivery.com Per Telefon (8:00-16:00): 0991 / 999 27 8 27 // <![CDATA[ var acc = document.getElementsByClassName("accordion"); var i; for (i = 0; i < acc.length; i++) { acc[i].addEventListener("click", function() { this.classList.toggle("active"); var panel = this.nextElementSibling; if (panel.style.display === "block") { panel.style.display = "none"; } else { panel.style.display = "block"; } }); } // ]]> Newsletter abonnieren und 15% sparen! Erfahren Sie immer gleich als Erster, wenn ein neues interessantes Projekt vorgestellt wird. Wir informieren Sie ebenfalls sofort, wenn Produkte zu einem unschlagbaren Preis im Angebot sind! Melden Sie sich jetzt an und erhalten Sie 15% Rabatt auf Ihre nächste Bestellung. Jetzt abonnieren document.querySelector('.klaviyo_form_trigger2').addEventListener('click', function (){ window._klOnsite = window._klOnsite || []; window._klOnsite.push(['openForm', 'VaHWB6']); });'''
