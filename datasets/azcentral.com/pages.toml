["https://azcentral.com/story/money/food/2025/03/01/mcdonalds-breakfast-sandwich-deal-egg-mcmuffin-day/80867061007"]
title = "How to redeem McDonald's deal for $1 breakfast sandwich on Sunday"
description = "Purchase an Egg McMuffin or Sausage McMuffin with Egg for $1 through the McDonald's app on Sunday."
full_description = '''FOODGet a McDonald's breakfast sandwich for $1 on Sunday for Egg McMuffin Day. How to redeem. Greta CrossUSA TODAYWith the Oscars right around the corner, fans may want to start the day with a breakfast treat.McDonald's is offering Egg McMuffins and Sausage McMuffins with Egg for just $1 on Sunday, when ordered through the McDonald's app. Deemed Egg McMuffin Day, the celebration honors the breakfast sandwich's 50th anniversary.As some food chains have announced surcharges to items containing eggs, due to the nationwide egg shortage, McDonald's promised prices will not rise."Unlike others making news recently, you definitely won't see McDonald's USA issuing surcharges on eggs, which are 100% cage-free and sourced in the U.S," McDonald's Chief Impact Officer Michael Gonda wrote in a LinkedIn post on Tuesday.Who 'invented' the Egg McMuffin?Herb Peterson, a McDonald's franchisee in Santa Barbara, California, is the brains behind the Egg McMuffin, introduced in 1975. Herb, according to a news release, presented a to-go version of the Eggs Benedict to Ray Kroc, the businessman who transformed McDonald's into what folks know it as today.Need a break? Play the USA TODAY Daily Crossword Puzzle."When I watched my father introduce this idea to Ray Kroc, we could not have anticipated it would become the foundation for the renowned McDonald’s breakfast menu," David Peterson, Herb's son and McDonald’s owner and operator, said in a news release. "It’s been remarkable to see people embrace this innovation over the last five decades, and now we get to share that heritage with a new generation of breakfast fans."How many calories does the Egg McMuffin have?The Egg McMuffin, made with an English Muffin, egg, Canadian Bacon, American cheese, salted butter and clarified butter, is 310 calories.Download USA TODAY's app to get to the heart of news Angel Reese becomes first female athlete with McDonald's meal special: How to get it today Shamrock Shake is back, joined by an old McDonald's friend: Here's what to know When is the new Thin Mints Frosty available at Wendy's? What to know about Girl Scouts collab 'Delectable and minty:' Wendy's and Girl Scouts collaborate on Thin Mint-inspired Frosty McDonald's closes 3 CosMc's locations a year after opening, but promises more to comeOther McDonald's deals, promotions$1 Egg McMuffins isn't the only deal McDonald's is offering this month. Here are other deals and new menu items customers can expect:BOGO Sausage McMuffin with Egg: Redeem a buy-one-get-one-free Sausage McMuffin with Egg when ordering delivery through the McDonald's app between March 3-30Bagels: Bagel sandwiches are now available at McDonald's locations nationwideKrispy Kreme: Krispy Kreme Doughnuts are available at New York McDonald's locationsContributing: Anthony Robledo, USA TODAYGreta Cross is a national trending reporter at USA TODAY. Follow her on X and Instagram @gretalcross. Story idea? Email her at gcross@usatoday.com.'''
