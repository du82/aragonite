["https://azcentral.com/story/money/business/2025/03/01/cannons-lasers-protect-arizona-chickens-bird-flu/78607103007"]
title = "How cannons and laser light shows save Arizona egg-laying chickens"
description = "Arizona farm deals with significant loss after flock became infected with Avian flu."
full_description = '''BUSINESSCannons and laser light shows used to save egg-laying chickens at Hickman's farmsShawn Raymundo Wren SmetanaArizona Republic“Boom!”That’s the sound meant to frighten wild birds from landing at Hickman’s Family Farms.“It’s like a cannon going off,” explained Glenn Hickman, president of the largest egg producer in the Southwest United States. “They’re kind of random, but each (air) cannon probably goes off every five or six minutes.”The Buckeye-based chicken farm has utilized air cannons and other biosecurity measures to scare away birds from its Arlington, Maricopa and Tonopah facilities.But after enduring two avian flu outbreaks at its Maricopa barn since November, forcing the company to cull about a million egg-laying hens, Hickman’s has stepped up its efforts to deter potentially infected birds.Need a break? Play the USA TODAY Daily Crossword Puzzle.“We’ve always had some, but we’ve increased the amount,” Hickman said of the bird-control methods at the company’s farms.Such measures include reflective ribbons and keeping the roadways moist with disinfectant and water to prevent dust and airborne viruses. Noninvasive lasers are also used."We have a variable pattern aimed at the ground,” Hickman described of the lasers, which he added, “does not hurt the birds, but scares them and they leave whatever area they were roosting on.”Like other farms across the nation, Hickman’s has reduced operations and struggled to keep up with the demand for eggs since losing flocks of chickens to the bird flu.The global outbreak, which began in 2022, has created egg shortages. It’s also led to record-high prices for cartons of eggs at grocery stores and has prompted restaurants to place surcharges on egg-featured items.For those normally assigned to work at Hickman’s Maricopa farm, the reduced operations have meant a shift in their responsibilities while the company works to repopulate the chickens.“Many of our employees at that farm have been with us for years. They took (the death of chickens) as personally as anyone in management or ownership,” Hickman stated in an email when asked about the situation’s impact on the farmhands.Most workers have been temporarily reassigned to the other facilities in Arlington and Tonopah. They'll work there until about May when Hickman’s is slated to get more birds at its Maricopa farm.“We’re trying to move people around and keep everybody busy,” Hickman said.Though workers haven’t been laid off, a few, he noted, have opted not to be reassigned amid the repopulation efforts.“When we get birds in, they’ll be the first ones we want to see about getting back,” Hickman said. In addition to the biosecurity measures meant to protect the farm’s chickens, Hickman’s also has safety protocols to protect the employees.That includes having the workers shower and change into protective gear before entering the barn.“When they leave,” Hickman said, “they shower again, change their clothes and go back home.”Even with new and beefed-up security, Hickman still isn’t confident the farms won't be further affected by avian influenza if vaccines don't become widely available.“It's us against an invisible enemy,” Hickman said. “We remain vigilant and are constantly reinforcing good practice.”The Department of Agriculture recently issued a conditional license to Zoetis, a New Jersey-based vaccine manufacturer, for an avian flu vaccine.According to one department official who spoke to NBC News, the conditional license “is simply a normal step in the research and development phase, not in the implementation of a vaccine strategy.”FAA investigating Minnesota woman's skydiving death in Arizona Red flag warnings issued across Arizona 'C' is for cattle: Arizona ranchers endure drought, volatile prices, urban encroachment $7.25M awarded to Queen Creek woman after fall on Universal Studios Hollywood's Harry Potter rideAccording to the Centers for Disease Control, wild birds are spreading the H5 bird flu worldwide, causing outbreaks in poultry and U.S. dairy cows.Since 2022, more than 166 million chickens have been infected with bird flu. Among humans, there have been 70 cases in the U.S. and one fatality.Two cases of humans with avian influenza were reported in Arizona after two Pinal County workers tested positive in December. State officials said both made a full recovery,The virus is transmitted through the saliva, mucus, and feces of sick animals. It is mostly contracted through direct contact, but prolonged inhalation near infected animals can also lead to infection.Like this story? Get more West Valley news straight into your email inbox by signing up for our free weekly West Valley Newsletter, which comes out on Tuesdays.Shawn Raymundo covers the West Valley cities of Glendale, Peoria and Surprise. Reach him atsraymundo@gannett.com or follow him on X @ShawnzyTsunami.'''
author = "Shawn Raymundo and Wren Smetana"
