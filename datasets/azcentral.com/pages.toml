["https://azcentral.com/story/entertainment/dining/2025/03/01/celebrities-durants-steakhouse/80865322007"]
title = "Durant's restaurant in Phoenix has fed these celebrities"
description = "Over its 75 years in business, Durant's steak house in Phoenix has hosted movie stars, athletes and politicians. Here's a look at 20 of the celebs."
full_description = '''FOOD & DINING20 celebrities spotted dining at Durant's in Phoenix over the years Bahar AnooshahrArizona RepublicSince Jack Durant and Jack R. McElroy opened Durant's in 1950 in Wayne’s Midway on Central Avenue, it's become one of the most iconic steak houses in Phoenix, welcoming politicians, celebrities and athletes. But when they opened 75 years ago, they didn't know it would become a Phoenix landmark. In fact, at one point they planned to purchase the building, flip it and sell it.A former minor league baseball player, Durant invited players to the restaurant during spring training and soon it became a hub for movers and shakers, athletes and celebrities."Many business deals went down over dinner at Durant's," McElroy's son told The Republic. During the restaurant’s heyday in the 1960s, he remembered people asking him where Marilyn Monroe sat (reportedly in booths 52 and 53). And she wasn't the only VIP.Here are 20 famous faces spotted dining at Durant over the years:Marilyn Monroe John Wayne Jane RussellRobert MitchumClark GableLisa Fineberg MaloneJohn Sankovich Burt ReynoldsJim NaborsLucille BallZsa Zsa GaborEngelbert HumperdinckAdam SandlerRob SchneiderHenry WinklerDizzy DeanJoe DiMaggioArizona Governor Rose MoffordJohn Edwards and his wifeSenator Barry GoldwaterNeed a break? Play the USA TODAY Daily Crossword Puzzle.Ron Wolfley, booming voice of the Arizona Cardinals, steps down after 20 years What time is the planet parade? How to see it tonight in Arizona This Phoenix bar was named best in the US. Join us At The Bar to taste why Don’t fear Saint Pasta. What you've gotta try at new Phoenix Italian restaurantReach the reporter at BAnooshahr@azcentral.com. Follow @baharcreative on Instagram.The legend lives on:It's the end of an era for Durant's in Phoenix'''
