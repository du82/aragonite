title = "Salvador Zerboni confía en que sigue siendo querido por el público"
description = "Salvador Zerboni aseguró que fue el primer expulsado de 'La Casa de los Famosos All Stars', por pleitos entre terceros."
full_description = "TV Y MÁSSalvador Zerboni lamenta haber salido de 'La Casa de los Famosos All Stars'Salvador Zerboni aseguró que fue el primer expulsado de 'La Casa de los Famosos All Stars', por pleitos entre terceros.Diana GarcíaCorresponsal Cd. de MéxicoA unas semanas de haber sido el primer expulsado de “La Casa de los Famosos All Stars”, el actor Salvador Zerboni asegura que salió perjudicado por pleitos entre terceros, pero sabe que el público y sus compañeros lo quieren mucho porque así se lo han manifestado.“Salí salpicado por un fuego cruzado que traen personas que son muy rencorosas y tienen temas que no han olvidado de otras temporadas y se andan peleando entre ellos y pues yo salí salpicado hasta la calle”, expresó.A pesar de su salida, Salvador se encuentra tranquilo ya que vio el amor que le tiene el público y sus compañeros también, pues al igual que él mismo, lamentaron su pronta salida.“Pues estoy muy contento, porque me di cuenta que hasta los mismos habitantes me extrañaban, gritaban 'aluche', extrañándome”, señaló.El actor será parte del Gay Pride 2025, por lo que defendió a su compañero Adame, ya que asegura que no odia a la comunidad gay.“No tiene nada en contra de la comunidad como se habla mucho de él, de que es misógino, hay que tener mucho cuidado con las palabras que usamos, porque las palabras tienen mucha fuerza, lo poco que yo he visto, en mi opinión, porque no he visto tampoco su vida, no me importa tanto, no tiene nada en contra”, indicó.Lunes de eliminación: ¿Quién salió de 'La Casa de los Famosos All-Stars'? Salvador Zerboni es el primer eliminado Laura Bozzo y Alfredo Adame llegan a acuerdo de paz en 'La Casa de los Famosos All-Stars' Arranca 'La Casa de los Famosos All-Stars' Participantes de 'La Casa de los Famosos All-Stars'Diana García es corresponsal en la Ciudad de México para La Voz Arizona. Sigue su cobertura en X @DianaGaav."
author = "Diana García"
year_published = 2025
