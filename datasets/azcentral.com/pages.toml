["https://azcentral.com/story/entretenimiento/tvymas/2025/02/28/angelica-maria-y-angelica-vale-se-solidarizan-con-alicia-villarreal/80712716007"]
title = "Angélica María y Angélica Vale se solidarizan con Alicia Villarreal"
description = "Angélica María y Angélica Vale enviaron un mensaje de apoyo a Alicia Villarreal, quien denunció a ex marido por violencia."
full_description = '''TV Y MÁSAngélica María y Angélica Vale brindan su apoyo a Alicia VillarrealAngélica María y Angélica Vale enviaron un mensaje de apoyo a Alicia Villarreal, quien denunció a ex marido por violencia.Diana GarcíaCorresponsal Cd. de MéxicoDebido a la amistad que tienen con Alicia Villarreal, las también cantantes Angélica María y Angélica Vale se solidarizaron con ella luego de que ratificó su denuncia por violencia en contra de ex esposo Cruz Martínez.“Sabe que tiene todo mi apoyo, la quiero muchísimo, qué momento tan más difícil el que está pasando, sabe que la amo, sabe que ahí estoy, a lo lejos, pero ahí estoy”, expresó Angélica Vale.Habrá que recordar que la Vale convivió mucho con Alicia en el programa dominical “Juego de Voces” y sabe de su calidad humana y su discreción en cuanto a su vida privada, por lo que puede entender perfecto que este momento está siendo muy complicado para la regiomontana, sobretodo por el hecho de hacer pública su denuncia.“Es muy doloroso por lo que está pasando, y que se haga público, me imagino que la parte más difícil, sufrir lo que pasa en casa, pero que además se haga público, es un peso, ni modo, somos figuras y a veces suceden esas cosas“, agregó.Lamentan muerte de Daniel BisognoLa cantantes también lamentaron la muerte de Daniel Bisogno, quien además de ser su familiar fue una gran ser humano.“Aprendimos a querernos mucho. No solo a él, sino también a Ivette, a Alejandrito, a toda la familia, a los amigos de Dani. La última vez que nos vimos fue en el Pepsi Center, hace no mucho. Nos abrazamos, nos dimos besos. Nos dio tanto gusto verlo, porque sabíamos que había estado enfermito. Y sí, duele muchísimo", señaló Angélica María.Alguna vez Angélica María reveló que estaban relacionados familiarmente, porque la abuela de Bisogno era prima de su mamá, doña Angélica Ortiz.Angélica Vale y Angélica María se presentarán el 24 de mayo en el Auditorio Nacional con el espectáculo “Las Angélicas Show”.Muere Daniel Bisogno, amado y polémico conductor de 'Ventaneando', a los 51 años ¿Quién es Cruz Martínez? Alicia Villareal denuncia a su expareja por supuesto abuso Muere Paquita la del Barrio, cantante de 'Rata de dos patas', a los 77 años Shakira cancela concierto en Perú tras ser hospitalizada Muere 'Tongolele', bailarina y actriz de la Época de Oro del Cine MexicanoDiana García es corresponsal en la Ciudad de México para La Voz Arizona. Sigue su cobertura en X @DianaGaav.'''
