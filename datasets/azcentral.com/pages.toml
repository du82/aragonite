["https://azcentral.com/story/news/local/arizona-breaking/2025/03/01/migrant-smuggler-extradited-from-mexico-to-u-s/80841740007"]
title = "Migrant smuggler extradited from Mexico to US"
description = "Accused smugglers allegedly charged migrants tens of thousands of dollars to make the journey to the U.S., according to the DOJ."
full_description = '''BREAKING NEWSMigrant smuggler extradited from Mexico to United States to face Arizona chargesWren SmetanaArizona RepublicAn accused human trafficker who worked on the United States-Mexico border for several years was recently extradited to the United States from Mexico to face charges, according to the U.S. Department of Justice.Paul Saucedo-Huipio, 49, was surrendered by Mexico to U.S. authorities on Feb. 21 to face previously filed charges in Arizona, the DOJ confirmed. He also made his initial appearance on Feb. 21 in California. Saucedo-Huipio was arrested in Mexico in 2023.A co-conspirator, 62-year-old Ofelia Hernandez-Salas, was extradited to the United States from Mexico in 2023 and pleaded guilty in 2024 to conspiracy to bring aliens to the United States and substantive counts of bringing an alien to the U.S.According to court documents, Saucedo-Huipio is accused of conspiring with other smugglers, including Hernandez-Salas, to bring a large number of migrants into the United States from Bangladesh, Yemen, Pakistan, Eritrea, India, the United Arab Emirates, Uzbekistan, Russia, Egypt, Peru, Ecuador, Colombia, Costa Rica, Nicaragua, El Salvador, Honduras, Guatemala and Mexico.Saucedo-Huipio and Hernandez-Salas allegedly charged migrants as much as tens of thousands of dollars to make the journey and directed them where to cross the border into the United States, including providing them with a ladder to climb over the border fence, according to the DOJ. It's further alleged the co-conspirators robbed the migrants of their money and personal belongings.Immigration and Customs Enforcement Homeland Security Investigations in Yuma are investigating the case with assistance from multiple other agencies.FAA investigating Minnesota woman's skydiving death in Arizona Red flag warnings issued across Arizona 'C' is for cattle: Arizona ranchers endure drought, volatile prices, urban encroachment $7.25M awarded to Queen Creek woman after fall on Universal Studios Hollywood's Harry Potter rideAccording to the DOJ website, "the indictments against Raul Saucedo-Huipio and Hernandez-Salas, and their subsequent arrests and extraditions, were coordinated through Joint Task Force Alpha. JFTA was created in partnership with the Department of Homeland Security (DHS) to strengthen the Justice Department's efforts to combat the rise in prolific and dangerous smuggling emanating from Central America and impacting our border communities."'''
author = "Wren Smetana"
year_published = 2025
