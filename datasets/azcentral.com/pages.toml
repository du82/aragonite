["https://azcentral.com/story/news/local/arizona-breaking/2025/03/01/fiery-interstate-10-crash-west-of-phoenix-leaves-3-dead-eastbound-lanes-closed/80998567007"]
title = "Fiery I-10 crash west of Phoenix leaves 6 dead; eastbound lanes closed"
description = "The fatal I-10 crash occurred just west of the community of Tonopah and claimed the lives of six people, with 13 injured."
full_description = "BREAKING NEWS6 killed, 13 taken to hospital after fiery I-10 crash west of Phoenix; I-10 eastbound closed Rey Covarrubias Jr.Arizona RepublicSix people were dead and 13 injured after a crash on Interstate 10 west of Phoenix involving multiple vehicles and tractor-trailers, and eastbound lanes of the freeway were expected to be closed for hours, authorities said.State troopers responded to calls of a collision on eastbound I-10 about 14 miles west of Tonopah, a community on the outskirts of the Phoenix area, shortly before 1 p.m. Saturday, according to a spokesperson for the Arizona Department of Public Safety.Multiple vehicles caught fire after the crash, and initial reports from law enforcement indicated three people were dead, according to DPS. A photo supplied by the agency showed at least five vehicles scorched by the fire and two intact tractor-trailers positioned along the freeway shoulder.After a temporary closure of I-10 in both directions, DPS said the eastbound lanes would remain closed for hours. The spokesperson didn't specify an estimated time of reopening.The DPS spokesperson declined to share further information as the scene remained active and an investigation continued.Just before 7 p.m., a DPS spokesperson said the death toll had risen to four people.At 7:40 p.m., DPS updated that figure to six people confirmed dead and 13 people taken to hospitals with injuries as a result of the crash and fire.The Arizona Department of Transportation said drivers headed east on I-10 were being exited onto Salome Road, a surface street that led to the nearest eastbound entrance at 411th Avenue.ADOT advised drivers to stay connected to real-time traffic information at az511.com.Westbound traffic on I-10 remained open.FAA investigating Minnesota woman's skydiving death in Arizona Red flag warnings issued across Arizona 'C' is for cattle: Arizona ranchers endure drought, volatile prices, urban encroachment $7.25M awarded to Queen Creek woman after fall on Universal Studios Hollywood's Harry Potter rideThis is a developing story. Return to azcentral.com for updates.Reach reporter Rey Covarrubias Jr. at rcovarrubias@gannett.com. Follow him on X, Threads and Bluesky @ReyCJrAZ.(This story was updated to add new information.)"
