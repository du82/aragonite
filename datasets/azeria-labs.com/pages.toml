title = "Process Continuation Shellcode |  Azeria Labs"
full_description = '''Teaching an Old Dog New Tricks: Adding Process Continuation to an Old Exploit This write-up is a collaboration between Azeria and @b1ack0wl, who developed the exploit targeting a Buffer Overflow in the MIPS device Belkin F9K1122v1. This initial exploit can be found on exploit-db: Belkin F9K1122v1 1.00.30 – Buffer Overflow. The target device is running a Lexra based MIPS chip based on MIPS-I ASM which is different from the MIPS-II based MIPS32. Finding a vulnerability and getting shellcode to execute is an euphoric feeling, but have you ever had the target program crash afterwards? In this tutorial, we are going through the thought process of developing process continuation shellcode and implementing it into the existing exploit. The new exploit will then be demonstrated after transforming it into a working Metasploit module. Table of Contents: What is process continuation? Root causing the bug Analyzing normal execution What is needed to resume execution? Developing the shellcode to patch memory Custom shellcode overview Demo MIPS Assembly Basics These Boxes contain the relevant MIPS instructions for each section, to make this write-up easier to read for people who are not very familiar with MIPS. The instructions are represented and explained as follows: INSTRUCTION – Description of the instruction [Pseudo-Syntax of the instruction] [Syntax of the instruction] [Example] What is process continuation? Process continuation is the ability to keep a process running as if nothing happened after exploiting a memory corruption vulnerability. This is important for things like: Being sneaky (if your exploit causes a crash that’s visible to the target -> game over), Kernel exploitation (Kernel Panic || Blue screen), Being able to re-exploit a processes that does not have a watchdog. The original exploit that was developed for the F9K1122v1 results in code execution, but once the reverse shell disconnects the process exits and a new process is spun up via a watchdog. The goal is to redo the exploit and shellcode to have the vulnerable service stay up after exploitation. Even though the vulnerability discussed in this post is a stack based overflow, the methods presented can also be used for developing process continuation for other types of vulnerabilities. The following is a high level outline of the steps when developing shellcode for process continuation: Analyze normal run-time behavior Figure out what’s corrupted and why Figure out how to repair it Figure out where to return to and not have the process fall over Document failures Repeat until you get it. Using a combination of run-time blackbox testing, static analysis, and source code analysis (if possible) will get you much better results than trying to rely on only one of those methods. Root causing the bug MIPS Assembly Basics JR – [Jump Register] Jump to the address contained in register. jr register jr $s jr $ra JALR – [Jump And Link Register] Jump to the address contained in register rs, with a 1-instruction delay. Place the address of the instruction following the delay slot in register rd. jalr register_to_hold, register_to_jump_to jalr rd, rs jalr $t9 SW – [Store Word] Store contents of a register at the specified address. sw register_destination, memory_source sw $t, offset($s) sw $ra, 0x90+var_4($sp) LUI – [Load upper immediate] Shift the immediate value left 16 bits and store it into the register. The lower 16 bits are zeroes. lui register, immediate_value lui $t, imm lui $a2, 0x47 LW – [Load Word] Load a word from the specified address into a register. lw register, address lw $t, offset($s) lw $gp, 0x90+var_80($sp) LA – [Load Address] Copy memory address of var1 (presumably a label defined in the program) into a register. la register, label la $t9, websGetVar [Hint: LA is a Pseudo Instruction and consisting of two instructions, LUI and ORI] ADDIU – [Add immediate sign-extended] Adds a register and a sign-extended immediate value and stores the result in a register. addiu destination_register, source_register, immediate_value addiu $t, $s, imm addiu $s1, $sp, 0x90+var_74 MOVE – [Move Pseudo Instruction] Moves the contents of one register into another. move desitination_register, source_register move $t, $s move $a0, $s0 [Hint: MOVE is a Pseudo Instruction and compiled into an add instruction: add $t0, $zero, $t] The root cause of this stack-based buffer overflow is the usage of sprintf() to write into a statically sized stack based buffer of 100 bytes as a string based argument (%s) with the source being the HTTP POST argument webpage (after percent decoding). void formSetLanguage(webs_t wp, char_t *path, char_t *query) { char tmpbuf[100]; // Static stack based buffer of 100 bytes [snip] setErr: urltmp = websGetVar(wp, T("webpage"), T("")); // Return a pointer to where the HTTP POST Argument 'webpage' is sprintf(tmpbuf, "/%s", urltmp); // Write the contents of the HTTP POST Argument as a string into the static stack based buffer The vulnerable function formSetLanguage() can be found within the binary webs which was extracted from the downloaded firmware update. The disassembly for the above C code is shown below. 00440C9C addiu $sp, -0x90 00440CA0 sw $ra, 0x90+var_4($sp) // Return address is saved onto the stack 00440CA4 sw $s1, 0x90+var_8($sp) // $s1 will get clobbered 00440CA8 sw $s0, 0x90+var_C($sp) // $s0 will get clobbered [snip] 00440EB4 move $a0, $s0 // Source buffer that contains the decoded HTTP POST request. 00440EB8 lui $a2, 0x47 00440EBC la $a1, aWebpage_0 00440EC0 la $t9, websGetVar 00440EC4 la $a2, (aForm_2+0xC) 00440EC8 jalr $t9 ; websGetVar // Grab the HTTP POST argument "webpage" 00440ECC addiu $s1, $sp, 0x90+var_74 // $s1 == Stack based buffer 00440ED0 lui $a1, 0x47 00440ED4 move $a0, $s1 // Destination Buffer for sprintf() 00440ED8 lw $gp, 0x90+var_80($sp) 00440EDC move $a2, $v0 // PTR to the content of the HTTP POST argument "webpage" 00440EE0 la $t9, sprintf 00440EE4 jalr $t9 ; sprintf // Clobber dat Stack 00440EE8 la $a1, aS // "/%s" 00440EEC move $a0, $s0 00440EF0 lw $gp, 0x90+var_80($sp) 00440EF4 la $t9, websRedirect 00440EF8 jalr $t9 ; websRedirect 00440EFC move $a1, $s1 00440F00 lw $ra, 0x90+var_4($sp) // Corrupted 00440F04 lw $s1, 0x90+var_8($sp) // Corrupted 00440F08 lw $s0, 0x90+var_C($sp) // Corrupted 00440F0C jr $ra 00440F10 addiu $sp, 0x90 With this information we know the following: A continuous string that is > 100 bytes is needed to cause the overflow (see C code). The registers $s0, $s1, and $ra will contain values from the overflow since they are loaded off of the stack after being clobbered (see disassembly). Next, we need to know what normal execution looks like in order to mimic the same behavior. The idea is to return back to a function that doesn’t rely on previously saved stack values since they’ve been overwritten. A good first step is to set breakpoints on the entry and exit of each function starting from the vulnerable function and going back until the main loop has been reached since this is a server that serves forever. Analyzing normal behavior MIPS Assembly Basics B – [Branch Unconditionally] Branch to a function label b function_label b loc_40D558 [Hint: B is a Pseudo Instruction and is actually a beq $zero, $zero, label] LI – [Load Immediate] Load immediate to a register li register, immediate_value li $gp, 0x49C740 [Hint: LI is a Pseudo Instruction and consists of two instructions: LUI and ORI] BEQZ – [Branch If Not Equal Zero] Branch to function label if register is not zero. beqz register, function_label beqz $v0, loc_411700 J – [Jump] Unconditional Jump to the instruction at the label j label_target j sub_412330 With the disassembly of formSetLanguage() from the previous section, we need to set a breakpoint at the instruction jr $ra at offset 0x00440F0C using the command “b *0x00440F0C“. Once we hit the breakpoint, we can display the address of the callee function using the command “i r $ra“. set arch mips set endian big target remote 192.168.206.1:1337 # Using GDBServer b *0x00440F0C commands i r $ra continue end continue Then trigger the vulnerable function formSetLanguage(), but not the vulnerability itself. Breakpoint 1, 0x00440f0c in ?? () ra: 0x412458 The return address points to the function handleForm() at offset 0x412458 which has the following lines of code: 00412458 lw $gp, 0x38+var_28($sp) 0041245C lw $ra, 0x38+var_4($sp) 00412460 lw $s3, 0x38+var_8($sp) 00412464 lw $s2, 0x38+var_C($sp) 00412468 lw $s1, 0x38+var_10($sp) 0041246C lw $s0, 0x38+var_14($sp) 00412470 j sub_412330 00412474 addiu $sp, 0x38 The instructions read off of the stack and load the values into $s0, $s1, $s2, $s3, $ra, and $gp. The next function sub_412330 saves $ra, $s1, and $s0 onto the stack then does some operations with the global variable root_temp and returns by jumping to $ra. 00412330 addiu $sp, -0x28 00412334 sw $ra, 0x28+var_4($sp) 00412338 sw $s1, 0x28+var_8($sp) 0041233C sw $s0, 0x28+var_C($sp) 00412340 li $gp, 0x49C740 00412348 sw $gp, 0x28+var_18($sp) 0041234C la $v0, root_temp 00412350 lw $s0, (dword_494F9C - 0x494F98)($v0) 00412354 sw $zero, (dword_494F9C - 0x494F98)($v0) 00412358 [snip] 00412394 lw $ra, 0x28+var_4($sp) 00412398 lw $s1, 0x28+var_8($sp) 0041239C lw $s0, 0x28+var_C($sp) 004123A0 jr $ra 004123A4 addiu $sp, 0x28 By repeating the same steps we find that the function at offset 0x412330 returns to the function process_requests() at offset 0x40d4ac as shown below. Breakpoint 2, 0x004123a0 in ?? () ra: 0x40d4ac 0040D4AC lw $gp, 0x48+var_38($sp) 0040D4B0 b loc_40D558 0040D4B4 move $a3, $v0 0040D558 la $v1, sigterm_flag [snip] 0040D61C bnez $s0, loc_40D418 0040D620 nop 0040D624 lw $ra, 0x48+var_4($sp) 0040D628 lw $fp, 0x48+var_8($sp) 0040D62C lw $s7, 0x48+var_C($sp) 0040D630 lw $s6, 0x48+var_10($sp) 0040D634 lw $s5, 0x48+var_14($sp) 0040D638 lw $s4, 0x48+var_18($sp) 0040D63C lw $s3, 0x48+var_1C($sp) 0040D640 lw $s2, 0x48+var_20($sp) 0040D644 lw $s1, 0x48+var_24($sp) 0040D648 lw $s0, 0x48+var_28($sp) 0040D64C jr $ra 0040D650 addiu $sp, 0x48 Then by stepping through the function process_requests() we find out (by looking at the value in $ra before the jr $ra instruction is called) that the saved return address is 0x411a68 aka loop() and is reached when $s0 (pointing to the global variable request_ready) is NULL. Loop() makes decisions based on a list of global variables, which means that the global variables must contain zero’s, otherwise loop() will make a decision and jump to another function. When the vulnerability is triggered and a crash happens, the value of this global variable $s0 is changed to 1, which causes the instruction bnez to fire and branch to 0x40D418. The function loop() never returns and literally loops forever and uses those global values to call the corresponding function to parse incoming request. That’s why loop() will be the target function to return to since returning to any of the other callee function requires the stack to be repaired and attempting to repair a clobbered stack is very costly in shellcode space. The execution flow described above was an overview of how the vulnerable function is called. After returning from the vulnerable function, the execution flow continues in this sequence: incoming request -> loop() -> process_requests() -> handleForm() -> formSetLanguage(). We won’t cover the details of it and only focus on process continuation once the vulnerable function is successfully exploited. The easiest thing to do would be to adjust the stack back to loop(), find out if any arguments need to be set ($a0, $a1, $a2…etc), figure out if any global variables need to be modified, and then return. Adding in the reverse shell shellcode will be the last step since the main goal is to get the program to continue execution after triggering the overflow. What is needed to resume execution? Now that we gathered a high level idea of the normal execution flow in the previous section, we need a bit more reversing in order to figure out if there are any variables that need to be modified to prevent any crashes when returning back to loop(). Let’s look at the beginning of the loop() function: 00411560 addiu $sp, -0x58 00411564 sw $ra, 0x58+var_4($sp) // never read from 00411568 sw $fp, 0x58+var_8($sp) // never read from 0041156C sw $s7, 0x58+var_C($sp) // never read from 00411570 sw $s6, 0x58+var_10($sp) // never read from 00411574 sw $s5, 0x58+var_14($sp) // never read from 00411578 sw $s4, 0x58+var_18($sp) // never read from 0041157C sw $s3, 0x58+var_1C($sp) // never read from 00411580 sw $s2, 0x58+var_20($sp) // never read from 00411584 sw $s1, 0x58+var_24($sp) // never read from 00411588 sw $s0, 0x58+var_28($sp) // never read from 0041158C li $gp, 0x49C740 00411594 sw $gp, 0x58+var_40($sp) // is read from 00411598 la $v0, block_read_fdset 0041159C move $s1, $a0 // Argument is needed 004115A0 addiu $v1, $v0, (staTbl - 0x499748) [...snip...] 004115D8 la $s5, aConnectionTime 004115DC la $fp, sigalrm_flag // Global 004115E0 la $s2, block_read_fdset 004115E4 la $s7, ka_max // Global 004115E8 la $s4, stderr 004115EC la $s6, ka_timeout // Global 004115F0 la $s3, block_write_fdset 004115F4 sw $v1, max_fd // Global 004115F8 la $v1, sighup_flag // Global 004115FC lw $v0, (sighup_flag - 0x496854)($v1) 00411600 beqz $v0, loc_411618 // Must be 0 or else exit() is called 00411604 nop 00411608 la $t9, sighup_run 0041160C jalr $t9 ; sighup_run 00411610 nop 00411614 lw $gp, 0x58+var_40($sp) 00411618 la $a0, sigchld_flag // Global 0041161C lw $v0, (sigchld_flag - 0x496858)($a0) 00411620 beqz $v0, loc_411638 // Must be 0 or else exit() is called 00411624 nop 00411628 la $t9, sigchld_run 0041162C jalr $t9 ; sigchld_run 00411630 nop 00411634 lw $gp, 0x58+var_40($sp) 00411638 lw $v0, 0x58+var_58($fp) 0041163C beqz $v0, loc_411654 // Must be 0 or else exit() is called 00411640 nop 00411644 la $t9, sigalrm_run 00411648 jalr $t9 ; sigalrm_run 0041164C nop 00411650 lw $gp, 0x58+var_40($sp) 00411654 la $v0, sigterm_flag // Global 00411658 lw $v0, (sigterm_flag - 0x496860)($v0) 0041165C beqz $v0, loc_411700 // Must be 0 or else exit() is called 00411660 li $v1, 1 ...etc The Disassembler reported that the register $ra that is first saved onto the stack is never read from again, which means that the function loop() never returns unless a signal is thrown. There are multiple global variables that are read from for the beginning branch conditionals that ultimately call exit(), but they do not need to be modified since they all contain the value 0x00000000. For this reason, loop() is a good place to jump back to since it doesn’t return to anything. This way, we don’t need to repair anything on the stack and only need to find the variables that loop() needs in order to not crash. All of the other global variables were manually looked at upon run-time to help speed up reversing efforts and it was found that the only variables that change when the vulnerability is triggered are request_ready and total_conne'''
