title = "Get started with Azure – Introduction | Microsoft Azure"
description = "Get started with an introduction to Azure and find resources to learn how Azure works and how to use Azure for your cloud computing needs."
full_description = "Get started with Azure Find out what you can do with Azure cloud computing services. Get started with Azure .heading-bg-color-layout-container-uid26d5{ background-color: !important; } Explore Azure See how Azure works Learning resources Start building Ways to try Azure Customer stories More information Overview Explore Azure See how Azure works Learning resources Start building Ways to try Azure Customer stories More information Get started with Azure .row-bg-color-layout-container-uid0d4b{ background-color: !important; } Take a quick tour of Azure Watch a two-minute introduction to Azure to see how to get started with popular services, presented by Microsoft Partner Program Manager Scott Hanselman. .heading-bg-color-explore-azure{ background-color: !important; } .oc-aem-feature-bg-color-picker-feature-uid2f9d { background-color: #f2f2f2; } Explore Azure with short demos and live Q&A Learn the fundamentals of getting started with Azure through a series of brief demos. Join a live Q&A session with an Azure expert to get your questions answered. Register to watch .heading-bg-color-works{ background-color: !important; } See how Azure works Watch how-to videos Learn how to work with Azure services in the Azure portal through the videos in this series. Choose a video Hear the latest from Azure engineers Join Scott Hanselman for Azure Friday conversations and demos with the engineers who build Azure services. Watch Azure Friday videos View live and on-demand webinars Start building your solutions and get answers to your questions with popular webinars. Explore webinars .heading-bg-color-learning-resources{ background-color: !important; } Try these learning resources for getting started with Azure Read the Azure developer guide Use this guide to get started building new applications in Azure or migrating existing applications to Azure. Find Azure documentation Get documentation, example code, guidance, and tutorials for all Azure services. Take hands-on training Master the basics of Azure by following the Azure Fundamentals online learning path. Get migration help Find tools and guidance for every stage of your cloud migration to help you move, manage, and secure your workloads. .heading-bg-color-start-building{ background-color: !important; } Start building with Azure Get guidance to create your first solution in Azure. If you're new to Azure, create an Azure free account. Begin a new project Use the Azure Quickstart Center to choose your project and get started fast. Create a Windows virtual machine Explore virtual machine (VM) considerations and find tutorials to create VMs in Azure. Build a web app Learn about building, deploying, and managing web apps with Azure App Service. Try Azure SQL Database Use fully managed SQL Database to build highly scalable, high-performance apps. Plan and collaborate with Azure DevOps Get started using Azure DevOps to share code, track work, and ship software. Build AI into your apps Create intelligent apps that can see, hear, speak, understand, and make decisions using Azure AI Services. Set up Azure Virtual Desktop Get an overview and find tutorials to set up remote desktops that work for all your apps and devices. Build, publish and sell through marketplace ISV Success supports ISVs in building, publishing and selling software applications through a rich set of technical benefits offered as part of the Microsoft Cloud Partner Program. .heading-bg-color-layout-container-uid90c1{ background-color: #ffffff !important; } .container-bg-color-layout-container-uidb880 { background-color: #243a5e !important; } .row-bg-color-layout-container-uidb880{ background-color: !important; } Access Azure support From comprehensive support plans to status alerts and self-service help, get support as you get started with Azure. Get the Azure mobile app If you're already an Azure customer, download the Azure mobile app to stay connected to your resources from your mobile device. .row-bg-color-layout-container-uid19ca{ background-color: !important; } Get started with an Azure free account Enjoy 20+ popular services free for 12 months, more than 65+ services free always, and $200 credit to use in your first 30 days. Get started with Azure .heading-bg-color-ways{ background-color: !important; } More ways to try Azure Pay as you go Meet your organization's needs with competitive pay-as-you-go pricing. Pay only for what you use each month with no upfront commitment. Try Azure for Students Get a $100 credit and free access to popular cloud services and developer tools when you create your Azure for Students account. Connect with a partner Get technical assistance, advice, and support from a partner with verified Azure capabilities. .heading-bg-color-layout-container-uid364d{ background-color: !important; } .row-bg-color-customer-stories{ background-color: !important; } Customers are doing great things with Azure See how other organizations are using Azure services to innovate and achieve their goals. Find customer stories by industry, country, or topic. Read customer stories .heading-bg-color-more-information{ background-color: #f4f5f6 !important; } .heading-bg-color-layout-container-uid142d{ background-color: !important; } Find FAQs Azure free account FAQ Pricing FAQ Support plans FAQ Get community support Ask questions and get answers Contact Sales Call, chat, or connect with Azure Sales"
