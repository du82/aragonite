description = "Azure helps you build, run, and manage your applications. Get the latest news, updates, and announcements here from experts at the Microsoft Azure Blog."
full_description = "Announcements Jan 29, 2025 2 min read DeepSeek R1 is now available on Azure AI Foundry and GitHub By Asha Sharma, Corporate Vice President, AI Platform DeepSeek R1 is now available in the model catalog on Azure AI Foundry and GitHub, joining a diverse portfolio of over 1,800 models, including frontier, open-source, industry-specific, and task-based AI models. As part of Azure AI Foundry, DeepSeek R1 is accessible on a trusted, scalable, and enterprise-ready platform, enabling businesses to seamlessly integrate advanced AI. Announcements Jan 31, 2025 2 min read Announcing the availability of the o3-mini reasoning model in Microsoft Azure OpenAI Service By Yina Arenas, Vice President of Product, Core AI We are pleased to announce that OpenAI’s new o3-mini model is now available in Microsoft Azure OpenAI Service. Building on the foundation of the o1 model, o3-mini delivers a new level of efficiency, cost-effectiveness, and reasoning capabilities. AI + machine learning Feb 13 6 min read Securing DeepSeek and other AI systems with Microsoft Security By Herain Oberoi, General Manager, Data Security, Compliance, and Privacy, Microsoft AI + machine learning Feb 12 5 min read Azure for mission-critical workloads in healthcare: EHR and beyond By Kees Hertogh, General Manager, Global Industry Product Marketing Management and governance Feb 12 4 min read Microsoft Cost Management updates—February 2025 By Sameer Doultani, Principal Product Manager AI + machine learning Feb 11 5 min read AI agents at work: The new frontier in business automation By Olivia Shone, Senior Director, Azure AI Product Marketing AI + machine learning Jan 28 4 min read Introducing Leading the Shift, a new Microsoft Azure podcast By Susan Etlinger, Senior Director, Product Marketing Security Jan 27 4 min read Navigating the 2024 holiday season: Insights into Azure’s DDoS defense By Amir Dahan, Senior PM Manager, Azure Networking; Syed Pasha, Principal Cloud Network Engineering Manager,