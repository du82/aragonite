full_description = "Announcements Feb 27, 2025 4 min read Announcing new models, customization tools, and enterprise agent upgrades in Azure AI Foundry By Asha Sharma, Corporate Vice President, AI Platform We are excited to announce major updates to Azure AI Foundry, our integrated platform for designing, customizing, and managing enterprise-grade AI applications. Announcements Feb 26, 2025 7 min read Empowering innovation: The next generation of the Phi family By Weizhu Chen, Vice President, Generative AI We are excited to announce Phi-4-multimodal and Phi-4-mini, the newest models in Microsoft’s Phi family of small language models (SLMs). These models are designed to empower developers with advanced AI capabilities. Storage Feb 26 5 min read Azure NetApp Files: Revolutionizing silicon design for high-performance computing By Aung Oo, Vice President, Azure Storage AI + machine learning Feb 25 4 min read AI innovation starts here—join Microsoft at NVIDIA GTC By Locky Ainley, Senior Product Marketing Manager, Azure AI + machine learning Feb 19 3 min read Introducing Azure AI Foundry Labs: A hub for the latest AI research and experiments at Microsoft By Asha Sharma, Corporate Vice President, AI Platform; Ashley Llorens, Corporate Vice President and Managing Director, Microsoft Research AI + machine learning Feb 13 6 min read Securing DeepSeek and other AI systems with Microsoft Security By Herain Oberoi, General Manager, Data Security, Compliance, and Privacy, Microsoft AI + machine learning Feb 12 5 min read Azure for mission-critical workloads in healthcare: EHR and beyond By Kees Hertogh, General Manager, Global Industry Product Marketing Management and governance Feb 12 4 min read Microsoft Cost Management updates—February 2025 By Sameer Doultani, Principal Product Manager AI + machine learning Feb 11 5 min read AI agents at work: The new frontier in business automation By Olivia Shone, Senior Director, Azure AI Product Marketing AI + machine learning Jan 31 2 min