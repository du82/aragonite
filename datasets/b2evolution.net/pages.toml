full_description = "About b2evolution CMSContactsPress RoomPress RoomOk, we have to admit our structure historically hasn't been really suited for formal press contacts. We will try to improve on this but don't let that stop you from contacting us with your inquiries. The best ways to get in touch are: Use our contact form Ping us on twitter @b2evolution Logos Here are clean versions of the b2evolution logo you can use. Horizontal Logo PNG file 254x52: transparent background or white background PNG file 508x104: transparent background or white background PNG file 762x156: transparent background or white background PNG file 1016x208: transparent background or white background PNG file 1270x260: transparent background or white background PNG file 1524x312: transparent background or white background PNG file 1778x364: transparent background or white background SVG file (Optimized for display at 254x52 pixels) Adobe Illustrator .ai file (Optimized for display at 254x52 pixels) Note about vector logos: Do NOT believe what they say about vector images fitting to any size. At small sizes, they will look sharp only at the size they have been designed for. All other sizes will result in blurry edges because of pixel anti-aliasing. Square Logos / Icons PNG file 48x48: transparent background or white background PNG file 240x240: transparent background or white background PNG file 768x768: transparent background (PNG-24) white background SVG file (optimized for display at 44x44 pixels in a 48x48 canvas) Powered-by logo GIF Logo colors Orange #faa72d & Grey #565656 Screenshots Please grab screenshots from our Guided Tour. Remember to click on the screenshots to get full size views. 1 comment Comment from: kalhostnice logo2016-09-10 @ 14:05"
