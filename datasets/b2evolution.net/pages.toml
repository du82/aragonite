full_description = "About b2evolution CMSContactsSponsoring, Donations and SupportSponsoring, Donations and SupportSponsoring We get quite a few requests for this, so let's be very clear: we are NOT interested in selling sponsored links of any kind. Donations Since b2evolution is now funded by user companies, we no longer need to rely on donations. We gratefully thank all donors who have helped kickstart the project in its earlier stages! Thank you! Better ways of supporting b2evolution today! b2evolution is free software. If you use it and if you like it, please consider giving credits and time: Please keep the b2evolution logo and credits visible to your visitors somewhere on your website, for example in the footer or the sidebar. The next thing you can do to support us, is to go out there on the web and tell the people what you like (or not?) about b2evolution. Twitter, Facebook, Google+, LinkedIn, forums, chatrooms, other blogs... Helping spread the word is definitely one of the best ways to support this project! ;) If you have time, you can always help a few newcomers in the support forums. You could also help translate b2evolution to your own language if it isn't already. These are all other extremely useful ways to contribute. Thank you for your help in growing this community."
