title = "Your feedback matters!"
description = "What is the main reason that made you choose b2evolution for your website? What is the feature or improvement do you miss the most at this time?"
full_description = '''« b2evo 5.0.6 (stable) releasedGet up-to-date on CSS with the CSS Day videos! »Your feedback matters! Posted by fplanque on Sep 17, 2013 in Development With the release of version 5.0.6 approaching, we are reaching the end of the bug fixing cycle that follows each major release. This means we're getting ready for the rollout of new features again! Version 5 was our largest new release ever with more than 200 new features! 100 of these new features were direct responses to your feature requests/problem descriptions! :) Are you ready for some more? ;) Today we'd like to ask you two distinct questions: 1) What is the main reason that made you choose b2evolution for your website? (If possible: what problem did b2evolution solve for you?) 2) What is the feature or improvement you miss the most at this time? (Please describe the problem you have before describing a requested solution.) As always, we'll try our best to find an elegant solution to what your need. Some requests will be addressed in b2evolution 5.1, some will be addressed in version 6, but we'll evaluate them all. Please give us your feedback in the comments below! Thank you! 101 comments Comment from: adrian_alexanderHello. I would like to say again what an awesome platform this is and how it saddens me to see people are so stuck up in wordpress for crappy reasons and don’t even wanna try the amazing b2evo. Well my suggestion is a plugin that filters languages in comments. Like chinese or japanese but other languages should be nice too if for example u have an english blog and u don’t want german comments. The worst are chinese or japanese, I’ve been getting a lot of spam in those and I can’t even begin to know what kinda “words” to add to the filters because i have no clue where a word begins and where it ends. So yea a language filter/spam killer for comments would be great.2013-09-17 @ 06:25Comment from: fplanqueCan we ask you for a specific reason that makes b2evo better than WP? ;) We are trying to understand the differentiation precisely. Thank you for your help :) Recognizing Chinese characters will be easy. recognizing german language will be harder because we’ll need to run everything against a dictionary. We will investigate both ways.2013-09-17 @ 19:53Comment from: adrian_alexander1. I am not having problems with usernames like admin, I am actually being plastered with usernames like “home” or “murberry bags” etc lol 2. The image resizing should be by dragging the corners or edges in the WYSIWYG editor if possible. I am not very sure if it ever had this or I actually used it when I had wordpress. 3. Why is better to have b2evo than wordpress? wow let me count the ways but the first two are most important: - you can have multiple blogs one one platform not like wordpress where u can only have pages. A page is a page , you can’t write post after post. This is why b2evo rocks - the admin interface is amazing and professional. wordpress has something I would wanna kill with fire. - awesome publishing options that in other platforms u have to scoop up with a shovel or they don’t exist. - the widgets manager is also great, I don’t think wordpress has it like that, the last time i checked it drove me crazy while in b2evo its awesomely easy to add and move widgets around up and down - I always liked how I can simply use phrase indent without using html codes. It might be cause of tiny mce but I just like a neat text In a nutshell b2evo offers multiple blogs, and a professional fancy admin interface with awesome options. When I tried wp it barely had half the options the admin of b2evo has, not to mention the interface made post writing a pain in the ass.2013-09-17 @ 20:59Comment from: adrian_alexanderThis is what a friend told me in 2009 when I wrote an article b2evo versus wordpress. “Although between admin friendly interface and SEO, I chose SEO. We all know nowadays without good optimization you can’t reach high in searches and i prefer to install wp 5 times for 5 blogs than to write easier but not be indexed by google right. As long as wp stays high from SEO point of view, I will be using wp” I have no clue where these people had these crappy ideas that wordpress is better at SEO than b2evo. The thing is, within the wp users there has been a plugin going around called all in one seo pack. They think that pack is the golden ticket for a good seo optimization and I bet they laugh at anyone who doesn’t install it. To put it better, wp users seem to be like a flock of sheep. If one goes over a bridge, the rest will follow.2013-09-17 @ 21:05Comment from: fplanque@adrian_alexander For the record, I actually believe b2evolution is much more SEO optimized than any other CMS because in b2evolution the SEO optimizations are built right in and are part of the specifications of every new feature. (Even for the multi language thing – further down this page – we started by thinking about the SEO implications and decided we need to be able to separate different languages to different blogs - or even domains - and redirect from one to another when requested).2013-09-17 @ 21:58Comment from: adrian_alexanderOh and sorry to say but I really must insist on a solution to a quite important issue that could be the reason a lot of people will not install b2evo. The lack of skins. To put it honestly there is currently only one good b2evo skin, which I am also using in a slightly modified form and thats mystique. A lot of people and me including are very look oriented. I can’t blame them they need their blogs to look good. Another issue I was made aware of when I tried to hire someone to professionally change my theme was as he said that b2evo has too many files to be changed while wp only has the css. I have no idea if that’s true and if changing those will kill any functionality, best forget it. I just wish there were more people doing brand new and differently designed b2evo skins.2013-09-17 @ 21:09Comment from: fplanqueI understand we would benefit from having more skins. The initial idea was that everyone would do their own, but obviously they want a starting point. It is incredibly hard to find people who can convert skins by keeping everything pixel perfect and integrate all the additional features of b2evo at the same time.2013-09-17 @ 21:58Comment from: adrian_alexanderI really would love to customize my css but all I can frankly do as I have no clue how to actually edit css even mid level, is to change a header, fonts, colors and stuff like that. If I would for instance want to make flash buttons instead of pics well…I would see it like chinese, so yea people like starting points. As I understand even mistyque is originally designed for wp, which is why probably the third facebook button doesn’t exist or function, up there on that bar.2013-09-17 @ 23:07Comment from: fplanqueAlthough some skins have appeared in between, we reckon with that skins scarcity is still an issue and we’re working on it. Version 6 is coming with a complete redesign including the back-office. Everything is based on Bootstrap. This has several advantages: 1) It gives everything a consistent and modern look 2) It’s responsive 3) For people who only want to touch the CSS if will be even easier than whatever they may have though was easier on WP because all the CSS will be based on Bootstrap standards and most designers are learning Bootstrap anyways. 4) It alleviates **some** of the difficulty of making “pixel perfect” designs as the bootstrap framework comes with a coherent set of elements that are easy to assemble cleanly. Bootstrap should also enable us to release more skins ourselves.2015-04-06 @ 00:37Comment from: adrian_alexanderOh yea I almost forgot. We really should be able to block IP addresses from within the platform, I have to do it manually now from the host’s cpanel and it would be nice to have that red sign next to the IPs too so we can block them instantly.2013-09-17 @ 06:33Comment from: fplanqueBlocking IPs is already implemented in an upcoming release.2013-09-17 @ 19:53Comment from: adrian_alexander@Francois I just upgraded today from b2evo 4… to the latest 5 0 5 stable. I noticed in the antispam we already have IP blocking capabilities? I added an IP range and chose blocked, so I am logically assuming it means that it does the same thing I used to do in cpanel. However yea I still say it would be just a bit easier to have one of those block thingies right next to the IP in comments. But I’m happy as it is for now.2013-09-19 @ 12:22Comment from: fplanqueThere is a ban icon (a lightning strike) in some places but it is indeed missing in a some other instances. We’re fixing this in version 6.2015-04-05 @ 23:53Comment from: hypocrite1. Main reason for choosing b2evolution was the ability to host multiple blogs and users easily. This still holds true today. 2. Biggest complaint and missing feature at the moment is the posting and editing of blogs posts. I think the next version of b2evolution should really focus on making the writing of blogs posts and content more easy for new users. The overall process of how users write posts, attach images and make complicated posts is a bit hard to grasp for new users. You almost need understanding of HTML and coding to get everything right. This should not be the case. I think the process of attaching images should be more straighforward. Also an updated version of TinyMCE would be nice.2013-09-17 @ 10:08Comment from: adrian_alexander@hypocrite I strongly disagree with simplifying the writing and posting and pic attaching. In my opinion b2evo offers almost a professional way of publishing a post compared to the way wordpress manages this which I frankly can’t comment without an insult. To me b2evo combined with the tiny mce, the two ways of attaching pics and the huge pile of options on publishing date, keywords etc, is absolutely amazing, almost making me feel I’m editing something in word. I would however change something but I’ll post that separately to be easier to read.2013-09-17 @ 13:16Comment from: hypocrite@adrian_alexander I am at the moment managing about 50 different blogs for several dozens of users. The one feedback I get again and again is that users find the attaching of images and editing of posts hard and difficult to understand. In my opinion there is something wrong with the system if I have to teach users by hand how they can add and insert images to a blog post. It should be more intuitive and easy to understand for new users. One example: If the user has attached images to the post and must choose where the picture is inserted there are three options: teaser, after “more” and inline. Can you seriously say that these are self-explanatory to new users? That is such a basic task which every blog user must be able to do that it cannot be too difficult. But I agree that b2evolution should not get rid of the more advanced options which more advanced users can use and enjoy. There is at the moment already the choice between Simple and Advanced editing. I think b2evolution could just further develop those two options for the new users and more advanced users.2013-09-17 @ 13:35Comment from: fplanque@hypocrite “host multiple blogs and users easily” -> Thank you for this concise yet precise answer :) Image attachments: I understand why you say “Header"/"after more” and “Inline” are not intuitive for new users. Besides providing a help link right next to this, do you have suggestions on how to make a simpler version (that would not break compatibility with existing posts) Question to all: would it help to upload directly from the edit screen without opening the filemanager and without worrying where the image is saved on disk? or would it make no difference? (opening the FM would still be an option but not mandatory)2013-09-17 @ 19:53Comment from: hypocriteI think image attachments would be much easier in the Simple view if you could just start attaching images to the post to different places. The file manager could be an option in the Expert view but I think all my users would only give positive feedback if they can start writing a post and attach images. Our blogs differ a bit from regular blogs. We have for example a lot of blogs for projects. This means that the blogs might not run for a very well long period of time and there are new users for different blogs. I can understand that if you have plans to start a blog and update it for several years, it is excellant that you can have all the professional tools that b2evolution offers. But if you are maintaining a blog for a project which can run for only a couple of months, it can be a bit hard to crasp all the new tools. Also we have blogs where there are a lot of visitor writers who might only need to write only one post. At the moment we have to have one person you maintains the blog, because new users need a bit too much time to learn all the tools. So in a nut shell: I think we should keep the Expert view as it is but for example update tinyMCE to new version. And then we could start evolving the Simple view so that you could just start writing a post and attaching images. One option I was thinking is the new MoxieManager which the developers of tinyMCE have mode: www.moxiemanager.com We have found this tool very good for manages for example images because you can easily insert them to the post. Maybe we could do something similar. I think the Simple view wouldn’t have to matter where the files are saved, they could be in the blogs root directory. And in the advanced view you could specify a different location.2013-09-18 @ 07:16Comment from: adrian_alexanderI have two proposals for improvement. I posted the first before registering and it’s in moderation so please delete it , I’ll repost here. 1. the ability to block any desired language for comments. I have been “bullied” lately with chinese or japanese comments. I can’t even begin to know where a word starts and ends there so chosing keywords to block is absolutely impossible. And I honestly write in romanian, I would like to be able to block either all other languages or selected. Would be a nice feature. 2. The upload/insert pic option should be improved. We are not able to resize the inserted pic within the WSIWYG panel, we have to go all the way to the HTML processing and frankly that will take time cause if a pic is 800/560, if I make the 800 400, how do I know what the second should be? So resizing the pic right in the WYSIWYG panel would be nice. 3.Ability to block certain usernames for comments. For example a lot of spam come with the product name right as username if u understand what I mean. 4. Blocking IPs right from the pending comment forms. Right now I have to go all the way to my host cpanel to block the IPs.2013-09-17 @ 13:23Comment from: fplanqueCan you please detail in which scenario you want to resize an image without relying on the way b2evolution resizes depending on your skin? Blocking usernames: '''
