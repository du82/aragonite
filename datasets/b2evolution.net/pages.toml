description = "This isn't about a bunch of promises of things to come. The development team delivers, period. And boy, do they deliver in style!"
full_description = "Comment from: green_hostingI started using b2 back in 2004. I used it and customized the theme for many of my sites. Over time I decided to try some other blogging software, and I did. Now, many years later, I am back to b2evolution because it is more flexible, and definitely easier to customize the theme with Dreamweaver. I have added a lot of HTML code to the template and even done search and replace to quickly customize the same theme for a different domain. Thanks.2014-05-07 @ 16:01 Comment from: Thankful UserI wish to express my gratitude for the outstanding free open source project that you have provided for the general public. I am very thankful for the opportunity to use b2evolution. It is just awesome. It is a great website blog tool for a professional website presence. The beauty of b2evolution is to be found in the useful and easy to use functions and application. I have tried different tools, but I threw everything in the trash after I discovered b2evolution. Thank you for providing such a practical tool for the beginning as well as the professional. I wish you and your team good fortune and good health.2014-11-05 @ 09:42 Comment from: Empowered BloggerI just want give a quick feedback to B2Evolution team for creating such great and easy to install and maintain platform. I’ve just installed B2Evo on e few of my blogs and sofar flawless. Thanks2015-02-23 @ 13:21"
