full_description = '''SSH Web Hosting Secure Shell (SSH) access allows you to log in to your web hosting account and use UNIX/Linux command line instructions to manage your website. This allows you to quickly and easily compress/decompress files, automate backups and other tasks (cron jobs) – including b2evolution's scheduled tasks –, change file permissions for complete directory structures, edit hidden/system files such as .htaccess, use git, grunt, npm, etc. Top recommended hosts with SSH support for March 05, 2025Updated daily! Web HostHosting company Hosting PlanPrice/mo.Dom.nameDiskspaceTransfer/mo.RatingSee detailsA2 HostingLite $2.99$14.95/ yearUnlimitedUnlimitedBest PerformanceSummary Full details Visit siteInMotion HostingLaunch $4.99Free(1 year)UnlimitedUnlimitedA+ rating with the BBBSummary Full details Visit siteHostGatorHatchling $2.78$12.95/ yearUnlimitedUnlimitedPay monthlySummary Full details Visit siteBlueHostBasic $2.95Free(1year)50GBUnlimitedTrusted Since 1996!Summary Full details Visit siteMost of the web hosts above will give you a special promo price, either via a coupon or automatically if you sign up through this page. Disclaimer: Some of these hosts will pay us a commission in addition to giving you a promotional price. These commissions are reinvested in the development of the b2evolution software.About SSHSSH (Secure Shell) allows remote commande line login into a server. It is a successor to the antiquated telnet which wasn't very secure. With SSH, on the contrary, all data transmitted between your computer and the server is heavily encrypted in order to prevent password or other sensitive data sniffing. In other words, SSH provides a secure communication channel, even if the network you use to connect is unsecure. There are two major versions: SSH-1 and SSH-2. All hosting companies today support SSH-2, which offers enhanced security. In order to use SSH, you need a little piece of software called a Terminal / SSH-Client. You can find so