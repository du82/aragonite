["http://b2evolution.net/news"]
title = "b2evolution News Blog"
description = "Official newsfeed for the b2evolution Social CMS software."
full_description = "2024 Update - Site Sunset Posted by fplanque on Jul 10, 2024 in New releasesI will soon lock down the b2evolution.net site. It will become read only and neither you nor me will be able to post new content to it. I will keep the read-only site up for reference for as long as practical. I might convert it to all static pages at some point (and still retain the content). I will post future updates on stateoftheevolution.com. You may continue to discuss issues on GitHub. Send feedback » 2022 Update (EOL) Posted by fplanque on Mar 26, 2022 in New releasesb2evolution CMS is no longer actively developed (Read more…). We only fix security issues when discovered on the 7.2.x-stable branch. We do not maintain older or newer (development) branches. We will not maintain forever… We strongly encourage those who are continuing to use the software to fork the project and continue development on their own.5 feedbacks » September 2020 update Posted by fplanque on Sep 05, 2020 in New releasesb2evolution v7.2 is considered very stable now and used by many users as well PRO clients. You can find b2evolution v7.x in the download area. We also made a quick video to show v7 (others should follow): Please note we will stop supporting b2evolution v6.x by the end of September 2020. If you haven’t done so yet, we recommend that you upgrade to b2evolution v7 now. There are no specific issues with upgrading from v6 to v7. The v6 skins will work without modification on v7. Everyone Stay Safe! ;)1 feedback » January 2020 update Posted by fplanque on Jan 11, 2020 in The Webmaster's BlogHappy New Year everyone! We had 8 releases of b2evolution 6.x last year but most of our work behind the scenes has been focused on b2evolution 7.x. To this day b2evolution 7.x-PRO is already used by several PRO clients but we have not released a stable public release yet. This is due primarily to the fast pace of adding new features that change the final widget/skin behavior. In public releases we need to write upgrade procedures for this, which is time consuming. As a result, we are dropping b2evolution 7.0 and are moving directly to b2evolution 7.1. One major change is that site skins will be able to display a configurable Menu instead of just an automatic list of collections. In the process we have also put the e-commerce features on hold as they are not among the current concerns of our PRO clients. We expect a beta release of 7.1 in the coming weeks.Send feedback »"
