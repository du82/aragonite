full_description = '''About b2evolution CMSWhat is b2evolution?Feature HighlightsFeature Highlightsb2evolution is the most integrated Content Management System ever! Rich & Flexible b2evolution lets you organize your content into collections of items. A collection could be a blog (collection of posts), a photo gallery (collection of photos), a forum (collection of discussions), an online book/manual (collection of pages), etc. In each collection, contents can be tagged and organized into categories. Your collections can be published as separate websites or assembled into a more complex website with transversal navigation. Homepage builder In its simplest form, b2evolution lets you create a homepage for yourself or your organization. The homepage can contain a background image and can be customized will all kinds of widgets, including text, photos, a video, a map, a contact form, etc. And because b2evolution is designed to run multiple sites, you can actually have multiple homepage; e-g: one for each member of your family, or one for each member of your community. Multiple blogs Install b2evolution once and use it for 1, 2, 3... 10... 100 or even 1.000 blogs at the same time. Some universities use it for giving 25.000 students and staff a blog each! Each blog can have a different owner and different or shared contributors, editors, moderators, etc. You can also share content (cross-post) between multiple blogs/collections. Forums Allow users to register on your website and provide them with a place to discuss topics that matter to them. Forums can be public or private, accessible only with an invitation. Photo Galleries b2evolution will beautifully showcase your photos with skins specifically designed to put images first. Add text only if you need it. If you have many photos, you can group them into albums. b2evolution takes care of adapting the photo size to the viewing device and generating a thumbnail index. Newsletter Let your users register on your site and keep in touch with them using b2evolution's integrated newsletter feature! No need to export your user base, de-duplicate email addresses and worry about users who unsubscribed. b2evolution handles everything automatically, out of the box. New users are on your list immediately. One-click unsubscribes are immediate too. Private Messaging In addition to publicly commenting on posts/pages and participating in discussions on the forums, your users can also send private message to each other. Users can also start private group conversations. Multiple sites / multiple domains All contents in b2evolution are grouped into collections. A collection can ba a blog, a forum, a gallery, etc. Each collection can live on its own page, in its own folder, or on its own domain... You could also choose to display several collections on a single page. Install b2evolution once at the root of you web hosting plan, set up as many "alias domains" as your web host allows you to, and let b2evolution take care of running a different blog/site on every domain. Multiple users and authors Any user can be given permissions to read, write, moderate or fully customize any number of blogs. Complete and detailed permission management is included. Integrated stats b2evo will show you activity graphs for each blog, including robots, RSS readers and browser hits broken down by referrers, searches, direct accesses, self-referred, etc. Also includes search keywords, user logins and more. AntiSpam Deluxe Effective combination of active and passive antispam measures -- including a community shared blacklist -- to block comment and referrer spam. Plugin framework In the occasional case wher b2evolution doesn't already include a feature you need, its advanced plugin framework allows you to extend the application with virtually any feature you may need... or simply install prebuilt plugins provided by the community. Localized in several languages Many languages packs are available for download. If you can't find your language, use the localization toolkit to easily localize b2evo to your language. Workflow For example: submitters can post drafts, then assign them to an editor who in turn may assign them to reviewers for final approval and publication on the site. Actual workflow, permissions and statuses are all up to you. Multiple post types support With b2evolution you're not limited to writing in-flow blog posts, you can also write random pages that you can link in the menus (thanks to widgets) and access randomly. You can also write intro posts for each blog or even for each category. b2evolution also has a post type for podcasts which will automatically produce correctly formatted RSS feeds for podcasts. Attachments b2evolution lets you attach files not onloy to posts, but also to comments. This way your users can easily post comments on blogs or in forums with pictures attached (can be configured). Easy install & upgrade b2evolution's installer will take care of almost everything. Basically, you only need to give it the name of a MySQL database and you're set. Upgrading is equally simple. Only heavy customizations may require special care when upgrading. User profiles Users can create a profile with profile pictures as well as a number of custom fields that can be configured by administrators. SEO friendly Each URL type can be configured. Each link type can be configured follow/no-follow. Each page can be configured index/no-index. Posts/articles can have a `<title>` different from their `<h1>` and additional meta tag info can be configured. Pages/posts can be 301-redirected. Other 404's can have a custom error page or can also be redirected (301, 302, 303...) WYSIWYG Editor or not With b2evolution, authors have a choice or using a WYSIWYG editor (TinyMCE is included) or not. In that case other types of fast markup can be used: GM Code, BB Code, Markdown as well as WiKi-style markup, including quick WikiLinks. Mass Posting If you have a collection of texts in a text file, you can copy/paste it in the mass posting editor and it will automatically creat enew posts for you by recognizing posts, titles and paragraphs based on newlines/blank lines. Server Side Analytics (SSA) Identify and block spammer activity! Spammers never load the Javascript Analytics packages such as Google Analytics and stay under the radar. With Server Side Analytics you can see what they do, identify them and block them. SSA will further allow you to track everything where other analytics packages can only track page views from visitors using a web browser with JavaScript enabled. b2evolution will track all page views: Even if Javascript is turned off RSS and Atom feed requests robot, crawler and spider activity spammer activity AJAX requests Incomplete pageloads (even if the user aborts loading the page, the view is counted) See Manual page. More Multiple & sub-categories Posts can have custom fields - - Comment ratings Keyword search Contact form Private posts Protected posts (reserved to members) Drag & drop widget management File Manager Automatic thumbnail generation User / Group management Users can have custom fields Page level caching Block level caching Object level caching APIs Optimized for search engines & advanced SEO settings AdSense plugin Task scheduler for automatic maintenance'''
