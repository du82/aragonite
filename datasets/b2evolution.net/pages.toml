full_description = "b2evolution CMS User ManualOperations Reference LDAP Integration LDAP stands for Lightweight Directory Access Protocol. It is a protocol typically used for accessing an existing user database, stored in an LDAP server. This is useful when b2evolution is used in an enterprise where hundreds/thousands of user accounts are already created in a central LDAP Server (See also: Intranet setup). b2evolution, can connect to and leverage an LDAP directory by using the LDAP Plugin. For testing, an easy to install Directory Server is: http://directory.apache.org Security Fighting Spam Performance Using Multiple Domains See: Setting up multiple domains Multi Domain Test Environment Additionally: If you use Google Analytics, you may want to read their section about Tracking Multiple DomainsMore » Intranet setup Using b2evolution on an intranet isn’t much different from a regular internet installation. However, in some cases there might be specifics, which we will list below. During Setup The installer screen has a checkbox for intranet installs. Make…More » LDAP Integration Troubleshooting Bundled Plugins These plugins are bundled with the b2evolution distribution. Comments on this chapter"
