full_description = "About b2evolution CMSWhat is b2evolution?About UsAbout Usb2evolution is a free open source project. Our Mission No matter if you're just starting out or if you're trying to get your site to the next level, our aim is to bring you the definitive tool for the job. A tool that will let you run your own blog or website, easily, effectively & efficiently. We ambition to help you make your mark on the internet and be part of the rapid evolution of the web! How It Started b2evolution originally started as an evolution of b2. The project was started by François Planque in 2003 and is still maintained by him as of today, with the support of the Evo Factory. You can read more about his involvement in b2evolution on his blog: State of the Evolution. Research The b2evolution team sometimes participates in research projects."
