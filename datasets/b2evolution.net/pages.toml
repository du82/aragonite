where you can also check for yourself how responsive the host is while browsing through a typical modern blog/CMS site. Reliability & uptime. No host is really 99.99% perfect here. However, all hosts rated 4 stars or more are in the top performers regarding uptime. Features. Many hosts are loaded with features you don't need. In other cases you may need something very specific or advanced that only a few hosts will offer (SSH access for example). All hosts on this page have the standard features you expect from a modern web hosting company: PHP, Perl, MySQL, control panel and email, all that on your own domain, of course. Support. This is tricky to evaluate. Because the quality of support sometimes varies from one support representative to the next, we kindly ask you to share your experience in the comments section for your host. Unfortunately this also attracts fake comments (sometimes from competitors, sometimes from the hosts themselves). We try to moderate but we reckon this is not 100% failsafe. A note about Price: we constantly try to find the best coupons or to secure special deals with hosting companies in order to bring you the best prices for each of these hosting offers. Sometimes, however, those prices are valid for a limited time only and it may happen that the promo has expired when you try to take advantage of it. If this happens, please let us know so we can update the site ASAP. In the meantime, grab the good offers while they last & enjoy! Hosting plan details $ 2.99/mo Control Panel: cPanelb2evo quick install: Yes, with Softaculous Excellent Technology A2 Hosting Excellent platform technology Choice of datacenter Very transparent website Automatic daily backups not included (available as upgrade)This plan is downright excellent with one exception: you'll have to rely on manual backups or upgrade to get automated backups. Active b2evolution support. Click here & use coupon code b2evo to get the Special Price!« You don't like slow websites. Neither 