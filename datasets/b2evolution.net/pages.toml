["https://b2evolution.net"]
title = "b2evolution blog/social CMS - A complete engine for your website!"
description = "One blog. Multiple blogs. Photo albums. User community. Discussion forums. Online manuals. b2evolution can run them all on a single installation. Right out of the box — plugins fully optional."
full_description = "b2evolution is a Content Management System (CMS) aimed at making it easy to build and maintain websites for sharing information and collaborating with your community. From a simple homepage to a blog, a photo gallery or a newsletter... all the way up to a full-featured community site with forums, members directory and private messaging, b2evolution includes everything you need in a single integrated package (which saves you time on setup and upgrades). b2evolution is Free Open-Source software that you can download and run on the web-hosting service of your choice. b2evolution is Free Open-Source Software (FLOSS) licensed under the GPL v2 license and available on GitHub. b2evolution v6 fully leverages HTML5, CSS3, jQuery and the Bootstrap Responsive Web-Design framework. Once b2evolution is installed on your own web server or web hosting account, you might want to introduce your website with a home page. When you're done with the home page, you can start adding more sections (a.k.a. Collections) to your site. They will appear in the main navigation bar at the top... You could also have loosely connected blogs by letting each member of your organization, community or family customize their own space to their own taste. Albums open into contact sheets of thumbnails of customizable size. Each thumbnail can be viewed in full screen through a lightbox which allows zooming in to the highest available resolution of your photos. By adding forums – a.k.a. Bulletin Boards – to your website, your community can stay in touch with each other by sparking conversations on the topics they care about. b2evolution’s forums can be enabled on your site in 3 clicks. No plugin necessary. No integration issues. Manuals, books and documentation often require a structured hierarchy of chapters and sub-chapters, contrary to blogs, which are typically organized by date. Each manual can have its own assigned contributors. Each page can have its own attachments (images, videos, downloads) as well as a feedback/comment feed if needed."
