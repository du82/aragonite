full_description = "b2evolution CMS User ManualAdvanced TopicsUsing the APIs Using the Web Service APIs The Web Service APIs (Application Programming Interfaces) allow external tools, sites or services to communicate with your b2evolution installation. The APIs allow to retrieve, add, modify or delete content as well as users, stats, etc. REST API or RESTful API B2 API The b2 API is one of the APIs supported by b2evolution. Supported methods as of b2evolution version 2.4: * b2.newPost : new post call allowing to specify a category * b2.getCategories * b2.getPostURL : retrieves the permalink of a given post This…More » API Error Codes As of version 2.4, b2evolution supports 4 different APIs: MetaWeblog API MovableType API Blogger API b2 API Error Codes As of b2evolution 2.4 have been normalized like this: Code: 801 Message: Wrong username/password combination. Code: 802 Message:…More » Blogger API The Blogger API is one of the APIs supported by b2evolution. Supported methods as of b2evolution version 2.4: * blogger.newPost * blogger.editPost * blogger.deletePost * blogger.getUsersBlogs * blogger.getUserInfo * blogger.getPost * blogger.ge…More » MetaWeblog API MetaWeblog? is one of the APIs supported by b2evolution. Supported methods as of b2evolution version 2.4: * metaWeblog.newMediaObject * metaWeblog.newPost * metaWeblog.editPost * metaWeblog.getPost * metaWeblog.getCategories * metaWeblog.getRecen…More » MovableType API The MovableType? API is one of the APIs supported by b2evolution. Supported methods as of b2evolution version 2.4: * mt.getCategoryList * mt.setPostCategories * mt.getPostCategories More info about this API: * http://www.movabletype.org/More » Comments on this chapter"
