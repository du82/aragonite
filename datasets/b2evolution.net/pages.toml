full_description = "b2evolution CMS User ManualInstallation / Upgrade Installation / Import / Upgrade If you don’t have a b2evolution-powered website yet, we recommend you check out this page: Installation Guide - Getting Started If you already have a working installation of b2evolution, you may skip right through to: User’s Guide (for using b2evolution once it’s installed) New Installation Read this if you have no b2evolution site yet. Upgrade Read this if you already have a b2evolution site and you want to upgrade it to a newer version of b2evolution. Configuration files This explains the contents of the different configuration files. Advanced Setup This is information for more advanced users and more specific use cases. Migrating from Another System If you already had content in a different system and you want to import it into b2evolution, this will explain how. Moving your b2evolution Site If you already have a b2evolution site and want to move it to a different directory or different server, this will explain how. FAQ & Troubleshooting (Installation / Upgrade) Assumed User Skills Skills that someone should ideally have prior to installation.More » Comments on this chapter"
