["http://b2evolution.net/dev/research.php"]
title = "Research & Development"
full_description = 'Conclusions on Dynamic Page Adaptation after SMX meeting Posted by fplanque on Jun 15, 2009 in ResearchAfter a 1.5 hour meeting with interested parties at SMX Seattle on June 3rd, followed by a second 1 hour meeting on June 4th, we have set the following research directions and priorities for the Dynamic Page Adaptation module: Read more »Send feedback » Research on dynamic web page adaptation depending on statistical user behaviour Posted by fplanque on May 06, 2009 in ResearchFrom a high level perspective, b2evolution now integrates the following feature set: Web content pubishing / Content Management System (CMS) User interaction / feedback / community features - sometimes dubbed as "web 2.0" Search Engine Optimization features (SEO) Traffic statistics & analytics, most of them in real time The next logical step for us to take, such as has been requested by the community, is to implement dynamic web page adaptation based on the user behaviour we can gather through the real time traffic statistics.Read more »Send feedback » Research on new antispam measures Posted by fplanque on Apr 09, 2009 in ResearchOne of our current areas of research is better comment spam filtering. Comment spam is mainly the result of spammers trying to place one or several links to their own site on a blog powered by b2evolution. The benefit they get out of such links is the SEO value of these links (which is outside the scope of this article). If comments are published with the links as posted by the spammers, it is indeed a very easy way for them to perform what is called "mass link building" at a very low cost, especially through the use of automated processes ("spambots").Read more »1 feedback »'
