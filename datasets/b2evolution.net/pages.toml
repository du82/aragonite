hrough this page. Disclaimer: Some of these hosts will pay us a commission in addition to giving you a promotional price. These commissions are reinvested in the development of the b2evolution software.Form is loading... <p>This section can only be displayed by javascript enabled browsers.</p> About cheap webhosting...The web hosting plans on this page have been selected for their low cost while still providing good value and service. These offers are well suited for hosting your first web site or blog. You can always upgrade later.If you are unsure or just want a shortcut, we recommend you pick A2 Hosting for overall quality or iPage if you need a really cheap price...Learn more about cheap/shared hostingHow to improve your website performance with a CDNWhy you need a CDN Using a CDN is one of the easiest and fastest ways to boost your website performance. In order to see where the biggest peformance bootlenecks are, you can start by having a look at a waterfall graph of your website. The example above comes from b2evolution.net (before optimization). Any modern web browser will let you display this for you own site by using its developer menu/tools. When you do this for your site, just remember to clear your browser cache before measuring, otherwise your results won’t really show what your visitors experience. The waterfall graph shows one line for each file that is downloaded to display your page. Here are the color codes used by Safari: The blue line is the main PHP/HTML file; The green lines are for CSS files; The yellow lines are for Javascript files; Finally the purple ones are for images. Pay attention to 3 important aspects here: There are usually more files than you think that need to be downloaded to display a single web page. All files don’t start downloading right away. Each file has a long Latency time and a comparatively short Actual Transfer time. Let’s look at these 3 problems in order. Read more »Unlimited web hosting! (NOT)After a year of relentless escalation, most shared web hosting plans now come with "Unlimited" disk space and bandwidth! Too good to be true? YES INDEED! Don't fall for it! Many restrictions apply! Of course, the terms & conditions of each hosting company and or hosting plan will vary, but most of the time, if you try to really go unlimited you will hit one of these limits: The unlimited diskspace can only be used for public web content. It cannot be used for: password protected content or backups etc. The unlimited bandwidth can only be used for "regular web pages", not for: videos software downloads podcasts etc. There may still be limitations on the number of web requests per second your server can handle. There may still be limitations on the processor time your scripts can use. Does it matter? NO, NOT REALLY! Unless you're actually trying to run high traffic sites at virtually no cost, you should not really be concerned about this. Actually, the fact that everybody has aligned on "unlimited" will let you shift your focus on more interesting differentiating factors between software companies, such as: Is their software up to date? Is their platform secure? … Read more » Hosting plan details $ 2.99/mo Control Panel: cPanelb2evo quick install: Yes, with Softaculous Excellent Technology A2 Hosting Excellent platform technology Choice of datacenter Very transparent website Automatic daily backups not included (available as upgrade)This plan is downright excellent with one exception: you'll have to rely on manual backups or upgrade to get automated backups. Active b2evolution support. Click here & use coupon code b2evo to get the Special Price!« You don't like slow websites. Neither do your visitors. If your site is slow, your visitors will just find another site to buy from or get their information from. That's why your site will be hosted on our exclusive SwiftServer platform. The bottom line is we're faster than the competition. Nobody likes price increases at the time of renewal. Contra