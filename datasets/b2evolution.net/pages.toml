title = "The story of b2, b2evolution and WordPress"
description = "b2evolution is a strong evolution of it's ancestor: b2/cafelog. Do you know what other well-known project spawned from b2 ? WordPress..."
full_description = "Comment from: dhindsAs I understand the statement made above, b2e provides a more complete, stable and secure solution compared than wp, in spite of wp’s extensive user base. Has anyone here used both?2014-01-05 @ 22:19 Comment from: hoeve955Yes I use both, wordpress indeed for easier design options and more choice templates, but b2 evolution feels more nice/secure to work with and also more interesting and gives me more options to do larger content things (no add but after lots (years) of trying managed to get shake5.com done thanks to b2evolution - is just to give example that could not been done with wp, I tried that several times but no way) But no designer myself, I could do with more template options, who knows a great plugin now and then and so on, but on the whole I prefer b2evolution - nice to work with. - Johnny2014-02-20 @ 05:15 Comment from: adi_kwokWhat about for mobile windows, blackberry, android and iphone devices? Im looking for multi user blog, which not taking 3-5 seconds, or even minutes, just to be displayed, in small screen with gprs connection. Hopefully this software could be the one, im looking for.2014-03-25 @ 02:04 Comment from: fplanqueYes we’re on the same page here! b2evolution makes a distinction between 3 classes of devices: desktop browsers, tablets and mobile phones. By default you send the same layout to all (possibly using RWD) but you absolutely have the possibility to use different skins (themes) for each class. That way you can send a much lighter version to mobile phones. We will showcase this on our site shortly (we’re in the middle of a big redesign ;)2014-03-25 @ 02:25 Comment from: dh.comI’ve been using B2evo for over 2 years and I have websites running in wordpress too but I am totally hooked up with b2evo. There are so many advantages to mention about b2evo… The only advantage of wordpress is their tons of skins. ( I used the term “SKIN” because that’s one of the distinctive identities of this SOCIAL CMS. Regarding security, my websites running in WP are receiving too many spams in a day but b2evo performs way better (almost zero spam or unwanted comments)2014-03-30 @ 15:46"
