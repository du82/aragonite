description = "One blog. Multiple blogs. Photo albums. User community. Discussion forums. Online manuals. b2evolution can run them all on a single installation. Right out of the box — plugins fully optional."
full_description = 'About b2evolution This section will tell you everything about b2evolution from a high level perspective. Additional sources of information include the online manual for technical details and the community forums for asking questions or getting support. Why use b2evolution? Why b2evolution? Own your data, Own your site! + No plugins required! What is b2evolution? What is b2evolution? b2evolution is a tool that allows you to build your own website. This ranges from just a home page to a full featured site with multiple blogs, forums for your user community and structured content such as manuals or knowledge bases. Use Cases A powerful WordPress alternative b2evolution is an evolution of the original b2/cafelog software, which is also the ancestor of WordPress. The philosophies of b2evolution and WordPress have evolved in very different directions. Use Cases User Group / Club Site Users can either register themselves or they can be created by Administrators. They optionally receive a "Welcome" email with link inviting them to complete their profile. Administrators can manage the user base… What is b2evolution? Digital Building Blocks, like Lego® Bricks You can think of building a website with b2evolution CMS as opening a big box of Lego® bricks. There are many types of bricks included in the box. You are free to assemble them however you like to build the website that fits your needs… New Installation Installation Guide - Getting Started This short guide will tell you what you need to know to install b2evolution for the first time. Content HierarchyTable of contentsWhy use b2evolution?Why b2evolution?Design PhilosophyTestimonialsForeverLinksWhat is b2evolution?What is b2evolution?Feature HighlightsDigital Building Blocks, like Lego® BricksTour / ScreenshotsEvolution of b2, 180° from WordPress!Front-End TechnologiesAbout UsHow to use b2evolutionInstallation Guide - Getting StartedSigning up...Use CasesA powerful WordPress alternativeA builder for a company websiteUser Group / Club SiteSupportFree SupportLicense & TermsGNU GPL LicenseTerms of ServicePrivacy PolicyContactsPress RoomSponsoring, Donations and SupportMailing AddressEmail'
