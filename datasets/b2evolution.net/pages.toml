ine, type:…More » Publish an XML Site Map In b2evolution v6+, XML Sitemaps are generated automatically and can be accessed by adding ?tempskin=_sitemap to the URL of your collection. Example: https://your-site.com/your-collection-name/?tempskin=_sitemap . Notes: This feature is only active if…More » Show images in my RSS when option "Post excerpts" is selected By default, when you set the RSS mode of your blog as Post excerpts RSS/Atom feeds, and due the post excerpts are composed exclusively with text, your images will not be linked in the final XML file. In order to include your images set as teaser, you…More » Include an image rollover in a post In this simple tutorial you will learn how to include rollover images in your posts. The final result will be having and image like thisMore » FTP 101: How to upload and manage files on your web server This page tells you what you need to know to upload files to your web server and mange them using FTP, which stands for **File Transfer Protocol**, in case you wonder. This page tells you what you need…More »'''
