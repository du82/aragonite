title = "6.18.0 Released · Babel"
description = "More flow updates, and lots of fixes!"
full_description = '''6.18.0 ReleasedOctober 24, 2016 · 7 min readHenry ZhuMore flow updates, and lots of fixes! We've added 4 new collaborators to Babel since the last release! All of the hard work goes to them and our new contributors! Moti Zilberman: 🐙 @motiz88, 🐦 @motiz88 Dan Harper: 🐙 @danharper, 🐦 @DanHarper7 Kai Cataldo: 🐙 @kaicataldo, 🐦 @kai_cataldo Andrew Levine: 🐙 @DrewML, 🐦 @drewml They've been helping keep this project afloat with @loganfsmyth, @danez, and me! v6.18.0 Summary (2016-10-24)​ Again if you haven't checked recently, we've moved back to Github Issues! This is all thanks to @danez 🚀 New Feature​ #4697 Add variance node type and generate property variance annotations. (@samwgoldman) Check out the blog post and flow docs for more info: JavaScripttype T = { +p: T };interface T { -p: T };declare class T { +[k:K]: V };class T { -[k:K]: V };class C2 { +p: T = e }; #4746 Support ObjectExpression in static path evaluation. (@motiz88) Useful for babel/babili and other plugins. JavaScript// in{['a' + 'b']: 10 * 20, 'z': [1, 2, 3]}// out{ab: 200, z: [1, 2, 3]} #4699 import(): Initial support for dynamic-import. (@kesne) Parser support was added in babel/babylon#v6.12.0. Just the plugin to enable it in babel. JavaScript// install$ npm install babel-plugin-syntax-dynamic-import --save-dev or use the new parserOpts JavaScript// .babelrc{ "parserOpts": { "plugins": ['dynamicImport'] }} #4655 Add useBuiltIns option to helper-builder-react-jsx. (@existentialism) Previously we added a useBuiltIns for object-rest-spread so that it use the native/built in version if you use a polyfill or have it supported natively. This change just uses the same option from the plugin to be applied with spread inside of jsx. JavaScript// invar div = <Component {...props} foo="bar" />// outvar div = React.createElement(Component, Object.assign({}, props, { foo: "bar" })); #4724 Add EmptyTypeAnnotation. (@samwgoldman) Added in flow here and in babylon here. JavaScriptfunction f<T>(x: empty): T { return x;}f(); // nothing to pass... #4758 Make getBinding ignore labels; add Scope#getLabel, Scope#hasLabel, Scope#registerLabel. (@kangax) Track LabeledStatement separately (not part of bindings). 💅 Polish​ #4690 Consolidate contiguous var declarations in destructuring transform. (@motiz88) JavaScript// inconst [a, b] = [1, 2];// outvar a = 1, b = 2; #4685 Better error messaging when preset options are given without a corresponding preset. (@kaicataldo) We've had a few reports of users not wrapping a preset in [] when passing in options so we added an extra error message for this. JavaScript// incorrect, and current gives a unexpected error message{ "presets": [ "preset", { "presetOptions": 'hi' } // gets parsed as another preset instead of being part of the "preset" ]}// correct{ "presets": [ ["preset", { "presetOptions": 'hi' } ] ]} ReferenceError: [BABEL] /test.js: Unknown option: base.loose2. Check out http://babeljs.io/docs/usage/options/ for more information about options.A common cause of this error is the presence of a configuration options object without the corresponding preset name. Example:Invalid: `{ presets: [{option: value}] }`Valid: `{ presets: [["presetName", {option: value}]] }`For more detailed information on preset configuration, please see http://babeljs.io/docs/plugins/#pluginpresets-options. #4646 Change babel-generator to output boolean instead of bool for the BooleanTypeAnnotation AST node. (@existentialism) JavaScriptvar a: Promise<boolean>[];// instead ofvar a: Promise<bool>[]; 📝 Documentation​ #4653 Tweak license for GitHub display. (@existentialism) So that our MIT License shows up. 🐛 Bug Fixes​ #4765 Don't treat JSXIdentifier in JSXMemberExpression as HTML tag. Closes #4027. (@DrewML) JavaScript// transform-react-inline-elements// issue with imported components that were JSXMemberExpressionimport { form } from "./export";function ParentComponent() { return <form.TestComponent />;} #4763 Handle remapping of JSXIdentifier to MemberExpression in CommonJS transform. Closes #3728. (@DrewML) // transform-react-inline-elementsimport { Modal } from "react-bootstrap";export default CustomModal = () => <Modal.Header>foobar</Modal.Header>; #4736 Fix replacing for-of if inside label. (@danez) JavaScriptif ( true ) { loop: for (let ch of []) {}} #4502 Make special case for class property initializers in shadow-functions. (@motiz88) class A { prop1 = () => this; static prop2 = () => this; prop3 = () => arguments;} #4719 Fixed incorrect compilation of async iterator methods. (@Jamesernator) JavaScript// inclass C { async *g() { await 1; }}// outclass C { g() { // was incorrectly outputting the method with a generator still `*g(){` return _asyncGenerator.wrap(function* () { yield _asyncGenerator.await(1); })(); }} #4690 Consolidate contiguous var declarations in destructuring transform. (@motiz88) JavaScript// was wrapping variables in an IIFE incorrectlyfor ( let i = 0, { length } = list; i < length; i++ ) { console.log( i + ': ' + list[i] )} #4666 Fix error when constructor default arg refers to self or own static property. (@danharper) JavaScript// was producing invalid codeclass Ref { static nextId = 0 constructor(id = ++Ref.nextId, n = id) { this.id = n }}assert.equal(1, new Ref().id)assert.equal(2, new Ref().id) #4674 Handle side effects correctly in rest params index expressions (#4348). (@motiz88) JavaScriptfunction first(...values) { let index = 0; return values[index++]; // ++ was happening twice}console.log(first(1, 2)); #4669 Fix block scoping transform for declarations in labeled statements. (@motiz88) JavaScriptlet x = 10;if (1){ ca: let x = 20;} #4672 Avoid repeating impure (template) literals when desugaring **= (#4403). (@motiz88) JavaScripta[`${b++}`] **= 1; #4642 Exclude super from being assign to ref variable. (@danez) JavaScriptfoo = { bar() { return super.baz **= 12; }} #4670 Retain return types on ObjectMethods in transform-es2015-shorthand-properties. (@danharper) JavaScript// @flowvar obj = { method(a: string): number { return 5 + 5; }}; #4668 Retain method return types on transform-es2015-classes (Closes #4665). (@danharper) JavaScript// @flowclass C { m(x: number): string { return 'a'; }} 🏠 Internal​ #4725 Remove babel-doctor from babel-cli. (@kaicataldo) It's a one-time use tool (helpful after the initial release when upgrading from v5 to v6) that doesn't need to be a part of babel-cli. We'll publish it as a standalone package it someone asks for it. #4764 Add TEST_DEBUG env var option for test.sh, to enable node 6 debugger. (@DrewML) Will be useful for contributors: TEST_DEBUG=true make test to run node --inspect on node v6+. #4735 Automatically generate missing expected.js fixtures. (@motiz88) Also amazing for contributors: if you create an actual.js test file without the expected.js it will generate it for you (like snapshot tests but with babel output). #4734 Change usage of "suite"/"test" in unit-tests to "describe"/"it". (@DrewML) #4564 Enable babel for tests. (@danez) The non-fixture tests finally are also transpiled as well! #4732 Run ESLint on test files, and fix lint errors in test files.. (@DrewML) #4680 Update: Eslint to 3.0 and update CI builds (Closes #4638). (@gyandeeps) Allows us to use the latest version of eslint which drops support of node < 4 by only running lint on the lastest node which should save CI time. 🎉 First Merged Pull Request!​ Andrew Levine (DrewML) Eric Rozell (rozele) Gyandeep Singh (gyandeeps) Jamesernator Jordan Gensler (kesne) Nazim Hajidin (nhajidin) Simen Bekkhus (SimenB) sugargreenbean 🌏 Committers: 17​ Brian Ng (existentialism) Dan Harper (danharper) Daniel Tschinder (danez) Greenkeeper (greenkeeperio-bot) Henry Zhu (hzoo) Juriy Zaytsev (kangax) Kai Cataldo (kaicataldo) Moti Zilberman (motiz88) Sam Goldman (samwgoldman) Check out Github for the whole changelog!'''
