full_description = "7.26.0 Released: stage 4 features enabled by default, and a new experimental code printerOctober 25, 2024 · 3 min readBabel TeamBabel 7.26.0 was just released! It enables by default support of two ECMAScript proposals that become standard in the last TC39 meeting, import attributes and inline regular expression modifiers, as well as parsing of Flow enums. Babel now also allows plugins to provide asynchronous pre/post hooks, and has an [experimental mode](TODO: Link) to preserve tokens' positions when generating the transformed output. You can read the whole changelog on GitHub.Read more 7.25.0 Released: Safari bugfixes and duplicated named capturing groupsJuly 26, 2024 · 3 min readBabel TeamBabel 7.25.0 is out! @babel/preset-env now supports the duplicated named capturing groups proposal for Regular Expressions by default, as well as a bugfix for class fields when targeting Safari. This version also improves support for compiling JSON module imports to CommonJS, and adds support for config files to @babel/node's --eval mode. You can read the whole changelog on GitHub.Read more 7.24.0 Released: Decorator updates and JSON modules importsFebruary 28, 2024 · 3 min readBabel TeamBabel 7.24.0 is out! We updated our Decorators implementation to match the latest version of the proposal, and we improved the way we transform class private fields and methods. We also added support for importing JSON modules in browsers and Node.js, an older Stage 3 proposal depending on Import Attributes. You can read the whole changelog on GitHub.Read more CVE-2023-45133: Finding an Arbitrary Code Execution Vulnerability In BabelOctober 18, 2023 · 10 min readWilliam Khem Marquez On October 10th, 2023, I stumbled upon an arbitrary code execution vulnerability in Babel, which was subsequently assigned the identifier CVE-2023-45133. In this post, I’ll walk you through the journey of discovering and exploiting this intriguing flaw.Read more 7.23.0 Released: Decorator Metadata and many new `import` features!September 25, 2023 · 6 min readBabel TeamWe just released Babel 7.23.0! 🎉 It includes transform support for the Decorator Metadata, Source Phase Import, Deferred Import Evaluation, and Optional Chaining Assignment proposals. We also updated our parser to support the new TypeScript 5.2 version, and added a transform option to let you use the .ts extension within TypeScript imports. In addition to releasing version 7.23.0, we also recently published the first Babel 8 alpha release! You can read the whole changelog on GitHub.Read more"
