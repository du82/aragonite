["https://babeljs.io/blog/2016/12/07/the-state-of-babel"]
title = "The State of Babel · Babel"
description = "- Some History"
full_description = '''The State of BabelDecember 7, 2016 · 22 min readHenry Zhu Some History Current Status The Future Community Previous issues: Babel Roadmap #4130, 6.0 #2168 Please check out the Community section if nothing else. Also published as part of Mariko Kosaka's 2016 Web Advent Calendar! Some History​ Sebastian created "6to5" in September of 2014. Interestingly enough, he made it to scratch an itch he had with understanding programming languages and how they work. You might have assumed whoever created the project already knew how compilers worked and understood JavaScript perfectly... but you would be wrong! Check out his post for a great read of his story: ~2015 in Review. 6to5 did exactly that: easily turn ES6 code into ES5 code. When 6to5 became Babel as mentioned in Not Born to Die, it became a platform: a suite of tools designed to create the next generation of JavaScript tooling. No longer did it just compile ES6 to ES5, it allowed developers to build tools on top of it. Here are some of our milestones: In 5.0.0, Babel aligned more with the TC39 process by introducing stages, added a .babelrc config option, and created a plugin system for custom transforms. In 6.0.0, Babel became modular (a pretty controversial idea at the time). This was a huge change that led to opt-in functionality (no defaults) and the concept of Presets and Plugin Options. As mentioned in his article, Sebastian joined Facebook in July 2015 and worked on the entire development of Babel 6 on company time. 6.3.13 Sebastian extracted our monorepo build/publish tools into what is now Lerna. (What's funny is James rewrote it 3 times and I had to review everything) After this was around when both Sebastian and James got burned out on Babel, and a few contributors stepped up. We struggled to find direction and deal with the bugs/requests coming in but we got a lot of stuff done! 6.13.0 finally added Preset Options. 6.14.0 added a latest-preset that keeps up to date with the yearly JavaScript specification. 6.16.0 allowed changing out the parser or code-generator. In August, we released Babili, a minifier based on Babel. In September, we released the first version of babel-preset-env (read on for details). After a year on Phabricator, we moved back to to GitHub issues thanks solely to @danez and his amazing (and underappreciated) work. If you're using Babel, let us know with a PR to our users page! Now babel-core is downloaded over 5 million times per month and almost 60 million times total and used at huge companies like Facebook/Netflix/Airbnb and other OSS projects like React/Yarn. Thanks everyone for your continued support! We want to continue acting as the foundation of the JavaScript toolchain: compilation, linting, minification, codemods, code coverage, etc. Current Status​ If you're interested in helping out please check out the issues linked below! Maintaining Babel plugins for each proposal in TC39 starting from Stage 0​ TC39 stands for Ecma International, Technical Committee 39: it's the committee that makes JavaScript. @b0rk Short answers:Who's there? Engine implementers, developers, a handful of academics and theorists, and @BrendanEich.— Yehuda Katz (@wycats) November 30, 2016 Babel uses TC39's concept of stages to categorize its experimental plugins. Users should be able to easily use features before they are all implemented in browsers in stage 4 of the TC39 process. Babel is fundamental in the process given its place in the ecosystem: it is significantly easier for a developer to update a .babelrc file than a browser flag and much faster to write a Babel plugin than to implement the feature natively in the browser. This is the core of Babel. But the proposals process involves significant iteration: proposals can change in syntax or even get dropped. Because TC39 meets every 2 months, plugins should be updated as least as often as each change in stage so that users can be in sync. Early feedback to the proposal champion and committee is extremely valuable although it is recommended to use Stage 0/1/2 features with caution. Although companies like Facebook take advantage of these kinds of features, they have created codemods to allow easy change. There isn't enough time or resources to maintain each plugin, especially when there are spec updates. Some transforms are simply out of date such as decorators. Logan had to port the previous spec babel-plugin-transform-decorators-legacy for Babel 6 and we haven't had anyone able to rewrite it for the updated spec. babel/babel#3473 - Async iteration proposal wasn't merged for so long because we just didn't have time to review it. By the time it was merged it had already moved from stage 2 to stage 3. Next we're going to be working with: Daniel Ehrenberg on Private Fields (Stage 2) Yehuda Katz on Class and Property Decorators (Stage 2) Mathias Bynens on Unicode Property Escapes in Regular Expressions (Stage 2) via babel/babel#3683 Relevant Issues: Should we create a codemod for Stage X proposals at the same time as creating the actual transform? Private Fields Decorators Proposal Check out thefeedbackloop.xyz for more info on TC39! Maintaining other ecosystem plugins: JSX/Flow​ Babel is vital to the React and Flow ecosystems, and we work closely with the relevant teams at Facebook. React plugins, React preset These cover the main JSX transform, development plugins, and optimizations. Flow plugin Relevant Issue Labels: babel/babel: React issues facebook/react: Optimizing Compiler babel-preset-env ("autoprefixer" for Babel)​ JavaScript compilation is a moving target: There are yearly updates to the spec, browser vendors are constantly updating to that spec, and users may drop support for earlier browsers. At first glance, there doesn't seem to be a fixed target for what we should compile our JavaScript down to. The compat-table is updated constantly and is used for this preset. This is where babel-preset-env comes in: it's a Babel preset that automatically determines the correct Babel plugins to use based on the provided environments. Its goal is both simplicity in use and efficiency in output: you only need to worry about your target environments to be able to take advantage of native code. The preset decides for you the required plugins. Some example configs​ Targeting Chrome 55 + last 2 versions of other browsers via browserslist JavaScript{ "presets": [ ["env", { "targets": { "chrome": 55, "browsers": ["last 2 versions"] } }] ]} Targeting the current Node.js version (uses process.versions.node) JavaScript{ "presets": [ ["env", { "targets": { "node": "current" } }] ]} Chrome 55 useBuiltIns + webpack 2 JavaScript{ "presets": [ ["env", { "targets": { "chrome": 55 }, "modules": false, "useBuiltIns": true }] ]} In JavaScriptimport "babel-polyfill"; Out (different based on environment) JavaScriptimport "core-js/modules/es7.string.pad-start";import "core-js/modules/es7.string.pad-end"; Relevant Issues: Next big feature: apply the same idea of preset-env to polyfills as well babel/babel-preset-env#20 with corresponding PR in babel/babel-preset-env#56. Using browserslist and PR "Node.js versions support" in Browserslist Publish runnable tests & browser data to npm Linting via babel-eslint​ ESLint doesn't support new language features until they reach Stage 4 of the proposals process. For this reason we maintain babel-eslint (a custom ESLint parser) so you can continue to lint JavaScript with experimental syntax. This project was one of the hardest projects to work on: because it is just a compatibility layer between Babel and ESLint there is inherently a constant need for updates when either projects update and a high risk of unexpected changes due to monkey-patching. It was unfortunate to get issues like babel/babel-eslint#243 or babel/babel-eslint#267. To that end, we'd like to lessen the maintenance burden of this project by improving our scope and traversal interop with ESLint. It might even be interesting to be able to write ESLint rules using babel APIs or vice versa? Relevant Issues: Previous Linting APIs Discussion Running smoke tests on ESLint babel/babel-eslint#88 is still relevant now Minification​ Babili is our new Babel-powered minifier, enabling you to produce minified code while targeting the latest browsers. In JavaScriptclass Mangler { constructor(program) { this.program = program; }}new Mangler(); Out JavaScript// ES2015 code -> Babili -> Minified ES2015 Codeclass a{constructor(b){this.program=b}}new a; Check out our blog post for more info. Since it was recently released, we're looking for some new contributors! There's a lot of small bugs and things that could be improved for those looking for a new project to help out with! Codemods / Refactoring / eslint --fix​ A codemod is a tool-assisted code modification; a fancy find-and-replace. If you wanted to change merge({}) to Object.assign({}) (and maybe later object rest) you might do a regex replace. But you don't want to replace the other parts of the code that also might be called merge such as imports/exports, strings, comments, and local variables. To do it safely you'll want something more powerful that only changes the specific code you need. Although Babel already handles transforming code into other code, it doesn't really care about the styling of the input code as a compiler. After using Babel with its default options to do a codemod, git diff looks really messy. Enter Recast: a tool that preserves the formatting of unmodified code while also pretty-printing any new AST nodes. In the screenshot above, the top-left pane is the input code and the bottom-right pane is the output code after the babel plugin is run. In this case it's preserving the whitespace of the input code when possible. By passing in Recast in the options, Babel can power the future of codemods. .babelrc JavaScript{ "parserOpts": { "parser": "recast" }, "generatorOpts": { "generator": "recast" }} Run the relevant Babel transform(s) on the source code and overwrite it: Shellbabel src -d src This feature was just made possible so we're looking forward to making it easier to use and seeing the transformations it can enable. Check out the 6.16.0 blog post for more info! Other relevant projects: JSCodeshift, js-codemod, Lebab. Relevant Issues: Rewriting Lebab as a Babel transformer Babel integration with jscodeshift Code Coverage / Instrumentation​ We want to support tools like nyc and babel-plugin-istanbul. Plugin Ecosystem​ Thanks to our vibrant community, new plugins are constantly being created: whether it be a new way to write your css in jsx or rewire your tests. Currently there are > 1200 babel-plugins on npm. We've had some interesting discussions on how we can grow and support the plugin ecosystem. We could try to watch all the repos but that is obviously overwhelming. It might be interesting to create some bots to automate a few tasks: create specific Babel plugins/ESLint rules for babel-plugins, write codemods to update API changes, and integrate plugins into our smoke test. @jaredforsyth @reactjs My five minute POC ☺️ https://t.co/v74UFHsSJG pic.twitter.com/B3YwVWkH5g— Henry Zhu (@left_pad) December 6, 2016 Should we create a newsletter for new/useful plugins? How can we teach people about plugins and how to write them? How can we make ASTExplorer better? Documentation (this website!)​ Docs contributions have definitely been lacking in the last year. However just recently we've done a lot of awesome stuff: @Daniel15 has been maintaining babel-standalone which we use in the REPL and has some automation when new releases get out. @maxiloc added search functionality via Algolia via #977 We've also added new collaborators: @STRML: Added Discourse to all github pages via #875 @xtuc: Added support for reading the README from the babel repo so we don't have to sync 2 copies of docs via #990 @fredericmarx: Added support for a copy to clipboard button for code snippets via #998 @seedofjoy: Added a resize ability for the REPL via #1003 Some Ideas All plugins should have examples. Can also embed RunKit or the REPL. Update FAQ with common errors API docs / make babel-handbook better Relevant Issues: Reorganizing the docs layout Showcase community plugins Adding a resources page Learn ES2015: teach others about ES2015+ REPL: adding example dropdowns REPL: supporting all options REPL: allow the REPL to import any community plugin from npm REPL: Use ASTexplorer ASTexplorer: Real Time collaboration The Future​ NOTE: Everything below can be changed or dropped. Some might be already in the works and others are just suggestions that need a proper discussion/champion. Priority should be determined on what the community needs: not because it would be nice to have. Plugin API Changes​ There is a lot of confusion around how plugins/presets interact regarding ordering. This results in bugs and issues with the config which require users to place plugins before/after others in a non-intuitive way. We’re currently discussing API changes that could reduce the confusion. However, since this is a fundamental change to the core of Babel, it might take a while to figure out the best approach. Versioning​ Since Babel 6 we've used a "fixed" mode of versioning via Lerna. This is what allows us to release multiple packages at the same time all under the same version (if that package changes). This is nice because you don't have to manually set a version for each package but everything moves together. The only time this could cause an error is when one on the packages makes a breaking change: then every package also will bump major versions. This is explained more in babel/notes but we still need to figure out the best plan of action for the project. What happens when we need to update a Stage 0 spec to Stage 1 and it's a breaking change to the parser? Are we just going to bump the major version, wait to batch some changes up, or figure out how to do it via multiple versions of plugins? Discussion Issue Changing the Mindset Around Stage X Presets​ My rule of thumb on how I decide what future features to transpile:"Could I reasonably codemod this if it changes?"Don't do it otherwise.— Kent C. Dodds (@kentcdodds) November 30, 2016 Relevant Issues: Should we rename the stage x presets to explain more that they are "experimental" Speed​ Performance is a feature! Other things can be more of a priority at times (bug fixes, spec compliancy, etc) but it's still important in a few different aspects. How can we reduce the size/time of install, especially for a project with multiple packages? (this is helped by yarn) How can we parse faster? How can we make faster plugins (and measure them individually)? How can we generate the transformed code faster? How can we generate code that runs fast in the browser (https://fhinkel.github.io/six-speed/)? If you to read the compiled output and see issues, then report it and ask for help in making a PR! Previous Issues: Speeeeed Amazing PR to improve babel-ge'''
