["https://babeljs.io/blog/2018/09/17/decorators"]
title = "TC39 Standards Track Decorators in Babel · Babel"
description = "Babel 7.1.0 finally supports the new decorators proposal: you can try it out by using the @babel/plugin-proposal-decorators plugin 🎉."
full_description = '''TC39 Standards Track Decorators in BabelSeptember 17, 2018 · 8 min readNicolò RibaudoBabel 7.1.0 finally supports the new decorators proposal: you can try it out by using the @babel/plugin-proposal-decorators plugin 🎉. A Bit of History​ Decorators were first proposed by Yehuda Katz more than three years ago. TypeScript released support for decorators in version 1.5 (2015) alongside with many ES6 features. Some major frameworks, like Angular and MobX, started using them to enhance their developer experience: this made decorators popular and gave the community a false sense of stability. Babel first implemented decorators in version 5, but removed them in Babel 6 because the proposal was still in flux. Logan Smyth created an unofficial plugin (babel-plugin-transform-decorators-legacy) which replicated the Babel 5 behavior; it has since then been moved to the official Babel repository during the first Babel 7 alpha release. This plugin still used the old decorators semantics, because it wasn't clear yet what the new proposal would have been. Since then, Daniel Ehrenberg and Brian Terlson become co-authors of the proposal along with Yehuda Katz, it has been almost completely rewritten. Not everything has been decided yet, and there isn't a compliant implementation as of today. Babel 7.0.0 introduced a new flag to the @babel/plugin-proposal-decorators plugin: the legacy option, whose only valid value was true. This breaking change was needed to provide a smooth transition path from the Stage 1 version of the proposal to the current one. In Babel 7.1.0 we are introducing support for this new proposal, and it is enabled by default when using the @babel/plugin-proposal-decorators plugin. If we didn't introduce the legacy: true option in Babel 7.0.0, it wouldn't be possible to use the correct semantics by default (which would be equivalent to legacy: false). The new proposal also supports decorators on private fields and methods. We haven't implemented this feature yet in Babel (for each class, you can use either decorators or private elements), but it will come very soon. What Changed In The New Proposal?​ Even though the new proposal looks very similar to the old one, there are several important differences that make them incompatible. Syntax​ The old proposal allowed any valid left-hand side expression (literals, function and class expressions, new expressions and function calls, simple and computed property accesses) to be used as the body of a decorator. For example, this was valid code: JavaScriptclass MyClass { @getDecorators().methods[name] foo() {} @decorator [bar]() {}} That syntax had a problem: the [...] notation was used as both property access inside the decorator body and to define computed names. To prevent such ambiguity, the new proposal only allows dot property access (foo.bar), optionally with arguments at the end (foo.bar()). If you need more complex expressions, you can wrap them in parentheses: JavaScriptclass MyClass { @decorator @dec(arg1, arg2) @namespace.decorator @(complex ? dec1 : dec2) method() {}} Object Decorators​ The old version of the proposal allowed, in addition to class and class elements decorators, object members decorators: JavaScriptconst myObj = { @dec1 foo: 3, @dec2 bar() {},}; Due to some incompatibilities with the current object literal semantics, they have been removed from the proposal. If you are using them in your code, stay tuned because they might be re-introduced in a follow-on proposal (tc39/proposal-decorators#119). Decorator Functions Arguments​ The third important change introduced by the new proposal is about the arguments passed to the decorator functions. In the first version of the proposal, class elements decorators received a target class (or object), a key, and a property descriptor — similar in shape to what you would pass to Object.defineProperty. Class decorators took as their only argument a target constructor. The new decorators proposal is much more powerful: element decorators take an object which, other than changing the property descriptor, allows changing the key, the placement (static, prototype or own), and the kind (field or method) of the element. They can also create additional properties and define a function (a finisher) which is run on the decorated class. Class decorators take an object which contains the descriptors of every single class element, making it possible to modify them before creating the class. Upgrading​ Given these incompatibilities, it is not possible to use existing decorators with the new proposal: this would make the migration very slow, since existing libraries (MobX, Angular, etc.) can't be upgraded without introducing breaking changes. To workaround this issue, we have published an utility package which wraps the decorators in your code. After running it, you can safely change your Babel config to use the new proposal 🎉. You can upgrade your files using a one-liner: npx wrap-legacy-decorators src/file-with-decorators.js --decorators-before-export --write If your code only runs in Node, or if you are bundling your code with Webpack or Rollup, you can avoid injecting the wrapper function in each file by using an external dependency: npm install --save decorators-compatnpx wrap-legacy-decorators src/file-with-decorators.js --decorators-before-export --external-helpers --write For more information, you can read the package documentation. Open Questions​ Not everything has been decided yet: decorators are a very big feature and defining them in the best possible way is complex. Where Should Decorators on Exported Classes Go?​ tc39/proposal-decorators#69 The decorator proposal has gone back and forth on this question: should decorators come before or after the export keyword? JavaScriptexport @decorator class MyClass {}// or@decoratorexport class MyClass {} The underlying question is whether or not the export keyword is part of the class declaration or it is a "wrapper". In the first case it should come after decorators, since decorators come at the beginning of the declaration; in the second one it should come before, because decorators are part of the class declaration. How to Make Decorators Securely Interact with Private Elements?​ tc39/proposal-decorators#129, tc39/proposal-decorators#133 Decorators give rise to an important security concern: if it is possible to decorate private elements, then private names (which can be considered as the "keys" of private elements) could be leaked. There are different safety levels to be thought of: Decorators should not accidentally leak private names. Malicious code should not be able to "steal" private names from other decorators, in any way. Only decorators directly applied to private elements might be considered trusted: should class decorators not be able to read and write private elements? Hard privacy (one of the goals of the class fields proposal) means that private elements should only be accessible from inside the class: should any decorator have access to private names? Should it be only possible to decorate public elements? These questions need further discussion before being resolved, and that's where Babel comes in. The Role of Babel​ Following the trend in the What's Happening With the Pipeline (|>) Proposal? article, with the Babel 7 release we are starting to use our position in the JS ecosystem to help proposal authors even more, by giving developers the ability to test and give feedback about different variations of the proposals. For this reason, alongside with the update of @babel/plugin-proposal-decorators we introduced a new option: decoratorsBeforeExport, which allows users to try both export @decorator class C {} and @decorator export default class. We will also introduce an option to customize the privacy constraint of decorated private elements. These options will be required until TC39 folks make a decision about them, so that we can let the default behavior be whatever the final proposal will specify. If you are directly using our parser (@babel/parser, formerly babylon) you can already use the decoratorsBeforeExport option in version 7.0.0: JavaScriptconst ast = babylon.parse(code, { plugins: [ ["decorators", { decoratorsBeforeExport: true }] ]}) Usage​ For usage in Babel itself: npmYarnpnpmnpm install @babel/plugin-proposal-decorators --save-devyarn add @babel/plugin-proposal-decorators --devpnpm add @babel/plugin-proposal-decorators --save-dev babel.config.json{ "plugins": ["@babel/plugin-proposal-decorators", { "decoratorsBeforeExport": true }]} Check the @babel/plugin-proposal-decorators docs for more options. Your Role​ As a JavaScript developer, you can help outline the future of the language. You can test the various semantics which are being considered for decorators, and give feedback to the proposal authors. We need to know how you are using them in real-life projects! You can also find out why some design decisions were taken by reading the discussions in the issues and the meeting notes in the proposal's repository. If you want to try out decorators right now, you can play with the different presets options in our repl!'''
