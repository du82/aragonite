["https://babeljs.io/blog/2018/08/27/7.0.0"]
title = "Babel 7 Released · Babel"
description = '''After almost 2 years, 4k commits, over 50 pre-releases, and a lot of help we are excited to announce the release of Babel 7. It's been almost 3 years since the release of Babel 6! There's a lot of moving parts so please bear with us in the first weeks of release. Babel 7 is a huge release: we've made it faster, created an upgrade tool, JS configs, config "overrides", more options for size/minification, JSX Fragments, TypeScript, new proposals, and more!'''
full_description = '''Babel 7 ReleasedAugust 27, 2018 · 23 min readHenry ZhuAfter almost 2 years, 4k commits, over 50 pre-releases, and a lot of help we are excited to announce the release of Babel 7. It's been almost 3 years since the release of Babel 6! There's a lot of moving parts so please bear with us in the first weeks of release. Babel 7 is a huge release: we've made it faster, created an upgrade tool, JS configs, config "overrides", more options for size/minification, JSX Fragments, TypeScript, new proposals, and more! If you appreciate the work we're doing on Babel, you can sponsor Babel on Open Collective, support me on Patreon, or get you or your company involved with Babel as part of work. We'd appreciate the collective ownership of this vital project in the JavaScript community! It's Happening! 🎉​ Software is never going to be perfect but we're ready to ship something that's already been used in production for some time now! @babel/core is already at 5.1 mil downloads/month because of its usage in tools like Next.js 6, vue-cli 3.0, React Native 0.56, and even WordPress.com's frontend 🙂! Babel's Role​ I'd like to start this post by re-introducing Babel's role in the JavaScript ecosystem over the last few years. The initial issue was that unlike server languages, there was no way to guarantee that every user has the same support for JavaScript because users could be using different browsers with varying levels of support (especially older versions of Internet Explorer). If developers wanted to use new syntax (e.g. class A {}), users on old browsers would just get a blank screen due to the SyntaxError. Babel provided a way for developers to use the latest JavaScript syntax while allowing them to not worry about how to make it backwards compatible for their users by translating it (class A {} to var A = function A() {}). Because of its ability to transform JavaScript code, it also can be used to implement new features: thus it has become a bridge to help TC39 (the committee that specifies the JavaScript language) get feedback on proposed JavaScript ideas and for the community to have a say in the future of the language. Babel is fundamental to JavaScript development today. There are currently over 1.3 million dependent repos on GitHub, 17 million downloads on npm per month, and hundreds of users including many major frameworks (React, Vue, Ember, Polymer), and companies (Facebook, Netflix, Airbnb). It has become such a foundation for JavaScript development that many people don't even know that it is being used. Even if you aren't using it yourself, it's highly likely your dependencies are using Babel. Maintainers are People​ Babel has a huge influence on not just the future of the language itself but its community and ecosystem as well. But even with all of this responsibility, Babel is just a community driven project by a couple of volunteers. It was only just this past year some of the team were able to meet for the first time in person: The original @babeljs team, at last together. From left to right: @left_pad, @jamiebuilds, @sebmck, yours truly, and @loganfsmyth pic.twitter.com/XfPj6OhZfA— Amjad Masad (@amasad) May 3, 2018 As much as this is an announcement post, I'd like to take the opportunity to remind everyone of the state of this project. I myself joined a few months before the 6.0 release, which had its own amount of controversy and backlash. Much of the reception there led to existing maintainer burnout (including Sebastian, Babel's creator) and a few of us that were left took on the reins. Like many maintainers, we accidentally stumbled into the role. Many of us didn't have any formal training into how compilers worked or how to maintain an open source project. Ironically, I even purposely avoided majoring in Computer Science in college because I didn't want to take classes on compilers or anything low level because it seemed uninteresting and difficult. Yet I found myself drawn to tooling, linters, Babel, and JavaScript as a language. I'd like to encourage everyone to look into the open source projects that you depend on and to support them (both with time and monetary support if possible). Many maintainers aren't inherently experts in the things they work on; and there is much to be accomplished from just starting the work first. You will come in with both curiosity and humility, both of which are great attributes to have as a maintainer. My desire is a hope for the vision of the project versus just all of us doing "tasks". Babel isn't a company, or an open source team at a major company like Facebook. There's only a handful of volunteers working on Babel, and it's only been a few months since I took the leap to leave my job and be the only one so far to work on open source full time. But people can come and go, have lives outside of this "hobby", raise families, move on to different things, switch jobs or are looking for jobs, etc. Are we collectively doing what we can to sustain the things that are so fundamental to how we work, or are we going to allow the foundations to slowly crumble? How do we keep open source welcoming and inclusive but with clear boundaries? Can we learn from the experiences of other maintainers? Although Open Source has clearly taken over software, can we really consider it to be in a healthy state without taking into account the people behind it? #BabelSponsorsEverything​ Tips 4 @babeljs at @ReactRally #BabelSponsorsEverything pic.twitter.com/WCxefMOC8V— Harry Wolff (@hswolff) August 17, 2018 Open Source sustainability feels like giving out an offering basket at the moment. It's not difficult to state the value that projects provide to the thousands of people and companies using open source, but yet we don't see that value being shown to the few that are willing to put in the work. There can be so many ways to support open source and yet not all approaches work for each project or people. Now let's go to the changes!! Major Breaking Changes​ We are documenting these in our Migration Guide. Many of these changes can be done automatically with our new babel-upgrade tool, or can be added in the future. Drop support for un-maintained Node versions: 0.10, 0.12, 4, 5 (details) Move us to the @babel namespace by switching to using "scoped" packages (details). This helps differentiate official packages, so babel-core becomes @babel/core (and no squatting) Remove (and stop publishing) any yearly presets (preset-es2015, etc) (details). @babel/preset-env replaces the need for these as it includes all yearly additions as well as the ability to target a specific set of browsers Also drop the "Stage" presets (@babel/preset-stage-0, etc) in favor of opting into individual proposals. Similarly remove proposals from @babel/polyfill by default (details). Please consider reading the whole post on this for more explanation. Some packages have renames: any TC39 proposal plugin will now be -proposal instead of -transform (details). So @babel/plugin-transform-class-properties becomes @babel/plugin-proposal-class-properties. Introduce a peerDependency on @babel/core for certain user-facing packages (e.g. babel-loader, @babel/cli, etc) (details) babel-upgrade​ babel-upgrade is a new tool we've started that tries to automatically make upgrade changes: currently with dependencies in package.json and .babelrc config. We recommend running it directly on a git repo with npx babel-upgrade, or you can install it globally with npm i babel-upgrade -g. If you'd like to modify the files, you can pass --write as well as --install. Shellnpx babel-upgrade --write --install Please considering contributing by reporting issues or PRs to help everyone transition to Babel 7! A hope for the future is that we use this same tool for all future breaking changes and create a bot to PR projects to update. JavaScript Config Files​ We are introducing babel.config.js. It isn't a requirement or even a replacement for .babelrc, but having this may be useful in certain cases. *.js configuration files are fairly common in the JavaScript ecosystem. ESLint and Webpack both allow for .eslintrc.js and webpack.config.js configuration files, respectively. Below is the case of only compiling with a plugin in "production" (you can do this already with the "env" option in a .babelrc file): JavaScriptvar env = process.env.NODE_ENV;module.exports = { plugins: [ env === "production" && "babel-plugin-that-is-cool" ].filter(Boolean)}; babel.config.js has a different config resolution than a .babelrc. It will always resolve the config from that file versus originally when Babel would do a lookup from each file upward until it found a config. This makes it possible to take advantage of the next feature posted below, overrides. Selective Configuration with overrides​ Recently, I published a post with thoughts on both publishing ES2015+ packages and also consuming/compiling them. There's a section that goes into using a new key in Babel's config called overrides which allows you to specify different configs per glob. JavaScriptmodule.exports = { presets: [ // default config... ], overrides: [{ test: ["./node_modules"], presets: [ // config for node_modules ], }, { test: ["./tests"], presets: [ // config for tests ], }]}; This allows an application that requires different compilation configs for its tests, client code, and server code to skip needing to create a new .babelrc file per folder. Speed 🏎​ Babel itself is faster so it should take less time to build! We've made a lot of changes to optimize the code as well as accept patches from the v8 team. We're glad to be a part of the Web Tooling Benchmark alongside many other great JavaScript tools. Output Options​ Babel has supported preset and plugin options for some time now. To recap you can wrap the plugin in an array and pass an options object to the plugin: { "plugins": [- "pluginA",+ ["pluginA", {+ // options here+ }], ]} We've made some changes to the loose option of some plugins and added some new options for others! Note by using these options you are opting into non-spec compliant behavior and should know what you are doing; this can become an issue when you switch off of compiling to use the syntax natively. These kinds of options are best used in a library, if at all. For classes, class A {} will now not include the classCallCheck helper. JavaScriptclass A {} var A = function A() {- _classCallCheck(this, A);}; There is a new option if every use of a for-of loop is just an array: ["transform-for-of", { "assumeArray": true }] JavaScriptlet elm;for (elm of array) { console.log(elm);} JavaScriptlet elm;for (let _i = 0, _array = array; _i < _array.length; _i++) { elm = _array[_i]; console.log(elm);} We exclude the transform-typeof-symbol plugin in loose mode for preset-env #6831 We've found a lot of libraries doing this already, so we decided to do this by default. Note that the default behavior is to be as spec compliant as possible so that switching off of Babel or using preset-env is seamless vs. allowing smaller output just to save bytes (there's a tradeoff there that each project can make). We plan to work on better docs and tooling to make that easier. "Pure" Annotation Support​ After #6209, transpiled ES6 classes are annotated with a /*#__PURE__*/ comment that allows gives a hint to minifiers like Uglify and babel-minify for dead code elimination. These annotations are added to other helper functions as well. JavaScriptclass C { m() {}} JavaScriptvar C =/*#__PURE__*/function () { // ...}(); There might be more opportunities for minifier hints and optimizations, let us know! Syntax​ TC39 Proposals Support​ I'd like to re-iterate that we've removed the Stage presets in favor of a policy of asking users to explicitly opt-in to proposals < Stage 4. The concern is that we are automatically opting people into syntax that is not fixed or done with the expectation that it will not change. But this is not the case, especially for proposals that are Stage 0 or 1. This post explains a bit on the kind of thinking behind newer ideas. Here's a small listing of some of the new syntax Babel supports (keep in mind this feature set is a moving target that could be added/removed/stalled) and which ones have been added in v7: ES2018: Object Rest Spread (var a = { b, ...c }) ES2018 (new): Unicode Property Regex ES2018 (new): JSON Superset ES2015 (new): new.target Stage 3 (new): Class Private Instance Fields (class A { #b = 2 }) Stage 3 (WIP): Static Class Fields, Private Static Methods (class A { static #a() {} }) Stage 3 (new): Optional Catch Binding try { throw 0 } catch { do() } Stage 3 (new): BigInt (syntax only) Stage 3: Dynamic Import (import("a")) Stage 2 (new): import.meta (syntax only) (import.meta.url) Stage 2 (new): Numeric Separators (1_000) Stage 2 (new): function.sent Stage 2: export-namespace-from (export * as ns from 'mod'), split from export-extensions Stage 2: Decorators. Check below for an update on our progress! Stage 1: export-default-from (export v from 'mod'), split from export-extensions Stage 1 (new): Optional Chaining (a?.b) Stage 1 (new): Logical Assignment Operators (a &&= b; a ||= b) Stage 1 (new): Nullish Coalescing Operator (a ?? b) Stage 1 (new): Pipeline Operator (a |> b) Stage 1 (new): Throw Expressions (() => throw new Error("a")) It's hard for anyone to keep track of all the proposals, so we attempt to do that at babel/proposals. TypeScript Support (@babel/preset-typescript)​ We worked with the TypeScript team on getting Babel to parse/transform type syntax with @babel/preset-typescript, similar to how we handle Flow with @babel/preset-flow. For more details check out this post from the TypeScript team! Before (with types): interface Person { firstName: string; lastName: string;}function greeter(person : Person) { return "Hello, " + person.firstName + " " + person.lastName;} After (types removed): function greeter(person) { return "Hello, " + person.firstName + " " + person.lastName;} Both Flow and Typescript are tools that enable JavaScript users to take advantage of gradual typing, and we'd like to enable both in Babel. We plan on continuing to work closely with both of their respective teams at FB and Microsoft (in addition to the community-at-large) to maintain compatibility and support new features. This integration is fairly new, so it's possible some syntax isn't supported fully. We'd appreciate your help in reporting issues and maybe sending a PR! JSX Fragment Support (<>)​ As mentioned in the React Blog, JSX Fragment support has been available as of beta.31. JSXrender() { return ( <> <ChildA /> <ChildB /> </> );}// output 👇render() { return React.createElement( React.Fragment, null, React.createElement(ChildA, null), React.createElement(ChildB, null) );} Babel Helpers Changes​ The babel-upgrade PR is in progress @babel/runtime has been split up into @babel/runtime and @babel/runtime-corejs2 (PR). The former only contains Babel's helper functions and the latter contains'''
