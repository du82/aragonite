title = "@babel/preset-react · Babel"
description = "This preset always includes the following plugins:"
full_description = '''Presets@babel/preset-reactOn this page@babel/preset-reactThis preset always includes the following plugins: @babel/plugin-syntax-jsx @babel/plugin-transform-react-jsx @babel/plugin-transform-react-display-name And with the development option: Classic runtime adds: @babel/plugin-transform-react-jsx-self @babel/plugin-transform-react-jsx-source Automatic runtime (since v7.9.0) adds the functionality for these plugins automatically when the development option is enabled. If you have automatic runtime enabled, adding @babel/plugin-transform-react-jsx-self or @babel/plugin-transform-react-jsx-source will error. Note: Flow syntax support is no longer enabled in v7. For that, you will need to add the Flow preset. Installation​ You can also check out the React Getting Started page npmYarnpnpmnpm install --save-dev @babel/preset-reactyarn add --dev @babel/preset-reactpnpm add --save-dev @babel/preset-react Usage​ With a configuration file (Recommended)​ Without options: babel.config.json{ "presets": ["@babel/preset-react"]} With options: babel.config.json{ "presets": [ [ "@babel/preset-react", { "pragma": "dom", // default pragma is React.createElement (only in classic runtime) "pragmaFrag": "DomFrag", // default is React.Fragment (only in classic runtime) "throwIfNamespace": false, // defaults to true "runtime": "classic" // defaults to classic // "importSource": "custom-jsx-library" // defaults to react (only in automatic runtime) } ] ]} Via CLI​ Shellbabel --presets @babel/preset-react script.js Via Node API​ JavaScriptrequire("@babel/core").transformSync("code", { presets: ["@babel/preset-react"],}); Options​ Both Runtimes​ runtime​ classic | automatic, defaults to classic Added in: v7.9.0 Note: The default runtime will be switched to automatic in Babel 8. Decides which runtime to use. automatic auto imports the functions that JSX transpiles to. classic does not automatic import anything. development​ boolean, defaults to false. This toggles behavior specific to development, such as adding __source and __self. This is useful when combined with the env option configuration or js config files. throwIfNamespace​ boolean, defaults to true. Toggles whether or not to throw an error if a XML namespaced tag name is used. For example: Though the JSX spec allows this, it is disabled by default since React's JSX does not currently have support for it. pure​ boolean, defaults to true. Enables @babel/plugin-transform-react-pure-annotations. It will mark top-level React method calls as pure for tree shaking. React Automatic Runtime​ importSource​ string, defaults to react. Added in: v7.9.0 Replaces the import source when importing functions. React Classic Runtime​ pragma​ string, defaults to React.createElement. Replace the function used when compiling JSX expressions. It should be a qualified name (e.g. React.createElement) or an identifier (e.g. createElement). pragmaFrag​ string, defaults to React.Fragment. Replace the component used when compiling JSX fragments. It should be a valid JSX tag name. useBuiltIns​ boolean, defaults to false. warningThis option will be removed in Babel 8. Set useBuiltIns to true if you are targeting to modern browsers. Will use the native built-in instead of trying to polyfill behavior for any plugins that require one. useSpread​ boolean, defaults to false. Added in: v7.7.0 warningThis option will be removed in Babel 8. Set useSpread to true if you are targeting to modern browsers. When spreading props, use inline object with spread elements directly instead of Babel's extend helper or Object.assign. babel.config.js​ babel.config.jsmodule.exports = { presets: [ [ "@babel/preset-react", { development: process.env.BABEL_ENV === "development", }, ], ],}; babel.config.json​ Note: the env option will likely get deprecated soon babel.config.json{ "presets": ["@babel/preset-react"], "env": { "development": { "presets": [["@babel/preset-react", { "development": true }]] } }} You can read more about configuring preset options here Edit this page'''
