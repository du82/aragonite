["https://babeljs.io/blog/2015/02/23/babel-loves-react"]
title = "Babel <3 React · Babel"
description = "One of the things that surprises people quite often is that Babel supports JSX"
full_description = '''Babel <3 ReactFebruary 23, 2015 · 2 min readJames KyleOne of the things that surprises people quite often is that Babel supports JSX out of the box. Let me show you just how easy it is to switch: Note: There are tons of ways to use Babel, I'll only list a few of them here. If you'd like to see a more complete list check out our Using Babel page. In the Browser (docs) Before: <script type='text/jsx'></script> After: <script type='text/babel'></script> In Browserify (docs) Before: Shell$ browserify -t reactify main.js After: Shell$ browserify -t babelify main.js In Node (docs) Before: JavaScriptrequire('node-jsx').install(); After: JavaScriptrequire('babel/register'); In Webpack (docs) Before: JavaScriptloaders: [ { test: /\.js$/, exclude: /node_modules/, loader: 'jsx-loader'}] After: JavaScriptloaders: [ { test: /\.js$/, exclude: /node_modules/, loader: 'babel-loader'}] In Gulp (docs) Before: JavaScriptgulp.src('views/**/*.js') .pipe(jsx()) .pipe(gulp.dest('dist')); After: JavaScriptgulp.src('views/**/*.js') .pipe(babel()) .pipe(gulp.dest('dist')); The list goes on, but you probably get how simple it is by now. If you didn't see the tool you are looking for don't worry we have a full list of them on our Using Babel page. If you need more help getting setup be sure to read our JSX docs or come ask other Babel users in our support chat. — The Babel team'''
