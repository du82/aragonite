["https://babeljs.io/docs/v7-migration"]
title = "Upgrade to Babel 7 · Babel"
description = "Refer users to this document when upgrading to Babel 7. Check here for API/integration changes."
full_description = '''GuidesUpgrade to Babel 7On this pageUpgrade to Babel 7Refer users to this document when upgrading to Babel 7. Check here for API/integration changes. Because not every breaking change will affect every project, we've sorted the sections by the likelihood of a change breaking tests when upgrading. All of Babel​ Support for Node.js 0.10, 0.12, 4 and 5 has been dropped #5025, #5041, #7755, #5186 We highly encourage you to use a newer version of Node.js (LTS v8) since the previous versions are not maintained. See nodejs/LTS for more information. This just means Babel itself won't run on older versions of Node. It can still output code that runs on old Node versions. Config Lookup Changes​ For more info, read our 6.x vs 7.x comparison. Babel has had issues previously with handling node_modules, symlinks, and monorepos. We've made some changes to account for this: Babel will stop lookup at the package.json boundary instead of looking up the chain. For monorepos we have added a new babel.config.js file that centralizes our config across all the packages (alternatively you could make a config per package). In 7.1, we've introduced a rootMode option for further lookup if necessary. Yearly Preset Deprecations​ The "env" preset has been out for more than a year now, and completely replaces some of the presets we've had and suggested earlier. babel-preset-es2015 babel-preset-es2016 babel-preset-es2017 babel-preset-latest A combination of the above ^ These presets should be substituted with the "env" preset. Stage Preset Deprecations​ We are removing the stage presets in favor of explicit proposal usage. Can check the stage-0 README for more migration steps. To do this automatically you can run npx babel-upgrade (PR added here). Remove proposal polyfills in @babel/polyfill​ Based on similar thinking, we have removed the polyfill proposals from @babel/polyfill. Right now @babel/polyfill is mostly just an alias of core-js v2. Source Before it used to just be 2 imports: JavaScriptimport "core-js/shim"; // included < Stage 4 proposalsimport "regenerator-runtime/runtime"; If you want to use proposals, you will need to import these independently. You should import them directly from the core-js package or another package on npm. e.g. JavaScript// for core-js v2:import "core-js/fn/array/flat-map";// for core-js v3:import "core-js/features/array/flat-map"; Below is a list of Stage < 3 proposal polyfills in core-js v2. DetailsJavaScript// core-js v2// Stage 3import "core-js/fn/string/trim-left";import "core-js/fn/string/trim-right";import "core-js/fn/string/match-all";import "core-js/fn/array/flat-map";import "core-js/fn/array/flatten"; // RENAMEDimport "core-js/fn/global";// Stage 1import "core-js/fn/symbol/observable";import "core-js/fn/promise/try";import "core-js/fn/observable";// Stage 1 Math Extensionsimport "core-js/fn/math/clamp";import "core-js/fn/math/deg-per-rad";import "core-js/fn/math/degrees";import "core-js/fn/math/fscale";import "core-js/fn/math/iaddh";import "core-js/fn/math/isubh";import "core-js/fn/math/imulh";import "core-js/fn/math/rad-per-deg";import "core-js/fn/math/radians";import "core-js/fn/math/scale";import "core-js/fn/math/umulh";import "core-js/fn/math/signbit";// Stage 1 "of and from on collection constructors"import "core-js/fn/map/of";import "core-js/fn/set/of";import "core-js/fn/weak-map/of";import "core-js/fn/weak-set/of";import "core-js/fn/map/from";import "core-js/fn/set/from";import "core-js/fn/weak-map/from";import "core-js/fn/weak-set/from";// Stage 0import "core-js/fn/string/at";// Nonstandardimport "core-js/fn/object/define-getter";import "core-js/fn/object/define-setter";import "core-js/fn/object/lookup-getter";import "core-js/fn/object/lookup-setter";// import "core-js/fn/map/to-json"; // Not available standalone// import "core-js/fn/set/to-json"; // Not available standaloneimport "core-js/fn/system/global";import "core-js/fn/error/is-error";import "core-js/fn/asap";// Decorator metadata? Not sure of stage/proposalimport "core-js/fn/reflect/define-metadata";import "core-js/fn/reflect/delete-metadata";import "core-js/fn/reflect/get-metadata";import "core-js/fn/reflect/get-metadata-keys";import "core-js/fn/reflect/get-own-metadata";import "core-js/fn/reflect/get-own-metadata-keys";import "core-js/fn/reflect/has-metadata";import "core-js/fn/reflect/has-own-metadata";import "core-js/fn/reflect/metadata"; Versioning/Dependencies​ Most plugins/top level packages now have a peerDependency on @babel/core. Package Renames​ babylon is now @babel/parser You can still use the shorthand version of a package name (remove the preset- or plugin-) in the config, but I'm choosing to use the whole package name for clarity (maybe we should just remove that, given it doesn't save that much typing anyway). {- "presets": ["@babel/preset-react"],+ "presets": ["@babel/react"], // this is equivalent- "plugins": ["@babel/transform-runtime"],+ "plugins": ["@babel/plugin-transform-runtime"], // same} Scoped Packages​ The most important change is finally switching all packages to scoped packages (the folder names in the monorepo are not changed but the name in its package.json is). This means there will be no more issues with accidental/intentional name squatting, a clear separation from community plugins, and a simpler naming convention. Your dependencies will need to be modified like so: babel-cli -> @babel/cli. For us, we basically started by replacing babel- with @babel/. Use in the config​ You can still use the shorthand way of specifying a preset or plugin. However because of the switch to scoped packages, you still have to specify the @babel/ just like if you had your own preset to add to the config. babel.config.jsmodule.exports = { presets: ["@babel/env"], // "@babel/preset-env" plugins: ["@babel/transform-arrow-functions"], // same as "@babel/plugin-transform-arrow-functions"}; Switch to -proposal- for TC39 Proposals​ This means any plugin that isn't in a yearly release (ES2015, ES2016, etc) should be renamed to -proposal. This is so we can better signify that a proposal isn't officially in JavaScript. Examples: @babel/plugin-transform-function-bind is now @babel/plugin-proposal-function-bind (Stage 0) @babel/plugin-transform-class-properties is now @babel/plugin-proposal-class-properties (Stage 3) This also means that when a proposal moves to Stage 4, we should rename the package. Remove the year from package names​ Some of the plugins had -es3- or -es2015- in the names, but these were unnecessary. @babel/plugin-transform-es2015-classes became @babel/plugin-transform-classes. "use strict" and this in CommonJS​ Babel 6's transformations for ES6 modules ran indiscriminately on whatever files it was told to process, never taking into account if the file actually had ES6 imports/exports in them. This had the effect of rewriting file-scoped references to this to be undefined and inserting "use strict" at the top of all CommonJS modules that were processed by Babel. JavaScript// input.jsthis; JavaScript// output.js v6"use strict"; // assumed strict modulesundefined; // changed this to undefined JavaScript// output.js v7this; This behavior has been restricted in Babel 7 so that for the transform-es2015-modules-commonjs transform, the file is only changed if it has ES6 imports or exports in the file. (Editor's note: This may change again if we land https://github.com/babel/babel/issues/6242, so we'll want to revisit this before publishing). JavaScript// input2.jsimport "a"; JavaScript// output.js v6 and v7"use strict";require("a"); If you were relying on Babel to inject "use strict" into all of your CommonJS modules automatically, you'll want to explicitly use the transform-strict-mode plugin in your Babel config. Separation of the React and Flow presets​ babel-preset-react has always included the flow plugin. This has caused a lot of issues with users that accidentally use flow syntax unintentionally due to a typo, or adding it in without typechecking with flow itself, resulting in errors. This issue was compounded when we decided to support TypeScript. If you wanted to use the React and TypeScript presets, we would have to figure out a way to turn on/off the syntax, automatically, via file type or the directive. In the end, it was easier to separate the presets entirely. Presets enable Babel to parse types provided by Flow / TypeScript (and other dialects / languages), then strip them out when compiling down to JavaScript. {- "presets": ["@babel/preset-react"]+ "presets": ["@babel/preset-react", "@babel/preset-flow"] // parse & remove flow types+ "presets": ["@babel/preset-react", "@babel/preset-typescript"] // parse & remove typescript types} Option parsing​ Babel's config options are stricter than in Babel 6. Where a comma-separated list for presets, e.g. "presets": 'es2015, es2016' technically worked before, it will now fail and needs to be changed to an array #5463. Note this does not apply to the CLI, where --presets es2015,es2016 will certainly still work. {- "presets": "@babel/preset-env, @babel/preset-react"+ "presets": ["@babel/preset-env", "@babel/preset-react"]} Plugin/Preset Exports​ All plugins/presets should now export a function rather than an object for consistency (via babel/babel#6494). This will help us with caching. Resolving string-based config values​ In Babel 6, values passed to Babel directly (not from a config file), were resolved relative to the files being compiled, which led to lots of confusion. In Babel 7, values are resolved consistently either relative to the config file that loaded them, or relative to the working directory. For presets and plugins values, this change means that the CLI will behave nicely in cases such as Shellbabel --presets @babel/preset-env ../file.js Assuming your node_modules folder is in ., in Babel 6 this would fail because the preset could not be found. This change also affects only and ignore which will be expanded on next. Path-based only and ignore patterns​ In Babel 6, only and ignore were treated as a general matching string, rather than a filepath glob. This meant that for instance *.foo.js would match ./**/*.foo.js, which was confusing and surprising to most users. In Babel 7, these are now treated as path-based glob patterns which can either be relative or absolute paths. This means that if you were using these patterns, you'll probably need to at least add a **/ prefix to them now to ensure that your patterns match deeply into directories. only and ignore patterns do still also work for directories, so you could also use only: './tests' to only compile files in your tests directory, with no need to use **/*.js to match all nested files. Babel's CLI commands​ The --copy-files argument for the babel command, which tells Babel to copy all files in a directory that Babel doesn't know how to handle, will also now copy files that failed an only/ignore check, where before it would silently skip all ignored files. @babel/node​ The babel-node command in Babel 6 was part of the babel-cli package. In Babel 7, this command has been split out into its own @babel/node package, so if you are using that command, you'll want to add this new dependency. @babel/runtime, @babel/plugin-transform-runtime​ We have separated out Babel's helpers from its "polyfilling" behavior in runtime. More details in the PR. @babel/runtime now only contains the helpers, and if you need core-js you can use @babel/runtime-corejs2 and the option provided in the transform. For both you still need the @babel/plugin-transform-runtime Only Helpers​ Shell# install the runtime as a dependencynpm install @babel/runtime# install the plugin as a devDependencynpm install @babel/plugin-transform-runtime --save-dev babel.config.json{ "plugins": ["@babel/plugin-transform-runtime"]} Helpers + polyfilling from core-js​ So if you need core-js support with transform-runtime, you would now pass the corejs option and use the @babel/runtime-corejs2 dependency instead of @babel/runtime. Shell# install the runtime as a dependencynpm install @babel/runtime-corejs2# install the plugin as a devDependencynpm install @babel/plugin-transform-runtime --save-dev { "plugins": [- ["@babel/plugin-transform-runtime"],+ ["@babel/plugin-transform-runtime", {+ "corejs": 2,+ }], ]} Spec Compliancy​ @babel/plugin-proposal-object-rest-spread​ A trailing comma cannot come after a RestElement in objects #290 var {- ...y, // trailing comma is a SyntaxError+ ...y} = { a: 1 }; Since Object Spread defines new properties and Object.assign just sets them, Babel has changed the default behavior to be more spec compliant. objectSpread helper function extends helper function JavaScript// inputz = { x, ...y }; JavaScript// v7 default behavior: ["proposal-object-rest-spread"]function _objectSpread(target) { ... }z = _objectSpread({ x}, y); JavaScript// Old v6 behavior: ["proposal-object-rest-spread", { "loose": true }]function _extends(target) { ... }z = _extends({ x}, y); JavaScript// Substitute for Object.assign: ["proposal-object-rest-spread", { "loose": true, "useBuiltIns": true }]z = Object.assign( { x, }, y); @babel/plugin-proposal-class-properties​ The default behavior is changed to what was previously "spec" by default JavaScript// inputclass Bork { static a = "foo"; y;} JavaScript// v7 default behavior: ["@babel/plugin-proposal-class-properties"]var Bork = function Bork() { Object.defineProperty(this, "y", { enumerable: true, writable: true, value: void 0, });};Object.defineProperty(Bork, "a", { enumerable: true, writable: true, value: "foo",}); JavaScript// old v6 behavior: ["@babel/plugin-proposal-class-properties", { "loose": true }]var Bork = function Bork() { this.y = void 0;};Bork.a = "foo"; Split @babel/plugin-transform-export-extensions into the two renamed proposals​ This is a long time coming but this was finally changed. @babel/plugin-proposal-export-default-from JavaScriptexport v from "mod"; @babel/plugin-proposal-export-namespace-from JavaScriptexport * as ns from "mod"; @babel/plugin-transform-template-literals​ Template Literals Revision updated #5523 See the proposal for Template Literals Revision. It causes Babel 6 to throw Bad character escape sequence (5:6). JavaScripttag`\unicode and \u{55}`; This has been fixed in Babel 7 and generates something like the following: JavaScript// defaultfunction _taggedTemplateLiteral(strings, raw) { return Object.freeze( Object.defineProperties(strings, { raw: { value: Object.freeze(raw) } }) );}var _templateObject = /*#__PURE__*/ _taggedTemplateLiteral( [void 0], ["\\unicode and \\u{55}"]);tag(_templateObject); JavaScript// loose modefunction _taggedTemplateLiteralLoose(strings, raw) { strings.raw = raw; return strings;}var _templateObject = /*#__PURE__*/ _taggedTemplateLiteralLoose( [void 0], ["\\unicode and \\u{55}"]);tag(_templateObject); Default to previous "spec" mode for regular template literals JavaScript// input`foo${bar}`; JavaScript// default v7 behavior: ["@babel/p'''
