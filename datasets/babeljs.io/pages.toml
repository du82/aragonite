["https://babeljs.io/blog/2017/09/12/planning-for-7.0"]
title = "Planning for 7.0 · Babel"
description = "If you didn't know already, we're planning on releasing a 7.0 version soon 🙌 ! Work on it actually started back in February, when I just wanted to make a release to drop Node 0.10/0.12 support and remove babel-runtime and various other code. And since then, we've done releases up to alpha.20."
full_description = '''Planning for 7.0September 12, 2017 · 20 min readHenry ZhuIf you didn't know already, we're planning on releasing a 7.0 version soon 🙌 ! Work on it actually started back in February, when I just wanted to make a release to drop Node 0.10/0.12 support and remove babel-runtime and various other code. And since then, we've done releases up to alpha.20. We're going to update this post throughout the beta releases Since we're still just a volunteer project, it's been difficult for most of the team to stay focused and motivated to make all these changes and continue to maintain a project that so many companies, bootcamps, and tools rely on so much. But in the meantime we've made a lot of progress: weekly meetings/notes, participating as invited guests at TC39 for the last few meetings, facilitating in both RGSoC and GSoC, and creating an Open Collective. Upgrading​ Upgrading for most projects should be as simple as updating your package.json deps to 7.0.0-beta.0. For the whole time we've been working on 7.0, we've been using it in Babel itself (so meta) and at my workplace at Behance. We will be pinning all dependencies to exact versions until the official release. { "devDependencies": { "babel-cli": "7.0.0-beta.0" }} Specific packages: Detailsbabel packages in the monorepo should all be >= 7.0.0-beta.0 babel-preset-env should be at least 2.0.0-beta.0 babel-eslint can be >= 8.0.0 babel-loader should be >= 7.0.0 (out of beta since it uses babel-core as a peerDependency) grunt-babel can be >= 7.0.0 gulp-babel can be >= 7.0.0 rollup-plugin-babel can be >= 3.0.2 Please check out our upgrade guide and other guide specifically for tool authors which we will also be updating as necessary. I'd like to go over some notable changes for our first beta release (it's still a lot smaller in scope in terms of breaking changes than the previous 6.0 release). Re-iterating Project Goals​ Before we go into that, I just want to repeat again what the purpose of Babel is. Since Babel has been renamed from 6to5, browsers have been implementing more of the spec and users are more comfortable with using the latest syntax/build tooling. It shouldn't be surprisingly however that Babel's goals haven't changed much. Our two goals are hand in hand: Help developers transform new syntax into backwards compatible code (abstract browser support away) Be a bridge to help TC39 get feedback on new ECMAScript proposals and for the community to have a say in the future of the language. Thus, I think it's an understatement to say that Babel is a vital part of the JavaScript community (almost 10 million downloads a month of babel-core) and sorely needs its support. (The only talks I've tried to give are about this point: JSConf EU, React Rally, TC39). I said recently: "What happens if Babel dies"? What happens when the current group of people interested in this project get bored/burned out/move on to other things? (What if it's already happened?). Are we going to do something about it? I don't want to just ask you to help us, you already are us as users of the project. Ok then, let's talk about some changes! Drop Support for Unmaintained Node Versions: 0.10, 0.12, 5 (#4315)​ Progress in OSS projects often comes at the cost of upgrading for its users. Because of this, we've always been hesitant in making the choice to introduce a major version bump/breaking changes. By dropping unsupported versions of Node, we can not only make a number of improvements to the codebase, but also upgrade dependencies and tools (ESLint, Yarn, Jest, Lerna, etc). 👓 Proposal Updates/Spec Compliancy​ AKA the only things most of you care about 😅 Philosophy (Proposals: spec, loose, default behavior)​ We've created a new repo: babel/proposals to track our progress on the various TC39 Proposals and meetings. I also added a section about how we accept new proposals. Our basic thinking is that we will start accepting PRs for anything a TC39 champion is going to present (Stage 0). And we will update them (with your help!) when the spec changes. Naturally, we will take the opportunity to be as spec compliant as possible (within reasonable speed, etc) as the default behavior. This means if you need a faster/smaller build, you should use the loose option which will purposely disregard certain spec changes like runtime checks and other edge cases. The reason why it is opt-in is because we expect you should know what you are doing, while others should be able to seamlessly upgrade babel-preset-env to use the native version of each syntax or stop using Babel entirely and have no issues. Stage 3: Class Properties (from Stage 2)​ babel-plugin-transform-class-properties: the default behavior is now what was previously the "spec" option, which uses Object.defineProperty instead of simple assignment. This currently has the effect of breaking the legacy decorators plugin (which we made the "transform-decorators" plugin in 7.0) if you try to decorate a class property. You'll need to use the loose option to be compatible with the version of decorators in the transform until we release the Stage 2 decorators plugin. Private fields are WIP: #6120 Input JavaScriptclass Bork { static a = 'foo'; x = 'bar';} Output (default) JavaScriptclass Bork { constructor() { Object.defineProperty(this, "x", { configurable: true, enumerable: true, writable: true, value: 'bar' }); }};Object.defineProperty(Bork, "a", { configurable: true, enumerable: true, writable: true, value: 'foo'}); Output (loose mode) JavaScriptclass Bork { constructor() { this.x = 'bar'; }};Bork.a = 'foo'; Stage 3: Object Rest Spread (from Stage 2)​ babel-plugin-transform-object-rest-spread: And now the plugin handles non-string keys (ex: Number/Symbol) Input JavaScript// Rest Propertieslet { x, y, ...z } = { x: 1, y: 2, a: 3, b: 4 };console.log(x); // 1console.log(y); // 2console.log(z); // { a: 3, b: 4 }// Spread Propertieslet n = { x, y, ...z };console.log(n); // { x: 1, y: 2, a: 3, b: 4 } Also disallowed JavaScriptvar { ...{ x } } = obj;var { ...[ y ] } = obj; Stage 3: Optional Catch Binding (new)​ babel-plugin-transform-optional-catch-binding: allow developers to use try/catch without creating an unused binding. Input JavaScripttry { throw 0;} catch { doSomethingWhichDoesNotCareAboutTheValueThrown();} Output JavaScripttry { throw 0;} catch (_unused) { doSomethingWhichDoesNotCareAboutTheValueThrown();} Stage 3: Unicode Property Regex (new)​ babel-plugin-transform-unicode-property-regex: compile Unicode property escapes (\p{…} and \P{…}) in Unicode regular expressions to ES5 or ES6 that works in today’s environments. Input JavaScriptvar regex = /\p{ASCII_Hex_Digit}/u; Output JavaScriptvar regex = /[0-9A-Fa-f]/; Stage 3: BigInt (new, unfinished)​ babel-plugin-transform-bigint: #6015. This won't be included in the Stage presets because it would be slow to wrap all operators. Input JavaScript50000n + 60n; Output JavaScriptimport babelCheckBinaryExpressions from "babel-check-binary-expressions";babelCheckBinaryExpressions(new BigInt("50000"), new BigInt("60"), "+"); Stage 3: Dynamic Import (from Stage 2)​ babel-plugin-syntax-dynamic-import: You only need to parse the syntax since tools like Webpack can handle the transformation in place of Babel. There is also a plugin for Node Input JavaScriptconst testModule = import('test-module'); Stage 2: import.meta (syntax only)​ A meta property that is only syntactically valid in modules, meant for meta-information about the currently running module provided by the host environment. Input JavaScriptconst size = import.meta.scriptElement.dataset.size || 300; Stage 2: Numeric Separators (new)​ babel-plugin-transform-numeric-separator: make numeric literals more readable by creating a visual separation (a _) between groups of digits. Input JavaScript1_000_000_0000b1010_0001_1000_01010xA0_B0_C0 Output JavaScript10000000000b10100001100001010xA0B0C0 Stage 2: Decorators (from Stage 1), still WIP​ babel-plugin-transform-decorators: #6107 Disallowed JavaScript// no computed decorator keys@dec[foo]class A {}// no parameter decorators (a separate proposal)class Foo { constructor(@foo x) {}}// no decorators on object methodsvar o = { @baz foo() {}}// decorator cannot be attached to the export@fooexport default class {} Valid JavaScript// decorators with a call expression@foo('bar')class A { // decorators on computed methods @autobind [method](arg) {} // decorators on generator functions @deco *gen() {} // decorators with a member expression @a.b.c(e, f) m() {}}// exported decorator classesexport default @foo class {} Unsupported (WIP) JavaScript// decorated class propertiesclass A { @dec name = 0} Stage 2: function.sent (new)​ babel-plugin-transform-function-sent: compile the function.sent meta property, used inside generator functions Input JavaScriptfunction* generator() { console.log("Sent", function.sent); console.log("Yield", yield);}const iterator = generator();iterator.next(1); // Logs "Sent 1"iterator.next(2); // Logs "Yield 2" Output JavaScriptlet generator = _skipFirstGeneratorNext(function* () { const _functionSent = yield; console.log("Sent", _functionSent); console.log("Yield", yield);}); Stage 2: export-ns-from​ babel-plugin-transform-export-namespace: a shorthand to import/reexport a namespace. Split out from the old transform-export-extensions which combined this proposal with another Input JavaScriptexport * as ns from "mod"; Output JavaScriptimport * as ns from "mod";export {ns}; Stage 1: export-default-from​ babel-plugin-transform-export-default: a shorthand to import/reexport something. Split out from the old transform-export-extensions which combined this proposal with another Input JavaScriptexport v from "mod"; Output JavaScriptimport _v from "module";export { _v as v }; Stage 1: Optional Chaining (new)​ babel-plugin-transform-optional-chaining: the operator (?.) allows you to handle properties of deeply nested objects without worrying about undefined intermediate objects. Input JavaScripta?.b = 42; Output JavaScriptvar _a;(_a = a) == null ? void 0 : _a.b = 42; ES2015: new.target​ babel-plugin-transform-new-target: we never got around to implementing new.target support earlier, so now there is a plugin for it that will be included in the ES2015/env presets. Example JavaScript// with a functionfunction Foo() { console.log(new.target);}Foo(); // => undefinednew Foo(); // => Foo// with classesclass Foo { constructor() { console.log(new.target); }}class Bar extends Foo {}new Foo(); // => Foonew Bar(); // => Bar Input JavaScriptclass Foo { constructor() { new.target; } test() { new.target; }} Output JavaScriptclass Foo { constructor() { this.constructor; } test() { void 0; }} 🚀 New Feature​ .babelrc.js​ babel/babel#4630 *.js configuration files are fairly common in the JavaScript ecosystem. ESLint and Webpack both allow for .eslintrc.js and webpack.config.js configuration files, respectively. Writing configuration files in JavaScript allows for dynamic configuration, making it possible to write a single configuration file that can adapt to different environments programmatically. JavaScriptvar env = process.env.BABEL_ENV || process.env.NODE_ENV;var plugins = [];if (env === 'production') { plugins.push.apply(plugins, ["a-super-cool-babel-plugin"]);}module.exports = { plugins }; JavaScriptvar env = process.env.BABEL_ENV || process.env.NODE_ENV;module.exports = { plugins: [ env === 'production' && "another-super-cool-babel-plugin" ].filter(Boolean)}; This was previously done through the env configuration option, which is now deprecated. See below for more details. TypeScript​ You can now use babel-preset-typescript to allow Babel to strip types similar to how babel-preset-flow works! babel.config.json{ "presets": ["typescript"]} We're working on a guide for how to setup TypeScript and Babel with the TypeScript team, which should be finished before the official 7.0 release. TL;DR is that you setup TS with --noEmit or use it in the editor/watch mode so that you can use preset-env and other Babel plugins. "Pure" Annotation in specific transforms for minifiers​ After #6209, ES6 classes that are transpiled will have a /*#__PURE__*/ comment that minifiers like Uglify and babel-minify can use for dead code elimination. These annotations may expand to our helper functions as well. Input JavaScriptclass C { m(x) { return 'a'; }} Output JavaScriptvar C = /*#__PURE__*/ function () { function C() { _classCallCheck(this, C) } C.prototype.m = function m(x) { return 'a'; }; return C;}(); 😎 Other Breaking Changes​ Removed babel-preset-flow from babel-preset-react​ This was important because we got a lot of complaints from users that weren't using any types/flow that they ended up writing invalid JS but there was no syntax error because they used the react preset. Also we have the TypeScript preset now, so it didn't make sense to include flow in the react preset itself anymore. Integrations​ Packages like grunt-babel, gulp-babel, rollup-plugin-babel, etc all used to have babel-core as a dependency. After v7, we plan to move babel-core to be a peerDependency like babel-loader has. This lets all these packages not have to bump major versions when the babel-core API hasn't changed. Thus they are already published as 7.0.0 since we don't expect any further changes to those packages. Meta​ Remove babel-runtime from our own Babel dependencies (#5218)​ Babel itself doesn't have that many external dependencies, but in 6.x each package has a dependency on babel-runtime so that built-ins like Symbol, Map, Set, and others are available without needing a polyfill. By changing the minimum supported version of Node to v4 (where those built-ins are supported natively), we can drop the dependency entirely. This is an issue on npm 2 (we didn't recommended its use with Babel 6) and older yarn, but not npm 3 due to its deduping behavior. With Create React App the size of the node_modules folder changed drastically when babel-runtime was hoisted. node_modules for npm 3: ~120MB node_modules for Yarn (≤0.21.0): ~518MB node_modules for Yarn (≤0.21.0) with hoisted babel-runtime: ~157MB node_modules for Yarn + PR #2676: ~149MB (tweet) So although this issue has been fixed "upstream" by using npm >= 3/later Yarn, we can do our part by simply dropping our own dependency on babel-runtime. Independent Publishing of Experimental Packages (#5224)​ I mention this in The State of Babel in the Versioning section. Github Issue You might remember that after Babel 6, Babel became a set of npm packages with its own ecosystem of custom presets and plugins. However since then, we've always used a "fixed/synchronized" versioning system (so that no package is on v7.0 or above). When we do a new release such as v6.23.0 only packages that have updated code in the source are published with the new version while the rest of the packages are left as is. This mostly works in practice because we use ^ in our packages. Unfortunately this kind of system requires that a majo'''
