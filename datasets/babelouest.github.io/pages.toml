["https://babelouest.github.io/angharad/docs/INSTALL.html"]
title = "Install Angharad | angharad"
description = "House automation system with a REST/Json interface"
full_description = "This documents describes the installation of the application Angharad and the following devices modules and services: All Angharad system, its submodules and its custom libraries are written in C/C++ language, for better performance and lightweight resources consumption. GCC and Makefile were used for the development. On Debian-based systems (Debian, Raspbian, Ubuntu), use the following comand to install the dependencies: Benoic modules are located in the folder benoic/device-modules. If you want to adapt or change the modules for your needs, you can manually compile them. The module named device-mock.c is a mock device that is used to test the behaviour of a module with benoic and angharad systems. A mock device doesn’t control any real hardware, but simulates the behaviour of a device. You can use it to help you write your own device module. The service named service-mock.c is a mock service that is used to test the behaviour of a service with carleon and angharad systems. A mock service doesn’t control any real service, but simulates one. You can use it to help you write your own service. Depending on your needs, you can use a sqlite3 database (single file, fast and reliable) or a MySQL Database (fast and reliable as well but also more secure). The file angharad.conf.sample contains a sample file with all the configuration parameters needed, just fill the parameters with your own environment. Paths can be relatives or absolute. app_files_path is used for the static files server, in this case, Sagremor is the dedicated web application and can be hosted there. It’s recommended to disable the static web server for better security, just comment out the property line in the configuration file. It’s better to serve the statis files via a webserver such as Apache or NGINX. Specify the database parameters in the database {} block, depending on your database configuration (SQLite3 or MySQL). Angharad comes with an OIDC authentication method. You can use any OIDC authentication provider, as long as it provides access tokens using the JSON Web Token (JWT) Profile for OAuth 2.0 Access Tokens method The scope required for the backend API is angharad by default."
year_published = 2025
