["https://babelouest.github.io/glewlwyd/docs/USER.html"]
title = "Glewlwyd User Documentation | glewlwyd"
description = "Experimental Single Sign On server, OAuth2, Openid Connect, multiple factor authentication with, HOTP/TOTP, FIDO2, TLS Certificates, etc. extensible via plugins"
full_description = "This documentation is intended to help Glewlwyd Users to manage their profile and register authentication schemes, and understand the login workflow. To access its profile page, the user must go to the profile URL, typically https://glewlwyd_server_url/profile.html. The user may have to re-login, because for security reasons, the default session timeout is set to 10 minutes. In the first tab of the profile page, the user is allowed to view and update some of the data related to its account. Some data may be updated such as Name, some data can’t be updated by the user itself, such as e-mail or scope. Depending the server configuration, the administrator can add more personal data that can be viewed and possibly updated by the user. If you click on the Password tab, you’ll be able to change your user passwords. You can have multiple passwords if you need to, or none if your Glewlwyd service allows passwordless authentication. Be careful that every password will allow the same access level to your Glewlwyd service, so all of them must be strong enough to avoid being guessed. In the profile page, the user will be able to manage the schemes available for its account. The following paragraphs will describe how to register the schemes available. By design, the schemes Retype password and E-mail code can’t be registered or configured in the profile page. WebAuthn is an authentication scheme that permits the user to authenticate via a dedicated device without having to retain a password. Currently, the devices available for this scheme are the following: You’ll need a browser compatible with WebAuthn API. Recent versions of Firefox, Chrome, Edge and Opera work fine, check Can I use for more details. On the WebAuthn tab, click on the button New Component. There, follow your browser instructions. Eventually, you should see the new registered component in the component list. You can verify it’s working properly by clicking on the Test button, there, follow your browser’s instructions. You should see a popup message saying Authentication succeeded."
year_published = 2025
clearnet = "https://babelouest.github.io/glewlwyd/docs/USER.html"
