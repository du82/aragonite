["https://babelouest.github.io/glewlwyd/docs/USER_HTTP.html"]
title = "Glewlwyd User Module HTTP Backend documentation | glewlwyd"
description = "Experimental Single Sign On server, OAuth2, Openid Connect, multiple factor authentication with, HOTP/TOTP, FIDO2, TLS Certificates, etc. extensible via plugins"
full_description = 'The http backend uses a HTTP service to authenticate users via Basic Auth. By design, this backend module instance is always read-only. Listing users will always return an empty list, getting a single user will always return a JSON object, even if the user doesn’t exist in the backend. In the administration page, go to Parameters/Users data sources and add a new user module by clicking on the + button. In the modal, enter a name and a display name (the name must be unique among all user backend instances). Select the type LDAP backend user module in the Type drop-down button. Name (identifier) of the module instance, must be unique among all the user backend module instances, even of a different type. Fill this option if you want the users to enter their username only, without surrounding patterns. For example, if the login format on the HTTP server uses the format \\domain\username, then you can fill this option with \\domain\{username}. This option is optional, but if you fill it, the pattern {username} must be present in the format.'
