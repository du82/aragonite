["https://babelouest.github.io/glewlwyd"]
title = "Glewlwyd SSO server | glewlwyd"
description = "Experimental Single Sign On server, OAuth2, Openid Connect, multiple factor authentication with, HOTP/TOTP, FIDO2, TLS Certificates, etc. extensible via plugins"
full_description = "This project is now closed for me, I have no time nor motivation to maintain it, so I prefer closing this repository. Glewlwyd can take a central place in a system where applications and environments need authentication and authorization, be aware of the risks: bugs, non discovered vulnerabilities, etc. I recommend not to use Glewlwyd in production, more likely to test OAuth2/OpenID behavior, MFA connections, or IdP in general. You can also explore its functionalities and help yourself with its source code for other implementations. Glewlwyd 2.7.6 is available. Feel free to install it, test it, use it (with precautions!), and send feedback if you feel like it! New users can register a new account with the possibility to confirm their e-mail address or not. During the registration process, the new user may be expected to register their passwords, as well as other authentication factors: Existing users can reset their credentials if their password or authentication schemes are lost or unavailable. Credentials can be reset by different factors: See the register/update e-mail/reset credentials documentation for more information on the registration, update e-mail or reset credentials features. Based on a plugin architecture to make it easier to add or update storage backends, authentication schemes or process. Adding new authentication schemes or backend storage for users and clients is possible via the plugin architecture. Its plugin architecture makes it easy to add new modules or plugins, or modify existing ones with less risks to have unmaintainable code. This Docker image can be used for tests or for real use by changing the configuration files. More information in the install documentation. The Getting started documentation will help administrators configure Glewlwyd’s modules and authentication schemes. You can update the existing plugins or add new ones depending on your needs, check out the documentation available for each type of plugin:"
