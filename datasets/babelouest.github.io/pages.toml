full_description = "This document is intended to describe Glewlwyd’s core API endpoints. Glewlwyd’s core API endpoints are used to manage core functionalities data. All the endpoints require proper authentication to provide their service. The authentication method used is a session cookie. For each endpoint, the scope required will be defined in the Security paragraph. The admin scope name is g_admin, the profile scope name is g_profile, but these values can be changed in the configuration file. All URLs are based on the prefix you will setup. In this document, all endpoints will assume they use the prefix /api. Reload all the modules and instances, useful if you have multiple Glewlwyd instances connected to the same database offset: number, the offset to start the list, default 0 limit: number, the maximal number of elements in the list, default 100 source: string, the instance name to limit the result, if not set, all instances will be used pattern: string, the pattern to filter the result username: username to return, mandatory source: user module instance to look for the user, optional, if not set look on all instances source: user module instance to look for the user, optional, if not set, the first instance in write mode in order rank will host the new user username: username of the user to update source: user module instance to look for the user, optional, if not set look on all instances offset: number, the offset to start the list, default 0 limit: number, the maximal number of elements in the list, default 100 source: string, the instance name to limit the result, if not set, all instances will be used pattern: string, the pattern to filter the result client_id: client_id to return, mandatory source: client module instance to look for the client, optional, if not set look on all instances source: client module instance to look for the client, optional, if not set, the first instance in write mode in order rank will host the new client client_id: client_id of the client to update source: client module instance to look for the client, optional, if not set look on all instances"
