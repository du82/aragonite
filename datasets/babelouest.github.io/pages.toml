["https://babelouest.github.io/ulfius"]
title = "Ulfius: Ulfius API Documentation"
full_description = "If you don't or can't have pkg-config for the build, you can set the linker options -lulfius -lorcania -lyder. The options -lorcania and -lyder are not necessary if you don't directly use Orcania or Yder functions. But in doubt, add them anyway. When specified, some functions return U_OK on success, and other values otherwise. U_OK is 0, other values are non-0 values. The defined return value list is the following: Ulfius uses the memory allocation functions malloc/realloc/calloc/free by default, but you can overwrite this and use any other memory allocation functions of your choice. Use Orcania's functions o_set_alloc_funcs and o_get_alloc_funcs to set and get memory allocation functions. Accessing those functions requires you to directly link your application also against the Orcania library. To do so, add -lorcania to your linking command. If you use a version of libmicrohttpd older than 0.9.61, you need to set the mhd_response_copy_data = 1 in your _u_instance if you use a memory allocator whose allocated return values may not directly be passed to free() or if you want to make sure all free() will always go via your user-provided free callback. Data structures allocated have their specific cleanup functions. To free pointer allocated, you should use the function u_free that is intended to use your memory management functions. It's recommended to use ulfius_global_init and ulfius_global_close at the beginning and at the end of your program to initialize and cleanup internal values and settings. This will make outgoing requests faster, especially if you use lots of them, and dispatch your memory allocation functions in curl and Jansson if you changed them. These functions are NOT thread-safe, so you must use them in a single thread context. Ulfius framework runs as an async task in the background. When initialized, a thread is executed in the background. This thread will listen to the specified port and dispatch the calls to the specified callback functions. Ulfius allows adding and removing new endpoints during the instance execution."
year_published = 2025
clearnet = "https://babelouest.github.io/ulfius"
