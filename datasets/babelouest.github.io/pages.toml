full_description = "In the administration page, go to Parameters/Users data sources and add a new user module by clicking on the + button. In the modal, enter a name and a display name (the name must be unique among all user backend instances). Select the type LDAP backend user module in the Type drop-down button. Name (identifier) of the module instance, must be unique among all the user backend module instances, even of a different type. Check this option if you want to use this backend as read-only. All user properties such as e-mail, name, password, scopes can’t be modifier with Glewlwyd, even administrators. Check this option if you allow users to manage multiple passwords. More information about multiple passwords use-cases are avaiable in the Getting Started Dcumentation. DN used to access the LDAP service. The DN must have write access if you want to use this backend in write mode. Page size to list users in this backend. This option must be lower than the maximum of results that the LDAP service can send. Username of the user. This property will be used to build the search filter on a user connection. You can specify multiple values by separating them with a comma ,. On read mode, the first value will be used, on write mode, all values will be used. Name of the user. You can specify multiple values by separating them with a comma ,. On read mode, the first value will be used, on write mode, all values will be used. Scopes available for the user. The LDAP property must store multiple values. You can specify multiple values by separating them with a comma ,. On read mode, the first value will be used, on write mode, all values will be used. Property used to store the user e-mail value. You can specify multiple values by separating them with a comma ,. On read mode, the first value will be used, on write mode, all values will be used. Property used to store the user password. This property is not used if the instance is in read-only mode. You can specify multiple values by separating them with a comma ,. On read mode, the first value will be used, on write mode, all values will be used."
