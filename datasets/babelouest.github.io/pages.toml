title = "Glewlwyd OAuth2 Plugin documentation | glewlwyd"
description = "Experimental Single Sign On server, OAuth2, Openid Connect, multiple factor authentication with, HOTP/TOTP, FIDO2, TLS Certificates, etc. extensible via plugins"
full_description = "This plugin is deprecated. If bugs are found they will be fixed, but you should use the OpenID Connect plugin instead. Glewlwyd OAuth2 plugin uses JWTs as access tokens. Therefore, the access token can be used by the client or the third party web service to identify the user and the scopes available with this access token. To create a key/certificate pair in RSA or ECDSA format, run the following commands on a linux shell with openssl installed: In the administration page, go to Parameters/Plugins and add a new plugin by clicking on the + button. In the modal, enter a name and a display name (the name must be unique among all user backend instances). Select the type Glewlwyd OAuth2 plugin in the Type drop-down button. Name (identifier) of the plugin instance, must be unique among all the plugin instances, even of a different type. The algorithm supported are RSA and ECDSA using a private and a public key, and SHA using a shared secret. Private key file used to sign if the selected algorithm is RSA or ECDSA. Must be a PEM format file. Shared secret if the selected algorithm is SHA. Public key file used to validate access tokens if the selected algorithm is RSA or ECDSA. Must be a PEM format file. Duration of validity of each code sent to the client before requesting a refresh token. Default value is 600 (10 minutes). If this option is checked, every time an access token is requested using a refresh token, the refresh token issued at time will be reset to the current time. This option allows infinite validity for the refresh tokens if it’s not manually disabled, but if a refresh token isn’t used for more of the value Refresh token duration, it will be disabled. If this option is set, when a code is replayed to gain a refresh token, all the refresh and access tokens delivered for this code will be revoked. This option can be used to mitigate replay attacks and enforce tokens security. Please note that a specific scope parameter has a higher priority than the plugin settings, and if have multiple scopes in a request that have specific settings, the settings will follow the following algorithm:"
