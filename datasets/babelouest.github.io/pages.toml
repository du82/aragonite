["https://babelouest.github.io/glewlwyd/docs/WEBAUTHN.html"]
title = "Glewlwyd WebAuthn Schema Documentation | glewlwyd"
description = "Experimental Single Sign On server, OAuth2, Openid Connect, multiple factor authentication with, HOTP/TOTP, FIDO2, TLS Certificates, etc. extensible via plugins"
full_description = "The WebAuthn Schema implements authentication based on the WebAuthn API. This allows users to authenticate to Glewlwyd using physical devices: Android or Apple phones with fingerprint or face id, Yubikeys, etc. The user needs to register its device to Glewlwyd first, then when a webauthn authentication is required, the user plugs its device, and the authentication process is validated without the users need to enter a password. In the administration page, go to Parameters/Authentication schemes and add a new scheme by clicking on the + button. In the modal, enter a name and a display name (the name must be unique among all authentication scheme instances), and a scheme session expiration in seconds. Select the type WebAuthn in the Type drop-down button. Name (identifier) of the scheme, must be unique among all the scheme instances, even of a different type. Maximum number of times a valid authentication with this scheme is possible. This is an additional parameter used to enforce the security of the session and forbid to reuse this session for other authentications. If this option is unchecked, only administrator can register this scheme for every user via the administration page. Force all registration to Glewlwyd without a certificate (attestation set to ‘none’, therefore fmt returned is ‘none’). Check this option if you don’t want to manage FIDO2 devices chain of trust and want to accept all FIDO2 device a user wants to register. This options allows or forbid users to authenticate via webauthn if they already have a valid session. If you disable this option, you can use webauthn for a no-password authentication. This setting is required if the option User must have a valid session to connect is unchecked. It will be used to generate fake users and authentication ids to mitigate intrusion attacks. So attacker won’t be able to make the distinction between a valid user and a fake one. A random string is generated by your browser to fill this option. You can change it as you like, but be sure to enter a long string (~32 characters or more) for a significant entropy."
year_published = 2025
