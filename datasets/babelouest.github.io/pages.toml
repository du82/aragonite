full_description = "The database backend uses a database to store information and passwords for users. The database can be the same one as the Glewlwyd database or another database of another supported type. In the administration page, go to Parameters/Users data sources and add a new user module by clicking on the + button. In the modal, enter a name and a display name (the name must be unique among all user backend instances). Select the type Database backend user module in the Type drop-down button. Name (identifier) of the module instance, must be unique among all the user backend module instances, even of a different type. Check this option if you want to use this backend as read-only. All user properties such as e-mail, name, password, scopes can’t be modifier with Glewlwyd, even administrators. Number of iterations for the password digest in SQlite3 databases only. Currently (2021), it’s recommended to iterate at least 100 000 times. Check this option if you allow users to manage multiple passwords. More information about multiple passwords use-cases are avaiable in the Getting Started Dcumentation. Uncheck this option if you want to use a different database that will store the users. The new database must have the structure already present. Use one of the following script to initialize the database: This option is available if the option Use the same connection as Glewlwyd server is disabled. Select the database backend among the ones available. This option is available if the database type selected is SQLite 3. Enter the path of the SQLite 3 database on the server. This option is available if the database type selected is MariaDB/MySQL. Hostname of the MariaDB/MySQL server. This option is available if the database type selected is MariaDB/MySQL. Username to connect to the MariaDB/MySQL server. This option is available if the database type selected is MariaDB/MySQL. Password to connect to the MariaDB/MySQL server. This option is available if the database type selected is MariaDB/MySQL. Name of the database hosting the Glewlwyd user backend tables."
