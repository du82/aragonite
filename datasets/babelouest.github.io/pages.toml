title = "Hoel: Hoel"
full_description = "Simple and easy to use database access library. Works with SQLite 3, MariaDB and PostgreSQL databases. Uses a JSON-based language with jansson to execute simple queries based on one table. Install Jansson library for JSON manipulation, minimum version 2.4. On a Debian-based platform, run the following command: Hoel is available in multiple distributions as official package. Check out your distribution documentation to install the package automatically. You can install Hoel with a pre-compiled package available in the release pages. jansson, sqlite3, libmariadb-client and libpq development files packages are required to install Hoel. The packages files hoel-dev-full_* contain the libraries orcania, yder and hoel. It's also compiled with all the database backends. For example, to install Hoel with the hoel-dev-full_2.3.0_Debian_stretch_x86_64.tar.gz package downloaded on the releases page, you must execute the following commands: If there's no package available for your distribution, you can recompile it manually using CMake or Makefile. By default, Hoel is compiled with the 3 databases support. If you don't need one or more database, follow these instructions You can disable 2 databases backends to keep just one, simply add both parameters to the make command: By default, the shared library and the header file will be installed in the /usr/local location. To change this setting, you can modify the DESTDIR value in the src/Makefile. When specified, some functions return H_OK on success, and other values otherwise. H_OK is 0, other values are non-0 values. The defined errors list is the following: Some function return allocated values. When the value is not a structure, you must use the function h_free to clean it. Otherwise, use the dedicated functions. All these functions return a struct _h_connection * on success. This pointer will be needed on every call to Hoel functions. When you no longer need your connection, close it using the function h_close_db. This will close the connection to the database and free the memory allocated by the connection."
