full_description = "Glewlwyd upgrades usually come with database changes. It is highly recommended to backup your database before performing the upgrade. You must perform the database upgrades in the correct order. i.e. if you upgrade from Glewlwyd 2.3 to Glewlwyd 2.6, you must first install the 2.4 upgrade, then the 2.5. If your current version is prior to 2.6.0, first follow the security instructions in the paragraph Upgrade to Glewlwyd 2.5.0. Some changes were added to the core tables. You must execute the script depending on your database backend: If your current version is prior to 2.5.0, first follow the security instructions in the paragraph Upgrade to Glewlwyd 2.5.0. Some changes were added to the core tables. You must execute the script depending on your database backend: If your current version is prior to 2.4.0, first follow the security instructions in the paragraph Upgrade to Glewlwyd 2.4.0. Some changes were added to the core tables. You must execute the script depending on your database backend: If your current version is prior to 2.3.3, first follow the security instructions in the paragraph Upgrade to Glewlwyd 2.3.3. Small changes were added to the core tables. You must execute the script depending on your database backend: This is a security release, please upgrade your Glewlwyd version. To mitigate server configuration leaks, I recommend the following actions: Small changes were added to the core tables. You must execute the script depending on your database backend: Small changes were added to the core tables. You must execute the script depending on your database backend: In Glewlwyd 2.2, the new scheme OAuth2/OIDC external login was introduced. To use this module, you must create its required tables by executing the script depending on your database backend: In Glewlwyd 2.1, the plugin module register has appear. In order to use this module, you must add its tables by executing the script depending on your database backend: Glewlwyd is available in some distributions as official package. Check out your distribution documentation to install the package automatically."
