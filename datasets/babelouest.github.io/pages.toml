["https://babelouest.github.io/glewlwyd/docs/REGISTER.html"]
title = "Glewlwyd register new user plugin documentation | glewlwyd"
description = "Experimental Single Sign On server, OAuth2, Openid Connect, multiple factor authentication with, HOTP/TOTP, FIDO2, TLS Certificates, etc. extensible via plugins"
full_description = "During the registration process, the new user can register schemes and/or set a password. When you setup a registration instance, you need to set at least one authentication scheme to be mandatory for the user registration process. You also need to set at least one scope to the new users, g_profile is recommended for the users to be able to connect to their profile page, you can also add any other scheme you may find relevant for your self-registered users. With this option on, a user that has lost its password or its authentication scheme properties like OTP shared secret or webauthn device can reset its credentials using either a link sent to the user’s e-mail or a recovery code previously generated. In the administration page, go to Parameters/Plugins and add a new plugin by clicking on the + button. In the modal, enter a name and a display name (the name must be unique among all user backend instances). Select the type Register new user plugin in the Type drop-down button. Name (identifier) of the plugin instance, must be unique among all the plugin instances, even of a different type. Maximum duration of the registration session in seconds, default is 3600 (1 hour). If the new user didn’t complete its registration before this duration, the user won’t be available. A mandatory scheme means that the new user must register this scheme during the registration process to complete the registration. Maximum lifetime of the code in seconds, default is 600 (10 minutes). If the new user didn’t verify its e-mail address before this duration, the user will need to send another code. The pattern for the body on the e-mails for the current lang, You must use at least once the string {CODE} in the pattern to be replaced by the code. The pattern {TOKEN} will be replaced by the token used to build the URL in the e-mail to get direct access to the validation step without entering the code. Maximum lifetime of the link send to the new e-mail in seconds, default is 600 (10 minutes). If the new user didn’t verify its e-mail address before this duration, the user will need to send another token."
year_published = 2025
clearnet = "https://babelouest.github.io/glewlwyd/docs/REGISTER.html"
