title = "Glewlwyd OpenID Connect Plugin documentation | glewlwyd"
description = "Experimental Single Sign On server, OAuth2, Openid Connect, multiple factor authentication with, HOTP/TOTP, FIDO2, TLS Certificates, etc. extensible via plugins"
full_description = "This plugin is based on the OpenID Connect Core 1.0 specification and allows Glewlwyd to act as an OpenID Provider (OP). Glewlwyd OIDC plugin relies on Rhonabwy library to sign and encrypt tokens. Depending on your GnuTLS and Nettle version, you may not have all the encryption or signature algorithms available. The discovery endpoint is up-to-date with the supported encryption algorithms. Concerning key management encryption using symmetric keys, the encryption key is based on a hash of the client secret or the server secret depending on the token to encrypt. To generate a symmetric key encryption, you must build a SHA256 hash of the secret for the key management encryption algorithms A128KW, A192KW, A256KW, A128GCMKW, A192GCMKW and A256GCMKW. Depending on the alg value, you must use the n first bytes of the hash as follows: If the key management encryption algorithm is dir, you must build a SHA512 hash of the secret, then depending on the enc value, you must use the n first bytes of the hash as follows: If the plugin has multiple keys available, the client can choose any of them to encrypt their requests. But the client MUST set the kid value in the JWT header to specify the key to use for decryption. If the client receives an encrypted access tokens, refresh tokens or code, it must decrypt it in order to use it with Glewlwyd. In particular, the encrypted access token must be decrypted and the nested JWS must be extracted to be usable by Glewlwyd for getting access to userinfo, token revocation or introspection, etc. As a heir of Glewlwyd OAuth2 plugin, Glewlwyd OpenID Connect plugin uses JWTs as access tokens. Therefore, the access token can be used by the client or the third party web service to identify the user and the scopes available with this access token. The access token claims format implements JSON Web Token (JWT) Profile for OAuth 2.0 Access Tokens - draft 05. To create a key/certificate pair for RSA, ECDSA, RSA-PSS or EdDSA format, run the following commands on a Linux shell with openssl installed:"
