["https://babelouest.github.io/glewlwyd/docs/GETTING_STARTED.html"]
title = "Getting started with Glewlwyd 2.0 | glewlwyd"
description = "Experimental Single Sign On server, OAuth2, Openid Connect, multiple factor authentication with, HOTP/TOTP, FIDO2, TLS Certificates, etc. extensible via plugins"
full_description = "The installation comes with a default configuration that can be updated or overwritten via the administration page or the configuration file. The default configuration uses Glewlwyd’s database as backend for users and clients. The scopes g_admin and g_profile (for admin page and profile page) are configured for a session duration of 10 minutes. Install Glewlwyd via the packages, CMake or Makefile. See the installation documentation for more details. Open the administration page in your browser. The default URL is http://localhost:4593/. Use the default login admin with the default password password. Go to parameters/user menu in the navigation tab. Click on the + button to add a new user backend instance. The user backend modules available are: You can add the same instance of the same user backend module as many times as you want. A user backend module is identified by its module name and its instance name, example database/localDB, ldap/companyAD. The instance name must be unique though, i.e. you can’t have database/local and ldap/local as user backend instances. The database backend requires an access to a database. You can use the same backend as the Glewlwyd server or use a different database. If you use a different database, it must be initialized with the script available in src/user/database.[sqlite3|mariadb|postgresql].sql. With this user backend module, every time a user/password access is required, Glewlwyd will use the login/password provided to authenticate on the HTTP service configured and return the result: user valid, user invalid or server error. You must set at least one scope that will be available for all users connecting via this backend. This module is read-only, and no user data will be stored in Glewlwyd’s storage system, except the user sessions. Which means getting the user list of an HTTP backend will always return an empty list and getting the details of any username will return a build-up JSON object with the following data: Go to parameters/client menu in the navigation tab. Click on the + button to add a new client backend instance. The client backend modules available are:"
