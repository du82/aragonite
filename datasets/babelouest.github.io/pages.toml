title = "Hutch | hutch"
description = "Experimental online password and secret locker"
full_description = "Experimental online password and secret locker. This is a personal project used to learn concepts and cryptographic programming. The API backend is fully written in language C, it’s based on Ulfius HTTP framework, Hoel database framework, Rhonabwy JOSE library and Iddawc OIDC Client and RP library. Authentication relies on an OpenID Connect server like Glewlwyd providing access tokens using the JSON Web Token (JWT) Profile for OAuth 2.0 Access Tokens standards."
