full_description = "Das ganze Logo der Babylotsen der Charité (Bühne) Suche absenden Die Babylotsinnen der Charité — für einen guten Start ins Leben In der Schwangerschaft und nach der Geburt eines Babys können viele neue Fragen auftauchen. In dieser Zeit stehen Ihnen die Babylotsinnen der Charité gerne hilfreich und unterstützend zur Seite! Vieles gilt es zu organisieren. Auf unserer Webseite finden Sie zu den meisten Themen und Fragen bereits eine Antwort. Wenn Sie mit einer Babylotsin der Charité persönlich sprechen wollen, zögern Sie nicht: Hier können Sie mit ihnen Kontakt aufnehmen. Denn die Babylotsinnen der Charité möchten dazu beitragen, dass sich Mütter und Väter nach der Geburt ihres Kindes gut informiert und versorgt auf das Familienleben freuen können. Die Babylotsinnen im Campus Virchow-Klinikum (CVK) der Charité Berlin Anna Kapper Tel. +49 30 450 664 407 Mehr über Anna Kapper erfahren und ihr eine E-Mail schreiben. Mira Wilkendorf Tel. +49 30 450 664 407 Mehr über Mira Wilkendorf erfahren und ihr eine E-Mail schreiben. Die Babylotsinnen im Campus Mitte (CCM) der Charité Berlin Elena Baumhauer Tel. +49 30 450 664 446 Mehr über Elena Baumhauer erfahren und ihr eine E-Mail schreiben. Katalin Petersen Tel. +49 30 450 664 660 Mehr über Katalin Petersen erfahren und ihr eine E-Mail schreiben. Katja Erlenmeyer Tel. +49 30 450 664 660 Mehr über Katja Erlenmeyer erfahren und ihr eine E-Mail schreiben. Der Babylotsen-Mini-Flyer mit allen wichtigen Informationen zum Herunterladen Auf diesem kleinen Mini-Flyer finden Sie die wichtigsten Informationen über die Babylotsinnen der Charité und wie Sie uns per Telefon und E-Mail erreichen können. Der Mini-Flyer passt in jede Hand- und Brieftasche. Weitere und detaillierte Informationen finden Sie bei uns auch auf diesen Seiten: Für Eltern und Schwangere Angebote, Informationen, Filme, Termine, Hilfe zur Selbsthilfe – rund um die Geburt sowie Berichte aus der Praxis Mehr Informationen Aktuelle Meldungen und Studien zu und über Babylotsen Mehr Informationen Anmeldung zur Geburt, zu Spezialsprechstunden und weitere Informationen der Geburtsmedizin der Charité Mitte und Campus Virchow Mehr Informationen _______________________________________________________________________________________________________________________________ Qualitäts-Siegel der Charité Berlin – Universitätsmedizin Die Charité ist Mitglied der Initiative Qualitätsmedizin (IQM) und vergleicht ihre Behandlungsergebnisse freiwillig mit anderen Kliniken. Mehr Informationen"
