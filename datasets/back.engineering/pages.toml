title = "Porting SNES9x to Banned Chinese Camera System Hardware — BELabs"
description = "EZVIZ BD-2402B1 is a surveillance system DVR which uses hisilicon SoC’s. My goal was to repurpose the hardware to run a custom fork of snes9x."
full_description = 'Jan 21, 2022 · 21 min readPorting SNES9x to Banned Chinese Camera System HardwareEZVIZ BD-2402B1 is a surveillance system DVR which uses hisilicon SoC’s. My goal was to repurpose the hardware to run a custom fork of snes9x.img{width:100%}Table Of ContentsIntroductionHardware DetailsNotable ComponentsSoC - Hi3520DV300TDE - Two Dimensional EngineUART - Universal asynchronous receiver-transmitterJTAG - Hardware DebuggingHisilicon Source CodeWhich can be found here, rehosted on my servers…Bricking The Device & Bus PirateFlashing SPI NOR Flash Chip (MX25L12835F)Custom UBoot & Custom KernelSystem StartupSystem startup overviewConfiguring Pinmux’s & Loading Kernel ModulesSNES9X PortSNES9X RenderingRelevant Graphics ConceptsHardware Accelerated SNES9X with the TDEConclusionIntroductionEZVIZ BD-2402B1 is a surveillance system DVR which uses hisilicon SoC’s. My goal was to repurpose the hardware to run a custom fork of snes9x. In order to achieve this a serious amount of reverse engineering, and learning was required. Not only was this a hardware based project, but it was also a software heavy project.I decided I would try and run my own snes9x fork on this hardware rather than do security related research after reviewing many articles detailing serious security vulnerabilities in products using hisilicon SoC’s. I felt that there were already enough eyes on the software running on these boards that another set of eyes would not add anything of value. In addition, hisilicon has been banned from the USA recently and so the amount of people using these camera systems is in decline. The chances of me finding a new vulnerability combined with the declining impact (usage) alluded to repurposing the hardware.So, instead, I decided I would take the opportunity to expand my hardware hacking skill set and familiarise myself with an snes emulator ive used for many years (snes9x).Hardware DetailsTo begin, the components/peripherals on the board should be described. Only the components which are of interest to porting snes9x and obtaining code execution on the device will be described, the rest of the components are well documented in the processor data sheet PDF hosted here.The pin headers which are on the board are NC (no connect) as their resistors have been removed from the PCB. Some pins are not NC, such as ground, since they are directly connected to a ground plain.Notable Components128MB SPI Flash Rom - MX25L12835F4GB DDR Ram - H5TQ4G63CFRSoC - Hi3520D V300A full, detailed list of the other I/O can be found in the Brief data sheet (which is publicly available). You can find a re-hosted version of that PDF here.SoC - Hi3520DV300”Hi3520D V300 is a professional SoC targeted for the multi-channel HD (1080p/720p) or SD (D1/960H) DVR. Hi3520D V300 provides an ARM A7 processor, a high-performance H.264 video encoding/decoding engine, a high-performance video/graphics processing engine with various complicated graphics processing algorithms, HDMI/VGA HD outputs, and various peripheral interfaces. These features enable Hi3520D V300 to provide high-performance, high-picture-quality, and low-cost analog HD/SDI solutions for customers’ products while reducing the eBOM cost”TDE - Two Dimensional EngineThe TDE is a graphics processing engine which runs outside of the arm processor. This allows for offloading of complex bitmap operations to happen without using the main processor. This engine is documented in the TDE programmers user manual. This engine helps in accelerating operations such as copying a bitmap into another and respecting the pitch (number of bytes per horizontal lines of pixels). It also can do pixel format conversions (which as you will see later in the post are required). Bitmap scaling is also done in this engine.UART - Universal asynchronous receiver-transmitterThe uboot on the board when I received it configured the UART baud rate to be 115200 baud. The TX pin was intact/connected. I was able to interrupt uboot easily, which allowed me to set rdinit=/bin/sh for the kernel cmdline (bootargs).I was setting init=/bin/sh and seeing no effect for a while because I didn’t realise the kernel was using an initramfs/initrd configuration. The entire file system is contained inside of the kernel image and is uncompressed and represented in memory. This also implies no persistent changes to the root filesystem were possible without recompiling the entire linux kernel and flashing it.setenv bootargs mem=128M console=ttyAMA0,115200n8 rdinit=/bin/sh This presented me with a root shell after booting the kernel as opposed to the PSH shell. The PSH shell is a restricted shell which doesn’t allow you to interact with the operating system normally. It’s more about checking statuses and such.Having root access to the device gave me useful information such as the SoC product number. This information allowed me to locate leaked source code pertaining to this SoC.JTAG - Hardware DebuggingThe SoC does have JTAG however all pin headers are not connected as resistors have been removed by the manufacturer. The SoC uses pins 85-91 for JTAG related functionality. This is something of further interest, however it’s not directly useful for this project as I already have full control over everything.Hisilicon Source CodeWhich can be found here, rehosted on my servers…Note:If Hisilicon reaches out to me and requests I remove such content I shall. If the link is dead then you can assume the former has happened.Some parts of the SDK are already on github.https://github.com/Axl-zhang/hi3520dv300-uboot-toolhttps://github.com/Axl-zhang/hisilicon-hi3520d-ubootThese repos contain almost everything:https://github.com/rgmabs19357/Hi3520D_V100R001C01SPC022https://github.com/rgmabs19357/Hi3520D_V100R001C01SPC022_osdrvThis project would not have been possible if it were not for a Chinese friend of mine who was able to download the entire leaked SDK off of https://www.csdn.net. This website requires a Chinese phone number (non-VOIP) to register an account, and you also need an account to download source code. His contribution to the project is invaluable. For his sake (and by his request) he will remain unnamed.The leaked source code contains uboot, linux kernel 3.10, extremely detailed documentation for the SoC, schematics, MPP source code (which is publicly available), and much more. This SDK is mentioned in the Brief Data Sheet. Without this source code nor documentation of the gpio/pinmux memory layout, communication over UART, as well as many other peripherals (including HDMI output) could not be configured.Bricking The Device & Bus PirateThe SDK comes with precompiled binaries for two platforms. I wanted to ensure that I found the correct SDK pertaining to my hardware so I decided I would overwrite uboot with one of the precompiled uboot images found in the SDK. I used some of the commands provided by uboot to do this.tftpsfThese commands are used as so:Read the pre-compiled uboot image over ethernet using tftp into memory at 0x82000000Probe the first SPI device and set it as the default (initialise functionality such as sf read and sf write)Write the uboot image from memory to the flash memory at offset 0. The arm processor will begin execution at address 0 (reset vector). Finally reset the processor.tftp uboot-from-sdk.bin 0x82000000 sf probe 0 sf write 0x82000000 0 0x100000 reset After executing these uboot commands I received nothing out of UART and so I concluded I had flashed the wrong uboot image. There were actually two pre-compiled uboot images in the SDK. I then started working with the SPI NOR flash memory directly using my bus pirate.However the firmware on my bus pirate has known issues with flashrom…During the firmware upgrade and bootloader upgrade process of the bus pirate I unplugged it as I do this to close the screen I open to view the Bus Pirate.# if you unplug the bus pirate the screen program terminates screen /dev/ttyUSB0 115200 So, my bad habit of unplugging the device to close the screen ended up costing me 35$ and a few days of time on the project.Flashing SPI NOR Flash Chip (MX25L12835F)Connections must be made to VCC, CS#, SO, SI, and GND between the bus pirate and flash chip. The WP# pin must be held high in order for write protection to be disabled. This will allow flashrom to send commands to change the status register of the flash which can then allow flashrom to disable write protection on all blocks of memory.After configuration it should look something like this:Finally flashing the second of the precompiled uboot images onto the nor flash chip I was able to see UART output. This confirmed my original suspicion which was that I unintentionally flashed the wrong precompiled uboot image onto the chip.Now that I know I can flash uboot images to the NOR flash it’s time to start developing a custom uboot and kernel image.Custom UBoot & Custom KernelIn order for me to load a custom kernel image I require more control over the boot sequence. Therefore I found it necessary to edit a few variables in the uboot configuration. Firstly, I will not be storing a CRAMFS filesystem on the flash chip, rather I will store the kernel at a predefined location in the flash memory. The only reason for recompiling the kernel is because the file system in which linux uses will be stored inside of the linux kernel. Init.d scripts are thus compiled into the kernel and so any changes to the file system require recompiling the entire kernel.Uboot is only ~200KB so for rounding sake it will be truncated to 1MB. The resulting custom kernel image will then be truncated to 15MB. Both uboot and the linux kernel will be concatenated together as one large 16MB file. Finally the resulting file (u-boot-done.bin) is flashed.truncate –size=1M u-boot.bin truncate –size=15M uImage cat u-boot.bin uImage > u-boot-done.bin flashrom -V -p buspirate_spi:dev=/dev/ttyUSB0,spispeed=2M \ -c MX25L12835F/MX25L12845E/MX25L12865E -w u-boot-done.bin The custom boot command for uboot is the following:sf probe 0 # sf initialization sf read 0x82000000 0x100000 0x700000 # reads 7mb from offset=1MB into address 0x82000000 bootm 0x82000000 # boot the custom kernel This allows me to remove the need for a CRAMFS file system or any file system stored on the flash memory itself.System StartupThe SDK contains a preconfigured busybox which is essentially all executables required to operate the system stored in a single executable. Busybox will operate as the init program, which is the first usermode executable to run (PID 1). Init will parse and execute commands from the /etc/inittab file./etc/inittab executes the bash script /etc/init.d/rcS. /etc/init.d/rcS will execute mount -a and then execute the rest of the bash scripts in the same folder. These other bash scripts must be of the naming convention: SXX where XX is a number, the number represents precedence in execution.System Startup OverviewUbootuImage loadedKernel decompressedControl passed to the kernelKernel startupExecution passed to /init/init parses and executes commands from /etc/inittab/etc/inittab says to execute /etc/init.d/rcS/etc/init.d/rcS executes mount -a and then executes other bash scripts.mount -a will mount file systems according to /etc/fstab.echo /sbin/mdev > /proc/sys/kernel/hotplugmdev -spinmux’s are configured and hisilicon kernel modules are loadedLastly a getty executable is launched and the root user is logged in without authentication.Root user /root/.profile configures environment variables and lastly executes the snes9x fork.The first USB plugged into the device will be /dev/sda with the first recognizable partition /dev/sda1. The startup scripts will mount the USB via mount /dev/sda1 /mnt/usb-drive/. The last command executed by my startup scripts executes a script by the file name “snes9x” on the USB. This will allow me to run stuff at init.d without recompiling and reflashing the kernel image to the flash.Configuring Pinmux’s & Loading Kernel ModulesWhen the system is brought up, certain pins are configured in a manner which will render kernel module functionality inoperable. Such is the case with HDMI output. The SDK contains configuration shell scripts that set pinmux configurations so that when kernel modules are loaded their functionality is successful. These are important so I will list them all here:# pinmux configuration #I2C himm 0x120F00E0 0x1; # 0：GPIO12_6 1：I2C_SDA himm 0x120F00E4 0x1; # 0：GPIO12_7 1：I2C_SCL #VICAP himm 0x120F0000 0x2; # 00:GPIO5_7 01:VI0_CLK 10:VI_ADC_REFCLK0 himm 0x120F0004 0x1; # 0:GPIO1_0 1:VI0_DAT7 himm 0x120F0008 0x1; # 0:GPIO1_1 1:VI0_DAT6 himm 0x120F000C 0x1; # 0:GPIO1_2 1:VI0_DAT5 himm 0x120F0010 0x1; # 0:GPIO1_3 1:VI0_DAT4 himm 0x120F0014 0x1; # 0:GPIO1_4 1:VI0_DAT3 himm 0x120F0018 0x1; # 0:GPIO1_5 1:VI0_DAT2 himm 0x120F001C 0x1; # 0:GPIO1_6 1:VI0_DAT1 himm 0x120F0020 0x1; # 0:GPIO1_7 1:VI0_DAT0 himm 0x120F0024 0x2; # 00:GPIO10_6 01:VI1_CLK 10:VI0_CLK himm 0x120F0028 0x1 # 0:GPIO2_0 1:VI1_DAT7 himm 0x120F002C 0x1 # 0:GPIO2_1 1:VI1_DAT6 himm 0x120F0030 0x1 # 0:GPIO2_2 1:VI1_DAT5 himm 0x120F0034 0x1 # 0:GPIO2_3 1:VI1_DAT4 himm 0x120F0038 0x1 # 0:GPIO2_4 1:VI1_DAT3 himm 0x120F003C 0x1 # 0:GPIO2_5 1:VI1_DAT2 himm 0x120F0040 0x1 # 0:GPIO2_6 1:VI1_DAT1 himm 0x120F0044 0x1 # 0:GPIO2_7 1:VI1_DAT0 himm 0x120F0048 0x2; # 00:GPIO6_0 01:VI_ADC_REFCLK0 10:VI1_CLK himm 0x120F004C 0x2; # 00:GPIO11_7 01:VI2_CLK 10:VI_ADC_REFCLK1 himm 0x120F0050 0x1 # 0:GPIO3_0 1:VI2_DAT7 himm 0x120F0054 0x1 # 0:GPIO3_1 1:VI2_DAT6 himm 0x120F0058 0x1 # 0:GPIO3_2 1:VI2_DAT5 himm 0x120F005C 0x1 # 0:GPIO3_3 1:VI2_DAT4 himm 0x120F0060 0x1 # 0:GPIO3_4 1:VI2_DAT3 himm 0x120F0064 0x1 # 0:GPIO3_5 1:VI2_DAT2 himm 0x120F0068 0x1 # 0:GPIO3_6 1:VI2_DAT1 himm 0x120F006C 0x1 # 0:GPIO3_7 1:VI2_DAT0 himm 0x120F0070 0x2; # 00:GPIO10_5 01:VI3_CLK 10:VI2_CLK himm 0x120F0074 0x1 # 0:GPIO4_0 1:VI3_DAT7 himm 0x120F0078 0x1 # 0:GPIO4_1 1:VI3_DAT6 himm 0x120F007C 0x1 # 0:GPIO4_2 1:VI3_DAT5 himm 0x120F0080 0x1 # 0:GPIO4_3 1:VI3_DAT4 himm 0x120F0084 0x1 # 0:GPIO4_4 1:VI3_DAT3 himm 0x120F0088 0x1 # 0:GPIO4_5 1:VI3_DAT2 himm 0x120F008C 0x1 # 0:GPIO4_6 1:VI3_DAT1 himm 0x120F0090 0x1 # 0:GPIO4_7 1:VI3_DAT0 himm 0x120F0094 0x2; # 00:GPIO6_1 01:VI_ADC_REFCLK1 10:VI3_CLK #VGA himm 0x120F0098 0x1; # 0: GPIO11_6 1: VGA_HS himm 0x120F009C 0x1; # 0: GPIO11_3 1: VGA_VS #HDMI himm 0x120F0174 0x1; # 0: GPIO13_4 1:HDMI_HOTPLUG himm 0x120F0178 0x1; # 0: GPIO13_5 1:HDMI_CEC himm 0x120F017C 0x1; # 0: GPIO13_6 1:HDMI_SDA himm 0x120F0180 0x1; # 0: GPIO13_7 1:HDMI_SCL #SPI himm 0x120F00C4 0x1; # 00:TEST_CLK 01:SPI_SCLK 10:GPIO5_0 himm 0x120F00C8 0x1; # 0: GPIO5_1 1:SPI_SDO himm 0x120F00CC 0x1; # 0: GPIO5_2 1:SPI_SDI himm 0x120F00D0 0x1; # 0: GPIO5_3 1:SPI_CSN0 himm 0x120F00D4 0x1; # 0: GPIO5_4 1:SPI_CSN1 #I2C himm 0x120F00E0 0x1; # 0：GPIO12_6 1：I2C_SDA himm 0x120F00E4 0x1; # 0：GPIO12_7 1：I2C_SCL #I2S himm 0x120F00A0 0x1; # 0: GPIO9_0 1: I2S0_BCLK_RX himm 0x120F00A4 0x1; # 0: GPIO9_1 1: I2S0_WS_RX himm 0x120F00A8 0x1; # 0: GPIO9_2 1: I2S0_SD_RX hi'
