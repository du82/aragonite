full_description = "Cookies PolicyThis Cookie Statement (“Statement”) explains how Back Engineering Labs Inc. (“Company”) use cookies and similar technologies to recognize you when you visit our website, including at https://back.engineering (“Site”).We may update this Statement from time to time in order to reflect, for example changes to the cookies we use or for other operational, legal or regulatory reasons. Please revisit this Statement regularly to stay informed about our use of cookies and related technologies.What are cookies?Cookies are small data files that are placed on your computer or mobile device when you visit a specific website. Cookies are widely used by website owners in order to make their websites work, or to work more efficiently as well as to provide reporting information.Cookies set by the website owner called “first party cookies”. Cookies set by parties other than the website owner are called “third party cookies”. Third-party cookies enable third party features or functionality to be provided on or through the website (e.g., like advertising, interactive content and analytics). The parties that set these third-party cookies can recognize your computer both when it visits the website in question and also when it visits certain other websites.Why do we use cookies?We and our third-party partners use first-party and third-party cookies for different reasons, including to see which areas and features are popular and to count to visits to our Sites. Some cookies are required for technical reasons in order for our Sites to operate, and we refer to these as “essential cookies” or “strictly necessary cookies”. Other cookies enable us to track and target the interests of our users to enhance the experience on our Sites. Third parties serve cookies through our Sites for advertising, analytics, improving user experience, and other purposes. This is described in more detail below.The specific types of first and third-party cookies served through our Site and purposes they perform are described below.Functional cookies: these allow us to operate the website better and they make our website more user-friendly for the visitors. For example, we store your login details or what you have put in your shopping cart.Anonymised analytical cookies: these ensure that an anonymous cookie is generated every time you visit a website. These cookies know whether you have visited the site before or not. Only on the first visit, a cookie is created and on subsequent visits the existing cookie isused. This cookie is only for statistical purpose. For example, the following data can be collected:the number of unique visitorshow often users visit the sitewhich pages users viewhow long users view a certain pageon which page visitors leave the siteAnalytical cookies: these ensure that every time you visit a website a cookie is generated. These cookies know whether you have visited the site before or not. Only on the first visit cookie is created and on subsequent visits the existing cookie is used. This cookie for only for statistical purposes. This way data may be collected such as:the specific page you’ve viewedhow long you stayed on a particular pageon which page you left the sitePersonal tracking cookies: these allow us to learn that besides our website have also visited the relevant other website(s) from our network. The resulting profile is not linked to your name, address, e-mail address and the link, but only serves to match advertisements to your profile, so that they are as relevant as possible to you. We ask your permission for these cookies. These cookies are therefore not placed without your permission.Site improvement cookies: these allow us to test different versions of a webpage to see.How are other tracking technologies, like web beacons and device fingerprinting, used?Cookies are not the only way to recognize or track visitors to a website. We may use other, similar technologies from time to time, like web beacons (sometimes called “tracking pixels” or “clear gifs”) or via the use of JavaScript (placed within the code of our Sites). Web beacons are tiny graphics files that contain a unique identifier that enable us to recognize when someone has visited our Sites or opened an email that we have sent them. JavaScript is short code built into our Sites and these scripts activate when you request an HTML page with JavaScript in it. the script is sent to the browser and sever a similar purpose to a Web Beacon as, if the script is initiated, it allows us to infer you have either opened or done something on a particular page.These technologies allow us, for example, to monitor the traffic patterns of users from one page within our Sites to another, count visits, to deliver or communicate with cookies to understand whether you have come to our Sites from an online advertisement displayed on a third-party website, to improve Site performance, monitor Site navigation patterns and feature usage, and understand email reads and marketing campaign effectiveness. In many instances these technologies are reliant on cookies to function properly, and so declining cookies will impair their functioning. We may also use “device fingerprinting” or “browserfingerprinting”. This is technology used to identify particular machines or browsers in order to detect and prevent fraud and for information and network security. Declining cookies may not affect or browser fingerprinting.Do you serve targeted advertising?Third parties may serve cookies on your computer or mobile device to serve advertising through our Sites and/or other websites. These companies may use information about your visits to our Sites and other websites in order to provide relevant advertisements about goods and services that you may be interested in. They may also employ technology that is used to measure the effectiveness of advertisements. This can be accomplished by using cookies or web beacons to collect information about your visits to your Sites and other websites in order to provide relevant advertisements about good and services of potential interest to you.How can I control cookies?You can control cookies by changing the website browser settings on your computer. If you choose to reject cookies, you may still use our website, though your access to some functionality and areas of our website may be restricted. The means by which you can refuse cookies through your web browser controls vary from browser-to-browser.Your rights with regard to your dataYou have the right to inspect, rectify, limit and delete personal data. You also have the right to object to the processing of personal data and the right to data portability. You can exercise these rights by sending an e-mail to contact@back.engineering.To prevent abuse, we may ask you to identify yourself adequately. When it comes to access data linked to a cookie, we ask you to send a copy of the cookie in question. You can find this in the settings of your browser.Blocking and deleting cookiesAt any time you can easily block cookies yourself or delete them via your internet browser. You can also set your internet browser so that you receive a message when a cookie is placed. You can also indicate that certain cookies may not be placed. View the help function of your browser for this option. If you delete the cookies in your browser, this may have consequences for the pleasant use of this website. Some tracking cookies are placed by third parties which, among other things, show you advertisements via our website. You can delete these cookies centrally via youronlinechoices.com.Please not that if you don’t want any cookies, we cannot guarantee that our website still works well. Some functions of the site may be lost, or you may not be able to visit the website at all. In addition, refusing cookies does not mean that you will no longer see advertisements at all. The advertisements are then no longer tailored to your interests andcan therefore be repeated more often.How you can adjust your settings differs per browser. Please refer to the help function of your browsing or click on one of the links below to go directly to the manual of your browser.Firefox: https://support.mozilla.org/en/kb/cookies-delete-data-delete-wesbites-storedGoogle Chrome: https://support.google.com/chrome/answer/95647?co=GENIE.Platform=Desktop&hl=enInternet Explorer: https://support.microsoft.com/en-gb/kb/Safari on smart phone: https://support.apple.com/en-en/HTSafari on Mac: https://support.apple.com/en-gb/guide/safari/sfri11471/macNew development sand unforeseen cookiesThe texts of our website can be adjusted at any time due to continuous developments. This also applies to our cookie statement. Therefore, please read this statement regularly to stay informed of any changes. In blog articles, use can be made of content that is hosted on other sites and made accessible by https://back.engineering by means of certain codes (embedded content), as with YouTube videos for example. These codes often use cookies. However, we have no control over what these third parties do with their cookies.It is also possible that cookies are placed via our websites by others, of which we are not always aware. Do you encounter unforeseen cookies on our website that cannot find in our overview? Please contact contact@back.engineering. You can also contact the third party directly and ask which cookies they placed, what the reason is, what the lifespan of the cookie is and how they have guaranteed your privacy.Where can I get further information?If you have any questions about our use of cookies or other technologies, please email us at contact@back.engineering"
