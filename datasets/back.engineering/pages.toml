title = "Voyager - A Hyper-V Hacking Framework — BELabs"
description = "Voyager is a Hyper-V hijacking project based upon existing Hyper-V hijacking work by cr4sh which aims to extend the usability to AMD and earlier Windows 10 versions."
full_description = '''Jul 30, 2024 · 23 min readVoyager - A Hyper-V Hacking FrameworkVoyager is a Hyper-V hijacking project based upon existing Hyper-V hijacking work by cr4sh which aims to extend the usability to AMD and earlier Windows 10 versions.Download link: VoyagerTable Of ContentsKeywordsAbstractCreditIntroductionbootmgfw.efiwinload.efiBlLdrLoadImageBlImgAllocateImageBufferHyper-V Intel - vm exit handler location and hookingLocating Vmexit HandlerHyper-V AMD - vm exit handler location and hookingLocating Vmexit HandlerLocating VMCBHyper-V Payload - Injection, vmexit handler hookingHyper-V Page Tables - Extended Page Tables, Host Page TablesPayload - Page TablesVoyager - VDM Support & Legacy ProjectsVDM - Vulnerable Driver ManipulationPossible Detection - UEFI Reclaimable MemoryConclusionKeywordsHyper-V, UEFI, Windows 10, Hyperjacking, VDM, PTM, Intel, AMDAbstractVoyager is a project designed to hyperjack Hyper-V on UEFI based systems. Hyper-V is a type-1 hypervisor written by Microsoft and supports both Intel and AMD chips. Voyager offers module injection into both Intel and AMD variants of Hyper-V and vmexit handler hooking.Creditcr4sh - this project is based off of existing work created by cr4sh. This project adds additional support to AMD processors and an alternative payload injection method, as well as support to a few more Windows 10 versions.btbd - suggestions, input, and help related to hypervisor and uefi related things. Specifically file operation API’s, and EPT PFN help.daax - suggestions, input, and help related to AMD hypervisor technology. Specifically AMD’s NPT. Also provided input to the development of my own hypervisor.Useful ReferencesHyper-V Internals - gerhart (Hyper-V researcher, amazing work)Hyper-V Backdoor - cr4sh (amazing work on DMA stuff and secure boot as well)VMware GDB & IDA Pro setup - 0xnemi (use a while (true) loop and break into the VM)IntroductionVoyager is a Hyper-V hijacking project based upon existing Hyper-V hijacking work by cr4sh which aims to extend the usability to AMD and earlier Windows 10 versions. This project however does not support secure boot or legacy bios yet. I would highly suggest checking out cr4sh’s work on Hyper-V as this project is almost entirely based upon it with some minor differences in inject techniques.Hyper-V is a type-1 hypervisor written and maintained by Microsoft. Hyper-V supports both Intel and AMD virtualization technology and is the core component to virtualization-based security systems (VBS). Hyper-v imposes strict limitations upon windows kernel driver developers such as the inability to byte patch unwriteable sections in kernel drivers, the inability to disable write protection in CR0, the inability to globally patch ntdll.dll, and much more. Hyper-V launches prior to ntoskrnl and is completely inaccessible after launching. Thus getting inside of Hyper-V requires a bootkit.UEFI transfers control to bootmgfw.efi in 64bit longmode with a set of page tables already configured. The jump from writing a kernel driver to a UEFI driver (boot/runtime) is not that much of a leap. The default boot location for windows UEFI systems is EFI/Microsoft/Boot/bootmgfw.efi. This file is responsible for loading winload.efi. When control is transferred to winload.efi, bootmgfw.efi on disk must pass integrity checks done by winload. Although patching these integrity checks is easily possible, restoring bootmgfw.efi on disk is more desirable as if a critical error occurs during the boot process windows will boot normally.bootmgfw.efiVoyager’s UEFI boot driver replaces bootmgfw.efi on disk and thus is loaded after the next reboot. It restores bootmgfw.efi on disk with the original bootmgfw.efi. It then loads bootmgfw.efi into memory via LoadImage, applies inline hooks to bootmgfw, then runs the module via StartImage. You can see the hooks applied to bootmgfw.efi by looking inside of bootmgfw.c. An inline hook is placed on BlImgStartBootApplication which has the function prototype of EFI_STATUS (*)(VOID* AppEntry, VOID* ImageBase, UINT32 ImageSize, UINT8 BootOption, VOID* ReturnArgs). When this bootmgfw.efi function is called, control flow is transferred to ArchStartBootApplicationHook.EFI_STATUS EFIAPI ArchStartBootApplicationHook(VOID* AppEntry, VOID* ImageBase, UINT32 ImageSize, UINT8 BootOption, VOID* ReturnArgs) { // disable ArchStartBootApplication shithook DisableInlineHook(&BootMgfwShitHook); // on 1703 and below, winload does not export any functions if (!GetExport(ImageBase, "BlLdrLoadImage")) { VOID* ImgLoadPEImageEx = FindPattern( ImageBase, ImageSize, LOAD_PE_IMG_SIG, LOAD_PE_IMG_MASK ); gST->ConOut->ClearScreen(gST->ConOut); gST->ConOut->OutputString(gST->ConOut, AsciiArt); Print(L"\n"); Print(L"Hyper-V PayLoad Size -> 0x%x\n", PayLoadSize()); Print(L"winload.BlImgLoadPEImageEx -> 0x%p\n", RESOLVE_RVA(ImgLoadPEImageEx, 10, 6)); MakeInlineHook(&WinLoadImageHook, RESOLVE_RVA(ImgLoadPEImageEx, 10, 6), &BlImgLoadPEImageEx, TRUE); } else // else the installed windows version is between 2004 and 1709 { VOID* LdrLoadImage = GetExport(ImageBase, "BlLdrLoadImage"); VOID* ImgAllocateImageBuffer = FindPattern( ImageBase, ImageSize, ALLOCATE_IMAGE_BUFFER_SIG, ALLOCATE_IMAGE_BUFFER_MASK ); gST->ConOut->ClearScreen(gST->ConOut); gST->ConOut->OutputString(gST->ConOut, AsciiArt); Print(L"\n"); Print(L"Hyper-V PayLoad Size -> 0x%x\n", PayLoadSize()); Print(L"winload.BlLdrLoadImage -> 0x%p\n", LdrLoadImage); Print(L"winload.BlImgAllocateImageBuffer -> 0x%p\n", RESOLVE_RVA(ImgAllocateImageBuffer, 5, 1)); MakeInlineHook(&WinLoadImageHook, LdrLoadImage, &BlLdrLoadImage, TRUE); MakeInlineHook(&WinLoadAllocateImageHook, RESOLVE_RVA(ImgAllocateImageBuffer, 5, 1), &BlImgAllocateImageBuffer, TRUE); } return ((IMG_ARCH_START_BOOT_APPLICATION)BootMgfwShitHook.Address)(AppEntry, ImageBase, ImageSize, BootOption, ReturnArgs); } This hook applies further hooks on winload.efi. Depending on the Windows 10 version which Voyager is compiled for, a different set of hooks is applied to winload.efi. On Windows 10-1709 and above, winload.efi exports a bunch of useful routines which are called by other modules loaded by winload.efi. On older versions of Windows 10, these routines are copied into multiple files. For example, hvloader.(efi/dll) imports “BlLdrLoadImage” which is used to load Hyper-V. On 1703, a duplicate of “BlLdrLoadImage” is located inside of hvloader.(efi/dll). This is the beginning of the multi-winver nightmare of supporting all versions of Windows 10 and both Intel and AMD.After this bootmgfw.efi hook finishes, the original bytes are restored before the hook calls the original routine itself. Winload.efi will now create a new address space and switch between it and the UEFI handoff context. During the execution of winload.efi, hvloader.efi gets loaded into memory and subsequently, the Hyper-V module will be loaded into memory.winload.efiWinload.efi exports a plethora of utility routines such as map and unmap physical memory, allocate and deallocate virtual memory, read files from disk, and much more on 1703 versions of Windows 10 and up.BlLdrLoadImageOne such routine is called BlLdrLoadImage. This routine is used to load images from disk. It calls subsequent functions to allocate virtual memory for the module, resolve imports, map sections, and fix relocations. This routine is of interest in hooking as by placing a hook on this routine we can see what module is being loaded into memory.EFI_STATUS EFIAPI BlLdrLoadImage ( VOID* Arg1, CHAR16* ModulePath, CHAR16* ModuleName, VOID* Arg4, VOID* Arg5, VOID* Arg6, VOID* Arg7, PPLDR_DATA_TABLE_ENTRY lplpTableEntry, VOID* Arg9, VOID* Arg10, VOID* Arg11, VOID* Arg12, VOID* Arg13, VOID* Arg14, VOID* Arg15, VOID* Arg16 ) { if (!StrCmp(ModuleName, L"hv.exe")) HyperVloading = TRUE; // disable hook and call the original function... DisableInlineHook(&WinLoadImageHook); EFI_STATUS Result = ((LDR_LOAD_IMAGE)WinLoadImageHook.Address) ( Arg1, ModulePath, ModuleName, Arg4, Arg5, Arg6, Arg7, lplpTableEntry, Arg9, Arg10, Arg11, Arg12, Arg13, Arg14, Arg15, Arg16 ); // continue hooking until we inject/hook into hyper-v... if (!HookedHyperV) EnableInlineHook(&WinLoadImageHook); if (!StrCmp(ModuleName, L"hv.exe")) { HookedHyperV = TRUE; VOYAGER_T VoyagerData; PLDR_DATA_TABLE_ENTRY TableEntry = *lplpTableEntry; // add a new section to hyper-v called "payload", then fill in voyager data // and hook the vmexit handler... MakeVoyagerData ( &VoyagerData, TableEntry->ModuleBase, TableEntry->SizeOfImage, AddSection ( TableEntry->ModuleBase, "payload", PayLoadSize(), SECTION_RWX ), PayLoadSize() ); HookVmExit ( VoyagerData.HypervModuleBase, VoyagerData.HypervModuleSize, MapModule(&VoyagerData, PayLoad) ); // extend the size of the image in hyper-v's nt headers and LDR data entry... // this is required, if this is not done, then hyper-v will simply not be loaded... TableEntry->SizeOfImage = NT_HEADER(TableEntry->ModuleBase)->OptionalHeader.SizeOfImage; } return Result; } BlImgAllocateImageBufferAnother such routine is called “BlImgAllocateImageBuffer”, its responsible for allocating virtual memory for loading modules. The sizes passed to this routine come from the optional PE header field “SizeOfImage” which contains the virtual size of an image. This is the size of the image in memory. By setting a hook on this routine we can extend the size of the Hyper-V allocation to include the “SizeOfImage” of the Hyper-V payload. This allows for any sized payloads to be mapped under Hyper-V and thus within a 32bit range which allows for patching of RIP relative instructions such as JMP, CALL, MOV, etc.UINT64 EFIAPI BlImgAllocateImageBufferHook ( VOID** imageBuffer, UINTN imageSize, UINT32 memoryType, UINT32 attributes, VOID* unused, UINT32 Value ) { // // hv.exe // [BlImgAllocateImageBuffer] Alloc Base -> 0x7FFFF9FE000, Alloc Size -> 0x17C548 // [BlImgAllocateImageBuffer] Alloc Base -> 0xFFFFF80608120000, Alloc Size -> 0x1600000 // [BlImgAllocateImageBuffer] Alloc Base -> 0xFFFFF80606D68000, Alloc Size -> 0x2148 // [BlLdrLoadImage] Image Base -> 0xFFFFF80608120000, Image Size -> 0x1600000 // if (HyperVloading && !ExtendedAllocation && imageSize == HyperV->OptionalHeaders.SizeOfImage) { ExtendedAllocation = TRUE; imageSize += PayLoadSize(); // allocate the entire hyper-v module as rwx... memoryType = BL_MEMORY_ATTRIBUTE_RWX; } // disable hook and call the original function... DisableInlineHook(&WinLoadAllocateImageHook); UINT64 Result = ((ALLOCATE_IMAGE_BUFFER)WinLoadAllocateImageHook.Address) ( imageBuffer, imageSize, memoryType, attributes, unused, Value ); // keep hooking until we extend an allocation... if(!ExtendedAllocation) EnableInlineHook(&WinLoadAllocateImageHook); return Result; } Hyper-V Intel - vm exit handler location and hookingOne can easily locate the vmexit handler of Intel Hyper-V by searching for the immediate value 0x6C16 which is the VMCS field for host rip, better known as VMCS_HOST_RIP. Another method for finding the vmexit handler for Intel Hyper-V is by searching for the vmresume instruction. One should look for pushes or moves onto the stack, a call or jmp to another routine (“C/C++” vmexit handler) prior to the vmresume instruction. An example of Hyper-V’s 20H2 vmexit handler looks like the following.FFFFF8000023D36A vmexit_handler: FFFFF8000023D36A C7 44 24 30 00 00 00 00 mov dword ptr [rsp+arg_28], 0 FFFFF8000023D372 48 89 4C 24 28 mov [rsp+arg_20], rcx FFFFF8000023D377 48 8B 4C 24 20 mov rcx, [rsp+arg_18] FFFFF8000023D37C 48 8B 09 mov rcx, [rcx] FFFFF8000023D37F 48 89 01 mov [rcx], rax FFFFF8000023D382 48 89 51 10 mov [rcx+10h], rdx FFFFF8000023D386 48 89 59 18 mov [rcx+18h], rbx FFFFF8000023D38A 48 89 69 28 mov [rcx+28h], rbp FFFFF8000023D38E 48 89 71 30 mov [rcx+30h], rsi FFFFF8000023D392 48 89 79 38 mov [rcx+38h], rdi FFFFF8000023D396 4C 89 41 40 mov [rcx+40h], r8 FFFFF8000023D39A 4C 89 49 48 mov [rcx+48h], r9 FFFFF8000023D39E 4C 89 51 50 mov [rcx+50h], r10 FFFFF8000023D3A2 4C 89 59 58 mov [rcx+58h], r11 FFFFF8000023D3A6 4C 89 61 60 mov [rcx+60h], r12 FFFFF8000023D3AA 4C 89 69 68 mov [rcx+68h], r13 FFFFF8000023D3AE 4C 89 71 70 mov [rcx+70h], r14 FFFFF8000023D3B2 4C 89 79 78 mov [rcx+78h], r15 FFFFF8000023D3B6 48 8B 44 24 28 mov rax, [rsp+arg_20] FFFFF8000023D3BB 48 89 41 08 mov [rcx+8], rax FFFFF8000023D3BF 48 8D 41 70 lea rax, [rcx+70h] FFFFF8000023D3C3 0F 29 40 10 movaps xmmword ptr [rax+10h], xmm0 FFFFF8000023D3C7 0F 29 48 20 movaps xmmword ptr [rax+20h], xmm1 FFFFF8000023D3CB 0F 29 50 30 movaps xmmword ptr [rax+30h], xmm2 FFFFF8000023D3CF 0F 29 58 40 movaps xmmword ptr [rax+40h], xmm3 FFFFF8000023D3D3 0F 29 60 50 movaps xmmword ptr [rax+50h], xmm4 FFFFF8000023D3D7 0F 29 68 60 movaps xmmword ptr [rax+60h], xmm5 FFFFF8000023D3DB 48 8B 54 24 20 mov rdx, [rsp+arg_18] FFFFF8000023D428 E8 43 CF FF FF call sub_FFFFF8000023A370 FFFFF8000023D42D 65 C6 04 25 6D 00 00 00 00 mov byte ptr gs:6Dh, 0 FFFFF8000023D436 48 8B 4C 24 20 mov rcx, [rsp+arg_18] FFFFF8000023D43B 48 8B 54 24 30 mov rdx, [rsp+arg_28] FFFFF8000023D440 E8 BB 44 FD FF call vm_exit_c_handler FFFFF8000023D100 65 C6 04 25 6D 00 00 00 01 mov byte ptr gs:6Dh, 1 FFFFF8000023D110 48 8B 54 24 20 mov rdx, [rsp+arg_18] FFFFF8000023D115 4C 8B 42 10 mov r8, [rdx+10h] FFFFF8000023D2A3 48 8B 0A mov rcx, [rdx] FFFFF8000023D2A6 48 83 C1 70 add rcx, 70h ; 'p' FFFFF8000023D2B2 48 8B 59 A8 mov rbx, [rcx-58h] FFFFF8000023D2B6 48 8B 69 B8 mov rbp, [rcx-48h] FFFFF8000023D2BA 48 8B 71 C0 mov rsi, [rcx-40h] FFFFF8000023D2BE 48 8B 79 C8 mov rdi, [rcx-38h] FFFFF8000023D2C2 4C 8B 61 F0 mov r12, [rcx-10h] FFFFF8000023D2C6 4C 8B 69 F8 mov r13, [rcx-8] FFFFF8000023D2CA 4C 8B 31 mov r14, [rcx] FFFFF8000023D2CD 4C 8B 79 08 mov r15, [rcx+8] FFFFF8000023D30D C6 42 20 00 mov byte ptr [rdx+20h], 0 FFFFF8000023D311 0F 28 41 10 movaps xmm0, xmmword ptr [rcx+10h] FFFFF8000023D315 0F 28 49 20 movaps xmm1, xmmword ptr [rcx+20h] FFFFF8000023D319 0F 28 51 30 movaps xmm2, xmmword ptr [rcx+30h] FFFFF8000023D31D 0F 28 59 40 movaps xmm3, xmmword ptr [rcx+40h] FFFFF8000023D321 0F 28 61 50 movaps xmm4, xmmword ptr [rcx+50h] FFFFF8000023D325 0F 28 69 60 movaps xmm5, xmmword ptr [rcx+60h] FFFFF8000023D329 4D 8B 48 10 mov r9, [r8+10h] FFFFF8000023D32D 33 C0 xor eax, eax FFFFF8000023D32F BA 01 00 00 00 mov edx, 1 FFFFF8000023D334 41 0F B0 91 27 01 00 00 cmpxchg [r9+127h], dl FFFFF8000023D33C 48 8B 41 90 mov rax, [rcx-70h] FFFFF8000023D340 48 8B 51 A0 mov rdx, [rcx-60h] FFFFF8000023D344 4C 8B 41 D0 mov r8, [rcx-30h] FFFFF8000023D348 4C 8B 49 D8 mov r9, [rcx-28h] FFFFF8000023D34C 4C 8B 51 E0 mov r10, [rcx-20h] FFFFF8000023D350 4C 8B 59 E8 mov r11, [rcx-18h] FFFFF8000023D354 48 8B 49 98 mov rcx, [rcx-68h] FFFFF8000023D35A 0F 01 C3 vmresume Note: The call vm_exit_c_handler is of the utmost interest in the entire exit handler as the RIP relative virtual address of the call will be patched to call the Hyper-V payload vmexit handler.Hyper-V AMD - vm exit handler location and hookingUnlike Intel, AMD hypervisors directly interface with their v'''
