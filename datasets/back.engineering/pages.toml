title = "VMProtect 2 - Detailed Analysis of the Virtual Machine Architecture — BELabs"
description = "VMProtect 2 is a virtual machine based x86 obfuscator which converts x86 instructions to a RISC, stack machine, instruction set."
full_description = "May 18, 2021 · 67 min readVMProtect 2 - Detailed Analysis of the Virtual Machine ArchitectureVMProtect 2 is a virtual machine based x86 obfuscator which converts x86 instructions to a RISC, stack machine, instruction set.Download link: VMProtect 2 Reverse EngineeringTable Of ContentsCredit - Links to Existing WorkPreamble - Intentions and PurposePurposeIntentionsTerminologyIntroductionObfuscation - Deadstore, Opaque BranchingOpaque Branching Obfuscation ExampleDeadstore Obfuscation ExampleOverview - VMProtect 2 Virtual MachineRolling DecryptionNative Register UsageNon-Volatile Registers - Registers With Specific UsageVolatile Registers - Temp Registersvm_entry - Entering The Virtual Machinecalc_jmp - Decryption Of Vm Handler Indexvm_exit - Leaving The Virtual Machinecheck_vsp - relocate scratch registersVirtual Instructions - Opcodes, Operands, SpecificationsOperand Decryption - TransformationsVM Handlers - SpecificationsLCONST - Load Constant Value Onto StackLCONSTQ - Load Constant QWORDLCONSTCDQE - Load Constant DWORD Sign Extended to a QWORDLCONSTCBW - Load Constant Byte Convert To WordLCONSTCWDE - Load Constant Word Convert To DWORDLCONSTDW - Load Constant DWORDLREG - Load Scratch Register Value Onto StackLREGQ - Load Scratch Register QWORDLREGDW - Load Scratch Register DWORDSREG - Set Scratch Register ValueSREGQ - Set Scratch Register Value QWORDSREGDW - Set Scratch Register Value DWORDSREGW - Set Scratch Register Value WORDSREGB - Set Scratch Register Value ByteADD - Add Two ValuesADDQ - Add Two QWORD ValuesADDW - Add Two WORDS ValuesADDB - Add Two Bytes ValuesMUL - Unsigned MultiplicationMULQ - Unsigned Multiplication of QWORD’sDIV - Unsigned DivisionDIVQ - Unsigned Division Of QWORD’sREAD - Read MemoryREADQ - Read QWORDREADDW - Read DWORDREADW - Read WordWRITE - Write MemoryWRITEQ - Write Memory QWORDWRITEDW - Write DWORDWRITEW - Write WORDWRITEB - Write ByteSHL - Shift LeftSHLCBW - Shift Left Convert Result To WORDSHLW - Shift Left WORDSHLDW - Shift Left DWORDSHLQ - Shift Left QWORDSHLD - Shift Left Double PrecisionSHLDQ - Shift Left Double Precision QWORDSHLDDW - Shift Left Double Precision DWORDSHR - Shift RightSHRQ - Shift Right QWORDSHRD - Double Precision Shift RightSHRDQ - Double Precision Shift Right QWORDSHRDDW - Double Precision Shift Right DWORDNAND - Not Then AndNANDW - Not Then And WORD’sREADCR3 - Read Control Register ThreeWRITECR3 - Write Control Register ThreePUSHVSP - Push Virtual Stack PointerPUSHVSPQ - Push Virtual Stack Pointer QWORDPUSHVSPDW - Push Virtual Stack Pointer DWORDPUSVSPW - Push Virtual Stack Pointer WORDLVSP - Load Virtual Stack PointerLVSPW - Load Virtual Stack Pointer WordLVSPDW - Load Virtual Stack Pointer DWORDLRFLAGS - Load RFLAGSJMP - Virtual Jump InstructionCALL - Virtual Call InstructionSignificant Virtual Machine Signatures - Static AnalysisLocating VM Handler TableLocating VM Handler Table Entry DecryptionHandling Transformations - Templated Lambdas and MapsExtracting Transformations - Static Analysis ContinuedStatic Analysis Dilemma - Static Analysis Conclusionvmtracer - Tracing Virtual Instructionsvmprofile-cli - Static Analysis Using Runtime TracesDisplaying Trace Information - vmprofiler-qtVirtual Machine BehaviorDemo - Creating and Inspecting A Virtual TraceAltering Virtual Instruction ResultsEncoding Virtual Instructions - Inverse TransformationsConclusion - Static Analysis, Dynamic AnalysisCredit - Links to Existing WorkSamuel ChevetInside VMProtect 2Inside VMProtect 2 SlidesRolf RollesUnpacking Virtualization ObfuscatorsVMProtect 2 - Reverse EngineeringAnatoli KalyschVMAttack IDA PRO PluginCan BölükVTIL (Virtual-machine Translation Intermediate Language)NoVmp - A static devirtualizer for VMProtect x64 3.x powered by VTIL.Katy HearthstoneVMProtect Control Flow Obfuscation (Case study: string algorithm cryptanalysis in Honkai Impact 3rd)IRQL0Helped created vmprofiler v1.0, and helped with general analysis of vm handlers.BTBDProviding an algorithm to handle deadstore removal with Zydis.Preamble - Intentions and PurposeBefore diving into this post I would like to state a few things in regards to existing VMProtect 2 work, the purpose of this article, and my intentions, as these seem to become misconstrued and distorted at times.PurposeAlthough there has been a lot of research already conducted on VMProtect 2, I feel that there is still information which has not been discussed publicly nor enough source code disclosed to the public. The information I am disclosing in this article aims to go beyond generic architectural analysis but much lower. The level in which one could encode their own virtual machine instructions given a VMProtect’ed binary as well as intercept and alter results of virtual instructions with ease. The dynamic analysis discussed in this article is based upon existing work by Samuel Chevet, my dynamic analysis research and vmtracer project is simply an expansion upon his work demonstrated in his presentation “Inside VMProtect”.IntentionsThis post is not intending to cast any negative views upon VMProtect 2, the creator(s) of said software or anyone who uses it. I admire the creator(s) who clearly have impressive skills to create such a product.This post has also been created under the impression that everything discussed here has most likely been discovered by private entities, and that I am not the first to find or document such things about the VMProtect 2 architecture. I am not intending to present this information as though it is ground breaking or something that no one else has already discovered, quite the opposite. This is simply a collection of existing information appended with my own research.This being said, I humbly present to you, “VMProtect 2, Detailed Analysis of the Virtual Machine Architecture”.TerminologyVIP - Virtual Instruction Pointer, this equivalent to the x86-64 RIP register which contains the address of the next instruction to be executed. VMProtect 2 uses the native register RSI to hold the address of the next virtual instruction pointer. Thus RSI is equivalent to VIP.VSP - Virtual Stack Pointer, this is equivalent to the x86-64 RSP register which contains the address of the stack. VMProtect 2 uses the native register RBP to hold the address of the virtual stack pointer. Thus RBP is equivalent to VSP.VM Handler - A routine which contains the native code to execute a virtual instruction. For example, the VADD64 instruction adds two values on the stack together and stores the result as well as RFLAGS on the stack.Virtual Instruction - Also known as “virtual bytecode” is the bytes interpreted by the virtual machine and subsequently executed. Each virtual instruction is composed of at least one or more operands. The first operand contains the opcode for the instruction.Virtual Opcode - The first operand of every virtual instruction. This is the vm handler index. The size of a VMProtect 2 opcode is always one byte.IMM / Immediate Value - A value encoded into a virtual instruction by which operations are to happen upon, such as loading said value onto the stack or into a virtual register. Virtual instructions such as LREG, SREG, and LCONST all have immediate values.Transformations - The term “transform” used throughout this post refers specifically to operations done to decrypt operands of virtual instructions and vm handler table entries. These transformations consist of add, sub, inc, dec, not, neg, shl, shr, ror, rol, and lastly BSWAP. Transformations are done with sizes of 1, 2, 4, and 8 bytes. Transformations can also have immediate/constant values associated with them such as “xor rax, 0x123456”, or “add rax, 0x123456”.IntroductionVMProtect 2 is a virtual machine based x86 obfuscator which converts x86 instructions to a RISC, stack machine, instruction set. Each protected binary has a unique set of encrypted virtual machine instructions with unique obfuscation. This project aims to disclose very significant signatures which are in every single VMProtect 2 binary with the intent to aid in further research. This article will also briefly discuss different types of VMProtect 2 obfuscation. All techniques to deobfuscate are tailor specifically to virtual machine routines and will not work on generally obfuscated routines, specifically routines which have real JCC’s in them.Obfuscation - Deadstore, Opaque BranchingVMProtect 2 uses two types of obfuscation for the most part, the first being deadstore, and the second being opaque branching. Throughout obfuscated routines you can see a few instructions followed by a JCC, then another set of instructions followed by another JCC. Another contributing part of opaque branching is random instructions which affect the FLAGS register. You can see these little buggers everywhere. They are mostly bit test instructions, useless compares, as well as set/clear flags instructions.Opaque Branching Obfuscation ExampleIn this opaque branching obfuscation example I will go over what VMProtect 2 opaque branching looks like, other factors such as the state of rflags, and most importantly how to determine if you are looking at an opaque branch or a legitimate JCC.ror al, 1 bswap edx bswap dx movsx dx, dl inc rsi btc rdx, 0Fh neg al jno loc_target1 sar dx, 4 sub edx, 47CD94ECh sub bl, al sal dh, cl btr dx, 0Eh mov edx, [rax+rdi] Consider the above obfuscated code. Notice the JNO branch. If you follow this branch in ida and compare the instructions against the instructions after the JNO you can see that the branch is useless as both paths execute the same meaningful instructions.loc_target1: cmc btr edx, ecx movsx edx, bl and dx, si sub bl, al cmp rdx, 4EAA0438h lea rdx, [rax-440AAF70h] sal dl, cl rol dl, cl mov edx, [rax+rdi] If you look close enough you can see that there are a few instructions which are in both branches. It can be difficult to determine what code is deadstore and what code is required, however if you select a register in ida and look at all the places it is written to prior to the instruction you are looking at, you can remove all of those other writing instructions up until there is a read of said register. Now, back to the example, In this case the following instructions are what matter:sub bl, al mov edx, [rax+rdi] Generation of these opaque branches makes it so there are duplicate instructions. For each code path there is also more deadstore obfuscation as well as opaque conditions and other instructions that affect RFLAGS.Deadstore Obfuscation ExampleVMProtect 2 deadstore obfuscation adds the most junk to the instruction stream aside from opaque bit tests and comparisons. These instructions serve no purpose and can be spotted and removed by hand with ease. Consider the following:rcl di, cl pop rax shld r11w, bx, 1 pop r11 and dh, 0CAh not di pop rdi rol r9w, 0Ch stc pop r8 cmc clc shl r9w, 0Bh pop rdx cmp cx, 0D2EBh bt rcx, rsi pop r9 and r10w, sp rcl r10d, 10h pop r10 btc cx, 0Ch bswap r12 cmp rax, 0FFFFFFFFC77D7497h pop r12 rol cx, cl cmc btr bp, 1 sar r14w, cl pop rbp sub r14w, si or si, si add esi, eax xadd si, cx popfq setnle cl setle cl movsx r14, al pop rcx not ecx pop rcx lea r13, [rax-36D7E613h] not si pop r14 not si movsx r13w, dl mov r13d, 0B7486BB2h pop rsi mov r13w, 44CAh lea r13, [rbx+14631131h] bswap r13d pop r13 retn Let’s start from the top, one instruction at a time. The first instruction at 0x140004149 is “RCL - Rotate Left Carry”. This instruction affects the FLAGS register as well as DI. Lets see the next time DI is referenced. Is it a read or a write? The next reference to DI is the NOT instruction at 0x140004158. NOT reads and writes DI, so far both instructions are valid. The next instruction that references DI is the POP instructions. This is critical as all write’s to RDI prior to this POP can be removed from the instruction stream.pop rax shld r11w, bx, 1 pop r11 and dh, 0CAh pop rdi The next instruction is POP RAX at 0x14000414C. RAX is never written too throughout the entire instruction stream it is only read from. Since it has a read dependency this instruction cannot be removed. Moving onto the next instruction, SHLD - double precision shift left, a write dependency on R11, read dependency on BX. The next instruction that references R11 is the POP R11 at 0x140004153. We can remove the SHLD instruction as its deadstore.pop rax pop r11 and dh, 0CAh pop rdi Now just repeat the process for every single instruction. The end result should look something like this:pop rax pop r11 pop rdi pop r8 pop rdx pop r9 pop r10 pop r12 pop rbp popfq pop rcx pop rcx pop r14 pop rsi pop r13 retn This method is not perfect for removing deadstore obfuscation as there is a second POP RCX which is missing from this result above. POP and PUSH instructions are special cases which should not be emitted from the instruction stream as these instructions also change RSP. This method for removing deadstore is also only applied to vm_entry and vm handlers. This cannot be applied to generically obfuscated routines as-is. Again, this method is NOT going to work on any obfuscated routine, it’s specifically tailored for vm_entry and vm handlers as these routines have no legitimate JCC’s in them.Overview - VMProtect 2 Virtual MachineVirtual instructions are decrypted and interpreted by virtual instruction handlers referred to as “vm handlers”. The virtual machine is a RISC based stack machine with scratch registers. Prior to vm-entries an encrypted RVA (relative virtual address) to virtual instructions is pushed onto the stack and all general purpose registers as well as flags are pushed onto the stack. The VIP is decrypted, calculated, and loaded into RSI. A rolling decryption key is then started in RBX and is used to decrypt every single operand of every single virtual instruction. The rolling decryption key is updated by transforming it with the decrypted operand value.Rolling DecryptionVMProtect 2 uses a rolling decryption key. This key is used to decrypt virtual instruction operands, which subsequently prevents any sort of hooking, as if any virtual instructions are executed out of order the rolling decryption key will become invalid causing further decryption of virtual operands to be invalid.Native Register UsageDuring execution inside of the virtual machine, some natiive registers are dedicated for the virtual machine mechanisms such as the virtual instruction pointer and virtual stack. In this section I will be discussing these native registers and their uses for the virtual machine.Non-Volatile Registers - Registers With Specific UsageTo begin, RSI is always used for the virtual instruction pointer. Operands are fetched from the address stored in RSI. The initial value loaded into RSI is done by vm_entry.RBP is used for the virtual stack pointer, the address stored in RBP is actually the native stack memory. RBP is loaded with RSP prior to allocation of scratch registers. This brings us to RDI which contains scratch registers. The address in RDI is initialized as we"
