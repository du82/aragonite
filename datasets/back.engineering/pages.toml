title = "VMProtect 2 - Part Two, Complete Static Analysis — BELabs"
description = "The purpose of this article is to expound upon the prior work disclosed in the last article titled, VMProtect 2 - Detailed Analysis of the Virtual Machine Architecture, as well as correct a few mistakes."
full_description = '''Jun 21, 2021 · 28 min readVMProtect 2 - Part Two, Complete Static AnalysisThe purpose of this article is to expound upon the prior work disclosed in the last article titled, VMProtect 2 - Detailed Analysis of the Virtual Machine Architecture, as well as correct a few mistakes.VMProtect 2 Project’s Group: githacks.org/vmp2Table Of ContentsPurposeIntentionsDefinitionsVMProtect 2 - Project’s OverviewVMHook - OverviewVMHook - Example, um-hookVMProfiler - OverviewVMProfiler - Virtual Machine Handler ProfilingVMProfiler - Virtual Branch Detection AlgorithmVMProfiler Qt - OverviewVMProfiler CLI - OverviewVMEmu - OverviewVMEmu - Unicorn Engine, Static Decryption Of OpcodesVMEmu - Virtual BranchingVMAssembler - OverviewVMAssembler - Assembler StagesVMAssembler - Stage One, Lexical Analysis and ParsingVMAssembler - Stage Two, Virtual Instruction EncodingVMAssembler - Stage Three, Virtual Instruction EncryptionVMAssembler - Stage Four, C++ Header GenerationVMAssembler - ExampleVTIL - Getting StartedVTIL - The Basic BlockVTIL - VMProfiler LiftingConclusion - Final Words and Future WorkConclusion - Future WorkPurposeThe purpose of this article is to expound upon the prior work disclosed in the last article titled “VMProtect 2 - Detailed Analysis of the Virtual Machine Architecture”, as well as correct a few mistakes. In addition, this post will focus primarily on the creation of static analysis tools using the knowledge disclosed in the prior post, and providing some detailed, albut unofficial, VTIL documentation. This article will also showcase all projects on githacks.org/vmp2, however, these projects are subject to change.IntentionsMy intentions behind this research is to further my knowledge in the subject of software protection via native code virtualization, and code obfuscation, it is not to profit nor slander the name of VMProtect. Rather, the creator(s) of said software are to be respected as their work is clearly impressive and has arguably stood the test of time.DefinitionsCode Block: A virtual instruction block, or code block, is a sequence of virtual instructions which are contained between virtual branching instructions. An example of this would be any instructions following a JMP instruction and the next JMP or VMEXIT instruction. A code block is represented in C++ as a structure (vm::instrs::code_block_t) containing a vector of virtual instructions, along with the beginning address of the code block contained in the structure itself. Other metadata about a given code block is also contained inside of this structure such as if the code block branches to two other code blocks, branches to only one code block, or exits the virtual machine.VMProtect 2 IL: Intermediate level of representation, or language. Consider the encoded and encrypted virtual instructions to be the usable, native form of virtual instructions. Then IL would be a higher level representation, typically IL representation refers to a representation of code used by compilers and assemblers. An example of VMProtect 2 IL is what VMAssembler does lexical analysis on, or a file containing the IL to be more specific.VMProtect 2 - Project’s OverviewNote: you can find the doxygen for VMProfiler hereAlthough there may seem to be quite a handful of projects located at githacks.org/vmp2, there is really only a single large library project and smaller projects which inherit this library. VMProfiler is the base library for VMProfiler Qt, VMProfiler CLI, VMEmu, and VMAssembler. Each of these projects are static analysis based and thus VMHook and um-hook do not inherit VMProfiler.VMHook - OverviewVMHook is a very small C++ framework for hooking into VMProtect 2 virtual machines, um-hook inherits this framework and provides a demonstration of how to use the framework. VMHook is not used to uncover virtual instructions and their functionality, rather to alter them.VMHook - Example, um-hook.data __mbase dq 0h public __mbase .code __lconstbzx proc mov al, [rsi] lea rsi, [rsi+1] xor al, bl dec al ror al, 1 neg al xor bl, al pushfq ; save flags... cmp ax, 01Ch je swap_val ; the constant is not 0x1C popfq ; restore flags... sub rbp, 2 mov [rbp], ax mov rax, __mbase add rax, 059FEh ; calc jmp rva is 0x59FE... jmp rax swap_val: ; the constant is 0x1C popfq ; restore flags... mov ax, 5 ; bit 5 is VMX in ECX after CPUID... sub rbp, 2 mov [rbp], ax mov rax, __mbase add rax, 059FEh ; calc jmp rva is 0x59FE... jmp rax __lconstbzx endp end um-hook is a project which inherits VMHook, it demonstrates hooking the LCONSTBZX virtual instruction and spoofing its immediate value. This subsequently affects the later virtual shift functions result, which ultimately results in the virtual routine returning true instead of false.VMProfiler - OverviewVMProfiler is a C++ library which is used for static analysis of VMProtect 2 binaries. This is the base project for VMProfiler Qt, VMProfiler CLI, VMEmu, and VMAssembler. VMProfiler also inherits VTIL and contains virtual machine handler profiles and lifters.VMProfiler - Virtual Machine Handler ProfilingVirtual machine handlers are found and categorized via a pattern matching algorithm. The first iteration of this algorithm simply compared the native instructions bytes. However this has proven to be ineffective as changes to the native instruction which don’t result in a different outcome but do change the native instructions bytes will cause the algorithm to miscatagorize or even fail to recongnize virtual machine handlers. Consider the following instruction variants, all of which when executed have the same result but each has their own unique sequence of bytes.0: 36 48 8b 00 mov rax,QWORD PTR ss:[rax] 4: 48 8b 00 mov rax,QWORD PTR [rax] 0: 36 48 8b 04 05 00 00 mov rax,QWORD PTR ss:[rax*1+0x0] 7: 00 00 In order to handle such cases, a new iteration of the profiling algorithm has been designed and implemented. This new rendition still pattern matches, however for each instruction of a virtual machine handler a lambda is defined. This lambda takes in a ZydisDecodedInstruction parameter, by reference, and returns a boolean. The result being true if a given decoded instruction meets all of the comparison cases. The usage of zydis for this purpose allows for one to compare operands at a much finer level. For example, operand two from both instructions in the figure above is of type ZYDIS_OPERAND_TYPE_MEMORY. In addition, the base of this memory operand for both instructions is RAX. The mnemonic of both instructions is the same. This sort of minimalist comparison thinking is what this rendition of the profiling algorithm is based off of.vm::handler::profile_t readq = { // MOV RAX, [RAX] // MOV [RBP], RAX "READQ", READQ, NULL, { { // MOV RAX, [RAX] []( const zydis_decoded_instr_t &instr ) -> bool { return instr.mnemonic == ZYDIS_MNEMONIC_MOV && instr.operands[ 0 ].type == ZYDIS_OPERAND_TYPE_REGISTER && instr.operands[ 0 ].reg.value == ZYDIS_REGISTER_RAX && instr.operands[ 1 ].type == ZYDIS_OPERAND_TYPE_MEMORY && instr.operands[ 1 ].mem.base == ZYDIS_REGISTER_RAX; }, // MOV [RBP], RAX []( const zydis_decoded_instr_t &instr ) -> bool { return instr.mnemonic == ZYDIS_MNEMONIC_MOV && instr.operands[ 0 ].type == ZYDIS_OPERAND_TYPE_MEMORY && instr.operands[ 0 ].mem.base == ZYDIS_REGISTER_RBP && instr.operands[ 1 ].type == ZYDIS_OPERAND_TYPE_REGISTER && instr.operands[ 1 ].reg.value == ZYDIS_REGISTER_RAX; } } } }; In the figure above, the READQ profile is displayed. Notice that not every single instruction for a virtual machine handler must have a zydis lambda for it. Only enough for a unique profile to be constructed for it. There are in fact additional native instructions for READQ which are not accounted for with zydis comparison lambdas.VMProfiler - Virtual Branch Detection AlgorithmThe most glaring consistency in a virtual branch is the usage of PUSHVSP. This virtual instruction is executed when two encrypted values are on the stack at VSP + 0, and VSP + 8. These encrypted values are decrypted using the last LCONSTDW value of a given block. Thus a trivially small algorithm can be created based upon these two consistencies. The first part of the algorithm will simply use std::find_if with reverse iterators to locate the last LCONSTDW in a given code block. This DWORD value will be interpreted as the XOR key used to decrypt the encrypted relative virtual addresses of both branches. A second std::find_if is now executed to locate a PUSHVSP virtual instruction that when executed, two encrypted relative virtual addresses will be located on the stack. The algorithm will interpret the top two stack values of every PUSHVSP instruction as encrypted relative virtual addresses and apply an XOR operation with the last LCONSTDW value.std::optional< jcc_data > get_jcc_data( vm::ctx_t &vmctx, code_block_t &code_block ) { // there is no branch for this as this is a vmexit... if ( code_block.vinstrs.back().mnemonic_t == vm::handler::VMEXIT ) return {}; // find the last LCONSTDW... the imm value is the JMP xor decrypt key... // we loop backwards here (using rbegin and rend)... auto result = std::find_if( code_block.vinstrs.rbegin(), code_block.vinstrs.rend(), []( const vm::instrs::virt_instr_t &vinstr ) -> bool { auto profile = vm::handler::get_profile( vinstr.mnemonic_t ); return profile && profile->mnemonic == vm::handler::LCONSTDW; } ); jcc_data jcc; const auto xor_key = static_cast< std::uint32_t >( result->operand.imm.u ); const auto &last_trace = code_block.vinstrs.back().trace_data; // since result is already a variable and is a reverse itr // i'm going to be using rbegin and rend here again... // // look for PUSHVSP virtual instructions with two encrypted virtual // instruction rva's ontop of the virtual stack... result = std::find_if( code_block.vinstrs.rbegin(), code_block.vinstrs.rend(), [ & ]( const vm::instrs::virt_instr_t &vinstr ) -> bool { if ( auto profile = vm::handler::get_profile( vinstr.mnemonic_t ); profile && profile->mnemonic == vm::handler::PUSHVSP ) { const auto possible_block_1 = code_block_addr( vmctx, vinstr.trace_data.vsp.qword[ 0 ] ^ xor_key ), possible_block_2 = code_block_addr( vmctx, vinstr.trace_data.vsp.qword[ 1 ] ^ xor_key ); // if this returns too many false positives we might have to get // our hands dirty and look into trying to emulate each branch // to see if the first instruction is an SREGQ... return possible_block_1 > vmctx.module_base && possible_block_1 < vmctx.module_base + vmctx.image_size && possible_block_2 > vmctx.module_base && possible_block_2 < vmctx.module_base + vmctx.image_size; } return false; } ); // if there are not two branches... if ( result == code_block.vinstrs.rend() ) { jcc.block_addr[ 0 ] = code_block_addr( vmctx, last_trace ); jcc.has_jcc = false; jcc.type = jcc_type::absolute; } // else there are two branches... else { jcc.block_addr[ 0 ] = code_block_addr( vmctx, result->trace_data.vsp.qword[ 0 ] ^ xor_key ); jcc.block_addr[ 1 ] = code_block_addr( vmctx, result->trace_data.vsp.qword[ 1 ] ^ xor_key ); jcc.has_jcc = true; jcc.type = jcc_type::branching; } return jcc; } Note: the underlying flag in which the virtual branch is dependent on is not extracted using this algorithm. This is one of the negative aspects of this algorithm as it stands.VMProfiler Qt - OverviewVMProfiler Qt is a small C++ Qt based GUI that allows for inspection of virtual instruction traces. These traces are generated via VMEmu and contain all information for every virtual instruction. The GUI contains a window for virtual register values, native register values, the virtual stack, virtual instructions, expandable virtual branches, and lastly a tab containing all virtual machine handlers and their native instructions, and transformations.VMProfiler CLI - OverviewVMProfiler CLI is a command line project which is used to demonstrate all VMProfiler features. This project only consists of a single file (main.cpp), however it’s a good reference for those who are interested in inheriting VMProfiler as their code base.Usage: vmprofiler-cli [options...] Options: --bin, --vmpbin unpacked binary protected with VMProtect 2 --vmentry, --entry rva to push prior to a vm_entry --showhandlers show all vm handlers... --showhandler show a specific vm handler given its index... --vmp2file path to .vmp2 file... --showblockinstrs show the virtual instructions of a specific code block... --showallblocks shows all information for all code blocks... --devirt lift to VTIL IR and apply optimizations, then display the output... -h, --help Shows this page VMEmu - OverviewVMEmu is a unicorn-engine based project which emulates virtual machine handlers to subsequently decrypt virtual instruction operands. VMEmu inherits VMProfiler which aids in determining if a given code block has a virtual JCC in it. VMEmu does not currently support dumped modules as “dumped modules” can take many forms. There is not one standard file format for a dumped module so support for dumped modules will come with another unicorn-engine based project to produce a standard dump format.Usage: vmemu [options...] Options: --vmentry relative virtual address to a vm entry... (Required) --vmpbin path to unpacked virtualized binary... (Required) --out output file name for trace file... (Required) -h, --help Shows this page VMEmu - Unicorn Engine, Static Decryption Of OpcodesIn order to statically decrypt virtual instruction operands, one must first understand how these operands are encrypted in the first place. The algorithm VMProtect 2 uses to encrypt virtual instruction operands can be represented as a mathematical formula.$$\text{Let } F_n \text{ be an encryption function and } T_{m,F_n} \text{denote the } m\text{th transformation of function } F_n:$$ $$F_0(e, o) = T_{4, F_0} \circ T_{3, F_0}\circ T_{2, F_0} \circ T_{1, F_0} \circ T_{0, F_0}(e, o)$$ $$ G_0(e, o) = T_{1, F_0}(F_0(e, o), e) $$ $$\text{Thus:}$$ $$\text{key}_{n+1} = G_n(\text{key}_n, \text{operand}_n)$$ $$\text{operand}_{n+1} = F_n(\text{key}_n, \text{operand}_n)$$ $$\text{Furthermore:}$$ $$T_{m, F_n} \text{ maps to a given vm::transformation::type such that } T_{0, F_n} = \text {vm::transform::type::generic\textunderscore0},$$ $$T_{1, F_n} = \text{ vm::transform::type::rolling\textunderscore key }, …, T_{6, F_n} = \text{ vm::transform::type::update\textunderscore key }$$Considering the above figure, decryption of operands is merely the inverse of function $F$. This inverse is generated into native x86_64 instructions and embedded into each virtual machine handler as well as calc_jmp. One could simply emulate these instructions via reimplementation of them in C/C++, however my implementation of such instructions is merely for the purpose of encryption, not decryption. Instead, the usage of unicorn-engine is preferred in this situation as by simply emulating these virtual machine handlers, decrypted operands will be produced.Understand that no runtime value can possibly affect the decryption of operands, thus invalid memor'''
