["https://back.engineering/privacy"]
title = "Privacy Policy — BELabs"
description = "We specialize in consulting services for reverse engineering, tool development, software deobfuscation, and obfuscation techniques. Additionally, we actively contribute to public research in these domains, enhancing industry knowledge."
full_description = "Privacy PolicyLast updated: May 12, 2024Privacy PolicyBack Engineering Labs Inc.At Back Engineering Labs Inc. we believe strongly in fundamental privacy rights- and that those fundamental rights should not differ depending on where you live in the world. That’s why we treat any data that relates to an identified or identifiable individual or that is linked or linkable to them by Back Engineering Labs Inc., as “personal data,” no matter where the individual lives. As soon as you visited our website https://back.engineering or contact us, we receive information about you. In this privacy statement we explain what we do with that information. We always handle your information with care and store it securely. If you have any questions or want to know what information we have on you, please contact us at contact@back.engineering. We may amend this privacy statement if necessary. We recommend that you regularly review this privacy statement so that you are aware of these changes. This privacy statement was last modified on April 27 ste, 2024.ContentWhen do apply this privacy statement?Who uses your data?Whose data do we use?How do we get your data?What data of you do we use?What do we use your data for?How long do we store your data?Who do we share your data with?Where do where store your data?How safe is your data with us?What are your rights?What rules apply to this privacy statement?Which cookies do we use?What do we do with data of minors?Do you have a question about this privacy policy?Notice for California and Delaware residents and other statesYour Rights in the EU**1. When do you apply this privacy statementThis privacy statement applies to all personal data that we process and to all domains related to us. This concerns the personal data of everyone who has ever had contact with us or visited our website, such as visitors, customers and business contacts. Personal data is all data that can be traced back to you as an individual, such as your name, screenshots if there is an issue, IP address, or surfing behaviour.2. Who uses your data?The owners are responsible for the website https://back.engineering and therefore the responsible organization for the use of your personal data as described in this privacy statement.3. Whose data do we use?We process the personal data of everyone who has had contact with us or visited our website. These include visitors, private customers, business customers and contact persons of our partners.4. How do we get your data?We receive the data directly from you as soon as you:visit our websitefill in data on our websitecontact us by mail, telephone or other means5. What data of you do we use?At Back Engineering Labs Inc. we believe that you can have great products and great privacy. This means that we strive to collect only the personal data that we need. We use the following data:Account information. Your Back Engineering Labs Inc. ID and related account details, including email address, devices registered, account status and age.Device information. Data from which your device could be identified, such as device serial number, or about your device, such as browser type.Contact information. Data such as name, email address, physical address, phone number, or other contact information.Payment information. Data about your billing address and method of payment, such as bank details, credit, debit, or other payment card information.Transaction information. Data about purchases of Back Engineering Labs Inc. products and services or transactional facilitated by Back Engineer Labs Inc., including purchases on Back Engineer Labs Inc. platforms.Fraud prevention Information. Data used to help identify and prevent fraud, including a device trust score.Usage Data. Data about your activity on and use of our offerings, such as server launches within our services, including browsing history; search history; product interaction; crash data, performance and other diagnostic data; and other usage data.Location Information. Precise location only to support services such as where you are agree for region-specific services, and coarse location.Government ID Data. In certain jurisdictions, we may ask for a government-issued ID in limited circumstances, including when setting up a wireless account and activating your device, for the purpose of extending commercial credit, managing reservations, or as required by law.Other Information You provide to Us. Details such as the content of your communications with Back Engineer Labs Inc., including interactions with customer support and contract through social media channels.You are not required to provide the personal data that we have requested. However, if you choose not to do so, in many cases we will not be able to provide you with our products or services or respond to requests you may have.6. What do we use your data for?We only use your personal data for the purpose for which we are allowed to use it:we use your data because we want to give you the best service as a customer.7. How long do we store your data?We keep your personal data for as long as we are required to do so by law and for as long as necessary for the purpose for which we use your data. For example, as long as you are a customer with us, we store your data according to the regulation RIN 3235-AI74 retention period of seven years. After that, we only keep your data for statistical purposes and to handle any complaints or legal matters. If you want to know more about how long we store specific data about you, please contact us.8. Who do we share your data with?We only process your personal data ourselves. We don’t share your personal data with others.9. Where do where store your data?The data that we collect from you may be transferred to, and stored at a server of Back Engineering Labs Inc. a destination outside of the European Economic Area (“EEA”) including for the purposes of our hosting and data center provider. It may also be processed by staff operating outside the EEA who work for us for one of our suppliers. Such staff maybe engaged in, among other things, the processing of your payment details. By submitting your personal data, you agree to this transfer, storing or processing. We will take all steps reasonably necessary to ensure that your data is treated securely and in accordance with this privacy policy. All information you provide to us is stored on your secure servers. Where we have given you (or where you have chosen) a password which enables you to access certain parts of our site, you are responsible for keeping this password confidential. We ask you not to share a password with anyone. Unfortunately, the transmission of information via the internet is not completely secure. Although we will do our best to protect your personal data, we cannot guarantee the security of your data transmitted to our site; any transmission is at your own risk. Once we have received your information, we will use strict procedures and security features to try to prevent unauthorized access. Your Rights We will not share your personal data for marketing purposes. Our site may, from time to time, contain links to and from the websites of our partner networks, advertisers and affiliates. If you follow a link to any of these websites, please note that these websites have their own privacy policies and that we do not accept any responsibility or liability for these policies.Please check these policies before you submit any personal data to these websites. Access to information GPDR Right of Access gives you the right to access information held about you. Your right of access can be exercised in accordance with the Act. Any access request may be subject to a fee of 10 dollars to meet our costs in providing you with details of the information we hold about you. Changes to our privacy policy any changes we may make to our privacy policy in the future will be posted on this page and, where appropriate, notified to you by e-mail. Please check back frequently to see any updates or changes to our privacy policy.10. How safe is your data with us?We have done a lot to protect your data as well as possible, both organisationally and technical. We have secured our systems and various means of communication to ensure that your data does not end up in the hands of others. Your data is therefore safe with us. We also ensure that your data is only used by people who have received permission from us. If you have any questions about the specific method of securing, please contact us on contact@back.engineering.11. What are your rights?Because we use your data personal data, you have various rights. We have listed these rights for you below.Right to information We must explain to you in an understandable and clear manner what we do with your data and what control you have over it. that is why we explain in detail in this privacy statement what data we collect from you and how handle your data.Right to access You may always ask us to view the data we hold about you.Right to correction You may ask us to have your data corrected if it is incorrect or incomplete.Right to object You may object to the processing of your data if you do not agree with the way we handle your personal data. This right applies to the data we use for direct marketing. You can indicate to us that you no longer wish to receive e-mails from us. This also applies to personalized recommendations on our website.Right to data portability If you are a customer of ours or if you have given permission for the use of your data, you may ask us to send you the digital data we have about you. This way you can transfer that data to another organisation if you wish.Right to restriction You may ask to limit the use of your data. This means that in certain cases we may only store your data but not use it.Right to be forgotten You may ask us to delete all data we have about you. We will then delete all data that can be traced back to you. In some cases we cannot or may not yet delete your data. For example, we have to keep some data for 7 years for the Internal Revenue Service.Right to submit a complaint You may submit a complaint about the way in which we handle your data. If you have a complaint, we will be happy to resolve it for you. To do so, please contact contact@back.engineering.How do I submit a request or complaint? You can submit your request or complaint to contact@back.engineering. We process every request or complaint within 30 days. If you submit multiple applications or complaints or if you submit a complex request or complaint, this may take more time. In that case, we will contact you within 60 days at the latest. We may ask you to identify yourself. In that case, we will ask you to submit certain information to ensure that you are the correct person whose personal data is.12. What rules apply to this privacy statement?Our privacy statement must meet several conditions. These conditions can be found in particular in the U.S. privacy laws. In addition, the general rules that apply under California state law and US federal law apply to our privacy statement.13. Which cookies do we use?You can indicate your what data we may use from you. If you have given us permission to personalize your profile based on your surfing and search behaviour, we can set up our website specifically for you so that its use becomes easier and more personal. We do these using cookies. A cookie is small text file that is placed on your hardware when you visit our website. we use the following types of cookies on our website:functional cookies: like session and login cookies to collect session and login information.anonymised analytical cookies: to obtain information regarding the visits to our website, like numbers of visitors, popular pages and topics.tracking cookies: like advertising cookies that are intended to show relevant advertisements.More specifically, we use the following cookies on our website:Personal tracking cookies: these allow us to learn that besides our website have also visited the relevant other website(s) from our network. The resulting profile is not linked to your name, address, e-mail address and the link, but only serves to match advertisements to your profile, so that they are as relevant as possible to you. We ask your permission for these cookies. These cookies are therefore not placed without your permission.Site improvements cookies: these allow us to test different versions of a webpage to see.14. What do we do with data of minors?We do not target minors with our website or as an organisation. This means that for users under the age specified by law in their jurisdiction, for example under 13 in the U.S.- certain Back Engineering Labs Inc. services will either block users under that age or will ask them to obtain consent or authorization from a parent or guardian before they can use it, including when creating an account to access Back Engineering Labs Inc. services. We will not knowingly ask children under that age to provide more data than is required to provide for the product. Once parental consent or authorization is granted, the child’s account is treated much like any other account. Parents or guardians can change or revoke the consent choices previously made.15. Do you have a question about this privacy policy?If you have a question about our privacy policy, please feel free to contact us on contact@back.engineering. We are happy to help.16. Notice for California and Delaware residents and other statesIf you reside in the state of California or the state of Delaware please see the notice below.How to contact usIf there are any questions regarding this Privacy Policy or the information that we collect about you, or if you feel that your privacy was not treated in accordance with this PrivacyPolicy, you may contact our Data Protection Officer at contact@back.engineering.Privacy Notice for California and Delaware ResidentsThis part of the Policy addresses the specific disclosure requirements under the California Consumer Privacy Act of 2018 (Cal. Civ. §§ 1798.100–1798.199) and the California Consumer Privacy Act Regulations by the Attorney General (collectively, “ CCPA “) and the Delaware Personal Data Privacy Act (“ DPDPA” ).Categories of Personal Information We Process?In the 12 preceding months, we have collected and disclosed the following categories of Personal Information:Category of Personal Information Collected Personal Information Collected Categories of service providers to whom Personal Information was disclosed A. Identifiers Email address, device identifiers (UDID, IMEI, MAC, IP, identifiers issued by Client), image Cloud Services Fraud Prevention B. Commercial information Feedback of Clients and/or End Users Cloud Services C. Internet or Other Electronic Network Activity Information Usernames, directory names, server names, share names, file names and paths, configurations, logs related to Software and Client (e.g. eve"
