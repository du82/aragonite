tomer satisfaction Reduce reliance on your branches and call centers by equipping your customers with powerful self-service capabilities. Allow in-app general card management, such as locking and unlocking, plus PIN requests/resets, as well as managing spending limits, travel notices, authorized users, and more.<img alt="Card management" loading="lazy" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2FbbProduct%2F01-Platform%2FPlatform-Capabilities%2FOmnichannel-Banking%2FCard-management_20240530155153.png&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2FbbProduct%2F01-Platform%2FPlatform-Capabilities%2FOmnichannel-Banking%2FCard-management_20240530155153.png&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2FbbProduct%2F01-Platform%2FPlatform-Capabilities%2FOmnichannel-Banking%2FCard-management_20240530155153.png&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2FbbProduct%2F01-Platform%2FPlatform-Capabilities%2FOmnichannel-Banking%2FCard-management_20240530155153.png&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2FbbProduct%2F01-Platform%2FPlatform-Capabilities%2FOmnichannel-Banking%2FCard-management_20240530155153.png&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2FbbProduct%2F01-Platform%2FPlatform-Capabilities%2FOmnichannel-Banking%2FCard-management_20240530155153.png&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2FbbProduct%2F01-Platform%2FPlatform-Capabilities%2FOmnichannel-Banking%2FCard-management_20240530155153.png&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2FbbProduct%2F01-Platform%2FPlatform-Capabilities%2FOmnichannel-Banking%2FCard-management_20240530155153.png&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2FbbProduct%2F01-Platform%2FPlatform-Capabilities%2FOmnichannel-Banking%2FCard-management_20240530155153.png&amp;w=3840&amp;q=75"/>Simplified wallet provisioningEliminate lengthy, multi-step card tokenization processes Allow your customers to add payment cards (debit, credit, pre-paid) to digital wallets (Apple Pay and Google Pay) directly from their banking app. Make purchasing convenient by allowing payment cards — both virtual and plastic — to be directly and instantly added from your banking apps to their digital wallets.<img alt="Simplified wallet provisioning" loading="lazy" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2FbbProduct%2F01-Platform%2FPlatform-Capabilities%2FOmnichannel-Banking%2FSimplified-wallet-provisioning_20240530155201.png&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2FbbProduct%2F01-Platform%2FPlatform-Capabilities%2FOmnichannel-Banking%2FSimplified-wallet-provisioning_20240530155201.png&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2FbbProduct%2F01-Platform%2FPlatform-Capabilities%2FOmnichannel-Banking%2FSimplified-wallet-provisioning_20240530155201.png&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2FbbProduct%2F01-Platform%2FPlatform-Capabilities%2FOmnichannel-Banking%2FSimplified-wallet-provisioning_20240530155201.png&amp;w=1080&amp;q=75 1080w