full_description = "See all jobsUX DesignerMadrid - ProductsHybridUX DesignerJoin our talented team in Madrid as a UX Designer specialising in Backbase Wealth Management products. As a pivotal member, you'll contribute to refining and implementing features, collaborating closely with developers to ensure seamless alignment between design and development.What you'll doAs a UX Designer specialising in Backbase Wealth Management products, you'll play a key role in refining and implementing features within your value stream. Your responsibilities will include: Working closely with the Backbase Design System, applying UX and focusing on specific journeys, features, or sub-features related to Backbase Wealth Management products Enhancing existing journeys, features, or sub-features to elevate user experience Supporting a more senior UX Designer in your team or value stream, learning from their expertise Delivering implementable UX Design and coordinating delivery with development teams Contributing towards documentation within your team and value stream Observing UX Research sessions to gain insights into user behaviour and preferencesWho you areAre you a UX Designer looking for a journey instead of a job? Then let’s talk! We are THE pioneers in banking tech. You will become part of a dynamic environment that influences the banking experience of hundreds of millions of users around the world. You have around 4-5 years of experience in a similar role, ideally within the financial services sector or with a keen understanding of financial products and services. You have a keen interest in Design Systems, applying UX principles and ensuring perfect alignment between journeys Your knowledge spans both theory and practice in UX/UI Design, Interaction Design, User Interface Design, HTML/CSS, or User Research You've been part of the journey in software implementation projects, demonstrating your grasp of design processes and how they fit into the bigger picture. Your educational background reflects your interest and proficiency in areas like UI Component Design, Interactive Design, or User Experience Design You possess professional working proficiency in both English and the local language, enabling effective communication within the team and beyond You're adept at using design tools such as Figma, Miro, Adobe Creative Suite, or other relevant software, showcasing your commitment to staying up-to-date with industry standards and technologiesApply nowJoin us todayRelated jobs3 Job openingsSenior UX DesignerDepartment: ServicesOffice location: KrakowSenior UX DesignerSenior UX DesignerDepartment: ServicesOffice location: HyderabadSenior UX DesignerUX DesignerDepartment: ProductsOffice location: MadridUX DesignerSee all jobs"
