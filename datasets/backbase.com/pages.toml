description = "As Senior UX Designer in Services, you work with team leadership to strengthen UX design within the organization, ensuring Backbase remains a market…"
full_description = "See all jobsSenior UX DesignerKrakow - ServicesHybridSenior UX DesignerAs Senior UX Designer in Services, you work with team leadership to strengthen UX design within the organization, ensuring Backbase remains a market leader. You are recognised as an expert UX Designer within the squads, acting as an ambassador for best practice UX Design when working with Customers. You actively contribute to customer success projects; continually looking for new ideas and driving a higher quality experience for users. We offer the possibility of working hybrid-at least twice a week you will be working from the office in Kraków.What you'll doWith your expertise, you lead and deliver full lifecycle project delivery in the squads, working with team leadership to identify improvements to the UX design methodology where required. You take responsibility for the quality of UX design in the squads, working with the project team on consistency, Design System (re)use and industry standardization wherever possible. As a member of the UX Design guild, you build respected relationships with complementary disciplines (Front-end and Product in particular) and help to educate non-designers in the team on UX best practice. You may also manage and coach junior team members.Who you are5-8 years of experience in a similar role; Excellent theoretical knowledge with practical experience with one or more areas of UX / UI Design, Interaction Design, User Interface Design, HTML / CSS or User Research; 2-5 years experience in the Financial services industry. Solid knowledge about products and services offered by the Financial services industry (Digital Banking); Experience in the lifecycle of a software implementation project; Educational formation in one of the following: UI component Design, Interactive Design, User Experience Design; Professional working proficiency in the English and local language. What We Offer hybrid work (we come to office 2 days per week; In the office: lunch, breakfast & physiotherapy; Luxmed Comprehensive Gold package; Development budget - 1000 EUR / year; My benefit platform, An international, diverse, and inclusive team; Learn and collaborate with 100+ amazing UX talents; Opportunities for mentorship, horizontal, and vertical growth. Please share your CV and work samples to be considered. Apply nowCultureOur PerksLoud and busy sometimes but always friendly, helpful, and super fun. We love to celebrate each other’s achievements, share jokes, and our love for food, movies, traveling, and sports. We’re one big and diverse family working towards the same goal.InsurancePrivate health insurance for you and your family members.Training budgetSpecific budget for your personal development.HealthAccess to Insight Timer app - increase well-being and balance in our daily lives.ReferralReferral bonus incentive for bringing the best talent.ClothingYou can wear clothes you feel comfortable in.High spec equipmentWe provide all employees with high-spec Macs and tech set up.Join us todayRelated jobs3 Job openingsSenior UX DesignerDepartment: ServicesOffice location: TorontoSenior UX DesignerUX DesignerDepartment: ProductsOffice location: MadridUX DesignerSenior UX DesignerDepartment: ServicesOffice location: KrakowSenior UX DesignerSee all jobs"
