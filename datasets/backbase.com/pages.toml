full_description = '''Empowering global changeOur commitment to a better worldWhen we guide our customers in adopting our platform, we share a simple truth: start small, dream big. This philosophy is the foundation of our approach to social responsibility as well. We believe that every individual and company can make a positive impact. Our sustainable, diverse, and accountable business practices demonstrate our commitment to a better world. We work with partners and colleagues globally to create a brighter future, and we're excited to collaborate with you to achieve transformational changeEnvironmentLet’s go green togetherBuilding a sustainable futureFor years, we've been helping financial institutions future-proof their operations. Today, we are going even further by taking bold climate action — securing the future of our planet in partnership with our global network of Backbasers, partners, and peers.Find out more<img alt="Campaign Images-Body Image-Gogreen-Global" loading="lazy" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2Fcompany%2FSocial-Responsability%2FGo-Green%2FCampaign-Images-Body-Image-Gogreen-Global.png&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2Fcompany%2FSocial-Responsability%2FGo-Green%2FCampaign-Images-Body-Image-Gogreen-Global.png&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2Fcompany%2FSocial-Responsability%2FGo-Green%2FCampaign-Images-Body-Image-Gogreen-Global.png&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2Fcompany%2FSocial-Responsability%2FGo-Green%2FCampaign-Images-Body-Image-Gogreen-Global.png&amp;w=1080&amp;q=75 1080