description = "Join our Wealth Engineering team as a Senior iOS Engineer where you'll design, develop, and shape our iOS investing products. Your innovative,…"
full_description = "See all jobsSenior iOS EngineerMadrid - ProductsHybridSenior iOS EngineerJoin our Wealth Engineering team as a Senior iOS Engineer where you'll design, develop, and shape our iOS investing products. Your innovative, future-ready features will impact over 100 million users globally.What you'll doJoin Backbase in leading the charge towards a new era in banking innovation. As part of our renowned R&D department, you'll be instrumental in developing, scaling, and deploying cutting-edge software solutions to financial institutions worldwide. Collaborating closely with our talented mobile engineers, you'll help shape the future of FinTech with innovative SDKs and libraries. Let's embark on this exciting journey together as we revolutionize banking for Retail, Business, and Wealth Management clients worldwide. Building new features and improving existing features in our wealth mobile banking products for our clients and their end users. Achieving high standards through comprehensive non-functional testing, including performance, scalability, and security assessments; Own a set of our mobile banking components and create the one stop shop for mobile digital transformation. Collaborate with the Application Security team to stay on top of new tech and changes within the security domain. Participate in agile and scrum ceremonies while building clean, maintainable, testable and scalable code. Join our mobile guild which consists of 70+ mobile engineers to continuously grow your knowledge.Who you areLooking for a journey instead of just a job? Then let’s talk! We are THE pioneers in banking tech, and we're looking for someone with a proactive, self-driven attitude who’s ready to tackle challenges and take initiative. You will become part of a dynamic environment that influences the banking experience of hundreds of millions of users worldwide. If you want to develop our iOS Banking Apps and scale our libraries to shape the future of banking, this role is for you. Your excellent communication skills in English—both verbal and written—will help you collaborate effectively within our global team. Experience in the banking domain will allow you to hit the ground running, and your belief in writing clean, maintainable, and scalable code will align perfectly with our commitment to quality. You have 6+ years of relevant working experience working on complex iOS-based products. You have a deep comprehension of the MVVM (via UIKit) architecture pattern. You have experience with Cocoapods to create new pods and manage our existing dependencies. You have a solid knowledge of the UIKit Auto Layout and Constraint system. You have deep experience using frameworks like Combine and UIKit. You understand how to build and use both dynamic and static frameworks. You have experience in writing unit tests and you understand the testing pyramid. You have hands-on technical experience with non-functionals such as security, performance and accessibility.Apply nowJoin us todayRelated jobs3 Job openings(CS) Senior iOS EngineerDepartment: ServicesOffice location: Hyderabad(CS) Senior iOS EngineerSenior iOS EngineerDepartment: ProductsOffice location: MadridSenior iOS EngineerSenior Android EngineerDepartment: ProductsOffice location: MadridSenior Android EngineerSee all jobs"
