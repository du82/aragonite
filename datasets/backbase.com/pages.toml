full_description = "See all jobs(Services) Project ManagerHyderabad - ServicesHybrid(Services) Project ManagerAs a Project Manager you will be part of the Customer Success (CS) department. We undertake exciting projects at top-tier banks all over the world to implement our online banking solutions. Your task is to manage projects all around the world and be a bridge between Backbase internal teams and our clients.What you'll doBackbase is a fast growing and dynamic environment. Taking upon this position means that you will be a key person in providing effective coordination and communication among all the project stakeholders. You will be expected to support customers/partners and advise clients on implementing their online applications using Backbase Solution to its full potential.Who you areFundamentals: 5-8 years experience Can demonstrate experience in financial sector Can demonstrate experience in startup/scaleup environment Managed a programme Agile coach experience is beneficial Use of Tools and Methods: Superior knowledge of standard software tools related to daily position responsibilities, answers questions for colleagues related to those tools, and leads tutorials on best practices for using software tools Provides teams and colleagues and customers with context for how software tools enhance their ability to perform their duties more efficiently and effectively- strongly promotes agile philosophy and ways of working Financial Management: Able to create tools and processes around internal and external reporting Able to support strategy discussions based on reported data Able to address issues based on data Ensures effectiveness of the project (productivity/billability for company) Client Management: Able to spot business development opportunities and involve relevant people Able to design and facilitate client workshops Able to spot potential issues and minimise the impact by effective management Able to handle large transformation programme within one customer Able to work with senior stakeholders to define long term programme strategy Project Team Management (internal): Effectively manages project team and resolves issues Takes initiative to identify potential resources before liaising with resourcing team Trains team members in scrum methodology Manages multiple teams in a large programme or multiple projects Change Management: Is comfortable with ambiguity and rapidly changing environment Able to influence and drive change Can identify potential changes as risks before they occur Able to mitigate the impact of changes and replan accordingly Able to improve change process Risks and Issues Management: Manages risks and issues on project level and program levelApply nowCultureOur PerksLoud and busy sometimes but always friendly, helpful, and super fun. We love to celebrate each other’s achievements, share jokes, and our love for food, movies, traveling, and sports. We’re one big and diverse family working towards the same goal.Training budgetSpecific budget for your personal development.ReferralReferral bonus incentive for bringing the best talent.ClothingYou can wear clothes you feel comfortable in.High spec equipmentWe provide all employees with high-spec Macs and tech set upJoin us todayRelated jobs3 Job openingsSenior Project ManagerDepartment: ServicesOffice location: MoroccoSenior Project Manager(Services) Project ManagerDepartment: ServicesOffice location: Hyderabad(Services) Project Manager(Services) Senior Project ManagerDepartment: ServicesOffice location: Atlanta(Services) Senior Project ManagerSee all jobs"
