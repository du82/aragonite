title = "Backbase unveils new Amsterdam headquarters, amplifying…"
description = "New office drives Backbase's commitment to culture and in-person collaboration"
full_description = '''See all press releasesBackbase unveils new Amsterdam headquarters, amplifying its culture of innovationNew office drives Backbase's commitment to culture and in-person collaboration<img alt="Press and Media Header Image New Amsterdam headquarters EN" loading="lazy" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2Fcompany%2FPress-and-Media%2FPress-and-Media-Header-Image-New-Amsterdam-headquarters-EN_20241003101138_20241021094048_20241021094103.jpeg&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2Fcompany%2FPress-and-Media%2FPress-and-Media-Header-Image-New-Amsterdam-headquarters-EN_20241003101138_20241021094048_20241021094103.jpeg&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2Fcompany%2FPress-and-Media%2FPress-and-Media-Header-Image-New-Amsterdam-headquarters-EN_20241003101138_20241021094048_20241021094103.jpeg&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2Fcompany%2FPress-and-Media%2FPress-and-Media-Header-Image-New-Amsterdam-headquarters-EN_20241003101138_20241021094048_20241021094103.jpeg&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2Fcompany%2FPress-and-Media%2FPress-and-Media-Header-Image-New-Amsterdam-headquarters-EN_20241003101138_20241021094048_20241021094103.jpeg&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2Fcompany%2FPress-and-Media%2FPress-and-Media-Header-Image-New-Amsterdam-headquarters-EN_20241003101138_20241021094048_20241021094103.jpeg&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2Fcompany%2FPress-and-Media%2FPress-and-Media-Header-Image-New-Amsterdam-headquarters-EN_20241003101138_20241021094048_20241021094103.jpeg&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2Fcompany%2FPress-and-Media%2FPress-and-Media-Header-Image-New-Amsterdam-headquarters-EN_20241003101138_20241021094048_20241021094103.jpeg&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2Fcompany%2FPress-and-Media%2FPress-and-Media-Header-Image-New-Amsterdam-headquarters-EN_20241003101138_20241021094048_20241021094103.jpeg&amp;w=3840&amp;q=75"/>Amsterdam, 3 October 2024 – Backbase, the creator of the Engagement Banking Platform, celebrated the grand opening of its global headquarters at Oosterdoksstraat 114 in Amsterdam. This move is more than just a change of address; it represents another step forward in Backbase's mission to re-architect banking around the customer and reaffirms its strong commitment to a culture of collaboration and a can-do mentality. Jouk Pleiter, Founder and CEO of Backbase, shared his enthusiasm: "Today marks a new phase for Backbase. Our new headquarters in Amsterdam is more than just a building. It represents the outcome of a 20-year journey fueled by entrepreneurship, perseverance, and focus on innovation and customer success — all driven by our people. With the opening of our new HQ, our culture is more important than ever. We approach every day with the energy and curiosity of a startup: staying customer-obsessed, constantly innovating, and never resting on past success. Especially with the rapid rise of AI, this mindset is absolutely crucial. The coming five years will be highly transformative. Staying nimble and responsive is critical for thriving in this new AI-driven era. Our new HQ symbolizes not just our progress, but our commitment to reinvent ourselves where needed, embrace change, and drive change in one of the largest industries in the world."A strategic investment in collaboration, culture, and sustainability The design of the new 5,000 square-meter headquarters embodies Backbase's core values and inspires a can-do mentality, innovation, and collaboration. Located in the heart of Amsterdam, it offers convenient connectivity and views of the IJ river, and is positioned alongside the global headquarters of renowned Dutch tech leaders Booking.com and Adyen. The circular layout of the office space symbolizes the company's collaborative ethos, encouraging spontaneous interactions and fostering a strong sense of teamwork among Backbasers. "Our vision was to create a space that not only inspires innovation but also brings people together," said Carolien Roos, lead architect at Firm. "The design encourages the kind of serendipitous encounters and discussions that often lead to groundbreaking ideas – a key ingredient in Backbase's recipe for success." Sustainability is at the forefront of the new headquarters' design. It features energy-efficient systems, eco-friendly materials, and green spaces that reflect Backbase's commitment to reducing its environmental footprint while creating a healthy, inspiring work environment. The opening of the new global headquarters is more than just a milestone for Backbase. It's a bold statement about its vision for the future of banking.'''
