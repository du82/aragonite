title = "TD Bank teams up with Backbase to evolve its retail card…"
description = "With Backbase’s Engagement Banking platform, TD Bank is transforming digital banking for retail cardholders, starting with +2 million customers."
full_description = '''See all press releasesTD Bank teams up with Backbase to evolve its retail card businessWith Backbase’s Engagement Banking platform, TD Bank is transforming digital banking for retail cardholders, starting with +2 million customers.<img alt="Press and Media Header Image TD Bank" loading="lazy" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" sizes="100vw" srcSet="/_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2Fcompany%2FPress-and-Media%2FPress-and-Media-Header-Image-TD-Bank_20241209142809.png&amp;w=640&amp;q=75 640w, /_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2Fcompany%2FPress-and-Media%2FPress-and-Media-Header-Image-TD-Bank_20241209142809.png&amp;w=750&amp;q=75 750w, /_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2Fcompany%2FPress-and-Media%2FPress-and-Media-Header-Image-TD-Bank_20241209142809.png&amp;w=828&amp;q=75 828w, /_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2Fcompany%2FPress-and-Media%2FPress-and-Media-Header-Image-TD-Bank_20241209142809.png&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2Fcompany%2FPress-and-Media%2FPress-and-Media-Header-Image-TD-Bank_20241209142809.png&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2Fcompany%2FPress-and-Media%2FPress-and-Media-Header-Image-TD-Bank_20241209142809.png&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2Fcompany%2FPress-and-Media%2FPress-and-Media-Header-Image-TD-Bank_20241209142809.png&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2Fcompany%2FPress-and-Media%2FPress-and-Media-Header-Image-TD-Bank_20241209142809.png&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fcms-site.backbase.com%2Fimages%2Fcompany%2FPress-and-Media%2FPress-and-Media-Header-Image-TD-Bank_20241209142809.png&amp;w=3840&amp;q=75"/>Wilmington, DE, December 10, 2024 – TD Bank, America's Most Convenient Bank®, announced today that it has teamed up with Backbase, the creator of the Engagement Banking Platform, to help evolve and improve the digital experience for its retail partners. This collaboration will help deliver a more seamless, modern, and multi-channel credit card service experience, and will begin with a rollout to more than two million customers of a large strategic card partnership program. “Our collaboration with Backbase reflects our larger commitment to delivering future-ready solutions focused on the human side of banking,” said Jennifer Garrett, Head of CCUL New Product Development, Loyalty & Benefits at TD Bank. “We look forward to delivering a more modernized cardholder experience that sets the stage for seamless integration across our retail partnerships, better helping meet the needs of our clients now and into the future.”Jennifer Garrett, Head of CCUL - New Product Development, Loyalty & Benefits at TD BankWith Backbase, TD Bank will be able offer an enhanced, more digital-first and friendly experience for retail cardholders, helping its retail clients better meet the demands of a shifting demographic. Some on the key features of this enhanced experience include easier online account management and self-service capabilities. The platform also allows for greater versatility to better provide TD with similar solutions across its varied retail brand partners.“Partnering with TD Bank on this initiative marks a pivotal step in redefining the cardholder experience. Our Engagement Banking Platform is designed to drive rapid innovation, and this collaboration showcases our ability to meet the demands of digital-first consumers. With our scalable technology, we’re transforming how customers engage with their cards, continuing to raise the bar for convenience, speed and customer service in the financial industry.”Jouk Pleiter, Founder & CEO at BackbaseAbout TD Bank, America's Most Convenient Bank®TD Bank, America's Most Convenient Bank, is one of the 10 largest banks in the U.S. by assets, providing over 10 million customers with a full range of retail, small business and commercial banking products and services at more than 1,100 convenient locations throughout the Northeast, Mid-Atlantic, Metro D.C., the Carolinas and Florida. In addition, TD Auto Finance, a division of TD Bank, N.A., offers vehicle financing and dealer commercial services. TD Bank and its subsidiaries also offer customized private banking and wealth management services through TD Wealth®. TD Bank is headquartered in Cherry Hill, N.J. To learn more, visit https://www.td.com/ca/en/about-td. Find TD Bank on Facebook at https://www.facebook.com/TDBank and on Instagram at www.instagram.com/TDBank_US/. TD Bank is a subsidiary of The Toronto-Dominion Bank, a top 10 North American bank. The Toronto-Dominion Bank trades on the New York and Toronto stock exchanges under the ticker symbol "TD".'''
