full_description = "The Books $49 for all four ebooks in a bundle, in both PDF and EPUB formats Out of the Software Crisis $35 USD for PDF and EPUB. Software projects keep failing, not because we don’t have the right team or tools but because our software development system is broken. Out of the Software Crisis is a guide to fixing your software projects with systems-thinking making them more resilient to change and less likely to fail. Systems-Thinking For Software Projects Yellow: principles (or useless aphorisms) for software dev (ebook edition) $10 USD for the ebook-only version, PDF and EPUB. Yellow is a short ebook (around 90 pages). In it, I outline some of the core principles that drive my work using casual and approachable language, even when I’m covering potentially complex topics such as Gall’s Law or loose coupling. Principles (or useless aphorisms) for software dev Bad Writing $10+ USD for PDF and EPUB. Twenty-five years of writing on digital transformation, digital publishing, innovation, and software development Get The Ebook for $10 USD (or more, if you feel like it) The Intelligence Illusion (Second Edition) $35 USD for PDF and EPUB. What are the major risks to avoid with generative AI? How do you avoid having it blow up in your face? Is that even possible? The Intelligence Illusion (Second Edition) is an exhaustively researched guide to the risks of language and diffusion models. Why generative models are bad for business Hi, I'm Baldur Bjarnason, and I'm available for consulting and web dev work I’ve been making websites for over twenty-five years, working as a web developer (front-end, back-end, or full-stack) for both companies and charities, small and large, in a variety of programming languages.I’ve written two books, a course, and a video series on topics related to software development and have been writing about web development online for years. My preference and primary expertise these days is concentrated on web languages: CSS, HTML, and JavaScript. My JS experience covers Node, Deno, and the Browser, both with frameworks or without. Projects and code I’ve worked on are being used in production on a number of ecommerce and business sites across the world. I strongly prefer non-framework solutions – not because I can’t but because standard JS is usually the most cost-effective and efficient approach for most web software projects. You can find me online at Bluesky, Mastodon, this blog, or my newsletter. Email me to see how I can help you. This site has three main sections: Essays Coding Notes Notes I try to publish the essays on, roughly, a weekly schedule, and they are what I send out to the newsletter. (So, if you’re subscribed to one of this site’s feed, you don’t need to subscribe to the newsletter.) The notes are published more sporadically and I usually only include them as links in the newsletter. If you want to follow everything on this site, I recommend the main feed, but I also offer feeds for each individual section. You can find all the feeds listed on the feeds page. Latest 5 Essays AI and Esoteric Fascism27 February 2025 – 2139 words Poisoning for propaganda: rising authoritarianism makes LLMs more dangerous03 February 2025 – 1231 words First outlines of a plan: thinking strategically about a modern tech and media business24 January 2025 – 4413 words 'The Intelligence Illusion (Second Edition): Why generative models are bad for business' – Black Friday launch sale27 November 2024 – 1945 words A countdown creates suspense and tension: preparing for 202518 November 2024 – 1698 words 446 more essays can be found in the essays archive. Latest 3 Coding Notes FormData to compressed buffer and back 26 September 2024 – 180 words#FormData #Response #ArrayBuffer FormData to Object 26 September 2024 – 471 words#FormData Word Count 20 September 2024 – 66 words Latest 5 Notes Now I'm disappointed. 13 February 2025 – 1078 words#AI Knowledge tech that's subtly wrong is more dangerous than tech that's obviously wrong. (Or, where I disagree with Robin Sloan.) 12 February 2025 – 1711 words#AI Todo notes as a storm approaches 05 February 2025 – 1190 words#interim notes Raven Photos (24 January 2025) 24 January 2025 – 13 words#photos #ravens The web is a creative industry and is facing the same decline and shattered economics as film, TV, or publishing 16 January 2025 – 1414 words#interim notes 19 more notes can be found in the notes archive."
