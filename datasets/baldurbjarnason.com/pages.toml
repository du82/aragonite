["https://baldurbjarnason.com/2021/lessons-in-interactivity"]
title = "Lessons in Interactivity, 2021 redux"
description = "Web dev at the end of the world, from Hveragerði, Iceland"
full_description = '''Lessons in Interactivity, 2021 redux 13 August 2021 – Baldur Bjarnason Contents Believing in the Traditional Media OrthodoxyThe Failure of Interactive EbooksThe Audience that isn’t PublishingBecoming a Traditional Media ApostateThe book has ceased to have a physical presence for the general publicThat Brief Period When Interactive Documentaries Had PromiseAnd now, when they don’tOutmoded Metaphors Bind Our ThinkingLosing the book metaphorWhere comics went, books will followWhere are we now?What are the options for an interactive media creator? The following is a rewrite of a post I wrote nine years ago. I’ve updated it to reflect the past decade, changed it where I was wrong, and clarified where I was unclear. Believing in the Traditional Media Orthodoxy # The medium is the message. This is merely to say that the personal and social consequences of any medium - that is, of any extension of ourselves - result from the new scale that is introduced into our affairs by each extension of ourselves, or by any new technology. (Marshall McLuhan) I haven’t always been a McLuhanite—a “the medium is the message” kind of guy. I started my career with the idea that interactive media was a kind of 'Borg medium: one whose good qualities came mostly from adopting the characteristics of other, more traditional, modes of expression. Of course, I wasn’t blind to the sheer wealth of interactive media works that filled the interactive media ‘canon’ so to speak, but this was twenty years ago. a couple of years after the dot-com crash, and the only immersive interactive media that had been broadly accepted as a mass medium were games. Websites were a lot simpler and the web less capable as a platform. Flash was used for a lot of interesting experiments, even the occasional useful app, but it hadn’t yet become the rich programming platform it is today. Director was the only platform that seemed to offer the capabilities the medium would need, but CD-ROMs were too expensive to manufacture and distribute, and the massive files Director generated were largely unsuitable for internet distribution. Calling Director ‘temperamental’ was being charitable. It was very powerful and ahead of its time, but all that power came wrapped up in a package that tended to misbehave. To the point where the same Lingo code with the same assets would not behave in the same way for reasons that were often extremely hard to discover. (One of my early paid interactive media jobs was making multimedia CD-ROM catalogues in Director for shipping and insurance companies. It was even less fun than it sounds.) This belief of mine, that rich interactive ebooks would evolve out of the book as a medium, retaining all of the qualities of a book but growing to include all of the functional, structural, and contextual benefits of the traditional book felt like a minority opinion at the time. I don’t know if it was because of the books and papers I was reading or the conferences I went to, but most people I spoke to, read, and listened to, seemed to believe that interactive media was a revolutionary – not evolutionary – new form that, any day now, would soar like a giant eagle to become a major new medium of expression. Never mind the dot-com crash or the CD-ROM crash. Those were just trial runs, the technology wasn’t ready to do the medium justice. Some day it would be and then it would be glorious. To say that I was sceptical would be another understatement. —Books are familiar, a known medium. People will appreciate, even love, how they can grow and develop in a new, more open, digital context. Uh, no. I was wrong about that. We’ve spent the past decade living in a media landscape where interactive media is a mass medium. People buy all sorts of playful apps, regularly visit rich, dynamic, websites, and spend some of their money on interactive media. They spend less than they do on coffee, and the various platforms take a big chunk of it, but it’s an actual economy (or, ‘economies’ plural). Interactive media is a medium in its own right. The interactive ebooks that publishers have pushed over the years are a failed experiment: they were an upstart, a competing invader that is priced higher and produced by amateurs on a more limited – less capable – platform. The Failure of Interactive Ebooks # That the interactive ebook phenomenon—ebooks dumped into apps, with trappings that mimicked the print form, and wrapped with a layer of disposable toys and playthings—have faded so completely from our collective psyche is evidence of just how utterly misguided they were. It was a vision of a world that could not and will not exist: that all readers want from ‘digital’ was to experience their favourite books with the author’s annotations and video commentary tracks; that they would be willing to pay a premium for the pleasure. Interactive ebooks were competing directly with interactive media and games. They were produced and published by publishing companies that had an often awkward and uncomfortable relationship to technology – often incapable of even putting together a tolerable website. Interactive ebooks were an unproven upstart with an attitude that was completely unwarranted and unearned. The Audience that isn’t Publishing # ‘Such a nice dog.’ The old lady scratched the dog behind its ears. It looked tough enough to chew nails for breakfast and mean enough to enjoy it. Walking up East Street in Bedminster, ten years ago, one of the first things I saw was a man wearing jeans, a dirty wife-beater, and a cheap trilby hat bought from a stall nearby, who was showing off his dog to a couple of old ladies. (Henceforth to be known as the Dog Man.) He was a lanky man with the scrunched up and pulled-out facial features that so many English suffer from—some people’s noses seem to just keep on growing—and spoke with an accent that marks him as coming from a long line of Bristolians. The ladies were a part of Bedminster’s daily procession of retirees. On a good, sunny, day, they slowly made their way up East Street, sat on every bench and talked to anybody with a smile and time on their hands, making their way to ASDA or whatever store they’re aiming for. Then they make their way back—same sit down, chat, stand up—just in time for dinner. Needless to say, not one of those three were ever likely to ever buy an ebook, but there is a good chance that the Dog Man had a cheap smartphone, with a couple of games and maybe a toy app or two. Bedminster had an odd reputation. A teenage mom, pushing a pram with one hand and holding a can of Stella in the other didn’t look out of place. Nor did a scruffy man in a trilby and a wife-beater, showing off his dog to a couple of old ladies. But, as a neighbourhood, it grew on you. Maybe it’s because locals treated other locals differently. I rather liked living in a place where single moms felt free to sit out in the sun with their kids and other moms and drink beer than in a place where they didn’t. Becoming a Traditional Media Apostate # The first academic conference I went to was Bob Hughes’s Dust or Magic held in Oxford in, I think, both 2002 and 2003. Probably due to Bob’s strong political opinions and activism, the conference had a unique mixture of idealists and craftsmen with precious little useless academic twaddle (most of what twaddle was there was supplied by me, I’m afraid). These people presented a collection of works that were beautiful and immersive. Most of them were ‘just’ toys, true, but many were toys that could spur people into action in ways that non-interactive media can’t. At the time I was rather resentful of the playful nature of interactive media – an attitude that looks remarkably dense in hindsight – hoping for richer, deeper, and more immersive narrative work. But, interactive media is playful, more so than any of the more traditional media. That’s the one thing that separates it from the pack and makes it interesting. They don’t have to be games, but they do have to be "play". That’s what it does. That’s what it’s for. An interactive media project that isn’t built around some sort of play is going to have a hard time getting any attention or traction. I can even pinpoint the time when I changed my mind on this: when I first read John Dewey. His point: ‘we learn what we do’. School, under this model (we learn what we do), only teaches us to sit down, shut up, and do whatever an authority figure tells us to do. Meaning comes from what you do and how you do it. Interactive media, under this model, has the potential to deliver deeper learning and deeper meaning than any other medium that preceded it. Where McLuhan applied his pithy yet vague aphorism “the medium is the message”, John Dewey, in Art as Experience (1934), was a bit wordier and so quite a bit clearer about what it actually means: Because objects of art are expressive, they are a language. Rather they are many languages. For each art has its own medium and that medium is especially fitted for one kind of communication. Each medium says something that cannot be uttered as well or as completely in any other tongue. The needs of daily life have given superior practical importance to one mode of communication, that of speech. This fact has unfortunately given rise to a popular impression that the meanings expressed in architecture, sculpture, painting and music can be translated into words with little if any loss. In fact, each art speaks an idiom that conveys what cannot be said in another language and yet remains the same. Language exists only when it is listened to as well as spoken. The hearer is an indispensable partner. The work of art is complete only as it works in the experience of others than the one who created it. Thus language involves what logicians call a triadic relation There is the speaker, the thing said, and the one spoken to. The book has ceased to have a physical presence for the general public # ‘Is it your day off?’ The woman making the pancake was in a good mood, a disposition as sunny as the bright day outside. Her cafe was a nice one. Small, but it looked like a place that got regular traffic. Despite this, it was closed and gone the next year. The customers seemed to be of a type, judging by the toys and children’s playthings that filled the cafe. ‘No, not really. I decided to take a break from work to enjoy the sun.’ The pancake was fantastic, sprinkled with dark chocolate. It isn’t slathered with the cheap chocolate you get in some places, but nice, just bitter enough, chocolate, in exactly the right amount to provide the pancake with a counterpoint. Unusually, for me, I ate the strawberry as well. I’m not too fond of sweet fruits like strawberries, tomatoes, or grapes, but it did go so well with the chocolate. I’m pretty sure that it used to be a place that sold Italian ice cream, but I don’t remember when. I lived in Bristol for so long that reality became layered with memory upon memory. It’s filled with places whose roles and purposes have changed and changed and changed. It’s not just ice cream parlours turned cafes or pubs that change ownership every year. —Over there used to be a nice comic book store. It was pretty small but had a nice selection. My sister used to buy manga there. It’s now a shoe shop. —That used to be a Waterstones, two storeys. I think I bought my copy of Juhani Pallasma’s The Eyes of the Skin there, but can’t be sure. —That Blackwells is little more than a stationery store now. It used to be five storeys and have a magnificent selection of books. Once, I, my mom, and her then-husband spent hours in that Blackwells, just browsing, finding new books, thoughtful books, probably marking us as life-long pseudo-intellectuals in the process. Most of what used to be the Blackwells store is now a restaurant. —We had Borders over there. I’m afraid to even think about the amount of money I spent there during the lifetime of the store. Bought most of my Georgette Heyer collection and so so many sci-fi novels there. On the day before I graduated, me with my PhD and my sister with her MA, we spent a large part of the afternoon there with our dad, talking about life, history, philosophy and books. It was later a Wilkinson, selling household goods. Then a Sainsbury’s, I think? I haven’t been back in five years. I remember when Forbidden Planet was in the centre, in one of the buildings later demolished to make way for Cabot Circus (which is a fine example of a modern-day temple to consumerism). A new Foyles store, and a dingy looking comics store on Bond Street, never made up for all of these losses. The book has ceased to have a physical presence for the general public in so many ways. What one can study are the meanings readers assign to literary works. What people call ’literature” does not exist on paper. The only thing you will ever find on paper are black marks. Teaching As a Subversive Activity -- Neil Postman That Brief Period When Interactive Documentaries Had Promise # —So, what do you think of iBooks, Kindle, and the like? One of the benefits of having spent such a long time in UK academia (there aren’t many, but this is one) is that whenever there was an academic conference in the city you lived in, there’s a decent chance you could wrangle a free ticket. Less of a benefit today, now that I’m living in Iceland, but it was back when I was still UK-based. Mid-March 2012 I went to the i-docs conference at the Watershed, a hullabaloo on interactive documentaries, web docs, etc. It covered all forms of interactive non-fiction. I generally find conference panels and talks to be boring at best and infuriating twaddle at worst, and these certainly didn’t rise above the crowd. There’s nothing a conference talk can deliver that wouldn’t be better served by a good blog post, suitably ignored by the masses. This is probably why the i-docs conference site at the time was full of blog posts, videos, and discussions. But, I digress. The true worth of a conference is in the attendees and the true value you get is from discussions and conversations in between the sessions. And based on what I heard in those conversations, the future of interactive non-fiction wasn’t going to have ‘book’ anywhere in its name. ‘Too little. Too late. They completely missed the boat.’ When I asked what they thought of ebooks as a platform, the responses ranged from a polite disinterest to a complete and unequivocal dismissal. Instead, the focus was on the web and apps. People from Mozilla were in attendance, showing off what Firefox could do at the time. This was before Mozilla’s present cadaverous immobility. Accessible and rich web development tools were demonstrated. It’s easy to understand why those two platforms had such great mindshare among documentarists and interactive media developers at the time. On the one hand, we had the web, a platform that is perfectly aligned with the one true goal of most non-fiction projects: to spur action. Documentar'''
year_published = 2021
