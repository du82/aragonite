title = "Software Crisis 2.0"
description = "Web dev at the end of the world, from Hveragerði, Iceland"
full_description = "Software Crisis 2.0 25 August 2021 – Baldur Bjarnason Contents The First Software CrisisAre Things Improving?The Chaos ReportSomething is sure to solve all difficultiesShooting without a hope of hittingThe realization of desiresSomething awful happensGood-humoured idiotic smilesFinding confirmation of our ideas in our observationsA bitter misfortune by our own faultDisgust and pitySo how do you make good software?TasteFind or build small teamsStart simpleBe the right kind of ambitiousKnow your customersEffectual reasoningGoing on in the same way An essay on our industry's core expertise: failed software projects. If you prefer your longer reading in ebook form, this 60 page essay is available as a PDF, EPUB, or MOBI. (MOBI format is entirely untested!) The First Software Crisis # Back in the early days of computing, we were, as always, extremely bad at making software. Except it was fine as most computers were practically custom-made to their purpose and only had the power to be able to tackle relatively simple problems. Simple problems meant simple software. This didn’t last long, Moore’s law being a more concrete reality back then, computers steadily became more powerful which led them to being applied to more complex problems. This did not go well. By 1968, this was a full-blown crisis: There is a widening gap between ambitions and achievements in software engineering. This gap appears in several dimensions: between promises to users and performance achieved by software, between what seems to be ultimately possible and what is achievable now and between estimates of software costs and expenditures. The gap is arising at a time when the consequences of software failure in all its aspects are becoming increasingly serious. Particularly alarming is the seemingly unavoidable fallibility of large software, since a malfunction in an advanced hardware-software system can be a matter of life and death, not only for individuals, but also for vehicles carrying hundreds of people and ultimately for nations as well. David Gries and A.G. Fraser, from Software Engineering: Report of a conference sponsored by the NATO Science Committee Once the field, in general, had accepted that there was indeed a crisis they could begin the work addressing it. Which they did up to a point. Fred Brooks wrote The Mythical Man-Month in 1975. Edsger W. Dijkstra and others worked hard to improve the craft of programming. Douglas Engelbart pioneered UI/UX research at the Augmentation Research Center in the 60s. Alan Kay and others took over the UI research baton at Xerox Parc in the 70s. This led directly to the Mac, Hypercard, the mainstreaming of hypertext, NextSTEP and the web. Software development had a clear, upward arc. You could argue that software in general still wasn’t good enough. But it seemed to be a pragmatic inevitability that would at some point be just that: good enough. Even software that was objectively bad in multiple dimensions like Windows 95 or 98 was a clear improvement on what came before. To paraphrase William Gibson: good software was already here, it just wasn’t evenly distributed yet. Most software was still bad. Most UX designs were still horrible. Bug-free software still seemed to be an elusive, mythical beast. But you could look at the industry and think to yourself that this was going to get fixed. The industry was in the process of being ‘modernised’, turned into a proper field of practice. Then, in 2001, ‘Agile’ stepped in with the Agile Manifesto. Finally, hopefully, at last, good software development was going to be popularised. Are Things Improving? # Twenty years have passed and you can no longer plausibly claim that software is improving. If there is one universal truth in software it’s that there’s a lot of bad software and failed software projects. If you’ve worked in the industry for more than just a few years, a minority of the software you’ve worked on will have been a success. If it wasn’t buggy, it’ll have been over budget. If it wasn’t over budget, it’ll have been late. If it wasn’t late then it probably didn’t fulfil all of the set requirements or features you had planned. If it fulfilled the requirements, you’ll have found out that the requirements were utterly wrong. Most of the software projects we’ve worked on are failures at some point. A few recover. Many don’t. This is the norm. As an industry, we’re really bad at what we do and we all know it. Thus Weinberg’s Law is still in effect: “If builders built buildings the way programmers wrote programs, then the first woodpecker that came along would destroy civilization.” You often see people cite a statistic like “90% of software projects fail!” Or, “60% of all software projects fail!”. It’s useful when you want to dismiss some standard practice in the industry without making an actual argument about that practice. If somebody asks you to back that up with a reference, just handwave it away. Everybody knows this. Which is usually a very reliable indicator that the stat is a made-up urban legend. Except, in this case, it isn’t. Not only are both of the percentage stats backed by research, but they both also come from the same ongoing research. The Chaos Report # The Standish Group has been writing reports on the prevalence of software project failures since the 90s. They call them Chaos Reports. They have a database of participating companies, with a decent range in size from small to huge. They survey the companies regularly and collect stats. It isn’t perfect and it probably doesn’t reflect the industry at large. But that’s fine because the industry proper is almost certainly much worse. It has the benefit of being done by the same people using the same overall methodology over an extended period. It’s also the only real long-term research we got on the subject. The 90% stat originally comes from their 1995 report: Only 9% of their projects come in on-time and on-budget. And, even when these projects are completed, many are no more than a mere shadow of their original specification requirements. (Standish Group – Chaos Report) Not only is the 90% stat marginally understating the scope of software failure, once you factor in requirement failures the rate of success drops even further. The industry knew what good software development looked like, but it wasn’t the norm. The 60% stat, however, also comes from the Standish Group, just a much later report. 2011 2012 2013 2014 2015 SUCCESSFUL 39% 37% 41% 36% 36% CHALLENGED 39% 46% 40% 47% 45% FAILED 22% 17% 19% 17% 19% The Chaos Report 2015 traditional resolution for all projects Their 2015 report shows that the success rate for a software project is now in the 36-39% range, giving us a 61-64% unsuccessful rate which sounds much nicer than 90%. Also, the research is now more representative of the value delivered as it shows that around 40% of the projects delivered results in some way despite being unsuccessful. This statistic is in the same ballpark as that shown in other research studies, one of which in 2008 put the unsuccessful rate at 68%. —We’ve gotten better at software development, yay agile! Yes and no. These stats only measure whether the project is on time, on budget, and on target. This reflects our experience as developers. While a good portion of what we work on is unsuccessful by any reasonable measure (business failure, unusable, poor software quality, inaccessible, poor performance, negative return on investment, technical debt, septic code etc.) we do generally manage to get paid and deliver what was asked. For the most part. It isn’t our fault that managers keep asking for dumb requirements they haven’t backed with research. Software projects do tend to get delayed so a 40% success rate sounds accurate and you can imagine that most of the ‘challenged’ projects are just a bit late or just a bit over budget. It feels like it reflects the state of the industry. If you’re a software developer, that is. Sounds completely unreasonable to anybody who needs to use or rely on our crap. This is why in 2015 the Standish Group changed their ‘resolution definition’. Now, to qualify as successful, a project needed to be on time, on budget, and have a satisfactory result. Uh, oh. Did a cold sweat just run down your back or was that just me? —Satisfactory result? What has that got to do with software? That is not something we do, dear sir! (Flounces off.) 2011 2012 2013 2014 2015 SUCCESSFUL 29% 27% 31% 28% 29% CHALLENGED 49% 56% 50% 55% 52% FAILED 22% 17% 19% 17% 19% The Chaos Report 2015 modern resolution for all projects All the stats drop. Not by as much as you’d think. Which is good? We still have about a 30% success rate. That isn’t the full picture. The horror story reveals itself when you break it down by project size. SUCCESSFUL CHALLENGED FAILED TOTAL Grand 6% 51% 43% 100% Large 11% 59% 30% 100% Medium 12% 62% 26% 100% Moderate 24% 64% 12% 100% Small 61% 32% 7% 100% The Chaos Report 2015 resolution by project size For medium, large, and grand projects, the success rate is only in the 6-12% range. For most project sizes that we are likely to deal with in the industry, we’re back in “90% of all software projects fail” territory. Even moderate projects (too big to be small, too small to be medium) only succeed 24% of the time. The only reason the final number hovers around 30% is that it turns out that we are damn good at making small software projects: 61% are successful. To refer to one of my favourite books on systems, The Systems Bible by John Gall: “The larger the system, the greater the probability of unexpected failure.” It should not be surprising that the odds of failure increase fast with software project size. This would be fine, just make all the projects small, except we all know that that’s often not possible. We are, generally, really really bad at reducing scope. Everything escalates in software development. We know no moderation and in node.js development, habitually add thousands of dependencies right at the start. —We’re gonna need this. We’re gonna need that. And that. And that as well. We’re gonna need all of this at some point. Might as well add it now. We know it’s wrong. We have kind of figured out how to do this job. We just lack the discipline to follow through. It’s also just a small part of the picture. Some of what we have seen as progress in software development is more akin to stat manipulation. The state of a software product, for example, isn’t reset at the end of every release. Over time, your small projects start to feel less and less small. I don’t know about you but this feels depressingly familiar. Since the 90s we’ve learned how to deliver what people ask for, but we remain depressingly incapable of acting on that knowledge. —Surely that’s somebody else’s problem, right? We deliver what we’re asked, in the way management wants it done, and we’re going to get paid whether it delivers any value to the organisation or not. Vronsky, against his own will or wishes, followed her lead, hoped too that something, apart from his own action, would be sure to solve all difficulties. Leo Tolstoy, Anna Karenina Something is sure to solve all difficulties # The true reason for the state of software and even knowledge work in general: we, as a whole, don’t know the answers to even the most basic questions: What is good management? How do we prevent bad software? How do we prevent harmful software? Software that is harmful to society, culture, the workforce, or the environment? What is good software? How do we recognise good software? How do we develop a culture for talking about, analysing, and enjoying well-made software? Are we in a position where we can even tell whether our software is good or not? Do we have any capacity for acknowledging that the quality of our software is declining? Or, not increasing when it should? Are we capable of recognising when the process is serving the product’s end-user? Or, when it’s not? These seem basic but that’s where we’re at as an industry: we do not have answers to the most foundational questions of our work. Agile hasn’t answered any of them, even though its various flavours have tried. Like Vronsky in Anna Karenina, we’re waiting for somebody else to solve all our difficulties. Most people involved in software development don’t know what truly good software looks like because they’ve only ever used mediocre or awful software. Most of those who make software don’t know what a sensible software product development process looks like because they’ve never seen it happen. Most of our managers know less about management theory, organisational psychology, or even basic principles of collaboration than an abusive high school gym teacher. At least the abusive bastard wants to hurt us. The manager does it unintentionally through ignorance or inexperience. It always happened with Levin that when his first shots were a failure he got hot and out of temper, and shot badly the whole day. So it was that day. The snipe showed themselves in numbers. They kept flying up from just under the dogs, from under the sportsmen’s legs, and Levin might have retrieved his ill luck. But the more he shot, the more he felt disgraced in the eyes of Veslovsky, who kept popping away merrily and indiscriminately, killing nothing, and not in the slightest abashed by his ill success. Levin, in feverish haste, could not restrain himself, got more and more out of temper, and ended by shooting almost without a hope of hitting. Leo Tolstoy, Anna Karenina Shooting without a hope of hitting # It’s a miracle we ship anything at all, between the overwork, poor communication, misguided research, and the rampant fad-seeking. Software is born doomed and it’s a constant struggle to keep it alive. All of our errors, mistakes, and misdirected obstinancy are all winding paths to the same destination: we keep building software that people don’t want to use. That’s our original sin. Sometimes they just don’t need it. Sometimes it just doesn’t address a problem anybody has. Sometimes it’s done in such a way that nobody wants to use it, even those who do need it. The end is the same. It’s tempting to look at the Chaos Report and conclude, as most of the agile cosplay industry has done, that the key is to slice everything up into smaller slices. Behold! The two-week sprint, a salve for our wounds, saviour of all our projects, a boon for all managers! A silver bullet, if you will. Because there is such a thing. Except, no. It only works to a degree. The short sprint model makes scope creep harder but doesn’t prevent it and it doesn’t prevent cross-sprint interdependencies. A lot of the time the sprint’s conclusion is just punctuation, a little bit of breathing space between sentences, and doesn’t work as a chapter break that concludes an idea while setting you up for the next one. Sprints can often serve to exacerbate death marches by making a grand project’s feature production"
