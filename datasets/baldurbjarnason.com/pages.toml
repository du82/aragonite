title = "Making Colophon Cards"
description = "Web dev at the end of the world, from Hveragerði, Iceland"
full_description = "Making Colophon Cards 29 November 2021 – Baldur Bjarnason There are tasks that computers are good at. And there are tasks where they aren’t. One driver of the evolution of the personal computer, laptops, mobile phones, and all forms of mobile computing has been the desire to increase their range: do more; in a smaller package. Many in tech and software are addicted to riding this wave of new capabilities, however long it will last, to work on and create new software. To extend the reach of the computers in our lives. Innovation’s the word. Pushing the boundaries. You know the phrases. Usually spouted by that dude at the party. The other side is also interesting. We are now in a place where we have entire genres of software that have decades of history, are backed by stacks of new and old research, have dozens of successful, well-made exemplar apps, and a broad enough conceptual space to allow for new variations on the theme. In short, we have genre software and we have avant-garde software, and I’ve always been more interested in genre fiction than literary fiction. One of the earliest genres of software is the Personal Knowledge or Information Manager—arguably as old as the computer mouse itself. Managing data is one of the tasks computers have always been good at, so we’ve been making software in that genre for decades. Outliners, hypertext systems, note-taking apps, personal information databases—we’ve been doing this for a while and, because software is inherently ephemeral, we make new iterations for every generation. Sometimes, such as with Tinderbox or DEVONThink, the new iterations are new versions of the original software. Sometimes, such as with Bear, Ulysses, Roam, or Obsidian, it’s a new take on the genre. Not so new that you don’t recognise it for it is, and not so innovative that it doesn’t reuse what worked for other apps, but new variations that are adapted to work well in our current computing context. That isn’t even close to a comprehensive list. There’s also Evernote, Drafts, 1Writer—even Apple’s Notes app has evolved to become impressively useful. And I’m still only scratching the surface. These apps are also extremely diverse. There’s an increasing tendency for software, in this age of ‘flat’, to all look the same. Same design. Same aesthetic. Same icons. Same fundamental CRUD (Create, Read, Update, Delete) concept mapped onto a specific problem domain. But you’d never mistake a screenshot of Bear for one of Tinderbox or Ulysses. You’d never look at Roam and think to yourself: “huh? That looks exactly like DEVONThink.” I’ve been working in or adjacent to this space for the past five years, with varying degrees of success and you can probably tell that I’m a little bit obsessed with the genre. It shouldn’t come as a surprise that I’m working on my contribution to the genre. I’ve wanted to build a specific take on the note-oriented personal information manager for myself for a long time. This summer I applied for a grant from the Technology Development Fund at The Icelandic Centre for Research to create a prototype of a notetaking app that I’m calling… Colophon Cards While the app itself won’t be open source (though some bits of it might be), I’ve gotten used to following the open-source ethos of working publicly and transparently. So, over the next six months (or longer if I’m successful) I’m going to be documenting the process, the design, development, research, marketing, discussion with my advisers, and other details, at colophon.cards. As you can probably tell from the site, I began a few days ago. The front page is the first version of the pitch for the app and my specific approach. The first design notes are a high-level sketch of how it should work. The data model are my first attempt at structuring it. The sharing model outlines how I envision collaboration to work. Attachments and bookmarks are about how information management works. I like this one so much that I edited it into the front page pitch, as I’m sure you can tell. Reading and viewing outlines my take on what’s missing in the field in terms of reading features in knowledge management apps. The business model is a rough sketch of what I imagine the business model to be. Not because I’m anywhere near launching this but because you can’t design an app without having a sense of its business model and its margins. The questions that need to be answered are just that. Open questions that I need to find answers to. Additionally, you can follow my work on the website and comment with an issue on the GitHub repository. (Work on the software itself will be in a private repository.) The notes I’ve been posting are rough and unedited. They are work products, not essays or marketing, those belong here on this site. You can follow Colophon Cards news by following the mailing list using the form on the site (this is a separate mailing list from the one on this site), by following its feed, or by watching the GitHub repository. I’ll also make sure to post about major updates here on this site. I’m enjoying the process a lot and I hope that you’ll enjoy it with me. Previous entry What do I need to read to be a great at CSS? 19 October 2021 Next entry Let's just not talk about 2021 and look forward instead 5 January 2022"
