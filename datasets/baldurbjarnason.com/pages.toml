title = "The Open-Source Software bubble that is and the blogging bubble that was"
description = "Web dev at the end of the world, from Hveragerði, Iceland"
full_description = "The Open-Source Software bubble that is and the blogging bubble that was 11 May 2021 – Baldur Bjarnason Contents The symptomThe blogging bubble and its modern parallelsThe willful blindnessThe money hoseThe deterioration and potential collapseThe price we’re paying Disclaimer: For a while there, I was paid to work full-time on Open-Source Software (OSS) software in the Open Educational Resources (OER) space. There’s a distinct possibility that I’m biased in some way as a result. There’s also the possibility that working in OSS and OER for over four years might mean that my opinions are backed by experience. You get to decide. The symptom # Babel is used by millions, so why are we running out of money? This doesn’t surprise me. The purpose of the web software industry is to extract value out of Open-Source Software (OSS). Everything is built under the misconception that OSS is abundant, replaceable, and free. People don’t appreciate just how much web dev is about extracting value from OSS, both on individual and corporate levels. Make a native iOS app, and the only OSS you need to use is directly integrated into the OS, and a lot of it is maintained by Apple itself. Apple may use open-source font rendering libraries or SQLite, but you rarely have to deal with it yourself, as a developer, unless you want to. Web development? Everything is built or run directly on OSS. Almost everything we do in web development exists as a thin layer over open-source software. Servers, build tools, databases, ORMs, auth, client-side JS, web browser: we are all building on a vast ocean of OSS labour without paying back a fraction of the value we generate. It isn’t just big, direct dependencies like Babel that are suffering. The stuff your stuff is using—the infrastructure code everything needs—is surviving on sheer inertia as well. That’s value extraction. Strip-mining if you want to hammer home the unsustainability. Looting if you want to emphasise the moral dimension. We don’t even know the extent of the problem. Has anybody looked into the sustainability of the npm ecosystem, for example? How much of it is backed by a sustainable business model or even any kind of ongoing revenue? I suspect that the sustainable fraction is tiny. At some point, something’s going to give. Something’s already giving. We keep seeing projects like Babel: used by thousands; running on fumes. I’m reminded of the only real tech bubble I’ve personally witnessed: the rise and fall of blogging. They’re very different phenomena, but blogging and open-source are solid examples of big corporations strategically subsidising a complement to their core business with no care being paid to collateral damage. (I was in university when the dot com bubble collapsed, so I missed that. And I was doing my PhD when Web 2.0 peaked. Somebody needs to write about the true history of the rise and fall of the blog as the dominant web paradigm as a lot of it seems to be forgotten or just plain misunderstood today.) There are a lot of misconceptions about what exactly happened. People think that Google killed weblogs in 2013 when it discontinued Google Reader. Which isn’t entirely true. Google Reader was a murder weapon, not a victim. The blogging bubble and its modern parallels # Google did kill weblogs, but that’s fair since they also created the weblog bubble. You might not believe this if you weren’t there, but one of Google’s main problems, once they got going, was that there just wasn’t that much to see on the web. Having a great search engine is kind of useless if, for example, somebody types in “how to take better landscape photographs,” and nobody online has an answer. Google Adwords changed all of that. That, as well as free weblog hosting, fuelled the blogging bubble. You wrote a blog using a weblog system that came with decent SEO baked in (semantic structure and cross-linking, that’s all you needed back then). Most of your traffic came from Google’s search results. All of your revenue came from Google’s Adwords. It became profitable to churn out indistinct pap that passed as informative to fill Google’s search engine results, so people did. The weblog ecosystem was built entirely around extracting value from Adwords. For a few, it was a springboard to launch something else. A few writing careers got off the ground. But the vast, vast majority was just Adwords. Weblogs as social media? A sideshow. Weblogs as a unique medium? Incidental. Even outfits with paid subscriptions, like MetaFilter, relied on Adwords and had to course-correct once Google popped that bubble. Which they did because they had to: most of it was fraudulent. Fake clicks. Spam blogs. Link farms. Black hat SEO. The blogging economy was filled with bad practices all around. People today don’t appreciate just how rampant these practices were. Most of us didn’t notice because we were in our tiny corner, all reading the same few popular bloggers (an early version of the modern ‘influencer’). But outside of that corner, blogs were done for Google and paid for by Google. Outside of a small number of active commenters (many of whom were toxic as hell), the traffic these blogs had existed solely because it suited Google to give blogs a high ‘PageRank’. They had no meaningful community or engagement to call their own. After a few years of buying into the hype, advertisers started to push back, forcing Google to clean up their index. That consisted of downplaying blogs and blog-like sites and purging spam-blogs and blog farms (many of which had been hosted on Google Blogger, natch). The blog gold rush ended. The tools surrounding it started dying, hastened by Google sucking the oxygen out of the software ecosystem by acquiring, offering for free, and then putting on life support the core tools in the ecosystem. FeedBurner and Google Reader were not victims of Google’s policies. They were the weapons Google used to ensure that the only player extracting value from blogging was Google. Because people misunderstand what happened, they tend to take away the wrong lessons about what worked or didn’t work about blogging. They wrote off blogs as a genre of design: content, a sidebar with blog roll and categories, comments, and a casual style of writing. They ignored the tech that blogs were built on: RSS, easy-to-use CMSes, reverse-chronological listings mixed with categories and the like to highlight posts. Blogs, by the technical definition, are having a resurgence. Substack is a blogging system with convenient payment and email integration(RSS, reverse-chronological listing). As Jeremy Keith enjoys pointing out, Medium is Ev’s blog and offers RSS feeds and reverse-chronological listings for each guest author. Most mailing list platforms are either technically blogs (RSS plus a pleasant CMS) or integrate with blogs using RSS. This time around, the audience seems, for the most part, to genuinely be invested in the blogs themselves. They aren’t being funnelled there by Google or Facebook because it’s strategically convenient for them, for the moment. Substack isn’t the only player in town, so we seem to be avoiding the monoculture pitfall. Blogging for an earned audience is probably bigger than it has ever been before in the history of the web. The blogging bubble reminds me in many ways of the current state of web development: We have an economy that exists solely because big tech companies are pouring money into strategic complements to their products. This money-hose distorts the economy in ways that kill off businesses and skew education and recruitment. Much like the blog farms of old, many companies get away with extractive, unsustainable, and generally awful practices because so many of their resources are in effect subsidised by Google, Facebook, or Microsoft. Most web software companies are built to quickly extract value from the underlying open-source layer. Ever wondered why management practices in web software are dominated by short term concerns that are self-destructive in the long term? Because managers know what they are supposed to do, even if they don’t exactly know why. Speed is of the essence because you aren’t doing anything unique. You aren’t creating tech of your own or building on a hard-earned understanding of the clientele. You are using your funding to race against others to see who manages to squeeze the most business out of the underlying OSS before the funding runs out. The willful blindness # Most people in the industry don’t realise that the web dev economy is primarily extractive. As with the earlier assumption that Google must be trying to keep Adwords clean and sustainable, there’s the assumption here that somebody in tech must be making sure the work behind OSS is paid for. Or, almost as naively, they assume that it can all subsist as donationware. People in web dev constantly assume that something somewhere must be paying for the OSS dependencies they use. This is why developers come in with the entitlement of a paying customer. The OSS maintainer is supposed to serve them with the enthusiasm of somebody being paid. Their worldview just doesn’t accommodate the idea that this is unpaid labour because then they’d have to start questioning the very sustainability of their own careers. The money hose # Many of the misconceptions about OSS stem from the fact that the core of the ecosystem is funded. Facebook is pouring money into the React sub-ecosystem, and Google keeps burning cash on the Chrome bonfire. Microsoft keeps funding developer infrastructure like Visual Studio Code, Typescript, npm, and GitHub. Those are just the most prominent examples. They all fund ton of other projects, either directly or indirectly, through a wage surplus. A surprising amount of OSS is made by former big tech developers. They can afford to subsist on meagre revenue—for a time—because their pay and stock options have left them free of debt and with well-stocked savings accounts. This is much more common than you’d think. Scratch away at the surface of pretty much any active OSS project that has no discernible revenue, and you either get a burnout waiting to happen, or you’ll find a formerly well-paid dev coasting on savings. Many of the rest have solid VC funding. Though, VC funding always runs out at some point. The business fundamentals just aren’t there for open source when you have Google, Amazon, and the rest gatekeeping all of the value in the market. This is why the ecosystem is already beginning to pull apart at the seams. And Microsoft… Like I wrote above, MS is just carpet-bombing the web developer community with open source software and OSS infrastructure. Typescript, Visual Studio Code, GitHub, npm, and so much more exist primarily because Microsoft executives believe this will lead to more business for Azure and other Microsoft offerings. In turn, most of the offerings on Azure (as with Amazon Web Services) are leveraging OSS to maximise the value of the platform. Most of the rest of the ecosystem—excluding the tiny fraction like SQLite who have few dependencies and sustainable revenue—exists as backsplash from those two projects. Node, Deno, Electron, most front end tooling, and so many web dev libraries only exist because of projects that Google and Facebook are funding. Google, Facebook, and Microsoft are probably the biggest players using OSS this way, but they are not alone. Leveraging the positive externalities of OSS has been the go-to strategy for many big tech corporations for a while now. It isn’t just software: web dev education, training, and recruitment exist primarily to extract value from Facebook’s React or Google’s OSS projects. Very few of them invest in figuring out what sort of training will serve their students the best. The easiest thing to sell to both recruiters and students is the big framework on the block, so that’s what they sell and very little else. The extraction mentality is baked into the business. Which is sort of fine when you’re dealing with projects funded by mega-corporations but disastrous when applied to the unfunded or poorly funded rest. The money hose, combined with free or subsidised services, is a control mechanism that lets big tech companies control the OSS ecosystem. Projects they want to promote will get the money spigot. Other projects, like MongoDB or Redis, get turned into commodities and resold as cheap services. Most notably, projects that try to independently leverage open source to become fast-growing tech companies are disproportionally likely to be ‘embraced and extended’ this way by AWS, Google Cloud, or Microsoft’s Azure. The rest of us aren’t much better. The SaaS companies that funnel a bit of their revenue back to the OSS projects they’re building on are few and far between. The companies that maintain an OSS framework or library as a positive externality to their business are few and far between. VC-funded OSS companies are moonshots that tend to crash well before they get an opportunity to blow up in orbit. We’re honestly bloody bad at paying for the work of making software as an industry. The deterioration and potential collapse # Then as now, every stepwise deterioration in the ecosystem is explained away. Back when the primacy of blogs was sliding, every time Google changed their algorithm to downplay blogs or updated their Adwords policies, you got thousands of responses ‘explaining’ how this wasn’t the end of the world and here’s what you need to change to keep up. Meanwhile, legitimate blogs started dropping off the web, services began to shutter, and RSS feeds went dark. We’re starting to see the initial decay hit the parts of the web dev ecosystem that are the furthest away from the cheap money fountains Google and Facebook are providing. Core projects run out of money. Git commits stop. A dependency you use breaks when one of its dependencies stops working, leading somebody to fork it with a quick fix or replacement dependency. Bandaid fixes to decaying OSS projects start to crop up in more and more places. We start to see blog posts saying that all we need to do is get enough people to donate money or pay for support. Everything will be fine. Just look at how OpenSSL got turned around. All of which is bad enough but also misses the point. Weblogs were a strategic lever for Google. Funding them made sense at a time where they needed the web to have more content. When they didn’t need them—when they stopped being a profitable lever—they were discarded. And the ecosystem sunk fast. Open-source software is a strategic lever for big tech companies. They fund when it helps their core business and strip-mine projects when it doesn’t. Cloud hosting has, slowly, been ushering in an era of extraction, where tech companies specifically target serverside OSS projects that they can leverage with little investment. Broad sections of serverside software are woefully underfinanced. Many server frameworks in the node ecosystem, for"
