title = "Securing your IoT Edge devices - balena"
description = "Balena ensures robust IoT security for your edge devices, protecting your fleet, data, and operations."
full_description = "Explore our Trust Center to find detailed information about IoT security best practices, industry certifications, and how we keep your data safe. Learn about balena’s approach to IoT security in our whitepaper. Discover how we implement secure device management, data encryption, and compliance measures. Safeguarding security with reliable, verifiable updates, providing consistent application and kernel updates to keep fleets protected from potential attacks. Ensuring IoT compliance with regular security updates and a secure development lifecycle, aligning with ISO 27001, CRA, and more from design to deployment. Providing fleet security with Secure Boot, Full Disk Encryption, and Cloudlink for secure remote access, enabling trusted software execution and protected device communication. Offering secure authentication methods, including credential-based login, OpenID Connect (e.g. GitHub, Google), 2FA, TOTP, and SAML-based Single Sign-On for enterprises. Marco reported a vulnerability in the 2FA recovery key management. We have implemented a mitigations."
