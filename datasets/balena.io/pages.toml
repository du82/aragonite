["https://balena.io/pricing"]
title = "Pricing - balena"
description = "Pricing: Flexible pricing that scales with your business. Start free with under 10 devices and adjust seats and devices as you grow."
full_description = '''Have you already deployed devices and would like to use balena? Or perhaps balena does not yet support your board? Already have a fleet of devices deployed in the field?No worries - we can help you remotely migrate your devices to the balenaCloud platform.Contact us to learn more about our brownfield migration tools and services. Don’t see your board on our supported devices list? Don’t worry! We can likely provide support for your Linux device via our Custom Device Support process. Our standard pricing is shown below, but contact us to get a quote for your specific board. The Free plan includes 10 microservices devices. You can have a maximum of 10 total devices shared across all the fleets you create. To learn more, please see balena.io/docs/learn/manage/fleet-types. To add more devices, you’ll need to upgrade to a paid plan. Prototype plans include 30 devices. Pilot plans include 60 devices and Production plans include 110 devices. You can add devices as your fleet grows, although credit-based discounts are only available for Pilot plans and higher. When we talk about included devices we are referring to the logical device instances that are managed by balenaCloud. Physical devices are not included with any of the subscriptions and must be acquired by you. If you're already on a paid plan and need to add more devices, you can simply provision them to your account, and we will automatically bill you for additional devices after subtracting any available Credits. Read more about Credits in the documentation. Yes, though additional devices on the Prototype plan are priced higher than additional devices on Pilot and Production plans, as the Prototype plan is meant to be a "starter" plan for the early stages of your project. At a certain point it will make economic sense for you to upgrade to a Pilot plan than to continue paying for additional devices on the Prototype plan. If you go over the number of devices included in your plan, we will automatically bill you for those additional devices or use any available credits, according to the additional per-device price assigned to your plan. See balena.io/pricing/#devices for more details.'''
