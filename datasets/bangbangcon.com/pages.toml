["https://bangbangcon.com"]
title = "The joy, excitement, and surprise of computing - !!Con 2024"
full_description = "In-person tickets are sold out, but online-only tickets are still available for the last-ever !!Con! Get yours here! !!Con (pronounced “bang bang con”) 2024 is our final event featuring two days of talks to celebrate the joyous, exciting, and surprising moments in computing. !!Con 2024 will be held on the weekend of August 24-25, in the courtyard of the Baskin School of Engineering at UC Santa Cruz, in Santa Cruz, California, United States! For updates on !!Con, follow @bangbangcon@mastodon.social, or sign up for our mailing list below. We send about four or five emails per year for important announcements about our venue, submission deadlines, registration, and that sort of thing. No spam, we promise, and it’s easy to unsubscribe at any time. “Going to !!Con rekindled my love of computing and changed my entire career trajectory. Most fun I’ve ever had at a tech event!” – Geoffrey Litt ”@bangbangcon managed to pack more useful info into one day than most other conferences do in 3. And it was 10x more fun.” – John Wittrock “It’s refreshing to learn 30+ new things about programming in a single weekend at @bangbangcon, even though I’ve been programming for so long” – Melody Starling “@bangbangcon was awesome! Learned a lot, met very friendly people, and left inspired.” – Bomani McClendon To join us in person, you’ll need to have a ticket – go get one! As always for !!Con, tickets are pay-what-you-want. This year, we’ve set a suggested ticket price of $256 – it turns out that running an outdoor conference gets really expensive really quickly. If you can, please consider paying $256 for your ticket (or, if you can afford it, more, so that folks who haven’t got the means can come and we can still run the event!). But we want you at the conference regardless, so if you can’t afford $256, please register anyway and pay what you can afford! We’re also offering online-only tickets, with a suggested donation of $8. Buying an online-only ticket will get you access to our 2024 Discord server. Discord was a popular feature of the online-only !!Cons in 2022, 2021, and 2020. (In-person attendees will get access to the Discord too.)"
