["https://bangbangcon.com/speakers.html"]
title = "Speakers - !!Con 2024"
full_description = "Both of the 47 year old Voyager spacecraft are currently in interstellar space and returning their most important data set; in-situ measurements of the magnetic field, plasma and dust beyond the Heliopause. In late 2023, Voyager 1 lost all downlink telemetry and the flight team had essentially no visibility into the state of the spacecraft which is over 15 billion miles from the Earth. This talk will detail how the flight team diagnosed the problem, and formulated a recovery plan to patch the Flight Data System flight software. Bruce Waggoner is the Mission Assurance Manager at NASA Jet Propulsion Lab/Caltech. He graduated from the University of Nebraska with a BS in Physics and Astronomy. He has worked at JPL for 39 years supporting dozens of Earth orbiting and deep space missions. He also volunteers as a gymnastics coach and assists teaching girls engineering and science at a local high school. Over the past decade I have tried lots of things to build and own computing and networks with others! I have written collective speculative fiction about a future web, made a kit to talk to your neighbours to share your internet, stewarded distributed public data, and more. Some of those projects have succeeded and some have failed. My trick is to act like the future of computing that I want already exists in the world and I get to hang out there. I will talk about why that future should be more local, how I bring it into the present, and ways to build tech together! Dawn Walker is a researcher and designer interested in how computing intersects with just transitions. She has started a tech worker co-op, participated in community-led archiving of environmental and climate data, and schemed about mesh networking (to name a few things) in her attempts to create alternatives to existing ways of building and stewarding technology. Since 2017 she has co-organized Our Networks, a conference about the past, present, and future of building our own network infrastructures hosted in Toronto and Vancouver."
