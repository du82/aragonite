["https://bangbangcon.com/2014"]
title = "!!Con"
full_description = '''!!Con (pronounced bang bang con) 2014 was two days of ten-minute talks (with lots of breaks, of course!) about what excites us about programming — the amazing, the strange, and the heartwarming. From kernel exploits to teaching kids to program, !!Con was about bringing the NYC programming community together to celebrate the joy and excitement and the surprising moments in what we do. We defined "programming community" broadly — you didn't need to be a professional programmer to be part of !!Con. Check out our speaker lineup, including our amazing keynote speakers, Michael Bernstein and Camille Fournier! Our call for proposals closed on March 31, 2014. Thanks so much for all of your wonderful talk proposals! The conference was held at Hacker School, at 455 Broadway in Manhattan, on Saturday, May 17 and Sunday, May 18, 2014. On both days, the fun began at 9:45 AM; we provided breakfast, lunch, and snacks on both days; and talks ended at around 5:30 PM. Throughout each day, we had breaks for relaxation, refreshment, and unconferencing. See the program for details! To find out about future !!Con events, follow @bangbangcon on Twitter, or sign up for our mailing list below! No spam, we promise! Listed in decreasing order of hair length: Lindsey Kuper, Alex Clemmer, Julia Evans, Erty Seidel, Maggie Zhou, and Leo Franchi.'''
