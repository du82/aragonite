full_description = "!!Con (pronounced “bang bang con”) 2021 was a week of ten-minute talks (with lots of breaks, of course!) to celebrate the joyous, exciting, and surprising moments in computing. For updates on !!Con, follow @bangbangcon on Twitter, or sign up for our mailing list below. We send about four or five emails per year for important announcements about our venue, submission deadlines, registration, and that sort of thing. No spam, we promise, and it’s easy to unsubscribe at any time. Our call for talk proposals is closed. Thanks for all your wonderful talk proposal submissions! Learn more about our amazing speakers! !!Con was a pay-what-you-want conference. Our registration was open April 24th (first batch) and April 26th (second batch). “@bangbangcon managed to pack more useful info into one day than most other conferences do in 3. And it was 10x more fun.” – @johnwittrock “Virtual @bangbangcon’s reminding me how much fun it is to hear people talk about what they’re passionate about” – @trudake “It’s refreshing to learn 30+ new things about programming in a single weekend at @bangbangcon, even though I’ve been programming for so long” – @pixelyunicorn “@bangbangcon was awesome! Learned a lot, met very friendly people, and left inspired.” – @bxmani “It’s only halfway over, but @bangbangcon is setting the bar for virtual events for me. […]” – @lazerwalker The !!Con 2021 organizing team: Joshua Wise, Erty Seidohl, Julia Evans, Alicja Raszkowska, Sarah Withee, Dev Purandare, and Lindsey Kuper. If you’d like, you can send us some mail! Organizers emeriti: Leo Franchi, Nabil Hassein, Maggie Zhou, Alex Clemmer, Emily Xie, Danielle Sucher, Kiran Bhattaram, and Ahmed Abdalla Is your organization interested in sponsoring !!Con? Check out our sponsorship prospectus, or directly get in touch. Hosted on Netlify. Website source code on GitHub. Previously: !!Con 2020, 2019, 2018, 2017, 2016, 2015, 2014. !!Con West 2020, 2019. The background of this page features our 1