title = "The joy, excitement, and surprise of computing - !!Con 2020"
full_description = "!!Con (pronounced “bang bang con”) 2020 was two days of ten-minute talks (with lots of breaks, of course!) to celebrate the joyous, exciting, and surprising moments in computing. Our call for talk proposals is closed. Thanks for all your wonderful talk proposal submissions! Learn more about our amazing speakers! !!Con 2020 was held as an experimental remote conference on the weekend of May 9-10, 2020!! Our open livestream recording is available here. !!Con was a pay-what-you-want conference. Our registration is closed, but you can watch the livestream on YouTube without a ticket!! “We aren’t even at lunch yet and already this is the coolest conference I’ve ever been to!” – @mahtab_sabet “@bangbangcon managed to pack more useful info into one day than most other conferences do in 3. And it was 10x more fun.” – @johnwittrock “It’s refreshing to learn 30+ new things about programming in a single weekend at @bangbangcon, even though I’ve been programming for so long” – @pixelyunicorn “@bangbangcon was awesome! Learned a lot, met very friendly people, and left inspired.” – @bxmani For updates on !!Con, follow @bangbangcon on Twitter, or sign up for our mailing list below. We send about four or five emails per year for important announcements about our venue, submission deadlines, registration, and that sort of thing. No spam, we promise, and it’s easy to unsubscribe at any time. The !!Con 2020 organizing team: Erty Seidohl, Julia Evans, Danielle Sucher, Kiran Bhattaram, Ahmed Abdalla, and Alicja Raszkowska. Organizers emeriti: Leo Franchi, Nabil Hassein, Maggie Zhou, Alex Clemmer, Emily Xie, and Lindsey Kuper. Logo design by Lea Albaugh. Hosted on GitHub Pages. Previously: !!Con 2019, 2018, 2017, 2016, 2015, 2014. The background of this page features our 157 past speakers!"
