title = "Code of Conduct - !!Con 2024"
full_description = "Below, you’ll find the Code of Conduct for Exclamation Foundation events – for now, these are !!Con and !!Con West. Our Code of Conduct is a little different than most: where many Codes of Conduct start and stop at preventing harassment, ours is part of an intentional effort to define the culture of !!Con events. We don’t think that !!Con is something that you passively participate in: everyone who attends helps construct !!Con and, ideally, makes it a better conference. !!Con is about the joy, excitement, and surprise of computing. That can’t exist while excluding people who have been traditionally marginalized in the computing community, so an intentional part of the culture that we want to set is for you to feel welcome. Our purpose in this Code of Conduct is to give all of our attendees some ideas for how to make all of the above happen. Harassment has no place at !!Con. This sounds obvious, but it’s important. There are almost limitless ways to harass people; an incomplete list might include harassment based on gender, sexual orientation, disability, physical appearance, body size, skin color, or religion, as well as making predatory sexual advances on other attendees. Don’t do any of those things, and in any event, please be mindful of how you talk to and about other people at the conference. “Jokes” (or serious actions, for that matter) that serve to exclude people aren’t okay, either. Conversely, try to make an extra effort to be kind and empathetic in how you act. Here’s a few ways you can do that: Read pronoun badges! It’s impossible to know what pronouns somebody uses just by looking at them. Let them tell you. Consider putting your pronouns on your badge, if you’re comfortable doing so! Even if you think your pronouns are “obvious” by looking at you, you should write yours down, too! (In the !!Con Online world, we put the pronouns that we’d rather be called by in our Discord profiles, and for in-person attendees, we offer space on badges to write down pronouns!)"
