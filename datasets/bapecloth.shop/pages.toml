["https://bapecloth.shop/return-policy"]
title = "Return Policy - A Bathing Ape"
description = "For US Orders Only: Bape offers returns on most merchandise for U.S. customers within 7 days of the delivery date."
full_description = "For US Orders Only: Bape offers returns on most merchandise for U.S. customers within 7 days of the delivery date. If 7 days have gone by since you received your purchase, unfortunately, we can’t offer you a refund or exchange. Please be aware that there is a restocking fee of $15 that will be deducted from your order. To be eligible for a return, the product must be unused and in the same condition that you received it. It must also be in the original packaging, and the tag must be attached. To return your product, please contact us at support@bapecloth.shop, and someone from our support service will review and get back to you shortly with a return label if your claim is approved. For any other questions, feel free to contact our support at support@bapecloth.shop, and they will assist you with your return. Please always state the reason for your return in your email and your order number. Once your return is prepared, you can drop it at your local post location. All returns are shipped back to our warehouse in Virginia. Please allow 1-2 weeks for your return to arrive at our warehouse. Delivery dates may vary depending on where you are shipping your return from. Once your return is delivered, please allow 2-3 business days for us to inspect and process the return. Once your return is processed, you will receive an email notification confirming your refund. Please allow 3-5 business days for the refund to show on your original form of payment. International Returns: Bape accepts international returns. All fees are the responsibility of the customer. To return your product, please contact us at support@bapecloth.shop, and someone from our support service will review and get back to you shortly with an unpaid return label if your claim is approved. Domestic Exchanges (US only): Bape offers exchanges only for different sizes of the original style(s) purchased. If you would like to purchase a new style, a new order must be placed. There is no return shipping or restocking fee for exchanges. To initiate an exchange, please contact support@bapecloth.shop. International Exchanges: Bape does not offer exchanges for international orders. Questions? If you have any questions or concerns, please contact us at support@bapecloth.shop. Refunds: Once your return is received and inspected, we will send you an email to notify you that we have received your returned item and inform you of the approval or rejection of your refund. If you are approved, then your refund will be processed, and a credit will automatically be applied to your credit card or original method of payment within a certain number of days. Late or missing refunds: Once you have received an email from us confirming your refund, please allow 2-7 business days for the money to reach your account. Missing Items: First, please check the package carefully. In most cases, the items might still be in the box. Before you get worried that some items are missing from your parcel, make sure you have thoroughly checked the packing materials. In some cases, items are shipped separately, and you would receive different tracking numbers if that is the case. Second, contact us. If a product is missing, we can help. Please e-mail photos of the shipping label and the box with the items received, along with a brief description of the situation and the order number to support@bapecloth.shop. We will follow up with next steps as soon as possible. You can inform us about your missing item within 14 days. If 7 days have gone by since you received your purchase, unfortunately, we can’t offer you a refund or reship. Lost Packages: We are not liable for any misplaced or stolen packages. If your tracking number reads as successfully shipped, and the address provided to us upon checkout matches the exact address we have shipped your order to, we are not held responsible if your package has been misplaced. Stolen or lost packages are nonrefundable. If you have any questions, please contact us at support@bapecloth.shop, and we will try our best to assist you with this matter. Can I cancel/amend my order after I’ve placed it? If your order is placed on a weekday, our warehouse is quick at packing your order, which means we can’t make any changes or cancel it once you’ve placed it. This includes changing the delivery option, delivery address, or payment method. If your order is placed on a weekend or a bank holiday, you may be able to cancel your order and place a new one instead if you inform us within 24 hours of placing your order."
