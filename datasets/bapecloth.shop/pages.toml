["https://bapecloth.shop/shippng-information"]
title = "Shippng Information - A Bathing Ape"
description = "Fast Domestic Shipping: Shipments within the US are fulfilled from our warehouses across the USA. As soon as your order"
full_description = "Fast Domestic Shipping: Shipments within the US are fulfilled from our warehouses across the USA. As soon as your order is verified, it may take up to 72 hours to process and ship your order during business days (Monday – Friday). We aim to have your order dispatched from our facility within 1-5 business days. However, it may take longer, particularly during the peak season around year-end or sales. After your order has been shipped, delivery time within the United States is 5-15 business days. Please keep in mind that during holidays or limited edition launches, this time may vary. For all domestic USA orders, we offer our standard shipping (5-15 Business Days). To ensure the best delivery service, we ship using the top carriers (DHL, USPS, UPS). You will be informed about the expected delivery date during checkout. Please note that shipments are only processed on US business days. Additionally, we will send you an email the moment your shipment is handed over to the shipping provider (typically within 1-3 business days). They will provide you with a tracking number so you can follow your shipment throughout its journey. International Shipping: For customers who do not live in the United States, we offer UPS International Shipping, calculated in real-time when you enter checkout. We ship via UPS. Depending on your country, import/customs fees may be applied to your order. Bape Store is not responsible for any shipping deliveries that may be affected by customs, natural occurrences, or air and ground transportation strikes or delays, nor for any extra fees, customs, or backend charges once the package has exited the United States. • Standard International Shipping (10-15 Business Days) When your tracking number becomes available, you will receive a notification via email to track your order. Information about customs: All applicable custom fees, taxes, and duties are the sole responsibility of the customer. Please note that we are not held liable for any custom fees in your country, hold times, or incorrect shipping information provided. Allow 1 to 3 business days for processing your order to receive your tracking number. Note: If you order multiple items, they may be shipped separately to ensure they get to you as fast as possible. In this case, you will be given individual tracking codes so you know exactly where your order is! Lost Package: We are not liable for any misplaced or stolen packages. If your tracking number reads as successfully shipped and the address provided to us upon checkout matches the exact address we have shipped your order to, we are not held responsible if your package has been misplaced. Stolen or lost packages are nonrefundable. If you have any questions, please contact us at support@bapecloth.shop, and we will try our best to assist you with this matter."
