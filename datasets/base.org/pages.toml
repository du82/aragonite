["https://base.org/builders/stories/blocklords"]
title = "Base"
description = "Base is a secure, low-cost, builder-friendly Ethereum L2 built to bring the next billion users onchain."
full_description = '''David Johansson of BLOCKLORDSBuilding a medieval grand strategy game with a player-driven onchain economy.RegionStockholm, SwedenProjectBLOCKLORDSOn Base SinceJanuary 2024Tell us a little about the app you are building on Base?"BLOCKLORDS is a medieval grand strategy game with a player-driven onchain economy, where you can start as a farmer, rise to a warrior, or even rule as a king. It's all about choice, strategy, and progression. The game is live on the Epic Games Store, making it accessible to a broad audience. We also launched BLOCKLORDS Dynasty, a mobile-first companion game built specifically for Base with onchain logic. Last year, Dynasty brought 1.8 million unique wallets to Base, showing that players are ready for deeper blockchain integrations—when done right. ""Take risks. Push the limits when designing smart contracts—don't just follow what's been done before. The best innovations come from experimenting."What's the best part of building on Base?"Low fees, strong liquidity, and a growing user base that actually engages with what you're doing. It's a solid base to build on, no pun intended. What really stands out, though, is the community and support. The Base team has been super helpful, and events like Base Camp were a great chance for builders to meet up, swap ideas, and just get things done. It's that kind of hands-on support that makes a big difference. "What do you want to tell builders who are thinking about Base? Why would you convince them to join Base?"We've been building onchain since 2018, deploying hundreds of smart contracts across almost every major chain. Base stands out—not just for the tech, but for how they support builders at scale. They've gone above and beyond to help us onboard users, build new solutions, and tap into real liquidity."What challenges have you experienced?"Even with Base's low gas fees, we really pushed the limits last year with Dynasty hitting 1.8 million wallets and over 80 million onchain transactions. Since we wanted to sponsor most transactions for early users (shoutout to Paymaster), even those low fees became unsustainable at scale, which added friction for new players. The solution? More on this coming soon. "What advice do you have to other builders?"Take risks. Push the limits when designing smart contracts—don't just follow what's been done before. The best innovations come from experimenting. Don't raise funds too early. Too much money too soon can be just as bad as not enough. Make sure you have product-market fit before locking yourself into investor expectations. "PreviousBack to StoriesNextTara of Cat TownFeeling inspired? Start building today.Feeling inspired? Start building today.Start building with a starter template or see documentation.Start building with a starter template or see documentation.Get StartedExplore Use Cases'''
year_published = 2025
