full_description = '''Merlin Egalite of MorphoBuilding the largest and most secure lending protocol on Base, leveraging the power of the Superchain ecosystem.RegionParis, FranceProjectMorphoOn Base SinceFebruary 2024Tell us a little about the app you are building on Base?"We're building Morpho, a fully immutable and permissionless lending protocol with isolated markets. It's the largest and most secure lending protocol on Base.""Base is at the crossroad of DeFi, memecoins, NFT, and Coinbase's large distribution network."What's the best part of building on Base?"Base is part of the Superchain ecosystem. Hence, it benefits from continuous improvements on the OP stack which will be translated into cheap fees, greater UX for users, and some day, liquidity reaggregation across the different chains part of the ecosystem."What do you want to tell builders who are thinking about Base? Why would you convince them to join Base?"Base is at the crossroad of DeFi, memecoins, NFT, and Coinbase's large distribution network. It's one of the best L2 to build tools and apps that benefit from synergistic integrations!"What challenges have you experienced?"No real challenges actually. Base is EVM based so was pretty simple to integrate on our side."What advice do you have to other builders?"Builders should focus on one thing: reach PMF which is usually synonymous with providing value and fixing real problems."What's one word you think of when you think of Base?"Based."PreviousAchillesHodl of ByteNextDhawal of HeyElsa AIFeeling inspired? Start building today.Feeling inspired? Start building today.Start building with a starter template or see documentation.Start building with a starter template or see documentation.Get StartedExplore Use Cases'''
