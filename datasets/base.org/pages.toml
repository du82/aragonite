["https://base.org/names"]
title = "Basenames"
description = "Basenames are a core onchain building block that enables anyone to establish their identity on Base by registering human-readable names for their address(es). They are a fully onchain solution which leverages ENS infrastructure deployed on Base."
full_description = "BasenamesName is too short Scroll to exploreGet so much more on Base with your profileBuild your onchain identityUse your Basename as your onchain identity in the Base ecosystem.Simplify transactionsSend and receive seamlessly with a readable and memorable Basename.Connect and collaborateEasily find mentors and others to build with by seeing their profiles.Decentralized and open sourceBasenames are built on the decentralized, open source ENS protocol, aligned with Base’s dedication to decentralized and open source technologies. Questions? See our FAQGet more answers in our FAQ, and view our developer docs to see how you can build with Basenames.What are Basenames?Basenames are a core onchain building block that enable builders to establish their identity on Base by registering human-readable names for their wallet address(es). They are fully onchain, built on the same technology powering ENS names, and deployed on Base. These human-readable names can be used when connecting to onchain apps, and sending and receiving on Base and any other EVM chain.What are the Basename registration fees?Basenames are priced based on name length, and are designed to be globally accessible. Annual registration fees are as follows:LengthPrice3 characters0.1 ETH4 characters0.01 ETH5-9 characters0.001 ETH10+ characters0.0001 ETHHow do I get a free or discounted Basename?You can get one free Basename (5+ letters) for one year if you meet any of the below criteria:Coinbase VerificationCoinbase One Verification (free renewals with active subscription)Summer Pass Level 3 NFTBuildathon participant NFTbase.eth NFT holdercb.id username (acquired prior to Fri Aug 9, 2024)BNS name owner - free 4+ letter name (basename.app)An equivalent-value discount of 0.001 ETH will be applied if registering a shorter name, or registering for more than 1 year, with the exception of the BNS name owner discount (valued at 0.01 ETH per unique address). You will need to pay the standard registration fees if you wish to keep your Basename after your initial discount has been fully applied.Discounts are only applied once, and are limited to one per address. Even if you meet multiple criteria, you will only be eligible for a single discount on one Basename. If you satisfy multiple criteria, we will automatically apply the highest-value discount to your registration.We are always looking to add more discounts. If you or your project have ideas for more discounts, please reach out to our team.How can I use Basenames?You can use your Basename across apps in the Base ecosystem, starting with base.org, Onchain Registry, and Onchain Summer Pass. You can also use it for sending and receiving on Base and other EVM chains.Is my profile information published onchain?Basenames are fully onchain, and therefore any information you publish is recorded onchain, requires a transaction, and will be broadly composable with the rest of the ecosystem. Please do not publish any information you do not wish to be onchain.I am a builder. How do I integrate Basenames to my app?If you're a builder looking to integrate Basenames into your app, OnchainKit is the easiest way to get started (tutorial here). If you have ideas for new features or badges that you'd like to integrate with Basenames, we'd love to hear from you.How do I get a Basename for my app or project?You can register a Basename for your app just like any other Basename. If a Basename for your app or project is not available, there is a good chance it was reserved.Please reach out to our team or fill out this form and we will reach out with instructions.Visit FAQs to learn more."
year_published = 2025
clearnet = "https://base.org/names"
