full_description = '''Rookie of the Year (Jackie Robinson Award) Since 1987, the Rookie of the Year is awarded the Jackie Robinson Award. The Rookie of the Year Award is given annually to one player in each league. The award was established in 1947, and given to just one major-league player in each of 1947 and 1948. It was expanded in 1949 to honor the best rookie in each of the American and National Leagues. Until 1957, voters used their own judgment to determine who should be considered a rookie. From 1957, players were considered rookies if they had fewer than 75 at-bats or 45 innings pitched prior to the season. This was later amended to 90 at-bats, 45 innings pitched, or 45 days of MLB service time. In 1971, the standard was adjusted to 130 at-bats, 50 innings pitched, or 45 days of non-September service time, which remains the standard for the award today. The Baseball Writers' Association of America (BBWAA) votes on the Rookie of the Year award at the conclusion of each season before the postseason starts. Table Batting Stats Pitching Stats Year Lg Name Tm WAR BA OBP SLG HR RBI SB W L SV ERA IP SO Voting 2024ALLuis GilNYY3.115703.50151.2171Voting 2024NLPaul SkenesPIT5.911301.96133.0170Voting 2023ALGunnar HendersonBAL6.2.255.325.489288210 Voting 2023NLCorbin CarrollARI5.4.285.362.506257654 Voting 2022ALJulio RodríguezSEA6.2.284.345.509287525 Voting 2022NLMichael Harris IIATL5.2.297.339.514196420 Voting 2021ALRandy ArozarenaTBR3.9.274.356.459206920 Voting 2021NLJonathan IndiaCIN4.1.269.376.459216912 Voting 2020ALKyle LewisSEA1.6.262.364.43711285 Voting 2020NLDevin WilliamsMIL1.34100.3327.053Voting 2019ALYordan AlvarezHOU3.7.313.412.65527780 Voting 2019NLPete AlonsoNYM5.5.260.358.583531201 Voting 2018ALShohei OhtaniLAA4.1.285.361.5642261104203.3151.263Voting 2018NLRonald Acuña Jr.ATL3.9.293.366.552266416 Voting 2017ALAaron JudgeNYY8.0.284.422.627521149 Voting 2017NLCody BellingerLAD3.9.267.352.581399710 Voting 2016ALMichael FulmerDET5.4.000.000.00000011703.06159