o Leagues at this time. 307 of the no-hitters were by a single pitcher and 21 were combined no-hitters." } }, { "@type": "Question", "name": "What is a perfect game in baseball?\n", "acceptedAnswer": { "@type": "Answer", "text": "A perfect game is a game in which a pitcher (or pitchers) does allow a single base-runner in a completed game that lasts nine innings or more. The opposing team cannot record a hit, walk, hit batter, error, or catcher’s interference in the game to be considered a perfect game.\n" } }, { "@type": "Question", "name": "How many perfect games in MLB history?\n", "acceptedAnswer": { "@type": "Answer", "text": "There have been <a href=\"https://www.baseball-reference.com/friv/no-hitters-and-perfect-games.shtml#no_hitters_individual::2\">24 perfect games</a> in major league history, but this total does not include perfect games thrown in the Negro Leagues at this time." } }, { "@type": "Question", "name": "What is triple crown baseball?\n", "acceptedAnswer": { "@type": "Answer", "text": "In baseball, a hitter earns a triple crown when they lead their league in batting average, home runs, and runs batted in. A pitcher earns a triple crown when they lead their league in earned run average, wins, and strikeouts.\n" } }, { "@type": "Question", "name": "How many innings in a baseball game?\n", "acceptedAnswer": { "@type": "Answer", "text": "There are nine innings in a standard baseball game, but if the score is tied after nine innings the game will go into extra innings.\n" } }, { "@type": "Question", "name": "How many games in the MLB season?\n", "acceptedAnswer": { "@type": "Answer", "text": "There are 162 games for each team in the MLB season.\n" } }, { "@type": "Question", "name": "How many games in the World Series?\n", "acceptedAnswer": { "@type": "Answer", "text": "The World Series is a best-of-seven series and the team that wins four games first is victorious. The World Series can last between four and seven games.\n" } }, { "@type": "Question", "name": "How many teams make the MLB playoffs?\n", "acceptedAnswer": { "@type": "Answer", "text": "The MLB playoffs feature twelve teams (six from each league). The six division winners qualify as well as three wild card teams per league.\n" } }, { "@type": "Question", "name": "How long is a baseball game?\n", "acceptedAnswer": { "@type": "Answer", "text": "The average baseball game lasts a little over three hours. New rules introduced in 2023 mean that the length of MLB games is now under two hours and forty-five minutes on average.\n" } }, { "@type": "Question", "name": "How many MLB teams are there?\n", "acceptedAnswer": { "@type": "Answer", "text": "There are 30 teams in MLB.\n" } }, { "@type": "Question", "name": "How many players are on a baseball team?\n", "acceptedAnswer": { "@type": "Answer", "text": "MLB teams carry an active 26-player roster.\n" } }, { "@type": "Question", "name": "How many outs are in an inning?\n", "acceptedAnswer": { "@type": "Answer", "text": "There are three outs per inning in a baseball game.\n" } } ] } if (sr_detect_ie || sr_detect_edge || Modernizr.adfree) { } else { console.log('push ad:div-gpt-ad-728x90-Footer'); freestar.config.enabled_slots.push({ placementName: "div-gpt-ad-728x90-Footer", slotId: "div-gpt-ad-728x90-Footer" }); }'''
