title = "Baseball-Reference.com WAR Explained | Baseball-Reference.com"
description = "WAR explained"
full_description = '''Baseball-Reference.com WAR Explained Since we added Sean Smith's ("rallymonkey" to some) Wins Above Replacement measurement in 2010, we've seen its use expand into many new areas and its popularity catch on in the media and general population. But there have also been a lot of questions about how it's calculated and whether it has validity. In this tutorial, we will run through the calculations in graphic detail and point out areas where our approach differs from some of the other popular WAR or WAR-like approaches. How to Use WAR The idea behind the WAR framework is that we want to know how much better a player is than a player that would typically be available to replace that player. We start by comparing the player to average in a variety of venues, then compare our theoretical replacement player to the average player and add the two results together. There is no one way to determine WAR. There are hundreds of steps to make this calculation, and dozens of places where reasonable people can disagree on the best way to implement a particular part of the framework. We have taken the utmost care and study at each step in the process, and believe all of our choices are well reasoned and defensible. But WAR is necessarily an approximation and will never be as precise or accurate as one would like. We present the WAR values with decimal places because this relates the WAR value back to the runs contributed (as one win is about ten runs), but you should not take any full-season difference between two players of less than one to two wins to be definitive (especially when the defensive metrics are included). WAR Further Discussion How Baseball-Reference.com calculates WAR and how others do: WAR-Wins Above Replacement Explanation WAR-wRAA explanation WAR-Position Players WAR-Pitchers WAR-Runs to Wins (this is especially relevant) Competing WARs Comparison Chart Slides from WAR Overview talk I gave at SABR Analytics, March 2018 My Answer to “I Don’t Like How Complicated WAR Is and How It Is Constantly Changing.” “WAR is Like GDP for Baseball” Response to Critiques by Bill James and Joe Posnanski Bill James: Judge and Altuve, and then Bill James: MVP Followup Joe Posnanski: More on WAR, following up on Judge and Altuve. Dave Cameron's reply to James: Putting WAR in Context: A Response to Bill James Jonathan Judge at Baseball Prospectus wrote an excellent piece on variability in WAR: Prospectus Feature: Bill James vs. The Noise Rany Jazayerli on how WAR should handle luck WAR Editions/Changes This page and related pages give the gory details on how we calculate WAR. Version 2.2, March 2013 Based on discussions with FanGraphs and others, we decided to drop the replacement level to .294 from .320. This means that 2013 MLB has 1000 WAR in the entire major leagues. This was applied retroactively, so that it was applied to all previous AL, NL, and NA seasons. Other Major Leagues (AA, UA, PL, FL) were maintained at the same level relative to the NL. After the positional adjustment was applied we forced the major league average to be zero across the league. A small amount of smoothing was done to transition between decade-long league-vs-league replacement levels. Version 2.1, May 2012 After launching version 2.0 on May 4th, we immediately became aware of an issue that had concerned us, but we thought we still had right. Pitchers were being overvalued due to a runs-to-win estimate that broke down for extreme performances. A stingy pitcher drives down the runs per win, but not to the degree we were showing. A major change to runs-to-win calculation. See our Runs to Wins Page for a full explanation. We now handle runs-to-wins calculations in an exact rather than an estimated way. With the change in runs-to-wins calculation, we can now display Wins Above Average, a related win-loss % and a related win-loss% for 162 games played. Leverage Index adjustment is now only applied to relief pitchers. Leverage Index used is now the LI at the time the reliever entered the game rather than the average LI for all of their plate appearances. This is weighted by number of batters faced. Converted Offensive WAR from afWAR back to oWAR. Note that oWAR + dWAR now double counts position, so adding them will not give WAR. The adjustment for the difference in league starter and reliever ERA has been moved to the calculation of league average rather than the league replacement level. BUG: Fixed a park factor bug. Pitcher opponent strength was not neutralized, so a park factor was being applied to a non-park adjusted number. Now the pitcher opponent strength is converted to a neutral environment, averaged for all opponents and then park adjusted based on a custom park factor for each pitcher based on the exact parks they pitched in. Some feedback of version 2.0 we incorporated: Inside the Book and its readers helped immensely with the runs to wins issue. Version 2.01, May 2012 We made a minor change converting oWAR to afWAR (or average fielding WAR). This has been rolled back and is not in place now. Version 2.0, May 2012 Previous to launch of 2012 WAR numbers, we undertook a top to bottom evaluation of our WAR numbers and added a number of improvements. Switch from BaseRuns for batting to an advanced wRAA metric. Folding ROE, infield singles, SO vs. Non-SO into wRAA. Excluding pitchers' hitting and averaging by league rather than year from the league averages for wOBA and wRAA. Estimation of CS numbers for leagues they are missing. Use of Baseball Info Solutions Defensive Runs Saved from 2003-present (in our view the most advanced defensive metric). Use of a player-influenced runs-to-win conversion for both batters and pitchers based on PythagenPat. Use of a player-specific park factor for pitchers weighted by actual appearances in each park. After a preliminary WAR calculation, we fine-tune the replacement level on a playing time basis, so the total WAR in each league is very consistent year-to-year. dWAR now contains the position component as we feel this better captures player defensive value. In our view, even a poor defensive catcher is likely equally valuable to a good defensive first baseman in terms of team defense. Version 1.0, 2009-May 2012 Sean Smith produced the original framework for the site and until May 2012 we used his numbers and methodology in all locations. We still use his replacement level and position levels, but we have changed much of the remainder of the system. The Concept of Replacement Players Average is a well-defined concept. You sum up all of the observations and then divide by the number of observations. We compute averages every day. So why don't we compute Wins Above Average rather than Wins above Replacement? When computing the value of a major league player, average is a poor baseline for comparison. Average players are relatively rare and can be expensive to acquire. Average players don't make the league minimum. Plus, not all average performances are equal. A team would pay much more for 200 league average innings than for 50. When a star player is injured, they are rarely replaced by an average player -- usually their replacement is much worse. That last point is our premise here. Average players are relatively rare and difficult to obtain. Replacement level players, by their very definition, are players easy to obtain when a starter goes down. These are the players who receive non-roster invites at the start of the year, or the players who are 6-year minor league free agents. Baseball talent among the population is generally distributed normally, but only the very right-end of that curve plays professional baseball. There is some dispute over where to place the replacement level, but most sabermetricians agree that comparing players to a general replacement level is the best approach to valuing players. We'll talk more about this later. Sports Reference sets replacement level at .294 winning percentage or a "record" of 48-114. This change was made in March of 2013 after deciding with FanGraphs.com to set a single replacement level between our sites. We also smoothed out the changes in replacement level between the two leagues where before the change from one decade to the next had been stepwise. WAR: The General Idea The basic currency of WAR is runs. We start with runs added or lost versus an average player and then compare the average player to a replacement player. I just got done saying we don't want to use averages, but an equation should explain what we are doing here. Players Runs over Replacement = Player_runs - ReplPlayer_runs = (Player_runs - AvgPlayer_runs) + (AvgPlayer_runs - ReplPlayer_runs) This gives us two components, player runs above average (RAA) and then the average player's runs above replacement. Ultimately, baseball teams are interested in wins and losses, and so is WAR. RAA is converted to wins above average by running the results through a PythagenPat win-loss estimator (a rundown of PythagenPat). This allows us to more accurately model the interaction between the player and league and the effect on wins. Generally, ten runs will give you one win, but that does not always hold. Adding up all of the WAR on a team (adding in replacement level (48 wins for a full season)), should get you very, very close to the team's actual wins and losses, and should match up even more closely with their Pythagorean win-loss records. Unfortunately, the statistics at our disposal to compare Tris Speaker and Ken Griffey Jr. have changed over time. We now have exact data regarding types and location of batted balls, and this has led to improvements in various measurements (defensive measurements most notably). When we compute our metrics for the various components of WAR, we always use as much data as possible. For example, with baserunning, this means that we'll use stolen bases alone when that is all we have; stolen bases and caught stealings when that is all we have; and full play-by-play accounts of steals by base, pickoffs, and advancements on passed balls, wild pitches, sac flies, doubles, singles, etc... when we have that. Here is an up-to-date listing of our Data Coverage. WAR is calculated separately for pitchers and for position players, so we'll deal with each of them separately. WAR for Position Players WAR for Pitchers WAR Comparison Converting Runs to Wins Runs to Wins details. Differences Between B-R WAR Version 2.1 and Version 2.2 Since replacement level was adjusted down more or less uniformly for all players, every player's WAR went up in proportion to their playing time. The largest I noted was a 5 WAR increase for Pete Rose. Differences Between Old B-R WAR (1.0) and Version 2.1 Below are the players with the ten biggest changes in WAR both up and down for pitching and batting and then the top 50 for batting and hitting before and after. 20 hitters most hurt by changes +------+----------------+-----------+----------+----------+-------+----------+---------+--------------+---------------+------------------+----------------+-------+--------------+-------------+------------------+-------------------+----------------------+--------------------+--------------+---------+----------+ | rk | name_common | player_ID | year_min | year_max | PA | runs_bat | runs_br | runs_defense | runs_position | runs_replacement | runs_above_rep | WAR | runs_bat_old | runs_br_old | runs_defense_old | runs_position_old | runs_replacement_old | runs_above_rep_old | war_rate_old | WAR_old | war_diff | +------+----------------+-----------+----------+----------+-------+----------+---------+--------------+---------------+------------------+----------------+-------+--------------+-------------+------------------+-------------------+----------------------+--------------------+--------------+---------+----------+ | 1 | Mickey Mantle | mantlmi01 | 1951 | 1968 | 9907 | 814.5 | 49.8 | -41.0 | -37.7 | 271.1 | 1056.7 | 105.5 | 879.0 | 55.0 | -36.0 | -37.0 | 272.0 | 11