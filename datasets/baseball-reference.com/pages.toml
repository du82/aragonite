["https://baseball-reference.com/about/pitch_glossary.shtml"]
title = "Pitching Stats Glossary | Baseball-Reference.com"
description = "A glossary for pitching stats on Baseball-Reference.com"
full_description = "Pitching Stats Glossary General Recommendations The player, team and league statlines are now dramatically different than when the site first launched, so a comprehensive list of the stats would take far longer and would likely be much less useful than previously. So we have implemented a tooltip solution that shows you a description of the statistic when you hold your mouse over the header abbreviation for the stat. We also have implemented a sorting feature. When the header abbreviation is red (and this is true of all red text), you can click the header to sort by that column. In many cases the table contains partial-season (for a traded player) and full-season data. When this is the case, we hide the partial seasons in the sorted results, and provide another tooltip to bring the partial seasons back. Occasionally, there is a select box toggle that allows you to hide or show players who may not have met some minimum qualification such as 502 PAs for the batting title. This only comes into play when sorting on ratio stats like on-base percentage, but not counting stats like home runs. The CSV and PRE tooltips provide a means to get comma-separated values suitable for loading into excel, and pre-formatted text that might work better in things like message boards and e-mails. In some cases, a player's career may span seasons for which a stat like strikeouts or sacrifice flies are not available and seasons for which they are. In those cases we attempt to mark the statistic as shown 162. This means that this career total does not include all seasons the player played and therefore we do not know the exact number. For the most common stats found in our leaderboards, we denote league leading stats with bold text and major league leading totals are further marked with italics. For career statistics, all-time leaders are marked with **'s and active leaders with italics. When a stat is unavailable its season entry should be blank, rather than zero. This may not always be the case, but it is what we've tried to do. 162 Game Average This is an attempt to condense each pitcher's career into a single season's worth of stats. With batters this is easy. Just take their career games played and divide by 162 and then divide their career totals by that factor. For pitchers, this is more difficult. What we have done is treat a pitcher season as having Games Pitched + Games Started = 68 as a single-season. So we normalize everything, so a pitcher has Games + Games Started = 68. So an average season is 34 starts or 68 relief appearances. Team Pages The pitchers are listed as follows. First any starters with more than ten games started and most of their appearances as starters are listed. Next, we list the leader in saves (when more than 9) and then the relievers appearing in the most games. Next, we list other starters and then other relievers. It isn't a perfect setup and I'm open to other suggestions. For further questions or comments, send us a note."
year_published = 2025
