full_description = '''MLB Most Valuable Player MVP Award Winners The Most Valuable Player Award is given annually to one player in each league. The award began in 1911 as the Chalmers Award, honoring the "most important and useful player to the club and to the league". This award was discontinued in 1914. From 1922 to 1928 in the American League and from 1924 to 1929 in the National League, an MVP award was given to "the baseball player who is of the greatest all-around service to his club". Prior winners were not eligible to win the MVP award again during this time. The current incarnation of the MVP award was established in 1931. The Baseball Writers' Association of America (BBWAA) votes on the MVP award at the conclusion of each season before the postseason starts. Official MVPs were not awarded in the 1929 AL nor in the NL or AL in 1930. However, balloting was conducted for those league seasons and we have decided to display these 'unofficial' MVPs since their lack of official recognition is largely a technicality. Table Batting Stats Pitching Stats Year Lg Name Tm WAR BA OBP SLG HR RBI SB W L SV ERA IP SO Voting 2024ALAaron JudgeNYY10.8.322.458.7015814410 Voting 2024NLShohei OhtaniLAD9.2.310.390.6465413059 Voting 2023ALShohei OhtaniLAA9.9.304.412.65444952010503.14132.0167Voting 2023NLRonald Acuña Jr.ATL8.2.337.416.5964110673 Voting 2022ALAaron JudgeNYY10.5.311.425.6866213116 Voting 2022NLPaul GoldschmidtSTL7.7.317.404.578351157 Voting 2021ALShohei OhtaniLAA8.9.257.372.59246100269203.18130.1156Voting 2021NLBryce HarperPHI5.9.309.429.615358413 Voting 2020ALJosé AbreuCHW3.0.317.370.61719600 Voting 2020NLFreddie FreemanATL3.3.341.462.64013532 Voting 2019ALMike TroutLAA7.9.291.438.6454510411 Voting 2019NLCody BellingerLAD8.6.305.406.6294711515 Voting 2018ALMookie BettsBOS10.7.346.438.640328030 Voting 2018NLChristian YelichMIL7.3.326.402.5983611022 Voting 2017ALJose AltuveHOU7.7.346.410.547248132 Voting 2017NLGiancarlo StantonMIA7.9.281.376.631591322 Voting 2016ALMik