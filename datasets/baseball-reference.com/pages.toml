title = "Baseball Frivolities and Fun Stuff | Baseball-Reference.com"
description = "Baseball Trivia, Oddities, and Fun Lists: Cups of Coffee, Birthdays, Spanish-to-English Dictionary"
full_description = "Baseball Frivolities and Fun Stuff I get lots of great ideas, both from readers (the best ones) and while I should be thinking about something else. This area lists many of those ideas. These are little features that make the site a little more fun to use. Player Info Players who played for multiple teamsFind all the players who played for some combination of teams. Can also request a list of players who played exclusively for those teams. Players Born on this DayFind players born on this day or any day of the year. Players Who Died on this DayFind players who died on this day or any day of the year. Players Born Before/After a BirthdateFind players who are older or younger than you in baseball. Baseball Player NicknamesOur unofficial list of major and minor league nicknames 2023 MLB Rules Changes Effect on Stats and Pace of PlayA rundown of stats related to the rule changes and how they've changed in 2023. Baseball Player Name Pronunciation GuideOur unofficial guide to the pronunciation of major and minor league baseball player names Baseball Players with Notes about their NamesOur unofficial list of major and minor league name changes, corrections and oddities Uniform Number SearchFind all players to wear a particular number. Milestone WatchQuickly identify players nearing milestone statistical totals and player climbing up all-time leaderboards. No-Hitters and Perfect GamesAll pitchers and groups of pitchers that have pitched no-hitters and perfect games. Pitchers with 20 or More LossesPitchers who have lost 20 games in a season. Cups of CoffeePlayers who played in only one major league game. Non-pitchers who PitchedPosition players who appeared for a game or more as a pitcher. I used five times as many non-pitching games as pitching games for the cutoff. Handedness ReportFind the percentage of players handedness over a period of years. Place of Birth ReportFind the percentage of players from a country or state over a period of years. Players by Place of BirthFind all players born in a particular place. Players by Schools AttendedFind all players that went to a school. Tools Random PagesSearch for the term 'Random' or save the link as a bookmark and be sent to a random page on this site. Trade PartnersFind the last trades between any two franchises, and most common trade partners. Retired UniformsRetired uniforms for each major league franchise. Franchise Example Color Schemes and UniformsSimple colorful medallions for each major league franchise. Transactions on This DateFind all MLB transactions to occur on a particular date. Player LinkerAdd links to Baseball-Reference.com player pages when creating a blog or discussion board post or when selecting a block of text anywhere on the web. Share Baseball-Reference.com Stats AnywhereLearn how our Share tooltip works. Player Linking ToolInsert your text and every player name will be linked to their corresponding baseball-reference.com page. English to Spanish and Spanish to English Baseball DictionaryDr. Ralph Insinga has graciously allowed us to provide his dictionary to our users. Comeback WinsSee the most improbable comeback wins in major league history."
