title = "The Negro Leagues Are Major Leagues: A Resource for Educators | Baseball-Reference.com"
description = "This resource will help educators share the incredible story of the Negro Leagues—from the pioneers of Black Baseball in the late 19th century through the formation of the Negro Major Leagues and into the impact of integration on the American and National Leagues."
full_description = "The Negro Leagues Are Major Leagues: A Resource for Educators #content.reading>h1 { display: none; } #content.reading .section_wrapper { border-top: none; margin-top: 80px; } #content.reading .section_wrapper:first-of-type, #content.reading .section_wrapper:nth-of-type(2) { margin-top: 0; } .section_wrapper .section_heading>h2 { background: #231E20; border: 2px solid #CD2036; box-shadow: 0 0 0 3px #231e20; padding: 8px 15px; text-align: center; text-transform: uppercase; color: white; display: block; text-shadow: 1px 1px #cd2036; margin: 10px 0; } .section_wrapper h3 { background: #CD2036; border: 2px solid #231E20; box-shadow: 0 0 0 3px #cd2036; padding: 6px 12px; text-align: center; text-transform: uppercase; color: white; display: block; text-shadow: 1px 1px #231e20; } .image_box { float: right; background-color: #eee; width: 300px; padding: 10px 10px 20px; text-align: center; margin: 0 0 20px 20px; } .image_caption { font-size: 16px; line-height: 1.25; margin: 10px 10px 0; display: block; } .image_credit { font-size: 12px; line-height: 1.25; margin: 10px 10px 0; display: block; } @media screen and (max-width: 1019px) { .image_box { float: none; width: auto; margin: 0 auto 1em; } } A Resource for Educators Minnie Miñoso was elected to the Baseball Hall of Fame in December 2021, shortly after the addition of Negro League statistics pushed his major league hit total past 2,000. Art by Graig Kreindler. Used with the permission of Jay Caldwell and can not be reproduced without Baseball Reference’s permission. In June of 2021, Baseball Reference launched The Negro Leagues are Major Leagues, a massive project that dramatically expanded the site’s coverage of the Negro Leagues and historical Black major league players. As the title of the project implies, players and teams from the Major Negro Leagues between 1920–1948 were fully incorporated into the site along with the American and National League. Even with the tremendous efforts of the team behind the Seamheads Negro League Database (from whom we acquired the data), the Negro Leagues data is not complete. While the quality of play in the Negro Leagues was on a major league level, the wages, travel, playing conditions, press coverage, and record-keeping were more varied, primarily due to systemic racism. Additionally, Negro League teams played a shorter regular season schedule, but with an extensive amount of exhibitions and barnstorming games that made for seasons that often approached 200 or more games in total. These contests were not part of their league schedule and are therefore not included in this database. It's also important to remember that the history of Black Baseball does not start in 1920 or end in 1948 and even from 1920-1948 our presentation is incomplete. There were hundreds of teams and thousands of players that make up a more complete and richer history of Black Baseball than we are able to present here, and from 1920–1948 there were many star players and teams that found it more feasible to play only a barnstorming schedule (not just in the United States but also the Caribbean, Mexico, and Venezuela) rather than participate in leagues. The Negro Leagues Are Major Leagues is a unique introduction to the history of the segregation of professional baseball, telling the story of the Negro Leagues while simultaneously recounting how researchers, statisticians, and historians rebuilt and rediscovered the history of Black baseball that was pushed into obscurity in the wake of Jackie Robinson and integration. We co-produced this book with the Society for American Baseball Research (SABR). It is available at Amazon or other booksellers.If you are an educator interested in reviewing this book for your class and providing excerpts to your students, contact us and we can provide a PDF. The Negro Leagues were major leagues, but they were different. Those differences need to be both recognized and celebrated. Bob Kendrick and Joe Posnanski wrote “[T]here is more than one truth when it comes to the Negro Leagues… Nothing at all is simple about a league that was built to combat and overcome hate and yet was so much about joy and a love of the game. Nothing at all is simple about counting statistics for players who traveled from town to town, regularly playing a dozen or more games per week against town teams and factory teams, in tournaments and exhibitions, all in addition to their official Negro Leagues games.” We have created this resource for educators to share the incredible story of the Negro Leagues—from the pioneers of Black Baseball in the late 19th century through the formation of the Negro Major Leagues and into the impact of integration on the American and National Leagues. Today, the widespread release of meticulously collected Negro League statistics has led to a Golden Age of Negro League research that culminated with the first Hall of Fame selections from the Negro Leagues in fifteen years—Minnie Miñoso, Buck O’Neil, and Bud Fowler. In his essay “A Love Story”, 14-year Major League Baseball veteran Adam Jones wrote “[T]he Negro Leagues were very, very important, the players were very important and, most importantly, they brought the community together with a common love. And they’re important not just for Blacks, but for all people of color. There were a lot of early Latin American players and their stories also need to be told. All of these men—and some women, too, let's not forget about them—were very instrumental in the building of Major League Baseball and, like it or not, their stories need to be told.” Additional Reading: Negro Leagues By The Numbers by Bob Kendrick, President of the Negro Leagues Baseball Museum, with Joe Posnanski: A look at what the statistics of the Negro Leagues mean. A Love Story by Adam Jones, 14-year MLB veteran: What the Negro Leagues mean to a modern Black star. Black Baseball Before the Negro Leagues Bud Fowler, elected to the Hall of Fame in 2021 through the Early Baseball Era Committee, was a pioneer as a player, manager, organizer, and promoter. Art by Graig Kreindler. Used with the permission of Jay Caldwell and can not be reproduced without Baseball Reference’s permission. The Negro National League was founded in 1920, but the history of Black baseball starts well before then. As early as 1859, there are records of Black baseball clubs facing off, well before the sport began to professionalize or adopt many of the rules that define it today. For Black baseballers, writes Michael Lomax, “the sport’s institutional and organizational development evolved as part of African American community building in the pre-Civil War era.” In his piece on the evolution of Black Baseball from the 19th through the 20th century, Lomax examines the way “the Black game was transformed into a commercialized amusement by a generation of African Americans who attempted to work within the parameters of a segregated institutional structure.” The figures who led that transformation are a vital part of the history of baseball, but many of their stories are still not known by casual fans. There was Charles Douglass, Frederick’s son, who played infield for the dominant Washington DC Mutual Base Ball Club; Octavius Catto, a civil rights activist who fought for official membership in the Pennsylvania Association of Base Ball Players; Bud Fowler, the first acknowledged African-American professional player; and many more. Ryan Swanson reflects on the Black pioneers of 19th century baseball and explores how, “​​in a nation that defined race primarily on Black and White terms, the fact that African American clubs rose up quickly was significant. The ballot, education, and land were preeminent concerns for Black Americans, yes, but so too was finding community and recreation. Baseball fit.” Ryan Swanson also appeared on Episode Four of The Negro Leagues are Major Leagues podcast to discuss how the color line was drawn, as well as looking at the ways that the history of early baseball is deeply intertwined with the politics of Reconstruction. Additional Reading: A Black Baseball Legacy by Michael E. Lomax: The evolution of Black Baseball from the 19th through the 20th century. The Long Road to Jackie Robinson: Nineteenth Century Pioneers in Black Ball by Ryan Swanson: From Charles Douglass (son of Frederick) to Octavius Catto, all the way to Jackie Robinson. May The Best Man Win: The Black Ball Championships 1866–1923 by Todd Peterson (via SABR) 1920–1948 Rube Foster, manager and owner of the Chicago American Giants, formed the Negro National League in 1920. Art by Graig Kreindler. Used with the permission of Jay Caldwell and can not be reproduced without Baseball Reference’s permission. In February of 1920, at a YMCA in Kansas City, a group of African-American baseball club owners gathered to discuss the possibility of forming a league. To their surprise, one man showed up with the charter for a league already written. That man was Rube Foster, the manager and owner of the Chicago American Giants. Foster, a great pitcher in his playing days, recognized the tremendous opportunity that could come with a league of Black baseball clubs, but he also saw the need to create an organization that gave “concrete form to the model of self-help and self-reliance, free from white interference or control,” as Jerry Malloy writes. Foster and his fellow owners formed the Negro National League, the first Black major league. The NNL played its first season in 1920, with eight teams; Foster’s American Giants went 43-17 led by Hall of Famer Cristóbal Torriente. Foster was more than the league’s founder and acting president, he was “de facto czar…a benevolent autocrat,” writes Malloy. “Realizing the need for a semblance of balanced competition, [Foster] moved players around from team to team, even depriving his own Chicago American Giants of the great Oscar Charleston, whom he sent to Indianapolis.” The Negro National League’s motto was “We Are the Ship, All Else the Sea,” articulating a sense that even though the teams were competitors on the field, they were bonded together by the same mission off it. The NNL folded in 1931, but other leagues formed concurrently and afterwards. The SABR (Society for American Baseball Research) Negro Leagues Task Force determined that seven leagues were full major leagues. These leagues spanned the years from 1920 to 1948 and included many of the best players to ever play the game, including 32 Hall of Famers. Additional Reading: The Major Negro Leagues by Adam Darowski: A look at the seven major Negro Leagues. Rube Foster and Black Baseball in Chicago by Jerry Malloy (via SABR) The Negro National League is Founded by Matt Kelly (via the Baseball Hall of Fame) SABR Negro Leagues Task Force issues recommendations on major-league status (via SABR) Turkey Stearnes had two batting titles and seven home run titles in his incredible 18-year career. Art by Graig Kreindler. Used with the permission of Jay Caldwell and can not be reproduced without Baseball Reference’s permission. The people who played for Negro League teams were major league ballplayers, but they weren’t treated that way by the White owners of the American and National Leagues. They were citizens of the United States, but were not treated as such by the government of their own country. As Vanessa Ivy Rose, granddaughter of Hall of Famer Turkey Stearnes, puts it, “the elite talent pool of the Negro Leagues was undoubtedly competitive, but Jim Crow was unequivocally Turkey’s greatest opponent.” Stearnes began his Negro National League career with the Detroit Stars in 1923. Over an 18 year career that spanned four different major leagues, Stearnes posted a 1.034 OPS (on-base percentage plus slugging percentage, a measure of offensive performance), the 7th best career OPS in major league history. He led his league in home runs seven times and, as Rose discusses in her piece, won election to the Hall of Fame in 2000. Another one of the Negro Leagues’s brightest stars was Josh Gibson. His Hall of Fame plaque credits him with “almost 800 home runs” while other sources put the total at 962. So far, researchers have been able to account for 165, but that’s because the research has stuck to league play, which only made up a small portion of the total schedule for Negro League players. Outside of the league, most teams made a majority of their income and played the majority of their games through barnstorming and exhibitions. Gibson led his league in OPS nine times, home runs 11 times, and position player WAR (wins above replacement, a measure of player value that includes offense, defense, base-running, and position) eight times. Wilber “Bullet” Rogan was one of many great two-way players in the Negro Leagues. He joined the Kansas City Monarchs in 1920 after several years playing in the Army with the 25th Infantry Wreckers (where his list of teammates included Oscar “Heavy” Johnson and Dobie Moore). At the plate, Rogan was a slugger and batted .338 with a .413 on-base percentage and .521 slugging percentage. His OPS+ (OPS park adjusted and compared to the league, where 100 is league average) was 152. On the mound, he went 120–52 in documented league games with a 2.65 ERA (161 ERA+, earned run average park adjusted and compared to the league, where 100 is league average). Rogan is the only player who exclusively played in the Negro Leagues with 60 Wins Above Replacement (including batting, fielding, base-running, position, and pitching). Because of the incomplete statistics, it is very difficult to reach those levels. But Rogan did it by essentially playing the role of two superstars. Additional Reading: Turkey Stearnes and the Inclusive Grand Slam by Vanessa Ivy Rose, granddaughter of Turkey Stearnes: A reflection on the legacy of Hall of Famer Turkey Stearnes. Gibson Family Reflections on the Publication of Baseball Reference’s Negro Leagues Statistics by Sean Gibson, great-grandson of Josh Gibson: What it means to family members of Negro League stars to see this update. Effa Manley, co-owner of the Newark Eagles, is the only woman in the Baseball Hall of Fame. She was not the first woman to own a Negro League team. That distinction goes to Olivia Taylor of the Indianapolis ABCs. Art by Graig Kreindler. Used with the permission of Jay Caldwell and can not be reproduced without Baseball Reference’s permission. Women were a crucial part of the Negro Leagues, as team owners, workers, spectators, journalists, and players. Effa Manley, who is currently the only woman in the Baseball Hall of Fame, owned the Newark Eagles, which won the Negro League World Series under her stewardship in 1946. In addition to Manley, several other women owned Negro Leagues teams, beginning with Olivia Taylor who owned the Indianapolis ABCs from 1922 to 1924. Taylor had a life that extended well beyond baseball. As historian Leslie Heaphy writes, “Taylor became president of the local NAACP chapter. She "
