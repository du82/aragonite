full_description = '''Bullpen Front PageBR Front PageToolboxWhat links hereRelated changesSpecial pagesPrintable versionPermanent linkPage informationMoreCommunity portalWhat's HappeningRecent changesRandom pageHelpUpload wizard#pt-anonuserpage { color: black; font-weight: bold; }BULLPEN SUBSITE Tools:Not logged inTalkContributionsLog inRequest account More BR Front PageToolboxWhat links hereRelated changesSpecial pagesPrintable versionPermanent linkPage informationMoreCommunity portalWhat's HappeningRecent changesRandom pageHelpUpload wizardPersonal ToolsNot logged inTalkContributionsLog inRequest account SearchNamespacesMain PageDiscussionViewsReadView sourceView history Main PageFrom BR Bullpen SABR/Baseball Reference Encyclopedia Baseball's collaborative encyclopedia with 117,837 articles What's the SABR/BR Encyclopedia? · How to contribute · Guidelines · Copyrights · Warnings & Disclaimer · Sandbox Featured Article Pitcher Max Scherzer has over 200 wins and 3,000 strikeouts in the major leagues. He won three Cy Young Awards and led his league in wins four times and strikeouts three times. An eight-time All-Star, he is a two-time World Series champion. He was the sixth pitcher to win Cy Young Awards in each league. By fashioning a no-hitter and a one-hitter in consecutive starts, he had the best back-to-back series of starts since Johnny Vander Meer's famed consecutive no-hitters. Barring controversy on or off the field, he would seem to be a shoo-in Hall of Famer when he retires. Recently featured: 2015 World Series - Seung-yeop Lee - Arky Vaughan Archive – More featured articles Did You Know... From the Bullpen's newest and recently updated articles: ...what historic trade Yohei Kagiya (pictured) was part of? ...what All-Star honor Jake Whitney took home? ...what big homer Lyle Lin hit for Taiwan in 2024? ...what postseason record Jong-hun Kim once held? ...what crucial win Frandelis García got for Venezuela? ...what records Sang-jin Kim set? ...in what league Jeff Goldbach was the All-Star catcher? ...what incredible feat Caleb Pendleton performed in the first game of his college baseball career? ...what record Bong-ok Oh set? ...what was historic about Yoshiki Sunada's first win? ...how the 1993 Padres experimented with Derek Bell? ...what record Nobuyoshi Yamada set in 2018? Archive – Start a new article News The Canadian Baseball Hall of Fame announces its class of inductees for 2025, which consists of Amanda Asay, Jose Bautista (pictured), Erik Bedard, Greg Hamilton, Arleene Noga and Gerry Snyder. The Leones del Escogido win the 2025 Caribbean Series. Esmil Rogers is named Caribbean Series MVP. Karim García and Álvaro Ley López are inducted into the Caribbean Baseball Hall of Fame. The Canberra Cavalry win the 2024-2025 Australian Baseball League. The Charros de Jalisco capture their third Mexican Pacific League title. Recent Deaths – Recent Events Today in Baseball March 2: Today's featured birthday is that of Anthony Sanders, who turns 51. 1886 - Sam Barkley is suspended for signing with the Pittsburgh Alleghenies while sale details were still being ironed out. Pittsburgh owner Denny McKnight loses his job as American Association president over the feud. 1949 - Joe DiMaggio, struggling in spring training, leaves camp to go to Johns Hopkins University to get his right heel examined. 1973 - Arizona State University star Eddie Bane pitches a perfect game against Cal State Northridge. 1992 - Ryne Sandberg signs for $7.1 million per season, becoming the highest-paid player in baseball history. 1999 - Smokey Joe Williams, Frank Selee (pictured), Orlando Cepeda and Nestor Chylak are elected to the Hall of Fame. 2012 - Major League Baseball expands the postseason from eight to ten teams, with an extra wild card team in each league. The two wild card teams in each league will play a Wild Card Game to determine which one will face the team with the league's best record in the Division Series. Recent days: March 1 – February