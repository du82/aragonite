["https://basecamp.com/newsletter/2023-06-23"]
title = "Basecamp: What’s new at 37signals"
description = "Trusted by millions, Basecamp puts everything you need to get work done in one place. It’s the calm, organized way to manage projects, work with clients, and communicate company-wide."
full_description = "Newsletter • June 23, 2023 What’s new at 37signals Hey there— A lot’s been happening at 37signals (makers of Basecamp and HEY) — here’s some of what we’ve been up to recently. Features we’ve added Turn Off Reminders: Some people like being reminded of things every day, but if you don’t need it, you can now toggle your event and to-do reminders on and off on Basecamp. 24-Hour Clock: Here’s one for international Basecamp users, or people who prefer using military time. Now you can easily switch to a 24-hour clock display that’ll convert times everywhere in Basecamp, from the meeting scheduler to Campfires. Workflows and Contact Notes: HEY for Domains, our email platform for small businesses, got two big new features this spring: Workflows and Contact Notes. It’s like a lightweight customer management tool that can automatically route emails through a process and keep notes on customer details — both great ways to keep a growing business organized. Thoughts we’ve shared We Stand with the Underdog: Jason explains why being an underdog is a good thing. Small is not less than. It’s greater than. It’s faster than. It’s better than. In fact, your competitors might even wish they were as small as you, because the biggest advantage you have is speed. Remote Work Still Works: It’s been three years since the pandemic forced people to work from home, and now businesses everywhere are forcing employees back into the office. Check out this blog post where David argues that hybrid combines the worst of office and remote work, and describes how 37signals uses regular meetups to recharge the trust batteries in our remote company. Things we’re excited about Basecamp Community: For the past year, we’ve been fine-tuning a space for Basecamp users to come together, ask questions and exchange tips. And finally, Basecamp Community is now open to everyone. If you’re looking to get even more out of your Basecamp experience (or if you’re just interested in meeting incredible people doing incredible things), learn more and sign up here."
year_published = 2025
