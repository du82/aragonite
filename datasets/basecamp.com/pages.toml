["https://basecamp.com/cloud-exit"]
title = "Basecamp: Leaving the Cloud — Cloud Computing Isn’t For Everyone"
description = "We’ve run extensively in both Amazon’s cloud and Google’s cloud, but the savings never materialized. So we’ve left."
full_description = "We’ve run extensively in both Amazon’s cloud and Google’s cloud, but the savings never materialized. So we’ve left. Leaving the Cloud: Cloud Computing Isn’t For Everyone We’ve run extensively in both Amazon’s cloud and Google’s cloud, but the savings never materialized. So we’ve left. Cloud computing is basically renting computers, instead of owning and operating your own server hardware. From the start, companies that offer cloud services have promised simplicity and cost savings. Basecamp has had one foot in the cloud for well over a decade, and HEY has been running there exclusively since it was launched two years ago. We’ve run extensively in both Amazon’s cloud and Google’s cloud, but the savings promised in reduced complexity never materialized. So we’ve left. The rough math goes like this: We spent $3.2m on cloud in 2022. The cost of rack space and new hardware is a total of $840,000 per year. Leaving the cloud will save us $7 million over five years. At a time when so many companies are looking to cut expenses, saving millions through hosting expenses sounds like a better first move than the rounds of layoffs that keep coming. Our cloud exit is making headlines Save $7 million on cloud by spending $600k on servers, says 37signals’ David Heinemeier Hansson Basecamp decided to leave the cloud after spending $3.2 million in one year Could machine learning refresh the cloud debate? 37signals expects to save $7m over five years after moving off of the cloud Cloud vs on-prem: SaaS vendor 37signals bails out of the public cloud Leaving the Cloud Why cloud isn’t always the answer More de-clouding posts Introducing Kamal Cloud exit pays off in performance too Cut cloud before payroll De-cloud and de-k8s — bringing our apps back home Don’t be fooled by serverless We stand to save $7m over five years from our cloud exit Why we’re leaving the cloud Five values guiding our cloud exit The hardware we need for our cloud exit has arrived The only thing worse than cloud pricing is the enterprisey alternatives Sovereign clouds We have left the cloud"
year_published = 2025
