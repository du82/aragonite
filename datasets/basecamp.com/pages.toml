["https://basecamp.com/underdogs"]
title = "Basecamp: Basecamp stands with the underdogs"
description = "Freelancer? Underfunded non-profit? Small team feeling stuck in a large enterprise? Start-up battling established competitors? You’re our people."
full_description = "Freelancer? Underfunded non-profit? Small team feeling stuck in a large enterprise? Start-up battling established competitors? You’re our people. We stand with the underdogs Freelancer? Underfunded non-profit? Small team feeling stuck in a large enterprise? Start-up battling established competitors? You’re our people. What do they got? A big team, lots of money, a strong brand, seemingly unlimited resources, panache, reputation, all that. They’re established. They’re your competitors. You want to look away, but you see them everywhere. Their ads on your social, their name in the media, your dream clients on their website. But you know what else they got? Bigger company bloat. Overflowing obligations. Narratives to uphold. Appearances to maintain. Entitlement. Too much overhead. They’re slow. They’re conservative. They talk too much. They’ve stopped taking risks. They’re resting on their laurels, gliding on their reputation. They’re on defense. What they’ve really got is a lot to lose. What do you got? Hunger. Drive. Grit. Scrappiness. Independence. You’re on offense. You don’t have enough, which is why you’re dangerous. You have no choice but to be clever and creative. To make up for what you don’t have with something they can’t have: The underdog spirit. You can move. You can adjust. You can adapt. You can get it done while they’re still stuck deciding what to do. Small is not a stepping stone. Small is not less than. It’s greater than. It’s faster than. It’s better than. Savor your position. You don’t get to be the underdog forever. The baton will be passed. But for now, it’s your magic wand. Use it. We stand with the underdogs Thanks for reading, and for giving Basecamp a try. You can always contact me directly if you have any questions at jason@37signals.com. I look forward to hearing from you. Jason Fried Co-founder & CEO"
year_published = 2025
