["https://basecamp.com/newsletter/2023-09-18"]
title = "Basecamp: And now for something completely new"
description = "We all love a great story, and it‘s even more exciting when you get to see it unfold before you, in real time."
full_description = "Newsletter • September 18, 2023 And now for something completely new Hey there— We all love a great story, and it‘s even more exciting when you get to see it unfold before you, in real time. If you read nothing else today, this is one you won‘t want to miss… Once upon a time you owned what you paid for, you controlled what you depended on, and your privacy and security were your own business. We think it’s that time again… And if that inspires you, as it does us, maybe now‘s the time for you to start something new. Inspiration doesn‘t last forever. If you want to do something, you‘ve got to do it now. You can‘t put it on a shelf and wait two months to get around to it. You can‘t just say you‘ll do it later. Later, you won‘t be pumped up about it anymore. If you‘re inspired on a Friday, use the weekend to dive into the project. When you‘re high on inspiration, you can get two weeks of work done in 24 hours. Inspiration is a time machine in that way, but it won‘t wait for you. It‘s a now thing. If it grabs you, grab it right back and put it to work.* Have a great idea? Drop me a line, or share it in the Basecamp Community! * Adapted from “Inspiration is Perishable” in REWORK Thoughts we’ve shared Dropping TypeScript The next release of Turbo 8 is dropping TypeScript. Some may disagree about this decision, and very few programmers are typically interested in having their opinion changed. But check out David Heinemeier Hansson‘s blog post and recent REWORK podcast episode on why this makes sense. Minding the Small Stuff (from Jorge Manrubia, on the Dev blog) Nitpicking in pull request reviews means offering insight that looks excessive, pedantic, and unimportant. It’s a pejorative term. But with negative connotations, this practice suddenly becomes undesirable: mind the big picture or leave the pull request alone. With that, we disagree. When writing code, small stuff matters, a lot. Things we’re excited about Summer Interns Report Out Our programming and ops interns just finished their 3-month, summer program with us. There‘s no coffee-fetching here. Our interns were treated as much like any other member of the team, doing meaningful cycle work that they could start shipping by their second week. How did they do it? And how did we do it? It‘s all right here. See Jason Fried, Live! On September 21, Jason joins Vancouver Tech Journal (IRL!) and special guests at the Vogue Theatre for an in-depth conversation on technology, the big ideas changing business, and what it all means for the future of entrepreneurship. Tickets are still available. Calling all Creators We‘re looking for people who are interested in sharing their experiences with Basecamp or HEY on social media. If you create content on YouTube, Twitter, or TikTok, let‘s talk. DM @37signals on one of these channels or email creators@37signals.com! Until next time, — Elaine, COO at 37signals"
year_published = 2025
