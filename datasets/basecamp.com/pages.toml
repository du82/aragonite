["https://basecamp.com/handbook/our-rituals"]
title = "Our Rituals"
full_description = ":root { --color-text: 29, 45, 53; --color-background: 255, 255, 255; --color-link: 29, 45, 53; } @media (prefers-color-scheme: dark) { :root { --color-text: 29, 45, 53; --color-background: 255, 255, 255; --color-link: 29, 45, 53; } } Heads up! This page uses features your browser doesn’t support. Try a modern browser like Firefox or Chrome for the best experience. 37signals Employee Handbook Chapter 5: Our Rituals Next: Managing Work Devices Meet-ups The entire company gathers in person twice a year. We meet up in a different city every time. In 2022, we traveled to Miami and Amsterdam. In 2023, Barcelona and New Orleans. Most of the planning is taken care of for you; you just need to book your flights. Lodging, meeting space, agenda, and social outings will be planned and communicated well in advance. There are some scheduled talks at every meet-up, like the All Hands session on Monday morning, lightning talks, and peer appreciation. Occasionally, we bring in outside speakers or trainers. Other than that, the meet-up is intentionally loosely structured. Teams huddle in a breakout room for a strategy session, groups go out for coffee or to explore the city, or managers meet 1:1s with employees. Meet-ups are 1 week long. Most people arrive Sunday, we meet Monday through Thursday, then travel home on Friday. Everyone should come to every meet-up, but skipping one here and there is okay if you have an engagement you can’t cancel. All Hands At the end of every cycle, we hold an All Hands meeting. Everyone at the company gathers on a Zoom call (or in person, at meetups) to hear about product development, business operations, new hires, and anything else that’s happened recently that’s worth sharing. Our COO runs the All Hands, but many people across departments may present on topics close to them during these meetings. Everyone on Support (EOS) Everyone in the company is encouraged to do periodic Customer Support shifts. We call it Everyone on Support (EOS). Talking directly to customers helps us realize what’s wrong and what’s right with our products. You’ll always have access to our wonderful Support team if you need help writing clear and correct answers to customer questions through Help Scout, our support response tool. Managing Work Devices → Copyright ©1999-2025 37signals LLC. All rights reserved. Back to Basecamp.com 37signals Employee Handbook Everything you need to know about making a career at 37signals. Preface Chapter 1 Getting Started Chapter 2 Benefits & Perks Chapter 3 How We Work Chapter 4 Making a Career Chapter 5 Our Rituals Chapter 6 Managing Work Devices Chapter 7 Our Internal Systems Chapter 8 A Note About Moonlighting Chapter 9 Code of Conduct Chapter 10 State Leave Provisions Chapter 11 Severance Packages Chapter 12 Titles for Designers Chapter 13 Titles for Ops Chapter 14 Titles for Programmers Chapter 15 Titles for QA Chapter 16 Titles for Support"
