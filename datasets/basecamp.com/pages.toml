["https://basecamp.com/newsletter/2023-11-02"]
title = "Basecamp: All about HEY!"
description = "HEY features, news and more."
full_description = "Newsletter • November 2, 2023 All about HEY! Hey there— Last week, a friend told me about their “burner email” account. It’s an email address you use to sign up for all the stuff that makes you have an account, even though you don’t really want one. Or maybe the email you use only buying things online? Or to sign up for “free” stuff? Somewhere along the line, inboxes have turned into a chaotic mess, where every day you go through a morning routine of deleting the ads from stores you bought from that one time, emails you never asked for and newsletters you quit reading months ago. You try to make sure you don’t delete the more important stuff. From screening out spam to grouping similar types of messages (receipts, newsletters, reply-laters), HEY gives you control of your Inbox (or, Imbox, as we call it), with a few easy steps. You don’t even have to give up your Gmail address. And sure, other email programs let you say “no” to certain senders, but only HEY lets you say “F$% no!” And if you’re running a business, you really don’t have time for nonsense. HEY’s contacts and workflows features were built with organizing and streamlining email for small businesses in mind. But don’t just take our word for it. Here’s what a long-time HEY user and solopreneur says about it. By the way, if you’ve tried HEY and thought, “What it really needs is a calendar!” We agree! Coming soon to a mailbox near you! Thoughts we’ve shared In the newest REWORK Podcast episode, Jason and David delve into the concept of Easter eggs—those hidden surprises that infuse a touch of edgy enjoyment into software, and how this feature has emerged as a compelling reason for both newcomers and returning users to explore HEY as their email solution. Things we’re excited about All this talk about email got our creative sparks going and unleashed a series of hilarious videos answering burning questions like… There’s a screen separating you and your inbox, but what if you actually had to hang out with your email? Yikes! What if we sent researchers out on an expedition to uncover how early cave people sent email? Until next time, — Elaine, COO at 37signals"
year_published = 2025
clearnet = "https://basecamp.com/newsletter/2023-11-02"
tags = ["37signals", "basecamp", "don’t", "email", "excited", "hey!", "shared", "things", "thoughts", "we’re"]
