["https://basecamp.com/handbook/managing-work-devices"]
title = "Managing Work Devices"
full_description = ":root { --color-text: 29, 45, 53; --color-background: 255, 255, 255; --color-link: 29, 45, 53; } @media (prefers-color-scheme: dark) { :root { --color-text: 29, 45, 53; --color-background: 255, 255, 255; --color-link: 29, 45, 53; } } Heads up! This page uses features your browser doesn’t support. Try a modern browser like Firefox or Chrome for the best experience. 37signals Employee Handbook Chapter 6: Managing Work Devices Next: Our Internal Systems Everyone receives a new Mac when they join 37signals. We centrally manage and secure these devices with Kandji which reduces our exposure to security incidents. Kandji applies a standard configuration to every device (e.g. enable disk encryption, firewall, password rules), it installs essential apps (e.g. EncryptMe), and it will ensure the apps have the latest security updates applied. Kandji also allows us to remotely wipe devices should they be lost, or when an employee leaves the company. This doesn’t mean you are being monitored or tracked! Kandji is a configuration management system, not a panopticon. Access to code and secrets Knowing our devices are safe and secure allows us to entrust our work computers with access to sensitive systems like Queenbee, and our internal VPN and remote servers. This means installing the VPN, checking out 37signals code, and storing secrets must only be done on a managed work device, not a personal device. Please do not keep any personal data on your 37signals-issued laptop. You should maintain a separate, personally-owned machine if you need a home computer. The company reserves the right to and may be required to confiscate your laptop or its data at any point. Mobile devices, Windows and Linux Devices running Android, iOS/iPadOS, Windows or Linux are currently unmanaged. It’s fine to install our BC4 and HEY apps on these devices to access work projects and email, but since they’re unmanaged – and therefore ‘untrusted’ – it’s not okay to store 37signals code or secrets on them. If you’re coding or accessing secure systems, you should be doing so on a Kandji-managed Mac. FAQ There are many questions that arise from IT policies such as this, so we’ve written an FAQ in BC4 to help answer them. Our Internal Systems → Copyright ©1999-2025 37signals LLC. All rights reserved. Back to Basecamp.com 37signals Employee Handbook Everything you need to know about making a career at 37signals. Preface Chapter 1 Getting Started Chapter 2 Benefits & Perks Chapter 3 How We Work Chapter 4 Making a Career Chapter 5 Our Rituals Chapter 6 Managing Work Devices Chapter 7 Our Internal Systems Chapter 8 A Note About Moonlighting Chapter 9 Code of Conduct Chapter 10 State Leave Provisions Chapter 11 Severance Packages Chapter 12 Titles for Designers Chapter 13 Titles for Ops Chapter 14 Titles for Programmers Chapter 15 Titles for QA Chapter 16 Titles for Support"
