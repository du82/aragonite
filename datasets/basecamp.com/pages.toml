["https://basecamp.com/handbook/code-of-conduct"]
title = "Code of Conduct"
full_description = ":root { --color-text: 29, 45, 53; --color-background: 255, 255, 255; --color-link: 29, 45, 53; } @media (prefers-color-scheme: dark) { :root { --color-text: 29, 45, 53; --color-background: 255, 255, 255; --color-link: 29, 45, 53; } } Heads up! This page uses features your browser doesn’t support. Try a modern browser like Firefox or Chrome for the best experience. 37signals Employee Handbook Chapter 9: Code of Conduct Next: State Leave Provisions We expect all active 37signals employees and contractors to: Assume good intentions. Approach work relationships defaulting to trust and positivity. Work “in the open” and be open to teaching and learning from others. Be respectful and empathetic, especially when it comes to differing viewpoints and experiences. Gracefully accept constructive criticism and direct feedback, and offer feedback in the same spirit. We expect 37signals to be a healthy place for all staff. 37signals prohibits all forms of discrimination and harassment. If you experience or witness something that violates our Code of Conduct, please report it to your manager or to your People Ops team via email or chat. All reports will be reviewed and investigated, and your confidentiality will be as protected as possible during the investigation. If an employee is found to have violated our Code of Conduct, it will be permanently documented in their personnel file. Depending on the severity of the offense and the findings of the investigation, additional responses may include mandatory training, a formal reprimand, or termination. The reactive measures taken will be shared with the reporting employee when possible. In extreme circumstances, you can report an incident anonymously. Anonymous complaints should be reserved for incidents in which you fear for your safety. 37signals prohibits retaliation against any 37signals employee who participates in a Code of Conduct report or investigation. If you believe you are being retaliated against, please contact the People Ops team. An important note: Most interpersonal conflicts do not rise to the level of a Code of Conduct report. If you find a colleague rude or difficult to work with, you should address that with your manager or better yet with that colleague directly. Code of Conduct reports are reserved for serious transgressions — illegal or egregiously unethical behavior. Politics at work We respect everyone’s right to participate in political expression and activism, but we avoid having political debates on our internal communication systems. 37signals as a company also does not weigh in on politics publicly, outside of topics directly related to our business. You should be at peace with both of these stances. Some Definitions & Resources Discrimination Harassment Sexual Harassment Retaliation The 37signals Code of Conduct is not meant to be a replacement for your EEO rights. You can pursue charges through 37signals channels and through EEOC channels simultaneously. Visit the EEOC website for more information about your employee rights. State Leave Provisions → Copyright ©1999-2025 37signals LLC. All rights reserved. Back to Basecamp.com 37signals Employee Handbook Everything you need to know about making a career at 37signals. Preface Chapter 1 Getting Started Chapter 2 Benefits & Perks Chapter 3 How We Work Chapter 4 Making a Career Chapter 5 Our Rituals Chapter 6 Managing Work Devices Chapter 7 Our Internal Systems Chapter 8 A Note About Moonlighting Chapter 9 Code of Conduct Chapter 10 State Leave Provisions Chapter 11 Severance Packages Chapter 12 Titles for Designers Chapter 13 Titles for Ops Chapter 14 Titles for Programmers Chapter 15 Titles for QA Chapter 16 Titles for Support"
