["https://basecamp.com/books"]
title = "Basecamp: Books we’ve written"
description = "On top of making Basecamp, we write books about what we’ve learned running our own business. They’re filled with practical advice you won’t find anywhere else."
full_description = "On top of making Basecamp, we write books about what we’ve learned running our own business. They’re filled with practical advice you won’t find anywhere else. Shape Up Shape Up is for product development teams who struggle to ship. Written by the innovators behind Basecamp — one of the biggest and longest-running software as a service apps — the book gives teams the tools to address the risks and unknowns at each stage of the product development process. Full of eye-opening insights, Shape Up will help you break free of “best practices” that aren’t really working, think deeper about the right problems, and start shipping meaningful projects your team can celebrate. Buy the print edition Read it online Download a PDF It Doesn’t Have to Be Crazy at Work Chaos shouldn’t be the natural state at work. Anxiety isn’t a prerequisite for progress. Sitting in meetings all day isn’t required for success. These are all perversions of work — side effects of broken models and “best” practices. This book treats the patient, calls out false cures, and pushes back against ritualistic time-sucks that have infected the way people work these days. Amazon Apple Books Barnes & Noble Indiebound Porchlight REWORK New York Times bestseller! Most business books give you the same old advice: write a business plan, study the competition, seek investors, yadda yadda. If you’re looking for a book like that, put this one back on the shelf. REWORK is the perfect playbook for anyone who’s ever dreamed of doing it on their own. Entrepreneurs, small-business owners, and artists who don’t want to starve will all find valuable guidance in these pages. Amazon Apple Books Barnes & Noble Indiebound Porchlight REMOTE Office not required. As an employer, restricting hiring to your local region means you’re not getting the best people you can. As an employee, restricting your job search to companies within a reasonable commute means you’re not working for the best company you can. REMOTE shows both employers and employees how they can work together, remotely, from any desk, in any space, in any place, anytime, anywhere. Amazon Apple Books Barnes & Noble Indiebound Porchlight"
