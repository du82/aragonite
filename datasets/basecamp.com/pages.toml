["https://basecamp.com/newsletter/2023-08-17"]
title = "Basecamp: What did you do in the last six weeks?"
description = "Trusted by millions, Basecamp puts everything you need to get work done in one place. It’s the calm, organized way to manage projects, work with clients, and communicate company-wide."
full_description = "Newsletter • August 17, 2023 What did you do in the last six weeks? Hey there— Last week marked the end of Cycle 4 at 37signals. We typically organize our work in six-week timelines that are long enough to build something meaningful, but also short enough that everyone feels the deadline from the start. Using the Shape Up process, and small, two-person programmer-designer teams, we shipped dozens of new features, product improvements and bug fixes for Basecamp and HEY in the last cycle. Here are a couple of new things we’re particularly excited about: Public Links to Folders Do you have a set of forms, presentations, or other files, that you want to make accessible to people, even though they’re not in your Basecamp account? Now you can! Designer Jason Z. teamed up with Jordan (one of our summer interns) on this project to create a public link for any folder you choose within Docs & Files. This one has been on our customers’ wishlist for a while, and we’re happy to see it out there. Custom Images for Doors Many Basecamp customers integrate Basecamp with another service, like GitHub, Figma or Google Sheets, using a feature we call “Doors.” We have built-in support for 30 of the most popular services. But if you want to include access to multiple Google Sheets, for example, it can get confusing. Now, you can add your own image, animated gif, avatar, etc. as the icon for any Door, so each one can have its own visual identity. Also, if you’re curious about how we thought through this problem and designed an elegant solution, Dorin, the designer for this project, will be talking about it during the next Basecamp Office Hours. Save your spot for this webinar on August 30. Thoughts we’ve shared The curing value of creation It’s hard not to see your spirits lifted when you’re part of bringing something to life. Like exercise, it’s one of those rare avenues of human endeavor that almost invariably will make anyone feel better. And, also like exercise, the hard part is getting started when you need it the most! On learning how to make money Lemonade stands, car washes, lawn mowing, baseball card trading… Making money takes practice, just like playing the piano takes practice. No one expects anyone to be any good at the piano unless they’ve put in lots practice. Same with making money. The more you practice the better you get. Read Jason’s full post here. Things we’re excited about Old v. New Are you a freelancer? An underfunded non-profit? A small team feeling stuck in a large enterprise? Start-up battling established competitors? You’re the underdog. You’re our people. And you don’t want to miss the latest video series from our creative team celebrating the power of small. Basecamp in Brazil We had such a great response to our special pricing for customers in India, that we knew we needed to start doing it for others, too. So for all our amigos no brasil, we’re happy to announce special, locals-only pricing for Brazil! (And, for our fans in other countries, if you’d like to be next on the list, drop me a note at elaine@37signals.com.) Until next time, — Elaine, COO at 37signals"
year_published = 2025
clearnet = "https://basecamp.com/newsletter/2023-08-17"
