["https://basecamp.com/about"]
title = "Basecamp: Where we came from"
description = "Born out of desperate necessity to stop embarrassing ourselves in front of our clients, the story of how Basecamp was born is likely your story, too."
full_description = "Born out of desperate necessity to stop embarrassing ourselves in front of our clients, the story of how Basecamp was born is likely your story, too. Where we came from Born out of desperate necessity to stop embarrassing ourselves in front of our clients, the story of how Basecamp was born is likely your story, too. Hey there — I’m Jason Fried, one of the co-founders here. I’ve been running 37signals — the business that makes Basecamp — for 23 years. People often ask me why we built Basecamp. They’ve never seen anything like it before, so they’re curious where the idea came from. I wish I could credit a spark of genius, or some deep insight. But I can’t. Truth is, we built Basecamp out of desperate necessity. We needed it bad. Without it, we were embarrassing ourselves. Way back when, we used to be a design firm. As we grew, we kept taking on more and more projects. We thought we could handle it, while still providing the same level of service, but we couldn’t. We were fooling ourselves. Sound familiar? It wasn’t that we didn’t have the skills — we just didn’t have the right tools, nor the method, to juggle the additional workload. We were disorganized, we were dropping balls, and stuff was slipping. Quality was suffering, and, as is often the case in situations like this, our clients noticed before we noticed. That was the especially painful and uncomfortable part. We needed a better way to manage projects, track feedback, and make progress. Email, chat, spreadsheets, calls, scattered documents, information here, there, and everywhere just wasn’t cutting it. Systems like that work for a minute, and then they fall apart fast — especially as you grow and add more people to the mix. We looked around and tried a few things, but the popular tools we tried simply didn’t cut it. So we had to build our own project management system from scratch. We focused on building a simple, straightforward collection of tools that could track work so everyone knew who was doing what, keep feedback and revisions on the record, centralize communication so no one missed anything, and schedule important milestones. We started using the system with our clients. They kept asking “What is this? We could totally use this for our own projects!” And that’s when the lightbulb went on — maybe this is a product for others, and not just for us? If we need it, surely others need it. So we tweaked it, tightened it up, polished the rough edges, and put it on the market. It was an instant hit. Turns out, tens of thousands of other companies had similar struggles managing their projects, and needed what we needed. And about a year or so after we first released it, it was generating more revenue for us than our web design business. So we stopped doing web design and have been focused on building Basecamp ever since. Based on feedback, and our own ideas, we’ve made thousands of improvements over the years, with so much more to come. Basecamp defined a category, and continues to constantly push that category forward in innovative ways. It’s been an incredible ride so far, and we have so many people to thank. But most of all, we feel a deep sense of responsibility to continue to make the best product we can for companies who desperately seek a better way to work. We’re here for them, 23 years and running. Thanks for reading, and for giving Basecamp a try. You can always contact me directly if you have any questions at jason@37signals.com. I look forward to hearing from you. Jason Fried Co-founder & CEO"
