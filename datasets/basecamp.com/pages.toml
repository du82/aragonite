["https://basecamp.com/new"]
title = "Basecamp: New in Basecamp"
description = "A collection of new features we’ve just launched in Basecamp!"
full_description = "Hill Charts let you track your to-do lists from figuring things out to completion. With the new Hilltop View, you can now see all your Hill Charts, across your entire account, on one screen. Project templates are a game changer when you do the same kind of work over and over again. We made some improvements to make working with clients and templates easier. Now you can choose what clients see (and what stays private) from inside the template. Public links let you share parts of Basecamp with people outside your account. We made some improvements to publicly-shared content, including a visual update and a new feature to make public links even more useful. We improved scheduling events in Basecamp, including adding two new features — one-click access for video calls and everyday language support. Pings are an essential communication tool in Basecamp. But when you have a lot of pings with a lot of people, it’s hard to tell conversations apart. We fixed that! Now you can give your pings a name and add an image so they’re easier to identify. Need to track time so you can bill your client? Want to know who’s spending how much time on what? Introducing Timesheet, an add-on that makes tracking time simple. Track time spent on to-dos, cards, docs, and more without ever leaving Basecamp. See everything that’s unassigned across your projects on a single page. Under Activity, you’ll see the new report: Unassigned work. Assign tasks and set deadlines to ensure nothing slips through the cracks. It’s now easier to make quick edits to titles of projects, tool names, documents, messages and more without ever leaving the page. Simply click and make your changes. Now in Basecamp, linking to a message, to-do, card, event, document, or file automatically creates a Reference, instantly tying related things together. Card Tables help visualize tasks in a workflow, like bug fixes or design requests. Now it’s possible to share a Card Table with people outside of your account. Turn on a public link and anyone with the link can view it without logging into Basecamp."
