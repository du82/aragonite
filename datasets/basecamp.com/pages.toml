full_description = ":root { --color-text: 29, 45, 53; --color-background: 255, 255, 255; --color-link: 29, 45, 53; } @media (prefers-color-scheme: dark) { :root { --color-text: 29, 45, 53; --color-background: 255, 255, 255; --color-link: 29, 45, 53; } } Heads up! This page uses features your browser doesn’t support. Try a modern browser like Firefox or Chrome for the best experience. 37signals Employee Handbook Chapter 11: Severance Packages Next: Titles for Designers If your employment or contract with 37signals is terminated, you may be eligible for a severance package. In most cases, if you’ve been with the company for less than 1 year, you’ll be offered a lump sum payment equivalent to 4 weeks pay. If you’ve been with the company for over 1 year, you’ll be offered an additional 2 weeks pay for every year of employment, with a maximum of 4 months of severance pay. The package will also include health insurance for you and your dependents if you’ve been on our policies for the same time periods, compensation for unused vacation time, and compensation for unused sabbatical time if applicable (1 year look back). Compensation for unused PTO is calculated using your hourly rate. In return, you’ll be asked for a general release of liabilities and other standard employment termination terms. If you’re terminated for cause; such as misconduct, violation of company policies, insubordination or substance abuse while working, you will not be eligible for severance unless otherwise determined by management. Titles for Designers → Copyright ©1999-2025 37signals LLC. All rights reserved. Back to Basecamp.com 37signals Employee Handbook Everything you need to know about making a career at 37signals. Preface Chapter 1 Getting Started Chapter 2 Benefits & Perks Chapter 3 How We Work Chapter 4 Making a Career Chapter 5 Our Rituals Chapter 6 Managing Work Devices Chapter 7 Our Internal Systems Chapter 8 A Note About Moonlighting Chapter 9 Code of Conduct Chapter 10 State Leave Prov