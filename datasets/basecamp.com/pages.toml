["https://basecamp.com/customers"]
title = "Basecamp: Customer Testimonials"
description = "100,000+ companies rely on Basecamp to run their business. Why? It helps them get more done in less time without all the chaos and confusion."
full_description = "When you make no-nonsense, practical, and reliable project management software that doesn’t get in people’s way, good things happen. We asked our customers: What changed for the better since you switched to Basecamp? When you make no-nonsense, practical, and reliable project management software that doesn’t get in people’s way, good things happen. Simply put, we get more work done, quicker, and better. Productivity is up. Errors are down. Clients are happier. Patrick Sheffield, Moore Communications Group Execution of projects. Instead of drowning in an endless chain of emails, there is clear, and easy accountability meaning tasks actually get done! Roxanne Emery, LATE Nation & Gareth Emery I no longer have to wonder whether I’ve asked for something to be done or whether it has in fact been done. Every member of my team is more accountable than we were before Basecamp. John Drover, Roebothan McKay Marshall We are consistently meeting deadlines because all the facts, files and comments are in one place. And everyone is accountable for their contribution to the project. Very user friendly. Kim Curry, Kim Curry Design We now have vastly improved task assignment, follow-up and accountability as well as greatly enhanced internal communications. We have stopped using email for internal communications almost entirely. Waleed Sarwani, Sarwani Systems For the first time in a long time our team is truly collaborating, and everyone is moving in the same direction, with the same goals. It’s truly remarkable how quickly things have changed in just a week. Ryan Sullivan, WP Site Care Having a single location for messages, files, to-dos and timeline has kept everyone on the same page. Kimberly Benefield, Autotrader I say things once instead of many times to many people. Greg Stratmann, Etal.wines, Stonehouse Cellars, The Bed and Barrel at Stonehouse Cellars As the business owner, I feel more connected and aware of what is going on in the office when I’m away. It’s easy to see what needs to be done with deadlines and who is responsible for the task. Cynthia White, Law Offices of Cynthia L. White Since we’ve been using Basecamp, our communication is drastically better and deadlines are met without drama. Shannon Kropf, Full Sail University We have actually accomplished things that have been waiting forever to get done. Danek Coffey, Coffey LLC Everyone’s on the same page. Many of our people are not very organized naturally, so basecamp is a godsend. Anirvachan Vasan, APEX Our company has grown immensely in organization and efficiency. We have everything organized according to clients, projects, employees, etc., resulting in clear and concise communication amongst employees and with clients. Katie Greathouse, Health Economic Advisors Inc. Different time-zones are no longer an insurmountable obstacle. Stefano, AddressAdvisor.com Because the platform we used previously was so cumbersome and time-intensive to maintain, we used to have a person dedicated almost exclusively to managing the marketing production workflow for our three brands. Now I spend about an hour a month setting things up, and the process manages itself. Sean Hay, One Click I’ve tried a million things with clients. I work really closely with them, and finding something clients will use to collaborate with me is difficult. My clients just “get” Basecamp, right away, and use it all the time. They like that they can use it via email. They also love that it has everything they need in one area. It’s fantastic. Nathan Snelgrove, Wildfire Studios We don’t have to dig through a million emails anymore. Spider McKnight, Six Pony Hitch Before Basecamp, I ran my freelance web development business basically from a spreadsheet, then I moved to Basecamp and my life is so much less stressful. Basecamp has increased my happiness exponentially. Patrick Krebs, Sad Robot Software All our team communications were spread over email and random google docs. Basecamp helps us all stay in sync in one place. Kevin Evans, Intelligent Change Communication and time management has become more of a strong suit for us. Zachary Norton, Eastern Controls Inc. Information is flowing like water. A lot more transparency. Everyone is on the same page and knows the same information at the same point in time. No more secrets, closed doors, and blindspots. Aaron Bingaman, Penn State Office of Emergency Management The daily interaction between all our teams increased by 70%! Our entire team is volunteer, and Basecamp allowed us to avoid meetings, which made me a hero! Monte Young, NOLA Church People can catch up on a project, regardless of when they joined the team. Anwar Ishak, 1000heads We are organized and free to get things done. We used to wonder what everyone was doing. Now we move forward gracefully. John McCulley, Moxley Carmichael Feedback rounds became saner. Now the team can share their thoughts in a single thread, instead of multiple emails. Bernardo Contopoulos, IBFD No need for daily standup meetings. Lorenzo Ciglioni, Yocabè We gained control and could work with more projects without getting more stressed out! John Elliot, 3nine It has eliminated the need for a lot of extra communication and reduced a lot of miscommunication between my team members. Anthony Clark, Clark Partners Realty Group A better sense of shared responsibility and accountability for our team success. Tara Murphy, Sid Williams Theatre Society Less problems, down time, questions from the group. Once implemented, everyone knows where to obtain the information without asking for it every single time. They know basecamp has everything relevant to their day-to-day. Vinicius Jucá Nothing can be forgotten, nothing gets lost, and everyone knows what the other is doing. Jörn Hendrik Ast, Superhelden-Training GbR Basecamp was the only tool that I did not need to explain how to use to my team. It saved a lot of time for me. Alex Lim, Redfrost Design & Development Project-based communication is finally starting to go into one place (Basecamp!). It’s no longer split between email, Google Hangouts, and in-person chats. Sean Leach, eps Communications As the small business owner, it has allowed me to have the confidence to not have a brick and mortar office. Trish Neufeld, Story Box Movies We generate zero emails. Action items never get lost in the shuffle anymore. New ideas and projects actually get off the ground now. Andrew Tyne, MPI Atlantic Canada Chapter The transparency across departments, and the ability to eliminate bottlenecks in projects that were not previously visible. Our throughput time on standard projects has decreased by 30% with Basecamp. Rick Regole, iCONN Systems Having one central place to communicate with team and then present final work to client for approval has streamlined our entire workflow. Sandra Riehl, Saris Media Fewer and shorter meetings. Simpler collaboration with external partners. Less time spent documenting the outcome of meeting. Henrik Nordborg, HSR It makes responding more organized and more interactive. I also like how you can see all the responses at a glance unlike email. Once you delete previous emails you can not see the trail of responses. Tammy Bradley, Zoro Keeping track of comments, approvals, and project history. Great to have them there in one place, and to be able to review decisions as our projects move forward. Steve Bisbikis, Outward Hound I feel much more organized and aware. Basecamp gives me visibility into my projects and my coworker’s workload. Maren Dickey, Kuno Creative Written communications have improved since my team started using Basecamp. Assigning responsibility through To-dos has empowered my team to complete their tasks and create follow-ups without being asked. Joshua Hackett We are able to communicate so much more effectively. We all work from different locations and this keeps us from doing double work. Charlie Avila, Calvary Chapel Tustin Communication over long periods of time is much more manageable and completely centralized. We save a lot of internal communication time by being able to check-in on the current state of a project without having to have regular meetings with the lead on that project. Christian Spencer, Prism Cam LLC We are confidant we are no longer missing large or small tasks, things are not falling through the cracks. Samantha Yeary, On Track Business Management Basecamp is much easier to use with clients. The onboarding consists of a few lines indicating that they’ll get emails from Basecamp and they can just respond back, no need to learn anything new or remember any credentials. Ben Lopatin, Wellfire Interactive Everyone is always on the same page. And when they aren’t, it’s because they didn’t check Basecamp that morning. Miscommunication is rarely a problem now, and we can always keep the focus on moving forward. Henrique Landim, Rowlbertos Media We are constantly “spinning” up a basecamp for almost everything we do at our agency-from projects, client services to organizing our travel arrangements. We’ve tried many other PM tools and our team always defaults back to Basecamp. Trish Lessard, Media Junction Our projects are smoother due to Basecamp because everyone is working from the same understanding. Deadlines are public, there’s no confusion. Lisa Storer, Benz Resource Group It’s much easier to track progress and items done and what needs to be done. Sue Canfield, Chief Virtual Officer We’ve started sending less emails and have been able to keep our team on the same page. Zach Boulanger, WOW Marketing The Automatic Check-ins were an unexpected game changer. Basecamp encourages us to grow and participate in the best parts of our internal culture. Leslie Camacho, Pixel & Tonic, Inc. Better organization! Easy to share and collaborate with a team while keeping everything in one place, rather than having to track down an email. PK Knickerbocker, Pikes Peak Country Attractions Association We’ve stopped looking in multiple places for our work and instead we’ve focused on _one_. One place for documents, to-dos, communication with our client. Ben Kreeger, Oven Bits Communication with clients now goes super smoothly. George Groves, Piehole.TV Team members are better informed about the details of a project. Aaron Shenette, REZ-1 Improved communication between departments. Travis Hinton, Crosspointe Church I’m so much more efficient in getting up to speed on all the projects going on by seeing all communication and documentation on a project. Also, the To-Dos and Schedule keep everyone on track. Suzie Heiam, Decca Contract Furniture Things are getting done far more efficiently, and with more autonomy. Also- we have eliminated 95% of our paper usage- which for a sustainable forestry company is HUGE. Daniel O’Neill, Ramblewild LLC We no longer have the case of “oh I didn’t see that email” or “I forgot to do that” due to the reminder features. Julia Kuziomko, Relyco Sales Inc. We definitely have more communication going on and the status of projects involving multiple people can be seen at all times by everyone. Projects are being completed more timely and more effectively with less errors. Seth Alexander, FLIP Burger Boutique Everyone knows what’s going on and we have established a “base” of sorts. Yasmeen A, JMC We can see exactly what needs to be done and when. We were missing tasks and deadlines before we found Basecamp. We’re much more efficient now. Tina Lannin, 121 Captions Coordination of activities improved tremendously with this solution. Sara Johnson-Berz, University of Southern Maine Being able to easily assign items and keep track off all comments on those items keeps things running smoothly. As a designer I can easily get sidetracked or forget about something. With basecamp… I don’t have to go back into my notes to figure out what I have on my plate. Terry Gonzalez, Element Skateboards Multiple people can come and go on a project without having to dig for assets and information. Peter Imbres, PennyMac Everybody knows what everyone is doing, what has to be done, and how. Adrian Murillo, SHIFT eLearning I am a better person for it now that I am so well-organized. Carol O’Rourke, The Coalition for Debtor Education It’s easier to track conversations and materials submitted by external partner companies Dianne Pilon, Ingram Micro Cloud More order and organization, people are more aware of the day to day operations. Nick Johnson, The Cast Iron Group It keeps me on task, keeps my tasks better organized, is flexible for changes, and works better than having a paper list that by the end of the day looks like a really bad Rorschach inkblot test. CJ Higginbotham, Leap Creative Services Everyone can sync up and be on the same page without scrolling through endless email threads! Chris Toomajanian, Odd Motion Since we’ve started using basecamp, locating shared files has been easier, and managing action items generated from meetings has become more transparent. Things have actually started getting done on time! Caleb Durante, Bretford Assigning multiple people to one task has been a really helpful way to promote collaboration. We can discuss the task on the to-do in basecamp and there is a great record to look back on. Andrea Hirji, MacEwan University It saves time in that everyone can be updated on current projects at once. Amber Yates, Fresh Start Before Basecamp, I’d have to sift through dozens, sometimes hundreds, of emails to keep track of countless projects. Basecamp helped managed my chaos. Chris The accountability has improved, as has our organization. We are always finding new ways to use Basecamp internally and externally. Johanna Lortsher, AmeriSource HR No more messy email threads. Jared Shih, NYC Helpdesk.co LLC Organization with individual clients and projects. I also like having files in one common place per project so we don’t have to constantly resend items. Jennifer Cross, TwoTone Creative Communication between all of us is more efficient. Michaele Leare, Northeast Rehabilitation Hospital We have cut out of emails and stranded emails are no longer the case. This has improved our efficiency Shahid Juma, ECNet Solutions Inc. I rarely find myself hoping I can remember the search combination that brings up that one obscure email from a year ago. It’s on Basecamp. Jared Dovers, WordSouth We never forget :) Once it’s in, it’s written in stone. Agust Gudbjornsson, 23 Advertising Agency We’ve been able to include more people on collaborative work. Real-time chat was exclusionary because you had to be on Slack at that exact moment in time to participate. Max Lynch, Ionic We can “see” our work, and we are forced into organization. If it isn’t on Basecamp, it’s like it doesn’t exist. Morgan Barker, Humboldt State University Basecamp has helped us simplify communications and collaboration around difficult projects and proved its worth. Michael Pierce, SRG Global We are able to seamlessly add and complete tasks as a unit. We’ve never seen product"
