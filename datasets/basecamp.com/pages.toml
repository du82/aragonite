["https://basecamp.com/newsletter/2023-07-06"]
title = "Basecamp: Time travel, leaving the cloud, and something useful we built"
description = "Trusted by millions, Basecamp puts everything you need to get work done in one place. It’s the calm, organized way to manage projects, work with clients, and communicate company-wide."
full_description = "Newsletter • July 6, 2023 Time travel, leaving the cloud, and something useful we built Features we’ve added Time Travel & Markers in The Lineup Sometimes you’re looking to zoom out and see the bigger picture. The Lineup is Basecamp’s way of giving you a bird’s eye view of projects in play. With some recent additions, now you can look into the future six weeks at a time with the Time Travel button, or note important dates and milestones by dropping a Marker. Date Picker This one was a popular customer request. The new date picker makes it easier to select a day, month, and year that’s far in the future, without all the clicking. Most importantly, this feature is a big upgrade for anyone using assistive tech. When we shared this new feature with longtime user Simon, who uses a screen reader, he said: “I shared this e-mail at the team meeting today (which has several other screen reader users) and a lot of people were happy to hear about the support experience and continued accessibility work. We evaluated a number of project management apps and Basecamp absolutely flattened the competition, especially in accessibility, so that’s why we’re using it.” Thoughts we’ve shared Why We’re Leaving The Cloud: In October, David announced that we were leaving the cloud. And after six months of effort, our departure is now complete. The promised savings of the cloud never materialized for our small business. If you look at the math, it’s astonishing… leaving the cloud will save us $7 million over five years! How We Built Something Useful: Jason explores why some of work’s most rewarding moments come from making something simply useful, and why you should never wait for innovation to strike. Things we’re excited about Organizing a Company Meetup in Basecamp: In April, more than 70 of our employees traveled from around the world to New Orleans for a company meetup. Coordinating hotels, meals, presentations, guest speakers, activities, and more is a daunting task. But the entire week was organized by just two employees, of course using Basecamp. Here’s a quick video highlighting how they got it all done."
