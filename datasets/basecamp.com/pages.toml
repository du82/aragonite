["https://basecamp.com/newsletter/2023-07-17"]
title = "Basecamp: Reply to everyone, don’t confuse stalking and selling, and when to jump into AI"
description = "Trusted by millions, Basecamp puts everything you need to get work done in one place. It’s the calm, organized way to manage projects, work with clients, and communicate company-wide."
full_description = "Newsletter • July 20, 2023 Reply to everyone, don’t confuse stalking and selling, and when to jump into AI Features we’ve added Reply to Everyone: Have you ever found yourself typing the same email over and over again? Maybe you got 14 emails asking for details about the family reunion. Or, if you’re using HEY Workflows, and you want to send the same response to all your new sales leads, HEY’s Reply to Everyone feature is for you. Just select any number of individual email threads and compose a single message that’s sent to all. Remove To-dos from Your Schedule: The Schedule is the place to see all the events and due dates for your Basecamp projects. But for projects with lots of to-dos, it can be difficult for important events to stand out. That’s why we’ve added the option to remove to-dos from the Schedule, allowing you to keep your calendar free of everything but events. Thoughts we’ve shared Good Selling Isn’t Stalking: Cold contacting someone 15 times in 17 days is downright creepy. Would you do business with someone like that? Jason writes about why who you do business with matters. Would You Work If You Didn’t Have to?: “I’ll go out on a limb here and posit that most successful people actually like what they do… and the drive that got them to where they are isn’t extinguished by achieving personal, material wellbeing.” Read David’s full post here. Speaking of work, designers (including the ones at 37signals) often use Figma or other design tools. But is that really necessary? David argues that the design process is faster and more efficient when “its iterations flow through updates to the real code that runs the real app.” Things we’re excited about Recently on REWORK: This season of The REWORK Podcast is in full swing. Check out some of our listeners’ favorite recent episodes, including When to Jump Into AI, why 37signals works in Two-Person Teams, and our final discussion on Leaving the Cloud, a conversation with 37signals’ Co-Founder and CTO David Heinemeier Hansson and Director of Operations Eron Nicholson."
year_published = 2025
