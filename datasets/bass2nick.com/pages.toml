["https://bass2nick.com/glossary.html"]
title = "Nick's Place"
full_description = "APS-C A term used to describe the physical size of a specific set of camera sensors. The exact physical dimensions of APS-C sensors may vary by manufacturer. They are all approximately the size of Advanced Photo System Classic (thus APS-C) film, give or take a mm. There are many, many designations for sensor size between all brands, and this is a pointlessly deep rabbit hole. Lenses for Canon’s APS-C sensors are designated EF-S, Nikon’s are DX; the landscape is perhaps needlessly muddled. camera sensor This is the part of a camera that converts light into an electrical signal that the camera processes and saves as an image. They come is various sizes, but are usually between 6mm and 50mm across. Canon FD This is the name of Canon’s lens mount that was largely used between the ‘70s and late ‘80s. It is pretty much obsolete now, but there’s technically nothing wrong with the cameras and lenses using this system. DSLR Digital Single Lens Reflex. A kind of camera. It’s like a film SLR camera but with a digital back instead of film. The handheld cameras that pop up when you search “DSLR” are almost all descended from the form factor first popularized with 35mm film cameras. full frame Another class of image sensor sizes, like APS-C. It’s based on the size of 35mm film, so it’s a bit bigger than APS-C. Historically you could tell the full frame and APS-C cameras apart because the FF ones were bigger and looked more professional, but are some more recent FF cameras that are actually pretty compact. medium format This is kinda to full frame what full frame is to APS-C. In a digital sense, it refers to cameras with sensors about the size of medium format film, which itself varies a lot in the size used. Most digital medium format sensors are actually smaller than the exposed area of a film medium format camera, but the sensors are still massive compared to nearly everything else. It’s not unusual for a digital medium format camera to be $10,000 USD. Suffice to say, any class of camera is a big spiral of decades of influence of past technologies on what we have now, lots of industry terms, and similar but not equivalent products being called the same thing constantly. If you are interested in this stuff, do yourself a favor and do a few hours of reading. Start early in camera history and work your way forward. sensor noise Each pixel of a sensor has a physical size. The smaller the pixel is, the fewer photons are needed to flip the pixel over a certain margin. Say you have a pixel large enough to fit one photon through. It will have two states: on or off. Thus, sensors with smaller pixels are less able to resolve locally high readings compared to large sensors that more gracefully support a larger gradient of possible luminances. The tendency for local high readings to manifest as annoying static-looking spots in your image can be thought of as sensor noise. For more accurate information, please read a book. supertelephoto A lens with a very long focal length. This is what people use for sports photography, taking pictures of birds from 300 feet away, etc. that pleasing 105mm portrait look Different focal lengths distort the subject in different ways. A 50mm lens will make the middle of someone’s face larger and weirdly compress the sides. A 105mm lens turns them from a potato into a rectangle, if that makes sense. 105mm is a focal length that looks good to me. tags Data associated with an image on my image server. Each image has an ID number and each ID number can accept tags. I manually add tags and as a result you can type in tags that exist and find specific images very quickly."
