["https://bass2nick.com/cv.html"]
title = "Nick's Place"
full_description = '''That's the title that went on external emails, anyway. Internally, both to the company, and to my heart I suppose, I was a Fabrication Planner. I'd validate customer data, send in corrections if needed, prepare the CAD data and generate prints and part datasheets for production, and put together a bill of material and workcenter routing to get the parts made. I mostly worked on sheet metal and tube parts, thus the "Fabrication" part. The fab planners also tended to fix a lot of miscellaneous digital issues, such as problems with already released jobs. In this capacity, I had some freedom to decide what to do with parts, e.g. stop parts from hitting the floor until a certain issue is resolved, but little freedom to decide what parts to do. There's a fair bit more miscellaneous stuff I did in this position, but that shortly covers the parts relating to the job title. Set up a few parts in fixtures for welding, did some basic maintenance on weld robot like changing shielding gas. Some manual MIG and TIG welding on parts, mostly for touch-ups and for welds that couldn't be easily automated. My coworker and I were efficient enough that our workcenter would run out of jobs to do and/or parts to use, so I helped out at several other stations. Notably, I've done press brake, detail, drill press, and hardware insertion. Had I continued as a weldor, I likely would have asked about setting up one of the lasers, and doing some jobs for the main weld workcenter, but I instead moved to the engineering dept. of the same company. AS Mathematics, ACC 1 class away from an AS in Engineering. I have also taken multiple welding classes and received some manner of "welding program completion certificate" thing that isn't quite a degree, but they give out a limited number of them and I suspect I have one because at least one of my welding professors took note of how much effort I was putting into the classes. Now, I currently am very rusty at welding as I've not done it in a couple years, but I wouldn't turn down a nice quiet, clean garage, and a midrange TIG welder with a bucket of water and a fishtank pump rigged up to give it watercooling.'''
