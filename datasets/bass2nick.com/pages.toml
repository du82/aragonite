full_description = '''You've found Nick's Place! You are welcome here. Services These are self-contained software packages accessible through the site (reverse proxy). They offer new and unique functions, with varying levels of public accessibility. At the moment, they require JS to function. Photos This is an image server. Posts tagged with "photographer:nick" are my own work. You can search by typing something in the "navigation" box. Combinations of things work, like "trees birds" is valid. Negative tags work too, so "trees -birds" will give pictures with trees but no birds. Files This is encrypted file and document hosting, offering text, spreadsheet, etc. No account is needed to use it, but some more options will be available with an account. Forum This is an imageboard that you may post on anonymously (you can leave the name/email fields blank). JS is optional. Files may be uploaded in various formats, see site for details. Posts with files will need to be approved by me before they appear on the site, but text-only posts appear immediately. Chat I run an XMPP server, as well as a web-based client. The server may be used with any client, and the client may be used with any account. Articles These are mainly text, with some images, and to a lesser extent, audio and video. The Articles are hosted off the main server for this site. They are all linked from one page, but you can quickly navigate to different parts of the page using the options from the top bar. Projects These are articles that mainly detail the experience of creating various items and carrying out various digital methods. They sometimes contain guide-like material, but are not intended to be used as guides unless explicitly stated. Poems This is for poetry that I have written. Audio Vocal performances and music. Vocals These are for articles and demonstrations regarding various styles of vocals. All demonstrations are my own, unless otherwise stated. Music This is for files and descriptions of musical material that I have written. Audiobooks Readings of books and short stories. About For information about the site, there are various topical articles. You can start by clicking this "About" text. Contact Feel free to get in touch. Glossary Some terms used in my articles are defined here. Resume A brief account of some of my histories. Download audio Now serving 452 photos (348 of which I took), 7 articles, 3 poems, 9 vocal recordings, 2 original compositions, and 24% of an audiobook. This is a personal website that hosts material and services that are intended to educate, entertain, amuse, and be of convenience to the wonderful people who see fit to visit here. It is a modest endeavor compared to the large corporate sites that most are accustomed to, and I ask your patience regarding downtime and usability. Feel free to sign the guestbook. I also have an RSS feed This site participates in the Lainchan Webring.'''
