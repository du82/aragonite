["https://bass2nick.com/projects_tele.html"]
title = "Nick's Place"
full_description = '''A teleconverter is an optical device that, in very simplified terms, makes the image that comes out of it bigger. If the size of your camera's sensor is 36mm across, and you're using a lens that creates an image circle intended to fit around that 36mm wide sensor, sticking a teleconverter in the way will, for example, make the image circle wide enough for a 72mm sensor. Since your sensor is still the same size, though, it will see a portion of the middle of the image circle, thus achieving a sort of "zoom" or "crop" effect. Less light will be hitting it compared to normal use, thus the image will be dimmer. Additionally, the focal length remains unaffected. The focal length is a physical property of the lens, thus sticking a 2x teleconverter on a 50mm lens does not give it that pleasing 105mm portrait look, it will instead look like a 50mm, but shot from further away and with the edges chopped off. In my very limited experience, it seems to me that an unusually small portion of the younger photography crowd (young enough to have started on digital cameras) is actually aware that these devices exist. Even then, I wouldn't take for granted that a photographer of any age is aware of them, though they used to be much more popular in the '80s. A better known devices is the telecompressor; it is usually called a "speed booster." These do essentially the opposite thing, and can be useful for adapting lenses intended for large sensors for use with smaller sensor cameras. You do not much see teleconverters/compressors in common use because for the few niche cases where they do a "good" job it is still far cheaper and more practical to use purpose-made equipment. A cheap supertelephoto lens will probably take sharper shots than a telephoto lens with a teleconverter slapped on, and only expensive teleconverters will have the electrical contacts for enabling autofocus and lens data. The only vaguely practical use of either of these devices is probably for using medium format lenses on a full frame camera, or full frame lenses on an APS-C camera, etc. That uses a telecompressor, which should give you the impression that teleconverters are actually not very useful, unless you happen to care about utilizing functionally outmoded technology. Now, let's make a cheap ($5 at a thrift store) teleconverter with the wrong lens mount on it work with an obsolete Nikon D700!'''
