["https://bass2nick.com/projects_composite.html"]
title = "Nick's Place"
full_description = '''The portion of an image that is in focus can vary wildly, and this depth depends on the configuration of the lens. You might have a rolling landscape with distant clouds in focus, or you might have a tiny beetle be partially in focus with a focus plane that is less than 0.5mm deep. It might then be desirable to take multiple pictures with different focus points, and combine them to yield a "best of all worlds" result. That the final image might not be physically possible to produce in one shot with any lens is not necessarily a huge deal. It is the task of the discerning editor to produce a harmonious result given two or possibly many more inputs. There does exist software that can mostly automate the process of creating composites. Whether the software works well depends on the temporal coherency between images. Shooting handheld introduces many small (or potentially huge) changes in position between images, which in turn requires the software to transform the images to all hopefully rest on top of each other. The result usually has a pretty bad ghosting effect. Additionally, if anything in your scene moves, such as wind blowing branches, or a bug twitching around, those changes will introduce more artifacts into the composite. Really, if you want an easy time, park your camera on a beanbag/sturdy tripod, use the built-in focus stacking feature if you camera is new/fancy enough to have one, and shoot something that's dead still. I did none of these things, let's see how it turned out. I have a few pictures of this dragonfly that I'd like to combine together. I'll be exporting 13 images from Canon RAW to PNG using darktable. I've done some basic adjustments to the batch that are outside the scope of this article. Whether all 13 images are used depends on whether each has unique information to add. These were shot handheld with a cheap DSLR with a bit of a breeze at the end of a hike in Texas summer heat. Not exactly ideal circumstances, but a good attitude will help alleviate the non-technical hindrances.'''
