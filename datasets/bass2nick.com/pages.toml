["https://bass2nick.com/projects_24tet.html"]
title = "Nick's Place"
full_description = '''The tuning we are accustomed to in Western music divides one octave into 12 notes (on a piano, 7 white keys and 5 black keys). Historically, the exact frequency of a given "note" may vary depending on context. You may have heard of "A 440 Hz," a standardization of the A in the fourth octave, "A4," at a frequency of 440 Hz. All other notes would then be intervals relative to this reference pitch. However, various pitches in the 420-440 Hz range have been used for A4, and various intervals between each note in a scale, the so called "temperament," have also been used. If you have heard of "equal temperament" and "just intonation," you have been exposed to temperaments. Your ear is probably most used to equal temperament, where the spacing between each note in a scale is the same. This contrasts with just intonation, where notes are decided as ratios derived from the fundamental pitch of a certain key. Thus, the exact frequency values of the notes may vary with the key, which is impractical in many contexts. The expensive and eye-striking "true temperament" guitars that you may have seen, the ones with the colloquial "squiggly frets," are then tempered purely on one key, and will thus be more out of tune when playing a different key when compared to a standard guitar- one that uses 12 tone equal temperament (12 TET). One strength of 12 TET, then, is that it is never quite perfectly in tune, but it's not horribly far off tune for any key. My objective here is to convert a basic Ibanez 6 string electric guitar with perfectly normal, unassuming 12 TET frets into a perfectly normal, though moderately more conspicuous, 24 TET-fretted instrument. Since the spacing between frets would become very tight for the higher notes, I've opted to only convert up to the first octave. I started by reconstructing the fretboard using this utility. I then doubled the calculation method parameter and recorded the fret spacings. Armed with two extra datasets in a spreadsheet- one with the fret positions as measured from the top of the previous fret, and one from the bottom of the next fret, I mocked up the new fret positions with some calipers. This was a rather repetitive task, where I set the calipers with a value, carefully scored the fretboard while dragging the calipers along the previous fret edge, then set the calipers to reference the other adjacent fret, and again scored over the same position. This was ultimately unnecessary, as my lines were quite accurate from just one reference, and the real source of error was from later slotting the frets with a fret slotting handsaw and no jig. I did test one fret insertion before cutting all of the slots, and found I was using the wrong size saw, so that was fun. With the new fret slots all slotted, I fretted the fret slots with frets by slotting the frets into the freshly-slotted fret slots. This is not particularly difficult to do with a correctly-sized slot, and it is excruciatingly impossible if the slot is >0.5mm off. Without enough space, the fret cannot be forced into position with just a small mallet, but its barbs will wear away at the spots where it needs to anchor. Do it once, and do it right. By far the absolute worst part of the fretting project is leveling and finishing. This was made about 5 times more bothersome because I had opted to install stainless steel frets, and my original ones are copper with a bit of nickel. This means that the cheap tools I was using very quickly lost efficacy on the hard steel, yet I also had to be careful while leveling because if my pressure was not even, I would accidentally chew away the soft original frets and create a lot of work for myself. Thankfully, the one decent-quality tool I had chosen was an accurate and straight, albeit somewhat short, fret leveling beam.'''
year_published = 2025
