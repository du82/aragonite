["https://bass2nick.com/projects_digi.html"]
title = "Nick's Place"
full_description = "Perhaps the most economical way to turn developed film into a digital file is to use a reasonably capable camera to take a picture of the film. Desktop flatbed scanners, including those integrated on many printers, can accomplish this, though they lack the ability to focus the scanner's good resolution into an area as small as the film. Thus, the portion of the flatbed scan actually containing information from the film is often disappointingly small. Professional film scanners have purpose-made sensors that allow for high-resolution, low-noise film scans, but unless you have many hundreds (or thousands) of film strips to digitize, it is quite unlikely that you would have this sort of scanner on hand (or feel like buying one). In this article, I use a Canon Rebel T7 for a couple demonstrations, and a Nikon D700 for the final image. There are a few things to keep in mind here. The film must be in reasonably good condition, the particular frame to be digitized must be in focus and taken with reasonably good settings, and you must take care not to introduce too much error to it by virtue of the digitizing process. Even if many things have gone wrong, it's possible to use editing techniques to restore or even regenerate the image, but doing this takes time, knowledge, extra software, and sometimes it's nice to just open something on the computer and have a good result in a few seconds. This article is not about restoration, so I'll choose film in decent condition. Now, what are some factors we might want to pay attention to? As the film will be quite close to the camera since we're trying to fill as much of the frame as we can, the focus plane will likely be very shallow. This will depend on the exact setup you're using, but in my case, I had maybe 0.5mm to work with. Should the film by slanted relative to the camera, it will place large portions of the image neatly out of focus. Unfortunately, it can sometimes be hard to distinguish when the image is defocused due to the conditions of the original shot, and because of digitizing error. In this example, note how the image on the right is uniformly more blurry than the left. The presence of the focus issue is particularly highlighted in how the date digits are also defocused."
year_published = 2025
