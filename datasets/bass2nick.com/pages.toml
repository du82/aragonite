["https://bass2nick.com/projects_restore.html"]
title = "Nick's Place"
full_description = '''Have you ever looked at one of those photo restoration services and thought that their results are ok, but they fix damage by making the photos super blurry? How about a colorized black and white photo that looks like someone only had 3 crayons to do the job with? We're going to discover exactly why it is that the best efforts of these professionals look so amateurish. Hint: it's because this kind of work is hard. And tedious. Starting off, we need a photo to restore. I looked through a few albums and poked around several boxes of photos that my parents have in a remote closet, and found that (un)fortunately, everything was in good condition. This made me wonder how photos end up in bad condition to begin with. Eventually, I settled on a tiny image of what I'm assuming is my mom's old dog, taken maybe 30 years ago in Ялта. Меаsuring 56 x 57mm, here is its size compared to standard photo paper: It appears to have some form of damage that I'm not seeing mentioned on the basic articles on photo damage that I glanced over. To me it looks like some kind of damage to the film, perhaps exposure to flecks of moisture while the film was being handled. Not sure though. I "scanned" the photo by putting it on a dresser and taking a picture of it. Very sophisticated. I brought it into a raw editor (darktable) and removed some sensor noise using the raw denoise option. I was not super concerned about the chrominance noise, that would go away with desaturating the image. Looking back, I should have been more careful about how much contrast I lost on the raw import, and worried about the noise after trying to salvage details from the image. Next order of business is to fix the damage. The way I see this usually done is with the clone tool and healing brush. I'm not a super huge fan of this method, as the repaired places are both blurry, and the edit was done destructively. Here, I'm using a transparency mask and a green background underneath so it's very obvious where the image has been masked out. I mask out the damage, then put a blank white underneath it. I paint up with a black brush at low opacity until the tones in each spot roughly match the original image. If I were to fully repair the damage this way, I'd make the transparency mask cut into the original image more, and I'd have some texture between the original image and the patches underneath to give the patches a texture to match the image. However, I have some ideas I want to try for this project.'''
