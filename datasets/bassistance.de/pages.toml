["https://bassistance.de/page/12"]
title = "bassistance.de"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "Naive me. I thought that DRM was dead – but then, I’m a music consumer mostly. They’ve tried their best, these major labels, and people like me showed them the finger. In the process of this battle, music distribution widened and independent platforms, in some cases the artists themselves, started offering their music. This battle for liberation is far from over, considering the titans like iTunes are still around. But in one thing, we’ve won: the music that we buy is to a satisfactory level “ours”, meaning, we can listen to it where we want, on the platform that we choose and we can sell cds, dvds, and lps to others. Considering this background, I’m asking myself: Why did DRM prevail in other media? Why is it even dominating the gaming industry in particular? The key factor to the answer is Valve’s Steam. Valve came out in the middle of the 90s and produced one of the major titles of video game history: Half-Life, still surviving to this day through the Counterstrike mod. With Half-Life came a unique key, that players had to enter before they could play, but even though the keys had to be correct to play on the internet, offline players could just copy the game and use a key generator to play it. Also, keys were not personalized, you could trade them, sell them or use as many as you like. Even though I do think that Valve made quite a fortune with Half-Life, it obviously wasn’t enough for them: “Damn you, second hand market!”, they thought and with the release of Half-Life 2 came Steam, quoting Wikipedia: “a digital distribution, digital rights management, multiplayer and communications platform”, basically securing that the customer-game relation became 1:1, meaning by online registration the customer gains the “right” to play a game, but once activated not the right to resell it. Again quoting from Wikipedia, Steam has become awfully succesful in that: As of January 2012, there are 1504 games available through Steam, and 40 million active user accounts. The concurrent users peak was 5 million on January 2, 2012. Although Valve never releases sales figures, Stardock, former owner of competing platform Impulse, estimated in 2009 that Steam had a 70% share of the digital distribution market for video games."
