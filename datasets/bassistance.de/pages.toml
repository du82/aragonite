["https://bassistance.de/2011/10/07/release-validation-plugin-1-9-0"]
title = "bassistance.de » Release: Validation Plugin 1.9.0"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "An update for the jQuery validation plugin is available. Most notable is heavily improved compability with HTML5 controls: You can apply validation rules to input types like number, email or url, it’ll get picked up by the plugin if the type matches a rule, and a required attribute (with the argument) also works with both jQuery 1.6+ (prop) and previous versions (attr). Another change should make the setup of forms with hidden elements easier, these are now ignored by default (option “ignore” has “:hidden” now as default). In theory, this could break an existing setup. In the unlikely case that it actually does, you can fix it by setting the ignore-option to “[]” (square brackets without the quotes). There also two new localizations, resulting in a total number of 38 localizations. Existing localizations saw various improvements – thanks to everyone who contributed those! Its the only feature where I’m relying completely on contributions, as I can’t verify the correctness of any of the localizations (other then English and German). Backwards compatibility is still going strong: The plugin should work with anything from jQuery 1.3.x to 1.6.x. Jorn, great update! Was hoping you’d come along with some html5 support and got lucky to come across this today. Only issue I had was in the pattern validator: had to change c.test(a) to new RegExp(c).test(a). Maybe I’m using the pattern’s wrong (first shot at this), but with that small tweak it seems to be working perfectly. Thanks for the great work!"
