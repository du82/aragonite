["https://bassistance.de/2012/09/05/support-the-jquery-validation-plugin"]
title = "bassistance.de » Support the jQuery Validation Plugin"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "This has been the, a tad silly, tag line for the jQuery Validation Plugin for a few years now. Back in 2006, when Jörn Zaefferer started that plugin, he was still employed as a Java developer, contributing to jQuery mostly in his free time. Of the half-dozens plugins he started then, the Validation Plugin became the most succesful and is still quite popular today (builtwith.com knows about more than 300.000 websites using the plugin). Since late 2010, when Jörn went freelance to focus on just JavaScript projects (no more Java!), maintenance of the plugin didn’t go as well as planned. Early 2012, appendTo was generous to support the project, namely with Max Lynch work through dozens of pull requests and issues, landing a total of 28 commits. Since Max went on to create his own startup, the project went rather quiet again. Jörn is looking for donations to spend quality time on the project. The roadmap below outlines a lot of work, probably a lot more than than can be covered by the 4000€ he’s currently asking for. But that also depends on how much people will contribute in other ways. One part of this effort is to build a community around the plugin. Help us get enough donations to get this project the attention it deserves. Share it on Twitter, Facebook, G+, Orkut, in your office, local newspaper, train station, airport, parliament! Call your senator! I’m really pleased to hear about the plans for the jQuery Validation Plugin. I originally started using the jQuery Validation Plugin on an ASP.NET MVC project in conjunction with jquery.validate.unobtrusive.js and I’ve found it invaluable on my last couple of projects. I believe that jquery.validate.unobtrusive.js is created by Microsoft ( http://bradwilson.typepad.com/blog/2010/10/mvc3-unobtrusive-validation.html ) but I’ve found not masses of information out there about it. And also I was curious as to whether this might actually become part of the jQuery Validation Plugin in the longer term? After all, the unobtrusive aspect of this is essentially server technology agnostic. It just so happens that it’s ASP.NET MVC in my case. It could be anything on the server generating HTML with the relevant data-val-* attributes. I would imagine that this would be something that would be welcomed by developers who use other server technologies. And the more the merrier in my opinion!"
