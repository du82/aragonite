full_description = "The 1.2.1 release for the validation plugin is out! Among bugfixes related to remote validation and message display a few handy improvements landed: The delegate dependency is now bundled with the plugin (it was always required anyway), and the small part of the ajaxQueue plugin that was required for remote validation is now part of the validation plugin, too. So now all you need to include is the jquery.validate.js file, nothing else. Also fixed are the url and email validation methods. They now check for top-level domains (eg. the “.de” in “bassistance.de”). A version where that is still optional is included in the package via additional-methods.js. Olé! Totgeglaubte leben länger. Nach langer Abstinenz ist nichtlustig.de wieder mit neuen Comics da, z.B. der hier: One major improvement are completely overhauled themes, based on CSS sprites that require only two images. That makes customizing them much easier, while also improving performance – less file, less filesize. I’ve just released an update to the tooltip plugin. Its mostly a bugfix release with a few small improvements. I’ve also moved the documentation to the jQuery wiki and restructured the folder layout to fit other plugins."
