["https://bassistance.de/2007/10/23/little-big-adventure-day-1"]
title = "bassistance.de » Little Big Adventure, Day 1"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "08:10 GMT+1 I’ve made it to my first station of my three-week trip to Boston, San Francisco and New York, the airport in Düsseldorf. Both check-in and security check were very relaxed, with no waiting line at all. I’m writing this while waiting for my flight to Amsterdam. There I’ll have another three hours of waiting time. If you are planning to fly somewhere: Düsseldorf Airport is very easy to reach both via car and public transportation – the train was only five minutes late. The terminal is very clean and shiny, and the noise-level is extremely low beyond the security check. That may be different though on another day – be it the noise bit or the shiny bit. Definitely the train bit… 11:50 GMT+1 A few hours later, after the flight to Amsterdam with a Fokker 50, a small propeller machine with 50 passengers: Darn, no free wireless internet here either. Guess I have to post this later… 12:30 GMT+1 Amsterdam airport is much busier then Düsseldorf, and not nearly as shiny. There are much more shops here, and I nearly bought a Sony Cybershot DSCW80 in a gadget shop. I’ll wait with that some more, but I really need a camera when I get to San Francisco. Recommendations for small digital cameras below $250 are welcome. 13:20 GMT+1 Oh well, the security check for the Boston flight at Amsterdam was a bit weird. I was asked about number of luggages, who packed it, where it was packed, where it was while I traveled to the airport and so on. The answers were obvious, but I had trouble understanding the questions. It took me three attempts to understand “Are you traveling alone?”. I hope its just the dutch english that I didn’t get and not my bad english skills. 16:30 EST It felt great to be able to replace the nervousness and fear of the unknown to come with exitement, while landing in Boston at the Logan airport. The flight itself was fine: enough drinks and food an an entertaining system that I used to watch Sunshine and 1408, both movies you propably shoudln’t watch on a plane that is going through some turbulences once in a while. Otherwise, I can recommend both!"
