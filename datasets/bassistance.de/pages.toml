["https://bassistance.de/2007/09/24/free-time-branching-and-svn-clients"]
title = "bassistance.de » Free Time, Branching and SVN Clients"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "We don’t have enough time. Some may even say, they have no free time at all. In my experience, that is always a matter of priorities. If something has a high enough priority for you, you find free time to spend for it. If your top priority is your job and you keep spending ten hours or more at the office, there is hardly any time left for anything else. Depending on how you weigh your priorities, you may be able to accomplish quite impressive stuff in your free time. A good living example I know is John Resig. He is working for Mozilla, where he is involved in quite a wide variety of activities. But he still manages to keep pushing jQuery forward: From planning of 1.2 over implementing and releasing it, to helping people on the discussion list with “plugin xyz doesn’t work with 1.2” questions. The open-source field is great to observe other’s priorities. Another example of someone spending quite a chunk of his time on a great piece of software is Joe Hewitt and Firebug. Today Firebug is the one browser plugin that every web developer must have. Since the 1.0 release the project seems to be almost dead. Has Joe lost interest? Or is he lacking the necessary time to continue working on it, due to his new job for Facebook? I’m assuming that his priorities changed, and stuff like iPhone applications now get more attention from him. That isn’t necessarily a bad thing for Firebug users, because others can take up the task. Yahoo even offers a job for developing Firebug. Yesterday I found myself being glad about four spam comments out of 22 total comments in the moderation queue on this site. What the…? Well, I try to read and answer all comments, and the number of comments on the jQuery plugins here, mostly on accordion, autocomplete and validation, consume quite a lot of my free time. I don’t want to reach the point where I keep spending too much of my time just answering those comments, and where I have to say “darn, I must get rid of that”. Therefore I’m now thinking about gradually moving at least the validation plugin into the jQuery domain: Host it on jquery.com, move documentation to docs.jquery.com, move the current comment-forum to one of the jQuery discussion lists. If I can accomplish that, it would be easy for someone else to take up the task of maintaining that plugin, without annoying users."
