["https://bassistance.de/2015/07/17/release-validation-plugin-1-14-0"]
title = "bassistance.de » Release: Validation Plugin 1.14.0"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "The first stable release of the jQuery Validation Plugin, 1.0.0, came out in June 2007, making the project now a little over 8 years old, pretty seasoned for a JavaScript library. According to builtwith.com, its the 25th most popular JavaScript library, with over 1.3 million websites using it. I’m happy to announce the 14th release (discounting various patch releases) of the project, bringing it up to 1.14.0. While a lot of people contributed to this release in some form, I’d like to give Markus Staab a special call out. He’s been helping with ticket triage along with addressing some issues himself, overall being a big help in keeping the project alive. The release itself brings a lot of small improvements and fixes, along with several new localizations. The plugin now relies of jQuery’s .on() and .off() method, making jQuery 1.7.0 the minimallay supported jQuery version. For a full list of all the changes, check out the changelog below. If you use the plugin, please donate or ask your boss to make a donation! This helps to run the plugin site and makes releases like this one possible. 33 people contributed to this release. A big thank you to: a-barry, Ajay Singh, Brahim Arkni, Calinou, Carles Jove i Buxeda, Daniel DeGroff, Darshan Jani, David Weston, dnomak, Florent, hanumanum, Igor, James, jered, Jesus, Maks, Maks3w, Manuel Dalla Lana, Marek ‘saji’ Augustynowicz, Markus Staab, Merab Tato Kutalia, Michael J, Nadi, Pietu1998, rskm1, Ryley Breiddal, sekander, Shimmy, Shonetow, Stefano Stoduto, wozzo, Yair Sladowsky, Zen Chua."
