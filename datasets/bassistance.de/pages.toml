["https://bassistance.de/2008/09/07/gpl-aftermath-part-1-commercial-support-extjs"]
title = "bassistance.de » GPL Aftermath Part 1: Commercial Support, ExtJS"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "As a follow up of my Why GPL? Or: How the GPL eats the kittens it protects post, I’d like to discuss a few comments and explain some misconceptions, my own included. I think the article is very well written. After seeing how apache projects end up in commercialware time and time again, and at prices that are mind blowing for enterprise usage, the more interested I’ve become with GPL projects. I have found that GPL projects have a lower price points than apache projects when comparing their commercial counterparts. This lower barrier to entry for commercial endevours is very nice. I would have to pay 3x in a support contract for an apache licensed software than an equivalent commercial license with support from a GPL vendor. From an Enterprise (commercial) point of view, I’d rather see a GPL offering than an apache offering. To paraphrase: When looking for commercial support for a given type of software, Kevin found that GPL-licensed software is way more attractive than more liberal licensed projects, eg. Apache License. I can’t confirm that, as in most cases vendors don’t list prices on their pages. Usually they ask you to contact their sales team instead. It would be interesting to hear from others about their experiences with commercial support for open-source software. While everyone has the right to decide on their licence, what annoyed alot of people about ExtJs’s changes was that it was more of a bait and switch.. Gather a large community based on the code being BSD, then LGPL style, then switch it to GPL and force everyone to pay.. – for something they have help build. Which is why forking ExtJS (see. roojs) was the only option for those dependant on it. While I can understand the critique of changing the license from very liberal (BSD), to less liberal (LGPL) to viral (GPL), I doubt the bad intentation Alan suggests. Looking at the licensing-history of ExtJS and the reasoning behind the changes, it looks more like inexperience than “bait and switch”. Inexperience in the sense that Jack didn’t expect other companies to exploit his work and the license, unlike eg. the people at SpringSource (see the Why GPL? post)."
