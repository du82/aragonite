["https://bassistance.de/2012/09/07/release-validation-plugin-1-10-0"]
title = "bassistance.de » Release: Validation Plugin 1.10.0"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = 'Anyway, the jQuery validation plugin 1.10.0 is here! While the very recently launched Pledige.org campaign is just at the start, I hope this release helps convince you that the project isn’t dead. On the contrary, this release brings you all the improvements that were built during those 11 months. A big chunk was contributed by Max Lynch, kudos to him! What changed? One cool new feature is the ability to specify messages with data- attributes. The next release should bring more html5y support like that, but for now you can put data-msg="Please please fill out this field!" into your markup, or specify one message per method: data-msg-required="Really need this" data-msg-minlength="Moar characters please" (please don’t use these messages in your application…). Apart from that we’ve got a ton of updates on the outskirts: Localized messages now use their correct ISO codes, a lot of language files got added or improved. Additional methods got a few new citizens and updates to existing methods. Backwards compatibility is still going strong: The plugin should work with anything from jQuery 1.3.x to 1.8.x.'
