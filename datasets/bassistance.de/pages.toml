["https://bassistance.de/2009/06/02/labs-preview-jquery-ui-photoviewer"]
title = "bassistance.de » Labs Preview: jQuery UI Photoviewer"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "An alternative to Lightbox and its various clones, with the sole purpose of displaying images: One or more thumbnails point at the full resolution image, and instead of displaying that image on a new page, its displayed, above an overlay, on the current page. When a group of anchors with thumbnails is selected, the user can navigate with mouse and keyboard to rotate through the images. There’s another demo showing how the widget can resize images that don’t fit into the browser window, as well as customizing animations. I’d like to hear your feedback! Post a comment here, send me an email, or participate on the planning wiki page. Looking good! However, I’m not sure the mousewheel navigation is going to be intuitive to most users–I think expectations is that they see some kind of Next/Previous links. Even when I initially looked at the demo I thought there was no navigation between images when I saw no Next/Previous buttons. It wasn’t until reading the features that I saw that the mousewheel works. Jörn, GREAT! I always prefer tu use the built-in plugins over a third party one. I looking for something like that and found some cool samples: http://www.nixboxdesigns.com/demos/jquery-image-flyout.php http://orderedlist.com/demos/fancy-zoom-jquery/ http://www.dfc-e.com/metiers/multimedia/opensource/jquery-fancyzoom/ addfullsize is my favorite mainly because of the markut. I _really_ like the approach of using the traditional img tag, but with the “new” attribute fullsize, wich is very handy. Nice work! I like the transitions. I don’t see the next/previous buttons mentioned in the instructions, but the arrow keys work fine. It would definitely require some instruction on the page to make users realize that the arrow keys or scroll wheel will work for this purpose, but I like the idea because 1) it’s a nice way to navigate, and 2) it prevents people from scrolling the page behind the overlay unless they really mean to, which was always visually strange for me."
