["https://bassistance.de/2007/08/22/image-resizing"]
title = "bassistance.de » Image Resizing"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "“Früher”, als ich mich noch mit 3D-Rendering und speziell mit High Dynamic Range Images (HDRI) beschäftigt habe, bin ich mal über die ein oder andere SIGGRAPH-Seite gestolpert. Heute weiß ich immerhin, dass das eine Messe (oder Konferenz?) zum Thema Bildbearbeitung ist. Dort sind wohl auch die ersten Studien zum Thema HDRI präsentiert worden, das heutzutage eine bedeutende Rolle in Computerspielen hat. Aktuell gibt es zum Thema Image Resizing eine beeindruckende Studie. Ich bin gespannt, wann diese Techniken in populären Bildverarbeitungsprogrammen verfügbar sind. Sehet selbst: Wirklich nicht übel. Vor allem das leichte Entfernen von Objekten, wie kompletten Menschen, erscheint schon beeindruckend. Merkwürdig, diese Studie wurde verschiedentlich im Netz kommentiert, aber niemand scheint sich daran zu stören, dass damit Fotos bewusst manipuliert werden und das verlieren, was sie eigentlich auszeichnet: Abbild der Wirklichkeit zu sein. Dass digitale Bilder ohnehin manipulierbar sind, ist klar, und dass es für bestimmte Zwecke sinnvoll sein kann, die Proportionen eines Bild auf diese Weise verändern zu können, auch. Diese Studie aber suggeriert, dass sie die Manipulation unter Beibehaltung der inhaltlich relevanten Teile des Bildes durchführt, was einfach nicht stimmt. Wenn man zwei weit auseinander stehende Personen zusammen schieben kann, ändern sich vielleicht nicht die Personen selbst, aber die Bildaussage. Ich find’s zweifelhaft. Es ist beängstigend, wenn man darüber nachdenkt, das Menschen mit genug Geld sich diese Möglichkeit der Bildbearbeitung schon zu nutze machen, und so Bilder in kürzester Zeit zurechtgebogen werden können, ohne das es einem auffällt. Die Frage nach Realität von Photos ist umsomehr irrelevant. Ich find es allein schon fragwürdig, wenn man Bilder anders coloriert, oder Dinge hervorhebt bzw. entfernt. Wenn ich eine andere Aussage in diesem Bild haben möchte, dann muss ich es auch dementsprechend präsentieren. Meistens geschieht dies aber nicht, und es braucht schon ein erfahrenes Auge, bzw. gute Software, um Manipulationen zu erkennen. Diese Fähigkeit (das Auge, oder die Software) ist heutzutage noch total unterrepresentiert, obwohl die Bildbearbeitung schon mehr als alltäglich ist… das zieht doch unweigerlich einen Realitätsverlust der Welt nach sich, die wir (meistens) nur durch die Medien erfahren können, aber aus der Information weitreichende Entscheidungen ziehen, um unser Leben zu bestimmen oder es zu prägen…"
year_published = 2025
clearnet = "https://bassistance.de/2007/08/22/image-resizing"
