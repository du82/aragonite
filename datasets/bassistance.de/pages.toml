["https://bassistance.de/2019/12/02/a-bird-story"]
title = "bassistance.de » A Bird Story"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "When the alarm rang in her truck’s sleeping cabin, Emily sat up and noticed the latest issue of the Bird Watching magazine sliding off her chest. She must’ve fallen asleep while still reading. Putting the magazine aside, she turned on the water cooker for some instant coffee, got dressed and checked out the leftovers from her last meal, a sandwich whose salad had turned into a brown goo. “Will have to do,” she muttered to herself while removing the expired salad. “How nice it would be to start the morning with some fried eggs.” She briefly turned on the CB radio to see if something useful made the rounds, but it was just the usual wankers. She had zero interest talking to those. A little while later, she was back on the road, almost on schedule to make it to this day’s depot. It would still take some time to unload all those boxes that her 40 ton 18 wheeler was hauling. Traffic seemed fine, with only two construction sites on the next segment, promising an easy day. Four hours later, it was time for the scheduled break. She briefly considered messing with the black box again to fake the break, keep going and for once get home a bit early, but her bladder suggested to play it by the book. When she got off the highway to turn into a small parking area, covered by trees on both sides, she wondered why there were no other trucks. At this time of day and place there should’ve been at least another four. Instead, there was just a station wagon with the trunk packed up to the roof. The dad, she assumed, was walking from the woods towards the car with a crying child in tow. By the time Emily turned the engine off, the station wagon was gone. After prepping another cup’o’black, she found the magazine again and tried to remember where she left off. But before she could find her page, a quiet, deep hum distracted her. She checked the mirrors to see if it was coming from another truck or car coming into the parking area, but there was no one. Yet the hum only got louder, until it seemed to come from above. As she was leaning to the left window, she noticed a bunch of leaves flying away from the truck. “What’s making that wind?” she wondered aloud, as she pulled down the window and stuck her head out. Above her was a swarm, not of birds, but seemingly of mechanical devices, with lots of propellers. Like those toy drones at the store, except that there were so many at once. At least that explained the noise and wind. Emily was fascinated with their seemingly random formation. The swarm moved, but each member kept just enough distance to the others to not crash into them, like flocks of migrating geese. After watching them for a while, she noticed two long lines hovering below the swarm, the top one being a bit inside the shape of the swarm, the bottom one somewhat smaller. Just when she was starting to replace her fascination with anxiety, she heard loud clangs, like metal attaching to metal, from all around the truck. “Shit shit shit, what the hell,” as she scrambled for her phone. No signal. She turned on the CB radio, but all she got was static. “Are you jamming me?” Emily asked in the direction of the swarm above, trying to suppress her oncoming panic. “For what?” An answer came in the form of a sudden pull upwards. The whole truck was lifted off the ground, slowly, but steadily, turned, and then started moving to the woods. It kept rising until it was just above the top of the trees. Emily felt like she had to do something, but all she could think of was “Don’t panic!”. It was too late to get out and she couldn’t contact anyone. She kept her eyes on the ground ahead, which seemed to drop off slowly into a valley. She remembered that place – it had been a big lake, a reservoir, until the dam burst and nature reclaimed the valley that used to be inhabited a long time ago. “Where are you taking me? There’s nothing here!”. As they moved into the valley and her view of the horizon stayed the same, the ground below seemed to fall away further and further. Through a moment of calm, Emily remembered something she had read last night in the magazine, about birds of prey dropping their victim from some height, like a crow opening walnuts or a bald eagle cracking a turtle. As she felt the panic make a comeback, she put her seat belt on and stowed everything in reach. Just in time as she felt the truck tilting forward, giving her a look at the ground below. In the midday sun she saw twisted metal shimmering in a huge pile of tires, colorful containers and boxes. Something snapped loudly around her, and she could feel the seat belt cut into her chest and neck as the truck dropped away below her. At least the deep hum finally went quiet."
year_published = 2025
