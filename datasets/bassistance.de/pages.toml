["https://bassistance.de/page/7"]
title = "bassistance.de"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "This is the official recording of my talk at the jQuery Conference in San Diego in February 2014, titled “Effective jQuery – Patterns for maintainability and performance”, recorded a few weeks ago, published yesterday. I probably spent about two full weeks preparing this talk, with lots of rehearsing. Still, I was very nervous at the beginning, which can be heard quite well. Five minutes into the talk, covering technical stuff, I calmed down a lot, which can also be heard quite well. I’ll be giving this talk again at this year’s enterJS 2014 in Köln (home town!), on day one, June 30th. They still have tickets, so if you’re close enough and want to see my talk live (and in german), get a ticket. Its been slightly over a year since the last release of the jQuery Validation Plugin. Its been almost eight(!) years since I started working on this plugin. Its been slightly over eight years since I started my first full time job as a software developer. Almost-decades aside, its time for a new release, so I’m happy to present you with a shiny new 1.12.0. Since 1.11.0, lots of things changed. The documentation is now longer on the jQuery Wiki, the plugin home is no longer on this site, instead both moved on to their own home at jqueryvalidation.org (I’m still doing release announcements here though). The source code of the plugin was heavily restructured, laying the foundation for smaller modules that are easier to test and maintain. While src/core.js is still pretty big, all the additional methods are now in individual files, making them much easier to maintain. On the “tell me something relevant for me” front there’s also lots of improvements: Along with the usual bug fixes, the plugin now uses some ARIA attributes, laying the foundation for making the validation more accessible, e.g. for screenreader users. There’s a lot of new and improve localizations along with several new and improve additional methods. All full list of all changes can be found in the changelog below."
