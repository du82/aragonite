["https://bassistance.de/2008/02/07/release-treeview-plugin-14"]
title = "bassistance.de » Release: Treeview plugin 1.4"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "One major improvement are completely overhauled themes, based on CSS sprites that require only two images. That makes customizing them much easier, while also improving performance – less file, less filesize. Chances are quite good that this gets part of jQuery UI. Once 1.5 is ready and the dust has settled a bit, we’ll likely get into planning which components to add and include in the future. So far the idea is to keep this as slim as it is, while adding behaviour like sortables on top of it. The state of my tree does not persist, however. I’m sure there is something I have not set right, but I am using the persist: “cookie” option. I put an alert() call in the treeview js and each page tells me that the hierarchy was not stored. I forgot to mention above that my browser (FF) is not showing a cookie for localhost (my server) except for the PHPSESSID. dqj: Persistence and async options don’t work well together so far. Please post further support requests or anything related to the mailing list (see plugin page)."
