["https://bassistance.de/page/22"]
title = "bassistance.de"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "GitHub with their web interface makes it really easy to fork a project, but it leaves you alone when it comes to updating your fork with the changes in the original repository. Its actually really easy with a few steps: This adds another remote repository. You can use git remote -v to see your existing remotes. There should be “origin” already, pointing to your GitHub fork. You can use whatever name you like for the new remote repository, above I’ve used “original”. This loads all commits, including branches and tags, from the specified remote repository, using the alias defined above. This merges all changes from the original master branch in your current branch, eg. your local master branch. By default, push pushes everything to your “origin” repository. Which brings your repo up-to-date. That’s it! I’m finally deprecating the jQuery autocomplete plugin, about four years after its creation (which was actually a merge of two forks of another plugin). jQuery UI 1.8 was released in March, bundling the brand new Autocomplete widget and a worthy successor of my standalone plugin. The API is way more simpler while much more capable, eg. its now trivial to work with JSON. And thanks to Themeroller-support, the result looks a lot better. Today I’ve finally finished the Autocomplete Migration Guide, which explains how to migrate from ye olde plugin to the new jQuery UI Autocomplete widget. It covers the various options and their replacements, if any. In a lot of cases, we were able to get rid of the options by providing better defaults or by restructuring the API, with the source option being the most prominent example. The next major jQuery UI release should include the new Tooltip widget, paving the way to shut down another plugin on this site. The Emperor’s Old Clothes is the title of a lecture by Charles Antony Richard (C. A. R.) Hoare, published by Communications of the ACM in 1981. A not well-readable PDF version of the text (found via Simon Willison and Wikipedia) is available on archive.org. The lecture itself was delivered on Obtober 27, 1980."
