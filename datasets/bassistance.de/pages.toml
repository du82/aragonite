["https://bassistance.de/2010/06/25/git-fu-updating-your-github-fork"]
title = "bassistance.de » Git fu: Updating your GitHub fork"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "GitHub with their web interface makes it really easy to fork a project, but it leaves you alone when it comes to updating your fork with the changes in the original repository. Its actually really easy with a few steps: This adds another remote repository. You can use git remote -v to see your existing remotes. There should be “origin” already, pointing to your GitHub fork. You can use whatever name you like for the new remote repository, above I’ve used “original”. This loads all commits, including branches and tags, from the specified remote repository, using the alias defined above. This merges all changes from the original master branch in your current branch, eg. your local master branch. By default, push pushes everything to your “origin” repository. Which brings your repo up-to-date. That’s it!"
