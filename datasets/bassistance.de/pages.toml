["https://bassistance.de/2008/03/15/looking-back-and-forth"]
title = "bassistance.de » Looking back and forth"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "So all in all I managed it to make it from mere programmer to technical lead/architect/system designer (pick one) within less than a year. Not too bad at age 23, eh? Still, something is missing. I’m not exactly sure what it is: Maybe the lack of any of those applications getting sold/productive. Maybe not. Maybe I spend too much time programming (eg. reading programming blogs/books, helping people on the jQuery list, chatting with developers, reading tons of code, now and then writing a few lines…) and too less time on other things. So, there are other things I spend time on: Watching heroes, reading Neuromance, playing role-playing games at weekends (at most once a month, currently) or other games like Arkham Horror or Descent or Illuminati. Or playing the Wii, preferably with multiple players. But all those lack one thing in common: The dedication necessary. I can sit down and read a book, play a game, whatever, it hardly needs dedication. It’ll hardly hurt if I just stop it and never think about again. But there actually is one hobby of mine which requires dedication, actually lots of it: Music, in the form of playing the bass. Thats the “bass” part from “bassistance”, where “assistance” is referring to the programming part. Since then, I’ve touched the bass for the first time this evening, after returning from the table soccer turnament the company organized (which was great fun). I had some interesting ideas to play with, but got frustrated by being unable to write them down with a reasonable effort (it takes me ages to note any music in a form that I can read later, I usually end up using some midi application like Guitar Pro, which gets it quite precise, but takes decades to get it right). Also playing the bass alone gets frustrating very fast, too. And all that lead me to writing this post. And thinking about how I could find the focus and motivation to play some music again, at home, and elsewhere, beyong practicing in the cellar. So, I thought, why not trying to share a bit of music with the rest of the internets, via my blog, or whatever web application can help with that. I can lend the necessary equipment from Remaing (microphones, cables, external soundcard) and maybe go to the musicstore tomorrow and look for a loop effect. Then try to create a small riff or lick, loop it, overdub it a few times, throw it away and redo it, record and upload it, share with t3h internets."
