["https://bassistance.de/2008/11/30/release-validation-plugin-15"]
title = "bassistance.de » Release: Validation Plugin 1.5"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "Four more localizations were added: norwegian (no), italian (it), hungarian (hu), and romanian (ro), bringing the total number up to 16 localizations! A few new options are available as well: ignoreTitle is false by default, when set to true, all titles are ignored when looking for messages. This should be used when dealing with problems with the Google Toolbar. The rules-method now accepts also messages, making it equivalent to other means of providing rules and messages, just as the last release enabled messages to be specified via metadata. As a shortcut for manually binding the invalid-form custom event, there is now the invalidHandler-option, the counterpart of submitHandler, called whenever an invalid form is submitted. A major enhancement affects the remote method: You can now fully customize the request being send to the server by providing $.ajax options as the paramter. It still accepts the url as a string paramter for compability. Details are provided in the documentation for the remote method."
