["https://bassistance.de/2010/06/08/flash-issues"]
title = "bassistance.de » Flash Issues"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "Over all the flash-must-die debates and if DHTML5 can replace Flash, I’m missing some pragmatism. What are the actual issues with Flash? Can those be solved? My biggest issue: When a Flash movie has focus, it swallows most keyboard events. I use Ctrl+Tab and Ctrl+n (1 for mail, 2 for RSS reader and so on) all the time, but for that to work on a Tab with an active Flash movie, I have to click outside the movie so that keyboard focus is back where it belongs. Completely unnecessary and annoying as hell. My Lenovo laptop has trouble playing full screen HD video in Flash. It actually runs fine most of the time, it just hangs half second every few seconds. Worse, sometimes video completely hangs in fullscreen mode, while audio continues to play, so depending on the video, I don’t even notice the problem until 10 seconds later. I have to press Escape to go back to normal mode, then go to fullscreen again. Happens way too often. For years I thought only the Java browser plugin was able to reliably crash my Firefox browser. Today Firefox crashed when trying to play a full screen video. I got worse as Tabmix Plus was unable to restore my open Tabs (about a dozen), and loosing any user input is among the biggest sin software can commit. I wouldn’t care for the plugin to crash and require a browser restart, but crashing the browser isn’t acceptable. I’d disable Flash by default if that would happen regularly. Stability, performance, thats likely to be important for Adobe to be working on. The keyboard event capturing? I hope so. If someone argues that you don’t need Flash on the iPhone as Apple embraces the open web and DHTML5 and everything: Try to play a background sound on Mobile Safari. As that isn’t possible for whatever reason, the only way to port Flash games to the iPhone is via Apple’s closed App Store. Even if they add support for playing back a simple MP3 file, I doubt we get anywhere near stuff like this (click on Launch App to see the Flash stuff) anytime soon."
year_published = 2025
