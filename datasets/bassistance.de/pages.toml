["https://bassistance.de/page/39"]
title = "bassistance.de"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "I’m posting code snippets in reply to questions on one of the jQuery mailing lists a few times daily. Rather annoying is the lack of support for indentation: I have to use spaces one-by-one to indent code. After posting about that on Twitter, Scott Gonzáles provided some good ideas and code (to access GMail’s iframes) and the result is a simple bookmarklet: Currently it loads jQuery, the itabs plugin from the interface project and a bit of code selecting the reply-textarea within Gmail and applying the itabs plugin. Usage: Drag above link to your bookmarks. Open GMail and click on the reply-textarea within a thread. Activate the bookmarklet and give the textarea focus again. Use the Tab key to input tabs! There are more ideas at hand: Unindent code pasted from source files, unindent a line with shift-tab, (un)indent multiple lines (via usual text selection). Update: Now it also sets the font-family to “Courier New”, giving you a monospace font for easier visual indentation. A new release of the validation plugin is done, now at version 1.3. This release adds five more localizations and fixes a few bugs, eg. “asdf” is not a valid creditcard number anymore. Major improvements went into validating a form without triggering UI feedback and batch adding and removing of rules. Just let me know what you want to have (one of them or both) and I’ll contact you via email if you won. You need a Steam account to receive it. I’ve started this autocomplete plugin in fall 2006, picking up the great work from Dylan Verheul, Dan G. Switzer and Anjesh Tuladhar. Dylan provided the initial implementation which got improved by Dan. Anjesh added support for completing multiple values within one field, similar to GMail’s to-field. I’ve merged these efforts, refactoring a lot of code, trying to improve the API and adding a distinct set of features. Most notably is the scrolling support via mouse (scrollbar, mousewheel) and keyboard (key up/down, page up/down). That together with Dylan’s great caching solution sets this plugin apart from the numerous autocomplete solutions available these days."
