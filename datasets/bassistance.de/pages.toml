["https://bassistance.de/2007/10/25/lba-day-3"]
title = "bassistance.de » LBA, day 3, ajax experience I"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "This was the first actual day of the AJAX experience, with welcome refreshments, keynotes, quite some interesting sessions, lunch and cocktail, and, dinner with about 14 people from the jQuery community. I met Karl Swedberg and Jonathan Chaffer, authors of the Learning jQuery book. I met and talked quite a lot with Richard Worth and Paul Bakaus, both heavily involved in the jQuery UI project. Marc and I drafted some plans for a new site for accessing jQuery and plugins documentation and we hope to get Glen Lipka involved into that. I met Rey Bango and talked with him a bit during lunch. While I’m often stumbling about pronounciation, its great to meet all these great people in person and talk to them, instead of only chatting via IM or mail. I’m looking forward to the jQueryCamp on saturday. The first two keynotes weren’t really very interesting, though it still was interesting to see and hear those people, namely Ben Galbraith and Dion Almaer, founders of Ajaxian, and Kevin Survance, CTO of MapQuest. According to Kevin, everyone listening to his keynote should have used MapQuest at least once in his life, which made me feel like an outsider. The first break-out session in the morning on my schedule was John Resig’s The Future of JavaScript. He started with an overview of the development of JavaScript and how that is related to ActionScript, which is also built on ECMAScript. The really interesting part was the crashcourse on new features in JavaScript 2. While John mainly ran through stuff he got out of an whitepaper the night before, there is one important goal to mention: JavaScript 2 is completely backwards compatible with JavaScript 1.5. So assuming that you have Firefox 4 or 5 and it implements JavaScript 2, it still is able to run your current JavaScript 1.5 code. Among the new features, the most important could be classes and an optional type system. Classes bring the classical class-based object oriented programming to JavaScript, with all its advantages and downfalls, of course with some fancy stuff like an override-keyword that you need to add when overriding a method from a superclass. Using static typing is great to make your library code more robust, maybe perform better (the interpreter has to do less duck typing) and could help writing better tools for writing JavaScript."
