["https://bassistance.de/2025/01/31/things-i-learned-transpiling-react-native-javascript-with-babel-in-2025"]
title = "bassistance.de » Things I learned: transpiling React Native JavaScript with babel in 2025"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "At work we’re using React Native to build our Android and iOS app. We use it with Hermes, a JavaScript engine Facebook/Meta built for React Native, which doesn’t have a JIT compiler, but is instead optimized for fast startup, by compiling JavaScript to a type of bytecode during build time. Hermes supports plenty of modern JavaScript features, yet any current React Native app will have its source code processed by a bunch of babel plugins, transforming modern JS code into not-so-modern one. In our case this bothered me in particular when debugging events handlers that make use of JavaScript’s async/await feature. Hermes supports this natively, but one of the babel plugins included in the build process, would replace each instance with generators (also a relatively new JS feature, but not quite as new as async/await). The resulting stacktrace, if not properly mapped to the original source code, is much harder to read, since there’s usually two extra items in the stack, one referring to a function injected by babel called _asyncToGenerator. Trying to stop this transform from happening turned into quite a deep rabbit whole. I’ll summarize here what we learned: None of these presets have any configuration options we could find, so in the end we decided to add another patch with patch-package: After we verified our app still works fine without this transform, I figured I can at least ask if this could be upstreamed to @react-native/babel-preset. In short: no, at least not yet. From the community discussion post:"
