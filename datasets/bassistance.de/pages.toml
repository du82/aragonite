["https://bassistance.de/page/42"]
title = "bassistance.de"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "I’ve recently posted about the 1.2 release of the validation plugin. The post contains an unordered list of changes from the last release, which is handy when coming from a previous release, but lacks the perspective of someone new to the plugin. Therefore this post will cover three areas where the plugin has been improved significantly, and will also serve as a introduction to the plugin. The first problem to solve when dealing with form validation is to specify validation rules. Lets consider an example, validating a comment form, where the form itself looks like this in HTML: Now, to validate that form, we need to include the necessary files on our page, and a bit of code to trigger the validation. Of course jQuery itself is required (jquery.js), in addition the delegate plugin is necessary (jquery.delegate.js), and the validation plugin itself (jquery.validate.js). Once that is done, running the validation requires only a document-ready-block, a selection of the form to validate and a call to the plugin method. The very basics of using jQuery. This example uses default messages. Those can be heavily customized when needed, as well as the way how to display the messages themselve. How to do that is documented in the jQuery documentation wiki for the validate-method. Adding client-side validation to a form can significantly improve the usability of that form, making it much easier for users to fill them out successfully. But pure client-side validation has severe limits where necessary information is available only on the server. Ajax helps to bridge the gap, but synchronizing validation on form submit isn’t exactly an easy task. The validation plugin makes it as simple as pure client-side validation. All you need to do is to specify a rule “remote” for a field and provide a parameter that points to a server-side resource that handles the validation. If you enter an email address, the validation plugin sends a request to the server with a parameter “email” and the value you entered. The server checks if that address is already in use – here just checking a list of fake addresses, usually a database lookup – and if the server returns a JSON false (just “false” in the response), shows the validation message:"
