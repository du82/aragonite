["https://bassistance.de/2010/06/17/the-emperors-old-clothes"]
title = "bassistance.de » The Emperor’s Old Clothes"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "The Emperor’s Old Clothes is the title of a lecture by Charles Antony Richard (C. A. R.) Hoare, published by Communications of the ACM in 1981. A not well-readable PDF version of the text (found via Simon Willison and Wikipedia) is available on archive.org. The lecture itself was delivered on Obtober 27, 1980. Here are a few quotes from the lecture, with a few comments. At the end I’m also providing the actual title-giving story for easier enjoyment, as the PDF is really not that great to read – a shame considering the great content. My first task was to implement for the new Elliot 803 computer, a library subroutine for a new fast method of internal sorting just invented by Shell. I greatly enjoyed the challenge of maximizing efficiency in the simple decimal-addressed machine code of those days. My boss and tutor, Pat Shackleton, was very pleased with my completed program. I then said timidly that I thought I had invented a sorting method that would usually run faster than SHELLSORT, without taking much extra store. He bet me sixpence that I had not. Although my method was very difficult to explain, he finally agreed that I had won my bet. The first principle was security: The principle that every syntactically incorrect program should be rejected by the compiler and that every syntactically correct program should give a result or an error message that was predictable and comprehensible in terms of the source language program itself. […] A consequence of this principle is that every occurrence of every subscript of every subscripted variable was on every occasion checked at run time against both the upper and the lower declared bounds of the array. Many years later we asked our customers whether they wished us to provide an option to switch off these checks in the interests of efficiency on production runs. Unanimously, they urged us not to–they already knew how frequently subscript errors occur on production runs where failure to detect them could be disastrous. I note with fear and horror that even in 1980, language designers and users have not learned this lesson. In any respectable branch of engineering, failure to observe such elementary precautions would have long been against the law."
year_published = 2025
