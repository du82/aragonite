full_description = "Early November I attended the first Velocity Europe conference. This was my second conference where I attended, didn’t speak and paid for the ticket myself (Mobilism 2011 was the first, and I already bought a ticket for the 2012 edition…). There’s a lot to say about the conference, though there don’t seem to be a lot of blog posts about it (with this nice exception). You should watch the talks online, as far as available. During the conference I scribbled down various notes that I’m reproducing here. Some notes didn’t make sense anymore, or I couldn’t remember their context. For others, I gathered more information on the topic since the conference. Maybe there’s an idea or two that fancies your interest. Let me know if you want to have more details on any of them. In chronological order: A good conference. Met a good bunch of people that I’ve met before, and some interesting new figures. I didn’t gather enough contact details to stay in touch with them though. Thanks for the write-up! Especially the text-indent part is interesting. Used the hack myself on several pages. Gonna keep that in mind in the future."
