["https://bassistance.de/2019/01/20/cologne-2050"]
title = "bassistance.de » Cologne 2050"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "“Someone with visions should go to the doctor” is a popular quote by a former German chancellor, in a way representing modern politics pretty well. While improving the world in increments has gotten us a long way, I miss positive visions in mainstream politics (too few like this or this). As Adam Curtis puts it in this Economist interview: Politics gave up saying that it could change the world for the better and became a wing of management, saying instead that it could stop bad things from happening. The problem with that is that it invites all the politicians to imagine all the bad things that could possibly happen—at which point, you get into a nightmare world where people imagine terrible things, and say that you have to build a system to stop them. How could the city I live in look like in 31 years, if we weren’t restricted by practical concerns, but could come up with a more free form vision? Below I’ll describe five areas of daily life: Transport, Jobs, Shopping, Housing and Health. While those are separate topics, some of their viability depends on synergies between these areas. Topics not covered can be assumed to not change that much in this vision. I also know even less about those potential other topics and don’t want to stretch this too far. Traffic within cities is running on renewable electricity, powered by small lithium-ion batteries, but individual transport is primarily human-powered, with electric motors enhancing various forms of small vehicles like bicycles. Lots of variations exist to support parents with babies or toddlers, people with physical disabilities, or people transporting bigger items. For trips across city quarters, these vehicles can be attached to bigger electric vehicles like busses (which are mostly running on software, with remote operators monitoring and supporting as needed). Individual highway traffic in and out of the city is also running on renewable electricity, powered by hydrogen fuel cells. Vehicles are driven by software when conditions are fine, or remote controlled by trained operators when conditions are really bad. The amount of this type of traffic is pretty low, as most people live within the city quarter where they work (see Jobs belows)."
year_published = 2025
