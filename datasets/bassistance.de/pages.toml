title = "bassistance.de"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "In November 2010, before my first MacBook even arrived, I asked Twitter for “must-have” OSX software and collected the results in a blog post. A year later, I posted an update with a list of OSX software I was actually using. A few more years have passed since then. Last year I switched from my original MacBook Air to a MacBook Pro (a very good decision) and used the opportunity to do some cleanup. About 9 months into using the MBP, I figured I could do another list. An asterisk indicates something I didn’t have on my list in 2011. I’m happy to announce the 15th release (discounting various patch releases) of the project, bringing it up to 1.15.0. This is the first release managed by Markus Staab, who took over the maintenance for the foreseeable future. Kudos to all of you guys, namely: Alok Saldanha, Brahim Arkni, Christopher Bauer, Daniel Orner, Denisson Padilha, dorner, Ehsan Abidi Ashtiani, Filip Mares, Jörn Zaefferer, Julio Spader, KJ, Lars Skjelbek, Lukasz Wozniak, Markus Staab, Martti Laine, Michal Moravec, netzkind, rasstislav, sadj, Salahuddin Hairai, Saldanha, silovski, Thomas Gohard, Wojciech Walek, Štefan Baebler. This release would not have been possible without the help of Brahim Arkni. He supported Markus in triaging bugs, cleaning up the bugtracker, reproducing reported issues and also provided a lot of patches. Thank you! It is a pleasure to work with Arkni, we are looking forward to work with him on future releases. The release itself brings a lot of small improvements and fixes a lot of old and outstanding bugs. The most important addition is a new normalizer callback which allows you to modify the values provided by the enduser, before validation takes place. For a full list of all the changes, check out the changelog below. If you use the plugin, please donate or ask your boss to make a donation! This helps to run the plugin site and makes releases like this one possible. The first stable release of the jQuery Validation Plugin, 1.0.0, came out in June 2007, making the project now a little over 8 years old, pretty seasoned for a JavaScript library. According to builtwith.com, its the 25th most popular JavaScript library, with over 1.3 million websites using it. I’m happy to announce the 14th release (discounting various patch releases) of the project, bringing it up to 1.14.0. While a lot of people contributed to this release in some form, I’d like to give Markus Staab a special call out. He’s been helping with ticket triage along with addressing some issues himself, overall being a big help in keeping the project alive."
