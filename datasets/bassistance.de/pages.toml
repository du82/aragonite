["https://bassistance.de/2012/06/11/linkbait-i"]
title = "bassistance.de » Linkbait I"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "While I like Facebook for its private groups features, the public sharing sucks. Unless I send something to a friend directly, its likely that they don’t see it or don’t bother looking at it, if the title isn’t extremly linkbaitly. So, to stop complaining, I’ll try and post good stuff here, maybe with a monthly iteration. To start, cracked.com on 6 Ridiculous Lies You Believe About the Founding of America. Yeah, they know how to do linkbaity titles, but its also an entertaining and somewhat informative read. As Marcus points out in a comment below, the article is very questionable in various aspects (read his comment), but most of all is in essence stolen from Howard Zinn’s “A People’s History of the United States”. So go read that instead. An in-depth explanation of how SSDs work on arstechnica.com. Its pretty long, so read at least the introduction, where the author compares the introduction of 3D accelerated graphic cards to SSDs. Reverse-engineering Prodigy’s “Smack My Bitch Up”, then making a Making Of in Ablteton out of that – really impressive stuff on two levels at once. No embed in this case, but very much worth watching (about 13 minutes): Hans Rosling talking about Religion and Babies, along with a few interesting related conclusions. I you’ve never heard of Hans Rosling before, you should also watch his previous TED talk. A comparison of the first Mega Man game and Mega Man X (19 minutes), with a lot of focus on how especially Mega Man X does a great job of teaching you the game in the first intro stage, without ever telling you what to do or what button to press. Sorry, dass ich jetzt hier mal herummeckern muss, aber genau das “its also an entertaining and somewhat informative read” geht mir als Historiker unglaublich auf die Nerven. Geschichte auf Guido-Knopp-Niveau, in der Essenz von Howard Zinns “A People’s History of the United States” (natürlich ohne Angabe!) zusammengeklaut und mit Pseudofakten gewürzt: So sollen 60 v. Chr. zwei Indianer in “Holland” angelandet sein. Zumindest gibt er den Anschein des Versuchs, diese Behauptung zu beweisen, aber sein Link geht auf eine Sekundärquelle zurück, die wiederum auf eine weitere Sekundärquelle verweist. Wo sind die PRIMÄRquellen, die das belegen? Welcher römische/griechische Autor hat es erwähnt? Und können wir wiederum diesem trauen?"
