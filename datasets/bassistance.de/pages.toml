["https://bassistance.de/2021/12/29/maintenance-intervals"]
title = "bassistance.de » Maintenance Intervals"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "I’ve been using “Remember the Milk” as a Todo App for a really long time. At some point years ago I started using it to track repeating tasks, usually for things happening rarely enough that its important for the app to remind me. Gradually I’ve set up more reminders with shorter intervals, both for maintaining our apartment, and myself. While this is just my personal preference of organizing parts of my life, I figured it might be interesting for others, too. A sketch of what my Todo app looks like on a given day, with a mix of recurring and one-off tasks, ordered by priority I didn’t even realize how many of these I have until I wrote this list down. Its not exhaustive – there’s more maintenance we do, but some tasks have their own reminder (like the oven showing “PYR” when its time to burn some dirt), others their own processes (the dish washer is full) or habits. Some of these intervals I have fine-tuned several times, some I still adjust every now and then. For example, when we discovered how dirty the microwave actually is, we’ve cleaned it once properly, then set up a reminder to clean it every month. At the same time, we also paid more attention to covering food we put inside, so the need for cleaning got a lot less. That’s how we ended up with the current interval of 6 months. The two newest intervals are the two day interleaved workout and practice guitar tasks. Doing these every day is just too much, but every two days works pretty well for me. I started the regular workouts in September and have been pretty consistent since then. I focused on something you might call calisthenics for a while, then spend some time with elastic bands and heavier dumbbells. In the last few weeks, its been mostly Ring Fit on the Switch. I bought an electric guitar early October, and tried practicing every two days since then. With 10+ years playing bass I had a good head start, though chords are still a big challenge (for my big fingers). I’ve played much more Rocksmith 2014 than I did with the bass – by itself its rather limited for learning, but it provides a lot of options and is very well-balanced gamified, similar to Ring Fit."
