["https://bassistance.de/2007/08/24/release-accordion-menu-plugin-15"]
title = "bassistance.de » Release: Accordion menu plugin 1.5"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "I’m happy to present you a new release of my Accordion menu plugin for jQuery. Thanks to some essential help from John Resig on animations, this may be the first release that is actually worth its code. And its the last release as a standalone plugin (stay tuned). If you are already using the plugin: An update is highly recommended. Otherwise, why don’t you give it a try? 1. Clicking is a little erratic in this new version. Sometimes it doesn’t work when I click on the item. 2. My accordion does not obey the navigation option and automatically open when it is not the first item in the sub-category that is active. I have posted a partial demo here which shows the first problem – unfortunately I am still building it all into my Rails application which is not live yet. Try clicking and double-clicking the right hand menus. Sadly you cannot see the 2nd problem, but it is that the “skaters” drop-down under “Portraits” does not automatically open when following the navigation in my app. The others do automatically open. I think I can narrow the issue down to the formatting of my list and line 180 of the JS …current.parent().parent().prev(); Where the plugin does not correctly determine my header… perhaps I should change my menu html from this below? I shamelessly try to reach you to report a problem that i have trying to use the plugin (Rev: 2880) with jQuery 1.2.1 (Rev: 3353). After some digging it appears to be in the Animations/slide/animation function that does: settings.toShow.height(Math.ceil(height – ($.fn.stop ? n * height : n))); The value passed to the .height function maybe be less than 0, hence the error… I got around the error by forcing a value >=0, but i would really appreciate if you could look into this. I’ve run into an issue that appears to involve a problem with IE6 rather than Accordion, but I’m wondering if anyone else has seen it. I have an Accordion menu running at http://youinparkcity.com. Testing was completed and it was seen to run in all the major browsers. Then I got a report that on a couple of Windows machines running IE6 the menu remained fully expanded after the page loaded. I was even able to replicate the problem on another Windows machine. The odd thing is that both my testing machine and the second machine are running identical versions of IE6. Even stranger to me is that no script errors are being generated."
