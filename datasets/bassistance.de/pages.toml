full_description = "A few days ago I was in one of my favorite locations in my city quarter of Köln, Café Casablanca. While drinking my green tea with Morrocan mint, I noticed a song and especially it’s very catchy hook. I used my phone to give me a title and saved it for later. Khaled is one of the most important musicians in the history of Raï music in his native Algeria and is one the world’s best-known Arab singers.[2] To date, Khaled has sold over 80.5 million albums (10 diamond, platinum, and gold) worldwide, making him one of the bestselling Arabic-language singers in history. Among his most famous songs are “Aïcha“, “Didi“, “El Arbi”, “Abdel Kader“, “La Poupée qui fait non“, “Wahran Wahran”, “Bakhta”, “C’est la vie“, and “Alech Taadi”. At work we’re using React Native to build our Android and iOS app. We use it with Hermes, a JavaScript engine Facebook/Meta built for React Native, which doesn’t have a JIT compiler, but is instead optimized for fast startup, by compiling JavaScript to a type of bytecode during build time. Hermes supports plenty of modern JavaScript features, yet any current React Native app will have its source code processed by a bunch of babel plugins, transforming modern JS code into not-so-modern one. In our case this bothered me in particular when debugging events handlers that make use of JavaScript’s async/await feature. Hermes supports this natively, but one of the babel plugins included in the build process, would replace each instance with generators (also a relatively new JS feature, but not quite as new as async/await). The resulting stacktrace, if not properly mapped to the original source code, is much harder to read, since there’s usually two extra items in the stack, one referring to a function injected by babel called _asyncToGenerator. Trying to stop this transform from happening turned into quite a deep rabbit whole. I’ll summarize here what we learned: None of these presets have any configuration options we could find, so in the end we decided to add another patch with patch-package:"
