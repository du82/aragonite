title = "bassistance.de"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "I’ve got three drafts that I hope to eventually publish here, though unless I make some progress in December, likely not this year. And now that I’m completely hooked to Twitter, if you are somewhat interested in my geeky activities, follow me on Twitter. In terms of programming activies, my GitHub profile gives a good idea what I’m working on. If you care about jQuery UI, give the tooltip and spinner widgets a try, both to land in 1.9. Spinner should be the focus of the 1.9 Milestone 3 release, probably next week. If you care about mobile web development, check out jQuery Mobile. An alpha got released at the jQuery Conference in Boston two weeks ago, and we’re already seeing really cool stuff built on top of it. Independent of all that, I’m planning to buy a bass modelling amp sometime soon, with the goal of forcing myself to start playing bass again, through cognitive dissonance: “I’ve payed that much for the amp, now I have to play again!”. May not work due to the fact that I already own equipment worth several thousand euros… While talking about music: Very much looking forward to Rockband 3 and its pro-guitar and pro-keyboard modes. Anyone played that already? Harmonix goal of ‘closing the gap between gamers and musicians’ resonates a lot with me. Speaking of music: One of my first projects when going freelance in December is with Soundcloud, the “Flickr for musicians”, as they used to pitch it (and I still do). This will likely involve jQuery Mobile. Looking forward to working with the Soundcloud team. In the Tarantino Mashups post I featured the Tarantino vs Coen Brothers video from Leandro Copperfield. Leandro did another Mashup, this time involving movies from Stanley Kubrick and Martin Scorcese, overall over 30 movies cut together. Made me want to watch all those movies I haven’t seen, yet, and watch again various of those I already know. I took four years of german in university and I think the knowledge has always made me a better programmer."
