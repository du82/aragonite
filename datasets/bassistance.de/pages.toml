title = "bassistance.de"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "A new version of the jQuery Validation Plugin is available. Once again this release brings more stability (bug fixes!), better localization (new: Malay) and improved html5 compability (min/max attributes on type=”date” now work with the min/max methods). More details on the code and feature changes in the changelog below. Backwards compatibility is still going strong: The plugin should work with anything from jQuery 1.4.x to 1.9.x. Cologne.js is this little user group that a few people founded in June 2010. Michael Bumann, offered to host the event at Cowoco, and has been regularly around since then. After half a year, we crowd-funded a projector and donated it to Cowoco, which meant that everything we needed was right on site. For quite some time, Matthias Luebken ran most of the time, recruiting speakers and advertising the events through Twitter and the mailing list. Its probably been a year now since Frederic Hemberger and myself took fully over. It has been challenging and frustrating at times, but especially our latest meetup in December was a very special success, and I wanted to write some more about that. For the second time this year, we arranged a sponsored speaker to come to our event and speak there, with a local company paying the travel expenses (big thanks to Railslove and Denkwerk). We had Felix Geisendörfer come from Berlin to talk about NodeCopter. He told us how the idea came together, how it went from a singular event to a whole series with more planned for the summer next year. He live demoed his nodejs based library to program the drone, then went on to even write a custom firmware to execute directly on the drone itself. It was a lot of fun, mixed with learning about binary encodings to write a drone firmware. As a kind of warm-up, Sebastian Golasch, by now a regular at our event, talked about what he dubbed Dirty Little Helper. Walking us through various hardware-browser setups, including his MakeyMakey based Simon-Says clone, he eventually presented his custom home automation setup. Remotely turn off lights and use your laptop camera to check on things, all DIY-style with cheap and simple components. I’m ordering a MakeyMakey!"
