description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = 'An update for the jQuery validation plugin is available. Among various bugfixes there are two new localizations (Taiwan and Kazakhstan), an enhancement to $.validator.addMethod that allows you to specify (localized) messages first, the actual method later; the submitHandler-option now keeps a submit-button “alive”, that is, won’t get lost when using the option. Probably most notable: The remote method now allows you to specify custom messages! Return JSON “true” for a valid field, false/null/undefined for an invalid field and the default message, or any other value to use as the message. Update II: Uploaded another release, now at 1.5.5, hopefully the final fix for the remote method: http://plugins.jquery.com/node/8659 I found a bug in the ACCEPT method: it does not control the suffix, but only if the file name ends with the characters setted. For example: test.jpg is ok, but also test.xjpg is ok! I solved the problem by inserting a “.” in your RegExp code: new RegExp(“.[\.](” + param + “)$”, “i”)).'
