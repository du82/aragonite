["https://bassistance.de/2015/04/17/rule-of-thumb"]
title = "bassistance.de » Rule of Thumb"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "A rule of thumb describes an approach based on intuition, in contrast to one based on rationality and calculation. I think its fair to say that science is all about rational, calculating, data-driven approaches, where intuition is considered irrational and unreliable. The scientific method is, among other aspects, about eliminating the effect of various biases, like the availability bias (the first thing that comes to mind is seen much more favourable than other options; Daniel Kahneman describes many of these in “Thinking, Fast and Slow”). In this article I want to provide examples where rules of thumb are a better alternative to scientific research for making personal decisions. Consider food. The 20th century has seen many trends come and go, arguing for some aspect in one decade, arguing against the same aspect in the next. Fat is good, fat is bad; carbs are good, carbs are bad. When it comes to the cancerogenic or cancer preventing effects of food, there are many medical studies involved, but have those gotten us any further? Consider this graph from a vox.com article about news about medical studies: Note the headline on that graph: “Everything we eat both causes and prevents cancer”. I feel like that’s still the wrong way to think about it. Consider this instead: Food doesn’t cause or prevent cancer. Human bodies are not machines that all have the same requirements, they are more complicated, flexible and unique. As long as given the right nutrients, your body will function regardless of the specific food you eat. As the author concludes: “As we turn away from the magic pills and miracle treatments, I think we’ll focus more on the things that actually matter to health — like education, equality, the environment.” Education, equality, the environment, these are all interesting areas, but then food is certainly important to us as well, and surely has influence on our health. But can medical studies really help us decide what food to eat, when they contradict each other so much? In this case a rule of thumb is likely our best bet. To answer the question of “What should I eat (to not get cancer)?”, the rule of thumb given by Michael Pollen in his book “In Defense of Food” could work pretty well:"
year_published = 2025
clearnet = "https://bassistance.de/2015/04/17/rule-of-thumb"
