["https://bassistance.de/2014/07/01/release-validation-plugin-1-13-0"]
title = "bassistance.de » Release: Validation Plugin 1.13.0"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "I’m happy to announce a new release of the jQuery Validation Plugin. It’s been just three months since 1.12, yet this release brings lots of small and two big improvements. For those two I have to thank two people in particular. First, Damian Mooyman, heavily improved the error message display implementation. From the outside, nothing really changed (this is a minor release after all, so backwards compatibility is a given). Though once you switch the bad default for the errorPlacement option to something like a <span> (this default will change in 2.0), the error label gets associated to the element using aria-describedby. Along with the other ARIA attributes the plugin is already using, this gives screenreader users a much better experience. There’s lots of details involved, which don’t quite fit into this blog post. If you’re interested, check out the discussion for the two pull requests that made this happen, #1083 and #1140. The other big one is support for AMD, implemented by Lars Laade. While there was a lot less discussion, he had to update most of the source files. I especially like that the UMD wrappers are added as part of the build step, keeping them out of the source files themselves. Again, if you’re interested in the details, check out pull request #1106. I also want to thank Nick Schonning and Markus Staab, who have been helping out with ticket triage and lots of smaller details. If you use the plugin, please donate or ask your boss to make a donation! This helps to run the plugin site and makes releases like this one possible. 18 people contributed code to this release. A big thank you to: ado130, Damian Mooyman, Diego, J. Randall Owens, Jamie R. Rytlewski, jcare44, Jeremy Forsythe, Jyrki Lilja, Lars Laade, lboullo0, Manuel Dalla Lana, Markus Staab, Nano Taboada, NetImperia, Nick Schonning, paladox2015, pylover, Wing. Also thank you to everyone who reported issues on GitHub or commented on them."
