["https://bassistance.de/about/talk-checklist"]
title = "bassistance.de » Talk Checklist"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "This is a checklist I started 2011 to use whenever I prepare a talk, and to update after I learned something new. If you have ideas for further improvements, let me know. Just keep in mind that it should be kept as a checklist, details must live elsewhere. – Try to use as less text as possible – Make every graph or picture you have as big as possible – Avoid details, if they are not really helping out the audience to get what you want to say. – Bring things to the point: dont go like “well, we did this and this and this and blabla”, just think how you could possibly interest your audience and what they expect to hear, when attending your talk. Start with an initial question and then go like “well at first we thought it was like this, but then BAM (a graph, picture) it actually turned out that…(or something like this) -be dynamic in your tone (I know thats though for some people, including myself, but it helps you to not loose your audience)"
