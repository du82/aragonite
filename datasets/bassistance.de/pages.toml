["https://bassistance.de/page/28"]
title = "bassistance.de"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "I’m happy to announce the first release of the Prettydate jQuery plugin. The plugin is based on the plugin originally written by John Resig and provides clientside date formatting in the style of Twitter’s timeline: “just now”, “5 minutes ago”, “yesterday”, “2 weeks ago”. This release extends John’s original release, providing support for internationalization and improving the API a bit: You can specify the source of the ISO-date, while not having to manually set up an interval to update the date formatting over time. I’m happy to announce the first release of the Password Validation plugin, an extension for the jQuery Validation plugin. This is a review of Learning jQuery 1.3, written by Jonathan Chaffer and Karl Swedberg, published by Packt. Packt sent me a copy of the book for review. Learning jQuery 1.3 is a rewrite of Learning jQuery, which was written by Jonathan and Karl, too, and where I was involved as a technical reviewer. At the time it turned out to be much more work then expected, so I’m happy to just do a normal review this time. Of particular interest to me was the 1.3 aspect of the book. jQuery 1.3 offers a few new features, like the addition of the live-method, which the book covers around page 142: An often superior alternative was introduced in Chapter 3: We can implement event delegation, actually binding the event to an ancestor element that never changes. In this case, we’ll attach the click handler to the document using .live() and catch our clicks that way: The .live() method tells the browser to observe all clicks anywhere on the page. If (and only if) the clicked element matches the .term selector, then the handler is executed. Now the toggling behavior will take place on any term, even if it is added by a later AJAX transaction. In general though, the book isn’t the right place to look for exhaustive descriptions of new features introduced in 1.3. The release dates of 1.3 and the book were quite close, and some features, like those in 1.3.2 to the :visible selector, were released after the book went to print."
