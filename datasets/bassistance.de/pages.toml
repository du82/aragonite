full_description = "And also very sad, considering that there’s code with an actual ProblemFactory (that extend’s a DefaultProblemFactory): Its apparently pretty popular right now, but its also fun to watch and I like the song. Its popular enough that someone made a pretty fun parody: Am 24. März findet der nächste Multimediatreff (MMT) in Köln statt. Die Konferenz gibt es schon länger, das hier wird immerhin Ausgabe 29, es ist aber erst der zweite mit Schwerpunkt HTML5. Das Programm ist zwar noch nicht ganz fertig, es gibt aber jetzt schon einige interessante Themen. Am Nachmittag werde ich dort auch über “Pitfalls and Opportunities of Single Page Applications” erzählen. Im Prinzip derselbe Vortrag den ich auf der jQuery UK Konferenz gehalten habe, allerdings ist hier doppelt so viel Zeit, es wird also einiges mehr abgedeckt. Am 23. März, den Freitag vorher, gibt es ebenfalls im Mediapark drei Workshops, die im Rahmen des Multimediatreffs angeboten werden. Neben “CSS3 und Tools” von Jens Grochtdreis und “Web Application Hacking” von Mario Heiderich, gibt es dort “JavaScript Application Development” von mir. Plätze sind limitiert, die ersten 10 gibts zum Early Bird Preis. Wer also z.B. etwas über Handlebars und socket.io lernen will, sollte die Gelegenheit nutzen! “[…] plans are useful, in the sense that they are proof that planning has taken place. The planning process forces people to think through the right issues. But as for the plans themselves, [they just don’t work in practice]” — from Made To Stick by Chip and Dan Heath This provides a nice answer to the odd notion that being agile is an excuse to do away with all planning. It explains the intuition that planning itself is useful, even if plans aren’t. I’ve only just started reading that book, but odds are good that there’s plenty more gems in it like this one. Thanks to Glen Lipka for the recommendation. PS: I had to cripple the quote a bit, especially at the end, for it to make sense outside of the book’s context."
