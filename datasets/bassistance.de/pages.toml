["https://bassistance.de/2007/11/23/web-wars-return-of-the-command-line"]
title = "bassistance.de » Web Wars: Return of the Command line"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "Aza Raskin’s keynote “Don’t make me click” on day three of the ajax experience revealed an interesting pattern, without actually mentioning it – therefore I label it The Return of the Command line. from wikipedia: A command line interface or CLI is a method of interacting with an operating system or software using a command line interpreter. This command line interpreter may be a text terminal, terminal emulator, or remote shell client such as PuTTY. […] The CLI continues to coevolve with graphical user interfaces (GUIs) like those provided by Microsoft Windows, Mac OS and the X Window System. In some applications, such as MATLAB, a CLI is integrated with the GUI, with the benefits of both. In other words: A plain text input that accepts any text and tries to interpret it. Well known are those provided by your operating system: Some DOS descendant on Windows and various terminals on unix and its derivates. Most common are commands for working with the file system, like searching for files. Using “grep” with a regular expression to search for certain files based on some esoteric content can save you a lot of time. While these may be well known, I think those most popular, in terms of people being able to work with them, are others. If you are reading this directly in your browser (and not through some feed reader), you’ve came here in one of two ways: Entering the URL of this site in your browser’s address bar, or following a link from another site. In the latter case, its quite likely that the link was on a Google search result, where you’ve entered some term to search for. Greatly simplified, the browser does this: For a single term, ask the DNS for the IP address. If found, go there, otherwise fallback to search for it. For more then one term, try to use the first as a command name, eg. “leo”, and pass the rest as parameters. […] doSomething is, in effect, a verb, how an adverb (for example, should the command be executed “verbosely” or “quietly”) and toFiles an object or objects (typically one or more files) on which the command should act."
year_published = 2025
