["https://bassistance.de/2013/03/06/freelancing-from-germany-in-the-us"]
title = "bassistance.de » Freelancing from Germany in the US"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "This post is for anyone who plans to work for a US company as a freelancer, living in Germany. It assumes that you’re already registered as a freelancer in Germany. As you should be used to, a blog post is no replacement for proper legal advice. The good news: You don’t need any permits to freelance from Germany for US companies. That doesn’t apply anymore when you travel to the US, see below for some details. In short: You only pay income tax in Germany. You don’t add VAT (Umsatzsteuer/USt), like you would for german clients, and you don’t pay any taxes in the US. The legal base for that is an agreement between Germany and the US from 1989 that intends to avoid double taxing. The german law that puts the agreement into practice is called “Abkommen vom 29. August 1989 zwischen der Bundesrepublik Deutschland und den Vereinigten Staaten von Amerika zur Vermeidung der Doppelbesteuerung und zur Verhinderung der Steuerverkürzung auf dem Gebiet der Steuern vom Einkommen und vom Vermögen und einiger anderer Steuern”. I’ve looked up the page that has the full text of the agreement, the law text and a few change document (patches!) for you. The relevant article of the agreement itself is article 7, “Business Profits”. As for why you don’t have to charge and pay Umsatzsteuer for US clients: I can’t tell you where exactly that’s regulated. Though there’s a multi-language phone support service, established by a cooperation between Germany, Netherlands and Belgium. You can find the free local phone number for each country on their page here. I called there back in 2010 when I was starting my freelance career and called there again today to check if the service is still up and running. You’re likely to talk to someone from the Netherlands first (they speak german, too), but you can leave a number for a german colleague to call you back. I got the information about the Doppelbesteuerungsabkommen (DBA) from there, while my german tax consultant had no clue."
year_published = 2025
