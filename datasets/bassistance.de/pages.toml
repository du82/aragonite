["https://bassistance.de/2011/12/07/home-theater-pc"]
title = "bassistance.de » Home Theater PC"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "At some point I was planning on building a Home Theater PC (HTPC), but so far didn’t get anywhere. The setup I have right now, my regular PC (mostly a gaming machine) plugged into the TV and some silly cable setup to another 2.1 audio system, is working well enough. So if this is something you’re interested in, here are some resource I gathered on the topic. To start, Martin Fowler provides a good overview of various options. He also links to Jeff Atwood (aka codinghorror), who built his own system. A friend of mine got a setup consisting of a jailbroken Apple TV (on amazon.de, amazon.com) and a Synology NAS (on amazon.de, on amazon.com). The Apple TV runs the frontend software and streams data from the NAS. After a Jailbreak, you can put BoxeeXBMC on it, otherwise you’d be restricted to Apple’s network storage options. The Apple TV is quite cheap, the NAS isn’t, and you also need to buy disks. Maybe I’ll revisit this sometime next year, for now my regular PC with Zoomplayer does the trick. What would you recommend? There seems to be a whole lot of options for relatively cheap streaming-clients and/or media centers. Just search for “media center” or “boxee” on amazon. I’m using my regular pc with mediaportal. It’s a 10 ft interface fully custumizable and very powerful. I can watch trailers of my movies, download subs, listen to pandora,last fm and stream almost every video from the web. All control with a 10$ ir remote from ebay…. You gotta check this out! @Enes: That D-Link Box allows you to plugin an external USB drive. That might be a lot more interesting then an actual NAS. I ended up going for an acer revo machine, they are small form factor PC’s essentially but the graphics capabilities are great considering the low price. The 3700 which i have has a HDMI port and optical sound onboard so you can link it to your TV straight away no messing around. Its only 500GB but get a few 1TB external HDD like WD passport and link them up to one of the many USB ports (i think theres 6). Wireless Keyboard, wireless mouse and wireless windows media remote with some cheap software like intelliremote to get it synced to your favourite media software."
year_published = 2025
