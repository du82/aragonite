["https://bassistance.de/page/38"]
title = "bassistance.de"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "Jeff Attwood quoted this from Spacesballs in his post on Designing for Evil. The link to a scrummy blackhat forum he provided is quite interesting, and after reading along, I found some comments worth quoting. I ended at a blogpost about Making Money With Ringtones, where the author describes agressive tactics for ringtone affiliate marketing: Download videos from Youtube, add watermarks that point to your domain (which redirects to the ringtone offering), upload them on youtube and on torrent and P2P networks. Most of that can be automated using different tools which he points at. So, what do the acused-of-spamming spammers think about that? The author himself (higlighting by me): jayme – You can look at is as spam or as doing what almost 90% of what others do on video sites. Find something cool and reupload it. I can tell you haven’t read the blog thoroughly. I do some aggressive tactics and if your not down with that I really could care less if your reading. that ‘resorting to spam’ comment was hilarious. The way I see it, you’ve gotta be ‘creatively aggressive’ to get paid in this game. Like Gordon Gekko said ‘it’s trench warefare out there…’. I feel like puking while reading on, but I guess thats the price of trying to get less dumb in respect to spammers. We have to understand that spammers don’t see themselves as such. They are “just trying to make some money”. Hey, as long as they don’t deal with drugs or kill someone, it can’t be that bad, can it? We are lucky that they don’t roam the streets and slap people in the face with their ringtone offerings, after all, that would be creative and agreesive, too. Jeff Atwood’s latest post on PHP sucking hard, while powering a very decent amount of the internet, got my attention. Not so much by the content itself, but rather because I was thinking about PHP and Java web applications a lot lately anyway. This blog is powered by PHP and I write little PHP scripts once in a while to mock a server for testing my jQuery plugins. On the other hand, I’m designing, architecting and writing a web application in Java. In the case of testing jQuery plugins and the application, the tool is the right one for the job. I’m not so sure about this blog, WordPress and PHP. Jeff’s post links to more than enough arguments why PHP isn’t the right tool…"
