["https://bassistance.de/2012/02/15/multimediatreff-und-workshops-am-23-und-24-marz"]
title = "bassistance.de » Multimediatreff und Workshops am 23. und 24. März"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "Am 24. März findet der nächste Multimediatreff (MMT) in Köln statt. Die Konferenz gibt es schon länger, das hier wird immerhin Ausgabe 29, es ist aber erst der zweite mit Schwerpunkt HTML5. Das Programm ist zwar noch nicht ganz fertig, es gibt aber jetzt schon einige interessante Themen. Am Nachmittag werde ich dort auch über “Pitfalls and Opportunities of Single Page Applications” erzählen. Im Prinzip derselbe Vortrag den ich auf der jQuery UK Konferenz gehalten habe, allerdings ist hier doppelt so viel Zeit, es wird also einiges mehr abgedeckt. Am 23. März, den Freitag vorher, gibt es ebenfalls im Mediapark drei Workshops, die im Rahmen des Multimediatreffs angeboten werden. Neben “CSS3 und Tools” von Jens Grochtdreis und “Web Application Hacking” von Mario Heiderich, gibt es dort “JavaScript Application Development” von mir. Plätze sind limitiert, die ersten 10 gibts zum Early Bird Preis. Wer also z.B. etwas über Handlebars und socket.io lernen will, sollte die Gelegenheit nutzen! @Sascha: Folien von meinem Vortrag gibt es hier: http://speakerdeck.com/u/jzaefferer/p/pitfalls-and-opportuniities-of-single-page-applications"
