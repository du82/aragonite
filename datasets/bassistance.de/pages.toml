["https://bassistance.de/2007/12/20/kolner-feinstaubplakette"]
title = "bassistance.de » Kölner Feinstaubplakette"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "Ab 1. Januar 2008 kommt man in die Kölner Innenstadt bzw. die Umweltzone nur noch mit Plakette. Gestaffelt wird nach keine, rote, gelbe und grüne Plakette. Bei Benzinern gibt es entweder die grüne Plakette oder garkeine, abhängig ist das von der Schadstoffklasse des Fahrzeuges. Welche Plakette aus der Schlüsselnumme resultiert, findet man in diesem Dokument der Stadt-Köln zur Zuordnung der Schadstoffgruppe nach Emissionsschlüssel-Nummer. Wer also ab 2008 nach Köln will, sollte sich die Plakette besorgen. Am einfachsten geht das wahrscheinlich über das Online-Formular, alternativ in den Meldeämtern der Stadt Köln. Soweit ich gehört hab, gibt es immerhin die ersten Monate eine Übergangsphase, so dass man nicht direkt belangt wird, wenn man ohne Plakette erwischt wird. Aber man sollte sich in der Tat schon darum kümmern. Für die 5 Euro würd ich es nicht darauf ankommen lassen. Man braucht sie ja sowieso. Auch interessant: Wer ohne gültige Feinstaubplakette in die Umweltzone fährt, dem droht neben einem Punkt im Flensburger Verkehrszentralregister auch ein Bußgeld in Höhe von 40 Euro. Darauf würde ich es in der Tat nicht ankommen lassen. Die Plakette gibt es für 5 Euro bei der Zulasungsstelle, beim TÜV oder auch bei AU-Werkstätten. Auch online kann man die Feinstaubplakette bestellen, allerdings ist sie dort etwas teurer. Die Umweltplakette soll man an der Windschutzscheibe befestigen, und zwar von innen. Das Teil ist selbstklebend, macht also insofern keine Probleme."
