full_description = "jQuery 1.3 is out – head over to the jQuery blog release post for details. Happy third birthday, jQuery! If you plan to update, make sure to also update the validation plugin to 1.5.1, which provides compability with 1.3 as well as 1.2.6. Other changes include: i was getting some really bizarre selector results in 1.3 and the validation plugin 1.5 was the culprit. I need to submit forms through links instead of input buttons. I’ve used the following code to do this: $(“form a.form_submit”).click(function() { $(this).parents().filter(“form”).trigger(“submit”); return false; }); This used to work perfectly together with the validation plugin, but is broken since the update (the form isn’t submitted). Any ideas for a workaround, or will I need to downgrade jquery? Just stumbled upon this validation project. Great work, keep it up. Looking forward to integrate this to TurboGears or some other Python framework validation. Assuming nobody has done that yet."
