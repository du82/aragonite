["https://bassistance.de/page/44"]
title = "bassistance.de"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "At the welcome note, Ben and Dion showed their favorite YouTube videos, stuff like Darth Vader being a Smartass and Darth Vader Blues. I arrived that late that I missed that actual stuff they were talking about. Oh well… The first session that I attended was by Kevin Hoyt from Adobe about the Adobe Integrated Runtime (AIR). AIR provides a browser-like runtime with Desktop integration, giving you the chance to use your web-application skills to build desktop applications. AIR uses Webkit, which is also the basis for Apple’s Safari 3, as its HTML rendering engine. I asked Kevin about that after the talk, and according to him, Adobe actually ported Webkit to Windows to be able to use it for AIR. My conclusion for that: We have Safari 3 on Windows because Adobe ported Webit to Windows. Would be nice if someone could verify that. The good stuff that Kevin demonstrated was: Clipboard support (copy & paste), drag & drop support to/from the desktop (or other applications), a File API for reading and writing files from and to the local file system, and also uploading them to the web and a socket API for detecting if some target server is readable or not. He also showed how to set “chrome” to “none”. Actually he should have explained what chrome is, but his demo made it pretty clear: Disabling it removes all the usual window stuff, like the title bar with the close button etc. The Ext guys used that to render a desktop application. According to Kevin there a still a few problems to solve to improve Ext on AIR. Ext uses eval() a lot, and AIR restricts that heavily due to security issues. You don’t want to mix XSS with access to the local file system. So to be able to run Ext in AIR, currently they have to create an iframe that emulates the usual browser sandbox. Inside that sandbox, Ext can use eval() as much as necessary. Kevin said that they are working together with Ext to smoothen those problems to provide easier integration. Surprisingly, the current beta also doesn’t support Flash content. But that should be available in the next beta release."
