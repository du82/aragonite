["https://bassistance.de/page/43"]
title = "bassistance.de"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "Ab 1. Januar 2008 kommt man in die Kölner Innenstadt bzw. die Umweltzone nur noch mit Plakette. Gestaffelt wird nach keine, rote, gelbe und grüne Plakette. Bei Benzinern gibt es entweder die grüne Plakette oder garkeine, abhängig ist das von der Schadstoffklasse des Fahrzeuges. Welche Plakette aus der Schlüsselnumme resultiert, findet man in diesem Dokument der Stadt-Köln zur Zuordnung der Schadstoffgruppe nach Emissionsschlüssel-Nummer. Wer also ab 2008 nach Köln will, sollte sich die Plakette besorgen. Am einfachsten geht das wahrscheinlich über das Online-Formular, alternativ in den Meldeämtern der Stadt Köln. Aza Raskin’s keynote “Don’t make me click” on day three of the ajax experience revealed an interesting pattern, without actually mentioning it – therefore I label it The Return of the Command line. from wikipedia: A command line interface or CLI is a method of interacting with an operating system or software using a command line interpreter. This command line interpreter may be a text terminal, terminal emulator, or remote shell client such as PuTTY. […] The CLI continues to coevolve with graphical user interfaces (GUIs) like those provided by Microsoft Windows, Mac OS and the X Window System. In some applications, such as MATLAB, a CLI is integrated with the GUI, with the benefits of both. In other words: A plain text input that accepts any text and tries to interpret it. Well known are those provided by your operating system: Some DOS descendant on Windows and various terminals on unix and its derivates. Most common are commands for working with the file system, like searching for files. Using “grep” with a regular expression to search for certain files based on some esoteric content can save you a lot of time. While these may be well known, I think those most popular, in terms of people being able to work with them, are others. If you are reading this directly in your browser (and not through some feed reader), you’ve came here in one of two ways: Entering the URL of this site in your browser’s address bar, or following a link from another site. In the latter case, its quite likely that the link was on a Google search result, where you’ve entered some term to search for."
