["https://bassistance.de/2009/01/25/your-future-pc"]
title = "bassistance.de » Your future PC"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "Let’s have a look in the crystal ball and predict how your future PC will look like in a few years. Your CPU has 16 cores, runs at 3 GHz and embeds 128 MB of memory. You’ve packed 32 GB of memory, which reaches peak transfer rates of 20GB/s. Integrated on your mainboard are 256 GB solid-state memory, providing throughput of more than 1.5 GB/s. In addition, you have two more 1 TB solid-state PCI Express II cards, which reach about 1 GB/s. You plug your 128 GB USB-stick into your PC via USB 3.0, with transfer rates above 600 MB/s, copying its complete content in less then four minutes. Your display is connected via DisplayPort, giving your a resolution of 4 four times Full HD, finally getting you the quality of the original movie tapes. The display is also only half an inch thick – handy. I think my PC will have more in common with a modern game console than a desktop computer, i will carry a few SDXC in my wallet and work on whatever machine i happen to be sitting at @alektraunic: Thanks for the link. Though just like solid-state disks won’t replace your RAM (throughput and access time are still much better), I don’t think an SD card with up to 300 MB/s can completely replace built-in storage approaching 1 TB/s. Well, predicting hardware development is pretty obvious isn’t it? But what are we going to do with all that power? Yes – speed – yes – quality – higher resolutions – smaller PCs – nice – can’t wait :-). But where do you see the software development? Higher speed – more bandwidth – that also means more information! I remember Marrissa Meyer from Google talking about being able to carry around all the music available on your iPod. I had two things going through my mind that time – “wow – how cool” and “what the f..k am I going to do with all that music?” Right now I own probably a couple thousand songs – I store thousands of digital pictures on my PC that I’m probably not able to look at again – at least most of them. So what I’m curious about is how the increase of hardware capabilities enhances software development. How can software help us to deal with all that information?"
