full_description = "The autocomplete plugin 1.0.1 is released! For anyone using 1.0 or below, an update is highly recommended, as this is a pure bugfix release. As usual, if you need any kind of help with the plugin, please post to the jQuery discussion list, putting [autocomplete] into the subject. Have fun! Hi Jörn, great to see this update. I’ve been planning a feature on autocomplete scripts – particularly your on jQuery for Designers (planning to be next up). You mentioned in the comments on the plugin page that the demos include a JSON example (sorry if this is a sore point – I read a lot of the comments!), but I couldn’t see any going by the Ajax hits. Also, I noticed a bug in the last example – I’ll drop you an email offline (though perhaps all of this could have been offline…) 🙂 thanks for your comment. There is indeed a JSON example. Taking a peek at the source it should be obvious why I’m not yet promoting that too heavy. The API needs some improvements to make remote JSON as easy to use as it should be. Wouldn’t it be possible to blank the input content if the user exits (ie click on anything else) with nothing selected ? It would be a really great thing to have that confusion (text displayed but nothing selected) removed ^^ I’m using the plugin in modern modal-popups, they have position:fixed property attached. Scrolling the window does not affect my popups (due to position:fixed), but the already opened autocomplete layer doesn’t stay in place and moves up and down on my screen while scolling."
