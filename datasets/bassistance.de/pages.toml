full_description = "This is a small update for the jQuery tooltip plugin. The support for image maps is back, the deprecated $.fn.Tooltip is gone (just use tooltip() instead), and two new features: A fade option, which takes the duration to fade in/out a tooltip in milliseconds. And the positionLeft-option, which configures the plugin to display the tooltip on the left of the cursor. Along a few bug fixes, notable new features are custom messages specified via metadata and enabling an image button to cancel validation (just add class=”cancel”). New localizations are czech (cs) and dutch (nl). Also the deprecated methods minLength, maxLength, rangeLength, minValue, maxValue and rangeValue have been removed, in favor of their minlength, maxlength, rangelength, min, max and range counterparts. The autocomplete plugin 1.0.1 is released! For anyone using 1.0 or below, an update is highly recommended, as this is a pure bugfix release. As usual, if you need any kind of help with the plugin, please post to the jQuery discussion list, putting [autocomplete] into the subject. Have fun! The Bug Bash comic, Technology Inventions We’d Like To See, inspired me to implement the buzzword generator, and after a few minutes, it was done. A few more words would help, but I kept it to close to the reference for now. For those interested, it uses jQuery to find random rows and put the word together, this is the JavaScript code:"
