["https://bassistance.de/2009/04/04/no-best-practices"]
title = "bassistance.de » No Best Practices"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "Everyonce in a while someone pulls out the rhetorical hammer and calls something a “best practice”. In german I call this a Totschlagargument, the best translation I could find seems to be thought-terminating cliché. My favorite political example from that wikipedia page: Anyway, whenever someone pulled best practices out of his sleeve, I want to tell them “There are no best practices!”. But lacking good arguments to back me up in a discussion, I usually wouldn’t. Until now! This article simply called No Best Practices does a good job of explaining why the idea of a best practice is wrong on several levels. For a start, practices depend on context: There are no best practices. By this I mean there is no practice that is better than all other possible practices, regardless of the context. In other words, no matter what the practice and how valuable it may be in one context, I can destroy it by altering things about the situation surrounding the practice. “This practice represents a consensus among industry leaders.”No it doesn’t. You’re just making that up. Industry leaders aren’t able to agree on anything much of substance. I know this because I am an industry leader (based on the fact that some people have said so), and other leaders more often disagree with me instead of obeying my commands. I am influential within a certain clique. The software testing industry is made up of many such tiny cliques, each with its own terminology and values.Whenever people tell you that there’s a consensus in the industry, what they probably mean is that there’s an apparent consensus among those people in the industry whom they happen to respect. The best practice for dealing with discordant voices is: just ignore them. I would suggest that there is at least one practice which ALL Developers everywhere over the world need to follow all the time: [James’ Reply: I don’t need to see your idea to know that it can’t fulfill the claim you made, above. What does “all the time” mean? What does “all developers”? Have you really considered what ALL means?]"
year_published = 2025
