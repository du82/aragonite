full_description = "On a quiet Sunday afternoon I actually managed to render one of my old 3D models in WebGL. And I didn’t even have to deal with WebGL at all, thanks to Three.js. I had the model exported as a 3DS file, which I then imported into Blender, scaled down a bit, then exported to Three.js’ ASCII JSON format. Figuring out how to use the Blender plugin took a bit of digging (documented into a new readme). From there I took one of the existing examples and replaced the loaded model with my own. And tada, a rotating 3D ATST, in your browser, if it supports WebGL: @John: Haha, yeah, that’d be something. Then you could share the frustration of those stupid stones never behaving the way you want them to."
