["https://bassistance.de/page/32"]
title = "bassistance.de"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "jQuery 1.3 is out – head over to the jQuery blog release post for details. Happy third birthday, jQuery! If you plan to update, make sure to also update the validation plugin to 1.5.1, which provides compability with 1.3 as well as 1.2.6. Other changes include: The Big Picture is a photo blog by Alan Taylor, hosted by the newspaper boston.com. The basic idea is the following: Provide a short summary of a current story, and tell it with anywhere between 15 and 45 photos, each with a short description and the source. Photos are 990px × 667px, which supposedly is too small for prints, but big compared to any other news site. Also photos are just loaded all at once on a single page; you can start looking at the first few while the rest is loading. The photos themselves aren’t amateur photos taken from Flickr or elsewhere, instead professional photos from various agencies. For anyone interested in some background information, this interview with Alan Taylor is worth a read. As a follow-up on the meaningless -oriented, here are a few Dilbert’s that really capture the essence of anemic managment BS talk: ‘Oriented’ is a funny word. You can think and act however you like, design things with heartfelt principles and claim to be XYA-Oriented: It doesn’t mean you really are. I’ve seen a lot of object ‘oriented’ code that wouldn’t recognize encapsulation, I’ve seen better OO in C code than in C++ and no OO police ever came around and arrested anyone. SOA isn’t immune to any of these malpractices and is probably especially liable to them. Being ‘oriented’ to Services doesn’t mean too much at the moment. David’s post was a follow-up to Martin Fowler’s about Service-Oriented Architecture (SOA), where Martin concluded: So what do we do? For a start we have to remember all the time about how many different (and mostly incompatible) ideas fall under the SOA camp. These do need to be properly described (and named) independently of SOA. I think SOA has turned into a semantics-free concept that can join ‘components’ and ‘architecture’. It’s beyond saving – so the concrete ideas that do have some substance need to get an independent life."
