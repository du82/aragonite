["https://bassistance.de/page/9"]
title = "bassistance.de"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "Sites like Stackoverflow have formal reputation systems, where every user gets assigned public visible points that increase for actions deemed good, and decrease and some cases considered bad. A score of 10 indicates someone new to the platform, a score of 10.000 someone who’s been around for a long time. Someone new to the platform has an easy time figuring out who’s oldschool and who the other newbies are. But then there’s endless platforms with informal reputation systems, where there is no explicit number or even rules to increase or decrease your reputation. Yet reputation has a lot of influence on those other platforms as well. Consider web standard processes. If you know anything about them, you’ll recognize the name Hixie. But if you’re new, Hixie is just another name. When you’re new and post to a standards mailing list the first time and no one recognizes your name, you’re much more likely to get ignored. I wonder if there’s any platform that’s used daily that doesn’t have some form of reputation system. Is there any where reputation really doesn’t matter? Also, is there a way to convert informal reputation systems like those around web standards into formal ones? Could we build a service that lists people involved in web standards and gives them points for good deeds? This post is for anyone who plans to work for a US company as a freelancer, living in Germany. It assumes that you’re already registered as a freelancer in Germany. As you should be used to, a blog post is no replacement for proper legal advice. The good news: You don’t need any permits to freelance from Germany for US companies. That doesn’t apply anymore when you travel to the US, see below for some details. In short: You only pay income tax in Germany. You don’t add VAT (Umsatzsteuer/USt), like you would for german clients, and you don’t pay any taxes in the US. The legal base for that is an agreement between Germany and the US from 1989 that intends to avoid double taxing. The german law that puts the agreement into practice is called “Abkommen vom 29. August 1989 zwischen der Bundesrepublik Deutschland und den Vereinigten Staaten von Amerika zur Vermeidung der Doppelbesteuerung und zur Verhinderung der Steuerverkürzung auf dem Gebiet der Steuern vom Einkommen und vom Vermögen und einiger anderer Steuern”. I’ve looked up the page that has the full text of the agreement, the law text and a few change document (patches!) for you. The relevant article of the agreement itself is article 7, “Business Profits”."
