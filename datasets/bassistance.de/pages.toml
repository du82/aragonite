["https://bassistance.de/page/45"]
title = "bassistance.de"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "Getting Validation 1.2. done takes much longer then I expected. To compensate for that, here is a bugfix release for the validation plugin, containing all fixes and improvements from the latest revision, compatible with both jQuery 1.1.x and jQuery 1.2.x. Plugin page(s): http://jquery.com/plugins/project/validate & http://bassistance.de.www85.your-server.de/jquery-plugins/jquery-plugin-validation/ I’ve started moving and recreating the documentation to the jQuery wiki. Most parts are still valid for 1.1.1, though a few things will be only available with 1.2 – check out the latet revision if you are interested. A few years ago I spent a lot of time download every Frank Zappa live video I could find in the depths of the internet, and later burned them on a DVD to store them – and forgot wher I put that. Anyway, I couldn’t get a complete version of the Dirty Love Tribute, played by Dweezil Zappa, Mike Keneally and Steve Vai. Good thing is: You Tube has it. Enjoy: I still love this version and still wonder who’s playing the bass there – even with three guitars in focus, the song would be boring without the great bass fundamentals. If you don’t know the original, you really should give Strictly Commcercial a try – packed with rather easy-listening songs, compared to stuff like Lumpy Grave… Good news everyone! The treeview plugin version 1.3 is out, giving you an even better tool at hand to display and navigate your trees. Plugin page(s): http://jquery.com/plugins/project/treeview & http://bassistance.de.www85.your-server.de/jquery-plugins/jquery-plugin-treeview/ In addition, the documentation has been rewritten and is now hosted on the jQuery documentation wiki. We don’t have enough time. Some may even say, they have no free time at all. In my experience, that is always a matter of priorities. If something has a high enough priority for you, you find free time to spend for it. If your top priority is your job and you keep spending ten hours or more at the office, there is hardly any time left for anything else. Depending on how you weigh your priorities, you may be able to accomplish quite impressive stuff in your free time."
