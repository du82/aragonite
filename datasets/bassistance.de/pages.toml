["https://bassistance.de/2023/10/06/decision-record-mocking-in-jest-tests"]
title = "bassistance.de » Decision Record: Mocking in Jest tests"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "This is a lightly edited copy of an Architecture Decision Record I wrote at work and share here in public. We use a lot of mocking in tests written with Jest whenever modules need to leave the JavaScript system barrier. That is, whenever we make network requests, access the location, microphone or camera or some other device interaction, we have to mock those interactions. The rest of this document will call these “system interactions”. The approach to mocking system interactions currently varies a lot, since we have no convention or agreement around these. To make Jest tests easier to write and read and increase consistency, we should decide on guidelines for mocking system interactions. Whenever a module (a React component, some other functions) depends on other modules that have system interactions, we mock those direct dependencies, so that the module under test only depends on pure functions or mocks. We mock as closely as possible to the tested module. That could mean jest.mock('@tanstack/react-query') (when testing a custom hook using react-query) or jest.mock('../hooks/useGetUserData') (when testing a component that uses a custom hook). Since we mock a lot of our own code, we’ll use Manual Mocks correctly to reuse mocks and avoid duplicating mocks many times. Relates to ‘Bonus option 2’ below. This doesn’t mean that we would mock all dependencies of a module – that would lead to an excessive amount of mocking with little additional value. The focus is on mocking those dependencies that directly or indirectly involved system interactions. Whenever a module (a React component, some other functions) depends on other modules that have system interactions we mock the system APIs, like using nock to mock the network requests or mocking react-native-permissions. If a component uses a custom hook that uses react-query to fetch some data, we’d mock the request for “fetch some data”, not the hook or react-query. Tests without any system interactions won’t need any mocking, for example a pure function can be covered with a neat unit test without mocks."
year_published = 2025
