["https://bassistance.de/2010/01/07/reboot"]
title = "bassistance.de » Reboot?"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "I’m thinking about rebooting this blog: Create a new .com site with my jQuery stuff and posting about technical/programming stuff there, while relaunching this site into a german blog, posting about non-technical stuff, music, politics… If you read this, please let me know what you think: leave a comment, or send me a mail at [email protected] Based on my experience having two or more blogs to split stuffs is a good idea but requires many energies at least for me Hi Jörn, Beware about the domains names, I mean, if people wrote something in a blog that is pointing to your plugins, they will find a broken link. I personally don’t follow your blog, but I use your plugins very often they are great plugins :). Since all I really care about at this site is javascript and jQuery, it seems like a good plan to me. Sounds like a plan. It leaves me with two options, switch fully to the new site… or learn to read German. I guess I’ll just switch over 🙂 Wir warten derzeit gespannt. Aber wahrscheinlich bist Du ziemlich im Streß, sodass eine neue Seite erstmal hintenanstehen muss…? Leave it alone 🙂 we’re familiar with your domain for your plugins 🙂 === we don’t like change ?! It’s a matter of time. If you are able to spend your time on updating, patching and improving two blogs, do it 🙂 I guess, the personal one will be more static but it’s nonetheless two blogs you have to care for. You still have your development and all that stuff of which you would not like to drain time from! I have subscribed to your feed and I do not care if I read something personal or non-jQuery stuff from time to time. At least – if you are going to split – let one of the blogs be hassle-free and use posterous or tumblr or one of the other free-to-use blogengines. Good luck! That last point is a good one. I thought about creating something like a Tumblr. I should probably just try out the interface to see if I can work with that. Please leave this domain as technical. Create a new site with your new ideas, announce it here, but leave bassistance.de as it was conceived."
