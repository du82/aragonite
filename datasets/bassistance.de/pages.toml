["https://bassistance.de/2010/07/08/erste-javascript-koln-veranstaltung"]
title = "bassistance.de » Erste JavaScript Köln Veranstaltung"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "Am 13. Juli findet das erste offizielle Treffen der CgnJS statt, einer Gruppe JavaScript Begeisterter aus Köln und Umgebung. An diesem Abend wird es zwei Vorträge geben: Jens Arps mit ‘JS auf mobile devices’ und ich halte ‘Developing web applications with jQuery UI’. Vorher und nachher gibt es viel Möglichkeit zum Kennenlernen und Austausch rund um JavaScript. Das Treffen beginnt um 19 Uhr und die Vorträge um 19:30 Uhr. Das ganze findet in den Räumen der Coworking Cologne statt (Deutz-Mülheimer Straße 129, 51063 Köln) – dort fand auch letzten Dienstag ein kurzfristig organisiertes Node.js Meetup statt, mit Ryan Dahl als Vortragenden. Ein paar Fotos dazu hab ich bei Picasa hochgeladen, inkl. einem 3-minütigem Video, einem Ausschnitt aus Ryans Vortrag: Nachtrag: Es waren 24 Leute da, hier auf ein paar Fotos auch zu sehen. Mein Vortrag lief gut (etwa 17 Minuten vorgetragen, dann nochmal so lang Fragen beantwortet), der von Jens Arps zu Mobile JavaScript war sehr interessant und hochaktuell. Konnte ich auch daran merken, das letztes Jahr im November meinem jQuery UI Vortrag niemand nach Mobile gefragt hatte, gestern hingegen war da eine Menge Interesse. Nächster Termin ist dann am 10. August. gibts für die Veranstaltung eine Agenda oder eine Themenliste oder ist’s eher ein “Stammtisch”-artiges Treffen? Steht doch da: “An diesem Abend wird es zwei Vorträge geben: Jens Arps mit ‘JS auf mobile devices’ und ich halte ‘Developing web applications with jQuery UI’.” Stimmt… wer lesen kann ist klar im Vorteil 😉 Hatte ne andere Veranstaltung im Kopf als ich das geschrieben habe. Das kann man ja als vollen Erfolg werten! Freut mich, dass auch in Deutschland reges Interesse an der außeruniversitären IT-Forschung (im Grunde macht ihr ja nichts anderes) besteht!"
