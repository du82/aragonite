["https://bassistance.de/page/25"]
title = "bassistance.de"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "I needed to add a script tag in every file that included jquery.ui.core.js, directly after that that existing element, with the same indentation. This is what worked quite nicely for me: Replace with: $1<script type=”text/javascript” src=”$2/ui/jquery.ui.core.js”></script>$1<script type=”text/javascript” src=”$2/ui/jquery.ui.widget.js”></script> It groups the whitespace in front of the script element as well as the “../../”-part, and then just duplicates it, inserting the matched groups. An update for the jQuery validation plugin is available. There are five new localizations (now at 26 in total), including Arabic and Farsi (both right-to-left). Validation of selects is now more interactive, click events are properly handled to provide quicker feedback (also a bug related to selects in IE8 is fixed). The equalTo-method is now aware of changes to the target field, so a change to a password field will be reflected in a confirm-password field. And more… The only not fully backwards-compatible change (if you spot anything else, please report it as a bug): The dateDE and numberDE methods were replaced with a localization/methods_de.js file, with localized versions of both the date and number methods. There are also localized methods for the NL and PT locales. The goal is to gather more localized versions of these, similar to the localized messages. Another fragment that turned out to be useless for the project, but may come handy in the future. A port to JavaScript should be easy enough, too: * Both {@link #execute()} and {@link #undo()} should fire property change * events for notifying the editor of an update. */ public static abstract class Command { private String name; public Command(String name) { this.name = name; } @Override public String toString() { return name; } /** * Implements the actual change. * * Any state-saving for {@link #undo()} * has to occur elsewhere, eg. in the constructor. */ public abstract void execute(); /** * Reverts any changes applied by {@link #execute()}. */ public abstract void undo(); } private final List commands = new ArrayList(); private int currentLocation = -1; private int saveLocation = currentLocation; public void add(Command command) { clearInFrontOfCurrent(); command.execute(); commands.add(command); currentLocation++; } public void undo() { commands.get(currentLocation).undo(); currentLocation--; } public boolean undoEnabled() { return currentLocation >= 0; } public void redo() { currentLocation++; commands.get(currentLocation).execute(); } public boolean redoEnabled() { return currentLocation < commands.size() - 1; } public boolean dirty() { return currentLocation != saveLocation; } private void clearInFrontOfCurrent() { while (currentLocation < commands.size() - 1) { commands.remove(currentLocation + 1); } } public void markSaveLocation() { saveLocation = currentLocation; } @Override public String toString() { return commands.toString(); } }"
