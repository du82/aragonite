["https://bassistance.de/page/35"]
title = "bassistance.de"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "I’ve created dedicated pages for my old Youtube-Wordpress-Plugin and a new one, Comment Validation. What does the Comment Validation plugin do? It adds client-side form validation to your comment form, helping commenters to fill out the form. It doesn’t get in the way, so if you fill out fields as usual you’ll never notice it. It just shows hints and highlights field when something is missing on submit or something has the wrong format, like email or url (which is still optional). It should work out-of-the box (upload to your server and activate), but testing so far is limited so any feedback of the plugin running in other themes is welcome! Second attempt at some electronic music. I’m still learning the tools, let me know if you enjoy the music. I’ve recently seen interesting other stitching works, where an image is created by stitching together parts of one or multiple images, eg. by Thomas Bayrle. Haven’t yet found a good resource for his works online, only Google Images turned up a few small ones. His work is currently on display in the Musum Ludwig in Cologne, featuring, among a lot of other awesome stuff, this stitching of telephones: And a third artist, David Hockney, does some inspiring work as well by stitching together a lot of photos from a single scene. A print of “pearblossom highway” is now in my office. Scott Trudeau wrote via his Google Reader shared items, as a note to a Ars Technica article about spam botnets: If you’ve ever despaired of teaching your friends/family/coworkers not to open or respond to spam, the researchers’ findings might make your day. After sending some 350 million e-mail messages over 26 days, Savage and his team had “sold” just 28 “male enhancement” products for just under $100 each. This works out to a conversion rate that’s described as “well under” 0.00001 percent. Total revenue for the period would have been $2,731.88, a bit over $100 a day. That’s chump change by corporate standards, and it’s why the spam industry relies on truly massive campaigns the way it does. By the scientists’ estimates, they controlled just 1.5 percent of the total Storm network. Extrapolate their earnings against Storm’s actual size, and the botnet may have been raking in as much as $7,000 a day ($9,500 if we only count the days Storm was actively conducting a campaign). For the curious, that works out to some $3.5 million in revenue per year."
