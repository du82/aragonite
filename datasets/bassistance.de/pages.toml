["https://bassistance.de/2007/08/04/deathproof-und-deathnote"]
title = "bassistance.de » Deathproof und Deathnote"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "Wenn es einen Film gibt, der auch in der zweiten Reihe eines großen Kinos Spaß macht, dann Deathproof! Das aktuelle Werk Quentin Tarantinos, das hierzulande in einer leicht erweiterten Version gezeigt wird – statt dem double feature mit Planet Terror, auch wenn das noch kommen soll – erzählt von Stuntman Mike, dessen Auto nur für ihn todsicher ist. In der Mitte des Films entpuppt sich Mike als wahnsinniger Massenmörder, dem allerdings die texanischen Cops – übrigens exakt dieselben Charaktere aus Kill Bill (“Sohn Nummer 1!”) – nichts nachweisen können. Die vielen Anspielungen auf Kill Bill finden ihren Höhepunkt in Form von Zoey, das Stuntdouble von Uma Thurmann in Kill Bill, die sich selbst spielt. Grande! Die Gemeinsamkeit von Deathproof mit Deathnote liegt bei ihren Hauptcharakteren: Beide sind sowohl Pro- als auch Antagonist, mit beiden kann sich der Zuschauer zumindest stellenweise identifizieren, und beide sind auf die ein oder andere Art wahnsinnige Massenmörder. Im Falle von Deathnote, einem Anime, dessen zwei Realverfilmungen auch derzeit auf dem Fantasy Filmfest gezeigt werden, findet ein Junge im Collegealter eine “Deathnote”, das Notizbuch eines Shinigami, ein Gott des Todes. Auf den ersten Seiten dieses Buches wird erklärt, das Personen, dessen Namen in das Buch geschrieben werden, sterben. Entweder innerhalb von 40 Sekunden an einem Herzschlag, oder auf andere Art, wenn angegeben. Der Schreibende muss dazu lediglich Namen und Gesicht des Opfers kennen. Der Hauptcharakter, Yagami Light, beginnt nun seinen persönlichen Plan zur Schaffung einer neuen Welt umzusetzen, indem er Kriminelle hinrichtet. Faszinierend an der Serie, die über 37 Folgen erzählt wird, sind die Duelle zwischen Light, der unter dem Decknamen Kira richtet, und seinem Gegenspieler L. Beide sind außerordentliche begabte Denker, und verstehen es, fast jeden Zug ihres Gegners vorauszusagen. Natürlich gibt es immer ein paar Überraschungen, die dafür umso vernichtender sind."
