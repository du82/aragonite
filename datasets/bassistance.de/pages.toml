full_description = "My usecase: Automatically back up savegames through Dropbox, on the one hand as an actual backup, on the other to share it across computers. To do this on Windows, you need a junction link. In this case, I moved Skyrim’s Saves folder to a Dropbox folder, then created a junction link to point back at Skyrim’s folder. I don’t want to share the init files across computers – if you need that, just go a level higher. Early November I attended the first Velocity Europe conference. This was my second conference where I attended, didn’t speak and paid for the ticket myself (Mobilism 2011 was the first, and I already bought a ticket for the 2012 edition…). There’s a lot to say about the conference, though there don’t seem to be a lot of blog posts about it (with this nice exception). You should watch the talks online, as far as available. During the conference I scribbled down various notes that I’m reproducing here. Some notes didn’t make sense anymore, or I couldn’t remember their context. For others, I gathered more information on the topic since the conference. Maybe there’s an idea or two that fancies your interest. Let me know if you want to have more details on any of them. In chronological order: A good conference. Met a good bunch of people that I’ve met before, and some interesting new figures. I didn’t gather enough contact details to stay in touch with them though. This little nugget was shared on some internal mailinglist, but deserves more attention. And as usual, blogging about it is a good way for myself to find it again. To start with, install PCKeyboardHack. Follow their instructions for installation, changing the capslock key to some other keycode (getting to that in a second) and disable the default behaviour. Now, the suggested use was as an iTerm hotkey. For that, set the keycode to 105 (F13). Then go to Preferences in iTerm, and enable the system-wide hotkey (click into the input, then press your newly assigned caps lock key, it should input F13). Here’s a screenshot showing iTerm 2 and PCKeyboardHack preferences.."
