title = "bassistance.de » Ware von amazon.de zurücksenden"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "Wer hin und wieder bei amazon.de einkauft wird früher oder später wohl etwas zurückgeben wollen. Da es das nicht ganz so einfach wie das Bestellen ist, hier ein Erfahrungsbericht: Ich habe kürzlich bei amazon.de einen Kopfhörer bestellt und aufgrund Mißgefallens zurückgeschickt. Während des Einkaufs hatte ich einen 10 Euro Gutschein verwendet und den Rest via Lastschrift von meinem Konto abbuchen lassen: Nehmen wir mal 120 Euro an, wurden also 110 Euro abgebucht. Mit ein wenig Suchen findet man bei amazon.de das Rücksendezentrum. Dort gibt man zunächst an, ob man den Artikel selbst bestellt oder ihn geschenkt bekommen hat. Da ich selbst bestellt hatte, bekam ich als nächstes eine Lister meiner Bestellungen der letzten zwei Monate. Wählt man eine Bestellung aus, die innerhalb der letzten 30 Tage erfolgt ist, kann man die zurückzusendenden Artikel wählen und Menge und Grund mit angeben. Danach kommt eine Auswahl der Versandart, in meinem Fall gab es da allerdings nichts auszuwählen. Danach bekommt man zwei Ausschnitte zum Ausdrucken und Ausschneiden, einer soll in das Paket gelegt werden, einer drauf geklebt werden. Alternativ kann man auch den Lieferschein (auch in Kopie) oder einen Zettel mit E-Mail-Adresse, Bestellnummer und Rücksendegrund beilegen. Das Adressblatt kann man sich ebenfalls sparen, da zumindest bei dem Hermes-Paketshop, den ich aufsuchte, dieser einfach überklebt wurde. So weit, so unkompliziert. Zurücküberwiesen bekommen hab ich dann dann vom Konto abgebuchten Betrag (hier: 110 Euro). Zusätzlich wurden auf mein amazon.de Konto 13,90 gutgeschrieben. Letzteres war nicht gerade offensichtlich und wurde auch in der E-Mail-Bestätigung nirgends erwähnt. Effektiv bedeutet das: Mir wurde sowohl der 10 Euro Gutschein, als auch meine Versandkosten erstattet. Ich kann selbiges bestätigen. Die Rücknahme von Artikeln ist bei Amazon sehr unkompliziert und die Erstattung der Versandkosten sowie des Kaufpreises geschieht sehr schnell. Einzig diese fuzzeligen Ausdrücke zum Ausschneiden könnte etwas größer sein. Hier würde ich für jedes Produkt 10 Cent mehr bezahlen und Rücksendeaufkleber gerne in Kauf nehmen (aller Otto und Co.)"
