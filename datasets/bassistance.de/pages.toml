["https://bassistance.de/page/20"]
title = "bassistance.de"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "If you think about hard- and software in terms of wasted potential, instead of just bad design, you can start seeing a lot of potential everywhere. I had that moment today when thinking about my so called smartphone and what it does in terms of phonecalls. Its really not that much. There’s a list of contacts, each with some optional data like email address and phone numbers. I can mark a number of each contact as a favorite to get a smaller list on a separate page, that I can reorder. If I call someone or get a call, a new entry is added to the list of Recents. If I have a number without a contact, I can use the keypad to call the number directly. So far, so good. Its very barely beyond what my old Siemens mobile phone did nine years ago. Let’s see what innovation could’ve happened in this space. There’s probably more than that – I’ll update the post when more ideas shows up. If you’ve got one, let me know. There’s this modern myth about our attention span being really short, damaged by mobile phones and the internet. Usually these arguments are based on anecdotal-evidence, without any attempt at refuting them. So when I found this nugget in Donald A. Norman’s book Emotional Design, I had to share it: Today it is customary to argue that short attention spans are caused by advertisements, video games, music videos, and so on. But, in fact, the ready distractibility of attention is a biological necessity, developed through millions of years of evolution as a protective mechanism against unexpected danger: this is the primary function of the visceral level. This is probably why one byproduct of the negative affect and anxiety that results from perceived danger is a narrowing and focusing of attention. In danger, attention must not become distracted. But in the absence of anxiety, people are easily distracted, continually shifting attention. William James, the famous philosopher/psychologist, once said that his attention span was approximately ten seconds, and this in the late 1800s, far before the advent of modern distractions."
