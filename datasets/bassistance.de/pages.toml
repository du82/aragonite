full_description = "Auf 3dsupply.de werden derzeit Blogger mit einem kostenlosen T-Shirt bestochen, das man sich auch noch selbst aussuchen kann, wenn man den auf deren Seite verlinkt. Da ich den Shop mag und da schon öfter bestellt hab, mach ich da auch mal mit. Frei nach Frank Zappa: I’m only in it for the money! Not. Tarantino movies are great, the music in them is great, and mashing all the movies together is even better. Eclectic Method did that: Their Tarantino Mixtape is not quite new, but has to be mentioned when looking at this Tarantino plus Cohen Brothers mashup. The beginning is actually very similar, which probably isn’t a coincidance. Mixing in Cohen movies is certainly a good move, though the music mixing isn’t quite as good overall – the transitions are rather weak. Though mixing Samuel L. Jacksons’ bible quote with Don’t Let Me Be Misunderstood from Kill Bill I, climaxing into wild shooting scenes is awesome. Harvey Keitel’s “Bam. Bam. Bam.” from Reservoir Dogs is in both, and if you’ve watched The Tarantino Mixtape first, you’ll certainly like the appearance on the second mix. I do. And now I also want to watch Kill Bill I and II again. I probably should give up on waiting for the Kill Bill Director’s Cut – both movies as one, as originally intended – and just watch them as-is. Still have the shrink-wrapped DVD lying around here… And I want to watch all of the movies in here that I haven’t seen, yet. And watch Inglorious Basterds again. Oh my… PS: If you like the Eclectic Method mashup, be sure to check Lock up your Videos. There are a few goodies on their vimeo channel, too, but its rather random and not nearly on the level as the Tarantino Mixtape or LUYV. Now that jQuery UI is on Github, I need to learn how to branch and merge with Git – and not just local branches, but also pushing branches to Git so that others can work on them. The chapter on branching from Pro Git is a good start for learning branching in Git. And the next step, remote branches, has its own chapter as well."
