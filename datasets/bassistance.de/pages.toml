["https://bassistance.de/page/19"]
title = "bassistance.de"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "An update for the jQuery validation plugin is available. Most notable is heavily improved compability with HTML5 controls: You can apply validation rules to input types like number, email or url, it’ll get picked up by the plugin if the type matches a rule, and a required attribute (with the argument) also works with both jQuery 1.6+ (prop) and previous versions (attr). Another change should make the setup of forms with hidden elements easier, these are now ignored by default (option “ignore” has “:hidden” now as default). In theory, this could break an existing setup. In the unlikely case that it actually does, you can fix it by setting the ignore-option to “[]” (square brackets without the quotes). There also two new localizations, resulting in a total number of 38 localizations. Existing localizations saw various improvements – thanks to everyone who contributed those! Its the only feature where I’m relying completely on contributions, as I can’t verify the correctness of any of the localizations (other then English and German). Backwards compatibility is still going strong: The plugin should work with anything from jQuery 1.3.x to 1.6.x. This post is meant to gather articles or other links on the topic of software patents. If you have something to add, let me know! Finally one more link to a subgroup of a special-interest commission of the german government, the “Projektgruppe Interoperabilität, Standards, Open Source”. If I don’t happen to find someone to help out with that, someone with more experience in this area, I’m planning to post a proposal there covering software patents, with the general idea of making sure that, while software patents are granting in Germany, won’t ever get to a point where they can get enforced in court. Right now I need more information on the actual situation here. The resources I’m gathering here should help providing references for that proposal. In regards to german legislation, there’s a petition against software patents, sponsored by the absurdly german named “Förderverein für eine Freie Informationelle Infrastruktur e.V.” (FFII). Online petitions are kind of silly, but at least here the petition site seems to be gathering some useful references."
