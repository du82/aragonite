["https://bassistance.de/2008/03/27/closures-in-java-and-scala"]
title = "bassistance.de » Closures in Java and Scala"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "If you are familiar with Java, which is more likely then you being familiar with Scala, you may tend to the Java-version. Scala has a different syntax for declaring types and generics, and supports closures, including anonymous parameters (the underscore). When Closures are introduced in one of the next Java releases, JDK 7 or 8, the example could be rewritten like this: The interesting differences between Java with closures and Scala is the static typing: Scala inferences that items are all of type Item, so there is no need to specify that information again. So, while the current Java Closures specification is a great step in the right direction, lead by Neil Gafter who is quite the right man for the job, it may not be worth to wait for it, if you have the choice. Its not even sure yet that we'll see that spec implemented in JDK7, and even that is at best one and a half year away. PS: Pasting Scala code with generic types into a blog is much easier then generic Java, where you need to escape < and > and it also seems very readable. One thing you have to know is the meaning of _. But it is a thing you learn only once at the beginning. When I have to come back to Java i feel .. rather annoyed by having to write all that filter, map and find methods which in Scala are natural readable oneliners. I’m not disputing it’s a little more verbose (I have to explicitly declare a retain method rather than just have it anonymously included as one of the ListUtils params directly), but is that really enough of a reason to generate a complex new concept in Java, like closures? Closures are clearly necessary in dynamically typed languages where they’re needed to provide “private” functionality, but I just don’t see how a statically typed language like Java gains from them. Or at least, not enough of a gain to justify making the language more complex. I disagree that closures are useful only in the context of dynamic-typed languages. Closures bring way more benefits then just what I covered here, one being control abstractions."
