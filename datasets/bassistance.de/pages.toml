["https://bassistance.de/2010/11/30/why-are-smartphones-so-dumb"]
title = "bassistance.de » Why are smartphones so dumb?"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "If you think about hard- and software in terms of wasted potential, instead of just bad design, you can start seeing a lot of potential everywhere. I had that moment today when thinking about my so called smartphone and what it does in terms of phonecalls. Its really not that much. There’s a list of contacts, each with some optional data like email address and phone numbers. I can mark a number of each contact as a favorite to get a smaller list on a separate page, that I can reorder. If I call someone or get a call, a new entry is added to the list of Recents. If I have a number without a contact, I can use the keypad to call the number directly. So far, so good. Its very barely beyond what my old Siemens mobile phone did nine years ago. Let’s see what innovation could’ve happened in this space. There’s probably more than that – I’ll update the post when more ideas shows up. If you’ve got one, let me know. I think Windows Phone goes in the direction you want, but it’s not really polished and a lot of stuff doesn’t work the way it should, but I think they’re definitely heading that direction. I’ve been going through your list, and most of the ideas are already there on my Android smartphone. Like Favorite contacts, Twitter integration, Skype integration, seeing in your dialer if the person is busy, and so on. You’re right about pointing out missing features, but paragraphs 3 and 4 have nothing to do with smartphones. I’m pretty sure the telephony technology itself is to blame for this and that smartphones won’t change anything. They’re just terminals after all… Paragraph 2 : the “most recent” thing has been featured for SMS on Nokia phones for years, I’m surprised it doesn’t exist for calls. The rest I think is not useful but that’s just my opinion. About paragraph 1 : I entirely agree, but, as for what you point out in paragraph 5, I’d say mobile phone operators are to blame for this."
year_published = 2025
