["https://bassistance.de/page/46"]
title = "bassistance.de"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "In der 9.2007 des Javamagazin erschien mein Einführungs-Artikel zum Thema jQuery. Feedback dazu habe ich bisher noch von niemand erhalten, den ich nicht sowieso schon kannte. Macht aber nichts, und vielleicht ändert sich das noch, da der Artikel jetzt auch online verfügbar ist. Der Artikel ansich ist derselbe, praktischerweise sind aber alle Verweise direkt als Links realisiert. Die Beispiele sind leicht in den eigenen Editor kopierbar, sogar der sonst nur auf der Heft-CD verfügbare Quellcode der kompletten Beispiele ist als Download am Ende verlinkt. Das erwähnte Buch, “Learning jQuery : Better Interaction Design and Web Development with Simple JavaScript Techniques” ist mittlerweile erschienen und zusammen mit dem “jQuery Reference Guide” empfehlenswert. I’m happy to present you a new release of my Accordion menu plugin for jQuery. Thanks to some essential help from John Resig on animations, this may be the first release that is actually worth its code. And its the last release as a standalone plugin (stay tuned). If you are already using the plugin: An update is highly recommended. Otherwise, why don’t you give it a try? “Früher”, als ich mich noch mit 3D-Rendering und speziell mit High Dynamic Range Images (HDRI) beschäftigt habe, bin ich mal über die ein oder andere SIGGRAPH-Seite gestolpert. Heute weiß ich immerhin, dass das eine Messe (oder Konferenz?) zum Thema Bildbearbeitung ist. Dort sind wohl auch die ersten Studien zum Thema HDRI präsentiert worden, das heutzutage eine bedeutende Rolle in Computerspielen hat. Aktuell gibt es zum Thema Image Resizing eine beeindruckende Studie. Ich bin gespannt, wann diese Techniken in populären Bildverarbeitungsprogrammen verfügbar sind. Sehet selbst:"
