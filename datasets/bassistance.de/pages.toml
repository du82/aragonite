full_description = "A new release of the validation plugin is done, now at version 1.3. This release adds five more localizations and fixes a few bugs, eg. “asdf” is not a valid creditcard number anymore. Major improvements went into validating a form without triggering UI feedback and batch adding and removing of rules. I had been using Prototype and its related validation code, but moved over to jQuery and your validation plugin, and wouldn’t go back, that’s for sure! The only thing (that I can think of at the moment) is having some slide / fade effects on the error container etc. Just a bit of eye candy 🙂 Adding slide/fade animations to error messages is on the roadmap. I’m currently experimenting with a solution similar to that on bwin.com. Once that is stable I want to feed it back to the plugin. In any case, you can already use the showErrors option to implement your own message display handling. Yes, 1.2.5 breaks the validation plugin. Please stick with 1.2.3 until either another core release is out or an update to the validation plugin. I just had a look at bwin.com and really like the idea of the tool tip error messages. It keeps the form nice and clean looking even when there are errors. If you get a final version similar let me know I be very interested in donating to the final soluton. Also have question in regards to the remote rules, as is it works perfect if the form is empty {new registration}. When you provide form that isn’t empty as in updating ones details, the fields email and username that have the remote rules attached to them when you submit your changes the form will not submit. It will submit if one changes the email or username as the form validates them and checks if they have been used. If you decide not change your email and username or even field that has the remote rule you are stuck with a form that goes no where. Is there a rule that if {value of field != value of field} do a remote check and if { value of field = value of field} ignore the remote rule."
