["https://bassistance.de/2009/11/18/undoredo-command-stack-in-java"]
title = "bassistance.de » Undo/redo command stack in Java"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "Another fragment that turned out to be useless for the project, but may come handy in the future. A port to JavaScript should be easy enough, too: * Both {@link #execute()} and {@link #undo()} should fire property change * events for notifying the editor of an update. */ public static abstract class Command { private String name; public Command(String name) { this.name = name; } @Override public String toString() { return name; } /** * Implements the actual change. * * Any state-saving for {@link #undo()} * has to occur elsewhere, eg. in the constructor. */ public abstract void execute(); /** * Reverts any changes applied by {@link #execute()}. */ public abstract void undo(); } private final List commands = new ArrayList(); private int currentLocation = -1; private int saveLocation = currentLocation; public void add(Command command) { clearInFrontOfCurrent(); command.execute(); commands.add(command); currentLocation++; } public void undo() { commands.get(currentLocation).undo(); currentLocation--; } public boolean undoEnabled() { return currentLocation >= 0; } public void redo() { currentLocation++; commands.get(currentLocation).execute(); } public boolean redoEnabled() { return currentLocation < commands.size() - 1; } public boolean dirty() { return currentLocation != saveLocation; } private void clearInFrontOfCurrent() { while (currentLocation < commands.size() - 1) { commands.remove(currentLocation + 1); } } public void markSaveLocation() { saveLocation = currentLocation; } @Override public String toString() { return commands.toString(); } }"
