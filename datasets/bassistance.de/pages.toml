["https://bassistance.de/page/31"]
title = "bassistance.de"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "The Google LatLong blog has a post about their efforts on mapping our oceans, also explaining some of the problems related to that. Problems that Robert Ballard doesn’t get to explain on his appearance on the Colbert Report: I’m currently working on a web application that uses the Apache Wicket web framework. While implementing a new feature related to file uploads, I stumbled about a problem that turned out to be a known issue. The bug was already fixed in Wicket’s trunk, though not yet released. The scheduled version for the release is 1.4RC2, which doesn’t help either, as I’m still working with Wicket 1.3.5 (the current stable release). I had to somehow fix this, and I’d like to present how I got it working until we can update to 1.4: The ticket also included a patch to MockHttpServletRequest, and I needed exactly that patch. The getInputStream method isn’t final, but I couldn’t just subclass, as the code instantiating MockHttpServletRequest is quite involved. So instead, I copied the class into my project, applying the patch there. The Java classloader loads my modified version instead of the one provided by Wicket’s jar file, and the issue is resolved. Let’s have a look in the crystal ball and predict how your future PC will look like in a few years. Your CPU has 16 cores, runs at 3 GHz and embeds 128 MB of memory. You’ve packed 32 GB of memory, which reaches peak transfer rates of 20GB/s. Integrated on your mainboard are 256 GB solid-state memory, providing throughput of more than 1.5 GB/s. In addition, you have two more 1 TB solid-state PCI Express II cards, which reach about 1 GB/s. You plug your 128 GB USB-stick into your PC via USB 3.0, with transfer rates above 600 MB/s, copying its complete content in less then four minutes. Your display is connected via DisplayPort, giving your a resolution of 4 four times Full HD, finally getting you the quality of the original movie tapes. The display is also only half an inch thick – handy."
