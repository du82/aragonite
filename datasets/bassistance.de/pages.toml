title = "bassistance.de » Release: Validation Plugin 1.6"
description = "Jörn Zaefferer's personal blog about music, software and anything else."
full_description = "An update for the jQuery validation plugin is available. There are five new localizations (now at 26 in total), including Arabic and Farsi (both right-to-left). Validation of selects is now more interactive, click events are properly handled to provide quicker feedback (also a bug related to selects in IE8 is fixed). The equalTo-method is now aware of changes to the target field, so a change to a password field will be reflected in a confirm-password field. And more… The only not fully backwards-compatible change (if you spot anything else, please report it as a bug): The dateDE and numberDE methods were replaced with a localization/methods_de.js file, with localized versions of both the date and number methods. There are also localized methods for the NL and PT locales. The goal is to gather more localized versions of these, similar to the localized messages. @Elijah: I’ve pinged my contact at Microsoft about it. I’ll update the plugin page as soon as its up, and if it takes a while, post another update. This is great, does it support simplified Chinese? I seen in the change log only traditional (just minor variations). Thanks. Yay! This update has fixed an issue I was seeing validating email addresses with Validate 1.5 and JQuery 1.3.2 (but worked fine with 1.2.3). You’re a star Jörn. I haven’t seen it documented anywhere, but are type=’password’ fields considered required, even when not set as such? This is causing problems in a profile update page, where a user need only enter a password if they wish to change it. Setting the field to newpassword: { required: false} fixes it, but I was surprised to not find it documented. I think this is also causing an issue with a confirm password field (where required:”#newpassword”), but I’m still playing with it. Great Plug-in Jörn. We finally went live today and we are using your plug-in in all our forms at http://www.recarded.com if you want to add us to the Documentation Wiki / Sites That Use It section."
