full_description = "This is for the archive and due to lack of useful tutorials on writing custom search pages in your own Eclipse plugin. It turned out that the default text search is good enough for my purposes, so I’ll stick it here as a future reference. To start, your Eclipse plugin needs to add org.eclipse.search as a dependency, and, if you don’t have it already, org.eclipse.jface.text, too. With that, the Require-Bundle part of your MANIFEST.MF should look something like this: Next, we’ll specify the extension for our custom search page, using the plugin.xml editor or just pasting and modifying this snippet: And the actual implementation, providing a textfield as input, initialized with whatever text selection is currently active (thats where the org.eclipse.jface.text dependency comes from), and doing a text search across the full workspace: You can also restrict the files to search by creating a list first, and pass that to the search provider: This in itself doesn’t yet provide a lot of value, but if you actually need to build a custom search, its a good start. Jorn Great tutorial, thanks a lot for publishing this. I was searching for hours for any explanation on hoe to add my search. Finally found one. Small question: I have implemented a plug-in with multi-page editor – one tab is text source and another is TableViewer. Now, I want to be able to search the things in table and mark the cell with text found in some different color. What should I override to do that? Thanks in advance Can’t really help you with that. Maybe check the Eclipse Glance source code: http://marketplace.eclipse.org/content/eclipse-glance"
