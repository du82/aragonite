["http://batmanjs.org/docs/api/batman.view_bindings.html"]
title = "batman.js — batman.view bindings"
full_description = '''Batman.View Bindings Batman's view bindings are how data gets shown and collected from the user. They center on the notion of "bindings": that the view representation and the JavaScript land value are always guaranteed to be in sync, such that when one changes, the other will reflect it. How to use bindings Bindings are declared as attributes on nodes under the data namespace. In practice, it looks like this: <div data-bind="name"></div> This instantiates a binding on the div node which will update the node's innerHTML with the value found at the name keypath in the current context. Whenever the name key changes, the div's innerHTML will update to the new value. Nodes can have multiple bindings: <p data-bind="body" data-showif="isPublished"></p> or attribute bindings: <p data-bind-id="currentID"></p> and bindings can be on inputs which the user can change: <input type="text" data-bind="title"></input> When the title property changes on the JavaScript object this input is bound to, the input's value will be updated. When the user types into the input (and change or keyup events are triggered), the title property in JavaScript land will be updated. Binding Keypaths A keypath is the value of the HTML attribute a binding references. Importantly, keypaths can have multiple segments: <p data-bind="order.customer.name"></p> The keypath in the above HTML is order.customer.name. When you create a binding to a keypath like this (with dots separating segments), the binding will update the HTML value when any of those segments change. In the above example, this means the p tag's innerHTML will be updated when: the order changes, the order's customer changes, or the order's customer's name changes. This is important because it means you can rely on a binding to "just work" when anything it depends on changes. If say you had a <select> on the page which changed the order's customer property, bindings which bind to order.customer.name will update each time you change that select to reflect the new customer's name. Binding Contexts All bindings render in a context. Binding contexts, known internally to Batman as RenderContexts, are objects which emulate the notion of variable scope in JavaScript code. When a controller action renders, it passes a context to the view consisting of itself, the App, and an object with a window key pointing to the host window object. Keypath Filters Bindings can bind to filtered keypaths: <p data-bind="post.body | truncate 100"></p> The above <p> will have 100 characters worth of the post's body. Whenever the post's body changes, it will be retruncated and the <p>'s innerHTML will be updated. Filter chains can be arbitrarily long: <span data-bind="knight.title | prepend 'Sir' | append ', the honourable'."></span> and filter chains can use other keypaths as arguments to the filters: <span data-bind="person.name | prepend ' ' | prepend person.title"></span> The above <span>'s innerHTML will be updated whenever the person's name or title changes. Two Way Bindings and Filters Note that filtered keypaths cannot propagate DOM land changes because values can't always be "unfiltered". For example, if we bind an input to the truncated version of a string: <input data-bind="post.body | truncate 100"></input> The <input>'s value can be updated when the post.body property changes but if a user types into this input field, they will edit the truncated body. If Batman updated the post.body property with the contents of the input, all characters which had been truncated will be lost to the nether. To avoid this loss of information and inconsistency, bindings to filtered keypaths will only update from JavaScript land to HTML, and never vice versa. Keypath Literals Keypaths also support a select few literals within them. Numbers, strings, and booleans can be passed as arguments to filters or used as the actual value of the keypath. The following are all valid, albeit contrived, bindings: <!-- String literal used as an argument --> <p data-bind="body | append ' ... '"></p> <!-- Boolean literal used as an argument --> <p data-showif="shouldShow | default true"></p> <!-- Number literal used as an argument --> <p data-bind="body | truncate 100"></p> <!-- String literal used as the value --> <p data-bind="'Hardcoded'"></p> <!-- Boolean literal used as the value --> <p data-showif="true"></p> data-bind data-bind creates a two way binding between a property on a Batman.Object and an HTML element. Bindings created via data-bind will update the HTML element with the value of the JS land property as soon as they are created and each time the property changes after, and if the HTML element can be observed for changes, it will update the JS land property with the value from the HTML. data-bind will change its behaviour depending on what kind of tag it is attached to: <input type="checkbox">: the binding will edit the checked property of the checkbox and populate the keypath with a boolean. <input type="text"> and similar, <textarea>: the binding will edit the value property of the input and populate the keypath with the string found at value. <input type="file">: the binding will not edit the value property of the input, but it will update the keypath with a host File object or objects if the node has the multiple attribute. <select>: the binding will edit the selected property of each <option> tag within the <select> matching the property at the keypath. If the <select> has the multiple attribute, the value at the keypath can be an array of selected <option> values. You can also use data-bind-selected bindings on the individual options to toggle option selectedness. All other tags: the binding will edit the innerHTML property of the tag and will not populate the keypath. data-bind can also be used to bind an attribute of a node to a JavaScript property. Since attributes can't be observed for changes, this is a one way binding which will never update the JavaScript land property. Specify which attribute to bind using the "double dash" syntax like so: data-bind-attribute="some.keypath". For example, to bind the placeholder attribute of an input, use data-bind-placeholder. <input type="text" data-bind-placeholder="'Specify a subtitle for product ' | append product.name"> Note: data-bind will not update a JavaScript property if filters are used in the keypath. data-source data-source creates a one way binding which propagates only changes from JavaScript land to the DOM, and never vice versa. data-source has the same semantics with regards to how it operates on different tags as data-bind, but it will only ever update the DOM and never the JavaScript land property. For example, the HTML below will never update the title property on the product, even if the user changes it. Each time the title attribute changes from a set in JavaScript land, the value of the input will be updated to the new value of title, erasing any potential changes that have been made to the value of the input by the user. <input type="text" data-source="product.title"> Note: data-source-attribute is equivalent to data-bind-attribute, since the former is defined as never making JS land changes, and the latter is unable to. data-target data-target creates a one way binding which propagates only changes from the DOM to JavaScript land, and never vice versa. data-target has the same semantics with regards to how it operates on different tags as data-bind, but it will never update the DOM even if the JavaScript land value changes. Note: data-target-attribute is unavailable, because DOM changes to node attributes can't be monitored. data-showif / data-hideif data-showif and data-hideif bind to keypaths and show or hide the node they appear on based on the truthiness of the result. data-showif will show a node if the given keypath evaluates to something truthy, and data-hideif will leave a node visible until its given keypath becomes truthy, at which point the node will be hidden. data-showif and data-hideif show and hide nodes by adding display: none !important; to the node's style attribute. For example, if the HTML below is rendered where the keypath product.published evaluated to true, the <button> will be visible. <button data-showif="product.published">Unpublish Product</button> This is the Batman equivalent of a templating language's if construct, where else branches are implemented using the opposite binding. <button data-showif="product.published">Unpublish Product</button> <button data-hideif="product.published">Publish Product</button> data-addclass / data-removeclass data-addclass and data-removeclass bindings can be used to conditionally add or remove a class from a node based on a boolean keypath. Specify the class to add using the "double dash" syntax; for example,data-addclass-big="some.keypath" on a node will add the "big" class to that node's classes if some.keypath is truthy. data-removeclass will remove a class (usually one which is present in the HTML) if the keypath passed to it is truthy. The outer span in the HTML below will have an "error" class when the product.errors.length keypath evaluates to anything other than 0, since 0 is falsy and other numbers are truthy. <p data-addclass-error="product.errors.length"> This product has <span data-bind="product.errors.length"></span> errors. </p> data-foreach data-foreach is used to loop over an iterable object in Batman views. data-foreach duplicates the node it occurs on for each item in the collection found at the keypath given to it, and renders each duplicated node with that node's object from the collection by putting it in the context under a name passed to it using the "double dash" syntax. The <option> node below will be duplicated for each item in the Set at the products keypath. <select> <option data-foreach-product="products" data-bind="product.name"></option> </select> Batman will execute the data-foreach binding before the data-bind on the <option> node, which means that the data-bind will be processed for each duplicated node with each separate Product in the products Set in scope for each separate node. If there were say 3 Products in the products set, the HTML would look similar to this once rendered: <select> <option data-bind="product.name">Product A</option> <option data-bind="product.name">Product B</option> <option data-bind="product.name">Product C</option> <!-- end products --> </select> data-foreach can be used to iterate over Batman.Sets, and most often should be, because it observes any Sets and will update the DOM with new nodes if items are added to the set, or remove nodes from the DOM if their corresponding nodes are removed from the set. data-foreach, like every other binding, is keypath aware, such that if the Set instance at the keypath changes, or any previous segment of the keypath changes, data-foreach will remove all the nodes currently in the DOM, and add new nodes for each new item in the incoming Set. Sometimes you'll need to add some custom logic to the iteration nodes. For example, a custom viewDidAppear handler so you can know whenever a new iteration node appears in the DOM. You can do this by specifying a custom subclass of Batman.IterationView. <ul> <li data-foreach-product="products" data-view="ProductIterationView"> <span data-bind="product.name"></span> </li> </ul> class MyApp.ProductIterationView extends Batman.IterationView viewDidAppear: -> $(@get('node')).draggable() Note: data-foreach expects to find an iterable object at the keypath given to it, and will emit a warning if it finds undefined. Note: data-foreach expects the passed enumerable to be unique. It creates a map of nodes to items, so every node needs to be able to reference exactly one object. If you simply have a set of values that you're iterating over, you should wrap your values in objects, e.g. [{value: true}, {value: true}]. data-formfor data-formfor creates a special addition to the context stack to represent an object under edit within a form. Usually this object is a model. Using the double dash syntax, the name for the model to reside under can be specified. ==== Automatic Validation Display data-formfor also has some handy functionality for displaying the result of validating the object under edit in the form. This will only be enabled if the object has an errors Set, like Batman.Models do. If a tag matching the relative selector .errors is found, it will populate this element with a list of the errors found during validation on the object. The selector for the errors container can be changed by adding a data-errors-list attribute with the value of the selector to the form with the data-formfor binding on it, or editing Batman.DOM.FormBinding::defaultErrorsListSelector. If value bindings are made using data-bind to attributes on the model within the form, automatic data-addclass-error bindings will be added to the elements on which the data-bind occurs to add the "error" class when the model has errors on the attribute which data-bind binds to. In the HTML below, an automatic data-addclass-error will be added to the <input> which activates when the product model has validation errors on the name attribute. <form data-formfor-product="currentProduct"> <input type="text" data-bind="product.name"></input> </form> The class which gets automatically added to inputs binding to invalid attributes can be customized by editing Batman.DOM.FormBinding::errorClass. data-context data-context bindings add the object found at the key to the context stack, optionally under a key using the double dash syntax. For example, if a product object exists in the current context, the data-context binding below will expose its attributes at the root level of the context: <div data-context="product"> <span data-bind="name"></span> <span data-bind="cost"></span> </div> Contexts added to the stack can also be scoped under a key using data-context-: <div data-context-currentProduct="product"> <span data-bind="currentProduct"></span> <span data-bind="currentProduct"></span> </div> This is a useful mechanism for passing local variables to partial views. data-event data-event bindings add DOM event listeners to the nodes they exist on which call the function found at the passed keypath. data-event bindings use the double dash syntax to specify the name of the event to listen for. In the HTML below, if the keypath controller.nextAction resolves to a function, that function will be executed each time the <button> element is clicked. <button data-event-click="controller.nextAction"></button> Functions which data-event calls will be passed the node and the DOMEvent object: (node, event) ->. data-event supports the following types of events formally and should "do the right thing" when attached to elements which fire these events: click doubleclick change submit If the event name used doesn't match the above events, the event name used will just fall through and be passed to window.addEventListener. data-route d'''
