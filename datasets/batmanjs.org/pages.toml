title = "batman.js — overview"
full_description = '''Meet your new favorite JavaScript superhero Launch App Next Step If you love Ruby on Rails, batman.js is the best, most familiar way to build rich web apps in CoffeeScript. Click here to try it live! batman.js > Invalid command Skip this Step Love Rails?You'll love batman.js. If you know Rails, then you'll be up and running with batman.js in minutes. batman.js was built with Rails development in mind, allowing you to save time and use less code. Serious Scalability.batman.js makes it easy. Building the next [insert trendy website/app]? batman.js was created with scalability in mind and currently powers Shopify. In other words, your project will never outgrow batman.js. Happiness fordevelopers & designers. batman.js was created with developer and designer happiness as a top priority. Here's some cool stuff: Structured directory hierarchy Familiar Rails conventions Data bindings for rapid building of HTML Liquid-style filter syntax Source batman.js is released as open source software under the MIT license. We invite you to download, modify, and use the code. If you do anything you think other people would find useful, we love pull requests! Access on Github Issues Found a bug or other nasty in batman.js? It's still new, so it's bound to happen! We use GitHub's issue tracker to manage our issues. Access on GitHub Mailing List For the sake of asynchronous communication, most discussion and announcements about batman.js will take place via the mailing list, hosted on Google Groups. Visit the group Tweets about batman.js !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+"://platform.twitter.com/widgets.js";fjs.parentNode.insertBefore(js,fjs);}}(document,"script","twitter-wjs"); Stay up-to-date with batman.js announcements: Visit the Google Group'''
