full_description = "Java type indicators in Eclipse less than 1 minute read One of the things that I don’t like about the default Eclipse settings for Java development is that in the package explorer all Java files appear in the same manner(with the same icon). There is no visual distinction between abstract and concrete classes, enums, interfaces… Luckily for us Eclipse supports such a distinction and all you have to do is enable it. Go to Window -> Preferences -> General -> Appearance -> Label Decorations and mark the check box saying Java Type Indicator. I’ve tested this on Eclipse 3.5 only, but I guess it is included in previous releases as well. Eclipse, though not as feature rich as IntelliJ IDEA, offers a lot of features that one has to find for himself. Tags: Eclipse, Java Updated: July 13, 2009 Share on Twitter Facebook LinkedIn Previous Next var HYVOR_TALK_WEBSITE = 2584; // DO NOT CHANGE THIS var HYVOR_TALK_CONFIG = { url: 'https://batsov.com/articles/2009/07/13/java-type-indicators-eclipse/', id: 'https://batsov.com/articles/2009/07/13/java-type-indicators-eclipse/' }; Back to the Basics: Zsh without Oh My Zsh 3 minute read .zshrc simplicity is the ultimate sophistication. – Leonardo Da Zshinci Automate the Creation of GitHub Releases 2 minute read I maintain many open-source projects and one of the most common tasks for me is to “create a GitHub release”, which is more or less the process of attaching ... Learning OCaml: Matching Anything or the Lack of Anything 1 minute read I’ve noticed that some newcomers to OCaml are a bit confused by code like the following: Simple Ways to Run OCaml Code 2 minute read When people think of OCaml they are usually thinking of compiling code to a binary before they are able to run it. While most OCaml code is indeed compiled t..."
