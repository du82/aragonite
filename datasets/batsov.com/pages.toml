description = "Hacker. Emacs fanatic. Lover of parentheses. Firebrand. Just another programmer with too many opinions. I’m not the best, but I’m pretty good."
full_description = "Projects On this page HighlightsRubyClojureEmacsMeta ReduxSupport Me I love free software and I do a fair share of work on free software projects. Most of my projects are in the realms of Clojure, Ruby and Emacs and aim to help software engineers be more productive. My projects are spread over several GitHub accounts: Personal Projects RuboCop HQ Clojure Emacs nREPL Highlights Here’s a brief run-down of my (somewhat) popular projects.1 Ruby RuboCop (linter/code formatter for Ruby) Ruby Style Guide Rails Style Guide RSpec Style Guide Minitest Style Guide Clojure These days (circa 2018) Clojure free software work consumes most of my time and energy. I’m the author of a few projects: CIDER (powerful Clojure interactive development environment for Emacs) cider-nrepl (nREPL middleware for Clojure editors and IDEs) orchard (essential functionality for Clojure development tools, used internally by cider-nrepl) incomplete (a simple Clojure code completion library) inf-clojure (basic Clojure interactive development environment for Emacs) And the primary maintainer or a co-maintainer of a ton of commonly used tools and libraries focused at creating powerful Clojure editing experience: nREPL (a network REPL server) Piggieback (ClojureScript support for nREPL) Drawbridge (HTTP support for nREPL) Fastlane (Transit support for nREPL) cljs-tooling clj-refactor refactor-nrepl compliment (the ultimate Clojure code completion library) sayid (Clojure tracer/debugger) clojuredocs-edn-export (daily EDN exports of the data from https://clojuredocs.org) parseclj (Clojure parser written in Emacs Lisp) parseedn (EDN parser written in Emacs Lisp) Emacs Emacs is the One True Editor and my biggest life-long obsession. You can safely describe me as an unreasonable (but powerful) Emacs wielding fanatic! Prelude (an Emacs distribution) Projectile (project management and navigation package) Crux (a collection of useful Emacs commands) super-save (auto-save your work when moving around) guru-mode (helps you remember the basic Emacs keybindings) rubocop-emacs Zenburn theme for Emacs Solarized theme for Emacs adoc-mode Flycheck Flycheck OCaml You can find my personal Emacs configuration here. Meta Redux Since 2018 I have a dedicated blog, named Meta Redux, for my OSS work. Support Me Working on free software projects is a lot of fun, but it also takes a lot of time and energy. I’d love to be able to turn my free software hobby work into my job, but I’ll need a lot of help from you to get there! If you like my work, consider supporting it via one of following funding platforms: GitHub Sponsors Patreon PayPal Thanks! Popular meaning that they have other users besides me. ↩"
