["https://batsov.com/articles/2008/07/27/zsh-prompt"]
title = "A nice zsh prompt - (think)"
description = "Recently I switched to zsh, after being a bash user for almost 5 years. I was in love with everything in zsh from day one, except one thing – the default prompt. Although zsh ships with several prompt themes, I didn’t like any of them so I looked around a little bit and constructed my own humble prompt. Here it goes:"
full_description = "A nice zsh prompt 1 minute read Recently I switched to zsh, after being a bash user for almost 5 years. I was in love with everything in zsh from day one, except one thing – the default prompt. Although zsh ships with several prompt themes, I didn’t like any of them so I looked around a little bit and constructed my own humble prompt. Here it goes: PROMPT='[%n@%m %~] $ ' In case you’re wondering what this gibberish means: %n stands for your username (e.g. bozhidar) %m stands for the first part of your machine’s hostname (you can use %M for the fully-qualified name) %~ stands for the current directory path with your home dir aliased to ~ (if you want to see the path in its natural form use %d instead) All of this strange looking character combinations are called “escape sequences” and they have special significance to zsh. The rest of the characters in the prompt definition are represented literally in the resulting prompt. It looks like this (on my machine): [bozhidar@localhost ~/store] $ If you like it simply put the prompt definition like in your .zshrc file. You may want to put a little bit different version of the prompt in the root user’s .zshrc (if you use root at all that is): PROMPT='[%n@%m %~] # ' This follows the well established pattern that a normal shell and a root shell should be easily distinguished visually. Tags: Linux, Z Shell Updated: July 27, 2008 Share on Twitter Facebook LinkedIn Previous Next var HYVOR_TALK_WEBSITE = 2584; // DO NOT CHANGE THIS var HYVOR_TALK_CONFIG = { url: 'https://batsov.com/articles/2008/07/27/zsh-prompt/', id: 'https://batsov.com/articles/2008/07/27/zsh-prompt/' }; Back to the Basics: Zsh without Oh My Zsh 3 minute read .zshrc simplicity is the ultimate sophistication. – Leonardo Da Zshinci Automate the Creation of GitHub Releases 2 minute read I maintain many open-source projects and one of the most common tasks for me is to “create a GitHub release”, which is more or less the process of attaching ...