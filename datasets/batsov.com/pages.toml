description = "I haven’t posted anything lately, but I just received my brand new Das Keyboard and now I simply can’t stop typing. Recently I’ve been going through some effective techniques to implement popular design patterns and I was surprised to see how few people were aware of them. For example since Java 5 the best way to implement the Singleton pattern is simply to use an enum like this:"
full_description = "The best way to implement the Singleton pattern in Java and Ruby 1 minute read I haven’t posted anything lately, but I just received my brand new Das Keyboard and now I simply can’t stop typing. Recently I’ve been going through some effective techniques to implement popular design patterns and I was surprised to see how few people were aware of them. For example since Java 5 the best way to implement the Singleton pattern is simply to use an enum like this: public enum SomeClass { INSTANCE; } This is possible due to the fact that in Java (unlike in C++ and C#) enums are full-blown classes (although they do not support features like inheritance for example). You get an added bonus when using an enum class – you do not have to worry about serialization – this is handled for you behind the scenes. And this is how one should implement the Singleton pattern in Ruby: require 'singleton' class Some include Singleton end Through the magic of Ruby’s mix-ins you get a private constructor for your class and an instance method with which you can obtain a reference to the single instance of the class. And best of all – because this library has undergone a substantial degree of testing it is pretty much bulletproof. Things hardly get simpler than that. Tags: Design Patterns, Java, Ruby Updated: September 29, 2008 Share on Twitter Facebook LinkedIn Previous Next var HYVOR_TALK_WEBSITE = 2584; // DO NOT CHANGE THIS var HYVOR_TALK_CONFIG = { url: 'https://batsov.com/articles/2008/09/29/singleton-java-ruby/', id: 'https://batsov.com/articles/2008/09/29/singleton-java-ruby/' }; Back to the Basics: Zsh without Oh My Zsh 3 minute read .zshrc simplicity is the ultimate sophistication. – Leonardo Da Zshinci Automate the Creation of GitHub Releases 2 minute read I maintain many open-source projects and one of the most common tasks for me is to “create a GitHub release”, which is more or less the process of attaching ... Learning OCaml: Matching Anything or the Lack of A