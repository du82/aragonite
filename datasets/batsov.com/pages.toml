title = "Contact - (think)"
description = "Hacker. Emacs fanatic. Lover of parentheses. Firebrand. Just another programmer with too many opinions. I’m not the best, but I’m pretty good."
full_description = "Contact On this page General NotesGetting in TouchEmailGitHubMastodonBlueskyX (Twitter)Blog CommentsLinkedIn General Notes I’d be really glad to hear from you, if you want to talk about: content on the site (e.g. share some feedback about an article I wrote) Emacs any of my OSS projects presentations I gave career development any topic that is of interest to me (if you know/follow me, you definitely know what they are) I’ll likely ignore messages: from random recruiters who are interested in my (non-existing) React.js and PHP skills about “guest” articles from marketing agencies that are hostile and non-constructive that are sales pitches for random services (I’ve never bought into a service after a cold email from a sales rep, so don’t waste your time with me) Getting in Touch The best way to reach me is via email. I love email and rarely bother to check messages on LinkedIn (and social media in general). More details below. Email Feel free to contact me at first name at batsov.com/net about anything. Email is a great place for private constructive conversations. It’s also a great option to discuss my open-source projects, if you’re the type of person who avoids using GitHub. Note: I can heartily recommend Fastmail to everyone looking for a great email service that respects your privacy and embraces email standards. Using my affiliate link to sign up will give you a 10% discount for the first year. GitHub The best place to collaborate on any of my OSS projects is GitHub. I welcome all contributions, no matter how small they are. I also try to help all contributors with feedback and guidance. My projects are spread over several GitHub accounts: Personal Projects RuboCop HQ Clojure Emacs nREPL Flycheck Feel free to also send PRs addressing the many typos and the bad English grammar in this blog. I guess it’s obvious I don’t really proofread my articles. Mastodon Mastodon is the only “social media” that I like and use frequently these days (early 2024). It’s a great place for sharing random thoughts and ideas, quick feedback, shout-outs, etc. My Mastodon handle is bbatsov@hachyderm.io. Bluesky Bluesky reminds me of the early days of Twitter and I’m somewhat active there as well. You can find my Bluesky profile here. X (Twitter) Twitter was the only social media that I liked, before it went to sh*t. I’m still use it to some extent, but I prefer Mastodon and Bluesky over it. Blog Comments For reasons outlined here I’ve removed comments from this blog. I keep an eye on the traffic coming to the blog, so if my articles end up on Reddit, HackerNews, etc, I’ll likely notice this and join the conversation there. LinkedIn I accept most invitations to connect, but I rarely respond to any messages there. If you want to get my attention on LinkedIn you’ll have to try really hard. Emails work a lot better!"
