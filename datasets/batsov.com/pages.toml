["https://batsov.com/articles/2009/05/19/emacs-shift-return"]
title = "Emulate the behaviour of Return+Shift(insert new line) from popular IDEs(IDEA, Eclipse) in Emacs - (think)"
description = "I’m very fond of the ability to insert a new line below the line I’m currently at, and to position the cursor at the beginning of that new line, offered by most IDEs, such as IntelliJ IDEA and Eclipse. It’s usually bound to Return (Enter) + Shift. Emacs (as far as I know) doesn’t have a command that does this thing by default, but one can easily create one, combining several well known commands in the process and bind that new command to the desired key combination. Here’s the snippet one might have in their .emacs (or other) “configuration” file:"
full_description = "Emulate the behaviour of Return+Shift(insert new line) from popular IDEs(IDEA, Eclipse) in Emacs less than 1 minute read I’m very fond of the ability to insert a new line below the line I’m currently at, and to position the cursor at the beginning of that new line, offered by most IDEs, such as IntelliJ IDEA and Eclipse. It’s usually bound to Return (Enter) + Shift. Emacs (as far as I know) doesn’t have a command that does this thing by default, but one can easily create one, combining several well known commands in the process and bind that new command to the desired key combination. Here’s the snippet one might have in their .emacs (or other) “configuration” file: ;; insert an empty line after the current line and position the cursor on its beginning (defun insert-empty-line () (interactive) (move-end-of-line nil) (open-line 1) (next-line 1)) (global-set-key [(shift return)] 'insert-empty-line) Tags: Emacs, IntelliJ Updated: May 19, 2009 Share on Twitter Facebook LinkedIn Previous Next var HYVOR_TALK_WEBSITE = 2584; // DO NOT CHANGE THIS var HYVOR_TALK_CONFIG = { url: 'https://batsov.com/articles/2009/05/19/emacs-shift-return/', id: 'https://batsov.com/articles/2009/05/19/emacs-shift-return/' }; Back to the Basics: Zsh without Oh My Zsh 3 minute read .zshrc simplicity is the ultimate sophistication. – Leonardo Da Zshinci Automate the Creation of GitHub Releases 2 minute read I maintain many open-source projects and one of the most common tasks for me is to “create a GitHub release”, which is more or less the process of attaching ... Learning OCaml: Matching Anything or the Lack of Anything 1 minute read I’ve noticed that some newcomers to OCaml are a bit confused by code like the following: Simple Ways to Run OCaml Code 2 minute read When people think of OCaml they are usually thinking of compiling code to a binary before they are able to run it. While most OCaml code is indeed compiled t..."
