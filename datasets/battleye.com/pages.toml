["https://www.battleye.com/2016/04/22/were-hiring"]
title = "BattlEye – The Anti-Cheat Gold Standard » We’re hiring! (German)"
full_description = "We’re hiring! (German) Posted on 22nd April 2016 at 00:14:48 BattlEye Innovations sucht nach Verstärkung! Bist du auf der Suche nach einer besonderen Herausforderung, bist softwaretechnisch talentiert, hast Lust dazu, BattlEye weiter mit aufzubauen und zum globalen Marktführer von Anti-Cheat-Lösungen zu machen? Deine primäre Aufgabe wird es vorerst sein, das Interfacing für Spieleentwickler zu verbessern und dafür selbstständig eine webbasierte Losung zu entwickeln, du solltest aber auch für andere Einsatzbereiche offen sein. Trifft das auf dich zu, dann bewirb dich bei uns! Voraussetzungen: – Interesse an der Anti-Cheat-Thematik – Exzellente Kenntnisse und Erfahrungen in Web-Programmierung (insbesondere HTML, CSS, PHP, JavaScript, MySQL, MongoDB) und C/C++ – In der Lage, selbstständig eine Software-Lösung zu implementieren und Führungsrolle in der Entwicklung zu übernehmen – Eigeninitiative und Engagement – dies ist kein Standard-“9 to 5”-Job – Flexibel und offen für andere Bereiche, die nicht unmittelbar mit der Programmierung/Entwicklung zu tun haben (z.B. Mitwirkung bei Kontakt zu Spieleentwicklern, o.ä.). – Präsenz vor Ort (Raum Tübingen) Plus: – Abgeschlossenes Studium der Informatik – Kenntnisse in Low-Level-Sprachen wie x86/x64-Assembler, Kernel/Treiber-Entwicklung – Leidenschaftlich, genau/perfektionistisch bei der Arbeit – Eigene (abgeschlossene) Projekte/Referenzen Wir bieten: – Außergewöhnlicher “non-standard” Job in einem aufstrebenden Startup mit viel zeitlichem und arbeitstechnischem Freiraum – Möglichkeit, bedeutend bei der weiteren Entwicklung von BattlEye mitzuwirken – Besuch von Spielemessen/Conventions (GDC, etc.) und Kontakt zu bekannten Spieleentwicklern Fühlst du dich angesprochen und denkst, dass du der/die Richtige dafür bist, so schicke deine Bewerbung (inklusive Lebenslauf und Referenzen) bitte an [email protected]. Wir freuen uns auf dich!"
