["https://www.battleye.com/support/faq"]
title = "BattlEye – The Anti-Cheat Gold Standard » FAQ"
full_description = 'FAQ When launching the game I get an “Update failed …” error. In order for BE to operate properly, it needs to be able to download updates prior to launching the game. If this fails for you please make sure that your system and network has unrestricted internet access. Furthermore, if you are using a firewall or similar security software, please ensure that the BE Launcher executable (often named “[Game name]_BE.exe”) is allowed to access the internet without restrictions. You may want to add the BE Launcher executable to the software’s exception list as well. When launching the game I get a “Failed to initialize BattlEye Service: Driver Load Error (1275).” error and Windows displays a popup reporting that BEDaisy.sys cannot be loaded on this device due to a security feature called “Hardware-enforced Stack Protection”. Recently Microsoft has started to ask Windows 11 users to enable this security feature and if they do so it will cause the BE driver to be unable to load. Due to the complexities involved in security software unfortunately many kernel-level anti-cheats, including BE, are not compatible with this feature yet. While we are working on finding a solution and are also in contact with Microsoft regarding this issue, unfortunately there is no easy or immediate fix for it. Update: Recently we have fixed this incompatibility, however, currently the latest Windows 11 is still blocking any version of our driver whenever this feature is enabled. We are currently waiting for Microsoft to release a Windows update to unblock the latest versions of our driver to solve this. Therefore, for the time being, users will have to revert enabling this security feature using one of the following ways. Please note that by doing so you will not lower the security of your device or expose it to greater risks compared to previously, as this is a new security feature that wasn’t enabled on devices before. Click the “Disable” button in the Windows popup and reboot your system. Open the Start menu and enter “Core isolation” in the search bar to open the related Windows Defender settings. In the “Windows Security” window switch the option called “Kernel-mode Hardware-enforced Stack Protection” to “Off”, then reboot your system. Afterwards you should be able to play BE-protected games again. When launching the game I get a “Failed to initialize BattlEye Service: Driver Load Error (577).” error. Due to new driver signing requirements Windows systems now need to support SHA-2 signatures to be able to load the BE driver. If you get this error on Windows 7 please make sure the system is fully up-to-date or install the following update specifically: https://support.microsoft.com/en-us/topic/sha-2-code-signing-support-update-for-windows-server-2008-r2-windows-7-and-windows-server-2008-september-23-2019-84a8aad5-d8d9-2d5c-6d78-34f9aa5f8339. When connecting to a BE-enabled server I get kicked with a request to restart my game. This is happening because you permanently declined BE installation by clicking “Do not ask me again.” in the BE Launcher window previously. To fix this please go to the “BattlEye” folder in your game directory (e.g. “C:\Program Files (x86)\Steam\steamapps\common\Destiny 2\battleye”) and double-click the “Install_BattlEye.bat” file to install BE. I’m using the software XY while playing my game with BE enabled, is it allowed or can I get banned for it? Generally we only ever ban for the use of actual cheats/hacks or components of such hacks which are designed to intentionally bypass BE’s protection. Otherwise you don’t need to worry about getting banned. For example, non-cheat overlays and visual enhancement tools like Reshade or SweetFX are generally supported unless desired otherwise by the game developers (the latter two are currently blocked in PUBG, Fortnite and Islands of Nyne). We might decide to kick (not ban) you at some point for using a specific program (such as macro tools), but that won’t automatically flag you as a cheater. My BE Launcher window shows “[INFO] Blocked loading of file: …” messages. What’s wrong and do I risk getting banned? First of all, no, you won’t risk getting banned for any of these messages. They also don’t mean that BE is looking at files on your system that are unrelated to the game. If a file is blocked it means that the game process tried to load them, which is the reason BE is checking them. If these messages don’t cause any issues with your game you can just ignore them (note that in-game kicks are not related to them). BE’s protection is quite strict, which might cause it to block certain files which are not essential for playing the game. In that case you don’t need to worry about any bad consequences such as getting banned. Otherwise please check the following list of solutions: Make sure that BEService.exe in your BE Service directory (usually “C:\Program Files (x86)\Common Files\BattlEye”) is not blocked by your firewall in any way. Ensure that there is no d3d9.dll, dxgi.dll or dsound.dll file in your game directory. If there is one please remove/rename it. Ensure that you have a legitimate copy of Windows. Pirated copies might no longer be supported by the latest BE version. Check if your game directory’s file permissions are broken by doing the following: Right-click on your game directory (in Windows Explorer), select “Properties” and go to the “Security” tab. In the group/user list select the “SYSTEM” entry and check if it has full access. Otherwise click “Edit…” and grant the “SYSTEM” user full access. Your system’s root certificates might be broken/corrupted. To fix them download and install the following update from Microsoft: http://support.microsoft.com/kb/2813430. Check your system files for corruptions and possibly repair them by following these guides: http://support.microsoft.com/kb/929833 and http://support.microsoft.com/kb/947821. Scan your system with up-to-date anti-virus and anti-malware software. Malware that modifies system or game files can cause such issues when BE is enabled. Googling the name of the blocked file can help find out what is actually behind it. Sometimes BE might block malware/adware/PUP files, which can cause problems such as being unable to find or connect to servers in-game. We recommend Malwarebytes Anti-Malware for removing such software from your system. Ensure that you don’t use any tweaked/custom versions of system files (including DirectX). Reinstall DirectX, see the following page for details: http://support.microsoft.com/kb/179113. If you are sure that BE blocks legitimate files and that causes problems for your game (such as being unable to find servers) please contact us directly here. When launching the game I get a “Windows Kernel modification detected.” error. You are either using a cracked version of Windows or you previously installed hack software that disables certain important security features of Windows. Unfortunately, we cannot support systems that run a hacked Windows kernel. To solve this you can try to check your system files for corruptions and possibly repair them by following these guides: http://support.microsoft.com/kb/929833 and http://support.microsoft.com/kb/947821. Otherwise you need to perform a full reinstall of Windows using a legitimate copy. When launching the game I get a “Failed to initialize BattlEye Service: Kernel Debugging enabled.” error. Please disable Kernel Debugging by following the instructions posted here: https://docs.microsoft.com/en-us/windows-hardware/drivers/devtest/bcdedit–debug. Afterwards you need to reboot your system. When launching the game I get a “Failed to initialize BattlEye Service: Windows Test-Signing Mode not supported.” error. Please disable test-signing mode by following this guide: http://support.microsoft.com/kb/2509241. Alternatively you can follow the manual instructions provided here: https://msdn.microsoft.com/en-us/library/windows/hardware/ff553484%28v=vs.85%29.aspx. If you are using hardware that requires driver signature enforcement to be disabled please check the vendor’s website for newer drivers. Unfortunately, due to our goal to provide the most effective protection possible we cannot support systems running in test-signing mode in any way. We ask for your understanding. When launching the game and trying to install BE I get a “Failed to install BattlEye Service.” error. First of all, please ensure that you have all BE files required for installation in place in your game directory. Either verify your game files/cache on Steam or Uplay or completely reinstall the game. Secondly, please make sure that you run the initial installation from a administrative user account or a limited user account with UAC enabled. Otherwise BE won’t be able to request administrative privileges required to install the BE Service. If none of this helps please also check the following FAQ entry. When launching the game I get a “Failed to install BattlEye Service.” / “BattlEye Service installation failed.” / “Failed to start BattlEye Service.” / “BattlEye Service startup failed.” / “Failed to initialize BattlEye Service: …” error. This happens if something on your system prevents the installation/startup of the BE Service, which is required to play on BE-enabled servers. Please ensure that any security software (anti-virus, etc.) running on your system doesn’t block the BE Service (both BEService.exe/BEService_x64.exe in your game’s “BattlEye” directory as well as the entire BE Service directory, which is usually “C:\Program Files (x86)\Common Files\BattlEye”) in any way. You might have to add it to your security software’s exception list. If that doesn’t help or you don’t use any sort of security software there might be a permission issue with your BE Service directory or the files within it. To solve this delete the BE Service directory (usually “C:\Program Files (x86)\Common Files\BattlEye”) and then try to launch your game again. If you still get the same error at this point please try to manually set the BE Launcher in your game directory (usually the executable file with “_BE” at the end) to run with administrative privileges (normally this should happen automatically). To do so right-click on the BE Launcher executable, choose “Properties”, go to the “Compatibility” tab, check the “Run this program as an administrator” option and click OK to apply your changes. If you still can’t get it to work some unknown software running on your system might be blocking BE somehow or certain parts of your operating system might be broken. If you cannot determine the cause we would suggest a repair reinstallation of Windows as a definite solution. I get an “Exception Processing Message 0xXXXXXXXX (e.g. 0xc0000135) …” error when launching the game. This is usually caused by missing system or Visual C++ runtime files that the game needs to run. Please fully reinstall the game and be sure to complete all setup steps (e.g. initial setup on Steam when launching the game for the first time). My BE Launcher is stuck at “Starting BattlEye Service…” stopping my game from launching. Something on your system prevents the BE Service from functioning properly. Please check the FAQ entry regarding BE Service installation/startup failures above for solutions. When starting my game with BattlEye enabled, I get constant stuttering/freezing whenever I press mouse/keyboard buttons. This is typically caused by malware/adware/PUP constantly reloading into your game. Please try to scan your entire system with anti-malware software such as Malwarebytes Anti-Malware to remove it. When starting my game with BattlEye enabled, my SpeedFan (or potentially other hardware-related) software stops working. Please fix it! BattlEye is blocking certain software that is using kernel drivers which contain known security issues that can be exploited by cheats. We cannot support such software and therefore cannot provide a fix. Please ensure that you are using the latest version of such software or, if there is no newer version available, contact the developer/vendor of the software to notify them of the problem. When starting my game with BattlEye enabled, random legitimate applications on my system are being terminated. Recently several Windows 10 users have started experiencing this issue without a change on our side. After investigating we have concluded that it is caused by NVIDIA’s new “(Ultra-)Low Latency Mode”. Until NVIDIA provides a fix please disable this feature by opening your NVIDIA Control Panel, selecting “Manage 3D settings” -> “Global Settings” -> “Low Latency Mode” and changing this setting to “Off”. Click “Apply” and potentially also reboot your system. When starting my game with BattlEye enabled, I get the following error message: “Windows cannot access the specified device, path, or file. You may not have the appropriate permission to access the item.” This is likely caused by you trying to use an unsupported Windows 10 Insider build. While we try to support the latest builds as fast as possible, there can sometimes be delays related to a number of factors. Until then you will have to downgrade to an official public build of Windows 10. When starting my game with BattlEye enabled, my system crashes with a bluescreen (BSOD). First of all, ensure that Driver Verifier is disabled on your system as it is currently known to cause problems with BE. You can find how to do so here: https://support.microsoft.com/en-us/help/244617/using-driver-verifier-to-identify-issues-with-windows-drivers-for-adva. To disable it please clear all of its settings and reboot your system. Secondly, please fully update your system’s BIOS. If that doesn’t help and the crashes persist please contact our support directly so we can investigate your issue. I no longer want to have BattlEye on my system. How can I completely uninstall it? Note that BE only installs into your system on Windows (as a system service), so you don’t need to uninstall it on any other OS. Also, BE is only ever active when you are playing a BE-protected game with BE enabled, any other time it will never run in any way. If you would still like to uninstall it, please go to the “BattlEye” folder in your game directory and check if there is a file called “Uninstall_BattlEye.bat”, which is present in many games. If it exists, simply run it to completely uninstall the BE Service. Otherwise or if you have already removed all game files from your system, you can start a command prompt as administator and simply enter “sc delete BEService” to do so. Note that some games automatically uninstall BE when they are being uninstalled as well. I am getting kicked for the following violation(s). I don’t use hacks, so what can I do to resolve this? BattlEye initialization failedFirst of all, please ensure that BE is properly installed for your game. You can manually install it by following the instructions on the download page. If that doesn’t help there might be a problem '
