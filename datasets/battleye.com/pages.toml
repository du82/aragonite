["https://www.battleye.com/news"]
title = "BattlEye – The Anti-Cheat Gold Standard » News"
full_description = "News We want you! Posted on 25th September 2017 at 18:25:01 We want to extend our team in Tübingen, Germany and are looking for a software developer (m/f) at the earliest date possible. You are looking for a special challenge, are talented and experienced in writing software and are motivated to participate in a growing company? Then this is the right place for you! Your tasks will be: Take part in developing BattlEye anti-cheat software Analysis and reverse-engineering of cheat programs Development of detection algorithms Integration of BattlEye into games Maintenance of BattlEye in cooperation with game developers We expect: Degree in computer science or equivalent qualification or own completed projects Deep knowledge of the programming language C/C++ Advanced knowledge of Windows operating systems Basic knowledge of x86/x64 assembler, debugging and reverse-engineering of software Willingness to learn new techologies, programming languages and development environments Sophisticated analytical skills, high comprehension and understanding of complex connections Independent, elaborate, structured and goal-oriented approach to work Good English skills and precise articulateness Interested? Then we are looking forward to your application! Please send all of your documents (application letter, CV, qualifications, salary expectation and earliest possible date of entry) via email to [email protected] and refer to this job advertisement. More games! Posted on 4th April 2017 at 06:44:22 We are happy to announce that BE has continued to grow in recent months and we have started to protect the following titles: Line of Sight by Blackspot Entertainment Conan Exiles by Funcom BlackShot by Vertigo Games ARK Online by Snail Games Tibia by CipSoft PLAYERUNKNOWN’S BATTLEGROUNDS by Bluehole Studio We are always looking for new partnerships with great developers, so if you think your game needs a strong protection please drop us a message! New partnerships Posted on 30th November 2016 at 06:40:52 We are happy to announce that for a while now we have worked with the amazing Nelson Sexton (Smartly Dressed Studios) to protect his popular Unturned game, as well as New World Interactive for their great Insurgency and Day of Infamy titles. Recently we also started supporting Bohemia Interactive’s new experimental multiplayer game Project Argo. As always, we are glad to able to add value to great games such as those. BattlEye coming to Survarium Posted on 19th September 2016 at 03:58:21 We’re glad to announce our partnership with Vostok Games to protect their spiritual successor of the S.T.A.L.K.E.R. series, which we already protected many years ago. BattlEye released for Rainbow Six Siege! Posted on 5th August 2016 at 01:23:59 We are happy to announce that BattlEye is now protecting Rainbow Six Siege. As with other games, we will do our best to fill this role and prove once again that we call BE the gold standard of anti-cheats for a reason. BattlEye coming to PlanetSide 2 and The Isle Posted on 17th May 2016 at 15:19:47 We are happy to announce that BattlEye will shortly be introduced in the popular MMO PlanetSide 2 as well as Steam Early Access title The Isle. We are looking forward to protecting these games in the future. We’re hiring! (German) Posted on 22nd April 2016 at 00:14:48 BattlEye Innovations sucht nach Verstärkung! Bist du auf der Suche nach einer besonderen Herausforderung, bist softwaretechnisch talentiert, hast Lust dazu, BattlEye weiter mit aufzubauen und zum globalen Marktführer von Anti-Cheat-Lösungen zu machen? Deine primäre Aufgabe wird es vorerst sein, das Interfacing für Spieleentwickler zu verbessern und dafür selbstständig eine webbasierte Losung zu entwickeln, du solltest aber auch für andere Einsatzbereiche offen sein. Trifft das auf dich zu, dann bewirb dich bei uns! Voraussetzungen: – Interesse an der Anti-Cheat-Thematik – Exzellente Kenntnisse und Erfahrungen in Web-Programmierung (insbesondere HTML, CSS, PHP, JavaScript, MySQL, MongoDB) und C/C++ – In der Lage, selbstständig eine Software-Lösung zu implementieren und Führungsrolle in der Entwicklung zu übernehmen – Eigeninitiative und Engagement – dies ist kein Standard-“9 to 5”-Job – Flexibel und offen für andere Bereiche, die nicht unmittelbar mit der Programmierung/Entwicklung zu tun haben (z.B. Mitwirkung bei Kontakt zu Spieleentwicklern, o.ä.). – Präsenz vor Ort (Raum Tübingen) Plus: – Abgeschlossenes Studium der Informatik – Kenntnisse in Low-Level-Sprachen wie x86/x64-Assembler, Kernel/Treiber-Entwicklung – Leidenschaftlich, genau/perfektionistisch bei der Arbeit – Eigene (abgeschlossene) Projekte/Referenzen Wir bieten: – Außergewöhnlicher “non-standard” Job in einem aufstrebenden Startup mit viel zeitlichem und arbeitstechnischem Freiraum – Möglichkeit, bedeutend bei der weiteren Entwicklung von BattlEye mitzuwirken – Besuch von Spielemessen/Conventions (GDC, etc.) und Kontakt zu bekannten Spieleentwicklern Fühlst du dich angesprochen und denkst, dass du der/die Richtige dafür bist, so schicke deine Bewerbung (inklusive Lebenslauf und Referenzen) bitte an [email protected]. Wir freuen uns auf dich! BattlEye coming to H1Z1 and ARK: Survival Evolved Posted on 10th February 2016 at 06:25:47 We are happy to announce that BattlEye is now protecting acclaimed multiplayer titles H1Z1 by Daybreak Game Company and ARK: Survival Evolved by Studio Wildcard. We are looking forward to providing these games with the best anti-cheat protection possible. A New Dawn Posted on 9th February 2015 at 21:19:44 For the past few months we have been working on making BE fundamentally different from conventional anti-cheat systems (including the old/current BE) that can only punish cheaters after their damage to other legitimate players has already been done, i.e. are based on detections of hacks and subsequent banning. With these new upcoming changes we are trying to move away from that and make BE a proactive anti-cheat system that is mainly based on protection instead of detection. In essence, this will allow BE to actively protect the games it supports against cheating/hacking, which is a big thing. To properly achieve such protection, it’s required for the game to be started via a special BE launcher and as you might have noticed, this new launcher is already being used in ArmA 2: Operation Arrowhead since July, where recently we started to roll out first iterations of the new protection system. Just a few days ago the new BE launcher was also introduced on the DayZ experimental branch. It’s important to understand that this new approach won’t mean the complete end to hacking, but overall it will give hackers a much harder time and make BE much more effective in its effort to actually prevent cheating. Please note however that this is continuous work in progress and the current protection is far from perfect. It will keep evolving and become more sophisticated over the coming weeks and months. Lastly, we want to stress that contrary to what some individuals have been claiming this new protection won’t make BE a rootkit. Naturally the new system will employ a kernel-mode driver, but BE never has been and never will be a rootkit trying to hide its own activities on our users’ computers."
