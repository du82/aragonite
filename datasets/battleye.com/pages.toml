["https://www.battleye.com/privacy-policy"]
title = "BattlEye – The Anti-Cheat Gold Standard » Privacy Policy"
full_description = "Privacy Policy BattlEye Anti-Cheat Software In order to serve its purpose of preventing and detecting the use of cheat software with the goal of ensuring a fair game environment BattlEye may collect and process personal data from you. The following section clarifies our policies in relation to such data processing. Identity of the data processor: BattlEye Innovations e.K. Responsible person: Bastian Suter Address: Gerhard-Kindler-Straße 8, 72770 Reutlingen, Germany Contact e-mail: [email protected] The purposes of the processing: BattlEye is processing personal information in order to provide its services of preventing and detecting the use of cheat software with the goal of ensuring a fair game environment as intended by the game publisher. The legal basis for the processing: BattlEye is processing personal information to allow the game publisher to pursue and protect its legitimate interests of keeping its game free from malicious misuse, abuse or cheating. The recipients of the personal data: BattlEye is the primary recipient of your personal data, however we may also share any information with the game publisher that is using BattlEye to protect its game(s) or any explicitly mentioned partners and/or affiliates. The types of personal data being collected and processed: BattlEye may collect and process the following information from you: IP address Game identifiers (e.g. in-game name, account ID, etc.) Hardware device information and identifiers (e.g. serial numbers) Information about the running operating system Information about game-related and operating-system-related files and memory Information about running processes, drivers and other executable code File names included in other information listed here, which might also contain your operating system user name BattlEye follows a data minimization policy that ensures that data is only being stored when necessary, i.e. when BattlEye finds information that may potentially indicate the use of cheat software. As a result, BattlEye generally will not store any information on most users. Note that the processing of personal data by BattlEye is required in order to play the game or BE-protected parts of the game. Furthermore, BattlEye may use automated decision-making when processing your personal data in order to be able to effectively fulfill its purpose. The duration of the processing/storage: BattlEye may store the information for the entire duration of the provision of its services for a game. Your rights as a data subject: As a data subject and EU citizen, you have the right: to access information held about you, to have your personal data erased or rectified, to restrict the processing of your personal data, to object to processing of your personal data, to receive personal data about you and transfer it to another data controller, and to lodge a complaint with the relevant data protection authority. Please note the following: We will not disclose any information that will expose internal company secrets such as logs generated from cheat detection algorithms. To protect the legitimate interests of the game publisher, when requesting the erasure or the restriction of processing of your personal data, we or the game publisher will implement measures to prevent you from accessing the game, which includes continued storage of data required to do so. In order to exercise your rights in relation to any data processing performed by BattlEye, we advise you to contact the respective publisher of your game. We will not be able to satisfy any such requests directly since, as a third-party service provider, we don’t have the means to verify your identity beforehand. However, you can still contact us at [email protected] for any general questions regarding our data processing. Furthermore: As trust is paramount when it comes to anti-cheat, we feel that it is important for us to clarify to all of our users that your privacy is respected and protected by us at all times. There has been a lot of misinformation posted on the internet about BattlEye in recent years and therefore we want to emphasize what exactly we are doing in an unambiguous way without confusing you with typical legal language. While BattlEye needs to have full access to your system’s internals to have the capability to detect all hacks, we do not look at, check, transmit or even sell any of your personal information, data, documents, credit card details, passwords or similar. Our mission is to provide effective anti-cheat protection, not to spy on you. Besides, looking at your personal information does not help us reach the goal of providing a cheat-free environment in any way, so there is absolutely zero point in doing it in addition to it being immoral. Like most other anti-cheat solutions, BattlEye has the theoretical capability to transmit flagged executable code to our servers for further review. This is needed to be able to discover and identify new hacks being used. However, for normal users that do not run suspicious software this should never happen and other than that we do not transmit any of your memory contents to our servers. Finally, any data relating to you / your game account is always stored on secure servers. We usually only store data if there is some sort of detection and that includes your IP address, account/in-game name and possibly hardware serial information for identification. This is also mentioned in our EULA that usually comes with the games we support. Website (English) 1. An overview of data protection General The following gives a simple overview of what happens to your personal information when you visit our website. Personal information is any data with which you could be personally identified. Detailed information on the subject of data protection can be found in our privacy policy found below. Data collection on our website Who is responsible for the data collection on this website? The data collected on this website are processed by the website operator. The operator’s contact details can be found in the website’s required legal notice. How do we collect your data? Some data are collected when you provide it to us. This could, for example, be data you enter on a contact form. Other data are collected automatically by our IT systems when you visit the website. These data are primarily technical data such as the browser and operating system you are using or when you accessed the page. These data are collected automatically as soon as you enter our website. What do we use your data for? Part of the data is collected to ensure the proper functioning of the website. Other data can be used to analyze how visitors use the site. What rights do you have regarding your data? You always have the right to request information about your stored data, its origin, its recipients, and the purpose of its collection at no charge. You also have the right to request that it be corrected, blocked, or deleted. You can contact us at any time using the address given in the legal notice if you have further questions about the issue of privacy and data protection. You may also, of course, file a complaint with the competent regulatory authorities. Analytics and third-party tools When visiting our website, statistical analyses may be made of your surfing behavior. This happens primarily using cookies and analytics. The analysis of your surfing behavior is usually anonymous, i.e. we will not be able to identify you from this data. You can object to this analysis or prevent it by not using certain tools. Detailed information can be found in the following privacy policy. You can object to this analysis. We will inform you below about how to exercise your options in this regard. 2. General information and mandatory information Data protection The operators of this website take the protection of your personal data very seriously. We treat your personal data as confidential and in accordance with the statutory data protection regulations and this privacy policy. If you use this website, various pieces of personal data will be collected. Personal information is any data with which you could be personally identified. This privacy policy explains what information we collect and what we use it for. It also explains how and for what purpose this happens. Please note that data transmitted via the internet (e.g. via email communication) may be subject to security breaches. Complete protection of your data from third-party access is not possible. Notice concerning the party responsible for this website The party responsible for processing data on this website is: BattlEye Innovations e.K. Proprietor: Bastian Suter Gerhard-Kindler-Straße 8 72770 Reutlingen Email: [email protected] The responsible party is the natural or legal person who alone or jointly with others decides on the purposes and means of processing personal data (names, email addresses, etc.). Revocation of your consent to the processing of your data Many data processing operations are only possible with your express consent. You may revoke your consent at any time with future effect. An informal email making this request is sufficient. The data processed before we receive your request may still be legally processed. Right to file complaints with regulatory authorities If there has been a breach of data protection legislation, the person affected may file a complaint with the competent regulatory authorities. The competent regulatory authority for matters related to data protection legislation is the data protection officer of the German state in which our company is headquartered. A list of data protection officers and their contact details can be found at the following link: https://www.bfdi.bund.de/DE/Infothek/Anschriften_Links/anschriften_links-node.html. Right to data portability You have the right to have data which we process based on your consent or in fulfillment of a contract automatically delivered to yourself or to a third party in a standard, machine-readable format. If you require the direct transfer of data to another responsible party, this will only be done to the extent technically feasible. SSL or TLS encryption This site uses SSL or TLS encryption for security reasons and for the protection of the transmission of confidential content, such as the inquiries you send to us as the site operator. You can recognize an encrypted connection in your browser’s address line when it changes from “http://” to “https://” and the lock icon is displayed in your browser’s address bar. If SSL or TLS encryption is activated, the data you transfer to us cannot be read by third parties. Encrypted payments on this website If you enter into a contract which requires you to send us your payment information (e.g. account number for direct debits), we will require this data to process your payment. Payment transactions using common means of payment (Visa/MasterCard, direct debit) are only made via encrypted SSL or TLS connections. You can recognize an encrypted connection in your browser’s address line when it changes from “http://” to “https://” and the lock icon in your browser line is visible. In the case of encrypted communication, any payment details you submit to us cannot be read by third parties. Information, blocking, deletion As permitted by law, you have the right to be provided at any time with information free of charge about any of your personal data that is stored as well as its origin, the recipient and the purpose for which it has been processed. You also have the right to have this data corrected, blocked or deleted. You can contact us at any time using the address given in our legal notice if you have further questions on the topic of personal data. Opposition to promotional emails We hereby expressly prohibit the use of contact data published in the context of website legal notice requirements with regard to sending promotional and informational materials not expressly requested. The website operator reserves the right to take specific legal action if unsolicited advertising material, such as email spam, is received. 3. Data collection on our website Cookies Some of our web pages use cookies. Cookies do not harm your computer and do not contain any viruses. Cookies help make our website more user-friendly, efficient, and secure. Cookies are small text files that are stored on your computer and saved by your browser. Most of the cookies we use are so-called “session cookies.” They are automatically deleted after your visit. Other cookies remain in your device’s memory until you delete them. These cookies make it possible to recognize your browser when you next visit the site. You can configure your browser to inform you about the use of cookies so that you can decide on a case-by-case basis whether to accept or reject a cookie. Alternatively, your browser can be configured to automatically accept cookies under certain conditions or to always reject them, or to automatically delete cookies when closing your browser. Disabling cookies may limit the functionality of this website. Cookies which are necessary to allow electronic communications or to provide certain functions you wish to use (such as the shopping cart) are stored pursuant to Art. 6 paragraph 1, letter f of DSGVO. The website operator has a legitimate interest in the storage of cookies to ensure an optimized service provided free of technical errors. If other cookies (such as those used to analyze your surfing behavior) are also stored, they will be treated separately in this privacy policy. Server log files The website provider automatically collects and stores information that your browser automatically transmits to us in “server log files”. These are: Browser type and browser version Operating system used Referrer URL Host name of the accessing computer Time of the server request IP address These data will not be combined with data from other sources. The basis for data processing is Art. 6 (1) (f) DSGVO, which allows the processing of data to fulfill a contract or for measures preliminary to a contract. Contact form Should you send us questions via the contact form, we will collect the data entered on the form, including the contact details you provide, to answer your question and any follow-up questions. We do not share this information without your permission. We will, therefore, process any data you enter onto the contact form only with your consent per Art. 6 (1)(a) DSGVO. You may revoke your consent at any time. An informal email making this request is sufficient. The data processed before we receive your request may still be legally processed. We will retain the data you provide on the contact form until you request its deletion, revoke your consent for its storage, or the purpose for its storage no longer pertains (e.g. after fulfilling your request). Any mandatory statutory provisions, especially those regarding mandatory data retention periods, remain una"
