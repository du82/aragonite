full_description = "We want you! Posted on 25th September 2017 at 18:25:01 We want to extend our team in Tübingen, Germany and are looking for a software developer (m/f) at the earliest date possible. You are looking for a special challenge, are talented and experienced in writing software and are motivated to participate in a growing company? Then this is the right place for you! Your tasks will be: Take part in developing BattlEye anti-cheat software Analysis and reverse-engineering of cheat programs Development of detection algorithms Integration of BattlEye into games Maintenance of BattlEye in cooperation with game developers We expect: Degree in computer science or equivalent qualification or own completed projects Deep knowledge of the programming language C/C++ Advanced knowledge of Windows operating systems Basic knowledge of x86/x64 assembler, debugging and reverse-engineering of software Willingness to learn new techologies, programming languages and development environments Sophisticated analytical skills, high comprehension and understanding of complex connections Independent, elaborate, structured and goal-oriented approach to work Good English skills and precise articulateness Interested? Then we are looking forward to your application! Please send all of your documents (application letter, CV, qualifications, salary expectation and earliest possible date of entry) via email to [email protected] and refer to this job advertisement."
