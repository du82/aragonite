title = "Bay 12 Games: WWI Medic"
full_description = "The Game (~1.6 MB), v1.03 posted 2/28/04. Unzip it and play! Requires Windows 98+, OpenGL and a decent graphics card. PARTIAL SOURCE. You'll need an implementation of the STL vector, OpenGL files, and the FMOD library (fmod.org) to use these files. It'll probably take some mucking around as well, as it is poorly commented. Good luck!"
