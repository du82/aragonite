title = "Oscars 2025 predictions: Who will win - and who should?"
description = "In one of the most exciting and dramatic awards seasons ever, the field is wide open in several fields. Here are the BBC film critics' expert predictions."
full_description = '''Oscars 2025 predictions: Who will win - and who should?20 hours agoShareSaveNicholas Barber and Caryn JamesShareSaveA24/ Alamy/ TIFF/ MUBI(Credit: A24/ Alamy/ TIFF/ MUBI)In one of the most exciting and dramatic awards seasons ever, the field is wide open in several fields. BBC film critics give their expert predictions for the major Academy Awards categories.TIFFAnora (Credit: TIFF)1. Best pictureCaryn James: It has been a fun awards season, watching the nominees for best picture pinball around. Anora became the early favourite as the brash young voice of the future, until the bonkers Emilia Pérez became the Oscar darling for a minute, then Conclave had its moment as the smart mainstream choice, until The Brutalist announced itself as the epic with artistic ambitions until... full circle, Anora is the frontrunner again. It says a lot about the strength and variety of films this year that such mayhem could happen at all. Anora – funny, original and a little bit heartbreaking – is the likely winner. And among the realistic choices (six of the nominees might as well be category filler, and Karla Soíia Gascón's unearthed offensive tweets shattered Emilia's chances), Anora should win. But lurking in the background is Conclave, which could win by consensus, given that voters rank their choices in this category. Simplistic scenario: votes for the top film are so scattered that Conclave finally gets the most votes because it's everybody's second choice. Plus, it really is a satisfying political thriller that happens to be set in the Vatican, and its Bafta and SAG awards are a sign of real support. In a year that has had so many frontrunners, a Conclave win is entirely plausible.Nicholas Barber: This time last year, Oppenheimer was firm favourite to win the Oscar for best picture – and plenty more besides. This year, things aren't so simple. What we can say, judging by all the other awards ceremonies that have been and gone this year, is that Dune: Part Two, Emilia Pérez, I'm Still Here, Nickel Boys, The Substance and Wicked are vanishingly unlikely to take home the biggest prize of the night. None of them has whipped up the enthusiasm that's required from both the public and the critics. That leaves us with Anora, The Brutalist, A Complete Unknown and Conclave – and over the last few weeks I've wavered between all four of them as the most likely best picture winner. As I write, Anora seems to be the favourite, and I can understand why. It's a film about contemporary American life made by an American auteur, and it balances uncompromising grittiness with exuberant, crowd-pleasing flair. In a year when arguments could be made for and against so many contenders, Anora has come to feel like the choice that could please everyone, so it may well complete the journey it began when it won the Palme d'Or at the Cannes Film Festival last May.Getty ImagesSean Baker (Credit: Getty Images)2. Best directorNicholas Barber: This is a strong category, but I doubt that the Academy's voters will go for a French director who was largely unknown in the US before she made The Substance, so Coralie Fargeat is out. The various Emilia Pérez backlashes have hurt Jacques Audiard's chances, and A Complete Unknown hasn't received much praise for its directing as such, so James Mangold is a long shot, too. That means that the best director Oscar will either go to Sean Baker, for the verve and naturalism he brings to Anora, or to Brady Corbet, for the valiant artistic vision of The Brutalist. But the amiable Baker has made several excellent films that haven't garnered many awards, including Tangerine and The Florida Project, so I suspect that he will be the Academy's choice.Caryn James: This race comes down to a stark contrast, between Sean Baker, whose Anora is a beautifully orchestrated contemporary romp, and Brady Corbet, whose The Brutalist wilfully announces its ambition as the kind of film they don't make anymore, an historical epic complete with intermission. It's a good guess that Baker is likely to triumph, because he won the Directors Guild Award and the film won the Producers Guild award, two major predictors of the Oscars. And he should win. He made Anora feel effortless, but beneath that apparent ease is some masterful work, as he navigates the changes in tone – from fairy tale to screwball comedy to drama – that make the film so rich. Coralie Fargeat deserves her place here for her confident direction of The Substance, but it's really a two-man race.A24Adrien Brody in The Brutalist (Credit: A24)3. Best actorCaryn James: Adrian Brody was on his way to making this a done deal, having won every major precursor from the Golden Globe to the Bafta, until Timothée Chalamet got in his way by winning the SAG award for A Complete Unknown. Oscar voting had ended by the time Chalamet won, but as an indicator of how the votes go, SAG has a great track record. You can never underestimate Oscar voters' affection for a biopic, and Chalamet's take on Bob Dylan was a true embodiment of a character as well as a spot-on impersonation. But Brody is still very likely to win, and he should, for his searing performance as a Holocaust refugee. He creates a portrait of a man who is talented and ambitious, sometimes ruthless and sometimes vulnerable, and fully human. But let's acknowledge how strong the category is this year, the rare case where it would be perfectly appropriate for Ralph Fiennes, Colman Domingo or Sebastian Stan to win too.Nicholas Barber: Adrien Brody (The Brutalist) and Timothée Chalamet (A Complete Unknown) are neck and neck, so it's tricky to say which attributes will tempt the Academy more. Will it be pain, anguish and a Hungarian accent, or a nifty impersonation elevated by some expert singing and guitar-picking? Will it be the long-awaited return to greatness of a Hollywood stalwart who has already won an Oscar, or the crowning of a fresh-faced youngster who has nonetheless amassed a tremendous body of work? It could go either way, but Chalamet's Oscar campaigning has been flawless – he has shown himself to be fun-loving and self-mocking, but at recent awards ceremonies, including Sunday's SAG Awards, he has emphasised how seriously he takes a difficult job – so I'm betting on him. My own personal favourite is the wonderfully versatile Ralph Fiennes, who is so quiet and reserved yet so racked by doubt in Conclave – but I doubt that this is his year.MUBIDemi Moore in The Substance (Credit: MUBI)4. Best actressNicholas Barber: OK, so we know that Karla Sofía Gascón isn't going to win – the publicising of her offensive X posts settled that – so that leaves us with Cynthia Erivo for Wicked, Mikey Madison for Anora, Demi Moore for The Substance and Fernanda Torres for I'm Still Here. Both Moore and Torres won Golden Globes for their roles, in a musical / comedy and in a drama respectively, and for most of the time since then, they've been the frontrunners. Madison shook things up when she won the Bafta, so it's now the closest of calls. But I reckon that Moore will win. Partly, that's because of her savagely self-parodying performance as a former A-list star being turned into a monster by the ageist entertainment industry. And partly it's because her comeback narrative, as spelt out in her Golden Globes acceptance speech, would furnish the Academy with the kind of feelgood story it loves so much.Caryn James: Demi Moore has been on an almost steady march toward her first Oscar, marred only by Mikey Madison's Bafta, ever since her pitch-perfect campaign/acceptance speech on winning the Golden Globe for The Substance. Moore checks all the boxes: the story of how Hollywood finally takes her seriously, the insider status and the no-holds-barred performance in a film with a resonant message. She is still the likely winner, but there could be an upset from Madison for her star-making role in Anora, or by Fernanda Torres, who should win. Torres gives a beautifully nuanced, restrained performance in I'm Still Here as a grieving yet determined widow during Brazil's political dictatorship. But Oscars tend to go to screaming, yelling, tearing-down-the-scenery roles, which is what The Substance and Anora call for. A brilliantly subtle performance like Torres's has an uphill battle.Searchlight PicturesKieran Culkin in A Real Pain (Credit: Searchlight Pictures)5. Best supporting actorCaryn James: There's a reason Kieran Culkin has won every major award in this category in the run-up to the Oscars: he really deserves to. His wilfully outrageous, sad and moving character of Benji in A Real Pain may have echoes of his role as Roman Roy in Succession, but it is also funny and affecting on its own, a delicate mix of comedy and tragedy. And it hasn't hurt his chances that every acceptance speech of his is wry, self-deprecating and fun to watch. Some winners make an earnest point of saying "There is no winner" or spreading the praise around, but Culkin has turned acceptances into a stand-up art form. In another year, Edward Norton might have taken the award for his sharply drawn performance as Pete Seeger in A Complete Unknown, but that seems like a very unlikely upset.Nicholas Barber: This year's Oscars are harder to predict than usual, but the best supporting actor category is the exception that proves the rule. Ever since Kieran Culkin won the Golden Globe for his role in A Real Pain in January, he has kept on winning and winning – and now it feels as if there is no point in any of his competitors turning up to the ceremony at all. Even those of us who would argue that Culkin isn't really a supporting actor in the film, but a co-lead with its writer-director, Jesse Eisenberg, have had to accept the inevitable. The only regrettable part of the whole business is that this category is stacked with Oscar-worthy performances, namely Yura Borisov's soft-hearted Russian muscle in Anora, Edward Norton's gentle Pete Seeger in A Complete Unknown, Guy Pearce's bluff tycoon in The Brutalist, and Culkin's old Succession co-star Jeremy Strong as controversial lawyer Roy Cohn in The Apprentice. If they hadn't been up against Culkin, any one of them might have won.NetflixZoe Saldaña in Emilia Pérez (Credit: Netflix)6. Best supporting actressNicholas Barber: For a while it looked as if Zoe Saldaña had this Oscar in the bag. Of course, she isn't really a supporting actress in Emilia Pérez, but one of the leads. As soon as voters put her in this category, though, it seemed to be hers for the taking. Not only does she deliver a fabulous performance that includes energetic song-and-dance numbers, but she is a mainstay of the Marvel and Star Trek cinematic universes, so she has helped Hollywood make zillions of dollars. Then a journalist uncovered Those Social Media Posts. The bigoted remarks made by the other star of Emilia Pérez, Karla Sofía Gascón, stripped the film of much of its goodwill, and Saldaña's hopes were badly damaged in the explosion of recriminations. Oscars observers started wondering: Would Ariana Grande win for Wicked, instead? It's still possible, but Saldana has distanced herself smartly from the scandal, and made emotional speeches at other award ceremonies, including the Baftas and the SAG Awards, so the Academy will probably reward her for her work, rather than punish her for her co-star's opinions.Caryn James: Zoe Saldaña may be the one person to escape unscathed from the Emilia Pérez debacle, and get the Oscar, as she should. She has won every precursor award, and is actually the dynamic centre of the story. Rita, the lawyer who helps the title character to transition and create a new identity, gives Saldaña her richest role yet and she makes the most of it. Rita starts as a fiery, beleaguered small-town lawyer, wrestles with her conscience about being involved with a criminal, and eventually becomes a philanthropist, and Saldaña sings and dances her way through it all with grace and presence. And she had the perfectly crafted answer when first asked about her co-star's offensive tweets, saying she was "saddened". Very well played. Isabella Rossellini makes a huge impact as Sister Agnes in a small role in Conclave, and Monica Barbaro is amazing as she channels Joan Baez in A Complete Unknown, but they can't complete with Saldaña's Rita.Focus FeaturesConclave (Credit: Focus Features)7. Best adapted screenplayCaryn James: Peter Straughan is sure to win for Conclave. He turns Robert Harris's potboiler novel into a sleek, thoughtful screenplay, which is a huge part of what makes the film – pretty talky when you think about it, and not exactly an action movie – so suspenseful and entertaining. Turning that straightforward novel into a faithful screenplay may sound simple, but in fact Straughn's adaptation has a magician's deft touch, taking the best of the story and making it much better. It's great to see that RaMell Ross and Joslyn Barnes's screenplay for Ross's Nickel Boys is nominated. It's a dazzling adaptation of Colson Whitehead's extremely literary novel, but the film hasn't received the kind of major awards traction it would need to compete. The rest of the category is fairly weak. The screenplay is the least of Emilia Pérez, Sing Sing is less about script than performance. And the banal screenplay for the biopic A Complete Unknown shouldn't even have a place in this conversation.Nicholas Barber: Peter Straughan's gripping adaptation of Robert Harris's novel, Conclave, has picked up prizes at the Golden Globes, the Critics' Choice awards, and the Baftas. And when Conclave won best picture at the Baftas, the film's director, Edward Berger, made a point of singing Straughan's praises. Is he unbeatable at this stage? The controversies swirling around Emilia Pérez may have put it out of the running – as adventurous as Jacques Audiard's screenplay is – and there doesn't seem to be much chatter about A Complete Unknown, Nickel Boys and Sing Sing in this category. So, yes, unless there are some Conclave-style shenanigans going on behind closed doors, Straughan should triumph here.Searchlight PicturesA Real Pain (Credit: Searchlight Pictures)8. Best original screenplayNicholas Barber: This is one of this year's toughest categories to predict. September 5 hasn't built any momentum over awards season, but the other four best screenplay nominees – Anora, The Brutalist, A Real Pain, The Substance – are all brilliant in their own distinctive ways, and were all written or co-written by the films' directors. Sean Baker's Anora script won at the WGA Awards; Brady Corbet and Mona Fastvold's The Brutalist was given the prize by two US critics' organisations; Jesse Eisenberg's A Real Pain won at the Baftas, and Coralie Fargeat's The Substance won at Cannes last year. My own preference, in a year of extremely long films, is Eisenberg's precision-engineered screenplay for A Real Pain, because it doesn't waste a scene, or a syllable of dialogue, in a trim 90 minutes. But I t'''
