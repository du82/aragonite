["https://bbc.com/news/articles/cn7vvz4v1ego"]
title = "Lego models of town buildings bring Henley artist 'close to home'"
description = "Kaz Taplin recreates buildings from Henley on Thames that were part of her childhood."
full_description = '''Artist recreates childhood home landmarks in Lego3 days agoShareSaveGalya DimitrovaBBC NewsShareSaveKaz TaplinMrs Taplin said she had received "absolutely amazing" feedback on her workAn artist has been recreating landmarks of her hometown using Lego.Kaz Taplin, who now lives in Australia, has been reconnecting with Henley on Thames in Oxfordshire by creating models of places including Gabriel Machin butchers shop and the town hall.She works off old photographs, as well as new ones she takes when she visits her family.Mrs Taplin said using her memories for the models was "very inspirational" and that it brought her "close to home".Kaz TaplinA childhood favourite - Mrs Taplin says her Bagatelle shop model is "full of toys"She said they had moved 17 years ago from Gainsborough Crescent in Henley to the coastal city of Mandurah in Australia where they built a house."But I go back every few years (...) because family have passed away, so it's to respect that or to see the children (...) and the grandchildren," Mrs Taplin added.The places that she chose to build Lego models of are "part of our childhood"."Mum used to take us to the shops and pick up stuff, I've done a Bagatelle toy shop that's full of toys," she said."The library used to be in the town hall, so we used to go and pick up books."Mrs Taplin said the town hall had taken her a week to construct, and the roof had fallen apart in the process."But as I've been doing more and more, it's just [been taking] a few days on and off."She said she is now recreating a Wimpy restaurant."My dad used to take us into the Wimpy on Saturdays to have a burger."I've not quite finished that one yet, but it's very inspirational and close to home."Mrs Taplin said she had received "absolutely amazing" feedback on her work."I didn't think it would be like this. I'm just doing it because I like my hometown."The models are currently displayed on a shelf in one of her spare rooms.Mrs Taplin said she had also completed commissioned paintings of other local landmarks such as the Henley Villa.Kaz TaplinThe Machin butchers shop, which has been a Henley favourite since 1910, is another one that inspired Mrs TaplinYou can follow BBC Oxfordshire on Facebook, X, or Instagram. More from the BBC'I've spent more than £3,000 on Jellycats''It's definitely not just about building models'Lego models of famous shipwrecks to go on displayRelated LinksHenley Town HallLegoLegoArtHenley on ThamesAustralia'''
