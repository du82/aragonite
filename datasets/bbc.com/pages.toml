full_description = '''BusinessIn the US, DEI is under attack. But under a different name, it might live onDonald Trump has promised to "terminate" diversity programmes. But a rebrand might yet save them.3 hrs agoBBC InDepthUS judge says mass firings of some federal workers likely illegalThousands of workers have been fired by the Trump administration as part of its effort to slash the federal workforce.2 days agoUS & CanadaWorld of BusinessGain the leading edge with global insights for the boardroom and beyond, in your inbox every Wednesday.UK-US trade deal could mean tariffs 'not necessary', says TrumpThe US president says a trade deal could happen very quickly and avoid taxes on UK imports.2 days agoPoliticsAnalysis: Any Starmer deal with Trump is all about avoiding tariffsA deal to avoid further trade barriers appears very much on the cards, but challenges remain.2 days agoBusinessUS judge says mass firings of some federal workers likely illegalThousands of workers have been fired by the Trump administration as part of its effort to slash the federal workforce.2 days agoUS & CanadaWhat we know about US-Ukraine minerals dealThe White House said the deal, which would give the US access to mineral deposits, was not signed on Friday.1 day agoWorldDeal to buy Prince Andrew's business unravelsA financial lifeline for Prince Andrew from the sale of Pitch@Palace seems unlikely to go ahead.20 hrs agoUKMicrosoft announces Skype will close in MayThe internet chat and phone service, which is owned by Microsoft, made the announcement on X.1 day agoTechnologyWorld of BusinessGain the leading edge with global insights for the boardroom and beyond, in your inbox every Wednesday.Analysis Cook Islands China deal riles allies as West's grip loosensThe recent spree of deals between the two is upsetting traditional allies wary of Beijing. 2 days agoWorldBP shareholders want it to make money, not climate policyThe oil and gas producer faces criticism for its shift away from green ener