["https://bbc.com/news/articles/cg4k137ezlgo"]
title = "Keir Starmer gives Volodymyr Zelensky 'full backing' in warm No 10 welcome"
description = "A £2.26bn loan was signed during Zelensky's visit to London, which came ahead of a summit on ending the war in Ukraine."
full_description = '''Starmer gives Zelensky 'full backing' in warm No 10 welcome6 hours agoShareSaveTom McArthurBBC NewsShareSaveWatch: Zelensky meets Starmer at Downing StreetSir Keir Starmer has told Volodymyr Zelensky he has "full backing across the United Kingdom" as the two met in Downing Street.The Ukrainian president told the prime minister he was happy his country had "such friends", after arriving in the UK in the wake of a White House meeting with US President Donald Trump that descended into a row between the two leaders.Zelensky and Sir Keir also signed a £2.26bn loan for Ukrainian military supplies, that will be repaid using profits from frozen Russian assets.After Saturday's meeting, Sir Keir spoke with Trump, and French President Emmanuel Macron.The prime minister will host a summit of European leaders in London on Sunday on efforts to bring the Russia-Ukraine war to an end, as well as wider European defence, while Zelensky will also meet King Charles III.Colossal stakes for Starmer's summit on UkraineHow much has the US given to Ukraine?How the Trump-Zelensky talks collapsed in 10 fiery minutesVance took the lead attacking Zelensky. Why?How Zelensky's clothing choice may have fuelled Oval Office spatThose meetings will now be overshadowed by events in Washington and concerns about a hardening of relations with the US.In recent weeks, the prime minister has sought to cast himself as a bridge between the US and Europe as it adapts to the Trump administration's desire to be less involved in European defence, having a cordial meeting with Trump a day before Zelensky's.During that meeting, he hand-delivered a letter from the King inviting Trump - who is fond of the Royal Family - to an unprecedented second state visit, which SNP MPs called on the PM to withdraw following the Oval Office spat.Sir Keir has also attempted to be a conduit for Ukraine as it seeks US security guarantees in any peace deal - contacting both Trump and Zelensky by phone on Friday evening in the aftermath of their row.The visit to Downing Street on Saturday was an opportunity for the PM to demonstrate his continued support for Zelensky following the public falling-out with Trump.Remarking on cheers he heard outside, Sir Keir told the Ukrainian leader: "That is the people of the United Kingdom coming out to demonstrate how much they support you, how much they support Ukraine."He added: "We stand with you and Ukraine for as long as it may take."Zelensky replied: "I saw a lot of people and I want to thank you, the people of the United Kingdom, [for] such big support from the very beginning of this war."He said he was happy about meeting the King on Sunday, and was thankful for the European summit.It is understood the meeting between Zelensky and the King was requested by the Ukrainian president, with the UK government agreeing to it.Following the Downing Street meeting, Zelensky praised the UK's "tremendous" support, noting in particular the £2.26bn loan paid for through Russian assets frozen since the war began.He said the funds will be used to produce weapons in Ukraine, declaring: "This is true justice - the one who started the war must be the one to pay."The loan was first announced in October.Watch: Starmer meets Zelensky in Downing StreetFollowing the acrimonious White House visit, Zelensky has attempted to mend US ties.In a statement, he said of Trump: "Despite the tough dialogue, we remain strategic partners. But we need to be honest and direct with each other to truly understand our shared goals."When his plane landed at Stansted, the Ukrainian leader wrote in a string of social media posts: "It's crucial for us to have President Trump's support. He wants to end the war, but no one wants peace more than we do."We are the ones living this war in Ukraine. It's a fight for our freedom, for our very survival."Sunday's summit in London is the latest round of top-level European meetings in response to Washington's new approach to ending the war in Ukraine, which began with Russia's full-scale invasion just over three years ago.The Trump administration has so far excluded Europe from preliminary talks with Russia, while the president has been accused of parroting Russian propaganda.Top of the agenda on Sunday will be increasing Europe's defence capabilities as the US steps back, as well as seeking security guarantees for Ukraine from the White House as part of any peace deal.Ahead of the last summit in Paris, Sir Keir proposed deploying British troops to Ukraine as part of a European peacekeeping force - but said this would require a US security "backstop".Trump has consistently resisted fully committing direct military support to a Ukraine peace deal, but has offered closer economic ties including a minerals deal, which he said could act as a deterrent.Since Friday's row, media reports from the US suggest Trump is considering cutting off aid to Ukraine altogether.At the same time, European leaders have recognised the need to increase defence spending - but experts have warned the UK's military was currently not ready to take on an expanded defence role.Watch: From laughter to anger, how the Oval Office meeting spiralledOn Sunday, Sir Keir and Zelensky will be joined by the leaders of France, Germany and Poland, the heads of the European Commission and European Council, and Nato's secretary general.A special European Commission defence package will be announced on 6 March, according to Polish Prime Minister Donald Tusk. The Oval Office spat prompted European allies to mount a spirited defence of the embattled Ukrainian president.While diplomatic efforts to bring the war to a close continue, fighting rages on. Seven people were injured in an overnight drone attack on the north-eastern city of Kharkiv.Ukraine's state emergency service said 64 people - most of them patients - were evacuated from a three-storey medical facility that caught fire after being hit by a drone.In Russia, the country's defence ministry reported 48 Ukrainian drones had been "intercepted and destroyed" overnight.More on this storyMost Republicans laud Trump after Zelensky showdown, but some express dismayJeremy Bowen: Trump-Zelensky row signals looming crisis between Europe and USWhat it was like in the room during Oval Office shouting matchWar in UkraineVolodymyr ZelenskyKeir Starmer'''
