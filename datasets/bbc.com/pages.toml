["https://bbc.com/audio/play/w3ct5yfy"]
title = "BBC Audio | Witness History | Africa’s stolen Metis children"
description = "In 1953, Marie-José Loshi was forcibly taken from her family because of her skin colour"
full_description = "Witness HistoryWitness HistoryAfrica’s stolen Metis childrenSaveSaveShareFebruary 28, 202510 minutesAvailable for over a yearIn 1953, in what was then the Belgian Congo, four-year-old Marie-José Loshi was forcibly removed from her family’s village and taken more than 600km away to live in a Catholic institute.The cause of her kidnapping was the colour of her skin. Under Belgium’s colonial rule, thousands of mixed-race children were taken from their homes and separated from their families. The state hoped the actions would quash any sense of revolt against the colony.More than 70 years later, Marie-José and four other women took on the former colonial power, seeking justice for themselves and the many other mixed-race children that suffered the same fate. She speaks to Kaine Pieri.Eye-witness accounts brought to life by archive. Witness History is for those fascinated by the past. We take you to the events that have shaped our world through the eyes of the people who were there. For nine minutes every day, we take you back in time and all over the world, to examine wars, coups, scientific discoveries, cultural moments and much more.Recent episodes explore everything from football in Brazil, the history of the ‘Indian Titanic’ and the invention of air fryers, to Public Enemy’s Fight The Power, subway art and the political crisis in Georgia. We look at the lives of some of the most famous leaders, artists, scientists and personalities in history, including: visionary architect Antoni Gaudi and the design of the Sagrada Familia; Michael Jordan and his bespoke Nike trainers; Princess Diana at the Taj Mahal; and Görel Hanser, manager of legendary Swedish pop band Abba on the influence they’ve had on the music industry. You can learn all about fascinating and surprising stories, such as the time an Iraqi journalist hurled his shoes at the President of the United States in protest of America’s occupation of Iraq; the creation of the Hollywood commercial that changed advertising forever; and the ascent of the first Aboriginal MP.(Photo: Marie-José Loshi. Credit: Marie-José Loshi)See more episodesProgramme website"
