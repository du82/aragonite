["https://bbc.com/news/articles/c36w7e4kglzo"]
title = "Pilates, painting and bike rides: Gene Hackman's life in Santa Fe"
description = "After leaving Hollywood, Gene Hackman retired in Santa Fe, New Mexico, where he became a fixture in the community."
full_description = '''Pilates, painting and bike rides: Gene Hackman's life in Santa Fe17 hours agoShareSaveSamantha GranvilleBBC NewsReporting fromSante Fe, New MexicoShareSaveGetty ImagesKnown for his roles as gunslingers and cowboys, Gene Hackman spent his retirement in the small southwestern city of Santa Fe, New MexicoGene Hackman was a normal person in Santa Fe. And he really loved that.Residents in the New Mexico city say they were excited to welcome such a massive celebrity to the community when he and his wife Betsy Arakawa arrived more than 20 years ago, but they treated him like anyone else."He wasn't famous here" was the phrase I heard when asking residents about why the movie star chose to call New Mexico's capital home. They describe a down-to-earth, chatty man who supported local businesses and enjoyed its flourishing arts scene.Everyone here has a story to tell about Hackman, who was found dead alongside his wife and their dog at their home in the quiet desert city earlier this week. 'You didn't realize that you were talking to a celebrity'Hackman was a lover of the arts and a painter himself, so he fit in well: Santa Fe is known for its iconic adobe architecture and is home to more than 250 galleries.Everything in Santa Fe is colourful, from the woven tapestry hanging on shop walls to the clothes people wear and even their personalities.There are murals in almost every alley and metal street art lining the roads. Hackman immediately got involved with local art museums, most notably sitting on the board of directors at the Georgia O'Keeffe museum, while Arakawa had a luxury home-goods store, and collaborated with artists on various projects.Hackman's paintings are displayed prominently at local restaurants, and there are a few lucky residents who have them hanging in their home.One of those people is Stuart Ashman, the executive director of the Artes de Cuba gallery.Santa Fe is home to more than 200 art galleries Mr Ashman first met Hackman at a community arts meeting. He was running late and there was one seat left when he arrived: next to the Hollywood star.They shook hands and that started two decades of friendship."He was so down to earth that you didn't realize that you were talking to a celebrity. He was more interested in you than in telling you about himself," Mr Ashman said.While both men supported the arts community, their real bond came through Pilates workouts when they took back-to-back private lessons.When asked who was better, Mr Ashman laughed. "I think we're both pretty bad," he said. "Our teacher said I was lazy and he was older and stiffer."Stuart Ashman enjoyed two decades of friendship with Gene HackmanMr Ashman said Hackman often got in trouble for being too much of a chatterbox."Gene, are you going to workout or do you just want to talk to Stuart today?" Mr Ashman recalls their Pilates teacher asking.Every week, Mr Ashman, who raised chickens, would bring a dozen eggs to Hackman. Then one day, he showed up with a huge landscape painting as repayment to Mr Ashman, who didn't want to accept it. But Hackman insisted and said a painting for eggs is "a very fair deal". When Hackman wasn't at Pilates or riding his bike through the beautiful landscape, he loved to spend time at his home in the hills above the city, his friends said.UGCGene Hackman at a painting class in Santa Fe in the 1980sPerched on a 12-acre plot, the property has panoramic views of the surrounding mountains, with vistas stretching as far as Colorado.Hackman purchased the home in the 1980s before starting expansive renovations. He wanted this home to have meaning, so he worked with an architect to blend Pueblo, Colonial, and Spanish Baroque architectural styles to pay homage to Santa Fe's rich cultural history.Arakawa also enjoyed her secluded life in Santa Fe. People I spoke to said she was a talented pianist and smart business woman. The only person who liked working out more than Hackman was Betsy. They said she was in incredible shape, always attending exercise classes. The view into Santa Fe from Hackman's estateThough Hackman was an active member of the community for most of his post-Hollywood years, he became much more isolated after Covid-19 lockdowns, locals said.Those who knew him speculate his health and age made mobility too difficult to wander down the hill into town.But everyone still had a story about Hackman.James Roybal, a native of Santa Fe, once signed up for a pastel painting class in the 1980s and when he arrived Hackman was also there.They painted next to each other for a bit, making small talk.Mr Roybal couldn't believe the celebrity would want to be there. He took a picture from a ways back because he didn't think anyone would believe him. He still boasts about the image.Victoria Murphy posing with a landscape paintingVictoria Murphy, a real estate agent and actress, saw him around town on several occasions."I was in the middle of the street as I was crossing in the crosswalk, and he started to go through the stop sign at that time, and then suddenly saw me stopped, waved, smiled, held up both hands, you know, like in a surrender," she recalled. "And I just smiled and kept going."At a local restaurant in town, customers told me they'd see him at the grocery store, or shopping on the high street. David, the general manager of a shop in downtown Santa Fe where Hackman was a long-time patron, was holding back tears, remembering his friend and client."Since he lived here, he wanted to use his money towards the local people. He always bought Seiko watches from my store for his friends and family. "He invested in local restaurants and grocery stores, and showed up to openings for art museums. It obviously wasn't because he needed the money, but because he loved the local flare," he said."We lost a great Santa Fein."Death of Hackman and wife 'suspicious enough' for investigation, police sayWhat we know about the deaths of Gene Hackman and his wife Gene Hackman's daughters and Clint Eastwood lead tributes to starNew MexicoUnited States'''
