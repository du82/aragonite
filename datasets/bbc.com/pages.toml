["https://bbc.com/news/articles/c78ee414g4eo"]
title = "Double-side Cedric Morris painting auctioned for £162,500"
description = "The auctioneer says it confirms works by East Anglian painter Cedric Morris are much sought-after."
full_description = '''Artist's double-sided painting fetches £162,5002 days agoShareSaveHarriet HeywoodBBC News, East of EnglandShareSaveCedric MorrisThe painting (front side shown) was initially estimated to sell for £30,000 to £50,000A two-sided painting by a renowned East Anglian artist has sold at auction for more than three times its estimated sale price.Cambridge-based auctioneers Cheffins said the Cedric Morris artwork, which had never been sold on the open market before, fetched £162,500 and showed the artist's "continued popularity".Morris (1889-1982), who founded the East Anglian School of Painting & Drawing in Essex before moving it to Suffolk, was believed to have finished the artwork in the 1930s before gifting it to his student, Bettina Shaw-Lawrence.The oil on canvas, which featured a floral landscape on one side and rural building on the reverse, was sold to a London-based bidder on Thursday.Cedric MorrisOn the reverse of the painting is a view of a Welsh cottage The auction was the first time the painting had been available on the open market and the sale estimate was set at £30,000-£50,000.It followed Cheffins' previous auction of another Morris which had been gifted to fellow artist Lucy Harwoodwork.The other side depicted outbuildings at the art school at Benton End, near Hadleigh in Suffolk, which had relocated from Dedham in Essex after a fire.Morris ran the private art school with fellow painter Arthur Lett-Haines. Aldeburgh Scallop sculptor Maggi Hambling was one of their pupils.Brett Tryner, a director at Cheffins said: "This is an excellent result and demonstrates Morris's continued popularity as one of the most sought-after artists in the post-modern era. "The paintings enviable provenance, having been gifted directly by Morris to Bettina Shaw-Lawrence, helped to ensure this painting had some serious pre-sale interest, with inquiries from both private buyers and institutions the world over. "Perfectly demonstrating the period in Morris's career when he produced some of his most wonderful still-life pictures, this painting was unusual to have firstly been fresh-to-market, but also to have another view painted on the reverse."The landscape paintings were given to Cheffins to auction by the Shaw-Lawrence family.Mr Tryner said Bettina Shaw-Lawrence had been a well-regarded artist herself and initially attended art classes by the painter Fernand Léger in 1938.Follow East of England news on X, Instagram and Facebook: BBC Cambridgeshire, BBC Essex or BBC Suffolk.More like this storyCedric Morris works going under the hammerFilm celebrates 'ferocious' artist as she turns 75Surgeon's art collection to go under the hammerHambling unveils 75th birthday lockdown worksRelated internet linksBBC Radio 3: Free Thinking talks to Hambling about Cedric MorrisCheffinsDedhamPaintingCambridgeHadleighAuctions'''
