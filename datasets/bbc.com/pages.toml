title = "BBC Audio | Desert Island Discs | Gloria Steinem"
description = "Kirsty Young interviews feminist, writer and activist Gloria Steinem."
full_description = '''Desert Island DiscsDesert Island DiscsGloria SteinemUp nextJohn TimpsonTom Hanks, actorInga BealeBerry GordyProfessor Louise RichardsonDavid NottWarwick DavisBarrie RutterSara KhanMatthew BarzunNicole FarhiLevi RootsProfessor Dame Ann DowlingJilly CooperMichael HeathNadiya HussainJoyce DiDonatoChristiane AmanpourStephen HoughDr Robert LangerJackie KayMichael BubléAli SmithYotam OttolenghiNicola AdamsEmma BridgewaterSir Philip CravenDavina McCallBruce SpringsteenGareth MaloneSaveSaveShareMarch 20, 201636 minutesAvailable for over a yearKirsty Young's castaway is the writer, feminist & activist, Gloria Steinem.At the forefront of the second wave of feminism, she came to prominence after publishing an article entitled "After Black Power, Women's Liberation" in 1969. Two years later she co-founded the feminist magazine Ms. As an activist, she has spent much of her life travelling, giving talks and lecturing.Born in 1934 in Ohio, her father was a businessman who ran a lake-side resort in the summer and packed up his family at the first sign of frost to travel cross-country in a caravan selling antiques. Her mother had been a newspaper journalist and later suffered a nervous breakdown before Gloria was born. She became her mother's sole carer aged eleven when her parents divorced. It was only following their separation, having settled down in a house in Toledo, that she spent her first full year at school.After high school, she read politics and government and then traveled around India for two years on a fellowship. On her return, she established herself as a writer in 1960s New York and co-founded Ms. magazine in 1971. Since then, her writing has appeared in innumerable magazines, newspapers, anthologies, television commentaries, political campaigns, and film documentaries in America and internationally. In 2013 she was awarded a Presidential Medal of Freedom, the United States' highest honour, by Barack Obama.Producer: Cathy Drysdale.See more episodesProgramme website'''
