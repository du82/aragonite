["https://bbc.com/news/articles/c0rz8k91q8jo"]
title = "Legacy of Archibald Knox celebrated on Isle of Man stamp set"
description = "The 10 stamp collection features some of the renowned Manx born artist and designer's works."
full_description = '''Legacy of Archibald Knox celebrated on stamp set21 hours agoShareSaveRebecca BrahdeBBC News, Isle of ManShareSaveIOMPOThe collection is in conjunction with an exhibition celebrating Knox later this yearThe legacy of renowned artist and designer Archibald Knox has been celebrated on a new set of stamps.The 10-piece collection has been created in conjunction with a major exhibition of the Manx born with artist at the Manx Museum from 5 April.The set features examples of Knox's metalwork, jewellery, paintings, household accessories and other designs.General manager of Isle of Man Stamps and Coins Maxine Cannon said the collection served as a "tribute to his remarkable talent".The artist designed for Liberty of London and established himself at the forefront of the English art nouveau movement at the turn of the 20th Century.IOMPOThe stamp collection features many of Knox's Celtic inspired designedThe set features imagery from the Manx National Heritage Collection, the Peartree Collection, as well as private collections.Some of those items will feature in the exhibition Knox: Order & Beauty, which is the set to be the largest ever display of his works.The display explores Knox's artistic journey, his connection to the Isle of Man, and his pioneering role in modern design, and will showcase more than 200 pieces from collections across the British Isles.Curator Katie King said the stamp collection "brings together some of Knox's most iconic works and reminds us of the enduring beauty and relevance of his designs".Managing Director of the Archibald Knox Forum Chris Hobdell, which is putting the exhibition together in conjunction with Manx National Heritage, said the set of stamps offered a "glimpse into the depth and diversity of his work". He said the collection would allow people to "learn more about this remarkable designer" ahead of April's opening of the year-long display.Read more stories from the Isle of Man on the BBC, watch BBC North West Tonight on BBC iPlayer and follow BBC Isle of Man on Facebook and X.More like this storyLargest ever Knox art display set for next yearTrail celebrating Archibald Knox launched'Biggest ever' Archibald Knox exhibition plannedArt nouveau great receives island honourhttps://www.bbc.co.uk/news/world-europe-isle-of-man-45750563Related internet linksIsle of Man Post OfficeManx National HeritageArchibald Knox ForumArt'''
