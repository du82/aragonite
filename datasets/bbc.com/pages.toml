["https://bbc.com/audio/play/m001stn6"]
title = "BBC Audio | Desert Island Discs | Dr Nicola Fox, head of science at Nasa"
description = "Nicola Fox, Nasa's head of science, shares the soundtrack of her life with Lauren Laverne."
full_description = "Desert Island DiscsDesert Island DiscsDr Nicola Fox, head of science at NasaUp nextMarina Abramović, performance artistShirley Ballas, dance judgeGreta Gerwig, writer and directorDelia Smith, CH, CBE, cookery writer and broadcasterGraham Nash, musicianGuli Francis-Dehqani, Church of England BishopSheku Kanneh-Mason, cellistJamie Dornan, actorVal Wilmer, writer and photographerCillian Murphy, actorClive Oppenheimer, volcanologistSandy Powell, costume designerRita Rae, Lady Rae, lawyer and judgeJames Graham, playwrightJenny Sealey, theatre directorProfessor Alice Roberts, scientist and broadcasterProfessor Tim Spector, scientistGreg Davies, comedianDame Sarah Storey, athleteJohn Boyne, writerRebel Wilson, actorShirine Khoury-Haq, businesswomanClive Myrie, journalistAnthony Joshua, boxerProfessor Patricia Wiltshire, forensic scientistRob Delaney, actor and comedianErrollyn Wallen, composerDavid Nicholls, writerSarah Raven, gardener and writerMark Knopfler, musicianSaveSaveShareNovember 26, 202337 minutesAvailable for over a yearDr Nicky Fox is only the second woman to hold the post of Head of Science at NASA since the agency was founded in 1958. She has responsibility for around a hundred missions which are investigating the mysteries of outer space. These missions are tackling questions such as how do hurricanes form and are we alone in the universe.Nicky was born in Hitchin in Hertfordshire and her father introduced her to the wonders of space when she was just a few months old. In 1969 he lifted her out of her cot to watch the television coverage of the Apollo 11 mission when Neil Armstrong walked on the moon. Nicky’s enduring fascination with the cosmos led her to study physics at Imperial College in London.After completing her PhD she took up a post-doctoral fellowship at NASA’s Goddard Space Flight Centre in Maryland. In 2010 she became the project scientist for the Parker Solar Probe, humanity’s first mission to a star, which launched in 2018 and is still flying through the sun’s atmosphere collecting data. Recently she oversaw the Osiris-Rex mission which brought back the first asteroid samples from deep space.In 2021 Nicky was awarded the American Astronautical Society’s Carl Sagan Memorial Award for her leadership in the field of Heliophysics.DISC ONE: The Best – Tina TurnerDISC TWO: Livin’ On A Prayer - Bon JoviDISC THREE: Lara’s Theme - MGM Studio Orchestra, composed and conducted by Maurice JarreDISC FOUR: Danny Boy - Andy WilliamsDISC FIVE: When You Know - Shawn ColvinDISC SIX: (Reach Up for the) Sunrise - Duran DuranDISC SEVEN: Boulevard of Broken Dreams - Green DayDISC EIGHT: Canyon Moon - Harry StylesBOOK CHOICE: Pale Blue Dot by Carl SaganLUXURY ITEM: LegoCASTAWAY'S FAVOURITE: Boulevard of Broken Dreams - Green DayPresenter Lauren LaverneProducer Paula McGinleySee more episodesProgramme website"
