full_description = "The Global StoryThe Global StoryThe scandal sinking an Oscars campaignSaveSaveShareFebruary 28, 202524 minutesAvailable for over a yearEmilia Pérez is the most talked-about movie of awards season. But despite a divisive premise about a Mexican drug boss seeking gender affirming surgery, it's the fallout off-screen which is causing controversy. The re-emergence of offensive tweets by its lead star, trans actress Karla Sofía Gascón, has derailed the movie's momentum. After promoters pivoted to remove her from marketing, the film has still seen significant success, but ahead of the Oscars, debate is growing about the extent to which this scandal has harmed its performance.Lucy Hockings is joined by BBC culture reporter Noor Nanji and Matthew Belloni, entertainment journalist and founder of the digital media platform, Puck. They dissect the noise around the movie, and consider what Academy voters might be thinking.The Global Story brings you trusted insights from BBC journalists worldwide. We want your ideas, stories and experiences to help us understand and tell #TheGlobalStory. Email us at theglobalstory@bbc.com You can also message us or leave a voice note via WhatsApp on +44 330 123 9480.(Photo: Composite image of Karla Sofía Gascón, Credit: Mario Anzuoni/Reuters, and Academy Awards statuette, Credit: Caroline Brehman/EPA)Producers: Laurie Kalus and Tom KavanaghSound engineers: Phil Bull and James PiperAssistant editor: Sergi Forcada FreixasSenior news editor: China CollinsSee more episodesProgramme website"
