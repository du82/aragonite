full_description = "History's HeroesHistory's Secret Heroes: Series 213. Christine Granville: The Spy Who Skied In from the ColdUp next14. The Unbreakable Navajo Code15. Josefina Guerrero: The Maid of Manila16. Raymond Gureme: Escape Artist17. Charles Drew and the Blood Bank18. Andrée de Jongh and the Comet Line19. The Enigmatic Emily Anderson20. Manfred Gans and X TroopTrailerNelson Mandela and the Defiance CampaignHistory's Youngest Heroes: 2. The Brief Reign of Lady JaneHistory's Youngest Heroes: 3. Grace Darling: Maiden of the SeaHistory's Youngest Heroes: 4. Audrey Hepburn’s Teenage ResistanceHistory's Youngest Heroes: 5. St Francis of Assisi: Teen RebelHistory's Youngest Heroes: 6. Louis Braille: Code MakerThe Visionary Julian of NorwichRani Lakshmi Bai: The Warrior QueenThe Grisly World of Andreas VesaliusVasily Arkhipov and the End of DaysHans and Sophie Scholl and the White RoseTerry Fox’s Marathon of HopeTrailerSaveSaveShareApril 15, 202429 minutesAvailable for over a yearThrill-seeker Christine Granville offers to ski across enemy lines and over the deadly Carpathian mountains, into Nazi-occupied Poland to gather intelligence for the British. Churchill would later call her his favourite spy.Helena Bonham Carter shines a light on extraordinary stories from World War Two. Join her for incredible tales of deception, acts of resistance and courage.A BBC Studios Audio production for BBC Radio 4 and BBC Sounds.Producer: Suniti SomaiyaEdit Producer: Melvin RickarbyAssistant Producer: Lorna ReaderExecutive Producer: Paul SmithWritten by Alex von TunzelmannCommissioning editor for Radio 4: Rhian RobertsSee more episodesProgramme website"
