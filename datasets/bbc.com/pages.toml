["https://bbc.com/news/articles/cpv44ge0483o"]
title = "Berwick Barracks hosts 'living parade' as funding secured"
description = "Footage of local people is being projected on to Berwick Barracks as part of an art project."
full_description = '''Locals projected on to barracks in 'living parade'20 hours agoShareSaveShareSaveMaltings TrustHundreds of local people were filmed for the artworkHistoric barracks are being illuminated to show a "living parade".Event organisers have estimated more than 2,300 people are expected to go and see the artwork at the Berwick Barracks in Northumberland this weekend.It consists of large-scale light projections on the barracks, featuring 600 local people who were filmed walking, dancing or skipping for the project by artist Matthew Rosier.The performance comes as a £4.5m National Lottery Heritage Fund grant was awarded to the Living Barracks project, which aims to "restore and renew" the 18th Century site.Rosier said Berwick Parade had been "so joyful to create." "It features hundreds of local participants, more than anything I've been part of before," he added.Maltings TrustMore than 2,000 people are expected to go and see projections, which feature local peopleThe project to revamp the barracks will see updates to the gallery and cultural space and the relocation of the Berwick Archives.The Parade Ground will also be improved and the remaining empty barracks blocks will be returned to accommodation at a later stage.Plans also include studio spaces for local artists, while work has already started to create a temporary cinema.English HeritageThe barracks date back to the 18th CenturyPlanning permission has been secured, with work expected to start in the summer.Designed by the architect Nicholas Hawksmoor, Berwick's Grade I listed barracks are described by English Heritage, which runs the restoration project, as "the largest and finest built in England".They could house a full regiment of infantry, whose purpose was to deter uprisings."With planning permission now granted we look forward to bringing all parts of the property back into use and creating a vibrant place where heritage, arts and culture can thrive," said Andrea Selley, territory director for the North at English Heritage.The project runs until December 2028.Follow BBC North East on X, Facebook, Nextdoor and Instagram.More on this storyHistoric barracks to host 'living parade' Related internet linksThe Living BarracksEnglish HeritageBerwick-Upon-TweedArt'''
