full_description = "DiscoveryDiscoveryThe Life Scientific: Anne-Marie ImafidonUp nextThe Life Scientific: Harald HaasMetamorphosis: Jumping fleas and mighty mouthpartsMetamorphosis: Drosophila melanogaster, hoverflyMetamorphosis: Blowflies and dazzling disguiseMetamorphosis: Soldier fly and desert beetleThe Evidence: Is the world becoming more allergic?Metamorphosis: Bee brains and the cockroachThe Life Scientific: Deborah GreavesThe Life Scientific: Gideon HendersonThe Life Scientific: Chris BarrattThe Life Scientific: Bahija JallalThe Life Scientific: Paul MurdinThe Life Scientific: Alex AntonelliTooth and Claw: WolverinesTooth and Claw: Great White SharksTooth and Claw: PiranhasTooth and Claw: CheetahsPutting the Mouth Back into the BodyWhen does sitting become bad for health?What's stopping us from exercising in older age?The Life Scientific: Edward WittenThe Life Scientific: Sarah Blaffer HrdyThe Life Scientific: Sarah HarperThe Life Scientific: Sir Michael BerryThe Life Scientific: Cathie SudlowThe Life Scientific: Sir Harry BhadeshiaThe Life Scientific: Mercedes Maroto-ValerThe Life Scientific: Michael WooldridgeUncharted: The returning soldierUncharted: The doctor will see you nowSaveSaveShareAugust 21, 202327 minutesAvailable for over a yearAnne-Marie Imafidon passed her computing A-Level at the age of 11 and by 16, was accepted to the University of Oxford to study Maths and Computer Science.She's used to the 'child prodigy' label that's followed her throughout her career, but that doesn't mean she's had an easy ride.It was a combination of personal experience and the discovery that the number of women working in the STEM sectors - Science, Technology, Engineering and Mathematics - was in free-fall that inspired Anne-Marie to found Stemettes: a not-for-profit social enterprise introducing girls to STEM ideas and careers in fun and accessible ways. It's now in its tenth year and still growing, while Anne-Marie has received an MBE, enjoyed a successful stint as the numbers guru on the TV series Countdown, and is the current President of the British Science Association.In conversation in front of an audience at the UK's 2023 Cheltenham Science Festival, she tells Jim Al-Khalili about her quest for equality and diversity across the scientific community - and explains why she thinks everyone has the potential to be a 'child prodigy', given the right opportunity...(Image: Anne-Marie Imafidon. Credit: Anne-Marie Imafidon)See more episodesProgramme website"
