full_description = "You're Dead to MeYou're Dead To MeAgatha ChristieUp nextMedieval Irish Folklore (Live)Agatha Christie (Radio Edit)The History of Timekeeping (Radio Edit)Zheng Yi Sao (Radio Edit)Ancient Athenian Democracy (Radio Edit)Nell Gwyn (Radio Edit)Medieval Science (Radio Edit)Atlantis (Radio Edit)Leonardo da Vinci - Live (Radio Edit)Hatshepsut (Radio Edit)P.T. Barnum (Radio Edit)Agrippina the Younger (Radio Edit)Ivan The Terrible (Radio Edit)Victorian Bodybuilding (Radio Edit)Medieval Ghost StoriesShakespeareShakespeare (Radio Edit)Christmas with Charles Dickens (Radio Edit)Catherine the GreatThe History of Kung FuThe Bloomsbury GroupPythagorasMadam C.J. WalkerSimón BolívarThe History of BollywoodThe Queen of ShebaThe Inca EmpireEmma of NormandyRamesses the Great (Radio Edit)Old Norse Literature (Radio Edit)SaveSaveShareMay 19, 202356 minutesAvailable for over a yearSue Perkins and Dr Lucy Worsley join Greg Jenner to discuss the life of world-famous novelist, Agatha Christie.Agatha Christie is arguably the greatest ever crime novelist but her work has also permeated film, theatre and television over the past century. Christie also lived during an extraordinary period of modern history. Her life encompassed the end of the Victorian era, the two world wars and ended at the age of 85 in 1976.There was also much more to Christie the person: from unexpected sporting hobbies to a romantic life that had its fair share of heartbreak and harmony; her life off the page is as interesting as her novels are on it.Research by Jessica HoneyWritten by Emma Nagouse, Emmie Rose Price-Goodfellow, Jessica Honey and Greg JennerProduced by Emma Nagouse and Greg JennerAssistant Producer: Emmie Rose Price-GoodfellowProject Management: Isla MatthewsAudio Producer: Steve HankeySee more episodesProgramme website"
