full_description = "Amazing Sport StoriesAmazing Sport StoriesClaressa Shields: Battles beyond boxingSaveSaveShareSeptember 30, 202412 minutesAvailable for over a yearClaressa Shields is a legend of boxing. By the time she turned 25, she had won two Olympic gold medals, and claimed professional world titles in three separate weight divisions. But her glory came after an upbringing filled with trauma. Her home city of Flint, in Michigan, is one of the most deprived in the US; as a child, she lived in poverty, suffering abuse and violence. This is the story of how she overcame horrific obstacles to reach the pinnacle of one of the hardest sports in the world.Audio scenes have been re-created. Let us know what you think #AmazingSportStoriesSee more episodesProgramme website"
