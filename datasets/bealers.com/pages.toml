full_description = "Category: Dev & Systems Fix Virtualbox Symlinks in Guest share on Windows host Sep 17, 2020 — Dev & Systems Note to self In my [[Windows 10 dev environment]] I have a shared folder between the host machine (my laptop) and the guest VM. The ability to create symlinks within the guest is disabled by default in Virtualbox because security. These steps work to fix that. Add this to Vagrantfile Set gitbash to run as… Dear OneNote API dev team Aug 9, 2016 — Dev & Systems, OneNote Hi, I’m only writing this publicly as I don’t know how to get hold of you, and that’s kind of the point. Sure there are many official channels including your website, Uservoice, Stack Overflow and even Twitter, but none of these seem suitable for certain circumstances. If the API goes down, how do we find out… Serious Bash exploit & fix Sep 25, 2014 — Dev & Systems There’s a bash exploit doing the rounds that is drop-everything serious. The short version is that it is: related to how environment variables are processed: trailing code in function definitions was executed, independent of the variable name So, a correctly formed command can be used to execute arbitrary code on an affected system; anything running bash.… Anonymise personal data in a WordPress database Jul 12, 2014 — Dev & Systems Are you about to get a freelancer to work on your existing WordPress site for you or one of your clients? Here’s a simple SQL script you can run against your dev database to randomise all the user information EXCEPT a test login before you send it over to them. It will also set that test… Tip: keep Vagrant guest additions up to date Jul 10, 2014 — Dev & Systems I found a handy plugin this weekend for keeping my PHP development Vagrant VM VirtualBox guest additions in sync: vagrant-vbguest Every time you do a vagrant up it’ll do a check, which might occasionally get annoying if you’re in a hurry, so there’s a config option to disable it on a per-vm basis: Halt all Vagrant/VirtualBox VMs one-liner Jul 7, 2014 — Dev & Systems If you’re using Vagrant to control your dev VMs on a headless server it’s easy to lose track of the number of running machines. Here’s a one-liner to gracefully shut-down all of them to free up some resources. Phonegap Android development environment for Windows Jun 19, 2014 — Dev & Systems Assuming you want to develop HTML5 apps to run on mobile devices using Phonegap/Cordova then the easiest place to start is Android if you’re a Windows user as you don’t need a separate Mac, you don’t even need a device to test on as there’s an emulator. Anyway, I’ve had to do this three times… OneNote API and PHP Apr 30, 2014 — Dev & Systems, OneNote, PHP Recently Microsoft released an API for my brain indexer favourite tool, OneNote. To say I’m excited by the opportunities presented with this API, especially when it has some more features, would be an understatement. What’s really promising is how open the dev team are being about the API’s progress and out how quickly they are rolling new stuff out. The API is… Add item to Windows 8 “Send To” context menu Mar 18, 2014 — Dev & Systems Type: Win + R Type: shell:sendto Copy an app/folder shortcut here. Done. Default changes to Vim Feb 15, 2014 — Dev & Systems Quick post for future reference. Just installed Debian or Ubuntu, need Vim back to what you’re used to? edit /etc/vim/vimrc uncomment add Tabs are now always two spaces and you can actually see the text. Don’t forget to add export EDITOR=vim to .bashrc either. MySQL one-liner to obfuscate live user details Feb 7, 2014 — Dev & Systems Problem: you need to get someone else to set up your web application on another server. Even with a signed NDA it’s not really a good idea to be sending over MySQL dumps containing real people’s details and it is almost certainly against data protection rules. If so, and you need to do it right… Building a PHP development server from scratch May 9, 2013 — Dev & Systems, PHP The other day my dev server completely died, this was rather inconvenient to say the least. 24 hrs later and my new (excellent, very quiet, powerful but only consuming 150w) HP 54L Proliant Microserver was sitting on my desk ready for building. I’ve done a server build so often that I can do it with… Quick access to Windows start-up folder Jan 15, 2013 — Dev & Systems Want to find your Windows start-up folder to add a new shortcut? Win+E then clicking through Computer -> C: -> Users -> AppData -> iforgetwhereitisthesedays /a> too much of a drag? Try: Win+R then type shell:startup I found a huge list here, most are a bit pointless but cialis online I can see a use… Keeping your Dropbox secured Oct 13, 2012 — Dev & Systems I was building a shared work laptop the other day, something that I would primarily use on building sites for system commissioning. As part of the install I had automatically installed Dropbox along with other useful utilities and then suddenly had the thought. “I won’t be the only person using the laptop. All my stuff is on here in Dropbox. Also,… Windows 8, where did Programs go? Sep 22, 2012 — Dev & Systems Just installed Windows 8? Looking for Notepad? Powershell? Windows+R still works, so you could just run the command. Ditto Windows+E to navigate the file system and find it, but in either case that’s not really what you’re after is it?. You want a menu of everything installed, right? You need the search interface. This brings up a… Launchy is awesome Jun 15, 2012 — Dev & Systems Mention Quicksilver and the more techie OSX users out there will wax lyrical about its ease of use and its powerful features. They have a point! Windows has always been a bit rubbish when it comes to the CLI, even adding Powershell isn’t a huge improvement. So, enter stage left Launchy. Launchy is fantastic. It’s… ‘svn add’ one-liner Jan 28, 2012 — Dev & Systems Simple one-liner that I use when I’ve lots of files to add to a subversion repository: Installing bitcoin on Debian ‘squeeze’ Jan 22, 2012 — Crypto, Dev & Systems Instead of being outdoors I geeked out indoors this weekend and amongst other things installed a Bitcoin daemon on a public facing server so I could have a play with the API/RPC features. Below I document the steps I followed as it turned out to be slightly more taxing than the usual apt-get install bitcoind Step 1)… Debugging with PhpED and DBG Jan 20, 2008 — Dev & Systems, PHP As a long-term PhpED user, I’ve always been well aware that I was not making the most of some of the more powerful features of my IDE, particularly the debugging capabilities. Well this week I finally got debugging set-up properly and as per most of my other blog posts I’m listing what I did here… Multiple project Trac set-up Jan 3, 2008 — Dev & Systems I’ve already installed Trac and I now want to be able to set-up multiple projects with the minimum of fuss. My requirements are: The most important job is to get Apache set-up properly. I’m using mod_python so:apt-get install libapache2-mod-python I then set-up a VirtualHost for http://my.trac.url, thus: Note the LocationMatch. From the docs: This will… Vim auto indenting Jan 2, 2008 — Dev & Systems I used to get annoyed when pasting text into a Vim window as each line would indent one more tab than the last line. To fix it I used to add set noautoindent in /etc/vimrc, however this unsurprisingly turns off auto indenting, which is a useful feature for normal typing. Today I came up with… Subversion over ssh Jan 2, 2008 — Dev & Systems My background task over the Christmas holidays was to ensure that I could give read/write access to a subversion repository situated on a machine within our corporate network so that staff or external contractors can access it via the interweb but without me needing to open up additional ports on our firewall. The server running… Installing Trac on Debian etch Jan 1, 2008 — Dev & Systems The following is a no-frills install guide for getting Trac up and running on a Debian ‘etch’ Linux system. The assumption is that you’ve already got mysql and subversion working and have created a subversion repository (tip: apt-get install mysql-server subversion). The first thing that we need to do is install Python, easy_install and the… MySQL replication Dec 30, 2007 — Dev & Systems More brain dumping, this time after setting up MySQL on my test server to replicate offsite as the data on there is becoming important. Both machines are running fully updated and upgraded Debian Etch and MySQL 5 as a Debian package with identical copies of the MySQL databases in /var/lib/mysql/. On the master I: I… Search and replace multiple files with sed Dec 30, 2007 — Dev & Systems Ok, if you ‘do’ Linux, then you’ll probably already know this one. I did, kind of, but had to Google to remind myself of the exact chain of commands. So here I am writing it down so it’s easier to find next time. In my case, I had a load of Apache conf files where… Moving multiple subversion repositories Dec 21, 2007 — Dev & Systems I needed to migrate all of our subversion repositories from an overworked machine onto a new dedicated machine. As I had about 30 repositories to copy over, I didn’t fancy doing each dump -> copy -> create -> import manually, so I came up with the following. Which, amazingly, worked the first time. I’d say… A Blank WordPress Theme Dec 16, 2007 — Dev & Systems, Featured I’ve just uploaded a blank WordPress theme called Naked that I built to assist those (like myself in the past) who have a need to quickly roll-out a WordPress theme with a custom look and feel but may not necessarily have the time to start from scratch. It is purposely very simple and basic, but… Removing DOS linebreaks from your files using Vim Dec 3, 2007 — Dev & Systems This morning I’m debugging an issue on a script that gets cronned every minute. I’ve a shell open on the server and the file in question open using Vim and I notice each line has a trailing ^M…. Aargh the dreaded DOS linebreak. Dusting off my rusty vim-foo I simply do a search and replace… The Bristol Digital Media Scene Sep 28, 2007 — Dev & Systems, Web / Meetups I was in Bristol for a few days earlier this week for Skillswap (which my company sponsored) and the UWE Web Developer Conference; both were excellent events so kudos to Laura and Dan & team respectively. Being at these events and rubbing shoulders with many smart people passionate about their particular corner of our industry… Setting PHP error reporting from a vhost or .htaccess Aug 16, 2007 — Dev & Systems, PHP Here on our dev servers, we turn PHP error reporting full on so we get to know of any issues with our code well before it hits production (where errors are turned off). This does, however, cause problems with older legacy sites that generate reams of warning errors because the developers were slack and –… Symfony’s most popular plugins Aug 15, 2007 — Dev & Systems, PHP Francios a core member of the Symfony team recently blogged about the 20 most popular plugins of the Symfony project based upon page views. That list is: I find it very interesting that the ‘simple’ ones are all in the top 6 with the CMS one – which is very new – already taking up… installing the Symfony plugin sfSimpleCMS Aug 2, 2007 — Dev & Systems I was recently asked if I’d sucessfully got the Symfony plugin sfSimpleCMS working and I’m afraid my answer was no. I had tried briefly when preparing for my talk, but something didn’t work and I carried on with other things. Being reminded of it and having an hour to kill before I head off to… Superb Javascript lectures Jun 3, 2007 — Dev & Systems As someone doing more and more frontend development using javascript I’m trying to shore up my knowledge a bit. For example some of the shortcut syntax I wasn’t sure about and I knew I could do with more backgound on how the language deals with objects. With this is mind I’m half way through Douglas… Things that suck about Mac OS X May 21, 2007 — Dev & Systems I recently bought a Mac, and today was the first day that I only had a Mac on my desk (as I took the Windows PC to use at home). After a week or so of build-up to today, using it more and more, I think I’m turning the corner and whilst I did manage… Updated: PHP Debian development server how-to Apr 16, 2007 — Dev & Systems With the recent release of Debian Etch to stable I’ve updated my aged Building a PHP development server article. In it I finally admit that Apache 2 exists plus I fix an embarrassingly large amount of typos. Hopefully it will be useful to someone. Simple hack to get PHP to install on Etch with Apache 2 Apr 16, 2007 — Dev & Systems I was stuck for a few mins just now when trying to do a ‘make install’ for php 5.2.1. I was getting the following error: apxs:Error: Activation failed for custom /etc/apache2/httpd.conf file.. apxs:Error: At least one `LoadModule’ directive already has to exist.. make: *** [install-sapi] Error 1 As you can see the assumption is that… Debugging Javascript in IE7 Jan 12, 2007 — Dev & Systems Broken Javascript in IE *really* sucks as one gets really obscure error messages and alert(); becomes your only friend, or so I thought. I've recently done quite a lot of javascript DOM work for a site including some AJAX stuff and whilst it was a pleasure to develop in Firefox using Firebug, I'm now getting… Flush the qmail queue Dec 4, 2006 — Dev & Systems My secondary mail server (that runs qmail) had a load of email queued up today that I needed to flush. Googling comes back with people saying run qmail with daemontools then you can use on of the nice qmailctl scripts to do a 'doqueue'. Needless to say I'm not running with daemontools (my primary is),… Display PNGs with Alpha Transparency in IE6 Dec 1, 2006 — Dev & Systems I've been working on a site that'll be launching in the new year that contains its share of contemporary web technologies (look, roll your eyes if you want but I managed to avoid the W2 word); it also has its fair share of subtle drop shadows which have to work over a stripy background. Initially… Symfony and AJAX Nov 19, 2006 — Dev & Systems I've been playing with the AJAX support in Symfony this weekend and I'm blown away by how easy it is. Today I put together a detailed/summary view switcher for a list of items coming from a database with a (script.aculo.us) fade in/out effect and I didn't need to write one line of JavaScript. Now that's… Subversion repository creation shell script Oct 26, 2006 — Dev & Systems I've updated my svn repository creation script, it now copies and imports the code. Works for me, etc. [code]#!/bin/sh # Darren Beale – siftware.co.uk # bealers@gmail.com # Oct 06 # v0.2 # This simple script creates a folder structure # containing /trunk /tags and /branches. It then places the # contents of a folder specified… SEO considerations for a Flash website Oct 9, 2006 — Dev & Systems In 1997/8 (whenever it was) I got really excited by Flash 3 coming out; I even went to a do at the Islington Design centre (UK/Londo"
