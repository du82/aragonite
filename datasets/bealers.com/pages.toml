full_description = "Category: OneNote OneNote & emoji 🏃💨 Jan 14, 2017 — OneNote It turns out that OneNote supports emoji in page & section titles (notebook names too). I had no idea, though I shouldn’t be surprised really; they are just fancy Unicode characters after all. Anyway, I’ve tested this on the full Windows desktop version, iOS and the online web view. They consistently render as you’d expect for the… Life Planning & Journaling with OneNote Nov 28, 2016 — OneNote, PKM & Productivity I recently spoke at the Learn OneNote conference 2016. It was a virtual conference, with all the talks being recorded in advance of the day and then released over the space of a few days to match the schedule. This talk describes my productivity system in detail, a system that has evolved over the 10 years… OneNote Sync To OneDrive Explained Nov 15, 2016 — OneNote To get the most power out of OneNote you want to be able to synchronise the contents of your notebooks between devices and possibly share them with other people. Cloud based save, sync or sharing is a standard requirement for most software these days and OneNote is no exception by offering such a feature. However, due… Evernote Page Tagging in OneNote Nov 3, 2016 — OneNote If you’re coming over to OneNote from Evernote you might immediately miss the ability to tag your pages as you’re used to. Evernote’s page level tagging is a powerful feature but what you may not know is that you can effectively emulate this feature in OneNote too. Because OneNote’s search facility prioritises keywords in a title you simply… OneNote Synchronisation Strategy Oct 15, 2016 — OneNote OneNote does some clever things under the hood to provide you with pain-free multi-user synchronisation across your devices. However, a common complaint is that it can be slow to update if the notebook has lots of large embedded PDFs or files. This is pretty understandable if you take a minute to think about it. Adding a… Hiding Text with OneNote Sep 20, 2016 — OneNote An often overlooked feature in OneNote is the ability to collapse and expand hierarchical text. This allows you to free up valuable page space by hiding content that you don’t need to always see. Using this trick is also a great way to effectively implement a question / answer scenario for your studies. Say you’re cramming for an exam… Dear OneNote API dev team Aug 9, 2016 — Dev & Systems, OneNote Hi, I’m only writing this publicly as I don’t know how to get hold of you, and that’s kind of the point. Sure there are many official channels including your website, Uservoice, Stack Overflow and even Twitter, but none of these seem suitable for certain circumstances. If the API goes down, how do we find out… OneNote Workflow Examples Jul 21, 2016 — OneNote, PKM & Productivity To give you some ideas of how you might use OneNote I provide a detailed run-through of my personal workflows. This system has evolved over the past 10 years of me using OneNote nearly every day. It also touches on my morning routine and how I use week planning. OneNote Guide: Customisation Jul 21, 2016 — OneNote This quickstart guide shows you some useful customisations to be made to a new install of OneNote 2016. OneNote Guide: Fundamentals Jul 21, 2016 — OneNote Quickly get up to speed using OneNote 2016. This video explains basic OneNote concepts and is ideal if you’re considering making the switch from Evernote. A Productivity Tool Based on OneNote Apr 10, 2016 — OneNote I’ve been meaning to launch a productivity tool that hooks into Microsoft OneNote for some years now. I got really far a few years back. I taught myself C# and made a good go of writing a windows desktop app which utilised the OneNote COM API to talk directly to notebooks and pull the specific information out… OneNote on OSX, first impressions Aug 25, 2014 — OneNote Recently I moved to Apple’s OSX as my primary operating system. It has gone very smoothly with me taking a Macbook Air on holiday (with no work or email loaded onto it!) so I could get used to it and when back I had a few transition days where I did productive work with both… OneNote API and PHP Apr 30, 2014 — Dev & Systems, OneNote, PHP Recently Microsoft released an API for my brain indexer favourite tool, OneNote. To say I’m excited by the opportunities presented with this API, especially when it has some more features, would be an understatement. What’s really promising is how open the dev team are being about the API’s progress and out how quickly they are rolling new stuff out. The API is… Unable to programmatically download a Onenote file from Skydrive Sep 29, 2013 — OneNote This is not a how-to it is more of a how-do-i? The thinking is that if I distill the problem into words I may figure out where I’m going wrong. Also, there’s always the outside chance that someone else might have the answer and put me out of my misery. I’ll map out the problem… Dock window to side of screen Aug 12, 2013 — OneNote I dock a OneNote Window to my screen for daily recording of things as they happen. Try it: CTRL+ALT+D Strikethrough keyboard shortcuts in MS Office (and others) Apr 17, 2013 — OneNote I use a lot of strike-through during my day (well, hopefully, I do as I get things done!). Here’s a couple of keyboard short-cuts for strike-through on different digital products: Enable OneNote 2013 logging Mar 20, 2013 — OneNote I’m trying to develop an MS Onenote add-on. This hard because I’m a web developer with LAMP skills so the world of C#, Visual Studio 2012, COM, Registries, DLLs and installers is all new to me. To make things worse it seems that Onenote doesn’t qualify for a VSTO and its file format is still closed…"
