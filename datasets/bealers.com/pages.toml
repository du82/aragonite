ving it. I love that I sort of know who I am and how I tick. I love that I know that where I am is mostly where I want to be. Also, most importantly, I love how… Managing the inputs May 29, 2015 — Articles I’ve not talked about this subject previously as I didn’t want be seen to be a health bore and it felt quite self-indulgent. But inspired by some recent blog posts I’ve read, I thought I’d briefly share my own experiences. Last year a perfect storm of poor lifestyle choices caught up with me. I’m talking about a crap diet, no exercise,… Be Sure To Enjoy The Ride May 21, 2015 — Articles, Featured You know that stock job interview question where you’re asked to specify a weakness and you flip it to become a strength? Well, if you’re like me then the next time you have a job interview (which for me is admittedly quite unlikely) you can tell them that you’re a long-term planner and you’re always specifying a thing, setting goals and then working towards… 2014 in review: podcasts, blogs, books & conferences Dec 28, 2014 — Articles Truth be told I’m really glad to be seeing the back of 2014; let’s just say it has been a challenging year. I appear to have gotten through it mostly intact, though, and I am looking forward to 2015 to see how the changes I’ve been implementing both in my life and my business will play out. One of… Make life a side project Nov 1, 2014 — Articles Two blog posts in one week, unheard of. That’s what you get when you cram two high-octane conferences into one week: MicroConf Europe in Prague Sunday to Tuesday and then The Web Is in Cardiff, Thursday and Friday. I could write reams about my experiences of both extremely high quality, motivating, thought provoking and at some times very moving… The woods are my monastery Oct 30, 2014 — Articles TL;DR I’d much rather be in the woods than sitting in front a of a screen all day. I’ve realised this now and will start doing more of it again. Feel free to join me. I’m writing this post from my hotel room 