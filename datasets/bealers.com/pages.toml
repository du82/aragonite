["https://bealers.com/category/woodland"]
title = "Category: Smallholding & Woodland - Darren Beale's Web Log"
full_description = "Category: Smallholding & Woodland Woodland for sale Sep 13, 2013 — Smallholding & Woodland Ever since I visited Ben Law and spent a week learning in some detail how he built his amazing house from trees in his woodland I have dreamt of doing something similar. So much so that when it became available we scraped up the money and bought a 4 acre plantation of slow-grown, straight and… Natural Regeneration – 18 months on May 20, 2013 — Smallholding & Woodland Here’s a quick post to show the progress of the 1/2ish acre that I coppiced in early 2012. Right after the event 9 months later This weekend I know Sept 2012 to now doesn’t look much different, but it’s worth bearing in mind that it’s been a slow year for *any* growth this year due… Tree planting (practice run) Mar 3, 2013 — Smallholding & Woodland After our grand tour these past five years, 2013 is family Beale’s year of settling, observing and preparing. We do have a long list of jobs but we can’t get them all done at once and we know that we need to plan ahead and prioritise rather than get stressed out about a mountain of work. I’ve… Slightly overgrown woods Sep 9, 2012 — Smallholding & Woodland We’ve been a tad busy at the Beale household recently. Mainly with the housebuild/planning permission episode (another story), deciding to buy a house instead, moving to that house (including the hilarity that ensues when moving from a smallholding with sheep, chickens and barn full of wood/tools/straw into an – admittedly relatively spacious – urban setting) and work taking… Woodland ownership, 1 year on Apr 3, 2012 — Smallholding & Woodland It has been just over a year since we purchased with our pension – if you’re interested more details below – around 26 acres of marginal pasture (leaning towards wetland) and woodland in Wrexham, North Wales very near the borders with both Cheshire and Shropshire. For the first 6 months we didn’t do much there. We made… A larch seesaw Jan 4, 2012 — Fam, Smallholding & Woodland Here’s a quick pictorial how-to for making a rudimentary seesaw that we then put into our woodland to help keep the kids entertained. I started with two bits of larch taken from the woodpile, this cross piece: and this base: I took the bark off the cross piece with a debarking spade. Then cut a… Woodland Shelter finished Jan 1, 2012 — Smallholding & Woodland We got the woodland shelter finished over the christmas break and tidied up the clearing a bit. It’s now ready for us adding some simple storage space (so we can store teabags etc there) and the final major project is to add a compost loo which I’ll start in Feb. Alaskan Chainsaw Mill Nov 21, 2011 — Smallholding & Woodland After a lengthy period of consideration I finally went ahead and invested in an Alaskan chainsaw mill to use to add value (or in Permaculture parlance, obtain the maximum yield) to the small amount of timber we’ll be getting when trying to bring our derelict coppice back to life; bringing in more light and hopefully… Woodland shelter, phase 1 Oct 30, 2011 — Smallholding & Woodland Sad Tree, Happy Tree Sep 22, 2011 — Smallholding & Woodland Our new-to-us woodland has a large number of standing dead trees or ones with bits dangerously hanging off. Whilst I need to wait until autumn proper to kick off the program of works that is rapidly forming in my head, I am slowly racheting my time up at the woods which is no hardship. Today… Clearing a path Sep 21, 2011 — Smallholding & Woodland Our woodland is in need of some TLC, as things currently stand we can’t get to all parts of it because it is so overgrown. We’ve no management plan yet so we want to minimise any changes but we identified one blockage between the two main clearings that if removed would mean we could at… Buying Land with a Pension Sep 3, 2011 — Articles, Smallholding & Woodland Before I begin let’s get the disclaimer out of the way: I’m not a financial advisor nor am I ‘regulated by the Financial Services Authority’ and your risk profile, circumstances, motivations & world view are likely to be totally different to mine. Do your own research. DO NOT take the following article to be in any… Maxed out Jul 20, 2011 — Smallholding & Woodland We’ve moved (again) and I was very glad to have the big Ifor Williams to shift the garden/workshop and firewood. I was pushing it a bit with this load, though. Brought some 7m poles home today Apr 29, 2011 — Smallholding & Woodland The aim being to build my first round wood timber framed structure, a compost loo in the garden Should be able to get a bit of firewood in here Apr 27, 2011 — Fam, Smallholding & Woodland 2012’s firewood coming together Apr 16, 2011 — Smallholding & Woodland A woodland in need of some loving Apr 10, 2011 — Smallholding & Woodland Fire lit and lunch on the go Mar 12, 2011 — Fam, Smallholding & Woodland Pole Lathe 100% complete Mar 4, 2011 — Smallholding & Woodland, Woodwork Pole Lathe 80% complete Mar 2, 2011 — Smallholding & Woodland, Woodwork Better picture of yesterday’s finished wood stack Feb 14, 2011 — Smallholding & Woodland Now we’ve lived through a pretty cold winter I’ve a much better idea of the amount of wood that we need to keep us warm. Hot water is dealt with separately by a woodchip boiler that also drives radiators (which we don’t use). This winter we got though about 7 trailers of wood including the… I made a freestanding firewood store today Feb 13, 2011 — Smallholding & Woodland icicles on house Dec 24, 2010 — Smallholding & Woodland"
