["https://bealers.com/category/articles"]
title = "Category: Articles - Darren Beale's Web Log"
full_description = "Category: Articles 2017 in Review Jan 17, 2018 — Articles, Life Updates Welcome to my third retrospective in four years. I didn’t bother writing one of these for 2015 as I was glad to see the back of the year, but in hindsight I regret not doing so as it was a formative time for my re-invented business and it is useful to be able to look… A Few of my Favourite Things 2016 Dec 31, 2016 — Articles, Life Updates Personal review posts of the outgoing year are becoming more popular and I enjoy reading them, particularly those produced by my peers. However, when I wrote mine earlier this week I purposely left some stuff out as it didn’t seem to fit properly. It’s a list of things that I’ve used – or removed –… 2016 in Review Dec 29, 2016 — Articles, Life Updates 2015 ended with me having a panic attack in a restaurant car-park, somewhere in South Bristol. It’s not as bad as it sounds and in hindsight I put it down to that end-of-year, exhausted-after-stumbling-across-the-finish-line thing where your body gives up a bit and is more vulnerable. But still, it was a shame, because up to that point… Getting Out of a Rut Oct 12, 2016 — Articles Getting a cart out of a rut is hard. The sides are steep and it’s hard to gain purchase. Just a slight turn to either side is ineffective. The wheels won’t catch; they just hit the sides & bounce off. To get it out you need to commit. Making a confident directional change and then… Audience Apr 30, 2016 — Articles Marc recently wrote a post called Disclaimer. Disclaimers, wordy intros, apologies: they’re all unnecessary. They water down the message. It resonated with me. I’ve already mentioned my tendency to tag on “In my opinion“, “I feel” or “I think” to my written word. It’s just redundancy. My Life Reboot 18 Months On Apr 29, 2016 — Articles, Life Updates TL;DR Years of a terrible diet, no exercise and not dealing with my underlying stress & anxiety problems left me a gibbering wreck. I was having panic attacks, experiencing physical pain and I was deeply, deeply unhappy. Enough was enough, so 2 years ago I took control and started making changes. It worked, mostly. This is a summary… Are Slack Groups The New Twitter? Apr 28, 2016 — Articles Around 2010 there was a spate of blog posts bemoaning the end of the comment thread. The claim was that Twitter was making us dumber. We were too busy, or too lazy, to spend the time to craft a response to posts. Heck we were too busy to read posts. They had a point. The network… The OneNote Handbook Apr 25, 2016 — Articles 2024 update: I never wrote this book. As I alluded yesterday, I am going to write a book about OneNote. I’ve been a fan of OneNote for over 10 years and have been meaning to write this book for as long as I can remember. It has two main aims: I’ve put off writing the book because… Turning up Apr 24, 2016 — Articles Quite a few of my old narratives were well and truly crushed today: I am unfit I don’t do running I’ll never run a marathon These were stories I was telling myself. Turns out all I needed to do was set my mind to it, turn up and do the work. It helps that I… The London Marathon Apr 23, 2016 — Articles I remember watching the first London Marathon on the TV as a kid in 1981. It was a big deal. This was back when we only had 3 channels on the TV. The BBC gave it rolling coverage for well into the afternoon. It was like the Olympics or a royal wedding. It made for… Filling The Half-Empty Glass Apr 22, 2016 — Articles Are you a glass half full or glass half empty person? The chances are that if you’re tending towards the empty, that you also suffer from anxieties. You may even have a black dog following you around from time to time. It’s not that you’re a doom and gloom merchant. You can see the joy in the… Removing Redundancy When Writing Apr 21, 2016 — Articles, Featured When I started this challenge I was focused on volume. I just needed to write some stuff and publish it. Writing each day has definitely helped me to get faster and also to have more and more ideas. Each post sparks off more ideas for topics to write about. Any conversation about that topic will throw something else into… Comparisons Can Be Harmful Apr 20, 2016 — Articles, Featured Comparisons can be harmful, whether comparing yourself to others or judging other people. That person has better stuff than me. That person has it easy. Their business is doing better than mine. They have better clients. They go to interesting places. They do interesting things. With interesting people. They cook nicer food. In a bigger… At Least It’s Not A Blue On Blue Apr 19, 2016 — Articles, Featured Twitter told me yesterday that someone at 123-reg deleted a part of the internet. My immediate thought was: “Owch, that’s got to hurt” And then: “I’m glad I’m not that boss right now” A few minutes later, my thoughts had turned and instead I was thinking: “Well, at least it’s not a blue on blue”.… Always Be Exercising Apr 17, 2016 — Articles This is a personal post, an actual note to self; a reminder. Last week was pretty tough. I’ve felt the physical effects of stress again, my ‘stress related somatoform pain‘. Nowhere like the bad old days where it was a constant, but definitely there; the first time in over 6 months. The headaches, the sinus pains, tinnitus and the physical sensations… My Everyday Bag Apr 14, 2016 — Articles I quite like those pictures of people’s bags and their contents that sometimes get tweeted about. It’s slightly voyeuristic, but also you get ideas for practical stuff to keep with you at all times. So, in what is officially my second Filler PostTM for #30DWC I thought I’d share details about my bag, albeit without an amazing photo… Superpower Apr 13, 2016 — Articles There’s an advert you see on the tube and elsewhere of woman yawning and – I think – the strap-line is something like ‘Tired of being tired?’ That is my 30s summed up in one sentence, right there. At the time put it down to having baby twin