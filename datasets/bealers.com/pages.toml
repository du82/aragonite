title = "Sending Slack messages from Laravel console commands - Darren Beale's Web Log"
description = "I recently struggled to get my Laravel 11 app to send messages to a Slack notification channel. My first confusion was that the docs refer to making the relevant model class and sending the…"
full_description = '''Sending Slack messages from Laravel console commands Sep 26, 2024 — Featured, PHP I recently struggled to get my Laravel 11 app to send messages to a Slack notification channel. My first confusion was that the docs refer to making the relevant model class notifiable and sending the notification that way. Which wasn’t relevant to my use case as I wanted to send it from a utility command. Googling – or, erm, maybe it was Claude – came up with this route method, which looked promising: .wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; } Notification::route('slack', config('services.slack.notifications.webhook_url')) ->notify(new InterestingThing());Code language: PHP (php) But I then ran headfirst into this error: TypeError: Illuminate\Notifications\Slack\SlackChannel::buildJsonPayload(): Argument #1 ($message) must be of type Illuminate\Notifications\Slack\SlackMessage, Illuminate\Notifications\Messages\SlackMessage given, called in /vendor/laravel/slack-notification-channel/src/Slack/SlackChannel.phpCode language: PHP (php) The documentation states that the notifiable model should have the following method, which returns the channel name, not the webhook URL I’d been using. /** * Route notifications for the Slack channel. */ public function routeNotificationForSlack(Notification $notification): mixed { return '#foo-channel'; }Code language: PHP (php) I had tried this (spoiler: correct version), but I got [channel_not_found] : Notification::route('slack', config('services.slack.notifications.channel')) ->notify(new InterestingThing()); RuntimeException: Slack API call failed with error [channel_not_found]Code language: PHP (php) After going around in circles for a bit, I thankfully stumbled upon this Github comment from James Brooks, which gave me the context I needed to understand the problem: there are two ways to build Slack notifications: Webhook Channel (the old way, which you’re using currently) Block Kit So, webhook is the old way, and that’s great because I *definitely* want to use Block Kit to get that formatting goodness, but why am I getting [channel_not_found]? TL;DR Go to your Slack client, and in the channel you want the bot to post, do this: /invite @your-bot I’d copied and pasted code that doesn’t work with Laravel 11 (the old Webhook way) 🤦 The bot needs permission to post to the channel I’m posting this hoping it saves someone else time in the future. ←Previous: Replicating Roam’s /tomorrow command in Obsidian Next: How to give Cursor AI the current date & time→ Comments Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'''
