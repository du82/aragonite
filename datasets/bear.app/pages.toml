title = "从 Day One 迁移"
description = "通过简单步骤将笔记从 Day One 迁移至熊掌记笔记中。"
full_description = "从 Day One 迁移 library 返回帮助页面首页 要将您的笔记从 Day One 迁移到熊掌记，请按照以下步骤操作： 在 Day One 中，选择菜单栏中的 文件 → 导出 → JSON (zip) 导出所有条目到一个压缩文件中。 在熊掌记中，选择 文件 → 导入来自… → Day One，熊掌记将会显示一个打开面板，显示一些选项。我们建议勾选 “自动转义标签” 选项，以避免创建不需要的标签。然后，选择您的 Day One 导出文件并点击 导入笔记。 位置信息 Day One 的位置信息将显示在熊掌记中每个结果笔记的末尾，作为指向 Apple 地图的标题链接。 标签 在熊掌记中，所有导入的 Day One 条目都将被标记为 #dayone 以便轻松访问。每个条目的标签将被转换为熊掌记的 #标签 ，并显示在笔记底部。"
