title = "如何在熊掌记中搜索"
description = "了解如何在熊掌记内搜索，包括搜索特定精确词组，排除某个特殊词语，搜索特定标签，以及更多内容。"
full_description = '如何在熊掌记中搜索 library 返回帮助页面首页 你可以在熊掌记中快速搜索文本、列表、附件和标签等。订阅 Bear Pro 后，你还可以在图片和 PDF 中搜索。 在 Mac 上点击或在 iOS 上轻按笔记列表上方的搜索图标。如果你正在使用外接键盘，你也可以通过快捷键 ⌘Command + F 来触发搜索 在搜索框中输入关键字或短语，熊掌记会随着你的输入同步进行搜索 点击搜索结果中的笔记，并通过键盘快捷键 ⌘Command + G 或上下箭头（iOS）在结果中进行切换 快速搜索 无论你是在编辑写作内容还是浏览笔记条目，只需使用快捷键或手势，你就可以快速打开笔记、标签或侧边栏项目。具体操作如下： Mac 和连外接键盘的 iPad 使用快捷键 ⌘+O 来触发快速搜索框 键入几个关键字、#标签 或 @侧边栏项目 使用箭头键切换 按回车键 iPad 和 iPhone 在熊掌记任意地方用三根手指向下轻扫 键入几个关键字、#标签 或 @侧边栏项目 在建议框中上下滑动查看更多搜索结果 轻按来选择 提示：如果你想前往 #标签 或 @侧边栏项目，需要在快速搜索中使用特殊字符（ # 或 @）。如果你只是输入关键字，快速搜索会默认搜索笔记条目，而不是搜索标签或其他地方。 高级搜索选项 为了帮助您在需要时找到正确的笔记，熊掌记支持各种特殊的搜索命令、通配符以及我们称为特殊搜索的内容。 大多数搜索命令可以组合使用来进一步筛选笔记。例如，搜索 @无标签 @附件 活动 or 出差 可以找到没有标签、包含附件（图片或文件）并含有 活动 或 出差 任一关键词的笔记。 搜索通配符 像网络搜索引擎一样，熊掌记支持很多搜索通配符，可以包含或排除关键词和标签。 标签 你可以搜索任意 #标签 你可以搜索任意不带子标签的 !#标签 你可以从搜索结果中排除特定的 -#标签 你可以仅搜索 #*/子标签 小技巧：搜索标签，接着创建一篇新笔记，该笔记将会直接带有该标签。 请注意：含有双井号的标签，例如数字 #2021#，或日期 #23/04/2021# 在搜索时也需要同样使用双井号以保证搜索准确性。 缩小搜索范围 在熊掌记的搜索中，你可以使用精确词组、搜索多个关键词，或排除某些词组来进一步过滤您的搜索。 精确关键词 您可以用两个引号"进行词语的精确搜索（现已支持中文引号）。例如： “逝者如斯夫” 多个关键词 使用 OR 来搜索包含两个关键词之一的所有笔记。例如：搜索 活动 OR 差事可以找到所有带有 活动 或 差事 关键词的笔记。当然，进行 OR 搜索时你可以同时搜索两个以上的关键词。 排除关键词 要从搜索结果中排除特定字词，请使用减号-。例如，要搜索不含西兰花的食谱，可输入： 食谱 -西兰花 减号也可用于带引号的内容或特殊搜索。例如： -“逝者如斯夫” 或 -@代码 前者将搜索不含“逝者如斯夫”的笔记；后者将搜索不含代码片段的笔记。 特殊搜索 熊掌记还附带一些特殊的搜索选项，您可以使用它来进一步筛选您的笔记，例如列表、图像、创建日期和标题等。特殊搜索、标签以及带双引号的精确关键词会在搜索框中高亮显示。 @有标签：显示至少包含一个标签的笔记 @无标签：显示不含任何标签的笔记 @今天：显示今天修改过的笔记 @昨天：显示昨天修改过的笔记 @前X天：显示过去X天内修改过的笔记，X为任意正整数（支持中文数字） @前X天创建：显示过去X天内创建的笔记，X为任意正整数（支持中文数字） @图片：显示包含图片的笔记 @文件：显示包含文件的笔记 @附件：显示包含文件或图片的笔记 @任务：显示至少包含一个待办事项元素的笔记，无论该待办事项是否已完成 @待办：仅显示包含未完成待办事项的笔记 @完成：仅显示包含待办事项且全部已完成的笔记 @代码：显示至少包含一个代码片段的笔记 @标题：仅在笔记标题中搜索 @ocr：仅在笔记附件内搜索 （需要订阅 Bear Pro） @无标题：显示无标题的笔记 @已加密：显示已加密的笔记 @置顶：显示置顶笔记 @空白：显示空白笔记（无标题、无副标题、无附件） @只读：显示设为只读的笔记 @维基链接：显示包含维基链接的笔记 @反向链接：显示包含反向链接的笔记（不包含未链接的提及内容） @日期：显示在特定日期时修改的笔记，例如：@日期（20180112） @日期（201809） @日期（2018）；显示在特定日期前或日期后修改的笔记可以通过 @日期(<20180112) 或 @日期(>20180112)搜索 @创建日期：显示在特定日期创建的笔记，例如：@创建日期（20180112） @创建日期（201812） @创建日期（2018）；显示在特定日期前或日期后创建的笔记可以通过 @创建日期(<20180112) 或 @创建日期(>20180112)搜索 关于@日期和@创建日期的搜索命令： @日期 和 @创建日期命令和开头的括号之间不需要空格，支持使用中文全角括号。 @日期 和 @创建日期 附带的日期格式可使用 ISO8601 格式 @日期（2023-11-23） 或您设备的本地日期格式，例如中国的格式为 @日期（20231123）。 这些特殊搜索可与任何搜索字词结合使用，以获得更好的搜索结果。例如：搜索 @图片 @待办 “熊掌记常见问题” 将显示所有包含图片和未完成的待办事项，以及精确关键词“熊掌记常见问题”的笔记。 其他语言 高级搜索还支持其他语言，包括英语、繁体中文、日语、韩语等。'
year_published = 2025
