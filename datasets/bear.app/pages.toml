full_description = "在单独的窗口中打开熊掌记笔记 library 返回帮助页面首页 在 Mac 版的熊掌记中，你可以轻松将多篇笔记在多个窗口中分别打开：在笔记列表双击笔记，或在菜单中选择笔记 → 在新窗口中打开。 在熊掌记的编辑器中按住 ⌘ 键的同时点击笔记链接，可以在新窗口中打开链接的笔记。 在 Mac 上，你还可以让一个窗口浮动在其他窗口之上，将其置于窗口最上层。笔记浮动在自己的窗口中时，你选择窗口 → 窗口置于最上层。或者点击右上角的更多（⫶）菜单，选择窗口置于最上层。"
