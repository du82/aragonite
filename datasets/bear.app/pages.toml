title = "从 Apple 备忘录迁移"
description = "如何从 Apple 苹果备忘录导出或迁移笔记至熊掌记。下载自动操作工作流程，几分钟内即可将苹果备忘录内的笔记导入至熊掌记内。"
full_description = '从 Apple 备忘录迁移 library 返回帮助页面首页 Apple 备忘录目前还不提供全部导出选项，故无法将其中的笔记一键导出再导入到熊掌记。但是我们为 Mac 用户提供了一种解决方案，而针对 iPhone 和 iPad 用户的解决方案也正在探索中。 Mac: 使用“自动操作”工作流程 下载我们的“自动操作”工作流程 最低系统要求：macOS 10.14 Mojave 我们为 macOS 创建了一个自动操作工作流程，可以将您所有的 Apple 备忘录笔记导出为 HTML 文件。其中大多数笔记内容将能够完整保留，但不是全部。详情请见下方： 文字、清单和照片都应当包含在导出文件内 注意：仅 macOS 10.15 Catalina 版本支持照片导出。在较早的 macOS 版本上，Apple 备忘录将不能导出照片 任务列表会转换为项目符号列表 富媒体链接将转换为纯文本链接 不支持非照片附件（例如 PDF 或其他文件），这些附件不会导出到 HTML 文件里， 它们将安全地保留在 Apple 备忘录中 如果您的 HTML 文件或导入的笔记在熊掌记中无法正确显示，请尝试使用终端在该 HTML 文件目录中运行以下命令 find . -name \*.html -type f | \ (while read file; do iconv -f UTF-16 -t UTF-8 "$file" > "${file%.xxx}-utf8.html"; done); 如何使用“自动操作”工作流程 下载我们的 AppleScript 双击打开 “自动操作” 点击 “运行” 键 选择或创建一个新文件夹来存储导出的 Apple 备忘录笔记 在熊掌记中，单击 文件 > 导入笔记 在打开的对话框中，找到包含导出笔记的文件夹 选择一篇或多篇笔记 （可选）调整导入选项，例如是否保留原始创建日期，以及是否使用第一行或文件名作为笔记标题 单击导入笔记 如何在 Mac 上选择多个条目 这是在 Mac 上工作的额外好处。在 macOS 访达和许多应用程序中都有一些多选条目的方法，在某些文件对话框中也是一样，例如： 选择一整组连续的条目：单击第一个文件，按住 Shift ⇧ 键，然后单击另一个文件。它们之间的所有文件也都将被选中 选择多个单独条目：按住 ⌘ 键并点击多个文件。这样仅会选中点击的文件 选择所有条目：在上述对话框中，在文件夹中单击任意位置，然后按 ⌘ A 关于隐私权和此 AppleScript 关于此 AppleScript 的一个优势是它仅在您的设备上运行。您的所有笔记都不会经我们的手，它只会在您选择的文件夹中创建 HTML 文件。 在 iOS 上，您可以在侧边栏左上角的更多（⫶）菜单找到 “导入笔记” 选项。'
year_published = 2025
clearnet = "https://bear.app/zh/faq/migrate-from-apple-notes"
