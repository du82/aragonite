["https://bear.app/zh/faq/backup-restore"]
title = "备份笔记和还原笔记"
description = "了解如何在 iOS 和 Mac 设备上的熊掌记中备份和还原你的笔记。备份可以确保你当前笔记笔记的安全，操作迅速，且没有任何风险。了解备份和恢复的注意事项。"
full_description = "备份笔记和还原笔记 library 返回帮助页面首页 熊掌记可以将所有笔记备份为单个 .bear2bk 文件，之后可快速恢复。如果你有任何通过 Bear Pro 加密的熊掌记笔记，这些笔记会以加密格式储存在你的备份中。在熊掌记打开或阅读这些笔记需要锁定这些笔记时设置的密码。 Mac 熊掌记的备份和恢复功能位于 文件 -> 备份笔记… 和 恢复备份…。 iOS 点按侧边栏左上角的更多图标（⋮），然后选择备份所有笔记和恢复备份。 重要提醒！ 在恢复备份时，熊掌记当前存有的所有笔记，包括废纸篓中的笔记，将被永久删除。导入的笔记将取而代之。 如果您只想获取备份文件中的部分笔记内容，而不想恢复备份： 将备份文件的后缀名由 .bear2bk 改为 .zip 解压缩备份文件 在解压缩得到的文件夹中，您将找到每篇已备份笔记的 .textbundle 文件 在熊掌记中通过导入笔记功能进行导入部分笔记 以上步骤可以通过在 Mac 使用访达或在 iOS 端使用文件 app 完成。"
