["https://bear.app/zh/faq/browser-extensions"]
title = "熊掌记的免费浏览器扩展"
description = "熊掌记提供免费的 macOS 端浏览器扩展，包括 Safari、谷歌 Google Chrome 、火狐 Firefox、Opera 等浏览器。一键即可将整个网页或网页的部分内容以笔记形式保存至熊掌记。"
full_description = "熊掌记的免费浏览器扩展 library 返回帮助页面首页 在 Mac 上，熊掌记提供支持 Safari、Chrome 和 Firefox 的免费浏览器扩展程序。它使您能够通过一次点击将部分或整个网页保存为单篇笔记。 Bear Pro 订阅用户 可在所有设备之间同步全部笔记。 要使用熊掌记的浏览器扩展，必须先安装 Mac 版本的熊掌记。 Safari：熊掌记现在会自动安装 Safari 浏览器扩展。打开 Safari 浏览器，前往 偏好设置 > 扩展 在扩展列表中找到熊掌记并启用它 Chrome：访问 Chrome 网上应用店 并点击“添加到 Chrome” Firefox：访问 Mozilla 附加组件 并点击“添加到 Firefox” Opera：访问 Opera 插件 并点击“添加到 Opera” 安装后，点击浏览器工具栏上的熊掌记按钮。几秒钟之后，在熊掌记中就会出现基于页面内容生成的笔记。如果你在选中页面的部分区域时点击熊掌记按钮，则熊掌记中会基于区域中内容生成新的笔记。 扩展设置 您可以向所有已生成的笔记中添加标签、导入图像，并将页面 URL 追加到笔记中。 在 Mac 上，单击熊掌记 > 网页剪藏偏好设置 在 Mac 版的 Chrome 上，你需要点击熊掌记图标旁的“选项”按钮。 在 iOS 上，选择侧边栏底部的偏好设置，然后点击网页剪裁"
