["https://bear.app/faq/how-to-use-footnotes-in-bear"]
title = "How to use footnotes in Bear"
full_description = "How to use footnotes in Bear library Return to support library Footnotes are a way to include supplemental information about a topic in your notes. Each footnote is numbered and linked so it’s easy to navigate between the note text where the reference is found, and its corresponding footnote at the bottom of your note. Keep in mind that notes are automatically incremented, starting at 1. How to create a footnote While writing anywhere in a note: Mac With your cursor next to any text, click the three dots menu in the formatting bar, then the footnote button. Command + Shift + E also works on iOS devices with a keyboard Bear will create the reference and the footnote at the bottom, then move your keyboard focus to the text of the footnote Write your footnote iOS Tap the BI~U~ button, then the footnote button Bear will create the reference and the footnote at the bottom, then move your keyboard focus to the text of the footnote How to navigate footnotes Click or tap a footnote’s number to navigate between its reference in a note and the actual footnote at the bottom."
