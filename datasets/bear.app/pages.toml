full_description = "如何隐藏侧边栏和笔记列表 library 返回帮助页面首页 如果您希望专注于编辑笔记，可以尝试隐藏侧边栏和笔记列表。 Mac 在菜单选择 查看 → 仅显示编辑器 或 显示笔记和编辑器。 若要返回到初始三栏状态，请单击 显示标签、笔记和编辑器。 你也可以通过双指在触控板左右滑动来隐藏/显示侧边栏和笔记列表。请注意：该功能需要在系统设置中允许触控板进行滑动操作。了解触控板的设置，请阅读：在 Mac 上更改“触控板”设置。 iPad 在 iPad 上以横屏方式使用熊掌记时，可以在浏览笔记界面的任意位置向左滑动来隐藏侧边栏。但一旦你点击进入笔记开始编辑后，侧边栏和笔记列表都将隐藏，为你的编辑让出空间。 在 iPad 上竖屏时，当您点击笔记列表中的笔记查看时，侧边栏将自动隐藏。如果您点击笔记开始编辑，笔记列表也会隐藏。"
