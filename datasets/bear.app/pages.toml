["https://bear.app/faq/how-to-lock-bear-for-privacy"]
title = "How to lock Bear for privacy"
description = "Learn how to lock Bear App on iPad, iPhone, and Mac. App locking allows you to force the requirement of touchID, faceID or a password to access your Bear notes."
full_description = "How to lock Bear for privacy library Return to support library Bear Pro users can lock Bear, which offers some privacy from nosey family members and coworkers. Bear on iPad and iPhone can use Face or Touch ID. Bear for Mac can use Touch ID (if available). Enable Bear’s lock on iPad and iPhone Open Bear Tap the Settings icon at the bottom of the Sidebar (on the left) Tap Privacy Tap Lock Bear with Face/Touch ID (depending on your device) Enable Bear’s lock on Mac Open Bear Click Bear > Preferences and the General pane Check Lock Bear at Launch Now, the next time you open Bear, it will authenticate with Face/Touch ID to make sure it’s you. Anyone who is not you need not apply. Important note Note that Bear Lock is different from the Bear Pro option to encrypt individual notes. Bear Lock does not encrypt all your notes, it simply adds an authentication prompt before accessing Bear."
