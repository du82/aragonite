["https://bear.app/zh/faq/how-tagcons-work"]
title = "标签图标"
description = "了解如何给标签设置自定义标签图标，以及如何自动同步。你还可以关闭标签图标选项，了解你的母语语言所支持的默认标签图标。"
full_description = "标签图标 library 返回帮助页面首页 熊掌记为您的笔记提供名为标签图标的增强图标。小巧易辨别的图标将显示在侧边栏的标签旁。（了解有关标签的更多内容：《熊掌记的标签系统》） 如何使用 熊掌记的标签图标库持续更新，对于大多数常见内容都可自动匹配图标，包括：写作、旅行、商业、游戏、想法等等。 请放心：我们看不到您的笔记和标签。 为了创建默认的热门标签库，我们调研了 Twitter 和 Instagram 等社交媒体。除了默认标签，您可以为任何标签添加或更改标签图标。操作如下： Mac 在 macOS 中，选择标签图标的操作如下： 右击侧边栏中的一个标签 选择编辑标签 点击当前应用的标签图标来展开图标库 浏览标签图标列表或使用关键字进行搜索 点击图标进行选择 iOS 在 iOS 中，选择标签图标的操作如下： 长按侧边栏中的一个标签 选择编辑标签 轻按当前应用的标签图标来展开图标库 滚动显示的标签图标列表或使用关键字进行搜索 轻按图标进行选择 在设备之间同步标签图标 要在 Mac、iPad 和 iPhone 之间同步标签图标的配置，您需要熊掌记 Pro。 它可解锁同步功能（由 iCloud 提供）、更多的导出选项、笔记加密同时还有更多持续更新的精美主题供您定制写作环境等等。 为其他语言显示标签图标 如果您正使用母语版本的熊掌记但同时想启用其他语言的关键字，则请在操作系统中的系统语言中添加第二种语言。 例如，如果您使用的是中文的操作系统，而您希望熊掌记也为 #todo 显示图标，则请将英语添加为系统的第二语言。 这样操作即可让熊掌记为 #todo 和 #待办事项 均显示图标。 还有更多的图标需求吗？ 我们随时欢迎您提供更多标签图标的提议，欢迎您通过社交媒体或联系我们。"
year_published = 2025
clearnet = "https://bear.app/zh/faq/how-tagcons-work"
