["https://bear.app/zh/faq/migrate-from-evernote"]
title = "从印象笔记迁移"
description = "探索如何将笔记从印象笔记迁移至熊掌记。转移印象笔记的笔记至熊掌记内。如何从印象笔记导出笔记再导入进熊掌记。"
full_description = "从印象笔记迁移 library 返回帮助页面首页 重要说明：由于中国印象笔记更新改版后不支持开放格式导出，我们暂时没有很好的迁移方法。详情请参考该页面。 要从旧版印象笔记或国际版印象笔记中导入笔记，只需执行以下操作： 按照此导出指南将印象笔记导出为 .enex 存档文件。 将 .enex 文件导入熊掌记 在 macOS 上，在菜单栏中选择文件→导入笔记…→Evernote即可将笔记导入。 在 iOS 上，再偏好设置中轻按导入和导出，选择 导入来自，然后选择 Evernote 格式，再轻按导入笔记。 .enex 不包含笔记本的信息。 如果你想在熊掌记中保留笔记本名称作为日后参考的话，建议您在从 印象笔记 导出之前添加适当的标签。 enex 文件包含 印象笔记 中被放入废纸篓的笔记，请在导出前考虑清空废纸篓。 在导入之前，建议勾选排除无意标签选项，避免以#开头的内容被熊掌记自动识别为标签。 如果想要迁移 印象笔记 的笔记本到熊掌记中，请使用标签。 在熊掌记中为每个笔记本创建新的笔记标签（如：#笔记本1#、#笔记本1#、#笔记本3#等等）。 将每个笔记本单独导出为 enex 文件，并分别导入。 在每次导入后，通过拖放方式为新笔记赋予对应的标签。 使用搜索功能查找刚刚导入的笔记（入：要查找不含#笔记本1#和#笔记本2#标签的笔记，请输入-#笔记本1# -#笔记本2#）。"
