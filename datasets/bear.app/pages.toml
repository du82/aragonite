["https://bear.app/zh/faq/import-your-notes"]
title = "导入笔记"
description = "了解如何在 iOS 和 macOS 上导入笔记至熊掌记内。熊掌记的导入格式。如何将我的笔记导入至熊掌记应用中。导入笔记至熊掌记应用中，熊掌记导入笔记。"
full_description = "导入笔记 library 返回帮助页面首页 熊掌记可导入下列格式的文件： .txt - 纯文本 .md - Markdown .rtf - 富文本格式 .textbundle - V2 Text Bundle (文本、Markdown 以及附件) .textpack - V2 Compressed Text Bundle 格式 .enex - Evernote XML 导出格式 .bearnote 或 .bear - 熊掌记格式 .html - HTML 文件 DayOne Drafts Evernote Obsidian Apple Notes 在 macOS 上，在菜单栏中选择文件→导入笔记…即可导入笔记。 在 iOS 上，你可以在侧边栏上方的 ⫶ 菜单中找到导入笔记的选项 导入器提供保留导入文件中原始日期的功能，你还可以使用文件的第一行或文件名作为笔记标题。如导入 .bear 文件，创建日期将被直接保留和使用。 导入带附件的 Markdown 文件 由于 Mac App Store 应用程序的一些安全限制，“导入笔记… “不能用于导入标记 Markdown 文件及其附件。如需导入该类型文件，请前往菜单 文件 → 导入来自… → Markdown 文件夹。 系统会询问从哪个文件夹导入，选择该文件夹后，熊掌记会导入该文件夹及其子文件夹中包含的所有.md文件。所有被 Markdown 文件引用的附件，无论是在指定的文件夹还是其子文件夹中，都将被导入。 为避免非自愿导入，我们建议在导入前将.md文件和附件移至一个新文件夹。"
