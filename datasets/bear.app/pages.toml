["https://bear.app/zh/faq/how-to-use-the-info-panel-table-of-contents-and-backlinks-in-bear"]
title = "如何使用信息面板、目录大纲和反向链接"
description = "熊掌记支持查看笔记的各类信息，包括字数和字符数、阅读时间、创建日期和最后一次编辑日期等。信息面板同时支持查看笔记目录大纲和笔记的反向链接。了解如何查看笔记目录和反向链接。"
full_description = "如何使用信息面板、目录大纲和反向链接 library 返回帮助页面首页 熊掌记中的信息面板显示各种统计数据，如字数和字符数、阅读时间以及最近一次的编辑日期等。此面板还包括目录，可以用于查看笔记的大纲视图；以及反向链接，用于在相互链接的笔记之间进行导航。 如何使用信息面板 信息面板会作为一个弹出窗口显示在笔记的顶部，显示有关笔记的各种统计信息，包括字数、字符数、段落和预估阅读时间。显示信息面板的具体操作： Mac：点击右上角的 ⓘ 按钮或前往菜单查看 > 显示/隐藏信息面板 iOS：轻按笔记右上角的 ⓘ 按钮 小贴士 点击统计数据的任意数据即可将该数据固定在编辑器内常驻显示，对于有字数或阅读时间要求的写作任务非常实用。 如何显示笔记目录（ToC） 点击信息面板顶部的目录选项卡，你会看到当前笔记的目录，这是根据笔记内的标题（H1-H6）自动生成的目录大纲。 点击或轻按目录中的任何标题，即可快速导航到笔记中的该部分。点击目录标题右侧的小尖头可隐藏/显示对应章节。 如何使用反向链接 反向链接选项卡显示了所有其他与当前笔记相链接的笔记列表。点击其中任何维基链接即可直接前往链接的笔记。 反向链接是一个从相互关联的笔记间建立知识体系的强大工具，非常适用于学习和工作中的个人知识管理系统（PKM）、日记、科研等等。 反向链接的列表包含两个部分： 提及链接 - 以维基链接（Wikilink）链接到当前笔记的笔记列表 未链接的提及内容 - 在文中提及该笔记标题但未链接的笔记 您可以通过点击反向链接旁边的小三角来显示或隐藏未链接的提及内容 提示与注意事项 浮动信息面板 - 在 Mac 上，你可以点击并拖拽信息面板来将其与编辑器分离并固定到屏幕上 在 iOS 上，在编辑器中左滑即可打开信息面板"
year_published = 2025
