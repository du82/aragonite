["https://bear.app/faq/x-callback-url-scheme-documentation"]
title = "X-callback-url Scheme documentation"
description = "X-callback-URLs are an API for operating with Bear. Among other things you can open a note or a tag, add text or file, rename or delete tags, and archive notes"
full_description = "X-callback-url Scheme documentation library Return to support library Bear implements the x-callback-url protocol, which allow iOS and Mac developers to expose and document API methods they make available to other apps and return useful data. Bear URL Scheme actions look like this: bear://x-callback-url/[action]?[action parameters]&[x-callback parameters] with x-success and x-error as available x-callback parameters. Actions /open-note - /create /add-text - /add-file /tags - /open-tag - /rename-tag- /delete-tag /trash - /archive - /untagged - /todo- /today - /locked /search - /grab-url /open-note Open a note identified by its title or id and return its content. parameters id optional note unique identifier. title optional note title. header optional an header inside the note. exclude_trashed optional if yes exclude trashed notes. new_window optional if yes open the note in an external window (MacOS only). float optional if yes makes the external window float on top (MacOS only). show_window optional if no the call don’t force the opening of bear main window (MacOS only). open_note optional if no do not display the new note in Bear’s main or external window. selected optional if yes return the note currently selected in Bear (token required) pin optional if yes pin the note to the top of the list. edit optional if yes place the cursor inside the note editor. search optional opens the in-note find&replace panel with the specified text x-success note note text. identifier note unique identifier. title note title. tags note tags array is_trashed yes if the note is trashed. modificationDate note modification date in ISO 8601 format. creationDate note creation date in ISO 8601 format. example bear://x-callback-url/open-note?id=7E4B681B bear://x-callback-url/open-note?id=7E4B681B&header=Secondary%20Ttitle Create and try /open-note actions in seconds with our URL builder online /create Create a new note and return its unique identifier. Empty notes are not allowed. parameters title optional note title. text optional note body. clipboard optional if yes use the text currently available in the clipboard tags optional a comma separated list of tags. file optional base64 representation of a file. filename optional file name with extension. Both file and filename are required to successfully add a file. open_note optional if no do not display the new note in Bear’s main or external window. new_window optional if yes open the note in an external window (MacOS only). float optional if yes make the external window float on top (MacOS only). show_window optional if no the call don’t force the opening of bear main window (MacOS only). pin optional if yes pin the note to the top of the list. edit optional if yes place the cursor inside the note editor. timestamp optional if yes prepend the current date and time to the text type optional if html the provided text parameter is converted from html to markdown url optional if type is html this parameter is used to resolve relative image links x-success identifier note unique identifier. title note title. example bear://x-callback-url/create?title=My%20Note%20Title&text=First%20line&tags=home,home%2Fgroceries notes The base64 file parameter have to be encoded when passed as an url parameter. Create and try /create actions in seconds with our URL builder online /add-text append or prepend text to a note identified by its title or id. Encrypted notes can’t be accessed with this call. parameters id optional note unique identifier. title optional title of the note. selected optional if yes use the note currently selected in Bear (token required) text optional text to add. clipboard optional if yes use the text currently available in the clipboard header optional if specified add the text to the corresponding header inside the note. mode optional the allowed values are prepend, append, replace_all and replace (keep the note’s title untouched). new_line optional if yes and mode is append force the text to appear on a new line inside the note tags optional a comma separated list of tags. exclude_trashed optional if yes exclude trashed notes. open_note optional if no do not display the new note in Bear’s main or external window. new_window optional if yes open the note in an external window (MacOS only). show_window optional if no the call don’t force the opening of bear main window (MacOS only). edit optional if yes place the cursor inside the note editor. timestamp optional if yes prepend the current date and time to the text x-success note note text. title note title. example bear://x-callback-url/add-text?text=new%20line&id=4EDAF0D1&mode=append Create and try /add-text actions in seconds with our URL builder online /add-file append or prepend a file to a note identified by its title or id. This call can’t be performed if the app is a locked state. Encrypted notes can’t be accessed with this call. parameters id optional note unique identifier. title optional note title. selected optional if yes use the note currently selected in Bear (token required) file required base64 representation of a file. header optional if specified add the file to the corresponding header inside the note. filename required file name with extension. Both file and filename are required to successfully add a file. mode optional the allowed values are prepend, append, replace_all and replace (keep the note’s title untouched). open_note optional if no do not display the new note in Bear’s main or external window. new_window optional if yes open the note in an external window (MacOS only). show_window optional if no the call don’t force the opening of bear main window (MacOS only). edit optional if yes place the cursor inside the note editor. x-success note note text example bear://x-callback-url/add-file?filename=test.gif&id=4EDAF0D1-2EFF-4190-BC1D-67D9BAE49BA9-28433-000187BAA3D182EF&mode=append&file=R0lGODlhAQABAIAAAP%2F%2F%2F%2F%2F%2F%2FyH5BAEKAAEALAAAAAABAAEAAAICTAEAOw%3D