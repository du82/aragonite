["https://bear.app/zh/faq/disable-spell-check-and-corrections"]
title = "禁用拼写检查和更正"
description = "拼写检查非常有用，但有时对于有经验的写作者来说也可能是个麻烦，打扰写作过程。了解如何在 macOS 和 iOS 的熊掌记上禁用拼写检查和更正。"
full_description = '禁用拼写检查和更正 library 返回帮助页面首页 Mac 访问菜单栏中的 编辑 → 拼写和语法 可禁用拼写和语法更正功能。 iOS 您只能在系统的“设置”应用中禁用拼写检查功能，该功能位于 通用 → 键盘 → 检查拼写。 禁用拼写检查和更正 library 返回帮助页面首页 Mac 访问菜单栏中的 编辑 → 拼写和语法 可禁用拼写和语法更正功能。 iOS 您只能在系统的“设置”应用中禁用拼写检查功能，该功能位于 通用 → 键盘 → 检查拼写。 Group 9 故障排除 部分常见问题的解决方案。 同步故障排除 如何处理冲突笔记 熊掌记的笔记储存在哪里 问题仍未解决？在博客、论坛上寻找答案，或直接给我们留言。 联系我们 订阅熊掌记月度资讯 订阅以获取熊掌记的小窍门和新资讯，以及更多信息和 Shiny Frog 幕后故事。我们永远不会发送任何垃圾邮件，但隔空熊抱我们管够！ 订阅 function subscribeToNewsletter(ele) { var mail = document.getElementById("newsletter-email").value; var mcURL = "https://shinyfrog.us1.list-manage.com/subscribe?u=11bfb68c5eebd7be7987b2076&id=c27eb96730&orig-lang=1&MERGE0="; mcURL += encodeURIComponent(mail); var w = (window.parent)?window.parent:window; var preurl = w.location; w.location.assign(mcURL); } document.getElementById("newsletter-submit").onclick = function(){ subscribeToNewsletter(); }; document.getElementById("newsletter-email").addEventListener("keydown", (event) => { if (event.keyCode === 13) { event.preventDefault(); subscribeToNewsletter(); return; } });'
