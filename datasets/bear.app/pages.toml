title = "How to Clip Web Pages"
description = "Discover how to turn webpages into Bear notes on iPhone, iPad and MacOS with our app extension or add-ons for Safari, Chrome, Firefox and Opera."
full_description = '''How to Clip Web Pages library Return to support library Bear can clip entire webpages and save them as notes: Mac Grab the web page content directly from your browser by installing Bear’s extension available for Safari, Google Chrome, and Firefox. iOS Clip a page by using Bear’s iOS extension and selecting Web Page Content from the top menu. How to Clip Web Pages library Return to support library Bear can clip entire webpages and save them as notes: Mac Grab the web page content directly from your browser by installing Bear’s extension available for Safari, Google Chrome, and Firefox. iOS Clip a page by using Bear’s iOS extension and selecting Web Page Content from the top menu. Group 9 Troubleshooting Some solutions to common problems. Sync Troubleshooting Conflicted Notes Bear's Database Still in trouble? Look for answers on the blog, forum or drop us a line. Contact us The Bear newsletter Sign up for tips about working in Bear, news about our apps, and more. No spam, ever. Maybe bear hugs, though. Subscribe function subscribeToNewsletter(ele) { var mail = document.getElementById("newsletter-email").value; var mcURL = "https://shinyfrog.us1.list-manage.com/subscribe?u=11bfb68c5eebd7be7987b2076&id=c27eb96730&orig-lang=1&MERGE0="; mcURL += encodeURIComponent(mail); var w = (window.parent)?window.parent:window; var preurl = w.location; w.location.assign(mcURL); } document.getElementById("newsletter-submit").onclick = function(){ subscribeToNewsletter(); }; document.getElementById("newsletter-email").addEventListener("keydown", (event) => { if (event.keyCode === 13) { event.preventDefault(); subscribeToNewsletter(); return; } });'''
