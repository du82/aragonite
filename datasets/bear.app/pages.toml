description = "探索熊掌记的 iOS 键盘快捷键，包括文字样式、结构、列表、日期以及导航等快捷键。iOS 快捷键适用于任何与 iOS 兼容的键盘。"
full_description = "iOS 快捷键 library 返回帮助页面首页 iOS 版熊掌记支持 iPad 和 iPhone 外接蓝牙键盘。你可以使用键盘进行添加格式、搜索，甚至在笔记中切换等操作。 记不住所有的快捷键？长按 ⌘ 键即可呼出快捷键速查表。当然，欢迎你保存并随时查阅这篇文档。 编辑器 文本样式 ⌘1 , ⌘2, ⌘3 - 标题 ⌥⌘S - 行分隔符 ⌘B - 加粗 ⌘I - 斜体 ⌘U - 下划线 ⇧⌘U - 删除线 ⌘K - 链接 ⌘L - 无序列表 ⇧⌘L - 有序列表 ⇧⌘T - 引用 ⌘T - 待办事项 ⌥⌘C - 代码 ^⌘C - 代码块 ⇧⌘M - 高亮/荧光笔 ⇧⌘E - 脚注 表格 ^⌘⏎ - 添加行 ⇧⌘⏎ - 添加列 ^⌘⌫ - 删除行 ^⇧⌘⌫ - 删除列 结构 ⇥ - 向左移动行 ⇧⇥ - 向右移动行 ⌘⌥↑ - 向上移动行 ⌘⌥↓ - 向下移动行 ⌘‘ - 折叠/展开 列表 ⇥ - 向右移动列表内容 ⇧⇥ - 向左移动列表内容 日期 ⇧⌘7 - 带时间的长日期格式 (2019年5月6日 15:52) ⇧⌘8 - 长日期格式 (2019年5月6日) ⇧⌘9 - 短日期格式 (2019/5/6) ⇧⌘0 - 小时时间 (15:52) 控制 ⌘A - 选择全部 ⌘⌥I - 切换信息面板 ⇧⌘A - 切换目录面板 ⇧⌘B - 切换反向链接面板 ⇧⌘K - 打开链接 导航 →/← - 打开/关闭嵌套标签 ⌘N - 创建新笔记 ↑ 和 ↓ - 移动选择（笔记列表、标签列表） ← 和 → - 在侧边栏、笔记列表、编辑器之间移动 ⌘O - 打开快速搜索 ⌘F - 将焦点移动到搜索栏（笔记列表） ↩︎ - 在笔记末尾开始编辑（编辑器） ⌘⌫ - 删除当前选定的笔记（笔记列表） ⌥⌘← - 在笔记最近打开历史中向后浏览 ⌥⌘→ - 在笔记最近打开历史中向前浏览 ⌥⌘1 - 在侧边栏中选择笔记 ⌥⌘2 - 在侧边栏中选择无标签 ⌥⌘3 - 在侧边栏中选择待办事项 ⌥⌘4 - 在侧边栏中选择今天 ⌥⌘5 - 在侧边栏中选择归档 ⌥⌘6 - 在侧边栏中选择废纸篓 ⌥⌘7 - 在侧边栏中选择已加密 窗口 ^1 - 仅显示编辑器 ^2 - 显示笔记列表和编辑器 ^3 - 显示侧边栏、笔记列表和编辑器"
