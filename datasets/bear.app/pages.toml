["https://bear.app/zh/faq/how-bear-pro-handles-conflicted-notes"]
title = "如何处理冲突笔记"
description = "为什么熊掌记的笔记会出现冲突问题？了解冲突笔记的发生原因、如何发现以及如何解决冲突并避免发生。"
full_description = "如何处理冲突笔记 library 返回帮助页面首页 在极少数情况下，当您订阅 Bear Pro 并成功同步后，部分笔记可能会产生一个有冲突的版本。如果发生这种情况，熊掌记将在「笔记列表」中显示所有受影响的版本，以便您查看并选择需要保留的版本。如有必要，您甚至可以在多篇笔记中移动拼接部分笔记内容，并保存最佳版本。 我们用这种方式处理冲突，以求避免意外丢弃任何数据。简而言之：即使是在当下，同步仍并非易事。 触发冲突的原因之一如下： 在某离线设备上编辑了一篇笔记，例如旅行时处于飞行模式的 iPhone。上述状态不变的情况下，在有网络的另一设备上编辑了同一篇笔记。当 iPhone 重新连接上网络并尝试同步您编辑的内容时——嘭！冲突就这样发生了！ 如果可能，请避免在两个设备上编辑同一篇笔记，除非它们都处于可以及时同步编辑内容的在线状态。 如何发现冲突 熊掌记会通过两种方式提醒您有关冲突笔记的问题，具体取决于您当前在「笔记列表」查看笔记还是在特定标签或搜索中查看笔记。 笔记列表中的冲突 发生冲突的笔记将被移动至「笔记列表」最顶端，甚至在置顶笔记的上方，且旁边会有“冲突”图标标记。您可以查看笔记，并在发生冲突的笔记之间进行必要操作，例如转移部分笔记内容至另一篇，直至其中一篇笔记成为您想要保留的最终版本，然后删除不需要的版本。 在其他地方发现冲突 如果您正在侧边栏浏览某一标签下的笔记或正在查看搜索结果，表示冲突的符号将会显示在标题旁边。要解决冲突，请轻按或点击侧栏最上方的“笔记”，然后滑动到“笔记列表”顶部。同上，有冲突的相关笔记将会被一条线相连接。请查看笔记，并移动拼接有需要的笔记内容，然后删除不需要的版本。"
year_published = 2025
clearnet = "https://bear.app/zh/faq/how-bear-pro-handles-conflicted-notes"
