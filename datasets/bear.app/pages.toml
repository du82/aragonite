eb content prefences this parameter is ignored. pin optional if yes pin the note to the top of the list. wait optional if no x-success is immediately called without identifier and title. x-success identifier note unique identifier. title note title. available values yes no example bear://x-callback-url/grab-url?url=https://bear.app Create and try /grab-url actions in seconds with our URL builder online Token Generation In order to extend their functionalties, some of the API calls allow an app generated token to be passed along with the other parameters. Please mind a Token generated on iOS is not valid for MacOS and vice-versa. On MacOS, select Help → Advanced →API Token → Copy Token and will be available in your pasteboard. On iOS go to the preferences → Advanced, locate the API Token section and tap the cell below to generate the token or copy it in your pasteboard. Support To discuss URL scheme improvements or reporting bugs please use our Support Form or Bear’s subreddit."
