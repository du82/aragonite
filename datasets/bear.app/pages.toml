["https://bear.app/faq/ios-keyboard-shortcuts"]
title = "iOS Keyboard Shortcuts"
full_description = "iOS Keyboard Shortcuts library Return to support library Bear for iOS comes with support for any external Bluetooth keyboard compatible with iPad or iPhone. There are quite a few options to format, search, and even navigate your notes. One easy way to see a cheat sheet for all these shortcuts in Bear is to hold the Command key (⌘) for a second. This document is another easy way. Editor Text Styles ⌘1 , ⌘2, ⌘3 - Headings ⌥⌘S - Line separator ⌘B - Bold ⌘I - Italic ⌘U - Underline ⇧⌘U - Strikethrough ⌘K - Link ⌘L - Unordered list ⇧⌘L - Ordered list ⇧⌘T - Quote ⌘T - Todo ⌥⌘C - Inline code ^⌘C - Code block ⇧⌘M - Highlighter/Marker ⇧⌘E - Footnote Tables ^⌘⏎ - Add Row ⇧⌘⏎ - Add Column ^⌘⌫ - Delete Row ^⇧⌘⌫ - Delete Column Structure ⇥ - Shift line right ⇧⇥ - Shift line left ⌘⌥↑ - Move line up ⌘⌥↓ - Move line down ⌘' - Toggle Folding* Note: The shortcut for Toggle Folding may vary based on your keyboard layout; refer to the menu for the correct shortcut for your specific layout, go to Menu > Format > Toggle Folding Lists ⇥ - Shift the list element right ⇧⇥ - Shift the list element left Dates ⇧⌘7 - Long Form Date with time (11 Jul 2017, 10:43) ⇧⌘8 - Long Form Date (11 Jul 2017) ⇧⌘9 - Short Form Date (11/07/2017) ⇧⌘0 - Hours (11:43) Control ⌘A - Select all ⇧⌘I - Toggle statistics panel ⇧⌘A - Toggle table of content panel ⇧⌘B - Toggle the backlinks panel ⇧⌘K - Open link Navigation →/← - Open/close nested tags ⌘N - Create a new note ↑ and ↓ keys - Move the selection (note list, tag list) ← and → keys - Move the selection between the sidebar, the note list and the editor ⌘O - Opens the Quick Open panel ⌘F - Move the focus to the search field (note list) ↩︎ - Start editing at the end of the note (editor) ⌘⌫ - Delete the currently selected note (note list) ⌥⌘← - Navigate back in visualized notes history ⌥⌘→ - Navigate forward in visualized notes history ⌥⌘1 - Select Notes in the sidebar ⌥⌘2 - Select Untagged in the sidebar ⌥⌘3 - Select ToDo in the sidebar ⌥⌘4 - Select Today in the sidebar ⌥⌘5 - Select Archive in the sidebar ⌥⌘6 - Select Trash in the sidebar ⌥⌘7 - Select Locked in the sidebar Window ^1 - Show editor only ^2 - Show note list and editor ^3 - Show sidebar, note list and editor"
