["https://bear.app/zh/faq/how-to-sketch-in-bear"]
title = "如何在熊掌记中添加和编辑速绘、选择多种样式的画布、使用 Apple Pencilkit 工具，并了解如何分享速绘。"
description = "了解如何在熊掌记中添加速绘"
full_description = "如何在熊掌记中添加和编辑速绘、选择多种样式的画布、使用 Apple Pencilkit 工具，并了解如何分享速绘。 library 返回帮助页面首页 熊掌记在 iPad 或 iPhone 上支持速绘功能。您可以在文本和其他文件之间添加速绘，编辑现有速绘，在其他应用程序间或与朋友分享速绘文件等等。 如何在熊掌记中添加速绘 在 iPad 或 iPhone 上，在任意笔记内轻按 BI~U~ 按钮，然后轻按速绘图标（一个波浪线样式的图标） 在出现的画布上开始速绘！ 自定义和分享速绘 点击速绘右上角的更多 (⋮) 菜单，选择画布选项、分享速绘以及清除或删除速绘。 如何编辑速绘 只需轻按笔记中速绘的任意地方，即可开始速绘。在编辑时，您可以使用样式栏中的按钮或键盘上的 ⌘ + Z 来撤销和重做之前的操作。 关于手写 你还可以在速绘中添加手写笔记，对于很多人来说，手写更能帮助记录时的直觉自由游走。但请注意，熊掌记目前不支持在速绘中进行手写搜索，仅支持搜索键盘输入的文本、标签以及日期等元数据。但我们正在考虑未来支持手写搜索功能。 小贴士和需要了解的事项 熊掌记中的速绘功能使用 Apple Pencilkit 工具，您可能在其他应用程序中也见过 您可以通过轻触并拖动工具栏将速绘工具栏移到屏幕的任一侧 熊掌记中可以使用 Apple Pencil 和几乎所有 iPad 兼容的触控笔 要用手指绘制，请在工具栏上按更多菜单，然后启用使用手指绘制 要在速绘画板的顶部获得更多空间，只需点击屏幕接近顶部的任何地方，然后在菜单中选择插入空间即可 要在手绘的底部获得更多空间，请点击底部把手工具图标并向下拖动"
