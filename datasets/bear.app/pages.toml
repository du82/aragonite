["https://bear.app/faq/how-tagcons-work"]
title = "How TagCons work in Bear"
description = "Learn how to assign custom tagcons to your tags and how they get automatically synced. You can also disable tagcons and discover the default tagcons for your language."
full_description = "How TagCons work in Bear library Return to support library Bear enhances the tags you add to your notes with a feature we call TagCons: small, identifiable icons that appear next to tags in the Sidebar. (Learn more about Bear’s tag system: How to use tags in Bear) How it works Bear has a growing library of TagCons, many which automatically appear next to popular tags like: writing, travel, business, games, ideas, and so on. Note: We cannot see your notes or tags. To build our list of popular tags with default TagCons assigned, we researched popular services like Twitter, Pinboard, Instagram, and others. Here’s how: iOS On iOS, here is how to access the TagCon picker: Long-press a tag in the Sidebar Select Edit tag Tap the current TagCon to reveal the TagCon library Browse or search for the TagCon that butters your bread Tap it Mac On macOS, here is how to access the TagCon picker: Right-click a tag in the Sidebar and choose Edit Tag In the Edit Tag popover that appears, click the TagCon swatch in the lower left Browse or search for the TagCon that floats your boat Click it Sync TagCons between devices To sync your TagCon choices between Bear on Mac, iPad, and iPhone, you’ll need Bear Pro. It unlocks sync (powered by iCloud), more export options, note encrption, and a growing library of beautiful themes and app icons to customize your writing environment. Display tagCons for another language If you are using Bear in your mother language but you want to also use another language keywords set, you can add a second language to your operating system’s preferred languages. For example, if you are using your operating system in Chinese and you want Bear to also display a special icon for #todo you can add English as second preferred language. This will make Bear display the same icon for both #todo and #待办事项. Do you have requests for more TagCons? Feel free to propose new TagCons or keywords, we always open to suggestions."
year_published = 2025
