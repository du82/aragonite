["https://bear.app/faq/migrate-from-obsidian"]
title = "Migrate from Obsidian App"
description = "Migrate your notes from Obsidian to Bear app on macOS with these easy step-by-step instructions."
full_description = "Migrate from Obsidian App library Return to support library To migrate your notes from Obsidian to Bear on macOS: Select File → Import From → Obsidian in Bear’s menu bar. You will be presented with an open panel reporting a few options. We suggest keeping the original creation and modification dates and using the file name as a title for a more consistent migration. Select the vault main folder and click Import Notes. Attachments The importer is supposed to import all the attachments regardless of how they are linked in Obsidian. Linked attachments e.g. [[curriculum.pdf]] will also be imported. Images or files connected via http/https links will not be automatically imported. Tags Regular in-note #tags will be imported in Bear along with YAML specified tags. Tags scripts or plugins will not be considered by the importer."
