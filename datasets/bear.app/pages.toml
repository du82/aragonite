["https://bear.app/faq/backup-restore"]
title = "Backup and Restore Your Notes in Bear"
description = "Learn how to backup and restore your notes in Bear on iOS and Mac devices. Backups are a fast way to safely secure the current state of your notes without risks."
full_description = "Backup and Restore Your Notes in Bear library Return to support library Bear can backup all your notes in single .bear2bk file and quickly restore later. If you have any encrypted notes with Bear Pro, they will also be saved in the backup in their encrypted form. To open or read these notes in Bear, you’ll need to know the password used to lock them. Mac Bear’s backup and restore features are under File -> Backup Notes… and Restore Backup. iOS Tap the more menu (⋮) at the top of the Sidebar and choose Backup all notes or Restore Backup. IMPORTANT! When you restore a backup, all notes currently in Bear, including trashed notes, will be permanently deleted. The imported notes will take their place. If you want to access your notes inside a backup file without restoring it, change the backup file’s extension from .bear2bk to .zip, then uncompress it. Inside the resulting folder, you will find a .textbundle file for each of your backed up notes. This can be easily done on a Mac with the Finder or in Files on iOS."
year_published = 2025
