["https://bear.app/zh/faq/export-your-notes"]
title = "以不同格式导出笔记"
description = "了解熊掌记的笔记导出选项。熊掌记支持一系列丰富的导出格式，包括纯文本、Markdown、textbundle、textpack、富文本、HTML、DOCX、PDF、JPG、ePub、Taskpapers，以及熊掌记笔记 bearnote 格式。"
full_description = "以不同格式导出笔记 library 返回帮助页面首页 免费版本的熊掌记和 Bear Pro 版本的熊掌记可以将一篇或多篇笔记导出为一系列格式。 使用免费版本的熊掌记可将笔记导出为下列格式： .txt - 纯文本 .md - Markdown .textbundle - Text Bundle V2 (Markdown) .bearnote - 熊掌记笔记 .rtf - 富文本 升级到 Bear Pro 之后，除了上述格式外，你还可获得下列格式选择，且未来还会支持更多格式： .html - HTML .docx - Microsoft Word 开放 XML 格式 .pdf - 便携式文件格式 .jpg - JPEG，适合在网络及社交媒体上分享的图片格式 .ePub - Open ebook 开放电子书发布格式 要在 Mac、iPad 或 iPhone 上使用导出功能，请点击笔记右上方的更多（⫶）按钮，选择导出。 导出多篇笔记 Mac： 按住 ⌘ 键并点击选择笔记列表中的多个笔记 前往菜单 文件 > 导出笔记… (⇧⌘S) iOS： 在笔记列表中用两根手指向右滑动 在“选择”视图中，轻触笔记来进行选择。您可以在屏幕顶部查看选择的笔记数量 轻按右下角的更多菜单（⫶）图标 在弹出菜单中选择导出… 要导出所有笔记： Mac： 在侧边栏中点击“笔记”项目 按下 ⌘A 以选择笔记列表中的所有笔记 转到 文件 > 导出笔记… (⇧⌘S) iOS： 在侧边栏中选择“笔记”部分 点击顶部带箭头的“笔记” 在弹出菜单中，点击 导出… 导出标签下的笔记 您可以将任意标签下的所有笔记一次性导出。具体操作详见：《导出标签下的所有笔记》。 自定义导出选项 熊掌记可提供的导出选项取决于导出的笔记内容以及您使用的设备是 Mac 还是 iOS。 将维基笔记链接转换为 HTML 链接 以 HTML 格式导出多篇以维基链接相互连接的笔记时，启用此选项将会使维基链接以 HTML 格式的链接显示。这些链接将变成可以正常运行的网页链接，您可以将其上传到任何虚拟主机中。 macOS：在菜单栏中选择文件→导出笔记… 在保存对话框中即可看到该转换选项。 以 HTML 格式导出笔记时保留图像内容 如果您想要以 HTML 格式导出笔记，可通过启用 base 64 选项将这些笔记中的图像内容嵌入 HTML 文件中。通过此方法您可以更简单地保存这些图像，免去单独管理图片文件的麻烦。 macOS：在菜单栏中选择文件→导出笔记…即可将笔记导出为指定格式。 在熊掌记 > 偏好设置 > 通用中可定制导出选项，包括“在导出过程中保留标签”功能。其他选项也可在导出对话框中调整。"
year_published = 2025
clearnet = "https://bear.app/zh/faq/export-your-notes"
