title = "Migrate from Drafts App"
description = "Migrate your notes from Drafts to Bear app on iOS or macOS with these easy step-by-step instructions. This will take you only a few minutes to complete."
full_description = '''Migrate from Drafts App library Return to support library To migrate your notes from Drafts to Bear: In Drafts for macOS: Select the draft(s) that you wish to migrate to Bear Select File → Export → As JSON… Choose a filename Click the export button. Here are more details about Drafts exports. Import into Bear In Bear for Mac, import your notes using File → Import From → Drafts and selecting the correct file. Migrate from Drafts App library Return to support library To migrate your notes from Drafts to Bear: In Drafts for macOS: Select the draft(s) that you wish to migrate to Bear Select File → Export → As JSON… Choose a filename Click the export button. Here are more details about Drafts exports. Import into Bear In Bear for Mac, import your notes using File → Import From → Drafts and selecting the correct file. Group 9 Troubleshooting Some solutions to common problems. Sync Troubleshooting Conflicted Notes Bear's Database Still in trouble? Look for answers on the blog, forum or drop us a line. Contact us The Bear newsletter Sign up for tips about working in Bear, news about our apps, and more. No spam, ever. Maybe bear hugs, though. Subscribe function subscribeToNewsletter(ele) { var mail = document.getElementById("newsletter-email").value; var mcURL = "https://shinyfrog.us1.list-manage.com/subscribe?u=11bfb68c5eebd7be7987b2076&id=c27eb96730&orig-lang=1&MERGE0="; mcURL += encodeURIComponent(mail); var w = (window.parent)?window.parent:window; var preurl = w.location; w.location.assign(mcURL); } document.getElementById("newsletter-submit").onclick = function(){ subscribeToNewsletter(); }; document.getElementById("newsletter-email").addEventListener("keydown", (event) => { if (event.keyCode === 13) { event.preventDefault(); subscribeToNewsletter(); return; } });'''
