title = "Export your Notes from a Tag"
description = "Learn how to export all notes from a tag in Bear."
full_description = "Export your Notes from a Tag library Return to support library Bear can export all notes from a tag in the Sidebar. If a tag has nested tags, they will be created as folders containing their respective notes. We apply some rules to help avoid duplicate notes during a nested tag export. For example, if a note is tagged #workout# and #workout/cardio#, when you’ll export #workout# the note file will appear only in the cardio subfolder. Mac Click a tag in the Sidebar Click File → Export Notes, or click ⇧⌘S iOS Long press on a tag in Sidebar, or tap on the Notes List header Tap Export... and select the desired format Bear will ask you to pick an export format and a location to save the exported notes."
