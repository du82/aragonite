["https://bear.app/zh/faq/how-to-use-tag-autocomplete-and-note-autocomplete"]
title = "标签自动完成与笔记自动完成功能"
description = "了解在熊掌记中如何使用标签自动完成以及笔记自动完成功能。自动完成功能让你不用从键盘上移开也可以快速插入标签和笔记作为引用。"
full_description = "标签自动完成与笔记自动完成功能 library 返回帮助页面首页 在熊掌记中，你可以在笔记中添加标签来管理笔记，便于日后查找。你还可以在笔记中链接到其他笔记方便参考，创建当前正在处理的笔记列表，甚至建立自己的小型维基百科。 熊掌记提供标签自动完成和笔记自动完成功能帮你减轻负担。这些功能可帮助您快速将现有标签应用到新笔记中，并创建正确的笔记链接。 标签自动完成 要使用标签自动完成功能： 在熊掌记的快捷键盘栏中轻按标签自动完成按钮 ( # ) 或者在笔记中的任意位置以 # 符号开始输入标签 建议框中会给出基于你现有标签的输入建议 滚动标签列表。你也可以输入一个字母才缩小建议内容的范围 轻按想要添加的标签 侧边栏中再也不会出现带有错别字的标签了！ 提示：如果你使用 Mac 或是在使用 iPad 时外接键盘，则可通过方向键滚动列表，并使用 Return 键选择标签。 笔记自动完成 笔记自动完成和标签自动完成的操作类似： 在自定义键盘栏中轻按“笔记自动完成”按钮（好像这样📄） 或在笔记中的任意位置以 [[ 符号开始输入笔记名称 建议框中会给出基于你近期笔记的输入建议 滚动笔记列表。你也可以输入关键字来缩小建议内容的范围 点按所需的笔记即会在当前笔记中插入链接"
