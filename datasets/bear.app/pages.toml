full_description = "如何在笔记中添加链接预览 library 返回帮助页面首页 链接预览是供您在访问网页前进行简要预览的缩略图，通常包括页面标题和一张具网页代表性的图片。当纯文本链接所能表达的信息有限时，视觉辅助工具提供了另一种实用的选择。 添加链接预览 在 Mac、iPad 和 iPhone 上 点击 B/I/U 图标 然后点链接按钮来打开链接工具 如果您的剪贴板上有链接，熊掌记会直接将链接粘贴到链接编辑板中。如果剪贴板没有链接，您可以直接输入或粘贴链接 点击 显示预览选项，然后选择完成 小贴士 隐藏链接预览 - 在 Mac 右键或在 iOS 上长按，选择隐藏预览 编辑带有预览的链接 - 点击链接右侧的铅笔图标"
