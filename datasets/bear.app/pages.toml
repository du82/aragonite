description = "关于如何在 macOS 和 iOS 端的笔记中插入文件、照片以及速写等附件的详细指引。在 iPhone 和 iPad 上你可以访问相机功能。"
full_description = "在熊掌记笔记中插入附件 library 返回帮助页面首页 你可以将任何文件添加到熊掌记中。每个文件都将以小框形式呈现，显示名称、修改日期和对应图标。图像和 PDF 文件会在笔记中进行预览显示。PDF 文件预览可以通过右键或长按菜单进行隐藏。 Mac 将文件拖放到编辑器中即可将其添加至笔记。在菜单栏选择格式→插入文件也可以达到同样效果。 小贴士：在任意一篇笔记中点击附件，然后按空格键即可预览附件内容。只要 macOS 系统支持该格式的 Quick Look （快速预览），不打开对应 app 你也可以对附件内容进行预览。 iOS 在熊掌记的 BI~U~ 键盘中轻按相机图标或附件图标可分别插入图片和文件。 重要说明 大于 250MB 的文件不会在设备间同步 加密笔记中暂不支持添加附件"
