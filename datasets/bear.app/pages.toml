title = "从 Drafts 迁移"
description = "跟随简单的步骤指引，在 iOS 或 macOS 上从 Drafts 迁移笔记至熊掌记。仅需几分钟即可完成导出导入的操作。"
full_description = '从 Drafts 迁移 library 返回帮助页面首页 要将笔记从 Drafts 迁移到熊掌记： 在 macOS 版 Drafts 中： 选择想要迁移至熊掌记的草稿笔记 选择 文件 File >导出 Export > As JSON... 选择文件夹 点击 导出 访问此处了解关于 Drafts 导出的更多信息。 导入到熊掌记中 在 Mac 版的熊掌记中，通过菜单 文件 → 导入来自 → Drafts 选择文件进行导入。 从 Drafts 迁移 library 返回帮助页面首页 要将笔记从 Drafts 迁移到熊掌记： 在 macOS 版 Drafts 中： 选择想要迁移至熊掌记的草稿笔记 选择 文件 File >导出 Export > As JSON... 选择文件夹 点击 导出 访问此处了解关于 Drafts 导出的更多信息。 导入到熊掌记中 在 Mac 版的熊掌记中，通过菜单 文件 → 导入来自 → Drafts 选择文件进行导入。 Group 9 故障排除 部分常见问题的解决方案。 同步故障排除 如何处理冲突笔记 熊掌记的笔记储存在哪里 问题仍未解决？在博客、论坛上寻找答案，或直接给我们留言。 联系我们 订阅熊掌记月度资讯 订阅以获取熊掌记的小窍门和新资讯，以及更多信息和 Shiny Frog 幕后故事。我们永远不会发送任何垃圾邮件，但隔空熊抱我们管够！ 订阅 function subscribeToNewsletter(ele) { var mail = document.getElementById("newsletter-email").value; var mcURL = "https://shinyfrog.us1.list-manage.com/subscribe?u=11bfb68c5eebd7be7987b2076&id=c27eb96730&orig-lang=1&MERGE0="; mcURL += encodeURIComponent(mail); var w = (window.parent)?window.parent:window; var preurl = w.location; w.location.assign(mcURL); } document.getElementById("newsletter-submit").onclick = function(){ subscribeToNewsletter(); }; document.getElementById("newsletter-email").addEventListener("keydown", (event) => { if (event.keyCode === 13) { event.preventDefault(); subscribeToNewsletter(); return; } });'
