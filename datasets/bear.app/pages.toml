["https://bear.app/faq/how-to-use-read-only-mode"]
title = "How to use Read-only Mode"
description = "Learn how to use Read-Only Mode in Bear to lock your notes for focused reading and avoid accidental edits with step-by-step instructions."
full_description = "How to use Read-only Mode library Return to support library Sometimes, you may want to read your notes without the risk of accidentally editing them. That’s where Read-Only Mode comes in. This feature allows you to scroll through your notes distraction-free, perfect for reviewing and reflecting. Enabling Read-Only Mode Open the note you want to set to Read-Only Mode. Tap or click the ⫶ menu in the top-right corner of the editor Select “More > Make Read-Only” A read-only icon will appear in the top-right corner to indicate the note is now locked for editing Disabling Read-Only Mode When you’re ready to make changes to your note: Tap or click the read-only icon in the top-right corner Select “Make Editable” You can now freely edit the note as usual Why Use Read-Only Mode? Avoid accidental edits when scrolling or reading through your notes Stay focused while reviewing your ideas Perfect for sharing notes without worrying about unintentional changes"
