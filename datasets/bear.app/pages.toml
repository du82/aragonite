["https://bear.app/zh/faq/ios-app-extension"]
title = "熊掌记的 iOS 应用扩展"
description = "iOS 版本的熊掌记自带应用程序扩展，让收集来自其它应用程序的文本、链接、照片、以及文件变得更简单。了解如何使用熊掌记 iOS 应用扩展。"
full_description = "熊掌记的 iOS 应用扩展 library 返回帮助页面首页 iOS 版本的熊掌记自带应用程序扩展，让您方便地收集来自其他应用程序的文本、链接、照片及文件。使用扩展很简单，在其他应用程序中按下 iOS 的分享按钮，在弹出的列表中选择 “熊掌记” 即可。 如果熊掌记未出现在列表中，则请点击最右侧的 “更多” 按钮，在出现的应用列表中找到 “熊掌记” 并启用它。 应用程序扩展中将显示可预览笔记并提供部分选项的对话框。按下保存即可创建新笔记，也可选择追加到…头部或追加到…尾部将内容加入已存在的笔记中。 抓取整个网页 熊掌记的 iOS 扩展可抓取整个网页内容。从浏览器中调用熊掌记扩展后，在顶部菜单选择网页内容并轻按保存。之后，熊掌记将会尝试获取网页内容并裁剪。 修改应用扩展程序偏好设置 您可以在熊掌记应用内部进行扩展程序设置。点击侧边栏底部的偏好设置，然后点击网页剪裁选项。 在此设置中，您可以： 选择在抓取网页时是否导入图像 将网页链接追加到笔记尾部 设置应用于笔记的标签 多个标签请使用逗号进行分隔，例如：网络，稍后阅读，摘抄 标签仅在保存整个网页内容时添加"
year_published = 2025
clearnet = "https://bear.app/zh/faq/ios-app-extension"
