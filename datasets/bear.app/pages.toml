full_description = "Hide notes with the Archive library Return to support library If there are notes that you don’t want to see anymore, but you don’t quite want to delete, you can archive them in Bear. The Archive appears in the Sidebar once you archive at least one note. Notes in the Archive do not appear in search results elsewhere, but you can select the Archive section and search its notes. If you have Bear Pro, archived notes will sync between your devices. How to archive a note Archiving a note works slightly differently depending on the device you’re using. iPhone and iPad Long press on a note in the Notes List Tap Archive Mac Right-click a note in the Notes List Click Archive"
