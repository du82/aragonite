["https://bear.app/faq/features-and-price-of-bear-pro"]
title = "Features and price of Bear Pro"
full_description = "Features and price of Bear Pro library Return to support library Bear Pro is a simple way to unlock great features and support our work so we can keep making Bear even better! Specifically, Bear Pro unlocks: iCloud sync for all your notes and TagCons across all devices Encrypt individual notes and lock Bear Advanced export options to PDF, HTML, DOCX, JPG Over two dozen beautiful themes to get the perfect cozy space to create, with more themes on the way Over a dozen app icons, including our fun beta icon OCR search for text inside PDFs and images How much does Bear Pro cost? You can subscribe to Bear Pro through either the App Store or Mac App Store. A single subscription covers all your devices that are signed into the same Apple ID: Monthly subscription - available for $2.99 Yearly subscription - available for $29.99 Both options include a 14-day free trial. How do I subscribe to Bear Pro? It’s easy to subscribe from your iPhone, iPad, or Mac. Mac Click on the button at the top right corner of the Sidebar to access Bear’s preferences. Select the Bear Pro tab and follow the instructions there. iPhone & iPad Tap on the Settings button at the bottom of the Sidebar, then tap on the Bear Pro header. You’ll see a quick summary of Bear Pro features and our privacy policy, along with the available in-app purchase options. All purchases are managed through your Account section in the Mac or iOS App Store. Once you subscribe to Bear Pro, the panel will display its expiration date and a button to access and manage all subscriptions connected to your Apple ID. Renewal and cancellation All subscriptions will renew automatically, so you don’t need to do anything. The App Store will also email you a notice a few weeks before renewal. The “Valid until” date in the Bear Pro Preferences Pane will always show the last day of the subscription. Please remember that the subscription is renewed automatically by Apple during the 24-hour period before the subscription expires. You can access your iTunes Store subscriptions at any time using the Manage Subscription button in Bear Pro Preferences Pane. This opens the App Store to the relevant page. If you cancel the subscription during the trial period, the subscription fee will not be charged. Prices may vary by location according to the country taxation and currency conversion from U.S. Dollars. Changes and refunds Once a Bear Pro subscription has been charged, there is no way to change or refund it from Bear—all transactions are handled by Apple. You can verify and cancel your active subscriptions at any time using the Manage Subscription button, which opens the relevant App Store page. You can also contact Apple customer service for any further information and request. Bear Pro does not need to be purchased on every device. Once activated, it will be automatically enabled on all your devices that share the same iCloud and iTunes credentials (Apple ID). Please note that, in some cases, this process might need a little time for the App Store to activate Bear on your other devices. If you don’t see activation on a particular device, try restarting it. Prices will be converted to different currencies accordingly to App Store policies and local tax regulations."
