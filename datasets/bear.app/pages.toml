["https://bear.app/zh/faq/how-to-lock-bear-for-privacy"]
title = "如何为熊掌记添加应用锁定"
description = "了解如何在 iPad、iPhone、Mac 上锁定熊掌记。添加应用锁后，只有通过触控 ID (touchID)、触控 ID (faceID) 或密码才能看到你的笔记。"
full_description = "如何为熊掌记添加应用锁定 library 返回帮助页面首页 Bear Pro 订阅用户可以锁定熊掌记，以此来免受「脖子长」的家人同事或朋友打扰。 在 iPad 和 iPhone 上熊掌记可以使用面容或触控 ID。在 Mac 端可以使用触控 ID（如有）。 在 iPad 和 iPhone 端启用熊掌记锁定功能 打开熊掌记 轻按（左侧）侧边栏底部的偏好设置图标 在 PRO 一栏中，选择加密与锁定 启用 触控/面容 ID 锁定熊掌记 （不同设备显示有所不同） 在 Mac 端启用熊掌记锁定功能 打开熊掌记 前往菜单 熊掌记 > 设置…，选择通用面板 勾选启动时锁定熊掌记 现在，当您下次打开熊掌记时，熊掌记会通过触控/面容 ID 进行身份验证以确保是本人操作。非本人操作则无法打开熊掌记。 重要提醒 请注意，熊掌记的锁定功能与 Bear Pro 选项中加密单篇笔记功能不同。锁定熊掌记并不会对您的笔记进行加密，它只是在访问熊掌记之前添加了身份验证。"
