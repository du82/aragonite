full_description = "在笔记历史浏览记录中快速导航 library 返回帮助页面首页 在 iPhone 和 iPad 的熊掌记中，有两种方法可以在笔记的历史记录中快速导航： 第一种：在笔记中轻按右上角的更多（⫶）菜单，选择 “显示/隐藏浏览导航” 。导航栏会出现在笔记上方，使用返回和前进在笔记历史记录之间进行切换。 第二种更简单快速：在屏幕的左右边缘用两根手指滑动。向右滑动可转到上一篇笔记，向下滑动可转到笔记开头，向下滑动可转到笔记开头，依此类推。"
