title = "如何使用归档笔记功能"
description = "熊掌记让您可以在侧边栏中的特殊「归档」类别中归档笔记。归档对于某些不想再编辑但又想保留以便未来需要的笔记来说非常好用。"
full_description = "如何使用归档笔记功能 library 返回帮助页面首页 如果你不想再看到某些笔记，但又不想删除，则可使用熊掌记的归档功能。 归档至少一篇笔记后，侧边栏中就会显示归档选项。 归档中的笔记不会出现在一般搜索结果中，但可以选择归档类别搜索其中内容。 如果您拥有 Bear Pro，则归档笔记也将在设备间同步。 如何归档笔记 根据所使用的设备，归档笔记的操作方式稍有不同。 iPhone 和 iPad 在笔记列表中的长按笔记 轻按归档 Mac 在笔记列表中右键单击笔记 单击归档"
