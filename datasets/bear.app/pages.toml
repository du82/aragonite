["https://bear.app/zh/faq/how-to-use-footnotes-in-bear"]
title = "如何使用脚注"
description = "了解如何在 Mac 和 iOS 版熊掌记使用脚注来对笔记的一部分进行补充和追加信息，并了解如何在脚注和引用处之间进行切换。"
full_description = "如何使用脚注 library 返回帮助页面首页 脚注 是一种在您的笔记中为某个主题追加补充信息的方式。每个脚注都有编号和链接，因此在文本和相应的脚注之间切换非常容易，脚注位于笔记底部。 小贴士：脚注会从 1 开始自动递增。 如何创建脚注 Mac 在光标位于文本旁边时，单击样式栏中的更多 (⋮) 菜单，然后单击脚注按钮。对于带键盘的 iOS 设备，也可以使用 Command + Shift + E 快捷键 熊掌记会在此处创建引用，并在底部添加脚注，同时光标会移动到笔记底部的脚注文本编辑处 编辑脚注内容 iOS 打开 BI~U~ 键盘，轻按脚注按钮 熊掌记会创建引用和底部的脚注，然后将您的光标移动到脚注文本编辑处 如何导航脚注 单击或轻按脚注的编号即可在笔记中的引用处和底部脚注之间快速进行导航。"
