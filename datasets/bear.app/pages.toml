full_description = "熊掌记的免费和高级主题 library 返回帮助页面首页 我们将熊掌记设计为一个非常舒适、优美的写作和收集笔记的地方。但由于每个人的写作方式都不同，我们增加了更多可选主题，这些主题可以改变熊掌记文字、样式和背景的颜色以及写作氛围。 一些熊掌记的主题灵感来源于在此行业的一些设计师们。您可以滑动到下方找到熊掌记主题的灵感源泉。 免费主题 熊掌记提供了一些免费的主题模式。它们应该可以让大多数用户开始喜欢上切换熊掌记主题来适应不同写作环境： 石墨红 石墨蓝 石墨黑 (与 macOS 的暗色模式非常配！) 高级主题 您可以订阅 Bear Pro 来解锁二十余种精美主题，未来还会不断推出新的主题。这些主题包括深色、浅色，以及不同颜色的主题，适合各种各样的写作环境。还有一款特别的名叫 “10” 的主题，是为 iPhone X 系列独特的深黑色 OLED 显示屏而设计的。 特别感谢 在此，Shiny Frog 团队想要对启发熊掌记主题灵感的设计师和开发人员表达诚挚的感谢： 光天化日 & 月黑风高 → Ethan Schoonover 焦虑模式 → 向 Panic 的 Coda 主题致敬 哥谭市 → Vasilij Schneidermann 德古拉 → Zeno Rocha 牙膏 → Cat Noone 钴蓝 → Wes Bos 枯叶 & 冰原 → Simurai 阿玉 & 阿玉·幻境 → Ike Ku 月华 → Bram de Haan 北 & 昼 → Sven Greb 灯塔 → Adhiraj Sirohi & Vasundhara Sharma 佛罗里达 & 布达佩斯 → Rosé Pine Collective 东京之夜 & 挪威之光 → Tokyo Night Collective 备忘录 & 深色备忘录 → 灵感来自 Apple 的备忘录 黑胶机 → Pavel Pertsev 拿铁 & 玛奇朵 -> Catppuccin 原子 → Obsidian-atom Collective 澄境 & 幽林 -> Sainnhe 10 & 甘道夫 & 鹿柴 & 无趣 & 学术派 → Shiny Frog"
