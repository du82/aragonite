["https://bear.app/zh/faq/features-and-price-of-bear-pro"]
title = "Bear Pro 的功能和价格信息"
description = "Bear Pro 物超所值吗？了解 Bear Pro 及其提供的高级功能。Bear Pro 熊掌记的高级版功能包括精美的主题、更多导出选项，熊掌记密码锁以及加密笔记等。"
full_description = "Bear Pro 的功能和价格信息 library 返回帮助页面首页 订阅 Bear Pro 来支持熊掌记团队的后续开发，更能轻松解锁众多高级功能： 在 Mac、iPad 和 iPhone 间通过 iCloud 进行同步 加密单篇笔记，锁定熊掌记 更多导出选项，如 PDF、HTML、JPG 以及 DOCX 等 二十余款精美的写作主题，还有更多主题在路上 十余款 App 图标，包括独特的 Beta 👀 图标 在附件和 PDF 中 进行 OCR 文本搜索 Bear Pro 的价格是？ 在 iOS 或 macOS 的 App Store 中完成订阅，只需一次订阅即可在登入同一 Apple ID 的所有设备解锁： 按月订阅 - ¥22 每月，赠送两周免费试用 按年订阅 - ¥198 每年，赠送两周免费试用 如何订阅 Bear Pro？ 通过 iPhone、iPad 或 Mac 简单几步操作即可。 Mac 点击侧边栏右上角按钮进入熊掌记偏好设置。选择 Bear Pro 面板，并按照指引进行订阅。 iPhone 和 iPad 轻按侧边栏底部的偏好设置按钮，然后轻按 Bear Pro 面板。 您将看到 Bear Pro 的功能介绍和我们的隐私政策，以及应用内的购买选项。您可以通过对应的 App Store > 账户 来管理您的订阅和购买。 当您成功订阅 Bear Pro 后，面板上会显示您的订阅到期日期，以及前往管理与您 Apple ID 相关联的所有订阅的按钮。 续订和取消订阅 所有订阅都将自动续订，不需要您额外操作。 App Store 也会在续订前几周通过电子邮件向您发送即将续订的通知。 Bear Pro 偏好设置面板中的“有效期至”为当前订阅期的最后一天。 请留意，在订阅到期前的 24 小时内，Apple 会自动为您续订。 您可通过 Bear Pro 偏好设置面板的管理订阅按钮随时查看和管理您的订阅，按钮将跳转 App Store 相关页面。 如果您在试用期内取消订阅，则不会被收取订阅费用。实际价格可能因您的所在地税率和美元汇率而有所差异。 变更订阅和退款 在针对订阅期的费用支付成功后，您无法在熊掌记应用内变更订阅或申请退款，所有交易均由 Apple 处理。您可以随时通过管理订阅按钮来确认或取消当前的有效订阅。您也可以联系 Apple 客户支持来获得更多信息与帮助申请。 每个设备需要单独订阅吗？ 您不需要为每台设备单独购买 Bear Pro。订阅激活后将自动在使用同一个 iCloud 和 iTunes 帐户（Apple ID）的所有设备上启用。请注意，在某些情况下， App Store 可能需要一些时间才能在其他设备上激活 Bear Pro。如果您在某台设备上未看到 Bear Pro 激活信息，请尝试重启设备。"
