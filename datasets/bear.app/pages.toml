title = "Mac 快捷键"
description = "macOS 的熊掌记为键盘爱好者提供了很多快捷键。快捷键让你手不离键盘也可以使用几乎所有应用内的功能。"
full_description = 'Mac 快捷键 library 返回帮助页面首页 请注意：有些快捷键会因设备语言和键盘排列而有所不同。 编辑器 文本样式 ⌘1 , ⌘2, … ⌘6 - 标题 ⌥⌘S - 行分隔符 ⌘B - 加粗 ⌘I - 斜体 ⌘U - 下划线 ⇧⌘U - 删除线 ⌘K - 链接 ⌘D - 维基链接 ⌘L - 无序列表 ⇧⌘L - 有序列表 ⇧⌘T - 引用 ⌥⌘C - 内联代码 ^⌘C - 代码区块 ⇧⌘M - 高亮/荧光笔 ⇧⌘E - 脚注 ⇧⌘V - 插入文件 表格 ⌥⌘T - 创建表格 ^⌘↓ - 添加行 ^⌘→ - 添加列 ^⌘⌫ - 删除行 ^⇧⌘⌫ - 删除列 待办事项 ⌘T - 待办事项 ⌘. - 切换待办事项状态（已完成↔︎未完成） 结构 ⌥⌘→ - 向右移动行 ⌥⌘← - 向左移动行 ⌘⌥↑ - 向上移动行 ⌘⌥↓ - 向下移动行 列表 ⇥ - 向右移动列表内容 ⇧⇥ - 向左移动列表内容 日期 ⇧⌘7 - 带时间的长日期格式 (2019年7月16日 15:01) ⇧⌘8 - 长日期格式 (2019年7月16日) ⇧⌘9 - 短日期格式 (2019/7/16) ⇧⌘0 - 小时时间 (15:02) 控制 ⌘A - 选择全部 ⌘↩︎ - 结束编辑 ⌘P - 打印笔记 ⇧⌘K - 打开链接 ⌘’ - 折叠 ⌥⇧⌘L - 复制笔记链接 ⌥⇧⌘I - 复制笔记识别码 缩放 ⌘+ - 放大 ⌘- - 缩小 ⌘0 - 实际大小 面板和搜索 ⇧⌘I - 切换信息面板 ⇧⌘A - 切换目录面板 ⇧⌘B - 切换反向链接面板 ⌘F - 在当前笔记内搜索 ⌥⌘F - 在当前笔记内搜索和替换 ⇧⌘F - 在当前笔记列表内搜索 导航 ⌘N - 创建新笔记 ⌥⌘N - 在新窗口中创建新笔记 ↑ 和 ↓ 键 - 在笔记和标签列表中移动选定内容 ← 和 → 键 - 在侧边栏、笔记列表、编辑器之间移动选定内容；打开/关闭嵌套标签 ↩︎ - 编辑选定的笔记 ⌘⌫ - 删除选定的笔记 ⌘O - 打开快速搜索 ⇧⌘R - 恢复选定的笔记 ⇧⌘P - 置顶/解除置顶选定的笔记 ⌘A - 选择列表中的全部笔记 ⇧⌘⌫ - 清空废纸篓 ⌥⌘1 - 在侧边栏中选择笔记 ⌥⌘2 - 在侧边栏中选择无标签 ⌥⌘3 - 在侧边栏中选择待办事项 ⌥⌘4 - 在侧边栏中选择今天 ⌥⌘5 - 在侧边栏中选择已加密 ⌥⌘0 - 在侧边栏中选择废纸篓 ⌥⌘9 - 在侧边栏中选择归档 ⌘[ - 在笔记浏览历史中向后浏览 ⌘] - 在笔记浏览历史中向前浏览 保存和导入 ⇧⌘S - 导出选定的笔记 ⇧⌘O - 导入笔记 窗口 ^1 - 仅显示编辑器 ^2 - 显示笔记列表和编辑器 ^3 - 显示侧边栏、笔记列表和编辑器 ⌘, - 显示偏好设置 ^⌘F - 进入全屏幕 ⌘\ - 打开主窗口'
