["https://bear.app/zh/faq/how-to-use-siri-shortcuts-with-bear"]
title = "Siri 快捷指令和熊掌记"
description = "了解如何利用快捷指令 app 使用熊掌记，例如获取一篇特定的笔记、获取特定标签、查找含有待办事项的笔记、打开“今天”项目下的笔记、无标签笔记等。"
full_description = "Siri 快捷指令和熊掌记 library 返回帮助页面首页 Apple 的快捷指令 是一种通过多个步骤简化任务的功能。通过熊掌记扩展程序将网络文章保存到熊掌记，添加 #稍后阅读 这样的标签，然后与朋友分享该文章——这一系列动作你只需在屏幕上轻轻一按，或语音命令 Siri 通过触法快捷指令即可完成所有操作。 熊掌记的快捷指令适用于 iPhone、iPad 和 Mac（自 2021 年的 macOS Monterey 起）。您可以从快捷指令 app、ShortcutsGallery、 RoutineHub、 捷径社区等第三方社区或互联网上的任何地方下载新的快捷指令。 我们在下方总结了熊掌记快捷指令可执行的操作： 获取特定笔记或标签 打开特定笔记、标签或侧边栏项目（今天、待办事项、归档等） 删除、归档或置顶笔记 向笔记添加文件、文本或标签 获取笔记中的文件 创建一个带有文本或链接的新笔记 搜索所有笔记 搜索标签 移除标签 导出笔记 制作备份（仅支持 macOS） 熊掌记快捷指令示例 我们制作了一些快捷指令，您可以下载、编辑和试用。 【分享笔记内文件】- 自动抓取笔记内的图片和文件，并通过 iMessage 快速发送给好友。（提示：在熊掌记笔记列表中右键或长按笔记即可复制笔记识别码） 【获取 PDF 文字内容并创建笔记】- 在“文件” app 或类似 app 的分享菜单中使用这个捷径可以自动复制 PDF 的文字内容并粘贴至熊掌记的新笔记中 【表情笔记】- 这个捷径会自动打开前置摄像头进行自拍，询问你此时此刻的想法，并添加到以日期为标题的新笔记中 创建你的快捷指令 创建快捷指令上手很简单。当您添加操作时，快捷指令 app 将根据您在该设备上经常执行的操作进行建议： 打开 Apple 的快捷指令 app 轻按加号 (+) 以创建新的快捷指令 在搜索面板中，点击 App 选项卡 轻按熊掌记 自由发挥吧！ 注意事项 由于隐私原因，快捷指令无法访问已加密的熊掌记笔记（需要订阅 Bear Pro）。 Apple 有时会自主为一些 app 创建自动化操作，然而这些由 Apple 发布的操作并不在我们的可控范围之内。我们建议您在使用快捷指令时避免使用以下操作：“创建熊掌记笔记”、“从 URL 创建熊掌记笔记”、“打开熊掌记笔记”以及“在熊掌记中搜索”。"
year_published = 2025
clearnet = "https://bear.app/zh/faq/how-to-use-siri-shortcuts-with-bear"
tags = ["apple", "frog", "shiny", "siri", "创建你的快捷指令", "快捷指令和熊掌记", "故障排除", "注意事项", "熊掌记", "熊掌记快捷指令示例"]
