["https://bear.app/zh/faq/bear-is-gdpr-compliant"]
title = "熊掌记对 GDPR 的合规性"
description = "熊掌记遵循 GDPR 法规。了解熊掌记与当前 GDPR 法规的合规性。熊掌记符合 GDPR。熊掌记隐私法规。熊掌记应用。"
full_description = "熊掌记对 GDPR 的合规性 library 返回帮助页面首页 《通用数据保护条例》（GDPR）是欧洲联盟（EU）法律的一套重要新法规，于 2018 年 5 月 25 日生效。简而言之，这是一套新规则，赋予消费者更多对其个人数据和隐私的控制权。由于这些规则适用于在线服务，它们适用于几乎所有在线运营的公司、应用程序和服务，包括熊掌记。 以 GDPR 为例，收集个人数据（如姓名、电子邮件地址和在线活动）的公司必须明确披露正在收集的数据、收集方式、保留时间以及是否与第三方分享。这些公司还必须以人类可读的格式提供此数据供用户下载。GDPR 还制定了许多其他规定，因此我们鼓励您查看百度上的的相关条目。 熊掌记对 GDPR 的合规性 无须多言，Shiny Frog 团队一直以来都认真对待您的隐私权益。我们非常骄傲熊掌记从始至终都符合 GDPR 规定。让我们在这里概述一下主要内容： 熊掌记不收集任何个人数据。 如果熊掌记发生崩溃，我们会收集匿名的、符合 GDPR 标准的崩溃日志，以便修复错误并改进熊掌记。 目前熊掌记不会在我们控制之下存储任何数据。打开即用，熊掌记仅在您的设备上本地存储您的笔记。如果您订阅 Bear Pro，熊掌记使用苹果的 iCloud 服务（该服务符合 GDPR）在您的设备之间同步笔记。虽然我们正在开发 Web 应用，但我们正在以 GDPR 政策为核心构建它。 您的所有熊掌记数据都可以导出为多种便携、用户可读的格式。 我们唯一看到个人数据的时候是当有人自愿在我们的资讯订阅中输入其电子邮件或联系我们获取支持。我们的邮件服务由 MailChimp 提供，这是一个符合 GDPR 的服务商。我们不会出售或以其他方式分享从支持请求中看到的任何个人信息。 用户可以轻松从 iCloud 中删除熊掌记数据：在本地设备上找到 iCloud，iPhone 和 iPad 用户可以在设置 > 个人 Apple ID > iCloud > 管理账户储存空间中执行此操作。Mac 用户可以在系统设置 > 个人 Apple ID > iCloud > iCloud 云盘 中找到此选项。"
year_published = 2025
clearnet = "https://bear.app/zh/faq/bear-is-gdpr-compliant"
