["https://bear.app/zh/faq/where-are-bears-notes-located"]
title = "熊掌记的笔记储存在哪里"
description = "了解在 iOS 和 macOS 上熊掌记的笔记储存在哪里。熊掌记的笔记储存在 SQLite 数据库中，macOS 你可以在文件系统中找到笔记储存的准确的位置。"
full_description = "熊掌记的笔记储存在哪里 library 返回帮助页面首页 在 iOS 和 macOS 设备上，熊掌记的笔记文稿都存储在 SQLite 数据库中。在 iOS 设备上，由于系统存储机制的限制，您无法访问该数据库。但是在 macOS 中，您可以使用支持 SQLite 的第三方应用访问。 macOS 中，熊掌记的数据库位于： ~/Library/Group Containers/9K33E3U3T4.net.shinyfrog.bear/Application Data/database.sqlite 如果您想要对熊掌记的数据库进行操作，请注意： 对于大多数用户来说，在大多数情况下，我们强烈建议用户避免对数据库进行操作。但是如果您决定这么做，为了来降低熊掌记数据库被破坏的可能性，您需要注意以下几点： 如果您要对熊掌记数据库操作，先创建一个备份来避免可能发生的问题和潜在的数据损坏； 数据库架构的任何改变，都可能造成熊掌记在版本迁移时，出现无法迁移数据库的情况，还会有潜在的数据丢失； 一些数据的改变会导致熊掌记崩溃等问题，尤其是标识位和外键。 我们强烈建议您先退出熊掌记应用，再进行数据修改操作。如果应用正在运行，很有可能发生数据丢失。 总的来说，只有出于读取数据的目的访问数据库才是安全的。"
year_published = 2025
