["https://bear.app/zh/faq/how-to-use-widgets-with-bear"]
title = "如何使用熊掌记小组件"
description = "了解如何在 iOS 14, iPadOS 14 和 macOS 14 Sonoma 使用熊掌记小组件。熊掌记小组件包含五种类型，并拥有三种不同尺寸。了解熊掌记小组件的使用限制和注意事项，例如无法展示加密笔记。"
full_description = "如何使用熊掌记小组件 library 返回帮助页面首页 小组件是一种在主屏幕或桌面上查看应用程序中少量信息的方法。例如：天气信息快讯，收藏的照片或当天的待办事项。 熊掌记拥有一些实用的小组件，普通用户和 Bear pro 订阅用户均可免费使用。现在让我们一起看看小组件如何添加、有何用处，以及一些其他详细信息。 如何添加和编辑小组件 小组件的工作方式因设备而异，因此 Apple 对 iPhone、iPad 和 Mac 均有单独的说明。点击相应链接即可了解如何将小组件添加到您的设备中。 当您在设备上添加熊掌记的小组件后，点击或轻按即可选择该小组件显示的内容。请参见下面的示例。 熊掌记的小组件 我们为熊掌记提供了大小不一，功能各异的小组件，并且还在增加中： 单篇笔记小组件（小/中/大）：将含有列表、待办或文字段落的单篇笔记显示在主屏幕上。选择小组件，点击或轻按将其翻转，然后从熊掌记中选择一篇笔记。 侧边栏小组件（小/中/大）：浏览侧边栏某一条目下最近笔记的关键信息，可选择：笔记，无标签，待办事项，今天，或任意一个你的标签。点击小组件里的任一笔记即可在熊掌记中打开，点击小组件底部标签即可直接打开该标签下的笔记列表。 搜索小组件（小/中/大）：快速查看熊掌记中与搜索条件相匹配的最近笔记。另外，点击底部标签就能直接在熊掌记中打开搜索结果。 创建笔记：快速启动熊掌记并创建一篇新笔记，并直接进入编辑 查找笔记：快速启动熊掌记的搜索栏，直接输入关键词或 #标签 来查找笔记 随机笔记（小/中/大）：在指定位置下打开一篇随机笔记 适用于 iPhone 和 iPad 的锁屏小组件 在 iPhone 和 iPad 的锁屏状态下还有这些小组件选择： 创建新笔记：在熊掌记中创建一篇全新的笔记 待办事项笔记：添加一个带有待办事项的新笔记 单篇笔记：选取一篇笔记并从锁屏快速访问 上一篇笔记：快速访问最近编辑的笔记 随机笔记：在指定位置下随机打开任意一篇笔记 搜索：打开熊掌记并快速启动熊掌记搜索 小组件的限制以及注意事项 Mac 现已支持桌面小组件 macOS 14 Sonoma 添加了对桌面小组件的支持。之前版本仅支持在通知中心显示小组件。 熊掌记的小组件无法展示加密笔记。 笔记加密是 Bear Pro 的高级功能。出于隐私保护原因，熊掌记小组件无法展示加密笔记的内容。"
