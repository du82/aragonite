["https://bear.app/faq/migrate-from-evernote"]
title = "Migrate from Evernote"
description = "Discover how to migrate your notes from Evernote to Bear app. Move all your notes from Evernote to Bear app. How to move notes from Evernote to Bear Notes App."
full_description = "Migrate from Evernote library Return to support library To import your notes from Evernote you just need to perform a couple of steps: Export your Evernote notes into a .enex archive following this export guide Import the .enex inside Bear On macOS you can import your notes by selecting File → Import From → Evernote from the menu bar. On iOS you can access to the importers by going to Import in the … menu on the sidebar. The .enex format does not include information about your notebooks. If you want to keep the notebook name as a reference in Bear, we suggest you add a tag to your notes in Evernote before exporting them. The .enex does retain the notes you trashed in Evernote; please consider emptying Evernote’s trash before exporting. To Migrate your Evernote’s notebooks to Bear you can use tags. Create a new note in Bear with a tag for every notebook (e.g. #notebook1, #notebook2, #notebook3, etc…). Export each notebook in an enex file and import them one by one. After every import, drag and drop the new notes to the corresponding tag. Use the search to find the newly imported notes (e.g. to find the notes which do not belong to #notebook1 and #notebook2 search for -#notebook1 -#notebook2)."
year_published = 2025
clearnet = "https://bear.app/faq/migrate-from-evernote"
