description = "了解如何从侧边栏的标签处导出标签下的所有笔记"
full_description = "导出标签下的所有笔记 library 返回帮助页面首页 熊掌记可以从侧边栏中的标签中导出该标签下的所有的笔记。如果标签有嵌套标签，在导出文件中将以文件夹形式进行嵌套。 在嵌套标签导出过程中，我们应用一些规则来避免重复导出笔记。例如，如果一个笔记包含#运动#和#运动/有氧#两个标签，当你导出#运动#时，该笔记文件将只出现在有氧子文件夹中。 Mac 在侧边栏中点击一个标签 点击菜单文件 → 导出笔记，或直接使用快捷键 ⇧⌘S iOS 长按侧边栏中的标签，或点击笔记列表上端的标签名称 轻按导出... 并选择所需格式 熊掌记将要求您选择一个导出格式和保存导出笔记的位置。"
