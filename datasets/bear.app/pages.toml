h our URL builder online /trash Move a note to bear trash and select the Trash sidebar item. This call can’t be performed if the app is a locked state. Encrypted notes can’t be used with this call. parameters id optional note unique identifier. search optional string to search. show_window optional if no the call don’t force the opening of bear main window (MacOS only). example bear://x-callback-url/trash?id=7E4B681B bear://x-callback-url/trash?search=old notes The search term is ignored if an id is provided. Create and try /trash actions in seconds with our URL builder online /archive Move a note to bear archive and select the Archive sidebar item. This call can’t be performed if the app is a locked state. Encrypted notes can’t be accessed with this call. parameters id optional note unique identifier. search optional string to search. show_window optional if no the call don’t force the opening of bear main window (MacOS only). example bear://x-callback-url/archive?id=7E4B681B bear://x-callback-url/archive?search=projects notes The search term is ignored if an id is provided. Create and try /archive actions in seconds with our URL builder online /untagged Select the Untagged sidebar item. parameters search optional string to search. show_window optional if no the call don’t force the opening of bear main window (MacOS only). token optional application token. x-success notes json array representing the untagged notes. [{ title, identifier, [tag, ...], modificationDate, creationDate, pin }, ...] Encrypted notes will be excluded from the notes array. If token is not provided nothing is returned. example bear://x-callback-url/untagged?search=home Create and try /untagged actions in seconds with our URL builder online /todo Select the Todo sidebar item. parameters search optional string to search. show_window optional if no the call don’t force the opening of bear main window (MacOS only). token optional application token. x-success notes json array representing the todo