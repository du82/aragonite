title = "How to add Link Previews to Bear notes"
full_description = "How to add Link Previews to Bear notes library Return to support library Link Previews are thumbnails that offer a visual peek at a webpage before you visit. They usually include the title and a prominent photo from the page. These are an alternative to simply linking text for times when a visual aid can be useful. Add a Link Preview On Mac, iPad, and iPhone Click the B/I/U button then the link button to display the link tool If a link is on your clipboard, Bear will automatically place it in the tool. Otherwise you can type or paste a link Click the Show Preview option, then Done Tips & Things to Know To hide an existing Link Preview in a note, Right-click (Mac) or long-press (iOS) on it and choose Hide Preview To edit a Link with preview, click the pencil icon in the lower right"
