full_description = "The Apocalypse Archive 43-48 By Bearded-Devil On May 17, 2023 In Roleplaying Map Close-Up Soundtrack for areas 43-48 Combat Music Overview Previous: Areas 1-6, Areas 7-12, Areas 13-18, Areas 19-24, Areas 25-30, Areas 31-36, Areas 37-42 43. The Stoneflesh Maze The light here is strange. Wrong. Shadows seem to bend in peculiar directions. The air tastes of something unfamiliar, unplaceable. You feel suddenly unsure of how you got here, unsure if you are even awake. Is this a dream? Beyond the curtain, an otherworldly emptiness yawns, a starless black void. Suspended within it is an impossible intricate labyrinth of platforms, stairs, and walkways linked together in ways that defy the familiar natural order. Your mind aches even looking at the impossibly snarled architecture of the place, the walls of which pulse and throb with countless veins, a strange maze somewhere between flesh and stone. Some connect to bizarre structures that seem to hover in space. The song of the music box is louder, echoing from somewhere deeper within this unsettling place. A narrow stair winds up from the landing on which you stand to the rest of the maze. Your body feels different, here – lighter – more plastic, as if something had occurred to the matter that made you up, or perhaps as if that matter were suddenly subject to different physical laws. The demiplane of Excessus is not inside the Old City. Thus, the effects of Anachronosis, Dreams of a Dead Empire, and the Melchior Effect do not apply. Anyone suffering from stage 6 Anachronosis will not willingly enter the plane, since it would mean leaving the Old City. Doors never stonephase into the plane. All Heal and Wound spells are twice as effective in Excessus. Anyone who falls into the void eventually finds themselves lost in the Sea of Slumber, an oneiric ocean and interplanar conduit fed by rivers from the Dreamlands and the Netherworld. If they are lucky, they might be picked up by a passing vessel of the Oneiroi, who will take them to one of the ports in the Dreamlands. Less fortunate swimmers might be fished from the sea by one the barges of the damned bound for Pandemonium, or by some of the denizens of Excessus. Others still may drown in the sea of endless sensations, memories, suffering, ecstasy, and fantasy. Upon first entering Excessus, roll 1d8 to determine the starting hour. The plane tracks time in 13-hour increments; track the time with a d20. Navigating the Stoneflesh Maze is difficult. Rather than attempting to narrate every twist and turn – a potentially tedious activity for the Referee and player, especially given the twisted physics of the maze – the party can nominate someone to make decisions about which way to turn, who then makes Intelligence check with disadvantage to reach one of the distant landmarks visible upon entering, such as the Supper Club (area 46) or Meatchess board (area 44). On a success, the landmark is reached; on a failure, an hour is wasted, and the party rolls to see if they encounter something on the following table. Roll (1d12)Encounter1A roaming pack of 3d4 dogmen has sighted you and is now tracking you through the maze. These twisted creatures were once humans but have gradually transformed into quasi-canines, their bodies bristling with scabrous patches of mangy fur, bones reshaping from habitual quadruped locomotion, mouths become fanged muzzles. Despite their partial metamorphoses, they are still disturbingly human. They can speak various tongues but prefer to bark. An Intelligence save with disadvantage avoids the dogmen for 1 hour, but they will continue harrying the party while they remain in Excessus.2A False Archway appears to lead into a tunnel; in actuality, the archway is a devouring maw in disguise. This requires an Intelligence save to detect as one enters the archway. On a failure, the archway closes after 1d4 individuals enter, revealing itself as a fanged mouth. A monstrous tongue whips out of the darkness. Each round, those inside the False Archway must make a Dexterity save or sustain 1d4 damage from chewing. 3The Celebrant Sinthome (area 45) wanders here, an ever-shifting creature whose precise bodily configuration alters when unobserved. They beg passersby to inflict pain upon them in exchange for guidance, leading them to a location of their choice within Excessus without need of another roll. See area 45 for details if one of the characters tortures the Celebrant. 42d4 members of the Supper Club (area 46) taking a constitutional, attending by 1d6 Servants. They invite passersby to dinner. If this invitation is refused or the party is impolite, the Gourmands will attempt to make them a between-meal snack. 5The Hungry Wind blows through the Stoneflesh Maze, requiring all who hear the horrid gnashing of its endless mastication to make an immediate Constitution save or take 1d6 piercing damage, bites appearing all over their bodies. Those who fail by 5 or more must also make a Strength save or be blown from their location, followed by a Dexterity save to avoid 1d6 falling damage as they land somewhere lower in the maze and must make an Intelligence check of their own with advantage to rejoin the party. If they critically fail both saves, they fall int the void (see above). 6A group of 2d6 Fettered clatter through the maze on some errand of Concatenatus, the Hedonarch of this particularly fiefdom of Excessus. They appear as grey-skinned, hairless humanoids whose bodies have been pierced and wrapped with numerous chains, each trailing an impossibly long chain all the way back to the Palace of Chains (area 50). They attempt to restrain all they encounter to bring back to the Palace. If slain, a Fettered is pulled back to the Palace. 7The Red Rain begins to fall. It tastes of iron and salt and forbidden desire. Those without mouth protection or who fail to take shelter may accidentally taste the rain and must pass a Wisdom save to avoid succumbing to a mania for violence. Those so possessed must attack the nearest creature and also regenerate for 1d4 Hit Points each round. Each round they make a fresh save to shake the effects of the Rain. The Red Rain continues to fall for 1d20 rounds. 8Although you do not reach your destination, you reach somewhere else instead. Roll 1d4: (1) you are back where you started; (2) you at the exit; (3) you are at the next nearest major location in Excessus; (4) you are at another randomized location in Excessus. 9You have become snared in an Infinite Loop which does not want to relinquish you. You must pass an Intelligence save with double disadvantage to exit the loop, each attempt taking an hour, unless you attempt to leap, fly, teleport, or otherwise navigate the maze. 10A flock of paincrows flies overhead, looking for positive feeling to consume. They speak with the voices of lost loves, dead friends, and childhood bullies. 11A Man o’ Joy drifts through the void, a pulsating jellyfish-like entity like a huge, pink hot air balloon crossed with a gigantic, beating heart, trailing a multitude of quivering, fleshy tendrils. It murmurs and coos disturbingly and seeks to caress those below. A creature absorbed by the Man o’ Joy who survives retains disturbing memories of its former victims, whose minds seem to have merged to form the being’s consciousness. 12A hairless cat with the face of a cruel child appears, licks its paw, and begins slinking through the maze, running away if chased. If followed, the cat leads the party to wherever they were seeking. If ignored, the party gains an additional die of disadvantage on its next check to navigate the maze. If killed, the cat curses the party to eternal double disadvantage while navigating the maze. Dogman, HD 1 (Hit Points 6), Bite (Str, 1d6), Speed 30 ft., Str 12 Dex 11 Con 13 Int 6 Wis 12 Cha 4. Pack: When dogmen are flanking a foe, their Bite damage has advantage. Tracking: Once dogmen have scented a party, they follow it unerringly unless destroyed or somehow deterred. They have advantage to Wisdom checks to discover hidden foes, using scent to do so. Regenerating: Dogmen regenerate 1d2 Hit Points every round unless damaged by holy water or a Cultist’s Smite or Exorcism. They are considered fiends for the purposes of spells and magic items. Tongue, HD 3 (Hit Points 16), Lash (Str, 1d8, 20-foot reach), Speed 0 ft., Str 14 Dex 6 Con 14 Int 1 Wis 4 Cha 1. Fettered, HD 2 (Hit Points 12), Armour 1d3, 2 Chains (Dex, 1d6, reach 20 feet), Speed 30 ft., Str 11 Dex 13 Con 14 Int 4 Wis 13 Cha 4. Fetter: If one of the Fettered hits with an attack, the opponent must make an immediate Strength or dexterity save to avoid being grappled and restrained. From that point on they can use the Escape action with disadvantage to try and get free. Regenerating: The Fettered regenerate 1d2 Hit Points every round unless damaged by holy water or a Cultist’s Smite or Exorcism. They are considered fiends for the purposes of spells and magic items. Flock of Paincrows, 3 HD (18 Hit Points), Peck (1d6), Speed fly 30 ft., Swarm (half damage from mundane weapons), Str 6, Dex 14, Con 12, Int 7, Wis 13, Cha 13 Fiends: Paincrows are considered fiends for the purposes of spells and magic items. Swarm: The flock deals damage automatically to one creature which it follows but can be repelled for half damage by brandishing a weapon or torch, the latter of which damages the flock. Tormenting Cry: The cry of the paincrow drains all joy. Instead of attacking, the flock can torment a target by spewing the most hurtful things others have ever spoken to them, reliving old memories, or plaintively calling out for help in pitiful mimicry of those the target grieves. The target must pass a Charisma save or sustain 1d4 Charisma damage. This regenerates at a rate of 1 per day. A creature reduced to 0 Charisma becomes catatonic and will be devoured by the crows. Man o’ Joy, 6 HD (42 Hit Points), Armour 1d4, 6 Tendrils (Str, see below), Speed fly 20 ft., Str 15, Dex 6, Con 14, Int 13, Wis 13, Cha 13 Absorb: If the Man o’ Joy has someone in its tendrils, it can use an action to pull them up into its body, absorbing them. While so absorbed, creatures take 1d6 acid damage every round. An absorbed creature can be freed by killing the Man o’ Joy or by dealing at least 10 damage with a slashing weapon. If a creature regains control of themselves while inside the Man o’ Joy they can attempt to escape with a Strength check with disadvantage or by dealing 10 damage with a slashing weapon, hitting the creature automatically and ignoring armour. Ecstasy: If the Man o’ Joy hits with a tendril, the target must pass a Charisma save or become filled with all-consuming pleasure for 1 minute, making all other action impossible. A target so delirious is restrained by the tendril. Gigantic: The Man o’ Joy is Big in size and has a 20-foot reach. Attacks against it by smaller creatures hit automatically. Regenerating: The Man o’ Joy regenerates 1d6 Hit Points every round unless damaged by holy water or a Cultist’s Smite or Exorcism. It can be considered a fiend for the purposes of spells and magic items. 44. Meatchess An enormous chess set of irregular dimensions hovers impossibly in space, surrounded on all sides by the labyrinth. A variety of malformed creatures that seem to be hybrids of chess piece and humanoid are arrayed on the board. One side are skinless, flensed things with the heads and hooves of horses, their bodies livid red. The other side are skeletal, nothing but sinews and carven bone, strange growths like bishop’s mitres or crenellated battlements emerging from their swollen skulls. These sides of Flesh and Bone are each commanded by a gruesome King, each wearing a grotesque crown. The game being played here is like some awful parody of chess. The rules seem different than the standard ones, and when pieces take each other, they physically fight, stabbing, trampling, or hacking each other to death. The board is spattered with blood and strewn with broken bones. Various Celebrants often linger about the chessboard to spectate; Meatchess is a kind of decadent entertainment for the Celebrants. If they see the party, the Kings of Flesh and Bone call out: “Bold champions! Come, prove yourself on the battlefield. Rich reward awaits you!” If they step onto the board, they become participants in the game according to which side of the board they have stepped upon – there is a single rank of 13 spaces that is totally neutral dividing the two sides of 6×13 spaces each. Once they have picked a side, the party members, replace one of the Royal pieces according to the profession with the highest level, or the ability score with the highest score if they have equal levels in more than one profession: Ability Score/ProfessionChess Piece Strength/FighterCentaur: can move any number of Knight moves in any direction. Dexterity/ThiefGargoyle: Can move along like a Queen but must always hop over another piece, landing on an unoccupied space beyond it or taking the enemy piece it finds there. Constitution/GuardianFortress: Can move as either a Rook or a Knight. Intelligence/WizardSage: Moves alternatingly as a Bishop or a Rook. Wisdom/CultistHierophant: can move as either a Bishop or a Knight. Charisma/WitchDemon: Moves like a pawn but captures like a Queen. The board is laid out with a row of Pawns followed by the Royal pieces in the following order from left to right: Fortress, Centaur, Gargoyle, Demon, Sage, Hierophant, King, Hierophant, Sage, Demon, Gargoyle, Centaur, Fortress. Bone always goes before Flesh. Meatchess is a hideous mixture of regular chess and gladiatorial combat. To play Meatchess, assuming all players are on the same side, the Referee assumes control of the opposite side, while the players take turns making moves. When one piece would take another, those pieces instead initiate combat; a ranged attack can precede movement, but the round must end with both pieces engaged in melee combat. At the end of each turn, all pieces presently engaged in combat also fight a combat round without moving from their positions. Keep track of all pieces each player character manages to take. If any character moves in an illegal way or makes an illegal attack, the chessboard responds by impaling them with bony spikes which erupt from beneath their feet, requiring a Dexterity save to avoid 1d6 piercing damage, +1d6 for each previous infraction. Characters may cast spells on themselves or allies even if not engaged in combat or not on the board. However, if they cast offensive spells on enemy pieces they are not engaging with, they have made an illegal attack. Characters who attempt to interfere with a Meatchess game from outside of the board will instantly become targets for all pieces on both sides, who suspend the game until the threat to the game is dealt with before resuming their positions. At the end of the game, dead pieces are revivified. Characters who died are likewise revived, but permanently become che"
