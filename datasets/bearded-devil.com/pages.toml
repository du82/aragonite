full_description = 'Ravenloft Table By Bearded-Devil On October 23, 2014 In Roleplaying The last two years, I’ve surprised my players with a jaunt to Ravenloft, bringing out candles and turning out the lights to set the mood. This year, they knew they were heading back beforehand – there was no way I could surprise them three times – but they surprised me with a blood-spatter tablecloth and coasters! With the lights off (as Ravenloft should be played): Expect more Ravenloft updates akin to last year’s Savour of Madness here soon! actual playDungeons and DragonshorrorPlanescapeRavenloft Previous Outlast: Whistleblower – Review Next Condemned: Criminal Origins – Retrospective Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name Email Website Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
