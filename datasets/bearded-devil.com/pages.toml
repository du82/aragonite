title = "Planescape Play Report – Olympus Burns – BEARDED DEVIL"
full_description = 'Planescape Play Report – Olympus Burns By Bearded-Devil On July 3, 2014 In Roleplaying It’s been quite awhile since I posted, but here’s what my players have been up to in my Planescape game recently. Context: Mount Olympus and its surrounds on the plane of Arborea has become a war-zone. Anarchists (members of the Revolutionary League) posing as Athar have stirred up resentment and hostility towards the Olympian pantheon who reside on the Mountain, claiming them to be decadent and tyrannical rulers. This, in turn, has caused the powers of the gods to wane as they lose worshippers. The Revolutionary League is always aiming to dethrone authorities and undermine the fabric of society, which they believe is hopelessly corrupt. As a result of the Anarchist machinations, war has broken out as inhabitants of Arborea rise up against the gods. The gods, still powerful, are fighting back to put down the rebellion, but are reluctant to unleash the full force of their powers lest they appear to be the very vicious tyrants they’re being painted as. Many, such as Apollo, have abandoned their palaces for Zeus’ temple-fortress at the top of the Mountain. The slaughter, unfortunately, has “destabilized” the plane. Each of the Outer Planes is associated with a set of Alignments; when events and beliefs on the plane shift, planes begin to “slide” into one another. So, as a result of the war, parts of Arborea (Chaotic Good) are beginning to slide into the Abyss (Chaotic Evil). This has been facilitated by the fact that Arborea, as a plane, is a place of grand passions – the plane actually amplifies emotions. This includes emotions such as hatred, fear, and anger. As the plane slides into the Abyss the Doomguard (crazed entropy-worshippers – basically the heavy metal Faction) have joined in the fun and started randomly burning, pillaging, and generally revelling in Arborea’s desecration. The Doomguard have brought with them three flying Ships of Chaos, powerful “Entropy Weapons” capable of great destruction. Meanwhile, Tanar’ri – that is, Demons – are emerging out of the Abyss and into Arborea at the places the planar boundaries are weakest. They’re now running amok, some of them magically enslaving the native inhabitants to do their bidding (so, for example, there are hordes of cannibalistic Maenads running around who’ve been Charmed by incubi and succubi). They seem to be allied with the Doomguard, and indeed Tanar’ri crew can be found on the Ships of Chaos. The Blood War – the eternal, now many-millennia-long conflict between the (Lawful Evil) Devils and the (Chaotic Evil) Demons – has started spilling into Arborea, as the Baatezu (Devils) suspect the Tanar’ri of attempting to “outflank” them using Arborea somehow. So there are also platoons of Devils and their mercenaries stomping around Arborea’s hinterlands and attacking Tanar’ri wherever they find them. The Harmonium (a Faction dedicated to stability and order) have arrived in force on Arborea to try and stop it from sliding whole-hog into the Abyss. They’ve brought with them the Mercykillers (a Faction of executioners and bounty hunters) to help enforce order and try to end the conflict. However, so far they seem to be having the opposite effect, their presence only leading to more fighting and carnage. The whole situation is based on one of the players’ back-stories. I’ve played it out as a hexcrawl, with Mount Olympus at one end of the map and a bunch of hexes in the middle full of forest fires, gorgons, mad minotaurs, Blood War skirmishes, and rebels. The tone is sort of Apocalypse Now meets 300, with a little zombie/cannibal survival horror thrown in. So far, my players have done the following: … Cut their way through swathes of Bacchae-infested wilderness, holing up for awhile in a ruinous trade-town stripped bare of every scrap of food from an orgiastic horde of the Raving Ones. Rescued some prisoners from the anthropophagic Dionysian revellers, killing the Bacchae in mass numbers though liberal use of Fireball and Cloudkill. Repaired one of the downed Ships of Chaos (Doomguard “Entropy Weapons” literally made from the souls of the damned) and psychically bonded with it. Picked up an Earth Genasi mercenary (a new PC), a Lawful Evil Monk dedicated to becoming “One with Stone.” Used the Ship to engage in high-stakes aerial combat with a flock of Harpies and Vrock before seizing a second vessel of the same sort, killing the mixed Tanar’ri/rebel crew and confronting the Anarchist wizard captaining the thing. Joined up with a beleagured battalion of Harmonium and their Mercykiller death-squad (the Ranger also decided it was a great idea to sleep with the head torturer). Raided the abandoned and thoroughly desecrated Temple of Apollo and re-took it from demented Baaetzu legionaries driven mad by prolonged exposure to the Chaotic/Good energies of Arborea – their passions eventually got the better of their discipline. Their leader, a depraved Bone Devil, was keeping a Medusa as a kind of pet; the party freed her and used her to petrify the Devil’s lieutenant, an Erinyes. The Hardheads have now adopted the Temple as a base of operations. Oh, and they did this: They have sort of a habit of taming & domesticating weird horrible things. actual playDungeons and DragonsPlanescapesandboxsurreal Previous St. Severine’s Skull: Hexenburg Castle – Gatehouse Dungeons Next Outlast: Whistleblower – Review Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name Email Website Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
