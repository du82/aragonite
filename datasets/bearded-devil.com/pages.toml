title = "March 2014 – BEARDED DEVIL"
full_description = "Month: March 2014 Witiko Falls By Bearded-Devil On March 29, 2014 In Roleplaying Overview The following comprises campaign information and scenarios for a sandbox-style surreal horror game set in the superficially normal town of Witiko Falls. The campaign format is intended to combine elements of a horror one-shot with the openness of a sandbox game in a kind of “small town horror anthology.” The idea here is that each session or two the players will pursue one of the many plot threads within the town. Their characters are very likely to die in any given session, but new characters will appear in the next session; only the town remains constant. The players assume the role of outsiders entering Witiko Falls for the first time. They might be conspiracy enthusiasts, lost travellers, drifters, private investigators, bumbling tourists, campers, touring musicians, or even a family moving into town. GUMSHOE (especially Fear Itself or Esoterrorists), BRP, Fate, d20 Modern, and similar systems are all viable candidates for running a game set in Witiko Falls. Personally I’m going to run games using the GUMSHOE system as represented in Fear Itself, so I will assume that system is being used, but this assumption won’t often intrude on setting details. Witiko Falls A remote community hidden in the depths of the Rocky Mountains somewhere near the convergence of the Idaho, Montana, Canadian borders, Witiko Falls was established as a scenic health resort in the 1880s. Over the last few decades of the nineteenth-century the town became a popular destination for the rich and sickly, resulting in the founding of numerous sanitaria, insane asylums, spas, and other health facilities, a number of them making use of the local hot springs and caves nearby. The town enjoyed a period of prosperity and growth until 1920s, when it went into a slow decline and began to garner an unsavoury reputation after a series of bizarre incidents and disappearances. The Great Depression catalysed the closure of many sanitaria during the early 1930s, including the famous “Crow Castle” in 1933. With these closures, many left the town, and its population dwindled till only a few eccentrics called the place home and the forest began reclaiming the old facilities. Witiko Falls was well on its way to becoming a true ghost town when members of a U.S. Federal Government agency (which agency, exactly, remains uncertain) arrived shortly after the end of WWII and refurnished the Castle for purposes they have never disclosed to the public. The little-known town is now home to a few thousand souls, a friendly but somewhat secretive folk who largely ignore the brooding presence of Crow Castle, its mysterious occupants, and the unmarked vehicles that periodically pull into its wrought-iron gates. Few come to the town, now, save the very occasional tourist, lost travellers looking for the road to Coeur d’Alene, gamblers heading to the Beavertail Casino, spelunkers hoping to explore the caves, and members of a small cabal of ghost-chasers or conspiracy theorists who believe the town is “the Roswell of the Northwest”; all but the lattermost are shyly welcomed by the hospitable (if inscrutable) locals. Tone Witiko Falls seems normal, but this appearance is but a layer of banality sitting atop a vast reservoir of roiling eldritch horror like the skin on a glass of old milk. Something squirms beneath the flesh of the town – some old unpleasantness, always lingering at the edge of vision, embedded deep in the place’s tissues like a tick. It makes you itch, makes the hairs on your arms stand on end. It gives you a knot in your stomach. The ideal tone to cultivate is one of subtle but definite wrongness. Little, seemingly innocuous (but still unsettling) details should conspire to create an atmosphere of paranoia and queasily mounting dread. The players should always feel that something is just a little bit off, without being able to point, exactly, to the source of all the ambient oddness. Each adventure should consist of a series of glimpses, whiffs, intimations of some colossal and nameless ugliness, some elemental strangeness at the heart of the town – culminating, ultimately, in a brief but spectacular explosion of visceral horror of immense power, hitting players like a punch to the stomach. Be restrained, but then really let loose… Influences Outlast, Silent Hill, Fringe, Twin Peaks, Buffy the Vampire Slayer, Gormenghast, House of Leaves, Welcome to Night Vale, The Shadow Over Innsmouth, Books of Blood, Slithdale Hollow. Soundtrack Twin Peaks Soundtrack Fire Walk With Me Soundtrack The Fog Soundtrack Fringe Soundtrack The Shining Soundtrack Nightbreed Soundtrack Hellraiser Soundtrack Red Dragon Soundtrack Outlast Soundtrack Call of Cthulhu Soundtrack Silent Hill 2 Soundtrack Phenomena The town of Witiko Falls may seem relatively normal on the surface, but those who linger begin to notice a number of unsettling phenomena. Anisocoria Everyone native to Witiko Falls is afflicted with anisocoria – they possess differently sized pupils. All those born in the town, regardless of ethnicity or background, suffer from this (harmless) condition. It seems to become more severe with each passing generation: a second-generation resident of the Falls, for example, has a greater disparity in pupil size than a first-generation native. The affliction is known as the “Eyes of the Witiko.” Parasomnia Visitors to Witiko Falls often seem unable to obtain a good night’s sleep. Many of those who first arrive in the town immediately begin suffering from some form of parasomnia, even when they have no prior history of sleeping disorder. The most common include night terrors, sleep paralysis, somnambulism, and somniloquy; sexsomnia and sleep-eating have also been known to manifest. Even those who avoid such symptoms tend to suffer from nightmares and especially vivid dreams on first arriving in town. In particular, new visitors tend to dream of happy childhood memories, memories horrifically marred by the presence of shadowy “things” watching from just outside of the dreamer’s peripheral vision; sleepers will inevitably wake moments before finally properly glimpsing those watching them in their dreams. This condition persists for a variable amount of time, sometimes never fully dissipating, although natives of the town seem to sleep soundly enough. Batteries For unknown reasons, batteries only last half as long in Witiko Falls. This phenomenon is one of the few associated with the town that can be consistently and quantifiably documented. Laptops, cellphones, flashlights, and other battery-operated devices all drain their batteries at double the normal rate. All other electronic devices perform completely normally, unless one counts the television program The Ritualist. The Ritualist A television program that seems to be exclusively broadcast in Witiko Falls. The extremely campy show features an occult detective similar to literary figures like John Silence, Thomas Carnacki, Simon Iff, Steve Harrison, Harry Dresden, and other supernatural investigators, and is comparable to similar programs such as Baffled! and The Night Stalker. The program seems to have been made in the 1970s, although some episodes make references to events that occurred in the 80s or even later. The eponymous Ritualist is Felix Mortimer, a hardboiled American detective who deals with supernatural crimes. Most of Mortimer’s cases take place in a fictitious east-coast city named St. Lazarus, though episodes also take place in a range of other locales including London, Cairo, Istanbul, and Shanghai. Extremely episodic and formulaic, The Ritualist is never broadcast in order, although it would be difficult to discern the correct order in any event. The program is (apparently) syndicated and appears on multiple channels in lieu of regularly scheduled content. TV guides do not mention the program, but it is available through on-demand and subscription services accessed within the town. As far as can be ascertained, the program has not been broadcast outside of Witiko Falls, no record of its production or broadcast has been found, and none of the actors have been located. Those few DVDs and videotapes of the show taken out of Witiko Falls eventually fail to play properly once they have left the town limits. Roads It is unclear whether the roads around Witiko Falls constitute a manifestation of its peculiar nature or not. The area around the town is a mass of logging roads and disused back-country roads, and finding the town can be difficult even for those who have made the trip multiple times. Locals can usually give coherent suggestions on how to leave the town, but periodic flooding, downed trees, broken bridges, and other obstacles can complicate travel to and from Witiko Falls. Gravity hills and other optical illusions also pervade the roads, complicating navigation. Not every trip is difficult; it has been observed that those who aren’t looking for the town seem the most likely to find it. Satellite photography of the area is often curiously obstructed by atmospheric interference and technical malfunctions, and most maps of the roads are outdated and unreliable. Some conspiracy theorists maintain that the roads move around to “protect the town.” When asked about this phenomenon, some residents will chuckle and concede half-jokingly that the roads “have a will of their own,” but always do so with an ambiguous wink or a sly smile. Some truckers have reputedly collected certain “tricks” to reach the town, which they sometimes use as a rest stop. Animals Non-human mammalian animals do not fare well in Witiko Falls. Dogs, cats, horses, and other creatures have been known to exhibit behavioural changes, anxiety, aggression, and bouts of illness in the town. Most blame such symptoms on altitude sickness. Non-mammalian animals seem unaffected. There is a pet store in Witiko Falls, but it only carries birds, fish, and reptiles. Instructions Periodically, residents and sometimes even visitors in Witiko Falls will receive anonymous instructions, usually in the form of letters, cryptic voicemail messages with disguised voices, text messages, or emails. Such notes always insist that their contents and even existence should be concealed from others. The instructions vary wildly in character but usually ask the recipient to perform some innocuous or trivial task, such as going to a certain cafe and ordering a particular drink, leaving a cold tap running in a public bathroom, turning a picture so that it’s askew in a hotel lobby, taking out a certain book from the library, or leaving a doughnut in a paper bag on a specific park bench. The writer addresses the notes to “Agent X,” X being the surname of the recipient. The tone is always one of intense urgency and secrecy, and the writer never reveals anything about the greater context or consequences of such activities. Very rarely, the messages will not be mundane at all; recipients will instead be instructed to perform some hideous, unwholesome, or even violent act. The space of time between instructions is unpredictable, ranging from hours to years. Most residents of Witiko Falls never acknowledge the existence of such instructions and will plead ignorance if confronted with them. Locations Here are but a few of the many interesting locations to be found within the town. This is just an overview; each location (and whatever secret strangeness it might conceal) will be detailed much more exhaustively later. The Falls The Witiko Falls themselves are reputed to have powerful healing properties, properties which initially drew the sickly to the town to bathe in or drink from the Falls’ waters to cure their ailments. Indeed, the original form of the town was little more than a cluster of tents erected around the Falls. Spilling out of the mountains not far from Crow Castle, the Falls feed the Green Lady River and joins the Kootenai River, itself one of the uppermost tributaries of the Columbia. The Falls also serve as a kind of hidden entrance to the cave-system that runs beneath and around the town; though there are many other entrances as well, this is the best known. Sleepwalkers plagued by the parasomnias that frequently afflict newcomers to the town often find themselves curiously drawn to the Falls themselves and are frequently discovered standing stock-still (sometimes having waded out into the river) apparently staring at the Falls in silent contemplation. Crow Castle First constructed by Sebastian Corvus, a wealthy but eccentric mystic and member of the Hermetic Order of the Golden Dawn, Crow Castle is a massive, rambling mansion built in the hills overlooking Witiko Falls. Corvus – a somewhat decadent British occultist – journeyed to the Falls after hearing legends of their healing properties, hoping to cure himself of an unknown illness (almost certainly syphilis). Financing construction of the huge, variegated house in 1886 using his family fortune, Corvus appeared to recover from his sickness but later contracted tuberculosis. After undergoing a deathbed conversion he willed the entire estate to the Sisters of Penitence, the so-called Red Nuns or Red Sisters. Following Sebastian’s death the Sisters converted the house into a lavish sanitarium for consumptives. It remained a popular destination for sufferers of the disease until its closure in 1933. The Sisters continued to operate a small portion of the house as a school for girls for another six years before the house was condemned by inspectors as unsafe. Unable to pay for repairs, the Sisters quietly sold the land to the federal government. Crow Castle itself is an enormous, curiously variegated building exhibiting features from dozens of different architectural styles. Broadly speaking the place resembles the Gothic follies and Romanesque Revival mock-castles more commonly found in Europe during the nineteenth-century, but parts of the Castle exhibit radically different styles – notably the sphinx-encrusted Egyptian Wing, the Arabesque Rooms, and the Byzantine Tower. Extensive cellars, basements, and tunnels can be found beneath the Castle, some of them reputed to connect to the caves that riddle the area. As for the shadowy government officials that have operated Crow Castle since 1946, little is known. They’ve repaired and reinforced most of the Castle – or, at least, most of its exterior – and keep a heavy watch, though their actual agents are only rarely glimpsed. Apart from the unmarked trucks and helicopters that periodically make stops at the Castle the only signs of activity are the glimmer of lights from its windows and, very rarely, indescribable noises that awaken the townsfolk in the dead of night. The locals themselves prefer not to speak of the Castle or its dark-suited occupants. The Swiner An all-night diner built in 1924, the Swiner is a novelty diner in the shape of a gigantic piebald pig, with windows for ey"
