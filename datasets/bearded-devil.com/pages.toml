title = "October 2013 – BEARDED DEVIL"
full_description = "Month: October 2013 Podcast Halloween Episode By Bearded-Devil On October 29, 2013 In Uncategorized I’ve been featured on S.S. Librarianship once again, in Episode 9. This time I talk about horror and its aesthetics as well as some of my favorite horror films and games. Outlast – Review By Bearded-Devil On October 17, 2013 In PC Gaming The horror gaming world is much abuzz about Outlast right now, a found-footage horror game that’s been compared to Amnesia and its ilk. I just finished the game myself over a period of about two weeks. I must admit that a part of me is cathartically relieved the game is over, because it’s an absolutely nerve-fraying experience, exquisitely paced, calibrated to precisely balance unrelenting panic with the potent terror of anticipation, with enough nauseating viscera thrown in for even the most benumbed gorehound to roil at. It’s not a perfect horror game but it’s damn close. Although it only has a few real innovations, it plays the standard tropes of the genre better than almost any horror game I’ve played. Like some other horror games of late, Outlast’s protagonist, Miles, contributes to the atmosphere of terror by wheezing, panting, and hyperventilating at appropriate times. He’s also fully embodied: his hands, arms, and legs are all visible and interact fully with the world, so when you pick up a battery or open a door you watch him physically perform the actions. I like this trend towards physicality; not only does it aid immersion, which is of vital importance in a horror game, it gives everything a particularly visceral edge that suits Outlast and games of its ilk very well. In Outlast specifically, Miles’ embodiment is especially significant: the game is not only about the relationship between bodies and minds, it’s also about chases. It’s probably impossible to make it through the game without being seen; the game seems to delight in springing enemies on you when you think you’re being clever and stealthy, so almost inevitably, you end up spending a lot of time running away. Equal parts deranged parkour and murderous hide-and-seek, the chase gameplay is very well handled, with just enough clumsiness to ensure the occasional moment of frenzied fumbling with the controls as you try to dodge around the abominable inmate/thing bearing down on you with god-knows-what clutched in his twisted paw as a makeshift club. Surprisingly to me the chases themselves aren’t so much terrifying as strangely exhilarating – after the initial spasm of raw panic a kind of primeval flight instinct takes over and you start mapping out routes, figuring out which obstacles to circumvent and which doors to dash through, eyes roving for a place to conceal yourself. Speaking of Miles, our investigator-journalist protagonist, he’s brilliantly written. He adds notes in his journal as the game progresses, and for once it actually makes sense for a character to be carrying a notepad and pen. Most characters in horror games usually seem pretty determined about pressing onwards – Daniel is hell-bent on killing Alexander, Isaac is resolved to destroy the hive mind or purge the necromorph-infested colony or whatever you were supposed to be doing in Dead Space, James Sunderland is intent on finding his wife, Leon Kennedy is steadfastly committed to rescuing the president’s daughter (even if she is annoying as all get out), Oswald Mandus is obsessed with finding his children. In contrast, Miles became my hero not when he enters the asylum in the name of journalism but when he scribbles in his notebook something along the lines of “Fuck this place. Seriously, fuck it.” Again, this boosts immersion immensely – because now my desires really are aligned with the protagonist’s, and we identify with him in a way we might not with a more stoic protagonist. In A Machine for Pigs I found Mandus fascinating in a creepy, grotesque kind of way, but as the game progressed I identified with him less and less, as it became clearer and clearer just how disturbed and deluded he was; by the end of the game I had sort of decided that I wouldn’t be that cut up if old Oswald bit the biscuit. But Miles reacts essentially as a real person would if they were confronted with the horrors of Mount Massive. He doesn’t grab a crowbar and an SMG and start gunning his through the place, he runs a lot, hides a lot, and tries to get the hell out as fast as he can. As the story progresses and he gets drawn ever deeper into Mount Massive his motivations shift and become more complicated, but he is always intent on getting out as fast as possible. While Outlast has a limited bag of tricks gameplay-wise, it uses them to full effect. The parkour mechanics of the game are intuitive and easy to handle, and except for one jump that I think was slightly too extreme, the platforming element is never frustrating. There’s a nice blend of stealth, exploration, item collection, and action (the chases). What there really aren’t are puzzles: at no point was I stuck on what to do. The only time I couldn’t figure out where to go, a rampaging enemy chasing me through an overgrown courtyard eventually forced me to stumble upon the way to the next area by making me run around like a chicken with its head cut off till I spotted the right path. The trailer does a pretty good job of showing off the gameplay without spoiling anything. Outlast features some of the best use of darkness and light since Amnesia: The Dark Descent. The central conceit of the game is the use of the camcorder Miles comes equipped with, which is used not only to provoke new “notes” by recording events in the game, it comes with a battery-draining night vision mode. The garish, grainy, blue-lit night-vision makes me think of the climactic scene of The Silence of the Lambs, so strongly I wonder whether it’s a kind of extended allusion – not that other films haven’t used night vision (28 Weeks Later also comes to mind). The night vision not only adds an anxiety-provoking element as your battery supply slowly dwindles, it allows the game to play a variety of tricks dependent entirely on whether or not you’ve got your light on, some of them quite subtle. In one memorable and horripilating sequence, for example, a flash of lightning, combined with the night vision and zoom function, illumines an approaching, knife-wielding figure slowly slinking out of the gloom, giving you a simultaneous jolt of fear and a few extra, precious moments to escape – but then a glance behind you with the night vision on reveals a second figure approaching from behind. The sheer panic this moment caused before I spotted the solution was pretty impressive. This is a game that manipulates its players in very deliberate ways, and yet many of its best scenes aren’t scripted events but organically derived moments that emerge spontaneously through play. Mount Massive is labyrinthine enough to allow for multiple routes and hiding spots. In other games, the presence of a locker or wardrobe to hide in might tip the game’s hand that an encounter with something awful was imminent, but not in Outlast: while there are a few predictable moments, the structure of the environment, your character’s speed, and what seems like pretty decent AI on the inmates ensures that Outlast rarely gives the game away. The game excels in making its environment varied and interesting, despite taking place entirely in and around single building. I was reminded at points of the original Half-Life: the game manages to switch up the terrain enough to keep things from getting bland (as the endless corridors of Dead Space or the interminable offices of F.E.A.R. get stale), while still retaining a feeling of unity and coherence. At different points you’ll find yourself in claustrophobic sewer tunnels, cavernous cisterns, gore-spattered infirmaries, tenebrous wards, terrifyingly open courtyards, and corridors so derelict the floorboards sometimes disintegrate beneath your feet. While Outlast deals in jump-scares as much as slow-burning dread, it elevates them to a fine art by playing mental games with the player. In one early sequence, for example, you pass an emaciated inmate in a wheelchair, sitting still and wheezing to himself beneath a flickering overhead light – he’s grotesque and unnerving but not especially frightening. After working up the courage to approach this ghoulish but infirm figure you quickly realize he’s harmless: he doesn’t talk or try to attack you, he just sits in his chair and breathes hoarsely to himself, inspiring more pity than fear. In an adjacent room you find an object you need to get to the next area and you’re forced to retrace your steps. Knowing that horror games have a habit of throwing enemies at you after retrieving such items, I was moving very quickly through the areas I’d previously visited while keeping an eye out for trouble, expecting something to burst through a previously locked door. As I ran down the reasonably well-lit corridor with the wheelchair-bound inmate I started to feel relieved – the hallway looked clear, and I’d written off the inmate as “safe,” really not much more than a bit of set-dressing, an atmospheric fixture. When he lurched out of his wheelchair and attacked me, I was genuinely startled and horrified; moments later, as he picked himself up off the floor after Miles pushed him off, I was running at full-speed away from him, the nerve-fraying jolt of the jump-scare immediately giving way to fear of being caught. This is nothing short of brilliant: the scare hides in plain sight, luring you into a false sense of security and then punishing you for letting your guard down. After escaping, my heartbeat receding in sync with Miles’ panting, the full implications of the sequence hit me, as I realized that nothing in Mount Massive could be considered “safe.” By introducing an expectation and then subverting it, Outlast had further undermined any sense of security I had deluded myself into feeling. This was not an isolated incident, either: Outlast delights in these kind of head-games. For instance, the game provides ample spaces to hide – lockers and beds being the most common. Frequently, you’ll watch through a locker grill as an enemy searches the locker beside yours, while leaving your own locker unopened. After a few repetitions of this routine, I thought I’d “figured out” the stealth aspect of the game – if you were in a locker, and the enemy didn’t see you enter it, you were safe. How wrong I was: enemies can indeed guess which locker you’re in correctly. Again, the game sets up assumptions only to undermine them. As for the game’s “monsters” (the inmates, or Variants), they’re wonderfully designed: mangled, mutilated, surgically scarred, and riddled with carcinogenic growths, the sudden appearance of one, accompanied by a trill of music, is sublimely horrific. You re-encounter a number of particular Variants over the course of the game and read about them in documents as well, and so Mount Massive accrues a kind of mythology as you move through it. My personal favourite is the demented Doctor Trager, who runs the infirmary and is responsible for one of the most shocking and harrowing scenes in the game, although the calm, strangely soft-spoken Brothers are also wonderfully creepy. Much of the game is spent evading the behemothic Chris Walker, a particularly menacing Variant, and while I enjoyed many of the sequences featuring Chris, I thought that by the end he’d been a bit overused: over the course of the game he becomes the designers’ “go-to” enemy, unless they opt for a generic, nameless inmate or three. Even one or two more named, unique enemies would have made the game stronger overall. Only one enemy’s design actually disappointed me significantly, though – that of the Walrider, an enigmatic, incorporeal spectre central to Outlast’s overarching plot. The Variants are uniformly grotesque and unnerving: everything about them makes you want to get away. They’re unclean, contaminated, diseased; the obscenities they shout, the way they goad you and tease you and lust for you, is really appalling in the best possible way. In contrast the Walrider is mute, faceless, wispy, and not especially scary. The only times it really threatens you take place in rather well-lit areas, and whenever I was running from the Walrider I didn’t feel the same frenzied sense of total panic I felt when fleeing from Doctor Trager with his rusty surgical instruments or the hulking, inexorable Chris. There’s just no sense of revulsion with the Walrider, no feeling of disgust. I think they were going for a kind of otherworldly Lovecraftian force with the Walrider, but it falls rather short of the mark; frankly it reminds me a bit of the black wraiths that feature towards the end of F.E.A.R., which were more annoying than terrifying. Though the end of the game in general is a bit anticlimactic given what came before, the Walrider really exacerbates the problems with the final area. Overall, I think the game’s biggest missed opportunity was the fact it doesn’t include any female characters: though you venture into the Female Ward at one point, there are no female characters in the entire game (at least none that I saw). The designers can’t really have been worried about encouraging violence against women, because you’re unarmed throughout, and I think a properly designed female Variant could have been perfect. Some reviewers have criticized the game for being clichéd, or for offering a stereotypical and inaccurate depiction of mental illness (Adam Smith’s review on Rock Paper Shotgun is particularly scathing in this regard). While the story of Outlast is nothing really out of the ordinary – it’s a barebones, boilerplate horror plot about Nazi science, corrupt corporations, dreams, hypnotherapy, spirits, some weird machines and some weirder mathematical formulae – it doesn’t really have to be, and I think the “clichéd” criticism is a bit hard to swallow. Yes, abandoned and/or overrun mental institutions aren’t exactly original, but Outlast does the “evil asylum” thing about as well as possible (on the same level as Thief: Deadly Shadows’ Shalebridge Cradle). Smith argues that: The fact that the place purports to be some kind of madhouse probably won’t matter very much to what little narrative there might be. It’s wallpaper to act as a backdrop for bludgeoning and butchery. It could as easily be a carnival full of insane clowns or an abandoned hotel full of insane bellboys, or an insurance office full of insane filing clerks. Ironically, this is exactly right, in a sense. The game could have been set in an evil carnival or whatever – so long as it used the tropes at its disposal right, it would still have been an intense horror experience. Outlast is not trying to make a coherent statement about the way we relate to the mentally ill or about real mental illness. It’s not striving for profundity, it’s striving for affect. In thi"
