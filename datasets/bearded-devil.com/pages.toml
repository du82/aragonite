title = "January 2014 – BEARDED DEVIL"
full_description = "Month: January 2014 The Savour of Madness: Tunnels By Bearded-Devil On January 25, 2014 In Roleplaying The Tunnels Soundtrack The tunnels are completely dark. Anyone with anything less than Darkvision will require a light. Fortunately, lights don’t alert the Grimlocks that lurk in the tunnels to the characters’ presence, but any Intellect Devourers in the tunnels will see an approaching torch or lantern. The Alienists flee to the tunnels if all else fails – if the inmates are set free, for example, or the asylum set on fire, or if they are simply driven back through the basement. 56 – Entrance Cavern An incessant dropping sound fills the air here, along with the rancid stench of carrion. Three passages lead from this round cave. Perception DC 15: One tunnel reeks especially strongly of rotten flesh, and another smells of mould. What sounds like the bleating of a goat echoes down the tunnel in the middle. 58 – Heap A vile stink fills your nostrils in this cavern, the reek of rotting flesh making your stomach roil. A huge heap of half-eaten corpses is pied at the center of the cave, filling the air with the sound of buzzing flies and rustling maggots. All of the corpses have had their skulls shattered. The floor is slick with half-coagulated blood. This is where the Alienists dump bodies they’re no longer using (those they don’t keep in the larder, anyway), keeping their servants well-fed. The gruesome sight provokes a Sanity check (0/1d4+1). Perception DC 20 to hear chewing sounds from behind the corpse-pile, where two Grimlocks eat. 59 – Drinking Water A pool of murky water fills most of this large cavern; within you can glimpse blind cave fish and other creatures, stunted albino things. A hunched, eyeless humanoid, its skin a mottled grey, its hands clawed, stoops and drinks from the pool. Fungi riddle the cave walls, filling the air with their pungent smell. A single Grimlock can be found here. 60 – Larval Pool A huge pool of greenish, slimy liquid dominates this cavern; within the murky depths you can glimpse small, brain-like creatures swimming, propelling themselves with their tentacles in a way that reminds you of jellyfish. Adhered to the banks of the pool are vast quantities of small, round eggs in mucilaginous sacs, reminiscent of frogspawn. Dozens of Intellect Devourer larvae – Ustilagors – lurk in the pool. Falling in is probably a bad idea… 61 – Chasm A seemingly bottomless chasm interrupts the tunnel here. Acrobatics DC 20 to leap across here; fall damage is 10d6. Climbing down requires a DC 20 Climb check. Grimlocks will chase characters fleeing here to try and trap them. 62 – Feasting Chamber Hundreds – perhaps thousands – of gnawed bones, both human and animal, carpet the floor of this chamber. Crude images of beasts, intellect devourers, and humanoids are painted on the walls. If the characters have been stealthy they may witness a particularly gruesome feast-in-progress: A trio of twisted, eyeless humanoids tear apart a mountain goat here; the creature’s piteous bleats echo through the caves as they tear it open, blood gushing everywhere as they begin to gorge themselves on its entrails, stuffing dripping gobs of viscera into their fanged mouths. 63 – Mountain Tunnel A faint whiff of fresh air and the sound of wind relieves the musty staleness of the caverns here. This passage climbs upwards (Climb DC 15) out into the mountains. If truly outmatched the Alienists will flee here, though this could also make a convenient escape route for the characters. The Grimlocks use this entrance to go and hunt. 64 – Grimlock Warren Soundtrack Something stirs in the darkness of this large, dripping cavern – you are not alone down here. Stalactites loom out of the darkness, and shallow pools of water have collected on the floor. At any given time there are at least a 15-25 Grimlocks in this large cavern, sleeping, creeping about, mating, or eating. Here’s a glimpse of some of them: Half a dozen loping figures emerge from the darkness – pale, malformed humanoids with pronounced nostrils and ears, no eyes, and mottled greyish-white skins. Sniffing the air, they hiss and move towards you, and more shapes stir behind them! 65 – The Pit A gaping pit yawns at the center of this chamber, its walls slimy, plummeting down into darkness. This pit leads down into an intricate cavern system that riddles the mountains; it’s here that the Grimlocks entered these caverns. Clambering down is tricky, however, requiring a DC 25 Climb check (fall damage is 20d6). Appendix: Statistics QUASIRIANT/DELACROIX – INTELLECT DEVOURER SORCERER 8 CR 11 XP 12, 800 Intellect devourer sorcerer 8 CE Small aberration Init +11; Senses blindsight 60 ft., detect magic; Perception +21 DEFENSE AC 23, touch 18, flat-footed 16 (+7 Dex, +5 natural, +1 size) hp 164 (16 HD; 8d8+8d6+96) Fort +11, Ref +12, Will +16 Defensive Abilities: invisibility, mirror image; DR 10/adamantine and magic; Immune fire; Resist cold 20, electricity 20, sonic 20; SR 23 Weaknesses: vulnerability to protection from evil OFFENSE Speed: 30 ft. Melee: 4 claws +18 (1d4+1) Special Attacks: acidic ray (1d6+6 acid, 12/day), body thief, sneak attack +3d6 Spell-Like Abilities (CL 8th; concentration +17) Constant—detect magic At will—confusion (DC 22, single target only), daze monster (DC 19, no HD limit), inflict serious wounds (DC 20), invisibility, reduce size (as reduce person but self only) 3/day—cure moderate wounds, globe of invulnerability Sorcerer Spells Known (CL 8th; concentration +17) 4th (4/day)— phantasmal killer (DC 20) 3rd (7/day)— gentle repose, suggestion (DC 21) 2nd (8/day)— touch of idiocy (DC 18), hideous laughter (DC 20), mad hallucination (DC 18) 1st (8/day)—charm person (DC 20), disguise self (DC 18), hypnotism (DC 20), memory lapse (DC 20), sleep (DC 20) 0 (at will)—arcane mark, dancing lights, detect poison, ghost sound (DC 17), mage hand, mending, open/close, prestidigitation Bloodline: Aberrant STATISTICS Str 12, Dex 25, Con 19, Int 18, Wis 14, Cha 24 Base Atk +10; CMB +10; CMD 27 Feats: Combat Casting, Eschew Materials, Extend Spell, Greater Spell Focus (enchantment), Improved Initiative, Quicken Spell, Silent Spell, Spell Focus (enchantment), Still Spell, Weapon Finesse Skills: Bluff +34, Craft (alchemy) +13, Diplomacy +16, Disguise +23, Knowledge (arcana) +11, Knowledge (psionics) +11, Knowledge (local) +14, Perception +17, Sense Motive +16, Spellcraft +18, Stealth +19, Use Magic Device +19 Languages: Common, Aklo, Grimlock, Undercommon (cannot speak); telepathy 100 ft. SQ: bloodline arcana, long limbs (+10 ft.), unusual anatomy (25%) Gear (only if encountered in a host body): doctor’s outfit, masterwork dagger, keys (Eye, Hand, Heart, Brain) SPECIAL ABILITIES Body Thief (Su): As a full-round action that provokes an attack of opportunity, an intellect devourer can reduce its size, crawl into the mouth of a helpless or dead creature, and burrow into the victim’s skull to devour its brain. This is a coup de grace attempt that inflicts 8d4+3d6+8 points of damage. If the victim is slain (or already dead), the intellect devourer usurps control of the body and may use it as its own, as if it controlled the target via a dominate monster spell. The intellect devourer has full access to all of the host’s defensive and offensive abilities save for spellcasting and spell-like abilities (although the intellect devourer can still use its own spell-like abilities). A host body may not have been dead for longer than 1 day for this ability to function, and even successfully inhabited bodies decay to uselessness in 7 days (unless this time is extended via gentle repose). As long as the intellect devourer occupies the body, it knows (and can speak) the languages known by the victim and basic information about the victim’s identity and personality, yet has none of the victim’s specific memories or knowledge. Damage done to a host body does not harm the intellect devourer, and if the host body is slain, the intellect devourer emerges and is dazed for 1 round. Raise dead cannot restore a victim of body theft, but resurrection or more powerful magic can. Vulnerable to Protection from Evil (Ex): An intellect devourer is treated as a summoned creature for the purpose of determining how it is affected by a protection from evil spell. ALIENIST (HOST BODY) CR 5 XP 1,600 Human expert 7 CE Medium humanoid Init +2; Senses Perception +12 DEFENSE AC 12, touch 12, flat-footed 10 (+1 armor, +2 Dex) hp 31 (7d8) Fort +2, Ref +3, Will +5 OFFENSE Speed: 30 ft. Melee: masterwork dagger +5 (1d4–1/19–20) STATISTICS Str 8, Dex 14, Con 10, Int 16, Wis 11, Cha 17 Base Atk +5; CMB +4; CMD 13 Feats Alertness, Combat Expertise, Deceitful, Persuasive, Skill Focus (Profession [alienist]) Skills Appraise +13, Bluff +19, Diplomacy +13, Disguise +11, Heal +12, Intimidate +11, Knowledge (arcana) +11, Knowledge (local) +14, Knowledge (psionics) +11, Perception +19, Profession (alienist) +13, Ride +6, Sense Motive +12, Stealth +9, Use Magic Device +11 Languages: Common, Aklo, Grimlock, Undercommon Gear: doctor’s outfit, keys (Eye, Hand, Heart, Brain), masterwork dagger These stats were modified slightly in light of the Body Thief ability; it doesn’t make sense to me to use the host body’s Bluff bonus, for example, given that the host’s brain has been eaten. Of course, it’s quite possible that the Intellect Devourers will switch bodies at various points. When one of the Alienists’ hosts die, the Intellect Devourer shows itself: The body falls to the floor, eyes staring lifelessly ahead. Then, suddenly, the corpse twitches, limbs flailing. There is a sickening cracking sound as the corpse’s skull breaks open like an egg, a black talon emerging from the wound, followed by a whipping tentacle. The tendril pushes aside the fragmented wreckage of the man’s head and something climbs out. It looks exactly like a brain, save for the greyish fungus covering it, its lashing tentacles, and the many-jointed limbs unfolding from beneath it. The thing seems temporarily dazed. The sight of an Intellect Devourer provokes a Sanity check (1/1d4). Intellect Devourers can also exit the way they came in, through the mouths of their hosts, but this process is more cumbersome (they use this process when they want to leave a host undamaged). After losing a host an Intellect Devourer will usually scuttle away, becoming Invisible (or Clouding Minds if you’re using the Psionic variant). If the characters are injured, however, or if there are other Alienists or Orderlies around, it may attack, using Confusion, Inflict Serious Wounds, and claws. If a corpse is around, it’ll use Body Thief on it. ORDERLY CR 3 XP 800 Grimlock rogue 1/warrior 3 CE Medium humanoid (human) Init +2; Senses: Perception +12 DEFENSE AC 17, touch 12, flat-footed 15 (+1 armor, +2 Dex, +4 natural) hp 42 (6 HD; 1d8+5d10+9) Fort +5, Ref +9, Will +3 OFFENSE Speed: 30 ft. Melee: sap +7 (1d6+2 nonlethal) Special Attacks: sneak attack +1d6 STATISTICS Str 15, Dex 15, Con 13, Int 10, Wis 8, Cha 6 Base Atk +5; CMB +7 (+9 grapple); CMD 19 (21 grapple) Feats: Alertness, Skill Focus (Perception), Improved Grapple Skills: Climb + 7, Stealth +11 (+21 in caves or mountains), Swim +8, Perception +12 Languages: Grimlock, Undercommon SQ: trapfinding +1 Gear: padded armour, sap, key (roll 1d4: 1-Eye, 2-Hand, 3-Heart, 4-Brain), 1 Potion of Disguise Self (Human) Handouts Here is the text of the handouts: Valentin’s Journal Year 735, 7th of Vendémiaire The groundskeeper Gerard, a man from the village of Saint-Sæthryth, was found dead this morning not far from his cottage, a dog worrying at his body. The condition of his corpse was most alarming. The top of the man’s skull had been completely shattered and his brain was missing; what’s more the inside of his head showed a number of gashes and other marks disturbingly suggestive of bite-marks, though I am unsure what beast could have made them. As chief physician and aliéniste here at L’Hôpital de Corbin I believe it must fall to me to conduct the autopsy; I shall have Dr Delacroix assist me. With luck our examination will reveal some clue as to who perpetrated this awful crime. I wish to believe it to be the work of some animal, or else nothing more than a tragic accident, and yet I fear the worst. Many of the patients here at the asylum have violent pasts. One woman, a hysteric, murdered her husband in cold blood when he attempted to initiate marital relations between them, mutilating the man till there was naught left to identify him as such. Another patient, gripped by powerful delusions, was found to have cannibalized several street urchins before being sent here. We keep the inmates under close watch, of course, but if one were to have somehow slipped away, even for a brief spell, there’s no telling what horrors they could inflict. They are not all imbeciles, either: there is a certain deranged cunning to some of them, and they can be artful dissemblers at times. Of course, after the body was discovered I had the entire facility carefully locked down, and all patients have been thoroughly accounted for; if one of them is responsible for this hideous crime, they are now safely locked in their cell. There are other theories circulating amongst the staff, some of whom come from local villages – wild talk of hill-men and goblins and ghouls living under the mountains. I almost wish it were some bogeyman responsible. After the autopsy I may have to interview the patients individually. Year 735, 8th of Vendémiaire The autopsy of the groundskeeper’s body has been completed, but I admit to being even more perplexed than before. I have carefully reconstructed the skull and examined the wounds thoroughly, and I have come to one inescapable but bizarre conclusion: the man’s skull was not caved in from the outside – as from a blow to the head – but broke open from the inside out. A powerful gunshot might have caused such explosive fragmentation, yet there is no gunshot wound visible on the man’s face or elsewhere on the corpse. Stranger still, I discovered subtle but unmistakable trauma to the jaw, as if it had been recently dislocated and then jarred back into place. I also discovered lacerations, faint but still distinct, around his lips and in the inside of his mouth. Continuing my examination, I found that the back of the man’s throat had been gashed open, as if something had been forcibly thrust through his mouth and up into his brain. To make matters even more bewildering, the wound had been sealed with a membranous growth of some kind, and traces of other foreign material – webbing, a greyish substance resembling fungi, and some sort of congealed mucus or slime – was discovered in his emptied cranium. All traces of the brain itself were completely gone save for some portions of the brain stem, including the bulb, pons, and a portion of the midbrain. As I continued the autopsy my findings grew yet more bizarre – and disturbing. The groundske"
