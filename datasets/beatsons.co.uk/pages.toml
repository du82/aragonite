["https://beatsons.co.uk/aggregates-c2829/building-aggregates-c566"]
title = "Building Aggregates | Beatson’s"
description = """
Building Aggregates                                            Look no further than Beatson’s for all your building aggregate needs. Used in many areas of construction, aggregates are a key material in many commercial and residential projects. In the collection at Beatson’s, you will find base aggregates and sands, gravel and chippings, and rock salt, so whatever your project, Beatson’s can provide you with the building aggregates you need. Why not use our aggregates calculator to work out how much to order? Simply choose your aggregate, enter the width, depth and length, and we’ll do the rest! Our aggregates are available in various quantities, so whether you’re doing a DIY project at home or you’re a tradesperson stocking up, you can find what you need at Beatson’s."""
full_description = "Look no further than Beatson’s for all your building aggregate needs. Used in many areas of construction, aggregates are a key material in many commercial and residential projects. In the collection at Beatson’s, you will find base aggregates and sands, gravel and chippings, and rock salt, so whatever your project, Beatson’s can provide you with the building aggregates you need. Why not use our aggregates calculator to work out how much to order? Simply choose your aggregate, enter the width, depth and length, and we’ll do the rest! Our aggregates are available in various quantities, so whether you’re doing a DIY project at home or you’re a tradesperson stocking up, you can find what you need at Beatson’s. Sand is one of the many aggregates available at Beatson’s. It’s a versatile material used in many residential and commercial projects. Building sand is used in bricklaying, which can be mixed with water and cement to make a mortar. It’s also used for pointing and rendering jobs. Thanks to its many uses, building sand can be used within projects like patios, block paving, plastering, bedding ponds, and much more. Washed sand: This type of sand is washed to remove impurities like clay, dust or silt. Thanks to its smooth texture, it is most commonly used for jointing, rendering and external plastering, as well as recreational settings like sandpits and golf bunkers. Sharp sand/concrete sand: This type is unwashed and features larger, jagged granules than washed sand. Sharp sand is most commonly used for mixing concrete and strong mortars. Discover the full collection at Beatson’s. Browse our garden aggregates collection for more inspiration."
