["https://beatsons.co.uk/beatsons-charity-partnership-i67"]
title = "Beatsons Charity Partnership"
description = "Beatsons Building Supplies Supports a number of small local charities each year. Our main charity partner is the STV Children&#039;s Appeal."
full_description = '''Beatsons Building Supplies supports a number of small local charities each year. Our main charity partner is the STV Children's Appeal. The STV Children's Appeal aims to make a positive difference to the lives of children affected by poverty in Scotland. With 1 in 4 children living in poverty, the charity work extends across all 32 local authority areas of Scotland. The money raised supports children, young people and their families that are living in difficult circumstances. We are proud to announce that customers, friends & staff have helped to raise £18,500 in 2024 towards this charity. For every bulk bag sold between April and September, we give a 50p donation to the STV Children's Appeal. All of our branches have STV Children's Appeal collection tins on the counter tops, to also contribute towards our charity efforts. At Christmas time we have a final donation drive to end the year. Our Christmas tree's baubles feature QR codes that can be scanned to donate £5, £10, or £15 to the STV Appeal. Our annual Beatsons Golf Day was on Friday 6th September 2024 at Alloa Golf Club. From 10am til 5pm our golfers competed in a tournament that included challenges on specific holes including: "nearest hole", "longest drive", and "beat the pro". The day ended with a charity raffle at dinner. With all donations on the day going towards our charity partner.'''
year_published = 2025
