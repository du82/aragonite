full_description = "Member-only story5 Stoic Ideas for a Good Lifeincluding Quotes to Live ByAfroz Chakure·FollowPublished inBecoming Human: Artificial Intelligence Magazine·2 min read·Apr 6, 2024--SharePhoto by Daniel Monteiro on Unsplash1. Dichotomy of ControlThe dichotomy of control is about ‘controlling the controllables’.Control what you can and leave the rest. Never give your ‘freedom to choose’ to anyone else.“We cannot control the external events around us, but we can control our reactions to them.”— EpictetusHere’s one from Victor Frankl,“Everything can be taken from a man but one thing . . . to choose one’s attitude in any given set of circumstances.”— Victor Frankl, Man’s Search for Meaning2. Rule of LifeMake it your life’s goal to ‘search for truth’.“Seek ye first the good things of the mind,” Bacon admonishes us, “and the rest will either be supplied or its loss will not be felt.”“Truth will not make us rich, but it will make us free.”"
