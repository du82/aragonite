title = "Pork Verde Soup - Beecher's Handmade Cheese"
description = "Our Pork Verde Soup is robust and complex with tender pork, chiles and tomatillos. Gluten-free, and a quick & convenient meal."
full_description = "For cold winter nights or in the middle of summertime, our Pork Verde Soup is robust and complex, with tender pork, chiles, and tomatillos. Do not consume if bag is open or torn. Do not refreeze. Soup may separate when thawed; stir before serving. Use caution after heating; soup will be hot. To Thaw: Refrigerate bag overnight or warm bag in microwave for no more than 3 minutes on high. Soup will still be slightly frozen. (Do not microwave until hot as bag may break.) Microwave: Pour thawed soup into microwave-safe container (do not heat in the bag). Heat on high for 5 minutes, stirring occasionally, until soup is hot (165°F). Stove Top: Pour thawed soup into saucepan and heat, stirring occasionally, until soup is hot (165°F). Boil in Bag: Bring 2 quarts water to boil in pot. Carefully place bag (frozen or thawed) in boiling water for 12–17 minutes, flipping periodically, until soup is fully heated (165°F). With caution, use utensils to remove very hot bag of soup. This journey, beginning with fresh, locally sourced milk and adding the passion and skill of artisan cheesemakers, culminates in the best of all deliciousness - amazing, gourmet cheese."
