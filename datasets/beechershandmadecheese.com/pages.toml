["https://beechershandmadecheese.com/recipe/beechers-street-corn-fritters"]
title = "Beecher's Street Corn Fritters - Beecher's Handmade Cheese"
description = "This battered, deep fried snack is made with our Street Corn, found in the frozen aisle of grocery stores across the country."
full_description = "Home / Recipes / Beecher’s Street Corn Fritters Table of Contents Background Cooking and Serving Tips Recipe Background If you weren’t already familiar, corn fritters are a fried, battered corn snack that is rooted in the history of the southern United States. Though maize was long a staple of indigenous Americans’ diet, European settlers are understood to have first started frying corn batter in oil utilizing the large cast iron cookware they brought while crossing the Atlantic. Over time and trade, corn and corn recipes spread through the world. Via trade into Southeast Asia, corn fritters became a staple in Indonesia where they’re known as bakwan jagung or perkedel jagung. We by no means can claim that these little bites tap into all of the impressive history of corn fritters, but this Latin flavor-infused recipe is simply delicious. Cooking and Serving Tips The smaller the fritters the faster the fry time will be per side, and the more crisp the interior texture will be. We experienced slightly undercooked centers because our fritters were too large and oil temp too high. When scooping your Street Corn into the mixed batter, try to tilt or strain the liquid in the tray to avoid over-wetting your batter. This will lead to excess splattering. Make extra crema if you plan on eating the whole recipe in one sitting… double dips were aplenty. Serve & Store Save any leftover fritters in an airtight container for 5 to 7 days in the fridge. Sour cream “crema” can be saved in the fridge for one week in an airtight container. Recipe Instructions Pull milk and egg out to reach room temperature. Microwave Street Corn on high for 6 minutes to thaw and cook, then set aside to cool. Heat neutral oil in a heavy pan, or deep fryer to 325°F. Combine dry ingredients in a medium bowl. Beat egg, milk, and melted butter together in a bowl, then stir egg mixture into the dry mixture. Add the Street Corn. Gently drop table-spoonfuls of the fritter batter into the oil, no larger than 1-1/2 inches wide. Beware of splashing hot oil. This will take several batches. Once the fritters turn a golden brown (30 to 60 seconds per side), remove using a slotted spoon or long tongs and set aside to dry on a paper towel-covered dish. While the fritters are cooling, prepare the Lime Crema by whisking together the sour cream and lime juice, then topping with Tajin. Serve the fritters warm with the Lime Crema. Ingredients 3 cups neutral oil for frying 1 cup all-purpose flour 1 teaspoon kosher salt 1/4 teaspoon cayenne pepper 1/4 teaspoon white sugar 1/2 cup milk 1 tablespoon butter, melted 2/3 box Beecher’s Street Corn (18 oz), cooked and cooled Lime Crema 1 cup soup cream 1/2 lime, juiced 1/2 teaspoon Tajin Seasoning Featured Beecher's Ingredient Street Corn Shop Now Beecher's Food Used Street Corn Shop Now Don't feel like cooking? Our cafés are the best place for an authentic Beecher's experience. See Cafés Additional Recipes Irish Choux Pastry Gluten-Free Fried Cheese Curds Buffalo Chicken Mac & Cheese Pesto Mac & Cheese Irish Choux Pastry Gluten-Free Fried Cheese Curds View All Where to buy Find Beecher's at your local store or add to your next grocery delivery. Find a Store Never Miss a Recipe Sign up to receive the latest insights and offerings on all things Beecher's! .mc-pages form { margin: 0 ! important; } .mc-pages #mc_embed_signup_scroll { display: flex; justify-content: flex-start; gap: 10px; } .mc-pages .mc-field-group label { display: none ! important; } .mc-pages #mce-EMAIL { padding-left: 10px ! important; background: #fff ! important; border: 0 ! important; border-radius: 0 ! important; } .mc-pages #mce-responses { display: none ! important; } .mc-pages input#mce-EMAIL::placeholder { font-style: italic! important; font-size: 16px! important; } .mc-pages #mc-embedded-subscribe{ font-size: 15px ! important; padding: 12px 16px ! important; background-color: #000 ! important; height: unset ! important; line-height: unset ! important; border-radius: 0 ! important; font-family: astoria-sans ! important; font-weight: 500 ! important; text-transform: uppercase ! important; } .mc-pages { max-width: 300px; } @media screen and (max-width: 1024px) { .mc-pages { max-width: 400px; } } /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ Email Address * (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[3]='ADDRESS';ftypes[3]='address';fnames[4]='PHONE';ftypes[4]='phone';}(jQuery));var $mcj = jQuery.noConflict(true);"
