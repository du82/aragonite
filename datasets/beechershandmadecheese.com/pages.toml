["https://beechershandmadecheese.com/recipe/sausage-topped-mac-cheese"]
title = "Sausage Topped Mac & Cheese - Beecher's Handmade Cheese"
description = "If you’ve been by our Pike Place Market location – you may have tried our “World’s Best” Mac & Cheese topped with sausage."
full_description = "Home / Recipes / Sausage Topped Mac & Cheese Table of Contents Background Cooking and Serving Tips Recipe Background If you’ve been by our Pike Place Market location – you may be one of the lucky ones who have tried our “World’s Best” Mac & Cheese topped with sausage. With a mindblowing combination of flavor in every bite, this dish is sure to be your next favorite. Cooking and Serving Tips You have two options when it comes to cooking sausage – on the stovetop or on the grill. For this recipe, we cooked our sausages on the stovetop. This process helps to maintain some of the moisture and leaves you with a plump, photo-ready sausage. If you don’t mind your sausage losing some of its volume, opting for the grill is a great choice. If you do, grill the sausages for 2 to 3 minutes on each side over medium-high heat or until they are heated through to 165 °F when tested with a thermometer. Equally important to cooking is cutting! We cut our sausages at a 45° angle in 1-inch pieces. After many tests, we found this method provided the ultimate sausage to mac and cheese ratio (seriously, it’s a science). Three noodles, some Flagship cheese sauce, and a slice of sausage = PERFECTION. Serve & Store Let cool for 5 minutes before serving. Enjoy hot. Leftovers can be stored in the fridge for 2 to 3 days. Recipe Instructions Cook “World’s Best” Mac & Cheese according to cooking instructions. In a large frying pan over medium-heat, add 3/4-cup water and the sausages. Cook the sausage for 10 to 12 minutes, turning frequently to evenly brown. Sausages will be done when they are heated through to 165°F when tested with a thermometer. (Water will evaporate while cooking.) Once your sausages are fully cooked, cut them into 1-inch pieces. Immediately after removing the mac and cheese from the oven, top with cooked sausage slices. Let set for 5 minutes. Serve hot. *We used bratwurst sausages, but any kind works! Use your favorite in this recipe – hot links, Italian, Kielbasas, whatever your heart desires! Prep Time: 15 minutes Cook Time: 40 to 50 minutes Total Time: 1 hour 5 minutes Serves: 2 to 4 (as a side) Ingredients 1 “World’s Best” Mac & Cheese (20oz pan) 1 package Bratwurst sausages (12oz) (4 sausages) 1 teaspoon paprika Featured Beecher's Ingredient “World’s Best” Mac & Cheese Shop Now Beecher's Food Used “World’s Best” Mac & Cheese Shop Now Don't feel like cooking? Our cafés are the best place for an authentic Beecher's experience. See Cafés Additional Recipes Irish Choux Pastry Gluten-Free Fried Cheese Curds Buffalo Chicken Mac & Cheese Pesto Mac & Cheese Irish Choux Pastry Gluten-Free Fried Cheese Curds View All Where to buy Find Beecher's at your local store or add to your next grocery delivery. Find a Store Never Miss a Recipe Sign up to receive the latest insights and offerings on all things Beecher's! .mc-pages form { margin: 0 ! important; } .mc-pages #mc_embed_signup_scroll { display: flex; justify-content: flex-start; gap: 10px; } .mc-pages .mc-field-group label { display: none ! important; } .mc-pages #mce-EMAIL { padding-left: 10px ! important; background: #fff ! important; border: 0 ! important; border-radius: 0 ! important; } .mc-pages #mce-responses { display: none ! important; } .mc-pages input#mce-EMAIL::placeholder { font-style: italic! important; font-size: 16px! important; } .mc-pages #mc-embedded-subscribe{ font-size: 15px ! important; padding: 12px 16px ! important; background-color: #000 ! important; height: unset ! important; line-height: unset ! important; border-radius: 0 ! important; font-family: astoria-sans ! important; font-weight: 500 ! important; text-transform: uppercase ! important; } .mc-pages { max-width: 300px; } @media screen and (max-width: 1024px) { .mc-pages { max-width: 400px; } } /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ Email Address 