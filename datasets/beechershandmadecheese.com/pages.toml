title = "Pea and Prosciutto Mac & Cheese - Beecher's Handmade Cheese"
description = '''Perfect for a stress-free, unique side for an impromptu dinner. Starting with "World's Best" Mac & Cheese from the freezer makes it easy.'''
full_description = "Home / Recipes / Pea and Prosciutto Mac & Cheese Table of Contents Background Cooking and Serving Tips Recipe Background One of the easiest embellishment dishes… But as anyone who’s put a slice of cheese on a cracker knows, simplicity and flavor often go hand-in-hand! We love this one. It’s delicious – plus, it takes next to no time to prepare. This is truly a great choice when you want something tasty and you want it now! Perfect for the chef on-the-go or as a unique side for an impromptu dinner. Cooking and Serving Tips When purchasing prosciutto, look for an option that contains no nitrates or nitrites. If you’re having difficulty finding a good option, ask your deli attendant. Most options are typically stored near the artisan cheese (and if you’re lucky, they will have Flagship, too!). Fresh peas can be hard to find – as they are in and out of season very quickly. If you’re able to find some, purchase them as close to cooking as possible. The longer fresh peas sit out, the less tender they become. Peas are best when their pods are a vibrant green and firm to the touch, so choose a bright, medium-sized pod with a firmer feel. Serve & Store Let cool for 5 minutes before serving. Enjoy hot. Leftovers can be stored in the fridge for 2 to 3 days. Recipe Instructions Preheat oven to 350˚F. Cook penne 2 minutes less than package directions. Rinse in cold water and set aside. Melt butter in a heavy bottomed saucepan over medium heat. Whisk in flour. Continue whisking and cook for 2 minutes. Slowly add milk while whisking. Cook until sauce thickens, about 10 minutes, stirring frequently. Remove from heat. Add 1-3/4 cups Flagship cheese, 1/4 cup Just Jack cheese, salt, 1/4 tsp. chili powder, and garlic powder. Stir until cheese is melted and all ingredients are incorporated, about 3 minutes. Combine pasta and sauce in a large bowl and mix carefully. Fold in peas and prosciutto. Scrape into an 8-inch baking dish. Sprinkle with remaining cheese and chili powder. Bake, uncovered, for 20 minutes. Let Mac & Cheese sit for 5 minutes before serving. Prep Time: 30 minutes Cook Time: 20 minutes Total Time: 50 minutes Serves: 2 to 4 (as a side) Ingredients 6 ounces penne pasta 8 ounces Beecher’s Flagship cheese, grated (about 2 cups) 1-1/2 cups milk 2 ounces Beecher’s Just Jack cheese, grated (about 1/2 cup) 2 tablespoons plus 2 teaspoons all-purpose flour 2 tablespoons unsalted butter 1/4 teaspoon Kosher salt 1/4 teaspoon chili powder Pinch garlic powder 1/3 cup peas, steamed 1/4 cup chopped prosciutto Featured Beecher's Ingredient Flagship Cheese Shop Now Beecher's Food Used Flagship Cheese Shop Now Don't feel like cooking? Our cafés are the best place for an authentic Beecher's experience. See Cafés Additional Recipes Irish Choux Pastry Gluten-Free Fried Cheese Curds Buffalo Chicken Mac & Cheese Pesto Mac & Cheese Irish Choux Pastry Gluten-Free Fried Cheese Curds View All Where to buy Find Beecher's at your local store or add to your next grocery delivery. Find a Store Never Miss a Recipe Sign up to receive the latest insights and offerings on all things Beecher's! .mc-pages form { margin: 0 ! important; } .mc-pages #mc_embed_signup_scroll { display: flex; justify-content: flex-start; gap: 10px; } .mc-pages .mc-field-group label { display: none ! important; } .mc-pages #mce-EMAIL { padding-left: 10px ! important; background: #fff ! important; border: 0 ! important; border-radius: 0 ! important; } .mc-pages #mce-responses { display: none ! important; } .mc-pages input#mce-EMAIL::placeholder { font-style: italic! important; font-size: 16px! important; } .mc-pages #mc-embedded-subscribe{ font-size: 15px ! important; padding: 12px 16px ! important; background-color: #000 ! important; height: unset ! important; line-height: unset ! important; border-radius: 0 ! important; font-family: astoria-sans ! important; font-weight: 500 ! important; text-transform: uppercase ! important; } .mc-pages { max-width: 300px; } @media screen and (max-width: 1024px) { .mc-pages { max-width: 400px; } } /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ Email Address * (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[3]='ADDRESS';ftypes[3]='address';fnames[4]='PHONE';ftypes[4]='phone';}(jQuery));var $mcj = jQuery.noConflict(true);"
