["https://beechershandmadecheese.com/product/roasted-potatoes-in-flagship-sauce"]
title = "Roasted Potatoes in Flagship Sauce - Beecher's Handmade Cheese"
description = "Roasted Potatoes in Flagship Sauce, featuring the Flagship cheese sauce that makes our “World’s Best” Mac & Cheese so delicious."
full_description = "Our Flagship cheese sauce is what makes our “World’s Best” Mac & Cheese so delicious – and on roasted potatoes, it’s mind-blowing. Non-GMO roasted potatoes, milk (vitamin D3 added), cheddar cheese (pasteurized milk, salt, culture, enzymes), mozzarella cheese (pasteurized milk, cheese cultures, salt, enzymes), jack cheese (pasteurized milk, salt, culture, enzymes), water, onion, rice starch, butter (cream, salt), chipotle puree (red chile, water, chipotles [smoked red jalapeño], apple cider vinegar, lime juice, rice flour, sea salt, garlic, onion, honey, rosemary, thyme, sage, bay leaves), salt, spices (thyme, black pepper, parsley), rice flour, dehydrated garlic. Ovens vary; cook to an internal temperature of 165°F as measured with a food thermometer. Keep frozen until ready to bake. CONVENTIONAL OVEN: Preheat oven to 375°F. Cut a 2-inch slit in film. Place pan on baking sheet and bake on middle rack for 50 minutes. Remove film and stir gently. Return to oven and continue to bake for 10 minutes or until product has reached 165°F. Remove from oven; contents will be very hot. Let set up to 5 minutes before serving. MICROWAVE: Cut a 2-inch slit in film. Microwave on high for 9 minutes. Remove film and stir gently. Microwave for an additional 3 minutes or until product has reached 165°F. Contents will be very hot. Let set up to 5 minutes before serving. This journey, beginning with fresh, locally sourced milk and adding the passion and skill of artisan cheesemakers, culminates in the best of all deliciousness - amazing, gourmet cheese."
