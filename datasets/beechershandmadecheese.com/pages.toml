["https://beechershandmadecheese.com/products/cauliflower-mac-alla-vodka-sauce"]
title = "Penne Alla “Vodka” Sauce with Cauliflower - Beecher's Handmade Cheese"
description = "The crunchy, nutty flavor of cauliflower folds perfectly into a sauce of bright marinara and creamy, flavorful Flagship sauce."
full_description = "We’ve combined a bright and zesty marinara with our creamy Flagship cheese sauce, making the perfect accompaniment to the crunch and nuttiness of cauliflower and our favorite penne pasta. The result is an indulgent dish everyone will love! Cooked enriched penne rigate (water, durum wheat semolina, niacin, iron, thiamin mononitrate, riboflavin, folic acid), cauliflower, milk (vitamin D3 added), cheddar cheese (pasteurized milk, salt, culture, enzymes), tomatoes (tomatoes, tomato puree, citric acid), water, jack cheese (pasteurized milk, salt, culture, enzymes), rice starch, garlic (garlic, water), jalapeño pepper, butter (cream, salt), rice flour, salt, lemon juice, chipotle puree (red chile, water, chipotles [smoked red jalapeño], apple cider vinegar, lime juice, rice flour, sea salt, garlic, onion, honey, rosemary, thyme, sage, bay leaves), cane sugar, spices (crushed red pepper, parsley, oregano, black pepper). Ovens vary; cook to an internal temperature of 165°F as measured with a food thermometer. Keep frozen until ready to bake. CONVENTIONAL OVEN: Preheat oven to 375°F. Cut a 2-inch slit in film. Place pan on baking sheet and bake on middle rack for 30 minutes. Remove film and stir gently. Return to oven and continue to bake for 10 minutes or until product has reached 165°F. Remove from oven; contents will be very hot. Let set up to 5 minutes before serving. MICROWAVE: Cut a 2-inch slit in film. Microwave on high for 5 minutes. Remove film and stir gently. Microwave for an additional 2 minutes or until product has reached 165°F. Contents will be very hot. Let set up to 5 minutes before serving. Ovens vary; cook to an internal temperature of 165°F as measured with a food thermometer. Keep frozen until ready to bake. CONVENTIONAL OVEN: Preheat oven to 375°F. Cut a 2-inch slit in film. Place pan on baking sheet and bake on middle rack for 30 minutes. Remove film and stir gently. Return to oven and continue to bake for 10 minutes or until product has reached 165°F. Remove from oven; contents will be very hot. Let set up to 5 minutes before serving."
