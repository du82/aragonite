title = "Flagship SugarBee Breakfast Bake - Beecher's Handmade Cheese"
description = "Start your morning right with a satiating breakfast bake featuring Beecher's Flagship cheese and SugarBee apples."
full_description = "Home / Recipes / Flagship SugarBee Breakfast Bake Table of Contents Background Cooking and Serving Tips Recipe Background Since we wake up with Flagship on the mind… we figured it was time to start working it into a nutritious breakfast that will fuel us throughout our day. And lately – we’ve had a huge obsession with SugarBee apples, a local grower with a truly unique apple variety that’s naturally created by bees. Anytime we bite into a SugarBee apple we have to wonder… is this dessert, or is this my apple a day that will keep the doctor away? Surprisingly, it’s both. Naturally sweet with a crisp bite, SugarBee was on our minds as we thought about how to tie an apple and Flagship into a breakfast situation – and we think we found a winner. Cooking and Serving Tips The best advice we can give for this recipe is to dice your apples very finely. We went for about 1/2 inch x 1/2 inch pieces, as this size made for the perfect amount of sweetness in every bite. Anything larger overpowered all the other ingredients in the egg bake and made the texture more dependent on how the apples cooked than how the egg baked. Depending on your preference, any size will work, but we unanimously voted a smaller chopped apple as the winner. Serve & Store We recommend serving warm and enjoying the day of, but a breakfast bake can always be stored in the fridge in a covered container for 2 to 3 days, and heated again before serving. Recipe Instructions Preheat oven to 400°F. Roughly chop bacon into 1-inch squares, then cook to crisp in a stovetop pan. Set cooked bacon aside. Using the same pan, add the onions to the remaining bacon grease left in the pan. Cook until soft and golden brown, stirring often and adding butter as needed to keep the onions from burning. Once caramelized, remove the pan from heat and set onions aside to cool. While cooling, whisk eggs until fully combined (see note). Once bacon and caramelized onions have cooled, combine eggs, diced SugarBee apples, bacon, half of the Flagship cheese, and caramelized onions into a bowl and mix. Pour egg mixture into an ungreased 9×9-inch baking dish. Arrange sliced apples on top, with remaining cheese. Bake in oven for 25 to 30 minutes, or until the center of your bake reaches 160°F. Serve warm. Garnish with chopped green onions. Note: For a lighter egg mixture, add 1/2 cup milk to eggs before whisking. Prep Time: 1 hr Cook Time: 30 min Total Time: 1 hr 30 min Serves: 4 Ingredients 12 eggs 1 large white onion, diced 1 package thick-cut bacon (about 8 slices) 6 ounces Flagship cheese, shredded (about 1 1/2 cup) 1 SugarBee apple, cut into 1/2-inch dice 1/2 SugarBee apple, sliced (for garnish) 1 tablespoon unsalted butter Green onion, minced (for garnish) Featured Beecher's Ingredient Flagship Cheese Shop Now Beecher's Food Used Flagship Cheese Shop Now Don't feel like cooking? Our cafés are the best place for an authentic Beecher's experience. See Cafés Additional Recipes Irish Choux Pastry Gluten-Free Fried Cheese Curds Buffalo Chicken Mac & Cheese Pesto Mac & Cheese Irish Choux Pastry Gluten-Free Fried Cheese Curds View All Where to buy Find Beecher's at your local store or add to your next grocery delivery. Find a Store Never Miss a Recipe Sign up to receive the latest insights and offerings on all things Beecher's! .mc-pages form { margin: 0 ! important; } .mc-pages #mc_embed_signup_scroll { display: flex; justify-content: flex-start; gap: 10px; } .mc-pages .mc-field-group label { display: none ! important; } .mc-pages #mce-EMAIL { padding-left: 10px ! important; background: #fff ! important; border: 0 ! important; border-radius: 0 ! important; } .mc-pages #mce-responses { display: none ! important; } .mc-pages input#mce-EMAIL::placeholder { font-style: italic! important; font-size: 16px! important; } .mc-pages #mc-embedded-subscribe{ font-size: 15px ! important; padding: 12px 16px ! important; background-color: #000 ! important; height: unset ! important; line-height