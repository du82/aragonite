title = "Hatch Chile Mac & Cheese - Beecher's Handmade Cheese"
description = "Introducing Beecher's Hatch Chile Mac & Cheese! This flavor bomb is a taste sensation that will leave you craving more."
full_description = "A flavorful spin on our “World’s Best” classic that packs a punch with its unique blend of creamy cheese and spicy, roasted Hatch chiles. Cooked enriched penne rigate (water, durum wheat semolina, niacin, iron, thiamin mononitrate, riboflavin, folic acid), milk (vitamin D3 added), cheddar cheese (pasteurized milk, salt, culture, enzymes), roasted Hatch green chile (green chile, water, lime juice), water, jack cheese (pasteurized milk, salt, culture, enzymes), roasted poblano peppers, butter (cream, salt), rice starch, chipotle in adobo puree (red chile, water, chipotles [smoked red jalapeno], apple cider vinegar, lime juice, rice flour, sea salt, garlic, onion, honey, rosemary, thyme, sage, bay leaves), salt, distilled white vinegar (distilled white vinegar diluted with water to 5% acidity), rice flour, Hatch chili powder (green chili peppers), jalapeno powder, smoked paprika, dehydrated garlic. Ovens vary; cook to an internal temperature of 165°F as measured with a food thermometer. Keep frozen until ready to bake. CONVENTIONAL OVEN: Preheat oven to 375°F. Cut a 2-inch slit in film. Place pan on baking sheet and bake on middle rack for 30 minutes. Remove film and stir gently. Return to oven and continue to bake for 10 minutes or until product has reached 165°F. Remove from oven; contents will be very hot. Let set up to 5 minutes before serving. MICROWAVE: Cut a 2-inch slit in film. Microwave on high for 6 minutes. Remove film and stir gently. Microwave for an additional 2 minutes or until product has reached 165°F. Contents will be very hot. Let set up to 5 minutes before serving. Ovens vary; cook to an internal temperature of 165°F as measured with a food thermometer. Keep frozen until ready to bake. CONVENTIONAL OVEN: Preheat oven to 375°F. Cut a 2-inch slit in film. Place pan on baking sheet and bake on middle rack for 45 minutes. Remove film and stir gently. Return to oven and continue to bake for 10 minutes or until product has reached 165°F. Remove from oven; contents will be very hot. Let set up to 5 minutes before serving."
