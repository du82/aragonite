["https://beechershandmadecheese.com/products/cacio-e-pepe-9-oz"]
title = "Cacio e Pepe - Beecher's Handmade Cheese"
description = "Packing deep, robust flavor, our Cacio e Pepe delivers an extraordinary journey for the taste buds, owing to a creamy sauce of rich, sharp cheese with a hint of cracked peppercorns. Enjoy the convenience of a delicious and satisfying meal in minutes."
full_description = "Packing deep, robust flavor, our Cacio e Pepe delivers an extraordinary journey for the taste buds, owing to a creamy sauce of rich, sharp cheese with a hint of cracked peppercorns. Cooked enriched penne rigate (water, durum wheat semolina, niacin, iron, thiamin mononitrate, riboflavin, folic acid), milk (vitamin D3 added), peppercorn cheese (pasteurized milk, salt, pepper, culture, enzymes), cheddar cheese (pasteurized milk, salt, culture, enzymes), Romano cheese (pasteurized part-skim cow’s milk, cheese culture, salt, enzymes), rice flour, water, butter (cream, salt), salt, green and black peppercorns, chipotle puree (red chile, water, chipotles [smoked red jalapeño], apple cider vinegar, lime juice, rice flour, sea salt, garlic, onion, honey, rosemary, thyme, sage, bay leaves), dehydrated garlic. Ovens vary; cook to an internal temperature of 165°F as measured with a food thermometer. Keep frozen until ready to bake. CONVENTIONAL OVEN: Preheat oven to 375°F. Cut a 2-inch slit in film. Place pan on baking sheet and bake on middle rack for 30 minutes. Remove film and stir gently. Return to oven and bake an additional 5 minutes or until product has reached 165°F. Remove from oven; contents will be very hot. Let set up to 5 minutes before serving. MICROWAVE: Cut a 2-inch slit in film. Microwave on high for 3 minutes. Remove film and stir gently. Microwave for an additional 1 minute or until product has reached 165°F. Contents will be very hot. Let set up to 5 minutes before serving. This journey, beginning with fresh, locally sourced milk and adding the passion and skill of artisan cheesemakers, culminates in the best of all deliciousness - amazing, gourmet cheese."
