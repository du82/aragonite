["https://beechershandmadecheese.com/product/cheese-curd-lasagna"]
title = "Cheese Curd Lasagna - Beecher's Handmade Cheese"
description = "Beecher's Cheese Curd Lasagna features our fresh cheese curds, a bright tomato sauce, and additional cheeses - including our Flagship cheese."
full_description = "Tomatoes (tomatoes, tomato puree, citric acid), cooked lasagna pasta (water, semolina [milled wheat], egg whites), ricotta cheese (pasteurized whey, pasteurized milk, pasteurized cream, vinegar, salt), cheese curds (pasteurized milk, salt, culture, enzymes), mozzarella cheese (pasteurized milk, cheese cultures, salt, enzymes), cheddar cheese (pasteurized milk, salt, culture, enzymes), spinach, water, extra virgin olive oil, olives (olives, water, sea salt), kale, garlic (garlic, water), sea salt, cane sugar, spices (oregano, thyme, black pepper, parsley, crushed red pepper), rice starch, non-gmo corn starch, dehydrated garlic. Ovens vary; cook to an internal temperature of 165°F as measured with a food thermometer. Keep frozen until ready to bake. CONVENTIONAL OVEN: Preheat oven to 375°F. Cut a 2-inch slit in film. Place pan on baking sheet and bake on middle rack for 30 minutes. Remove film. Return to oven and continue to bake for 5 minutes or until product has reached 165°F. Remove from oven; contents will be very hot. Let set up to 5 minutes before serving. MICROWAVE: Cut a 2-inch slit in film. Microwave on high for 5 minutes. Remove film. Microwave for an additional 30 seconds or until product has reached 165°F. Contents will be very hot. Let set up to 5 minutes before serving. Ovens vary; cook to an internal temperature of 165°F as measured with a food thermometer. Keep frozen until ready to bake. CONVENTIONAL OVEN: Preheat oven to 375°F. Cut a 2-inch slit in film. Place pan on baking sheet and bake on middle rack for 30 minutes. Remove film. Return to oven and continue to bake for 15 minutes or until product has reached 165°F. Remove from oven; contents will be very hot. Let set up to 5 minutes before serving. MICROWAVE: Cut a 2-inch slit in film. Microwave on high for 11 minutes. Remove film. Microwave for an additional 6 minutes or until product has reached 165°F. Contents will be very hot. Let set up to 5 minutes before serving. Ovens vary; cook to an internal temperature of 165°F as measured with a food thermometer. Keep frozen until ready to bake."
