title = "Beecher's Cheese Curd Chocolate Chip Cookies - Beecher's Handmade Cheese"
description = "Made with Beecher's Plain Cheese curds, these chewy chocolate chip cookies are rich and delicious, with a hint of salt."
full_description = "Home / Recipes / Beecher’s Cheese Curd Chocolate Chip Cookies Table of Contents Cooking and Serving Tips Recipe Cooking and Serving Tips We know cheese curds in cookies may be a little outside the box – but trust us, it’s worth a try! If you’re feeling skeptical, just chop your cheese curds a little finer. You control how crazy you go with the cheese, listen to your intuition! We used milk chocolate chips to give a more dynamic sweet-versus-umami flavor in each cookie. You can also control the sweetness of the cookie by adjusting your chocolate chip bitterness as desired. Note: For a cozy twist, add 1 teaspoon of cinnamon and 1/2 teaspoon of allspice to the dry ingredient mixture. And if you want to take it to a spicy new place, replace chocolate chips for 2 bars (chopped) of a spicy dark chocolate. Recipe Instructions Preheat oven to 375°F. In a medium-size bowl, stir the flour with baking soda and salt; set aside. In large mixing bowl, cream the butter, sugar, and brown sugar at medium speed until lightened in color. Add the vanilla, followed by the eggs, one at a time. Mix on low speed until incorporated. Gradually blend the dry mixture into the creamed mixture. Stir in curds and chocolate chips. Scoop by tablespoon and form into neat spheres, then place onto cookie sheets lined with parchment paper. Press a piece of chopped cheese curd into the top of the cookie ball (optional). Bake for 9 to 11 minutes or until the cookies are golden brown. Sprinkle tops with salt, if desired. Prep Time: 15 minutes Cook Time: 35 minutes Total Time: 50 minutes Ingredients 1 cup (two sticks) butter, softened 3/4 cup sugar 3/4 cup brown sugar, packed 2 eggs, large 2 teaspoons vanilla extract 2-1/4 cups flour, unsifted 1 teaspoon baking soda 1/2 teaspoon salt 1-1/14 cups Beecher’s Plain Cheese Curds, chopped 1-1/2 cups milk chocolate chips Featured Beecher's Ingredient Cheese Curds Bite-size nuggets of fresh cheese, also known as “squeaky cheese,” Cheese Curds are an ideal snack food, simple, appetizer, or delicious ingredient. Our Plain Cheese Curds are full-flavored with a clean, milky taste. Delivered in a bag weighing approximately 1 pound. Cheese Curds are offered online seasonally, available during the holidays. Shop Now Beecher's Food Used Cheese Curds Bite-size nuggets of fresh cheese, also known as “squeaky cheese,” Cheese Curds are an ideal snack food, simple, appetizer, or delicious ingredient. Our Plain Cheese Curds are full-flavored with a clean, milky taste. Delivered in a bag weighing approximately 1 pound. Cheese Curds are offered online seasonally, available during the holidays. Shop Now Don't feel like cooking? Our cafés are the best place for an authentic Beecher's experience. See Cafés Additional Recipes Irish Choux Pastry Gluten-Free Fried Cheese Curds Buffalo Chicken Mac & Cheese Pesto Mac & Cheese Irish Choux Pastry Gluten-Free Fried Cheese Curds View All Where to buy Find Beecher's at your local store or add to your next grocery delivery. Find a Store Never Miss a Recipe Sign up to receive the latest insights and offerings on all things Beecher's! .mc-pages form { margin: 0 ! important; } .mc-pages #mc_embed_signup_scroll { display: flex; justify-content: flex-start; gap: 10px; } .mc-pages .mc-field-group label { display: none ! important; } .mc-pages #mce-EMAIL { padding-left: 10px ! important; background: #fff ! important; border: 0 ! important; border-radius: 0 ! important; } .mc-pages #mce-responses { display: none ! important; } .mc-pages input#mce-EMAIL::placeholder { font-style: italic! important; font-size: 16px! important; } .mc-pages #mc-embedded-subscribe{ font-size: 15px ! important; padding: 12px 16px ! important; background-color: #000 ! important; height: unset ! important; line-height: unset ! important; border-radius: 0 ! important; font-family: astoria-sans ! important; font-weight: 500 ! important; text-transform: uppercase ! important; } .mc-pages { max-width: 300px; } @media scr