description = "Flagship Reserve is a special version of our signature Flagship cheese. Flagship Reserve is traditionally cloth-bound and open-air aged."
full_description = "Flagship Reserve is a special version of our signature Flagship cheese. It is made only on days when the milk composition is just right. The last curds on the table from these makes are used to produce Flagship Reserve truckles as it allows for slightly lower moisture, higher salt content and thus a richer taste and texture while maintaining a clean, creamy finish. In addition to using this special raw material, Flagship Reserve is traditionally cloth-bound and open-air aged. This method allows a 14 to 16% moisture loss during aging, concentrating the already rich flavor and producing a long finish. 2024: 1st Place American Cheese Society Cheddars wrapped in cloth, linen aged over 13 months, All Milks 2024: Gold World Championship Cheese Contest Natural Rinded Cheddar (voted into top 20 cheeses of the world) 2022: 1st Place American Cheese Society Cheddars wrapped in cloth, linen aged over 13 months, All Milks 2019: 1st Place American Cheese Society Cheddars wrapped in cloth, linen aged over 13 months, All Milks 2018: 2nd Place American Cheese Society Cheddars wrapped in cloth, linen aged over 13 months, All Milks 2017: 1st Place American Cheese Society Cheddars wrapped in cloth, linen aged over 12 months, All Milks 2016: 3rd Place American Cheese Society Cheddars wrapped in cloth, linen aged over 12 months, All Milks 2015: 3rd Place American Cheese Society Cheddars wrapped in cloth, linen aged over 12 months, All Milks This journey, beginning with fresh, locally sourced milk and adding the passion and skill of artisan cheesemakers, culminates in the best of all deliciousness - amazing, gourmet cheese."
