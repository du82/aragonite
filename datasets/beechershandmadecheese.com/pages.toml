title = "Hatch Jack Cheese - Beecher's Handmade Cheese"
description = "Hatch Jack has the rich, spicy heat of Hatch chiles combined with a creamy texture that delivers a savory cheese bite worth sharing."
full_description = "New Cheese! The rich, spicy heat of New Mexico-grown Hatch chiles combines with a creamy texture to deliver a savory cheese bite worth sharing. Pasteurized milk, Hatch green chile (New Mexico-grown green chile, water, lime juice, garlic, salt), salt, Hatch green chile powder, cultures, enzymes. This journey, beginning with fresh, locally sourced milk and adding the passion and skill of artisan cheesemakers, culminates in the best of all deliciousness - amazing, gourmet cheese."
