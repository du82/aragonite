["https://beechershandmadecheese.com/recipe/dungeness-crab-mac-cheese"]
title = "Beecher's Dungeness Crab Mac & Cheese - Beecher's Handmade Cheese"
description = '''The payoff for this recipe is pure, flavorful bliss – "World's Best" Mac & Cheese and Dungeness crab is a match made in heaven!'''
full_description = "Home / Recipes / Beecher’s Dungeness Crab Mac & Cheese Table of Contents Background Cooking and Serving Tips Recipe Background While this recipe takes a tad more work, the payoff is pure, flavorful bliss – a rich, tender, luxurious mac and cheese dish, all in the comfort of your own home! If you’ve never had crab mac and cheese… strap on your fishing waders and load the crab pots. Whether you prefer pre-cooked or live, the bottom line is that crab has never had a better home. We’re keeping it simple by letting the spotlight stay on our cheese, penne pasta, sweet Dungeness crab, remoulade, and Old Bay breadcrumbs. This dish rewrites the old trope that seafood and cheese can’t work together, and we know you’ll agree. Cooking and Serving Tips Choosing a crab: How do you know you made the right decision? Luckily, you really can’t go wrong. Any type of crab will be great in this mac. Typically, you’ll have more options in the summertime when it comes to fresh crab, but chances are high you can find Dungeness or King Crab at your local grocery store or with a fishmonger near you. We prefer Dungeness for the sweetness it brings to our “World’s Best” – plus, it’s balanced perfectly with the homemade remoulade and Old Bay Breadcrumbs! This recipe is not do-able without a food processor. A slow process as you incorporate oil into the remoulade is the only way to make it; Plus, it works wonders when you get to the breadcrumbs. And if there’s one thing you can’t forget – it’s the Old Bay. That’s our key to making these simple (yet super delicious) breadcrumbs exactly that. Make sure you have this seasoning staple in your kitchen before rolling up your sleeves – and if you don’t, go grab some! Serve & Store Let cool for 5 minutes before serving. Enjoy hot. Leftovers can be stored in the fridge for 1 to 2 days. Recipe Instructions Cook “World’s Best” Mac & Cheese according to cooking instructions. While the mac and cheese bakes, prepare the remoulade and breadcrumbs. Immediately after removing the mac and cheese from the oven, fold in the Dungeness crab. Top with the Flagship cheese, remoulade, and breadcrumbs. Return the pan to the oven and bake for 5 minutes or until the top is melted. Let set for 5 minutes. Serve hot. Remoulade Makes 1-1/2 cups To a food processor, add the egg yolk, lemon juice, ketchup, Dijon mustard, and Old Bay seasoning. Process for 20 seconds or until the ingredients are thoroughly combined. While processing, slowly add safflower oil to the mixture. (Make sure not to add the oil too quickly or the sauce will not evenly thicken up.) If the mixture is too thick, thin out with a small amount of warm water, 1 tablespoon at a time. Use immediately or refrigerate for up to 5 days. Old Bay Breadcrumbs Makes 1 cup In a mixing bowl, combine the panko crumbs, Old Bay seasoning, and olive oil. Thoroughly mix ingredients. Use immediately or store at room temperature for up to 2 weeks Prep Time: 45 minutes Cook Time: 40 to 50 minutes Total Time: 1 hour 30 minutes Serves: 2 to 4 (as a side) Ingredients 1 “World’s Best” Mac & Cheese (20oz pan) 1/2 cup Dungeness crab meat 2 tablespoons Remoulade (recipe follows) 3 tablespoons Old Bay Breadcrumbs (recipe follows) 1/4 cup grated Beecher’s Flagship cheese (about 1 ounce) Remoulade Makes 1-1/2 cups 1 egg yolk 1/4 cup lemon juice 1/4 cup ketchup 1 tablespoon Dijon mustard 1/2 tablespoon Old Bay seasoning 3/4 cup expeller-pressed safflower oil Old Bay Breadcrumbs Makes 1 cup 2 ounces Panko breadcrumbs Old Bay Seasoning, to taste 1-1/2 tablespoons extra-virgin olive oil Featured Beecher's Ingredient “World’s Best” Mac & Cheese Shop Now Beecher's Food Used “World’s Best” Mac & Cheese Shop Now Don't feel like cooking? Our cafés are the best place for an authentic Beecher's experience. See Cafés Additional Recipes Irish Choux Pastry Gluten-Free Fried Cheese Curds Buffalo Chicken Mac & Cheese Pesto Mac & Cheese Irish Choux Pastry Gluten-Free Fried Cheese Curds View All Where to buy Find Beecher's at your local store or add to your next grocery delivery. Find a Store Never Miss a Recipe Sign up to receive the latest insights and offerings on all things Beecher's! .mc-pages form { margin: 0 ! important; } .mc-pages #mc_embed_signup_scroll { display: flex; justify-content: flex-start; gap: 10px; } .mc-pages .mc-field-group label { display: none ! important; } .mc-pages #mce-EMAIL { padding-left: 10px ! important; background: #fff ! important; border: 0 ! important; border-radius: 0 ! important; } .mc-pages #mce-responses { display: none ! important; } .mc-pages input#mce-EMAIL::placeholder { font-style: italic! important; font-size: 16px! important; } .mc-pages #mc-embedded-subscribe{ font-size: 15px ! important; padding: 12px 16px ! important; background-color: #000 ! important; height: unset ! important; line-height: unset ! important; border-radius: 0 ! important; font-family: astoria-sans ! important; font-weight: 500 ! important; text-transform: uppercase ! important; } .mc-pages { max-width: 300px; } @media screen and (max-width: 1024px) { .mc-pages { max-width: 400px; } } /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ Email Address * (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';fnames[1]='FNAME';ftypes[1]='text';fnames[2]='LNAME';ftypes[2]='text';fnames[3]='ADDRESS';ftypes[3]='address';fnames[4]='PHONE';ftypes[4]='phone';}(jQuery));var $mcj = jQuery.noConflict(true);"
