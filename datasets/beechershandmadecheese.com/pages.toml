["https://beechershandmadecheese.com/recipe/chutney-grilled-cheese-masala-tomato-soup"]
title = "Chutney Grilled Cheese & Masala Tomato Soup - Beecher's Handmade Cheese"
description = "Make this deliciously unique chutney grilled cheese and masala tomato soup recipe, featuring Karachi Kitchen spices and chutneys."
full_description = "Home / Recipes / Chutney Grilled Cheese & Masala Tomato Soup Table of Contents Background Cooking and Serving Tips Recipe Background We got together with Sadaf and Kausar Ahmed, founders of Karachi Kitchen to learn more about their cultural and culinary roots in Pakistan. Between their 2017 cookbook “The Karachi Kitchen: Classic and Contemporary Flavors of Pakistan,” and their line of spices and chutneys, they have remained laser-focused: to help grow awareness and appreciation of Pakistani cuisine of Kausar’s birthplace, Karachi. As the nation’s bustling capital and main port city, Karachi cuisine is vibrant and full of heritage. From fish, to beef, to stews and street foods, the breadth of Pakistani food is far too complex to define in our simple comfort food recipe… but we look forward to continuing to experiment with our friends Karachi Kitchen and help spread the deliciousness that is their line of spices and chutneys. To learn more about Karachi Kitchen, and to shop their goods, visit https://www.karachikitchenfoods.com/ Cooking and Serving Tips We actually used a panini press to get a consistent two-sided cook on our sandwiches, but the cook time will remain somewhat similar. When in doubt, watch for cheese melt consistency and the color of the bread as it toasts. We found that our favorite parts of the soup were the bites where there was just enough chutney to be playful, but not so much as to diminish the masala-and-tomato chorus. Keep some chutney handy for dipping your toasty bread crusts into! Serve & Store Both of these are much better hot and fresh, but you can store either in an airtight container in the fridge for about a week. Recipe Instructions Grilled Cheese Instructions Place a medium-sized nonstick pan over medium heat. Optional: grease the pan with 1 teaspoon butter. Prepare each half of the bread with equal parts Flagship and Just Jack cheese. Add chutney to preference. We layered Spiced Plum Chutney on top of each cheese-covered half to give an extra flavorful center. Transfer loaded bread slices to the pan, warm for 1-2 minutes, or until cheese starts to melt. Once cheese is melting, take one half of the sandwich and place it filling-side down on top of the other. Continue to cook, flipping the sandwich periodically to check bread crispiness and cheese meltiness. Tomato Soup Instructions Cook Beecher’s Tomato Cheddar Soup according to the instructions on the package. Alternatively, prepare your favorite homemade tomato soup recipe until the ready-to-serve stage. With a whisk or immersion blender, incorporate your favorite Masala into the soup. We chose 3 tsp Garam Masala for an overall aromatic punch, at Kausar’s recommendation. Once incorporated and scooped into a serving bowl, spread shredded Flagship over the top of the hot soup, creating a float. Gently drop small dollops of chutney across float, then top with pinch of masala. We used the Spicy Mango Chutney for a perfect sweet-spicy contrast. Ingredients Grilled Cheese Ingredients: 2 pieces sourdough bread, sliced 2 ounces Flagship cheese, shredded or thinly sliced (about 1/2 cup) 2 ounces Just Jack cheese, shredded or thinly sliced (about 1/2 cup) 1 to 2 tablespoons Karachi Kitchen Chutney of choice Tomato Soup Ingredients: 1 (20 ounce) package Beecher’s Tomato Cheddar Soup 2 to 3 teaspoons + 1 pinch Karachi Kitchen Masala of choice 2 ounces Flagship cheese, shredded (about 1/2 cup) 1 tablespoon Karachi Kitchen Chutney of choice Please note, all proportions are based on 20oz serving of soups. Increase ingredients according to size of homemade soup recipe. Featured Beecher's Ingredient Tomato Cheddar Soup Shop Now Beecher's Food Used Tomato Cheddar Soup Shop Now Don't feel like cooking? Our cafés are the best place for an authentic Beecher's experience. See Cafés Additional Recipes Irish Choux Pastry Gluten-Free Fried Cheese Curds Buffalo Chicken Mac & Cheese Pesto Mac & Cheese Irish Choux Pastry Gluten-Free Fried Cheese Curds