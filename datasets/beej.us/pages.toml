["https://beej.us/smokeyjoes"]
title = "Smokey Joe's Cafe"
description = "Smokey Joe's Cafe information"
full_description = '''Smokey Joe's was a vegetarian breakfast/lunch joint in Berkeley, CA (at 1620 Shattuck Ave., to be particular). I put this page up so that it wouldn't be forgotten. I spent the morning of 9/11 in there drinking coffee and listening to the radio with Ned and Charlie. Ned was the owner. He used to get mad when people would try to order decaf, but was a fantastic guy. We ate there a lot. Then one sad day—probably around 2005—Ned informed me he was selling the place. "I don't want to die with a spatula in my hand," he said. I've scanned the menu, above, so follow the link to relive your old favorites: Primos, Jeff's Usual, and the Holy Mole Frijole Bowl. Addendum! Ned has written a book! lightnin, one g no apostrophe: a kid in the navy, romance of the sea, realities of war. I can personally certify that this is one of the most touching, human books I've ever read. And you shouldn't miss it, especially if you've ever met him. Buy it now!'''
