["https://beej.us/motorcycle"]
title = "Beej's Motorcycle Page"
full_description = '''IMPORTANT: USE THESE MAPS AT YOUR OWN RISK! I haven't even ridden half this stuff. Roads might be wrong; water, gas, and other waypoints might be non-existent! It's your adventure! By downloading the maps, you agree to the following terms: THE MAPS ARE PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE MAP CREATORS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM, OUT OF OR IN CONNECTION WITH THE MAPS OR THE USE OR OTHER DEALINGS IN THE MAPS. Please submit corrections to beej@beej.us. I can't ride all these myself. Maps General notes: "CG" means "Campground" and implies there is at least a pit toilet unless otherwise noted in the description. "Campsite" implies there are no facilities, but might be a convenient place to dry camp. It also implies that it is free to camp there. There is no water at a campground or campsite unless otherwise noted in the waypoint description. There are rivers and streams from time to time—carrying a water filter is recommended. If a waypoint says "filter water" or "creek water", this is where you can use your filter. The GPX files have Garmin-friendly icons. Basecamp should be able to use them without issue. You might have to turn on individual segments of the route on your GPS to see them, depending on the model. For large maps, most GPS models won't be able to display all segments at once. And again, the information on these maps could be out of date or inaccurate. Have a backup plan! Oregon North Cascades Route [GPX] Bend to Hood River or The Dalles. Intersects OBCDR #3 and #4. Oregon Newberry Summer Route [GPX] Bend to Summer Lake. Intersects OBCDR #5 and gets near #2. Oregon Fremont Point Lava Beds Route [GPX] Fremont Point to Lava Beds National Monument. Connects Oregon Newberry Summer Route to OBCDR #3. Intersects OBCDR #2 and #5. Oregon Santiam Crossing Route [GPX] Sisters to Sweet Home or Eugene. Intersects OBCDR #3 and #4. OBCDR #2 Unofficial [GPX] Chemult to Winter Ridge above Summer Lake. OBCDR #3 Unofficial [GPX] Hoodoo Ski Area (above Sisters) to Dorris, CA. OBCDR #4 Unofficial [GPX] Sisters to Seneca (roughly). OBCDR #5 Unofficial [GPX] Fairport to Walla Walla, WA. OBCDR #6 Unofficial [GPX] Crescent Lake area to Coos Bay area. California Trans-Sierra Route [GPX] North San Juan or Nevada City to Verdi, NV California Ponderosa Way Route [GPX] Cohasset to Highway 36 Idaho Magruder Corridor Route [GPX] Darby, MT to Grangeville, ID Idaho Hot Springs Route [GPX] Loop around central Idaho with hot springs. How I Make Maps I use the following to build these maps: CalTopo: main map building tool, exporter A couple custom Python scripts to convert GeoJSON to GPX, join, split, and simplify tracks, give waypoints Garmin-friendly names, etc. The basic process is that I generally make the map in CalTopo using its MVUM layer to verify routes, relying on other resources for the waypoints when necessary. Then I download the map as GeoJSON, and run it through my scripts to produce the GPX files. More Map Resources Some of the resources I use to gather information. CalTopo—Make and explore maps. USFS Interactive Visitor Map—Find camping (and prices and water) and other points of interest. BLM Recreational Opportunities Map—Same thing except for BLM. Pure-Gas—Map of clear gas providers. AAA TripTik—Camping and gas maps. Google Maps—Good for looking up gas station hours. Other map sites: RideBDR Maps and Tracks Official OBCDR Maps Trans-America Trail (Sam Correro) Trans-America Trail (gpsKevin) Great Continental Divide Route International Continental Divide Route Trans-Euro Trail Great Northern Adventure Route If you like these maps, you can support me by sending error reports of things that need to be improved and fixed. That's all I ask! beej@beej.us'''
