["https://beej.us/bio"]
title = "Beej's Bio"
description = "Brian 'Beej Jorgensen' Hall's Bio Page"
full_description = "The first digital photo of me ever taken, 1993, 136x117 GIF. My hair has since radically changed to be a lot more gray and lot less. And I literally have a gray beard. The Field: Software Developer, 20 years experience. Hewlett-Packard, Freestyle Interactive (a dot-com startup), Z-AXIS (an Activision studio), independent contracting, and co-founded Robot Stampede (a webdev company). Hobbies: Dual-sport motorcycling (DR-Z400S), caving, hiking, mountain biking, GIS (with qGIS), GPS, maps, survey, compass navigation. If you need some kind of fun GIS work, drop me a line. 😁 Currently: Computer Science Instructor at OSU-Cascades. Writing more free books, as always. As it is my passion, I'm going to be in education for the duration. The longest gig I'd had was the last one, the company I co-founded. That lasted 9 years. And after that it was time to turn to my next career: education. In a way, this was coming a full circle. I'd started off with Beej's Guide to Network Programming back in 1995 or so, and it was time to pursue that aspect of the field. To that end, I worked at a CS-oriented bootcamp for a number of years, developing curriculum and instructing. I also occasionally teach Computer Science as an adjunct at the local community college and state university. A good instructor can, over the course of their career, create hundreds of millions or even billions of dollars of GDP. Let's say a teacher teaches 40 students a year for 30 years. And Each of those students goes on to work for 40 years. And, due to the quality of instruction, they earn $10,000 more per year than they would have otherwise. At the bootcamp, each instructor saw a new cohort every month. We went through way more than 40 students per instructor per year. And so, I'm returning to it. It's the same reason I had the Network Programming guide out there in the first place: the hope that people will take the help I've giving and then, either individually or collectively, go on to accomplish more amazing things than I could even think of."
year_published = 2025
