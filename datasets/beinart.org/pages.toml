title = "Marina Dieul - Chapeau! | Beinart Gallery"
description = '''In 'Chapeau!' Marina Dieul invites viewers into a whimsical world where imagination and reality converge in playful harmony. Opening reception: Saturday, March 1st, 5 - 8pm. Drinks will be provided by our friends at Stomping Ground Brewing Co., Fin Wines and Cré Wines. This exhibition will run from March 2nd to March 23rd and will coincide with Stella Im Hultberg's 'Syzygy', Jolene Lai's 'Rainbows' End', and Josh Juett's 'Silent Treatment' . The title 'Chapeau!' is a double entendre: in French, it signifies both "hat" and an expression of admiration, offering a playful hint at the delights that await. The exhibition features a series of trompe-l'œil paintings depicting tiny mice adorned with an eclectic array of charming hats, each uniquely reflecting personality, whimsy, and wonder. From the delicate cap of a mushroom to the sophistication of a top hat, the creatures in this series converge at... Read More'''
