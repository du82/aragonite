represents an opportunity to pause, take a deep, cleansing breath, and momentarily step away from the constant churn... Read More In 'Silent Treatment', Josh Juett explores overthinking and intuition through distorted yet grounded still-life paintings. Opening reception: Saturday, March 1st, 5 - 8pm. Drinks will be provided by our friends at Stomping Ground Brewing Co., Fin Wines and Cré Wines. This exhibition will run from March 2nd to March 23rd and will coincide with Stella Im Hultberg's 'Syzygy', Jolene Lai's 'Rainbows' End', and Marina Dieul's 'Chapeau!'. Juett describes his approach to still life works as "a series of thoughts embedded into a collection of objects". To Juett, these objects represent a range of experiences and illustrate his tendency to ruminate and overthink every little thing in life. His first show with Beinart Gallery, 'Monologue', embodied this idea, serving as an expression of his inner dialogue. 'Silent Treatment', in contrast, is meant to counteract that. It represents an opportunity to pause, take a deep, cleansing breath, and momentarily step away from the constant churn of thoughts. In many ways, it's a passive-aggressive response to Juett's inclination to overthink everything. This series reflects his desire to escape the endless loop of his mind, at least briefly, by creating intuitively and engaging a part of his brain that isn't weighed down by detail. Juett created 'Silent Treatment' to push the boundaries of still life while remaining grounded in reality. The objects depicted could exist as they are represented, yet they inhabit a subtly subverted space. Reality is skewed but not shattered. Each piece explores new ways of distorting and manipulating reality, seeking a novel way of being. Much like Juett's ongoing effort to break out of negative behavioural cycles with age, this body of work strives to move his thoughts in a direction that allows for expression unbound by constant overthinking and rumination. Through this series, Juett engages with a different kind of art-making—one where intuition takes precedence, and the conscious mind steps aside. It's about discovering something unexpected, something new, by letting go of the need to control every detail. Josh Juett, an Adelaide-based artist from South Australia, creates work that explores personal revelations through objects infused with cryptic symbolism. His art showcases meticulous attention to detail and a deep appreciation for classical painting techniques. By blending these traditional methods with pop culture influences, Juett produces pieces that are both engaging and playful. Read Less Sold Out Josh Juett - 'Hang In There, Baby' - oil on wood console.log('') Josh Juett - 'Grafted' - oil on wood $2,090.00 AUD console.log('enquire') $2,090.00 AUD Josh Juett - 'Old Soul' - oil on wood $2,090.00 AUD console.log('enquire') $2,090.00 AUD Sold Out Josh Juett - 'Walkies' - oil on wood console.log('') Josh Juett - 'Twinzies' - oil on wood $2,090.00 AUD console.log('enquire') $2,090.00 AUD Josh Juett - 'Doggy Paddle' - oil on wood $2,090.00 AUD console.log('enquire') $2,090.00 AUD Josh Juett - 'My Sweet Baby' - oil on wood $2,090.00 AUD console.log('enquire') $2,090.00 AUD Josh Juett - 'Dolphinoplasty' - oil on wood $2,090.00 AUD console.log('enquire') $2,090.00 AUD Josh Juett - 'Wock' - oil on wood $2,090.00 AUD console.log('enquire') $2,090.00 AUD Josh Juett - 'Two Dimensional' - oil on wood $2,090.00 AUD console.log('enquire') $2,090.00 AUD Original Art Erika Sanada - "Chikkoi Warrior - Hana, Kaoru" - ceramic, cold finish Nom Kinnear King - 'Vedette' - oil on panel Nom Kinnear King - "Lueven" - oil on wood Calvin Ma - "Sway" - ceramic, glaze Pickled Circus - "The Artful Snatcher" - epoxy clay, resin, metal, wood & vinyl Toddlerpillar Gustavo Rimada - "Corazon de Piedra" - acrylic on wood Stéphanie Kilgast - "Snapshot" - mixed media sculpture on thrifted camera Stéphanie Kilgast - "Moving Pictures (Chameleon)" - mixed media sculptur