description = "Akishi Ueda's 'Memory of Landscape' delves into the fleeting nature of memory and its connection to landscapes. Join our collectors preview list for early access to the online catalogue. Opening reception: Saturday, March 29th, 5 - 8pm. Drinks will be provided by our friends at Stomping Ground Brewing Co., Fin Wines an"
full_description = "Akishi Ueda - Memory of Landscape Posted on January 12, 2025 Akishi Ueda's 'Memory of Landscape' delves into the fleeting nature of memory and its connection to landscapes. Join our collectors preview list for early access to the online catalogue. Opening reception: Saturday, March 29th, 5 - 8pm. Drinks will be provided by our friends at Stomping Ground Brewing Co., Fin Wines and Cré Wines. This exhibition will run from March 30th to April 20th and will coincide with Mark Seabrook's 'My Little Workhorse' and group exhibition 'Creatures: Art Toys & Sculptures'. Drawing inspiration from childhood recollections—such as the vivid, fiery sunsets of youth—the artist explores how the present swiftly transforms into the past, leaving a profound sense of solitude in its wake. Ueda's work contemplates the concept of shared memory, imagining a world where landscapes hold remembrances of those who experience them. Through this dialogue, the artist envisions a moment where personal and environmental memories converge, merging into a unified, transcendent experience. Akishi Ueda is known for art that evokes a sense of nostalgia and melancholy. Influenced from a young age by diverse forms of art, music, and cinema, Ueda found particular inspiration in J-Pop Surrealism. This genre approaches Pop Surrealism from a distinctly Japanese perspective. This influence is evident in his range of works, from endearing to unsettling motifs, often featuring fantastical creatures. Initially active primarily in the Japanese art scene, Ueda gained international recognition in 2019 by winning the Beautiful Bizarre Art Prize sculpture category. This accomplishment was a gateway to extend his artistic activities into the English-speaking world, where he has continued to attract fans and collectors alike. Share 0 Tweet Pin it 0 Fancy +1 Tags: ← Holiday Shipping and Gallery Closed Dates"
