olene Lai’s new solo collection of oil paintings, 'Rainbow’s End', is a homage to her cherished childhood memories. Opening reception: Saturday, March 1st, 5 - 8pm. Drinks will be provided by our friends at Stomping Ground Brewing Co., Fin Wines and Cré Wines. This exhibition will run from March 2nd to March 23rd and will coincide with Stella Im Hultberg's 'Syzygy', Marina Dieul's 'Chapeau!' and Josh Juett's 'Silent Treatment'. "Someday we'll find it, the rainbow connection, the lovers, the dreamers and me." As a child, Lai was captivated by tales of pots of gold at the end of rainbows and the leprechauns guarding them. She has always fantasised about the journey to the elusive rainbow and what lies at its end. Despite learning what makes a rainbow, those fairy tales still spark a sense of wonder and adventure, beckoning her to them and calling her to explore. Through this collection, Jolene invites viewers on a journey of discovery, much like the journey to a rainbow’s end, connecting disparate realms in each piece. Jolene Lai is a Los Angeles-based artist and illustrator born and raised in Singapore. She works primarily with oil on canvas or mixed media on watercolour paper. With bold use of colour, shape and intricate detail, she creates images with a seductive aesthetic and subject matter that weaves in emotions of whimsy, melancholy, irony and absurdity. Read Less Jolene Lai - 'Rainbow's End' - oil on wood panel $2,640.00 AUD console.log('enquire') $2,640.00 AUD Sold Out Jolene Lai - 'The Hour' - oil on wood panel console.log('') Jolene Lai - 'Building 15' - oil on wood panel $3,080.00 AUD console.log('enquire') $3,080.00 AUD Sold Out Jolene Lai - 'The Visitor' - oil on wood panel console.log('') Jolene Lai - 'Mononoke' - oil on wood panel $4,840.00 AUD console.log('enquire') $4,840.00 AUD Jolene Lai - 'Birdcage' - oil on wood panel $2,750.00 AUD console.log('enquire') $2,750.00 AUD Jolene Lai - 'Unicorn' - oil on wood panel $3,080.00 AUD console.log('enquire')