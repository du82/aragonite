 this series converge at... Read More In 'Chapeau!' Marina Dieul invites viewers into a whimsical world where imagination and reality converge in playful harmony. Opening reception: Saturday, March 1st, 5 - 8pm. Drinks will be provided by our friends at Stomping Ground Brewing Co., Fin Wines and Cré Wines. This exhibition will run from March 2nd to March 23rd and will coincide with Stella Im Hultberg's 'Syzygy', Jolene Lai's 'Rainbows' End', and Josh Juett's 'Silent Treatment' . The title 'Chapeau!' is a double entendre: in French, it signifies both "hat" and an expression of admiration, offering a playful hint at the delights that await. The exhibition features a series of trompe-l'œil paintings depicting tiny mice adorned with an eclectic array of charming hats, each uniquely reflecting personality, whimsy, and wonder. From the delicate cap of a mushroom to the sophistication of a top hat, the creatures in this series converge at a point of fantasy and meticulous detail, exemplifying the transformative power of art to blur the boundaries between the ordinary and the extraordinary. Dieul's work encourages viewers to rediscover a sense of curiosity, viewing the world through a lens of lighthearted creativity. Each meticulously crafted, round miniature scene celebrates the art of illusion, drawing attention to the magic that lies in the smallest details. 'Chapeau!' is a tribute to the transformative and playful nature of identity, where even the humblest of creatures can be reimagined as regal, dreamlike figures simply by donning a new persona. Born in France, Marina Dieul showed great interest in painting and drawing from an early age. Her family encouraged her vocation and in early 2000 she moved to Canada, where she now lives and works. Dieul is known for her animals and portrait paintings in trompe-l'oeil style, which are full of humor and poetry. She works in her Montreal studio surrounded by the many cats she fosters for a no-kill shelter. Read Less Sold Out Ma