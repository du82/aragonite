ce as resurfacing memories and... Read More Stella Im Hultberg's 'Syzygy' reflects on the nature of identity, shaped by a blend of personal experiences and memories, and the connections we form with the world around us. Opening reception: Saturday, March 1st, 5 - 8pm. Drinks will be provided by our friends at Stomping Ground Brewing Co., Fin Wines and Cré Wines. This exhibition will run from March 2nd to March 23rd and will coincide with Jolene Lai's 'Rainbows' End', Marina Dieul's 'Chapeau!' and Josh Juett's 'Silent Treatment'. This body of work was created during Hultberg's first year in Korea after spending nearly 30 years in the US. It delves into her reconnection with her birthplace, now seen through the lens of an almost-outsider. As a third culture kid, Hultberg never felt fully at home anywhere, yet she was able to find a sense of belonging almost anywhere. The move brought her a newfound peace as resurfacing memories and forgotten moments aligned, linking her to deep subconscious places. The title "Syzygy," meaning planetary alignment, symbolises the various connections Hultberg explores—those to people, culture, history, and time. These connections can be celebratory, burdensome, or somewhere in between, and they are not only physical but also span different times and spaces, often rearranging in unexpected ways. In this collection, Hultberg incorporates traditional Korean motifs and materials like Jagae (abalone and mother-of-pearl), which are traditionally used in Korean lacquerware. These elements are her way of reconnecting with her late mother, her cultural heritage, and moments beyond her conscious awareness, reaching for something larger than herself. Through both two-dimensional paintings and three-dimensional sculptures, Hultberg explores the dualities of human connection—its beauty and its burdens—and the complex ways we inherit and pass on these connections. The sculptures, exposed to external elements yet cloaked in safety, serve as a reminder that it’s okay to withdraw from unwanted stimuli, but we must also remain open to the world and others. Stella Im Hultberg was born in South Korea, grew up in Seoul, Hong Kong, Taiwan, and California. She studied Industrial Design and worked as a product designer before serendipitously falling into the art world in 2005. Read Less Stella Im Hultberg - 'Fragrant Burdens' - jagae (Korean abalone shell and mother-of-pearl) and acrylic on wood $3,300.00 AUD console.log('enquire') $3,300.00 AUD Stella Im Hultberg - 'Memories of Tomorrow' - jagae (Korean abalone shell and mother-of-pearl) and acrylic on wood $3,300.00 AUD console.log('enquire') $3,300.00 AUD Sold Out Stella Im Hultberg - 'The Introvert 1' - jagae (Korean abalone shell and mother-of-pearl) acrylic and graphite on clay console.log('product') Sold Out Stella Im Hultberg - 'The Introvert 2' - jagae (Korean abalone shell and mother-of-pearl) acrylic and graphite on clay console.log('') Stella Im Hultberg - 'Sanguine' - acrylic on wood $4,950.00 AUD console.log('enquire') $4,950.00 AUD Stella Im Hultberg - 'Epistrophe' - acrylic on canvas $5,720.00 AUD console.log('enquire') $5,720.00 AUD Stella Im Hultberg - 'Somewhere in Time' - acrylic on wood $3,080.00 AUD console.log('enquire') $3,080.00 AUD Stella Im Hultberg - 'Tearache' - jagae (Korean abalone shell and mother-of-pearl) acrylic and graphite on clay $1,210.00 AUD console.log('enquire') $1,210.00 AUD Sold Out Stella Im Hultberg - 'Jagae and Graphite Study 2' - jagae (Korean abalone shell and mother-of-pearl) and acrylic and graphite on wood console.log('') Stella Im Hultberg - 'Jagae and Graphite Study 1' - jagae (Korean abalone shell and mother-of-pearl) and acrylic and graphite on wood $1,320.00 AUD console.log('enquire') $1,320.00 AUD Stella Im Hultberg - 'Monologue' - jagae (Korean abalone shell and mother-of-pearl) and acrylic and graphite on wood $2,640.00 AUD console.log('enquire') $2,640.00 AUD Original Art Erika Sanada - "Chikkoi Warrior - Hana, 