description = "Stella Im Hultberg's 'Syzygy' reflects on the nature of identity, shaped by a blend of personal experiences and memories, and the connections we form with the world around us. Opening reception: Saturday, March 1st, 5 - 8pm. Drinks will be provided by our friends at Stomping Ground Brewing Co., Fin Wines and Cré Wines. This exhibition will run from March 2nd to March 23rd and will coincide with Jolene Lai's 'Rainbows' End', Marina Dieul's 'Chapeau!' and Josh Juett's 'Silent Treatment'. This body of work was created during Hultberg's first year in Korea after spending nearly 30 years in the US. It delves into her reconnection with her birthplace, now seen through the lens of an almost-outsider. As a third culture kid, Hultberg never felt fully at home anywhere, yet she was able to find a sense of belonging almost anywhere. The move brought her a newfound peace as resurfacing memories and... Read More"
