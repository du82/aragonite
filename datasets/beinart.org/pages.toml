description = '''Jolene Lai’s new solo collection of oil paintings, 'Rainbow’s End', is a homage to her cherished childhood memories. Opening reception: Saturday, March 1st, 5 - 8pm. Drinks will be provided by our friends at Stomping Ground Brewing Co., Fin Wines and Cré Wines. This exhibition will run from March 2nd to March 23rd and will coincide with Stella Im Hultberg's 'Syzygy', Marina Dieul's 'Chapeau!' and Josh Juett's 'Silent Treatment'. "Someday we'll find it, the rainbow connection, the lovers, the dreamers and me." As a child, Lai was captivated by tales of pots of gold at the end of rainbows and the leprechauns guarding them. She has always fantasised about the journey to the elusive rainbow and what lies at its end. Despite learning what makes a rainbow, those fairy tales still spark a sense of wonder and adventure, beckoning her to them and calling her to... Read More'''
