description = '''In 'Silent Treatment', Josh Juett explores overthinking and intuition through distorted yet grounded still-life paintings. Opening reception: Saturday, March 1st, 5 - 8pm. Drinks will be provided by our friends at Stomping Ground Brewing Co., Fin Wines and Cré Wines. This exhibition will run from March 2nd to March 23rd and will coincide with Stella Im Hultberg's 'Syzygy', Jolene Lai's 'Rainbows' End', and Marina Dieul's 'Chapeau!'. Juett describes his approach to still life works as "a series of thoughts embedded into a collection of objects". To Juett, these objects represent a range of experiences and illustrate his tendency to ruminate and overthink every little thing in life. His first show with Beinart Gallery, 'Monologue', embodied this idea, serving as an expression of his inner dialogue. 'Silent Treatment', in contrast, is meant to counteract that. It represents an opportunity to pause, take a deep, cleansing breath, and momentarily step away from the constant churn... Read More'''
