["https://bellroy.com/our-materials"]
title = "Our Materials: Premium Leather & Fabric Quality Information | Bellroy"
description = "Bellroy puts its heart, soul and countless design hours into helping the world carry with simplicity and ease. Every piece has been deeply considered, for the best of life's little moments."
full_description = "We select our materials based on a balance of functionality, durability and their ability to age gracefully. We are also committed to making them more environmentally sustainable – using fabrics made from recycled and plant-derived materials, and sourcing leathers with the least environmental impact. We use leather for things like wallets and zip pulls, because it feels great in hand, and stands up to the test of time. And we only use the best leather we can source, from Leather Working Group gold-rated tanneries. All our leather is full-grain, chrome-tanned, cow leather. Sourced from specialist tannery, ECCO Leather, these leathers are tanned using their revolutionary DriTan™ technique. This innovative method harnesses the moisture in the hide, saving water and reducing chemicals. The result is a rich, durable leather that’s better on the environment. This finish showcases the aniline hides in a more natural state – allowing the grain and personality to develop richer texture and character as they age. All of our leather comes from tanneries that have earned a gold rating from the Leather Working Group, meaning they’ve achieved excellence in environmental and labor practices. It also means our leather is premium quality, so it feels great, and ages beautifully. This finish showcases the aniline hides in a more natural state – allowing the grain and personality to develop richer texture and character as they age. This unique finish is available in both dressed and naked leather, and is infused with an oil during tanning that gives it impressive water resistance. The 100% recycled polyester and nylon fabrics we use in our bags and pouches perform just as well as virgin materials, with far less impact on the environment. This is a lightweight recycled nylon with a subtle crinkle. It has a water-resistant, matte finish and is designed to drape, slouch and flow as you do. This weave is finished with a water-based wax resin and polyurethane coating. Giving it a matte, rubberlike texture, with extra durability and water-resistance."
year_published = 2025
