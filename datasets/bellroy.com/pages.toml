["https://bellroy.com/journal/celebrating-ten-years"]
title = "A Decade of Design | The Journal | Bellroy"
description = "Bellroy puts its heart, soul and countless design hours into helping the world carry with simplicity and ease. Every piece has been deeply considered, for the best of life's little moments."
full_description = "Bellroy originated 10 years ago, when a team of product designers and engineers realized they could re-engineer the standard wallet – and use it to better not only the way we move through life, but also what that life looks like for all of us. And, after 10 big years, here we are – and we’re thrilled you’re here too. We’ve come a long way since we first sat around a kitchen table in Bells Beach with an idea, and it’s thanks to you, our community, that we’re able to do the work we do. Our progress is your progress. And here are some highlights from the journey so far. We sat around a kitchen table, drawing insights from our carry blog, Carryology, as well as collective knowledge about product design, engineering and business, and an optimistic spirit… to show the world how slim a wallet could be. That very first design became what we now call the Slim Sleeve. We launched our first range of products in August – with five wallets shot on a backyard fence in Melbourne. The Very Small, Very Protective, Slim Sleeve, Hide & Seek and Take Out were all designed to let folks store and carry their daily essentials in minimalist formats. Bellroy’s in-house photo team decided to experiment with adding movement to our product photography… It’s fair to say our stop-motion videos have come a long way since this masterpiece (that we now affectionately call ‘Slug Money’). We soon started to see that the world had been ready and waiting for slim wallets. So we doubled down, registered slimyourwallet.com and launched a campaign that we’re still known for today. After initial success with our everyday wallets, we expanded into travel, with our iconic and ever-popular Travel Wallet. Since then, we’ve found our way into more than 1200 stockists around the globe, and we’re pleased to say Huckberry is still one of them, 8 years later. With fiberboard trunks handmade in Melbourne, the team carried our wallet range across the world for their first international trade show."
year_published = 2010
