["https://bellroy.com/customer-care/warranty"]
title = "Product warranties | Bellroy"
description = "Bellroy puts its heart, soul and countless design hours into helping the world carry with simplicity and ease. Every piece has been deeply considered, for the best of life's little moments."
full_description = "Our products are all covered by warranty. The duration of that warranty depends on the category of product. Wallets, phone cases, pouches and accessories: 3-year warranty All bags: 6-year warranty If you’re not sure under which category a product falls, you will find the applicable warranty specified on every product page. Our number one environmental goal is to make products that can be used and loved for as long as possible. And a product warranty is one way we define what ‘as long as possible’ means. These timeframes represent our best assessment of how long the materials, hardware, coatings and components in our products are predicted to last within their expected conditions and frequency of use. We believe they can last much longer, but it would be disingenuous for us to guarantee it. The warranty covers you for the timeframe stated above, from the date of purchase, within the intended use. Try not to over-stuff your Bellroy or use it in ways it’s not designed to be used. For example, putting more than the recommended number of cards in a leather wallet can place undue pressure on the stitching. And taking a daily backpack to Everest Base Camp will expose it to weather it was never meant to face. This warranty covers faults in materials and workmanship and doesn’t apply to regular signs of aging, if damage is caused by unreasonable use or neglect, or if you change your mind. In order to make a warranty claim, you need to have verifiable proof of purchase. (And for the original purchase to have been from a legitimate seller.) Bellroy’s warranties sit alongside applicable consumer protection law. Note: owners of an Apex Backpack are still covered by a 10-year warranty. To make a warranty claim Email our support team with your order details and a description of the fault or damage. Including photographs of any fault will help us address your claims quickly and efficiently. Special Warranty on Carryology x Bellroy Chimera Sling Due to the limited nature of the Chimera Sling, Bellroy will not accept “change of mind” returns. We have a very small amount of stock reserved for warranty claims. After that allocation is exhausted, our standard 3-year warranty will be honored with a replacement of a similar item (or items to the same value)."
