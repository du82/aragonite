["https://bellroy.com/journal/a-designers-perspective"]
title = "A Designer's Perspective | Bellroy"
description = "Designers Edition lead designer, Davin Hanna, shares his perspective on design and the process that guides it."
full_description = "At Bellroy, every product is the result of a highly collaborative process. While the Designers Edition range came together from techniques and details the team had collected over the years, there is one person who feels particularly connected to the collection. Here, DE lead designer, Davin Hanna, shares his perspective on design, and the process that guides his work. Design is like a constant dance between function and aesthetic. I believe a well-designed product holds beauty and desire on the surface, and true-to-purpose function within. My father, a master craftsman, taught me from an early age to build, design and think about objects with real care and detail. I'd sit and watch him in his workshop, lights on well into the night as he worked on his ukuleles – anything from small problem-solving to entire builds. Some projects lasted for months as he prepared the materials, built jigs and molds, steamed and formed the timber body, and finessed the inlays. If I was lucky enough, he'd let me tackle some of the elements under his guidance. Seeing​ the detail that came from the investment of time, creative thought, problem solving and an experienced hand, set the tone for me as a designer. But let’s not confuse detail with complexity. Some of the most beautiful objects are daringly simple. ”Stop looking at yourself as a designer and start thinking of yourself as a deliverer of ideas.” – Stale Malvær In delivering an idea, I always break down the vision I have of an item’s finished state into its parts – function, detail, material and finish. These components are like the DNA or soul of the product. And it’s the material realisation of this that defines the beauty and success of the finished piece. This is where the process is critical. For me, it begins with concepts (mostly sketches and mood boards). I group the most compelling ideas into a couple of directions and bring them into a physical form. This is where the real learning begins. At Bellroy, we refer to this as the ‘experience’ – moving beyond a sketch, to a build process that feels more refined and intricately formed with each round."
year_published = 2025
clearnet = "https://bellroy.com/journal/a-designers-perspective"
