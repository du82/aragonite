full_description = "Worldwide Shipping Bellroy customers live all across the globe, so we can ship to anywhere with a letterbox. For P.O. boxes outside Australia and Europe, please use the regular shipping option at checkout (our team of trained delivery owls aren’t allowed in government buildings just yet). We usually dispatch orders within 2 working days. Delivery times vary based on selected service and destination. Regular post ranges from 3 to 28 working days depending on the shipping address. Express Shipping We offer express delivery to most locations with tracking available. Express shipping is generally 1–3 working days for the US, UK and Australia, and anywhere from 2–8 working days for other countries. If you live down a kangaroo trail in Kalkarindji, please allow a bit of extra time. ​In a few locations around the world we don’t offer an express option. This is because the current express services in those regions aren’t reliable enough, or there are currently no options available in that region. Customs Fees Extra duties and taxes may apply to the following regions: Asia, South America, Africa, and some European countries that are not members of the EU. During the checkout process a message will appear for applicable countries once the shipping destination has been selected. Bellroy will not be responsible for any customs and duties charged to a customer. If you’d like to find out more please email our support team. Why did you alter my address? Our shipping provider requires all addresses be written in Latin characters. So we look up the Latin version of your address using an address validation service. What if the updated address is incorrect? The majority of addresses are correctly converted. However, if you know your address has been incorrectly converted, our friendly support team can help fix it before your package is dispatched. Otherwise, our shipping provider will contact you to obtain the correct address and arrange delivery, at no extra cost to you."
