["https://bellroy.com/customer-care/phone-support"]
title = "Why we don't offer phone support | Bellroy"
description = "Bellroy puts its heart, soul and countless design hours into helping the world carry with simplicity and ease. Every piece has been deeply considered, for the best of life's little moments."
full_description = "We offer 24-hour customer support 7 days a week. You can contact us via: Email Facebook Instagram Threads TikTok X (formerly Twitter) We’re a small, knowledgeable and enthusiastic team of people eager to answer your questions and solve your Bellroy problems, no matter what time of the day or night. We do this via multiple digital channels, but we don’t offer phone support for the following reasons: We wouldn’t be able to offer the same level of support over the phone, as we often need to share photos of products or screen shots of the website with our customers. Email and social media are best for this reason. We can instantly check your order status or solve an issue online without needing to put you on hold. We’re a global support team. Our current channels allow us to use translators so that we can effectively communicate with all of the members in our community. Using online support channels allows us to keep your information and support history in the one spot, making sure that we have a detailed account of our communication with you. Nobody likes having to explain a situation over again because you get a different support person when you call. If you have any further questions please contact us via support@bellroy.com or one of our other channels."
