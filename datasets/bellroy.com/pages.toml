["https://bellroy.com/journal/people"]
title = "People Articles | The Journal | Bellroy"
description = "Bellroy puts its heart, soul and countless design hours into helping the world carry with simplicity and ease. Every piece has been deeply considered, for the best of life's little moments."
full_description = "Discover the value – and joy – in the kind of adventure that’s outside your door. And hear from those who have discovered it already. From couch surfing in Mexico, to cricket in the backyard, Melbourne artist Tom Gerrard gives us the stories of his drawings. We spoke to an Olympian, an Everest climber and a creative business owner, to find out what it's like to live on the edge. We asked some friends to share their favorite Bellroy moments, and got some great stories, from the heartwarming to the hilarious. Bellroy in 2020 is a remarkably different business to when we sold our first wallet in 2010. Our co-founders, Andy and Lina, share their thoughts on the journey that's been - and the best that's yet to come. The artist behind our Galaxy Grey Designers Edition collaboration reveals how she evokes the micro and the macro, from one humble starting point. We can learn a lot from someone about the material objects they rely on. For artist Stephen Baker, his tools hint at a craft that's both simple and complex, analogue and digital. We can learn a lot about someone from the material objects they rely on. For agile project manager and social enterprise founder, Joel Hanna, it's about finding freedom and focus, no matter what (or where). We can learn a lot about someone from the material objects they rely on. For interior designer Grace Lim, her tools reveal a level of detail and craft that merge artist with mathematician. We can learn a lot about someone from the material objects they rely on. For 'The Keyhole Surgeon', his tools hold a history (and some secrets) like few others. We can learn a lot about someone from the material objects they rely on. With Anna Marrone, we get the sense that tactility is everything. Australian artist and illustrator Karan Singh describes his career path as a personal project that just got out of hand. This Hawaiian-based photographer demonstrates an almost sage-like ability to determine what is most important in her life, and make it abundant."
year_published = 2025
