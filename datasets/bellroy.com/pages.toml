["https://bellroy.com/customer-care/orders"]
title = "Orders | Bellroy"
description = "Bellroy puts its heart, soul and countless design hours into helping the world carry with simplicity and ease. Every piece has been deeply considered, for the best of life's little moments."
full_description = "Order Tracking All express shipped orders can be tracked online. However, not all regular shipments have this option. You can find your tracking number two ways: Check the shipping confirmation email we sent you (this should arrive in your inbox within 48 hours of purchase). The email will contain a tracking link if there’s one available. If that doesn’t work: Email our support team and quote your order number/customer reference number. We’ll help you with the rest. What if my order doesn’t arrive? If your order doesn’t arrive within the maximum estimated timeframe we’ll send out a replacement using express shipping wherever it’s available. Simply email our support team with your order details. Can I cancel my order? We'll do our best to catch your order before it has processed, if you contact our support team within 48 hours. Email support@bellroy.com with your request. While we will make every effort to intercept the transaction settlement and shipping process, please note, we cannot guarantee that a cancellation will be possible. In the event that the order has already processed, you can still apply for a standard return. Thank you for your understanding. What are my payment options? Payment options in your region will be displayed at checkout. These generally include most major credit cards, as well as Paypal, Google Pay and Apple Pay. What currency can I pay in? Depending on where you're browsing from, we try to select the best currency for you to pay in. All transactions are processed in the currency shown on the product and checkout pages. Most countries have tax included in the price, if not, the tax will be shown on the checkout page before purchase."
year_published = 2025
