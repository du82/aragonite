["https://bellroy.com/collaborations/jeff-staple"]
title = "Bellroy X Staple Tote | Collaboration tote for charity | Bellroy"
description = "Bellroy and Staple come together to honor our collective, global frontline. This is a collaboration tote, the net proceeds of which goes to Australian Red Cross and NYU Langone Health."
full_description = "Bellroy and Staple come together to honor our collective, global frontline – the people who nurse us to health, fight our fires, rescue our wildlife, deliver aid. We have all been impacted by events this year, but it’s the first responders who had to put on their uniforms and front up to the biggest challenges every single day. To me, being a firefighter in times like these means being available to the community in whatever way they need us. Helping others gives me perspective on life. It reminds me how fortunate I am, and that everybody has a story. In a small town you’re always on the front line. When the town was under fire threat, it didn’t matter if you were a paid firefighter, CFA volunteer or local; everyone worked together. Being on the frontline during a bushfire, watching the earth burn, means that the effects of climate change are front of mind for me. It feels urgent. We were firefighting in emergency conditions non-stop from August to February. Our community has been very generous; we’re working hard to put that generosity to best use. Look no further! While gift card payment is no longer available at checkout, you can still use yours to pay. Hit the link below, and someone from our friendly support team will help you get what you’re after. (Just think of them as your personal shopper.) You are signing up to receive product updates and newsletters. By signing up, you are consenting to our privacy policy but you can opt out at any time. You are signing up to receive product updates and newsletters. By signing up, you are consenting to our privacy policy but you can opt out at any time."
