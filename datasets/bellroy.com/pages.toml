["https://bellroy.com/customer-care/materials"]
title = "Materials | Bellroy"
description = "Bellroy puts its heart, soul and countless design hours into helping the world carry with simplicity and ease. Every piece has been deeply considered, for the best of life's little moments."
full_description = "Our number one environmental goal is to make products that are used and loved for as long as possible. So, our materials need to be robust and maintain a lasting appeal. Bio Phone Case Can I compost the Bio Phone Case at home? Like avocado pits, eggshells and other tough materials, this case will decompose better through industrial composting or your municipal organic waste collection. How long does it take to break down? In the right conditions, it should be almost entirely gone in about 6 months or so. What is bio-based polymer? Basically, a polymer is a moldable material made from large chains of smaller molecules. In these cases, the polymer sources include renewable plant-based materials. Does this mean it’s biodegradable? Sure does! Fun fact: all compostable materials are biodegradable, but not vice versa. Our Leathers All of our leathers come from gold-rated Leather Working Group tanneries, which helps ensure its production meets strict environmental guidelines. To read more about considerations in this space, including animal welfare concerns, please read our page on Responsible Business. If you’re interested in the different types of leather we use, how it ages and how to care for it, check out Our Leather page. Leather Working Group (LWG) Summary The Leather Working Group (LWG) is a not-for-profit organization dedicated to improving practices within the leather industry. Established in 2005, LWG brings together a diverse range of member stakeholders, including leather manufacturers, brands, retailers, and suppliers, to collaboratively enhance the environmental performance of the leather supply chain. Bellroy is proud to be a member of the LWG. Environmental auditing protocols: LWG develops and maintains rigorous auditing protocols to assess the environmental management of leather manufacturing facilities, also known as tanneries. These audits are conducted every 24 months and cover various aspects, including: - Water & Energy Usage - Solid Waste & Effluent Management - Air & Noise Emissions - Traceability - Health & Safety - Chemical Management - Restricted Substances, Compliance & Chromium VI (CrVI) Management Tanneries are awarded a score in each category, and an overall rating of gold, silver, bronze, approved or audited. Gold is the highest rating, and is only awarded to a tannery that achieves a high standard in each category. Bellroy only uses leather sourced from gold-rated tanneries. Certification and transparency: Tanneries that meet LWG's stringent standards receive certification, providing transparency and assurance to consumers and businesses regarding the environmental impact of their leather products. Best Practice Guidelines: LWG offers comprehensive guidelines and resources to help tanneries and leather producers adopt best practices, aiming to reduce their environmental footprint and improve overall operational efficiency. Industry Collaboration and Education and Advocacy: LWG fosters collaboration and knowledge-sharing across the leather industry and advocates for responsible leather production, sourcing, transparency and ethical practices."
year_published = 2025
