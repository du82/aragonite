["https://bellroy.com/journal/a-letter-from-our-co-founders"]
title = "A letter from our co-founders"
description = "Bellroy puts its heart, soul and countless design hours into helping the world carry with simplicity and ease. Every piece has been deeply considered, for the best of life's little moments."
full_description = "In 2009, we thought Bellroy would be a bag brand. I had spent my youth seeking adventures around the globe, but like many co-travelers, was constantly frustrated by the bags I carried. With products designed for simple concepts of travel, I was met with friction, failure and the feeling that my stuff was holding me back. So, I started talking to some friends and family about the sort of brand that would get us excited. One that could solve some of the problems we were experiencing over and over. The first ideas applied our insights to bag designs (and a couple of wallets). We built a deck, sent it to some friends and said…“We’re about to sink a lot of our savings into this idea. If you don’t think it’s awesome, you need to tell us.” As a testament to those friends, they did (tell us). To paraphrase, they said “Yeah, good. But not good enough to cut through the noise in the bags market. What else do you have?” Dang. That was hard to hear. But it helped us realize that, while the bags space was noisy, wallets was a desert. We knew that with enough time and thought, we could re-engineer how wallets were built. And save a few stressed pockets in the process! When I was a dirt-poor student studying product design at the Glasgow School of Art in Scotland a decade prior, my old wallet had disintegrated and I couldn’t find a wallet that was built in a way that made sense to me. They were bulky and inefficient, bulging in your pocket like a brick. So I sewed myself some prototypes out of scrap material from a sailmaker. I went back to basics with them, eliminating the bulk at every step. They were raw, but for a decade they lived in my pocket (and then some friends’ pockets), and they worked well enough that I barely gave them a second thought. So, for our first Bellroy range, we looked back at those old sailcloth prototypes. We discarded existing paradigms, and tried to think about wallets from first principles. You might have experienced this, when starting a new project, it feels good to throw away every convention and build the idea from the ground up, trying to make sense of it for the world as it is now, not as it was when previous solutions were conceived."
