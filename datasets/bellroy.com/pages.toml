ary shipping, which is kinder to the environment. Even better, choose as carefully as you can before hitting that confirmation button of joy. Hurrah. 5. Product warranties Our products are all covered by warranty. The duration of that warranty depends on the category of product. Wallets, phone cases, pouches and accessories: 3-year warranty All bags: 6-year warranty If you’re not sure under which category a product falls, you will find the applicable warranty specified on every product page. 6. Copyright The contents of our website, and the site as a whole, are intended solely for personal, noncommercial (other than for the purchase of merchandise from our Site) use by its users. You may download or copy the contents and other downloadable materials displayed on bellroy.com for your personal use only. No right, title or interest in any downloaded materials is transferred to you as a result of any such downloading or copying. You may not reproduce (except as noted above), publish, transmit, distribute, display, modify, create derivative works of, sell or participate in any sale of, or exploit in any way, in whole or in part, any of the contents of this site. 7. Security When purchasing from Bellroy your financial details are passed through a secure server using the latest 256-bit SSL (secure sockets layer) encryption technology. 256-bit SSL encryption is the current industry standard. If you have any questions regarding our security policy, please email our support team. 8. Bellroy Promotions – General Terms and Conditions Bellroy may offer promotions from time to time in its sole discretion. The terms and conditions of each promotion will be clearly set out in the relevant offer. Bellroy reserves all rights to vary, end or withdraw a promotion at any time, subject to applicable consumer laws. Where a promotion is time limited, the time requirements will be strictly applied; no rainchecks or exceptions. Where a promotion is only offered to certain eligible customers, Bellroy reserves the right not to honour the promotion if, acting reasonably, determining that a purchaser is accessing a promotion via a third party (whether or not that third party received the promotion directly from Bellroy). Unless otherwise provided by the terms of the specific promotion, the promotion will apply to all products that are in stock on bellroy.com at the time of purchase. Promotion details may vary as between currencies and/or countries of purchase. You will be given the promotion relevant to the currency and country in which you are located. Only one promotion or discount (which includes sets) can be used at a time. Promotions are void where prohibited by law. All products purchased during a promotion are sold subject to Bellroy’s standard warranty. Our usual refund, exchange and shipping provisions will apply. If you return a product purchased with a promotional discount, we will apply the credit across all products purchased to determine the discounted amount to be refunded. 9. Bellroy Social Media Promotions Competitions on instagram.com/bellroy are run by Bellroy Trading Pty Ltd and are open to anyone, worldwide - unless it is prohibited by your local laws, or you are a bot and have automatically generated your entry, or you or a close relative work for Bellroy, in which case we’re really sorry, you can’t enter. If you are under 18, make sure you have your parents’/guardians’ permission - if you win, we will check! There is no entry fee and no purchase is necessary to enter: entry requirements are set out in the relevant post. Vouchers and any products you buy cannot be exchanged or returned for cash. Vouchers will be in AUD or USD and can be converted to your local currency - we are not responsible for the exchange rate, or any charges or taxes you may incur. The winner will be the person who we judge has made the best entry - “best” as decided by us. The judges will be our Editor and Storyteller and Creative Producer. Our decision is final and binding in all matters. By entering, you are agreeing to these terms and conditions and give us the right to publish your first name, location (city and country only) and your winning entry on Instagram. This competition is governed by the laws of Victoria, Australia. Bellroy is not responsible or liable for any technical or system faults which affect your ability to enter this competition, or for any loss of or damage to the prize."
