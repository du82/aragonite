full_description = "How do I activate a gift card? Just click the link (or manually enter the URL) on the gift card, and the full amount will be credited to your cart. Can it be redeemed in a different currency? Gift cards can only be redeemed in the currency in which they were purchased. Can payment be split if a product costs more than the full amount of the gift card? Yes, any remaining balance beyond the amount of the gift card can be paid using our regular payment options. Can I use two gift cards to cover the cost of one purchase? We can’t currently process this at checkout (we’re working on it!), but if you’d like to redeem more than one gift card at once, you can contact our friendly Customer Support team. Otherwise, the remaining balance of a purchase can be paid using one of our standard payment options. My gift card is expired, can I still redeem the value of it? Unfortunately, once it’s expired your card has no remaining value. For any other questions related to gift cards, just reach out to our friendly support team, and they’ll be happy to answer them."
