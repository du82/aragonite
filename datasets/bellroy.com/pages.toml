description = "This all-natural, material from Natural Fiber Welding is fit for purpose, good for the planet, and ready for your pocket."
full_description = "We took our product expertise, mixed it with Natural Fiber Welding’s chemistry, and made something from nature’s ingredients. Fit for purpose, good for the planet. And ready for your pocket. Our custom formulation is made from natural rubber, soybeans and biomass charcoal (from pine). It’s bound with minerals and backed with organic cotton. After many experiments, we found this recipe that gave us the best fit for our designs. As we look towards a regenerative future, we’ve wondered, can we get a plant-based leather to perform better than a grown one? Can we find one more fit for purpose, that will do its job well in our customer’s hand, and edge us closer to a vibrant future? I hope you’ll enjoy the ride as we further explore the potential of this radical new technology. to find the right formula that performs strongly and lasts well. (Because a wallet bends open and closed thousands of times in its life!) that started with a brand tab, then a full bag panel, and now a wallet – we’ve been testing the performance in a slow and steady way. We’re passionate about the quality of our materials, from recycled woven fabrics to premium leathers from gold-rated Leather Working Group tanneries. Look no further! While gift card payment is no longer available at checkout, you can still use yours to pay. Hit the link below, and someone from our friendly support team will help you get what you’re after. (Just think of them as your personal shopper.) You are signing up to receive product updates and newsletters. By signing up, you are consenting to our privacy policy but you can opt out at any time. You are signing up to receive product updates and newsletters. By signing up, you are consenting to our privacy policy but you can opt out at any time."
