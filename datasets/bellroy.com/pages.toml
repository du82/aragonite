["https://bellroy.com/ambassadors/patty-mills"]
title = "Ambassador Patty Mills | Bellroy"
description = "Bellroy puts its heart, soul and countless design hours into helping the world carry with simplicity and ease. Every piece has been deeply considered, for the best of life's little moments."
full_description = "The NBA basketballer and Australian Olympic medallist lives in Brooklyn, and can be found on court most days of the year. At Bellroy, we are inspired by Patty’s work ethic, resilience and ability to stay grounded while on the move. Not to mention some serious carry prowess he’s gained from living out of his bags for much of the year! Perhaps most importantly, we admire Patty’s commitment to honoring his Indigenous heritage, and giving back to the places and people who raised him. We connected with Patty on our Australian heritage, global perspectives, and shared desire to use our success for good. We also see our culture reflected in the way Patty balances grit, discipline, humor and humble leadership. Making the most of the pandemic’s enforced downtime, Patty set up Indigenous Basketball Australia, “to overcome barriers Aboriginal and Torres Strait Islander people face in Australian basketball and create pathways at the grassroots level”; and the Team Mills Foundation to support communities around the world. We hope to support Patty’s philanthropic efforts into the future. Patty gifted his Olympic teammates a Bellroy Sling filled with goodies to help make their journey to Tokyo a little more seamless. And has since been seen with the Lite Sling attached to his chest on more than one occasion. Look no further! While gift card payment is no longer available at checkout, you can still use yours to pay. Hit the link below, and someone from our friendly support team will help you get what you’re after. (Just think of them as your personal shopper.) You are signing up to receive product updates and newsletters. By signing up, you are consenting to our privacy policy but you can opt out at any time. You are signing up to receive product updates and newsletters. By signing up, you are consenting to our privacy policy but you can opt out at any time."
