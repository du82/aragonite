["https://bellroy.com/journal/a-life-of-adventure"]
title = "Matt Cherubino: A Life Of Adventure | Bellroy"
description = "Scan photographer Matt Cherubino’s Instagram once and you’ll get a sense of his big achievements. His life is one of journeying enormous distances to vacuum-pack split seconds in time: from craggy New Zealand mountain precipices to sprawling Thai river deltas, Norwegian troll country to Tongan sea-cave Atlantes."
full_description = "Scan photographer Matt Cherubino’s Instagram once and you’ll get a sense of his big achievements. His life is one of journeying enormous distances to vacuum-pack split seconds in time: from craggy New Zealand mountain precipices to sprawling Thai river deltas, Norwegian troll country to Tongan sea-cave Atlantes. His photographs speak of nature’s powerful forces sculpting the planet’s most breathtaking environments. But take a closer look, to see the way the sun flashes off the ocean surface or a large school of fish gets dwarfed by the might of humpback mother and calf. Impactful as they are, these images also present our biosphere at its most delicate, insubstantial, vulnerable, wonderful. Did we mention he’s only 20? Yep. Twenty. And as Matt’s visual language evolves, so too does his ability to respond to life’s twists and turns, and the ever-changing demands of his surrounds. It was a tiny detail – a non-decision – that led Matt down this enviable career path. After finishing high school in 2014, he took a two-week trip to New Zealand’s remote Milford Sound – a place where towering mountain peaks rise vertically out of abyssal fjords; you thread a line through the Darren Mountain Range’s Homer Tunnel just to get there; and the average annual rainfall is around 6.5 meters. Let’s just say, Wi-Fi is patchy at best. So, it was in the middle of this Wi-Fi black spot that Matt missed his university acceptance deadline. “It wasn’t until this point that I considered declining university all together,” he says. “Looking forward and not knowing what lay ahead reflected the winding Milford road that our dented rental car was hurtling down. A lot of hard work has gone in since that point, and not all has gone as scripted, but that’s the fun of it all. I haven’t looked back.” “For most of us, travel offers a break from the everyday; a chance to reset, recharge and reconnect with the wider world. But what about when travel is the routine?”"
