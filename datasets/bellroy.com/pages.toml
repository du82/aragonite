["https://bellroy.com/journal"]
title = "The Journal – Insights On Design and Life On The Move | Bellroy"
description = "Join us as we hunt for insights and stories about design, inspiration, responsible business and finding new ways to carry for life on the move."
full_description = "The lack of traceability in the leather industry was a problem. So we stepped up to help create a solution: the Leather Working Group’s Animal Welfare Group. Discover the value – and joy – in the kind of adventure that’s outside your door. And hear from those who have discovered it already. It took two years, new tools and who-knows-how-many meetings with our makers to get here. Introducing: the most challenging wallet we’ve ever made. From couch surfing in Mexico, to cricket in the backyard, Melbourne artist Tom Gerrard gives us the stories of his drawings. Is leather evil? Is plastic bad? We recently hosted a panel of material innovators, to discuss how the path to greater sustainability is paved with compromise and creativity. Our design thinking goes way beyond the product you hold in your hands. Here, our design team explains how. We spoke to an Olympian, an Everest climber and a creative business owner, to find out what it's like to live on the edge. We asked you to nominate your everyday heroes, so we could celebrate them. Read our favorites, and keep the tissues close! Bellroy co-founder, Andy Fallshaw, shares four key milestones that helped him design the bag he has always wanted. We asked some friends to share their favorite Bellroy moments, and got some great stories, from the heartwarming to the hilarious. We've come a long way since we first sat around a kitchen table in Bells Beach with an idea. And here are some highlights from the journey so far. Bellroy in 2020 is a remarkably different business to when we sold our first wallet in 2010. Our co-founders, Andy and Lina, share their thoughts on the journey that's been - and the best that's yet to come. Bellroy's bags and pouches are making the transition to recycled fabrics, and we couldn't be happier about it. We've got the answers to all your questions about our recycled fabrics, in one place. Straight-talking sustainable fashion expert, Teslin Doud, puts Bellroy co-founder, Andy Fallshaw, on the spot."
