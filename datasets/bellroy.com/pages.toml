["https://bellroy.com/customer-care/design-manufacturing"]
title = "Design & Manufacturing | Bellroy"
description = "Bellroy puts its heart, soul and countless design hours into helping the world carry with simplicity and ease. Every piece has been deeply considered, for the best of life's little moments."
full_description = "Where are Bellroy products designed? The design process mostly happens in our Bells Beach office in Australia, where we have a gifted team of people from all over the world. The Bells office is equipped with a design lab that lets us prototype new styles using 3D printing, laser cutting and other fun design toys. Occasionally our team works with external designers in places like the USA to collaborate on special projects. This helps keep things fresh, with new ideas and techniques flowing through our HQ on a regular basis. Where are Bellroy products made? We’re committed to working with the most talented people we can find around the world, no matter where they’re from. Currently, makers in China, India and The Philippines offer the best balance of quality workmanship and value we’ve been able to source, so this is where all of our products come to life. We recognize there can be concerns when manufacturing in these regions, so all of our major suppliers must comply with a Supplier Code of Conduct. We also work closely with each supplier to ensure staff are treated well and that environmental and social responsibilities are taken seriously. You can find some of our broader thoughts on Responsible Business here. How will my purchase be packaged? We have custom-made cardboard envelopes for every product which you can see in the final image on each product page. How many cards do the products fit? For each Bellroy style, we let you know the number of cards it can hold on the product page. This is always a range and is included in the features list located just under ‘Add to Cart’. You can see we recommend 4–11 cards for our Note Sleeve, for example."
