["https://bellroy.com/journal/animal-welfare-group"]
title = "Advocating for Animal Welfare | The Journal | Bellroy"
description = "The lack of traceability in the leather industry was a problem. So we stepped up to help create a solution: the Leather Working Group’s Animal Welfare Group."
full_description = "We’re working towards a future in which people, animals and the planet sustain each other. And that means making decisions with the greatest consideration for all of those stakeholders. As a brand that uses leather, we very quickly realized work was needed to better the industry for the animals that are part of it. Bellroy started as a wallet company. Leather wallets, to be exact. So it was only natural that we became passionate about leather itself. Making the highest possible quality wallets that could stand the test of time (and look great doing so) meant sourcing the highest quality leather we could find. In 2015, we began sourcing leather exclusively from tanneries that had earned the highest rating from the Leather Working Group (LWG). Which means that, compared to standard tanneries, these tanneries consume about 75% less water, use less power and produce significantly less waste and effluent. They also abide by strict labor and working conditions regulations. Better tanneries, better leather. The LWG’s auditing was comprehensive when it came to environmental impact from hide to finished leather. But it didn’t take into account what comes before the tannery. It was nearly impossible to trace the origin of the hides arriving at our supplier tanneries. The plain truth is that, as a by-product of the beef industry, leather comes from cattle. And the lack of traceability from the tannery back to the farm meant we had little visibility on the welfare of those animals. Not great. Bothered by this, our team, along with other concerned LWG members, began advocating for more traceability in the industry. Bellroy was in a unique position to lead - as a small company, the amount of leather we used meant we could be nimble and selective with our choice of suppliers. “The reality is, we (as a society) have long prioritized humanity over the planet and animals. And we have made great progress bringing humans out of extreme poverty, improving child mortality, improving life metrics... but often it’s been at the expense of animals or the planet. At Bellroy, we believe that when we make decisions for people, animals or the environment without balancing the benefits and consequences of all three, those sacrifices compromise the vibrancy of our future. So now we have to broaden the lens and say, how can we work towards a system where those three stakeholders can nurture each other? So, for leather, the value of leather for us is that it’s still one of the best materials for our products in terms of longevity, use and lack of petrochemical input. Acknowledging that, we want to work hard to improve the animal welfare standards within the entire supply chain and minimize the sacrifice as much as possible.” – Andy Fallshaw, Bellroy s co-founder and CEO"
year_published = 2025
clearnet = "https://bellroy.com/journal/animal-welfare-group"
