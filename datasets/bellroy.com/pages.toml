["https://bellroy.com/customer-care/cleaning-and-care"]
title = "Product Cleaning and Care | Bellroy"
description = "Bellroy puts its heart, soul and countless design hours into helping the world carry with simplicity and ease. Every piece has been deeply considered, for the best of life's little moments."
full_description = "We want to help you make sure you can use and love your Bellroy products for as long as possible. Sometimes this involves a little bit of maintenance. Cleaning fabric products Spot stain removal Spills, drips and drops in the dirt – we’ve all been there. Whether it’s the inside or outside of your bag or pouch that needs a spot clean, here’s how to go about it. 1. For mild marks, simply wipe the area with a damp cloth. 2. For stains that are a little more stubborn, use a laundry or dish detergent that targets grease. Be sure to avoid powder detergents, fabric softeners or bleach. Enzymatic laundry liquid (or dishwashing liquid) is great for oil stains, because the enzymes eat the biological matter. They’re also great for any protein-based stains (i.e. blood, dairy, sweat). 3. Don’t pour any soap or detergent directly onto your Bellroy product – be sure to dissolve and dilute the detergent in water before applying to the bag. 4. Gently work the diluted detergent into the stained area with a damp cloth or sponge. Avoid excessive rubbing as this may damage the or its water-repellent coating and penetrate the stain further into the fabric. 5. Wipe down with a clean, damp cloth or sponge to remove the detergent. It is important to try to avoid leaving any detergent residue on the material as this can affect the water-repellent coating’s performance over time. To ensure no detergent remains you might want to repeat the wipe-down process a couple of times for good measure. 6. Leave to dry in a shady spot, avoiding direct UV from the sun. Cleaning the whole thing If by chance you find yourself in a situation where you need to clean the entire product, that’s OK – we’ve got you. 1. We strongly recommend against putting your Bellroy product in the washing machine. 2. Likewise, do not submerge or soak your Bellroy product in water. 3. Before wetting the product, brush off any excess dirt or spillage with a soft-bristle brush, or your hands. 4. Use a laundry or dish detergent that targets grease (be sure to avoid powder detergents, fabric softeners or bleach). As mentioned above, enzymatic detergents work well. 5. Dissolve and dilute the detergent in water and gently work the diluted detergent across the surface area of the product with a damp cloth/sponge. 6. For more badly stained areas follow the above guide for spot stain removal. 7. Wipe down with a clean damp cloth/sponge to remove the detergent. It’s important to try to avoid leaving any detergent residue on the material as this can affect the water-repellency performance over time. To ensure no detergent remains on the material you might want to repeat the wipe-down process a couple of times for good measure. Try to avoid getting any excess water inside the product. If this does happen, ensure you dry the product completely before use. 8. Leave to dry in a shady spot, avoiding direct UV from the sun. Watch the video .productCleaning__video{position:relative;margin-top:33px;padding-bottom:56.21%;overflow:hidden;margin-bottom:10px}"
year_published = 2025
clearnet = "https://bellroy.com/customer-care/cleaning-and-care"
