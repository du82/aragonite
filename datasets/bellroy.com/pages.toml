["https://bellroy.com/ambassadors/tim-harris"]
title = "Ambassador Tim Harris | Bellroy"
description = "Bellroy puts its heart, soul and countless design hours into helping the world carry with simplicity and ease. Every piece has been deeply considered, for the best of life's little moments."
full_description = "Tim Harris loves to tell stories. The Melbourne-based action and travel photographer never lets an image – or conversation – sit on the surface. Instead, he digs in. To find meaning and spark. His previous career as a youth worker probably gave him a head start there. We love Tim for his ability to capture vivid moments (sometimes from the back of a motorcycle), and to connect the pieces – and people – in every story. “I started off as a youth worker in the outer suburbs of Melbourne, which I really loved. But when I moved, I realised that really wasn’t my community anymore. So I needed to find something that would let me meet new people and see new things, and that’s what photography opened up for me. The amount of people I have met just because I own a camera is ridiculous.” As a kid, Tim was told that creativity was reserved for hobbies. And yet, that didn’t stop him from studying art at school, film at uni, and making photography his full-time job. This shows us that Tim is our kind of boundary-pusher. Someone who committed to honing a craft because of the opportunities it would bring to do good things. “I think the reason I shoot motorcycles and cars and cycling isn’t so much because I love those things, it’s because I get a front row seat to these subcultures, to someone else’s community. I’m excited to showcase a little of what’s happening with these subcultures – let everyone see the back deserts of Australia (and the dust)!” “I try to be as organized as possible – especially out on shoots. My style is very ‘in the moment’ and you have to be ready. Having my Venture Sling (Camera Edition) and Tech Kit has helped me know where all my gear is, and get to it quickly. I used to use hard cases, but you can’t run up the hill with an open hard case full of lenses! Now I can just go for it.” We spoke to an Olympian, an Everest climber and a creative business owner, to find out what it's like to live on the edge. Look no further! While gift card payment is no longer available at checkout, you can still use yours to pay. Hit the link below, and someone from our friendly support team will help you get what you’re after. (Just think of them as your personal shopper.)"
