["https://bellroy.com/collaborations"]
title = "Collaborations: Google, Barneys NY, Field Notes, MAAP | Bellroy"
description = "Bellroy puts its heart, soul and countless design hours into helping the world carry with simplicity and ease. Every piece has been deeply considered, for the best of life's little moments."
full_description = "We’re proud to have worked with some talented brands on collaborations that unite the best we both can do, and bring a new kind of delight to our customers. We’ve spent years working with Natural Fiber Welding on a custom, fit-for-purpose version of their 100% natural, plant-based leather alternative. The experts at Carryology chose four of our classic designs for their best-in-class Essentials program, then gave them signature Carryology upgrades. We collaborated with the Google team to design accessories that enhance the experience of Pixel and Pixelbook products. Graphic artist, global citizen and Bellroy ambassador Karan reimagined our Tech Kit with vibrant custom artwork inspired by the everyday. Like the mythological Chimera, this sling is a union of parts more powerful as one – the best of Bellroy's design learnings and most-loved signatures, with Carryology's exacting standards. A limited-run Backpack and Slim Sleeve collab that unites the best of Bellroy’s design learnings, with Carryology’s exacting performance standards. This limited-run collaboration gives four of our classic styles unique badges created by local artist Tom Gerrard, celebrating Melbourne’s creativity. Bellroy and Staple come together to honor our collective, global frontline. This is a collaboration tote, the net proceeds of which goes to Australian Red Cross and NYU Langone Health. This collaboration represents our shared commitment to innovation, adventure, and design detail – and includes five Bellroy products styled exclusively for Qantas. Bellroy and MAAP teamed up for cyclists who are as serious about the design and performance of their gear as they are the ride itself. The Bellroy XO Barneys New York Collection features five Bellroy wallets, re-imagined in vibrant colors, premium materials and the finest attention to detail. This Bellroy x Field Notes collaboration offers a cleverly-crafted kit for collecting thoughts, capturing ideas, or jotting down notes. We like to redefine the classics. So we partnered with Clae, a brand who shares this philosophy, to release a set of modern essentials."
