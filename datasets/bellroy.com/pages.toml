["https://bellroy.com/careers/head-of-data-analytics"]
title = "Head of Data Analytics | Bellroy"
description = """
Our Spaces    Bellroy' is a fusion of our two homes – Bells Beach and Fitzroy. Bells Beach brings a relaxed, outdoor vibe to balance Fitzroy's creative, urban style. The city and the sea; inspiration and adventure. Together they provide a perfect balance.        Bells Beach    Our beach HQ sits behind giant sandstone cliffs that overlook one of Australia’s best-known surfing coastlines. It’s where our Product Designers experiment in the Maker Lab, and our Sales team consume awesome amounts of espresso and Skype bandwidth. Things are more tranquil here than our Fitzroy neighbours and we like the focus that can create. There’s a cafe right next door if you need a quick bite and our 11am surf check always provides the perfect chance to reset the mind with some salt air.        Fitzroy    Our Fitzroy space is immersed in the middle of Melbourne’s creative hub. It’s where our Creative, Marketing, Engineering and Operations teams develop campaigns and ensure each Bellroy is sent safely across the world. Walk out the door and you’ll find streets bursting with energy (and the best ramen joint this side of Tokyo).        Remotely    Outside of our two main headquarters we have a team that works remotely - from Western Australia to parts of Asia, the USA and Europe. Being global is at the heart of Bellroy, it keeps us connected, and makes sure we see life from many different perspectives. If you have an internet connection and the flexibility to become part of a team you don’t see everyday, you might consider joining our growing global network."""
full_description = "To think really well our brains needs rest and focus. In balancing our time, energy and attention, we rejuvenate with power naps, mindfulness or even a quick planking challenge. Work and play matters. It keeps us balanced. So we’re always mixing it up. If there’s family commitments, hours are flexible. If the surf’s pumping, we grab our boards. And while at the office, we have monthly learning events to keep minds melding. We want the world to be a better place because of Bellroy. Our giving program matches donations our team contributes to charities like The Centre for Effective Altruism, or those recommended by GiveWell. On top of that, we also donate a portion of revenue to effective charities. Our search for radical effectiveness constantly leads to better ways to get things done. To help fuel that growth, we offer tools like Blinkist subscriptions, a digital learning library, workshops and more. Ask our Flourishing Team where to start, and see how deep the wormhole goes."
year_published = 2025
