["https://bellroy.com/collection/patty-mills"]
title = "Bellroy × Patty Mills | Bellroy"
description = "Discover the limited edition collection, designed in collaboration with NBA basketballer, Olympic medallist and Indigenous Australia Patty Mills."
full_description = '''Bellroy is thrilled to collaborate with Patty Mills – NBA basketballer, Olympic medallist and proud Indigenous Australian. To celebrate the Indigenous cultures of Australia through products he travels with over land, sky and seas. The opportunity to create a collection of products that allow you to travel more efficiently, is a fun way to share our stories. Being able to join the artworks together is one of the coolest stories that we're all gonna be able to tell for years to come. And you can imagine these pieces going around the world, and to many different people across cultures. "Our turtle and wamer bird love to travel wherever the current and winds may take them. The blue coloured waters represents us Torres Strait Islanders, people of the sea." "The ‘meeting places’ represent the connection First Nations people have to different families and communities. The boomerangs are family traditions, and represent the significance of movement through the sky." Look no further! While gift card payment is no longer available at checkout, you can still use yours to pay. Hit the link below, and someone from our friendly support team will help you get what you’re after. (Just think of them as your personal shopper.) You are signing up to receive product updates and newsletters. By signing up, you are consenting to our privacy policy but you can opt out at any time. You are signing up to receive product updates and newsletters. By signing up, you are consenting to our privacy policy but you can opt out at any time.'''
