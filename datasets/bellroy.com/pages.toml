["https://bellroy.com/ambassadors/fleur-studd"]
title = "Ambassador Fleur Studd | Bellroy"
description = "Bellroy puts its heart, soul and countless design hours into helping the world carry with simplicity and ease. Every piece has been deeply considered, for the best of life's little moments."
full_description = "Fleur Studd is a coffee-obsessed trailblazer who brought new narratives to the Melbourne coffee scene. She channels her passion for traceable, high-quality coffee sourced ethically, through her businesses Market Lane Coffee and Melbourne Coffee Merchants. We admire Fleur as a (fellow B Corp certified) business owner dedicated not just to elevating her industry locally, but also to nurturing its communities around the world. “Our vision is to deliver good coffee that’s good for everyone, which includes the producers we work with, our team, our customers, and our community.” “While we operate in different industries, Bellroy’s ethos (to help their people and the world flourish) aligns very closely with ours. From day dot, the ‘better ways’ mantra has inspired me to think about how to raise the bar – in product, communications, decision-making and business practices.” As a business owner (x2), mother (x2), global traveler and industry trailblazer, Fleur’s calendar (and cup) is fuller than most. Organization is key to getting the most out of every slightly sleep-deprived moment. The Bellroy Sling (“I never leave home without it”), Tech Kit and Phone Case have helped bring order to her everyday. While our Weekender help her travel – to Rwanda’s Great Rift Valley and beyond. From Guatemala to El Salvador, Brazil to Bolivia and beyond – Fleur’s packed travel schedule keeps her in touch with the producers and communities she’s come to know and love. So she can carry their stories (along with their beans) back to her discerning Market Lane clientele. “We work very closely with producers and some of the relationships have spanned a decade. It's really important to share the story of where our coffees come from and the people behind them.” The most influential woman in Melbourne's coffee scene is living proof that the little moments in life can transform our trajectory. Look no further! While gift card payment is no longer available at checkout, you can still use yours to pay. Hit the link below, and someone from our friendly support team will help you get what you’re after. (Just think of them as your personal shopper.)"
