["https://bellroy.com/customer-care/product-specifics"]
title = "Product Specifics | Bellroy"
description = "Bellroy puts its heart, soul and countless design hours into helping the world carry with simplicity and ease. Every piece has been deeply considered, for the best of life's little moments."
full_description = "Are all the wallets as slim as each other? No. Within our range, some are slimmer than others. Essentially, the more features you want (e.g. access to lots of cards with equal priority), the more storage space you'll need to accommodate that. Check out Slim Your Wallet and find out which wallet is best you. Are Bellroy wallets the slimmest? No. We do not have the slimmest wallets. If you want to wrap your cards in cling film, you can make a slimmer wallet. Instead, what we offer is a wallet that is as slim as we can get it without compromising on intelligent interactions, considered materials, and comfort in everyday use. Are Bellroy products RFID protected? We appreciate that theft using RFID skimming can happen in certain circumstances, so we’ve made our Note Sleeve, Hide & Seek and Travel Wallet RFID secure. The technology has been incorporated into these styles as this is where we believe the technology will be most useful, but please let us know if we should consider the technology for other Bellroy products by emailing us support@bellroy.com What is RFID Protection? RFID-blocking wallets are designed to help protect you from a specific type of theft, called RFID skimming – which is where information from high frequency (13.56MHz) RFID-based credit cards, passports and transport passes are read and duplicated. RFID skimming is not common, but it can happen in certain cases. For a more detailed article on RFID we recommend this balanced explanation by our friends at Carryology."
year_published = 2025
