description = "Bellroy puts its heart, soul and countless design hours into helping the world carry with simplicity and ease. Every piece has been deeply considered, for the best of life's little moments."
full_description = "Lydia Bradey’s the type of person who believes if something’s worth doing, it’s worth doing six times. We know, because that’s how many times she’s climbed Everest – so far. The first woman to summit the world’s highest peak without oxygen, Lydia has built a life cutting new paths as a global mountain guide. For this reason, she’s inherently hard to get hold of. (And that’s how she likes it.) But whenever we get a chance to connect, we take inspiration from her quiet determination and deep respect for people and nature. “Living simply, but living well, is really important to me. In the mountains, you have to – because in everything there is a consequence.” Lydia is the kind of boundary pusher who inspires us to strive for excellence. After all, when she’s adventuring in some of the world’s most hostile environments, she relies on her things to function as intended... or bear the consequences. But it’s in her everyday mantra of “living simply, but living well” that we discovered a great kinship. We appreciate her ability to balance extreme heights, and simple joys. Having climbed Aoraki/Mt Cook – Aotearoa/New Zealand’s highest mountain – at 18 years old, Lydia was destined for bigger things. Today, with more than 40 years treading unmarked trails, she’s carved out a niche as a global mountain guide. Steering people to bucket-list views on paths less trodden, so they can enjoy dawn lighting the world before everyone else arrives. When Lydia is packing for a new adventure, we love that Bellroy gear goes with her. And it’s no surprise the Lite range is her go-to. Her favorite piece of kit? “The Lite Duffel is a fantastic piece of design,” she says. “It zippers superbly, it carries really well, it looks good.” She’s even taken to signing off emails with “off to pack the duffel!” – as a clue to us that she’s soon to depart again. We spoke to an Olympian, an Everest climber and a creative business owner, to find out what it's like to live on the edge."
year_published = 2025
