["https://bem.info/methodology/html"]
title = "HTML / Methodology / BEM"
full_description = "When using BEM, you can create HTML markup manually or generate it automatically. In both cases, the HTML code follows the same principles: To specify that a block, an element or a modifier is located on a DOM node, its name is written in the class attribute. To combine the styles and behavior of several BEM entities, place them on the same DOM node. To do this, add the names of the BEM entities separated with spaces in the class attribute. This approach is called a mix. For instance, you can use a mix to add a modifier to a block or an element. In this example, a mix is used to add new styles to the menu block by applying the menu_theme_bright modifier to this block. For JavaScript tasks, such as simultaneous initialization of a block instance in different parts of the page, place one BEM entity on multiple DOM nodes. The naming convention doesn't allow including the hierarchy in the element name (block__elem1__elem2). But you can nest HTML elements in each other. The nesting depth isn't limited. In this example, the menu items are shown as links. This block structure is implemented with nested elements: The BEM methodology does not recommend using HTML wrappers to position one block relative to another block or position blocks within another block. For these purposes, always use mixes. In the example, the header and footer blocks are positioned on the page using a mix with the page block elements that set the styles. The page__header and page__footer elements are optional. They are applied to the page block to add the header (header) or the footer (footer) to the page. The page, header and footer blocks remain independent because they don't contain styles that deal with mutual positioning. To position HTML elements inside a block, use an additional block element (for example, button__inner). The button__inner element contains styles that deal with positioning inside the button block. It replaces an abstract wrapper. In the example, the icon (the icon block) is positioned inside the universal button using the button_inner element styles."
