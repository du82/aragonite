["https://bem.info/methodology/filestructure"]
title = "File structure / Methodology / BEM"
description = "File structure"
full_description = "All BEM projects follow a similar structure in their file structure. When files are always in a familiar location, this makes it easier for developers to navigate a project and switch between projects. A project always has at least one redefinition level. There is no limit on the maximum number of levels. There is a separate file for each implementation technology. The names of implementation files match the block names. For example, if the appearance of the input block is defined using CSS, the code is stored in the input.css file. The code of modifiers and elements is also stored in separate files of the block. This approach allows you to include just the modifiers and elements that are needed for this implementation of the block. Each block has a directory with the name of the block that contains the files for implementing the block. In some approaches to file structure organization, block directories are not used. In this case, the block files are grouped using a namespace that is set as the block name. To improve navigation across the project, block modifiers with multiple values can also be combined in separate directories. The most flexible approach is a combination of flat and nested. Blocks with a branched file structure used the nested approach. Simple blocks use the flat approach."
year_published = 2025
