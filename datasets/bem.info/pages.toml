["https://bem.info/toolbox/enb/build-project"]
title = "How to build a project / ENB / Toolbox / BEM"
description = "How to build a project"
full_description = "ENB determines which targets are built (the enb make [target] command). If enb make is run without a specified target, ENB builds all targets defined in make.js. ENB initializes the nodes involved in the build for the specified targets. Each node requests the list of targets from technologies registered inside the node. During execution, a technology can request other targets needed for the build from the node (the requireSources method). In this case, the current technology is suspended until the needed targets are built. This is how the node is declared on the make platform. At this point, the node isn't configured – it's just declared. The targets are declared. But running node_modules/bin/enb make will return an error because the technologies that can provide the targets aren't registered. enb/techs/levels — Collects information about the project's redefinition levels. The result of this technology is used by the enb/techs/deps, enb/techs/deps-old and enb/techs/files technologies. For each node, a default <path_to_node>/blocks level is added. For example, for the pages/index node, the default level is pages/index/blocks. enb/techs/file-provider — Informs the make platform that the target passed in the target option is ready. In our case, the source file for the build is index.bemdecl.js. It is located in the repository and doesn't require separate building. enb/techs/deps-old — Builds ?.deps.js (index.deps.js) from index.bemdecl.js and index.levels. Why deps-old? Lego lacks a number of dependencies, so your project may fail to build with the faster deps technology if you don't modify lego. The deps-old technology uses the build algorithm from bem-tools, and the lack of dependencies isn't an issue. enb/techs/files — Collects the full list of files from all redefinition levels in the order they are included in the final index.deps.js. The result of this technology can be used, for example, in the enb/techs/js technology. Now you can build the index.js and index.css files using the enb/techs/js and enb/techs/css technologies. But at step 7, we registered other targets: _?.js (_index.js) and _?.css (_index.css). To build them, use the enb/techs/file-copy technology."
