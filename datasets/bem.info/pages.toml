["https://bem.info/technologies/classic/deps"]
title = "Dependencies / Classical BEM stack / Technology / BEM"
description = "Dependencies"
full_description = "In the BEM methodology, dependencies on other blocks, elements, modifiers, and technologies can be declared using deps.js files. Code is divided into separate parts. The logic of each block and its optional elements and modifiers is defined in separate files. Files are grouped in directories – deps.js files for each component are stored according to the file system rules for BEM projects. Dependencies are defined for all BEM entities that are distributed across the project's file system and aren't included in the declaration. As an example, let's look at a search form that is created from the input block and the button block. To include styles and scripts from the input and button blocks, you will need to create the search-form.deps.js file. /* b1.js → b2.bemhtml */ — block b1 in the JavaScript implementation is dependent on block b2 in BEMHTML implementation. mustDeps (array/object) — Defines dependencies that must be included in the build result before the code of the BEM entity where these dependencies are declared. noDeps (array/object) — Cancels existing dependencies declared on other redefinition levels (for example, i-bem__dom_init_auto). The fields specify which BEM entity needs the dependencies included. They can be restored from the context by the file name. So the following statements for the file b1__e1_m1_v1.deps.js are equivalent: It specifies which implementation technology to include the dependency for. If the tech field or its value is omitted, the dependency is considered general and applies to all technologies. Including dependencies for a technology is used, for example, to create a client JavaScript bundle that only has templates for the blocks that will be used in the browser. In this case, part of the templating happens on the server side, so some of the templates are never used in the client. The mustDeps and shouldDeps fields define dependencies, and the noDeps field cancels existing dependencies that are declared on other redefinition levels."
year_published = 2025
