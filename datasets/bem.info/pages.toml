["https://bem.info/technologies/classic/bemjson"]
title = "Data (BEMJSON) / Classical BEM stack / Technology / BEM"
description = "Data (BEMJSON)"
full_description = "Any JavaScript object can be considered BEMJSON. However, to control the templating result, we need the standard modes expected by bem-xjst. {Object} block modifier hash. Keys can be any valid keys for JavaScript objects. Values can be String or Boolean types. An object with html field is a special type of BEMJSON nodes. All other fields of such objects will be ignored. html field should have a string which will be rendered as is. {Boolean|Object} JavaScript parameters. If the value isn’t falsy, it mixes i-bem and adds the content to the JavaScript parameters. By default: undefined. {Boolean} tells the template engine whether to add classes and JavaScript parameters for the BEM entity and its mixes. By default: true. {String} HTML class or classes (separated by spaces) that do not belong to the BEM subject domain. For example, the use of microformats or semantic markup from schema.org. {Boolean|String} HTML tag. false or '' tells the BEMHTML engine to skip generating the HTML tag. By default: div. You can add any other data fields in order to later process them in the template body as you see fit."
year_published = 2025
