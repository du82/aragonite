["https://bem.info/methodology/solved-problems"]
title = "Solved problems / Methodology / BEM"
description = "Solved problems"
full_description = '''The BEM methodology defines CSS selector naming conventions that solve a range of web development problems and address the following issues: During project layout, interface components are given names based on the context the developer is working with. The context is usually a page or a part of one. When just one developer is working with the layout for a brief period, name collisions are easily avoided. But if multiple people are working on a project, or edits need to be made at some later point, it is difficult to keep track of component name dependencies. In large projects, modifying a single class may lead to dozens of affected pages. If we need to add another component containing menu items to the page, the styles for the new item will affect the items from the existing navigation menu. Or let's say we need to change the rules for the .active class in the navigation menu. We can't tell from the name which components use it. For example, there could be a <div class="button active">Click me!</div> button on another page. In that case, changing the rules for .active would affect the style of that button. In order to find out whether styles can be painlessly changed for the .active class, the developer will have to examine the structure of the entire page or project. Any change consumes a significant amount of time just searching for dependent components. The BEM methodology solves the collision issue using naming conventions for CSS classes, providing unique names for all components and their parts. But we'll apply BEM naming conventions to it. The nav class will designate the block name, nav__item and nav__link will designate the element names, and nav__item_active will indicate the name of a modifier for the item element. The new CSS class names contain all the information about the block structure. This means that we no longer need to look at the page HTML code to determine all the dependencies. The selector always contains knowledge of which blocks or elements are affected by its rules (in this case, the nav__item element). The developer doesn't need to think about the possibility of a <div class="button active">Click me!</div> button existing somewhere, because its CSS rules will be written as .button_active and won't depend on the rules for the active modifier for the menu item (nav__item_active).'''
year_published = 2025
clearnet = "https://bem.info/methodology/solved-problems"
