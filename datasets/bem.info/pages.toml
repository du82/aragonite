["https://bem.info/technologies/classic/deps-spec"]
title = "DEPS specification / Classical BEM stack / Technology / BEM"
description = "DEPS specification"
full_description = "/* b1.js → b2.bemhtml */ — block b1 in the JavaScript implementation is dependent on block b2 in the BEMHTML implementation The fields specify which BEM entity needs the dependencies included. They are optional and can be restored from the context by the file name. The tech field specifies which implementation technology to include the dependency for. If tech is omitted, the dependency is considered general and applies to all technologies. Including dependencies for a technology is used, for example, to create a client JavaScript bundle that only has templates for the blocks that will be used in the browser. In this case, part of the templating happens on the server side, so some of the templates are never used in the client. The mustDeps field specifies dependencies that are added to the build results before the code of the BEM entity where these dependencies are declared. In this example, dependencies on the common.blocks level include a BEM entity that is necessary for implementing the b1 block. On the desktop.blocks level, this dependency is canceled. The elems field sets the element name and expands into shouldDeps. So the statements for the file b1.deps.js are equivalent to: The mods field sets the modifier name and value and expands into shouldDeps. So the statements for the file b1.deps.js are equivalent to: b1.js → b2.bemhtml — block b1 in the JavaScript implementation is dependent on block b2 in the BEMHTML implementation"
