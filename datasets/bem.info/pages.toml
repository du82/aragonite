["https://bem.info/methodology/quick-start"]
title = "Quick start / Methodology / BEM"
description = "Quick start"
full_description = '''BEM (Block, Element, Modifier) is a component-based approach to web development. The idea behind it is to divide the user interface into independent blocks. This makes interface development easy and fast even with a complex UI, and it allows reuse of existing code without copying and pasting. A functionally independent page component that can be reused. In HTML, blocks are represented by the class attribute. The block name describes its purpose ("What is it?" — menu or button), not its state ("What does it look like?" — red or big). The block shouldn't influence its environment, meaning you shouldn't set the external geometry (margin) or positioning for the block. The element name describes its purpose ("What is this?" — item, text, etc.), not its state ("What type, or what does it look like?" — red, big, etc.). The structure of an element's full name is block-name__element-name. The element name is separated from the block name with a double underscore (__). An element is always part of a block, not another element. This means that element names can't define a hierarchy such as block__elem1__elem2. The block name defines the namespace, which guarantees that the elements are dependent on the block (block__elem). However, this block structure is always represented as a flat list of elements in the BEM methodology: This allows you to change a block's DOM structure without making changes in the code for each separate element: If a section of code might be reused and it doesn't depend on other page components being implemented. The exception is elements that must be divided into smaller parts – subelements – in order to simplify development. In the BEM methodology, you can't create elements of elements. In a case like this, instead of creating an element, you need to create a service block. The modifier name describes its appearance ("What size?" or "Which theme?" and so on — size_s or theme_islands), its state ("How is it different from the others?" — disabled, focused, etc.) and its behavior ("How does it behave?" or "How does it respond to the user?" — such as directions_left-top).'''
year_published = 2025
