["https://bem.info/methodology/build"]
title = "Build / Methodology / BEM"
full_description = "In a BEM project, the code is divided into separate files (the source files). To combine the source files into a single file (for example, to put all CSS files in project.css, all JS files in project.js, and so on), we use the build process. The resulting files are called bundles in the BEM methodology. To include only the necessary BEM entities in the build, you need to create a list of blocks, elements, and modifiers used on the pages. This list is called a declaration. It allows you to get rid of unnecessary code that increases the bundle size. The build tool bundles only the BEM entities that are included in the list. The example below shows bundling based on the declaration. You can create BEM blocks based on other blocks. To do this, you need to define dependencies on them. Dependencies allow you to avoid unnecessary copying and pasting. The build tool gets information about dependencies and adds all the BEM entities needed to implement a block. The example below shows a composite block. For more information on how to declare dependencies on other BEM entities and technologies, see Technology for declaring dependencies. In BEM, dependencies can affect the order of including BEM entities in the build. The mechanism of including the BEM entities depends on the DEPS entities that influence the inclusion priority in various ways. For more information on how to determine the order of including BEM entities in the build, see the DEPS syntax section. In BEM, the final block implementation might be distributed across different redefinition levels. They allow you to change the representation and behavior of the blocks for different platforms. Each subsequent level extends or overrides the original block implementation. Therefore the original implementation has to be included in the build first, and then changes can be applied from all the redefinition levels. The example below shows a project with redefinition levels: common.blocks, desktop.blocks and touch.blocks. The build order is marked with numbers."
year_published = 2025
