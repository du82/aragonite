["https://bem.info/methodology/redefinition-levels"]
title = "Redefinition level / Methodology / BEM"
description = "Redefinition level"
full_description = "A redefinition level is a directory in a BEM project that contains files for implementing blocks, elements, and modifiers. Any BEM project consists of redefinition levels. Every project must have at least one level, but the maximum number of levels is unlimited. The example below shows how to use a button from a third-party library in a project. To do this, you just need to connect the library with the button block on a separate level. You don't need to copy the code for the button block to the level with the project blocks. You can change blocks from any level to meet the needs of a project on a different redefinition level: Important In a BEM project, any block implementation technology can be extended or redefined. For more information, see Platform. You can use any number of levels in any order for assembling the final block implementation. The original block implementation is extended or redefined by implementations on the subsequent levels. This is why it's important for the original implementation to be included in the build first, and then changes can be applied from all the redefinition levels. The example below shows how to change the button block from a third-party library that is connected to the project on a separate level (library.blocks): To do this, create the button block on the common.blocks project level and place the button.css file in it with the new button styles. After the build, the implementation of the button block will consist of the original CSS rules from the library.blocks level and the additional rules from the common.blocks level: The duplicated property (background-color) is redefined (the background color changes to yellow), and the new properties (width and box-shadow) are added. The following set of properties is applied to the button block: If you update the library to the latest version, the changes that you made to blocks for the project will be saved on a different redefinition level. If the new version of the library has a different button background or size, the redefined rules will still be applied to the button block in the project."
