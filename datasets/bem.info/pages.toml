["https://bem.info/methodology/declarations"]
title = "Declarations / Methodology / BEM"
description = "Declarations"
full_description = "To list BEM entities needed to build a web page (effectively, ”an instance of a bundle“), you can use a declaration. A declaration is a list of blocks, elements, and modifiers that are used on a page.. A build tool uses declaration data to narrow down a list of entities that end up in the final project. Rather than include all the blocks of the project, you can pick only the necessary ones from the list. In the BEM platform, a page description is created in BEMJSON format, and a page declaration is described in BEMDECL format, e.g.: You can form a declaration manually. To do this, list all the BEM entities involved in the creation of the page. A list of the entities to include in the build can be obtained using classes from the HTML file of the web page. In a BEM project, the webpage structure is described by a BEM tree. This tree can be created manually, or generated automatically from classes in the HTML code (it contains classes with the names of all the BEM entities used). All entities (blocks, elements, and modifiers) are included in the declaration in the order specified in the build configuration. For an example of a project where a separate declaration is formed for each individual page, see Starting your own BEM project. Another source of information about the entities is the project file structure. The declaration will thus encompass all entities that are found in the file structure of the project. Although it ensures a guaranteed inclusion of all the necessary entities in the build, this method is lacking in precision: the build will cover all of the existing entities, not just the relevant ones. On the contrary, the page description-based declaration ensures the building of the relevant BEM entities on a per-entity basis, but does not guarantee inclusion of all those entities that are not explicitly specified in the HTML file for the page. In bem-components, the method of creating a declaration via the introspection of a file structure is used for the Dist-based library distribution."
