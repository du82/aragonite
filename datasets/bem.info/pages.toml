["https://bem.info/methodology/key-concepts"]
title = "Key concepts / Methodology / BEM"
description = "Key concepts"
full_description = "A logically and functionally independent page component, the equivalent of a component in Web Components. A block encapsulates behavior (JavaScript), templates, styles (CSS), and other implementation technologies. Blocks being independent allows for their re-use, as well as facilitating the project development and support process. For example, a head block can include a logo (logo), a search form (search), and an authorization block (auth). Blocks can be moved around on a page, moved between pages or projects. The implementation of blocks as independent entities makes it possible to change their position on the page and ensures their proper functioning and appearance. Thus, the logo and the authorization form can be swapped around without modifying the CSS or JavaScript code of the blocks. For example, a menu item is not used outside of the context of a menu block, therefore it is an element. Modifiers are similar in essence to HTML attributes. The same block looks different due to the use of a modifier. For instance, the appearance of the menu block (menu) may change depending on a modifier that is used on it. Modifiers can be changed in runtime (for example, as a reaction to a DOM event of the block), or via other blocks. For example, if the wrong credentials are entered when a user clicks the Sign In button (the 'click' DOM event), the 'visible' modifier is set on a hidden block with error messages. It is a notion that can be used both to refer to an individual BEM entity and as a generic term for blocks, elements, and modifiers. Let's assume that links in your project are implemented via a link block. We need to format menu items as links. There are several ways to do that. Create a modifier for a menu item that turns the item into a link. Implementing such a modifier would necessarily involve copying the behavior and styles of the link block. That would result in code duplication. Have a mix combining a generic link block and a link element of a menu block. A mix of the two BEM entities will allow us to use the basic link functionality of the link block and additional CSS rules of the menu block without copying the code."
year_published = 2025
clearnet = "https://bem.info/methodology/key-concepts"
