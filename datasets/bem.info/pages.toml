["https://bem.info/methodology/faq"]
title = "FAQ / Methodology / BEM"
full_description = "BEM provides a comprehensive solution for creating the architecture for your project and helps organize development processes. In Web Components, templates are always executed in the browser. This may involve solving some indexing problems. In BEM, template generation is possible at the development stage. This lets us pass the ready HTML. Templates can be executed both in the browser and on the server side. BEM uses a declarative approach, which helps manage templating in a flexible way and avoid redundancy. Web Components uses HTML Imports, which work directly in the browser. To combine HTML files, use the Vulcanize tool. In Web Components, Custom Elements are used. This approach allows only for one component to be hosted on a single DOM node. BEM uses the BEM tree. This approach allows you to place multiple components (BEM entities) on a single DOM node. The BEM methodology does not establish strict rules for creating blocks and elements. Much will depend on the specific implementations and personal preferences of the developer. Review the recommendations and choose what is right for you. Read more about using mixes and modifiers in the section A modifier or a mix: which one should I create?. This helps reduce the impact of elements and modifiers of one block on the implementation of another. When using mixes, the namespace for the modifiers must be specified explicitly so that it's clear which entity the modifier will be applied to on this DOM node. For convenience of development and support of the project, the file structure of a BEM project is divided into nested directories and files. Yes. The inheritance mechanism for CSS properties in BEM is no different from normal CSS inheritance. The best way to assign the same properties to all elements of a block is to set CSS rules for the block itself. To give the elements different properties, define CSS rules separately for each element. To avoid duplication in the resulting code, use a CSS optimizer. Abstract wrappers are not necessary, because the tasks they would solve are implemented using mixes and additional block elements."
