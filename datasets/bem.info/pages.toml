["https://bem.info/methodology/history"]
title = "History / Methodology / BEM"
full_description = "The history of BEM began in 2005. Back then, from the frontender perspective, a typical Yandex project was a set of static HTML pages that served as a base for creating XSL templates. All scripts for the project were kept in a single project.js file. JavaScript was used as an auxiliary tool for interactive elements, so project.js was small. Images were put in a separate folder. Because of the need to support IE 5 and the lack of CSS3 in browsers, images were used for all sorts of design elements — even for creating rounded corners. Styles and scripts were written in files: project.css and project.js. To separate the styles of different parts of a page, we used comments to indicate the beginning and the end: The static HTML pages were divided up into XSL templates. If the HTML changed, all the edits had to be manually copied to the XSL. And the opposite was also true: template changes required manual edits in the HTML (to keep the static HTML up to date). In 2006, we started working on our first large projects: Yandex.Music and Ya.Ru. These projects, with dozens of pages, revealed the main drawbacks of the current approach to development: A big project's layout was unmanageable. To avoid this, we needed to set rules for dealing with classes, tags, visual components, and so on. Developers were spending most of their time creating the HTML structure of a page and writing CSS styles for it. JavaScript was regarded as nothing more than a supplementary technology. To speed up development, we needed to simplify the support of HTML and CSS for separate page components. We introduced the concept of blocks for this purpose. A block is a part of a page design or layout that has a specific and unique meaning defined either semantically or visually. In most cases, any page element (either complex or simple) may be viewed as a block. The block's HTML container gets a unique CSS class that uses the same name as the block. A control (an independent block) with an associated JavaScript object that provides its functionality. Can be used anywhere on the page."
year_published = 2025
clearnet = "https://bem.info/methodology/history"
