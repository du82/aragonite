["https://bem.info/technologies/bem-react/motivation"]
title = "Why BEM? / bem-react / Technology / BEM"
full_description = "В этом документе собраны задачи, с которыми ежедневно сталкиваются веб-разработчики. Мы описали их решения в текущей реализации React и объяснили, почему эти способы неоптимальны. Библиотека bem-react-core предлагает альтернативные решения этих задач, более эффективные за счет использования уровней переопределения и возможности декларативно управлять модификацией блоков. Взаимодействие общей библиотеки компонентов и разных проектов Веб-компонент должен решать множество задач. Из-за этого его функциональность усложняется и количество возможных вариаций увеличивается. Вариативность компонента чаще всего выражается с помощью произвольных условий в коде в императивном стиле. Большое количество конструкций с if или switch не позволяет быстро оценить все возможности компонента, изменить компонент или создать нужную комбинацию условий, которые выполняются в рантайме. Кроме этого основная часть логики React-компонента заключена в методе render(). Поэтому чтобы перенести или переопределить функциональность компонента, необходимо переписать большую часть метода. Количество используемых компонентов постоянно растет, при этом их функциональность усложняется. Между компонентами появляется общий код, который необходимо повторно использовать."
