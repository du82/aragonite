["https://bem.info/methodology/js"]
title = "JavaScript / Methodology / BEM"
full_description = "In the BEM methodology, JavaScript is used for making a webpage “come alive” and is considered one of the block implementation technologies. BEM enforces additional rules on JavaScript that help to apply all the concepts of the component approach of the BEM methodology. JavaScript is one of the block implementation technologies, so the main concepts of the BEM methodology can be observed when working with JavaScript: Unified subject domain — using blocks, elements, and modifiers named according to general naming conventions. Separating the code into parts and the same rules for organizing the file structure of a BEM project. In web development, the final product (such as a webpage) consists of different technologies (HTML, CSS, JS, and so on). In BEM, working with all these technologies uses the same terminology and implementation approaches. This means that the entire team of a BEM project gets a unified language for communication, operating in terms of blocks, elements, and modifiers. So the JavaScript implementation of blocks doesn’t use the concepts of DOM elements, but uses the next level of abstraction — the BEM tree. The advantage to this is we don’t rely on classes, and can independently describe the behavior of blocks and their optional elements. In JavaScript, modifiers are used for expressing the logic of a block or element (similar to CSS, where modifiers are used for defining appearance). The behavior of blocks and elements is described in JavaScript as a set of states. Using the same concepts in all the technologies means we can implement various helpers in JavaScript for working with components and avoid hard coding the names of blocks and separators. This approach allows us to, for example, find all the elements with a particular name within the scope of a block, set a modifier for them, and check its value. Use the common solution of adding the appropriate class. This method isn’t necessarily convenient, because you have to hard code the block name."
