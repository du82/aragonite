["https://bem.info/methodology/naming-convention"]
title = "Naming convention / Methodology / BEM"
description = "Naming convention"
full_description = "The name of a BEM entity is unique. The same BEM entity always has the same name in all technologies (CSS, JavaScript, and HTML). The primary purpose of the naming convention is to give names meaning so that they are as informative as possible for the developer. To understand the meaning of the first name, you need read through each word carefully. In the last two examples, the name is clearly divided into its parts. But none of these names helps us understand that menu is a block, item is an element, and visible is a modifier. The rules for naming BEM entities were developed in order to make entity names unambiguous and easy to understand. Important: Elements of elements do not exist in the BEM methodology. The naming rules do not allow creating elements of elements, but you can nest elements inside each other in the DOM tree. In HTML, BEM entities are represented by the class attribute. In BEM, for any of the technologies, there is a call to the class: Important: Identical elements in the same block have the same names. For example, all menu items in the menu block are called menu__item. The naming rules above describe the classic approach to naming BEM entities. All BEM tools follow the classic naming scheme by default. There are alternative solutions that are actively used in the BEM community. To have all technologies apply identical names that were created using alternative naming schemes, use the bem-naming tool. By default, bem-naming is configured to use the methodology's standard naming convention, but it allows you to add rules so you can use alternative schemes. Important: A double hyphen inside a comment (--) may cause an error during validation of an HTML document. Names of blocks and elements begin with an uppercase letter. Names of modifiers begin with a lowercase letter. This naming scheme limits the use of mixes, because it makes it impossible to determine which block or element a modifier belongs to. You can create your own custom naming solution for BEM entities. The most important thing is that your new naming system makes it possible to programmatically separate blocks from elements and modifiers."
year_published = 2025
clearnet = "https://bem.info/methodology/naming-convention"
