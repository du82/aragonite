title = "Optimizing GoAWK with a bytecode compiler and virtual machine"
description = "How I sped up GoAWK by switching from a tree-walking interpreter to a bytecode compiler and virtual machine interpreter."
full_description = "Optimizing GoAWK with a bytecode compiler and virtual machine February 2022 Summary: I recently sped up GoAWK by switching from a tree-walking interpreter to a bytecode compiler with a virtual machine interpreter. I discuss why it’s faster and how the new interpreter works. Go to: Why VMs? | Details | Go’s switch | Other optimizations | Results | Conclusion Update: GoAWK now includes native support for CSV files. A few years ago I wrote GoAWK, an AWK interpreter written in Go, along with an article describing how it works, how it’s tested, and how I made it faster. GoAWK has been a fun side project, and is used in at least one sizeable open source project, the Benthos stream processor. It even landed me my current job at Canonical. GoAWK previously used a tree-walking interpreter: to execute a code block, it recursively walked the parsed syntax tree. That’s very simple, but not particularly fast. I’ve been wanting to switch to a bytecode compiler and virtual machine interpreter for a while, and I finally got around to it. One of my early programming projects was Third, a Forth compiler for DOS. Most Forth compilers, including Third, are simple compilers that use a form of bytecode – called threaded code in the Forth world. So I guess you could say I’ve been interested in virtual machines for 25 years … does that make me a true geek, or just old? Why are virtual machines faster than tree-walking? It’s not immediately obvious why compiling to virtual instructions and then executing them with a virtual machine is faster than evaluating a syntax tree (“tree-walking”). It’s actually more work up-front: instead of just lexing and parsing into a syntax tree, we now also have a compile step. That said, virtual machine compilers (including GoAWK’s) are usually very simple and non-optimizing, so that step is fast. One reason it’s faster to execute is this: RAM – which stands for Random Access Memory – is not actually random access on modern processors. Memory blocks are loaded into fast CPU caches as needed, so when you have to access a new block, it takes about 10x as long as if it’s in the cache. Peter Norvig’s table of timings for various operations on a typical CPU shows how fetching from level 1 cache takes about 0.5 nanosecond, fetching from level 2 cache 14x that long, and fetching from main memory another 14x! Programming with this in mind is called “data-oriented design”. I was reminded of how much impact this makes when watching Andrew Kelley’s excellent talk, A Practical Guide to Applying Data-Oriented Design. Andrew is the creator of the Zig programming language, and his talk describes how he significantly sped up the Zig compiler by applying data-oriented design techniques. That talk was what pushed me to think about this for GoAWK. But back to why a virtual machine is faster than tree-walking… A syntax tree is a bunch of node structures that point to other nodes. They’re scattered around in memory, so to evaluate the child nodes you have to follow pointers and jump around in RAM, possibly evicting whatever’s in the cache already. Here’s a diagram of the GoAWK syntax tree for the expression print $1+$2, showing the memory address in hex above each node name: The PrintStmt is only 48 bytes from the BinaryExpr, but the left FieldExpr is 8KB from that, and then its NumExpr is almost 120KB away from that. Cache blocks are typically 64 bytes, so each of those probably requires loading an additional cache block from main memory. Not very cache-friendly. With a virtual machine interpreter, the instructions are in a nice linear array of opcodes (instruction numbers), which will probably be loaded into a cache block all at once. There’s much less jumping around in RAM. Here’s what the GoAWK virtual machine instructions for that same program look like (you can see this “assembly listing” with the new debug flag, goawk -da): $ echo 3 4 | goawk -da '{ print $1+$2 }' // { body } 0000 FieldInt 1 0002 FieldInt 2 0004 Add 0005 Print 1 // 1 is the number of values to print 7 One of the (relatively few) optimizations GoAWK’s compiler does is shown here: it turns $i into a single FieldInt i instruction when i is an integer constant, rather than the two-instruction sequence Num i followed by Field. This means most field lookups only go through the opcode decoding loop once instead of twice. Another reason the virtual machine approach is faster is because there are fewer function calls, and function calls are relatively slow. When evaluating a syntax tree, the eval function recursively calls eval again to evaluate child nodes. With a virtual machine, that’s all flattened into a single array of opcodes that we loop over – no function calls are needed for dispatching opcodes. Compiler and virtual machine details GoAWK’s virtual machine uses 32-bit opcodes. Initially I was going to use 8-bit opcodes (where the “byte” in “bytecode” comes from), but 32-bit opcodes were just as fast, and with 32-bit opcodes you avoid the need for variable sized jump offsets: larger AWK scripts may need more than -128 to +127 jump offsets, whereas nobody’s going to need bigger jump offsets than the two billion that 32 bits gives you. 64-bit opcodes are unnecessary big, and they were slightly slower as well. Here are the first 10 opcodes (there are 85 total – you can see the full list in internal/compiler/opcodes.go): // Opcode represents a single virtual machine instruction (or argument). // The comments beside each opcode show any arguments that instruction // consumes. type Opcode int32 const ( Nop Opcode = iota // Stack operations Num // numIndex Str // strIndex Dupe Drop Swap // Fetch a field, variable, or array item Field FieldInt // index Global // index Local // index ... ) As you can see in the print $1+$2 assembly listing above, I’m using a stack-based virtual machine. This is simpler to implement, because the compiler doesn’t need to figure out how to allocate registers, it just pushes to and pops from the stack. Stack-based virtual machines may be slightly slower, however – very fast virtual machines like Lua’s are register-based. GoAWK’s compiler is quite simple, with a fairly direct translation from the syntax tree to instructions. I use some specializations for accessing variables of different scopes: for example, fetching a global variable uses the Global instruction, fetching a local uses Local. (As you can see, my instruction naming scheme is extremely creative.) Here’s the assembly listing for a simple program that sums the numbers from 1 through 10: $ goawk -da 'BEGIN { for (i=1; i<=10; i++) sum += i; print sum }' // BEGIN 0000 Num 1 (0) 0002 AssignGlobal i 0004 Global i 0006 Num 10 (1) 0008 JumpGreater 0x0018 000a Global i 000c AugAssignGlobal AugOpAdd sum 000f IncrGlobal 1 i 0012 Global i 0014 Num 10 (1) 0016 JumpLessOrEqual 0x000a 0018 Global sum 001a Print 1 55 This shows a neat little optimization I copied from Python, whose interpreter added it in Python 3.10 (though I’m sure it’s not a new idea). To compile a for or while loop, it’d be simplest just to do the test at the top, and then use an unconditional Jump at the bottom of the loop. But that means you’re executing two jump instructions every loop: one at the top and one at the bottom. Instead, we compile the condition twice: once inverted before the loop (JumpGreater) and once at the bottom of the loop (JumpLessOrEqual). This is slightly more code overall because the condition is repeated, but the loop itself – which is what matters – is one jump instruction shorter. We could almost certainly improve the instruction set further, perhaps adding special instructions for integers or strings when we know the type of the operation ahead of time. That adds complexity, however, and for now I’m going to keep it simple. The one other optimization the GoAWK compiler does is for assignments. Assignments in AWK are expressions, so by default you’d push their value on the stack … only to discard it right away in most cases. And you rarely use the value of an assignment expression. Here’s the assembly for an optimized assignment expression: $ ./goawk -da 'BEGIN { x=42; print x }' // BEGIN 0000 Num 42 (0) 0002 AssignGlobal x 0004 Global x 0006 Print 1 42 And here’s what it would look like if we didn’t have that optimization: 0000 Num 42 (0) 0002 Dupe # unnecessary 0003 AssignGlobal x 0005 Drop # unnecessary 0006 Global x 0008 Print 1 Below is the code that compiles statements, showing the special case used for this optimization. I also include how we compile if statements, to show something quite different. Note how the compiler makes heavy use of Go’s type switch: func (c *compiler) stmt(stmt ast.Stmt) { switch s := stmt.(type) { case *ast.ExprStmt: // Optimize assignment expressions to avoid extra Dupe and Drop switch expr := s.Expr.(type) { case *ast.AssignExpr: c.expr(expr.Right) c.assign(expr.Left) return case *ast.IncrExpr: ... // similar optimization for i++ and i-- case *ast.AugAssignExpr: ... // similar optimization for i+=2 (for example) } // Non-optimized ExprStmt: push value and then drop it c.expr(s.Expr) c.add(Drop) ... case *ast.IfStmt: if len(s.Else) == 0 { jumpOp := c.condition(s.Cond, true) ifMark := c.jumpForward(jumpOp) c.stmts(s.Body) c.patchForward(ifMark) } else { jumpOp := c.condition(s.Cond, true) ifMark := c.jumpForward(jumpOp) c.stmts(s.Body) elseMark := c.jumpForward(Jump) c.patchForward(ifMark) c.stmts(s.Else) c.patchForward(elseMark) } ... } } The virtual machine execute function is a single for loop with a big switch statement – one case for each opcode. Here’s a snippet showing the instruction fetching and the code to handle a few of the opcodes: func (p *interp) execute(code []compiler.Opcode) error { for ip := 0; ip < len(code); { op := code[ip] ip++ switch op { case compiler.Num: index := code[ip] ip++ p.push(num(p.nums[index])) case compiler.Str: index := code[ip] ip++ p.push(str(p.strs[index])) case compiler.Dupe: v := p.peekTop() p.push(v) ... case compiler.FieldInt: index := code[ip] ip++ v, err := p.getField(int(index)) if err != nil { return err } p.push(v) ... } } } Go’s switch statement As shown above, the virtual machine is implemented as a big switch statement with one case per opcode (around 80 cases). Go’s switch statement is currently implemented as a binary search through the “case space”. You can think of it as compiling to something like this – for brevity, only a few branches of the tree are shown in full: if op < 40 { if op < 20 { if op < 10 { if op < 5 { if op < 2 { if op < 1 { // handle opcode 0 } else { // handle opcode 1 } } else { // cases for opcodes 2-4 } } else { // cases for opcodes 5-9 } } else { // cases for opcodes 10-19 } } else { // cases for opcodes 20-39 } } else { if op < 60 { // cases for opcodes 40-59 } else { // cases for opcodes 60-79 } } As you can see, you need to do O(log2 N) comparisons and jumps to get down to the case you’re interested in. For 80 opcodes, that’s 6 or 7 branches to decode every instruction. As the number of instructions grows, the number of branches grows too (though thankfully that growth is logarithmic, not linear). When I first coded a proof-of-concept virtual machine for GoAWK and just implemented the 7 or 8 instructions I needed for the demo, it gave a huge performance boost, almost 40% faster, because the switch only had a few cases. But now that I have all the opcodes in place, it’s “only” 18% faster. It was actually slower than that when I had around 100 opcodes. I removed some specializations that I had thought would speed things up, but with fewer opcodes it meant one less binary search branch and was actually 12% faster on average. It’d be great if there were a way to get constant time instruction dispatch, no matter how many instructions we have. Why can’t Go implement switch as a table of jump addresses: look up the code address in a table and jump directly to it? It turns out Keith Randall on the Go team is working on just that, so we may get it in Go 1.19. I tried Keith’s branch (which only works with int64 types at the moment) on GoAWK, and it improved the speed of a simple microbenchmark by 10%. So I’m definitely looking forward to the Go compiler learning about “jump tables”. Could we do this optimization ourself? What about an array of functions? I tried that, turning the dispatch loop into the following: func (p *interp) execute(code []compiler.Opcode) error { for ip := 0; ip < len(code); { op := code[ip] ip++ n, err := vmFuncs[op](p, code, ip) if err != nil { return err } ip += n } return nil } // Type of function called for each instruction. Each function returns // the number of arguments the instruction read from code[ip:]. type vmFunc func(p *interp, code []compiler.Opcode, ip int) (int, error) var vmFuncs [compiler.EndOpcode]vmFunc func init() { vmFuncs = [compiler.EndOpcode]vmFunc{ compiler.Nop: vmNop, compiler.Num: vmNum, compiler.Str: vmStr, ... } } func vmNop(p *interp, code []compiler.Opcode, ip int) (int, error) { return 0, nil } func vmNum(p *interp, code []compiler.Opcode, ip int) (int, error) { index := code[ip] p.push(num(p.nums[index])) return 1, nil } func vmStr(p *interp, code []compiler.Opcode, ip int) (int, error) { index := code[ip] p.push(str(p.strs[index])) return 1, nil } This only gave me a 1-2% speed increase on GoAWK’s microbenchmarks (see results and code). In the end I decided I’d rather stick with the simpler switch code and find other ways to improve the speed. And when the Go compiler supports jump tables for switch, I’ll get a 10% improvement by doing nothing! The gcc compiler has a non-standard feature called “computed goto”, which allows you to write something like goto *dispatch_table[code[ip++]] at the end of each opcode’s code to jump directly to the code for the next opcode. Eli Bendersky has written an excellent article about computed goto, so I won’t dwell on it further here. Most virtual machines written in C use this technique, including CPython and many others. Unfortunately Go doesn’t have computed goto, but again, when switch is compiled to a jump table, that will get us half way there. If you’re interested in reading something a bit more academic about how compilers can optimize switch, read the paper “A Superoptimizer Analysis of Multiway Branch Code Generation [PDF]” by Roger Sayle, which was presented at the 2008 GCC Developers’ Summit. Other optimizations (and a de-optimization) Apart from converting from tree-walking to a virtual machine, I’ve recently added a few other optimizations: Buffering output piped to commands, which gave a 10x speedup for print redirection. I got a similar speedup for all print output when I added buffering to stdout originally, but I overlooked adding it for the redirected variant. Only convert numeric strings to number if needed. Previously I was doing the conversion eagerly, now I only do it if the value is required in a number context. This gives a solid improvement on real-world scripts tha"
