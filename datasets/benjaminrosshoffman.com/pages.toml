["http://benjaminrosshoffman.com/2014/10"]
title = "October | 2014 | Compass Rose"
description = "Better living through criticism and reason"
full_description = '''Orders of Doom 2 Replies The Ant and the Grasshopper The Ant knew that food would be hard to come by in the winter, so one hot summer day, as the Grasshopper frittered away the day leaping and dancing and making merry, the ant thought of nothing but gathering food for the hive. It even hoped to save enough food for the Grasshopper, who was not responsible for an upbringing and genetic makeup that gave it insufficient Conscientiousness. The Ant focused so completely on gathering food, making its route more efficient, carrying the most efficient load possible, that it missed the shadow that fell over it mid-afternoon. The Anteater's tongue sprung out to carry the Ant to a waiting, hungry mouth. The Ant was delicious. Meanwhile, a Black Swan ate the Grasshopper. The Grasshopper was even more delicious, having feasted on a variety of treats during its short but pleasant life. -Not Aesop's Fables I'm trying to figure out what the important problems are in the world so that I can figure out what I should do about it. But there are a few very different ways the world could be. Depending on which is the case, I might want to do very different things to save the world. This is an enumeration of the cases I've thought of so far. I'll start with existential risks, because they have the potential to affect the largest number of people. Continue reading → This entry was posted in Uncategorized on October 12, 2014 by Benquo. Is Veganism Correct? 6 Replies I'm hearing lots about how it's an obvious result that Effective Altruists should be vegans. This seems like a possible result to me, but not an obvious one. Here's why. Continue reading → This entry was posted in Uncategorized on October 7, 2014 by Benquo. An Appointment With Death 2 Replies A few months ago, I had an appointment on my calendar marked "Death". A friend had asked me earlier for help figuring out why she was afraid of death. At first I thought that surely philosophers must have addressed this question, so with my education I ought to be able to provide something relevant and illuminating. But all I could think of was attempts to cure the fear of death, not attempts to explain it. When I asked my former classmates, they had the same problem. Unless our memories are defective, or unless we simply aren't as widely read as we think, this is an embarrassment for philosophy, a failure to be curious about a fundamental question. I asked a librarian friend for help, and she turned up some resources, but these were mostly empirical in nature - descriptions of how fear of death is expressed in our and others' cultures, not a causal explanation of why we fear it. So I used the last tool in my box. I offered to ask her some clarifying questions and engage in dialogue for an hour. By the end, my thinking on death was clearer too, and I realized that a true understanding of how to think about one's own death ought to involve answers to these questions: Should I expect to die? How should I compare being dead with being alive? Continue reading → This entry was posted in Uncategorized on October 4, 2014 by Benquo.'''
