full_description = "Communication From Another Dimension 7 Replies In my post complaining about the way people talk about Guess, Ask, and Tell Cultures, I summarized them this way: The gist of the difference is that in “ask culture” it’s normal to ask for things you want even if you don’t expect to get them, it’s normal to refuse requests, and it’s not expected to anticipate others’ needs if they don’t ask for things, whereas in guess culture, you’re expected to offer things without being asked, you don’t ask for things unless you really need them or strongly expect the other person will want to give them, and it’s rude to refuse requests. (Tell culture is a variant on ask culture where instead of just making a request, you express the strength and exact nature of your preference, so other people can respond to your needs cooperatively, balancing your interest against theirs, and suggesting better alternatives for you to get what you want.) But the more I think about it, the more I'm sure that the problem isn't that one or all of these is bad - it's that these distinctions are insufficiently dimensional. Here are a few more precise axes along which communication differs: Explicit vs Indirect Verbal vs Nonverbal Anticipation vs Self-Advocacy Zero-Sum vs Coöperative Continue reading → This entry was posted in Cooperation, Psychology, Skills and tagged advantage, anticipate needs, anticipating needs, anticipation, ask, ask culture, ask/tell, ask/tell culture, clarity, clear, code switch, code switching, Communication, cooperation, criticism, culture, disadvantage, disguised queries, don't talk enough, drop hint, energy, expensive, explicit, guess, guess culture, heuristic, hint, hug the query, implicit, indirect, kindness, needs, noblesse oblige, nonverbal, preferences, productive, query, self-advocacy, self-advocate, social competence, social mistake, social skills, socially competent, socially skilled, talk, talk too much, talking, tell, tell culture, unfair standard