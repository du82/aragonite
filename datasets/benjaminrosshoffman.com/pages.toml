["https://benjaminrosshoffman.com/2017/03"]
title = "March | 2017 | Compass Rose"
description = "Better living through criticism and reason"
full_description = '''Against responsibility 18 Replies I am surrounded by well-meaning people trying to take responsibility for the future of the universe. I think that this attitude – prominent among Effective Altruists – is causing great harm. I noticed this as part of a broader change in outlook, which I've been trying to describe on this blog in manageable pieces (and sometimes failing at the "manageable" part). I'm going to try to contextualize this by outlining the structure of my overall argument. Why I am worried Effective Altruists often say they're motivated by utilitarianism. At its best, this leads to things like Katja Grace's excellent analysis of when to be a vegetarian. We need more of this kind of principled reasoning about tradeoffs. At its worst, this leads to some people angsting over whether it's ethical to spend money on a cup of coffee when they might have saved a life, and others using the greater good as license to say things that are not quite true, socially pressure others into bearing inappropriate burdens, and make ever-increasing claims on resources without a correspondingly strong verified track record of improving people's lives. I claim that these actions are not in fact morally correct, and that people keep winding up endorsing those conclusions because they are using the wrong cognitive approximations to reason about morality. Summary of the argument When people take responsibility for something, they try to control it. So, universal responsibility implies an attempt at universal control. Maximizing control has destructive effects: An adversarial stance towards other agents. Decision paralysis. These failures are not accidental, but baked into the structure of control-seeking. We need a practical moral philosophy to describe strategies that generalize better, and that benefit from the existence of other benevolent agents rather than treating them primarily as threats. Continue reading → This entry was posted in Cooperation, Discourse norms, Effective Altruism, Justice, Philosophy and tagged adversarial, agency, agent, control, converge, convergent, converges, cooperate, cooperates, cooperating, cooperation, cooperative, diverge, divergence, divergent, Effective Altruism, ethical, ethics, harmful, humble, humility, moral, morality, morals, neglectedness, philosophical, philosophy, private, public, responsibility on March 31, 2017 by Benquo.'''
year_published = 2017
clearnet = "https://benjaminrosshoffman.com/2017/03"
tags = ["actually", "adversarial", "affordance", "against", "agency", "agent", "archives", "archives:", "argument", "art"]
