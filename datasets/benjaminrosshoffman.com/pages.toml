title = "December | 2014 | Compass Rose"
description = "Better living through criticism and reason"
full_description = "Want to Summon Less Animal Suffering? 14 Replies I've been thinking about Julia Galef's chart of how much of an animal's live an unit of food costs. Her summary of her approach: If you’re bothered by the idea of killing animals for food, then going vegetarian might seem like an obvious response. But if you want your diet to kill as few animals as possible, then eschewing meat is actually quite an indirect, and sometimes even counterproductive, strategy. The question you should be asking yourself about any given food is not, “Is this food animal flesh?” The question you should be asking yourself is, “How many animal lives did this food cost?” She ends up with this chart: But as we know, from a hedonic utilitarian perspective, the moral cost of consuming animals is not measured in their deaths, but the net suffering in their lives - and lives are made of days. I am not a hedonic utilitarian, but I think that for big-picture issues, utilitarianism is an important heuristic for figuring out what the right answer is, since at least it handles addition and multiplication better than our unaided moral intuitions. So I looked up how long each of these animals typically lives, to estimate how many days of each animal's life you are responsible for when you consume 1,000 calories of that animal. The Food and Agriculture Organization of the United Nations says that beef cattle are slaughtered at 36 months old (i.e. 1,096 days), and pork hogs at 6 months old (183 days). Wikipedia says that chickens raised for meat typically live about 6 weeks (42 days), and laying hens about 2 years (730 days), and that dairy cows live an average of four years (1,461 days) before dying or being culled and sold as beef. Using those figures yields the following: Eggs now appear to be even worse than eating chicken flesh, since broiler chickens live very short lives compared to laying hens. Similarly, beef loses its advantage relative to pork, which comes from smaller but faster-maturing animals. Dairy still seems pretty okay, comparatively. A few complicating factors need to be explored before this becomes a reliable guide, though. First, not all animal suffering is of equal intensity. It may actually be net good for well-treated animals to exist. It is still not obvious that factory farmed animals would rather never have been born, or how to count their suffering. Second, it is not obvious how to attribute responsibility for animals that are not themselves raised to feed humans. For example, Julia divided laying hens' yield in half to account for killed male chicks, but the chicks obviously live almost no time. If you double the yield back to what it would have been before this adjustment, eggs come out about the same as chicken. Similarly, if a dairy cow is killed for beef, it seems like this should lower milk drinkers' and cheese eaters' day counts, since beef eaters contribute to the viability of raising dairy cattle too. Finally, there may be different elasticity for different animal products; because lowered demand leads to lowered prices, which increase demand, the industry might reduce production by less than a full chicken for each chicken you abstain from buying, and this rate may differ by animal. What am I going to do? I like eggs a lot, and think they're cheap and pretty good for me, and I basically believe Katja Grace's argument that I shouldn't put in a lot of work to change my behavior on this, so I'm going to keep eating them, though I'll continue to preferentially buy free range eggs where available. I have a rationalization that laying hens don't suffer nearly as much as broilers, so I'll flinch a little bit each time I consider eating chicken. I was favoring eating beef over pork due to Julia's analysis, but I will stop doing that now that I know the two are pretty much equivalent in terms of animal-days. [UPDATE: Brian Tomasik has an unsurprisingly somewhat more thoroughly worked out treatment of this line of thinking here.] This entry was posted in Effective Altruism and tagged animal liberation, animal rights, animal suffering, animal welfare, beef, boycott, broiler, cattle, cheese, chicken, cow, dairy, dairy cow, diet, Effective Altruism, egg, eggs, elasticity, ethics, factory farming, food, hedonic utilitarian, hedonic utilitarianism, hedonistic utilitarianism, hog, Julia Galef, katja grace, laying hen, lives per calorie, milk, moral calculus, moral hedonism, moral utilitarianism, morality, peter singer, pork, responsibility, steer, suffering, utilitarian, utilitarian calculus, utilitarianism, vegan, veganism, vegetarian, vegetarianism, vote with your wallet on December 1, 2014 by Benquo."
