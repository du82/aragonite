["https://benjaminrosshoffman.com/2016/08"]
title = "August | 2016 | Compass Rose"
description = "Better living through criticism and reason"
full_description = "Puppy love and cattachment theory. 3 Replies Secure attachment and the limbic system A couple of friends recently asked me for my take on this article by Nora Samaran on secure attachment and autonomy. The article focuses on the sense of security that comes from someone consistently responding positively to requests for comfort. The key point is that it's not just a quantitative thing, where you accumulate enough units of comfort and feel good. It's about really believing on a gut level that someone is willing to be there for you, and wants to do so: Continue reading → This entry was posted in Cooperation, Psychology on August 31, 2016 by Benquo. Minimum viable impact purchases 5 Replies Several months ago I did some work on a trial basis for AI Impacts. It went well enough, but the process of agreeing in advance on what work needs to be done felt cumbersome. It's not uncommon that midway through a project, it turns out that it makes sense to do a different thing than what you'd originally envisioned - and because I was doing this for someone else, I had to check in at each such point. This didn't just slow down the process, but made the whole thing less motivating for me. Later, I did my own research project. When natural pivot points came up, this didn't trigger a formal check-in - I just continued to do the thing that made the most sense. I think that I did better work this way, and steered more quickly towards the highest-value aspect of my research. Part of this is because, since I wasn't accountable to anyone else for the work, I could follow my own inner sense of what needed to be done. I was talking with Katja about my work, and she mentioned that AI Impacts might potentially be interested in funding some of this work. I explained the motivation problem mentioned in the prior paragraphs, and wondered out loud whether AI Impacts might be interested in funding projects retrospectively, after I'd already completed them. Katja responded that in principle this sounded like a much better deal than funding projects prospectively, in large part because it would take less management effort on her part. This also felt like a much better deal to me than being funded prospectively, again because I wouldn't have to worry so much about checking in and fulfilling promises. I've talked with friends about this consideration, and a few mentioned the fact that sometimes people are hired as researchers with a fairly vague or flexible research mandate, or prefunded to do more like their prior work, in the hope that they'll produce similarly valuable work in the future. But making promises like that, even if very abstract, also makes it difficult for me to proceed in a spirit of play, discovery, and curiosity, which is how I do some of my best work. It also offends my sense of integrity to accept money for the promise to do one thing, or even one class of thing, when my real plan is to adopt a flexible stance - my best judgment might tell me to radically change course, and at this stage I fully intend to listen to it. For instance, I might decide that I should switch from research to writing and advocacy (what I'm doing now). I might even learn something that persuades me to make a bigger commitment to another course of action, starting or join some organization with a better-defined role.} What doesn't offend my sense of integrity is to accept money explicitly for past work, with no promises about the future. Then it clicked - this is the logic behind impact certificates. Continue reading → This entry was posted in Cooperation, Effective Altruism and tagged autonomy, buy, certificate of impact, Charity, funding mechanism, impact certificate, katja grace, minimum viable product, mvp, paul christiano, prize, prizes, project, prospective, purchase, retrospective on August 29, 2016 by Benquo."
