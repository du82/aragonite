["https://benjaminrosshoffman.com/2016/09"]
title = "September | 2016 | Compass Rose"
description = "Better living through criticism and reason"
full_description = '''Frank Loesser and corruption in America Leave a reply The movie musicals of Frank Loesser (How to Succeed in Business Without Really Trying, Guys and Dolls) are a straightforward celebration of a certain sort of peculiarly American form of corruption and adulteration. Both are about people dressing up formally and obeying elaborate forms of etiquette while optimizing for nothing but scamming one another. Highly recommended if you haven't already seen them - Frank Loesser is also a gifted lyricist and the choreography is great, so they're fun to watch. Guys and Dolls is about how the occasional infusion of a person of integrity leads to the corruption of other people of integrity. Almost all the characters are gamblers, except for people who literally work as Salvation Army missionaries or police officers, and one stage performer. The gambling is made to seem charming since it resembles a children's game (all these grown up children just want to play with cards and dice and watch horses run fast and argue over who’s going to win), but it's clearly compulsive and antisocial behavior. The gamblers all dress up smartly and speak with elaborately formal diction, and in general it's a lot like The Godfather as an extreme romanticization of gangster culture (h/t Cracked) which plays up the honor ethic and sense of style. However, at one point a big out-of-town gambler who's lost a lot of money at a crap game pulls out a gun and a set of blank dice, claiming he remembers which side is which, in order to "win" his money back from the game organizer at gunpoint. So the honor is clearly sort of fake, but there’s some pressure to preserve appearances. Marlon Brando's male lead character falls in love with a woman working for the Salvation Army, but in the process of being reformed by her, manipulates her into leaving town one night, leaving her mission unstaffed so that some gamblers can use it as a venue, and then lying to the police to protect them. The other male lead, played by Frank Sinatra, finally agrees to get married to throw police off his trail, and in the process gives an engagement speech in front of his fiancée about how happy he is that she's trusting him even though she knows he's scamming her. How to Succeed in Business Without Really Trying is based on a satirical business handbook with the same title, and it's about how to use sociopathic Machiavellian manipulation to advance in a corporation. It's explicitly about clubbiness among graduates of the same college - at one point the young talented protagonist following the book's advice pretends to have gone to the same college as the CEO to curry favor with him. More generally, it is about coordination between people of a privileged class who want to continue extracting monopoly rents together instead of facing real competition - there's a scene where the other executives are meeting in the executive washroom to try and coordinate against the upstart. Near the climax there's a song called "Brotherhood of Man" about how top executives and board members should show solidarity with the rest of privileged middle and upper management and keep employing them them even if they don't add value. The protagonist becomes chairman of the board, and at the very end decides that he'd rather be President of the United States, so he shows up at the White House to implement the exact same strategy. This entry was posted in Uncategorized on September 19, 2016 by Benquo.'''
