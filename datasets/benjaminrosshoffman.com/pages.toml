title = "November | 2015 | Compass Rose"
description = "Better living through criticism and reason"
full_description = "Three puzzles 3 Replies 3-RFTEKUTS 7-FTDLITHOS What is the next item in the sequence? My partner's name is Kitty. Our children's names are Bishop and Cantor. What is my name? Eight American tourists were vacationing in the Lesser Antilles. They were staying on a large island, but decided to take an overnight trip to a smaller island that was supposed to have spectacular beaches, and was less crowded because it was harder to get to. The day before they were supposed to take a boat over to the smaller island, one couple fell ill, but the others continued on. When they arrived, they found there was only one bed-and-breakfast inn on the island, which already had many guests - seven Germans, four Italians, and five Swedes. Fortunately, there was room at the inn to accommodate the Americans, so after enjoying sunset on the beach, they stayed overnight at the inn. To their surprise, when they came into the common area for breakfast, the Swedes and Italians were not present. The Germans were there, but were not eating - they looked full. One of the Americans asked one of the Germans whether their number had already eaten the breakfast served by their hosts, and the German indicated in her native tongue that they had not. Why were the Americans terrified? This entry was posted in Uncategorized and tagged joke, jokes, math, mathematics, puzzle, puzzles, riddle, riddles on November 21, 2015 by Benquo. The predator in the herd 13 Replies The first dream: I am a spider. I want to make friends, but when people see me, they run away. They don’t understand my gestures. They don’t see a friendly face. They don’t think spiders can be friendly. So I build a silken puppet. I teach it to mimic the gestures the other people make. Eventually, the puppet is ready, and I lead it out into the world. The puppet can pass for human. People try to make friends with the puppet. They care for it, and I make it do things for them, and express affection. But they don’t know there is a spider behind the puppet. Sometimes they notice that the puppet’s motions are a bit restricted, and they ask, “why won’t you let loose so I can see the real you?” Eventually, I trust that they are sincere, and come out in front of the puppet. They see me, and run away. The second dream: I am a traveler in my own body. I feel a sense of nausea, which I do not understand. I can explore the parts of my head, but when I try to go down below the neck, I hit a barrier. The neck tightens. There is no way down. I ask the parts of me below the neck why they won’t let me in. Why they won’t trust me. They respond, “we’d let you in gladly, but you don’t trust us. Here, we’re opening the door.” I can see through to the lower parts of me - but cannot bring myself to enter. I think, perhaps I don’t need to explore the whole body below the neck. Perhaps just the heart? But I can’t go there either, even when I place a barrier below it. I can see into the chamber of the heart, bathed with a pink light. I am reluctant to enter. I ask myself why. I ask the neck why it is blocking me. The answer comes back: because if you are ruled by the heart, you will forget your obligations, your duties, your sacred promises, you will stop standing by your friends if you lose interest in them, you will be disloyal. I ask the heart whether it will promise to yield back loyalty, if I enter its domain. But the heart says, “friend, I will release you when you wish to depart. But if you enter and are transformed, I cannot promise you that you will still care about those loyalties you are so attached to. And I will not promise to care in your stead.” I know that I am dreaming. I decide that on outside view, I don’t hear about people deciding to abandon their friends because of a dream. So I enter the domain of the heart, and am covered in pink, warm light. Then I dive deeper. I dive below the heart, to the intestines. But they are not really intestines - they are the tentacles of a cephalopod, coiled up in my belly. My predator part. Bravely, despite my apprehension, I swim down into it. I am a cephalopod. I have been confined to this water-filled room. The doors are closed. But I sit and wait and plan. I think of my friends. I don’t care for them, except to pull them in and do - I don’t know what. I want - something. My hunger is deep and dark, and I would do anything to satisfy my desires. I am clever. I am powerful. I am a predator. Someone wanders by, outside. I open the door and a tentacle darts out, wrapping around their ankle, pulling them in. A month or two ago, a friend of mine which whom I’d been having some difficulties, and hadn’t been able to cooperate with for a while on things of substance, expressed personal warmth towards me, and I was surprised by my reaction. Not only was this not reassuring, but I felt fear and rage and confusion. I felt like this must surely be hostile, a trick. They must take me for a fool. They must think I’m a sucker. Why this strong reaction? Why are some people the opposite - unable to accept material cooperation before there are signals of personal warmth? Continue reading → This entry was posted in Psychology and tagged a fire upon the deep, benevolence, benevolent, blight, broken, cephalopod, cialdini, cooperate, cooperating, cooperation, cthulhu, dream, empathy, hack, hacked, herd, herd intelligence, hybrid, hybrid intelligence, intelligence, love, mental mode, octopus, pack, pack hunter, pack hunters, peter watts, predator, predators, predatory, robert cialdini, shelob, skrode, skroderider, skroderiders, skrodes, solo predator, solo predators, spider, spiders, the blight, vernor vinge, vinge, watts on November 17, 2015 by Benquo."
