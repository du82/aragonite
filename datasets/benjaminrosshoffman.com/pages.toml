["https://benjaminrosshoffman.com/2017/10"]
title = "October | 2017 | Compass Rose"
description = "Better living through criticism and reason"
full_description = "Poets are intelligence assets 8 Replies Aeschylus’s Oresteia is an ancient Greek tragedy about the dialectic between the natural desire for vengeance, order, and the rule of law. This is most likely what contemporaries thought the play was about, including Aeschylus himself. It is also a play about sexual politics, and the relationship between the idea of the rule of law as actually implemented in the West, and patriarchy. This is a good example of the well-known phenomenon in which literary criticism and other forms of textual analysis frequently get something “out of” the text that the author had no apparent intent of putting into it - and that many coherent narratives can be extracted from the same text. Far more than an author could plausibly have meant to put into the text. This is often taken as evidence that such readings are spurious. Robin Hanson argued that one way to extract information from published studies that was comparatively uncontaminated by publication bias, was to look at the coefficients of control variables. The idea is that if your study is about, say, the effect of alcohol on life expectancy, journals may be unwilling to publish it if you get an improbable-seeming result, or no significant result. But less scrutiny is applied to the estimated effect of alcohol if you’re studying something else, and simply “control for” alcohol (i.e. include it in your model as a possible predictor). Likewise, great literature is typically an integrated, multi-dimensional depiction. While there is a great deal of compression, the author is still trying to report how things might really have happened, to satisfy their own sense of artistic taste for plausibility or verisimilitude. Thus, we should expect that great literature is often an honest, highly informative account of everything except what the author meant to put into it. Continue reading → This entry was posted in Art, Culture, Justice, Philosophy and tagged achaian, adopt, adoptive