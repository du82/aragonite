full_description = "Anxiety, heart attack, or stroke? Leave a reply One of my friends who has regular anxiety attacks asked me to help her disambiguate between anxiety attacks and strokes. I wrote up a brief email, and then figured it might be worth sharing with the broader world. I’m not an expert on this, this is just the result of a little searching, so anything you hear from a genuine trusted expert who knows your particular situation should probably override this, but I expect it’s better than no info at all. I answered the question for her particular situation but it should be easy to modify as needed. Continue reading → This entry was posted in Estimates and tagged anxiety, base rate, bayes, bayes equation, bayesian reasoning, Bayesian updating, disambiguate, disambiguates, disambiguating, disambiguation, heart attack, medical reasoning, probabilistic reasoning, probability, quantitative reasoning, stroke on January 26, 2016 by Benquo. Soma: my best friends have bodies Leave a reply I recently attended the Integral Center’s Aletheia workshop, and one of the things we did was Holotropic breathwork. Basically you breathe very deeply, very fast, over an extended period of time. We were told that at some point it would become uncomfortable, but that if we breathed through it, we’d likely have some interesting experiences. Continue reading → This entry was posted in Psychology, Skills and tagged aletheia, body, embodiment, holotropic, pleasure, sensation, sensations on January 19, 2016 by Benquo. Model-building about desire - a worked example 6 Replies A few weeks ago, I spent a few days doing little other work than sitting and thinking about my problems. In 2012, I wouldn’t have dared do that. It would have felt like spinning my wheels. It would have felt lazy and self-indulgent. I would have expected to fail - and I would have been right. But now I can do it. The difference is that I’ve practiced structured thinking, or model-building. Rather than talk a lot about what that is, I’m going to work through an example. Continue reading → This entry was posted in Psychology, Skills and tagged akrasia, build a model, build models, burnout, desire, generating hypotheses, hypotheses, hypothesis, hypothesizing, leverage, Leverage Research, model, model-building, modeling, motivation, precision, reasoning, self-care, self-love, selfish, selfishness, sensation, sensations, structured thinking, testing beliefs, testing mental models, testing my beliefs, testing your beliefs, theorize, theory, think, thinking, well-being on January 15, 2016 by Benquo."
