["https://benjaminrosshoffman.com/2014/04"]
title = "April | 2014 | Compass Rose"
description = "Better living through criticism and reason"
full_description = '''Short Pieces - Two Stories and an Inspiration Leave a reply Bird Watching I heard the chickens in the henhouse grow silent. I loaded my shotgun and peeked around the corner. It was another zombie. Sometimes my birds quiet down for unrelated reasons, but it seems my chickens learned that the walking dead take longer to find quiet flock, and I'd found fourteen roving undead raiders by listening to the volume of their clucking, over the past week alone. A stopped cluck is right twice a day. Eat My Shirts There were twelve dresser drawers, and twelve moths; somehow, one had been trapped in each drawer during my vacation. Maybe some elaborate prank?Whimsically, to claim some positive feelings out of the experience, I decided to name the bugs after the months of the year. The first three drawers contained little of lasting value - socks, undershirts, these things are easily replaceable. Drawers five through twelve contained little damage, because they mostly held things that moths don't eat - leather belts, tie bars, synthetics. The fourth drawer, however, was full of my beautiful warm-weather shirts. Polos as thin and soft as a summer breeze. All of them had great big holes in them. April is the cruelest moth. Inspirational Of course I am an inspiration to you. You know this. I know this. But perhaps some of your friends do not. Perhaps I inspire you in so many ways that you don't know how to describe it all, or even where to start. At times you might find yourself asking, "How can I explain the extent to which Ben is an inspiration to me and others around him?" My friends, you need no longer be perplexed by this quandary. You need only but explain: I am so inspirational that an "Inspirational Quotes" Twitter account follows ME: This entry was posted in Uncategorized and tagged chickens, clothes, drawers, follower, Funny, henhouse, Humor, inspirational quotes, joke, mood piece, moth-eaten, moths, poetry, pun, short, short story, ts eliot, twitter, vignette, zombies on April 29, 2014 by Benquo.'''
