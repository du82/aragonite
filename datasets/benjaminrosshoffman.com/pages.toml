["https://benjaminrosshoffman.com/2016/10"]
title = "October | 2016 | Compass Rose"
description = "Better living through criticism and reason"
full_description = "GiveWell: a case study in effective altruism, part 4 7 Replies This is part of a series of blog posts examining seven arguments I laid out for limiting Good Ventures funding to the GiveWell top charities. My prior post considered the second argument, that even assuming symmetry between Good Ventures and other GiveWell donors, Good Ventures should not fund more than its fair share of the top charities, because it has a legitimate interest in preserving its bargaining power. In this post, I consider the third through fifth arguments: Argument 3: The important part of GiveWell's and the Open Philanthropy Project's value proposition is not the programs they can fund with the giving they're currently influencing, but influencing much larger amounts of charitable action in the future. For this reason it would be bad to get small donors out of the habit of giving based on GiveWell recommendations. Argument 4: The amount of money Good Ventures will eventually disburse based on the Open Philanthropy Project's recommendations gives them access to potential grantees who would be interested in talking to one of the world's very largest foundations, but would not spend time on exploratory conversations with smaller potential donors who are not already passionate about their program area. Argument 5: GiveWell, the Open Philanthropy Project, and their grantees and top charities, cannot make independent decisions if they rely exclusively or almost exclusively on one major donor. They do not want Good Ventures to crowd out other donors, because it makes them more dependent on Good Ventures, which will reduce the integrity of their decisionmaking process, and therefore the quality of their recommendations. If you already think that GiveWell is doing good, Argument 3 should make you more excited about it - and implies that Good Ventures should be looking for ways to give away money faster in order to build a clear track record of success sooner. Argument 4 seems plausible at some margin - if Good Ventures gives away most of its money quickly, then it will become a small foundation and have access to fewer potential grantees. But it would be a surprising coincidence if the amount of money Good Ventures will eventually give away were very close to this access threshold. If giving money away freely now will make it difficult to change behavior later once remaining funds are close to the access threshold, this is an argument for communicating this intention in advance, which may require Good Ventures and its donors to make their funding commitments more explicit. I deal with two components of Argument 5 separately. First, GiveWell's top charities may become less effective if dependent on a single primary donor. Second, GiveWell and the Open Philanthropy Project have a legitimate interest in preserving their own independence. The top charities independence consideration seems unlikely to uniformly apply to all the GiveWell top charities; each has a different funding situation and donor base, so this seems like a situation worth assessing on a case-by-case basis, not with a blanket 50-50 donation split between Good Ventures and everyone else. To the extent that Good Ventures becoming the dominant GiveWell donor threatens GiveWell's institutional independence, this problem seems built into the current institutional structure of GiveWell and the Open Philanthropy Project, in ways that aren't materially resolved by Good Ventures only partially funding the top charities. Continue reading → This entry was posted in Cooperation, Effective Altruism on October 31, 2016 by Benquo."
