["https://benjaminrosshoffman.com/2017/06"]
title = "June | 2017 | Compass Rose"
description = "Better living through criticism and reason"
full_description = '''Oops Prize 3 Replies if you don’t correct errors, you don’t get anything done, because you stay wrong. I don't think we do enough to reward saying oops. Lately, I’ve been complaining about ways the EA community’s been papering over problems in ways that forgo this sort of learning. But while complaining is important, on its own it doesn’t offer any specific vision for how to do things. At the recent EA Global conference in Boston, I was reflecting with a friend on what sorts of positive norms I would like to see in the discourse. One example of something I wish I saw more of, is people publicly and very clearly saying, "we tried X, it didn’t work, so now we’re stopping.” Or, “I used to believe X, and as a result asked people to do Y, but now I don’t believe X anymore and don’t think Y is a particularly good use of resources.” People often invest a lot of social capital in their current beliefs and plans; admitting that you were wrong can cost you valuable social momentum and mean you have to start over. You might worry that people will associate you with wrongness. We need communities where instead, clear admissions of error or failure are publicly acknowledged as signs of integrity, and commitment to communal learning and shared model-building. So I'm offering a prize. But first, let me give an example of the sort of thing we need to be praising more loudly more often. Continue reading → This entry was posted in Discourse norms, Effective Altruism on June 23, 2017 by Benquo.'''
