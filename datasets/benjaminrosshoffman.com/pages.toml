["https://benjaminrosshoffman.com/2017/07"]
title = "July | 2017 | Compass Rose"
description = "Better living through criticism and reason"
full_description = '''Taking integrity literally 4 Replies Simple consequentialist reasoning often appears to imply that you should trick others for the greater good. Paul Christiano recently proposed a simple consequentialist justification for acting with integrity: I aspire to make decisions in a pretty simple way. I think about the consequences of each possible action and decide how much I like them; then I select the action whose consequences I like best. To make decisions with integrity, I make one change: when I imagine picking an action, I pretend that picking it causes everyone to know that I am the kind of person who picks that option. If I’m considering breaking a promise to you, and I am tallying up the costs and benefits, I consider the additional cost of you having known that I would break the promise under these conditions. If I made a promise to you, it’s usually because I wanted you to believe that I would keep it. So you knowing that I wouldn’t keep the promise is usually a cost, often a very large one. Overall this seems like it’s on the right track – I endorse something similar. But it only solves part of the problem. In particular, it explains interpersonal integrity such as keeping one's word, but not integrity of character. Continue reading → This entry was posted in Cooperation, Philosophy on July 26, 2017 by Benquo. I'll pretend to ask, and you'll pretend to answer 13 Replies We were only pretending to engage with each other. But it wasn’t our fault. We had to be, because talking about bad faith is Not OK. Continue reading → This entry was posted in Cooperation, Discourse norms and tagged argument, attack, bad faith, call out, debate, defensive, discourse, good faith, norms, oppression, patriarchy, social on July 21, 2017 by Benquo. The order of the soul 18 Replies In standard three-part models of the soul, bias maps well onto the middle part. Symmetry maps well onto the "upper" part in ancient accounts, but not modern ones. This reflects a real change in how people think. It is a sign of damage. Damage wrought on people's souls – especially among elites – by formal schooling and related pervasive dominance relations in employment. Continue reading → This entry was posted in Psychology and tagged admonition, adult, arendt, berne, bhagavad gita, bias, bicameral, borderline, brazil, CFAR, child, cluster b, concept, conceptual, damage, desire to pass tests, dominate, dtpt, ego, eichman, epithymia, feynman, freud, generals, goal factoring, gunas, hanson, hotel concierge, id, jaynes, lockhart, logos, look at the water, math, mathematics, mimesis, mimic, narcissism, narcissist, narcissistic, order, parent, percept, perception, perceptive, perceptual, perceptual control theory, physics, play, rajas, sattva, school, steve jobs, structural thinking, submit, superego, symmetry, tamas, teacher's password, thumos, thymos, transactional analysis, universal grammar on July 19, 2017 by Benquo.'''
