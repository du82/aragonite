["http://benjaminrosshoffman.com/the-order-of-the-soul"]
title = "The order of the soul | Compass Rose"
description = "In standard three-part models of the soul, bias maps well onto the middle part. Symmetry maps well onto the “upper” part in ancient accounts, but not modern ones. This reflects a real c…"
full_description = '''The order of the soul 18 Replies In standard three-part models of the soul, bias maps well onto the middle part. Symmetry maps well onto the "upper" part in ancient accounts, but not modern ones. This reflects a real change in how people think. It is a sign of damage. Damage wrought on people's souls – especially among elites – by formal schooling and related pervasive dominance relations in employment. Contents1 The Gunas2 Good at school3 Percepts and concepts The Gunas Sarah Constantin recently wrote about a common three-part model of the soul, starting with the Bhagavad Gita’s version: The Gita speaks of three “gunas”, translated variously as “qualities”, “virtues”, “properties”, of which everything and everyone consists, in different proportions. These are sattva (wisdom, harmony, purity), rajas (passion, activity, ambition), and tamas (ignorance, chaos, destruction). The Gita says (Chapter 18, verses 23-25): Action that is virtuous, deliberate, free from attachment, and without craving for results, is considered Sattvic. Action that is driven purely by craving for pleasure, selfishness, and with much effort is Rajasic. Action that is undertaken because of delusion, disregarding consequences, without considering loss or injury to others or self, is called Tamasic. The tripartite model has parallels in other traditions, though, which Sarah conveniently compiled into a table: Gita Plato Freud Plain English Element Body Part Polyvagal Theory Sattva Reason Superego Thinking Air Head Ventral Vagal Rajas Passion Ego Doing Fire Heart Sympathetic Tamas Appetite Id Being Earth Belly, Gonads Dorsal Vagal In Plato’s republic, the soul is divided into reason or speech (logos), passion or spirit (thymos), and appetite (epithymia). In Freudian thinking, we have the superego, ego, and id. (Later Freudian-influenced traditions like transactional analysis used the related parent, adult, and child, though "adult" seems to stand in for "untriggered" rather than anything as narrow as "ego.") Everyone seems to agree that the middle part is self-assertion and the bottom part is more like sensual appetites and aversions. But for the top part, while Plato and the Bhagavad Gita seem to be talking about the same thing, Freud and his followers are describing something very different. The superego or parent concept tends to refer to the internalized voices of authority figures. Eric Berne, creator of transactional analysis, frequently described patients saying the sorts of things their parent would have said to them, by saying that they are speaking as the parent part. The function of this part is admonitory, and resembles Julian Jaynes’s model where early, preconscious humans hallucinated the voices of authority figures to remember to stay on task, to force theirselves to do things they would otherwise have abandoned as boring. As he writes in The Origin of Consciousness in the Breakdown of the Bicameral Mind: Let us consider a man commanded by himself or his chief to set up a fish weir far upstream from a campsite. If he [...] cannot [...] narratize the situation and so hold his analog ‘I’ in a spatialized time with its consequences fully imagined, how does he do it? It is only language, I think, that can keep him at this time-consuming all-afternoon work. A Middle-Pleistocene man would forget what he was doing. But lingual man would have language to remind him, either repeated by himself, which would require a type of volition which I do not think he was then capable of, or, as seems more likely, by a repeated ‘internal’ verbal hallucination telling him what to do. […] Similarly, in fashioning a tool, the hallucinated verbal command of “sharper” enables nonconscious early man to keep at his task alone. Or an hallucinated term meaning “finer” for an individual grinding seeds on a stone quern into flour. When morality is seen as rules society imposes on us to keep us in line, the superego or parent part is the internalized voice of moral admonition. Likewise, I suspect that in contemporary societies this often includes the internalized voice of the schoolteacher telling you how to do the assignment. This internalized voice of authority feels like an external force compelling you. People often feel tempted to rebel against their own superego or internalized parent. By contrast, logos and sattva are not seen as internalized narratives – they are described as perceptive faculties. You see what’s right, by seeing the deep structure of reality. The same thing that lets you see the deep patterns in mathematics, lets you see the deep decision-theoretic symmetries underlying truly moral behavior. A relevant anecdote from a sattvic friend: He'd been playing this new game called Generals. There's basically one dominant strategy against all humans, so when he's playing against a human, he sticks with the strategy, and focuses on execution - implementing the strategy faster and more reliably. This is rajas or thymos - point at the target, and then go after it fast. But the leaderboard is dominated by AIs and eventually he got to that level. So the important time started being between games; you can't beat the AI on reaction time. So he thought about how Lee Sedol had beat AlphaGo in one game. Answer: by pushing it into a part of Go-space it hadn't explored. It turned out that if my friend played the Generals strategy that's second or third best against humans, it was totally out of the AI's experience, so he could wipe the floor with it. This is sattva or logos - think your way around the structure of the problem. Take perspective. People who are new to online strategy games tend to spend their initial games trying to stay alive instead of trying to accomplish their game goals (destroy the other player). This is tamas. Just keep your head above water. Enough food in your body. Hide from threats. Live to fight another day. Not very adaptive in online games where death isn't very costly, but adaptive when facing real life threats. There’s no plausible description of ego, id, or superego that can do the thing my friend did. But a sattvic or logistic faculty would explain it quite nicely. Being able to think disjunctively, about multiple possible strategies. Good at school When I attended a CFAR workshop in 2013, one thing they taught that I got excited about was goal factoring. Goal factoring is basically taking an action you're ambivalent about, and asking yourself – what would be good about this? Once you've listed all the reasons, such that if you satisfied each of them some other way you'd be happy not taking the action, you've "factored out" your action into component goals. You can do this recursively (it helps to diagram it out as a tree) until you reach fairly basic goals. Then, you see what happens if you try to optimize for each of the component goals separately, so you can get a bunch of actions you're not ambivalent about, and do those instead. There's an analogous thing called "aversion factoring" where you look for the reasons something's bad, and try to fix them separately. Goal factoring was pretty exciting to me at the time – it taught me how to combine introspection and logical thinking. You're not just listing reasons the action might be good – you're trying to list your actual motivations. So, if you imagine optimizing your goals separately, and you would still regret not taking the original action, then you know that you have missed something. The arrows representing motivation in a goal factoring diagram, flowing from basic to compound goals, also represent a causal structure in your model of the world – you implicitly think that the action will cause these outcomes. The net effect of practicing goal factoring for me was to practice the skill of connecting my explicit, disjunctive models of the world with my intuitions and felt values. Practicing this kind of introspection was necessary to become the sort of person who could write things like The top six reasons why I am procrastinating (in which I implicitly factored out my preferences and aversions) or Model-building about desire - a worked example (in which I did explicit belief-mapping to explain something about my motivational structure). Naturally, I wanted to share this with others. When I got back home to DC, I tried to teach goal factoring to the Less Wrong meetup there. One participant told me that they'd had a hard time engaging, because their experience with any exercise around explicitly describing goals pattern-matched to things they'd been forced to do in school. For instance, they described an exercise they'd been forced to do at the beginning of the school year. The first step was to list a goal for the year (usually for that particular class), and the next steps were about figuring out how they'd accomplish that goal. They didn't really have specific goals in mind, so they had to make something up. Usually something that they imagined the teacher might approve of. They had effectively been trained to think of reasoning explicitly about goals as something where you have to follow someone else's rules, and has little to do with getting what you actually want. It should be easy to see how this might poison the whole thing. If someone's had enough experiences like that, where something that sort of looks like explicitly reasoning about goals is forced on them in nonsense ways, they might be ruined for goal factoring – and for many other things. "Mathematics" comes from the Greek word "manthanein," learn. It is, literally, "the learnable things." The Greeks tried to figure out what to call the science of shapes, magnitudes, and numbers, and the term that seemed most natural was "learnables." They thought it was the easiest thing to learn. And this seems borne out by the facts: it's in some sense objectively the easiest subject there is, since it's accessible to anyone at any time. It would be very surprising, for instance, if around the year 1900, someone from a non-Western culture with no formal training in a field like physics, chemistry, biology, political philosophy, theology, or law started producing novel work that attracted the interest of British experts at the top of the relevant field. But that's exactly what happened in mathematics, with Srinivasa Ramanujan. Because math is intrinsically easy. It's the underlying simple structure of the universe, and the sort of thing you should expect to have in common with any rational being. And yet, I think that pretty much everyone knows someone who "hates math," thinks it's hard, associates it with tedious memorization and passing tests, blanks out when someone tries to use numbers in an argument, or just feels inferior and defensive when it comes up. At St. John's College, it's a pretty normal thing for Freshmen to come in thinking they hate math, and change their mind when they take the compulsory course on Euclid's Elements, since for the first time they've seen it presented as something other than a bunch of rules they have to learn. This is because, just like my friend in DC had "thinking about goals" poisoned by school, the schools – not all, but most – have poisoned people's experience of math. They think of it as a thing where you have to memorize and follow a bunch of unconnected rules. I'm going to indulge myself and quote at length from Paul Lockhart's A Mathematician's Lament: A musician wakes from a terrible nightmare. In his dream he finds himself in a society where music education has been made mandatory. “We are helping our students become more competitive in an increasingly sound-filled world.” […] Since musicians are known to set down their ideas in the form of sheet music, these curious black dots and lines must constitute the “language of music.” It is imperative that students become fluent in this language if they are to attain any degree of musical competence; indeed, it would be ludicrous to expect a child to sing a song or play an instrument without having a thorough grounding in music notation and theory. Playing and listening to music, let alone composing an original piece, are considered very advanced topics and are generally put off until college, and more often graduate school. As for the primary and secondary schools, their mission is to train students to use this language— to jiggle symbols around according to a fixed set of rules: “Music class is where we take out our staff paper, our teacher puts some notes on the board, and we copy them or transpose them into a different key. We have to make sure to get the clefs and key signatures right, and our teacher is very picky about making sure we fill in our quarter-notes completely. One time we had a chromatic scale problem and I did it right, but the teacher gave me no credit because I had the stems pointing the wrong way.” In their wisdom, educators soon realize that even very young children can be given this kind of musical instruction. In fact it is considered quite shameful if one’s third-grader hasn’t completely memorized his circle of fifths. “I’ll have to get my son a music tutor. He simply won’t apply himself to his music homework. He says it’s boring. He just sits there staring out the window, humming tunes to himself and making up silly songs.” In the higher grades the pressure is really on. After all, the students must be prepared for the standardized tests and college admissions exams. Students must take courses in Scales and Modes, Meter, Harmony, and Counterpoint. “It’s a lot for them to learn, but later in college when they finally get to hear all this stuff, they’ll really appreciate all the work they did in high school.” Of course, not many students actually go on to concentrate in music, so only a few will ever get to hear the sounds that the black dots represent. Nevertheless, it is important that every member of society be able to recognize a modulation or a fugal passage, regardless of the fact that they will never hear one. “To tell you the truth, most students just aren’t very good at music. They are bored in class, their skills are terrible, and their homework is barely legible. Most of them couldn’t care less about how important music is in today’s world; they just want to take the minimum number of music courses and be done with it. I guess there are just music people and non-music people. I had this one kid, though, man was she sensational! Her sheets were impeccable— every note in the right place, perfect calligraphy, sharps, flats, just beautiful. She’s going to make one hell of a musician someday.” Waking up in a cold sweat, the musician realizes, gratefully, that it was all just a crazy dream. “Of course!” he reassures himself, “No society would ever reduce such a beautiful and meaningful art form to something so mindless and trivial; no culture could be so cruel to its children as to deprive them of such a natural, satisfying means of human expression. How absurd!” […] Sadly, our present system of mathema'''
