["https://benjaminrosshoffman.com/2016/12"]
title = "December | 2016 | Compass Rose"
description = "Better living through criticism and reason"
full_description = '''Automemorial 11 Replies In early 2014, as I was learning to be motivated by long-run considerations and make important tradeoffs, I started to worry that I was giving up something important about my old self - that some things that had been precious to me, would never quite be worth the price of holding onto, so the parts of my soul that cared for them would gradually wither away, unused, until it wasn’t even tempting to try and reconnect to going to the opera, translating classical Greek, or any of the other things in my life that I chose for their beauty but not their utility. It turned out that I was right, though not quite in the way I expected. This is my story. It is an honest report of that story, but that is all it is. This is the story of how, over the past year and a half, I died and was reborn. In it, you'll find the ways I had to learn to model the world to effect this transformation. I hope that some of them are useful to you. Continue reading → This entry was posted in Philosophy, Psychology, Skills on December 31, 2016 by Benquo. Claim explainer: donor lotteries and returns to scale 9 Replies Sometimes, new technical developments in the discourse around effective altruism can be difficult to understand if you're not already aware of the underlying principles involved. I'm going to try to explain the connection between one such new development and an important underlying claim. In particular, I'm going to explain the connection between donor lotteries (as recently implemented by Carl Shulman in cooperation with Paul Christiano)1 and returns to scale. (This year I’m making a $100 contribution to this donor lottery, largely for symbolic purposes to support the concept.) Continue reading → References[+] References ↑1 This phrasing was suggested by Paul. Here's how Carl describes their roles: "I came up with the idea and basic method, then asked Paul if he would provide a donor lottery facility. He did so, and has been taking in entrants and solving logistical issues as they come up." function footnote_expand_reference_container_2546_2() { jQuery('#footnote_references_container_2546_2').show(); jQuery('#footnote_reference_container_collapse_button_2546_2').text('−'); } function footnote_collapse_reference_container_2546_2() { jQuery('#footnote_references_container_2546_2').hide(); jQuery('#footnote_reference_container_collapse_button_2546_2').text('+'); } function footnote_expand_collapse_reference_container_2546_2() { if (jQuery('#footnote_references_container_2546_2').is(':hidden')) { footnote_expand_reference_container_2546_2(); } else { footnote_collapse_reference_container_2546_2(); } } function footnote_moveToReference_2546_2(p_str_TargetID) { footnote_expand_reference_container_2546_2(); var l_obj_Target = jQuery('#' + p_str_TargetID); if (l_obj_Target.length) { jQuery( 'html, body' ).delay( 0 ); jQuery('html, body').animate({ scrollTop: l_obj_Target.offset().top - window.innerHeight * 0.2 }, 380); } } function footnote_moveToAnchor_2546_2(p_str_TargetID) { footnote_expand_reference_container_2546_2(); var l_obj_Target = jQuery('#' + p_str_TargetID); if (l_obj_Target.length) { jQuery( 'html, body' ).delay( 0 ); jQuery('html, body').animate({ scrollTop: l_obj_Target.offset().top - window.innerHeight * 0.2 }, 380); } } This entry was posted in Effective Altruism on December 30, 2016 by Benquo.'''
