title = "June | 2016 | Compass Rose"
description = "Better living through criticism and reason"
full_description = '''PSA on outing Leave a reply If your friend is out about something to one group (say, their friends) and closeted to another group (e.g. their family or workplace) it's generally wrong to out them without their consent. If you want to avoid doing this, you should not tag or full-name them in public posts that refer to the thing they're closeted about, even on social media with privacy settings such as Facebook. If you do this, anyone who searches for them will be able to find your post. There is no privacy setting that can prevent this from being searchable, at least on Facebook. Nor does blocking such posts from their wall prevent them from being searchable on yours. Examples of things people may be closeted about in some contexts include but are not limited to sexual orientation (e.g. homosexuality or bisexuality), gender identity (e.g. being transgender), atheism, polyamory, mental illness or disability (e.g. having bipolar or depression), or physical illness or disability. They can't say this in public posts, because the fact that there is a secret is already more info than they want to disclose. But I don't have that kind of problem - so it falls on me to post this sort of PSA. This entry was posted in Uncategorized on June 29, 2016 by Benquo. Copernican revolutions, lordship, and bondage 4 Replies I got a wonderful compliment from a friend recently. They had mentioned that I was a good host - that I got some important things right (this on its own made me feel recognized) - and expressed some worry that I might feel unappreciated. Another of their friends had expressed the sense that their contributions to the community weren’t being reciprocated. From what my friend could observe of my behavior I was acting fairly similarly, and they were worried I’d burn out. I responded to the effect that I am already "burnt out" in the sense that I'm only doing things if they feel worth doing with no expectation of reciprocation. (My other motives are finding it intrinsically motivating to do good for others, and empowering allies to do good things more generally.) But, I continued, I was sad that I'm not setting off a success spiral where other people perceive the public goods I'm contributing to as benefiting them, and try to reciprocate by generating more public goods of a similar kind. A sort of public goods success spiral, where people do more, not just because they have more resources & like people, but because they perceive themselves to live in an environment with prosocial norms. My friend responded that my behavior had inspired them to be a better host, and given them affordances of things to do, that wouldn’t have occurred to them otherwise. They gave a concrete example: offering people water when they come in. And this was exactly the thing I'd wanted to happen, and had sort of given up on. I shouldn’t have given up. But I should have expected it to be hard, because it implies a level of spiritual development that you can’t just skip ahead to. I should have known this, because I've read Hegel's Phenomenology of Spirit. Continue reading → This entry was posted in Cooperation, Philosophy and tagged agency, agentic, bdms, bondage, copernican revolution, dom, dominance, dominant, dominate, domination, friendship, hegel, hufflepuff, master, phenomenology of spirit, serve, service, slave, spiritual development, sub, submissive, submit on June 27, 2016 by Benquo.'''
