title = "December | 2015 | Compass Rose"
description = "Better living through criticism and reason"
full_description = '''The Apgar of crushes 4 Replies UPDATE: I think I have enough data to definitively conclude that this list doesn't work. This has strengthened my sense that "crush" isn't used consistently, and that it's an anticoncept that obscures what people really mean. Some attributes I left out seem to have to do with excitement, fear, and intrusive thoughts. I don’t have one of those secret Facebook groups for people one has a crush on, for reasons similar to why I don’t celebrate International Tell Your Crush Day. However, I did happen to participate in a recent discussion about crushes, and mentioned my proposed replacements for the concept - the same ones I proposed in that blog post: You enjoy their conversation or company. You admire one of their character traits. They are nice to look at. They are so beautiful it literally hurts to look at pictures of them. You feel comfortable and safe around them. They turn you on. You feel like they understand you. If they ever truly needed your help, you would want to drop everything to take care of them. To my surprise and slight chagrin, people interpreted this not as an attempt to taboo “crush” entirely and replace it with more precise language, but to provide a working definition of the term. A couple of people suggested that a good working definition of a crush might be someone who satisfies three or more of these criteria. I’m going to roll with this, and propose this as an Apgar-style test for crushes. The story behind the Apgar score is that Dr Virginia Apgar was tired of people using inconsistent subjective judgment to determine whether a newborn needed medical help, so she developed a health score for newborns. To construct the score, she listed the various criteria someone might use to assess a newborn’s health, and coming up with criteria for “good” (worth 2 points), “OK” (worth 1 point), and “bad” (worth 0 points). A newborn’s score is calculated by adding up all the points. She didn’t use any empirical quantitative methods to develop this, she just… made it up. And it’s so informative that it’s still used in nearly all modern hospitals to this day. This is a very good example of how even very rough, made-up quantifications can make your judgment much better. (For more on this, read How to Measure Anything.) I’m looking for help validating this test, from people who do use the word “crush” to describe their attitude towards someone. Think of five people you’ve crushed on, and five people you feel warmly towards but do not have a crush on. Then for each person, tally how many of these crush criteria apply. No need to name names, but it would be nice to have the crush scores for both the crushes and non-crushes. By comment is ideal, but it’s fine to message or email me if you want to keep it nonpublic, or even put it in my anonymous feedback form if you don’t want me to know who you are. This entry was posted in Psychology and tagged apgar, apgar score, crush, definition, how to measure anything, itycd, love, precise, precision, score, taboo on December 17, 2015 by Benquo.'''
