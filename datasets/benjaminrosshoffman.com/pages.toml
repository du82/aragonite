full_description = '''Some things I learned about camping and other solitude-seeking activities 1 Reply This isn't a carefully structured post - it's just a bunch of pragmatic info, in the hopes that it will be useful to people who need this information structured the way I do. Continue reading → This entry was posted in Uncategorized on September 29, 2017 by Benquo. On the fetishization of money in Galt’s Gulch 11 Replies Ayn Rand’s Atlas Shrugged is set in a world in which the death dance of capitalism has reached its final stages, the state itself becoming an instrument of direct appropriation of surplus value generated by the workers. As industrialists become aware of the extractive nature of the process in which they are participating, one by one, they convert to the radical anarchism of an agitator named John Galt,* and “go on strike” to an utopian community hidden in the mountains of Colorado: Galt’s Gulch. In Galt’s Gulch, resources are allocated to whomever can use them most productively, in an informal process; since everyone can see how their interests converge, levels of trust are high, and hoarding and shirking are basically nonproblems. People pick up whatever tasks seem needed, regardless of their profession or the ability such tasks might give them to extract rents. This raises the obvious question: Why does anyone use money in Galt’s Gulch? Continue reading → This entry was posted in Humor, Justice, Philosophy and tagged anarchist, anarchy, atlas shrugged, ayn rand, Capital, capitalism\, colorado, contract, dagny taggart, engineer, equality, fetish, fetishization, feudal, galt's gulch, hank rearden, john galt, labor, money, rail, steel, train, trains, transaction, utopia on September 28, 2017 by Benquo. Sabbath hard and go home 25 Replies Growing up Jewish, I thought that the traditional rules around the Sabbath were silly. Then I forgot to bring a spare battery on a camping trip. Now I think that something like the traditional Jewish Sabbath is an important cultural adaptation to preserve leisure, that would otherwise be destroyed in an urbanized, technological civilization. Continue reading → This entry was posted in Culture, Psychology and tagged algorithm, business, cabin, consumer, consumerism, consumerist, discipline, emergency, facebook, function, human in the loop, jew, jewish, judaism, leisure, liberal, meditate, meditation, momentum, money, motion, noble silence, orthodox, palliative, reform, relax, relaxation, rest, retreat, role, rule, rules, sabbath, shabbat, wage, warning, work on September 26, 2017 by Benquo.'''
