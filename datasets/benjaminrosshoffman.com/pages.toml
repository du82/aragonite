full_description = '''Georg^^^Georg Leave a reply Scott writes: Okay, the Spiders Georg meme is now even more annoying than doge. And since I KNOW THE WAY YOU PEOPLE THINK, I want to emphasize that I specifically mean that the median use of Spiders Georg is worse than the median use of doge, and so there is no way outliers could have affected this result. “median use of Spiders Georg is worse than the median use of doge" factoid actualy just statistical error. median use of Spiders Georg is excellent. Georg Georg, a chatbot that adds the word "Georg" to posts and reposts them randomly 10,000 times each day, is an edge case adn should not have been counted This entry was posted in Uncategorized on September 19, 2014 by Benquo. Should You Get Therapy? 3 Replies Miri has a great post up about a common therapy failure mode, which is really a common interact-with-humans failure mode, which is really a common do-things-at-all failure mode - not determining your actions with goals: Continue reading → This entry was posted in Uncategorized on September 16, 2014 by Benquo. doesn't match the territory doesn't match the territory doesn't match the territory Leave a reply David: Luke has approved our MIRIx app Me: Yay! David: and we are getting posted on the MIRIx page Me: Nice! Me: This is possibly more important than being posted on the Map. Me: Though now at least one DC-based Rationalist Blog is on the Map, sort of. David: it is? Me: Compass Rose Me: I changed my blog's title David: ah, right Me: You know what one does when the map doesn't match the territory, right? Me: (One changes the territory.) David: is that a running thing? Me: Apparently it's not even an Eliezer Yudkowsky Fact. Me: Huh. David: well, you know what one does when the map about what one does when the map doesn't match the territory doesn't match the territory Me: I'm afraid your map about what I know about what one does when the map about what one does when the map doesn't match the territory doesn't ma