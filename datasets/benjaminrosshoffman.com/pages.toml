["http://benjaminrosshoffman.com/2015/09"]
title = "September | 2015 | Compass Rose"
description = "Better living through criticism and reason"
full_description = "Looking at your story, looking at the world 2 Replies This is a kind of prequel to Iterated Self-Improvement. Reading Bonds That Make Us Free, it occurs to me that it, Ayn Rand, Games People Play, and The Last Psychiatrist are all talking about the same vision of evil, and proposing different alternatives to it. Bonds That Make Us Free calls it self-betrayal, when you tell a story about how you can’t help it, how it’s really other people who are responsible for your failures and if it weren’t for them, you’d be good. It proposes as an alternative a genuine outward orientation of love towards others. Ayn Rand calls it social psycho-epistemology, where the opinions and feelings of people are what are truly real and the material world is a social construct or matter of opinion, and contrasts it with rational selfishness where you orient yourself towards the world outside, and try to make it the way you want it without worrying about justification or conformity. Other people's thoughts shouldn’t be as real to you as the material world, and the life you want to live in it. You can only pick one - living in your own world, or living in the world of other people's intentions. Similarly, you can trade your need for their justification and vice versa - or you can trade value for value. Rereading Atlas Shrugged was able to temporarily pull me out of a days-long downwards spiral recently - because it suddenly seemed boring to present my needs as a claim check. It seemed contemptible. It seemed like a betrayal of self and integrity. So I stopped - at least for a bit. I started thinking again about how to provide value for my friends, even as it seemed nearly impossible to succeed at. The Last Psychiatrist calls it narcissism - the desire to be seen as good, and as fitting your role, rather than the intention to be good to others, to fulfill one’s responsibilities, to discharge one’s duties. Games People Play doesn’t really have a vision of the good, but it talks about how people set themselves up in situations where they can show that they’re justified, instead of acting towards their nominal goals, because what they care about is the justification. I think I’ve been struggling with this problem. In mid-August I was too worried about how I was failing in one of my relationships to take responsibility for my own experiences. I’ve been too worried about being a responsible, conscientious worker to think about what kind of rhythm of life I actually want and am willing to accept. I wasted thought cycles on how the house I'd just moved into with friends wasn’t good yet and I’d been incompetent, instead of trying to make it good for myself in immediately achievable ways. But I also seem to have something like the opposite problem more often. Continue reading → This entry was posted in Psychology and tagged altruism, ayn rand, betrayal, bonds that make us free, cause, games people play, good, goodness, integrity, narrative, objective, objectivism, other-oriented, right thing, self-oriented, selfish, selfishness, Story, the last psychiatrist, world on September 28, 2015 by Benquo."
