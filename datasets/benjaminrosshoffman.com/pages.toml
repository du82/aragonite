full_description = 'On purpose alone 6 Replies On being an agent “Hey, do you mind if I steal one of those cookies?” “I brought them to share.” Denial of agency I feel compelled to correct people when they jokingly ask permission to “steal” something. At first I assumed this was just due to some general pedantic impulse, but recently I’ve been noticing that this particular usage annoys me more than other casual semantic misusages. My current hypothesis is that this particular phrasing bothers me because it implicitly denies my agency. Often I will have more of something on hand than I personally need, specifically because I anticipate that other people might need or want it too. I care about being the sort of person who thinks ahead like that, and I care about this thoughtfulness being understood and acknowledged. When a friend pretends that they’re stealing, they’re crafting a narrative where their good fortune happens by accident, that I just happened to have a thing they wanted, that they seized a random opportunity. It denies me the right to feel proud of having anticipated my friend’s probable needs, and to have the rightness of that pride acknowledged. I felt a similar irritation in other circumstances where no one actively denied my agency, but people simply assumed that I wouldn’t have put work in: Continue reading → This entry was posted in Cooperation, Psychology and tagged affirm agency, affirmation of agency, affirming agency, agency, asking for help, build a community, build community, building community, Community, community building, community obligation, debt, denial of agency, deny agency, denying agency, Emotional support, empathy, epistemic support, help, helping, helping out, implicit obligation, implied obligation, Intentional, material support, moral support, needing help, obligation, predator caring, predator cognition, safety net, support on March 30, 2016 by Benquo. Lego my Ego 1 Reply "if our brains get too smart they will become self aware and take over our bodys" -Ken M Ego games At a party, some friends and I played games around modeling other people. One game we played was ranking superego, ego, and id, in order of most to least prominent, for each person present. This schema is interesting in games because because it’s not a perfectly obvious classification, so it requires original seeing to do anything with. I’d self-labeled as ego > superego > id, but I was persuaded that I’m likely superego > ego > id. I had thought my ego was the strongest of the three because my self-regulation is fairly flexible and I don’t feel compelled by external rules, but it this is likely attributable to the fact that my superego has achieved self-awareness and taken over my brain. Or more precisely, that my superego is well developed in the sense of having expelled or disendorsed my dissonant, unhelpful, and untrue beliefs and inhibitions, and believes in behaving like an ego. And my ego, in turn, decided to identify with my superego. I was sleepy 15 minutes ago and successfully managed to get ready for bed, when I was tempted to lie on the couch and “read” or “nap” to "gather my strength” because getting ready for bed seemed like too much work. I climbed out of this hole by asking myself whether the best action would be to go upstairs and get ready for bed. Once I acknowledged that it was the best action, it was easy to muster the willpower.Now I’m in my room, with the LEDs set to red, editing this post as one last task before going to sleep. In hindsight it’s ridiculously obvious that my superego is exceptionally strong. I have a few friends who I’d describe as having a superego > id > ego arrangement. That’s an unstable relationship where superego and id fight each other directly for control. Superego is usually in charge, but id can seize control for a moment when it’s especially strong. Ego-on-the-bottom is volatile because ego’s special power is mediating among parts, constructing stable narratives that justify and encode trades and compromises between the other parts. If the narrative-spinning ego is weak, id and superego mostly just know how to fight - or, really, how to try to grab control directly. So you see superego, with the occasional flash of id, but no coherent narrative to hold things in place. What drives the superego > id > ego arrangement? In the case of one of my friends, it looks like what happened was that their id and superego both separately have reasons to distrust their ego. Their superego distrusts the ego for epistemic reasons; the ego is all about spinning a plausible narrative, and that feels like believing things because they’re convenient rather than because they’re true. Their id, on the other hand, distrusts the ego because it believes that it’s dangerous to be seen, that the world is malevolent, that it’s important to hide, that if one can just not exist, one can’t be hurt by anything - and presenting a self, having a strong ego, feels like very noticeably existing. Since neither id nor superego is willing to invest any trust in the ego, this makes it difficult for the ego to smooth out conflicts. It doesn’t have credibility. Continue reading → This entry was posted in Psychology, Skills and tagged agamemnon, argue, argument, athena, athens, bodies, body, brain, clytemnestra, cutting a deal, cutting deals, deal, dealmaking, deals, ego, enlightenment, epistemic virtue, epistemically virtuous, essay, frederick the great, free thinker, free thought, freedom, freedom of thought, freethinker, freud, freudianism, id, identity, immanuel kant, kant, ken m, libation bearers, liberal, liberalism, making a deal, making deals, mental stability, mentally stable, narrative, obey, oresteia, orestes, original seeing, process liberal, process liberalism, process liberals, prussia, soul, souls, superego, the eumenides, the furies, the kindly ones, typing system on March 28, 2016 by Benquo.'
