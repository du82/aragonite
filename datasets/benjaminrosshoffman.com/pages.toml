["https://benjaminrosshoffman.com/2016/11"]
title = "November | 2016 | Compass Rose"
description = "Better living through criticism and reason"
full_description = '''This is not what the 21st century wanted to be doing with its anxiety. Leave a reply I've used tweetmashup to get some more insight about the 2016 election. Eliezer Yudkowsky and Donald Trump Life was great for Trumpkowsky. If he had to sum up the state of his life in one word, that word would be Ohio: Continue reading → This entry was posted in Humor and tagged Humor on November 30, 2016 by Benquo. GiveWell: a case study in effective altruism, part 6 2 Replies This is the last of a series of blog posts examining seven arguments I laid out for limiting Good Ventures funding to the GiveWell top charities. In this post, I articulate what it might look like to apply the principles I've proposed. I then discuss my prior relationship with and personal feelings about GiveWell and the Open Philanthropy Project. A lot of arguments about effective altruism read to me like nitpicking without specific action recommendations, and give me the impression of criticism for criticism's sake. To avoid this, I've tried to outline here what it might look like to act on the considerations laid out in this series of posts in a principled way. I haven't constructed the arguments in order to favor, or even generate, the recommendations; to the contrary, I had to rewrite this section after working through the arguments. Continue reading → This entry was posted in Cooperation, Effective Altruism on November 23, 2016 by Benquo. It's crying wolf all the way down 8 Replies Some people are saying that Trump is unusually bad because he is openly racist and white supremacist. There's a post up on Slate Star Codex accusing these people of "crying wolf," of overstating their case. I think Scott Alexander is overstating his own case. Continue reading → This entry was posted in Uncategorized on November 22, 2016 by Benquo. Sample means, how do they work? 10 Replies You know how people make public health decisions about food fortification, and medical decisions about taking supplements, based on things like the Recommended Daily Allowance? Well, there's an article in Nutrients titled A Statistical Error in the Estimation of the Recommended Dietary Allowance for Vitamin D. This paper says the following about the info used to establish the US recommended daily allowance for vitamin D: The correct interpretation of the lower prediction limit is that 97.5% of study averages are predicted to have values exceeding this limit. This is essentially different from the IOM’s conclusion that 97.5% of individuals will have values exceeding the lower prediction limit. Continue reading → This entry was posted in Estimates, Justice on November 19, 2016 by Benquo.'''
