full_description = "The biggest sensation that I have ever seen Leave a reply Previously, I wrote about how I think having limited hearing and vision has limited my awareness in ways superficially similar to some autism symptoms, mainly the ones around tending towards highly focused activities. I’ve since had some experience enhancing my sensory channels - this post is about vision. Continue reading → This entry was posted in Psychology, Skills and tagged Asperger's, Asperger's-like, Asperger's-like symptoms, autism, autism-like, autism-like symptoms, awareness, contact lenses, data, direct experience, dream, experience, eyes, far away, fashion, glasses, goggle, goggles, mediated experience, perception, perceptions, sensation, sensations, sensory channels, social skills, touch, unmediated experience, vision on October 26, 2015 by Benquo. The cost of cryopreservation 2 Replies I put together a spreadsheet for a couple of friends calculating how much cryonics costs, and I figured I'd publish it here in case it's useful for anyone else. I can't promise that these numbers are perfect, but this should help you get at least a rough handle on how much cryonics really costs. Cryonics costs present value worksheet Continue reading → This entry was posted in Estimates, Uncategorized and tagged alcor, ci, cms, cost of cryonics, cost of cryopreservation, cryonic, cryonics, cryonics institute, cryopreserve, cryopreserved, present value, spreadsheet, standby, suspended animation on October 18, 2015 by Benquo. The Phoenix and the Skroderider 6 Replies Consider the case of buying one's partner flowers. You can think of each act of flower-buying as an act of caring (and this is typically the right attitude if your partner likes flowers and you want to genuinely relate on that level). Or you can think of installing the flower-buying habit as the act of caring that you hope will be perceived through the mask of mere flowers. The first type of person I call a Phoenix, the second is a Skroderider. Continue reading → This entry was posted in Psychology and tagged a deepness in the sky, a fire upon the deep, atlas shrugged, bird of fire, crises, crisis, discount rate, ellis wyatt, firebird, gryffindor, harry potter and the methods of rationality, hpmor, long term memory, phoenices, phoenix, phoenixes, problem, problems, short term memory, skrode, skroderider, skroderiders, skrodes, turn on a dime, vernor vinge, vinge, virtue, virtues, wildfire, wildfires, wyatt's torch on October 17, 2015 by Benquo."
