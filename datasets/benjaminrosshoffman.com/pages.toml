["http://benjaminrosshoffman.com/2016/04"]
title = "April | 2016 | Compass Rose"
description = "Better living through criticism and reason"
full_description = '''Authenticity and instant readouts 4 Replies "You don't know who someone is until you see them under pressure." Why do people say that? There’s this idea of authenticity: you know who someone truly is by seeing them in their unguarded moments, seeing uncensored emotions, that’s when you can have a real interaction with them, that’s when you can see their true self. This is counterintuitive to me. When I let down my guard and am my completely unfiltered self, people often find me incomprehensible. What’s more, they think I am being less authentic. When I let my social guard down and say things as soon as I think them, people say that they find it hard to relate to me and encourage me to just be myself. When I carefully filter and reframe things, and shape my behavior to get the interaction I want, I hear people say, “I can tell that you’re really being genuine with me.” But more importantly, even when my immediate reaction to a thing does get read as authentic, it may not use all my knowledge, may not be my endorsed judgment, and may not be the most true thing I know how to say. If I think things through and filter them, I can be more truthful than if I just react without thinking about whether what I’m saying is true. Interactions seem to be described as authentic when information transmitted has two qualities: The information is a direct measurement of the sender's internal state, and has not passed through deliberative social filters first. The information is of a kind that the receiver can automatically and unconsciously verify as meeting the first criterion. Continue reading → This entry was posted in Psychology, Skills and tagged authenticity, emotion, emotional response, emotionally raw, feedback loop, instant, instant readout, interpret, interpretation, interpreting, mental process, mental processes, readout loop, vulnerability, vulnerable on April 29, 2016 by Benquo. Safety in numbers 7 Replies Relaxation and waking up Taking a bath taught me that I hate it when things relax me. As part of my project to repair my relationship with desire, I’ve been working through the pleasure exercises in the book Pleasurable Weight Loss. These exercises frequently expose me to something that paradigmatically gives pleasure. The intended effect, I think, is to learn to embrace pleasure through habit-formation. The effect on me, however, has been to show me something surprising each time, often through my failure to be pleased by the activity, improving my self-model in a relevant way. I wrote about my experience with a nature walk. Another pleasure exercise was to take a luxurious bath. When I finally emerged from a long, hot bath, I found my body unusually relaxed. I sat down on the couch and wanted to flop over. I didn’t feel like moving at all. And this was terrible. It felt as though a wizard had cast a spell on me to dullen my mind. I wasn’t thinking, I wasn’t moving, and I didn’t want to, and this was terrible. It was dangerous. I went for a walk afterwards with a friend, and didn’t wear my jacket. The brisk winter Berkeley air cheered me up, since now I felt like moving, and thinking, and didn’t feel like I had to resist slipping into a restful oblivion. I dislike warmth, and soft dim lighting, and deep soft couch cushions that threaten to envelop me, for much the same reason: it feels like a trap. It feels like something is trying to lull me into a false sense of security. It feels like one of those scenes in a fantasy story, where the hero’s exploring some underground catacombs, and enters a mysterious important-seeming room and all of a sudden is feeling nice and warm and sleepy, and wants to sit down for a bit, and meanwhile there are the skeletons of previous adventures littering the floor, and you want to shout, “wake up! Look around you! Get oriented or you die!”. It feels like the warm, comforting, enveloping embrace of - death. Continue reading → This entry was posted in Psychology and tagged bath, bright, calculation, cognition, Cold, cool, Death, empathy, explicit, light, quantification, quantified, quantifies, quantify, quantifying, relax, relaxation, relaxed, relaxing, responsibility, safety, summer, tense, tension, think, thinking, trap, warm, warmth, Winter on April 27, 2016 by Benquo.'''
