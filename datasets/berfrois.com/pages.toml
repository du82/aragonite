full_description = "About Berfrois is an online literary-intellectual magazine. Berfrois is free of adverts thanks to our supporters. Editor Russell Bennetts founded Berfrois in 2009. His work is featured in The Bookseller, The Coming of the Toads and the Poetry Foundation. Associate Editors Medha Singh is an author, translator and editor based in New Delhi. Her books are Ecdysis (Paperwall, 2017) and I Will Bring My Time: Love Letters by Sayed Haider Raza (Vadehra Art, 2020). Pitch essay ideas to Singh: medha [dot] singh [at] berfrois [dot] com Calliope Michail is the author of a poetry chapbook, Along Mosaic Roads (the87press, 2018), with other work featuring online and in print. She is currently based in London. You can follow her on Twitter: @catonacanto. Contributors Berfrois has published Carol Gilligan, Jenny Diski, Tariq Ali, Robert Pinsky, Carl Phillips, Simon Critchley, Daniel Bosch and Legacy Russell, among others. Regular contributors include Jessica Sequeira, Douglas Penick, Susanna Crossman and Andre Gerard. Mentions Berfrois has been featured in the 3 Quarks Daily, Arts & Letters Daily, BBC, The Bookseller, CBC, The Express Tribune, Harvard University Press, Harvard Library, The Guardian, The Telegraph, the Morning Star, Prospect Magazine, The New York Times, The Washington Post, Flavorwire, The Christian Science Monitor, OUPblog, SOAS Research Online, Sky News, The Times, University of Helsinki Research Portal, Vox and more. Praise for Berfrois Berfrois is ‘one of the best and smartest sites on the Internet.’ – Flavorwire I love Berfrois! I think it’s great! – Elif Batuman Berfrois is one of the places I go to when I want serious, satisfying writing on literature. Everyone who cares about books should read it. – Veronica Scott Esposito Clobbered daily by (dis)information, I sometimes feel that art and poetry has retreated behind a giant’s wall. Berfrois has unlocked a door for me into that enchanted garden. I want to thank Berfrois for their incredible generosity. Berfrois is pure magic and the website is a living work of art. I just love it. – Lucy Lawless Editors"
