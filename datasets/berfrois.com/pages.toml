full_description = '''Goodbye, Hello The End of the Beginning by Douglas Penick Eli S. Evans: Is That It Creation Chained to a Stunned Repose by Daniel Tobin You must grieve for this right now —you have to feel this sorrow now— for the world must be loved this much... Read More Using Your Illusions by Tammy Lai-Ming Ho See, she was doing it again... Read More Berfrois Interviews Abraham T. Zere My short stories might read as slightly unconventional in Tigrinya literature... Read More Pictures Are Made by Scherezade Siobhan My evening ritual is to feed a tribe of haughty mallards, stern-faced gulls, wobbly, raucous oystercatchers... Read More Adam Staley Groves: Laters My writing for Berfrois urged the reader to rethink their reading... Read More Andre Gerard on Hope Mirrlees’ Paris I want a holophrase... Read More Robyn Ferrell is spooked by yōkai The exhibition abounds with tanuki, cat-demons, froglike humanoids and magic foxes... Read More Two Rooms at Café Hemingway by John Crutchfield Some writers search all their lives for the perfect place to work... Read More Colin Raff proceeds into the biotic sculpture room Nearing the south entrance, we come upon the Salon’s indisputable main attraction... Read More Albert Rolls on Thomas Pynchon The Crying of Lot 49 is an embryonic encyclopaedic novel... Read More Francesco Tenaglia Interviews Greil Marcus It was all about A Day In The Life which was being played on San Francisco radio stations long before the Sgt. Pepper album... Read More Strange Enlightenments by Jeremy Fernando The sky, serene, impenetrable, ineffable and incomparable, with a fine island of clouds... Read More Justin E.H. Smith says Hell yes, life is good When jaguars gnaw the quinine from the bark of a red cinchona tree... Read More Stuart Elden on Georges Dumézil Jupiter is the god who hurls thunderbolts, Dius Fidius the god of oaths... Read More Merkel Mused The first to ever hold the office, the first eastern German, the first scientist... Read Mo