["https://www.berfrois.com/2021/05/rene-girard-has-many-silicon-valley-disciples"]
title = "René Girard has many Silicon Valley disciples... - Berfrois"
description = "A student of René Girard’s while at Stanford in the late 1980s, Peter Thiel would go on to report that Girard is his greatest intellectual inspiration..."
full_description = "Who Is René Girard? And Why Does Silicon Valley Care? May 12, 2021 by Justin E. H. Smith 1. Although the literary theorist and anthropologist René Girard has many Silicon Valley disciples, surely the most notable of them is the German-born venture capitalist and founder of PayPal, Peter Thiel. A student of Girard’s while at Stanford in the late 1980s, Thiel would go on to report, in several interviews, and somewhat more sub-rosa in his 2014 book, From Zero to One, that Girard is his greatest intellectual inspiration. He is in the habit of recommending Girard’s Things Hidden Since the Foundation of the World (1978) to others in the tech industry. Girard has two big ideas, each intertwined with the other: the theory of mimesis, and the theory of the scapegoat. Michel Serres, another French theorist long resident at Stanford, and a strong advocate for Girard’s ideas, has described Girard as the “Darwin of the human sciences”, and has identified the mimetic theory as the relevant analog in the humanities of the Darwinian theory of natural selection. For Girard, everything is imitation. Or rather, every human action that rises above “merely” biological appetite and that is experienced as desire for a given object, in fact is not a desire for that object itself, but a desire to have the object that somebody else already has. This makes obvious sense, in a Veblenian key — plainly, indisputably, nobody wants a Rolex simply in order to be able to keep track of the passage of time with greater precision. Girard notes that the Old Testament authors were lucid enough about human motivation to tackle mimetic desire explicitly in at least four of the Ten Commandments, most notably in the prohibition on coveting, specifically, your neighbor’s goods. The great problem of our shared social existence is not wanting things, it’s wanting things because they are someone else’s. Of course, the problem did not go away with the prohibition, and for Girard this can only be because it is the universal basis of all human culture. Desire for what the other person has brings about a situation in which individuals in a community grow more similar to one another over time in a process of competition-cum-emulation. Such dual-natured social encounters, more precisely, are typical of people who are socially more or less equal. In relation to a movie star who does not even know some average schlub exists, that schlub can experience only emulation (this is what Girard calls “external mediation”), but in relation to a fellow schlub down the street (a “neighbor” in the Girardian-Biblical sense), emulation is a much more intimate affair (“internal mediation”, Girard calls it), which necessarily carries with it a simultaneous negative charge of desire to annihilate the person we seek to resemble. Among neighbors, the object of desire itself is eventually forgotten in the course of this process, and at the end the competitors stand in relation to one another as “doubles”: neither recalls what that thing is that the other had and that he or she wanted, and each has become undifferentiable from the other. This is the moment of what Girard calls “mimetic crisis”, which is resolved by the selection of a scapegoat, whose casting-out from the community has the salvific effect of unifying the opposed but undifferentiated doubles. The scapegoat occupies a liminal status between the sacred and the despised (compare Giorgio Agamben’s analysis of the dual meaning of the sacred as exemplified by the figure of the Homo sacer), and is in many cultures someone with a notable physical and mental disability — people with albinism, for example, are a common target in much of sub-Saharan Africa. In a community in which the mimetic mechanism has led to widespread non-differentiation, or in other words to a high degree of conformity, it can however happen that scapegoating approaches something like the horror scenario in Shirley Jackson’s 1948 tale, “The Lottery”. As Girard explains in an interview, published in 2004 under the title Les origines de la culture, “The more undifferentiated people become, the easier it is to decide that any one of them whatsoever is guilty” [plus les gens deviennent indifférenciés, plus il est facile de décider que n’importe lequel d’entre eux est coupable] (82). As a modest theory of the anthropology of punishment, these observations have some promise. As a general theory of human culture, one feels bound to raise some objections. 2. It has been compellingly said of Jordan B. Peterson that he is a dumb person’s idea of what a smart person is like. I would not say the same of René Girard, at least not without modifying the formula: he is a practically-minded person’s idea of what a theorist is like. Girard himself appears to share in this idea: a theorist for him is someone who comes up with a simple, elegant account of how everything works, and spends a whole career driving that account home. A theorist spends all of their time on the positive construction of a case, and none of their time on skeptical doubts or objections, and least of all on the nagging call of humility that pipes back up again whenever a philosophically minded person starts to feel as if they’ve got something right — the call that says, “Why should I, of all people, be the one to have got things right? It seems so improbable.” Girard’s answer to this question would probably be as straightforward as his theory: because I’ve read a lot, and because I am smart. Although he passed through credentialing institutions, Girard’s education resembles more that of some used-book-store owner who will talk your ear off about Schopenhauer or H. L. Mencken while his cat purrs happily on an otherwise unwanted stack of Will and Ariel Durant volumes. This is a species of learnedness that I associate with the United States (the model of the bookseller I have in mind is one I knew in Cincinnati) —improvisational, superficial, Whitmanian, free—, and it is indeed to the US that Girard went to get his reading done. He had already completed his studies at the prestigious École des chartes, in the peculiarly French field of paleography and “archivistics”, which ordinarily would have destined him to some sort of quiet career as a civil servant tending to old papers. No graduate of such a program can have failed to acquire a good deal of old-world erudition; but in a milieu where everyone is erudite, there’s no one to impress. He disappointed his associates, notably the surrealist poet and résistant René Char (Girard himself seems mostly to have experienced the war and the Nazi occupation as an inconvenient obstacle to his studies), by striking out for the US in the immediate post-war years, landing somehow in Bloomington, Indiana. There he concocted what to all appearances was a very hasty Ph.D. thesis in history, on American Opinion of France, 1940-43. Girard himself boasts about throwing this work together by summarizing the documents in a box of newspaper clippings the French embassy in Washington DC had sent to him, all the while spending the better part of his days in the IU library reading widely in comparative religion, mythology, and anthropology, above all the great British social anthropologists of the late nineteenth and early twentieth centuries: Tylor, Morgan, Frazer, and (par courtoisie) Bronisław Malinowski. One cannot help but be touched by Girard’s desultory, go-it-alone method. He seems to have sought to stay on at Indiana after his Ph.D., but was driven away after failing to publish anything at all — he is consistently reproached by his American colleagues “spreading himself too thin” (“C’est vous comparer à un trop petit morceau de beurre pour une trop grande tartine,” he will later explain for a French audience unfamiliar with the idiom). He somehow ends up next in Baltimore, where he has a hand in organizing the infamous meeting at Johns Hopkins that brought Jacques Derrida, Jacques Lacan, et al., to America in 1966 — recalling this event, Girard will later riff on Freud’s arrival in the US three decades earlier, when, coming into New York Harbor for his first visit, the psychoanalyst reportedly declared: “I have brought the plague”. Lacan played the clown, insisting on giving his talk in English even though he readily admitted he had basically zero knowledge of the language. Derrida mesmerized. Girard seems to have been there in a mostly organizational capacity — organizing the bringing of the plague, that is. In any case he does not seem to have met any truly like-minded people at this superspreader event. French theory on American shores has always been a dialogue des sourds, and Girard was already playing the American, which is to say enjoying the spectacle of all those puffed-up mandarins. Circumstances would soon bring Girard from Hopkins to SUNY Buffalo, where he developed a life-long interest in Shakespeare. He recalls, in the interview already quoted, having discovered the Bard while watching a theater production on TV. Now your typical high-mandarin French intellectual is not likely admit that his knowledge of Shakespeare comes from solitary evenings watching the Buffalo PBS affiliate (presumably). But Girard is not your typical French intellectual. He is a would-be French civil-servant archivist gone rogue, via Bloomington, Baltimore, Buffalo, and finally at Stanford, where his individual brand of New World self-reinvention would be well-received by some in the Silicon Valley subculture of, let us say, hyper-Whitmanian intellectual invention and reinvention. 3. As far as I can tell, the idea that anything Girard has to say might be particularly well-suited to adaptation as a “business philosophy” is entirely without merit. In a 2014 interview with Business Insider, Thiel is confronted directly with the question as to how, concretely, his former professor inspires his understanding of the workings of the tech industry. The venture capitalist attempts to illustrate with an example of the theory of mimetic desire at work in Silicon Valley: “When the payments company Square came out with its flagship credit card reader, competitors jumped in one after the other to do the same thing with triangles or half-moons instead of squares.” It is assuredly true that start-ups imitate one another, but I do not see anything more powerfully explanatory of this phenomenon in the work of Girard than in, say, Roland Barthes’s analysis of haute-couture in his ingenious 1967 System of Fashion, or for that matter Thorstein Veblen on conspicuous consumption, or indeed any number of other authors who have noticed that indubitable truth of human existence: that we copy each other. This hardly counts as a theoretical insight at all, so much as one of the given features of all human cultural life that presents itself at the outset as in need of theoretical explanation. Girard does, to be fair, offer some such explanation, but Thiel does not seem to have retained any of this. For him “Girard” stands mostly as a shorthand name for this pretheoretical fact, instances of which are of course multiplied in Silicon Valley life, as everywhere else. What about the other element of Girard’s theory, the scapegoat mechanism? Here Thiel’s preferred instance is particularly flat-footed: “As for scapegoating,” he says, “what happened to Bill Gates during the antitrust prosecution of Microsoft is a great example of the tendency to gang up and blame one person.” If you thought antitrust cases were about maintaining a rationally regulated system of moderate free-market capitalism that encourages competition and innovation, think again: go back to Girard, with his faithful student as guide, and find the primordial origins of the Microsoft lawsuit in the Vedic sacrifice of the cosmic horse. Thiel’s demoticized Girard would over the next years become a thoroughly vulgarized Girard, so that by 2018 there were online articles being generated —perhaps by bots, perhaps in offshore content-factories— with titles like “How the Idea of a French Philosopher Can Save Your E-Commerce Business”. “Rene Girad [sic, sic], a French Philosopher,” this particular article tells us, “has given a solid theory of human desire that can save anyone’s E-commerce.” Again, it is not that one wants to discourage a struggling Amazon-partnered retailer from reading French philosophy, but only that it is not at all clear that Girard is any better placed than any number of other theorists to provide any practical tools to help an e-merchant along towards his or her narrow goals — let alone to provide anything like a critique of the ideological structures that have imposed these goals. But whatever has money behind it will inevitably have intelligent-looking people at least pretending to take it seriously, and with the foundation of the Imitatio Project by the Thiel Foundation (executive director Jimmy Kaltreider, a principal at Thiel Capital), the study and promotion of Girardian mimetic theory is by now a solid edifice in the intellectual landscape of California. 4. For Girard, there is at least some desire that falls outside of the logic of mimesis, but only because it is a sort of proto-desire, a merely biological drive. I am naturally wary of human-scientists who seek to contain the biological with modifiers such as “merely”, but with Girard what frustrates me even more is that he does not seem to detect the non-mimetic varieties of desire that would seem to await us beyond, rather than before, desire that is coupled with imitation. For the sake of an example, let us return to that old, discomforting observation from Claude Lévi-Strauss according to which the “exchange” of women is the foundation of traditional societies, manifesting itself as “kinship”, and that therefore women are a good comparable to cattle (Françoise Héritier compellingly critiques this element of her teacher’s theory). Whether this is a correct account of society in general, it is at least true that some men seek out young, attractive, glamorous women in the aim of enhancing their own social status — the pure delectation in the other’s beauty may be at least part of the man’s satisfaction in the pairing, but it seems fair to say that this delectation is often inseparable from the self-contentment he feels at the status-enhancement she confers to him, and that achieving this status is in turn inseparable from depriving other men of the opportunity to achieve it. This is certainly the subtext of countless commercial-rap-music videos (or Romanian manele, or Serbian turbofolk, or any number of other analogous musical forms in the Balkans or elsewhere), which do not seem anthropologically far, in their smooth blending of the iconic images of luxury products with images of beautiful women, from a pastoralist society’s ceremonial display of prize cattle. But, pace Girard, we must admit that at least on occasion it happens that a vain and foolish man falls sincerely in love w"
