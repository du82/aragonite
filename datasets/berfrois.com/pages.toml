full_description = "Three Poems by Astra Papachristodoulou December 15, 2022 About the Poet Astra Papachristodoulou is a PhD researcher and tutor at the University of Surrey. Her practice-based doctoral project at Surrey is funded by the Doctoral College Studentship Award and explores sculptural poetics as a revolutionary act in the context of the Anthropocene. She is a widely-published author with work featured in UK and international magazines including The Times, Magma Poetry and BeeCraft. Astra is the author of several books including Stargazing (Guillemot Press), and her work has been translated into Korean, German, Russian, Slovenian and Spanish. Astra currently works at The Poetry Society’s Poetry Review. She is also the founder of Poem Atlas, and has curated several visual poetry exhibitions across the UK. She won the Pebeo Mixed Media Art Prize in 2016, and her visual poetry work has been showcased at venues such as the National Poetry Library, Kew Gardens and Christie’s, London. These three constellations are from her debut collection Constellations (Guillemot Press)."
