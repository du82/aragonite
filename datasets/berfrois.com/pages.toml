full_description = '''Goodbye, Hello The End of the Beginning by Douglas Penick Eli S. Evans: Is That It Creation Chained to a Stunned Repose by Daniel Tobin You must grieve for this right now —you have to feel this sorrow now— for the world must be loved this much... Read More Using Your Illusions by Tammy Lai-Ming Ho See, she was doing it again... Read More Berfrois Interviews Abraham T. Zere My short stories might read as slightly unconventional in Tigrinya literature... Read More Pictures Are Made by Scherezade Siobhan My evening ritual is to feed a tribe of haughty mallards, stern-faced gulls, wobbly, raucous oystercatchers... Read More Adam Staley Groves: Laters My writing for Berfrois urged the reader to rethink their reading... Read More Andre Gerard on Hope Mirrlees’ Paris I want a holophrase... Read More Robyn Ferrell is spooked by yōkai The exhibition abounds with tanuki, cat-demons, froglike humanoids and magic foxes... Read More Two Rooms at Café Hemingway by John Crutchfield Some writers search all their lives for the perfect place to work... Read More Colin Raff proceeds into the biotic sculpture room Nearing the south entrance, we come upon the Salon’s indisputable main attraction... Read More Albert Rolls on Thomas Pynchon The Crying of Lot 49 is an embryonic encyclopaedic novel... Read More Francesco Tenaglia Interviews Greil Marcus It was all about A Day In The Life which was being played on San Francisco radio stations long before the Sgt. Pepper album... Read More Strange Enlightenments by Jeremy Fernando The sky, serene, impenetrable, ineffable and incomparable, with a fine island of clouds... Read More Justin E.H. Smith says Hell yes, life is good When jaguars gnaw the quinine from the bark of a red cinchona tree... Read More Stuart Elden on Georges Dumézil Jupiter is the god who hurls thunderbolts, Dius Fidius the god of oaths... Read More Merkel Mused The first to ever hold the office, the first eastern German, the first scientist... Read More Your Local Internet Technology, which at first promised global reach, could assist the local resurgence of abundant microcultures... Read More For All the Tea in Scotland by Patrick Romero McCafferty Will Scottish tea follow in the surprising footsteps of the English wine industry? Read More Oscar Mardell on the true meaning of Christmas Evil Is Jeanne Dielman, 23 quai du Commerce, 1080 Bruxelles the greatest film of all time? Donate to: RED CROSS UKRAINE APPEAL Most Popular Berfrois Digs Virtual Doors Everywhere Early Visual Poetry 10 Fishing, with the arid plain behind One Beautiful Spring Day Studying Space Spiders Follow us on Twitter Tweets by @berfrois !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+"://platform.twitter.com/widgets.js";fjs.parentNode.insertBefore(js,fjs);}}(document,"script","twitter-wjs"); Newsletter Sign up for the Berfrois newsletter Sign Up Editor's Picks Orwell’s Cuppa The tea should be strong. For a pot holding a quart, if you are going to fill it nearly to the brim, six heaped teaspoons would be about right... Read More ‘Us’ by Legacy Russell The thing about new blooms is that they tend to bleed— / Those petals birthed / hugging close / that come warmer weather are tricked into jumping away... Read More ‘from An Explanation of America: Countries and Explanations’ by Robert Pinsky Read More Farah Abdessamad on François-René de Chateaubriand I spent a good part of my childhood at home staring outside my bedroom window, following the trail of planes approaching the nearby Paris airport in the sky from my banlieue. I envied the passengers... Read More A Monk Surfing Read More Go to Archive > Short story: ‘On the Sense of an Ending’ by Eli S. Evans Image gallery: 20 Readers by Edvard Munch Visual poems: ‘Cosmic psalterion’, ‘One headstrong poison’ and ‘Cloud loom’ by Astra Papachristodoulou Short story: ‘Berfrois’ by Setsuko Adachi Poems: ‘[The sand—]’ and ‘woodsman.’ by Joseph Spece Visual poems: ‘We Don’t Surf’ and ‘Excuse Me, Rocks’ by SJ Fowler Book excerpt: ‘Finnegans Wake’ by James Joyce Poems: ‘Genres of Love’ and ‘Absence’ by Tammy Lai-Ming Ho Image gallery: 11 Views of Paris by Vincent van Gogh Poem: ‘Eternity’ by William Blake Poems: ‘…Hymn to the Morning’ and ‘…Hymn to the Evening’ by Phillis Wheatley Poems: ‘What is your origin, yeast…’, ‘As if to grow…’ and ‘I Slept Through Evolution’ by Sharon Mesmer Poems: ‘Punk Resurgence’ and ‘Puttin’ the U in Depersonalization’ by Jennifer L. Knox Poem: ‘wyoming’ by Ken Taylor Classic short story: ‘Araby’ by James Joyce Poem: ‘Touch’ by Medha Singh Poem: ‘Banjo’ by Marsha Pomerantz Visual poems: “Far Out” and “As For” by Whiskey Radish Image gallery: 14 Postcards from Moriz Jung Poems ‘The Real Show’ and ‘Paper Snow’ by Jack Hanson Poems: ‘The Retreat’, ‘The Marches’ and ‘Always’ by Daniel Tobin Classic short story: ‘A Little Joke’ by Anton Chekhov Poem: ‘Fall, Crush, Drown’ by Sumana Roy Video: Read Like an Egyptian Poem: ‘Samarkand’ by Andre Gerard Poems: ‘Dover Beach’ by Matthew Arnold Poems: ‘Against Food Styling’ and ‘The Bureaucrat in Retirement: A Drive-By’ by Maryann Corbett Poem: ‘No Encore’ by Betty Adcock Video: Karl Bartos on Kraftwerk Podcast: Laptop Woes Poems: ‘poppy field’ and ‘roommilk’ by Kirsten Kaschock Poem: ‘A Red Envelope’ by Juliet Cook and j/j hastain'''
