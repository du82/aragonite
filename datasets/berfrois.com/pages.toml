["https://www.berfrois.com/2022/12/hymn-to-the-morning-and-hymn-to-the-evening-by-phillis-wheatley"]
title = "'...Hymn to the Morning' and '...Hymn to the Evening' by Phillis Wheatley - Berfrois"
description = "On ev'ry leaf the gentle zephyr plays..."
full_description = "Two Poems by Phillis Wheatley December 13, 2022 An Hymn to the Morning Attend my lays, ye ever honoured nine, Assist my labours, and my strains refine; In smoothest numbers pour the notes along, For bright Aurora now demands my song. Aurora hail, and all the thousands dies, Which deck thy progress through the vaulted skies: The morn awakes, and wide extends her rays, On ev’ry leaf the gentle zephyr plays; Harmonious lays the feather’d race resume, Dart the bright eye, and shake the painted plume. Ye shady groves, your verdant gloom display To shield your poet from the burning day; Calliope awake the sacred lyre, While thy fair sisters fan the pleasing fire: The bow’rs, the gales, the variegated skies In all their pleasures in my bosom rise. See in the east th’ illustrious king of day! His rising radiance drives the shades away— But Oh! I feel his fervid beams too strong, And scarce begun, concludes th’ abortive song. An Hymn to the Evening Soon as the sun forsook the eastern main The pealing thunder shook the heav’nly plain; Majestic grandeur! From the zephyr’s wing, Exhales the incense of the blooming spring. Soft purl the streams, the birds renew their notes, And through the air their mingled music floats. Through all the heav’ns what beauteous dies are spread! But the west glories in the deepest red: So may our breasts with ev’ry virtue glow, The living temples of our God below! Fill’d with the praise of him who gives the light, And draws the sable curtains of the night, Let placid slumbers sooth each weary mind, At morn to wake more heav’nly, more refin’d; So shall the labours of the day begin More pure, more guarded from the snares of sin. Night’s leaden sceptre seals my drowsy eyes, Then cease, my song, till fair Aurora rise. About the Author Phillis Wheatley was an American poet. She is considered the first African-American author of a published book of poetry. She was the third woman in the United States to have her written work published. Publication Rights These two poems are from Poems on Various Subjects, Religious and Moral (London: 1773). They are in the public domain. Post Image Detail from a 1773 engraving attributed to Scipio Moorhead."
