["https://www.berfrois.com/2022/12/creation-chained-to-a-stunned-repose-by-daniel-tobin"]
title = "Creation Chained to a Stunned Repose by Daniel Tobin - Berfrois"
description = "You must grieve for this right now —you have to feel this sorrow now— for the world must be loved this much..."
full_description = "Writing for the Dead December 14, 2022 William Blake, The Resurrection: The angel rolling away the stone from the sepulchre, c. 1808 by Daniel Tobin I Whether to the advantage or disadvantage of the present, it was an insight of great prescience when at the onset of the world’s second brutal upheaval in two decades T. S. Eliot composed the phrase “this twittering world” for “Burnt Norton,” the first of his Four Quartets. Grave as the present moment was, one has to presume that for Eliot a world characterized by empty chatter (though prompted by the needful exchanges of birdcalls) defined a condition much more encompassing than the present pass of history. For a poet of such considered metaphysical and artistic awareness, a world characterized by twitters expressed one sadly ubiquitous condition of an existential and ultimately spiritual mise-en-scene. The twittering world was not ultimately reality at all, but rather an ever-pervading source of distraction from the really real. The goal, even in the midst of its bewilderingly inescapable static, was to sufficiently quiet the interference and to begin to listen for something coming out of the silence, which for Eliot was ideally “the silence of God.” That silence filled the emptiness with genuine presence and pregnancy—as if all the noise of the world might designate a kind of sonic contour. Coming to its edge, one desires to hear something essential and transformative rather than contributing to the cacophony. Of course, in this twenty-first century technological nexus of global interfusion lifted by consuming swells of social media, one can only imagine the ex-patriate Eliot “gobsmacked” by just how pervasively this twittering world has become more virtually, literally, and (one might say) allegorically circumscribed by the tenor and vehicle of his original metaphor. Virtual because our world has become shaped and reformed by virtual reality. Literal because in a world of infinitely iterative and interactive “Zoom rooms” the virtual appears to have collapsed entirely into the literal. Allegorical because the cultural topography only so briefly sketched codifies an existential investment in the superficiality and expendability of discourse. Perhaps it is not overstating to say we have become a world defined by the screen rather than the window, which lends Eliot’s “twittering world” a visual as well as auditory aspect. In any case, in such a literally and virtually twittering world we run the risk continually of losing the necessarily distancing perspective of the allegorical. The twittering world enwraps and enraptures, nets us in every respect. The potential danger for poets especially is a loss of depth perception that can deform sensibility and derisively impact one’s apprehension and practice of the art. It is hard to get the news from poetry, Eliot’s staunchest detractor William Carlos Williams wrote, and harder still for the poet to get the real news to begin with when so much in the twittering world mitigates against discernment. Or to take a further cue from Gary Snyder, to reserve space in one’s often distracting life for the “real work” of poetry the poet needs to find ways of securing purchase on what is “really real” within and beyond the ever-passing and often engulfing stream of our collective and barely reflective consciousness. One should never presume one has a universal grasp of a condition or circumstance, however one might hope to “penetrate the mirror,” to borrow Michael Donaghy’s phrase.[i] Though such considerations about the attitudes of poets toward their work put me in mind of an encounter at the front desk of a writing department where I worked. I had come off the elevator after class and saw a klatch of graduate students talking, one of whom said—I couldn’t help but overhear—that all of the poets she most admired had Twitter accounts. The work of this student was among the strongest in recent years, and while my own work’s placement in her personal hierarchy apparently had been cast aside (I do not, alas, maintain a Twitter account). I found myself less piqued than struck by what so confident a declaration meant for this promising poet’s frame of aesthetic regard. I can think of many worthy and remarkable poets who do not, and many who never will, have Twitter accounts. Many of these presently grace the planet with their work, but a greater number from a plethora of times and traditions have departed the twittering world entirely, and the preeminent among them quite some time ago. What does it mean for poets to have their range of admiration so narrowed during a time when access to longstanding models of practice, and various traditions, has never been so enrichingly immediate? What does the trend toward contemporaneity and the potential impermeability of poetic communities—if these are trends—mean for poetic practice? How might it impact the role of the audience, or rather the poet’s conception of audience, in the making of a poem? I raise these questions fully aware of Robert Graves’s chastening caveat: “Never use the word `audience.’ The very idea of a public, unless the poet is writing for money, is wrong. Poets don’t have an ‘audience.’ They’re talking to a single person all the time.” Fair enough. I extend all of my esteem to the purity of Graves’s intention, as well as his farsighted and sardonic assessment of poets who prize popularity over artistry, among whom Rupi Kauer and Amanda Gorman, as well as bevies of Insta-poets, are the latest iterations. On the other hand, the aforementioned student—a poet not uncharacteristic of her generation—appears almost singularly conscious of her prospective audience in the most literal incarnation. Given the zeitgeist in the proverbial poetry business it is not surprising. A recent colloquium at one prominent venue for poets addressed the issue head-on in its title: “How to Grow Your Audience.” Earlier in the twenty-first century, another prominent venue offered a podcast entitled “The Poetry of the Future” in which three notable poets discussed among other things the idea of audience. Each highlighted an issue that seems relevant to my inquiry here. The first stated what appears to be obvious: relative to other arts, poets constitute their own “little world” and, mostly, constitute the audience for their art. The second underscored the incontestable fact that the very idea of poetry in America has expanded to include formerly marginalized poets whose race, sex, and class, as well as gender identification, affirm a more expansive practice in the art. The third panelist stated more narrowly and simply that poets had “to see to it to make ourselves heard.” Along such lines, in 2006, the redoubtable though more recently mercurial Poetry Foundation pursued a wide-ranging study on the audience for poetry, scientifically conceived, and replete with all kinds of data configured into all manner of detailed tables and charts. The findings even now appear dated. One might delve back further to plumb the roots of the poetic audience during the rise of modernity: Pope’s courtly trepidation and rise, Wordsworth’s assumption of a universal audience grounded in nature, Byron’s transgressive popularity, Shelley’s desire for popularity and his failure to obtain it, Tennyson’s social and cultural good fortune, Yeats’ s alchemy of the ideal and the actual, as well as the modernist penchant for “difficulty” and rarified reception.[ii] All things considered, this brief foray appears to give the lie, alas, to Graves’s spare though lofty ideal. Perhaps nothing can be more emphatically the case in view of the predominance of today’s social media world that poets must “make ourselves heard” or potentially have their work gain relevance only to the very few, though hopefully fit, to carry forward Milton’s and Pound’s shared dictum; or to have it ignored, or drift sadly away like the fictional Hugh Selwyn Mauberly into ever-widening Sargassos of ephemera. Still, at the other extreme, when one astute contemporary poet and Net-surfer took consideration of the question “Who do I write for?” the individual responded to his own momentous rhetoric with the acutest perspicacity and laudable honesty: “Fuck if I know.” II Yet, the circumstance of not knowing who one is writing for is not necessarily the same as having no idea of an audience. It does, however, suggest an open-endedness that naturally gravitates to a further conception of audience, one which appears consonant with a certain leveling and broadening of reach. My student would take this condition as the given habitat of poetry in the currently twittering world, and for the foreseeable future. This open-ended, seemingly egalitarian reach finds resonance with Bonnie Costello’s musings in The Plural of Us, her study of the “first-person plural” pronoun in poetry, where she claims optimistically that “poetry’s first- person plural suggests how the genre may propose or project open, reflective, splayed community, and create a sense of potential in `us’ that is not predicated on consensus, domination, or the mentality of the crowd.”[iii] In view, however, of the tactics and attitudes of contemporary cancel culture and its penchant for scorched-earth censorship of a perceived offender—the individual’s failure to align with prevailing codes of belief—any unreflective embrace of such a “splay community” appears, well, imagined. Imagining an idealized reality isn’t hard to do, as John Lennon continues to remind us, but in the case of the intersection of audience and social media one feels, inevitably, the need for caution. De Tocqueville’s “tyranny of the majority” comes to mind, for example. In view of, or in spite of, all such legitimate apprehensions, there is validity in seeing the audience in Twitter world as wholly prefabricated. One enters the portal, and one then has to wonder how subtly the twittering audience influences one’s work, and perhaps deform its deeper and purer intentions, assuming of course the poet cares. A poet should care, of course, really must care, for the poet’s idea of an audience inevitably shapes the work, and does so to the point of reflecting one’s idea of the world, indeed one’s idea of what is real in any ultimate sense. While there are numerous poets who conformed their lives and work to the prospects of “the court,” whether literally or merely the court of Po-Biz, there have been poets whose idea of audience had little to do with any social currency. As such, the technical currency of their work exhibited an uncommonly pure commitment to their art. “This is my letter to the World / that never wrote to me,” Emily Dickinson wrote, at once giving voice to her sense of painful separateness and to her allegiance to “Nature” whose “Message,” she hopes will be judged tenderly by Hands she cannot see. The paradox of Dickinson’s poem rests in an essential ambiguity: the poet has no audience, though there is also an audience in potentia in the Hands that will judge. Or are those Hands, like Nature itself, suggestive of a greater presiding Audience? Such an Audience, while open-ended, insinuates a valuation more comprehensive and necessary than her time. Likewise, Dickinson’s estimation of fame was similarly complex. Fame has, as one of her poems tells us, both a sting and a wing and, as another witnesses, fame is fickle. Obviously, fame requires audience, though in what I take to be her greatest poem on the subject, this most equally imperative and reticent of poets cuts to the quick: Fame is the one that does not stay — Its occupant must die Or out of sight of estimate Ascend incessantly — Or be that most insolvent thing A Lightning in the Germ — Electrical the embryo But we demand the Flame That the poem begins with the recognition of fame’s inconstancy quickly elides to the still more essential recognition of the ephemerality of life. What transports the poem into the essential brilliance of its insight is its claim that the real ascent is “out of sight of estimate.” And that is the same original and originating vitality that both creates the embryo and, still more imperatively for the poet, urges one to demand the pure source of being, the Flame, itself. At this junction, the one has become many, we. It is Costello’s “plural singular” made incarnate, but its community, the poem’s self’s audience, its “we,” allies itself with a reality more real than death and life, and certainly more real than any social and aesthetic estimate. In the end, Dickinson’s poem is nothing other than a petition to the Flame, the Flame that is all at once ascent and embryo and inexhaustible end. One could hardly imagine Emily Dickinson, by herself at the Hermitage in Amherst, delicately crimping her fascicles digitally for promotion on the internet, though it might make for a witty skit. Nor could one imagine the same of Gerard Manley Hopkins, whose true and almost only audience was God: Not, I’ll not, carrion comfort, Despair, not feast on thee; Not untwist — slack they may be — these last strands of man In me ór, most weary, cry I can no more. I can; Can something, hope, wish day come, not choose not to be. Here, surely, we find Graves’ single listener to whom the poet speaks, though because Hopkins is a devout Catholic his single listener is simultaneously and paradoxically a community of Three Persons in one God. “Oh, which one, is it each one” the poet exclaims near the poem’s end, such that the heaven-handling hero, Christ, and the agonized soul become nearly con/fused with the poem’s wrenching imitatio Christi. If Hopkins’s guiding idea of audience is simply God, then it is this rarified Audience that most forges the work and opens it to the world—a world that is decidedly not twittering. Like Hopkins, Lorine Niedecker wrote poems against the backdrop of social limitation, in her case a life of mostly menial labor and a remove from any substantive center of literary community. Though Niedecker’s idea of audience is not Hopkins’s God, nor Dickinson’s Flame burning within and before the essence of things, it is shaped by her economic circumstances as well as her relative solitude in Fort Atkinson, Wisconsin. One might say it was her correspondence with Cid Corman and a few others that enabled and enhanced the natural “condensery” of her poetry, as she characterized it in her poem “Poet’s Work.” There, she describes writing as an arbitrary trade engaged in at the behest of her grandfather, one that offers no “lay-off” though, one suspects, it does offer a dedicated engagement with the world. The final section of her poem “Tradition” addresses the heart of that matter: Time to garden before I die— to meet my compost maker the caretaker of the cemetery Neither the natural goings of the earth at which there appears to be no germinating flame, nor genuinely caring caretaker, nor any reverence for the shaping literary influences, appear here to inform Niedecker’s g"
