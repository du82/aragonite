full_description = "Two Poems December 14, 2022 by SJ Fowler About the Author SJ Fowler is a writer, poet and performer who lives in London. His latest book is MUEUM : a novella (2022). These works are taken from the selected screenshot and meme poems of SJ Fowler, entitled Recently Attracted Reality Influencers forthcoming from Overground Underground Books, edited by Michael Sutton. Postscript Berfrois has been online mattress of great spinal support and relative inspiring bounce for me, and many others, for many years. It’s a place I’ve actively turned to, to read, and to share my work that is growing, and pushing up. Flowers through the mattress. It will be missed. Thank you Russell and colleagues."
