["https://www.berfrois.com/category/main-article/interviews"]
title = "Interviews Archives - Berfrois"
full_description = '''The Wealth of Asteroids: Berfrois Interviews Martin Elvis The penalty in rocket fuel for mining on Mars is pretty big. Asteroids are better... Read More Berfrois Interviews Abraham T. Zere My short stories might read as slightly unconventional in Tigrinya literature... Read More Bibi to Bennett: Berfrois Interviews John Lyndon How will the ousting of Benjamin Netanyahu affect the future of Israeli politics? Read More Asian American Buddhism: Nancy Chu Interviews Chenxing Han May We Gather: A National Buddhist Memorial Ceremony for Asian American Ancestors ended with the Buddhist leaders processing in pairs out of the temple while holding one of two long white threads emanating from the Buddha statue on the altar... Read More The Sea’s Breathin: Medha Singh Interviews Gregory Leadbetter I first met Gregory Leadbetter in Trivandrum, in its notorious, sweltering heat. Curiously enough, I'd been placed in a couple of panels on love and feminism... Read More Katharine Coldiron Interviews Christopher Higgs Jessica Sequeira Interviews H.S. Shivaprakash H.S. Shivaprakash (Hulkuntemath Shivamurthy Sastri Shivaprakash) is a poet, playwright and translator who writes in the Kannada language. Read More Patriarchy’s Paradoxical Persistence: Berfrois Interviews Carol Gilligan and Naomi Snider Our work began with a question: Why do we sacrifice the pleasures of human connection in order to claim our place as “one of the boys” or as a “good” woman? Read More Translation: Berfrois Interviews Charlotte Mandell Based in the Hudson Valley, Charlotte Mandell has rapidly become one of the world’s most acclaimed translators from French into English... Read More A National Education Service: Berfrois Interviews Melissa Benn Our education system divided our nation, broadly along the lines of social class, choosing winners and losers at an early age... Read More Carmen Troncoso Interviews Ida Vitale Ida Vitale is a poet, translator, essayist, professor and literary critic in Uruguay. She is a member of the artistic movement called the “Generation of ’45” along with Mario Benedetti... Read More Controlled Experience: Berfrois Interviews Dimitris Lyacos Dimitris Lyacos is the author of the Poena Damni trilogy, which has developed as a work in progress over the course of thirty years... Read More Czesław Miłosz’s Century: Berfrois Interviews Andrzej Franaszek As you can imagine, there was no need to edit much in his articles. But I would ask him if he was sure about something. Miłosz was very willing to write and work... Read More Digital Capital: Berfrois Interviews Kenneth Goldsmith Painting reacted in a smart way to its crisis of representation and became something else. Writing didn’t... Read More Everyone Counts: Some Questions for Joanne Kyger Her Sorrows and Adversities: Berfrois Interviews Adrian Nathan West Matthew O’Shannessy talks to Amy Spiers and Catherine Ryan Drawing on the work of English philosopher Nina Power and research into the techniques of crowd control, Australian artists Amy Spiers and Catherine Ryan have created a satirical work amplifying the “camp” aesthetics found within the organized policing of public spaces. Read More CJ Chanco talks to Marc H. Ellis Marc Ellis has written over two dozen texts on the themes of justice, reconciliation, peace and conflict in Latin America and the Middle East. He is best known for his work on the links between the Holocaust and the Israeli-Palestine conflict. Read More State School Myths: Berfrois Interviews Melissa Benn (Again) As for our own free schools, there is mounting evidence that not only do many of these face as many, if not more, problems than the schools they were designed to replace Read More These Coffees Are Making Me Thirsty by Russell Bennetts Before her coffee, my mom was all body and no voice. She’d walk to the kitchen in silence, looking extra thin. Read More Amanda DeMarco interviews Hannes Bajohr Page 1 of 512345Next » Donate to: RED CROSS UKRAINE AP