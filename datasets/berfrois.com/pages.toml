["https://www.berfrois.com/2017/01/anatomy-mourning-legacy-russell"]
title = "'An Anatomy Of Mourning' by Legacy Russell - Berfrois"
description = "Grief is positive! GRIEF IS NEGATIVE"
full_description = "An Anatomy Of Mourning January 10, 2017 by Legacy Russell Grief is positive! GRIEF IS NEGATIVE Grief is proactive! GRIEF IS PARALYSING Grief is productive! GRIEF IS CAPITALIST Grief is reproductive! GRIEF IS STERILE Grief is useful, it galvanises me! GRIEF IS LABOUR, UNPAID Grief is movement! GRIEF IS STANDING STILL Grief is progressive! GRIEF IS FASCIST Grief is helpful! GRIEF IS COERCIVE Grief is public! GRIEF IS PRIVATE Grief is active! GRIEF IS LAZY Grief is strong! GRIEF IS WEAK Grief is proud! GRIEF IS SHAMEFUL Grief is empowering! GRIEF IS FEARFUL Grief is realistic! GRIEF IS DELUSIONAL Grief is radical! GRIEF IS COUNTERREVOLUTIONARY Grief is relief, I am relieved to grieve! GRIEF IS EXHAUSTING, I AM FUCKING EXHAUSTED Grief is collective! GRIEF IS LONELY Grief is truthful, it is honest! GRIEF IS A LIAR, IT IS FRAUDULENT Grief is calling your MP! GRIEF IS HANGING UP Grief is voting down ballot! GRIEF IS NOT VOTING Grief is self-care! GRIEF IS HARMFUL Grief is pragmatic! GRIEF IS INEFFICIENT Grief is volunteering! GRIEF IS SELFISH Grief is hopeful! GRIEF IS CYNICAL Grief is writing letters! GRIEF IS WITHOUT LANGUAGE Grief is speech! GRIEF IS SPEECHLESS Grief is showing up! GRIEF IS STAYING HOME Grief is relevant! GRIEF IS IRRELEVANT Grief is visible! GRIEF IS INVISIBLE Grief is a riot! GRIEF IS A PARADE Performed at Lisson Gallery, London in December 2016, as part of ‘In defence of the Demos’, in conjunction with Ai Wei Wei’s work, “Fondation”. About the Author: Legacy Russell is a writer and curator. Born and raised in New York City, she is the Associate Curator of Exhibitions at The Studio Museum in Harlem. Recent exhibitions include Projects 110 : Michael Armitage, organized with Thelma Golden and The Studio Museum in Harlem at MoMA (2019); Dozie Kanu : Function (2019), Chloë Bass : Wayfinding (2019), Radical Reading Room (2019) at The Studio Museum in Harlem; and MOOD : Studio Museum Artists in Residence 2018-19 (2019) at MoMA PS1. Russell’s ongoing academic work and research focuses on gender, performance, digital selfdom, internet idolatry, and new media ritual. She is Visual Arts Editor of Apogee Journal, a Contributing Editor for BOMB Magazine online, and a Senior Editor at Berfrois. Russell is the recipient of the Thoma Foundation 2019 Arts Writing Award in Digital Art and a 2020 Rauschenberg Residency Fellow. Her first book, Glitch Feminism, is forthcoming from Verso Books in Fall 2020. www.legacyrussell.com | Instagram: @ellerustle | Twitter: @legacyrussell."
