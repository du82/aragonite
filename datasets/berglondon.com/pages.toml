["https://berglondon.com/blog/2013/01"]
title = "January – 2013 –    BERG"
full_description = "There’s a substantial chunk of Little Printer and BERG Cloud work ongoing: tweaking, forecasting, serving, responding, reviewing, developing, testing, planning, prepping-for-Chinese-New-Year-ing, fixing, repairing, updating, deploying, designing-for-installing, and sprinting (which is resulting in some exciting things). Shiprock, the name for another Chaco project, is progressing well. Kachina is moving too and there are workshops for new clients in the offing and the calendar. There’s a lovely internal project which it has been deemed appropriate to name ‘Kemp’ and that’s going to be making good use of Joe, Nick, Neil and my time prototyping. The search for a new studio space continues, one in which it’ll be possible to continue running the Little Printer after school club. In other news, Joe’s taken temporary custody of 2 hamsters, which Helen said appeared to her in canine form in a dream. But my laptop had a catastrophic failure mid-week, and I had to blow away the drive and reinstall everything. I’m pretty good with back-ups, and I keep pretty much everything in Dropbox or in some cloud or another. But I had about two and a half un-filed documents that I lost. So, yeah. It seems quieter than we’re used to in the studio. December ended with a flurry, and a trillion brilliant contractors. It was crowded. 2013 has begun with a more intense focus on Little Printer and the BERG Cloud operating system, and that means it’s mainly just the core group in the room. I’m loving it, though it took a week or two for me to get used to the tempo change. Less like a sprint, and more like a hike. I tell you what’s wonderful, and that’s the feeling that everything we do is building on this platform for Web-powered things that we’ve created, and it slowly but surely gets better and better. So I’ve spent most of 2013 putting together our new business plan. There’s a lot to do! Like: Where are we going to be in 10 years? So how are we going to get there? What’s a realistic product roadmap? Given all of this, what do we need to do… well, *tomorrow?*"
