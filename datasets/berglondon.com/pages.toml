["https://berglondon.com/blog/2013/04"]
title = "April – 2013 –    BERG"
full_description = "Disney continue to make me want to work in their research department with this smart light project HideOut. I found this excellent page of CSS creatures (make yours and submit via twitter): http://bennettfeely.com/csscreatures/ Tom Stuart sent this JavaScript ray tracer (http://zenphoton.com/), which is pretty lovely but does rather warm up my computer. In 2009 we launched Here & There, a limited edition run of art prints exploring speculative projections of dense cities. The pair of prints show the projection as used in Manhattan, one looking uptown from 3rd and 7th, and the other looking downtown from 3rd and 35th. This post is to announce that they’re back on sale! I wrote about the influences and research around the project too. We turned off the shop around a year later with a few prints left in stock. I’m pleased to say today that we’re reopening the shop to sell the remaining 180 pairs of prints. Since it’s launch, lots has happened. We’ve renamed BERG and H&T itself has been on several exciting journeys. A pair of prints were exhibited in the 2011 MoMA exhibition Talk To Me. They have since been incorporated into MoMA’s permanent collection. The projection has formed the basis of a patent for use in the context of mobile displays which is an advanced stage of back and forth with the USPTO. The exciting and intelligent action film, Inception, released in 2010, later released a beautiful alternative poster! We regularly receive inquiries and requests for a pair of prints, so today the shop will re open for a limited period. The prints are £99 plus postage and are on sale here. “Andy’s looking a bit Patrick Swayze in Dirty Dancing,” quoth Helen. (Apparently it’s the black t-shirt.) And thus began our weekly All Hands meeting this morning. Happy St George’s Day! It’s a beautiful day in Shoreditch. The sun is shining, the windows are open, the scent of blossoming trees wafts on the breeze… it feels like spring is finally here. The beautiful weather certainly has had an impact on people’s moods. Yesterday at lunch time everyone sat around munching on their sandwiches and looking at their phones. Today people were conversing and joking and lingering. On both days Alice and Phil G were preoccupied with the Guardian’s Cryptic Crossword puzzle. Some things don’t change regardless of the weather."
year_published = 2013
