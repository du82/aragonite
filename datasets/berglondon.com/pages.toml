["http://berglondon.com/blog/2011/06/17/svk-at-the-printers"]
title = "SVK at the printers, next stop: warehouse –  Blog –   BERG"
full_description = "Last week we visited Pureprint who are brilliantly managing the complex and specialist task of printing SVK with invisible inks. We documented the comic going through the handsome machines of the printing world: As well as being an investigation into printing and optical experimentation, SVK is a test of our own supply chain management and product launch processes. Today has been named “SVK Friday”, we are all working together on getting SVK a bit nearer to launch. We have a whiteboard full of todos; press releases, web, blog, print and email copy, a photoshoot, a website, email templates, postal and shipping tests, managing warehousing and fulfillment, advertiser relations and customer support infrastructure. Setting up direct sales like this is new for us, and there are still final tests to do and kinks to iron out to make sure that an order on a website results in an comic in your hand. More news as it progresses! Be sure to warn us ahead of time on how to order our copies. I don’t want to be the only one without one. Sign up at getsvk.com! It’s a one-shot email notifier — we’ll let you know as soon as SVK is on sale. It’s mail order only, and you’ll be able to buy it from that same website. (We’re doing our final tests now. The warehousing stuff needs a little ironing out to make sure it all works.) I cant imagine how much of a pain in the ass it is to keep register with the UV ink without using a UV light."
