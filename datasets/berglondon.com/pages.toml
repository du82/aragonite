["https://berglondon.com/blog/2012/11"]
title = "November – 2012 –    BERG"
full_description = "It’s Friday. I wasn’t expecting that… It’s been a busy week. We’ve got demos any minute and so these are some links to give you a five minute break from your work too. This week, Eddie shared a link to a game created for the Norwegian milk company, Litago, which uses players photographs to create playable platforming levels. Phil G shared a Sound Slice, made by Adrian Holovaty, who (co)created Django, and ChicagoCrime.org and EveryBlock. A smooth interface, it lets you annotate guitar videos to help you learn new songs. And Saar shared this a little while ago, but I’ve only just had time to watch it. Dumb ways to die. It’s the three hundred and eighty ninth week since BERG began. Simon Pearson is down to do weeknotes but he is away with Matt Webb at Future London demoing Little Printer so I have swapped with him. Matt Jones is still away on paternity leave looking after two tiny humans. Andy is back after his stint of paternity leave and the studio also welcomes Kari who is back after what seems like a very long time away after her case of The Babies. Paiute work continues. Pawel has done some very slick looking graphics for it, Denise even did a weird squeal when she saw them (a pretty good sign). Jack continues to shepherd this project to it’s conclusion which I hope won’t be too soon because that possibly means Pav will have to go on to another contract in another place. And if Pav goes then who is going to get the pardy started? BERG Cloud and Little Printer are very close to shipping indeed. I am putting the final flourishes to the front-end, James is getting his head into logging for the many bridges that will soon be connecting, Simon is coordinating factories and shipping containers, Helen and Kari are preparing themselves to give the best damned customer service this side of Newspaper Club, Alex is sending me the kind of ‘could this be two pixels lower, please, sorry, thanks’ emails that I know mean our remote site is going to look really good. Nick is lining up interviewees for the position of The Next James Darling. If you think you fill this spot, head over here for more information."
