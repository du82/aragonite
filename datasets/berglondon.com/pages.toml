["https://berglondon.com/blog/2013/02"]
title = "February – 2013 –    BERG"
full_description = "This week the room is busy again, following a week of absences due to fungus and bacteria as well as a bunch of traveling around. There is much talk of afterschool club and Saturday’s hackday. Alice and Simon are preparing the studio for forty people, we’ve been told to defrag our work places, and resolve any complex desk landscapes. Alice is also on the refactoring-dev-tools-for-bergcloud hamster wheel. I am told there are many tools, and much tippy tappy is required in order to refactor them. Simon is back from holiday and spinning up his brain following a week of sanfranhangovers. Jones is curating a blog post discussing some work from a couple of years back that we’re able to show. Nick and Joe are doing some fun wrangling with Unity for Kemp, and some hardware experiments with the iPhone. I have spent twenty minutes trying to sign into WordPress and will now be doing the same for other web based workplaces. At the beginning of 2011 we started a wide-ranging conversation with Google Creative Lab, discussing near-future experiences of Google and its products. We’ve already discussed our collaboration on “Lamps”, the conceptual R&D around computer vision in a separate post. They had already in mind another brief before approaching us, to create a physical product encapsulating Google voice/video chat services. For six months through the spring and summer of 2011, a multidisciplinary team at BERG developed the brief based on research, strategic thinking, hardware and software prototyping into believable technical and experiential proof of a product that could be taken to market. It’s a very different set of outcomes from Lamps, and a different approach – although still rooted in material exploration, it’s much more centred around rapid product prototyping to really understand what the experience of physical device, service and interface could be. As with our Lamps post, I’ve broken up this long report of what was a very involving project for the entire studio."
