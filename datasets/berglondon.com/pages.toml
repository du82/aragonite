["https://berglondon.com/blog"]
title = "Blog –    BERG"
full_description = "This will be the last blog post on this site. To continue to receive updates from BERG, including Week Notes, please update your bookmarks. The address of the BERG Cloud blog RSS feed is http://bergcloud.com/feed. We’re also making some exciting announcements today. You can read all about BERG Cloud becoming available for everyone. Sad news folks, in order to preserve sanity and attention we have to shut the SVK shop. The good news is we’re running a half price sale on our remaining copies! The shop will close at midnight GMT on October 31st and SVK will be £5 plus postage and packaging. Get em while you can! SVK is a collaboration between writer Warren Ellis (Transmetropolitan, Planetary, Gun Machine, RED), artist Matt Brooker (Stickleback, Lazarus Churchyard, 2000AD) and BERG. You can pick one up at the SVK shop. Thanks to all involved in getting SVK into the world, it was a massive privilege to have made a comic, especially with Warren and Matt. And as a lovely thing to end on here is a beautiful video Timo shot when we got it printed and his write up. An incredibly terse set of weeknotes, as we’re all busy bees this week. In no particular order (actually its the order we sat round the table): JS – Chaco KS – Prep for MW’s return NL & ASJ – Sockets MC – Sinawava DB & TH – Chaco PG – Various LP Publications DF – Chaco NU – Chaco LM – Animations; More 2D than 3D DW – Cloudy Wireframes AJ – Exhibitions & Sinawava HR – Backdated company admin FL – Zendesk & gathering LPs from the globe JM – Sinawava wireframes AH – Devkits & supply chain “I don’t know why I find pictures of robots so exciting, but I do” – is a conversation I can hear going on right now. This week the studio is excited about film special effects and Grand Theft Auto 5. I am trying not to get sucked into a conversation about Breaking Bad. Don’t tell me. Little Printer ASJ / NL: New Little Printer back end stuff, fixing bugs, finishing web sockets and generally making everything better. AJ: Getting a stand ready for Future Fest AB: Getting ready to go to xoxo in Portland. (Are you going too? Make sure you look after Alice and say hello. She has Little Printer badges.) DW: IA, planning and writing."
