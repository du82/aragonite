["https://berglondon.com/projects/how-many-really"]
title = """
Dimensions: How Many Really – Projects - 
  BERG"""
full_description = "Howmanyreally.com is the second public prototype to come from our “Dimensions” work with the BBC, finding new ways to communicate history and current affairs with interactive visulations. It launched in September 2011. It uses the size of your social network as a comparison to the numbers of people involved in historical events or current news stories, to help convey size of the groups involved. Much like its sister prototype in the BBC Dimensions series – “How Big Really?” – it seeks to ground difficult-to-conceive quantities in personal experience. Based on feedback the prototype receives it may be integrated into future BBC digital storytelling tools, and is designed and developed with that in mind."
