["https://berglondon.com/blog/tag/weeknotes"]
title = "weeknotes –    BERG"
full_description = "An incredibly terse set of weeknotes, as we’re all busy bees this week. In no particular order (actually its the order we sat round the table): JS – Chaco KS – Prep for MW’s return NL & ASJ – Sockets MC – Sinawava DB & TH – Chaco PG – Various LP Publications DF – Chaco NU – Chaco LM – Animations; More 2D than 3D DW – Cloudy Wireframes AJ – Exhibitions & Sinawava HR – Backdated company admin FL – Zendesk & gathering LPs from the globe JM – Sinawava wireframes AH – Devkits & supply chain “I don’t know why I find pictures of robots so exciting, but I do” – is a conversation I can hear going on right now. This week the studio is excited about film special effects and Grand Theft Auto 5. I am trying not to get sucked into a conversation about Breaking Bad. Don’t tell me. Little Printer ASJ / NL: New Little Printer back end stuff, fixing bugs, finishing web sockets and generally making everything better. AJ: Getting a stand ready for Future Fest AB: Getting ready to go to xoxo in Portland. (Are you going too? Make sure you look after Alice and say hello. She has Little Printer badges.) DW: IA, planning and writing. Chaco DF / DB / JS / NU / TH are all working on this. There’s a lot going on and it’s looking really nice. (I can say that without boasting as it’s nothing to do with me.) MC is overseeing things from one side, and DF has the other side covered. Sinawava AJ / JM are working hard on various aspects of this. Laurence is still with us too – “working on cloth and hair simulation”. This is something that surprised all of us. MC is overseeing things here too. Pretending to be Matt and Helen MW and HR are both away this week. We have JS covering in their absence and he seems to be doing quite well. We’ll never tell him though, it just goes to his head. KS is also working on this, doing a sterling job of email wrangling, so that MW doesn’t drown on his return. Another four day week for #429 as we were all off yesterday enjoying the sunny Bank Holiday Monday. The 429 is a bus that goes from Crockenhill to my home town of Dartford, or the other way, of course. It’s also the model number of a rare Ford Mustang variant named the Boss 429, which is one of the better looking muscle cars. Oh, and a Bell 429 Helicopter, which is less interesting."
