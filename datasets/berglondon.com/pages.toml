["https://berglondon.com"]
title = "BERG"
description = """
previous        next                      Making Future Magic              BERG was commissioned by Dentsu London, the creative communications agency, to explore the theme of 'Making Future Magic'."""
full_description = '''BERG was commissioned by Dentsu London, the creative communications agency, to explore the theme of 'Making Future Magic'. Schooloscope turns official government data about schools into easy-to-read English, and smiling faces. Olinda is a prototype digital radio that has your social network built in, showing you the stations your friends are listening to. It’s customisable with modular hardware, and aims to provoke discussion on the future and design of radios for the home. The Incidental is a socially-constructed map, newspaper and souvenir. A feedback loop made out of paper and human interactions - timebound, situated and circulating in a place, reprinted every night. Little Printer lives in your home, bringing you news, puzzles and gossip from your friends. Use your smartphone to set up subscriptions and Little Printer will gather them together to create a timely, beautiful mini-newspaper. Shownar tracks online buzz around BBC TV and radio programmes, highlighting shows that are surprisingly popular, and conversations on blogs and Twitter. Mag+ is an approach for bringing paper magazines to digital media, with a special focus on touchscreen tablets. With the BBC, BERG created howbigreally.com, which takes historically or culturally important events (like the 2010 Pakistan floods), and makes them human-scale by putting them over a map of your neighbourhood. Media Surfaces explores a universe next door in which media travels freely onto familiar surfaces in everyday life. This film is a collaboration with Dentsu London. "Clocks" is a speculation on the coming robot-readable world where the technology of computer vision is widespread. It acts as dynamic signage for computers. It is an object that signals both time and place to artificial eyes. Here & There is a project by BERG exploring speculative projections of dense cities. These maps of Manhattan look uptown from 3rd and 7th, and downtown from 3rd and 35th. They're intended to be seen at those same places, putting the viewer simultaneously above the city and in it where she stands, both looking down and looking forward. Prints from a limited run are available for purchase.'''
