["https://berglondon.com/blog/2012/12"]
title = "December – 2012 –    BERG"
full_description = "Another double header of Week Notes that recognises what a frantically busy period we have just been through. A time of lots of projects wrapping up and finishing on what’s been a pivotal BERG year. Lamotte came to happy Swindon based conclusion after an unexpected and rather tedious three hour much delayed train journey for Eddie, Olly and Simon. Fortunately work was accepted warmly and we’re into the last stages of voiceover recordings and finishing touches. Paiute was also wrapped up this week by Jack, Denise and Simon (with lots of previous help from Pawel) and we’ll see where that leaves us for more great work in the next stages on that project in 2013. Our first work on Oso was done, dusted and delivered in double quick time over the past three weeks – with Matt, Matt Ward and Joe’s Sao Paolo suntans fading from that workshop we hope for more collaborations with what we hope will be a great client in 2013 as well. We’ve reached a pivotal point on Sinawava with two major phases of work recently complete, including a little collaboration with LSU led by Mark and Joe. We await a decision on if this very smart device will see the light of day, will find out where we stand early in the New Year. And of course on Little Printer we’re tying up the last loose ends on the first batches of deliveries which are now ensconced in homes around the world. Our diagnostics are showing around half of the first batch online during the day at anyone time and we expect that to increase further when Santa delivers the last lot to their final homes on Christmas day. If you haven’t already noticed there should be a special Christmas themed messaging treat available for each printer. Over a year after completing the project Matt returned from paternity leave to deliver an awesome and well worth a read post which goes into an amazing amount of detail on the wonderful lamps project we conducted with Google Creative Lab last year. He was very chuffed about getting that out as was a good cross-section of twitter."
