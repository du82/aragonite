["https://berglondon.com/blog/2013/06"]
title = "June – 2013 –    BERG"
full_description = "We’ve all been so busy that Week 419 has been lost to history. No one knows what happened then or if it even existed, much like the money in those similarly numbered scams. Mark is getting addicted to the Cryptic Crossword as well as doing some more wrangling for Sinawava, which Joe and Laurence are doing a lot of drawing and other work for. Kari has been tackling ZenDesk enquiries, sending paper off to hungry LPs and a multitude of other things. Phil is cranking out more publications including one for Eventbrite and making it easy for others to make charts on LP. Andy has been in Italy at Fabrica for the first Sandbox workshop and learning to make Limoncello which I hope makes it back here. I’ve been getting the supporting web side of the BERG Cloud developer tools to a point where they can be used in the Sandbox. Nick has been testing the tools out by building a small project as well as spending some time on some iOS app work. Alice is continuing to improve on Remote and LP deliveries both visibly and in many hidden but important details. And finally Alex and Denise have decided to become developers as well as designers and are doing some work with Processing, Alex has also found time to make a couple of very fun publications for children. I can’t remember how this came up over lunch, but it turns out there’s a horror movie about QR codes that re-program your mind to not see them. Or something. Here’s the trailer. The big news of the week – apart from the fact our governments are spying on everything – was the reveal of iOS 7, with lots of pretty pastels replacing the photorealistic textures that used to dominate the user interface. Even the BBC ran an article called What is skeuomorphism (with a few quotes from yours truly). Remote control toy cars, all driven by Bluetooth from the phone, all independently steering themselves with artificial intelligence? What’s not to like. The New Aesthetic: James Bridle’s Drones and Our Invisible, Networked World, at Vanity Fair. Awesome to see multiple friends-of-BERG (including our own Matt Jones) in a brilliant and well-deserved profile of James. Says Bridle: “It’s the thing we’re living inside, and I’m keeping an eye on it.”"
