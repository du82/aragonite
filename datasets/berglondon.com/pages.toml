["https://berglondon.com/blog/2013/03"]
title = "March – 2013 –    BERG"
full_description = "The term regeneration (also known as renewal), in the British science fiction television series Doctor Who, is a biological ability exhibited by Time Lords, a race of fictional humanoids originating on the planet Gallifrey. This process allows a Time Lord who is old or mortally wounded to undergo a transformation into a new physical form and a somewhat different personality. Yesterday and today we’ve been moving into what will be the 7th BERG office (counting S&W’s premises and our secret spin-office, BERG#9) – it’s my fourth. A bit like Doctor Who’s different incarnations, while still the same company, the spaces we’ve worked in have created very different feeling BERGs. And, a bit like Doctor Who, I guess you have one incarnation that you always think is the best, or ‘yours’. 115 Bartholomew Road Jack and Matt worked together first of all in 115 Bartholomew Road, Kentish Town. I visited their space a couple of times while they worked on projects for me and Chris Heathcote at Nokia. Hewett Street Hewett St saw S&W move to London’s fashionable Shoreditch, just before Matt Biddulph jokingly dubbed it “Silicon Roundabout”. It saw the beginning of our habitual co-habiting with RIG and Newspaper Club. It was also where I started working more formally with Jack and Matt as an advisor while I spent most of my time on Dopplr. “Sh*t Office” I’m sure it’s a coincidence, but my joining full-time coincided with us moving to a tiny room, heated by a sunlamp, at the less-than-salubrious end of Scrutton Street. It was quickly dubbed “Sh*t Office”. Matt Brown joined us, as did Nick Ludlam. The BRIG We moved, with RIG to the other end of Scrutton Street, to a floor of a former printing company that quickly became known as The Brig. We had a bit more room to work and make, we were able to customise the space modestly and this space was really where BERG started to fire on all cylinders IMHO. I think, like Tom Baker is “my” Doctor, this version of the BERG space feels like the one I’ll remember most fondly…"
