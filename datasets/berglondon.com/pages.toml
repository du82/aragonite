["https://berglondon.com/blog/2013/05"]
title = "May – 2013 –    BERG"
full_description = "The 415 runs from Tulse Hill station to Elephant & Castle, it is also the name of a hostel in Bulgaria and a German type VIIC U-boat famous for nearly sinking the HMS Hurricane. The 2nd Little Printer run is rolling on and Helen has been steering the good ship, ensuring the various parts don’t lose momentum. It’s a good chance to review the processes involved in bringing it into the world. Matthew was out in various meetings and interviews. For the most part discussing this and latterly this. Mark’s been involved in such things too, among myriad other avenues of exploration. Neil and I have been wrapping up some of the finer details of Kachina in time for delivery to the first recipient. Neil’s also been working on an as-yet-un-code-named project with Jack: much sketching. I’ve also been working with Phil W. on the BERGCloud hardware dev tools and doing some specific factory wrangling. The illustrious Adam and Alice have been making some obvious and some less obvious improvements to remote and the BERG Cloud infrastructure in general. Nick’s been on that too, as well as prepping for some upcoming talks. Fraser and Kari have been fielding Zendesk curveballs and shipping out our paper refills. By the end of the week, Phil had was able to show us some of the cracking publication work he’s been doing (and you can see some of it too) at our delightful cheese and wine demos. See? Joe and Denise have been working on another Uinta project which has been coming on nicely, and Denise is also collating interesting family-based uses of Little Printer. If you’ve any stories you’d like to share then please get in touch. Very late weeknotes. Alice was on holiday last week but I fear I’d have been told off if she was around. Although, strangely it’s easier to write a summary of the week once it’s finished. So what’s been going on? Like a tiny army we carried a fair few (read: lots) of wrapped, stickered and sealed Here & There maps to the Post Office across windy Old Street to send on their ways, near and far. (There’s still some available, if you like that sort of thing). Helen wins employee of the week for some extraordinary Post Office endurance."
