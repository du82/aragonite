["https://berglondon.com/projects/magplus"]
title = """
Mag+ – Projects - 
  BERG"""
full_description = "BERG were approached by Bonnier R&D in October 2009 to help concept and prototype digital magazines for the then-forthcoming next-generation of digital media tablets. The goal was to create something as satisfying as their paper forebears, which research reveals possess an extraordinary degree of engagement and attachment amongst all other media. We created a conceptual prototype in video that was made public in December 2009, and with the announcement of the Apple iPad on the 27th January 2010, we begun a rapid implementation of the concept – resulting in the first magazine on the Mag+ platform, (Popular Science, as PopSci+) being available in Apple’s AppStore for the US-launch of the iPad just over two months later on 3rd April, 2010 Bonnier developed a set of experience principles from their research, which formed the basis of our brief as we workshopped concepts with them at their Stockholm headquarters. Material exploration of a wide range of Bonnier’s magazine content in conjunction with their experience principles as a frame led to initial sketches and video sketches. We developed a number of different initial approaches to the reading experience – such as the following experiment, where a long-form magazine article is deconstructed into a serial experience for ease of reading on a small screen. This was very fast, low-fidelity sketching to interrogate the various intuitions we had. We literally taped the pieces of magazine together in a line, hung them from a door frame and then videoed it with an Apple iPhone, which then we viewed the results on – to get a very, very rough feel of what it might feel like on a hand-held device. From these more high-level strategic design ideas, we developed the interaction design concepts using video prototypes: motion graphics and live-action film based on gesture-based interaction ideas that could be critiqued as believable near-future media artifacts. Video prototyping in this way also reveals much about the acceptable timings and rhythms of interactions – allowing tuning of the experience that would become invaluable in the later realisation of the project."
