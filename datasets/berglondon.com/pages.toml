["https://berglondon.com/projects/olinda"]
title = """
Olinda – Projects - 
  BERG"""
full_description = "Six lights on Olinda show when a close friend is listening to the radio, using wifi and Radio Pop, the BBC’s website for sharing ‘now playing’ information. Each light is a button: you can tune in to listen along with them, discovering new stations via your social network. A friend will always appear at the same light, so you can write or draw on the radio to label it, and the lights are bright so you’ll know a friend has started listening from across the room. Olinda includes a connector on the side to allow for all kinds of extra modules adding functionality to the base radio, and – because the interface is simple – home adaptation too. On the Web, users are in charge of customising and adapting their experience. Key to this are the programmer interfaces offered by services such as Flickr that allow third party developers to create and sell new applications to add functionality. Similar interfaces exist in physical products, like the iPod dock connector enabling a market of peripherals adding value to the iPod itself. But this is rare. On the Web, the simplicity and openness of interfaces has led to widespread use, including widgets and content syndication. Olinda attempts to learn from this. Its hardware interface already joins the base unit with the friends module. By buying extra modules – or by making their own using the open interface – listeners can adapt their product over time, perhaps adding a remote control or recording. The Olinda pamphlet gives a few ideas of where this might be taken. The hardware interface is made a feature with sprung copper connectors, and magnets mounted in rounded guides pull the modules together to a solid whole. It’s kept visible behind a clear, orange cap, and begs to be used. Olinda has two dials to tune: the outer scroll stations alphabetically; the inner one scrolls only your most listened. (That’s another lesson from the Web: we like that Web browsers autocomplete those addresses you’ve visited before so you don’t have to type the whole thing again. Likewise, why should a listener configure station presets when the radio already knows their listening habits?)"
year_published = 2025
