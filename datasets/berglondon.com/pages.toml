["https://berglondon.com/projects/the-incidental"]
title = """
The Incidental – Projects - 
  BERG"""
full_description = "BERG worked as part of the team producing a unique service for the world’s biggest furniture and design event: Salone del Mobile in Milan 2009. The British Council usually maintains a presence there, promoting British design and designers through an exhibition. That year, they had decided they would rather present some kind of service offering rather than a physical exhibition in a single venue. Daniel Charny, of Fromnowon contacted us early on in the project, when they were moving the traditional thinking of staging an exhibition of to something that was more alive, distributed and connected to the people visiting Salone from Britain whilst also connecting those around the world who couldn’t be there. From the early brainstorms we came up with idea of a system for collecting the thoughts, recommendations, pirate maps and sketches of the attendees to republish and redistribute the next day in a printed, pocketable pamphlet, which, would build up over the four days of the event to be a unique palimpsest of the place and people’s interactions with it, in it. Åbäke, a collective of graphic designers who came up with the look and identity of the finished publication, alongside a team from the British Council ventured out to Milan to establish a temporary production studio for The Incidental, while BERG provided remote support from the UK and the technology to harvest the Twitter updates, blog mentions and Flickr photos to be included in the edition, overlaid on the map to be produced overnight. This rapidly-produced thing then becomes a ’social object’: creating conversations, collecting scribbles, instigating adventures – which then get collected and redistributed. “…cheap. Portable. Biodegradable/timebound/already rotting. Suggestion of a v0.9 object. More likely to be on a desk or in a pocket or bag or on a pub table than to be shelved. More likely to be passed around.” The Incidental is feedback loop made out of paper and human interactions – timebound, situated and circulating in a place."
