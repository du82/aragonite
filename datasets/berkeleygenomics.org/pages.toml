["https://berkeleygenomics.org/articles/Potential_perils_of_germline_genomic_engineering.html"]
title = "Potential_perils_of_germline_genomic_engineering"
full_description = "Human germline genomic engineering would enable parents to choose to endow their children with any of a wide variety of traits: from exceptional health, lifespan, wellbeing, and cognitive capacity; to, potentially, personality traits, political leanings, and social dispositions. The enormity of the potential benefits is self-evident, and begs for speedy development of the technology. Because germline engineering (GE for short) will have such strong and wide-ranging effects, it also comes with many perils—many possible bad outcomes in various spheres of life. In order to decide wisely about the development and application of GE technology, this article describes possible bad outcomes caused by GE. The rest of this Introduction section describes in more detail the aim and structure of this article; the following sections, starting with “Unnaturalness”, list perils of GE. Human germline genomic engineering creates human children with genomes that have been vectored in some way. The two broad types of genomic vectoring are multiplex genetic editing and genomic selection. Genetic editing targets several genetic loci and modifies the DNA at those loci, generally via some CRISPR-Cas9 system, either swapping, adding, or deleting one or more base pairs. Genomic selection assembles a haploid or diploid genome from subsegments of one or more genomes by some process other than natural gametogenesis and fertilization, where segments that score highly on a polygenic score (PGS) are favored. In general, both of these genomic vectoring methods aim to create genomes that are nearly indistinguishable from natural human genomes, except that they score highly on some combination of PGSes. This article does not focus on perils from other kinds of germline engineering, e.g. genome vectoring that incorporates transgenic or synthetic DNA into human genomes. If we consider creating a world-changing technology, we have an obligation and an intrinsic desire to apply precautionary foresight. Precautionary foresight looks ahead to the plausible future worlds that involve a manifestation of the novel technology, and then notices harms to individuals and to society that come from the technology in those possible futures."
year_published = 2025
clearnet = "https://berkeleygenomics.org/articles/Potential_perils_of_germline_genomic_engineering.html"
