["https://berkeleygenomics.org/articles/How_many_human_genomes_have_been_sequenced_.html"]
title = "How_many_human_genomes_have_been_sequenced_"
full_description = "In the past two decades, DNA sequencing has become a massive and central source of biological data. Human data in particular has exploded in quantity. Before the millenium, we could read little bits of our own source code, painstakingly; as of 2025, we can survey hundreds of thousands of whole human genomes and tens of millions of human genotype thumbnails (SNP arrays). This article will give the broad outlines of this story in data. How much data do we have today? How diverse is the data? Who’s collecting it? What are we learning from it? In 1953, Watson and Crick uncovered the structure of DNA. The natural next thing to do was to start reading the sequences of nucleotides that make up DNA. For the rest of the 20th century, though, DNA sequencing was laborious and expensive. Studies in the 80s and 90s focused on small portions of DNA such as single genes or gene complexes. In 1995, Craig Venter’s team sequenced the genome of the Haemophilus influenzae bacterium, at 1.8 million base pairs, making it the first (non-virus) organism to be fully sequenced. The 21st century (which of course started in the 1990s with the eruption of the Internet) saw DNA sequencing go full scale. In 2000, after a decade of work, the Human Genome Project announced the completion of the first draft sequence of a complete human genome. That genome comprises roughly 3 billion pase pairs, assembled by putting together in order many short reads of DNA taken from several different people. All told, including related research, the project cost $2.7 billion; to sequence another single whole human genome with the same method would have cost hundreds of millions of dollars and taken about a year. A decade and a bit later, in 2012, the 1000 Genomes Project announced that they’d sequenced 1092 whole genomes, likely at a cost of around $120 million. One more decade later, in 2023, the UK Biobank announced that they’d sequenced the whole genomes of their nearly 500,000 participants, likely at a cost of around $200 million. Roughly speaking, DNA sequencing got 1000x less costly in 10 years, twice in a row."
year_published = 2025
clearnet = "https://berkeleygenomics.org/articles/How_many_human_genomes_have_been_sequenced_.html"
