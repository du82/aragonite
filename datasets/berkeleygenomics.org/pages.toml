["https://berkeleygenomics.org/articles/Methods_for_strong_human_germline_engineering.html"]
title = "Methods_for_strong_human_germline_engineering"
full_description = "This article summarizes the technical pathways to make healthy humans with significantly modified genomes. These are the pathways that I’m aware of and that seem plausibly feasible in the next two decades. A short summary, in a diagram: Reproductive genomic vectoring explains the general idea of human germline genomic engineering, and distinguishes editing and selection. Comparing editing and selection talks about general differences between the two kinds of genomic vectoring methods. Reproductive GV and epigenomic correctness (EC), Methods to handle epigenomic correctness, and How GV and EC interact discuss the epigenomic correctness problem in germline engineering—what it is, why it matters, and how to address it. Summary of genomic vectoring methods gives an annotated table of contents for the following Methods sections. The Methods sections—on Simple embryo selection, Gamete selection, Chromosome selection, Iterated recombinant selection, and Iterated multiplex CRISPR editing—give more detail about each genomic vectoring method: what it is, obstacles, variations, and how powerful it is. The appendices give additional technical information, if you’re looking around and saying “I’m not in the weeds enough, I want to be more in the weeds.”. The list of specific methods that this table summarizes starts after the section Summary of genomic vectoring methods. This article is roughly organized from general to specific, first discussing things that apply to the whole area, and then later discussing specific methods. I won’t lie, this article book is a bit of a slog. You try writing a book about the state of the art of realistic germline engineering in a way that is automatically fun, and then get back to me, ok? But listen: There’s lots of pictures, and some of them are good pictures. You could just skim through and look at the pictures, and then read more if there’s something you really want to know. If you’re looking for mathy stuff, or you just want to hear about the genomic vectoring methods, start here. Also, if you have some sort of oomph you might put into this (such as brainpower or moneypower), or if you’re up for a recorded and published conversation, you can message me or email me, and I’ll talk you through this stuff. Gmail address: berkeleygenomicsproject"
year_published = 2025
