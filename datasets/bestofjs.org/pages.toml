full_description = "freeCodeCamp.org's open-source codebase and curriculum freeCodeCamp.org is a friendly community where you can learn to code for free. It is run by a donor-supported 501(c)(3) charity to help millions of busy adults transition into tech. Our community has already helped more than 40,000 people get their first developer job. Our full-stack web development and machine learning curriculum is completely free and self-paced. We have thousands of interactive coding challenges to help you expand your skills. Table of Contents Certifications The Learning Platform Reporting Bugs and Issues Reporting Security Issues and Responsible Disclosure Contributing Platform, Build and Deployment Status License Certifications freeCodeCamp.org offers several free developer certifications. Each of these certifications involves building 5 required web app projects, along with hundreds of optional coding challenges to help you prepare for those projects. We estimate that each certification will take a beginner programmer around 300 hours to earn. Each of these 50 projects in the freeCodeCamp.org curriculum has its own agile user stories and automated tests. These help you build up your project incrementally and ensure you've fulfilled all the user stories before you submit it. You can pull in these test suites through freeCodeCamp's CDN. This means you can build these projects on websites like CodePen and Replit - or even on your local computer's development environment. Once you've earned a certification, you will always have it. You will always be able to link to it from your LinkedIn or resume. And when your prospective employers or freelance clients click that link, they'll see a verified certification specific to you. The one exception to this is if we discover violations of our Academic Honesty Policy. When we catch people unambiguously plagiarizing (submitting other people's code or projects as their own without citation), we do what all rigorous institutions of learning should do - we revoke their certifications and ban those people. Here are our twelve core certifications: 1. Responsive Web Design Certification Learn HTML by Building a Cat Photo App Learn Basic CSS by Building a Cafe Menu Learn CSS Colors by Building a Set of Colored Markers Learn HTML Forms by Building a Registration Form Learn the CSS Box Model by Building a Rothko Painting Learn CSS Flexbox by Building a Photo Gallery Learn Typography by Building a Nutrition Label Learn Accessibility by Building a Quiz Learn More About CSS Pseudo Selectors by Building A Balance Sheet Learn Intermediate CSS by Building a Picasso Painting Learn Responsive Web Design by Building a Piano Learn CSS Variables by Building a City Skyline Learn CSS Grid by Building a Magazine Learn CSS Transforms by Building a Penguin Learn CSS Animations by Building a Ferris Wheel Projects: Survey Form, Tribute Page, Technical Documentation Page, Product Landing Page, Personal Portfolio Webpage 2. JavaScript Algorithms and Data Structures Certification Learn Introductory JavaScript by Building a Pyramid Generator Learn Basic JavaScript by Building a Role Playing Game Learn Form Validation by Building a Calorie Counter Learn Basic String and Array Methods by Building a Music Player Learn the Date Object by Building a Date Formatter Learn Modern JavaScript Methods By Building Football Team Cards Learn localStorage by Building a Todo App Learn Recursion by Building a Decimal to Binary Converter Learn Basic Algorithmic Thinking by Building a Number Sorter Learn Advanced Array Methods by Building a Statistics Calculator Learn Functional Programming by Building a Spreadsheet Learn Regular Expressions by Building a Spam Filter Learn Basic OOP by Building a Shopping Cart Learn Intermediate OOP by Building a Platformer Game Learn Intermediate Algorithmic Thinking by Building a Dice Game Learn Fetch and Promises By Building an fCC Authors Page Learn Asynchronous Programming by Building an fCC Forum Leaderboard Projects: Palindrome Checker, Roman Numeral Converter, Telephone Number Validator, Cash Register, Pokémon Search App 3. Front End Libraries Certification Bootstrap jQuery Sass React Redux React and Redux Projects: Random Quote Machine, Markdown Previewer, Drum Machine, JavaScript Calculator, 25 + 5 Clock 4. Data Visualization Certification Data Visualization with D3 JSON APIs and Ajax Projects: Bar Chart, Scatterplot Graph, Heat Map, Choropleth Map, Treemap Diagram 5. Relational Database Learn Bash by Building a Boilerplate Learn Relational Databases by Building a Mario Database Learn Bash Scripting by Building Five Programs Learn SQL by Building a Student Database: Part 1 Learn SQL by Building a Student Database: Part 2 Learn Advanced Bash by Building a Kitty Ipsum Translator Learn Bash and SQL by Building a Bike Rental Shop Learn Nano by Building a Castle Learn Git by Building an SQL Reference Object Projects: Salon Appointment Scheduler, Celestial Bodies Database, Periodic Table Database, Number Guessing Game, World Cup Database 6. Back End Development and APIs Certification Managing Packages with Npm Basic Node and Express MongoDB and Mongoose Projects: Timestamp Microservice, Request Header Parser, URL Shortener, Exercise Tracker, File Metadata Microservice 7. Quality Assurance Certification Quality Assurance and Testing with Chai Advanced Node and Express Projects: Metric-Imperial Converter, Issue Tracker, Personal Library, Sudoku Solver, American British Translator 8. Scientific Computing with Python Certification Learn String Manipulation by Building a Cipher Learn How to Work with Numbers and Strings by Implementing the Luhn Algorithm Learn Lambda Functions by Building an Expense Tracker Learn List Comprehension by Building a Case Converter Program Learn the Bisection Method by Finding the Square Root of a Number Learn Regular Expressions by Building a Password Generator Learn Algorithm Design by Building a Shortest Path Algorithm Learn Recursion by Solving the Tower of Hanoi Puzzle Learn Data Structures by Building the Merge Sort Algorithm Learn Classes and Objects by Building a Sudoku Solver Learn Tree Traversal by Building a Binary Search Tree Learn Special Methods by Building a Vector Space Projects: Arithmetic Formatter, Time Calculator, Budget App, Polygon Area Calculator, Probability Calculator 9. Data Analysis with Python Certification Data Analysis with Python Course NumPy Projects: Mean-Variance-Standard Deviation Calculator, Demographic Data Analyzer, Medical Data Visualizer, Page View Time Series Visualizer, Sea Level Predictor 10. Information Security Certification Information Security with HelmetJS Python for Penetration Testing Projects: Stock Price Checker, Anonymous Message Board, Port Scanner, SHA-1 Password Cracker, Secure Real Time Multiplayer Game 11. Machine Learning with Python Certification TensorFlow How Neural Networks Work Projects: Rock Paper Scissors, Cat and Dog Image Classifier, Book Recommendation Engine using KNN, Linear Regression Health Costs Calculator, Neural Network SMS Text Classifier 12. College Algebra with Python Learn Ratios and Proportions Learn How to Solve for X Learn Fractions and Decimals Learn Functions and Graphing Learn Linear Functions Learn Common Factors and Square Roots Learn How to Graph Systems of Equations Learn How to Solve Systems of Equations Learn Applications of Linear Systems Learn Quadratic Equations Learn Parent Graphs and Polynomials Learn Business Applications of College Algebra Learn Simple and Compound Interest Learn Exponents and Logarithms College Algebra with Python: Conclusion Projects: Multi-Function Calculator, Graphing Calculator, Three Math Games, Financial Calculator, Data Graph Explorer Legacy Full Stack Development Certification Once you have earned the Responsive Web Design, Algorithms and Data Structures, Front End Development Libraries, Data Visualization, Back End Development and APIs, and Legacy Information Security and Quality Assurance certifications, you'll be able to claim your freeCodeCamp.org Full Stack Development Certification. This distinction signifies that you've completed around 1,800 hours of coding with a wide range of web development tools. Legacy Certifications We also have 4 legacy certifications dating back to our 2015 curriculum, which are still available. All of the required projects for these legacy certifications will remain available on freeCodeCamp.org. Legacy Front End Development Certification Legacy Data Visualization Certification Legacy Back End Development Certification Legacy Information Security and Quality Assurance Certification Free professional certifications (New) Foundational C# with Microsoft Write Your First Code Using C# Create and Run Simple C# Console Applications Add Logic to C# Console Applications Work with Variable Data in C# Console Applications Create Methods in C# Console Applications Debug C# Console Applications Exam: Foundational C# with Microsoft Certification Exam The Learning Platform This code is running live at freeCodeCamp.org. Our community also has: A forum where you can usually get programming help or project feedback within hours. A YouTube channel with free courses on Python, SQL, Android, and a wide variety of other technologies. A technical publication with thousands of programming tutorials and articles about mathematics and computer science. A Discord server where you can hang out and talk with developers and people who are learning to code. Join the community here. Reporting Bugs and Issues If you think you've found a bug, first read the how to report a bug article and follow its instructions. If you're confident it's a new bug and have confirmed that someone else is facing the same issue, go ahead and create a new GitHub issue. Be sure to include as much information as possible so we can reproduce the bug. Reporting Security Issues and Responsible Disclosure We appreciate responsible disclosure of vulnerabilities that might impact the integrity of our platforms and users. Read our security policy and follow these steps to report a vulnerability. Contributing The freeCodeCamp.org community is possible thanks to thousands of kind volunteers like you. We welcome all contributions to the community and are excited to welcome you aboard. Please follow these steps to contribute. Recent Contributions: Platform, Build, and Deployment Status The general platform status for all our applications is available at status.freecodecamp.org. The build and deployment status for the code is available in our DevOps Guide. License Copyright © 2025 freeCodeCamp.org The content of this repository is bound by the following licenses: The computer software is licensed under the BSD-3-Clause license. The learning resources in the /curriculum directory including their subdirectories thereon are copyright © 2025 freeCodeCamp.org"
