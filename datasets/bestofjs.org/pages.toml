full_description = '''You Don't Know JS Yet (book series) - 2nd Edition This is a series of books diving deep into the core mechanisms of the JavaScript language. This is the second edition of the book series: ... To read more about the motivations and perspective behind this book series, check out the Preface. If you're looking for the previous first edition books, they can be found here. Titles I recommend reading the second edition books in this order: Get Started | Buy on Leanpub | Buy on Amazon Scope & Closures | Buy on Leanpub | Buy on Amazon Objects & Classes (draft stable) Types & Grammar (draft in progress) Sync & Async (not yet started) ES.Next & Beyond (not yet started) If you're looking for the previous first edition books, they can be found here. Publishing As always, you'll be able to read these books online here entirely for free. This edition of the books is being self-published through GetiPub publishing. The published books will be made available for sale through normal book retail sources. If you'd like to contribute financially towards the effort (or any of my other OSS efforts) aside from purchasing the published books, please consider these options: Github Sponsorship Patreon Paypal Contributions Please feel free to contribute to the quality of this content by submitting PRs for improvements to code snippets, explanations, etc. While typo fixes are welcomed, they will likely be caught through normal editing/publishing processes, so please don't worry about them right now. Any contributions you make to this effort are of course greatly appreciated. But PLEASE read the Contributions Guidelines carefully before submitting a PR. Thank You To These Wonderful Sponsors The first two books of the second edition are exclusively sponsored by Frontend Masters. Frontend Masters is the gold standard for top-of-the-line expert training material in frontend-oriented software development. With over 150 courses on all things frontend, this should be your first and only stop for quality video training on HTML, CSS, JS, and related technologies. Note: I teach all my workshops exclusively through Frontend Masters. If you like this book content, please check out my video training courses. I want to extend a warm and deep thanks to Marc Grabanski and the entire Frontend Masters team, not only for their excellent work with the video training platform, but for their unwavering support of me and of the "You Don't Know JS" books! License & Copyright The materials herein are all © 2019-2022 Kyle Simpson. This work is licensed under a Creative Commons Attribution-NonCommercial-NoDerivs 4.0 Unported License.'''
