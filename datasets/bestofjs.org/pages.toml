["https://bestofjs.org/projects/drizzle-orm"]
title = "Best of JS • Drizzle ORM"
description = "Trends and data about Drizzle ORM project. TypeScript ORM for SQL"
full_description = "Headless ORM for NodeJS, TypeScript and JavaScript 🚀 Website • Documentation • Twitter • Discord What's Drizzle? Drizzle is a modern TypeScript ORM developers wanna use in their next project. It is lightweight at only ~7.4kb minified+gzipped, and it's tree shakeable with exactly 0 dependencies. Drizzle supports every PostgreSQL, MySQL and SQLite database, including serverless ones like Turso, Neon, Xata, PlanetScale, Cloudflare D1, FlyIO LiteFS, Vercel Postgres, Supabase and AWS Data API. No bells and whistles, no Rust binaries, no serverless adapters, everything just works out of the box. Drizzle is serverless-ready by design. It works in every major JavaScript runtime like NodeJS, Bun, Deno, Cloudflare Workers, Supabase functions, any Edge runtime, and even in browsers. With Drizzle you can be fast out of the box and save time and costs while never introducing any data proxies into your infrastructure. While you can use Drizzle as a JavaScript library, it shines with TypeScript. It lets you declare SQL schemas and build both relational and SQL-like queries, while keeping the balance between type-safety and extensibility for toolmakers to build on top. Ecosystem While Drizzle ORM remains a thin typed layer on top of SQL, we made a set of tools for people to have best possible developer experience. Drizzle comes with a powerful Drizzle Kit CLI companion for you to have hassle-free migrations. It can generate SQL migration files for you or apply schema changes directly to the database. We also have Drizzle Studio for you to effortlessly browse and manipulate data in your database of choice. Documentation Check out the full documentation on the website. Our sponsors ❤️"
