full_description = "Radix Primitives An open-source UI component library for building high-quality, accessible design systems and web apps. Radix Primitives is a low-level UI component library with a focus on accessibility, customization and developer experience. You can use these components either as the base layer of your design system, or adopt them incrementally. Documentation For full documentation, visit radix-ui.com/primitives/docs. Releases For changelog, visit radix-ui.com/primitives/docs/overview/releases. Contributing Please follow our contributing guidelines. Community Discord - To get involved with the Radix community, ask questions and share tips. Twitter - To receive updates, announcements, blog posts, and general Radix tips. Thanks Thanks to Chromatic for providing the visual testing platform that helps us review UI changes and catch visual regressions. License Licensed under the MIT License, Copyright © 2022-present WorkOS."
