["https://bestofjs.org/projects/nodejs"]
title = "Best of JS • Node.js"
description = "Trends and data about Node.js project. Node.js"
full_description = '''Node.js Node.js is an open-source, cross-platform JavaScript runtime environment. For information on using Node.js, see the Node.js website. The Node.js project uses an open governance model. The OpenJS Foundation provides support for the project. Contributors are expected to act in a collaborative manner to move the project forward. We encourage the constructive exchange of contrary opinions and compromise. The TSC reserves the right to limit or block contributors who repeatedly act in ways that discourage, exhaust, or otherwise negatively affect other participants. This project has a Code of Conduct. Table of contents Support Release types Download Current and LTS releases Nightly releases API documentation Verifying binaries Building Node.js Security Contributing to Node.js Current project team members TSC (Technical Steering Committee) Collaborators Triagers Release keys License Support Looking for help? Check out the instructions for getting support. Release types Current: Under active development. Code for the Current release is in the branch for its major version number (for example, v22.x). Node.js releases a new major version every 6 months, allowing for breaking changes. This happens in April and October every year. Releases appearing each October have a support life of 8 months. Releases appearing each April convert to LTS (see below) each October. LTS: Releases that receive Long Term Support, with a focus on stability and security. Every even-numbered major version will become an LTS release. LTS releases receive 12 months of Active LTS support and a further 18 months of Maintenance. LTS release lines have alphabetically-ordered code names, beginning with v4 Argon. There are no breaking changes or feature additions, except in some special circumstances. Nightly: Code from the Current branch built every 24-hours when there are changes. Use with caution. Current and LTS releases follow semantic versioning. A member of the Release Team signs each Current and LTS release. For more information, see the Release README. Download Binaries, installers, and source tarballs are available at https://nodejs.org/en/download/. Current and LTS releases https://nodejs.org/download/release/ The latest directory is an alias for the latest Current release. The latest-codename directory is an alias for the latest release from an LTS line. For example, the latest-hydrogen directory contains the latest Hydrogen (Node.js 18) release. Nightly releases https://nodejs.org/download/nightly/ Each directory and filename includes the version (e.g., v22.0.0), followed by the UTC date (e.g., 20240424 for April 24, 2024), and the short commit SHA of the HEAD of the release (e.g., ddd0a9e494). For instance, a full directory name might look like v22.0.0-nightly20240424ddd0a9e494. API documentation Documentation for the latest Current release is at https://nodejs.org/api/. Version-specific documentation is available in each release directory in the docs subdirectory. Version-specific documentation is also at https://nodejs.org/download/docs/. Verifying binaries Download directories contain a SHASUMS256.txt file with SHA checksums for the files. To download SHASUMS256.txt using curl: curl -O https://nodejs.org/dist/vx.y.z/SHASUMS256.txt To check that downloaded files match the checksum, use sha256sum: sha256sum -c SHASUMS256.txt --ignore-missing For Current and LTS, the GPG detached signature of SHASUMS256.txt is in SHASUMS256.txt.sig. You can use it with gpg to verify the integrity of SHASUMS256.txt. You will first need to import the GPG keys of individuals authorized to create releases. See Release keys for commands to import active release keys. Next, download the SHASUMS256.txt.sig for the release: curl -O https://nodejs.org/dist/vx.y.z/SHASUMS256.txt.sig Then use gpg --verify SHASUMS256.txt.sig SHASUMS256.txt to verify the file's signature. Building Node.js See BUILDING.md for instructions on how to build Node.js from source and a list of supported platforms. Security For information on reporting security vulnerabilities in Node.js, see SECURITY.md. Contributing to Node.js Contributing to the project Working Groups Strategic initiatives Technical values and prioritization Current project team members For information about the governance of the Node.js project, see GOVERNANCE.md. TSC (Technical Steering Committee) TSC voting members aduh95 - Antoine du Hamel <duhamelantoine1995@gmail.com> (he/him) anonrig - Yagiz Nizipli <yagiz@nizipli.com> (he/him) benjamingr - Benjamin Gruenbaum <benjamingr@gmail.com> BridgeAR - Ruben Bridgewater <ruben@bridgewater.de> (he/him) gireeshpunathil - Gireesh Punathil <gpunathi@in.ibm.com> (he/him) jasnell - James M Snell <jasnell@gmail.com> (he/him) joyeecheung - Joyee Cheung <joyeec9h3@gmail.com> (she/her) legendecas - Chengzhong Wu <legendecas@gmail.com> (he/him) marco-ippolito - Marco Ippolito <marcoippolito54@gmail.com> (he/him) mcollina - Matteo Collina <matteo.collina@gmail.com> (he/him) mhdawson - Michael Dawson <midawson@redhat.com> (he/him) RafaelGSS - Rafael Gonzaga <rafael.nunu@hotmail.com> (he/him) richardlau - Richard Lau <rlau@redhat.com> ronag - Robert Nagy <ronagy@icloud.com> ruyadorno - Ruy Adorno <ruy@vlt.sh> (he/him) ShogunPanda - Paolo Insogna <paolo@cowtech.it> (he/him) targos - Michaël Zasso <targos@protonmail.com> (he/him) tniessen - Tobias Nießen <tniessen@tnie.de> (he/him) TSC regular members BethGriggs - Beth Griggs <bethanyngriggs@gmail.com> (she/her) bnoordhuis - Ben Noordhuis <info@bnoordhuis.nl> cjihrig - Colin Ihrig <cjihrig@gmail.com> (he/him) codebytere - Shelley Vohr <shelley.vohr@gmail.com> (she/her) GeoffreyBooth - Geoffrey Booth <webadmin@geoffreybooth.com> (he/him) MoLow - Moshe Atlow <moshe@atlow.co.il> (he/him) Trott - Rich Trott <rtrott@gmail.com> (he/him) TSC emeriti members TSC emeriti members addaleax - Anna Henningsen <anna@addaleax.net> (she/her) apapirovski - Anatoli Papirovski <apapirovski@mac.com> (he/him) Ch