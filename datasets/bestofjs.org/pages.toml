full_description = "Better Auth The most comprehensive authentication library for TypeScript Learn more » Discord · Website · Issues About the Project Better Auth is framework-agnostic authentication (and authorization) library for TypeScript. It provides a comprehensive set of features out of the box and includes a plugin ecosystem that simplifies adding advanced functionalities with minimal code in short amount of time. Whether you need 2FA, multi-tenant support, or other complex features. It lets you focus on building your actual application instead of reinventing the wheel. Why Better Auth Authentication in the TypeScript ecosystem is a half-solved problem. Other open-source libraries often requires a lot of additional code for anything beyond basic authentication. Rather than just pushing third-party services as the solution, I believe we can do better as a community—hence, Better Auth. Contribution Better Auth is free and open source project licensed under the MIT License. You are free to do whatever you want with it. You could help continuing its development by: Contribute to the source code Suggest new features and report issues Security If you discover a security vulnerability within Better Auth, please send an e-mail to security@better-auth.com. All reports will be promptly addressed, and you'll be credited accordingly."
