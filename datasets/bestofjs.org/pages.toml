["https://bestofjs.org/projects/material-ui"]
title = "Best of JS • Material UI"
description = "Trends and data about Material UI project.  A robust, customizable, and accessible library of foundational and advanced components, enabling you to build your own design system and develop React applications faster"
full_description = "Material UI Material UI is a comprehensive library of React components that features our independent implementation of Google's Material Design system. It's trusted by some of the world's greatest product teams because it's been rigorously battle-tested through more than a decade of development by thousands of open-source contributors. Material UI's core functionality is extended by MUI X, a suite of complex components for advanced use cases. Toolpad builds on top of Material UI to provide full-stack components and a low-code internal tool builder. Documentation Get started in the Material UI documentation. Older versions v5.x (Upgrading from v5 to v6) v4.x (Upgrading from v4 to v5) v3.x (Upgrading from v3 to v4) v0.x (Upgrading to v1) Note: @next points to pre-releases. Use @latest for the latest stable release. Joy UI This repository also contains Joy UI, an experimental component library that implements our own in-house Joy Design. Joy UI is in beta and development is currently on hold. When starting a new project from scratch, we recommend Material UI over Joy UI because we can guarantee ongoing support. Keep in mind that the maintainers are primarily focused on other projects and may not be able to respond in a timely manner to issues or pull requests related to Joy UI. View the Joy UI documentation. Sponsors Diamond 💎 Diamond sponsors are those who have pledged $1,500/month or more to MUI. Gold 🏆 via Open Collective or via Patreon Goread.io Buzzoid Twicsy Views4You Gold sponsors are those who have pledged $500/month or more to MUI. More backers See the full list of our backers. Questions For how-to questions that don't involve making changes to the code base, please use Stack Overflow instead of GitHub issues. Examples Our documentation features a collection of example projects. Premium templates You can find complete templates and themes in the MUI Store. Contributing Read the contributing guide to learn about our development process, how to propose bug fixes and improvements, and how to build and test your changes. Contributing is about more than just issues and pull requests! There are many other ways to support Material UI beyond contributing to the code base. Changelog The changelog is regularly updated to reflect what's changed in each new release. Roadmap Future plans and high-priority features and enhancements can be found in the roadmap. License This project is licensed under the terms of the MIT license. Security For details on supported versions and contact information for reporting security issues, please refer to the security policy. Sponsoring services These great services sponsor MUI's core infrastructure: GitHub lets us host the Git repository and coordinate contributions. Netlify lets us distribute the documentation. BrowserStack lets us test in real browsers. CodeCov lets us monitor test coverage."
