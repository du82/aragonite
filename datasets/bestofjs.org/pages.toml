title = "Best of JS • JSON Crack"
description = "Trends and data about JSON Crack project. Seamlessly visualize your JSON data instantly into graphs; paste, import or fetch!"
full_description = "JSON Crack The open-source JSON Editor. Learn more » ToDiagram · Discord · Website · Issues · VS Code About the Project Visualize JSON into interactive graphs JSON Crack is a tool for visualizing JSON data in a structured, interactive graphs, making it easier to explore, format, and validate JSON. It offers features like converting JSON to other formats (CSV, YAML), generating JSON Schema, executing queries, and exporting visualizations as images. Designed for both readability and usability. Visualizer: Instantly convert JSON, YAML, CSV, XML, and TOML into interactive graphs or trees in dark or light mode. Convert: Seamlessly transform data formats, like JSON to CSV or XML to JSON, for easy sharing. Format & Validate: Beautify and validate JSON, YAML, and CSV for clear and accurate data. Code Generation: Generate TypeScript interfaces, Golang structs, and JSON Schema. JSON Schema: Create JSON Schema, mock data, and validate various data formats. Advanced Tools: Decode JWT, randomize data, and run jq or JSON path queries. Export Image: Download your visualization as PNG, JPEG, or SVG. Privacy: All data processing is local; nothing is stored on our servers. Recognition Built With Next.js React.js Reaflow Monaco Editor Stay Up-to-Date JSON Crack officially launched as v1.0 on the 17th of February 2022 and we've come a long way so far. Watch releases of this repository to be notified of future updates: Getting Started To get a local copy up and running, please follow these simple steps. Prerequisites Here is what you need to be able to run JSON Crack. Node.js (Version: >=18.x) Pnpm (recommended) Development Setup Clone the repo into a public GitHub repository (or fork https://github.com/AykutSarac/jsoncrack.com/fork). If you plan to distribute the code, read the LICENSE for additional details. git clone https://github.com/AykutSarac/jsoncrack.com.git Go to the project folder cd jsoncrack.com Install packages pnpm install Run the project pnpm dev # Running on http://localhost:3000/ Docker 🐳 A Dockerfile is provided in the root of the repository. If you want to run JSON Crack locally: # Build a Docker image with: docker compose build # Run locally with `docker-compose` docker compose up # Go to http://localhost:8888 License See LICENSE for more information."
