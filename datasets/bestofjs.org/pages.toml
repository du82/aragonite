["https://bestofjs.org/projects/biome"]
title = "Best of JS • Biome"
description = "Trends and data about Biome project. A toolchain for web projects, aimed to provide functionalities to maintain them."
full_description = "हिन्दी | English | Français | 繁體中文 | 简体中文 | 日本語 | Português do Brasil | 한국어 | Русский | Українська Biome is a performant toolchain for web projects, it aims to provide developer tools to maintain the health of said projects. Biome is a fast formatter for JavaScript, TypeScript, JSX, JSON, CSS and GraphQL that scores 97% compatibility with Prettier. Biome is a performant linter for JavaScript, TypeScript, JSX, CSS and GraphQL that features more than 270 rules from ESLint, typescript-eslint, and other sources. It outputs detailed and contextualized diagnostics that help you to improve your code and become a better programmer! Biome is designed from the start to be used interactively within an editor. It can format and lint malformed code as you are writing it. Installation npm install --save-dev --save-exact @biomejs/biome Usage # format files npx @biomejs/biome format --write ./src # lint files and apply the safe fixes npx @biomejs/biome lint --write ./src # run format, lint, etc. and apply the safe fixes npx @biomejs/biome check --write ./src # check all files against format, lint, etc. in CI environments npx @biomejs/biome ci ./src If you want to give Biome a run without installing it, use the online playground, compiled to WebAssembly. Documentation Check out our homepage to learn more about Biome, or directly head to the Getting Started guide to start using Biome. More about Biome Biome has sane defaults and it doesn't require configuration. Biome aims to support all main languages of modern web development. Biome doesn't require Node.js to function. Biome has first-class LSP support, with a sophisticated parser that represents the source text in full fidelity and top-notch error recovery. Biome unifies functionality that has previously been separate tools. Building upon a shared base allows us to provide a cohesive experience for processing code, displaying errors, parallelize work, caching, and configuration. Read more about our project philosophy. Biome is MIT licensed or Apache 2.0 licensed and moderated under the Contributor Covenant Code of Conduct. Funding You can fund the project in different ways Project sponsorship and funding You can sponsor or fund the project via Open collective or GitHub sponsors Biome offers a simple sponsorship program that allows companies to get visibility and recognition among various developers. Issue funding We use Polar.sh to up-vote and promote specific features that you would like to see and implement. Check our backlog and help us: Sponsors Gold Sponsors Silver Sponsors Bronze Sponsors"
