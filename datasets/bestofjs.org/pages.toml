full_description = '''An AI web browsing framework focused on simplicity and extensibility. Read the Docs Stagehand is the easiest way to build browser automations. It is fully compatible with Playwright, offering three simple AI APIs (act, extract, and observe) on top of the base Playwright Page class that provide the building blocks for web automation via natural language. Here's a sample of what you can do with Stagehand: // Keep your existing Playwright code unchanged await page.goto("https://docs.stagehand.dev"); // Stagehand AI: Act on the page await page.act("click on the 'Quickstart'"); // Stagehand AI: Extract data from the page const { description } = await page.extract({ instruction: "extract the description of the page", schema: z.object({ description: z.string(), }), }); WarningWe highly recommend using the Node.js runtime environment to run Stagehand scripts, as opposed to newer alternatives like Bun. This is solely due to the fact that Bun's runtime is not yet fully compatible with Playwright. Why? Stagehand adds determinism to otherwise unpredictable agents. While there's no limit to what you could instruct Stagehand to do, our primitives allow you to control how much you want to leave to an AI. It works best when your code is a sequence of atomic actions. Instead of writing a single script for a single website, Stagehand allows you to write durable, self-healing, and repeatable web automation workflows that actually work. NoteStagehand is currently available as an early release, and we're actively seeking feedback from the community. Please join our Slack community to stay updated on the latest developments and provide feedback. Documentation Visit docs.stagehand.dev to view the full documentation. Getting Started Watch Anirudh demo create-browser-app to create a Stagehand project! Quickstart To create a new Stagehand project configured to our default settings, run: npx create-browser-app --example quickstart Read our Quickstart Guide in the docs for more information. You can also add Stagehand to an existing Typescript project by running: npm install @browserbasehq/stagehand zod npx playwright install # if running locally Build and Run from Source git clone https://github.com/browserbase/stagehand.git cd stagehand npm install npx playwright install npm run build npm run example # run the blank script at ./examples/example.ts Stagehand is best when you have an API key for an LLM provider and Browserbase credentials. To add these to your project, run: cp .env.example .env nano .env # Edit the .env file to add API keys Contributing NoteWe highly value contributions to Stagehand! For questions or support, please join our Slack community. At a high level, we're focused on improving reliability, speed, and cost in that order of priority. If you're interested in contributing, we strongly recommend reaching out to Anirudh Kamath or Paul Klein in our Slack community before starting to ensure that your contribution aligns with our goals. For more information, please see our Contributing Guide. Acknowledgements This project heavily relies on Playwright as a resilient backbone to automate the web. It also would not be possible without the awesome techniques and discoveries made by tarsier, and fuji-web. We'd like to thank the following people for their contributions to Stagehand: Jeremy Press wrote the original MVP of Stagehand and continues to be an ally to the project. Navid Pour is heavily responsible for the current architecture of Stagehand and the act API. Sean McGuire is a major contributor to the project and has been a great help with improving the extract API and getting evals to a high level. Filip Michalsky has been doing a lot of work on building out integrations like Langchain and Claude MCP, generally improving the repository, and unblocking users. Sameel Arif is a major contributor to the project, especially around improving the developer experience. License Licensed under the MIT License. Copyright 2025 Browserbase, Inc.'''
