full_description = "Presentation slides for developers 🧑‍💻👩‍💻👨‍💻 Video Preview | Documentation Made possible by my Sponsor Program 💖 Features 📝 Markdown-based - foucus on content and use your favorite editor 🧑‍💻 Developer Friendly - built-in code highlighting, live coding, etc. 🎨 Themable - theme can be shared and used with npm packages 🌈 Stylish - on-demand utilities via UnoCSS. 🤹 Interactive - embedding Vue components seamlessly 🎙 Presenter Mode - use another window, or even your phone to control your slides 🎨 Drawing - draw and annotate on your slides 🧮 LaTeX - built-in LaTeX math equations support 📰 Diagrams - creates diagrams using textual descriptions with Mermaid 🌟 Icons - access to icons from any icon set directly 💻 Editor - integrated editor, or the VSCode extension 🎥 Recording - built-in recording and camera view 📤 Portable - export into PDF, PNGs, or PPTX ⚡️ Fast - instant reloading powered by Vite 🛠 Hackable - using Vite plugins, Vue components, or any npm packages Getting Started Try it Online ⚡️ sli.dev/new Init Project Locally Install Node.js >=18 and run the following command: npm init slidev Documentation: English | 中文文档 | Français | Español | Русский | Português-BR Discord: chat.sli.dev For a full example, you can check the demo folder, which is also the source file for my previous talk. Tech Stack Vite - An extremely fast frontend tooling Vue 3 powered Markdown - Focus on the content while having the power of HTML and Vue components whenever needed UnoCSS - On-demand utility-first CSS engine, style your slides at ease Shiki, Monaco Editor - First-class code snippets support with live coding capability RecordRTC - Built-in recording and camera view VueUse family - @vueuse/core, @vueuse/motion, etc. Iconify - Icon sets collection. Drauu - Drawing and annotations support KaTeX - LaTeX math rendering. Mermaid - Textual Diagrams. Sponsors This project is made possible by all the sponsors supporting my work: License MIT License © 2021 Anthony Fu"
