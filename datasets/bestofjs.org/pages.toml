["https://bestofjs.org/projects/definitelytyped"]
title = "Best of JS • DefinitelyTyped"
description = "Trends and data about DefinitelyTyped project. The repository for high quality TypeScript type definitions"
full_description = '''Definitely Typed The repository for high quality TypeScript type definitions. You can also read this README in Español, 한국어, Русский, 简体中文, Português, Italiano, 日本語 and Français! Link to Admin manual !!! Important! This repo has recently changed layout! !!! Definitely Typed has recently changed to a proper pnpm monorepo; you may want to reread this document for changes to the layout of packages in this repo. At the very least, you may want to git clean -fdx the repo (or node ./scripts/clean-node-modules.js on Windows) to clean up node_modules and run pnpm install --filter . to install the workspace root. See further sections for more info on pnpm install. Current status This section tracks the health of the repository and publishing process. It may be helpful for contributors experiencing any issues with their PRs and packages. Most recent build type-checked/linted cleanly: All packages are type-checking/linting cleanly: All packages are being published to npm in under an hour and a half: typescript-bot has been active on Definitely Typed Current infrastructure status updates If anything here seems wrong or any of the above are failing, please let us know in the Definitely Typed channel on the TypeScript Community Discord server. What are declaration files and how do I get them? See the TypeScript handbook. npm This is the preferred method. For example: npm install --save-dev @types/node To install typings for a scoped module, remove the @ and add double-underscore after the scope. For example, to install typings for @babel/preset-env: npm install --save-dev @types/babel__preset-env The types should then be automatically included by the compiler. You may need to add a types reference if you're not using modules: /// <reference types="node" /> See more in the handbook. For an npm package "foo", typings for it will be at "@types/foo". If your package has typings specified using the types or typings key in its package.json, the npm registry will display that the package has available bindings like so: If you still can't find the typings, just look for any ".d.ts" files in the package and manually include them with a /// <reference path="" />. Support Window Definitely Typed only tests packages on versions of TypeScript that are less than 2 years old. Older versions of TypeScript @types packages have tags for versions of TypeScript that they explicitly support, so you can usually get older versions of packages that predate the 2-year window. For example, if you run npm dist-tags @types/react, you'll see that TypeScript 2.5 can use types for react@16.0, whereas TypeScript 2.6 and 2.7 can use types for react@16.4: Tag Version latest 16.9.23 ts2.0 15.0.1 ... ... ts2.5 16.0.36 ts2.6 16.4.7 ts2.7 16.4.7 ... ... TypeScript 1.* Manually download from the master branch of this repository and place them in your project Typings (use preferred alternatives, typings is deprecated) NuGet (use preferred alternatives, nuget DT type publishing has been turned off) You may need to add manual references. How can I contribute? Definitely Typed only works because of contributions by users like you! Testing Before you share your improvement with the world, use the types yourself by creating a typename.d.ts file in your project and filling out its exports: declare module "libname" { // Types inside here export function helloWorldMessage(): string; } Test editing an existing package You can edit the types directly in node_modules/@types/foo/index.d.ts to validate your changes, then bring the changes to this repo with the steps below. Alternatively, you can use module augmentation to extend existing types from the DT module or use the declare module technique above which will override the version in node_modules. Adding tests to a new package Add to your tsconfig.json: "baseUrl": "types", "typeRoots": ["types"], Create types/foo/index.d.ts containing declarations for the module "foo". You should now be able to import from "foo" in your code and it will route to the new type definition. Then build and run the code to make sure your type definition actually corresponds to what happens at runtime. Once you've tested your definitions with real code, make a PR then follow the instructions to edit an existing package or create a new package. Make a pull request Once you've tested your package, you can share it on Definitely Typed. Fork this repository. Clone it. The Definitely Typed repo is large; you may want to consider using a "blobless clone" to save time and space by passing --filter=blob:none when running git clone. Install node. Run pnpm install. pnpm install will install the entire repository, including packages you may not be editing. If you'd like to install only a subset, you can run pnpm install -w --filter "{./types/foo}..." to install @types/foo and all of its dependencies. If you need to run tests for packages that depend on @types/foo, you can run pnpm install -w --filter "...{./types/foo}..." to pull in all related packages for testing. NoteIf you are using Windows, you may find that git clean does not remove the node_modules directory or hangs when doing so. If you need to remove node_modules, you can run pnpm clean-node-modules to reset the repo. We use a bot to let a large number of pull requests to DefinitelyTyped be handled entirely in a self-service manner. You can read more about why and how here. Here is a handy reference showing the life cycle of a pull request to DT: Edit an existing package Make changes. Remember to edit tests. If you make breaking changes, do not forget to update a major version. Run pnpm test <package to test>. When you make a PR to edit an existing package, dt-bot should @-mention the package's owners. If it doesn't, you can do so yourself in the comment associated with the PR. Create a new package If you are the library author and your package is written in TypeScript, bundle the generated declaration files in your package instead of publishing to Definitely Typed. You can also generate declaration files from JavaScript files, using JSDoc for type annotations. If you are adding typings for an npm package, create a directory with the same name. If the package you are adding typings for is not on npm, make sure the name you choose for it does not conflict with the name of a package on npm. (You can use npm info <my-package> to check for the existence of the <my-package> package.) Your package should have this structure: File Purpose index.d.ts This contains the typings for the package. <my-package>-tests.ts This contains sample code which tests the typings. This code does not run, but it is type-checked. tsconfig.json This allows you to run tsc within the package. .eslintrc.json (Rarely) Needed only to disable lint rules written for eslint. package.json Contains metadata for the package, including its name, version and dependencies. .npmignore Specifies which files are intended to be included in the package. Generate these by running npx dts-gen --dt --name <my-package> --template module. See all options at dts-gen. If you have .d.ts files besides index.d.ts, make sure that they are referenced either in index.d.ts or the tests. Definitely Typed members routinely monitor for new PRs, though keep in mind that the number of other PRs may slow things down. For a good example package, see base64-js. Removing a package When a package bundles its own types, types should be removed from Definitely Typed to avoid confusion. You can remove it by running pnpm run not-needed <typingsPackageName> <asOfVersion> [<libraryName>]. <typingsPackageName>: This is the name of the directory to delete. <asOfVersion>: A stub will be published to @types/<typingsPackageName> with this version. Should be higher than any currently published version and should be a version of <libraryName> on npm. <libraryName>: Name of npm package that replaces the Definitely Typed types. Usually this is identical to <typingsPackageName>, in which case you can omit it. If a package was never on Definitely Typed, it does not need to be added to notNeededPackages.json. Running tests Test your changes by running pnpm test <package to test> where <package to test> is the name of your package. You need to run this from the DefinitelyTyped directory because individual package.jsons don't define test scripts. This script uses dtslint to run the TypeScript compiler against your dts files. Once you have all your changes ready, use pnpm run test-all to see how your changes affect other modules. @arethetypeswrong/cli (attw) checks dtslint includes module format and package.json configuration checks from @arethetypeswrong/cli. The checks run only if a SemVer-major-compatible implementation package can be found on npm to compare against the DefinitelyTyped package. (DefinitelyTyped packages marked as nonNpm in their package.json are skipped.) Many packages currently fail the attw checks and need to be fixed. To allow us to make incremental progress, failed attw checks do not fail the dtslint run when the package is listed in failingPackages in attw.json, but they will still be reported in the pnpm test my-package output. If you fix the package, remove it from failingPackages so that attw checks can start failing dtslint runs. All problems reported by attw have documentation linked in the output. Some rules of thumb to help avoid problems: The package.json in the DefinitelyTyped package must have matching type and exports fields if the implementation package uses them in its package.json. For example, if an implementation package.json looks like: { "name": "my-package", "version": "1.0.1", "type": "module", "main": "dist/cjs/index.cjs", "exports": { ".": { "import": "./dist/esm/index.js", "require": "./dist/cjs/index.cjs" }, "./subpath": { "import": "./dist/esm/subpath.js", "require": "./dist/cjs/subpath.cjs" } } } then the DefinitelyTyped package.json should look something like: { "name": "@types/my-package", "version": "1.0.9999", "type": "module", "types": "index.d.ts", "exports": { ".": { "import": "./index.d.ts", "require": "./index.d.cts" }, "./subpath": { "import": "./subpath.d.ts", "require": "./subpath.d.cts" } } } Notice that each exports subpath is reflected, and each JavaScript file has a corresponding declaration file with a matching file extension—a .d.ts file types a .js file, not a .mjs or .cjs file! When the implementation package uses module.exports = ..., the DefinitelyTyped package should use export =, not export default. (Alternatively, if the module.exports is just an object of named properties, the DefinitelyTyped package can use a series of named exports.) The most common obstacle to correcting this problem is confusion about how to export types in addition to the primary export. For example, assume these types are incorrectly using export default: export interface Options { // ... } export default function doSomething(options: Options): void; Changing the export default to an export = creates an error: export interface Options { // ... } declare function doSomething(options: Options): void; export = doSomething; // ^^^^^^^^^^^^^^^^^ // Error: An export assignment cannot be used in a module with other exported elements. To fix this, move the types inside a namespace with the same name as the function: declare namespace doSomething { export interface Options { // ... } } declare function doSomething(options: doSomething.Options): void; export = doSomething; If you need help fixing a problem, please ask in the DefinitelyTyped channel on the TypeScript Community Discord server. Naming If you are adding typings for an npm package, create a directory with the same name. If the package you are adding typings for is not on npm, set "nonNpm": true in the package.json, and make sure the name you choose for it does not conflict with the name of a package on npm. (You can use npm info <my-package> to check for the existence of the <my-package> package.) In rare occasions, nonNpm may be set to "conflict", which incidates that there is a package on npm with the same name, but the types intentionally conflict with that package. This can be true for packages which define an environment like @types/node or for dummy packages like aws-lambda. Avoid using "conflict" where possible. <my-package>-tests.ts There should be a <my-package>-tests.ts file, which is considered your test file, along with any *.ts files it imports. If you don't see any test files in the module's folder, create a <my-package>-tests.ts. These files are used to validate the API exported from the *.d.ts files which are shipped as @types/<my-package>. They do not themselves ship. Changes to the *.d.ts files should include a corresponding *.ts file change which shows the API being used, so that someone doesn't accidentally break code you depend on. For example, this change to a function in a .d.ts file adding a new param to a function: index.d.ts: - export function twoslash(body: string): string + export function twoslash(body: string, config?: { version: string }): string <my-package>-tests.ts: import {twoslash} from "./" // $ExpectType string const result = twoslash("//") + // Handle options param + const resultWithOptions = twoslash("//", { version: "3.7" }) + // When the param is incorrect + // @ts-expect-error + const resultWithOptions = twoslash("//", { }) If you're wondering where to start with test code, the examples in the README of the original package are a great place to start. You can validate your changes with npm test <package to test> from the root of this repo, which takes changed files into account. Use $ExpectType to assert that an expression is of a given type and @ts-expect-error to assert that a compile error. Examples: // $ExpectType void f(1); // @ts-expect-error f("one"); For more details, see dtslint readme. Linter: .eslintrc.json If for some reason a lint rule needs to be disabled, disable it for a specific line: // eslint-disable-next-line no-const-enum const enum Const { One, } const enum Enum { // eslint-disable-line no-const-enum Two, } You can still disable rules with an .eslintrc.json, but should not in new packages. Disabling rules for the entire package makes it harder to review. tsconfig.json tsconfig.json should have noImplicitAny, noImplicitThis, strictNullChecks and strictFunctionTypes set to true. You may edit the tsconfig.json to add new test files, to add "target": "es6" (needed for async functions), to add to "lib" or to add the "jsx" compiler option. esModuleInterop/allowSyntheticDefaultImports TL;DR: esModuleInterop and allowSyntheticDefaultImports are not allowed in your tsconfig.json. These options make it possible to write a default import for a CJS export, modeling the built-in interoperability between CJS and ES modules in Node and in some JS bundlers: // component.d.ts declare class Component {​​​​​}​​​​​ // CJS export, modeling `module.exports = Component` in JS export = Component; // index.d.ts // ESM default import, only allowed u'''
