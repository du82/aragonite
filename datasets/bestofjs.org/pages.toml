title = "Best of JS • Node.js Best Practices"
description = "Trends and data about Node.js Best Practices project. The largest Node.JS best practices list. Curated from the top ranked articles and always updated"
full_description = '''Node.js Best Practices Follow us on Twitter! @nodepractices Read in a different language: CN, FR, BR, RU, PL, JA, EU (ES, HE, KR and TR in progress! ) 🎊 2024 edition is here! 🛰 Modernized to 2024: Tons of text edits, new recommended libraries, and some new best practices ✨ Easily focus on new content: Already visited before? Search for #new or #updated tags for new content only 🔖 Curious to see examples? We have a starter: Visit Practica.js, our application example and boilerplate (beta) to see some practices in action Welcome! 3 Things You Ought To Know First 1. You are reading dozens of the best Node.js articles - this repository is a summary and curation of the top-ranked content on Node.js best practices, as well as content written here by collaborators 2. It is the largest compilation, and it is growing every week - currently, more than 80 best practices, style guides, and architectural tips are presented. New issues and pull requests are created every day to keep this live book updated. We'd love to see you contributing here, whether that is fixing code mistakes, helping with translations, or suggesting brilliant new ideas. See our writing guidelines here 3. Best practices have additional info - most bullets include a 🔗Read More link that expands on the practice with code examples, quotes from selected blogs, and more information By Yoni Goldberg Learn with me: As a consultant, I engage with worldwide teams on various activities like workshops and code reviews. 🎉AND... Hold on, I've just launched my beyond-the-basics testing course, which is on a 🎁 limited-time sale until August 7th Table of Contents 1. Project Architecture Practices (6) 1.1 Structure your solution by components #strategic #updated 1.2 Layer your components, keep the web layer within its boundaries #strategic #updated 1.3 Wrap common utilities as packages, consider publishing 1.4 Use environment aware, secure and hierarchical config #updated 1.5 Consider all the consequences when choosing the main framework #new 1.6 Use TypeScript sparingly and thoughtfully #new 2. Error Handling Practices (12) 2.1 Use Async-Await or promises for async error handling 2.2 Extend the built-in Error object #strategic #updated 2.3 Distinguish operational vs programmer errors #strategic #updated 2.4 Handle errors centrally, not within a middleware #strategic 2.5 Document API errors using OpenAPI or GraphQL 2.6 Exit the process gracefully when a stranger comes to town #strategic 2.7 Use a mature logger to increase errors visibility #updated 2.8 Test error flows using your favorite test framework #updated 2.9 Discover errors and downtime using APM products 2.10 Catch unhandled promise rejections #updated 2.11 Fail fast, validate arguments using a dedicated library 2.12 Always await promises before returning to avoid a partial stacktrace #new 2.13 Subscribe to event emitters 'error' event #new 3. Code Style Practices (12) 3.1 Use ESLint #strategic 3.2 Use Node.js eslint extension plugins #updated 3.3 Start a Codeblock's Curly Braces on the Same Line 3.4 Separate your statements properly 3.5 Name your functions 3.6 Use naming conventions for variables, constants, functions and classes 3.7 Prefer const over let. Ditch the var 3.8 Require modules first, not inside functions 3.9 Set an explicit entry point to a module/folder #updated 3.10 Use the === operator 3.11 Use Async Await, avoid callbacks #strategic 3.12 Use arrow function expressions (=>) 3.13 Avoid effects outside of functions #new 4. Testing And Overall Quality Practices (13) 4.1 At the very least, write API (component) testing #strategic 4.2 Include 3 parts in each test name #new 4.3 Structure tests by the AAA pattern #strategic 4.4 Ensure Node version is unified #new 4.5 Avoid global test fixtures and seeds, add data per-test #strategic 4.6 Tag your tests #advanced 4.7 Check your test coverage, it helps to identify wrong test patterns 4.8 Use production-like environment for e2e testing 4.9 Refactor regularly using static analysis tools 4.10 Mock responses of external HTTP services #advanced #new #advanced 4.11 Test your middlewares in isolation 4.12 Specify a port in production, randomize in testing #new 4.13 Test the five possible outcomes #strategic #new 5. Going To Production Practices (19) 5.1. Monitoring #strategic 5.2. Increase the observability using smart logging #strategic 5.3. Delegate anything possible (e.g. gzip, SSL) to a reverse proxy #strategic 5.4. Lock dependencies 5.5. Guard process uptime using the right tool 5.6. Utilize all CPU cores 5.7. Create a ‘maintenance endpoint’ 5.8. Discover the unknowns using APM products #advanced #updated 5.9. Make your code production-ready 5.10. Measure and guard the memory usage #advanced 5.11. Get your frontend assets out of Node 5.12. Strive to be stateless #strategic 5.13. Use tools that automatically detect vulnerabilities 5.14. Assign a transaction id to each log statement #advanced 5.15. Set NODE_ENV=production 5.16. Design automated, atomic and zero-downtime deployments #advanced 5.17. Use an LTS release of Node.js 5.18. Log to stdout, avoid specifying log destination within the app #updated 5.19. Install your packages with npm ci #new 6. Security Practices (25) 6.1. Embrace linter security rules 6.2. Limit concurrent requests using a middleware 6.3 Extract secrets from config files or use packages to encrypt them #strategic 6.4. Prevent query injection vulnerabilities with ORM/ODM libraries #strategic 6.5. Collection of generic security best practices 6.6. Adjust the HTTP response headers for enhanced security 6.7. Constantly and automatically inspect for vulnerable dependencies #strategic 6.8. Protect Users' Passwords/Secrets using bcrypt or scrypt #strategic 6.9. Escape HTML, JS and CSS output 6.10. Validate incoming JSON schemas #strategic 6.11. Support blocklisting JWTs 6.12. Prevent brute-force attacks against authorization #advanced 6.13. Run Node.js as non-root user 6.14. Limit payload size using a reverse-proxy or a middleware 6.15. Avoid JavaScript eval statements 6.16. Prevent evil RegEx from overloading your single thread execution 6.17. Avoid module loading using a variable 6.18. Run unsafe code in a sandbox 6.19. Take extra care when working with child processes #advanced 6.20. Hide error details from clients 6.21. Configure 2FA for npm or Yarn #strategic 6.22. Modify session middleware settings 6.23. Avoid DOS attacks by explicitly setting when a process should crash #advanced 6.24. Prevent unsafe redirects 6.25. Avoid publishing secrets to the npm registry 6.26. 6.26 Inspect for outdated packages 6.27. Import built-in modules using the 'node:' protocol #new 7. Performance Practices (2) (Work In Progress️ ✍️) 7.1. Don't block the event loop 7.2. Prefer native JS methods over user-land utils like Lodash 8. Docker Practices (15) 8.1 Use multi-stage builds for leaner and more secure Docker images #strategic 8.2. Bootstrap using node command, avoid npm start 8.3. Let the Docker runtime handle replication and uptime #strategic 8.4. Use .dockerignore to prevent leaking secrets 8.5. Clean-up dependencies before production 8.6. Shutdown smartly and gracefully #advanced 8.7. Set memory limits using both Docker and v8 #advanced #strategic 8.8. Plan for efficient caching 8.9. Use explicit image reference, avoid latest tag 8.10. Prefer smaller Docker base images 8.11. Clean-out build-time secrets, avoid secrets in args #strategic #new 8.12. Scan images for multi layers of vulnerabilities #advanced 8.13 Clean NODE_MODULE cache 8.14. Generic Docker practices 8.15. Lint your Dockerfile #new 1. Project Architecture Practices 1.1 Structure your solution by business components 📝 #updated TL;DR: The root of a system should contain folders or repositories that represent reasonably sized business modules. Each component represents a product domain (i.e., bounded context), like 'user-component', 'order-component', etc. Each component has its own API, logic, and logical database. What is the significant merit? With an autonomous component, every change is performed over a granular and smaller scope - the mental overload, development friction, and deployment fear are much smaller and better. As a result, developers can move much faster. This does not necessarily demand physical separation and can be achieved using a Monorepo or with a multi-repo my-system ├─ apps (components) │ ├─ orders │ ├─ users │ ├─ payments ├─ libraries (generic cross-component functionality) │ ├─ logger │ ├─ authenticator Otherwise: when artifacts from various modules/topics are mixed together, there are great chances of a tightly-coupled 'spaghetti' system. For example, in an architecture where 'module-a controller' might call 'module-b service', there are no clear modularity borders - every code change might affect anything else. With this approach, developers who code new features struggle to realize the scope and impact of their change. Consequently, they fear breaking other modules, and each deployment becomes slower and riskier 🔗 Read More: structure by components 1.2 Layer your components with 3-tiers, keep the web layer within its boundaries 📝 #updated TL;DR: Each component should contain 'layers' - a dedicated folder for common concerns: 'entry-point' where controller lives, 'domain' where the logic lives, and 'data-access'. The primary principle of the most popular architectures is to separate the technical concerns (e.g., HTTP, DB, etc) from the pure logic of the app so a developer can code more features without worrying about infrastructural concerns. Putting each concern in a dedicated folder, also known as the 3-Tier pattern, is the simplest way to meet this goal my-system ├─ apps (components) │ ├─ component-a │ ├─ entry-points │ │ ├─ api # controller comes here │ │ ├─ message-queue # message consumer comes here │ ├─ domain # features and flows: DTO, services, logic │ ├─ data-access # DB calls w/o ORM Otherwise: It's often seen that developer pass web objects like request/response to functions in the domain/logic layer - this violates the separation principle and makes it harder to access later the logic code by other clients like testing code, scheduled jobs, message queues, etc 🔗 Read More: layer your app 1.3 Wrap common utilities as packages, consider publishing TL;DR: Place all reusable modules in a dedicated folder, e.g., "libraries", and underneath each module in its own folder, e.g., "/libraries/logger". Make the module an independent package with its own package.json file to increase the module encapsulation, and allows future publishing to a repository. In a Monorepo setup, modules can be consumed by 'npm linking' to their physical paths, using ts-paths or by publishing and installing from a package manager repository like the npm registry my-system ├─ apps (components) │ ├─ component-a ├─ libraries (generic cross-component functionality) │ ├─ logger │ │ ├─ package.json │ │ ├─ src │ │ │ ├─ index.js Otherwise: Clients of a module might import and get coupled to internal functionality of a module. With a package.json at the root, one can set a package.json.main or package.json.exports to explicitly tell which files and functions are part of the public interface 🔗 Read More: Structure by feature 1.4 Use environment aware, secure and hierarchical config 📝 #updated TL;DR: A flawless configuration setup should ensure (a) keys can be read from file AND from environment variable (b) secrets are kept outside committed code (c) config is hierarchical for easier findability (d) typing support (e) validation for failing fast (f) Specify default for each key. There are a few packages that can help tick most of those boxes like convict, env-var, zod, and others Otherwise: Consider a mandatory environment variable that wasn't provided. The app starts successfully and serve requests, some information is already persisted to DB. Then, it's realized that without this mandatory key the request can't complete, leaving the app in a dirty state 🔗 Read More: configuration best practices 1.5 Consider all the consequences when choosing the main framework 🌟 #new TL;DR: When building apps and APIs, using a framework is mandatory. It's easy to overlook alternative frameworks or important considerations and then finally land on a sub optimal option. As of 2023/2024, we believe that these four frameworks are worth considering: Nest.js, Fastify, express, and Koa. Click read more below for a detailed pros/cons of each framework. Simplistically, we believe that Nest.js is the best match for teams who wish to go OOP and/or build large-scale apps that can't get partitioned into smaller autonomous components. Fastify is our recommendation for apps with reasonably-sized components (e.g., Microservices) that are built around simple Node.js mechanics. Read our full considerations guide here Otherwise: Due to the overwhelming amount of considerations, it's easy to make decisions based on partial information and compare apples with oranges. For example, it's believed that Fastify is a minimal web-server that should get compared with express only. In reality, it's a rich framework with many official plugins that cover many concerns 🔗 Read More: Choosing the right framework 1.6 Use TypeScript sparingly and thoughtfully 🌟 #new TL;DR: Coding without type safety is no longer an option, TypeScript is the most popular option for this mission. Use it to define variables and functions return types. With that, it is also a double edge sword that can greatly encourage complexity with its additional ~ 50 keywords and sophisticated features. Consider using it sparingly, mostly with simple types, and utilize advanced features only when a real need arises Otherwise: Researches show that using TypeScript can help in detecting ~20% bugs earlier. Without it, also the developer experience in the IDE is intolerable. On the flip side, 80% of other bugs were not discovered using types. Consequently, typed syntax is valuable but limited. Only efficient tests can discover the whole spectrum of bugs, including type-related bugs. It might also defeat its purpose: sophisticated code features are likely to increase the code complexity, which by itself increases both the amount of bugs and the average bug fix time 🔗 Read More: TypeScript considerations ⬆ Return to top 2. Error Handling Practices 2.1 Use Async-Await or promises for async error handling TL;DR: Handling async errors in callback style is probably the fastest way to hell (a.k.a the pyramid of doom). The best gift you can give to your code is using Promises with async-await which enables a much more compact and familiar code syntax like try-catch Otherwise: Node.js callback style, function(err, response), is a promising way to un-maintainable code due to the mix of error handling with casual code, excessive nesting, and awkward coding patterns 🔗 Read More: avoiding callbacks 2.2 Extend the built-in Error object 📝 #updated TL;DR: Some libraries throw errors as a strin'''
