full_description = "TypeScript TypeScript is a language for application-scale JavaScript. TypeScript adds optional types to JavaScript that support tools for large-scale JavaScript applications for any browser, for any host, on any OS. TypeScript compiles to readable, standards-based JavaScript. Try it out at the playground, and stay up to date via our blog and Twitter account. Find others who are using TypeScript at our community page. Installing For the latest stable version: npm install -D typescript For our nightly builds: npm install -D typescript@next Contribute There are many ways to contribute to TypeScript. Submit bugs and help us verify fixes as they are checked in. Review the source code changes. Engage with other TypeScript users and developers on StackOverflow. Help each other in the TypeScript Community Discord. Join the #typescript discussion on Twitter. Contribute bug fixes. This project has adopted the Microsoft Open Source Code of Conduct. For more information see the Code of Conduct FAQ or contact opencode@microsoft.com with any additional questions or comments. Documentation TypeScript in 5 minutes Programming handbook Homepage Roadmap For details on our planned features and future direction, please refer to our roadmap."
