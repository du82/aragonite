full_description = "Microsoft’s Majorana 1 quantum chip could break encryption and expose your data to hackers By Brian Fagioli 1 week ago Tweet No Comments Microsoft is moving closer to quantum computing supremacy with the arrival of its new Majorana 1 chip, a development which could potentially have a far-reaching impact on cybersecurity. While the Windows-maker touts this as progress, the reality is far more concerning. The encryption that protects banking transactions, government data, and personal communications could soon be worthless. Microsoft's advancement comes down to Microsoft’s new topoconductor material, which enables a type of quantum computing that scales far beyond anything possible today. “We took a step back and said ‘OK, let’s invent the transistor for the quantum age. What properties does it need to have?’” said Chetan Nayak, Microsoft technical fellow. “And that’s really how we got here -- it’s the particular combination, the quality and the important details in our new materials stack that have enabled a new kind of qubit and ultimately our entire architecture.” Continue reading → Kioxia and Sandisk unveil 4.8Gb/s AI-ready 3D flash memory By Brian Fagioli 1 week ago Tweet No Comments Kioxia, in partnership with Sandisk, has introduced a super-cool 3D flash memory solution that boosts NAND interface speeds to an insane 4.8 gigabits per second! This has the potential to transform AI-powered tasks and data centers. This advancement integrates state-of-the-art features like Toggle DDR6.0 for NAND flash, alongside the SCA protocol (short for Separate Command Address) which streamlines command handling. Additionally, the PI-LTT system, or Power Isolated Low-Tapped Termination, slashes energy use. Continue reading → Amazon launches eero 7 and pro 7 Wi-Fi 7 mesh routers By Brian Fagioli 1 week ago Tweet No Comments Amazon has some good news for fans of its eero routers. The retail giant has just added two new models to its Wi-Fi 7 lineup -- the eero 7 and eero pro 7. These new devices promise fast multi-gigabit speeds at prices that won’t empty your wallet. The eero 7 is a dual-band router running on 2.4 GHz and 5 GHz bands, and offers wireless speeds up to 1.8 Gbps and wired speeds up to 2.3 Gbps with its two 2.5 GbE ports. Its small size means it should fit neatly on a shelf or desk, perfect for tighter spaces, and a single unit covers 2,000 square feet, which will be enough for an apartment or modest home. A twin-pack will cover 4,000 square feet, while a triple-pack will stretch to 6,000 square feet. Pricing starts at $169.99 for one, $279.99 for two, or $349.99 for three, which feels like a steal for Wi-Fi 7. Continue reading → FanDuel Sports Network brings live local sports to Prime Video By Brian Fagioli 2 weeks ago Tweet No Comments As someone who loves watching sports and placing a good bet now and then, I know how important it is to have easy access to live games. FanDuel Sports Network is making that even simpler by launching as an add-on subscription through Prime Video. Starting today, fans in FanDuel Sports Network markets can sign up for $19.99 per month and get access to tons of local sports content and live events. Eric Ratchman, President of Distribution and Business Development for Main Street Sports Group, said, “This relationship with Prime Video gives fans another way to watch their favorite local teams and underscores the essential role our distribution partners play in driving our future growth. We’re excited to offer a seamless and convenient way to stay in the game.” Continue reading → Google makes buying books easier for Play Books users on Apple iPhone By Brian Fagioli 2 weeks ago Tweet No Comments If you’re the type of person who loves to dive into a good book, Google has just made things simpler for you on your iPhone (and iPad). Historically, Play Books has been great for reading ebooks and audiobooks, but buying them on iOS was less than ideal. That’s changing now. Google has introduced a new “Get Book” feature in the Play Books iOS app, which now directly navigates you to the Google Play website for a seamless purchase. Gone are the days of navigating through confusing mazes; just tap, buy, and start your reading without distractions. Continue reading → Plugable launches USBC-MSTH3 USB-C HDMI hub for triple-monitor setups By Brian Fagioli 2 weeks ago Tweet No Comments If you need to connect multiple displays, you'll be pleased to know that Plugable has just released the USBC-MSTH3, a new USB-C hub designed for that very purpose. The hub uses Multi-Stream Transport (MST) technology, which allows users to spread their Windows desktop across three external screens. The hub supports HDMI 2.1, offering various display configurations: Continue reading → P3 Pro portable charger with MagSafe Qi2 wireless charging and global adapters launches from Infinacore By Brian Fagioli 2 weeks ago Tweet No Comments Infinacore has released the P3 Pro, its latest portable charger and power bank designed to meet the charging needs of modern users. Following a successful Kickstarter campaign, the P3 Pro is now available for purchase. The P3 Pro features two USB-C ports, one USB-A port, and MagSafe-compatible Qi2 wireless charging, enabling users to charge up to three devices simultaneously. It is designed to work with a variety of devices, including laptops, smartphones, gaming consoles, and cameras. For travelers, the charger includes interchangeable adapter prongs for US, UK, and EU outlets, making it a practical companion for international trips. Continue reading → Help test Fedora on Microsoft Windows Subsystem for Linux (WSL) before official release By Brian Fagioli 2 weeks ago Tweet No Comments The integration of Fedora into Microsoft’s Windows Subsystem for Linux (WSL) is on the brink of completion, and the Fedora crew is rallying the community for assistance. A testing event is pegged for Monday, February 17, 2025, offering enthusiasts an opportunity to experiment with Fedora under WSL prior to its formal release. If you’re equipped with either Windows 10 or 11 and have some free time, here’s your moment to make a contribution. This Fedora testing event is essentially a community-organized quest for bugs. It welcomes all -- whether you’re a die-hard Fedora supporter or simply intrigued by the idea of Linux within Windows. Requirements include an x86 or AArch64 setup with virtualization capabilities, a readiness to adhere to guidelines, and the capacity to handle downloading large test images. Continue reading → ACEMAGIC F3A AI 370 MINI PC with AMD Ryzen AI 9 HX 370 now up for pre-order By Brian Fagioli 2 weeks ago Tweet 3 Comments If you have been waiting for a powerful, AI-driven mini PC, ACEMAGIC has some big news -- its F3A AI 370 MINI PC is now available for pre-order! This thing isn’t just another underpowered compact PC -- actually, it Is built for serious computing such as AI workloads and content creation. At the core of the F3A is AMD’s brand-new Ryzen AI 9 HX 370 processor, based on Zen 5 and Zen 5c architecture. It has got 12 cores and 24 threads, with a turbo boost up to 5.1GHz, so multitasking and heavy workloads won’t slow it down. But what really makes this machine stand out is its AI-focused hardware. The third-gen Ryzen AI NPU, built on XDNA2 architecture, delivers up to 50 TOPS of AI power. When combined with the CPU and GPU, that number jumps to 80 TOPS, making this mini PC a beast for machine learning, AI inference, and other cutting-edge tasks. Continue reading → Chimera Linux 20250214 update launches with new apk-tools, Kernel 6.13, and official PowerPC support By Brian Fagioli 2 weeks ago Tweet No Comments Just in time for Valentine’s Day, the much-anticipated 20250214 update for Chimera Linux is here! This version introduces an improved package manager, a more modern kernel, and broadened hardware compatibility. A key highlight is the upgrade to apk-tools, now boasting variable expansion and a system-wide /usr file structure. This change simplifies mirror switching by eliminating the need for manual edits to repository configurations. Additionally, the update adopts a new v3-style index naming, ensuring backwards compatibility. Continue reading → BlueAnt Pump X over-ear Bluetooth headphones feature fitness-ready design By Brian Fagioli 2 weeks ago Tweet No Comments Let’s be honest -- exercising sucks. While some people enjoy fitness, many people (such as myself) absolutely detest it. Whether you love or hate being active, however, it is undoubtedly an essential part of good health. In other words, a fully sedentary life is destined for tragedy. If you want to make fitness more enjoyable, listening to music can do the trick. Put on a pair of headphones, crank your favorite tunes, and you just might find yourself more motivated. Continue reading → AVerMedia Live Gamer ULTRA S (GC553Pro) capture card debuts with 4K60 HDR and RGB24 By Brian Fagioli 2 weeks ago Tweet No Comments AVerMedia has released its newest capture card, the Live Gamer ULTRA S, model GC553Pro. This device is primarily designed for gamers who livestream. AVerMedia says it offers recording at high frame rates, captures true-color RGB24, and provides 5.1-channel surround sound. Streamers are often looking for equipment that can improve their broadcasts and engage their viewers more effectively. The Live Gamer ULTRA S aims to meet those demands with support for 4K60 HDR/VRR pass-through, capturing at high frame rates up to 4K60, 1440p144, 1080p240, and HDR up to 1440p30. The utilization of RGB24 format promises color accuracy, maintaining the visual integrity of the content. Continue reading → YouTube TV subscribers may lose CBS, MTV, Nickelodeon, and more as Paramount dispute escalates By Brian Fagioli 2 weeks ago Tweet 1 Comment Subscribers to YouTube TV might soon be without key Paramount channels such as CBS, MTV, and Nickelodeon. The platform has indicated that current negotiations with Paramount are faltering, and without a new deal by February 13, 2025, these channels could vanish from the service. The channels endangered in this corporate standoff span a wide array, including BET, CBS Sports Network, Comedy Central, VH1, NewsNation, and the Smithsonian Channel. Moreover, local CBS affiliates in significant markets like New York, Philadelphia, Dallas, and San Francisco are also on the chopping block. This disruption isn’t limited to live programming; DVR recordings from these channels would become unavailable, and add-ons like BET+, Paramount+ with Showtime, and Entertainment Plus would be excised from YouTube TV. Continue reading → Planck SSD delivers ultra-fast 2TB portable storage for iPhone, Android, and laptops By Brian Fagioli 3 weeks ago Tweet 2 Comments In a crowded solid state drive storage market, the all-new Planck SSD stands out by offering a blend of small size and fast performance. Tailored for those requiring dependable and fast external storage, this gadget boasts a storage capacity of up to 2TB with transfer speeds reaching 1050MB/s, ideal for handling large files while on the move. A really cool feature of the Planck SSD is its ability to record directly onto the SSD, bypassing the limitations of internal storage for capturing high-definition video. It facilitates Apple ProRes 4K recording at 120fps, ensuring videographers and content producers can shoot without worrying about frame drops. The device’s design is both compact and free from cables, enhancing portability, while its broad compatibility with iPhone, Android devices, tablets, and laptops supports versatile work processes. Continue reading → AI romance scams are exploding on dating apps ahead of Valentine’s Day -- here’s how to avoid getting tricked By Brian Fagioli 3 weeks ago Tweet No Comments Valentine’s Day should be a time for love, but sadly, these days it is also an opportunity for digital tricksters to pull scams. Recent insights from McAfee shows that AI bots, celebrity impostors, and misleading dating apps are on the rise, complicating the quest for true love online. Dating apps are super popular nowadays, with over 60 percent of folks using them or social media to find love. If you’re in the 18-24 demographic, you’re likely swiping through Tinder, Snapchat, or TikTok in search of a connection. But be warned, scammers are using AI to spin convincing tales of romance. Continue reading → Load More Articles"
