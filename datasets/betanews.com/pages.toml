of support in ten months. Users may extend support for a year officially though. Continue reading → Best Windows apps this week By Martin Brinkmann 2 months ago Tweet No Comments Six-hundred-twenty-eight in a series. Welcome to this week's overview of the best apps, games and extensions released for Windows 10 and Windows 11 on the Microsoft Store and elsewhere in the past seven days. The last week of December has been a slow news week, as usual. Reports suggest that some Path of Exile 2 players experience high CPU loads on Windows 11, but the issue has not been added to the official known issues list yet by Microsoft. Continue reading → Best Windows apps this week By Martin Brinkmann 2 months ago Tweet No Comments Six-hundred-twenty-seven in a series. Welcome to this week's overview of the best apps, games and extensions released for Windows 10 and Windows 11 on the Microsoft Store and elsewhere in the past seven days. Microsoft confirmed a new Windows 11 issue this week that prevents future installations of security updates. The issue affects Windows 11 devices that were installed using installation media, but only if the October or November 2024 security updates were included. No workaround at the time for affected users. Continue reading → Best Windows apps this week By Martin Brinkmann 2 months ago Tweet No Comments Six-hundred-twenty-six in a series. Welcome to this week's overview of the best apps, games and extensions released for Windows 10 and Windows 11 on the Microsoft Store and elsewhere in the past seven days. Microsoft confirmed new issues this week, some of which are blockers that prevent the upgrade to version 24H2 of Windows 11. Notable is an Auto HDR issue, that can cause game freezes and color distortions. You can check out the full list here as usual. Continue reading → Best Windows apps this week By Martin Brinkmann 3 months ago Tweet No Comments Six-hundred-twenty-five in a series. Welcome to this week's overview of the best apps, games and extensions released for Windows 10 and Windows 11 on the Microsoft Store and elsewhere in the past seven days. Microsoft lifted several blockers that prevented earlier Windows 11 systems from upgrading to version 24h2. The company announced that the update will be offered to more devices going forward. Continue reading → Best Windows apps this week By Martin Brinkmann 3 months ago Tweet No Comments Six-hundred-twenty-four in a series. Welcome to this week's overview of the best apps, games and extensions released for Windows 10 and Windows 11 on the Microsoft Store and elsewhere in the past seven days. Microsoft reaffirmed its position on the TPM 2.0 requirement of its Windows 11 operating system. The company called it non-negotiable. That is bad news for Windows 10 customers whose devices do not support it. Continue reading → Best Windows apps this week By Martin Brinkmann 3 months ago Tweet No Comments Six-hundred-twenty-three in a series. Welcome to this week's overview of the best apps, games and extensions released for Windows 10 and Windows 11 on the Microsoft Store and elsewhere in the past seven days. Microsoft confirmed several issues this week that affect Windows 11, version 24H2. One plagues Ubisoft gamers in particular. Continue reading → Best Windows apps this week By Martin Brinkmann 3 months ago Tweet No Comments Six-hundred-twenty-two in a series. Welcome to this week's overview of the best apps, games and extensions released for Windows 10 and 11 on the Microsoft Store and elsewhere in the past seven days. Microsoft released Bing Wallpaper to the Microsoft Store this week. It is not in our list of recommendations though, as Microsoft added lots of PUP -- potentially unwanted programs -- functions to it, including auto-installation of other software, options to decode cookies in non-Microsoft browsers, prompts to make Bing the default search and homepage, and more. I have added an alternative to the list of apps below. Continue reading → Load More Articles"
