title = "Plugable officially launches PS-10CC 10-port USB-C charger with priority-based charging"
description = "Plugable has launched the PS-10CC, a USB-C charger with 10 ports. Following a Kickstarter campaign in October, it goes on sale today for an introductory price of $84.95, which is less than its MSRP of $99.95."
full_description = "Plugable officially launches PS-10CC 10-port USB-C charger with priority-based charging By Brian Fagioli Published 5 days ago No Comments Tweet Plugable has launched the PS-10CC, a USB-C charger with 10 ports. Following a Kickstarter campaign in October, it goes on sale today for an introductory price of $84.95, which is less than its MSRP of $99.95. Created to eliminate cable clutter and completely improve charging efficiency, the PS-10CC uses precise, real-time current sensing to allocate power to each port that needs it. Devices connected to the ports farthest to the left get charged faster. Users should consider this when plugging in laptops and phones so they receive priority. (adsbygoogle = window.adsbygoogle || []).push({}); This charger does not have the bulky power brick that most regular chargers have. To reduce e-waste and shipping emissions, users have provide their own USB-C power source (18W minimum). Of course, some consumers will not be impressed at having to provide this, as it adds to the overall cost. The PS-10CC has intelligent LED lights designed to provide information -- solid blue means that a device is fully charged, a blinking blue means the device is still charging, and purple means the port is available. The special launch price is only available for a limited time before it returns to full MSRP, so be sure to buy it here ASAP. A compatible power brick can be had here. Disclosure: Some links above may be affiliate links. This means that if you click on one and make a purchase, we or our writers may earn a small commission at no extra cost to you. No Comments Tweet Datacolor LightColor Meter brings Bluetooth precision to photographers and filmmakersTranscend unveils the MTE255S PCIe Gen4 x4 NVMe SSDGet ready to say goodbye to Skype (if you haven't already)Best Windows apps this week87 percent of enterprises are deploying passkeysApple announces new features to help protect children, including a revamped age rating system for the App StoreNavigating NIS 2 compliance [Q&A]"
