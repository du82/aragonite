full_description = "Datacolor LightColor Meter brings Bluetooth precision to photographers and filmmakers By Brian Fagioli 11 hours ago Tweet No Comments If you are a photographer or videographer, you know just how important lighting is. You can have fancy high-end cameras, but if your lighting sucks, the end result can really suffer. Wouldn’t it be cool to scientifically monitor lighting rather than trust your gut? Well, if you like that idea, I have great news. You see, Datacolor has launched a really cool new product called “LightColor Meter.” This diminutive device is designed to measure both light intensity and color temperature. Continue reading → Transcend unveils the MTE255S PCIe Gen4 x4 NVMe SSD By Brian Fagioli 1 day ago Tweet 1 Comment Transcend has launched a new solid state drive that is largely unremarkable. Called “MTE255S,” it features a PCIe Gen4 x4 interface and reaches read speeds of up to 7,400MB/s and write speeds of up to 6,500MB/s. While this performance is hardly the best on the market, it is still quite respectable. With 1TB and 2TB storage options, the MTE255S comes equipped with a graphene heatsink to assist in cooling.Transcend includes LDPC error correction, though this model sadly lacks a DRAM cache and RAID engine -- something to strongly consider if you need sustained high-speed writes. Continue reading → MTA uses Google Pixel smartphones and AI to detect subway track defects By Brian Fagioli 2 days ago Tweet 2 Comments The subway in NYC has received a huge upgrade, but it’s probably not at all what you’d expect. No, it is not coming in the form of new trains or renovations to stations (even though that would be great). Actually, the MTA is testing a system that effectively transforms Google Pixel Android smartphones into powerful diagnostic tools for tracking rail defects! The project, called “TrackInspect,” attaches Google Pixel phones to subway cars. Then, by using the Android devices’ built-in microphones and motion sensors, it detects vibrations and sound patterns. These sounds can indicate areas of track that may need maintenance. How cool is that? Continue reading → OpenAI launches GPT-4.5 AI model and Elon Musk should be very worried By Brian Fagioli 2 days ago Tweet 2 Comments OpenAI has just announced GPT-4.5! While the company says the model is its most advanced AI yet, there’s definitely more to this release than meets the eye. Version 4.5 is a clear warning for anyone betting against OpenAI, including Elon Musk. GPT-4.5 is being labeled a “research preview,” meaning OpenAI is still testing its strengths and weaknesses. With that said, it is apparently smarter, more natural in conversations, and better at avoiding mistakes than previous models. That could signal big trouble for xAI’s Grok, which Musk has been pushing as an alternative to OpenAI’s models. Continue reading → Cricut Explore 4 and Maker 4 launch with faster speeds and lower prices -- perfect for stay-at-home moms By Brian Fagioli 2 days ago Tweet 2 Comments If you are a fan of crafts, you definitely have reason to be excited today. You see, Cricut is back with two new cutting machines designed to make crafting easier, faster, and even more affordable! The Cricut Explore 4 and Cricut Maker 4 will be available starting tomorrow. These machines will appeal to stay-at-home moms (or stay-at-home dads for that matter) looking for a creative hobby or even a potential side hustle. With the ability to cut materials twice as fast as before, users can churn out custom vinyl decals, t-shirts, greeting cards, and more in record time. You'll be amazed by all the cool things you can make with it. Continue reading → TP-Link Archer GE650 Wi-Fi 7 gaming router brings 11Gbps speeds and low latency for pro gamers By Brian Fagioli 3 days ago Tweet No Comments TP-Link is one of my favorite networking brands thanks to its high quality and affordable prices. Today, that company launches the Archer GE650 -- an absolutely gorgeous Wi-Fi 7 gaming router. The Archer GE650 delivers up to 11Gbps across three bands, including 5764Mbps on 6GHz, 4323Mbps on 5GHz, and 574Mbps on 2.4GHz. The router features one 5Gbps WAN port, one 5Gbps LAN port, and three 2.5Gbps LAN ports. Yeah, this router is absolutely loaded with multi-gig ports, making Gigabit seem downright ancient. Continue reading → BlueAnt X5i Party Speaker packs 120W sound and dynamic LED lights By Brian Fagioli 3 days ago Tweet No Comments BlueAnt has launched the X5i Party Speaker. This speaker offers 120W peak power, seven LED modes, two wireless microphones, and solid, long-lasting battery life. Whether it’s a party, karaoke night, or casual listening session, the X5i should be more than up for the task. CEO Taisen Maddern describes the X5i as an all-in-one audio experience. “It’s been engineered for all audio forms; from punk to pop, from metal to melodic, we’ve ensured audio is the king with the X5i,” he said. “The experience across the board, from the lighting to the battery, makes this the one-stop speaker for all occasions. With amazing bass, even at low volume levels, it makes the music feel live and helps create life’s memorable moments.” Continue reading → New Firefox terms of use could push users to Google Chrome By Brian Fagioli 3 days ago Tweet 24 Comments Mozilla has long positioned itself as a champion of privacy and open-source software, but its latest move really makes me worry that the organization could be drifting away from those values. You see, Mozilla has introduced Terms of Use for Firefox for the first time ever. Additionally, there is an updated Privacy Notice. And while Mozilla frames this as a move toward transparency, the actual terms are raising some major red flags for me. Mozilla claims these new terms are necessary due to a changing “technology landscape,” yet the fine print tells a far different story. One of the most troubling aspects is that users must grant Mozilla all rights necessary to operate Firefox, including a “nonexclusive, royalty-free, worldwide license” to use information entered through the browser. Mozilla insists this is meant to help users navigate the web, but the vague wording leaves a dangerous amount of room for interpretation. Could this include personal data, saved passwords, or browsing history? Mozilla simply fails to say. Continue reading → VINGUYS Smart Bird Feeder V-Feeder Bamboo with AI camera now available By Brian Fagioli 4 days ago Tweet 3 Comments Imagine for just a moment an advanced bird feeder that feels like a piece of nature itself, carved from eco-friendly bamboo. However, this IP66 waterproof feeder is also equipped with Wi-Fi, solar charging, and an AI camera to bring birdwatching into modern times. There is no need to imagine this product, as it is a reality! The “VINGUYS Smart Bird Feeder V-Feeder Bamboo” is more than just a pretty perch -- it’s got a 2.5K UHD camera that captures both photos and videos. It connects to your home Wi-Fi, albeit 2.4Ghz only, so you can watch the camera on your smartphone. Continue reading → Samsung 9100 PRO SSD delivers insane PCIe 5.0 speeds By Brian Fagioli 4 days ago Tweet 1 Comment If you thought solid state drive manufacturers were going to be slowing down their progress, you should think again. Today, Samsung unveils its 9100 PRO series, and it’s insanely fast. Using PCIe 5.0, it achieves up to 14,800 MB/s read and 13,400 MB/s write speeds! That’s twice as fast as its predecessor. So, yeah, this is a pretty big deal. There are two variants of the SSD -- the standard 9100 PRO and a version with a heatsink for better cooling. Samsung has equipped these drives with a power-efficient 5nm controller, reducing energy use by nearly 50 percent. Impressively, random read/write speeds can hit 2,200K/2,600K IOPS. Continue reading → Plugable officially launches PS-10CC 10-port USB-C charger with priority-based charging By Brian Fagioli 5 days ago Tweet No Comments Plugable has launched the PS-10CC, a USB-C charger with 10 ports. Following a Kickstarter campaign in October, it goes on sale today for an introductory price of $84.95, which is less than its MSRP of $99.95. Created to eliminate cable clutter and completely improve charging efficiency, the PS-10CC uses precise, real-time current sensing to allocate power to each port that needs it. Devices connected to the ports farthest to the left get charged faster. Users should consider this when plugging in laptops and phones so they receive priority. Continue reading → Apple Intelligence is a disaster but it’s rolling out to more languages anyway By Brian Fagioli 6 days ago Tweet 3 Comments Pardon my crude language, but Apple Intelligence sucks. Sorry, but there’s no way to sugarcoat it. Apple is literally worth trillions of dollars, and despite having what is essentially unlimited resources, its AI service is absolutely horrid. In fact, it is so bad, that many users just turn it off entirely. Hell, there is even an entire subreddit dedicated to its failures. What makes Apple Intelligence so terrible? Well, there are many things, but the most comical is the horrible job it does with summarizing notifications. Case in point, if my doorbell camera detects a person in the morning, and a person in the afternoon, Apple Intelligence will later warn me that multiple people are detected -- making it sound like a gang of people are on my front porch at the same time. Continue reading → Do not leave Windows for Linux -- try dual boot or a VM instead By Brian Fagioli 1 week ago Tweet 7 Comments Over the years, I have suggested leaving Windows for Linux many times, with some readers saying I sound like a broken record. In hindsight, however, that was arguably a foolish thing to suggest (in some cases, at least). No, that doesn’t mean I have soured on Linux -- quite the contrary. Actually, I am as enthusiastic as ever! So, have I changed my tune? Well… not entirely. I still think people should install Linux, but instead of replacing Windows, I would suggest dual-booting instead. This way, you get the best of both worlds -- Linux and Windows on one machine. I suppose if you find you don’t ever use Windows, you could get rid of it down the line. But even if you don’t use Windows, why bother getting rid of it? You might find having a Windows installation handy one day. Hey… you never know. Continue reading → Apple News+ Food is coming soon By Brian Fagioli 1 week ago Tweet No Comments As a fat and nerdy guy, two of my favorite things in the world are technology and food. And so, when Apple announced News+ Food today, my tummy rumbled in anticipation. But what exactly is it? Quite simply, News+ Food is a new section of the Apple News+ service that is dedicated to -- you guessed it -- food! This new section encompasses all things culinary, such as recipes, restaurant reviews, and healthy eating, to name but a few. Continue reading → Amazon kills its Android Appstore while Google Play remains the go-to choice By Brian Fagioli 1 week ago Tweet No Comments Amazon has announced that is finally pulling the plug on its Android Appstore, and that’s not all -- Amazon Coins are going down with it too. From August 20, 2025, Amazon says the Appstore on Android devices will be no more. That means no new downloads, no updates, and good luck expecting your existing apps to keep working. If you’re still relying on it, now’s the time to move on. If you have subscriptions through the Appstore you will be able to manage or cancel them for now, but once the shutdown happens, it’s all over. That said, Amazon isn’t shutting down the Appstore entirely. It will still exist on Fire TV and Fire tablets, which makes sense since those are Amazon’s own products. But if you’re using a regular Android phone or tablet? Sorry, you’re out of luck. Continue reading → Load More Articles"
