["https://betanews.com"]
title = "Technology News and Analysis - BetaNews"
description = "BetaNews is a leading source of technology news and analysis."
full_description = "New Firefox terms of use could push users to Google Chrome Forget Windows 12, Windows 11 2025 Edition is the Microsoft operating system we need! Get ready to say goodbye to Skype (if you haven't already) If you sign into your Microsoft account on a public or shared computer, you need to know this by Sofia Elizabella Wyciślik-Wilson How to install Kodi 21.2 Omega on Amazon Fire TV Stick (the easy way) by Wayne Williams Datacolor LightColor Meter brings Bluetooth precision to photographers and filmmakers By Brian Fagioli 12 hours ago Tweet No Comments If you are a photographer or videographer, you know just how important lighting is. You can have fancy high-end cameras, but if your lighting sucks, the end result can really suffer. Wouldn’t it be cool to scientifically monitor lighting rather than trust your gut? Well, if you like that idea, I have great news. You see, Datacolor has launched a really cool new product called “LightColor Meter.” This diminutive device is designed to measure both light intensity and color temperature. Continue reading → Transcend unveils the MTE255S PCIe Gen4 x4 NVMe SSD By Brian Fagioli 1 day ago Tweet 1 Comment Transcend has launched a new solid state drive that is largely unremarkable. Called “MTE255S,” it features a PCIe Gen4 x4 interface and reaches read speeds of up to 7,400MB/s and write speeds of up to 6,500MB/s. While this performance is hardly the best on the market, it is still quite respectable. With 1TB and 2TB storage options, the MTE255S comes equipped with a graphene heatsink to assist in cooling.Transcend includes LDPC error correction, though this model sadly lacks a DRAM cache and RAID engine -- something to strongly consider if you need sustained high-speed writes. Continue reading → Get ready to say goodbye to Skype (if you haven't already) By Ian Barker 2 days ago Tweet 5 Comments Before VoIP communication turned mainstream, Skype was a pioneer of the technology. Launching back in 2003 it became the go to application for people wanting to make calls over the internet and contact phone numbers from their computer. Since then it's had something of a checkered history. It was bought by eBay for $2.6 billion in 2005 before Microsoft snapped it up for $8.5 billion in 2011 as a replacement for Live Messenger. Continue reading → Best Windows apps this week By Martin Brinkmann 2 days ago Tweet 1 Comment Six-hundred-thirty-six in a series. Welcome to this week's overview of the best apps, games and extensions released for Windows 10 and Windows 11 on the Microsoft Store and elsewhere in the past seven days. One option for Windows 10 users who do not want to pay Microsoft for extended support is to switch to Linux once Microsoft's operating system runs out of support. Linux veteran Brian suggests to try a dual boot or VM instead at the beginning, to test the waters. Continue reading → 87 percent of enterprises are deploying passkeys By Ian Barker 2 days ago Tweet No Comments A new report shows that 87 percent of companies in the US and UK have, or are in the process of, rolling out passkeys with goals tied to improved user experience, enhanced security, and compliance. The research from the FIDO Alliance, along with underwriters Axiad, HID, and Thales, finds 47 percent report rolling out a mix of device-bound passkeys on physical security keys and/or cards and passkeys synced securely across the user's devices. Continue reading → Apple announces new features to help protect children, including a revamped age rating system for the App Store By Sofia Elizabella Wyciślik-Wilson 2 days ago Tweet No Comments Apple has just announced a series of new tools, features and improvements that it says will “help parents protect their kids in a way that is designed around privacy”. One of the biggest changes is an overhaul of the age rating system that is used in the App Store, with the number of categories expanding to five. But this is far from being the only changes Apple is unleashing. Continue reading → Navigating NIS 2 compliance [Q&A] By Ian Barker 2 days ago Tweet No Comments As the European Union updated the Network and Information Security (NIS 2) Directive in October last year, many companies were asking: what does it take to comply with this sweeping new regulation? Designed to tighten cybersecurity across critical industries, NIS 2 goes beyond the original directive’s framework, bringing strict rules, wider sectoral reach, and substantial penalties. We spoke to Sam Peters, chief product officer at isms.online, to find out what businesses need to know to ensure compliance and understand the directive's impact on both operations and reputation. Continue reading → Simplifying blockchain implementation for developers [Q&A] By Ian Barker 2 days ago Tweet No Comments Blockchain technology has often been touted as a game changer for the security of transactions in different fields. However, many organizations still don't full appreciate its value or how to incorporate it into their applications. We spoke to Lee Jacobson, senior vice president business development Web3 at video game commerce company Xsolla to find out about how blockchain implementation can be made easier. Continue reading → MTA uses Google Pixel smartphones and AI to detect subway track defects By Brian Fagioli 2 days ago Tweet 2 Comments The subway in NYC has received a huge upgrade, but it’s probably not at all what you’d expect. No, it is not coming in the form of new trains or renovations to stations (even though that would be great). Actually, the MTA is testing a system that effectively transforms Google Pixel Android smartphones into powerful diagnostic tools for tracking rail defects! The project, called “TrackInspect,” attaches Google Pixel phones to subway cars. Then, by using the Android devices’ built-in microphones and motion sensors, it detects vibrations and sound patterns. These sounds can indicate areas of track that may need maintenance. How cool is that? Continue reading → OpenAI launches GPT-4.5 AI model and Elon Musk should be very worried By Brian Fagioli 2 days ago Tweet 2 Comments OpenAI has just announced GPT-4.5! While the company says the model is its most advanced AI yet, there’s definitely more to this release than meets the eye. Version 4.5 is a clear warning for anyone betting against OpenAI, including Elon Musk. GPT-4.5 is being labeled a “research preview,” meaning OpenAI is still testing its strengths and weaknesses. With that said, it is apparently smarter, more natural in conversations, and better at avoiding mistakes than previous models. That could signal big trouble for xAI’s Grok, which Musk has been pushing as an alternative to OpenAI’s models. Continue reading → Cricut Explore 4 and Maker 4 launch with faster speeds and lower prices -- perfect for stay-at-home moms By Brian Fagioli 3 days ago Tweet 2 Comments If you are a fan of crafts, you definitely have reason to be excited today. You see, Cricut is back with two new cutting machines designed to make crafting easier, faster, and even more affordable! The Cricut Explore 4 and Cricut Maker 4 will be available starting tomorrow. These machines will appeal to stay-at-home moms (or stay-at-home dads for that matter) looking for a creative hobby or even a potential side hustle. With the ability to cut materials twice as fast as before, users can churn out custom vinyl decals, t-shirts, greeting cards, and more in record time. You'll be amazed by all the cool things you can make with it. Continue reading → Study finds that Instagram is beneficial to the wellbeing of queer youth By Sofia Elizabella Wyciślik-Wilson 3 days ago Tweet 6 Comments There is much said about the negative impact of social media on mental health and general welfare, but a new study suggests that there are benefits too -- especially for minority and marginalized groups such as the LGBTQIA+ community. In particular, Instagram has been found to be a boost to the wellbeing of queer young people. Surveys of Instagram users in the United States and Poland showed that access to supportive online communities brought about a range of psychological benefits. Continue reading → TP-Link Archer GE650 Wi-Fi 7 gaming router brings 11Gbps speeds and low latency for pro gamers By Brian Fagioli 3 days ago Tweet No Comments TP-Link is one of my favorite networking brands thanks to its high quality and affordable prices. Today, that company launches the Archer GE650 -- an absolutely gorgeous Wi-Fi 7 gaming router. The Archer GE650 delivers up to 11Gbps across three bands, including 5764Mbps on 6GHz, 4323Mbps on 5GHz, and 574Mbps on 2.4GHz. The router features one 5Gbps WAN port, one 5Gbps LAN port, and three 2.5Gbps LAN ports. Yeah, this router is absolutely loaded with multi-gig ports, making Gigabit seem downright ancient. Continue reading → Changes to compliance requirements leave professionals struggling to keep up By Ian Barker 3 days ago Tweet No Comments The rise of AI and increasing global regulations have raised the stakes for businesses, as they navigate complex requirements to protect sensitive data and ensure ethical practices. A new survey from trust management platform Drata reveals that 48 percent of governance, risk, and compliance (GRC) professionals struggle to keep pace with updates to existing compliance frameworks and identifying areas needing attention. Continue reading → Third-party risk is biggest cybersecurity blind spot By Ian Barker 3 days ago Tweet No Comments Third-party risk has emerged as a dominant driver of cyber insurance claims and material losses in 2024, according to new data from leading cyber risk solutions company Resilience. Cyber insurance claims data shows that third-party risk, including ransomware and outages affecting vendors, accounted for 31 percent of all claims in 2024. Even more startling, third-party risk led to claims with incurred losses for the first time ever, making up nearly a quarter (23 percent) of incurred claims in 2024 (compared to none in 2023). Continue reading → Load More Articles"
