full_description = '''Forget Windows 12, Windows 11 2025 Edition is the Microsoft operating system we need! By Wayne Williams 4 days ago Tweet 14 Comments Every so often, we hear rumors about Microsoft’s next operating system, widely expected to be called Windows 12. The tech giant has been keeping quiet about its future plans, preferring instead to continue to update Windows 11, adding more AI features, and deprecating functionality it thinks we no longer need. Although plenty of people still prefer Windows 10 to its successor, Windows 11 will be the only game in town in a matter of months when the older OS comes to its end of life later this year. Windows 11 isn’t bad -- far from it -- but it could be better, as evidenced by Windows 11 2025 Edition. Continue reading → Windows 12 won't pull me away from Linux unless Microsoft fixes these 5 things By Brian Fagioli 3 weeks ago Tweet 48 Comments Windows 12 has been the subject of leaks and speculation, which can be totally fun to discuss and imagine. But let’s be honest, folks -- that operating system is not likely to arrive this year. In fact, it could still be several years away. On a positive note, however, that should give Microsoft plenty of time to make sure the OS is actually worth using. As a regular Linux user, I have some very serious demands if I’m ever going to consider switching, and Microsoft has a golden opportunity to get things right. Here are five things the company needs to deliver before I even think about going with Windows 12. Continue reading → AR OS 2 is everything we want Windows 12 to be -- and more By Wayne Williams 4 weeks ago Tweet 38 Comments Microsoft continues to work hard at improving Windows 11, fixing problems and cramming in loads of new AI features. Despite that (or perhaps because of it), its newest operating system still lags behind Windows 10 in terms of market share, even though end of life is fast approaching for that beloved but aging OS. Microsoft hasn't officially announced Windows 12 yet, and it likely won't until after Windows 10 is no more. But if you want inspiration for what the next generation of Windows could look like, feast your eyes on the stunning AR OS 2. Continue reading → New year, new Microsoft OS -- the stunning Windows 25 is everything Windows 12 should be By Wayne Williams 2 months ago Tweet 46 Comments Every so often, we get hints about Windows 12 -- usually in the form of accidental slips from Microsoft partners, like Intel. So far, though, that future OS has yet to be confirmed. Instead, what we get are continuous updates for Windows 11, typically with new AI features hastily jammed in. But it’s 2025, and a new year is when we look forward to fresh beginnings and groundbreaking innovations. It’s time for a new Microsoft operating system. Let me introduce you to Windows 25. Continue reading → Waiting for Microsoft Windows 12 is a mistake when you can upgrade to Linux today By Brian Fagioli 3 months ago Tweet 21 Comments The tech world is full of rumors about Windows 12, the supposed savior of Microsoft’s operating system lineup. The company has been tight-lipped about details, but leaks suggest it’s aiming to be a more cloud-focused, AI-driven operating system. That all sounds fancy, but here’s the truth -- waiting for Windows 12 might not be the smart play. If you’re tired of the bloat, the constant updates, and the never-ending resource demands, there’s an alternative you can embrace today: Linux. Microsoft has spent years refining Windows, but with every iteration, it seems to get heavier, slower, and, frankly, more intrusive. Windows 12 promises new features like AI enhancements and tighter cloud integration, but do you really need an AI telling you how to use your PC? For most users, these features feel like unnecessary fluff rather than meaningful improvements. Instead of waiting for an operating system that may or may not meet your needs, you could switch to Linux -- a free, lightweight, and privacy-respecting solution that puts you in control. Continue reading → Windows 12 is everything Windows 11 should be -- and the Microsoft OS we deserve! By Wayne Williams 3 months ago Tweet 58 Comments Microsoft is preparing to end free support for Windows 10 next year, although users will have the option to pay for continued security updates if they choose. While it’s possible to keep using the popular operating system safely, most people will face two choices: upgrade to Windows 11 or wait for the eagerly anticipated next-generation OS, widely expected to be called Windows 12. Although Microsoft has yet to officially reveal its plans for the future of Windows, we have an idea of what it could look like. Continue reading → Forget bloated Windows 11, Windows 12 Lite is the Microsoft operating system we need! By Wayne Williams 3 months ago Tweet 32 Comments Windows 11, despite its modern design and advanced features, has been criticized for its bloated nature. The operating system demands substantial hardware resources, leaving many users with sluggish performance -- even on newer machines -- and Microsoft is jamming AI features into almost every corner of the OS, including the likes of Notepad and Paint, which doesn't help. Perhaps it’s time to get back to basics, trim the fat, and give users the lightweight operating system they crave without sacrificing any modern functionality? Perhaps it's time for Windows 12 Lite. Continue reading → Windows 12.1 is everything Windows 11 should be -- and the Microsoft operating system we need! By Wayne Williams 6 months ago Tweet 47 Comments As you likely know, Microsoft is preparing to end support for Windows 10 next year, and while you can continue to use that OS, provided you do so safely, the main options will be to upgrade to Windows 11 or wait for the anticipated release of its successor, likely to be Windows 12. While Microsoft hasn't officially confirmed the next-generation operating system, there have been numerous hints and rumors about what it might be like. Continue reading → Lucky for some -- Windows 13 is everything Windows 11 should be By Wayne Williams 9 months ago Tweet 30 Comments Microsoft is busy introducing AI functionality across Windows 11. That's great, but a lot of users would prefer to see an operating system that’s more user-friendly and lets you customize it as you see fit. The tech giant has a history of not necessarily following expected naming conventions -- whatever happened to Windows 9? -- so this look at an OS that’s Windows 13, not Windows 12, perhaps shouldn’t seem too outlandish. Continue reading → The stunning Windows 13 -- yes, 13! -- is the Microsoft operating system we want By Wayne Williams 11 months ago Tweet 24 Comments Microsoft plans to phase out support for Windows 10 soon (unless you pay, of course), leaving users with the option to either upgrade to Windows 11 or wait for the anticipated successor, likely to be Windows 12. Although Microsoft hasn't officially announced that next-gen operating system yet, it has dropped plenty of hints, and there’s a good chance it will come jam-packed with AI functionality, as that is clearly where the operating system -- and the company -- is headed. Continue reading → Windows 12 'first look' will make you want the future OS right now By Wayne Williams 12 months ago Tweet 25 Comments Microsoft is preparing to discontinue support for Windows 10 in the near future, giving users the option to either upgrade to Windows 11 or wait for the anticipated successor, Windows 12. We’re not expecting to see the arrival of the next-gen operating system this year -- Microsoft is focused on adding more AI functionality to Windows 11 at the moment -- but we do have an idea of what Windows 12 could look like. Continue reading → Windows 12 Gaming Edition is the Microsoft operating system gamers need! By Wayne Williams 1 year ago Tweet 24 Comments Gamers who want to get the most from their rigs will usually have to tweak Windows to disable unwanted resource hogs and boost performance. Although Microsoft does like to promote Windows 11 as the perfect OS for gaming, it isn’t dedicated to that noble pursuit. Although Windows 12 has yet to be officially announced, a version of that OS just for gaming would be welcomed by the huge number of PC gamers out there, myself included. Continue reading → Windows 12 Mobile is everything a phone operating system should be By Wayne Williams 1 year ago Tweet 87 Comments Microsoft made a significant investment in Windows 10 Mobile, including acquiring Nokia to produce its own handsets. Despite the strengths of the tiled mobile operating system, it was unable to compete with the dominant iOS and Android platforms. While Windows 10 went on to become a hugely successful operating system for PCs and tablets, Microsoft was eventually to abandon its mobile ambitions. Although the tech giant has yet to announce Windows 12, if you’re wondering how that OS would look and perform in the mobile space, we have an answer. Continue reading → Microsoft Build 2024 confirmed for May, with 'AI, Copilots, and more' for developers By Sofia Elizabella Wyciślik-Wilson 1 year ago Tweet No Comments Microsoft has confirmed the dates and location of this year's Build conference for developers. The event will be held from May 21 to 23 in the Seattle Convention Center's Summit building, and it may be a chance for everyone to learn more about not only the future of Windows 11, but also the upcoming Windows 12. Like last year, Microsoft Build 2024 is an in-person event, although online attendance is also possible. So far, Microsoft is promising "AI, Copilots, and more for Developers" and while there are no firm details of precisely what to expect, it is possible to sign up to be notified when registration opens. Continue reading → Qualcomm says the 'next version of Windows' will launch in mid-2024... but is it Windows 12? By Sofia Elizabella Wyciślik-Wilson 1 year ago Tweet 3 Comments Confusion surrounds Microsoft's plans for Windows 12, with conflicting rumors suggesting different launch dates. Development is clearly well underway at Microsoft, and Qualcomm has just added strength to idea that Windows 12 could launch later this year. While we've heard that Microsoft only plans to release the Windows 11 24H2 update this year, holding off releasing Windows 12 until 2025, Qualcomm's suggestion of a mid-2024 launch for Windows 12 is not the first time this release window has been suggested. Continue reading → Load More Articles'''
