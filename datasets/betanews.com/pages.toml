full_description = "Best Windows apps this week By Martin Brinkmann 2 days ago Tweet 1 Comment Six-hundred-thirty-six in a series. Welcome to this week's overview of the best apps, games and extensions released for Windows 10 and Windows 11 on the Microsoft Store and elsewhere in the past seven days. One option for Windows 10 users who do not want to pay Microsoft for extended support is to switch to Linux once Microsoft's operating system runs out of support. Linux veteran Brian suggests to try a dual boot or VM instead at the beginning, to test the waters. Continue reading → Install the KB5052093 update for Windows 11 to gain taskbar file sharing, Explorer improvements, and endless bug fixes By Sofia Elizabella Wyciślik-Wilson 4 days ago Tweet 2 Comments It's that time of the month when Microsoft releases preview versions of next month’s updates for Windows. For the eager -- and brave -- they provide a way to get early access to new features and options as well as fixes for problems. Windows 11 users now have the KB5052093 update to download and install if they want to jump in ahead of Patch Tuesday, and this is a nice little update that not only patches a bunch of bugs, but adds a tasty selection of new bits and pieces. A highlight is the ability to use a single webcam in multiple apps. Continue reading → Forget Windows 12, Windows 11 2025 Edition is the Microsoft operating system we need! By Wayne Williams 4 days ago Tweet 14 Comments Every so often, we hear rumors about Microsoft’s next operating system, widely expected to be called Windows 12. The tech giant has been keeping quiet about its future plans, preferring instead to continue to update Windows 11, adding more AI features, and deprecating functionality it thinks we no longer need. Although plenty of people still prefer Windows 10 to its successor, Windows 11 will be the only game in town in a matter of months when the older OS comes to its end of life later this year. Windows 11 isn’t bad -- far from it -- but it could be better, as evidenced by Windows 11 2025 Edition. Continue reading → You can get Office apps for free if you're willing to opt for an ad-supported Microsoft 365 subscription By Sofia Elizabella Wyciślik-Wilson 5 days ago Tweet 2 Comments The gradual move towards a subscription-based model for software payments has been continuing for a number of years now -- and the costs can soon add up. For anyone who is looking for ways to make things a bit less of a strain on their wallet, Microsoft has come up with a solution -- ad-supported versions of its Office apps. If you are happy to endure advertising in the likes of Word and Excel, you can opt for a free Microsoft 365 subscription. Sadly, ads are not the only catch. Continue reading → Windows Vista 2025 Edition fixes Windows 11's biggest problems -- download it now By Wayne Williams 5 days ago Tweet 26 Comments For a lot of people, the biggest, most noticeable difference between Windows 10 and 11 is the centered taskbar and Start menu that Microsoft introduced to its latest operating system. The software giant made the change to give Windows 11 a fresh, modern look and set it apart from its predecessor, but Windows has had a left-aligned taskbar and menu since Windows 95, and as the company proved when it gave us a tiled Start screen in Windows 8, change isn't always good -- or welcome. Continue reading → Do not leave Windows for Linux -- try dual boot or a VM instead By Brian Fagioli 1 week ago Tweet 7 Comments Over the years, I have suggested leaving Windows for Linux many times, with some readers saying I sound like a broken record. In hindsight, however, that was arguably a foolish thing to suggest (in some cases, at least). No, that doesn’t mean I have soured on Linux -- quite the contrary. Actually, I am as enthusiastic as ever! So, have I changed my tune? Well… not entirely. I still think people should install Linux, but instead of replacing Windows, I would suggest dual-booting instead. This way, you get the best of both worlds -- Linux and Windows on one machine. I suppose if you find you don’t ever use Windows, you could get rid of it down the line. But even if you don’t use Windows, why bother getting rid of it? You might find having a Windows installation handy one day. Hey… you never know. Continue reading → Best Windows apps this week By Martin Brinkmann 1 week ago Tweet No Comments Six-hundred-thirty-five in a series. Welcome to this week's overview of the best apps, games and extensions released for Windows 10 and Windows 11 on the Microsoft Store and elsewhere in the past seven days. Microsoft is working on a new app. Currently in development, Migration App is designed to help users smoothly transfer files from one Windows PC to another. Continue reading → It's possible to run Windows XP on an Apple TV -- and it works like a dream! By Wayne Williams 1 week ago Tweet 3 Comments Windows XP hasn’t been supported by Microsoft for a decade now, but it’s in use in many places. According to the most recent figures from Statcounter, the ancient OS still holds 0.27 percent of the Windows market, placing it above Windows 8/8.1. There is even a Linux version of XP that you can run if you want a hit of nostalgia, but don’t want to risk using an unsupported OS. You’ve no doubt seen Doom running on all sorts of hardware, and XP is similar in some respects. We’ve already seen it running on Apple’s Vision Pro, and now it appears that with a bit of creative thinking it’s possible to run Windows XP on an Apple TV. Continue reading → Microsoft is giving Snipping Tool a major OCR upgrade in Windows 11 By Sofia Elizabella Wyciślik-Wilson 1 week ago Tweet 2 Comments Snipping Tool is one of the most useful apps to be found in Windows 11, making light work of grabbing on-screen content. Primarily concerned with taking screenshots, it has developed over the years to include a handy OCR component for extracting text. And now this feature is in line for an upgrade. Microsoft is improving the text extraction capabilities of Snipping Tool so that text can be grabbed without the need to take a screenshot first. Continue reading → Microsoft issues yet another reminder that it is killing off WSUS driver synchronization soon By Sofia Elizabella Wyciślik-Wilson 1 week ago Tweet 3 Comments When Microsoft announces the deprecation of a feature or service, you’d be forgiven for thinking that it was because few people use it. This may be the case in some instances, but with the deprecation of WSUS driver synchronization, the company is making it seem otherwise. So many reminders have been issued about the loss of this particular service, it is hard to think that Microsoft isn't aware that the cull will affect a lot of people. And now yet another reminder has been published! Continue reading → Microsoft’s Majorana 1 quantum chip could break encryption and expose your data to hackers By Brian Fagioli 1 week ago Tweet No Comments Microsoft is moving closer to quantum computing supremacy with the arrival of its new Majorana 1 chip, a development which could potentially have a far-reaching impact on cybersecurity. While the Windows-maker touts this as progress, the reality is far more concerning. The encryption that protects banking transactions, government data, and personal communications could soon be worthless. Microsoft's advancement comes down to Microsoft’s new topoconductor material, which enables a type of quantum computing that scales far beyond anything possible today. “We took a step back and said ‘OK, let’s invent the transistor for the quantum age. What properties does it need to have?’” said Chetan Nayak, Microsoft technical fellow. “And that’s really how we got here -- it’s the particular combination, the quality and the important details in our new materials stack that have enabled a new kind of qubit and ultimately our entire architecture.” Continue reading → Who needs Windows 11? FreeXP is a modern version of Microsoft's greatest OS, powered by Debian Linux By Wayne Williams 2 weeks ago Tweet 66 Comments I appreciate calling Windows XP “Microsoft’s greatest OS” will elicit snorts of derision from a good number of you. That honor probably belongs to Windows 7, or maybe even Windows 10 (once Microsoft ironed out the many problems that plagued it from the start). But certainly, Windows XP was a classic, and a huge step up from the operating systems that preceded it. If you miss XP but aren’t crazy enough to run an OS that (mostly) hasn’t had security updates in over a decade, FreeXP might be just what you’re looking for. It’s not XP, and it’s not from Microsoft, but it looks and feels just like it. Continue reading → Microsoft is pushing a security update to Windows 11 that breaks File Explorer By Sofia Elizabella Wyciślik-Wilson 2 weeks ago Tweet 2 Comments The last round of security updates saw Microsoft release the KB5051987 update for Windows 11. As this patch addresses a number of security issues with the operating system, it is a mandatory update that will be automatically installed for most people. As we’ve seen time and time again, the automatic installation of security updates is a good thing... until it isn’t. And with the KB5051987 update, there are numerous problems that raise the question of whether it is advisable to have Microsoft pushing out obligatory patches that can wreak havoc. Continue reading → Winhance transforms Windows 11 (and Windows 10) into the bloat-free, faster operating system you always wanted By Wayne Williams 2 weeks ago Tweet No Comments You can tell that people aren’t overjoyed with Windows 11 by the number of great third-party tools that have been developed to fix the OS. The most recent of these is Talon, which can debloat Windows 11 in just two mouse clicks, removing all the bundled junk that Microsoft has shoehorned into its OS, including Microsoft Edge, OneDrive, Copilot, and Clipchamp. Winhance is another such tool, but it works differently and can be used to debloat and optimize Windows 11 -- and, perhaps just as importantly, keep it that way. Although it’s been designed for Windows 11, it will work just as well on a fully updated version of Windows 10 22H2. Continue reading → Help test Fedora on Microsoft Windows Subsystem for Linux (WSL) before official release By Brian Fagioli 2 weeks ago Tweet No Comments The integration of Fedora into Microsoft’s Windows Subsystem for Linux (WSL) is on the brink of completion, and the Fedora crew is rallying the community for assistance. A testing event is pegged for Monday, February 17, 2025, offering enthusiasts an opportunity to experiment with Fedora under WSL prior to its formal release. If you’re equipped with either Windows 10 or 11 and have some free time, here’s your moment to make a contribution. This Fedora testing event is essentially a community-organized quest for bugs. It welcomes all -- whether you’re a die-hard Fedora supporter or simply intrigued by the idea of Linux within Windows. Requirements include an x86 or AArch64 setup with virtualization capabilities, a readiness to adhere to guidelines, and the capacity to handle downloading large test images. Continue reading → Load More Articles"
