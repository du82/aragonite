title = "Transcend unveils the MTE255S PCIe Gen4 x4 NVMe SSD"
description = "Transcend has launched a new solid state drive that is largely unremarkable. Called “MTE255S,” it features a PCIe Gen4 x4 interface and reaches read speeds of up to 7,400MB/s and write speeds of up to 6,500MB/s. While this performance is hardly the best on the market, it is still quite respectable."
full_description = "Transcend unveils the MTE255S PCIe Gen4 x4 NVMe SSD By Brian Fagioli Published 1 day ago 1 Comment Tweet Transcend has launched a new solid state drive that is largely unremarkable. Called “MTE255S,” it features a PCIe Gen4 x4 interface and reaches read speeds of up to 7,400MB/s and write speeds of up to 6,500MB/s. While this performance is hardly the best on the market, it is still quite respectable. With 1TB and 2TB storage options, the MTE255S comes equipped with a graphene heatsink to assist in cooling.Transcend includes LDPC error correction, though this model sadly lacks a DRAM cache and RAID engine -- something to strongly consider if you need sustained high-speed writes. (adsbygoogle = window.adsbygoogle || []).push({}); Manufactured in Taiwan, the MTE255S comes with a five-year limited warranty. Pricing details haven’t been disclosed, unfortunately, but I expect it to be affordable like the company’s other offerings. 1 Comment Tweet Datacolor LightColor Meter brings Bluetooth precision to photographers and filmmakersTranscend unveils the MTE255S PCIe Gen4 x4 NVMe SSDGet ready to say goodbye to Skype (if you haven't already)Best Windows apps this week87 percent of enterprises are deploying passkeysApple announces new features to help protect children, including a revamped age rating system for the App StoreNavigating NIS 2 compliance [Q&A] Who needs Windows 11? FreeXP is a modern version of Microsoft's greatest OS, powered by Debian Linux66 CommentsWindows 12 won't pull me away from Linux unless Microsoft fixes these 5 things48 CommentsAR OS 2 is everything we want Windows 12 to be -- and more38 CommentsWindows Vista 2025 Edition fixes Windows 11's biggest problems -- download it now26 CommentsGoogle is the latest tech firm to drop diversity hiring targets following Trump’s executive orders24 CommentsNew Firefox terms of use could push users to Google Chrome24 CommentsTransform Windows 10 or 11 into Windows 7 in just five clicks16 Comment