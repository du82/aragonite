full_description = "Best Windows apps this week By Martin Brinkmann Published 3 months ago No Comments Tweet Six-hundred-twenty-four in a series. Welcome to this week's overview of the best apps, games and extensions released for Windows 10 and Windows 11 on the Microsoft Store and elsewhere in the past seven days. Microsoft reaffirmed its position on the TPM 2.0 requirement of its Windows 11 operating system. The company called it non-negotiable. That is bad news for Windows 10 customers whose devices do not support it. (adsbygoogle = window.adsbygoogle || []).push({}); The Microsoft Store got a whole range of improvements and changes this week. Microsoft promises that it is faster, better organized, and offers support for Win32 apps. As always, if I've missed an app or game that has been released this week that you believe is particularly good, let me know in the comments below or notify me via email. Discounts this week The following list is a selection of the best deals. Make sure you check out the Store for all offers. Some apps are discounted for more than one week. Only new apps and games are listed below. Check out the previous post in the series for past offers that may still be valid. Chemical Structure Viewer for $0.99 JSON Viewer & Formatter for $1.49 Markdown to HTML Converter for $0.99 Memory quilt for $0.99 Notemarks - Support Markdown for $1.09 S Renamer for $0.99 New or notably improved Windows apps Handbrake 1.9.0 The open source video encoder is a handy program to convert one video format to another. The latest version adds support for lossless VP9 encoding, AV1 screen content coding, and Intel QSV VVC video decoding. Media Squeeze Media Squeeze uses compression to reduce the size of image or video formats on the device. The interface is intuitive and easy to use. Settings give you control over the output and there is an option to compare files. PixTidy PixTidy is a free app to organize photos. It supports creating folders based on place and time, and supports further grouping options. It may also help identify unneeded or unwanted photos or videos, which you may then delete to free up disk space. Image Credit: Martinmark / Dreamstime.com No Comments Tweet Comments are closed."
