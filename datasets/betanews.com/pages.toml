["https://betanews.com/2025/02/21/its-possible-to-run-windows-xp-on-an-apple-tv-and-it-works-like-a-dream"]
title = "It's possible to run Windows XP on an Apple TV -- and it works like a dream!"
description = "Windows XP hasn’t been supported by Microsoft for a decade now, but it’s in use in many places. According to the most recent figures from Statcounter, the ancient OS still holds 0.27 percent of the Windows market, placing it above Windows 8/8.1."
full_description = "It's possible to run Windows XP on an Apple TV -- and it works like a dream! By Wayne Williams Published 1 week ago 3 Comments Tweet Windows XP hasn’t been supported by Microsoft for a decade now, but it’s in use in many places. According to the most recent figures from Statcounter, the ancient OS still holds 0.27 percent of the Windows market, placing it above Windows 8/8.1. There is even a Linux version of XP that you can run if you want a hit of nostalgia, but don’t want to risk using an unsupported OS. You’ve no doubt seen Doom running on all sorts of hardware, and XP is similar in some respects. We’ve already seen it running on Apple’s Vision Pro, and now it appears that with a bit of creative thinking it’s possible to run Windows XP on an Apple TV. (adsbygoogle = window.adsbygoogle || []).push({}); SEE ALSO: Who needs Windows 11? FreeXP is a modern version of Microsoft's greatest OS, powered by Debian Linux Windows XP 2024 Edition is everything Windows 11 should be Watch Windows XP running on Apple Vision Pro This isn't Windows XP -- it's a new version of Windows 10, and you can install it now for free In truth, it won’t run on every Apple TV. In fact, you will need the original version for it to work, as this model shipped with an Intel Pentium M processor and 256 MB of RAM, which is powerful enough to handle the OS. Nobel Tech documented the process in a video, which you can watch below. It was achieved thanks to DistroHopper39B who managed to port Windows XP to the original Apple TV using ReactOS, because, as the video notes, Apple TV doesn’t have a Legacy BIOS module built-in. The original Apple TV for this video was supplied to Nobel Tech by the Australian Computer Museum Society (ACMS). As you can see, Windows XP ran exactly as expected, with everything working except for graphics acceleration. 3 Comments Tweet Datacolor LightColor Meter brings Bluetooth precision to photographers and filmmakersTranscend unveils the MTE255S PCIe Gen4 x4 NVMe SSDGet ready to say goodbye to Skype (if you haven't already)Best Windows apps this week87 percent of enterprises are deploying passkeysApple announces new features to help protect children, including a revamped age rating system for the App StoreNavigating NIS 2 compliance [Q&A]"
