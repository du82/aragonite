["https://betanews.com/topic/apple"]
title = "Apple"
description = "BetaNews is a leading source of technology news and analysis."
full_description = '''Apple announces new features to help protect children, including a revamped age rating system for the App Store By Sofia Elizabella Wyciślik-Wilson 2 days ago Tweet No Comments Apple has just announced a series of new tools, features and improvements that it says will “help parents protect their kids in a way that is designed around privacy”. One of the biggest changes is an overhaul of the age rating system that is used in the App Store, with the number of categories expanding to five. But this is far from being the only changes Apple is unleashing. Continue reading → The encryption backdoor debate: Why are we still here? By Jeremy Bradley 5 days ago Tweet 3 Comments Earlier this month, reports emerged that the UK government had pressured Apple, under the Investigatory Powers Act 2016, to create a backdoor into encrypted iCloud data. Unlike targeted access requests tied to specific cases, this demand sought a blanket ability to access users’ end-to-end encrypted files. Apple was forced to reconsider its Advanced Data Protection service in the UK, and this latest development raises a fundamental question: Why does the debate over encryption backdoors persist despite decades of technological progress and repeated warnings from cybersecurity experts? Continue reading → Apple has removed its strongest data protection from UK users -- why and what does it mean? By Ian Barker 6 days ago Tweet 3 Comments Apple's Advanced Data protection allows the data that its users store in iCloud to be end-to-end encrypted. On Friday of last week the company announced that it would be removing this tool from users in the UK. The move follows a demand from the UK government to allow 'backdoor' access into data in order to investigate crime. The problem is that even Apple can't access ADP protected data and the company argues that a backdoor would be exploited by attackers. Continue reading → Apple News+ Food is coming soon By Brian Fagioli 1 week ago Tweet No Comments As a fat and nerdy guy, two of my favorite things in the world are technology and food. And so, when Apple announced News+ Food today, my tummy rumbled in anticipation. But what exactly is it? Quite simply, News+ Food is a new section of the Apple News+ service that is dedicated to -- you guessed it -- food! This new section encompasses all things culinary, such as recipes, restaurant reviews, and healthy eating, to name but a few. Continue reading → It's possible to run Windows XP on an Apple TV -- and it works like a dream! By Wayne Williams 1 week ago Tweet 3 Comments Windows XP hasn’t been supported by Microsoft for a decade now, but it’s in use in many places. According to the most recent figures from Statcounter, the ancient OS still holds 0.27 percent of the Windows market, placing it above Windows 8/8.1. There is even a Linux version of XP that you can run if you want a hit of nostalgia, but don’t want to risk using an unsupported OS. You’ve no doubt seen Doom running on all sorts of hardware, and XP is similar in some respects. We’ve already seen it running on Apple’s Vision Pro, and now it appears that with a bit of creative thinking it’s possible to run Windows XP on an Apple TV. Continue reading → Apple iPhone 16e brings flagship features at a budget price By Wayne Williams 2 weeks ago Tweet 1 Comment Apple has announced the iPhone 16e (yes, not SE), the latest addition to its iPhone range. The Cupertino-based tech giant describes the new device as a more affordable option for users looking to experience what the iPhone 16 has to offer. “iPhone 16e packs in the features our users love about the iPhone 16 lineup, including breakthrough battery life, fast performance powered by the latest-generation A18 chip, an innovative 2-in-1 camera system, and Apple Intelligence,” said Kaiann Drance, Apple’s vice president of Worldwide iPhone Product Marketing. “We’re so excited for iPhone 16e to complete the lineup as a powerful, more affordable option to bring the iPhone experience to even more people.” Continue reading → Google makes buying books easier for Play Books users on Apple iPhone By Brian Fagioli 2 weeks ago Tweet No Comments If you’re the type of person who loves to dive into a good book, Google has just made things simpler for you on your iPhone (and iPad). Historically, Play Books has been great for reading ebooks and audiobooks, but buying them on iOS was less than ideal. That’s changing now. Google has introduced a new “Get Book” feature in the Play Books iOS app, which now directly navigates you to the Google Play website for a seamless purchase. Gone are the days of navigating through confusing mazes; just tap, buy, and start your reading without distractions. Continue reading → Apple now lets you transfer purchases from one account to another -- Google should be taking notice! By Sofia Elizabella Wyciślik-Wilson 2 weeks ago Tweet 3 Comments Many people have more than one Apple Account, and it can be frustrating to have to bounce from one to another just to manage digital purchases. If only there was a way to consolidate everything into one account... Well, now there is! Apple has quietly launched a new option to migrate apps, music, and other purchased content from one Apple Account to another. There are, of course, caveats, and it’s not a feature that is available everywhere, but it is an exciting development that will make Android users jealous. Continue reading → Apple finally brings the Apple TV app to Android By Sofia Elizabella Wyciślik-Wilson 2 weeks ago Tweet 4 Comments There is a sensible logic to Apple focusing on creating and improving apps that work on its own devices, but the company sometimes has to acknowledge the fact that not every phone and tablet out there is an idevice. The latest app release from the iPhone-maker is proof of this in action. After far, far too long overlooking the platform, the company has now released the Apple TV app for Android users. The launch comes ahead of the 2025 season of Major League Soccer, and there is even the option to test drive the service for free. Continue reading → Apple is renaming the Gulf of Mexico in Apple Maps… and is going further than Google By Sofia Elizabella Wyciślik-Wilson 3 weeks ago Tweet 4 Comments Shortly after Google Maps changed the name of the Gulf of Mexico to the Gulf of America, Apple Maps is starting to do the same. When Google rolled out the name change at the weekend, the company took a three-pronged approach which means three different naming conventions are used in different parts of the world. Having started to implement the name change itself, Apple is showing that it is willing to do more than Google by making the change global. Continue reading → Microsoft and Apple should take a long hard look at Elon Musk’s ‘Big Balls’ By Brian Fagioli 3 weeks ago Tweet 10 Comments Elon Musk has a reputation for rewriting the rules, and his latest venture at the helm of the Department of Government Efficiency (DOGE) is no exception. He’s brought on a 19-year-old known as "Big Balls" to help overhaul how the government operates, causing quite the stir, not only because of the nickname, but because of his young age. "Big Balls" isn't just a provocative moniker regarding large testicles, however. Actually, this name more likely embodies courage, bold decision-making, and a defiance against conventional challenges. These are the traits that fuel breakthroughs, and let's face it -- big tech could benefit from infusing some of that spirit into their operations. Continue reading → UK government asks Apple to give it backdoor access to encrypted user data By Sofia Elizabella Wyciślik-Wilson 3 weeks ago Tweet 6 Comments The UK government has used the Investigatory Powers Act (IPA) to issue Apple with a “technical capability notice” requiring the company to create a backdoor into its encrypted cloud services. The Home Office is specifically interested in bypassing the encryption that secures Apple’s Advanced Data Protection (ADP) service. This cloud service includes a wealth of user data and, thanks to the use of end-to-end encryption, cannot be accessed by anyone other than the account holder. The UK government demand is part of legislation that forces companies to help law enforcement with investigations, but creating a backdoor would allow a level of access that even Apple does not currently have -- and there are concerns about the potential for abuse. Continue reading → MLS Season Pass returns to Apple TV for 30th season but do Americans really care? By Brian Fagioli 1 month ago Tweet No Comments Major League Soccer is back on Apple TV, and if you’re one of the people who actually follows the league, you can once again stream every match with no blackouts through MLS Season Pass. Starting today, fans in over 100 countries can subscribe, unlocking access to all regular-season games, the MLS All-Star Game, and even the playoffs. Exciting, right? The 2025 season kicks off on February 22, marking year three of Apple’s 10-year deal with MLS. This season also introduces the league’s latest expansion team, San Diego FC, because apparently, North America just can’t get enough soccer teams. Eddy Cue, Apple’s senior VP of Services, hyped up the service, saying, “MLS Season Pass delivers fans exactly what they want.” That may be true for soccer diehards, but let’s be honest -- MLS is nowhere near the NFL, NBA, or even MLB in terms of mainstream appeal. Continue reading → Google Maps will honor President Trump’s renaming of the Gulf of Mexico to the Gulf of America and Denali to Mount McKinley By Sofia Elizabella Wyciślik-Wilson 1 month ago Tweet 3 Comments One of Donald Trump’s first pledges after being sworn in as the 47th president of the USA was to rename both the Gulf of Mexico and Denali. This was very quickly acted upon when he signed a slew of executive orders -- something the White House described as “honoring American greatness”. Seen variously as controversial, symbolic, patriotic, confrontational and more, the changes of the names have sparked global debate. One question that has been raised a lot over the last week has been whether the likes of Apple Maps and Google Maps will implement the changes as well -- although not globally. Continue reading → Apple decides to disable its broken AI-powered news summaries By Sofia Elizabella Wyciślik-Wilson 1 month ago Tweet No Comments While Apple was excited to roll out news summaries powered by artificial intelligence, the reception has been somewhat muted because of some serious issues. The Apple Intelligence notification summaries were found to be sharing misleading or incorrect news headlines. The BBC and other news outlets complained that their names were being used to spread misinformation, and Apple responded by promising an update to the service. For now, though, the company seems have to changed its mind, opting instead to simply disable notification summaries. Continue reading → Load More Articles'''
