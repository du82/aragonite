full_description = "Best Windows apps this week By Martin Brinkmann Published 1 month ago No Comments Tweet Six-hundred-thirty in a series. Welcome to this week's overview of the best apps, games and extensions released for Windows 10 and Windows 11 on the Microsoft Store and elsewhere in the past seven days. Next month, Microsoft will install the new Outlook app as part of the February security updates on all unmanaged PCs. Microsoft says there is no way to block that initial installation, but users can remove it again and block it afterwards. (adsbygoogle = window.adsbygoogle || []).push({}); SEE ALSO: Optimum 10 Pro is an upgraded version of Windows 10 with next-level performance, privacy and control As always, if I've missed an app or game that has been released this week that you believe is particularly good, let me know in the comments below or notify me via email. Discounts this week The following list is a selection of the best deals. Make sure you check out the Store for all offers. Some apps are discounted for more than one week. Only new apps and games are listed below. Check out the previous post in the series for past offers that may still be valid. Crosshair X for €5.59 Diarium: Journal & Diary for €6.99 Finebits AppPack for €9.99 MagicPods for €0.99 Movie Maker - Video Editor by Nero Pro for €24.99 Scrble Ink for €6.99 New or notably improved Windows apps Auslogics BoostSpeed 14 (free limited, $19.95) BoostSpeed is a system tweaker and optimization software for Windows. It comes with more than 20 different tools, including a new hardware monitor that notifies users about hardware issues, such as critical temperature levels of components. Hash Tool Hash Tool is a free application for Windows to calculate the hash of individual or multiple files. Hashes are often used for verification purposes, for instance to verify that a download succeeded or a backup is not corrupt. Wo Mic Wo Mic is a free tool that turns any Android phone or iPhone into a microphone for your PC. It requires that you install an app on your mobile and on the PC. Its main purpose is giving you access to a microphone on your PC at that moment, e.g., after your dedicated microphone stopped working. No Comments Tweet"
