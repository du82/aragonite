["https://betanews.com/2025/02/27/mta-google-pixel-ai-subway"]
title = "MTA uses Google Pixel smartphones and AI to detect subway track defects"
description = "The subway in NYC has received a huge upgrade, but it’s probably not at all what you’d expect. No, it is not coming in the form of new trains or renovations to stations (even though that would be great). Actually, the MTA is testing a system that effectively transforms Google Pixel Android smartphones into powerful diagnostic tools for tracking rail defects!"
full_description = "MTA uses Google Pixel smartphones and AI to detect subway track defects By Brian Fagioli Published 2 days ago 2 Comments Tweet The subway in NYC has received a huge upgrade, but it’s probably not at all what you’d expect. No, it is not coming in the form of new trains or renovations to stations (even though that would be great). Actually, the MTA is testing a system that effectively transforms Google Pixel Android smartphones into powerful diagnostic tools for tracking rail defects! The project, called “TrackInspect,” attaches Google Pixel phones to subway cars. Then, by using the Android devices’ built-in microphones and motion sensors, it detects vibrations and sound patterns. These sounds can indicate areas of track that may need maintenance. How cool is that? (adsbygoogle = window.adsbygoogle || []).push({}); Once the data is collected, it is uploaded to Google Cloud, where AI analyzes it. By highlighting areas that might need attention, it allows human crews to focus on specific sections of track. This is far more efficient than conducting broad, time-consuming inspections. During the pilot, the MTA successfully gathered a shocking amount of data -- an insane 335 million sensor readings, a million GPS locations, and 1,200 hours of audio recordings. TrackInspect was able to identify 92 percent of the track defects that human inspectors later confirmed. If the results continue to be promising, subway riders could see many benefits, including fewer delays, quicker repairs, and a more reliable transit system. And look, what started with Google Pixel phones mounted on subway cars might end up changing the way track inspections are handled across the system -- that is undeniably amazing. Photo Credit: littleny/Shutterstock 2 Comments Tweet Datacolor LightColor Meter brings Bluetooth precision to photographers and filmmakersTranscend unveils the MTE255S PCIe Gen4 x4 NVMe SSDGet ready to say goodbye to Skype (if you haven't already)Best Windows apps this week87 percent of enterprises are deploying passkeysApple announces new features to help protect children, including a revamped age rating system for the App StoreNavigating NIS 2 compliance [Q&A]"
