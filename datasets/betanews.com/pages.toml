full_description = '''Enterprises set to waste billions due to lack of cloud cost awareness among developers By Ian Barker 4 days ago Tweet No Comments A disconnect between FinOps and development teams is leading to wasted spend on cloud infrastructure costs according to 52 percent of engineering leaders. Research from software delivery platform Harness finds developers have limited insight into cloud waste. Fewer than half of respondents say they have access to real time data on idle cloud resources (43 percent), unused or orphaned resources (39 percent), and over or under-provisioned workloads (33 percent). Continue reading → Five ways data platforms are underpinning the second cloud revolution By Paul Mackay 4 days ago Tweet No Comments According to Gartner, over the next few years hybrid cloud will become the de facto approach for unlocking value from data. The projections are stark. Nine-in-ten organizations will adopt a hybrid cloud model by 2027, and end user spending globally on public cloud will grow by 21.4 percent this year alone, reaching more than $723 billion. Application services, system infrastructure services and Platform-as-a-Service (PaaS) will all see a boost in spending as well. By anyone’s money, these are huge numbers. This second cloud revolution is being driven by data. When combined with analytics, data is a uniquely valuable asset for any business. If harnessed correctly, it can grow revenue, reduce costs, and entirely transform a business by opening up fresh market opportunities through the use of new technologies like GenAI. Continue reading → You can get Office apps for free if you're willing to opt for an ad-supported Microsoft 365 subscription By Sofia Elizabella Wyciślik-Wilson 5 days ago Tweet 2 Comments The gradual move towards a subscription-based model for software payments has been continuing for a number of years now -- and the costs can soon add up. For anyone who is looking for ways to make things a bit less of a strain on their wallet, Microsoft has come up with a solution -- ad-supported versions of its Office apps. If you are happy to endure advertising in the likes of Word and Excel, you can opt for a free Microsoft 365 subscription. Sadly, ads are not the only catch. Continue reading → Meta announces that Facebook Live videos will no longer be saved forever By Sofia Elizabella Wyciślik-Wilson 1 week ago Tweet 1 Comment Meta has made a surprise announcement about Facebook Live video. The company has updated its video storage policy, and this means that live streams will no longer be stored indefinitely. This is a significant change from the social media giant. Meta says that it is aligning its storage policies with industry standards, and the impact will be noticed by many. Videos that were once stored forever will now be automatically deleted after just 30 days -- so you need to act now. Continue reading → Shaping the future of cloud security with CNAPP [Q&A] By Ian Barker 3 weeks ago Tweet No Comments As cloud environments become complex, security teams face increasing challenges in detecting, prioritizing, and addressing risks. While cloud security posture management (CSPM) tools were created to provide visibility into cloud configurations and cloud workload protection platforms (CWPP) to manage threats to cloud workloads, they created gaps in providing holistic context that enables efficient risk management and didn't extend across the full software development life cycle (SDLC). Continue reading → Over 60 percent of enterprise cybersecurity incidents relate to known risks By Ian Barker 4 weeks ago Tweet No Comments A new Cloud Risk Exposure Impact Report from ZEST Security shows that 62 percent of incidents are directly related to risks the security team had previously identified, researched fixes for, and had open tickets for remediation in the backlog. The survey of over 150 security decision makers working in large US enterprises reveals that it takes 10 times longer to remediate vulnerabilities than it takes for attackers to exploit them, highlighting a significant advantage for attackers. Continue reading → The role of private clouds in enterprise data strategy [Q&A] By Ian Barker 1 month ago Tweet No Comments As AI reshapes business operations, companies are facing new challenges around cost uncertainty, security, and data integrity. The rise of hybrid cloud strategies -- combining private clouds with public infrastructure -- is becoming a key approach to addressing these concerns. While enterprises focus on cost control, safeguarding sensitive corporate data, and preventing AI-driven data leakage, they are also trying to leverage LLMs to exploit data in the public cloud while retaining sensitive data in private clouds that they control. Continue reading → The human-centric approach to moving to the cloud [Q&A] By Ian Barker 1 month ago Tweet 1 Comment Over the past decade, cloud computing has emerged as a transformative force, promising unprecedented efficiency and scalability. However, despite the rush for businesses to adopt this technology, many cloud projects still fail to meet their stated objectives Continue reading → Security and compliance are biggest barriers to cloud adoption By Ian Barker 2 months ago Tweet 2 Comments Cloud adoption is at the heart of digital transformation, providing organizations with the agility and flexibility they need to stay competitive in today's rapidly changing marketplace. A new report from Fortinet looks at the latest trends, challenges, and strategies shaping cloud security, include safeguarding sensitive data, ensuring regulatory compliance, and maintaining visibility and control across increasingly complex hybrid and multi-cloud environments. Continue reading → New LLM-powered engine helps secure complex cloud environments By Ian Barker 2 months ago Tweet No Comments While moving systems to the cloud delivers many benefits, it also leads to complex dynamic environments that can be a real challenge when it comes to keeping them secure. With the launch of a new Large Language Model (LLM)-powered cloud detection engine, Sweet Security aims to cut through the noise and allow security teams to tackle these environments with greater precision and confidence. Continue reading → Microsoft increases its focus on artificial intelligence by creating a new CoreAI team By Sofia Elizabella Wyciślik-Wilson 2 months ago Tweet No Comments Microsoft continues to bet big on AI and the company has created a new artificial intelligence engineering division called CoreAI. The new development-focused unit is headed by Jay Parikh -- once Meta's VP and global head of engineering -- and the intention is to speed up AI infrastructure and software development at Microsoft. CEO Satya Nadella describes 2025 as being "about model-forward applications that reshape all application categories". Nadella clearly wants to power forward in what he says is the "next innings of this AI platform shift". Continue reading → Navigating challenges and opportunities of cloud migrations in 2025 By Aaron Wadsworth 2 months ago Tweet No Comments As 2025 approaches, the role of cloud migrations in organizational strategy continues to intensify. In our current era of accelerated digital transformation, businesses face the dual challenge of optimizing their operations and navigating complex compliance requirements. Cloud technologies stand at the forefront of this transformation, offering scalability, operational flexibility, and data management capabilities that are essential for success in today’s digital economy. In addition, the evolution of data sovereignty laws requires businesses to adjust how they handle and store data and evaluate the infrastructures that support their global operations. Continue reading → A hybrid approach could put your organization on cloud nine By Andy Bevan 2 months ago Tweet No Comments Until recently, many organizations’ ‘cloud-first’ strategies in reality meant ‘cloud-only’ (and more specifically, public cloud). Indeed, it wasn’t really a strategy, rather more an aspiration. However, fast forward to today and many organizations are realizing that public cloud providers can’t fully meet all their needs and priorities. In fact, most organizations will never be fully on the public cloud for a number of reasons: Continue reading → Microsoft faces massive class action payouts in cloud computing pricing case By Sofia Elizabella Wyciślik-Wilson 3 months ago Tweet 1 Comment Microsoft could be hit with over £1 billion ($1.27 billion) in charges if a huge class action case brought against the firm by UK businesses succeeds. The case centers around Windows Server, with Microsoft being accused of overcharging customers for the software. The licensing terms of the associated Azure, the lawsuit says, mean that users are channelled towards using Microsoft’s cloud offering because it pushes up the prices of services from rivals like Google and Amazon. Continue reading → How to address cloud-native security risks in 2025 By Jonathan Lerner 3 months ago Tweet No Comments Gartner predicts that public cloud end-user spending will surpass $675 billion by the end of 2024. In 2025, as AI systems proliferate and organizations increasingly store sensitive data in public cloud infrastructure, many stakeholders will begin demanding more robust cloud security measures. Additionally, cybercriminals are becoming more inventive than ever. They now rely on AI and machine learning (ML) to improve and iterate on their methods, just as we all do. Interestingly, despite advances in cloud security, research suggests that common vulnerabilities like unenforced multi-factor authentication (MFA) and long-lived credentials continue to expose many companies to risk. Patching these known vulnerabilities will be crucial next year. Continue reading → Load More Articles'''
year_published = 2025
