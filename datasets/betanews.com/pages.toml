full_description = '''LibreELEC 12.0.2, the Linux distribution for Kodi, gets feature-packed Omega 21.2 update By Brian Fagioli 1 month ago Tweet No Comments LibreELEC, the lightweight Linux distribution designed exclusively to run Kodi, has released version 12.0.2. This latest update brings Kodi (Omega) 21.2 along with several notable changes and improvements. However, users running 64-bit ARM SoC devices like the Raspberry Pi 4 or 5 should pay close attention to the transition from ‘arm’ to ‘aarch64’ userspace. Due to this switch, manual updates through LibreELEC settings won’t show version 12.0 releases on these devices, as there are no matching arm images available. To update, users will need to manually place a LibreELEC 12 file into /storage/.update and reboot. Continue reading → How to install Kodi 21.2 Omega on Amazon Fire TV Stick (the easy way) By Wayne Williams 1 month ago Tweet 2 Comments Kodi 21.2 Omega has just been released, bringing with it a range of fixes and improvements. It is the latest update for the hugely popular home theater software, coming ahead of the launch of Kodi 22 Piers, which is expected to arrive (in Alpha form) in the coming months. For a lot of users, running Kodi on an Amazon Fire TV Stick (or Firestick as it’s more commonly known) is the best way to enjoy the software and everything it has to offer, giving users access to a wide array of streaming services and media libraries. Continue reading → Kodi 21.2 'Omega' has arrived and you should download it immediately! By Wayne Williams 1 month ago Tweet 1 Comment The Kodi Foundation is still hard at work on Kodi 22 'Piers', with an Alpha release expected in the coming months. The team hasn’t forgotten Kodi 21 users however, and a new build for that branch has just been released. It's been five months since Kodi 21.1 'Omega' arrived, and now the Kodi Foundation has rolled out a new build, Kodi 21.2, with a raft of changes, fixes and improvements. Continue reading → Stunning limited-edition Kodi-themed Raspberry Pi 5 case now available, with Black Friday savings By Wayne Williams 3 months ago Tweet No Comments Team Flirc and Team Kodi have announced the release of the Flirc Raspberry Pi 5 Case, Kodi Edition. The newly designed case is the result of a collaborative process that invited the Kodi community to participate in its creation, making it a unique offering for fans of the popular home theater platform. The design process began with a crowdsourcing poll on the Kodi forums, where community members were presented with six potential designs and given the opportunity to vote and provide feedback. The final design reflects the input of Kodi users, aligning with the open and community-driven nature of the platform. Continue reading → Kodi 22 'Piers' will be able to automatically delete recordings once you've watched them By Wayne Williams 5 months ago Tweet No Comments Team Kodi is hard at work on the next generation of its hugely popular home theater software. Although it will be a while before we see the first build from the Kodi 22 branch, we do have a good idea of some of the new features and improvements set to make an appearance. One of the features that will be arriving in the future software release will be a forum-requested feature, which will allow users of the PVR & Live TV feature to have Kodi automatically delete recordings once they’ve been watched, freeing up valuable hard drive space. Continue reading → Move over Kodi -- these are the top home theater alternatives you need By Wayne Williams 5 months ago Tweet 3 Comments Kodi has long been a favorite for media enthusiasts, offering a customizable, open-source platform for streaming and managing media libraries, but it's not without its frustrations. The setup process, particularly installing and managing add-ons, isn't as intuitive as it could be, add-ons frequently break or becoming unsupported, and performance problems like buffering and crashes are common, especially on older devices. If you’re searching for Kodi alternatives, you're in luck. There are several media center platforms that provide excellent options for streaming and managing your content. Here’s a look at the top 7 Kodi alternatives, along with key features to watch out for, and the download links you'll need. Continue reading → Kodi 21.1 'Omega' has arrived and you should download it now! By Wayne Williams 6 months ago Tweet No Comments Five months ago, the stable version of Kodi 21 'Omega' was released, introducing a wealth of new features to the hugely popular home theater software. Additions include support for FFmpeg 6, DolbyVision on-the-fly profile conversion, and an in-game player viewer. The Kodi Foundation is now hard at work on Kodi 22 'Piers', with an Alpha release expected soon. It hasn’t forgotten Kodi 21 users however, and a new build for that branch has just been released. Continue reading → Kodi alternative Stremio OS is now available for Raspberry Pi 4 and 5 By Wayne Williams 7 months ago Tweet 5 Comments Stremio OS is now available for Raspberry Pi 4 and 5. This lightweight operating system is designed to run the Stremio media center application, which aggregates streaming content from various services into a user-friendly interface. Unlike Kodi, none of Stremio's addons are installed on your computer so there's no danger of introducing rogue code (Stremio itself is open source). It will recommend content that you might be interested in and tell you if it’s free and where you can find it. It can play HTTP links, as well as magnet links and torrent files (drag and drop). Continue reading → Kodi 22 gets a surprising (but fitting) name -- development for first alpha release well underway By Wayne Williams 8 months ago Tweet No Comments It’s been three months since the Kodi Foundation released Kodi 21 ‘Omega’, the long-awaited latest version of its hugely popular home theater software. As you would expect, the team took a well-deserved break following the program's release, but work is once more underway on the next incarnation, Kodi 22. Each version of the software has traditionally been given an alphabetical codename with a sci-fi theme -- "Leia," "Matrix," "Nexus," and "Omega." While Kodi 22’s name will begin with P, it breaks from tradition, but for a beautiful reason. Continue reading → It's finally here! Download Kodi 21 'Omega' now By Wayne Williams 11 months ago Tweet 2 Comments It’s been a long time coming, but Kodi 21 ‘Omega’ is here, and ready for prime time. The latest incarnation of the hugely popular home theater software comes with a number of big new features and improvements. The Kodi Foundation says there have been over 3,750 commits made since Kodi 20 'Nexus' was released to a waiting world on January 15, 2023. Continue reading → The 'pure' version of Kodi for Ubuntu Linux is dead By Wayne Williams 11 months ago Tweet 4 Comments Team Kodi, which has long provided Personal Package Archives (PPA) for Ubuntu users seeking up-to-date and undiluted versions of the hugely popular Kodi media player, has announced the retirement of the service. This decision was apparently made due to the high maintenance overhead associated with its upkeep. As the Linux world gradually transitions towards packaged deployments and containers, The Kodi Foundation says it is planning to use Flatpak for future applications. This move will not only provide a more maintainable "pure" Kodi application, but also extend its accessibility to more distributions than the PPA ever could. Continue reading → Kodi 21 'Omega' RC2 has arrived -- download it now By Wayne Williams 12 months ago Tweet No Comments Two weeks ago, the Kodi Foundation rolled out the first release candidate for Kodi 21 ‘Omega’. Its arrival was proof that the hugely popular home theater software was edging ever closer to being ready for prime time. Today, the company makes the second release candidate available, and the arrival of Kodi 21 'Omega' RC2 coming so quickly on the heels of its predecessor suggests we won't have to wait too much longer for the stable release to arrive. Continue reading → Kodi 21.0 'Omega' RC1 has arrived -- download it now By Wayne Williams 12 months ago Tweet 1 Comment The Kodi Foundation recently detailed the changes it made in Kodi 21.0 ‘Omega’ Beta 3. Now it has rolled out a new build which sees the latest incarnation of the hugely popular home theater software edging ever closer to being ready for prime time. Today sees the arrival of the first Release Candidate for Kodi 21, and it comes with a long list of changes and improvements. Continue reading → Kodi 20 'Nexus' gets yet another 'final' release By Wayne Williams 12 months ago Tweet No Comments The Kodi Foundation is gearing up to release the next version of its popular home theater software, Kodi 21 'Omega', but it is ensuring that users of the current 'Nexus' generation don't get forgotten. Two months ago, the team announced the release of Kodi 20.3, which was intended to be the final update from the Nexus line. However, it turns out it wasn’t the last release for Kodi 20 users. Three weeks ago another final release arrived. And now today, another new one has quietly appeared. Continue reading → This is what's new and changed in the latest new Kodi 21 'Omega' release By Wayne Williams 12 months ago Tweet 1 Comment Kodi 21 -- codenamed 'Omega' -- is the next version of the hugely popular home theater software. The Kodi Foundation rolled out a major update to Kodi 21 two weeks ago but didn’t officially announce it until now, along with the long list of changes to be found in this latest, and possibly last beta release. Continue reading → Load More Articles'''
