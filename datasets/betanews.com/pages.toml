title = "Technology News and Analysis - BetaNews"
description = "BetaNews is a leading source of technology news and analysis."
full_description = "New Firefox terms of use could push users to Google Chrome Forget Windows 12, Windows 11 2025 Edition is the Microsoft operating system we need! Get ready to say goodbye to Skype (if you haven't already) If you sign into your Microsoft account on a public or shared computer, you need to know this by Sofia Elizabella Wyciślik-Wilson How to install Kodi 21.2 Omega on Amazon Fire TV Stick (the easy way) by Wayne Williams BlueAnt X5i Party Speaker packs 120W sound and dynamic LED lights By Brian Fagioli 3 days ago Tweet No Comments BlueAnt has launched the X5i Party Speaker. This speaker offers 120W peak power, seven LED modes, two wireless microphones, and solid, long-lasting battery life. Whether it’s a party, karaoke night, or casual listening session, the X5i should be more than up for the task. CEO Taisen Maddern describes the X5i as an all-in-one audio experience. “It’s been engineered for all audio forms; from punk to pop, from metal to melodic, we’ve ensured audio is the king with the X5i,” he said. “The experience across the board, from the lighting to the battery, makes this the one-stop speaker for all occasions. With amazing bass, even at low volume levels, it makes the music feel live and helps create life’s memorable moments.” Continue reading → Security, privacy and AI code reliability are the biggest development challenges By Ian Barker 3 days ago Tweet No Comments The latest Reveal survey from Infragistics into development concerns shows security (51 percent), AI code reliability (45 percent), and data privacy (41 percent) among their biggest software development challenges for 2025. AI continues to be a major focus, with 73 percent of tech leaders citing expanding the use of AI within organizations as their top priority for 2025. Continue reading → New Firefox terms of use could push users to Google Chrome By Brian Fagioli 3 days ago Tweet 24 Comments Mozilla has long positioned itself as a champion of privacy and open-source software, but its latest move really makes me worry that the organization could be drifting away from those values. You see, Mozilla has introduced Terms of Use for Firefox for the first time ever. Additionally, there is an updated Privacy Notice. And while Mozilla frames this as a move toward transparency, the actual terms are raising some major red flags for me. Mozilla claims these new terms are necessary due to a changing “technology landscape,” yet the fine print tells a far different story. One of the most troubling aspects is that users must grant Mozilla all rights necessary to operate Firefox, including a “nonexclusive, royalty-free, worldwide license” to use information entered through the browser. Mozilla insists this is meant to help users navigate the web, but the vague wording leaves a dangerous amount of room for interpretation. Could this include personal data, saved passwords, or browsing history? Mozilla simply fails to say. Continue reading → VINGUYS Smart Bird Feeder V-Feeder Bamboo with AI camera now available By Brian Fagioli 4 days ago Tweet 3 Comments Imagine for just a moment an advanced bird feeder that feels like a piece of nature itself, carved from eco-friendly bamboo. However, this IP66 waterproof feeder is also equipped with Wi-Fi, solar charging, and an AI camera to bring birdwatching into modern times. There is no need to imagine this product, as it is a reality! The “VINGUYS Smart Bird Feeder V-Feeder Bamboo” is more than just a pretty perch -- it’s got a 2.5K UHD camera that captures both photos and videos. It connects to your home Wi-Fi, albeit 2.4Ghz only, so you can watch the camera on your smartphone. Continue reading → Install the KB5052093 update for Windows 11 to gain taskbar file sharing, Explorer improvements, and endless bug fixes By Sofia Elizabella Wyciślik-Wilson 4 days ago Tweet 2 Comments It's that time of the month when Microsoft releases preview versions of next month’s updates for Windows. For the eager -- and brave -- they provide a way to get early access to new features and options as well as fixes for problems. Windows 11 users now have the KB5052093 update to download and install if they want to jump in ahead of Patch Tuesday, and this is a nice little update that not only patches a bunch of bugs, but adds a tasty selection of new bits and pieces. A highlight is the ability to use a single webcam in multiple apps. Continue reading → Googled yourself and found something you don't like? Google has made it easier to remove search results containing info about you By Sofia Elizabella Wyciślik-Wilson 4 days ago Tweet No Comments There is a high chance that there is information about you online -- there can be very few people for whom this is not true. While it is hard to avoid having an online presence, having personal information appearing in search results can be disturbing, even dangerous. This is precisely why Google’s “Results about you” tool exists. Since 2022, it has been possible to request the removal of personal information from search results using this tool. Now a major redesign makes this process even easier, and lets you request the removal of outdated results too. Continue reading → Enterprises set to waste billions due to lack of cloud cost awareness among developers By Ian Barker 4 days ago Tweet No Comments A disconnect between FinOps and development teams is leading to wasted spend on cloud infrastructure costs according to 52 percent of engineering leaders. Research from software delivery platform Harness finds developers have limited insight into cloud waste. Fewer than half of respondents say they have access to real time data on idle cloud resources (43 percent), unused or orphaned resources (39 percent), and over or under-provisioned workloads (33 percent). Continue reading → AI code assistants speed up development but add to risks By Ian Barker 4 days ago Tweet No Comments New research from Apiiro shows that while AI code assistants are accelerating development times they're also increasing risks. AI code assistants have seen rapid adoption since the launch of ChatGPT in November 2022. Microsoft reports that more than 150 million developers now use GitHub Copilot, up 50 percent over the past two years. Continue reading → 2024 broke records for ransomware attacks By Ian Barker 4 days ago Tweet No Comments Ransomware attacks reached record levels throughout 2024 according to the latest State of Ransomware report from BlackFog. LockBit, one of the most prominent ransomware gangs in recent years, remained the most active ransomware variant through 2024 affecting 603 victims. May was the busiest month, with nearly 200 attacks launched, accounting for 36 percent of all attacks that month. Continue reading → 99 percent of organizations experience API security issues By Ian Barker 4 days ago Tweet No Comments A surge in API adoption, driven by the need for organizations to modernize infrastructures and unlock new revenue streams, is contributing to the rise in API security risk according to a new report. The study from Salt Security finds 99 percent of respondents encountered API security issues within the past 12 months and 55 percent slowed the rollout of a new application due to API security concerns. Continue reading → Why API-first engineering is the way forward for software development By Tishan Dahanayakage 4 days ago Tweet No Comments British software developer and international public speaker on software development, Martin Fowler once famously said: “Any fool can write code that a computer can understand. Good programmers write code that humans can understand.” His book on Refactoring has been a best seller for decades and is a guide on how to transform code safely and rapidly, helping developers build better code. Exactly these same principles should apply when looking to develop an API-first approach to software engineering. But first, what do we mean when we talk about an API-first approach? This is a software development method that prioritizes the design of APIs before writing any other code, instead of treating them as an afterthought. This is different from the traditional approach, where the application code is written first, and the API is added later. Continue reading → Five ways data platforms are underpinning the second cloud revolution By Paul Mackay 4 days ago Tweet No Comments According to Gartner, over the next few years hybrid cloud will become the de facto approach for unlocking value from data. The projections are stark. Nine-in-ten organizations will adopt a hybrid cloud model by 2027, and end user spending globally on public cloud will grow by 21.4 percent this year alone, reaching more than $723 billion. Application services, system infrastructure services and Platform-as-a-Service (PaaS) will all see a boost in spending as well. By anyone’s money, these are huge numbers. This second cloud revolution is being driven by data. When combined with analytics, data is a uniquely valuable asset for any business. If harnessed correctly, it can grow revenue, reduce costs, and entirely transform a business by opening up fresh market opportunities through the use of new technologies like GenAI. Continue reading → Web DDoS attacks up over 500 percent By Ian Barker 4 days ago Tweet No Comments The total number of web DDoS attacks surged 550 percent last year compared to 2023, according to the latest report from Radware. The average duration of network DDoS attacks increased 37 percent over 2023, with North America facing 66 percent of web application and API attacks. Continue reading → Addressing the challenge of non-patchable security [Q&A] By Ian Barker 4 days ago Tweet No Comments While many organizations have solutions in place to identify patchable CVEs, non-patchable security issues such as misconfigurations continue to provide threat actors with consistent access points to exploit organizations. We spoke to Jason Mar-Tang, field CISO at Pentera, to discuss the challenge of non-patchable security issues vs. CVEs, what makes them so much more difficult to identify, the challenges of remediation, and what standards organizations should implement to tackle this challenge. Continue reading → Samsung 9100 PRO SSD delivers insane PCIe 5.0 speeds By Brian Fagioli 4 days ago Tweet 1 Comment If you thought solid state drive manufacturers were going to be slowing down their progress, you should think again. Today, Samsung unveils its 9100 PRO series, and it’s insanely fast. Using PCIe 5.0, it achieves up to 14,800 MB/s read and 13,400 MB/s write speeds! That’s twice as fast as its predecessor. So, yeah, this is a pretty big deal. There are two variants of the SSD -- the standard 9100 PRO and a version with a heatsink for better cooling. Samsung has equipped these drives with a power-efficient 5nm controller, reducing energy use by nearly 50 percent. Impressively, random read/write speeds can hit 2,200K/2,600K IOPS. Continue reading → Load More Articles"
