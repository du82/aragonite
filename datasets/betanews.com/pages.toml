["https://betanews.com/author/mwilson/page/2"]
title = "Sofia Elizabella Wyciślik-Wilson"
description = "BetaNews is a leading source of technology news and analysis."
full_description = "Apple is renaming the Gulf of Mexico in Apple Maps… and is going further than Google By Sofia Elizabella Wyciślik-Wilson 3 weeks ago Tweet 4 Comments Shortly after Google Maps changed the name of the Gulf of Mexico to the Gulf of America, Apple Maps is starting to do the same. When Google rolled out the name change at the weekend, the company took a three-pronged approach which means three different naming conventions are used in different parts of the world. Having started to implement the name change itself, Apple is showing that it is willing to do more than Google by making the change global. Continue reading → Microsoft is forcing the new Outlook for Windows app on Windows 10 users with the mandatory KB5051974 update By Sofia Elizabella Wyciślik-Wilson 3 weeks ago Tweet 11 Comments Windows 10 may not have long left to live (officially, at least), but this does not seem to be stopping Microsoft from using the operating system to piss people off. There are still a few months of updates for Windows 10, and the most recent is the cumulative KB5051974 update. In addition to one of the last batch of security fixes Windows 10 users can expect, the KB5051974 update sees Microsoft doing -- once again -- that thing which wins it few friends: forcibly installing apps. This time around it is the new Outlook for Windows app that’s been force-fed to users. Continue reading → Elon Musk really wants control of OpenAI so he has teamed up with other investors to bid nearly $100bn for it By Sofia Elizabella Wyciślik-Wilson 3 weeks ago Tweet 2 Comments Elon Musk is not happy with the direction he sees OpenAI heading -- so much so that he wants to buy back the artificial intelligence firm he co-founded. The billionaire walked away from OpenAI more than five years ago, but he does not like the way CEO Sam Altman is handling things. Musk being Musk, deep pockets and all, has teamed up with other investors to buy “all assets” of OpenAI. The consortium has put a bid of $97.4 billion on the table, and Musk has stated that he will ensure that (assuming he is able to make the purchase he so desperately wants) “OpenAI [...] return[s] to the open-source, safety-focused force for good it once was”. Continue reading → Google Maps now has multiple ways of referring to the Gulf of Mexico By Sofia Elizabella Wyciślik-Wilson 3 weeks ago Tweet 2 Comments Within moments of being inaugurated as US President earlier this year, Donald Trump vowed to rename the Gulf of Mexico. Sure enough, an executive order followed, changing the name to the Gulf of America -- but there has been the question about how most of the world will refer to it moving forward. On a day-to-day basis, there will be some who use the new name, some who stick with the previous one -- but what about map services? Google previously stated that when the Geographic Names Information System was updated, Google Maps would reflect the new nomenclature. Now the name change has been implemented, but what you see will depend on where you are in the world. Continue reading → Microsoft lies to you if you ask how to uninstall Microsoft Edge By Sofia Elizabella Wyciślik-Wilson 3 weeks ago Tweet 6 Comments There are plenty of people who do not use Microsoft Edge -- it is a long way from being the most popular browser out there. And just like Internet Explorer before, there are also plenty of people who hate Edge so much that they want to uninstall it. As there is no obvious way to do this if you take a look through the options in Windows, you might well search online for instructions. Search Bing (or the Start menu) for “how to uninstall Microsoft Edge” and there’s an entry at the top of the results that links to the office “Uninstall Microsoft Edge”. This really is an official Microsoft page, bearing the description: “Learn how to uninstall Microsoft Edge from your device”. But this is a blatant lie from Microsoft. Continue reading → UK government asks Apple to give it backdoor access to encrypted user data By Sofia Elizabella Wyciślik-Wilson 3 weeks ago Tweet 6 Comments The UK government has used the Investigatory Powers Act (IPA) to issue Apple with a “technical capability notice” requiring the company to create a backdoor into its encrypted cloud services. The Home Office is specifically interested in bypassing the encryption that secures Apple’s Advanced Data Protection (ADP) service. This cloud service includes a wealth of user data and, thanks to the use of end-to-end encryption, cannot be accessed by anyone other than the account holder. The UK government demand is part of legislation that forces companies to help law enforcement with investigations, but creating a backdoor would allow a level of access that even Apple does not currently have -- and there are concerns about the potential for abuse. Continue reading → Meta may have torrented over 80 terabytes of pirated books to train its AI models By Sofia Elizabella Wyciślik-Wilson 3 weeks ago Tweet 1 Comment Just how AI models should be trained has been a subject of debate for some time now, with there being a lot of focus in whether publicly posted social media content is ripe for the picking or not. Now a new lawsuit suggests that Meta has been using pirated ebooks as a data source. Emails that are serving as evidence in a copyright case against Meta appear to show that the Facebook owner has torrented scores of terabytes of data from a number of online resources. Among the places mentioned in newly released unredacted emails are Anna’s Archive, Z-Library and LibGen. Continue reading → TikTok creators can easily share their content to YouTube thanks to new Repurpose.io partnership By Sofia Elizabella Wyciślik-Wilson 3 weeks ago Tweet No Comments YouTube has announced a partnership with Repurpose.io designed to make multi-platform publishing easier than ever. An automated system makes it possible to repost TikTok content, as well as Instagram Reels, as YouTube Shorts. The uncertain future of TikTok in the US has shaken creators who have built up substantial and lucrative followings on the Chinese-owned social platform. YouTube is eager to make the most of this uncertainty, and is clearly hoping that the new Repurpose.io partnership will help it to steal TikTok users. Continue reading → Microsoft makes massive MIDI improvements for musicians using Windows 11 By Sofia Elizabella Wyciślik-Wilson 3 weeks ago Tweet 5 Comments The MIDI (Musical Instrument Digital Interface) standard is decades old, but still going strong. It continues to serve musicians, making it possible to reliably connect a range of instruments to computers. With the latest update to Windows 11, Microsoft ushers in some significant MIDI improvements. The launch of Windows 11 build 27788 sees the arrival of Windows MIDI Services Public Preview. Microsoft describes this as “our complete rewrite of MIDI on Windows with a focus on a great experience for musicians and a strong foundation for future expansion and enhancement”. Importantly, there is now full support for MIDI 2.0. Continue reading → Google is the latest tech firm to drop diversity hiring targets following Trump’s executive orders By Sofia Elizabella Wyciślik-Wilson 3 weeks ago Tweet 24 Comments President Trump has issued a slew of executive orders in the early days of his second stint in the White House. Among these are several designed to cut back on government and federal diversity, equity and inclusion (DEI) initiatives that helped to boost job opportunities for underrepresented groups. Following the executive orders and court rulings, numerous firms -- including tech companies such as Amazon and Meta -- announced that they were rolling back, revising, or killing off their DEI hiring targets. Now Google has followed suit. Continue reading → Microsoft is getting serious about discouraging people from installing Windows 11 on unsupported hardware By Sofia Elizabella Wyciślik-Wilson 4 weeks ago Tweet 8 Comments The system requirements for Windows 11 have been a bone of contention ever since the operating system was first released, but it is something that has been brought back into sharp focus once again as Windows 10 nears the end of its life. Microsoft is keen for everyone to move from Windows 10 to Windows 11, even if this means having to buy a new PC. And in recent days the company has taken steps to encourage just this, using strong-arm tactics to discourage bypassing TPM and CPU requirements. Continue reading → Microsoft is bringing a powerful media transcoding feature to Advanced Paste in PowerToys v0.89 By Sofia Elizabella Wyciślik-Wilson 4 weeks ago Tweet No Comments Fast-paced and innovative development is at the heart of PowerToys, and it’s something we see time and time again when new modules are added -- such as the new ZoomIt tool in the recently released PowerToys v0.88.0. But it is not just the new PowerToys modules that are noteworthy, there are major updates frequently made to existing utilities. On the cards for PowerToys v0.89 is a significant addition to the Advanced Paste tool which will enable the transcoding of media files. Continue reading → Microsoft proclaims “Deprecation isn't the end -- it’s an opportunity” By Sofia Elizabella Wyciślik-Wilson 4 weeks ago Tweet No Comments Microsoft is no stranger to announcing the deprecation of components of Windows, or even entire apps. But what does it mean exactly? The company has tried to make things a little clearer, but it’s up for debate whether it achieved this or not. In a post on the Windows IT Pro Blog, Microsoft starts off by defining deprecation by describing what it is not -- “deprecation is not the end point of the lifecycle”. It is also not to be considered “the end” according to Microsoft. Eh? Continue reading → Microsoft is dropping the privacy protection VPN feature from Microsoft Defender really soon -- unless you pay up By Sofia Elizabella Wyciślik-Wilson 4 weeks ago Tweet 1 Comment Microsoft has very quietly announced that the VPN feature of its Microsoft Defender security tool is going away for anyone unwilling to part with money. In a support document entitled “End of support-Privacy protection (VPN) in Microsoft Defender for individuals”, the company gives very short notice for the dropping of the free tool. When the end of February rolls around, the VPN feature will only be available to users paying for a Microsoft 365 Personal or Family subscription. What does all of this mean? Continue reading → Microsoft releases KB5050094 update to fix audio issues caused by earlier update By Sofia Elizabella Wyciślik-Wilson 1 month ago Tweet 3 Comments When Microsoft released the January security updates for Windows 10 and Windows 11 earlier this month, there were soon complaints from users about audio issues. Having only recently acknowledged a link between the update and the problems, Microsoft has now issued a fix. The release of the KB5050094 update will give those who are willing to install preview versions of updates the chance to get their audio devices working again. The way in which this problem is being address is not ideal, and will raise questions from many people. Continue reading → Load More Articles"
