["https://betanews.com/2024/08/05/watch-windows-xp-running-on-apple-vision-pro"]
title = "Watch Windows XP running on Apple Vision Pro"
description = "For years, Apple famously prevented emulators from appearing in the App Store, but recently it has begun allowing them there. If you’ve ever wanted to play classic games on an iPhone, well, now you can."
full_description = '''Watch Windows XP running on Apple Vision Pro By Wayne Williams Published 7 months ago 1 Comment Tweet For years, Apple famously prevented emulators from appearing in the App Store, but recently it has begun allowing them there. If you’ve ever wanted to play classic games on an iPhone, well, now you can. Although most people will want to use emulators to play games it’s also possible to use them to run operating systems for one computer inside another. (adsbygoogle = window.adsbygoogle || []).push({}); Like Delta and RetroArch, UTM SE: Retro PC emulator has been allowed into the App Store and is also available for Apple’s Vision Pro. YouTuber Darielquinta decided to take advantage of this to see what it would be like to run Windows XP on Apple’s mixed reality headset, mainly because "anything newer will absolutely not work". Things don't run especially smoothly at the beginning. The SE in UTM SE stands for Slow Edition, as you’ll see. Accidentally running a German language installer at the start didn’t help, and then the English version took two hours to install, which is slow even by Microsoft’s previous standards. There were other issues to contend with, as you’d expect, but it’s still a fun experiment. Watch the video and let me know what you think about it in the comments below. 1 Comment Tweet One Response to Watch Windows XP running on Apple Vision Pro Datacolor LightColor Meter brings Bluetooth precision to photographers and filmmakersTranscend unveils the MTE255S PCIe Gen4 x4 NVMe SSDGet ready to say goodbye to Skype (if you haven't already)Best Windows apps this week87 percent of enterprises are deploying passkeysApple announces new features to help protect children, including a revamped age rating system for the App StoreNavigating NIS 2 compliance [Q&A] Who needs Windows 11? FreeXP is a modern version of Microsoft's greatest OS, powered by Debian Linux66 CommentsWindows 12 won't pull me away from Linux unless Microsoft fixes these 5 things48 CommentsAR OS 2 is everything we want Windows 12 to be -- and more38 CommentsWindows Vista 2025 Edition fixes Windows 11's biggest problems -- download it now26 CommentsGoogle is the latest tech firm to drop diversity hiring targets following Trump’s executive orders24 CommentsNew Firefox terms of use could push users to Google Chrome24 CommentsTransform Windows 10 or 11 into Windows 7 in just five clicks16 CommentsForget Windows 12, Windows 11 2025 Edition is the Microsoft operating system we need!14 Comments'''
