description = "Six-hundred-thirty-three in a series. Welcome to this week's overview of the best apps, games and extensions released for Windows 10 and Windows 11 on the Microsoft Store and elsewhere in the past seven days."
full_description = "Best Windows apps this week By Martin Brinkmann Published 3 weeks ago No Comments Tweet Six-hundred-thirty-three in a series. Welcome to this week's overview of the best apps, games and extensions released for Windows 10 and Windows 11 on the Microsoft Store and elsewhere in the past seven days. Windows 10 is reaching its end of support date later this year and millions of devices can't be upgraded to Windows 11 officially because of stricter system requirements. Bypasses are available that work on most incompatible systems. Microsoft did offer instructions on its website about those, but has removed reference recently. (adsbygoogle = window.adsbygoogle || []).push({}); As always, if I've missed an app or game that has been released this week that you believe is particularly good, let me know in the comments below or notify me via email. Discounts this week The following list is a selection of the best deals. Make sure you check out the Store for all offers. Some apps are discounted for more than one week. Only new apps and games are listed below. Check out the previous post in the series for past offers that may still be valid. Finebits AppPack for €9.99 JSON Viewer & Formatter for €1.49 Metro Commander Pro for €4.99 Notemarks - Support Markdown for €1.19 Quick Pad - Fluent Notepad App for €0.99 Recipe Creator for €4.99 New or notably improved Windows apps LibreOffice 25.2 A new version of the popular open source Microsoft-Office-alternative LibreOffice is now available. The changelog is huge, highlights include improved change tracking functionality in Writer, improved DOCX imports, setting a default zoom level for documents, accessibility improvements on Windows, improved themes, and many more. NoBloatbox The open source application-remover for Windows is now also available for Windows 10 officially. Just drop the new Windows.10.json file on the interface to get a list of preinstalled Windows 10 apps that you may then remove from systems. Opera Air Opera Software's new browser focuses on health and mindfulness. Major features include options to take breaks and do exercises, meditations, and to play binaural beats to improve creativity, relieve stress, or stay focused. It is still a Chromium-based browser at its core, which means that it offers excellent web compatibility, performance, and support for Chrome extensions. No Comments Tweet"
