full_description = "Best Windows apps this week By Martin Brinkmann Published 3 months ago No Comments Tweet Six-hundred-twenty-two in a series. Welcome to this week's overview of the best apps, games and extensions released for Windows 10 and 11 on the Microsoft Store and elsewhere in the past seven days. Microsoft released Bing Wallpaper to the Microsoft Store this week. It is not in our list of recommendations though, as Microsoft added lots of PUP -- potentially unwanted programs -- functions to it, including auto-installation of other software, options to decode cookies in non-Microsoft browsers, prompts to make Bing the default search and homepage, and more. I have added an alternative to the list of apps below. (adsbygoogle = window.adsbygoogle || []).push({}); As always, if I've missed an app or game that has been released this week that you believe is particularly good, let me know in the comments below or notify me via email. Discounts this week The following list is a selection of the best deals. Make sure you check out the Store for all offers. Some apps are discounted for more than one week. Only new apps and games are listed below. Check out the previous post in the series for past offers that may still be valid. ChordWriter for $5.49 Paint.Net for $9.99 Quick Pad - Fluent Notepad App for $1.99 SimpleOne Label Maker for $11.24 WinSCP for $4.99 New or notably improved Windows apps Beeskie Beeskie is a Windows app for Bluesky. It is currently in beta, but supports major features. It may be an option for Windows users who prefer to use a dedicated app for the social platform. Bloatynosy Nue The open source app by serial app developer Belim is a restart of the original app. It serves two main purposes: improve privacy on Windows by modifying settings and uninstalling pre-installed apps in the latest Windows 11 versions. Last Wallpaper Last Wallpaper is an open source app that downloads and displays Bing's wallpaper of the day on the Windows desktop each day. The app supports other sources, Copernicus, NASA, Wikipedia, and several others. Adding the sources is a bit complicated, as you need to edit a json file to do that. Still, it works automatically once set up. No Comments Tweet Comments are closed."
