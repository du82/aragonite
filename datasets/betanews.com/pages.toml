["https://betanews.com/topic/AI"]
title = "AI"
description = "BetaNews is a leading source of technology news and analysis."
full_description = '''MTA uses Google Pixel smartphones and AI to detect subway track defects By Brian Fagioli 2 days ago Tweet 2 Comments The subway in NYC has received a huge upgrade, but it’s probably not at all what you’d expect. No, it is not coming in the form of new trains or renovations to stations (even though that would be great). Actually, the MTA is testing a system that effectively transforms Google Pixel Android smartphones into powerful diagnostic tools for tracking rail defects! The project, called “TrackInspect,” attaches Google Pixel phones to subway cars. Then, by using the Android devices’ built-in microphones and motion sensors, it detects vibrations and sound patterns. These sounds can indicate areas of track that may need maintenance. How cool is that? Continue reading → Five ways data platforms are underpinning the second cloud revolution By Paul Mackay 4 days ago Tweet No Comments According to Gartner, over the next few years hybrid cloud will become the de facto approach for unlocking value from data. The projections are stark. Nine-in-ten organizations will adopt a hybrid cloud model by 2027, and end user spending globally on public cloud will grow by 21.4 percent this year alone, reaching more than $723 billion. Application services, system infrastructure services and Platform-as-a-Service (PaaS) will all see a boost in spending as well. By anyone’s money, these are huge numbers. This second cloud revolution is being driven by data. When combined with analytics, data is a uniquely valuable asset for any business. If harnessed correctly, it can grow revenue, reduce costs, and entirely transform a business by opening up fresh market opportunities through the use of new technologies like GenAI. Continue reading → Samsung 9100 PRO SSD delivers insane PCIe 5.0 speeds By Brian Fagioli 4 days ago Tweet 1 Comment If you thought solid state drive manufacturers were going to be slowing down their progress, you should think again. Today, Samsung unveils its 9100 PRO series, and it’s insanely fast. Using PCIe 5.0, it achieves up to 14,800 MB/s read and 13,400 MB/s write speeds! That’s twice as fast as its predecessor. So, yeah, this is a pretty big deal. There are two variants of the SSD -- the standard 9100 PRO and a version with a heatsink for better cooling. Samsung has equipped these drives with a power-efficient 5nm controller, reducing energy use by nearly 50 percent. Impressively, random read/write speeds can hit 2,200K/2,600K IOPS. Continue reading → How cloud security teams should think about AI By Avi Shua 4 days ago Tweet No Comments According to estimates from Goldman Sachs, generative AI (GenAI) will constitute 10-15 percent of cloud spending by 2030, or a forecasted $200-300 billion (USD). The public cloud serves as the perfect vessel for delivering AI-enabled applications quickly, cost-effectively, and at scale. For organizations looking to profit from AI’s potential, the path effectively travels through the cloud. For cloud security teams on the ground, however, the impact of AI can seem complicated. Understanding the challenges it presents, and the key capabilities it enables, can help them work smarter and more effectively. This article explores the three ways cloud security teams should think about AI to enhance protections, improve efficiency, and address resource constraints. Continue reading → Google I/O 2025 is set for May 20-21, 2025 -- here’s what to expect By Brian Fagioli 3 weeks ago Tweet No Comments Mark your calendars, fellow tech fans! Google I/O 2025 is happening on May 20-21 at Shoreline Amphitheatre in Mountain View, California. Can’t make it in person? No worries, you can join in the fun online at io.google -- registration is open now. This is Google’s biggest bash for developers, where the search giant will show off all the cool new stuff in tech, software, and AI. The event will surely offer some big announcements -- think new gadgets and software updates. After that, there’s a whole bunch of workshops, sessions, and meet-ups for everyone to get hands-on and network. Continue reading → Microsoft and Apple should take a long hard look at Elon Musk’s ‘Big Balls’ By Brian Fagioli 3 weeks ago Tweet 10 Comments Elon Musk has a reputation for rewriting the rules, and his latest venture at the helm of the Department of Government Efficiency (DOGE) is no exception. He’s brought on a 19-year-old known as "Big Balls" to help overhaul how the government operates, causing quite the stir, not only because of the nickname, but because of his young age. "Big Balls" isn't just a provocative moniker regarding large testicles, however. Actually, this name more likely embodies courage, bold decision-making, and a defiance against conventional challenges. These are the traits that fuel breakthroughs, and let's face it -- big tech could benefit from infusing some of that spirit into their operations. Continue reading → The future is AI, zero trust, satellite, and network slicing By Dee Dee Pare 3 weeks ago Tweet No Comments Industry 4.0 is revolutionizing how enterprises need to operate. Integrating cloud technology, robotics, mobile devices and IoT devices is essential to staying ahead in an increasingly competitive global market. To maximize the benefits of Industry 4.0, however, these technologies must always stay connected to a network. This has become even more true as IT environments grow to massive scales and unprecedented digital dependencies drive business outcomes. In 2025, network downtime could carry a price tag with consequences we’ve never seen before. Therefore, as businesses look to cellular and/or hybrid approaches to enhance their wireless wide area networks (WWAN), they must depend on four things to create resilient connectivity -- artificial intelligence (AI), satellite, network slicing, and a renewed respect for zero-trust principles. Continue reading → AI in finance changes everything By Swapnil Shinde 3 weeks ago Tweet No Comments Artificial intelligence’s rise in business, while exciting for some, is unsettling for financial professionals. They worry AI will replace them, but understanding its true power in finance turns fear into opportunity. AI isn’t here to take over -- it’s here to level up the game. The real power lies in collaboration, not competition. Finance pros who embrace AI don’t get replaced; they get supercharged. Traditional tedious and time-consuming tasks that keep accountants bogged down -- data entry, invoice processing, reconciliation, reporting, and more -- can now be managed by AI-powered automations. Companies gain two key benefits when they embrace the shift. First, human finance professionals are delivered from the day-to-day routine and freed up to focus on fine-tuning financial strategies in a way that can drive better business outcomes. The demands of manual accounting typically keep finance professionals from having any time to zoom out and deal with big-picture planning. Continue reading → Meta may have torrented over 80 terabytes of pirated books to train its AI models By Sofia Elizabella Wyciślik-Wilson 3 weeks ago Tweet 1 Comment Just how AI models should be trained has been a subject of debate for some time now, with there being a lot of focus in whether publicly posted social media content is ripe for the picking or not. Now a new lawsuit suggests that Meta has been using pirated ebooks as a data source. Emails that are serving as evidence in a copyright case against Meta appear to show that the Facebook owner has torrented scores of terabytes of data from a number of online resources. Among the places mentioned in newly released unredacted emails are Anna’s Archive, Z-Library and LibGen. Continue reading → Unpatched software: The silent gateway to cyber attacks and how AI-driven solutions can close the gap By Mike Walters 3 weeks ago Tweet No Comments Modern enterprises are under fire from all angles. Attackers have become increasingly sophisticated and persistent in how they target enterprise data and systems. But as the threat landscape has evolved and become more complex, one tried and true method for malicious attackers stands out as a weak point for nearly every enterprise attack surface: outdated software. As much as patch management has advanced in recent years, the fact remains that most organizations struggle to deploy patches consistently and effectively, and that leaves systems exposed to cyber attacks. Cybercriminals have become quite adept at exploiting unpatched software, using it as an easy entry point into enterprise networks. Malicious actors have developed an incredibly sophisticated understanding of where enterprise weak points are. In fact, most criminal operators have a deeper understanding of enterprise attack surfaces than the security teams tasked with defending them. Enterprise networks often consist of hundreds of thousands of IT assets, and every single unpatched instance represents an opportunity for attackers to compromise data and operations. Continue reading → IT industry today faces same issues that aggravated 1990s manufacturing: How can we take a cue from history? By Bill Lobig 1 month ago Tweet No Comments Until the late 1990s, manufacturing reigned as the lifeblood of the global economy -- leading in productivity, employment, growth, and investments across all points of the world. However, once we neared the close of the 20th century, manufacturing found its Achilles heel in the compounded complexity accrued from outdated processes, an over-reliance on human labor that simply couldn’t meet its extreme needs, supply chain disruptions, and rising costs. I fear that today, the information technology industry finds itself at all-too-familiar cross-roads. Why is this? Continue reading → I asked ChatGPT and DeepSeek to generate some random lottery numbers -- what happened next defied all odds [updated] By Wayne Williams 1 month ago Tweet 6 Comments For a bit of fun, I thought I would ask ChatGPT to generate a set of numbers for the EuroMillions draw on Friday. Then, seconds later, I asked Chinese upstart DeepSeek to do the same. My plan was to play both sets of numbers and see which, if any, of the two AIs could win me money. The result was not at all what I expected. Continue reading → Celebrating Data Privacy Day: Ensuring ethical agentic AI in our daily interactions By Carolyn Duby 1 month ago Tweet 1 Comment Both AI agents and agentic AI are becoming increasingly powerful and prevalent. With AI agents, we can automate simple tasks and save time in our everyday lives. With agentic AI, businesses can automate complex enterprise processes. Widespread AI use is an inevitability, and the question going forward is not if we’ll use the technology but how well. In a world where AI takes on more responsibility, we need to know how to measure its effectiveness. Metrics like the number of human hours saved or the costs reduced are, of course, important. But we also need to consider things like how ethically and securely our AI solutions operate. This is true when adopting third-party solutions and when training AI in house. Continue reading → Google launches Identity Check, a new location-based security feature, and completes roll-out of AI-powered theft detection By Sofia Elizabella Wyciślik-Wilson 1 month ago Tweet 1 Comment Theft of mobile devices is a crime that is not going away any time soon. Phones are now completely central to so many aspects of life, and the theft (or loss) is about much more than the monetary value of the device itself. There is great potential for a thief to gain access to a wealth of information via a stolen phone. This is why the security of mobile devices is so important, and it is why Google is taking steps to limit the impact of theft. A new feature that is starting to roll out is Identity Check, which requires the use of biometric authentication whenever your device is in an unknown or untrusted location. The company is also harnessing the power of artificial intelligence for good, using AI-powered tools to detect thefts. Continue reading → Hyper-personalization is here -- but are organizations ready? By Rahul Pradhan 1 month ago Tweet No Comments The rising demand for relevant, convenient and personalized customer experiences across all sectors has put modern organizations under pressure to adapt. McKinsey reports that almost three quarters of buyers now expect personalized interactions. The choice is clear: either embrace personalization, with individual offers or tailored updates based on previous habits, or risk falling behind competitors with a standardized approach. Many organizations already do this well. From personalized Netflix movie recommendations to tailored Google adverts built on previous searches, organizations are able to delight customers with tailored services. Continue reading → Load More Articles'''
