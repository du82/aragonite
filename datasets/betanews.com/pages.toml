["https://betanews.com/2025/02/20/amazon-kills-android-appstore-google-play"]
title = "Amazon kills its Android Appstore while Google Play remains the go-to choice"
description = "Amazon has announced that is finally pulling the plug on its Android Appstore, and that’s not all -- Amazon Coins are going down with it too. From August 20, 2025, Amazon says the Appstore on Android devices will be no more. That means no new downloads, no updates, and good luck expecting your existing apps to keep working. If you’re still relying on it, now’s the time to move on."
full_description = "Amazon kills its Android Appstore while Google Play remains the go-to choice By Brian Fagioli Published 1 week ago No Comments Tweet Amazon has announced that is finally pulling the plug on its Android Appstore, and that’s not all -- Amazon Coins are going down with it too. From August 20, 2025, Amazon says the Appstore on Android devices will be no more. That means no new downloads, no updates, and good luck expecting your existing apps to keep working. If you’re still relying on it, now’s the time to move on. If you have subscriptions through the Appstore you will be able to manage or cancel them for now, but once the shutdown happens, it’s all over. That said, Amazon isn’t shutting down the Appstore entirely. It will still exist on Fire TV and Fire tablets, which makes sense since those are Amazon’s own products. But if you’re using a regular Android phone or tablet? Sorry, you’re out of luck. (adsbygoogle = window.adsbygoogle || []).push({}); As for Amazon Coins, the company has stopped selling them as of today, February 20, 2025. If you have any left, you will need to use them before August 20, because after that, they will be totally worthless. Amazon says it will refund Coins bought with real money, but the details for this are murky at best and I certainly wouldn’t wait. The move to shut down the Amazon Appstore was inevitable, really. Google Play has dominated Android from the start, and Amazon’s attempt at an alternative never really took off as it just didn't have the breadth of Google's offering. To be honest, most people probably forgot it even existed. No Comments Tweet Datacolor LightColor Meter brings Bluetooth precision to photographers and filmmakersTranscend unveils the MTE255S PCIe Gen4 x4 NVMe SSDGet ready to say goodbye to Skype (if you haven't already)Best Windows apps this week87 percent of enterprises are deploying passkeysApple announces new features to help protect children, including a revamped age rating system for the App StoreNavigating NIS 2 compliance [Q&A]"
