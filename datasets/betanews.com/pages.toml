full_description = "Best Windows apps this week By Martin Brinkmann Published 2 days ago 1 Comment Tweet Six-hundred-thirty-six in a series. Welcome to this week's overview of the best apps, games and extensions released for Windows 10 and Windows 11 on the Microsoft Store and elsewhere in the past seven days. One option for Windows 10 users who do not want to pay Microsoft for extended support is to switch to Linux once Microsoft's operating system runs out of support. Linux veteran Brian suggests to try a dual boot or VM instead at the beginning, to test the waters. (adsbygoogle = window.adsbygoogle || []).push({}); As always, if I've missed an app or game that has been released this week that you believe is particularly good, let me know in the comments below or notify me via email. Discounts this week The following list is a selection of the best deals. Make sure you check out the Store for all offers. Some apps are discounted for more than one week. Only new apps and games are listed below. Check out the previous post in the series for past offers that may still be valid. FastTranscribe for €3.47 Files App for €7.99 Mega Zoom for €3.47 NoteEase for €2.89 S Renamer for €3.19 Torrex Pro - Torrent Downloader for €4.99 New or notably improved Windows apps DriverStore Explorer The free open source tool gives you better control of the Windows driver store. Core features include enumerating all installed third-party driver packages, adding or exporting drivers, deleting drivers, or detecting old or unused drivers. The tool is an advanced application and runs on Windows 7 or newer. PicPick PicPick is a full-blown scree capturing tool for Windows. It is free for personal use and can capture images and video. Besides that, it comes with an editor to make changes to screenshots, and a truckload of other features. The developers released several updates this year already that improve the loading time of the Editor, stability of the screen recorder, and more. ThisIsNot11 ThisIsNot11 is an open source tweaker for Windows 11. It checks existing settings and installed apps, and bases its recommendations on those. Tweaks are applied with a single click. The second feature of the app supports removing preinstalled Microsoft apps from the operating system. As always, we recommend creating a system backup before using a tweaking tool. 1 Comment Tweet"
