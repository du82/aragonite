["https://betanews.com/topic/linux"]
title = "Linux"
description = "BetaNews is a leading source of technology news and analysis."
full_description = '''New solution automates fixing Linux vulnerabilities By Ian Barker 5 days ago Tweet 1 Comment More than ever enterprises are turning to Linux solutions. But while the open source OS has a good reputation for security that doesn't mean that it’s invulnerable and it's important to stay on top of updates and patching. Seal Security is launching Seal OS, a holistic solution designed to automatically fix vulnerabilities in both Linux operating systems and application code. Continue reading → Do not leave Windows for Linux -- try dual boot or a VM instead By Brian Fagioli 1 week ago Tweet 7 Comments Over the years, I have suggested leaving Windows for Linux many times, with some readers saying I sound like a broken record. In hindsight, however, that was arguably a foolish thing to suggest (in some cases, at least). No, that doesn’t mean I have soured on Linux -- quite the contrary. Actually, I am as enthusiastic as ever! So, have I changed my tune? Well… not entirely. I still think people should install Linux, but instead of replacing Windows, I would suggest dual-booting instead. This way, you get the best of both worlds -- Linux and Windows on one machine. I suppose if you find you don’t ever use Windows, you could get rid of it down the line. But even if you don’t use Windows, why bother getting rid of it? You might find having a Windows installation handy one day. Hey… you never know. Continue reading → Who needs Windows 11? FreeXP is a modern version of Microsoft's greatest OS, powered by Debian Linux By Wayne Williams 2 weeks ago Tweet 66 Comments I appreciate calling Windows XP “Microsoft’s greatest OS” will elicit snorts of derision from a good number of you. That honor probably belongs to Windows 7, or maybe even Windows 10 (once Microsoft ironed out the many problems that plagued it from the start). But certainly, Windows XP was a classic, and a huge step up from the operating systems that preceded it. If you miss XP but aren’t crazy enough to run an OS that (mostly) hasn’t had security updates in over a decade, FreeXP might be just what you’re looking for. It’s not XP, and it’s not from Microsoft, but it looks and feels just like it. Continue reading → Oreon 10, our favorite Windows replacement, has just been updated -- and it's about to get much, much better! By Wayne Williams 3 weeks ago Tweet 14 Comments The biggest problem with saying goodbye to Windows 10 or 11 is knowing what to use instead. macOS is a great choice, but you’ll probably need to buy a Mac to run it, so that makes it an expensive option. There’s no shortage of Linux distros you can use, including the big ones like Ubuntu and Mint, but they aren’t for everyone. One relatively new choice is the stunning Oreon 10 which we declared had "arrived to replace Microsoft Windows" when it launched last December. That OS has just received a big update, but it’s what’s coming next that has us most excited. Continue reading → The stunning EndeavourOS 'Mercury' arrives to replace Microsoft Windows -- download it now! By Wayne Williams 3 weeks ago Tweet No Comments If you’ve had enough of Windows 11, or are considering moving away from Microsoft when the tech giant pulls the plug on Windows 10 later this year, there are plenty of options available to you, ranging from the likes of Nitrux Linux to the just-updated, gorgeous EndeavourOS 'Mercury'. The successor to EndeavourOS 'Neo' has been in development for quite some time, but it's a great update and not only fixes loads of problems but also introduces some great new features. Continue reading → ONLYOFFICE Desktop Editors v8.3 now handles Apple iWork files on Windows, macOS, and Linux By Brian Fagioli 3 weeks ago Tweet 1 Comment Dealing with Apple iWork files on non-Apple systems has always been a bit of a headache, but at least there were solutions. Apps like Microsoft Office and LibreOffice have long been able to deal with iWork formats, converting Pages, Numbers, and Keynote into formats that are more universally accepted. Now, however, with version 8.3, ONLYOFFICE Desktop Editors steps up, adding iWork compatibility for users on Windows, Linux, and macOS platforms. This update lets users peek into iWork files without needing Apple's own software. While you can't edit these files directly yet, there's a conversion tool that can turn them into DOCX, XLSX, or PPTX, making them editable in the familiar formats. This move cuts out the need for extra software or asking for different file types from colleagues. Continue reading → Windows 12 won't pull me away from Linux unless Microsoft fixes these 5 things By Brian Fagioli 3 weeks ago Tweet 48 Comments Windows 12 has been the subject of leaks and speculation, which can be totally fun to discuss and imagine. But let’s be honest, folks -- that operating system is not likely to arrive this year. In fact, it could still be several years away. On a positive note, however, that should give Microsoft plenty of time to make sure the OS is actually worth using. As a regular Linux user, I have some very serious demands if I’m ever going to consider switching, and Microsoft has a golden opportunity to get things right. Here are five things the company needs to deliver before I even think about going with Windows 12. Continue reading → Ubuntu Linux on WSL gets massive upgrade with new tar-based install that makes Microsoft Store optional By Brian Fagioli 3 weeks ago Tweet 1 Comment If you are a Linux fan that is forced to use Microsoft Windows for some reason, you know how valuable Windows Subsystem for Linux is. If you aren’t familiar, WSL allows you to run a Linux environment from within Windows -- no virtual machine needed. It’s pretty wonderful. Well, folks, today, Ubuntu on WSL gets a very useful upgrade that both developers and enterprises should really love. You see, thanks to Microsoft’s new tar-based distribution format, Ubuntu can now be installed and managed without relying on the Microsoft Store. That’s right, y’all -- no more struggling with Store-related headaches. Continue reading → Forget upgrading to Microsoft Windows 11: Nitrux Linux 3.9.0 is the operating system you need! By Wayne Williams 4 weeks ago Tweet 3 Comments With Windows 10 set to reach its end of life later this year, Microsoft has been taking every opportunity to heavily push Windows 11 as the only upgrade path for users. The latest operating system share figures from StatCounter show the message is getting through -- slowly -- with Windows 11 achieving 36.65 percent of the market, an increase of 2.53 percentage points since last month. What that means, of course, is that Windows 10 still has 60.33 percent, suggesting users aren’t in a huge rush to move away from their OS of choice to the AI-riddled sequel. Let’s be honest, Windows 11 isn’t the only game in town for Windows 10 users looking to make the move. One of the more popular alternatives is Nitrux Linux, which has just hit a new milestone. Continue reading → CachyOS February 2025 release is here to make Arch Linux more accessible By Brian Fagioli 4 weeks ago Tweet No Comments CachyOS fans, get ready -- this first release of 2025 (download ISO here) was definitely worth the wait. The team held off until NVIDIA’s latest driver was available to make sure users with Blackwell-based 50xx series GPUs had a seamless experience. Now, with the 570 driver in place, Blackwell support is fully integrated. For those unfamiliar, CachyOS is an Arch Linux-based distribution that focuses on performance and optimization. It builds on the power of Arch while adding aggressive compiler optimizations, a user-friendly setup, and custom tweaks designed to get the most out of modern hardware. Continue reading → Sick of Microsoft Windows? Solus 4.7 could finally get you to switch to Linux By Brian Fagioli 1 month ago Tweet 3 Comments If you’re tired of Microsoft’s bloated Windows operating system, and you are looking for a fresh alternative, Solus 4.7 could be the Linux distro for you. Code-named “Endurance,” this new release (download here) is chock full of updated software, improved hardware support, and polished desktop environments. The name “Endurance” is not random, either -- it was deliberately chosen to reflect the team’s promise to deliver consistent updates and a reliable experience. All four editions of Solus comes with updated core apps, including Firefox 134.0.2, LibreOffice 24.8.4.2, and Thunderbird 128.6.0. Multimedia playback is to the desktop environment you choose. For example, Budgie and GNOME editions ship with Rhythmbox and Celluloid, while Plasma users get Elisa and Haruna, and Xfce uses Parole. Continue reading → Wine 10.0 uncorks smoother support for running Windows apps on Linux By Brian Fagioli 1 month ago Tweet 1 Comment The Wine team has officially released Wine 10.0, marking a full year of extensive development with over 6,000 changes. This stable release introduces major updates designed to improve performance, compatibility, and visual experience when running Windows applications on Linux (and other non-Windows platforms). Perhaps the most impressive arrival in Wine 10.0 is the addition of full support for the ARM64EC architecture, now on par with ARM64. This allows developers to build hybrid ARM64X modules that blend ARM64EC and ARM64 code in a single binary. While currently reliant on an experimental LLVM toolchain, the upcoming LLVM 20 release should streamline support. The update also introduces 64-bit x86 emulation, using ARM64EC to allow Wine’s internal processes to run natively, reducing the need for resource-intensive emulation. Continue reading → Say goodbye to Windows 11 and switch to MX Linux 23.5 for a faster PC By Brian Fagioli 2 months ago Tweet 14 Comments Tired of the constant updates, bloat, and resource demands of Windows 11? Aren't we all? MX Linux could be the perfect solution to your woes, and thanks to its lightweight nature -- especially compared to Windows -- it could make your PC run even faster! The latest version of this lightweight Linux distribution has just been released, offering a Windows alternative that’s fast, user-friendly, and entirely free. Built on the rock-solid Debian 12.9 “Bookworm” base, MX Linux 23.5 combines performance, flexibility, and simplicity -- qualities that Microsoft's operating systems always seems to struggle with. Continue reading → Linux Foundation launches Supporters of Chromium-Based Browsers initiative with backing from Google, Microsoft, Meta, and Opera By Brian Fagioli 2 months ago Tweet No Comments The Linux Foundation has announced the launch of "Supporters of Chromium-Based Browsers," an initiative aimed at funding and supporting open development within the Chromium ecosystem. The purpose of this effort is to provide resources and foster collaboration among developers, academia, and tech companies to drive the sustainability and innovation of Chromium projects. As Jim Zemlin, executive director of the Linux Foundation, explains, “This project will provide much-needed funding and development support for open development of projects within the Chromium ecosystem.” Continue reading → Can siduction OS seduce you into saying goodbye to Windows 11 in 2025? By Wayne Williams 2 months ago Tweet 37 Comments The start of a new year is always a chance to reassess priorities, try to break old habits, and make lifestyle changes that bring us closer to the life we want to live. New Year’s resolutions typically center around health, career, or relationships, but there’s another area worth considering -- the software and tools we rely on daily. If you’ve been thinking about leaving Microsoft Windows 11 behind and diving into the world of Linux, this could be the perfect time to do so. (Like all resolutions there’s no guarantee you’ll stick to it of course, but like that well-meaning health kick, it’s worth giving it a go.) Continue reading → Load More Articles'''
