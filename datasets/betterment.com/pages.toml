title = "User Deposit Cash Reserve Rate Promotion Offer Terms & Conditions"
description = "Terms and Conditions for Cash Reserve Rate Promotion for User Deposits"
full_description = 'Deposit into Cash Reserve for 0.50% increase in APY {"pt_lg":128,"pt_sm":96} .bt-section-padding-1281209696{ padding-top: 128px; padding-bottom: 120px; } @media(max-width:699px){ .bt-section-padding-1281209696{ padding-top: 96px; padding-bottom: 96px; } } Terms and Conditions If you are a new Betterment client (i.e., you do not have an existing Betterment account), to qualify for an APY boost on your funds held in Betterment Cash Reserve, you must fulfill the offer by clicking on the signup link on the Betterment website, opening an individual or joint Cash Reserve account, and then completing a deposit into the Cash Reserve account within 14 days of opening it (a “qualifying deposit”), inclusive of the required settlement time (typically 2-3 business days). If you make a qualifying deposit, your Cash Reserve rate will be increased by 0.50% on top of the current standard Cash Reserve rate (“promotional rate”) for 92 days starting from the date of your initial deposit to your Cash Reserve account (the “promotional period”). The Cash Reserve Rate is currently 4.00% but is subject to change, including during the promotional period. For example, if the standard Cash Reserve Rate decreases during the promotional period, your promotional rate will also decrease. Please note that the Cash Reserve APY is variable and only applies to Cash Reserve accounts or goals set to hold cash, not investments. At the end of the promotional period, your interest rate will return to the standard Cash Reserve rate at that time. If you elect to exclude Cash Reserve deposits from one or more participating Program Banks, Betterment is unable to guarantee you will receive the promotional rate regardless of whether you have made a qualifying deposit. This promotion is not valid with any other offers, and it is non-transferable. Offer available to U.S. Residents only. Accounts advised through the Betterment for Advisors platform and balances held in 401(k) plans managed by Betterment at Work are excluded from this offer. Betterment reserves the right to terminate this offer at any time, to limit account bonuses you are eligible to receive, and to refuse or recover any promotion award if Betterment determines that it was obtained under wrongful or fraudulent circumstances, that inaccurate or incomplete information was provided in opening the account, or that any terms of the Betterment Account Agreements have been violated. Betterment also reserves the right to offer the promotional rate in its discretion to customers who have not made a qualifying deposit.'
