title = "Betterment Climate Impact Portfolio | Socially Responsible Investing"
description = "The Climate Impact portfolio invests in companies with a demonstrated focus on the funding of green projects and lower carbon emissions. It also invests in companies that divest from holders of fossil-fuel reserves. It maintains a diversified, relatively low-cost approach to help customers investing for the long-term save towards their goals while expressing their environmental values."
