t built portfolios {"pt_lg":64,"pt_sm":32} .bt-section-padding-6403216{ padding-top: 64px; padding-bottom: 0px; } @media(max-width:699px){ .bt-section-padding-6403216{ padding-top: 32px; padding-bottom: 16px; } } Core Portfolio Innovative Technology Broad Impact Climate Impact Social Impact {"pt_lg":32,"pt_sm":16} .bt-section-padding-32481648{ padding-top: 32px; padding-bottom: 48px; } @media(max-width:699px){ .bt-section-padding-32481648{ padding-top: 16px; padding-bottom: 48px; } } Boost your savings with a high-yield cash account. Don’t let traditional savings accounts keep your money from growing. Whether saving for an emergency fund or a big goal, our high-yield cash account earns interest at 10x the national average.** hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, 'c2736150-9d5a-4600-b54d-c962c18e21ea', {"useNewLoader":"true","region":"na1"}); hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '58f38844-a2cf-43a1-a9f7-6986b5dbe38b', {"useNewLoader":"true","region":"na1"}); @media(min-width:963px){ } {"pt_lg":64,"pt_sm":64} .bt-section-padding-6436640{ padding-top: 64px; padding-bottom: 36px; } @media(max-width:699px){ .bt-section-padding-6436640{ padding-top: 64px; padding-bottom: 0px; } } $0 fees Forget any monthly or maintenance costs—what you earn is what you keep. $2M FDIC insurance Enjoy up to $2million ($4million for joint accounts) FDIC insurance with our program banks, subject to certain conditions. That's 8x the standard. Move money with ease Easily transfer cash to your investing account, set up recurring savings, and withdraw funds anytime you need. {"pt_lg":36,"pt_sm":24} .bt-section-padding-360240{ padding-top: 36px; padding-bottom: 0px; } @media(max-width:699px){ .bt-section-padding-360240{ padding-top: 24px; padding-bottom: 0px; } } For Cash Reserve (“CR”), Betterment LLC only receives compensation from our program banks; Betterment LLC and Betterment Securities do not charge fees on your CR balance. Betterment is not a bank. {"pt_lg":36,"pt_sm":36} .bt-section-padding-36643664{ padding-top: 36px; padding-bottom: 64px; } @media(max-width:699px){ .bt-section-padding-36643664{ padding-top: 36px; padding-bottom: 64px; } } Feel confident about retirement with an IRA. Grow your retirement savings with a tax-advantaged traditional, Roth, or SEP IRA. Get tax benefits along with our automated technology and full suite of planning tools. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, 'b04a972e-c871-4083-bc38-00139f7b36e4', {"useNewLoader":"true","region":"na1"}); hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '0b9407f6-801f-40be-861e-4c6e082e98ef', {"useNewLoader":"true","region":"na1"}); Image is hypothetical @media(min-width:963px){ } {"pt_lg":64,"pt_sm":64} .bt-section-padding-64366436{ padding-top: 64px; padding-bottom: 36px; } @media(max-width:699px){ .bt-section-padding-64366436{ padding-top: 64px; padding-bottom: 36px; } } Tax benefits We coordinate your retirement accounts for maximum tax efficiency, helping you save on taxes and grow your returns. Lower fees Rollovers to a Betterment IRA of low-cost ETFs can save on high 401(k) fees. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '32087a03-aa70-4f08-bf7a-11713e44aadf', {"useNewLoader":"true","region":"na1"}); Retirement planning We build you a personalized plan, recommend how much to save, and adjust as needed. {"pt_lg":36,"pt_sm":24} .bt-section-padding-36642448{ padding-top: 36px; padding-bottom: 64px; } @media(max-width:699px){ .bt-section-padding-36642448{ padding-top: 24px; padding-bottom: 48px; } } As the largest independent digital investment advisor, see what customers say about Betterment Excellent place to make your money work for you.” Kathryn H. It's a good "set-it-and-forget-it" investing tool for my family." Casey M. Saves the stress and hassle of handling retirement savings myself." David S. I like the different types of accounts offered, the high APY, and how easy it is to check my accounts on mobile." Karen G. Non-paid client of Betterment. Views may not be representative, see more reviews at the App Store and Google Play Store. {"pt_lg":64,"pt_sm":64} .bt-section-padding-64326432{ padding-top: 64px; padding-bottom: 32px; } @media(max-width:699px){ .bt-section-padding-64326432{ padding-top: 64px; padding-bottom: 32px; } } hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '72d1d0b4-15d5-43ee-9bc6-6c8299f9a86a', {"useNewLoader":"true","region":"na1"}); {"pt_lg":0,"pt_sm":0} .bt-section-padding-064064{ padding-top: 0px; padding-bottom: 64px; } @media(max-width:699px){ .bt-section-padding-064064{ padding-top: 0px; padding-bottom: 64px; } } Want to know how you can make the most of your money? Take our quiz. {"pt_lg":64,"pt_sm":64} .bt-section-padding-64166416{ padding-top: 64px; padding-bottom: 16px; } @media(max-width:699px){ .bt-section-padding-64166416{ padding-top: 64px; padding-bottom: 16px; } } I'm in school Caret Right Icon I'm working or job hunting Caret Right Icon I'm retired Caret Right Icon {"pt_lg":16,"pt_sm":48} .bt-section-padding-16644864{ padding-top: 16px; padding-bottom: 64px; } @media(max-width:699px){ .bt-section-padding-16644864{ padding-top: 48px; padding-bottom: 64px; } } Still have questions? How does Betterment work? Caret Down Icon Betterment helps you manage your money through cash management, guided investing, and retirement planning. We are a fiduciary, which means we act in your best interest. We'll ask a bit about you when you sign up. We'll also gather information when you connect your outside accounts. Then, we'll help you set financial goals and set you up with investment portfolios for each goal. For your long-term financial needs (like retirement, next year's vacation, or a down payment), our investment strategy utilizes low-cost ETFs (exchange-traded funds) and an adjustable risk profile based on your goal type and how long you plan to invest. For your daily saving and spending, you can use our cash management products that include Checking (which is offered by nbkc bank, Member FDIC) and Cash Reserve, a high-yield cash account. Will I have access to real humans? Caret Down Icon Customer support team members are available five days per week to answer questions about your account. If you want in-depth financial advice, you can talk to a licensed advisor by phone for an additional cost. Our Premium plan provides you with unlimited access and costs an additional 0.40% on your invested balances (with a minimum investing account balance requirement of $100,000). Is my money safe at Betterment? Caret Down Icon Betterment Securities is a Member of SIPC, which protects securities of its members up to $500K (including $250K for claims for cash). Explanatory brochure available upon request or at www.sipc.org. What you should remember is that the SIPC does not protect against market changes in your investing account. Individual Cash Reserve accounts have FDIC insurance up to $2 million and joint Cash Reserve accounts offer up to $4 million in FDIC insurance once funds are deposited into our program banks†. Funds deposited into Checking are FDIC-insured up to $250,000 for individual accounts and up to $250,000 per depositor for joint accounts, provided by nbkc bank, Member FDIC. Explore further details about FDIC insurance. Who are the experts behind the scenes? Caret Down Icon Our team of investing experts make decisions about our portfolio strategies and fund selection with the help of an external committee of economists, PhDs, and industry experts. More than just a portfolio management team, our experts work to develop improvements to our Tax Smart technology, our cash analysis tools, and other advanced strategies. {"pt_lg":64,"pt_sm":36} .bt-section-padding-64963664{ padding-top: 64px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-64963664{ padding-top: 36px; padding-bottom: 64px; } } Triangle illustration Make your money hustle. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, 'e6dec5df-d43d-4f84-a54b-56d5f6a90445', {"useNewLoader":"true","region":"na1"}); {"pt_lg":16,"pt_sm":64} .bt-section-padding-1616640{ padding-top: 16px; padding-bottom: 16px; } @media(max-width:699px){ .bt-section-padding-1616640{ padding-top: 64px; padding-bottom: 0px; } } {"pt_lg":300,"pt_sm":64} .bt-section-padding-30030064300{ padding-top: 300px; padding-bottom: 300px; } @media(max-width:699px){ .bt-section-padding-30030064300{ padding-top: 64px; padding-bottom: 300px; } }'''
