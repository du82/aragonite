["https://www.betterment.com/help/tag/tiered-investing-reward-faqs-q1-2025"]
title = "Betterment Help Center | Tiered Investing Reward FAQs Q1 2025"
description = "Tiered Investing Reward FAQs Q1 2025 | Customer help center and frequently asked questions for Betterment clients and 401(k) participants"
full_description = "Help Center Tiered Investing Reward FAQs Q1 2025 Table of content Close Icon Offer Details Offer Details What’s the Tiered Investing Reward? Caret Down Icon The Tiered Investing Reward is a cash reward based on a new investing customer’s net deposits into eligible investing accounts in their first 45 days after enrollment in the offer. Your net deposits only into Individual Taxable Investing accounts and IRA accounts are eligible for the promotion. This includes rollovers to new IRA accounts and external transfers into Individual Taxable Investing accounts. Read More Who is eligible for the Betterment Q1 2025 Tiered Investing Reward? Caret Down Icon This offer is only available to new investing customers, including current Betterment customers with only a Cash Reserve or Checking account. This offer is not available to active Betterment at Work 401(k) plan clients and Betterment Advised clients and is not available for joint and trust investing accounts. Read More What is my enrollment date? Caret Down Icon For new customers, your enrollment date in the offer is the date that you visit the offer webpage, click the signup link on the Betterment site, and open an eligible investing account. For current Betterment customers, enrollment date is defined on the date in which a link to the offer is clicked either via email or message in the Betterment application. Read More How much can I earn? Caret Down Icon Final cash rewards are determined based on eligible net deposits across all individual investing accounts at 45 days past enrollment. The maximum reward is $1,000. Cash payout by deposit amount are listed below: 45 Day Individual Investing Account Net Deposits* Total Cash Reward** $0-$999 $0 $1,000–$6,999 $50.00 $7,000–$19,999 $125.00 $20,000–$74,999 $150.00 $75,000–$124,999 $300.00 $125,000–$174,999 $500.00 $175,000+ $1000.00 *The minimum amount of net deposits to receive a reward is $1,000. ... Read More When will I receive the cash reward? Caret Down Icon You’ll receive the full value of your cash reward on or around April 15, 2025. If you deposit into multiple investing accounts, the reward will be deposited into an open and funded account in the following priority order: Roth IRA, followed by Traditional IRA, followed by SEP IRA, followed by your highest balance individual taxable account. example: If you deposit $5,000 into a Roth IRA account and $5,000 into an individual taxable account, you will receive $125 deposited into your Roth IRA. Read More Do I get to keep my reward if I withdraw money from my investing accounts? Caret Down Icon Keeping the Cash Reward after withdrawing funds from your investing accounts depends on how much you’re withdrawing and how much you’ve contributed to your account since receiving the reward. As long as you’ve held the deposits for at least three years, the reward is yours to keep. For example, if you originally contributed $30,000 during the offer period and received a Cash Reward of $150 on April 15, 2025, you can withdraw all of it (including the $150 reward) on or after April 15, 2028 with ... Read More If I open a new IRA, does the reward count towards my annual IRS contribution limit? Caret Down Icon No. The reward is treated as interest in your IRA and doesn’t count toward your annual IRA contribution limits. Read More Are there fees if I transfer funds from my investing account out of Betterment? Caret Down Icon Yes, this transfer would be subject to an early reward removal fee if the amount you’re transferring meets the criteria above. ACATS transfers are also subject to a separate fee. Read More Betterment on Facebook Betterment on X Betterment Email Share Betterment Clipboard Share Copied!"
year_published = 2025
