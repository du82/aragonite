description = "Well-diversified, low-cost, and built for long-term investing. Features a broad collection of exchange-traded funds (ETFs) made of thousands of stocks and bonds from around the world."
full_description = '''Expert-built,curated portfolios Our portfolios are the easy way to invest like a pro. Choose from our selection to help you build wealth over the long term. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '4effd7d2-e029-4b8e-a60a-54cebca19abe', {"useNewLoader":"true","region":"na1"}); {"pt_lg":152,"pt_sm":104} .bt-section-padding-15212010496{ padding-top: 152px; padding-bottom: 120px; } @media(max-width:699px){ .bt-section-padding-15212010496{ padding-top: 104px; padding-bottom: 96px; } } Full List Stocks and bonds Bonds Cash Crypto Filter by: Please select Full list Stocks and bonds Bonds Cash Crypto Core Well-diversified, low-cost, and built for long-term investing. Features a broad collection of exchange-traded funds (ETFs) made of thousands of stocks and bonds from around the world. Stocks and bonds Cash Reserve A 100% cash account that earns 4.00% APY (variable)*, carries no-fee on your balance, and is FDIC-insured up to $2 million at our program banks ($4 million for joint accounts)†. Cash only Goldman Sachs Tax-Smart Bonds Gives higher-income individuals a personalized bond portfolio to generate additional after-tax yield. Bonds only BlackRock Target Income A 100% bond portfolio with different income yields to help protect you against stock market volatility. Bonds only Broad Impact Invests in companies that rank highly on environmental, social, and corporate governance (ESG) criteria without compromising potential long-term performance. Stocks and bonds Socially responsible Climate Impact Invests in companies with lower carbon emissions and the funding of green projects while still helping you achieve potential long-term growth. Stocks and bonds Socially responsible Social Impact Provides broad diversified exposure with a greater focus on companies actively working toward minority empowerment and gender diversity as part of your long-term strategy. Stocks and bonds Socially responsible Goldman Sachs Smart Beta Targets companies that have potential to outperform the broader market over the long term. Diverse and relatively low-cost, but with higher exposure to risk. Stocks and bonds Innovative Technology A well-diversified portfolio focused on high-growth potential companies such as clean energy, semiconductors, robots, virtual reality, blockchain, and nanotechnology along with increased exposure to risk. Stocks and bonds Value Tilt Invest in a globally diverse portfolio that tilts toward undervalued U.S. companies, for investors who understand the potential benefits and risks of investing more heavily in value stocks. Stocks and bonds Crypto ETF Tap the market moves of the two largest and widely traded cryptocurrencies, Bitcoin and Ethereum, with this fully automated ETF portfolio. Crypto {"pt_lg":0,"pt_sm":0} .bt-section-padding-064064{ padding-top: 0px; padding-bottom: 64px; } @media(max-width:699px){ .bt-section-padding-064064{ padding-top: 0px; padding-bottom: 64px; } } Arch illustration - desktop Arch illustration - mobile Customize your portfolio. If you’re an experienced investor looking for more control, a Flexible portfolio lets you adjust individual asset class weights based on your preferences. Learn more @media(min-width:963px){ } {"pt_lg":24,"pt_sm":64} .bt-section-padding-240640{ padding-top: 24px; padding-bottom: 0px; } @media(max-width:699px){ .bt-section-padding-240640{ padding-top: 64px; padding-bottom: 0px; } } {"pt_lg":180,"pt_sm":64} .bt-section-padding-1802006464{ padding-top: 180px; padding-bottom: 200px; } @media(max-width:699px){ .bt-section-padding-1802006464{ padding-top: 64px; padding-bottom: 64px; } } Invested with benefits. {"pt_lg":96,"pt_sm":64} .bt-section-padding-960640{ padding-top: 96px; padding-bottom: 0px; } @media(max-width:699px){ .bt-section-padding-960640{ padding-top: 64px; padding-bottom: 0px; } } Tax savings. Automated and optimized tax strategies designed to help minimize tax impact on returns. Lower costs. Keep more money in your portfolio with low-cost exchange-traded funds (ETFs) and our transparent pricing. Adjusts automatically. Your investments are rebalanced as the market moves once at the minimum account balance, with dividends getting reinvested. {"pt_lg":96,"pt_sm":64} .bt-section-padding-96966464{ padding-top: 96px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-96966464{ padding-top: 64px; padding-bottom: 64px; } } Triangle illustration Be invested. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '4effd7d2-e029-4b8e-a60a-54cebca19abe', {"useNewLoader":"true","region":"na1"}); {"pt_lg":138,"pt_sm":138} .bt-section-padding-138300138300{ padding-top: 138px; padding-bottom: 300px; } @media(max-width:699px){ .bt-section-padding-138300138300{ padding-top: 138px; padding-bottom: 300px; } } Frequently asked questions What is a portfolio? Caret Down Icon Unlike a traditional retirement plan or options provided by an online brokerage, Betterment doesn’t make you choose your own funds. Instead, we recommend a basket of funds that’s diversified to seek performance without unnecessary risks—that’s a portfolio. For every goal you set a Betterment, we’ll let you choose the kind of portfolio you want and recommend a specific stock-to-bond ratio. For Betterment’s Core portfolio strategy and socially responsible investing options, we provide 101 possible stock-to-bond allocations, giving you a portfolio tailored to your goal. Why does Betterment invest in ETFs? Caret Down Icon An exchange-traded fund (ETF) is a security that tracks an index, a commodity or a basket of assets just like an index fund, but trades like a stock on an exchange. Betterment uses ETFs in both our stock and bond portfolios because of the low management fees and tax-efficiency they offer. Learn more about the advantages of ETF-based portfolios. What should I expect in terms of returns for my investments? Caret Down Icon Each of your goals’ portfolios will see different performance, depending on the stock-to-bond allocation you choose, any changes you make over time, your choice of portfolio strategy, and market volatility. We recommend your investment portfolio’s allocation based on the time horizon of your goal and what kind of goal you have. If your goal is short-term, we’ll recommend a more conservative portfolio with lower expected returns with less volatility, and if your goal is longer term, we’ll likely recommend a more aggressive portfolio with higher expected long-term returns with higher volatility. Can I use more than one portfolio strategy in my Betterment account? Caret Down Icon Yes, you can have multiple portfolio strategies within your Betterment account because you can set a different portfolio strategy (and a different portfolio allocation) for each of your goals. For example, your retirement goal can use the Betterment Core Portfolio, while your safety net goal could invest with a socially responsible investing strategy. Can my Betterment investments decrease in value? Caret Down Icon Yes—far from unusual, downturns are a normal part of even the highest returning investments. Investors often worry and react with panic in response to market drops, even if they are invested properly for their long-term goals, but interim losses are to be expected even during the best investment periods. Can I see the list of funds in each portfolio strategy? Caret Down Icon Log in or sign up to set your goals, choose a portfolio strategy, and see the holdings at any stock-to-bond allocation you choose. You can also review the list of funds in the Betterment Core Portfolio strategy or browse our expert commentary on investments. {"pt_lg":96,"pt_sm":64} .bt-section-padding-96966464{ padding-top: 96px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-96966464{ padding-top: 64px; padding-bottom: 64px; } }'''
