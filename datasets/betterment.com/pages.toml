full_description = '''Evaluating performance and taxes Investing isn't just what you earn—it's what you keep that matters. We can help you build wealth over the long term, while helping to protect your earnings from taxes. {"pt_lg":152,"pt_sm":104} .bt-section-padding-1529010464{ padding-top: 152px; padding-bottom: 90px; } @media(max-width:699px){ .bt-section-padding-1529010464{ padding-top: 104px; padding-bottom: 64px; } } Portfolio performance Tax-saving strategies Jump to Section Please select Portfolio performance Tax-saving strategies {"contactRecords":[],"inputs":{"allow_portfolio_swapping":true,"content":"Returns are an important measure of how well a portfolio performs (or may perform). But there’s a factor that can seriously impact your investments: taxes. <a href=\"#taxes-overview\" rel=\"noopener\">Here’s what we do to help lower them.</a>","defaultPortfolio":{"defaultAccountType":"tax-deferred","defaultFederalTaxRate":null,"defaultRiskLevel":"90","defaultStateTaxRate":null,"defaultTime":"all","disclosure":"<p>The default state for the Betterment Core portfolio Strategy is an allocation of 90% stocks / 10% bonds in a tax-deferred portfolio, representing a moderate state for a long-term investment in an IRA or 401(k) plan. 11 other allocations can be selected in the tool, representing a sample of the full range of allocations available. The taxable version of the portfolio has different bond asset classes. The portfolio performance display includes historical performance from the portfolio inception date of Sept. 7, 2011 and historical performance includes all portfolio model changes and fund selection decisions since that date.</p>\n<p>In December 2013, Betterment updated its Core portfolio methodology, resulting in the removal of TIPs from the 0%-stock portfolio. For periods prior to Dec. 13, 2013, the Core Portfolio Strategy performance may differ from performance subsequent to December 2013, particularly in the 0% stock portfolio.</p>\n<p>In January 2024, Betterment updated its Core portfolio methodology, resulting in the removal of the value tilt (an asset allocation weighting towards U.S. value equities), reduced exposure to emerging markets, increased exposure to U.S. asset classes, and reduced exposure to international developed bond markets. For periods up to and including December 29, 2023, the Core Portfolio Strategy performance may differ from performance subsequent to December 29, 2023.</p>\n<p>No default state in the tool should be taken as a recommendation; Betterment’s investment advice is made available to clients through its application.</p>","graphCsvId":"betterment_core","initialDepositAmount":"50000","name":"Core","pageUrl":"core-portfolio","quickCompareSummary":"Globally diverse with broad market exposure"},"default_tab":"performanceData","display_portfolio_details":true,"eyebrow":"","headline":"Portfolio performance. ","headline_style":"bt-title2","portfolio":{"columns":{"default_account_type":{"createdAt":1710864647979,"createdByUserId":0,"id":2,"isHubspotDefined":false,"label":"Tax-deferred","labelTranslations":{},"name":"Tax-deferred","order":1,"type":"option","updatedAt":1710864647979,"updatedByUserId":0},"default_risk_level":{"createdAt":1710864647979,"createdByUserId":0,"id":10,"isHubspotDefined":false,"label":"90","labelTranslations":{},"name":"90","order":9,"type":"option","updatedAt":1710864647979,"updatedByUserId":0},"graph_csv_id":"betterment_core","hs_child_table_id":0,"hs_created_at":1652498784922,"hs_deleted_at":0,"hs_id":73566912276,"hs_initial_published_at":1721241594387,"hs_is_edited":false,"hs_name":"Betterment Core Portfolio","hs_path":"core-portfolio","hs_published_at":1740693081891,"hs_updated_at":1733239763550,"hs_updated_by_user_id":26801193,"initial_deposit_amount":{"createdAt":1710864647979,"createdByUserId":0,"id":2,"isHubspotDefined":false,"label":"50000","labelTranslations":{},"name":"50000","order":1,"type":"option","updatedAt":1710864647979,"updatedByUserId":0},"name":"Core","performance_disclosure":"<p>The default state for the Betterment Core portfolio Strategy is an allocation of 90% stocks / 10% bonds in a tax-deferred portfolio, representing a moderate state for a long-term investment in an IRA or 401(k) plan. 11 other allocations can be selected in the tool, representing a sample of the full range of allocations available. The taxable version of the portfolio has different bond asset classes. The portfolio performance display includes historical performance from the portfolio inception date of Sept. 7, 2011 and historical performance includes all portfolio model changes and fund selection decisions since that date.</p>\n<p>In December 2013, Betterment updated its Core portfolio methodology, resulting in the removal of TIPs from the 0%-stock portfolio. For periods prior to Dec. 13, 2013, the Core Portfolio Strategy performance may differ from performance subsequent to December 2013, particularly in the 0% stock portfolio.</p>\n<p>In January 2024, Betterment updated its Core portfolio methodology, resulting in the removal of the value tilt (an asset allocation weighting towards U.S. value equities), reduced exposure to emerging markets, increased exposure to U.S. asset classes, and reduced exposure to international developed bond markets. For periods up to and including December 29, 2023, the Core Portfolio Strategy performance may differ from performance subsequent to December 29, 2023.</p>\n<p>No default state in the tool should be taken as a recommendation; Betterment’s investment advice is made available to clients through its application.</p>","quick_compare_summary":"Globally diverse with broad market exposure"},"id":73566912276,"table_id":5410958,"table_name":"portfolios"},"portfolios_list":[{"defaultAccountType":"Tax-deferred","defaultFederalTaxRate":null,"defaultRiskLevel":"90","defaultStateTaxRate":null,"disclosure":"<p>The default state for the Betterment Core portfolio Strategy is an allocation of 90% stocks /