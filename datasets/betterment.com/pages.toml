64px; padding-bottom: 64px; } @media(max-width:699px){ .bt-section-padding-64643272{ padding-top: 32px; padding-bottom: 72px; } } Keeping your money safe and secure. Your Checking account is FDIC-insured up to $250K per depositor through nbkc bank, Member FDIC‡. What’s more, you can lock your card, change your PIN, and more all from the Betterment app. No need to call or go into a branch to maintain control. @media(min-width:963px){ } {"pt_lg":96,"pt_sm":72} .bt-section-padding-96967264{ padding-top: 96px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-96967264{ padding-top: 72px; padding-bottom: 64px; } } Rewards and benefits when you spend. Get fast, automatic cash back rewards at thousands of your favorite brands in heath & fitness, clothing & fashion, travel, and more. @media(min-width:963px){ } {"pt_lg":96,"pt_sm":72} .bt-section-padding-96967264{ padding-top: 96px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-96967264{ padding-top: 72px; padding-bottom: 64px; } } Checking together. Better together. You wanted Joint Checking accounts, and now they're here. Share all the benefits of no-fee,‡ cash back banking with your partner while keeping it simple with one Visa® Debit Card, across all your accounts. @media(min-width:963px){ } {"pt_lg":96,"pt_sm":64} .bt-section-padding-96966464{ padding-top: 96px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-96966464{ padding-top: 64px; padding-bottom: 64px; } } Triangle illustration Like what you see? Let’s get you started. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, 'b686f90d-bc69-4bf0-a97b-64a7d3f863c8', {"useNewLoader":"true","region":"na1"}); {"pt_lg":138,"pt_sm":138} .bt-section-padding-138300138300{ padding-top: 138px; padding-bottom: 300px; } @media(max-width:699px){ .bt-section-padding-138300138300{ padding-top: 138px; padding-bottom: 300px; } }'''
