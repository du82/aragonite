location you choose, any changes you make over time, your choice of portfolio strategy, and market volatility. We recommend your investment portfolio’s allocation based on the time horizon of your goal and what kind of goal you have. If your goal is short-term, we’ll recommend a more conservative portfolio with lower expected returns with less volatility, and if your goal is longer term, we’ll likely recommend a more aggressive portfolio with higher expected long-term returns with higher volatility. Can I use more than one portfolio strategy in my Betterment account? Caret Down Icon Yes, you can have multiple portfolio strategies within your Betterment account because you can set a different portfolio strategy (and a different portfolio allocation) for each of your goals. For example, your retirement goal can use the Betterment Core Portfolio, while your safety net goal could invest with a socially responsible investing strategy. Can my Betterment investments decrease in value? Caret Down Icon Yes—far from unusual, downturns are a normal part of even the highest returning investments. Investors often worry and react with panic in response to market drops, even if they are invested properly for their long-term goals, but interim losses are to be expected even during the best investment periods. Can I see the list of funds in each portfolio strategy? Caret Down Icon Log in or sign up to set your goals, choose a portfolio strategy, and see the holdings at any stock-to-bond allocation you choose. You can also review the list of funds in the Betterment Core Portfolio strategy or browse our expert commentary on investments. {"pt_lg":96,"pt_sm":64} .bt-section-padding-96966464{ padding-top: 96px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-96966464{ padding-top: 64px; padding-bottom: 64px; } }'''
