title = "Cash match Offer | Get rewarded for investing"
description = "Open any investing account (including an IRA) and make a deposit to earn up to $1,000 on us. The more you invest, the more you can earn. Terms apply."
full_description = '''Enroll and earn up to $1,000 You’ve taken the first step to claim your reward! Here’s what’s next: Open any individual investing account (including an IRA) and make a deposit to earn up to $1,000 on us. The more you invest, the more you can earn. Terms apply. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '27a9fe35-a605-4aa4-b5c2-11bc204232ee', {"useNewLoader":"true","region":"na1"}); hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '996251d1-df3e-4dc9-8666-981f41937349', {"useNewLoader":"true","region":"na1"}); {"pt_lg":152,"pt_sm":104} .bt-section-padding-1526410464{ padding-top: 152px; padding-bottom: 64px; } @media(max-width:699px){ .bt-section-padding-1526410464{ padding-top: 104px; padding-bottom: 64px; } } Arch illustration - desktop Arch illustration - mobile Here’s how you can earn up to $1,000: Deposit or roll over at least $1,000 into any individual investing accounts (including Roth and traditional IRAs) to earn $50. Increase your rewards with higher deposits, up to a total of $1,000. You can make multiple deposits from outside accounts to reach each reward amount. Make deposits within 45 days to start earning your reward. You'll receive your reward on or around 45 days after you've enrolled in the offer. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '27a9fe35-a605-4aa4-b5c2-11bc204232ee', {"useNewLoader":"true","region":"na1"}); Conditions apply. See offer terms and FAQs. @media(min-width:963px){ } {"pt_lg":64,"pt_sm":64} .bt-section-padding-64646464{ padding-top: 64px; padding-bottom: 64px; } @media(max-width:699px){ .bt-section-padding-64646464{ padding-top: 64px; padding-bottom: 64px; } } Investing for you, managed by us. {"pt_lg":64,"pt_sm":48} .bt-section-padding-64164816{ padding-top: 64px; padding-bottom: 16px; } @media(max-width:699px){ .bt-section-padding-64164816{ padding-top: 48px; padding-bottom: 16px; } } 1. Tell us a little bit about yourself. Everyone’s financial situation is different. Get personal recommendations based on what you want to accomplish, whether that’s retirement or simply building wealth. 2. Choose how you want to invest. Pick one of our diversified portfolios that interests you. They’re built by experts using low-cost exchange-traded funds. 3. We put your money to work. Automated trading, rebalancing, and dividend reinvestment, we put our technology behind every dollar you invest. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '27a9fe35-a605-4aa4-b5c2-11bc204232ee', {"useNewLoader":"true","region":"na1"}); @media(min-width:963px){ } {"pt_lg":32,"pt_sm":32} .bt-section-padding-32643264{ padding-top: 32px; padding-bottom: 64px; } @media(max-width:699px){ .bt-section-padding-32643264{ padding-top: 32px; padding-bottom: 64px; } } Invest the way you want. Choose from expert-built, curated portfolios to customizable investment options—all using low-cost ETFs. Save more on taxes. We use tax-loss harvesting to turn market dips into tax savings, lowering your tax bill and leaving you with more in returns. Ongoing optimization. We monitor your investments, rebalance your portfolio, and reinvest dividends for you. {"pt_lg":48,"pt_sm":48} .bt-section-padding-48244824{ padding-top: 48px; padding-bottom: 24px; } @media(max-width:699px){ .bt-section-padding-48244824{ padding-top: 48px; padding-bottom: 24px; } } Ready to get started? {"pt_lg":64,"pt_sm":64} .bt-section-padding-64166416{ padding-top: 64px; padding-bottom: 16px; } @media(max-width:699px){ .bt-section-padding-64166416{ padding-top: 64px; padding-bottom: 16px; } } INVEST Automated investing Build wealth with diversified, expert-built portfolios. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '99a29618-77df-4e45-a1ed-f1095753e112', {"useNewLoader":"true","region":"na1"}); RETIRE IRAs Grow your retirement savings with a tax-advantaged IRA. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, 'dbdd9248-cb73-4b52-b5f3-e07f7840d7ea', {"useNewLoader":"true","region":"na1"}); {"pt_lg":32,"pt_