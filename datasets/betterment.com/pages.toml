gh fees. If you’re looking to roll over at least $20k, you can talk with an advisor about it for free. Learn more ➔ @media(min-width:963px){ } {"pt_lg":96,"pt_sm":32} .bt-section-padding-96963232{ padding-top: 96px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-96963232{ padding-top: 32px; padding-bottom: 32px; } } Betterment’s Licensed Concierge Team offers support for individuals transferring assets to Betterment of $20,000 or more, and receives incentive compensation based on assets brought to or invested with Betterment. Betterment’s revenue varies for different offerings (e.g., Betterment Digital and Premium, Cash Reserve) and consequently Team members have an incentive to recommend the offering which results in the greatest revenue for Betterment. The marketing and solicitation activities of these individuals are supervised by Betterment to ensure that these individuals act in the client’s best interest. {"pt_lg":0,"pt_sm":0} .bt-section-padding-048048{ padding-top: 0px; padding-bottom: 48px; } @media(max-width:699px){ .bt-section-padding-048048{ padding-top: 0px; padding-bottom: 48px; } } Learn about our expert built portfolios Our portfolios are the easy way to invest like a pro. Choose from our selection to help you build wealth over the long term. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '27a9fe35-a605-4aa4-b5c2-11bc204232ee', {"useNewLoader":"true","region":"na1"}); {"pt_lg":96,"pt_sm":64} .bt-section-padding-96966464{ padding-top: 96px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-96966464{ padding-top: 64px; padding-bottom: 64px; } } Lower fees today can mean more money tomorrow. A 401(k) with even a modest fee may cost you tens of thousands of dollars over time. The savings from rolling into a managed Betterment IRA of low-cost exchange-traded funds (ETFs) can add up to a more comfortable retirement. @media(min-width:963px){ } {"pt_lg":64,"pt_sm":32} .bt-section-padding-64643232{ padding-top: 64px; padding-bottom: 64px; } @media(max-width:699px){ .bt-section-padding-64643232{ padding-top: 32px; padding-bottom: 32px; } } Assumed 0.25% management fee with hypothetical 6% annual return. Image to illustrate the potential impact of fees on performance and does not reflect the performance of Betterment. {"pt_lg":32,"pt_sm":64} .bt-section-padding-32326464{ padding-top: 32px; padding-bottom: 32px; } @media(max-width:699px){ .bt-section-padding-32326464{ padding-top: 64px; padding-bottom: 64px; } } hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, 'bd481050-8dc0-4ced-9399-48a7d7fd5f15', {"useNewLoader":"true","region":"na1"}); {"pt_lg":32,"pt_sm":32} .bt-section-padding-32323232{ padding-top: 32px; padding-bottom: 32px; } @media(max-width:699px){ .bt-section-padding-32323232{ padding-top: 32px; padding-bottom: 32px; } } Get personalized advice on your retirement. We offer hands-on guidance from our team of experts to help bring clarity and confidence to your retirement.0.65% annual fee. Minimum balance required. Learn more ➔ @media(min-width:963px){ } {"pt_lg":96,"pt_sm":64} .bt-section-padding-960640{ padding-top: 96px; padding-bottom: 0px; } @media(max-width:699px){ .bt-section-padding-960640{ padding-top: 64px; padding-bottom: 0px; } } IRAs come with questions. We’re here with answers. What is an IRA? Caret Down Icon An IRA (individual retirement account) is a personal investment account the government created to help you save for retirement. Do I want a traditional or Roth IRA? Caret Down Icon The difference mainly comes down to how and when you’re taxed. A Roth IRA might be a good choice if you expect your future tax rate to be higher. This is especially true when you're early in your career and anticipate earning more in the future. Paying taxes on your Roth contributions now can help you avoid a larger tax bill during retirement.On the other hand, if you think your future taxes will be lower, a traditional IRA might be better. You also have an upfront tax deduction, which if you’re eligible, means more money to invest now. What’s a Roth conversion? Caret Down Icon There are income limits to restrict high earners from contributing to a Roth IRA. However, you can use a "back door" conversion to move your money into a Roth IRA. We can help you make this Roth conversion to take advantage of tax-free growth. What does it cost? Caret Down Icon For just $4 a month or 0.25% annually, you get all the benefits of our automated technology: hands-off investing, expert-built portfolios, and guidance to help you grow your retirement. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, 'f78c5fe4-929a-46dd-afb0-5cc4128e8831', {"useNewLoader":"true","region":"na1"}); What’s a SEP IRA? Caret Down Icon A SEP IRA is a type of retirement plan for those who are self-employed or who are small business owners. Am I eligible for an IRA? Caret Down Icon There is no minimum age requirement to open either a traditional or Roth IRA, but you must have earned income. There are no income limits for a traditional IRA. However, when considering a Roth IRA, your income plays a role in determining your contribution eligibility. In 2024, single tax filers aiming to contribute to a Roth IRA must have a modified adjusted gross income below $146,000. If married and filing jointly, your joint modified adjusted gross income must be under $230,000 in 2024. What's the contribution limit for an IRA? Caret Down Icon In 2024, the annual contribution limit for both Roth and traditional IRAs is $7,000 for those under 50, and $8,000 for those 50 and above. You can still contribute to your 2024 traditional and Roth IRA up to $7,000 a year if you're under 50, or $8,000 if you're 50 or older until April 15, 2025. {"pt_lg":96,"pt_sm":64} .bt-section-padding-96966464{ padding-top: 96px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-96966464{ padding-top: 64px; padding-bottom: 64px; } } Triangle illustration Boost your retirement with an IRA. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '4effd7d2-e029-4b8e-a60a-54cebca19abe', {"useNewLoader":"true","region":"na1"}); {"pt_lg":138,"pt_sm":138} .bt-section-padding-138300138300{ padding-top: 138px; padding-bottom: 300px; } @media(max-width:699px){ .bt-section-padding-138300138300{ padding-top: 138px; padding-bottom: 300px; } }'''
