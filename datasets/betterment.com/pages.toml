title = "Can I delete or hide a connected external account from my Betterment profile?"
description = "Connecting your accounts lets you see your holistic financial picture, and allows us to give you better advice."
full_description = "You can remove connected accounts from Betterment, or you can hide a specific account to prevent it from showing up on your Betterment overview or being included in your total net worth. To delete a Connected account: Web browser: Log in to your Betterment account. Select “Settings” from the left-hand menu. Click on the “Connected accounts” tab. Click “Delete” next to the account(s) you wish to remove. Mobile app: Log into the Betterment app. Tap the three lines in the upper left-hand corner to open the menu. Select “Settings”, then “Connected Accounts”. Tap “Edit” next to the account you wish to remove. Tap “Delete”. To hide a Connected account: Web browser only: Log in to your Betterment account on a web browser. Select “Settings” from the left-hand menu. Click on the “Connected accounts” tab. Click “Edit” next to the account(s) you want to hide. Select “Hide”. Betterment on Facebook Betterment on X Betterment Email Share Betterment Clipboard Share Copied! How do I connect an external account so that I can view my other savings and retirement accounts alongside my Betterment accounts?"
