full_description = 'Portfolio Minimum Disclosure Updated November 20, 2024 {"pt_lg":128,"pt_sm":96} .bt-section-padding-1281209696{ padding-top: 128px; padding-bottom: 120px; } @media(max-width:699px){ .bt-section-padding-1281209696{ padding-top: 96px; padding-bottom: 96px; } } Betterment doesn’t require clients to maintain a minimum investment account balance, but there is a ACH deposit minimum of $10. Additionally, there are portfolio-specific minimums in order for a goal to be eligible for rebalancing transactions to occur. Betterment will not rebalance a portfolio until it meets the applicable portfolio minimum balance. This minimum is a function of portfolio allocation and the price of individual holdings, which will vary. As of November 20, 2024, investing portfolios require a portfolio minimum balance of $50 in order to be eligible for a rebalancing transaction to occur (which can be the aggregate of balances in a tax-coordinated portfolio). Rebalancing is described in our Auto-Adjust and Rebalancing disclosure. Investing portfolios covers all ETF-based portfolios, including the Crypto ETF portfolio.'
