["https://www.betterment.com/advisors/video"]
title = "Videos | Betterment for Advisors"
description = "Unlock a wealth of knowledge for RIAs in the Betterment for Advisors video hub! Dive into growth strategies, smart transitions, seamless onboarding, and more. Connect clients effortlessly and explore expert insights."
full_description = '''Videos Insights to help grow your business and improve your clients’ financial lives. {"pt_lg":154,"pt_sm":154} .bt-section-padding-1546415464{ padding-top: 154px; padding-bottom: 64px; } @media(max-width:699px){ .bt-section-padding-1546415464{ padding-top: 154px; padding-bottom: 64px; } } Betterment Advisor Solutions: The RIA custodian helping power your growth Get to know how we can help you scale your practice and deliver a better client experience. As your end-to-end custodian, our cutting-edge technology can help you scale your practice. {"pt_lg":32,"pt_sm":64} .bt-section-padding-32646464{ padding-top: 32px; padding-bottom: 64px; } @media(max-width:699px){ .bt-section-padding-32646464{ padding-top: 64px; padding-bottom: 64px; } } Product features and demos Get step-by-step guidance on making the most of your Betterment experience. {"pt_lg":64,"pt_sm":64} .bt-section-padding-64246412{ padding-top: 64px; padding-bottom: 24px; } @media(max-width:699px){ .bt-section-padding-64246412{ padding-top: 64px; padding-bottom: 12px; } } Introducing smart transitions Our new smart transitions tooling allows you to efficiently move clients into a Betterment portfolio. Getting the basics of client onboarding Examine the fundamental steps for bringing new clients into Betterment. This includes creating client households and selecting investment strategies, streamlining the entire process. How to sync external accounts Understand how to easily connect external accounts like 401(k), savings, and brokerage accounts. Help your clients plan for the future by consolidating all their financial information in one convenient location. Linking a bank account for deposits We'll show you how you can easily link back accounts for deposits with Betterment for Advisors. [{"description":"Our new smart transitions tooling allows you to efficiently move clients into a Betterment portfolio.","entity_footer_disclosure":{"createdAt":null,"createdByUserId":0,"id":3,"isHubspotDefined":false,"label":"entity_original_content","labelTranslations":{},"name":"entity_original_content","order":0,"type":"option","updatedAt":null,"updatedByUserId":0},"hs_child_table_id":0,"hs_created_at":1697568659063,"hs_deleted_at":0,"hs_id":140603848073,"hs_initial_published_at":1726137420482,"hs_is_edited":false,"hs_name":"Introducing smart transitions","hs_path":"smart-transitions","hs_published_at":1740678507671,"hs_updated_at":1726137770141,"hs_updated_by_user_id":62884969,"meta_description":"Unlock growth for your independent advisory business with Betterment for Advisors' tax-smart transitions. Seamlessly scale operations, automate portfolio management, and ease transitions. ","optional_footer_disclosures":[{"createdAt":null,"createdByUserId":0,"id":3,"isHubspotDefined":false,"label":"optional_b4a_betterment_llc","labelTranslations":{},"name":"optional_b4a_betterment_llc","order":0,"type":"option","updatedAt":null,"updatedByUserId":0}],"order":1,"playlist":{"createdAt":null,"createdByUserId":0,"id":4,"isHubspotDefined":false,"label":"Product features and demos","labelTranslations":{},"name":"Product features and demos","order":3,"type":"option","updatedAt":null,"updatedByUserId":0},"show_on_hub":1,"thumbnail":{"url":"https://www.betterment.com/hubfs/Visual-FollowUp.png","altText":"Visual-FollowUp","fileId":178269024883,"height":240,"type":"image","width":479},"title":"Introducing smart transitions","transcript":"<p>At some point, every independent advisor asks themselves the same question.</p>\n<p>How do I scale my business?</p>\n<p>Betterment for Advisors is the end to end custodian with an answer.</p>\n<p>From seamless onboarding and billing, to automated portfolio management, our cutting edge technology helps you streamline your operations, giving you more time back to spend with more clients.</p>\n<p>And thanks to our tax smart transition features, it can be easier than ever to switch to a new custodian.</p>\n<p>Here's how.</p>\n<p>First, set up your client's goals and portfolio strategy as part of their onboarding. Then set a net capital gains allowance for their taxable accounts.</p>\n<p>When you're ready, we'll transition your client's assets into the strategy you've built.</p>\n<p>Once their gains cap is reached, rebalancing automatically turns off, and you can always turn it back on with the click of a button.</p>\n<p>Meanwhile, our smart technology looks for trade opportunities that free up more gains throughout the year.</p>\n<p>It's all part of our future forward custodial platform.</p>\n<p>A tool that pairs the power of automation with your personal touch.</p>\n<p>To learn more about making the switch to Betterment for Advisors, visit betterment dot com slash switch.</p>","updated_date":1686700800000,"wistia_id":"zpbrhqvb9t"},{"description":"Examine the fundamental steps for bringing new clients into Betterment. This includes creating client households and selecting investment strategies, streamlining the entire process.","entity_footer_disclosure":{"createdAt":null,"createdByUserId":0,"id":3,"isHubspotDefined":false,"label":"entity_original_content","labelTranslations":{},"name":"entity_original_content","order":0,"type":"option","updatedAt":null,"updatedByUserId":0},"hs_child_table_id":0,"hs_created_at":1697568659074,"hs_deleted_at":0,"hs_id":140603848074,"hs_initial_published_at":1726137420482,"hs_is_edited":false,"hs_name":"Getting the basics of client onboarding","hs_path":"client-onboarding-demo","hs_published_at":1740678507671,"hs_updated_at":1726137912228,"hs_updated_by_user_id":62884969,"meta_description":"Examine the fundamental steps for bringing new clients into Betterment. This includes creating client households and selecting investment strategies, streamlining the entire process.","optional_footer_disclosures":[{"createdAt":null,"createdByUserId":0,"id":3,"isHubspotDefined":false,"label":"optional_b4a_betterment_llc","labelTranslations":{},"name":"optional_b4a_betterment_llc","order":0,"type":"option","updatedAt":null,"updatedByUserId":0}],"order":2,"playlist":{"createdAt":null,"createdByUserId":0,"id":4,"isHubspotDefined":false,"label":"Product features and demos","labelTranslations":{},"name":"Product features and demos","order":3,"type":"option","updatedAt":null,"updatedByUserId":0},"show_on_hub":1,"thumbnail":{"url":"https://www.betterment.com/hubfs/clientonboarding.png","altText":"clientonboarding","fileId":178269652598,"height":240,"type":"image","width":479},"title":"Getting the basics of client onboarding","transcript":"<p>NARRATOR: Betterment for Advisors offers digital client onboarding that's simple, fast, and pain-free. Build a client household, add accounts, choose investment strategies, and more in one easy process. Let's walk through the client onboarding experience from start to finish.</p>\n<p>To get started, click Invite Client on the Summary or Clients page of your Advisor Dashboard. Our onboarding process is designed to be flexible, so it works for advisors who want to queue up an invitation or advisors who want to complete the onboarding process alongside their clients. Start by adding up to two clients per household.</p>\n<p>Add your first client and fill out their personal and financial information. The client's personal details are optional. So you can fill everything out for them or skip any fields you want the client to complete.</p>\n<p>Repeat this process for the second member of the household, as needed. You can choose to copy over address information from the first client to save time.</p>\n<p>After setting up the household, you'll be able to add accounts for each client. Add all of the relevant account types, and then go to the next step to configure each account. Select Choose strategy to view all of the account controls on one page.</p>\n<p>Choose from Betterment's pre-built models or your firm's custom models. And then set the asset allocation. You can view the holdings and portfolio projections on this page and can customize the account settings too. In the final step, you can customize your billing plan for the client household before sending them their complete welcome package for approval.</p>\n<p>And that's it. You've set up everything you need to onboard a new client household.</p>\n<p>Your client can complete the entire welcome package in one step. They'll receive a branded email from your firm, inviting them to review the account details, sign off on your firm's agreements, and set up their login to the platform.</p>\n<p>In just a few clicks on any device, they're ready to invest. It's that simple. To learn more about Betterment for Advisors' digital client onboarding, visit betterment.com/advisors.</p>","updated_date":1681084800000,"wistia_id":"d2clr2plog"},{"description":"Understand how to easily connect external accounts like 401(k), savings, and brokerage accounts. Help your clients plan for the future by consolidating all their financial information in one convenient location.","entity_footer_disclosure":{"createdAt":null,"createdByUserId":0,"id":3,"isHubspotDefined":false,"label":"entity_original_content","labelTranslations":{},"name":"entity_original_content","order":0,"type":"option","updatedAt":null,"updatedByUserId":0},"hs_child_table_id":0,"hs_created_at":1697568659086,"hs_deleted_at":0,"hs_id":140603848075,"hs_initial_published_at":1726137420482,"hs_is_edited":false,"hs_name":"How to sync external accounts","hs_path":"syncing-external-accounts-demo","hs_published_at":1740678507671,"hs_updated_at":1726137881898,"hs_updated_by_user_id":62884969,"meta_description":"Understand how to easily connect external accounts like 401(k), savings, and brokerage accounts. Help your clients plan for the future by consolidating all their financial information in one convenient location.","optional_footer_disclosures":[{"createdAt":null,"createdByUserId":0,"id":3,"isHubspotDefined":false,"label":"optional_b4a_betterment_llc","labelTranslations":{},"name":"optional_b4a_betterment_llc","order":0,"type":"option","updatedAt":null,"updatedByUserId":0}],"order":3,"playlist":{"createdAt":null,"createdByUserId":0,"id":4,"isHubspotDefined":false,"label":"Product features and demos","labelTranslations":{},"name":"Product features and demos","order":3,"type":"option","updatedAt":null,"updatedByUserId":0},"show_on_hub":1,"thumbnail":{"url":"https://www.betterment.com/hubfs/syncexternal.png","altText":"syncexternal","fileId":178270095939,"height":240,"type":"image","width":479},"title":"How to sync external accounts","transcript":"<p>In addition to linking a bank account, your client also has the ability to sync external accounts, such as 401(k), savings, and external brokerage accounts.</p>\n<p>To sync an external account, simply click on Sync Account on the Home page of the client portal.</p>\n<p>You will see a list of outside financial firms. Click on the firm your client uses, or search for it in the search bar. Your client will then be prompted to enter their digital login credentials.</p>\n<p>Once the account has been synced, both you and your client will be able to view it in the External Accounts tab under Settings.</p>\n<p>The advisor can use the balance and holdings information provided to make recommendations. Syncing external accounts is highly recommended because it makes the transfer process faster and more efficient. It also allows the client to see their total financial picture in one place so they can plan for their future.</p>","updated_date":1636848000000,"wistia_id":"e8fuvmeeg0"},{"description":"We'll show you how you can easily link back accounts for deposits with Betterment for Advisors.","entity_footer_disclosure":{"createdAt":null,"createdByUserId":0,"id":3,"isHubspotDefined":false,"label":"entity_original_content","labelTranslations":{},"name":"entity_original_content","order":0,"type":"option","updatedAt":null,"updatedByUserId":0},"hs_child_table_id":0,"hs_created_at":1697568659097,"hs_deleted_at":0,"hs_id":140603848076,"hs_initial_published_at":1726137420482,"hs_is_edited":false,"hs_name":"Linking a bank account for deposits","hs_path":"linking-bank-account-demo","hs_published_at":1740678507671,"hs_updated_at":1726137845495,"hs_updated_by_user_id":62884969,"meta_description":"We'll show you how you can easily link back accounts for deposits with Betterment for Advisors.","optional_footer_disclosures":[{"createdAt":null,"createdByUserId":0,"id":3,"isHubspotDefined":false,"label":"optional_b4a_betterment_llc","labelTranslations":{},"name":"optional_b4a_betterment_llc","order":0,"type":"option","updatedAt":null,"updatedByUserId":0}],"order":4,"playlist":{"createdAt":null,"createdByUserId":0,"id":4,"isHubspotDefined":false,"label":"Product features and demos","labelTranslations":{},"name":"Product features and demos","order":3,"type":"option","updatedAt":null,"updatedByUserId":0},"show_on_hub":1,"thumbnail":{"url":"https://www.betterment.com/hubfs/linkbank.png","altText":"linkbank","fileId":178269024915,"height":240,"type":"image","width":479},"title":"Linking a bank account for deposits","transcript":"<p>Bank linking is an important first step for clients after they open an account on the platform.</p>\n<p>For example, here we have a sample new client named Angela.</p>\n<p>Once she logs in, you would direct her to the settings tab in the bottom left hand corner and tell her to click on bank accounts. If Angela were logging in for the first time, she will see logos of several major US banks listed and can simply click on the name of her bank and enter her online banking credentials.</p>\n<p>Alternatively, she can also enter her routing and account number to link her bank manually.</p>\n<p>Once the account is linked, clients can immediately make a deposit.</p>\n<p>Please note linking bank accounts cannot be done by the advisor on behalf of the client. However, once the bank account is linked, advisors can set up deposits and withdrawals on behalf of their clients.</p>","updated_date":1636848000000,"wistia_id":"8lgfabob61"}] {"pt_lg":24,"pt_sm":24} .bt-section-padding-24482424{ padding-top: 24px; padding-bottom: 48px; } @media(max-width:699px){ .bt-section-padding-24482424{ padding-top: 24px; padding-bottom: 24px; } } Webinars Go deep with expert insights that can help you take your practice to the next level. {"pt_lg":64,"pt_sm":64} .bt-section-padding-6424648{ padding-top: 64px; padding-bottom: 24px; } @media(max-width:699px){ .bt-section-padding-6424648{ padding-top: 64px; padding-bottom: 8px; } } Plan smarter, scale faster with Betterment for Advisors In our latest webinar with XYPN, learn how XYPN member, Ryan Frailich, CFP®, built his firm from the ground up using Betterment for Advisors as his custodian. Discover how he uses our powerful tools and XYPN’s tech stack to scale as a solo practitioner. How will AI impact financial advice? Explore the future of financial advising with experts from Betterment for Advisors. See how AI and personal advice intersect, learn strategies to keep a'''
