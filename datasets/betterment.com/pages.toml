full_description = '{"contactRecords":[],"inputs":{"career_outcome":{"bottom_disclaimer":"<p><span>Betterment’s Life Goals Quiz is for informational purposes only, and it should not be construed as financial advice. The quiz is designed to simply help you think through the financial goals that matter, and the results are not specific investment recommendations. Please open a Betterment account for actual recommendations or&nbsp;</span><a href=\"https://www.betterment.com/advice-packages/\" target=\"_blank\" rel=\"noopener\">consult our team</a><span>&nbsp;of financial experts. As always, your responses will be completely anonymous. We will not share, sell, rent, or trade this information without your approval. For more information, please see our&nbsp;</span><a href=\"https://www.betterment.com/security/privacypolicy/\" target=\"_blank\" rel=\"noopener\">Privacy Policy</a><span>.</span></p>","content_1":{"variant_1":{"content":"<p>Dealing with debt can feel like a major hurdle. <a href=\"https://www.betterment.com/resources/invest-or-pay-off-debt/\"><span>We suggest </span></a>paying down that debt before you pursue major investment moves.</p>","headline":"Tackle high-interest debt"},"variant_2":{"content":"<p>Ensure your annual deposits to retirement accounts are on track. <a href=\"https://www.betterment.com/retirement/\" style=\"color: #337ab7;\"><span>Our planning tools</span></a> help you figure out just how much you’ll need in retirement so you can enjoy it when that day comes.</p>","headline":"Make a plan for your retirement"},"variant_3":{"content":"<p>You shared a lot about what you want in life. When you sign up, you can turn these ideas into goals, and we’ll help you save and invest for each.</p>","headline":"Turn your hopes into real financial goals"}},"content_2":{"variant_1":{"content":"<p>Ensure your annual deposits to retirement accounts are on track. <a href=\"https://www.betterment.com/retirement/\" style=\"color: #337ab7;\"><span>Our planning tools</span></a> help you figure out just how much you’ll need in retirement so you can enjoy it when that day comes.</p>","headline":"Make a plan for your retirement"},"variant_2":{"content":"<p>You shared a lot about what you want in life. When you sign up, you can turn these ideas into goals, and we’ll help you save and invest for each.</p>","headline":"Turn your hopes into real financial goals"}},"content_3":{"variant_1":{"content":"<p>You shared a lot about what you want in life. When you sign up, you can turn these ideas into goals, and we’ll help you save and invest for each.</p>","headline":"Turn your hopes into real financial dreams"}},"headers":{"variant_1":{"content":"<p>Be prepared for when life throws you a curveball with at least 3 months of living expenses saved up. You can get your fund growing by setting up a <a href=\"https://www.betterment.com/resources/emergency-funds/\"><span>Safety Net goal</span></a>.</p>","featured_image":{"alt":"life-float-blue","height":311,"loading":"lazy","max_height":311,"max_width":871,"size_type":"auto","src":"https://www.betterment.com/hubfs/Graphics/webpage-graphics/life-float-blue.png","width":871},"headline":"Build an emergency fund"},"variant_2":{"content":"<p>Dealing with debt can feel like a major hurdle. <a href=\"https://www.betterment.com/resources/invest-or-pay-off-debt/\"><span>We suggest</span></a> paying down that debt before you pursue major investment moves</p>","featured_image":{"alt":"coin-teal","height":311,"loading":"lazy","max_height":311,"max_width":870,"size_type":"auto","src":"https://www.betterment.com/hubfs/Graphics/webpage-graphics/coin-teal.png","width":870},"headline":"Tackle high-interest debt"},"variant_3":{"content":"<p>Ensure your annual deposits to retirement accounts are on track. <a href=\"https://www.betterment.com/retirement/\"><span>Our planning tools</span></a> help you figure out just how much you’ll need in retirement so you can enjoy it when that day comes.</p>","featured_image":{