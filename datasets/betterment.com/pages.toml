title = "Betterment Help Center | Common questions"
description = "Common questions | Customer help center and frequently asked questions for Betterment clients and 401(k) participants"
full_description = '''Help Center Common questions Explore frequently asked questions by new customers Table of content Close Icon Company information Financial security Getting started How It Works Managing my account Company information How is Betterment different? Caret Down Icon Traditionally, people have manually managed their money and investments, which can be a very time consuming and painful process, or they've paid very costly fees to have access to financial advisors and advanced investment strategies. You may be a first-time investor just starting out, a seasoned investor wondering if you could be doing better, or a retiree thinking about ways to make your nest egg last. For those seeking an alternative to expensive advisor fees or the labor-intensive process ... Read More How does Betterment compare to other financial companies? Caret Down Icon We like to point to three major ways we're focused on the customer: We're a fiduciary—we are required to act in your best interest and we're required to disclose any potential conflict of interest. For instance, Betterment does not have or recommend any Betterment-created funds for its client portfolios Our platform combines powerful technology with personalized advice developed by our passionate team of experts. When you have questions, our Customer Support team is ready to help you with ... Read More Who are the experts behind Betterment? Caret Down Icon Our team of investing experts make decisions about our portfolio strategies and fund selection with the help of an external committee of economists, PhDs, and industry experts. More than just a portfolio management team, our experts work to develop improvements to our Tax Smart technology and other advanced strategies. Read More Is Betterment a regulated financial institution? Caret Down Icon Betterment LLC is an SEC-registered Investment Advisor, and brokerage services provided to clients of Betterment LLC is done by Betterment Securities, an SEC-registered broker-dealer and member of FINRA /SIPC. Read More What is your Mission Statement? Caret Down Icon We are here to empower people to do what's best for their money so they can live better. We’re building smarter, more efficient money management for everyone. By pushing the bounds of what technology can do, by bringing together some of the best software and analytic thinking of diverse, cutting edge industries, we’re able to ensure that more people get the advice that they deserve. We have the ability to help free our customers to pursue what is most meaningful to them, to spend their time ... Read More Financial security How do you keep my money safe? Caret Down Icon Betterment Securities is a member of SIPC, which protects securities customers of its members up to $500,000 (including $250,000 for claims for cash). Explanatory brochure available upon request or at www.sipc.org. What you should remember is that the SIPC does not protect against market changes in your account. The risks inherent in investing are tradeoffs you make to pursue investment returns. We design our portfolio to aim for the highest projected returns given your risk level. With our ... Read More What happens to my money if Betterment goes public, is acquired, or closes? Caret Down Icon Betterment Securities is a member of the Securities Investor Protection Corporation (SIPC), which protects securities customers of its members up to $500,000 (including $250,000 for claims for cash). Explanatory brochure available upon request or at www.sipc.org. At a high level, you can think of SIPC as providing protection for funds held in a brokerage account in the event that the brokerage fails. The Securities Investor Protection Corporation (SIPC) provides insurance that protects your ... Read More Getting started What are Betterment’s fees? Caret Down Icon Betterment offers several fee plans for our investing services. Below we’ve listed a pricing breakdown according to account type and additional fee information. Stocks and Bonds Investing Accounts Betterment’s investment advice is available for 0.25% (25 bps) per year or $4 per month. While it will impact our fees, Betterment does not require you to maintain a minimum balance for your account. We call this our Digital plan because you receive our advice online. The Digital pricing plan for our ... Read More How is a Betterment investment account different from a traditional online brokerage account? Caret Down Icon Betterment offers a variety of features, including: A straightforward pricing model without hidden fees. A straightforward user experience which can help make it easier to understand your finances and set your goals. Automatic diversification of your assets through expert-built portfolios of ETFs . Automatic rebalancing of your portfolio once your balance reaches the minimum threshold. Automatic reinvestment of your dividends. Transaction in exact dollar amounts (so you don't have to buy whole ... Read More Who is eligible to use Betterment? Caret Down Icon Betterment currently only operates in the United States, and for regulatory reasons cannot accept international customers residing outside the United States. This includes U.S. citizens residing and/or working abroad.* Login access to Betterment’s application and/or website may be blocked in certain countries. All customers must be at least 18 years of age in order to consent to all our agreements. Customers must have a permanent U.S. address, a U.S. Social Security Number or an ITIN, and a ... Read More What is Betterment and how does it work? Caret Down Icon Betterment is a smart money manager and the largest independent online financial advisor that serves one purpose: to help you make the most of your money. Betterment helps you manage your money through cash management, guided investing, and retirement planning. We are a fiduciary, which means we act in your best interest. We'll ask a bit about you when you sign up. We'll also gather information when you connect your outside accounts. Then, we'll help you set financial goals and set you up with ... Read More Does Betterment do a credit check? Caret Down Icon No. Since Betterment does not lend out money, the only check we do is an identification (ID) verification as required by law. We do not pull your credit score or act in any way which would impact your credit rating. Read More How It Works Can I invest in an individual stock or fund (ie., S&P 500 index or Apple)? Caret Down Icon No, you cannot invest in an individual stock or fund at Betterment. We aim to invest in a globally-diversified portfolio (which includes over 5,000 companies) made up of low-cost and liquid ETFs. The portfolio was chosen to help provide optimal returns at every level of risk, and is rebalanced as the market fluctuates and as you grow closer to your goal’s end date, if you have a time horizon set. We believe in passive investing. The majority of the evidence shows that active management, whether ... Read More Managing my account What accounts can I open with Betterment? Caret Down Icon Available Account Types: Roth IRA Traditional IRA SEP IRA (single participant only) Inherited IRA (contact us to set up) Individual taxable accounts Joint taxable accounts with rights of survivorship 529 accounts (only available through select employers who use Betterment at Work) Trust accounts (log in from a web browser to open) Cash Reserve (a cash account; funds for specific goals can be held here) Checking account provided by nbkc bank, Member FDIC. Account Types Not Supported: Custodial ... Read More Where can I find account statements? Caret Down Icon Betterment automatically uploads monthly statements in PDF format, typically by the end of the second full week of the month for the previous month. To download your monthly statements: Web browser: Log in to your account. Select "Documents" from the menu to download monthly account statements. Mobile app: Log in to the app. Tap the three lines in the upper left-hand corner to open the menu. Tap "Documents". Tap "Statements". Custom Account Statements If you require a custom account summary for ... Read More Who is available to support me when I need one-on-one advice? Caret Down Icon Our team is here to support you, whether you're facing a technical problem, making a complicated financial move, or looking for personalized guidance from a professional. When you have a question that warrants personal advice, we have a team of CERTIFIED FINANCIAL PLANNERS™ to support you with one-on-one advice, either in a one-time package or with continuous support in our Premium plan. We also have a Concierge Team who can help advise you if you're working on transitioning a substantial ... Read More What mobile platforms does Betterment support? Caret Down Icon Betterment supports apps on iOS and Android. You can download them below: iOS Android Read More Betterment on Facebook Betterment on X Betterment Email Share Betterment Clipboard Share Copied!'''
