title = "Betterment Help Center"
description = "Customer help center and frequently asked questions for Betterment clients and 401(k) participants"
full_description = "Help Center Answers to frequently asked questions about our products. Submit search Popular Help Center articles for our customers What is Betterment and how does it work? Betterment is a smart money manager and the largest independent online financial advisor that serves one ... What is Betterment and how does it work? Betterment is a smart money manager and the largest independent online financial advisor that serves one purpose: to help you make the most of your money. Betterment helps you manage your money through cash management, guided investing, and retirement planning. We are a fiduciary, which means we act in your best interest. We'll ask a bit about you when you sign up. We'll also gather information when you connect your outside accounts. Then, we'll help you set financial goals and set you up with investment portfolios for each goal. For your long-term financial needs (like retirement, next year's vacation, or a down payment), our investment strategy is built on low-cost ETFs (exchange-traded funds) and a risk profile based on how long you plan to invest. For your daily saving and spending, you can use our cash management products that include Checking (which is offered by nbkc bank, Member FDIC) and Cash Reserve, a cash account. Transaction timelines Betterment Account Transfer Times All timelines listed are in business days1 Note: These transactions may ... Transaction timelines Betterment Account Transfer Times All timelines listed are in business days1 Note: These transactions may take longer if you have recently deposited funds into your account. TABLE OF CONTENTS Transfers from an Individual Stocks and Bonds Investing account Transfers from a Joint Stocks and Bonds Investing account Transfers from an Individual Cash Reserve (Inclusive of money held in cash goals) Transfers from a Joint Cash Reserve (Inclusive of money held in cash goals) Transfers from an Individual Checking account Transfers from a Joint Checking account Transfers from a Non-Betterment Checking account Transfers from an Individual Stocks and Bonds Investing account to: (timelines reflected in business days) Individual Stocks and Bonds Investing 1-2 days Joint Stocks and Bonds Investing 1-2 days2 Individual Cash Reserve (Inclusive of money held in cash goals) 2-3 days Joint Cash Reserve (Inclusive of money held in cash goals) 2-3 days2 Individual Checking 2-4 days Joint Checking 2-4 days Non-Betterment Checking 2-4 days Transfers from a Joint Stocks and Bonds Investing account to: (timelines reflected in business days) Individual Stocks and Bonds Investing 1-2 days2 Joint Stocks and Bonds Investing 1-2 days Individual Cash Reserve (Inclusive of money held in cash goals) 2-3 days2 Joint Cash Reserve (Inclusive of money held in cash goals) 2-3 days Individual Checking 2-4 days Joint Checking 2-4 days Non-Betterment Checking 2-4 days Transfers from an Individual Cash Reserve (Inclusive of money held in cash goals) to: (timelines reflected in business days) Individual Stocks and Bonds Investing 1-2 days Joint Stocks and Bonds Investing 1-2 days2 Individual Cash Reserve (Inclusive of money held in cash goals) Same day Joint Cash Reserve (Inclusive of money held in cash goals) Same day Individual Checking Same day3 Joint Checking Same day3 Non-Betterment Checking 1-2 days Transfers from a Joint Cash Reserve (Inclusive of money held in cash goals) to: (timelines reflected in business days) Individual Stocks and Bonds Investing 1-2 days2 Joint Stocks and Bonds Investing 1-2 days Individual Cash Reserve (Inclusive of money held in cash goals) Same day Joint Cash Reserve (Inclusive of money held in cash goals) Same day Individual Checking Same day3 Joint Checking Same day3 Non-Betterment Checking 1-2 days Transfers from an Individual Checking account to: (timelines reflected in business days) Individual Stocks and Bonds Investing 1-3 days Joint Stocks and Bonds Investing 1-3 days Individual Cash Reserve (Inclusive of money held in cash goals) Same day3 Joint Cash Reserve (Inclusive of money held in cash goals) Same day3 Individual Checking Instant Joint Checking Instant Non-Betterment Checking 1-2 days Transfers from a Joint Checking account to: (timelines reflected in business days) Individual Stocks and Bonds Investing 1-3 days Joint Stocks and Bonds Investing 1-3 days Individual Cash Reserve (Inclusive of money held in cash goals) Same day3 Joint Cash Reserve (Inclusive of money held in cash goals) Same day3 Individual Checking Instant Joint Checking Instant Non-Betterment Checking 1-2 days Transfers from a Non-Betterment Checking account to: (timelines reflected in business days) Individual Stocks and Bonds Investing 1-3 days Joint Stocks and Bonds Investing 1-3 days Individual Cash Reserve (Inclusive of money held in cash goals) 1-3 days Joint Cash Reserve (Inclusive of money held in cash goals) 1-3 days Individual Checking 1-5 days4 Joint Checking 1-5 days4 Non-Betterment Checking - Integrated Account (529 Account) 5-7 days 1 Business days are Monday-Friday, excluding bank and market holidays. All transactions can be subject to processing delays in certain circumstances. Deposits should be initiated before 10 pm EST to count towards the stated transfer timeline. 2 Within accounts held at Betterment, we generally only allow transfers involving individual and joint investing accounts if you are listed as married to the account owner. Note: This requirement does not apply if you created the joint account and are the primary account owner. Confirm spouse details or, if you are not married, contact us and we can help you with a manual transfer. These manual transfers generally take 2-3 weeks to complete. 3 A Same-Day Transfer generally allows for cash transfers up to an aggregate daily limit to be completed on the same day between your individual and joint Cash Reserve accounts, your cash goals within your Cash Reserve account, or your Checking and Cash Reserve accounts. Please note that some transfers may take longer, particularly if you have recently deposited funds into your Cash Reserve account. 4 If the transaction is initiated on the Betterment side, the timeline is 4-5 business days. If initiated from your connected funding account’s side, it’s 1-2 business days. What are Betterment’s fees? Betterment offers several fee plans for our investing services. Below we’ve listed a pricing breakdown ... What are Betterment’s fees? Betterment offers several fee plans for our investing services. Below we’ve listed a pricing breakdown according to account type and additional fee information. Stocks and Bonds Investing Accounts Betterment’s investment advice is available for 0.25% (25 bps) per year or $4 per month. While it will impact our fees, Betterment does not require you to maintain a minimum balance for your account. We call this our Digital plan because you receive our advice online. The Digital pricing plan for our stocks and bonds investing accounts is determined by your total Betterment investing balance (based on your combined balance across any stocks and bonds investing accounts, Cash Reserve, and cash goals you hold at Betterment) and your recurring deposit setup. If your household balance is below $20,000, and you do not have at least $250/mo in recurring deposits enabled across your household’s Betterment account(s), you will be charged $4 per month. If your household balance is equal to or above $20,000, or if you have $250/mo or greater in recurring deposits enabled across your household’s Betterment account(s), you will be charged an annual fee of 0.25% (25 bps). For 0.65% (65 bps) per year, you can also gain over-the-phone and/or email access to our team of CFP® professionals who can provide in-depth advice on all your investments as well as help you manage your Betterment account by making changes for you, based on your directions. This Premium plan requires a minimum investing balance of $100,000 (based on your combined balance across any taxable stock and bond investing accounts, IRA, HSA accounts you hold at Betterment). Learn more about additional Premium and our pricing. Balances in excess of $2M If the balance of your stocks and bonds investing account(s) is in excess of $2 million (excluding cash balances held in Cash Reserve, cash goals, Betterment Checking, HSA balances, and 401(k) balances through Betterment at Work), you will receive a 10bps discount on the portion of your balance above $2 million: Stocks and Bonds Investing Accounts Digital: 0.15% (15 bps) per year Premium: 0.55% (55 bps) per year Balances are calculated based on household. If you qualify for part of your balance to be managed free and have a balance above $2 million, the dollars managed free will be those with the higher fee. Calculating Fees Betterment’s pricing plan fee calculation varies depending on your plan. To read in-depth about this topic, please visit this resource. Your total fees can be found on “Activity“, filtered by “Fees”, for a customizable time frame. You can then download a CSV statement to quickly total your fees. What does the fee get you? For traditional securities investing accounts, Betterment’s fee covers the investment advice you receive, your portfolio management, all trading and custody fees associated with your account, transfers, and all other account administration. Are there any transaction fees? We do not charge you additional transaction fees to buy and sell securities within your stocks and bonds portfolios. Any fund held in this type of portfolio at Betterment will assess fund-level fees, called expense ratios, but Betterment aims to keep these costs low, and we receive no part of these fees. Learn more about each fund fee here. In the event you transfer your account to another provider, Betterment charges a flat fee of $75 to process the transfer of each account being sent to another company. Please note that the receiving firm may also have their own transactional fees. Feel free to refer to our FAQs and disclosures for additional information about outbound transfers. Fees on Cash Accounts Finally, Betterment does not charge any account fees for Betterment Checking or Cash Reserve. In regards to Cash Reserve, Betterment LLC only receives compensation from our program banks. Looking for a specific topic? Jump to topic Submit search 401(k) Compliance testing 401(k) participants 529-account 529-account-employer ACATS Transfers Account security Account setup Allocation management Backup Withholding Beneficiaries Betterment Core Portfolio Betterment Q1 2025 Tiered Rollover Reward FAQ Betterment Q2 2025 Tiered Investing Reward FAQ BlackRock Target Income Portfolio Charitable donations Checking account Common questions Debit card Deceased Customers Depositing Deposits Divorce Documentation for Employers FAQ for Marcus Invest Customers Fees Flexible portfolios Goals Goldman Sachs Smart Beta Goldman Sachs Tax Smart Bonds How to Manage Your Betterment Account IRA Match FAQs - Q4 2024 IRAs Identity & Account Verification Joint Accounts Linking External Accounts with Betterment Mobile app Paper checks Performance Powers of Attorney Referral program Retirement Plans Rewards Rollovers and transfers Roth conversions Socially responsible investing Tax Coordination Tax Filing Calendar Tax Filing Forms Tax Form Importing Tiered Investing Reward FAQs Q1 2025 Transactions Transfers Between Betterment Accounts Trust Accounts Wealthsimple transfer Withdrawals cash-reserve connecting accounts No results found"
