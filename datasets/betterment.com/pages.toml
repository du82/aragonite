description = "The Goldman Sachs Tax-Smart Bonds portfolio is designed to benefit high-income individuals (with a federal tax rate of 32% or higher) seeking a higher after-tax yield compared to a cash account. It comprises 100% short-term bond ETFs. Betterment personalizes the portfolio based on your tax situation, offering potentially lower risk than stock investing. Although bond volatility is typically lower than that of stocks, investing in bonds still carries risks, and funds in this account are not FDIC insured as they would be in a cash account. This portfolio is built by Goldman Sachs, one of the world's largest asset managers, and all dividends are reinvested automatically. See disclosures."
