full_description = '''Hassle-free, no-fee checking‡ Betterment Checking is our mobile-first checking account and Visa® Debit Card for your daily spending. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, 'b686f90d-bc69-4bf0-a97b-64a7d3f863c8', {"useNewLoader":"true","region":"na1"}); {"pt_lg":152,"pt_sm":104} .bt-section-padding-1523210432{ padding-top: 152px; padding-bottom: 32px; } @media(max-width:699px){ .bt-section-padding-1523210432{ padding-top: 104px; padding-bottom: 32px; } } Checking accounts and the Betterment Visa® Debit Card provided and issued by nbkc bank, Member FDIC. Checking made available through Betterment Financial LLC. Neither Betterment Financial LLC, nor any of their affiliates, is a bank. {"pt_lg":24,"pt_sm":16} .bt-section-padding-24401640{ padding-top: 24px; padding-bottom: 40px; } @media(max-width:699px){ .bt-section-padding-24401640{ padding-top: 16px; padding-bottom: 40px; } } No fees.‡ Period. ATM fees and foreign fees are automatically reimbursed, plus no overdraft fees. Safe and secure. FDIC-insured up to $250K per depositor subject to certain conditions at nbkc bank, Member FDIC, and deposit network. Plus you can change your PIN or lock your card from the mobile app. Pay your way. Use your tap-to-pay Visa® Debit Card, mobile options like Apple Pay® and Google Pay™ or paper checks. Cash back rewards. Earn cash back at thousands of your favorite brands, like Costco, adidas, and Aeropostale.1 {"pt_lg":72,"pt_sm":64} .bt-section-padding-72446444{ padding-top: 72px; padding-bottom: 44px; } @media(max-width:699px){ .bt-section-padding-72446444{ padding-top: 64px; padding-bottom: 44px; } } Arch illustration - desktop Arch illustration - mobile Where’d the fees go? You shouldn’t have to pay a bank to use your own money. That’s why we reimburse ATM fees and foreign transaction fees worldwide. We also cut out overdraft fees and minimum balances. @media(min-width:963px){ } {"pt_lg":64,"pt_sm":32} .bt-section-padding-64643272{ padding-top: 