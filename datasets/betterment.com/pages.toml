["https://www.betterment.com/careers"]
title = "Careers at Betterment | Help build a new way of investing."
description = "Come work for Betterment. We aim to empower people to do what’s best for their money, so they can live better. Explore open positions at Betterment."
full_description = '''Invest in your career Working at Betterment is more than just a job, it’s an investment in your career. We’re committed to helping people make big dreams come true—including yours. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '4c4ba664-a1f6-44b8-af75-b78f3995731a', {"useNewLoader":"true","region":"na1"}); {"pt_lg":152,"pt_sm":104} .bt-section-padding-15212010496{ padding-top: 152px; padding-bottom: 120px; } @media(max-width:699px){ .bt-section-padding-15212010496{ padding-top: 104px; padding-bottom: 96px; } } Who we are Benefits Our values Diversity and belonging Career growth Jump to Section Please select Who we are Benefits Our values Diversity and belonging Career growth Who we are What is Betterment? Our mission: Making people’s lives better. We work together so people can achieve what they want with their money. But don’t take it from us—take it from the people who work here. {"pt_lg":96,"pt_sm":64} .bt-section-padding-96966464{ padding-top: 96px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-96966464{ padding-top: 64px; padding-bottom: 64px; } } Benefits A well-balanced life. {"pt_lg":96,"pt_sm":84} .bt-section-padding-96648432{ padding-top: 96px; padding-bottom: 64px; } @media(max-width:699px){ .bt-section-padding-96648432{ padding-top: 84px; padding-bottom: 32px; } } Health and wellness. Get comprehensive medical, dental, and vision, plus a free subscription to One Medical.© Generous time off. We encourage you to take time off (seriously) and get the rest you need to do your best work. Paid parental leave. We welcome new additions to your family with 12-18 weeks of parental leave. Matching benefits. We offer a 401(k) match and a match on qualified student loan payments. Equity. Gain stake in Betterment’s success with company equity grants. Free food. Snacks, beverages, and catered lunches at our NYC HQ. Long-term health resources. We provide LGBTQIA+ transition and fertility support. Find your community. Make connections through seven employee affinity groups and a social calendar of hybrid events. {"pt_lg":0,"pt_sm":0} .bt-section-padding-096048{ padding-top: 0px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-096048{ padding-top: 0px; padding-bottom: 48px; } } Our values A meaningful way of working. {"pt_lg":96,"pt_sm":84} .bt-section-padding-9615084100{ padding-top: 96px; padding-bottom: 150px; } @media(max-width:699px){ .bt-section-padding-9615084100{ padding-top: 84px; padding-bottom: 100px; } } Play to win We exceed expectations. We set audacious goals— for the company, our customers, and ourselves—and we won’t stop until we reach them. We don’t just show up; we give our all and celebrate our wins. Make an impact We change lives. We are innovators who transform financial outcomes for our customers. We empower employees to own and lead change. We always strive to do what’s best for the customer—because what’s best for them is what’s best for us. Build better together We value all perspectives. When we collaborate, we’re at our best. We trust each other, even when we disagree, and strive to be a supportive and inclusive community. We believe diverse perspectives lead to better outcomes. Simplify We seek the most direct path. We are financial services pioneers, always looking for ways to improve, optimize, enhance. Constant improvement is in our name. /* min $desktop - setup item vertical offset */ @media(min-width: 964px){ .features-set-image .item-vertical-offset-6a63ba5823a50c19aace74179deea660-100{ bottom:100px; } .features-set-image .item-vertical-offset-a7562b07e5b4a4c63148e3461bd50cc2-100{ bottom:100px; } .features-set-image .item-vertical-offset-1e17cfefcc55a96ebe3aa0fc135998f9-100{ bottom:100px; } .features-set-image .item-vertical-offset-fe2298668075dcdb9f6a4c91c79eb56b-100{ bottom:100px; } .features-set-image .offset-margin-de53f262d7b4bb7c84841916244b04e0{ margin-bottom:-100px; } } /* $desktop - section vertical offset */ @media(m