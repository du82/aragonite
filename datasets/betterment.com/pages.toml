title = "Betterment Help Center | Tax Filing Forms"
description = "Tax Filing Forms | Customer help center and frequently asked questions for Betterment clients and 401(k) participants"
full_description = '''Help Center Tax Filing Forms Tax forms 1099-B, 1099-DIV, 1099-R, 1099-INT, and 5498 Table of content Close Icon Crypto investing Form 1099-B Form 1099-DIV Form 1099-INT Form 1099-R Form 5498 Getting started Income Sources Required Minimum Distributions Tax Features Crypto investing What tax forms will I receive for my crypto accounts? Caret Down Icon Cryptocurrency exchanges are not required to report crypto transactions on Form 1099-DA until the 2025 tax year. However, income from virtual currency transactions is reportable on your income tax returns. Learn more here. To prepare your 2024 taxes, we are providing customers with both a gain/loss report and a transaction report. To download your crypto tax forms on a web browser: Navigate to Documents > Taxes > Crypto. To download your crypto tax forms on the mobile app: Open the menu ... Read More Form 1099-B What is a 1099-B, and will I receive one? Caret Down Icon A 1099-B reports proceeds from selling stocks, bonds, or other securities. "Proceeds" refer to the money received from selling shares. At Betterment, shares may be sold when you: Withdraw funds Pay our quarterly fee Have your portfolio rebalanced Use Tax Loss Harvesting+ to harvest losses Change your allocation or portfolio strategy Transfer funds to another goal with a different risk level Have a Tax-Coordinated Portfolio rebalanced You will receive a 1099-B by Feb. 18, 2025 if you had a ... Read More Why are the sales proceeds and/or cost basis so high on my 1099-B? Caret Down Icon The sales proceeds figure, as defined in your tax forms, is simply the amount of money you received in exchange for selling your shares this year. The cost basis is the amount of money you paid to purchase the shares that are being sold, with possible adjustments for wash sales and non-dividend distributions. Your sales proceeds and cost basis on your 1099-B may be much higher than your portfolio’s earnings or balance was at any given time, because these proceeds represent the total amount of ... Read More Form 1099-DIV What is a 1099-DIV, and will I receive one? Caret Down Icon A 1099-DIV reports dividend payments received and capital gains distributions from stocks you own. You will receive a 1099-DIV by Feb. 15, 2025 if you had a Betterment taxable account and, in 2024: You received more than $10 in dividends, or You paid any foreign or federal taxes within your account If you earned $10 or less in dividends, Betterment is not required to issue a 1099-DIV. However, the IRS still requires you to report and pay taxes on any investment income, regardless of the amount. Read More Why are the dividend dates on my Activity page different than the pay dates on my 1099-DIV? Caret Down Icon When dividends are paid, it may take two or three days for the reinvestment in your account to complete. Dividend reinvestment trades are displayed on Activity on the date the transaction completes. However, dividends are reported on your tax forms on the date they were paid, which will be several days prior to the date of reinvestment. Read More Why did I not receive a 1099-DIV even though I received dividends? Caret Down Icon A 1099-DIV form reports dividends a customer received during the year. You will receive a 1099-DIV if your dividends amount to $10 or more over the course of the year. Even if the amount of dividends received is below $10, the 1099-DIV is required if there were any foreign or federal taxes paid. Find your total dividends by logging in and filtering by “Dividends” for the previous calendar year. You can then download a CSV statement to total up dividend activity for that year. Please note that ... Read More Form 1099-INT What is a 1099-INT form, and will I receive one? Caret Down Icon A 1099-INT reports interest payments received in your Cash Reserve account. You will receive a 1099-INT by Jan. 31, 2025 if you had Cash Reserve and, in 2024: You received $10 or more in interest, or You paid any federal taxes on your interest due to backup withholding If you earned less than $10 in interest, Betterment is not required to issue a 1099-INT. However, the IRS still requires you to report and pay taxes on any earned interest, regardless of the amount. You can view your interest ... Read More Why did I not receive a 1099-INT even though I received interest? Caret Down Icon A 1099-INT form reports interest received during the year. You will receive a 1099-INT if your interest amounts to $10 or more over the course of the year. If the amount of dividends received is below $10, a 1099-INT is required if there were any federal taxes paid due to backup withholding. Please note that while Betterment is generally not required to issue you a 1099-INT if you earned less than $10 of interest from your account, the IRS requires taxpayers are still required by the IRS to ... Read More Form 1099-R What is a 1099-R, and will I receive one? Caret Down Icon A 1099-R reports distributions from retirement accounts, such as IRAs and 401(k)s. You will receive a 1099-R from Betterment on Jan. 31, 2025 if you had a Betterment IRA or 401(k) and, in 2024, you: Took $10 or more in total distributions from a Betterment IRA or 401(k), or Completed a rollover from a Betterment 401(k) to another retirement plan, or Rolled over a Betterment IRA to an employer-sponsored plan (e.g., 401(k) or 403(b)), or Completed an indirect IRA rollover (transferred funds from ... Read More Can you correct my 1099-R if my taxable amount in Box 2a on my 1099-R is incorrect? Caret Down Icon We cannot make changes to Box 2a of the 1099-R. It is the customer’s responsibility to determine the appropriate taxable portion when filing their tax return by completing the Form 8606. The taxable amount in Box 2a on the 1099-R is frequently incorrect for Traditional IRA and Roth IRA distributions. This can happen at many investment firms. Read below to see why this is the case, and how you can correct it when filing your taxes. The taxable portion of a Traditional or Roth IRA distribution is ... Read More Form 5498 How do I report my IRA contributions? Caret Down Icon How do I report my IRA contributions? IRA contributions must be self-reported when filing your taxes. This means you are responsible for including the correct contribution amount on your tax return. To ensure you report the right amount, follow these steps to check your IRA contributions in your Betterment account. How to find your IRA contribution amount before filing On a web browser: Select your IRA from the left-hand menu (it may be listed as "Retirement Account" if you have a ... Read More Getting started Where do I find my cost basis information or access my realized gains? Caret Down Icon Your total cost basis information will be on Form 1099-B, which will be available by Feb. 18, 2025. The 1099-B will list your total cost basis information, broken out between short-term and long-term transactions. Detailed cost basis information for each sale transaction will be available on subsequent pages of the form. Note that although you can run your own cost basis or realized gains reports in your account, these are not official tax forms. Betterment is not a tax advisor, nor should any ... Read More How do I view or download my tax forms? Caret Down Icon How do I view or download my tax forms? To view or download your tax forms in the mobile app: Log into the mobile app. Open the left-hand menu. Tap Documents. Select Taxes, then Tax Forms. Use the year dropdown to select your desired tax year. To view or download your tax forms in a web browser: Log in to Betterment. Select Documents from the left-hand menu. Click the Taxes tab. Use the year dropdown to select your desired tax year. Read More How do I access my tax forms after my Marcus Invest account is closed? Caret Down Icon How do I access my tax forms after my Marcus Invest account is closed? If you were a Marcus Invest customer who transferred to Betterment, access to your historical account documents, including account statements and tax forms, will remain available at marcus.com until December 31, 2025. This information is specific to former Marcus Invest customers. For general Betterment tax forms, these will always be available in the Tax Forms section of your Betterment account. Read More Where can I find Betterment's Federal tax ID number (FEIN)? Caret Down Icon Our Federal tax ID number (FEIN) will be located on your tax forms in the top left-hand corner. You can download your tax forms within your account by Feb. 18, 2025. Betterment is not a tax advisor, nor should any information herein be considered tax advice. Please consult a qualified tax professional. Read More What tax forms do I need for a joint account? Caret Down Icon Both account holders will receive the 1099-B and/or 1099-DIV associated with the joint account. Since Betterment is not a tax advisor, we highly recommend consulting with a tax professional for further questions regarding how to file your taxes in a joint account. Betterment is not a tax advisor, nor should any information herein be considered tax advice. Please consult a qualified tax professional. Read More How do taxes work for investment accounts? Caret Down Icon Taxable Accounts: Individual and Joint With taxable investment accounts, you generally owe taxes each year on the dividends and other distributions paid to you that year. You may also owe taxes when you sell shares, depending on whether or not you’ve realized capital gains on the investment. Taxation of Dividends Most ETFs pay dividends, which are reported on your Form 1099-DIV. These are generally taxable, typically at your ordinary marginal tax rate (0-37%, Federal). For high earners, an ... Read More Where is my FATCA box? Is it checked or unchecked? Caret Down Icon Betterment tax forms do not include a FATCA box, as we do not allow for foreign investments in Betterment accounts. Any tax forms from Betterment that do not have a FATCA box can be considered “unchecked”. Betterment is not a tax advisor, nor should any information herein be considered tax advice. Please consult a qualified tax professional. Read More Income Sources How can I find my state-specific municipal bond ETF interest for my tax return? Caret Down Icon A portion of the dividend income from your municipal bond ETF holdings may be exempt from state income tax, depending on your state’s tax laws. Betterment has calculated this for you, based on your state of residence listed within your account. Simply head to the Documents section of your account and then click the Tax Forms tab to download your Supplemental Tax Statement, which will contain this figure. Most customers who receive a 1099-DIV or 1099 B/DIV from Betterment will also receive a ... Read More How can I find my U.S. Government interest income for my tax return? Caret Down Icon As reported on your 1099-DIV, your Betterment account may have earned U.S. Government interest income due to bond dividends. This is because your taxable investment accounts may be invested in U.S. Government bonds through bond ETFs, per Betterment’s advice. Generally, the U.S. Government interest portion of a fund dividend income is exempt from state and local income taxes. However, there are some states (NY, CT, and CA) that have an “asset test” which requires 50% of the fund’s assets to be ... Read More How can I find my foreign-sourced income for my tax return? Caret Down Icon As reported on your 1099-DIV, your Betterment accounts may have earned foreign-sourced income via dividends, resulting in foreign taxes. This is due to the fact that your taxable investment accounts may be invested in foreign stock and bond ETFs, since Betterment’s portfolio is globally diversified. When filing your tax return, you may be required to report foreign-sourced income, which means you’ll need to report the total of all the foreign-sourced dividend income that you earned. Betterment ... Read More Required Minimum Distributions Where can I find my required minimum distribution (RMD)? Caret Down Icon You generally have to start taking required minimum distributions (RMDs) from your Traditional IRA account after you reach a certain age. Roth IRA accounts do not require withdrawals while you own them. You can find your RMD amount, if applicable, on your FMV or Form 5498 by clicking here. Betterment is not a tax advisor, nor should any information herein be considered tax advice. Please consult a qualified tax professional. Any links provided to other server sites are offered as a matter of ... Read More Tax Features Where will my tax loss harvests be represented? Caret Down Icon Tax Loss harvesting+ is the practice of selling a security that has experienced a loss. By realizing, or "harvesting" a loss, investors are able to help offset taxes on both gains and income. The sold security is replaced by a similar one, which helps maintain an optimal asset allocation and expected returns. While Betterment tracks your TLH+ losses within your account and displays them to those who have enabled the feature, the IRS requires Betterment to report total gain and loss figures from ... Read More How to turn on Tax Loss Harvesting+ Caret Down Icon Tax loss harvesting, or TLH for short, is the practice of selling an asset at a loss, then quickly replacing it with a substitute, all so you can offset taxes on an equal amount of income or capital gains. While TLH offers potential value for most investors, it can actually increase your tax burden in certain cases. Because of this, we don’t recommend the strategy if: Your future tax bracket will be higher than your current tax bracket. You can currently realize capital gains at a 0% tax rate. ... Read More If I have Tax Loss Harvesting enabled, how long will I be in the tertiary position? Caret Down Icon Our optimizer prefers to shed tertiaries from the portfolio when there is no wash sale impact. This does not guarantee that it will be removed, but our optimization algorithms are guided to avoid tertiary exposure. To learn more about TLH+, please review our TLH+ white paper and TLH+ disclosures. Read More How does Tax Impact Preview work? Caret Down Icon Selling shares is a taxable event—those sales could be triggered by a withdrawal or an allocation change. Tax Impact Preview shows the estimated gains and losses the sale is expected to realize, as well as an estimate of the taxes that may result, in real-time, before the transaction is carried out. When initiating a withdrawal amount on the Transfer tab or adjusting the allocation slider on the Advice tab, the estimated tax impact will appear, giving you access to a summary of the short- and ... Read More Betterment on Facebook Betterment on X Betterment Email Share Betterment Clipboard Share Copied!'''
