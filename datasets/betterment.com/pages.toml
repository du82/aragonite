full_description = '''A better way to give We make it easy to donate shares to causes close to your heart while gaining additional tax benefits. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '22358175-9550-4b7f-8112-c7cce4c9aa19', {"useNewLoader":"true","region":"na1"}); {"pt_lg":152,"pt_sm":104} .bt-section-padding-1526410448{ padding-top: 152px; padding-bottom: 64px; } @media(max-width:699px){ .bt-section-padding-1526410448{ padding-top: 104px; padding-bottom: 48px; } } {"pt_lg":0,"pt_sm":0} .bt-section-padding-0000{ padding-top: 0px; padding-bottom: 0px; } @media(max-width:699px){ .bt-section-padding-0000{ padding-top: 0px; padding-bottom: 0px; } } A tax-smart way to support causes you care about. Donating shares held for over a year can reduce your tax bill while still making a positive impact. Betterment partners with both a donor-advised fund and individual charities. @media(min-width:963px){ } {"pt_lg":96,"pt_sm":64} .bt-section-padding-96966464{ padding-top: 96px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-96966464{ padding-top: 64px; padding-bottom: 64px; } } Donate to nearly any U.S. charity through a donor-advised fund. A donor-advised fund (DAF) is a tax-advantaged investment account. With Daffy, you can donate to over 1.5 million charities, schools, and faith-based organizations—all in one place. Learn more about donor-advised funds (DAFs) @media(min-width:963px){ } {"pt_lg":64,"pt_sm":0} .bt-section-padding-6432032{ padding-top: 64px; padding-bottom: 32px; } @media(max-width:699px){ .bt-section-padding-6432032{ padding-top: 0px; padding-bottom: 32px; } } Donate directly to these nonprofit organizations. {"pt_lg":32,"pt_sm":32} .bt-section-padding-32243224{ padding-top: 32px; padding-bottom: 24px; } @media(max-width:699px){ .bt-section-padding-32243224{ padding-top: 32px; padding-bottom: 24px; } } {"pt_lg":0,"pt_sm":0} .bt-section-padding-048048{ padding-top: 0px; padding-bottom: 48px; } @media(max-width:699px){ .bt-section-padding-048048{ padding-top: 0px; padding-bottom: 48px; } } Put in a request for us to add another charity. {"pt_lg":0,"pt_sm":0} .bt-section-padding-064064{ padding-top: 0px; padding-bottom: 64px; } @media(max-width:699px){ .bt-section-padding-064064{ padding-top: 0px; padding-bottom: 64px; } } Why donate shares through Betterment? {"pt_lg":64,"pt_sm":48} .bt-section-padding-64244824{ padding-top: 64px; padding-bottom: 24px; } @media(max-width:699px){ .bt-section-padding-64244824{ padding-top: 48px; padding-bottom: 24px; } } Do more with your money. Betterment doesn't charge processing fees, so your entire donation goes directly to the charity you support. Lower your tax bill. Reduce your long-term capital gains taxes and increase your deductions by donating shares held for over a year. Donate how you want. Choose to donate to a charity directly or support nearly any U.S. nonprofit through a donor-advised fund. {"pt_lg":24,"pt_sm":24} .bt-section-padding-24642464{ padding-top: 24px; padding-bottom: 64px; } @media(max-width:699px){ .bt-section-padding-24642464{ padding-top: 24px; padding-bottom: 64px; } } How donating shares instead of dollars can lead to tax-free investing Learn more @media(min-width:963px){ } {"pt_lg":96,"pt_sm":64} .bt-section-padding-96966464{ padding-top: 96px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-96966464{ padding-top: 64px; padding-bottom: 64px; } } Triangle illustration Ready for a better way to donate? hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '22358175-9550-4b7f-8112-c7cce4c9aa19', {"useNewLoader":"true","region":"na1"}); {"pt_lg":96,"pt_sm":96} .bt-section-padding-9630096300{ padding-top: 96px; padding-bottom: 300px; } @media(max-width:699px){ .bt-section-padding-9630096300{ padding-top: 96px; padding-bottom: 300px; } }'''
