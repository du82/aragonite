our Betterment account (like a deposit, withdrawal, or change in your allocation), we buy and sell shares of stocks and bonds on your behalf in the proper amounts. Betterment takes care of the trading for you. We also trade in order to rebalance your account, change investment options, or otherwise further the investment objectives that you specify through your account. We generally trade within 1-3 business days of transaction initiation, and only within ... Read More IRA transfers Transfers Involving IRA Accounts Caret Down Icon You can transfer funds between Betterment IRAs and most non-trust taxable accounts by logging in from a web browser and selecting Transfer or rollover > Transfer within Betterment. Transfers involving IRAs will follow the same timelines and transaction limits as all other transfers at Betterment, and IRAs are always an Individual Investing account. You may refer to the Transaction Timelines and Transaction Limits tables for the expected timeline and limits on transfer frequency amounts ... Read More How do I complete a Direct IRA Transfer? Caret Down Icon If this is your first direct IRA transfer, don’t worry. We help process direct IRA transfers every day, and we’re here to make it as easy for you as possible. TABLE OF CONTENTS How to Transfer Indirect Rollovers Less Common Special Cases Glossary A direct transfer moves qualified assets directly from one provider to another. No tax consequences: Direct transfers are not counted as distributions or taxable income, therefore they are not subject to any taxes or penalties. No limit: The IRS says ... Read More Limitations Transaction limits Caret Down Icon Betterment Account Transaction Limits All limits listed are in business days. Business days are Monday-Friday, excluding bank and market holidays. Limit of # of Transactions $ Limit Stocks and Bonds Investing Deposits Unlimited $300,000 per day** Stocks and Bonds Investing Withdrawals Unlimited Up to available balance Cash Reserve Deposits Unlimited $300,000 per day** Cash Reserve Withdrawals Unlimited Up to available balance Individual Stocks and Bonds Investing Account > Individual Stocks ... Read More Managing my account What transactions can I initiate from the Betterment app? Caret Down Icon You can change your funding account, manage deposits, and do transfers all on the go with our mobile apps. Change Funding Account Because an electronic ACH transfer is the primary way to move money to and from Betterment, you will not be able to delete the link to your checking account unless you add a new one to replace it with. On the mobile app: After logging in, tap the three bars on the top left. Select “Settings” and then select “Funding Accounts.” Click on the three dots to the right of ... Read More Timelines Transaction timelines Caret Down Icon Betterment Account Transfer Times All timelines listed are in business days1 Note: These transactions may take longer if you have recently deposited funds into your account. TABLE OF CONTENTS Transfers from an Individual Stocks and Bonds Investing account Transfers from a Joint Stocks and Bonds Investing account Transfers from an Individual Cash Reserve (Inclusive of money held in cash goals) Transfers from a Joint Cash Reserve (Inclusive of money held in cash goals) Transfers from an ... Read More Betterment on Facebook Betterment on X Betterment Email Share Betterment Clipboard Share Copied!"
