["https://www.betterment.com/resources/library"]
title = "Betterment Resources | Original Content by Financial Experts"
description = "Explore key investing basics, expert-led insights, and deep dives into the Betterment product."
full_description = '''Education Expert-driven articles and videos about saving and investing. Submit search Investing Cash Planning Help Center Videos Go to topic Please select Investing Cash Planning Help Center Videos How we keep your Betterment account and investments safe So you can invest with peace of mind How we keep your Betterment account and investments safe true So you can invest with peace of mind All investing comes with some risk. But that risk should be based on the market, not your broker. That’s why we safeguard both your Betterment account and your investments with multiple security measures, all so you can log in and invest or save with peace of mind. Here’s a sampling. Four ways we keep your Betterment account safe Two-factor authentication Two-factor authentication (2FA) adds an extra layer of security to your account, like an extra lock on a door. Besides your regular password, 2FA requires a second form of verification such as a code texted to your phone (good) or one served up by an authenticator app like Google Authenticator (even more secure). This helps ensure that even if someone manages to get hold of your Betterment password, they still can't access your account without a second form of verification. Encryption Every time you interact with us, whether on our website or our app, your data is protected by encrypted connections. This means that the information transmitted between your device and our servers is scrambled in a way that only we can understand. Password hashing When you create a password for your Betterment account, it's not stored in plain text. Instead, we use a process called hashing, which converts your password into a unique string of characters. This way, even if our systems were breached, your actual password would remain unknown and unusable by unauthorized parties. App passwords Connecting third-party apps to your Betterment account (or vice versa) unlocks several benefits. You can easily track your net worth on Betterment, for example. Or quickly import your Betterment tax forms to certain tax prep software. When a third-party app asks for your Betterment credentials, instead of using your regular login, we ask you to create a password specifically for that app. In the scenario the third-party app’s connection is compromised, you can easily revoke its read-only access to your Betterment account. Note that some apps may use the OAuth standard, which lets you use your regular login while maintaining a similar level of security as an app password. TurboTax is one such example. Four ways we keep your investments safe Easy verification of holdings Transparency is one of our key principles, so we make it easy to verify everything is in its right place. We not only show each trade made on your behalf and the precise number of shares in which you’re invested, we also list each fractional share sold and the respective gross proceeds and cost basis for each. You can find all this information in the Holdings and Activity tabs for each of your goals. Independent oversight We regularly undergo review by independent auditors. This means auditors reconcile every share and every dollar we say we have against our actual holdings. They also spot check random customer accounts and verify that account statements match our internal records. And they ask questions if anything is even a penny off. No commingling of funds Your funds are kept separate from Betterment’s operational funds. This means that your investments are held in your name and are never mixed with our company finances. In the unlikely event we face financial difficulties, your assets remain secure and untouched. SIPC insurance To add another layer of protection, your Betterment securities are insured by the Securities Investor Protection Corporation (SIPC). This insurance covers up to $500,000 per customer, including a $250,000 limit for cash claims. While SIPC doesn’t protect against market losses, it does provide a safety net in case of a brokerage failure. An explanatory brochure is available upon request or at sipc.org. How you can help In the end, the most important security measure is you. Be on the lookout for suspicious phone calls, texts, and emails (odd-looking URLs, typo-riddled messages, etc.) and know that Betterment will never ask you for your password or 2FA code except when logging in or editing your personal information in the app. Use a strong, unique password for your account, and don’t hesitate to contact us directly if you suspect a scam message and need to verify that we’ve reached out. We’ve got your back, and between the two of us, we can help keep bad actors at bay. Featured How much cash is too much cash to be in savings? Most Recent Posts Save more, sweat less with recurring deposits Save more, sweat less with recurring deposits How one click—and the power of dollar cost averaging—can boost your returns Healthy habits like exercising, eating well, and saving are hard for a reason. They take effort, and the results aren’t always immediate. Except in the case of saving, there’s a simple hack that lowers the amount of willpower needed: setting up recurring deposits. So kick off those running shoes, because you barely have to lift a finger to start regularly putting money into the market. $2, $200, it doesn’t matter. This one deposit setting, along with a little help from something called dollar cost averaging, can lead to better returns. Our own data shows it: Over the past 5 years, Betterment customers who automated their deposits earned nearly 3% higher annual returns than those who did not. *Based on Betterment’s internal calculations for the Core portfolio. Users in the “auto-deposit on” groups earned nearly an additional 2% annualized over 10 years and nearly 2% over the last year. See more in disclosures. Three big reasons they fared better than those who rarely used recurring deposits include: When you set something to happen automatically, it usually happens. It's relatively easy to skip a workout or language lesson. All you need to do is … nothing. But the beauty of recurring deposits is it takes more energy to stop your saving streak than sustain it. When you regularly invest a fixed amount of money, you're doing something called dollar cost averaging, or DCA. DCA is a sneaky smart investment strategy, because you end up buying more shares when prices are low and fewer shares when prices are high. A steady drip of deposits helps keep your portfolio balanced more cost-effectively. Instead of selling overweighted assets and triggering capital gains taxes, we use recurring deposits to regularly buy the assets needed to bring your portfolio back into balance. Now it’s time for an important caveat: The benefits of dollar cost averaging don't apply if you have a chunk of money lying around that’s ripe for investing. In this scenario, slowly depositing those dollars can actually cost you, and making a lump sum deposit may very well be in your best interest. But here’s the good news: While DCA and lump sum investing are often presented in either/or terms, you can do both! In fact, many super savers do. You can budget recurring deposits into your week-to-week finances—try scheduling them a day after your paycheck arrives so you’re less likely to spend the money. Then when you find yourself with more cash than you need on hand, be it a bonus or otherwise, you can invest that lump sum. Do both, and you may like what you see when you look at your returns down the road. See what's in store for our annual portfolio updates See what's in store for our annual portfolio updates Tweaks to Core, Value Tilt, SRI, and Innovative Tech are coming soon. When you pay someone to manage your investing, it's good to know exactly what you're paying for. In one sense, you’re paying for how your shares are bought, sold, and held. Our sophisticated spins on strategies like asset location, for example, can help minimize your taxes and maximize your returns. Then there's the collections of investments themselves, and making sure these portfolios keep up with market conditions. We do this in part by regularly adjusting our portfolios' asset allocations, or the specific weights of asset classes (i.e., stocks and bonds) and subasset classes (large cap stocks, long-term bonds, etc.). Let's quickly walk through our approach to portfolio management, or feel free to skip ahead to preview the upcoming changes. How we evaluate and manage our portfolios It all starts with sizing up asset classes. We run a rigorous, data-driven process to form long-term expectations for both the returns and the risk levels of various classes. From there, we simulate thousands of paths for the market, and average the optimal asset allocations to build more robust portfolio weights. This “Monte Carlo” technique is ideal when random variables are everywhere, such as capital markets. Lastly, it’s important to reiterate that while things like interest rate shifts and federal fiscal policy can drive short-term market volatility, we manage our portfolios based on long-term outlooks. We keep an eye on the short-term, but we don’t chase trends. This year's updates, in a nutshell For starters, we're updating a handful of portfolios, ones we build and manage ourselves. We offer a few others managed by partners like Goldman Sachs and BlackRock—you can check out those allocations in the Betterment app or on our website. This year’s updates, which are much smaller in scope and scale than last year’s, will encompass these portfolios: Core Value Tilt All three Socially Responsible Investing portfolios Innovative Technology Select Betterment Premium-exclusive portfolios Here's what's changing. More U.S. exposure While we don't advise going all-in on American markets, the forecasted risk-adjusted return for the U.S. remains strong in the long run (think: decades) relative to international markets. So similar to last year’s portfolio updates, we’re dialing down the international exposure for most portfolios. Those portfolios will see: Small increases in U.S. stock and bond allocations Small decreases in international emerging market stocks and bonds Small decreases in international developed market bonds More short-term corporate bonds The biggest change this year will be felt by portfolios with larger bond allocations. We expect U.S. short-term, high-quality corporate bonds to offer higher yields without undue increases in long-term risk, so we’re increasing the exposure to them while decreasing the weight of short-term U.S. Treasuries. The yields on these types of treasury bonds, which mature in a year or less, tend to fall right along with interest rates, and a lower interest rate environment is still expected in the long run. New innovation ETF Separately, we’re diversifying the Innovative Technology portfolio by adding a new actively-managed fund. This new ETF builds on themes like AI and biotech while adding more exposure to large-cap stocks and the Information Technology sector (hardware, software, etc.) as a whole. Sit back and enjoy the switch The great thing about technology like ours is that it makes implementing updated portfolios simple. Our automated rebalancing will tax-efficiently transition customers’ portfolios to the new target weights over time. It’s yet another example of how we make it easy to be invested. U.S. stocks have been hot, so why bother going global? U.S. stocks have been hot, so why bother going global? If you’re feeling S&P envy, you’re not alone. Here’s the case for keeping a little international exposure in your investing. At some point in your investing journey, you may look at your returns and wonder if they could be better. And if you're a Betterment customer? Someone who's been invested in one of our globally-diversified portfolios? Be prepared for one question in particular to creep into your mind: "Wait, why isn’t my Core portfolio keeping up with the S&P 500?" The question comes up from time to time — and the answer largely lies in a little thing called home bias. To better understand it, let's first take a quick tour through the magical world of markets. Hello, world. We're here to invest. We talk a lot about the "market" at Betterment, but in reality there is no one, single market. Instead, a bunch of interconnected markets are spread out across the world. And broadly speaking, from our perspective here in the States, you can place them into one of three buckets: The U.S. market International developed markets (Japan, much of Europe, etc.) International emerging markets (Brazil, India, etc.) The U.S. market is big, but it's far from being the only player in the game. There are still trillions of dollars of assets trading hands in international markets. It's why our Core portfolio, built in part on the idea that more diversification equals less risk, roughly mirrors the relative weights of these players. The U.S. market has been on a tear since 2010. But that's not likely to last forever. So let's switch gears to performance, and how to look at recent trends through a more historical lens. Hello, home bias ("U-S-A! U-S-A!”) American exceptionalism is in our blood; we can't help it. It also shows up in our investing by way of home bias, or the tendency for American investors to favor American markets. And is it any surprise right now? The U.S. economy has recovered from the pandemic far faster, and to a much larger extent, than other countries. The S&P 500, though it doesn’t represent the total U.S. stock market, is composed of the biggest American companies, name brands like Apple and Ford, so it's become shorthand for investing's Team America. And while it’s been surging this decade, international markets cleaned up in the 2000s. Historically-speaking, we take turns in the lead every 5 to 10 years. So what’s an investor to do? The cautionary tale of picking stocks applies here, because we don't advise picking markets either. If you're investing for the long term, the odds are good the U.S. market will hit a rough patch at some point. And in that scenario, a globally-hedged portfolio will very likely smooth out your returns from year to year, making your investing journey feel less like a hair-raising roller coaster. That being said, diversification is a sliding scale. There is no pass/fail, no bad or good. And sometimes, good enough is good enough. Imagine you've been saving for retirement the last 40 years. The difference in annualized returns for an all-U.S. stock portfolio vs. a globally-diversified one (e.g. 60% U.S.) over that time span would have been (drumroll, please): 1.15%. And while 1% makes a difference over time (it’s why we harp on taxes and fees so much), if you've been saving steadily over that time, you're likely in good shape either way. So here's yet another chance to breathe easy. Both options—All-American and Mostly-American—have been reliable roads to long-term wealth in the past 40 years. The numbers, while purely hypo'''
