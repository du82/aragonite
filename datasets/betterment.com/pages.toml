full_description = '''Designed to help your money grow Understand how much it costs to save, spend, and invest with Betterment. {"pt_lg":152,"pt_sm":104} .bt-section-padding-15216410496{ padding-top: 152px; padding-bottom: 164px; } @media(max-width:699px){ .bt-section-padding-15216410496{ padding-top: 104px; padding-bottom: 96px; } } Pricing at Betterment. {"pt_lg":64,"pt_sm":64} .bt-section-padding-640640{ padding-top: 64px; padding-bottom: 0px; } @media(max-width:699px){ .bt-section-padding-640640{ padding-top: 64px; padding-bottom: 0px; } } Investing Expert-built stock and bond portfolios to help you build wealth. $4 monthly fee or 0.25%1 annual fee hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '1df1227a-01b9-4621-88f0-97b8db2155df', {"useNewLoader":"true","region":"na1"}); Learn more Caret Down Icon $0 minimum balance Multiple portfolio options Advanced tax-saving tools Automated rebalancing Traditional and Roth IRAs 1 1 The base price for investing accounts is $4/month. You automatically switch to an annual price of 0.25% on your investing account balance by setting up recurring monthly deposits or transfers totaling $250 or more or reaching a balance of $20,000 or more across your Betterment investing accounts—including Cash Reserve. Learn more Cash Reserve Grow your savings with our high-yield cash account. No fee hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '8c8fb19e-6e1f-459c-8a81-ca8af5cd7659', {"useNewLoader":"true","region":"na1"}); Learn more Caret Down Icon 4.00% (variable) APY* $0 minimum balance Up to $2 million FDIC insured† with program banks, subject to certain conditions Unlimited transfers Cash Reserve is only available to clients of Betterment LLC, which is not a bank, and cash transfers to program banks are conducted through the clients' brokerage accounts at Betterment Securities. For Cash Reserve ("CR"), Betterment LLC only receives compensation from our program banks; Betterment LLC and Betterment Securities do not charge fees on your CR balance. Learn more Checking Everyday spending with rewards and benefits. No fee‡ hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '37649850-bebb-4fe2-8ee9-61971b2605ff', {"useNewLoader":"true","region":"na1"}); Learn more Caret Down Icon $0 minimum balance No ATM fees FDIC-insured up to $250K, subject to certain conditions at nbkc bank, Member FDIC, and deposit network. Earn cash back rewards Checking accounts and the Betterment Visa Debit Card provided and issued by nbkc bank, Member FDIC. Checking made available through Betterment Financial LLC. Neither Betterment Financial LLC, nor any of their affiliates, is a bank. Learn more INVESTING ADD-ON Premium Personalized 1:1 advice for your full financial life. $100K minimum investing balance and 0.65% annual management fee hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '35b7a389-2873-4bf1-9118-35d27189a435', {"useNewLoader":"true","region":"na1"}); Learn more Caret Down Icon Access to a team of CFPs® and prioritized Customer Support for your account 0.25% additional Preferred Cash Reserve Rate boost Access to an exclusive U.S.-only portfolio 20% off estate planning with Trust & Will Premium requires a minimum of $100,000 in assets with Betterment to upgrade and maintain eligibility in the plan. Assets can be in your IRA, HSA and Investing accounts (Taxable). {"pt_lg":64,"pt_sm":32} .bt-section-padding-64963264{ padding-top: 64px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-64963264{ padding-top: 32px; padding-bottom: 64px; } } Arch illustration - desktop Arch illustration - mobile Calculate your investing cost. Initial deposit $4 monthly 0.25% annually Recurring deposits or transfers I'll set up a recurring monthly deposit or recurring transfer of $250 or more. Loading ...loading hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '4effd7d2-e029-4b8e-a60a-54cebca19abe', {"useNewLoader":"true","region":"na1"}); The base price for investing accounts is $4/month. This automatically switches to an annual price of 0.25% on your investing account balance when you either: Have a total Betterment balance of $20,000 or more across any investing accounts, Cash Reserve, and cash goals you hold at Betterment, or Set up a recurring deposit(s) or transfer(s) of $250/month or more into any account. {"pt_lg":64,"pt_sm":32} .bt-section-padding-648328{ padding-top: 64px; padding-bottom: 8px; } @media(max-width:699px){ .bt-section-padding-648328{ padding-top: 32px; padding-bottom: 8px; } } *Beginning July 8, 2024, Checking balances will no longer count towards your $20,000 balance threshold. {"pt_lg":16,"pt_sm":64} .bt-section-padding-16646464{ padding-top: 16px; padding-bottom: 64px; } @media(max-width:699px){ .bt-section-padding-16646464{ padding-top: 64px; padding-bottom: 64px; } } Benefits to better support you. The technology and people here to help you with your money. {"pt_lg":96,"pt_sm":64} .bt-section-padding-960640{ padding-top: 96px; padding-bottom: 0px; } @media(max-width:699px){ .bt-section-padding-960640{ padding-top: 64px; padding-bottom: 0px; } } All-in-one dashboard. Seamlessly track all your accounts (including connecting those outside Betterment) from one place. Expert guidance. Even before you make your first deposit, we provide advice to help you make smart money decisions. Get in touch with us. Access our Customer Support Team, available five days a week via phone and email. /* min $desktop - setup item vertical offset */ @media(min-width: 964px){ .features-set-image .item-vertical-offset-2e4b87de6fab0143a52864fd616c378c-{ bottom:px; } .features-set-image .item-vertical-offset-af4d9422f4331c78ff393ae5a0c056dc-{ bottom:px; } .features-set-image .item-vertical-offset-39e07c35143ac3fcef0aef6bf1333029-{ bottom:px; } .features-set-image .offset-margin-e4ca3191f1ac4f6e30c30bc2baca983d{ margin-bottom:-px; } } /* $desktop - section vertical offset */ @media(max-width: 963px){ .features-set-image .top-vertical-offset_mobile-{ margin-top: -px !important; } } @media(min-width: 700px) and (max-width: 963px){ } @media(max-width: 699px){ } /* $desktop - horizontal scroll */ /* $desktop - Text color */ @media(max-width:963px){ .features-set-image .top-headeline-dark.top-headeline-dark_mobile{ color:#212121 !important; } } {"pt_lg":64,"pt_sm":32} .bt-section-padding-64163216{ padding-top: 64px; padding-bottom: 16px; } @media(max-width:699px){ .bt-section-padding-64163216{ padding-top: 32px; padding-bottom: 16px; } } Arch illustration - desktop Arch illustration - mobile Curious how we make money? We take transparency seriously around here, which means we keep our pricing and terms easy and straightforward: {"pt_lg":64,"pt_sm":32} .bt-section-padding-640320{ padding-top: 64px; padding-bottom: 0px; } @media(max-width:699px){ .bt-section-padding-640320{ padding-top: 32px; padding-bottom: 0px; } } For Checking, Betterment Financial LLC does not charge fees on your account. We make money from merchants when you use your Visa debit card. For Cash Reserve ("CR"), Betterment LLC only receives compensation from our program banks, and Betterment LLC and Betterment Securities do not charge fees on your CR balance. For Investing and retirement accounts, Betterment LLC charges an annualized asset-based fee (or minimum monthly fee) which covers all of our trading and management costs. /* min $desktop - setup item vertical offset */ @media(min-width: 964px){ .features-set-image .item-vertical-offset--{ bottom:px; } .features-set-image .item-vertical-offset--{ bottom:px; } .features-set-image .item-vertical-offset--{ bottom:px; } .features-set-image .offset-margin-c71b8b75a06bf3131ab11505fcfa5bc2{ margin-bottom:-px; } } /* $desktop - section vertical offset */ @media(max-width: 963px){ .features-set-image .top-vertical-offset_mobile-{ margin-top: -px !important; } } @media(min-width: 700px) and (max-width: 963px){ } @media(max-width: 699px){ } /* $desktop - horizontal scroll */ /* $desktop - Text color */ @media(max-width:963px){ .features-set-image .top-headeline-dark.top-headeline-dark_mobile{ color:#212121 !important; } } {"pt_lg":64,"pt_sm":32} .bt-section-padding-64963264{ padding-top: 64px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-64963264{ padding-top: 32px; padding-bottom: 64px; } } Tax savings can pay your fee. 69% of customers using our tax-loss harvesting feature had their taxable advisory fee covered by likely tax savings (in 2022). Fee coverage and estimated tax savings based on Betterment internal calculations. See more in disclosures. Recurring deposits can help you earn even more. Over the last decade, customers who automated their deposits earned 6% higher annual returns than those who did not. 10-year annualized return based on Betterment internal calculations for the Core portfolio. See more in disclosures. {"pt_lg":16,"pt_sm":32} .bt-section-padding-16323264{ padding-top: 16px; padding-bottom: 32px; } @media(max-width:699px){ .bt-section-padding-16323264{ padding-top: 32px; padding-bottom: 64px; } } Questions about our pricing: How are the fees taken from my account? Caret Down Icon Fees are taken right from your Betterment Investing account at the end of each month. No action is required on your part, and we'll never charge fees if you don't have a balance. Our fees are calculated based on your daily balance of assets under management and assessed monthly, and add up to $4/month or 0.25% annually for investing accounts, and 0.65% for our Premium plan. If a client’s account exclusively consists of mutual funds, due to small price fluctuations in mutual funds that may occur on the transaction date, Betterment will accrue any fees over- or under-assessed and apply the difference to adjust the following period’s fee. Are there discounts if I hold a high balance? Caret Down Icon Yes. For the portion of your household balance above $2M, you'll receive a 0.10% discount on Betterment’s management fee. For Digital investing, you'll pay just 0.15% for the portion of your balance above $2M. For Premium investing, you'll pay 0.55% for the portion of your balance above $2M. Note that HSA, 401(k), Cash Reserve, and Checking balances are excluded from the $2M total balance discount. What counts toward the minimum balance for Premium? Caret Down Icon The minimum balance requirement for the Premium plan is based on your combined balance across taxable, IRA, and HSA assets. If you have a 401(k) through an employer plan with Betterment for Business, an account with a third-party advisor through our Betterment for Advisors platform, a Cash Reserve, or checkingaccount those accounts are also not included in your minimum balance requirement and are subject to separate fee schedules. Are there fees on deposits, withdrawals, or ETFs? Caret Down Icon Betterment will construct your portfolio with ETFs, a type of security that generally tracks a broad-market stock or bond index but trades like a stock on a listed exchange, and these ETFs have embedded fund fees. Betterment's fund selection methodology aims to keep these costs as low as possible, and the dividends paid and reflected in your account's statement already take into account the deduction of these fees by the fund. Betterment does not receive any portion of these fund fees and these fees are in addition to our management fees ($4/month, 0.25% annually for Digital, and 0.65% annually for Premium). We charge a flat fee of $75 for each investing account transfer out of Betterment. There is no fee to withdraw funds to your linked checking account. You are not charged any additional trading or deposit fees. Does it cost more to get additional help if I need it? Caret Down Icon Our Customer Support Team is available at no additional cost to help you with any technical or account management questions. Members of our Customer Support Team are not investment adviser representatives and are not licensed to give financial advice. Customers looking to transfer investments to Betterment have access to our dedicated transfer specialist team. If you're exploring moving $100K or more to Betterment and would like to understand your options, get advice on account set up, and ultimately have dedicated support throughout the transfer process, we offer complimentary access to our Licensed Concierge team. {"pt_lg":96,"pt_sm":64} .bt-section-padding-96966464{ padding-top: 96px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-96966464{ padding-top: 64px; padding-bottom: 64px; } } Triangle illustration Like what you see? Let’s get you started. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '4effd7d2-e029-4b8e-a60a-54cebca19abe', {"useNewLoader":"true","region":"na1"}); {"pt_lg":138,"pt_sm":138} .bt-section-padding-138300138300{ padding-top: 138px; padding-bottom: 300px; } @media(max-width:699px){ .bt-section-padding-138300138300{ padding-top: 138px; padding-bottom: 300px; } }'''
