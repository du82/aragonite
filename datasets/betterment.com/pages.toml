_height":311,"max_width":871,"size_type":"auto","src":"https://www.betterment.com/hubfs/Graphics/webpage-graphics/beach-umbrella.png","width":871},"headline":"Take the guesswork out of your retirement years"}},"headline":"Great work. Here are your suggested first steps for your financial future.","subheadline":""}},"portalData":{"formId":null,"pageName":"The Life Goals Quiz - Start your personal finance journey. | Betterment","portalId":5274572},"section_settings":{"section_id":"life-goals-quiz"},"toggle_on_new_feature":true,"type":"module"} Loading'
