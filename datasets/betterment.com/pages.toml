title = "Where can I find account statements?"
description = "Betterment automatically uploads account statements in PDF format on a monthly basis."
full_description = 'Betterment automatically uploads monthly statements in PDF format, typically by the end of the second full week of the month for the previous month. To download your monthly statements: Web browser: Log in to your account. Select "Documents" from the menu to download monthly account statements. Mobile app: Log in to the app. Tap the three lines in the upper left-hand corner to open the menu. Tap "Documents". Tap "Statements". Custom Account Statements If you require a custom account summary for a specific timeframe, select “+Generate account snapshot” in the top corner. Please note that statements for 401(k), Checking, and crypto accounts cannot be generated via account snapshot. 401(k) Accounts 401(k) account statements are issued quarterly and typically released within the first week of the quarter. Similar to most of your account statements, they can be downloaded within the Documents section of your account. Betterment on Facebook Betterment on X Betterment Email Share Betterment Clipboard Share Copied!'
