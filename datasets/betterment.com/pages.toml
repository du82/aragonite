["https://www.betterment.com/help/close-account"]
title = "How can I close my account?"
description = "You can close any investment account you have in your Betterment account once you’ve removed the funds. You can easily re-open investment accounts if you wish."
full_description = '''You can close any investment account you have in your Betterment account once you’ve removed the funds. You can easily re-open investment accounts if you want to in the future. To close investment accounts you hold at Betterment, the process is simple. Log in from a web browser and select “Settings” and then “Accounts.” Once there, you'll see a list of all your accounts, each with an option to "Close account." Before you can close an account, you must fully remove any funds from the account. If this is something you need to do, you'll be prompted to click "Withdraw" from the close account flow. If you do not close your account immediately after withdrawal, please be aware, you may incur Betterment's $4 per month fee, in lieu of Betterment's asset-based fee, if your withdrawal causes your total account balance to drop below $20,000 and you do not have a recurring deposit of $250 or more enabled. Once the withdrawal is complete, you will then be able to close the account by repeating the above steps. Please note that we are required to retain your sensitive information due to FINRA, SEC and US Patriot Act regulations. Your Betterment account will be accessible in the future, as some customers need to view tax forms in future years. How do I close my joint account? Closing joint accounts works the same way. Either joint account holder can delete a shared joint account directly from "Accounts". If you wish to close a joint account but transfer the funds to an existing individual investment account at Betterment, contact customer service before proceeding. Please note that we are required to retain your sensitive information due to FINRA, SEC and US Patriot Act regulations. Your Betterment account will be accessible in the future, as some customers need to view tax forms in future years. Are there fees for closing an account? Betterment does not charge trading fees or penalties for closing/deleting accounts. If you simply need access to your funds, note that there are no fees for accounts with a $0 balance. Feel free to withdraw—keeping your investment goals set up and your accounts in place—until you are ready to invest with us again. Betterment on Facebook Betterment on X Betterment Email Share Betterment Clipboard Share Copied!'''
year_published = 2018
year_updated = 2018
clearnet = "https://www.betterment.com/help/close-account"
