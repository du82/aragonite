["https://www.betterment.com/help/account-eligibility"]
title = "Who is eligible to use Betterment?"
description = "Betterment currently only operates in the United States, and for regulatory reasons cannot accept international customers residing outside the United State"
full_description = "Betterment currently only operates in the United States, and for regulatory reasons cannot accept international customers residing outside the United States. This includes U.S. citizens residing and/or working abroad.* Login access to Betterment’s application and/or website may be blocked in certain countries. All customers must be at least 18 years of age in order to consent to all our agreements. Customers must have a permanent U.S. address, a U.S. Social Security Number or an ITIN, and a checking account from a U.S. bank. *Betterment supports residents in Puerto Rico and the Virgin Islands. We currently do not support residents in Guam. **Betterment supports U.S. military personnel residing abroad with a valid U.S. address on file, including Army Post Office box. Does Betterment support accounts for minors? We do not offer custodial accounts for minors. All customers must be at least 18 years of age in order to consent to all our agreements. You may, however, create separate savings goals for minors and then make deposits and withdrawals on their behalf. This works great if you’re using Betterment as a tool to show them the benefits of saving. You can even select just their goal in the Performance section of your account to show them performance data. Additionally, if you have a trust set up for the benefit of your children, of which you are the trustee, you can create a Betterment Trust account through this link. Betterment on Facebook Betterment on X Betterment Email Share Betterment Clipboard Share Copied!"
