full_description = '''Get set up with an advisor by your side Exploring Betterment? Looking to move at least $20k? You can receive free guidance from an advisor on how to optimize your account setup and make transferring easy. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '78902f73-3b75-4de9-8167-2b4824f362c7', {"useNewLoader":"true","region":"na1"}); hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '62211282-3ee9-40cf-9d3b-f36d9faceaf5', {"useNewLoader":"true","region":"na1"}); {"pt_lg":152,"pt_sm":104} .bt-section-padding-1526410432{ padding-top: 152px; padding-bottom: 64px; } @media(max-width:699px){ .bt-section-padding-1526410432{ padding-top: 104px; padding-bottom: 32px; } } {"pt_lg":0,"pt_sm":0} .bt-section-padding-0000{ padding-top: 0px; padding-bottom: 0px; } @media(max-width:699px){ .bt-section-padding-0000{ padding-top: 0px; padding-bottom: 0px; } } Dealing with money is complex. Here’s how we can help: {"pt_lg":64,"pt_sm":32} .bt-section-padding-64323216{ padding-top: 64px; padding-bottom: 32px; } @media(max-width:699px){ .bt-section-padding-64323216{ padding-top: 32px; padding-bottom: 16px; } } See if Betterment is right for you. We’ll tailor the conversation around your goals and help you understand whether Betterment fits your needs. Optimize your account setup. Discuss which account types are right for you and how you can make the most of our goal-based platform. Get help transferring your money. Provide an outline on easily transferring money to Betterment, including possible tax implications and transfer timelines. /* min $desktop - setup item vertical offset */ @media(min-width: 964px){ .features-set-image .item-vertical-offset-d57aa149285c70abe03e29721a47ae9e-{ bottom:px; } .features-set-image .item-vertical-offset-687e5a4bf88b4be0429df64ec95cbf09-{ bottom:px; } .features-set-image .item-vertical-offset-6e8a6bd157e3daeb256ddad30bb3d7b6-{ bottom:px; } .features-set-image .offset-margin-3f65923c9494b357d5a2615b633bb3a7{ margin-bottom:-px; } } /* $desktop - section vertical offset */ @media(max-width: 963px){ .features-set-image .top-vertical-offset_mobile-{ margin-top: -px !important; } } @media(min-width: 700px) and (max-width: 963px){ } @media(max-width: 699px){ } /* $desktop - horizontal scroll */ /* $desktop - Text color */ @media(max-width:963px){ .features-set-image .top-headeline-dark.top-headeline-dark_mobile{ color:#212121 !important; } } {"pt_lg":32,"pt_sm":16} .bt-section-padding-320160{ padding-top: 32px; padding-bottom: 0px; } @media(max-width:699px){ .bt-section-padding-320160{ padding-top: 16px; padding-bottom: 0px; } } Partners in setting you up for success. Your situation is unique, and so is your relationship with us. We’re here to listen, answer questions, and offer guidance, so you have the foundation to achieve what you want with your money. @media(min-width:963px){ } {"pt_lg":96,"pt_sm":64} .bt-section-padding-96966464{ padding-top: 96px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-96966464{ padding-top: 64px; padding-bottom: 64px; } } Frequently asked questions: Are there any requirements to talk with a Licensed Concierge? Caret Down Icon To connect with an Investment Advisor Representative, you must be eligible to use Betterment and generally need to be exploring moving $20K or more to us. Depending on your accounts and situation, we can help others from time to time, so please contact us with any questions. How can I know I’m getting sound advice from the team? Caret Down Icon Betterment is a fiduciary, and any advisor representing Betterment is bound by our fiduciary duty to you as a customer. The Licensed Concierge team is made up of Investment Advisor Representatives (IARs), with over a decade of collective experience helping individuals, and who are reported by Betterment to the SEC in our ADV. These IARs have training and certifications to only provide advice that is in your best interest as a customer. If it’s ever not in your best interest to move money to Betterment, our team will tell you so. What will I need to do to prepare for a conversation? Caret Down Icon Since our time together is limited and our goal is to understand your situation, discuss whether Betterment is right for you, and ultimately describe the process and implications of transferring investments, the more we know ahead of time the better. If you’re an existing customer, we ask that you review your personal information and sync any accounts you’d like us to review. If you’re not a customer yet, or are not comfortable syncing your accounts, we’ll ask that you securely upload and send us your most recent statement(s) via email. While not required, taking these steps will help us maximize our time together. {"pt_lg":96,"pt_sm":64} .bt-section-padding-96966464{ padding-top: 96px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-96966464{ padding-top: 64px; padding-bottom: 64px; } } Betterment’s Licensed Concierge Team offers support for individuals transferring assets to Betterment of $20,000 or more, and receives incentive compensation based on assets brought to or invested with Betterment. Betterment’s revenue varies for different offerings (e.g., Betterment Digital and Premium, Cash Reserve) and consequently Team members have an incentive to recommend the offering which results in the greatest revenue for Betterment. The marketing and solicitation activities of these individuals are supervised by Betterment to ensure that these individuals act in the client’s best interest. {"pt_lg":0,"pt_sm":0} .bt-section-padding-096064{ padding-top: 0px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-096064{ padding-top: 0px; padding-bottom: 64px; } } Triangle illustration Ready to talk to an expert? hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '78902f73-3b75-4de9-8167-2b4824f362c7', {"useNewLoader":"true","region":"na1"}); {"pt_lg":24,"pt_sm":32} .bt-section-padding-2460032240{ padding-top: 24px; padding-bottom: 600px; } @media(max-width:699px){ .bt-section-padding-2460032240{ padding-top: 32px; padding-bottom: 240px; } }'''
