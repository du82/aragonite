["https://www.betterment.com/help/keep-money-safe"]
title = "How do you keep my money safe?"
description = "Betterment Securities is a member of SIPC, which protects securities customers of its members up to $500,000 (including $250,000 for claims for cash). Expl"
full_description = "Betterment Securities is a member of SIPC, which protects securities customers of its members up to $500,000 (including $250,000 for claims for cash). Explanatory brochure available upon request or at www.sipc.org. What you should remember is that the SIPC does not protect against market changes in your account. The risks inherent in investing are tradeoffs you make to pursue investment returns. We design our portfolio to aim for the highest projected returns given your risk level. With our cash management products, your money is insured by the FDIC. Individual Cash Reserve accounts have insurance up to $2 million† and joint Cash Reserve accounts offer up to $4 million† in FDIC insurance once funds are deposited into our program banks, subject to certain conditions. Cash Reserve is available to clients of Betterment LLC, which is not a bank, and cash transfers to program banks are facilitated by Betterment Securities. Checking is insured up to $250,000 per depositor subject to certain conditions at nbkc bank, Member FDIC, and deposit network and is provided by Betterment Financial LLC‡. Explore further details about FDIC insurance. Betterment on Facebook Betterment on X Betterment Email Share Betterment Clipboard Share Copied!"
year_published = 2018
year_updated = 2018
