["https://www.betterment.com/help/how-to-connect-accounts"]
title = "How do I connect an external account so that I can view my other savings and retirement accounts alongside my Betterment accounts?"
description = "Connecting your accounts lets you see your holistic financial picture, and allows us to give you better advice."
full_description = "To instantly connect an external account: Web browser: Log in to your Betterment account. Select “Settings” from the lefthand menu. Click on the “Connected accounts” tab then “Connect new”. Choose the institution where your account is located and instantly connect by providing your login credentials. Mobile app: Log into the Betterment app. Tap the three lines in the upper left-hand corner to open the menu. Select “Settings”, then “Connected Accounts”. Tap the “+” to connect a new external account. Choose the institution where your account is located and instantly connect by providing your login credentials. If you are unable to connect your external account using login credentials, consider manually connecting the external account. Please note that this connection type requires manually inputting account data including account type and balance. This data must be updated manually by you, the account owner, to ensure ongoing accuracy. To manually connect an external account: Web browser: Log in to your Betterment account. Select “Settings” from the lefthand menu. Click on the “Connected accounts” tab then “Connect new”. Below the “Connect instantly” button, select “Connect manually instead.” Mobile app: Log into the Betterment app. Tap the three lines in the upper left-hand corner to open the menu. Select “Settings”, then “Connected Accounts”. Tap the “+” button. Below the “Connect instantly” button, select “Connect manually instead.” Betterment on Facebook Betterment on X Betterment Email Share Betterment Clipboard Share Copied!"
year_published = 2018
year_updated = 2018
