full_description = '''Put a team of advisors in your corner with Betterment Premium Our CERTIFIED FINANCIAL PLANNER® professionals are here to offer on-demand guidance and build a personalized plan to help you accomplish what you want with your money. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, 'bff614d8-9613-49ef-afd5-db5ad0726199', {"useNewLoader":"true","region":"na1"}); {"pt_lg":152,"pt_sm":104} .bt-section-padding-1526410432{ padding-top: 152px; padding-bottom: 64px; } @media(max-width:699px){ .bt-section-padding-1526410432{ padding-top: 104px; padding-bottom: 32px; } } {"pt_lg":12,"pt_sm":0} .bt-section-padding-12000{ padding-top: 12px; padding-bottom: 0px; } @media(max-width:699px){ .bt-section-padding-12000{ padding-top: 0px; padding-bottom: 0px; } } Additional Premium perks 0.25% preferred Cash Reserve rate boost Exclusive investing options 20% off estate planning with Trust & Will.¹ Prioritized customer support for your account Exclusive commentary from our experts @media(min-width:963px){ } {"pt_lg":64,"pt_sm":64} .bt-section-padding-64646464{ padding-top: 64px; padding-bottom: 64px; } @media(max-width:699px){ .bt-section-padding-64646464{ padding-top: 64px; padding-bottom: 64px; } } Money is complex. We’re here to simplify it. Let our team of advisors analyze and consolidate your financial life into one clear picture. They’ll then tailor their advice to help you achieve your goals, from buying a home to investing for retirement. $100Kminimum investing balance requirement 0.65%annual fee 95% of customers report being satisfied with CFP conversations. Based on Internal Data from 2023 - 2024 hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, 'bff614d8-9613-49ef-afd5-db5ad0726199', {"useNewLoader":"true","region":"na1"}); @media(min-width:963px){ } {"pt_lg":64,"pt_sm":64} .bt-section-padding-64646464{ padding-top: 64px; padding-bottom: 64px; } @media(max-width:699px){ .bt-section-padding-64646464{ padding-top: 64px; padding-bottom: 64px; } } A plan to cover every angle. Work with our CFP® professionals to bring all aspects of your financial life (including assets outside Betterment) into a consolidated, comprehensive plan. Technology optimized. Our financial tools can automatically monitor and fine-tune your plan through portfolio rebalancing, tax-smart strategies, and more. A team of experts at the ready. Connect with our advisors via email or phone to help navigate changing priorities, adjust your plan as needed, or answer any question, big or small. /* min $desktop - setup item vertical offset */ @media(min-width: 964px){ .features-set-image .item-vertical-offset-93800fc4dd5d2deade979962c4d69e08-{ bottom:px; } .features-set-image .item-vertical-offset-838df9d327147140eb9e5bb9ad3dccef-{ bottom:px; } .features-set-image .item-vertical-offset-3f6373836b843ea944c257e6648f4523-{ bottom:px; } .features-set-image .offset-margin-f767ca9f2d48f1b9828fb67705bded27{ margin-bottom:-px; } } /* $desktop - section vertical offset */ @media(max-width: 963px){ .features-set-image .top-vertical-offset_mobile-{ margin-top: -px !important; } } @media(min-width: 700px) and (max-width: 963px){ } @media(max-width: 699px){ } /* $desktop - horizontal scroll */ /* $desktop - Text color */ @media(max-width:963px){ .features-set-image .top-headeline-dark.top-headeline-dark_mobile{ color:#212121 !important; } } {"pt_lg":24,"pt_sm":12} .bt-section-padding-240120{ padding-top: 24px; padding-bottom: 0px; } @media(max-width:699px){ .bt-section-padding-240120{ padding-top: 12px; padding-bottom: 0px; } } cloud illustration Advice for where you and your money meet. No matter your goals or situation, our advisors are here to offer guidance so you can take every step with confidence. {"pt_lg":96,"pt_sm":64} .bt-section-padding-9612640{ padding-top: 96px; padding-bottom: 12px; } @media(max-width:699px){ .bt-section-padding-9612640{ padding-top: 64px; padding-bottom: 0px; } } {"pt_lg":96,"pt_sm":64} .bt-section-padding-96246412{ padding-top: 96px; padding-bottom: 24px; } @media(max-width:699px){ .bt-section-padding-96246412{ padding-top: 64px; padding-bottom: 12px; } } Arch illustration - desktop Arch illustration - mobile Meet your CFP® Premium Team: {"pt_lg":32,"pt_sm":32} .bt-section-padding-32963264{ padding-top: 32px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-32963264{ padding-top: 32px; padding-bottom: 64px; } } Corbin Blackwell CFP® Nick Holeman CFP®, MSBA, EA, CDAA Kyle McBrien CFP® Sara Kalsman CFP® Mario Najera ChFC®, CFP® Andy Perkins CFP® Erica Grundza CFP® Sam Beauvais CFP® {"pt_lg":48,"pt_sm":36} .bt-section-padding-4812360{ padding-top: 48px; padding-bottom: 12px; } @media(max-width:699px){ .bt-section-padding-4812360{ padding-top: 36px; padding-bottom: 0px; } } As a CFP®, my goal is to have every client walk away with a clear understanding of how they should be invested and how much they should be saving in order to achieve their financial goals. It's to take their complex financial life, and simplify it. Nick Holeman, CFP®, MSBA, EA, CDAADirector of Financial Planning, Betterment {"pt_lg":24,"pt_sm":12} .bt-section-padding-24961264{ padding-top: 24px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-24961264{ padding-top: 12px; padding-bottom: 64px; } } Always acting in your best interest. As a fiduciary, every CFP® on our Premium Team is legally bound to put your interests first, so you can feel secure working together. Salaried only, never motivated by commission or quotas. Licensed from CFP Board with required ongoing education. No upsell, recommends strategies best suited to your situation. Featured on financial news sources like The Wall Street Journal, Bloomberg, and CNBC. @media(min-width:963px){ } {"pt_lg":96,"pt_sm":64} .bt-section-padding-96966496{ padding-top: 96px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-96966496{ padding-top: 64px; padding-bottom: 96px; } } "I have met 3-4 times with Betterment financial advisors to discuss several significant life events in the next 0-5 years (two kids going to college, retirement). I find them very knowledgeable and helpful. I get very detailed follow-up emails which are invaluable." Craig E. "I am no longer using my accounts with Vanguard, and Acorns because of the ease and overall confidence I have with Betterment." James M. {"pt_lg":64,"pt_sm":64} .bt-section-padding-64646464{ padding-top: 64px; padding-bottom: 64px; } @media(max-width:699px){ .bt-section-padding-64646464{ padding-top: 64px; padding-bottom: 64px; } } Non-paid client of Betterment. Views may not be representative, see more reviews at the App Store and Google Play Store. {"pt_lg":12,"pt_sm":12} .bt-section-padding-12641264{ padding-top: 12px; padding-bottom: 64px; } @media(max-width:699px){ .bt-section-padding-12641264{ padding-top: 12px; padding-bottom: 64px; } } Frequently asked questions: What do I get with Premium? Caret Down Icon With Premium at Betterment, you get 1:1 access to advisors whenever you need, deep financial planning across your assets, exclusive content, and easy transitions on top of the same great advice and optimized technology through our digital platform. Our CFP® team has more control over your portfolio and dashboard in Premium to make adjustments that fit your individual needs.Our CFP® team excels at holistic goals-based financial planning. They learn what you want to accomplish, crafting a strategy that lets you prepare, grow, and achieve your goals. You can get advice on which accounts to use, help with a backdoor Roth IRA conversion, transfer assets tax-efficiently, build a retirement plan, and more. We'll also offer guidance on assets held outside of Betterment and collaborate with your CPA or attorney. Additionally, you get a Cash Reserve preferred rate—an additional 0.25% APY* on top of the variable rate along with 20% off estate planning with Trust & Will.¹ You will also receive exclusive content, tools & investing options, in addition to prioritized customer support. While we are not CPAs and cannot file your taxes, we can advise on maximizing your tax efficiency from an investment management and planning perspective. All of this comes at a 0.65% annual fee, still at a fraction of the cost of a traditional advisor, with no hidden fees. What are the eligibility requirements and flexibility? Caret Down Icon Premium requires a minimum of $100,000 in investable assets with Betterment per household to upgrade and maintain eligibility in the plan. Assets can be in your IRA, HSA and Investing accounts. Cash Reserve and Checking do not apply towards to minimum requirement. Premium is here to help you for the long term. However, there is no restriction on adjusting your plan. We understand that changes and significant life events can happen. If you'd like to get started with Premium and determine it's not the right fit for you, you can opt out at any time and still use many of Betterment's advanced technology to support your financial goals. What are the qualifications of the advisors? Caret Down Icon With Premium, you access a small group of CFP®s who work together rather than a dedicated advisor. Our advisors are salaried, never commissioned and licensed by the CFP Board; featured on financial news sources like The Wall Street Journal, Bloomberg, and CNBC. Licensed from the CFP Board. Every Financial Planner at Betterment has passed the official CFP® exam, and continues to complete 30 hours per year of ongoing education. Also, only 1 in 3 advisors in the U.S. are officially CERTIFIED FINANCIAL PLANNER™ professionals, a certification that requires over 6,000 hours of professional experience. Salaried, never commissioned. Our CFP® professionals are salaried only, so they focus on helping you achieve your goals—not their cut. Certified as a fiduciary. Since Betterment is a fiduciary, so are our advisors. That means they're legally responsible to act with your best interest in mind. {"pt_lg":96,"pt_sm":64} .bt-section-padding-96966464{ padding-top: 96px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-96966464{ padding-top: 64px; padding-bottom: 64px; } } Triangle illustration Ready to talk to an expert? hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, 'bff614d8-9613-49ef-afd5-db5ad0726199', {"useNewLoader":"true","region":"na1"}); {"pt_lg":64,"pt_sm":32} .bt-section-padding-6460032240{ padding-top: 64px; padding-bottom: 600px; } @media(max-width:699px){ .bt-section-padding-6460032240{ padding-top: 32px; padding-bottom: 240px; } }'''
