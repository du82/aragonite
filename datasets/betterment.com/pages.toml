["https://betterment.com/legal/privacy-policy"]
title = "Privacy Policy"
full_description = '''Privacy Policy Last updated January 31, 2025 {"pt_lg":152,"pt_sm":104} .bt-section-padding-15212010496{ padding-top: 152px; padding-bottom: 120px; } @media(max-width:699px){ .bt-section-padding-15212010496{ padding-top: 104px; padding-bottom: 96px; } } Introduction Welcome to Betterment. We work hard to protect your personal information and ensure your information is kept private and secure. The following privacy policy outlines the types of personal information that Betterment LLC (“Betterment”), MTG LLC d/b/a Betterment Securities, Betterment for Business LLC, and Betterment Financial LLC (collectively, the “Betterment Entities”) collect, including through our websites (www.betterment.com, advisors.betterment.com, and www.betterment.com/401k), Betterment’s original articles, our iOS mobile application and our Android mobile application. It also explains why we collect your information and how we use it. Privacy is important to Betterment. We will never rent or sell your information to anyone. If you have any questions or if you believe that Betterment has not adhered to this privacy policy, please send us a note at support@betterment.com. We reserve the right to amend this privacy policy at our discretion and at any time. Table of Contents Privacy Notice What does Betterment do with your personal information? How do we use and share your personal information? Who we are What we do Key definitions Full Privacy Policy Information we collect and why How we use your personal information How we share your information Opt-out information How to request deletion of the personal information we collect How your personal information is protected How you can access or change your personal information Anonymized information Other important information Additional disclosures: U.S. state privacy notice and California notice at collection {"pt_lg":16,"pt_sm":16} .bt-section-padding-16161616{ padding-top: 16px; padding-bottom: 16px; } @media(max-width:699px){ .bt-section-padding-16161616{ padding-top: 16px; padding-bottom: 16px; } } What does Betterment do with your personal information? {"pt_lg":0,"pt_sm":20} .bt-section-padding-0202020{ padding-top: 0px; padding-bottom: 20px; } @media(max-width:699px){ .bt-section-padding-0202020{ padding-top: 20px; padding-bottom: 20px; } } Why? Financial companies choose how they share your personal information. Federal and state laws give consumers the right to limit some but not all sharing. Federal and state laws also require us to tell you how we collect, use, share, and protect your personal information. Please read this notice carefully to understand what we do. {"pt_lg":40,"pt_sm":30} .bt-section-padding-40403030{ padding-top: 40px; padding-bottom: 40px; } @media(max-width:699px){ .bt-section-padding-40403030{ padding-top: 30px; padding-bottom: 30px; } } What? The types of personal information we collect and share depend on whether you are a visitor to our website or a customer and, if a customer, the product or service you have with us. Information we collect from customer includes, among other information: Full legal name, date of birth and social security number Information about your financial status Account balance, assets and transaction history A selfie for securing your account When you are no longer our customer, we continue to retain and share your information as described in this notice below. {"pt_lg":40,"pt_sm":30} .bt-section-padding-40403030{ padding-top: 40px; padding-bottom: 40px; } @media(max-width:699px){ .bt-section-padding-40403030{ padding-top: 30px; padding-bottom: 30px; } } How? All financial companies need to share customers’ personal information to run their everyday business. In the section below, we list the reasons financial companies can share their customers’ personal information; the reasons Betterment chooses to share; and whether you can limit this sharing. {"pt_lg":40,"pt_sm":30} .bt-section-padding-40403030{ padding-top: 40px; padding-bottom: 40px; } @media(max-width:699px){ .bt-section-padding-40403030{ padding-top: 30px; padding-bottom: 30px; } } {"pt_lg":16,"pt_sm":16} .bt-section-padding-16161616{ padding-top: 16px; padding-bottom: 16px; } @media(max-width:699px){ .bt-section-padding-16161616{ padding-top: 16px; padding-bottom: 16px; } } How do we use and share your personal information? {"pt_lg":40,"pt_sm":20} .bt-section-padding-40202020{ padding-top: 40px; padding-bottom: 20px; } @media(max-width:699px){ .bt-section-padding-40202020{ padding-top: 20px; padding-bottom: 20px; } } Does Betterment share? Can you limit this sharing? Reasons for sharing personal information For our everyday business purposes Such as to verify your identity, process your transactions, maintain your account(s), respond to court orders and legal investigations or regulatory requests, or report to credit bureaus Checkmark Close Icon For our marketing purposes To offer our products and services to you. Checkmark Checkmark For joint marketing with other financial companies To offer our products and services to you. Checkmark Close Icon For our affiliates’ everyday business purposes - Information about your transactions and experiences As described below, you are able to limit our sharing of your Betterment Visa Debit Card transaction data with Dosh, our cash back rewards partner, by emailing cashback@betterment.com. Checkmark Close Icon For our affiliates’ everyday business purposes - Information about your creditworthiness Betterment does not collect or share personal information for these purposes. Close Icon Close Icon For non-affiliates to market to you Betterment does not collect or share personal information for these purposes. Close Icon Close Icon {"pt_lg":40,"pt_sm":40} .bt-section-padding-40204020{ padding-top: 40px; padding-bottom: 20px; } @media(max-width:699px){ .bt-section-padding-40204020{ padding-top: 40px; padding-bottom: 20px; } } @media(min-width:700px){ .table-comparison .th-column-1{ width:60%; } .table-comparison .th-column-2{ width:20%; } .table-comparison .th-column-3{ width:20%; } } Questions? Contact our customer support team at support@betterment.com or call (646) 600-8263 {"pt_lg":0,"pt_sm":0} .bt-section-padding-040064{ padding-top: 0px; padding-bottom: 40px; } @media(max-width:699px){ .bt-section-padding-040064{ padding-top: 0px; padding-bottom: 64px; } } Who we are Who is providing this notice? Betterment LLC Betterment Securities Betterment for Business LLC Betterment Financial LLC {"pt_lg":40,"pt_sm":30} .bt-section-padding-40403030{ padding-top: 40px; padding-bottom: 40px; } @media(max-width:699px){ .bt-section-padding-40403030{ padding-top: 30px; padding-bottom: 30px; } } {"pt_lg":16,"pt_sm":16} .bt-section-padding-16161616{ padding-top: 16px; padding-bottom: 16px; } @media(max-width:699px){ .bt-section-padding-16161616{ padding-top: 16px; padding-bottom: 16px; } } What we do How does Betterment protect my personal information? To protect your personal information from unauthorized access and use, we use security measures that comply with federal law. These physical and electronic safeguards are described in further detail below and include but are not limited to encrypting data, restricting access to sensitive information solely to employees who need to use that information for a business purpose, and entering into contractual agreements that are intended to protect the confidentiality of any customer information shared with third-parties. How does Betterment collect my personal information? We collect your personal information, for example, when you: Open an account Input your financial information and goals in our platform Make a deposit, withdrawal, or transfer Use your Betterment Visa® Debit Card We also collect your personal information from other companies. For example, if you elect to link an external account, holdings, or liabilities (such as a bank account, a non-Betterment brokerage account, or a student loan) to your Betterment account, we also collect personal information from your linked account. Why can’t I limit all sharing? Federal law gives you the right to limit only: Sharing for affiliates’ everyday business purposes—information about your creditworthiness Affiliates from using your information to market to you Sharing for nonaffiliates to market to you You should be aware that Betterment does not collect or share information for these purposes. Betterment also allows you to limit the sharing of information for Betterment's own marketing purposes. State laws and individual companies may give you additional rights to limit sharing. See below for more information if you are a resident of California or Vermont. {"pt_lg":40,"pt_sm":30} .bt-section-padding-40403030{ padding-top: 40px; padding-bottom: 40px; } @media(max-width:699px){ .bt-section-padding-40403030{ padding-top: 30px; padding-bottom: 30px; } } {"pt_lg":16,"pt_sm":16} .bt-section-padding-16161616{ padding-top: 16px; padding-bottom: 16px; } @media(max-width:699px){ .bt-section-padding-16161616{ padding-top: 16px; padding-bottom: 16px; } } Definitions Affiliates - Companies related by common ownership or control They can be financial and nonfinancial companies. Our affiliates are: Betterment LLC, a registered investment advisor, is the primary entity with which you interact. Betterment LLC maintains Betterment’s website, provides financial advice and goal recommendations to customers, and markets and advertises to customers and prospective customers. Betterment Holdings, Inc. is Betterment’s parent company. Betterment Holdings does not interface with customers. MTG LLC ("Betterment Securities") is Betterment’s registered broker-dealer affiliate. Betterment Securities does not directly interface with customers and does not conduct any marketing activities. Betterment for Business LLC is Betterment’s unregistered affiliate that offers administrative services to employer-sponsored retirement plans on the Betterment at Work platform. You interface with Betterment for Business if you have a Betterment 401(k) account. Betterment Financial LLC is Betterment’s unregistered affiliate that makes available a Betterment Checking Account and Betterment Visa® Debit Card through a partnership with nbkc bank, Member FDIC. You interface with Betterment Financial if you have a Betterment Checking account. Non-affiliates - Companies not related by common ownership or control Companies not related by common ownership or control. They can be financial and nonfinancial companies. Non-affiliates we share your personal information with include service providers and vendors, banking partners, other financial institutions, data processors, identity verification services, and advertisers. Joint marketing A formal agreement between non-affiliated financial companies that together market financial products or services to you. Our joint marketing partners include our banking partner, nbkc bank, and other financial services companies. {"pt_lg":40,"pt_sm":30} .bt-section-padding-40403030{ padding-top: 40px; padding-bottom: 40px; } @media(max-width:699px){ .bt-section-padding-40403030{ padding-top: 30px; padding-bottom: 30px; } } {"pt_lg":16,"pt_sm":16} .bt-section-padding-16161616{ padding-top: 16px; padding-bottom: 16px; } @media(max-width:699px){ .bt-section-padding-16161616{ padding-top: 16px; padding-bottom: 16px; } } Other important information If you are an account holder of a joint account, you have individual rights with respect to our use of your personal information. If you would like more specifics about how we use, store and share your information, read on for the rest of our privacy policy. {"pt_lg":16,"pt_sm":16} .bt-section-padding-16601640{ padding-top: 16px; padding-bottom: 60px; } @media(max-width:699px){ .bt-section-padding-16601640{ padding-top: 16px; padding-bottom: 40px; } } Full Privacy Policy Information we collect and why In order to provide a high-quality service, Betterment collects various types of information when you visit the website or mobile app, sign-up as a customer, or otherwise engage with Betterment. Visitor information We collect various types of anonymous information about visitors to Betterment, such as device-related information (including browser type and IP address) and server log information (including the date and time of day of your visit, average time spent on the Betterment site, browsing activity, and any site that referred you to Betterment). We also collect information that you input into our website, such as your name, phone number, or email address when you begin the account application process or comment on the Betterment blog. We use this information to better understand our visitors and our business, facilitate site navigation, provide the services or information you request, and enhance the Betterment service. To the extent you enter identifying information as part of the account application process, we are required by law to store that information to comply with federal regulations. Customer information When you choose to create an account with Betterment, we will also collect certain personal information, including your full legal name, email address, permanent address, date of birth, social security number and information about financial status. We are required by law to collect and store this information to provide you with financial services. If you do not wish to provide this information, you cannot become a Betterment customer. Betterment conducts identity verification through Socure, which may also require the collection of facial images, such as headshots from your identification card and selfie photographs. Socure also collects information about the device accessing a Betterment account to analyze the risk of fraud. By creating an account with Betterment, you acknowledge and agree that the terms of Socure’s Privacy Policy will govern Socure’s use of such information. Additionally, by creating an account with Betterment, you authorize your wireless carrier to use or disclose information about your wireless account and your wireless device, if available, to Betterment. We and certain service providers use this information solely for security purposes and fraud prevention, including to identify you or your wireless device. Betterment offers account linking and aggregation services through Plaid Inc. ("Plaid"). By using account linking and aggregation services, you acknowledge and agree that the terms of Plaid's Privacy Policy will govern Plaid's use of such information, and you expressly agree to the terms and conditions of Plaid's Privacy Policy. Further, you expressly grant Plaid the right, power, and authority to access and transmit your information as reasonably necessary for Plaid to provide these services to you. Betterment will collect information about the transactions associated with, and the cash flows into and out of, accounts linked through Plaid. Betterment uses Stripe, Inc. (“Stripe”) to process customer payment'''
