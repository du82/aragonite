title = "About Betterment | Making people's lives better"
description = "Since 2010, Betterment's mission has been making people's lives better. We're here to help people turn everyday investments, no matter how small, into their dreams, no matter how big."
full_description = '''Making people's lives better We're here to help people turn everyday investments, no matter how small, into their dreams, no matter how big. {"pt_lg":152,"pt_sm":104} .bt-section-padding-15212010496{ padding-top: 152px; padding-bottom: 120px; } @media(max-width:699px){ .bt-section-padding-15212010496{ padding-top: 104px; padding-bottom: 96px; } } Arch illustration - desktop Arch illustration - mobile “Better” is different for everyone. It can feel big, like retiring early. It can feel urgent, like investing in a climate-conscious portfolio. Or it can just feel helpful, like using recurring deposits so you never forget to save. @media(min-width:963px){ } {"pt_lg":96,"pt_sm":0} .bt-section-padding-9632032{ padding-top: 96px; padding-bottom: 32px; } @media(max-width:699px){ .bt-section-padding-9632032{ padding-top: 0px; padding-bottom: 32px; } } You deserve financial peace of mind. That's where we come in. We're here to simplify overly-complex ideas. To help you set goals and give purpose to your money. To build peace of mind into your financial future. @media(min-width:963px){ } {"pt_lg":32,"pt_sm":32} .bt-section-padding-32323232{ padding-top: 32px; padding-bottom: 32px; } @media(max-width:699px){ .bt-section-padding-32323232{ padding-top: 32px; padding-bottom: 32px; } } We offer the best of both worlds. We do that by combining easy-to-use, automated investing technology with great advice so you can make "better" what you want it to be. @media(min-width:963px){ } {"pt_lg":32,"pt_sm":32} .bt-section-padding-32643232{ padding-top: 32px; padding-bottom: 64px; } @media(max-width:699px){ .bt-section-padding-32643232{ padding-top: 32px; padding-bottom: 32px; } } No one ever tiptoed to real change. We’re constantly looking for new ways to disrupt financial services and create a better world for our customers. Sarah Levy, CEO {"pt_lg":96,"pt_sm":64} .bt-section-padding-961286496{ padding-top: 96px; padding-bottom: 128px; } @media(max-width:699px){ .bt-section-padding-961286496{ padding-top: 64px; padding-bottom: 96px; } } The Betterment Leadership Team {"pt_lg":96,"pt_sm":64} .bt-section-padding-960640{ padding-top: 96px; padding-bottom: 0px; } @media(max-width:699px){ .bt-section-padding-960640{ padding-top: 64px; padding-bottom: 0px; } } Sarah Levy Chief Executive Officer {"pt_lg":96,"pt_sm":96} .bt-section-padding-960960{ padding-top: 96px; padding-bottom: 0px; } @media(max-width:699px){ .bt-section-padding-960960{ padding-top: 96px; padding-bottom: 0px; } } Peter Lorimer Chief Financial Officer Mike Reust President Seth Rosenbloom General Counsel John Mileham Chief Technology Officer Johanna Richardson Chief Product Officer Kim Rosenblum Chief Marketing Officer Kumud Sharma Chief People Officer A.J. Kramer SVP of Operations Sandy Lavipour Chief of Staff & Head of Strategy Raoul Bhavnani Chief Communications Officer Thomas Moore Sr. Director, Head of Advisor Solutions Liane Pierce VP, Customer Experience {"pt_lg":0,"pt_sm":0} .bt-section-padding-0000{ padding-top: 0px; padding-bottom: 0px; } @media(max-width:699px){ .bt-section-padding-0000{ padding-top: 0px; padding-bottom: 0px; } } $50+ Billion Assets under management {"pt_lg":32,"pt_sm":32} .bt-section-padding-32323232{ padding-top: 32px; padding-bottom: 32px; } @media(max-width:699px){ .bt-section-padding-32323232{ padding-top: 32px; padding-bottom: 32px; } } 900,000+ Customers trusting us {"pt_lg":32,"pt_sm":32} .bt-section-padding-32963264{ padding-top: 32px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-32963264{ padding-top: 32px; padding-bottom: 64px; } } 2010 The year our mission to change everything began {"pt_lg":32,"pt_sm":32} .bt-section-padding-32323232{ padding-top: 32px; padding-bottom: 32px; } @media(max-width:699px){ .bt-section-padding-32323232{ padding-top: 32px; padding-bottom: 32px; } } Triangle illustration Start your journey with us. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '4effd7d2-e029-4b8e-a60a-54c