["https://betterment.com/tax-efficient-investing"]
title = "Tax Smart Investing with Betterment"
description = """
We offer customized tax-efficient investing strategies focused on 
securities, asset location, and smart rebalancing to help achieve optimal 
returns."""
full_description = '''Our goal is to save you more on taxes We're always thinking about ways to lower your taxes. Unlike many investment managers, we automate advanced tax-efficient strategies, like tax coordination and Tax Loss Harvesting+ so you can save more throughout the year. {"pt_lg":152,"pt_sm":104} .bt-section-padding-1526410496{ padding-top: 152px; padding-bottom: 64px; } @media(max-width:699px){ .bt-section-padding-1526410496{ padding-top: 104px; padding-bottom: 96px; } } Arch illustration - desktop Arch illustration - mobile Your after-tax return is what matters. Other investment managers may estimate your long-term returns, but they might not be factoring in a key element that could lower what you take home: taxes. @media(min-width:963px){ } {"pt_lg":32,"pt_sm":64} .bt-section-padding-32966464{ padding-top: 32px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-32966464{ padding-top: 64px; padding-bottom: 64px; } } Every account at Betterment can utilize tax-smart features. When you choose what type of account to invest in Caret Down Icon We focus on taxes. Learn which combination of traditional, Roth, and taxable accounts—which are all taxed differently—may be right for you. When we build your portfolio Caret Down Icon We use ETFs. Exchange-traded funds are generally more tax-efficient and lower-cost than mutual funds, which is why we have an all-ETF portfolio.We organize assets based on taxes. Municipal bonds (which provide tax-exempt income) go into your taxable accounts, and core bonds (which do not) go into your tax-advantaged IRAs.High-tax assets belong in IRAs and low-tax assets belong in taxable accounts. For customers who use our Tax-Coordinated Portfolio™ feature, we automate this strategy, which could help increase your portfolio value. When you make a deposit or receive dividends Caret Down Icon We rebalance. Rebalancing can help protect your portfolio from market volatility, but doing it by selling securities can cost you in taxes. To help avoid this, we rebalance using deposits and dividends. When you make a withdrawal or change your allocation Caret Down Icon We show you the possible tax consequences. We'll help you to see the potential tax implications before you make a transaction.We work to minimize transaction taxes. To help lower transaction taxes, we sell your assets in a specific order—the ones with the lowest tax burden go first. When a fund gains value Caret Down Icon We help you maximize the benefits of charitable giving. To help you make the most of your charitable gifts, we enable you to donate your most appreciated shares directly through our platform. This helps reduce your portfolio's tax liability. When a fund loses value Caret Down Icon We tax loss harvest. When investments lose value, you can sell them to help offset the taxes that come with income and capital gains. For customers who use our Tax-Loss Harvesting+ feature, we look for these opportunities regularly, which seeks to help increase your after-tax returns. {"pt_lg":96,"pt_sm":64} .bt-section-padding-96966464{ padding-top: 96px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-96966464{ padding-top: 64px; padding-bottom: 64px; } } Triangle illustration Start investing today. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '4effd7d2-e029-4b8e-a60a-54cebca19abe', {"useNewLoader":"true","region":"na1"}); {"pt_lg":138,"pt_sm":138} .bt-section-padding-138300138300{ padding-top: 138px; padding-bottom: 300px; } @media(max-width:699px){ .bt-section-padding-138300138300{ padding-top: 138px; padding-bottom: 300px; } }'''
