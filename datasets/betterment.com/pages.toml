title = "What is your Mission Statement?"
description = "We are here to empower people to do what's best for their money so they can live better. We’re building smarter, more efficient money management for everyo"
full_description = "We are here to empower people to do what's best for their money so they can live better. We’re building smarter, more efficient money management for everyone. By pushing the bounds of what technology can do, by bringing together some of the best software and analytic thinking of diverse, cutting edge industries, we’re able to ensure that more people get the advice that they deserve. We have the ability to help free our customers to pursue what is most meaningful to them, to spend their time doing what makes them happy. Our promise is to manage your money in a way that works to give you a better outcome. We advise you on what to do with your money based on your personal financial situation and the goals you’re looking to achieve—we recommend how much to invest each month, how much risk to take on in your portfolio, and what type of accounts you should have. Then, we do it all for you. And by doing that, we have the rare opportunity to help you find something positive and intangible that can’t be bought: peace of mind. Betterment on Facebook Betterment on X Betterment Email Share Betterment Clipboard Share Copied!"
