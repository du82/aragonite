full_description = '''Invest for a better world We believe that investing can make a more positive impact for people and for the world. If you do too, our Socially Responsible Investing options might be just the thing you’re looking for. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, 'dadc6dd3-11b8-44c9-8356-b32424b96161', {"useNewLoader":"true","region":"na1"}); {"pt_lg":152,"pt_sm":104} .bt-section-padding-15212010496{ padding-top: 152px; padding-bottom: 120px; } @media(max-width:699px){ .bt-section-padding-15212010496{ padding-top: 104px; padding-bottom: 96px; } } Arch illustration - desktop Arch illustration - mobile Choose how your money will make an impact. Our Socially Responsible Investing Portfolios are built by our experts to make it easy to support companies that share your values—from funding green projects to promoting gender diversity—while investing in cost-effective ETFs. {"pt_lg":32,"pt_sm":64} .bt-section-padding-322006496{ padding-top: 32px; padding-bottom: 200px; } @media(max-width:699px){ .bt-section-padding-322006496{ padding-top: 64px; padding-bottom: 96px; } } Climate Impact Because there’s no planet B. Support companies with lower carbon emissions and the funding of green projects, and divest from holders of fossil-fuel reserves. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '869244f8-5dff-49e2-b765-146e1ab63995', {"useNewLoader":"true","region":"na1"}); Social Impact Because society isn't equal. Support companies that are actively promoting social empowerment. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '4e192113-e81f-4a78-a7d9-6d3f835ffb0c', {"useNewLoader":"true","region":"na1"}); Broad Impact Because the world needs change. Invest in ETFs that consider all ESG elements, such as lower carbon emissions, ethical labor management, and greater board diversity. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '6e418afb-bd11-4377-83a6-7ead02f0d7e1', {"useNewLoader":"true","region":"na1"}); /* min $desktop - setup item vertical offset */ @media(min-width: 964px){ .features-set-image .item-vertical-offset-4c4659c67575dcb1c59b8c890ec4f6d8-200{ bottom:200px; } .features-set-image .item-vertical-offset-09777d0f8670bcca932105aee9ab9247-200{ bottom:200px; } .features-set-image .item-vertical-offset-289c4c88e33e936fa5e0a51a547d0c4c-200{ bottom:200px; } .features-set-image .offset-margin-802311a51b04fffcab17385eb06620f4{ margin-bottom:-200px; } } /* $desktop - section vertical offset */ /* $desktop - horizontal scroll */ .features-set-image .item-headline.top-headeline-white{ color:white !important; } /* $desktop - Text color */ @media(max-width:963px){ .features-set-image .top-headeline-white.top-headeline-dark_mobile{ color:#212121 !important; } } {"pt_lg":64,"pt_sm":64} .bt-section-padding-64726432{ padding-top: 64px; padding-bottom: 72px; } @media(max-width:699px){ .bt-section-padding-64726432{ padding-top: 64px; padding-bottom: 32px; } } When you choose a portfolio, you'll receive or select an allocation of stocks and bonds. The higher percentage of bonds you choose, the lower the percentage of your portfolio will be allocated to socially responsible ETFs. For full disclosures, please reference the Socially Responsible Investing Portfolios Disclosure. {"pt_lg":0,"pt_sm":0} .bt-section-padding-064064{ padding-top: 0px; padding-bottom: 64px; } @media(max-width:699px){ .bt-section-padding-064064{ padding-top: 0px; padding-bottom: 64px; } } A future you can feel good about. Our financial guidance is provided to help you achieve your savings goals. And, when you invest with us, you invest in portfolios designed to be low-cost, deliver meaningful returns, and align with your values. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '6c001fdc-6c5e-4ebc-bf13-ff245918b04c', {"useNewLoader":"true","region":"na1"}); @media(min-width:963px){ } {"pt_lg":96,"pt_sm":64} .bt-section-padding-96966464{ padding-top: 96px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-96966464{ padding-top: 64px; padding-bottom: 64px; } } An ETF committed to change. At the heart of our Socially Responsible Investing portfolios is the $VOTE ETF from Engine No. 1. This low-cost fund gives investors more power to advocate for their values through Engine No. 1’s activist proxy voting. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '6135da1f-d92d-4180-8ae4-61eaea28980a', {"useNewLoader":"true","region":"na1"}); @media(min-width:963px){ } {"pt_lg":96,"pt_sm":64} .bt-section-padding-96966464{ padding-top: 96px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-96966464{ padding-top: 64px; padding-bottom: 64px; } } Still have questions? How does Betterment work? Caret Down Icon Betterment helps you manage your money through cash management, guided investing, and retirement planning. We are a fiduciary, which means we act in your best interest. We'll ask a bit about you when you sign up. We'll also gather information when you connect your outside accounts. Then, we'll help you set financial goals and set you up with investment portfolios for each goal. For your long-term financial needs (like retirement, next year's vacation, or a down payment), our investment strategy is built on low-cost ETFs (exchange-traded funds) and a risk profile based on how long you plan to invest. For your daily saving and spending, you can use our cash management products that include Checking (which is offered by nbkc bank, Member FDIC) and Cash Reserve, a high-yield cash account. What are your fees? How does pricing work? Caret Down Icon Cash Reserve: No fees on your balance. Betterment LLC only receives compensation from our program banks, and we do not charge fees on your account balance. Checking: No monthly account fees, maintenance fees, or withdrawal fees, and all ATM fees worldwide will be reimbursed, including the Visa 1% transaction fee on foreign transactions, purchases, and ATM transactions. Investing: 0.25% per year on your invested balance, which covers all trading costs. Also, there are no additional transaction fees. Every fund your portfolio invests in charges fund fees that, in total, range from 0.03% to 0.50%. Retirement: You can access our retirement planning tools without funding an account simply by syncing your existing accounts. Once you transfer retirement assets (like an IRA) to Betterment, Betterment will charge you a 0.25% management fee. Premium Advice: 0.65% per year on your invested balance for unlimited over-the-phone access to our team of CFP® professionals. We have no minimum balance requirements across the majority of our accounts (just $10 to get started) —however, if you opt into our Premium plan, there is a $100,000 minimum. Who are the experts behind the scenes? Caret Down Icon Our team of investing experts make decisions about our portfolio strategies and fund selection with the help of an external committee of economists, PhDs, and industry experts. More than just a portfolio management team, our experts work to develop improvements to our Tax Smart technology, our investment analysis tools, and other advanced strategies. {"pt_lg":96,"pt_sm":64} .bt-section-padding-96966464{ padding-top: 96px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-96966464{ padding-top: 64px; padding-bottom: 64px; } } Triangle illustration Start investing for better. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, 'dadc6dd3-11b8-44c9-8356-b32424b96161', {"useNewLoader":"true","region":"na1"}); {"pt_lg":138,"pt_sm":138} .bt-section-padding-138300138300{ padding-top: 138px; padding-bottom: 300px; } @media(max-width:699px){ .bt-section-padding-138300138300{ padding-top: 138px; padding-bottom: 300px; } }'''
