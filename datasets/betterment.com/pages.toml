description = "Betterment can help you make a plan for retirement, even if you’re not sure how you want to spend yours. From how much money to save to which accounts to use, our savings tools help you envision what your retirement could look like."
full_description = '''How you can win at retirement With +$17 Billion in retirement savings, we're helping thousands of people realize their retirement dreams. Our automated technology and expert guidance can make it easy to build wealth so you're ready when that day comes. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '4effd7d2-e029-4b8e-a60a-54cebca19abe', {"useNewLoader":"true","region":"na1"}); {"pt_lg":152,"pt_sm":104} .bt-section-padding-15212010496{ padding-top: 152px; padding-bottom: 120px; } @media(max-width:699px){ .bt-section-padding-15212010496{ padding-top: 104px; padding-bottom: 96px; } } Arch illustration - desktop Arch illustration - mobile Everyone has retirement questions. We’re here to help. {"pt_lg":96,"pt_sm":64} .bt-section-padding-96966464{ padding-top: 96px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-96966464{ padding-top: 64px; padding-bottom: 64px; } } We automatically handle your retirement investing. Take control of saving for tomorrow by putting it on autopilot. We make investing easy by automating it, handling the trading, rebalancing, and dividend reinvesting so you don’t have to. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, 'b582db12-9ba6-4a5c-ac2b-608e835cf9b3', {"useNewLoader":"true","region":"na1"}); @media(min-width:963px){ } {"pt_lg":32,"pt_sm":32} .bt-section-padding-32963264{ padding-top: 32px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-32963264{ padding-top: 32px; padding-bottom: 64px; } } We help you decide how much and where to save. Everyone’s idea of retirement is different. Get personal advice on how much you’ll need and which accounts—like our tax-advantaged IRAs—to put your money in. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '90999e4f-168b-4833-a01f-212df13cbda5', {"useNewLoader":"true","region":"na1"}); @media(min-width:963px){ } {"pt_lg":32,"pt_sm":32} .bt-section-padding-32963264{ padding-top: 32px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-32963264{ padding-top: 32px; padding-bottom: 64px; } } We give you a bird’s-eye-view of your retirement. Connect your outside accounts to see all your retirement in one place. Get a detailed breakdown on just how your investments have performed, and see how our technology is working to help you build wealth. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, 'f567f98e-6ef9-4d08-972d-faf27eb7b954', {"useNewLoader":"true","region":"na1"}); @media(min-width:963px){ } {"pt_lg":32,"pt_sm":32} .bt-section-padding-32963264{ padding-top: 32px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-32963264{ padding-top: 32px; padding-bottom: 64px; } } We can keep you on track. Things change and life inevitably happens. We adjust your investments and offer recommendations to help you stay—or get back—on track. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '767c2747-52db-477d-b86b-34847967afb4', {"useNewLoader":"true","region":"na1"}); @media(min-width:963px){ } {"pt_lg":32,"pt_sm":32} .bt-section-padding-32963264{ padding-top: 32px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-32963264{ padding-top: 32px; padding-bottom: 64px; } } cloud illustration There’s more to Betterment than just retirement. As the largest independent digital advisor, we’re here to help you achieve what you want with your money. {"pt_lg":96,"pt_sm":64} .bt-section-padding-96966464{ padding-top: 96px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-96966464{ padding-top: 64px; padding-bottom: 64px; } } Get expert advice from our CFP® team hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '01c18463-22ad-42c8-826e-97e0edc4eed6', {"useNewLoader":"true","region":"na1"}); Save with a high-yield cash account hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '85906cf8-1948-469a-b9ae-aafc43ffdca7', {"useNewLoader":"true","region":"na1"}); Invest in other goals along the way hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '512b2b1d-bbf9-4faf-8193-64b63ed7e58b', {"useNewLoader":"true","region":"na1"}); Tap into the crypto market hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '047a8d62-8f95-4635-9c9a-a26eef589e5c', {"useNewLoader":"true","region":"na1"}); /* min $desktop - setup item vertical offset */ @media(min-width: 964px){ .features-set-image .item-vertical-offset-bdb97261889fb3c93889ac013646ddb1-{ bottom:px; } .features-set-image .item-vertical-offset-780c7700daaf30d41df8e520d3b0d580-{ bottom:px; } .features-set-image .item-vertical-offset-a82f98b075a2080f245c98407539a271-{ bottom:px; } .features-set-image .item-vertical-offset-9e0ce32aafd099b7486e74ef706833ee-{ bottom:px; } .features-set-image .offset-margin-9e0ce32aafd099b7486e74ef706833ee{ margin-bottom:-px; } } /* $desktop - section vertical offset */ @media(max-width: 963px){ .features-set-image .top-vertical-offset_mobile-{ margin-top: -px !important; } } @media(min-width: 700px) and (max-width: 963px){ } @media(max-width: 699px){ } /* $desktop - horizontal scroll */ /* $desktop - Text color */ @media(max-width:963px){ .features-set-image .top-headeline-dark.top-headeline-dark_mobile{ color:#212121 !important; } } {"pt_lg":0,"pt_sm":36} .bt-section-padding-0243624{ padding-top: 0px; padding-bottom: 24px; } @media(max-width:699px){ .bt-section-padding-0243624{ padding-top: 36px; padding-bottom: 24px; } } We’re here to help you retire how you want. We’re here to help you make smart retirement decisions: determining how much you’ll need, deciding which IRA, understanding how taxes and inflation impact your money. The most important part of retirement is getting started. From there, we're with you all the way. {"pt_lg":96,"pt_sm":64} .bt-section-padding-96966464{ padding-top: 96px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-96966464{ padding-top: 64px; padding-bottom: 64px; } } {"pt_lg":0,"pt_sm":0} .bt-section-padding-096064{ padding-top: 0px; padding-bottom: 96px; } @media(max-w