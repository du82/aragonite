full_description = '''Help your clients save more with 4.00% APY* APY is variable. Support your clients during volatile times with a high-yield cash account. Cash Reserve lets you offer a competitive cash management solution on the same Betterment platform. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '2f8d3f8e-1b08-4201-bcf2-bb94781600ad', {"useNewLoader":"true","region":"na1"}); Loading ...loading image {"pt_lg":152,"pt_sm":104} .bt-section-padding-15201040{ padding-top: 152px; padding-bottom: 0px; } @media(max-width:699px){ .bt-section-padding-15201040{ padding-top: 104px; padding-bottom: 0px; } } Cash Reserve is only available to clients of Betterment LLC, which is not a bank, and cash transfers to program banks are conducted through the clients’ brokerage accounts at Betterment Securities. For Cash Reserve (“CR”), Betterment LLC only receives compensation from our program banks; Betterment LLC and Betterment Securities do not charge fees on your CR balance. {"pt_lg":36,"pt_sm":12} .bt-section-padding-36641232{ padding-top: 36px; padding-bottom: 64px; } @media(max-width:699px){ .bt-section-padding-36641232{ padding-top: 12px; padding-bottom: 32px; } } What makes Betterment’s Cash Reserve better? {"pt_lg":96,"pt_sm":64} .bt-section-padding-960640{ padding-top: 96px; padding-bottom: 0px; } @media(max-width:699px){ .bt-section-padding-960640{ padding-top: 64px; padding-bottom: 0px; } } $0 fees. Forget any monthly or maintenance costs—what they earn is what they keep. $2 million insured.† Rest easy with FDIC insurance up to $2 million ($4 million for joint accounts) with our program banks. That's 8X the standard. Unlimited withdrawals. Compare this to other banks that limit how often clients can access their money. No minimum balance. Other institutions offer higher interest rates based on a larger balance—clients can grow their money with as little as $10. /* min $desktop - setup item vertical offset */ @media(min-width: 964px){ .features-set-image .item-ve