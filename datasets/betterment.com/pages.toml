title = "Roll over a 401k or IRA | Rollovers"
description = "Don’t let high 401(k) fees drain your savings. Rolling over an average 401(k) to a Betterment IRA could mean lower fees. Learn more Betterment rollovers."
full_description = '''A rollover gives your money a better home Moving your retirement accounts into a Betterment IRA can save you on high fees and hassle. {"pt_lg":152,"pt_sm":104} .bt-section-padding-1524810436{ padding-top: 152px; padding-bottom: 48px; } @media(max-width:699px){ .bt-section-padding-1524810436{ padding-top: 104px; padding-bottom: 36px; } } {"pt_lg":210,"pt_sm":86} .bt-section-padding-2101058664{ padding-top: 210px; padding-bottom: 105px; } @media(max-width:699px){ .bt-section-padding-2101058664{ padding-top: 86px; padding-bottom: 64px; } } We make it easy to make the most of your retirement. An estimated 1 in 5 U.S. workers have left behind or forgotten retirement accounts.1 See how rolling them over into an active Betterment IRA can benefit you: {"pt_lg":96,"pt_sm":64} .bt-section-padding-96966464{ padding-top: 96px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-96966464{ padding-top: 64px; padding-bottom: 64px; } } Automated investing. We make investing easy by putting it on autopilot, handling all the trading, rebalancing, and dividend reinvesting, so you don’t have to. Painless transfers. For many providers, rolling over funds to Betterment is completely automated. For others, we have a team to help minimize the effort and paperwork involved. Retirement tools at your fingertips. We build you a personalized plan, calculate how much to save, and adjust as life changes. /* min $desktop - setup item vertical offset */ @media(min-width: 964px){ .features-set-image .item-vertical-offset-35ed55f207c5e61ec972e00fdf48cce0-{ bottom:px; } .features-set-image .item-vertical-offset-1db71589f325e22d68d771fdfc954aec-{ bottom:px; } .features-set-image .item-vertical-offset-ac3d355ec412ca617e626b1a027716f8-{ bottom:px; } .features-set-image .offset-margin-e94619993b43463598a18f892707bfc8{ margin-bottom:-px; } } /* $desktop - section vertical offset */ @media(max-width: 963px){ .features-set-image .top-vertical-offset_mobile-{ margin-top: -px !important; } } @media(min-width: 700px) and (max-width: 963px){ } @media(max-width: 699px){ } /* $desktop - horizontal scroll */ /* $desktop - Text color */ @media(max-width:963px){ .features-set-image .top-headeline-dark.top-headeline-dark_mobile{ color:#212121 !important; } } {"pt_lg":0,"pt_sm":0} .bt-section-padding-0000{ padding-top: 0px; padding-bottom: 0px; } @media(max-width:699px){ .bt-section-padding-0000{ padding-top: 0px; padding-bottom: 0px; } } hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, 'bd481050-8dc0-4ced-9399-48a7d7fd5f15', {"useNewLoader":"true","region":"na1"}); {"pt_lg":0,"pt_sm":0} .bt-section-padding-032032{ padding-top: 0px; padding-bottom: 32px; } @media(max-width:699px){ .bt-section-padding-032032{ padding-top: 0px; padding-bottom: 32px; } } Lower fees today can mean more money tomorrow. A 401(k) with even a modest fee may cost you tens of thousands of dollars over time. @media(min-width:963px){ } {"pt_lg":32,"pt_sm":32} .bt-section-padding-32483224{ padding-top: 32px; padding-bottom: 48px; } @media(max-width:699px){ .bt-section-padding-32483224{ padding-top: 32px; padding-bottom: 24px; } } Assumed 0.25% management fee with hypothetical 6% annual return. Image to illustrate the potential impact of fees on performance and does not reflect the performance of Betterment. {"pt_lg":0,"pt_sm":0} .bt-section-padding-0000{ padding-top: 0px; padding-bottom: 0px; } @media(max-width:699px){ .bt-section-padding-0000{ padding-top: 0px; padding-bottom: 0px; } } Pick from three types of tax-advantaged IRAs. Our IRAs make saving for retirement easy. They're all automated and give you access to tax-smart tools designed to help you maximize returns. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '222790fd-ac23-47dd-be49-a33a51d5b25b', {"useNewLoader":"true","region":"na1"}); @media(min-width:963px){ } {"pt_lg":96,"pt_sm":64} .bt-section-padding-96966464{ padding-top: 96px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-96966464{ padding-top: 64px; padding-bottom: 64px; } } Roll over your money with an advisor for free. If you’re looking to move at least $20k, you can talk with an advisor for free about if transferring your money to a Betterment IRA is right for you. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '0248036b-2042-4bb2-991e-8f80a9bca8a1', {"useNewLoader":"true","region":"na1"}); @media(min-width:963px){ } {"pt_lg":96,"pt_sm":64} .bt-section-padding-960640{ padding-top: 96px; padding-bottom: 0px; } @media(max-width:699px){ .bt-section-padding-960640{ padding-top: 64px; padding-bottom: 0px; } } Betterment’s Licensed Concierge Team offers support for individuals transferring assets to Betterment of $20,000 or more, and receives incentive compensation based on assets brought to or invested with Betterment. Betterment’s revenue varies for different offerings (e.g., Betterment Digital and Premium, Cash Reserve) and consequently Team members have an incentive to recommend the offering which results in the greatest revenue for Betterment. The marketing and solicitation activities of these individuals are supervised by Betterment to ensure that these individuals act in the client’s best interest. {"pt_lg":48,"pt_sm":48} .bt-section-padding-480480{ padding-top: 48px; padding-bottom: 0px; } @media(max-width:699px){ .bt-section-padding-480480{ padding-top: 48px; padding-bottom: 0px; } } cloud illustration Still have questions? How can I roll over my account to Betterment? Caret Down Icon After opening your account, you’ll answer a couple of questions, and we’ll determine if you can automatically roll over your account. If not, you’ll receive an email with the full, personalized instructions (how the check should be issued and where it should be sent) to complete your rollover.Please note that Traditional funds must be rolled over into a Traditional IRA and Roth funds must be rolled over into a Roth IRA. If you aren't sure which type(s) of funds you have, contact your current provider. You can always convert a Traditional IRA into a Roth IRA after the rollover. What accounts can I roll over? Caret Down Icon You can roll over a 401(k), 403(b), or IRA to Betterment. How long does a rollover take? Caret Down Icon Generally, it takes 7-10 business days after the funds have left your old provider for the funds to appear into your Betterment account. This includes mail time, processing, and time for the funds to settle. You will be notified via email as soon as the funds appear in your Betterment account. What does it cost? Caret Down Icon Betterment does not charge a fee when you rollover an account to us. Our management fee is $4 a month or 0.25% annually. This gives you all the benefits of our automated technology: hands-off investing, expert-built portfolios, and guidance to help you grow your retirement.Learn more about pricing {"pt_lg":96,"pt_sm":64} .bt-section-padding-96966464{ padding-top: 96px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-96966464{ padding-top: 64px; padding-bottom: 64px; } } Triangle illustration Give your retirement a better home. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, '447364d8-1287-4164-83b2-9a0b5227ccc3', {"useNewLoader":"true","region":"na1"}); {"pt_lg":138,"pt_sm":138} .bt-section-padding-138300138300{ padding-top: 138px; padding-bottom: 300px; } @media(max-width:699px){ .bt-section-padding-138300138300{ padding-top: 138px; padding-bottom: 300px; } }'''
