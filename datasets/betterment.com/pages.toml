 I'm in school Caret Right Icon I'm working or job hunting Caret Right Icon I'm retired Caret Right Icon {"pt_lg":96,"pt_sm":48} .bt-section-padding-96644864{ padding-top: 96px; padding-bottom: 64px; } @media(max-width:699px){ .bt-section-padding-96644864{ padding-top: 48px; padding-bottom: 64px; } } Still have questions? How does Betterment work? Caret Down Icon Betterment helps you manage your money through cash management, guided investing, and retirement planning. We are a fiduciary, which means we act in your best interest. We'll ask a bit about you when you sign up. We'll also gather information when you connect your outside accounts. Then, we'll help you set financial goals and set you up with investment portfolios for each goal. For your long-term financial needs (like retirement, next year's vacation, or a down payment), our investment strategy utilizes low-cost ETFs (exchange-traded funds) and an adjustable risk profile based on your goal type and how long you plan to invest. For your daily saving and spending, you can use our cash management products that include Checking (which is offered by nbkc bank, Member FDIC) and Cash Reserve, a high-yield cash account. Will I have access to real humans? Caret Down Icon Customer support team members are available five days per week to answer questions about your account. If you want in-depth financial advice, you can talk to a licensed advisor by phone for an additional cost. Our Premium plan provides you with unlimited access and costs an additional 0.40% on your invested balances (with a minimum investing account balance requirement of $100,000). Is my money safe at Betterment? Caret Down Icon Betterment Securities is a Member of SIPC, which protects securities of its members up to $500K (including $250K for claims for cash). Explanatory brochure available upon request or at www.sipc.org. What you should remember is that the SIPC does not protect against market changes in your investing account. Individual Cash Reserve accounts have FDIC insurance up to $2 million and joint Cash Reserve accounts offer up to $4 million in FDIC insurance once funds are deposited into our program banks†. Funds deposited into Checking are FDIC-insured up to $250,000 for individual accounts and up to $250,000 per depositor for joint accounts, provided by nbkc bank, Member FDIC. Explore further details about FDIC insurance. Who are the experts behind the scenes? Caret Down Icon Our team of investing experts make decisions about our portfolio strategies and fund selection with the help of an external committee of economists, PhDs, and industry experts. More than just a portfolio management team, our experts work to develop improvements to our Tax Smart technology, our cash analysis tools, and other advanced strategies. {"pt_lg":64,"pt_sm":36} .bt-section-padding-64963664{ padding-top: 64px; padding-bottom: 96px; } @media(max-width:699px){ .bt-section-padding-64963664{ padding-top: 36px; padding-bottom: 64px; } } Triangle illustration Make your money hustle. hbspt.cta._relativeUrls=true;hbspt.cta.load(5274572, 'e6dec5df-d43d-4f84-a54b-56d5f6a90445', {"useNewLoader":"true","region":"na1"}); {"pt_lg":16,"pt_sm":64} .bt-section-padding-1616640{ padding-top: 16px; padding-bottom: 16px; } @media(max-width:699px){ .bt-section-padding-1616640{ padding-top: 64px; padding-bottom: 0px; } } {"pt_lg":300,"pt_sm":64} .bt-section-padding-30030064300{ padding-top: 300px; padding-bottom: 300px; } @media(max-width:699px){ .bt-section-padding-30030064300{ padding-top: 64px; padding-bottom: 300px; } }'''
