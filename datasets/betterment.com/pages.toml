["https://betterment.com/help/tag/connecting-accounts"]
title = "Betterment Help Center | connecting accounts"
description = "connecting accounts | Customer help center and frequently asked questions for Betterment clients and 401(k) participants"
full_description = "Help Center Connecting accounts Connect external accounts to see your money in one financial dashboard Table of content Close Icon Getting started Getting started How do I connect an external account so that I can view my other savings and retirement accounts alongside my Betterment accounts? Caret Down Icon To instantly connect an external account: Web browser: Log in to your Betterment account. Select “Settings” from the lefthand menu. Click on the “Connected accounts” tab then “Connect new”. Choose the institution where your account is located and instantly connect by providing your login credentials. Mobile app: Log into the Betterment app. Tap the three lines in the upper left-hand corner to open the menu. Select “Settings”, then “Connected Accounts”. Tap the “+” to connect a new external ... Read More Can I delete or hide a connected external account from my Betterment profile? Caret Down Icon You can remove connected accounts from Betterment, or you can hide a specific account to prevent it from showing up on your Betterment overview or being included in your total net worth. To delete a Connected account: Web browser: Log in to your Betterment account. Select “Settings” from the left-hand menu. Click on the “Connected accounts” tab. Click “Delete” next to the account(s) you wish to remove. Mobile app: Log into the Betterment app. Tap the three lines in the upper left-hand corner to ... Read More Why should I connect an external account? Caret Down Icon Connecting your non-Betterment accounts gives you a more complete financial picture in one location and can allow Betterment to give more informed advice. Instantly connecting a financial account creates a secure, read-only connection with your firm through our data partner, Plaid. Most accounts are eligible for instant, electronic connection through Plaid, although not all are available at this time. As an alternative, you can always manually connect any account. When you connect an account to ... Read More When I connect a non-Betterment account, does Betterment store my username and password? Caret Down Icon No. Betterment does not store your credentials. Our trusted partner for account aggregation protects the credentials using bank-level encryption both when transmitted and when stored. Read More Betterment on Facebook Betterment on X Betterment Email Share Betterment Clipboard Share Copied!"
