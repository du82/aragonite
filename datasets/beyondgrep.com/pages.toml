["https://beyondgrep.com/documentation/ack-v3.8.1-man.html"]
title = "Man Page"
full_description = '''NAME SYNOPSIS DESCRIPTION FILE SELECTION DIRECTORY SELECTION MATCHING IN A RANGE OF LINES OPTIONS THE .ackrc FILE Defining your own types ACK COLORS ENVIRONMENT VARIABLES ACK & OTHER TOOLS Simple vim integration Editor integration Shell and Return Code DEBUGGING ACK PROBLEMS Try it with -noenv Use -f to see what files have been selected for searching Use -dump ACKRC LOCATION SEMANTICS BUGS & ENHANCEMENTS SUPPORT COMMUNITY FAQ Can I stop using grep now? Why isn't ack finding a match in (some file)? Wouldn't it be great if ack did search & replace? Can I make ack recognize .xyz files? Will you make ack recognize .xyz files by default? Why is it called ack if it's called ack-grep? What does ack mean? Can I do multi-line regexes? Why is ack telling me I have an invalid option when searching for +foo? Why does "ack '.{40000,}'" fail? Isn't that a valid regex? Ack does "X" and shouldn't, should it? ACKNOWLEDGEMENTS AUTHOR COPYRIGHT & LICENSE NAME ack - grep-like text finder SYNOPSIS ack [options] PATTERN [FILE...] ack -f [options] [DIRECTORY...] DESCRIPTION ack is designed as an alternative to grep for programmers. ack searches the named input FILEs or DIRECTORYs for lines containing a match to the given PATTERN. By default, ack prints the matching lines. If no FILE or DIRECTORY is given, the current directory will be searched. PATTERN is a Perl regular expression. Perl regular expressions are commonly found in other programming languages, but for the particulars of their behavior, please consult perlreref. If you don't know how to use regular expression but are interested in learning, you may consult perlretut. If you do not need or want ack to use regular expressions, please see the -Q/--literal option. Ack can also list files that would be searched, without actually searching them, to let you take advantage of ack's file-type filtering capabilities. FILE SELECTION If files are not specified for searching, either on the command line or piped in with the -x option, ack delves into subdirectories selecting files for searching. ack is intelligent about the files it searches. It knows about certain file types, based on both the extension on the file and, in some cases, the contents of the file. These selections can be made with the --type option. With no file selection, ack searches through regular files that are not explicitly excluded by --ignore-dir and --ignore-file options, either present in ackrc files or on the command line. The default options for ack ignore certain files and directories. These include: Backup files: Files matching #*# or ending with ~. Coredumps: Files matching core.\d+ Version control directories like .svn and .git. Run ack with the --dump option to see what settings are set. However, ack always searches the files given on the command line, no matter what type. If you tell ack to search in a coredump, it will search in a coredump. DIRECTORY SELECTION ack descends through the directory tree of the starting directories specified. If no directories are specified, the current working directory is used. However, it will ignore the shadow directories used by many version control systems, and the build directories used by the Perl MakeMaker system. You may add or remove a directory from this list with the --[no]ignore-dir option. The option may be repeated to add/remove multiple directories from the ignore list. For a complete list of directories that do not get searched, run ack --dump. MATCHING IN A RANGE OF LINES The --range-start and --range-end options let you specify ranges of lines to search within each file. Say you had the following file, called testfile: # This function calls print on "foo". sub foo { print 'foo'; } my $print = 1; sub bar { print 'bar'; } my $task = 'print'; Calling ack print will give us five matches: $ ack print testfile # This function calls print on "foo". print 'foo'; my $print = 1; print 'bar'; my $task = 'print'; What if we only want to search for print within the subroutines? We can specify ranges of lines that we want ack to search. The range starts with any line that matches the pattern ^sub \w+, and stops with any line that matches ^}. $ ack --range-start='^sub \w+' --range-end='^}' print testfile print 'foo'; print 'bar'; Note that ack searched two ranges of lines. The listing below shows which lines were in a range and which were out of the range. Out # This function calls print on "foo". In sub foo { In print 'foo'; In } Out my $print = 1; In sub bar { In print 'bar'; In } Out my $task = 'print'; You don't have to specify both --range-start and --range-end. IF --range-start is omitted, then the range runs from the first line in the file until the first line that matches --range-end. Similarly, if --range-end is omitted, the range runs from the first line matching --range-start to the end of the file. For example, if you wanted to search all HTML files up until the first instance of the <body>, you could do ack foo --html --range-end='<body>' Or to search after Perl's `__DATA__` or `__END__` markers, you would do ack pattern --perl --range-start='^__(END|DATA)__' It's possible for a range to start and stop on the same line. For example --range-start='<title>' --range-end='</title>' would match this line as both the start and end of the range, making a one-line range. <title>Page title</title> Note that the patterns in --range-start and --range-end are not affected by options like -i, -w and -Q that modify the behavior of the main pattern being matched. Again, ranges only affect where matches are looked for. Everything else in ack works the same way. Using -c option with a range will give a count of all the matches that appear within those ranges. The -l shows those files that have a match within a range, and the -L option shows files that do not have a match within a range. The -v option for negating a match works inside the range, too. To see lines that don't match "google" within the "<head>" section of your HTML files, you could do: ack google -v --html --range-start='<head' --range-end='</head>' Specifying a range to search does not affect how matches are displayed. The context for a match will still be the same, and Using the context options work the same way, and will show context lines for matches even if the context lines fall outside the range. Similarly, --passthru will show all lines in the file, but only show matches for lines within the range. OPTIONS --ackrc Specifies an ackrc file to load after all others; see ACKRC LOCATION SEMANTICS. --and=PATTERN Specifies a PATTERN that MUST ALSO be found on a given line for a match to occur. This option can be repeated. If you want to find all the lines with both "dogs" or "cats", use: ack dogs --and cats Note that the options that affect "dogs" also affect "cats", so if you have ack -i -w dogs --and cats then the search for both "dogs" and "cats" will be case-insensitive and be word-limited. See also the other two boolean options --or and --not, neither of which can be used with --and. -A NUM, --after-context=NUM Print NUM lines of trailing context after matching lines. -B NUM, --before-context=NUM Print NUM lines of leading context before matching lines. --[no]break Print a break between results from different files. On by default when used interactively. -C [NUM], --context[=NUM] Print NUM lines (default 2) of context around matching lines. You can specify zero lines of context to override another context specified in an ackrc. -c, --count Suppress normal output; instead print a count of matching lines for each input file. If -l is in effect, it will only show the number of lines for each file that has lines matching. Without -l, some line counts may be zeroes. If combined with -h (--no-filename) ack outputs only one total count. --[no]color, --[no]colour --color highlights the matching text. --nocolor suppresses the color. This is on by default unless the output is redirected. On Windows, this option is off by default unless the the Win32::Console::ANSI manpage module is installed or the ACK_PAGER_COLOR environment variable is used. --color-filename=color Sets the color to be used for filenames. --color-match=color Sets the color to be used for matches. --color-colno=color Sets the color to be used for column numbers. --color-lineno=color Sets the color to be used for line numbers. --[no]column Show the column number of the first match. This is helpful for editors that can place your cursor at a given position. --create-ackrc Dumps the default ack options to standard output. This is useful for when you want to customize the defaults. --dump Writes the list of options loaded and where they came from to standard output. Handy for debugging. --[no]env --noenv disables all environment processing. No .ackrc is read and all environment variables are ignored. By default, ack considers .ackrc and settings in the environment. --flush --flush flushes output immediately. This is off by default unless ack is running interactively (when output goes to a pipe or file). -f Only print the files that would be searched, without actually doing any searching. PATTERN must not be specified, or it will be taken as a path to search. --files-from=FILE The list of files to be searched is specified in FILE. The list of files are separated by newlines. If FILE is -, the list is loaded from standard input. Note that the list of files is not filtered in any way. If you add --type=html in addition to --files-from, the --type will be ignored. --[no]filter Forces ack to act as if it were receiving input via a pipe. --[no]follow Follow or don't follow symlinks, other than whatever starting files or directories were specified on the command line. This is off by default. -g PATTERN Print searchable files where the relative path + filename matches PATTERN. Note that ack -g foo is exactly the same as ack -f | ack foo This means that just as ack will not search, for example, .jpg files, -g will not list .jpg files either. ack is not intended to be a general-purpose file finder. Note also that if you have -i in your .ackrc that the filenames to be matched will be case-insensitive as well. This option can be combined with --color to make it easier to spot the match. --[no]group --group groups matches by file name. This is the default when used interactively. --nogroup prints one result per line, like grep. This is the default when output is redirected. -H, --with-filename Print the filename for each match. This is the default unless searching a single explicitly specified file. -h, --no-filename Suppress the prefixing of filenames on output when multiple files are searched. --[no]heading Print a filename heading above each file's results. This is the default when used interactively. --help Print a short help statement. --help-types Print all known types. --help-colors Print a chart of various color combinations. --help-rgb-colors Like --help-colors but with more precise RGB colors. -i, --ignore-case Ignore case distinctions in PATTERN. Overrides --smart-case and -I. -I, --no-ignore-case Turns on case distinctions in PATTERN. Overrides --smart-case and -i. --ignore-ack-defaults Tells ack to completely ignore the default definitions provided with ack. This is useful in combination with --create-ackrc if you really want to customize ack. --[no]ignore-dir=DIRNAME, --[no]ignore-directory=DIRNAME Ignore directory (as CVS, .svn, etc are ignored). May be used multiple times to ignore multiple directories. For example, mason users may wish to include --ignore-dir=data. The --noignore-dir option allows users to search directories which would normally be ignored (perhaps to research the contents of .svn/props directories). The DIRNAME must always be a simple directory name. Nested directories like foo/bar are NOT supported. You would need to specify --ignore-dir=foo and then no files from any foo directory are taken into account by ack unless given explicitly on the command line. --ignore-file=FILTER:ARGS Ignore files matching FILTER:ARGS. The filters are specified identically to file type filters as seen in Defining your own types. -k, --known-types Limit selected files to those with types that ack knows about. -l, --files-with-matches Only print the filenames of matching files, instead of the matching text. -L, --files-without-matches Only print the filenames of files that do NOT match. --match PATTERN Specify the PATTERN explicitly. This is helpful if you don't want to put the regex as your first argument, e.g. when executing multiple searches over the same set of files. # search for foo and bar in given files ack file1 t/file* --match foo ack file1 t/file* --match bar -m=NUM, --max-count=NUM Print only NUM matches out of each file. If you want to stop ack after printing the first match of any kind, use the -1 options. --man Print this manual page. -n, --no-recurse No descending into subdirectories. --not=PATTERN Specifies a PATTERN that must NOT be true on a given line for a match to occur. This option can be repeated. If you want to find all the lines with "dogs" but not if "cats" or "fish" appear on the line, use: ack dogs --not cats --not fish Note that the options that affect "dogs" also affect "cats" and "fish", so if you have ack -i -w dogs --not cats then the search for both "dogs" and "cats" will be case-insensitive and be word-limited. See also the other two boolean options --and and --or, neither of which can be used with --not. -o Show only the part of each line matching PATTERN (turns off text highlighting). This is exactly the same as --output=$&. --or=PATTERN Specifies a PATTERN that MAY be found on a given line for a match to occur. This option can be repeated. If you want to find all the lines with "dogs" or "cats", use: ack dogs --or cats Note that the options that affect "dogs" also affect "cats", so if you have ack -i -w dogs --or cats then the search for both "dogs" and "cats" will be case-insensitive and be word-limited. See also the other two boolean options --and and --not, neither of which can be used with --or. --output=expr Output the evaluation of expr for each line (turns off text highlighting). If PATTERN matches more than once then a line is output for each non-overlapping match. expr may contain the strings "\n", "\r" and "\t", which will be expanded to their corresponding characters line feed, carriage return and tab, respectively. expr may also contain the following Perl special variables: $1 through $9 The subpattern from the corresponding set of capturing parentheses. If your pattern is (.+) and (.+), and the string is "this and that', then $1 is "this" and $2 is "that". $_ The contents of the line in the file. $. The number of the line in the file. $&, $` and $' $& is the string matched by the pattern, $` is what precedes the match, and $' is what follows it. If the pattern is gra(ph|nd) and the string is "lexicographic", then $& is "graph", $` is "lexico" and $' is "ic". Use of these variables in your output will'''
