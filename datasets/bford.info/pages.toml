title = "Delegative Democracy Revisited – Bryan Ford's Home Page"
full_description = "Over a decade ago I wrote up some ideas I called “Delegative Democracy,” which has also become known as “Liquid Democracy.” My draft paper from 2002 took a first stab at laying out the general idea, though I never finished or tried to publish it. Since a lot has happened in this space since then, and I get regular inquiries about it, I thought it was high time to revisit the idea and review more recent developments. Many people including myself like the participatory ideal embodied in direct democracy, but this ideal does not readily scale beyond small communities. As I will shortly be moving to EPFL, I look forward to learning first-hand how the Swiss make direct democracy work for them — but Switzerland is a small country divided into even smaller, fairly autonomous cantons. A basic criticism of direct democracy is that expecting that every eligible voter to attend all the meetings and keep up with all the issues, rather than actually getting more people involved, may instead disenfranchise those without infinite spare time or patience. Delegative democracy attempts to make direct democracy scale, by allowing anyone who cannot participate directly in a particular vote to delegate their vote to someone they trust to participate and vote on their behalf. This process may be viewed as a mechanized equivalent of seeking advice from a friend and voting based on that advice. Delegative democracy differs from representative democracy in the principle that each voter should have free, individual choice of their delegate — not just a choice among a restricted set of career politicians — just as we already make a free, individual choice of our friends. Further, voters may choose to participate in some meetings directly, overriding their delegate’s choices in those meetings, and voters may revoke or change their delegation at any time. While corporate governance practice often allows the related idea of proxy voting, a proxy vote often amounts to a “pre-packaged mandate”: e.g., a directive to cast an unconditional YES or NO vote on my behalf regardless of what new information might be presented at the meeting or what discussion might ensue. The spirit of delegative democracy is closer to representative democracy, in that delegation is not about delivering my “canned decision” but about asking my trusted delegate to participate in the full deliberative process on my behalf. My delegate can and is expected to listen and engage in the debate, consider the information available, and make what his views as the best decision on that basis. If I dislike his decision, I can choose a different delegate before the next vote."
year_published = 2025
