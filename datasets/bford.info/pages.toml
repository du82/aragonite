["https://bford.info/2018/06/27/muslim-ban"]
title = "International Scientific Conferences Must Leave the U.S. – Bryan Ford's Home Page"
full_description = "So the U.S. Supreme Court has upheld Trump’s so-called “travel ban” – more honestly labeled a Muslim ban. More precisely, it is a ban on people from Muslim-majority countries not hosting Trump business properties (see map and fact check). This development naturally and rightfully raises again to prominence the question of where responsible scientists should hold their international conferences. We may soon see renewed calls to boycott US-based conferences, in solidarity with the many scientists around the world who can no longer attend conferences held in the U.S. But whether or not an outright boycott may be warranted, responsible scientists clearly have some choice in where to organize future conferences. Many scientists are I think rightly suggesting that we should move more, if not most, of our international scientific conferences outside the U.S. There is some evidence that this is already happening. Against this suggestion, however, I have often heard the objection that doing so “penalizes people from Muslim-majority countries already in the United States, who are now effectively stuck there.” While true on the surface, this is a weak and rapidly-fading excuse to abdicate responsibility, for two clear reasons: numbers, and choice. First consider the relevant numbers, and more importantly their trend. Of the population of scientists affected by Trump’s Muslim ban, we can ask: are there more scientists outside the U.S. who are now unable to attend U.S.-based conferences, or are there more currently in the U.S. who now cannot readily travel outside? While I do not have the figures at hand to perform a precise comparison, one fact is clear: the former category of scientists who cannot enter the U.S. is increasing, while the latter category is rapidly declining – and has been already for the past year and a half since Trump’s inauguration, perhaps even since his November 2016 election. A large portion of the affected scientists already in the U.S. are there on short-term student visas. They must leave the U.S. after their completing their degree, unless they manage to land a U.S. job and get their work visa past Trump’s “extreme vetting” process. And this population from affected countries is not getting replaced: regardless of the complex mix of reasons, the number of U.S. visas issued to people from the affected countries has crashed since Trump came to power."
year_published = 2025
clearnet = "https://bford.info/2018/06/27/muslim-ban"
