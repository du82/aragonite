["https://bford.info/album/2002/1122-Korea"]
title = "South Korea – Bryan Ford's Home Page"
full_description = '''Despite my jet lag, we managed to get out and see Donghwasa Temple in Mt. Palgongsan, just north of Daegu. A view from some of the hiking trails on Mt. Palgongsan near the temple. No, Buddhist monks aren't Nazis. It's a reverse swastika, so maybe they're the exact opposite... "Antinazis?" Sunday's main trek: We took a bus out to a nearby town, and then hiked several miles through the mountains along a lovely narrow winding road, to visit Korea's largest Ginkgo tree. It was transplanted to this location (Yonggieri) to keep it from being destroyed by the construction of a dam nearby. Some nice local folks, who we couldn't actually talk with due to language difficulties, gave us a lift a short ways on the trip out, and then some others later drove us almost all the way back to town. We were quite thankful, because the bus ride and the hike out took longer than we expected and it was already getting dark by the time we started heading back. Saturday: The Pusan Aquarium is this amazingly cool waterfront building - built almost entirely under the beach. The entrance just looks like a small visitor's center sitting on the beach, but you go down an escalator and there are several levels of cool aquarium stuff below the water line... It was dark when we got out of the aquarium, so we took a quiet walk through nearby Dongbaek Park where we met some new furry friends. Sunday: It turned out wet and rainy all day, so what better time to go out slogging through the mud at a mostly-outdoor botanical garden? (Geumgang Park, in Dongnae-gu) Finally, Chungnyeol Shrine, a temple and war memorial to the Korean heroes of the resistance against the Japanese invasions.'''
year_published = 2025
