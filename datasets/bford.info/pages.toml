["https://bford.info/pub/net/eyo-usenix-abs"]
title = "Eyo: Device-Transparent Personal Storage – Bryan Ford's Home Page"
full_description = "This paper presents Eyo, a novel personal storage system that provides device transparency: a user can think in terms of “file X”, rather than “file X on device Y”, and will see the same set of files on all personal devices. Eyo allows a user to view and manage the entire collection of objects from any of their devices, even from disconnected devices and devices with too little storage to hold all the object content. Eyo synchronizes these collections across any network topology, including direct peer-to-peer links. Eyo provides applications with a storage API with first-class access to object version history in order to resolve update conflicts automatically. Experiments with several applications using Eyo—media players, a photo editor, a podcast manager, and an email interface—show that device transparency requires only minor application changes, and matches the storage and bandwidth capabilities of typical portable devices."
