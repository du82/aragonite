["https://bford.info/2018/06/16/lausanne"]
title = "Sightseeing Around Lausanne – Bryan Ford's Home Page"
full_description = "The heart of Lausanne, worth wandering around in to get a feel for the city, is in the area of the Flon, Riponne, and Bessieres stops on the M2 line of the Lausanne Metro. From the main train station, climb the steep pedestrian street Rue du Petit-Chêne straight up the hill and you get to St-Francois Church near Flon. Get used to climbing; Lausanne embraces its three dimensions. Place de la Palud has the city hall, a colorful fountain, and a mechanical clock to entertain the kids every hour. The cathedral has a tower you can climb during the day for a great view, or at night see the nightwatchman preserve his 700-year tradition of calling out the hour. Château Saint-Maire, at the other end of the old town area on the hill, is a pretty castle but normally doesn't let tourists in because it's been busy hosting the region's government since around 1400. If you like museums, Lausanne's unique “must-see” museum is the Collection de l'Art Brut, exhibiting the work of artists who were disconnected from mainstream art education or culture – often producing pieces both naïve and amazingly intricate, as if by a child with a 20-year attention span. The Hermitage museum is small but often hosts excellent temporary exhibitions, and is on a pleasant park walk (i.e., climb) up to Lake Sauvabelin, and its tower with a view even more amazing than the cathedral but missing the nightwatchman. At the downslope end of the M2 line is Ouchy, with pleasant lakeside walks in both directions. A short walk east along the lake is the Olympic park and museum, home of the famous committee the locals call “vacuum cleaners” for what they do to money. The lakeside walk west of Ouchy is a pleasant way to get to or from EPFL if you have an hour to spare, but the walk east of Ouchy to Lutry is even prettier. The half-hour boat ride across the lake to Évian-les-Bains, where that water comes from, is also pleasant. The most jaw-droppingly beautiful area near Lausanne is Lavaux, just east of the city, where medieval monks figured out what amazing Chasselas wines the sunny south-facing slopes could produce. I like to take a train to Grandvaux and have a drink with a view or walk in any direction, but if you have a few hours, the hike from St-Saphorin to Lutry is wonderful. The small towns in the area offer plenty of opportunities for wine-tasting distraction along the way."
