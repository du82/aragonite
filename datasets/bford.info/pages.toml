["https://bford.info/log/2006/0924-SybilParties.html"]
title = "Sybil Parties: An Offline Foundation for Online Accountability – Bryan Ford's Home Page"
full_description = '''Today's online ecosphere continually suffers from its inability to tell who is a genuine, unique human and who isn't. Because open-access messaging systems cannot isolate or authenticate the human source of messages for the purpose of suppressing abuses, spam has already relegated USENET to historical obscurity [Templeton01], threatens the usability of E-mail [Wouters05], and is even advancing on Skype. The automated "Turing tests" many web sites employ lock out visually impaired users [Chong03, May05] and are vulnerable to attack using artificial intelligence [Chellapilla05] or social engineering [Doctorow04]. Wikipedia progressively tightens its editing rules to combat the rising tide of anonymous vandalism [Knight05, Hafner06, Thompson06]. Voting-based participatory systems such as Slashdot operate reliably only to the extent that nobody cares about the results of votes enough to bother opening many accounts and stuffing the ballot boxes. Banning detected abusers by IP address frequently prevents access by other legitimate users on the same ISP [Kalsey04], and many attacks come from compromized zombie machines not under the control of their owners [Evers05]. More serious proposed solutions to these abuses typically revolve around authenticating a user's identity in some way before granting (full) access. Most E-commerce sites already require users to identify themselves by entering personal information and a credit card or even a bank account number, although a few support emerging anonymous payment services such as paysafecard, Xrost, or Ukash. Single sign-on initiatives such as Microsoft Passport, the Liberty Alliance, and OpenID try to centralize a user's personal information at a single "identity provider", which various online services contact to authenticate the user. Identification is often more than we want or need, however: anonymous communication and social participation is widely viewed as a crucial tool to safeguard basic democratic values such as privacy and freedom of speech [Teich99], and the rights of minorites [Stein03].'''
year_published = 2025
