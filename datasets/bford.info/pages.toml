["https://bford.info/2019/02/22/voting"]
title = "The Remote Voting Minefield: from North Carolina to Switzerland – Bryan Ford's Home Page"
full_description = "The absentee ballot fraud in North Carolina shows how current vote-by-mail methods are fundamentally flawed and vulnerable to vote-buying and coercion. But banning remote voting of any kind would disenfranchise everyone not living in their country of citizenship; that is not a real option. It is important to understand in this light the context of the Swiss e-voting project, one of whose two implementations was recently opened to public inspection by the Swiss Post for inspection and analysis by international experts. Almost everyone in Switzerland votes by mail. Despite its well-known vulnerability to fraud, coercion, or vote-buying of exactly the kind we see in North Carolina, Switzerland adopted postal voting from 1978 to 2006 for voter convenience and engagement. Due to its tradition of direct democracy, Switzerland asks citizens to vote four times per year, not just once in 2-4 years as in the US. If you’re asking people to read up on and vote on dozens of issues several times a year, it had better be convenient. Then there’s the expat issue. Swiss citizens living abroad, even in neighboring European countries, don’t get voting rights there like moving to another state in the US. About 11% for Swiss citizens live abroad, in contrast to more like 3% of US citizens. Switzerland’s population is similar to New York City’s. If Switzerland disallowed remote voting, it would be like NYC disenfranchising any New Yorker who moves elsewhere until they spend 10 years establishing new citizenship in Jersey or Upstate New York. Taking a position of “no remote voting” in a small country like Switzerland would be not just unrealistic but flat-out undemocratic. Given this reality, the Swiss voting authorities have the challenging and unenviable task of navigating a minefield of imperfect alternatives. At regulation and design level, the Swiss E-voting project is the most technically solid I’ve seen anywhere, mandating end-to-end encryption and universal verifiability all the way from vote entry through shuffling and counting in the split-trust back-end. Another important distinction of Switzerland’s approach is its requirement that “the source code for the system software must be made public” — a huge advance over the standard practice of governments almost anywhere else in the world."
year_published = 2025
