["https://bford.info/2023/01/02/matchertext"]
title = "Matchertext: an escape route from language-embedding hell? – Bryan Ford's Home Page"
full_description = 'Hosting extensions make matchertext useful by allowing the verbatim embedding of any matchertext string in a suitable host-language construct such as a string literal. In C-like languages, for example, I suggest new backslash-escape sequences like \m[matchertext], where matchertext is an arbitrary matchertext string. SGML-derived markup languages might be enhanced with backward-compatible syntax extensions such as <name attributes [matchertext]> for a tag containing arbitrary matchertext content. Embedding extensions reduce the (hopefully already-modest) pain of writing matchertext-compliant code, particularly by providing new alternative ways to escape unmatched matchers. A statement like printf("[") is invalid matchertext, for example, and simple backslash-escaping as in printf("\[") does not work because the matchertext discipline is oblivious to language-specific escaping rules. Numeric escaping like printf("\x5B") solves the problem and already works fine, but is a bit cumbersome. Thus, I suggest potential new backward-compatble escapes that are more visual while being matchertext-compliant: e.g., \o[] and \c[] for unmatched open and close brackets in C-like languages, or [<] and [>] for unmatched brackets in regular expressions or SGML-style markup languages.'
year_published = 2025
