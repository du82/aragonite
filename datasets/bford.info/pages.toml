["https://bford.info/2016/10/25/mining"]
title = "Untangling Mining Incentives in Bitcoin and ByzCoin – Bryan Ford's Home Page"
full_description = "As the first widely-deployed cryptocurrency, Bitcoin has proven hugely successful and inspired a blockchain fever (or is it a bubble?). Bitcoin's security and economic assumptions are showing significant fractures, however. Following previously-identified selfish mining and stubborn mining attacks, new research from Princeton being presented at CCS identifies further incentive weaknesses that appear as transaction fees supplant block rewards as the primary incentive for mining. In short, miners motivated by transaction fees have even greater incentive to deviate strategically from the standard Bitcoin protocol in selfish and potentially destructive ways. In his summary, Arvind Narayanan notes: At least one such “rethinking of the role of block rewards” already exists, however. You may judge for yourself how “fundamental” this rethinking is. ByzCoin is an experimental protocol created by the Decentralized and Distributed Systems (DEDIS) lab at EPFL and presented at the USENIX Security conference this past summer. While a rigorous incentive analysis has not yet been done on ByzCoin, informal analysis suggests that ByzCoin's architecture may be far more resilient to these known incentive-compatibility weaknesses. In essence, both the new attacks — and the earlier selfish or stubborn mining attacks — appear to be ineffective against ByzCoin. This blog post informally compares the way Bitcoin and ByzCoin handle transaction fee incentives, deferring the topic of selfish mining to a followup post. In Bitcoin, miners earn immediate rewards for successfully solving the cryptographic puzzles that allow them to extend the blockchain. These rewards are divided into block rewards, in which the miner may create a fixed amount of “new money” according to a hard-coded schedule, and transaction fees, which the miner receives from Bitcoin users as an incentive to include their transactions in the blockchain. As block rewards regularly decrease by half — eventually dropping to zero in the year 2140 — miners' incentives shift from block rewards to transaction fees. For the moment, however, the important point is that Bitcoin confers both block rewards and transaction fees to miners immediately upon the successful mining of a new block. We might describe Bitcoin as an “instant gratification cryptocurrency.”"
year_published = 2025
clearnet = "https://bford.info/2016/10/25/mining"
