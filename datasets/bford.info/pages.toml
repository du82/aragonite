["https://bford.info/2017/06/23/turing50"]
title = "Technology Governs Us. Will it Govern Us Well? – Bryan Ford's Home Page"
full_description = "We now live in a world in which the rules coded into the technology we use plays as important a role in governing our lives as the formal laws written in the public law books. Code is law already, for better or worse. Unfortunately both the technology and policy communities still tend to treat technology as a simple set of tools, like a mechanical watch, home appliance, or automobile, which always unquestioningly serves its operator. A smart watch or home appliance can now monitor our behavior and report it to a company or government, can enforce remotely-controlled rules determining when and how it operates, and can remotely determine what content we are allowed to view or when and for whom the smart lock on a door to our own home opens. Today’s cars can already be remotely disabled or attacked, and soon will be capable of governing where we can go and when. Technology is no longer just a set of obedient tools but, for better or worse, also an inherent part of the system of governance that determines what individual freedoms we do and don’t have. Unfortunately, the mindset of technology as an obedient toolset has led both government and industry to deploy technology in ways that undermine long-standing governance principles and undermine the basic freedoms and rights we depend on democratic governments to uphold: principles such as rule of law, separation of powers, and limited warrant-based search. The principle of rule-of-law states that the public should have the right to know, debate, and challenge the rules that govern their lives. As technology is increasingly critical in enforcing the rules by which we live, we must demand and work to ensure that the rule-of-law principle translates properly into the digital domain. We have now have well-understood technology, especially cryptographic tools, that can ensure the integrity and correctness of publicly-known processes while keeping sensitive details private, consistent with rule-of-law principles. But so far we have seen little to development or deployment of these technologies for this purpose."
year_published = 2025
clearnet = "https://bford.info/2017/06/23/turing50"
tags = ["govern", "governs", "june", "technology", "well?"]
language = "en"
