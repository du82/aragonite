["https://bford.info/2019/02/08/identity"]
title = "Rethinking Priorities: Should Identity Systems Divide or Unite People? – Bryan Ford's Home Page"
full_description = "The problem of identity has become a hot topic, with the idea of self-sovereign identity in particular attracting significant excitement. The essence of the idea, in short, is to put users in charge of how their identities and personal data are used. Self-sovereign identity posits that users should decide how much and what aspects of their identities to disclose in any situation, and should know and have control over what that information is used for. I have no argument with these basic goals. The approaches to achieving them I’ve seen, however, start to run astray in the very next step. Self-sovereign identity systems typically focus in practice on representing an identity as a set of attributes or verifiable claims that users may “prove” about themselves to a relying party. For example, the standardization effort around decentralized identity currently defines decentralized identifiers as the “base layer”, and immediately atop that the verifiable claims layer defining a rich taxonomy of personal information someone might want to know about someone else. A central presumption in this model appears to be that the main purpose of a decentralized identity, and its main value, should be to enable such distinctions through verifiable claims. This implies by extension that a decentralized identity without any attributes that a user can (or wishes to) claim is effectively a useless, valueless, “null” identity. But by single-mindedly focusing on attributes as the primary use of an identity, self-sovereign identity projects are pushing the cart before the horse. They forgot even to ask, let alone adequately answer, the question of who or what the user is who is supposed to be put “in control” of their identity, before seeking to facilitate discrimination between such users. By rushing headlong toward the goal of differentiating people from each other via attributes and verifiable claims, self-sovereign identity projects neglect the even-more-fundamental requirement to differentiating people from non-people. Before we even begin to separate people from each other via attributes, we need a way to separate the human users, who are supposed to be in control of their identities, from the many non-human entities such as devices, websites, businesses, and governments, bots, AIs, and Sybils, which often deliberately work against a user’s control. Dividing people from each other via attributes, before uniting people in distinction from the increasingly-powerful non-people in the ecosystem, will work against and probably defeat the basic eponymous objective of imbuing identity with “self-sovereignty.”"
year_published = 2025
clearnet = "https://bford.info/2019/02/08/identity"
