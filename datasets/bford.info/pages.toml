["https://bford.info/album/2004/0116-Venice"]
title = "Venice – Bryan Ford's Home Page"
full_description = '''It's not too often that I get to go to a conference in such a place! Here's the conference croud, geeking away under centuries-old Italian frescoes in the Auditorium Santa Margherita, Dorsoduro. I stayed at Palazzo Zenobio, an old Armenian palace near the auditorium. Conference meals were also held here. Picking our way through the twisty streets on a rainy day. Well actually, Anya's picking our way, and I'm following with the camera. :) After my conference was over, Anya and I stayed at a small (5-room?) hotel near Ospedale Civile, on the northeast side of Venice, from where you can see across the lagoon to Isola di San Michele. Although the weather was usually quite calm and pleasant in the city, one late night around high tide it got quite stormy around the edges and started flooding the north-shore walkway near our hotel. On Tuesday we explored Castello, the eastern end of the "big fish" of Venice, as well as Isola di San Pietro, where the original "main" church is located. A small gondola fleet out cruising the canal. A singer was standing in the front of one of the boats (second from right), singing to the whole group.'''
