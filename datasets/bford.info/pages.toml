["https://bford.info/2004/11/23/indrep"]
title = "Individual Representation – Bryan Ford's Home Page"
full_description = 'The "credentials" an activist receives from an indrep election serves as a democratically legitimate measure of the size of his public support base, bolstering his status among peers and giving him the ability to prove public backing for his platform when arguing in public forums. In effect, democratic credentials can help activists who truly represent the will of a community to distinguish themselves from the common "vocal nut." Ordinary voters who do not have the time or inclination to be activists, in turn, gain the ability to support their activist friends in a way that requires very little personal time and no money. Indrep elections give activists a greater incentive to court and develop direct personal relationships with the ordinary, non-political people in their communities and social circles, and to keep potential voters in all elections personally informed and educated about important developments that the voters themselves may not have the time or inclination to follow. Voters in turn receive a truly unrestricted, individual choice of activists who can represent their views or interests in public debates, and thus can make their true preferences known in a fashion impossible with conventional electoral competitions between just two or three viable candidates. As an added benefit of participation, voters are also far more likely to receive individual attention from the activists they support than they would from traditional "mass market" career politicians. Hence individual representation. Indrep elections work much like ordinary popular elections, except that they require no official government support and are typically run by independent non-profit organizations. Indrep elections are held periodically, perhaps once or twice a year, on dates that may or may not have any relationship to the dates of regular government-sponsored elections. Activists who wish to participate in the election register themselves with the election commission as delegates, or "candidates" competing for popular votes but not for public office. Delegates are then responsible for promoting themselves and their platforms among friends, supporters, or the public at large, and persuading their supporters to vote in both indrep and traditional elections. There are no prerequisites to becoming a delegate other than an ability and commitment to follow the rules of the election: anyone can become a delegate even having no existing support base other than him- or herself.'
