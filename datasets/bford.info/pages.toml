["https://bford.info/post/2020-11-18-ai-governance"]
title = "AI for Governance Belongs in Mechanism, Not Policy – Bryan Ford's Home Page"
full_description = "This post contains an address delivered at the IRGC conference on Governance Of and By Digital Technology. Computer science has a well-established design principle known as separation of mechanism and policy. I think this principle may be equally applicable to human governance – especially in considering the question of where AI does and does not belong. I believe the cautious use of today’s powerful AI technologies based on machine learning can justifiably play many useful roles in implementing low-level mechanisms used in governance. But I hold that AI has no legitimate role to play in defining, implementing, or enforcing policy. Matters of policy in governing humans must remain a domain we reserve strictly for humans. What differentiates mechanism from policy? Mechanism represents a toolbox of technologies and processes that are usable in many different ways, and that are generally oblivious to how they are used. Policy determines the right way to use the tools we have towards beneficial ends. Mechanism strives to be value-neutral, while acknowledging that no technology is ever fully neutral. Policy, in contrast, necessarily lives in the densest heart of the jungle of human values, ethics, and norms. Policy is not about being value-neutral but about identifying and embodying the right values in the right way. As an example, AI may have many justifiable uses in electronic sensors to detect the presence of a car, how fast it’s going, or whether it stopped at an intersection. But AI does not belong anywhere near the policy decision of whether a car’s driver warrants suspicion and should be stopped by highway patrol. Similarly, deciding what is a house, a tree, or a road in an aerial photo is mechanism, for which AI is probably justified and certainly useful. Deciding – or even just suggesting or recommending – which neighborhoods on a map should receive more police attention and surveillance is policy, a decision domain where I claim at AI can play no legitimate role."
year_published = 2025
clearnet = "https://bford.info/post/2020-11-18-ai-governance"
