["https://bford.info/2014/10/22/cs-growth.html"]
title = "Faculty size and growth in the top 20 Computer Science departments – Bryan Ford's Home Page"
full_description = "Yesterday the Yale Daily News ran an article on our CS department’s faculty shortage, which generated some discussion among CS colleagues. Yale’s CS faculty shortage is not really news: for example, another YDN article over a year ago made basically the same point, and that probably wasn’t the first. Setting aside Yale in particular, however, it is interesting to notice some broader trends in CS department growth. So here are a couple charts I recently put together. The first estimates the number of tenure-track faculty in each of the top 20 CS departments, ordered accoring to US News’s current rankings. Major caveat: this faculty size data is completely unofficial and approximate, based purely on the number of apparent ladder faculty members listed on the respective CS department web sites. Obvious potential sources of error include, for example, faculty positions that are split across departments but not clearly labeled as “adjunct” or “courtesy” appointments, and combined CS-and-EE departments in which it is not always obvious which faculty are more “CS” and which are more “EE”. But these represent best guesses based on publicly available information and are reasonably accurate to the best of my knowledge. The CRA folks who put together the Taulbee Survey probably have better and more “official” data, but I don’t have that data. As the orange line indicates across the left half of the chart indicates, CS departments in the top 10 appear to average about 67 ladder faculty, with Carnegie Mellon, MIT, and Georgia Tech being by far the largest, and Princeton being the smallest of the top-10 at around 35 faculty. As the yellow line on the right side indicates, departments in the “next 10” category appear to average around 39 ladder faculty each. None of this is likely to be much of a surprise to anyone familiar with CS academia. What is more interesting is to look at the relative faculty growth over the past decade, broken down the same way below. The baseline numbers are derived from the corresponding CS department home pages as captured by the Internet Archive around September 2004."
year_published = 2025
