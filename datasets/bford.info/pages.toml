["https://bford.info/pub/lang/presint2-abs"]
title = "Separating Presentation from Interface in RPC and IDLs – Bryan Ford's Home Page"
full_description = "Separating presentation from interface, both in the interface definition language (IDL) itself and in the RPC implementation, is the key to interoperability, with many benefits in the area of elegance, as well. This separation and resulting cleanliness makes it manageable to generate specialized kernel code paths for each type of client-server pair. This is a key element of end-to-end optimization. The separation should also allow the integration of disparate RPC optimization techniques, such as those applied in LRPC and fbufs, into a single system, in a uniform and fully interoperable way. In initial work we demonstrate a variant of threaded code generation and two presentation-based optimizations, transparently activated by the RPC system. Each of these optimizations speeds up local RPC by approximately 25%."
year_published = 2025
clearnet = "https://bford.info/pub/lang/presint2-abs"
