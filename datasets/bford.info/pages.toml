["https://bford.info/2019/07/29/go-generics"]
title = "Are Only Type Parameters Generic Enough for Go 2 Generics? – Bryan Ford's Home Page"
full_description = "The Go language appears to be getting slightly closer to supporting generics, with the recent release of a new proposal for generics based on type parameters and contracts. I generally like the direction this proposal is going, with one significant reservation. I feel that the current proposal both unnecessarily limits how “generic” Go’s generics will be, and risks painting the language into a corner in the long term. This is because the proposal single-mindedly assumes that the only compile-time generic parameters we will ever want are type parameters, which seems like an unnecessary and undesirable restriction. This blog post offers feedback to the current generics draft proposal, exploring this concern and potential solutions. In the current generics proposal, function definitions may be parameterized with a set of optional type parameters, separate from and preceding the function’s regular parameters, as illustrated in the proposal’s simple generic Print example: What is actually going on here is that the generic function Print takes one compile-time parameter T (a type) and one run-time parameter s (a slice of type T). A user of this generic binds T to a specific actual type at compile time, which may happen either explicitly or implicity using type inference, to produce a “version” of Print specialized to type T. This specialization of Print to type T is in turn a function taking a run-time parameter s, which the function’s caller will bind to a run-time actual parameter: i.e., a specific slice with elements of type T to be printed. Of course, as the proposal discusses, such a generic can be compiled multiple ways with different tradeoffs. The compiler could produce a single block of Print code that internally uses polymorphism or reflection mechanisms to operate dynamically on any type that might be passed to it. Alternatively, the compiler might actually instantiate a separate copy of the Print code specialized to each specific type that callers happen to bind T to. The compiler has both options: that’s part of the point."
year_published = 2025
clearnet = "https://bford.info/2019/07/29/go-generics"
