["https://bford.info/2015/10/07/names.html"]
title = "Let's verify real people, not real names. – Bryan Ford's Home Page"
full_description = "On Monday the EFF, together with a “Nameless Coalition” of like-minded groups, escalated the backlash against Facebook’s “real names” or “authentic identities” policy with an open letter urging Facebook to end this policy like Google Plus did last year. Facebook’s response cites concerns about pseudonyms helping to hide “terrorist organizations”, “school bullies”, and “criminal behavior.” While I support anonymity and have spent years working to strengthen it, terrorist fearmongering aside, Facebook is right that anonymity is often abused. Pseudonym-friendly Twitter constantly struggles with trolls, and has for years. Ironically, such abuse has even led die-hard anonymity advocates to de-anonymize trolls. And even Twitter’s demands for phone number verification rankle users desiring the stronger anonymity provided by Tor. Online services seemingly face a zero-sum choice between protecting people who have legitimate needs for anonymity, and protecting everyone else from those who abuse anonymity. But this is a false choice, because most of an abuser’s power comes not from having one pseudonym, but from having many. Abuse using an army of fake identities is known as sockpuppetry on Wikipedia, or in computer science as a Sybil attack after a famous psychiatric case. The security benefit Facebook arguably derives from asking suspect users to confirm their identity has little to do with actually knowing the user’s real name: is Facebook going to decide that an “Alice” is more trustworthy than a “Bob”? On the contrary, the perceived security benefit has everything to do with verifying that the user is a real person controlling only that one account. But what if online services could verify that a user is a real person without intrusively demanding to know the user’s real name? Years ago I proposed a possible solution that I believe a determined group of activists like the Nameless Coalition could readily put into practice on a grassroots budget and with only minimal buy-in from industry. The idea is simple: Once a year, organizers in participating cities and towns host an event to which anyone may show up in person and obtain a cryptographic token, which might be simply a random-looking number printed on a slip of paper. This token carries no identity information whatsoever, but merely attests that the holder is a real person. The holder can subsequently use this token to register or confirm pseudonymous accounts with participating online services throughout the subsequent year. Pseudonym party attendees need not show any ID, and would even be welcome to wear masks, but everyone would receive an indelible ink mark making it difficult for cheaters to acquire several tokens the same day."
year_published = 2025
