full_description = '''.aperture-body { min-width: 64rem; } Press ‎↵ Enter‎ for Accessibility for blind people who use screen readersPress ‎↵ Enter‎ for Keyboard NavigationPress ‎↵ Enter‎ for Accessibility menuB2B, Gov, Students & More News, Tips & ReviewsAbout UsThe Professional's Source Since 1973AccessibilityLive ChatHelp800.606.6969Ask Our Experts800.606.6969Hello, Log InAccount & OrdersMy Cart Photography Computers Pro Video Lighting Pro Audio Drones Camcorders TVs & Entertainment Audio-Visual Optics Mobile Surveillance More... Used Specials .limitedTimeOfferSectionsWrapper .itemLimitedTimeOffers {display:none}Feedback.breadcrumbsTextShadow { filter: drop-shadow( 0 0 5px #92b7e0) drop-shadow( 0 0 6px #92b7e0) drop-shadow( 0 0 7px #92b7e0) drop-shadow( 0 0 8px #92b7e0) }HomeDrones & Aerial Imaging{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"WebPage","@id":"https://www.bhphotovideo.com/","name":"Home"}},{"@type":"ListItem","position":2,"item":{"@type":"WebPage","@id":"https://www.bhphotovideo.com/c/browse/drones-aerial-photography/ci/27989/N/3765401970","name":"Drones & Aerial Imaging"}}]}Drones & Aerial ImagingB&H Expert Video: Quick Tips Fly on! What type of Drone is right for you? Live Chat For More InfoRequest CallbackEmail800.606.6969Drones & ROVsBeginnerProsumerPro CinemaFPV RacingEnterpriseUnderwater ROVsAll DronesDrone Parts & AccessoriesDrone BatteriesDrone Cases & AccessoriesDrone Gimbals & AccessoriesDrone Replacement PartsDrone FPVs & AccessoriesRemote Controllers & AccessoriesMisc. AccessoriesShop by BrandBuying GuideDrones 101Tips and SolutionsPreflight Safety Tips for Drone PilotsFeaturesThe Essential Drone GlossaryBuying GuideThe Best Drones for Photo, Video, and FPVNewsMeet Neo, DJI's Smallest Drone EverWhat Is a Drone?Drones, also known as UAVs (unmanned aerial vehicles), come in a variety of shapes and sizes, from small, consumer-grade quads to industrial-sized octocopters. Drones can be used for a variety of applications and use cases, including aerial imaging and cinematography, land surveying, infrastructure inspection, leisurely flight, first-person racing, and more.What Are the Different Types of Drones?All drones fall into one or more categories, depending on their feature set, size, intended application, and cost. Some of the most common types of drones are:Camera Drones: With the exception of certain toy and novice-level drones, most consumer-grade UAVs feature some type of onboard camera system. The quality of that camera system is a key determinant of a drone’s categorization. For example, a high-quality camera system with advanced supporting features is a good indicator that a drone is either a prosumer- or professional-level drone.Beginner Drones: Beginner drones are easy to operate, relatively durable, and come equipped with basic, user-friendly features that help novice pilots get accustomed to operating a drone. Compared to other drone categories, the majority of beginner drones are relatively small and inexpensive. Prosumer Drones: Drones that can be used for both personal and professional applications are often categorized as prosumer drones. These types of drones tend to include more advanced technologies and features, including a higher-quality camera with better recording capabilities, increased battery life, enhanced safety protocols and tracking functionality, and more. Professional Cinema Drones: Professional cinema drones are strictly for the pros. These advanced moviemaking tools feature the most sophisticated aerial imaging equipment and functionality available, including cinema-grade cameras with 3-axis gimbal support, the latest image processing software and technologies, industry-leading video transmission, and much more. Enterprise Drones: Enterprise drones are advanced, commercial-grade UAVs designed for specific applications, such as infrastructure inspection, search and rescue, firefighting, and more. Because of their task-specific design, enterprise drones often feature unique technologies and accessories not regularly seen on conventional drones, such as thermal cameras, spotlights, and more. Mini Drones: Drones weighing less than 250 g (0.55 lb) are often categorized as mini drones. Most mini drones fall into other categories as well (such as beginner and/or camera drones), but their standout feature is their sub-250 g weight, which, depending on the use case, allows them to be flown without registration.FPV Drones: Unlike most conventional drones, which are piloted from a third-person perspective, FPV (first-person view) drones are piloted from the drone’s point of view. Live video is transmitted from the drone’s onboard camera to a compatible ground receiver, either a video monitor or FPV goggles. FPV drones can be used for many applications, including aerial photography and cinematography, remote inspection, security, and, of course, FPV racing.ROV Drones: Not all drones belong in the air. ROVs (remotely operated underwater vehicles) are submersible unmanned drones that are typically controlled via tether, Wi-Fi buoy, or some combination of both. ROVs are used in both consumer and commercial applications, including underwater photography, exploration, inspection, and more.Which Drone Accessories Do I Need?Like drones, drone accessories cover a wide range of categories and use cases, running the gamut from absolutely niche to absolutely necessary. Some of the most common and essential drone accessories include:Extra Batteries: Depending on your drone, maximum flight time can range anywhere from a few minutes to a few hours. To avoid having to wait while you recharge the battery, be sure to stock up on a spare battery or two.Memory Cards: If you plan on capturing photos and/or videos with your drone, odds are you’re going to need more storage than what your drone provides. If that’s the case, be sure to stock up on compatible memory cards, which will allow you to save all of your aerial imagery. Spare Parts: Despite advancements in safety-enhancing features like obstacle avoidance, drones are not impervious to damage. To avoid a premature and possibly permanent grounding, be sure to keep plenty of spare and replacement parts handy, especially propellers.Protective Cases: Regardless of whether you are a professional, a hobbyist, or somewhere in between, being a drone pilot definitely isn’t cheap. Even so-called "beginner" drones require a fairly substantial investment. To protect that investment, we recommend a protective case or backpack, which will safeguard your drone from the elements and allow you to securely transport it from one location to the next.Sign up for B&H News & Special OffersEmailSign upManage Existing Email SubscriptionsCustomer Service & HelpReturn PolicyTrack/Request a ReturnManage Catalog SubscriptionPaymentsInternationalSite DirectoryShop By BrandAll Help TopicsCompany InformationAbout B&HOur NYC SuperStoreHours of OperationPayboo Credit CardAffiliate ProgramManufacturers DirectoryCareer OpportunitiesOther B&H SitesFederal MarketplaceStudent AdvantageB2B Corp. Govt. & Edu.Event SpaceExplora - News & ReviewsB&H Photography Podcast© 2000- B & H Foto & Electronics Corp. 420 9th Ave, New York, NY 10001 Mobile AppsTerms of usePrivacyExport PolicySales & Expert Advice800.606.6969Customer Service800.221.5743Live ChatContact UsRequest Call BackTrade in Your GearStore Pick UpB&H Gift CardsFree Expedited Shipping'''
