full_description = '''.aperture-body { min-width: 64rem; } Press ‎↵ Enter‎ for Accessibility for blind people who use screen readersPress ‎↵ Enter‎ for Keyboard NavigationPress ‎↵ Enter‎ for Accessibility menuB2B, Gov, Students & More News, Tips & ReviewsAbout UsThe Professional's Source Since 1973AccessibilityLive ChatHelp800.606.6969Ask Our Experts800.606.6969Hello, Log InAccount & OrdersMy Cart Photography Computers Pro Video Lighting Pro Audio Drones Camcorders TVs & Entertainment Audio-Visual Optics Mobile Surveillance More... Used Specials .limitedTimeOfferSectionsWrapper .itemLimitedTimeOffers {display:none}Feedback.breadcrumbsTextShadow { filter: drop-shadow( 0 0 5px #null) drop-shadow( 0 0 6px #null) drop-shadow( 0 0 7px #null) drop-shadow( 0 0 8px #null) }HomeOptics{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"WebPage","@id":"https://www.bhphotovideo.com/","name":"Home"}},{"@type":"ListItem","position":2,"item":{"@type":"WebPage","@id":"https://www.bhphotovideo.com/c/browse/optics/ci/978","name":"Optics"}}]}OpticsOpticsBinocularsTelescopesSpotting ScopesRiflescopes & SightsNight & Thermal VisionField AccessoriesMonocularsLaser RangefindersMicroscopesBuying GuideThe Best Binoculars for Kids in 2024Buying GuideOut of This World GiftsBuying GuideBest Gifts for Wildlife and Bird PhotographersBuying GuideWhich Pair of Binoculars Should I Give?NewsZEISS Announces New Conquest HDX BinocularsShopping for the Right Optics Whether you want to view the distant vistas or track elusive wildlife, there are hundreds of optics available, from microscopes and rifle scopes to thermal and night visual aids. Understanding the different types of optics and their respective features is crucial when making a buying decision. Choosing the Best Binoculars Shopping for binoculars can be quite confusing, as many come in similar-looking designs. You need to understand specs, such as magnification and objective lens diameter, to narrow down to the best one for your needs. Full-size binoculars come with magnifications of 8 x 42 or 10 x 50. They capture more light and provide a wide field of view, making them ideal for wildlife viewing and boat use. Midsize binoculars usually have magnifications of 7 x 35 or 10 x 32. They strike a great balance between above-average light transmission and moderate size, making them an optimal choice for both sports and wildlife viewing. Common magnification specs of compact binoculars are 8 x 25 and 10 x 25. They're the smallest and lightest binoculars, thus the perfect choice when you're on the go. With monoculars, you get half a pair of binoculars, for viewing with a single eye, and they're more portable, compact, and lighter. What's more, if you have stronger eyesight in one eye, these could be more practical. Telescopes for Astronomy Since they come in a range of sizes and shapes, it's often daunting to shop for telescopes and astronomy gear. However, the most important specification of a telescope is the diameter of its light-gathering lenses, also known as the aperture. The aperture is usually expressed in millimeters or inches. For precise sky gazing, go for a telescope with at least 70mm (or 2.8 inches) aperture. Telescopes come in three broad categories: reflectors, refractors, and catadioptrics. Reflectors These use concave mirrors to gather and focus light. They have reliable apertures that offer sharp images with good contrast, for all kinds of celestial objects. Refractors Refractors have the typical design of telescopes: a long tube with large lenses on the front and a smaller eyepiece on the back. The front lenses focus the light to form images, while the eyepiece acts as a magnifying glass that enlarges the images. Because of their large aperture, these telescopes are ideal for avid planetary observers. Catadioptrics With catadioptric telescopes, you get the best of both worlds. They employ both mirrors and lenses to form and enlarge images. Even better, you get a large aperture for precise star gazing, even with their compact size. Spotting Scopes and Rifle Scopes When shopping for rifle scopes and spotting scopes, it's important to consider the magnification power. Some scopes have a fixed magnification of 20x, 25x, or 30x, while those with zoom eyepieces have variable magnification that's adjustable by hand within a set range, for instance, a 18x to 36x magnification. Another important factor to consider is the size of the objective lens. The larger the lens, the more the light transmitted to your eyes, which means brighter and clearer images.Sign up for B&H News & Special OffersEmailSign upManage Existing Email SubscriptionsCustomer Service & HelpReturn PolicyTrack/Request a ReturnManage Catalog SubscriptionPaymentsInternationalSite DirectoryShop By BrandAll Help TopicsCompany InformationAbout B&HOur NYC SuperStoreHours of OperationPayboo Credit CardAffiliate ProgramManufacturers DirectoryCareer OpportunitiesOther B&H SitesFederal MarketplaceStudent AdvantageB2B Corp. Govt. & Edu.Event SpaceExplora - News & ReviewsB&H Photography Podcast© 2000- B & H Foto & Electronics Corp. 420 9th Ave, New York, NY 10001 Mobile AppsTerms of usePrivacyExport PolicySales & Expert Advice800.606.6969Customer Service800.221.5743Live ChatContact UsRequest Call BackTrade in Your GearStore Pick UpB&H Gift CardsFree Expedited Shipping'''
