How to Get Magical Milky Way Photos Every TimeTips and SolutionsPhotographing DancersNewsB&H Photo News Roundup: Week of February 23, 2025 Looking for photo cables?Find the right cable for your photography needs. /*Application title update*/ h2#Applications {text-transform: none; color: black; visibility: hidden; position: relative; font-size: 1.15rem;} h2#Applications:after { content: "What would you like to shoot?"; display: block; visibility: visible; position: absolute; top: 10px; left: 10px;} div:has(> h2#Applications) { box-shadow: none; padding: 0px; }PhotographyB&H has been the USA’s premier photography store for over 50 years. As an authorized seller of Canon, Fuji, Nikon, Olympus, Panasonic, Sony and more, we are committed to providing the best camera gear along with superior knowledge, prices, and shipping.We have the right cameras, lenses, and accessories for beginners, hobbyists, and professionals alike. If you have any questions, contact our knowledgeable sales staff. What are some common photography types?Popular photography genres include landscape, portraits and people, street, travel, aerial, weddings and events, sports, wildlife, macro, and more.• Landscape photographs show the outdoors. Generally, they capture nature, but often include man-made features – even entire cityscapes. The most common lens for landscape photography is a wide angle, but telephoto lenses are a wonderful way to isolate and highlight specific features of the scene. For more, check out our Landscape Photography page.• Portraits and people photography ranges from capturing family outing all the way to full-time professionals working with in-studio models. For portraits, a short-to-moderate telephoto lens (such as a 105mm) is preferred by many due to pleasing compression and rendering of facial features. For more, check out 8 Tips Every Beginning Portrait Photographer Should Know.• Street photography is candid photography made in public situations. It generally intends to capture life, culture, and humanity, and does not necessarily require the presence of a street or an urban environment. Small and unobtrusive is the way to go here, camera-wise. For more, check out Eight Recommended Digital Cameras for Street Photography.• Travel photography involves capturing the essence of far-off places. A small and light kit that can handle anything from landscapes, food, people, and street is ideal.· Aerial photography is any photograph taken from the air. Whether it’s from a sightseeing helicopter, the window seat of an airplane, or from a camera drone, this is a surefire way to get a new perspective on things. For more, check out our Drones page.• Weddings and events can often be stressful and hectic. Having backups of your gear is essential, as there is often no chance to get a second chance if something goes wrong. • Sports can be taking pictures of Junior’s soccer match, shooting from the sidelines of an NFL game, and anything in between. Lenses for sports can range from an all-in-one zoom for a few hundred dollars, to a this-lens-is-more-expensive-than-my-car supertelephoto. F• Wildlife shares many of the challenges and gear requirements of shooting sports – in both cases you are trying to capture fast-moving subjects that are at some distance. A gimbal head on your tripod can be invaluable here, especially when shooting birds in flight.Sign up for B&H News & Special OffersEmailSign upManage Existing Email SubscriptionsCustomer Service & HelpReturn PolicyTrack/Request a ReturnManage Catalog SubscriptionPaymentsInternationalSite DirectoryShop By BrandAll Help TopicsCompany InformationAbout B&HOur NYC SuperStoreHours of OperationPayboo Credit CardAffiliate ProgramManufacturers DirectoryCareer OpportunitiesOther B&H SitesFederal MarketplaceStudent AdvantageB2B Corp. Govt. & Edu.Event SpaceExplora - News & ReviewsB&H Photography Podcast© 2000- B & H Foto & Electronics Corp. 420 9th Ave, New York, NY 10001 Mobile AppsTerms of usePrivacyExport Poli