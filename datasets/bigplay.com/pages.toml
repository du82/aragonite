description = "The former Browns returner and wide receiver fired up the crowd ahead of the game.Former Browns wide receiver and returner Josh Cribbs served as the Browns Dawg Pound Captain in their Week 9 game against the Chargers.Cribbs smashed a Chargers-themed electric guitar and pumped up the crowd right before the Browns kicked"
full_description = "JOSH CRIBBS SERVES AS WEEK 9 DAWG POUND CAPTAIN AGAINST CHARGERS 03 Nov 2024 The former Browns returner and wide receiver fired up the crowd ahead of the game.Former Browns wide receiver and returner Josh Cribbs served as the Browns Dawg Pound Captain in their Week 9 game against the Chargers.Cribbs smashed a Chargers-themed electric guitar and pumped up the crowd right before the Browns kicked off to the Chargers in Week 9.Cribbs was drafted by the Browns in 2005 and has 13,488 return yards between both his work as a punt and kick returner. Cribbs has the second-most all-time kick return touchdowns with eight, adding three punt return touchdowns. Read more Prev post Next post"
