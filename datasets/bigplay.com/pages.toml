full_description = "SEIZE THE GREY WINS PENNSYLVANIA DERBY 19 Nov 2024 Preakness Stakes (G1) winner refinds his form with front-running victory.Not everyone loves Saratoga Race Course. As much as the Spa may be America’s most popular racetrack, it’s way at the bottom of Seize the Grey ‘s to-do list. After two disappointing tries at Saratoga, the son of Arrogate shifted locales to Pennsylvania and all of a sudden it was like he was back in Maryland on the third Saturday in May.Reverting to his winning form earlier this year in the Preakness Stakes (G1) for legendary 89-year-old trainer D. Wayne Lukas, MyRacehorse’s Seize the Grey provided his 2,570 micro-share owners with another unforgettable thrill as he led throughout and romped by 3 3/4 lengths in the $1 million Pennsylvania Derby (G1) for 3-year-olds Sept. 21 at Parx Racing. Read more Prev post Next post"
