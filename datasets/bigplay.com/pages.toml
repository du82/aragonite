title = "BIGPLAY SPORTS NETWORK WINS 'MOMENT OF THE YEAR'  – BIGPLAY Sports Network"
description = "What an incredible week in horse racing for BIGPLAY Sports. We are proud to announce that we won a major award! Our own Ken Myles was on hand for the 54th Eclipse Awards. Think of this as the Oscars of horse racing. Ken Myles is a part owner of MyRachorse, and the team had a monster year. They campaigned Seize The Grey"
full_description = '''BIGPLAY SPORTS NETWORK WINS 'MOMENT OF THE YEAR' 27 Jan 2025 What an incredible week in horse racing for BIGPLAY Sports. We are proud to announce that we won a major award! Our own Ken Myles was on hand for the 54th Eclipse Awards. Think of this as the Oscars of horse racing. Ken Myles is a part owner of MyRachorse, and the team had a monster year. They campaigned Seize The Grey and Straight No Chaser, two of the best horses in the United States. They won a Triple Crown race with Seize the Grey and a Breeders' Cup with Straight No Chaser. The team won two awards, and Ken Myles even appeared on stage. Pictured from left to right: Amber Behrens, Michael Behrens, Ken Myles, and Mary Myles.The NTRA Moment of the Year went to Seize The Grey for his win in the Preakness. The victory made D. Wayne Lukas the oldest trainer in history to win a Triple Crown race. He was 88 at the time. The win also marked a shift in horse racing. Seize the Grey was the first horse entirely owned by a fractional ownership. It certainly will not be the last. The MyRacehorse team accepting an award for Straight No Chaser at the 54th Eclipse Awards.The team picked up a second award later in the night for Champion Male Sprinter. Straight No Chaser wowed the racing world with two dominant wins in three starts. The horse is being pointed to a 2025 campaign, and we can't wait to see what he does next. We are proud to have covered the horse on this site before he blew up and shook the world. It was a magical night for BIGPLAY Sports and MyRacehorse. The only question is, what will the teams do for an encore? Improbable Luck has some big horseshoes to fill. When I asked him if he felt overwhelmed, he said, "Neigh." Prev post Next post'''
