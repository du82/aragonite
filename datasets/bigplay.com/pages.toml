["https://bigplay.com/blogs/spotlight/talkin-track"]
title = "TALKIN' TRACK WELCOMES AARON HALTERMAN  – BIGPLAY Sports Network"
description = "Lin-Manuel Miranda says people should write the shows they want to see in this world. That is sage advice. I plan to do it with the BIGPLAY horse show Talkin' Track this year.Since I first got into racing, I have wanted to create a new type of show. The show I wish was on air, but I couldn't find. My best friend Aaron"
full_description = '''TALKIN' TRACK WELCOMES AARON HALTERMAN 15 Jan 2025 Lin-Manuel Miranda says people should write the shows they want to see in this world. That is sage advice. I plan to do it with the BIGPLAY horse show Talkin' Track this year.Since I first got into racing, I have wanted to create a new type of show. The show I wish was on air, but I couldn't find. My best friend Aaron Halterman co-owns Racing Dudes with Jared Welch. I used to do things on their podcast that you have seen on my show, Talkin' Track. "What the Bleep" was a segment I created for them. They also played other games I made, and I wrote their Blinkers Off podcast theme song.The feedback I got from those little segments was astonishing. One time, I went to Oaklawn Park with the Dudes. A fan came up and sang their theme song to me. The one I had written. That same day, more fans asked for more "What the Bleeps!" It went like that for a while. Fans kept coming up and liking my segments. I realized people liked my work, and it changed my life. It gave me confidence about what I was able to do. It made me believe that people liked what I had to offer and wanted to hear my voice. From there, I started putting my skills into my projects. This led me to a screenwriting career. In short, working on a racing show changed my life.Still, my heart has always wanted to create the horse racing show I wish was out there. I wanted to do something that would entertain me and make new fans along the way. I wanted to create a show you would enjoy even if you didn't like horse racing. I am so excited to bring that show to you this year. Talkin' Track in 2025 will be different, and I hope you come along for the ride.I plan to have more hilarious segments and songs. I want to bring in the cast of incredible experts I have met—people like my friend and mentor, Jon White. I want to dissect races in new and fun ways. I am also excited to give you free bets and expert insights. Hopefully, this is the show you have been looking for, too. Watch now Prev post Next post'''
