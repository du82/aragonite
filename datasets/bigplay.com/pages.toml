full_description = "OHIO STATE'S GUIDE TO NOTRE DAME – THE 3 PLAYERS BUCKEYE FANS NEED TO KNOW 16 Jan 2025 Ryan Day’s Buckeyes are seeking their first national championship since 2015, and the last obstacle remaining is an underdog Notre Dame squad. The Bucks made quick work of Tennessee and Oregon before surviving a second-half comeback from Texas in the national semi-final. Ohio State has opened on most sports books as a -9.5 point favorite, one of the largest national title spreads in recent memory. Translation: The Buckeyes have never been closer to a national championship, and Notre Dame may need a miracle. Here are the three players Notre Dame will rely on to take a puncher’s chance at the Buckeyes. #1 Jeremiyah Love, Sophomore Running BackWhen Audric Estime declared for the NFL draft last offseason, it left ND running backs coach Deland McCullough in an interesting spot: three sophomore running backs jousting for the starting job. Boy, did McCullough pick the right one. Jeremiyah Love is the most athletic running back in the country and has made his name by utilizing hurdles every chance he gets. Love has been dealing with a lower-body injury since the USC game, but the national championship game will be the healthiest he’s been in the playoffs after a ten-day break. Love was the only player in the country to score a touchdown in every regular season game, and he will headline a stable, including a home run back, JD Price, and 3rd down back, Aneyas Williams. Notre Dame will need every bit of Love’s 7.1 yards per carry to compete with Ohio State and wouldn’t complain about a 98-yard touchdown run like the one that opened the Indiana game. BIGPLAY talent and OSU legend Bobby Carpenter praised ND’s star back. “He’s a home run hitter. He’s been explosive and they love to utilize him a ton.” #2 Leonard Moore, Freshman Cornerback When Notre Dame lost in the last second against Ohio State last season, many praised star cornerback Benjamin Morrison for shutting down Marvin Harrison Jr (3 rec, 32 yards). Morrison returned for his junior season at Notre Dame in 2024, but a hip injury against Stanford knocked Notre Dame’s best player out for the season. Since Morrison’s injury, freshman cornerback Leonard Moore has taken the reigns as CB1, and the freshman has not disappointed. Moore led all Notre Dame defenders in PFF grade and is unanimously viewed as the best freshman cornerback in the country. However, Moore has not seen a WR with the abilities of Jeremiah Smith or Emeka Egbuka. Notre Dame did not allow ONE pass to be caught by a Penn State wide receiver in the semi-final, but Ohio State is a much different beast. #3 Riley Leonard, Graduate Student QuarterbackRiley Leonard was being projected as a first-round pick or early Day 2 selection in the NFL Draft in October of 2023. The Duke quarterback had put the program into an unfamiliar position, at 5-1, until the season came crashing to a halt when Leonard suffered a season-ending injury- against Notre Dame. A transfer portal trip and three offseason surgeries later, Leonard was brought in to quarterback the Irish. Leonard was belittled by media and fans alike after Notre Dame’s Week 2 loss to NIU but has since responded by head-manning 13 consecutive wins. Leonard is not much of a passing threat, but in the semi-final, he made the one throw he needed to, a 50+ yard fade route to sophomore Jaden Greathouse. “He’s the straw that stirs the drink for ND,” said Carpenter. If Notre Dame wants a shot against the Bucks, Leonard will need to avoid turnovers (2 vs PSU) and continue to run the ball at a high level (5.2 YPC, 16 TD). Make sure to tune into The Bobby Carpenter Show daily for the best coverage of the national championship game! Watch now Prev post Next post"
