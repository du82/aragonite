full_description = '''BROWNS' JAMEIS WINSTON REJECTS MASHED POTATOES AS A THANKSGIVING DISH, DOESN'T EVEN WANT IT AROUND 27 Nov 2024 Winston's list of favorite fast-food places doesn't include chains that feature mashed potatoes on the menu By: Jackson Thomas Cleveland Browns quarterback Jameis Winston won't eat just anything, apparently. The backup, whose career has been associated with food in the media after a college scandal involving allegedly stolen seafood and a heavier body build, revealed his distaste for mashed potatoes on Wednesday. Winston said mashed potatoes is a dish that he doesn't even want people to bring to Thanksgiving, in an interview on the "BIGPLAY" podcast... Watch more on X. Read more on Fox News Read more Prev post Next post'''
