["https://bikerumor.com/aasq-139-how-does-tpi-relate-to-puncture-protection-and-tire-suppleness"]
title = "AASQ #139: How does TPI relate to Puncture Protection and Tire Suppleness? - Bikerumor"
description = """
Jessie-May Morgan is the UK & Ireland Tech Editor of Bikerumor. She has been writing about Mountain Bike Riding and Racing, and all its weird and wonderful technology for 4 years. Prior to that, she was an Intern at the Mountain Bike Center of Scotland, and a Mountain Bike Coach and Leader in the Tweed Valley.
Based in Innerleithen, Scotland, Jessie-May can often be seen riding the Glentress Trail Center, and its neighboring Enduro and Downhill Tracks. She regularly competes in Enduro at a national level, and has recently competed on the World Stage at a handful of Enduro World Series events.
For Bikerumor, Jessie-May is testing the latest mountain bikes, equipment and kit, letting readers know what’s hot and what’s not.
For context, she weighs 60kg and stands at 5ft 4″ tall (163cm)."""
full_description = 'Home > Feature Stories AASQ #139: How does TPI relate to Puncture Protection and Tire Suppleness? Written by Jessie-May Morgan Oct 15, 2021 11:28 a.m. ET Click to share on Facebook (Opens in new window)Click to email a link to a friend (Opens in new window) Support us! Bikerumor may earn a small commission from affiliate links in this article. Learn More We know, there’s no such thing as a stupid question. But there are some questions you might not want to ask your local shop or riding buddies. AASQ is our weekly series where we get to the bottom of your questions – serious or otherwise. Hit the link at the bottom of the post to submit your own question. Choosing tires can be an absolute minefield. To ensure we’re making the right choice, we must tread carefully, combing through the various casings, tread patterns and rubber compound options. Grip, puncture resistance and rolling resistance hang in the balance, but how a tire’s suppleness impacts these factors is often easily overlooked. This week, we have ONZA, Maxxis, WTB and Vittoria on hand, answering your technical questions on how TPI relates to a tire’s puncture resistance, as well as its suppleness on the trail. Plus, we have a not entirely unrelated bonus question on safe tire-rim width combinations. Enjoy! Your expert contributors are as follows: Ken Avery, SVP Product Development at Vittoria Industries North America James Heaton and Clayton Wangbichler, Marketing and Public Relations at WTB Aaron Chamberlain, MTB Marketing Manager at Maxxis Robin Schaub, Design Engineer at ONZA Tires Is it true that a 120 TPI tire is easier to puncture than a 60 TPI tire, as the fibers are narrower? ONZA: For this question we have to dive a bit further into the definition of TPI and the respective connected casing material. Tire casings are made from a woven fabric which consists of nylon threads; TPI is an acronym for threads per inch, meaning it measures the density of the woven fabric based on how many threads there are per inch. The Onza Porcupine RC is available in Enduro and Gravity casings, both with a single-ply of 120 TPI, but the Gravity casing gets additional 2-ply reinforcements underneath the tread, though it doesn’t quite run from bead-to-bead So, in theory, a 120 TPI fabric is twice as dense as a 60 TPI fabric, but in reality, however, the treads used for a 60 TPI casing are much thicker than on a 120 TPI casing which means that it is a lot less fragile and more resistant to cuts. The wider spacing on 60TPI treads, however, need a much higher rubber penetration in production to be air tight for tubeless setups. This adds additional weight to the tire, but also higher puncture protection due to the thicker rubber coating compared to 120TPI fabrics. Maxxis: Yes, all else being equal, a 120 TPI tire will be relatively more “fragile” than a 60 TPI tire. TPI refers to the number of threads in one square inch of material. To get more threads into that defined space, each individual thread much be smaller. <img decoding="async" class="lazyload wp-image-153272 size-full" src="https://bikerumor.com/wp-content/uploads/2017/03/maxxis-60tpi-mountain-bike-tire-casing02.jpg" alt="maxxis 60 tpi mtb tire casing" width="800" height="533" srcset="https://bikerumor.com/wp-content/uploads/2017/03/maxxis-60tpi-mountain-bike-tire-casing02.jpg 800w, https://bikerumor.com/wp-content/uploads/2017/03/maxxis-60tpi-mountain-bike-tire-casing02-120x80.jpg 120w, https://bikerumor.com/wp-content/uploads/2017/03/maxxis-60tpi-mountain-bike-tire-casing02-297x198.jpg 297w, https://bikerumor.com/wp-content/uploads/2017/03/maxxis-60tpi-mountain-bike-tire-casing02-768x512.jpg 768w, https://bikerumor.com/wp-content/uploads/2017/03/maxxis-60tpi-mountain-bike-tire-casing02-600x400.jpg 600w" sizes="(max-width: 800px) 100vw, 800px" />Maxxis 60 TPI Tire Casing material; their Downhill Casing uses a dual-ply layer of this material with a butyl insert One important thing to note: Maxxis measures TPI based on a single ply of casing material, while some brands measure TPI based on a completed tire where the casing material overlaps. So, for instance, a brand may claim 180 TPI when it’s really the same piece of 60 TPI casing folded over on itself twice (60+60+60), creating three layers. It’s like folding a $20 in half and claiming you now have $40. Vittoria: There are many factors that contribute to the durability of a tire, and casing TPI is certainly one of those factors. However, when considering a tire, TPI must be viewed along with tread thickness, compound, aspect ratio, etc., which all work together to prevent punctures. <img data-dominant-color="616f64" data-has-transparency="false" style="--dominant-color: #616f64;" decoding="async" class="lazyload not-transparent wp-image-273702 size-full" src="https://bikerumor.com/wp-content/uploads/2021/10/vittoria-syerra-downcountry-mtb-tire.jpg" alt="vittoria syerra downcountry mtb tire side profile" width="1600" height="1067" srcset="https://bikerumor.com/wp-content/uploads/2021/10/vittoria-syerra-downcountry-mtb-tire.jpg 1600w, https://bikerumor.com/wp-content/uploads/2021/10/vittoria-syerra-downcountry-mtb-tire-297x198.jpg 297w, https://bikerumor.com/wp-content/uploads/2021/10/vittoria-syerra-downcountry-mtb-tire-800x534.jpg 800w, https://bikerumor.com/wp-content/uploads/2021/10/vittoria-syerra-downcountry-mtb-tire-120x80.jpg 120w, https://bikerumor.com/wp-content/uploads/2021/10/vittoria-syerra-downcountry-mtb-tire-768x512.jpg 768w, https://bikerumor.com/wp-content/uploads/2021/10/vittoria-syerra-downcountry-mtb-tire-1536x1024.jpg 1536w, https://bikerumor.com/wp-content/uploads/2021/10/vittoria-syerra-downcountry-mtb-tire-720x480.jpg 720w" sizes="(max-width: 1600px) 100vw, 1600px" />The new 29″ x 2.4″ Vittoria Syerra Downcountry tire gets a single-ply 60 TPI casing with an anti-pinch flat insert in the sidewalls For the sake of the question, if you are simply comparing a higher TPI material (such as 120) to a standard TPI (such as 60) material, the higher TPI does provide less protection, particularly in terms of impact resistance. This is due to the cord thickness being smaller (more threads fit into one inch), which typically sacrifices a bit of abrasion resistance for higher flexibility and lower weight. In applications where lower rolling resistance and weight are the key goals, higher TPI will typically be used. In applications where durability comes first, lower TPI may be used. It all comes down to the intended use of the tire, and what the project goals are. Often times you will see a higher TPI used with additional sidewall protection, which offers a balance of both traits. WTB: If there is no puncture protection layer added to the casing, then in theory, a tire with a 120 TPI casing would puncture a little easier than a 60 TPI tire. The fibres that make up a 120 TPI tire casing are thinner than those of a 60 TPI tire, which means there is less rubber holding it all together. A thinner casing with less rubber would, theoretically, be more vulnerable. <img data-dominant-color="36352c" data-has-transparency="false" style="--dominant-color: #36352c;" decoding="async" class="lazyload not-transparent wp-image-273688 size-full" src="https://bikerumor.com/wp-content/uploads/2021/10/WTB_SG2-and-Updated-Treads_Product-2.jpg" alt="wtb sg2 puncture protection" width="1200" height="800" srcset="https://bikerumor.com/wp-content/uploads/2021/10/WTB_SG2-and-Updated-Treads_Product-2.jpg 1200w, https://bikerumor.com/wp-content/uploads/2021/10/WTB_SG2-and-Updated-Treads_Product-2-297x198.jpg 297w, https://bikerumor.com/wp-content/uploads/2021/10/WTB_SG2-and-Updated-Treads_Product-2-800x533.jpg 800w, https://bikerumor.com/wp-content/uploads/2021/10/WTB_SG2-and-Updated-Treads_Product-2-120x80.jpg 120w, https://bikerumor.com/wp-content/uploads/2021/10/WTB_SG2-and-Updated-Treads_Product-2-768x512.jpg 768w, https://bikerumor.com/wp-content/uploads/2021/10/WTB_SG2-and-Updated-Treads_Product-2-720x480.jpg 720w" sizes="(max-width: 1200px) 100vw, 1200px" />SG2 replaces WTB’s original Slash Guard for improved puncture protection on their 60 TPI enduro tires such as the updated Vigilante shown here However, we build a nylon puncture protection layer into all our 120 TPI mountain and gravel tires. This way you can benefit from the reduced weight and increased suppleness that a higher TPI has to offer, without compromising on durability. How does TPI affect tire casing suppleness? WTB: Theoretically speaking, a tire with a higher TPI count should be more supple. The thinner fibres combined with less rubber will result in an overall thinner casing that’s able to flex and conform to terrain better, giving a more supple feel. <img data-dominant-color="767875" data-has-transparency="false" style="--dominant-color: #767875;" decoding="async" class="lazyload not-transparent wp-image-275048 size-full" src="https://bikerumor.com/wp-content/uploads/2021/10/WTB-Ranger-2-25_xc-trail-racing_damp-wet-conditions_mountain-bike-tire_wet-trail.jpg" alt="wtb ranger 2.25&quot; 120 tpi xc mtb tire" width="1200" height="800" srcset="https://bikerumor.com/wp-content/uploads/2021/10/WTB-Ranger-2-25_xc-trail-racing_damp-wet-conditions_mountain-bike-tire_wet-trail.jpg 1200w, https://bikerumor.com/wp-content/uploads/2021/10/WTB-Ranger-2-25_xc-trail-racing_damp-wet-conditions_mountain-bike-tire_wet-trail-297x198.jpg 297w, https://bikerumor.com/wp-content/uploads/2021/10/WTB-Ranger-2-25_xc-trail-racing_damp-wet-conditions_mountain-bike-tire_wet-trail-800x533.jpg 800w, https://bikerumor.com/wp-content/uploads/2021/10/WTB-Ranger-2-25_xc-trail-racing_damp-wet-conditions_mountain-bike-tire_wet-trail-120x80.jpg 120w, https://bikerumor.com/wp-content/uploads/2021/10/WTB-Ranger-2-25_xc-trail-racing_damp-wet-conditions_mountain-bike-tire_wet-trail-768x512.jpg 768w, https://bikerumor.com/wp-content/uploads/2021/10/WTB-Ranger-2-25_xc-trail-racing_damp-wet-conditions_mountain-bike-tire_wet-trail-720x480.jpg 720w" sizes="(max-width: 1200px) 100vw, 1200px" />The 2.25″ WTB Ranger XC MTB Tire gets a 120 TPI casing In the real world though, a lot of off-road 120 TPI tires are accompanied by a puncture protection layer, which will vary in form depending on the manufacturer. Adding a protection layer to the casing will inevitably ‘thicken’ it up a little, and then the characteristics of a higher TPI count will be less obvious. The more substantial the puncture protection layer, the more likely that it will affect the suppleness. The thinner the layer, the smaller the effect. So, to answer the question, having a higher TPI can be more supple, but it really depends on what else is added to the casing during the design process. Finding the right balance of TPI, rubber thickness, and efficient puncture protection is key. Maxxis: All else being equal, a tire will become more supple as the TPI increases, so a 170 TPI casing is more supple than a 120 TPI which is more supple than a 60 TPI. A supple casing conforms better to the terrain which can improve traction and reduce rolling resistance. Think of the difference between a Hanes Beefy-T and a silk shirt. <img data-dominant-color="64626c" data-has-transparency="false" style="--dominant-color: #64626c;" decoding="async" class="lazyload not-transparent wp-image-275032 size-full" src="https://bikerumor.com/wp-content/uploads/2021/10/The-first-is-Rebecca-McConnell-maxxis-team-issue-170-TPI-Aspens.jpg" alt="rebecca mcconnel maxxis team issue aspen 170 tpi tires" width="1600" height="1066" srcset="https://bikerumor.com/wp-content/uploads/2021/10/The-first-is-Rebecca-McConnell-maxxis-team-issue-170-TPI-Aspens.jpg 1600w, https://bikerumor.com/wp-content/uploads/2021/10/The-first-is-Rebecca-McConnell-maxxis-team-issue-170-TPI-Aspens-297x198.jpg 297w, https://bikerumor.com/wp-content/uploads/2021/10/The-first-is-Rebecca-McConnell-maxxis-team-issue-170-TPI-Aspens-800x533.jpg 800w, https://bikerumor.com/wp-content/uploads/2021/10/The-first-is-Rebecca-McConnell-maxxis-team-issue-170-TPI-Aspens-120x80.jpg 120w, https://bikerumor.com/wp-content/uploads/2021/10/The-first-is-Rebecca-McConnell-maxxis-team-issue-170-TPI-Aspens-768x512.jpg 768w, https://bikerumor.com/wp-content/uploads/2021/10/The-first-is-Rebecca-McConnell-maxxis-team-issue-170-TPI-Aspens-1536x1023.jpg 1536w, https://bikerumor.com/wp-content/uploads/2021/10/The-first-is-Rebecca-McConnell-maxxis-team-issue-170-TPI-Aspens-720x480.jpg 720w" sizes="(max-width: 1600px) 100vw, 1600px" />Rebecca McConnell racing at the Snowshoe World Cup on Maxxis Team Issue 170 TPI Aspen XC Tires; their High Road HYPR tires get this ultra-supple casing too ONZA: The TPI count is an important parameter to fine-tune the characteristics of a tire casing. Using the basic TPI knowledge from the previous question, we know that the threads to produce different TPI casing fabrics use diameters. A lower TPI number casing uses a stiff thread, woven into a loose fabric, while a higher TPI number casing means a finer thread woven into a dense fabric, allowing the rubber coating to be reduced to a minimum. Lower TPI casings will adapt their form with less resistance to the ground underneath the tire, while higher TPI casings provide better damping due to the increased rubber penetration. To illustrate this explanation, let’s compare the fabrics of (A) a robust denim cloth, made of thick cotton strings and (B) a delicate silk fabric, woven of threads as fine as a hair. <img data-dominant-color="565f41" data-has-transparency="false" style="--dominant-color: #565f41;" decoding="async" class="lazyload not-transparent wp-image-272589 size-full" src="https://bikerumor.com/wp-content/uploads/2021/09/2022-onza-ibex-mtb-tire-tread-pattern.jpg" alt="2022 onza ibex tread pattern" width="1600" height="1067" srcset="https://bikerumor.com/wp-content/uploads/2021/09/2022-onza-ibex-mtb-tire-tread-pattern.jpg 1600w, https://bikerumor.com/wp-content/uploads/2021/09/2022-onza-ibex-mtb-tire-tread-pattern-297x198.jpg 297w, https://bikerumor.com/wp-content/uploads/2021/09/2022-onza-ibex-mtb-tire-tread-pattern-800x534.jpg 800w, https://bikerumor.com/wp-content/uploads/2021/09/2022-onza-ibex-mtb-tire-tread-pattern-120x80.jpg 120w, https://bikerumor.com/wp-content/uploads/2021/09/2022-onza-ibex-mtb-tire-tread-pattern-768x512.jpg 768w, https://bikerumor.com/wp-content/uploads/2021/09/2022-onza-ibex-mtb-tire-tread-pattern-1536x1024.jpg 1536w, https://bikerumor.com/wp-content/uploads/2021/09/2022-onza-ibex-mtb-tire-tread-pattern-720x480.jpg 720w" sizes="(max-width: 1600px) 100vw, 1600px" />The new Onza IBEX TRC runs a single-ply 60 TPI casing, though the GRC (Gravity Casing) gets a single-ply 120 TPI casing with dual-ply reinforcement A might be more durable, but is less supple than B. This might not make too much of a difference on a single-ply casing where only one (if folded 2) casing layer is used, however when using multiple casing layers such as on more gravity orientated casings'
