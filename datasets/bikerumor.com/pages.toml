["https://bikerumor.com/mrp-baxter-gravel-suspension-fork-review"]
title = "Review: MRP Baxter Levels Up Gravel Suspension Forks - Bikerumor"
description = """
Tyler Benedict is the Founder of Bikerumor.com, where he’s been writing about the latest bikes, components, and cycling technology for almost two decades. Prior to that, Tyler launched and built multiple sports nutrition brands and consumer goods companies, mostly as an excuse to travel and ride in new places.
Based in North Carolina, Tyler also loves the Vanlife & family adventure travel and is always on the lookout for the next shiny new part and off-grid adventure."""
full_description = 'Home > Reviews > Component Reviews Review: MRP Baxter Levels Up Gravel Suspension Forks Written by Tyler Benedict Feb 24, 2025 12:15 p.m. ET Click to share on Facebook (Opens in new window)Click to email a link to a friend (Opens in new window) 6 Comments Support us! Bikerumor may earn a small commission from affiliate links in this article. Learn More When it comes to gravel suspension forks, you’d think there’s not a lot of opportunity to make 40mm of travel that different from the next brand. Turns out, you can, and the MRP Baxter makes the most of it while also packaging it in a more versatile, adjustable, and functional chassis than anything else out there. Here’s everything you need to know, including specs, actual weights, and my ride review… MRP Baxter specs & features There’s a lot that sets this fork apart. For starters, it comes in 40mm and 60mm travel options, the latter being more travel than most competitors. That makes it one of the only options for aggressive “monster gravel” builds. <img data-dominant-color="5e6971" data-has-transparency="false" decoding="async" width="2000" height="1196" src="https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-1.webp" alt="side by side comparison of MRP baxter gravel suspension fork and regular carbon fork." class="lazyload not-transparent wp-image-377622" style="--dominant-color: #5e6971; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-1.webp 2000w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-1-297x178.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-1-1536x919.webp 1536w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-1-120x72.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-1-768x459.webp 768w" sizes="(max-width: 2000px) 100vw, 2000px" /> I tested the 40mm travel option because I’m no monster, and I wanted to maintain a racier feel. It still added about 20mm of axle-to-crown height compared to the stock fork, which did make the front end feel a little taller, but not so much it bothered me. In fact, I’ve come to appreciate a taller stack height and more upright riding position anyway, so it was great. And… <img data-dominant-color="758999" data-has-transparency="false" decoding="async" width="2000" height="1500" src="https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-8.webp" alt="closeup details of MRP baxter gravel suspension fork." class="lazyload not-transparent wp-image-377629" style="--dominant-color: #758999; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-8.webp 2000w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-8-297x223.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-8-1536x1152.webp 1536w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-8-120x90.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-8-768x576.webp 768w" sizes="(max-width: 2000px) 100vw, 2000px" /> …thanks to their flip-chip dropout system, you can adjust the effective fork offset (and, thus, trail) to maintain the handling you’re accustomed to. There are two axle insert options per fork travel: 40mm Travel 44mm fixed 40.5mm / 47.5mm 60mm Travel 45mm fixed 41.4mm / 48.4mm <img data-dominant-color="717274" data-has-transparency="false" decoding="async" width="1800" height="1350" src="https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-10.webp" alt="closeup details of MRP baxter gravel suspension fork." class="lazyload not-transparent wp-image-377631" style="--dominant-color: #717274; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-10.webp 1800w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-10-297x223.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-10-1536x1152.webp 1536w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-10-120x90.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-10-768x576.webp 768w" sizes="(max-width: 1800px) 100vw, 1800px" />There’s room for Boost axle spacing, and modular dropouts let you run it either way. (Yes, that gap closes when the axle is tightened, thanks for asking.) It’s also one of the only gravel suspension forks with a 12×110 Boost option. Both fixed offset dropouts come in standard 100mm front axle spacing, but you can get the offset dropouts in either 12x100mm or 12x110mm Boost axle spacing. The only downside to these dropouts is that they have no hooked grooves at the top, so the wheel can slide right past them during installs. It’s not a big deal when cruising around, but if you’re frantically changing a flat during a race, it can be a little frustrating trying to line it up under pressure. <img data-dominant-color="566d80" data-has-transparency="false" decoding="async" width="2000" height="1500" src="https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-tire-clearance-9.webp" alt="closeup details of MRP baxter gravel suspension fork." class="lazyload not-transparent wp-image-377641" style="--dominant-color: #566d80; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-tire-clearance-9.webp 2000w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-tire-clearance-9-297x223.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-tire-clearance-9-1536x1152.webp 1536w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-tire-clearance-9-120x90.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-tire-clearance-9-768x576.webp 768w" sizes="(max-width: 2000px) 100vw, 2000px" />It looks like there’s still room for compression, but this is as far as the fork goes. For the 40mm travel option, they also offer a spacer for running larger tires. Claimed clearance is 700x45mm tires, but add an optional 5mm spacer (which will increase axle-to-crown height 5mm) and it fits 700×50 (29×2.0) tires. 60mm travel forks will clear larger tires without the adapter. That said, while I have those spacers sitting here in a drawer, I was able to run 700×50 Panaracer Gravelking SK+ tires without needing to add them. So, at least on this Niner RLT RDO, I felt fine running it as it came out of the box. I imagine running less offset (pushing the tire backward) and with some downtube designs, you may want to use them, though. <img data-dominant-color="718b9c" data-has-transparency="false" decoding="async" width="2000" height="1500" data-id="377624" src="https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-3.webp" alt="closeup details of MRP baxter gravel suspension fork." class="lazyload not-transparent wp-image-377624" style="--dominant-color: #718b9c; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-3.webp 2000w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-3-297x223.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-3-1536x1152.webp 1536w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-3-120x90.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-3-768x576.webp 768w" sizes="(max-width: 2000px) 100vw, 2000px" /> <img data-dominant-color="708898" data-has-transparency="false" decoding="async" width="2000" height="1500" data-id="377625" src="https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-4.webp" alt="closeup details of MRP baxter gravel suspension fork." class="lazyload not-transparent wp-image-377625" style="--dominant-color: #708898; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-4.webp 2000w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-4-297x223.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-4-1536x1152.webp 1536w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-4-120x90.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-4-768x576.webp 768w" sizes="(max-width: 2000px) 100vw, 2000px" /> There’s plenty of tire clearance inside the arch for 700x50mm tires (more on that below), and the arch itself is robust. It’s also shapely, with a lot of little shaping details flowing throughout the rest of the fork, too. Look closely and you’ll see small indents, bulges, curves, and bumps throughout. Those details make the fork look simultaneously muscular and svelte, tough and smooth. Which is exactly how it feels riding…stiff and structured, but soaks up the bumps like I wanted. <img data-dominant-color="7d8c97" data-has-transparency="false" decoding="async" width="2000" height="1500" data-id="377628" src="https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-7.webp" alt="closeup details of MRP baxter gravel suspension fork." class="lazyload not-transparent wp-image-377628" style="--dominant-color: #7d8c97; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-7.webp 2000w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-7-297x223.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-7-1536x1152.webp 1536w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-7-120x90.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-7-768x576.webp 768w" sizes="(max-width: 2000px) 100vw, 2000px" /> <img data-dominant-color="748b9b" data-has-transparency="false" decoding="async" width="2000" height="1500" data-id="377626" src="https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-5.webp" alt="closeup details of MRP baxter gravel suspension fork." class="lazyload not-transparent wp-image-377626" style="--dominant-color: #748b9b; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-5.webp 2000w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-5-297x223.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-5-1536x1152.webp 1536w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-5-120x90.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-5-768x576.webp 768w" sizes="(max-width: 2000px) 100vw, 2000px" /> <img data-dominant-color="8d969a" data-has-transparency="false" decoding="async" width="2000" height="1500" data-id="377627" src="https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-6.webp" alt="closeup details of MRP baxter gravel suspension fork." class="lazyload not-transparent wp-image-377627" style="--dominant-color: #8d969a; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-6.webp 2000w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-6-297x223.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-6-1536x1152.webp 1536w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-6-120x90.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-6-768x576.webp 768w" sizes="(max-width: 2000px) 100vw, 2000px" /> <img data-dominant-color="7b8b95" data-has-transparency="false" decoding="async" width="2000" height="1500" data-id="377630" src="https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-9.webp" alt="closeup details of MRP baxter gravel suspension fork." class="lazyload not-transparent wp-image-377630" style="--dominant-color: #7b8b95; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-9.webp 2000w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-9-297x223.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-9-1536x1152.webp 1536w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-9-120x90.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/MRP-baxter-gravel-suspension-fork-review-details-9-768x576.webp 768w" sizes="(max-width: 2000px) 100vw, 2000px" /> Three other things that set this fork apart: Dual Air SpringsFill the positive chamber first, then the negative. While most forks have gone to a single air chuck system, relying on a check valve to fill both chambers and keep their pressures equalized at sag, MRP’s design lets you fine tune the beginning stroke feel by dialing in the negative air pressure separately. Add a little less air for a firmer feel, or a little more for a softer feel. You can also adjust positive air volume with spacers. Accessory MountsBikepacking? it has mounts for a lightweight rack or bottle cages. The latter is only for standard two-bolt cages, making it a great way to carry a little extra water or smaller stuff (jacket, first aid kit, etc.,,.3lb max per side). They’re not meant to be loaded with heavy stuff or larger “anything cages”, but it’s still extra storage. Rear CoversNot really a performance feature, but these rear cover plates hide the trussed lower sections from accumulating crud. But they also hide the '
