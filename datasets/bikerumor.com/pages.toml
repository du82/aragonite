["https://bikerumor.com/camp-and-go-slows-new-horned-owl-bar-tape-is-a-real-hoot"]
title = "Camp And Go Slow's New Horned Owl Bar Tape is a Real Hoot! - Bikerumor"
description = "Ron Frazelle is the Cycling Lifestyle Editor for Bikerumor, he has been writing about bicycles and the cycling way of life for 7+ years. Prior to Bikerumor, he worked in the bicycle industry, living and breathing bicycles since 1995. He is based in Anaheim, California, Frazelle is an avid cyclist of all disciplines, camper, father to 6 children, husband, musician and self-proclaimed retro-grouch."
full_description = 'Home > Clothing-Gear-Tools Camp And Go Slow’s New Horned Owl Bar Tape is a Real Hoot! Written by Ron Frazelle Feb 25, 2025 9:47 a.m. ET (Photos / Camp and Go Slow) Click to share on Facebook (Opens in new window)Click to email a link to a friend (Opens in new window) Support us! Bikerumor may earn a small commission from affiliate links in this article. Learn More Who’s got new bar tape? Camp and Go Slow does, that’s who. This time around, the new bar tape pays homage to the Great Horned Owl, also known as the Hoot Owl or Bubo Virginianus. The new Horned Owl tape follows suit with the other handsome, versatile, and flat-out awesome bar tapes offered by Camp and Go Slow. It uses a similar weave and the same amount of padding as the popular Rattler tapes. (Photos / Camp and Go Slow) Why the Great Horned Owl, you ask? Well, the small team that runs Camp and Go Slow used to have a pair of Great Horned Owls nesting in a tree near their place. After a tragic and devastating wildfire ripped through their area, the owls had found somewhere else to nest. <img data-dominant-color="aa9a8e" data-has-transparency="false" decoding="async" width="1080" height="566" data-id="377670" src="https://bikerumor.com/wp-content/uploads/2025/02/Campandgoslow-New-Owl-Tape-non-drive.webp" alt="Campandgoslow New Owl Tape non-drive" class="lazyload not-transparent wp-image-377670" style="--dominant-color: #aa9a8e; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Campandgoslow-New-Owl-Tape-non-drive.webp 1080w, https://bikerumor.com/wp-content/uploads/2025/02/Campandgoslow-New-Owl-Tape-non-drive-297x156.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Campandgoslow-New-Owl-Tape-non-drive-120x63.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Campandgoslow-New-Owl-Tape-non-drive-768x402.webp 768w" sizes="(max-width: 1080px) 100vw, 1080px" /> <img data-dominant-color="b59c8a" data-has-transparency="false" decoding="async" width="1080" height="566" data-id="377671" src="https://bikerumor.com/wp-content/uploads/2025/02/Campandgoslow-New-Owl-Tape-stargazer.webp" alt="Campandgoslow New Owl Tape stargazer" class="lazyload not-transparent wp-image-377671" style="--dominant-color: #b59c8a; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Campandgoslow-New-Owl-Tape-stargazer.webp 1080w, https://bikerumor.com/wp-content/uploads/2025/02/Campandgoslow-New-Owl-Tape-stargazer-297x156.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Campandgoslow-New-Owl-Tape-stargazer-120x63.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Campandgoslow-New-Owl-Tape-stargazer-768x402.webp 768w" sizes="(max-width: 1080px) 100vw, 1080px" /> After four years, the owls returned to nest nearby. Casey decided that he would pay homage to these magnificent creatures, one of the best ways he knows how… with its very own signature bar tape. Now, joining the team with the Western and Eastern Rattlers, and the Brown Trout, this new tape fits right in! <img data-dominant-color="726359" data-has-transparency="false" decoding="async" width="1080" height="566" src="https://bikerumor.com/wp-content/uploads/2025/02/Campandgoslow-New-Owl-Tape-Four-Tapes.webp" alt="Campandgoslow New Owl Tape Four Tapes" class="lazyload not-transparent wp-image-377668" style="--dominant-color: #726359; object-fit:full;width:1180px;height:auto" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Campandgoslow-New-Owl-Tape-Four-Tapes.webp 1080w, https://bikerumor.com/wp-content/uploads/2025/02/Campandgoslow-New-Owl-Tape-Four-Tapes-297x156.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Campandgoslow-New-Owl-Tape-Four-Tapes-120x63.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Campandgoslow-New-Owl-Tape-Four-Tapes-768x402.webp 768w" sizes="(max-width: 1080px) 100vw, 1080px" />Here’s the full collection of tapes. (Left to Right) Horned Owl, Western Rattler, Brown Trout, and Eastern Rattler Camp and Go Slow’s Horned Owl Tape Retail & Detail Retail: $44 3300mm rolls 1.5mm foam backing Made in Taiwan No plugs or finishing tape and comes in a MUSA ripstop bag. There’s so much good stuff on the Camp and Go Slow site, check it out below. Also if you get a chance, check out Casey’s other passion at Great Basin Pottery. CampAndGoSlow.com Topics Clothing-Gear-Tools News Camp and Go Slow'
