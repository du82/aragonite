["https://bikerumor.com/bmc-kaius-01-recall"]
title = "BMC Issues Recall for All Kaius 01 Bikes and Framesets - Bikerumor"
description = """
Jordan Villella is the Racing Tech Editor for BikeRumor.com, specializing in cross-country mountain, gravel, road, and cyclocross. He has written about bicycles and bike culture for over fifteen years with no signs of stopping.
Before BikeRumor, Jordan raced professionally and wrote for MTBR and the now-defunct Dirt Rag Magazine. He’s covered the World Championships, World Cups, and everything in between — where he loves to report what people are riding.
Based in Pittsburgh, PA, Jordan coaches cyclists of all abilities with Cycle-Smart; you can find him racing bikes around North America and adventuring with his family.
For an inside look at his review rides follow him on Strava."""
full_description = 'Home > Other Fun Stuff > Advocacy & Industry News > Recalls BMC Issues Recall for All Kaius 01 Bikes and Framesets Written by Jordan Villella Feb 27, 2025 11:31 a.m. ET Click to share on Facebook (Opens in new window)Click to email a link to a friend (Opens in new window) 2 Comments Support us! Bikerumor may earn a small commission from affiliate links in this article. Learn More BMC Switzerland calls a hard stop on the Kaius 01, recalling all models and framesets over concerns with the fork’s steerer tube. The Swiss brand cites several cases where specific steerer tubes have separated under “heavy-duty riding conditions.” While the issue seems limited, BMC is erring on the side of caution and replacing affected forks with a more robust version. What BMC Kaius 01 Owners Need to Know BMC is asking all Kaius 01 owners to stop riding immediately and take their bikes to a BMC retailer for inspection. If a fork replacement is needed, the retailer will install a new one at no cost to the rider. How dealers will determine if a fork needs replacing is still unclear. However, what is clear is that BMC is getting ahead of this issue before an official CPSC (Consumer Product Safety Commission) announcement—not the first time the brand has had to issue a recall related to steerer tubes, like the stop ride notice for the Teammachine SLR01 DISC bicycles and framesets. <img data-dominant-color="d7d9da" data-has-transparency="false" decoding="async" width="800" height="440" data-id="304296" src="https://bikerumor.com/wp-content/uploads/2022/09/BMC-Kaius-aero-carbon-gravel-race-bike_Kaius-01-ONE-800x440.jpg" alt="BMC Kaius aero carbon gravel race bike, ONE" class="lazyload not-transparent wp-image-304296" style="--dominant-color: #d7d9da; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2022/09/BMC-Kaius-aero-carbon-gravel-race-bike_Kaius-01-ONE-800x440.jpg 800w, https://bikerumor.com/wp-content/uploads/2022/09/BMC-Kaius-aero-carbon-gravel-race-bike_Kaius-01-ONE-297x163.jpg 297w, https://bikerumor.com/wp-content/uploads/2022/09/BMC-Kaius-aero-carbon-gravel-race-bike_Kaius-01-ONE-120x66.jpg 120w, https://bikerumor.com/wp-content/uploads/2022/09/BMC-Kaius-aero-carbon-gravel-race-bike_Kaius-01-ONE-768x422.jpg 768w, https://bikerumor.com/wp-content/uploads/2022/09/BMC-Kaius-aero-carbon-gravel-race-bike_Kaius-01-ONE-1536x845.jpg 1536w, https://bikerumor.com/wp-content/uploads/2022/09/BMC-Kaius-aero-carbon-gravel-race-bike_Kaius-01-ONE.jpg 2000w" sizes="(max-width: 800px) 100vw, 800px" /> <img data-dominant-color="cbd2d3" data-has-transparency="false" decoding="async" width="800" height="440" data-id="304295" src="https://bikerumor.com/wp-content/uploads/2022/09/BMC-Kaius-aero-carbon-gravel-race-bike_Kaius-01-TWO-800x440.jpg" alt="BMC Kaius aero carbon gravel race bike, TWO" class="lazyload not-transparent wp-image-304295" style="--dominant-color: #cbd2d3; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2022/09/BMC-Kaius-aero-carbon-gravel-race-bike_Kaius-01-TWO-800x440.jpg 800w, https://bikerumor.com/wp-content/uploads/2022/09/BMC-Kaius-aero-carbon-gravel-race-bike_Kaius-01-TWO-297x163.jpg 297w, https://bikerumor.com/wp-content/uploads/2022/09/BMC-Kaius-aero-carbon-gravel-race-bike_Kaius-01-TWO-120x66.jpg 120w, https://bikerumor.com/wp-content/uploads/2022/09/BMC-Kaius-aero-carbon-gravel-race-bike_Kaius-01-TWO-768x422.jpg 768w, https://bikerumor.com/wp-content/uploads/2022/09/BMC-Kaius-aero-carbon-gravel-race-bike_Kaius-01-TWO-1536x845.jpg 1536w, https://bikerumor.com/wp-content/uploads/2022/09/BMC-Kaius-aero-carbon-gravel-race-bike_Kaius-01-TWO.jpg 2000w" sizes="(max-width: 800px) 100vw, 800px" /> <img data-dominant-color="d3d1cc" data-has-transparency="false" decoding="async" width="800" height="440" data-id="304294" src="https://bikerumor.com/wp-content/uploads/2022/09/BMC-Kaius-aero-carbon-gravel-race-bike_Kaius-01-THREE-800x440.jpg" alt="BMC Kaius aero carbon gravel race bike, THREE" class="lazyload not-transparent wp-image-304294" style="--dominant-color: #d3d1cc; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2022/09/BMC-Kaius-aero-carbon-gravel-race-bike_Kaius-01-THREE-800x440.jpg 800w, https://bikerumor.com/wp-content/uploads/2022/09/BMC-Kaius-aero-carbon-gravel-race-bike_Kaius-01-THREE-297x163.jpg 297w, https://bikerumor.com/wp-content/uploads/2022/09/BMC-Kaius-aero-carbon-gravel-race-bike_Kaius-01-THREE-120x66.jpg 120w, https://bikerumor.com/wp-content/uploads/2022/09/BMC-Kaius-aero-carbon-gravel-race-bike_Kaius-01-THREE-768x422.jpg 768w, https://bikerumor.com/wp-content/uploads/2022/09/BMC-Kaius-aero-carbon-gravel-race-bike_Kaius-01-THREE-1536x845.jpg 1536w, https://bikerumor.com/wp-content/uploads/2022/09/BMC-Kaius-aero-carbon-gravel-race-bike_Kaius-01-THREE.jpg 2000w" sizes="(max-width: 800px) 100vw, 800px" /> Which Bikes Are Affected? If you own any of the following 2023, 2024, or even 2026 Kaius 01 models, your bike is subject to the recall: 2023 BMC Kaius 01 ONE, TWO, THREE 2024 BMC Kaius 01 LTD, ONE, TWO, THREE 2026 BMC Kaius 01 THREE, FRS <img data-dominant-color="44484a" data-has-transparency="false" decoding="async" src="https://bikerumor.com/wp-content/uploads/2022/09/BMC-Kaius-aero-carbon-gravel-race-bike_integrated-Aerocore-bottles-jpg.webp" alt="BMC Kaius aero carbon gravel race bike, Aerocore bottles" class="lazyload not-transparent wp-image-304299" style="--dominant-color: #44484a; object-fit:full"/> What to Do Next BMC is working to replace affected forks as quickly as possible and apologizes for the inconvenience. If you have any questions, you can contact BMC through their website or by phone: U.S. Support: (888) 262-7755 International: +41 32 654 14 54 If you’re riding a BMC Kaius 01, it’s best to get it checked as soon as possible. We’ll update this story as more details come in. Topics News Recalls BMC recall'
