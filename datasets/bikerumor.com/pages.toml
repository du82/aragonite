["https://bikerumor.com/cyclingceramic-oversized-pro-race-road-cages-upgrade-derailleurs-with-french-speed"]
title = "CyclingCeramic Oversized Pro & Race Road Cages Upgrade Derailleurs with French Speed - Bikerumor"
description = """
Cory Benson is the EU Tech Editor of Bikerumor.com.
Cory has been writing about mountain bikes, enduro, cyclocross, all-road, gravel bikes & bikepacking for over 25 years, even before the industry created some of these names. Prior to Bikerumor, Cory was a practicing Architect specializing in environmental sustainability, has designed bike shops & bike components, and worked as a bike shop mechanic.
Based in the Czech Republic for 15+ years, he is a technical mountain biker, adventurous gravel rider, and short & medium-haul bikepacker. Cory travels extensively across Europe riding bikes, meeting with key European product developers, industry experts & tastemakers for an in-depth review of what’s new, and what’s coming next."""
full_description = 'Home > Other Fun Stuff > Gadgets & Hacks CyclingCeramic Oversized Pro & Race Road Cages Upgrade Derailleurs with French Speed Written by Cory Benson Feb 25, 2025 6:10 p.m. ET Click to share on Facebook (Opens in new window)Click to email a link to a friend (Opens in new window) Support us! Bikerumor may earn a small commission from affiliate links in this article. Learn More CyclingCeramic completely revamps their oversized Pro & Race derailleur cage upgrades with a stiffer alloy & carbon composite construction, a new solid pulley option, and the same fast-spinning ceramic bearings to eke out extra speed and performance from your existing road bike. The all-new OSPW cages are still entirely made in Europe, still quite a lightweight upgrade for your bike, and still cost a lot less than the other oversized competition… CyclingCeramic OSPW Pro & Race road derailleur cages (Photos/CyclingCeramic) While the open design of CyclingCeramic’s carbon derailleur cages and thin alloy pulleys made them stand out from other oversized cage upgrades on the market, the French ceramic bearing specialist went back to the drawing board for their latest series of Road Cages to boost performance. Now, two new CyclingCeramic OSPW Pro & OSPW Race road cages feature the all-new aluminum & carbon construction, with a design that is less visually distinct, but promises more precise shifting and less drag… while still balancing a more accessible price point. What’s new? <img data-dominant-color="3c4044" data-has-transparency="false" decoding="async" width="1600" height="1600" src="https://bikerumor.com/wp-content/uploads/2025/02/CyclingCeramic-OSPW-Pro-Race-upgrade-road-derailleur-cages_up-close.webp" alt="CyclingCeramic OSPW Pro &amp; Race ceramic bearing oversized pulley upgrade road derailleur cages, up close" class="lazyload not-transparent wp-image-377762" style="--dominant-color: #3c4044; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/CyclingCeramic-OSPW-Pro-Race-upgrade-road-derailleur-cages_up-close.webp 1600w, https://bikerumor.com/wp-content/uploads/2025/02/CyclingCeramic-OSPW-Pro-Race-upgrade-road-derailleur-cages_up-close-297x297.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/CyclingCeramic-OSPW-Pro-Race-upgrade-road-derailleur-cages_up-close-1536x1536.webp 1536w, https://bikerumor.com/wp-content/uploads/2025/02/CyclingCeramic-OSPW-Pro-Race-upgrade-road-derailleur-cages_up-close-120x120.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/CyclingCeramic-OSPW-Pro-Race-upgrade-road-derailleur-cages_up-close-768x768.webp 768w" sizes="(max-width: 1600px) 100vw, 1600px" /> The new faceted design now features an angular CNC-machined aluminum outer cage plate that bolts to a UD carbon inner plate to significantly increase cage stiffness for improved shift performance while remaining lightweight. The new cages are around 40g heavier than the open carbon version before, but with significantly better shifting. Then, a new tooth design for both open Race and solid Pro pulleys combines with the stiffer cage to improve shifting precision to match the level of the top-tier factory perfect shifts, but with much less drivetrain friction. CyclingCeramic claims more than 25% friction reduction over their already fast previous design. <img data-dominant-color="705d48" data-has-transparency="false" decoding="async" width="1200" height="800" src="https://bikerumor.com/wp-content/uploads/2025/02/CyclingCeramic-OSPW-Pro-Race-upgrade-road-derailleur-cages_solid-pulleys.webp" alt="CyclingCeramic OSPW Pro &amp; Race ceramic bearing oversized pulley upgrade road derailleur cages, solid aero pulley" class="lazyload not-transparent wp-image-377763" style="--dominant-color: #705d48; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/CyclingCeramic-OSPW-Pro-Race-upgrade-road-derailleur-cages_solid-pulleys.webp 1200w, https://bikerumor.com/wp-content/uploads/2025/02/CyclingCeramic-OSPW-Pro-Race-upgrade-road-derailleur-cages_solid-pulleys-297x198.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/CyclingCeramic-OSPW-Pro-Race-upgrade-road-derailleur-cages_solid-pulleys-120x80.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/CyclingCeramic-OSPW-Pro-Race-upgrade-road-derailleur-cages_solid-pulleys-768x512.webp 768w, https://bikerumor.com/wp-content/uploads/2025/02/CyclingCeramic-OSPW-Pro-Race-upgrade-road-derailleur-cages_solid-pulleys-800x533.webp 800w, https://bikerumor.com/wp-content/uploads/2025/02/CyclingCeramic-OSPW-Pro-Race-upgrade-road-derailleur-cages_solid-pulleys-720x480.webp 720w" sizes="(max-width: 1200px) 100vw, 1200px" /> The solid pulley design was a direct response from both pro riders and regular customers, both looking for a ‘more aero’ setup. CyclingCeramic says they did the CFD analysis, and the solid pulleys are marginally faster, but it’s more about providing improved stiffness for the strongest sprinters, a faster look, plus pulleys that are easier to keep clean. These ‘aero’ pulleys also promise big performance gains off-road, so expect to see more versions available in the coming year. Tech details <img data-dominant-color="d4d6d6" data-has-transparency="false" decoding="async" width="1200" height="800" src="https://bikerumor.com/wp-content/uploads/2025/02/CyclingCeramic-OSPW-Pro-Race-upgrade-road-derailleur-cages_exploded-view.webp" alt="CyclingCeramic OSPW Pro &amp; Race ceramic bearing oversized pulley upgrade road derailleur cages, exploded view" class="lazyload not-transparent wp-image-377764" style="--dominant-color: #d4d6d6; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/CyclingCeramic-OSPW-Pro-Race-upgrade-road-derailleur-cages_exploded-view.webp 1200w, https://bikerumor.com/wp-content/uploads/2025/02/CyclingCeramic-OSPW-Pro-Race-upgrade-road-derailleur-cages_exploded-view-297x198.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/CyclingCeramic-OSPW-Pro-Race-upgrade-road-derailleur-cages_exploded-view-120x80.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/CyclingCeramic-OSPW-Pro-Race-upgrade-road-derailleur-cages_exploded-view-768x512.webp 768w, https://bikerumor.com/wp-content/uploads/2025/02/CyclingCeramic-OSPW-Pro-Race-upgrade-road-derailleur-cages_exploded-view-800x533.webp 800w, https://bikerumor.com/wp-content/uploads/2025/02/CyclingCeramic-OSPW-Pro-Race-upgrade-road-derailleur-cages_exploded-view-720x480.webp 720w" sizes="(max-width: 1200px) 100vw, 1200px" /> Grade 3 ceramic balls in the handmade bearings – black silicon nitride (Si3N4) balls manufactured in Germany 14T upper & 19T lower pulleys pulleys available in ‘aero’ solid Pro or light 4-spoke Race versions CNC-machined alloy cages, UD carbon cages, and machined alloy pulleys made in France all final assembly handmade in France 2-position cage spring tension settings claimed weight: 115g Pro or 101g Race CyclingCeramic OSPW Road Cages – Pricing, options availability <img data-dominant-color="c1bfc2" data-has-transparency="false" decoding="async" width="2560" height="960" src="https://bikerumor.com/wp-content/uploads/2025/02/CyclingCeramic-OSPW-Pro-Race-upgrade-road-derailleur-cages_options-Ride-It-scaled.webp" alt="CyclingCeramic OSPW Pro &amp; Race ceramic bearing oversized pulley upgrade road derailleur cages, options" class="lazyload not-transparent wp-image-377765" style="--dominant-color: #c1bfc2; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/CyclingCeramic-OSPW-Pro-Race-upgrade-road-derailleur-cages_options-Ride-It-scaled.webp 2560w, https://bikerumor.com/wp-content/uploads/2025/02/CyclingCeramic-OSPW-Pro-Race-upgrade-road-derailleur-cages_options-Ride-It-297x111.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/CyclingCeramic-OSPW-Pro-Race-upgrade-road-derailleur-cages_options-Ride-It-1536x576.webp 1536w, https://bikerumor.com/wp-content/uploads/2025/02/CyclingCeramic-OSPW-Pro-Race-upgrade-road-derailleur-cages_options-Ride-It-120x45.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/CyclingCeramic-OSPW-Pro-Race-upgrade-road-derailleur-cages_options-Ride-It-768x288.webp 768w, https://bikerumor.com/wp-content/uploads/2025/02/CyclingCeramic-OSPW-Pro-Race-upgrade-road-derailleur-cages_options-Ride-It-2048x768.webp 2048w" sizes="(max-width: 2560px) 100vw, 2560px" /> The new CyclingCeramic OSPW road cages all share the same black anodized alloy & UD carbon cage construction. Then you can pick from four anodized pulley colors for the open pulley Race cages – black, red, gold, or blue. Or you can get the solid pulley Pro cage in all-black. Both variants sell for the same $289 / 289€ (almost half the price of the latest similar offerings from CeramicSpeed or Kogel), and are available for either Shimano 11/12-speed or SRAM AXS 12sp. <img data-dominant-color="974f4a" data-has-transparency="false" decoding="async" width="2000" height="1200" src="https://bikerumor.com/wp-content/uploads/2025/02/CyclingCeramic-OSPW-Pro-Race-upgrade-road-derailleur-cages_Arkea-team-bike.webp" alt="CyclingCeramic OSPW Pro &amp; Race ceramic bearing oversized pulley upgrade road derailleur cages, Arkea team Bianchi bike" class="lazyload not-transparent wp-image-377766" style="--dominant-color: #974f4a; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/CyclingCeramic-OSPW-Pro-Race-upgrade-road-derailleur-cages_Arkea-team-bike.webp 2000w, https://bikerumor.com/wp-content/uploads/2025/02/CyclingCeramic-OSPW-Pro-Race-upgrade-road-derailleur-cages_Arkea-team-bike-297x178.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/CyclingCeramic-OSPW-Pro-Race-upgrade-road-derailleur-cages_Arkea-team-bike-1536x922.webp 1536w, https://bikerumor.com/wp-content/uploads/2025/02/CyclingCeramic-OSPW-Pro-Race-upgrade-road-derailleur-cages_Arkea-team-bike-120x72.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/CyclingCeramic-OSPW-Pro-Race-upgrade-road-derailleur-cages_Arkea-team-bike-768x461.webp 768w" sizes="(max-width: 2000px) 100vw, 2000px" /> CyclingCeramic recently hit the World Tour as a supplier for Arkea, and we’ll start to see their new Pro Road Cages rollout on the team’s Bianchi race bikes as the racing season gets fully underway. CyclingCeramic.com Topics Gadgets & Hacks News Road Bike'
