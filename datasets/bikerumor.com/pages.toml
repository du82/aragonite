title = "AASQ #132: How do I make my e-bike faster? - Bikerumor"
description = """
Tyler Benedict is the Founder of Bikerumor.com, where he’s been writing about the latest bikes, components, and cycling technology for almost two decades. Prior to that, Tyler launched and built multiple sports nutrition brands and consumer goods companies, mostly as an excuse to travel and ride in new places.
Based in North Carolina, Tyler also loves the Vanlife & family adventure travel and is always on the lookout for the next shiny new part and off-grid adventure."""
full_description = 'Home > AASQ AASQ #132: How do I make my e-bike faster? Written by Tyler Benedict Aug 27, 2021 6:25 p.m. ET Click to share on Facebook (Opens in new window)Click to email a link to a friend (Opens in new window) 7 Comments Support us! Bikerumor may earn a small commission from affiliate links in this article. Learn More Want to make your e-bike faster? Maybe by swapping out the drive system from a 20mph-max Class I motor to a 28mph-max Class III motor? Or fiddling with the settings or other components? Well, hold your horses, because we’re about to explain why it’s a lot more complicated than just switching parts. For this article, we spoke with the experts at Bosch and Shimano (as well as the product manager for Marin Bikes) for answers, but it’s highly likely that the info here translates across Brose, Fazua, Yamaha, and more. As for hot-rodding your Specialized e-bike? You can probably forget it since they use completely customized shapes and software on their e-bikes. Can I upgrade the motor from Class 1 to Class 3? In a perfect world, you could simply upgrade your motor to a more powerful one. And then add a bigger, more powerful battery pack to maintain or even increase ride times. After all, even Ford is offering electric crate motors. But the world’s not perfect, and swapping e-bike motors isn’t as straightforward as you may think. <img data-dominant-color="6a5a4f" data-has-transparency="false" style="--dominant-color: #6a5a4f;" decoding="async" class="lazyload not-transparent size-full wp-image-267915" src="https://bikerumor.com/wp-content/uploads/2021/08/yuba-spicy-curry-motor-mount.jpg" alt="e-bike motor mount on a yuba spicy curry e-cargo bike" width="1400" height="1050" srcset="https://bikerumor.com/wp-content/uploads/2021/08/yuba-spicy-curry-motor-mount.jpg 1400w, https://bikerumor.com/wp-content/uploads/2021/08/yuba-spicy-curry-motor-mount-297x223.jpg 297w, https://bikerumor.com/wp-content/uploads/2021/08/yuba-spicy-curry-motor-mount-800x600.jpg 800w, https://bikerumor.com/wp-content/uploads/2021/08/yuba-spicy-curry-motor-mount-120x90.jpg 120w, https://bikerumor.com/wp-content/uploads/2021/08/yuba-spicy-curry-motor-mount-768x576.jpg 768w" sizes="(max-width: 1400px) 100vw, 1400px" />The motor mount on my Yuba Spicy Curry is purpose-built for its Class 1 Bosch Performance Line CX motor. Basically, here’s how the e-bike industry goes, according to Bosch: A bike brand orders a Bosch motor. Bosch sets the operating system based on the speed class ordered. The bike brand receives the motor, then updates that firmware with parameters like wheel size, cassette and chainring (aka Gear Ratios), and any other model-specific details that might affect performance. These settings are what dictate the assist levels’ performance and the actual top speed of the bike. <img data-dominant-color="726561" data-has-transparency="false" style="--dominant-color: #726561;" decoding="async" class="lazyload not-transparent aligncenter size-full wp-image-269623" src="https://bikerumor.com/wp-content/uploads/2021/08/how-to-upgrade-e-bike-motors-to-make-them-faster-2.jpg" alt="shimano steps e-MTB motor" width="1600" height="1200" srcset="https://bikerumor.com/wp-content/uploads/2021/08/how-to-upgrade-e-bike-motors-to-make-them-faster-2.jpg 1600w, https://bikerumor.com/wp-content/uploads/2021/08/how-to-upgrade-e-bike-motors-to-make-them-faster-2-297x223.jpg 297w, https://bikerumor.com/wp-content/uploads/2021/08/how-to-upgrade-e-bike-motors-to-make-them-faster-2-800x600.jpg 800w, https://bikerumor.com/wp-content/uploads/2021/08/how-to-upgrade-e-bike-motors-to-make-them-faster-2-120x90.jpg 120w, https://bikerumor.com/wp-content/uploads/2021/08/how-to-upgrade-e-bike-motors-to-make-them-faster-2-768x576.jpg 768w, https://bikerumor.com/wp-content/uploads/2021/08/how-to-upgrade-e-bike-motors-to-make-them-faster-2-1536x1152.jpg 1536w" sizes="(max-width: 1600px) 100vw, 1600px" /> It’s sort of the same for Shimano: “Drive units and batteries are indeed available for sale to consumers through bike shops in North America,” says Nick Murdick, Shimano Mountain Bike Product Manager. “There are regulations that prevent aftermarket drive unit sales in many other parts of the world though.” “Drive units need to be programmed for the bike they are going on, and retailers are not legally allowed to do it themselves, but we have a process in North America where our office can work with the bike shop to get it done.” “With that being said, it’s not so easy to say that someone could upgrade from E8000 to EP8 or from E7000 to E8000. Some frames can only fit the drive units they were originally spec’d with, while others can use any of the modern ones. The mounting bolts are all in the same location, but the silhouettes are different.” <img data-dominant-color="6c6160" data-has-transparency="false" style="--dominant-color: #6c6160;" decoding="async" class="lazyload not-transparent size-full wp-image-269622" src="https://bikerumor.com/wp-content/uploads/2021/08/how-to-upgrade-e-bike-motors-to-make-them-faster-1.jpg" alt="shimano e-bike motor with custom casing on a Marin eMTB" width="1600" height="1200" srcset="https://bikerumor.com/wp-content/uploads/2021/08/how-to-upgrade-e-bike-motors-to-make-them-faster-1.jpg 1600w, https://bikerumor.com/wp-content/uploads/2021/08/how-to-upgrade-e-bike-motors-to-make-them-faster-1-297x223.jpg 297w, https://bikerumor.com/wp-content/uploads/2021/08/how-to-upgrade-e-bike-motors-to-make-them-faster-1-800x600.jpg 800w, https://bikerumor.com/wp-content/uploads/2021/08/how-to-upgrade-e-bike-motors-to-make-them-faster-1-120x90.jpg 120w, https://bikerumor.com/wp-content/uploads/2021/08/how-to-upgrade-e-bike-motors-to-make-them-faster-1-768x576.jpg 768w, https://bikerumor.com/wp-content/uploads/2021/08/how-to-upgrade-e-bike-motors-to-make-them-faster-1-1536x1152.jpg 1536w" sizes="(max-width: 1600px) 100vw, 1600px" />Custom frame parts, like bash guards or covers, can make it harder to swap motors even if the bolt patterns are the same. “The frame or cosmetic covers may interfere with some drive units, particularly if there was a very tight fit to the original drive unit. Sometimes the new drive unit will fit but leave a gap, but sometimes it just won’t fit. There isn’t really any go to information source to find out if a drive unit will fit an existing frame. The bike brand may know, but in many cases, no one has ever checked to see if a new drive unit will fit an old frame.” And here’s Marin’s take: “The Marin Alpine Trail E (which gets E7000, E8000, and EP8 spec, depending on the model) will all fit on the same motor mount, but you’d have to have it reprogrammed,” says product manager Matthew Cipes. “And since the bike is built to handle the higher powered motors, it’s no problem upgrading, but you’re only gaining more torque, not more speed…they’re all tuned and programmed to be Class 1 bikes.” “While you might be able to come across a Class 3 EP8 motor, and it might fit, Marin wouldn’t approve such an upgrade. And here’s why: Because we design our bikes to handle the torque and power of a Class 1 motor, so we can’t guarantee that it would be safe. Perhaps the new motor would torque the frame too much. Or it could overpower the brakes.” What about changing the chainring size on an e-bike? <img decoding="async" class="lazyload wp-image-224538 size-full" src="https://bikerumor.com/wp-content/uploads/2019/10/yuba-spicy-curry-e-cargo-bike-review-specs-09.jpg" alt="stock spicy curry motor and chainring" width="1200" height="800" srcset="https://bikerumor.com/wp-content/uploads/2019/10/yuba-spicy-curry-e-cargo-bike-review-specs-09.jpg 1200w, https://bikerumor.com/wp-content/uploads/2019/10/yuba-spicy-curry-e-cargo-bike-review-specs-09-120x80.jpg 120w, https://bikerumor.com/wp-content/uploads/2019/10/yuba-spicy-curry-e-cargo-bike-review-specs-09-297x198.jpg 297w, https://bikerumor.com/wp-content/uploads/2019/10/yuba-spicy-curry-e-cargo-bike-review-specs-09-768x512.jpg 768w, https://bikerumor.com/wp-content/uploads/2019/10/yuba-spicy-curry-e-cargo-bike-review-specs-09-800x533.jpg 800w, https://bikerumor.com/wp-content/uploads/2019/10/yuba-spicy-curry-e-cargo-bike-review-specs-09-696x464.jpg 696w, https://bikerumor.com/wp-content/uploads/2019/10/yuba-spicy-curry-e-cargo-bike-review-specs-09-1068x712.jpg 1068w, https://bikerumor.com/wp-content/uploads/2019/10/yuba-spicy-curry-e-cargo-bike-review-specs-09-630x420.jpg 630w" sizes="(max-width: 1200px) 100vw, 1200px" />This is the stock 20-tooth chainring that came on our Yuba Spicy Curry. We did this, and it didn’t work out well. But not for the reasons you might think. First of all, the speed limit is dictated by the wheel speed sensors, and it’s pretty hard to game that on modern bikes. And remember, the amount of assist is pre-set by the bike brand via firmware and software based on the stock drivetrain configuration (i.e. the gears that come on your bike). In our case, changing chainring size changed how the assist feels and performs, and not in a good way in our experience. Our Yuba Spicy Curry had a worn-out 20-tooth chainring, but because of supply shortages, the only replacement we could get was a smaller 18-tooth chainring: <img data-dominant-color="858282" data-has-transparency="false" style="--dominant-color: #858282;" decoding="async" class="lazyload not-transparent wp-image-269625 size-full" src="https://bikerumor.com/wp-content/uploads/2021/08/how-to-upgrade-e-bike-motors-to-make-them-faster-5.jpg" alt="smaller undersized chainring on an e-bike" width="1600" height="1200" srcset="https://bikerumor.com/wp-content/uploads/2021/08/how-to-upgrade-e-bike-motors-to-make-them-faster-5.jpg 1600w, https://bikerumor.com/wp-content/uploads/2021/08/how-to-upgrade-e-bike-motors-to-make-them-faster-5-297x223.jpg 297w, https://bikerumor.com/wp-content/uploads/2021/08/how-to-upgrade-e-bike-motors-to-make-them-faster-5-800x600.jpg 800w, https://bikerumor.com/wp-content/uploads/2021/08/how-to-upgrade-e-bike-motors-to-make-them-faster-5-120x90.jpg 120w, https://bikerumor.com/wp-content/uploads/2021/08/how-to-upgrade-e-bike-motors-to-make-them-faster-5-768x576.jpg 768w, https://bikerumor.com/wp-content/uploads/2021/08/how-to-upgrade-e-bike-motors-to-make-them-faster-5-1536x1152.jpg 1536w" sizes="(max-width: 1600px) 100vw, 1600px" />This is not the stock chainring…it has 18 teeth versus 20. My bike now feels underpowered, with the assist levels somewhat erratic. Sometimes it feels slower, but then kicks in like it should. It’s random, though thankfully will maintain a steady-if-inaccurate output for long stretches of time. Presumably, putting a larger chainring on there would have a similar effect because either way you’re changing the strain on the system, which is how the drive unit determines your effort level to determine its assist output. So, the short answer is it’ll change things, but probably not in a good way, and it won’t change the top speed of your bike. You could change your cassette if you needed easier gearing, and that shouldn’t mess with the output because it’s not directly attached to the drive unit’s strain gauges. But that won’t change your top speed either. Will changing my wheel size make my e-bike faster? <img data-dominant-color="6e7277" data-has-transparency="false" style="--dominant-color: #6e7277;" decoding="async" class="lazyload not-transparent aligncenter size-full wp-image-269641" src="https://bikerumor.com/wp-content/uploads/2021/08/how-to-upgrade-e-bike-motors-to-make-them-faster-13.jpg" alt="e-bike wheel speed sensor is how it determines your speed" width="1400" height="1050" srcset="https://bikerumor.com/wp-content/uploads/2021/08/how-to-upgrade-e-bike-motors-to-make-them-faster-13.jpg 1400w, https://bikerumor.com/wp-content/uploads/2021/08/how-to-upgrade-e-bike-motors-to-make-them-faster-13-297x223.jpg 297w, https://bikerumor.com/wp-content/uploads/2021/08/how-to-upgrade-e-bike-motors-to-make-them-faster-13-800x600.jpg 800w, https://bikerumor.com/wp-content/uploads/2021/08/how-to-upgrade-e-bike-motors-to-make-them-faster-13-120x90.jpg 120w, https://bikerumor.com/wp-content/uploads/2021/08/how-to-upgrade-e-bike-motors-to-make-them-faster-13-768x576.jpg 768w" sizes="(max-width: 1400px) 100vw, 1400px" /> Technically, yes. Since the speed sensor uses the rear wheel’s rotation to determine speed based on the wheel and tire size parameters from the bike brand, then increasing the diameter of your wheel will make your e-bike faster for a given amount of motor output. But…unless your bike comes with, say, a 26″ wheel but magically has room for a 29er wheel, then changing your wheel size is not practical…or likely possible. Bikes are purpose-built for a particular wheel size and are not generally able to accept a larger wheel. You could put a smaller wheel in there, though. Which might improve your acceleration (and cause your pedals to hit the ground), but that would only be good for very, very short drag races… because acceleration may improve, but your top end speed would be lower. Couldn’t you just move the sensor? Moving the wheel speed sensor and magnet further in or out won’t make any difference because they’re still going to pass by each other at the same rate. The wheel magnet might be moving faster, but it’s not going to go past the sensor any more or less. Now, we’ve heard, but haven’t tried and certainly don’t condone, and even by reading this you agree that you take full responsibility for any consequences or damage caused by doing anything even remotely similar to this, that some folks have relocated that sensor further forward and facing outward, then put a magnet on their cranks, which spin at a lower cadence and therefore trick the drive system into going faster. That said, th Sese people are likely to experience much faster battery drain, less torque, and also void their warranty. <img data-dominant-color="66656a" data-has-transparency="false" style="--dominant-color: #66656a;" decoding="async" class="lazyload not-transparent aligncenter size-full wp-image-269624" src="https://bikerumor.com/wp-content/uploads/2021/08/how-to-upgrade-e-bike-motors-to-make-them-faster-4.jpg" alt="commuter e-bike tires closeup" width="1600" height="1200" srcset="https://bikerumor.com/wp-content/uploads/2021/08/how-to-upgrade-e-bike-motors-to-make-them-faster-4.jpg 1600w, https://bikerumor.com/wp-content/uploads/2021/08/how-to-upgrade-e-bike-motors-to-make-them-faster-4-297x223.jpg 297w, https://bikerumor.com/wp-content/uploads/2021/08/how-to-upgrade-e-bike-motors-to-make-them-faster-4-800x600.jpg 800w, https://bikerumor.com/wp-content/uploads/2021/08/how-to-upgrade-e-bike-motors-to-make-them-faster-4-120x90.jpg 120w, https://bikerumor.com/wp-content/uploads/2021/08/how-to-upgrade-e-bike-motors-to-make-them-faster-4-768x576.jpg 768w, https://bikerumor.com/wp-content/uploads/2021/08/how-to-upgrade-e-bike-motors-to-make-them-faster-4-1536x1152.jpg 1536w" sizes="(max-width'
