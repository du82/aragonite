title = "MyCanyon Turns Custom Canyon Bike Dreams Into Reality - Bikerumor"
description = """
Jordan Villella is the Racing Tech Editor for BikeRumor.com, specializing in cross-country mountain, gravel, road, and cyclocross. He has written about bicycles and bike culture for over fifteen years with no signs of stopping.
Before BikeRumor, Jordan raced professionally and wrote for MTBR and the now-defunct Dirt Rag Magazine. He’s covered the World Championships, World Cups, and everything in between — where he loves to report what people are riding.
Based in Pittsburgh, PA, Jordan coaches cyclists of all abilities with Cycle-Smart; you can find him racing bikes around North America and adventuring with his family.
For an inside look at his review rides follow him on Strava."""
full_description = 'Home > Other Fun Stuff > Advocacy & Industry News > News MyCanyon Turns Custom Canyon Bike Dreams Into Reality Written by Jordan Villella Feb 27, 2025 1:04 p.m. ET Click to share on Facebook (Opens in new window)Click to email a link to a friend (Opens in new window) 1 Comment Support us! Bikerumor may earn a small commission from affiliate links in this article. Learn More Canyon is finally making full custom happen, and it’s not just a color palette swap or a parts bin shuffle. MyCanyon is here, and it’s bringing pro-level personalization, your pick of components, and stunning artwork to your dream build. Kicking off with the Aeroad CFR, this program pairs race-winning performance with jaw-dropping aesthetics (these paint jobs are awesome), including collaborations with world-class artists Felipe Pantone and Elena Salmistraro. (All photos: Canyon) What’s MyCanyon All About? Forget cookie-cutter builds. MyCanyon lets you dial in the details—paint, fit, and spec—so you roll out on an Aeroad CFR that’s uniquely yours. <img data-dominant-color="897075" data-has-transparency="false" decoding="async" width="8715" height="5800" data-id="377843" src="https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-close-up--jpg.webp" alt="" class="lazyload not-transparent wp-image-377843" style="--dominant-color: #897075; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-close-up--jpg.webp 8715w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-close-up--297x198.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-close-up--120x80.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-close-up--768x511.webp 768w" sizes="(max-width: 8715px) 100vw, 8715px" /> <img data-dominant-color="7d878c" data-has-transparency="false" decoding="async" width="1536" height="1025" data-id="377842" src="https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-blkwhit-1536x1025.webp" alt="" class="lazyload not-transparent wp-image-377842" style="--dominant-color: #7d878c; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-blkwhit-1536x1025.webp 1536w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-blkwhit-297x198.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-blkwhit-120x80.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-blkwhit-768x512.webp 768w" sizes="(max-width: 1536px) 100vw, 1536px" /> Aeroad CFR: The Same Frame The Pros Trust – This isn’t a watered-down, consumer-only model. The MyCanyon program starts with Canyon’s flagship Aeroad CFR. Seamless Customization – Canyon’s online configurator keeps things simple but powerful, letting you build your ride without getting lost in an endless parts list. Dialed Fit & Function – Choose your bars, stem length, saddle, wheels, and drivetrain, and even slap your name on the frame for a true one-of-one experience. Artistry Meets Speed – Canyon partnered with Pantone and Salmistraro to design some wild, eye-catching graphics—and they’re exclusive to MyCanyon. Handcrafted Perfection – Each MyCanyon build gets the complete boutique treatment, with hand-painted frames and precision assembly in Canyon’s new Build Lab. <img data-dominant-color="5b574f" data-has-transparency="false" decoding="async" width="2560" height="1706" src="https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-in-design--scaled.webp" alt="Mycanyon Custom Aeroad CFR in design" class="lazyload not-transparent wp-image-377856" style="--dominant-color: #5b574f; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-in-design--scaled.webp 2560w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-in-design--297x198.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-in-design--1536x1024.webp 1536w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-in-design--120x80.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-in-design--768x512.webp 768w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-in-design--2048x1365.webp 2048w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-in-design--800x533.webp 800w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-in-design--720x480.webp 720w" sizes="(max-width: 2560px) 100vw, 2560px" /> Streamlined Customization: Three Key Choices Canyon keeps it clean—no analysis paralysis. Instead, MyCanyon delivers a curated experience across three main areas: <img data-dominant-color="cbcccc" data-has-transparency="false" decoding="async" width="1904" height="1428" src="https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-beatue.webp" alt="Mycanyon Custom Aeroad CFR beatue" class="lazyload not-transparent wp-image-377841" style="--dominant-color: #cbcccc; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-beatue.webp 1904w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-beatue-297x223.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-beatue-1536x1152.webp 1536w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-beatue-120x90.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-beatue-768x576.webp 768w" sizes="(max-width: 1904px) 100vw, 1904px" /> Aesthetics: Rideable Art Three fresh frame design collections push the boundaries of what a custom bike can be: Fabric Collection – Shimmering metallics and shifting pigments bring a futuristic, deep-space energy to the Aeroad. Mano Collection – Hand-painted, one-of-a-kind designs inspired by the cosmos—each frame is 100% unique. Opus Collection – The main event features exclusive designs from Felipe Pantone and Elena Salmistraro. <img data-dominant-color="cdced0" data-has-transparency="false" decoding="async" width="3840" height="2160" src="https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-color-bubble-.png" alt="Mycanyon Custom Aeroad CFR color bubble" class="lazyload not-transparent wp-image-377845" style="--dominant-color: #cdced0; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-color-bubble-.png 3840w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-color-bubble--297x167.png 297w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-color-bubble--1536x864.png 1536w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-color-bubble--120x68.png 120w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-color-bubble--768x432.png 768w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-color-bubble--2048x1152.png 2048w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-color-bubble--1200x675.png 1200w" sizes="(max-width: 3840px) 100vw, 3840px" /> Fit: Pro-Approved Ergonomics Get race-ready with cockpit choices that fine-tune your position. Stems – Multiple length options to nail your reach. Saddles – Selle Italia choices for endurance or aggressive race positioning. <img data-dominant-color="323638" data-has-transparency="false" decoding="async" width="2400" height="1200" src="https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-dark-side-.webp" alt="Mycanyon Custom Aeroad CFR dark side" class="lazyload not-transparent wp-image-377847" style="--dominant-color: #323638; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-dark-side-.webp 2400w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-dark-side--297x149.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-dark-side--1536x768.webp 1536w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-dark-side--120x60.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-dark-side--768x384.webp 768w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-dark-side--2048x1024.webp 2048w" sizes="(max-width: 2400px) 100vw, 2400px" /> Function: Performance-First Spec Pick your dream drivetrain, wheels, and finishing kit: Groupsets: Shimano Dura-Ace Di2 or SRAM RED AXS Wheels: ZIPP 454 NSW with Pirelli P-Zero RS or DT Swiss ARC 1100 with Continental GP5000s Bars & Stems: The award-winning PACE Bar, with dialed-in options for max aero gains. <img data-dominant-color="8d7c67" data-has-transparency="true" decoding="async" width="3840" height="2160" src="https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-Elena-paint-.png" alt="Mycanyon Custom Aeroad CFR Elena paint" class="lazyload has-transparency wp-image-377850" style="--dominant-color: #8d7c67; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-Elena-paint-.png 3840w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-Elena-paint--297x167.png 297w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-Elena-paint--1536x864.png 1536w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-Elena-paint--120x68.png 120w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-Elena-paint--768x432.png 768w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-Elena-paint--2048x1152.png 2048w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-Elena-paint--1200x675.png 1200w" sizes="(max-width: 3840px) 100vw, 3840px" /> Meet the Artists: The Opus Collection MyCanyon goes beyond performance—these are collector-worthy machines designed by two of the most innovative artists today: <img data-dominant-color="beada6" data-has-transparency="false" decoding="async" width="2560" height="1707" src="https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-Panton--scaled.webp" alt="Mycanyon Custom Aeroad CFR Panton" class="lazyload not-transparent wp-image-377865" style="--dominant-color: #beada6; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-Panton--scaled.webp 2560w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-Panton--297x198.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-Panton--1536x1024.webp 1536w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-Panton--120x80.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-Panton--768x512.webp 768w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-Panton--2048x1365.webp 2048w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-Panton--800x533.webp 800w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-Panton--720x480.webp 720w" sizes="(max-width: 2560px) 100vw, 2560px" /> Felipe Pantone – Known for his dynamic, digital-inspired visuals, Pantone’s frame design makes your bike look as fast as it rides. <img data-dominant-color="8c8986" data-has-transparency="true" decoding="async" width="3840" height="2160" src="https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-Elena-1-1.png" alt="Mycanyon Custom Aeroad CFR Elena" class="lazyload has-transparency wp-image-377849" style="--dominant-color: #8c8986; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-Elena-1-1.png 3840w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-Elena-1-1-297x167.png 297w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-Elena-1-1-1536x864.png 1536w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-Elena-1-1-120x68.png 120w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-Elena-1-1-768x432.png 768w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-Elena-1-1-2048x1152.png 2048w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-Elena-1-1-1200x675.png 1200w" sizes="(max-width: 3840px) 100vw, 3840px" /> Elena Salmistraro – A creative force who’s worked with Disney, Nike, and Apple, bringing her bold, kaleidoscopic style to Canyon’s speed machine. <img data-dominant-color="383c3e" data-has-transparency="false" decoding="async" width="2400" height="1200" src="https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-full-dark-.webp" alt="Mycanyon Custom Aeroad CFR full dark" class="lazyload not-transparent wp-image-377854" style="--dominant-color: #383c3e; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-full-dark-.webp 2400w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-full-dark--297x149.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-full-dark--1536x768.webp 1536w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-full-dark--120x60.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-full-dark--768x384.webp 768w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-full-dark--2048x1024.webp 2048w" sizes="(max-width: 2400px) 100vw, 2400px" /> Who’s Riding Them? It’s not just us regular riders getting the MyCanyon treatment. Mathieu van der Poel, Jasper Philipsen, Kasia Niewiadoma, and Chloé Dygert are ready to race on their custom-built Aeroad CFRs this season. <img data-dominant-color="516e7f" data-has-transparency="false" decoding="async" width="2560" height="1706" src="https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-white--scaled.webp" alt="" class="lazyload not-transparent wp-image-377857" style="--dominant-color: #516e7f; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-white--scaled.webp 2560w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-white--297x198.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-white--1536x1024.webp 1536w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-white--120x80.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Mycanyon-Custom-Aeroad-CFR-white--768x512.webp 768w, https://bikerumor.com/wp-content/uploads/2025/02'
