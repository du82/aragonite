title = "Cane Creek Adds Purple Permanently to the Chroma Studio Collection - Bikerumor"
description = """
Zach Overholt is the Editor in Chief of Bikerumor. He has been writing about what’s new in the bicycle world for 12+ years. Prior to that, Zach spent many years in the back of a bicycle shop building and repairing nearly every type of bike, while figuring out how to (occasionally) ride them.
Based in Ohio, Zach is now slowly introducing a new generation to cycling and still trying to figure out how to fit the most rides into a busy schedule as a new dad."""
full_description = 'Home > Other Fun Stuff > Advocacy & Industry News > News Cane Creek Adds Purple Permanently to the Chroma Studio Collection Written by Zach Overholt Feb 26, 2025 11:01 a.m. ET Click to share on Facebook (Opens in new window)Click to email a link to a friend (Opens in new window) 3 Comments Support us! Bikerumor may earn a small commission from affiliate links in this article. Learn More Purple is popular again. But did it ever really go out of style? That can be debated, but now purple has a new permanent home for the Cane Creek Chroma Studio Collection. The Chroma Studio is the name for Cane Creek’s collection of anodized parts which includes Hellbender headsets and bottom brackets, Helm mkII forks, and other small accessories like computer mounts. According to Cane Creek, purple has been the most popular color request since they launched the Chroma Studio in 2023. Along with the addition of purple, Cane Creek is also including the Hellbender 70 LITE headset in the Chroma Studio color options. These headsets feature a hybrid aluminum bearing that drops 30% of the weight of a traditional steel bearing with minimized bearing balls and races. When combined with the lightweight preload assembly, the headset offers a 33% weight reduction over the standard Hellbender 70 headset. <img data-dominant-color="ecdbf0" data-has-transparency="false" decoding="async" width="1080" height="1080" data-id="377799" src="https://bikerumor.com/wp-content/uploads/2025/02/Untitled_design_-_2025-02-25T085125.204.webp" alt="Cane Creek Purple chroma studio" class="lazyload not-transparent wp-image-377799" style="--dominant-color: #ecdbf0; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Untitled_design_-_2025-02-25T085125.204.webp 1080w, https://bikerumor.com/wp-content/uploads/2025/02/Untitled_design_-_2025-02-25T085125.204-297x297.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Untitled_design_-_2025-02-25T085125.204-120x120.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Untitled_design_-_2025-02-25T085125.204-768x768.webp 768w" sizes="(max-width: 1080px) 100vw, 1080px" /> <img data-dominant-color="f1edf3" data-has-transparency="false" decoding="async" width="1080" height="1080" data-id="377798" src="https://bikerumor.com/wp-content/uploads/2025/02/Untitled_design_-_2025-02-25T084611.446_8f5aad40-1f2d-43f2-9a3c-72447c2f7a5f.webp" alt="cane creek purple computer mount" class="lazyload not-transparent wp-image-377798" style="--dominant-color: #f1edf3; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Untitled_design_-_2025-02-25T084611.446_8f5aad40-1f2d-43f2-9a3c-72447c2f7a5f.webp 1080w, https://bikerumor.com/wp-content/uploads/2025/02/Untitled_design_-_2025-02-25T084611.446_8f5aad40-1f2d-43f2-9a3c-72447c2f7a5f-297x297.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Untitled_design_-_2025-02-25T084611.446_8f5aad40-1f2d-43f2-9a3c-72447c2f7a5f-120x120.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Untitled_design_-_2025-02-25T084611.446_8f5aad40-1f2d-43f2-9a3c-72447c2f7a5f-768x768.webp 768w" sizes="(max-width: 1080px) 100vw, 1080px" /> Now Available in Purple: Helm MKII fork, Air, 29 (140mm, 150mm, 160mm) Hellbender 70 headset (4 configurations) Hellbender 70 LITE headset (3 configurations) NEW Chroma Studio Addition Standard headset top cap Interlok Spacers Hellbender 70 Bottom Bracket (BSA only) Crank Preloader eeBarkeep Computer Mount canecreek.com Topics News Cane Creek Purple'
