["https://bikerumor.com/old-man-mountain-flip-cage-hemlock-atlas-packs-make-quick-work-of-hauling-more-gear"]
title = "Old Man Mountain FLiP Cage, Hemlock & Atlas Packs Make Quick Work of Hauling More Gear - Bikerumor"
description = """
Cory Benson is the EU Tech Editor of Bikerumor.com.
Cory has been writing about mountain bikes, enduro, cyclocross, all-road, gravel bikes & bikepacking for over 25 years, even before the industry created some of these names. Prior to Bikerumor, Cory was a practicing Architect specializing in environmental sustainability, has designed bike shops & bike components, and worked as a bike shop mechanic.
Based in the Czech Republic for 15+ years, he is a technical mountain biker, adventurous gravel rider, and short & medium-haul bikepacker. Cory travels extensively across Europe riding bikes, meeting with key European product developers, industry experts & tastemakers for an in-depth review of what’s new, and what’s coming next."""
full_description = 'Home > Reviews > Clothes & Gear Reviews Old Man Mountain FLiP Cage, Hemlock & Atlas Packs Make Quick Work of Hauling More Gear Written by Cory Benson Feb 28, 2025 7:29 a.m. ET Click to share on Facebook (Opens in new window)Click to email a link to a friend (Opens in new window) 1 Comment Support us! Bikerumor may earn a small commission from affiliate links in this article. Learn More Old Man Mountain has an interesting new set of convertible FLiP cages that double up as quick release mounting brackets for new light Hemlock bikepacking bags or still work like conventional carry-all anything cages. Plus, on top of those new 7L waterproof packs that I strapped to my fork, there’s also a similarly-made 9L Atlas dry bag that straps securely to the top of a rear rack to get the weight of your gear lower than reckless bikepacking bags. I’ve been testing out the new Flip cages and fork bags on our snowy winter trails. And they offer a great way to strap some extra warm clothes on the bike just in case, but don’t get in the way when you leave the bags at home. Old Man Mountain FLiP Cages & Hemlock fork bags (Photos/Cory Benson) Old Man Mountain set out to create a new modular, lightweight quick-release system for attaching more gear to your bike. Lighter and lower-profile that their conventional rack setups, they came up with the FLiP system. A relatively simple cage that “like all OMM products [is] secure, silent, and ready for any riding condition“. These new cages are Old Man Mountain’s first ever cargo cages, but they are a lot more than that. The FLiP in their name reveals their versatility. Short for Fast Lock in Place, the thick plastic cages do double-duty as both cargo cage AND a mounting bracket for the new OMM quick release Hemlock bags. <img data-dominant-color="898a89" data-has-transparency="false" decoding="async" width="2100" height="1400" src="https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cages-and-Hemlock-fork-bags_on-Manitou-fat-bike-fork-in-the-snow.webp" alt="Old Man Mountain FLiP Cages &amp; Hemlock fork bags, front view on Manitou Mastodon fork" class="lazyload not-transparent wp-image-377917" style="--dominant-color: #898a89; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cages-and-Hemlock-fork-bags_on-Manitou-fat-bike-fork-in-the-snow.webp 2100w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cages-and-Hemlock-fork-bags_on-Manitou-fat-bike-fork-in-the-snow-297x198.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cages-and-Hemlock-fork-bags_on-Manitou-fat-bike-fork-in-the-snow-1536x1024.webp 1536w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cages-and-Hemlock-fork-bags_on-Manitou-fat-bike-fork-in-the-snow-120x80.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cages-and-Hemlock-fork-bags_on-Manitou-fat-bike-fork-in-the-snow-768x512.webp 768w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cages-and-Hemlock-fork-bags_on-Manitou-fat-bike-fork-in-the-snow-2048x1365.webp 2048w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cages-and-Hemlock-fork-bags_on-Manitou-fat-bike-fork-in-the-snow-800x533.webp 800w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cages-and-Hemlock-fork-bags_on-Manitou-fat-bike-fork-in-the-snow-720x480.webp 720w" sizes="(max-width: 2100px) 100vw, 2100px" /> Old Man Mountain describe them as “the first quick detach mounts that are also a cargo cage“. Then, clipped onto the cages, the bags are also an all-new construction for Old Man Mountain. OMM combine tough hypalon lower sections for durability and to hold their shape, then lighter but still waterproof upper fabric makes the bags easy to cinch down for smaller loads. First Riding Review <img data-dominant-color="797b7c" data-has-transparency="false" decoding="async" width="2100" height="1400" src="https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cages-and-Hemlock-fork-bags_quick-release-hook-detail.webp" alt="Old Man Mountain FLiP Cages &amp; Hemlock fork bags, quick release interfCE" class="lazyload not-transparent wp-image-377914" style="--dominant-color: #797b7c; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cages-and-Hemlock-fork-bags_quick-release-hook-detail.webp 2100w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cages-and-Hemlock-fork-bags_quick-release-hook-detail-297x198.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cages-and-Hemlock-fork-bags_quick-release-hook-detail-1536x1024.webp 1536w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cages-and-Hemlock-fork-bags_quick-release-hook-detail-120x80.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cages-and-Hemlock-fork-bags_quick-release-hook-detail-768x512.webp 768w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cages-and-Hemlock-fork-bags_quick-release-hook-detail-2048x1365.webp 2048w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cages-and-Hemlock-fork-bags_quick-release-hook-detail-800x533.webp 800w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cages-and-Hemlock-fork-bags_quick-release-hook-detail-720x480.webp 720w" sizes="(max-width: 2100px) 100vw, 2100px" /> I bolted a couple of the new Flip cargo cages to the OMM Fork Packs that I already reviewed last year, for extra winter gear hauling. I mostly have been carrying around bulky but light extra clothing – extra insulated jacket, warmer gloves, insulated caps & buffs – and ride snacks. And it has been great to have the gear pre-packed off the bike, then easily snapped into place to be extra prepared for longer, colder rides. Just slip the lower hook on the back of your bag into place in the slot of the FLiP cage, push the top lug into its keyed slot on the cage, and rotate it 90° to lock securely in place. The whole cage and mount interface is made of oversized injection-molded nylon, which makes it simple to use and tough enough to haul up to 4.5kg (9.9lb) per cage/bag combo. And since there’s a tiny bit of stretch in nylon, the twist lock mechanism feels very secure and doesn’t move or rattle as you ride over rough terrain. Plus, it’s stood up to some pretty cold riding for me too, without getting stiff or brittle at lower temperatures. First Impressions <img data-dominant-color="9ca0a5" data-has-transparency="false" decoding="async" width="2100" height="1400" src="https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cages_on-a-fat-bike-Manitou-Mastodon-with-fork-packs.webp" alt="Old Man Mountain FLiP Cages riding in the snow" class="lazyload not-transparent wp-image-377916" style="--dominant-color: #9ca0a5; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cages_on-a-fat-bike-Manitou-Mastodon-with-fork-packs.webp 2100w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cages_on-a-fat-bike-Manitou-Mastodon-with-fork-packs-297x198.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cages_on-a-fat-bike-Manitou-Mastodon-with-fork-packs-1536x1024.webp 1536w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cages_on-a-fat-bike-Manitou-Mastodon-with-fork-packs-120x80.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cages_on-a-fat-bike-Manitou-Mastodon-with-fork-packs-768x512.webp 768w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cages_on-a-fat-bike-Manitou-Mastodon-with-fork-packs-2048x1365.webp 2048w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cages_on-a-fat-bike-Manitou-Mastodon-with-fork-packs-800x533.webp 800w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cages_on-a-fat-bike-Manitou-Mastodon-with-fork-packs-720x480.webp 720w" sizes="(max-width: 2100px) 100vw, 2100px" /> I’m really quite happy with how out-of-the-way the cages are without the bags installed, so I don’t even notice them when I leave the bags at home. It doesn’t make a big difference using the optional foot or not to me. I have the foot installed on the driveside where there’s plenty of other stuff hanging off the bike. Then, my think was to leave the optional cargo foot off on the non-driveside where I’m more likely to be pushing the bike through a snow drift anyway. One of OMM’s biggest core values is to create durable gear that adventure and bikepacking riders can rely on, so they say it took quite a while the get these perfect. And I’m certainly satisfied with them so far. I also use (and have used) a few other anything-style cargo cages, and these actually feel a bit more robust than most, even though they are just made of plastic. But the oversized tube shapes and specific strap slots make me feel better about really cinching down a strap to secure a bottle or stuff sack in place. Old Man Mountain also recognizes and appreciates the wide-ranging variety of different bikepackers’ preferred setups. So OMM are also offering the FLiP cage & mount hardware up to other bikepacking bag makers, who want to share the new quick release interface. Interested bag makers “big and small” can find out more and get in touch via the OMM FLiP Hardware Explained product page, here. OMM FLiP Cage tech details <img data-dominant-color="dbd7d3" data-has-transparency="false" decoding="async" width="2500" height="1500" src="https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cage_plastic-bikepacking-anything-cage-details.webp" alt="Old Man Mountain FLiP Cages details" class="lazyload not-transparent wp-image-377915" style="--dominant-color: #dbd7d3; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cage_plastic-bikepacking-anything-cage-details.webp 2500w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cage_plastic-bikepacking-anything-cage-details-297x178.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cage_plastic-bikepacking-anything-cage-details-1536x922.webp 1536w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cage_plastic-bikepacking-anything-cage-details-120x72.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cage_plastic-bikepacking-anything-cage-details-768x461.webp 768w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cage_plastic-bikepacking-anything-cage-details-2048x1229.webp 2048w" sizes="(max-width: 2500px) 100vw, 2500px" /> injection-molded nylon construction 62mm wide x 215mm long without foot, or 240mm long with cargo foot installed max 4.5kg load capacity (per cage) Flip cages are designed to serve as quick release mount for Hemlock bags Hemlock can be mounted with or without the removable cargo cage foot installed Flip cargo cages can also haul standard gear with the removable foot installed 2 slots in the cage are sized for classic Voile gear straps 93g claimed weight without removable cargo foot (92g actual) 139g claimed with foot installed (139g actual) sold separately as a pair or cargo cages, or together with 2 cages & 2 Hemlock bags <img data-dominant-color="776d61" data-has-transparency="false" decoding="async" width="1500" height="1500" data-id="377911" src="https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cage_139g-actual-weight-with-removable-foot.webp" alt="Old Man Mountain FLiP Cages, 139g weight with foot" class="lazyload not-transparent wp-image-377911" style="--dominant-color: #776d61; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cage_139g-actual-weight-with-removable-foot.webp 1500w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cage_139g-actual-weight-with-removable-foot-297x297.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cage_139g-actual-weight-with-removable-foot-120x120.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cage_139g-actual-weight-with-removable-foot-768x768.webp 768w" sizes="(max-width: 1500px) 100vw, 1500px" /> <img data-dominant-color="7b7165" data-has-transparency="false" decoding="async" width="1500" height="1500" data-id="377910" src="https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cage_92g-actual-weight-without-foot.webp" alt="Old Man Mountain FLiP Cage, 92g without foot" class="lazyload not-transparent wp-image-377910" style="--dominant-color: #7b7165; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cage_92g-actual-weight-without-foot.webp 1500w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cage_92g-actual-weight-without-foot-297x297.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cage_92g-actual-weight-without-foot-120x120.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cage_92g-actual-weight-without-foot-768x768.webp 768w" sizes="(max-width: 1500px) 100vw, 1500px" /> <img data-dominant-color="6f6a5f" data-has-transparency="false" decoding="async" width="1500" height="1500" data-id="377909" src="https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-OMM-Hemlock-fork-bags_341g-actual-weight.webp" alt="Old Man Mountain Hemlock fork bags, 341g weight" class="lazyload not-transparent wp-image-377909" style="--dominant-color: #6f6a5f; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-OMM-Hemlock-fork-bags_341g-actual-weight.webp 1500w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-OMM-Hemlock-fork-bags_341g-actual-weight-297x297.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-OMM-Hemlock-fork-bags_341g-actual-weight-120x120.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-OMM-Hemlock-fork-bags_341g-actual-weight-768x768.webp 768w" sizes="(max-width: 1500px) 100vw, 1500px" /> OMM Hemlock bag tech details <img data-dominant-color="818383" data-has-transparency="false" decoding="async" width="1536" height="1024" data-id="377913" src="https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cages-and-Hemlock-fork-bags_rack-and-mount-details-1536x1024.webp" alt="Old Man Mountain FLiP Cage on bike" class="lazyload not-transparent wp-image-377913" style="--dominant-color: #818383; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Old-Man-Mountain-FLiP-Cages-and-Hemlock-fork-bags_rack-and-mount-details-1536x1024.webp 1536w, https://bikerumor.com/wp-content/upload'
