["https://bikerumor.com/aeron-tpu-superlight-race-tubes-aluminum-valves"]
title = "AERON/TPU Gives Us SuperLight Race Tubes with Aluminum Valves - Bikerumor"
description = """
Jordan Villella is the Racing Tech Editor for BikeRumor.com, specializing in cross-country mountain, gravel, road, and cyclocross. He has written about bicycles and bike culture for over fifteen years with no signs of stopping.
Before BikeRumor, Jordan raced professionally and wrote for MTBR and the now-defunct Dirt Rag Magazine. He’s covered the World Championships, World Cups, and everything in between — where he loves to report what people are riding.
Based in Pittsburgh, PA, Jordan coaches cyclists of all abilities with Cycle-Smart; you can find him racing bikes around North America and adventuring with his family.
For an inside look at his review rides follow him on Strava."""
full_description = 'Home > Other Fun Stuff > Advocacy & Industry News > News AERON/TPU Gives Us SuperLight Race Tubes with Aluminum Valves Written by Jordan Villella Feb 28, 2025 11:07 a.m. ET Click to share on Facebook (Opens in new window)Click to email a link to a friend (Opens in new window) 6 Comments Support us! Bikerumor may earn a small commission from affiliate links in this article. Learn More AERON/TPU is the latest to step deeper into the high-performance, ultra-light inner tube game. Founded by RTI Sports Group, the folks behind Ergon saddles and grips, AERON wants to instill longevity and durability into the hyper-lightweight tube world and swap out less user-friendly (but light) plastic valves for alloy ones. Their SuperLight Race series, which debuted at the UK CORE bike show, is aimed at weight-conscious riders looking for low rolling resistance, compact pack size, and top-tier puncture protection. <img data-dominant-color="b8beba" data-has-transparency="false" decoding="async" width="2560" height="1440" src="https://bikerumor.com/wp-content/uploads/2025/02/AERONTPU-Inner-Tubes-box-scaled.webp" alt="AERON:TPU Inner Tubes box" class="lazyload not-transparent wp-image-377802" style="--dominant-color: #b8beba; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/AERONTPU-Inner-Tubes-box-scaled.webp 2560w, https://bikerumor.com/wp-content/uploads/2025/02/AERONTPU-Inner-Tubes-box-297x167.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/AERONTPU-Inner-Tubes-box-1536x864.webp 1536w, https://bikerumor.com/wp-content/uploads/2025/02/AERONTPU-Inner-Tubes-box-120x68.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/AERONTPU-Inner-Tubes-box-768x432.webp 768w, https://bikerumor.com/wp-content/uploads/2025/02/AERONTPU-Inner-Tubes-box-2048x1152.webp 2048w, https://bikerumor.com/wp-content/uploads/2025/02/AERONTPU-Inner-Tubes-box-1200x675.webp 1200w" sizes="(max-width: 2560px) 100vw, 2560px" /> Aluminum Presta Valves For the Win The SuperLight Race tubes come with aluminum Presta valves, delivering a lighter, stronger, and more adaptable setup for racers and performance riders. Here’s what makes them stand out: Removable valve core for easy sealant injection Better compatibility with valve extenders More resistant to extreme temperatures A machined valve stem ensures a secure pump head connection Built for durability (compared to plastic valves) <img data-dominant-color="040405" data-has-transparency="false" decoding="async" width="1536" height="864" data-id="377804" src="https://bikerumor.com/wp-content/uploads/2025/02/RoadSuperLite_Aluminium_Valve_CloseUp_2-1536x864.webp" alt="RoadSuperLite_Aluminium_Valve_CloseUp_2" class="lazyload not-transparent wp-image-377804" style="--dominant-color: #040405; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/RoadSuperLite_Aluminium_Valve_CloseUp_2-1536x864.webp 1536w, https://bikerumor.com/wp-content/uploads/2025/02/RoadSuperLite_Aluminium_Valve_CloseUp_2-297x167.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/RoadSuperLite_Aluminium_Valve_CloseUp_2-120x68.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/RoadSuperLite_Aluminium_Valve_CloseUp_2-768x432.webp 768w, https://bikerumor.com/wp-content/uploads/2025/02/RoadSuperLite_Aluminium_Valve_CloseUp_2-2048x1152.webp 2048w, https://bikerumor.com/wp-content/uploads/2025/02/RoadSuperLite_Aluminium_Valve_CloseUp_2-1200x675.webp 1200w" sizes="(max-width: 1536px) 100vw, 1536px" /> Weight Weenies – Prep Your Wallet The SuperLight Race lineup is impressively light, with models for road, MTB, and CX/gravel: Road SuperLite Race (23-28mm, Presta 42mm): 21g MTB SuperLite Race (1.7″-2.5″, Presta 42mm): 40g CX/Gravel SuperLite Race (32-52mm, Presta 42mm): 30g Price: 24,95 €, £22.99, $29.95 per tube. <img data-dominant-color="b7b8b4" data-has-transparency="false" decoding="async" width="2560" height="1440" src="https://bikerumor.com/wp-content/uploads/2025/02/AERONTPU-Inner-Tubes--scaled.webp" alt="AERON:TPU Inner Tubes" class="lazyload not-transparent wp-image-377800" style="--dominant-color: #b7b8b4; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/AERONTPU-Inner-Tubes--scaled.webp 2560w, https://bikerumor.com/wp-content/uploads/2025/02/AERONTPU-Inner-Tubes--297x167.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/AERONTPU-Inner-Tubes--1536x864.webp 1536w, https://bikerumor.com/wp-content/uploads/2025/02/AERONTPU-Inner-Tubes--120x68.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/AERONTPU-Inner-Tubes--768x432.webp 768w, https://bikerumor.com/wp-content/uploads/2025/02/AERONTPU-Inner-Tubes--2048x1152.webp 2048w, https://bikerumor.com/wp-content/uploads/2025/02/AERONTPU-Inner-Tubes--1200x675.webp 1200w" sizes="(max-width: 2560px) 100vw, 2560px" /> Availability—When Can You Get Them? AERON/TPU is rolling out the SuperLight Race aluminum valve tubes in April, with options in 42mm, 65mm, and 80mm valve lengths. For those looking for a more budget-friendly TPU valve version, 42mm models will be available in May and 65/80mm in July. www.aeron-tpu.com Topics News aeron Ergon TPU tubes'
