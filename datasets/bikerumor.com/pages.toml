title = "Enduro Bearings Adds Mini Tool Kits for Pro Tools on a DIY Budget - Bikerumor"
description = "Ron Frazelle is the Cycling Lifestyle Editor for Bikerumor, he has been writing about bicycles and the cycling way of life for 7+ years. Prior to Bikerumor, he worked in the bicycle industry, living and breathing bicycles since 1995. He is based in Anaheim, California, Frazelle is an avid cyclist of all disciplines, camper, father to 6 children, husband, musician and self-proclaimed retro-grouch."
full_description = 'Home > Clothing-Gear-Tools Enduro Bearings Adds Mini Tool Kits for Pro Tools on a DIY Budget Written by Ron Frazelle Feb 26, 2025 9:30 a.m. ET (Photos / Enduro Bearings) Click to share on Facebook (Opens in new window)Click to email a link to a friend (Opens in new window) 1 Comment Support us! Bikerumor may earn a small commission from affiliate links in this article. Learn More Recently, Enduro Bearings expanded its Pro tool Line with a new tool. The new BRT-040 Toolkit is used for bottom bracket and hub bearing removal. It integrates seamlessly with the existing BRT-060 Linear Bearing Press. (Photos / Enduro Bearings) The BRT-040 Toolkit includes cups and guides tailored for servicing 24mm, 29/DUB, and 30mm bottom brackets. They feature innovative disc brake standoff cups for safe/gentle removal bearings for service/replacement. <img data-dominant-color="ede6ce" data-has-transparency="false" decoding="async" width="1280" height="493" src="https://bikerumor.com/wp-content/uploads/2025/02/Enduro-Bearings-BRT-040-hub-e1740428166264.webp" alt="Enduro Bearings BRT-040 hub" class="lazyload not-transparent wp-image-377660" style="--dominant-color: #ede6ce; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Enduro-Bearings-BRT-040-hub-e1740428166264.webp 1280w, https://bikerumor.com/wp-content/uploads/2025/02/Enduro-Bearings-BRT-040-hub-e1740428166264-297x114.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Enduro-Bearings-BRT-040-hub-e1740428166264-120x46.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Enduro-Bearings-BRT-040-hub-e1740428166264-768x296.webp 768w" sizes="(max-width: 1280px) 100vw, 1280px" /> Want to service your own bike, but don’t need a full set of tools? You may have one or two cranksets and hubs that require specific sizes, but not the full run of sizes in a shop tool kit. In that case, mini toolkits and individual cups and guides are offered at accessible price points. <img data-dominant-color="ddd7ce" data-has-transparency="false" decoding="async" width="1280" height="587" src="https://bikerumor.com/wp-content/uploads/2025/02/Enduro-Bearings-BRT-040-bottom-bracket-e1740428190619.webp" alt="Enduro Bearings BRT-040 bottom bracket" class="lazyload not-transparent wp-image-377661" style="--dominant-color: #ddd7ce; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Enduro-Bearings-BRT-040-bottom-bracket-e1740428190619.webp 1280w, https://bikerumor.com/wp-content/uploads/2025/02/Enduro-Bearings-BRT-040-bottom-bracket-e1740428190619-297x136.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Enduro-Bearings-BRT-040-bottom-bracket-e1740428190619-120x55.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Enduro-Bearings-BRT-040-bottom-bracket-e1740428190619-768x352.webp 768w" sizes="(max-width: 1280px) 100vw, 1280px" /> The BRT-040 cups and guides are reverse compatible for those who have the previous generation of Enduro tools. You’ll be able to use tools like the BRT-002, 003, and 050 bearing presses. Highlights of Enduro Bearings BRT-040 Modular Versatility: The new BRT-040 Toolkit and BRT-060 Bearing Press can be ordered in different configurations. Such as a full kit, mini kit, or individual items. Precision Design: All Enduro tools are machined to exact tolerances. The bearing presses feature Acme thread rods and needle bearings for controlled, bind-free bearing removal and installation. No hammers are needed to remove bearings! Durable Construction: Built to withstand the daily demands of professionals and home mechanics alike. All Enduro tools include a two-year warranty. BRT-040 Retail & What’s Included Retail: $249 The Kit Includes This kit includes cups, guides, and pullers for the removal and installation of all sizes of BB and hub bearings when used in conjunction with the BRT-060 or BRT-050 bearing presses. Note: the receiver cups provided for removing hub bearings are intended for use with hubs that feature axle stops. Enduro says that the toolkit features “many cross-compatible parts with the BRT-003 24mm BB press tool that overlap the functionality of BRT-002 (30mm BB) and the BRT-016 (29mm DUB BB)”. Cycling.EnduroBearings.com Topics Clothing-Gear-Tools News Enduro Bearing tools'
