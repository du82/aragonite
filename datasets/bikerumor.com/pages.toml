["https://bikerumor.com/ari-bikes-announces-bentonville-satellite-location-adds-tyler-mccaul"]
title = "Ari Bikes Announces Bentonville as First Satellite Location, Adds Tyler McCaul to the Team! - Bikerumor"
description = """
Zach Overholt is the Editor in Chief of Bikerumor. He has been writing about what’s new in the bicycle world for 12+ years. Prior to that, Zach spent many years in the back of a bicycle shop building and repairing nearly every type of bike, while figuring out how to (occasionally) ride them.
Based in Ohio, Zach is now slowly introducing a new generation to cycling and still trying to figure out how to fit the most rides into a busy schedule as a new dad."""
full_description = 'Home > Other Fun Stuff > Advocacy & Industry News > News Ari Bikes Announces Bentonville as First Satellite Location, Adds Tyler McCaul to the Team! Written by Zach Overholt Feb 26, 2025 10:12 a.m. ET Click to share on Facebook (Opens in new window)Click to email a link to a friend (Opens in new window) 1 Comment Support us! Bikerumor may earn a small commission from affiliate links in this article. Learn More We’re coming up on a year since Fezzari changed their name to Ari Bikes, and the company is showing no signs of slowing down. Last year, the big team news was the addition of Kyle and Rachel Strait to the family. Now, there’s another big name being added to the roster – Tyler McCaul. Play Last week, Tyler announced that for the first time in 16 years, he would no longer be riding for GT bikes. That’s not surprising considering GT Bikes announced that they were “pausing” the brand back in December. In the video above, T-Mac says that the brand is officially closing down, so it sounds like at least from the sponsored athlete perspective, GT is not coming back the way it was. Fortunately for Tyler, Ari has scooped up the talented rider and has given him the ability to continue to ride and compete. Ari Bikes Bentonville <img data-dominant-color="584a40" data-has-transparency="false" decoding="async" width="1536" height="782" data-id="377786" src="https://bikerumor.com/wp-content/uploads/2025/02/0204-Photoshopped-Rendering-2-1536x782.webp" alt="ari bikes bentonville rendering" class="lazyload not-transparent wp-image-377786" style="--dominant-color: #584a40; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/0204-Photoshopped-Rendering-2-1536x782.webp 1536w, https://bikerumor.com/wp-content/uploads/2025/02/0204-Photoshopped-Rendering-2-297x151.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/0204-Photoshopped-Rendering-2-120x61.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/0204-Photoshopped-Rendering-2-768x391.webp 768w, https://bikerumor.com/wp-content/uploads/2025/02/0204-Photoshopped-Rendering-2-2048x1043.webp 2048w" sizes="(max-width: 1536px) 100vw, 1536px" /> <img data-dominant-color="878385" data-has-transparency="false" decoding="async" width="1536" height="550" data-id="377787" src="https://bikerumor.com/wp-content/uploads/2025/02/Bentonville-Signage-Mockup_White-1536x550.webp" alt="Bentonville Signage Mockup_White" class="lazyload not-transparent wp-image-377787" style="--dominant-color: #878385; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Bentonville-Signage-Mockup_White-1536x550.webp 1536w, https://bikerumor.com/wp-content/uploads/2025/02/Bentonville-Signage-Mockup_White-297x106.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Bentonville-Signage-Mockup_White-120x43.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Bentonville-Signage-Mockup_White-768x275.webp 768w, https://bikerumor.com/wp-content/uploads/2025/02/Bentonville-Signage-Mockup_White-2048x733.webp 2048w" sizes="(max-width: 1536px) 100vw, 1536px" /> The other big news for Ari is the announcement of their first satellite location – in Bentonville, AR, where else? With the area continuing to explode as a popular year-round destination for riders of all skill levels, Ari plans to leverage that with bike demos, guidance for finding the right bike and riding zones, a full-service shop, and the ability to pick up your new bike or have it shipped straight to your door. Ari Bikes Bentonville is expected to open this summer. Check out the site linked below for more details. aribikes.com Topics Advocacy & Industry News Mountain Bike News ari bikes Bentonville Tyler McCaul'
