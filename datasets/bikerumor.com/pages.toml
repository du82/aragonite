["https://bikerumor.com/aasq-136-rotor-america-and-classified-cycling-answer-your-road-gearing-questions"]
title = "AASQ #136: ROTOR America, Classified Cycling and FSA answer road gearing questions - Bikerumor"
description = """
Jessie-May Morgan is the UK & Ireland Tech Editor of Bikerumor. She has been writing about Mountain Bike Riding and Racing, and all its weird and wonderful technology for 4 years. Prior to that, she was an Intern at the Mountain Bike Center of Scotland, and a Mountain Bike Coach and Leader in the Tweed Valley.
Based in Innerleithen, Scotland, Jessie-May can often be seen riding the Glentress Trail Center, and its neighboring Enduro and Downhill Tracks. She regularly competes in Enduro at a national level, and has recently competed on the World Stage at a handful of Enduro World Series events.
For Bikerumor, Jessie-May is testing the latest mountain bikes, equipment and kit, letting readers know what’s hot and what’s not.
For context, she weighs 60kg and stands at 5ft 4″ tall (163cm)."""
full_description = 'Home > Feature Stories AASQ #136: ROTOR America, Classified Cycling and FSA answer road gearing questions Written by Jessie-May Morgan Sep 24, 2021 12:35 p.m. ET Click to share on Facebook (Opens in new window)Click to email a link to a friend (Opens in new window) 2 Comments Support us! Bikerumor may earn a small commission from affiliate links in this article. Learn More We know, there’s no such thing as a stupid question. But there are some questions you might not want to ask your local shop or riding buddies. AASQ is our weekly series where we get to the bottom of your questions – serious or otherwise. Hit the link at the bottom of the post to submit your own question. Welcome back to the Bikerumor Ask A Stupid Question series. This week, we’ve taken a handful of your questions on road bike gearing and pitched them to the experts at Classified Cycling and ROTOR America. Your contributors this week are: Lori Barrett, Managing Director at ROTOR Jef Van Herck, Marketing Manager at Classified Cycling John McKone, Road Marketing at Full Speed Ahead We know some manufacturers have designed a road freehub that will accept a cassette running from 10T (or smaller). How long before they offer a 12s road cassette going from 10T? It’s needed, even at the top level. I wish I had £5 for every time I watched competitors in the three Grand Tours of 2021 spin out when racing downhill. Plus, I want one, for my 28/44 (or 26/42) White Industries touring super-climber chain set. Classified: The reasoning behind the 10th sprocket is coming from 1X drivetrains, where the full gear range has to come from the cassette alone. In order to increase the total gear range for 1X drivetrains, the largest sprockets were made larger and the smaller ones smaller. Classified Cycling’s Powershift hub delivers 2 x 12 speed gearing without a front derailleur When riding a 2X system, there is no need to go to these extreme sprocket sizes, allowing you to ride a more compact cassette with small steps between sprockets, which runs smoother. For road races we therefore don’t believe that a 10th is needed, as a 2X drivetrain is the standard. To gain speed when riding downhill, it is more efficient to increase the chainring size, which also decreases your chain forces. ROTOR America: We answer range queries with our 1×13 groupset. The 13s has a 10T cog that is outboard from the freehub body, making it compatible with a standard HG freehub body on the ROTOR 13s hub. With massive cassette options from 10-52 down to 10-36, going from road gearing to touring rig climbing gears is as simple as changing the cassette. <img data-dominant-color="514b49" data-has-transparency="false" style="--dominant-color: #514b49;" decoding="async" class="lazyload not-transparent wp-image-233748 size-full" src="https://bikerumor.com/wp-content/uploads/2020/03/Rotor-1x13-TT-aero-hydraulic-time-trial-drivetrain-groupset_Kona-IronMan-Ventum-Profile-Design-concept-bike.jpg" alt="Rotor 1x13 TT aero hydraulic time trial drivetrain groupset, Kona IronMan Ventum Profile Design concept bike" width="1500" height="900" srcset="https://bikerumor.com/wp-content/uploads/2020/03/Rotor-1x13-TT-aero-hydraulic-time-trial-drivetrain-groupset_Kona-IronMan-Ventum-Profile-Design-concept-bike.jpg 1500w, https://bikerumor.com/wp-content/uploads/2020/03/Rotor-1x13-TT-aero-hydraulic-time-trial-drivetrain-groupset_Kona-IronMan-Ventum-Profile-Design-concept-bike-297x178.jpg 297w, https://bikerumor.com/wp-content/uploads/2020/03/Rotor-1x13-TT-aero-hydraulic-time-trial-drivetrain-groupset_Kona-IronMan-Ventum-Profile-Design-concept-bike-800x480.jpg 800w, https://bikerumor.com/wp-content/uploads/2020/03/Rotor-1x13-TT-aero-hydraulic-time-trial-drivetrain-groupset_Kona-IronMan-Ventum-Profile-Design-concept-bike-120x72.jpg 120w, https://bikerumor.com/wp-content/uploads/2020/03/Rotor-1x13-TT-aero-hydraulic-time-trial-drivetrain-groupset_Kona-IronMan-Ventum-Profile-Design-concept-bike-768x461.jpg 768w" sizes="(max-width: 1500px) 100vw, 1500px" />Check out ROTOR’s 1×13 TT Aero Time Trail Groupset here Will ROTOR have road DM double ring sets that work for SRAM AXS (road)? That means 13 tooth difference between the inner and outer ring AND teeth shaped to work with the SRAM 12 Speed FlatTop chain. ROTOR America: We released AXS-compatible 2x chainring sets in round & oval in August of 2019. We added to the range this spring with 107 BCD for SRAM Force, expanding the size offerings with 50/37, in addition to the 48/35 already available. What is the most efficient cadence for hill climbing (road cycling), and what factors affect this? Classified: According to one of the World Tour riders who is testing our Classified shifting system on a daily basis, the perfect cadence for hill climbing is around 90, but he sees a lot of variation in the peloton. In case of extreme tiredness and exhaustion, the control of the muscles is less anyway. This will cause you to pedal harder in order to maintain an efficient pedal stroke. <img data-dominant-color="7e6b3b" data-has-transparency="false" style="--dominant-color: #7e6b3b;" decoding="async" class="lazyload not-transparent wp-image-253215 size-full" src="https://bikerumor.com/wp-content/uploads/2021/03/Isaac-Meson-X-Classified-1x-aero-road-bike_wireless-electronic-internal-gear-hub-2x11-carbon-road-race-bike_riding.jpg" alt="Isaac Meson X Classified 1x aero road bike, wireless electronic internal gear hub 2x11 carbon road race bike, riding" width="1200" height="721" srcset="https://bikerumor.com/wp-content/uploads/2021/03/Isaac-Meson-X-Classified-1x-aero-road-bike_wireless-electronic-internal-gear-hub-2x11-carbon-road-race-bike_riding.jpg 1200w, https://bikerumor.com/wp-content/uploads/2021/03/Isaac-Meson-X-Classified-1x-aero-road-bike_wireless-electronic-internal-gear-hub-2x11-carbon-road-race-bike_riding-297x178.jpg 297w, https://bikerumor.com/wp-content/uploads/2021/03/Isaac-Meson-X-Classified-1x-aero-road-bike_wireless-electronic-internal-gear-hub-2x11-carbon-road-race-bike_riding-800x481.jpg 800w, https://bikerumor.com/wp-content/uploads/2021/03/Isaac-Meson-X-Classified-1x-aero-road-bike_wireless-electronic-internal-gear-hub-2x11-carbon-road-race-bike_riding-120x72.jpg 120w, https://bikerumor.com/wp-content/uploads/2021/03/Isaac-Meson-X-Classified-1x-aero-road-bike_wireless-electronic-internal-gear-hub-2x11-carbon-road-race-bike_riding-768x461.jpg 768w" sizes="(max-width: 1200px) 100vw, 1200px" />The Classified Powershift system on the Issac Meson Aero Road Bike. Credit: Isaac ROTOR America: A lot of pedal stroke efficiency depends on the strengths of the individual cyclist. Some riders’ physiology works best in a low gear and high cadence (depending more on aerobic capacity,) while others succeed with a heavy gear and low cadence, depending more on muscular strength. ROTOR believes that oval chainrings benefit all categories of climbers, as the adjustable oval allows the rider to experience less drag in the back of the pedal stroke while maximizing the strong push on the front side. <img decoding="async" class="lazyload wp-image-225571 size-full" src="https://bikerumor.com/wp-content/uploads/2019/10/Rotor-INspider-powermeter_modular-power-meter-spider-for-spearate-crankarms_Kapic-Carbon-cranks-with-1x-Q-Ring.jpg" alt="Rotor &quot;Buy a powermeter and get the chainrings for free&quot; deal" width="1200" height="600" srcset="https://bikerumor.com/wp-content/uploads/2019/10/Rotor-INspider-powermeter_modular-power-meter-spider-for-spearate-crankarms_Kapic-Carbon-cranks-with-1x-Q-Ring.jpg 1200w, https://bikerumor.com/wp-content/uploads/2019/10/Rotor-INspider-powermeter_modular-power-meter-spider-for-spearate-crankarms_Kapic-Carbon-cranks-with-1x-Q-Ring-120x60.jpg 120w, https://bikerumor.com/wp-content/uploads/2019/10/Rotor-INspider-powermeter_modular-power-meter-spider-for-spearate-crankarms_Kapic-Carbon-cranks-with-1x-Q-Ring-297x149.jpg 297w, https://bikerumor.com/wp-content/uploads/2019/10/Rotor-INspider-powermeter_modular-power-meter-spider-for-spearate-crankarms_Kapic-Carbon-cranks-with-1x-Q-Ring-768x384.jpg 768w, https://bikerumor.com/wp-content/uploads/2019/10/Rotor-INspider-powermeter_modular-power-meter-spider-for-spearate-crankarms_Kapic-Carbon-cranks-with-1x-Q-Ring-800x400.jpg 800w, https://bikerumor.com/wp-content/uploads/2019/10/Rotor-INspider-powermeter_modular-power-meter-spider-for-spearate-crankarms_Kapic-Carbon-cranks-with-1x-Q-Ring-696x348.jpg 696w, https://bikerumor.com/wp-content/uploads/2019/10/Rotor-INspider-powermeter_modular-power-meter-spider-for-spearate-crankarms_Kapic-Carbon-cranks-with-1x-Q-Ring-1068x534.jpg 1068w, https://bikerumor.com/wp-content/uploads/2019/10/Rotor-INspider-powermeter_modular-power-meter-spider-for-spearate-crankarms_Kapic-Carbon-cranks-with-1x-Q-Ring-840x420.jpg 840w" sizes="(max-width: 1200px) 100vw, 1200px" />ROTOR offer oval chainrings with the INSPIDER Powermeter for both road and mountain bike FSA: This is a very personal question that is unique to each rider and it could be said that there are many ways to approach a climb. Preferred cadences are anywhere between 75-95 rpm, depending on each rider’s physiology and riding style. The upper end of this range, 85-95 rpm, has been seen to be the most efficient for sustained efforts and longer climbs. You may not tax your muscular system at this higher cadence, but you will find yourself nearer to your anaerobic thresholds. Finding that balance is the key. Of course, there are multiple factors that come into play such as the length of a climb, steepness, and number of riders if you are in a group. If there are pack-surges or the pace is too high when riding with others, simply keep your own cadence and heart rate within limits to finish the climb on your own. You don’t want to blow up and put yourself in the ‘red zone’ in the first few hundred meters just to keep with the pace. <img data-dominant-color="d3d3d3" data-has-transparency="false" style="--dominant-color: #d3d3d3;" decoding="async" class="lazyload not-transparent aligncenter size-full wp-image-259492" src="https://bikerumor.com/wp-content/uploads/2021/05/fsa-K-Force-Modular-Supercompact-crankset-gravel-groupset.jpg" alt="fsa k-force modular crankset supercompact short crank arms" width="1200" height="800" srcset="https://bikerumor.com/wp-content/uploads/2021/05/fsa-K-Force-Modular-Supercompact-crankset-gravel-groupset.jpg 1200w, https://bikerumor.com/wp-content/uploads/2021/05/fsa-K-Force-Modular-Supercompact-crankset-gravel-groupset-297x198.jpg 297w, https://bikerumor.com/wp-content/uploads/2021/05/fsa-K-Force-Modular-Supercompact-crankset-gravel-groupset-800x533.jpg 800w, https://bikerumor.com/wp-content/uploads/2021/05/fsa-K-Force-Modular-Supercompact-crankset-gravel-groupset-120x80.jpg 120w, https://bikerumor.com/wp-content/uploads/2021/05/fsa-K-Force-Modular-Supercompact-crankset-gravel-groupset-768x512.jpg 768w, https://bikerumor.com/wp-content/uploads/2021/05/fsa-K-Force-Modular-Supercompact-crankset-gravel-groupset-720x480.jpg 720w" sizes="(max-width: 1200px) 100vw, 1200px" /> From an equipment perspective, having the correct gearing is also key. Full Speed Ahead pioneered the first compact road cranksets and since has been introducing lower geared configurations for just such riding. Even dropping down onto a 52/36t road crankset will make a difference from a standard road set up of 53/39t, while the biggest gains would be a Super Compact such as the FSA K-Force Modular Adventure cranks which offers choices of 48x32t and 46x30t. Enough low range on a 11-34t rear cassette will get riders up climbs within their limits. Other tech additions to consider may include a digital readout computer that displays cadence and heart rate data. These tools can help riders reach their goals and become more efficient climbers. Got a question of your own? Click here to use the Ask A Stupid Question form to submit questions on any cycling-related topic of your choice, and we’ll get the experts to answer them for you! Topics AASQ Feature Stories Road Bike'
