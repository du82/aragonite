title = "AASQ #137: What's the big deal with oversize derailleur cages and pulleys? - Bikerumor"
description = """
Jessie-May Morgan is the UK & Ireland Tech Editor of Bikerumor. She has been writing about Mountain Bike Riding and Racing, and all its weird and wonderful technology for 4 years. Prior to that, she was an Intern at the Mountain Bike Center of Scotland, and a Mountain Bike Coach and Leader in the Tweed Valley.
Based in Innerleithen, Scotland, Jessie-May can often be seen riding the Glentress Trail Center, and its neighboring Enduro and Downhill Tracks. She regularly competes in Enduro at a national level, and has recently competed on the World Stage at a handful of Enduro World Series events.
For Bikerumor, Jessie-May is testing the latest mountain bikes, equipment and kit, letting readers know what’s hot and what’s not.
For context, she weighs 60kg and stands at 5ft 4″ tall (163cm)."""
full_description = 'Home > AASQ AASQ #137: What’s the big deal with oversize derailleur cages and pulleys? Written by Jessie-May Morgan Oct 01, 2021 8:00 a.m. ET Click to share on Facebook (Opens in new window)Click to email a link to a friend (Opens in new window) 9 Comments Support us! Bikerumor may earn a small commission from affiliate links in this article. Learn More We know, there’s no such thing as a stupid question. But there are some questions you might not want to ask your local shop or riding buddies. AASQ is our weekly series where we get to the bottom of your questions – serious or otherwise. Hit the link at the bottom of the post to submit your own question. Welcome back to the Bikerumor Ask A Stupid Question series. This week, we’re joined by Kogel Bearings, Muc-Off, absoluteBLACK and CeramicSpeed to discuss the topic of oversize derailleur pulleys and cages. What are the advantages, how big is too big, and what cycling disciplines are they most suited to? Your expert contributors are as follows: Ard Kessels, Founder and Owner of Kogel Bearings Bruno Nascimento, International Sales and Marketing at absoluteBLACK Steve Fearn, Global Cycling PR & Comms Manager at Muc-Off Paul Sollenberger, Product Manager at CeramicSpeed What are the advantages, if any, of running oversized derailleur cages and pulleys? Kogel: The main goal for an oversized derailleur cage is to reduce drivetrain friction. Larger wheels require the chain to articulate less. Bending a chain causes friction between the plates. By making the wheels larger the chain needs to bend less every time it runs through the derailleur. Additionally, friction is reduced by using high quality bearings, and low contact seals. And lastly, a large wheel will have a lower rotating speed than a small wheel at a fixed chain speed. Although the effect of that last one is minimal. The Kogel Kolossos Oversize Derailleur Pulley on a Shimano GRX Gravel setup Muc-Off: The larger the pulley wheel diameter over stock allows the chain articulation angle to be reduced, resulting in a reduction of friction as the chain articulation angle has a direct impact on power loss. Work due to friction is dependent on the articulation angle (sliding distance) the larger the articulation angle, the larger the sliding distance hence the larger the work done (higher power loss). <img data-dominant-color="273738" data-has-transparency="false" style="--dominant-color: #273738;" decoding="async" class="lazyload not-transparent wp-image-244040 size-full" src="https://bikerumor.com/wp-content/uploads/2020/09/muc-off-lops-lightweight-oversize-precision-shifting-derailleur-pulley-4.jpg" alt="muc off lops oversized pulley system for mikel landa at tour de france" width="1200" height="800" srcset="https://bikerumor.com/wp-content/uploads/2020/09/muc-off-lops-lightweight-oversize-precision-shifting-derailleur-pulley-4.jpg 1200w, https://bikerumor.com/wp-content/uploads/2020/09/muc-off-lops-lightweight-oversize-precision-shifting-derailleur-pulley-4-297x198.jpg 297w, https://bikerumor.com/wp-content/uploads/2020/09/muc-off-lops-lightweight-oversize-precision-shifting-derailleur-pulley-4-800x533.jpg 800w, https://bikerumor.com/wp-content/uploads/2020/09/muc-off-lops-lightweight-oversize-precision-shifting-derailleur-pulley-4-120x80.jpg 120w, https://bikerumor.com/wp-content/uploads/2020/09/muc-off-lops-lightweight-oversize-precision-shifting-derailleur-pulley-4-768x512.jpg 768w, https://bikerumor.com/wp-content/uploads/2020/09/muc-off-lops-lightweight-oversize-precision-shifting-derailleur-pulley-4-720x480.jpg 720w" sizes="(max-width: 1200px) 100vw, 1200px" />Muc-Off’s Lightweight Oversized Precision Shifting (L.O.P.S.) system ​Being able to design and manufacture pulley wheels allows you to specify geometric details. These include aspects such as efficient tooth profiles and also specific materials and coatings for the wheels that reduce friction and increase performance. Bearings can be optimised for the specific oversize application giving scope to reduce frictional losses not considered in standard bearings. absoluteBLACK: The simple answer is power saving in the drivetrain. Most cyclists are familiar with the wattage savings that are possible to achieve with different chain lubricants. However, the lesser known things are the savings (and their principles) possible to achieve on the derailleur cage itself despite the fact that it is an “unloaded” part of the chain. Many cyclists are led to believe that “free spinning pulley bearings” are the source of most gains/savings in oversized pulley wheel cages but unfortunately that is not accurate. Free spinning without load is not relevant. What matters is how the bearings operate under real load conditions. Or, in other words, what is their coefficient of friction under the load of the chain. Moreover, bearing friction represents only a very small portion of overall savings. Meaning, both good pulley bearings consume less than 0.3W altogether. Better bearings can improve that by about 0.1W range. The measurable gains come from the cage’s spring tension preload modification, where up to 1.2W can be gained by changing the cage design to accommodate it. However, the biggest saving comes from the size of the pulleys. Larger pulleys reduce the rotation angle between chain link plates around pins during the operation (on the pulleys) hence why it reduces the friction on the chain itself. Or, in other words, the chain articulates less when engaging with a larger pulley, and therefore, encounters less friction. The value of that saving is dependent on the chain lubrication that was used. <img data-dominant-color="c3c4c3" data-has-transparency="false" style="--dominant-color: #c3c4c3;" decoding="async" class="lazyload not-transparent size-full wp-image-265681" src="https://bikerumor.com/wp-content/uploads/2021/07/Absolute-Black-carbon-ceramic-Hollow-Cage-low-friction-upgrade_angled.jpg" alt="Absolute Black carbon-ceramic Hollow Cage low friction upgrade" width="1050" height="800" srcset="https://bikerumor.com/wp-content/uploads/2021/07/Absolute-Black-carbon-ceramic-Hollow-Cage-low-friction-upgrade_angled.jpg 1050w, https://bikerumor.com/wp-content/uploads/2021/07/Absolute-Black-carbon-ceramic-Hollow-Cage-low-friction-upgrade_angled-297x226.jpg 297w, https://bikerumor.com/wp-content/uploads/2021/07/Absolute-Black-carbon-ceramic-Hollow-Cage-low-friction-upgrade_angled-800x610.jpg 800w, https://bikerumor.com/wp-content/uploads/2021/07/Absolute-Black-carbon-ceramic-Hollow-Cage-low-friction-upgrade_angled-120x91.jpg 120w, https://bikerumor.com/wp-content/uploads/2021/07/Absolute-Black-carbon-ceramic-Hollow-Cage-low-friction-upgrade_angled-768x585.jpg 768w" sizes="(max-width: 1050px) 100vw, 1050px" />The absoluteBLACK Hollow Cage gets a 12T upper guide pulley and an 18T lower guide pulley. c. absolute BLACK Our HOLLOWCAGE has however another very important advantage that separates us from other products of its kind. It silences the drivetrain. As it’s known, common polymer pulleys are fairly loud and aluminium pulleys are even louder as the material radiates the sound more than a polymer. We created a new generation of pulleys, which are able to reduce the sound level by 12-14dB when compared to stock DuraAce pulleys thanks to our patent pending solution incorporating special xring rubber bands to dampen the chain impact on pulleys. This corresponds to roughly 60% of the noise reduction. Practically speaking, the cage (and by this drivetrain) becomes very silent. An interesting fact is that over 80% of noise from a whole drivetrain comes from the top pulley engaging with the chain. Should you buy it? We were always up front saying that you should first invest in better wheels, tyres, a great chain lubricant and, for example, oval chainrings (as those upgrades will give you bigger savings all together) before you invest in an oversized pulley cage. Our system should be purchased when you have already made other upgrades as it’s the ‘cherry on top of the cake’ of the upgrades you can make. It would be the final step in drivetrain optimization which all together can provide you over 10 Watts of “free” power that is simply saved (not gained) by reducing the frictional losses in your drivetrain. CeramicSpeed: CeramicSpeed initially began development of our OSPW, or oversized pulley wheel system, to answer the question, ‘what could be done to further improve the efficiency of a drivetrain?’. Looking beyond a direct replacement of the pulley wheel bearings, we spent over 2 years of lab and field testing to validate the efficiency benefits possible by increasing pulley wheel sizes and modifying derailleur cage spring tension. Through this study, we identified three pieces that directly affect drivetrain and derailleur drag. First, and most obvious, is the size of the pulley wheel and its effect on chain articulation. As the chain moves through the derailleur cage, there are 4 points of chain articulation in which the chain plates and rollers slide against each other. While individually not a large consumption of energy, this compounds quickly during riding to the tune of more than 10,000 articulation movements at the derailleur pulleys per minute (95RPM, 53T chainring). The second area of friction impact is the overall speed of the pulley when and associated bearing. Pulley wheels have the fastest spinning bearings on a bike, to the tune of 4-5X your crank RPM. The easiest method of increasing the efficiency of a bearing is to reduce its speed, and larger pulleys can do this between 15-50% depending on final pulley size. <img decoding="async" class="lazyload aligncenter size-full wp-image-208072" src="https://bikerumor.com/wp-content/uploads/2019/01/CeramicSpeed-OSPW-X_oversized-CX-cyclocross-gravel-road-bike-pulleys_SRAM-clutched-Force1-Rival1_muddy-lead.jpg" alt="CeramicSpeed OSPW X oversized pulley wheel system CX cross cyclocross &amp; gravel road bikes SRAM Rival Force ceramic bearings" width="1500" height="1000" srcset="https://bikerumor.com/wp-content/uploads/2019/01/CeramicSpeed-OSPW-X_oversized-CX-cyclocross-gravel-road-bike-pulleys_SRAM-clutched-Force1-Rival1_muddy-lead.jpg 1500w, https://bikerumor.com/wp-content/uploads/2019/01/CeramicSpeed-OSPW-X_oversized-CX-cyclocross-gravel-road-bike-pulleys_SRAM-clutched-Force1-Rival1_muddy-lead-120x80.jpg 120w, https://bikerumor.com/wp-content/uploads/2019/01/CeramicSpeed-OSPW-X_oversized-CX-cyclocross-gravel-road-bike-pulleys_SRAM-clutched-Force1-Rival1_muddy-lead-297x198.jpg 297w, https://bikerumor.com/wp-content/uploads/2019/01/CeramicSpeed-OSPW-X_oversized-CX-cyclocross-gravel-road-bike-pulleys_SRAM-clutched-Force1-Rival1_muddy-lead-768x512.jpg 768w, https://bikerumor.com/wp-content/uploads/2019/01/CeramicSpeed-OSPW-X_oversized-CX-cyclocross-gravel-road-bike-pulleys_SRAM-clutched-Force1-Rival1_muddy-lead-600x400.jpg 600w, https://bikerumor.com/wp-content/uploads/2019/01/CeramicSpeed-OSPW-X_oversized-CX-cyclocross-gravel-road-bike-pulleys_SRAM-clutched-Force1-Rival1_muddy-lead-696x464.jpg 696w, https://bikerumor.com/wp-content/uploads/2019/01/CeramicSpeed-OSPW-X_oversized-CX-cyclocross-gravel-road-bike-pulleys_SRAM-clutched-Force1-Rival1_muddy-lead-1068x712.jpg 1068w, https://bikerumor.com/wp-content/uploads/2019/01/CeramicSpeed-OSPW-X_oversized-CX-cyclocross-gravel-road-bike-pulleys_SRAM-clutched-Force1-Rival1_muddy-lead-630x420.jpg 630w" sizes="(max-width: 1500px) 100vw, 1500px" /> The third primary impact comes not from the pulleys or their size, but rather the cage design and spring tension settings. Modern derailleurs rely on backward spring tension to accommodate the range of chain length necessary for your largest tooth count and smallest tooth count options in gearing setup. Factory derailleurs are designed to function reliably in a vast array of conditions, resulting in specifications that aim to be ‘one size fits most/all’. As the derailleur system is neutral from pedaling forces, chain tension and drag through the derailleur is a constant force that can be safely reduced for riders on moderate to smooth terrain. With our carefully designed OSPW cages featuring up to 4 spring tension settings, we can offer riders the ability to customize their cage tension to best suit their riding conditions and needs, without excess & unnecessary chain drag. With these friction influences addressed, we measure over a 40% increase in drivetrain efficiency when compared to a stock derailleur arrangement. The simplest way to view this, is more of your riding output makes it from the pedals, to the rear wheel without being wasted. Additionally, some derailleur systems can also benefit from increased cassette capacities, such as a 32T cassette on a 9100 derailleur with an OSPW system, beyond the factory limitations. Are we likely to see even bigger oversized derailleur pulleys anytime soon? Kogel: I doubt it. Maybe someone will develop a 20 tooth wheel, just to one-up the other players on the market. We have seen this happen in mountain bike cassettes recently. The main problem that is stopping Kogel from going larger than our current wheel size is ground clearance. As wheels get larger, the derailleur cage needs to be longer, especially on road derailleurs where the upper pulley runs in line with the pivot point. <img data-dominant-color="524a4c" data-has-transparency="false" style="--dominant-color: #524a4c;" decoding="async" class="lazyload not-transparent wp-image-273177 size-full" src="https://bikerumor.com/wp-content/uploads/2021/09/kogel-kolossos-road-oversize-derailleur-cage-pulley.jpg" alt="kogel kolossos oversize derailleur pulley cage" width="1600" height="1067" srcset="https://bikerumor.com/wp-content/uploads/2021/09/kogel-kolossos-road-oversize-derailleur-cage-pulley.jpg 1600w, https://bikerumor.com/wp-content/uploads/2021/09/kogel-kolossos-road-oversize-derailleur-cage-pulley-297x198.jpg 297w, https://bikerumor.com/wp-content/uploads/2021/09/kogel-kolossos-road-oversize-derailleur-cage-pulley-800x534.jpg 800w, https://bikerumor.com/wp-content/uploads/2021/09/kogel-kolossos-road-oversize-derailleur-cage-pulley-120x80.jpg 120w, https://bikerumor.com/wp-content/uploads/2021/09/kogel-kolossos-road-oversize-derailleur-cage-pulley-768x512.jpg 768w, https://bikerumor.com/wp-content/uploads/2021/09/kogel-kolossos-road-oversize-derailleur-cage-pulley-1536x1024.jpg 1536w, https://bikerumor.com/wp-content/uploads/2021/09/kogel-kolossos-road-oversize-derailleur-cage-pulley-720x480.jpg 720w" sizes="(max-width: 1600px) 100vw, 1600px" />The Kogel Kolossos for SRAM Red and Force Etap AXS gets a 14T upper pulley and a 19T lower pulley Mountain bike derailleurs have an offset upper pulley, which allows us to keep the cage length the same or even slightly shorter than the stock derailleur. There might be an opportunity to run a larger lower pulley, but that is not something we have on the drawing table right now. Muc-Off: With larger and lar'
