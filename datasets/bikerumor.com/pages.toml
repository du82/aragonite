title = "AASQ #134: Given the knobbly tires, do aero gravel wheels actually make sense? - Bikerumor"
description = """
Jessie-May Morgan is the UK & Ireland Tech Editor of Bikerumor. She has been writing about Mountain Bike Riding and Racing, and all its weird and wonderful technology for 4 years. Prior to that, she was an Intern at the Mountain Bike Center of Scotland, and a Mountain Bike Coach and Leader in the Tweed Valley.
Based in Innerleithen, Scotland, Jessie-May can often be seen riding the Glentress Trail Center, and its neighboring Enduro and Downhill Tracks. She regularly competes in Enduro at a national level, and has recently competed on the World Stage at a handful of Enduro World Series events.
For Bikerumor, Jessie-May is testing the latest mountain bikes, equipment and kit, letting readers know what’s hot and what’s not.
For context, she weighs 60kg and stands at 5ft 4″ tall (163cm)."""
full_description = 'Home > Feature Stories AASQ #134: Given the knobbly tires, do aero gravel wheels actually make sense? Written by Jessie-May Morgan Sep 10, 2021 9:35 a.m. ET Click to share on Facebook (Opens in new window)Click to email a link to a friend (Opens in new window) 4 Comments Support us! Bikerumor may earn a small commission from affiliate links in this article. Learn More We know, there’s no such thing as a stupid question. But there are some questions you might not want to ask your local shop or riding buddies. AASQ is our weekly series where we get to the bottom of your questions – serious or otherwise. Hit the link at the bottom of the post to submit your own question. This one is pretty timely, with the annual Dukes Weekender Gravel Enduro kicking off this weekend in Aberfoyle, Scotland. Given that most of the riders will be running tires with side knobs, will they be bothered about the aerodynamic properties of their rims? Quite rightly, this is what one of our readers has been wondering. This week, we are joined by the experts at ENVE, Fulcrum, HED Cycling and Vittoria, who are up for a discussion on the topic. Your contributors are: Ken Avery, SVP Product Development at Vittoria Industries North America Neil Shirley, Marketing Manager at ENVE Composites Andy Tetmeyer, Repository of Knowledge at HED Cycling Considering gravel tires have got side knobs that divert the airflow, do aero deep rims and aero spokes actually make sense in gravel? ENVE Composites: This is a question we receive frequently, and in order to get a clearer answer, we recently visited the wind tunnel with a mix of ENVE wheels that included our 25mm deep G23 gravel wheel, 39/43mm deep SES 3.4 AR, and 49/55mm deep SES 4.5 AR. ENVE recently updated their SES 3.4 AR wheelset to accommodate wider road tires We looked at how tire width impacted aero performance in each wheelset, in addition to how much difference in drag there was between treaded vs. slick tires. All testing was performed at 20 mph (the average speed of the fastest riders at an event such as Unbound). We’re working on compiling all of the data and plan to release it in its entirety when it’s ready, but what we do know is that, at the tested speed, there is an aerodynamic benefit to a deeper rim, even with a tire as wide as 38mm installed. There is also a 2-3 watt gain to be made with a slick tire over one with tread. Of course, if you were to look at aero data alone to determine the best setup for gravel, you could easily be making decisions that would ultimately hinder you, such as opting for a slick tire on a loose or technical course. <img decoding="async" class="lazyload wp-image-193783 size-full" src="https://bikerumor.com/wp-content/uploads/2018/06/enve-G23-G27-carbon-gravel-race-wheels-2018-d.jpg" alt="enve g-series g23 and g27 rim profiles and specs" width="1200" height="801" srcset="https://bikerumor.com/wp-content/uploads/2018/06/enve-G23-G27-carbon-gravel-race-wheels-2018-d.jpg 1200w, https://bikerumor.com/wp-content/uploads/2018/06/enve-G23-G27-carbon-gravel-race-wheels-2018-d-120x80.jpg 120w, https://bikerumor.com/wp-content/uploads/2018/06/enve-G23-G27-carbon-gravel-race-wheels-2018-d-297x198.jpg 297w, https://bikerumor.com/wp-content/uploads/2018/06/enve-G23-G27-carbon-gravel-race-wheels-2018-d-768x513.jpg 768w, https://bikerumor.com/wp-content/uploads/2018/06/enve-G23-G27-carbon-gravel-race-wheels-2018-d-600x401.jpg 600w, https://bikerumor.com/wp-content/uploads/2018/06/enve-G23-G27-carbon-gravel-race-wheels-2018-d-696x465.jpg 696w, https://bikerumor.com/wp-content/uploads/2018/06/enve-G23-G27-carbon-gravel-race-wheels-2018-d-1068x713.jpg 1068w, https://bikerumor.com/wp-content/uploads/2018/06/enve-G23-G27-carbon-gravel-race-wheels-2018-d-629x420.jpg 629w" sizes="(max-width: 1200px) 100vw, 1200px" />Check out Jason’s review of the ENVE G-Series wheels here Or, when it comes to wheel selection, the purpose-built G23 wheel is lighter, more compliant, and offers superior pinch flat protection, all of which can be of greater benefit than a more aero option. We believe that based on the average speeds for most gravel riders, aerodynamic gains are minimal, and making equipment decisions based solely on that will lead to poor performance. Vittoria: Logical question. Aero advantages are most commonly thought to be just in the direction of motion, but often times can come from slight cross winds as well, especially since Gravel courses tend to be routed through open fields. Also, depending on the profile and width of the rim, the tire shape could still be quite round, allowing the aero shape of the rim to still be of benefit. <img decoding="async" class="lazyload wp-image-156500 size-full" src="https://bikerumor.com/wp-content/uploads/2017/04/VittoriaElusionDiscWheels2017-3.jpg" alt="Vittoria Elusion Gravel Wheel" width="800" height="533" srcset="https://bikerumor.com/wp-content/uploads/2017/04/VittoriaElusionDiscWheels2017-3.jpg 800w, https://bikerumor.com/wp-content/uploads/2017/04/VittoriaElusionDiscWheels2017-3-120x80.jpg 120w, https://bikerumor.com/wp-content/uploads/2017/04/VittoriaElusionDiscWheels2017-3-297x198.jpg 297w, https://bikerumor.com/wp-content/uploads/2017/04/VittoriaElusionDiscWheels2017-3-768x512.jpg 768w, https://bikerumor.com/wp-content/uploads/2017/04/VittoriaElusionDiscWheels2017-3-600x400.jpg 600w" sizes="(max-width: 800px) 100vw, 800px" />Check out Jason’s review of the Vittoria Elusion Alloy Gravel wheelset here Lastly, consider that an aero profile rim is deeper and thus often times more stiff. This can help keep handling snappy, and allow the tire to be more easy to isolate in terms of deformation (which will then effect grip and compliance). HED Cycling: Yes, deeper rims and aero spokes make sense even with wider and knobby tires. Experience tells me I go faster on aero wheels relative to shallow ones on tires up to 42mm wide, so Vanquish 6 pro wheels are what I wear on my bike. I have not ridden wider tires than 42mm on gravel so I can’t tell you if there is an aero break-point where wide tires and knobs overcome rim aerodynamics. <img data-dominant-color="0d0c0c" data-has-transparency="false" style="--dominant-color: #0d0c0c;" decoding="async" class="lazyload not-transparent aligncenter size-full wp-image-243698" src="https://bikerumor.com/wp-content/uploads/2020/09/Jet-RC6-Black_Rear2.jpg" alt="hed jet 6" width="1200" height="1200" srcset="https://bikerumor.com/wp-content/uploads/2020/09/Jet-RC6-Black_Rear2.jpg 1200w, https://bikerumor.com/wp-content/uploads/2020/09/Jet-RC6-Black_Rear2-297x297.jpg 297w, https://bikerumor.com/wp-content/uploads/2020/09/Jet-RC6-Black_Rear2-800x800.jpg 800w, https://bikerumor.com/wp-content/uploads/2020/09/Jet-RC6-Black_Rear2-120x120.jpg 120w, https://bikerumor.com/wp-content/uploads/2020/09/Jet-RC6-Black_Rear2-768x768.jpg 768w" sizes="(max-width: 1200px) 100vw, 1200px" /> In addition to anecdotal experience, we (HED) had this same question in 2014 so, when we were at the wind tunnel that year, we did a couple runs to get some data. The chart below shows a quick run with our Ardennes Plus wheel and our Jet 6 wheel at 20 mph with a 35mm Conti CX speed tire. The Ardennes is 25mm deep and the Jet 6 is 60mm deep. Both are 21mm internal and 25mm external at the “brake” track. The Jet measured lower drag. At least with a 35mm somewhat knobby tire, aero has measurably lower drag. <img data-dominant-color="f3f3f3" data-has-transparency="false" style="--dominant-color: #f3f3f3;" decoding="async" class="lazyload not-transparent wp-image-271073 size-full" src="https://bikerumor.com/wp-content/uploads/2021/09/hed-cycling-ardennes-plus-versus-jet-6-drag-conti-cx-speed-tire.jpg" alt="hed ardennes plus versus jet 6 conti cx tires drag measured wind tunnel data" width="1600" height="1066" srcset="https://bikerumor.com/wp-content/uploads/2021/09/hed-cycling-ardennes-plus-versus-jet-6-drag-conti-cx-speed-tire.jpg 1600w, https://bikerumor.com/wp-content/uploads/2021/09/hed-cycling-ardennes-plus-versus-jet-6-drag-conti-cx-speed-tire-297x198.jpg 297w, https://bikerumor.com/wp-content/uploads/2021/09/hed-cycling-ardennes-plus-versus-jet-6-drag-conti-cx-speed-tire-800x533.jpg 800w, https://bikerumor.com/wp-content/uploads/2021/09/hed-cycling-ardennes-plus-versus-jet-6-drag-conti-cx-speed-tire-120x80.jpg 120w, https://bikerumor.com/wp-content/uploads/2021/09/hed-cycling-ardennes-plus-versus-jet-6-drag-conti-cx-speed-tire-768x512.jpg 768w, https://bikerumor.com/wp-content/uploads/2021/09/hed-cycling-ardennes-plus-versus-jet-6-drag-conti-cx-speed-tire-1536x1023.jpg 1536w, https://bikerumor.com/wp-content/uploads/2021/09/hed-cycling-ardennes-plus-versus-jet-6-drag-conti-cx-speed-tire-720x480.jpg 720w" sizes="(max-width: 1600px) 100vw, 1600px" />Wind Tunnel Testing. Triangle Data Set: Ardennes Plus w/ Conti CX 35mm Tire; Square Data Set: Jet 6 w/ Conti CX 35mm Tire Got a question of your own? Click here to use the Ask A Stupid Question form to submit questions on any cycling-related topic of your choice, and we’ll get the experts to answer them for you! Topics AASQ Feature Stories Gravel Bikes'
