["https://bikerumor.com/bbbs-new-flux-lenses-valor-sunglasses"]
title = "BBB’s New Valor Sunglasses Deliver High Contrast with FLUX Lenses - Bikerumor"
description = "Steve Fisher is a staff contributor for Bikerumor. Steve has been writing about trail, enduro and downhill mountain biking (plus a few commuter bikes) for seven years. Prior to that, Steve wrote for Whistler Traveller Magazine and Mountain Life Magazine. Steve is based in Pemberton, British Columbia, an area that offers plenty of challenging world-class singletrack and makes for great photos!"
full_description = 'Home > Clothing-Gear-Tools BBB’s New Valor Sunglasses Deliver High Contrast with FLUX Lenses Written by Steve Fisher Feb 25, 2025 11:23 a.m. ET Click to share on Facebook (Opens in new window)Click to email a link to a friend (Opens in new window) 3 Comments Support us! Bikerumor may earn a small commission from affiliate links in this article. Learn More Another contender in the mid-priced eyewear market, Denmark’s the Netherlands’ BBB has just announced new discipline-specific FLUX lenses alongside a new Valor sunglass model. If you’re not familiar with BBB, they’ve been producing bike components, accessories and cycling apparel since 1998. BBB’s FLUX lenses are a new offering that provides four different options for high-contrast, color-tuned optics. Three of the models are specifically ideal for road, MTB, or gravel riding, and the fourth is an all-conditions lens. The new FLUX lenses are available on BBB’s existing Chester sunglasses and the brand-new Valor model. FLUX Lenses: BBB’s most advanced lens to date, the FLUX lenses filter out non-essential wavelengths of red, green, and blue light to improve clarity and increase contrast. This helps your eyes perceive details, differentiate between colors, and experience less fatigue. The lenses allow for bright, high-contrast vision in all conditions, but there are four specific tints that cater to different riding styles. <img data-dominant-color="eae9e8" data-has-transparency="false" decoding="async" width="1200" height="793" src="https://bikerumor.com/wp-content/uploads/2025/02/BBB-FLUX-lens-graphic.webp" alt="BBB FLUX lens graphic" class="lazyload not-transparent wp-image-377681" style="--dominant-color: #eae9e8; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/BBB-FLUX-lens-graphic.webp 1200w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-FLUX-lens-graphic-297x196.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-FLUX-lens-graphic-120x79.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-FLUX-lens-graphic-768x508.webp 768w" sizes="(max-width: 1200px) 100vw, 1200px" /> The FLUX lenses also provide 100% UV-A and UV-B protection, plus they filter harmful blue light and infrared light. Both sides of the lenses are protected with an anti-scratch coating. The outside of the lens also gets an oleophobic coating to resist water, mud, and dust. An anti-fog treatment on the inside of the lens helps fight off condensation. The new FLUX lenses are available on the new Valor sunglasses and BBB’s updated Chester sunglasses. There are four different FLUX lenses available for road, MTB, gravel, and all-around riding: <img data-dominant-color="b9b1ac" data-has-transparency="false" decoding="async" width="1200" height="800" src="https://bikerumor.com/wp-content/uploads/2025/02/BBB-FLUX-lens-red.webp" alt="BBB FLUX lens, red" class="lazyload not-transparent wp-image-377684" style="--dominant-color: #b9b1ac; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/BBB-FLUX-lens-red.webp 1200w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-FLUX-lens-red-297x198.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-FLUX-lens-red-120x80.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-FLUX-lens-red-768x512.webp 768w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-FLUX-lens-red-800x533.webp 800w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-FLUX-lens-red-720x480.webp 720w" sizes="(max-width: 1200px) 100vw, 1200px" /> FLUX Red: Intended for road riding, this lens allows 16.8% light transmission. The red lens filters out warm tones to enhance contrast on asphalt and cobblestones. It is suitable for sunny or cloudy conditions. <img data-dominant-color="c1c2c8" data-has-transparency="false" decoding="async" width="1200" height="800" src="https://bikerumor.com/wp-content/uploads/2025/02/BBB-FLUX-lens-blue.webp" alt="BBB FLUX lens, blue" class="lazyload not-transparent wp-image-377679" style="--dominant-color: #c1c2c8; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/BBB-FLUX-lens-blue.webp 1200w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-FLUX-lens-blue-297x198.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-FLUX-lens-blue-120x80.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-FLUX-lens-blue-768x512.webp 768w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-FLUX-lens-blue-800x533.webp 800w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-FLUX-lens-blue-720x480.webp 720w" sizes="(max-width: 1200px) 100vw, 1200px" /> FLUX Blue: Providing the most color enhancement of all the options, the FLUX Blue lens is ideal for gravel riders. This lens increases contrast on dirt pathways and works well for sunny or shady rides with a light transmission of 14.6%. <img data-dominant-color="b3b9b3" data-has-transparency="false" decoding="async" width="1200" height="800" src="https://bikerumor.com/wp-content/uploads/2025/02/BBB-FLUX-lens-green.webp" alt="BBB FLUX lens, green" class="lazyload not-transparent wp-image-377682" style="--dominant-color: #b3b9b3; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/BBB-FLUX-lens-green.webp 1200w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-FLUX-lens-green-297x198.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-FLUX-lens-green-120x80.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-FLUX-lens-green-768x512.webp 768w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-FLUX-lens-green-800x533.webp 800w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-FLUX-lens-green-720x480.webp 720w" sizes="(max-width: 1200px) 100vw, 1200px" /> FLUX Green: Mountain bikers should opt for the green lens; which maximizes contrast from brown and yellow hues. This makes it easier to see roots, rocks, and trail surfaces. The lens also boosts green tones to separate the forest from the open trail ahead. The green lens allows 16% light transmission. <img data-dominant-color="b7b1ac" data-has-transparency="false" decoding="async" width="1200" height="800" src="https://bikerumor.com/wp-content/uploads/2025/02/BBB-FLUX-lens-pure.webp" alt="BBB FLUX lens, pure" class="lazyload not-transparent wp-image-377683" style="--dominant-color: #b7b1ac; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/BBB-FLUX-lens-pure.webp 1200w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-FLUX-lens-pure-297x198.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-FLUX-lens-pure-120x80.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-FLUX-lens-pure-768x512.webp 768w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-FLUX-lens-pure-800x533.webp 800w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-FLUX-lens-pure-720x480.webp 720w" sizes="(max-width: 1200px) 100vw, 1200px" /> FLUX Pure: If you want one pair of sunglasses that work well anywhere, the FLUX Pure lens is your all-conditions option. This lens enhances contrast to reduce eye strain for any type of rider. At 12.5% light transmission it is ideal for brighter rides but isn’t too dark for overcast conditions or shady forest patches. Valor FLUX Sunglasses: <img data-dominant-color="6a6d69" data-has-transparency="false" decoding="async" width="1200" height="772" src="https://bikerumor.com/wp-content/uploads/2025/02/BBB-Valor-FLUX.webp" alt="BBB Valor FLUX sunglasses, front" class="lazyload not-transparent wp-image-377685" style="--dominant-color: #6a6d69; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/BBB-Valor-FLUX.webp 1200w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-Valor-FLUX-297x191.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-Valor-FLUX-120x77.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-Valor-FLUX-768x494.webp 768w" sizes="(max-width: 1200px) 100vw, 1200px" /> The new Valor sunglasses feature a half-frame design. The frames are made of Rilsan™ G850, a bio-based Nylon produced from castor beans. The material is flexible and strong and can be produced sustainably. The Valor lens features a small vent at the top to combat condensation buildup. To ensure a solid fit, the frames offer slightly curved arms, rubberized temple grippers, and an adjustable nosepiece. Weight is listed at 30g. <img data-dominant-color="a29490" data-has-transparency="false" decoding="async" width="1200" height="837" src="https://bikerumor.com/wp-content/uploads/2025/02/BBB-Valor-FLUX-sunglasses-inside.webp" alt="BBB Valor FLUX sunglasses, inside" class="lazyload not-transparent wp-image-377687" style="--dominant-color: #a29490; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/BBB-Valor-FLUX-sunglasses-inside.webp 1200w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-Valor-FLUX-sunglasses-inside-297x207.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-Valor-FLUX-sunglasses-inside-120x84.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-Valor-FLUX-sunglasses-inside-768x536.webp 768w" sizes="(max-width: 1200px) 100vw, 1200px" /> The Valor FLUX model comes with a clear lens and a FLUX lens, plus a hard case and soft pouch. MSRP is €129. Frame color options are Matt Black, Light Grey, or Transparent Green. Chester FLUX: <img data-dominant-color="adafb6" data-has-transparency="false" decoding="async" width="1200" height="800" src="https://bikerumor.com/wp-content/uploads/2025/02/BBB-Chester-FLUX-sunglasses.webp" alt="BBB Chester FLUX sunglasses, front" class="lazyload not-transparent wp-image-377678" style="--dominant-color: #adafb6; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/BBB-Chester-FLUX-sunglasses.webp 1200w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-Chester-FLUX-sunglasses-297x198.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-Chester-FLUX-sunglasses-120x80.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-Chester-FLUX-sunglasses-768x512.webp 768w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-Chester-FLUX-sunglasses-800x533.webp 800w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-Chester-FLUX-sunglasses-720x480.webp 720w" sizes="(max-width: 1200px) 100vw, 1200px" /> BBB’s most popular unisex eyewear model, the Chester is a full-frame sunglass that has been updated with an improved temple design and new FLUX lens options. The Chester frames are also made from bio-based Rilsan™ G850, and the nose piece is adjustable. The Chester FLUX retails for €89.99, and includes a spare clear lens, hard case, and soft pouch. Lens options are FLUX Red or FLUX Blue, and frame color options are Matt Black or Gloss Black. <img data-dominant-color="85807e" data-has-transparency="false" decoding="async" width="1200" height="800" src="https://bikerumor.com/wp-content/uploads/2025/02/BBB-Chester-FLUX-on-man.webp" alt="BBB Chester FLUX sunglasses, on man" class="lazyload not-transparent wp-image-377677" style="--dominant-color: #85807e; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/BBB-Chester-FLUX-on-man.webp 1200w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-Chester-FLUX-on-man-297x198.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-Chester-FLUX-on-man-120x80.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-Chester-FLUX-on-man-768x512.webp 768w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-Chester-FLUX-on-man-800x533.webp 800w, https://bikerumor.com/wp-content/uploads/2025/02/BBB-Chester-FLUX-on-man-720x480.webp 720w" sizes="(max-width: 1200px) 100vw, 1200px" />Images c. BBB Cycling BBB products are not distributed in the USA but are sold across Europe and the Middle East, plus in Australia and Canada. bbbcycling.com Topics Clothing-Gear-Tools News BBB sunglasses'
