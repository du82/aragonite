title = "Devinci’s New Hatchet Gravel Lineup Splits Into Carbon, Aluminum or Electric - Bikerumor"
description = "Steve Fisher is a staff contributor for Bikerumor. Steve has been writing about trail, enduro and downhill mountain biking (plus a few commuter bikes) for seven years. Prior to that, Steve wrote for Whistler Traveller Magazine and Mountain Life Magazine. Steve is based in Pemberton, British Columbia, an area that offers plenty of challenging world-class singletrack and makes for great photos!"
full_description = 'Home > Bike Types > Gravel Bikes Devinci’s New Hatchet Gravel Lineup Splits Into Carbon, Aluminum or Electric Gravel riding is a versatile discipline - It can draw in fitness minded riders looking for more excitement than paved roads offer, or attract bikepackers and backcountry explorers cranking out all-day rides on varying terrain. Devinci Cycles’ updated Hatchet lineup offers high-performance carbon models, budget-friendly aluminum framed options, and even a pedal assisted E-Hatchet. Written by Steve Fisher Feb 26, 2025 10:00 a.m. ET Click to share on Facebook (Opens in new window)Click to email a link to a friend (Opens in new window) Support us! Bikerumor may earn a small commission from affiliate links in this article. Learn More Gravel riding is a versatile discipline – It can draw in the gravel racers, fitness-minded riders looking for more excitement than paved roads offer, mountain bikers looking for underbiking challenges, or even bikepackers and backcountry explorers cranking out all-day rides on varying terrain. Devinci Cycles’ updated Hatchet lineup is just as versatile, with high-performance carbon models, budget-friendly aluminum framed options, and even a pedal-assisted E-Hatchet. The new Hatchet lineup is comprised of three models– The Hatchet PRO, Hatchet Vista, and the E-Hatchet Tour. Devinci is offering three builds for the PRO model, two for the Vista model, and just one for the E-Hatchet Tour. Check out the details and specs on the whole lineup below. Devinci Hatchet PRO: The new Hatchet PRO boasts a completely redesigned carbon OSC (Optimal Strength Carbon) frame. All three Hatchet PRO builds come with a full carbon OSC fork. The revised frame features a more aerodynamic shape and is significantly stiffer than the previous version. Devinci also uses size-specific carbon layups to ensure that all frame sizes wind up with consistent stiffness levels. Devinci has tuned the frame’s stiffness by employing a unique layup of high-strength and high-modulus carbon fibers. The lower part of the Hatchet PRO’s frame is strengthened to ensure efficient power transfer and optimal lateral stiffness. The upper half is kept leaner, providing compliance and ride comfort. <img data-dominant-color="1b1d21" data-has-transparency="false" decoding="async" width="1200" height="800" src="https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-Shed-storage.webp" alt="Devinci Hatchet PRO, Shed frame storage" class="lazyload not-transparent wp-image-377563" style="--dominant-color: #1b1d21; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-Shed-storage.webp 1200w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-Shed-storage-297x198.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-Shed-storage-120x80.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-Shed-storage-768x512.webp 768w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-Shed-storage-800x533.webp 800w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-Shed-storage-720x480.webp 720w" sizes="(max-width: 1200px) 100vw, 1200px" /> As in-frame storage is quickly gaining popularity beyond MTBs, Devinci has included their Shed storage system in the Hatchet PRO’s downtube. A zippered tool bag is included with each bike. For hydration, all frame sizes offer ample room for two water bottles. Keeping things looking slick, Devinci went with thru-headset internal cable routing. The Hatchet PROs run Acros IPS (Internal Protection Sealing) headsets, designed to keep the bearings clean and dry. <img data-dominant-color="1d1f23" data-has-transparency="false" decoding="async" width="1200" height="800" src="https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-UDH-derailleur.webp" alt="Devinci Hatchet PRO, UDH" class="lazyload not-transparent wp-image-377565" style="--dominant-color: #1d1f23; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-UDH-derailleur.webp 1200w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-UDH-derailleur-297x198.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-UDH-derailleur-120x80.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-UDH-derailleur-768x512.webp 768w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-UDH-derailleur-800x533.webp 800w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-UDH-derailleur-720x480.webp 720w" sizes="(max-width: 1200px) 100vw, 1200px" /> The Hatchet PRO frame has an integrated seat clamp, and it accepts 27.2mm seat posts… including dropper posts! The frame uses a UDH derailleur hanger, and is compatible with SRAM Full Mount derailleurs. The bottom bracket is a 386 EVO press-fit type, and the Hatchet PRO frame has enough clearance for 700x45mm tires. The top tube includes a bento box mount for frame bags. <img data-dominant-color="393939" data-has-transparency="false" decoding="async" width="1200" height="800" src="https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-front-derailleur.webp" alt="Devinci Hatchet PRO, front derailleur" class="lazyload not-transparent wp-image-377557" style="--dominant-color: #393939; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-front-derailleur.webp 1200w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-front-derailleur-297x198.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-front-derailleur-120x80.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-front-derailleur-768x512.webp 768w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-front-derailleur-800x533.webp 800w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-front-derailleur-720x480.webp 720w" sizes="(max-width: 1200px) 100vw, 1200px" /> The Hatchet PRO also comes with a cover for the front derailleur mount. Those who prefer 1x setups can ditch the front mech and cap off the mounting area neatly. Geometry: The new Hatchet PRO offers updated geometry – Devinci gave the bike a steeper head angle, and shorter chainstays for a more aggressive ride plus more ‘all-road’ capability. <img data-dominant-color="2b2b2a" data-has-transparency="false" decoding="async" width="1200" height="635" src="https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-geometry.webp" alt="Devinci Hatchet PRO, geo" class="lazyload not-transparent wp-image-377558" style="--dominant-color: #2b2b2a; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-geometry.webp 1200w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-geometry-297x157.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-geometry-120x64.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-geometry-768x406.webp 768w" sizes="(max-width: 1200px) 100vw, 1200px" /> Model Lineup: Rival AXS 24s – $5399 <img data-dominant-color="cccccd" data-has-transparency="false" decoding="async" width="1200" height="675" src="https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-Rival-side.webp" alt="Devinci Hatchet PRO Rival, side" class="lazyload not-transparent wp-image-377561" style="--dominant-color: #cccccd; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-Rival-side.webp 1200w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-Rival-side-297x167.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-Rival-side-120x68.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-Rival-side-768x432.webp 768w" sizes="(max-width: 1200px) 100vw, 1200px" /> <img data-dominant-color="2b2c28" data-has-transparency="false" decoding="async" width="1200" height="688" src="https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-Rival-specs.webp" alt="Devinci Hatchet PRO Rival AXS specs" class="lazyload not-transparent wp-image-377562" style="--dominant-color: #2b2c28; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-Rival-specs.webp 1200w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-Rival-specs-297x170.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-Rival-specs-120x69.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-Rival-specs-768x440.webp 768w" sizes="(max-width: 1200px) 100vw, 1200px" /> The Hatchet PRO Rival AXS 24s comes in one Gloss/Matte Incognito colorway. Weight is listed at 19.07 lbs (size medium). Apex AXS 12s – $3799 <img data-dominant-color="d2d0d0" data-has-transparency="false" decoding="async" width="1200" height="675" src="https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-Apex-side.webp" alt="Devinci Hatchet PRO Apex, side" class="lazyload not-transparent wp-image-377554" style="--dominant-color: #d2d0d0; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-Apex-side.webp 1200w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-Apex-side-297x167.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-Apex-side-120x68.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-Apex-side-768x432.webp 768w" sizes="(max-width: 1200px) 100vw, 1200px" /> <img data-dominant-color="2b2b28" data-has-transparency="false" decoding="async" width="1200" height="687" src="https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-Apex-specs.webp" alt="Devinci Hatchet PRO Apex specs" class="lazyload not-transparent wp-image-377555" style="--dominant-color: #2b2b28; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-Apex-specs.webp 1200w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-Apex-specs-297x170.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-Apex-specs-120x69.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-Apex-specs-768x440.webp 768w" sizes="(max-width: 1200px) 100vw, 1200px" /> The Hatchet PRO Apex AXS 12s also comes in the Gloss/Matte Incognito colorway. Claimed weight is 19.95 lbs. GRX 600 22s – *This model is available in Canada only. MSRP is $3399 CAD.* <img data-dominant-color="cbcbcb" data-has-transparency="false" decoding="async" width="1200" height="675" src="https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-GRX-side.webp" alt="Devinci Hatchet PRO GRX, side" class="lazyload not-transparent wp-image-377560" style="--dominant-color: #cbcbcb; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-GRX-side.webp 1200w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-GRX-side-297x167.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-GRX-side-120x68.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-GRX-side-768x432.webp 768w" sizes="(max-width: 1200px) 100vw, 1200px" /> <img data-dominant-color="2b2c28" data-has-transparency="false" decoding="async" width="1200" height="712" src="https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-GRX-600-specs.webp" alt="Devinci Hatchet PRO GRX 600 specs" class="lazyload not-transparent wp-image-377559" style="--dominant-color: #2b2c28; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-GRX-600-specs.webp 1200w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-GRX-600-specs-297x176.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-GRX-600-specs-120x71.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-PRO-GRX-600-specs-768x456.webp 768w" sizes="(max-width: 1200px) 100vw, 1200px" /> The Hatchet PRO GRX 600 22s is available in one Gloss/Matte Black Dust color. Devinci lists its weight at 21.27 lbs. Devinci Hatchet Vista: <img data-dominant-color="625f37" data-has-transparency="false" decoding="async" width="1200" height="800" src="https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-Vista-front-angle.webp" alt="Devinci Hatchet Vista, front angle" class="lazyload not-transparent wp-image-377568" style="--dominant-color: #625f37; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-Vista-front-angle.webp 1200w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-Vista-front-angle-297x198.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-Vista-front-angle-120x80.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-Vista-front-angle-768x512.webp 768w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-Vista-front-angle-800x533.webp 800w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-Vista-front-angle-720x480.webp 720w" sizes="(max-width: 1200px) 100vw, 1200px" /> A more affordable model built with entry and mid-level components, the Hatchet Vista is ideal for those starting into gravel riding or for light bikepacking trips. Devinci aimed to keep the price tag within reason so buyers could have money left over for accessories like bags, racks, etc. The new Hatchet Vista is built around an updated Optimum R03 6061-T6 aluminum frame. The frame features hydro-formed, triple-reinforced tubing to offer light weight, durability, comfort, and efficient power transfer. Its revised geometry prioritizes comfort for long rides, and the frame’s aesthetics have been updated. The Hatchet Vistas come with Devinci’s full carbon OSC fork. <img data-dominant-color="6e6442" data-has-transparency="false" decoding="async" width="1200" height="800" src="https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-Vista-routing.webp" alt="Devinci Hatchet Vista, routing" class="lazyload not-transparent wp-image-377572" style="--dominant-color: #6e6442; object-fit:full" srcset="https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-Vista-routing.webp 1200w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-Vista-routing-297x198.webp 297w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-Vista-routing-120x80.webp 120w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-Vista-routing-768x512.webp 768w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-Vista-routing-800x533.webp 800w, https://bikerumor.com/wp-content/uploads/2025/02/Devinci-Hatchet-Vista-routing-720x480.webp 720w" sizes="(max-width: 1200px) 100vw, 1200px" /> The Hatchet Vista’s f'
