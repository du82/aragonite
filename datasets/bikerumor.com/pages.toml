["https://bikerumor.com/best-bike-chain-lube"]
title = "The Best Bike Chain Lubes of 2024 - Bikerumor"
description = """
Think about all of the work that your bicycle chain does. It’s what makes your bike move forward, and every revolution of your pedals forces each chain link to click over hundreds of teeth on your chainring and cassette. You’re basically grinding metal on metal.



If the chain is dry, rusty, or coated with a layer of grime, it reluctantly creaks and grinds through each pedal stroke while the friction and contaminants slowly grind at the contact surfaces and cause all of the components, the chain, cassette, and chainring, to wear out.



Chain lube not only protects against corrosion, but it reduces friction to help keep that chain moving freely which can enhance efficiency and reduce the wear on your drivetrain. It helps to keep your drivetrain running smoothly and quietly and can extend the service life of all your drivetrain components."""
full_description = 'Home > Buyers Guides The Best Bike Chain Lubes of 2024 There are few, if any, components on your bike that work as hard as your chain does, and keeping it clean and well lubricated can help it run smooth and quiet, extend the lifespan of your drivetrain, and help improve your efficiency. Written by Bennett Shane and Molly Hurford Feb 07, 2024 4:13 p.m. ET Click to share on Facebook (Opens in new window)Click to email a link to a friend (Opens in new window) Support us! Bikerumor may earn a small commission from affiliate links in this article. Learn More A quality chain lubricant is vital for the performance and lifespan of the entire drivetrain. As the chain runs across your cassette, chainrings, and rear derailleur pulleys, any contamination or lack of lubrication will gradually wear down the precisely machined teeth of these components, leading to noise, a reduction of efficiency, sloppy shifting, and eventually, a hefty replacement cost. Think of the chain as the heart of your bike’s drivetrain. If it’s gunked up with contaminants, it’s not able to function efficiently, and performance suffers. Not only will you waste power overcoming more friction in your chain, but that friction will accelerate wear on all of your drivetrain components, which can combine to cost many hundreds of dollars to replace. By making a small investment in a quality chain lube, big gains in not only performance but bank account balances can be achieved. There are a dizzying number of chain lubes on the market, with wet lubes, dry lubes, and wax-based drip-on coatings all claiming to be the best. All these options can make it hard to figure out which is the best lube for your bike, riding style, and the conditions you encounter out on the road or trail. Additionally, there are very strong and widely varying opinions on what lubes are the best. Based on our experience, popularity, and independent test lab results, we gathered 14 of the best chain lubes on the market to test and compare. Our top chain lube recommendations are listed below, followed by the best of the rest which we feel are all worthy of consideration as well. To see all the chain lubes we tested at a glance, check out our comparison chart. If you’re unsure of what you need, our buying advice includes helpful information to guide your purchase decision, and we’ve got answers to common questions in our FAQ section. The Best Bike Chain Lubes of 2024 Best Overall Drip Wax Chain Lube: Effetto Mariposa Flowerpower Wax Best Value Drip Wax Chain Lube: Squirt Long Lasting Chain Lube Runner-Up Best Drip Wax Chain Lube: Ceramic Speed UFO Drip All Conditions Best Money-No-Object Chain Lube: absoluteBLACK Graphenlube Best Overall Wet Chain Lube: Silca Synergetic Wet Lube Best Value Wet Chain Lube: WD-40 Specialist Bike Wet Lube Easiest Chain Lube to Use: Wolf Tooth WT-1 Chain Lube Best Overall Drip Wax Chain Lube Effetto Mariposa Flowerpower Wax Check Price at Amazon <img width="2229" height="1486" decoding="async" src="https://bikerumor.com/wp-content/uploads/2024/01/Effetto-Mariposa-Flowerpower-Wax.jpeg" class="lazyload attachment-ldm-product-thumbnail size-ldm-product-thumbnail not-transparent wp-post-image" alt="The Best Bike Chain Lubes of 2024" itemprop="image" srcset="https://bikerumor.com/wp-content/uploads/2024/01/Effetto-Mariposa-Flowerpower-Wax.jpeg 2229w, https://bikerumor.com/wp-content/uploads/2024/01/Effetto-Mariposa-Flowerpower-Wax-297x198.jpeg 297w, https://bikerumor.com/wp-content/uploads/2024/01/Effetto-Mariposa-Flowerpower-Wax-800x533.jpeg 800w, https://bikerumor.com/wp-content/uploads/2024/01/Effetto-Mariposa-Flowerpower-Wax-120x80.jpeg 120w, https://bikerumor.com/wp-content/uploads/2024/01/Effetto-Mariposa-Flowerpower-Wax-768x512.jpeg 768w, https://bikerumor.com/wp-content/uploads/2024/01/Effetto-Mariposa-Flowerpower-Wax-1536x1024.jpeg 1536w, https://bikerumor.com/wp-content/uploads/2024/01/Effetto-Mariposa-Flowerpower-Wax-2048x1365.jpeg 2048w, https://bikerumor.com/wp-content/uploads/2024/01/Effetto-Mariposa-Flowerpower-Wax-720x480.jpeg 720w" sizes="(max-width: 2229px) 100vw, 2229px" data-has-transparency="false" data-dominant-color="f9f8f9" style="--dominant-color: #f9f8f9;" /> Specifications MSRP: $21.00 (100ml), $68.00 (500ml) Volume: 100ml (4.06 oz), 500ml (16.9 oz) Price Per Ounce: $5.17 (100ml size) Type: Wax Composition: Sunflower Seed Wax, NO hazardous additives Recommended use: All conditions Pros Highly efficient Over 50% wax content Long-lasting Biodegradable Cons Requires perfectly clean chain Bennett Shane Effetto Mariposa Flowerpower Wax is a chain lube for the 21st century and beyond, offering not only the best performance of any drip lubricant ever tested but also an environmentally safe formulation that includes no harmful additives and is plant-based. During this test, we were impressed with how quiet the chain remained, especially in the absence of the additives that many other lubes include. When it was time to reapply (after multiple bike cleanings, by the way) we were further impressed with how clean the entire drivetrain was. Chainrings, cassette, derailleur pulleys and, of course, the chain itself were virtually spotless. This also has to do with the fact that we followed Effetto Mariposa’s advice about stripping the chain clean before the initial application, something that’s necessary to get good results from any wax-based chain lubricant. Effetto Mariposa claims 600km, about 370 miles, per application of Flowerpower when riding on dry paved roads. Our test period for Flowerpower was extremely wet, so we’ll have to take them at their word there. We can confirm that Flowerpower held on effectively during wet test rides and only needed to be reapplied after 200km of wet conditions riding, which is still quite impressive. We’d expect to go much further between reapplications in dry conditions.When everything in the bike industry seems to be getting crazy expensive, we appreciate Effetto Mariposa ensuring that each container of Flowerpower exceeds 50% wax-to-water ratio, which means that compared to some other brands, you’re getting as much as 20% more lubricant per ounce of volume. And, even if you only get half of their claimed distance between reapplications, a bottle still lasts a long time.On top of that, the independent test lab, Zero Friction Cycling, has tested Flowerpower and honored it as the best drip wax chain lubricant available for its wear rate and contamination resistance. It’s moderately expensive but not astronomically priced, won’t hurt the planet, and isn’t a just bottle of mainly water claiming to be chain lube. For all these reasons, Effetto Mariposa Flowerpower our favorite Drip Wax Lube and makes a great choice whether you’re just getting into the world of wax-based lubes, or have been doing it for ages with a different brand. Best Value Drip Wax Chain Lube Squirt Long Lasting Chain Lube Check Price at BackcountryCheck Price at Amazon <img width="2241" height="1494" decoding="async" src="https://bikerumor.com/wp-content/uploads/2024/01/Squirt-Long-Lasting-Chain-Lube.jpeg" class="lazyload attachment-ldm-product-thumbnail size-ldm-product-thumbnail not-transparent wp-post-image" alt="The Best Bike Chain Lubes of 2024" itemprop="image" srcset="https://bikerumor.com/wp-content/uploads/2024/01/Squirt-Long-Lasting-Chain-Lube.jpeg 2241w, https://bikerumor.com/wp-content/uploads/2024/01/Squirt-Long-Lasting-Chain-Lube-297x198.jpeg 297w, https://bikerumor.com/wp-content/uploads/2024/01/Squirt-Long-Lasting-Chain-Lube-800x533.jpeg 800w, https://bikerumor.com/wp-content/uploads/2024/01/Squirt-Long-Lasting-Chain-Lube-120x80.jpeg 120w, https://bikerumor.com/wp-content/uploads/2024/01/Squirt-Long-Lasting-Chain-Lube-768x512.jpeg 768w, https://bikerumor.com/wp-content/uploads/2024/01/Squirt-Long-Lasting-Chain-Lube-1536x1024.jpeg 1536w, https://bikerumor.com/wp-content/uploads/2024/01/Squirt-Long-Lasting-Chain-Lube-2048x1365.jpeg 2048w, https://bikerumor.com/wp-content/uploads/2024/01/Squirt-Long-Lasting-Chain-Lube-720x480.jpeg 720w" sizes="(max-width: 2241px) 100vw, 2241px" data-has-transparency="false" data-dominant-color="dbe2e8" style="--dominant-color: #dbe2e8;" /> Specifications MSRP: $15 Volume: 4 oz (120ml), also comes in 15ml and 500ml Price Per Ounce: $3.75 Type: Wax Composition: 100% biodegradable waxes with water Recommended use: All Conditions Pros Runs quiet Inexpensive Extends drivetrain service life Cons Can separate if it freezes Bennett Shane Squirt Long Lasting Chain Lube is a blend of paraffin and hydrocarbon waxes, water, and emulsifiers, and applies milky white and then dries after application. The dried, or cured lubricant forms a shield against contaminants that would otherwise cling to the surfaces of the chain rollers and accelerate the wear that eventually kills every chain. With Squirt, and many other wax-based lubricants, this wear is significantly delayed, allowing chains used in dry, and less dusty environments to last a long time. With Squirt, it’s important that the chain, even if brand new, is completely cleaned beforehand, ideally by submersion in a degreaser. This deep cleaning will open up all the nooks and crannies of the chain so that the wax can penetrate and coat all surfaces and then cure to provide a waterproof barrier against contamination and the premature chain wear it brings on. If Squirt is applied to a less-than-perfectly clean chain, it will still work well but will collect more grime and need to be reapplied more frequently to keep the chain humming nicely. Squirt is an efficient lubricant, meaning that it spreads out easily across a fully cleaned chain, and keeps it running smooth and quiet for a better-than-average interval. The result is that a 4 oz bottle can easily last 10,000 km of road riding in mostly dry conditions. Better yet, a new and perfectly clean chain lubricated with Squirt may also reach 10,000 km before it reaches the .5mm of wear between rollers which indicates that the chain should be replaced. Some riders note that using wax-based chain lubes like Squirt results in more chain noise than oil-based lubricants. While we agree with this premise broadly speaking, Squirt is one of the best options available for noise reduction among the cohort of wax-based drip lubricants. We also would rather have a chain lube that helps our chain last longer, saves our chainrings and cassette, and is clean to the touch than a lube that makes our chain silent for a while. At $3.75 per ounce, Squirt Long Lasting Chain Lube competes well with other drip-on wax lubricants that sell at double the cost. It helps the chain last longer, keeps it quieter than many other wax-based options, and provided that the chain is prepped correctly, ensures a buttery-smooth operation of the drivetrain. Just be advised that it can separate if it is allowed to freeze. Runner-Up Best Drip Wax Chain Lube CeramicSpeed UFO Drip All Conditions Check Price at Performance BikeCheck Price at Amazon <img width="2232" height="1488" decoding="async" src="https://bikerumor.com/wp-content/uploads/2024/01/CeramicSpeed-UFO-Drip-All-Conditions.jpeg" class="lazyload attachment-ldm-product-thumbnail size-ldm-product-thumbnail not-transparent wp-post-image" alt="The Best Bike Chain Lubes of 2024" itemprop="image" srcset="https://bikerumor.com/wp-content/uploads/2024/01/CeramicSpeed-UFO-Drip-All-Conditions.jpeg 2232w, https://bikerumor.com/wp-content/uploads/2024/01/CeramicSpeed-UFO-Drip-All-Conditions-297x198.jpeg 297w, https://bikerumor.com/wp-content/uploads/2024/01/CeramicSpeed-UFO-Drip-All-Conditions-800x533.jpeg 800w, https://bikerumor.com/wp-content/uploads/2024/01/CeramicSpeed-UFO-Drip-All-Conditions-120x80.jpeg 120w, https://bikerumor.com/wp-content/uploads/2024/01/CeramicSpeed-UFO-Drip-All-Conditions-768x512.jpeg 768w, https://bikerumor.com/wp-content/uploads/2024/01/CeramicSpeed-UFO-Drip-All-Conditions-1536x1024.jpeg 1536w, https://bikerumor.com/wp-content/uploads/2024/01/CeramicSpeed-UFO-Drip-All-Conditions-2048x1365.jpeg 2048w, https://bikerumor.com/wp-content/uploads/2024/01/CeramicSpeed-UFO-Drip-All-Conditions-720x480.jpeg 720w" sizes="(max-width: 2232px) 100vw, 2232px" data-has-transparency="false" data-dominant-color="ede8e9" style="--dominant-color: #ede8e9;" /> Specifications MSRP: $24.00 Volume: 100ml (3.38 oz) Price Per Ounce: $7.10 Type: Wax Composition: Non-toxic and biodegradable wax-based formula Recommended Use: All Conditions Pros Runs quiet Hangs tough in wet conditions Long-lasting Cons Expensive Extensive chain prep required Bennett Shane Ceramic Speed UFO Drip All-Conditions is a wax-based liquid chain coating that goes on wet from the bottle, then bonds to the chain’s internals, creating exceptional lubrication, reducing friction for better performance, and protecting the drivetrain from premature wear. Ceramic Speed also claims that UFO will last 300km per application (in dry conditions), a promise which we were keen to put to the test. First though, came the chain prep required for UFO and all wax-based lubes of its kind. Preferably, switching to UFO coincides with replacing the chain, but even if the chain is fresh out of the box, you’ll want to have it cleaned such that all the factory coating is removed. This is critical because UFO is designed to slowly penetrate and spread all throughout the chain, and it won’t be able to do that with contamination or factory grease in its way. With the release of the newly updated UFO drip lube, Ceramic Speed changed the application instructions to a method that sounds like it will induce folks to use up a bottle more quickly. We stuck with the tried and true method of simply applying a generous dollop to every chain roller, then backpedaling the chain to help it work its way in. The white color stands out and helps identify any rollers that were missed along the way. We let the chain sit overnight so that the UFO coating could cure completely and then went out into the toughest conditions for a chain lube – a group road ride on wet roads with nary a fender to be found. While we didn’t do 300km that day, we did hit triple digits and came away impressed with how smooth and quiet the chain was throughout the ride. After cleaning the bike off with a hose, cleaning wipes, and another hose rinse, the chain was virtually spotless and still ran nearly silent. Given the amount of road grime and water the chain was exposed to on that ride and subsequent cleaning, we are convinced that Ceramic Speed’s claim of 300km is fairly reliable. Of course, results will vary based on many factors specific to each rider, but it’s nice to know that a chain coating that costs $7.10 per ounce is tough enough to hold onto the chain through some nasty riding conditions. The new, updated formula of UFO Drip All-Conditions from Ceramic Speed is non-toxic and biodegradable, meaning it’s a better choice for your health and the planet. At $24 for 100ml, it’s certainly not cheap, bu'
