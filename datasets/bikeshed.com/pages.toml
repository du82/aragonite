title = "Why Should I Care What Color the Bikeshed Is?"
full_description = '''From freebsd.org/doc/en_US.ISO8859-1/books/faq/misc.html#bikeshed-painting.See phk.freebsd.dk/sagas/bikeshed for historical background;see also Poul-Henning Kamp's regular column The Bikeshed at the ACM. "The really, really short answer is that you should not. The somewhat longer answer is that just because you are capable of building a bikeshed does not mean you should stop others from building one just because you do not like the color they plan to paint it. This is a metaphor indicating that you need not argue about every little feature just because you know enough to do so. Some people have commented that the amount of noise generated by a change is inversely proportional to the complexity of the change."'''
