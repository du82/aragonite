full_description = '''Security Research How to use Trend Micro's Rootkit Remover to Install a Rootkit Bill Demirkapi May 18, 2020 • 18 min read The opinions expressed in this publication are those of the authors. They do not reflect the opinions or views of my employer. All research was conducted independently.For a recent project, I had to do research into methods rootkits are detected and the most effective measures to catch them when I asked the question, what are some existing solutions to rootkits and how do they function? My search eventually landed me on the TrendMicro RootkitBuster which describes itself as "A free tool that scans hidden files, registry entries, processes, drivers, and the master boot record (MBR) to identify and remove rootkits".The features it boasted certainly caught my attention. They were claiming to detect several techniques rootkits use to burrow themselves into a machine, but how does it work under the hood and can we abuse it? I decided to find out by reverse engineering core components of the application itself, leading me down a rabbit hole of code that scarred me permanently, to say the least.DiscoveryStarting the adventure, launching the application resulted in a fancy warning by Process Hacker that a new driver had been installed.Already off to a good start, we got a copy of Trend Micro's "common driver", this was definitely something to look into. Besides this driver being installed, this friendly window opened prompting me to accept Trend Micro's user agreement.I wasn't in the mood to sign away my soul to the devil just yet, especially since the terms included a clause stating "You agree not to attempt to reverse engineer, decompile, modify, translate, disassemble, discover the source code of, or create derivative works from...".Thankfully, Trend Micro already deployed their software on to my machine before I accepted any terms. Funnily enough, when I tried to exit the process by right-clicking on the application and pressing "Close Window", it completely evaded the license agreement and went to the main screen of the scanner, even though I had selected the "I do not accept the terms of the license agreement" option. Thanks Trend Micro!I noticed a quick command prompt flash when I started the application. It turns out this was the result of a 7-Zip Self Extracting binary which extracted the rest of the application components to %TEMP%\RootkitBuster.Let's review the driver we'll be covering in this article.The tmcomm driver which was labeled as the "TrendMicro Common Module" and "Trend Micro Eyes". A quick overlook of the driver indicated that it accepted communication from privileged user-mode applications and performed common actions that are not specific to the Rootkit Remover itself. This driver is not only used in the Rootkit Buster and is implemented throughout Trend Micro's product line.In the following sections, we'll be deep diving into the tmcomm driver . We'll focus our research into finding different ways to abuse the driver's functionality, with the end goal being able to execute kernel code. I decided not to look into the tmrkb.sys because although I am sure it is vulnerable, it seems to only be used for the Rootkit Buster.TrendMicro Common Module (tmcomm.sys)Let's begin our adventure with the base driver that appears to be used not only for this Rootkit Remover utility, but several other Trend Micro products as well. As I stated in the previous section, a very brief look-over of the driver revealed that it does allow for communication from privileged user-mode applications.One of the first actions the driver takes is to create a device to accept IOCTL communication from user-mode. The driver creates a device at the path \Device\TmComm and a symbolic link to the device at \DosDevices\TmComm (accessible via \\.\Global\TmComm). The driver entrypoint initializes a significant amount of classes and structure used throughout the driver, however, for our purposes, it is not necessary to cover each one.I was happy to see that Trend Micro made the correct decision of restricting their device to the SYSTEM user and Administrators. This meant that even if we did find exploitable code, because any communication would require at least Administrative privileges, a significant amount of the industry would not consider it a vulnerability. For example, Microsoft themselves do not consider Administrator to Kernel to be a security boundary because of the significant amount of access they get. This does not mean however exploitable code in Trend Micro's drivers won't be useful.TrueApiA large component of the driver is its "TrueApi" class which is instantiated during the driver's entrypoint. The class contains pointers to imported functions that get used throughout the driver. Here is a reversed structure:struct TrueApi { BYTE Initialized; PVOID ZwQuerySystemInformation; PVOID ZwCreateFile; PVOID unk1; // Initialized as NULL. PVOID ZwQueryDirectoryFile; PVOID ZwClose; PVOID ZwOpenDirectoryObjectWrapper; PVOID ZwQueryDirectoryObject; PVOID ZwDuplicateObject; PVOID unk2; // Initialized as NULL. PVOID ZwOpenKey; PVOID ZwEnumerateKey; PVOID ZwEnumerateValueKey; PVOID ZwCreateKey; PVOID ZwQueryValueKey; PVOID ZwQueryKey; PVOID ZwDeleteKey; PVOID ZwTerminateProcess; PVOID ZwOpenProcess; PVOID ZwSetValueKey; PVOID ZwDeleteValueKey; PVOID ZwCreateSection; PVOID ZwQueryInformationFile; PVOID ZwSetInformationFile; PVOID ZwMapViewOfSection; PVOID ZwUnmapViewOfSection; PVOID ZwReadFile; PVOID ZwWriteFile; PVOID ZwQuerySecurityObject; PVOID unk3; // Initialized as NULL. PVOID unk4; // Initialized as NULL. PVOID ZwSetSecurityObject; }; Looking at the code, the TrueApi is primarily used as an alternative to calling the functions directly. My educated guess is that Trend Micro is caching these imported functions at initialization to evade delayed IAT hooks. Since the TrueApi is resolved by looking at the import table however, if there is a rootkit that hooks the IAT on driver load, this mechanism is useless.XrayApiSimilar to the TrueApi, the XrayApi is another major class in the driver. This class is used to access several low-level devices and to interact directly with the filesystem. A major component of the XrayConfig is its "config". Here is a partially reverse-engineered structure representing the config data:struct XrayConfigData { WORD Size; CHAR pad1[2]; DWORD SystemBuildNumber; DWORD UnkOffset1; DWORD UnkOffset2; DWORD UnkOffset3; CHAR pad2[4]; PVOID NotificationEntryIdentifier; PVOID NtoskrnlBase; PVOID IopRootDeviceNode; PVOID PpDevNodeLockTree; PVOID ExInitializeNPagedLookasideListInternal; PVOID ExDeleteNPagedLookasideList; CHAR unkpad3[16]; PVOID KeAcquireInStackQueuedSpinLockAtDpcLevel; PVOID KeReleaseInStackQueuedSpinLockFromDpcLevel; ... }; The config data stores the location of internal/undocumented variables in the Windows Kernel such as the IopRootDeviceNode, PpDevNodeLockTree, ExInitializeNPagedLookasideListInternal, and ExDeleteNPagedLookasideList. My educated guess for the purpose of this class is to access low-level devices directly rather than use documented methods which could be hijacked.IOCTL RequestsBefore we get into what the driver allows us to do, we need to understand how IOCTL requests are handled.In the primary dispatch function, the Trend Micro driver converts the data alongside a IRP_MJ_DEVICE_CONTROL request to a proprietary structure I call a TmIoctlRequest.struct TmIoctlRequest { DWORD InputSize; DWORD OutputSize; PVOID UserInputBuffer; PVOID UserOutputBuffer; PVOID Unused; DWORD_PTR* BytesWritten; }; The way Trend Micro organized dispatching of IOCTL requests is by having several "dispatch tables". The "base dispatch table" simply contains an IOCTL Code and a corresponding "sub dispatch function". For example, when you send an IOCTL request with the code 0xDEADBEEF, it will compare each entry of this base dispatch table and pass along the data if there is a table entry that has the matching code. A base table entry can be represented by the structure below:typedef NTSTATUS (__fastcall *DispatchFunction_t)(TmIoctlRequest *IoctlRequest); struct BaseDispatchTableEntry { DWORD_PTR IOCode; DispatchFunction_t DispatchFunction; }; After the DispatchFunction is called, it typically verifies some of the data provided ranging from basic nullptr checks to checking the size of the input and out buffers. These "sub dispatch functions" then do another lookup based on a code passed in the user input buffer to find the corresponding "sub table entry". A sub table entry can be represented by the structure below:typedef NTSTATUS (__fastcall *OperationFunction_t)(PVOID InputBuffer, PVOID OutputBuffer); struct SubDispatchTableEntry { DWORD64 OperationCode; OperationFunction_t PrimaryRoutine; OperationFunction_t ValidatorRoutine; }; Before calling the PrimaryRoutine, which actually performs the requested action, the sub dispatch function calls the ValidatorRoutine. This routine does "action-specific" validation on the input buffer, meaning that it performs checks on the data the PrimaryRoutine will be using. Only if the ValidatorRoutine returns successfully will the PrimaryRoutine be called.Now that we have a basic understanding of how IOCTL requests are handled, let's explore what they allow us to do. Referring back to the definition of the "base dispatch table", which stores "sub dispatch functions", let's explore each base table entry and figure out what each sub dispatch table allows us to do!IoControlCode == 9000402BhDiscoveryThis first dispatch table appears to interact with the filesystem, but what does that actually mean? To start things off, the code for the "sub dispatch table" entry is obtained by dereferencing a DWORD from the start of the input buffer. This means that to specify which sub dispatch entry you'd like to execute, you simply need to set a DWORD at the base of the input buffer to correspond with that entries' **OperationCode**.To make our lives easier, Trend Micro conveniently included a significant amount of debugging strings, often giving an idea of what a function does. Here is a table of the functions I reversed in this sub dispatch table and what they allow us to do. OperationCode PrimaryRoutine Description 2713h IoControlCreateFile Calls NtCreateFile, all parameters are controlled by the request. 2711h IoControlFindNextFile Returns STATUS_NOT_SUPPORTED. 2710h IoControlFindFirstFile Performs nothing, returns STATUS_SUCCESS always. 2712h IoControlFindCloseFile Calls ZwClose, all parameters are controlled by the request. 2715h IoControlReadFileIRPNoCache References a FileObject using HANDLE from request. Calls IofCallDriver and reads result. 2714h IoControlCreateFileIRP Creates a new FileObject and associates DeviceObject for requested drive. 2716h IoControlDeleteFileIRP Deletes a file by sending an IRP_MJ_SET_INFORMATION request. 2717h IoControlGetFileSizeIRP Queries a file's size by sending an IRP_MJ_QUERY_INFORMATION request. 2718h IoControlSetFilePosIRP Set's a file's position by sending an IRP_MJ_SET_INFORMATION request. 2719h IoControlFindFirstFileIRP Returns STATUS_NOT_SUPPORTED. 271Ah IoControlFindNextFileIRP Returns STATUS_NOT_SUPPORTED. 2720h IoControlQueryFile Calls NtQueryInformationFile, all parameters are controlled by the request. 2721h IoControlSetInformationFile Calls NtSetInformationFile, all parameters are controlled by the request. 2722h IoControlCreateFileOplock Creates an Oplock via IoCreateFileEx and other filesystem API. 2723h IoControlGetFileSecurity Calls NtCreateFile and then ZwQuerySecurityObject. All parameters are controlled by the request. 2724h IoControlSetFileSecurity Calls NtCreateFile and then ZwSetSecurityObject. All parameters are controlled by the request. 2725h IoControlQueryExclusiveHandle Check if a file is opened exclusively. 2726h IoControlCloseExclusiveHandle Forcefully close a file handle. IoControlCode == 90004027hDiscoveryThis dispatch table is primarily used to control the driver's process scanning features. Many functions in this sub dispatch table use a separate scanning thread to synchronously search for processes via various methods both documented and undocumented. OperationCode PrimaryRoutine Description C350h GetProcessesAllMethods Find processes via ZwQuerySystemInformation and WorkingSetExpansionLinks. C351h DeleteTaskResults* Delete results obtained through other functions like GetProcessesAllMethods. C358h GetTaskBasicResults* Further parse results obtained through other functions like GetProcessesAllMethods. C35Dh GetTaskFullResults* Completely parse results obtained through other functions like GetProcessesAllMethods. C360h IsSupportedSystem Returns TRUE if the system is "supported" (whether or not they have hardcoded offsets for your build). C361h TryToStopTmComm Attempt to stop the driver. C362h GetProcessesViaMethod Find processes via a specified method. C371h CheckDeviceStackIntegrity Check for tampering on devices associated with physical drives. C375h ShouldRequireOplock Returns TRUE if oplocks should be used for certain scans. These IOCTLs revolve around a few structures I call "MicroTask" and "MicroScan". Here are the structures reverse-engineered:struct MicroTaskVtable { PVOID Constructor; PVOID NewNode; PVOID DeleteNode; PVOID Insert; PVOID InsertAfter; PVOID InsertBefore; PVOID First; PVOID Next; PVOID Remove; PVOID RemoveHead; PVOID RemoveTail; PVOID unk2; PVOID IsEmpty; }; struct MicroTask { MicroTaskVtable* vtable; PVOID self1; // ptr to itself. PVOID self2; // ptr to itself. DWORD_PTR unk1; PVOID MemoryAllocator; PVOID CurrentListItem; PVOID PreviousListItem; DWORD ListSize; DWORD unk4; // Initialized as NULL. char ListName[50]; }; struct MicroScanVtable { PVOID Constructor; PVOID GetTask; }; struct MicroScan { MicroScanVtable* vtable; DWORD Tag; // Always 'PANS'. char pad1[4]; DWORD64 TasksSize; MicroTask Tasks[4]; }; For most of the IOCTLs in this sub dispatch table, a MicroScan is passed in by the client which the driver populates. We'll look into how we can abuse this trust in the next section.ExploitationWhen I was initially reverse engineering the functions in this sub dispatch table, I was quite confused because the code "didn't seem right". It appeared like the MicroScan kernel pointer returned by functions such as GetProcessesAllMethods was being directly passed onto other functions such as DeleteTaskResults by the client. These functions would then take this untrusted kernel pointer and with almost no validation call functions in the virtual function table specified at the base of the class.Taking a look at the "validation routine" for the DeleteTaskResults sub dispatch table entry, the only validation performed on the MicroScan instance specified at the input buffer + 0x10 was making sure it was a valid kernel address.The only other check besides making sure that the supplied pointer was in kernel memory was a simple check in DeleteTaskResults to make sure the Tag member of the Micro'''
