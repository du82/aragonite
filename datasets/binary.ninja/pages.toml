["https://binary.ninja/2024/12/16/flareon-ttd.html"]
title = "Binary Ninja - Having Fun with Flare-on Using Time-Travel Debugging (TTD)"
description = "Binary Ninja is a modern reverse engineering platform with a scriptable and extensible decompiler."
full_description = "In this post, I will explain how I analyzed the Serpentine challenge in this year’s flare-on with the help of time-travel debugging (TTD) integration in the Binary Ninja debugger. Serpentine is the 9th challenge and is commonly considered the hardest among the ten challenges this year, or even among ALL recent years. It features self-modifying code, x64 exception handling and unwinding, and arithmetic operations masquerading as table lookups. It is a fantastic challenge and a great test of the player’s skills and their tool’s reliability. I’m glad that I was able to solve it and also complete this year’s flare-on challenge! I used TTD as an initial overview to explore the swamp of obstacles. If you have not heard of it yet, TTD is a technology that allows the recording and replay of the execution of a target. This could be a user process or even a whole system. TTD offers an unprecedented advantage to reverse engineering since it enables traveling back and forth in time and allows the examination of previous states of the target. Among the various TTD solutions, WinDbg TTD is free to use and supports the recording of Windows user-mode processes. Binary Ninja’s debugger integrates WinDbg TTD support so you can record a TTD trace and replay it using a familiar user interface. The input string must be supplied on the command line, and it must be 0x20 chars long. After these checks, a code buffer is executed with the input string as the first argument. There is also nothing fancy going on with the code buffer. The _TLS_Entry_0 function allocates a RWX buffer and copies some 0x800000 bytes from the .data section into it: However, when I try to disassemble the code buffer, it gives me a surprise that the first instruction is hlt: This instruction will cause an exception which needs to be handled. This is quite common in flare-on or other CTFs, and I quickly noticed that there is a call to SetUnhandledExceptionFilter at the beginning of the main function. To my disappointment, the exception handler is dumb and doesn’t do anything:"
year_published = 2024
year_updated = 2024
