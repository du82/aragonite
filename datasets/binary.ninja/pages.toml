["https://binary.ninja/2024/11/20/4.2-frogstar.html"]
title = "Binary Ninja - 4.2 Frogstar"
description = "Binary Ninja is a modern reverse engineering platform with a scriptable and extensible decompiler."
full_description = "Don’t panic! Binary Ninja version 4.2 Frogstar is here. It is, after all, the answer to everything. Much like a trusty towel, you’ll find that the improvements in 4.2 are applicable to many situations. This major release (despite the number increment being minor since we couldn’t skip version 4.2) includes an industry-first multiple-language decompilation, DYLD Shared Cache analysis, MSVC RTTI support, a new signature system fittingly called WARP, and so many more features. One of Vector 35’s long-standing goals has been to break people away from the assumption that “C” is the ultimate output of a decompiler. That is one reason why HLIL is our default view, even though we offer Pseudo C output. Now, in Binary Ninja 4.2, we are taking this one step further. We are adding a brand new, unique capability to Binary Ninja: the ability to decompile to other target languages. This new Language Representation system is designed to allow custom renderings of HLIL that are language-specific. Using this system, we are adding Pseudo Rust, which displays decompiled code in a style similar to the popular language Rust. The best part of this feature is that it is fully pluggable and user-customizable, with both a comprehensive API available and fully-featured example plugins for you to explore. In addition to both the Pseudo C and Pseudo Rust representations being released as open source C++ plugins, we are also releasing a Pseudo Python example, written in Python, to demonstrate how to use this new system in Python plugins. Not only does this add to the groundwork for new language-specific decompilation, but it also is a dramatic improvement in the quality of our Pseudo C output. Instead of a one-off implementation, it’s now much more robust so users who prefer Pseudo C as their default should see a noticeable increase in quality. Note that (for now) the Pseudo Rust is only available in paid editions of Binary Ninja by default. Pseudo Python is a separate example plugin that can be installed by copying it to your user plugin folder. You can however check out https://cloud.binary.ninja/ which does have the Pseudo Rust view as well!"
year_published = 2024
year_updated = 2024
