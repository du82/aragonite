full_description = "Happy 2025! While we could certainly go back and celebrate what a great year 2024 was for Binary Ninja (and it certainly was!), for now, we’re enjoying some holiday time and instead, we thought we’d announce a nice upcoming gift for all our customers, both current and former. Coming January 7th, we’re launching a new portal for license management. Originally, customers could only download the latest stable version of Binary Ninja when they had active support. This was an artifact of our update infrastructure, and we’ve long promised disappointed users who let their licenses lapse that we’d resolve this when we re-worked our license recovery mechanisms. Well, we have, and we did! So what’s coming in this new portal? The initial launch, which we’ll release January 7th, includes the following functionality: Some time after that, we’ll be adding the following features as well (ordered in terms of the roadmap/priority): A: No! Our email subscription popup after downloading the free version has always been, and will continue to be, optional. You do not need to use the portal to download the free version. A: Nope, this is meant to improve your life, but it is not required. You can continue to use email to request downloads of your license and installers while your support is active. Binary Ninja is brought to you by Vector 35, a group of hackers who started to make games and reverse engineering tools. Or, maybe they're game developers who still think they can hack? Either way, they're having fun doing it."
