["https://binary.ninja/blog/page2"]
title = "Binary Ninja - Blog"
description = "Binary Ninja is a modern reverse engineering platform with a scriptable and extensible decompiler."
full_description = "We’ve been very hard at work improving the experience for our iOS and macOS reverse engineers. You’ll want to keep an eye out for our upcoming 4.2 feature release announcement stream which includes some even juicier bits. In the meantime, hopefully this will tide you over. EDITOR’S NOTE: This guest-post was brought to you by unknowntrojan, shedding light on one of the lesser-known plugins, coolsigmaker. A common desire in reverse engineering is to match re-used code across multiple binaries. Whether you’re doing malware lineage tracking, identifying a statically compiled library, or any other use case about identifying similar code, there are multiple technologies that attempt to solve parts of this problem. Other tools for related problems include SigKit (Binary Ninja’s static library detection), IDA’s FLIRT/FLAIR and Lumina features, or even more advanced systems like Diaphora or BinDiff. Related to those, you might already be familiar with the “SigMaker” style of plugins for various platforms[1] [2] [3]. These plugins generate patterns from code that can be used to find said code across different binaries or find the same function reliably between application updates. This is useful for malware classification and static-library identification among other purposes. The Ultimate edition includes all of the same features you know and love from Binary Ninja Commercial, but also includes the architectures we’ve been selling separately over our past few releases. This lets us simplify our release pipeline and our pricing at the same time without raising prices for any existing customers. For the next few months, we’ll be selling this edition at a reduced, introductory price as we continue to build out additional features. Under-the-hood, Binary Ninja Ultimate is a re-brand of our existing Binary Ninja Enterprise client builds, but now with named (instead of just floating) licenses. This means all current Enterprise customers will get Ultimate features at no extra cost and all future Ultimate customers will have the ability to add an Enterprise server at any time."
year_published = 2024
year_updated = 2024
