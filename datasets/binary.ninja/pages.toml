["https://binary.ninja/blog"]
title = "Binary Ninja - Blog"
description = "Binary Ninja is a modern reverse engineering platform with a scriptable and extensible decompiler."
full_description = "Today, we are excited to announce Sidekick 3.0! In addition to a number of bug fixes, UX improvements, and updated models, this release extends Sidekick’s analysis capabilities and with tighter Binary Ninja integration. In particular, our new query language, expanded editing capabilities, custom tool system, and the re-designed Assistant (now called the Analysis Console) stand out. These features and more continue to make Sidekick the best AI-powered tool for binary analysis on the market. Hello, and welcome to another exciting episode of “Sidekick in Action”! Today, we will be applying Sidekick to a variety of common vulnerability discovery tasks while looking at the popular network utility dnsmasq. In this post, we’ll explore how we used Sidekick to analyze complex malware samples. We’ll use LockBit 3.0 as our target, walking through the process of identifying and understanding key functions, deobfuscating strings, and mapping the sample’s behavior. If you’ve been following our social media accounts, this is no surprise, but last year we at Vector 35 launched RE//verse, a new reverse engineering conference that’s happening in Orlando, FL from Feb 27 - Mar 1 (kickoff reception 27th, talks 28th-1st, trainings 24th-27th). As we’re a month out we wanted to highlight some of the goals behind the conference, talk about what it is and what it isn’t, and remind anyone that hasn’t already signed up and booked their hotel to move fast! We still have trainings and tickets available, but the conference room rate is ending soon so don’t wait. Happy 2025! While we could certainly go back and celebrate what a great year 2024 was for Binary Ninja (and it certainly was!), for now, we’re enjoying some holiday time and instead, we thought we’d announce a nice upcoming gift for all our customers, both current and former. Coming January 7th, we’re launching a new portal for license management. Originally, customers could only download the latest stable version of Binary Ninja when they had active support. This was an artifact of our update infrastructure, and we’ve long promised disappointed users who let their licenses lapse that we’d resolve this when we re-worked our license recovery mechanisms. Well, we have, and we did!"
