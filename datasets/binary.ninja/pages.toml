["https://binary.ninja/privacy"]
title = "Binary Ninja - Privacy Policy"
description = "Binary Ninja is a modern reverse engineering platform with a scriptable and extensible decompiler."
full_description = "This privacy policy discloses the privacy practices for Binary Ninja. This privacy policy applies solely to information collected by this web site. It will notify you of the following: We are the sole owners of the information collected directly on this site. We only have access to/collect information that you voluntarily give us via email or other direct contact from you. We will not sell or rent this information to anyone. We will use your information to respond to you, regarding the reason you contacted us. We will not share your information with any third party outside of our organization, other than as necessary to fulfill your request, e.g. to process a credit card transaction. Unless you ask us not to, we may contact you via email in the future to tell you about specials, new products or services, or changes to this privacy policy. We use a number of third-party services to maintain the functionality of this website and better understand our customers. These sites may use cookies to correlate your visits to this site. These services include: You may opt out of any future contacts from us at any time. You can do the following at any time by contacting us via the email address or chat on our website: We take precautions to protect your information. When you submit sensitive information via the website, your information is protected both online and offline. Wherever we collect sensitive information (such as credit card data), that information is transmitted over an encrypted connection. You can verify this by looking for “https” at the beginning of the address of the web page. Note that all credit card information in particular is transmitted directly to FastSpring, our credit card processor and we never see, nor have the ability to retain, that data. While we use encryption to protect sensitive information transmitted online, we also protect your information offline. Only employees who need the information to perform a specific job (for example, billing or customer service) are granted access to personally identifiable information."
