["https://binary.ninja/2025/01/31/re-thinking-conferences.html"]
title = "Binary Ninja - RE//thinking Conferences"
description = "Binary Ninja is a modern reverse engineering platform with a scriptable and extensible decompiler."
full_description = "If you’ve been following our social media accounts, this is no surprise, but last year we at Vector 35 launched RE//verse, a new reverse engineering conference that’s happening in Orlando, FL from Feb 27 - Mar 1 (kickoff reception 27th, talks 28th-1st, trainings 24th-27th). As we’re a month out we wanted to highlight some of the goals behind the conference, talk about what it is and what it isn’t, and remind anyone that hasn’t already signed up and booked their hotel to move fast! We still have trainings and tickets available, but the conference room rate is ending soon so don’t wait. With the end of ShmooCon and the untimely demise of Infiltrate, there’s been a lack of high quality, technical security conferences in the US. We love what OffensiveCon and HexaCon have been doing across the pond, and we wanted to replicate that plus “RE//vive” what Infiltrate was in spirit. (Sorry, we just can’t help all the great word-play RE//verse lets us get away with, as evidenced by some of the branding above!) So what goes into running a conference like this? There’s a few key ingredients that we think will make RE//verse great. The first, and most important criteria is high quality talks. Thankfully, even for a first time event, we had a ton of fantastic talk submissions and have an amazing talk lineup. Next, you take those talks and make every presenter do a dry-run before the review board to ensure that the presentations are polished and clearly articulated. This simple ingredient is more work for both the organizers and the presenters, but it pays off in being able to ensure we give you the best quality talks. No good con is complete without great trainings, and we’re super happy with the amazing trainers we’ve lined up for this year. We’ve got great coverage across the spectrum of reverse engineering topics from hardware hacking to firmware reversing, from specific platforms to advanced program analysis and reversing techniques, from apps to basebands! There’s something for everyone. Plus, several of our trainers don’t often run trainings in the US and we’re excited to make them available to people for whom OCONUS travel is harder."
