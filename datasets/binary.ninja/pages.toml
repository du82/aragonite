["https://binary.ninja/2024/11/08/user-survey-results.html"]
title = "Binary Ninja - 2024 Reverse Engineering Survey: The State of the Industry"
description = "We are excited to share results from our 2024 Reverse Engineering survey! This annual survey helps unpack the current state of the reverse engineering industry and gives insight into how Binary Ninja can better serve the reverse engineering community."
full_description = "We are excited to share results from our 2024 Reverse Engineering survey! This annual survey helps unpack the current state of the reverse engineering industry and gives insight into how Binary Ninja can better serve the reverse engineering community. Let’s dive into the insights. Our survey tapped into a broad range of skill levels. A solid 34% of respondents consider themselves at the intermediate level, while 25% feel they’ve reached advanced territory. Another 15% rated themselves as experts, and plenty of folks mentioned they’re just getting started on their reverse engineering journey. From our findings, 56% of respondents reverse engineer on the job, and 11% do it as part of their studies. Even more telling, 63% dig into reverse engineering outside of work, showing just how passionate and dedicated the hobbyist community really is. The reverse engineers surveyed partake heavily in hobbyist challenges like modding, CTFs, and crackmes, pulling in 79% of the community’s focus. Vulnerability research is another close contender at 64%, while malware analysis captures the interest of 48%. Emulation and internal software auditing each stand out, both at ~22%. Code recovery sits at 18% of respondents, while 15% of participants reverse engineer for interoperability reasons. The survey shows that a sizable group is putting in some serious reverse engineering time — 35% are logging over 10 hours weekly. Meanwhile, 35% spend between 5-10 hours and 23% dedicate a solid 1-5 hours each week. Our analysis shows that the most dedicated reverse engineers often come from organizations where reverse engineering isn’t just a side task — it’s a central focus shared by several team members. This suggests that companies with robust reverse engineering teams are truly diving deep, making these tools a key part of their daily workflow. When it comes to debugging and dynamic analysis, gdb is the top choice, used by 61% of respondents. Additionally, tools like x64dbg, Binary Ninja’s debugger, and LLDB are commonly employed, highlighting the diverse and versatile toolkit our users depend on."
year_published = 2024
