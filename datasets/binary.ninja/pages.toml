["https://binary.ninja/2025/02/26/sidekick-in-action-finding-vulnerabilities-in-dnsmasq.html"]
title = "Binary Ninja - Sidekick in Action: Finding Vulnerabilities in dnsmasq"
description = "Binary Ninja is a modern reverse engineering platform with a scriptable and extensible decompiler."
full_description = "Hello, and welcome to another exciting episode of “Sidekick in Action”! Today, we will be applying Sidekick to a variety of common vulnerability discovery tasks while looking at the popular network utility dnsmasq. We have selected dnsmasq version 2.80 (stripped) as our target to analyze using Sidekick for several reasons: Reverse engineering and vulnerability research involve non-trivial tasks like function identification, decompilation, pattern recognition, and vulnerability identification that all require considerable time, effort, and expertise. Sidekick can help with these by automatically reasoning about code and detecting well-known patterns and structures to identify behaviors, generate names, and recognize complex properties of software such as security. When looking at a binary for the first time, it helps to begin with an understanding of what you’re dealing with at a high level in order to ground the context of further investigations. Sometimes you may already have prior knowledge about the binary, and other times not. As mentioned above, we are starting with a version of dnsmasq that has been stripped of function symbol names and also given a generic file name to prevent Sidekick from placing too much attention on metadata instead of the code itself. Using the Analysis Console interface, let’s start with something simple and ask the Analysis Assistant what the binary is. The output from each tool request can be viewed by expanding the message using the chevron button that appears when you hover over the message. This allows us to see the information the Analysis Assistant uses as context to complete our request. Before moving on to the next step, it’s important to keep in mind that the Analysis Console is powered by large language models that inherently perform with some amount of indeterminism. This means that for a given request, you may not always get the same answer. Since the Analysis Assistant makes potentially multiple decisions on the overall strategy and specific steps taken to complete your task, there will be variation in its results. Knowing this, we have provided a mechanism for you to easily request the Analysis Assistant to retry any request by simply hovering over its message and clicking the “Retry” button that appears."
year_published = 2025
year_updated = 2025
