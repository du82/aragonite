["https://binary.ninja/features"]
title = "Binary Ninja - Features"
description = "Summary of high level features"
full_description = "Binary Ninja includes support for dissassembly from multiple architectures, including x86, x86_64, ARMv7 (with Thumb2), ARMv8 (AArch64), PowerPC, MIPS, RISC-V, MSP430, TriCore, C-SKY, and more! Additionally, our community supports many other architectures through our public plugin ecosystem. Loaders are available for all major platforms (PE, Mach-O, ELF) and some minor platforms (MD1ROM, VxWorks) and can be extended or customized using our API. Our built-in decompiler works with all of our officially supported architectures at one price and builds on a powerful family of ILs called BNIL. In fact, not just our architectures, but even community architectures can produce amazing decompilation. Our decompiler outputs to both C and BNIL and can be switched on-demand. Our open source, native debugger can debug applications on Windows, macOS, and Linux. It supports a wide variety of interfaces and is capable of both local and remote debugging. Our extensive API can be used to create and customize loaders, add or augment architectures, customize the UI, or automate any workflow (types, patches, decompilation...anything!). Bindings are available for C++, Python, and Rust. Made something cool and want to share? Publish your community plugin and have it featured in our Plugin Manager! These plugins can be installed (or updated) at any time by any customer, right inside the client. Use our API to quickly batch process files and see the results in our triage view. Use the entropy graph to identify areas of interest, like packed or encrypted data. Click on any location to navigate there quickly. We didn't just build the best automation and API for binary analysis, but our UI design is intentional and clean. None of the distractions, but all of the features you need for the biggest jobs including multiple tabs, synchronized and split views, custom layouts and more. Reverse engineering is the process of exploring the unknown. As your understanding improves, we give you the tools to represent that and improve analysis. Add types, structures, comments, highlights, tags, and more."
year_published = 2025
clearnet = "https://binary.ninja/features"
