["https://binary.ninja/2025/02/26/sidekick-3.0.html"]
title = "Binary Ninja - Sidekick 3.0"
description = "Binary Ninja is a modern reverse engineering platform with a scriptable and extensible decompiler."
full_description = "Today, we are excited to announce Sidekick 3.0! In addition to a number of bug fixes, UX improvements, and updated models, this release extends Sidekick’s analysis capabilities and with tighter Binary Ninja integration. In particular, our new query language, expanded editing capabilities, custom tool system, and the re-designed Assistant (now called the Analysis Console) stand out. These features and more continue to make Sidekick the best AI-powered tool for binary analysis on the market. As a reverse engineer, building relationships between code and data is foundational for understanding a binary. An AI assistant also needs to be able to navigate those same relationships and gather relevant information before it can properly analyze and understand what’s going on. With Sidekick 3.0, we are introducing a new query language called the Binary Ninja Query Language (BNQL), which has been designed specifically for use by AI models to navigate code and data relationships with ease. As an example, this means that Sidekick will now search with cross-references to find and substantiate answers to your questions. Figure 1: Sidekick’s Analysis Console uses BNQL to collect more information from the binary for deeper analysis. As reverse engineers, we don’t just stare at a bunch of bytes and magically come up with the answer to a specific question. To reach our goals, we shape an analysis database to reflect our findings along the way: naming functions, defining and applying types, adding comments and tags, and building custom views for the things we care about most. We wanted Sidekick 3.0 to have the same power. To that end, we’ve designed an AI-friendly format for editing binaries, letting Sidekick manipulate the database with ninja-like precision. It can add, remove, or tweak anything: functions, data variables, symbols, sections, and even raw bytes! This mirrors the full control over analysis that you’d expect from a seasoned pro. Figure 2: Sidekick’s Analysis Console directly applies edits to the binary to create structure definitions, rename functions, and rename variables."
year_published = 2025
year_updated = 2025
