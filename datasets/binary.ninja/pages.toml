description = "Combine your reverse engineering might and start using a collaboration solution that stays out of your way and lets you work"
full_description = "Combine your reverse engineering might and start using an on-prem collaboration solution that stays out of your way and lets you work. Collaborate with your team seamlessly and effortlessly with synchronized commits, easy conflict resolution, and persistently-stored live chat for every project file. Don't waste any more time managing individual license files! Check out and check in licenses for as long as you need from the Binary Ninja Enterprise server. Create and organize projects, add and remove users, and managing permissions at both the project and file level. Everything is hosted by you, on-premises. Enterprise is not a cloud service! We work with your infrastructure. Binary Ninja Enterprise supports single sign-on through OAuth 2.0, OpenID Connect, LDAP, or SAML2*. The entire Binary Ninja Enterprise product works offline — including floating licenses and client updates! No need to have constant access to an external license server. No more need for reinstalling to change client versions. Enjoy the same cross-platform support on Windows, MacOS, and Linux as our Ultimate product offering. See the FAQ for more details. Our Binary Ninja Enterprise server is officially supported on the latest Ubuntu Server LTS, but can run on many other platforms. Contact us for more information. Binary Ninja is brought to you by Vector 35, a group of hackers who started to make games and reverse engineering tools. Or, maybe they're game developers who still think they can hack? Either way, they're having fun doing it."
