["https://binary.ninja/faq"]
title = "Binary Ninja - Frequently Asked Questions"
description = "Common questions and answers about purchasing, support, design, and others"
full_description = "We generally try to support the latest version of each platform plus the most recent long-term supported version prior to that. Binary Ninja may be able to work with less than the above minimums, but this is what we officially support. If you have any concerns, try our free version first. Binary Ninja includes various levels of support for different CPUs. We break down support below for each architecture based on whether we support disassembly, lifting, decompilation, inline-assembly editing (which also includes insertion of raw chunks of assembly), and C compilation (using our own built in compiler SCC): Need support for an architecture that isn't listed above? Extended Support Contracts are available to add the support you need. Need support for a platform or file format that isn't listed above? Extended Support Contracts are available to add the support you need. Python2 was officially end-of lifed on January 1, 2020. The last stable build of Binary Ninja which supported it was 2.2. We currently demangle both GNU3 and MSVC symbols including C++11 using our own cross-platform library on macOS, Linux, and Windows. There is also an API for registering demangler plugins so you can create your own. Symbols will be automatically detected and loaded when an appropriate .pdb exists in the same folder, when the file is available from a defined symbol server, or via the default Microsoft symbol server. More information available in the documentation. The educational discount is intended for either full-time students (of any age!) who can provide proof of full-time status, or for educational instructors who are using Binary Ninja in relevant courses or research at a non-profit university or organization. The discount is 75% off and can be applied to a non-commercial or commercial license. So for example, a non-commercial $299 license would be $74 (we round down to whole dollars) with the student discount applied. To apply, use the educational discount form. Please do not use any other mechanisms besides that form or email to [email protected] as we have special settings there to prevent long-term storage of PII."
