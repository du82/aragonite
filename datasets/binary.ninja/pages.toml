["https://binary.ninja/support/extended.html"]
title = "Binary Ninja - Extended Support"
description = "Extended Support Contracts are available for a variety of customer needs"
full_description = "Need additional support, features, plugins, or other development? The Binary Ninja team has got you covered. Extended Support Contracts (ESC) offer a higher tier of dedicated customer support for Binary Ninja customers. Any organization can purchase an ESC, regardless of whether they are an Enterprise customer or not. ESCs are unrelated to the edition of Binary Ninja used. While our standard support coverage includes updates and fixes and our Enterprise support includes priority chat support and fixes, an ESC can be used to immediately direct our development resources to meet your exact needs. Your ESC can include developing new features, immediate fixes, bespoke trainings, help writing your own custom plugins, or even direct assistance from our experts in reverse engineering. We are open to a wide variety of uses for ESC tiers. If you need something specific, ask! Here are some examples: Vector 35 doesn't have support engineers or sub-contractors. Everyone who services an ESC is a full-time engineer and Binary Ninja developer. Our team has significant technical depth: Senior engineers have 20-30 years of experience, while even our most junior engineers still have a minimum of 4 years of reverse engineering and development experience. We have over a dozen full time engineers on our team with extensive backgrounds in program analysis, reverse engineering, vulnerability research and more. Depending on your needs, we'll make sure we get the right engineer for the task and will ensure you're happy before we begin work. Binary Ninja is brought to you by Vector 35, a group of hackers who started to make games and reverse engineering tools. Or, maybe they're game developers who still think they can hack? Either way, they're having fun doing it."
