["https://binary.ninja/purchase"]
title = "Binary Ninja - Purchase"
description = "Compare different editions and purchase"
full_description = '''Binary Ninja is available in four editions: Free, Non-Commercial, Commercial, and Ultimate. The Free edition is for evaluation and education. The Non-Commercial edition is for hobbyists that provides a powerful feature set at an extremely affordable price. The Non-Commercial license's primary restriction is that it only allows non-commercial use, though it does have some other differences, outlined above. All licenses purchased using our online purchasing system are "named" licenses, which are usable by one person on multiple machines. For more details, see our various licenses. Commercial and Ultimate editions include more than just the freedom to profit with your work. Some specific features targeting professional or power users are also included, such as headless processing. Plugins work in all editions except for Free, but only the Commercial and Ultimate editions can run plugins without running the GUI. This allows for powerful batch analysis (for example, import binaryninja on headless servers). This works especially well with our custom "compute" licenses that are designed for headless-only installs. Want to purchase support and updates in advance for more than a year? Simply contact us for a custom quote for longer periods of time. Please do not use this page if you are looking to renew a previous purchase and within one month of expiration (either before or after). Instead, you should have received an email including a renewal link, or you can check the "About" dialog in Binary Ninja itself for a renewal link and information on your support period. We support PayPal and other payment methods with our primary payment provider! If you need other mechanisms, we support Check, ACH, and Sofort through manual invoices. Contact support for manual payment options but be aware that payment must clear before licenses will be sent. If purchasing more than 35 copies of Binary Ninja or purchasing with a PO, you will need to contact us. Note that POs are only accepted for very large order sizes.'''
