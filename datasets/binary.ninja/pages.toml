["https://binary.ninja/training"]
title = "Binary Ninja - Trainings"
description = "Looking to get the most out of Binary Ninja? Schedule a training today, or take one of our public courses"
full_description = '''Looking to get the most out of Binary Ninja? Join one of our upcoming trainings or request a private class for your organization today! Interested in hearing about Binary Ninja trainings? Sign up for our newsletter to never miss out on a training announcement or early-bird discount! All courses include a non-commercial license for Binary Ninja including one year of updates which can be upgraded to Commercial or extend an existing license. All courses include a one-week trial of Sidekick redeemable within one month from the start of class. Most scheduled trainings run for 4 or 5 days, with two 3-hour training sessions a day. All trainings are available in 1 to 5 day formats, and an 8-hour schedule is available for those who require it, though it covers no additional material. Students will require a computer to run Binary Ninja, interact through Discord/Zoom, and write scripts in Python. In-class exercises are provided for Mac and Linux executable formats, so some students may elect to bring a VM. Certificates of participation and completion are provided upon request and in most cases can be redeemed for Class-A credit hours toward cert renewals. Check with your cert provider for additional requirements and how to redeem. All public courses include one week exclusive access to instructors, and one week of view-only full-class recording access. For students, hobbyists, and entry-level employees just starting out with reverse engineering. This class will take anyone from "zero" to "hero"! No prior knowledge of assembly, binary formats, or reverse engineering is required. We'll explore what happens to source code when it gets compiled, what gets lost, and what's involved in recovering an understanding of that code. Students will learn how to leverage Binary Ninja to reverse engineer programs for any architecture. Examples from several popular machine code architectures will be provided (such as x86 and ARM) for students to learn when they need to inspect the disassembly and how to read it without needing to be an expert. Variable storage, register allocation, how the stack works, type recovery, basic vulnerability classes, and much more will all be covered. For more information, see the full syllabus.'''
