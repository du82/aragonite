full_description = "There are two ways to try Binary Ninja for free! Binary Ninja Cloud supports all architectures, but requires you to upload your binaries. Binary Ninja Free is a downloadable app that runs locally, but has architecture restrictions. Neither free option supports our powerful API / Plugin ecosystem. Binary Ninja Cloud is our free, online reverse engineering tool. It supports a number of great features. By downloading the desktop versions linked above, you are agreeing to the terms of the free license. If you do not agree to the license, do not download or run the files linked above. This free version of Binary Ninja is available for you to use for non-commercial purposes, or to evaluate its functionality and see if it meets your commercial needs. Your download should be starting now! If you experience problems with a firewall, plugin, or end-point security blocking the download, you can close this dialog and right-click on the download button and copy the URL into another download method. Want to hear about the latest releases? Consider signing up to get emails when we release new updates. This infrequent announcement list sends about six emails per-year. Binary Ninja is brought to you by Vector 35, a group of hackers who started to make games and reverse engineering tools. Or, maybe they're game developers who still think they can hack? Either way, they're having fun doing it."
