["https://binarynights.com/privacy"]
title = "ForkLift 3 - Support - most advanced file manager and FTP client for macOS"
description = "Manage your files quickly across local drives and remote servers with ease. ForkLift is a robust FTP/SFTP/WebDAV/Amazon S3/Backblaze B2/Google Drive/Rackspace Cloud Files client and a powerful and versatile file manager."
full_description = "This Privacy Policy informs you about the type of personal data which is collected and received through our site https://binarynights.com (“Website”, “Site”) and our application ForkLift, and how this data is used, shared, retained, and protected. Overview As a general rule, we at Binarynights LLC (“we”, “us” or “our”) avoid collecting personal data if it is not necessary. The collected data is protected and only authorized employees have access to it. We only share the data collected by us on a need to know basis with the following third parties: Service providers In limited circumstances: public authorities or other third parties if required by law or reasonably necessary to protect the rights, property and safety of ourselves or others To learn more about these service providers, please refer to the list of our third-party vendors. Otherwise, we DO NOT sell, share, or rent your personal data. Personal Data Collected Website Analytics We use Google Analytics to gather and analyze website statistical data on how our visitors use our Website. Google Analytics uses cookies to determine which pages were visited, how long these pages were visited, and which paths visitors took, etc when navigating our Site. The information generated by the cookie about your use of our website (such as your IP address, the URL visited, the date and time the page was viewed) will be transmitted and stored by Google. Google will use this information to monitor your use of our website, and to compile reports on website activity for us. Purchase information If you purchase products through our Website, we collect and store your Name Email address License key We need this information to verify that you are a license owner. This information can be useful for example when you lose your license key and want to retrieve it. We retain the personal information related to your purchase indefinitely, unless you ask us to remove it. You can ask to change or remove your personal information by sending us an email at support@binarynights.com Other personal information asked on the purchase form are collected by FastSpring, our Payment Service Provider. We can retrieve but DO NOT store information visible on your invoice: Full address Company name (optional) VAT number (optional) We DO NOT collect or store your: Phone number Payment information (Credit/Debit card number, expiration date or CCV code) Or any other information collected by other third party service providers such as PayPal Information collected for/by FastSpring is subject to the Privacy policy of FastSpring (available here: https://fastspring.com/privacy/) Information collected for/by PayPal is subject to the Privacy Policy of PayPal (available here: https://www.paypal.com/us/webapps/mpp/ua/privacy-full) Support interactions When handling support requests, we collect your: Email address or Twitter handle Full content of the interactions between us, including screenshots, screen recordings, crash reports or other diagnostic information We retain support emails indefinitely. These interactions can help us identify and remove problems in ForkLift and develop ForkLift further based on user requests. To receive, store, and organize user interactions, we use the following third-party services: Gmail Zendesk GitHub To learn more about these service providers, please refer to the list of our third-party vendors. Crash Reports When (re)starting ForkLift after a crash, you have the option to send us the crash report which contains information about the ForkLift and the operating system at the time of the crash. The crash report DOES NOT include personal data. You can enter your email address to send us the crash report, but if you don’t voluntarily share it with us, we won’t be able to identify you when we review the crash report. After receiving the crash reports, we treat them the same way as any other support interaction. Newsletters You can sign up for our newsletter on our Website and in ForkLift when you start ForkLift for the first time. When you sign up for our newsletter using your email address, your email address will be added to our mailing list and you might receive newsletters from us occasionally. We don’t sell or share email addresses on our mailing list with third parties, except for our newsletter service provider which is necessary to send out the emails. We retain your email address as long as you are subscribed to our newsletter. You can unsubscribe anytime in the emails sent to you or by requesting through email at support@binarynights.com To learn more about our newsletter service provider, please refer to the list of our third-party vendors. Registration To prove that you are a licensed owner of ForkLift, you need to register your ForkLift app with a valid license key inside ForkLift. During this registration process, ForkLift sends the encrypted license key to the Binarynights server for validation. The server checks the license key and replies with a digitally signed confirmation if it is valid. Update checking If you have enabled the Check for Updates automatically option in the Preferences of ForkLift, then ForkLift checks once every day if there is a new update available. To do this, ForkLift sends a request containing the version number of ForkLift you are using, and a small amount of metadata about your device (such as which operating system version it is running) which may be necessary to determine if there is a new update and if it can be installed on your device. Data NOT collected Application Usage Analytics We DO NOT collect any information about the way you use ForkLift. Other Information In ForkLift you can connect to remote locations using a variety of protocols. Using ForkLift, you can send and receive files over a network. We DO NOT have access to these files and CANNOT and DO NOT share these with third parties. ForkLift DOES NOT collect or send out any private information. We and third parties DO NOT have access to: Usernames Passwords Server addresses SSH keys Encryption keys Names and contents of files Information from device sensors Keyboard input Screen content Network traffic Cameras Microphones Third-Party Vendors Our payment service provider is FastSpring https://fastspring.com PayPal is used for purchases if PayPal is selected as the payment method https://www.paypal.com Our email service provider is G Suite https://gsuite.google.com/products/gmail/ Our support service solution provider is Zendesk https://zendesk.com/ Some (parts) of the bug reports and feature requests sent to us by our users are uploaded to GitHub https://github.com , our software version development control provider Our newsletters are sent out using Mad Mimi https://madmimi.com We use Google Analytics to track activities on our Site https://analytics.google.com Data Protection We make sure that your personal data is treated securely. But remember that no method of transmission over the Internet, or method of electronic storage is 100% secure. We protect your personal data against accidental, unlawful or unauthorized destruction, loss, alteration, access, disclosure or use. However, we cannot guarantee that the stored data is absolutely secure. If we learn of a data breach, we may attempt to notify you and provide information on protective steps, if available, through the email address that you have provided to us or by posting a notice on our Site or through other appropriate communication channels. Your Rights Concerning your personal data, you have the right to Obtain information on whether or not your personal data is being processed and to receive the personal data that is being processed in an intelligible form Request rectification or erasure of personal data, or restriction of or objection to the processing of your personal data. You may also request us to provide you your data To exercise these rights, please contact us by email at support@binarynights.com We may request you to provide a copy of your ID card or otherwise evidence your identity. Updates to this Privacy Policy We may update this Privacy Policy from time to time. We will notify you of any significant changes to this Privacy Policy on our Website or through other appropriate communication channels. All changes shall be effective from the date of publication, unless otherwise provided in the notification. Contact If you have any comments or inquiries about the information in this Privacy Policy, if you would like us to update your personal data, or to exercise your rights, please contact us by email at support@binarynights.com Copyright © document.write(new Date().getFullYear()) BinaryNights LLC. All rights reserved. Privacy (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){ (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o), m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m) })(window,document,'script','https://www.google-analytics.com/analytics.js','ga'); ga('create', 'UA-1506177-1', 'auto', {'allowLinker': true}); ga('require', 'linker'); ga('linker:autoLink', ['fastspring.com']); ga('send', 'pageview');"
