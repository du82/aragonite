title = "Forklift 4"
description = "Manage your files quickly across local drives and remote servers with ease. ForkLift is a robust FTP/SFTP/WebDAV/Amazon S3/Backblaze B2/Google Drive/Rackspace Cloud Files client and a powerful and versatile file manager."
full_description = "Connect to SFTP, FTP, WebDav, Amazon S3, Backblaze B2, Google Drive, OneDrive, Dropbox, Rackspace Cloudfiles, SMB, AFP, and NFS remote volumes. Manage your files efficiently across networks: connect to multiple servers simultaneously and even copy between them with drag and drop. Compare local or remote source and target folders identifying matching, modified, new and deleted files. Synchronize them one or two-way with a single mouseclick, or save it as a favorite. Up to 20x faster analyzation than ForkLift 3. Experience enhanced efficiency for remote destinations. Think of it like having favorites within favorites—an organized way to keep track of paths you frequently use and want quick access to . The preview panel shows you useful information about the selected file. Playback audio and video files, inspect images, PDFs and other popular document types. Quick edit text files in place, both on local drives and remote servers. Whether you're copying, renaming, deleting, compressing, or handling other tasks, this feature lets you see exactly what's going on. No more guesswork—watch your tasks progress in real-time and stay in control of your file management action. Easily access your favorites, devices, menu commands, open a selected file with a preferred application, or apply a previously saved Multi Rename preset on selected files or folders. Get valuable insights into your file management activities and their results, all in one easy-to-access place. Reorder transfers, set conflict management rules, error handling, limit download and upload bandwidth. Organize your documents and files with tags: add, edit, remove, search, or filter them within ForkLift. Given two identical folder structures. Browse in one pane and let ForkLift do the job for you in the other pane. Select files by typing a filename, an extension, or a tag and add them or exclude them from the selection. Set your preferred editor in ForkLift to edit remote files and we take care of uploading your changes as you save."
