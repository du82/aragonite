["https://binarynights.com/support"]
title = "Forklift 4"
description = "Manage your files quickly across local drives and remote servers with ease. ForkLift is a robust FTP/SFTP/WebDAV/Amazon S3/Backblaze B2/Google Drive/Rackspace Cloud Files client and a powerful and versatile file manager."
full_description = '''What are the system requirements for ForkLift 4? ForkLift 4 requires macOS Monterey (macOS 12) or later. How should I install ForkLift 4? Please read our Quick Start Guide on how to start using ForkLift 4 and the basics of using the app. Do I need to delete ForkLift 3 if I want to install ForkLift 4? You don't have to delete ForkLift 3 when transitioning to ForkLift 4. Simply move ForkLift 4 into the Applications folder using Finder and choose to "Keep Both" versions if Finder detects a conflict in the file names. If you don't want to keep ForkLift 3, then Replace ForkLift 3 with ForkLift 4. Avoid using an App Deleter application to uninstall any ForkLift versions, as these applications often remove supporting files for both ForkLift 3 and ForkLift 4, potentially causing the loss of your settings and favorites. If you need to remove one ForkLift version, just move it into the Trash. Is the ForkLift license a one-time fee, or per year? The license of ForkLift is a hybrid model between the one-time purchase and the subscription model. With a license of ForkLift, you can use ForkLift for as long as you want and install updates for either 1 or 2 years, depending on your selection. If you wish to install a new update to ForkLift after that, you will need to buy a new license. I recently purchased a ForkLift 3 license, do I need to buy a new license? If you purchased a ForkLift license within the past year, then your license key is still valid for ForkLift 4. Enter your license key into the Registration Window of ForkLift 4, and ForkLift 4 will display if the license is valid for that version. After you enter a license key, you can check the date of its validity under ForkLift > About ForkLift. I bought a previous version of ForkLift in the past. Can I get an upgrade discount? If you already own a ForkLift license, then you are eligible for an upgrade bonus of an additional 100 days of free updates on top of your license and any additional bonuses. To claim the bonus, enter your old license key in our store and buy a new licensese. The additional days will be automatically added to your license. You can check the eligibility of free updates under ForkLift > About ForkLift in the menu of ForkLift.'''
year_published = 2025
