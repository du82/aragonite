title = "What is a website?"
full_description = "HTTP is the Hyper Text Transport Protocol. The text being transmitted is organized in a hierarchical structure that uses a predetermined markup language that supports many formatting options but ultimately allows the client to render content however it wants. How much more do you need? Satisfying these basic requirements will make your website portable, accessible, legible, responsive, fast, and lightweight. Your website is broken. Your website is a nightmare to read and navigate. Your website is so heavy that viewing your page puts me over my monthly mobile data limit. Your website is so slow that I’ve written this entire page in the time it takes yours to load. Your website is a crime against end users and a computing atrocity. What do we want when we view a website? Text with links. You shouldn’t be designing anything because text with links is the default. This website runs everywhere from Plan 9 to the command line. It looks about the same no matter which client you use. Can you say the same thing about your website? Probably not considering the fact that it was designed to be used exclusively with chrome."
