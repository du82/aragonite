title = "EnzyFluo™ Fatty Acyl-CoA Assay Kit | BioAssay Systems"
description = "For bulk quote or custom reagents, please email or call 1-510-782-9988 x 1.Orders are shipped the same day if placed by 2pm PSTShipping: IceDelivery: 1-2 days (US), 3-6 days (Intl)Storage: -20°C upon receipt."
full_description = "EnzyFluo™ Fatty Acyl-CoA Assay Kit Product Overview Product FAQ Product Citations Assay Service Protocol SDSApplicationFor quantitative determination of fatty acyl-CoAs in tissue and cell lysates.Key FeaturesSensitive and accurate. Use as little as 10 µL samples. Linear detection range in 96-well plate: 0.3 to 100 µM fatty acyl-CoA. The internal standard method minimizes potential sample matrix interferences.Fast and convenient. Room temperature assay with a 40 min incubation. No 37°C incubator is needed.High-throughput. Homogeneous “mix-incubate-measure” type assay. It can be readily automated to assay thousands of samples per day.MethodFL530/585nmSamplesTissue and cell lysatesSpeciesAllProcedures40 minSize100 tests in 96-well plateDetection Limit0.3 µMShelf Life6 monthsMore Details Fatty Acyl-CoAs are a combination of Coenzyme A covalently bound to long-chain fatty acids. Fatty acyl-CoAs serve as both a precursor for triglyceride and phospholipids synthesis and a product of lipid catabolism. Catabolically, they facilitate the transport of fatty acids to the mitochondria for shuttling via the carnitine shuttle and subsequent β-oxidation of the fatty acid. Conversion of fatty acids to fatty acyl-CoAs is necessary for the generation of ATP during periods of high energy demand. Elevated fatty acyl-CoA levels may indicate dysregulation of lipid metabolism such as due to insulin resistance. Certain genetic disorders may also affect fatty acyl-CoA levels.BioAssay Systems’ fluorimetric fatty acyl-CoA assay works using a combination of enzymes that utilize fatty acyl-CoA as a substrate, which is coupled to form a fluorescent product. The resulting fluorescence intensity at λexc/em = 530/585 nm is linear to the fatty acyl-CoA concentration in the sample.How should I store my samples?Fatty acyl-CoAs are not stable and samples should ideally be tested the same day. Otherwise, snap freeze the samples in liquid nitrogen or freeze at -80°C for up to one week.Can this kit be used with serum or plasma samples?In our testing, the concentration of fatty acyl-CoAs was too low to detect in these samples.Can I use a different lysis buffer?We suggest using a lysis buffer that is pH 7.4 and is 0.5% – 5.0% triton X-100 buffer to dissolve fatty acyl-CoAs. For more detailed product information and questions, please feel free to email or call us at 1-510-782-9988 x 2. For more general information regarding our assays, please refer to Technical Support.No citations for this new product. Please check back later. You may click here to check if citations are available, but are not listed here yet.If you or your labs do not have the equipment or scientists necessary to run this assay, BioAssay Systems can perform the service for you.– Fast turnaround – Quality data – Low costPlease email or call 1-510-782-9988 x 2 to discuss your projects. $469.00 - EnzyFluo™ Fatty Acyl-CoA Assay Kit quantity +Add to cart ;jQuery(document).ready(function($){ $('.elementor-element-6082b0a form.cart').on( 'click', 'span.wl-qunatity-plus, span.wl-qunatity-minus', function() { // Get current quantity values var qty = $( this ).closest( 'form.cart' ).find( '.qty' ); var val = parseFloat(qty.val()); var min_val = 1; var max = parseFloat(qty.attr( 'max' )); var min = parseFloat(qty.attr( 'min' )); var step = parseFloat(qty.attr( 'step' )); // Change the value if plus or minus if ( $( this ).is( '.wl-qunatity-plus' ) ) { if ( max && ( max <= val ) ) { qty.val( max ); } else{ qty.val( val + step ); } } else { if ( min && ( min >= val ) ) { qty.val( min ); } else if ( val > min_val ) { qty.val( val - step ); } } }); }); Catalog No: EFCOA-100 Categories Blood & Urine Chemistry, Diabetes & Obesity, HTS Reagents & Kits, Metabolism Tags acyl-CoA, Blood & Urine Chemistry, Diabetes & Obesity, EFCOA-100, EnzyFluo™ Fatty Acyl-CoA Assay Kit, fatty acyl-CoA, Fatty Acyl-CoA Detection Kit, Fatty Acyl-CoA Measurement Kit, Fatty Acyl-CoA Quantitative Kit, Fatty Acyl-CoA Screening Kit, HTS Reagents & Kits, metabolismFor bulk quote or custom reagents, please email or call 1-510-782-9988 x 1.Orders are shipped the same day if placed by 2pm PSTShipping: IceDelivery: 1-2 days (US), 3-6 days (Intl)Storage: -20°C upon receipt.Related ProductsYou may also like…NameSKUPriceBuy EnzyChrom™ L-Carnitine Assay Kit ELCR-100$579.00 Add to cart Blood & Urine Chemistry EnzyChrom™ L-Carnitine Assay Kit $579.00 - EnzyChrom™ L-Carnitine Assay Kit quantity + Add to cart EnzyChrom™ Free Fatty Acid Assay Kit EFFA-100$489.00 Add to cart Agriculture & Environment EnzyChrom™ Free Fatty Acid Assay Kit $489.00 - EnzyChrom™ Free Fatty Acid Assay Kit quantity + Add to cart EnzyChrom™ Coenzyme A Assay Kit ECOA-100$479.00 Add to cart Diabetes & Obesity EnzyChrom™ Coenzyme A Assay Kit $479.00 - EnzyChrom™ Coenzyme A Assay Kit quantity + Add to cart Why BioAssay SystemsQuality and User-friendly • Expert Technical Support • Competitive Prices • Expansive Catalogue • Trusted Globally"
