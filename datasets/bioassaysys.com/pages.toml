full_description = "QuantiChrom™ γ-Glutamyl Transferase Assay Kit Product Overview Product FAQ Product Citations Assay Service Protocol SDSApplicationFor quantitative determination of γ-glutamyl transferase enzyme activity in biological samples.Key FeaturesSafe and sensitive. Non-radioactive assay. Use as little as 10 μL of sample. Linear detection range in 96-well plate: 0.7 to 200 U/L activity.Fast and convenient. The procedure involves addition of a single ready-to-use reagent and incubation for 30 min. Room temperature assay. No 37°C incubator is needed.High-throughput. Homogeneous “mix-incubate-measure” type assay. Can be readily automated to assay thousands of samples per day.MethodOD405nmSamplesSerum, plasma, cell lysate, and other biological samplesSpeciesAllProcedures30 minSize100 tests in 96-well plateDetection Limit0.7 U/LShelf Life6 monthsMore Details γ-GLUTAMYL TRANSFERASE (GGT, E.C. 2.3.2.2) is an enzyme that catalyzes the transfer of a glutamyl group to an acceptor, such as a peptide or amino acid. GGT plays a major role in the breakdown of glutathione and is found in many tissues, but is more commonly found in the liver. Elevated levels of GGT may indicate liver disease or damage to the bile ducts, and in clinical practice, it is often tested along with other liver function tests. BioAssay Systems’ DGGT-100 kit provides a convenient colorimetric method to measure GGT activity. In this assay, GGT hydrolyzes a synthetic substrate to release p-nitroanilide (pNA), which absorbs at 405 nm. The increase in absorbance at 405 nm is directly proportional to the enzyme activity.Does this kit come with a positive control?No, this kit does not include GGT enzyme. This needs to be supplied by the user.I am encountering high assay background, is this an issue?There may be increase in background signal of the Reagent over time. However, the calculated results should still be fine since the background is subtracted out when calculating the ΔOD (30 – 0 min).The results for my samples are not within the reference ranges for GGT.Please note that the unit definition used for this assay is based on the μmol of pNA generated, which can be different from the units used by clinical reference ranges that are often listed in IU (international units). Reference ranges may also vary depending on the laboratory. Please also keep in mind that this kit is for research use only, and not to be used for diagnostic purposes.For more detailed product information and questions, please feel free to email or call us at 1-510-782-9988 x 2. For more general information regarding our assays, please refer to Technical Support.No citations for this new product. Please check back later. You may click here to check if citations are available, but are not listed here yet.If you or your labs do not have the equipment or scientists necessary to run this assay, BioAssay Systems can perform the service for you.– Fast turnaround – Quality data – Low costPlease email or call 1-510-782-9988 x 2 to discuss your projects. $459.00 - QuantiChrom™ γ-Glutamyl Transferase Assay Kit quantity +Add to cart ;jQuery(document).ready(function($){ $('.elementor-element-6082b0a form.cart').on( 'click', 'span.wl-qunatity-plus, span.wl-qunatity-minus', function() { // Get current quantity values var qty = $( this ).closest( 'form.cart' ).find( '.qty' ); var val = parseFloat(qty.val()); var min_val = 1; var max = parseFloat(qty.attr( 'max' )); var min = parseFloat(qty.attr( 'min' )); var step = parseFloat(qty.attr( 'step' )); // Change the value if plus or minus if ( $( this ).is( '.wl-qunatity-plus' ) ) { if ( max && ( max <= val ) ) { qty.val( max ); } else{ qty.val( val + step ); } } else { if ( min && ( min >= val ) ) { qty.val( min ); } else if ( val > min_val ) { qty.val( val - step ); } } }); }); Catalog No: DGGT-100 Categories Blood & Urine Chemistry, Diabetes & Obesity, Enzyme Activity, HTS Reagents & Kits, Metabolism Tags Blood & Urine Chemistry, DGGT-100, DGGT-100 determination kits, Diabetes & Obesity, Enzyme Activity, gamma glutamyl transferase, gamma-glutamyl transpeptidase, Gamma-glutamyltransferase, ggt, GGTP, Glutamyl Transferase detection kits, Glutamyl Transferase determination kits, Glutamyl Transferase measurement kits, Glutamyl Transferase screening kits, Glutamyl Transferase test kits, HTS Reagents & Kits, metabolism, QuantiChrom™gamma-Glutamyl Transferase Assay KitFor bulk quote or custom reagents, please email or call 1-510-782-9988 x 1.Orders are shipped the same day if placed by 2pm PSTShipping: RTDelivery: 1-2 days (US), 3-6 days (Intl)Storage: -20°C upon receipt.Related ProductsYou may also like…NameSKUPriceBuy EnzyChrom™ Alanine Transaminase Assay Kit EALT-100$389.00 Add to cart Blood & Urine Chemistry EnzyChrom™ Alanine Transaminase Assay Kit $389.00 - EnzyChrom™ Alanine Transaminase Assay Kit quantity + Add to cart EnzyChrom™ Aspartate Transaminase Assay Kit EASTR-100$429.00 Add to cart Blood & Urine Chemistry EnzyChrom™ Aspartate Transaminase Assay Kit $429.00 - EnzyChrom™ Aspartate Transaminase Assay Kit quantity + Add to cart QuantiChrom™ Alkaline Phosphatase Assay Kit DALP-250$419.00 Add to cart Agriculture & Environment QuantiChrom™ Alkaline Phosphatase Assay Kit $419.00 - QuantiChrom™ Alkaline Phosphatase Assay Kit quantity + Add to cart QuantiChrom™ Lactate Dehydrogenase Kit D2DH-100$379.00 Add to cart Agriculture & Environment QuantiChrom™ Lactate Dehydrogenase Kit $379.00 - QuantiChrom™ Lactate Dehydrogenase Kit quantity + Add to cart Why BioAssay SystemsQuality and User-friendly • Expert Technical Support • Competitive Prices • Expansive Catalogue • Trusted Globally"
