full_description = "CareersCurrent Open Positions SALES ASSOCIATEPosition Title: Sales AssociateJob Code: SA003Company Name: BioAssay SystemsLocation: 3191 Corporate Place, Hayward, CA, USAJob Type: Part-time (Full-time)Job Overview:We are seeking a proactive and organized Sales Associate to join our team at BioAssay Systems. In this role, you will be responsible for processing customer orders, preparing shipping documents, maintaining detailed records, and ensuring efficient product packaging for shipment. You will communicate regularly with customers via phone, fax, and email to provide exceptional service. Initial training will be provided.Key Responsibilities:Process customer orders accurately and efficiently.Prepare shipping documents and ensure timely dispatch of products.Maintain organized and detailed records of transactions.Handle customer inquiries and resolve issues via phone, fax, and email in a professional and courteous manner.Package products for shipment, ensuring proper labeling and handling.Meet deadlines and maintain punctuality.Required Qualifications:High school diploma or equivalent education.Comfortable and confident in communicating with customers via phone and email, ensuring a positive experience.Self-motivated with the ability to work independently and complete tasks without direct supervision.Excellent communication skills (both written and spoken) in English.Strong attention to detail, excellent organizational skills, and the ability to multitask effectively.Proficiency in Microsoft Office and Excel.Reliable, punctual, and able to meet deadlines consistently.Ability to lift up to 25-30 lbs.Position Benefits:While this position starts as part-time, there is potential for transition to a full-time role. Full-time employees enjoy the following benefits:Paid vacation and holidays.401(k) plan with company match.Health and dental insurance with generous company premium contributions.Supportive and team-oriented work environment.Principals only. No phone calls or inquiries. Only candidates selected for an interview will be contacted.Apply Now RESEARCH ASSOCIATE – MANUFACTURINGPosition Type: Research Associate – ManufacturingJob Code: MA005Company Name: BioAssay SystemsJob Location: 3191 Corporate Place- Hayward- CA- USAJob Type: Full TimeOverviewWe are currently looking for an enthusiastic research associate to join our manufacturing team. This position will entail preparing reagents for our assay kits, QCing, and packaging the finished products. This candidate may also join part time in our R&D team.Required QualificationsIndependent and self-motivated. Initiates completion of tasks and activities without needing supervisionDetail oriented, organized and able to meet deadlinesMust have excellent communication skills (fluent in both written and spoken English)Proficient with Microsoft Office and Excel Preferred QualificationsA college degree in chemistry, biochemistry or biology and 1-2 years of relevant laboratory experienceExperience preparing buffers, solutions, and reagents in bulkExperience with biochemical assays Position BenefitsVacation and holidays401(k) plan with company matchHealth and dental insurance with generous company premium coverageSupportive work environmentFlexible working hoursOpportunities for faster than average promotions Principals only. No phone calls or inquiries. Only candidates selected for an interview will be contacted. Apply Now RESEARCH ASSOCIATE – ASSAY DEVELOPMENTPosition Type: Research Associate – Assay DevelopmentJob Code: AD005Company Name: BioAssay SystemsJob Location: 3191 Corporate Place- Hayward- CA- USAJob Type: Full TimeOverviewWe currently have an exciting opportunity for an enthusiastic research associate to join our growing R&D team. This position will play an important role in increasing our already extensive catalog of biochemical colorimetric, fluorescent, and luminescent 96-well and 384-well plate assay kits. In addition, this role will assist our analytical services department in establishing additional techniques to expand our service capabilities. This candidate may also be involved in providing technical support to customers.This is a fantastic opportunity for a motivated recent graduate to be part of a successful and expanding team while learning a number of laboratory skills in a supportive environment. In addition, working on service projects will expose the candidate to multiple other companies and research areas. Moreover, as a small company we offer ample opportunities for professional growth and faster than average promotions.Required QualificationsA bachelors degree in biochemistry, chemistry, biology, or related fieldIndependent and self-motivated. Initiates completion of tasks and activities with minimal supervisionDetail oriented, organized and able to meet deadlinesExcellent communication skills and fluent in both written and spoken English (a good sense of humor is a plus) Preferred Qualifications1-2 years of relevant laboratory experienceExperience preparing reagents and buffersExperience with biochemical assaysSome experience with or knowledge of mammalian cell culture Position BenefitsVacation and holidays401(k) plan with company matchHealth and dental insurance with generous company premium coverageSupportive work environmentFlexible working hoursOpportunities for faster than average promotions Principals only. No phone calls or inquiries. Only candidates selected for an interview will be contacted. Apply NowAbout Us BioAssay Systems develops and markets innovative and high-throughput assay solutions to satisfy the ever increasing demands of the life sciences and drug discovery industries. BioAssay Systems offers assay kits that are simple, convenient to use and superior in performance. With our assay kits, researchers need little-to-no time for assay optimization. We specialize in biochemical and cell-based assays for both routine laboratory tests and for high-throughput drug discovery applications with a focus on safe, nonradioactive assay formats such as absorbance, fluorescence and luminescence detection techniques.Since the 1990s, the wide spread application of robotics has revolutionized how modern drug discovery and clinical diagnostics are conducted. Automated systems have greatly increased the throughput while freeing up researchers from repetitive tasks. Clinical laboratories can now test thousands of samples per day and drug discovery companies can screen chemical libraries consisting of millions of individual compounds in a matter of days. With automated or semi-automated equipment being increasingly implemented in academic and industrial laboratories, there is growing demand for reliable assays that are simple, convenient, and can be readily adapted to run in a high-throughput fashion.It was these challenges and opportunities that drove the founding of BioAssay Systems. The founders of BioAssay Systems have over 50 years of extensive experiences in modern drug discovery. Over the past 18 years, we have developed over 200 assay kits for drug discovery and life sciences research. In addition to the assay products, we also offer analytical services. Our technical support team consists of real lab scientists. Customer’s questions are answered directly by the same scientists who developed our assay kits.At BioAssay Systems, we pride ourselves on offering the highest possible quality and the most convenient assay products to help accelerate biomedical research and discovery.BioAssay Systems is an equal opportunity employer and values the diversity of our employees."
