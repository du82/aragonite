full_description = 'Assay CustomizationBioAssay Systems offers customization of any of our assays if a customer should have special requirements. Our scientists have over 50 years of extensive hands-on experience in assay development and execution. During the past decades, we have successfully helped our customers achieve their goals. Since we develop and manufacture our own assay kits, we can easily optimize and/or modify our kits for custom applications.Examples of Assays We Have Previously Modified to Meet Customers’ Specific Requirements Lactate Assay for Measurement in Single Cells Optimized our EnzyFluo™ L-Lactate Assay Kit (EFLLC-100) for use in measuring the increase of the L-Lactate concentration in single cells using fluorescent microscopy. Inquire Peroxide Assay for Non-aqueous Samples Optimized our QuantiChrom Peroxide Assay Kit (DIOX-250) for use in measuring organic hydroperoxides in non-aqueous samples. Inquire For further information or to request a quotation please contact us by email, or call us at +1-510-782-9988 ext 2.Customer Testimonials "The guys at BioAssay Systems know their science! I had to develop a bioassay for our company and Robert was very quick to respond to keep us up to date. They are knowledgeable and very resourceful. They directed us to one of the bulk suppliers that could give us a really good deal on our active ingredient. They keep very detailed records for our research needs. I would recommend working with BioAssay Systems on your assay development projects!" Anh-Dung LeCEO DermaTec LLC "It is a pleasure working together with BioAssay Systems. I brought samples to their Hayward location and received the results in less than 24 hr. The discussion with Robert Z was courteous, open, and with a depth of knowledge. Robert has a PhD from Stanford. Also, Frank Huang, the CEO, had sufficient scientific curiosity to try out our cleanser and provide feedback! This is beyond the call of customer relations. BioAssay Systems is a company with a lot of expertise and a friendly, responsive approach to problem solving. I will enthusiastically continue to work with them to carry out our research." Edward T. WeiChief Scientific Officer, Orinda Pharma, Inc. "I would like to show my appreciation to the Bioassay Systems service team. We are developing an assay to measure the change in lactate concentration of single cell samples using fluorescent microscopy. The BioAssay Systems team was quite helpful in assisting us to optimize their fluorescent L-Lactate assay kit for our unique experimental set-up. The BioAssay Systems team is always friendly and knowledgeable. We know that we can rely on them for fast and professional service." Paul AbbyadPh.D., Assistant Professor, Santa Clara University "While developing biodegradable coatings for Drug Eluting Stents I worked with Bob to develop an accurate, precise and sensitive assay for determining the amount of polymer remaining in tissue. It was a pleasure to work with Bob and his team, they are very thorough, they understand the science very well and they always deliver on time and at the right price. I would highly recommend anyone using BioAssay Systems services in the future." Patrick H. RuanePh.D., Director Chemistry XTENT, Inc.'
