title = "QuantiQuik™ Fecal Occult Blood Test Strips | BioAssay Systems"
description = "For bulk quote or custom reagents, please email or call 1-510-782-9988 x 1.Orders are shipped the same day if placed by 2pm PSTShipping: RTDelivery: 2-6 days (US), 6-15 days (intl)Storage: RT upon receipt."
full_description = "QuantiQuik™ Fecal Occult Blood Test Strips Product Overview Product FAQ Product Citations Assay Service Protocol SDSApplicationFor fecal occult blood determination in human, mouse, rabbit, chicken, goat and pig feces samples.Key FeaturesSensitive. Allows detection of very low occult blood (e.g. 0.15mg hemoglobin/g in mouse) in feces samples.Convenient. No sophisticated laboratory equipment is required.Sample treatment and assay can be performed in under 15 minutes.MethodVisualSamplesFeces samplesSpeciesHuman, mouse, rabbit, chicken, goat and pigProcedures10 minSize10 testsDetection Limit0.15mg hemoglobin/g in mouseShelf Life6 monthsMore Details FECAL OCCULT BLOOD (FOB) represents hidden blood in feces. The presence of FOB indicates GI tract hemorrhage. GI tract hemorrhage is a common symptom of colorectal cancer and GI tract inflammation, among other health complications. Therefore, determining the presence of FOB in mammal feces sample is critical for health care. This product can be applied to mammals including humans, goats, dogs, rodents and birds. BioAssay Systems’ Fecal Occult Blood Test (FOBT) provides a quick, simple, convenient and ultrasensitive method for detection of blood in feces samples through a red-ox indicator. As hemoglobin in the feces sample oxidizes the substrate, the red-ox indicator changes from light-brown to blue. The development of a blue color indicates the presence of blood in the sample. The intensity of the blue color correlates to the amount of occult blood in the sample.Can I quantify the amount Hemoglobin in the feces sample?No, this test was designed to indicate if the feces sample contains blood or not.My test strip turned to green color after a long term storage. Can this test strip be used for an experiment?Yes, the test strip still can be applied to a Fecal Occult Blood Test. The presence of green color on the strip is caused by partial decomposition of redox indicator on the strip. However, we have tested that the test strip turned to green also can detect the presence of the blood at the detection limit.I don’t have access to a homogenizer. How can I effectively homogenize the feces samples?The feces sample can be homogenized with a tooth pick by vigorously shaking for 1 minute in the deionized water.For more detailed product information and questions, please feel free to email or call us at 1-510-782-9988 x 2. For more general information regarding our assays, please refer to Technical Support.No citations for this new product. Please check back later. You may click here to check if citations are available, but are not listed here yet.If you or your labs do not have the equipment or scientists necessary to run this assay, BioAssay Systems can perform the service for you.– Fast turnaround – Quality data – Low costPlease email or call 1-510-782-9988 x 2 to discuss your projects. $73.00 - QuantiQuik™ Fecal Occult Blood Test Strips quantity +Add to cart ;jQuery(document).ready(function($){ $('.elementor-element-6082b0a form.cart').on( 'click', 'span.wl-qunatity-plus, span.wl-qunatity-minus', function() { // Get current quantity values var qty = $( this ).closest( 'form.cart' ).find( '.qty' ); var val = parseFloat(qty.val()); var min_val = 1; var max = parseFloat(qty.attr( 'max' )); var min = parseFloat(qty.attr( 'min' )); var step = parseFloat(qty.attr( 'step' )); // Change the value if plus or minus if ( $( this ).is( '.wl-qunatity-plus' ) ) { if ( max && ( max <= val ) ) { qty.val( max ); } else{ qty.val( val + step ); } } else { if ( min && ( min >= val ) ) { qty.val( min ); } else if ( val > min_val ) { qty.val( val - step ); } } }); }); Catalog No: QQFOBT10 Category : Quick Test Strips Tags Fecal Hidden Blood test strips, Fecal Occult Blood Determination Test Strips, Fecal Occult Blood Test Strips, FOBT test strips, Haptoglobin, Hemoglobin, QQFOBT10, QQFOBT10 test strips, QuantiQuik™ Fecal Occult Blood Test Strips, Quick Test StripsFor bulk quote or custom reagents