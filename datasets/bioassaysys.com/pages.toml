title = "Assay Design & Development Services | BioAssay Systems"
description = "Assay Design & Development Services. BioAssay Systems’ scientists have over 50 years of extensive experience in assay development and have designed over 250 assay kits for research and drug discovery."
full_description = 'Assay Design & DevelopmentBioAssay Systems’ scientists have over 50 years of extensive experience in assay development and have designed over 250 assay kits for research and drug discovery. Our scientists will work with you to create the assays to meet your project’s needs. Whether it is developing an entirely novel assay or modifying an existing assay to meet certain specifications, we can provide the service to accomplish your goals.Novel Assay DesignWe work with you from concept design through sample testing to create assays that will meet your research needs. If there is not an existing assay to measure your analyte of interest, we will develop one. The following is a list of common formats and methodologies that we can use to develop a novel assay. Common Assay Formats96/384-WellCuvettePaper Based Common Measurement MethodsAbsorbanceFluorescence (FI, FP, TRF, FRET)Luminescence Common Assay MechanismsChemicalEnzymaticAntibody (e.g. ELISA)Common Assay Sample TypesCells and Cell LysatesTissues and Tissue LysatesBlood, Serum, Plasma, Urine, Saliva, etc Examples of Novel Assay Design: BioAssay Systems has developed a proprietary ultra-sensitive assay to quantify Polylactate Polymer such as PLA and PLGA, in tissue samples. Inquire Existing Assay Modification: In addition to developing new assays from scratch, we also have a catalogue of over 250 assay kits we can modify to meet your assay needs and requirements. InquireCommon Assay ModificationsOptimizing an assay for low volume samples for when samples are preciousDeveloping sample preparation procedures for unique samplesLowering the detection range and sensitivity of an assay to quantify a target rangeRevising assay reagents to work with specific sample types Examples of Assay ModificationPeroxide Assay for Non-aqueous Samples. The QuantiChrom™ Peroxide Assay Kit (DIOX-250) was optimized for use in measuring organic hydroperoxides in non-aqueous samples.Lactate Assay for Measurement in Single Cells. The EnzyFluo™ L-Lactate Assay Kit (EFLLC-100) was optimized for use in measuring the increase of the L-Lactate concentration in single cells using fluorescent microscopy Our assay modifications are not limited to these options though, please contact us by email, or call us at +1-510-782-9988 ext 2, with your assay modification project and we will evaluate its feasibility.Customer Testimonials "The guys at BioAssay Systems know their science! I had to develop a bioassay for our company and Robert was very quick to respond to keep us up to date. They are knowledgeable and very resourceful. They directed us to one of the bulk suppliers that could give us a really good deal on our active ingredient. They keep very detailed records for our research needs. I would recommend working with BioAssay Systems on your assay development projects!" Anh-Dung LeCEO DermaTec LLC "It is a pleasure working together with BioAssay Systems. I brought samples to their Hayward location and received the results in less than 24 hr. The discussion with Robert Z was courteous, open, and with a depth of knowledge. Robert has a PhD from Stanford. Also, Frank Huang, the CEO, had sufficient scientific curiosity to try out our cleanser and provide feedback! This is beyond the call of customer relations. BioAssay Systems is a company with a lot of expertise and a friendly, responsive approach to problem solving. I will enthusiastically continue to work with them to carry out our research." Edward T. WeiChief Scientific Officer, Orinda Pharma, Inc. "I would like to show my appreciation to the Bioassay Systems service team. We are developing an assay to measure the change in lactate concentration of single cell samples using fluorescent microscopy. The BioAssay Systems team was quite helpful in assisting us to optimize their fluorescent L-Lactate assay kit for our unique experimental set-up. The BioAssay Systems team is always friendly and knowledgeable. We know that we can rely on them for fast and professional service." Paul AbbyadPh.D., Assistant Professor, Santa Clara University "While developing biodegradable coatings for Drug Eluting Stents I worked with Bob to develop an accurate, precise and sensitive assay for determining the amount of polymer remaining in tissue. It was a pleasure to work with Bob and his team, they are very thorough, they understand the science very well and they always deliver on time and at the right price. I would highly recommend anyone using BioAssay Systems services in the future." Patrick H. RuanePh.D., Director Chemistry XTENT, Inc.'
