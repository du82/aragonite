full_description = "QuantiChrom™ Glycosaminoglycans Assay Kit Product Overview Product FAQ Product Citations Assay Service Protocol SDSApplicationFor quantitative determination of glycosaminoglycans in food and tissue homogenate.Key FeaturesSensitive and accurate. Use as little as 40 μL samples. Linear detection range in 96-well plate: 0.01 to 0.5 mg/mL hyaluronic acid.Fast and convenient. The procedure involves addition of a single working reagent and incubation for 10 min. Room temperature assay. No 37°C incubator is needed.High-throughput. Homogeneous “mix-incubate-measure” type assay. Can be readily automated to assay thousands of samples per day.MethodOD600nmSamplesFood and tissue homogenatesSpeciesAllProcedures10 minSize100 tests in 96-well plateDetection Limit0.01 mg/mLShelf Life6 monthsMore Details GLYCOSAMINOGLYCANS (GAGs) are long, linear polysaccharides and highly negatively charged molecules that constitute a major component of the extracellular matrix in mammalian tissues. GAGs play key roles in cell growth, cell adhesion, wound repair, and anticoagulation. They are also important for brain development and homeostasis. GAGs are associated with osteoarthritis, inflammation, diabetes, spinal cord injury, and cancer.BioAssay Systems’ GAGs assay uses a turbidimetric reaction in which GAGs form an insoluble complex with protein in the reagent. The increase in turbidity at 600nm is directly proportional to the glycosaminoglycans in the sample (reported in hyaluronic acid equivalents).Does this kit measure all types of GAGs?All GAGs will be included in the signal; however, it is most accurate for hyaluronic acid. When testing heparin, we found that the signal strength was lower and the shape of the curve was different when compared to a hyaluronic acid standard curve at the same concentrations (mg/mL).Can this assay be scaled down to 384-well plate format?We have tested the 384-well format with a similar assay and found that the signal was compromised, most likely because the wells were unable to mix fully.How do I know if I need a sample blank?You can compare the absorbance of your sample vs the absorbance of the blank well. In a clear 96-well plate, add 40 μL sample + 160 μL H2O to one well (sample blank) and 40 μL H2O + 160 μL Reagent to another well (blank well). Incubate for 10min at RT then read OD 600nm. If the sample blank is significantly higher than the blank well, then your sample requires a sample blank.For more detailed product information and questions, please feel free to email or call us at 1-510-782-9988 x 2. For more general information regarding our assays, please refer to Technical Support.No citations for this new product. Please check back later. You may click here to check if citations are available, but are not listed here yet.If you or your labs do not have the equipment or scientists necessary to run this assay, BioAssay Systems can perform the service for you.– Fast turnaround – Quality data – Low costPlease email or call 1-510-782-9988 x 2 to discuss your projects. $549.00 - QuantiChrom™ Glycosaminoglycans Assay Kit quantity +Add to cart ;jQuery(document).ready(function($){ $('.elementor-element-6082b0a form.cart').on( 'click', 'span.wl-qunatity-plus, span.wl-qunatity-minus', function() { // Get current quantity values var qty = $( this ).closest( 'form.cart' ).find( '.qty' ); var val = parseFloat(qty.val()); var min_val = 1; var max = parseFloat(qty.attr( 'max' )); var min = parseFloat(qty.attr( 'min' )); var step = parseFloat(qty.attr( 'step' )); // Change the value if plus or minus if ( $( this ).is( '.wl-qunatity-plus' ) ) { if ( max && ( max <= val ) ) { qty.val( max ); } else{ qty.val( val + step ); } } else { if ( min && ( min >= val ) ) { qty.val( min ); } else if ( val > min_val ) { qty.val( val - step ); } } }); }); Catalog No: DGAG-100 Categories Food & Beverage Analysis, HTS Reagents & Kits, Metabolism Tags DGAG, DGAG-100, Food & Beverage Analysis, GAGs, glycosaminoglycans, HTS Reagents & Kits, hyaluronic acid, metabolism, QuantiChrom™ Glycosaminoglycans Assay KitFor bulk quote or custom reagents, please email or call 1-510-782-9988 x 1.Orders are shipped the same day if placed by 2pm PSTShipping: RTDelivery: 1-2 days (US), 3-6 days (Intl)Storage: -20°C upon receipt.Related ProductsYou may also like…NameSKUPriceBuy QuantiChrom™ Hyaluronidase Inhibitor Screening Assay Kit DIHY-100$519.00 Add to cart Enzyme Activity QuantiChrom™ Hyaluronidase Inhibitor Screening Assay Kit $519.00 - QuantiChrom™ Hyaluronidase Inhibitor Screening Assay Kit quantity + Add to cart Why BioAssay SystemsQuality and User-friendly • Expert Technical Support • Competitive Prices • Expansive Catalogue • Trusted Globally"
