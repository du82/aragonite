["https://biomedcentral.com/about"]
title = "About BMC"
full_description = "About BMC BMC has an evolving portfolio of some 300 peer-reviewed journals, sharing discoveries from research communities in science, technology, engineering and medicine. In 1999 we made high quality research open to everyone who needed to access it – and in making the open access model sustainable, we changed the world of academic publishing.We are committed to continual innovation in research publishing to better support the needs of our communities, ensuring the integrity of the research we publish and championing the benefits of open research for all.Our leading research journals include selective titles such as BMC Biology, BMC Medicine, Genome Biology, Genome Medicine and BMC Global and Public Health, academic journals such as Journal of Hematology & Oncology, Malaria Journal and Microbiome, and the BMC series, 53 inclusive journals focused on the needs of individual research communities. We also partner with leading institutions and societies to publish journals on their behalf.BMC is part of Springer Nature, giving us greater opportunities to help authors everywhere make more connections with research communities across the world."
