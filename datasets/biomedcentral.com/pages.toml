["https://biomedcentral.com/about/standards-and-affiliations"]
title = "Standards and affiliations"
full_description = "Standards and affiliations We are committed to maintaining high standards through full and stringent peer review.The detailed peer-review policy of each journal is the responsibility of the journal editor(s) concerned; for example, some journals operate an open and others a closed peer review system.COPEBMC is a member of COPE (Committee on Publication Ethics), which is a charity registered in the UK. It is concerned with the integrity of peer-reviewed publications in science, particularly biomedicine.Creative CommonsCreative Commons is a non-profit organization that promotes the creative re-use of intellectual works, whether they are owned or public-domain. Authors publishing with BMC retain the copyright to their work, licensing it under a Creative Commons licence. To learn more about OA licences visit our licensing and copyright guide.DuraSpaceBMC (Open Repository) is a DuraSpace Registered Service Provider and members of the Open Repository Team belong to DCAT (DuraSpace Community Advisory Team). This reflects our continuing commitment to DSpace open source digital repository software and our position as an active participant within the DuraSpace community. As an Open Repository client, or BMC Member, you will also benefit from SWORD feeds, so any articles published by your authors in BMC journals, will automatically be fed into your repository within 24 hours of publication.OASPABMC is a founder member of OASPA (Open Access Scholarly Publishers Association), which is an organization set up to support and represent the interests of open access journal publishers in all scientific, technical, and scholarly disciplines."
