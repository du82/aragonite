full_description = "Press center The BMC Communications team promotes the research from the 300 open access peer-reviewed journals that BMC publishes.Press releasesOn these pages you will find the full list of journal content and corporate press releases that have been issued. You can also read news and views from our staff, researchers, and various stakeholders on our blog network.JournalistsWe invite journalists to register on the Springer Nature press site to receive our embargoed press releases. We can also help you navigate content and put you in touch with experts in open access publishing, research integrity, and peer review.Press officersWe support press officers and public information officers by providing embargo details and can help to arrange a publication date for articles by researchers from your institute. All of our content is open access and free to reuse providing that it is attributed correctly under the conditions of our licence agreement.Media office contactsFor general media queries, please email pressoffice@springernature.comAlice Kay Senior Communications Manager Email: alice.kay@springernature.com Telephone: +44 20 3192 2470Alex Durk Communications Officer Email: alex.durk@springernature.com Telephone: +44 20 3192 2736Ben Norris Communications Officer Email: benjamin.norris@springernature.com Telephone: +44 20 7843 2662"
