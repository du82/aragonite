["https://biomedcentral.com/getpublished/editorial-policies"]
title = "Editorial policies"
full_description = "Editorial policies Table of contents Overview Communicate with Respect Ethics and consent Research involving human embryos, gametes, and stem cells Sex and gender in research (SAGER) Research involving animals Research involving plants Research involving palaeontological and geological material Dual Use Research of Concern Standards for research in complementary and alternative medicine Consent for publication Trial registration Availability of data and materials Standards of reporting Describing new taxa Competing interests Authorship Artificial Intelligence (AI) Citations Preprint sharing and citation Duplicate publication Communications of findings prior to publication Text recycling Peer review Confidentiality Misconduct Corrections and retractions Appeals and complaints Collections and Special Issues Overview Back to top BMC is a member of the Committee on Publication Ethics (COPE) and endorses the World Association of Medical Editors (WAME) Policy Statement on Geopolitical Intrusion on Editorial Decisions. BMC also endorses the International Committee of Medical Journal Editors (ICMJE) Recommendations for the Conduct, Reporting, Editing and Publication of Scholarly Work in Medical Journals.Submission of a manuscript to a BMC journal implies that all authors have read and agreed to its content and that the manuscript conforms to the journal’s policies.Springer Nature remains neutral with regard to jurisdictional claims in published maps and institutional affiliations. Communicate with Respect Back to top At Springer Nature we believe that only through relationships based upon mutual respect can we build trust and deliver quality publishing products and services to the communities we serve. Our staff are expected to behave professionally and respectfully at all times when engaging with authors, reviewers and readers. Likewise, we expect the same standards of behavior from the academic community and the public in their interactions with our staff. We do not tolerate aggressive behavior, or any form of harassment, bullying or discrimination directed against Springer Nature staff. We reserve the right to bring serious cases to the attention of employers or local authorities, if needed, and may refuse to interact, or do business, with individuals who repeatedly or seriously violate this policy. Ethics and consent Back to top Ethics approvalResearch involving human participants, human material, or human data, must have been performed in accordance with the Declaration of Helsinki and must have been approved by an appropriate ethics committee. A statement detailing this, including the name of the ethics committee and the reference number where appropriate, must appear in all manuscripts reporting such research. If a study has been granted an exemption from requiring ethics approval, this should also be detailed in the manuscript (including the name of the ethics committee that granted the exemption). Further information and documentation to support this should be made available to the Editor on request. Manuscripts may be rejected if the Editor considers that the research has not been carried out within an appropriate ethical framework. In rare cases, the Editor may contact the ethics committee for further information.Retrospective ethics approvalIf a study has not been granted ethics committee approval prior to commencing, retrospective ethics approval usually cannot be obtained and it may not be possible to consider the manuscript for peer review. The decision on whether to proceed to peer review in such cases is at the Editor's discretion.New clinical tools and proceduresAuthors reporting the use of a new procedure or tool in a clinical setting, for example as a technical advance or case report, must give a clear justification in the manuscript for why the new procedure or tool was deemed more appropriate than usual clinical practice to meet the patient’s clinical need. Such justification is not required if the new procedure is already approved for clinical use at the authors’ institution. Authors will be expected to have obtained ethics committee approval and informed patient consent for any experimental use of a novel procedure or tool where a clear clinical advantage based on clinical need was not apparent before treatment.Consent to participateFor all research involving human participants, informed consent to participate in the study should be obtained from participants (or their parent or legal guardian in the case of children under 16) and a statement to this effect should appear in the manuscript. For manuscripts reporting studies involving vulnerable groups (for example, unconscious patients) where there is the potential for coercion (for example prisoners) or where consent may not have been fully informed, manuscripts will be considered at the editor’s discretion and may be referred to an internal editorial oversight group for further scrutiny. Consent must be obtained for all forms of personally identifiable data including biomedical, clinical, and biometric data. In the case of articles describing human transplantation studies, authors must include a statement declaring that no organs/tissues were obtained from prisoners and must also name the institution(s)/clinic(s)/department(s) via which organs/tissues were obtained. Documentary evidence of consent must be supplied if requested. Research involving human embryos, gametes, and stem cells Back to top Manuscripts that report experiments involving the use of human embryos and gametes, human embryonic stem cells and related materials, and clinical applications of stem cells must include confirmation that all experiments were performed in accordance with relevant guidelines and regulations (See also Ethics and Consent)The manuscript should include an ethics statement identifying the institutional and/or national research ethics committee (including the name of the ethics committee) approving the experiments and describing any relevant details. Authors should confirm that informed consent (See also Ethics and Consent and Consent for publication) was obtained from all recipients and/or donors of cells or tissues, where necessary, and describe the conditions of donation of materials for research, such as human embryos or gametes. Copies of approval and redacted consent documents may be requested by the Editor.We encourage authors to follow the principles laid out in the 2016 ISSCR Guidelines for Stem Cell Research and Clinical Translation.In deciding whether to publish papers describing modifications of the human germline, the Editors are guided by safety considerations, compliance with applicable regulations, as well as the status of the societal debate on the implications of such modifications for future generations. In case of concerns regarding a particular type of study the Editor may seek advice from the Springer Nature Research Integrity Group.The decision to publish a paper is the responsibility of the Editor-in-Chief of the Journal. Sex and gender in research (SAGER) Back to top We encourage our authors to follow the ‘Sex and Gender Equity in Research – SAGER – guidelines’ and to include sex and gender considerations where relevant. Authors should use the terms sex (biological attribute) and gender (shaped by social and cultural circumstances) carefully in order to avoid confusing both terms. Article titles and/or abstracts should indicate clearly what sex(es) the study applies to. Authors should also describe in the background, whether sex and/or gender differences may be expected; report how sex and/or gender were accounted for in the design of the study; provide disaggregated data by sex and/or gender, where appropriate; and discuss respective results. If a sex and/or gender analysis was not conducted, the rationale should be given in the Discussion. We suggest that our authors consult the full guidelines before submission. Definition of Sex and Gender (taken from Office of Research in Women’s Health, NIH). Sex - refers to biological differences between females and males, including chromosomes, sex organs, and endogenous hormonal profiles. Gender- refers to socially constructed and enacted roles and behaviors which occur in a historical and cultural context and vary across societies and over time. Applications of the guidelines: These guidelines apply to studies involving humans, vertebrate animal and cell lines. Research involving animals Back to top Experimental research on vertebrates or any regulated invertebrates must comply with institutional, national, or international guidelines, and where available should have been approved by an appropriate ethics committee. The International Council for Laboratory Animal Science (ICLAS) has published ethical guidelines.A statement detailing compliance with relevant guidelines (e.g. the revised Animals (Scientific Procedures) Act 1986 in the UK and Directive 2010/63/EU in Europe) and/or ethical approval (including the name of the ethics committee and the reference number where appropriate) must be included in the manuscript. If a study has been granted an exemption from requiring ethics approval, this should also be detailed in the manuscript (including the name of the ethics committee that granted the exemption and the reasons for the exemption). The Editor will take account of animal welfare issues and reserves the right to reject a manuscript, especially if the research involves protocols that are inconsistent with commonly accepted norms of animal research. In rare cases, the Editor may contact the ethics committee for further information.Manuscripts presenting studies that have employed anesthesia or euthanasia methods inconsistent with the commonly accepted norms of veterinary best practice (e.g. chloral hydrate, ether, and chloroform) will not be considered. Decisions to not consider manuscripts presenting such anesthesia or euthanasia methods are independent of the approving ethics committee and any previously published work. We recommend that authors consult the American Veterinary Medical Association (AVMA) Guidelines for the Euthanasia of Animals (2020), as a comprehensive resource for guidance on veterinary best practice for the anesthesia and euthanasia of animals.For experimental studies involving client-owned animals, authors must also document informed consent from the client or owner and adherence to a high standard (best practice) of veterinary care.Field studies and other non-experimental research on animals must comply with institutional, national, or international guidelines, and where available should have been approved by an appropriate ethics committee. A statement detailing compliance with relevant guidelines and/or appropriate permissions or licences must be included in the manuscript. We recommend that authors comply with the IUCN Policy Statement on Research Involving Species at Risk of Extinction and the Convention on the Trade in Endangered Species of Wild Fauna and Flora. Research involving plants Back to top Experimental research and field studies on plants (either cultivated or wild), including the collection of plant material, must comply with relevant institutional, national, and international guidelines and legislation. Manuscripts should include a statement specifying the appropriate permissions and/or licences for collection of plant or seed specimens. We recommend that authors comply with the IUCN Policy Statement on Research Involving Species at Risk of Extinction and the Convention on the Trade in Endangered Species of Wild Fauna and Flora.To support reproducibility, voucher specimens for all wild plants described in a manuscript must be deposited in a public herbarium or other public collection that provides access to deposited material. Information on the voucher specimen and who identified it must be included in the manuscript. Research involving palaeontological and geological material Details of palaeontological specimens and geological samples should include clear provenance information to ensure full transparency of the research. It is recognized that precise provenance information may not be available for older museum collections. In circumstances where providing specific provenance information may compromise the security of palaeontological or geological sites it may be appropriate to exclude detailed locality information. Samples must always be collected and exported in a responsible manner and in accordance with applicable local and national laws. Any submission detailing new material should include information regarding the requisite permissions obtained and the issuing authority. Authors may be required to provide specific supporting documentation upon request. Type, figured and cited palaeontological specimens, should be deposited in a recognised museum or collection to permit free access by other researchers in perpetuity. Sufficient information on the repository, including the assigned unique catalogue numbers (where applicable), should be provided to allow the specimens to be traced. We encourage deposition of 3-D scans of fossil specimens (where appropriate) within a permanent, accessible repository to facilitate study by the scientific community. Springer Nature requires that submitted content adheres to the United Nations Educational, Scientific and Cultural Organization (UNESCO) normative instruments for the protection of cultural heritage, and Resolutions, Motions, guidance and other statements of the International Union for the Conservation of Nature (IUCN). Dual Use Research of Concern Back to top Some manuscripts provide information that could be directly misapplied to pose a significant threat to public health, safety or security, agricultural crops and other plants, animals, or the environment. For such information to be published, the benefit to the research community, society, or to public health, must outweigh any risks. We reserve the right to take expert advice in cases where we believe that concerns may arise, and we may require a manuscript to undergo peer review specifically to assess the dual use risk. Where the risk of misuse outweighs any potential benefit, publication is declined; published content may be corrected, retracted or removed. Researchers are expected to comply with their institutional and funder’s requirements, as well as any national regulations. They should be aware of dual-use concerns related to their work and take steps to minimize misuse of their research. Such concerns include, but are not limited to, biosecurity, nuclear and chemical threats. Where relevant regulations exist, authors should disclose whether their study is subject to consideration as dual use research of concern; if it is, the manuscript should report the authority granting approval and reference number for the regulatory approval. When the study reports material that can be harmful outside the laboratory context, the manuscript should "
