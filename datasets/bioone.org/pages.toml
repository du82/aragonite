full_description = "Browse the entire BioOne Digital Library Discover research from BioOne Complete and BioOne eBooks, featuring 200+ full-text journals and 360+ eBook titles from our publishing partners. Browse by Collection: All Titles Publishers Subjects A B C E F G H I J L M N O P R S T U W Z Economic Botany Publisher: The New York Botanical Garden Economic Botany bridges the gap between pure and applied botany by publishing interdisciplinary work on the rich relationship that exists between plants and people, including the past, present, and potential uses of plants. Economic Botany is available in BioOne Complete through the 2007 volume. Current Issue | All Issues Ecoscience Publisher: Centre d'études nordiques, Université Laval Ecoscience is a multidisciplinary journal that publishes ecological research on patterns and processes at various temporal and spatial scales and at different levels of biological organization. Current Issue | All Issues Edentata Publisher: IUCN/SSC Anteater, Sloth and Armadillo Specialist Group Edentata is dedicated to publishing work on the taxonomy, systematics, genetics, biogeography, ecology, conservation, behavior, and health of the of the anteater, sloth, and armadillo species. Edentata is available in BioOne Complete through the 2015 volume. Current Issue | All Issues Entomologica Americana Publisher: The New York Entomological Society Entomologica Americana publishes original entomological research on the taxonomy, classification, phylogeny biogeography, behavior, and natural history of insects and other arthropod taxa. Current Issue | All Issues | Issues In Progress Entomological News Publisher: The American Entomological Society Entomological News publishes entomological manuscripts on taxonomic revisions, phylogenetics, biogeography and faunistics, and descriptive morphology of insects and terrestrial arthropods. Current Issue | All Issues Environmental Entomology Publisher: Entomological Society of America Environmental Entomology publishes reports on the interaction of insects with the biological, chemical, and physical aspects of their environment, as well as relevant book reviews, interpretive articles, and Letters to the Editor. Environmental Entomology is available in BioOne Complete from 2000 through the current volume. Current Issue | All Issues Environmental Health Insights Publisher: SAGE Publishing Environmental Health Insights is an open access, peer reviewed international journal focusing on how environmental factors affect the health of individuals and societies. Current Issue | All Issues | Issues In Progress ESA Handbooks Publisher: Entomological Society of America Most Recent Book | List of Books Evansia Publisher: The American Bryological and Lichenological Society Evansia publishes a wide variety of research focused on the biological, environmental, and economic issues surrounding lichens and bryophytes, with a heavy focus on issues in North America. Current Issue | All Issues Evolution Publisher: The Society for the Study of Evolution Evolution, published since 1947 by the Society for the Study of Evolution, contains work that extends our understanding of evolutionary phenomena and processes, as well as integrative work with various related fields of science concerned with evolution. Evolution is available in BioOne Complete through the 2009 volume. Current Issue | All Issues"
