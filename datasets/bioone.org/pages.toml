full_description = "Browse the entire BioOne Digital Library Discover research from BioOne Complete and BioOne eBooks, featuring 200+ full-text journals and 360+ eBook titles from our publishing partners. Browse by Collection: All Titles Publishers Subjects Agriculture & Agronomy (20) Biodiversity Conservation (54) Ecology (70) Entomology (48) Environmental Sciences (34) Evolutionary Biology (20) Geology & Paleontology (30) Marine & Freshwater Biology (19) Ornithology (16) Plant Sciences (49) Veterinary Sciences (14) Zoology (68) Air, Soil and Water Research Publisher: SAGE Publishing Air, Soil and Water Research publishes research on soil, air, and water. The journal reports on properties—including physical, chemical, biochemical, and biological—analysis, microbiology, chemicals and pollution, consequences for plants and crops, soil hydrology, and other considerations. Current Issue | All Issues | Issues In Progress Australian Soil and Land Survey Handbook Series Publisher: CSIRO Publishing Most Recent Book | List of Books Canadian Journal of Animal Science Publisher: Canadian Science Publishing Canadian Journal of Animal Science contains new research on all aspects of animal agriculture and animal products, such as breeding and genetics, welfare and management, and cellular and molecular biology. Current Issue | All Issues Canadian Journal of Plant Science Publisher: Canadian Science Publishing Canadian Journal of Plant Science contains research on plant science relevant to the environmental regions of Canadian agriculture, including plant production/management, horticulture, and pest management. Current Issue | All Issues Canadian Journal of Soil Science Publisher: Canadian Science Publishing Canadian Journal of Soil Science contains research on the use, management, structure and development of soils, and publishes content from the varied disciplines of soil science, from geology to agrometerology. Current Issue | All Issues Crop and Pasture Science Publisher: CSIRO Publishing Crop and Pasture Science publishes strategic and innovative research in crop and pasture sciences and the sustainability of farming systems. Its primary focus is broad-scale cereals, grain legumes, oilseeds, and pastures. Current Issue | All Issues ESA Handbooks Publisher: Entomological Society of America Most Recent Book | List of Books Individual Titles Publisher: CSIRO Publishing Most Recent Book | List of Books Integrated Environmental Assessment and Management Publisher: Society of Environmental Toxicology and Chemistry Integrated Environmental Assessment and Management publishes multidisciplinary work which fosters the application of science in environmental decision-making, in areas such as policy, regulation, and management. Integrated Environmental Assessment and Management is available in BioOne Complete through the 2009 volume. Current Issue | All Issues Invasive Plant Science and Management Publisher: Weed Science Society of America Invasive Plant Science and Management covers many aspects of invasive plant biology, such as ecology, management, restoration, educational activities, policy issues, and case study reports. Current Issue | All Issues Journal of Agricultural and Urban Entomology Publisher: South Carolina Entomological Society Journal of Agricultural and Urban Entomology publishes research on insects and other arthropods of agricultural and urban significance, including those affecting livestock, wildlife, lawns, landscapes, and crops. Current Issue | All Issues Journal of Economic Entomology Publisher: Entomological Society of America Journal of Economic Entomology publishes articles on the economic significance of insects, and includes sections on apiculture and social insects, insecticides, biological control, household and structural insects, and crop protection. Journal of Economic Entomology is available in BioOne Complete from 2000 to the current volume. Current Issue | All Issues Journal of Vegetation Science Publisher: International Association of Vegetation Science Journal of Vegetation Science publishes papers on all aspects of vegetation science, with particular emphasis on papers that develop new concepts or methods, test theory, or identify general patterns. Journal of Vegetation Science is available in BioOne Complete through the 2008 volume. Current Issue | All Issues Miscellaneous Publications of the Entomological Society of America Publisher: Entomological Society of America Most Recent Book | List of Books One Off Titles of the Entomological Society of America Publisher: Entomological Society of America Most Recent Book | List of Books Palynology Publisher: AASP: The Palynological Society Palynology, published by The Palynological Society, contains both novel and traditional work on the science of organic microfossils and their modern counterparts, and includes research on all palynomorph groups and geological ages. Current Issue | All Issues Thomas Say Memoirs Publisher: Entomological Society of America Most Recent Book | List of Books Thomas Say Proceedings Publisher: Entomological Society of America Most Recent Book | List of Books Weed Science Publisher: Weed Science Society of America Weed Science publishes fundamental research directly related to all aspects of weed science in agricultural systems, including topics such as herbicide resistance, weed control tools, chemistry, and genetics. Current Issue | All Issues Weed Technology Publisher: Weed Science Society of America Weed Technology publishes work that furthers the understanding of how weeds are managed, including work on herbicides, weed biology, new control technologies, and reports of new weed issues. Current Issue | All Issues | Issues In Progress"
