t('Hide Excerpt'); $('#aToggleSign').text('-'); } else { div.style.display = 'none'; //obj.text('View Excerpt +'); $('#aToggleText').text('View Excerpt'); $('#aToggleSign').text('+'); } } return false; } SPIEMathjaxTypeset() Abstract We present the Andean Social–Ecological Observatory Network (ROSA, for Red de Observatorios Socioecológicos Andinos), a continent-wide monitoring initiative established to address major challenges in the management of knowledge on social–ecological systems (SES) in the Andes. The Andes, the longest mountain chain in the world, provide key ecosystem services for human wellbeing across the continent. However, the region faces multiple impacts associated with climate change and land-use change related to demographic transitions, and thus long-term monitoring is key for developing adaptation strategies to this environmental change. ROSA constitutes a bottom-up initiative to systematize and integrate social and ecological monitoring efforts into observatories, and to do so under a coproduced framework that fosters science–policy dialogue and promotes sustainable land management. The main research questions addressed by these social–ecological observatories include understanding how distant and proximate drivers of change interact with local social, cultural, economic, and environmental contexts to influence the functioning of different SES in the Andes at multiple spatial and temporal scales. We describe the origins, structure, objectives, and strategies of ROSA and key challenges faced by different monitoring networks working in the region with regard to data generation and knowledge transfer. Currently, ROSA consists of 8 nodal observatories, comprising more than 50 monitoring initiatives focused on hydroclimate, ecological, and land-use dimensions. The bottom-up structure of ROSA is founded on proven expertise in long-term data gathering and analyses and on the strong commitment of nodal monitoring groups. Effective codesign and participatory monitoring are being developed so that ROSA can contribute to knowledge coproduction for sustainable land management. IntroductionBackground and relevanceThe complex, dynamic, and multidimensional interactions of the components of social–ecological systems (SES) hinder the identification of causal relationships (Martínez-Fernández et al 2021). Addressing SES in biological and cultural diversity hotspots such as the Andes can help us to understand the interactions that emerge in a heterogeneous landscape and how these systems are affected by global changes. The Andes, the longest and second highest mountain range on Earth, extend from the tropics to southern Patagonia. The headwaters of South America's most important river systems originate here, providing essential ecosystem services for more than 65 million people in the Andean mountains and in the South American lowlands (Isbell et al 2017; Mathez-Stiefel et al 2017). Despite the importance of the Andes, initiatives that integrate social and ecological information at different spatial and temporal scales are scarce, limiting our understanding of the interactions of SES components and their responses to global changes (eg Collins et al 2011).Long-term social–ecological monitoring (LTSEM) is a key mechanism by which to identify the essential factors that increase the resilience of SES to global change and reduce ecosystem degradation. Accordingly, the integration of data generated by existing LTSEM efforts and the dissemination of emerging information can facilitate participatory and sustainable management (Carilla, Aráoz, Osinaga, et al 2023). However, integrating LTSEM when considering broad spatial and temporal scales and the requirements and worldviews of diverse actors poses major challenges. The wide variety of networks in the Andes that address the generation of knowledge, its management, and its transfer to policymakers and the public creates various data-related, conceptual, and operational challenges (Carilla, Aráoz, Osinaga, et al 2023). These challenges are summarized as follows: (1) strike a balance between the thorough comprehension gained from local case studies and the global scope of integrated studies across disciplines and spatial scales; (2) attain a consistent and integrated monitoring approach in the Andes, including currently underrepresented social dimensions as well as experiences of participatory monitoring and codesign articulated with stakeholders; (3) handle the trade-off between locally specific studies and regional harmonization that emerges from bottom-up data gathering and synthesis; (4) effectively integrate diverse forms of knowledge, reconciling perspectives, beliefs, and traditional knowledge into unified conceptual models and systematic monitoring efforts; (5) achieve effective science–policy dialogues, addressing concrete questions and governance challenges; (6) implement participatory comanagement, considering social differences and minimizing conflicts; and (7) ensure the '''
