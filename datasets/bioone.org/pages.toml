full_description = "Browse the entire BioOne Digital Library Discover research from BioOne Complete and BioOne eBooks, featuring 200+ full-text journals and 360+ eBook titles from our publishing partners. Browse by Collection: All Titles Publishers Subjects A B C E F G H I J L M N O P R S T U W Z South American Journal of Herpetology Publisher: Brazilian Society of Herpetology South American Journal of Herpetology, published by the Brazilian Society of Herpetology, publishes work related to the biology of amphibians and reptiles, including theoretical, descriptive, comparative, inferential, and experimental studies and taxa from anywhere in the world. Current Issue | All Issues Southeastern Naturalist Publisher: Eagle Hill Institute Southeastern Naturalist publishes natural history research related to all aspects of the biology and ecology of the organisms and environments of the southeastern portion of North America. Current Issue | All Issues | Issues In Progress Southwestern Entomologist Publisher: Society of Southwestern Entomologists Southwestern Entomologist publishes articles on the results of entomological research in the southwestern region of the United States as well as Mexico, in addition to entomological work relevant to this region. Current Issue | All Issues | Issues In Progress The Southwestern Naturalist Publisher: Southwestern Association of Naturalists The Southwestern Naturalist, founded in 1953, publishes natural history research, particularly on the study of the biota found in the region that includes the southwestern United States, Mexico, and Central America. Current Issue | All Issues | Issues In Progress Systematic and Applied Acarology Publisher: Systematic and Applied Acarology Society Systematic and Applied Acarology publishes scientific papers reporting results of original research on any aspects of mites and ticks, in order to foster the exchange of information between acarologists. Current Issue | All Issues | Issues In Progress Systematic Botany Publisher: The American Society of Plant Taxonomists Systematic Botany, published by the American Society of Plant Taxonomists, publishes papers on botanical topics such as taxonomy, systematics, speciation, morphometrics, molecular phylogeny, conservation, biogeography, and methods. Current Issue | All Issues | Issues In Progress"
