tern slope of the Central Cordillera of Colombia at elevations between 970 and 1200 m, for which the morphoanatomical and palynological attributes were analyzed. We want to explore in this work whether the variation exhibited by these populations and their distribution allows us to postulate the occurrence of a new species with sufficient evidence for its separation. Citation Download Citation Fernando Alzate-Guarín, María del Pilar Sepúlveda-Nieto, and Diego Ramírez "A New Species of Heliconia from Colombia: A Proposal Based on Different Characters," Systematic Botany 49(3), 515-521, (19 November 2024). https://doi.org/10.1600/036364424X17267811220425 Published: 19 November 2024 SIGN IN TO VIEW ARTICLE Email Password Forgot your password? Show Remember Email on this computer Remember Password Please wait... No BioOne Digital Library account? Create an account or Access Institutional Sign In via Shibboleth or OpenAthens function ShowHidePwdSignIn() { var $pwd = $(".pwdSignIn"); if ($pwd.attr('type') == 'password') { $pwd.attr('type', 'text') } else $pwd.attr('type', 'password') } function ShowForgotPasswordDialog() { $('.ui-dialog-content').dialog('close'); $("#divPopupForgotPassword").dialog( { width: 360, height: 375, modal: true, resizable: false, draggable: false, closeOnEscape: true, zIndex: 999, title: 'FORGOT PASSWORD', close: function () { $("#ForgotPasswordComment").text('') } } ); return false; } $(document).ready(function () { var $form = $("#SignInForm-FullAccessSignIn"); $form.on("submit", function (e) { e.preventDefault(); var $divSigninDialogWait = $form.find(".divSigninDialogWait"); var $btnSigninDialogSubmit = $form.find(".btnSigninDialogSubmit"); var $SignInErrorMessage = $form.find("#SignInErrors-FullAccessSignIn"); $divSigninDialogWait.show(); $btnSigninDialogSubmit.hide(); $SignInErrorMessage.text("").hide(); $.ajax({ type: "POST", url: '/Account/SignIn', data: $(this).serialize(), dataType: 'json', success: function (result) { if (result && res