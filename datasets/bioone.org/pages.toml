["https://bioone.org/journals/weed-technology/volume-38/issue-1/wet.2024.67/Khakiweed-Alternanthera-pungens-control-with-contact-and-residual-herbicides/10.1017/wet.2024.67.full"]
title = "Khakiweed (Alternanthera pungens) control with contact and residual herbicides"
description = "Khakiweed is a perennial broadleaf weed that is difficult to control because of its multiple means of reproduction, vigorous growth, and deep taproot. Khakiweed reduces the performance of pasture, pecan, and turf areas by choking out desirable grass and legume species. Because information on the effectiveness of contact and residual herbicides for control in pecan and pasture areas is limited, greenhouse studies were conducted to determine the effect of application timing, mode of action, and rate on khakiweed control. Preemergence and postemergence herbicides were applied to mature khakiweed plants at 0.25X, 0.5X, 1X, or 2X the label recommended rate for general broadleaf control. Biomass was collected 3 wk after application. Plants regrew from roots in the greenhouse until a second biomass harvest was collected at 6 wk after treatment (WAT). Metsulfuron-methyl, indaziflam, or pendimethalin was applied preemergence to the soil surface. All rates of preemergence herbicides provided high-efficacy control of regrowth (>85%) compared to the nontreated control. The efficacies of postemergence-applied metsulfuron-methyl, metsulfuron-methyl + nicosulfuron, indaziflam, aminopyralid + florpyrauxifen-benzyl, 2,4-D amine, and 2,4-D amine + florpyrauxifen-benzyl were also examined. All postemergence herbicide treatments exhibited control compared to the nontreated plants at both sample timings (3 and 6 WAT) and increased with herbicide application rate. No herbicide provided high-efficacy control during the initial postspray period (0 to 3 WAT). During the regrowth period (3 to 6 WAT), metsulfuron-methyl alone and in combination gave >85% control of khakiweed biomass, indicating that the sulfonylurea herbicides used in this study are well suited to controlling khakiweed. Nomenclature: Aminopyralid; florpyrauxifen-benzyl; indaziflam; metsulfuron-methyl; nicosulfuron; pendimethalin; 2,4-D; khakiweed, Alternanthera pungens Kunth; pecan, Carya illinoinensis (Wangenh.) K. Koch"
