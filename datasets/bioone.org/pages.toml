full_description = '''Special Content Collections Browse curated research collections featuring articles in BioOne Complete journals—putting a spotlight on current events and conversations in biological, ecological, and environmental sciences. Recent Special Content Collections From Agriculture to Zoology: 25 Years of Critical Research BioOne’s community of nonprofit publishers is dedicated to informing and inspiring this generation of scientists – and the next. We invite you to explore some of their most impactful work in this special 25th anniversary collection. Browse the BioOne 25th Anniversary Collection Earth Day 2024 Focused on promoting sustainable practices and raising awareness, the Earth Day 2024 theme "Planet vs. Plastics," underscores the urgent need to address the escalating environmental crisis caused by plastic pollution. This collection of peer-reviewed scientific research explores the impacts of plastic pollution on environments, biodiversity, and the potential to impact human health. Browse the Earth Day 2024 Collection 2024 BioOne Ambassador Awards Nominee Research Explore published research from early career researchers nominated for the 2024 BioOne Ambassador Awards by BioOne Complete partner publishers. Browse the 2024 BioOne Ambassador Awards Nominee Research Collection More Special Content Collections Cannabis Science2023 BioOne Ambassador Award Nominee ResearchUnited Nation's Sustainable Development Goals (SDGs)2022 BioOne Ambassador Award Nominee ResearchRemembering E. O. Wilson and Thomas LovejoyEarth Day 2021BioOne Celebrates the 50th Anniversary of Earth DayPeer-Reviewed Research to Inform the Coronavirus Crisis Join our email list to get BioOne VISTA in your inbox. Recommend BioOne Complete to your librarian. Learn how libraries can subscribe, or request a quote for your institution. For More BioOne Complete Content: Sign up to get BioOne VISTA, Top & Trending Research and other new article collections sent to your inbox. Get Content Alerts with your free BioOne Digital Library account for notifications when new issues or content matching your search criteria is published.'''
