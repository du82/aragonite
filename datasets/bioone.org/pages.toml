full_description = "Browse BioOne Complete Access leading research from 200+ full text journals in the biological, ecological, and environmental sciences. Titles Publishers Subjects A B C E F G H I J L M N O P R S T U W Z Journal of Agricultural and Urban Entomology Publisher: South Carolina Entomological Society Journal of Agricultural and Urban Entomology publishes research on insects and other arthropods of agricultural and urban significance, including those affecting livestock, wildlife, lawns, landscapes, and crops. Current Issue | All Issues The Journal of Arachnology Publisher: American Arachnological Society The Journal of Arachnology publishes scientific articles and short communications reporting substantially novel and significant observations and data regarding any aspect of the biology of arachnid groups. Current Issue | All Issues Journal of Avian Medicine and Surgery Publisher: Association of Avian Veterinarians Journal of Avian Medicine and Surgery is focused on the medicine and surgery of both captive and wild birds. It includes scientific articles, case reports, editorials, abstracts, new research, and book reviews. Current Issue | All Issues | Issues In Progress Journal of Coastal Conservation Publisher: Coastal & Marine Union (EUCC) Journal of Coastal Conservation publishes theoretical and applied interdisciplinary research on integrated and sustainable management of the terrestrial, coastal, and marine environmental interface. Journal of Coastal Conservation is available in BioOne Complete through the 2004 volume. Current Issue | All Issues Journal of Coastal Research Publisher: Coastal Education and Research Foundation Journal of Coastal Research (JCR) publishes content relevant to natural and engineered coastline environments (freshwater, brackish, or marine) and the protection/management of their resources. Current Issue | All Issues Journal of Crustacean Biology Publisher: The Crustacean Society Journal of Crustacean Biology contains papers