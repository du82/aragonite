description = "Explore peer-reviewed scientific research from independent societies publishing journals and eBooks in the biological, ecological, and environmental sciences with BioOne Complete and BioOne eBooks."
full_description = "Explore more than 580 journals and eBooks in the biological, ecological, and environmental sciences. Advanced Search Featured Journal Journal of East African Natural History publishes papers and notes in the field of natural history relevant to the eastern African region, particularly regarding the conservation of its biological diversity. Learn more about this title Featured Article A New Species of Heliconia from Colombia: A Proposal Based on Different Characters Read the featured article Featured Collection BioOne Vista – Urban & Backyard Birds Read for Free Through March 14 Browse Journals 200+ full-text journals in the biological, ecological, and environmental sciences. Browse Journals Browse eBooks 360+ eBooks from BioOne partners Entomological Society of America and CSIRO Publishing. Browse eBooks News & Info BioOne: Subscribe to Open In 2026 BioOne will offer 71 titles via a Subscribe to Open pilot for our flagship aggregation BioOne Complete, advancing our mission to increase access to content benefiting libraries, publishers, and the wider biosciences community. Learn more about the Subscribe to Open pilot BioOne eBooks: CSIRO Publishing BioSelect Collection In partnership with CSIRO Publishing, this collection of 204 eBooks is an invaluable resource for environmental, plant and animal scientists, and researchers, practitioners, and students in related disciplines. Learn more and download a title list Article Collection Archive Explore Top & Trending Research and BioOne VISTA article collections from BioOne Complete. Explore the Article Collection Archive Featured Articles Top articles by subject, from BioOne Complete AGRICULTURE & AGRONOMY Determination of Evapotranspiration and Crop Coefficient for Tomato by Using Non-Weighing Lysimeter in Semiarid Region Air, Soil and Water Research Khakiweed (Alternanthera pungens) control with contact and residual herbicides Weed Technology BIODIVERSITY CONSERVATION Determining the Effectiveness and Usefulness of Three Community-Led Carnivore Survey Types to Wildlife Management in the Nyae Nyae Conservancy, Namibia African Journal of Wildlife Research Better Population Monitoring and Understanding of Dynamic Lags Could Aid Freshwater Mussel Conservation American Malacological Bulletin ENTOMOLOGY Diversity of spider families parasitized by fungal pathogens: a global review The Journal of Arachnology First report of Leucopina bivittata (Malloch, 1940) (Diptera: Chamaemyiidae) feeding on the vine mealybug, Planococcus ficus (Signoret, 1875) (Hemiptera: Pseudococcidae), and its first report from Baja California Norte, Mexico The Pan-Pacific Entomologist ENVIRONMENTAL SCIENCES ROSA: An Andean Network of Social–Ecological Observatories Anthropozoologica Long-Term Changes in Nesting Raptor Communities after Construction of Wind Power Projects Journal of Raptor Research ZOOLOGY Population Size, Sex-Ratio and Age Structure of Hippopotamus amphibius in Nimule National Park, South Sudan Journal of East African Natural History Yawning and Its Temperature-Dependent Modulation in Leopard Geckos Zoological Science"
