description = "Discover a curated collection of peer-reviewed research on invertebrate zoology. Explore cutting-edge studies on biodiversity, physiology, ecology, and evolutionary biology."
full_description = "Invertebrate Zoology BioOne Vista | January 2025 BioOne Complete is delighted to welcome Invertebrate Biology from the American Microscopical Society to the collection for 2025. To celebrate, we invite you to explore a curated selection of recent articles showcasing invertebrate zoology research that highlights the incredible diversity and ecological significance of these organisms. This collection highlights peer-reviewed studies from BioOne Complete partners, including Bulletin of the Museum of Comparative Zoology, Integrative Systematics, Invertebrate Biology, Invertebrate Systematics, Journal of Shellfish Research, Notulae odonatologicae, Zoosystema, and more. Join our email list to get BioOne VISTA in your inbox. Recommend BioOne Complete to your librarian. Learn how libraries can subscribe, or request a quote for your institution. AMERICAN MALACOLOGICAL BULLETIN Not Blown away: Over Three-Quarters of Species in a Pacific Atoll Land Snail Assemblage Remain Five Years Post-Typhoon AMERICAN MUSEUM NOVITATES An Enigmatic Euchelicerate from the Mississippian (Serpukhovian) and Insights into Invertebrate Preservation in the Bear Gulch Limestone, Montana ANNALES ZOOLOGICI Diversity of the Sven Glacier (Spitsbergen, Petuniabukta) Tardigrades with a Potentially New Hypsibius Species (Hypsibiidae) AQUATIC ECOSYSTEM HEALTH AND MANAGEMENT The nearshore aquatic environment of eastern Lake Erie: A thirty-year perspective from a monitoring station ARACHNOLOGY Spider species and assemblages in forest plantations of various ages AUSTRALIAN JOURNAL OF ZOOLOGY Spatial mosaics of small animal communities across habitat and vegetation cover in semiarid Australia BIOS A link between macroinvertebrate functional diversity and fish parasite diversity in the New Jersey Pine Barrens BULLETIN OF THE MUSEUM OF COMPARATIVE ZOOLOGY Sheet Webs of Linyphioid Spiders (Araneae: Linyphiidae, Pimoidae): The Light of Diversity Hidden Under a Linguistic Basket CARIBBEAN JOURNAL OF SCIENCE Functional Organisation, Predator-prey Interactions, and Gut Content Analysis for Selected Groups of Benthic Macroinvertebrates in High Elevation Ponds in St. Ann Parish, Jamaica ENTOMOLOGICA AMERICANA Description of a New Amazonian Species of Polistes ( Epicnemius) (Vespidae: Polistinae: Polistini) INTEGRATIVE SYSTEMATICS Discovery of snakeworm gnats in Alaska: a new species of Sciara Meigen (Diptera: Sciaridae) based on morphological, molecular, and citizen science data INVERTEBRATE BIOLOGY Recruitment to adult habitats in terrestrial hermit crabs on the coast of Ishigakijima Island, Ryukyu Archipelago, Japan INVERTEBRATE SYSTEMATICS Resolving the taxonomy of the Antarctic feather star species complex Promachocrinus ‘kerguelensis’ (Echinodermata: Crinoidea) THE JOURNAL OF ARACHNOLOGY First report of arm-span competition in buthid scorpions: male-male contest in Tityus cf. rosenbergi Pocock, 1898 JOURNAL OF ECONOMIC ENTOMOLOGY Acute toxicity effects of pesticides on predatory snout mites (Trombidiformes: Bdellidae) JOURNAL OF ENTOMOLOGICAL SCIENCE A Test of Immune Priming in the Kissing Bug Rhodnius pallescens (Hemiptera: Reduviidae) against the Entomopathogenic Fungus Beauveria bassiana (Hypocreales: Cordycipitaceae) in Panama JOURNAL OF MEDICAL ENTOMOLOGY Ground-dwelling invertebrates from an Urban park in the Brazilian Amazon, with particular reference to Phlebotominae (Diptera: Psychodidae) JOURNAL OF SHELLFISH RESEARCH Multi-Spatial and Temporal Assessments of Impacts and Recovery of Epibenthic Species and Habitats Under Mussel Farms in the Marlborough Sounds, New Zealand JOURNAL OF WILDLIFE DISEASES Detection and Differentiation of Entomopathogenic Serratia spp. To Inform Reintroduction of the Critically Endangered Lord Howe Island Stick Insect Dryococelus australis JOURNAL OF ZOO AND WILDLIFE MEDICINE Serial Health Assessment With Standardized External Scoring and Hemolymph Evaluation in the American Horseshoe Crab ( Limulus polyphemus) MONOGRAPHS OF THE WESTERN NORTH AMERICAN NATURALIST Gaufinia, a New Stonefly Genus (Plecoptera: Chloroperlidae), with the Description of Six New Species from Western North America NORTHWEST SCIENCE Range Extension of the Non-native Northern Crayfish Faxonius virilis (Hagen, 1870) (Decapoda: Cambaridae) to British Columbia, Canada NOTULAE ODONATOLOGICAE Emergence and composition of the odonate communities in an urban river in north-western Spain ZOOLOGICAL SCIENCE Physiology of Overwintering in a Microhabitat Fully Exposed to Adverse Weather Conditions: Lime Seed Bugs on Tree Trunks and Branches ZOOSYSTEMA The identity of the iconic Japanese ‘Heike-gani’, Heikeopsis japonica (von Siebold, 1824) (Crustacea, Decapoda, Brachyura, Dorippidae) View the Previous Collection Explore the BioOne Complete Article Collection Archive Looking for more? If you're interested in more research like this, check out these titles from the CSIRO Publishing BioSelect Collection and ESA eBook Collection from BioOne eBooks. • The Biology of Squat Lobsters• Controlling Invertebrate Pests in Agriculture• Bees and Crop Pollination: Crisis, Crossroads, Conservation• Studies on Hemipteran Phylogeny Explore related topics like our agricultural entomology and entomology collections. Browse Entomology Research Coming in February 2025: Urban and Backyard Birds. Sign up to get this collection sent to your email. Join Our Email List Get notified when new issues or content matching your search criteria is published. Get Content Alerts"
