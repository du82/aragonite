title = "About the BioOne Digital Library"
description = "Access life sciences research on the BioOne Digital Library, including our flagship aggregation BioOne Complete, the BioOne Complete Archive, and the BioOne Digital Library."
full_description = "About the BioOne Digital Library The BioOne Digital Library is a community-based platform that provides global distribution for more than 580 journals and eBooks in the biological, ecological, and environmental sciences. The BioOne Digital Library provides access to all of BioOne’s offerings, including our flagship aggregation BioOne Complete, the BioOne Complete Archive, and the ESA eBook Collection and CSIRO Publishing BioSelect Collection from BioOne eBooks. BioOne Complete Annual Subscription BioOne Complete is a curated collection of over 200 independently published subscribed and open access titles in the biological, ecological, and environmental sciences. Learn more about BioOne Complete. Contact Us Request your quote and add BioOne Complete, the BioOne Complete Archive, or BioOne eBooks to your library. Email: sales@bioone.orgPhone: +1 202-296-1605 Find your account manager BioOne Complete Archive Spanning more than 20 years of biological, environmental, and ecological research, the BioOne Complete Archive secures perpetual platform access to content from more than 150 independent society publishers representing specialized scientific communities. This access option allows libraries to utilize one-time funds to provide continued access to BioOne Complete. Learn more on the BioOne Complete Archive page. BioOne eBooks ESA eBook Collection BioOne is excited to extend our partnership with the Entomological Society of America (ESA) to deliver a collection of 163 newly-digitized eBooks serving the educational, professional, and scientific needs of entomologists, zoologists, and researchers in related disciplines. The ESA eBook Collection is available to libraries for a one-time purchase, request your quote. More information and a title list are also available on the ESA eBook Collection page. CSIRO Publishing BioSelect Collection In partnership with CSIRO Publishing, this collection of over 200 eBooks is an invaluable resource for environmental, plant and animal scientists, and researchers, practitioners, and students in related disciplines. The CSIRO Publishing BioSelect Collection is available to libraries for a one-time purchase, and is distributed on the trusted BioOne Digital Library. Contact sales@bioone.org or request your quote to secure the CSIRO Publishing BioSelect Collection for your patrons. More information and a title list are also available on the CSIRO Publishing BioSelect Collection page. About BioOne BioOne is an innovative nonprofit collaborative and the leading content aggregator in the biological, ecological, and environmental sciences. More than 150 global scientific societies and nonprofit publishing organizations include their journals in BioOne’s flagship product, BioOne Complete, for the benefit of 3,500 accessing institutions and millions of researchers worldwide. Since 2001, BioOne has returned more than $73 million in royalty sharing back to its participants, with a commitment to share research more broadly, equitably, and sustainably."
