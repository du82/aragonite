full_description = "Browse BioOne Complete Access leading research from 200+ full text journals in the biological, ecological, and environmental sciences. Titles Publishers Subjects A B C E F G H I J L M N O P R S T U W Z Madroño Publisher: California Botanical Society Madroño publishes work on the natural history of Western American botanical organisms and vegetation, including those of Mexico, Central America, and South America. Articles are published in English and Spanish. Current Issue | All Issues Malacologia Publisher: Institute of Malacology Malacologia publishes original research on the Mollusca and includes topics such as systematics, ecology, biogeography, parasitology, genetics, evolution, biodiversity modeling, and physiology. Current Issue | All Issues Mammal Study Publisher: Mammal Society of Japan Mammal Study, published by the Mammal Society of Japan, contains original articles, rapid communications, and reviews on basic and applied biology of mammals, and is particularly interested in the study of the mammals of Asia. Current Issue | All Issues | Issues In Progress Mammalian Species Publisher: American Society of Mammalogists Mammalian Species publishes 15-35 individual species accounts each year. Each account summarizes the current understanding of the biology of an individual species including systematics, distribution, fossil history, and genetics. Current Issue | All Issues Marine and Coastal Fisheries: Dynamics, Management, and Ecosystem Science Publisher: American Fisheries Society Marine and Coastal Fisheries is focused on the interdisciplinary issues that impact fisheries science. The journal promotes the ecologically sound management of marine, coastal, and estuarine fisheries. Marine and Coastal Fisheries is available in BioOne Complete through the 2016 volume. Current Issue | All Issues Marine Resource Economics Publisher: MRE Foundation, Inc. Marine Resource Economics publishes creative and scholarly economic analyses of a range of issues related to natural resource use in the global marine environment, such as policy, fisheries, and pollution. Marine Resource Economics is available in BioOne Complete through the 2017 volume. Current Issue | All Issues Micropaleontology Publisher: Micropaleontology Press Micropaleontology, established in 1955, publishes scientific research on the systematics, morphology, biology and ecology of animal, plant, and protist microfossils and their living representatives. Micropaleontology is available in BioOne Complete through the 2005 volume. Current Issue | All Issues Monographs of the Western North American Naturalist Publisher: Monte L. Bean Life Science Museum, Brigham Young University Monographs of the Western North American Naturalist publishes work on the biological natural history of western North America. Typically these articles are longer than those in the associated journal, Western North American Naturalist. Current Issue | All Issues Mountain Research and Development Publisher: International Mountain Society Mountain Research and Development (MRD) is devoted to interdisciplinary research on key topics related to mountains, mountain people and communities, and sustainable development in mountains. Find out more on the journal’s website. Current Issue | All Issues | Issues In Progress"
