title = "Urban & Backyard Birds"
description = "A comprehensive collection of scientific research on urban ornithology. Discover studies on backyard birds, bird behavior, ecology, conservation, and the impact of urban environments on avian species. Stay informed with the latest insights into city-dwelling birds and their habitats."
full_description = "Urban & Backyard Birds BioOne Vista | February 2025 Free To Read Through March 14, 2025* Birds reflect environmental health and urban ornithology reveals how they adapt to human-shaped spaces. Inspired by the Great Backyard Bird Count, this collection highlights key research on backyard birds and urban avian ecology, empowering scientists and bird enthusiasts to observe and protect bird populations. This collection highlights peer-reviewed studies from BioOne Complete partners, including Acta Ornithologica, Ardeola, Bulletin of the British Ornithologists' Club, Northeastern Naturalist, Ornithological Applications, Ornithology, and more. *Explore all articles in this collection for free until March 14, 2025, thanks to BioOne Complete’s participating publishers. Unlock this collection by logging in to your free BioOne Digital Library account. New to our platform? Create a free account. Join our email list to get BioOne VISTA in your inbox. Recommend BioOne Complete to your librarian. Learn how libraries can subscribe, or request a quote for your institution. ACTA ORNITHOLOGICA Tawny Owl Strix aluco Distribution in the Urban Landscape: The Effect of Habitat, Noise and Light Pollution THE AMERICAN BIOLOGY TEACHER Live Bird Webcams Engage College Introductory Biostatistics Students ARDEA The Annual Cycle, Breeding Biology and Feeding Ecology of the Lesser Black-Backed Gull Larus fuscus ARDEOLA Effects of Video Mapping Events on Avian Biodiversity in an Urban Botanical Garden AVIAN DISEASES Susceptibility and Pathogenesis of Eurasian Tree Sparrows Experimentally Inoculated with Velogenic Newcastle Disease Virus BULLETIN OF THE BRITISH ORNITHOLOGISTS’ CLUB On the taxonomic status of Burmese Collared Dove Streptopelia ( decaocto) xanthocycla ECOSCIENCE Interactions between Hooded Crows ( Corvus cornix) and Eurasian Magpies ( Pica pica) and Their Nesting Site Preferences in Anthropogenic Landscapes JOURNAL OF AVIAN MEDICINE AND SURGERY Evaluation of Thermal Antinociceptive Effects of Intramuscular Hydromorphone Hydrochloride in Great Horned Owls ( Bubo virginianus) THE JOURNAL OF PARASITOLOGY Diplotriaena obtusa (Nematoda: Diplotriaenidae) from Barn Swallows ( Hirundo rustica) and Cliff Swallows ( Petrochelidon pyrrhonota) Collected During Mortality Events in the Upper Midwest, USA THE JOURNAL OF RAPTOR RESEARCH Nest Defense Behavior of Suburban and Rural Red-shouldered Hawks JOURNAL OF VERTEBRATE BIOLOGY Seasonal differences in escape behaviour in the urban hooded crow, Corvus cornix NORTHEASTERN NATURALIST The Re-Establishment of Pileated Woodpeckers in New York City Following Nearly Two Centuries of Extirpation NORTHWESTERN NATURALIST Predatory Attacks by Black-Billed Magpies ( Pica hudsonia) on Cassin’s Finch ( Haemorhous cassinii) and Other Adult Birds ORNITHOLOGICAL APPLICATIONS Hirundo rustica (Barn Swallows) and Tachycineta bicolor (Tree Swallows) select wetlands in agriculturally intensive landscapes, as revealed by GPS tracking ORNITHOLOGICAL SCIENCE Effects of Artificial and Natural Substrates on Breeding Birds in a Japanese City ORNITHOLOGY Nest cavity reuse by the cooperatively breeding Acorn Woodpecker PACIFIC SCIENCE Differences in Feeder Visitation by Invasive Rose-Ringed Parakeets ( Psittacula krameri) between Hawaiian Islands POLISH JOURNAL OF ECOLOGY Changes in the Structure of Avian Community along a Moisture Gradient in an Urbanized Tropical Riparian Forest SOUTHEASTERN NATURALIST Diet Composition of a Pair of Tyto furcata pratincola (American Barn Owl) in an Urban Park and Natural Area Fragment in South Florida THE SOUTHWESTERN NATURALIST Seven-Year Study of Foods of Mourning Doves ( Zenaida macroura) in Southeastern New Mexico WATERBIRDS Consumption of the Toxic Tadpoles of the Cane Toad by the White Ibis Eudocimus albus WESTERN NORTH AMERICAN NATURALIST Nest Success by a Female Black-Chinned Hummingbird ( Archilochus alexandri) with Male-Like Plumage WILDLIFE RESEARCH Flock size does not influence escape decisions of urban lawn-foraging birds WILSON JOURNAL OF ORNITHOLOGY, THE Habitat use by House Sparrow ( Passer domesticus) in Campo Grande, Brazil View the Previous Collection Explore the BioOne Complete Article Collection Archive Looking for more? If you're interested in more research like this, check out these titles from the CSIRO Publishing BioSelect Collection and ESA eBook Collection from BioOne eBooks. • Bird Minds: Cognition and Behavior of Australian Native Birds• Boom and Bust: Bird Stories for a Dry Country• Climate Change Adaptation Plan for Australian Birds• Stray Feathers: Reflection on the Structure, Behavior and the Evolution of Birds Explore related topics like our migratory birds and ornithology collections. Browse Ornithology Research Coming in March 2025: Marine Mammals. Sign up to get this collection sent to your email. Join Our Email List Get notified when new issues or content matching your search criteria is published. Get Content Alerts"
