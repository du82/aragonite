title = "Diversity of spider families parasitized by fungal pathogens: a global review"
description = "In this paper the findings of a global literature and social media survey of spider mycoses are presented. Our survey revealed that spider mycoses occur in the geographic belt between latitude 78°N and 52°S, and that more than 40 out of the known 135 spider families (ca. 30%) are attacked by fungal pathogens. Jumping spiders (Salticidae), cellar spiders (Pholcidae), and sheet-web spiders (Linyphiidae) are the families most frequently reported to be attacked by fungal pathogens (combined >40% of all reported cases). Ninety-two percent of the infections of spiders can be attributed to pathogens in the order Hypocreales (phylum Ascomycota), and almost exclusively the families Cordycipitaceae and Ophiocordycipitaceae. Within the Hypocreales, the asexually reproductive genus Gibellula is an historically species-rich and widespread genus of specific spider-pathogenic fungi. For ca. 70 species of spider-pathogenic fungi their hosts could be identified at least to family level. The data presented here reaffirm the findings of previous studies that spider-pathogenic fungi are most common and widespread in tropical and subtropical forested areas, with free-living cursorial hunters – dominated by Salticidae – being the most frequently infected. Cursorial hunters (especially Salticidae) and subterranean cellar spiders (Pholcidae) are the most frequently fungus-infected spiders in North America, whereas web-weavers (especially Linyphiidae and Pholcidae) are the most common spider hosts in Europe. Our survey implies that spider-pathogenic fungi are an important mortality factor for spiders which has hitherto been underestimated."
