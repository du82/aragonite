pecies, including status surveys and studies on distribution, which are a fundamental component of conservation endeavor. Primate Conservation is available in BioOne Complete through the 2015 volume. Current Issue | All Issues Proceedings of the Academy of Natural Sciences of Philadelphia Publisher: The Academy of Natural Sciences of Philadelphia Proceedings of the Academy of Natural Sciences, published since 1841, contains papers in the areas of systematics, taxonomy, evolution, biogeography, and ecology, as well as occasional historical reviews. Current Issue | All Issues | Issues In Progress Proceedings of the Biological Society of Washington Publisher: Biological Society of Washington Proceedings of the Biological Society of Washington contained papers that broadly covered systematics in the biological sciences (botany, zoology, and paleontology) and notices of Society business. Proceedings of the Biological Society of Washington is available in BioOne Complete through the 2021 volume. Current Issue | All Issues Proceedings of the Entomological Society of Washington Publisher: Entomological Society of Washington Proceedings of the Entomological Society of Washington publishes original research in entomology. Subject matter includes systematics, taxonomy, biology, behavior, ecology, morphology, and genetics. Current Issue | All Issues"
