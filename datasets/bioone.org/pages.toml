full_description = "Browse BioOne Complete Access leading research from 200+ full text journals in the biological, ecological, and environmental sciences. Titles Publishers Subjects A B C E F G H I J L M N O P R S T U W Z Cactus and Succulent Journal Publisher: Cactus and Succulent Society of America Cactus and Succulent Journal features articles about cacti and other succulent plants, including caudiciform and pachycaul succulents and xerophytes, and is meant for professionals and hobbyists alike. Current Issue | All Issues The Canadian Entomologist Publisher: Entomological Society of Canada The Canadian Entomologist, published since 1868, contains work on all facets of entomology, such as systematics and morphology, molecular and developmental biology, ecology and behavior, and biodiversity. The Canadian Entomologist is available in BioOne Complete through the 2011 volume. Current Issue | All Issues Canadian Journal of Animal Science Publisher: Canadian Science Publishing Canadian Journal of Animal Science contains new research on all aspects of animal agriculture and animal products, such as breeding and genetics, welfare and management, and cellular and molecular biology. Current Issue | All Issues Canadian Journal of Plant Science Publisher: Canadian Science Publishing Canadian Journal of Plant Science contains research on plant science relevant to the environmental regions of Canadian agriculture, including plant production/management, horticulture, and pest management. Current Issue | All Issues Canadian Journal of Soil Science Publisher: Canadian Science Publishing Canadian Journal of Soil Science contains research on the use, management, structure and development of soils, and publishes content from the varied disciplines of soil science, from geology to agrometerology. Current Issue | All Issues Candollea Publisher: The Conservatory and Botanical Garden of the City of Geneva (CJBG) Candollea, published by the Conservatory and Botanical Garden of the City of Geneva, publishes original scientific papers on the evolution, molecular systematics, morphology-anatomy, nomenclature, taxonomy, or vegetation analyses of plants. Current Issue | All Issues | Issues In Progress Caribbean Journal of Science Publisher: University of Puerto Rico at Mayagüez Caribbean Journal of Science is dedicated to publishing research specific to the Caribbean region. The journal focuses on botany, zoology, ecology, conservation biology/management, geology, archaeology, and paleontology. Current Issue | All Issues | Issues In Progress Castanea Publisher: Southern Appalachian Botanical Society Castanea began publication in 1936, and publishes work relating to all aspects of botany in the eastern United States. The journal includes scientific papers dealing with basic research in any field of plant biology. Current Issue | All Issues Cell Stress & Chaperones Publisher: Cell Stress Society International Cell Stress & Chaperones publishes multidisciplinary work in the cellular stress response field, containing basic and applied research on cellular stress responses of animals, micro-organisms and plants. Cell Stress & Chaperones is available in BioOne Complete through the 2007 volume. Current Issue | All Issues Chelonian Conservation and Biology Publisher: Chelonian Research Foundation and Turtle Conservancy Chelonian Conservation and Biology publishes research regarding the conservation and biology of all chelonians, including freshwater turtles, marine turtles, and tortoises. Current Issue | All Issues The Coleopterists Bulletin Publisher: The Coleopterists Society The Coleopterists Bulletin was founded in 1947, and publishes a wide variety of articles, notes, and book reviews regarding the biology, taxonomy and ecology of beetles (Coleoptera). Current Issue | All Issues Comparative Parasitology Publisher: The Helminthological Society of Washington Comparative Parasitology publishes comparative research on parasitic fauna, emphasizing taxonomy, systematics, ecology, biogeography, evolution, faunal survey, and biological inventory within a morphological and/or molecular context. Current Issue | All Issues | Issues In Progress Crop and Pasture Science Publisher: CSIRO Publishing Crop and Pasture Science publishes strategic and innovative research in crop and pasture sciences and the sustainability of farming systems. Its primary focus is broad-scale cereals, grain legumes, oilseeds, and pastures. Current Issue | All Issues Cryptogamie, Algologie Publisher: Muséum national d'Histoire naturelle, Paris Cryptogamie, Algologie, published since 1924, is devoted to cryptogams. The journal publishes original papers and review articles on the systematics, biology, and ecology of algae. Current Issue | All Issues Cryptogamie, Bryologie Publisher: Muséum national d'Histoire naturelle, Paris Cryptogamie, Bryologie, published since 1874, is devoted to cryptogams. The journal publishes original papers and review articles on the systematics, biology, and ecology of bryophytes. Current Issue | All Issues Cryptogamie, Mycologie Publisher: Muséum national d'Histoire naturelle, Paris Cryptogamie, Mycologie, published since 1936, is devoted to cryptogams. The journal publishes original papers and review articles on the systematics, biology, and ecology of fungi and lichens. Current Issue | All Issues Current Herpetology Publisher: The Herpetological Society of Japan Current Herpetology, published by the Herpetological Society of Japan, contains original research articles, short notes, and reviews on the biology and diversity of amphibians and reptiles, and includes work from any and all regions. Current Issue | All Issues"
