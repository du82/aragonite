; $("#loginPaperToSave").val(doi); $("#loginPaperToSaveType").val(type); $("#LoginComment").text('You must be logged in to use My Library.'); return ShowLoginDialog(); } function ArticleContentVisibleToggle(obj, divID) { var div = document.getElementById(divID); if (div.style.display == 'none') { div.style.display = 'block'; obj.innerText = 'Load Less -'; } else { div.style.display = 'none'; obj.innerText = 'Load More +'; } return false; } function ExcerptVisibleToggle(className, divID) { var div = document.getElementById(divID); var obj = $("." + className); if (div !== null) { if (div.style.display == 'none') { div.style.display = 'block'; //obj.text('Hide Excerpt -'); $('#aToggleText').text('Hide Excerpt'); $('#aToggleSign').text('-'); } else { div.style.display = 'none'; //obj.text('View Excerpt +'); $('#aToggleText').text('View Excerpt'); $('#aToggleSign').text('+'); } } return false; } SPIEMathjaxTypeset() Abstract We evaluated changes in communities of nesting raptors and Common Ravens (Corvus corax) in the upper Columbia Basin of the Pacific Northwest, USA, at wind power projects 1–18 yr post-construction. Relative abundance of nests for anthropogenically sensitive species, including Golden Eagles (Aquila chrysaetos), Ferruginous Hawks (Buteo regalis), and Prairie Falcons (Falco mexicanus), declined on project sites (n = 18), whereas Common Ravens increased on project sites and reference sites (n = 4). We used a Bayesian approach to understand community shifts as driving declines and to determine the effect of wind power vs. other factors on species composition. Golden Eagles, Ferruginous Hawks, and Prairie Falcons each experienced twofold decreases in their proportions in the raptor communities on wind project sites compared to reference sites. Declines on reference sites were consistent with decreasing populations of these species on the larger landscape due to multiple environmental factors. Case histories of territory occupancy for Ferruginous Hawks and Golden Eagles documented over multiple years during the study showed that adult turbine-strike mortality and repeated mortality of replacement adults created localized population sinks. We believe compositional shifts in the nesting guild were also facilitated by increases in competing and/or predatory species more adapted to nesting in altered habitats, principally Common Ravens and Great Horned Owls (Bubo virginianus). Commitment to long-term monitoring and establishment of control sites would improve our understanding of the contribution of wind power development to population declines for nesting species that are less tolerant of anthropogenic activities and habitat alterations across landscapes.Evaluamos los cambios en las comunidades de rapaces nidificantes y en Corvus corax en la cuenca superior de Columbia, en el noroeste del Pacífico, EEUU, en proyectos de energía eólica de 1 a 18 años después de su construcción. La abundancia relativa de nidos de especies sensibles a las actividades humanas, como Aquila chrysaetos, Buteo regalis y Falco mexicanus, disminuyó en los lugares de los proyectos (n = 18), mientras que C. corax aumentó tanto en los lugares de los proyectos como en los lugares de referencia (n = 4). Utilizamos un enfoque bayesiano para entender los cambios en la comunidad como causantes de las disminuciones y para determinar el efecto de la energía eólica en comparación con otros factores en la composición de especies. Los individuos de A. chrysaetos, B. regalis y F. mexicanus experimentaron una disminución dos veces mayor en sus proporciones en las comunidades de rapaces en los lugares de proyectos eólicos en comparación con los lugares de referencia. Las disminuciones en los lugares de referencia fueron consistentes con la disminución de las poblaciones de estas especies en el paisaje más amplio debido a múltiples factores ambientales. Los historiales de ocupación de los territorios de B. regalis y A. chrysaetos, documentados a lo largo de varios años durante el estudio, mostraron que la mortalidad de adultos por colisiones con turbinas y la mortalidad repetida de adultos de reemplazo crearon sumideros poblacionales localizados. Creemos que los cambios en la composición del gremio de nidificación también fueron facilitados por el aumento de especies competidoras y/o depredadoras más adaptadas a anidar en hábitats alterados, principalmente C. corax y Bubo virginianus. El compromiso con el seguimiento a largo plazo y el establecimiento de lugares de control mejoraría nuestra comprensión de la contribución del desarrollo de energía eólica a la disminución de las poblaciones de especies nidificantes que son menos tolerantes a las actividades antropogénicas y a las alteraciones del hábitat en los paisajes.[Traducción del equipo editorial] INTRODUCTIONUnderstanding the impacts of wind energy projects on raptor populations is a topic of global concern (De Lucas and Perrow 2017, Bullock et al. 2024). Raptor research in the context of wind energy impacts has largely emphasized estimating fatalities from turbine strikes (Huso et al. 2016, Hallingstad et al. 2023), improving turbine siting (Smallwood et al. 2017), and identifying tools to reduce collisions (May et al. 2020, McClure et al. 2022). More recently, there has been a recognized need to better understand cumulative and population-scale effects (May et al. 2019, Diffendorfer et al. 2021). An overarching requirement to better understand and remedy all impacts is to improve monitoring methods (Smallwood 2017).The standard method used to monitor impacts of wind power projects on raptors is to estimate potential mortality of each species using pre-construction surveys and evaluate actual mortality from post-construction surveys conducted a minimum of 1 yr after project completion (US Fish and Wildlife Service 2012). Turbine fatalities are assessed at a confined spatial scale in proximity to turbines (e.g., within 200 m). Fatality thresholds derived during pre-construction are presumed to be appropriate throughout the life of the project (e.g., 30 yr). Mitigation methods are identified and implemented, and if predicted mortality thresholds are exceeded, additional mitigation measures are triggered to reduce mortality or compensate for it.Although fatality monitoring and subsequent mitigation are vital to address impacts on raptors, this standard approach may have limitations. First, mortalities are rarely differentiated by breeding and migratory status (e.g., local breeders, local non-breeders, or migrants) unless individuals have been previously marked or telemetered (Hunt et al. 2017). Feather isotope analysis has also been used to determine migratory status of raptors killed in turbine strikes (Katzner et al. 2016, Vander Zanden et al. 2024). This characterization is important if a disproportionate number of local breeding adults are among wind turbine fatalities because resulting mitigation measures may be best directed to maintain the regional nesting population rather than applied to the broader ecoregion. Also, when fatalities can be linked to breeding raptors that have been tracked through marking or telemetry, the mortality data may illuminate the impacts of turbine strikes on local territory occupancy (Hunt et al. 2017, Watson et al. 2018).A second limitation of fatality monitoring is that it does not address indirect displacement of raptors from project sites. Displacement is difficult to predict before projects are developed and may take several years to assess. For nesting pairs, displacement may occur outright when projects are constructed (i.e., macro- or meso-avoidance; e.g., Walker et al. 2005), or may be manifested over several years depending on the strength of a pair's fidelity to their home range and the attractiveness of the location to new recruits (Farfán et al. 2017, Watson et al. 2018, Crouch et al. 2019). Displacement may result from disturbance, but causes may be unclear (Hötker 2017). Although displacement results in fewer fatal turbine collisions it may also reduce the number of nesting raptors on a project, potentially impacting declining species, and making it important to consider numbers of nests and proportions of species in raptor communities before and after projects are constructed.Understanding the effects of wind power on long-term changes in populations of raptors necessitates evaluating the degree to which other factors may affect the same populations. Broader declines (or increases) of a species in the landscape due to all sources, and the magnitude of those effects, may or may not be the same as effects attributed to wind power development. Concurrent monitoring of raptors on wind power developments and reference areas may provide this comparative information. At least four studies have evaluated changes in the number of raptors counted near turbines up to 10 yr post-construction, but none reported nesting trends at comparable reference areas (Farfán et al. 2009, Garvin et al. 2011, C'''
