uency is affected by ambient temperature, and also observed a significant increase in post-yawning activity particularly under the 30°C and 35°C conditions. Furthermore, a near 24-hour periodicity in yawning was detected under all temperature conditions. These results align with previous studies conducted on endothermic animals, suggesting the conservation of primitive functions of yawning across vertebrate species. Citation Download Citation Koki T. Kotake, Sho T. Yamaguchi, Yasutaka Mukai, Zhiwen Zhou, and Hiroaki Norimoto "Yawning and Its Temperature-Dependent Modulation in Leopard Geckos," Zoological Science 42(1), 25-30, (4 September 2024). https://doi.org/10.2108/zs230123 Received: 20 December 2023; Accepted: 4 March 2024; Published: 4 September 2024 ACCESS THE FULL ARTICLE function ShowHidePwd() { var $pwd = $(".pwd"); if ($pwd.attr('type') == 'password') { $pwd.attr('type', 'text') } else $pwd.attr('type', 'password') } PERSONAL SIGN IN Full access may be available with your subscription Email Password Forgot your password? Show Remember Email on this computer Remember Password No BioOne Digital Library account? Create an account or Access Institutional Sign In via Shibboleth or OpenAthens function postPersonalSignInForm(event,uid) { event.preventDefault(); $.ajax({ type: "POST", url: '/Account/SignIn', data: $('#PersonalSignInForm'+uid).serialize(), dataType: 'json', async: false, success: function (result) { if (result.Success) { if (result.returnURL != "") { location = result.returnURL + "&returnUrl=" + encodeURIComponent(location.href); } else { window.scrollTo(0, 0); location.reload(); } } else { $('#PersonalSignInErrors' + uid).text("Invalid Email or Password"); } }, error: function (result) { $('#PersonalSignInErrors' + uid).text("Sign in failure. Please try again."); } }); return false; } PURCHASE THIS CONTENT PURCHASE SINGLE ARTICLE Price: $10.00 ADD TO CART Includes PDF & HTML, when available JOURNAL ARTICLE 6 PAGES DOWNLOAD PAPER + SAVE TO MY LIBR