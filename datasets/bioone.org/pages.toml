["https://bioone.org/25th-anniversary-collection"]
title = "From Agriculture to Zoology:​ 25 Years of Critical Research"
description = "Top articles from BioOne publishing partners over the last 25 years."
full_description = "From Agriculture to Zoology:​ 25 Years of Critical Research BioOne is honored to disseminate the findings of scientific societies, museums, botanical gardens, and university presses which are working to help us understand the natural world. A scientist born in 1999 could now be embarking on a career in field biology, collaborating on their first paper on a changing ecosystem, cultivating more resilient crops, or discovering new intersections between human and animal health. BioOne’s community of nonprofit publishers is dedicated to informing and inspiring this generation of scientists – and the next. We invite you to explore some of their most impactful work in this special 25th anniversary collection. All articles in this collection are free to read through 2024, with thanks to BioOne Complete’s participating publishers. Log in to your free BioOne Digital Library account to unlock this collection. If you are new to our platform, we invite you to create a free account by clicking the “create an account” link in the sign in area. Join our email list to get BioOne VISTA in your inbox. Recommend BioOne Complete to your librarian. Learn how libraries can subscribe, or request a quote for your institution. 1999 ZOOLOGICAL SCIENCE Genetic Basis of the Variegated Tail Pattern in the Guppy, Poecilia reticulata 2000 THE AMERICAN BIOLOGY TEACHER Investigating Phagocytosis in Tetrahymena 2001 ICHTHYOLOGY AND HERPETOLOGY Blood-Squirting Variability in Horned Lizards ( Phrynosoma) 2002 WATERBIRDS Global Climate Change and Sea Level Rise: Potential Losses of Intertidal Habitat for Shorebirds 2003 PALEONTOLOGICAL RESEARCH The Chengjiang fauna — the oldest preserved animal community 2004 WEED SCIENCE Factors affecting seed germination, seedling emergence, and survival of texasweed ( Caperonia palustris) 2005 MOUNTAIN RESEARCH AND DEVELOPMENT Enhancing Farm Tree Diversity as a Means of Conserving Landscape-based Biodiversity 2006 HERPETOLOGICAL MONOGRAPHS Abiotic