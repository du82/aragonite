["https://bioone.org/resources-for-publishers"]
title = "Publisher Resources"
description = "Answers to frequently asked questions about publishing on BioOne Complete, the publisher administration dashboard, and more."
full_description = '''Publisher Resources <!-- #logotableview{ table-layout:fixed; overflow:scroll; } --> Active Publisher Benefits Easy issue-in-progress workflow No-cost society member access Research4Life Publisher FAQs How can I update my journal and society information on BioOne Complete? How do I promote my publication's participation in BioOne Complete? How do I access the publisher administration dashboard? How do I pull usage reports? How do I set an article Open Access? Which societies publishing in BioOne Complete participate in the Member Access program? Who are BioOne Complete's current indexing partners? Who manages my title's rights and permissions? How do I submit video content? Active Publisher Benefits Active BioOne Complete Publishers have access to discounts, programs, and services that can grow their publication's online presence as well as benefit their society. Easy Issue-In-Progess Workflow BioOne Complete offers an issue-in-progress workflow to all active publishers at no cost. This model allows your title to publish articles within an issue as they are ready, rather than only publishing the issue as a whole. To move your title to an issue-in-progess workflow or to learn more, contact us. Free Society Member Access BioOne Complete publishers can provide their society members with access to their publications through a secure Member Access link at no cost. To enroll your society in this program or to learn more, contact us. To see which societies participate in the Member Access program, click here. Research4Life As part of BioOne’s mission to support broad accessibility of your content, BioOne Complete is made available at no charge to institutions in more than 80 countries in the developing world through our partnership with Research4Life. For complete information including a list of eligible countries, please visit our Developing World Programs page. Promote your journal’s participation in Research4Life by including this copy on your webpage and sharing with your membership. It can also be adapted for social media. [JOURNAL NAME], via our inclusion in BioOne Complete, is a proud participant in the philanthropic initiatives HINARI, AGORA, OARE, ARDI, and GOALI (collectively known as Research4Life). Through these programs, BioOne Complete is available at no cost to more than 2,500 institutions in the developing world. This dissemination adds to the visibility and prestige of BioOne Complete journals including [JOURNAL], and provides students and researchers across the globe with access to critical and current scientific research. Please see BioOne's Developing World Programs page for a current list of eligible countries, and contact details for Research4Life. Research4Life marketing and training collateral is all available under Creative Commons licensing. Don't forget to tag @BioOneNews and @R4LPartnership on Twitter. If you have questions about any of these services, or have any services you'd like to see added, please contact us. Return to top Publisher FAQs Below are answers to frequently asked questions about publishing on BioOne Complete, the publisher administration dashboard, and more. How can I update my journal and society information on BioOne Complete? Each title has a dedicated page on BioOne Complete. This page contains links to the title's content, dynamic lists of Most Recently Cited Articles and Most Read Articles*, the title's Scope and details, Editorial Office information, and Author Guidelines. See the image on the left for an example of this page. Your organization also has a dedicated publisher page that can be accessed by clicking on your organization's name from the Browse By Publisher page, or by clicking on your organization's name from your journal's page on BioOne Complete. See the image on the left for an example of this page. To update your organization's logo or description, or your title's aims and scope, editorial office, or author guidelines, please contact us with the updated information. *A note on Most Read and Most Recently Cited Articles: The Most Read Articles list for each publication is automatically updated on an ongoing basis according to user downloads on the platform. Please note that this list only reflects papers that have been downloaded from the new platform. To learn how to pull full usage data for all of your articles, please consult the section titled Collecting Usage Data. The Most Recently Cited Articles list uses CrossRef cited-by data (downloaded on the 1st and 15th of each month) to automatically identify the papers that have received the most new citations over the last month. The articles that appear here are not those that have received the most citations in total, but rather the articles which have been cited most often most recently. Return to top How do I promote my publication's participation in BioOne Complete? Promoting your participation in BioOne Complete is a great way to grow your publication's visibility and drive usage (royalties). Below are a few quick tips. Leverage your social media presence Consider celebrating the release of a new article or issue by promoting it on Facebook, Twitter, or on other social media platforms. Including a direct link to this content in the post can help generate usage. Link shorteners like Bitly are particularly useful for creating a compact link that you can fit in a tweet. Your publication's most-read and most-cited articles (visible on the "FEATURED CONTENT" tab of each journal page) are great candidates for promotion on your own social media, linking out to the article in BioOne Complete. Feel free to tag us — we're always happy to like, retweet/repost. Similarly, if you have an upcoming milestone or something to celebrate, let us know — we'd be happy to share it with our community on social media. Twitter: @BioOneNews (for organizational updates) Facebook: @biooneorg LinkedIn: BioOne Make specific articles Open Access (OA) Making press-worthy articles freely available can help generate maximum attention and usage. To set an article OA, please contact us. Update your institutional subscription information Adding our logo, a link to your BioOne Complete journal page, and descriptive text about BioOne to your institution's website highlights your BioOne Complete participation. Logos Note: The BioOne Complete logo is available for download and is authorized for non-commercial reproductions. For questions on appropriate use, please consult our Terms and Conditions of Use. To help our partners to display the BioOne Complete logo consistently, we have setup a Content Delivery Network (CDN) so that the correct file is always in use. In order to ensure the most recent and up-to-date logo is being used, please do not download and alter the logo. To incorporate the BioOne Complete logo into your site, please copy and paste the HTML tags exactly as they are presented below. If you encounter any difficulties embedding the logo or have questions regarding use, please contact us. To download the BioOne organizational logo, please visit our organizational website. BioOne Complete 141px PNG <img src="https://bioone.org/Promotional%20Materials/CDNrgb_B1C-Logo-color-text141px.png" width="141" height="58" alt="BioOne Complete Logo 141px"> BioOne Complete 290px PNG <img src="https://bioone.org/Promotional%20Materials/CDNrgb_B1C-Logo-color-text290px-2.png" width="290" height="124" alt="BioOne Complete Logo 290px"> Descriptive Text Version 1BioOne Complete is the full-text database of more than 200 titles from over 150 society and independent publishers in the biological, ecological, and environmental sciences. The collection offers comprehensive coverage of fields such as zoology, plant sciences, ornithology, and entomology, with new content added daily. Visit BioOne Complete, and explore the full breadth of resources the collection offers. Version 2BioOne Complete is the full-text database of more than 200 titles from over 150 publishers in the biological, ecological, and environmental sciences. The collection offers comprehensive coverage of fields such as zoology, plant sciences, ornithology, and entomology, with new content added daily. Contact us for more information. Return to top How do I access the publisher administration dashboard? BioOne Publishers have access to the publisher administration dashboard. This dashboard allows you to view your account details, as well as pull usage reports for your publications. To access the publisher administration dashboard, log into your account. Once logged in, click the arrow next to your name. The arrow can be found on the black bar at the top of the screen. A drop down menu will appear: select Publisher Administration. The publisher administration dashboard has four tabs; the two most relevant are Account Details, which allows you to view the name and institution associated wtih this account. COUNTER Reports, which allows you to pull usage reports. Read How do I pull usage reports? for more information. If Publisher Administration is not an option and you believe it should be, or to add or remove administrative privileges to users from your institution, please contact us. Please note that you can update the logo that appears in the "Access provided by" pop-up for users accessing content through a referring URL ( Society member access) by visiting the Account Details tab in the Publisher Dashboard. This is not the logo that appears on your society's individual page or in Browse. To change that logo, please contact us. Please note that the "Access provided by" pop-up only appears for publishers who provide access to their content to members through society member access. Click Edit to upload your organization's "Access provided by" logo, and enter any message you would like your users to see when logging in. Please note the following image requirements: Size: Images of any size are acceptable, however they will be scaled to display in the popup at 75 pixels in height. For best results, we recommend using landscape orientation (wider than it is tall). Format: .jpg, .png, .gif, OR .bmp files. File Size: The image file can be a maximum of 2MB. Message Requirements Length: The message can be a maximum of 200 characters. Return to top How do I pull usage reports? Publishers can access the Article, Issue, and Title reports through the publisher administration dashboard. To access these reports, first make sure you are logged into your account. Once logged in, click on the small arrow next to your name in the black bar at the top of the screen (1). Select Publisher Administration (2) from the drop down menu. This will take you to the publisher administration dashboard. Click on the navigational tab titled COUNTER Reports. Once on this tab, scroll down to the View COUNTER Reports link. You will be directed to the SIQ COUNTER interface. Note: SIQ (Scholarly IQ) is a third-party vendor that processes BioOne Complete's usage data. Once in the SIQ interface, ensure that you are viewing the Publisher Reports by clicking on Switch Reports; the Subscriber Reports page will display by default upon logging in. Once you are in the Publisher Reports page, click on the arrow next to the Publisher Reports (1) sidebar menu item to expand the list of reports available (2). For more information on the Publisher Reports and the SIQ interface, please consult this guide (PDF). For assistance pulling these reports, contact us. Return to top How do I set an article Open Access? To set an article as Open Access (OA), please contact us with the title and DOI of the article/s you would like to make OA. There is no cost or royalty "penalty" to make individual articles OA. Return to top Which BioOne Complete societies participate in Member Access? BioOne offers society publishers the opportunity to provide their individual members with free access to their respective publications in BioOne Complete. The following societies participate in this program: American Association of Zoo Veterinarians American Bryological and Lichenological Society American Entomological Society American Malacological Society American Mosquito Control Association American Ornithological Society Association of Avian Veterinarians Beta Beta Beta Biological Society British Arachnological Society Bryological and Lichenological Association for Central Europe California Botanical Society Coleopterists Society Entomological Society of Washington Helminthological Society of Washington International Association for Bear Research and Management Kansas Entomological Society Kentucky Academy of Science Lepidopterists' Society Mammal Society of Japan National Association of Biology Teachers Natural Areas Association National Shellfisheries Association New England Botanical Club Northwest Scientific Association Ornithological Societies of North America Paleontological Society of Japan Raptor Research Foundation Society for Northwestern Vertebrate Biology Society for the Study of Amphibians and Reptiles Society of Ethnobiology Society of Southwestern Entomologists Society of Vertebrate Paleontology Southern African Wildlife Management Association Southern Appalachian Botanical Society Southwestern Association of Naturalists Torrey Botanical Society Wildlife Disease Association Zoological Society of Japan User experience: Society members do need not to create a BioOne Complete user profile or log in on the BioOne site. Instead, access for the society member is achieved through a specially configured link to BioOne that will be posted on a members-only page of the society's website. By clicking on this link, members are automatically authenticated and connected to their society's journal in BioOne Complete. Technical information: To configure Member Access, the society must work with BioOne technical staff to configure what is called "blind login" authentication. Blind login authentication brings the user from a link on a members-only page of the society's website to a custom HTML document that automatically directs the user to the appropriate journal on the BioOne Complete website and seamlessly logs them in, with no further action on their part. The custom HTML document is provided to the society by BioOne technical staff; the society simply needs to host this HTML document on the their server and configure the link to it on a members-only page of their website. Note that to configure blind login access to BioOne.org, your society must be able to upload a custom HTML document to your website's server. Who are BioOne Complete's current indexing partners? BioOne actively seeks partnerships with search providers, indexers, and library discoverability products to ensure that content* from BioOne Complete is both discoverable in and interlinked with leading academic resources. This connectivity is important to the visibility and accessibility of our publishing partners' content, and facilitates a seamless experience for researchers. Current indexing pa'''
year_published = 2025
