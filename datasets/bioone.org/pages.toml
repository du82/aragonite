full_description = "Browse BioOne Complete Access leading research from 200+ full text journals in the biological, ecological, and environmental sciences. Titles Publishers Subjects A B C E F G H I J L M N O P R S T U W Z Ichthyology & Herpetology Publisher: The American Society of Ichthyologists and Herpetologists Ichthyology & Herpetology (formerly Copeia) publishes work on the biology of fishes, amphibians, and reptiles, or work using those organisms as models for testing hypotheses of broad significance. Current Issue | All Issues | Issues In Progress In Vitro Cellular & Developmental Biology - Animal Publisher: Society for In Vitro Biology In Vitro Cellular & Developmental Biology - Animal publishes original work on research in cellular, molecular, and developmental biology that employ or are relevant to organs, tissue, tumors, and cells in vitro. In Vitro Cellular & Developmental Biology - Animal is available in BioOne Complete through the 2008 volume. Current Issue | All Issues In Vitro Cellular and Developmental Biology - Plant Publisher: Society for In Vitro Biology In Vitro Cellular & Developmental Biology - Plant publishes research and reviews on the latest developments and state-of-the-art research in plant cell and tissue culture and biotechnology from around the globe. In Vitro Cellular & Developmental Biology - Plant is available in BioOne Complete through the 2008 volume. Current Issue | All Issues Insect Systematics and Diversity Publisher: Entomological Society of America Insect Systematics and Diversity (ISD) publishes original research on systematics, evolution, and biodiversity of insects and related arthropods. The journal welcomes integrative studies incorporating comparative and developmental morphology, conservation, behavior, taxonomy, molecular phylogenetics, paleobiology, natural history, phylogeography, and articles that utilize novel technologies or data types or describe emerging methods of research. Current Issue | All Issues | Issues In Progress Integrated Environmental Assessment and Management Publisher: Society of Environmental Toxicology and Chemistry Integrated Environmental Assessment and Management publishes multidisciplinary work which fosters the application of science in environmental decision-making, in areas such as policy, regulation, and management. Integrated Environmental Assessment and Management is available in BioOne Complete through the 2009 volume. Current Issue | All Issues Integrative and Comparative Biology Publisher: The Society for Integrative and Comparative Biology Integrative and Comparative Biology integrates the varying disciplines in biology by publishing top research, reports, reviews, and symposia in integrative, comparative and organismal biology. Integrative and Comparative Biology is available in BioOne Complete through the 2005 volume. Current Issue | All Issues Integrative Systematics: Stuttgart Contributions to Natural History Publisher: Stuttgart State Museum of Natural History Integrative Systematics: Stuttgart Contributions to Natural History, which continues Stuttgarter Beiträge zur Naturkunde Serie A (Biologie), is issued by the Stuttgart State Museum of Natural History and publishes articles of general biological interest with a focus on morphological systematics. Current Issue | All Issues International Forestry Review Publisher: Commonwealth Forestry Association International Forestry Review publishes papers, comments and book reviews covering international forest science, policy, and management/conservation. This publication seeks to put an emphasis on issues of transnational significance. Current Issue | All Issues International Journal of Insect Science Publisher: SAGE Publishing International Journal of Insect Science focused on entomological research, including behavior, development, ecology, evolution, genetics, morphology, plant-insect interactions (such as pollination), physiology, reproduction, systematics, and relationships with the environment like invasion biology. It ceased publication in 2019. Current Issue | All Issues Invasive Plant Science and Management Publisher: Weed Science Society of America Invasive Plant Science and Management covers many aspects of invasive plant biology, such as ecology, management, restoration, educational activities, policy issues, and case study reports. Current Issue | All Issues Invertebrate Biology Publisher: American Microscopical Society Invertebrate Biology (IVB) invites papers on all aspects of invertebrate biology-morphology and ultrastructure; genetics, phylogenetics, and evolution; physiology and ecology; neurobiology, behavior, and biomechanics; reproduction and development; cell and molecular biology-and on all types of invertebrates: protozoan and metazoan, aquatic and terrestrial, free-living and symbiotic. Current Issue | All Issues Invertebrate Systematics Publisher: CSIRO Publishing Invertebrate Systematics publishes work on the systematics, phylogeny and biogeography of all invertebrate taxa. It also includes work on species of particular conservation, economic, medical or veterinary importance. Current Issue | All Issues"
