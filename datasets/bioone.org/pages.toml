turn false; } function ShowLoginWithSave() { var doi = $("#SaveToPaperId").val(); var type = $("#SaveToPaperType").val(); $("#loginPaperToSave").val(doi); $("#loginPaperToSaveType").val(type); $("#LoginComment").text('You must be logged in to use My Library.'); return ShowLoginDialog(); } function ArticleContentVisibleToggle(obj, divID) { var div = document.getElementById(divID); if (div.style.display == 'none') { div.style.display = 'block'; obj.innerText = 'Load Less -'; } else { div.style.display = 'none'; obj.innerText = 'Load More +'; } return false; } function ExcerptVisibleToggle(className, divID) { var div = document.getElementById(divID); var obj = $("." + className); if (div !== null) { if (div.style.display == 'none') { div.style.display = 'block'; //obj.text('Hide Excerpt -'); $('#aToggleText').text('Hide Excerpt'); $('#aToggleSign').text('-'); } else { div.style.display = 'none'; //obj.text('View Excerpt +'); $('#aToggleText').text('View Excerpt'); $('#aToggleSign').text('+'); } } return false; } SPIEMathjaxTypeset() Abstract Khakiweed is a perennial broadleaf weed that is difficult to control because of its multiple means of reproduction, vigorous growth, and deep taproot. Khakiweed reduces the performance of pasture, pecan, and turf areas by choking out desirable grass and legume species. Because information on the effectiveness of contact and residual herbicides for control in pecan and pasture areas is limited, greenhouse studies were conducted to determine the effect of application timing, mode of action, and rate on khakiweed control. Preemergence and postemergence herbicides were applied to mature khakiweed plants at 0.25X, 0.5X, 1X, or 2X the label recommended rate for general broadleaf control. Biomass was collected 3 wk after application. Plants regrew from roots in the greenhouse until a second biomass harvest was collected at 6 wk after treatment (WAT). Metsulfuron-methyl, indaziflam, or pendimethalin was applied preemergence to the soil surface. All rates of preemergence herbicides provided high-efficacy control of regrowth (>85%) compared to the nontreated control. The efficacies of postemergence-applied metsulfuron-methyl, metsulfuron-methyl + nicosulfuron, indaziflam, aminopyralid + florpyrauxifen-benzyl, 2,4-D amine, and 2,4-D amine + florpyrauxifen-benzyl were also examined. All postemergence herbicide treatments exhibited control compared to the nontreated plants at both sample timings (3 and 6 WAT) and increased with herbicide application rate. No herbicide provided high-efficacy control during the initial postspray period (0 to 3 WAT). During the regrowth period (3 to 6 WAT), metsulfuron-methyl alone and in combination gave >85% control of khakiweed biomass, indicating that the sulfonylurea herbicides used in this study are well suited to controlling khakiweed.Nomenclature: Aminopyralid; florpyrauxifen-benzyl; indaziflam; metsulfuron-methyl; nicosulfuron; pendimethalin; 2,4-D; khakiweed, Alternanthera pungens Kunth; pecan, Carya illinoinensis (Wangenh.) K. Koch Citation Download Citation Annabelle E. McEachin, Timothy L. Grey, Nicholas T. Basinger, and Lisa L. Baxter "Khakiweed (Alternanthera pungens) control with contact and residual herbicides," Weed Technology 38(1), 1-6, (4 November 2024). https://doi.org/10.1017/wet.2024.67 Received: 31 May 2024; Accepted: 26 August 2024; Published: 4 November 2024 SIGN IN TO VIEW ARTICLE Email Password Forgot your password? Show Remember Email on this computer Remember Password Please wait... No BioOne Digital Library account? Create an account or Access Institutional Sign In via Shibboleth or OpenAthens function ShowHidePwdSignIn() { var $pwd = $(".pwdSignIn"); if ($pwd.attr('type') == 'password') { $pwd.attr('type', 'text') } else $pwd.attr('type', 'password') } function ShowForgotPasswordDialog() { $('.ui-dialog-content').dialog('close'); $("#divPopupForgotPassword").dialog( { width: 360, height: 375, modal: true, resizable: false, draggable: false, c