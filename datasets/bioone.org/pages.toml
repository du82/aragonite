full_description = '''Acta Chiropterologica Publisher: Museum and Institute of Zoology, Polish Academy of Sciences Acta Chiropterologica, published by the Museum and Institute of Zoology at the Polish Academy of Sciences, is devoted solely to the study and discussion of bats. Current Issue All Issues Featured Content Scope & Details Editorial Office Author Guidelines Below are lists of this title's Most Read and Most Recently Cited articles. The Most Read articles are the articles which have been downloaded the most on the new platform. The Most Recently Cited articles list uses Crossref cited-by data (downloaded on the 1st and 15th of each month) to automatically identify papers which have received the most new citations over the last month. The articles that appear here are not those which have received the most citations in total, but rather the articles which have been cited most often most recently. Most Read Articles Uncovering the Diversity of Bats in the Mbam Minkom Massif, Cameroon: Insights into the Importance of Tropical Inselbergs Amanda L. Grunwald, et al. (2025) Seed Dispersal Networks in Neotropical Forest Areas of the Amazon, Cerrado, and Associated Ecotone: Abundance as the Driver of Bat Roles Francimeire F. Ferreira, et al. (2024) Clutter Rejection and Echolocation Adaptations in Urban-Dwelling Molossid Bats Claysson de Aguiar Silva, et al. (2025) Foraging Strategies of Common Vampire Bat (Desmodus rotundus) on Native Wild Prey: Insights from Camera Trap Observations Luis A. de Morais, et al. (2025) Composition of Filamentous Fungi Associated with Bats (Mammalia: Chiroptera) with Varied Feeding Habits in an Atlantic Forest Remnant, Brazil Bianca G. Furtado, et al. (2025) $("#ShowMore").click(function () { $(".hideExtraJournalItems:lt(5)").removeClass("hideExtraJournalItems") if ($(".hideExtraJournalItems").length == 0) { $("#ShowMore").hide(); } }); Most Recently Cited Articles Bat Mortality at Wind Turbines in Northwestern Europe Jens Rydell, et a