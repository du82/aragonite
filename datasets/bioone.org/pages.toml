["https://bioone.org/journals/air-soil-and-water-research/volume-17/issue-1/11786221241291313/Determination-of-Evapotranspiration-and-Crop-Coefficient-for-Tomato-by-Using/10.1177/11786221241291313.full"]
title = "Determination of Evapotranspiration and Crop Coefficient for Tomato by Using Non-Weighing Lysimeter in Semiarid Region"
description = "Providing an accurate amount of water to crops based on their requirements is the primary objective of irrigated agriculture. The crop evapotranspiration and coefficient of tomato were measured using non-weighing lysimeters. The trial was conducted at the Melkassa Agricultural Research Center’s experimental farmland in Ethiopia. The soil water balance approach was applied to compute tomato crop evapotranspiration, whereas the reference evapotranspiration was computed using the Penman-Monteith method. The crop coefficient was calculated using the ratio between the measured crop evapotranspiration and the reference evapotranspiration. A total of 590.4 and 413.3 mm of tomato seasonal evapotranspiration was recorded in the experimental years 2022 and 2023, respectively. The mean crop evapotranspiration for tomatoes over the two experimental years was 501.83 mm. The mean locally produced crop coefficient values were 0.63 for the initial, 1.18 during the mid, and 0.94 at the end of the season. The FAO-adjusted Kc values were 1.12 during the mid and 0.86 at the end of the season. The FAO-adjusted crop coefficient values differed from the crop coefficient values developed. Hence, to ensure efficient irrigation scheduling and planning, measuring the crop evapotranspiration and coefficient for optimal crop production under specific climatic conditions is vital."
full_description = '''How to translate text using browser tools 6 November 2024 Determination of Evapotranspiration and Crop Coefficient for Tomato by Using Non-Weighing Lysimeter in Semiarid Region Tatek Wondimu Negash, Abera Tesfaye Tefera, Gebeyehu Ashemi Bikila, Ketema Tezera Bizuneh, Tigist Worku Awulachew, Aynalem Gurms Dinku Author Affiliations + Tatek Wondimu Negashhttps://orcid.org/0000-0003-4089-2085,1,* Abera Tesfaye Teferahttps://orcid.org/0000-0002-3051-6767,1 Gebeyehu Ashemi Bikilahttps://orcid.org/0000-0003-1610-6400,1 Ketema Tezera Bizunehhttps://orcid.org/0000-0003-0393-9614,1 Tigist Worku Awulachew,1 Aynalem Gurms Dinku1 1Ethiopian Institute of Agricultural Research (EIAR), Melkassa Agricultural Research Center (MARC), Adama, Ethiopia *CORRESPONDING AUTHOR: Tatek Wondimu Negash, Ethiopian Institute of Agricultural Research (EIAR), Melkassa Agricultural Research Center (MARC), P.O. Box 436, Adama, Ethiopia. Email: tatek.wondimu456@gmail.com Air, Soil and Water Research, 17(1): (2024). https://doi.org/10.1177/11786221241291313 ARTICLE Introduction Material and Methods Study site The experimental setup Experimental procedures Crop agronomic practice Irrigation application and soil moisture monitoring Crop evapotranspiration (ETc) and reference evapotranspiration (ETo) Crop coefficient (Kc) Adjustment of FAO crop coefficient using local climate Results Crop evapotranspiration and reference evapotranspiration Locally measured and FAO adjusted tomato crop coefficient (Kc) Discussions Conclusions FIGURES & TABLES REFERENCES CITED BY DOWNLOAD PAPER SAVE TO MY LIBRARY function ShowHidePwd() { var $pwd = $(".pwd"); if ($pwd.attr('type') == 'password') { $pwd.attr('type', 'text') } else $pwd.attr('type', 'password') } PERSONAL SIGN IN Full access may be available with your subscription Email Password Forgot your password? Show Remember Email on this computer Remember Password No BioOne Digital Library account? Create an account or Access Institutional Sign In