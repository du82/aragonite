ment").text('You must be logged in to use My Library.'); return ShowLoginDialog(); } function ArticleContentVisibleToggle(obj, divID) { var div = document.getElementById(divID); if (div.style.display == 'none') { div.style.display = 'block'; obj.innerText = 'Load Less -'; } else { div.style.display = 'none'; obj.innerText = 'Load More +'; } return false; } function ExcerptVisibleToggle(className, divID) { var div = document.getElementById(divID); var obj = $("." + className); if (div !== null) { if (div.style.display == 'none') { div.style.display = 'block'; //obj.text('Hide Excerpt -'); $('#aToggleText').text('Hide Excerpt'); $('#aToggleSign').text('-'); } else { div.style.display = 'none'; //obj.text('View Excerpt +'); $('#aToggleText').text('View Excerpt'); $('#aToggleSign').text('+'); } } return false; } SPIEMathjaxTypeset() Abstract In this paper the findings of a global literature and social media survey of spider mycoses are presented. Our survey revealed that spider mycoses occur in the geographic belt between latitude 78°N and 52°S, and that more than 40 out of the known 135 spider families (ca. 30%) are attacked by fungal pathogens. Jumping spiders (Salticidae), cellar spiders (Pholcidae), and sheet-web spiders (Linyphiidae) are the families most frequently reported to be attacked by fungal pathogens (combined >40% of all reported cases). Ninety-two percent of the infections of spiders can be attributed to pathogens in the order Hypocreales (phylum Ascomycota), and almost exclusively the families Cordycipitaceae and Ophiocordycipitaceae. Within the Hypocreales, the asexually reproductive genus Gibellula is an historically species-rich and widespread genus of specific spider-pathogenic fungi. For ca. 70 species of spider-pathogenic fungi their hosts could be identified at least to family level. The data presented here reaffirm the findings of previous studies that spider-pathogenic fungi are most common and widespread in tropical and subtropical forested areas, with free-living cursorial hunters – dominated by Salticidae – being the most frequently infected. Cursorial hunters (especially Salticidae) and subterranean cellar spiders (Pholcidae) are the most frequently fungus-infected spiders in North America, whereas web-weavers (especially Linyphiidae and Pholcidae) are the most common spider hosts in Europe. Our survey implies that spider-pathogenic fungi are an important mortality factor for spiders which has hitherto been underestimated. 1. INTRODUCTIONFungal pathogens are undoubtedly an important source of mortality for a large number of arthropod groups. Insects alone are attacked by >700 species of entomopathogenic fungi (Hajek & St. Leger 1994; Consolo et al. 2003) and accordingly, these fungi have been extensively studied. By way of contrast, spider-pathogenic fungi have attracted less scientific interest. They have been almost neglected as spider enemies by arachnologists. This is evident from the fact that in most books on spider biology, fungal pathogens were not mentioned in chapters dealing with the spiders' natural enemies (see Gertsch 1979; Nentwig 1987a; Wise 1993; Dippenaar-Schoeman & Jocqué 1997; Foelix 2011; Bradley 2013).Although a larger number of papers on the taxonomy of spider-pathogenic fungi exist, most of these studies are of limited value for the arachnologist because the authors of such studies invariably referred to the spider hosts as “unknown spider”. The lack of knowledge of the identity of spider hosts can be explained (1) by the fact that almost all of these past studies on spider-pathogenic fungi were conducted by mycologists with rather limited interest or expert knowledge regarding the identification of spiders, (2) due to the lack of local experts to correctly identify the host and the difficulties of transferring materials (following Nagoya Protocol and Convention on Biological Diversity) to countries where experts reside, oftentimes encountering ‘red tape,’and (3) by the extreme difficulty in reliably identifying parasitized spiders whose identifying features are often completely overgrown by the pathogen itself (Evans 2013; Durkin et al. 2021; Kozlov 2021; Mendes-Pereira et al. 2022).Evans (2013: p. 107) stated with regards to spider-pathogenic fungi “This has been a somewhat neglected topic: typically, a no-man's land between mycologists and arachnologists”. In the current review, we aim to close the gap between mycology and arachnology – thereby pursuing a mycological-arachnological interdisciplinary approach by looking at spider-pathogenic fungi from an arachnological point of view (Fig. 1). It is hoped that this review will generate interest among arachnologists in the spider-pathogenic fungi and that it will inspire them to start exploring the still unresolved problems on this topic in the future. Aside from that, we hope that it will also benefit mycologists by broadening their horizons in terms of spider host-fungal pathogen relationships. Historically, the mycological literature has lumped all arachnids in with Insecta when dealing with invertebrate-pathogenic fungi. Where there have been distinctions, this has been between mites and ‘spiders.’ In the mycological literature ‘spiders’ has also included the harvestmen. In this review, we do not treat the mites or harvestmen and consider only the families within the order Araneae.Figure 1.Fifty-five spider families containing species parasitized by fungi (see Supplemental Table S1 (23-007_Supplemental-TableS1.pdf) for details). * Fungus infections observed exclusively under laboratory conditions. Extinct members of the families Gnaphosidae?, Mysmenidae, and Synotaxidae with fungi growing on their bodies – reported as amber inclusions (see Wunderlich 2004) – are not included here.2. METHODS2.1 Data collection.—We searched published reports on fungal pathogens in the Web of Science, Scopus, Google Search, Google Scholar, Google Books, Google Pictures, ProQuest Dissertations and Theses, as well as USDA-ARS Collection of Entomopathogenic Fungal Cultures – Catalog of Strains (Humber et al. 2014) following the same search method as Nyffeler & Gibbons (2022). Additionally, we made a library search of books and scientific journals not included in the electronic databases. Social media sites (e.g., BugGuide, What's That Bug, iNaturalist, Facebook, Twitter, Flickr, Getty Images, Reddit, Yahoo, and YouTube) were also searched for information on spider-pathogenic fungi. Our survey resulted in a total of 511 records of entomogenous fungi growing on spiders, 92% of which could be identified, while 8% remained unidentified (see Supplemental Table S1 (23-007_Supplemental-TableS1.pdf), online at https://doi.org/10.1636/JoA-S-23-007.s1). [“Entomogenous” = fungi growing on or in the bodies of arthropods, including pathogens, facultative pathogens, or fungi whose trophic status is ambiguous.] In 394 cases (roughly 77%), the spider host could be determined at least to family level, whereas in 117 cases (23%) the spider hosts remained unidentified (see Supplemental Table S1 (23-007_Supplemental-TableS1.pdf)).With regard to the cases with identified spider hosts, information on the place of discovery of the fungus-infected spider was available in 355 cases (see Supplemental Table S1 (23-007_Supplemental-TableS1.pdf)), and these data were used for the statistical comparison of the dominant fungus-infected spider families in different major geographic regions (see Fig. 7). Records referring to the Russian Federation (see Humber et al. 2014) and the arctic island of Jan Mayen (see Bristowe 1948) were listed under Europe in all cases.Figure 7.Percent composition of dominant fungus-infected spider groups in three different geographic regions: Europe (including the Russian Federation and the arctic island of Jan Mayen), North America, and Tropics/Subtropics (combined data for Africa, Asia, Central & South America, and Oceania). Pie charts generated based on Supplemental Table S1 (23-007_Supplemental-TableS1.pdf).2.2 Taxonomic comments and data sources.—We have the following comments regarding data sources and the taxonomy of fungi and spiders, respectively.2.2.1 Asexual morph/sexual morph concept in mycology: Fungi in the phyla Ascomycota and Basidiomycota usually have two different reproductive stages: an asexual stage (‘A’) and a sexual stage (‘S’) (Hodge 2003). The asexual and sexual reproductive stages of a particular fungus were historically recognized as distinct species, although they may be genetically identical. Sometimes only one of the two reproductive stages of a fungal pathogen is known. With the advent of molecular phylogenetics, the links between asexual and sexual species is now becoming clear. As a result, the last 10+ years has seen a move towards the One Fungus One Name concept (Taylor 2011; Rossman 2014; Crous et al. 2015). This is a dynamic concept that is beyond the scope of this review to fully detail.Information on the reproductive mode of the fungal '''
