rmland in Ethiopia. The soil water balance approach was applied to compute tomato crop evapotranspiration, whereas the reference evapotranspiration was computed using the Penman-Monteith method. The crop coefficient was calculated using the ratio between the measured crop evapotranspiration and the reference evapotranspiration. A total of 590.4 and 413.3 mm of tomato seasonal evapotranspiration was recorded in the experimental years 2022 and 2023, respectively. The mean crop evapotranspiration for tomatoes over the two experimental years was 501.83 mm. The mean locally produced crop coefficient values were 0.63 for the initial, 1.18 during the mid, and 0.94 at the end of the season. The FAO-adjusted Kc values were 1.12 during the mid and 0.86 at the end of the season. The FAO-adjusted crop coefficient values differed from the crop coefficient values developed. Hence, to ensure efficient irrigation scheduling and planning, measuring the crop evapotranspiration and coefficient for optimal crop production under specific climatic conditions is vital. IntroductionPrecise application of water to crops based on their needs is vital for reducing water scarcity in global agriculture (Negash et al., 2023). Globally, agriculture is a major consumer of water. It accounts for more than 80% of the available freshwater (Dingre & Gorantiwar, 2020). Nevertheless, this share continued to reduce its availability for irrigation in arid and semi-arid areas of the world. Semi-arid areas of Ethiopia cover 301,500 km2, which accounts for 27% of the total land of the country, and represents a crop production area under severe moisture stress (Engida, 2000), needs to conserve water and enhance on-farm water management. In these parts of the country, food insecurity has been reported (Intergovernmental Authority for Development [IGAD] and Food and Agricultural Organisation [FAO], 1995). This is due to the shortage of rainfall, occurrences of extreme events due to climate change, and other unknown phenomena. In this area, however, there is a low possibility of frequent irrigation water application to the crop owing to water shortages. This calls for an enhancement in water use efficiency to satisfy the water requirement of the irrigated crops. Hence, an accurate estimation of crop water requirement and coefficient is essential to develop an effective irrigation management strategy.Tomato (Solanum Lycopersicum) is an essential staple vegetable crop widely grown in the tropics and sub-tropic areas of the world and ranks second among vegetables (Reddy et al., 2023). It is produced in the form of fresh and processed food. It originated from tropical parts of Mexico to Peru (Anastacia et al., 2011; FAO, 2005). Tomato plants are sensitive to water stress (Zheng et al., 2013). In 2020, the global total fresh tomato production was 186.82 million tons (Yang et al., 2022). In Ethiopia, tomatoes are grown both under rainfed and irrigation conditions. Approximately 7,710.16 hectares of land is covered with tomatoes. With this mass of land, a total yield of 336,558.42 quintals of tomatoes was harvested (ESS, 2022). Recently, this number has increased in the country due to the expansion of irrigation agriculture practices in the state and private farms. However, the yield of these vegetable crops is affected by inadequate water supply and inappropriate irrigation scheduling. Hence, to enhance crop production, water should be applied according to the consumptive demand of the crops. Therefore, knowledge of crop evapotranspiration (ETc) is essential to improve water use efficiency, yield, and quality of irrigated crops.ETc can be measured using the soil water balance technique with the help of a lysimeter (weighing and non-weighing types) setup. A lysimeter is a device in which the major components of the hydrological water balance can be measured. A lysimeter of a non-weighing-type can measure long-term ETc on a weekly, decadal, and monthly basis, and can be used to manage and plan irrigation systems (Allen et al., 1998). Weighing-type lysimeters can measure ETc values for short periods, but their installation and maintenance costs are high (Srinivas & Tiwari, 2018). Hence, measuring the daily, seasonal, and peak evapotranspiration rate of tomatoes using non-weighing lysimeters was the first objective of this study.Moreover, ETc can be estimated by utilizing a two-step method that relates crop-specific coefficient Kc to ETo. This method is highly convenient for computing ETc and is primarily employed by technicians and irrigation professionals in real-world scenarios. Nevertheless, to facilitate irrigation planning, the crop coefficient (Kc) is necessary when utilizing the measured ETc. The crop coefficient (Kc) signifies the crop’s unique water consumption, which varies throughout the growing period attributable to physiological changes in the crop. In 1968, Jensen introduced the crop coefficient methodology for ETc estimation which was further modified by numerous scholars (Allen et al., 1998; Doorenbos & Pruitt, 1977). Kc is developed with a ratio of ETc to ETo. The authors underlined the importance of developing Kc values for each crop based on lysimeter and local climatic data. Kc based on lysimeter studies has not been developed for important crops like tomatoes in the semi-arid climate of Ethiopia, particularly in the warm cropping season. Hence, deriving the Kc values for tomatoes using daily climatic (ETo) and measured crop evapotranspiration (ETc) data for irrigation planning and management at a local level was the second objective of this study.Numerous approaches are presented to calculate reference evapotranspiration. In 1948, the original ETo equation was introduced by Penman and subsequently modified by several researchers (Allen et al., 1998; Doorenbos & Pruitt, 1977; Hargreaves & Samani, 1985; Watson & Burnett, 1995). The FAO-56 Penman-Monteith technique, after modification, stands as the only standardized approach capable of yielding satisfactory ETo outcomes across diverse climatic scenarios. Hence, driving the daily, seasonal, and peak reference evapotranspiration (ETo) using daily climatic data was the third objective of this study.Material and MethodsStudy siteThe field trial was carried out at Melkassa Agricultural Research Center, Ethiopia (8°24’N and 39°21’E) (Figure 1). The study site climate was categorized as semiarid with irregular and unequal distributions of rainfall patterns. Between 1977 and 2019, the average minimum and maximum temperatures varied from 13.86°C to 28.73°C. The area receives a mean annual rainfall of 807.35 mm during the same period. July, August, and September had the highest rainfall. From 1977 to 2019, the area’s mean annual wind speed and ETo varied between 0.3 and 3.23 m s−1 and between 3.8- and 5.42 mm day−1, respectively. The average monthly weather parameters during the experimental year are shown in Figure 2. The soil in the study area consists of clay loam soil. The soil ha'''
