title = "Volume 26 Issue 2 | Acta Chiropterologica"
description = "Acta Chiropterologica, published by the Museum and Institute of Zoology, is devoted solely to the study and discussion of bats."
full_description = '''Acta Chiropterologica VOL. 26 · NO. 2 | December 2024 IN THIS ISSUE Articles (15) Content Email Alerts notify you when new content has been published. Visit My Account to manage your email alerts. Receive bi-monthly emailed content alerts Receive immediate emailed alerts when a new issue has been published SAVE Please select when you would like to receive an alert. Please wait... Alert saved! $(document).ready(function () { $("#divPopupContentAlert form").submit(function (event) { event.preventDefault(); $("#emptyInputWarning").hide(); if ($("#ReceiveContentAlerts:checked, #ReceiveTOCAlerts:checked").length == 0) { $("#emptyInputWarning").show(); } else { $(this).find(".pleaseWaitDiv").show(); $(this).find("button[type='submit']").hide(); var postURL = $(this).attr("action"); var encodingType = $(this).attr('enctype'); if (typeof encodingType == 'undefined' || encodingType == '' || encodingType == null) { encodingType = 'application/x-www-form-urlencoded; charset=UTF-8'; } var dataToSend = encodeURI($(this).serialize()); $.ajax({ type: "POST", url: postURL, contentType: encodingType, data: dataToSend, dataType: 'json', success: function (result) { $(this).find(".pleaseWaitDiv").hide(); $(this).find("#alertSaveResult").html(result.Message); $(this).find("#alertSaveResult").show(); if (result.Success) { setTimeout(function () { $("#divPopupContentAlert").dialog("close"); }, 2000); } }.bind(this), error: function (result) { $(this).find(".pleaseWaitDiv").hide(); $(this).find("#alertSaveResult").html("There was an error saving your alert. Please try again later."); $(this).find("#alertSaveResult").show(); }.bind(this) }); } }); }); function ShowContentAlertDialog(type, journalName) { $('.ui-dialog-content').dialog('close'); $("#ContentPaperType").val(type); $("#ContentJournalName").val(journalName); $("#divPopupContentAlert").dialog( { width: 360, height: 500, modal: true, resizable: false, draggable: false, closeOnEscape: true, zIndex: 999, title: 'RECEIVE CONTENT ALERT', close: function () { $(this).find(".pleaseWaitDiv").hide(); $(this).find("#alertSaveResult").hide(); $(this).find("button[type='submit']").show(); } }); return false; } VIEW ALL ABSTRACTS + This will count as one of your downloads. You will have access to both the presentation and article (if available). DOWNLOAD NOW function ShowHidePwdSignInToken() { var $pwd = $(".pwdSignIn"); if ($pwd.attr('type') == 'password') { $pwd.attr('type', 'text') } else $pwd.attr('type', 'password') } This content is available for download via your institution's subscription. To access this item, please sign in to your personal account. Email Password Forgot your password? Show Remember Email on this computer Remember Password No BioOne Digital Library account? Create an account Articles Nuclear Introns Support the Subtribe Laephotina and Recently Proposed Genera of African Vespertilionidae Terrence C. Demos, Paul W. Webala, Ara Monadjem, Bruce D. Patterson Acta Chiropterologica 26 (2), 143-152, (12 February 2025) https://doi.org/10.3161/15081109ACC2024.26.2.001 KEYWORDS: Africa, Afrotropics, bats, phylogeny, species tree, taxonomy, Vespertilionini Read Abstract + The widespread family Vespertilionidae constitutes the largest family of bats with 533 described species. However, systematic relationships within this family remain unresolved for many clades among the pipistrelle-like bats of the tribes Vespertilionini and Pipistrellini. In this study, we focus on the recently proposed endemic African subtribe Laephotina (Vespertilionini) and African representatives of the Pipistrellini. Recent revisionary systematics utilizing mitochondrial, morphological, and morphometric data has clarified relationships and species limits in Laephotina (Laephotis, Neoromicia, Afronycteris, Pseudoromicia), correcting genus assignments and describing two new genera. However, genetic data from independent nuclear loci have been lacking to date. Using four independent nuclear introns to generate gene trees and species trees, we establish strong support for the monophyly of the four Laephotina genera and the sister relationship of Laephotis + Neoromicia. However, the relationships of Afronycteris and Pseudoromicia remain unresolved. Our results are consistent with mitochondrial, karyotypic, and bacular morphological data previously used to delimit Laephotina. We found strong support for Nycticeinops + Afropipistrellus as sister to Laephotina. Deep divergence between Nycticeinops and Afropipistrellus in nuclear introns adds to dental and bacular evidence for their recognition as separate genera. DOWNLOAD PAPER SAVE TO MY LIBRARY + Hsunycteris (Chiroptera, Phyllostomidae, Lonchophyllinae) Hidden Diversity in Brazil: New Records Encompassing New Biomes Reveal the Presence of an Unnamed Species in the Brazilian Atlantic Forest Patricia Pilatti, Thayse Benathar, Patrício A. da Rocha, Ricardo Koroiva, Ana P. Carmignotto, Camila F. Gonçalves, Mayara Guimarães Beltrão, Ricardo Moratelli, Diego Astúa Acta Chiropterologica 26 (2), 153-170, (12 February 2025) https://doi.org/10.3161/15081109ACC2024.26.2.002 KEYWORDS: cryptic diversity, molecular systematics, nectar-feeding bats, Neotropics, range extension, species complex Read Abstract + Nectar-feeding bats of the genus Hsunycteris are endemic to the Neotropical region and currently include four recognized species: Hsunycteris thomasi, H. cadenai, H. pattoni, and H. dashe. Hsunycteris thomasi is considered a common nectar-feeding bat in Amazonia, where it is widely distributed, with presumed large subpopulations in Brazil. Based on five misidentified Hsunycteris specimens previously housed in scientific collections and recently surveyed specimens, we report eight new records that represent notable range extensions and provide the first Cytb sequence of Hsunycteris for the Atlantic Forest biome. These records include the first documentation of the genus in the Atlantic Forest biome, the Cerrado-Atlantic Forest transition zone, and the fourth record for the Cerrado biome. Among these, we present the first occurrence of the genus in the Brazilian states of Pernambuco, Alagoas, and Minas Gerais, the second occurrence in Mato Grosso, and the first record for the Cerrado of Maranhão state. Further field efforts in the northeastern Atlantic Forest allowed us to obtain tissue samples for genetic analysis, leading to the identification of a new lineage within the H. thomasi species complex in the Atlantic Forest. Phylogenetic analysis based on the Cytb gene reveals that Hsunycteris forms a monophyletic group comprising six clades. Hsunycteris dashe was recovered as a sister to a clade containing H. cadenai, H. pattoni, and three distinct lineages of H. thomasi. The H. thomasi lineages were recovered as paraphyletic, with lineage I diverging first within the clade, lineage II as a sister to H. pattoni, and lineage III as a sister to H. cadenai. Genetic distances among the H. thomasi lineages range from 7.4% to 8.6%. These results show that the specimens reported here are part of a newly recovered lineage, representing a putative new species, evincing that the diversity of the genus is higher than previously thought. DOWNLOAD PAPER SAVE TO MY LIBRARY + DNA Metabarcoding Reveals Insights into Diet Partitioning and Pest Suppression by Open Space Bats in Agricultural Landscapes Supawan Srilopan, Vanessa A. Mata, Sara Bumrungsri Acta Chiropterologica 26 (2), 171-187, (12 February 2025) https://doi.org/10.3161/15081109ACC2024.26.2.003 KEYWORDS: migratory species, niche overlap, diet analysis, crops, competition Read Abstract + Open-space bats are abundant and common in agricultural landscapes, and widely recognized for their effectiveness as natural suppressors of pest insects. However, there is currently a lack of comprehensive studies on the diets and diet partitioning of these bats, particularly in terms of ingested pest prey species. Here, we explored the diet and diet partitioning of open-space foraging bats using DNA metabarcoding. We hypothesized that open-space bats residing near intensive agricultural areas would primarily feed on pest insects. Additionally, considering their shared guild and foraging habitats, we anticipated the occurrence of diet partitioning as a mechanism of reducing competition. Our results demonstrate the effectiveness of DNA metabarcoding in bat diet analysis, revealing a high diet diversity and enabling prey species identification. The outcomes exposed 1,557 OTUs and at least 36 agricultural pest species were found in the diet of these aerial insectivorous bats, including Nilaparvata lugens, Nysius graminicola, Piezodorus hybneri, Mythimna impura, Sesamia inferens, and Spodoptera frugiperda, among others. This finding underscores the crucial role of the studied bat species in pest control across a variety of crops such as sugarcane, rice, and corn, among others. We also observed evidence of diet partitioning. Mops plicatus primarily preyed on Hemiptera (Pentatomidae and Delphacidae). Taphozous theobaldi predominantly fed on Lepidoptera (Noctuidae and Erebidae). Taphozous melanopogon primarily fed on Lepidoptera (Noctuidae, Erebidae, Crambidae, Pyralidae, Geometridae). Scotophilus heathii focused on Coleoptera (Hydrophilidae and Tenebrionidae). Niche overlap was high between T. theobaldi and T. melanopogon, while T. theobaldi also moderately overlapped with M. plicatus. Mops plicatus had lower degress of overlap with T. melanopogon and S. heathii. The lowest degrees of overlap were observed between S. heathii and T. melanopogon, as well as between S. heathii and T. theobaldi. Thus, these bats exhibited niche diet partitioning at the family level. Our study highlights the occurrence of diet overlap and partitioning among open-space bats, underscoring their crucial role as effective pest suppressors in Asian agricultural regions. Their widespread presence, sizable population, and consumption of key pests, including migratory species, emphasize their significance in pest suppression. Protecting these bats is essential for suppressing pest insects and aiding farmers in protecting their crop yields across the region. DOWNLOAD PAPER SAVE TO MY LIBRARY + Composition of Filamentous Fungi Associated with Bats (Mammalia: Chiroptera) with Varied Feeding Habits in an Atlantic Forest Remnant, Brazil Bianca G. Furtado, Geovana D. Savi-Bortolotto, Elídio Angioletto, Fernando Carvalho Acta Chiropterologica 26 (2), 189-203, (12 February 2025) https://doi.org/10.3161/15081109ACC2024.26.2.004 KEYWORDS: mycobiota, filamentous fungi, Feeding habits, Brazilian biomes, ecosystem balance Read Abstract + Bats play a vital role in maintaining ecosystem balance and are carriers of a diverse range of microorganisms, including a rich mycobiota. This study aimed to analyze the composition of the genera of filamentous fungi associated with bats in an Atlantic Forest remnant in Southern Brazil. Bats with various feeding habits were captured and identified, and fungal samples were collected from their rostral region. The macro-microculture technique was used to identify the fungal genera. A total of 93 bat individuals representing four families (Phyllostomidae, Vespertilionidae, Molossidae, and Thyropteridae), 16 species, and five feeding habits (nectarivorous, small and lager frugivorous, hematophagous, carnivorous, and insectivorous) were collected. Eleven genera of filamentous fungi were associated with the bat species studied, with the most common being Penicillium (n = 23 isolates), Aspergillus (n = 16), Cladosporium (n = 5), and Acremonium (n = 4). The highest fungal richness was recorded in frugivorous bats, such as Carollia perspicillata (n = 21 isolates), Sturnira lilium (n = 21), and Artibeus fimbriatus (n = 20). The high similarity in mycobiota diversity between hematophagous and carnivorous bats, as well as between frugivorous and insectivorous bats, suggests that feeding habits of bats can influence mycobiota composition. These findings are important, as data on the mycobiota associated with bats across different feeding habits are still scarce. Furthermore, understanding the interactions between bats and mycobiota is essential, particularly in Brazilian biomes, as it sheds light on the ecological roles of bats and their associated microorganisms, a topic that remains largely underexplored. DOWNLOAD PAPER SAVE TO MY LIBRARY + Reproductive Patterns of Cave-Roosting Bat Assemblages in a Caatinga Dry Forest in Northeastern Brazil Juan Carlos Vargas-Mena, Eugenia Cordero-Schmidt, Bernal Rodríguez-Herrera, Eduardo M. Venticinque Acta Chiropterologica 26 (2), 205-217, (12 February 2025) https://doi.org/10.3161/15081109ACC2024.26.2.005 KEYWORDS: Seasonality, assemblage, trophic guild, aseasonal, cave-roosting bats, Rio Grande do Norte, estacionalidad, ensamblaje, gremio trófico, asestacional, murciélagos cavernícolas, Rio Grande do Norte Read Abstract + The Caatinga dry forest is endemic to northeastern Brazil. It presents extreme climatic conditions with semiarid characteristics and unique precipitation regimes, directly influencing plant phenology and faunal population dynamics. Bats in Caatinga exhibit behavioral responses to cope with limited resources, such as seasonality in their reproductive cycles. This is an adaptation to synchronize reproduction with food abundance peaks to meet the large energy demands of the copula, parturition, lactation, and growth of pups. Caves are an important roost for bats in the Caatinga of Rio Grande do Norte (RN) state in northeastern Brazil. Thus, we monitored nine caves in the Caatinga of RN to describe and analyze the reproduction patterns of cave-roosting bats at the assemblage, sex, species, and trophic guild level. In 60 sampling days, we recorded 16 bat species from 1915 captured individuals (946 females and 969 males). Despite the lack of statistical differences between seasons, the assemblages tended to be reproductively active in the rainy season, with more juveniles and pregnant and lactating females than in the dry season. We found patterns related to trophic guilds and sex at the species level. Females of insectivores, frugivores, and animalivores were active in the rainy season, while males were active in both seasons. Nectarivores, omnivores, and sanguinivores exhibited an aseasonal reproduction. Patterns suggest that, depending on the trophic guild and species, their reproduction occurs in moments of peak food abundance, whether that resource is seasonal or available year-round, depending on their preferred food item. Our results provide important data for the conservation strategies of cave-roosting bats in RN, including vulnerable species (e.g., Lonchorhina aurita and Furipterus horrens), and novel insights into bat reproductive patterns as an important behavioral adaptation to the harsh conditions of the Caatinga dry forest.El bosque seco de la Caatinga es endémico del noreste de Brasil. Presenta condi'''
