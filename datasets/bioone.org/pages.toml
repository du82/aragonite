full_description = "Browse the entire BioOne Digital Library Discover research from BioOne Complete and BioOne eBooks, featuring 200+ full-text journals and 360+ eBook titles from our publishing partners. Browse by Collection: All Titles Publishers Subjects A B C E F G H I J L M N O P R S T U W Z Acta Chiropterologica Publisher: Museum and Institute of Zoology, Polish Academy of Sciences Acta Chiropterologica, published by the Museum and Institute of Zoology at the Polish Academy of Sciences, is devoted solely to the study and discussion of bats. Current Issue | All Issues Acta Ornithologica Publisher: Museum and Institute of Zoology, Polish Academy of Sciences Acta Ornithologica, published by the Museum and Institute of Zoology at the Polish Academy of Sciences, has been in publication since 1933 and covers all fields of ornithology. Current Issue | All Issues | Issues In Progress Acta Palaeontologica Polonica Publisher: Institute of Paleobiology, Polish Academy of Sciences Acta Palaeontologica Polonica, founded in 1956, publishes research of general interest from all areas of paleontology, particularly biologically-oriented paleontological work. Acta Palaeontologica Polonica is available in BioOne Complete through the 2016 volume. Current Issue | All Issues Adansonia Publisher: Muséum national d'Histoire naturelle, Paris Adansonia is a fast-track journal from the French Museum of Natural History, Paris, concerning the inventory, analysis, and interpretation of vascular plant biodiversity. The journal publishes research in French and English. Current Issue | All Issues Advances in Applied Biodiversity Science Publisher: Conservation International Advances in Applied Biodiversity Science, published by Conservation International through 2007, was a monograph series that addressed topical issues in conservation science, such as bushmeat hunting, infrastructure development, and climate change. Most Recent Book | List of Books African Entomology Publisher: Entomological Society of Southern Africa African Entomology publishes original research articles and short communications on all aspects of entomology, with an emphasis on the advancement of entomology on the African continent. African Entomology is available in BioOne Complete through the 2021 volume. Current Issue | All Issues African Invertebrates Publisher: KwaZulu-Natal Museum African Invertebrates is a South African journal that covers the taxonomy, systematics, biogeography, biology, ecology, conservation and palaeontology of Afrotropical invertebrates, whether terrestrial, freshwater, or marine. African Invertebrates is available in BioOne Complete through the 2015 volume. Current Issue | All Issues African Journal of Wildlife Research Publisher: Southern African Wildlife Management Association African Journal of Wildlife Research is a multidisciplinary journal that has been published since 1971 and covers the scientific, applied, managerial, methodological, and sociological issues related to wildlife research. Current Issue | All Issues | Issues In Progress African Zoology Publisher: Zoological Society of Southern Africa African Zoology publishes original scientific contributions and critical reviews that focus principally on African fauna in terrestrial, freshwater, and marine ecosystems. Current Issue | All Issues Air, Soil and Water Research Publisher: SAGE Publishing Air, Soil and Water Research publishes research on soil, air, and water. The journal reports on properties—including physical, chemical, biochemical, and biological—analysis, microbiology, chemicals and pollution, consequences for plants and crops, soil hydrology, and other considerations. Current Issue | All Issues | Issues In Progress AMBIO: A Journal of the Human Environment Publisher: Royal Swedish Academy of Sciences Ambio, published by the Royal Swedish Academy of Sciences, includes broad, interdisciplinary research addressing the scientific, social, economic, and cultural factors that influence the condition of the human environment. Ambio is available in BioOne Complete through the 2011 volume. Current Issue | All Issues Ameghiniana Publisher: Asociación Paleontológica Argentina Ameghiniana has been in continuous publication since 1957. The journal publishes content regarding all aspects of paleontology, but is particularly focused on the paleontology of Gondwana and the southern hemisphere. Current Issue | All Issues | Issues In Progress The American Biology Teacher Publisher: National Association of Biology Teachers The American Biology Teacher is designed to support the teaching of K-16 biology and life sciences. The journal features articles related to biology as a whole, ethical issues in biology, and teaching strategies for classrooms, labs, and fieldwork. Current Issue | All Issues American Fern Journal Publisher: The American Fern Society American Fern Journal began in 1910 and has continuously published articles and notes based on original scientific research on ferns and allied groups of vascular plants for over 100 years. Current Issue | All Issues | Issues In Progress American Malacological Bulletin Publisher: American Malacological Society American Malacological Bulletin is focused exclusively on malacological research. It publishes original manuscripts, short reports, symposia, and detailed reviews dealing with molluscs. Current Issue | All Issues | Issues In Progress The American Midland Naturalist Publisher: University of Notre Dame The American Midland Naturalist was established in 1909. The journal covered a diverse set of biological disciplines (animal sciences, plant sciences, ecology) as they pertain to North America. The American Midland Naturalist ceased publication in 2023. Current Issue | All Issues American Museum Novitates Publisher: American Museum of Natural History American Museum Novitates has been continuously published by the American Museum of History since 1921. This title publishes short papers that contain descriptions of new forms and reports in zoology, paleontology, and geology. Current Issue | All Issues Annales Botanici Fennici Publisher: Finnish Zoological and Botanical Publishing Board Annales Botanici Fennici publishes research in systematics, evolution, phylogeography, taxonomy and nomenclature of plants and fungi. The journal also includes content regarding plant population biology and genetics, and plant ecology. Current Issue | All Issues | Issues In Progress Annales Zoologici Publisher: Museum and Institute of Zoology, Polish Academy of Sciences Annales Zoologici, published by the Museum and Institute of Zoology at the Polish Academy of Sciences, is devoted to all aspects of systematic entomology. Current Issue | All Issues Annales Zoologici Fennici Publisher: Finnish Zoological and Botanical Publishing Board Annales Zoologici Fennici publishes original research reports, in-depth reviews, and commentary on all aspects of animal ecology, evolution, and related fields. Current Issue | All Issues | Issues In Progress Annals of Carnegie Museum Publisher: Carnegie Museum of Natural History Annals of Carnegie Museum publishes work in organismal biology, earth sciences, and anthropology related to the Museum's collections, Powdermill Nature Reserve, or to Carnegie personnel. Current Issue | All Issues Annals of the Entomological Society of America Publisher: Entomological Society of America Annals of the Entomological Society of America contains work that integrates different areas of insect biology and addresses current, pressing issues that are likely to be of broad relevance to entomologists. Annals of the Entomological Society of America is available in BioOne Complete from 2000 through the current volume. Current Issue | All Issues Annals of the Missouri Botanical Garden Publisher: Missouri Botanical Garden Press Annals of the Missouri Botanical Garden contains papers focused primarily in systematic botany and evolutionary biology. Current Issue | All Issues | Issues In