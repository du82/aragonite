title = "Long-Term Changes in Nesting Raptor Communities after Construction of Wind Power Projects"
description = "Evaluamos los cambios en las comunidades de rapaces nidificantes y en Corvus corax en la cuenca superior de Columbia, en el noroeste del Pacífico, EEUU, en proyectos de energía eólica de 1 a 18 años después de su construcción. La abundancia relativa de nidos de especies sensibles a las actividades humanas, como Aquila chrysaetos, Buteo regalis y Falco mexicanus, disminuyó en los lugares de los proyectos (n = 18), mientras que C. corax aumentó tanto en los lugares de los proyectos como en los lugares de referencia (n = 4). Utilizamos un enfoque bayesiano para entender los cambios en la comunidad como causantes de las disminuciones y para determinar el efecto de la energía eólica en comparación con otros factores en la composición de especies. Los individuos de A. chrysaetos, B. regalis y F. mexicanus experimentaron una disminución dos veces mayor en sus proporciones en las comunidades de rapaces en los lugares de proyectos eólicos en comparación con los lugares de referencia. Las disminuciones en los lugares de referencia fueron consistentes con la disminución de las poblaciones de estas especies en el paisaje más amplio debido a múltiples factores ambientales. Los historiales de ocupación de los territorios de B. regalis y A. chrysaetos, documentados a lo largo de varios años durante el estudio, mostraron que la mortalidad de adultos por colisiones con turbinas y la mortalidad repetida de adultos de reemplazo crearon sumideros poblacionales localizados. Creemos que los cambios en la composición del gremio de nidificación también fueron facilitados por el aumento de especies competidoras y/o depredadoras más adaptadas a anidar en hábitats alterados, principalmente C. corax y Bubo virginianus. El compromiso con el seguimiento a largo plazo y el establecimiento de lugares de control mejoraría nuestra comprensión de la contribución del desarrollo de energía eólica a la disminución de las poblaciones de especies nidificantes que son menos tolerantes a las actividades antropogénicas y a las alteraciones del hábitat en los paisajes. [Traducción del equipo editorial]"
