pects of these organisms, including their behavior, genetics, and other topics. The Journal of Eukaryotic Microbiology is available in BioOne Complete through the 2004 volume. Current Issue | All Issues Journal of Feline Medicine and Surgery Open Reports Publisher: SAGE Publishing JFMS Open Reports is aimed at both practitioners and researchers with an interest in the clinical veterinary healthcare and welfare of domestic cats. It publishes case reports, short case series and short communications reporting regional prevalence data or other data related to diseases of domestic cats. Current Issue | All Issues Journal of Field Ornithology Publisher: Association of Field Ornithologists Journal of Field Ornithology publishes articles that emphasize the descriptive/experimental study of birds in their natural habitats, particularly in the Neotropics. The Journal is also interested in studies involving nonprofessional ornithologists. Journal of Field Ornithology is available in BioOne Complete through the 2005 volume. Current Issue | All Issues Journal of Great Lakes Research Publisher: International Association for Great Lakes Research Journal of Great Lakes Research publishes manuscripts on a wide range of topics in the fields of biology, chemistry, physics, and geology of the large lakes of the world and their watersheds. Journal of Great Lakes Research is available in BioOne Complete through the 2010 volume. Current Issue | All Issues Journal of Herpetological Medicine and Surgery Publisher: Association of Reptilian and Amphibian Veterinarians Journal of Herpetological Medicine and Surgery publishes information for veterinarians who practice on reptiles and amphibians, and includes topics such as natural history, maintenance in captivity, and medical/surgical problems. Current Issue | All Issues Journal of Herpetology Publisher: Society for the Study of Amphibians and Reptiles Journal of Herpetology, published since 1968, contains work on the biology of amphibians and reptiles, with emphasis on behavior, biochemistry, conservation, ecology, evolution, morphology, physiology, and systematics. Current Issue | All Issues | Issues In Progress Journal of Insect Science Publisher: Entomological Society of America The Journal of Insect Science publishes papers and contributions in all aspects of the biology of insects and other arthropods, ranging in scope and scale from the molecular to the ecological. The Journal of Insect Science is available in BioOne Complete through the 2015 volume. Current Issue | All Issues Journal of Mammalian Ova Research Publisher: Japanese Society of Mammalian Ova Research Journal of Mammalian Ova Research, published by the Japanese Society of Mammalian Ova Research, contained work on gametogenesis, fertilization, embryo development, implantation, pregnancy and genetics, as well as assisted reproductive technology. Journal of Mammalian Ova Research ceased publication in 2015. Current Issue | All Issues Journal of Mammalogy Publisher: American Society of Mammalogists Journal of Mammalogy was established in 1919 by the American Society of Mammalogists to promote interest in mammals throughout the world by the publication of original research on their ecology, genetics, conservation, behavior, and physiology. Current Issue | All Issues Journal of Medical Entomology Publisher: Entomological Society of America Journal of Medical Entomology publishes reports on medical entomology and medical acarology, including the systematics/biology of insects, acarines, and other arthropods of public health and veterinary significance. Current Issue | All Issues Journal of Orthoptera Research Publisher: Orthopterists' Society Journal of Orthoptera Research, published by the Orthopterists Society, contains work on the insect Order Orthoptera (and relatives Blattodea, Mantodea, Phasmodea, and Grylloblatodea). The journal features research on a variety of topics, include Orthoptera behavior, cytology, and ecology. Journal of Orthoptera Research is available in BioOne Complete through the 2016 volume. Current Issue | All Issues Journal of Paleontology Publisher: The Paleontological Society Journal of Paleontology publishes research on the systematics, phylogeny, paleoecology, paleogeography, and evolution of fossil organisms. It emphasizes specimen-based research and features high quality illustrations. Current Issue | All Issues Journal of Parasitology Publisher: American Society of Parasitologists The Journal of Parasitology is focused on basic or applied aspects of general, veterinary, or medical parasitology, and epidemiology. The journal covers new, original research dealing primarily with parasitic animals. Current Issue | All Issues Journal of Raptor Research Publisher: Raptor Research Foundation The Journal of Raptor Research publishes work on the biology and conservation of diurnal and nocturnal raptors, and contains articles describing their ecology, behavior, life history, conservation, and other topics. Current Issue | All Issues | Issues In Progress Journal of Resources and Ecology Publisher: Institute of Geographic Sciences and Natural Resources Research, Chinese Academy of Sciences Journal of Resources and Ecology is published by the Institute of Geographic Sciences and Natural Resources Research, Chinese Academy of Sciences. The journal publishes current research in natural resource studies and ecology across a broad range of interdisciplinary topics. Current Issue | All Issues Journal of Shellfish Research Publisher: National Shellfisheries Association Journal of Shellfish Research publishes original papers and review articles dealing with all aspects of shellfish research, including aquaculture, sustainability, biology, ecology, and management. Current Issue | All Issues Journal of the American Mosquito Control Association Publisher: The American Mosquito Control Association Journal of the American Mosquito Control Association publishes articles and brief scientific notes containing research in the areas of mosquito and vector biology, systematics, and control. Journal of the American Mosquito Control Association is available in BioOne Complete through the 2017 volume. Current Issue | All Issues Journal of the Arizona-Nevada Academy of Science Publisher: The Arizona-Nevada Academy of Science Journal of the Arizona-Nevada Academy of Science publishes papers in all fields of scientific work, but is known for its special focus on topics related to the North American southwest region. Current Issue | All Issues | Issues In Progress Journal of the Kansas Entomological Society Publisher: Central States Entomological Society Journal of the Kansas Entomological Society, published continuously since 1928, contains research articles and short communications on all aspects of the sciences of entomology, with a global scope. Current Issue | All Issues | Issues In Progress Journal of the Kentucky Academy of Science Publisher: Kentucky Academy of Science Journal of the Kentucky Academy of Science publishes original research and review papers in all areas of science supported by the Academy, such as agricultural science, anthropology, ecology, and zoology. Current Issue | All Issues The Journal of the Lepidopterists' Society Publisher: The Lepidopterists' Society Journal of the Lepidopterists’ Society has been published since 1947, and contains work on any aspect of Lepidoptera study, including systematics, natural history, behavior, physiology, and ecology. Current Issue | All Issues Journal of the North Atlantic Publisher: Eagle Hill Institute Journal of the North Atlantic publishes multi-disciplinary work on the peoples of the North Atlantic, their expansion into the region over time, and their interactions with their changing environments. Current Issue | All Issues The Journal of the Torrey Botanical Society Publisher: Torrey Botanical Society The Journal of the Torrey Botanical Society publishes basic research in all areas of plant biology, with the exception of horticulture. The journal emphasizes work on the plants of the Western Hemisphere. Current Issue | All Issues Journal of Vector Ecology Publisher: Society for Vector Ecology Journal of Vector Ecology contains work on the biology, ecology and control of arthropod vectors, and the interrelationships between the vectors and the disease agents they transmit. Current Issue | All Issues Journal of Vegetation Science Publisher: International Association of Vegetation Science Journal of Vegetation Science publishes papers on all aspects of vegetation science, with particular emphasis on papers that develop new concepts or methods, test theory, or identify general patterns. Journal of Vegetation Science is available in BioOne Complete through the 2008 volume. Current Issue | All Issues Journal of Vertebrate Biology Publisher: Institute of Vertebrate Biology, Czech Academy of Sciences The Journal of Vertebrate Biology (formerly Folia Zoologica) is published by the Institute of Vertebrate Biology, Czech Academy of Sciences. The journal publishes content containing original, significant insights into vertebrate zoology, including scientific articles, in-depth review papers and monographs. Current Issue | All Issues Journal of Vertebrate Paleontology Publisher: The Society of Vertebrate Paleontology Journal of Vertebrate Paleontology publishes original contributions on all aspects of vertebrate paleontology, including vertebrate origins, evolution, functional morphology, and other topics. Current Issue | All Issues Journal of Wildlife Diseases Publisher: Wildlife Disease Association Journal of Wildlife Diseases publishes work on infectious, parasitic, toxic, nutritional, physiologic, developmental and neoplastic diseases and other factors impacting the health of wild animals. Current Issue | All Issues Journal of Wildlife Management Publisher: The Wildlife Society Journal of Wildlife Management publishes work on basic wildlife science, including investigations into the biology/ecology of wildlife that has implications for wildlife management and conservation. Journal of Wildlife Management is available in BioOne Complete through the 2011 volume. Current Issue | All Issues Journal of Zoo and Wildlife Medicine Publisher: American Association of Zoo Veterinarians Journal of Zoo and Wildlife Medicine publishes original research findings, clinical observations, and case reports in the field of veterinary medicine dealing with captive and free-ranging wild animals. Current Issue | All Issues"
