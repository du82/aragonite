full_description = "Subscribe to BioOne Digital Library Content Discover research from BioOne Complete and BioOne eBooks, featuring 200+ full-text journals and 360+ eBook titles from our publishing partners. HOW TO SUBSCRIBE & ACCESS BIOONE COMPLETE 2025 STATS AND FACTS LIST OF SUBSCRIBERS DEVELOPING WORLD PROGRAMS High-Quality Content With a Budget-Friendly Price Tag BioOne policies and pricing are designed to sustainably deliver critical research in the biosciences to a worldwide user base. We are pleased to offer a growing array of cost-effective options to meet the needs of all institutions. View and Download our BioOne Digital Library Flyer. Contact Us Request your quote and add BioOne Complete to your library. Email: sales@bioone.orgPhone: +1 202-296-1605 Find your account manager BioOne Complete Annual Subscription This option provides access to all current and backfile content. Pricing is based on a tiered system according to FTE, and discounts are available for multi-year subscriptions. Subscriptions have flexible start dates to align with your institutional needs, and post-cancellation access is included for content published during your subscription term. View and Download our BioOne Complete Flyer. BioOne Complete Archive Secures continuing access to a wealth of subscribed backfile content published between 1996—2019. Pricing is based on the same tiered system as our annual subscriptions, and can be customized to compliment your existing holdings. Learn more on the BioOne Complete Archive page. View and Download our BioOne Complete Archive Flyer. Title lists for both BioOne Complete institutional options are available. ESA eBook Collection BioOne is excited to extend our partnership with the Entomological Society of America (ESA) to deliver a collection of 163 newly-digitized eBooks serving the educational, professional, and scientific needs of entomologists, zoologists, and researchers in related disciplines. The ESA eBook Collection is available to libraries for a one-time purchase. More information and a title list are available on the ESA eBook Collection page. View and Download our ESA eBook Collection Flyer. NEW: CSIRO Publishing BioSelect Collection In partnership with CSIRO Publishing, this collection of 204 eBooks is an invaluable resource for environmental, plant and animal scientists, and researchers, practitioners, and students in related disciplines. The CSIRO Publishing BioSelect Collection is available to libraries for a one-time purchase, and is distributed on the trusted BioOne Digital Library. More information and a title list are available on the CSIRO Publishing BioSelect Collection page. View and Download our CSIRO Publishing BioSelect Collection Flyer. Consortia Partnerships BioOne partners with more than 40 consortia around the world to efficiently license BioOne Complete, and offer consortial discounts to subscribing libraries. Please see our full list of consortia partners or contact us for a quote for your institution. Personal subscriptions to BioOne Complete are not offered, however article abstracts and references are freely available. In addition, many of our society publishers provide their members with free access to their journals via the BioOne Complete platform. The majority of BioOne Complete titles also offer articles for one-time (pay-per-view) purchase. Contact us for Renewals and Price Quotes For renewal questions, pricing information, or to request a free trial please contact sales@BioOne.org or the account manager for your region. Regional Account Managers United States & Canada Chelsea TharpAssociate Director of Sales BioOne 21 Dupont Circle, Suite 800 Washington DC 20036 USA Phone: +1 202-956-5204 chelsea@BioOne.org Asia, India, Middle East, North Africa, Latin America, Caribbean, Europe: France, Spain, Italy, Portugal ACCUCOMSRode Olifant Zuid Hollandlaan 7 2596 AL, The Hague, The Netherlands Phone: +31-88-4100-400 bioone@accucoms.com UK & Ireland, Australia, New Zealand