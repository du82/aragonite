full_description = '''Acta Ornithologica Publisher: Museum and Institute of Zoology, Polish Academy of Sciences Acta Ornithologica, published by the Museum and Institute of Zoology at the Polish Academy of Sciences, has been in publication since 1933 and covers all fields of ornithology. Current Issue All Issues Issues in Progress Acta Ornithologica Featured Content Scope & Details Editorial Office Author Guidelines Below are lists of this title's Most Read and Most Recently Cited articles. The Most Read articles are the articles which have been downloaded the most on the new platform. The Most Recently Cited articles list uses Crossref cited-by data (downloaded on the 1st and 15th of each month) to automatically identify papers which have received the most new citations over the last month. The articles that appear here are not those which have received the most citations in total, but rather the articles which have been cited most often most recently. Most Read Articles Brood Reduction and Parental Infanticide — are the White Stork Ciconia ciconia and the Black Stork C. nigra exceptional? Piotr Zieliński. (2002) Traffic Influence on Roadside Bird Abundance and Behaviour Magne Husby. (2017) Dispersal Distance and Burial Mode of Acorns in Eurasian Jays Garrulus glandarius in European Temperate Forests Przemysław Kurek, et al. (2019) Diet of Montagu's Harriers Circus pygargus Wintering in India: Analysing Seasonal, Regional and Sex Differences Using Web-Sourced Photographs and Pellet Contents Arjun Kannan, et al. (2023) Nest-Site Specialization in the Helmeted Manakin Antilophia galeata in a Gallery Forest from Southeastern Brazil Dáfini L. Bruno, et al. (2022) $("#ShowMore").click(function () { $(".hideExtraJournalItems:lt(5)").removeClass("hideExtraJournalItems") if ($(".hideExtraJournalItems").length == 0) { $("#ShowMore").hide(); } }); Most Recently Cited Articles The Design of Artificial Nestboxes for the Study of Secondary Hole-Nesting Birds: A Review of Methodological Inconsistencies and Potential Biases Marcel M. Lambrechts, et al. (2010) Bird Casualties on European Roads — A Review Johannes Erritzoe, et al. (2003) Conservation of Farmland Birds Faces Different Challenges in Western and Central-Eastern Europe Piotr Tryjanowski, et al. (2011) Effect of Old Nest Material on Nest Site Selection and Breeding Parameters in Secondary Hole Nesters — a Review Tomasz D. Mazgajski. (2007) Effects of Nest Characteristics on Breeding Success of Great Tits Parus major Jagna Alabrudzińska, et al. (2003) $("#ShowMore").click(function () { $(".hideExtraJournalItems:lt(5)").removeClass("hideExtraJournalItems") if ($(".hideExtraJournalItems").length == 0) { $("#ShowMore").hide(); } }); Content Email Alerts notify you when new content has been published. Visit My Account to manage your email alerts. Receive bi-monthly emailed content alerts Receive immediate emailed alerts when a new issue has been published SAVE Please select when you would like to receive an alert. Please wait... Alert saved! $(document).ready(function () { $("#divPopupContentAlert form").submit(function (event) { event.preventDefault(); $("#emptyInputWarning").hide(); if ($("#ReceiveContentAlerts:checked, #ReceiveTOCAlerts:checked").length == 0) { $("#emptyInputWarning").show(); } else { $(this).find(".pleaseWaitDiv").show(); $(this).find("button[type='submit']").hide(); var postURL = $(this).attr("action"); var encodingType = $(this).attr('enctype'); if (typeof encodingType == 'undefined' || encodingType == '' || encodingType == null) { encodingType = 'application/x-www-form-urlencoded; charset=UTF-8'; } var dataToSend = encodeURI($(this).serialize()); $.ajax({ type: "POST", url: postURL, contentType: encodingType, data: dataToSend, dataType: 'json', success: function (result) { $(this).find(".pleaseWaitDiv").hide(); $(this).find("#alertSaveResult").html(result.Message); $(this).find("#alertSaveResult").show(); if (result.Success) { setTimeout(function () { $("#divPopupContentAlert").dialog("close"); }, 2000); } }.bind(this), error: function (result) { $(this).find(".pleaseWaitDiv").hide(); $(this).find("#alertSaveResult").html("There was an error saving your alert. Please try again later."); $(this).find("#alertSaveResult").show(); }.bind(this) }); } }); }); function ShowContentAlertDialog(type, journalName) { $('.ui-dialog-content').dialog('close'); $("#ContentPaperType").val(type); $("#ContentJournalName").val(journalName); $("#divPopupContentAlert").dialog( { width: 360, height: 500, modal: true, resizable: false, draggable: false, closeOnEscape: true, zIndex: 999, title: 'RECEIVE CONTENT ALERT', close: function () { $(this).find(".pleaseWaitDiv").hide(); $(this).find("#alertSaveResult").hide(); $(this).find("button[type='submit']").show(); } }); return false; } Subscribe to BioOne Complete Receive Email Alerts'''
