full_description = "Top & Trending Research October 2024 We’re committed to expanding access to critical research that helps us better understand and protect the natural world. Our curated collection of top-read, peer-reviewed articles spans diverse subjects and species within biological, ecological, and environmental sciences. Whether you're passionate about biodiversity or global ecosystems, these recent discoveries are designed to inspire and fuel your curiosity. We are proud to spotlight content from some of BioOne’s publishing partners including Breviora, Journal of Agricultural and Urban Entomology, Journal of East African Natural History, Journal of Vertebrate Biology, Northwest Science, Novon, Ornithological Applications, and more. Explore all articles in our October 2024 edition of Top & Trending Research for free until December 31, 2024 , with thanks to BioOne Complete’s participating publishers. Unlock this collection by logging in to your free BioOne Digital Library account. New to our platform? Create a free account by clicking the “create an account” link in the sign in area. Browse by subject area: Agriculture & Agronomy Ecology Environmental SciencesGeology & Paleontology Ornithology Veterinary Sciences Biodiversity ConservationEntomology Evolutionary Biology Marine & Freshwater Biology Plant SciencesZoology Join our email list to get Top & Trending Research in your inbox Recommend BioOne Complete to your librarian Learn how libraries can subscribe to BioOne Complete, or request a quote for your institution AGRICULTURE & AGRONOMY JOURNAL OF AGRICULTURAL AND URBAN ENTOMOLOGY Behavioral Responses of Delphastus catalinae to Odors of Bemisia tabaci and Tomato Yellow Leaf Curl Virus Disease Complexes: Implications for Biological Control in Vegetable Crops JOURNAL OF ECONOMIC ENTOMOLOGY Conceptualization, design, and construction of a novel insect mass trapping device: the USDA Biomass Harvest Trap (USDA-BHT) SOUTH AMERICAN JOURNAL OF HERPETOLOGY Diversity of Anurans in Oil Palm Plantations in a Human-Dominated Landscape in Southeastern Mexico Back to top BIODIVERSITY CONSERVATION BREVIORA Tree Holes to Trash: Unique Upside-Down Terrestrial Spawning, Agonistic Interactions, Complex Mating Calls, and Unnatural Breeding Alterations in Minervarya charlesdarwini (Anura, Dicroglossidae) CASTANEA In a Warming World: Sarracenia as a Possible Model for Range Shift Dynamics and Conservation Highlights Need for Additional Population Genomics Research MADROÑO Bay Miwok Evening Primrose: A New Subspecies of Oenothera deltoides (Onagraceae) Endemic to California Back to top ECOLOGY ACTA CHIROPTEROLOGICA Seed Dispersal Networks in Neotropical Forest Areas of the Amazon, Cerrado, and Associated Ecotone: Abundance as the Driver of Bat Roles HERPETOLOGICA Site-Level Occupancy and Microhabitat Selection of Sympatric Nerodia (Serpentes: Colubridae) within an Imperiled River System JOURNAL OF VERTEBRATE BIOLOGY Non-native three-spined stickleback, a small but voracious predator of invasive crayfish Back to top ENTOMOLOGY ANNALES ZOOLOGICI FENNICI Immature stages of Smicridea ( Smicridea) erecta Flint, 1974 (Trichoptera, Hydropsychidae) THE COLEOPTERISTS BULLETIN Catalog of the Scirtidae of America North of Mexico (Coleoptera: Scirtoidea), with Taxonomic and Distributional Notes PROCEEDINGS OF THE ENTOMOLOGICAL SOCIETY OF WASHINGTON Color Morphs in Anastrepha nigrotaenia (Enderlein), New Combination (Diptera: Tephritidae) and Resultant Synonymy Back to top ENVIRONMENTAL SCIENCES ANTHROPOZOOLOGICA Animal remains in mortuary contexts in Southern Patagonia: a case study in lake Salitroso (Santa Cruz, Argentina) CARIBBEAN JOURNAL OF SCIENCE Evaluating Changes in Tree Canopy Coverage After Hurricane María: a Comparative Analysis of Urban, Coastal, and Rural Areas of Ponce, Puerto Rico HERPETOLOGICAL MONOGRAPHS The Influence of Management Practice on the Snakes in Forest Food Webs Back to top EVOLUTIONARY BIOLOGY AUSTRALIAN SYSTEMATIC BOTANY Elachanthus, Isoetopsis and Kippistia are nested in the genus Minuria (Asteraceae: Astereae) CRYPTOGAMIE, BRYOLOGIE Pterygoneurum sampaianum (Guim.) Guim.: Range Extension to Africa, First Mentions in France, Confirmation of Specific Status and Improved Morphological Circumscription INVERTEBRATE SYSTEMATICS UCE-based phylogenomics of the lepidopteran endoparasitoid wasp subfamily Rogadinae (Hymenoptera: Braconidae) unveils a new Neotropical tribe Back to top GEOLOGY & PALEONTOLOGY ANNALS OF CARNEGIE MUSEUM Report of a Diverse Vertebrate Body Fossil Assemblage in the Maroon Formation (Carboniferous–Permian), Eagle County, Colorado, U.S.A. THE BRYOLOGIST A fossil dicranid moss from the Late Cretaceous of Antarctica PALAIOS Early Jurassic Benthic Foraminiferal Ecology From the Central High Atlas Mountains, Morocco Back to top MARINE & FRESHWATER BIOLOGY CHELONIAN CONSERVATION AND BIOLOGY Assessment of Hatching and Emergence Success, Developmental Phases, and Pathology of Leatherback ( Dermochelys coriacea) Embryos and Dead-in-Nest Hatchlings on St. Croix, US Virgin Islands ICHTHYOLOGY AND HERPETOLOGY A New Record and Species of Pygmy Pipehorse of the Genus Cylix (Teleostei, Syngnathidae) from South Africa and the African Continent NORTHWEST SCIENCE Spatial and Temporal Surveys of Salmon Environmental DNA (eDNA) in a Seattle Urban Creek Back to top ORNITHOLOGY ORNITHOLOGICAL APPLICATIONS Brood translocation increases post-release recruitment and promotes population restoration of Centrocercus urophasianus (Greater Sage-Grouse) SOUTHEASTERN NATURALIST Aberrant White Eye Coloration in Two Red-Bellied Woodpeckers (Picidae: Melanerpes carolinus) from Florida WESTERN NORTH AMERICAN NATURALIST Co-Occurrence and Nest Success of Thick-Billed and Chestnut-Collared Longspurs in a Central Montana Rangeland Back to top PLANT SCIENCES ADANSONIA Descriptions of ten new species of Turraea L. (Meliaceae, Turraeeae) from Madagascar with notes on the species described by Buchenau HERZOGIA