 Society of Southern Africa African Entomology publishes original research articles and short communications on all aspects of entomology, with an emphasis on the advancement of entomology on the African continent. African Entomology is available in BioOne Complete through the 2021 volume. Current Issue | All Issues African Invertebrates Publisher: KwaZulu-Natal Museum African Invertebrates is a South African journal that covers the taxonomy, systematics, biogeography, biology, ecology, conservation and palaeontology of Afrotropical invertebrates, whether terrestrial, freshwater, or marine. African Invertebrates is available in BioOne Complete through the 2015 volume. Current Issue | All Issues African Journal of Wildlife Research Publisher: Southern African Wildlife Management Association African Journal of Wildlife Research is a multidisciplinary journal that has been published since 1971 and covers the scientific, applied, managerial, methodological, and sociological issues related to wildlife research. Current Issue | All Issues | Issues In Progress African Zoology Publisher: Zoological Society of Southern Africa African Zoology publishes original scientific contributions and critical reviews that focus principally on African fauna in terrestrial, freshwater, and marine ecosystems. Current Issue | All Issues Air, Soil and Water Research Publisher: SAGE Publishing Air, Soil and Water Research publishes research on soil, air, and water. The journal reports on properties—including physical, chemical, biochemical, and biological—analysis, microbiology, chemicals and pollution, consequences for plants and crops, soil hydrology, and other considerations. Current Issue | All Issues | Issues In Progress AMBIO: A Journal of the Human Environment Publisher: Royal Swedish Academy of Sciences Ambio, published by the Royal Swedish Academy of Sciences, includes broad, interdisciplinary research addressing the scientific, social, economic, and cultural factors that influence the condition of the human environment. Ambio is available in BioOne Complete through the 2011 volume. Current Issue | All Issues Ameghiniana Publisher: Asociación Paleontológica Argentina Ameghiniana has been in continuous publication since 1957. The journal publishes content regarding all aspects of paleontology, but is particularly focused on the paleontology of Gondwana and the southern hemisphere. Current Issue | All Issues | Issues In Progress The American Biology Teacher Publisher: National Association of Biology Teachers The American Biology Teacher is designed to support the teaching of K-16 biology and life sciences. The journal features articles related to biology as a whole, ethical issues in biology, and teaching strategies for classrooms, labs, and fieldwork. Current Issue | All Issues American Fern Journal Publisher: The American Fern Society American Fern Journal began in 1910 and has continuously published articles and notes based on original scientific research on ferns and allied groups of vascular plants for over 100 years. Current Issue | All Issues | Issues In Progress American Malacological Bulletin Publisher: American Malacological Society American Malacological Bulletin is focused exclusively on malacological research. It publishes original manuscripts, short reports, symposia, and detailed reviews dealing with molluscs. Current Issue | All Issues | Issues In Progress The American Midland Naturalist Publisher: University of Notre Dame The American Midland Naturalist was established in 1909. The journal covered a diverse set of biological disciplines (animal sciences, plant sciences, ecology) as they pertain to North America. The American Midland Naturalist ceased publication in 2023. Current Issue | All Issues American Museum Novitates Publisher: American Museum of Natural History American Museum Novitates has been continuously published by the American Museum of History since 1921. This title publishes short papers that contain descriptions of new forms and reports in zoology, paleontology, and geology. Current Issue | All Issues Annales Botanici Fennici Publisher: Finnish Zoological and Botanical Publishing Board Annales Botanici Fennici publishes research in systematics, evolution, phylogeography, taxonomy and nomenclature of plants and fungi. The journal also includes content regarding plant population biology and genetics, and plant ecology. Current Issue | All Issues | Issues In Progress Annales Zoologici Publisher: Museum and Institute of Zoology, Polish Academy of Sciences Annales Zoologici, published by the Museum and Institute of Zoology at the Polish Academy of Sciences, is devoted to all aspects of systematic entomology. Current Issue | All Issues Annales Zoologici Fennici Publisher: Finnish Zoological and Botanical Publishing Board Annales Zoologici Fennici publishes original research reports, in-depth reviews, and commentary on all aspects of animal ecology, evolution, and related fields. Current Issue | All Issues | Issues In Progress Annals of Carnegie Museum Publisher: Carnegie Museum of Natural History Annals of Carnegie Museum publishes work in organismal biology, earth sciences, and anthropology related to the Museum's collections, Powdermill Nature Reserve, or to Carnegie personnel. Current Issue | All Issues Annals of the Entomological Society of America Publisher: Entomological Society of America Annals of the Entomological Society of America contains work that integrates different areas of insect biology and addresses current, pressing issues that are likely to be of broad relevance to entomologists. Annals of the Entomological Society of America is available in BioOne Complete from 2000 through the current volume. Current Issue | All Issues Annals of the Missouri Botanical Garden Publisher: Missouri Botanical Garden Press Annals of the Missouri Botanical Garden contains papers focused primarily in systematic botany and evolutionary biology. Current Issue | All Issues | Issues In Progress Anthropozoologica Publisher: Muséum national d'Histoire naturelle, Paris Anthropozoologica is a fast-track, interdisciplinary journal from the French Museum of Natural History, Paris, containing work on the deep relationship between man and animal from our origins to modern times. Articles are published in French and English. Current Issue | All Issues Applications in Plant Sciences Publisher: Botanical Society of America Applications in Plant Sciences (APPS), published by the Botanical Society of America, rapidly publishes new and innovative tools and protocols in all areas of the plant sciences, including genetics, structure, function, development, evolution, systematics, and ecology. Applications in Plant Sciences is available in BioOne Complete through the 2017 volume. Current Issue | All Issues Applied Vegetation Science Publisher: International Association of Vegetation Science Applied Vegetation Science publishes research on applied fields relevant to the human impact on vegetation, such as eutrophication and global change, conservation, management, restoration, and landscape planning. Applied Vegetation Science is available in BioOne Complete through the 2008 volume. Current Issue | All Issues Aquatic Ecosystem Health & Management Publisher: Michigan State University Press Aquatic Ecosystem Health & Management is a peer reviewed international journal devoted to understanding ecosystem performance, function, and management from integrated, multi-disciplinary, and sustainable perspectives. Current Issue | All Issues The Arabidopsis Book Publisher: The American Society of Plant Biologists The Arabidopsis Book (TAB) was a publication launched in 2002 and supported by the American Society of Plant Biologists. TAB contained comprehensive information about a broad range of topics in research on Arabidopsis thaliana and related species. It ceased publication in 2019. Current Issue | All Issues Arachnologische Mitteilungen: Arachnology Letters Publisher: Arachnologische Gesellschaft e.V. Arachnologische Mitteilungen, subtitled Arachnology Letters, is a rapidly-produced journal based in Germany which focuses on faunistics, ecology, and taxonomy of Arachnida (excl. Acari) in Central Europe. Current Issue | All Issues Arachnology Publisher: British Arachnological Society Arachnology focuses on all aspects of Arachnology (excluding Acarology), including discussions of arachnid biology and ecology, descriptions of new species, and information on recent discoveries. Current Issue | All Issues Arctic, Antarctic, and Alpine Research Publisher: Institute of Arctic and Alpine Research (INSTAAR), University of Colorado Arctic, Antarctic, and Alpine Research publishes original research and book reviews on any scientific or cultural aspect of Arctic, Antarctic, and alpine environments, paleoenvironments, and related topics. Arctic, Antarctic, and Alpine Research is available in BioOne Complete through the 2017 volume. Current Issue | All Issues Ardea Publisher: Netherlands Ornithologists' Union Ardea, published by the Netherlands Ornithologists' Union, has been in publication since 1912. The journal focuses on new findings in ornithology, in particular those covering the ecology, life history, and evolution of birds. Current Issue | All Issues Ardeola Publisher: Spanish Society of Ornithology Ardeola: International Journal of Ornithology is the scientific journal of SEO/BirdLife, the Spanish Ornithological Society. It features research on all aspects of ornithology from all geographic regions, such as basic biology, ecology, behavior, and conservation and biogeography. Current Issue | All Issues | Issues In Progress Australian Ground Beetles Publisher: CSIRO Publishing Most Recent Book | List of Books Australian Journal of Zoology Publisher: CSIRO Publishing Australian Journal of Zoology publishes papers and critical reviews that demonstrate a conceptual advance to any aspect of zoology. This journal is focused on Australasian fauna, but includes work from regions worldwide. Current Issue | All Issues Australian Longhorn Beetles Publisher: CSIRO Publishing Most Recent Book | List of Books Australian Natural History Series Publisher: CSIRO Publishing Most Recent Book | List of Books Australian Soil and Land Survey Handbook Series Publisher: CSIRO Publishing Most Recent Book | List of Books Australian Systematic Botany Publisher: CSIRO Publishing Australian Systematic Botany is devoted to publishing research regarding the systematics, taxonomy, and related aspects of biogeography and evolution of all algae, fungi and plants, including fossils. Current Issue | All Issues Avian Diseases Publisher: American Association of Avian Pathologists Avian Diseases contains full papers, research notes and case reports related to avian diseases. Though most papers focus on poultry-related diseases, research on diseases of pet and wild birds are also included. Current Issue | All Issues Avian Diseases Digest Publisher: American Association of Avian Pathologists Avian Diseases Digest was published by the American Association of Avian Pathologists through 2012. The Digest published short-form articles and case reports regarding avian diseases specific to poultry health. It has ceased publication. Current Issue | All Issues"
