["https://bioone.org/vista-mountain-science"]
title = "Mountain Science"
description = "Peer-reviewed mountain science research highlighting mountain communities and ecosystems, climate resilience, and sustainability, curated to celebrate International Mountains Day."
full_description = "Mountain Science BioOne Vista | December 2024 Mountain communities face unique challenges from climate change, environmental degradation, and poverty, making ecological research essential for their resilience and sustainable future. To find innovative solutions, montology research integrates the ecological, biological, and environmental sciences and offers strategies for adapting to these challenges, conserving biodiversity, and promoting sustainable resource use. In celebration of International Mountains Day, this collection highlights peer-reviewed studies from BioOne Complete partners, including African Zoology, Harvard Papers in Botany, Journal of the Kentucky Academy of Science, Mountain Research and Development, Northeastern Naturalist, Polish Journal of Ecology, and more. Join our email list to get BioOne VISTA in your inbox. Recommend BioOne Complete to your librarian. Learn how libraries can subscribe, or request a quote for your institution. ACTA CHIROPTEROLOGICA Seasonal Activity Patterns of Bats in High-Elevation Conifer Sky Islands AFRICAN ZOOLOGY Lepidoptera as a Tool for the Assessment of Human Disturbance Impacting Ecological and Taxonomic Diversity in the Choke Mountains, Ethiopia AIR, SOIL AND WATER RESEARCH Landslide Modeling in a Tropical Mountain Basin Using Machine Learning Algorithms and Shapley Additive Explanations ARDEOLA Variations in Niche Breadth and Position of Alpine Birds along Elevation Gradients in the European Alps CROP AND PASTURE SCIENCE Microbial genes highlight different trends in short term for N cycling in historical alpine pastures ENTOMOLOGICAL NEWS Primary Biological Characteristics of an Emerging Major Boring Pest, Conogethes punctiferalis (Guenée) (Lepidoptera: Crambidae), on Juglans regia (Juglandales: Juglandaceae) in Taihang Mountains ENVIRONMENTAL ENTOMOLOGY Cold mountain stream chironomids (Diptera) of the genus Diamesa indicate both historical and recent climate change HARVARD PAPERS IN BOTANY Ouratea chepelii (Ochnaceae), a new species and aspects of phytogeography of the Genus in the Andean Region of Venezuela INSECT SYSTEMATICS AND DIVERSITY Is Phylogeographic Congruence Predicted by Historical Habitat Stability, or Ecological Co-associations? JOURNAL OF MAMMALOGY The structure of terrestrial mammal communities along an elevation gradient in the tropics. JOURNAL OF RESOURCES AND ECOLOGY Spatio-Temporal Pattern of Cropland Abandonment in Hilly and Mountainous Areas: A Case Study of Jiangxi, China JOURNAL OF THE KENTUCKY ACADEMY OF SCIENCE Amphibian Diversity Associated With High-Elevation Wetlands Within the Cumberland Mountains Physiographic Province MAMMAL STUDY Observations on the Ecological Role of Burrow-Dwelling Mammals in a Cold, Hyperarid Mountain Habitat MOUNTAIN RESEARCH AND DEVELOPMENT From Tradition to Innovation: The Pioneers of Mountain Entrepreneurship in the Lesser Caucasus NATURAL AREAS JOURNAL Comparing the Response of Red Spruce Plantings on Legacy Coal Mines and Old-Field Restoration Sites in the West Virginia Highlands NORTHEASTERN NATURALIST Northeastern High-Elevation Areas: Ecological Values and Conservation Priorities NORTHWEST SCIENCE Human and Wildlife Use of Mountain Glacier Habitat in Western North America PACIFIC SCIENCE Hawaiian Subalpine Plant Communities: Implications of Climate Change POLISH JOURNAL OF ECOLOGY Plant Diversity along an Elevation Gradient in Hyrcanian Forest of Northern Iran REVUE SUISSE DE ZOOLOGIE An exploratory survey and assessment of the hoverfly diversity (Diptera: Syrphidae) from the Pyrenees of Girona, Spain TRANSACTIONS OF THE AMERICAN ENTOMOLOGICAL SOCIETY New Data on Biodiversity and Chorology of Aquatic Insects of Tazekka National Park (Middle Atlas, Morocco) II: Ephemeroptera, Plecoptera and Trichoptera TREE-RING RESEARCH Tree-Ring Analysis of Red Spruce Timbers from the Moosilauke Ravine Lodge, White Mountains, New Hampshire TROPICAL CONSERVATION SCIENCE Comparative Study of Soil Microbial Diversity on Different Slope Orientations in Karst Rocky Mountains of Guangxi, China View the Previous Collection Explore the BioOne Complete Article Collection Archive Looking for more? If you're interested in more research like this, check out these titles from the BioOne eBooks: CSIRO Publishing BioSelect Collection. • Australian Alps: Kosciuskzo, Alpine and Namagdi National Parks• Global Megatrends: Seven Patterns of Change Shaping our Future• Mountain Ash: Fire, Logging and the Future of Victoria's Giant Forests• Sustainable Futures: Linking Population, Resources and the Environment Explore related topics like our UN Sustainable Development Goals and tourism collections. Browse UN SDG Research Coming in January 2025: Invertebrate Zoology. Sign up to get this collection sent to your email. Join Our Email List Get notified when new issues or content matching your search criteria is published. Get Content Alerts"
