full_description = '''Acta Palaeontologica Polonica VOL. 61 · NO. 4 | December 2016 IN THIS ISSUE EDITORS' CHOICE (2) ARTICLES (11) BRIEF REPORTS (5) Content Email Alerts notify you when new content has been published. Visit My Account to manage your email alerts. Receive bi-monthly emailed content alerts Receive immediate emailed alerts when a new issue has been published SAVE Please select when you would like to receive an alert. Please wait... Alert saved! $(document).ready(function () { $("#divPopupContentAlert form").submit(function (event) { event.preventDefault(); $("#emptyInputWarning").hide(); if ($("#ReceiveContentAlerts:checked, #ReceiveTOCAlerts:checked").length == 0) { $("#emptyInputWarning").show(); } else { $(this).find(".pleaseWaitDiv").show(); $(this).find("button[type='submit']").hide(); var postURL = $(this).attr("action"); var encodingType = $(this).attr('enctype'); if (typeof encodingType == 'undefined' || encodingType == '' || encodingType == null) { encodingType = 'application/x-www-form-urlencoded; charset=UTF-8'; } var dataToSend = encodeURI($(this).serialize()); $.ajax({ type: "POST", url: postURL, contentType: encodingType, data: dataToSend, dataType: 'json', success: function (result) { $(this).find(".pleaseWaitDiv").hide(); $(this).find("#alertSaveResult").html(result.Message); $(this).find("#alertSaveResult").show(); if (result.Success) { setTimeout(function () { $("#divPopupContentAlert").dialog("close"); }, 2000); } }.bind(this), error: function (result) { $(this).find(".pleaseWaitDiv").hide(); $(this).find("#alertSaveResult").html("There was an error saving your alert. Please try again later."); $(this).find("#alertSaveResult").show(); }.bind(this) }); } }); }); function ShowContentAlertDialog(type, journalName) { $('.ui-dialog-content').dialog('close'); $("#ContentPaperType").val(type); $("#ContentJournalName").val(journalName); $("#divPopupContentAlert").dialog( { width: 360, height: 500, modal: true, resizable: false, draggable: false, closeOnEscape: true, zIndex: 999, title: 'RECEIVE CONTENT ALERT', close: function () { $(this).find(".pleaseWaitDiv").hide(); $(this).find("#alertSaveResult").hide(); $(this).find("button[type='submit']").show(); } }); return false; } VIEW ALL ABSTRACTS + This will count as one of your downloads. You will have access to both the presentation and article (if available). DOWNLOAD NOW function ShowHidePwdSignInToken() { var $pwd = $(".pwdSignIn"); if ($pwd.attr('type') == 'password') { $pwd.attr('type', 'text') } else $pwd.attr('type', 'password') } This content is available for download via your institution's subscription. To access this item, please sign in to your personal account. Email Password Forgot your password? Show Remember Email on this computer Remember Password No BioOne Digital Library account? Create an account EDITORS' CHOICE A New Mid-Permian Burnetiamorph Therapsid from the Main Karoo Basin of South Africa and a Phylogenetic Review of Burnetiamorpha Michael O. Day, Bruce S. Rubidge, Fernando Abdala Acta Palaeontologica Polonica 61 (4), 701-719, (16 November 2016) https://doi.org/10.4202/app.00296.2016 KEYWORDS: Therapsida, Burnetiamorpha, Biarmosuchia, Karoo Basin, Poortjie Member, Capi ta nian extinction, South Africa Read Abstract + Discoveries of burnetiamorph therapsids in the last decade and a half have increased their known diversity but they remain a minor constituent of middle—late Permian tetrapod faunas. In the Main Karoo Basin of South Africa, from where the clade is traditionally best known, specimens have been reported from all of the Permian biozones except the Eodicynodon and Pristerognathus assemblage zones. Although the addition of new taxa has provided more evidence for burnetiamorph synapomorphies, phylogenetic hypotheses for the clade remain incongruent with their appearances in the stratigraphic column. Here we describe a new burnetiamorph specimen (BP/1/7098) from the Pristerognathus Assemblage Zone and review the phylogeny of the Burnetiamorpha through a comprehensive comparison of known material. Phylogenetic analysis suggests that BP/1/7098 is closely related to the Russian species Niuksenitia sukhonensis. Remarkably, the supposed mid-Permian burnetiids Bullacephalus and Pachydectes are not recovered as burnetiids and in most cases are not burnetiamorphs at all, instead representing an earlier-diverging clade of biarmosuchians that are characterised by their large size, dentigerous transverse process of the pterygoid and exclusion of the jugal from the lateral temporal fenestra. The evolution of pachyostosis therefore appears to have occurred independently in these genera. The resulting biarmosuchian tree is significantly more congruent with the stratigraphic appearance of its constituent taxa than in previous phylogenetic hypotheses and, consequently, does not necessarily constrain the diversification of the Burnetiamorpha to before the Capitanian. DOWNLOAD PAPER SAVE TO MY LIBRARY + New Robertinid Foraminifers from the Early Jurassic of Adnet, Austria and Their Evolutionary Importance Sylvain Rigaud, Joachim Blau Acta Palaeontologica Polonica 61 (4), 721-734, (14 September 2016) https://doi.org/10.4202/app.00250.2016 KEYWORDS: Robertinida, Trochosiphoniidae, Conorboididae, inner-chamber structures, marmorea crust, Jurassic, Austria Read Abstract + New benthic multichambered foraminifers have been discovered in the Hettangian—Sinemurian of the Northern Calcareous Alps (Adnet, Salzburg, Austria). Originally aragonitic, these forms are completely recrystallized but the early impregnation of their tests by Fe-Mn solutions has, to some extent, allowed an indirect preservation of their primary structure. The most remarkably preserved specimens are found in close vicinity to the marmorea crust, a heavily mineralized multiphased hardground. We describe two new genera, Velleditsiella gen. nov., a microgastropod look-alike foraminifer, which includes the species V. felicitaszae gen. et sp. nov. and V. spinaferra gen. et sp. nov., and Rossanella gen. nov., the first known representative of the superfamily Conorboidoidea, which includes the species R. martinii gen. et sp. nov. Considering their structural and morphological characteristics, Velleditsiella and Rossanella phylogenetically derive from two distinct Triassic lineages, respectively the families Trochosiphoniidae and Variostomatidae. The discovery of diverse aragonitic assemblages in earliest Jurassic strata dismisses the long believed hypothesis that all Jurassic aragonitic multichambered foraminifers originated from a single Oberhauserellidae ancestor. It also supports a lower impact of the Triassic/Jurassic biotic crisis on the evolution of aragonitic foraminifers. Hypotheses for the short term and long term evolution of aragonitic multichambered foraminifers are discussed and new phyletic trees are proposed. DOWNLOAD PAPER SAVE TO MY LIBRARY + ARTICLES Dietary Ecology of the Extinct Cave Bear: Evidence of Omnivory as Inferred from Dental Microwear Textures D. Brent Jones, Larisa R.G. Desantis Acta Palaeontologica Polonica 61 (4), 735-741, (29 June 2016) https://doi.org/10.4202/app.00253.2016 KEYWORDS: Mammalia, Ursus spelaeus, carnivore, dental microwear, Pleistocene, Europe Read Abstract + The diet of the extinct European cave bear, Ursus spelaeus, has widely been debated. Diverging from the extant brown bear (Ursus arctos) approximately 1.2 million years ago, the cave bear is one of the most ubiquitous fossil bears occurring in Europe during the Middle and Late Pleistocene. Early morphological studies suggested that the cave bear was likely specialized on processing tough and/or abrasive foods, while later two-dimensional low-magnification microwear studies suggested that they were omnivorous and may have consumed more bone than U. arctos. Here, we used dental microwear texture analysis (DMTA) to further interpret the diet of the cave bear. Microscopic wear features were assessed and compared to modern ursids, including the cave bears' closest living relative, U. arctos. Results suggest that U. spelaeus consumed a diet with a diversity of textural properties, similar to most other bears and only distinguishable from the hyper-carnivorous polar bear (Ursus maritimus). Further, only U. maritimus can be distinguished from all bear species here examined (i.e., the giant panda bear, Ailuropoda melanoleuca; sun-bear, Ursus malayanus; spectacled bear, Tremarctos ornatus; American black bear, Ursus americanus; and U. arctos), with significantly greater area-scale fractal complexity (Asfc) of microwear surfaces. The DMTA of A. melanoleuca also has significantly lower Asfc than T. ornatus and U. americanus, consistent with observed dietary behavior. As modern bears vary their diets seasonally and across their range, it may be difficult to characterize the dietary ecology of extinct bears using dental microwear alone. Nevertheless, DMTA here demonstrates that U. spelaeus had a diet distinct from the hyper-carnivorous U. maritimus and instead likely consumed food with textural properties most similar to other herbivorous/omnivorous bears. Lastly, the European cave bear and North American giant short-faced bear (Arctodus simus) may have had similar diets as evident from DMTA, with U. spelaeus potentially eating tougher food items. DOWNLOAD PAPER SAVE TO MY LIBRARY + Taxonomic, Biogeographic, and Taphonomic Reassessment of a Large Extinct Species of Paca from the Quaternary of Brazil Elver Luiz Mayer, Alex Hubbe, Leonardo Kerber, Paulo Miguel Haddad-Martim, Walter Neves Acta Palaeontologica Polonica 61 (4), 743-758, (21 June 2016) https://doi.org/10.4202/app.00236.2016 KEYWORDS: Mammalia, Rodentia, Caviomorpha, Cuniculidae, cave environments, karst, Pleistocene, Lagoa Santa Read Abstract + The taxonomy of extinct species of Cuniculus (Caviomorpha, Rodentia, Mammalia) is confusing and poorly studied. Here we provide a taxonomic review of extinct cuniculids, and discuss the taxonomic, biogeographic, taphonomic and chronologic aspects of new remains of an extinct large cuniculid from Brazilian Quaternary Gruta Cuvieri cave deposits. Our taxonomic review suggests that Cuniculus rugiceps (Lund, 1837) is the valid taxon to include all available occurrences of extinct cuniculids. The most evident features of this taxon are its larger size and the stronger and more densely distributed rugosities on the skull external surface when compared to the extant species. At present, the distribution of C. rugiceps is restricted to the tropical region of Brazil. Regarding the new remains, taphonomic analysis of the specimens from Cuvieri Cave suggests our sample is represented by at least seven individuals that accumulated within the cave deposit by pitfall entrapment. The biostratinomy of the specimens was characterized by prolonged surface exposure inside the pit with fragmentation and displacement caused mostly by falling and subsequent trampling by individuals of the same and/or other species. The stratigraphically controlled excavations and chronological data allowed the establishment of a Late Pleistocene minimum age for these specimens. DOWNLOAD PAPER SAVE TO MY LIBRARY + Small Mammal Fauna from Wulanhuxiu (Nei Mongol, China) Implies the Irdinmanhan—Sharamurunian (Eocene) Faunal Turnover Qian Li, Yuan-Qing Wang, Łucja Fostowicz-Frelik Acta Palaeontologica Polonica 61 (4), 759-776, (17 October 2016) https://doi.org/10.4202/app.00292.2016 KEYWORDS: Mammalia, Rodentia, Duplicidentata, Anagalidae, Eocene, Ulan Shireh Formation, China, Erlian Basin Read Abstract + Wulanhuxiu, a middle Eocene locality in the Erlian Basin, Nei Mongol (China) has been commonly regarded as belonging to the Ulan Shireh Formation, equated with the Irdin Manha Formation. We recognized two separate mammalian faunas of different age from the beds exposed at Wulanhuxiu. The lower fossiliferous horizon contains an anagalid, uncommon duplicidentate representatives (Gomphos progressus sp. nov., Mimolagus, Erenlagus, and Strenulagus), and diverse perissodactyls. This combination of taxa points to an Irdinmanhan age, but one element of the fauna (Schlosseria) may represent an Arshantan relic. Overall, the assemblage comprises “paleoplacental” mammals mixed with “neoplacentals”. The upper horizon is less species-rich and the only paleoplacentals present are scarce creodonts. However, this horizon is marked by abundant remains (including postcranial material) of the lagomorph Gobiolagus and by the presence of an advanced form of Gobiomys (Rodentia), and is most probably Sharamurunian in age. Thus, Wulanhuxiu documents replacement, albeit incomplete, of paleoplacentals by neoplacentals in the Chinese Eocene record. DOWNLOAD PAPER SAVE TO MY LIBRARY + The Sixth Sense in Mammalian Forerunners: Variability of the Parietal Foramen and the Evolution of the Pineal Eye in South African Permo-Triassic Eutheriodont Therapsids Julien Benoit, Fernando Abdala, Paul R. Manger, Bruce S. Rubidge Acta Palaeontologica Polonica 61 (4), 777-789, (17 March 2016) https://doi.org/10.4202/app.00219.2015 KEYWORDS: Therapsida, pineal, parietal foramen, third eye, endothermy, Permian, Triassic, South Africa Read Abstract + In some extant ectotherms, the third eye (or pineal eye) is a photosensitive organ located in the parietal foramen on the midline of the skull roof. The pineal eye sends information regarding exposure to sunlight to the pineal complex, a region of the brain devoted to the regulation of body temperature, reproductive synchrony, and biological rhythms. The parietal foramen is absent in mammals but present in most of the closest extinct relatives of mammals, the Therapsida. A broad ranging survey of the occurrence and size of the parietal foramen in different South African therapsid taxa demonstrates that through time the parietal foramen tends, in a convergent manner, to become smaller and is absent more frequently in eutherocephalians (Akidnognathiidae, Whaitsiidae, and Baurioidea) and non-mammaliaform eucynodonts. Among the latter, the Probainognathia, the lineage leading to mammaliaforms, are the only one to achieve the complete loss of the parietal foramen. These results suggest a gradual and convergent loss of the photoreceptive function of the pineal organ and degeneration of the third eye. Given the role of the pineal organ to achieve fine-tuned thermoregulation in ectotherms (i.e., “cold-blooded” vertebrates), the gradual loss of the parietal foramen through time in the Karoo stratigraphic succession may be correlated with the transition from a mesothermic metabolism to a high metabolic rate (endothermy) in mammalian ancestry. The appearance in the eye of melanopsin-containing retinal ganglion cells replacing the photoreceptive role of the pineal eye could also have accompanied its loss. DOWNLOAD PAPER SAVE TO MY LIBRARY + A New Ophthalmosaurid Ichthyosaur from the Late Jurassic of Owadów-Brzezinki Quarry, Poland Daniel Tyborowski Acta '''
