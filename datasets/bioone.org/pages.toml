full_description = "Browse the entire BioOne Digital Library Discover research from BioOne Complete and BioOne eBooks, featuring 200+ full-text journals and 360+ eBook titles from our publishing partners. Browse by Collection: All Titles Publishers Subjects A B C E F G H I J L M N O P R S T U W Z Cactus and Succulent Journal Publisher: Cactus and Succulent Society of America Cactus and Succulent Journal features articles about cacti and other succulent plants, including caudiciform and pachycaul succulents and xerophytes, and is meant for professionals and hobbyists alike. Current Issue | All Issues The Canadian Entomologist Publisher: Entomological Society of Canada The Canadian Entomologist, published since 1868, contains work on all facets of entomology, such as systematics and morphology, molecular and developmental biology, ecology and behavior, and biodiversity. The Canadian Entomologist is available in BioOne Complete through the 2011 volume. Current Issue | All Issues Canadian Journal of Animal Science Publisher: Canadian Science Publishing Canadian Journal of Animal Science contains new research on all aspects of animal agriculture and animal products, such as breeding and genetics, welfare and management, and cellular and molecular biology. Current Issue | All Issues Canadian Journal of Plant Science Publisher: Canadian Science Publishing Canadian Journal of Plant Science contains research on plant science relevant to the environmental regions of Canadian agriculture, including plant production/management, horticulture, and pest management. Current Issue | All Issues Canadian Journal of Soil Science Publisher: Canadian Science Publishing Canadian Journal of Soil Science contains research on the use, management, structure and development of soils, and publishes content from the varied disciplines of soil science, from geology to agrometerology. Current Issue | All Issues Candollea Publisher: The Conservatory and Botanical Garden of the City of Geneva (CJBG)