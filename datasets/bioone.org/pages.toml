title = "Volume 58 Issue 2 | Acta Ornithologica"
description = "Acta Ornithologica, published by the Museum and Institute of Zoology at the Polish Academy of Sciences, covers all fields of ornithology."
full_description = '''Acta Ornithologica VOL. 58 · NO. 2 | Winter 2023 IN THIS ISSUE RESEARCH PAPERS (4) SHORT NOTES (1) Content Email Alerts notify you when new content has been published. Visit My Account to manage your email alerts. Receive bi-monthly emailed content alerts Receive immediate emailed alerts when a new issue has been published SAVE Please select when you would like to receive an alert. Please wait... Alert saved! $(document).ready(function () { $("#divPopupContentAlert form").submit(function (event) { event.preventDefault(); $("#emptyInputWarning").hide(); if ($("#ReceiveContentAlerts:checked, #ReceiveTOCAlerts:checked").length == 0) { $("#emptyInputWarning").show(); } else { $(this).find(".pleaseWaitDiv").show(); $(this).find("button[type='submit']").hide(); var postURL = $(this).attr("action"); var encodingType = $(this).attr('enctype'); if (typeof encodingType == 'undefined' || encodingType == '' || encodingType == null) { encodingType = 'application/x-www-form-urlencoded; charset=UTF-8'; } var dataToSend = encodeURI($(this).serialize()); $.ajax({ type: "POST", url: postURL, contentType: encodingType, data: dataToSend, dataType: 'json', success: function (result) { $(this).find(".pleaseWaitDiv").hide(); $(this).find("#alertSaveResult").html(result.Message); $(this).find("#alertSaveResult").show(); if (result.Success) { setTimeout(function () { $("#divPopupContentAlert").dialog("close"); }, 2000); } }.bind(this), error: function (result) { $(this).find(".pleaseWaitDiv").hide(); $(this).find("#alertSaveResult").html("There was an error saving your alert. Please try again later."); $(this).find("#alertSaveResult").show(); }.bind(this) }); } }); }); function ShowContentAlertDialog(type, journalName) { $('.ui-dialog-content').dialog('close'); $("#ContentPaperType").val(type); $("#ContentJournalName").val(journalName); $("#divPopupContentAlert").dialog( { width: 360, height: 500, modal: true, resizable: false, draggable: false, closeOnEscape: true, zIndex: 999, title: 'RECEIVE CONTENT ALERT', close: function () { $(this).find(".pleaseWaitDiv").hide(); $(this).find("#alertSaveResult").hide(); $(this).find("button[type='submit']").show(); } }); return false; } VIEW ALL ABSTRACTS + This will count as one of your downloads. You will have access to both the presentation and article (if available). DOWNLOAD NOW function ShowHidePwdSignInToken() { var $pwd = $(".pwdSignIn"); if ($pwd.attr('type') == 'password') { $pwd.attr('type', 'text') } else $pwd.attr('type', 'password') } This content is available for download via your institution's subscription. To access this item, please sign in to your personal account. Email Password Forgot your password? Show Remember Email on this computer Remember Password No BioOne Digital Library account? Create an account RESEARCH PAPERS Woodpecker Nest Cavity Orientation in Dry Conifer Forests of the Pacific Northwest, USA Jeffrey M. Kozma, Teresa J. Lorenz, Andrew N. Stillman Acta Ornithologica 58 (2), 135-143, (29 May 2024) https://doi.org/10.3161/00016454AO2023.58.2.001 KEYWORDS: woodpeckers, nest orientation, snags, Dryobates, Picoides, Sphyrapicus, ponderosa pine, Douglas-fir Read Abstract + Birds are under selective pressure to orient their nests in a direction that reduces the impact of climatic extremes and the risk of the nest being detected by predators. Woodpeckers (Picidae), despite raising young in tree cavities that are safer from predators, should orient the entrances of their nest cavities in a direction that results in a favorable cavity microclimate. Because Picid nest cavity orientation is not well-studied in the Pacific Northwest of North America, we measured nest cavity orientation of White-headed Dryobates albolarvatus, Hairy D. villosus, and Black-backed Picoides arcticus Woodpeckers, Northern Flicker Colaptes auratus, and Williamson's Sapsucker Sphyrapicus thyroideus within burned and unburned, dry conifer forests of the eastern Cascade Range in Washington, USA (N = 684). Each woodpecker species had a mean angle of nest cavity orientation in a northerly or easterly direction and ranged from 12.3° for the Northern Flicker to 117.6° for the Black-backed Woodpecker. Hairy Woodpeckers, Northern Flickers, and White-headed Woodpeckers showed strong evidence for nonrandom nest cavity orientation, and Northern Flickers showed particularly high dispersion with a multimodal distribution of cavity orientations. Although the mean and variance of cavity orientations did not differ substantially between woodpeckers, cavity orientation differed based on nest tree species. Woodpeckers may orient their nest cavities in an easterly direction so that cavities warm quicker in the morning, to avoid hot afternoon temperatures and prevailing west and north westerly winds, and because the majority of cavities were located in burned forest where shading from canopy cover is reduced. DOWNLOAD PAPER SAVE TO MY LIBRARY + Nest-Site Reuse by the White-Collared Swift Streptoprocne zonaris in Rocky Caves in South-Central Cuba Rosalina Montes, Josabel Belliure, Rubén J. Chamizo Acta Ornithologica 58 (2), 145-152, (29 May 2024) https://doi.org/10.3161/00016454AO2023.58.2.002 KEYWORDS: cypseloidine swift, nesting success, nest-site reuse, Streptoprocne zonaris, White-collared Swift Read Abstract + Nesting is a prerequisite for breeding in a wide range of birds, and nest-sites become a key resource ultimately influencing individual fitness. In that context, reuse of nest-sites by breeding pairs has been observed in a variety of bird species. White-collared Swifts Streptoprocne zonaris constitute one example in which reuse of nest-sites from previous reproductive seasons has been reported. In this study we explored this behaviour in the main location of the species in Cuba, the natural area of Topes de Collantes (south-central Cuba), where breeding pairs occupy several natural rocky caves. We also studied nest-sites locations to identify determinants for reuse and followed nest content to quantify nesting success. During a three-year period of study, 82 nests were constructed in 67 nest-sites at three nesting colonies located at the area. Nest-sites were occupied in the four placement-location combinations at the caves: ceiling-hole, ceiling-ledge, wall-hole and wall-ledge, and were located at a height range of 0.90 to 9 m. A total of 31 nest-sites were reused at least once, which implies an incidence of nest-site reuse for the area of 46.3%. Nest-site reuse was related to characteristics of the nest-site location: reused nest-sites were less often observed at the ceiling-ledge combination as well as at the highest locations in the caves. Nesting success was measured as success in producing at least one fledgling, and was higher in reused (87.1%) than in not-reused (59.5%) nest-sites. These results confirm the existence of some benefits of nest-site reuse in the Cuban populations of the White-collared Swift, suggesting that the high quality breeding pairs might detect and select particular nest-sites to guarantee a successful breeding. This study also highlights that conservation of the caves and their natural characteristics at the natural area of Topes de Collantes is key for the Cuban populations of the species. DOWNLOAD PAPER SAVE TO MY LIBRARY + Which Forest Characteristics Shape Bird Abundance in Central European Forests? A Case Study Based on Common Breeding Bird Survey in Czechia Filip Szarvas, Jan Michálek, Zdeněk Vermouzek, Petr Voříšek, Jiří Reif Acta Ornithologica 58 (2), 153-174, (29 May 2024) https://doi.org/10.3161/00016454AO2023.58.2.003 KEYWORDS: bird community, abundance, forestry, habitat selection, Europe Read Abstract + A large part of European forests is managed using modern forestry techniques, and it is interesting to explore the relationships between forest bird abundance and variables describing the forests from the perspective of forest managers. The aim of our study was to identify these relationships through nation-wide bird monitoring and forestry data in Czechia. After controlling for the effect of altitude, the forest characteristics that exhibited a significant effect on the abundance in the highest number of species are the proportion of conifers, growth phase and tree damage. In the next step, we performed a principal component analysis to reveal general patterns in those species-specific responses. The main gradient obtained was determined by altitude and discriminated species associated with lowland forests (e.g. Common Starling Sturnus vulgaris, Spotted Flycatcher Muscicapa striata) from those associated with highland forests (e.g. Red Crossbill Loxia curvirostra, Tree Pipit Anthus trivialis). This suggests an important role of altitudinal climate zones in shaping forest bird abundance. The second gradient showed a cluster of species with higher abundance in broad-leaved forests with higher stem density, more vegetation layers, and more damaged (e.g. Common Redstart Phoenicurus phoenicurus, European Pied Flycatcher Ficedula hypoleuca). At the opposite end were clustered species with higher abundance in more coniferous forests, lower stem density, fewer vegetation layers and less damaged (e.g. Eurasian Siskin Spinus spinus, Crested Tit Lophophanes cristatus). The second gradient can be explained by forestry practices applied in Czechia. Specifically, broad-leaved forests generally have a longer logging cycle compared to coniferous forests, resulting in generally older stands exhibiting more signs of damage and multiple vegetation layers, while coniferous forests predominantly maintain a single-vegetation layer structure. Bird association with growth phase was independent from altitude and other forest characteristics. DOWNLOAD PAPER SAVE TO MY LIBRARY + Resilience of Bird Communities After Wildfires in Algerian Cork Oak Forests Nesrine Zeghdani, Roger Prodon, Slim Benyacoub Acta Ornithologica 58 (2), 175-186, (29 May 2024) https://doi.org/10.3161/00016454AO2023.58.2.004 KEYWORDS: Bird, fire, ecological succession, cork oak, Fire recurrence, resilience, Mediterranean Region Read Abstract + Wildfire recurrence is a threat to North African forest ecosystems. The objective of this study is to assess the impact of fire on the avifauna of Algerian cork oak forests and evaluate their resilience in a conservation perspective. We adopted both synchronic sampling (selection of sites supposed representative of successional stages) and diachronic sampling (sampling of the same sites repeated over time) of the avifauna of cork oak stands situated in a fire-prone area of NE Algeria. Using multivariate analyses, we measured the degree of fire alteration of these ecosystems, reconstituted a post-fire successional series, tracked the post-fire recovery, and analyzed the response of each bird species. The results show that the number of species decreases after fire and then increases until it reaches a plateau at around 20–30 years of age. The responses of bird species to fire are relatively similar to those north of the Mediterranean (France, Spain) with few exceptions, in particular because the relatively early sampling includes some late winterers. After the disappearance of the forest species (e.g. Regulus ignicapilla, and Coccothraustes coccothraustes) and the appearance of a few open-habitat species immediately after the fire (e.g. Galerida cristata, Oenanthe hispanica), the former recolonise and the composition of the avifauna stabilises after around twenty years after fire. Even subjected to repeated fires, these forests seem to have the ability to regenerate and recover their pre-fire avifauna and vegetation structure within about 30 years. Despite the apparent resilience shown by these cork forests in the short-term, we do not know the consequences on strictly forest birds of an increase in fire frequency resulting from an increased human pressure and climate change, and recommend protection of these ecosystems to ensure their sustainability. DOWNLOAD PAPER SAVE TO MY LIBRARY + SHORT NOTES Birds in Bavarian Hop Plantations: Nesting Preferences for Different Structural Pole Types Marta K. Nowak, Peter Mikula, Łukasz Jankowiak, Zuzanna Sawinska, Annette Menzel, Piotr Tryjanowski Acta Ornithologica 58 (2), 187-192, (29 May 2024) https://doi.org/10.3161/00016454AO2023.58.2.005 KEYWORDS: bird diversity, cavity nesters, Farmland, Germany, hop plantation, pest control Read Abstract + Hops (mainly Humulus lupulus varieties) are a globally significant agricultural crop, known mainly for their use in the brewing industry. Hop plantations create unique habitats for birds, with structural poles potentially serving as nesting sites for cavity nesting birds. We surveyed 321 hop plantations (inspecting 100 random poles in each) during the 2023 breeding season in Bavaria, Germany, and examined structural poles for the presence of nesting birds. We found 219 breeding pairs of 11 cavity-nesting species. The most frequent nesting species were Common Starling Sturnus vulgaris, Tree Sparrow Passer montanus, and Great Tit Parus major. The most nesting cavities were found in wooden and concrete poles, while metal poles were largely avoided. Nesting sites in metal and concrete poles were often selected due to structural imperfections, whereas wooden poles contained mainly cavities excavated by woodpeckers. We advocate for the retention of wooden poles over concrete/metal poles, as they are crucial nesting sites for birds which are important in pest control in hop plantations. For modern hop plantations with non-wooden poles, we recommend the use of nest boxes which can compensate for the loss of nesting sites and support local breeding bird populations. DOWNLOAD PAPER SAVE TO MY LIBRARY + function ShowHidePwd() { var $pwd = $(".pwd"); if ($pwd.attr('type') == 'password') { $pwd.attr('type', 'text') } else $pwd.attr('type', 'password') } PERSONAL SIGN IN Full access may be available with your subsc