["https://bioone.org/instructor-resources"]
title = "Instructor Resources"
description = "Instructor resources for university instructors and faculty using BioOne Complete with students in their coursework, including information for instructors wanting to incorporate interdisciplinary peer-reviewed research articles in the biological and environmental sciences in their lesson plan."
full_description = "Instructor Resources BioOne Complete is a curated collection of 200+ journals in the biological, ecological, and environmental sciences. With interdisciplinary content which can serve a wide range of academic interests, BioOne Complete is a valuable resource for your curriculum. Does your institution subscribe? With more than 33,000 open access articles, we encourage you to incorporate articles from BioOne Complete into your coursework even if your institution is not a subscriber. You can also let your institutional librarian or resources manager know that you’d benefit from full access. Getting Started With BioOne Complete START A SEARCH and refine the results with the platform’s advanced search capabilities. LEARN MORE ABOUT BIOONE COMPLETE in the Help Center and watch a video about the platform and your account. ASK YOUR LIBRARIAN if you have questions about your institution’s access or need help including research in your coursework. Include BioOne Complete in your Teaching REMOTE ACCESS to support students and faculty whether they are on campus or online. Researchers can affiliate their personal account with the institution's subscription so they can access BioOne Complete from anywhere. Google Scholar can also provide off-campus access to BioOne library subscriptions. UNLIMITED SIMULTANEOUS USERS so many students can easily access the same content at the same time. COURSEPACK INCLUSION is easy and convenient. Share links to key articles or searches in an email, in your syllabus, or gather a related group of saved searches or citations. You can also get alerts directly in your inbox for saved searches on specific topics. MOBILE-FRIENDLY platform allows users to access all features on a smartphone or tablet. EASY CITATION DOWNLOADS from BioOne Complete can be directly exported to EndNote, RefWorks, Zotero, and more. ENHANCED ACCESSIBILITY with translation tools. Resources For Your Students INFORMATIONAL FLYER FOR RESEARCHERS:View, download, and share this flyer providing more information about BioOne Complete for researchers. BIOONE COMPLETE USER GUIDE: Watch a brief video to get started. VISIT THE HELP SECTION BioOne Complete includes a robust Help section, which features additional information and answers to frequently asked questions about BioOne Complete and the BioOne Digital Library. Search BioOne Complete by Core Subject Area BioOne's collection aggregates peer-reviewed content from more than 150 society publishers, spanning over 208,000 full-text articles. Explore our core subject areas. Agriculture & AgronomyEcologyEnvironmental SciencesGeology & PaleontologyOrnithologyVeterinary Sciences Biodiversity ConservationEntomologyEvolutionary BiologyMarine & Freshwater BiologyPlant SciencesZoology Inspire Your Students with BioOne Complete ARTICLE COLLECTIONS BioOne Complete subscribers have reported that these selected article collections are useful tools to share with students and faculty looking for inspiration for their course projects. Explore our article collections to find resources to enhance your coursework, and to stay aware of current research. BIOONE VISTAA monthly collection highlighting timely subjects and themes. Past themes have included topics such as rainforest ecology, March Mammal Madness, invasive species, climate change, and more. TOP AND TRENDING RESEARCHQuarterly collections of impactful research from broad cross-sections of subjects, species, and regional interests. SPECIAL CONTENT COLLECTIONSCurated research collections that spotlight current events and conversations in the scientific community. Browse all BioOne Complete article collections on our Article Collection Archive page. SAMPLE EXERCISE: Scientific Communication in Practice: How does bioscience research change the world? Inspired by the BioOne Ambassador Awards. Instructions for StudentsSelect an article from BioOne Complete that interests you, and in a creative written, video, or other digital format, answer the question: how does this research change the world? Try to communicate the impact of this research to various audiences such as fellow scientists, students, funders, or to the general public. This exercise is inspired by the BioOne Ambassador Awards, and asks students to use peer-reviewed research articles from BioOne Complete, and summaries from the BioOne Ambassadors who authored the research. The annual BioOne Ambassador Award recognizes early-career authors who exhibit creative approaches to communicating specialized research to the general public while answering the question, how does your research change the world? Visit the BioOne Ambassador Award Showcase to explore written and video summaries that answer this question. About BioOne Complete BioOne Complete is the flagship product from BioOne, an innovative non-profit collaborative supporting sustainable scholarly communications since 1999. Learn more about BioOne. Don't see the information you need here? If your question is about your personal account, consult our Help Section or contact the Help Desk. If you have questions specific to your institution's subscription, or are interested in subscribing to BioOne Complete, please contact us."
