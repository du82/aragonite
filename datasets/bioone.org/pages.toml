full_description = '''Acta Palaeontologica Polonica Publisher: Institute of Paleobiology, Polish Academy of Sciences Acta Palaeontologica Polonica, founded in 1956, publishes research of general interest from all areas of paleontology, particularly biologically-oriented paleontological work. Acta Palaeontologica Polonica is available in BioOne Complete through the 2016 volume. Current Issue All Issues Featured Content Scope & Details Below are lists of this title's Most Read and Most Recently Cited articles. The Most Read articles are the articles which have been downloaded the most on the new platform. The Most Recently Cited articles list uses Crossref cited-by data (downloaded on the 1st and 15th of each month) to automatically identify papers which have received the most new citations over the last month. The articles that appear here are not those which have received the most citations in total, but rather the articles which have been cited most often most recently. Most Read Articles Convergent Evolution of Jaws between Spinosaurid Dinosaurs and Pike Conger Eels Romain Vullo, et al. (2016) The Extent of the Pterosaur Flight Membrane Ross A. Elgin, et al. (2011) Osteology and Relationships of Olorotitan arharensis, A Hollow-Crested Hadrosaurid Dinosaur from the Latest Cretaceous of Far Eastern Russia Pascal Godefroit, et al. (2012) The Anatomy of the Late Miocene Baleen Whale Cetotherium riabinini from Ukraine Pavel Gol'din, et al. (2013) Evolution of the Pterosaur Pelvis Elaine S. Hyder, et al. (2014) $("#ShowMore").click(function () { $(".hideExtraJournalItems:lt(5)").removeClass("hideExtraJournalItems") if ($(".hideExtraJournalItems").length == 0) { $("#ShowMore").hide(); } }); Most Recently Cited Articles Basal Abelisaurid and Carcharodontosaurid Theropods from the Lower Cretaceous Elrhaz Formation of Niger Paul C. Sereno, et al. (2008) New Finds of Skeletal Fossils in the Terminal Neoproterozoic of the Siberian Platform and Spain Andrey Yu. Zhuravlev, et a