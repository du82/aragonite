 var data = { 'password': document.getElementById(this._passwordId).value } $.ajax({ type: "POST", contentType: "application/json", dataType: "json", data: JSON.stringify(data), url: "/account/CalculatePasswordStrength", }).success(this.CheckPasswordStrengthResults.bind(this)); } }; if (bindToControl != null && bindToControl == true) { document.getElementById(this._passwordId).addEventListener('keyup', function () { this.CheckPasswordStrength(this._passwordId).bind(this) }); } } 2. Professional Information Professional Information Job Title* Organization* Department Street Address City Zip/Postal Code State Country* Business Phone Indicate your role within the organization* Select College Professor/Educator Department Head Government Agency Employee Librarian Marketing Other Press/Media Purchasing Researcher - Field Researcher - Lab Researcher - Non-Academic Researcher - Technician Sales Student Please specify: Demographic Information Gender Identity Female Male Prefer Not To Say Prefer To Self Describe: 3. Email Preferences BioOne Complete research highlights - including free Top & Trending article collections and monthly BioOne Vista collections.* Yes No BioOne News: A quarterly newsletter and occasional announcements.* Yes No I have read and agree to BioOne's Terms of Use and Privacy Policy var accountDetailValidation; var addressValidation; $(document).ready(function () { accountDetailValidation = new AccountDetailValidation( "FirstName", "LastName", "AccountEmail", "NewPassword", "ConfirmNewPassword", "", // currentPasswordId "", // streetId "", // cityId "Country", // countryId "", // stateProvinceId "", // postalCodeId "Organization", // organizationId "RoleWithinTheOrganization", // roleWithinTheOrganizationId ); addressValidation = new AddressValidation( 'AddressType', 'Prefix', 'Firstname', 'Lastname', 'BillToEmail', 'ConfirmEmail', 'Title', 'Organization', 'Department', 'Country', 'PostalCode', 'StreetAddress', 'City', 'State', 'Phone', 'BillingAddress', '', //form_button_id? 'ErrorMessage', 'AddressStatus', ' ', 'United States', '', true ); }); function ValidateField(obj, errMsgInvalid, errMsgRequired, useName) { var id = obj.id; if (useName == true) { id = obj.Name; } } $('#ShowPassword').change(function () { var type = $('#NewPassword').attr('type') === 'password' ? 'text' : 'password' $('#NewPassword').attr('type', type) }); function handleJobFunctionChange(selectElement, focusOnOtherTextBox) { const otherJobFunctionContainer = document.getElementById('OtherJobFunctionContainer'); const otherJobFunctionInput = document.getElementById('OtherJobFunction'); const selectedText = selectElement.options[selectElement.selectedIndex].text.toLowerCase(); const errorOtherJobFunction = document.getElementById('ErrorOtherJobFunction'); // Check if the selected option contains "other" (case-insensitive) if (selectedText.includes("other")) { // Show the text box if the option text contains "Other" otherJobFunctionContainer.style.display = "block"; otherJobFunctionInput.required = true; // Focus on the input field immediately if (focusOnOtherTextBox) { otherJobFunctionInput.focus(); } } else { // Hide the text box if it does not otherJobFunctionContainer.style.display = "none"; otherJobFunctionInput.value = ""; otherJobFunctionInput.required = false; // Clear the error message content if the "Other" input is hidden if (errorOtherJobFunction) { errorOtherJobFunction.innerHTML = ''; // Clear the error message content } } }'''
