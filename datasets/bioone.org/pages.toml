description = "Recently published reserch from peer-reviewed scientific journals available in BioOne Complete, including American Malacological Bulletin, Ardea, Canadian Journal of Animal Science, Journal of Herpetology, Journal of the Kansas Entomological Society, Odonatologica, Revue suisse de Zoologie, and more."
full_description = "Top & Trending Research January 2025 We’re committed to expanding access to critical research that helps us better understand and protect the natural world. Our curated collection of top-read, peer-reviewed articles spans diverse subjects and species within biological, ecological, and environmental sciences. Whether you're passionate about biodiversity or global ecosystems, these recent discoveries are designed to inspire and fuel your curiosity. We are proud to spotlight content from some of BioOne’s publishing partners including American Malacological Bulletin, Ardea, Canadian Journal of Animal Science, Journal of Herpetology, Journal of the Kansas Entomological Society, Mammal Study, Odonatologica, and more. Explore all articles in our January 2025 edition of Top & Trending Research for free until March 31, 2025 , with thanks to BioOne Complete’s participating publishers. Unlock this collection by logging in to your free BioOne Digital Library account. New to our platform? Create a free account by clicking the “create an account” link in the sign in area. Browse by subject area: Agriculture & Agronomy Ecology Environmental SciencesGeology & Paleontology Ornithology Veterinary Sciences Biodiversity ConservationEntomology Evolutionary Biology Marine & Freshwater Biology Plant SciencesZoology Join our email list to get Top & Trending Research in your inbox Recommend BioOne Complete to your librarian Learn how libraries can subscribe to BioOne Complete, or request a quote for your institution AGRICULTURE & AGRONOMY AIR, SOIL AND WATER RESEARCH Determination of Evapotranspiration and Crop Coefficient for Tomato by Using Non-Weighing Lysimeter in Semiarid Region JOURNAL OF THE KANSAS ENTOMOLOGICAL SOCIETY Comparative efficacy and optimal positioning of traps and lures for monitoring of onion maggot Delia antiqua (Diptera: Anthomyiidae) WEED TECHNOLOGY Khakiweed ( Alternanthera pungens) control with contact and residual herbicides Back to top BIODIVERSITY CONSERVATION AFRICAN JOURNAL OF WILDLIFE RESEARCH Determining the Effectiveness and Usefulness of Three Community-Led Carnivore Survey Types to Wildlife Management in the Nyae Nyae Conservancy, Namibia AMERICAN MALACOLOGICAL BULLETIN Better Population Monitoring and Understanding of Dynamic Lags Could Aid Freshwater Mussel Conservation WATERBIRDS Unveiling 25 Years of Aerial Surveys: Contrasting Trends in Great Blue Heron ( Ardea herodias) Nest and Heronry Abundance in Quebec Back to top ECOLOGY NATURAL AREAS JOURNAL Skunk Cabbage ( Symplocarpus foetidus) Coverage Reduction in a Wetland that is Habitat for the Bog Turtle ( Glyptemys muhlenbergii) ODONATOLOGICA Early effects of forest diseases on the Odonata assemblage of a mountain stream in the southern Iberian Peninsula URSUS Denning ecology of an at-risk American black bear population in a unique habitat on the Bruce Peninsula, Ontario, Canada Back to top ENTOMOLOGY ANNALES ZOOLOGICI 3D Morphometrics of Lucanus cervus cervus (Linnaeus, 1758) (Coleoptera: Lucanidae) THE JOURNAL OF ARACHNOLOGY Diversity of spider families parasitized by fungal pathogens: a global review THE PAN-PACIFIC ENTOMOLOGIST First report of Leucopina bivittata (Malloch, 1940) (Diptera: Chamaemyiidae) feeding on the vine mealybug, Planococcus ficus (Signoret, 1875) (Hemiptera: Pseudococcidae), and its first report from Baja California Norte, Mexico Back to top ENVIRONMENTAL SCIENCES AQUATIC ECOSYSTEM HEALTH AND MANAGEMENT A perspective on successful implementation of ecosystem-based approaches to management and conservation in the Laurentian Great Lakes MOUNTAIN RESEARCH AND DEVELOPMENT ROSA: An Andean Network of Social–Ecological Observatories THE JOURNAL OF RAPTOR RESEARCH Long-Term Changes in Nesting Raptor Communities after Construction of Wind Power Projects Back to top EVOLUTIONARY BIOLOGY ANNALS OF THE MISSOURI BOTANICAL GARDEN A Molecular Temporal Evolutionary Framework of Land Plants and the Age of Angiosperms CANDOLLEA Phylogeny and systematics of Paramollugo (Molluginaceae) JOURNAL OF HERPETOLOGY Habitat Stability Does Not Influence Size Variation in Morphological Features of Lizards Back to top GEOLOGY & PALEONTOLOGY BULLETIN OF THE MUSEUM OF COMPARATIVE ZOOLOGY Reconstructions of Hindlimb Musculature in Extinct Pre-Therian Synapsids JOURNAL OF VERTEBRATE PALEONTOLOGY A Preliminary Assessment of the Diversity of Songbirds (Aves, Passeriformes) from the Miocene St. Bathans Fauna, New Zealand PALAEODIVERSITY The ammonite biohorizons of the Lambertiknollen Bed of SW Germany as a faunistic response to climate change in the latest Callovian (Middle Jurassic) Back to top MARINE & FRESHWATER BIOLOGY THE JOURNAL OF PARASITOLOGY Species of Hemirhamphiculus Bychowsky and Nagibina, 1969 (Monogenoidea: Dactyloyridae) Infecting the Gill Lamellae of Some Beloniform Fishes in Waters of the Gulf of Mexico Off Florida, with Descriptions of Five New Species and Comments on the Dactylogyrid Genera Having Species Infecting Beloniform Fishes NORTHEASTERN NATURALIST A New Record of Atlantic Bluefin Tuna ( Thunnus thynnus) Consuming a Seabird in the Northwest Atlantic Ocean PROCEEDINGS OF THE ACADEMY OF NATURAL SCIENCES OF PHILADELPHIA Microsternarchus schonmanni, a new species of weakly electric fish (Gymnotiformes: Hypopomidae, Microsternarchini) from the Mamoré-Guaporé River Basin, Brazil Back to top ORNITHOLOGY ARDEA Learning and Social Influence on Bird Migration BULLETIN OF THE BRITISH ORNITHOLOGISTS’ CLUB Comments on the species limits of certain North American birds, part 1 THE WILSON JOURNAL OF ORNITHOLOGY Agonistic tool use? A Northern Cardinal ( Cardinalis cardinalis) uses pebbles to strike its reflection Back to top PLANT SCIENCES CACTUS AND SUCCULENT JOURNAL Reassessment of Agave horrida Lemaire Ex Jacobi Subsp. Perotensis Ullrich and a New Agave Species (Agavaceae), from West-Central Oaxaca, Mexico. SYSTEMATIC BOTANY A New Species of Heliconia from Colombia: A Proposal Based on Different Characters WILLDENOWIA A subgeneric classification of Fagus ( Fagaceae) and revised taxonomy of western Eurasian beeches Back to top VETERINARY SCIENCES CANADIAN JOURNAL OF ANIMAL SCIENCE A review of foot-related lameness in feedlot cattle JOURNAL OF VECTOR ECOLOGY Murine typhus: a re-emerging rickettsial zoonotic disease JOURNAL OF WILDLIFE DISEASES Little Brown Bats ( Myotis lucifugus) Are Resistant to SARS-Cov-2 Infection Back to top ZOOLOGY MAMMAL STUDY Diets of Rodents Revealed through DNA Metabarcoding REVUE SUISSE DE ZOOLOGIE Three new cliff racer species from the Sultanate of Oman (Reptilia: Squamata: Colubrinae) and zoogeographic traits of its herpetofauna WILDLIFE RESEARCH Bird and mammal roadkill patterns and associated factors on a tropical mountain area: the Interamerican Highway, Cerro de la Muerte, Costa Rica Back to top View the Previous Collection Explore the BioOne Complete Article Collection Archive For More BioOne Complete Content: Sign up to get BioOne Vista, Top & Trending Research and other new article collections sent to your inbox. Get Content Alerts with your free BioOne Digital Library account for notifications when new issues or content matching your search criteria is published."
