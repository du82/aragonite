["https://bioone.org/subscribe/why-subscribe"]
title = "Subscribe to BioOne Digital Library Content"
description = "Subscribe and access academic publications in the biosciences for your library and provide critical research in the biosciences to scientists and researchers."
full_description = 'Subscribe to BioOne Digital Library Content Discover research from BioOne Complete and BioOne eBooks, featuring 200+ full-text journals and 360+ eBook titles from our publishing partners. HOW TO SUBSCRIBE & ACCESS BIOONE COMPLETE 2025 STATS AND FACTS LIST OF SUBSCRIBERS DEVELOPING WORLD PROGRAMS BioOne Complete 2025: Critical Bioscience Content for Every Collection 219 Titles 157 Publishers 225K+ Articles Years Covered: 1965-Present 60% of subscribed titles are available in xml exclusively in BioOne Complete 94% Lower than the average cost of a commercial journal in biology New title for 2025: Invertebrate Biology from the American Microscopical Society v. 119 (2000) – present Contact Us Request your quote and add the BioOne Complete Archive to your library. Email: sales@bioone.orgPhone: +1 202-296-1605 Find your account manager Core Subject Coverage Agriculture & Agronomy Biodiversity Conservation Ecology Entomology Environmental Sciences Evolutionary Biology Geology & Paleontology Marine & Freshwater Biology Ornithology Plant Sciences Veterinary Sciences Zoology Benefits for Library Partners Affordable: Tiered pricing and discounts via 40+ consortia. Efficient: Access a critical mass of content with a single subscription. Support for strategic research: Trusted content on the impacts of climate change on global ecosystems; research relevant to many of the United Nations’ SDGs. Flexible: Anytime subscription starts plus a new one-time purchase option. Mission-aligned: Over $73 million in subscription funds have been returned to BioOne publishing partners and re-invested in sustainable scholarly communications. In addition, 37 open access titles are available alongside the subscribed collection. Valuable Features and Tools Post-cancellation access provided at no cost for subscribed content Remote access to support on and off-campus users Enhanced accessibility with translation tools Integrated discovery via MARC records and 15+ indexing and discovery partners Seamless reference tools compatible with EndNote, RefWorks and more Usage analytics via COUNTER 5-compliant statistics and SUSHI harvesting For More Information For more detail on both institutional options, click on the "How to Subscribe" tab or see our BioOne Digital Library for Librarians flyer. Complete title lists for both institutional options are also available. From Our Community “BioOne Complete is a great research tool for our biology program! It offers amazing scientific focused content, which is very useful for the life science courses and professional research by our students and faculty.” Aida Almanza Arts & Sciences Librarian Texas A&M University-San Antonio "From the consortial perspective, working with BioOne has been amazing. Our sales manager, Chelsea, is responsive, transparent, and a joy to work with. BioOne makes it clear that their top priority is to offer the fairest pricing that they can provide to promote the advancement of scholarship and science. Libraries can be assured that they are working with a vendor with their best interests at heart." Ann KasteElectronic Resources Librarian Cooperative Purchasing and Electronic Resource Services (CPERS) Minitex University of Minnesota Libraries “The BioOne Complete Archive was a great option for us. We were able to simplify our holdings and fill in gaps left in our collection by changing subscription models, and we find that we get good use of the BioOne backfile.” Danica LewisCollections & Research Librarian for Life Sciences North Carolina State University Libraries "I would recommend BioOne Complete to any institution who, like us, is looking for a cost-effective means of accessing journals that meet an important niche requirement." – Roger Pawson, Head of E-Resource Management Case Study for Agriculture and Agri-Food Canada "Based on the academic value, relevant subjects, and acceptable cost, we had to have this resource." – Dong Yue, Librarian Case Study for the Chinese Academy of Agricultural Sciences Library "BioOne Complete includes journals from many smaller publishers and societies, which we would otherwise struggle to get access to. It would also be just too messy to acquire these journals individually.” – Lee-Yen Han, Liaison Librarian, Biological and Environmental Sciences and Engineering (BESE) Division Case Study for King Abdullah University of Science and Technology “With BioOne Complete there have been no concerns with the cost per download and even with the addition of new titles, the price isn’t impacted.” — Amy Castillo, Manager, Electronic Resources and Scholarly Communication, Dick Smith Library Case Study for Tarleton State University "BioOne Complete offers the ability to acquire quality titles which would otherwise be difficult to get. [It] provides a cost-effective way to subscribe to bioscience titles and being well below the average inter-library loan cost, is very positive. If universities are looking for biology packages, then yes, I would recommend BioOne Complete.” – George Meerburg, Bioscience Information Specialist Case Study for University of Amsterdam “Prior to acquiring BioOne Complete, we had some difficulties acquiring some specific journals as they were expensive. BioOne Complete enabled us to consolidate our holdings, providing access to many unique titles which are part of such a great collection. This also meant cost savings for the university.” — David Frank, Deputy Head, University Library Case Study for University of Veterinary Medicine, Vienna'
