full_description = "Browse the entire BioOne Digital Library Discover research from BioOne Complete and BioOne eBooks, featuring 200+ full-text journals and 360+ eBook titles from our publishing partners. Browse by Collection: All Titles Publishers Subjects A B C E F G H I J L M N O P R S T U W Z Thomas Say Memoirs Publisher: Entomological Society of America Most Recent Book | List of Books Thomas Say Monographs Publisher: Entomological Society of America Most Recent Book | List of Books Thomas Say Proceedings Publisher: Entomological Society of America Most Recent Book | List of Books Transactions of the American Entomological Society Publisher: The American Entomological Society Transactions of the American Entomological Society, published since 1867, contains work on all aspects of the systematics and taxonomy of insects, including taxonomic revisions and phylogenetics. Current Issue | All Issues | Issues In Progress Transactions of the Kansas Academy of Science Publisher: Kansas Academy of Science Transactions of the Kansas Academy of Science publishes multidisciplinary work on the biological, cultural, and physical sciences, math and computer science, history and philosophy of science, and science education. Current Issue | All Issues Tree-Ring Research Publisher: Tree-Ring Society Tree Ring Research, published since 1934, contains work on the growth rings of trees and the applications of tree-ring research in a wide variety of fields, including archaeology, geology, and ecology. Current Issue | All Issues Tropical Conservation Science Publisher: SAGE Publishing Tropical Conservation Science focuses on the field of conservation of tropical forests and other tropical ecosystems. The journal serves as a forum for perspectives and analyses of contrasting concepts and data on tropical ecosystem conservation. Tropical Conservation Science is available in BioOne Complete through the 2024 volume. Current Issue | All Issues Turtle and Tortoise Newsletter Publisher: Chelonian Research Foundation and Turtle Conservancy Turtle and Tortoise Newsletter, published by the Chelonian Research Foundation until January 2011, served as a forum for the timely exchange of information on turtle and tortoise conservation and biology issues. Current Issue | All Issues"
