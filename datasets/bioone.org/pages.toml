full_description = '''Earth Day 2024 Planet vs. Plastics Focused on promoting sustainable practices and raising awareness, the Earth Day 2024 theme "Planet vs. Plastics," underscores the urgent need to address the escalating environmental crisis caused by plastic pollution. This collection of peer-reviewed scientific research explores the impacts of plastic pollution on environments, biodiversity, and the potential to impact human health. This collection highlights the impact of plastic pollution with peer-reviewed scientific research from BioOne Complete titles including The American Biology Teacher, BIOS, Caribbean Journal of Science, Journal of Zoo and Wildlife Medicine, Western North American Naturalist, and more. All articles in this Earth Day 2024 collection are free to read through June 30, 2024, with thanks to BioOne Complete’s participating publishers. Log in to your free BioOne Digital Library account to unlock this collection. If you are new to our platform, we invite you to create a free account by clicking the “create an account” link in the sign in area. Join our email list to get BioOne VISTA in your inbox. Recommend BioOne Complete to your librarian. Learn how libraries can subscribe, or request a quote for your institution. The First Record of Ingestion and Inhalation of Micro- and Mesoplastics by Neotropical Bats from the Brazilian Amazon Acta Chiropterologica Identification, Quantification, and Evaluation of Microplastics Removal Efficiency in a Water Treatment Plant (A Case Study in Iran Air, Soil and Water Research Plastic Pollution: Learning Activities from Production to Disposal – from Where do Plastics Come & Where do they Go? The American Biology Teacher Polystyrene micro- and nanoplastics cause placental dysfunction in miceBiology of Reproduction Impacts of bioplastics and microplastics on the ecology of green-infrastructure systems: An aquaponics approachBIOS Micro and Macroplastics Analysis in the Digestive Tract of a Sea Cucumber (Holothuriidae, Holothuria floridana) of the Placencia Lagoon, Belize Caribbean Journal of Science Characterizing Fragmentation of Polystyrene Foam Debris by Isopods Oniscus asellus (Isopoda: Oniscidae) and Trachelipus rathkii (Isopoda: Trachelipodidae) Environmental Entomology Assessment of Community's Perception Toward Single-Use Plastic Shopping Bags and Use of Alternative Bags in Jimma Town, Ethiopia Environmental Health Insights A first report of plastic use for nesting materials in an apoid wasp (Hymenoptera: Sphecidae: Isodontia elegans Integrative Systematics: Stuttgart Contributions to Natural History Characterization of Tidally Accumulated Plastic Waste and the Effect on Mangrove Ecosystems at Eagle Island, Niger Delta, NigeriaJournal of Coastal Research Microplastic ingestion perturbs the microbiome of Aedes albopictus (Diptera: Culicidae) and Aedes aegyptiJournal of Medical Entomology Garbage Dump Use, Mortality, and Microplastic Exposure of Raptors in Ushuaia, Tierra Del Fuego Province, Southern ArgentinaThe Journal of Raptor Research Phthalate Esters (Plasticizers) in the Uropygial Gland and Their Relationship to Plastics Ingestion in Seabirds Along the Coast of Espírito Santo, Eastern BrazilJournal of Zoo and Wildlife Medicine Demographic and Trophic Analysis of Adult Grass Shrimp ( Palaemonetes pugio) from Living Shoreline and Natural Tidal Marshes in the Chesapeake Bay Northeastern Naturalist Ejection, ingestion and fragmentation of mesoplastic fibres to microplastics by Anax imperator larvae (Odonata: Aeshnidae) Odonatologica Ingestion of Plastics in a Wild Population of the Pacific Fat Sleeper ( Dormitator latifrons) Pacific Science Ecological Aspects of the Pirate Perch ( Aphredoderus Sayanus) in East Texas Streams Southeastern Naturalist Assessment of Microplastics in the Great Plains: Comparing Densities in Water and Benthic Sediment Across KansasTransactions of the Kansas Academy of Science Anthropogenic waste ingestion of Southern Beaufort Sea polar bears, Alaska (2010–2020)Ursus Marine Debris Trends: 30 Years of Change on Ventura County and Channel Island BeachesWestern North American Naturalist Explore More from BioOne Complete: Browse more research collections in the Article Collection Archive. Sign up to get BioOne VISTA, Top & Trending Research and other new article collections sent to your inbox. Get Content Alerts with your free BioOne Digital Library account for notifications when new issues or content matching your search criteria is published.'''
