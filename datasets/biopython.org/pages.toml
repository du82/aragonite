title = "Google Summer of Code · Biopython"
full_description = "Edit this page on GitHub Google Summer of Code Introduction For the past several years, Biopython-related GSoC projects have been successfully run under the mentorship of the Open Bioinformatics Foundation (OBF) and the National Evolutionary Synthesis Center (NESCent). Please read those organizations’ GSoC pages and the main Google Summer of Code page for more details about the program. Current project proposals See the Open Bioinformatics Foundation (OBF) GSoC wiki page and OBF GSoC page as our usual mentoring organization. Any project ideas for Biopython can be posted at http://obf.github.io/GSoC/ideas/ (update https://github.com/OBF/GSoC/blob/gh-pages/00_ideas.md via a GitHub pull request). We encourage potential students and mentors to join the BioPython mailing lists and actively participate in developing these project ideas, either by submitting their own ideas or contributing to improving existing ones. Past Mentors Usually, each BioPython proposal has one or more mentors assigned to it. Nevertheless, we encourage potential students/mentors to contact the mailing lists with their own ideas for proposals. There is therefore not a set list of ‘available’ mentors, since it highly depends on which projects are proposed every year. Past mentors include: James Casbon Brad Chapman Peter Cock Thomas Hamelryck Reece Hart João Rodrigues Eric Talevich Past Accepted Projects 2014 (OBF) Indexing & Lazy-loading Sequence Parsers Student Evan Parker (blog) Rationale Bio.SeqIO’s indexing offers parsing on demand access to any sequence in a large file (or collection of files on disk) as a SeqRecord object. This works well when you have many small to medium sized sequences/genomes. However, this is not ideal for large genomes or chromosomes where only a sub-region may be needed. A lazy-loading parser would delay reading the record until requested. For example, if region record[3000:4000] is requested, then only those 1000 bases need to be loaded from disk into memory, plus any features in that region. This is how Biopython’s BioSQL interface works. Tools like tabix and samtools have demonstrated efficient co-ordinate indexing which could be useful here. Aside from being used via an index for random access, lazy-loading parsers could be used when iterating over a file as well. This can potentially offer speed ups for tasks where only a fraction of the data is used. For example, if calculating the GC content of a collection of genomes from GenBank, using Bio.SeqIO.parse(…) would currently needlessly load and parse all the annotation and features. A lazy-parser would only parse the sequence information. Approach & Goals Useful features include: Internal indexing of multiple file formats, including FASTA and richly annotated sequence formats like GenBank/EMBL and GTF/GFF/GFF3. Full compatibility with existing SeqIO parsers which load everything into memory as a `SeqRecord` object. Difficulty and needed skills Hard. Familiarity with the Biopython’s existing sequence parsing essential. Understanding of indexing large files will be vital. Possible Mentors Wibowo Arindrarto, Peter Cock, others welcome 2013 (NESCent) This year the Open Bioinformatics Foundation was not accepted on the very competitive GSoC programme. Biopython instead participated under NEScent. Codon alignment and analysis Student Zheng Ruan (blog) Rationale A codon alignment is an alignment of nucleotide sequences in which the trinucleotides correspond directly to amino acids in the translated protein product. This carries important information which can be used for several analysis, notably analysis of selection pressures. This project extends Biopython to support this data type and these analyses. Approach & Goals Useful features include: Conversion of a set of unaligned nucleic acid sequences and a corresponding protein sequence alignment to a codon alignment. Calculation of selection pressure from the ratio of nonsynonomous to synonomous site replacements, and related functions. Model selection. Possible extension of AlignIO and the MultipleSeqAlignment class to take full advantage of codon alignments, including validation (testing for frame shifts, etc.) Difficulty and needed skills Medium, depending on ambition. Familiarity with the Biopython’s existing alignment classes and functions, or equivalents in BioPerl, BioJava or BioRuby (e.g.), will be helpful. Understanding of the practical uses of codon alignments, or at least a basic understanding of molecular biology, is important. Some basic math is involved, essentially reading a few equations and converting them to code. One useful book to have on hand is Computational Molecular Evolution by Ziheng Yang. Mentors Eric Talevich, Peter Cock Bio.Phylo: filling in the gaps Student Yanbo Ye (blog) Rationale While the Phylo module in Biopython supports I/O and basic tree operations, there are some important components that remain to be implemented to better support phylogenetic workflows. Approach & Goals This “idea” is intentially left open-ended – some potentially useful features are: A “Phylo.consensus” module with functions for the consensus of multiple trees. E.g.: Strict consensus, as Bio.Nexus already implements; perhaps other methods like Adams consensus. A function to calculate bootstrap support for branches given a target or “master” tree and a series of bootstrap replicate trees (usually read incrementally from a Newick file). Functions for comparison of two or more trees. Simple algorithms for tree inference, i.e. neighbor-joining and parsimony tree estimation. For small alignments (and perhaps medium-sized ones with PyPy), it would be nice to run these without an external program, e.g. to construct a guide tree for another algorithm or quickly view a phylogenetic clustering of sequences. Tree visualizations: A proper draw_unrooted function to perform radial layout, with an optional “iterations” argument to use Felsenstein’s Equal Daylight algorithm. Circular radial diagrams are also popular these days. Any new function should support the same arguments as the existing Phylo.draw. Difficulty and needed skills Medium-to-advanced programming skill in Python – it’s important for these implementations to be reasonably efficient, though we don’t aim to compete with the fastest stand-alone implementations of these algorithms. Knowledge of phylogenetic methods is critical; for reference, you might like to have a copy of Joe Felsenstein’s Inferring Phylogenies. Tree visualizations are done with matplotlib. Mentors Mark Holder, Jeet Sukumaran, Eric Talevich 2012 (OBF) SearchIO Student Wibowo Arindrarto (blog) Rationale Biopython has general APIs for parsing and writing assorted sequence file formats (SeqIO), multiple sequence alignments (AlignIO), phylogenetic trees (Phylo) and motifs (Bio.Motif). An obvious omission is something equivalent to BioPerl’s SearchIO. The goal of this proposal is to develop an easy-to-use Python interface in the same style as SeqIO, AlignIO, etc but for pairwise search results. This would aim to cover EMBOSS muscle & water, BLAST XML, BLAST tabular, HMMER, Bill Pearson’s FASTA alignments, and so on. Approach Much of the low level parsing code to handle these file formats already exists in Biopython, and much as the SeqIO and AlignIO modules are linked and share code, similar links apply to the proposed SearchIO module when using pairwise alignment file formats. However, SearchIO will also support pairwise search results where the pairwise sequence alignment itself is not available (e.g. the default BLAST tabular output). A crucial aspect of this work will be to design a pairwise-search-result object heirachy that reflects this, probably with a subclass inheriting from both the pairwise-search-result and the existing MultipleSequenceAlignment object. Beyond the initial challenge of an iterator based parsing and writing framework, random access akin to the Bio.SeqIO.index and index_db functionality would be most desirable for working with large datasets. Challenges The project will cover a range of important file formats from major Bioinformatics tools, thus will require familiarity with running these tools, and understanding their output and its meaning. Inter-converting file formats is part of this. Difficulty and needed skills Medium/Hard depending on how many objectives are attempted. The student needs to be fluent in Python and have knowledge of the BioPython codebase. Experience with all of the command line tools listed would be clear advantages, as would first hand experience using BioPerl’s SearchIO. You will also need to know or learn the git version control system. Mentors Peter Cock Representation and manipulation of genomic variants Student Lenna Peterson (blog) Rationale Computational analysis of genomic variation requires the ability to reliably communicate and manipulate variants. The goal of this project is to provide facilities within BioPython to represent sequence variation objects, convert them to and from common human and file representations, and provide common manipulations on them. Approach & Goals Object representation identify variation types to be represented (SNV, CNV, repeats, inversions, etc) develop internal machine representation for variation types ensure coverage of essential standards, including HGVS, GFF, VCF External representations write parser and generators between objects and external string and file formats Manipulations canonicalize variations with more than one valid representation (e.g., ins versus dup and left shifting repeats). develop coordinate mapping between genomic, cDNA, and protein sequences (HGVS) Other release code to appropriate community efforts and write short manuscript implement web service for HGVS conversion Difficulty and needed skills Easy-to-Medium depending on how many objectives are attempted. The student will need have skills in most or all of: basic molecular biology (genomes, transcripts, proteins), genomic variation, Python, BioPython, Perl, BioPerl, NCBI Eutilities and/or Ensembl API. Experience with computer grammars is highly desirable. You will also need to know or learn the git version control system. Mentors Reece Hart Brad Chapman James Casbon 2011 (OBF) Biomolecular Interface Analysis Student Mikael Trellet Rationale Analysis of protein-protein complexes interfaces at a residue level yields significant information on the overall binding process. Such information can be broadly used for example in binding affinity studies, interface design, and enzymology. To tap into it, there is a need for tools that systematically and automatically analyze protein structures, or that provide means to this end. Protorop (http://www.bioinformatics.sussex.ac.uk/protorp/) is an example of such a tool and the elevated number of citations the server has had since its publication acknowledge its importance. However, being a webserver, Protorop is not suited for large-scale analysis and it leaves the community dependent on its maintainers to keep the service available. On the other hand, Biopython’s structural biology module, Bio.PDB, provides the ideal parsing machinery and programmatic structures for the development of an offline, open-source library for interface analysis. Such a library could be easily used in large-scale analysis of protein-protein interfaces, for example in the CAPRI experiment evaluation or in benchmark statistics. It would be also reasonable, if time permits, to extend this module to deal with protein-DNA or protein-RNA complexes, as Biopython supports nucleic acids already. Approach & Goals Add the new module backbone in current Bio.PDB code base Evaluate possible code reuse and call it into the new module Try simple calculations to be sure that there is stability between the different modules (parsing for example) and functions Define a stable benchmark Select few PDB files among interface size and proteins size would be different Extend IUPAC.Data module with residue information Deduce residues weight from Atom instead of direct dictionary storage Polar/charge character (dictionary or influenced by pH) Hydrophobicity scale(s) Implement Extended Residue class as a subclass of Residue Implement Interface object and InterfaceAnalysis module Develop functions for interface analysis Calculation of interface polar character statistics (% of polar residues, apolar, etc) Calculation of BSA calling MSMS or HSA Calculation of SS element statistics in the interface through DSSP Unit tests and use of results as input for further calculations by other tools and scripts Develop functions for Interface comparison Code organization and final testing Difficulty and needed skills Easy/Medium. Working knowledge of the Bio.PDB module of BioPython. Knowledge of structural biology in general and associated file formats (PDB). Mentors João Rodrigues Eric Talevich A Python bridge for Mocapy++ Student Michele Silva Rationale Discovering the structure of biomolecules is one of the biggest problems in biology. Given an amino acid or base sequence, what is the three dimensional structure? One approach to biomolecular structure prediction is the construction of probabilistic models. A Bayesian network is a probabilistic model composed of a set of variables and their joint probability distribution, represented as a directed acyclic graph. A dynamic Bayesian network is a Bayesian network that represents sequences of variables. These sequences can be time-series or sequences of symbols, such as protein sequences. Directional statistics is concerned mainly with observations which are unit vectors in the plane or in three-dimensional space. The sample space is typically a circle or a sphere. There must be special directional methods which take into account the structure of the sample spaces. The union of graphical models and directional statistics allows the development of probabilistic models of biomolecular structures. Through the use of dynamic Bayesian networks with directional output it becomes possible to construct a joint probability distribution over sequence and structure. Biomolecular structures can be represented in a geometrically natural, continuous space. Mocapy++ is an open source toolkit for inference and learning using dynamic Bayesian networks that provides support for directional statistics. Mocapy++ is excellent for constructing probabilistic models of biomolecular structures; it has been used to develop models of protein and RNA structure in atomic detail. Mocapy++ is used in several high-impact publications, and will form the core of the molecular modeling package Phaistos, which will be released soon. The goal of this project is to develop a highly useful Python interface to Mocapy++, and to integrate that interface with the Biopython project. Through the Bio.PDB module, Biopython provides excellent functionality for data mining biomolecular structure databases. Integrating Mocapy++ and Biopython will allow tra"
year_published = 2025
clearnet = "http://biopython.org/wiki/Google_Summer_of_Code"
