["https://biopython.org/wiki/Download"]
title = "Download · Biopython"
full_description = 'Edit this page on GitHub Download Current Release - 1.85 - 15 Jan 2025 See also What’s new. Files Biopython 1.85 biopython-1.85.tar.gz 19Mb – Source Tarball biopython-1.85.zip 21Mb – Source Zip File Pre-compiled wheel files on PyPI Documentation Installation Instructions All supported versions of Python include the Python package management tool pip, which allows an easy installation from the command line on all platforms. Try: pip install biopython For updating an older version of Biopython try: pip install biopython --upgrade This will remove older versions of Biopython and NumPy before it installs the recent versions. Should you wish to uninstall Biopython: pip uninstall biopython If pip is not already installed you may need to update your Python, but first try: python -m ensurepip If you need to install under a specific version of Python, try something like this: python3.13 -m pip install biopython pypy -m pip install biopython On Windows, by default python and pip are not on the PATH. You can re-install Python and tick this option, or give the full path instead. Try something like this, depending on where your copy of Python is installed: C:\Python39\Scripts\pip install biopython Other packages While we generally recommend using pip to install Biopython using the wheel packages we provide on PyPI (as above), there are also Biopython packages for Conda, Linux, etc. Installation from Source Installation from source requires an appropriate C compiler, for example GCC on Linux, and MSVC on Windows. For macOS, if you want to compile Biopython from source you will need to have installed Apple’s command line tools, which can de done with the terminal command: xcode-select --install This will offer to install Apple’s XCode development suite - you can, but it is not needed and takes a lot of disk space. You can then download and unzip a Biopython source code release, or get our code from GitHub. Then run: python setup.py build python setup.py test python setup.py install or: pip install . If you are still stuck, sign up to the Biopython mailing list and ask for help there. Required Software Python 3 or PyPy (a version supported by the version of Biopython you wish to install), including the Python development header files like python.h (if compiling from source) C compiler (if compiling from source) You need a C compiler supported by setuptools, gcc will work fine on UNIX-like platforms. Try MSVC on Windows. On macOS, you should install Apple’s the compiler tools as described above. NumPy (Numerical Python). Optional Software Some parts of Biopython use the following additional python libraries: ReportLab – used for pdf graphics code psycopg – used for BioSQL with a PostgreSQL database mysql-connector – used for BioSQL with a MySQL database MySQLdb – An alternative MySQL library used by BioSQL In addition Biopython includes wrapper code for calling a number of third party command line tools including: Wise2 – for command line tool dnal NCBI Standalone BLAST – command line tool for running BLAST on your local machine Clustalw – command line tool for building sequence alignments SIMCOAL2 and FDist – command line tools for population genetics EMBOSS – lots of useful command line tools. Old Releases Recent releases of Biopython require NumPy (and not Numeric). Version 1.76 is the last release to support Python 2.7 and 3.5, all later releases require Python 3: biopython-1.84.tar.gz 25Mb – Source Tarball (28 June 2024) biopython-1.84.zip 27Mb – Source Zip File Pre-compiled wheel files on PyPI Documentation biopython-1.83.tar.gz 19Mb – Source Tarball (10 January 2024) biopython-1.83.zip 20Mb – Source Zip File Pre-compiled wheel files on PyPI Tutorial-1.83.pdf – Documentation biopython-1.82.tar.gz 19Mb – Source Tarball (22 December 2023) biopython-1.82.zip 20Mb – Source Zip File Pre-compiled wheel files on PyPI Tutorial-1.82.pdf – Documentation biopython-1.81.tar.gz 17Mb – Source Tarball (12 February 2023) biopython-1.