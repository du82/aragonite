["https://biopython.org"]
title = "Biopython · Biopython"
full_description = "Edit this page on GitHub Biopython See also our News feed. Introduction Biopython is a set of freely available tools for biological computation written in Python by an international team of developers. It is a distributed collaborative effort to develop Python libraries and applications which address the needs of current and future work in bioinformatics. The source code is made available under the Biopython License, which is extremely liberal and compatible with almost every license in the world. We are a member project of the Open Bioinformatics Foundation (OBF), who take care of our domain name and hosting for our mailing list etc. The OBF used to host our development repository, issue tracker and website but these are now on GitHub. This page will help you download and install Biopython, and start using the libraries and tools. Get Started Get help Contribute Download Biopython Tutorial & API (PDF) What’s being worked on Main README Documentation on this wiki Developing on Github Cookbook (working examples) Google Summer of Code Discuss and ask questions Report bugs The latest release is Biopython 1.85, released on 15 Jan 2025."
