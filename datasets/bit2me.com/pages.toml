full_description = "A cryptocurrency is a digital currency whose operation is regulated and controlled by a software or program running on thousands of computers or nodes that form a decentralized network. These nodes work in such a way that they verify every operation carried out by the users of this currency. To achieve this, the software uses a series of advanced mathematical functions known as cryptography. Through the use of cryptography, things such as the ownership of coins, their use (sending and receiving payments), as well as their issuance and accounting are kept under strict and secure control.The idea of cryptocurrencies is that users mobilize these digital coins within this network of nodes, using cryptography. In this way every movement is recorded in a distributed ledger that is stored within each node, immutably and securely. The current number of cryptocurrencies on the market is immense. Since the arrival of this technology to the world with Bitcoin, several cryptocurrencies have appeared willing to improve what Bitcoin achieved. As a result, there are currently more than 8,200 different cryptocurrencies registered. Some of these cryptocurrencies have a large presence in the world (e.g., Bitcoin or Ethereum), while others have passed as experiments or simply haven't caught people's attention. A cryptocurrency wallet is a software or physical electronic device that you can use to receive, send, or store cryptocurrencies securely. Just as you have a wallet for physical money, or have a bank account, you can do the same with cryptocurrencies. A cryptocurrency wallet allows you to manage your cryptocurrencies by giving you the opportunity to send payments to other people (using their address or cryptocurrency account), receive payments in cryptocurrencies (by generating your addresses to receive them) or simply store them if you wish. The creation of cryptocurrencies responds to the need to evolve the way we see and use money. All this while avoiding and correcting the vices into which the money we know today has fallen. In fact, the big push for the creation of Bitcoin (the first cryptocurrency) was the Great Recession of 2008, when the world was shown that the centralized model of money was against our well-being, our freedom and economic security. To fight against this centralized model, Bitcoin and the cryptocurrencies were born, creating a currency that is not controlled by any government or any other person, that can circulate globally because it has no borders, that is secure, unforgeable, resistant to censorship, and whose value is not diluted by uncontrolled issuance."
