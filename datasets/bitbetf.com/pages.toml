full_description = 'It is important to support Bitcoin Core Development in a long-term sustainable way. Bitwise’s decade-long pledge is a win-win-win with Bitwise profits leading to developer funding leading to improvements to the open-source software underpinning the industry. It is great to see large institutions supporting the open-source contributors who make this ecosystem possible. Bitwise is leading by example for all Bitcoin ETF issuers going forward. Bitcoin is a critical piece of freedom technology serving financially oppressed people around the world today. We started the Bitcoin Development Fund to support the developers who make this all possible, and we’re delighted that Bitwise is committed to supporting this important cause. Bitcoin was launched 15 years ago without a fundraise and has always been maintained by a dedicated community of open-source developers. These developers need our continued support to dedicate their working hours towards the essential task of securing and improving Bitcoin. At Bitwise, we are enthusiastic about the potential for BITB to serve as a consistent source of funding for these unsung heroes. Bitwise is a time-tested crypto asset management specialist with offices in San Francisco and New York. We leverage expertise in crypto, technology, regulation, and asset management to serve thousands of RIAs, wealth teams, family offices, and institutional investors across the U.S. Our suite of ETFs includes the first crypto industry equity ETF and the first Bitcoin futures-based ETF with an optimum roll strategy. This material must be preceded or accompanied by a prospectus. Please read the prospectus carefully before investing. To obtain a current prospectus visit BITBetf.com/prospectus. The Bitwise Bitcoin ETF ("BITB" or the "Fund") is not an investment company registered under the Investment Company Act of 1940 (the “1940 Act”) and is not subject to regulation under the Commodity Exchange Act of 1936 (the “CEA”). As a result, sh