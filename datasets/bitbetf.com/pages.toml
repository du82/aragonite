["https://bitbetf.com"]
title = "BITB | Bitwise Bitcoin ETF"
description = "BITB provides low-cost access to bitcoin through a professionally managed ETF."
full_description = "BITB provides low-cost access to bitcoin through a professionally managed fund. Backed by Bitwise’s specialist expertise, deep research, and seven-year track record managing crypto assets for leading institutional investors, the fund invests directly in bitcoin and is easily accessible from a brokerage account. Search “BITB” or talk to your financial advisor. Gain exposure to bitcoin, the world's largest* and oldest crypto asset, through one of the world's leading crypto experts. BITB is not suitable for all investors. An investment in BITB is subject to a high degree of risk, has the potential for significant volatility, and could result in significant or complete loss of investment. BITB is not an investment company registered under the Investment Company Act of 1940 (the “1940 Act”) and is not afforded its protections. Please see additional risks and important information below. Since our founding, Bitwise has helped a wide range of investors access crypto’s opportunities and manage its risks. We manage your investment using systems built for institutions, from custody and trading to regulation and compliance. Bitwise’s team of more than 90 dedicated professionals focuses solely on crypto, as we have from the beginning. In choosing BITB, investors gain exposure not only to bitcoin but a nationwide team of crypto experts with the tools, insights, and specialized experience to help them navigate the space with confidence. Bitcoin is a disruptive technology that aims to fundamentally change how we transact and store value. By investing directly in bitcoin, BITB provides a convenient solution to the complexities of bitcoin ownership. * For a six-month period commencing on the day the Shares are initially listed on the Exchange, the Sponsor has agreed to waive the entire Sponsor Fee on the first $1 billion of Trust assets. If the Trust’s net assets exceed $1 billion, the Sponsor’s Fee charged on assets over $1 billion will be 0.20%. All investors will incur the same Sponsor’s Fee which is the weighted average of those fee rates. After July 11, 2024, the Sponsor’s Fee will be 0.20%."
