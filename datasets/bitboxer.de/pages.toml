title = "Bitboxer - Berlin is Calling: Stand Up and Protest for Change!"
description = """
I am a freelance polyglot developer and love HTML5, testing, TypeScript, Ruby and Elixir. In the last 20 years I  have been in lots of different roles, from Java to Elixir, from backend developer at a 3 people team in an early  phase startup to the CTO of a web agency. Some of my work can be seen on my projects page.  Need help developing your MVP or to add new features into your current app? Need a CTO or a front/backend  developer for hire? Send me an email."""
full_description = "Berlin is Calling: Stand Up and Protest for Change! 16 Jan 2025 Photo by Tobias on Unsplash In a bit over a month, Germany votes for the next government. It looks like conservative, right-leaning parties might win a lot of votes. Let us all try to prevent that. One way to do that is to go out on the street and protest to show others that we fight. That we haven’t given up hope for a better world. Clicking a ‘Sign the petition’-Button is not as important as thousands protesting on the streets. Many demonstrations are scheduled in Berlin. It would be great if you could join one (or more) of them. Here’s a partial list: Wir haben es satt (We are sick of it) When: 18.01.2025, 12:00 Where: Federal Chancellery of Germany By: BUND and several other organizations Details: wir-haben-es-satt.de FLINTA* March When: 19.01.2025, 12:00 Where: Brandenburg Gate By: FLINTA*-Activists and other organizations Details: flintamarch.de Klimastreik (Climate-Strike) When: 14.02.2025, 12:00 Where: Brandenburg Gate By: Fridays For Future Details: fridaysforfuture.de Winter-CSD When: 15.02.2025, 11:55 Where: German Parliament By: CSD e.V. Details: csd-berlin.de Wir stehen zusammen – Lichtermeer gegen den Rechtsruck (We stand together – sea of ​​lights against the shift to the right) When: 25.01.2025, 16:30 Where: Brandenburg Gate By: Campact, Parents against the Right and Fridays for Future among others Details: campact.de A complete list can be found on demokrateam.org."
