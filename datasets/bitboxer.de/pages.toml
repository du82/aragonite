description = """
Mobilität 2.0      
              
                           29 Sep 2013                (de)"""
full_description = "If you know me, you will at least once heard me talk about the fact that my parents are deaf. I am pretty open with it. Because I want to raise awareness about deaf culture. About the awesome thing that is sign language, about the funny nuances nobody outside of the culture knows or has heard of. Berlin hat so einige ungewöhnliche Ruinen, die man sich ansehen kann. Eine davon ist der Teufelsberg. Der Teufelsberg ist eine ehemalige NSA Abhörstation aus dem Kalten Krieg. Nach dem Mauerfall wurde die Anlage noch kurz als Radarstation benutzt und steht nun mehr oder weniger leer. Puh, ganz schön heiß, so ein Sommer. Und was macht man da am besten? Ab an den See. Gerade hier in Berlin mit den vielen Seen drumherum drängt sich das ja schon auf. Und was macht man am See? Genau, etwas lesen. Nur is die Frage: was zum Teufel?! Ich ziehe Ende Juni nach Berlin. Zum Glück habe ich recht schnell eine Wohnung gefunden. Ich habe mir 4 Wohnungen angesehen und eine davon ist es dann geworden. Ziemlich flott, wenn Ihr mich fragt. Scott Pilgrim vs The World. Großartiger Film. Scott verliebt sich in ein Mädchen. Leider hat das ganze einen Haken. Um genau zu sein Sieben. Sieben Ex-Freunde. Und die gilt es zu besiegen, wenn er seine Liebe behalten will. Ich habe diesen Blog in den letzten Wochen leider mal wieder etwas schleifen lassen. Die Wohnungssuche in Berlin hat etwas meiner Zeit gekostet. Aber da das ja jetzt erledigt ist, geht es jetzt mal weiter. I am now using Octopress for my blog. Was it an easy switch? No. Was it worth it? Totally. I love working in Markdown. Getting rid of the hack that was called a Markdown Wordpress plugin made my day."
year_published = 2013
