title = "Bitboxer - Sommerlektüre"
description = """
I am a freelance polyglot developer and love HTML5, testing, TypeScript, Ruby and Elixir. In the last 20 years I  have been in lots of different roles, from Java to Elixir, from backend developer at a 3 people team in an early  phase startup to the CTO of a web agency. Some of my work can be seen on my projects page.  Need help developing your MVP or to add new features into your current app? Need a CTO or a front/backend  developer for hire? Send me an email."""
full_description = "Sommerlektüre 27 Jul 2013 Puh, ganz schön heiß, so ein Sommer. Und was macht man da am besten? Ab an den See. Gerade hier in Berlin mit den vielen Seen drumherum drängt sich das ja schon auf. Und was macht man am See? Genau, etwas lesen. Nur is die Frage: was zum Teufel?! Hier mal zwei Tipps…naja eigentlich drei 🙂 : Saga 1 + 2 Saga. Wenn du Comic-Nerd bist, dann hast du das schon gelesen. Wenn nicht: machen. Epische Sci-Fi/Fantasy. Drei Eisner Awards, Hugo nominiert. Großartig. Worum es darin geht? Liebe, Krieg und den ganzen Rest. So geflasht war ich schon lange nicht mehr von einem Comic. Und jetzt warte ich sehnsüchtig darauf, das es weitergeht. Saga 1 kaufen Saga 2 kaufen Wool - Omnibus Edition Wool ist eine kleine Self-Publishing Erfolgsgeschichte. Der Autor hat das ganze erst als reihe von Kurzgeschichten auf Amazon selber veröffentlicht. Mittlerweile gibt es davon auch ein Buch und die Filmrechte wurden an 20th Century Fox verkauft. Worum geht es? Um eine Gesellschaft, die in einer Post-Apokalyptischen Welt in einem Bunker unter der Erde lebt. Sehr spannend und gut geschrieben. Also wer am See liegt und im Kopf lieber in einem Bunker unter der Erde wäre, der sollte unbedingt zuschlagen 🙂 . Die Omnibus-Edition enthält die ersten 5 Bücher und gibt es als Kindle-Edition für 2,99 Euro. Also ein echter Schnapp. Kaufen"
