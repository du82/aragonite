description = """
I am a freelance polyglot developer and love HTML5, testing, TypeScript, Ruby and Elixir. In the last 20 years I  have been in lots of different roles, from Java to Elixir, from backend developer at a 3 people team in an early  phase startup to the CTO of a web agency. Some of my work can be seen on my projects page.  Need help developing your MVP or to add new features into your current app? Need a CTO or a front/backend  developer for hire? Send me an email."""
full_description = "Mobilität 2.0 29 Sep 2013 So, das war’s. Gestern habe ich mein Auto verkauft. Der Kleine war mein treuer Begleiter seit 2007. In Köln war das Ding eigentlich nur noch ein besserer Einkaufswagen. Ab und an bin ich mit dem Auto dann noch zu meinen Eltern gefahren. Aber wirklich gebraucht hab ich das Auto auch in Köln schon nicht. Hier in Berlin braucht man aber absolut kein Auto. Das Tram/U-Bahn/S-Bahn System ist perfekt ausgebaut. Dazu gibt es noch jede Menge Alternativen die ebenfalls gut funktionieren. Fahrrad fahren ist in Berlin zum Beispiel um einiges angenehmer als in Köln. Und was, wenn man doch noch ein Auto braucht? Zum Glück gibt es in Berlin gleich drei Anbieter, die einem ermöglichen, ein Auto auf Minutenbasis zu leihen. DriveNow von BMW, Car2Go von Mercedes und multicity von Citroën. Alle Anbieter haben eigene Apps, in denen man nach Autos im Umkreis suchen kann. Es gibt zum Glück auch eine App, die alle 3 Anbieter auf einer Karte anzeigt. Daneben gibt es noch Flinkster. Leider arbeitet Flinkster mit festen Verleihstationen, ist aber auch um einiges günstiger als die anderen drei Anbieter. Ich werde mir jetzt für alle drei eine Karte besorgen und dann eigentlich immer ein Auto haben. Für die Fahrt zu meinen Eltern besorge ich mir auch noch eine Bahncard. Und so spare ich jedes Jahr richtig viel Geld. Geld das ich für meine Urlaube ausgeben kann. Hurra :airplane: !"
