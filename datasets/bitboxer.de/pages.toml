["https://bitboxer.de/2024/12/24/home-assistant-smart-heating"]
title = "Bitboxer - Smart Heating with HomeAssistant"
description = """
I am a freelance polyglot developer and love HTML5, testing, TypeScript, Ruby and Elixir. In the last 20 years I  have been in lots of different roles, from Java to Elixir, from backend developer at a 3 people team in an early  phase startup to the CTO of a web agency. Some of my work can be seen on my projects page.  Need help developing your MVP or to add new features into your current app? Need a CTO or a front/backend  developer for hire? Send me an email."""
full_description = "Smart Heating with HomeAssistant 27 Dec 2024 Photo by Kelly Sikkema on Unsplash One of the problems in our apartment was this: A really dumb thermostat. Since we have floor heating, this little thing created tons of problems. Floor heating behaves like a big cargo ship. You cannot quickly move it around. The floor needs time to heat up, and if the desired temperature is reached, you cannot simply shut it down. It will continue to radiate heat to the room. With this dial, a accurate temperature was just not possible. Also we didn’t want to heat the rooms at night and wanted them to cool down. And ideally to warm up just before we wake up. The solution: get rid of this stupid thing and install something smarter. Something that has ZigBee and can be added to Home Assistant. Something like the MOES ZigBee Smart Thermostat. First, I had to get rid of the old thermostat and install the new one. Luckily, this was relatively easy. Pull out the dial and you will find a little screw. After that, you will find that the guts of the device is rather empty. Get rid of it. Luckily, they left some nice schematics for us. Install the new thermostat following the schematics printed on it. Success. The next step is to add it to your Home Assistant and add some rules. Since this is an unsupported ZigBee device, you will need to add a custom quirk to Home Assistant. This file works fine with my device. The Readme of the file explains how to add the quirk to Home Assistant. The rules I have are something like “if the forecasted outside temperature today is below 15 degrees Celsius, activate the heating at 6 o’clock for 5 hours with a target temperature of 21 degrees Celsius”. Nothing too fancy (yet). I also added a rule that activates the heater for 5 minutes per week in warmer months. That way I can work around the problem that the heating valve gets stuck, and I have to fix it each winter. If you see that the temperature of the device does not match the room temperature, you can tweak the offset a bit. Simply call the temperature_calibration function via ZigBee and set it to a new offset. After a few seconds, the device will update the temperature to the new value."
year_published = 2024
