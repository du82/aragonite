["https://bitboxer.de/2013/10/21/see-me-speak"]
title = "Bitboxer - See Me Speak"
description = """
I am a freelance polyglot developer and love HTML5, testing, TypeScript, Ruby and Elixir. In the last 20 years I  have been in lots of different roles, from Java to Elixir, from backend developer at a 3 people team in an early  phase startup to the CTO of a web agency. Some of my work can be seen on my projects page.  Need help developing your MVP or to add new features into your current app? Need a CTO or a front/backend  developer for hire? Send me an email."""
full_description = "See Me Speak 21 Oct 2013 Seit über 10 Jahren habe ich eine Idee. Ein Gebärdensprach Lexikon. Ich bin ja Kind von Gehörlosen, und deswegen hat mich das immer geärgert, keine Seite zu haben, auf die ich Freunde verweisen konnte, wenn die mal kurz in die Sprache reinschnuppern wollten. Es gab nur ein paar Seiten, die mehr schlecht als recht die Gebärden dargestellt haben. Die Kern-Idee bei der Seite war, dass jeder eine Gebärde hinzufügen können müsste. Also wie Wikipedia. Nur für Videos. Dummerweise kann man die Wikipedia Software dafür nicht gut benutzen. Das Hinzufügen von Videos ist viel viel zu komplex. Letztes Wochenende war es soweit. Auf einem 48 Stunden Programmierwettbewerb namens “RailsRumble” habe ich mit Florian, Jan und Klaus einen ersten Prototypen gebaut. Und so sieht das ganze aus: See Me Speak Leider funktioniert das Aufnehmen momentan nur im Chrome, aber das ist den 48 Stunden geschuldet, die wir hatten. Probiert das ganze bitte mal aus und gebt mir euer Feedback. Das Feedback werde ich verwenden, um aus dem Prototypen eine echte Seite zu bauen. Dazu gehört dann: Besseres Layout (hoffentlich von einem Designer :wink:) Mehr Kontrolle vor/während/nach der Aufnahme Kommentare/Bewerten von Gebärden Bessere Filtermöglichkeiten nach Sprache in der Suche"
