["https://bitboxer.de/page/7"]
title = "Bitboxer - List"
description = """
Biking in Berlin      
              A few years ago I filmed myself biking in Cologne and
I thought it would be awesome to do it again here in Berlin.
                           30 Aug 2014"""
full_description = "A few years ago I filmed myself biking in Cologne and I thought it would be awesome to do it again here in Berlin. The last weekend was the final chapter of what took over 8 months to prepare: the eurucamp 2014. I was part of the conference organization and tried to help wherever I could. My role was relatively small. I was part of the ticket team and tried to help here and there. During the eurucamp I was part of the podcast team. Sadly that ment that I could not listen to the talks, but instead I could be part of the interviews with the speakers. That’s a deal I could live with :wink: . Before I moved to Berlin I was part of the Nerdkunde podcast. Sadly it was not possible to be part of the podcast without being in Cologne. But since last month I am part of another awesome podcast called bits of berlin. Go there and listen to the episodes if you haven’t. I have a problem with stuff like the BattleHack. And in this post I want to explain a few issues I have with them. Today a German Astronaut arrived on the ISS. And he will be there till November. But how do you become an astronaut? What does living in the Space Station feel like? Since I moved to Berlin a lot has changed. I got interested in new hobbies and restarted older ones I had before moving to Cologne. Somehow I lost interest in a lot of things there. Biking and Photography for example. Never understood why. But since I moved to Berlin I think I known why. The atmosphere in Cologne was not as bike friendly as Berlin is and the city did not inspire me to do lots of photos there. I am sorry to say this, but Cologne might not be one of the most photogenic places. If you know me for a long time, you probably have heard this sentence from me at least once: “I will try that again in a few months”. It’s one of the most important things for me to keep up with technology."
year_published = 2014
