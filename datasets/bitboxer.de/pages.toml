description = """
I am a freelance polyglot developer and love HTML5, testing, TypeScript, Ruby and Elixir. In the last 20 years I  have been in lots of different roles, from Java to Elixir, from backend developer at a 3 people team in an early  phase startup to the CTO of a web agency. Some of my work can be seen on my projects page.  Need help developing your MVP or to add new features into your current app? Need a CTO or a front/backend  developer for hire? Send me an email."""
full_description = "My default apps at the end of 2023 12 Nov 2023 Photo by Barn Images. In 2017 I did an interview with Sweet Setup and talked about all the apps I was using at that moment. Last week I stumbled upon this post by Matt Birchler and saw more and more people doing the same. So I thought it would be fun to do the same and see how my setup has changed over the years. ✉️ Mail service: mailbox.org 📬 Mail client: Apple Mail ✅ Tasks: OmniFocus 📰 RSS service: Self hosted stringer 🗞️ RSS client: Reeder ⌨️ Launcher: Alfred, I am too old school for Raycast ☁️ Cloud storage: iCloud 🌅 Photo library: iCloud 🤳🏻 Photo editing: Photoshop and Lightroom 🌐 Web browser: Firefox on Desktop, Safari on iOS 🔖 Bookmarks: Raindrop.io 📆 Calendar: Fantastical 📹 Meeting reminders: MeetingBar 📖 Read it later: Pocket 🌤️ Weather: Carrot Weather 🎙️ Podcasts: Overcast 🎶 Music: Spotify 🔐 Passwords: 1Password 💸 Budgeting: YNAB 🍿 Movie discovery/tracking: Letterboxd 📖 Book tracking: bookwyrm, and Goodreads as fallback 📺 TV show tracking: Television Time ⛰️ Habbit/Mood tracking: Daylio 📝 Notes: Bear for most stuff, trying Obisidian for my current gig…let’s see. 🧮 Code Editor: Visual Studio Code and NeoVim 🔍 Code documentation browser: Dash 👨🏻‍💻 Terminal: iTerm2 🔎 Search: Kagi 📦 Package tracking: Parcel 👩‍🍳 Recipe management: Mela 📁 File management: Forklift 4, I need a Norton Commander way of working ⌨️ Keyboard: Moonlander As you see, I am still ways away from the setup of Terry Prattchet 😅."
