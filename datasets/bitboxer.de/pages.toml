description = """
How I organize myself      
              Over the last decade I started to organize my life a lot. My goal was to never forget important dates and have an overview about what is happening and what I should do next. I am not perfect at it, and living with a 2-year-old kid definitely made me more unreliable than before, but I am trying every day to be better at it.
                           30 Jan 2020"""
full_description = "Over the last decade I started to organize my life a lot. My goal was to never forget important dates and have an overview about what is happening and what I should do next. I am not perfect at it, and living with a 2-year-old kid definitely made me more unreliable than before, but I am trying every day to be better at it. This month my little one has her second birthday. A lot has happened in those two years. Sadly I didn’t know enough fathers that shared my values how to raise a kid. Fathers that are active, know important concepts like mental load and want to share the workload and time with the kid evenly between all people who are involved in raising the kid. For me JSX is the part of React that makes developing with it a real treat. Yes, the functional nature, the state and lifecycle management are really nice, too, but JSX makes it all come together in a great way. The effortless integration of HTML inside of JavaScript just makes it one of the best experiences writing a web frontend. Last month Anika and I published a little project we had been working on for the last 9 months: wishlephant. A couple of months ago I wrote a small tool that creates a RSS feed of your IMDb ratings. This comes in handy if you want to use it with IFTTT or similar pipeline things. My use case is to import them to Day One with this. Every year around summer new emojis appear on all of your devices. Have you ever thought about how that happens? And how it works out that every device understands them? Windows, Mac, Android, and iOS? And now it’s the time of the year where I post all the talks of the chaos communication congress that I can recommend. Due to the baby I only managed to be there for a day. Let’s see how many days I make it the next time :wink:. I didn’t watch any talks live because I focused on connecting with all the people I haven’t seen for too long. Luckily everything is online and I watched tons on my couch the last few weeks. And as always: if you think I missed an important talk, feel free to ping me."
