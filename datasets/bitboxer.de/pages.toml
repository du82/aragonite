["https://bitboxer.de/2013/04/27/vakuum"]
title = "Bitboxer - Vakuum"
description = """
I am a freelance polyglot developer and love HTML5, testing, TypeScript, Ruby and Elixir. In the last 20 years I  have been in lots of different roles, from Java to Elixir, from backend developer at a 3 people team in an early  phase startup to the CTO of a web agency. Some of my work can be seen on my projects page.  Need help developing your MVP or to add new features into your current app? Need a CTO or a front/backend  developer for hire? Send me an email."""
full_description = "Vakuum 27 Apr 2013 Ich habe diesen Blog in den letzten Wochen leider mal wieder etwas schleifen lassen. Die Wohnungssuche in Berlin hat etwas meiner Zeit gekostet. Aber da das ja jetzt erledigt ist, geht es jetzt mal weiter. Diese Woche mit 3 Comic Empfehlungen. Anfangen möchte ich mit Vakuum. Einem genialen Debüt-Comic eines deutschen Zeichners. Wenn man es sich einfach machen würde, würde man das ganze als Coming-Of-Age Story abheften. Aber es ist die beste Comic-Of-Age Story, die ich je in Comic Form gelesen habe. Nachdem mein Bruder mir das Buch gegeben hat, habe ich innerhalb von ein paar Stunden komplett gelesen. Und dann noch einmal. Aus der Hand geben ist nicht 🙂 . Die Story zieht einen sofort in einen Leserausch. Worum geht es eigentlich? Um Tod, Liebe, Drogen und erwachsen werden. Das ganze gepaart mit einem schönen Zeichenstil ohne viele Worte für unnötige Dialoge zu verschwenden. Und das schönste: durch die Art der Erzählung regt der Comic sehr zum nachdenken an. Es macht was mit dir. Mehr will ich nicht verraten. Holt es euch. Sofort."
