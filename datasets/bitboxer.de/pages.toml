full_description = "Wie man schnell eine neue Wohnung findet 25 May 2013 Ich ziehe Ende Juni nach Berlin. Zum Glück habe ich recht schnell eine Wohnung gefunden. Ich habe mir 4 Wohnungen angesehen und eine davon ist es dann geworden. Ziemlich flott, wenn Ihr mich fragt. Nur wie habe ich das gemacht? Ganz einfach. Man braucht nur einige wenige Zutaten, um schnell zu einer neuen Wohnung zu kommen: Glück. Viel davon. Je enger der Wohnungsmarkt ist in dem Segment, in dem man sucht, umso mehr braucht man davon. Wenn das Segment zu klein ist, fangt an Kompromisse zu machen. Natürlich gibt es da einen Zeitfaktor. Umso dringender man eine Wohnung sucht, umso kompromissbereiter sollte man sein. Viele Wohnungen sind nur ganz ganz kurz auf den Immobilienportalen. Die Wohnung, die ich bekommen habe, war nur eine Stunde dort sichtbar. Und genau deswegen sollte man sich die Email-Funktionen einrichten auf den Portalen. Sobald eine Wohnung das Profil erfüllt, bekommt man dann eine Mail und muss umgehend handeln. Sucht nicht nur auf einem Portal, sondern auf allen, die Ihr für die Stadt finden könnt. immowelt, immonet und immobilienscout24 sind die größten deutschen Portale. Da solltet Ihr anfangen zu suchen. Schreibt freundliche Mails in denen schon alles steht, was euch positiv hervorhebt. “Gut verdienender Softwareentwickler bla bla…”. Das ist die erste Bewerbungsphase. Vergesst das nicht. Gute Makler wählen schon da aus. Nutzt keine Massenbesichtigungen, wenn es sich vermeiden lässt. Die sind die Hölle und eher Lotto als echte Wohnungssuche. Und die Makler, die sowas machen, sind auch eher komplizierter als jene, die vorher schon aussieben und nur mit 4-6 Kandidaten eine Wohnung ansehen. Seit vorbereitet bei der Besichtigung. Das bedeutet: Ihr solltet wissen, welche Unterlagen ein Makler von euch abfragen könnte. Und habt diese auch dabei. Eine gute Unterlagenmappe ist Gold wert. Das ist nämlich die zweite Bewerbungsphase. Deswegen solltet Ihr bei der Besichtigung auch höfflich und gepflegt rüberkommen. In Berlin braucht Ihr zum Beispiel folgende Unterlagen: aktuelle Schufa-Auskunft, Arbeitsvertrag (wenigstens den Teil mit der Befristung und der Unterschrift), Mietschuldenfreiheitsbescheinigung, Kopie des Ausweises und ein kleiner Lebenslauf. Letzterer ist nicht zwingend, aber sieht halt besser aus. Und dann solltet Ihr hoffentlich auch recht schnell eine Wohnung für euch finden können. Viel Glück!"
