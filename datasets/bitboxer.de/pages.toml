["https://bitboxer.de/2013/11/18/suente-matten"]
title = "Bitboxer - Warum es in Schale kein Halloween geben wird"
description = """
I am a freelance polyglot developer and love HTML5, testing, TypeScript, Ruby and Elixir. In the last 20 years I  have been in lots of different roles, from Java to Elixir, from backend developer at a 3 people team in an early  phase startup to the CTO of a web agency. Some of my work can be seen on my projects page.  Need help developing your MVP or to add new features into your current app? Need a CTO or a front/backend  developer for hire? Send me an email."""
full_description = "Warum es in Schale kein Halloween geben wird 18 Nov 2013 Jedes mal, wenn ich auf Halloween angesprochen werde, muss ich grinsen. Ich bin in meiner Kindheit auch von Haus zu Haus gegangen und habe um Süßigkeiten gebeten. Und nein, ich bin nicht in den USA aufgewachsen, noch war ich sooo Hipster, das ich schon vor 20 Jahren versucht habe, Halloween nach Deutschland zu bringen. Was habe ich also gemacht als Kind? Ich bin beim Sünte Marten (oder mittlerweile auch Sünte Matten) Umzug mitgegangen. Sünte Marten? Das klingt verdächtig nach Sankt Martin. Richtig. Dummerweise ist Schale seit der Reformation evangelisch. Was macht also ein katholischer Brauch in einem evangelischen Dorf? Wie so vieles war der Sankt Martins Umzug mal ein heidnischer Brauch. Kinder zogen singend durch das Dorf um geschenke zu er”heischen”. Dieser Brauch wurde vermixt mit den Ernte-Festen die zeitlich rund um den Heiligsprechungstag von Sankt Martin gefeiert wurden. Daraus ist dann Sankt Martin geworden. In den katholischen Orten wurde das ganze dann nach und nach zu den heute bekannten Sankt Martin Umzügen. In Schale, das ja protestantisch ist, hat sich das ganze dann anders entwickelt. Und wie läuft so ein Sünte Marten Umzug nun ab? Das ganze ist sehr gut durchorganisiert. Schale ist unterteilt in Gebiete. Und die Kinder jedes Gebietes treffen sich an einem Ort und gehen von dort zusammen Ihre Route ab. Je nach Gebiet kann man dann 5-40 Kinder singend von Haus zu Haus ziehen sehen. Gesungen wird dann eine Abwandlung des folgenden Liedes: Sünte Marten Vögelken, heff so’n roa roa’t Kögelken, Sünte Marten harre ne Kauh, de gänk noar Allerhiligen tau; Allerhiligen woll’t verkaopen, daor reup dat Kiend van waopen. Hier und doar nen rieken Mann, de us wall wat geben kann van Appel un van Beern, doar kann me gut von geer’n, mit äine gruene Räuben, doar kann me ne Bur mit euben, van äine raoe Woddeln, daor kann me gut van spoddeln! Laot’t us hier nich länger staohn, wi mött noch ne Hüüsken väder gaohn, noch väder as naor Köln, Käln is ne graote Stadt, daor gewet us alle Löe watt! Schönste Jungfrau, krieg’we ok wat? Wenn etwas gegeben wurde, wird als Dank das folgende Gesungen: Se hebb us wat’te geben. selig sällt Je leben, selig sällt Je sterben un den Himmel erben! Tja, und wenn nichts gegeben wurde? Dann das hier: Daor boben an da Himmel daor hang nen Sack vull Schimmel wecker kick d’r utt? Wecker kick d’r uut? Daor kick de gier’ge … ut! Daor kick de schwatte Düwel druut! Die Melodie des Liedes ist in ganz Norddeutschland bei den unterschiedlichsten Heische-Bräuchen in Verwendung. Zum Beispiel im Sauerland bei dem “Lütke Fastnachts-Lied”. Der Text ist jedes mal anders, die Melodie gleich. Und was gibt man den Kindern? Eine Packung Süßigkeiten oder ein bisschen Geld an die Leiter des Trupps. Am Ende des Abends wird alles gezählt und gerecht unter allen Kindern aufgeteilt. Ach und um zu zeigen das es mittlerweile ein “evangelischer Brauch” ist: sobald man die Konfirmation hinter sich gebracht hat, ist man leider zu alt und darf nicht mehr teilnehmen."
