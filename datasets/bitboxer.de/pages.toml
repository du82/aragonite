["https://bitboxer.de/page/4"]
title = "Bitboxer - List"
description = """
34c3 retrospective      
              It’s time again for my list of talks that I loved on the chaos communication
congress. Sadly I wasn’t able to be there this year. Hopefully I will be back
at 35c3. Someone kept
me rather busy :wink: .
                           21 Jan 2018"""
full_description = "It’s time again for my list of talks that I loved on the chaos communication congress. Sadly I wasn’t able to be there this year. Hopefully I will be back at 35c3. Someone kept me rather busy :wink: . Some of you might have noticed that something happened in my life. I got a baby. Here I want to give a couple of tips that I found very helpful. Maybe you will find a few of the things helpful, too. I often see a pattern with on boarding new coworkers that I find really problematic. The „push to production on the first day“ rule. Lots of people in my twitter feed are constantly bragging that their new coworker was able to push something to production on day one. The idea behind is that it gives the new hire a great feeling of accomplishment on the first day. It should also demonstrates how great the company is doing on the „release often“ scale. In the last couple of years I had lots of discussions with people about one specific topic: what do you do with jQuery spaghetti code in legacy applications. We all have been there in one point of our career. For me the answer was pretty straight forward. There are three ways out of it. None of them is easy, but the result will hopefully be worth it. There is only one reason not to fix this problem: nobody needs to touch that part of the application and it works fine as is. If you need to touch the code regularly, you have to change something. But what? And how? This week I stopped working full time on SignDict and started a new job at Wooga. Starting a new job often means to adapt to new ways of working. One of the biggest changes for me is that from now on I am working in a VirtualBox on a Debian system. That box is setup using Vagrant and relies heavily on docker and other nice litte things. This week the sweet setup published an interview with me. If you ever wanted to know what apps I am using and why, feel free to read this article. It’s time again for my list of talks that I loved on the chaos communication congress. As usual I spent most time on RubyTown and watched the talks later on."
year_published = 2018
