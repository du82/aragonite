["https://bitboxer.de/2024/01/08/naming-things"]
title = "Bitboxer - Book review: Naming Things"
description = """
I am a freelance polyglot developer and love HTML5, testing, TypeScript, Ruby and Elixir. In the last 20 years I  have been in lots of different roles, from Java to Elixir, from backend developer at a 3 people team in an early  phase startup to the CTO of a web agency. Some of my work can be seen on my projects page.  Need help developing your MVP or to add new features into your current app? Need a CTO or a front/backend  developer for hire? Send me an email."""
full_description = "Book review: Naming Things 08 Jan 2024 At the end of last year, I realized that I somehow stopped reading technical books. There was just too much going on to read that kind of content in my leisure time. Why learn a new thing when you also could escape to Teixcalaanli? But I started to crave some technical content and I looked at my pile of unread technical books. Luckily, one of the books I chose was this one. Naming things is hard. And on top of that, a wrong name leads to all kind of problems. This book explains the basic rules how you should name things in your code. Plain and simple. Luckily, the author also didn’t make the explanations longer than needed. These kinds of books are the best. Short enough to read in one sitting, long enough to cover everything you need to know. If you are a software developer, you really should get this book and put it next to your desk after you finished reading it. You will start referencing it when talking to your colleagues about code. 5/5 stars from me. Get Naming Things at https://www.namingthings.co/. Follow me on bookwyrm.social for more book reviews."
