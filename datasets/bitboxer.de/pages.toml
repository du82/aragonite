full_description = "Have you heard of Deadloch? The chances are rather high that you haven’t yet, which is a shame. It is one of the hidden gems of streaming. There are so many shows released currently that some fantastic ones fall through the cracks. In 2017 I did an interview with Sweet Setup and talked about all the apps I was using at that moment. Last week I stumbled upon this post by Matt Birchler and saw more and more people doing the same. So I thought it would be fun to do the same and see how my setup has changed over the years. Every time I join a team as a freelancer I check a couple of things during my initial code review. Some are quite common, like: A couple of years ago I was lucky to be in the first round of the Prototype Fund and was able to build SignDict. A German sign language dictionary that now has around 88,500 unique visitors a month and is one of the leading sign dictionaries in Germany. If you have a website with a lot of text on it, you might discover that iOS and Internet Explorer will sometimes add links when they think they discovered a phone number. I really love my Kobo eReader. Cheaper than Amazon, I can put epubs on it and buy ebook at every store that is not called “Amazon”. Most ebooks are just watermarked and don’t have any DRM attached to them ♡. You can even lend epubs from your local library using awesome services like OverDrive. My wife is currently opening a coworking space for parents called little village and because of that, I investigated the topic a lot in the last couple of months. In the last post I promised that I will explain how I use OmniFocus. Hopefully you get some interesting new ideas after reading this."
