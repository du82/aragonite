["https://bitboxer.de/2016/12/21/lanyrd"]
title = "Bitboxer - Status of Lanyrd"
description = """
I am a freelance polyglot developer and love HTML5, testing, TypeScript, Ruby and Elixir. In the last 20 years I  have been in lots of different roles, from Java to Elixir, from backend developer at a 3 people team in an early  phase startup to the CTO of a web agency. Some of my work can be seen on my projects page.  Need help developing your MVP or to add new features into your current app? Need a CTO or a front/backend  developer for hire? Send me an email."""
full_description = "Status of Lanyrd 21 Dec 2016 When lanyrd was bought by Eventbrite in 2013 I had high hopes that the platform would continue to thrive. It was just a too good fit to be worried about it. Sadly that wasn’t the case. Lanyrd basically froze in time. The announcement blogpost was the 2nd last blogpost in Lanyrds history. The twitter account staid somewhat active retweeting random messages till September 2015. After that it stopped. In the last couple of months the site got more and more unstable. To a point where it felt like it was more offline than online. Without any explanation. Tweets to it kept unanswered. Emails to the support staff didn’t get any reply. In short: I was worried. After trying to reach out to several official channels I finally tried the Eventbrite press email. And to my surprise someone answered. The email included the following talking points: Lanyrd is run separately from Eventbrites operations We can confirm that we recently had problems with the uptime of Lanyrd. We are working on it. We are developing a plan for the future of Lanyrd. Details will be shared in due time The only takeaway here: they know it is in bad shape right now. It would be awesome if someoneTM would write a lanyrd alternative. I loved the service and discovered conferences with it that I would have never visited without it."
year_published = 2016
