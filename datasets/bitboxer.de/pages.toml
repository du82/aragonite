full_description = 'In a bit over a month, Germany votes for the next government. It looks like conservative, right-leaning parties might win a lot of votes. Let us all try to prevent that. One way to do that is to go out on the street and protest to show others that we fight. That we haven’t given up hope for a better world. Overcast has a new feature that highlights what podcasts you have listened to. Here is the list of mine. With some additionally honorable mentions. The dumb heating dial in our apartment needed a smart upgrade. Here is how I added it to my Home Assistant If you mention email validation, most developers only think about the technical aspect of it. What is a valid email? Basically, there are two ways of thinking about it: Regular expressions are enough or Regular expressions don’t cover 100% of the email standard. For that I can only say: yes, a regular expression does not work for your esoteric email addresses, but who cares? The w3c spec for <input type="email"> says this should be done with this regular expression: Adding Infrared capabilities to your Home Assistant opens tons of interesting integrations. Here is how. At the end of last year, I realized that I somehow stopped reading technical books. There was just too much going on to read that kind of content in my leisure time. Why learn a new thing when you also could escape to Teixcalaanli? But I started to crave some technical content and I looked at my pile of unread technical books. The last time I did a CCC event retrospective was 4 years ago. I skipped 36c3 for reasons, but with 37c3 I’m back. I wasn’t in Hamburg this year, and I’m not sure if I want to join 38c3 in Hamburg, but time will tell. Back in 2019 I started a digital fathers* community. We have a really nice Slack channel with tons of activity. In that channel, we share countless interesting links. I didn’t want those links to be lost in that massive pile that is the Slack history. And for that reason, I started to collect them on this page. Hopefully, this page is also useful for you. If you have any suggestions that fit there, please let us know.'
