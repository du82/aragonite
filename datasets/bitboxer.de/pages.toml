["https://bitboxer.de/2018/01/21/34c3"]
title = "Bitboxer - 34c3 retrospective"
description = """
I am a freelance polyglot developer and love HTML5, testing, TypeScript, Ruby and Elixir. In the last 20 years I  have been in lots of different roles, from Java to Elixir, from backend developer at a 3 people team in an early  phase startup to the CTO of a web agency. Some of my work can be seen on my projects page.  Need help developing your MVP or to add new features into your current app? Need a CTO or a front/backend  developer for hire? Send me an email."""
full_description = "34c3 retrospective 21 Jan 2018 It’s time again for my list of talks that I loved on the chaos communication congress. Sadly I wasn’t able to be there this year. Hopefully I will be back at 35c3. Someone kept me rather busy :wink: . And now to the talks I saw on my couch in the few moments of free time I had. Der PC-Wahl-Hack Three weeks before the german elections the CCC published a paper highlighting problems in a software that is used to transmit preliminary voting results. In this talk they explain what they found and what happened after they published the paper Video Schreibtisch-Hooligans The yearly state of „Frag den Staat“. Basically a must watch if you want to keep up to date on the transparency laws in Germany. Video All Computers Are Beschlagnahmt The ban of Indymedia linksunten from the view of the lawyer of indymedia. Video Dude, you broke the Future! A science fiction author lays out his what he thinks went wrong in the 21st century and what might come next and how we can influence it. Video The Ultimate Apollo Guidance Computer Talk If you ever wanted to know what kind of computer was used to land the Apollo Missions on the moon, this talk is for you! Video Tightening the Net in Iran How does the Internet in Iran work? What are people using and how? Really interesting view into how people deal with the „filternet.“ Video QualityLand The Author of „Känguruhchroniken“ reads out of his next book „Qualityland“. Video The Internet in Cuba: A Story of Community Resilience A fascinating view on the network infrastructure people in Cuba are using. Video Die Lauschprogramme der Geheimdienste Hans-Christian Ströbele, former Member of the German Parliament for the Green party talks about the NSA/BND investigation panel of the parliament. Video elektronisches Anwaltspostfach - einfach. digital. kaputt German Lawyers should have been forced to use a digital email system called beA starting in January 2018. Sadly the system is full of errors and problematic design decisions. In this talk you will see lots of them. After this talk the German Layer Association stopped the roll out. Video Pointing Fingers at ‚The Media‘ A nice analysis how the public discourse during the last election in Germany worked. Video Tiger, Drucker und ein Mahnmal The artist collective „Zentrum für Politische Schönheit“ talks about their political art instalations of the last three years. Video Science is broken Can we trust the scientific method? What can go wrong and how can we fix it? Really interesting talk that explains what can be improved in the current way we do science. Video A hacker’s guide to Climate Change - What do we know and how do we know it? Ever wondered about climate change? Ever tried to convince people that it is really happening? Then this talk is for you. Amazing overview about everything related to climate change. Video"
year_published = 2018
