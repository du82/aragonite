title = "Bitboxer - Scott Pilgrim"
description = """
I am a freelance polyglot developer and love HTML5, testing, TypeScript, Ruby and Elixir. In the last 20 years I  have been in lots of different roles, from Java to Elixir, from backend developer at a 3 people team in an early  phase startup to the CTO of a web agency. Some of my work can be seen on my projects page.  Need help developing your MVP or to add new features into your current app? Need a CTO or a front/backend  developer for hire? Send me an email."""
full_description = "Scott Pilgrim 28 Apr 2013 Scott Pilgrim vs The World. Großartiger Film. Scott verliebt sich in ein Mädchen. Leider hat das ganze einen Haken. Um genau zu sein Sieben. Sieben Ex-Freunde. Und die gilt es zu besiegen, wenn er seine Liebe behalten will. Hier der Tailer zum Film: Das ganze basiert auf einer sechs teiligen Comic Reihe. Und die hat es in sich. Der Film ist zwar eine gute Umsetzung, aber die Comics sind um einiges Liebenswerter. Glücklicherweise gibt es alle Comics in einem schöne Set mit Schuber: Wer also den Film liebt, sollte sich die Comics definitiv ansehen. Und wer beides nicht kennt und Lust auf Comics hat, sollte zu letzterem greifen. Ansonsten: los in die Videothek und den Film ausgeliehen 🙂 ."
