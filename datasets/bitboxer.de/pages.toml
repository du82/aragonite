["https://bitboxer.de/2017/01/07/33c3"]
title = "Bitboxer - 33c3 retrospective"
description = """
I am a freelance polyglot developer and love HTML5, testing, TypeScript, Ruby and Elixir. In the last 20 years I  have been in lots of different roles, from Java to Elixir, from backend developer at a 3 people team in an early  phase startup to the CTO of a web agency. Some of my work can be seen on my projects page.  Need help developing your MVP or to add new features into your current app? Need a CTO or a front/backend  developer for hire? Send me an email."""
full_description = "33c3 retrospective 07 Jan 2017 CC-BY-NC-SA 2.0 Bodo Tasche It’s time again for my list of talks that I loved on the chaos communication congress. As usual I spent most time on RubyTown and watched the talks later on. In the last couple of weeks after the congress I watched tons of talks. More than usual because of the amount of free time I am currently enjoying :wink: . Here is a list of talks I loved in random order: Interplanetary Colonization The big how, when and where questions about interplanetary colonization. Video Irren is staatlich (German) 10 years of information freedom act in Germany. Video Methodisch Inkorrekt (German) Kinda random physics experiments :wink: . Video Shut Up and Take My Money! A really nice talk how bad a German FinTech startup aka Bank designed their APIs. Video The Ultimate Game Boy Talk The title says it all. Everything you need to know about the Game Boy. Video What could possibly go wrong with ? A nice demonstration of security issues on current x86 CPUs Video Die Sprache der Populisten (German) Every year maha gives a talk where he dissects the language used in politics. This year he focuses on the current rise of populists. Video Security Nightmares 0x11 (German) The yearly review of security issues in tech with a little forecast what we might expect in the near future. Video Woolim – Lifting the Fog on DPRK’s Latest Tablet PC From the group that showed Redstar OS to the public now comes a talk where they demonstrate the current state of tablets in the DPRK. Video SpiegelMining – Reverse Engineering von Spiegel-Online David Kriesel got famous for his really great talk about problems in Xerox Scanners. This year he shows what he learned by downloading all articles from Spiegel, a big german news site. Video Nicht öffentlich. (German) A theater play based on the German parliamentary hearing about the NSA wiretapping in Germany. Video Warum in die Ferne schweifen, wenn das Ausland liegt so nah? (German) The current state of internet wiretapping laws in Germany. Video Build your own NSA The NSA and other agencies are not the only problem. Lots of private companies collect huge amount of data from their users. Here a journalist demonstrates what kind of data could be bought online. Video Copywrongs 2.0 A follow up from the talk given two years ago that explains the current state of copyright law in Europe. Video Making Technology Inclusive Through Papercraft and Sound A nice talk about more diversity in tech through a cheap way to teach electronics to kids. Video Eavesdropping on the Dark Cosmos Nice introduction to gravitational waves and dark matter. Video Dieselgate – A year later The current status of the Volkswagen Dieselgate, the legal side. Video Software Defined Emissions The technical side of the Dieselgate with an reverse engineering of the electronic components involved. Video Did I miss something? If yes please leave it in the comments below."
year_published = 2017
