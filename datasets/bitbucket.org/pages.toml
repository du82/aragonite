title = "Meet the Bitbucket UI | Bitbucket"
description = "An introduction to the Bitbucket user interface, take a tour through commonly used views, settings, and what you need to know to get started."
full_description = 'Guides home Guide 1: A brief overview of Bitbucket Get started with Bitbucket Guide 2: Getting started with Bitbucket Meet the Bitbucket interface Better code with Bitbucket: 4 starting steps { "type":"imkt.components.GuidedSidebar", "params": { "stickyPosition":"100", "isAgile":false } } These pages contain older product screenshots and may need some updates. If you have questions on any of the content on these pages, please ask your question on the Atlassian Community. These pages contain older product screenshots and may need some updates. If you have questions on any of the content on these pages, please ask your question on the Atlassian Community. Meet the Bitbucket interface Before you begin, sign up for a Bitbucket Cloud account so you can roll up your sleeves and try things for yourself. This guide will give you a quick tour of the parts of Bitbucket you’ll use a lot, so keep this tab open while you sign up. We’ll be here when you’re done. Want to get started with Bitbucket Data Center? Go here. Now let’s introduce you to the Bitbucket user interface and what you need to get started. Your work The Your work dashboard displays the pull requests and repositories you care about. On the Your work dashboard you’ll see open pull requests that have you as a reviewer, open pull requests you’ve created, and a list of repositories you can access. Repositories The Repositories view lists all the repositories you can access. By default its organized by the Last updated repository, so you’ll see the most recently changed repository at the top. Or you can search for a repository by name, or filter the list by Project or repository Owner. You can also only display the repositories you are watching by selecting the Watching filter. Projects Projects allow you to group and organize your repositories to make them easier to find. In the Projects view you’ll see existing projects and can create a new projects. Clicking on a project displays all the repositories in that project. Pull requests Code review is crucial step in the software development life cycle and helps ensure you’re shipping quality with confidence. Pull requests are where code review happens in Bitbucket, and the Pull requests view helps you quickly find what needs your attention. Use the quick filter buttons to change which pull requests are listed: Reviewing - Pull requests you’re reviewing Watching - Pull requests you’re watching Mine - Pull requests you created Teams - Pull requests your team created Your Bitbucket settings Bitbucket settings is where you’ll find important settings for managing your account, like: Security settings - SSH keys and two-step verification Notifications settings Apps and integration - find, install, and manage apps from the Bitbucket marketplace To get to your Bitbucket settings, click your avatar in the lower-left corner and select Bitbucket settings. Guide 1: A brief overview of Bitbucket Previous guide Guide 2 Part 2: Four starting steps Next guide'
