["https://bitbucket.org/product/guides/getting-started/overview"]
title = "Bitbucket Overview | Bitbucket"
description = "Bitbucket Cloud is a Git based code hosting and collaboration tool, built for teams. Learn more about hosting options, features, and key terms to know."
full_description = '''Guides home Guide 1: A brief overview of Bitbucket Get started with Bitbucket Guide 2: Getting started with Bitbucket Meet the Bitbucket interface Better code with Bitbucket: 4 starting steps { "type":"imkt.components.GuidedSidebar", "params": { "stickyPosition":"100", "isAgile":false } } A brief overview of Bitbucket Bitbucket Cloud is a Git based code hosting and collaboration tool, built for teams. Bitbucket's best-in-class Jira and Trello integrations are designed to bring the entire software team together to execute on a project. We provide one place for your team to collaborate on code from concept to Cloud, build quality code through automated testing, and deploy code with confidence. A brief overview of Bitbucket Best-in-class Jira & Trello integration Bring structure to chaos and keep the entire software company, from engineering to design, in the loop. Access branches, build status, commits, and status on Jira issues or Trello cards Code collaboration from concept to cloud Transition Jira issues based on pull request status, create a merge checklist with designated approvers, and check for passing builds. Build and test automatically with built-in continuous delivery Build, test and, deploy with our integrated CI/CD solution, Bitbucket Pipelines. Benefit from configuration as code and fast feedback loops. Deploy with confidence Track, preview, and confidently promote your deployments. Secure your code Rest easy knowing your code is secure in the Cloud and implement checks to prevent problems before they happen. Bitbucket hosting options Cloud Bitbucket Cloud is hosted on Atlassian’s servers and accessed via a URL. Bitbucket Cloud has an exclusive built-in CI/CD tool, Pipelines, that enables you to build, test, and deploy directly from within Bitbucket. Data Center Bitbucket Data Center is our self-managed option. It can be hosted on a single or a cluster of servers in your environment. Hosting on a cluster of servers drives performance at scale and high availability. Cloud Data center Git repository hosting Cloud Data center Branch permissions Cloud Data center Jira Software integration Cloud Data center Projects Cloud Data center APIs Cloud Data center 3rd party integrations Cloud Data center Git Large File Storage (LFS) Cloud Data center With file locking support Merge checks Cloud Data center Enforced merge checks Cloud Premium Data center Built-in CI/CD Cloud Data center Bamboo* Deployment permissions Cloud Premium Data center Code search Cloud Data center Code insights Cloud Data center Clustering Cloud Data center Required two-step verification Cloud Premium Data center Marketplace integration IP Whitelisting Cloud Premium Data center Snippets Cloud Data center Marketplace integration Issue tracking Cloud Jira Software* Data center Jira Software* Wiki Cloud Confluence* Data center Confluence* SAML-based SSO Cloud Atlassian Access Data center Priority support Cloud Atlassian Access Data center * Integrates easily with Jira Software, Confluence and Bamboo Key terms to know Here are some important words and terms to know so you can find your way around Bitbucket. Some of these are terms borrowed from Git, others are specific to Bitbucket. Branch A branch represents an independent line of development. Branches serve as an abstraction for the edit/stage/commit process. You can think of them as a way to request a brand new working directory, staging area, and project history. New commits are recorded in the history for the current branch, which results in a fork in the history of the project. Fork Instead of using a single server-side repository to act as the “central” codebase, forking gives every developer a server-side repository. This means that each contributor has not one, but two Git repositories: a private local one and a public server-side one. HEAD Git’s way of referring to the current snapshot. Internally, the git checkout command simply updates the HEAD to point to either the specified branch or commit. When it points to a branch, Git doesn't complain, but when you check out a commit, it switches into a “detached HEAD” state. Main The default development branch. Whenever you create a git repository, a branch named "main" is created, and becomes the active branch. Pipelines Bitbucket Pipelines is an integrated CI/CD service, built into Bitbucket. It allows you to automatically build, test and even deploy your code, based on a configuration file in your repository. Pipes Bitbucket Pipes are short code chunks that you can drop into your pipeline to perform powerful actions. Pipes make it easier to build powerful, automated CI/CD workflows and get up and running quickly. Project A project is a container for repositories. Projects make it easier for teams to focus on a goal, product, or process by organizing your repositories into projects. Projects can be either visible or hidden from public view. Pull Request Pull requests are a feature that makes it easier for developers to collaborate using Bitbucket. They provide a user-friendly web interface for discussing proposed changes before integrating them into the official project. Working Tree The tree of actual checked out files, normally containing the contents of the HEAD commit's tree and any local changes you've made but haven't yet committed. Looking for more Git terminology? Head on over to our Git tutorial to learn the A-Z of Git commands. Guide 2: Meet the Bitbucket interface Next guide'''
