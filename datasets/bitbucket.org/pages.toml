["https://bitbucket.org/blog/generate-pull-request-descriptions-with-atlassian-intelligence"]
title = "Generate Bitbucket Cloud pull request descriptions with Atlassian Intelligence - Work Life by Atlassian"
description = "Powered by Atlassian Intelligence, Bitbucket Cloud will automatically draft a pull request description based on the code changes being made."
full_description = "Published April 11, 2024 in Bitbucket Generate Bitbucket Cloud pull request descriptions with Atlassian Intelligence Published April 11, 2024 in BitbucketSanchi GuptaProduct Manager, Bitbucket We are thrilled to announce that AI-assisted pull request descriptions is now available for all Bitbucket Premium users. Crafting clear, concise PR descriptions for complex changes can be time-consuming and frustrating. We know the struggle is real. We, at Bitbucket, believe developers should spend less time writing descriptions and more time writing amazing code. That’s why we are excited to introduce this feature to streamline your workflow and empower you to write better PR descriptions faster. One click to smarter descriptions Atlassian Intelligence analyzes your code changes and commit messages to gain a deep understanding of the context behind your work. It then uses this information to generate a PR description that effectively captures the key aspects of your changes. Here’s how it works: When creating a pull request, open the editor to compose the PR description. Click on the Atlassian Intelligence icon in the editor prompt or type /ai to access the AI editor prompt. Select ‘Create pull request description’ to generate the description. You will receive a concise summary of your pull request. Simply click ‘Insert’ to accept the suggested changes. But remember, you’re still in control! The suggested descriptions are just a starting point. You can edit and refine the text to add your own insights and details. Get started today AI-assisted pull request descriptions are part of the Atlassian Intelligence (AI) feature set for Bitbucket Cloud, and can be activated for customers with a Premium plan. To enable Atlassian Intelligence, a workspace admin can go to Workspace settings > Atlassian Intelligence and accept the terms of service. If you are a Free or Standard customer who previously participated in the open beta of Atlassian Intelligence, you will continue to have access to all the AI features (including AI-assisted pull request descriptions) in Bitbucket Cloud through June 30th, 2024. After this date, to retain access to AI features, you will need to upgrade to a Premium plan. We’re confident this feature will significantly enhance your developer experience. That being said, we’d love to hear your feedback and how you use AI-assisted pull request descriptions! Learn more about our AI-assisted features Happy coding! About this Article Published April 11, 2024 About the Author Sanchi Gupta Product Manager, Bitbucket Facebook Twitter Linkedin Pocket Email Related Content More in Bitbucket Bitbucket Introducing AI-powered search with Bitbucket Cloud & Rovo Bitbucket Announcing ARM builds in cloud for Bitbucket Pipelines Bitbucket Introducing step failure strategies in Bitbucket Pipelines Bitbucket General availability of the Jenkins to Bitbucket Pipelines migration tool More Collections Collection Wellbeing | Well-doing Strategies for individuals and leaders to cultivate a flexible, balanced, and inclusive work life. View Collection Collection Ways of Working How you work is just as important as the work you're doing. View Collection Collection Your Personality at Work Navigating and celebrating the complexities of our individuality. View Collection Generate Bitbucket Cloud pull request descriptions with Atlassian Intelligence Subscribe Facebook Twitter Linkedin Pocket Email"
