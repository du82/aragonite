["https://bitburners.com/about"]
title = "About"
description = """
Veteran of the digital frontier. I cut my teeth on dial-up, built empires with MP3's, and mastered the art of DVD ripping. Those were the wild days of the internet, and I was there, shaping the scene.

These are the random ramblings of an old man, who dialed to a"""
full_description = '''About Veteran of the digital frontier. I cut my teeth on dial-up, built empires with MP3's, and mastered the art of DVD ripping. Those were the wild days of the internet, and I was there, shaping the scene. These are the random ramblings of an old man, who dialed to a BBS back in the 80's using a 300 bps modem. I've been online ever since. I had some internet success riding the waves of the MP3/DVD scenes. This domain was originally registered back in 2003 and now in 2024 it is time for a comeback.In addition being an online activist for decades, I got my MSc in information management, worked 13 years pioneering the smartphone industry and then more as head of ICT-management. I would like to think I have learned something on the way.While computers have mostly lost the magic of the pioneering years, every now and then something so fascinating pops up, that I get that old itch to write. The word blog is short for weblog and the Cambridge dictionary gives it the following definition. a regular record of your thoughts, opinions, or experiences that you put on the internet for other people to read. That is exactly how we did it in the 90's and 00's, long before the term was even invented. I am not sure how often or regularly I will be posting updates, but this site will be here for the long run. It will be interesting to see if this kind of old school approach gets any traction in the 2020's. Nowadays the amount of available content is so overwhelming, that it is very difficult to find your audience. "Bloggers" of today are professionals with media teams and huge resources. Very few websites have the personal touch anymore.No bullshit.That is my only promise to you. I am a huge fan of old school bloggers like Dedoimedo, who have been keeping it real for decades. No bullshit, no advertorials or affiliations. The texts will be brutally honest, whether they are factual or subjective opinions. I generally know what I am writing about, but will make it clear if I am being speculative.'''
