full_description = "Bereit für dein nächstes Projekt?Lass uns gemeinsam etwas Großartiges schaffen! Melde dich und wir machen den ersten SchrittKontaktiere uns Über unsBei bitcrowd sind wir mit Leidenschaft bei der Sache. Durch enge Zusammenarbeit mit unseren Kunden und einen maßgeschneiderten Ansatz schaffen wir wirkungsvolle digitale Lösungen, die genau auf ihre Bedürfnisse abgestimmt sind.Wer wir sindUnser großartiges Team bei bitcrowd besteht aus engagierten und hilfsbereiten Expert:innen aus aller Welt. Wir arbeiten sowohl remote als auch in unserem komfortablen Büro im Berliner Stadtteil Mitte (mit einer großartigen Kaffeemaschine). Doch wir schreiben nicht nur Code und erstellen Designs. Wir kümmern uns sowohl um den Prozess als auch um das Produkt – wir unterstützen unsere Kund:innen in jeder Phase, von den ersten Projektschritten bis hin zur langfristigen Wartung und der Weiterentwicklung nach der Veröffentlichung. Das unterstützende, verantwortungsbewusste und lösungsorientiere Arbeitsumfeld bei bitcrowd hat uns zu unserem größten Erfolg geführt: eine langjährige, erfolgreiche Zusammenarbeit mit unseren Auftraggeber:innen.Das TeamEs sind die Menschen, die bitcrowd ausmachen.Dank der vielfältigen Talente und der Leidenschaft unseres Teams schaffen wir es, einzigartige Produkte auf höchstem Niveau zu entwickeln. Daniela KnöpfleProjektmanagerinDarren CadwalladerUI/UX-EntwicklerJoshua BauerSoftwareentwicklerVictoria Pradel-DrengnerOffice ManagementAgathe LenclenSoftwareentwicklerinAlfonso MancillaSoftwareentwicklerMax MulatzSoftwareentwicklerHannah VogetSoftwareentwicklerinChristoph BeckCEO & GründerAndreas KnöpfleSoftwareentwicklerEin paar Worte zu DiversityTechnologie wird von allen möglichen Menschen genutzt – doch sie wird nach wie vor überwiegend von denselben wenigen Gruppen entwickelt. Die Veränderung der Standards im Tech-Bereich ist nicht immer ein bequemer Prozess, aber bei bitcrowd arbeiten wir daran, unsere demografische Zusammensetzung zu diversifizieren und auszubauen, während wir Gemeinschaften unterstützen, die für gleichen Zugang zu Technologie kämpfen. Dies spiegelt sich auch in unserem Einstellungsprozess wieder.Bereit für dein nächstes Projekt?Lass uns gemeinsam etwas Großartiges schaffen! Melde dich und wir machen den ersten SchrittKontaktiere uns"
