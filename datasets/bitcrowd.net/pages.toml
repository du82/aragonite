["https://bitcrowd.net/de/projects/everyworks"]
title = "everyworks"
full_description = "everyworksFlexible und moderne Coworking-Spaces an Bahnhöfen in ganz DeutschlandElixirBackendUX/UI DesignIdeationDie GeschichteEveryworks geht einen Schritt weiter im Bereich Coworking: Das Projekt der DB Station&Service AG eröffnet Büroflächen an Bahnhöfen als Coworking-Spaces mit minutengenauer Abrechnung oder maßgeschneiderten Büro-Lösungen auf Monatsbasis. bitcrowd entwickelte die Elixir API, das Admin-Backend und das Buchungssystem, die die von unseren Partnern bei evenly entwickelten nativen Apps unterstützen.AuftraggeberDeutsche BahnBesuchen RadfixRadfix ist ein Projekt der Deutschen Bahn, das Bahnhöfe zu praktischen Anlaufpunkten für Radfahrer:innen macht und die Nutzung der Stationen auf innovative Weise erweitert. Mit Radfix können Pendler:innen ihre Fahrräder direkt am Bahnhof reparieren lassen – schnell, unkompliziert und ohne Umwege. Einfach das Fahrrad an einem speziellen Fahrradständer am Bahnhof anschließen, die Reparatur bequem per App buchen und nach der Arbeit ein repariertes Fahrrad abholen. So wird der tägliche Arbeitsweg noch stressfreier und umweltfreundlicher.Das Projekt entstand während der Corona-Lockdowns, und der Designprozess dand daher vollständig remote statt. In enger Zusammenarbeit mit dem Radfix-Team entwickelten wir dieses innovative Konzept – von der ersten Idee bis zur finalen Umsetzung. Der Erfolg dieses Projekts hat uns dazu inspiriert, auch viele unserer anderen Projekte remote zu realisieren.Released: January '22ReactElixirIdeationBackendUX/UI DesignFrontendErfahre mehr Box - Die AbholstationBox – Die Abholstation ist die Vision der Deutschen Bahn, Bahnhöfe zu einem noch praktischeren Teil des Alltags zu machen. Ob Bestellungen von europaweiten Anbietern oder Lieferungen vom lokalen Blumenladen oder Reinigungsservice – deine Pakete kannst du ganz bequem auf dem Heimweg abholen. Einfach ein sicheres Schließfach am Bahnhof nutzen und los geht’s. Gemeinsam mit der Deutschen Bahn hat das bitcrowd-Team die Produktanforderungen konzipiert und die besten Voraussetzungen geschaffen, um eine funktionale und barrierefreie Lösung zu entwickeln. In ausführlichen Workshops haben wir jeden Schritt des Prozesses sorgfältig geplant, um die Bedürfnisse aller Stakeholder bestmöglich zu berücksichtigen. Dabei stand die Sicherheit von Box – Die Abholstation stets im Mittelpunkt: Unser Backend-Team entwickelte ein robustes, zukunftssicheres System, das höchsten Sicherheitsstandards entspricht. Gleichzeitig hat unser Frontend-Team in enger Zusammenarbeit mit dem UX- und Visual-Design-Team intuitive, benutzerfreundliche Interfaces geschaffen, die das Nutzererlebnis auf ein neues Level heben.Seit dem Launch von Box – Die Abholstation haben wir das Produkt sowie die Marketingmaßnahmen kontinuierlich optimiert und weiterentwickelt. Dabei haben wir eine neue Landingpage entworfen und eine interaktive Demo erstellt, mit der die Deutsche Bahn das System auf Messen und Veranstaltungen interessierten Personen anschaulich präsentieren kann.Released: October '21BackendFrontendUX/UI DesignElixirPhoenixIdeationErfahre mehr"
