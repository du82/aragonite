full_description = "Team Assistant / Finance (W/M/D)Zur Unterstützung unseres Office Teams in BerlinDu magst einen strukturierten Alltag mit abwechslungsreichen Aufgaben? Du bist flexibel und kannst Dich gut auf unterschiedliche Themen einstellen? Du verfügst über eine rasche Auffassungsgabe und löst auftretende Herausforderungen sicher und effektiv?Großartig! Wir suchen nach einem/einer aufgeschlossenen Office Manager*in, der/die gerne mit uns zusammen arbeiten möchte.Die Organisation eines reibungslosen und professionellen Ablaufs im Büro liegt in Deiner Hand. Parallel übernimmst Du administrative Aufgaben in den Bereichen Controlling und Personal.Wer wir sindbitcrowd ist eine Agentur, die Web-Software für eine Vielzahl an verschiedenen Kunden entwickelt. Wir möchten, dass unsere Entwicklungen dazu beitragen, die Welt ein Stück besser zu machen.Unser schönes Headquarter befindet sich in Berlin Mitte, unweit der Spree. Unser internationales Team ist überall zu Hause.Die StelleDie Stelle der Teamassistenz / Finance (m/w/d) ist als Teilzeitstelle (20-25 h/Woche) oder Vollzeitstelle in Berlin ausgeschrieben. Wir bieten Dir eine abwechslungsreiche Tätigkeit als Teil des Office-Teams in einem schönen Arbeitsumfeld mit tollen Kollegen und Kolleginnen.Darüber hinaus schätzen wir eine aufgeschlossene Einstellung und Diversität in unserem internationalen Team und denken, dass “work hard/play hard” aktiv Personengruppen ausschließt. Wir erwarten von unseren Teammitgliedern nur die Arbeitszeit, für die sie auch bezahlt werden und glauben fest daran, dass eine ausgewogene Work-Life-Balance zu glücklicheren Mitarbeitenden und somit zu besseren Produkten führt. Dafür sind wir bereit, die Erfordernisse der Arbeit auch mal den persönlichen Bedürfnissen unterzuordnen.Das solltest Du mitbringenBerufserfahrung im Office- und HR-Management, vorzugsweise in der Agentur- und MedienweltGute EDV-Kenntnisse und selbstverständlicher Umgang mit MacOS und den gängigen Office-ProgrammenIdealerweise Erfahrung in der vorbereitenden Buchhaltung (DATEV)Sehr gute Deutsch- und Englischkenntnisse in Wort und SchriftSorgfältige und strukturierte ArbeitsweiseSelbständiges Arbeiten und EigeninitiativeZuverlässigkeitLösungsorientiertes ArbeitenTeamgeistDeutsch und EnglischWenn Du neugierig und freundlich bist, Dich stetig weiterbilden möchtest und Wissen gerne teilst, bist Du bei bitcrowd richtig!Deine Aufgaben bei bitcrowdAdministrative und organisatorische Unterstützung des TeamsOffice Management Tätigkeiten (Kontakt zu Dienstleistern, Korrespondenz, Bestellung von Büromaterialien etc.)Vorbereitende BuchhaltungAufbereitung der Kennzahlen für Management und TeamAnsprechpartner:in für das Team in HR-Themen (Vertragserstellung, Urlaubsplanung, Schnittstelle zum Lohnbüro, Recruiting)Was wir zu bieten habenMotivierende und vertrauensvolle ArbeitsatmosphäreSei Teil des Office Teams mit selbstorganisierter AufgabenverteilungInterne und externe WeiterbildungsmöglichkeitenÜbernahme von Kosten für Bücher, Teilnahme an Konferenzen und WorkshopsDie richtige Balance: Wir lieben unseren Job, wissen aber auch, dass Freizeit wichtig istKleine Annehmlichkeiten wie frisches Obst, Snacks und Getränke stehen jeder Zeit zur VerfügungJobticket (VBB Umweltkarte AB)Ein paar Worte zum Thema DiversitätObwohl nahezu alle Menschen moderne Technologie verwenden, wird sie immer noch größtenteils von Mitgliedern derselben (privilegierten) Gruppen entwickelt. Dies zu ändern ist mühsam und für Technologieunternehmen nicht immer angenehm oder einfach. Bei bitcrowd stellen wir unsere eigenen Stereotypen und Muster in Frage und unterstützen Gemeinschaften, die an einem gleichberechtigten Zugang zur allen Technologien arbeiten. Mit diesem Ziel entwickeln wir auch unseren Einstellungsprozess stetig weiter. Wenn du zu einer in unserem Fachbereich unterrepräsentierten Gruppe gehörst, dann freuen wir uns besonders darauf, von dir zu hören.Jetzt bewerbenJetzt bewerben"
