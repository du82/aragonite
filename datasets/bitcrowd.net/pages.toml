description = "Wir entwickeln außergewöhnliche Anwendungen. Agil. Testgetrieben. Für das Web. In Elixir, Ruby, and React JS."
full_description = "Box - Die AbholstationBox – Die Abholstation ist die Vision der Deutschen Bahn, Bahnhöfe zu einem noch praktischeren Teil des Alltags zu machen. Ob Bestellungen von europaweiten Anbietern oder Lieferungen vom lokalen Blumenladen oder Reinigungsservice – deine Pakete kannst du ganz bequem auf dem Heimweg abholen. Einfach ein sicheres Schließfach am Bahnhof nutzen und los geht’s. Gemeinsam mit der Deutschen Bahn hat das bitcrowd-Team die Produktanforderungen konzipiert und die besten Voraussetzungen geschaffen, um eine funktionale und barrierefreie Lösung zu entwickeln. In ausführlichen Workshops haben wir jeden Schritt des Prozesses sorgfältig geplant, um die Bedürfnisse aller Stakeholder bestmöglich zu berücksichtigen. Dabei stand die Sicherheit von Box – Die Abholstation stets im Mittelpunkt: Unser Backend-Team entwickelte ein robustes, zukunftssicheres System, das höchsten Sicherheitsstandards entspricht. Gleichzeitig hat unser Frontend-Team in enger Zusammenarbeit mit dem UX- und Visual-Design-Team intuitive, benutzerfreundliche Interfaces geschaffen, die das Nutzererlebnis auf ein neues Level heben.Seit dem Launch von Box – Die Abholstation haben wir das Produkt sowie die Marketingmaßnahmen kontinuierlich optimiert und weiterentwickelt. Dabei haben wir eine neue Landingpage entworfen und eine interaktive Demo erstellt, mit der die Deutsche Bahn das System auf Messen und Veranstaltungen interessierten Personen anschaulich präsentieren kann.Released: October '21BackendFrontendUX/UI DesignElixirPhoenixIdeationErfahre mehr RadioeyeSeit Jahren ist die Forschungseinrichtung der Charité für ihre bahnbrechenden Arbeiten in vielen verschiedenen medizinischen Bereichen bekannt. Produkte, die von ihren Forschungsteams entwickelt wurden, werden in realen medizinischen Studien getestet, bevor sie in Krankenhäusern in ganz Deutschland eingeführt werden – zur Behandlung von Menschen und zur Rettung von Leben.Radioeye, ein Projekt der Charité Berlin, unterstützt Radiolog:innen bei der Diagnose seltener und atypischer Augenerkrankungen. In enger Zusammenarbeit mit dem Team von Radioeye und den Radiolog:innen haben wir deren Arbeitsabläufe und Produktanforderungen untersucht, um eine Webanwendung zu entwickeln, die nahtlos in ihren Arbeitsalltag integriert werden kann.Wir haben sowohl Low- als auch High-Fidelity-Wireframes erstellt und diese in mehreren Iterationen gemeinsam mit den klinischen Expert:innen verfeinert. Dabei haben wir strengste rechtliche Anforderungen für medizinische Produkte beachtet und ein Designsystem entwickelt, das wir nutzten, um vollständige visuelle Designs für jede der zuvor skizzierten Screens zu erstellen. Released: July '23IdeationBackendFrontendUX/UI DesignErfahre mehr"
