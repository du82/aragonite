title = "Datenschutzerklärung"
full_description = 'DatenschutzerklärungMit der folgenden Datenschutzerklärung möchten wir Sie darüber aufklären, welche Arten Ihrer personenbezogenen Daten (nachfolgend auch kurz als "Daten" bezeichnet) wir zu welchen Zwecken und in welchem Umfang verarbeiten.Diese Datenschutzerklärung regelt nur die Nutzung personenbezogener Daten auf unserer Website https://bitcrowd.net/ inklusive der Unterseiten und unserem Blog unter https://bitcrowd.dev/. Wenn Sie unsere Website über einen Link verlassen oder unsere Präsenz auf einer Social-Media-Plattform besuchen, verlassen Sie auch den Anwendungsbereich dieser Datenschutzerklärung.Die Bereitstellung des Onlineangebots macht die Verarbeitung verschiedener Informationen erforderlich. Sie sind nicht verpflichtet, uns personenbezogene Daten zu bereitzustellen. Soweit die Bereitstellung dieser Daten aber technisch zwingend mit dem Aufruf unseres Onlineangebots verbunden ist, führt eine Weigerung dazu, dass Sie unsere Website nicht betreten und nutzen können.Die Übertragung von Informationen zu oder von dieser Website wird mit einer TLS-Verschlüsselung abgesichert.Diese Datenschutzerklärung können Sie dauerhaft und jederzeit unter der Adresse https://next.bitcrowd.io/de/datenschutzerklärung abrufen, ausdrucken oder herunterladen.I. KontaktinformationenVerantwortlicher für die Datenverarbeitung im Rahmen dieser Website im Sinne der Datenschutz-Grundverordnung (DSGVO) ist:bitcrowd GmbHKöpenicker Straße 12610179 BerlinE-Mail-Adresse: info@bitcrowd.netTelefon: +49 30 55577597Wir haben zudem einen Datenschutzbeauftragten bestellt. Diesen erreichen Sie unter: dear-dpo@bitcrowd.netII. Allgemeines zur DatenverarbeitungUmfang der Verarbeitung personenbezogener DatenDie Bereitstellung der Website macht die Verarbeitung verschiedener Informationen erforderlich. Darüber hinaus richtet sich der Umfang der Datenverarbeitung nach Ihrer Nutzung der Funktionalitäten der Website, beispielsweise wenn Sie über das Kontaktformular mit uns kommunizieren) oder in die Verarbeitung von Daten einwilligen.Sie sind nicht verpflichtet, uns personenbezogene Daten zu bereitzustellen. Soweit die Bereitstellung dieser Daten aber technisch zwingend mit dem Aufruf unserer Seite verbunden ist, führt eine Weigerung dazu, dass Sie unsere Website nicht betreten und nutzen können.Als Besucher unserer Websites unterliegen Sie keiner automatisierten Entscheidungsfindung im Sinne von Art. 22 DSGVO.Rechtsgrundlage für die Verarbeitung personenbezogener DatenDie Rechtsgrundlagen für die Verarbeitung personenbezogener Daten werden nachfolgend dargestellt.VerarbeitungsgrundRechtsgrundlage in der DSGVOErläuterungVertragserfüllung oder Durchführung vorvertraglicher MaßnahmenArt. 6 Abs. 1 b)Eine Verarbeitung erfolgt nur in dem Umfang, der für die Wahrnehmung und Erfüllung der Rechte und Pflichten aus dem Vertrag erforderlich ist. Soweit nicht ausdrücklich anders dargestellt, erfolgt die Datenverarbeitung durch uns nur in diesem Umfang.Berechtigtes InteresseArt. 6 Abs. 1 f)Eine Verarbeitung erfolgt, soweit wir ein berechtigtes Interesse haben und keine entgegenstehenden überwiegenden Interessen des Betroffenen ersichtlich sind. Das konkrete Interesse wird in dieser Datenschutzerklärung im Rahmen der Verarbeitungsdarstellung erläutert.EinwilligungArt. 6 Abs. 1 a)Eine Verarbeitung erfolgt, soweit Sie hierzu ausdrücklich der Art und dem Umfang der Datenverarbeitung zugestimmt haben. Ihre Einwilligung können Sie jederzeit mit Wirkung für die Zukunft widerrufen. Die bis zu diesem Zeitpunkt erfolgte Verarbeitung wird davon aber nicht betroffen.Rechtliche PflichtArt. 6 Abs. 1 c)Eine Verarbeitung erfolgt, soweit dies zur Erfüllung deutscher oder europäischer gesetzlicher Pflichten erforderlich ist.Datenlöschung und SpeicherdauerWir löschen Ihre personenbezogenen Daten, sobald die Rechtsgrundlage für deren Verarbeitung entfällt. Teilweise können Rechtsgrundlagen aber auch parallel bestehen bzw. kann mit Wegfall einer Rechtsgrundlage eine neue eingreifen wie bspw. die Pflicht bestimmte Daten zur Erfüllung einer gesetzlichen Aufbewahrungspflicht zu speichern.III. Datenverarbeitung für Bereitstellung der WebsiteDamit wir Ihnen die Website anzeigen können, ist es erforderlich, bestimmte Informationen zu verarbeiten. Dies erfolgt bereits, wenn Sie unsere Website aufrufen. Zudem bieten wir auf unserer Website verschiedene Funktionalitäten an, die eine weitergehende Datenverarbeitung erforderlich machen.Log FilesEine Zusammenführung dieser Daten mit weiteren Daten über Sie erfolgt nicht. Die Speicherung der Log-Files inklusive Ihrer IP-Adresse dient dem berechtigten Interesse der Bereitstellung unserer Website und der Verhinderung derer missbräuchlicher Nutzung. Gespeicherte Logfiles werden spätestens nach Ablauf von 7 Tagen gelöscht, es sei denn eine längere Speicherung ist erforderlich, um beispielsweise einen Angriff auf unserer Website abzuwehren oder aufzuklären.KontaktaufnahmeSie haben über die auf der Website genannten Kontaktdaten jederzeit die Möglichkeit, uns eine Anfrage zu senden. Dabei verwenden wir die von Ihnen übermittelten Daten ausschließlich für die Beantwortung Ihrer Anfrage und die damit verbundene Kommunikation. Die Rechtsgrundlage dieser Verarbeitung Ihrer Daten hängt vom Inhalt Ihrer Anfrage ab. Grundsätzlich gilt hier unser berechtigtes Interesse an der Bereitstellung der Kontaktfunktionalität und der Beantwortung Ihrer darüber übermittelten Anfrage. Wenn Ihre Anfrage auf den Abschluss eines Vertrages mit uns gerichtet ist, erfolgt die Verarbeitung im Rahmen dieses vorvertraglichen Schuldverhältnisses.Ihre Daten werden gelöscht, sobald Ihrer Anfrage abschließend bearbeitet wurde. Im Falle eines Vertragsschlusses verarbeiten wir die Daten ggf. zur Vertragserfüllung weiter.BewerbungenSie haben über die auf der Website genannten Kontaktdaten jederzeit die Möglichkeit, uns eine Bewerbung zu senden. In diesem Falle erheben, verarbeiten und nutzen wir Ihre personenbezogenen Daten zur Bearbeitung Ihrer Bewerbung. Ihre Bewerberdaten werden nur zu diesem Zweck und im Rahmen der gesetzlichen Bestimmungen verwendet. Ihre Daten werden hierbei vertraulich behandelt. Wir erfassen nur solche personenbezogenen Daten von Ihnen, die für das Bewerbungsverfahren erforderlich sind. Rechtsgrundlage ist Art. 6 Abs. 1 lit. b) DSGVO (Vertragsanbahnung) i. V. m. § 26 BDSG. Nach erfolgter Bearbeitung werden Ihre Daten gesperrt bzw. gelöscht, in der Regel nach 6 Monaten, soweit wir die Daten nicht weiter behalten dürfen, z. B. weil Sie dem zugestimmt haben oder gesetzliche Aufbewahrungspflichten bestehen.IV. CookiesWir setzen auf unserer Website für verschiedene Zwecke Cookies ein. Ein Cookie ist eine kleine Textdatei mit Informationen, die durch Ihren Browser übermittelt und auf Ihrem Rechner gespeichert wird. Diese Cookies beinhalten keine persönlichen Daten. Sie können die Verwendung von Cookies auch in Ihrem Browser steuern und Cookies selbst jederzeit löschen. Sofern die nachfolgend genannten Cookies über eine eigene Möglichkeit verfügen, sie zu löschen oder zu blockieren ist diese in der jeweiligen Beschreibung dargestellt. Cookies können erforderlich für die Verbindungsherstellung bzw. die Verbesserung der Nutzung der Website sein.Sie können die Speicherung der Cookies durch eine entsprechende Einstellung Ihrer Browser-Software verhindern; wir weisen Sie jedoch darauf hin, dass Sie in diesem Fall gegebenenfalls nicht sämtliche Funktionen dieser Website vollumfänglich werden nutzen können.Der Einsatz technisch notwendiger Cookies und die damit verbundene Datenverarbeitung erfolgt aufgrund unseres berechtigten Interesses an der Bereitstellung unserer Website. Technisch erforderliche Cookies werden in der Regel beim Schließen Ihres Browsers automatisch gelöscht (Session-Cookies), in anderen Fällen erst nach einiger Zeit (Persistent-Cookies). Die Speicherdauer von Persistent Cookies wird vom Anbieter bestimmt und kann von Ihnen beispielsweise in Ihrem Browser eingesehen werden.Technisch bedingte CookiesTechnisch bedingte Cookies dienen dazu, Ihnen zusätzliche Funktionalitäten oder eine komfortablere Nutzung der Website zu ermöglichen, bspw. durch Speicherung ihrer Länder- oder Spracheinstellung. Auch die technisch bedingten Cookies werden in der Regel beim Schließen Ihres Browsers automatisch gelöscht (Session-Cookies), in anderen Fällen aber erst nach längerer Zeit (Persistent-Cookies). Die Speicherdauer kann in Ihrem Browser eingesehen werden. Rechtsgrundlage ist Ihre Einwilligung gem. Art. 6 Abs. 1 lit. a) DSGVO und § 25 Abs. 1 TTDSG.1.1 YouTubeVideo-Plattform; Dienstanbieter: Google Ireland Limited, Gordon House, Barrow Street, Dublin 4, Irland, Mutterunternehmen: Google LLC, 1600 Amphitheatre Parkway, Mountain View, CA 94043, USA; Website: https://www.youtube.com; Datenschutzerklärung: https://policies.google.com/privacy; Widerspruchsmöglichkeit (Opt-Out): Opt-Out-Plugin: http://tools.google.com/dlpage/gaoptout?hl=de, Einstellungen für die Darstellung von Werbeeinblendungen: https://adssettings.google.com/authenticated.1.2 VimeoVideo-Plattform; Dienstanbieter: Vimeo Inc., Attention: Legal Department, 555 West 18th Street New York, New York 10011, USA; Website: https://vimeo.com; Datenschutzerklärung: https://vimeo.com/privacyCookies zur NutzungsanalyseAnalyse- und Tracking-Cookies dienen dazu, Ihr Nutzungsverhalten bei Inanspruchnahme unserer Dienste bzw. Ihres Besuchs unserer Website zu erfassen und auszuwerten. Dabei erfahren wir beispielsweise, wie oft bestimmte Funktionalitäten genutzt oder Inhalte gelesen werden oder ob Sie über eine von uns geschaltete Werbeanzeige zu uns gekommen sind. Wir nutzen diese Daten um die Nutzbarkeit dieser Website sowie die Attraktivität der Leistungen weiter verbessern.Rechtsgrundlage ist Ihre Einwilligung gem. Art. 6 Abs. 1 lit. a) DSGVO und § 25 Abs. 1 TTDSG. Sie können die Speicherung der Cookies unterbinden. Zusätzlich zur Möglichkeit, diese in den Einstellungen Ihrer Browser-Software zu verhindern, bieten die einzelnen Cookies meist eine eigene Möglichkeit, sie zu blocken bzw. zu deaktivieren. Dies ist dann nachfolgend jeweils so dargestellt.Die Datenverarbeitung zur Nutzungsanalyse erfolgt während Ihres Besuchs unserer Website und nur bis zu dem Zeitpunkt Ihres wirksamen Widerspruchs.2.1 MatomoDiese Webseite nutzt den Analysedienst Matomo der InnoCraft Ltd, 7 Waterloo Quay PO625, 6140 Wellington, Neuseeland. Der Dienst wird lokal auf einem eigenen Server Server [bzw. bei einem Auftragsverarbeiter] gehostet, so dass eine Datenübertragung an Dritte und damit eine Zusammenführung der Nutzungsdaten über Anbietergrenzen hinweg nicht stattfindet.Die Nutzungsanalyse dazu, Ihr Nutzungsverhalten bei Inanspruchnahme unserer Dienste bzw. Ihres Besuchs unserer Website zu erfassen und auszuwerten. Dabei erfahren wir beispielsweise, wie oft bestimmte Funktionalitäten genutzt oder Inhalte gelesen werden. Wir nutzen diese Daten um die Nutzbarkeit dieser Website sowie die Attraktivität der Leistungen weiter verbessern.Rechtsgrundlage der Datenverarbeitung ist unser berechtigtes Interesse gem. Art. 6 Abs. 1 f) DSGVO. Die Datenverarbeitung zur Nutzungsanalyse erfolgt während Ihres Besuchs unserer Website und nur bis zu dem Zeitpunkt Ihres wirksamen Widerspruchs.Sie können das Tracking durch unsere Matomo Analytics Instanz nachfolgend deaktivieren:2.2 Plausible.ioZum Zwecke der Nutzungsanalyse unserer Webseite verwenden wir das Tool Plausible.io der Plausible Insights OÜ, Västriku tn 2, 50403, Tartu, Estonia. Dabei werden Nutzerdaten nicht über ihre Geräte und die von ihnen besuchten Websites und Apps hinweg zusammengeführt. Alle Daten werden nur für einen einzigen Tag, eine einzige Website und ein einziges Gerät erfasst. Es gibt keine Möglichkeit zu erfahren, ob dieselbe Person eine Website von mehr als einem Gerät aus besucht oder eine andere Website aufruft. Verwendet werden die IP-Adresse und der User-Agent, die jede einzelne HTTP-Anfrage an den Server sendet. Aus der IP-Adresse und dem User-Agent des Besuchers wird eine täglich wechselnde Kennung generiert. Um diese Datenpunkte zu anonymisieren und einen Rückschluss auf den Nutzer unmöglich zu machen, wird sie durch eine Hash-Funktion mit einem rotierenden Salt laufen gelassen. Plausible ist als Auftragsverarbeiter gem. Art. 28 (3) DSGVO eingebunden. Mehr Informationen zur Datenverarbeitung durch Plausible finden Sie hier: https://plausible.io/data-policy2.3 Leadfeeder / DealfrontWir verwenden den Tracking-Dienst Leadfeeder der Liidio Oy, Keskuskatu 6 E, 00100 Helsinki, Finnland. Mit Hilfe von Leadfeeder ist es möglich, die Unternehmen, die unsere Webseite besuchen, zu identifizieren, um diese gezielt ansprechen zu können. Leadfeeder erfasst zunächst die IP-Adressen der Nutzer unseres Online-Angebots. Der Dienst verlinkt die Liste der IP-Adressen anschließend mit Informationen über die Unternehmen, die unter diesen IP-Adressen zu finden sind. Aufgrund einer Kürzung der IP- Adressen der Websitebesucher wird kein direkter Personenbezug hergestellt. Ein Personenbezug kann sich möglicherweise bei der Durchsicht der verlinkten Unternehmensinformationen ergeben. Im Zusammenhang mit der Nutzung von Leadfeeder kommen auch Cookies zum Einsatz.Weitere Informationen zu den gesammelten Daten und zum Datenschutz bei Leadfeeder finden Sie unter: https://www.leadfeeder.com/privacy/ und https://www.leadfeeder.com/leadfeeder-and-gdpr/.V. Soziale NetzwerkeWir betreiben eigene Präsenzen in den sozialen Netzwerken Facebook, Instagram, LinkedIn, X, Youtube (Google Ireland Limited) und Mastodon (Instanz: GenServer Social). Diese Netzwerke verarbeiten Ihre personenbezogenen Daten zum Beispiel, um Ihren Interessen entsprechende Nutzungsprofile zu erstellen. Zu diesem Zweck können Cookies auf Ihrem Gerät gespeichert werden. Genauere Informationen zur Datenverarbeitung durch die einzelnen Netzwerke finden Sie in den jeweiligen Datenschutzinformationen sowie ggf. in den Cookie-Richtlinien der Netzwerke:ht