title = "Bitmark: Secure Digital Property Rights"
description = "Bitmark develops technology that secures the property rights of unique digital assets, without relying on trusted third parties."
full_description = "Bitmark makes tools that advance human autonomy.A blockchain is a new type of computer that can be shared by anyone without having to ask permission. It’s open and yet secure — protected with cryptography and consensus technology. Bitmark was established in 2014, after we saw glimpses of how this could lead to a better society. Institutions require accountants, lawyers, regulators, and police. This increases bureaucracy, risk, and stress to society. Regulation can be captured. In short, our existing institutions are expensive to scale. The breakthrough idea behind the blockchain is that trust can be built through excess computing resources: Code can implement data integrity. Since computing follows Moore’s law, society will have more computing resources for less money over time. Simultaneously, we can increase individual autonomy and reduce corruption. Blockchain programs, known as smart contracts, create and manage data in the form of digital assets. These assets can function as financial instruments or represent unique digital items, such as media or software. Bitmark develops technology that secures the property rights of unique digital assets, without relying on trusted third parties. At first glance, this seem laughably inferior to the property rights a government could secure. But scale up blockchains to the world, and the potential is clear: they are the building blocks to strengthen, rebuild, and invent the institutions that society will need to thrive into the coming centuries. Bitmark has worked across essential services such as life sciences, entertainment, and digital identity. We are currently building Feral File, a platform for showcasing and collecting software art, co-founded with Casey Reas. We are a distributed team with people across Asia, Europe, and the United States. We are always hiring."
