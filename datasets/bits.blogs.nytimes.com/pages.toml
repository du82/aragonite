full_description = "Does the F.B.I. Need Apple to Hack Into iPhones?There are tools to crack into the phones at the center of a new dispute over encryption. But the F.BI. says it still needs Apple’s aid.By Jack Nicas This Week in Tech: What on Earth Is a Quantum Computer?The question isn’t so easy to answer. Also, Google’s founders stepped away just as their company enters a turbulent adulthood.By Cade Metz The Week in Tech: A.I.’s Threat to White-Collar JobsSome workers may be more exposed to artificial intelligence than previously thought. But worry more about automation’s threat to less skilled employees.By Jamie Condliffe The Week in Tech: TikTok Is in TroubleThe video app has been a runaway success around the world. But U.S. lawmakers have recently taken a strong disliking to it.By Jamie Condliffe The Week in Tech: WhatsApp’s Spyware Fight Is at Least Good P.R.The messaging service is suing a cybersurveillance company. Whether it’s successful or not, it is a strong statement from WhatsApp and its owner, Facebook.By Jamie Condliffe The Week in Tech: Amazon Muscles In on Seattle ElectionThe hometown tech giant has contributed more than $1.4 million this year to influence City Council races.By Karen Weise The Week in Tech: Are You Ready for Facebook’s Future?We got a glimpse of what the social network’s privacy-first focus might look like in practice. You may not love it.By Jamie Condliffe The Week in Tech: Facebook’s First Step Toward Treating Our Data BetterThe social network’s latest privacy feature at least lets us imagine how we could better control our data in the future.By Jamie Condliffe The Week in Tech: Are Lawmakers Too Eager to Weaken Big Tech’s Legal Shield?Revising Section 230 could change the internet as we know it. How about policy decisions based on sound evidence?By Jamie Condliffe The Week in Tech: How Does 8chan Whack-a-Mole End?Efforts to take a controversial website offline have been complex and divisive. But with any luck, they may also be galvanizing.By Jamie Condliffe"
