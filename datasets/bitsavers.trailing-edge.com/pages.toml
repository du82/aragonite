["https://bitsavers.trailing-edge.com/simh.trailing-edge.com_201206"]
title = "The Computer History Simulation Project"
full_description = "The Computer History Simulation Project is a loose Internet-based collective of people interested in restoring historically significant computer hardware and software systems by simulation. The goal of the project is to create highly portable system simulators and to publish them as freeware on the Internet, with freely available copies of significant or representative software. V3.9 (and bug fixes to it) is the last release of SimH that will be hosted at this web site. All future versions can be found in a public source repository. Also available is a collection of tools for manipulating simulator file formats and for cross-assembling code for the PDP-1, PDP-7, PDP-8, and PDP-11."
