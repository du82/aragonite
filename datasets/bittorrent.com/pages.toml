title = "Acerca de BitTorrent | Creador del mayor protocolo P2P del mundo"
description = "Más información acerca de BitTorrent - la empresa responsable de la creación del protocolo de comunicaciones P2P descentralizado más grande del mundo - y de sus productos más conocidos."
full_description = "Acerca de BitTorrentBitTorrent Limited, es la empresa que administra el protocolo de comunicaciones P2P descentralizado más utilizado para la distribución de datos y archivos de gran tamaño a través de Internet. El protocolo BitTorrent transformó desde el día de su lanzamiento el mundo del intercambio de archivos, al agilizar las descargas tanto para los usuarios individuales como para las organizaciones que necesitan transferir grandes cantidades de datos. Antes de BitTorrent, las descargas de archivos se iniciaban desde un servidor centralizado o un usuario individual (par), lo cual no permitía alcanzar velocidades de descarga elevadas. El protocolo BitTorrent resolvió esta limitación gracias a que permite la carga y descarga de archivos entre muchos usuarios a la vez. Millones de usuarios comenzaron a utilizarlo para descargar y compartir archivos, y las empresas descubrieron que podía servirles para distribuir los datos de una forma más eficaz. En la actualidad, el protocolo BitTorrent transporta un importante porcentaje del tráfico diario de Internet en todo el mundo. No solamente es la red punto a punto más grande, sino también la base sobre la que se asienta la Web3, aparte de ser una de las comunidades internacionales más grandes de Internet. Esto demuestra que la tecnología es más sólida y relevante que nunca, y ahora está impulsada por el poder de la tecnología blockchain (cadena de bloques).La empresa desarrolla actualmente sus productos con dos marcas, BitTorrent (https://www.bittorrent.com) y µTorrent (https://www.utorrent.com), que ofrecen conocidos clientes de descarga de torrents para Windows, Mac y Android. Sus aplicaciones se han descargado más de 2000 millones de veces.La empresa está ampliando rápidamente los posibles casos de uso de sus protocolos descentralizados, para lo cual ha creado la última generación de tecnología de streaming en directo. De esta forma creará un nuevo modelo en el panorama industrial que utilizará la gran red P2P internacional de la empresa para conectar a los creadores de contenido directamente con su audiencia sin necesidad de una plataforma centralizada."
