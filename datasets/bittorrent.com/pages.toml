evice pairing password when updating device info graphic – Point Remote “Learn More” link to better URL – Disable localhost/search lookup when making searches. Do not rely on the localhost port-10k discoverability – Use a CRNG as a WebUI token source – Require device/service pairing or standard webui authentication for the /proxy endpoint – Sanity check Host header on HTTP requests – Remove automatic discoverability feature over port 10000. The setting net.discoverable no longer exists. – WebUI action getsettings is only allowed for fully authenticated user (not guest) – Fix crash when sending malformed requests to /fileserve – Fix forced re-install mode when same version is already installed – Set uninstaller prompt dialog title – Remove Nexway cart URLs – License key information is no longer exposed via WebUI BitTorrent 7.10.0 For Windows (build 43917)June 28, 2017– Update AV download/update URL for Pro – Hide tabs for “My Pro Account” page – Warn user before attempting to launch files with masked extensions BitTorrent 7.10.0 For Windows (build 43581)April 05, 2017– Bump version to 7.10.0 – Fix a bug that could have caused the webui to set an invalid port – Update uTorrent Pro Antivirus integration. – Remove old OpenCandy integration code – Introduce a new uTorrent Pro payments partner: Nexway – Fix broken in-client pro info page. Reachable via Help ->My Pro Account – Fix bug that would cause Ad audio to incorrectly play when user is not using the client – Allow muting of ad sound when moving mouse outside of Ad window – Fix potential crash when activating a uTorrent Pro license – Disable the ‘Install Teredo” button on Win 7 and higher. We no longer support Teredo on these systems – Fix a potential XSS when attempting to pair remotely to a running client instance – Fix memory leak when activating a uTorrent Pro key – Fix a bug in the WebHelper process that would cause it to crash repeatedly – Fix a connection handling bug that would cause torrents with webseeds to