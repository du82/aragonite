["https://bittorrent.com/nl/company/about-us"]
title = "Over BitTorrent | Maker van het meest toonaangevende P2P-protocol ter wereld"
description = "Lees meer over BitTorrent - het bedrijf achter de oprichting van het grootste gedecentraliseerde P2P-communicatieprotocol ter wereld - en haar populaire producten."
full_description = "Over BitTorrentBitTorrent Limited, is het bedrijf achter het grootste gedecentraliseerde P2P-communicatieprotocol voor de distributie van gegevens en grote bestanden via internet. Toen het BitTorrent-protocol werd geïntroduceerd, veranderde dit de wereld waarin bestanden worden gedeeld doordat downloads werden versneld voor zowel particulieren als zakelijke gebruikers die grote hoeveelheden gegevens overdragen. Vóór BitTorrent werden bestanden gedownload vanaf een gecentraliseerde server of bij een enkele gebruiker (een peer), wat resulteerde in lage downloadsnelheden. Het BitTorrent-protocol pakte deze beperking aan door het downloaden en uploaden van bestanden tussen veel gebruikers mogelijk te maken. Miljoenen gebruikers gingen het BitTorrent-protocol gebruiken om bestanden te downloaden en delen, en bedrijven namen het protocol in gebruik om gegevens efficiënter te verspreiden. Het BitTorrent-protocol is vandaag de dag verantwoordelijk voor een aanzienlijk percentage van het internetverkeer wereldwijd. BitTorrent is niet alleen het grootste peer-to-peer netwerk, het is de basis van Web3, en een van de grootste wereldwijde community's op internet. Dat is het bewijs dat de technologie relevanter is dan ooit, robuuster, en nu gedreven door de kracht van blockchain.Momenteel ontwikkelt het bedrijf producten onder twee merknamen, BitTorrent (https://www.bittorrent.com) en µTorrent (https://www.utorrent.com), die populaire downloadclients voor torrents voor Windows, Mac en Android aanbieden. De toepassingen zijn al meer dan 2 miljard keer gedownload.Het bedrijf is hard op weg om de gebruiksmogelijkheden van zijn gedecentraliseerde protocollen uit te breiden door de volgende generatie live streamingtechnologie te ontwikkelen. Dit zal het landschap in de sector opnieuw vormgeven doordat hierbij gebruik wordt gemaakt van het robuuste wereldwijde P2P-netwerk van het bedrijf om content creators rechtstreeks in contact te brengen met hun publiek zonder dat daarvoor een gecentraliseerd platform nodig is."
