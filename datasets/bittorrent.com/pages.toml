["https://bittorrent.com/pt/company/about-us"]
title = "Sobre BitTorrent | Criador do Protocolo P2P Líder no Mundo"
description = "Leia mais sobre BitTorrent - a empresa por detrás da criação do maior protocolo de comunicações P2P descentralizado do mundo, e dos seus produtos populares."
full_description = "Sobre BitTorrentBitTorrent Limited é a empresa por trás do maior protocolo de comunicações P2P descentralizado para a distribuição de dados e ficheiros volumosos através da Internet. Quando o protocolo BitTorrent foi introduzido, transformou o mundo da partilha de ficheiros ao acelerar as transferências de utilizadores individuais e organizações que necessitavam de transferir grandes quantidades de dados. Antes do BitTorrent, as transferências de ficheiros eram iniciadas a partir de um servidor centralizado ou de um utilizador individual (um elemento da rede), resultando em velocidades de transferência lentas. O protocolo BitTorrent removeu esta limitação ao permitir a transferência e o carregamento de ficheiros entre um grande número de utilizadores. Milhões de utilizadores começaram a recorrer ao protocolo BitTorrent para transferir e partilhar ficheiros, e as empresas começaram a utilizar o protocolo para distribuir dados de forma mais eficiente. Atualmente, o protocolo BitTorrent alimenta uma percentagem significativa do tráfego diário na Internet a nível mundial. Não só é a maior rede ponto a ponto, como também os alicerces da Web3 e uma das maiores comunidades globais da Internet. Prova de que a tecnologia é mais importante do que nunca, robusta e beneficia agora do poder da cadeia de blocos (blockchain).Presentemente, a empresa desenvolve produtos através de duas marcas, BitTorrent (https://www.bittorrent.com) e µTorrent (https://www.utorrent.com), as quais oferecem clientes de transferência de torrents populares para Windows, Mac e Android. As aplicações foram transferidas mais de 2 mil milhões de vezes.A empresa caminha a passos largos para expandir os casos de utilização dos seus protocolos descentralizados através da criação da próxima geração de tecnologia de streaming em direto. Irá moldar a paisagem da indústria ao utilizar a robusta rede P2P global da empresa para ligar criadores de conteúdos diretamente aos seus públicos sem necessitarem de uma plataforma centralizada."
