["https://bittorrent.com/legal/privacy-policy"]
title = "BitTorrent | Privacy Policy"
description = "BitTorrent is committed to respecting the privacy rights and concerns of all our users. You can read our privacy policy in full by clicking or tapping here."
full_description = "Privacy Policy Last Updated: December 4, 2023 BitTorrent Limited and our subsidiaries (including uTorrent, Inc. and DTV Limited) (collectively, “BitTorrent,” “we,” “us” and “our”) are technology companies that are responsible for creating the largest decentralized communications protocol for distributing data over the Internet by providing peer-to-peer protocol and associated clients. Please also refer to our End User License Agreement (EULA), Terms of Use and Copyright Infringement Policy for additional information. The purpose of this Privacy Policy is to provide you with information on BitTorrent’s use of your personal information or personal data in accordance with applicable laws, including the British Virgin Islands Data Protection Act, 2021 (“Applicable Laws”). NOTICE AT COLLECTION At or before the time of collection, California residents may have a right to receive notice of our practices, including the categories of personal information to be collected, the purposes for which such information is collected or used, whether such information is sold or shared, and how long such information is retained. You can find those details as it relates to personal information that is subject to this Privacy Policy by clicking on the above links. SCOPE PERSONAL INFORMATION WE COLLECT HOW WE USE PERSONAL INFORMATION HOW WE DISCLOSE PERSONAL INFORMATION YOUR PRIVACY CHOICES AND RIGHTS INTERNATIONAL TRANSFERS OF PERSONAL INFORMATION RETENTION OF PERSONAL INFORMATION SUPPLEMENTAL NOTICE FOR CALIFORNIA RESIDENTS SUPPLEMENTAL NOTICE FOR CERTAIN INTERNATIONAL COUNTRIES CHILDREN’S INFORMATION THIRD-PARTY WEBSITES/APPLICATIONS UPDATES TO THIS PRIVACY POLICY CONTACT US SCOPE This Privacy Policy applies to personal information processed by us, including on our websites, mobile applications, software, and other online or offline offerings. BitTorrent’s software called the “BitTorrent” applications or the “uTorrent” applications are sometimes collectively referred to hereunder as the “BitTorrent Client.” BitTorrent’s other applications, including, but not limited to, BitTorrent Live and BitTorrent Now, are sometimes referred to hereunder as “BitTorrent Other Applications.” The BitTorrent Client and BitTorrent Other Applications are sometimes collectively referred to as the “software”. To make this Privacy Policy easier to read, our websites, mobile applications, software, and other offerings are collectively called the “Services.” PERSONAL INFORMATION WE COLLECT The categories of personal information we collect depend on how you interact with us, our Services, and the requirements of Applicable Laws. We collect information that you provide to us, information we obtain automatically when you use our Services, and information from other sources such as third-party services and organizations, as described below. An Important Note: This Privacy Policy does not apply to the information practices of other companies and organizations that advertise our Services or to services offered by other companies or individuals, including products or sites that they offer that may include our Services, or to products or sites that may be displayed to you in search results that may be linked from our Services. In those cases, their respective privacy policies govern their collection and use of personal information in connection with the products and services they offer. Any questions or requests relating to personal information processed by these other companies or individuals should be directed to them. Information You Provide to Us Directly We may collect the following personal information that you provide to us. Account Creation. When you create an account, we may collect information such as name, email address, password, and log-in/display name. Purchases. We may collect personal information and details associated with your purchases, including payment information. Any payments made via our Services are processed by third-party payment processors. We do not directly collect or store any payment card information entered through our Services, but it may receive information associated with your payment card information (e.g., your billing details). Your Communications with Us. We may collect personal information, such as name, email address, company name, phone number, mailing address, date of birth, gender, interests, product, operating system, order number, or details of your request when you ask for information about our Services, register for our newsletter or mailing list, request customer or technical support, apply for a job, or otherwise communicate with us. Surveys. We may contact you to participate in surveys. If you decide to participate, you may be asked to provide certain information which may include personal information. We may present this information to our advertisers and partners, in the form of grouped statistics compiled from our users’ answers to such questions. Interactive Features. We and others who use our Services may collect personal information that you submit or make available through our interactive features (e.g., messaging and chat features, commenting functionalities, forums, blogs, and social media pages). Any information you provide using the public sharing features of the Services (referred to herein as “User Content”) will be considered “public,” unless otherwise required by Applicable Laws, and is not subject to the privacy protections referenced herein. Please exercise caution before revealing any information that may identify you in the real world to other users. Sweepstakes or Contests. We may collect personal information you provide for any sweepstakes or contests that we offer. In some jurisdictions, we are required to publicly share information of sweepstakes and contest winners. Conferences, Trade Shows, and Other Events. We may collect personal information from individuals when we attend conferences, trade shows, and other events. Business Development and Strategic Partnerships. We may collect personal information from individuals and third parties to assess and pursue potential business opportunities. Job Applications. We may post job openings and opportunities on our Services. If you reply to one of these postings by submitting your application, CV and/or cover letter to us, we will collect and use your information to assess your qualifications. Information Collected Automatically We may collect personal information automatically when you use our Services: Automatic Data Collection. We may collect certain information automatically when you use our Services, such as your Internet protocol (IP) address, port number, user settings, MAC address, cookie identifiers, mobile carrier, mobile advertising and other unique identifiers, browser, software or device information, and Internet service provider. We may also automatically collect information regarding your use of our Services, such as pages that you visit before, during and after using our Services, information about the links you click, the types of content you interact with, the frequency and duration of your activities, and other information about how you use our Services. In addition, we may collect information that other people provide about you when they use our Services, including information about you when they tag you. Location Information. We may collect your precise location information to provide you with enhanced Services. BitTorrent Speed Application: BitTorrent Speed is a BitTorrent feature that aims to increase the download speed and efficiency of torrent swarms (i.e., a group of people, which may include you, that own a particular file (or pieces of the file)). For more information about BitTorrent Speed, please click here. By using BitTorrent Speed, we will collect information to operate and improve BitTorrent Speed, including a wallet address (i.e., a public key associated with your wallet) and a private ledger that contains, BTT balance, payments used in the wallet, and timestamps when activity channel is opened and closed. uTorrent Lite Application: uTorrent Lite is an app-less torrenting Client that works seamlessly on your browser, allowing you to fetch, assemble and view the immediate next set of torrent file blocks from peers. uTorrent Lite reaches other peers while downloading content, therefore user IP address is exposed to other users. However, uTorrent Lite does not collect or store user IP information. µTorrent Lite will use your browser’s memory to temporarily store torrent file blocks so as to reduce buffering while streaming content. uTorrent Lite also uses Google Analytics to collect product engagement data. Cookies, Pixel Tags/Web Beacons, and Other Technologies. We, as well as third parties that provide content, advertising, or other functionality on our Services, may use cookies, pixel tags, local storage, and other technologies (“Technologies”) to automatically collect information through your use of our Services. Cookies. Cookies are small text files placed in device browsers that store preferences and facilitate and enhance your experience. In addition, advertisements displayed on the Sites or in the Software may contain cookies. Pixel Tags/Web Beacons. A pixel tag (also known as a web beacon) is a piece of code embedded in our Services that collects information about engagement on our Services. The use of a pixel tag allows us to record, for example, that a user has visited a particular web page or clicked on a particular advertisement. We may also include web beacons in e-mails to understand whether messages have been opened, acted on, or forwarded. Our uses of these Technologies fall into the following general categories: Operationally Necessary. This includes Technologies that allow you access to our Services, applications, and tools that are required to identify irregular website behavior, prevent fraudulent activity and improve security or that allow you to make use of our functionality; Performance-Related. We may use Technologies to assess the performance of our Services, including as part of our analytic practices to help us understand how individuals use our Services (see Analytics below); Functionality-Related. We may use Technologies that allow us to offer you enhanced functionality when accessing or using our Services. This may include identifying you when you sign into our Services or keeping track of your specified preferences, interests, or past items viewed; Advertising- or Targeting-Related. We may use first party or third-party Technologies to deliver content, including ads relevant to your interests, on our Services or on third-party websites. See “Your Privacy Choices and Rights” below to understand your choices regarding these Technologies. Analytics. We may use Technologies and other third-party tools to process analytics information on our Services. Some of our analytics partners include: Google Analytics. For more information, please visit Google Analytics’ Privacy Policy. To learn more about how to opt-out of Google Analytics’ use of your information, please click here. Social Media Platforms. Our Services may contain social media buttons such as Facebook, Twitter, Instagram, Telegram, Twitch, Pinterest and YouTube (that might include widgets such as the “share this” button or other interactive mini programs). These features may collect your IP address, which page you are visiting on our Services, and may set a cookie to enable the feature to function properly. We may also participate in co-branding and other relationships to offer e-commerce and other services and features to our users. Your interactions with these platforms are governed by the privacy policy of the company providing it. Information Collected from Other Sources We may obtain information about you from other sources, including through third-party services and organizations. For example, if you access our Services through a third-party application, such as an app store, a third-party login service, or a social networking site, we may collect basic account information about you from that third-party application or social media provider (such as your name, address, phone number and e-mail address, and other demographic information, like your date of birth, gender, age and interests) that you have made available via your privacy settings. HOW WE USE PERSONAL INFORMATION Subject to Applicable Laws, we use personal information for a variety of business purposes, including to provide our Services, for administrative purposes, and to market our products and Services, as described below. Provide Our Services We use personal information to fulfill our contract with you and provide you with our Services, such as: Managing your information and accounts; Providing access to certain areas, functionalities, and features of our Services; Answering requests for customer or technical support; Communicating with you about your account, activities on our Services, and policy changes; Processing your financial information and other payment methods for products or Services purchased; Processing applications if you apply for a job we post on our Services; and Allowing you to register for events. Administrative Purposes We use personal information for various administrative purposes, such as: Pursuing our legitimate interests such as direct marketing, research and development (including marketing research), network and information security, and fraud prevention; Detecting security incidents, protecting against malicious, deceptive, fraudulent or illegal activity, and prosecuting those responsible for that activity; Measuring interest and engagement in our Services; Short-term, transient use, such as contextual customization of ads; Improving, upgrading or enhancing our Services; Developing new products and Services; Ensuring internal quality control and safety; Authenticating and verifying individual identities, including requests to exercise your rights under this policy; Debugging to identify and repair errors with our Services; Auditing relating to interactions, transactions and other compliance activities; Sharing information with third parties as needed to provide the Services; Enforcing our agreements and policies; Complying with our legal obligations; and To provide anonymous reporting for internal and external clients. Marketing and Advertising our Products and Services We may use personal information to tailor and provide you with content and advertisements. We may provide you with these materials as permitted by Applicable Laws. Some of the ways we market to you may include email campaigns, custom audiences advertising , and “interest-based” or “personalized advertising,” including through cross-device tracking. If you have any questions about our marketing practices or if you would like to opt out of the use of your personal information for marketing purposes, you may contact us at any time as set forth in “Contact Us” below. Other"
