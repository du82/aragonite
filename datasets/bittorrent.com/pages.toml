can no longer generate pop ups or download content to disk. – DHT update (BEP44) – Bug fixes and stability improvements. BitTorrent 7.9.7 for Windows (build 42331)December 19, 2016– Do not allow adding single file torrent from webinterface to uTorrent root directory (Security fix) – Fix regression: move torrent after completion – Fix potential crash when automatically restoring node selection – Fix IE frame related crashes – Mechanism to limit the resources used by Advertisement – Fix a potential crash in .btsearch parsing PopularHappy Holidays from BitTorrent Starts Now! 25% OFF Pro and Pro+VPNBy Scott McDonaldCheck out our Improvements to the New BitTorrent Help Center!By Scott McDonaldBlack Friday Deal! 2nd Year Free on All Premium Windows and Mac ProductsBy Scott McDonald"
