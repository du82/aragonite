["https://bjoernkarmann.dk/project/trajectories"]
title = "Trajectories - Bjørn Karmann"
full_description = "Every day millions of people write spatial stories. Stories that only the fewest will ever be able to read. TRAJECTORIES is a media installation, that can reveal these spatial stories, that are written by millions of city-dwellers wandering about their daily matters. TRAJECTORIES reveals the invisible traces of our everyday mobility. Real mobility data provided by our mobility app ‘moovel’ is automatically dripped on an illuminated paper canvas. Printing the intersecting movements with melted wax creates a mobility narrative mapping the spatial stories over time. The wax picture that is generated on canvas accumulates more and more lines and slowly unveils a panoptic view of the city. Using color coded wax allows the installation to displays different modes of transport in the mobility relief. The starting- and end-point of moovel trip searches for a given are used to preprocess routes for TRAJECTORIES’ print job. Two driving shafts maneuver to the X and Y position of the printing head, that drips the heated wax on the canvas to form the previously calculated route."
