["https://bjoernkarmann.dk/project/uae_pavillion"]
title = "UAE Pavillion - Bjørn Karmann"
full_description = "As lead experience designer for the UAE Pavillion at the World Expo Dubai 2020, I helped tell an incredibly ambitious story as part of my role at Tellart. I had the pleasure to lead large aspects of the multisensorial and interactive experience from concept to opening. Guiding design teams, architects, builders and many more to realize our clients and our own vision for the pavilion. Tellart partnered with experience architects Kossmanndejong to co-design the guest experience for the United Arab Emirates Host Pavilion at Expo 2020 Dubai, crafting a multi-sensory guest experience celebrating the country’s past, present and future. Our shared vision was to tell an authentic story that would help guests see the humble roots and the core values that drive the UAE’s breakthrough achievements and its vision for the future. Visitors take a multi-sensory journey within Santiago Calatrava’s magnificent falcon-inspired building through eight interactive and immersive sections: each one telling a different chapter of the nation’s story, bringing to life the rich nuances of Emirati culture and values. We looked beyond the region’s famed desert landscapes for inspiration to create an intimate experience that not only embodies the heart of a nation, but makes it relatable to the rest of the world on a massive scale. The visitor journey goes through a series of immersive interactive installations. For example, Unity witch is an 8m wide circular space that invites visitors to move with sound and patterns in unison. While moving, their collective motion creates a collective artwork. Tying the group together. The sound design through out the different exhibits where all holisticly designed in sync alowing for organic blend in the large open space. Although I have designed and worked on large exhibitions before, this was on a much larger scale. The 2 years have been a huge growth and gained isnight into working in the middle east, navigating politics, communicating with royal clients, juggling multiple teams across multiple countries and keeping a holistic overview of the design language and narrative, all in suport of amazing and talented people."
year_published = 2025
year_updated = 2024
