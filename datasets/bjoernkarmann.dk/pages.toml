["https://bjoernkarmann.dk/project/abstract"]
title = "Abstract - Bjørn Karmann"
full_description = "We are living in a time with a growing interest for unique and personal products as well as authentic experiences. With Abstract_ we want to give the customers a new connection to the cloth they buy. With Abstract_ you express your personal story through customized garments. Customers are involved in the design process by generating patterns from their own personal stories. The web shop analyzes what the customer writes and how it is written, by tracking the rhythm of the keyboard strokes. The webcam will analyze the facial expression and let this data influence the color and structure of the pattern. The web shop will transforms the customers data into a unique pattern and Abstract_ will make the unique personal pattern into a textile and a unique piece of garment. We wanted to make a concept that took the level of what the consumer can have influence on even further than we already have seen. The idea is to give the consumer the opportunity to be apart of the design process. Individuality and uniqueness is the starting point. Customers are involved in the design process by generating patterns from their own personal stories. The text can be anything from their favourite recipe till a good moment you had with your friends."
