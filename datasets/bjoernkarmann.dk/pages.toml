full_description = '''Paragraphica is a context-to-image camera that uses location data and artificial intelligence to visualize a "photo" of a specific place and moment. 2021Occlusion Grotesque is a conceptual typeface that annually depicts a growing alphabet carved into a tree since 2015. It explores what it means to design with nature itself, at the speed of a growing tree. ﻿ 2020As lead experience designer for the UAE Pavillion at the World Expo Dubai 2020, I helped tell an ambitious story about the UAE's progressive history within a multisensorial and interactive experience. ﻿ ﻿2018Alias is a teachable “parasite” that is designed to give users more control over their smart assistants, both when it comes to customisation and privacy. ﻿2018The Terraform Table is an interactive and tangible sandbox that lets you create planetary landscapes by manipulating the sand in real time. It uses machine learning to create realistic satellite imagery that is then projection mapped onto the 3D surface. ﻿2016Empowering people to train objects in their daily environment to respond to their unique behaviours. It gives an experience of training an artificial intelligence; a shift from a passive consumer to an active, playful director of domestic technology. A robotic installation, that reveals the spatial stories, that are written by millions of city-dwellers wandering about their daily matters. Wax is used to create a analogue data landscape of the invisible traces of everyday mobility.﻿ Discharge noise is an interactive print sound installation that takes a curious approach to the power grid—specifically the power cables and wires that span valleys to reach our homes. With the right weather conditions, these power cables become audible. ﻿ The PyroGraph is an experimental plotter that uses a soldering iron to burn images onto paper. Custom software turns any image input into a burning art piece. News Globus has a physical interface that asks you to explore the world not by news of a single place, but by the relationships between places. ﻿'''
