["https://bjoernkarmann.dk/project/network"]
title = "CIID Network - Bjørn Karmann"
full_description = "The CIID network is a data-visualisation that – at first glance – shows the vastness of the CIID network. The analog poster shows all people that ever graduated from CIID, the countries they come from, the companies they work(ed) at and the years they were students. All ordered alphabetically. When using the digital layer, however, the true network becomes visible. This layer digitally highlights a node in the network and subtly directs the eye to all its related data. For example: highlighting a certain company shows all the people who work at, or have worked at this company. The digital layer allows people to search using the keyboard as an input, as well as using the arrow keys to navigate through the network. As a final touch, a random node in the network may be highlighted. As a finishing touch, we believed that this visualisation would be better off-screen. We plotted a screenshot and framed it, and used the visualisation as an interactive overlay."
