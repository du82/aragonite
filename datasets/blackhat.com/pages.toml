title = "Black Hat Asia 2025 | Startup Spotlight Competition"
full_description = "Asia 2025 Register Now April 1-4, 2025 Marina Bay Sands / Singapore On This Page Introduction About Competition Who Can Enter Submit your Entry Judges Black Hat Startup Spotlight Competition The Black Hat Startup Spotlight is back for Black Hat Asia 2025! This Black Hat special event is a video pitch competition for cybersecurity startup companies to present their products and solutions in front of a live audience at Black Hat Asia. About The Competition Win your way to exhibit at Black Hat Asia! Create and submit your 5-minute video using the Form below, calling out your company’s competitive advantages of the product or solution and how it will help cybersecurity pros. Products and solutions can be in development, about to launch or in the recently launched phases. Finalists Receive One Turnkey Startup booth at Black Hat Asia 2025 One 25-minute speaking session in a Business Hall Theater One 30-minute call with an Omdia Cybersecurity Analyst Key Dates January 1: Competition Opens March 3: Submissions due and competition closes March 7: Finalists announced April 3 & 4: Finalists Exhibit and Present at Black Hat, Winner Announced Who Can Enter Any Startup company 5 years old or less with less than 50 employees is eligible to enter the competition. Note: It is not necessary to be an Exhibitor at Black Hat Asia 2025 to enter the competition. There are no entry fees. Submit your Entry Required content for video pitch submission: Link to 5-minute video pitch on your product/service with information on the following: Outline of current business model Unique selling proposition: What problem is your product/service solving? What is the customer pain point? How is your business funded? Total funding raised to date. Reference current customers Suggested content for consideration in video submission: Go-to-market strategy Top competitors (including details on similarities and key differentiators) Loading… Judges The four finalists are invited to exhibit i