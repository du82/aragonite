["https://blackhat.com/html/webcast/01172013-hack-me-theres-a-vulnerable-web-app-for-that.html"]
title = "Black Hat | WebCast: Hack.me : There's a Vulnerable Web App for That!"
full_description = '''Sign up to receive information about upcoming Black Hat events including Briefings, Trainings, speakers, and important event updates. reviewBoardFaces(training_review_board, "sidebar-training-review-board"); // controlled in /js/scripts.js About Contact Privacy Webinar Hack.me : There's a Vulnerable Web App for That! Thursday, January 17, 2013 1:00 - 2:00 PM EST 60 minutes, including Q&A Hack.me is a free for all platform where to build, host and share simple and complex vulnerable web applications. Hack.me is a community driven project which will allow any researcher, teacher or developer to create his own vulnerable application, host it on the platform and share it with others for educational purposes. Everyone accessing the application will do so creating a new instance in a sandboxed and user-isolated environment, created on the fly by the Coliseum Framework.?This ensures that every instance of the application is intact and clean. Brought to you by: Presenter: Armando Romeo Armando Romeo is the founder of eLearnSecurity and co-author of Penetration Testing Course Professional. With a number of security advisories published with the Hackers Center Security Research Group and vulnerabilities found in Microsoft, Joomla, osCommerce, Invision and others, Armando has spent the first part of his career in web application security research. He currently serves as CEO of eLearnSecurity, inspiring and leading new R&D projects like Hera, Coliseum, and Hack.me developed in the eLearnSecurity labs in Pisa, Italy Sponsor Speaker: Karl Snider Karl Snider is currently the Market Segment Manager for Application Security in IBM Security Systems. A software developer by training, Karl has participated extensively in all phases of the development life cycle, including development, design, architecture, system engineering, project management and product management. Since joining IBM as part of the Watchfire acquisition, he has held leadership roles in professional services, support, and software as a service. Sponsor: IBM Security offers one of the world's broadest, most advanced and integrated portfolios of enterprise security products and services. The portfolio, supported by world-renowned IBM X-Force® research and development, provides the security intelligence to help organizations holistically protect its people, infrastructure, data and applications, offering solutions for identity and access management, database security, application development, risk management, endpoint management, network security and more, enabling organizations to effectively manage risk and implement integrated security solutions for mobile, cloud, social media and other enterprise business architectures. For more information please visit us at: ibm.com/security Upcoming Events Blog View all Blog posts Stay Connected Sign up to receive information about upcoming Black Hat events including Briefings, Trainings, speakers, and important event updates. Review Board reviewBoardFaces(review_board, "sidebar-review-board"); // controlled in /js/scripts.js Training Review Board reviewBoardFaces(training_review_board, "sidebar-training-review-board"); // controlled in /js/scripts.js Sustaining Partners'''
