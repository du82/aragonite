["https://blackhat.com/html/webcast/01262023-better-privacy-through-offense.html"]
title = "Black Hat | Webinar: Better Privacy Through Offense: How to Build a Privacy Red Team"
full_description = '''Sign up to receive information about upcoming Black Hat events including Briefings, Trainings, speakers, and important event updates. reviewBoardFaces(training_review_board, "sidebar-training-review-board"); // controlled in /js/scripts.js About Contact Privacy Webinar Better Privacy Through Offense: How to Build a Privacy Red Team Thursday, January 26, 2023 11:00 AM - 12:00 PM PST 60 minutes, including Q&A Red teams are an important component of a holistic cyber security program because they test how well the program stands up to threats from real adversaries. In 2021, Meta created a privacy red team to help improve our privacy posture and preserve the privacy of our ~3 billion users and their data. Based on that experience, we present the case for why a privacy-focused red team is an important part of a holistic privacy program. In this talk, you'll learn what a privacy red team is, how it's different from a security red team, the challenges we faced, and examples of real operations we performed. You'll walk away with a better understanding of how privacy red teaming can benefit your organization, and the role that offense can play in your privacy defense. Brought to you by: Speakers Scott Tenaglia Engineering Manager Meta Mr. Scott Tenaglia is an Engineering Manager at Meta supporting the Privacy Red Team. Previously, Mr. Tenaglia was a Research Director and Principal Research Engineer at Two Six Labs, and a Lead Cyber Security Engineer at MITRE. In these roles, Mr. Tenaglia led teams that create new and novel offensive and defensive cyber capabilities, perform offensive cyber operations, develop cyber intelligence, and provide technical capabilities to include binary and program analysis, reverse engineering, vulnerability research, incident response and malware analysis. Mr. Tenaglia earned bachelors degrees in Computer Science and Mathematics from Purdue University, and a masters degree in Computer Science with a concentration in Machine Learning from Johns Hopkins University. Sponsor Presenter Kaustubh Jagtap Product Marketing Director SafeBreach Kaustubh Jagtap (KJ) is SafeBreach's Director of Product Marketing with over 15 years of technology marketing experience. He is a Telecom Engineer by education but has always been passionate about Cybersecurity. He loves distilling difficult technical ideas and concepts into easy-to-understand language. He is a big NERD and loves Marvel movies and the Star Wars Universe. He is an amateur photographer specializing in capturing naturescapes and historical building architecture. In his free time, he loves to travel and scuba dive. Steve Paul Moderator Black Hat Upcoming Events Blog View all Blog posts Stay Connected Sign up to receive information about upcoming Black Hat events including Briefings, Trainings, speakers, and important event updates. Review Board reviewBoardFaces(review_board, "sidebar-review-board"); // controlled in /js/scripts.js Training Review Board reviewBoardFaces(training_review_board, "sidebar-training-review-board"); // controlled in /js/scripts.js Sustaining Partners'''
