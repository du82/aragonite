["https://blackhat.com/html/webcast/03192020-proactive-defense-using-threat-hunting.html"]
title = "Black Hat | WebCast: Proactive Defense using Threat Hunting"
full_description = '''Sign up to receive information about upcoming Black Hat events including Briefings, Trainings, speakers, and important event updates. reviewBoardFaces(training_review_board, "sidebar-training-review-board"); // controlled in /js/scripts.js About Contact Privacy Webinar Proactive Defense using Threat Hunting Tuesday, March 19, 2020 11:00 AM - 12:00 PM PDT 60 minutes, including Q&A Today's most sophisticated threats often fly under the radar, bypassing traditional antivirus and monitoring services. Armed with military-grade encryption and asymmetric threat models, cybercriminals quietly infect systems around the world, siphon away valuable data, and install ransomware— remaining undetected until it's too late. How can you defend against today's threats? A proactive approach is critical. In today's webinar, we'll show you how to build an effective threat hunting solution, including: Tactics and strategies for proactively detecting next-generation threats Cloud threat hunting integration, including AWS and Azure Tips for deploying and using common threat hunting tools Learn to defend against sophisticated actors using proactive threat hunting, both on-prem and in your cloud environment. Brought to you by: Guest Presenter: Matt Durrin Cybersecurity Consultant and Trainer LMG Security Matt Durrin is a cybersecurity consultant and trainer for LMG Security. A seasoned forensics professional, Matt specializes in incident response, ransomware cases, cryptojacking, and banking trojans. Matt is an instructor at the international Black Hat USA conference, where he teaches "Data Breaches." He regularly conducts cybersecurity webinars and seminars for hundreds of attendees in all sectors, including banking, retail, health care, government and more. Matt holds a Bachelor's Degree in Computer Science from the University of Montana and previously worked as a "blue team" field technician/system administrator for over 10 years. He currently leads LMG's R&D team, and his malware research was featured on NBC Nightly News. Sponsor Presenter: Dan Graney Director of Competitive Intelligence Carbon Black Dan Graney is the Director of Competitive Intelligence for Carbon Black where he leads a team that provides competitive and market intelligence which drives the development of successful solutions and win strategies based on competitive market analysis. Dan has over 15+ years' experience in Cyber Security. Having worked strategically with many Cybersecurity SaaS Vendors, Dan has a diverse expertise in a wide variety of technologies in network and security hardware, and software platforms. His broad background spans numerous disciplines including email and file security, next-generation firewall, endpoint protection platforms, advanced malware, vulnerability management, secure mobility, cloud security, perimeter defense, intrusion prevention, physical security and identity management, data loss prevention (DLP), virtualization, application control, including network design and management. Upcoming Events Blog View all Blog posts Stay Connected Sign up to receive information about upcoming Black Hat events including Briefings, Trainings, speakers, and important event updates. Review Board reviewBoardFaces(review_board, "sidebar-review-board"); // controlled in /js/scripts.js Training Review Board reviewBoardFaces(training_review_board, "sidebar-training-review-board"); // controlled in /js/scripts.js Sustaining Partners'''
