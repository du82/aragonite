full_description = '''Sign up to receive information about upcoming Black Hat events including Briefings, Trainings, speakers, and important event updates. reviewBoardFaces(training_review_board, "sidebar-training-review-board"); // controlled in /js/scripts.js About Contact Privacy Webinar Protect Unstructured Data at Petabyte Scale with Rubrik and AWS Tuesday, January 30, 2024 2:00 - 3:00 PM EST 60 minutes, including Q&A Organizations have tons of unstructured data, possibly petabytes of files on NAS systems—disorganized, tough to manage, and at risk from cyber threats. Replicating NAS data to other centers can be risky. How do you avoid copying malicious code? Or relying on NDMP backup, taking months and risking data loss? There is a better way. Join this joint webinar led by Amazon Web Services and Rubrik to learn how you can: Protect file data with air-gapped, immutable backups Scan billions of files for ransomware attacks, changes, or deletions of data – any rogue access across your data sets – at lightning speed Recover at scale anywhere: on-prem or in AWS, to the original source or to an alternate target Sponsored by: Speakers Todd Haller Regional Director, NAS Cloud Direct Rubrik Tom Harwood Principal Storage Specialist AWS Terry Sweeney Moderator Black Hat Terry Sweeney is a Los Angeles-based writer and editor who's covered business technology for three decades. He's written about cyber security for more than 15 years and was one of the founding editors of Dark Reading. Sweeney has covered enterprise networking extensively, as well as its supporting technologies like storage, wireless, cloud-based apps and the emerging Internet of Things. He's been a contributing editor to The Washington Post, Crain’s New York Business, Red Herring, Information Week, Network World, SearchAWS.com, and Stadium Tech Report. Upcoming Events Blog View all Blog posts Stay Connected Sign up to receive information about upcoming Black Hat events including Briefings, Trainings, speakers, and important event updates. Review Board reviewBoardFaces(review_board, "sidebar-review-board"); // controlled in /js/scripts.js Training Review Board reviewBoardFaces(training_review_board, "sidebar-training-review-board"); // controlled in /js/scripts.js Sustaining Partners'''
