title = "Black Hat | Webinar: Drive Cyber Resilience with Enterprise Case Management"
full_description = '''Sign up to receive information about upcoming Black Hat events including Briefings, Trainings, speakers, and important event updates. reviewBoardFaces(training_review_board, "sidebar-training-review-board"); // controlled in /js/scripts.js About Contact Privacy Webinar Drive Cyber Resilience with Enterprise Case Management Thursday, February 9, 2023 11:00 AM - 12:00 PM PST 60 minutes, including Q&A In this webinar, you will learn how to rapidly respond to evolving threats while optimizing and orchestrating enterprise security operations. You will be able to enable your teams to eliminate the errors and friction of manual handoffs across systems, teams and responsibilities. Instead, Integrations, playbooks, dashboards, and a common data model for enterprise case management expedite investigation, response, and remediation across IT, Security, and Risk teams to minimize incident impact, data loss, and exposure. This drives the maturity of your security operations, and centralizes case management for threats, data loss events, and more. Attend this webinar to learn: Centralize operations to better prepare and respond to high profile security incidents such as ransomware, data breaches, and other targeted attacks. Scale team capacity and increase expertise with automated playbooks for common events such asphishing and malware. With the MITRE ATT&CK framework integrated into playbooks and analytics, your security teams can optimize workflows, tools, and skills against evolving attack techniques to profile and predict active attacker behavior, and guide response. Brought to you by: Guest Presenters Karl Klaessig Director of Product Marketing ServiceNow Karl is ServiceNow’s Director of Product Marketing, Security Operations, and has over 15 years of experience in product positioning and marketing of enterprise security platforms, including SIEM, SOAR, and endpoint technologies, most recently from product marketing roles at RSA and McAfee, where he was responsible for the positioning of their security operations and automation platforms. Tim Boswell Senior Product Manager ServiceNow Tim Boswell has spent the past two decades building, maturing, and managing cyber threat intelligence and incident response operations. After leading cybersecurity teams for the US Army, Tim was recruited into the private sector, and later joined ServiceNow to build and run the ServiceNow Security Operations Center, charged with defending the ServiceNow enterprise and ServiceNow customers. Tim was also responsible for securing ServiceNow’s FedRAMP, DoD and other regulated environments for government customers. The ServiceNow Security Operations portfolio of applications and modules was born out of solutions to problems faced by ServiceNow and the global security team that Tim managed. Terry Sweeney Moderator Black Hat Terry Sweeney is a Los Angeles-based writer and editor who's covered business technology for three decades. He's written about cyber security for more than 15 years and was one of the founding editors of Dark Reading. Sweeney has covered enterprise networking extensively, as well as its supporting technologies like storage, wireless, cloud-based apps and the emerging Internet of Things. He's been a contributing editor to The Washington Post, Crain’s New York Business, Red Herring, Information Week, Network World, SearchAWS.com, and Stadium Tech Report. Upcoming Events Blog View all Blog posts Stay Connected Sign up to receive information about upcoming Black Hat events including Briefings, Trainings, speakers, and important event updates. Review Board reviewBoardFaces(review_board, "sidebar-review-board"); // controlled in /js/scripts.js Training Review Board reviewBoardFaces(training_review_board, "sidebar-training-review-board"); // controlled in /js/scripts.js Sustaining Partners'''
