full_description = '''Sign up to receive information about upcoming Black Hat events including Briefings, Trainings, speakers, and important event updates. reviewBoardFaces(training_review_board, "sidebar-training-review-board"); // controlled in /js/scripts.js About Contact Privacy Webinar Now is the Time for Cyber Deception Thursday, March 21, 2019 11:00 AM - 12:00 PM PDT 60 minutes, including Q&A Now is the Time for Cyber Deception, by John Strand Deception through History, by David Balcar Over the past few years there has been a greater and greater push by organizations to find non-standard defensive strategies. Cyber deception seems to fit what many organizations are looking for. But how should an organization begin? Honeypots? Honey-tokens? Commercial solutions? Is deception a waste of time? In this webcast, John will provide you will concrete, effective and free solutions that your organization can implement right now to begin detecting, and deceiving, the most advanced attackers. Brought to you by: Guest Presenter: John Strand John Strand is the owner of Black Hills Information Security, a firm specializing in penetration testing, Active Defense and Hunt Teaming services. He is the also the CTO of Offensive Countermeasures, a firm dedicated to tracking advanced attackers inside and outside your network. John is an experienced speaker, having done presentations to the FBI, NASA, the NSA and at various industry conferences. He is a senior instructor with the SANS Institute. He also co-hosts Security Weekly, the world's largest information security podcast; co-authored Offensive Countermeasures: The Art of Active Defense; and writes loud rock music and makes various futile attempts at fly-fishing. Sponsor Presenter: David Balcar David Balcar is a Security Strategist at Carbon Black. He is a security veteran with more than 18 years of experience in conducting network Penetration testing, Incident Response and Computer Forensics. David is a regular featured speaker at security conferences worldwide, presenting on subjects including security trends, penetration testing, top threats and network security hardening. He is a member of the HTCIA (High Technology Crime Investigation Association) and ISSA (Information Systems Security Association). Upcoming Events Blog View all Blog posts Stay Connected Sign up to receive information about upcoming Black Hat events including Briefings, Trainings, speakers, and important event updates. Review Board reviewBoardFaces(review_board, "sidebar-review-board"); // controlled in /js/scripts.js Training Review Board reviewBoardFaces(training_review_board, "sidebar-training-review-board"); // controlled in /js/scripts.js Sustaining Partners'''
