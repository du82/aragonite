title = "Black Hat | Webinar: The CISO Perspective: Proactive Security in 2024"
full_description = '''Sign up to receive information about upcoming Black Hat events including Briefings, Trainings, speakers, and important event updates. reviewBoardFaces(training_review_board, "sidebar-training-review-board"); // controlled in /js/scripts.js About Contact Privacy Webinar The CISO Perspective: Proactive Security in 2024 Thursday, February 8, 2024 12:00 - 1:00 PM EST 60 minutes, including Q&A Is it more important for your business to address an existing threat exposure in your product portfolio, or to ship that new product feature on time? As a CISO in 2024 you must be ready to lead this discussion and communicate cyber risk as part of an honest, informed, and unbiased decision process to make this critical call. Is your Proactive Security program ready to impact your product roadmap? In this webinar you will learn how Tunde Oni-Daniel, CISO/CIO of One Main Financial, uses a Risk Operations Center to lead executive stakeholders through the careful process of balancing mitigating existing exposures with new product development. Sponsored by: Speakers Amad Fida CEO Brinqa Amad Fida is CEO and founder of Brinqa. He is a security expert and entrepreneur. Amad has more than 25 years of experience in the security space, including extensive experience building products and customer-focused organizations across the globe. His entrepreneurial background and ability to identify market needs and turn them into technology strategies have enabled him to drive innovation to market throughout his career. Prior to founding Brinqa, Amad co-founded Vaau, which Sun Microsystems acquired in 2008. Tunde Oni-Daniel Head of Technology Operations and Engineering OneMain Financial Tunde Oni-Daniel is the Head of Technology Operations and Engineering at OneMain Financial where he balances the company’s business demands with the technical delivery and means to secure data in a highly-regulated industry. With 23 years of security experience across industries, he has deep expertise in building business-driven security programs. Tunde is skilled in developing security architectures, privacy programs, process and enterprise risk management, audit and compliance programs, budgets and staff development. His background includes international business experience for Deutsche Bank, Pan African countries such as African Development Bank, Central Informatics Organization, Bahrain, Prognoz USA, for application security, cloud security, and enterprise risk compliance. Alex Babar VP of Solutions Brinqa Alex Babar leads solution communications at Brinqa, a hyper-growth cybersecurity company that supports companies in orchestrating their entire cyber risk lifecycle. Prior, Alex ran Product communications at Bessemer-backed Legit Security and held product marketing and product management roles at Ping Identity. Outside of geeking out on B2B SaaS, Alex is a lifelong tennis player and a budding "pragmatic home cook" based out of Austin, Texas. Terry Sweeney Moderator Black Hat Terry Sweeney is a Los Angeles-based writer and editor who's covered business technology for three decades. He's written about cyber security for more than 15 years and was one of the founding editors of Dark Reading. Sweeney has covered enterprise networking extensively, as well as its supporting technologies like storage, wireless, cloud-based apps and the emerging Internet of Things. He's been a contributing editor to The Washington Post, Crain’s New York Business, Red Herring, Information Week, Network World, SearchAWS.com, and Stadium Tech Report. Upcoming Events Blog View all Blog posts Stay Connected Sign up to receive information about upcoming Black Hat events including Briefings, Trainings, speakers, and important event updates. Review Board reviewBoardFaces(review_board, "sidebar-review-board"); // controlled in /js/scripts.js Training Review Board reviewBoardFaces(training_review_board, "sidebar-training-review-board"); // controlled in /js/scripts.js Sustaining Partner