description = """
February 24 | Countdown to Black Hat Spring Trainings 2025          As a fundamental element of Black Hat events, Black Hat Trainings regularly kick off each event week. While some Trainings operate on a 2-day schedule, and some span the full four days of  content, attendees can also find Black Hat Trainings as standalone events throughout the year, separate from the full conference programming. Read More          
          February 12 | Black Hat Asia 2025 Announces Summit Schedule          While we’re counting down to the first days of Black Hat Asia 2025, taking place April 1-4 at the Marina Bay Sands Expo & Convention Centre in Singapore, our team wanted to bring to your attention some of the content highlights that you can expect in the days leading up to the main days of the conference. Read More          
          February 4 | Black Hat Startup Spotlight Competition Launches at Black Hat Asia 2025          The Black Hat Startup Spotlight Competition, a pitch competition for cybersecurity startup companies to present their products and solutions in front of a live audience at Black Hat, has now officially launched for Black Hat Asia 2025. Black Hat Asia will take place April 1-4 at the Marina Bay Sands Expo & Convention Centre in Singapore, and the competition finalists will exhibit and present on April 3 and April 4, while the winner will be announced on April 3 in the Business Hall Theater A at 4:15 PM. Read More          
          January 31 | Black Hat USA 2025 Call for Papers (CFP) Opens Soon: Resources to Uplevel Your Submission          As the first month of 2025 comes to a close, we hope this year has started off strong for everyone. Our team has already begun ramping up for our biggest event, Black Hat USA, which will take place August 2-7 at the Mandalay Bay Convention Center in Las Vegas. Read More"""
full_description = '''Sign up to receive information about upcoming Black Hat events including Briefings, Trainings, speakers, and important event updates. reviewBoardFaces(training_review_board, "sidebar-training-review-board"); // controlled in /js/scripts.js Blog The Black Hat Blog is the place to find the latest in-depth updates on all aspects of Black Hat events, including newly selected Briefings presentations and Training courses, information for both first-time and returning attendees, interviews with the Black Hat Review Board, sponsorship and scholarship opportunities, and much more. Make sure to check back regularly to stay up to date on the latest developments from Black Hat events. 2025 February 24 | Countdown to Black Hat Spring Trainings 2025 As a fundamental element of Black Hat events, Black Hat Trainings regularly kick off each event week. While some Trainings operate on a 2-day schedule, and some span the full four days of content, attendees can also find Black Hat Trainings as standalone events throughout the year, separate from the full conference programming. Read More February 12 | Black Hat Asia 2025 Announces Summit Schedule While we’re counting down to the first days of Black Hat Asia 2025, taking place April 1-4 at the Marina Bay Sands Expo & Convention Centre in Singapore, our team wanted to bring to your attention some of the content highlights that you can expect in the days leading up to the main days of the conference. Read More February 4 | Black Hat Startup Spotlight Competition Launches at Black Hat Asia 2025 The Black Hat Startup Spotlight Competition, a pitch competition for cybersecurity startup companies to present their products and solutions in front of a live audience at Black Hat, has now officially launched for Black Hat Asia 2025. Black Hat Asia will take place April 1-4 at the Marina Bay Sands Expo & Convention Centre in Singapore, and the competition finalists will exhibit and present on April 3 and April 4, while the winner will be announced on April 3 in the Business Hall Theater A at 4:15 PM. Read More January 31 | Black Hat USA 2025 Call for Papers (CFP) Opens Soon: Resources to Uplevel Your Submission As the first month of 2025 comes to a close, we hope this year has started off strong for everyone. Our team has already begun ramping up for our biggest event, Black Hat USA, which will take place August 2-7 at the Mandalay Bay Convention Center in Las Vegas. Read More 2024 December 1 | Black Hat Europe 2024: Full Schedule Programming With the beginning of Black Hat Europe 2024 quickly approaching, there’s no better time to familiarize yourself with the event’s full schedule programming, placed below. Black Hat Europe 2024 will take place from December 9 to December 12 at the ExCeL London. In this blog, you’ll find important details on the event, including information on our Keynotes, Briefings, Trainings, Business Hall, Summits, Features, and more. Read More October 31 | Cybersecurity Awareness Month As Cybersecurity Awareness Month comes to a close, the team at Black Hat wanted to share a few recommendations and resources to keep in mind that don’t only apply each October, but can be utilized year-round to help keep your online safety top of mind. Read More October 14 | SecTor 2024: Full Schedule Programming With just one week left until SecTor 2024, please find the full schedule of event programming placed below. SecTor will take place from October 22 to October 24 at the Metro Toronto Convention Centre in downtown Toronto. In this blog, you’ll find information on our Keynotes, Briefings, Trainings, Business Hall, Summits, Features, and more. Read More October 3 | Black Hat and The AI Summit Series Members of the cybersecurity community, as well as individuals with an interest in technology, are likely aware that artificial intelligence (AI) isn’t exactly new. However, as technology continues to rapidly evolve, so does AI. So while AI itself isn’t new, there continue to be new advancements and changes within and around AI and cybersecurity that are important to recognize. Read More September 20 | SecTor: Exploring Canada’s Largest Cybersecurity Conference With SecTor 2024 (October 22 to October 24 at the Metro Toronto Convention Centre [MTCC]) quickly approaching, we wanted to take this time to bring your attention to all things SecTor, including what the name “SecTor” is shortened (or abbreviated) from, when it first began, what attendees can expect, as well as how SecTor officially became an important event in Black Hat’s global portfolio. To find out more on the history behind SecTor, be sure to read on. Read More July 19 | Black Hat USA 2024: Full Schedule Programming With less than a month until the beginning of Black Hat USA 2024, taking place from August 3 to August 8 at the Mandalay Bay Convention Center in Las Vegas, please find the full schedule of event programming placed below. In this blog, you’ll find information on our Keynotes, Briefings, Trainings, Business Hall, Summits, Features, and more. Read More June 28 | Navigating the Black Hat USA Business Hall As we quickly approach Black Hat USA 2024, there's no better time to share an update on the Black Hat USA 2024 Business Hall. The Business Hall showcases the latest products and technologies from leading cybersecurity solution providers, and is where attendees can speak one-on-one with solution providers, see demos, as well as ask any questions they may have about specific solutions. Read More June 10 | Black Hat Briefings: Background, CFPs, Review Process, and More Last month, we published a blog post about Black Hat Trainings, but for those who may be new to our events, or even for those who are familiar with our events but would like to learn more about all the components of our programming, we look forward to sharing more about the variety of elements that come together to make Black Hat events the cybersecurity industry's most established and in-depth security event series. In addition to Trainings, another component that goes hand in hand with Black Hat event programming is that of Black Hat Briefings. Read More May 15 | Introduction to Black Hat Trainings Trainings are a core component of Black Hat events, but for anyone who may not have ever attended a Training course themselves, and has wondered exactly what Black Hat Trainings entail, or how they differ from the other benefits attendees can expect to receive from attending Black Hat events, please find a rundown of Black Hat Trainings placed below. Read More Upcoming Events Blog View all Blog posts Stay Connected Sign up to receive information about upcoming Black Hat events including Briefings, Trainings, speakers, and important event updates. Review Board reviewBoardFaces(review_board, "sidebar-review-board"); // controlled in /js/scripts.js Training Review Board reviewBoardFaces(training_review_board, "sidebar-training-review-board"); // controlled in /js/scripts.js Sustaining Partners'''
