title = "Black Hat | WebCast: Tapping on the Wire: Understanding Malicious Behaviors on the Network"
full_description = '''Sign up to receive information about upcoming Black Hat events including Briefings, Trainings, speakers, and important event updates. reviewBoardFaces(training_review_board, "sidebar-training-review-board"); // controlled in /js/scripts.js About Contact Privacy Webinar Tapping on the Wire: Understanding Malicious Behaviors on the Network Thursday, January 28, 2021 11:00 AM - 12:00 PM PST 60 minutes, including Q&A Analyzing network data gives defenders a unique perspective on what the malware is doing versus what the malware could do. It shifts the focus from the software to the attacker. Network data provides unique insights on malicious actions and also on the attackers' decisions and operations. In this session, we will explore real malware traffic, dissecting attackers' behavior, and discussing how we can apply this knowledge to defend our networks better. Brought to you by: Guest Presenter: Veronica Valeros Director of the Civilsphere project Czech Technical University Veronica Valeros is a senior researcher and intelligence analyst from Argentina. Her research strongly focuses on helping people. She currently specializes in threat intelligence, malware traffic analysis, and data analysis. She has presented her research at international conferences such as Black Hat, EkoParty, Botconf, Virus Bulletin, Deepsec, and others. She is the co-founder of the MatesLab hackerspace based in Argentina and co-founder of the Independent Fund for Women in Tech. She is currently the director of the Civilsphere project at the Czech Technical University, dedicated to protecting civil organizations and individuals from targeted attacks. She's also the project leader at the Stratosphere Laboratory, a research group in the Czech Technical University dedicated to study and research in cybersecurity and machine learning. Sponsor Presenters: Karl Klaessig Director of Product Marketing, Security Operations ServiceNow Karl is ServiceNow's Director of Product Marketing, Security Operations and has over 15 years of experience in product positioning and marketing of enterprise security platforms, including SIEM, SOAR and endpoint technologies, most recently from Product Marketing roles at RSA and McAfee, where he was responsible for the positioning of their security operations and automation platforms. When not focusing on enterprise security, he can be found hiking and kayaking with his wife Rachel and their six children, yes six – it's not a misprint! Chris Derton SE Manager Rubrik Chris Derton is currently the Rubrik Systems Engineering Manager for the TOLA region. He leads a team of pre-sales engineers focused on modern, scalable data management platform solving challenges with data security, cloud mobility and application availability. Prior to joining Rubrik 3 years ago, Chris held pre-sales and pre-sales leadership roles for companies focused on data center architecture, SaaS delivered business continuity solutions and hyperconverged software solutions. Upcoming Events Blog View all Blog posts Stay Connected Sign up to receive information about upcoming Black Hat events including Briefings, Trainings, speakers, and important event updates. Review Board reviewBoardFaces(review_board, "sidebar-review-board"); // controlled in /js/scripts.js Training Review Board reviewBoardFaces(training_review_board, "sidebar-training-review-board"); // controlled in /js/scripts.js Sustaining Partners'''
