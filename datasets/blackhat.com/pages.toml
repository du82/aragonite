title = "Black Hat | Webinar: The Power of Prioritization. Prioritize Your Most Vulnerable Assets, Before Threats Find Them for You"
full_description = '''Sign up to receive information about upcoming Black Hat events including Briefings, Trainings, speakers, and important event updates. reviewBoardFaces(training_review_board, "sidebar-training-review-board"); // controlled in /js/scripts.js About Contact Privacy Webinar The Power of Prioritization. Prioritize Your Most Vulnerable Assets, Before Threats Find Them for You Thursday, March 9, 2023 11:00 AM - 12:00 PM PST 60 minutes, including Q&A With rising concerns about the economy, fragile macroeconomic conditions are keeping business and security leaders up at night. The net result is that security teams are now being asked to maximize existing investments in technology & tooling and effectively do more with less. And yet, the critical vulnerabilities keep coming. The Armis AVM module goes beyond vulnerability scanning to address the full cyber risk management lifecycle. Understand asset risk. Secure vulnerable assets. Control your attack surface. Make sure you know what needs to be prioritized, so teams can fix what matters first. Armis has a better way to prioritize high-risk vulnerabilities for every asset. Manage asset vulnerabilities with a risk-based approach that uses threat intelligence and analytics to correlate asset exposure, the severity of vulnerabilities, and threat actor activity. Join Desiree Lee, Chief Technology Officer, Data at Armis to hear how our customers are protecting their risk landscape, maximizing their tech investments and doing more with less through prioritizing what matters most. Brought to you by: Speakers Desiree Lee Chief Technology Officer, Data Armis Desiree Lee is the Chief Technology Officer (CTO) for Data at Armis. Lee is a seasoned cybersecurity, network, and data storage leader, who has over 14 years of experience working across enterprises, financial institutions, and government authorities. She has led network, data, platform, and SaaS projects and, prior to joining Armis, she worked with Guardicore, Skyport Systems, Hitachi Data Systems, Brocade, and others. Most recently, Lee was Armis’ Senior Director for Solution Architecture on the east coast of the United States of America. Terry Sweeney Moderator Black Hat Terry Sweeney is a Los Angeles-based writer and editor who's covered business technology for three decades. He's written about cyber security for more than 15 years and was one of the founding editors of Dark Reading. Sweeney has covered enterprise networking extensively, as well as its supporting technologies like storage, wireless, cloud-based apps and the emerging Internet of Things. He's been a contributing editor to The Washington Post, Crain’s New York Business, Red Herring, Information Week, Network World, SearchAWS.com, and Stadium Tech Report. Upcoming Events Blog View all Blog posts Stay Connected Sign up to receive information about upcoming Black Hat events including Briefings, Trainings, speakers, and important event updates. Review Board reviewBoardFaces(review_board, "sidebar-review-board"); // controlled in /js/scripts.js Training Review Board reviewBoardFaces(training_review_board, "sidebar-training-review-board"); // controlled in /js/scripts.js Sustaining Partners'''
