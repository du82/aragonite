full_description = '''Sign up to receive information about upcoming Black Hat events including Briefings, Trainings, speakers, and important event updates. reviewBoardFaces(training_review_board, "sidebar-training-review-board"); // controlled in /js/scripts.js About Contact Privacy Webinar How Top Cybersecurity Experts Predict Threats and Navigate Risk Thursday, January 11, 2024 2:00 - 3:00 PM EST 60 minutes, including Q&A How Top Cybersecurity Experts Predict Threats and Navigate Risk In an environment fraught with fear, uncertainty, and doubt, how is an organization supposed to separate the signal from the noise and apply their limited resources to what truly matters? Join us to hear how top cybersecurity experts balance competing messages, along with their own biases, to predict threats, assess risk, and make key decisions about protecting their data. Sponsored by: Speakers Steven Stone Head of Rubrik Zero Labs Rubrik Steven Stone leads Rubrik’s new data threat research unit to uncover real-world intrusions from a range of threats including espionage-based data breaches toransomwareattacks, and to inform customers and partners of the best ways to proactively address risk in their business operations. He has over 15 years of experience in threat intelligence with roles in the U.S. military, intelligence community, and private sector, including Mandiant/FireEye and IBM. Most recently, he was Vice President of Adversary Operations at Mandiant, leading global teams who were responsible for adversary hunting, attribution, and data collection efforts. Terry Sweeney Moderator Black Hat Terry Sweeney is a Los Angeles-based writer and editor who's covered business technology for three decades. He's written about cyber security for more than 15 years and was one of the founding editors of Dark Reading. Sweeney has covered enterprise networking extensively, as well as its supporting technologies like storage, wireless, cloud-based apps and the emerging Internet of Things. He's been a contributing editor to The Washington Post, Crain’s New York Business, Red Herring, Information Week, Network World, SearchAWS.com, and Stadium Tech Report. Upcoming Events Blog View all Blog posts Stay Connected Sign up to receive information about upcoming Black Hat events including Briefings, Trainings, speakers, and important event updates. Review Board reviewBoardFaces(review_board, "sidebar-review-board"); // controlled in /js/scripts.js Training Review Board reviewBoardFaces(training_review_board, "sidebar-training-review-board"); // controlled in /js/scripts.js Sustaining Partners'''
