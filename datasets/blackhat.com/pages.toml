["https://blackhat.com/html/webcast/03242022-four-pillars.html"]
title = "Black Hat | Webinar: The Four Pillars of Your Cloud Defensive Foundation"
full_description = '''Sign up to receive information about upcoming Black Hat events including Briefings, Trainings, speakers, and important event updates. reviewBoardFaces(training_review_board, "sidebar-training-review-board"); // controlled in /js/scripts.js About Contact Privacy Webinar The Four Pillars of Your Cloud Defensive Foundation Thursday, March 24, 2022 11:00 AM - 12:00 PM PDT 60 minutes, including Q&A With seemingly infinite options, it's easy to get lost in the weeds of cloud security. In this session we take a step back and focus on the big-picture categories to build your cloud security foundation. Topics include: Using your account/tenant security for compartmentalization and blast radius control. Emerging techniques for IAM; the lynchpin of all cloud security. Ensuring you have the right feeds and speeds for security monitoring, and leading-edge options for handling those alerts. Upping your cloud incident response game. Brought to you by: Guest Presenter: Rich Mogull CEO Securosis Rich Mogull is the CEO of Securosis, a security research and analysis firm, and the CISO of DisruptOps, a cloud security automation platform based on his research. He has over 25 years of security experience and currently specializes in cloud security and DevSecOps, having starting working hands-on in cloud nearly 10 years ago. He is also the principle course designer of the Cloud Security Alliance training class, primary author of the latest version of the CSA Security Guidance, and actively works on developing hands-on cloud security techniques. Prior to founding Securosis and DisruptOps, Rich was a Research Vice President at Gartner on the security team. Prior to his seven years at Gartner, Rich worked as an independent consultant, web application developer, software development manager at the University of Colorado, and systems and network administrator. Rich is the Security Editor of TidBITS and a frequent contributor to industry publications. He is a frequent industry speaker at events including the RSA Security Conference, Black Hat, and DefCon, and has spoken on every continent except Antarctica (where he's happy to speak for free -- assuming travel is covered). Sponsor Presenter: Kaushik Srinivas Director, Product Management Bugcrowd Kaushik Srinivas has been designing and managing security products for more than a decade, both in startups and Fortune-1000 companies. His expertise is in Application Security, DevSecOps, and Endpoint management. At Bugcrowd, he’s the Director of Product Management, currently responsible for Penetration Testing as a Service (PTaaS) and new product planning. Steve Paul Moderator Upcoming Events Blog View all Blog posts Stay Connected Sign up to receive information about upcoming Black Hat events including Briefings, Trainings, speakers, and important event updates. Review Board reviewBoardFaces(review_board, "sidebar-review-board"); // controlled in /js/scripts.js Training Review Board reviewBoardFaces(training_review_board, "sidebar-training-review-board"); // controlled in /js/scripts.js Sustaining Partners'''
