full_description = '''Sign up to receive information about upcoming Black Hat events including Briefings, Trainings, speakers, and important event updates. reviewBoardFaces(training_review_board, "sidebar-training-review-board"); // controlled in /js/scripts.js About Contact Privacy Webinar The Evolution of AI, ML and Gen AI in Identity Products and Solutions Thursday, January 18, 2024 2:00 - 3:00 PM EST 60 minutes, including Q&A In this webinar Omdia will discuss the evolution of identity in AI, ML and Gen AI. This will explore how: AI and ML have traditionally been used in identity How the landscape has dramatically evolved with the introduction of Gen AI in identity and cybersecurity The leading use cases for Gen AI in identity will be explored (e.g. auto-generated entitlements, identity insights, identity lifecycle remediation, improving the customer identity experience, reducing login restrictions and workflow automation) Conclusions and recommendations Sponsored by: Speakers Don Tait Senior Analyst, Identity, Authentication, Access Omdia Don is Omdia’s Senior Analyst for the cybersecurity team, bringing more than 20 years of research, consulting, and insights experience to his role as a lead analyst in the area of identity, authentication, and access. Don has provided analyses on smart cards, payment and banking cards, near-field communications (NFC), and contactless credentials. He has presented the findings from his reports at many events and has written feature articles on his areas of expertise for leading journals and publications. Prior to joining Omdia, Don was a telecoms research analyst at Frost & Sullivan, responsible for the firm's broadband services subscription. He was also a marketing consultant at MSI Reports Limited, where he wrote industrial, healthcare, and telecommunications reports. Don has a Bachelor of Arts (Hons.) in business studies from Edinburgh Napier University in Scotland. He is based in the UK. Moushmi Banerjee Senior Software Architect Okta Béatrice Moissinac Staff Data Scientist Okta Béatrice Moissinac is a Staff Data Scientist at Okta. She holds two Masters, and a PhD in Computer Science, and joined Okta in 2021. Her main focus is applied AI research to Identity Security, or how to build new AI-based products to better secure Okta's customers. Between designing two algorithms, she enjoys long-distance running, camping & backpacking, reading, playing board games, gardening, sewing, building legos, and if time permits, renovating her house. Her favorite algorithm is Dynamic Time Warping. Steve Paul Moderator Black Hat Upcoming Events Blog View all Blog posts Stay Connected Sign up to receive information about upcoming Black Hat events including Briefings, Trainings, speakers, and important event updates. Review Board reviewBoardFaces(review_board, "sidebar-review-board"); // controlled in /js/scripts.js Training Review Board reviewBoardFaces(training_review_board, "sidebar-training-review-board"); // controlled in /js/scripts.js Sustaining Partners'''
