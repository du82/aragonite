title = "Black Hat | Webinar: Live Hack: Exploiting AI-Generated Code with Snyk"
full_description = '''Sign up to receive information about upcoming Black Hat events including Briefings, Trainings, speakers, and important event updates. reviewBoardFaces(training_review_board, "sidebar-training-review-board"); // controlled in /js/scripts.js About Contact Privacy Webinar Live Hack: Exploiting AI-Generated Code with Snyk Tuesday, February 27, 2024 2:00 - 3:00 PM EST 60 minutes, including Q&A AI-assisted coding tools increase your delivery speed… and security risks. In the span of just one hour, we’ll build a demo app using GitHub Copilot and ChatGPT, and live hack the results, showing how the generated code can be exploited. Watch this on-demand session to: Get an overview of AI in development and common AI security risks Use GitHub Copilot to build a coffee shop demo app with features including a dynamic homepage, searchable products, and personalized user profiles Uncover and exploit AI-generated vulnerabilities, including SQL injection, cross-site scripting, directory traversal and more Learn effective strategies to mitigate and fix the AI-generated vulnerabilities By the end of the session you’ll have built a demo app, hacked and fixed at least 3 vulnerabilities and gained insights into best practices for utilizing generative AI coding tools securely. Recommended prerequisites for participating in the session: ChatGPT account GitHub Copilot account Free Snyk Account IDE (VS Code, Visual Studio, Eclipse, Jetbrains) Sponsored by: Speakers Sonya Moisset Senior Developer Advocate Snyk Micah Silverman Director, Developer Relations Snyk Terry Sweeney Moderator Black Hat Terry Sweeney is a Los Angeles-based writer and editor who's covered business technology for three decades. He's written about cyber security for more than 15 years and was one of the founding editors of Dark Reading. Sweeney has covered enterprise networking extensively, as well as its supporting technologies like storage, wireless, cloud-based apps and the emerging Internet of Things. He's been a contributing editor to The Washington Post, Crain’s New York Business, Red Herring, Information Week, Network World, SearchAWS.com, and Stadium Tech Report. Upcoming Events Blog View all Blog posts Stay Connected Sign up to receive information about upcoming Black Hat events including Briefings, Trainings, speakers, and important event updates. Review Board reviewBoardFaces(review_board, "sidebar-review-board"); // controlled in /js/scripts.js Training Review Board reviewBoardFaces(training_review_board, "sidebar-training-review-board"); // controlled in /js/scripts.js Sustaining Partners'''
