["https://blackhat.com/html/webcast/03232023-mastering-pragmatic-cloud-governance.html"]
title = "Black Hat | Webinar: Mastering Pragmatic Cloud Governance"
full_description = '''Sign up to receive information about upcoming Black Hat events including Briefings, Trainings, speakers, and important event updates. reviewBoardFaces(training_review_board, "sidebar-training-review-board"); // controlled in /js/scripts.js About Contact Privacy Webinar Mastering Pragmatic Cloud Governance Thursday, March 23, 2023 11:00 AM - 12:00 PM PDT 60 minutes, including Q&A Cloud isn’t merely a new technology, it’s a new operating model. One that seriously challenges our existing security and governance programs. In this webinar cloud security expert Rich Mogull will walk you through practical methodologies, processes, and technologies for governing information security and compliance in the cloud. Come learn: Why cloud breaks existing governance How to wrangle your existing org structure and teams to align with cloud How to build your hierarchy of processes and controls Techniques to integrate with DevOps tech to minimize friction without maximizing risks Sponsored by: Featured Speaker Rich Mogull CEO Securosis Rich is the CEO of Securosis and the SVP of Cloud Security at FireMon where he focuses on leading-edge cloud security research and implementation. Rich joined FireMon through the acquisition of DisruptOps, a cloud security automation platform based on his research while as CEO of Securosis. He has over 25 years of security experience and currently specializes in cloud security and DevSecOps, having starting working hands-on in cloud nearly 10 years ago. He is also the principle course designer of the Cloud Security Alliance training class, primary author of the latest version of the CSA Security Guidance, and actively works on developing hands-on cloud security techniques. Prior to founding Securosis and DisruptOps, Rich was a Research Vice President at Gartner on the security team. Prior to his seven years at Gartner, Rich worked as an independent consultant, web application developer, software development manager at the University of Colorado, and systems and network administrator. Rich is the Security Editor of TidBITS and a frequent contributor to industry publications. He is a frequent industry speaker at events including the RSA Security Conference, Black Hat, and DefCon, and has spoken on every continent except Antarctica (where he's happy to speak for free -- assuming travel is covered). Sponsor Presenter Maor Bin CEO & Co-Founder Adaptive Shield A former cybersecurity intelligence officer in the IDF, Maor has over 16 years in cybersecurity leadership. In his career, he led SaaS Threat Detection Research at Proofpoint and won the operational excellence award during his IDI service. Maor got his BSc in Computer Science and is CEO and co-founder of Adaptive Shield. Oh and he is a globally-ranked chess player. Steve Paul Moderator Black Hat Upcoming Events Blog View all Blog posts Stay Connected Sign up to receive information about upcoming Black Hat events including Briefings, Trainings, speakers, and important event updates. Review Board reviewBoardFaces(review_board, "sidebar-review-board"); // controlled in /js/scripts.js Training Review Board reviewBoardFaces(training_review_board, "sidebar-training-review-board"); // controlled in /js/scripts.js Sustaining Partners'''
