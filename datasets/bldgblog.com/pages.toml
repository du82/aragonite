["https://bldgblog.com/2007/05/manhattan-landfill"]
title = "Manhattan Landfill – BLDGBLOG"
description = "Among many other interestings things to read in Rubble: Unearthing the History of Demolition by Jeff Byles – who will be speaking at Postopolis! on Thursday afternoon – is the fact that part of Man…"
full_description = "Manhattan Landfill Among many other interestings things to read in Rubble: Unearthing the History of Demolition by Jeff Byles – who will be speaking at Postopolis! on Thursday afternoon – is the fact that part of Manhattan is actually constructed from British war ruins. [Image: Winston Churchill visits the ruins of Coventry Cathedral, 1942; courtesy of the Library of Congress]. Toward the end of the book, Byles describes how “[m]ore than 16 million people saw their homes wrecked by bomb destruction during World War II, with more than 4.5 million housing units completely toasted.” Further, “[w]ith London and Coventy knee-deep in rubble by the fall of 1940, a phalanx of 13,500 troops from the Royal Engineers got busy ripping down war-ravaged structures.” But what to do with all that rubble…? Byles: Around that same time, New York’s FDR Drive was being constructed, which ran along the east side of Manhattan. “Much of the landfill on which it is constructed consists of the rubble of buildings destroyed during the Second World War by the Luftwaffe’s blitz on London and Bristol,” the historian Kenneth T. Jackson wrote. “Convoys of ships returning from Great Britain carried the broken masonry in their holds as ballast.” When you’re driving around on the FDR, in other words – or, for that matter, when you’re simply looking out over the east side of Manhattan – you and your gaze are passing over fragments of British cathedrals and London housing stock, flagstones quarried from Yorkshire, the shattered doorframes and lintels – and eaves, and vaults, and partition walls, and bedroom floors – of whole towns, pieces of Slough and Swindon perhaps, embedded now in asphalt, constituting what would otherwise have passed for bedrock. Down in the foundations of the city are other cities. (Elsewhere: We learn that the British coast has become geologically French, further complicated our future sense of geological belonging – raising the interesting possibility that one can exist in a state of geological alienation… Psychoanalysts will have a field day. [via]). Share this:Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window) Related Author Geoff ManaughPosted on May 28, 2007December 16, 2015Categories BLDGBLOG"
