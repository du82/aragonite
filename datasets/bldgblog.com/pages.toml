["https://bldgblog.com/2021/07/feathered-friends"]
title = "Feathered Friends – BLDGBLOG"
description = "After the previous post, I was interested to see a short piece over at The New Yorker about basically the same idea—of spotting invasive species in the backgrounds of films and television shows, bu…"
full_description = "Feathered Friends After the previous post, I was interested to see a short piece over at The New Yorker about basically the same idea—of spotting invasive species in the backgrounds of films and television shows, but, there, applied much more broadly to art history. The article, by Rebecca Mead, looks at the unexpected presence of a cockatoo in an image by Italian Renaissance-era painter Andrea Mantegna, as the bird’s “native habitat is restricted to Australia, Indonesia, Papua New Guinea, the Solomon Islands, and the Philippines.” How did it get to 15th-century Italy—and more specifically, Mead asks, “what did the bird’s presence reveal about the connections between an Italian city and distant forests that lay beyond the world known to Europeans?” [Image: A cockatoo in the background of Andrea Mantegna’s “Madonna della Vittoria” (1496), via Wikimedia.] It’s a fun read, and includes a final archival detail I’ll mention briefly—I am particularly obsessed with rare finds in archives, to be honest, and this is a good one. It turns out that Mantegna’s painting was not the first depiction of a cockatoo in European art history. Instead, a manuscript hidden away in a Vatican library included an even earlier representation, made in the mid-1200s. Art history as forensic ecology. Little creatures popping up in paintings and films, in engravings and TV shows, their presence there indicating larger tides of trade or climate change, acting as a strange barometer of the natural world. (Related: Check the Sonic.) Share this:Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window) Related Author Geoff ManaughPosted on July 6, 2021Categories BLDGBLOGTags Andrea Mantegna, Archives, Art, Art History, Birds, Cockatoos, Ecology, History, Invasive Species, Landscape, Painting, Rebecca Mead, Trade, Vatican Christopher Beaver says: July 7, 2021 at 10:11 am Feathered Friends. An on-screen image of a bird is probably accurate even in this era of computer graphic visuals in films. As a sometime sound editor, I can attest that off-screen bird calls are placed by fallible humans often for the purpose of adding an accent rather than accurately depicting a location. One example, the ubiquitous red-tailed hawk screech heard in films where no red-tailed hawk has ever ranged. In the sound and picture editing world, two directors are noted for their attention to bird detail: Robert Duvall and Terence Malick. Duvall has been known to write a sound editing bird script where the bird calls placed by an editor are accurate and add mood and tone to Duvall’s dramatic interpretation of the scene. Malick went so far as to show a close relative of the now extinct Carolina Parakeet in his film The New World as an indication of the original ecology of what is now the Eastern United States. Reply"
