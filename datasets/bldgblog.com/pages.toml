["https://bldgblog.com/2013/01/operation-deep-sleep-or-dormant-robots-at-the-bottom-of-the-sea"]
title = "Operation Deep Sleep: or, dormant robots at the bottom of the sea – BLDGBLOG"
description = "[Image: An otherwise unrelated photo of lift bags being used in underwater archaeology; via NOAA]. The Defense Advanced Research Projects Agency, or DARPA, is hoping to implement a global infrastru…"
full_description = "Operation Deep Sleep: or, dormant robots at the bottom of the sea [Image: An otherwise unrelated photo of lift bags being used in underwater archaeology; via NOAA]. The Defense Advanced Research Projects Agency, or DARPA, is hoping to implement a global infrastructure for storing mission-critical objects and payloads at the “bottom of the sea”—a kind of stationary, underwater FedEx that will release mission-critical packages for rendezvous with passing U.S. warships and UAVs. It’s called the Upward Falling Payloads program. The “concept,” according to DARPA, “centers on developing deployable, unmanned, distributed systems that lie on the deep-ocean floor in special containers for years at a time. These deep-sea nodes would then be woken up remotely when needed and recalled to the surface. In other words, they ‘fall upward.'” This requires innovative new technologies for “extended survival of nodes under extreme ocean pressure, communications to wake-up the nodes after years of sleep, and efficient launch of payloads to the surface.” As Popular Science describes it, it’s a sleeping archive of “‘upward falling’ robots that can hide on the seafloor for years [and] launch on demand.” And you can even get involved: DARPA is currently seeking proposals for how to realize its vision for Upward Falling Payloads. DARPA seeks proposals in three key areas for developing the program: Communications, deep ocean ‘risers’ to contain the payloads, and the actual payloads. DARPA hopes to reach technical communities that conduct deep-ocean engineering from the telecom and oil-exploration industry to the scientific community with insights into signal propagation in the water and on the seafloor. An informative “proposer’s day” will be held on January 25, 2013, where you can learn more about the program. It seems that, just a few years from now, storing objects for at-sea retrieval will be as ordinary as receiving an email. Briefly, it seems worth mentioning that this vision of waking things up from slumber at the bottom of the sea reads like a subplot from Pacific Rim, or like some militarized remake of the works of H.P. Lovecraft—wherein Lovecraft’s fictional Cthulhu, a monstrous and alien god, is described (by Wikipedia) as “a huge aquatic creature sleeping for eternity at the bottom of the ocean and destined to emerge from his slumber in an apocalyptic age.” Only, here, it is a gigantic system of military jewelry laced across the seafloor, locked in robotic sleep until the day of its electromagnetic reawakening. (Thanks to Brian Romans for the link!) Share this:Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window) Related Author Geoff ManaughPosted on January 16, 2013August 15, 2016Categories BLDGBLOGTags Cthulhu, DARPA, Engineering, Infrastructure, Military, Oceans, Seas, Underwater, Upward Falling Payloads, War"
