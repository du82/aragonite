full_description = "Land of Fires One of the most memorable scenes in Roberto Saviano’s book Gomorrah is his description of the illegal waste-dumping schemes of southern Italy’s Camorra organized crime syndicate. In a chapter called “Land of Fires,” Saviano conjures a Blakean landscape of rampant groundwater toxins, dispersed radioactivity, industrial sludges, paints, and slowly lethal atmospheres perfumed with hexavalent chromium. Unsurprisingly, a new report shows that cancer rates in the region have spiked, including “‘excessive’ instances of tumors, especially brain tumors.” Share this:Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window) Related Author Geoff ManaughPosted on January 5, 2016December 20, 2023Categories BLDGBLOGTags Camorra, Cancer, Health, Italy, Landfills, Landscape, Organized Crime, Roberto Saviano, Toxins, Waste, William Blake"
