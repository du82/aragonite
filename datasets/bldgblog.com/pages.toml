["https://bldgblog.com/2020/02/class-action"]
title = "Class Action – BLDGBLOG"
description = "[Image: Still from the end of Garbage, Gangsters and Greed.] I have a long new feature up at The Guardian this weekend that tells the story of an English teacher at Middletown High School, in upsta…"
full_description = "Class Action [Image: Still from the end of Garbage, Gangsters and Greed.] I have a long new feature up at The Guardian this weekend that tells the story of an English teacher at Middletown High School, in upstate New York, named Fred Isseks. In the early 1990s, Isseks was given the task of instructing teenage students at the school in how to use a bunch of new video cameras the school had acquired. To the school’s surprise—and to some administrators’ long-term political frustration—Isseks’s students quickly formed an investigative journalism unit, taking on local politicians and the New York Mafia, and producing a feature-length documentary about the illegal dumping of toxic waste in local landfills. The resulting film, called Garbage, Gangsters and Greed, made it as far as the Clinton White House, helped turn public opinion against the landfills, leading to their closure, and helped to reinvigorate official New York State hearings, run by Assemblyman Maurice Hinchey, on the subject of organized crime families and the illegal hauling of toxic waste. The story of the students is pretty incredible—involving death threats, threats of arrest, trespassing onto contaminated land, and more—and I was thrilled to be able to meet or speak with several of them, even to tour the old high school with Fred Isseks in tow. It is not an exaggeration to say that Isseks’s class changed the direction of those students’ lives, as many now work in environmental law or film and television. (One former student, Rachel Raimist, even has a media center named after her at the University of Minnesota.) The whole thing really pivots on Isseks’s belief that teenagers need to be given projects of true meaning and significance, not simply assigned more tests to take. Indeed, Isseks himself later went on—while still teaching at the high school but after a final cut of the landfill documentary had been completed—to earn a Ph.D. at the European Graduate School, studying under Wolfgang Schirmacher. His thesis would later be published under the name Media Courage: Impossible Pedagogy in an Artificial Community, and it includes a chapter that, as I describe it in the Guardian piece, advocates for “the philosophical potential of the American high school system. [Isseks’s] belief that teenagers need to be given work with genuine meaning and consequence in the world would shape his entire teaching career and, in the process, change his students’ lives.” Of course, the rabbit hole of Mob connections to toxic waste in the United States is bottomless, and the true consequences of illegal disposal—particularly, the long-term medical and environmental effects—are yet to be fully accounted for. I will undoubtedly come back to this topic, but, for now, check out the Guardian piece online (or in this weekend’s print edition), watch the students’ film in its entirety over at YouTube, and click through to Fred Isseks’s blog, where I first read about all of this. His long post putting the landfills into a deeper historical and geological context is superb. (A brief note from the small-world files: my awareness of Fred Isseks came entirely through a friendly tip from my friend, Ed Keller, who had read an earlier post here on BLDGBLOG called “Terrestrial Warfare, Drowned Lands.” The “Drowned Lands” are not only the area of New York State where Ed Keller lives, but are the same region where the toxic landfills explored by Isseks and his students are all located. I owe a huge thanks to Ed for the heads up!) Share this:Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window) Related Author Geoff ManaughPosted on February 1, 2020February 1, 2020Categories BLDGBLOGTags Drowned Lands, Earth, Ed Keller, Environment, Fred Isseks, Gangsters, Garbage, Geology, Greed, High School, Land, Landfills, Landscape, Mafia, Maurice Hinchey, Middletown, Middletown High School, Mob, New York, Organized Crime, Toxic Waste, Wallkill, Wallkill River, Waste"
year_published = 2020
year_updated = 2020
