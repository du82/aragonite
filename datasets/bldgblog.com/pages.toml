full_description = "The Dam Industry’s Chernobyl There’s an alarming new piece up at The New Yorker looking at two potential dam failures, in Iraq and Zambia, and the extraordinary effects these disasters would have. The collapse of Iraq’s Mosul Dam, for example, which the U.S. Army Corps of Engineers calls “the most dangerous dam in the world,” “could drown as many as five hundred thousand people downstream and leave a million homeless.” The collapse of Zambia’s Kariba Dam, meanwhile, and the resulting megaflood would be “the dam industry’s Chernobyl”: “three million people live in the flood’s path; most would die or lose their crops or possessions. About forty per cent of the electricity-generating capacity of twelve southern African nations would be eliminated.” (Spotted via @waltonwater) Share this:Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window) Related Author Geoff ManaughPosted on February 3, 2016December 27, 2016Categories BLDGBLOGTags Africa, Chernobyl, Collapse, Dams, Disasters, Electricity, Floods, Hydrology, Hydropower, Infrastructure, Iraq, Mosul, Mosul Dam, Zambia"
