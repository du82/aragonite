["https://bldgblog.com/2018/07/dark-matter-mineralogy-and-future-computers-of-induced-crystal-flaws"]
title = "Dark Matter Mineralogy and Future Computers of Induced Crystal Flaws – BLDGBLOG"
description = "[Image: Mexico’s “Cave of the Crystals,” via Wikipedia]. I guess I’ve got minerals on the brain. Anyway, there was an amazing story last week suggesting that, deep inside the planet, minerals might…"
full_description = "Dark Matter Mineralogy and Future Computers of Induced Crystal Flaws [Image: Mexico’s “Cave of the Crystals,” via Wikipedia]. I guess I’ve got minerals on the brain. Anyway, there was an amazing story last week suggesting that, deep inside the planet, minerals might exhibit flaws associated with “collisions with dark matter.” In a sense, this would make the entire interior of the earth a de facto dark matter detector—or, according to researchers at the University of Michigan, “minerals such as halite (sodium chloride) and zabuyelite (lithium carbonate), can act as ready-made detectors.” Proving this hypothesis sounds like the opening scene of a blockbuster science fiction film: “An experiment could extract the minerals—which can be around 500 million years old—from kilometres-deep boreholes that already exist for geological research and oil prospecting. Physicists would need to crack open the extracted minerals and scan the exposed surfaces under an electron or atomic force microscope for the tracks made by recoiling nuclei. They could also use X-ray or ultraviolet 3D scanners to study bigger chunks of minerals faster, but with lower resolution.” Either way, it’s incredible to imagine that slightly altered mineral structures deep inside the planet might reveal the presence of dark matter washing through the cosmos. After all, the Earth is allegedly “constantly crashing through huge walls of dark matter,” so the idea that some rocks might be glitched and scratched by these impacts isn’t that hard to believe. In fact, this brings to mind another hypothesis, that the GPS satellite network is, in fact, a huge, accidental dark matter detector. Read more at Nature. Meanwhile, ScienceDaily reported earlier this month that flaws deliberately introduced into the crystal forms of diamonds could be structured such that they improve those diamonds’ capacity for quantum computation. Apparently, a team at Princeton has designed new kinds of diamonds “that contain defects capable of storing and transmitting quantum information for use in a future ‘quantum internet.’” There is obviously no connection between these two stories, but that won’t stop me from imagining some vast new quantum computer network, coextensive with the Earth’s interior, performing prime-number calculations along dark matter-induced crystal flaws, crooked mineral veins flashing in the darkness with data, like some buried circuitboard throbbing beneath the continents and seas. Read more at ScienceDaily. (Related: Planet Harddrive.) Share this:Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window) Related Author Geoff ManaughPosted on July 21, 2018Categories BLDGBLOGTags Astronomy, Computation, Computers, Cosmos, Crystals, Dark Matter, Diamonds, Earth, Geology, GPS, Mineralogy, Minerals, Prime Numbers, Quantum Computers, Underground"
