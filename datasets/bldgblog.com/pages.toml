["https://bldgblog.com/2018/10/as-difficult-to-compose-and-they-will-be-to-follow"]
title = "As difficult to compose and they will be to follow – BLDGBLOG"
description = "[Image: Via Lebbeus Woods]. For a variety of reasons, I found myself looking back at Lebbeus Woods’s blog this morning, where I was captivated by this amazing cut-out paper model of the city of Pra…"
full_description = "As difficult to compose and they will be to follow [Image: Via Lebbeus Woods]. For a variety of reasons, I found myself looking back at Lebbeus Woods’s blog this morning, where I was captivated by this amazing cut-out paper model of the city of Prague. The images themselves, “meant to be cut up, very precisely, and assembled into a three-dimensional paper model,” as Lebbeus explained, already resemble an avant-garde architectural proposal, to the extent that, embarrassingly, when I first saw the top image, I thought it was a project by John Hejduk. [Images: Via Lebbeus Woods]. But, in addition to the images’ artistic complexity, I love this dry line from Lebbeus’s write-up, reflecting on the near-impossible task of explaining to someone else how they are meant to excise each piece and then assemble them all in the proper order: “the several pages of written instructions on the model’s assembly,” he deadpans, “would seem to have been as difficult to compose and they will be to follow.” [Image: Via Lebbeus Woods]. Read—and see—more over at Lebbeus’s blog. (Previously: Without Walls: An Interview with Lebbeus Woods and Lebbeus Woods, 1940-2012.) Share this:Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window) Related Author Geoff ManaughPosted on October 20, 2018October 20, 2018Categories BLDGBLOGTags Architecture, Books, Lebbeus Woods, Models, Paper Architecture Nicolò Tedeschi says: October 24, 2018 at 10:16 am I miss Lebbeus Woods blog… :,^( but even old, red, posts are still full of hidded treasures. Reply rif says: January 16, 2019 at 1:26 pm I’m reminded of a beautiful line from an old Survival Research Laboratories piece (http://www.srl.org/information/srl_info.html): “It’s as difficult to describe as it will be for an audience to look at.” Reply"
