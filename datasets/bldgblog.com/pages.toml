["https://bldgblog.com/2022/01/molten-roads-and-airbursts"]
title = "Molten Roads and Airbursts – BLDGBLOG"
description = "[Image: Max Ernst, “Landscape with a view of the lake and chimeras” (1940), via Archive.] While we’re on the subject of astronomical events leaving traces in our everyday world, here’s another stor…"
full_description = "Molten Roads and Airbursts [Image: Max Ernst, “Landscape with a view of the lake and chimeras” (1940), via Archive.] While we’re on the subject of astronomical events leaving traces in our everyday world, here’s another story, this one from November: “an airburst over the Atacama Desert 12,000 years ago melted the ground into glass,” according to new research aimed at explaining why “twisted chunks of black and green glass” lie scattered all over Chile. The airburst—likely an exploding comet—“probably generated strong winds that flung the glass as it formed,” giving the glass an unusual “folded look.” This “folded look” suggests that “the glass had been thrown around and rolled. It was basically kneaded like bread.” Given that this was only 12,000 years ago, it’s not impossible that some of it was witnessed by human beings; either way, the immediate aftermath would have been astonishing to behold, a 50-mile line of molten sand, warped and roiling like the sea, forming spheres and waves, freezing and shattering, a road of glass disappearing with an eerie glow over the desert horizon. In fact, imagine such an event occurring in, say, the Middle East around the same time, thus forming the basis for bizarre future folklore, legendarily strange Biblical scenes, tales of molten glass roads appearing in a flash from the sky. (Max Ernst painting included here purely for illustrative effect. Circumstantially relevant: Brainglass.) Share this:Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window) Related Author Geoff ManaughPosted on January 2, 2022Categories BLDGBLOGTags Airburst, Atacama Desert, Chile, Comets, Deserts, Folklore, Geomythology, Glass, Legends, Max Ernst Wayne says: January 3, 2022 at 5:47 am Puts me in mind of Ubar – the ruins of which lie somewhere in the Rub’ al Khali. Ubar, also known as Iram of the Pillars, was destroyed by an airstrike from God 6,000 years ago. Its vitreous aftermath might have been the source of al-Ḥajaru al-Aswad, the Black Stone in the Kaaba. Reply"
