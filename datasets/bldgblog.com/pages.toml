["https://bldgblog.com/2015/04/buy-a-complex-of-submarine-pits"]
title = "Buy A Complex Of Submarine Pits – BLDGBLOG"
description = "[Image: Courtesy of Sotheby’s]. Back to opportunities in real estate: if you were tempted by the Minneapolis skyway but you’re saving your money for something a bit warmer throughout th…"
full_description = "Buy A Complex Of Submarine Pits [Image: Courtesy of Sotheby’s]. Back to opportunities in real estate: if you were tempted by the Minneapolis skyway but you’re saving your money for something a bit warmer throughout the year, consider snapping up the “Submarine Pits on Boca Chica Key.” [Image: Courtesy of Sotheby’s]. As Sotheby’s describes the carved landscape of submarine docking pens, the pits can be found amidst “approximately 122 acres of vacant land just north of Key West.” Here’s the site on Google Maps. [Images: Courtesy of Sotheby’s]. They’re basically just deep slots blasted through the coral and limestone, barely visible beneath the water line in the form of somewhat ominous black strips where the ground drops away. [Images: Courtesy of Sotheby’s]. The site is zoned as a “Commercial Fishing Special District,” perhaps implying some future reuse of the submarine pens as exotic fish farms. But imagine all the weird opportunities here for submerged foundations, underwater hotel rooms, or other half-aquatic facilities—even something like the Danish National Maritime Museum by BIG—looped in and around these linear, Nazca-like features. [Image: The Danish National Maritime Museum by BIG; photo by Luca Santiago Mora via Dezeen]. From Sotheby’s: This parcel was used by the Navy Air Station to house its submarine war ships during the Cuban Missile Crisis and has a very colorful and distinct history. Perfect for marine use and development in a great location. Property includes seven finger cut coral canals that are 90 feet wide and over 25 feet deep, plus a deep water basin with dredged entry channel that provides passage to Boca Chica Channel (Oceanside) and Key West Harbor (Bayside). The asking price? [Images: Courtesy of Sotheby’s]. A mere $21.2 million—but then these drowned geoglyphs in the semitropical sun can be all yours. (Spotted via Curbed Miami. Previously on BLDGBLOG: Buy a Skyway, Buy a Fort, Buy a Lighthouse, Buy an Underground Kingdom, Buy a Prison, Buy a Tube Station, Buy an Archipelago, Buy a Map, Buy a Torpedo-Testing Facility, Buy a Silk Mill, Buy a Fort, Buy a Church). Share this:Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window) Related Author Geoff ManaughPosted on April 9, 2015December 16, 2015Categories BLDGBLOG"
