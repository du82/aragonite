["https://bldgblog.com/2021/07/until-proven-safe"]
title = "Until Proven Safe – BLDGBLOG"
description = "[Image: Dressed in 21st-century personal protective equipment (PPE), I am standing next to Dr. Luigi Bertinato, wearing period plague doctor gear from the time of the Black Death, inside the librar…"
full_description = "Until Proven Safe [Image: Dressed in 21st-century personal protective equipment (PPE), I am standing next to Dr. Luigi Bertinato, wearing period plague doctor gear from the time of the Black Death, inside the library of the Querini Stampalia, Venice. Photo by Nicola Twilley.] Long-time readers of this blog will hardly be surprised to hear of my interest in quarantine, a topic I’ve been posting and lecturing about since at least 2009. The Landscapes of Quarantine exhibition at Storefront for Art and Architecture, curated with Nicola Twilley back in 2010, was the beginning of a much larger project that we eventually returned to, several years ago, for a book on the subject. Originally titled—and sold to our editor as—The Coming Quarantine, we had to change the book’s name when COVID-19 hit. Surreally, we ended up finishing a book about quarantine while in a state of medical detention—indeed, at one point late last spring, more than half the world’s human population was in some state of quarantine or lockdown. Our book’s hypothesis and prediction was, in fact, that we would all be quarantining more in the future, not less, relying on this seemingly medieval tool of spatial isolation to protect ourselves from emerging diseases for which we had no natural immunity, no available vaccination, and no cure. Why quarantine? It is the use of space and time to overcome uncertainty, creating a buffer between ourselves and a potentially infectious other until that suspected threat can be proven safe. [Image: An arch inside the abandoned lazaretto, or quarantine hospital, on Manoel Island, Malta; photo by Geoff Manaugh.] Until Proven Safe: The History and Future of Quarantine—the book we have been traveling for, reporting, and working on since summer 2016—finally comes out tomorrow, July 20th. I am unbelievably excited about this book, for millions of reasons. On one level, it combines so many of the long-running interests here on this blog, from quarantine itself to architectural ruins, mythology & horror, science fiction, space exploration, the Army Corps of Engineers, agricultural landscapes, strange animal diseases, extraordinary engineering controls, the ethical dangers of smart homes, even nuclear waste. Having posted little to nothing about this book over the past few years—indeed, having posted almost nothing about COVID-19—it’s also immensely relieving to finally release this thing into the world. [Image: Inside the lazaretto at Ancona, Italy; photo by Geoff Manaugh.] Some highlights that I think would appeal to BLDGBLOG readers include Nicky’s and my travelogue around the Adriatic and Mediterranean seas, exploring ruined lazarettos in the footsteps of 18th-century British prison reformer—and quarantine critic—John Howard. We climbed locked fences into ruins on Malta, took a night ship across the Adriatic to disembark near the extraordinary pentagonal lazaretto in Ancona, and we got to tour the then-closed Lazzaretto Nuovo in Venice, Italy, with the local man intent on preserving it. (His original plan, he admitted, was to turn the island into a martial arts dojo.) In other parts of the book, we sit down with the head of the Disinfected Mail Study Circle, based in North London. That group collects rare pieces of mail sent to and from sites of quarantine; like characters in a Thomas Pynchon novel, their postal archaeology has revealed previously forgotten outbreaks and odd geopolitical details about the formation of international borders. We also visited the first federal quarantine facility, then under construction, in the United States in more than a hundred years, mere months before COVID-19, and we spoke with the former head of the Army Corps of Engineers about plans for retrofitting hotels, convention centers, and stadiums, as well as the prospect of pop-up home quarantine kits in the near-future. We visited the Ebola high-level isolation unit at the Royal Free Hospital in London—where Nicky climbed inside. [Image: Nicola Twilley inside the high-level isolation unit’s Trexler Ebola system; photo by Geoff Manaugh.] In the latter half of the book—primarily dedicated to nonhuman quarantine, or quarantine applied to the plant, animal, and mineral kingdoms, capped off by a look at “planetary protection” and the risk of alien microbes—we were able to see a brand-new high-level animal-disease research lab in the middle of U.S. cattle country. This is the nation’s replacement for the aging facility on Plum Island, subject of countless conspiracy theories. Elsewhere, we went deep into WIPP—the Waste Isolation Pilot Plant—outside Carlsbad, New Mexico, to see nuclear waste being buried and isolated from the Earth’s biosphere for a federally-mandated time periods of at least 100,000 years. We got to see the Apollo moon rocks and learn about the history of lunar quarantine, and even sat down with two of NASA’s Planetary Protection Officers—and their counterpart at the European Space Agency—to discuss the quarantine challenge of bringing Mars geology back to Earth. Along the way, we got to see Perseverance, the Mars rover, before its long (and successful) journey to Mars. [Image: Walking inside the Waste Isolation Pilot Plant, a salt mine 2,150 feet below the surface of the Earth, where the United States is permanently burying nuclear waste; photo by Nicola Twilley.] Reporting the book also led us to a series of high-level pandemic simulations over the course of several years—all the way up to the incredible experience of sitting in on a simulation in October 2019, the premise of which was a global outbreak of a novel coronavirus. As we sat there, listening to government figures role-play what they would do, the very earliest cases of COVID-19 were likely circulating in China, undetected. We also look at the limits of mathematical modeling, the encroachment of algorithms and Big Data into the future of quarantine, and the dystopian potential of involuntary medical isolation automatically enforced by today’s smart homes. And, through all of that, one of our biggest coups, I think, was recording hours of interviews with the head of the CDC’s division of global migration and quarantine, visiting him in his office at the CDC and recording anguished, on-the-record discussions during the Trump Administration about the nation’s COVID-19 response. A great way to get a flavor of the book would be to check out excerpts published in WIRED and The Guardian—and, tomorrow morning, The Atlantic—or to listen to the Gastropod episode we did on quarantine, agriculture, and threats to the world’s chocolate supply. [Image: Until Proven Safe, with a cover design by Alex Merto.] If you’re tempted, you can order a copy from Bookshop, Indiebound, Amazon, Barnes & Noble, or your local independent bookshop, etc. etc. Note: This post contains affiliate links to Amazon and Bookshop from which I might draw a small percentage of any book sales. Share this:Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window) Related Author Geoff ManaughPosted on July 20, 2021January 1, 2022Categories BLDGBLOG, Nicola Twilley, QuarantineTags Adriatic Sea, Alex Merto, Army Corps of Engineers, Books, CDC, Chocolate, COVID-19, Disease, Disinfected Mail Study Circle, Ebola, European Space Agency, Gastropod, Geography, Lazaretto, London, Luigi Bertinato, Malta, Manoel Island, Mediterranean Sea, Moon Rocks, NASA, New Mexico, Nicola Twilley, Nuclear Waste, Personal Protective Equipment, Planetary Protection, Publishing, Quarantine, Querini Stampalia, Royal Free Hospital, Ruins, Until Proven Safe, Venice, Waste Isolation Pilot Plant, WIPP, Zoonoses"
