title = "BLDGBLOG"
description = "It’s been an unremittingly bleak year, a situation I almost certainly made worse for myself by drifting further and further away from a daily writing routine, but I figured I should open up the vil…"
full_description = "It’s been an unremittingly bleak year, a situation I almost certainly made worse for myself by drifting further and further away from a daily writing routine, but I figured I should open up the villain’s lair here and post again briefly, even if only to offer proof of life. So, hello! Hope you had a more rewarding year than I did, and that we all enjoy a better 2022. Share this:Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window) Related Author Geoff ManaughPosted on December 31, 2021Categories BLDGBLOG, PersonalTags 296.30 Byron says: December 31, 2021 at 1:38 pm So glad to see a post from you, even if just an affirmation of life. The space that you’ve made here is a very important one. Here’s to enduring; here’s to a better 2022. Reply Geoff Manaugh says: January 1, 2022 at 11:38 am Thanks, Byron—thanks for reading over the years. Here’s to 2022. Reply Wayne says: January 1, 2022 at 5:25 pm Let 2021 collapse into the black dot of a period and implode. Here’s hoping for a boss hog of a 2022. Reply ETat says: January 1, 2022 at 5:56 pm A very welcome development. Here’s to a better new year! Reply Tron Jammer says: January 1, 2022 at 11:21 pm Thank you for all of the inspiring work and Happy New Year! Reply Charles Stephens says: January 2, 2022 at 10:17 am Glad to see you post! This blog is great. Thank you for doing it. Hope… Reply Santi Pages says: January 2, 2022 at 4:00 pm Thank you for the proof of life and best wishes for 2022! Reply Oliver Brackenbury says: January 4, 2022 at 10:17 am Totally understand about 2021. Glad to see you poking your head up here, though, and wish you the best for 2022! Reply Geoff Manaugh says: January 10, 2022 at 4:25 pm And to you, Oliver. I’m tempted to say 2021 was like a car scraping bottom, but I’m afraid such a statement might jinx us all for 2022. Cautiously, slowly, warily hoping this year—this decade, this century, this life, this world—shapes up to be non-catastrophic. Reply"
