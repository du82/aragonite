description = "In one more bit of news, I’m thrilled to say that a short story of mine, “Ernest,” published back in 2017, started filming for Netflix last week under the title We Have A Ghost. [Image: Art origina…"
full_description = "We Have A Ghost In one more bit of news, I’m thrilled to say that a short story of mine, “Ernest,” published back in 2017, started filming for Netflix last week under the title We Have A Ghost. [Image: Art originally used to illustrate “Ernest,” using Google Street View imagery, unconnected to the current Netflix adaptation.] It has a superb cast—David Harbour, Anthony Mackie, Jahi Di’Allo Winston, Tig Notaro, Jennifer Coolidge, Erica Ash, Niles Fitch, and so many others—and an amazing director, Christopher Landon, who also wrote the screenplay. “The film centers on Kevin, who finds a ghost named Ernest haunting his new home,” Deadline writes. “Kevin subsequently becomes an overnight social media sensation, along with his family. But when he and Ernest go rogue to investigate the mystery of the latter’s past, they become targets of the CIA.” Check out the original story to learn more. The release date is pending. [Image: Art originally used to illustrate “Ernest,” using Google Maps satellite view, unconnected to the current Netflix adaptation.] Other short stories of mine that readers of BLDGBLOG might enjoy—I have not linked to any of these here before because they are not really about architecture or design, which means that most of you might not even know I have been writing fiction—include “Summerland,” a personal favorite of mine, a vampire story (without ever using the v-word) set on an island in the St. Lawrence River during the off-season (broken up for length into part one and part two), and “Dormitorium,” about an architecturally-inflected dream study with ulterior motives. Share this:Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window) Related Author Geoff ManaughPosted on July 24, 2021January 4, 2022Categories PersonalTags Anthony Mackie, Christopher Landon, Cinema, David Harbour, Dormitorium, Erica Ash, Ernest, Ernest Borgnine, Fiction, Film, Ghost Stories, Jahi Di’allo Winston, Jennifer Coolidge, Netflix, Niles Fitch, Summerland, Tig Notaro"
