full_description = "Architectural Divorce Court [Image: From “Splitting,” by Gordon Matta-Clark]. “A 43-year-old German decided to settle his imminent divorce by chainsawing a family home in two and making off with his half in a forklift truck,” Reuters reports. The man then “picked up his half with the forklift truck and drove to his brother’s house where he has since been staying.” The police seem less than outraged. “The man said he was just taking his due,” one of them stated. And you thought building a wall was a bad way to get divorced… (Read more about Gordon Matta-Clark in BLDGBLOG’s Museum of Assassination). Share this:Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window) Related Author Geoff ManaughPosted on March 9, 2007December 16, 2015Categories BLDGBLOG Claus says: March 10, 2007 at 12:34 am Actually, it wasn’t the “family home”, but the garden shack, as can be seen here. Oddly enough, he took the house, but left the furniture. Reply Geist says: March 10, 2007 at 11:34 pm Off-topic, but these images of German industrial buildings in the early 20th century may be of interest. I particularly like the Einsteinturm, that seems to leap straight out of the Weimar Republic into a Miyazaki film or manga. via plep Reply The Aesthetic Elevator says: March 13, 2007 at 1:55 pm Less counterproductive than burning the house down, which happened to my wife’s aunt and uncle: They were going to go look at a house to purchase, but the house was no more. The embittered hubby had burned it down! Reply"
