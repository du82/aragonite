["https://bldgblog.com/2009/03/talks-tours-and-the-cities-of-tomorrow"]
title = "Talks, Tours, and the Cities of Tomorrow – BLDGBLOG"
description = "[Image: Photo by Satya Pemmaraju, courtesy of the Architectural League].Here are some upcoming events, courses, and lectures that I would attend if I could:—Tonight, March 26, author William L. Fox…"
full_description = "Talks, Tours, and the Cities of Tomorrow [Image: Photo by Satya Pemmaraju, courtesy of the Architectural League]. Here are some upcoming events, courses, and lectures that I would attend if I could: —Tonight, March 26, author William L. Fox speaks in Reno at the Nevada Museum of Art about his new exhibition, co-curated with Matthew Coolidge of the Center for Land Use Interpretation, about the Trans-Alaska Pipeline. Hopefully Fox will also discuss his newest book, Aereality: The World From Above; Fox’s books are an ongoing exploration of “extreme environments” and their impact on human cognition, from Antarctica and the gridless deserts of Nevada to the Australian Outback and even Mars. —Also today, March 26, kicking off in Los Angeles (and then again four days from now, on March 30, in Chicago) is an Urban Escape and Evasion course run by the group OnPoint Tactical. The premise of this is hilarious but fascinating: “While on an international business trip, you are kidnapped and held for ransom. A terrorist attack closes the business district and you find yourself in a fix. How do you stay alive? How do you get to safety on your own?” This class provides leading-edge skills to civilians who live and work in challenging urban environments or in urban centers that may destabilize during a crisis. Topics covered include covert movement (day vs. night), the judicious use of caches, understanding urban baseline movement and urban awareness training, the use of urban disguises and false papers/identification, lock picking, escaping from unlawful custody, obtaining and driving local transportation, the use of “specialized” urban gear, and instruction on how to develop urban escape and evasion go-bags, etc. If you already know how to do all that, of course, there are also advanced courses. For that, somewhere in the Philadelphia/Camden, NJ, area, beginning April 30, trainees will “spend time in the city in an extensive (extended) escape and evasion simulation. Students will be required to obtain food, water, and shelter. They will need to avoid capture, and they will be required to complete several tests or scenarios that will require advanced students to truly apply their scout and urban survival skills.” I love OnPoint’s final line: “Warning: Massive waiver required for this course!” These “urban survival” courses are run in Los Angeles, Philadelphia, Chicago, Dallas, Salt Lake City, and Conway, Arkansas. If only I had known about OnPoint earlier, I would have invited them to speak at Postopolis! LA. Check out their lock-picking gear. (Spotted via kottke.org). [Image: Think you’ll survive a corporate kidnapping (or the coming apocalypse)? OnPoint Tactical disagrees; sign up for their courses to learn more]. —March 27-29: The City From Below hits Baltimore, Maryland, exploring, among other things, how “unanticipated futures are being imagined and built” in the contemporary metropolis. My problem with the event write-up, however, is that participating in “social justice struggles” appears to mean adopting a new, niche vocabulary full of analytically useless words like “herstories” – i.e. feminism’s own “Freedom Fries” moment – excluding from your audience many of the very people who would benefit most from such discussions. Emerging forms of grassroots urban self-governance don’t require bizarre, over-academized newspeak about “metropolitan rearticulation” and “horizontal framework[s] of participation.” We don’t need to know that you’ve read Judith Butler in order to organize a better youth basketball league, plant a roof garden, or campaign for affordable day care. I also have a growing problem with the fetishization of “resistance” in today’s leftwing political writing, as if “resisting” something is, in and of itself, a technique that only the left is capable of performing. But the Bush Administration “resisted” the Geneva Conventions and Alberto Gonzales “resisted” civil liberties laws, even as the Mormon Church “resisted” gay marriage in California. Resistance has no political affiliation, and it is tactically meaningless to promote resistance as a goal in and of itself. One need look no further than the conservative Counter-Reformation; as its very name indicates, this was a massive act of cultural and intellectual resistance. Indeed, to pretend that “resistance” is worthy of commendation at all only makes sense if you’ve built your entire movement around a shifting sequence of enemies who, by your own admission, are always one step ahead of you. The alternative – articulating, out of the blue and in the middle of nowhere, unsolicited enthusiasm for a more equitable future for everyone – would seem both substantially more effective and unifying. It seems little wonder, then, that many otherwise intensely interesting urban social justice movements remain rhetorically self-ghettoized, when their own communication strategies seem to exclude the very people they most urgently need to convince. —On Monday, March 30, London’s Complex Terrain Laboratory will begin a four-day symposium about P. W. Singer’s important new book Wired for War (previously mentioned on BLDGBLOG here). As the event unfolds, regular updates will be posted online. [Image: Ecological Urbanism at the Harvard GSD]. —If it wasn’t for Postopolis! LA, I would be in Boston, attending Harvard’s Ecological Urbanism conference, running April 3-5. “While climate change, sustainable architecture, and green technologies have become increasingly topical,” we read, “issues surrounding the sustainability of the city are much less developed.” The conference is organized around the premise that an ecological approach is urgently needed both as a remedial device for the contemporary city and an organizing principle for new cities. An ecological urbanism represents a more holistic approach than is generally the case with urbanism today, demanding alternative ways of thinking and designing. Speakers include – and the list looks great – Rem Koolhaas, Andrea Branzi, Stefano Boeri, Anuradha Mathur, and super-dean Mohsen Mostafavi, among many, many others. —Saturday, April 4, in Montreal, the excellent Canadian Centre for Architecture will sponsor Mapping Rural Montréal: “Artist Amy Franceschini leads an exploration of rural sites and activities in Montréal, questioning the dichotomy of country and city (in English). $10 per person. Free for children under 12. Reservations required: (514) 939-7026.” —On April 25, Esotouric will be hosting a bus tour of Raymond Chandler’s Los Angeles: “Bungalows. Crime. Hollywood. Blondes. Vets. Smog. Death. This was Raymond Chandler’s Los Angeles, which resonated from deft and melancholy fits of his writer’s bow.” Esotouric’s Reyner Banham Loves Los Angeles tour also looks well worth a spin. —Finally, for now – as there are dozens and dozens of other amazing events I could mention – the Architectural League in New York is hosting what sounds like an exciting two-day conference called New Architectures of India, from April 30-May 1. It will “address the architectural and urban forms that are emerging as a turbulent ‘second modernity’ rearranges a vast part of the landscape of India.” All of these are barely the tip of the iceberg, however; I’ll hope to keep track of other lectures, events, gallery openings, conferences, courses, and such like as the year trundles on. Share this:Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window) Related Author Geoff ManaughPosted on March 26, 2009December 16, 2015Categories BLDGBLOG"
