title = "House on the Border – BLDGBLOG"
description = "There’s a great detail in a recent news story about cross-border smuggling in a small northern township, where upstate New York meets Quebec. Some homes in Dundee straddle the international border …"
full_description = "House on the Border There’s a great detail in a recent news story about cross-border smuggling in a small northern township, where upstate New York meets Quebec. Some homes in Dundee straddle the international border between the U.S. and Canada (recalling the marbled, enclave-rich border town of Baarle-Hertog or even Derby Line, Vermont). In a report about a man arrested for gun-running, Radio-Canada refers to this man’s house as a “maison sur la frontière,” or house on the border: “located on Beaver Road, the house can be found in both Canada and the United States” (translating from French). Indeed, although I cannot guarantee this is the right place, you can see a structure on Google Maps at the end of Beaver Road (Chemin Beaver) that sits astride the international border. [Image: Via Google Maps.] “Due to the presence of several such properties in Dundee,” the article continues, “this special location makes this municipality a historically recognized location for contraband, especially alcohol smuggling during the Prohibition era. It is therefore not new that properties along the border in this area have come under increased surveillance by the RCMP, which keeps an eye on real estate transactions and activities in the area.” You take something in through the American side and just slide it across into Canada, crossing the border silently in the comfort of your own home. As designer Daniel Benneworth-Gray joked on Twitter, residents could simply put everything on Lazy Susans “in case there’s a raid”: rotating furniture spun from one jurisdiction to the next in a house full of cross-border cupboards, compartments, and shelves, all connected to wheels, ropes, and pulleys, the whole place a kind of pinball machine through which illegal objects continually leave and re-enter the country. Share this:Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window) Related Author Geoff ManaughPosted on July 16, 2021Categories BLDGBLOGTags Baarle-Hertog, Borders, Canada, Crime, Daniel Benneworth-Gray, Derby Line, Geography, Gun-Running, New York State, Quebec, United States, Vermont"
