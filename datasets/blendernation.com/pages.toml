["https://www.blendernation.com/2025/02/28/short-film-grim"]
title = "Short Film: Grim - BlenderNation"
description = "Yuval Dubowski & Gilad Harnik present their graduation film for the Bezalel Academy of Arts and Design, Screen Based Arts Department 2024 - a beautifully scripted and designed reflection on a life.A short animated story about dealing with regret, responsibility and finding a sliver of light in the darkest of shadows.Herold wakes up in a dark forest. His car is covered in flames, he is injured and there a monstrous predator lurking in the dark. During Herold’s escape he must face his past, the choices he made and the people he hurt. Will he be able to overcome his past, or will he cave in under its burden? And will he escape the forest?Gilad writes:Hi everyone! I’m happy to share with you our graduation film: “Grim”!We have worked hard over for a year. Almost the entire production was made in Blender. Substance Painter was used for character textures, and After Effects for compositing.This was a monumental task to complete: we had multiple characters (one of them is a giant six-limbed wolf); a lot of locations (technically you could argue three, but one is always changing so that’s still a lot of work); and an emotional story that had to hit. I would like to believe we managed to pull it off, even of there are some rough edges. Hopefully you will agree with me."
full_description = "Short Film: Grim 0 By Bart on February 28, 2025 Video Yuval Dubowski & Gilad Harnik present their graduation film for the Bezalel Academy of Arts and Design, Screen Based Arts Department 2024 - a beautifully scripted and designed reflection on a life.A short animated story about dealing with regret, responsibility and finding a sliver of light in the darkest of shadows.Herold wakes up in a dark forest. His car is covered in flames, he is injured and there a monstrous predator lurking in the dark. During Herold’s escape he must face his past, the choices he made and the people he hurt. Will he be able to overcome his past, or will he cave in under its burden? And will he escape the forest?Gilad writes:Hi everyone! I’m happy to share with you our graduation film: “Grim”!We have worked hard over for a year. Almost the entire production was made in Blender. Substance Painter was used for character textures, and After Effects for compositing.This was a monumental task to complete: we had multiple characters (one of them is a giant six-limbed wolf); a lot of locations (technically you could argue three, but one is always changing so that’s still a lot of work); and an emotional story that had to hit. I would like to believe we managed to pull it off, even of there are some rough edges. Hopefully you will agree with me."
