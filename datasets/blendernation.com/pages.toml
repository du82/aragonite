["https://www.blendernation.com/2016/04/27/submitting-news-now-requires-login"]
title = "Submitting news now requires login - BlenderNation"
description = "Hey folks, quick update from my side: submitting an article or header graphic now requires you to log in. This has nothing to do with security but instead with community conversation: previously, articles were submitted anonymously and if anyone commented on it, only I would receive the notification. By logging in before you submit something you will become the 'author' and you'll be notified when someone comments on your article.As a bonus, you'll be able to see your previous articles (click on the author name) and if your reputation is good enough I can give you editing access to maintain your own posts.I hope this will help make it easier for everyone to reach the amazing artists, developers, educators and other community members who write articles on BlenderNation!"
full_description = '''Submitting news now requires login 39 By Bart on April 27, 2016 BlenderNation Hey folks, quick update from my side: submitting an article or header graphic now requires you to log in. This has nothing to do with security but instead with community conversation: previously, articles were submitted anonymously and if anyone commented on it, only I would receive the notification. By logging in before you submit something you will become the 'author' and you'll be notified when someone comments on your article.As a bonus, you'll be able to see your previous articles (click on the author name) and if your reputation is good enough I can give you editing access to maintain your own posts.I hope this will help make it easier for everyone to reach the amazing artists, developers, educators and other community members who write articles on BlenderNation! Renderberg on April 27, 2016 09:47 AM I see that the logged in, but why then when you press the "Submit to story" I re redirected to the login, and when re-enter your password - get into a profile, and from there I can not "Sumbit to story", coming back to the site, he had me already does not remember, and the cycle repeats itself .... Reply Bart on April 27, 2016 09:49 AM Hmm that is not right. Could you try logging in using the login link in the top navigation? Does that work? Reply Bart on April 27, 2016 09:53 AM Ah, it seems caching is too aggressive on the submission page. Just reload it to get the right contents. I'll fix that. Reply Renderberg on April 27, 2016 09:55 AM The fact that I went there, and the site sees me .... but the function "Submit news" or "Submit YOUR Story" sends a re-login, and from there into the profile ... I tried in Chromium and Firefox by linux ... can in this case? Reply Bart on April 27, 2016 09:57 AM No, it's caching. Try reloading the page, that should fix it as a workaround. Let me know if that worked? Reply tk1214 on April 27, 2016 10:45 AM ...and now for something completely different: regarding the news, why is it for some time now that there are no more links to "previous article" and "next article" anymore? Because sometimes I can't keep up reading all the articles that are posted, so I just read the latest and then went back to previous articles until I reach the one I read on my last visit.Now that's not possible anymore, and the "recent news" on the top right are sometimes less articles than I missed. Is there a chronical overview of all news articles somewhere that I am just to blind to see?Best regards, Gordon Reply'''
year_published = 2016
year_updated = 2016
clearnet = "https://www.blendernation.com/2016/04/27/submitting-news-now-requires-login"
