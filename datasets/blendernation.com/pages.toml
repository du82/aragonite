["https://www.blendernation.com/2025/02/25/do-it-all-in-blender-with-jason-van-gumster-subsurface-talks-podcast-10"]
title = "‘Do it all in Blender!’ with Jason Van Gumster - Subsurface Talks podcast #10 - BlenderNation"
description = """
Subsurface Talks podcast's 10th guest is the legendary Jason van Gumster, author of Blender for Dummies and countless other Blender-related activities.As he describes himself - a member of the 'Blender old farts club'. Neither age nor impressive experience takes away any of Jason's contagious energy and enthusiasm. Whether it's writing crazy science fiction prose, making 3D printable designs in Blender, or coding - Jason approaches each of those seemingly non-related activities with the same curiosity and all-in approach. Adding the fact that he decided to live and travel with his family across the USA in a mobile house for more than a year just makes this interview a must-watch for anyone who asks: How is this all possible in one man's life?
You may find the answer (or even more questions) in this episode:If you don't like watching YT videos (or our faces ;)) you can just listen to the episode here.Enjoy!
DJ"""
full_description = "'Do it all in Blender!' with Jason Van Gumster - Subsurface Talks podcast #10 1 By dj on February 25, 2025 People Subsurface Talks podcast's 10th guest is the legendary Jason van Gumster, author of Blender for Dummies and countless other Blender-related activities.As he describes himself - a member of the 'Blender old farts club'. Neither age nor impressive experience takes away any of Jason's contagious energy and enthusiasm. Whether it's writing crazy science fiction prose, making 3D printable designs in Blender, or coding - Jason approaches each of those seemingly non-related activities with the same curiosity and all-in approach. Adding the fact that he decided to live and travel with his family across the USA in a mobile house for more than a year just makes this interview a must-watch for anyone who asks: How is this all possible in one man's life? You may find the answer (or even more questions) in this episode:If you don't like watching YT videos (or our faces ;)) you can just listen to the episode here.Enjoy! DJ Donald Dade on February 26, 2025 03:06 AM I had the pleasure of meeting Jason at SIGGRAPH. Man, contrinutions to Blender aside, he's just an all-around awesome human being... he treated my Blender problem like it was his problem, and put me in contact with the dev who could help me. Reply"
year_published = 2025
year_updated = 2025
