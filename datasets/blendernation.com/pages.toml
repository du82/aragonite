full_description = "How to Fracture Anything Using Geo Nodes! 0 By Kenan Proffitt on February 26, 2025 Videotutorials Tired of using Blender's old cell fracture add-on? In this video Kenan Proffitt shows you how to make your own procedural fracture tool in blender using Geometry Nodes. Tired of using Blender's old cell fracture add-on? In this video Kenan Proffitt shows you how to make your own procedural fracture tool in blender using Geometry Nodes. Tired of using Blender's old cell fracture add-on? In this video Kenan Proffitt shows you how to make your own procedural fracture tool in blender using Geometry Nodes. Kenan Proffitt Facebook I’ve been a blender enthusiast for over a decade now, and I’m constantly amazed at how this powerful software has evolved. I have been fortunate to establish a professional career in the film industry, working at an animation studio as an Environment Supervisor. It seems no matter the project, I always come back to Blender! Blender is among the pieces of software I use every day on animated features films, and I absolutely love it! Some years ago I found a niche on YouTube using Blender for VFX. This introduced me to the wonderful community that surrounds our beloved software. I continually seek to learn from others and share my experience and knowledge, as we all help each other grow in our digital creativity."
