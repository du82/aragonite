full_description = "Running BlenderNation takes a lot of time and energy (about 1-2 hours each day), and I need to make a bit of money to keep running it. If you enjoy BlenderNation and you think it's a valuable resource to the Blender community, please take a moment to read how you can be supporting BlenderNation financially - it doesn't need to cost you anything! The most obvious way to generate some income for me is through banner advertisements. With the latest BlenderNation redesign, I took a lot of care to make the banners as unobtrusive as possible, and I review all banners each day to remove the crappy ones. If you're using an AdBlocker like 50% of my readers, then please consider adding BlenderNation to your whitelist. It really does help. If ads are not your thing, then please consider making a small monthly donation through the BlenderNation Patreon page. You can decide which amount to 'pledge'. THANKS! Alternatively, BitCoin is also a great way to donate. Here's my address: 14s299LGRmSX5dxtcuY4gqUgn2tW3nCz8m. Finally, if you're doing any on-line shopping then you could start your shopping sessions though one of my affiliate links. This will give me a percentage of your purchase without disclosing any personal information, and it doesn't cost you anything extra. The Blender Market provides the best Blender assets and add-ons. Start your visit through my affiliate link to support BlenderNation!"
