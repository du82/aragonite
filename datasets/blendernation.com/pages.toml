["https://www.blendernation.com/2025/03/01/seattle-blender-user-group-this-saturday"]
title = "Seattle Blender User Group this Saturday - BlenderNation"
description = "Seattle Blender User Group's in-person meeting is this Saturday! When: Saturday, March 1st, 10 AM to 1 PM Where: Academy of Interactive Entertainment, 305 Harrison St #405 · Seattle, WA What: Gory monsters! Hand painted texturing! 3D for concept art! Modifier stacks! After years of deep diving on Geometry Nodes, the goal for this Seabug is to not show ANY geonodes projects. Let's get back to the classics: pushing polygons, slappin' down textures, inserting keyframes, makin' your anime OCs, the good ol' days! Of course, if YOU'VE got one of those arcane and obtuse forays into geometry nodes, python, etc, then feel free to blast off and show us your cool new project. See you Saturday!Link  Seattle BUG: Saturday, March 1"
full_description = "Seattle Blender User Group this Saturday 0 By ogbog on March 1, 2025 Usermeetings Seattle Blender User Group's in-person meeting is this Saturday! When: Saturday, March 1st, 10 AM to 1 PM Where: Academy of Interactive Entertainment, 305 Harrison St #405 · Seattle, WA What: Gory monsters! Hand painted texturing! 3D for concept art! Modifier stacks! After years of deep diving on Geometry Nodes, the goal for this Seabug is to not show ANY geonodes projects. Let's get back to the classics: pushing polygons, slappin' down textures, inserting keyframes, makin' your anime OCs, the good ol' days! Of course, if YOU'VE got one of those arcane and obtuse forays into geometry nodes, python, etc, then feel free to blast off and show us your cool new project. See you Saturday!Link Seattle BUG: Saturday, March 1"
