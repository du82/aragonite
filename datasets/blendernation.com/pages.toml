title = "Facial animation is easy now! - BlenderNation"
description = "Animating realistic faces is one of the hardest things to do in 3D animation. Thankfully we now have tools that allow you to record your face and apply those movements directly to your characters. Jamie Dunbar shows how.In this video I'll show you a completely free method to achieve this, as well as some paid tools to speed up your pipeline."
full_description = "Facial animation is easy now! 0 By Jamie on February 17, 2025 Videotutorials Animating realistic faces is one of the hardest things to do in 3D animation. Thankfully we now have tools that allow you to record your face and apply those movements directly to your characters. Jamie Dunbar shows how.In this video I'll show you a completely free method to achieve this, as well as some paid tools to speed up your pipeline. Videotutorials February 15, 2025 Advanced Blender Tutorial: Colorful Abstract Motion Graphics with Geometry Nodes Timelapse February 14, 2025 From Concept to Render: Crafting a Stylized Fantasy Environment in Blender"
