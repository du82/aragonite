title = "Blender LTS Updated: 4.2.7, 3.6.21 Released - BlenderNation"
description = "It's time to update your Blender LTS! Both the 4.2 and 3.6 branches have received some critical updates. The 'Long Term Support' versions offer stability for environments that require it, at the cost of not receiving any new features. Blender 4.2.7 LTS, supported until July 2026, received 18 fixes. Blender 3.6.21 LTS, supported until June 2025, received 3 fixes."
