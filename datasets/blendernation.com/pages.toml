title = "Blender AdNet: Advertise on BlenderNation and Blender Artists - BlenderNation"
description = "BlenderNation and Blender Artists are the two largest Blender websites, and promoting your product on them will help you reach a substantial part of the Blender community. We offer promotion options…"
full_description = "BlenderNation and Blender Artists are the two largest Blender websites, and promoting your product on them will help you reach a substantial part of the Blender community. Please note that 21% VAT will be added for EU based residents and companies. EU-based Companies can provide their VAT ID to receive 0% VAT. Promotions for Blender products or services require a 'Commercial Blender User' Patreon status. This membership costs $10/month. After signing up, you can submit your story here. BlenderNation is a fast moving website, and news will quickly disappear from the top of the news list. A Promoted Post will be placed at the top of the community news list for 24 hours, and is labeled with '[free, promoted]' or '[$, promoted]'. On average, this will generate 7,500 additional impressions per day. Display your product on all pages of BlenderNation and Blender Artists. Free promotion is available for affiliate links (such as Blender Market or Gumroad). The number of impressions are based on availability, and depend on the affiliate percentage: a 20% affiliate fee will get you twice the number of impressions as 10%, etc. After you have set up your affiliate links, submit your free banner requests here. Max. 4 free banners per user. Example: You run a campaign for a Blender Market product (affiliate link) with 3 different banners, and boost them with 10,000 additional daily impressions for 15 days. Your total campaign budget is 150,000 impressions, or EUR 100. AdNet advertisers can log in to monitor and optimise campaign performance, and can run as multiple banners from the same campaign budget. Display your message on the large header graphic on BlenderNation and Blender Artists. Headers on BlenderNation articles will stay on the articles that were published that day. We offer promoted social messages at the following rates (see follower counts at the top of this page): Discounts are available for larger campaigns, please contact us using the form below to discuss your options."
