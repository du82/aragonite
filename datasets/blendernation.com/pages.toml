title = "Add-on: Attraction - BlenderNation"
description = '''Peter de Reuver created a Python script to generate 'attractor' type structures.Inspired by the newsitem from Gamel I made a little add-on (formulacurves from Lorenz and Rossler attractors)..Just being a hobbyist it's not perfect, but you can generate nice curves with it (see example). Not all combinations of parameters will generate a "true curve". But just play around and i'm sure will get something nice!! Who does want to be attracted???Happy Christmas to all!Link  add_curve_formulacurves.py'''
full_description = '''Add-on: Attraction 5 By Community Reporter on December 24, 2014 Add-ons Peter de Reuver created a Python script to generate 'attractor' type structures.Inspired by the newsitem from Gamel I made a little add-on (formulacurves from Lorenz and Rossler attractors)..Just being a hobbyist it's not perfect, but you can generate nice curves with it (see example). Not all combinations of parameters will generate a "true curve". But just play around and i'm sure will get something nice!! Who does want to be attracted???Happy Christmas to all!Link add_curve_formulacurves.py mike kelly on December 24, 2014 18:28 PM pretty cool, might be able to use this for something. thanks Reply Anamorphis on December 25, 2014 16:13 PM Thanks so much! I was wondering what were the settings and properties of the "curve" shown in the image, all I get is flat objects. Any help would be awesome! Reply Peter de Reuver on December 25, 2014 17:48 PM Hi(sorry didn't save it as a preset) (maybe check properties panel curveproperties and choose 3d)just choose type lorenz (x y z scale 2)25 points ( bevel 0.15length 50 constants 1 0 28 1.14this should give a good starting point Hope it will work Reply'''
