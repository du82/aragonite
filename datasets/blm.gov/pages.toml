full_description = "Home About Data Data Resources The BLM, with its extensive and complex land-management mission across 245 million surface and 700 million sub-surface acres, regularly gathers, maintains, and publishes various types of data to inform stakeholders and the general public about its stewardship responsibilities. This data includes detailed information on the commercial uses of the public lands (such as energy development, livestock grazing, mining, and timber harvesting); recreational activities and revenues; wild horse and burro management, including figures relating to on-range herd populations, removals from the range, and national adoption figures; cadastral (mapping) surveys; conservation of rangeland resources and more than 870 special units, such as wilderness areas, that are part of the BLM's 34 million-acre National Conservation Lands system; and the socio-economic impacts of public land management. Below are links to publications, such as Public Land Statistics and A Sound Investment for America, that collectively tell the story of how the BLM is managing America's public lands for a variety of uses. Socioeconomic Data Learn about the economic contributions from and intangible benefits of your public lands. Public Land Statistics The BLM publishes the Public Land Statistics report annually. Each report provides information about our multiple-use land management activities. Read and download Public Land Statistics reports. Program Data Through the links below, access some of our most popular program data. Energy and Minerals Oil and Gas Statistics Coal Lease Statistics Renewable Energy Tables Oil and Gas Lease Sale Results National Conservation Lands Maps, Data, and Other Resources Wild Horse and Burro Data Tables About Our Mission Leadership Organization Chart What We Manage How We Manage Regions History of the BLM Laws and Regulations FOIA Data Data Quality Socioeconomic Data Public Land Statistics Oregon Data Management Related Resources Land Records BLM GIS Data Pages Socioeconomics Program Data.gov NSSI Data Catalog Popular Infographics View and download our most popular infographics. BLM Overview The Growing West National Conservation Lands Wild Horse and Burro Grazing"
