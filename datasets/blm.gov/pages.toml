ngineer Eddie Sanchez – seasonal wildland firefighter to engineer California Meet the Engineers: BLM California celebrates 2025 National Engineers Week by getting to know some of our finest! Alaska A boatload of recreational opportunities More stories Quick Facts As steward for much of America’s public lands, the BLM manages some of the nation’s most historic and scenic landscapes, as well as vast natural resources, for the benefit of all Americans. About BLM Contact Us 245 Million acres of public lands managed 43K Recreation jobs supported with over 374k jobs overall 30% Approximate percentage of Nation's minerals managed $1.2 Economic contributions from Geothermal, Wind & Solar in billions Featured Places Check out the sections below for recreation activities across your public lands Three Rivers Petroglyph Site Bonneville Salt Flats, Utah Tumey Hills, California San Pedro Riparian NCA, Arizona PreviousNext Featured Topics Explore some of our programs Priorities Our mission and our priorities Recreation BLM's recreation resources and visitor services support strong local economies and public land conservation. Cultural Heritage Experience history on your public lands Fish and Wildlife BLM-managed fisheries and wildlife resources are an important part of our multiple-use mission. Fire and Aviation BLM is considered a leader in wildland fire management efforts. Law Enforcement Law enforcement plays an integral role in ensuring public safety and fulfilling our multiple use mission. Wild Horse and Burro BLM manages and protects wild horses and burros on 26.9 million acres of public lands. National Conservation Lands Primarily located in the West, the BLM’s National Conservation Lands represent some of the West’s most spectacular landscapes. Planning and NEPA The BLM makes sure that its Resource Management Plans meet the requirements of the National Environmental Policy Act (NEPA). Popular Links Some of our most popular content Visit Us Camping Our Stories Careers Publ