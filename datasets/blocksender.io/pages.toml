title = "How to Delete All Promotions Emails in Gmail"
description = "Organizing your bedroom by getting rid of items you no longer need makes it easier and more comfortable to bring in new stuff. We can also apply this to our Gm..."
full_description = '''BlogArticlesHow to Delete All Promotions Emails in GmailAdmin<style>.lazyload-placeholder { display: none; }</style>Introduction Organizing your bedroom by getting rid of items you no longer need makes it easier and more comfortable to bring in new stuff. We can also apply this to our Gmail account by deleting unnecessary emails to free up space for newer, more important emails. An easy way to find such unnecessary emails is to look in the Promotions tab. In this article, we will learn how to delete all promotional emails in Gmail, both on desktop and mobile. We'll also take a look at what Promotional Emails are and why you should delete them. What are Promotional Emails? A promotional email is considered to be a marketing or commercial email. It usually includes special offers, newsletters, a list of new services or products, and other "calls to action" emails sent to the audience. The target audience could be anyone the company wants to inform about their new services, products, deals, etc. To be clear, not all of these emails are necessarily bad. Maybe there are situations in which you actually want to receive these kinds of emails, or at least from specific companies, like your favorite bakery sending out their weekly deal. Luckily, in these cases, Gmail will allow you to drag the specific email from the "Promotions" tab to the "Primary" tab, indicating to Gmail that you want to see this email. Unfortunately, for most people, there are very few promotional emails that they really care to see. How Does Gmail Detect a Promotional Email? When emails are sent to recipients, Gmail uses an algorithm to determine whether they contain deals, offers, newsletters, a list of products or services, or other promotional messages. 84.5% of scanned emails containing the above list end up in your Gmail account's promotion tab. It works in a very similar way to a spam filter in which an algorithm collects many different data points (i.e., number of links, the existence of certain keywords, number, and type of images, etc.) and uses those data points to decide if it's likely that the email is promotional in nature. Like the spam filter, Gmail is always working to improve the algorithm, and marketers are always trying to find ways to avoid getting filtered into the Promotions tab. Why Delete Promotional Emails? One of the main reasons why we may want to delete promotional emails is so that they don't take up space in our Google account. Free Google accounts have a limit of 15 GB, which counts storage between your Gmail account, Google Drive, and Google Photos. This storage can be upgraded to 100 GB for $2/month, but there's not much point in paying for storage if it's just to save marketing emails in your inbox. Not only do they take up your account's storage, but having too many unwanted emails in your inbox can cause a big clutter problem. Imagine you're trying to search for an email in your inbox about your son's basketball practice, but all of the emails that come up are about deals on basketballs from a sporting goods store. With years of promotional emails collecting in your inbox, scenarios like this are actually pretty common. Deleting All Promotional Emails on Desktop You can find that most of the promotional emails are, unsurprisingly, located in the Promotion tab in your Gmail account. Click on the Promotion tab with the price tag icon, as shown in the image below: <img src="https://block-sender.s3.amazonaws.com/media/how-to-delete-all-promotions-emails-in-gmail-1.png" alt="promotions tab"/> Let's start by deleting these promotional emails from your Gmail account. To begin, select all promotional emails by clicking on the checkbox icon in the top-left corner of your inbox, as shown here: <img src="https://block-sender.s3.amazonaws.com/media/how-to-delete-all-promotions-emails-in-gmail-2.png" alt="select all promotional emails"/> After that, we need to select the remaining promotional emails in your inbox as well. The first checkbox we click only selected the promotional emails you're currently viewing, but Gmail also gives you the option to select all promotional emails. To do this, click the blue text that says "Select all [number] conversations in Promotions". Once clicked, it should then say, "All [number] conversations in Promotions are selected". <img src="https://block-sender.s3.amazonaws.com/media/how-to-delete-all-promotions-emails-in-gmail-3.png" alt="select all promotional emails in inbox"/> Now, to actually delete these, click on the bin icon that appears after we have selected all of the emails we want to delete: <img src="https://block-sender.s3.amazonaws.com/media/how-to-delete-all-promotions-emails-in-gmail-4.png" alt="delete promotional emails"/> Once that is done, you have successfully deleted all Promotional Emails in your Gmail account! Now, let's proceed to delete All Promotional Emails in Gmail on Mobile. Deleting All Promotional Emails on Mobile As of now, Google hasn't made it possible to select multiple emails at once on mobile. Rather, simply hold down each promotional email to mark the ones you want to delete, then click the bin icon at the top. On mobile, however, another technique can be used to select all Promotional emails at once. Access the web version of Gmail on your mobile device (as opposed to via the app). Doing this on desktop is definitely easier, but if you don't have any other choice, then follow these instructions for mobile. First, ensure that you are logged in, and and after doing so, you'll be redirected to another page. Simply click the "Use Web Version" button, which is shown here: <img style="height:540px;width:auto;border:solid #aaaaaa 1px" src="https://block-sender.s3.amazonaws.com/media/how-to-delete-all-promotions-emails-in-gmail-5.png" alt="gmail web version on mobile"/> Note: You'll find the "Use Web Version" button at the bottom part of the page, under the blue button. After you have done that, you will be directed to the page below. Click on the menu icon at the top-left side of the page: <img style="height:540px;width:auto;border:solid #aaaaaa 1px" src="https://block-sender.s3.amazonaws.com/media/how-to-delete-all-promotions-emails-in-gmail-6.png" alt="gmail html menu"/> Once done, you will be directed to your menu page. Click on the "desktop" link, which is at the bottom part of the menu page: <img style="height:540px;width:auto;border:solid #aaaaaa 1px" src="https://block-sender.s3.amazonaws.com/media/how-to-delete-all-promotions-emails-in-gmail-7.png" alt="gmail desktop link from mobile"/> You should then be directed to the following page: <img style="height:540px;width:auto;border:solid #aaaaaa 1px" src="https://block-sender.s3.amazonaws.com/media/how-to-delete-all-promotions-emails-in-gmail-8.png" alt="gmail desktop view on mobile"/> Now zoom in to the bottom part of this page where you will find the "standard" link, just as shown here: <img style="height:540px;width:auto;border:solid #aaaaaa 1px" src="https://block-sender.s3.amazonaws.com/media/how-to-delete-all-promotions-emails-in-gmail-9.png" alt="gmail standard button"/> Once you have located the "standard" link, click it and you will be directed to your Gmail account in the desktop view: <img style="height:540px;width:auto;border:solid #aaaaaa 1px" src="https://block-sender.s3.amazonaws.com/media/how-to-delete-all-promotions-emails-in-gmail-10.png" alt="promotional tab on mobile"/> From here on out, the process is much like the in the desktop version. To locate the promotional emails in your inbox, click on the Promotion tab: <img style="height:540px;width:auto;border:solid #aaaaaa 1px" src="https://block-sender.s3.amazonaws.com/media/how-to-delete-all-promotions-emails-in-gmail-11.png" alt="promotion button on mobile"/> Once you have located the promotional emails, click on the checkbox in the top-left side of the page to select all emails in this page. Again, you'll need to then click the blue text saying "Select all [number] conversations in Promotions" to select all promotional emails, and not just the ones on that page. <img style="height:540px;width:auto;border:solid #aaaaaa 1px" src="https://block-sender.s3.amazonaws.com/media/how-to-delete-all-promotions-emails-in-gmail-12.png" alt="select emails on mobile"/> To delete all selected emails, click on the trash bin icon near the top of the page: <img style="height:540px;width:auto;border:solid #aaaaaa 1px" src="https://block-sender.s3.amazonaws.com/media/how-to-delete-all-promotions-emails-in-gmail-13.png" alt="delete emails on mobile"/> After this is done, you will have successfully deleted all promotional emails from your Gmail account! Unsubscribe From Promotional Emails Once your inbox is cleared of promotional emails, it's time to prevent it from getting overloaded with them again. It's just a matter of time before promotional emails will again start piling up in your inbox. To avoid that from happening, you should unsubscribe from unwanted promotional emails. Luckily, with Gmail, you don't have to search for the "unsubscribe" link hidden at the bottom of emails. Instead, you can simply click the "Unsubscribe" button that Gmail displays at the top of promotional emails. This option is safer than clicking the unsubscribe link, which can be potentially malicious. <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/how-to-delete-all-promotions-emails-in-gmail-14.png" alt="Gmail unsubscribe button"/> However, Gmail may not display the unsubscribe button for some promotional emails for various reasons. In such cases, you should not click the unsubscribe link provided by the sender as a last resort. Instead, use a third-party email blocking tool such as Block Sender to block such emails without unsubscribing. How to Block Promotional Emails in Gmail Consider using third-party tools if you are unable to unsubscribe from some promotional emails or looking for a quicker solution. One such effective tool is BlockSender. With this email-blocking tool, you can easily block promotional emails in Gmail without unsubscribing! What's more, it also offers the option to block promotional emails in bulk, saving you both time and effort. If you haven't already, sign up for Block Sender, link your Gmail account, and start using this tool to block unwanted promotional emails in Gmail. It's also available as a browser extension, allowing you to block emails directly from your inbox. In this tutorial, we'll discuss the blocking process using the Chrome extension for BlockSender. Open Gmail on your desktop and log in to your account. Open any promotional email you want to stop receiving. Click on the block icon and select "Emails from this sender" from the menu. <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/how-to-delete-all-promotions-emails-in-gmail-15.png" alt="Block Sender block emails from this sender option"/> Selecting this option will prevent future emails from this address from reaching your Gmail inbox. All blocked emails will be sent to the Trash folder. Block Promotional Emails in Bulk Follow the below steps if you want to block multiple promotional emails in one go: Select at least one email for each email address you wish to block. Click on the block icon at the top and select "Block Selected Emails". <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/how-to-delete-all-promotions-emails-in-gmail-16.png" alt="Block Sender block senders in bulk"/> Select "Delete (skip trash)" if you want the emails to be permanently deleted upon receipt and not move to the Trash folder first for 30 days. (Optional) <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/how-to-delete-all-promotions-emails-in-gmail-17.png" alt="Block Sender skip trash folder"/> Note: You won't be able to recover the blocked emails if you select the Delete option. From the pop-up window, click "Create X Blocks". Once these blocking rules are set up, Block Sender will block all future emails from these email addresses. Conclusion In this article, we have learned what promotional emails are, why it's usually best to delete them, and how to delete all promotional emails from our inbox on both desktop and mobile devices. We also discussed two ways to stop receiving promotional emails in the future: unsubscribing and using third-party tools like Block Sender to block these emails without unsubscribing. While the practices mentioned in this article should be good enough for most people, more drastic steps can be taken on your account, like deleting all emails from your inbox. This might be useful if you want a fresh start or your inbox has gotten so out of control that it's too difficult to clean up. For cases like this, check out our other article How to Delete All Emails in Gmail. # gmail# how toLast Updated: February 3rd, 2025Was this article helpful?In this articleIntroductionWhat are Promotional Emails?How Does Gmail Detect a Promotional Email?Why Delete Promotional Emails?Deleting All Promotional Emails on DesktopDeleting All Promotional Emails on MobileUnsubscribe From Promotional EmailsHow to Block Promotional Emails in GmailBlock Promotional Emails in BulkConclusionBetter email blocking for Gmail.Sign up for free, no credit card required, upgrade or downgrade at any time.Get startedLearn more →'''
