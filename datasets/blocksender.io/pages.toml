title = "How to Delete All Emails From One Sender in Gmail (Bulk and Auto-Delete Methods)"
description = "While cleaning your inbox, you may need to mass-delete all emails from a single sender. This could be to remove spam emails or delete old emails that are no lo..."
full_description = '''BlogArticlesHow to Delete All Emails From One Sender in Gmail (Bulk and Auto-Delete Methods)Admin<style>.lazyload-placeholder { display: none; }</style>Introduction While cleaning your inbox, you may need to mass-delete all emails from a single sender. This could be to remove spam emails or delete old emails that are no longer needed but are taking up storage space. Deleting these emails will create more space for newer emails and reduce inbox clutter. Gmail allows for bulk deletion of emails. Additionally, you can use a custom Gmail filter to automate the deletion of future emails from a certain sender. However, clearing those emails from the Trash folder cannot be automated using Gmail alone. Several third-party tools such as Block Sender can help you with this task. Without further ado, let's jump in to see how you can delete all messages from a certain sender in Gmail. How to Delete All Emails From One Sender in Gmail In this section, we'll discuss how to delete all emails from one sender on both the Gmail desktop and mobile app. If you want to delete both the existing and future incoming emails from this sender, skip to the next section. However, if you only want to delete existing emails, here's how you can achieve that: On Desktop Go to Gmail and log in to your account. Click the button highlighted in the image below to open the search options. <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/how-to-delete-all-emails-from-one-sender-in-gmail-bulk-and-auto-delete-methods-1.png" alt="Gmail search options"/> In the From field, type the sender's email address whose emails you wish to delete from your account and click the "Search" button. <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/how-to-delete-all-emails-from-one-sender-in-gmail-bulk-and-auto-delete-methods-2.png" alt="Gmail filter"/> Select the checkbox at the top to select all emails. <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/how-to-delete-all-emails-from-one-sender-in-gmail-bulk-and-auto-delete-methods-3.png" alt="Gmail select all matched conversatiions"/> This option only selects the emails shown on the current page. If there are more emails on the next pages, an option to select all matched emails will be displayed at the top. Click the "Select all conversations that match this search" option to select all emails from the specific sender. Delete the emails by clicking the "Trash" icon at the top. <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/how-to-delete-all-emails-from-one-sender-in-gmail-bulk-and-auto-delete-methods-4.png" alt="Gmail delete all selected emails"/> Click "OK" to confirm the deletion of emails. <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/how-to-delete-all-emails-from-one-sender-in-gmail-bulk-and-auto-delete-methods-5.png" alt="Gmail confirm bulk deletion"/> On Mobile (Android/iOS) The process of deleting all emails from one sender on the Gmail mobile app is almost the same on the desktop. The only downside is that you cannot quickly select all emails at once as in the Gmail browser app. You will have to scroll all the way to the bottom to collectively select all emails. However, this will not take much time if there are not a lot of emails from the specific sender. Open the Gmail mobile app. In the search bar at the top, type the sender's email address using the "from" search operator, e.g., from:[email protected]. and press enter. To select all emails, scroll until you reach the last email. Long-press any email from the specific sender and tap "Select all" at the top. Tap on the "Bin" icon, as shown in the image below. <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/how-to-delete-all-emails-from-one-sender-in-gmail-bulk-and-auto-delete-methods-6.png" alt="Gmail mobile app bulk email deletion"/> How to Auto-Delete Emails From One Sender Using Gmail Filters In the previous section, you learned how to delete all messages from a specific sender in Gmail. Gmail also allows you to set up a filter to automatically delete all incoming messages from a specific sender. This is much more convenient than manually deleting emails. Note: Gmail filters can only be set using the desktop app. Click on the gear icon at the top to open Settings. Select "See all settings". <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/how-to-delete-all-emails-from-one-sender-in-gmail-bulk-and-auto-delete-methods-7.png" alt="Gmail settings"/> Navigate to "Filters and Blocked Addresses". <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/how-to-delete-all-emails-from-one-sender-in-gmail-bulk-and-auto-delete-methods-8.png" alt="Gmail filters and blocked addresses"/> Click "Create a new filter". In the From field, type the email address of the sender whose emails you want to delete from your Gmail account. <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/how-to-delete-all-emails-from-one-sender-in-gmail-bulk-and-auto-delete-methods-9.png" alt="Gmail create filter"/> Click "Create filter". Select the "Delete it" and "Also apply filter to matching conversation" options. <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/how-to-delete-all-emails-from-one-sender-in-gmail-bulk-and-auto-delete-methods-10.png" alt="Gmail filter all incoming emails from a sender"/> Note: Make sure to select the last option to also delete all existing emails from this sender. Click "Create filter". Once this filter is set up, any incoming emails from this specific sender will be automatically deleted by Gmail. This filter will also delete existing emails from this sender. This process may take long to complete if you have received a lot of emails from them. How to Permanently Delete Emails From Trash Folder Deleting emails will not immediately free up storage space as these emails are still kept in the Trash folder for 30 days. Gmail allows you to recover the deleted emails within this timeframe. If your Gmail storage is full, you can manually clear the Trash folder to permanently delete the emails. Open the Trash folder. Click "Empty Trash now" to delete all emails. <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/how-to-delete-all-emails-from-one-sender-in-gmail-bulk-and-auto-delete-methods-11.png" alt="Gmail empty trash folder"/> Click "OK" to confirm the deletion. Wondering if you can also automate this process using Gmail filters? Unfortunately, Gmail doesn't offer the option to permanently delete emails as they are received. However, you can use BlockSender - an email productivity tool that allows you to perform this action and much more. Using Block Sender to Automatically and Permanently Delete Emails In this tutorial, we'll explain how you can use BlockSender's Chrome extension to permanently delete emails from a certain sender upon receipt. You can use the web dashboard as well but the Chrome extension is much more convenient to block emails right from your inbox. Download the BlockSender Chrome extension if you haven't already and start using it by linking your Gmail account. To permanently delete emails from a specific sender, follow the simple steps given below. Log in to the Gmail desktop app. Click on the "Block" icon at the top and select the "New Block" option from the dropdown. <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/how-to-delete-all-emails-from-one-sender-in-gmail-bulk-and-auto-delete-methods-12.png" alt="Block Sender create new block"/> Type the email address of the sender in the "Email to Block" field. Select "Delete (skip trash)" from the next dropdown to permanently delete the emails when they arrive. <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/how-to-delete-all-emails-from-one-sender-in-gmail-bulk-and-auto-delete-methods-13.png" alt="Block Sender blocking rule options"/> Note: With this option selected, you won't be able to recover the deleted emails so use it cautiously. Click "Save". Once this "block" is created, you will no longer need to remove deleted emails from the Trash folder as they will be permanently deleted by BlockSender. Bonus Tips Unsubscribe First: While deleting newsletter and promotional emails that you never read, you should consider unsubscribing from these emails first. This way, those services will remove you from their mailing list and you will no longer receive emails from them. Using the Gmail unsubscribe button is the preferred way to unsubscribe from emails rather than using the unsubscribe link hidden at the bottom of the email which can be potentially malicious. Archive Instead of Deleting If you cannot decide whether or not to delete all emails from a certain sender because you might need those emails later, you can choose to archive them instead. This will remove those emails from your inbox but not delete them. You can still access them in your account whenever you want. Note: A common misconception is that archived emails take up less storage space. Note that archiving emails doesn't free up space. Conclusion In this article, you learned how to delete all emails from one sender in Gmail. We discussed the process for both the desktop app and the mobile app. Mass deletion of emails is much simpler and quicker using the desktop app. Deleting emails from the inbox doesn't free up space immediately unless they are removed from the Trash folder as well. Emails moved to the trash folder are auto-deleted after 30 days or you can do so yourself anytime to free up space quickly. You can also automate the deletion of future emails received from the sender by setting up a Gmail filter. However, Gmail filters cannot permanently delete the emails. For this, you can leverage BlockSender, a third-party tool that can permanently delete certain incoming emails - saving you time. # gmail# how toLast Updated: February 10th, 2025Was this article helpful?In this articleIntroductionHow to Delete All Emails From One Sender in GmailOn DesktopOn Mobile (Android/iOS)How to Auto-Delete Emails From One Sender Using Gmail FiltersHow to Permanently Delete Emails From Trash FolderUsing Block Sender to Automatically and Permanently Delete EmailsBonus TipsConclusionBetter email blocking for Gmail.Sign up for free, no credit card required, upgrade or downgrade at any time.Get startedLearn more →'''
