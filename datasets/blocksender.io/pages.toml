["https://blocksender.io/how-to-block-unwanted-emails-from-hotmail-com"]
title = "How to Block Unwanted Emails from Hotmail.com"
description = "Are unwanted emails from Hotmail.com leaving you frustrated, and are you looking for possible solutions to get rid of them? Is your inbox becoming difficult to..."
full_description = '''BlogArticlesHow to Block Unwanted Emails from Hotmail.comAdmin<style>.lazyload-placeholder { display: none; }</style>Introduction Are unwanted emails from Hotmail.com leaving you frustrated, and are you looking for possible solutions to get rid of them? Is your inbox becoming difficult to manage, causing you to accidentally miss important emails? If these issues resonate with you, then you're in the right place. This article explains why choosing to block the entire hotmail.com domain from your inbox isn't always the best option and presents other alternatives for controlling emails from this domain. By the end of this article, you'll have a clear understanding of managing Hotmail emails using both Gmail and Block Sender. Why Blocking the Hotmail Domain Might Be a Bad Idea If you're receiving a lot of spam or unwanted emails from Hotmail addresses, you might be considering to block the entire hotmail.com domain. Since Hotmail was discontinued in 2013 and rebranded as Outlook, this may seem like the right approach. Most businesses use custom email domains or modern email providers such as Gmail, Yahoo, or Outlook. Many people avoid using Hotmail because it's outdated, and better, more contemporary alternatives are available. Most employers don't prefer candidates using Hotmail addresses since it may appear unprofessional and is not aligned with the latest technology. However, it is still used by some people for personal correspondence or online shopping. Despite the reasons mentioned above, it's still not a good idea to block the entire "hotmail.com" domain. Although the Hotmail email provider is no longer operational, all Hotmail addresses are now accessible through Microsoft Outlook. Microsoft still allows users to own and create Hotmail addresses. Another important note is that "hotmail.com" itself is not inherently spammy. If you block the entire domain, you may miss many important emails. Blocking it will result in both legitimate and unwanted emails from Hotmail addresses being marked as spam, leading to important emails being unintentionally missed. How to Handle Unwanted Hotmail Emails Using Gmail Gmail provides several features that you can leverage to manage unwanted emails from hotmail.com. Block the Domain You may lose important emails if you block the entire hotmail.com domain, so perform this action only if necessary. If you do perform this action, we advise you to check the spam folder regularly for any legitimate emails. Unfortunately, Gmail only provides the option to delete the emails. This is why we recommend using Block Sender to block a domain since Gmail doesn't provide the feature to mark filtered emails as spam. Read this article till the end to find out more. Gmail doesn't have the option to block domains directly, but we can perform this action using Gmail Filters. Click Show search options (three sliders icon on the right side of the search bar). <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/how-to-block-unwanted-emails-from-hotmail.com-1.png" alt="Gmail search options"/> In the From field, enter the domain @hotmail.com and click Create Filter. <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/how-to-block-unwanted-emails-from-hotmail.com-2.png" alt="Gmail filter criteria"/> Select Delete it from the list of available options and click Create Filter. <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/how-to-block-unwanted-emails-from-hotmail.com-3.png" alt="Gmail create filter"/> After setting up this filter, all future emails from any Hotmail addresses will automatically be sent to the trash folder, where they will be deleted after 30 days. Block the Sender If someone from hotmail.com is bombarding you with unwanted emails, you can block that sender to stop receiving those emails. This action will mark all future emails from that particular Hotmail account as spam. Open any email received from that sender. Click on the three vertical dots menu in the top-right corner of the email and select Block {sender}. <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/how-to-block-unwanted-emails-from-hotmail.com-4.png" alt="Gmail block sender option"/> Note: Emails in the spam folder are automatically deleted after 30 days. Block Specific Words or Phrases Are you noticing recurring words or phrases commonly used in unwanted emails from Hotmail addresses? If so, block only those emails from the hotmail.com domain containing those specific terms. Gmail filters offer robust options to set this blocking criterion. Here's how you can do this: Click the gear icon in the top-right corner and select See All Settings. <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/how-to-block-unwanted-emails-from-hotmail.com-5.png" alt="Gmail all settings"/> Navigate to Filters and Blocked Addresses and click Create a New Filter. <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/how-to-block-unwanted-emails-from-hotmail.com-6.png" alt="Gmail filters and blocked addresses"/> In the From field, enter the domain @hotmail.com to filter out Hotmail emails. In the Has the words field, enter the words or phrases based on which you'd like to block Hotmail emails, then click Create Filter. <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/how-to-block-unwanted-emails-from-hotmail.com-7.png" alt="Gmail phrase block filter"/> Note: Enclose words or phrases within quotes for an exact match. Use the AND or OR operators in the search query to match all or either one of the terms. Refer to the list of Gmail's search operators to further refine your filtering criteria. Select Delete it from the list of available actions for the filtered email and click Create Filter. <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/how-to-block-unwanted-emails-from-hotmail.com-8.png" alt="Gmail create filter"/> Note: Do not block words or phrases that are common to both legitimate and spam emails, such as "Hello" or "Click here." Doing this could lead to over-blocking and unintentionally cause other emails to be deleted as well, so set up this filtering criterion cautiously. Block Sender Tool for Unwanted Hotmail Emails Do you find Gmail filters very complicated, or do you consider Gmail's blocking options limited in some ways? Then, you should give Block Sender a try. You can sign up for Block Sender and use it through its web-based dashboard or directly through Gmail using its Chrome extension. It offers several options, such as: Blocking senders Blocking domains and domain extensions Blocking IP addresses Blocking emails by header or subject Bouncing back emails And much more! It also provides the convenience of sharing blocking rules across multiple email accounts. Let's discuss how to block emails from Hotmail using the Block Sender Chrome extension. Block the Domain Block Sender provides the option to block domains directly and mark the emails from those blocked domains as spam—a feature not offered by Gmail. While we do not recommend blocking the entire Hotmail domain, if you are still interested, here is how to do it: Click the Block Sender icon in the top toolbar of Gmail, then select New Block. <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/how-to-block-unwanted-emails-from-hotmail.com-9.png" alt="Block Sender create new block"/> Choose Website/Domain from the What do you need to block? dropdown. Enter the domain name hotmail.com in the Website/Domain to Block field. Select Spam from the Where should the blocked emails go dropdown. <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/how-to-block-unwanted-emails-from-hotmail.com-10.png" alt="Block Sender domain blocker"/> Click Save. Block Specific Words or Phrases Unlike Gmail, Block Sender allows you to block specific words or phrases commonly used in spam and unwanted emails with fewer clicks and no complex filters to set up. Open Gmail. Click the Block Sender icon and select New Block. <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/how-to-block-unwanted-emails-from-hotmail.com-9.png" alt="Block Sender create new block"/> Select Phrase from the What do you need to block dropdown. Enter the phrase you wish to block in the Phrase to Block field. Decide where you want blocked emails to be sent, such as Trash, Delete, Archive, or Spam folder. Note: Selecting the Delete option will permanently delete the blocked emails without moving them to the Trash folder for 30 days. <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/how-to-block-unwanted-emails-from-hotmail.com-11.png" alt="Block Sender phrase blocker"/> Select whether to send an auto-response to the sender. (Optional) Click Save. Voila! That's how easy this process is. Conclusion Blocking the entire Hotmail domain due to receiving a few unwanted or spam emails can be problematic. Adopt better strategies and block only selected emails from this domain to ensure you never miss any important communications. You can leverage Gmail's blocking options, or you can use the power of Block Sender for a more comprehensive solution. # how toLast Updated: December 4th, 2024Was this article helpful?In this articleIntroductionWhy Blocking the Hotmail Domain Might Be a Bad IdeaHow to Handle Unwanted Hotmail Emails Using GmailBlock the DomainBlock the SenderBlock Specific Words or PhrasesBlock Sender Tool for Unwanted Hotmail EmailsBlock the DomainBlock Specific Words or PhrasesConclusionBetter email blocking for Gmail.Sign up for free, no credit card required, upgrade or downgrade at any time.Get startedLearn more →'''
