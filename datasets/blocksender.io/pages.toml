full_description = '''BlogArticlesStop Getting Emails from AliExpressAdmin<style>.lazyload-placeholder { display: none; }</style>Introduction Emails from e-commerce platforms can sometimes get out of hand. Once you sign up, your inbox will be bombarded with promotional emails, deals, and product recommendations, to name a few. AliExpress is also notorious for sending such spam emails, including excessive shipping updates. This article is the perfect guide for you if you've had enough of AliExpress spam and are looking for possible solutions to tackle it. It's time to end this persistent spam problem and make your inbox cleaner and more manageable. Why You're Receiving Emails from AliExpress Some reasons for receiving AliExpress emails are subscribing to their newsletter and promotional emails during account creation or checkout. However, in some cases, you may automatically be subscribed to such emails without doing so- a problem that simply unsubscribing may not solve. AliExpress frequently spams users with promotional emails, discounts, and offers. These emails might feel unnecessary if you already receive the same notifications on the mobile app. Additionally, AliExpress sends way too many emails about order and shipping updates. Some of these emails feel unnecessary and only add to the clutter. If these issues resonate with you, read the following sections to learn how to stop getting AliExpress emails. Methods to Stop Receiving Emails from AliExpress Manage Email Preferences on AliExpress One way to disable AliExpress emails is to change your account's email preferences and disable the type of emails you don't wish to receive. On Mobile App Go to settings. <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/stop-getting-emails-from-aliexpress-1.png" alt="AliExpress mobile app settings"/> Navigate to Notification Settings > Email subscriptions. <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/stop-getting-emails-from-aliexpress-2.png" alt="AliExpress notification settings"/> Disable all or some email notifications. (You may want to disable all email notifications if you already receive push notifications related to your orders) <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/stop-getting-emails-from-aliexpress-3.png" alt="AliExpress email subscriptions"/> On Desktop Browser Go to AliExpress and log in to your account. Click on the account icon and open settings from the menu. <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/stop-getting-emails-from-aliexpress-4.png" alt="AliExpress settings"/> On the Settings page, click the activate button under "Activate email notifications." <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/stop-getting-emails-from-aliexpress-5.png" alt="AliExpress activate email notifications"/> Next, enable the notifications you want to receive and disable the rest. Unsubscribe via Email You can unsubscribe from the AliExpress promotional emails or newsletter directly from the email. Such types of emails often have an "unsubscribe" link found at the bottom of the email. Clicking this link will redirect you to a page where you can change your email preferences. E-commerce platforms are a prime target for hackers. The email you received claiming to be from AliExpress may be fake. Therefore, we recommend not clicking the unsubscribe link unless you've verified the email's authenticity. What to Do If the Emails Keep Coming AliExpress has a pesky problem; it sometimes continues to send emails despite unsubscribing multiple times. To tackle this, you can: Block the emails entirely instead of unsubscribing. Report those emails as spam so that similar emails will automatically be marked as spam and not land in your inbox. Block AliExpress Emails with BlockSender You can use third-party tools like BlockSender to stop receiving emails from AliExpress without even unsubscribing. Alternatively, you can set up Gmail filters to archive or delete emails from AliExpress. However, the options provided by Gmail are limited in many ways: Limitations of Gmail Filters No option to delete emails permanently without first sending them to the Trash folder. No advanced filtering criteria such as header, IP Address, domain, or domain extensions. No support for wildcards. Filters cannot be disabled unless they're deleted. The good news? BlockSender offers all that and much more! Use this tool to effectively block unwanted emails from AliExpress from making their way into your inbox. Download the Chrome extension and sign up if you haven't already done so. Block the Sender Using Block Sender, you can block emails from any email address. Open any email from AliExpress. Click the "Block" icon and select "Emails from this sender." <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/stop-getting-emails-from-aliexpress-6.png" alt="BlockSender sender blocking rule"/> Once this blocking rule is set up, all future emails from this email address will automatically be deleted. Block the Domain Block Sender provides you the flexibility to block entire email domains. This way, you can stop receiving messages from any email address using that domain, e.g., "[email protected]" or "[email protected]." Open any email from AliExpress. Click the "Block" icon and select "Emails from this domain." <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/stop-getting-emails-from-aliexpress-7.png" alt="BlockSender domain blocking rule"/> Note: Blocking the entire "aliexpress.com" domain may cause you to miss important emails, so only do so if you don't use their services and don't want to receive any emails from AliExpress. Permanently Delete Blocked Emails (Skip the Trash Folder) With Gmail, you get the option to send filtered emails to the trash folder for 30 days but no option to skip the Trash folder and permanently delete emails. However, you can perform this action with Block Sender. Here's how to configure a "block" to permanently delete blocked emails: Click on the "Block" icon and select "Manage Blocks". <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/stop-getting-emails-from-aliexpress-8.png" alt="BlockSender manage blocks"/> Expand the "Options" drop-down menu for the blocking rule you want to change and click "Edit". <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/stop-getting-emails-from-aliexpress-9.png" alt="BlockSender block edit"/> Select "Delete (skip trash)" from the dropdown and click "Save Changes". <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/stop-getting-emails-from-aliexpress-10.png" alt="BlockSender permanent email deletion"/> With this setting configured, all future blocked emails will be permanently deleted. Note: Use this feature cautiously, as permanently deleted emails cannot be recovered. Only use it if the emails are not important. Disable Blocking Rules Expecting an important email from AliExpress and need to disable blocking temporarily? With Block Sender, you can pause blocking rules and resume them as required. Conclusion This article discussed different approaches to stopping emails from AliExpress. You can disable emails through the app, unsubscribe via the unsubscribe email link, or use the Block Sender app for even more powerful blocking features. Last Updated: January 22nd, 2025Was this article helpful?In this articleIntroductionWhy You're Receiving Emails from AliExpressMethods to Stop Receiving Emails from AliExpressManage Email Preferences on AliExpressUnsubscribe via EmailWhat to Do If the Emails Keep ComingBlock AliExpress Emails with BlockSenderConclusionBetter email blocking for Gmail.Sign up for free, no credit card required, upgrade or downgrade at any time.Get startedLearn more →'''
