full_description = '''BlogArticlesHow to Strikethrough Text in GmailAdmin<style>.lazyload-placeholder { display: none; }</style>Introduction Like any form of communication, it's important to express yourself clearly and effectively. One way to do this is through text formatting, like using strikethroughs. These aren't as commonly used as bold or italics, but they do have their place. But how do we use them in Gmail? This article will show you how to use this feature to make your emails more effective and engaging. What is a Strikethrough? A strikethrough is a horizontal line that crosses out a section of text. Here is an example. It's a common tool used in editing and proofreading to indicate that a piece of text should be disregarded, but it can also be used for emphasis or to create a certain tone or style. For example, you might use a strikethrough to make a joke, to show that you've changed your mind, or to highlight an error. In Gmail, adding a strikethrough to your text is pretty simple and straightforward. Using Strikethrough Text in Gmail To use strikethrough in Gmail, start by composing a new email or replying to an existing one. Once you've written your text, highlight the section that you want to strikethrough. Then, click on the "A" icon in the bottom menu to open the formatting options. <img src="https://block-sender.s3.amazonaws.com/media/how-to-strikethrough-text-in-gmail-1.png" alt="Gmail formatting options"/> You'll find the strikethrough button here—it's the one that looks like a "S" with a line through it. Click on this button to apply the strikethrough to your selected text. <img src="https://block-sender.s3.amazonaws.com/media/how-to-strikethrough-text-in-gmail-2.png" alt="Gmail strikethrough button"/> Note: Remember, the strikethrough button won't appear until you've highlighted some text. So, if you don't see it, make sure you've selected the text you want to strikethrough. <img src="https://block-sender.s3.amazonaws.com/media/how-to-strikethrough-text-in-gmail-3.png" alt="Gmail email with strikethrough"/> Now, let's say you're like me and have a habit of changing your mind. No problem! You can easily remove the strikethrough by highlighting the text and clicking the strikethrough button again. And there you have it—a quick and easy way to include additional style in your emails. Whether you're using it for editing, emphasis, or just for fun, the strikethrough feature in Gmail can help you communicate more effectively. So, go ahead and give it a try. I guarantee you'll be crossing out text like a pro in no time. Strikethrough Text in Gmail Mobile App Unfortunately, the Gmail mobile app doesn't currently support the strikethrough text feature. This is unfortunate since a lot of emails are sent via your phone these days. But, don't worry, there's a workaround! Instead, you can use a strikethrough text generator, like this one. Simply type the text you want to strike out in the generator, copy the strikethrough text it generates, and paste it into your email. It's not as convenient as having the feature built-in, but it gets the job done. Conclusion While Gmail's desktop version allows you to easily strikethrough text, the mobile app version requires a bit of a workaround. So, the next time you want to show text revisions or just have a little fun with your emails, remember these easy steps. # gmail# how toLast Updated: September 7th, 2023Was this article helpful?In this articleIntroductionWhat is a Strikethrough?Using Strikethrough Text in GmailStrikethrough Text in Gmail Mobile AppConclusionBetter email blocking for Gmail.Sign up for free, no credit card required, upgrade or downgrade at any time.Get startedLearn more →'''
