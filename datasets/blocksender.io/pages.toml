["https://blocksender.io/gmail-undo-send-feature-what-it-is-and-how-to-use-it"]
title = "Gmail Undo Send Feature: What It Is and How to Use It"
description = "We often realize mistakes in our emails after we send them. From accidental typos to incorrect information, these mistakes can be embarrassing and, in some cas..."
full_description = '''BlogArticlesGmail Undo Send Feature: What It Is and How to Use ItAdmin<style>.lazyload-placeholder { display: none; }</style>Introduction We often realize mistakes in our emails after we send them. From accidental typos to incorrect information, these mistakes can be embarrassing and, in some cases, have serious consequences. We may accidentally share sensitive data, but once we realize it, it's too late to recall the email. Fortunately, Gmail provides a convenient "Undo Send" feature that allows users to cancel emails within a specific time frame. However, many people don't know how it works or that Gmail's default undo time limit can be changed. How the Gmail Undo Send Feature Works Let's discover how the Gmail Undo Send feature works behind the scenes. You may think that Gmail removes the email from the recipient's inbox when you undo a sent email, but that's not what happens. When you hit send, Gmail doesn't instantly transmit the email to the recipient; instead, it waits for some time. It queues the email to be sent in a few seconds. In other words, Gmail delays sending emails for a short period. In the meantime, you have a short window to cancel the email. After this time limit has passed, you can no longer recall the email. Therefore, you have to take prompt action. Unlike Outlook, Gmail doesn't offer the option to retrieve emails once they've been sent. Gmail's default undo time limit is 5 seconds. However, this may not be enough in most cases. Read this section to find out how to increase it. How to Undo Sent Emails in Gmail Gmail always has the Undo Send feature enabled for convenience. Here's how to use it to undo sent emails. Open Gmail and compose an email. Click the send button. A small notification with undo and view message options will appear at the bottom. On the desktop app, it appears at the bottom left of the window. Click "Undo" to cancel the email. <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/gmail-undo-send-feature-what-it-is-and-how-to-use-it-1.png" alt="Gmail undo send"/> <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/gmail-undo-send-feature-what-it-is-and-how-to-use-it-2.png" alt="Gmail sent email cancelled"/> Note: The undo notification can disappear if you close it or click anywhere else before the time limit expires. If this happens, you won't be able to cancel the email in any other way. The Undo Send option is only available for a short time. The default time limit is 5 seconds, which is too short. However, you can increase it in the Gmail settings. How to Change Undo Time in Gmail You can change the default undo time limit from 5 seconds to up to 30 seconds. However, Gmail does not allow you to increase the undo period further. Note: You can only change the cancellation period in the Gmail desktop app, but the changes also apply to the mobile app. Here's how to change the undo send period on the Gmail desktop app: Open Gmail and log in to your account. Click on the gear icon at the top and click "See all settings." <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/gmail-undo-send-feature-what-it-is-and-how-to-use-it-3.png" alt="Gmail settings"/> In the General tab, choose the desired time frame from the "Undo Send" dropdown. <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/gmail-undo-send-feature-what-it-is-and-how-to-use-it-4.png" alt="Gmail cancellation period settings"/> Scroll to the bottom of the window and click "Save Changes." <img src="https://block-sender.s3.us-east-1.amazonaws.com/media/gmail-undo-send-feature-what-it-is-and-how-to-use-it-5.png" alt="Gmail settings save changes"/> Best Practices for Using Undo Send If used effectively, Gmail's Undo Send feature can be your ally. Here's how to get the most out of it. 1. Use a Longer Time Limit Increase the default undo time limit from five seconds, as explained in the previous section. This way, you will get more time if you need to cancel the email. We recommend increasing the undo time limit to thirty seconds, the maximum Gmail allows. Doing so will delay the sending of emails by thirty seconds. This delay is not significant, and it gives you more time to correct any mistakes. 2. Review Prior to Sending Emails The undo send feature is not for reviewing emails for the first time. The limited undo time window may not be enough for this purpose. The undo-send feature should not be treated as an opportunity for proofreading. Always proofread the email and verify the recipient's address and any attached files before sending the email. The undo option is helpful if you remember any mistakes at the last moment after sending the email. Limitations of the Undo Send Feature Gmail's undo-send feature is limited in many ways. 1. Limited Time Window With the undo feature, you have a limited time to cancel an email before it is sent to the recipient. Once the time limit has expired, you cannot recall the email. 2.Easy to Miss Cancelling an email can be tricky. The only way to cancel an email is to click the "undo" button, which appears as a small notification at the bottom of the screen. However, this is not as simple as it sounds. The notification can vanish if you close it, click on the "view message" option, or anywhere else, leaving no way to cancel the sent email. Frustrating, right? Tips for Avoiding Email Mistakes Gmail's "Undo Send" feature is convenient but has some shortcomings. Rather than relying entirely on this feature, we should avoid making mistakes in our emails. Here are some tips that may help. 1. Proofread the Email Before Sending Always proofread your emails for typos and grammatical errors and verify all the details mentioned in the emails before sending them. Manually looking for mistakes can be time-consuming, and there is still the possibility that you will miss some of them. Therefore, it's recommended to use tools like Grammarly, which can effectively identify typos and grammatical errors in your text, saving you time and helping you write confidently. 2. Double-Check Recipients and Attachments Before hitting "send," confirm that you are sending your email to the intended recipient and have attached the correct files. Most users only review the body of their email before sending it, missing these important details. Conclusion By not sending emails instantly, Gmail allows you to correct any mistakes in your emails. To save you from regret, Gmail offers the option to cancel your emails after you have pressed "send." Not satisfied with the default time limit? Increase the window in your Gmail settings. Proofread your emails before sending them, and avoid using the undo time limit to review the content. Don't rely too much on this feature, as it has certain limitations. Last Updated: January 14th, 2025Was this article helpful?In this articleIntroductionHow the Gmail Undo Send Feature WorksHow to Undo Sent Emails in GmailHow to Change Undo Time in GmailBest Practices for Using Undo SendLimitations of the Undo Send FeatureTips for Avoiding Email MistakesConclusionBetter email blocking for Gmail.Sign up for free, no credit card required, upgrade or downgrade at any time.Get startedLearn more →'''
