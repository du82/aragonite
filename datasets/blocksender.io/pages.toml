["https://blocksender.io/how-to-use-gmail-labels-to-organize-your-emails"]
title = "How to use Gmail Labels to Organize Your Emails"
description = "Gmail labels make it easy to sort, find and manage emails. Read our guide on all you need to use labels like a pro."
full_description = '''BlogArticlesHow to use Gmail Labels to Organize Your EmailsAdmin<style>.lazyload-placeholder { display: none; }</style>At some point as a Gmail user, or with any email client really, you've experienced how overwhelming managing your inbox can be. And if you've moved from or are used to applications like Outlook or Thunderbird, getting used to Gmail can be kind of tricky. One of the most common teething problems users experience is related to sorting emails. Unlike Outlook and other email applications, Gmail doesn't offer folders that you can create to sort your emails. You get Labels. Labels are almost the equivalent of folders in Outlook, but there's a little more to how they work. In this blog post, we'll cover all you need to know about Gmail Labels. So, if you've played with or tested them and felt a little lost, keep reading. We'll share how to use them like a pro to make your Gmail experience more rewarding. What is a Gmail Label? It's a way to tag different emails you receive, making it easier to group emails for easy retrieval. How do they work? Contrary to what most people believe, labels differ from folders in Outlook. Outlook folders can be deleted along with all emails in a folder. On the other hand, when you delete a label in Gmail, the emails associated with the label remain in your inbox. They simply lose the label. Unlike folders in email applications, you can also assign more than one label to an email. This makes referencing emails associated with a certain topic really easy. Throughout the rest of this article, we'll show you how to create, use, and manage your labels in Gmail. How to Create a Label How to Assign Labels to Emails How to Move Emails to Labels How to Read Emails Associated with a Label Managing Your Labels How to Create Sublabels Changing Labels to Sublabels Changing Label Names Removing Labels Color Coding Your Labels Hiding and Showing Labels Using Filters How to Create a Label Labels are easy to create. In fact, there are three different ways you can create labels. Option 1: Go to your inbox left-hand menu and click on More to expand a list of folders. <img src="https://block-sender.s3.amazonaws.com/media/how-to-use-gmail-labels-organize-emails-1.jpg" alt="Gmail label"/> At the bottom of the list, click on Create new label. <img src="https://block-sender.s3.amazonaws.com/media/how-to-use-gmail-labels-organize-emails-2.jpg" alt="2"/> Next, enter the name of your new label and click on the Create button. <img src="https://block-sender.s3.amazonaws.com/media/how-to-use-gmail-labels-organize-emails-3.jpg" alt="3"/> Option 2: The second way to create a label is by using the label icon in the menu bar. <img src="https://block-sender.s3.amazonaws.com/media/how-to-use-gmail-labels-organize-emails-4.jpg" alt="4"/> Select the checkbox of the email for which you'd like to create a label. Next, click on the label icon and then click Create new. <img src="https://block-sender.s3.amazonaws.com/media/how-to-use-gmail-labels-organize-emails-5.jpg" alt="5"/> Enter the name of your new label and click on the Create button. Note: The email you've selected at the beginning of the process will be added to your newly created label. <img src="https://block-sender.s3.amazonaws.com/media/how-to-use-gmail-labels-organize-emails-6.jpg" alt="6"/> Option 3: Right-click on the email you'd like to label and click on Label as. Next, click on Create new. <img src="https://block-sender.s3.amazonaws.com/media/how-to-use-gmail-labels-organize-emails-7.jpg" alt="7"/> Enter the name of your new label and click on the Create button. <img src="https://block-sender.s3.amazonaws.com/media/how-to-use-gmail-labels-organize-emails-8.jpg" alt="8"/> Note: The email you've selected at the beginning of the process will be added to your newly created label. New labels will appear in all three areas where you've created them. How to Assign Labels to Emails There are three ways to add labels to emails. Option 1: Right-click on the email you'd like to label. Go to Label as and select the label you'd like to assign to your email. <img src="https://block-sender.s3.amazonaws.com/media/how-to-use-gmail-labels-organize-emails-9.jpg" alt="9"/> Option 2: From within your inbox, click on and open the email you'd like to label. With the email opened, click on the label icon top menu just below the search bar. Select the label you'd like to add to your email. <img src="https://block-sender.s3.amazonaws.com/media/how-to-use-gmail-labels-organize-emails-10.jpg" alt="10"/> Option 3: First, click on the checkbox of the email you'd like to label. Next, click on the label icon on the top menu below the search bar. Choose the label you'd like to assign to the email. <img src="https://block-sender.s3.amazonaws.com/media/how-to-use-gmail-labels-organize-emails-11.jpg" alt="11"/> Note: The top menu will only appear when you select an email. How to Move Emails to Labels Email can be moved to labels (i.e., removed from the inbox and thus only having the label assigned) by simply dragging and dropping the emails on the label of your choice in the left-hand menu. <img src="https://block-sender.s3.amazonaws.com/media/how-to-use-gmail-labels-organize-emails-12.jpg" alt="12"/> How to Read Emails Associated with a Label You can see all emails associated with a label by clicking on a label. <img src="https://block-sender.s3.amazonaws.com/media/how-to-use-gmail-labels-organize-emails-13.jpg" alt="13"/> Managing Your Labels As you become more comfortable with Gmail, you'll note how easy it is to manage your labels. Gmail's use of the 3 vertical buttons gives users the option to create sublabels, change label names, and remove labels. How to Create Sublabels Sublabels are labels created under labels. They are, in essence, like sub-folders for labels. To create a Sublabel, left-click on the three vertical dots of a label. <img src="https://block-sender.s3.amazonaws.com/media/how-to-use-gmail-labels-organize-emails-14.jpg" alt="14"/> Next, click Add sublabel. Give your label a name and click the Create button. <img src="https://block-sender.s3.amazonaws.com/media/how-to-use-gmail-labels-organize-emails-15.jpg" alt="15"/> Changing Labels to Sublabels Gmail also makes it easy to quickly change your label hierarchy. If you'd like to nest an already created label under another, click on the 3 vertical dots and then click on Edit. <img src="https://block-sender.s3.amazonaws.com/media/how-to-use-gmail-labels-organize-emails-16.jpg" alt="16"/> Next, click on the Nest label under the checkbox, select the label you'd like to nest your selected label under, and click Save. <img src="https://block-sender.s3.amazonaws.com/media/how-to-use-gmail-labels-organize-emails-17.jpg" alt="17"/> Changing Label Names You can also make updates to your labels. To change the name of a label, left-click on the 3 vertical dots and then on Edit. <img src="https://block-sender.s3.amazonaws.com/media/how-to-use-gmail-labels-organize-emails-18.jpg" alt="18"/> Removing Labels Need to remove a label? Start by left-clicking on the three vertical dots. Next, click on Remove label. <img src="https://block-sender.s3.amazonaws.com/media/how-to-use-gmail-labels-organize-emails-19.jpg" alt="19"/> Color Coding Your Labels Color-coding your labels can make managing emails simpler. When applied, you're able to quickly spot, reply and manage emails according to priority. To add color to your labels, left-click on the three vertical dots of your label. Next, click on Label color and click on your color of choice. <img src="https://block-sender.s3.amazonaws.com/media/how-to-use-gmail-labels-organize-emails-20.jpg" alt="20"/> Hiding and Showing Labels Hiding and showing labels is a feature designed to help maintain a cleaner message list (left-hand menu in Gmail). When you hide labels, Gmail will not show labels hidden in the left-hand menu along with all other labels. Showing a label makes it visible. To hide or show labels, click on the three vertical dots of the label concerned and click on Hide or Show under the In message list heading. <img src="https://block-sender.s3.amazonaws.com/media/how-to-use-gmail-labels-organize-emails-21.jpg" alt="21"/> Using Filters Filters can also be used along with labels to streamline email management. Filters are designed to help you automatically assign emails to certain labels. There are two ways to create a filter that assigns labels to new emails. Option 1: Click on the checkbox of the email for which you'd like to create a filter. Next, click on the three vertical dots on the top menu. <img src="https://block-sender.s3.amazonaws.com/media/how-to-use-gmail-labels-organize-emails-22.jpg" alt="22"/> With the email selected, you will be presented with the option to search for all emails that meet one or all of the following criteria: The same sender's email address A specific subject line Include or exclude certain words A certain size Include or exclude attachments Once you've decided on your filter criteria, click Create filter. Next, select the Apply the label checkbox, choose your label from the list provided, and then click the Create filter button. <img src="https://block-sender.s3.amazonaws.com/media/how-to-use-gmail-labels-organize-emails-23.jpg" alt="23"/> Option 2: To create your filter, click on the gear icon located in the top right-hand corner of your Gmail account. <img src="https://block-sender.s3.amazonaws.com/media/how-to-use-gmail-labels-organize-emails-24.jpg" alt="24"/> Next, click on Filters and Blocked Addresses. From this tab, click on Create a new filter. <img src="https://block-sender.s3.amazonaws.com/media/how-to-use-gmail-labels-organize-emails-25.jpg" alt="25"/> Create the criteria for your email filter and click on the Create a filter button. <img src="https://block-sender.s3.amazonaws.com/media/how-to-use-gmail-labels-organize-emails-26.jpg" alt="26"/> Next, select the Apply the label checkbox, choose your label from the list provided, and click on the Create filter button. <img src="https://block-sender.s3.amazonaws.com/media/how-to-use-gmail-labels-organize-emails-27.jpg" alt="27"/> Gmail Labels can be a little confusing at a glance. They come with a set of features that can seem almost hard to grasp, but once you know how they work and how to use them, you'll be able to put them to task in your inbox. They'll help you create and maintain a clean and structured inbox, making it easier to manage your emails as efficiently as possible. # gmail# productivity# how toLast Updated: December 30th, 2024Was this article helpful?In this articleWhat is a Gmail Label?How do they work?How to Create a LabelHow to Assign Labels to EmailsHow to Move Emails to LabelsHow to Read Emails Associated with a LabelManaging Your LabelsHow to Create SublabelsChanging Labels to SublabelsChanging Label NamesRemoving LabelsColor Coding Your LabelsHiding and Showing LabelsUsing FiltersBetter email blocking for Gmail.Sign up for free, no credit card required, upgrade or downgrade at any time.Get startedLearn more →'''
