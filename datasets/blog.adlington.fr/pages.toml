title = "Reading to Babies – Slow Like Whisky"
full_description = "Reading to Babies Feb 15, 2025 — by robert.adlington in Blog some people would think that reading a baby a book about farm animals is teaching them about farm animals, but really it’s teaching them about the concept of a book and how there’s new information on each page of a single object, but really, beyond that, it’s teaching them how language works, and beyond that it’s really actually teaching them about human interaction, and really really it’s them learning about existing in a three-dimensional space and how they can navigate that space, but actually, above all it is teaching them that mama loves them. — Read on kottke.org/25/02/the-crazy-thing-about-babies Comments Leave a Reply Cancel replyYour email address will not be published. Required fields are marked *Comment * Name * Email * Website Save my name, email, and website in this browser for the next time I comment. ←Previous: Opinion | Look Past Elon Musk’s Chaos. There’s Something More Sinister at Work. – The New York Times Next: How the System Works – Marginal REVOLUTION→"
