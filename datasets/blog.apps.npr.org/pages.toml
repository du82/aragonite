full_description = "Live: Election Results 2024 View live results for the 2024 United States presidential election, as well as for House, Senate, governor races and major ballot measures across the country. These charts show how Trump's strategy to lose by less won back several swing states President-elect Donald Trump won the election by flipping Georgia, Pennsylvania and Wisconsin after President Biden won them in 2020. Looking at how Democratic counties voted explains how he did it. Central Asia’s Ticking Time Bomb: Water The Aral Sea has nearly disappeared over the last 60 years. Now, its source rivers are depleting. Trump has made more than 100 threats to prosecute or punish perceived enemies An NPR investigation has found that since 2022, Trump has repeatedly threatened to investigate, prosecute, jail or otherwise punish his political opponents, rivals and even private citizens. Dailygraphics Next One-stop tooling for creating responsive news graphics from a range of D3-based templates Interactive Template A modern site generator with live reload and support for loading data from ArchieML, Google Docs/Sheets, CSV, JSON, and more January 29, 2025 Elections Slackbots How we used GitHub and Slack to stay up to date during the 2024 election season. November 26, 2024 Self-hosted slippy maps, for novices (like me) How we built our own explorable tile map without paying a fortune. May 29, 2024 How I make news comics William L. Moore was murdered on a civil rights protest walk. Here's how I made a comic about one man's campaign to create a marker about it."
