full_description = "Live: Election Results 2024 View live results for the 2024 United States presidential election, as well as for House, Senate, governor races and major ballot measures across the country. Nov. 5, 2024 Source on GitHub → These charts show how Trump's strategy to lose by less won back several swing states President-elect Donald Trump won the election by flipping Georgia, Pennsylvania and Wisconsin after President Biden won them in 2020. Looking at how Democratic counties voted explains how he did it. Nov. 9, 2024 Central Asia’s Ticking Time Bomb: Water The Aral Sea has nearly disappeared over the last 60 years. Now, its source rivers are depleting. Oct. 30, 2024 Trump has made more than 100 threats to prosecute or punish perceived enemies An NPR investigation has found that since 2022, Trump has repeatedly threatened to investigate, prosecute, jail or otherwise punish his political opponents, rivals and even private citizens. Oct. 22, 2024 COMIC: Science-backed mood boosters to (almost instantly) snap you out of a funk Six techniques to energize you when you feel sluggish and relax you when you feel stressed. Feel the transformation in 15 minutes or less. Oct. 16, 2024 'That’s a bloodbath': How a federal program kills wildlife for private interests A federal program kills hundreds of thousands of wild animals a year. Documents obtained by NPR show that many of those animals were killed in places where no damage to livestock was reported. Oct. 10, 2024 These maps and images show what's left of Gaza, 1 year into the Israel-Hamas war Israel's war with Hamas has destroyed much of Gaza. Recent analyses find that nearly 60% of buildings, nearly 70% of orchards and 68% of roads have been damaged or destroyed by the conflict. Oct. 10, 2024 Tired of presidential politics? Here's where power could shift in state capitols, too With so much focus on the presidential election, keep in mind these down-ballot races can lead to big changes in your state when it comes to policies like abortion, health care and criminal justice. Oct. 3, 2024"
