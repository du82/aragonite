["https://blog.benjojo.co.uk/post/traceroute-haikus"]
title = "Traceroute Haiku’s"
full_description = "Sometimes I like to think that I do “serious” blog posts like “The strange case of ICMP Type 69 on Linux” or “Anycast possibly done better”. However I also do a lot of stupid ones like “IP over AX.25 over 802.11 with ESP8266”, “I may be the only evil (bit) user on the internet” or “TOTP SSH port fluxing”. Traceroutes are a common network debugging diagnostic tool. They (should) list every router that your packet travels through to get to its final destination. Here is what it looks like from my flat to my website: The idea of this value is to stop packets from infinitely going in circles in case of a fault in a network. For every router a packet jumps though, this number is decreased. However to let the other side know that a packet was lost in the manner, the router is supposed to return the packet inside another packet to notify them: The idea of traceroute is to purposely set this hop limit very low and incrementally increase it upwards to discover all routers in the path between you and the destination: In addition, traceroute tools helpfully lookup the “reverse DNS” of the IP address to find out more information about the router. Even if placing reverse DNS on these IP addresses is entirely optional, most operators do set it to help their clients debug things. Critically, if you own an IP block you can point the reverse DNS to whatever you want (most hosting providers let you edit their zone file though, though some of them validate the records you provide). People have used that and this common feature of traceroute to build fun addresses to trace that often spell out funny things, one example being bad.horse: I can think of two ways this can be done: either chain lots of fake interfaces inside a single system and use that as “router hops”, or augment the whole thing with user space networking to generate the fake expiry messages to make it seem like there are routers in the path that are not there. To do this today, I am going to use a built in system inside linux called TUN/TAP. This is the system used to make VPNs work. The idea is that it can make a “network port” on your computer, that instead of going to a physical section of hardware, goes instead to a program that handles the packet."
year_published = 2025
