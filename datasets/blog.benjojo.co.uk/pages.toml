["https://blog.benjojo.co.uk/post/encoding-data-into-dubstep-drops"]
title = "Encoding data in dubstep drops"
full_description = "[Warning: Those who can’t stand EDM/dubstep, oh boy do I have bad news for you in regards to this blog post] Dubstep songs are often criticized as sounding extremely computer generated and often just too aggressive/“digital” for a lot of people to enjoy. It’s not uncommon for people to joke that they sound like someone had added a bassline and drums to modem noises For some tracks this is truer than others. After all, it’s a genre with more aggressive interpretations and more relaxed ones. But that had me thinking, how much effort would it be to actually embed machine readable data inside a dubstep track, while ensuring that the sound could be enjoyed by humans as well… Above here is a spectrogram of the song that was embedded, so you have a better idea of what is going on with all the frequency bands in the song. As shown, there is plenty of spectrum to hide data in, but it exists on the high bands where audio compression may remove it. So, what if we looked lower in the frequency bands, at the bassline? Unfortunately, this is pretty much entirely the DSP world. However given that I struggled through this, I will try and describe what I’m doing without any fancy symbols. To start, this is basically sound in its most basic form; a signal to a speaker telling it what position it should be in. Ranging from 1 (all the way out) to -1 (all the way in). Moving over these positions displaces air and makes sound! This means we now have two states we can observe! The best part of this is that the difference is not noticeable to (at least my) human ears. At this point we can reassemble the output bassline file and the upper frequencies, and see if it is playable: To make it encode our own data, we can use a simple library to help us read bits in a nice easy to use way, and then include them in the audio: This decoder works by counting how many samples in a “frame” are negative, and based on that declaring if it’s a 1 or a 0 bit. I have pushed the code on github as always (though it’s not really in a usable state): https://github.com/benjojo/dubstep-data"
year_published = 2025
