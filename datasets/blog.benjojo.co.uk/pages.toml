["https://blog.benjojo.co.uk/post/yamware-msdos-malware-tear-down"]
title = "YAMware Old Malware can still be fun!"
full_description = "(Side note, this blog post was written and then forgotten about quite a while ago, So I’ve finished it off, it was halfway done.) While on holiday in the evenings with downtime to spare, I had realised that I have not really done any hardcore disassemablly for quite a long time, that was a shame since most of my knowledge of x86 ASM and architecture came from tearing down old ( and new sometimes ) and learning what they did and all of the surprises along the way. Lucky for me I still had ( despite being a very long way from home ) all of my test samples that I have gathered from over the years backed up and ready to go. Looking though the list I had to pick from. I chose a sample called Trojan.DOS.Erase26. Looking that name up on google does not bring up much other than a few listings of “our AntiVirus product blocks this” or “here is where you can download this sample”. One of the great shames and losses is that sites that used to explain what malware did are either being archived, or being shutdown, making it really quite hard to figure out what a sample does (other than the name) First thing I generally do with malware is to test that it works, lots of samples for reasons I have never really understood do not work at all or just hang. This one didn’t. This is what the payload looks like when it runs: YAM… Yam, Huh? That is strange, at the end of the YAM sled, the machine hangs and there is no way to back out other than restarting the VM. Once the VM restarts. No visible damage is done. Anyway to find out what this malware is doing. I chose to load it up in IDA to see what’s up, For the first run, just normal settings: Selecting “No” on the 32/16bit question, since MSDOS uses Realmode, nearly all software is 16 bit. One of the fun things about going back in time to take apart malware is that you have to figure out what file format the file is in, Most small utilities (and by proxy, malware) present themselves as .COM files. These files choose the CP/M style of execution that basically goes along the line of:"
