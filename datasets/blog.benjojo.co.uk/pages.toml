["https://blog.benjojo.co.uk/post/path-detection-for-anycast"]
title = "Detecting anycast addresses and more"
full_description = "Anycast networks are a pretty interesting way to fix quite a few issues with networked services that involve needing global spread. One of the interesting things is that a computer cannot really tell (unless it has a full routing table of many providers in more than one geographic location maybe) that a IP is using anycast. Before I start this, I just want to go though what a anycast actually is. Most programmers who have done networking have heard the comparison between a IP address and a telephone number, if you want to explain the idea of a anycast IP address to someone, I believe that the most simple way is to explain that if your computer is 34.24.77.2 (not my IP, not even routable) and lets say the direct translation to a phone number was 0121 441 526 and a anycast IP was 3.22.51.1. Then its phone number would be like that of 999 (For Americans 911, Other EU places 112) This kind of number is the “anycast” of telephone systems, because that phone number will be directed to the most preferable (hopefully the closest) call center in your region, this is why if I was to dial 999 in London, I would most likely be sent to a call center in London to take my emergency call, rather to one in Scotland. Networks do the same thing basically. Here is a small drawing of a network setup: Here you see a group of routers, all have the same IP address, Lets pretend that my router does know about all 3 of them, Because how most routing tables are setup, the packets will be sent to the fastest route possible (though, that does mean the fastest route it has, that may not in all cases mean the closest, “fastest” can in some cases also mean “cheapest”) this is achieved by the “metric” on the route. Assuming the route metrics have been setup correctly. Packets will flow to the right place. Since there is nothing special about anycast addresses, other than that they are addresses that are “advertised” in the internet routing table in more than one place. There is no way to look at an address (other than what I mentioned above about seeing the global routing in many places) and know its anycasted. One way for a human to check that an address is anycasted it to just trace route it from more than one location, Here is an example with 8.8.8.8 (an anycasted DNS server) Server on West Coast USA:"
