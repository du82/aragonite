["https://blog.benjojo.co.uk/post/north-korea-dprk-bgp-geoip-fruad"]
title = "A surprising amount of people want to be in North Korea"
full_description = "While the president of the United States and the leader of North Korea were/are currently beefing on Twitter about who should destroy the world first, North Korea was also causing me some personal frustration on data quality. The issue lies with “GeoIP” (or more widely speaking a database that contains the geographical mapping between IP addresses and locations on the planet). If you run services with Internet traffic from a variety of users you may find sometimes the GeoIP information actually isn’t that great, especially if you’re dealing with IPv6 because most of this information has not been filled in yet. However after a bit investigation I found that there were a set of of geoip errors that were unusual in that they didn’t actually appear to be an issue of data quality. More an issue of people maliciously inserting fake data into the database in order to appear to websites as if they were elsewhere. The initial discovery came as a pure curiosity search. North Korea’s Internet recently got another upstream (through Russia’s TTK): Above are two ISP’s in the UK: Virgin takes the slower US -> China -> DPRK Route, while Sky takes the RU -> DPRK route! So the question I had was “How much traffic do I even get from North Korea anyway?” The answer surprised me when the little amount of my North Korean traffic wasn’t from the only ISP in North Korea but in fact Avast. The anti virus company. However this location assessment doesn’t align with logic, traceroute hop names or the bounding limits of the speed of light: Thankfully MaxMind does provide a CSV version of their database which means that you can grep through to find all the other offenders who fraudulently locate themselves in North Korea: Avast isn’t the only one in this list. NFOrce customers, “Roya Hosting” and others have also done this. Avast has not just limited themselves to North Korea, they have set IP ranges to be all over the world for their VPN service: This is nothing short of insanity driving for anyone who uses GeoIP to compile statistics, and depending on the VPN offering it is fraudulent advertising."
year_published = 2025
