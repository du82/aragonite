["https://blog.benjojo.co.uk/post/ip-address-squatting"]
title = "Who is squatting IPv4 addresses?"
full_description = "It’s an established fact on the internet that we have ran out of IP(v4) addresses, and we are starting to see the pressure on obtaining IPv4 space. For example if you want to get a /24 block from RIPE NCC when you sign up as a member, then you are currently looking at a 2 month wait for a recycled IPv4 /24 block. But what happens if you have run out of local IPv4 space? Or for some reason the RFC1918 Private network space is not an option anymore? Some people resort to squatting IP address space! For the case of this post, I will define IP address squatting as “using IP addresses that are not RFC1918 defined and not your unicast space issued by a RIR”. The first thing that instantly comes to mind is Cloudflare obtained the addresses 1.1.1.1 and 1.0.0.1 to run a DNS resolver on, but had to fight back against a huge amount of network and home routers squatting on those addresses internally (I do also wonder if the last unicast /24 block has similar issues) This problem is not that surprising though, your local friendly sysadmin might be able to tell you of a story where they have caught their colleagues, customers, or even parents squatting on addresses. But how big of an issue is this? If only we had a large amount of well known IP address blocks that we can make a safe bet on not being used. At the start of 2021, the DoD started to announce huge sections of their massive IP block allocations ( around 234000 /24’s worth ) out of AS8003, and then moved them to AS749. This was initially suspected to be preparation of an IP sell off, since the cost of v4 addressing has reached impressive highs recently. However later on the Pentagon said: To me this reads as, “We don’t want our large IP blocks that are mostly unannounced in the BGP DFZ hijacked by people” and at the same time “We have some people who want to run a massive darknet“ Running on these assumptions, we can assume that whatever is announced by AS749 is unused DoD space, and so anything on the internet pointing to those blocks is squatting (either by typo or purpose) to at least some degree (assuming it’s not a DoD site itself)"
year_published = 2025
