["https://blog.benjojo.co.uk/post/smart-sfp-linux-inside"]
title = "Ghost in the ethernet optic"
full_description = "A few months ago I stumbled on a tweet pointing out a kind of SFP optic that claimed to be smart, made by a Russian company Plumspace. After going through their Smart SFP product listings I was on-board and decided I needed to have some of them. You see, Smart SFP’s are a bit of a terrifying concept. SFP’s are (until now apparently) actually quite simple devices that “simply” take input electrical signals and turn them into optical signalling, or carry them down a Direct Attach Cable (DAC) The proposed smart SFP said, “Hey there is plenty of space in this thing! Why not also put a little FPGA, and an ARM core that can share the ethernet link, that way we can do more things!” After some discussion over email with Plumspace, I ordered 3 (2 going to my similarly interested friends) at around the cost of 150 USD per optic. After some shipping+brexit drama I had a smart-sfp of my own sitting in front of me. I want to point out that while this whole post may read like a sponsored post, it’s not! I just find the concept of these devices so immensely curious and cursed I feel the need to document their existance and feature set. Due to stocking issues, I could only buy the single mode variants of the product. But that is fine since you can run single mode optics with multimode fibre over a short distance (I only had multimode fibre on hand). I was eager to get this up and running so I just stuck it in my spare SFP port on my workstation. This also was handy as I could isolate the optic from the rest of my home network just in case it came with some nuclear default settings. It turned out that isolation was a good call, since the default IP address of the “host” end of the system inside would have conflicted with my default gateway (of 192.168.2.1). The system itself has around 4GB of non-replaceable eMMC storage, where around 2GB of it is usable (I assume the other partitions are for the factory restore image that can be activated using the DIP switches on the SFP itself) (dmesg output here)"
year_published = 2025
