["https://blog.benjojo.co.uk/post/linux-icmp-type-69"]
title = "The strange case of ICMP Type 69 on Linux"
full_description = "I run collectd stats on many of my servers and one thing I enable on some (but not all) of them is the protocols plugin. This plugins pulls from the /proc/net/snmp counters and submits them to the stats server. You can view the data in a human friendly way on linux by running netstat -s, which should give you something like this: The point of interest here is OutType69; since 69 is not a valid ICMP code -it’s in the reserved range- and I am apparently sending a lot of them but not getting any back. I never really looked into this before since I always had more important things to do when I noticed it on my servers, especially since it never seemed to increment. However this weekend I thought I should look into it more and decided to take a stab into the issue to see what was happening. Since type 69 is in the “Reserved” section, this means that something on my end is spitting out ICMP packets that are wrong. Looking into things that could possibly doing it (and anything that could possibly trigger it that infrequently and at random sporadic times) I was stumped, so I took my concerns to the kernel code to see how it even gets this information. First thing I did is grep for anything that could be using 0x45 or 69 in the kernel code. Unfortunately for this approach, there are many hex encoded data tables in the kernel, making the results a lot of effort to look though. I aborted that quickly and went looking for the code in more precise ways. At that time, I had no idea how the kernel code handles ICMP packets and therefore didn’t really know what I was looking for. ICMPMSGOUT_INC_STATS is interesting. However it is fed its type upstream so the bug couldn’t be here. icmp_out_count is used in 3 files: In this case, the type is passed to the function which would mean that the program calling it would have to be supplying crap. This is certainly possible, but since I couldn’t see any type 69 packets in WireShark I thought it unlikely. First of all since both of these are to do with general output rather than ICMP packets only, this is going to see more mileage (raw sockets and general IP output)."
year_published = 2025
