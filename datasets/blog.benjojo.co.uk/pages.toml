["https://blog.benjojo.co.uk/post/rfc-in-38-simple-steps"]
title = 'The "simple" 38 step journey to getting an RFC'
full_description = "The Internet is built on the mutual understanding of network protocols and practices, and most of those protocols are defined using Request For Comments (RFC) or Best Common Practices (BCP) documents. The generally accepted source for modern day RFCs is the Internet Engineering Task Force (IETF), the term RFC has been hijacked by several different companies for their own uses. So, for the case of this blog post going forward I will operate under the assumption that if it does not appear in the IETF datatracker, then it’s not a RFC. For the last 3.5 years myself and 2 others have been slowly working away at a document that has recently been christened RFC9687, the actual contents of the RFC9687 are up for the next blog post, however I figure that it would be interesting to go over the process that got a bunch of words through the IETF process and a RFC number and status being granted and what happened in those 3.5 years. For those looking for the quick and simple graph/steps of what we as co-authors were up to during that time, here is the best graph I can draw Welcome to the last 3.5 years of my life, all be it not a huge amount of my last 3.5 years, but a slow burner that tested a lot of my will, patience and sometimes sanity! Here is step by step what I would have wanted to read 3.5 years ago to have a deeper idea on what the process is, so let’s get started! It should go without saying that you should probably have a very good reason to pursue the IETF process, in the case of RFC9687 we had identified a shortcoming in the existing BGP4 protocol that appears to be causing real world harm to the internet routing system, and given that BGP4 is already heavily documented and tweaked/patched by other IETF documents, it made sense for us to address this desired change through the same system. If you’re looking to invent a new protocol, or trying to do a change that seemingly only impacts your operations, the IETF is probably not the best place to pursue this until you have multiple vendors/implementers that are willing to go along with your proposal."
year_published = 2025
clearnet = "https://blog.benjojo.co.uk/post/rfc-in-38-simple-steps"
