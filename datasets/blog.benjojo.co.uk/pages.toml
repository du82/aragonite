["https://blog.benjojo.co.uk/post/flexing-windows-rras-bgp-stack-ipv6"]
title = "Flexing the Windows RRAS BGP implementation"
full_description = "At this point I am a bit of a BGP protocol implementation connoisseur thanks to my day job, however there is one implementation that has been in the back of my mind (In the information hazard kind of way) for quite some time now, and that is the Microsoft Windows RRAS BGP implementation. RRAS ( or by its longer name “Routing and Remote Access” ) has existed in Windows NT releases for a very long time, allowing windows to speak RIPv2 (or OSPFv2) as the only official way to do dynamic network routing on windows, however in Windows Server 2016 RRAS shipped with BGP4 support! This means that Windows can now talk the load bearing dynamic routing protocol of the internet, and so allows us to do some very fun experiments in pushing it to its limits! All of the previous documentation I have found on the internet for RRAS’s BGP support have only been mentioning IPv4, however I intend to operate this with only IPv6 for extra “fun”! To get started I obviously had to install Windows. Now, I have been out of the windows game for quite a while, so I grabbed a ISO for Windows Server 2022 and installed it in a evaluation mode, And I was quite surprised to find that the first login screen looked like this: It seems that windows and it’s default/recommended installer configuration now pushes you towards a command line environment, Not entirely surprising based on where the industry is going, however I didn’t want to particularly relearn everything that I can remember about operating Windows Server 10+ years ago, so I opted to reinstall Windows with “desktop experience” to make it a little bit more familiar to me. The wizard gives you quite a lot of guidance on how to do this, and gives you an overview of what you’re about to install Perhaps most interesting, “Routing and Remote Access” also requires you to install the Windows web server IIS. I don’t know why, and I’m not quite sure I want to know why. Once we have RRAS Installed, we need to set it up, From this point onwards we are mostly doing stuff inside PowerShell (Although I’m pretty sure you can do everything here in powershell I’m not quite sure how to do it and I’m doing what I already remember to save myself time)."
