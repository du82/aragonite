["https://blog.benjojo.co.uk/post/monitoring-wifi-devices-without-snmp"]
title = "Monitoring SNMP less devices with ease"
full_description = "In the consumer world you will likely encounter networking devices that don’t have a easy way to poll for their network stats, or in some cases you hate SNMP so much that you would rather go to rather worrying lengths to avoid it. Either way, In my flat, I have two AP’s, one is a Ubiquiti Unifi AP-AC (A) and another is a cheap USB powered AP device that I use to patch up the last dead spot in my flat, Running OpenWRT The issue is, both of these devices do not support SNMP, and that is very annoying, since I want to add the throughput information from them to my own metrics system. So we can clearly get the numbers from the interface on the devices, but how can we turn these into metrics itself? Can we avoid scraping ifconfig? Using the fantastic golang.org/x/crypto/ssh libary, it’s super simple to set up a SSH connection and log into the devices, Even better, since we have control over the low level connection, we can ensure that we only need to login once while the application is running, saving the CPU on the APs from a lot of work (since SSH crypto excahnges are very noticeably slow on these low end devices) Overall, I present: “dumb-net-poller” a program you can run to get devices interface stats and then export them into collectd (and others systems, should anyone want to send a PR in). You will most likely want to not pass your SSH credentials as command line options, so instead you can point it to a config file that looks the same, for example:"
