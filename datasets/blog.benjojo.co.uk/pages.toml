["https://blog.benjojo.co.uk/post/lto-tape-backups-for-linux-nerds"]
title = ""
full_description = "Tape storage is surprisingly not dead! If you are here then you may be considering using LTO tape as part of your backup or your long term archiving strategy. I’m here to mostly talk you out of it, or at best make sure that you are aware of what you are walking into. One of the common reasons to look towards LTO Tape is that it’s much cheaper than hard drives, where a 12TB SATA drive costs around £18.00 per TB (at the time of writing), a LTO-8 tape that has the same capacity costs around £7.40 per TB (at the time of writing). That’s a significant price difference. So, you may ask what is the catch? LTO has different generations. Around every 3 years the LTO Consortium will unveil a new version. This generally comes with a capacity upgrade of around double the last generation. Tape cartridges themselves are not forward compatible, but drives are generally backwards compatible to write for one version before and read for two versions before. This means that if you buy an LTO-6 drive, you should expect to be able to also read/write LTO-5 tapes, but only read LTO-4 ones. If you want to buy a factory new LTO-8 drive (the newest generation that is readily available at the time of writing) then you are looking at around £3,000. You can often find drives much cheaper on eBay if you can tolerate used drives (often 1000’s cheaper). Drives do have wear and tear (we will get to that later) so they are not perfectly the same product. LTO drives, however, degrade much slower than a standard hard disk would. To illustrate the cost per TB, here is a calculator that you can plug in your own numbers (or use mine at the time of writing) to figure out if tape is actually cheaper for you. (Assuming you are okay with giving up “instant” access to data) The drives are noisy, meaning if you are planning to work next to your LTO drive you should be prepared for noise and vibration. Here is an example of my LTO-6 drive: Tape cartridges physically stack reasonably well, and if you are buying enough tapes your supplier can barcode them for you to easily identify them from each other."
year_published = 2025
