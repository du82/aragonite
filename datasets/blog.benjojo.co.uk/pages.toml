["https://blog.benjojo.co.uk/post/ixbr-automated-quarantine"]
title = "Appreciation of automated IX Quarantine LAN testing"
full_description = "Something that bgp.tools (my company) does a great deal is joining internet exchanges. In 2023 the bgp.tools route collector joined around 40 internet exchanges, and while I don’t think I will do another repeat of 2023’s level of expansion, I’ve already set up my first exchange for 2024. That exchange is IX.BR São Paulo, the first exchange that bgp.tools has joined in Latin America. While the grunt work of joining exchanges can be boring, IX.BR has an interesting take on the quarantine LAN procedure that I think is unique, interesting, and well done. So therefore I believe it is worth documenting since not everybody gets to see these processes when they are done well. Quarantine LANs on internet exchange points are very important, as almost all exchanges are layer 2 broadcast domains with all member routers on the same subnet, there are several things that any member can accidentally do to greatly impact other members ability to exchange traffic. Ethernet itself is not a loop tolerant protocol and exchanges avoid the use of spanning tree, therefore an ethernet switch loop can be extremely detrimental to an IX. Since the resulting broadcast packet flood will a Denial of Service for member routers. But there are several other quirks the internet exchange participants need to look out to avoid, such as sending special management frames like LLDP, or having significantly more dangerous features enabled like Proxy ARP. Proxy ARP is uniquely dangerous to an internet exchange because it may cause your router to claim that it owns IP addresses on the internet exchange LAN that it does not, causing other members traffic to be directed to the router with Proxy ARP enabled instead of the correct destination. This is all the more important because exchanges like ix.br have a significant percentage of the country’s internet traffic going through them, in IX.BR São Paulo’s case it peaks (at the time of writing) at 22 Terabits daily! When you have been given your IP details and confirm that the link is established between you and the exchange, you are provided with a URL that takes you to the IX.BR quarantine LAN testing portal."
year_published = 2025
