["https://blog.benjojo.co.uk/post/2014-05-26-APL-the-lost-language.md"]
title = 'Lessons from APL, a "lost" language'
full_description = "A few weeks back the forum that I go on often held a obfuscation challenge, and people joked around about submitting a entry that was coded in APL. APL (A Programming Language) is a programming language that was developed at IBM by mathematician Kenneth Iverson. One of the bigger issues with writing this blog post is that most browsers can’t even display a lot of the symbols I need to demo. Above is what I submitted, and I think its a great idea to go though on what the program and give a small demo on how powerful APL really is. It’s first worth noting, I used GNU APL. Since most APL interpreters where designed way before i386 was around (Or if they where, for MS-DOS), there is not a great deal of choise. One of the first things I really got quite annoyed by is the large amount of flags needed to make it function as a “normal” language. --noColor --noCIN --noCONT --silent Though I suspect this is mostly just a GNU APL thing. Overall though I though it was a nice language, My explanation to the large amount of symbols are below: This is done by running ⌈ over it, that goes though E and X and picks the biggest var of each, so E⌈X == 4 5 8 9 6 7 2 3 1 First we start off a new function by asking ∇K This makes a var that will be turned into a function until ∇ is inputted again. l ←(((X[1]=+⌿E[7]=(⍳J)∘.|⍳J)/⍳J←I)∊I)[⍒(((X[1]=+⌿E[7]=(⍳J)∘.|⍳J)/⍳J←I)∊I)][1^(~E[7])] is a complex one but can be simplified a great deal by noticing the repetition. (X[1]=+⌿E[7]=(⍳J)∘.|⍳J)/⍳J←I is a function that will get a list of all primes leading up to the number in I. As can see all of the older vars have been turned into 0’s apart from the 7 that we put in, that was turned into 1. All of that function was stored in K. So then we just call K. Then all of the code we have written above runs. It’s worth noting that there isn’t an exit issue, this is because )OFF (the command to exit) as not working in my tests, So I left it out since the rules didn’t say it has to exit."
year_published = 2025
