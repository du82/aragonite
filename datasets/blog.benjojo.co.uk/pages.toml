["https://blog.benjojo.co.uk/post/dns-resolvers-ttl-lasts-over-one-week"]
title = "Just how long do DNS resolvers cache last?"
full_description = "I’m sure this has been done before, but you do hear stories from time to time where someone will either drop or increase their DNS TTL’s and either see a massive difference, or none at all. A lot of providers in the wild will set their DNS TTL’s from anywhere from 5 mins, to a hour, Setting the DNS TTL too low is considered bad because it could cause un-needed fetches, but at the same time, setting it too high could hurt you in the case of outages, and if you are billed by your DNS provider by the query, it could end up costing you money too. My own thinking was, If you set a record to have a TTL of a day, what is the chance it will even last that long? Giving that most DNS resolvers are in tiny home routers with very little ram, and even then would have a very small chunk assigned to DNS query cache. My hypothesis is that queries barely last a hour in 95% of cases. To test this, I set up a script to update a record on one of my domains for a TTL every 10 seconds with the current unix time stamp, and serve DNS records with a TTL of one day, and then use the RIPE Atlas system ( you can learn more about that here ) to have 100 probes from different parts of the world query that DNS record every 88 seconds ( I could not poll faster due to limitations in RIPE’s own system and the rate you can spend credits, very, very annoying ) To ensure that the measurements are proportionate, I set the geographic distribution to even amounts around the world: I set the measurement to last 25 hours, and let it go, after that I was left with a json line per DNS result that looked like this: Thankfully RIPE Atlas exposes basically all of the information you could want in this case, however in this case, we are only really interested in the RDATA inside the answers section of the line. After waiting a whole 25 hours I downloaded the dataset, and ran it over a small go program that checked each probe to see how long it’s DNS resolver actually held the item in cache for: With some added sort(1) we get this (first number on each line is the maximum minutes a probe held onto a item in cache):"
year_published = 2025
clearnet = "https://blog.benjojo.co.uk/post/dns-resolvers-ttl-lasts-over-one-week"
