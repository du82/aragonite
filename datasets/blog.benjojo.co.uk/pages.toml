["https://blog.benjojo.co.uk/post/rpki-signed-but-not-secure"]
title = "Signed but not secure"
full_description = "At the start of the year a very interesting (and some would say inevitable) event happened involving internet routing security, the first case study of a large-scale victim of misapplication of RPKI occurred. On January 3rd 2024, a malicious actor used credentials found on the public internet to log into Orange Spain’s RIPE account, using their access they then created invalid RPKI ROAs that switched large amounts of IP space from RPKI unknown state to RPKI invalid state by signing the IP space to an ASN that was not Orange’s. This resulted in a large connectivity disruption for Orange Spain (AS12479), resulting in most of the estimated 9 million+ customers being without connectivity to many websites for 3 to 4 hours. The following post has been adapted off the talks that I have given on this subject at Peering Days 2024 in Krakow and the NETNOD Meeting in Stockholm, Since PeeringDays does not have public video recordings, and the NETNOD recording will take some time to appear, I feel like this is the best way to present this to more people. Using bgp.tools data, during the height of the outage the impacted prefixes were almost completely unreachable, except from a small amount of upstreams or peerings: Networks that have direct Orange/OpenTransit connectivity (and those who themselves are not doing Route Origin Validation (ROV)) would not have seen any disruption as it appears that AS5511 does not ROV filter their interconnects between their Spanish subsidiary. In addition, other unimpacted networks include those who are not doing route origin validation such as DTAG (who have since announced they have deployed ROV) and TI Sparkle, who accepted the ROA Invalid route from AS5511. However, given that the deployment of route origin validation has been greatly accelerating, this still resulted in a large amount of the internet being unable to reach Orange Spain. This incident also gives us an opportunity to go and observe what large-scale networks would do in the case of a missigning event, so the question we will explore is…"
year_published = 2025
clearnet = "https://blog.benjojo.co.uk/post/rpki-signed-but-not-secure"
