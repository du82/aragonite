["https://blog.benjojo.co.uk/post/email-delivery-stuck-on-ipv4"]
title = "Email delivery is stuck on IPv4"
full_description = "Generally speaking there is nothing that people want to talk about less than email delivery and for good reason, Email is continuously seen as one of those archaic protocols that everyone wants to improve but unfortunately has reached the point of critical mass where it is “unchangeable” It was only recently when Google started putting nasty icons on emails when they were delivered to Gmail accounts unencrypted do people actually adopt TLS in a serious fashion. One of those things that I’ve always wondered was that now that we have IPv6 in the world would it be possible to run an email server only on IPv6. Given that most service providers have IPv6 now surely they would be able to deliver email on v6? To test this theory I figured it would be easy to write a script that would go through my inbox to see what percentage of the emails inside were delivered over IPv6. I originally set to writing a google appscript to do this function, unfortunately I realised that the limits on that system are pretty tight: Fortunately the incredibly named “Google data Liberation Front” provides a tool called Google takeout that is capable of exporting your inbox into a single mbox file, With that I exported my traditional Gmail account and then my gsuite account emails for analysis. For the others wanted to do this it’s worth knowing that the Google takeout tool does in fact take some serious time. My experience with the tool showed that it’s exporting emails at less than one email per second. Something that is fine for small inboxes but if you have a large inbox then you may be spending a long time waiting for your zip file. Then using the fantastic standard library of Google Go (mainly speaking, net/mail), I made a small program that read the mbox and put out some basic CSV files with some basic statistics: As you can see IPv6 has always been very low and depending on your inbox diversity it has been getting lower, I Included the extra non google series in the graph above because on another Gmail account there was lots of emails from Google itself and it was inflating the IPv6 numbers quite significantly."
year_published = 2025
