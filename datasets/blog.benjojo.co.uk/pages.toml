["https://blog.benjojo.co.uk/post/browsers-biggest-tls-mistake"]
title = "The browsers biggest TLS mistake"
full_description = "Much like a previous talk of mine at Chaos Computer Congress this blog post is a direct write-up of a talk, if you prefer to consume this kind of content in video form you can watch the video here: When you connect to a TLS server you will generally get a certificate chain back ( added emphasis on the chain part of that). The server sends a set of x509 certificates that on one end is a certificate that concerns the domain that you are connecting to, and (most of the time) the other end is the intermediate that matches against a root CA that is installed inside your computer. However this doesn’t always happen this way, some TLS servers return only the certificate that concerns your domain on it. This shouldn’t work with client browsers, as there is no way for the TLS certificate verification code to actually draw a chain of trust between this certificate and the root CA that concerns it. However this does actually work in a lot of browsers. This tends to happen because ACME clients and similar certificate generation utilities output put three separate files, you have the private key, the certificate file (which contains just the certificate with your domain on it), and you have the “full chain” which provides the server with the full “ chain ” of certificates that needs to be sent over to the client so that it’s can verify it. The weird thing however is that even if a TLS server has been misconfigured with the wrong file, the certificate chain often validates anyway. This is because the browsers have deployed a mitigation for this problem that allows servers with incomplete certificate chains to validate. Well none of these introduce explicit security issues, they do give off a very “un-pure” feeling The Firefox solution is to ship a large set of intermediate CAs into the browser that it will check whenever there is an incomplete TLS certificate chain, this requires the set of chains to be updated on an regular basis, however that is fine because people are already updating their browsers on a regular basis."
year_published = 2025
