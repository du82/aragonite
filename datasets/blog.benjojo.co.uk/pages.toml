["https://blog.benjojo.co.uk/post/tls-https-server-from-a-yubikey"]
title = "Yubikey/Smartcard backed TLS servers"
full_description = "It has become clear that storing secrets in computers is hard. The best demo to the world that storing secrets on “online” computers is hard and sometimes devastating, is the large amounts of cryptocurrency theft due to critical keys being in memory of systems directly or indirectly connected to the internet. For the last one and a half years, I’ve had a set of Yubikeys on my keychain. A Yubikey is a USB stick that acts like a two factor token, but can also act as a smart card. Smart cards are neat, since they allow you to store sensitive cryptographic keys on another removable device, and they come with a guarantee that once they are programmed with a key they will not give it back to a system (they can be overwritten though) This allows someone to separate a cryptographic key from the system it lives on. This is useful for things like SSH, since it means you can have a key that moves on your person, rather than a per machine key in the case that you use multiple machines to access systems. Under the hood, all these smart cards are doing are the operations that require the private key, like data signing and decryption. I figured that we could also retrofit them to provide for other roles where keys would normally be in memory (and stealable), Like TLS/HTTPS servers! To start with, I took a spare yubikey I had never setup and used the GPG tooling on Linux to setup the card and generate keys. Here we see that the system is able to query the card and is empty and ready to program a key on to it. Above we used the smart card itself to generate keys. We could have generated keys locally on the system and then uploaded keys to the card, however that would mean that at some point the keys that we are trying to secure would have been visible to a system connected to the internet. This is not optimal since if I had malware on my laptop while I did this, the keys could have been copied without me knowing. Generation on the card ensures that the system provisioning the smart card never sees the sensitive key material, all of the generation is done on the card itself."
year_published = 2025
clearnet = "https://blog.benjojo.co.uk/post/tls-https-server-from-a-yubikey"
