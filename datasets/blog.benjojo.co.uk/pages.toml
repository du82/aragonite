["https://blog.benjojo.co.uk/post/ssh-port-fluxing-with-totp"]
title = "TOTP SSH port fluxing"
full_description = "Some people change their SSH port on their servers so that it is slightly harder to find for bots or other nasties and while that is generally viewed as an action of security through obscurity it does work very well at killing a lot of the automated logins you always see in /var/log/auth.log. However what if we could go take this to a ridiculous level? What if we could use TOTP codes that are normally used as 2nd factor codes to login to websites to actually know what port the sshd server is listening on? For this I present totp-ssh-flux: a way to make sure your sshd port changes every 30 seconds, possibly causing your adversaries a small period of frustration. What you can see here is my phone (using a generic TOTP client) generating codes that I can then use as the port to SSH into on a server. The neat thing is that because this is done in PREROUTING even if the code expires established connections stay connected. At the time of writing the project is just a single file. You will need to install golang and then go get and go build. On the first run the program will generate a token for the host in /etc/ssh-flux-key ( you can use the -keypath option to change that ) which you can then input into your phone or other clients. You can confirm that it works by running watch iptables -vL -t nat and waiting for the iptables rules to be inserted and removed."
