["https://blog.benjojo.co.uk/post/auditing-github-users-keys"]
title = "Auditing GitHub users' SSH key quality"
full_description = "If you have just/as of late gotten an email about your keys being revoked, this is because of me, and if you have, you should really go through and make sure that no one has done anything terrible to you, since you have opened yourself to people doing very mean things to you for what is most likely a very long time. A little known feature of GitHub is the ability to look at the public SSH keys that other users have set to be authorised on their account (for example https://github.com/torvalds.keys) This is a great debugging feature and in addition a great way to share SSH public keys (for example when you are giving someone an user account on a server of yours, and you trust GitHub not to tamper with the contents.) However one of the other side effects of this is that it means that everyone can see your public keys, and if someone cares enough, collect a massive database of everyone’s SSH keys. I took a stab at this in 2013 but found that too many people didn’t use GitHub in SSH mode and thus had no keys set. This time however (with a new program that used the events api) I found that the majority of active users had some SSH keys in there. That’s a surprisingly low number. This means that only around 30% of GitHub users who have committed haven’t got SSH public keys in their account. If we break it down into key types we see that RSA is by far the most used (not a suprise since has been the standard for a long time now): Still a large amount of users who have DSA keys, and a pretty low count of users who have ECDSA keys. After this I wanted to figure out how many keys were dangerously weak to the point where cracking was trivial. I wrote a program to parse all the keys in the database and populate the “Bits” column on the database. What I found was not as bad as it could have been, but it was still pretty bad. (I’ve redacted full public keys and full user names.) There are 9 keys that stick out to me here. There are 2 keys with only 256 bits to them and another 7 that only have 512."
year_published = 2025
