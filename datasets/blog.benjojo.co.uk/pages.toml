["https://blog.benjojo.co.uk/post/state-of-rpki-in-2018"]
title = "The state of RPKI: Q4 2018"
full_description = "In the fall I did a blog post and talk on RPKI about how the current methods of measuring RPKI deployment are broken because they do not take into account network operators actually verifying their imported routes. If you have not read that post I recommend you do so now to understand the next results: https://blog.benjojo.co.uk/post/are-bgps-security-features-working-yet-rpki A) Users who try to verify their route imports can find themselves unable to verify ARIN routes, due to a legal agreement issue. B) People are signing their routes with ROAs but not validating their imports, making it a vanity exercise at best For the legal point of view, the findings of this talk got posted on NANOG by Job Snijders from NTT Communications: Based on this response, the status of the legal issues on the ARIN TAL will not change any time soon. John Curran appears to not see a problem with what is basically a CA certificate needing a legal agreement clause. Based on this, the gap between people validating RIPE signed prefixes vs. ARIN prefixes is going to widen. A unique loss for networks with ARIN space (Almost all networks in the US and Canada), since no other RIR has this kind of legal block on a TAL/CA. On the issue of networks not validating their prefix imports with regards to RPKI, we can re run the same scans as last time to check if the RPKI protected internet is growing or not: Just like last time, The Netherlands are leading the way and leaving the rest of the networking world behind: This is mostly due to a handful of tier 2 providers who are RPKI filtering on behalf of their customers, in total this brings us to 116 ASNs that are fully RPKI protected, for reference the previous post had this number at 85. Giving that ARIN Leadership does not seem to want to budge on the legal issue for now, the gap between networks that do import all TALs, and the networks that import all but ARIN is going to widen. This is happening at a critical time as well since as the number of networks doing some form of ROV (reject routes based on invalid RPKI status) double since September."
year_published = 2025
