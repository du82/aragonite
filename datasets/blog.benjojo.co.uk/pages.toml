["https://blog.benjojo.co.uk/post/class-e-addresses-in-the-real-world"]
title = "Reclaiming IPv4 Class E's 240.0.0.0/4"
full_description = "Ever since the supply of fresh IPv4 address blocks was depleted there has been a number of interesting market changes, mostly around the costs to either acquire or lease IPv4 address blocks. Since the demand for IPv4 addressing has not changed that much, prices have gone up, and more providers like AWS, Hetzner, OVH, etc who were previously pricing in the cost of IPv4, are now charging for it separately. For some people this has been a bit of a pay day, while if you were to have had a block assigned to you in 2016, you would have gotten 4 /24’s (a /24 is the minimum you can reasonably route on the BGP backed internet), however if you were setting up shop in the 2000’s you could easily acquire a 256 /24’s in a single allocation! But for other networks this development in pricing has been devastating to the costs of business, industries that were used to assigning a single IPv4 address (or more) to every subscriber began to find that this model is unsustainable, and have had no option other than to deploy Carrier Grade NAT. So what if we technically had another 524288 /24’s worth of IPv4 hanging around in standardisation limbo? It turns out, we do! It’s called “Class E space” Class E space as defined in RFC1112 lives at the end of IPv4 address space between 240.0.0.0 and 255.255.255.254, Right after the space used for IPv4 multicast. This space in this state has existed since 1989, however it has been mostly ignored as a relic of time until the existing IPv4 unicast space allocations had been mostly assigned. Class E is not actually the only space that is now being reviewed. During the standardisation of where IPv4 blocks would go, several unnecessarily large allocations were made due to technical limitations at the time. Some obvious ones include 0.0.0.0/8 (A block where 0.0.0.0/24 would have been sufficient in hindsight), and 127.0.0.0/8 (the local loopback block, where 127.0.0.0/16 would have been sufficient). Since the internet was at the start not obviously going to be used, the minimum allocation size for an address block was a /8 at the start, later on we got “classful” allocations where a /16 would be assigned instead (this is why you often see /16s assigned to universities or institutions of similar ages), later on we moved to being able to assign /24’s, later on the internet moved to CIDR’s to better address various addressing needs. However the older allocations for 0.0.0.0/8, 127.0.0.0/8, and 240.0.0.0/4 were never revisited."
year_published = 2025
