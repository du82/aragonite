["https://blog.benjojo.co.uk/post/beating-the-broadcast-delay-world-cup"]
title = "Calling the world cup goals 5 seconds before they happen"
full_description = "It’s that time again where once every 4 years people get very hyped over kicking a ball around a grass pitch, however this time my own country is actually doing pretty well! At the time of writing we just beat Sweden and are now faced against Croatia! Either way. I’ve been taken to sport this time because this is such fun to watch with friends and as a broadcast nerd i’ve been thinking: “How long is the delay between the stadium and broadcast?” It turns out there is a delay forced into the broadcast for the use of betting companies and alike. The problem is that betting companies do not want people to rapidly place/cancel bets just after a goal or otherwise major events. The solution to this is to delay the broadcast by a few seconds and then another company called Running Ball (who got bought by Performa, who was a FTSE 250 company until they also got bought by Access Industries) comes into play. Running Ball provides a moderately detailed information feed about the state of the game. This feed is produced by people in the stadium annotating major events. I found an UK betting site that exposed this information in full inside its HTML5 webapp. The API feed was impressively detailed on every event happening in a game. Here is an example of the data the API provides: (In this example “away” is England, and “home” is Colombia) Since I had access to this API, I could poll it during the game and find out what the delay between the API and the freeview TV broadcast was. This showed the feed to be at least 4 seconds ahead of the live TV broadcast, however it could even be up to 6 seconds ahead due to the fact that I was polling this API only once every 3 seconds to reduce possible overloading of the betting website backend and creating too much suspicion in logs. The 4 seconds advantage is of course assuming the viewers are consuming a feed that is very close to real time (like live broadcast TV). If you are streaming online via a direct HLS stream, you may be up to 30 seconds late. If you are using a peer to peer stream to watch the game, you could be as much as a few minutes behind! It’s odd to know that online live streaming is rarely actually that live."
year_published = 2025
