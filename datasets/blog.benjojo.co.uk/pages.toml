["https://blog.benjojo.co.uk/post/interactive-x86-bootloader-tutorial"]
title = "x86 assembly doesn't have to be scary (interactive)"
full_description = "Assembly programming can be intimidating for people who have never looked into it any deeper than a glance, but giving that it underpins how the computers we use work it can be helpful having context in regards to what is actually being run by the CPU. x86 PCs are impressive in that they are fully backwards compatible with the original IBM PC. All the way down to timing circuits and boot process. This is both great in that almost all PCs should be able to run software from 1983, but this backwards compatibility also has a very high cost. The x86 ISA is inframous in it’s edge cases and complexity. To boot a modern x86 PC, you need to step through the history of x86, this is handled by the bootloader in 99% of cases: For the case of our demo’s we are going to focus on the first mode. 16 bit “real mode” is the mode that DOS and other vintage operating systems run on. This mode offers no system security that we are used to on our modern systems. When a program is run it has full access to the system and can alter the operating system if it wants to. This allowed a creative virus scene to spring up for DOS (though these viruses were more annoying than actually malicious) This mode also has a very simple model for interacting with hardware. Because PCs had a wide range of hardware they outsourced a lot of the code to interact with hardware with software interrupts (often handled by the BIOS) This makes the initial stages of OS development easy, since you only need to know a handful of software interrupts to get most of of the I/O work done. You can play around with the demo above. The assembler (NASM) and VM is being run in your browser thanks to emscripten and V86. So what is happening here? The mov instruction moves data from one place to another. In this case we are purely setting registers in the CPU and not touching RAM in the code. The int instruction fires off a software interrupt, in our case the 16th one. After that, we invoke hlt to stop the CPU from doing anything else. Since we are done with what we wanted to do."
year_published = 2025
clearnet = "https://blog.benjojo.co.uk/post/interactive-x86-bootloader-tutorial"
