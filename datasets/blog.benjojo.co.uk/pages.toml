["https://blog.benjojo.co.uk/post/the-death-of-a-tld"]
title = "The death of a TLD"
full_description = "Another one bites the dust. The gTLD gold rush is now seeing a steady flow of TLD’s that clearly just didnt work out. In the last week, ICANN removed the documentation for .xperia a TLD owned by Sony for their smartphone brand. On one hand this can be taken as a immense waste of money, a gTLD costs a wopping $185,000 assuming that no one challenges you or objects your application, the process of objection can get very costly. I guess you could argue that this price is a method of ensuring that applicants are serious about running a top level domain, however $185,000 clearly doesnt stop TLDs from being given up on. The letter above is the final confirmation from Sony sent to ICANN to terminate the gTLD, You can find the letter publically here and also some of the communication with them about this, since they are also interested reads. The funny thing is, this isnt even the first time this has happened, Since being tracked by the twitter account @ianawhois .iwc , .sapo, .meo, .boots, .htc (also a smartphone brand), .chloe, .pamperedchef, .montblanc, .mcd and finally .mcdonalds have all been revoked and are no longer TLD’s. Using Certificate Transparency logs, we can see if anyone issue SSL certificates on those TLD’s, giving that HTTPs is now standard on the web this should be a good way to discover usage of the TLD. Almost all of the certificates here are landing page type domains, with the exception of .mcdonalds who had two certificates issued for what looks like mail servers:"
