["https://blog.benjojo.co.uk/post/sfp-experiment-ultra-long-range-toslink"]
title = "Building Ultra Long Range TOSLINK"
full_description = "This post is a textual version of a talk I gave at The 38th Chaos Computer Congress at the end of 2024. You can watch the talk that was recorded by the wonderful C3VOC team below if that’s your preferred medium: I’m a sucker for wanting to ultimately know how and why things work. My rule of thumb is most things are either really smart (in complexity, or simplicity), or incredibly stupid. However In my world optical data transmission is everywhere, and yet I had no idea how it really worked beyond what I can see from the command line interface. Optical data transmission is now everywhere in the datacenter, and my own stuff for bgp.tools is no exception. All connectivity in my world now comes out of Small Form-factor Pluggable (or, SFP) ports. The cool thing about SFP’s is that they are for the most part (when they don’t contain a FPGA and ARM CPU to run Linux) very basic inside. They are basically a set of laser drivers, and typically a small EEPROM+Microcontroller to tell the switch/router what it is and optionally some critical metrics like incoming/outgoing laser power. At least 95% of all SFPs are made in the same set of factories under ODM agreements, so the majority difference between SFP vendors are the contents of their EEPROMs and the pricing markup the vendor charges for them. SFP’s operate on a single “lane” of data, this means you can go from 100M/1G/10G and 25G. If you want to go faster, then we have to upgrade to optics with more than one lane. For this case, will look at the Quad Small Form-factor Pluggable (QSFP) form factor: These basically build on the same ideas as the SFP, but adding 4 (or 8 in the case of the Double Density (DD)) lanes of 10/25/50/100G These optics can be simple, just 4 “beams” of laser light that make up a higher speed link, or in the case of 100G coherent optics, quite complex, where there is a chip that merges 4 lanes of data into a single, higher speed one with a special encoding for longer range transmission. This typically involves an advanced processing chip inside each optic, typically using 7nm - 5nm processes to lower power consumptions and heat."
year_published = 2025
