["https://blog.benjojo.co.uk/post/2014-01-19-super-easy-twitter-bots.md"]
title = "Super Easy Twitter Bots"
full_description = "I often get really quite mad ideas on writing twitter bots, But I often get pretty bored of doing all of the boiler plate that is required when wanting to achieve these things. Since I am typically plagued by finding API’s that work and function like they tell me they do, I have come up with a new way of writing bots that is easy to do in any language (as long as it can read env vars) and also send back replies. It learns from a trick that is now (mostly) gone from the modern HTTP world. Back in the day if you wanted dynamic content in your web server, You standard goto route would be to write a perl script and use the CGI system that was in any good web server. When a Classic CGI webserver got a request for dynamic content it would spin up a new process of your desired script, the script would be provided the information on stuff like requesting IP addresses and URL requested. If the user had posted things it would be fed in through stdin. Then what ever the script pushed out would be what was pushed out to the client, HTTP headers and all. This meant two things, It was very easy to write CGI servers. It also meant that you could (if you wanted to) write dynamic web content with just a few bash scripts. Allowing anything that could run from a shell and could read shell env vars, able to act as content providers for websites. After realising that this use module is what I could do for twitter bots, I started to make twitterd. A twitter deamon that will listen on the twitter streaming API. And depending on its setup, when mentioned or @‘td, Almost instantly A process would be spawned with the env vars of what was needed, and anything (if the script did output anything) would be the twitter response. This meant I now had the ability to write a twitter bot in anything I wanted with out the source program being even aware that it is a twitter bot. So for this example I just want to make a Twitter bot that will respond to me with the tweetID that I just @‘td it with."
year_published = 2025
