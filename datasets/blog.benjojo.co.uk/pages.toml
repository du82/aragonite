["https://blog.benjojo.co.uk/post/ixp-xping-better-ix-monitoring"]
title = "Better IX network quality monitoring"
full_description = "This post is a textual version of a talk I gave at the first NetUK. You can watch the talk on YouTube that was recorded by the wonderful AV team below if that’s your preferred medium: Large Internet eXchange (IX) LAN’s have long often been more than “just” simple Ethernet broadcast domains, either due to the need to scale up in bits per second, or just the need to make an Ethernet (a non loop tolerant system) domain appear in more than two locations without creating loops (and avoiding Spanning Tree). So instead a lot of exchanges run behind some kind of overlay network, where packets are first encapsulated in VXLAN,MPLS or similar tech and routed around the network. This often however means that in order for links to load balance correctly, the equipment servicing the customer facing “Ethernet switched fabric” needs to inspect the actual customer traffic IP Source/Destination and TCP/UDP Source/Destination ports so that it can balance traffic, so while the ethernet IX should only care about source/destination MAC addresses, it will actually use far more than that transparently to the customers. If we imagine a internet exchange like my clients, they have many Points Of Presence (PoPs) where customers can connect in, and as far as the customer cares, these are all connected to each other in a magic way that does not functionally concern the customer equipment: So if you were to setup basic monitoring for ensuring that all members get to all other members in a timely (in microseconds) and reliable (in lack of packet loss) manner you may consider just doing an ICMP to a device connected to each PoP. This however hides the modern day complexity of IX design, since ICMP packets are not typically included in link hashing implementations, all ICMP traffic follows a single and mostly static path. I did some contracting work for LONdon Access Point (LONAP) to design a system that could detect high latency and more critically packet loss on a per flow basis, and figured it was worth sharing the details on what I came up with and how it works, as while this problem is not a novel one (many IXs have some form of flow aware monitoring), Most solutions are a turn key appliance box. The thing is, this is not actually that hard of a problem, and good and transparent deployment of these metrics can quickly answer for the customer the “Am I broken or is the IX broken?” question, maybe even without the customer sending a support email!"
year_published = 2025
