["https://blog.benjojo.co.uk/post/eve-online-bgp-internet"]
title = "What would a EvE online Internet look like?"
full_description = "EvE online is a fascinating game. It’s one of the few MMO’s that only have a single “server” to log into, meaning everyone is playing on the same logical world. It’s also had a fascinating set of events that have happened inside it, and also remains a very visually appealing game for what it is: It is also home to a expansive world map to hold all of these players. At its peak EvE had 63,000 players online in a single world with 500,000 paying subscriptions on top, and while that number is getting lower by the year the world remains infamously large. Meaning that to get from one side to another is a sizable amount of time (and risk due to player owned factions). You travel to different areas using warping (within the same system) or jumping to different systems using a jump gate: I always viewed this map like a network, it’s a large mesh of systems that connect to each other so that people can get across, with most systems having more than two jump gates. this lead me to think what would happen if you took the idea of the map being a network literally? What would a EvE online internet of systems look like? For this we need to understand how the real Internet works. The internet is a large collection of ISP’s that are all numerically identified with a standardised and unique ISP number, called an Autonomous System Number or ASN ( or AS for shorter ). These AS’es need a way to exchange routes with each other, since they will own ranges of IP addresses, and need a way to tell other ISPs that their routers can route these IP addresses. For this, the world has settled on Border Gateway Protocol or BGP. The default behavior of BGP is when it gets a route from a peer, is to give it to all of the other peers it is connected to as well. This means that peers will share their view of the routing table with each other automatically. However this default behavior is only useful if you are using BGP to send routes in to internal routers, since the modern internet has different logical relationships with each other. Instead of a mesh, the modern internet looks more like this:"
year_published = 2025
