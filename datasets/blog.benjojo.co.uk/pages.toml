["https://blog.benjojo.co.uk/post/bgp-stuck-routes-tcp-zero-window"]
title = "Hunting down the stuck BGP routes"
full_description = "BGP is the glue between all of the thousands of border routers that make up the internet (you can find this post (battleships) and this post (EvE) as a crash course on how BGP works). With the current “default free zone” containing around 1,000,000 routes, the table is full of up to date routing information on how to get to almost everything. However as it came to slowly haunt me while working on a side project ( bgp.tools ) that routers don’t always have up to date information… To understand a stuck route, you have to first understand the natural life-cycle of a route/prefix with BGP. In the above example, you see that reachability information is passed along the chain of connected routers. When the originating router withdraws a prefix/route then that information is passed along peers as well, and assuming those peers do not have an alternative information on how to get to that IP prefix, the IP prefix becomes unreachable. In this example the middle route does get sent the withdrawal message, but for whatever reason it loses it. This is bad since the routers downstream of that middle one do not become aware of the prefix/route’s unavailability, meaning they might continue to send traffic that way. This also means that memory is still consumed to hold a route that is no longer reachable. Depending on the situation that memory can be very valuable (and limited). To check how bad the issue is, I setup a BGP route cycler that would announce a different IPv6 prefix every calendar day of the month. This technically would mean that systems should only see two routes from me, a /40 IPv6 block, and a smaller “hole punch” /48 that changes daily: However as expected, after a while of running this, a small pile of stuck routes start to pop up on various sites, like bgp.he.net: Here we can see a prefix that is stuck (the day at the time of writing is 12th, but the prefix was for the 28th) and we assume a few things based on these paths. AS212232 is the announcing ASN, this is me. It follows my upstream (42615), then Hurricane Electric (6939), then Telia (1299), then it hits Core-Backbone (33891) where it appears to get stuck. We can see this because at that point it starts to fork out to other networks, so it’s more than likely that a router inside Core-Backbone has failed to process the withdraw message that my AS sent out on that day."
year_published = 2025
