["https://blog.benjojo.co.uk/post/debug-ssl-tls-with-ssldump-https"]
title = "MITM'ing TLS/SSL for debugging purposes"
full_description = "From time to time you may want to debug TLS, Now this is not as easy as you might think, Because of the nature of TLS, you don’t really want to have anyone (even if they technically may have the key on the server itself) to decrypt what was sent or received. If you are looking for a quick way to debug and peek inside what is being exchanged inside HTTPS connections then there are a few forces into play that we need to remove first. Root on the machine that is doing the traffic (or anything that the SSL traffic passes through) Access to the SSL key itself In this guide I will be using SSLDump. Unfortunately that tool has not aged hugely well to modern ciphers and key exchanges. So we have a few things that are against us for looking at this traffic. First of all, We need to lower our security to remove two things. ECDSA (Not supported in SSLDump), and DH or EDH exchanges since they mean that you cannot passively decrypt the communications going back and forward. To do this in Apache 2 (assuming Apache/2.2.16 on Debian 6 with OpenSSL 0.9.8o) you need to add the following lines in the same places that you have your SSL certificate path’s: Once you have rebooted your web server. You can either capture live off the server, in that case you just want to do or if you want to capture somewhere else or capture traffic and replay it back later (in fear of losing stuff to terminal scrollback limits etc) If you find that ssldump does not print anything either when letting it capture traffic itself, or when feeding in a tcpdump. You are most likely in a virtual machine where you cannot capture on the adapter normally, and have to use Linux Cooked Sockets. SSLDump cannot read this type of setup, but very unhelpfully does not tell you and will simply not output anything. The same applies if you are using tcpdump on OSX. That will use PKTAP, also not compatible with SSLDump."
year_published = 2025
