full_description = "My Exploration Of How Copilot Can Help Blind Users – Part 1 At work and in my personal life I’ve had a chance to explore Microsoft’s new integration using Chat GPT where Copilot brings AI into the M365 Microsoft Office Suite. At work, we are exploring it as a possible tool to help or support a wide variety of people with different types of disabilities. In my… Continue reading My Exploration Of How Copilot Can Help Blind Users – Part 1 Published February 22, 2024Categorized as Accessibility & Adaptive Technology, Persons With Disabilities Basic Orientation Information For CSUN Conference For Blind and Low Vision Travellers Disclaimer All measurements in these directions are approximate and have been calculated with a little guesswork and aren’t guaranteed to be accurate. I cannot guarantee that they are exact dimensions beyond a shadow of a doubt. These instructions were created for my last visit to the conference so there may have been changes in the… Continue reading Basic Orientation Information For CSUN Conference For Blind and Low Vision Travellers Published March 4, 2023Categorized as Accessibility & Adaptive Technology, Accessible Travel, Activities & Events, Advocacy Efforts, Persons With Disabilities Have your questions answered at the CSUN Assistive Technology Conference Published March 4, 2023Categorized as Accessibility & Adaptive Technology, Accessible Travel, Activities & Events, Mobile Devices, Persons With Disabilities Hidden A11y Gem – a Presentation Feature in MS Teams For Those With Print Related Disabilities As a person who is blind I can’t tell you how many times I’ve sat in presentations where the presenter has up on the screen a beautifully created PowerPoint with great accessibility but as a participant all I know is that they are presenting but can’t read the content of the current slide being shown… Continue reading Hidden A11y Gem – a Presentation Feature in MS Teams For Those With Print Related Disabilities Published January 26, 2021Categorized as Accessibility & Adaptive Technology, Activities & Events, Persons With Disabilities"
