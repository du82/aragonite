description = "<p>Now I know what you are thinking, exception hooks? …in kernel-mode? Yes, it is certainly is not as easy as a mere call to kernel32!AddVectoredExceptionHandler, but with some thinking out of t"
full_description = "Daax Rynd 21st October 2019 at 6:53 pm Reply Great read, and interesting PoC. I really like the way you layout the articles too. Great post. Keep it up man! dblydm 23rd October 2019 at 1:08 pm Reply I have a question. KeBugCheckEx is called when system crashing. So, the handler should be called only once? However, your last picture shows that it is called not only once. Why? Can Bölük Post author24th October 2019 at 3:27 pm Reply Because __debugbreak()’ing in the IPI makes every processor call into KeBugCheckEx and as we fixed the concurrency / lock issue in section 0x4, we still get our callbacks called, from which we restore system state. Applecaster 1st May 2020 at 11:39 am Reply What’s the advantage of this over KeRegisterBugcheckCallback? Yuri 4th November 2020 at 11:17 am Reply First of all, great work! I have a question regarding Windows 7. I tried it out on Windows 10 and everything seems to work, but on Windows 7 I get 0x0 addresses for ntoskrnl.exe, KiFreezeExecutionLock and KPRCB_IpiFrozen. Could you give me hint where to start making it work? Can Bölük Post author14th November 2020 at 6:04 pm Reply Hey Yuri, you probably have to change the patterns in the scanner, though I remember having issues with Windows 7 in the first place. Vikki Mehra 13th September 2022 at 9:38 pm Reply Will this system wide hook (ByePG) work if a detour patch is installed in the SwapContext kernel mode function ? killer 12th July 2024 at 5:28 pm Reply Hello brother, may I ask how to use this function if it is used to HOOK non-syscall? I want to use page exception, but I do not know how to deal with it killer 15th July 2024 at 5:00 pm Reply Thanks to the boss, I finally understand this. This is to remove the blue screen through abnormal recovery status"
