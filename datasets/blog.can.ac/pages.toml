title = "Escaping SMEP Hell: Exploiting Capcom Driver In a Safe Manner – Can.ac"
description = "<p>Trapped in a SMEP disabled payload not being able to do anything reliably? You have come to the right place. I’ve seen so many people using Capcom driver in an unsafe manner that I wanted to"
full_description = 'nicator 29th April 2018 at 12:17 am Reply Best of Luck with your new Blog 🙂 (>> works on my machine << every Professional ever ¯\_(ツ)_/¯) weizehua 25th November 2018 at 6:45 am Reply Hi, im new to windows kernel. How do you know that after a context switch, CR0 will be reset? I am curious about which register is reseted, and which is not. Could you tell me someting about it? Can Bölük Post author27th November 2018 at 2:17 pm Reply “Reset” was a bad word choice on my side. The issue with changing control registers is that Windows assumes every CPU will have the same CRn values. When a context switch happens, it will not bother saving the old CRn values of the thread and restoring them later on. So if you are unfortunate enough, your thread might get switched to another CPU core and you will all of a sudden have the CRn values you changed “reset”. SMEP will re-activate in our case. illion 15th February 2019 at 1:46 am Reply Thanks for the elaborate information! I am trying to use this to load a driver: … NON_PAGED_DATA static auto kernel_memory = capcom->allocate_pool(driver.size(), NonPagedPool, true); driver.relocate(kernel_memory); NON_PAGED_DATA static auto size = driver.size(); NON_PAGED_DATA static auto source = driver.data(); NON_PAGED_DATA static auto entry_point = kernel_memory + driver.entry_point(); CpCtx->ExecuteInKernel(NON_PAGED_LAMBDA() { Np_memcpy(kernel_memory, source, size); }); OBJECT_ATTRIBUTES attr; HANDLE th; InitializeObjectAttributes(&attr, NULL, 0x00000200L, NULL, NULL); NTSTATUS status = Khk_CallPassive(PsCreateSystemThread, &th, THREAD_ALL_ACCESS, &attr, NULL, NULL, entry_point, NULL); but I get: [-] Driver failed to start status: 0xC0000005 I am guessing its failing because of SMEP? Can Bölük Post author15th February 2019 at 5:47 pm Reply Khk_CallPassive should be used inside a ExecuteInKernel block'
