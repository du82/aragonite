full_description = 'Can Bölük Post author30th June 2024 at 1:25 pm Reply If it’s a passive worker, then it’s fine as you can suspend it on return. DPC will indeed crash but as it runs for ~2ms every 5 minutes, the chance of you hitting that race window is very unlikely, ~0.0006%. kanren3 30th June 2024 at 4:17 am Reply If you encounter a running PatchGuard, this method will make it difficult to locate the return address within the stack. sasha 18th July 2024 at 12:44 am Reply Thanks, this has been a very good read (as expected from you). I\’ve been diving into PG recently starting with the Tetrane paper and, based on your code, it seems like the ways to execute PG code remains the same, 5 years after the article. I figured they would\’ve kept tweaking it since then and invent new ways to obfuscate the execution, but I suppose MS (sort of) gave up to focus on HVCI and the like. FengTeng 19th July 2024 at 3:10 am Reply The thought process is very clear, and I really enjoy fighting friends with ‘PatchGuard’ Friday50 24th July 2024 at 8:48 am Reply Hi Can Bölük, Can I translate and repost your article on my blog? I’ll include your name and a link to the original post. Thanks! jay 15th August 2024 at 8:44 am Reply Given that this technology is quite old and not actively used, I can discuss it more. First, enumerate the system memory regions; PG only exists in two of these areas. Then, in the IPI, hook #PF and set the NX attribute for these regions. Finally, I use emulation to simulate the code trying to execute in #PF and fake memory access. In fact, PG only uses mov and xor to access memory for integrity checks, making it easy to emulate. FT 26th September 2024 at 4:29 am Reply I am your loyal fan, admired, and looking forward to your open-source library or giving me a chance to learn in advance Can Bölük Post author20th October 2024 at 4:51 am Reply https://github.com/can1357/selene/blob/master/selene/misc/nopg.cpp enjoy! ~ffffff 17th October 2024 at 4:18 am Reply Hi Can Bölük, According to your idea, I’m having some issues implementing nopg. I need your help. How to position the “self-referential index”, or if there are any relevant learning materials Thanks!'
