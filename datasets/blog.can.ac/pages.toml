["https://blog.can.ac/2018/05/11/arbitrary-code-execution-at-ring-0-using-cve-2018-8897"]
title = "Arbitrary Code Execution at Ring 0 using CVE-2018-8897 – Can.ac"
description = "<p>Just a few days ago, a new vulnerability allowing an unprivileged user to run #DB handler with user-mode GSBASE was found by Nick Peterson (@nickeverdox) and Nemanja Mulasmajic (@0xNemi). At the en"
full_description = "Mickey Jin 20th May 2018 at 2:51 am Reply The exploit may not work with certain hypervisors (like VMWare), which discard the pending #DB after INT3. How did you debug it by “simulating” this situation？ Please share the debugging method. Can Bölük Post author20th May 2018 at 8:27 pm Reply To simply put: 1) Load unsigned kernel driver 2) Allocate memory for new GS 3) Set debug registers using __writedr 4) swapgs 5) Set gs base 6) Access the break pointed memory and raise a #DB 7) Debug and Profit. flankreader 21st May 2018 at 10:09 am Reply fffff00e`d7a1bc38 fffff8007e4175c0 nt!KiBreakpointTrap rip for #bp fffff00e`d7a1bc40 0000000000000010 cs for #bp fffff00e`d7a1bc48 0000000000000002 rflags for #bp fffff00e`d7a1bc50 fffff00ed7a1bc68 rsp for #bp fffff00e`d7a1bc58 0000000000000000 ss for #bp fffff00e`d7a1bc60 0000000000000014 ???????? fffff00e`d7a1bc68 00007ff7e2261e95 –rip for ring3 fffff00e`d7a1bc70 0000000000000033 cs for ring3 fffff00e`d7a1bc78 0000000000000202 rflags for ring3 fffff00e`d7a1bc80 000000ad39b6f938 ss for ring3 so what is this “fffff00e`d7a1bc60 0000000000000014” ?? Flankreader 22nd May 2018 at 8:06 am Reply Thank you. It is stack alignment. I just find it in Intel Manual 6.14.2 64-Bit Mode Stack Frame. Mickey Jin 24th May 2018 at 2:02 pm Reply Thanks for your answer. Finally, I debug your code in the following steps: 1. Windbg Kernel debug: ba e1 KiDebugTrapService (I use INT 2D instead of INT 3) Simulate the #DB event which should be created by movss 2. Then in IDA remote gdb(connected VMWare debug stub): set rip to skip notify windbg the #DB event But in this way, the REAL_TIME watchdog thread was hard to get scheduled. When I force to set the context pointer to point to the kernel stack, I can run to the kernel shell code by ROP. Jim 29th May 2018 at 2:54 am Reply Hi, bro! Your work is so good. i’m a newcomer to kernel exploit. I have some questions after reading your article. ONE. How to ,can u explain in more details? TWO. As im new to this area, what is the basic knowledge I need to prepare, do you have some good books or articles to recommand for me? I would appreciate for your precious reply."
