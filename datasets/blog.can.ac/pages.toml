["https://blog.can.ac/2021/03/22/speculating-x86-64-isa-with-one-weird-trick"]
title = "Speculating the entire x86-64 Instruction Set In Seconds with This One Weird Trick – Can.ac"
description = "<p>As cheesy as the title sounds, I promise it cannot beat the cheesiness of the technique I’ll be telling you about in this post. The morning I saw Mark Ermolov’s tweet about the undocume"
full_description = "Massimiliano Ghilardi 25th March 2021 at 10:23 pm Reply Really an interesting use of speculative execution 🙂 I was wandering: is it possible to co-opt Intel TSX i.e. transactional execution for the same purpose? For example, one may try to run in sequence XBEGIN abort_label; ; NOP; // more nop padding XABORT 0; abort_label: and sample the various counters before and after such code. Does it make sense? Massimiliano Ghilardi 25th March 2021 at 10:25 pm Reply There should be “instruction_to_be_tested” under “XBEGIN” but it seems it was swallowed as HTML markup because I put it in angle brackets Can Bölük Post author26th March 2021 at 2:24 am Reply As in a replacement for the speculation part? I don’t see why not, definitely. uuu 31st March 2021 at 4:19 am Reply Hey man, interesting trick! One thing, you could try look up the “opcode map” in Intel’s manual, each empty slots indicate one undocumented instruction. But, there maybe hidden decoding rules. Keep the good work! Terje Wiig Mathisen 31st March 2021 at 8:58 pm Reply I am extremely impressed! Even if some the key ideas here has been known since spectre/meltdown, (ab)using the performance counters in this way is simply wonderful. A long, long time ago (BYTE July 1994) I spent a year reverse engineering the original Pentium performance counters, at that point I had absolutely no idea how many completely new ideas would turn up. 🙂 Ori Livneh 24th April 2021 at 8:29 am Reply There you are! https://vintageapple.org/byte/pdf/199407_Byte_Magazine_Vol_19-07_PC_Telephony.pdf (page 218). I did not know about this bit of computing lore. Thanks for sharing. Bond 24th April 2021 at 7:00 am Reply “mostly interested in Windows kernel development” My brain (noob): Isn’t Windows kernel is a proprietary closed source kernel? or did he worked at Microsoft to see the kernel? People can see the source file? Maybe I should google to know more. Mark 9th May 2021 at 7:25 pm Reply Hello ! Can I ask you aslo about VTIL and NoVMP project ? for example what plans for improvement and dev for feature, and maybe there are will be same project for NoThemida ?"
