full_description = "Zero Trust WARP: tunneling with a MASQUE2024-03-06This blog discusses the introduction of MASQUE to Zero Trust WARP and how Cloudflare One customers will benefit from this modern protocol...Continue reading »Dan Hall A cost-effective and extensible testbed for transport protocol development2020-01-14HTTP3QUICTLS 1.3TCPAt Cloudflare, we develop protocols at multiple layers of the network stack. In the past, we focused on HTTP/1.1, HTTP/2, and TLS 1.3. Now, we are working on QUIC and HTTP/3, which are still in IETF draft, but gaining a lot of interest....Lohith BelladJunho Choi Know your SCM_RIGHTS2018-11-29TLS 1.3TLSSecurityLinuxTCPOpenSSLGoNGINXAs TLS 1.3 was ratified earlier this year, I was recollecting how we got started with it here at Cloudflare. We made the decision to be early adopters of TLS 1.3 a little over two years ago. It was a very important decision, and we took it very seriously....Vlad Krasnov Encrypt that SNI: Firefox edition2018-10-18Birthday WeekProduct NewsCryptographyTLS 1.3DNSSecurityPrivacyA couple of weeks ago we announced support for the encrypted Server Name Indication (SNI) TLS extension (ESNI for short). As promised, our friends at Mozilla landed support for ESNI in Firefox Nightl. ...Alessandro Ghedini Encrypt it or lose it: how encrypted SNI works2018-09-24Birthday WeekProduct NewsCryptographySecurityTLSTLS 1.3DNSReliabilitySpeed & ReliabilityToday we announced support for encrypted SNI, an extension to the TLS 1.3 protocol that improves privacy of Internet users....Alessandro Ghedini August 10, 2018 11:00 PMA Detailed Look at RFC 8446 (a.k.a. TLS 1.3)TLS 1.3 (RFC 8446) was published today. This article provides a deep dive into the changes introduced in TLS 1.3 and its impact on the future of internet security....By Nick SullivanEncryption, TLS, TLS 1.3, HTTPS, Security May 16, 2018 5:28 PMYou get TLS 1.3! You get TLS 1.3! Everyone gets TLS 1.3!It's no secret that Cloudflare has been a big proponent of TLS 1.3, the