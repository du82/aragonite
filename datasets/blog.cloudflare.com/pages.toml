full_description = "How Cloudflare is helping domain owners with the upcoming Entrust CA distrust by Chrome and Mozilla2024-09-19Chrome and Mozilla will stop trusting Entrust’s public TLS certificates issued after November 2024 due to concerns about Entrust’s compliance with security standards. In response, Entrust is partnering with SSL.com to continue providing trusted certificates. Cloudflare will support SSL.com as a CA, simplifying certificate management for customers using Entrust by automating issuance and renewals....Continue reading »Dina Kozlov Introducing Automatic SSL/TLS: securing and simplifying origin connectivity2024-08-08SSLTLSNetwork ServicesEncryptionResearchThis new Automatic SSL/TLS setting will maximize and simplify the encryption modes Cloudflare uses to communicate with origin servers by using the SSL/TLS Recommender....Alex KrivitSuleman AhmadJ EvansYawar Jamal Avoiding downtime: modern alternatives to outdated certificate pinning practices2024-07-29SecurityNetwork ServicesCertificate PinningTLSSSLCertificate TransparencyOutages caused by certificate pinning is increasing. Learn why certificate pinning hasn’t kept up with modern standards and find alternatives to improve security while reducing management overhead...Dina Kozlov How we ensure Cloudflare customers aren't affected by Let's Encrypt's certificate chain change2024-04-12SecurityApplication ServicesTLSSSLCertificate AuthorityDeep DiveLet’s Encrypt’s cross-signed chain will be expiring in September. This will affect legacy devices with outdated trust stores (Android versions 7.1.1 or older). To prevent this change from impacting customers, Cloudflare will shift Let’s Encrypt certificates upon renewal to use a different CA...Dina Kozlov Upcoming Let’s Encrypt certificate chain change and impact for Cloudflare customers2024-03-14SecurityDevelopersDeveloper PlatformSSLTLSApplication SecurityLet’s Encrypt’s cross-signed chain will be expiring in September. To prepare for the change, after May 15th, 2024, Cloudflare will start issuing certs from Let’s Encrypt’s ISRG X1 chain. This change will impact legacy devices with outdated trust stores (Android versions 7.1.1 or older)...Dina Kozlov"
