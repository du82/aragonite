["https://blog.cocoapods.org/CocoaPods-1.3.0"]
title = "CocoaPods 1.3.0 — Test specifications and performance improvements - CocoaPods Blog"
description = "The blog for CocoaPods.org the Cocoa Dependency Manager"
full_description = "Dimitris Koutsogiorgas 1 August 2017 Follow @dnkoutso TL;DR: CocoaPods 1.3.0 has been released, which includes support for test specifications and performance improvements specifically around rebuilding your project and preparation for Xcode 9 support! We are happy to announce that CocoaPods 1.3.0 has been released! The primary feature of this release is support for test specifications. Up until now, podspecs were not able to describe test sources which made it difficult to test your pods and required custom workarounds to represent your test sources via other means. With this release, you are now able to describe your test sources within your podspecs! Let's see an an example podspec: TL;DR: CocoaPods 1.3.0 has been released, which includes support for test specifications and performance improvements specifically around rebuilding your project and preparation for Xcode 9 support! We are happy to announce that CocoaPods 1.3.0 has been released! The primary feature of this release is support for test specifications. Up until now, podspecs were not able to describe test sources which made it difficult to test your pods and required custom workarounds to represent your test sources via other means. With this release, you are now able to describe your test sources within your podspecs! Let's see an an example podspec: Pod::Spec.new do |s| s.name = 'CoconutLib' s.version = '1.0' s.authors = 'Coconut Corp', { 'Monkey Boy' => '[email protected]' } s.homepage = 'http://coconut-corp.local/coconut-lib.html' s.summary = 'Coconuts For the Win.' s.description = 'All the Coconuts' s.source = { :git => 'http://coconut-corp.local/coconut-lib.git', :tag => 'v1.0' } s.license = { :type => 'MIT', :file => 'LICENSE', :text => 'Permission is hereby granted ...' } s.source_files = 'Sources/*.{h,m}' s.test_spec 'Tests' do |test_spec| test_spec.source_files = 'Tests/*.{h,m}' test_spec.dependency 'OCMock' # This dependency will only be linked with your tests. end end Pod