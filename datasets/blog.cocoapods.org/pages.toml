description = "The blog for CocoaPods.org the Cocoa Dependency Manager"
full_description = "Samuel E. Giddins 3 May 2015 Follow @segiddins TL;DR: CocoaPods 0.37 has been released, with a new pod download cache and support for custom module maps. CocoaPods 0.37 has been released, it includes download caching for Pods. This brings a huge speed improvement to commands such as pod spec lint and improves the performance of running pod install when a Pod is in the download cache (which is stored at ~/Library/Caches/CocoaPods/Pods by default). The update also allows you to define a custom module map file in a Podspec. Along with these enhancements, 0.37 features dozens of bug fixes. Updating To install the last release of CocoaPods you can run: TL;DR: CocoaPods 0.37 has been released, with a new pod download cache and support for custom module maps. CocoaPods 0.37 has been released, it includes download caching for Pods. This brings a huge speed improvement to commands such as pod spec lint and improves the performance of running pod install when a Pod is in the download cache (which is stored at ~/Library/Caches/CocoaPods/Pods by default). The update also allows you to define a custom module map file in a Podspec. Along with these enhancements, 0.37 features dozens of bug fixes. Updating To install the last release of CocoaPods you can run: Until version 1.0 we strongly encourage you to keep CocoaPods up-to-date. For all the details, don’t miss the Changelog! Until version 1.0 we strongly encourage you to keep CocoaPods up-to-date. For all the details, don’t miss the Changelog! CocoaPods is a project from Dimitris Koutsogiorgas, Danielle Lancashire, Eric Amorde, Igor Makarov, Orta Therox, Paul Beusterien, Samuel Giddins, and The CocoaPods Dev Team with contributions from many, many others.Lovingly sponsored byArtsy, Button, Capital One, CircleCI, Discontinuity, Emerge Tools, Fingertips, Google, Heroku, jsDelivr, Realm, PSPDFKit, RubyMotion, Sauspiel, Slack, SoundCloud, Stripe, Square, and Technology Astronauts. SupportGitHub RepoWeb Propertie