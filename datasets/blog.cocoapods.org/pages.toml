["https://blog.cocoapods.org/CocoaPods-1.4.0"]
title = "CocoaPods 1.4.0 — Feature packed! - CocoaPods Blog"
description = "The blog for CocoaPods.org the Cocoa Dependency Manager"
full_description = "Dimitris Koutsogiorgas 18 January 2018 Follow @dnkoutso CocoaPods 1.4.0 comes packed with new features such as app host support for tests, script phases, static framework support and a new Swift version DSL! Just after few months after the release of CocoaPods 1.3.0, we unveil a new version that adds a bunch of new powerful features. Let's get right into it! App host support for test specs CocoaPods 1.3.0 introduced support for test specs, but initially, pod authors were unable to use test specs that required an app host. With 1.4.0, you can now specify that an app host is required in order for your tests to execute. You can accomplish this by using setting the requires_app_host attribute within your test spec: CocoaPods 1.4.0 comes packed with new features such as app host support for tests, script phases, static framework support and a new Swift version DSL! Just after few months after the release of CocoaPods 1.3.0, we unveil a new version that adds a bunch of new powerful features. Let's get right into it! App host support for test specs CocoaPods 1.3.0 introduced support for test specs, but initially, pod authors were unable to use test specs that required an app host. With 1.4.0, you can now specify that an app host is required in order for your tests to execute. You can accomplish this by using setting the requires_app_host attribute within your test spec: s.test_spec 'Tests' do |test_spec| test_spec.requires_app_host = true test_spec.source_files = 'Tests/**/*.{h,m,swift}' end s.test_spec 'Tests' do |test_spec| test_spec.requires_app_host = true test_spec.source_files = 'Tests/**/*.{h,m,swift}' end Once enabled, CocoaPods will automatically create a stub app host and link it with your test bundle targets. This enables you to describe test sources that use UIKit in order to function. CocoaPods will re-use the same app host across all test specs integrated in your project. For iOS, the app host generated by CocoaPods creates and adds an empty view controller. Once enabled, CocoaPods will automatically create a stub app host and link it with your test bundle targets. This enables you to describe test sources that use UIKit in order to function. CocoaPods will re-use the same app host across all test specs integrated in your project. For iOS, the app host generated by CocoaPods creates and adds an empty view controller."
