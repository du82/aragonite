["https://blog.cocoapods.org/CocoaPods-0.38"]
title = "CocoaPods 0.38 - watchOS and target de-duplication - CocoaPods Blog"
description = "The blog for CocoaPods.org the Cocoa Dependency Manager"
full_description = "Marius Rackwitz 21 July 2015 Follow @mrackwitz TL;DR: CocoaPods 0.38 has been released, with watchOS 2 support, target de-duplication, and Stats for everyone. CocoaPods 0.38 has been released. This is our first update since WWDC and it brings support for Apple's latest releases, including Xcode 7 and watchOS. It also includes lots of improvements that make building Pods easier. Furthermore, it rolls out Stats for everyone. watchOS The update allows you to use Pods with watchOS. As a Pod Author, you have to specify the deployment target for watchOS in the Podspec, as seen below: TL;DR: CocoaPods 0.38 has been released, with watchOS 2 support, target de-duplication, and Stats for everyone. CocoaPods 0.38 has been released. This is our first update since WWDC and it brings support for Apple's latest releases, including Xcode 7 and watchOS. It also includes lots of improvements that make building Pods easier. Furthermore, it rolls out Stats for everyone. watchOS The update allows you to use Pods with watchOS. As a Pod Author, you have to specify the deployment target for watchOS in the Podspec, as seen below: What this means in practice, is that not all Pods are automatically available by default. Any Pod that can support watchOS needs to explicitly add support by adding s.watchos.deployment_target. It is an entirely new platform. Target Deduplication CocoaPods now de-duplicates Pod targets, which means that it recognises when a dependency is used multiple times across different user targets but only needs to be built once. But sometimes this is not possible and they still need to be generated in different variants and thus build multiple times. The targets in Pods.xcodeproj need to be duplicated when one of the following conditions applies: They are used on different platforms. They are used with differents sets of subspecs. They have any dependency which needs to be duplicated. This fixes several issues with Archiving apps with extensions, but also reduces build times significantly. Removal of the Enviroment Header After updating and running pod install on your integration, you will see that some header files in the Pods directory won't be generated anymore matching the pattern Pods-*-environment.h. This was the environment header, which contained precompiler macro definitions with the version components of each dependency used in the integrated target. It was visible not only for the user target, but also for all its dependencies. It could be used to make additional features available if a given pod is present. But this was also the cause of some issues. One of them was that it wouldn't be possible to de-duplicate frameworks. If you relied on that, you can still use the Clang file checking macro __has_include to determine (by the presence of a header) whether a specific dependency is available or not:"
