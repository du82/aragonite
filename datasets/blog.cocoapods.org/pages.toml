["https://blog.cocoapods.org/Sharding"]
title = "CocoaPods Specs Repo Sharding - CocoaPods Blog"
description = "The blog for CocoaPods.org the Cocoa Dependency Manager"
full_description = 'Orta Therox 28 October 2016 Follow @orta In March, CocoaPods hit an unfortunate problem with our Specs Repo being rate limited. We announced that we were planning on Sharding the Specs Repo, but were hesitant to do it instantly. Now over six months later we are planning on running the scripts. If you are using CocoaPods 1.x - you should not see any changes. If you are using CocoaPods 0.39 and below, you will see an error saying that your version of CocoaPods is not supported. Previous to this, our minimum version was 0.32. For people who want to continue using 0.x versions, we will be replicating the Specs repo from the commit before the repo was sharded. This means you can add: source "https://github.com/CocoaPods/Old-Specs" To the top of your Podfile, and CocoaPods will only use the archived repo, instead of using the new repo structure. You will also need to set your local Specs repo to a version before the transition: cd ~/.cocoapods/repos/master/ git fetch origin master git checkout v0.32.1 To run pod install, you will also need to use --no-repo-update. We do not have the resources to maintain multiple versions of CocoaPods in our spare time, and so we recommend that instead of doing the above, you migrate to the latest versions of CocoaPods in your projects. We are planning to do it on Friday November the 11th, so there will be scheduled downtime on pushing new Pods to Trunk during the process of updating and verifying that it was successful. In March, CocoaPods hit an unfortunate problem with our Specs Repo being rate limited. We announced that we were planning on Sharding the Specs Repo, but were hesitant to do it instantly. Now over six months later we are planning on running the scripts. If you are using CocoaPods 1.x - you should not see any changes. If you are using CocoaPods 0.39 and below, you will see an error saying that your version of CocoaPods is not supported. Previous to this, our minimum version was 0.32. For people who want