title = "CocoaPods 1.7.0 Beta! - CocoaPods Blog"
description = "The blog for CocoaPods.org the Cocoa Dependency Manager"
full_description = "Dimitris Koutsogiorgas 22 February 2019 Follow @dnkoutso CocoaPods 1.7.0 expands heavily on the improved underlying infrastructure of prior releases with support for multiple Swift versions, app specs and more! This is a huge release which contains a variety of new features to help propel CocoaPods forward. Let's jump right in! Support For Multiple Swift Versions The swift_version DSL that was first introduced in CocoaPods 1.4.0 has now been expanded to support multiple Swift versions. This helps pod authors and gives consumers more flexibility when it comes to choosing which version of Swift to use when consuming a pod. Pod authors can now transcribe that information into their podspec by simply specifying the additional Swift versions within the swift_versions DSL. Here's an example podspec that specifies additional Swift versions it supports: CocoaPods 1.7.0 expands heavily on the improved underlying infrastructure of prior releases with support for multiple Swift versions, app specs and more! This is a huge release which contains a variety of new features to help propel CocoaPods forward. Let's jump right in! Support For Multiple Swift Versions The swift_version DSL that was first introduced in CocoaPods 1.4.0 has now been expanded to support multiple Swift versions. This helps pod authors and gives consumers more flexibility when it comes to choosing which version of Swift to use when consuming a pod. Pod authors can now transcribe that information into their podspec by simply specifying the additional Swift versions within the swift_versions DSL. Here's an example podspec that specifies additional Swift versions it supports: Pod::Spec.new do |spec| spec.name = 'CoconutLib' spec.version = '1.0' # ... rest of root spec entries go here spec.swift_versions = ['3.2', '4.0', '4.2'] end Pod::Spec.new do |spec| spec.name = 'CoconutLib' spec.version = '1.0' # ... rest of root spec entries go here spec.swift_versions = ['3.2', '4.0', '4.2'] end Unless or otherwise specified by the consumer of the CoconutLib pod, CocoaPods will automatically select the latest version of Swift during installation which in this example will be 4.2. However, there are many cases in which consumers of a pod might be unable to use the latest Swift version, perhaps because their toolchain does not support it yet. For example, a project that is using an older version of Xcode that does not support Swift 4 will be unable to integrate the CoconutLib pod and would end up with a compilation error. To solve this, CocoaPods 1.7.0 provides the ability to specify Swift version requirements through the new supports_swift_versions DSL for each target that is integrated within the Podfile. For example:"
