["https://blog.cocoapods.org/CocoaPods-App-1.0"]
title = "CocoaPods App 1.0 - CocoaPods Blog"
description = "The blog for CocoaPods.org the Cocoa Dependency Manager"
full_description = '''Orta Therox 11 May 2016 Follow @orta After about a year of work, with the release of CocoaPods 1.0, the corresponding Mac App is also ready for public usage. This is no big reveal, we've been advertising it's existence on our websites for a while. I've already talked a little bit about the tech behind the Mac App, so this post is the one that makes you say your team "we should use this instead of the gem". So let me put my best hat on, and try to pursuade you that using the CocoaPods Mac App is a great idea. What problem does this solve? CocoaPods exists within the ruby ecosystem. The majority of Cocoa developers don't have much overlap with writing ruby programs. Installing and maintaining multiple versions of command-line tools like CocoaPods is something that people have to learn in order to use CocoaPods effectively. This creates a problem which Bundler solves really well, but now you're starting to really dive into the ruby ecosystem and the pre-requisite knowledge to contribute raises again. While I'm on my soap-box, if you're using the CocoaPods and Fastlane gems in an app, you probably should be using Bundler. So the CocoaPods app hosts everything. Literally, it has it's own self-contained copies of bzr, curl, git, mercurial, ncurses, openssl, pkg-config, ruby, scons, serf, subversion, yaml and zlib. This allows the CocoaPods team to ensure consistent behavior across all user setups. This concept is not new for Cocoa developers, as Xcode has been embedding its own dependencies inside it's .app since it moved to the Mac App Store. The advantage from a user's perspective is that it works, and you can install your own crazy version of git, or curl or ruby, and it just works. What does it do well? Glad you asked, 'cause it does two things really well: Running pod install or pod update Editing a Podfile That was basically the spec for the app from day 1. Once @alloy had proved that pod install/update was working, @nate_west and I took over and started working on the latter. Podfile Editing Some of these features are mundane, "hey, wow, syntax highlighting</sarcasm>" but others are really fascinating deep levels of context-specific integration that you'd expect from an IDE. We've started out with syntax highlighting, and then added useful examples of auto-completion results that show how to use the Podfile DSL.'''
author = "CocoaPods Dev Team"
year_published = 2025
clearnet = "https://blog.cocoapods.org/CocoaPods-App-1.0"
