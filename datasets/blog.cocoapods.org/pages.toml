["https://blog.cocoapods.org/CocoaPods-1.10.0-beta"]
title = "1.10 Beta Begins! - CocoaPods Blog"
description = "The blog for CocoaPods.org the Cocoa Dependency Manager"
full_description = "Dimitris Koutsogiorgas 17 July 2020 Follow @dnkoutso CocoaPods 1.10 drops support for Ruby 2.0, adds support for Ruby 2.7 and adds initial support for Xcode 12 as well as a revamped XCFramework integration process! Ruby 2.0 is out, 2.7 is in! In the 1.10 release, CocoaPods no longer supports Ruby 2.0 and bumps the minimum version to Ruby 2.3.3! Support for Ruby 2.0 has been dropped for years and macOS with High Sierra has been shipping with Ruby 2.3.3 as the default version. We hope that this update will unblock other gems that in the past were blocked by CocoaPods as well as address several vulnerabilities that have been fixed since then. Finally, all CocoaPods related gems have been updated to work with Ruby 2.7 and all known warnings have been fixed during installation. Revamped XCFramework Integration With this release, the biggest change is the removal of the Prepare Artifacts script. Similar to the reworked dSYM support in this release, the logic to embed a .framework slice has now moved from the app to each pod target with a new script phase, Copy XCFrameworks. Handling of dSYMs and bitcode symbol maps have also moved. This rework assisted in fixing several bugs and enabled the support of additional features such as static library support and framework user targets! Xcode 12 Support With CocoaPods 1.10 initial support for Xcode 12 has been added. Xcode 12 is still in beta, so it is expected that a few more updates will be required to fully support it. Please file any issues for us to diagnose and fix prior to 1.10 launching! post_integrate Hook DSL CocoaPods has always offered various hooks into its installation lifecycle. This allows users to customize several aspects of the installation process and perform changes to their project. With this release, we are adding a new post_integrate hook that is executed after the CocoaPods integration step is completed. In your Podfile: CocoaPods 1.10 drops support for Ruby 2.0, adds support for Ruby 