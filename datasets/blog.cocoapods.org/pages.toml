["https://blog.cocoapods.org/CocoaPods-0.29"]
title = "CocoaPods 0.29 - CocoaPods Blog"
description = "The blog for CocoaPods.org the Cocoa Dependency Manager"
full_description = "Fabio Pelosin 24 December 2013 Follow @fabiopelosin TL;DR: CocoaPods 0.29 introduces the pod try subcommand, the social media URL podspec attribute & complete inhibition of header warnings. Every now and then we hear about tiny yet huge feature requests for CocoaPods. Pod try is one of these. Suggested by Laurent Sansonetti, pod try quickly gained a spot among the features of CocoaPods that I love the most. But… What is it? Pod Try Pod try is a new subcommand which allows you to quickly launch the demo project of a Pod. It can be used to assess the quality of a library – very useful for user interface elements – or to quickly get up to speed on how to use it. TL;DR: CocoaPods 0.29 introduces the pod try subcommand, the social media URL podspec attribute & complete inhibition of header warnings. Every now and then we hear about tiny yet huge feature requests for CocoaPods. Pod try is one of these. Suggested by Laurent Sansonetti, pod try quickly gained a spot among the features of CocoaPods that I love the most. But… What is it? Pod Try Pod try is a new subcommand which allows you to quickly launch the demo project of a Pod. It can be used to assess the quality of a library – very useful for user interface elements – or to quickly get up to speed on how to use it. In other words the command automates the following steps: Checkout the source of the Pod in a temporary directory. Search for any project looking like a demo project using some simple heuristics. Install any CocoaPods dependencies if needed by the located project. Open the workspace/project in Xcode. To check it out just update to the last release of CocoaPods and run: It is new, so we'd like feedback as issues on the repo please. Social Media URL As you might know, the @CocoaPodsFeed account posts notifications about new Pods. We have been aware from a long time that some users replied to those tweets and that the conversation, as the tweets are generated by an automatic service, was unfortunately lost. When it was suggested to include the Twitter handle of the author of the Pod in the feed we decided to take action. Identifying a solution was not easy because on the one hand we didn't want to include a DSL attribute dedicated to a proprietary platform like Twitter; on the other hand, we recognized that Twitter was a very convenient channel for discussing Open Source Projects. After discussing for 75 minutes we managed to come up with a solution which was able to satisfy our requirements: the social media URL. Instead of asking to specify a Twitter handle we opted to ask for an URL."
