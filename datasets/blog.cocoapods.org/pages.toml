["https://blog.cocoapods.org/Jamming-2015"]
title = "Test Jam 2015 - CocoaPods Blog"
description = "The blog for CocoaPods.org the Cocoa Dependency Manager"
full_description = "Orta Therox 19 April 2015 Follow @orta Over the weekend over 150 people met up in meetups, and many joined online, to try and improve the foundational libraries that the Cocoa community rely on. We made more than 30 pull requests and a lot of people got more exposure to testing in Xcode. Read on for stats. Over the weekend over 150 people met up in meetups, and many joined online, to try and improve the foundational libraries that the Cocoa community rely on. We made more than 30 pull requests and a lot of people got more exposure to testing in Xcode. Read on for stats. The jam ran over a 14 hour timespan from 12pm GMT to 6pm PST. We had an active IRC with random banter and people asking useful questions. Twitter too. The @CocoaPods testjam is alive and well at @Substantial in Seattle! Come join us and give back to the iOS OSS community!— Kai Curtis (@thepelkus) April 18, 2015 Added unit tests and CI to FrameAccessor during the @CocoaPods test jam! Feeling pretty zen, despite the Obj-C. https://t.co/iLzyccp8pP— Ayaka Nonaka (@ayanonagon) April 19, 2015 Writing tests with cats for the @CocoaPods Test Jam 😻 pic.twitter.com/DVxJyEIXZT— Michele Titolo (@micheletitolo) April 18, 2015 One of the greatest things about @CocoaPods test jam is seeing different peoples approaches to testing legacy code.— squarefrog (@squarefrog) April 18, 2015 For the @CocoaPods Test Jam I added code coverage to Form! https://t.co/HJbqDp5uQD— Elvis Nuñez (@3lvis) April 18, 2015 Learned quite a bit about testing and werewolves @CocoaPods #testjam— Eytan Biala (@eytanbiala) April 19, 2015 “Why test? It’s not about increasing test coverage. It’s about empowering the ability to change the code.” —@qcoding @CocoaPods test jam— Ayaka Nonaka (@ayanonagon) April 18, 2015 For the @CocoaPods Test Jam @ams340 and I added test coverage to facebook/KVOController--now adding missing tests! https://t.co/ft5aDbTZ79— Brian Gesiak（もどかしい） (@modocache) April 18, 2015 We’ve wrapped up our first test jam pod: https://t.co/tBNlwUgP6z— Ørta (@orta) April 18, 2015 Having fun @CocoaPods #testjam! Adding tests to MGBoxKit https://t.co/rOBgjxBl1h— Benjamin Encz (@benjaminencz) April 18, 2015 Testing cocoa is exhausting. #testjam @ Artsy https://t.co/rPu9hrzi8J— Rob Ruffler (@RobRuffler) April 18, 2015 @robbiehanson_15 Gotcha, yeah, you maintain some seriously popular stuff! I set up some unit test for Cocoapods test jam, nothing critical.— Stepan Hruda (@StepanHruda) April 18, 2015 Thanks to @Daniel1of1 and @iwasleeg for helping organize the cocoapods test jamming meetup yesterday.Fingers crossed https://t.co/XYDqpysNVh— seanoshea (@seanoshea) April 19, 2015 Talks Every meetup had the freedom to run it however they like, ranging from two people in a room to speakers known for their testing prowess. Interestingly enough, both talked about adding tests to untested code. Hint: you might be interested in their source material: Working Effectively with Legacy Code"
