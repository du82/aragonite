["http://blog.cocoapods.org/CocoaPods-0.34"]
title = "CocoaPods 0.34 - CocoaPods Blog"
description = "The blog for CocoaPods.org the Cocoa Dependency Manager"
full_description = "Fabio Pelosin 26 September 2014 Follow @fabiopelosin TL;DR: CocoaPods 0.34 which includes the work sponsored by SoundCloud has been released. The highlights? Support for scoping Pods per build configuration, declaration of source repositories, and faster downloads. This release will require making changes to your Podfiles I would like to thank SoundCloud and the Travis Foundation for their support. Without their contribution, this release wouldn't have been nearly as extensive. Initiatives like this constitute an important engine to foster the development of the CocoaPods community. Dependencies per build configuration Read this: TL;DR: CocoaPods 0.34 which includes the work sponsored by SoundCloud has been released. The highlights? Support for scoping Pods per build configuration, declaration of source repositories, and faster downloads. This release will require making changes to your Podfiles I would like to thank SoundCloud and the Travis Foundation for their support. Without their contribution, this release wouldn't have been nearly as extensive. Initiatives like this constitute an important engine to foster the development of the CocoaPods community. Dependencies per build configuration Read this: Are you getting it? Finally you can specify dependencies per build configuration. This is one of the most requested CocoaPods features… ever. The work on this functionality was kick-started by Joachim Bengtsson with what I could describe only as a great open source attitude. Joachim was interested in curating the complete experience of Lookback, including installation with CocoaPods. Instead of just opening an issue he went above and beyond and proposed one of the most ambitious pull requests which we ever received. Unfortunately given its implications with the integration strategy, the patch entered a limbo where it remained stuck for more than a year. However, thanks to the support of SoundCloud (and the patience of Eloy) this feature has been released. There are some caveats to keep in mind though: Currently, dependencies can be scoped by configuration only by Pod rather than by individual subspecs. All the resources are copied regardless of the build configurations. The Acknowledgements files generated by CocoaPods include all the Pods regardless of whether they are scoped by build configuration. Private spec repositories Another feature which our users frequently ask for is the support for declaring spec repositories in the Podfile. With this change the Podfile becomes fully deterministic. This feature was kickstarted by François Benaiteau. Here is how it works:"
