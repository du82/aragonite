["https://blog.cocoapods.org/CocoaPods-0.30"]
title = "CocoaPods 0.30 - CocoaPods Blog"
description = "The blog for CocoaPods.org the Cocoa Dependency Manager"
full_description = "Fabio Pelosin 29 March 2014 Follow @fabiopelosin TL;DR: CocoaPods 0.30 dramatically reduces setup time & download size, introduces compatibility adjustments for Xcode 5.1 and the Rainforest! Smarter Setup Sometimes the small changes have the biggest impact. Folks with slow interwebs, rejoice! Because this patch contributed by Jeff Verkoeyen will prevent the download of the history of the master repo during setup and consequently will dramatically reduce the download size (from >200MB to roughly 3.5MB). Nippy. Xcode 5.1 Finally we can say bye bye (at least until the next update of Xcode) to that pesky warning about updating the build settings of the Pods thanks to Romans Karpelcevs. Additionally, the file references of frameworks have been fixed to work on Xcode 5.1. Rainforest If you are a CocoaPods contributor or if you plan to hack on it, this new repo will definitely interest you. Rainforest is the home of CocoaPods development and makes setup of the CocoaPods dependencies as it should have always been: super simple! TL;DR: CocoaPods 0.30 dramatically reduces setup time & download size, introduces compatibility adjustments for Xcode 5.1 and the Rainforest! Smarter Setup Sometimes the small changes have the biggest impact. Folks with slow interwebs, rejoice! Because this patch contributed by Jeff Verkoeyen will prevent the download of the history of the master repo during setup and consequently will dramatically reduce the download size (from >200MB to roughly 3.5MB). Nippy. Xcode 5.1 Finally we can say bye bye (at least until the next update of Xcode) to that pesky warning about updating the build settings of the Pods thanks to Romans Karpelcevs. Additionally, the file references of frameworks have been fixed to work on Xcode 5.1. Rainforest If you are a CocoaPods contributor or if you plan to hack on it, this new repo will definitely interest you. Rainforest is the home of CocoaPods development and makes setup of the CocoaPods dependencies as it should have always been: super simple!"
