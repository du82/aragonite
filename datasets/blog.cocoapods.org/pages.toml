["https://blog.cocoapods.org/Stats-Reset"]
title = "CocoaPods Stats Resetting - CocoaPods Blog"
description = "The blog for CocoaPods.org the Cocoa Dependency Manager"
full_description = "Orta Therox 9 August 2015 Follow @orta TL;DR: CocoaPods Stats is ready to move from it's current staging environment, and we will be resetting all stats next weekend. When I set up CocoaPods Stats - the website API and Analytics database with help from Segment, I created it within a staging environment in our analytics database. Since getting it up and running, I gave it two months to gather enough data in order for us to be sure that the, at-the-time, evolving table data structure works. Looks like it is working. In that time, people using only the latest releases of CocoaPods, have used CocoaPods to download AFNetworking almost 100,000+ times, on 6500+ individual projects. So, next week I will migrate the stats server to production and everything will be back to zero downloads / installs again. TL;DR: CocoaPods Stats is ready to move from it's current staging environment, and we will be resetting all stats next weekend. When I set up CocoaPods Stats - the website API and Analytics database with help from Segment, I created it within a staging environment in our analytics database. Since getting it up and running, I gave it two months to gather enough data in order for us to be sure that the, at-the-time, evolving table data structure works. Looks like it is working. In that time, people using only the latest releases of CocoaPods, have used CocoaPods to download AFNetworking almost 100,000+ times, on 6500+ individual projects. So, next week I will migrate the stats server to production and everything will be back to zero downloads / installs again. CocoaPods is a project from Dimitris Koutsogiorgas, Danielle Lancashire, Eric Amorde, Igor Makarov, Orta Therox, Paul Beusterien, Samuel Giddins, and The CocoaPods Dev Team with contributions from many, many others.Lovingly sponsored byArtsy, Button, Capital One, CircleCI, Discontinuity, Emerge Tools, Fingertips, Google, Heroku, jsDelivr, Realm, PSPDFKit, RubyMotion, Sauspiel, Slack, SoundCloud, Stripe, Square, and Technology Astronauts."
