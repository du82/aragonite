["http://blog.cocoapods.org/Stats"]
title = "CocoaPods Stats - CocoaPods Blog"
description = "The blog for CocoaPods.org the Cocoa Dependency Manager"
full_description = "Orta Therox 24 June 2015 Follow @orta People have been asking for years about feedback on how many downloads their libraries have. We've been thinking about the problem for a about as long too, and finally ended up asking Segment if they would provide a backend for the project. But wait, there's more... It wasn't just enough to offer just download counts. We spend a lot of time working around Xcode's project file intricacies, however in this context, it provides us with foundations for a really nice feature. CocoaPods Stats will be able to keep track of the unique number of installs within Apps / Watch Apps / Extensions / Unit Tests. This means is that developers using continuous integration only register as 1 install, even if the server runs pod install each time, separating total installations vs actual downloads. People have been asking for years about feedback on how many downloads their libraries have. We've been thinking about the problem for a about as long too, and finally ended up asking Segment if they would provide a backend for the project. But wait, there's more... It wasn't just enough to offer just download counts. We spend a lot of time working around Xcode's project file intricacies, however in this context, it provides us with foundations for a really nice feature. CocoaPods Stats will be able to keep track of the unique number of installs within Apps / Watch Apps / Extensions / Unit Tests. This means is that developers using continuous integration only register as 1 install, even if the server runs pod install each time, separating total installations vs actual downloads. Alright, hold up Let's go over how we check which pods get sent up for analytics, and how we do the unique installs. CocoaPods-Stats is a plugin that is now bundled with CocoaPods from version 0.38 onwards. It registers as a post-install plugin and is ran on every pod install or pod update. Detecting Public Pods We're very pessimistic about sending a Pod up to our stats server. We ensure that you have a CocoaPods/Specs repo set up as your master repo, then ensure that each pod to be sent is inside that repo before accepting it as a public domain pod. Data being sent First up, we don't want to know anything about your app. So in order to know unique targets we use your project's target UUID as an identifier. These are a hash of your MAC address, Xcode's process id and the time of target creation (but we only know the UUID/hash, so your MAC address is unknown to us). These UUIDs never change in a project's lifetime (contrary to, for example, the bundle identifier). We double hash it just to be super safe."
