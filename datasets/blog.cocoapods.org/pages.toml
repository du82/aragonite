["https://blog.cocoapods.org/CocoaPods-1.0-Migration-Guide"]
title = "CocoaPods 1.0 Migration Guide - CocoaPods Blog"
description = "The blog for CocoaPods.org the Cocoa Dependency Manager"
full_description = "Orta Therox 3 February 2016 Follow @orta Major 1.0 changes TL:DR ​ You now have to define targets. Previously there was an available implicit target. A target has to represent an Xcode target. When you want to represent a collection of pods that go to multiple targets, use an abstract_target then add targets inside that. Pod dependencies are inherited by nested targets. Targets that want to know about the pods for a target but don't need linking (for example, Test targets) can define that they inherit pods via their search paths (inherit! :search_paths). :exclusive => true and link_with have been removed in favour of the above. xcodeproj is renamed project to make the DSL vocabulary consistent. We've removed the ability to declare :head on a pod—you can either use the :podspec option or point directly to the upstream repo (via git, :svn, etc.). You can now declare installation options inside the Podfile via install! (e.g. install! 'cocoapods', :deterministic_uuids => false, :integrate_targets => false). We've removed all DSL attributes that were classed as deprecated. pod trunk delete and pod trunk deprecate have been introduced. pod search improvements (this is great because it searches all your private spec repos too). pod lib lint and pod spec lint will verify that your pod can actually be imported. Re-targeting A large fraction of the bug reports we receive is due to ambiguity in the Podfile. It gave a lot of freedom to create all kinds of CocoaPods setups that would work by luck of implementation details, or work but are significantly more complex than they needed to be. In the 0.x branches the name of a target could be anything. If it was the name of a matching target then it would automatically link to the target, but if not it would create a Pods-[Name] target and you could use link_to to connect it to targets. In 1.0+ a target has to correspond to a real Xcode target. In order to support use cases where Pods can be shared among multiple targets we added abstract_target. For example:"
