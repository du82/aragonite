full_description = "Samuel E. Giddins 21 June 2023 Follow @segiddins I'm very happy to announce that Emerge Tools is now sponsoring the web hosting costs of CocoaPods! We're super thankful that Emerge is stepping in to help us out with this. CocoaPods.org, Trunk, and all the other websites we maintain are a critical part of the CocoaPods ecosystem, and we're glad to have Emerge's support to keep them running. Emerge Tools is a suite of revolutionary products designed to supercharge mobile apps and the teams that build them. They're a small startup working in a space that is near and dear to our hearts, and when they heard that the CocoaPods maintainers had been paying for hosting out-of-pocket for years, they were eager to step up and help out. I'm very happy to announce that Emerge Tools is now sponsoring the web hosting costs of CocoaPods! We're super thankful that Emerge is stepping in to help us out with this. CocoaPods.org, Trunk, and all the other websites we maintain are a critical part of the CocoaPods ecosystem, and we're glad to have Emerge's support to keep them running. Emerge Tools is a suite of revolutionary products designed to supercharge mobile apps and the teams that build them. They're a small startup working in a space that is near and dear to our hearts, and when they heard that the CocoaPods maintainers had been paying for hosting out-of-pocket for years, they were eager to step up and help out. CocoaPods is a project from Dimitris Koutsogiorgas, Danielle Lancashire, Eric Amorde, Igor Makarov, Orta Therox, Paul Beusterien, Samuel Giddins, and The CocoaPods Dev Team with contributions from many, many others.Lovingly sponsored byArtsy, Button, Capital One, CircleCI, Discontinuity, Emerge Tools, Fingertips, Google, Heroku, jsDelivr, Realm, PSPDFKit, RubyMotion, Sauspiel, Slack, SoundCloud, Stripe, Square, and Technology Astronauts. SupportGitHub RepoWeb Properties Status@CocoaPodsMailing ListCocoaPods Dev TeamPodfile DocsumentationLegal / Conduct"
