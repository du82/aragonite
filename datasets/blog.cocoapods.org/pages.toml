["https://blog.cocoapods.org/CocoaPods-0.33"]
title = "CocoaPods 0.33 - CocoaPods Blog"
description = "The blog for CocoaPods.org the Cocoa Dependency Manager"
full_description = "Fabio Pelosin 21 May 2014 Follow @fabiopelosin TL;DR: CocoaPods 0.33 has been released. It is shiny and brings a huge change for our community… the support for CocoaPods Trunk. New command line UI The help banners of the command line have been tuned: Each element now is consistently identified by a single colour. The highlighting is also performed in the descriptions of the commands to make them more readable. The alignment of the various elements and of their description has been carefully crafted. The descriptions and other bodies of text now are consistently wrapped to the width of the terminal (or to a maximum value to preserve readability for full screen windows). TL;DR: CocoaPods 0.33 has been released. It is shiny and brings a huge change for our community… the support for CocoaPods Trunk. New command line UI The help banners of the command line have been tuned: Each element now is consistently identified by a single colour. The highlighting is also performed in the descriptions of the commands to make them more readable. The alignment of the various elements and of their description has been carefully crafted. The descriptions and other bodies of text now are consistently wrapped to the width of the terminal (or to a maximum value to preserve readability for full screen windows). There is still some debate about how to handle light backgrounds. So if you have a well-construed argument share your view on CocoaPods#2159. Another interesting enhancement is the inclusion of a suggestion for unrecognised arguments, which makes typos much easier to catch. Finally, a galore of minor tweaks have been implemented: The naked pod command doesn’t default to pod install anymore because it presented an error if the Podfile was not found. This context dependant behaviour was not the experience we are looking for our new users. The --version option is not available anymore in sub-commands and gained the ability of presenting the versions of the installed plugins if coupled with the --verbose option. Command line completion The --completion-script option has been implemented for the pod command. It prints a completion script for the current shell (currently only the Z shell is supported). The result is: faster than ever CocoaPoding:"
