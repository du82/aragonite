["https://blog.cocoapods.org/Cool-URIs-Don't-Change"]
title = "Cool URIs don't change. - CocoaPods Blog"
description = "The blog for CocoaPods.org the Cocoa Dependency Manager"
full_description = 'Orta Therox 2 December 2013 Follow @orta TL;DR: We broke some URIs but this is how we ensure people still get the info they were looking for. To try and simplify where you can find CocoaPods documentation we deprecated docs.cocoapods.org in favour of guides.cocoapods.org and there will be further subsites with different focuses. To ensure a smooth transition I built a small sinatra app that might be of use to other people. Whilst not entirely living up to the W3C dream of the content changing but the URI not changing I felt a system of smart HTTP 302 permanent redirects would work quite elegantly for our system. Previously we had a static site that was held on github pages, this meant we had no ability to do true redirects, only HTMLs property <meta http-equiv="refresh">. This is a sledgehammer approach to redirects and we wanted to use a smaller tool. So I brought out ruby, the language CocoaPods is built in and created a small app using sinatra that can be used to make a map of URLs to redirect to. Luckily there were not that many pages in the docs and we had equivilent pages in the guides. This is then turned into a heroku app and made to be the new docs.cocoapods.org silently redirecting people to the new website with the same information they were looking for. TL;DR: We broke some URIs but this is how we ensure people still get the info they were looking for. To try and simplify where you can find CocoaPods documentation we deprecated docs.cocoapods.org in favour of guides.cocoapods.org and there will be further subsites with different focuses. To ensure a smooth transition I built a small sinatra app that might be of use to other people. Whilst not entirely living up to the W3C dream of the content changing but the URI not changing I felt a system of smart HTTP 302 permanent redirects would work quite elegantly for our system. Previously we had a static site that was held on github pages, this meant we had no ability to do true redirects, only HTMLs property <meta http-equiv="refresh">. This is a sledgehammer approach to redirects and we wanted to use a smaller tool. So I brought out ruby, the language CocoaPods is built in and created a small app using sinatra that can be used to make a map of URLs to redirect to. Luckily there were not that many pages in the docs and we had equivilent pages in the guides. This is then turned into a heroku app and made to be the new docs.cocoapods.org silently redirecting people to the new website with the same information they were looking for.'
