["https://blog.cocoapods.org/CocoaPods-1.11.0-beta"]
title = "1.11 Arrives! - CocoaPods Blog"
description = "The blog for CocoaPods.org the Cocoa Dependency Manager"
full_description = "Dimitris Koutsogiorgas 9 August 2021 Follow @dnkoutso CocoaPods 1.11 raises the minimum Ruby version to 2.6 while adding support for Ruby 3.0. It also adds support for 'On Demand Resources' and contains numerous bug fixes and improvements! Ruby 2.6 and Ruby 3.0 With the release of 1.11, the minimum version of Ruby required to run CocoaPods is now 2.6. By doing so, we were also able to bump a few other dependencies (such as ActiveSupport and Addressable) that were often colliding with other setups. We hope this unblocks developers and makes CocoaPods a bit more flexible. Ruby 3.0 is also now supported and is part of CocoaPods CI going forward! This will ensure new changes and fixes are always tested and verified against Ruby 3.0 before they are merged. On Demand Resources In a nutshell, On Demand Resources allow developers to ship smaller app bundles by downloading assets on-demand instead of pre-shipping them. With CocoaPods 1.11, pod authors may now specify a set of resources to be integrated as on demand resources for a given application. Here's an example podspec that uses the new on_demand_resources DSL: CocoaPods 1.11 raises the minimum Ruby version to 2.6 while adding support for Ruby 3.0. It also adds support for 'On Demand Resources' and contains numerous bug fixes and improvements! Ruby 2.6 and Ruby 3.0 With the release of 1.11, the minimum version of Ruby required to run CocoaPods is now 2.6. By doing so, we were also able to bump a few other dependencies (such as ActiveSupport and Addressable) that were often colliding with other setups. We hope this unblocks developers and makes CocoaPods a bit more flexible. Ruby 3.0 is also now supported and is part of CocoaPods CI going forward! This will ensure new changes and fixes are always tested and verified against Ruby 3.0 before they are merged. On Demand Resources In a nutshell, On Demand Resources allow developers to ship smaller app bundles by downloading assets on-demand instead of pre-shipping them. With CocoaPods 1.11, pod authors may now specify a set of resources to be integrated as on demand resources for a given application. Here's an example podspec that uses the new on_demand_resources DSL:"
