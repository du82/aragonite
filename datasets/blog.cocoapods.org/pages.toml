["https://blog.cocoapods.org/CocoaPods-1.9.0-beta"]
title = "CocoaPods 1.9 Beta has arrived! - CocoaPods Blog"
description = "The blog for CocoaPods.org the Cocoa Dependency Manager"
full_description = "Eric Amorde 16 December 2019 Follow @_amorde CocoaPods 1.9 adds support for XCFrameworks, configuration-based dependencies for pod authors, code coverage in generated schemes, and other enhancements and bug fixes! This release includes several quality-of-life enhancements in addition to important bug fixes. XCFramework Support With the release of Xcode 11, Apple introduced a new bundle format using the .xcframework file extension. This format allows multiple copies of a framework compiled for different architectures and platforms to be combined into a single structure. XCFrameworks are also required for binary dependencies to support the new Catalyst platform introduced in macOS Catalina. This release introduces support for Pod authors to ship vendored XCFrameworks using the existing vendored_framework DSL. Example: CocoaPods 1.9 adds support for XCFrameworks, configuration-based dependencies for pod authors, code coverage in generated schemes, and other enhancements and bug fixes! This release includes several quality-of-life enhancements in addition to important bug fixes. XCFramework Support With the release of Xcode 11, Apple introduced a new bundle format using the .xcframework file extension. This format allows multiple copies of a framework compiled for different architectures and platforms to be combined into a single structure. XCFrameworks are also required for binary dependencies to support the new Catalyst platform introduced in macOS Catalina. This release introduces support for Pod authors to ship vendored XCFrameworks using the existing vendored_framework DSL. Example: Pod::Spec.new do |s| s.name = 'ToastLib' s.version = '1.0.0' # ...rest of attributes here s.vendored_frameworks = 'ButterLib.xcframework' end Pod::Spec.new do |s| s.name = 'ToastLib' s.version = '1.0.0' # ...rest of attributes here s.vendored_frameworks = 'ButterLib.xcframework' end For apps that include Pods which vendor dynamic frameworks, a new script phase with the name [CP] Prepare Artifacts will be added to the project to facilitate including the .xcframework into the app bundle. For additional details on how to create an XCFramework, check out Apple's WWDC talk Binary Frameworks in Swift which introduced the format. Configuration-based dependencies for Podspecs CocoaPods has long supported excluding dependencies from configurations in which they are not needed. For example, debug-only dependencies used during development can be included using the :configurations option on the pod Podfile DSL:"
