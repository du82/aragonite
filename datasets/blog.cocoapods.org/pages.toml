title = "Running SSH Commands via Rakefiles - CocoaPods Blog"
description = "The blog for CocoaPods.org the Cocoa Dependency Manager"
full_description = "Orta Therox 26 August 2015 Follow @orta TL;DR: CocoaDocs' commands which used to be executed via logging in are now done via rake commands. CocoaDocs runs a lot of CocoaPods' infrastructure. It is the workhorse that allows us to provide rendered READMEs/CHANGELOGs, QIs and status updates. I have been manually sshing in to the server to execute commands for a few years, and it's a bit of a chore. Over time though, I became used to this. As more people were starting to help out in maintaining CocoaDocs, it became obvious that it needed to change from being dark arcane knowledge to easy -discoverable- commands. Show me the code: c7be695...a00338d. I initially explored the idea of using Mina to let us treat CocoaDocs like we do with heroku. I spent a few hours setting it up, but never managed to get a single working prototype. Eventually I started looking for alternatives. I found net-ssh, which is a pleasant reminder of how old the ruby community is, given that docs are from 2004. I used it to connect to the server in a tiny amount of code: TL;DR: CocoaDocs' commands which used to be executed via logging in are now done via rake commands. CocoaDocs runs a lot of CocoaPods' infrastructure. It is the workhorse that allows us to provide rendered READMEs/CHANGELOGs, QIs and status updates. I have been manually sshing in to the server to execute commands for a few years, and it's a bit of a chore. Over time though, I became used to this. As more people were starting to help out in maintaining CocoaDocs, it became obvious that it needed to change from being dark arcane knowledge to easy -discoverable- commands. Show me the code: c7be695...a00338d. I initially explored the idea of using Mina to let us treat CocoaDocs like we do with heroku. I spent a few hours setting it up, but never managed to get a single working prototype. Eventually I started looking for alternatives. I found net-ssh, which is a pleasant reminder of how old the ruby community is, given that docs are from 2004. I used it to connect to the server in a tiny amount of code:"
