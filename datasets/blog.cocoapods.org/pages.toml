["https://blog.cocoapods.org/CocoaPods-1.6.0-beta"]
title = "CocoaPods 1.6.0 Beta Begins! - CocoaPods Blog"
description = "The blog for CocoaPods.org the Cocoa Dependency Manager"
full_description = "Dimitris Koutsogiorgas 16 August 2018 Follow @dnkoutso CocoaPods 1.6.0 release continues our focus on stability, performance and scalability for large projects. We are happy to announce that the first beta of 1.6.0 is now available! In this release, we revamped the build settings generation process to be faster and easier to maintain going forward. We've also enhanced the integration of multiple test specs in the same pod. Revamped Build Settings The generation of build settings (which reside within the .xcconfig files CocoaPods generates) has been completely rewritten. The primary goal for this rewrite was to clean up the code and make it scale much better on large projects. When contributors to CocoaPods make build setting changes it would often cause a cascading amount of performance regressions and trigger an unusual combination of edge cases. This made it very hard to test these changes and verify that each fix works correctly for everyone. From a user point of view, this rewrite should have zero effects when you compile your code. If there is anything that does not look right please file an issue providing steps and include a sample app that demonstrates the problem. To demonstrate the results of this rewrite we worked closely with our friends at LinkedIn, who use CocoaPods on a large project. The rewrite, along with some other performance improvements, have decreased pod install time down to approximately 40 seconds from the original time of 3 minutes or 77% faster. This change, while mostly invisible, helps guarantee that CocoaPods will scale with your app as it grows. We really want to thank the folks at LinkedIn for their contributions to CocoaPods as well as their time spent to improve this. Enhanced Test Spec Integration Test specs are becoming a fundamental piece of CocoaPods for pod authors. The ability to specify your test sources and have them execute through lint make this feature an invaluable tool and allow to make the podspec file be the source of truth for your library. Starting with 1.6.0, multiple test_spec entries will no longer generate a single test bundle target but instead generate a unit test bundle for each one. Let's use the following as an example:"
