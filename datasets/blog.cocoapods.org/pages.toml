["https://blog.cocoapods.org/Beta"]
title = "CocoaPods Beta - CocoaPods Blog"
description = "The blog for CocoaPods.org the Cocoa Dependency Manager"
full_description = "Orta Therox 24 November 2013 Follow @orta TL;DR: CocoaPods just got a facelift. Interested in finding the CocoaPods Logo? Check out our Media Pack. I believe design is important. CocoaPods is probably the most public facing Objective-C project. Applying design to open source projects is a sign of maturity, and of stability. Whilst we're still not 1.0 yet, having a cohesive brand is a step towards that. This post documents some of the work involved in making the new CocoaPods web properties. The CocoaPods devs welcomed me with open arms after I started regularly contributing via the Specs repo, and encouraged by their work I started a project called CocoaDocs. Once it became quite obvious that CocoaDocs was going to be an important part of the CocoaPods ecosystem I branded it with the CocoaPods styling, and it was treated as a sister project. Around the same time we were seeing issues with documentation, it was user contributed and spread out among the cocoapods website and a collection of wikis, so Michele Titolo & I started to mock out the guides structure and Michele started collating documents and creating a single source for the markdown files. Andy and I went back and forth on logos for a few months until we came up with the version shown in the top left and in this blog post announcing the new blog. Andy (quite correctly) believed that we couldn't just announce a logo without showing it in context, that meant re-thinking the homepage. I spent some time with Florian Hanke digging into the site analytics to try and get an understanding how people were using the current website. Turns out everyone is using it to search for Pods. Who'd have thought? So that gave us a direction for what the site should orient itself towards. We knew that search should be a high priority, and that a lot of the documentation should move into a guide leaving a lot more breathing space in the homepage. The new design was worked on in secret until we felt there was enough context around the branding. You can't re-think something this big in a weekend, and showing incremental work isn't always the best option when you are making drastic moves. Luckily Eloy Durán & Fabio Pelosin trusted that we knew what we were doing when I said that the old CocoaPod illustration will have to go. With buy-in from the rest of the team, and some helpful tips we all discussed the scope of the changes. We'd have to break the current website into 3 separate projects, sharing assets, design and code as much as possible. This meant we could incrementally build the sites as staticly generated content and upload it to github. It was an easy sell that we needed a blog, and it was an easy sell that we should split out the CocoaPods twitter into one specifically for new Pods. The blog meant we could wax lyrical about new releases, keep people up to date and have a sense of permenance in the CocoaPods team voice. Keith Smiley started building the blog the moment it had some mockups. Setting up a shared repo for all our assets and design notes. Fabio & I announced the redesign at NSSpain. We had stickers. It went well."
