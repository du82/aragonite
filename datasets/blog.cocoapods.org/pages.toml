["https://blog.cocoapods.org/Pod-Lib-Create"]
title = "pod lib create v2 - CocoaPods Blog"
description = "The blog for CocoaPods.org the Cocoa Dependency Manager"
full_description = "Orta Therox 26 June 2014 Follow @orta pod lib create has been our way of trying to encourage standards, and to make it easy to create a new library. Before today it would leave a lot of setup at the developer's discretion. The new version automates a lot of common problems away and starts you with a new library structure. Read on for details. Or just go straight to the Using Pod Lib Create guide. Rather than explain what it does, which the guide does a better job of, I want to show the end result: You can edit your Podspec metadata, like the README and Library Podspec in Xcode. There is an automatically generated project with your own Prefix settings. Extremely easy to start writing library tests, we include stubs for Specta/Expecta and Kiwi. Your library is set up as a Development Pod. We include some useful Pods for bootstrapping your project. This update is available today because of how Fabio built templates to allow for custom repos, and it definitely accepts pull requests and issues. pod lib create has been our way of trying to encourage standards, and to make it easy to create a new library. Before today it would leave a lot of setup at the developer's discretion. The new version automates a lot of common problems away and starts you with a new library structure. Read on for details. Or just go straight to the Using Pod Lib Create guide. Rather than explain what it does, which the guide does a better job of, I want to show the end result: You can edit your Podspec metadata, like the README and Library Podspec in Xcode. There is an automatically generated project with your own Prefix settings. Extremely easy to start writing library tests, we include stubs for Specta/Expecta and Kiwi. Your library is set up as a Development Pod. We include some useful Pods for bootstrapping your project. This update is available today because of how Fabio built templates to allow for custom repos, and it definitely accepts pull requests and issues. CocoaPods is a project from Dimitris Koutsogiorgas, Danielle Lancashire, Eric Amorde, Igor Makarov, Orta Therox, Paul Beusterien, Samuel Giddins, and The CocoaPods Dev Team with contributions from many, many others.Lovingly sponsored byArtsy, Button, Capital One, CircleCI, Discontinuity, Emerge Tools, Fingertips, Google, Heroku, jsDelivr, Realm, PSPDFKit, RubyMotion, Sauspiel, Slack, SoundCloud, Stripe, Square, and Technology Astronauts."
