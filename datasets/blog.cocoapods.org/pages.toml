title = "CocoaPods AltLabs - San Francisco - 5th June 2014 - CocoaPods Blog"
description = "The blog for CocoaPods.org the Cocoa Dependency Manager"
full_description = '''Kyle Fuller 23 May 2014 Follow @kylefuller It's been a busy week, with the introduction of Trunk and CocoaPods 0.33. We're delighted to announce another event in San Francisco, this time it's AltLabs, a labs session dedicated to CocoaPods. Special thanks goes to AltConf for hosting the session. The labs session will give you a perfect opportunity to come along and meet some of the team behind CocoaPods. We will be able to assist you on any issues you have with CocoaPods along with migrating your pods to the brand new trunk system. Our session will also allow you to get help setting up a development environment and making your first contribution to CocoaPods. Since we have a lot going on during WWDC, I'm going to take this opportunity to give you a quick reminder of all the events we are hosting so you don't miss out: Cocoa Kucha 4 (28th May 2014) The CocoaPodsAlt State of the Union (2nd June 2014) CocoaPods Labs (5th June 2014, 9am - noon) The session will be hosted at Jillian's which is right across the street from both AltConf and Moscone West. So you have absolutely no excuse not to pop over if you are in San Francisco for either events. Join our meetup group and RSVP online. Code of Conduct !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0];if(!d.getElementById(id)){js=d.createElement(s); js.id=id;js.async=true;js.src="https://secure.meetup.com/script/21021123101537681383/api/mu.btns.js?id=a74a4o9ar6ca0btqqmtk1k5uv2";fjs.parentNode.insertBefore(js,fjs);}}(document,"script","mu-bootjs"); It's been a busy week, with the introduction of Trunk and CocoaPods 0.33. We're delighted to announce another event in San Francisco, this time it's AltLabs, a labs session dedicated to CocoaPods. Special thanks goes to AltConf for hosting the session. The labs session will give you a perfect opportunity to come along and meet some of the team behind CocoaPods. We will be able to assist you on any issues you have with CocoaPods along with migrating yo