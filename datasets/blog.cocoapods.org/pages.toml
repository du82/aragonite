title = "CocoaPods 1.8 Beta is Here! - CocoaPods Blog"
description = "The blog for CocoaPods.org the Cocoa Dependency Manager"
full_description = "Dimitris Koutsogiorgas 5 August 2019 Follow @dnkoutso CocoaPods 1.8 switches the CDN as the default spec repo source and comes with a few enhancements! CDN as Default CDN support was first introduced in the 1.7 release and was finalized in 1.7.2. It aims to speed up initial setup and dependency analysis dramatically. With 1.8, CocoaPods no longer requires cloning the now huge master specs repo in order to function and users may integrate their projects with CocoaPods almost instantly. Here's video demonstration of integrating and building an iOS project with a fresh install of CocoaPods 1.8 in less than a minute: You may safely delete the master specs repo with the following steps: First, edit your Podfile to set the CDN as the primary source: CocoaPods 1.8 switches the CDN as the default spec repo source and comes with a few enhancements! CDN as Default CDN support was first introduced in the 1.7 release and was finalized in 1.7.2. It aims to speed up initial setup and dependency analysis dramatically. With 1.8, CocoaPods no longer requires cloning the now huge master specs repo in order to function and users may integrate their projects with CocoaPods almost instantly. Here's video demonstration of integrating and building an iOS project with a fresh install of CocoaPods 1.8 in less than a minute: You may safely delete the master specs repo with the following steps: First, edit your Podfile to set the CDN as the primary source: Note: If you wish to continue using the git based source then you must ensure it is explicitly specified in your Podfile via the source DSL, otherwise CocoaPods will automatically use CDN for dependency resolution. And that's it! For more information regarding CDN, please read our previous blog post here! info_plist Podspec DSL CocoaPods automatically generates Info.plist files for pods, app specs and test specs when appropriate, such as when a Podfile requires dynamic frameworks by specifying the use_frameworks! option. Podspecs now support modifying the contents of their generated Info.plist files via the info_plist DSL. While we anticipate this will be most often used to modify the bundle identifier of a framework, any key-value pair can be included. The values specified will overwrite any default values that are included by CocoaPods. Here's an example:"
