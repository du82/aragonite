["https://blog.cocoapods.org/CocoaPods-WWDC-Party"]
title = "CocoaPods 3rd WWDC Meetup: 2nd June 2014 - CocoaPods Blog"
description = "The blog for CocoaPods.org the Cocoa Dependency Manager"
full_description = '''Orta Therox 21 April 2014 Follow @orta Apple have their developers state of the union address. We have ours. We're working with the Alt Conference to have a great opening event to the WWDC week: The CocoaPodsAlt State of the Union. You should come along. CocoaPods is a dependency manager for Objective-C, it makes it very easy for people to use open source code or to share code between multiple apps elegantly. It's become an annual tradition now for CocoaPods to host an event at WWDC, we want to make this another great one. There will be a keynote by Orta Therox with both Eloy Durán and Fabio Pelosin skyping in to assist. We will go through some of the large changes that are happening behind the scenes in CocoaPods, show-off some new things and talk about future plans. We will also have a large contingent of the CocoaPods dev team giving some talks on some of the work they've been doing around the community: Boris Bügling - On learning Ruby by contributing to CocoaPods. Marin Usalj Michele Titolo - On Private Pods Kyle Fuller - Creating your first Pod We were planning on hosting it at 7:00pm and should be over by around 10:00pm, this should give everyone chance to then move on to some of the late night parties that will be happening around San Francisco. The meetup will be hosted at the Twilio offices, who are just a short walk away from the Moscone Center. They will be graciously providing both food & beer. Join our meetup group and RSVP online. Code of Conduct !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0];if(!d.getElementById(id)){js=d.createElement(s); js.id=id;js.async=true;js.src="https://secure.meetup.com/script/21021123101537681383/api/mu.btns.js?id=a74a4o9ar6ca0btqqmtk1k5uv2";fjs.parentNode.insertBefore(js,fjs);}}(document,"script","mu-bootjs"); Apple have their developers state of the union address. We have ours. We're working with the Alt Conference to have a great opening event to the WWDC week: The CocoaPodsAlt State of t