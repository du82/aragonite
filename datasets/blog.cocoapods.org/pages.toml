full_description = '''Orta Therox 7 November 2013 Follow @orta TL;DR: New library notifications have moved from the @CocoaPods twitter to the @CocoaPodsFeed twitter account If you want to follow the new libraries on CocoaPods, Follow @CocoaPodsFeed In thinking about ways that CocoaPods can communicate news, updates and ideas one of the first things that came out in discussion was "Let's make the Twitter more relevant." Right now if you want to keep up to date with CocoaPods you also end up keeping up to date with every new library on the platform. This can be too much sometimes, especially for people who don't follow hundreds of people. To deal with this effectively we've moved out notifications on to a separate twitter account allowing the CocoaPods twitter feed to become a relatively low-chaff high information yield source for those interested in keeping up on Objective-C Open Source. TL;DR: New library notifications have moved from the @CocoaPods twitter to the @CocoaPodsFeed twitter account If you want to follow the new libraries on CocoaPods, Follow @CocoaPodsFeed In thinking about ways that CocoaPods can communicate news, updates and ideas one of the first things that came out in discussion was "Let's make the Twitter more relevant." Right now if you want to keep up to date with CocoaPods you also end up keeping up to date with every new library on the platform. This can be too much sometimes, especially for people who don't follow hundreds of people. To deal with this effectively we've moved out notifications on to a separate twitter account allowing the CocoaPods twitter feed to become a relatively low-chaff high information yield source for those interested in keeping up on Objective-C Open Source. CocoaPods is a project from Dimitris Koutsogiorgas, Danielle Lancashire, Eric Amorde, Igor Makarov, Orta Therox, Paul Beusterien, Samuel Giddins, and The CocoaPods Dev Team with contributions from many, many others.Lovingly sponsored byArtsy, Button, Capital One,