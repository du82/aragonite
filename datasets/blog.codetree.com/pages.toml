["https://blog.codetree.com/articles/a-framework-for-picking-and-funding-your-business-idea.html"]
title = "A framework for picking and funding your business idea"
description = "Picking your idea and funding your business are key problems for every entrepreneur. Here's a framework to help you get those decisions right."
full_description = '''This is part two in a three-part series. Part one was about how we defined success for our new, creatively-titled venture "Next Biz". This post is about how we evaluated the different paths to maximize our chances of success. Part three covers the details of buying Codetree. The first step was to define what success looked like for us. The next step was to figure out the path that would give us the highest chance of getting there. We’ve built four successful SaaS businesses, and consulted with companies that have done $100M+ in revenue. We have the battle scars and seen them on others. Based on these mistakes and wins, we built a set criteria to evaluate opportunities. We broke these criteria down into the "must haves" and the "very nice to haves". Does the product solve a hair on fire problem ("I'm a sales person and need a CRM to track my deals")? Or is a must-have ("I need to process credit cards online")? Or core to business ("I need a member management system to run my gym")? Are we selling something where the customer’s thought process is "which [blank] are we going to buy" rather than "do we need to buy [blank]"? Sequoia invests in large markets because your upside is not capped by a small number of potential customers. Large markets also have lots of niches to serve - especially important for bootstrappers. It’s much easier to e.g. make a list of your potential customers and call them up (e.g. "a tool for VPs of HR") rather than a horizontal tool where “anybody is your customer”. Can we imagine yourself doing this for 10 years and enjoying it? We’re in this for the long haul so let’s enjoy the ride. CRUD apps are preferable to businesses that scale with humans, or that have lots of software complexity. If you’re running Heroku and it goes down, your customers bloody hate you because they’re losing money. If you’re running a help desk and it goes down, it’s an all-hands on deck emergency. It's only marginally less stressful than if you’re running Heroku. But that margin lets us sleep better at night.'''
year_published = 2025
