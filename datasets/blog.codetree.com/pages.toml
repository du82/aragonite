["https://blog.codetree.com/articles/the-important-differences-between-github-projects-and-codetree.html"]
title = "The Important Differences between GitHub Projects and Codetree"
description = "Here are the key differences between Codetree and GitHub Project's Kanban boards."
full_description = '''Click here if you want to skip to a table that summarizes the key differences between Codetree and GitHub Projects. GHP lets you create multiple Kanban-style boards within a repository. Each board can have custom stages. It’s a very lightweight Kanban tool, like GitHub Issues is a lightweight issue tracking tool. It is very Trello-esque: a card can be an issue or a note (more on notes below), and cards can be dragged and dropped from column-to-column. They’re Kanban boards. We’ll cover how to create a board, and then talk about three wrinkles that you might not expect: A GHP lives within a repo. Which means you can only add issues from a repo to a board that lives in the same repo. In other words, if you need to see a rolled-up view of issues across multiple repos, GitHub Projects won’t work for you. You can create as many Kanban boards as you want within a repo. Each board contains a combination of a subset of issues in the repo, and a new construct called a "note". We'll cover both. If you’re trying to use a board to manage your entire project, you’ll probably be frustrated at having to add every issue to your board manually. GHP introduces the concept of "notes". Notes are simply plaintext snippets that you add to a board. They can be easily converted to a full-fledged Issue. An issue can belong to multiple boards at once. You can see what stage and board(s) an issue belongs to on the Issue page: GHPs are simply a way to group together a set of related issues and to visualize them. One way you may want to group issues together is if those issues are children of a larger feature. You can use a board to track the N features that need to be finished to deliver some larger feature. You could create a board for each milestone and see the work remaining before closing that milestone, what stage it’s in, and who it’s assigned to. First, Codetree will show you all your issues from as many repos as you want rolled up into a single Kanban board. GitHub Projects can only show you a Kanban board that contains a subset of issues from a single repo.'''
year_published = 2025
