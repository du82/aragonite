["https://blog.codetree.com/articles/using-dependencies-to-understand-the-state-of-your-in-flight-features.html"]
title = "Using dependencies to understand the state of your in-flight features"
description = "How we use dependencies at Codetree to augment GitHub issues and manage our software projects effectively."
full_description = '''You can use dependencies to answer several helpful questions about the state of your epics and features during planning and delivery. In this article we'll first give you some context on our workflow so the rest of the article makes sense. Then we'll cover how we use dependencies when structuring our relationships between epics, features, and tasks (we call them "work items"). And finally we'll describe key questions you have about planning and delivering your features and how using dependencies can help you answer them. To make sense of this article it's key that you have a sense of the workflow we use to deliver features. We could be a lot more granular with our workflow (for example, splitting resolved into UAT, code review, and ready for deploy stages). But our small team prefers pragmatism over dogma, so we do what works until it doesn't and then reevaluate. To understand how we use dependencies, it's necessary to understand how we break a feature up into atomic units that can be coded. Here's our breakdown. The feature's Product Manager breaks the Epic down into smaller "feature issues" of deliverable customer value. Each feature is needed-by the parent Epic issue (to create a dependency in Codetree you type needed-by #123 or needs #456, where 123 and 456 are issue numbers. More on creating dependencies here.) Looking at an Epic's dependencies is useful because it'll tell you what's been delivered and what's still left to work on. The Dev assigned to each feature will either use a checklist or break the feature down into smaller "work item" issues. If the latter, each work item is "needed-by" the feature. If you use work items, the dependencies table helps you understand what needs to be completed before the feature is ready for acceptance testing. We usually use checklists as they're lighter weight, but there are certainly more complicated work items that justify having their own issue. Other than specifying relationships between issues when we create epics, features, and work items, there's one place in our workflow where creating dependencies helps us understand what's going on with our project: in acceptance testing.'''
year_published = 2025
