["https://blog.codetree.com/articles/how-to-avoid-building-a-company-youll-hate.html"]
title = "How to avoid building a company that you'll hate"
description = "How do you know if the business you're running will help you live a happy life?  Read about the framework we used to define success for our venture here."
full_description = '''This is the first in a three-part series. In this post, we'll talk about how we defined success for "Project Next Biz". We'll also share the framework and exercise we used to figure that out. Part two is about how we evaluated the different paths we could take to maximize our chances of success. We'll share the framework we used to choose an opportunity to work on for the 7-10 years it takes for a SaaS business to hit its stride. We'll also talk about how we arrived at our ideal financing approach. Hint: venture-backed isn't the only road. A little about us before we jump in. We're three business-minded software devs with 45 combined years of professional experience building software. We've started, run, folded and sold several SaaS businesses. We've done venture backed and bootstrapped startups. We've worked at companies like Microsoft, ESPN, and MySpace. We've worked together before and we wanted to work together again. We're big fans of Warren Buffett's business partner Charlie Munger. Charlie is big on avoiding mistakes and our past ventures had given us a long list of mistakes to avoid. One mistake we'd made is that we'd never defined success when starting previous companies. We'd skipped this step and headed right to the problem/solution and financing approach. Munger talks about the concept of "inverting". He borrowed the idea from German algebraist Carl Gustav Jacob Jacobi, who said "Invert, always invert." In a 1986 speech Munger said: "It is in the nature of things, as Jacobi knew, that many hard problems are best solved only when they are addressed backwards." In other words, begin with the end in mind. If you don't know where you're going, you'll end up in the wrong place by definition. (click to tweet) One exercise we did to figure out where we wanted to be was to write down what a day in our lives looked like when Next Biz was successful. We answered things like: Each of us did this independently and talked through our answers with each other. We drew on our own previous founder experiences, conversations with other founders, and things we'd read to paint a picture of what an ideal day looked like.'''
