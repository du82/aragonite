["https://blog.cr.yp.to/20160607-dueprocess.html"]
title = """
cr.yp.to: 
2016.06.07: The death of due process"""
full_description = '''Suppose someone is accused of rape, or some other horrifying crime. If the accusation is true then the perpetrator should go to jail. If the accusation is false then the source of this false accusation should pay for this slander. Clearly someone has broken the law. A lynch mob forms to punish the alleged rapist by whatever means possible. A second lynch mob forms to punish the accuser, the alleged slanderer, again by whatever means possible. These mobs are full of angry people who want to be judges and juries and executioners. The members of the first lynch mob dismiss the possibility that the accusation is false. The members of the second lynch mob dismiss the possibility that the accusation is true. Evidently many of these people are wrong: accidentally or maliciously deceived. At the same time all of these people are convinced that they know who deserves punishment. Is it really so hard to recognize both of these directions of error? If I prejudge and punish alleged culprits who have not had their day in court, then I will inevitably punish some innocent people: the unfortunate reality is that many accusations of crimes are false. If I prejudge and punish accusers who have not had their day in court, then I will inevitably punish some innocent people: the unfortunate reality is that many accusations of crimes are true. When I say "day in court", what I really mean is due process. Due process is a set of ethical principles that civilization has painstakingly developed over several centuries, recognizing that punishment is corrupted by many sources of error on both sides: communication is poor; memories are faulty; sometimes people don't tell the whole truth; sometimes people tell something other than the truth. I won't try to summarize all of the principles of due process [2022.01.09 update: updated link to use HTTPS], but here are some of the most fundamental, well-established principles: These principles are followed by criminal courts (where, as an extra protection, defendants are presumed innocent unless and until proven guilty); by civil courts (where the winner is whichever side has the strongest overall evidence); by arbitrators; etc.'''
year_published = 2025
clearnet = "https://blog.cr.yp.to/20160607-dueprocess.html"
