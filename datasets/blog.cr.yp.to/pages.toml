["https://blog.cr.yp.to/20240803-clang.html"]
title = """
cr.yp.to: 
2024.08.03: Clang vs. Clang"""
full_description = '''Compiler "optimizations". Try skimming through recent changes to LLVM and GCC. You'll find "optimizations", and tests for "optimizations", and fixes to tests for "optimizations", and fixes to bugs in "optimizations". The bugs admitted in the compiler changelogs are just the tip of the iceberg. Whenever possible, compiler writers refuse to take responsibility for the bugs they introduced, even though the compiled code worked fine before the "optimizations". [2024.08.03 edit: Added more links here.] The excuse for not taking responsibility is that there are "language standards" saying that these bugs should be blamed on millions of programmers writing code that bumps into "undefined behavior", rather than being blamed on the much smaller group of compiler writers subsequently changing how this code behaves. These "language standards" are written by the compiler writers. Evidently the compiler writers find it more important to continue developing "optimizations" than to have computer systems functioning as expected. Developing "optimizations" seems to be a very large part of what compiler writers are paid to do. I'm putting "optimizations" in quotes because compiler "optimizations" are generally nowhere near the performance that competent programmers can achieve. As a cryptographic example, benchmarks across many CPUs show that the avx2 implementation of kyber768 is about 4 times faster than portable code compiled with an "optimizing" compiler. There are many more examples like this. Compiler writers measure an "optimization" as successful if they can find any example where the "optimization" saves time. Does this matter for the overall user experience? The typical debate runs as follows: In 2000, Todd A. Proebsting introduced "Proebsting's Law: Compiler Advances Double Computing Power Every 18 Years" (emphasis in original) and concluded that "compiler optimization work makes only marginal contributions". Proebsting commented later that "The law probably would have gone unnoticed had it not been for the protests by those receiving funds to do compiler optimization research."'''
