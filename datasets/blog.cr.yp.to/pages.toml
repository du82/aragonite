["https://blog.cr.yp.to/20170719-pqbench.html"]
title = """
cr.yp.to: 
2017.07.19: Benchmarking post-quantum cryptography"""
full_description = '''SUPERCOP, the System for Unified Performance Evaluation Related to Cryptographic Operations and Primitives, is an open benchmarking package that measures (currently) 2202 implementations of 602 cryptographic primitives. For example, the crypto_hash/sha256 directory in SUPERCOP contains five implementations of the standard SHA-256 hash function: crypto_hash/sha256/ref (a reference implementation designed to be easy to read), crypto_hash/sha256/cryptopp (a fast C++ implementation using the Crypto++ library), crypto_hash/sha256/openssl, crypto_hash/sha256/sphlib, and crypto_hash/sha256/sphlib-small. Each computer automatically selects the fastest SHA-256 implementation for the final speed reports, the same way that a user prioritizing performance will select the fastest implementation. Including a slow implementation in the benchmarks doesn't cause any harm, except for a slight waste of benchmarking time. There are nearly 300 people listed in "designers" files in primitives included in SUPERCOP, and nearly 150 people listed in "implementors" files in implementations; see, e.g., the online list of hash functions and implementations. Code is sometimes shared between implementations of primitives in the same family (for example, crypto_stream/chacha12 is almost identical to crypto_stream/chacha20), but there are a huge number of different families. One of the main reasons that we've successfully reached this scale is that we've made it very easy to add new primitives and new implementations to SUPERCOP. To add, e.g., a new hash function, you implement just one C function: Most cryptographic operations are more complicated than hashing, but the SUPERCOP interface consistently keeps the fuss to a minimum. Signatures, for example, use exactly three functions. First, uses a secret key sk to sign a message m containing mlen bytes, creating a signed message sm containing *smlen bytes (and again returns 0). Third, uses a public key pk to verify a signed message sm, creating a verified message m (and returns 0, or −1 if verification failed). Finally, there's a file api.h containing, e.g.,'''
