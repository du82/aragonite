["https://blog.cr.yp.to/20201206-msword.html"]
title = """
cr.yp.to: 
2020.12.06: Optimizing for the wrong metric, part 1: Microsoft Word"""
full_description = '''The boss needed item 3 inserted into a numbered list of hundreds of items. The intern used a mouse to select the original 3 on the screen, then typed 4, then selected the original 4, then typed 5, then scrolled down, then selected the original 5, then typed 6, and so on. Another intern sat watching the screen to make sure there were no mistakes. I happened to be in the room for other reasons. I remember the horror of watching the beginning of this barbaric editing process. Those poor interns! Each asterisk is a special command to the computer, telling the computer to automatically display the next number for the reader. The reader eventually sees but that isn't what I typed. This small difference produces a tremendous savings of time whenever I insert an item, or delete an item, or move an item. If I decide later to skip the numbers and use bullets instead, I tell the computer to introduce each list item with a bullet. This is one command covering the whole list. There's also a command that does the same thing for the whole document. There isn't separate work for each item. It's no problem if a coauthor later wants to change bullets back to numbers. The interns, I suppose, would be manually changing "1." and "2." and "3." and so on to "•" and "•" and "•" and so on. Or maybe they would be trying to figure out how some search-and-replace feature could do the same thing; let's hope the document doesn't have a sentence somewhere that talks about something that happened in the year 2001. Or maybe the interns would be quitting and finding a better job. [Note added 2020.12.07: I was expecting that many of my readers would already be accustomed to relying on the computer for automatic numbering. I was surprised, however, to see some comments along the lines of "Inconceivable!" from readers unable to imagine how the interns could have been in a different situation, going through such a shockingly inefficient revision process. Here's a hint: Each item in the list looked like a flush-left paragraph, like the paragraphs in this blog post, adjacent to the left margin. The text being selected by the mouse, for example to change "3" to "4", was to the right of the margin, like the rest of the text in each item.]'''
year_published = 2025
