["https://blog.cr.yp.to/20150218-printing.html"]
title = """
cr.yp.to: 
2015.02.18: Follow-You Printing"""
full_description = '''Technische Universiteit Eindhoven removed all of its old printers earlier this year, and installed new printers featuring "Follow-You Printing". Here's the user experience printing a document with Follow-You Printing (after various one-time steps such as telling your computer how to talk to the printing system): No matter what the merits of these corner cases might be, they obviously don't justify slowing down the normal case, and people don't enjoy having their time wasted. So there were complaints, and meetings, and more complaints, and the start of an online petition for the managers to turn on the "Direct Printing" option. But the university didn't budge. A faculty member, obviously puzzled, reported that he "got essentially nowhere" in a meeting with the relevant authority: "The university is not planning on changing this. Even though it is a simple question of enabling the choice in the software—it’s not more complicated than that." I would like to think it's this simple: as Napoléon allegedly said, "N’attribuez jamais à la malveillance ce qui s’explique très bien par l’incompétence". Unfortunately, there's ample evidence of what's actually going on here, and it's not adequately explained by incompetence. The marketing. Equitrac, now owned by Nuance, advertises itself as providing "the world's most popular print management software", and in particular providing Follow-You Printing. Equitrac says that its software is "the leading pay-for-print solution for colleges, universities and school districts" and is deployed in "more than 10% of the Global 500 companies". Equitrac's online case studies include quotes from managers with serious-sounding titles: Chief Information Officer, Technology Director, Senior Systems Engineer, Program Administrator for Media Services, Finance Director, etc. Equitrac's advertising is clearly aimed at such people, telling them about "cost control" and "maximum savings" and "complete accountability" and "a reduced burden on IT" and "a smaller hit on corporate budgets".'''
