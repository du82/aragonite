["https://blog.cr.yp.to/20190430-vectorize.html"]
title = """
cr.yp.to: 
2019.04.30: An introduction to vectorization"""
full_description = '''Your CPU has a 32-bit addition instruction that computes the sum of two 32-bit integers x and y, producing a 32-bit result. (The 33rd bit of the sum, the "carry bit", is usually thrown away.) A 2-way-vectorized 32-bit addition instruction computes the sum of two vectors (x0,x1) and (y0,y1), where x0,x1,y0,y1 are 32-bit integers. This means that the CPU computes the sum of x0 and y0, and also computes the sum of x1 and y1. A 4-way-vectorized 32-bit addition instruction computes the sum of two 32-bit integers x0 and y0; the sum of two 32-bit integers x1 and y1; the sum of two 32-bit integers x2 and y2; and the sum of two 32-bit integers x3 and y3. Why should a CPU designer bother providing a vectorized addition instruction? Why doesn't the programmer simply use one 32-bit addition instruction to add x0 and y0, another 32-bit addition instruction to add x1 and y1, et cetera? To understand the answer, let's take a closer look at how the CPU handles a non-vectorized 32-bit addition instruction: These five stages involve tremendous overhead beyond the addition. Typically there are even more stages: for example, an early stage that inserts the instruction into an array of instructions ready to be executed, and a late stage that "retires" the completed instruction, removing it from this array. It's not surprising for an Intel CPU to have 15 or more stages overall. (Readers interested in learning more about the Intel pipeline should study Agner Fog's optimization manuals.) Students in algorithms courses are usually trained to count arithmetic operations and to ignore the cost of memory access. Does the overhead of handling an instruction really matter compared to the cost of arithmetic? To see that the answer is yes, let's scale up to a much more expensive arithmetic instruction, namely a 64-bit floating-point multiplication. An Intel presentation in 2015 reported that a 64-bit floating-point multiplication costs 6.4 picojoules (at 22nm, scaling "well with process and voltage"), that reading 64 bits from a register file costs 1.2 picojoules (scaling "less well with voltage"), that reading 64 bits from a small (8KB) cache costs 4.2 picojoules, that reading 64 bits from a large (256KB) cache costs 16.7 picojoules, and that moving 64 bits through a wire 5 millimeters long costs 11.20 picojoules ("more difficult to scale down").'''
year_published = 2025
clearnet = "https://blog.cr.yp.to/20190430-vectorize.html"
