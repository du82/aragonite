["https://blog.cr.yp.to/20231023-clumping.html"]
title = '''
cr.yp.to: 
2023.10.23: Reducing "gate" counts for Kyber-512'''
full_description = '''Tung Chou and I have a new software framework called CryptAttackTester for high-assurance quantification of the costs of cryptographic attack algorithms. So far the framework includes two case studies: brute-force AES-128 key search, and, as a deeper case study, "information-set decoding" attacks against the McEliece cryptosystem. The accompanying paper also looks at other attacks, covering various old and new examples of how attack analyses have gone wrong. One of the appendices in the paper, Appendix D, chops almost 10 bits out of the "gate" count for "primal" attacks against Kyber-512. This reduction uses a technique that in this blog post I'll call "clumping". Clumping should also reduce the "gate" counts for "dual" attacks, but for this blog post it suffices to consider primal attacks. The reason I'm putting "gate" in quotes here is that this is using the concept of "gates" in the Kyber documentation. As we'll see below, this concept doesn't match what hardware designers call gates, in particular in its handling of memory access. Explain how "31-bit clumping" reduces the "gate" count for these attacks by several bits. In particular, I'll explain what the Kyber documentation says is the central bottleneck in the attacks, and what clumping does. Show that 31-bit clumping marginally increases costs when "gate" counts are replaced with a cost metric that accounts in a realistic way for the costs of memory access. This cost metric comes from the NTRU Prime documentation. Show that 31-bit clumping reduces costs by several bits according to a calculation that NIST misattributed to the NTRU Prime documentation. Here are NIST's words: "40 bits of security more than would be suggested by the RAM model ... approximately 40 bits of additional security quoted as the 'real cost of memory access' by the NTRUprime submission". In case you're thinking "Maybe NIST got the calculation right in most cases except for some mistake that somehow underestimates the cost of clumping": Show that the gap between NIST's misattributed calculation and the correct calculation comes from (1) NIST inflating the correct calculation and (2) this inflation factor being reduced by 31-bit clumping.'''
year_published = 2025
