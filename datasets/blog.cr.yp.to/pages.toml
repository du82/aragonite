["https://blog.cr.yp.to/20160315-jefferson.html"]
title = """
cr.yp.to: 
2016.03.15: Thomas Jefferson and Apple versus the FBI"""
full_description = '''When Prohibition began, anti-alcohol crusaders demanded that the St. Louis Public Library burn every book that explained "the home production of alcohol for drinks". The librarian insisted on keeping the books but agreed to hide them from the "general public". Instructions have always been a target of censorship. The censors say that it's bad, or that it might be bad, if people follow the instructions. Censorship of other types of information almost always follows this pattern: the censors say that information must be banned because of what might happen when people receive and act upon the information. However, centuries of experience have taught us that the benefits of free speech are vastly larger than the benefits of censorship. This judgment is enshrined in the First Amendment. A few well-established categories of communication are so clearly undesirable for society that they don't have First Amendment protection. For example, the First Amendment doesn't protect intentional solicitation of criminal activity: "I'll pay you $1000 to steal that car for me." The Supreme Court is careful to define these categories narrowly, so that the categories don't threaten free speech. For example, imagine someone saying "To discourage terrorism we should torture suspected terrorists and behead terrorists' families." Can the government throw the speaker in jail for advocating violence? Answer: The speaker is protected if he isn't advocating imminent lawless action. Society has time to calmly discuss, and dismiss, the speaker's bad ideas. As another example, the First Amendment usually doesn't protect false information. Contract law limits your freedom to make false promises. Fraud law limits your freedom to deceive people for profit. However, publishers would be terrified to say anything if they were exposed to libel lawsuits for innocent mistakes. That's why incorrect statements about public figures are protected by the First Amendment unless they're made with reckless disregard for the truth.'''
year_published = 2025
clearnet = "https://blog.cr.yp.to/20160315-jefferson.html"
