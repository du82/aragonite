["https://blog.cr.yp.to/20161030-pqnist.html"]
title = """
cr.yp.to: 
2016.10.30: Some challenges in post-quantum standardization"""
full_description = '''The PQCrypto 2016 conference in Fukuoka early this year featured a special NIST announcement and corresponding panel discussion. The announcement is that NIST is initiating a multiple-year standardization process for post-quantum cryptography. Later in the year, NIST released a first draft of its call for proposals, and set an initial deadline for comments. NIST is now asking for additional feedback on a few topics. The call for proposals is supposed to be finalized next month, and proposals will be due a year later. The initial comments were by email to NIST. The additional feedback is being sent to, and discussed on, the pqc-forum mailing list. The rest of this blog post is a copy of comments that I sent NIST last month regarding the first draft call. Congratulations on initiating a standardization effort for post-quantum cryptography. In general the effort sounds useful and carefully planned, and I look forward to providing whatever assistance I can. I have comments on several topics, which I have tried to sort here into decreasing order of importance. 1. Quantitatively comparing post-quantum public-key security levels is going to be a nightmare. I see only two ways that submitters a year from now can possibly be "confident that the specified security target is met or exceeded": (1) overkill; (2) overconfidence. Many users will not be satisfied with overkill, and NIST should not encourage overconfidence. For comparison, let's ignore quantum computers for a moment. Imagine asking someone to choose DSA key sizes to be confident about reaching a pre-quantum 2256 security target, the largest number in NIST's list of preselected security levels. Should be easy, right? Here are some costs in the literature for computing multiplicative-group discrete logarithms by NFS index calculus, and thus breaking DSA: All of these are exponents in an unrealistic model of computation where storage and communication are free. In a realistic model, I presume that 1.901 would go up to 1.976 by an adaptation of a factorization algorithm that I published in 2001, and 1.638 would go up to 1.704 for a batch of targets by an adaptation of my 2014 "Batch NFS" paper with Lange. I don't know what would happen to the 1.231.'''
year_published = 2025
clearnet = "https://blog.cr.yp.to/20161030-pqnist.html"
