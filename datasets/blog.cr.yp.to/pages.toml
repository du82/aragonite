["https://blog.cr.yp.to/20240612-bibkeys.html"]
title = """
cr.yp.to: 
2024.06.12: Bibliography keys"""
full_description = '''The bibliography at the end of the paper "New directions in cryptography" has 14 entries, labeled "[1]" through "[14]". The numbers "1" through "14" are examples of bibliography keys. I'll abbreviate "bibliography key" as "bibkey" or just "key". One sentence from the paper refers to what happened after "the invention of the telegraph [2, p. 191]". This refers to the bibliography entry having bibkey 2. A reader who wants to follow the citation looks at the bibliography and immediately finds "[2] D. Kahn. The Codebreakers, The Story of Secret Writing. New York: Macmillan, 1967." This is enough information for the reader to track down the book in question (although the bibliography should have had more information to help with this process, perhaps most importantly an ISBN) and to check what page 191 of the book says about this topic. This can be a fast process for readers who happen to have Kahn's book on a nearby bookshelf. Bibkeys don't have to be numeric. Almost all of my papers use numeric bibkeys, but of course this statistic is biased by my own preferences and by the norms in areas of science where I publish. Sometimes journals require other styles for bibkeys. Commonly used tools for managing bibliographies (e.g., BibTeX and BibLaTeX) support many different styles. Another paper citing the Kahn book might cite it as "[Kahn 1967]" or "[Kahn67]" or "[Kah67]" (there's a reason that the n disappears; bear with me) or "[K67]". Typesetting also varies: Nature and many other big science journals put bibkeys in superscripts; maybe the bibliography says "2." rather than "[2]"; maybe the main text says "(Kahn 1967)" rather than "[Kahn 1967]". This blog post goes through various arguments that I've seen for non-numeric bibkeys, arguments that mostly sound good at first glance but that turn out to collapse upon closer investigation. This blog post then goes through various counterarguments. The skipping-clicks argument. The central argument I've seen for having keys contain more than just a number is that this saves time for readers as follows: a reader looking at "[Kahn 1967]" will often think "Of course that's Kahn's Codebreakers book", a reader looking at "[CLRS09]" will often think "Of course that's the algorithms textbook from Cormen, Leiserson, Rivest, and Stein", etc., saving the time to click on the link or to flip through a printout of the paper.'''
year_published = 2025
clearnet = "https://blog.cr.yp.to/20240612-bibkeys.html"
