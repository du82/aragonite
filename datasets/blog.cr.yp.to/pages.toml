2016.05.16: Security fraud in Europe's "Quantum Manifesto"'''
full_description = '''"Europe plans giant billion-euro quantum technologies project," says a 21 April 2016 news story in Nature. "The European Commission has quietly announced plans to launch a €1-billion (US$1.13 billion) project to boost a raft of quantum technologies—from secure communication networks to ultra-precise gravity sensors and clocks." The relevant press release from the European Commission is actually titled "European Cloud Initiative to give Europe a global lead in the data-driven economy" and says "The Commission today presented its blueprint for cloud-based services and world-class data infrastructure to ensure science, business and public services reap benefits of big data revolution." The word "quantum" appears just twice in the press release: The word appears just once in the European Commission's accompanying "fact sheet", proposing to spend "€1 billion for a large-scale EU-wide quantum technologies flagship" as part of spending 6.7 billion Euros on a "European Cloud Initiative". It is clear that if large universal quantum computers are built then they will be much faster than conventional supercomputers for many important computations. In particular, Grover's algorithm will speed up very large "combinatorial searches" that arise in many areas of science and that consume huge amounts of computation today. The scientific literature contains ample justification for continuing to fund research into But the interesting quantum computations are not big-data computations. They are big computations on small data. The big-data computations that people carry out, and want to carry out, fundamentally involve much more input and output, exactly the weak point of quantum algorithms. Even under extremely optimistic 20-year projections of progress in building quantum computers, big-data computations cannot reasonably be expected to see a quantum speedup. No, Grover's algorithm will not let Google search the Internet more quickly. The European Commission says that its goal is to "give Europe a global lead in the data-driven economy" so that everyone reaps "benefits of big data revolution". How could they have thought that this goal justifies putting massive funding (1 billion Euros, 15% of the total European Cloud Initiative funding) into quantum computation? Here are three theories:'''
