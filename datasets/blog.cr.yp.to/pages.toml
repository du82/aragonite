["https://blog.cr.yp.to/20140411-nist.html"]
title = """
cr.yp.to: 
2014.04.11: NIST's cryptographic standardization process"""
full_description = '''NIST's cryptographic standards have been drawing objections from the cryptographic community for decades. In 2013, NIST finally understood that one of its standards had been deliberately sabotaged, and initiated a "review of its cryptographic standards development process". In February 2014, NIST released a draft report entitled "NIST cryptographic standards and guidelines development process". NIST requested comments by 18 April 2014, a week from now, by email to crypto-review@nist.gov. Today I sent NIST the comments shown below (starting "Dear Sirs"). Disclosure: I've received three grants from NIST, most recently a "Cryptographic competitions" grant. I don't think this is biasing my comments in favor of NIST, but you can decide for yourself. Two independent public studies in early 2006, one by Gjøsteen and one by Schoenmakers and Sidorenko, showed clearly and indisputably that NIST's proposed Dual EC PRNG flunked the well-established definition of PRNG security. (I'm writing "NIST's" because, at the time, NIST was failing to properly attribute Dual EC to NSA.) Shumow and Ferguson in 2007 demonstrated that whoever had generated the Dual EC constants could easily have put a back door into Dual EC. Schneier wrote an essay saying that "both NIST and the NSA have some explaining to do" and recommending "not to use Dual_EC_DRBG under any circumstances." The consensus of the public cryptographic community was the Dual EC was dead and buried, never to be seen again. Did NIST withdraw the standard? No. NIST continued to maintain and promote the standard. NIST issued 73 validation certificates for Dual EC implementations between July 2008 and March 2014. News reports in September 2013 indicated that Dual EC did in fact contain a back door generated by NSA. Presumably this back door, a 78-digit secret number, is also known to many other organizations that have penetrated NSA's internal security. AP reported in June 2013 that half a million contractors have Top Secret clearance; other reports show that NSA makes heavy use of off-the-shelf hardware and software; I could keep listing reasons to question how well NSA keeps secrets, but I don't think that this is a matter of dispute.'''
year_published = 2025
clearnet = "https://blog.cr.yp.to/20140411-nist.html"
