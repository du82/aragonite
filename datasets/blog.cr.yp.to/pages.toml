["https://blog.cr.yp.to/20250118-flight.html"]
title = """
cr.yp.to: 
2025.01.18: As expensive as a plane flight"""
full_description = '''Should you be investing time and effort in upgrading to post-quantum cryptography? You may have encountered the following arguments for minimizing the investment. The cost-is-high argument. You'll be discouraged from taking action to upgrade if you're surrounded by people saying how hard this is. For example: "Post-quantum cryptography is the biggest cybersecurity transition ever!" (If you haven't heard this sort of thing: here are some random examples.) People will often make the transition sound complicated the same way they can make anything sound complicated, namely by adding layers of bureaucracy. Here's how I summarized this in a 2023 talk to the Federal Reserve TechLab: "We'll form a committee to devise an action plan to inventory current usage of cryptography to support future assessment of the steps needed to build a best-practices playbook for meeting the performance challenges of upgrading to post-quantum cryptography, with a target date after I retire." You'll be much more motivated to upgrade if you instead hear examples of post-quantum crypto already being deployed. It can't be that difficult if it's already working for millions of users. The popular OpenSSH remote-administration tool rolled out post-quantum crypto in 2022. Google rolled out post-quantum crypto for its internal communications later the same year. Cloudflare, which hosts a considerable fraction of the Internet's web sites, reports that 33% of its connections are using post-quantum crypto as of January 2025. I'll take a moment here to advertise some of my own work with various collaborators. If you're using Linux as a sysadmin or on the desktop, try our new easy-to-install PQConnect tool, which wraps end-to-end post-quantum cryptography around unmodified applications. If you're a developer, try out the simple API for libmceliece and libntruprime. The benefits-do-not-exist argument. For the rest of this blog post, I'll focus on another way that you could be discouraged from taking action. The core benefit of upgrading is supposed to be improved security against quantum computers; but why should you bother putting any effort into that if you've heard that quantum computers simply won't work for the foreseeable future?'''
