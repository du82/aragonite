["https://blog.cr.yp.to/20230609-turboboost.html"]
title = """
cr.yp.to: 
2023.06.09: Turbo Boost"""
full_description = '''New resource page available on timing attacks, including recommendations for action to take regarding overclocking attacks such as #HertzBleed: https://timing.attacks.cr.yp.to Don't wait for the next public overclocking attack; take proactive steps to defend your data against compromise. Billy Bob Brumley and I had put that web page together, explaining how timing attacks work, how dangerous overclocking attacks are, and how to write constant-time software. In this blog post I'll use the abbreviation TAO to refer to https://timing.attacks.cr.yp.to/overclocking.html, the overclocking part of the timing-attacks page. As context, Hertzbleed had been announced a week earlier, on 14 June 2022, and had been demonstrated extracting secret keys from the official software for SIKE running on various Intel and AMD CPUs. SIKE was, at the time, a high-profile candidate for post-quantum encryption. It was one of just two candidates selected for a large-scale experiment run by Google and Cloudflare in 2019. It was backed by a "Case for SIKE" paper in 2021 advertising "A decade unscathed", and by $50000 in prize money from Microsoft for solving small SIKE challenges. The next month, SIKE was selected by NIST as one of just four post-quantum encryption schemes to continue considering for standardization, beyond NIST's initial selection of Kyber. After SIKE's security was publicly smashed, various cryptographers claimed that there had been "no attack progress for ~12 years" and that the attack was "without any warning". In fact, if you check a 2018 video of a talk to thousands of people at CCC, you'll find Tanja Lange at 48:25 saying "At this moment I think actually CSIDH has a better chance than SIKE of surviving, but who knows. Don't use it for anything yet"—evidently warning against both CSIDH and SIKE. In 2020, I tweeted that SIKE "scares me for being too new". In 2021, I disputed the "Case for SIKE" paper: "Most important dispute is regarding risk management, [Sections] 1+8. Recent advances in torsion-point attacks have killed a huge part of the SIKE parameter space, far worse than MOV vs ECDLP."'''
