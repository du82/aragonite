["https://blog.cr.yp.to/20241028-surveillance.html"]
title = """
cr.yp.to: 
2024.10.28: The sins of the 90s"""
full_description = '''Meredith Whittaker, president of the Signal Foundation, gave an interesting talk at NDSS 2024 titled "AI, Encryption, and the Sins of the 90s". I won't try to summarize everything the talk is saying: go watch the talk video yourself, or at least read through the transcript. But I'll say something here about what the "sins" part of the talk's title is referring to. The talk says that, in the 1990s, "cryptosystems were still classified as munitions and subject to strict export controls". The talk describes the "crypto wars" as "a series of legal battles, campaigns, and policy debates that played out in the US across the 1990s", resulting in "the liberalization of strong encryption in 1999", allowing people to "develop and use strong encryption without being subject to controls". Answer: the talk claims that "the legacy of the crypto wars was to trade privacy for encryption—and to usher in an age of mass corporate surveillance". Wow. That sounds bad, and surprising, definitely something worth understanding better. If cryptographic export controls had instead remained in place after 1999, how would that have improved privacy and reduced corporate surveillance? Answer: the talk claims that, without strong cryptography, "the metastatic growth of SSL-protected commerce and RSA-protected corporate databases would not have been possible". Amazon was founded in 1994. Its initial public stock offering was in 1997. Amazon was sued by Barnes & Noble in 1997, and was sued by Wal-Mart in 1998. Bezos was named Time Magazine's Person of the Year in 1999: Bezos’ vision of the online retailing universe was so complete, his Amazon.com site so elegant and appealing, that it became from Day One the point of reference for anyone who had anything to sell online. And that, it turns out, is everyone. Amazon's revenue was 15.75 million dollars in 1996, 147.79 million dollars in 1997, 609.82 million dollars in 1998, and 1.64 billion dollars in 1999. Amazon was competently executing a business plan that from the outset explicitly prioritized growth.'''
year_published = 2025
