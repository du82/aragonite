title = "d4 Caltrops: April 2020"
full_description = "d4 Caltrops Blognard? Thursday, April 30, 2020 OSE Encounter Activities - Thoul Ah, Thouls. Decided to tackle these unusual Humanoids after coming across them in a conversation this morning. Splicing together abilities from Ghouls and Trolls on a Hobgoblin template always struck me as a little strange. The Regeneration is nifty, but I always envisioned Ghoul paralysis as more psychological/fear based (highlighting a fear of mortality, which is why Elfs were immune to it). So is the Thoul’s Paralysis more like a toxin they secrete (similar to the Carcass Crawler)? They’re a strange entry for sure. Gnolls at least eventually received their “Hyena Folk” niche, but you don’t really see Thouls showing up very often after B/X and BECMI. They tend to work as another type of “Gotcha!” monster, hiding among normal Hobgoblins as a nasty surprise for your Players, but consider how well they could work seeded in a pack of ravenous Ghouls as well? That Turning attempt just won’t work on these, and while they don’t have the bite, their 2 claw is nothing to sneeze at. I tend to treat them as fairly well integrated into Hobgoblin society for the most part, sometimes preferring them more cunning/grasping than their cousins, other times more dim-witted (with the Troll-blood addling their brains). I’ve treated them as a special bloodline, blessed by the Mother Goddess of Battle, and I’ve sometimes made them a kind of scion to a more praetoran/bodyguard order within the society due to their roles as protectors of the Hobgoblin Kings. As for the actual origins, well ever notice how close the “G” and the “T” are on a QWERTY layout keyboard? It seems obvious to me that Thouls were created by the infamous Typo-mancer Etaoin Shrdlu 😊. Posted by ktrey at 2:22 PM 1 comment: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, encounters, OSE, OSE Encounters, random tables, tables Wednesday, April 29, 2020 OSE Encounter Activities - Unicorn I tend to make Unicorns exceeding difficult to stumble across in order to preserve a sense of wonder. It’s fun to have something almost mythical even in a world with Dragons and Magic, and they’re often only inferred or intimated even when they do show up in Random Encounters. It’s very rare that the average party would meet their rigorous criteria for actually deigning to reveal themselves, but they’re extremely likely to watch the party closely. until they leave the area. Peppering descriptions with that unnerving sense of being “watched” can really ratchet up the tension in Wilderness Exploration. I do make them somewhat of a MacGuffin. They can cure just about any ailment, including the ones with more Supernatural origins. They can restore XP lost to Level Drain, and potentially even Raise the Worthy Dead. This makes them the object of Quests and locating and convincing one to assist is a great source of Adventure. So, on the odd chance the Characters are fortunate enough to come across one, here are one hundred Encounter Activities that might make them more interesting than just trotting around. Posted by ktrey at 5:25 PM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, encounters, OSE, OSE Encounters, random tables, tables Tuesday, April 28, 2020 OSE Encounter Activities - Owl Bear The Owl Bear has stalked dank dungeons and dark forests of D&D since Greyhawk. I tend to support the theory that its real-world inspiration may have come from another re-purposing of yet another plastic China-saur. Based on the earliest depictions, there is a pretty strong resemblance, especially that Roslof frontispiece illustration in Keep on the Borderlands. B2 is where I would end up first pitting them against Players. After the excitement of the initial encounter, we puzzled a little bit over how something like that would work: Is it oviparous? Does it hibernate? After raiding my Birding Books, I became utterly enamored with the idea of at least some of its treasure being found in massive regurgitated, and appropriately disgusting pellets. Besting the beast is just the beginning 😊. You’ll find them more frequently in Forests than deep within a Dungeon in my games, even though they appear on the canon Dungeon Encounter Tables at Levels 4 through 7, which always struck me as strange. Still, I suppose it’s as good an opportunity as ever to improvise an alternate exit/entrance to one of these levels. Perhaps the poor thing fell into a deeper part of the dungeon from a pit above after a ceiling collapse? Providing these “short cuts” to lower levels is always useful and makes things far more dynamic than the more linear “the deeper we go, the more dangerous it is.” Here are a hundred Encounter Activities that should be tailor-able to most Owl Bear encounters: Posted by ktrey at 11:20 AM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, encounters, OSE, OSE Encounters, random tables, tables Monday, April 27, 2020 OSE Encounter Activities - Stirge The Stirge! I often like to refer to them with the more mythological Strix, but I see Stirges more often. Good terms of venery include a Scourge, a Thirst, a Clot, or a Gush. Ecologically, I make ‘em quite the grab bag. I suppose they’re technically monotremes in most of my games, they lay eggs, but nurse their young until the puggles are old enough to handle regurgitated blood. I also borrow a bit from those Potter Wasps that sometimes sculpt their dirty domes on my porch and those intriguing Swiftlets that make nests out of their own saliva. I don’t know if I’d be brave enough to try Stirge Nest Soup, but I bet it’d be a delicacy to Vampires. Here’s a hundred Encounter Activities for the next time you want to inflict a swarm of these little bloodsuckers on an unsuspecting Party: Posted by ktrey at 4:29 PM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, encounters, OSE, OSE Encounters, random tables, tables Saturday, April 25, 2020 OSE Encounter Activities - Goblin Finally getting around to the perpetual Party menace at lower levels: Goblins. Goblins are one of my favorite monsters (as hinted at in my Goblin Project posts). I have an extremely hard time just using them as frequent fodder due to my inordinate fondness for them, even though their one of the few Stat Blocks I’ve bothered to completely commit to memory. I definitely prefer a more folkloric, mythological take on them: Goblins as Unseelie Fair Folk, Bogey Men, mischievous Imps, but at least somewhat more corrupted by the evils of civilization than their sylvan bretheren. A big touchstone for me is the movie the Labyrinth. Goblins come in all shapes, sizes, and even apparent clades. The only thing they have in common is their King, which can be literally anything. Here’s one treatment I’ve used in the past: You see, no one’s every seen a Goblin being born, It’s almost like they just kind of spontaneously generate in dark, dank, and usually somewhat smelly places. Or maybe they come from orphaned Children, abandoned and unloved. Maybe they’re just the maggots that grow in the rotting wood of a dead Elf’s Grove. Without a King though (or should their King be slain), they typically function a little more like well-meaning, but not entirely helpful or competent Brownies. Until something happens that typically involves criticism of their disobliging, inconvenient, and sometimes unwarranted toil. Should this occur, there is a Grand Feast and celebration. The Youngest Goblin is fed to the point of bursting (sometimes beyond). The Eldest will then consult the resultant regurgitation or entrails to interpret and divine the nature of their King. It could be an Old Shoe that the elder sees in the spew, or a Local Ogre, David Bowie, or even a Player Character. Once these Goblins have Kings, a more formal society coalesces around them. Regardless of the King’s nature, if it’s sessile or stationary it will soon becomes motile, if it didn’t possess intelligence it will develop this. It will soon become Humanoid if it wasn’t before and capable of barking out orders to its subjects in flawless Goblin. Subjects who dream about Rabbits after a King’s coronation increase in in size and become Bodyguards. They become a more malignant, guided force that receives a somewhat equal footing with the other standard dungeon denizens. It’s also always tempting to use them to inject in a little comic relief, even if it’s sometimes on the darker side. I always make sure to give them something to sell. There have been countless takes on Goblins over the years, so I’m sure I’m only adding to the noise here. But hopefully this d100 Encounter Table provides some inspiration for some undertakings above and beyond the standard “waiting around in a Guard Room” for the Players to interlope. Your Goblins deserve better than that! Posted by ktrey at 5:45 PM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, encounters, OSE, OSE Encounters, random tables, tables Friday, April 24, 2020 OSE Encounter Activities - Sprite Sprites! Along with Dryads, Nixies and Pixies, Sprites are a definite “must have” for my more Sylvan adventures. I noticed that the description specifies them as being at a foot tall, but I tend to vary them up (usually erring on the much, much smaller side…but I sometimes give the neglected d12 a little love every now and then to determine their height). Sprites tend to be more likely to play out like a Hazard or Trap than a knockdown, drag out fight. The ▶ Pranksters bullet specifies that even if attacked, they’re more interested in their mischief making. The Curse ability that every five can work together to produce can be interesting but difficult to improvise, so for this d100 table, the first thirty, italicized, entries can also be recycled with smaller dice and used as inspiration for some of the pranks they could play on your Players. The flavor I prefer for portraying the Fair Folk usually entails their magical powers being boundless in scope. I find them much more fun and “Fairy Tale-like” when they break “the rules” so to speak. It also helps Players develop a healthy respect and sometimes even a grudging admiration for creatures so otherworldly, fickle, and ancient. Posted by ktrey at 4:24 PM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, encounters, OSE, OSE Encounters, random tables, tables Thursday, April 23, 2020 OSE Encounter Activities - Gorgon Today we have a hundred activities for the Gorgon. I remember being a bit puzzled by the presence of both Medusae and Gorgons as a lad who had voraciously devoured Bulfinch's at a tender age, but now I don’t mind them as a distinctive “D&D-ism,” a quaint combination of Catoblepas and the Khalkotauroi perhaps. During early days, after exhausting the more common literary authorities, many monsters were strip-mined from whatever sources one could lay their paws on (the Rust Monster, Bulette, and Owlbear “Chinasaurs” being another excellent example of this), and the point of origin for this one could very well be the Bestiary pictured below: The existence of a Save category for Petrification seems to drive the special abilities of several Monsters, but I do occasionally enjoy working them in together as a thematic motif. Plus, it’s always a bonus when a Player’s stumble across one of those “extremely lifelike” statues that seem to dot fantasy landscapes and aren’t quite sure if it was Basilisk, Cockatrice, Medusa, Gorgon, a powerful Wizard, or even potentially something more “gotcha” like a Gargoyle, Living Statue, or a lonely Caryatid Column (I always picture those in pairs for some strange reason). See some of the other stone-to-flesh critters above for more information on how to handle their Petrification abilities in novel ways. Posted by ktrey at 9:56 AM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, encounters, OSE, OSE Encounters, random tables, tables Wednesday, April 22, 2020 OSE Encounter Activities - Mummy More Undead Undertakings! This time we take a stab at the Mummy. Their frightening presence is formidable, as is the mystical ailment they inflict. Does this profane disease sever one’s connections to the Divine in order to halt all Magical Healing? I think this is mostly inspired by the fabled Curse unleashed with the opening of King Tutankhamun's Tomb, but the rotting flavor imparted is pretty juicy and dire for ratcheting up tension as Characters race for some kind of mystical cure. If you want to really make them squirm, don't settle for a simple Cure Disease Spell 😊. To me, mummification rituals almost always seem to imply an ancient, antediluvian culture with very particular burial practices and concepts of the afterlife. This can unleash all sorts of forgotten Languages, Foul Magics, and Tainted Technologies of course, and more than once I’ve made all my Mummies reptilian remnants of that aforementioned Saurian Civilization. The appearance of the Mummy is easily re-skinned, and any sufficiently large Mummy’s Tomb is going to also have all sorts of Mummified (and even maybe Animate) animals. If you’re feeling particularly wicked about their intrusion, you can even just use the same statistics for these. I stumbled across some very flavorful Egyptian/Mesopotamian/Grecian Spells that I like to sprinkle among their Grave Goods, or even house within their hollow heads. Sadly, the blog was deleted so all we have are artifacts preserved in the Internet Archive’s cache. Another type of Mummy I often like to employ are the taut and tannin stained Bog Born, replete with garroted necks and bound, gnarled hands. A great change of pace from your typical linen wrapped Lurchers, their touch usually inflicts a more desiccating disease, and their often-found leading powerful Druid cabals, etc. Posted by ktrey at 12:44 PM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, encounters, OSE, OSE Encounters, random tables, tables Tuesday, April 21, 2020 OSE Encounter Activities - Sea Serpent (Lesser) Another critter that doesn’t seem to have survived the transition to BECMI from B/X: The Lesser Sea Serpent. For me, there’s more than a little cognitive overlap between these and Sea Dragons (although the Serpents don’t have Breath, Gliding, or Spells by default), but I’m more inclined to populate the waves with Sea Serpentsrather then their Draconic counterparts (I’ve already professed my love for Dragon Turtles, and they really handle that “Aquatic Dragon” niche nicely). I suppose the Sea Dragon could make for a nice change of pace to break with player expectations. I tend to vary my Sea Serpents greatly in appearance and tactics, but the basic Stat Block is serviceable for most. Giving them an unexpected feature (horns, a sting, electricity, etc) can make for a nice surpri"
