full_description = "d4 Caltrops Blognard? Monday, October 8, 2007 Poor DM's Almanac (part II) Sadly, I was thinking ahead with my choice to run a 3rd edition campaign. I knew that I could hook at least two other casual LAN gamers with the “close to Neverwinter Nights” selling point. I had abandoned the Realms as a campaign setting long ago, and already my long slumbering DM-brain was beginning to bubble with heady Homebrew.I swallowed my pining for the past, abandoned the days of THAC0 (and the associated low-means-good Armor Class), and repurchased the three Core Rulebooks. I longed for that fleeting “feel” of the olden D&D of yore, and resolved to make this campaign as flavorful as possible. Within days, I had my first three players assemble for a character generation session. With each of them, I discussed character options at length, begged for backstory, and sternly supervised the ability score rolls.They were given the following choice for determining ability scores:3d6, 10 times, remove 44d6 (drop lowest), 8 times, remove 2, but keep one low score.The players jumped at the second option, which on the surface, does tend to produce higher-powered characters, but with the heroic harmatia of a low score dangling from their necks.The outcome of this first session was three characters, two of which still play to this day:Brunnor Coalbeard – A dwarf’s dwarf. The party Fighter. Played rather archetypically by Steve.Wilhelm Arkam – The Magic-User/Archaeologist with a decidedly dark bent. Played by Woody.Arun – A Shadow Elf (GAZ13, I dislike Drow, and prefer the other flavor) Assassin, with shades. Played by Dave.A small start, but fairly well-rounded, with Muscle, Magic, and Miscreant. They would eventually need a Cleric. Already, curiosity was beginning to swell as we chatted at length about the characters around the kitchen table. Word travels fast in this circle of friends, and another former gamer was piqued and picked. Many others would soon follow suit, all with virtually no role-playing experience. I would have my work cut out for me. Posted by ktrey at 1:01 PM Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: current campaign, dm, dnd No comments: Post a Comment BLOG_CMT_createIframe('https://www.blogger.com/rpc_relay.html'); Newer Post Older Post Home Subscribe to: Post Comments (Atom) Search Pages Random Tables OSE Encounter Activity Tables Beyond The Wall Resources Yoon-Suin Resources Labels random tables (285) d100 (283) tables (163) encounters (141) OSE Encounters (133) OSE (132) magic items (36) dungeons (23) equipment (19) monsters (19) dnd (17) wilderness tier (17) character generation (16) magic (16) spells (15) rumors (14) wilderness (14) clerics (13) magical items (12) treasure (12) NPCs (11) gear (11) generators (11) house rules (11) spell features (11) hex crawls (10) hexes (10) BECMI (9) RC hacks and house rules (8) ideas (8) plants (8) advancement (7) dnd hacks (7) magic users (7) names (7) resources (7) adventure hooks (6) characters (6) cities (6) dressing (6) events (6) settlements (6) weapons (6) animals (5) backgrounds (5) classes (5) clues (5) curses (5) dolmenwood (5) domain tier (5) dungeon stocking (5) religion (5) set dressing (5) shrines (5) treasures (5) why tables (5) yoon-suin (5) character sheets (4) current campaign (4) dragons (4) fairy tales (4) hooks (4) mountains (4) reviews (4) stocking (4) team tuesday (4) villages (4) what tables (4) 4e (3) Elfs (3) TROIKA! (3) WHITEHACK (3) abilities (3) armor (3) cantrips (3) carousing (3) character classes (3) decoration (3) dm (3) domain (3) doors (3) dungeon dressing (3) fair folk (3) food (3) foraging (3) foreground growth (3) fourth edition (3) fungi (3) goblin project (3) hirelings (3) landmarks (3) locks (3) mentzer (3) mushrooms (3) potions (3) procedures (3) quests (3) religions (3) rules cyclopedia (3) spellbooks (3) swords (3) tells (3) tools (3) traits (3) transcripts (3) traps (3) world building (3) Cairn (2) Dwa