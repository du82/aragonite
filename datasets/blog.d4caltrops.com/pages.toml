full_description = "d4 Caltrops Blognard? Monday, October 1, 2007 Back from the Dead The lifeless corpse of the campaign I had all but abandoned for the Winterlands (the cold, white, northern wastes of Indiana) last year was borne on a improvised litter by The Seven and placed gingerly upon the gilded altar of the Sun Temple. Beaten and bedraggled, the Heroes delved deep into their belt-pouches and backpacks, producing just enough platinum pieces to receive audience with the High Hierophants, Sons of the Solar Host. Intersession into the affairs of the Taker is never something approached lightly, even on behalf of Heroes as great as these. The Solar Host has its demands. The tip of a Gnomish dagger brutally pries the clear gems from their delicate elven setting, and even the Dwarf winces as such exquisite craftsmanship is marred. The dragonhoard had much in the way of jewelry and gems, but tragically few diamonds. They can only hope that what they’ve assembled will be enough, as the Hierophants begin their effusive prayers and anoint the remains in melted snow, gleaned from the regions tallest peak. After almost two years, the corpse of the campaign was returned to its players. My heels had barely cooled from the trip, and we were still unpacking when within less than a week, the invigorating magic of a pricey true resurrection had me frantically reweaving all of the threads of the story thus far into one fifty-foot rope. As a DM, I become painfully aware of the age-old aphorism concerning rope, and how its length should be fed out slowly to the players, until they have just enough. Posted by ktrey at 9:58 AM Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: current campaign, dm, dnd No comments: Post a Comment BLOG_CMT_createIframe('https://www.blogger.com/rpc_relay.html'); Newer Post Older Post Home Subscribe to: Post Comments (Atom) Search Pages Random Tables OSE Encounter Activity Tables Beyond The Wall Resources Yoon-Suin Resources Labels