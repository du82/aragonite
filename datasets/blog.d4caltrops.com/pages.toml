full_description = "d4 Caltrops Blognard? Thursday, November 29, 2018 More Migration - Herb & Plant Generator Here’s another bit of Google+ Content that I threw together a while back and forgot to share here. It's a Herb & Plant Generator that I whipped up based on some scattered notes and previous practices. I'm sure that Rolemaster 2nd Edition's juicy “list of Herbs, Breads, and Poisons” provided some inspiration here. I seem to recall it had some stern admonishments against having only magical sources of healing in your campaign, and since I acquired Character Law years before coming across Spell Law, for the longest time Herbs and Natural Healing were the only systems I had. In particular, I recommend whipping up a few new plant names to use in descriptions for new regions to give the area some distinctive flavor. If the Lungwattle found sprouting in sunny clearings near creekbeds gradually gives way to Ghoulgrape as you approach the marshes, observant players may pick up on these changes in flora and they can even eventually serve as a subtle navigatory or climatory shorthand. Plus, fantastical worlds often benefit from even the most minor or mundane ornamentation, and developing a custom botanical nomenclature can be a great way to dress the setting. Originally, I think the plants and herbs generated here were intended to assist with a system for replicating/replacing Cleric Spells (see this post: Cleric Spells Are Herbs). If you have a Ranger-type, Druid, Witch, Elf, or other “Woodland Type” in the party, consider letting them start out with knowledge of a few of these. Although for fun, I would be initially inclined to provide them with only the vaguest notions of side-effects or possibly only partial recipes for proper preparation. Experimentation with systems like this can help foster a neat kind of environmental engagement. Posted by ktrey at 9:30 AM 1 comment: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, generators, herbs, plants, resources, world building Tuesday, November 13, 2018 Ford's Faeries: A Bestiary Inspired by Henry Justice Ford Over on G+ a while back, there was a solicitation for Bestiary entries inspired by the artwork of Henry Justice Ford. I've loved these illustrations ever since I first read the various Fairy Books I could get my mitts on as as a child. My contribution is included in the free download here: Ford's Faeries: A Bestiary Inspired by Henry Justice Ford Looks like a print-on-demand version might be in the works as well! Posted by ktrey at 8:38 AM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: crowdsourcing, downloads, monsters Newer Posts Older Posts Home Subscribe to: Posts (Atom) Search Pages Random Tables OSE Encounter Activity Tables Beyond The Wall Resources Yoon-Suin Resources Labels random tables (285) d100 (283) tables (163) encounters (141) OSE Encounters (133) OSE (132) magic items (36) dungeons (23) equipment (19) monsters (19) dnd (17) wilderness tier (17) character generation (16) magic (16) spells (15) rumors (14) wilderness (14) clerics (13) magical items (12) treasure (12) NPCs (11) gear (11) generators (11) house rules (11) spell features (11) hex crawls (10) hexes (10) BECMI (9) RC hacks and house rules (8) ideas (8) plants (8) advancement (7) dnd hacks (7) magic users (7) names (7) resources (7) adventure hooks (6) characters (6) cities (6) dressing (6) events (6) settlements (6) weapons (6) animals (5) backgrounds (5) classes (5) clues (5) curses (5) dolmenwood (5) domain tier (5) dungeon stocking (5) religion (5) set dressing (5) shrines (5) treasures (5) why tables (5) yoon-suin (5) character sheets (4) current campaign (4) dragons (4) fairy tales (4) hooks (4) mountains (4) reviews (4) stocking (4) team tuesday (4) villages (4) what tables (4) 4e (3) Elfs (3) TROIKA! (3) WHITEHACK (3) abilities (3) armor (3) cantrips (3) carousing (3) character classes (3) decoration (3) dm (3) domain (3) doo