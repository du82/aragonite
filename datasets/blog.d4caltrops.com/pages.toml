title = "d4 Caltrops: March 2018"
full_description = '''d4 Caltrops Blognard? Monday, March 19, 2018 Landmark and Encounter Placement within Hexagons The standard Hexagon can be sub-divided into twelve lozenges/rhombi. This makes it very easy to simply roll 1d12 to place an item within the interior of a hex. The illustration below is numbered 1 to 12 (in a manner evoking the standard clock face) to illustrate this: Another interesting side-effect of this tessellation is the creation of six additional overlapping Hexagons (each composed of 3 lozenges). These also each form an optical illusion of a cube: These cubes could be used to accommodate/house larger, lozenge-spanning encounters/landmarks. The “3D” effect almost seems to imply that they could be useful to provide a rough guide/indicator of the highest/lowest points of elevation within a given hex. This pattern/design was used in floor tiling within the Siena Cathedral in Italy: I'm fairly sure quilters have been using innovative methods of tessellation to create hexagons for ages. This is not the only way to sub-divide a hex into uniform sections (although with 9 subsections, it's a little less useful with the standard dice, but the center sub-hex is interesting, and it's subdivisions can be rotated): And of course, the more prosaic right-triangle “wedges:” Some of this may go into my Expanded Wilderness Hexes document at some point. Once I finish up the "landmark" tables and polish up some additional wilderness navigation procedures. Posted by ktrey at 11:37 AM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: hex crawls, hexagons, hexes Thursday, March 15, 2018 Wilderness Hexes - Version 1.0 One Hundred Wilderness Hexes, all linked in a single compiled document [direct link]: Current Terrains include: Forest, Mountain, Desert, Swamp and Ocean. EDIT: Looks like some of the jump links don't really work too well in the embedded version above or when the PDF is opened in certain web browsers. They appear to work in a stand-alone PDF reader though, just make sure to check back for updates! Drop me a line here if you spot anything odd/misspelled, broken links, or other issues. I'd also love to hear about how this works out at your table if you find it useful or any suggestions! Still contemplating a Printer-Friendly/POD version. (file under maybe someday: 100 entries for each Terrain type...sitting pretty on a few dozen more Forest/Mountain hexes and I already have a few new Terrain Ideas) Posted by ktrey at 11:26 AM 15 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: hex crawls, hexes, OSR, resources, wilderness tier Newer Posts Older Posts Home Subscribe to: Posts (Atom) Search Pages Random Tables OSE Encounter Activity Tables Beyond The Wall Resources Yoon-Suin Resources Labels random tables (285) d100 (283) tables (163) encounters (141) OSE Encounters (133) OSE (132) magic items (36) dungeons (23) equipment (19) monsters (19) dnd (17) wilderness tier (17) character generation (16) magic (16) spells (15) rumors (14) wilderness (14) clerics (13) magical items (12) treasure (12) NPCs (11) gear (11) generators (11) house rules (11) spell features (11) hex crawls (10) hexes (10) BECMI (9) RC hacks and house rules (8) ideas (8) plants (8) advancement (7) dnd hacks (7) magic users (7) names (7) resources (7) adventure hooks (6) characters (6) cities (6) dressing (6) events (6) settlements (6) weapons (6) animals (5) backgrounds (5) classes (5) clues (5) curses (5) dolmenwood (5) domain tier (5) dungeon stocking (5) religion (5) set dressing (5) shrines (5) treasures (5) why tables (5) yoon-suin (5) character sheets (4) current campaign (4) dragons (4) fairy tales (4) hooks (4) mountains (4) reviews (4) stocking (4) team tuesday (4) villages (4) what tables (4) 4e (3) Elfs (3) TROIKA! (3) WHITEHACK (3) abilities (3) armor (3) cantrips (3) carousing (3) character classes (3) decoration (3) dm (3) domain (3) doors (3) dungeon dressing (3) fair fo