full_description = "d4 Caltrops Blognard? Tuesday, November 12, 2019 d100 Table - This Secret Door Opens It’s a relatively common conundrum: You’ve placed your concealed or secret doors in a lovingly designed dungeon but may have not bothered to give much thought to how they’re opened/operated other than “oh there must be a lever/pressure plate/button somewhere.” I’ve created this table to help provide some inspiration. It might also be useful for methods of disabling tricky traps or burnishing an evening with minor puzzle elements as well: As a caveat: Clues are completely crucial when sprinkling in secrets, mysteries, and puzzles. I’ve underlined items that could be expanded through virtuosic descriptions to help draw in players attention to certain features, but feel free to incorporate another nudge or so. If they must open the door by kissing the carving of a crone (#47), it stands to reason that perhaps the lady’s lips are worn or stained, etc. This underlining typically indicates that these should be incorporated somehow into dressing/room descriptions as the players interrogate the fiction and should only adjust the character of a room in a minor way. If it flatly doesn’t fit with character of the room contents, then it might be simpler to choose another or adjust it slightly. Some puzzles require pieces. For these, I’ve applied bolding. If the players don’t have these, or a means of acquiring them, then this could serve as a “hard stop” in play which isn’t ideal. They can always come back at a future point in time with the proper component, or as above, you can always adjust or incorporate additional necessary ingredients in nearby dungeon dressings if it’s frustrating any fun. Not all secret doors have to opened, and fully exploring a deviously drawn dungeon often triggers other in-game resource/real-life dependent limitations or exasperation (this isn’t Myst after all and pixel-bitching is about as un-fun as you can get for most). Feel free to flex your imagination on how things are “actually working” with lovably “off-screen” byzantine mechanisms or gonzo Rube-Goldberg contraptions. Inexplicable magics from mad mages are another common scapegoat. Most of the time this is largely less important to the players than simply bypassing a mercifully brief obstacle. I also like to muse on how these doors might see use by other dungeon denizens, but I don’t get too caught up on it. Like many, I prefer the more Mythic Underworld approach which is blessedly less logical: The monsters play by their own rules down here. But naturally, a canny party, silently tracking or carefully observing the inhabitants should be rewarded with revelations on how some of these triggers work. Let me know if you find this useful or how an entry works out if it makes its way into one of your dungeons! Posted by ktrey at 9:46 AM 5 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, dungeons, puzzles, random tables, secret doors, tables, traps Thursday, August 29, 2019 d100 Table - Dungeon Noises & Sounds Here’s another d100 table to provide a little environmental dungeon dressing and furbelow. One often finds themselves fixating on the visual elements in descriptions, but occasionally engaging some of the other senses (see: d100 Table - Three Hundred Smells & Scents by Type) can make for an exciting change of pace. I wanted to whip up a handy table to make this process more inspiring and less repetitive, inspired by the old AD&D DMG. How do you use sounds/noises in your games? Posted by ktrey at 8:46 AM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, dungeons, random tables, sounds, tables Tuesday, July 23, 2019 Safari Card Monster Manual I was reminded today about the existence of Safari Cards. Here’s the commercial from the early 80s that some of you may remember: As a child, I positively adored these things. I obsessively read, filed, and re-filed them. I think some of the first mail I received addressed to “me” alone were little packets containing these cards (though I have no idea how my parents were suckered into subscribing to them, probably under the laudable auspices of the cards being “educational.”) I remember convincing a teacher to let me do my “book reports” on animals that she would draw randomly from a pile (I think I still have one of these somewhere on the terrific Jackson’s Horned Chameleon). I’d get to write down the name, and she’d keep the card while I scampered off to the school library and immersed myself in the reference sections. It was always fun “checking my work” versus the card. So, the information presentation on these was actually pretty interesting and could have some application for rendering Monster/Encounter information in a compact format. Let’s take a look at the front and back of a card (these were 4¾ by 5 inches): While the front is dominated by the photograph of the animal in question (prime real estate and size for a monster illustration you could show to the players), the top bar is usefully dense. You have the creature name above a series of icons. I believe these were used for filing/organizing the cards within their storage containers (there were dividers), I think they map to Class/Order/Family, but we could just as easily have a set of icons for Monster Type: Undead/Aberration/Dragonkind, or other types of Monster classification icons (maybe solitary/group, treasure type?, etc). Next is a nifty line illustration of the type of terrain it’s typically found in (especially relevant for Overland Encounters, but a “Dungeon” terrain could exist) which was also used for organizing the cards, and a map with the geographic region. This format seems pretty pilferable (insert your fantasy world hex-map over the Mercator projection, with hexes highlighted). I believe the color of the top bar also was different depending on the climate the animal preferred. On the back, we have two columns of information (monster fluff goes here, ecology, etc), and a lovely little table at the bottom with some additional interesting information (this might have varied a bit from critter to critter). I think a stat-block could easily fit in here, or maybe keep some of this box (the measurements are neat, and gestation information is woefully under-represented, other “fun facts” could also be presented here, I am a sucker for having any collective nouns/terms of venery at the ready for instance) and reduce the amount of text in the information/ecology section to add another few rows for simple, broadly compatible stats. The card format could be useful for quickly building a “deck” for random encounters within a region/terrain/climate to have the monster statistics and relevant information handy, not necessarily as a generator (frequency isn’t really represented here), but as reference with all the necessary information in one place and a quick way to locate/re-file the monsters as necessary. Just another idle idea. Perhaps I might eventually find the time to create some templates or example cards for this. Posted by ktrey at 1:35 PM 3 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: cards, ideas, monsters Monday, July 22, 2019 Mountain Range Generator Idea I’ve been thinking about Mountain Ranges a bit lately in preparation for some supplemental tools/tables for generating some names and flavor for the Mountain Hexes. In my musings, I hit upon the idea to procedurally generate a primitive visual profile using area charts. Here’s a rough idea for a Mountain Range generator (using Google Sheets for web-based compatibility, sample output and link below). Mountain Range Generator (this is a link that creates a copy to play with) It could definitely benefit from a little more variety for the naming (I’ve only included some short tables as a proof of concept here) and some tinkering with the data series, but there might be some potential with this approach. It could be interesting to include some options for “young and tall” ranges (à la the Himalayas) as well as “old and worn” types (like the Appalachian Mountains). It is also tempting to nest a few more data series as well or have the number of series plotted to be randomly determined for more or less visual depth. Posted by ktrey at 8:00 AM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: generators, ideas, mountains Tuesday, July 9, 2019 Updated Layout For Gorgon Trail TROIKA! Backgrounds Found myself fiddling around a little bit with the Layout for the Gorgon Trail TROIKA! Backgrounds. The document itself has been updated with a few more Backgrounds. Hoping to finish this up soon. To view the living document, use either the above link, or this link to the previous post. Here's a quick preview of the latest layout styling: Posted by ktrey at 12:43 PM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: gorgon trail, TROIKA! Tuesday, July 2, 2019 TROIKA! Backgrounds for Gorgon Trail Psst...I’ve started whipping up 36 Gorgon Trail Backgrounds for TROIKA! This is a living document, that I’ll be adding to as I get some free time, so check back for updates! Posted by ktrey at 4:50 PM 5 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: backgrounds, gorgon trail, projects, tex-crawl, TROIKA! Thursday, June 27, 2019 Return Of The Mountain Hexes I I decided to take a bit of a breather from the foliage of the Forests for some fresh Mountain Air. Alpine terrains are always interesting to me and were even the first terrain I tried tackling with this project, so it’s wonderful to return to these stony slopes. Here's a brief breakdown of the contents of this draft: Help for Hikers: An ancient stone walkwayA Mountain Lake, devoid of lifeA Scenic Way-ShrineSome distinctive, finger-like Formations Rabidly foaming Rapids I’ll have to brainstorm on some supporting generators for Mountains (akin to all the material I’ve whipped up for Trees/Plants/Herbs), maybe a Mountain Range/Prominent Peak name generator would be useful. As always I welcome any ideas for these in addition to feedback! These Mountain Hexes as part of my ongoing Wilderness Hexes project (browse the hexes tag on this blog for more). Posted by ktrey at 7:17 AM 2 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: hex crawls, hexes, wilderness tier Tuesday, June 18, 2019 Tex-Crawl/Gorgon Trail Backgrounds & Vocations One of the first things I like to do these days when I’m contemplating Settings is to start with player facing materials. For the Tex-Crawl project, Gorgon Trail (a Mystara-sytle Gazetteer for fantasy Texas) I went ahead and created an updated “Backgrounds & Vocations” list that tries to do some of the heavy lifting to communicate setting during Character Generation: Ideally, as with the previous Backgrounds, these should create more questions than they answer and telegraph more of the entire world more quickly than a huge setting dump. It is also interesting to see which Backgrounds/Vocations are broadly applicable despite the setting, and how a simple tweak can completely change the tone. The actual Gazetteer is going on 36 pages so far, and the sections on some of the really intriguing things (like how Clerics are handled, Rune-Branding, Barbed-Wire Wizards, and Hooch Magic) have been completed in their draft forms. It’s all very tongue and cheek, and the authorial voice/heavy use of idiomatic expressions is having the strange side-effect of my latent accent creep out in conversation :). I’m having to resist the urge to just go full on TROIKA! with these Backgrounds instead of something broadly compatible with B/X. Posted by ktrey at 4:46 PM 6 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: backgrounds, character generation, d100, tables, tex-crawl Tuesday, June 11, 2019 These Dwarfs Are... (d100 Table) I’ve managed to somehow saddle myself with yet another project that I’ve been spending some spare time on. This one’s taking shape as a Mystara-style Gazetteer for a Fantasy Texas (tentatively calling it the Gorgon Trail Tex-Crawl). It’s fairly tongue-in-cheek, but it’s proving to be a fun distraction. But I’m still hoping not to neglect this blog, so here’s another quick d100 Activities Table to liven up encounters (random, wandering, or otherwise) with Dwarfs this time. It could serve as a companion for the one I previously put together for Wood Elfs. Feel free to browse the d100 label for similar tables I’ve posted in the past, and as always I love hearing about how they work out at your table. Posted by ktrey at 9:37 AM 4 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, Dwarfs, random tables, tables Wednesday, May 29, 2019 d100 Table - One Hundred Unconventional Potions When it comes to Magical Potions (or any magical items really), I’m particularly fond of effects that are less “duplicate an existing spell or class ability” and more “can this lead to potentially interesting or creative use later in play.” It tends to turn the more expendable gimcrack into something just a little more magical, a tad mysterious, and slightly special. It can also lead to some sensational surprises down the road when a player realizes they have “just the right tool for the job”, or better yet: something that should work with a little strategic modification to “the plan”. So, with that said, here’s a new random table of One Hundred Unconventional Potions to sprinkle throughout your heaping hoards, devilishly determine the perils of potion miscibility, salve the sting of adverse alchemical errors, or any other use that might strike your fancy. Some are strange, some are probably too powerful, and as with anything here you may need to season to the tastes of your table or your particular flavor of fantasy. Posted by ktrey at 5:03 PM 4 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, magic items, potions, random tables, tables, treasure Tuesday, May 28, 2019 d100 Table - Three Hundred Smells & Scents by Type (for Yoon-Suin or anywhere really) Foraging through a few orphan folders, I found another d100 table that has been languishing at the end of some content on my Yoon-Suin Resources page and decided to whip it into a single-page for more convenient use. Although I believe it was originally designed to assist with navigating city-blocks in Yoon-Suin, I frankly feel that this could be helpful for a variety of situations that need a little nose, even if does err a little on the exotic. We often default to stressing sight and sound impressions when describing things, but a gentle reminder to remember how things and situations smell never hurts. It’s worth considering adding a trigger for this to an Overloaded Encounter Die/Wandering Monster Check, and I’d love to see more adventure authors us"
