full_description = '''d4 Caltrops Blognard? Saturday, December 1, 2007 A Character Generation Option This is an option I stumbled across somewhere else (precisely where escapes me at the moment) but I'm making a note of it here for future use.Instead of having each player generate their ability scores/point buy/etc individually, consider trying something like this:Each player throws the standard 3d6 six times and records the results. The players are then able to compare these scores and mutually decide on which scores they will all share for character generation. The same six scores will be used by each player, but the players assign these ability scores according to their own desires. This would create a party that is quite balanced in terms of ability scores, suddenly removing the bragging rights associated with that statistically improbable lucky "18", and potentially saddling the players with at least one less-than-stellar score. Variation and flavor provided by character class requirements and player's fiat.Six ability scores, arranged in different ways have the potential to create over seven hundred characters if the horrendously under-used math skills I'm channeling are to be believed. Posted by ktrey at 2:16 PM Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: character generation, dnd No comments: Post a Comment BLOG_CMT_createIframe('https://www.blogger.com/rpc_relay.html'); Newer Post Older Post Home Subscribe to: Post Comments (Atom) Search Pages Random Tables OSE Encounter Activity Tables Beyond The Wall Resources Yoon-Suin Resources Labels random tables (285) d100 (283) tables (163) encounters (141) OSE Encounters (133) OSE (132) magic items (36) dungeons (23) equipment (19) monsters (19) dnd (17) wilderness tier (17) character generation (16) magic (16) spells (15) rumors (14) wilderness (14) clerics (13) magical items (12) treasure (12) NPCs (11) gear (11) generators (11) house rules (11) spell features (11) hex crawls (10) hex