title = "d4 Caltrops: January 2020"
full_description = '''d4 Caltrops Blognard? Friday, January 31, 2020 OSE Encounter Activities - Bandits (d100) Stand and Deliver! Here are one hundred lawless undertakings to embellish your Bandit encounters. Bandits have been fairly frequent entries on Wilderness Encounter Tables since the very beginning (the typical Outdoor Survival board was practically crawling with Outlaws and ne’er do-wells) and they still seem to crop up regularly in later interpretations. There’s a world-building implication somewhere in there I’m sure. I hope there are some DMs that get some mileage out of this list and that it leads to more interesting situations. As always, I love to hear about how these tables work out at your table! Don’t forget the wealth of additional framing that can be added with Encounter Distance, Surprise, and by remembering to throw those crucial Reaction Roll dice! And always remember to check Morale so that they can flee and live to fight another day! Bandits can make for excellent recurring foils but can also be a useful faction to ally with in the Wilderness. I believe our buddy the Basilisk is up next, which might be a little challenging! Posted by ktrey at 9:45 AM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, encounters, OSE, OSE Encounters, random tables, tables Thursday, January 30, 2020 OSE Encounter Activities - Lizard Man (d100) What are those scaly and squamous folk up to? Old School Essential’s lovely and laconic layout tells us of only two preferences: one of armament and the other of appetite. So here’s a hundred digressions to dress up any lacertilian rendezvous: Alphabetically, Bandits are next (and I figure they’ll be easy enough, as I’ve used them plenty in the past), but if you’d like to interrupt the running order with a request, drop it in the Comments and I’ll see what I can whip together. Posted by ktrey at 11:45 AM 1 comment: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, encounters, OSE, OSE Encounters, random tables, tables Wednesday, January 29, 2020 OSE Encounter Activities - Ape, White (d100) Here’s another entry in the OSE Encounter Activities project: the dreaded White Ape! Sufficiently variable animal activities and behaviors might prove difficult to fill up an entire 1d100 table for some of the other entries, so in the future I might do smaller tables (d20, d30) for entries like this (it’s often more fun to remix more pedestrian animal encounters with another encounter: Bear menacing a Troll, Bats harassing a Gelatinous Cube, etc.). It’s the Monsters that generally get the imagination firing on all cylinders after all, and I doubt any DMs have had to contend with a party of primatologists, but should this come up, this might be a handy table to have! Working on a request for Lizard Men next, but let me know if there's an OSE Monster you'd like to see sooner than the alphabet allows! Posted by ktrey at 3:00 PM 3 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, encounters, OSE, OSE Encounters, random tables, tables Tuesday, January 28, 2020 OSE Encounter Activities - Acolytes (d100) While leafing through Old School Essentials the other day, I was struck by another project idea: wouldn't it be wonderful to have at hand a few "Encounter Activity" tables for each of the Monsters in the Classic Fantasy Monsters tome in the same vein as my These Wood Elfs Are... and These Dwarfs Are... tables?So I started with the first one: Hopefully this will add a little additional flavoring to those randomly encountered or placed foes. I could also see some of the entries applying to the mysterious Drune of Dolemnwood fairly well. If there's enough interest, I might muddle my way through more as I get the chance. I welcome any suggestions for which Monster I should try to tackle next in the comments! Posted by ktrey at 11:10 AM 6 comments: Email ThisBlogThis!Share to XShare to FacebookShare to