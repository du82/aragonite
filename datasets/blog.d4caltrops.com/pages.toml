title = "d4 Caltrops: January 2015"
full_description = '''d4 Caltrops Blognard? Friday, January 30, 2015 Spell Features. The intention is to provide a little more "Magic" to First Level Magic-Users, including up to six unusual choices for most of the standard starting spells. This should help insure that no two 1st Level Magic-Users are the same, even if they possess the same spells. It might also make the Class a little more flavorful and “exotic” for those that grouse at the limitations of low level Magic-Users or sour at the idea of Random Spell Selection when they receive perceived non-starters like the much maligned “Ventriloquism.” I'm deeply indebted to Courtney's excellent series on Spell Memorization Effects, which I'm sure was brewing in the back of my brain when I vomited this up. It really got me thinking about Prepared Spells as a resource that does something passively until exhausted. The idea also came to me as I was revising my Tunnels & Trolls Spell Book handouts, so please excuse the level of whimsy and tongue-in-cheek that seems to have crept into some of these. Re-skin or un-pun to taste. I think this is balanced by the ones that get quite dark in places. I imagine that it would work something like this: Once Spells are randomly determined (or selected, if you are feeling exceptionally generous) for a first level Magic-User the player may either choose or randomly roll on the Spell Features for their specific 1st level Spell (everyone receives Read Magic in most of my games). Some Spell Features are obviously more useful than others, and no regard has been paid to imaginary beasts like game-balance, nor is there much in the way of mechanical consistency. This was intentional, as I find it keeps things weird and mystifying, just as magic should be. I've tried to incorporate interesting draw backs and resource management (usually based on time, which is precious) wherever possible so that these don't just turn into more character sheet cruft. I'm interested to hear what anyone thinks. Some definitions of terms and explanations: HLSS: This stands for Highest Level Spell Slot. I use this periodically to provide a somewhat tighter bounded bonus than Caster Level. In BECMI, this number is never higher than nine, and it doesn't increase every level, only according to the Spell Progression table. It's also information that is fairly obvious and at-hand (most casters know the level of the highest Spell they can prepare and cast). As a controlled bonus or duration, I tend to prefer it to caster level. BECMI Example: A 5th Level Magic-User's HLSS is 3, while a 17th Level Magic-User has an HLSS of 7. Familiars: However you do this is fine. I typically charge the Magic-User either 30 gold pieces from their starting wealth, or if using my Quick Equipment and Encumbrance Sheet, a familiar can be had for 1 miscellaneous pick. You could also just have them pick a die to drop from their starting wealth roll (making a Familiar cost between 10 and 60 gold pieces, Magic-Users don't have expenses like Armor, so they often end up wealthier than the rest of the party, the result can also serve as the Familiar's hit points). I tend to keep Familiars mostly cosmetic, unless one of the Familiar Features associated with the Magic-User's starting spell is selected. Expend/Release/Internalize: Some features use this terminology (I obviously haven't found a favorite yet). This is not necessarily “casting the spell” in most cases, so I don't imagine it would take any time (or need to take place on the Caster's turn even, as some of the effects are triggered in reaction to other actions), but it does erase the spell from the Caster's mind the same way. I don't imagine it really having any outward visible effects, and it'd probably be possible to do in an Anti-Magic field. Just another choice to present the player with in most cases. I've given a little bit of thought to converting this to D&D 5e, but I'm not as intimately familiar with the new Spell List yet. In most places where Bonus or Penalty is implied, Advantage/Disadvantage could probably be used. The Slot-Point mechanics of 5e make things a little trickier when it comes to Expending, and the lack of Reaction Rolls as a central mechanic is terribly sad, but I think for the most part the more Iconic Spells (like Charm Person, Sleep, Magic Missile) are similar enough that this could be used with most versions of D&D. I'll be splitting this into smaller groups to keep the posts short. If there's significant interest, I might assemble a PDF or create a handout/compilation. Here's a summary of the Spell Features for quick reference/random rolling: First Level Spells Analyze Avaricious Eyes Spell Book Feature: Palimpsest of Common Command Words Know Lineage Dagger Feature: Haruspex Tea Leaves Familiar Feature: The Eyes Have It Charm Person A Loyal Henchman Spell Book Feature: Hamlin's Concerto Spell Book Feature: Etiquette Book Perfume Language: Harpy/Dryad Familiar Feature: Serpent Floating Disc Feather Fall Charm Dagger Feature: Flying Language: Air Elemental Gainful Portaging Spell Book Feature: Buoyant Familiar Feature: Light as Feather Hold Portal Tattle-Tale Lock Spell Book Feature: For Your Eyes Only/Privacy Please Jar of Friendly Earseekers Language: Mimic Puzzle Box Familiar Feature: Passdoor Light * Selfish Spells Dagger Feature: Focus Spell Book Feature: Made In The Dark Candle Molds Language Of Shadows Familiar Feature: Bat Magic Missile Strix Missile Spell Book Feature: Tablet of Arrow Carving Puissant Technique Voodoo Doll/Poppet Magic Dagger Feature: Sympathetic Athame Patient Missile Protection From Evil Circles Spell Book Feature: Warded Against Intrusion Witch Bottle Dagger Feature: Lodestone Familiar Feature: Dog Horseshoes Read Languages Staff Feature: Cipherstick Dictating Quill Bonus Language Spell Book Feature: Talking Book Jar of Tongues Voracious Reader Read Magic Detect Magic/Scroll Ink Shield Heraldic Gift Shield-Bearer Training Dagger Feature: Spell-Warded Kris Elemental Ward Spell Book Feature: Defending Familiar: Turtle Sleep Spell Book Feature: Manual Of Oneiromancy Pouch Of Apple Seeds Spell Book Feature: Bedtime Stories Cockerel Automaton Osculations Familiar Feature: Sloth Ventriloquism Music Box Dagger Feature: Voice Drinker Dummy Golem Jar Of Lips Spell Book Feature: Talking Familiar Feature: Talks Posted by ktrey at 2:29 PM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: BECMI, spell features, spells Spell Features: Sleep and Ventriloquism See this post for explanations and more information. Sleep 1. Spell Book Feature: Manual of Oneiromancy – Place your spell book under your pillow and cast Sleep on yourself (normal duration applies). If you sleep undisturbed for at least 1d6 hours, you can choose one of the following: Commune Spell (3 weal/woe questions), See within/behind a portal/container you've touched in the last 24 hours, or wake refreshed with no need to eat or drink for the day. Anyone sleeping within 50 feet of you when you attempt this has terrible nightmares, and cannot be woken until you wake. 2. Pouch of Apple Seeds – You have a pouch of magical apple seeds (2d6). They can be planted in fertile soil and if you cast this spell and water your handiwork, an Apple Tree will grow to sapling size in the standard Sleep Spell duration (4-16 turns). Once grown to this size, it will bear 1 ripe fruit, in a matter of seconds. Anyone eating this apple will fall asleep for 4-16 days on an unsuccessful save. The magic in the apple lasts for 1d6 days, and maintains it's potency if used as an ingredient in an apple-based dish. Franz Jüttner (1865–1925): Illustration from Sneewittchen, Scholz' Künstler-Bilderbücher, Mainz 1905 3. Spell Book Feature: Bedtime Stories – If you spend at least 1d6 turns reading out bedtime stories scrawled in your spell book and expend this spell, anyone who is listening falls asleep and has pleasant dreams and a restful slumber (those so affected only need half as much sleep to obtain maximum benefits). It affects the double the standard Sleep Spell HD (targets as determined by the DM, randomly, and at discretion could include you, so make sure the party member on watch stuffs their ears with wax or cotton). The audience doesn't necessarily have to be “willing,” just listening to your stories. If any of the sleepers are wounded or hurt before they fall asleep, the sleeper with the highest hit points loses 1d6 x your HLSS in Hit Points, which in turn heal the hurt sleeper by twice this amount. Anyone reduced to 0 in this fashion never wakes up. They don't die, they just never wake up. 4. Cockerel Automaton – You possess a life-size mechanical rooster. It's gears can be adjusted and wound to have it crow loudly (which triggers a wandering monster check) in metallic tones at a specified time, waking anyone asleep within 500 feet. It only eats your dreams (you won't remember them in the morning if its set to crow, but who needs dreams right?). If you expend this spell, it can be wound to animate, after which it is mobile (clinking as it pointedly pecks at detritus and inquisitively following the person with the most visible metal around), and can attack as a creature with HD equal to your HLSS when cornered (this type of winding animates the rooster for the standard Sleep duration in turns, and can be combined with the Alarm feature above). Image courteous of lollollol2 DeviantArt page here. 5. Osculations – As long as you have this spell prepared, your kiss can wake anyone sleeping and they are generally well disposed to this intrusion (+2 to reaction rolls, my prince). You can also kiss someone asleep (expending the spell) and they will slumber restfully (regaining 1d6 hit points, plus your HLSS) for the max duration of the spell (16 turns, must sleep all 16 to gain the benefit). 6. Familiar Feature: Sloth – Your familiar is generally asleep most of the time, but it does rouse whenever you sleep to lovingly rid your body of parasites and groom you, cleaning and freshening your appearance. You always wake up with nary a hair out of place (+2 to reaction rolls in situations where an impeccable appearance might benefit you). It will also defend a sleeping master as if it were 1 HD greater than normal (step up damage dice too), but it does so as silently as possible (it would hate to wake you and interrupt your beauty sleep). Ventriloquism This spell is generally considered a big ol' rip off, so hopefully these at least make it interesting :) 1. Music Box – You possess an intricately crafted music box with a switch that can be set in the presence of any music. It will then be able to reproduce the tune faithfully with it's limited palette of tiny mallets and electrum striking surfaces. It can hold up to your HLSS in songs. It can record such interesting songs as that of the Harpy Croon or Siren Serenade, so be careful with this. 2. Dagger Feature: Voice Drinker – If you wound someone with this dagger, and have this spell prepared, you may mimic their voice exactly. It only holds the voice of whoever was last wounded, but you may have possess as many daggers with this feature as your HLSS. You may also use this voice without issue when you cast this spell. 3. Dummy Golem – You possess a partially animated (mouth and eyebrows mostly) figure. It possess a reedy version of your voice as long as you have this spell prepared, and often makes quips and off-color comments. With concentration you can control what it says (easily earning a free meal or place to sleep for the night). You can expend this spell to have it fight as a creature with HD equal to you HLSS (quipping the entire time). If destroyed, it can be replaced with a careful carving process that takes 1d6 weeks. 4. Jar of Lips – It's a jar of 1d6 pairs of lips that can be affixed to any surface and by expending this spell, the lips will function as a Magic Mouth (using your voice). The magic will only power them for 1d6 days, and yes, you know the gruesome technique to harvest more (takes 1d6 turns of careful cutting and expending this spell). While you have this spell prepared, you are aware of any active Magic Mouths and what they are going to say before they say it. 5. Spell Book Feature: Talking – You may expend this spell prior to preparing your spells. As you prepare, your Spell Book whispers encouraging words and unconventional mystical shortcuts (in your voice). You may pick up to your HLSS in number of spells prepared during this process. These spells may be cast in complete silence, without requiring any verbal components, or alternatively, one spell you prepare may be cast with it's range or duration doubled. 6. Familiar Feature: Talks – Any familiar you acquire possess the ability to speak aloud in any language you know as long as you have this spell prepared. It is exceptionally critical of any traveling companions, and a surprisingly decent mimic of their voices. You may expend the spell at any time to telepathically convey a mental message to anyone your familiar has mocked in the last month (provided they share the same plane as you). The message is limited to a number of words equal to your level. Posted by ktrey at 2:23 PM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: BECMI, spell features, spells Spell Features: Read Magic and Shield See this post for explanations and more information. Read Magic Everyone should start with this Spell in BECMI, and it should be useful in some way. I tend to fold it into to Detect Magic. So as a Spell Feature: While this spell is prepared, you may spend 1 turn to Detect Magic. Simple, and it makes the spell perform a bit of a double duty, enhancing it's appeal somewhat. Also every Magic-User may choose to start with 1d6 vials of Scroll Ink. This ink cuts the cost of scribing a scroll in half, or it may be drunk by the very desperate. If you dare drink, save versus poison or die in 1d6 hours, castings of Neutralize Poison will only stave off death by an 1d6 additional hours and do not offer additional saving throws, additional quaffs of ink require another save, but will also reset the duration to another throw of 1d6 hours. Only a Wish or similar high order magics can prevent death in this fashion. Upon consuming Scroll Ink, you may re-prepare all your spells in 1d6 turns without the need for rest. Spells prepared this way leave your spell book and must be re-transcribed before they can be prepared again. The drawbacks and benefits of Scroll Ink usually only apply to the user who created the ink, although you are welcome to try and poison other Magic-Users with your ink. You are assumed to be casually collecting and briefly brewing the necessary reagents for HLSS vial(s) of Scroll Ink per level, but coming across a hogshead of Kraken Blue, a few gills of Gorgon Green, or a dram of Dragon's Blood during one's adventuring might stimulate this manufacture. Shield 1. Heraldic Gift – You have a k'''
