title = "d4 Caltrops: 2009"
full_description = "d4 Caltrops Blognard? Wednesday, February 18, 2009 Random Impedimenta (d100) Update (05/2019): Formatting on the table below leaves a lot to be desired for direct usability. Here are some PDF versions: Landscape| Single Page Vertical (includes an online generator) Slowly returning to blogging life, I’ve been making an effort to catch up on a few things. Over on Trollsmyth’s I mentioned a d100 table that I’ve been finding very useful during my recent games. Jeff requested that I share the chart. I believe he uses a similar method of distributing random items to characters (but with the added benefit of incorporating Index Cards). So without further ado, here’s the d100 chart of Random Impedimenta to foist upon foolhardy adventurers:1. Apple Core 51. Mummified Finger or Toe 2. Small Ball of Wax52. Nails or Tacks (d12)3. Berries (Dried or Fresh) (Blackberry, Blueberry, Cranberry, or Mulberry) (d12)53. Nuts (Acorns, Cashews, Pecans, Walnuts) 4. Bones (Bird, Mammal, Reptile, Humanoid)54. Palm Fronds, Pine Needles, or Cedar Shavings5. Bottle or Flask (Empty)55. Patch (Fabric, Hide, Leather, or Skin)6. Broken Buckle, Brooch, Clasp or Fibula56. Pebbles or Small Rocks (2d12)7. Broken Glass or Beads (Colored or Clear) (d12)57. Petals or Dried Flowers8. Butter Knife (Bone, Pewter, Silver or Wood)58. Piece of Antler or Small Horn9. Buttons (d12)59. Piece Of Charcoal10. Chess Piece (Bone or Wood) 60. Piece Of Fruit (Apple, Melon, Orange, or Pear)11. Chipped Cup or Mug (Bone, Clay, Tin, or Wood) 61. Piece of Tree Bark (Birch, Oak, Pine, Yew)12. Chunk of Algae, Fungus, Moss, or Lichen 62. Pieces of Candy or Sweets (d6)13. Claws, Fingernails or Toenails (d10)63. Pinch of Salt14. Clump of Brimstone64. Plum Pits, Pine Cones, Coconut Shell, or Cherry Stones (d6)15. Clump of Sand65. Metal Shavings or Powdered Rock16. Corks (d4) 66. Reed Flute or Harmonica17. Crude Bowl (Bone, Clay, Tin or Wood)67. Roots or Bulbs (d4)18. Crude Pipe (Bone, Clay, Corncob or Wood)68. Scrap of Cloth (Linen or Wool)19. Cubit of Wire (Copper or Tin)69. Scrap of Lace or Silk20. Dead Amphibian (Frog, Toad, Newt or Salamander)70. Seven Dried Herbs or Spices21. Dead Arthropod (Crab, Insect, Scorpion or Spider)71. Sewing Needle or Pin (Bone, Copper, Silver, Wood)22. Dead Mammal (Bat, Mouse, Shrew, or Vole)72. Shards of a Broken Mirror23. Dead Reptile (Lizard, Snake, Tortoise or Turtle)73. Simple Hairbrush or Comb (Brass, Bone, Tin or Wood)24. Ear (Elf, Human, Gnoll, Other)74. Single Cloth or Leather Glove or Mitten25. Ear (Ox, Rabbit, Pig or Wolf)75. Single Stocking or Sock26. Edible Shoots or Leaves (d12) 76. Skeleton Key27. Eggshells or Egg (Bird or Reptile)77. Skin (Mouse, Rabbit, Rat or Snake)28. Feathers, Hair or Scraps of Fur78. Small Ball of Tar or Resin29. Few Feet of Thread (d4)79. Small Chunk of Cheese30. Fish or Reptile scales80. Small Fossil or Shell31. Fishing Hooks (d4)81. Small Knife (Skinning or Whittling)32. Greenstone, Flint, Shale or Chert Shard82. Small Pumice Stone33. Foot of String, Twine or Yarn83. Small Shard of Petrified Wood34. Fork (Bone, Pewter, Tin, or Wood)84. Soiled Handkerchief, Bandanna, Rag or Scarf35. Glass Vial (Empty)85. Some Fruit Peels or Rinds36. Handful of Barley, Couscous, Oats, or Rice86. Spool (Bone, Clay or Wood)37. Handful of Dried Peppers or Peppercorns87. Spoon (Bone, Wood or Pewter)38. Handful of Flour, Grain, Meal or Spelt88. Stale Heel of Bread, Biscuts, or Crackers (d4)39. Handful of Seeds (Flower, Fruit, Tree or Vegetable)89. Stamp, Quill, Nib Pen or Chalk40. Incense Cones, Herbs or Sticks (d4)90. Stub of a Candle or Wicks (d4)41. Iron Arrow or Spear Head91. Teeth (d12)42. Jermlaine, Pixie or Sprite Skull92. Thimble (Bone, Clay, Silver, Tin, Wood)43. Ladle (Bone, Tin or Wood) 93. Tiny Bell (Brass, Tin or Silver)44. Leather or Hide Cord94. Tiny Ingot Of Metal (Iron, Pewter, Steel, Tin)45. Length of Ribbon95. Tiny Lead Figurine46. Little Box (Bone or Wood)96. Torn Vellum, Papyrus, or Parchment with Notes or Drawings47. Lock Pick (Elfnose, Faeriefork, Spiderlimb or Wyverntail)97. Twigs, Kindling or Slivers of Wood48. Lump of Tree Sap98. Two Dice (Bone or Wood)49. Morel Mushroom, Vanilla Bean or Cinnamon Stick99. Un-worked Strap or Belt of Leather or ide50. Morsel of Meat, Strip of Jerky100. Whistle (Bone, Tin or Wood)The Parenthetical Materials and Serving-Size Suggestions are by no means exhaustive, just brain food. I usually give each player a few rolls on the chart at the end of character creations (post equipment) and maybe a bonus roll or two for high Wisdom scores. I’d imagine the average value for items from this chart weighs in at around half a copper piece, and I’ve tried to keep encumbrance negligible. Many of the items are only as useful as the adventurer chooses to make them and some even become mini-McGuffins in their own right. Maybe my players are just suspicious of “free stuff,” but I’ve found that frequently, they make a concentrated effort to incorporate these tiny, inconsequential things into the adventure, attempting to distract a spider with a dead insect, using a piece of string to monitor activity on a dungeon door, et cetera. Naturally, I’m sure a list like this could have other uses (Spell Components, Dungeon Dressings, maybe even Gullet Contents), so let me know if and how you end up using it! Posted by ktrey at 12:04 PM 5 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, equipment, tables They certainly don't make them like they used to... I've been lax with the posting as of late. RC Hacks will continue eventually. In the meantime I've been playing as much as I possibly can, and the good news is it's mostly Classic.One of my co-workers found out that I play Dungeons & Dragons. She also played quite a bit of OD&D and 1st Edition in the mid-to-late seventies.She brought in all the miniatures that she still has, most of which she painstakingly painted and kindly let me photograph for posterity.If you can identify any of the figures, please don't hesitate to comment. Wherever possible I have included any intelligible markings I found on the bases.For Scale is an old Quadrille Pad (6 squares per inch). Enjoy! The Slideshow skips some Amazon warriors that were marked moderately/potentially risqué. Posted by ktrey at 12:06 AM 3 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Newer Posts Older Posts Home Subscribe to: Posts (Atom) Search Pages Random Tables OSE Encounter Activity Tables Beyond The Wall Resources Yoon-Suin Resources Labels random tables (285) d100 (283) tables (163) encounters (141) OSE Encounters (133) OSE (132) magic items (36) dungeons (23) equipment (19) monsters (19) dnd (17) wilderness tier (17) character generation (16) magic (16) spells (15) rumors (14) wilderness (14) clerics (13) magical items (12) treasure (12) NPCs (11) gear (11) generators (11) house rules (11) spell features (11) hex crawls (10) hexes (10) BECMI (9) RC hacks and house rules (8) ideas (8) plants (8) advancement (7) dnd hacks (7) magic users (7) names (7) resources (7) adventure hooks (6) characters (6) cities (6) dressing (6) events (6) settlements (6) weapons (6) animals (5) backgrounds (5) classes (5) clues (5) curses (5) dolmenwood (5) domain tier (5) dungeon stocking (5) religion (5) set dressing (5) shrines (5) treasures (5) why tables (5) yoon-suin (5) character sheets (4) current campaign (4) dragons (4) fairy tales (4) hooks (4) mountains (4) reviews (4) stocking (4) team tuesday (4) villages (4) what tables (4) 4e (3) Elfs (3) TROIKA! (3) WHITEHACK (3) abilities (3) armor (3) cantrips (3) carousing (3) character classes (3) decoration (3) dm (3) domain (3) doors (3) dungeon dressing (3) fair folk (3) food (3) foraging (3) foreground growth (3) fourth edition (3) fungi (3) goblin project (3) hirelings (3) landmarks (3) locks (3) mentzer (3) mushrooms (3) potions (3) procedures (3) quests (3) religions (3) rules cyclopedia (3) spellbooks (3)