full_description = "d4 Caltrops Blognard? Thursday, January 4, 2007 Hello RPG Blogosphere Every few months, I find myself re-bitten by the role-playing bug. Like the majority of my cyclic hobbies and interests, it will move to the forefront and displace all other leisure pursuits until the itch is sufficiently scratched. Moving a thousand miles away from my most recent gaming group means that I can probably expect blood underneath my fingernails before too long. So I’ve started up a gameblog to scratch the itch, a place to muse and reminisce about a hobby that I tend to periodically neglect, but always seem to enjoy. Posted by ktrey at 10:40 AM Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest No comments: Post a Comment BLOG_CMT_createIframe('https://www.blogger.com/rpc_relay.html'); Newer Post Home Subscribe to: Post Comments (Atom) Search Pages Random Tables OSE Encounter Activity Tables Beyond The Wall Resources Yoon-Suin Resources Labels random tables (285) d100 (283) tables (163) encounters (141) OSE Encounters (133) OSE (132) magic items (36) dungeons (23) equipment (19) monsters (19) dnd (17) wilderness tier (17) character generation (16) magic (16) spells (15) rumors (14) wilderness (14) clerics (13) magical items (12) treasure (12) NPCs (11) gear (11) generators (11) house rules (11) spell features (11) hex crawls (10) hexes (10) BECMI (9) RC hacks and house rules (8) ideas (8) plants (8) advancement (7) dnd hacks (7) magic users (7) names (7) resources (7) adventure hooks (6) characters (6) cities (6) dressing (6) events (6) settlements (6) weapons (6) animals (5) backgrounds (5) classes (5) clues (5) curses (5) dolmenwood (5) domain tier (5) dungeon stocking (5) religion (5) set dressing (5) shrines (5) treasures (5) why tables (5) yoon-suin (5) character sheets (4) current campaign (4) dragons (4) fairy tales (4) hooks (4) mountains (4) reviews (4) stocking (4) team tuesday (4) villages (4) what tables (4) 4e (3) Elfs (3) TROIKA! (3) WHIT