full_description = "d4 Caltrops Blognard? Monday, April 21, 2008 MKhexgrid Just a quick note about some lovely software I stumbled across while trawling the internet for Numbered Hex Maps:MKhexgrid - a hex grid generatorThe following spec.txt file seems to be working really well to generate a full page of decently sized, numbered hexes:columns = 30rows = 20hex-side = 30grid-grain = voutput = pngoutfile = tut3.pngantialias = truecoord-bearing = 90coord-distance = 18Numbered hexes are the only way to map, and stocking all the hexes on Index Cards means that adventurers are never wont for adventures. Posted by ktrey at 9:48 AM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: cartography, maps, software Newer Posts Older Posts Home Subscribe to: Posts (Atom) Search Pages Random Tables OSE Encounter Activity Tables Beyond The Wall Resources Yoon-Suin Resources Labels random tables (285) d100 (283) tables (163) encounters (141) OSE Encounters (133) OSE (132) magic items (36) dungeons (23) equipment (19) monsters (19) dnd (17) wilderness tier (17) character generation (16) magic (16) spells (15) rumors (14) wilderness (14) clerics (13) magical items (12) treasure (12) NPCs (11) gear (11) generators (11) house rules (11) spell features (11) hex crawls (10) hexes (10) BECMI (9) RC hacks and house rules (8) ideas (8) plants (8) advancement (7) dnd hacks (7) magic users (7) names (7) resources (7) adventure hooks (6) characters (6) cities (6) dressing (6) events (6) settlements (6) weapons (6) animals (5) backgrounds (5) classes (5) clues (5) curses (5) dolmenwood (5) domain tier (5) dungeon stocking (5) religion (5) set dressing (5) shrines (5) treasures (5) why tables (5) yoon-suin (5) character sheets (4) current campaign (4) dragons (4) fairy tales (4) hooks (4) mountains (4) reviews (4) stocking (4) team tuesday (4) villages (4) what tables (4) 4e (3) Elfs (3) TROIKA! (3) WHITEHACK (3) abilities (3) armor (3) cantrips (3) carousing (3)