title = "d4 Caltrops: 2015"
full_description = "d4 Caltrops Blognard? Wednesday, September 30, 2015 Spending, Clerics: Third Level Shrines Third Level Shrines o Primary Benefit: Level 3 Cleric/Druid Spells o Activate: Turning Check vs Vampire o Area of Influence: 1 Hex Level Three Shrines are generally impressive and elaborate structures, sometimes easily exceeding 50 square feet in area. Almost always featuring a building of some sort (get your Stronghold Building Rules handy) or simply massive in scale (think Stonehenge). o Level Three Shrine Components: In addition to requiring an Altar valued at least 2,000 gold pieces (usually metal and etched/decorated, but expensive/imported stone is acceptable for Druids), and at least 5,000 gold pieces invested in statuary/stonework (as Level Two Shrines), they nearly always also include at least one or more of the following very expensive features: Components Cost (in gold pieces) Finely Carved Stone Columns, religiously significant number 5,000 each Stained Glass of breathtaking beauty: 2,500 per window Bronze/Metal Statuary triple price of the 2nd Level Shrine Prices Brobdingnagian Statuary/Menhir/Dolmen ten times the 2nd Level Shrine Prices Add-Ons Cost (in gold pieces) Apply gilding +500 gold pieces per square foot of surface area Inlay with Gems or Precious Stones: +50 gold pieces each (does not include price of gemstones, which add value/count as money spent) Attract Treant Attendant (can animate other trees in defense of the Shrine) +10,000 gold pieces and a major adventure Embed sentient Undead (up to Vampire) Go find one. Fee is negotiable and typically quite dear. The exorbitant prices are intentional. The ramifications of “free” Cure Disease, Remove Curse, and Call Lightning Spells bear careful consideration. Level Three Shrines take at least a week to construct per 1,000 gold pieces used in their construction, and as with all Shrines must be thrice-Blessed Daily (only first and last Blessing need be provided by the Character). The extensive amount of time and manpower required to construct a Level Three shrine can create something akin to a tiny hamlet near the Site during construction, with all the associated and mouths to feed and inevitable threats to face down. o Third Level Shrine Offerings: In addition to the typical offerings above for Shrine Levels 1 and 2 (which are required to be worth at least 10 gold pieces and 20 gold pieces respectively, and are not optional), the following sample Offering types are appropriate for a Level Three Shrine: Typical Level Three Offerings (value by type) Silver, Gold or Electrum Religious Crafts (should be valued at least 30 gold pieces) Livestock (at least 30 gold pieces in value, at least 3 HD worth) Sacrifice/Bloodshed (1HD, or at least 3d6 HPs worth of self-inflicted bloodshed) To Cast or Benefit from the Spell: Make a Turning Check versus 8 HD (as Vampire) with a bonus of +1 per 30 gold pieces/3 HD/3d6 HP spent on Votive Offerings (they are burnt/destroyed/consumed in the process). If successful, the altar grants the prayer. This ability can be activated once per month period for every 1,000 gold pieces spent in the construction of the Shrine (minimum one, and 30,000+ gold pieces investment will make it a daily Shrine). Optional Secondary Benefit: As long as the Cleric is within one hex of a given Shrine that they’ve created they also enjoy a +3 to Reaction Rolls (as long as Alignment is at least a single step away). Optional Tertiary Benefit: In addition pick one of these options when the shrine is constructed (these benefits also only function within one hex of the Shrine, and only if an offering was made to the shrine within 24 hours): All of Turning Checks versus Undead made by your faith are made with 2d12 instead of 2d6. All “naturally occurring” and animated undead are turned as 3 category higher. You are no longer subject to Surprise. o Third Level Shrine Influence: Level Three Shrines of opposing faiths/pantheons cannot be constructed within one hex of each other. Any lower level Shrines of Opposing faiths within a hex cease to function as long as the value of their construction is exceeded by this one. Shrines of this Level also begin passively attracting Pilgrims and Permanent Attendants and can even be used a source of income (Oh drat, more money to spend!) for the more unscrupulous types. Pilgrimage is another Player money-spending scheme I’ll try to cover in a future post, but until then: Chance To Attract Pilgrims: cumulative 5% each time the shrine is activated, I’d just use Rules Cyclopedia Nomads (Page 193). This resets every season. Chance to Attract an Attendant: cumulative 1% each time Shrine is activated. This resets if the attendant is driven off or slain. Typical Attendants are Clerics of the Shrine’s faith, of a minimal level of six. This is also when Shrines typically start garnering attention from Petty Gods. Add one to the Random Encounter Table for this hex/area. Third Level Shrines very often also become part of the Reliquary/Relic Circuit (to be covered in Pilgrimage). Level Three Shrines with attendants that have attracted Pilgrims have a tendency to accumulate Treasure as Type U in the form of donations, melted slag metal from offerings, etc. Check once a month. This money is typically funneled back into offerings and upkeep for the Shrine, but many a spendthrift Cleric has had to raid their Shrine’s coffers in desperation. Posted by ktrey at 4:08 PM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: advancement, clerics, shrines, wilderness tier Spending, Clerics: Second Level Shrines Second Level Shrines o Primary Benefit: Level 2 Cleric/Druid Spells o Activate: Turning Check vs Mummy o Area of Influence: 1 Mile At Each Level, Shrines generally become larger and more impressive than their lower level counterparts. Second Level Shrines generally consist of an area of at least ten feet square and sometimes even include a small building or other structure. o Second Level Shrine Components: Shrines of this magnitude nearly always display something with more permanence than their First level counterparts. Altars for Level Two Shrines are generally larger (double price), and wood is unacceptable as a material for the altar itself. Typically of some kind of statuary or stonework (be it a bust, mosaic, or bas-relief) or arboreal feature is incorporated into a Level Two Shrine, samples below: Basic Components Cost (in gold pieces) Stone Bas-Relief, middling quality 500 Stone Bas-Relief, exceptional quality 1,000 Tri-Color Mosaic with unsophisticated subject matter 350 Impressively Intricate Mosaic, dozens of colors 900 Sculpted Bust, sparse detail 200 Sculpted Bust, lifelike in resemblance 600 Stone Font, Simple and Dry 100 Stone Font, Suitable for Holy Water Consecration, Dry 200 Scrying Pool, Dry 600 Simple Statue, single seated figure 1,000 Simple Statue, free-standing 3,000 Trees free if planted (must be Blessed) Add-Ons Cost (in gold pieces) Connecting to a Spring or natural Water Source (if present): +500 Magical Water Source +5,000 Statuary Improvement: Fair Quality +1,000 Unremarkable, but talentedly arranged +2,400 Exceptional Quality +6,000 Masterpiece +10,000 Magic-Mouthing Benedictions/Maledictions +5,000 Grove Improvement: Reagents for the Song of Rapid Growth +100 per foot of desired trunk diameter Special Soils that cause fruit to act as Goodberry +2,000 each plant Axebane Enchantment (bark becomes as Iron) +5,000 per tree Firebane Enchantment +2,500 per plant Attract Centaur Tribe/Dryad Shrine Attendant(s) +8,000 gold pieces and a minor quest/adventure Undead Embed non-sentient Undead (Skeletons/Zombies) +500 per HD & Animate Dead Spell Embed Ghouls as above, plus source of Food (nearby graveyard) Transport costs and even hiring caravans of wagons to move the construction material are almost certainly going to further increase costs. o Second Level Shrine Construction: A Level Two Shrine takes at least 1 day per 500 gold pieces spent. It must still be Blessed thrice daily (although only the initial and final Blessing need be provided by the Character creating the Shrine) so this may also have associated costs with hiring/overseeing the process. o Second Level Shrine Benefits: To cast or become the recipient of the spell, offerings are placed on the altar. In addition to one of the typical offerings of a Level One Shrine (which are required to be worth at least 10 gold pieces, and are not optional), the following sample Offering types are appropriate for a Level Two Shrine: Typical Level Two Offerings (should be valued at least 20 gold pieces) Waxen, Clay, or Wooden Religious Crafts Grain or Trade Goods (Common Spices, Bolts of Fabric, Salt) Holy Water To Cast or Benefit from the Spell: Make a Turning Check versus 6 HD (as Mummy) with a bonus of +1 per 20 gold pieces spent on Votive Offerings (they are burnt/destroyed/consumed in the process). If successful, the altar grants the prayer. This ability can be activated once per week period for every 1,000 gold pieces spent in the construction of the Shrine (minimum one, and 7,000+ gold pieces investment will make it a daily Shrine). Optional Secondary Benefit: As long as the Cleric is within one mile of a given Shrine that they’ve created they also enjoy a +2 to Reaction Rolls (as long as Alignment is at least a single step away). Optional Tertiary Benefit: Pick one of these options when the shrine is constructed (these benefits also only function within 1 mile of the Shrine, and only if an offering was made to the shrine within 24 hours): · All of Turning Checks versus Undead made by your faith are made with 2d8 instead of 2d6. · All “naturally occurring” and animated undead are turned as 1 category higher. · Upon preparing to sleep, choose a specific entity. You will dream of, and be aware of their rough location within the current hex, or if they enter the hex within 24 hours. o Second Level Shrine Influence: Level Two Shrines of opposing faiths/pantheons cannot be constructed within one mile of each other. Any Level One Shrines of Opposing faiths within a mile cease to function as long as the value of their construction is exceeded by this one. Posted by ktrey at 3:15 PM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: advancement, clerics, shrines, wilderness tier Newer Posts Older Posts Home Subscribe to: Posts (Atom) Search Pages Random Tables OSE Encounter Activity Tables Beyond The Wall Resources Yoon-Suin Resources Labels random tables (285) d100 (283) tables (163) encounters (141) OSE Encounters (133) OSE (132) magic items (36) dungeons (23) equipment (19) monsters (19) dnd (17) wilderness tier (17) character generation (16) magic (16) spells (15) rumors (14) wilderness (14) clerics (13) magical items (12) treasure (12) NPCs (11) gear (11) generators (11) house rules (11) spell features (11) hex crawls (10) hexes (10) BECMI (9) RC hacks and house rules (8) ideas (8) plants (8) advancement (7) dnd hacks (7) magic users (7) names (7) resources (7) adventure hooks (6) characters (6) cities (6) dressing (6) events (6) settlements (6) weapons (6) animals (5) backgrounds (5) classes (5) clues (5) curses (5) dolmenwood (5) domain tier (5) dungeon stocking (5) religion (5) set dressing (5) shrines (5) treasures (5) why tables (5) yoon-suin (5) character sheets (4) current campaign (4) dragons (4) fairy tales (4) hooks (4) mountains (4) reviews (4) stocking (4) team tuesday (4) villages (4) what tables (4) 4e (3) Elfs (3) TROIKA! (3) WHITEHACK (3) abilities (3) armor (3) cantrips (3) carousing (3) character classes (3) decoration (3) dm (3) domain (3) doors (3) dungeon dressing (3) fair folk (3) food (3) foraging (3) foreground growth (3) fourth edition (3) fungi (3) goblin project (3) hirelings (3) landmarks (3) locks (3) mentzer (3) mushrooms (3) potions (3) procedures (3) quests (3) religions (3) rules cyclopedia (3) spellbooks (3) s