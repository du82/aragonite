title = "d4 Caltrops: 2020"
full_description = "d4 Caltrops Blognard? Tuesday, December 22, 2020 One Hundred Magic Missiles Magic Missile is a popular first level spell in virtually all editions, but I have always found it to grow a little monotonous over time. I often encourage my players to come up with a “signature” look and feel for their sorcerous projectiles. Just a little bit of ornamentation and embellishment over the frightfully dull “glowing arrow” default. Since it always hits (except in that wonderfully quirky Holmes), and engenders no Saving Throw it’s a wonderful candidate for “Never Name Your Spell” in the hands of wicked Wizards and malevolent Magic Users. But how should one describe it to preserve this mystery? Here is a d100 Table to help. A hundred entries that you can roll or choose from to give our old stand-by a bit of a makeover. These should usually be treated as strictly cosmetic of course (unless you think it would be fun not to), with the actual evocation behaving as we have grown to expect over the years. After all, 1d6+1 can be re-skinned in uncounted ways. Posted by ktrey at 4:02 PM 5 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, random tables, spell features, spells, tables Friday, November 13, 2020 More Mountain Hexes IV It is Friday! Here are five more Mountain Hexes! (part of my Wilderness Hexes project). We have made it to 40, so I might take a detour into the Swamps for a chance of scenery. Browse the hexes tag on this blog for more. Posted by ktrey at 5:55 PM 3 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: hexes, mountains, wilderness, wilderness tier Tuesday, November 10, 2020 Voronoi Diagrams and the City Crawl I tend to prefer using Voronoi Tesselations/Diagrams for my Urban Adventures/City Crawls instead of the traditional Grids or Hex Maps. They just feel more organic to me, and can really capture how sometimes it takes longer to move from one dense/crowded/difficulty planned area to another. Distances are seldom in a straight line in Cities, and it's easy to get turned around or lost in an unfamiliar Urban Center without a Guide. I dislike relying as much on measuring out precise distances these days, instead preferring to think of navigating Cities more in terms of resource consumption and procedural checks. Unlike in a Standard Dungeon, Food/Water/Light should be relatively easy or at hand (provided the characters are not utterly destitute) so the resources we’re dealing with are generally TIME and MONEY. TIME to meet deadlines assocaited with hooks/rumors/adventure, and MONEY paid to Guides or for Information to reduce TIME. As the old adage goes: They are often one in the same. Also throwing another wrench in the works are Produral Checks: Bad Weather, Encounters, and other unusual Events that can breathe life into an area (a neighborhood wide Celebration clogging the streets, Hue and Cry from a Crime udnerway, etc.) Here’s a quick way to generate a Voronoi City Map for a Crawl that produces something like this: First, locate a map you like or create one. The example above uses this twitter account: https://twitter.com/metropologeny (you can generally right click on an image here, and “Open in a New Tab” to obtain a URL to use in the next step). Next, go here: http://cfbrasz.github.io/Voronoi.html Paste the URL from the twitter account in the “Display Image with URL” box. Then, if you prefer, you can use your mouse to place points and divide the map into districts/neighborhoods/sections/quarters, or if your lazy, you can uncheck the “Update diagram on mouse move” check box, and then place a number in the Add box and click Generate until you see something that looks interesting or usable. I like going with “20” sites, for ease of randomization with our handy, ubiquitous icosahedron, but for sparser/denser maps other site amounts might work a little better. And there you have it: Fairly quick Voronoi City Crawl Map! You can number the sites (those dots make them a little easier to identify), whip together some Exciting/Evocative Smells, some interesting NPCs with Professions that can help you intuit the primary shops or industry of an area, or perhaps a City Dweller Event as a “hook” or ongoing item of interest, and tailor a few Encounter/Event Tables to the different regions to give it some real flavor and flair. You could even stock them like Dungeon Rooms (Encounter, Hazard, Treasure, etc.) with some judicious reskinning. I am very tempted to start working on a few more Tables that can help with Urban Crawls. One can never have enough random inspiration to cut down on tedious preparation! Posted by ktrey at 5:40 PM 3 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: cities, city crawls, mapping, tools, voronoi Thursday, October 29, 2020 More Mountain Hexes III Five more Mountain Hexes! (part of my Wilderness Hexes project) Browse the hexes tag on this blog for more. Posted by ktrey at 11:02 AM 1 comment: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: hex crawls, hexes, mountains, wilderness tier Wednesday, October 21, 2020 Return of the Mountain Hexes II Decided to dust off my Wilderness Hexes project and continue climbing towards 100 for each Terrain-type. Here are five more Mountain Hexes! Here's a brief breakdown of what's in this draft: An Intriguing Religious RuinA Well-Earned Scenic VistaBlanched, Barrow-Like CragsA Humongous HermitA Meeting of Massive Waterfalls Browse the hexes tag on this blog for more. Posted by ktrey at 9:59 AM 2 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: hex crawls, hexes, mountains, wilderness tier Thursday, October 15, 2020 RC Hacks & House Rules pg 15: Turning Undead Table Reviving these old Rules Cyclopedia posts to talk a little bit about a resolution system I’ve been intrigued by for a while now. Even though this is ostensibly a Rules Cyclopedia hack/house rule, it is naturally applicable to B/X and OSE as well. On this page we have the table that a Cleric consults for Turning Undead. Specifically, I’ve been recently interested in Repurposing the Cleric’s Turn Undead Matrix for resolving various other tasks like “Thief Special Abilities” (I’ve discussed these in the past here). It can also be used to supplant the “Optional Ability Score Check” form of resolution for other tasks, which while convenient, is a crutch I have never particularly enjoyed employing for a variety of reasons. Here is a quick simplified reproduction to refamiliarize you with how the table works (I’ve never been too fond of how the Rules Cyclopedia swaps the axes, and how it provides named Undead instead of HD...but I suppose that’s a nice way to telegraph some setting if you squint at it): While not as robust or simple as the sainted Saving Rolls in Tunnels & Trolls (first universal task resolution system in an RPG!) because of the table lookup, I still think the Turning Undead Matrix checks a lot of my boxes for Task Resolution. Let us go over a few of these advantages first: It accounts for Character Level The often used “Optional Ability Score Check” relies on Scores that do not strictly improve in most games and is usually just a simple roll under for pass/fail. This ties competency to one of the first six rolls players make to play the game during Character Generation and I’ve always felt it unduly punishes those with low scores but sufficient Player Skill to advance in level. It accounts for Task Difficulty The “Optional Ability Score Check” usually has to be modified via ad hoc fiat for this (giving a “bonus” to the roll in the form of a negative number or increasing the ability score for the purposes of the roll), just as Thief Special Abilities sometimes receive that “circumstantial bonus” for a Rusty/Shoddy Lock. With the Turn Undead table, there is a clear progression. Some Undead woefully outclass the Cleric at first, but with each level gained, new opportunities become available, and prior threats soon become trivial. Rolling High Is Good Both the “Optional Ability Check” and Thief Special Abilities rely on a Roll Under comparison for resolution, while many other conventions in the rules incentivize the player’s rolling higher for better results. I’m not fanatical for this kind of symmetry in the rules, but the momentary cognitive whiplash of having to parse a “natural 20” as “bad” frustrates some players. It isn’t as “Swingy” in terms of probability (ie: it leverages the 2d6 Bell Curve distribution instead of a single d20 or d100 roll) This makes median results appear more common over time (which does wonders for assuming default competency with tasks). There is seldom anything as de-protagonizing as that persistent 5% chance of a “20” on a Roll Under Check. Even with the highest natural Ability Score of 18, failing 10% of the time isn’t really reassuring. It features “Degrees of Success” that are not really present outside of a few other places (such as the Reaction Roll, which is probably a close cousin to this table) T for “automatic Turn” and D for “automatic Destroy” result in different outcomes, producing different situations in play. Ability Score Checks/d100 Thief Special Abilities are normally a binary pass/fail. It places Dice in the Player’s Hands Some Thief Special Abilities are often rolled by the DM (Hear Noise, Find Traps, Move Silently, Hide In Shadows) because the results of the die roll can immediately dictate success/failure based on percentage chances or interfere with strategy (“Just because I didn’t find any traps...doesn’t mean there aren’t” etc. ) With the “Hazard Difficulty Level” obfuscated, the Player can still roll, while the DM consults the matrix for resolution. This is closer to the To-Hit/AC Comparison so it supports this kind of hidden information, but more importantly it doesn’t force players to witness their failure in real time, and creates an opportunity for narrated consequences rather than immediate assumptions of failure. It allows the Character to Attempt things outside of their normal Level A First Level Cleric can attempt to turn 2d6 Ghouls (2* HD Monsters with a very powerful and potentially devastating Special Ability) although these chances are somewhat slim (only an 8.34% chance of rolling 11+ on the 2d6) this could easily circumvent a nearly certain TPK at lower levels. This incentivizes trying things that might seem out of a Character’s Scope, and I always like to encourage that. Two Dice Rolled provide interesting opportunities for grafting on additional sub-systems/deriving metadata or repurposing the roll: Doubles can have significance, both for “successful” doubles and “unsuccessful” doubles. This could even mandate a 2d6 roll on the automatic “T” and “D” results if you wish. The highest or lowest result can be used on a simple d6 table They could even be read as a d66 for an additional 36 entry table look up So, with all these features available to us, how can we leverage the Cleric’s Turning Matrix for some Task Resolution outside of dealing with Undead? Here are some ideas: Thief Special Abilities: HD can be very easily re-contextualized as “Hazard Difficulty” in addition to the more common definition of “Hit Dice.” When establishing a Hazard Difficulty via fiat is not preferred or is not immediately apparent based on the fiction, one simple way to do so would be to use “level of the Dungeon” for Thief Special Abilities with a static/inanimate target (Open Locks, Find Traps, Remove Traps, etc.) or even “HD of Foe” for others that directly target a living creature (like Pick Pockets/Move Silently). Example: A 1st Level Thief wishes to Open A Locked Dungeon Door. They have descended to the second level of the dungeon (base Hazard Difficulty 2), so a 9+ is needed on 2d6. This does mean that a 1st level Thief travelling to the 4th level of a dungeon will be facing some pretty insurmountable odds by default (although see below for some ways to allow for players to make decisions that address this by lowering Hazard Difficulty), but this does have the side effect of telegraphing danger directly, and even emphasizing the need for caution when exploring a dangerous new area. Let us go through the Thief Special Abilities to see how this could work. Keep in mind that I only engage a resolution mechanism for these whenever the outcome would be interesting, and failure has consequences. An example I often use is that any Thief worth their salt, given the proper tools and enough time would be able to Open just about any nonmagical lock under ideal conditions, but these kinds of conditions are seldom found in the Mythic Underworld/Adventure Environment. Open Locks: Level of Dungeon/Threat is a good way to establish initial Hazard Difficulty here, potentially adjusting it upward/downward for particularly complex/simple locks as necessary. I generally rule that Opening A Lock takes at least 1 Turn of activity on average and rolling above the number or achieving the T result on the Matrix means the Lock opens in 1 Turn (~10 minutes). For a D, this could be Hazard Difficulty in Rounds as deft, experienced hands swiftly guide their tools to the appropriate tumblers. Have particularly perfect Tools? Lower Hazard Difficulty. Wish to take more time on a tricky (re: Higher Level lock), each additional Turn spent lowers the Hazard Difficulty for your roll by 1 (remember to check for those Wandering Monsters). Locked doors become much less of a barrier to exploring the environment with this system, but they consume resources in the form of Time with its associated Encounter Risk. Doubles on Failure could indicate Loss of a Lockpick/Tool, jammed lock. Successful doubles: reduce the duration to 1 round. Find Traps: Level of Dungeon/Threat can again serve to establish initial Hazard Difficulty. Similar durations to above, and more time spent carefully investigating could reduce the target. With these “Detection” based Thief Abilities (this, and Hear Noise), there has to be something there to find, naturally, and to address the ponderous “constantly searching” problem I tend to allow those “D” results to just outright reveal traps of corresponding Threat as they’re encountered (a “Level 1 - Barely concealed Trip Wire” is completely obvious to a Footpad (2nd level Thief). It’s usually the consequences of interacting with the Trap or it’s Triggers that create the interesting situation, not the de-protagonizing “Gotcha! Please make a Saving Throw!” Remove Traps: Level of Dungeon/Threat again for initial difficulty. Similar durations to above, and more time spent carefully investigating the Trap/Triggers could potentially reduce this. Here we can leverage the 2d6 die roll in interesting ways in the event of Success/Failure if we wish to add some additional tension. Rather than just “springing the Trap” on Failure, perhaps it only springs if Failure and Doubles are rolled. Doubles on a “succes"
