full_description = "d4 Caltrops Blognard? Wednesday, March 5, 2008 Mentzer Basic Set II Gygaxian Memorial Transcript continued: DM: “Mapper makes the maps. Here pick out some miniatures from the pile. Arrange them in your Marching Order.” Fighter: “You should go first Fighter, you have more HP than me.” Fighter: “Sure.” Cleric: “What’s a Caller?” DM: “They are the speaker of the Party. They make all the decisions and tell the DM what the parties doing. Kinda like a leader.” Cleric: “I don’t remember that at all…” DM: “Yep, it was eventually dropped so that a “Leader” wasn’t hard coded into the rules, but I still think it’s a great idea, and it does speed up play. Who has the highest CHR?” Cleric: “Mines 15.” Magic-User: “I have a 16” DM: “Magic-User is the Caller. What is everyone going to do Caller. You guys can talk to each other now.” Players (aping the old saw): “Hello.” Magic-User: “I guess we’re going to go into the dungeon.” DM: “Great, who’s going first.” Magic-User: “Fighter.” DM: “Cool. You descend the long rope into the dank and musty darkness. It seems to go on for several yards. Where’s everyone else?” Players: “We’re following him.” DM: “Everyone down the rope at once? Awesome. Fighter, when your feet finally hit the flagstones of the dungeon floor, you notice that the light above is barely as wide as a buckler.” Fighter: “I wanna light a torch.” Cleric: “Me too.” DM: “Go ahead. As the torch sputters into life, you see that the room is about 20 by 20 feet, Mapper, you getting this?” Fighter: “Can I get some Graph Paper?” DM: “Whoops. My bad. Here you go. Where was I? Ah yes. The room is covered in webby strands of…uh..web…some as thick as a man’s arm. There do not appear to be any visible exits.” Cleric: “Watch out for Spiders.” Fighter: “I want to search the webs.” Fighter: “I want to search the room for treasure.” Cleric: “I’ll search the room too.” DM: “Alright Searchers. Roll a d6.” Fighter: “d6 really?” DM: “Yep. Technically I’m supposed to roll, but I barely have room behind this screen with all these wandering monsters.” Fighter: “4” Fighter: “6!” Cleric: “1” DM: “Alright Cleric, you find a large double door hidden under some of the webs in the center of the southern wall. You can probably use a torch to remove most of the webs from around the door to get a better look at it.” Cleric: “I’ll do that. I’m also watching out for Spiders.” DM: “Good. Because you see some movement in the webs above. Large shadows that probably aren’t just the affects of your wavering torch light.” Cleric: “Guys! Spiders.” Fighter: “I want to try and open the door.” DM: “It seems stuck. It looks like it opens outward.” Magic-User: “Try pulling it open.” Fighter: “I try pulling it open.” DM: “The door still doesn’t budge. It may need to be broken down.” Cleric: “Guys! Spiders!” Fighter: “I WILL SMASH THE DOOR! I’m going to run up to it and ram it with my shoulder.” DM: “Awesome. Roll a d6 and add your STR bonus” Fighter: “5!” DM: “The door seems to creak on its hinges and settle a little bit and gives way, covering you with dust. It hangs loosely and looks like it will open now, but you’re to distracted by the Cleric’s warning about Spiders to investigate the door further.” DM pulls out to Spider Miniatures. Fighter: “Whoa, those are big spiders.” DM: “Alright, no one is surprised, but we have to roll initiative.” Fighter: “d20 plus DEX?” DM: “Nope. Straight d6.” Fighter: “Weird.” DM: “Yep but I’ve always felt it was quicker, a little more realistic.” Fighter: “I think I tied with Fighter.” DM: “There are a lot of ties with this system, so we’ll use the highest DEX score to break ties. Alright, Combat begins by going around in initiative order and declaring intentions.” Players: “What?” DM: “Just state what you’re character’s going to do, we’ll start with Fighter because he has the best initiative. After we go around once with the intentions, then we’ll resolve them with actual combat rolls or what-have-you, but a lot can change between then and now, so watch out if you have to change your mind at the last minute.” Fighter: “I guess I’m first. My intentions are to Run up to the closest spider and drive my battle axe deep into his abdomen.” Fighter: “I’m going to try to hit the other one with my sword.” Cleric: “I’m going to try and throw my torch at one of them.” Magic-User: “I’m going to start casting my one spell.” DM: “Which one did you prepare today?” Magic-User: “Sleep.” DM: “Okay, you pull out a pinch of sand from your spell components pouch. And the Spiders are creeping toward you across the cold and dusty dungeon floor. They’re intentions are to attack.” Fighter: “Attack of Opportunity?” DM: “Nope.” Flipping through the monster section, I really miss these small stat blocks. Crab Spider. Sure. DM: “Okay First Fighter, the AC of these beasties is 7, consult your handy chart and it’ll tell you what you have to roll above to hit it.” Fighter: “14, hit! Do I roll damage?” DM: “Sure, I’ll roll the Hit Dice too.” Fighter: “7.” DM: “Your battle axe cuts deep into the spider’s abdomen and its greenish blood oozes out in a spray. The spider flips over onto its back and it’s legs twitch frantically and then grow still.” Fighter: “Sweet.” Fighter: “I’m attacking the other one. Let me see. 16. Hit!” DM: “Roll damage. I’ll roll its hit dice.” Fighter: “5. I don’t have a strength bonus.” DM: “Your sword slices off two legs with one swing, and the follow up blow finishes off the spider.” Cleric: “Magic-User, stop your spell!” Magic-User: “Stopped.” Fighter: “I’m going to try to look for treasure in the room again.” Cleric: “Me too.” Fighter: “Me too.” DM: “Great. D6s everyone. Remember searching like this takes a full turn, and it means I get to roll for wandering monsters!” Fighter: “I rolled a 1. Crap.” DM: “Actually, a 1 is good on this roll. It’s what you want. The demi-humans have better chances to find certain things though. You find a skeleton of a hapless adventurer, wrapped up tightly in webs, its still wearing it’s chainmail, although it is difficult to see covered in webs.” Cleric: “I’ll use my torch to burn away the webs.” DM: “Done. The chainmail armor looks very well made, if tarnished a little bit, and covered in strange symbols and decorations.” Fighter: “Magic-User! What can you tell me about this armor?” Magic-User: “It’s Armor. It looks well made. It’s covered in strange symbols.” Fighter: “Can you read them?” Magic-User: “I dunno. DM?” DM: “It’s Elven. You studied it during your apprenticeship. It seems like family tree of some sort. Could be magical armor.” Cleric: “Let’s get the guy out.” DM: “You’ve seen a few skeletons with the burial practices of your church, and this one looks elven.” Fighter: “Anything else on the body?” DM: “There appears to be a rolled scroll of parchment with some more strange writing on it. And a belt pouch with some copper pieces in it.” Fighter: “Magic-User! Magic-User!” Magic-User: “Can I read it.” DM: “Yep, the arcane writings are in Elven. I never did like the Read Magic thing. It’s a scroll of Magic Missile, written by an powerful Elven spellcaster.” Fighter: “Awesome! Magic Missle rules!” Magic-User: “I’ll take it.” Fighter: “Who wants the copper pieces?” DM: “There’s about 30 of them. Which reminds me: XP.” Fighter: “XP? During the adventure?” DM: “Yep. That’s how we’re doing it. You can even level mid-combat. So let’s see, 40 XP for the Spiders, and the 30 copper is worth 3 XP. Split it up however you deem fair.” Fighter: “I think we should divvy the treasure up later. Who wants to carry it?” Fighter: “I’ll be the Treasure Master. You carry the armor.” DM: “Sounds good to me. The Chainmail takes up most of the room in your backpack though.” Cleric: “Anyone want to search the room one more time?” DM: “What say you Caller?” Magic-User: “Sure.” Rolling of the dice. Cleric: “ONE!” DM: Ah, in one corner of the room you find a small wooden chest almost completely obscured by webbing.” Cleric: “I’m going to burn the webs off with my torch, and use my Mace to carefully scoot it out of the corner.” DM: “Disturbing a great deal of dust, the chest slides across the flagstones. It’s heavy oak and well weathered. It is bound with cast iron bands and does not appear to have a lock.” Cleric: “Crap. I hate this part. I’m going to carefully try to open it using my Mace.” DM: “The chest seems to sigh as you open the lid, rust makes the hinges quite noisy, but the lid does open fully and reveals to tiny vials of liquid. The rest of the contents appear to have long since decayed.” Cleric: “Magic-User! Magic-User!” Fighter: “Potions. What can you tell us about the Potions?” Magic-User: “Um. They’re potions.” DM: “One is amber colored, and the other reminds you quicksilver with the way that it clings to the side of the bottle. The fact that the liquid is also silver doesn’t hurt either.” Magic-User: “Do I know anything about Alchemy?” DM: “You can take a small taste of the potion and try to divine what it does that way.” Magic-User: “What if it’s poisoned?” DM: “Well that’s always a risk.” Cleric: “I doubt its poison.” Fighter: “Who get’s to be the guinea pig.” Fighter: “I’ll taste one. I've only got 1 hit point. Magic-User, you want to taste the other?” Magic-User: “Sure, why not. I’ll take a tiny sip of the amber one.” DM: “The potion is sweet, sickly sweet and smells like almonds…” Magic-User: “Crap.” DM: “But as the liquid passes over your tongue it heals the small cut on your tongue from the shock of the giant spiders. You bit it slightly when you saw them.” Fighter: “Sweet. Healing Potion! I’m gonna take a tiny sip of the silver one.” DM: “There’s no real immediate affect, other than your heart begins to beat a little faster and your joints seem a little looser, as you look up from the potion you notice that for a fraction of a second, everything around you seems to be going slower.” Fighter: “Awesome. I bet it’s some kind of Haste Potion.” Fighter: “Do we get XP for magic stuff?” DM: “Magic stuff is its own reward.” Fighter: “Gotcha.” DM: “Okay Caller. What are we doing now?” Players converse. Magic-User: “We’re exploring the rest of the dungeon. We’re gonna go through the double doors to the South.” DM: “Great. Set up the minis in your marching order. Who’s in front?” Fighter: “Me, I have the most HP and a shield.” DM: “The doors open slowly, barely hanging onto their hinges after the brutal shoulder attack by Fighter. You see a wide 20 foot corridor ahead. The corridor extends out of the 30 foot range of the torch light.” Fighter: “You should take the 10 foot pole from the Magic-User and poke ahead.” Fighter: “Definitely. I take the pole and start moving forward slowly.” Cleric: “Poke the ground for traps.” Fighter: “Good Idea. I’m poking the ground ahead of me with the ten foot pole and advancing slowly down the hallway.” DM: “After about 30 more feet the flagstones that you tap with the pole make a different, more hollow sound. There is also a door on the left wall. The corridor continues a head.” Fighter: “I stop moving forward and signal to the party.” Fighter: “Give me the stick, I have a higher STR and I might be able to break through the hollow part.” Fighter: “Okay.” DM: “Roll a d6 and add your STR bonus.” Fighter: “FIVE!” DM: “The floor gives away as you put more of your weight onto the pole, it’s a pit, about ten feet deep in the center of the corridor and it’s filled with brackish water.” Cleric: “Is the whole floor gone? Can we get to the door?” DM: “There’s about 3 feet on either side of the pit that you could use to get around the pit. You can still get to the door. Everyone let’s remember how to Listen!” Fighter: “How does that work?” DM: “Roll a… you guessed it, d6. On a One you might hear something if there’s something to hear. Again, according to the book I should make these rolls, but anything that takes dice out of player’s hands is pretty silly.” Rolling of Dice. Fighter: “One!” Fighter: “One!” Fighter: “We’re twinkie rollers.” DM: “Both of you, as trained Fighters, hear tiny barking and yapping coming from the other side of the door.” Fighter: “Yapping. Kobolds. Awesome.” Fighter: “I don’t think I was playing when you guys were killing Kobolds.” Magic-User: “That was a long time ago. I think we ended up setting their lair on fire.” DM: “Kobolds are a personal favorite of mine. But these are classic Kobolds. None of this dragon descendant stuff. Just little crafty dog-men.” Cleric: “They’re behind the door. You guys want to go in and kill the crafty dog-men?” Players: “YEAH!” Cleric: “I’m using my Shield to provide as much cover for myself and the Magic-User. Fighters, you can take the door.” Fighter: “I KICK THE DOOR DOWN WITH MY AWESOME STRENGTH.” DM: “Wow, you’re really getting into the Barbarian spirit. Roll a d6 add STR.” Cleric: “Can I help him?” DM: “Sure, you roll too, we’ll take the highest.” Fighter: “Five!” DM: “The door flies of its ill-made hinges into the room in true hack and slash fashion. Around a diminutive table are over half a dozen little dog-men, they are…surprised by your outrageous entrance and will not win initiative, but they do look like their drawing their weapons to attack.” Magic-User: “I take it their intentions are not to talk. We attack them.” DM: “Great! Now roll initiative everyone.” Rolls all around. Cleric: “Looks like we’re basically going counter clockwise starting with me and ending on Magic-User.” DM: “Intentions, Cleric?” Cleric: “I’m going to throw my torch into the far side of the room to make sure we have enough light for battle. If I hit a Kobold, that’s fine too.” Fighter: “How big is this room, what else do we see right now?” DM: “Oh yeah, Mapper. About 20x20 feet. There’s a door on the opposite side of the room from the one you entered.” DM: “Next?” Fighter: “I’m going to try to squeeze into the room around Fighter and get close enough to slash one of the Kobolds with my sword.” Fighter: “WITH A MIGHTY SWING MY INTENTIONS ARE TO CUT AS MANY IN HALF AS POSSIBLE. I’m swinging low, because their short.” DM: “Magic-User?” Magic-User: “Sigh. I’m gonna start casting my one spell.” DM: “Sleep?” Magic-User: “Sleep.” DM: “Okay, the Kobolds will be acting last on any survivors! Let’s start back with Cleric now.” Cleric: “How does throwing stuff work again?” DM: “Just roll to hit AC 9. If you roll really well, we can rule that you hit a Kobold.” Cleric: “13. Hit, but not very well.” DM: “Your torch skitters across the table with sparks flying, it lands in the corner of the room on the bare stone ground. Fighter, you can squeeze in and make an attack. Kobolds have an AC of…7.” Fighter: “Hit! D8 damage…5” DM: “Your sword slices through the kobold’s tattered leather armor and directly into his gullet. Fighter, there are no rules for what you’re trying to do, so let’s just see what happens.” Fighter: “AC 7, HIT, I do 4 damage with my MIGHTY BATTLE AXE.” DM: “The second Kobold is severed at the waist. Magic-User?” Magic-User: “I let loose my Sle"
