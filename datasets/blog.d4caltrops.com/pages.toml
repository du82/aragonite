title = "d4 Caltrops: February 2020"
full_description = "d4 Caltrops Blognard? Saturday, February 29, 2020 OSE Encounter Activities - Toad, Giant Still hopping around the list a bit. Just in time for Leap Day, here’s a table for those batrachian behemoths: The Giant Toad! Posted by ktrey at 10:04 AM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, encounters, OSE, OSE Encounters, random tables, tables Friday, February 28, 2020 OSE Encounter Activities - Skeleton To celebrate the completion of a quarter of the monsters, I decided to skip around a little bit for a change of pace. Here are one hundred Encounter Activities for some more first-level fodder favorites: Skeletons! I’m unabashedly addicted to making my Skeletons a little more stop-motion Harryhausen at every available opportunity. Sometimes I’ll surprise Players by giving one or all of them an X in 6 chance to simply re-animate until completely annihilated in a more creative fashion than banal bashing. The occasional relentless and indefatigable “Living Skeleton” is always a rattling revelation. I also enjoy how perplexing and unsettling it can be to portray these low-level Undead as eternally trapped and idling away endless hours parodying the activities they performed in life. One can finely tune the level of fright they incite, though these days with the over-saturation of Halloween decorations, it is a little more challenging to make confronting our osseous remains truly chilling. Curiously, I’ve found that humanizing them in ways that go unexplained can actually help leaven an otherwise lusterless encounter with a bit more horror and dread. Posted by ktrey at 8:25 AM 1 comment: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, encounters, OSE, OSE Encounters, random tables, tables Thursday, February 27, 2020 OSE Encounter Activities - Elemental Four for the price of one (well, technically twelve if you count all the types), this entry provides statistics for the different power levels of Elemental (Lesser, Intermediate, Grater) as well as differences based on their composition. I’ve always preferred a more “anthropomorphized” or vaguely humanoid miens for my Elementals, but as creatures from other Planes, I tend to give them somewhat inscrutable behaviors and personalities. They are truly alien to this world, and certain situations we’d construe as prosaic are simply frustrating, confusing, or just plain terrifying for them. Imagine for a moment how things would work if you visited a world aflame or with radically different fundamental laws and physics, wouldn’t really be much of a picnic, would it? Most of them are compelled to perform tasks through powerful magical forces, so give some thought to who/what summoned them and what their underlying duties may be if it’s not specified in an entry. I’m sure that they do occasionally “go rogue” or slay their summoners without securing a return-trip home, so this probably makes them even more aggravated and unpredictable. Another thing I often import from later versions are even “Smaller” Elementals. I love the idea of a Wizard lighting her pipe with a living wisp of fire, a roiling potion bottle of crystal-clear water that remains cool at any temperature, a surprisingly smooth boulder dutifully rolling behind them, or an orbiting orb-like breeze to flare or billow the occasional robe. OSE Statistic-wise, I’d be tempted to just use Sprites. Had to do a little font-size shrinking to get them all to play nice on a single page. When I get into less casual “layout” territory for a compiled resource, these might end up on separate spreads. Posted by ktrey at 6:15 AM 1 comment: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, encounters, OSE, OSE Encounters, random tables, tables Wednesday, February 26, 2020 OSE Encounter Activities - Driver Ant Driver Ants! These Myrmicine Monsters are easy to model, as Ant Behavior is something most people are familiar with. Although thankfully not present in the hundreds of thousands that you’d find in a typical anthill, I still like to borrow heavily from the natural world and give them a Queen, eggs, and larvae to tend to. Since seeds and grain are probably not enough to sustain and feed a colony of critters this large (six foot ants!), I also imagine that, like Leaf Cutter Ants, they cultivate a variety of Fungi to feed on within their underground layers. This also gives you an excuse to come up with some interesting mushrooms and their effects! If you find yourself in need of a quick “Giant Ant” mound for your players to explore, I made some contributions to Hex Describe that seem to handle them fairly well (although I’d definitely like to revisit the tables here again to incorporate some of the the brainfood that this Encounter Activity table might provide). This link should provide you with ten [giant ant lairs] relatively instantaneously. Hope you have as much fun with these Formic Foes as they were to write up! Posted by ktrey at 4:29 AM 1 comment: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, encounters, OSE, OSE Encounters, random tables, tables Tuesday, February 25, 2020 OSE Encounter Activities - Dragon Turtle/Shell Crawl I’m temporarily skipping over the regular Dragons for now. Their role as titular Monsters means I need to do them proper justice, and I’m still deciding if I want to do an “All Dragons + Dragon Color” combo-tables or attempt to give each Color its own table. If you have a preference, let me know in the Comments! In the interim, I’ve decided to tackle the chelonian challenge that is the Dragon Turtle. These are arguably the most powerful Monster in B/X or OSE, with incredibly high Hit Dice and a nearly unique arduous Armor Class to overcome. Since their Breath Weapon hinges on Hit Points, it can easily be one of the most damaging adversaries in the game. In fact, glancing at my trusty Rules Cyclopedia to compare for potential power creep, I spied the following note: Note: Dragon turtles are extremely powerful creatures that should not be used unless the player characters are of very high level. Could this be the very first interstitial admonishment for Encounter Balance? Are Dragon Turtles at least a little bit responsible for later developments like Challenge Rating? I found it interesting 😊. I was a little torn (or perhaps I took the advice above subconsciously to heart): I don’t typically use these as antagonists for combat, but instead my mind is consistently drawn to the wonder-invoking illustration for the Zaratan in the 2nd AD&D Edition Monster Manual. Something this massive can serve as a better set piece to explore or clamber over…a bit like the Colossi in Shadow Of The Colossus. Perhaps they conceal their commensurately formidable treasures in caches and crevasses throughout their backs (defended by dermal plate denizens, of course). So I decided a compromise was in order, I’m still providing a d30 for Encounter Activities, but also a bonus “Shell Crawl” Table after realizing that the scutes on a Turtle’s carapace are surprisingly hexagonal. You can populate the various plates on-the-fly or in advance, and feel free to scale the area up or down to your liking. I think I prefer to take the ⯈ Mistaken for island bullet in OSE to heart by making them positively massive. If you need more ideas/inspiration for the Shell Crawl “Hexes” some of my Wilderness Hexes might fit in with a little filing. There's a score of Sea-based ones as well if you are planning a more maritime jaunt! Posted by ktrey at 6:56 AM 3 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, encounters, OSE, OSE Encounters, random tables, tables Monday, February 24, 2020 OSE Encounter Activities - Doppelgänger (d100) Oh, dear do I love a good Doppelgänger-based encounter. They’re purpose-built for infiltrating the factions of both friendlies and foes alike with their complex, duplicitous schemes. Using them cleverly can be immensely rewarding when one can orchestrate that tricky but ever-so satisfying “big reveal.” I’m not necessarily talking about your silly Scooby-Doo unmasking (“Old Man Potter was just a Doppelgänger all along!”), more the fruition of careful plotting and positioning spanning an entire campaign (or at least several sessions). They make consummate nemeses and the perfect recurring foils. I have some Players that have developed a deep-seated animosity towards Doppelgängers, and for good reason. They were a perennial foe in one of my longer running campaigns, and it didn’t hurt that I’d engineered some rather duplicitous situations to help me home in on their full potential. To feed and foster the inherent Paranoia of being “Pod Personed,” after introducing them and their concepts, I took each player aside periodically before games to ask them if they’d like to volunteer to play a Doppelgänger for a session. I recommend assuring them that their actual character would remain safe and eventually return, maybe even dangling some additional Experience for a session well-played. Emphasize the importance of keeping their choice and the conversation secret from the other players for maximum effect. I suppose one could select and brief a willing confederate if one has any players that are up to the task (sometimes a little light PvP can be fun after all and the best kinds of party sabotage are self-inflicted), but it’s far more devious to just mention that you’ll mull any volunteering over and provide your answer with a pre-arranged note-passing in-game. Then proceed to play the session with private notes-a-flying to all participants (taker and non-taker players) alike. I’ll leave it as an exercise for the more devilish DM whether one actually ends up needing to select a Doppelgänger from any “takers” to have the desired effect.😊 As far as Encounter Activities go, you could just as easily roll on the table of the Humanoid they’re impersonating to get an idea of what they’re doing “right now.” This table might be more useful to inspire in terms of plotting out their underlying insidious plans and over-arching villainous machinations. Posted by ktrey at 11:25 AM 1 comment: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, encounters, OSE, OSE Encounters, random tables, tables Sunday, February 23, 2020 OSE Encounter Activities - Cave Locust (d100) Circling back to plug one a few holes that have cropped up in the list: Here’s a d100 Encounter Activity table for a frequent-flier dungeon pest of mine: The lowly and skittish Cave Locust. Startling many a party with a sudden clumsy leap from concealment, I always envision them as somewhat resembling the creepy little Mole Crickets I would occasionally see as a child. If you need some assistance describing the smell their stinking spittle: I have a table for that 😊. Some of the “Ugly” smells from my Three Hundred Smells & Scents might manage to wrinkle a few noses. Posted by ktrey at 10:31 AM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, encounters, OSE, OSE Encounters, random tables, tables Saturday, February 22, 2020 OSE Encounter Activities - Dervish (d100) Here’s a Monster entry that hasn’t aged too well. It really shines a steady light on the whole “armchair history buff” roots of the hobby. Dervishes are quite obviously based on an over-simplification/misunderstanding of real-world counterparts, and when these kinds of clumsy stand-ins are used in this way, the reductive treatment has a high likelihood of only ending up troubling and insensitive. This is a true shame, because Lawful opponents can be a refreshing change of pace over more monolithic “Evil” and the pervasiveness of Chaotic foes. I suppose if you need zealous Holy Warriors, then this entry can fit the bill. Curiously, you could simply substitute the more occidentally-inclined appellation “Crusader” here should your setting need something similar and run them without any modification. Stereotypes and tropes, sides of the same XP coin and all that. The primary situation that encounters with Dervishes seem designed to scrutinize is the implication is that not all Lawful alignments are the same. World-building-wise the undertone is that there are factions/cultures that exist in the world that may have a different interpretation of Lawful behavior from the characters. A run-in with Dervishes as written tries to facilitate exploring these differences through exaggeration and over-simplification. This is something the Good/Evil axis in later games seeks to unscramble but usually ends up muddling by only creating even more boilerplate behaviors. I do find it curious that the intended interaction seems to only really be possible thanks to the much-maligned Alignment Languages (I absolutely adore them…anything that puts words in the mouths of Monsters is awesome in my book, but that’s really something better saved for a future post). Moral quandaries can be fun to pose to some players at some tables, but I don’t think they are as satisfying when they end up being as one-dimensional as these. But my goal remains to do a table for each Monster entry, distasteful warts and all: Posted by ktrey at 9:20 AM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, encounters, OSE, OSE Encounters, random tables, tables Friday, February 21, 2020 OSE Encounter Activities - Cyclops (d100) Poor Polyphemus! I always felt a little bad for that blinded bloke. It does seem that most Monster Manual entries for the Cyclops can trace its origins to this mythological counterpart. For this table I’ve included entries that highlight the viniculture and sheep-herding tidbits in the description. Statistics-wise they seem to make for fairly challenging foes, but the Slow-witted caveat seems ripe for exploitation by players, and with all that Treasure sitting around, they seem like a pretty solid way for clever players to swindle some not inconsiderable XP. I’d just be more than a little concerned about those 5% that can Curse. As with the Caecillia, I’ve nested another little treat in this table: The first twenty, italicized entries can also serve as a handy-dandy-bespoke-curse generator if you find the standard penalties/effects a little lacking or less flavorful. Just as with Potions and Magic Swords, a simple bonus or minus is seldom as satisfying for me. A table with one-hundred custom-tailored Curses is definitely something to put on the pile for later 😊. Posted by ktrey at 7:22 AM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, encounters, OSE, OSE Encounters, random tables, tables Thursday, February 20, 2020 OSE Encounter Activities - Pudding, Oooze, Slime, Jelly, Mould (5d20) Puddings, Oozes, and Slimes, oh my! I had a ton of fun helping Alex with creating some tables for his excellent Hex Describe for procedurally ge"
