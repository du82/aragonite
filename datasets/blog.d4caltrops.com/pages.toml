title = "d4 Caltrops: October 2007"
full_description = "d4 Caltrops Blognard? Monday, October 8, 2007 Poor DM's Almanac (part II) Sadly, I was thinking ahead with my choice to run a 3rd edition campaign. I knew that I could hook at least two other casual LAN gamers with the “close to Neverwinter Nights” selling point. I had abandoned the Realms as a campaign setting long ago, and already my long slumbering DM-brain was beginning to bubble with heady Homebrew.I swallowed my pining for the past, abandoned the days of THAC0 (and the associated low-means-good Armor Class), and repurchased the three Core Rulebooks. I longed for that fleeting “feel” of the olden D&D of yore, and resolved to make this campaign as flavorful as possible. Within days, I had my first three players assemble for a character generation session. With each of them, I discussed character options at length, begged for backstory, and sternly supervised the ability score rolls.They were given the following choice for determining ability scores:3d6, 10 times, remove 44d6 (drop lowest), 8 times, remove 2, but keep one low score.The players jumped at the second option, which on the surface, does tend to produce higher-powered characters, but with the heroic harmatia of a low score dangling from their necks.The outcome of this first session was three characters, two of which still play to this day:Brunnor Coalbeard – A dwarf’s dwarf. The party Fighter. Played rather archetypically by Steve.Wilhelm Arkam – The Magic-User/Archaeologist with a decidedly dark bent. Played by Woody.Arun – A Shadow Elf (GAZ13, I dislike Drow, and prefer the other flavor) Assassin, with shades. Played by Dave.A small start, but fairly well-rounded, with Muscle, Magic, and Miscreant. They would eventually need a Cleric. Already, curiosity was beginning to swell as we chatted at length about the characters around the kitchen table. Word travels fast in this circle of friends, and another former gamer was piqued and picked. Many others would soon follow suit, all with virtually no role-playing experience. I would have my work cut out for me. Posted by ktrey at 1:01 PM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: current campaign, dm, dnd Sunday, October 7, 2007 Poor DM's Almanac (part I) The recently resurrected current campaign has been quite a roller-coaster ride for DM and players alike. Its miraculous genesis took place over five years ago, and if memory serves and I can bring my racket up in time, the next few posts will concern how this campaign came about. A large group of friends found themselves assembling at least bi-weekly to enjoy percussive bouts of quality LAN gaming. It began, as LAN games often do, with Starcraft and evolved steadily into Warcraft III. Each grew into masters of their chosen race in due time, and soon we began to grow tired of the repetitive nature of Real-Time Strategy. I slyly suggested that we try Bioware’s Neverwinter Nights (as we needed a game that had been ported, and was compatible with Cody’s Mac), and the cooperative nature of the game was a quick-sell. I was carefully steering them in the right direction.I had been nurturing my love for pen-and-paper role-playing games in secret for several years at this point, and whenever a “Gaming Mood” struck, I consoled myself with sighs as I thumbed my way through my tattered copies of the Arduin Grimoires. I made excuses to separate on bookstore jaunts, quickly scanning the spines of the Role-Playing Section in secret, before returning to the more “respectable” Reference section. It was during this shameful double-life that I learned of Wizards acquisition of TSR, and after much internal debate, snapped up used copies of the three Core Rulebooks. I devoured them in a fit of nostalgia, and with lip curled in disgust at what had been done to the system I loved, I sold them back.But the bug didn’t cease biting that easily. I found myself deflecting questions from the Girlfriend about the prodigious number of oversized tomes that I had tucked away below the bookshelves in a vain attempt to keep them out of mind. “GURPS? Oh, those are just books for a game I used to play. Nothing special. You probably wouldn’t be interested in it. Although here’s one that’s about Discworld that you might like…”Perhaps I was just ashamed of my past, but that fateful summer, as five of us were steadily slogging through the second expansion for Neverwinter Nights and beginning to grow increasingly bored with its hack-and-slash repetitiveness, something inside me snapped.I knew from careful conversation coaxing that at least a few of the guys present had been former gamers when they were much younger, so after quietly retreating home to retrieve my big box of plastic polyhedrons, I began muttering the incantation for summon soapbox.I’m assured by those present during this speech, that the rattling of die and the fervor with which I evangelized pen-and-paper’s superiority to scripted computer games must have been quite a sight. Somehow, with my loud litanies and conviction, I convinced three of the former-players present to participate in a game.But what game? Oh there were so many. It had been years since my first long-running campaign transitioned from Moldvay Basic to the shiny Rules Cyclopedia with all the Gazetteers. I was only told that it had to be Dungeons & Dragons, because it was the only system they were willing to play. It was to be a short one-off game or so, probably more to silence my rants and for kitsch value than anything else. A short one-off is all I needed though. I wracked my brain for a system.My internal debate was louder than a herd of 1st level adventurers stumbling through the caves of Quasqueton. Neverwinter Nights used a heavily hobbled version of the shiny new d20 system, full of feats and skills that only focused on the hack-n-slash nature of the game. But how I loathed what I had read in those Core Rulebooks years before. Mystara forever. I knew there was no way I could sell them the concept of Demi-humans as a Character Class. AD&D was also an option, but I had only a ratty PH and DMG left in my old collection. Posted by ktrey at 11:09 AM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: current campaign, dm, dnd Monday, October 1, 2007 Back from the Dead The lifeless corpse of the campaign I had all but abandoned for the Winterlands (the cold, white, northern wastes of Indiana) last year was borne on a improvised litter by The Seven and placed gingerly upon the gilded altar of the Sun Temple. Beaten and bedraggled, the Heroes delved deep into their belt-pouches and backpacks, producing just enough platinum pieces to receive audience with the High Hierophants, Sons of the Solar Host. Intersession into the affairs of the Taker is never something approached lightly, even on behalf of Heroes as great as these. The Solar Host has its demands. The tip of a Gnomish dagger brutally pries the clear gems from their delicate elven setting, and even the Dwarf winces as such exquisite craftsmanship is marred. The dragonhoard had much in the way of jewelry and gems, but tragically few diamonds. They can only hope that what they’ve assembled will be enough, as the Hierophants begin their effusive prayers and anoint the remains in melted snow, gleaned from the regions tallest peak. After almost two years, the corpse of the campaign was returned to its players. My heels had barely cooled from the trip, and we were still unpacking when within less than a week, the invigorating magic of a pricey true resurrection had me frantically reweaving all of the threads of the story thus far into one fifty-foot rope. As a DM, I become painfully aware of the age-old aphorism concerning rope, and how its length should be fed out slowly to the players, until they have just enough. Posted by ktrey at 9:58 AM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: current campaign, dm, dnd