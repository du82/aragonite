title = "d4 Caltrops: July 2013"
full_description = "d4 Caltrops Blognard? Saturday, July 27, 2013 Random Wizard Questions Random Wizard: Top Ten Troll Questions for Your Game Race (Elf, Dwarf, Halfling) as a class? Yes or no? I prefer Race as Class to differentiate demi-humans from Humans. Most of the class features/abilities of the four Human classes are not culturally relevant to the demi-human races (no concept of religion for Elfs, taboos on Magic for Dwarfs, I don't normally use Halflings), demi-humans also have a different alignment axis than Humans (instead of the standard Neutral, Lawful, Chaotic). Class merely defines initial character capability though, so it is still possible to subvert these arch-types through character development in play. Do demi-humans have souls? Sort of. Elfs are human babies stolen and raised in the Elflands, usually their soul is owned by another Elf. If they manage to get it back and spend too long away from the Elflands, then they can potentially become Human again. If they stay Elf, as they grow older in seasons or more experienced they sometimes go through the metamorphic process that begets Dwarfs. The question seems to be geared more to whether or not they can be raised from the dead. I don't typically include Raise Dead/Resurrection magics in my Classic D&D games, so that aspect doesn't really apply. Ascending or descending armor class? I prefer Descending Armor Class (9 to 2), but can cope with Ascending as long as there isn't too much bonus inflation. My players typically prefer Ascending. We sometimes compromise with TARGET 20. Demi-human level limits? Traditionally yes, but I don't think I've ever had a demi-human player in a game that reached them. They are important for determining at what point an Elf character might start transforming into a Dwarf, and start over with a new Class progression. Should thief be a class? It's available to Human characters in most of my games, I sometimes rename or remove it for cosmetic reasons (Clerics are also victims of this). Thief Abilities are treated as Saving Throws. Do characters get non-weapon skills? A character's background might grant them some professional abilities to differentiate them from other members of the same Class. Characters can learn useful and marketable skills through play. Skills are only adjudicated through die rolls if there's a potential for failure and only advance through use (they are not level-dependent). Are magic-users more powerful than fighters (and, if yes, what level do they take the lead)? Player Skill is the only thing that typically determines this. I don't think Class balance is particularly important when Player Skill can level the playing field. Do you use alignment languages? Yes, and there are also Class languages. If a Player selects an Alignment for a Human character than they can learn the language through play (or choose it as a bonus language if they have a high Intelligence and begin play with it) and converse in it freely with other Humans of the same alignment that know the language. Same goes for the Class languages. Speaking an Alignment language in the presence of other alignments can invoke hostility. Both have written forms and function as normal languages (it is theoretically possible to learn more than one, if you can get someone to teach it to you. You don't forget it or change it if your Alignment shifts). The Alignment of Demi-humans serves as their Racial/Class language. Monsters work this way too, so Amoral Lizardman is a different language than Neutral Human and a Disciplined Dwarf doesn't automatically speak Lawful Werebear. XP for gold, or XP for objectives (thieves disarming traps, etc...)? XP for Gold Pieces spent. Which is the best edition; ODD, Holmes, Moldvay, Mentzer, Rules Cyclopedia, 1E ADD, 2E ADD, 3E ADD, 4E ADD, Next ? I play a heavily hacked version of D&D that probably most closely resembles the Rules Cyclopedia (with some LYB Arduin thrown in), so that would probably be my preference, followed by Holmes. I don't really think any edition is intrinsically better, some are just more suitable to the style of games I run. Bonus Question: Unified XP level tables or individual XP level tables for each class? XP level tables by Class. Posted by ktrey at 8:05 AM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Newer Posts Older Posts Home Subscribe to: Posts (Atom) Search Pages Random Tables OSE Encounter Activity Tables Beyond The Wall Resources Yoon-Suin Resources Labels random tables (285) d100 (283) tables (163) encounters (141) OSE Encounters (133) OSE (132) magic items (36) dungeons (23) equipment (19) monsters (19) dnd (17) wilderness tier (17) character generation (16) magic (16) spells (15) rumors (14) wilderness (14) clerics (13) magical items (12) treasure (12) NPCs (11) gear (11) generators (11) house rules (11) spell features (11) hex crawls (10) hexes (10) BECMI (9) RC hacks and house rules (8) ideas (8) plants (8) advancement (7) dnd hacks (7) magic users (7) names (7) resources (7) adventure hooks (6) characters (6) cities (6) dressing (6) events (6) settlements (6) weapons (6) animals (5) backgrounds (5) classes (5) clues (5) curses (5) dolmenwood (5) domain tier (5) dungeon stocking (5) religion (5) set dressing (5) shrines (5) treasures (5) why tables (5) yoon-suin (5) character sheets (4) current campaign (4) dragons (4) fairy tales (4) hooks (4) mountains (4) reviews (4) stocking (4) team tuesday (4) villages (4) what tables (4) 4e (3) Elfs (3) TROIKA! (3) WHITEHACK (3) abilities (3) armor (3) cantrips (3) carousing (3) character classes (3) decoration (3) dm (3) domain (3) doors (3) dungeon dressing (3) fair folk (3) food (3) foraging (3) foreground growth (3) fourth edition (3) fungi (3) goblin project (3) hirelings (3) landmarks (3) locks (3) mentzer (3) mushrooms (3) potions (3) procedures (3) quests (3) religions (3) rules cyclopedia (3) spellbooks (3) swords (3) tells (3) tools (3) traits (3) transcripts (3)