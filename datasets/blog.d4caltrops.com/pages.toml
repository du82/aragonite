title = "d4 Caltrops: October 2018"
full_description = "d4 Caltrops Blognard? Tuesday, October 16, 2018 By The Way/Beyond The Wall With the demise of Google+ announced, I’ve been going through some of my older posts and migrating some of the soon to be orphaned content over to my blog. I’ve created a new page to house some of the Beyond The Wall Playbooks I’ve generated in the past. Beyond The Wall still has one of my favorite Character Generation Systems, and it’s broadly compatible with most flavors of D&D. I enjoy group character generation, and the Playbook system in Beyond The Wall does a lot of heavy-lifting to spur the imagination, handle some basic backstory elements, and even includes some player driven world-building. It’s surprisingly difficult to make it out of character generation without at least a few promising adventure hooks, which makes it ideal for Sandbox play, and players are often more invested in NPCs/Locations they had a stake in creating. While I was re-doing the layouts of these documents, I came across an old folder with a few more half-finished Playbook ideas, so when I get a chance and if there’s interest, I may go ahead and dust those off and get them finished. Posted by ktrey at 8:56 AM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Newer Posts Older Posts Home Subscribe to: Posts (Atom) Search Pages Random Tables OSE Encounter Activity Tables Beyond The Wall Resources Yoon-Suin Resources Labels random tables (285) d100 (283) tables (163) encounters (141) OSE Encounters (133) OSE (132) magic items (36) dungeons (23) equipment (19) monsters (19) dnd (17) wilderness tier (17) character generation (16) magic (16) spells (15) rumors (14) wilderness (14) clerics (13) magical items (12) treasure (12) NPCs (11) gear (11) generators (11) house rules (11) spell features (11) hex crawls (10) hexes (10) BECMI (9) RC hacks and house rules (8) ideas (8) plants (8) advancement (7) dnd hacks (7) magic users (7) names (7) resources (7) adventure hooks (6) 