title = "d4 Caltrops: March 2015"
full_description = '''d4 Caltrops Blognard? Friday, March 20, 2015 [Yoon-Suin][NPC] The Putri Coldheart The Putri Coldheart You guessed it, more awful art by me. The Putri Coldheart is Nāga, but tantamount to a rebellious adolescent. About seven months ago, she slithered away from the spoiled coils of the splendid Coldheart Sister-Knot after being teased one-time-too-many, and decided to strike out on her own. Although still very young, The Putri had little trouble claiming a ramshackle ruin in the Old Town. The Putri is in the process of surreptitiously pawning some of her valuables through Charmed go-betweens in the Yellow City. She would dearly love to furnish her new palace and properly provision it in accordance with the ostentatious appetites she believes all Nāga require and deserve. The Putri has a problem. She is due to molt again very soon and will need to obtain another torso and set of arms, slightly larger than this one. In terms of Appearance: She is very slight of frame, with pale skin and scales that are only just beginning to crowd. These scales register as emerald green to Humans, a teal-ish blue in the eyes of Slug-Men, and like shifting sea-foam to Crab-Men. Dwarf-vision tends to render her natural form entirely in negative*. Most would place her age at somewhere between 13 and 15 rains. In accordance with the fashions of the time, The Putri’s nose was magically flesh-wiped from her face on her tenth birthday. The Putri’s misses it wistfully sometimes. In terms of the Voice that your Players hear in their heads (The Putri’s mouth is mostly decorative): Ssssolely telepathic (speak into cupped hands or a teacup), The Putri isss ssssoft sssspoken. The Putri ssstrives for ssssentances ssstuffed with ssssibilencccceee and sssslang. The Putri ssssytematically disssorientsss othersss by usssing her name inssstead of firssst-persssson pronounsss. The Putri isss unaccussstomed to and flussssstered by impudencccce. The Putri’sss ssssoundtrack is Siouxsie and the Banshees. If this proves a pain, then just attempt your best teenage girl. Valley Girl dialect is also a possible candidate. In terms of Influence: Only a recent addition to this area of Yoon-Suin, The Putri is uncharacteristically cautious for her age, and other than a handful of attendants that she has ensorcelled into service, she is still very suspicious of the bustle and hustle of the Yellow City. Her last visit was positively disastrous, as she inadvertently spoiled the salty and solemn sky-funeral of an upper-caste relative of Vèlô, with a rather provocative outfit and a naive lack of familiarity with the concept of death, dying, and mourning. In terms of Foibles & Flaws: The Putri bites her fingernails incessantly and twirls and twitches her tail in a state of perpetual fidgetiness. She is less than graceful and exceedingly self-conscious about this fact. Pathologically unable to accept compliments or flattery, any panegyrics are mentally translated into a foreign/unintelligible language in her head. In terms of Motive: The Putri would like to wear two pairs of arms this molt. The Putri needs help decorating. The Putri cannot bear to part with any more of her finery, and is enacting an elaborate ransom scheme. A charmed servant misinterpreted one of The Putri’s many errands, and fetched the wrong two things. Twist: The Putri was one/both of them all along. In terms of Trappings & Capabilities: Confirmed Spells: Disguise; Charm Person; Defensive Orbs; Orbs of Enfeeblement; Render Invisible; Rope Trick; Searing Ray; Call Monster III Suspected Spells: Blur; Animate Furniture; Call Monster II; Musical Accompaniment; Nāga Fireballs; Humanform; Duplicate Self; Strangling Tresses HD: 5, AC: 5 [15], #ATT 2, Dmg: 1d4/d6+2, Move 150 (Swim 180), ML 7, Save As: MU5. * Has Natural ESP/Telepathy extending 90’ *Sting inflicts 2d4 rounds of extreme grogginess on a failed save versus poison. Jewelry that The Putri plans on Pawning: A fine filigreed peacock medallion, her older sister’s favorite electrum collar, a platinum ring set with amethyst (a gift from a Bui Prince she was betrothed to at birth), a fine silk headband with teardrop shaped pearls, her Nāga Orb. She also stole: a Karambit of the Planes [Unusual Abilities: Int: 12, Alignment: Chaotic Good, Communication: empathy, Powers/Abilities: detect elevator/shifting rooms/walls in a 1" radius]. The Karambit takes great pleasure in filling The Putri with guilty feelings, so she rarely unsheathes it. A yak leather quiver of 11 Arrows +1, A Philter of Heroic Resilience, Spell Scroll (Neutralize Poison, Animate Dead) She wears a Ring of Clumsiness and Warmth on her left hand. She is not aware of its cursed nature, but luxuriates in the warmth. It is her most prized possession. Hidden among her numerous sketchbooks (she is an incredibly gifted artist) is a Map to Monetary Treasure: Lamarakh, miles distant, the guarded lair of her sister-knot. [16,000 gold, 7,000 copper, 4,000 silver]. * Something like this: Posted by ktrey at 4:56 PM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: NPCs, yoon-suin Wednesday, March 18, 2015 [Yoon-Suin][NPC] Vèlô the Slug-Man Merchant Prince Vèlô the Slug-Man Merchant Prince The corpulent scion of one of the wealthier Monograph Mogul families within the Yellow City, Vèlô fancies himself a bit of a playboy and hedonist. Prone to opulent binging, wanton whinging, and unnecessarily expensive excess; there is rarely a delicacy or asalubrious gratification that remains un-sampled for long in his slimy, chortling presence. Atrocious Art by Yours Truly In terms of Appearance: He is quite portly and very tall (towering at seven-feet, almost as wide in places). Rumors of a scandalous dalliance with a Slug Giant somewhere in the verdant branches of his family’s tree are oft whispered and rarely refuted. His Muculence (as he prefers to be addressed) usually shifts his clammy skin tone to match his mood, becoming the color of pale lead when content, but dramatically darkening to a deep crimson when flustered or angry. When confronted with a sublime histrionic performance: bright glistening chartreuse. Dark bands appear on his arms and legs when he hungry, which is most of the time. He smells strongly of sweaty wine or peaty scotch, but frequently masks this with cloying arcane perfumery. In terms of Voice: Suck loudly on your teeth before speaking deep-ish and slow. The more irritating this becomes, the better. Avoid a mess, but an un-swallowed and smallish mouthful of water goes a long way when burbled in this fashion (pointedly gulp it down before soliloquizing, if this makes you burp: that would be brilliantly appropriate). Practice makes perfect with this technique. For something more decorous, delicately crumple cellophane. The various sodden and hollow sounds associated with phlegm and mucus are also quite apt, and a thicker, more phlegm-forming, beverage or food can assist with this. Bananas always seem to work well for me*. In terms of Influence: His family is well-respected, deeply-conservative, and the very definitions of the words bookish and cautious. This has not rubbed-off on Vèlô, who is currently in the process of squandering the majority of his substantial inheritance on banana wine, banal women, and banausic dramaturgy. He spends money desperately and is uncharacteristically (for Yoon-Suin) abysmal at haggling. He will very soon be bankrupt. His penchants for the extravagant have made him quite the popular figure in certain affluent Yellow City social circles. His snooty factotum, Knjo, can often be found ceaselessly scrambling to settle his numerous domino debts (Vèlô is an unimaginative and incautious player who is easily bested by any opponent with an Intelligence of 11 or higher; he's lost to Crab-Men!) before there are any more unsavory consequences. In terms of Foibles & Flaws: He idly blows slime bubbles when wool-gathering. This is quite disgusting. He has an enduring and vociferous fondness for mime. This is also quite disgusting. He eats frequently and noisily (he will consume the combined weight of all players at your table in bananas during the course of a single conversation), and it’s said the sound of his scraping radula can be heard for several city-blocks. He is weak and quickly winded, and sighs sonorously upon seeing stairs. His compliance with accepted table manners is decidedly recalcitrant. In terms of Motive: His moist and immense love for all things theatre. The sumptuous luxury of staging a private performance. To aggravate and antagonize Putri Coldheart. Remittance for an unsavory wager. As a token of esteem, intended to inveigle Jàla to lower the bulk price of bananas. In terms of Trappings & Capabilities: Vèlô is a mawkish and mediocre Magician who has only really bothered with the basics, despite the rather robust resources he could easily persuade his family to provide. His spell book consists of dozens of dusty labels affixed to expensive imported vintages within his banana wine-cellar, and although he often goes down there to “study” he seldom forestalls the temptation to indulge and rarely remains sober enough to fully fill up his arcane allotment. Confirmed Spells: Stairclimb, Odoriferous Retreat, Faithful Chaise-Lounge, Overindulge, Muculent Mists Suspected Spells: Shield, Read Magic, Silence, Slimeless Step, Acidic Darts, Protection from Salt, Globe of Darkness HD: 3-3, AC: 7 [13], #ATT 1, Dmg: d6-1 by Teak Danda (staff), Move 90, ML 4, Save As: MU3. He is never without his bracelet. It pinches his clammy wrist folds and is a garish blue-metal adornment set with seven small spherical garnets. Each of these can be gingerly removed and swallowed. Very shortly after this is done: as Teleport Self with no chance of error to where the corresponding bracelet is located. The counterpart bracelet is currently near his nearly-full wand stand, within his fortified wine-cellar and has no garnets remaining. * For added affectation, urge for it to be peeled languidly by a Crab-Man player if possible; Bananas are his favorite food. Vèlô hates to touch food and is often hand-fed by his attendants. I heartily recommend extending every effort to make him as odious and unpleasant as possible for if/when he perishes at the hands of your players. Posted by ktrey at 5:46 AM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: NPCs, yoon-suin Tuesday, March 17, 2015 [Yoon-Suin][NPC] “Snappy” Jàla Khan “Snappy” Jàla Khan Jàla Khan is the reigning megalomaniacal monarch of all bivalves within the Gulf of Morays. He is also the democratically elected regent over all shelled subjects who inhabit the various deltas and tributaries of the God River that extend into the Yellow City. Through a series of strategic assassinations, his mandate has recently been extended to include all limpets and barnacles. He is also a ponderous pain in the rear. In terms of Appearance: Jàla is a surprisingly symmetrical Oyster, exactly the size of the Yoon-Master’s hand (with fingers outstretched). His shell is heavily decorated with extensive pearl bead-work and precious stones. His flesh is ashtray gray and he occasionally sports a fu manchu moustache-merkin made from glossy black sea-camel hair. He has two, olive-sized-and-shaped pink rose-quartz “eyes” that he infrequently remembers to wear whenever addressing non-mollusks. He looks and smells delicious. In terms of Voice: If available, punctuate with castanets (clacking a few resonant dice together betwixt thumb and forefinger works in a pinch). Shoot for semi-sniveling, preferably high-pitched, and avoid large words. Your second best Southern Drawl works as well. When bored (which is interminably often when hearing bootless pleas from air-breathers), expect tuneless whistling. In terms of Influence: The Oyster King is a remarkably savvy twerp, and has clamped down on most unlicensed commerce involving pearls and nacre. He also holds a monopoly on some of the key reagents for Sovereign Glue. Representatives of his kingdom travel far and wide on the hulls of ships and skiffs, and this foreknowledge of trade goods is often used advantageously to short the markets. If pressed into defense of his interests or territory, he can easily muster a troop of a thousand Barnaclids and could potentially raid his coffers to procure at least a legion of Locathah irregulars with a dozen Giant Starfish Siege Engines. He often entertains ecstatic fantasies of razing the Yellow City with such a mighty army, but is far too miserly to expend the resources (it would very likely fail hilariously). He’d rather play the waiting game and stake his claim after the cephalopods make their move. Fortunately, thus far, negotiations with the Squid-Men and the Kraken have been as disastrous as to be expected; and although he would be loathe to admit it, relations with the Topaz Dragon have cooled (the result of a disastrous surprise birthday party). In terms of Foibles & Flaws: Utterly incapable of tolerating alcohol, but when soused is effectively immortal. This is a consistent source of consternation for him. He possesses a carefully curated and opulent undersea harem, but isn’t quite sure why, other than “It must be so.” He has a standing bounty of three chestnut-sized pearls on all woodworkers and walrus (and under no-circumstances will discuss his childhood in Voivodja). Overtly fond of puffery and due-deference, his treatment of air-breathers is typically rude at best and coldly aloof at worst. He detests being referred to as "Snappy," and has ordered Giant Flesh-Eating Oyster mass-executions for less. In terms of Motive*: Vengeance on Vèlô for a slight (possibly perceived). To stock his vestigial Harem. To unite the Crab-Men under his banner (he’s perceptively noticed the girls’ sway over his monstrous bodyguard, Tǃchk). To deprive air-breathers of art and culture. To mend fences with the Topaz Dragon. In terms of Trappings and Capabilities: Irritatingly engulfed in his fleshy folds is his symbol of office and most trusted adviser. A pea-sized black pearl known as We Speak The Will Of Kings. The pearl is an intelligent artefact of commensurate ego to that of the bearer, and allows the anointed monarch to speak all languages and cast several useful high-order spells from the schools of beguiling and enchantment. Confirmed: Mass Charm Monster, Mass Charm Person, Dominate Person, Enthrall, Modify Memory, Zone of Truth, Irresistible Dance, Mass Suggestion, Undersea Animal Messenger, Feeblemind, Power Word: Grovel Suspected: Enlarge, Nacreous Color Spray, Displacement, Hallucinatory Undersea Terrain In addition, he often wears a dweomer-woven tangerine-colored ascot that allows him to Fly and operate comfortably on the surface. He is also in the possession of a gaudy green Kwalishi Submersible that he has been known to infrequently hire out (at exorbitant rates) to adequately deferential air-breathers i'''
