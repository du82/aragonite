title = "d4 Caltrops: March 2020"
full_description = "d4 Caltrops Blognard? Tuesday, March 31, 2020 OSE Encounter Activities - Squid, Giant Since OSE seems to be sadly lacking in the Kraken department, I suppose these over-sized cephalopod might serve as substitutes in a pinch. Posted by ktrey at 3:26 PM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, encounters, OSE, OSE Encounters, random tables, tables Monday, March 30, 2020 OSE Encounter Activities - Scorpion, Giant I have a fondness for Scorpions of all sizes. Apocryphally, when I was only a year or so old, our home was invaded by these arachnids one sweltering summer. The intruders likely belonged to the Striped Bark species, which is common around those parts. I was crawling about the boringly beige shag carpet mostly naked due to the heat, when I apparently found a few new friends and started playing with the Scorpions like toys. Dangling them by their tails and swinging them around giggling according to witnesses. Following family lore, this continued until my father came in from working outside and smashed them with a shoe, with much sobbing, wailing, and weeping on my part. I was somehow un-stung, but absolutely heartbroken that my toys had been so unceremoniously squished. Nowadays, I’m not certain I’d be so inclined to treat them so casually, but I haven’t come across one in ages outside of pet-store cages. I do recall desperately wanting one of those beautiful ebony Emperor Scorpions that seemed to be pretty popular as pets during the eighties, but the mere thought of having one in the house was anathema to my mother, who was not a fan of creepy-crawlies. In D&D terms, they’re much more interesting to me than Giant Spiders (it’s the deadly sting and menacing claws that make for such memorable mêlées), and I enjoy the bonus they engender to their sting on a successful Claw attack in OSE. Their deadly venom is definitely another tick mark in favor of an eventual d100 Unusual Venoms/Horrible Fates More Interesting than Death table. I find it interesting that instead of being Neutral like most Vermin/Animals, they’re listed as Chaotic (perhaps some bias from the writers has crept in here), though I must admit they seem perfectly at home prowling around abandoned Temples and Evil Shrines. Since their real-world counterparts are on every continent save Antarctica, I see no trouble with slotting them into just about any terrain, although I have a certain fondness for placing them in Deserts, and there’s a one that plays a key role in my Desert Hexes. I find it hard to control myself sometimes and restrict them just to Giant-size (the bigger the better, and I often fondly recall a dreaded Arduin titanic Scorpion that levels towns). Posted by ktrey at 10:05 AM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, encounters, OSE, OSE Encounters, random tables, tables Sunday, March 29, 2020 OSE Encounter Activities - Giant Giants make for fearsome foes and even more useful allies if canny Players can find a way to into their good graces. This is the first of the entries to necessitate a full spread (instead of just a single sheet), because there are half-a-dozen Giant types, and seeing as how they all differ somewhat, I decided to treat them all to a separate d30 table. There’s always a bit of a “scale” problem when it comes to fisticuffs with these massive Monsters. I have a hard time believing a Human-sized dagger would do more harm than a hatpin in some situations, so another option is to borrow from video games like “Shadow of the Colossus” for truly tremendous Giants, and treat them more like an “Adventure Location” with “Puzzles to defeat.” Flashing “weak points” are optional of course, but there is something deliciously tense about clinging to/climbing on them as enormous obstacles. All of my favorite folklore stories about Giants always seem to revolve around them being bilked or bamboozled by the Heroes in some way (like bleeding themselves out into a crevasse that connects to the sea, or being “Fin McCool fooled” in a pram), so I like to encourage creative problem solving outside of combat for these encounters. Same could be said for Cyclopes, honestly. Not to mention the utility some Giants might have for Human-sized hands: Their massive fortresses likely have a dire need for Giant Rat pest-control, and who better to squeeze into those massive mouse-holes than the Adventurers (an excellent opportunity to explore scale with some Lilliputian or “The Borrowers” type adventures)? It also must be awfully tricky to count their hoard of coins when they’re the size of the tiny paper circles left over from a hole-punch. 😊 Posted by ktrey at 9:26 AM 1 comment: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, encounters, OSE, OSE Encounters, random tables, tables Friday, March 27, 2020 OSE Encounter Activities - Robber Fly Robber Flies! I recycle and re-skin this stat block for all manner of big flying bugs, from massive moths to daunting dragonflies. It’s a pretty useful “all purpose” large vermin Monster. Once more, these are “Surprisers,” so it may be seldom that a party has the opportunity to witness what they’re doing (this is a very common theme in Dungeons, and really captures an adversarial Mythic Underworld that’s out to get any interlopers), but Giant Spiders/Toads have to have something to eat! I sometimes see their smaller counterparts perched around looking for prey on my walks, and it’s important to remember that not all of them are “Killer Bee” mimics. That “trick” really only works once on Players, and is of questionable utility for the table: Killer Bees kill when they sting, whereas Robber Flies just have more HP. I suppose if the Party is trying to track down some of that lovely Healing Honey, then maybe you could fool them once, but I’m just as likely to describe them as enormous Horse Flies, Mosquitos, or some other insect. Posted by ktrey at 1:22 PM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, encounters, OSE, OSE Encounters, random tables, tables Thursday, March 26, 2020 OSE Encounter Activities - Wight Another Undead entry for those who might be running an Undead-themed Megadungeon such as Barrowmaze. Since themed dungeons can result in the same types of foes being encountered again and again, anything to make an occurrence stand out, even just a little bit, can really spice things up and make a Monster more memorable. Here are a hundred entries for the Wight. I also tend to be a bit of a traditionalist and generally have them haunting or guarding places: duty-bound to Ancient Barrows or Catacombs. However, they can serve double-duty as decent Draugr as well. While they don’t quite qualify for the Liege/Pawn rules found tucked away in the Rules Cyclopedia, I like to establish at least some semblance of symbiosis between them and any Skeletons, Zombies, or even Ghouls that might have manifested in their area. These are a less single-minded, more intelligent Undead, but fortunately their scheming and span of influence is somewhat restricted. Even if sequestered away like this, their Weapon Immunity and Energy Drain can make them quite imposing encounters for only 3 HD, so some of these entries are intended to help telegraph the dangerous nature to unwary or inexperienced Players. A single suitably determined Wight would quickly decimate a phalanx of Veterans equipped with only mundane armaments, and the ensuing infestation of Wights that follows in 1d4 days could rapidly scour an entire continent of any remaining life. All the more reason why I usually prefer to keep them locked away or compelled to stay in and protect their Crypts and Tombs! Posted by ktrey at 8:27 AM 2 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, encounters, OSE, OSE Encounters, random tables, tables Wednesday, March 25, 2020 OSE Encounter Activities - Pixie Unperceivable Pixies! The Fair Folk can be both fun and frightening. I really like to stress the importance of using Euphemistic Names in my games. I even have Players that refuse to refer to them by anything else after facing their fickle wrath. Typically invisible (I do like how Tall Tales of the Wee Folk handled this with it’s Invisibility to Mortals), so it may be tricky for a party to actually witness any of these activities unless they are gifted with something akin to Second Sight or peer through a naturally bored hole in a pebble or stone. It’s another table for when the tables are turned, I suppose: When the party surprises the suprisers 😊, but still feels useful for breathing some life into the encounter, even if it’s only in the mind’s eye of the DM. Come to think of it, I might try something a little different with Invisible Stalker. I’m sure this table could prove useful for other types of Kindly Neighbors, but don’t worry. I fully intend to do a separate one for Sprites, since they receive their own listing among the Monsters. Posted by ktrey at 7:46 AM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, encounters, OSE, OSE Encounters, random tables, tables Tuesday, March 24, 2020 OSE Encounter Activities - Boar Finally backtracking to complete the “Bs” here are a hundred Encounter Activities for Boars. Something that’s always stuck with me about using these animals is a bit of commentary from Rolemaster’s Arms/Claw Law attempting to justify the large Hit Point totals for animals. There was a blurb about a single Boar utterly savaging a typically mixed adventuring party (by Rolemaster standards), and how proper Boar Hunting was performed by several individuals armed with very specific weapons (Boar Spears with backwardly barbed heads to prevent the animal from charging up the shaft toward the hunter). If you wish to give your Boars a boost, you may consider cribbing from the “Battle Rage” feature when wounded or threatened (such as the one found under Berserkers in the book). They are thankfully not nearly as dangerous in OSE or B/X but considering the frequency with which they show up on the Encounter Tables, they might end up being a pretty prevalent presence in Wilderness adventures, so this might be a useful table to keep handy for general Hunting/Foraging, and I must remember to earmark it for an eventual entry on the Lycanthrope (Wereboar). Posted by ktrey at 8:21 AM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, encounters, OSE, OSE Encounters, random tables, tables Monday, March 23, 2020 OSE Encounter Activities - Ferret, Giant My main experience with encountering Ferrets is limited to a single occasion I spent at a friend’s house who had a few as rather irascible pets. While we listened to Warren Zevon records, they somehow managed to find their way into the restroom and thoroughly demolish several rolls of Toilet Paper in mere minutes, making a marvelous mess. But they’re a Monster on the List, so they still deserve a table! Here’s a hundred Encounter Activities for these slinky mega-Mustelids. Posted by ktrey at 10:21 AM 1 comment: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, encounters, OSE, OSE Encounters, random tables, tables Sunday, March 22, 2020 OSE Encounter Activities - Nixie I am pleased to present an Encounter Activity Table that’s mostly interchangeable with Nixies, Naiads, Nereids, and even some of the more nautical Nymphs. Potentially pilferable for Kami, Melusine, Sirens, some Huldra, and maybe even Undines with a little strategic substitution. Posted by ktrey at 12:49 PM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, encounters, OSE, OSE Encounters, random tables, tables Friday, March 20, 2020 OSE Encounter Activities - Manticore Hope everyone is having a Happy Friday. Today I’ve done a table for those ornery Manticora. I find it’s sometimes tricky to really differentiate these dastardly devils, so I try to make them a little more intelligent and give them very strange things to hoard among their other treasures. For a surprise I sometimes give them Giant Scorpion stings or lace their spines with feculence and filth in order to foster infection. Or if one were feeling even eviller, there’s no rule against combining both the spines and a potent stinger. For other interesting venom types, feel free to crib from my table for Giant Centipedes (I really should just put together a d100 on Unusual Venoms at some point 😊). Particularly nasty and loathsome encounters can sometimes be more memorable, so I’ve endeavored to lean a little toward their plain old rottenness. Posted by ktrey at 9:22 AM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, encounters, OSE, OSE Encounters, random tables, tables Thursday, March 19, 2020 OSE Encounter Activities - Hellhound Here are a hundred Encounter Activities for those malevolent mutts: the horrible Hellhound. Pretty situational monsters, with a very unusual HD spread. Perhaps they come in differently sized breeds from Chihuahua to Bull Mastiff? Now I can’t shake the thought of a fire-spewing French Poodle, or a diabolical Dachshund. I'd imagine they don't make 'em in Dalmatian. Posted by ktrey at 4:57 PM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, encounters, OSE, OSE Encounters, random tables, tables Wednesday, March 18, 2020 OSE Encounter Activities - Harpy Posted by ktrey at 6:29 PM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, encounters, OSE, OSE Encounters, random tables, tables Tuesday, March 17, 2020 OSE Encounter Activities - Ghoul Those ghastly Ghouls! Feel free to tune down the gore if it’s not to your tables’ liking or if it doesn’t mesh with your style of play. I kind of prefer to make mine gross and accentuate their eating habits a bit. For me Ghouls fulfill the role of “Fast Zombies” with a bestial cunning/actual culture and intelligence, and their devastating Claw/Claw/Bite Routine has paralyzed many a player. Better bring an Elf along! Posted by ktrey at 11:16 AM 1 comment: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: d100, encounters, OSE, OSE Encounters, random tables, tables Monday, March 16, 2020 OSE Encounter Activities - Gelatinous Cube Tremble with terror from the relentlessly encroaching Gelatinous Cube! I was awfully surprised I was able to come up with enough for a d100 table for these Monsters (seeing as how they’re mostly just a wandering Trap with no real agency or culture), but I think my previous work on Puddings, Slimes, Oozes, and Moulds helped a bit here. The key to a memorable Cube Encounter has more to do with placing them in interesting and catchy situations (if they’re even spotted first). Although I do enjoy the visual of a bunch of "
