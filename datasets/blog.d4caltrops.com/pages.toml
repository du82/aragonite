full_description = '''d4 Caltrops Blognard? Tuesday, July 1, 2008 RC Hacks and House Rules: Page 226 - More Treasure! The next random number takes us to page 226, still within Chapter 16: Treasure.A couple of Treasure related charts here, but the one that really stands out as potentially much more useful than it initially presents itself is the Average Treasure Values Table.Here we have a breakdown of Treasure types A-M (Lair only) by their average values in gold pieces. When I was younger, I always had an absolute blast generating treasure using the charts on the previous page. Having never owned the Monster & Treasure Assortment accessories, I instead made my own. Classic D&D Hack:I had a small container of index cards with alphabetic dividers A-V, with a dozen or so pre-generated treasure hoards waiting between each letter. I was always fairly meticulous about designing my treasures for adventures, but having a bunch of “DM Approved” hoards to hand out at a moments notice, definitely saved some time when players decided to sidetrack-down the lair of a Random Wilderness Encounter.In the top right corner of each of these cards, I scrawled the overall gold piece value for the treasure for Experience purposes, but never in my many years of Classic did I ever bother to consult this Average Treasure Values Table to see how “close” I was with the average.My first thought after studying this table was somewhat akin to a mental forehead slap. While the hours I spent throwing down percentile dice on the preceding charts were definitely fun, I could cut out some serious prep time by simply building this kind of Random Encounter coin out of these averages1.Let’s take the Medusa: Lair Treasure Type FThe average value of this treasure in gold pieces is 7,600. Although the coins indicated in the treasure table for lairs are in the thousands, we can break this down any way we wish:200 platinum2,000 gold 4,000 electrum5,000 silver10,000 copper But wait! Sharp eyes may have noticed my math is missing a thousand gold. That’s where a quick d1000 comes in handy. I rolled a 464, which gives me some more gold to play with and “uneven” the numbers of the smaller coins. The remaining 536 will even out the gold and above. This option is great for sticklers that prefer organic hoards that are random down to the last copper piece. Since the denominations of coins are mostly metric, this adjustment process is pretty quick. Just watch out for that pesky electrum.Another way this table comes in handy is when planning character advancement. The Medusae in my Rules Cyclopedia are only worth a paltry 175 experience points apiece. But add in the average treasure value of 7,600 gold pieces and now we’re talking some actual advancement for low to mid-level parties. Most DMs prefer to intuitively adjust treasure and experience awards on the fly, but this table could serve as fairly useful guides for beginners who are trying to design by-the-book adventures with character advancement in mind. Locate the Treasure type that is most inline with how many experience points you would like a given adventure to reward (remember to divide it by the party), then simply locate a monster that has that treasure type. This sort of backwards design seems rather strange to me, but I could see it being useful.Also on this page we have a few more tables pertaining to another type of treasure. Any Dungeon Master worth his or her salt can look at the following list of words and be relatively comfortable with them:AgateGarnetTopazCarbuncleJacinthOnyxPeridotThe DM wears many hats: actor, storyteller, puzzle-designer, world builder, and yes, even amateur gemologist. Although I prefer to encrust my gems on large, unwieldy surfaces to encourage time-consuming prying (more Wandering Monster!), gems are still a staple of the fantasy treasure hoard. Getting to know your gemstones a little better is quite easy with access to the internet. Familiarizing yourself with a few more gemological terms and expressions as well as having some visual inspiration can really help make that dreadfully boring “500gp ruby” a thing of the past.1. Since these averages do not include the value of magical items, and for magic items, the only pricing information in the Rules Cyclopedia pertains to creation (which is only a rough indicator of actual value). This means that the DM can’t easily just “buy” magical items to place in a hoard using the Average Treasure Table values. This is just as it should be, providing a few extra steps of deliberation before plunking down that Horn of Blasting. Posted by ktrey at 11:49 AM 2 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: dnd, dnd hacks, house rules, RC hacks and house rules, rules cyclopedia Friday, June 27, 2008 RC Hacks and House Rules: Page 249 - Artifacts! Flipping to the randomly generated page 249, here we have a sample Artifact: Mask of Bachraeus. Somewhat strangely, I haven’t been able to locate any additional information on Bachraeus in my Mystara material, and some digging around online seems to confirm that here, tucked in the Treasure chapter of the Rules Cyclopedia of all places, we’re given a new Immortal in the sphere of Entropy, from the flavor text, we can determine that Bachraeus is the patron of Medusae. Oh, the ideas...I’m tempted to hook this into that bit at the end of B2 and turn the Keep into the first stop on an arching artifact-based adventure path. Who could forget that shapely prisoner imprisoned in the Caves of Chaos? With WoAdWriMo rapidly approaching, I'm being bombarded with ideas from every direction. Hopefully I can stick with one long enough to contribute this year.As an aside: I’ve always had a soft spot for Medusae, but I definitely tend to portray them as much more classical, breathtakingly beautiful and sinister foes in my games. I really prefer this to the depiction they were given for 3rd (and carried over for 4th, unsurprisingly) edition.Exhibit A: Bad Medusa.I like to go with the "cursed by the gods" for their beauty and hubris angle a little more I suppose. Here you have an amazingly gorgeous woman, and a mere glance at her will turn you to stone. Avoid the gaze, and you've still got the copperhead coiffure to contend with. Granted, it's really hard to argue with the awesome-ness of the serpentine Medusa from Clash of the Titans, and I also did enjoy Jeff’s Medusae (adapted from Marvel Comics), but when I think about Medusae, my brain instantly links to Caravaggio's depiction.But back to our sheep, the system of Handicaps and Penalties outlined here is an interesting guideline, although I must confess, I'm pretty prone to shoving tiny magical quirks on virtually any magical item that my player's get their grubby hands on. This helps reinforce the idea that magic is unpredictable, and honestly, no two plus two swords should really be identical. The Handicaps associated with artifacts look pretty brutal, but the Penalty-per-use seems like a pretty way to balance an effectively limit-less spell casting item. I think in most cases, owning the artifact is enough of a problem as it is, and in the case of the Mask of Bachraeus, the players would probably have to contend with a rather perturbed nest of Medusae1, eager to get their precious artifact back.ars ludi recently touched on making treasure special, and the artifact creation rules within the RC definitely seem to encourage this. By tying an epic history to an artifact, you can subtly encourage higher-level players to follow up on all those wonderful plot hooks and ideas that you've been itching to try out. In fact on the page there’s this lovely tidbit:This artifact will shatter irrevocably if its gaze is ever reflected by the Golden Mirror of Ka. The wearer of the mask will be immediately stunned for a full turn and will remember nothing of what he did while wearing the mask, but he will be otherwise unharmed.Aspiring DMs are given a springboard for the creation of their first artifact, within the description of the sample artifact! Golden Mirror of Ka you say? The one that was lost when Milenia was sacked and razed by the Bogdashkan Orcs? Anyone care to take a crack at stat-ing the Golden Mirror of Ka in the comments? If you do, feel free to also provide a page number of the RC for me to tackle next!1. Medusae need a collective noun. In searching for a suitably snake-y noun, I did come across a rhumba of rattlesnakes, which is great. Posted by ktrey at 9:33 AM 2 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: dnd, RC hacks and house rules Wednesday, June 25, 2008 Mentzer Basic Set III The Gygax Memorial transcript, continued from Part One Here and Part Two Here...Wherein, our mighty adventurers agree to enter the Golden Gate and ascend several flights of stairs. Magic-User: “About how long have we been climbing?” DM: “As a Magic-User, you’re good with numbers and recognizing patterns, so I’ll say you’ve been counting steps this entire time. By now the party has almost twice as high as the previous set of stairs.” Magic-User: “We must be getting closer to the surface! Maybe this is another way out!” Fighter: “Using the 10 foot pole I’m going to prod along the steps ahead and make sure there aren’t any traps.” DM: “So far so good, the steps finally end at a large 30 by 30 landing, there’s a rusty iron door barely hanging on its hinges in the center of the northern wall. The room is very dusty, and the rotting remains of a table and a few chairs are stacked in front of the door next to the short humanoid skeleton in corroded metal armor.” Fighter: “30 by 30? Got it!” Cleric: “Can I identify what race the skeleton is using my training as a Cleric of Lawful?” DM: “It appears to be the skeleton of a Dwarf. Easily dead for a hundred years.” Magic-User: “I’m going to try and search the room.” Fighter: “Me too.” Fighter: “And me! Watching out for traps.” (rolls) Fighter: “I got a one!”(Still no wandering monsters) DM: “Awesome Fighter! Beneath the skeletal hand of the dwarf you find a small piece of parchment, miraculously untouched by age and covered in thick silver runes.” Fighter: “Magic-User! Magic-User! I think I found another Scroll!” Magic-User: “I speak Dwarven, let me have a look at the runes.” DM: “I’ll get back to you in just a moment Magic-User, Cleric what have you been doing all this time?” Cleric: “While they’re searching the room, I’m going to say a prayer for the fallen Dwarf and take out the Wand that we found in the Kobold room. Is there anything on the wand that gives a hint about how it works or what it does?” DM: “The wand appears to be made of finely carved ivory, potentially from the horn or tusk of some giant beast. It’s hollow and one end is decorated with a stylized eye carved out of a blue gem. Small shiny brass axes are inlaid on the “handle” and form the wand’s grip.” Cleric: “Brass Axes. Like the Brazen-Axe clan? I bet this wand is dwarven.” DM: “Magic-User, the runes on the parchment do not appear to be magical in nature, but it does contain a message. I can read it out loud and just assume that you’re translating it for everyone. OK? Magic-User: “That’s fine. DM: The parchment says: “Hid axe and wand where those barking buggers will never find ‘em. Groma if you find this, use the wand to find the supplies by Lawful, we’ll need ‘em against the mother. Gasses getting heavier. Seeping in. Forgefather protect us! I have failed you my King!” Magic-User: “Bummer.” Fighter: “I HAVE FOUND THE AXE! I guess that makes me smarter than the kobolds!” Cleric: “And this wand is probably the wand in the message that we need to use to find the supplies. Magic-User can you tell me anything else about it.” Magic-User: “I don’t know, can I?” DM: “You can definitely tell that it is magical, probably not of an arcane nature though, and you know from your training that most wands need a command word to operate.” Cleric: “What’s the Dwarven word for Lawful?” Magic-User: “Dwawful” Cleric: “I hold the wand out and point it away from everyone and say “Dwawful” in a firm even voice.” DM: “The tip of the wand glows brightly, illuminating the room in a pale blue light. The light seems concentrated on the flagstone beneath the dead dwarf.” Fighter: “I MOVE THE DWARF!” DM: “The blue light outlines the dusty flagstone.”Cleric: “Awesome. Wand of Secret Door Detection or Find Traps. Be Careful!” Fighter: “Using the 10 foot pole, I try to pry up the stone.” DM: “It slides uneasily out of the way, revealing a dark opening.” Magic-User: “I approach with my torch, what’s do we see.” DM: “Your torchlight glimmers off of what appears to be a cache of fragile glass vials, filled with liquids.” Fighter: “POTIONS! Magic-User!” Magic-User: “I know. I’m on it. Do any of them look similar to the amber one that I gave to Fighter after his run in with the skeleton?” Fighter: “ALAS HE HAD NO BLOOD TO SPILL, BUT I DESTROYED HIM AND AVENGED MY DEATH!” DM: “Yes. Four of them appear to be remarkably similar to the amber potion. There are two more that are different though.” Magic-User: “What color are they?” DM: “Both are sort of a pale green color and slightly fizzy. Kind of like this...” DM gestures to the Mountain Dew on the table. Magic-User: “Mountain Dew? Seriously!?” DM: “Ancient Dwarven Secret. Dew from the Mountains!” Magic-User: “Is it Magical Dew?” DM: “Could be. Who wants to test it?” Fighter: “I HAVE ONLY 1 HIT POINT. STAND BY WITH AMBER POTION! I take a small sip of the Mountain Dew.” DM: “Even though it is a small sip, you feel invigorated and full of vim and vigor…” Fighter: “So it’s just plain Mountain Dew then?” DM: “The ache in your muscles seems to vanish, Fighter, as do the circles under your eyes. The tiny cuts from your battle with the skeletons completely disappear.” Cleric: “Looks like some kind of Super Healing Potion.” Fighter: “Works like Mountain Dew!” Magic-User: “We should definitely divvy these up. Everyone take an Amber Potion. Cleric and I will take a Mountain Dew a piece.” DM: “I’ve created a monster… So what now?” Fighter: “Is there anything else in the alcove?” DM: “The potions appear to be resting on something metallic, but it’s difficult to identify with all the cobwebs.” Fighter: “Magic-User, can I use your torch to burn away these webs?” Magic-User: “Yes, but be careful. There may be scrolls in there.” Fighter: “I carefully use the torch to clear away some of the webs in the hole, and use the extra light to get a better look at the metallic object.” DM: “It appears to be a shield of some sort. There’s an inscription on it.” Fighter: “OK, I’m going to reach in and pull out the shield. Can I read the inscription?” DM: “It’s in Elven script but the words are Dwarven. Magic-User translates “To Groma, adventurer and ally to the end! I hope you return soon with help from your Elves!” Cleric: “The concept of the relationship between the languages on this makes my brain hurt.” Fighter: “I THINK I HAVE GR'''
