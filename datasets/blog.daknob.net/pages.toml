["https://blog.daknob.net/fiber-in-the-home"]
title = "Deploying Fiber In The Home"
full_description = "Getting a fiber Internet connection to your home is a big deal! It’s probably the last physical connection you’ll ever need, due to the virtually unlimited bandwidth, stability, performance, and attainable speeds. Having your ISP drop it off on the building entrance however is not enough. Wiring within a building is often needed, especially if you need to reach apartments, mechanical rooms, and all sorts of places where networking may be required. In the spirit of DIY, as I’m the ISP, I decided to upgrade my existing wiring in my home and document the process here, for everyone to read, learn from, and enjoy. So to get started, let’s understand what we’re dealing with. The building I am installing fiber to has 4 floors, it has access to two streets, on opposite sides, and has three vertical paths that cut almost across its entire height. There are also two manholes, one on each street, where it’s possible to accept fiber optic cables from the outside world. Here’s a visual representation of that, using my advanced architectural design skills: These vertical paths are either pre-existing, or they were created in previous work, and they allow for the easy traversal of cables within conduit across floors, following all building and safety codes. As buildings in Europe have concrete slabs and single or dual brick walls, insulation layers, pipes, cables, including within each floor, having these there helps immensly in implementation time, cost, and overall effort involved. Doing work on Layer 1 of the TCP/IP model is tedious and slow, requires extra materials that may not be in stock at home, and creates a mess. You’re drilling holes, have contractors over, and it’s also not really cheap. For this reason, I wanted to use economies of scale, as well as a modular design. I decided to install something that’s beyond what I need today, but not by too much. I wanted to balance implementation time and cost with future expansion and usage. But what do these colors mean? Each red line is a cable that is installed. The two blue ones are spans of cable that couldn’t be installed, due to lack of time, and were left for a future date, if there is demand."
