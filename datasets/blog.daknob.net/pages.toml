["https://blog.daknob.net/the-best-https-configuration"]
title = "The Best HTTPS Configuration"
full_description = "Nowadays, the web is moving towards making HTTPS mandatory across all websites. Initiatives like Let’s Encrypt that offer dead-simple https installation, or Root CAs like StartSSL that offer unlimited free certificates or even browsers like Google Chrome that already started deprecating HTTP all contribute into going towards this direction. Many of us think this is the correct way. An HTTPS-only web provides a lot of great advantages over the traditional, HTTP one. However, just because you can see that little green https:// in your address bar doesn’t mean you’re secure. There is a vast amount of possible SSL/TLS configurations that a system administrator can make that range from the most secure one yet, all the way to “Rebranded HTTP”. Currently, configuring a web server to be really secure is increasingly difficult and requires the administrator to always watch the latest news for the upcoming attacks and deprecations that may require a change in the configuration. Fortunately, tools like Qualys’ SSL Server Test make the job a little bit easier, as you can run that test against your (or anybody else’s) servers and see a little nice grade on how well you did. This grade can range from A+ all the way to F, or even T. At least that’s how low I’ve seen it go. Maybe you can make an even worse configuration.. ;-) Now getting an A+ is not really difficult and ensures that your website is relatively secure, at least as far as HTTPS is concerned. Let’s see how we can get this grade in Apache 2.2.22 on Debian Jessie 8.0 with mod_ssl. For this to work, you need a valid HTTPS Certificate from a Trusted Certificate Authority. In order to start for free, you can use StartSSL. Now you need to make sure this certificate is signed with SHA-2 or SHA-256 (actually the latter is a part of the first). After that, you can create a VritualHost for your secure website: The above example will create a basic HTTP website for the domain secure.example.com listening on port 443. Now the next lines can be added below the ServerName:"
year_published = 2025
