["https://blog.daknob.net/the-callback"]
title = "The callback"
full_description = "Every two years my phone contract expires. This is the maximum duration of a phone contract for an individual so I have to spend some time on updating it every now and then. The problem is that every time there are new offers and usually your old plan is not available. So you have to find a new one. After looking at the new plan catalogue of my carrier, I figured that for the same specs (talk time, SMS and bandwidth) I need to pay a little bit over 2.5x more money than before. Of course, that is something no sane person would do. So I started looking at the competition for solutions. Sooner or later, I eliminated some possibilities because they provided some amazing discounts I couldn’t believe they were real: Like almost everyone else, they have a Callback feature on their website where you can enter your phone number and have it securely transferred over HTTP to them and placed in a queue so they can call you. This carrier, like some others in the same country, calls you, and the moment you pick up the phone they hang up, presumably so they can cut down their costs. That’s how they offer the best experience for wannabe customers. I tried this feature 3 times and all three times they hung up two seconds after me picking up. This annoyed me a lot. I didn’t want to call their number because they didn’t want to call mine. So I had to somehow make them lose this cold war. I suppose it’s a good thing I am a Computer Scientist. After examining the request sent, I figured out it is a simple POST request to the web server with no rate limiting. That’s good. You probably already know where this is going. There are some static fields there that I suppose never change and of course the phone number. They are also security aware and include a CSRF Token. Bonus points for that. Brute forcing a URL with a CSRF token can be nasty. You need to first send a GET request, parse the output, extract the CSRF Token and then send the POST request. Right? Well, not really.. Vodafone does a common mistake of not invalidating the token after its use. That means we can add this token manually and then keep using it for as many times as necessary. Awesome!"
year_published = 2025
