["https://blog.daknob.net/fix-ip-geoloc-isp-guide"]
title = "Fixing IP Geolocation: An ISP Guide"
full_description = "DISCLAIMER: I am currently working for Google. This post is published in my personal capacity, without using any knowledge I may have obtained from my employment with them. All the information provided here is coming from purely personal experience in dealing with this issue. There are probably infinitely many reasons why one might want to know the approximate location of a device based on its IP address. However, this information is not part of any Internet protocol, therefore third party services are trying to determine, with the highest accuracy possible, where each address probably is. There are plenty of free and commercial offerings that can provide this to operators. You will always run into incorrect data problems however. First of all, there’s no one true way to obtain this information. Everyone is using a mix of signals with various degrees of success. You can ping an address from various locations and triangulate, which doesn’t work well, you can look at whois records and hope for the best, you can monitor which country or language website visitors from these addresses pick on a website, collect GPS information from a cooperating (mobile) application, look at the ccTLD of reverse DNS, etc. But it’s not always easy as, especially on IPv4, multiple devices can use one address. What about addresses rarely used? What about CGNAT, with up to hundreds of ISP subscribers behind a single address? What about a corporate VPN? This problem (of bad data) is then amplified by decisions made with that data. What if a website only allows only IP addresses from a single country to visit it? What if it uses the information for a fraud check (e.g. on a payment)? What if it switches to a language you don’t speak? Or it limits its functionality as it’s only available in specific countries. ISPs are typically on the other end of the support phone call or e-mail, receiving a report and then having to fix it. But how do you fix this problem as a network? How do you ensure it’s not coming back? I’ll try to provide some best practices for networks in this post, that can be used to address that problem."
