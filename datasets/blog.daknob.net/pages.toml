["https://blog.daknob.net/rpki-deployment-greece-feb-19"]
title = "The state of RPKI Deployment in Greece"
full_description = "RPKI, or Resource Public Key Infrastructure, is a way to cryptographically produce and sign messages that bind a particular IP prefix with an originating Autonomous System. It essentially contains the information “192.0.2.0/24 up to /24 can originate in BGP from AS64500”. Or, “2001:db8::/32 up to /48 can originate in BGP from AS64500”. These messages, after they are signed by the rightful owner of 192.0.2.0/24 or 2001:db8::/32, can be made available to anyone, so network operators can protect against accidents, such as a typo, causing traffic to be sent to the wrong destination, or against malicious attacks, with the purpose of hijacking IP prefixes using BGP, to monitor or change traffic. Operators need to monitor the announcements they receive from BGP, and compare them against this list of signed messages. This comparison can yield three possible outcomes. The first is valid. That is, the announcement received over BGP matches an RPKI “ROA” (or message). It can also be invalid, which means that there is a mismatch, i.e. the owner of the IP Space did not authorize this ASN to announce this route. The final state is unknown, which means that there is no ROA message for this specific IP prefix, or, simply, that it is an ARIN prefix. After an announcement has been categorized into one of the above three buckets, it should be kept (valid / unknown) or discarded (invalid). Some operators may choose to prefer a valid announcement path more than an unknown one. So why are there three states, instead of two? Why do we have three possible answers in a yes or no question? What is this unknown? As I mentioned before, an IP prefix owner has to actively publish a ROA. They have to specify which IP prefix can originate from which ASN, sign this message, and publish it. So yeah.. Not everyone does this. Some operators haven’t heard of RPKI, some don’t fully understand it, some don’t want to do it, some find the process of publishing the ROAs difficult, … It doesn’t matter, as long as there’s no ROA by the owner, this prefix cannot be protected by RPKI."
year_published = 2025
