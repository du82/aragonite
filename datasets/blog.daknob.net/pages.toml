["https://blog.daknob.net/authentication-in-file-uploader"]
title = "Authentication In File Uploader"
full_description = "In my Department at the University Of Crete we have a set of computers where you can login using ssh(1) and access all your files, write code, run programs, and in general perform all tasks you may need without having to install linux on remove Windows from your computer. For “Security” reasons, these computers are behind two stripped, chrooted “Gates”. You cannot ssh into one of the computers directly, you first have to ssh to one of the gates and then from there ssh into your desired computer. Pretty much the only thing in the gates is ssh(1) and enable, the second of which does a port forward to the computer you need. That means that every time you work on something locally and you need to put it up to one of the computers for submission, you have to first ssh into the gate, then enable the computer, then sftp into the computer, then ssh from the gate to the computer and submit your files. Since it’s so complicated you didn’t understand it the first time you read it, neither do freshmen on their first semester. I thought I could help them out in this situation and use the feature of the public_html folder that is supplied. This folder gives you your personal website, under ~username. It supports a stripped-down, basic version of PHP. For this reason, I created CSD File Upload, a simple PHP script that accepts a file and a password and uploads the file in the user directory without any more hassle. The way I was handling the user password was to include its SHA-256 hash in a PHP Variable in the beginning of the file. When the user installed the software, she was executing: and changing the variable content with the output. As simple as it gets. The script, of course, was only accessible through https. A day after it is announced in the public mailing lists by the System Administrators, I start getting Pull Requests by students. That’s good news because they seem to care and/or know PHP/git, both of which are not in the official curriculum. I get a Pull Request from a user making an “improvement”, and that is putting the password in a separate file, password.txt and then reading it from there. Now we all know this is insecure because that way anyone can visit /password.txt and get the password hash."
year_published = 2025
