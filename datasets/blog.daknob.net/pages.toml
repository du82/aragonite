["https://blog.daknob.net/mapping-the-greek-inet-oct-19"]
title = "Mapping the Greek Internet - Oct 2019 Edition"
full_description = "On October of 2019, I attended RIPE79 in Rotterdam, which was a very good experience. I had a chance to meet new people, talk to people I already knew, exchange ideas, and discuss various topics. It’s a very good event, and Ι recommend it, if you can attend. During one of the conversations I had there, ironically with another guy from Crete, Vasileios Kotronis, we discussed about how some companies pay large sums to obtain IPv4 space, yet some others, especially univerities, have vast and unutilized address space. And then we wondered, if there was a way to know how much IP Space is being used, and how much isn’t, and it’s just sitting there. Well I’m glad to report that this problem can be considered… still unsolved. This is not a blog post on how we solved it. It is very difficult, even impossible I could argue, to really know this. For example, the United States Department of Defence, has multiple allocations of /8 networks, some of which have never been advertised to the global BGP table. These networks never appeared on the Internet. So no matter what clever method you try, I don’t think it’s possible to measure their utilization. One could go even further as to ask “What is utilized and what is unutilized address space?”. It’s a fair question, which I don’t have the answer to. If I allocate a /24 to a DHCP range, and it only sees 5-10 devices, how much of it is untilized? All? None? Everything but 15 addresses? Anyways… As I was sitting in Amsterdam’s Schiphol Airport, I remembered a very good blog post from Ben Cox, who mapped the entire Internet by first pinging each IP Address, and then creating a square image of the responses. You can find all the images in his blog post, which is worth checking out. As you can see, representing each IP Address as a dot, in a 65536x65536 matrix, where 1.2.3.4 goes to position 256*1 + 1*2, 256*3 + 1*4 is not good enough. As it turns out, people aren’t made to be able to understand patterns, “closeness”, and other things in such ways. This is where Hilbert Curves come in. They are a mathematical way, where given a coordinate set x,y like the one above, you get back a different set of coordinates, which places elements linearly close to each other in squares, close to each other, but in the 2D Space. Again, go check out Ben’s wonderful explanation and animated GIFs, he’s doing a better job than I could."
year_published = 2025
