["https://blog.daknob.net/not-everyone-works-for-you"]
title = "Not everyone works for you"
full_description = "In the past few days, a lot of people started complaining about Let’s Encrypt and how it has issued TLS Certificates for PayPal. Various posts like this were written to complain about that, and some people even went as far as writing blog posts for Let’s Encrypt to stop issuing certificates with the word “PayPal”. Apparently, a lot of people agree with this. That last blog post even mentions that Certificate Authorities performed checks and still do, to try and avoid issuing certificates with this word. Luckily, some people are still reasonable. About a month ago, I wrote a blog post on abuse e-mails and what I believe they should be used for. The gist of it is that a lot of companies, even “security” companies, keep sending large amounts of e-mails to ISPs because one of their IP Addresses attempted to login to their website with a wrong password, or even had a funny User Agent. The connection between the two is that, in both cases, someone does not want to spend money or time securing their product or service and wants others to work for them for free. In the case of abuse e-mails and “security” companies, they don’t want to invest money and put some effort into securing their websites, so they e-mail the ISP of everyone who did something even remotely out of line according to them and ask them to either ban the users completely or stop these “attacks”. If you want your service to be secure, make it secure. Don’t complain to other people and expect them to work for you and police their users to satisfy your needs. In the case of Let’s Encrypt issuing certificates for phishing domains, although it’s not PayPal complaining directly, they can do something to make sure their customers aren’t getting phished. They can, for example, make Two Factor Authentication mandatory. In that case, even if someone successfully poses as, even, paypal.com and they even have a valid certificate for that domain, and the user even enters their credentials, they can’t be used. A second factor of authentication is required, such as an SMS, or even better Google Authenticator (TOTP), or even even better U2F."
year_published = 2025
