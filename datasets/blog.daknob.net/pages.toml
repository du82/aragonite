["https://blog.daknob.net/acme-end-user-client-certificates"]
title = "End-user Client Certificates with ACME"
full_description = "DISCLAIMER: I am currently working for Google. This post is published in my personal capacity, without using any knowledge I may have obtained from my employment with them. All the information provided here is coming from purely personal time and effort and does not represent the opinions or practices of my employer. In my previous blog post I described how I built my own ACME CA to issue workload certificates for the various services I am running. The only thing left out was one final use case. End-user client certificates. This post helps complete the “vision” of the “mTLS Universe”. After reading this out loud, I can see how it may sound like a nightmare for some… :) All my pods and servers can obtain TLS certificates from my ACME CA without problems, using e.g. TLS-ALPN-01 or KUBERNETES-01, which is a new challenge I created for my usecase. However, when my laptop wants to connect to these services, it needs a TLS certificate as well. It doesn’t have a static IP address, or a dynamic DNS record pointed to it, nor does it have port 80 and port 443 always available on the Internet. It therefore also doesn’t have a hostname pointed to it 24/7 that can be used for DNS-01. And my shiny new ACME challenge is useless, as this is a physical machine, and not a Kubernetes pod. I need a way to prove to my ACME CA that it is indeed this laptop that requests a certificate, and it really deserves one for the hostname I want. As this is a new challenge, that cannot be addressed by existing Challenges, let’s create a new Challenge! Any good one needs a way to create proofs that the server can trust, that cannot be faked, and that are tied to the particular entity that requests the certificate. This seems like… attestation. My colleague Brandon is actually standardizing one such challenge as we speak, which would probably be enough, and possibly better, but chronologically I designed and implemented this challenge almost two years ago, where this effort did not exist. This new challenge is actually older than KUBERNETES-01! Perhaps in the future I can migrate to his. I really like the use of WebAuthn, which I didn’t think of. You can reuse so many existing things."
year_published = 2025
