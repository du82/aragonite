["https://blog.daknob.net/guarding-your-tor-exits-dns"]
title = "Guarding your Tor Exit's DNS"
full_description = "In the past few days, a study was released detailing some attacks against the Tor Network. These attacks made it into the news because one could compromise Tor Users’ anonymity by examining the DNS queries from exit nodes. The argument made by the researchers is that while HTTP traffic may be encrypted, DNS traffic is sent in plaintext, and can usually traverse more networks, before it eventually reaches its final destination. In addition to that, they also discovered that about 40% of the Tor Exit Nodes use Google’s Public DNS’, in the IP Addresses 8.8.8.8, 8.8.4.4, 2001:4860:4860::8888, and 2001:4860:4860::8844. That means that a single organization, Google, receives and responds to about 40% of the DNS queries made through Tor. Unfortunately for Tor users, this attack relies on collecting a large sum of DNS queries, which means that, Google, if they wanted to, could deanonymize a significant portion of the users. Luckily for the Tor Network, this attack can be quickly mitigated. While the solution does not address all the issues, it can make it significantly more difficult for a malicious adversary to perform it, and removes Google from their privileged position. But let’s see what’s this solution. In the diagram provided by the researchers, there’s the Exit Relay, which then makes two connections, one to the DNS server, and one to the actual website’s web server: What if that DNS connection was made, but it did not have to traverse a large amount of networks before reaching the DNS Resolver, but instead, followed a much sorter path? What if that connection wasn’t established with Google’s DNS, or any other “popular” DNS server? By following a few simple steps below, we will see how we can protect our Tor Exit Nodes’s Users from such an attack, or at least limit the damage done / increase the cost of the attack. As you may already know, I’m already running an Exit Node, and I have a blog post on my stories fror running it for the past 8 months. This node is running Debian Jessie, but the instructions should work perfectly on Ubuntu, as well as any other operating system, maybe with a few modifications."
