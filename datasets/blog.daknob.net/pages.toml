["https://blog.daknob.net/ipv6-first-with-vyos"]
title = "IPv6-First LANs with VyOS"
full_description = "VyOS is a free Linux-based distribution that can turn any regular computer or virtual machine into a fully-featured router. By combining existing open source software into a single image, and tying it together with a single configuration file, upgrade mechanism, and an automation API, it makes the job of network engineers and sysadmins easy. It’s been a few years since I last used it, after determining it was not good enough for me, but the progress they’ve made in this time frame is unbelievable, and it’s practically a different thing by now. I plan to blog about VyOS more soon, and this transformation that happened, but for now I’d like to go over a setup that I did. We’re going to be using a VyOS router that will connect in an ISP on eth0, it will receive an IPv4 and an IPv6 address using PPPoE, it will request a /56 IPv6 prefix using DHCPv6-PD, and it will then create two VLANs on eth1, one of which will be IPv6-First, while the second will be IPv6-only. This can be a home, office, or event / conference network. As long as we have clients that want to reach the entire Internet, this should all work. This setup can also occur when you have static addresses, and you don’t need PPPoE or DHCPv6-PD. The first thing we need to do is to configure PPPoE to receive our IPv6 and IPv4 addresses, and upstream connectivity: Of course, change the username and password, and review other options under pppoe0 such as description, no-peer-dns, ip adjust-mss clamp-mss-to-pmtu, ipv6 adjust-mss clamp-mss-to-pmtu, etc. In some cases you may also need ipv6 address autoconf. We’re now going to create our two VLANs in eth1, which will be 10 and 20. We will add the IPv4 to one of them, which will be IPv6-mostly, which will come from the RFC1918 IP space: We now need to request some IPv6 LANs (/64 networks) from the ISP. This is done using DHCPv6-PD. Most ISPs will give you a /56, while some will even hand out a /48 network to you. These contain 256 LANs and 65,536 LANs respectively. Unfortunately, there are some networks that may give you less, e.g. a /58 or /60. Figure out how much your ISP is handing out because it will be needed. In almost any case, if you request more, you’ll get the maximum, but it’s better to be exact here."
