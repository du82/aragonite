["https://blog.daknob.net/mapping-44net"]
title = "The utilization of 44/8: the reason I mapped IPv4 & IPv6"
full_description = "In the early days, when the Internet was just beginning, back in 1981, radio amateurs were allocated, by what is now known as IANA, an IPv4 block for usage and experimentation by all members of this hobby, internationally. This block was 44.0.0.0/8, which is a huge amount of address space by today’s standards, but effectively the only allocation size back then. This network was mainly used under the “AMPRNet” name and utilized packet radio, or to put it simply, a packet-based network (like the Internet) over radio frequencies, wirelessly. This network was able to interconnect “hams” (the people that have been licensed to practice this hobby) around the world, and provide them with digital connectivity before (access to) the Internet was generally available. Since then, very large communities were developed using these IPv4 addresses, with the largest by far being HAMNET that is mostly based in Europe for now. But the Internet has also come a long way since then. Affordable Internet connections at workable speeds are available to large parts of the population and services tend to be able to function okay on a public network, reducing the need for private communications over a non-Internet medium. The first major change that we see since then is the sale of a quarter of the addresses to Amazon Web Services for use in their Cloud. This happened in mid-2019 for $108M. This sale reduced the IP space to “44/9 and 44.128/10”, but I will keep referring to the ham part as 44/8, still, as it’s more convenient. The network is currently split into two parts. The first one, 44/9, with almost 8 million addresses is allocated to the United States of America. With a few exceptions, each state has a /16, which is about 65,000 addresses, and has another /16 network available right after that for future growth. The major exception to the above is California that currently has at least 7 /16 networks, totalling almost half a million IPv4 addresses. The 44.128/10 part, with 4 million addresses is currently allocated to the rest of the world, i.e. almost all countries except the U.S.A.. The general rule is that every single country receives a /16 network and then further allocations could be made for regions of this particular country if needed. Here the exception is Germany, because of the success of HAMNET, that has 5 /16’s to cover the entire need for space. The interesting thing is that two of them are still in the part of addresses that has been acquired by Amazon, and is still undergoing a very large renumbering effort for the past 2 years."
