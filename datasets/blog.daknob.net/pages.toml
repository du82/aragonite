["https://blog.daknob.net/e-voting-math-vs-implementation"]
title = "e-Voting: Math vs. Implementation"
full_description = "Technology has a deep impact in most people’s lives today. We all use the Internet when possible and we seem to do almost all we can online. We pay bills, we buy food and goods, etc. One of the things we don’t do yet is vote electronically for critical elections, like Government / Presidential Elections or a Referendum. In the traditional voting process, millions of euros are invested in a single voting event because we think more people can walk up to a certain place and vote than can vote using an Internet-connected computer. We also don’t completely understand the technologies behind e-voting and we don’t trust them. This can be the case because we still have a fear for technology. Researchers have been trying for years to come up with a voting system good enough to be considered secure and impossible to tamper. By involving encryption, signing, and a lot of mathematics, they created what’s considered one of the best models, Helios. Helios, originally shown in an Academic Paper uses asymmetric cryptography to ensure and mathematically prove that nobody can tamper with the system at all. So there you have it. Just convince your country to run the next election using Helios, and everything should be fine. Correct? Definitely not. One of the most important things with Computer(s Science) is to understand that the theory / model and the practice / implementation have enormous differences. This also applies here. Let’s just assume that we have this model implemented. If a malicious party wants to tamper the voting or even cause it not to happen, they can do it. There are many points where the security of the system can be compromised, including, but definitely not limited to: Even if the code is perfect and has no bugs, something known to be impossible, especially at this scale, an attacker can hack into the server and replace the code running with her own version, that looks identical but actually isn’t. This might seem not easy, and in some cases it’s not. I assume that if a country is running e-voting elections and people vote from their home, there will be an entire team behind this constantly monitoring it."
year_published = 2025
