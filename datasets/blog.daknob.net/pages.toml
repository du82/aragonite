["https://blog.daknob.net/l2-protocols-on-ixes"]
title = "The IXP is not your L2 Domain"
full_description = "There are currently over 1,100 Internet Exchange Points around the world according to PeeringDB. These Internet infrastructure locations serve as a meeting point for networks all over the planet, allowing for cheap (or free!) exchange of low latency traffic. The idea is simple: if a lot of networks are in the same datacenter, why have them spend a fortune connecting to each other with direct cables? We can add some switches there, everyone connects to one of them, and then they get a Layer 2 connection to all other participants. The outcome of this is a more robust Internet, that’s more local, faster, and more secure. The more interconnections these ISPs have between them, the better it is for everyone. However, when you join an IX, you are plugged into a LAN where tens or hundreds or thousands of others are also there with their equipment. Each device has a direct connection to all others, which is done at a much lower level than IP. So things are bound to happen :) One of the common problems of that is people forgetting to turn off Layer 2 protocols (or not knowing they are on), and sharing more than you’d like with others. I saw today that BGP Tools added support for detecting such behavior in a small number of participating IXes, so I found the time to blog about my experience. In order to get an idea of what traffic is flowing in the Peering LANs, I started a very constrained tcpdump packet capture. I used my own network, AS210312, and I performed this at some of the exchanges I am connected to. Keep in mind that anyone can do this, I didn’t have any elevated privileges in any of these platforms, and this is traffic going to everyone. Here’s a list of things found: For those unfamiliar with IPv6, this is the equivalent of DHCP running over there. There are plenty of participants that are sending “RAs” to others, begging them to send all their traffic to their equipment. Thankfully, a properly configured router should not accept these, as they’re only for clients, but if a device does this, it will add a default route pointing to this network’s machine."
year_published = 2025
