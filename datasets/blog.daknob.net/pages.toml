["https://blog.daknob.net/debian-firewall-docker"]
title = "Debian Firewall when using Docker"
full_description = "Having a firewall is something that’s necessary, in my opinion, for every server. Not only for those with a Public IP Address, for any server. Not only for IPv4, for any IP version. Running a firewall and managing it adds overhead to the server administration and most people either ignore it, or use their provider’s firewall. Amazon and Google have done a great work in pushing people to use them in their clouds, but often that’s not enough. In order to increase the cost for an attacker, some people go one step further, “defense in depth” they call it, and set up a firewall on the actual server, too. That means an issue in the provider firewall (if there’s such a thing at all), won’t easily affect them, assuming the rules of course are correct. I am one of these people. I try to set up a firewall on the server (or any other intermediary routers) in addition to the one that may be available by the provider. Make no mistake: I know it won’t save me from everything, but it’s a good start. Debian, the operating system in almost all of my servers, has a very powerful tool included: iptables. Although not as beginner friendly as others, and with many wrappers (like ufw), iptables is all you need to run a firewall on the server. The past few years however, a new piece of software, called Docker, became really popular, and currently has millions of installations for either development, testing, or production. In my opinion, Docker is a very useful and powerful tool that solves a lot of problems if used properly. Now what “properly” is, I leave to you. For this reason, I am currently using Docker in as many places as I can, and of course, as many servers as needed. I am not running to “dockerize everything” and run “100% on containers” like some others, but if I were to calculate the percentage of services I run on it, it would be pretty high. However, when installing Docker using the official documentation as a guide, you end up with some pretty ugly iptables rules: docker creates a virtual interface, docker0, as well as a new interface for every container that is running. After running a few containers, you end up with your iptables rules looking like the following:"
