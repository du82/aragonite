["https://blog.daknob.net/password-managers-and-security-questions"]
title = "Password Managers and Security Questions"
full_description = "Nowadays, with all the website hacks the user credentials leaked, a password manager is one of the most valuable assets. It allows you to use a different, ridiculously long and completely random string as a password for every website you visit. That way, even if a website is actually hacked, and the hackers retrieve the password hashes, it would take them billions of times the age of the universe to crack your password. But even if they managed to do that, or if the website stored the passwords in a plain-text format, getting the password would serve them of no use. When obtaining such a large password database, attackers try to use the same e-mail and password combination to other services, such as Gmail, Facebook, etc, hoping that you reused your password. But this is not the case for you. Every time, a different password is used. But what if the attackers didn’t have to crack your super long password in the first place? What if they didn’t even have to hack the website and obtain the database? What if they simply had access to your security question answers? What was the model of your first car? or What’s your grandmother’s middle name? are actual security questions being used in online services, including some critical ones. In the age we live, all this information is available to literally everyone with access to Facebook. We provide this information to everyone, yet at the same time use them as keys to our accounts. Google, Apple and Facebook have started moving away from this kind of weak authentication. Some other companies are yet to follow. What can you do in this case? How can you protect yourself from them? What I do in these cases is pick a random question, and then generate a 50-character long string of lower and upper case letters, numbers and symbols. Afterwards, I save both in my Password Manager of choice, 1Password. Even if someone knows what was the name of my first school, they simply cannot know the answer I gave instead of that in this question."
year_published = 2025
