title = "Get eBay Users' Personal Info for free!"
full_description = "eBay is one of the largest e-commerce websites available, especially to people in countries without Amazon. It does not sell its products directly, but instead relies on its users, therefore making an important distinction between sellers and buyers. Technically speaking there is not any restriction, which means a buyer can sell an item, and, of course, a seller can buy something, however usually you find accounts that only do one thing. Each user has a score on their profile as a seller and as a buyer, which means the reviews of every transaction are not merged. Today I am going to post a story about something that happened to me, and how the attacker pulled it off. This method seems to work and is able to extract the Personal Information of unsuspecting eBay users. I have then contacted eBay support over Twitter, e-mail, and via their website, and they mentioned there’s nothing they can do and nothing they are willing to do. That means that if you fall for this scam, which is really difficult to avoid, given the circumstances, all your information is handed out to a hacker and you get no protection. Like it wasn’t eBay’s fault. So let’s begin with the story. I was at my iPhone one day and I was browsing for network equipment on eBay, and more specifically the “New” category. I thought of searching for Access Points, since I may be in need of some. After the iOS Application returned the results, I sorted them by “Price + Shipping, lower first” since I did not want to buy anything, just look at the prices. A pack of 3 UniFi APs by Ubiquiti, the same series with the ones I currently have at home. They were the base model, which is 2.4 GHz only, but still is of very good quality with very good features. This pack is currently retailing for € 162.57 but the listing I found had it for only CAD 30.00, or about € 20.00 at that time. Usually when I find this kind of price in such an item I am really skeptical, so I immediately opened the item on my laptop. I checked the seller, and there were 1-2 sold items and many purchased. The item was also cover by eBay’s Money Back Guarantee, which means that if I don’t receive the item or it does not match the description, I have the right to get back the full amount I paid for. So the only thing that’s left is to check the description."
