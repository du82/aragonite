["https://blog.daknob.net/password-reset-after-data-breach"]
title = "Reset passwords after a data breach?"
full_description = "Today I received an e-mail from a website I am using regarding a data breach that seems to have leaked the user database. The message was well written, and it prompted users to reset their passwords and enable 2FA. That’s great, right? In this post I’d like to argue that blindly moving to password resets and calls for 2FA isn’t necessarily the best first step for such situations. There’s more that needs to happen in advance, otherwise you may even lower the security of your users. Before getting started, I’d like to point out that I won’t be talking specifically about this incident, but in general about situations like this, since I also don’t know exactly what happened in that one case. When attackers gain access to your systems and are able to exfiltrate your user database, it means that access was somehow gained through a vulnerability or weakness. This method may be repeatable. For example, if an SQL Injection attack was carried out, or some employee’s credentials were used, an attacker can keep using these until they are patched. If you detect a data breach and immediately request users to reset their passwords, without identifying all the methods the attackers used to gain access to your systems, then they can always log in again tomorrow, and download another copy of your data. If you keep asking your users to reset their passwords multiple times, eventually they’ll get tired and either stop doing it, or move elsewhere. It doesn’t inspire confidence to request 5 identical actions for a single incident within a short amount of time. It’s therefore important to make sure you understand exactly how attackers got in, patch all the issues they were able to exploit (address software vulnerabilities, rotate credentials, etc.) and only then move forward. It’s rarely effective to do a Hail Mary and try everything because you can’t figure out how they gained access. Time is definitely running out, and you can’t take months, but if you don’t know what you’re dealing with, whatever you do won’t be effective. If you want an indication of approximately how much time you have, you can take a look at your password storage strategy. How much time would it take for 8 of Nvidia’s latest high end GPUs to crack the weakest passwords (bottom 1%? 5%?) allowed by your password policy using the (weakest) hashing algorithm you have? One second? One day? One month? Whatever that may be, don’t try to exhaust this timeframe, as the clock started when the breach was made, not when you noticed. And you may have had more in the past."
year_published = 2025
clearnet = "https://blog.daknob.net/password-reset-after-data-breach"
