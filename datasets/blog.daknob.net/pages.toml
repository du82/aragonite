["https://blog.daknob.net/running-a-tor-exit-node-for-fun-and-e-mails"]
title = "Running a Tor Exit Node for fun and e-mails"
full_description = "The Tor Project is a non-profit organization in the United States that created Tor, The Onion Router, a free software that creates an open network of volunteers which helps people anonymize their traffic by routing it through three or more other computers before it reaches its final destination. Tor got its name from the encryption that happens during the relaying of the information. Every time a user wants to access a website using Tor, they create a circuit between three or more nodes in the network. Afterwards, they encrypt the data with the last node’s public key, then they encrypt the output with the middle node’s public key, and finally they encrypt that output with the first node’s public key. This creates an message with several encryption layers, which needs to be peeled by each node like an onion. In order to be able to use Tor, volunteers need to operate the so-called “Tor Relays”. These are computers running the Tor software that accept incoming connections and forward them to the next hop, or to the Internet. Currently there are approximately 7,000 relays in the network, a number that so far has kept increasing. The following graph is from the Tor Project Metrics Page which illustrates that: With those relays being mostly servers with very fast Internet connections, the total bandwidth available for Tor is currently 180 Gb/s, a very large number with today’s standards, especially for a volunteer, not-for-profit network. Again, Tor Project Metrics has the appropriate graph: However, the way Tor works, not every node in the network relays traffic to and from the Internet. The subset of Tor relays that also provide access from within Tor to the Internet is called “Exit Nodes”, and, of course, it’s smaller than the total amount. Currently there are about 900 of these nodes: As you probably noticed by now, the above number of 180 Gb/s isn’t the total capacity of the Tor network since each connection consumes at least three times more bandwidth than needed, therefore Tor users can actually access the Internet with only one third of that, or 60 Gb/s, right? Well, not exactly. It all depends on the total bandwidth available by the Tor Exit Nodes: it doesn’t matter if the entire network can push 60 Gb/s if the total Exit Node bandwidth is 1 Gb/s. It will create a bottleneck for accessing the web."
year_published = 2025
