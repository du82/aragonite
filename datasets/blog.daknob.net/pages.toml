["https://blog.daknob.net/a-secure-week"]
title = "A Secure Week"
full_description = "As an engineer, I am genuinely interested in challenges. Not necessarily the problem-solving challenges that we can face daily as a profession, but others forms as well. This is why I decided to challenge myself in a computer security related way. For some of my daily Internet browsing, I make use of Google Chrome, and I have the HTTPS Everywhere extension installed. What this browser extension (claims it) does is check every website I visit and determine whether there is an HTTPS version available, and if there is, it redirects me there. This has many benefits, and can help upgrade insecure requests that I may make, by clicking on an http:// link for example. It essentially does its best to encrypt as much of my web browser traffic as possible. But this extension has a second option in its Settings menu. The option to block all HTTP requests and only allow HTTPS traffic. That means that if a website does not support the secure version of the protocol, or has issues implementing it (such as untrusted certificates, mixed content, etc.) I cannot visit it. I just see an error, like the one below: So what I did was to challenge myself to block all HTTP traffic for one week, and then write this blog post with notes, comments, and results. After all, I have already done something similar in the past, by blocking all network traffic destined to 80/tcp. Now many of you will think that with free certificates, minimal performance overhead, dead simple configuration, and even performance benefits, it won’t be an issue. Most websites will already support that by now, and I will experience no difference. Of course, this is a big mistake. During my first day, I visited some websites to see how they stand up, and one of the first things I realized was that most Greek websites did not support HTTPS at all. I immediately lost access to most of my country’s websites. First of all I tried some University of Crete sites. The main website did not work because it had a terribly misconfigured server, but the Computer Science Department website worked. I could also see my grades, and even use the e-Learning platform that’s currently in place. Of course, that’s not the case for every department or school, and certainly not true for all universities. I just happened to be lucky."
year_published = 2025
