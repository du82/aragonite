["https://blog.daknob.net/workload-mtls-with-acme"]
title = "Workload mTLS with ACME & Go"
full_description = "DISCLAIMER: I am currently working for Google. This post is published in my personal capacity, without using any knowledge I may have obtained from my employment with them. All the information provided here is coming from purely personal time and effort and does not represent the opinions or practices of my employer. ACME, standardized in RFC8555, provides for a way of automatically issuing certificates at scale, using an API, and eliminating all manual work. Most of the TLS certificates issued today in the WebPKI are issued using ACME. It is an enormous milestone for a protocol first presented in 2016 and standardized in 2019! The protocol is so popular that Go includes an ACME client in its standard library, and even a helper, autocert, which automatically takes care of all certificate needs for an application. I wanted to capitalize on that, and make workload-level TLS as easy to automate, reliable, and painless, as Let’s Encrypt made website certificates. The place I applied this on is my own Kubernetes cluster. It is being used outside of that, for some applications that run separately, but it’s mostly for services and jobs running there. My goal is to secure all service to service communication with End to End Encryption, and remove any reliance on transport security at the network layer. Not only does this simplify the network setup, it also offloads all encryption and decryption to each application, so the routers don’t have to do a lot of work. E2EE is a very nice bonus. Even jobs on the same worker / VM use TLS between them. It’s so cheap at my scale… For this to work, each service running on the cluster (or outside), and each instance of it, has to present a TLS certificate to its clients. I could manually configure a certificate for each one, issued by hand, but this is very problematic, and I’d have to either use very long-lived certs, or set up a recurring calendar event to renew them. I could also use something like cert-manager that automatically gets certificates from a public ACME CA, but this creates problems. In order to not modify TLS verification, I would need a way to map public hostnames to internal IP addresses, and I would have to abide by all the rules of the WebPKI. It could also pose rate limit concerns with the ACME CA I am using."
