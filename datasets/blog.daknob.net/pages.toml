["https://blog.daknob.net/size-matters"]
title = "In Transparency, Size Matters"
full_description = "In my previous post I spent one week without access to non-HTTPS websites. It was difficult, but I managed it. It was a challenge to determine how much of the web is HTTPS yet. It went well, mostly thanks to CloudFlare, but got me thinking about HTTPS again. See, one of the three benefits of using this, more secure, protocol is authenticity. When a website has a valid certificate, there’s a Certificate Authority out there somewhere that has explicitly marked this public/private key pair as trusted, and therefore your device inherently trusts it. More specifically, it marked this as trusted for only a specific domain or collection of domains, not for everything. That means that in order to impersonate a website using HTTPS, the attacker will need access to a valid certificate for this particular domain and not just any CA-signed certificate. That means they either have to hack the server and somehow obtain the private key to an existing certificate, or hack a Certificate Authority in order to trick them into issuing a new one for them to use. In one case, a prominent Dutch CA (DigiNotar) was compromised and the hackers were able to use the CA’s system to issue fake SSL certificates. The certificates were used to impersonate numerous sites in Iran, such as Gmail and Facebook, which enabled the operators of the fake sites to spy on unsuspecting site users. In another case, a Malaysian subordinate certificate authority (DigiCert Sdn. Bhd.), mistakenly issued 22 weak SSL certificates, which could be used to impersonate websites and sign malicious software. As a result, major browsers had to revoke their trust in all certificates issued by DigiCert Sdn. Bhd. The more recent breach is the one that happened to StartCom, and it allegedly allowed hackers to issue invalid certificates, although the CA itself denied it happened. These problems have caused the community to not trust Certificate Authorities and start working on alternative solutions such as DANE, and Convergence (which ironically makes no use of valid HTTPS in their website). These approaches completely eliminate the role of Certificate Authorities, although DANE is based on DNSSEC, which means you must place trust on IANA/ICANN, while Convergence requires you to trust any third party you wish."
year_published = 2025
