["https://blog.daknob.net/cosmote-voip-pbx"]
title = "Configuring COSMOTE VoIP on your PBX"
full_description = "About a month ago, for technical reasons, I was no longer able to use COSMOTE’s CPE in a landline connection with a traditional telephone. I could either spend time and money in the middle of a pandemic, to have contractors visit and route some cables, or, I could take the opportunity and do something I’ve been hearing about recently, which is to switch the service to VoIP, and terminate it to my own PBX. Since I wasn’t familiar with telephony and the latter was going to be much more expensive, it was a clear choice for me. I decided to set up my own PBX, and move the phone number to this service. I thought it was going to be a day of work max, and then some maintenance here and there. This turned out to be false, so I’m documenting my adventure here, in hope that it is useful to others. A PBX is a telephony system that handles incoming and outgoing calls and connects to other devices (phones at a business, or in this case a house) and providers (like OTE / COSMOTE). There are hardware and software solutions, but I wanted something simple and easy to manage that would have most functionality and wouldn’t take much of my time. The most popular choice seems to be FreePBX, but I had some issues configuring it for my use case and it’s designed with some assumptions in mind that did not fit my particular usecase. For this reason, I ended up using VitalPBX which supports less features, but fits my case better. They are both Web UIs + a utility collection for Asterisk under the hood, which I wouldn’t dare to touch by hand.. It would violate the low maintenance and low effort principle. Setting up VitalPBX was very easy, as it came with an ISO that you simply run in a virtual machine. I had it running quickly, and I spent some time to configure it to my needs. I also created two extensions (internal phone numbers, e.g. 3-digit ones) and added them to my phone and laptop, and I tried calling between the two. It worked fine, and I was pretty happy with that. When you connect your PBX to an existing telephony provider, so you can have access to the rest of the world, you typically use a SIP trunk. Effectively your PBX becomes an extension (device) to a provider’s PBX and all calls from and to you are sent over this connection."
