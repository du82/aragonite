["https://blog.daknob.net/lost-my-wallet"]
title = "I lost my wallet(s)!"
full_description = "It is currently 2021, and cryptocurrencies have scored an all-time high in terms of price, more than doubling the previous event that happened in 2017. For the record, a Bitcoin (BTC) went for over 51,000 EUR. Even large companies like Tesla are buying large volumes. So during this time, I was wondering if cryptocurrency theft is also on the rise, because of the increased returns of performing these illegal actions. After all, it makes sense to try and obtain something by any means, especially when it became extremely more valuable than before. In order to perform a non-statistical and non-representative experiment that could not prove this hypothesis right or wrong (i.e. I did it because it seemed like it was fun, and I wanted to see what would happen), I “lost” a few Bitcoin wallets on the Internet, and tried to observe what would happen. Would people notice? Would they contact me? Take the money and run? A wallet in the cryptocurrency context is a collection of some cryptographic keys that are able to control the spending of coins for their relevant addresses. In order to send money from a Bitcoin account, you need to know this secret key that is mathematically tied to the account number, and anyone who knows this key can then perform transactions on the account’s behalf. This is usually represented in the most popular cryptocurrencies as a “seed phrase” that looks something like this: If this leaks in a format that is not password protected (like the word seed or the QR code above), or the password can be guessed, then anyone can use this account like it is their own, and can perform actions like transferring all the balance to a different one. In order to run this experiment, I created 10 brand new wallets, and I stored their QR code on my computer. Creating new wallets is free and extremely fast, as it’s essentially just a random number. I then transferred to each wallet the equivalent of $10 in Bitcoin, essentially adding to the account balance. Now they all have a non-zero balance that can easily be converted to a little bit of fiat currency (USD, EUR, CHF, etc.)."
year_published = 2025
