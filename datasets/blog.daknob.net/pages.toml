["https://blog.daknob.net/grab-some-popcorn-and-launch-popcorn-time"]
title = "Grab some popcorn and launch Popcorn Time"
full_description = "Movie and TV Show Piracy has been going on for years. There are many websites that offer movie streaming online for free, as well as many torrent sites that provide you with links to download and watch anything. However, even pirates want simplicity and friendly user interfaces from time to time. This is where Popcorn Time comes to play. It provides an easy-to-use, Netflix-style UI for people to browse for Movies, TV Series and Anime. Due to its simplicity, Popcorn Time earned a large amount of users quickly that simply want to enjoy movies and, according to the slogan, only need popcorn. The client that runs on every computer achieves its cross-platform-ness since it is written in NodeJS, a framework to create desktop and standalone applications in pure JavaScript. Additionally, it is Open Source and everyone can view the code or modify it. Now let’s see some of the internals and how it works. When it launches, it connects to an API server to get the status and some other information: This time, the client requests from the api (v2) to list all the movies, sorted by seeds (which is used to infer popularity), only return the first 50, include ratings and contain movies from All genres in english. At this point, if you look at the code, you notice that Popcorn Time is doing something really smart to bypass ISP-level blocking (like the one imposed in the U.K.). It uses CloudFlare for the website xor.image.yt and then makes a request to: That means the computer will initiate a connection by resolving in the DNS level cloudflare.com and not xor.image.yt. The ISP cannot block it via DNS without banning the CloudFlare website. Later on, when CloudFlare receives the request, it checks for the Host header to redirect the traffic to the Popcorn Time API server. If an ISP wanted to ban that API, it would require Deep Packet Inspection to check in the HTTP Protocol Level every host. This is far more expensive than DNS blocking. In this response, only one movie is included, but this would normally include 49 more, since we asked for the top 50 movies."
