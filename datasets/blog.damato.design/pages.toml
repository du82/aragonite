title = "Astro RSS MDX"
description = "Showing more love for Astro, now that we can finally render MDX in RSS content."
full_description = '''I’ve been using Astro for a long time. The developer experience includes all the best parts from the way I learned web development nearly 30 years ago. The stuff that was missing back then is intuitively included, like HTML templating without the need for a heavy framework. I’ve since moved all the personal projects I’m currently developing onto an Astro stack. However, there’s been one thing that was always missing from the Astro ecosystem. Rendering full content MDX in your RSS feed. Astro’s recommendation From the docs, the general idea is to use Astro’s RSS package to create the feed. This isn’t doing anything too special itself. It leverages the src/pages directory to statically generate XML content based on your collections. Here’s the “whole” example from their docs: import rss from '@astrojs/rss'; import { getCollection } from 'astro:content'; export async function GET(context) { const blog = await getCollection('blog'); return rss({ title: 'Buzz’s Blog', description: 'A humble Astronaut’s guide to the stars', site: context.site, items: blog.map((post) => ({ title: post.data.title, pubDate: post.data.pubDate, description: post.data.description, customData: post.data.customData, link: `/blog/${post.slug}/`, })), }); } I put the word “whole” in quotes because you might notice that the post content is missing from the feed. Some folks prefer this choice to drive traffic to their website. Personally, I’m old school and would rather folks read my content in whatever medium they feel most comfortable. That’s why it was very important to include the full content in my feed. While Astro does have a section about rendering full page content, it is limited to vanilla Markdown. It does not include an approach to handle the full MDX documented. In fact, it suggests using an entirely different rendering engine. This has been a big thorn in the side for folks who have dynamic MDX content looking to migrate to Astro from other ecosystems. This is because the only way to render that content is by using the following: --- import { getEntry } from "astro:content"; const { slug } = Astro.params; const entry = await getEntry('posts', slug); const { Content } = await entry.render(); --- <Content /> That <Content/> component can only be rendered within the context of a .astro file. Now, you might think you could just render that content to HTML and then fetch the result. With some finesse, you can get this to work in local development, but a statically generated site will have problems. This is most likely due to a race condition, or the order in which data is rendered. Either way, there hasn’t been a clear approach to render MDX in Astro RSS feeds for a while. I still believe providing an API that suggests the content type of a file would be helpful. Similar to how you can render a partial file using export const partial = true; for frameworks like HTMX. Then we could render XML from a .astro file more directly. Luckily, one of the more recent releases of Astro introduces an approach that can get us what we’re looking for. Astro Containers In v4.9 of Astro, a new experimental Container API was introduced. The benefit of this API is the ability to render Astro components outside of the normal Astro context, specifically outside of .astro files. This is exactly what we need to get the content into a normal Javascript file. At first, this was not a straightforward process. We still needed a .astro file to help render the special <Content/> element. Soon afterward, the setup to do this became a lot cleaner which is what I’ll show in this post. We’ll start with a /pages/feed.xml.js file. This is similar to what was provided in the first example, and you can certainly use Astro’s RSS package to help construct the feed. However, to get the MDX rendering, you’re going to need some additional helpers. Let’s go through the file by each section, first the imports: import { experimental_AstroContainer as AstroContainer } from "astro/container"; import { getContainerRenderer as getMDXRenderer } from "@astrojs/mdx"; import { loadRenderers } from "astro:container"; import { getCollection } from "astro:content"; import rss from "@astrojs/rss"; The first line imports the new Container API, we’ll use this to create a new Astro context. The second line comes from the @astrojs/mdx package, and this will tell the container API how to render the data. The next import is used to load the renderers. For whatever reason, this isn’t included in the container API. The last two imports should be familiar, importing the getCollection method from astro:content and the rss builder from @astrojs/rss. Now we’re going to put those imports to work: export async function GET(context) { const renderers = await loadRenderers([getMDXRenderer()]); const container = await AstroContainer.create({ renderers }); const posts = await getCollection('posts'); const items = []; for (const post of posts) { /* Next part will be here */ } return rss({ title: 'My blog', description: 'All my thoughts', site: context.site, items, }); } First, we load the MDX renderer. Then we pass the result of that into the .create() method for making an Astro Container. Then we do a standard getCollection() for the posts. If you need to filter posts for some reason, make sure to also do that here before processing in the upcoming for loop. We’re using a for loop instead of a functional process because we’ll need to do some async work in the loop. After all the items are processed, we’ll write the feed using the @astrojs/rss rendering function. Let’s look at what’s inside the loop: const { Content } = await post.render(); const content = await container.renderToString(Content); const link = new URL(`/posts/${post.slug}`, context.url.origin).toString(); items.push({ ...post.data, link, content }); Assuming that your frontmatter matches the expected schema for @astrojs/rss, the only other keys you’ll need to provide are link and content. You can see how I construct the link by using the context.url.origin. This helps with local development. Our real focus is the content output. In here, we do something similar to how we might render the <Content/> element in a .astro file. However, then we send the output of that to the container.renderToString() method. The result of that is regular HTML that we can pipe directly into the rss() method at the end of the function. Here’s the whole file: import { experimental_AstroContainer as AstroContainer } from "astro/container"; import { getContainerRenderer as getMDXRenderer } from "@astrojs/mdx"; import { loadRenderers } from "astro:container"; import { getCollection } from "astro:content"; import rss from "@astrojs/rss"; export async function GET(context) { const renderers = await loadRenderers([getMDXRenderer()]); const container = await AstroContainer.create({ renderers }); const posts = await getCollection('posts'); const items = []; for (const post of posts) { const { Content } = await post.render(); const content = await container.renderToString(Content); const link = new URL(`/posts/${post.slug}`, context.url.origin).toString(); items.push({ ...post.data, link, content }); } return rss({ title: 'My blog', description: 'All my thoughts', site: context.site, items, }); } Again, you’ll probably want to add some additional metadata to your feed, maybe filter and sort the posts too. You could probably construct that data in a similar way to the approach taken for link above. This is basically how I create the feed at this very site. Hopefully, this helps folks with the final steps in migrating their blog to Astro. From here, the sky’s the limit! EDIT (2025-01-30): I’ve had a few people reach out about this post helping them get full content which is great! However, Astro did change part of the API in v5, specifically the way you render content. Previously, a .render() would exist on the Collection Entry. Calling that method would return a <Content/> element; the thing that was so hard to resolve outside of .astro files. --- import { getEntry } from 'astro:content'; const post = await getEntry('blog', params.slug); const { Content, headings } = await post.render(); --- <Content /> Now in v5, there’s a render function available as an import from astro:content. You’ll want to use that to get the <Content/>. --- import { getEntry, render } from 'astro:content'; const post = await getEntry('blog', params.slug); const { Content, headings } = await render(post); --- <Content /> So the new snippet should look something like this for v5. import { experimental_AstroContainer as AstroContainer } from "astro/container"; import { getContainerRenderer as getMDXRenderer } from "@astrojs/mdx"; import { loadRenderers } from "astro:container"; import { getCollection, render } from "astro:content"; import rss from "@astrojs/rss"; export async function GET(context) { const renderers = await loadRenderers([getMDXRenderer()]); const container = await AstroContainer.create({ renderers }); const posts = await getCollection('posts'); const items = []; for (const post of posts) { const { Content } = await render(post); const content = await container.renderToString(Content); const link = new URL(`/posts/${post.slug}`, context.url.origin).toString(); items.push({ ...post.data, link, content }); } return rss({ title: 'My blog', description: 'All my thoughts', site: context.site, items, }); } I haven’t tested this since my blog is still on v4.11, so your mileage may vary. Good luck!'''
year_published = 2025
clearnet = "https://blog.damato.design/posts/astro-rss-mdx"
tags = ['"astro:content";', ".astro", "approach", "astro", "astro’s", "async", "await", "blog',", "const", "container"]
language = "en"
internal-references = ["none"]
external-references = ["astro.build", "docs.astro.build", "github.com", "htmx.org", "npmjs.com"]

["https://blog.damato.design/posts/terminal-career"]
title = "UX Engineer, a terminal career"
description = "A role that is near and dear to my heart and why I can't call myself one."
full_description = "In my teens, I was involved in many extra-curricular activities in high school. I was president of the art club for all 4 years and lead for the school’s robotics team. While I wasn’t officially part of the class counsel, due to my volunteer work especially with the homecoming floats, I was given a new title by my peers over 20 years ago; Design Engineer. I didn’t think much of it then but after being fully immersed in both design and engineering, I resonate with that title. Not only do I consider how an experience could be constructed; I actually construct it. That’s something that’s always been important to me. Just having the idea wasn’t good enough, I needed to show people the concept and it wouldn’t be complete unless it was the real deal. Getting paid It’s one thing to find your passion, it’s another thing for that passion to put bread on the table. My passion didn’t start doing that until after graduating college. My first engineering job was officially as the sole frontend engineer for a finacial tech company but they also didn’t have a designer. My co-workers saw how quickly I could prototype a design in CodePen and made it easy to collaborate, so they gave me the responsibility for the design of the platform too. That’s where I took on both roles but also had both titles; Product Designer & Frontend Engineer. After that role, I was hired at a real estate startup as a Frontend Engineer. The codebase was massive, they were using a framework I’ve never seen, and my onboarding buddy was assigned to a totally different team working on the launch of what would become the most successful product on the platform. It was a sea of anxiety and I had a metric ton of imposter syndrome. However, as timing would have it, they also hired a new Director of UX and we were in many of the same onboarding groups. I raised the idea of joining their team to help with prototyping and better integration of design into code and after some formalities, that’s how I became their first UX Engineer. I felt really relieved. Design was straightforward for me and I could ease my way into the codebase with small changes instead of feeling responsibility for the entire repository of code at once. Like many places, onboarding is not often crafted well because it’s done once and the business has other higher priorities. More on that later. Rainbows & roses Most of my first responsibilities were to prototype experiences to hand off for research studies. I quickly found that I was reusing the same assets over and over so I started making my own little library of components in CodePen. I could import files across pens by appending the file type to the end of the url. While there was an existing component library; these designs were often new and experimental. I needed my own collection of components that I could iterate on in isolation for these prototypes. Eventually, I became more comfortable with the codebase and found areas of improvement; especially when it came to CSS. I found out then that most engineers have difficulty with CSS. For me, CSS came naturally and I was able to do things that didn’t seem possible for others. As one example, there was an ask from design to pin the footer to the bottom of our listing results. The listing results component was using a collection of CSS overrides on AG Grid, and the architecture of those overrides were outlined in a multi-page document. It was a big deal to even look at the project, let alone change it. The lead engineer for the frontend team told management a change like this would take 6 weeks. I made the changes over 6 days. Eventually, I was responsible for all CSS found on the platform. While I wasn’t looking at every PR, I was always called into the room for large projects or complex experiences. The listing details page was one of my last large influences; which was one of the first places where I was able to use display: grid; and position: sticky; on a production site. I became responsible for the component library, as it eventually matured into a design system. By the end of my time, I was putting together the Design System team and looking into how we could support all the various frameworks being used with a singular source of truth. Managing expectations While I loved all the work I was involved in, there was one thing that made me leave; lack of recognition. Many people were promoted during my tenure; I’ve seen some people promoted 3 times during my 2+ years there. I was promoted only once and it was title change with a cost of living pay increase. A few months later we’d have a new CTO and start new tech hubs around the world. What happened? Why was I left in the cold when everyone else was shining? When I first became a UX Engineer, I was reporting under the design organization. The trouble here was that our Director of UX didn’t have experience managing an engineer before. While this autonomy felt good to me, there was no career ladder. It wasn’t clear what steps I needed to take to be promoted. After the director left, I was reporting to the principle designer who really didn’t want to manage people. It was around this time the most senior frontend engineers were convincing me to come back into the engineering organization; right on the heels of the AG Grid work mentioned earlier. With some help from a new engineering manager willing to take me on, I moved back into the engineering organization. That manager was a huge help for my career because he understood my skills and influence and was able to be my voice in rooms I couldn’t be in. He was the person who fought for my promotion, just before he was pushed out by management. I was reporting under a new manager then; someone who previously identified as a backend engineer. It felt like I was reporting under the design team again. For our mandatory 1:1, he’d ask how I was doing and I’d just telling what I was working on. He really couldn’t give me much feedback because he didn’t know my world. It wasn’t really his fault; we were just paired poorly. When the new CTO came, we had a large restructuring which included new VPs of Engineering and other managers. After stating a case that I was a leader in the engineering organization, instead of receiving a promotion, I was restructured to report under one of the new VPs of Engineering. He really didn’t have any time for me; trying to get up to speed on larger problems that were happening with hyper growth. After having 6 managers and the company removing the only one that really helped me; I decided if I was going to grow, it couldn’t be here. Picking a side After I left, I joined the company I currently work for. Here, the management understands my value and every person I’ve reported to can hold in-depth conversations about my areas of interest and provides meaningful feedback. It’s really what I’ve been looking for all along. There’s only one problem: My role is Software Engineer. What’s the difference? As a Software Engineer, you’re expected to just live in the code. You rarely get a glimpse into the experience design side of feature development and instead need to be responsible for lots of different engineered systems; databasing, CI/CD, bundling configurations, along with feature development. All the problems you solve have to do with getting the computer to do what you want with commands. As a UX Engineer, you are responsible for the user experience. The problems you are solving are user needs and (in my opinion) much more interesting and impactful. I don’t associate with being a Software Engineer. I associate with being a UX Engineer. However, because UX Engineering doesn’t have the career support that Software Engineering does; I need to masquerade as something I’m not just to succeed in a field and have a possibility of promotion. This isn’t only where I work. The industry has a clear problem supporting UX Engineering. Often a company has a UX Engineering role but reports under either design or engineering. This will often lead to the problems I’ve personally experienced shown above; lack of understanding about the role for existing management. On the other hand, folks picking a side can struggle because they don’t have all the knowledge or experience as other folks with roles aligned to the larger organization. In other words, a designer probably knows all the hidden gems in Figma; while a UX Engineer might only know some intermediate techniques. Without clear responsibilities; the UX Engineer will look subpar to the Designer. In my case, I’m not able to effortlessly debug workflow problems for CI/CD and unfortunately that sounds like something a Software Engineer should do. This is all assuming you were hired. The interview process can be especially disappointing for a UX Engineer. We’re often met with teams of Full Stack engineers who gang up on us to determine how much we don’t know about the stack. What good does knowing how to use Auto Layout in Figma do if you can’t even query a database? Outlook As an industry we should provide more support in UX Engineering. Even if there aren’t defined management positions leading UX Engineering in an organization; existing leadership should recognize this role and help define a path with folks that have these specialized skills; highlighting their abilities. These are the folks who translate design into code without looking at the inspect panel. If you don’t see the benefit of that; I’m afraid you really don’t know how the web works. For my fellow UX Engineers out there, my heart goes out to you. I hope you’re being recognized for the work you’re doing; either by compensation, role, or fulfilling work. I wish I knew how to take the mask off. If you find out, please let me know."
year_published = 2025
clearnet = "https://blog.damato.design/posts/terminal-career"
