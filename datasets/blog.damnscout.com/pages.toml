full_description = "3, good, white noise sitesMay 3, 2010 by JasonMLMore and more often, I'm finding 'white noise' sites online. The idea is simple. Each site provides you with background noise, or white noise, that will play in the background. For many people, white noise is comforting background music for both better sleep or concentration during the workday. Because I love this type of service, I decided to share the list of white noise sites I use. I find that these are the easiest to use, as well as providing the best features. I can get to these sites and get white noise quickly and easily.SimplyNoise.comSimplyNoise is the first one on the list. It was also the first one I really became aware of. It offers a number of simple options, allowing you to change the type of noise, as well as the volume. It is, as the name suggest, simply noise.RainyMood.com The next site is interesting. As the name suggests, RainyMood is all about rain. I know I always enjoy the nice calming effect of rain water and the subtle sounds of hearing it fall, and this site does it well. No options, but a long 30-minute loop. And the interface is easy; a big button for either pausing or playing.White Noise 24/7This site allows you to download most of their sounds. And they have a large number of them. Dishwashers, showers, flowing rivers, ocean waves, and hard rain just to name a few. The site says it has over 21 hours of white noise. That's a lot of sound.JasonML"
