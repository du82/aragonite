title = "How to read more - damnscout"
description = "Last year I read 37 books. I don't pretend that this is a high number. I know that there are people that read far more books than that. However, I also know that 37 books is far greater than the majority of other people. Still,…"
full_description = "How to read moreJanuary 6, 2014 by JasonMLLast year I read 37 books. I don't pretend that this is a high number. I know that there are people that read far more books than that. However, I also know that 37 books is far greater than the majority of other people. Still, it's important to note that I don't read all these books sitting down turning pages. Rather, I read the majority of them as audio books from Audible. You might consider that cheating, but I don't.I listen to them in my car on my way to and from work. With an hour commute, I get a lot of listening time in. I also take the books with me to lunch. It gives me time to get out of the office and to take a breather. I get to catch up on a good story. It's a great break in the middle of the day.I'll go for walks, and listen to a bit then, or when I'm washing dishes, or doing chores. When others might listen to music, I'll put on my ear buds and listen to my book.I don't read all my books that way. I still love real physical books, and I also enjoy e-books on occasion as well. But if one of your resolutions this year is to read more, I highly recommend audio books.JasonML"
