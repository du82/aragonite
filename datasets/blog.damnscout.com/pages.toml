full_description = "PTI - PHP Tools Integration for EclipseMarch 16, 2011 by JasonMLI use Eclipse for my PHP coding. One thing I love about Eclipse is the numerous plugins available. The down side is you have to know about the plugins. One plugin I find a must have on any Eclipse installation is PTI - PHP Tool Integration. You can find it on the Eclipse Marketplace in the Help Menu. It has several components. It allows you to run unit tests through PHPUnit from the editor with a click of the button. It can do a CodeSniffer check and display the results in your editor so you can quickly and easily fix the problems. It also include PHP Depend and PHP Copy/Paste Detector. The system comes with all the stuff needed to run out the gate, but you can use your own versions of the various tools.JasonML"
