full_description = "Lessons from id Software co-founder John RomeroFrom John Romero's GDC '16 talk. No prototypes. Just make the game. Polish as you go. Don’t depend on polish happening later. Always maintain constantly shippable code. It’s incredibly important that your game can always be run by your team. Bulletproof your engine by providing… Ninety percent of everything is crapI repeat Sturgeon's Revelation, which was wrung out of me after twenty years of wearying defense of science fiction against attacks of people who used the worst examples of the field for ammunition, and whose conclusion was that ninety percent of SF is crud. Using… LessonsSo much to say. I think the core lessons are: be patient, don't give up, and always be learning. You can turn even the most crappy situation into valuable lessons. Teach them to others. Be happy with what you have yet always strive to improve…"
