full_description = "Devember 2016 - Day 1December 1, 2016 by JasonMLDay one is complete. I'm working on something completely different, but it's started.I want to build a system where APIs can be built using Node.js in a way that allows you to piece together different methods. I realize there are systems out there like this, but I couldn't find anything that meets my goals. Besides, I wanted to build it. Today was a longer day. More than an hour, mostly because I didn't want to leave it in a half state. I can continue tomorrow where I left off with a working system and clear next steps.I live streamed the entire session using Twitch. There was one point where I was dealing with an error that I could not figure out. Here is the moment I discover the very simple error. At some level, it's fairly embarrassing to have that live on video. But things like that do happen.Most of this is being designed as I go along. I'm not so concerned about performance at the moment. Mostly it's about getting it working.devemberJasonML"
