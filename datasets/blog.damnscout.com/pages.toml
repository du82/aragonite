title = "PowerShell for Bash Users - damnscout"
description = "Working with Objects PowerShell works with objects rather than plain text. While this might seem odd, it's also pretty powerful. So, if you run the ls command, it will return a bunch of objects that have fields (Members). You can figure out what this is easily…"
full_description = '''PowerShell for Bash UsersMarch 26, 2017 by JasonMLWorking with ObjectsPowerShell works with objects rather than plain text. While this might seem odd, it's also pretty powerful. So, if you run the ls command, it will return a bunch of objects that have fields (Members). You can figure out what this is easily by running ls | get-member.PS C:\Users\jason_000> ls | get-member...Name Property string Name {get;}Parent Property System.IO.DirectoryInfo Parent {get;}Root Property System.IO.DirectoryInfo Root {get;}BaseName ScriptProperty System.Object BaseName {get=$this.Name;}...So, I've cut out a lot of information, because you get a lot of members you can work with, but you get the idea. But what this means is if you just want all the names, you can run (ls).name. That will return a list of just the name members of the objects that would get returned normally.HistoryGet-History is history.Last Command$$windowsJasonML'''
year_published = 2017
