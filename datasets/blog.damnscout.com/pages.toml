["https://blog.damnscout.com/simple-or-why-companies-reinvent-solutions.html"]
title = "Simple, or why companies reinvent solutions - damnscout"
description = "A designer knows that he has achieved perfection not when there is nothing left to add, but when there is nothing left to take away - Antoine de St-Expurey HipChat At work, we are currently experimenting with HipChat. HipChat, if you aren't aware, is chat…"
full_description = '''Simple, or why companies reinvent solutionsMarch 18, 2012 by JasonMLA designer knows that he has achieved perfection not when there is nothing left to add, but when there is nothing left to take away - Antoine de St-ExpureyHipChatAt work, we are currently experimenting with HipChat. HipChat, if you aren't aware, is chat client like IRC. In fact, the similarities are great. You log in, you join a chat room, you can talk to people, it keeps a history. Even there client reminds you of an IRC client. So the question becomes, in a world with IRC freely available and at your disposal, with MSN and ICQ and various other chat applications available, how could HipChat hope to make an entrance.Through simplicity.How does HipChat work? Well, you log into your account, and then you can start chatting away in whatever room you want. Its contrary to the way IRC works. With IRC, you have to decide on a server. Actually, before that, you have to figure out which IRC client you want. And, of course, you have to learn to use the application. You probably still have to set up an account on the IRC server (unless you don't mind not "owning" your name). Doing this means learning how nickserv works on that network. Then you have to learn how to join a chatroom... well, it's annoying.How does your car work?Specifically? How do all the computers in your car play a part? Do you know? Does it affect your ability to drive?HipChat works by hiding the complexity. Driving works because it hides the complexity of the engine and everything that makes it work. Computers do this as well. Considering all someone has to do to get a computer and OS up and running is turning the power on, it's fairly simple from a user perspective.So, HipChat is successful because it has removed everything unnecessary from the process of group chat. It doesn't even require a local client. You can log in to a website like you do everywhere else and start chatting. No download required.One ButtonOddly enough, this is something Microsoft discovered and pioneered before Apple's iPhone. Once you started your computer up, there was a button: Start. This made further use of the computer simple. It was the single starting point, and it even said "Start" so you had a good understanding that whenever you wanted to do something with Windows, you'd Start there. This of course led to the joke that if you wanted to shut down, you'd want to Start the shutdown process with the Start button.Regardless, both the Start button and the iPhone/iPad/iPod's single home button have become popular. The idea here is removing all unnecessary buttons from the device or system. The less you have to do, the easier the action becomes.Less is more, as they say.Apple took this further with their Magic Mouse. I'll admit, I love the little thing. The combination of a mouse and a touch interface makes it a pleasure to use. The Magic Touch Pad is also another nice addition. In this case, there really is no button on the device (that the actual device is an entire button is beside the point). It's just flat.KeyboardsKeyboards are, in some respects, the anti-thesis. It has many different buttons, and modifiers that do different things. Luckily, for the most part, the buttons follow simple rules. The layout is in such a way that makes touch typing incredibly easy. That touch typing is a skill that's been around since before computers makes it an easy mechanism to use. After all, why not build on top of what people already know. We do this with most calendar applications, which are laid out in a way that is familiar to most everyone.So, even with all those buttons, a keyboard is still fairly simple because it's not necessarily attached to the keyboard. It helps that the letters are printed on the keys in a standard order. So, because of these simple rules and the fact that their is a history attached to the use of the keyboard, it's an exception to the rule. Somewhat.Virtual keyboards, while following the same layout in most cases, generally don't share some of the common properties with physical keyboards. After all, one of the principles of touch typing is actually touching the keys, returning to the home row, and this is facilitated by the little bumps on the 'F' and 'J' key. With these, we can easily return to our starting position (And, if you'll note, on a numerical key pad, you have the same bump on the 5 key). Virtual keyboards don't actually have this (despite the "bumps" appearing drawn on.I'm actually surprised by the number of people that don't realize what these little bumps are for.Regardless, people like Swype are looking at ways to improve the virtual keyboard experience. In Swypes case, while the virtual buttons remain, the actual number of presses are reduced. You just move the pointer, or your finger, over the keyboard. This ceases to be a keyboard, and more a drawing tool.What does this all mean?I don't think it's surprising that simple works best. Simple doesn't just mean one button (HipChat isn't just one button, and keyboards have many), efficiently usable by everyone (keyboards work best when touch typing, but other people can get by pecking along with their fingers), or copying what already exists (after all, the single button approach for the iPhone was completely different from any other phone at the time).Simple is an odd combination of all these things. More importantly, it's about understanding what actually makes things difficult. Having a common rule for keyboards make them easy to use. The iPhone copied this style. All those little apps do something, and they all work the same way. HipChat works just like any other site. It's akin to email, and one of the first things people learn to use is email. The difficulty in using a smartphone wasn't the nature of a mobile computing device. It was simply that applications suddenly had different rules, keyboards had to be modified to account for the size, and they tried to carry over the windows motif from the desktop to the mobile device. Function keys, modifiers, special keys for different things.And this leads us to the point: removing that difficulty is something people will pay for. Keyboards haven't changed much because the difficult is displayed by the keyboard literally spelling out what each button does. The challenge now is how to solve the problem of typing on a smaller device. For the vast majority of users, this isn't an issue. They don't touch type anyways. However, this doesn't mean it's the most efficient way for them. Swype has one solution. Apple has another solution: Siri.HipChat tackled the chat arena. It was a market that wasn't exciting from my perspective, and felt saturated. After all, when you thought about chat, you thought about IRC, and the various clients out there competing for users. HipChat came in and made a business out of it.This is important. When we look for future solutions, one thing we often ignore are the current solutions we use. Is it really as easy as it can be. Could we improve on it? What are the painful parts?It's not easy to do this. Google, in some ways, has tried this in the past with things like Buzz and Wave. Twitter is an example of this same thing: a problem existing, and while solutions existing, they weren't simplified. Facebook is the same thing (in some regards).This all goes back to the Unix mantra: do one thing and do it well.When I want to run a chat room, I want to run a chat room. I don't want to setup a server, or manually set up users. I don't want to manage nickserv, or anything else. I simply want to do something, not manage or setup. Lots of companies understand this. Amazon's cloud hosting services, Netflix and their video streaming, and even Amazon with it's 1 Click purchasing.So, don't be scared to solve something that's already been solved. Countless companies have built empires on top of "simply" removing things from existing solutions.JasonML'''
year_published = 2012
year_updated = 2012
