["https://blog.danieljanus.pl/2020/02/10/cond-indentation"]
title = "Indenting cond forms"
full_description = "Indentation matters when reading Clojure code. It is the primary visual cue that helps the reader discern the code structure. Most Clojure code seen in the wild conforms to either the community style guide or the proposed simplified rules; the existing editors make it easy to reformat code to match them. I find both these rulesets to be helpful when reading code. But there’s one corner-case that’s been irking me: cond forms. cond takes an even number of arguments: alternating test-expression pairs. They are commonly put next to each other, two forms per line. But things get out of hand when either tests or exprs get longer and call for multiple lines themselves. There are several options here, all of them less than ideal. In other words, keep the above rule. Because we’ll have multiple lines in a form, this tends to make the resulting code axe-shaped: This yields code that is indented abnormally far to the right, forcing the reader’s eyeballs to move in two dimensions – even more so if the tabular feel is desired. If both the test and the expression is multi-lined, it just looks plain weird. But with the added blank lines, logical structure of the code is much more apparent. However, it breaks another assumption that I make when reading the code: functions contain no blank lines. The Style Guide even mentions it, saying that cond forms are an acceptable exception. It is now harder to tell at a glance where the enclosing function starts or ends. And once this assumption is broken once, the brain expects it to be broken again, causing reading disruption across the entire file. I resorted to this several times. The lines are not too long; the visual cues are there; it’s obvious what is the condition, what is the test, and what goes with what. Except… it’s against the rules. List items stacked vertically should be aligned one under the other. I have to actively fight my Emacs to enforce this formatting, and it will be lost next time I press C-M-q on this form. No good."
year_published = 2020
clearnet = "https://blog.danieljanus.pl/2020/02/10/cond-indentation"
