["https://blog.danieljanus.pl/2022/09/24/paying-for-books"]
title = "How to pay for books"
full_description = "This post was originally published in Polish. This translation has been slightly edited to explain some details that are likely to be obscure for people outside Poland. Sometimes I wonder what I would change if I had the power to shape the world any way I could, and always I come to the same conclusion: I don’t know. I see many issues with the status quo, but all the solutions that I can come up with have their own problems. And so it rolls. But certain ideas seem sensible to me. For instance, I have a pretty clear vision of how paying for books (including ebooks) works in my perfect world. Before I explain it, though, let me say a few words about what I dislike about the current reality. Let us establish right at the beginning that the need to incentivise the authors, as well as other people whose work is needed to create books, is obvious. All the deficiencies of capitalism notwithstanding, as a society we suffer from a kind of doublethink. On the one hand, we praise libraries as temples of culture and knowledge. Their social and culture-making role is hard to overstate. On the other hand, we rightfully cringe when someone illegally downloads an ebook from the Net: it violates a social agreement. Meanwhile, from an author’s point of view, in both situations their profit is usually lower than if the reader had bought the book. In particular, it can be zero in both cases unless the country implements some form of Public Lending Right. Digressing for a while: in 2012, Kazik Staszewski called people who downloaded the then-new Kult album “paltry b*****es”. In response, a mock page popped up, called “Kazik’s Loss”1. The premise was simple: make a copy of Kazik’s album to incur a loss of profit, then increment the Grand Total on the page. Actually, you can use any other album. Or, indeed, make many copies. Use your local disk to make it faster. Delete old copies if you run out of space. Go wild! Oh, and you’d better not share them online, lest men in black knock on your door."
year_published = 2022
