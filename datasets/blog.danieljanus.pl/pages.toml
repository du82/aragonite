["https://blog.danieljanus.pl/2022/11/07/dcd-22"]
title = "Dutch Clojure Days 2022"
full_description = "It’s a tradition of this blog that I write down impressions on my way back from Amsterdam conferences (addendum a week later: unfortunately I took a flight this time, too short to complete this entry, and it had to wait until I caught up). This time, it was Dutch Clojure Days 2022, my first post-COVID full-size conference and the first DCD I’ve ever been to. And, hopefully, not last. I know I want to come back. This is in no small part thanks to Carlo Sciolla and the whole organising team of DCD. Y’all absolutely rock! I’d like to extend my (bit-shift-left 1 20) thank yous. I also loved the friendly, informal, meetup-y, no-ceremony vibe of the event. I felt right at home. The venue resonated with that vibe as well. Cloud Pirates’ space might not be the largest or the fanciest conference room ever, but it felt welcoming: one step from the street and you’re there. I’ve been keeping an eye on Nikita’s HumbleUI ever since it was publicly announced, and this talk makes me eager to try it out even more. I do have a use-case in mind (Spleen, my Scrabble engine that predates Leiningen by a few days); I’ve been using cljfx to experiment with an UI so far, but I guess I’ll try HumbleUI as well and see how it fares. HumbleUI may be in pre-alpha, but it’s already practical: Nikita used it to write a presentation engine for his talk! Did you know that Paula is the person we owe a cross-platform clojure.math to? I had no idea! And I greatly enjoyed this highly technical, low-level talk. I learned more that I probably wanted to know about IEEE-754 and the technicalities of floating-point number crunching in JavaScript. And because of Paula’s hard work, dedication, attention to detail, and working closely with the core CLJS team, the whole community gets to benefit! This is open source at its finest. I’m left with an immense sense of gratitude. I recall Carin Meier’s keynote from EuroClojure 2016, where she introduces (following David Mumford) four tribes of programmers: explorers, alchemists, wrestlers, and detectives. I think both Paula and I share the trait of being detectives: people who find enjoyment in diving into deep, detailed aspects of programming."
