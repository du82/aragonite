["https://blog.danieljanus.pl/2025/02/21/double-double-toil-and-trouble"]
title = "Double, double toil and trouble"
full_description = "But why? Why would comparing two perfectly cromulent numbers throw an ArithmeticException?! Everybody knows that ⅓ < 0.5 – we aren’t dividing by zero or anything like that, are we? Well, the problem is that we’re comparing a ratio to a BigDecimal (a decimal number of arbitrary precision). Java doesn’t offer a built-in way of comparing these (Clojure’s ratios aren’t part of the Java standard library), so it has to coerce one into the other. It chooses to coerce the ratio into a BigDecimal, so divides (bigdec 1) by (bigdec 3)… …and that throws! The decimal representation of ⅓ is infinite, so you can’t keep all the digits in finite memory. You may ask: how exactly does Clojure know what coercions to apply and how to produce the result? Let’s look at the code. The implementation of clojure.core/< calls the Java method clojure.lang.Numbers.lt, which is implemented like this: What’s ops? It’s an implementation of the Ops interface, which has methods for addition, subtraction, etc.; each number class has its own implementation: there is a LongOps, RatioOps, BigDecimalOps etc. The combine method can alter the behaviour of an Ops depending on the type of the other argument – for example, RatioOps switches to BigDecimalOps if the other argument is a BigDecimal. It’s like a poor man’s implementation of multiple dispatch, which Java doesn’t have. BigDecimalOps.lt calls toBigDecimal on both arguments, and it’s that method that performs the failing division: Incidentally, this used to produce the expected result in Clojure up to 1.2.1. At that version, Clojure already used the Ops-based multiple dispatch, but combining RatioOps with BigDecimalOps would yield the former, not the latter. Is the current behaviour a bug? I’m not sure. It seems so, but maybe 1.3.0’s optimizations warrant this behaviour in the admitedly rare case. There’s an ongoing discussion on the Ask Clojure Q&A. So, in current Clojure, how do you compare ratios to bigdecs? Simple, you think: just coerce the bigdec to a double!"
year_published = 2025
clearnet = "https://blog.danieljanus.pl/2025/02/21/double-double-toil-and-trouble"
