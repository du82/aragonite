["http://blog.danielna.com/talks/pushing-through-friction"]
title = "Pushing Through Friction | blog.danielna.com"
description = "Dan Na's personal blog. Lessons from the technical leadership track."
full_description = "Pushing through Friction Abstract Things are broken. The deployment pipeline is painfully slow. Your engineering team has doubled in the last year and there’s a lack of sufficient process and management. You git blame a file that’s used everywhere but nobody understands it; the person who wrote it left the company five years ago. As a senior-level engineering leader, experience tells you things could be better. You see the gaps. If only the company adopted policy A or dumped technology B, everyone would benefit. But there’s so much inertia. The company has always used B. You are frustrated. Can you actually make a difference? Yes. You are encountering organizational friction, and learning to identify, accept and push through friction is a key skill of engineering leaders. In this talk, Dan will talk about why organizational friction occurs and how to mitigate it. The ability to push through friction will distinguish you throughout your career. Video The talk was recorded at SREcon19 EMEA in Dublin, Ireland in October 2019. Slides Resources squarespace.com @dxna: Pushing Through Friction tweet thread NTSB Report on Bedford MA Gulfstream Jet crash Aircraft Owners and Pilots Association (AOPA): THE NORMALIZATION OF DEVIANCE Dan Luu's blog post: Normalization of Deviance The normalization of deviance in healthcare delivery by John Banja Being Glue by Tanya Reilly NYTimes: What Google Learned From Its Quest to Build the Perfect Team Drive | Daniel H. Pink Want to work with me? Squarespace is hiring!"
