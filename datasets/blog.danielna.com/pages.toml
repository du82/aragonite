full_description = '''The Inspiring Leader vs The Player Coach Scott Galloway's take on the two types of effective leaders. Jun 16, 2023 The Piano Scales of Engineering Management What is deliberate practice for engineering leaders? Jun 07, 2023 Urgency is a privilege for well-run teams 📌 You can only ship fast if you ship in the first place. May 31, 2023 Raising the Floor Eating the same breakfast and lunch everyday dramatically improved my workdays. Jan 17, 2023 Engineering Manager Forum (engineering.squarespace.com) A post on the Squarespace Engineering Blog about the why and how of Engineering Manager Forum. Dec 15, 2021 Should you build it fast or build it correctly? 📌 Building products versus building platforms. Jan 14, 2021 Choosing the Management Track 📌 How the IC and EM tracks are different, and why I switched back. Oct 12, 2020 Understanding Project Management Will Improve Your Developer Job 📌 Shipping is about intention, not luck. Aug 20, 2018 Building a System for Front-end Translations (engineering.squarespace.com) A post on the Squarespace Engineering Blog about the architecture of our front-end translation system. Aug 15, 2018 Creating an Accessibility Engineering Practice 📌 Accessibility is not a feature, it's a requirement. Sep 14, 2017 Transitioning to SCSS at Scale (Code as Craft) 📌 A post on the Etsy engineering blog about moving 2000+ files of CSS to SCSS, which culminated in me pushing a 1.2M line commit to Github. Feb 02, 2015 Getting a Job as a Front-End Web Developer A post to centralize the advice I keep telling various people. Jun 26, 2013 Cracker Barrel and Hacker School Lessons from a small wooden labyrinth of pain and suffering. May 19, 2013 Going Responsive - Media Queries (CSS) vs. JavaScript Now accommodating desktop, 7" tablet, and mobile browsers. Jan 07, 2013 Upgrading a Macbook Pro SSD with SuperDuper! The single biggest performance upgrade to any laptop. Dec 09, 2012'''
