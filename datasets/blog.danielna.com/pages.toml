["https://blog.danielna.com/talks/growing-teams-and-culture-with-actionable-feedback"]
title = "Growing Teams and Culture with Actionable Feedback | blog.danielna.com"
description = "Dan Na's personal blog. Lessons from the technical leadership track."
full_description = "Growing Teams and Culture with Actionable Feedback Overview Providing feedback is such a fundamental concept within management that it’s surprisingly easy to overlook it as a skill. But delivering feedback is indeed a skill, and it can be done well or done poorly. Luckily it’s something we can all improve in as long as we approach delivering feedback strategically. Using Lara Hogan’s Feedback Equation, I’ll discuss how managers can deliver both redirecting and reinforcing feedback that is specific, objective, and actionable. I’ll also discuss why the context in which you deliver feedback is critical for its reception, and reflect on why the opportunity to deliver feedback is a privilege rather than a burden. Video The talk was recorded as part of LeadDev Together 2020 - Module 1: Developing your team. To access the recording, you must create an account at LeadDev.com via the link above. Access is free! Slides Resources Office Space (1999) - IMDB Feedback Equation - Lara Hogan Deliver redirecting or reinforcing feedback about this talk @dxna Want to work with me? Squarespace is hiring!"
