["https://blog.danielna.com/upgrade-macbook-pro-with-superduper"]
title = "Upgrading a Macbook Pro SSD with SuperDuper! | blog.danielna.com"
description = "The single biggest performance upgrade to any laptop."
full_description = "Upgrading a Macbook Pro SSD with SuperDuper! The single biggest performance upgrade to any laptop. I figure this might help someone, if the google desires it so. When I first bought my current MBP in early 2012 (13” unibody) I bought it with base specs. The Apple upcharge on upgrading individual components being what it is, it was significantly cheaper to buy the MBP with a 320GB HD and 4GB RAM and upgrade everything myself. A 128GB SSD and 8GB RAM later (which is much cheaper now than it was then), my laptop was a freaking workhorse. The single biggest upgrade in performance was, by far, the SSD. I couldn’t convince myself to spring for the 256GB drive then, mostly because the price for the drive was around $450. Needless to say, prices have dropped. A lot. With 50GB of music taking a big chunk of my hard drive space, I was getting tired of having to move media off to external drives. I decided recently that it was time to upgrade. I took a long, hard look at the Optibay, which allows users to install a hard drive into their optical bays. In fact, I actually went so far as to order one, open up my laptop and attempt to install the thing. I became quickly annoyed that the published instructions did not have a schematic that closely matched the internals of my own computer, in addition to the required removal of a number of tiny screws that ran the risk of falling into the depths of my laptop forever. It was also unclear to me exactly how battery consumption would be affected by continually powering a second drive, which had the potential to derail my semi-frequent coffee shop sessions. Ultimately I sold the Optibay off to a friend who had better luck with the installation. Here’s what I did: Purchased a 256GB Crucial M4 SSD from Amazon; Downloaded SuperDuper!, a program for Mac that allows you to make an exact, bootable copy of your drive to an external disk; Used a 2.5” SATA to USB 2.0 HD Enclosure to connect the SSD to my MBP via USB; Opened Disk Utility (Applications ->Utilities -> Disk Utility) and erased the empty SSD and formatted it (Mac OS Journaled Extended); Copied the contents of my current HD to the SSD via SuperDuper!; Replaced the old SSD with the new SSD; Set the startup disk (Settings -> Startup Disk) to the installed 256GB drive. (If you install a new SSD and it takes unusually long to boot, the Startup Disk is likely not set.) Originally I was going to add another step to this process (SuperDuper to external HD, install empty SSD, boot from external HD, copy from external HD to empty SSD) but a friend suggested that I eliminate the external HD middle-man by using a USB enclosure. Great suggestion that hadn’t crossed my mind, and it ended up saving me a load of time. The key difference between a tool like SuperDuper! vs. Time Machine is that it allows you to create fully bootable backups of your hard disk, so if your machine ever goes kaput you can still boot (by holding Option during the boot up sequence and selecting the backup). At $28 for the “Smart Update” feature (only saving what’s changed between backups) it’s a great value. BTW, if the new drive seems to freeze a lot after you upgrade (beachball for 10s or so during load), try updating your OS. It seemed to beachball a lot until I upgraded to Mountain Lion. More posts Previous post « Teach Me How To Be President Next post Iterating »"
