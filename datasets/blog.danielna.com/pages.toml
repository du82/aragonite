title = "Iterating | blog.danielna.com"
description = "Dan Na's personal blog. Lessons from the technical leadership track."
full_description = "Iterating Imagine you’re tasked with building a computer controlled gun that can accurately hit a target about 50 meters distant. That is the only requirement. One way to do this is to build a complex machine that measures every possible variable (wind, elevation, temperature, etc.) before the shot and then takes aim and shoots. Another approach is to build a simple machine that fires rapidly and can detect where each shot hits. It then uses this information to adjust the aim of the next shot, quickly homing in on the target a little at a time. The difference between these two approaches is to realize that bullets are cheap. By the time the former group has perfected their wind detection instrument, you’ll have finished your simple weapon and already hit the target. Ten Lessons from Github's First Year More posts Previous post « Upgrading a Macbook Pro SSD with SuperDuper! Next post Moving to Jekyll »"
