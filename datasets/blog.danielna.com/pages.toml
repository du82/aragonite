["http://blog.danielna.com/talks"]
title = "Talks | blog.danielna.com"
description = "Dan Na's personal blog. Lessons from the technical leadership track."
full_description = '''Managing Managers Podcast Ep16 - Management as a True Calling Abstract In September 2023 Pat Kua interviewed me for the 16th episode of The Managing Managers Podcast. We covered a variety of topics in the 45 minute episode, ranging from my career path to date, the growth of International at Squarespace, what I mean when I refer to management as a career calling (and why I suck at guitar), how I evaluate my performance as an Engineering Director, what my day-to-day management responsibilities look like, why I think parental leave is one of the most human-centered and generous employee benefits, how I think about growing ICs that want to explore management, and advice for moving to managing managers from managing ICs. I wrote about my takeaways from recording this podcast: Management as a Career Calling. Delivered Episode 16: Management as a true calling and the three pillars of being a director with Dan Na. March 2024. Lead Time Chats S3E4: Pushing Through Friction Abstract I spoke with Jean Hsu, VP of Engineering at Range.co, about my Pushing Through Friction conference talk. We talked about the circumstances around how the talk was written, the Normalization of Deviance, why "is everyone an idiot?" is an unhealthy mindset to have, and the three bucket approach (Accept It, Change It, Move On) to triaging emotional investments. Delivered S3E4: Dan Na on Pushing through Friction (range.co/blog). November 2021. Growing Teams and Culture with Actionable Feedback Abstract Providing feedback is such a fundamental concept within management that it's surprisingly easy to overlook it as a skill. But delivering feedback is indeed a skill, and it can be done well or done poorly. Luckily it's something we can all improve in as long as we approach delivering feedback strategically. Using Lara Hogan's Feedback Equation, I'll discuss how managers can deliver both redirecting and reinforcing feedback that is specific, objective, and actionable. I'll also discuss why the context in which you deliver feedback is critical for its reception, and reflect on why the opportunity to deliver feedback is a privilege rather than a burden. Delivered LeadDev Together, Part 1: Developing your team. Online. September 2020.'''
