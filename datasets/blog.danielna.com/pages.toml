["https://blog.danielna.com/about"]
title = "About Dan | blog.danielna.com"
description = "Dan Na's personal blog. Lessons from the technical leadership track."
full_description = "About me This blog is entitled “In The Work.” You can only learn by doing, and you can only operate if you’re in the details. My aspiration for this space is that the lessons I share are directly a result of being in the details. Now I’m currently a Director of Engineering in the Engineering Platform organization at Squarespace, where I lead three sub-orgs: The Market Expansion organization, which helps drive Squarespace’s product expansion to new geographies and new market segments. This currently encompasses the International and Enterprise business lines. The Internal Platform organization, which helps enable the revenue and efficiency goals of the greater cross-functional Squarespace team by building tools and workflows for Marketing, Customer Operations, HR and IT. The User and Identity Platform organization, which focuses on authentication, authorization, and secure access of all Squarespace accounts. This encompasses the User and Identity Platform and Protection Platform engineering teams. I also manage a small, focused team of 2 Principal Engineers and 1 Staff Engineer focused on CMS architecture. Previously I helped found the International engineering effort as a Staff Engineer and Team Lead and led/grew the teams as a Senior Engineering Manager. The content of this blog does not reflect the opinion of my employer. Before Before Squarespace I was an Engineering Manager on the Product Infrastructure team at Etsy. Other roles I held during my tenure at Etsy included the Engineering Manager/founding engineer of the Accessibility Engineering team, and Senior Software Engineer on the Front-end Infrastructure, Mobile Web and Web Performance teams. Previous to Etsy I worked at an agency building coca-colacompany.com, and before that I worked at a government contractor building full-stack web applications. Else When I have lessons to share I enjoy speaking at conferences. In my free time I like to spend time with my family, explore diverse cuisines, cook, and play golf. I love but rarely never update my cooking blog: Food Don’t Lie. I’m a leukemia survivor and the creator of cheekswab.org. I use my story to engage with ethnic minority groups and coordinate bone marrow drives in New York City and nearby areas. Please visit Cheekswab or reach out to me directly to learn more about bone marrow donation and joining the BeTheMatch Bone Marrow Registry. It truly is the lottery to save a life. I’m probably listening to 90s hip hop. Contact Email: dan@domain LinkedIn @dxna @dxna@mastodon.social"
