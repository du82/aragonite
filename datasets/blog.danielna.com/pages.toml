full_description = "Lead Time Chats S3E4: Pushing Through Friction Overview In November 2021 I spoke with Jean Hsu, VP of Engineering at Range.co, about my Pushing Through Friction conference talk. We talked about the circumstances around how the talk was written, the Normalization of Deviance, why “is everyone an idiot?” is an unhealthy mindset to have, and the three bucket approach (Accept It, Change It, Move On) to triaging emotional investments. Jean has published takeaways and talk resources (audio, video, links) on the Range.co blog: S3 E4: Dan Na on Pushing through Friction I encourage you to look at all of Range.co’s Lead Time Chats: Lead Time Chats, which are also available as podcasts. Video"
