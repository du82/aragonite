full_description = "Viet Taste When the head cook of Viet Taste in Falls Church gets an order for a plate of Bun Cha Hanoi, he knows exactly what to do. He has cooked the pork dish — with vermicelli noodles, greens and pickled vegetables — countless times and knows exactly how much fish sauce and fresh herbs to add. Outside his kitchen, the customers, most of them Vietnamese, are expecting authentic Vietnamese cuisine. German Sierra, born in Honduras, makes sure they get it. … At Viet Taste in the Eden Center, he is behind the stove 12 hours a day, six days a week. He said he earns about $550 a week. At Vietnamese restaurants, Hispanic workers have become vital to survival | Washington Post If you’re wondering, $550/72 = $7.64/hr. The hidden social costs of a cheap lunch. More posts Next post Amusement Park Leadership »"
