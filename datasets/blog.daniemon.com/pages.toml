full_description = "Opera Update: “Requires installation of untrusted packages” daniemon Uncategorized December 20, 2010October 3, 2022 1 Minute On two separate installations of Ubuntu 10.10 I got the following message when trying to update Opera using Ubuntu’s Update Manager:“Requires installation of untrusted packages” Unfortunately, the only option available was to click the Close button with no help to fix the problem. Fortunately, there’s a solution, also on My Opera, that worked for me: my.opera.com/vinhphuc121583/blog/fix-error-requires-installation-of-untrusted-packages A couple of points to note: You should add the Opera GPG key, as explained here: help.ubuntu.com/community/OperaBrowser The finalsudo apt-get updatedoesn’t update Opera, but using the Update Manager again works with no error message. Thank you Bùi Vĩnh Phúc! UPDATE: Things seem to work again now so instead of following the instructions in the linked blog post, you should just be able to add the Opera GPG key (even if you’ve done it before) and update as explained above. Official information is here:my.opera.com/desktopteam/blog/2011/01/25/an-update-reminder-to-ubuntu-linux-mint-and-debian-users-or-anyone-else-on-a-d Share this:TwitterFacebookLike Loading... Related TaggedLinuxOperaUbuntu Published December 20, 2010October 3, 2022"
