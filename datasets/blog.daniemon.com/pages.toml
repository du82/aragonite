full_description = "Widgets on the Wii daniemon Uncategorized January 10, 2009July 26, 2018 1 Minute Just a quick note that may help widget developers. The problem:Your widget may work well on mobile and desktop and in the widget emulator, but the version of Opera used on the Wii is a very different beast and the emulator does not reflect its quirks. Not only that, you can’t download or transfer your widget directly to the Wii to see what needs fixing (or at least I couldn’t find a way). The solution:The version of Opera used on the Wii is 9.30 so to test compatibility, install Opera 9.27 on your PC and you should be OK to then fix and re-submit successfully. The Wii user agent as reported by BBClone. Share this:TwitterFacebookLike Loading... Related TaggedOperawidgetsWii Published January 10, 2009July 26, 2018"
