full_description = "Incandescent Bulbs and Lumens daniemon Uncategorized February 4, 2012October 3, 2022 1 Minute I’ve been buying LED bulbs but am surprised at their brightness, or rather lack of. Manufacturers often write the equivalent in watts of incandescent bulbs on the packet but it turns out they tend to, er, lie. Quite a lot. With the current boom in LED bulbs, a trustworthy comparison table is what’s needed. After a bit of searching, I found this helpful article published by the European Union:Energy-saving lightbulbs – how to read the packaging They confirm that measuring brightness in watts is now pretty much meaningless so instead, here are the lumen values you should look for when replacing your incandescent bulbs: INCANDESCENT BULBLUMENS25W220-25040W410-47060W700-81075W920-1060100W1300-1530 Photo by Teodoro S Gruhl Share this:TwitterFacebookLike Loading... Related Taggedenergyreference Published February 4, 2012October 3, 2022"
