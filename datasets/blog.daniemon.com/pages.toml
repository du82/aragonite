["https://blog.daniemon.com/2012/04/05/readability-for-android"]
title = "Readability for Android – Daniemon's Blog"
description = "So you want Readability bookmarklets on your Android device, huh? Not so fast! At the time of writing, it’s not possible to access the official Readability bookmarklets on Android but there is a workaround. Here’s how to do it in three easy steps. Step 1: Copy the Readability script In Opera Mobile or Mini (I don’t think this works…"
full_description = "Readability for Android daniemon Uncategorized April 5, 2012October 3, 2022 1 Minute So you want Readability bookmarklets on your Android device, huh? Not so fast! At the time of writing, it’s not possible to access the official Readability bookmarklets on Android but there is a workaround. Here’s how to do it in three easy steps. Step 1: Copy the Readability script In Opera Mobile or Mini (I don’t think this works in other browsers), select and copy the code below: javascript:((function()%7Bwindow.baseUrl%3D'http%3A//www.readability.com'%3Bwindow.readabilityToken%3D''%3Bvar%20s%3Ddocument.createElement('script')%3Bs.setAttribute('type'%2C'text/javascript')%3Bs.setAttribute('charset'%2C'UTF-8')%3Bs.setAttribute('src'%2CbaseUrl%2B'/bookmarklet/read.js')%3Bdocument.documentElement.appendChild(s)%3B%7D)()) Step 2: Create a bookmark Open the Bookmarks menu and click on the Add button (don’t click Save yet). Step 3: Edit the bookmark Change the title to Readability (or something similar). Delete the address and paste in the code copied from above. Click Save. Voila! You should now be able to go to any article or blog post, click the Readability bookmarklet and enjoy a better reading experience. Share this:TwitterFacebookLike Loading... Related TaggedAndroidhowtomobileOperatoolsweb Published April 5, 2012October 3, 2022"
year_published = 2012
year_updated = 2022
