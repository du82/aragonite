title = "On Vendor Prefixes — An Interview With Dr. Stanley Dards – Daniemon's Blog"
description = "At last, the existence of vendor prefixes, one of my pet peeves, is under the spotlight. Also at last, the fact that not all modern browsers are WebKit (shock!) is getting some attention. I (personally) believe vendor prefixes cause more harm than the problem they were designed to solve, namely how to elegantly introduce experimental…"
full_description = "On Vendor Prefixes — An Interview With Dr. Stanley Dards daniemon Uncategorized February 23, 2012October 3, 2022 1 Minute At last, the existence of vendor prefixes, one of my pet peeves, is under the spotlight. Also at last, the fact that not all modern browsers are WebKit (shock!) is getting some attention. I (personally) believe vendor prefixes cause more harm than the problem they were designed to solve, namely how to elegantly introduce experimental features in browsers. My belief is that a non-browser-specific prefix such as -beta- has fewer obstacles to overcome than other proposals. Having said that, there’s clearly no easy, one-size-fits-all answer but hopefully more awareness and public discussion will lead to a more plausible solution. So far, there have been great contributions to the discussion from all sides. A selection of ones I’ve found valuable, but may not necessarily agree with, are listed here: The minutes of the original CSS Working Group discussion are a long but enlightening read. PPK has his usual good ideas. Bruce Lawson (colleague at Opera) has his usual valuable commentary. Tantek Çelik (Mozilla) gives an interview with Eric Meyer. Nate Vaughn reminds us to keep calm. Stuart Langridge offers a practical solution. Daniel Glazman (Working Group co-chair) has a call for action. And as if that wasn’t enough, here are the insights of one Dr. Stanley Dards: Share this:TwitterFacebookLike Loading... Related TaggedCSS3interviewstandardswebweb developmentweb standards Published February 23, 2012October 3, 2022"
