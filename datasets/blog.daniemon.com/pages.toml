description = "I want to introduce my child to online social networks but how best to explain some of the risks involved? Thought I’d start with a song… This is a rewrite of the traditional folk song “Sloop John B”, famously covered by the Beach Boys (www.youtube.com/watch?v=nSAoEf1Ib58) although Cap’n Tom Jones deserves a mention for his singing…"
full_description = "Song: Social Network B ♪ daniemon Music, Privacy September 11, 2012October 7, 2022 1 Minute I want to introduce my child to online social networks but how best to explain some of the risks involved? Thought I’d start with a song… This is a rewrite of the traditional folk song “Sloop John B”, famously covered by the Beach Boys (www.youtube.com/watch?v=nSAoEf1Ib58) although Cap’n Tom Jones deserves a mention for his singing attire: www.youtube.com/watch?v=fyQeHavCfPg Video URL (with captions): Social Network B song Downloads For your downloading pleasure, here are the video and audio–only files. Video (WebM): social-network-b.webm (13.5 MB) Audio (Ogg): social-network-b.ogg (2.5 MB) License is Creative Commons Attribution-Noncommercial-Share Alike 3.0 Unported. If you need a media player, I recommend VLC. Lyrics We joined a social network.Me and my best friend, Bert.Around that walled gardenwe did roam.Surfing all night.Got into a fight.I had so much fun,I don’t wanna go home. I got a message from Jen,my girlfriend from way back when,but now she just won’tleave me alone.What did I say?Why does she haunt me this way?She’s nice ‘n’ all butI wish she’d go home. Then there’s that guy named Ray.He took me to a crazy partayand he took lots of photoswith his cell phone.Now everyone’s seenme doing that… thing.I’m tired of getting laughed at.I wanna go home. Then there’s those men in black.They won’t get off my back,ever since they gave methat emergency loan.How do they knowevery place that I go?I’m getting kinda scared now.I gotta go home. But now my whole familyhas signed up, just like me.It’s the only wayI keep in touch with my mom.It’s part of our lives.How did we ever survive?Now we’re in the network,we’re not going home.Once you’re in the network,you can never go home. Share this:TwitterFacebookLike Loading... Related TaggedFacebookgeekuleleMusicPrivacysocial mediasongukulele Published September 11, 2012October 7, 2022"
