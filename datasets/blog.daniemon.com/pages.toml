full_description = "List of Javascript Charting Libraries daniemon Uncategorized February 1, 2012October 3, 2022 2 Minutes I’m looking to make some pretty JavaScript charts and was wondering which library to use. I’ve used Flotr in an Opera extension and played around with gRaphaël in the past, but I want to do a more thorough comparison. First step is to list all the charting libraries I can find, so here it is… Open source Minimal or no dependencies Bluff – bluff.jcoglan.com Canvas 3D Graph – dragan.yourtree.org/code/canvas-3d-graph/ CanvasXpress – canvasxpress.org ccchart – jsgt.org/c/ Chart.js – chartjs.org Chartist – gionkunz.github.io/chartist-js D3 – mbostock.github.com/d3/ dhtmlxChart (also commercial license) – www.dhtmlx.com/docs/products/dhtmlxChart/index.shtml dygraphs – dygraphs.com Flotr2 – www.humblesoftware.com/flotr2/ gRaphaël – g.raphaeljs.com Ico – alexyoung.github.com/ico/ InfoVis – thejit.org JSXGraph – jsxgraph.uni-bayreuth.de/wp/ lib_gg_orgchart – librerias.logicas.org/lib_gg_orgchart/ Processing.js – processingjs.org/ ProtoChart (no longer maintained) – code.google.com/p/protochart/ Protovis (superseded by D3) – mbostock.github.com/protovis/ Smoothie Charts – smoothiecharts.org/ Require general-purpose library (e.g. jQuery) Elycharts (jQuery) – elycharts.com/ Flot (jQuery) – code.google.com/p/flot/ Flotr (Prototype) – solutoire.com/flotr/ jqPlot (jQuery) – www.jqplot.com jQuery Sparkline (jQuery) – omnipotent.net/jquery.sparkline/ jQuery-Visualize (jQuery) – github.com/filamentgroup/jQuery-Visualize MilkChart (MooTools) – mootools.net/forge/p/milkchart moochart (MooTools) – moochart.coneri.se/ MooWheel (MooTools) – www.labs.unwieldy.net/moowheel/ PlotKit (MochiKit) – www.liquidx.net/plotkit/ table2chart (MooTools) – mootools.net/forge/p/table2chart TufteGraph (jQUery) – xaviershay.github.com/tufte-graph/ YUI Charts (YUI) – yuilibrary.com/yui/docs/charts/ Not open source amCharts – www.amcharts.com/javascript-charts/ Emprise JavaScript Charts – www.ejschart.com/ FusionCharts – www.fusioncharts.com/ Highcharts – www.highcharts.com/ HTML-Graphs – www.gerd-tentler.de/tools/graphs/ JavaScript Diagram Builder – www.lutanho.net/diagram/ JS Charts – www.jscharts.com/ mxGraph – www.jgraph.com/mxgraph.html RGraph – www.rgraph.net/ Sencha Touch Charts – www.sencha.com/products/touch/charts/ XYGraph – www.structura.info/XYGraph/XYGraphDemo.htm ZingChart – www.zingchart.com/ A few links for reference Some are a little out-of-date but they’re still useful. www.splashnology.com/article/15-awesome-free-javascript-charts/325/ stackoverflow.com/questions/3843168/web-charting-libraries-for-mobile-our-own-research www.rahulsingla.com/blog/2010/09/a-quick-comparison-of-web-based-charting-libraries-for-data-visualization dothtml5.com/archives/20120207_flotr2.html (Japanese – 日本語) Share this:TwitterFacebookLike Loading... Related TaggedchartingJavaScriptlibrarylistweb development Published February 1, 2012October 3, 2022"
