title = "Song: Web Conference Blues – Daniemon's Blog"
description = "You know that lonely feeling, where all the hip web designers and developers gather at the coolest conference and you’re stuck at your desk? Here’s a song for those of us that miss out on all the glamour. https://www.youtube.com/embed/u_gAPRJmEWs The original song, by the way, is Folsom Prison Blues by Johnny Cash. Video URL (with captions): www.youtube.com/watch?v=u_gAPRJmEWs…"
full_description = "Song: Web Conference Blues daniemon Music April 1, 2011October 7, 2022 1 Minute You know that lonely feeling, where all the hip web designers and developers gather at the coolest conference and you’re stuck at your desk? Here’s a song for those of us that miss out on all the glamour. The original song, by the way, is Folsom Prison Blues by Johnny Cash. Video URL (with captions): www.youtube.com/watch?v=u_gAPRJmEWs Downloads For your downloading pleasure, here are the video and audio–only files. Video (WebM): web-conference-blues.webm (9.5 MB) Audio (Ogg): web-conference-blues.ogg (1.3 MB) License is Creative Commons Attribution-Noncommercial-Share Alike 3.0 Unported. If you need a media player, I recommend VLC. Lyrics I see the tweets a-comin’They’re comin’ down the screen.They’ve all got the same hashtag and I,I know what that means.It means I’m stuck here at my deskand time keeps draggin’ on.And the web conference keeps rollin’all tickets sold except one. When I was just a babymy momma told me “Hey!”“Always do things early oryou’ll regret it some day.”Well I knew I should have bookedbut I left it too late.Yes, I missed the earlybird discount.Why did I procrastinate? I bet there’s web folks tweetin’in a fancy conference hall.They’re probably drinkin’ coffeeand talkin’ ’bout HTML.Well I knew I had it comin’.I know it’s not to be.But those tweets, they keep on comin’and that’s what tortures me. If my boss gave me approval,let me register online,I’d jump on to the next plane.I could still make it on time.But I’m stuck here at my desk.Here’s where I’m gonna stay.I’ll just go right back to Farmvilleand hoe my blues away. Share this:TwitterFacebookLike Loading... Related TaggedconferencegeekuleleMusicsongukulelewebweb development Published April 1, 2011October 7, 2022"
