--gc-sections -mthumb -mno-thumb-interwork -o build/gnuk.elf arm-none-eabi-objcopy -O binary build/gnuk.elf build/gnuk.bin Programming Then I connected my J-link programmer. VCC and GND was easy to probe and the rest two pins (SWD, SWCLK) were identified by trying. The order of pins is following (first is closest to USB): SWDIO GND SWCLK 3V3 For connecting using openocd I used a config which I had used before for F103. #daemon configuration telnet_port 4444 gdb_port 3333 #interface interface jlink transport select swd # The chip has 64KB sram set WORKAREASIZE 0x10000 source [find target/stm32f1x.cfg] #adapter_khz 100 gdb_breakpoint_override hard After starting openocd, I unlocked flash, and burned new firmware: $ openocd stm32f103.cfg #in new shell $ telnet localhost 4444> stm32f1x unlock 0 Device Security Bit Set stm32x unlocked. INFO: a reset or power cycle is required for the new settings to take effect. > reset halt target state: halted target halted due to debug-request, current mode: Thread xPSR: 0x"
