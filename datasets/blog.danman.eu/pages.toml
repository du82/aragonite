title = "Zidoo X8 recovery | danman's blog"
full_description = 'Projects Zidoo X8 recovery 4. March 2021 danman 13 Comments Short guide how to recover from completely wiped eMMC in case you have full eMMC backup and a bootlog from working device. Connect via UART Connect an USB-TTL adapter according to following photo: R – RxT – Tx+ – Vcc – do not connect– – GND Notice that the pin pitch is 2mm. I have used 2mm to 2.54mm DuPont wires. Prepare files 1. Find following lines in boot log: HwSetting:hwsetting_blk_no:00000100hwsetting_total_size:00000680hwsetting_blk_count:00000004 Bootcode:bootcode_blk_no:00000104bootcode_total_size:000B21E0bootcode_blk_count:00000591 rtk_preload_bootimages : load U-Boot 64 from 0x00028125 to 0x01500000 with size 0x00100000copy_2nd_bootloader_and_run : src:0x01500000, dst:0x00021000, size:0x000b1000Jumping to 2nd bootloader... 2. Extract parts from your eMMC dumpeMMC block size is 512 so we will multiply by 0x200 and then back to decimal:00000100 * 0x200 = 0x20000 = 13107200000680 = 1664 dd if=emmc.bin of=hwconfig.bin bs=1 skip=131072 count=1664 00000104 * 0x200 = 0x20800 = 133120000B21E0 = 729568 dd if=emmc.bin of=uboot32.bin bs=1 skip=133120 count=729568 0x00028125 * 0x200 = 0x5024A0 = 840360960x00100000 = 1048576 dd if=emmc.bin of=uboot64.bin bs=1 skip=84036096 count=1048576 Booting U-Boot 32: Add pure ymodem file transfer protocol to minicom according to https://github.com/danielkucera/minicom-ymodem. Find following line in log to find where to load uboot: j bootcode jump address:0002000064b 1. start minicom2. connect power to your board while holding Ctrl+q. You should get d/g/r> prompt.3. press h 4. press Ctrl-a, z, s and load hwconfig.bin via ymodem5. set address where to load uboot by entering: s9800705800020000 6. press d to download uboot and load uboot32.bin via ymodem7. press g to boot and U-Boot should start You should see U-Boot starting and getting to prompt: Realtek> Booting rescue linux 1. prepare USB drive with uboot64.binrecovery files from http://ota-cloudfront.zidoo.tv/X8/img/v1.2.6/v1.2.6_img.zip rescue.emmc.dtb emmc.uImage rescue.root.emmc.cpio.gz_pad.img bluecore.audio emmc.bin 2. from U-Boot 32 write U-Boot 64 to eMMC where it needs to be: Realtek> usb start...Realtek> fatload usb 0 0x01500000 uboot64X8.binreading uboot64X8.binFilesize: 160000 bytes160000 bytesSize: 160000, got: 160000160000 bytes read (take 58ms)Realtek> mmc write 0x01500000 0x28125 313MMC write: block # 164133, count 787 ...787 blocks write: OK 3. boot from USB – this should end with a working bash prompt in rescue Linux: Realtek> go ru(Re)start USB...USB0: USB EHCI 1.00scanning bus 0 for devices... 3 USB Device(s) foundUSB1: USB XHCI 1.10scanning bus 1 for devices... Unknown request , typeReq = 0x200c1 USB Device(s) foundUSB2: USB XHCI 1.10scanning bus 2 for devices... Unknown request , typeReq = 0x200c1 USB Device(s) foundscanning usb for storage devices... 1 Storage Device(s) found1: Hub, USB Revision 2.0- u-boot EHCI Host Controller- Class: Hub- PacketSize: 64 Configurations: 1- Vendor: 0x0000 Product 0x0000 Version 1.0Configuration: 1- Interfaces: 1 Self Powered 0mAInterface: 0- Alternate Setting 0, Endpoints: 1- Class Hub- Endpoint 1 In Interrupt MaxPacket 8 Interval 255ms2: Hub, USB Revision 2.0- USB2.0 Hub- Class: Hub- PacketSize: 64 Configurations: 1- Vendor: 0x05e3 Product 0x0610 Version 50.152Configuration: 1- Interfaces: 1 Self Powered Remote Wakeup 100mAInterface: 0- Alternate Setting 0, Endpoints: 1- Class Hub- Endpoint 1 In Interrupt MaxPacket 1 Interval 12ms- Endpoint 1 In Interrupt MaxPacket 1 Interval 12ms3: Mass Storage, USB Revision 2.0- Kingston DataTraveler 2.0 AC220B280602BE41599A0150- Class: (from Interface) Mass Storage- PacketSize: 64 Configurations: 1- Vendor: 0x0951 Product 0x1665 Version 1.0Configuration: 1- Interfaces: 1 Bus Powered 200mAInterface: 0- Alternate Setting 0, Endpoints: 2- Class Mass Storage, Transp. SCSI, Bulk only- Endpoint 1 In Bulk MaxPacket 512- Endpoint 2 Out Bulk MaxPacket 5124: Hub, USB Revision 3.0- u-boot XHCI Host Controller- Class: Hub- PacketSize: 9 Configurations: 1- Vendor: 0x0000 Product 0x0000 Version 1.0Configuration: 1- Interfaces: 1 Self Powered 0mAInterface: 0- Alternate Setting 0, Endpoints: 1- Class Hub- Endpoint 1 In Interrupt MaxPacket 8 Interval 255ms5: Hub, USB Revision 3.0- u-boot XHCI Host Controller- Class: Hub- PacketSize: 9 Configurations: 1- Vendor: 0x0000 Product 0x0000 Version 1.0Configuration: 1- Interfaces: 1 Self Powered 0mAInterface: 0- Alternate Setting 0, Endpoints: 1- Class Hub- Endpoint 1 In Interrupt MaxPacket 8 Interval 255msUSB device 0: Vendor: Kingston Rev: PMAP Prod: DataTraveler 2.0Type: Removable Hard DiskCapacity: 15000.0 MB = 14.6 GB (30720000 x 512)reading rescue.emmc.dtbFilesize: 61692 bytes61692 bytesSize: 61692, got: 6169261692 bytes read (take 47ms)Loading "rescue.emmc.dtb" to 0x01F00000 is OK.reading emmc.uImageFilesize: 14690304 bytes14690304 bytesSize: 14690304, got: 1469030414690304 bytes read (take 683ms)Loading "emmc.uImage" to 0x03000000 is OK.reading rescue.root.emmc.cpio.gz_pad.imgFilesize: 12582912 bytes12582912 bytesSize: 12582912, got: 1258291212582912 bytes read (take 591ms)Loading "rescue.root.emmc.cpio.gz_pad.img" to 0x02200000 is OK.reading bluecore.audioFilesize: 3212505 bytes3212505 bytesSize: 3212505, got: 32125053212505 bytes read (take 189ms)Loading "bluecore.audio" to 0x01b00000 is OK.Start Audio Firmware ...EXPORT ENV AT 0x10000000rtk_preload_bootimages : load U-Boot 64 from 0x00028125 to 0x01500000 with size 0x00100000copy_2nd_bootloader_and_run : src:0x01500000, dst:0x00021000, size:0x000b1000Jumping to 2nd bootloader...U-Boot 2015.07-ge1162f1 (Aug 02 2016 - 11:24:56 +0800)CPU : Cortex-A53 Quad CoreBoard: Realtek QA Board[ERR] get_accessible_ddr_size: hw setting error. (impossible value 0x0)[ERR] Fall back to using CONFIG_SYS_RAM_DCU1_SIZEDRAM: 1 GiBmapping memory 0x20000000-0x40000000 non-cachedIn: serialOut: serialErr: serialHit any key to stop autoboot: 0rtk_plat_set_fw not port yet