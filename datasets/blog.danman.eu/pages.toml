full_description = "Projects Fixing broken TP-Link TL-MR100 31. January 2023 danman 19 Comments TL;DR: the problem is usually in corrupted data in SPI NAND flash, you need to download the original config data and flash back working modem firmware. I noticed there is quite a lot of offers with used not working 4G router TL-MR100 in aukro.cz . I bought one with hope I can easily fix and use it. But the fix turned out to be not that easy. Continue reading Fixing broken TP-Link TL-MR100 → 4gbrokenfixroutertl-mr100 danman on Playing with CAN bus5. February 2025Yes, that is what I do. No, it's not on obd2 port, you need to find correct wires. Mike on Playing with CAN bus5. February 2025So basically sending the open command a few times should wake it up? Also is it possible to coonect to… danman on Playing with CAN bus5. February 2025It goes to sleep but after sending a few messages the ECUs will wake up. Mike on Playing with CAN bus4. February 2025Does the comfort canbus stay active even after ignition is off? Will it work even if ignition is off?"
