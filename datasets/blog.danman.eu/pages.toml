["https://blog.danman.eu/category/linux"]
title = "Linux | danman's blog"
full_description = "Linux My wireguard cheatsheet 31. May 2023 danman Leave a comment I always search for this so I will write it down here. Client cd /etc/wireguard wg genkey | tee privatekey | wg pubkey > publickey vi wg0.conf [Interface] PrivateKey = Address = 10.9.0.X/24 [Peer] PublicKey = dg1cKCId81d6h5cWUQ61BMHksBbi0FdFnitjxDuOuno= Endpoint = vpn.danman.eu:51820 AllowedIPs = 10.9.0.0/24 PersistentKeepalive = 25 wg-quick up /etc/wireguard/wg0.conf systemctl enable wg-quick@wg0.service systemctl edit wg-quick@wg0.service [Service] Restart=on-failure RestartSec=5s Server systemctl stop wg-quick@wg0.service vi /etc/wireguard/wg0 systemctl start wg-quick@wg0.service Reload wg syncconf wg0 <(wg-quick strip wg0) Linux, Openshift OpenShift 4: Automatic LDAP group synchronization 22. February 2020 danman 2 Comments If you need to use LDAP for authentication in OpenShift 4, the documentation is pretty clear and everything works nicely [1]. But if you need to grant privileges based on LDAP groups [2], the situation gets complicated.The synchronization from [2] works ok but you need to run it manually. I was searching for an automated solution and I have found a definition [3] which works for OpenShift 3.x so I updated it work with OpenShift 4 and here it is [4]: Continue reading OpenShift 4: Automatic LDAP group synchronization → CronJobldapopenshiftsynchronization Linux My socat examples 24. June 2019 danman Leave a comment Transport serial port over network The other end may be provided by ser2net socat -d -d pty,link=/dev/ttyUSB99,echo=0,perm=0777 TCP4-CONNECT:192.168.0.254:5000 Emulate two connected serial ports socat -d -d pty,link=/dev/ttyUSB98,echo=0,perm=0777 pty,link=/dev/ttyUSB99,echo=0,perm=0777 Some multicast examples here: https://blog.danman.eu/using-socat-for-multicast-receiving-and-proxying/ networkserialsocat Linux Enable system site packages in virtualenv 8. January 2019 danman Leave a comment I started using virtualenv for all python apps I run (because I hate to make mess with pip in system site-packages). Later I’ve found out that some dependencies can not be installed via pip but are included in standard system packages installed via apt or yum. To use these imports inside your venv, you need to specify parameter –system-site-packages when creating your venv. If you only find out that you really need them later, you can enable them by deleting following file: your_venv_dir/lib/pythonXXX/no-global-site-packages.txt Happy pythoning! Source: https://virtualenv.pypa.io/en/latest/userguide/#the-system-site-packages-option enablepythonsite-packagessystemvirtualenv"
