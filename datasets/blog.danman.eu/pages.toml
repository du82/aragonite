full_description = '''Linux DRBD quick cheat sheet 22. January 2016 danman Leave a comment Creating volume /etc/drbd.d/raid10.res resource raid10 { protocol B; on hostname1 { device /dev/drbd1; disk /dev/raid10_vg/drbd; address [localIP]:7789; meta-disk internal; } on hostname2 { device /dev/drbd1; disk /dev/raid10-vg/drbd; address [localIP]:7789; meta-disk internal; } } Both nodes: drbdadm create-md [resource] drbdadm up [resource] Primary node: drbdadm primary --force [resource] cat /proc/drbd version: 8.4.3 (api:1/proto:86-101) srcversion: 6551AD2C98F533733BE558C 1: cs:SyncSource ro:Primary/Secondary ds:UpToDate/Inconsistent B r----- ns:7552704 nr:0 dw:0 dr:7552936 al:0 bm:460 lo:47 pe:12 ua:47 ap:0 ep:1 wo:f oos:97303516 [>...................] sync'ed: 7.3% (95020/102396)Mfinish: 0:15:29 speed: 104,672 (96,804) K/sec Resize Both nodes: lvresize /dev/raid10-vg/drbd -L+100G Extending logical volume drbd to 200.00 GiB Logical volume drbd successfully resized resize with resync: drbdadm resize [resource] resize without resync (added clean space): drbdadm -- --assume-clean resize [resource] Resize filesystem: resize2fs /dev/drbd1 Fix splitbrain slave: drbdadm secondary all drbdadm connect --discard-my-data all master: drbdadm connect all Linux Deleting from postfix queue by regex 19. January 2016 danman Leave a comment postqueue -p | tail -n +2 | awk 'BEGIN { RS = "" } / baddab@spammer.com/ { print $1 }' | tr -d '*!' | postsuper -d - Linux Installing SNMP MIBs in Ubuntu 18. December 2015 danman 8 Comments If you get this error in zabbix autodiscovery function: snmp_parse_oid(): cannot parse OID “IF-MIB::ifDescr” Or if you just want to install MIBs for some other reason, do following: Continue reading Installing SNMP MIBs in Ubuntu → Linux Rebooting linux using sysrq Aside 13. November 2015 danman Leave a comment Equivalent to pressing reset button on PC case echo 1 > /proc/sys/kernel/sysrq echo b > /proc/sysrq-trigger other commands: https://www.kernel.org/doc/Documentation/sysrq.txt'''
