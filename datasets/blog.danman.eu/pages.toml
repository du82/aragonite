full_description = "Linux Enable system site packages in virtualenv 8. January 2019 danman Leave a comment I started using virtualenv for all python apps I run (because I hate to make mess with pip in system site-packages). Later I’ve found out that some dependencies can not be installed via pip but are included in standard system packages installed via apt or yum. To use these imports inside your venv, you need to specify parameter –system-site-packages when creating your venv. If you only find out that you really need them later, you can enable them by deleting following file: your_venv_dir/lib/pythonXXX/no-global-site-packages.txt Happy pythoning! Source: https://virtualenv.pypa.io/en/latest/userguide/#the-system-site-packages-option enablepythonsite-packagessystemvirtualenv danman on Playing with CAN bus5. February 2025Yes, that is what I do. No, it's not on obd2 port, you need to find correct wires. Mike on Playing with CAN bus5. February 2025So basically sending the open command a few times should wake it up? Also is it possible to coonect to… danman on Playing with CAN bus5. February 2025It goes to sleep but after sending a few messages the ECUs will wake up. Mike on Playing with CAN bus4. February 2025Does the comfort canbus stay active even after ignition is off? Will it work even if ignition is off?"
