title = "Reverse engineering Lenkeng HDMI over IP extender | danman's blog"
full_description = '''Projects Reverse engineering Lenkeng HDMI over IP extender 2. October 2021 danman 208 Comments Short time ago, I was searching for a way how to get HDMI output from camera to PC (and then stream on the Internet). There are PCI-x HDMI input cards on the market, but they cost 100$+. Suddenly, I have found a device, which transmitted HDMI signals over IP network for half of the above price so I took the chance. Specification said something about MJPEG so I thought it might be possible. Beginning When the package arrived, first thing was to test if it really works as described and it really did – audio and video output from DVD player transmitted through common ethernet switch to my TV. Second thing I did was of course starting wireshark and sniffing the data. I found out, that it uses multicast to two UDP ports (2068 and 2066) and time to time broadcast some control packets. Extracting video frames Highest bitrate was on port 2068 what indicated it is video stream. After a while I found a packet with JFIF header (on picture above) – great! data is not encrypted, nor compressed and contains JPEGs. After investigating packets in sequence, I found out following structure in UDP payload: | 2B – frame number | 2B – frame chunk number | data |* frame number – (unsigned int, big endian) all chunks within one JPEG have same frame number, increments by 0x01* frame chunk number – (unsigned int, big endian) first image chunk is 0x0000, increments by 0x01, last chunk has MSB set to 1 So I searched google for python multicast listener and modified it to save data to .jpeg files according rules above. After running, I was able to see some images with correct size but they were somehow damaged. First few pixels were OK but then there was a mess, like something was missing. Few hours I elaborated with capturing script what could be wrong but then I’ve got an idea: why does wireshark shows malformed packets? After looking on wireshark packets again, I found out, there are some bytes in the end of packet not part of UDP payload. So I googled raw socket listener (thanks Silver Moon) and manually parsed IP and UDP headers to match correct packets and extract UDP payload with trailing bytes any voila! it worked, I’ve got correct JPEG frames. #!/usr/bin/python #Packet sniffer in python #For Linux - Sniffs all incoming and outgoing packets :) #Silver Moon (m00n.silv3r@gmail.com) #modified by danman import socket, sys from struct import * import struct #Convert a string of 6 characters of ethernet address into a dash separated hex string def eth_addr (a) : b = "%.2x:%.2x:%.2x:%.2x:%.2x:%.2x" % (ord(a[0]) , ord(a[1]) , ord(a[2]), ord(a[3]), ord(a[4]) , ord(a[5])) return b #create a AF_PACKET type raw socket (thats basically packet level) #define ETH_P_ALL 0x0003 /* Every packet (be careful!!!) */ try: s = socket.socket( socket.AF_PACKET , socket.SOCK_RAW , socket.ntohs(0x0003)) except socket.error , msg: print 'Socket could not be created. Error Code : ' + str(msg[0]) + ' Message ' + msg[1] sys.exit() sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM, socket.IPPROTO_UDP) sock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1) #sock.bind(('', 2068)) # wrong: mreq = struct.pack("sl", socket.inet_aton("224.51.105.104"), socket.INADDR_ANY) #mreq = struct.pack("=4sl", socket.inet_aton("226.2.2.2"), socket.INADDR_ANY) #sock.setsockopt(socket.IPPROTO_IP, socket.IP_ADD_MEMBERSHIP, mreq) sender="000b78006001".decode("hex") notopen=1 # = open('/tmp/fifo', 'w') # receive a packet while True: packet = s.recvfrom(65565) #packet string from tuple packet = packet[0] #parse ethernet header eth_length = 14 eth_header = packet[:eth_length] eth = unpack('!6s6sH' , eth_header) eth_protocol = socket.ntohs(eth[2]) if (packet[6:12]==sender) & (eth_protocol == 8) : #Parse IP header #take first 20 characters for the ip header ip_header = packet[eth_length:20+eth_length] #now unpack them :) iph = unpack('!BBHHHBBH4s4s' , ip_header) version_ihl = iph[0] version = version_ihl >> 4 ihl = version_ihl & 0xF iph_length = ihl * 4 ttl = iph[5] protocol = iph[6] s_addr = socket.inet_ntoa(iph[8]); d_addr = socket.inet_ntoa(iph[9]); #UDP packets if protocol == 17 : u = iph_length + eth_length udph_length = 8 udp_header = packet[u:u+8] #now unpack them :) udph = unpack('!HHHH' , udp_header) source_port = udph[0] dest_port = udph[1] length = udph[2] checksum = udph[3] #get data from the packet h_size = eth_length + iph_length + udph_length data = packet[h_size:] if (dest_port==2068): frame_n=ord(data[0])*256+ord(data[1]) part=ord(data[3]) print "frame",frame_n,"part",part, "len",len(data),"end?",end if (part==0) & notopen: f = open('files/'+str(frame_n)+"_"+str(part).zfill(3)+'.jpg', 'w') notopen=0 if notopen==0: f.write(data[4:]) Thank you chinese engineers! Because of wrong length in IP header (1044) I have to listen on raw socket! Initiating stream All this was done, when both sender and receiver were plugged into network. I also wanted to be able to use only sender and PC. When I plugged in sender only, no stream was broadcasted so I plugged in also the receiver a captured control frames. Each one control packet from receiver was unique so I took payload from the first one and sent it from PC to IP address of sender and I was successful. The sender started to send stream for a few seconds and then stopped. So I started to send control packets one per second and the stream was playing continuously. Then I experimented with length of payload – I started to send shorter frames and I finally found out, that it only needs a few specific bytes. So the final packet is as follows:unicast to 48689/UDP with payload 0x5446367A600200000000000303010026000000000234C2 Extracting audio Last part of my research was to extract audio from stream. Again, I used wireshark to sniff and analyse packets.I saved the stream to file as raw data and imported into audacity. After trying few formats for importing I found out, that there is some audio playing when set for Signed 32bit PCM, big-endian, stereo, 48Khz.As you can see on the picture, sound was interfered by regular peaks. After investigating packets, I found that the data is well structured except the beginning of payload starting with some 0x00 and 0x55 (as on picture from wireshark). So I took python multicast listener again and truncated first 16bytes from each packet and streamed to stdout: #!/usr/bin/python import socket import struct import sys sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM, socket.IPPROTO_UDP) sock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1) sock.bind(('', 2066)) # wrong: mreq = struct.pack("sl", socket.inet_aton("224.51.105.104"), socket.INADDR_ANY) mreq = struct.pack("=4sl", socket.inet_aton("226.2.2.2"), socket.INADDR_ANY) sock.setsockopt(socket.IPPROTO_IP, socket.IP_ADD_MEMBERSHIP, mreq) counter=0 while True: packet=sock.recv(10240) sys.stdout.write(packet[16:]) I started vlc to listen to streamed audio with following command: ./listen-audio.py | vlc --demux=rawaud --rawaud-channels 2 --rawaud-samplerate 48000 --rawaud-fourcc s32b - and I’ve got audio playing from VLC. Hardware Great magic box! As a curious engineer, I definitely had to know what’s inside this gadget. Here are some photos: LK-3080-ACL – main processor from Lenkeng IT6604E – HDMI input interface doing HDCP decoding LK-3080-ACL – main processor from Lenkeng CAT6612CQ – HDMI out interface Conclusion I was searching for solution for live video mixing from cameras with HDMI output. They can be far from mixing computer connected via switches and cheap ethernet technology. With this knowledge I have build a prototype for mixing software in Qt separating input video streams by source IP and mixing/switching them. It’s still in beta phase, but you can see it on my github. If you have any questions or suggestions, feel free to let me know in comment. Quality test (updated 26/01/2014) As requested by readers, today I did a speed/quality test. I took jpeg 1080×1920 image and let it play on DVD player. You can compare original and transmitted image here: Transmitter was streaming 1080p@18fps with 90Mbps bitrate. Unfortunately I have no blue-ray player on hand to test original HD content. Update 2. Feb 2014 Today I have quickly tested 1080 again and it showed up, that quality is not that bad as on pictures above. Please see following picture. The source was computer showing the same picture in fullscreen mode. Update 23. May 2014 Together with Tom Warren we modified the script in a way that now it plays correctly in VLC via pipe using this command and code: ./scriptname.py | vlc – #!/usr/bin/python2 #Packet sniffer in python #For Linux - Sniffs all incoming and outgoing packets :) #Silver Moon (m00n.silv3r@gmail.com) #modified by danman import socket, sys from struct import * import struct import binascii #Convert a string of 6 characters of ethernet address into a dash separated hex string def eth_addr (a) : b = "%.2x:%.2x:%.2x:%.2x:%.2x:%.2x" % (ord(a[0]) , ord(a[1]) , ord(a[2]), ord(a[3]), ord(a[4]) , ord(a[5])) return b #create a AF_PACKET type raw socket (thats basically packet level) #define ETH_P_ALL 0x0003 /* Every packet (be careful!!!) */ try: s = socket.socket( socket.AF_PACKET , socket.SOCK_RAW , socket.ntohs(0x0003)) except socket.error , msg: print 'Socket could not be created. Error Code : ' + str(msg[0]) + ' Message ' + msg[1] sys.exit() sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM, socket.IPPROTO_UDP) sock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1) #sock.bind(('', 2068)) # wrong: mreq = struct.pack("sl", socket.inet_aton("224.51.105.104"), socket.INADDR_ANY) mreq = struct.pack("=4sl", socket.inet_aton("226.2.2.2"), socket.INADDR_ANY) sock.setsockopt(socket.IPPROTO_IP, socket.IP_ADD_MEMBERSHIP, mreq) sender="000b78006001".decode("hex") #sender = binascii.a2b_hex("000b78006001") bc5ff4730e6f #sender = binascii.a2b_hex("bc5ff4730e6f") #print binascii.b2a_hex(sender) notopen=1 # = open('/tmp/fifo', 'w') print "--myboundary\nContent-Type: image/jpeg\n" # receive a packet while True: packet = s.recvfrom(65565) #packet string from tuple packet = packet[0] #parse ethernet header eth_length = 14 eth_header = packet[:eth_length] eth = unpack('!6s6sH' , eth_header) eth_protocol = socket.ntohs(eth[2]) if (packet[6:12] == sender) & (eth_protocol == 8) : #Parse IP header #take first 20 characters for the ip header ip_header = packet[eth_length:20+eth_length] #now unpack them :) iph = unpack('!BBHHHBBH4s4s' , ip_header) version_ihl = iph[0] version = version_ihl >> 4 ihl = version_ihl & 0xF iph_length = ihl * 4 ttl = iph[5] protocol = iph[6] s_addr = socket.inet_ntoa(iph[8]); d_addr = socket.inet_ntoa(iph[9]); #UDP packets if protocol == 17 : u = iph_length + eth_length udph_length = 8 udp_header = packet[u:u+8] #now unpack them :) udph = unpack('!HHHH' , udp_header) source_port = udph[0] dest_port = udph[1] length = udph[2] checksum = udph[3] #get data from the packet h_size = eth_length + iph_length + udph_length data = packet[h_size:] if (dest_port==2068): frame_n=ord(data[0])*256+ord(data[1]) part=ord(data[2])*256+ord(data[3]) if (part==0) : # & (notopen==1) : #f = open('files/'+str(frame_n)+"_"+str(part).zfill(3)+'.jpg', 'w') #fname = str(frame_n)+"_"+str(part).zfill(3)+'.jpg' #fname = 'file.jpg' print "\n--myboundary\nContent-Type: image/jpeg\n" notopen=0 #print 'File ' + str(frame_n) + ' created.' if notopen==0: #f.write(data[4:]) #print data[4:] sys.stdout.write(data[4:]) #with open(fname, 'wb') as fin: #sys.stdout.write(fin.write(data[4:])) #print fin.write(data[4:]) Update 13. Dec 2014 For those who are interested in Windows version, Brian has written .NET version of similar capturer from scratch with a nicely documented project page here.Brian, thank you for your work. Update 1. Oct 2020 Yes, this is an update after 6 years. I guess nobody is interested in this device anymore, but I want to sum up some information from comments here and give news about the device. There is a serial interface on pin header CON4 with following pinout: 1 = +2 = Rx3 = Tx4 = Gnd You can find the list of possible commands in this comment. A comprehensive quality evaluation can be found in another comment. There is a webinterface on standard port 80, where you can set IP address, EDID, Serial settings and upgrade firmware. The firmware consist of two parts: bootloader and the main program. You can find full dump of the SPI flash on this link. There is a newer revision of the device which doesn’t have the packet length bug (which causes you need to listen on RAW socket). I’ve written a simple capture software in Go, there are precompiled binaries for Linux and Win. Over the time the device was sucessfully reverse engineered and an opensource firmware is available. Thanks to this effort, also the packet length bug has been binary patched and you can find the patched firmware here. At 1080p it transmits only 17-18FPS to fit into 100Mbit limit. The latency can be seen in this video: You can find datasheet of the main chip here: TF-680-datasheet-1013Download In general, this device is still okay if you just need JPEG frames out of your video or very short latency. If you need better compresion, I recommend you to look elsewhere, e.g.: LKV373ATronsmart Pavo M9Zidoo X9S hdmiLenkengLKV373MJPEGstreaming'''
