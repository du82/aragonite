full_description = "Front page, Projects, Teardown Chinese PoE extractor teardown 4. February 2025 danman Leave a comment I needed to power some cameras using Power over Ethernet but they only supported 12V input, so I ordered some PoE extractors from ali. Here they are for your information. Continue reading Chinese PoE extractor teardown → aliextractorpoeteardown Projects, Teardown Hellobox B1 satellite finder teardown 26. January 2021 danman Leave a comment It is a very simple device for about $15. The main SoC is GX6605S. There is some limited info about this chip on C-SKY page and some technical docs at their tools repo. It communicates with a Bluetooth module TLSR8266 using UART. There is also 4MB SPI flash holding the whole bootloader called GxLoader, Linux kernel and filesystem with the main app. The last important chip is RDA5815M which handles the RF to I/Q conversion. In the future I plan to add an USB-to-Ethernet adapter and repurpose it as an cheap opensource SAT>IP server. Continue reading Hellobox B1 satellite finder teardown → 5518MDVB-SDVB-S2GX6605Shellobox b1RDA5518MSAT>IPsatellite finderteardown Teardown DDS518 teardown 22. December 2020 danman Leave a comment It is quite simple device. The main chip is Vango V9821S – a single-phase energy metering SoC chip, then there is one EEPROM 24C04, optical isolation for S0, display and power supply circuitry and a display. There is no serial interface so no way how to get more data out of the device, only JTAG for programming. Continue reading DDS518 teardown → DDS518energy meterteardownV9821Sv98xx Teardown CometBlue teardown 22. December 2020 danman Leave a comment Chips used: AT MEGA169PADialog DA14580 Links https://github.com/xrucka/cometbluehttps://github.com/Hy3n4/ha-cc-cometbluehttps://www.torsten-traenkner.de/wissen/smarthome/heizung.phphttps://github.com/esphome/feature-requests/issues/485https://github.com/GrumpyMeow/esphome-componentshttps://github.com/gnbl/sparmatic2011https://www.mikrocontroller.net/articles/Sparmatic_Heizungsthermostatehttps://blog.renekliment.cz/2015/11/termostaticka-hlavice-z-lidlu-s-atmega-169.htmlhttps://github.com/MrKrabat/Comet-Blue-Thermostat avrbluebluetoothcometcometblueeurotronicthermostat"
