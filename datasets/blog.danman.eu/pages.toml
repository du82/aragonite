full_description = "Projects My first AVR 12. April 2014 danman Leave a comment Nothing special, just attiny2313, usbasp and some basic functions Continue reading My first AVR → Projects OSCam: Cheapest smart card reader 28. March 2014 danman 3 Comments While I was searching for cheapest oscam compatible card reader on e-bay, I found this SIM card reader: e-bay link With a price under $3 it is able to read/write SIM cards so I bought one to test if I can use it also for standard decrypt cards reading. Continue reading OSCam: Cheapest smart card reader → Projects PHP: RPC with asymmetric cryptography 1. March 2014 danman Leave a comment Yesterday, I was thinking about a simple way how to issue commands, list files, get files and access database on a remote system. With PHP all these things are simple to do and you don’t need to write TCP server, because it is provided by some HTTP daemon. It is also important that this could do only authenticated user. Next point was, that authenticated user can do anything on remote system and no complicated method implementation is needed on remote system. This might seem less secure but think about ssh… is it not similar? Continue reading PHP: RPC with asymmetric cryptography → Projects Reverse engineering Lenkeng HDMI over IP extender 2. October 2021 danman 208 Comments Short time ago, I was searching for a way how to get HDMI output from camera to PC (and then stream on the Internet). There are PCI-x HDMI input cards on the market, but they cost 100$+. Suddenly, I have found a device, which transmitted HDMI signals over IP network for half of the above price so I took the chance. Specification said something about MJPEG so I thought it might be possible. Continue reading Reverse engineering Lenkeng HDMI over IP extender → hdmiLenkengLKV373MJPEGstreaming danman on Playing with CAN bus5. February 2025Yes, that is what I do. No, it's not on obd2 port, you need to find correct wires. Mike on Playing with CAN bus5. February 2025So basically sending the open command a few times should wake it up? Also is it possible to coonect to…"
