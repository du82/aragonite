full_description = "Front page, Projects Repurposing Cisco power supplies 10. February 2025 danman 1 Comment Sometimes you can find a good deal on used power supply from various vendors. In my case it was Cisco C3K-PWR-750WAC and RPS 2300. The problem is, that they don’t output any voltage until they are plugged into device. The question is, how to fool them into thinking they are plugged in. Continue reading Repurposing Cisco power supplies → Front page, Projects, Teardown Chinese PoE extractor teardown 4. February 2025 danman Leave a comment I needed to power some cameras using Power over Ethernet but they only supported 12V input, so I ordered some PoE extractors from ali. Here they are for your information. Continue reading Chinese PoE extractor teardown → aliextractorpoeteardown Front page, Projects Hacking Wowme U300Q Car Camera to Actually Work 18. November 2024 danman Leave a comment I recently came across a Wowme U300Q car camera on an auction at aukro.cz . At first glance, it seemed like a promising piece of tech, but after trying to use it, I quickly realized there was a major flaw—it didn’t rotate recorded files and it was not just an issue with my piece, also reviews confirmed it as a global problem. For anyone familiar with dash cams, this is a critical issue because, without rotating files, the camera quickly runs out of storage and stops recording. Continue reading Hacking Wowme U300Q Car Camera to Actually Work → allwinercar camerafelghidrahacking Projects Reverse engineering Tesla 2-bus protocol 17. July 2023 danman 9 Comments In my flat they have installed these new digital door phones running on two wires manufactured by Tesla: I wanted to be notified when someone rings when we are not at home so I decided to reverse engineer it. Continue reading Reverse engineering Tesla 2-bus protocol → 2-buscallingSIPstm32Tesla Projects Updating RNS315 maps for fun and profit 21. February 2023 danman 19 Comments I have RNS315 radio/navigation/media system (I will call it unit) in my car. I bought it with maps from 2014 which are hugely outdated so I started to research how to update the maps. Continue reading Updating RNS315 maps for fun and profit → mapsmicroSD snifferpasswordrns315updatevagvw"
