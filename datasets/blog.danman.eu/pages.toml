full_description = "Teardown 3D shutter glasses teardown 22. December 2020 danman Leave a comment These are for DLP-Link projectors which can quickly strobe white frame between video frames for shutter signalling. You can read more about this technology here. They use specialized chip TPS65835 which integrates most of the needed functionality. Maybe I’ll try some hacking on this later. 3d glassesboarddissassemblydlp-linkteardown danman on Playing with CAN bus5. February 2025Yes, that is what I do. No, it's not on obd2 port, you need to find correct wires. Mike on Playing with CAN bus5. February 2025So basically sending the open command a few times should wake it up? Also is it possible to coonect to… danman on Playing with CAN bus5. February 2025It goes to sleep but after sending a few messages the ECUs will wake up. Mike on Playing with CAN bus4. February 2025Does the comfort canbus stay active even after ignition is off? Will it work even if ignition is off?"
