full_description = "Projects Reverse engineering Tesla 2-bus protocol 17. July 2023 danman 9 Comments In my flat they have installed these new digital door phones running on two wires manufactured by Tesla: I wanted to be notified when someone rings when we are not at home so I decided to reverse engineer it. Continue reading Reverse engineering Tesla 2-bus protocol → 2-buscallingSIPstm32Tesla Projects Controlling ESC via USB 16. March 2018 danman Leave a comment Yesterday I found this ESC and BLDC motor in my electronics box and decided I’ll test if it really works. Continue reading Controlling ESC via USB → BLDCESCmbedstm32USB Projects Turning ST-Link programmer into IR controlled USB keyboard 16. March 2018 danman 7 Comments As I promised last time, I’m going to continue with st-link programmer clones. This time I wanted to use mbed which has some ready made libraries for utilizing USB and since it was very comfortable to use DFU upload with arduino library, at first I checked if it is usable with mbed too. Continue reading Turning ST-Link programmer into IR controlled USB keyboard → DFUdfu-utilIRmbedPlatformIOstlinkstm32USB Projects ST-Link clone as STM32 dev board 13. July 2019 danman 1 Comment Last time I played with this device, I only uploaded gnuk token software and it was done. This time I wanted to try some developement in Arduino framework. Continue reading ST-Link clone as STM32 dev board → ArduinoboarddevPlatformIOst-linkstm32thermometerUSB Linux, Projects $2 USB crypto token for use with GPG and SSH 26. February 2018 danman 49 Comments If you are interrested in security devices this post may be for you. Recently I’ve found a software which makes a GPG security device out of a STM32. It’s called Gnuk. You just need a compatible board, programmer, flash the firmware and you are ready to go. I was just hoping to find some cheap device to flash to play with it. Continue reading $2 USB crypto token for use with GPG and SSH → cheapgnukgpgsshst-linkstm32stm3