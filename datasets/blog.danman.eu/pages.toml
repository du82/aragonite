full_description = "Front page Black thursday 28. April 2017 danman 3 Comments Hi all! Yesterday I suffered a great loss. All my data from this server went away… Unfortunately, I didn’t have recent full-backup of my blog so I needed to recreate some posts from WayBackMachine. That’s why most of pictures in posts from 2016 and 2017 is missing. Sorry for that. If you are interested in some exact pictures contact me, I can try to find them in my files. I wish you more luck with your backups. Bye! Gabriel says: 29. April 2017 at 1:05 Ouch! I feel really sorry for you. Good luck keeping this interesting blog up ! Reply svennd says: 6. May 2017 at 13:39 Ouch, painful, sadly also recognizable … Also check your chrome cache, sometimes images are left in there. I had a recent backup, but not the FS … 🙁 I guess its a lesson we all have to learn the hard way 🙂 Reply danman says: 7. May 2017 at 10:50 I did check both my computer but found just 4 images. Now I backup every day. Reply danman on Playing with CAN bus5. February 2025Yes, that is what I do. No, it's not on obd2 port, you need to find correct wires. Mike on Playing with CAN bus5. February 2025So basically sending the open command a few times should wake it up? Also is it possible to coonect to… danman on Playing with CAN bus5. February 2025It goes to sleep but after sending a few messages the ECUs will wake up. Mike on Playing with CAN bus4. February 2025Does the comfort canbus stay active even after ignition is off? Will it work even if ignition is off?"
