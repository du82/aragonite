["https://blog.danman.eu/new-version-of-lenkeng-hdmi-over-ip-extender-lkv373a"]
title = "New version of Lenkeng HDMI over IP extender – LKV373A (Update  6. sep 2019) | danman's blog"
full_description = "Projects New version of Lenkeng HDMI over IP extender – LKV373A (Update 6. sep 2019) 29. January 2021 danman 878 Comments Last week I’ve got the new version of Lenkeng HDMI extender – LKV373A. This version states incompatibility with previous version and usage of new HDbitT protocol so I was wondering what did Chinese engineers invent this time. This blog is a log of my findings as they went through time. If you want a short review of the device watch this video from OpenTechLab (thank you!): If you want to know more, just read the blog. Getting the stream After plugging HDMI input into sender and connecting sender directly with notebook, I saw following packets in tcpdump: 11:06:02.781619 IP 192.168.1.238.5004 > 239.255.42.42.5004: UDP, length 1328 11:06:02.781892 IP 192.168.1.238.5004 > 239.255.42.42.5004: UDP, length 1328 11:06:02.782172 IP 192.168.1.238.5004 > 239.255.42.42.5004: UDP, length 1328 11:06:02.782542 IP 192.168.1.238.5004 > 239.255.42.42.5004: UDP, length 1328 11:06:02.782775 IP 192.168.1.238.5004 > 239.255.42.42.5004: UDP, length 1328 11:06:02.783042 IP 192.168.1.238.5004 > 239.255.42.42.5004: UDP, length 1328 This was a great news because so heavy multicast traffic means a lot of data (most probably video) and no need to send control packets to start the stream. So I started vlc and set udp://@239.255.42.42:5004 as input. Some choppy video appeared, but it was unusable and following errors were appearing in console: Invalid UE golomb code [h264 @ 0x7f73c4ce78e0] cbp too large (3199971767) at 74 44 [h264 @ 0x7f73c4ce78e0] error while decoding MB 74 44 [h264 @ 0x7f73c4d76920] mb_type 535 in P slice too large at 18 41 [h264 @ 0x7f73c4d76920] error while decoding MB 18 41 [h264 @ 0x7f73c4d2f100] mb_type 264 in P slice too large at 78 32 [h264 @ 0x7f73c4d2f100] error while decoding MB 78 32 [h264 @ 0x7f73c4ce78e0] dquant out of range (-270) at 10 13 Invalid UE golomb code [h264 @ 0x7f73c4d76920] cbp too large (3199971767) at 74 44 [h264 @ 0x7f73c4d76920] error while decoding MB 74 44 [h264 @ 0x7f73c4ce78e0] error while decoding MB 10 13 [h264 @ 0x7f73c4cd35c0] cbp too large (540) at 35 16 [h264 @ 0x7f73c4cd35c0] error while decoding MB 35 16 [h264 @ 0x7f73c4d2f100] cbp too large (540) at 77 7 [h264 @ 0x7f73c4d2f100] error while decoding MB 77 7 [h264 @ 0x7f73c4d76920] dquant out of range (-270) at 44 36 [h264 @ 0x7f73c4d76920] error while decoding MB 44 36 [h264 @ 0x7f73c4ce78e0] mb_type 535 in P slice too large at 35 2 [h264 @ 0x7f73c4ce78e0] error while decoding MB 35 2 Invalid UE golomb code [h264 @ 0x7f73c4cd35c0] cbp too large (3199971767) at 70 44 [h264 @ 0x7f73c4cd35c0] error while decoding MB 70 44 [h264 @ 0x7f73c4d2f100] P sub_mb_type 7 out of range at 37 6 [h264 @ 0x7f73c4d2f100] error while decoding MB 37 6 [h264 @ 0x7f73c4cd35c0] dquant out of range (135) at 35 16 [h264 @ 0x7f73c4cd35c0] error while decoding MB 35 16 Invalid UE golomb code So I tried to proxy video thru ffmpeg (latest compiled version) ./ffmpeg -i udp://@239.255.42.42:5004 -vcodec copy -f mpegts udp://127.0.0.1:1234 and I’ve got significantly better video in VLC (udp://@:1234). But then I noticed in pcap, that packet length was 1328B but I knew it should be integer multiply of 188 (typicaly 1316 bytes) if it was mpegts stream.So my next thought was: this must be RTP! I started VLC, set input to rtp://@239.255.42.42:5004 and the result is here: I’ve got beautifully clean stream of my other desktop. Job’s done! Stream quality Bitrate of the stream is quite high, about 15Mbps, but unfortunately, it doesn’t stream in FullHD, but in strange resolution 1728×1080@30fps. If i lowered the resolution to 1280×720, I’ve got 60fps. Used codecs are H264 and mpga. You can stream directly to youtube with audio reencoding with this command: ffmpeg -i udp://239.255.42.42:5004 -vcodec copy -codec:a aac -b:a 128k -f flv rtmp://a.rtmp.youtube.com/live2/<stream key> Latency In following videos you can compare the latency of the old and the new HDMI extender. Left monitor shows source (secondary output is fed to HDMI sender), right monitor shows HDMI receiver output and notebook shows stream captured from network. Old extender has latency of about 100ms. New extender is slightly slower, latency is about 400-500ms. HDCP All this was done with PC output without HDCP encoding. When I connected sender to a DVD player, receiver was working OK but VLC couldn’t play the stream. Although it was showing high bitrate, nothing was played. If you want to examine the stream, you can look into this PCAP. This could be possibly solved by HDMI splitter which removes HDCP encoding. I’ll update this section later when I test it. Network The device acquires its IP address from DHCP. If there is no DHCP server in the network, it sets default IP 192.168.1.238 as you can see in first tcpdump. Builtin web interface allows only firmware upgrade. There are some signs (in commented parts of the page) it could set some stream parameters. I’ll investigate this later and update. Price You can buy the sender for about 40$ with shipping which is really not bad price for “HDMI to RTP” converter. On the other side, I don’t recommend you to buy the receiver. You can buy other more capable device (e.g. Raspberry PI) which can do the same job for less money or better. Well, you can buy it, if you want to save yourself from some fun with building it 🙂 This time it was not much about hacking, I’d say it was more discovering. I hope you liked my post and will give some feedback. Looking forward for it. Let’s stream! Update 12. jun 2016 I’ve got my own sender yesterday. These are new findings. When I tried to use the sender the same way I used the borrowed one, it was not working. So I started with the first thing: capturing packets: 11:18:45.134036 IP 10.1.0.99.5004 > 239.255.42.42.5004: UDP, length 1316 11:18:45.134287 IP 10.1.0.99.5004 > 239.255.42.42.5004: UDP, length 1316 11:18:45.134542 IP 10.1.0.99.5004 > 239.255.42.42.5004: UDP, length 1316 11:18:45.134787 IP 10.1.0.99.5004 > 239.255.42.42.5004: UDP, length 1316 11:18:45.135133 IP 10.1.0.99.5004 > 239.255.42.42.5004: UDP, length 1316 11:18:45.135394 IP 10.1.0.99.5004 > 239.255.42.42.5004: UDP, length 1316 11:18:45.135639 IP 10.1.0.99.5004 > 239.255.42.42.5004: UDP, length 1316 You can see, these packets are only 1316 bytes long what corresponds to standard mpegts encapsulation. So I tried to run VLC like this: vlc udp://@239.255.42.42:5004 and it worked: It was a sad surprise, when I saw the resolution 1280×720. I tried to restart the device, change computer resolution but nothing helped. Btw, even when this sender uses pure mpegts, it works with the other receiver (I didn’t expect that). Embedded webserver Embedded webserver shows only forms for firmware upgrade: There are some commented parts (everything is in data zip below if you want to see) about audio settings, but I wasn’t able to construct correct command to set anything. The webpage includes also some .js script from where I was able to construct few commands which worked: - set audio settings (doesn't work) http://192.168.1.238/dev/info.cgi?action=audioinfo&selaudio_type=1_AAC&selaudio_sprate=48000&selaudio_brate=256 - reboot device (works OK) http://192.168.1.238/dev/info.cgi?action=reboot&reboot=Reboot - set network settings (works OK) http://192.168.1.238/dev/info.cgi?action=network&ipaddr0=10&ipaddr1=1&ipaddr2=0&ipaddr3=99&netmask0=255&netmask1=255&netmask2=255&netmask3=0&gw0=10&gw1=0&gw2=0&gw3=1 - reset to default (doesn't work) http://192.168.1.238/dev/info.cgi?action=Reset&Reset=Reset - this should set MAC address (untested) http://192.168.1.238/dev/info.cgi?action=macaddr&macaddr0=yy&macaddr1=yy&macaddr2=yy&macaddr3=yy& macaddr4=yy&macaddr5=yy This was a dead end so I started hardware hacking. Hardware The mainboard contains two (probably custom made) chips. I guess one receives data from hdmi and encodes them. The other communicates over network, runs webserver and packetizes the stream. Let’s see the pictures: On the top side you can see two serial eeproms 25Q32 which are 32Mbit (4MB) flashes holding the firmware. So I tried to extract the firmware: The result is in this zip. It contains lkvm-4M.bin file downloaded from the eeprom. This file has a few sections: 0x00000000 – 0x00024e03 – SMEDIA02 …….456789ABCDEF 18.02.2016 14:44:42 (encoded – some strings suggesting bootloader)0x00080000 – 0x0016ee5d – SMEDIA02 …….456789ABCDEF 28.022016 14:44:47 (encoded – probably the main firmware)0x00250000 – 0x00250200 – some zeroes with some data0x00257e00 – FAT with webroot0x00367e00 – FAT with config0x003e0000 – MAC + 2 unknown bytes I couldn’t decode the first two sections but they seem to be a bootloader and the main code. If someone is able to help with that I’d be very thankful. But the forth and fifth section is interesting. They both contain valid FAT partition. You can see files from both in the zip. One contains files available via web server (webroot):./snapshot.jpg./jedi.rom./info.js./backup./backup/B./backup/B/iptv.ini./jquery.min.js./user_login.html./backdoor.html./devmode.html./iptv_info.html iptv_info is the default page with firmware upgrade. Interesting file is backdoor.html which contains two iframes, one with iptv_info and one with small_view.html which I suspect to contain forms for setting stream parameters. Unfortunately, this file (small_view.html) doesn’t exist on fat partition and it is unaccessible when requested via web (probably removed from production firmware). devmode.html allows setting device MAC address. iptv.ini holds probably default configuration. Unfortunately it doesn’t contain info.cgi which is used for setting parameters – this is probably embedded into firmware. Second FAT partition contains only single file:./iptv.ini – this is the actual configuration (double square brackets because of wordpress): [[tcpip]] dhcp = n autoip = n ipaddr = 10.1.0.99 netmask = 255.255.255.0 gw = 10.0.0.1 [video] hdmi = y cvbs = n videoin_res = 1920x1080_60P videoin_frate = 60 videoout_fhd = 0videoout_hd=1videoout_brate_fhd=15000 videoout_brate_hd = 12000 videoout_brate_sd = 4000 [audio] audio_type = 0_MPEG audio_sprate = 48000 audio_brate = 128 [[rtc]] rtcalarm = y rtcalarm_h = 0 rtcalarm_min = 0 [[stream]] udp = y rtp = n multicast = y unicast = n mcastaddr = 239.255.42.42 port = 5004 [[uart]] baud_rate = 115200 [[user]]] devicename = TX_008BC0095B64 name = admin pwd = 123456 I think this is the key! If we know how to online edit this (without writing eeprom), I could probably change videoout_fhd to 1 or change used audio coder or video bitrate. Serial port You can see 6 pin header in the middle of board (J4). Voltage on pins is following: 3,3VGND0V2,7V3,3V0V I tested all pins with USB-to-Serial TTL adapter, but valid signal was only on pin 1, you can see output here: Rd 38ee Rd 38ee Rd 38ee Rd 38ee Rd 38ee Rd 38ee Rd 38ee Rd 38ee Rd 38ee Rd 38ee Mem Addr (0x3a6) 0 Mem Addr (0x340) 2a45 Mem Addr (0x342) 2b8a Mem Addr (0x344) 1121 Mem Addr (0x346) 1 Mem Addr (0x348) a2 Mem Addr (0x34a) 38ee Mem Addr (0x34e) 0 Mem Addr (0xb4) 22f8 [MY01]REG (0x005c): 8001 Timer Init version: 7.1.2.0.11.20160218 ������ iic clock 200000 ! HDMITX I2C Read error, reg = 02 regDeviceID:0x7 ---Disable HDMITx--- (382), threshold[0][0] = 0x4da, threshold[0][1] = 0x5b3 (382), threshold[1][0] = 0x40b, threshold[1][1] = 0x4c0 (382), threshold[2][0] = 0x67, threshold[2][1] = 0x79 (382), threshold[3][0] = 0xce, threshold[3][1] = 0xf2 (382), threshold[4][0] = 0xb53, threshold[4][1] = 0x3ff audio queue_id: 1 video queue_id: 2 MPS_COMMAND_SET_CAPTURE_DEVICE 3 mode 5 MPS_COMMAND_SET_ISP_MODE 0 channel name: AIR_CH_521_6M --xcpu init-- cmd info addr: 0x2c1eb18 ir data buf addr: 0x2c1f720 ir data write porinter: 0x2c1e928 [MY02]REG (0x005c): 8000 [MainLoop] *irdataddr: 0x2c1f720, *irwptrddr: 0x2c1e928 [MainLoop] irwptr: 0x2c1e928, irbuf: 0x2c1f720 alloc addr: 0x2C20C88, buffer start: 0x2C20C88 tsbitrate: 23751336 after 