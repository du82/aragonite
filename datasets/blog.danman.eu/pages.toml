["https://blog.danman.eu/adapter-powered-nx-300-camera"]
title = "Adapter powered NX-300 camera | danman's blog"
full_description = "Projects Adapter powered NX-300 camera 6. January 2021 danman 7 Comments My wife owns a Samsung NX-300 camera and I wanted to use it for longer periods without needing to charge batteries round and round. Unfortunately, this camera can use its microUSB port only for charging – it doesn’t work without a battery and doesn’t charge when powered on. So I had to create a dummy battery. First, I measured dimensions of a real battery and created a model in Onshape with prepared slots for contact pads link to my project nx-battery.stlDownload I added contact pads made from a piezo buzzer (thin conductive and solderable metal) and connected them to my power supply. The nominal voltage of these batteries is 7.4V so I set this voltage but nothing happened. I tried to increase the voltage a little bit but without any effect. There were some small number of mA flowing but nothing serious. Li-ion batteries use to have a temperature sensor to avoid overheating so I measured the resistance between middle pin and negative pin and it was around 1MegaOhm. I added a 1MOhm resistor between these pins and suddenly my camera started working. I tested power consumption during recording on several voltages and the power input was still about the same. On 7V it was showing empty battery but still working. I was brave enough to test even 13V input and it worked but I wouldn’t recommend to use this for a long time. 9V is pretty close to the battery voltage and adapters are easily available. At the end I added a barrel jack connector for my adapter and the job was done. adapterbatteryNX seriesNX-300Samsung camera Keon Lee says: 4. October 2021 at 2:03 Hi Daniel, I have enjoyed your blog on NX300 Battery Mod very much, wish I had found this blog before my trial on my NX300M. I have busted the temperature sensor circuit of the camera when I applied wrong voltage (8V through 50k) using 3D printed dummy similar to yours, and the camera does not come on, although the charging through the USB port still works.. I wonder you may have some suggestions for fixing the power circuit. I have some experience with SMD circuits. I would appreciate for any suggestions. Reply"
