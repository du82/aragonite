title = "FM transmission test with FL2000 | danman's blog"
full_description = "Linux, Projects FM transmission test with FL2000 28. May 2018 danman 3 Comments My USB 3.0 to VGA adapter arrived a few days ago so I tested the FM transmission example. I used my own command for file playing: $ ffmpeg -re -i sample.mp3 -c:v none -f wav - | pv -B 256k | sox -t raw -r 44100 -e signed-integer -L -b 16 -c 2 - -c 1 -e signed-integer -b 16 -t raw - biquad 4.76963 -2.98129 0 1 0.78833 0 sinc -15k loudness 5 | ./osmo-fl2k/build/src/fl2k_fm - -s 130e6 -c 350e5 -i 44100 Results here: And it really works! 🙂 Sources https://osmocom.org/projects/osmo-fl2k/wiki https://github.com/steve-m/fl2k-examples git://git.osmocom.org/osmo-fl2k.git fl2000fl2kfmsdrtransmission menno klein says: 17. August 2019 at 14:18 Thanks it works great! For now i want to transmit more than 1 fm stations. So that i can add a lot of internet radiostations to my fm radio. That is possible because you can transfer a large fm spectrum. Do you have an example how i can do that? Reply danman says: 17. August 2019 at 14:48 Hi, I would suggest you to use https://wiki.gnuradio.org/index.php/Guided_Tutorial_GRC Reply Abhishek Sharma says: 25. December 2019 at 20:59 How we can transmit on another station as if we change the carrier wave that makes no sense we need to change the fm transmission frequency but it ends up with an error Reply danman on Playing with CAN bus5. February 2025Yes, that is what I do. No, it's not on obd2 port, you need to find correct wires. Mike on Playing with CAN bus5. February 2025So basically sending the open command a few times should wake it up? Also is it possible to coonect to… danman on Playing with CAN bus5. February 2025It goes to sleep but after sending a few messages the ECUs will wake up. Mike on Playing with CAN bus4. February 2025Does the comfort canbus stay active even after ignition is off? Will it work even if ignition is off?"
