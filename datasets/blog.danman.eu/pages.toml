full_description = "Front page, Projects Hacking Wowme U300Q Car Camera to Actually Work 18. November 2024 danman Leave a comment I recently came across a Wowme U300Q car camera on an auction at aukro.cz . At first glance, it seemed like a promising piece of tech, but after trying to use it, I quickly realized there was a major flaw—it didn’t rotate recorded files and it was not just an issue with my piece, also reviews confirmed it as a global problem. For anyone familiar with dash cams, this is a critical issue because, without rotating files, the camera quickly runs out of storage and stops recording. Continue reading Hacking Wowme U300Q Car Camera to Actually Work → allwinercar camerafelghidrahacking danman on Playing with CAN bus5. February 2025Yes, that is what I do. No, it's not on obd2 port, you need to find correct wires. Mike on Playing with CAN bus5. February 2025So basically sending the open command a few times should wake it up? Also is it possible to coonect to… danman on Playing with CAN bus5. February 2025It goes to sleep but after sending a few messages the ECUs will wake up. Mike on Playing with CAN bus4. February 2025Does the comfort canbus stay active even after ignition is off? Will it work even if ignition is off?"
