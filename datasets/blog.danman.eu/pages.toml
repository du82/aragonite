title = "Hacking Wowme U300Q Car Camera to Actually Work | danman's blog"
full_description = '''Front page, Projects Hacking Wowme U300Q Car Camera to Actually Work 18. November 2024 danman Leave a comment I recently came across a Wowme U300Q car camera on an auction at aukro.cz . At first glance, it seemed like a promising piece of tech, but after trying to use it, I quickly realized there was a major flaw—it didn’t rotate recorded files and it was not just an issue with my piece, also reviews confirmed it as a global problem. For anyone familiar with dash cams, this is a critical issue because, without rotating files, the camera quickly runs out of storage and stops recording. The Initial Problem: A Broken Camera When I first set up the Wowme U300Q, I was hopeful. The hardware looked solid, and the camera itself seemed well-built. However, after some time of recording, it would crash randomly. When I checked the files, I noticed it stopped recording a while ago – there were no recordings with recent timestamp. The camera would blink indicating recording, running recording timer, but no files would be saved. Exploring the Device After connecting it to my PC, I ran some basic diagnostics. I used the lsusb and found it is identifying as Google device: $ lsusb...Bus 002 Device 007: ID 18d1:0002 Google Inc.... So I tried adb shell and voila! $ adb shell* daemon not running; starting now at tcp:5037* daemon started successfullyBusyBox v1.27.2 () built-in shell (ash)------run profile file----- _____ _ __ _|_ _||_| ___ _ _ | | |_| ___ _ _ _ _ | | _ | || | | |__ | || || | ||_'_| | | | || | || _ | |_____||_||_|_||___||_,_| |_| |_||_|_||_|_| Tina is Based on OpenWrt! ---------------------------------------------- Tina Linux (Neptune, 5C1C9C53) ----------------------------------------------root@tina:/# I poked around the device a bit and discovered that it was running on an Allwinner chipset—something that could be worked with. root@tina:/# cat /proc/mtd dev: size erasesize namemtd0: 00100000 00001000 "uboot"mtd1: 002c0000 00001000 "boot"mtd2: 00ae0000 00001000 "rootfs"mtd3: 00080000 00001000 "overlay"mtd4: 00020000 00001000 "env"mtd5: 00020000 00001000 "bootlogo"mtd6: 00010000 00001000 "private"mtd7: 00090000 00001000 "UDISK"root@tina:/# mount /dev/root on /squashfs type squashfs (ro,relatime)devtmpfs on /dev type devtmpfs (rw,relatime,size=40552k,nr_inodes=10138,mode=755)/proc on /proc type proc (rw,relatime)tmpfs on /tmp type tmpfs (rw,relatime)sys on /sys type sysfs (rw,relatime)/dev/root on /squashfs type squashfs (ro,relatime)/dev/mtdblock3 on /overlay type jffs2 (rw,relatime)overlay on / type overlay (rw,relatime,lowerdir=/squashfs,upperdir=/overlay/upperdir,workdir=/overlay/workdir)tmpfs on /run type tmpfs (rw,relatime)devpts on /dev/pts type devpts (rw,relatime,gid=5,mode=620,ptmxmode=000)/dev/mtdblock7 on /mnt/UDISK type jffs2 (rw,relatime)/dev/mmcblk0 on /mnt/extsd type vfat (rw,relatime,fmask=0022,dmask=0022,codepage=437,iocharset=iso8859-1,shortname=mixed,errors=remount-ro)/dev/pts on /dev/pts type devpts (rw,relatime,mode=600,ptmxmode=000)none on /sys/kernel/config type configfs (rw,relatime)adb on /dev/usb-ffs/adb type functionfs (rw,relatime)none on /sys/kernel/debug type debugfs (rw,relatime)root@tina:/# cat /proc/cpuinfo processor : 0model name : ARMv7 Processor rev 5 (v7l)BogoMIPS : 31.57Features : half thumb fastmult vfp edsp neon vfpv3 tls vfpv4 idiva idivt vfpd32 lpae CPU implementer : 0x41CPU architecture: 7CPU variant : 0x0CPU part : 0xc07CPU revision : 5processor : 1model name : ARMv7 Processor rev 5 (v7l)BogoMIPS : 31.57Features : half thumb fastmult vfp edsp neon vfpv3 tls vfpv4 idiva idivt vfpd32 lpae CPU implementer : 0x41CPU architecture: 7CPU variant : 0x0CPU part : 0xc07CPU revision : 5Hardware : sun8iw16Revision : 0000Serial : 0000000000000000 Firmware backup To dive deeper into the device, I needed to back up the firmware for case when something went wrong. Fortunately, there was a useful method to back up Allwinner devices using a special SD card image. This process was outlined on the Linux Sunxi wiki: Boot into FEL mode and then backup over USB. All went smooth and I saved 4MB flash binary. Main binary Now I was ready to do some experiments. I have found out that the main process handling everything is called /usr/bin/sdvcam . So to gather some logs which would persist over reboot, I run it like this: root@tina:/# /usr/bin/sdvcam >/mnt/UDISK/app.out 2>/mnt/UDISK/app.err & I let it run until it crashed. Then I started to inspect the logs. W0905 21:17:46.511580 1781 main_recorder.cpp:610] <InitRecorder> m_filename is /mnt/extsd/video/20240905_211746.mp4E0905 21:17:46.512944 1781 main_recorder.cpp:630] <InitRecorder> record time: 120000, bitrate: 10485760,file allocate size 173015040E0905 21:17:46.514299 1781 recorder.cpp:831] <allocRecorderFile> allocRecorderFile rename file name ,file name /mnt/extsd/video/20240905_211746.mp4E0905 21:17:46.515655 1781 recorder.cpp:841] <allocRecorderFile> ReNameFilelen 0,filenamelen 36E0905 21:17:46.533033 1781 recorder.cpp:855] <allocRecorderFile> fatal error! Failed to fallocate size 173015040, (No space left on device)E0905 21:17:46.535569 1781 recorder.cpp:858] <allocRecorderFile> allocate file successE0905 21:17:46.541994 1781 VideoEnc_Component.c:4128] <VideoEncSaveBSFile> user set the same SaveBSFile => filename:, enable:0, start_time:0, end_time:0E0905 21:17:46.543442 1781 VideoEnc_Component.c:4163] <VideoEncUpdateProcSet> user set the same VeProcSet => enable:1, freq:30, BTTime:1000, FRTime:1000E0905 21:17:46.591112 1936 TextEnc_Component.c:46] <TextComponentThread> TextEncoder TextEncComponentThread start run...E0905 21:17:46.594789 1936 TextEnc_Component.c:396] <TextComponentThread> TextEnc_Comp not ind StateExecutingW0905 21:17:46.596601 1781 VideoEnc_Component.c:1824] <CedarvVideoEncInit> user set invalid gopSize[0], use idr interval[30] as default.W0905 21:17:46.618526 1781 preview_window.cpp:1307] <Update> handle msg:20W0905 21:17:46.619169 1802 EyeseeRecorder.cpp:1923] <dataCallbackTim