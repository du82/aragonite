full_description = "Front page, Projects, Teardown Chinese PoE extractor teardown 4. February 2025 danman Leave a comment I needed to power some cameras using Power over Ethernet but they only supported 12V input, so I ordered some PoE extractors from ali. Here they are for your information. Continue reading Chinese PoE extractor teardown → aliextractorpoeteardown Projects, Teardown Hellobox B1 satellite finder teardown 26. January 2021 danman Leave a comment It is a very simple device for about $15. The main SoC is GX6605S. There is some limited info about this chip on C-SKY page and some technical docs at their tools repo. It communicates with a Bluetooth module TLSR8266 using UART. There is also 4MB SPI flash holding the whole bootloader called GxLoader, Linux kernel and filesystem with the main app. The last important chip is RDA5815M which handles the RF to I/Q conversion. In the future I plan to add an USB-to-Ethernet adapter and repurpose it as an cheap opensource SAT>IP server. Continue reading Hellobox B1 satellite finder teardown → 5518MDVB-SDVB-S2GX6605Shellobox b1RDA5518MSAT>IPsatellite finderteardown Teardown DDS518 teardown 22. December 2020 danman Leave a comment It is quite simple device. The main chip is Vango V9821S – a single-phase energy metering SoC chip, then there is one EEPROM 24C04, optical isolation for S0, display and power supply circuitry and a display. There is no serial interface so no way how to get more data out of the device, only JTAG for programming. Continue reading DDS518 teardown → DDS518energy meterteardownV9821Sv98xx Teardown 3D shutter glasses teardown 22. December 2020 danman Leave a comment These are for DLP-Link projectors which can quickly strobe white frame between video frames for shutter signalling. You can read more about this technology here. They use specialized chip TPS65835 which integrates most of the needed functionality. Maybe I’ll try some hacking on this later. 3d glassesboarddissassemblydlp-linkteardown danman on Playing with CAN bus5. February 2025Yes, that is what I do. No, it's not on obd2 port, you need to find correct wires."
