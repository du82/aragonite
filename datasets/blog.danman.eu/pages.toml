full_description = "Teardown DDS518 teardown 22. December 2020 danman Leave a comment It is quite simple device. The main chip is Vango V9821S – a single-phase energy metering SoC chip, then there is one EEPROM 24C04, optical isolation for S0, display and power supply circuitry and a display. There is no serial interface so no way how to get more data out of the device, only JTAG for programming. Continue reading DDS518 teardown → DDS518energy meterteardownV9821Sv98xx Projects Wio Terminal in PlatformIO 18. July 2020 danman 1 Comment Seed Studio offered me a sample device (see specs) for exchange for an article on my blog and I accepted. The device came a few weeks ago so I am fulfilling my part. When it came, I went to their page and searched for some example code to test and I picked GitHub Stats example. The documentation is pretty good but it describes the usage with original Arduino IDE which is not my weapon of choice. Some time ago I noticed PlatformIO added support for this device so I wanted to use it. Continue reading Wio Terminal in PlatformIO → ArduinodisplayPlatformIOSeed Studiowifiwio terminal Projects Chip decapping using hot air 3. July 2020 danman 1 Comment Recently I saw an interesting video about chip decapping using only hot air. It looked quite easy so I gave it a try and indeed I managed to extract three dies without breaking them or any other problems so it was 100% successful on first try. You can see die pictures below. From left to right: GD32F103C8T6 main die, it’s flash and MAX7219 Continue reading Chip decapping using hot air → decapdecappingGD32hot air Projects Using Travis CI for KiCad PDF schematic generation 14. May 2020 danman Leave a comment I was thinking how to automatically generate PDF schematics for my public KiCad repos without committing it to the repo itself. I managed to make Travis CI do this for me and put the output to Github Releases. If you are interested, read on. Continue reading Using Travis CI for KiCad PDF schematic generation → GithubKiCadPDFReleasesreposchematicTravisTravisCI"
