["https://blog.danman.eu/ch341a-usb-serial-eeprom-reader-under-linux"]
title = "CH341A USB serial EEPROM reader under Linux | danman's blog"
full_description = "Projects CH341A USB serial EEPROM reader under Linux 9. December 2018 danman 25 Comments I needed to backup original firmware of my favorite Chinese wireless router but I didn’t want to spend much time with hacking the embedded Linux. So I have ordered this cheap USB serial EEPROM programmer on ebay. You can easily find the original utility & driver for Windows on the Internet but the chip manufacturer doesn’t provide software for Linux. After examining the board I found out that the chip is CH341A (datasheet) so I googled for some Linux software and I’ve found 2 opensource drivers: https://github.com/plumbum/ch341eeprom https://github.com/setarcos/ch341prog The first one can be used for programming 24C… I2C EEPROMs. The second one is for 25Q… SPI flash chips so it was my choice. After compiling and connecting my chip, I was able to read info about my flash. Unfortunately, when I tried to read memory contents I was only able to get first few bytes of my memory, probably because the chip was detected incorrectly. So I forked the original github repo and added an option to manually set memory length. After setting the length manually, I was able to download complete data from my flash. After some time I also needed to use it for 24C… programming. There are two forks of ch341eeprom on github. One which does pretend to support eeproms smaller than 128kb ( this one ) and one which really does ( this one ). Until I have found the second one, I also used a kernel module which adds /dev/i2c-x interface driver and wrote a script for writing eeproms here: Enjoy whichever method you like. Akanus says: 25. February 2016 at 15:01 Hi Daniel! You make super-utility for SPI-Flash. You can do it for 24Cxx-series EEPROM? Reply Abdullbasit says: 31. March 2016 at 19:26 i compiled your code but the read file contents are all zeros I read using the command ./ch341prog -l 8388608 -r test.bin) I have w25q64 , can you explain more about reading ? Reply danman says: 2. April 2016 at 17:47 Did you connect all pins? Some chips need to have /HOLD and /WP pins also connected to VCC. Reply"
