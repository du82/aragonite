full_description = "Projects Wio Terminal in PlatformIO 18. July 2020 danman 1 Comment Seed Studio offered me a sample device (see specs) for exchange for an article on my blog and I accepted. The device came a few weeks ago so I am fulfilling my part. When it came, I went to their page and searched for some example code to test and I picked GitHub Stats example. The documentation is pretty good but it describes the usage with original Arduino IDE which is not my weapon of choice. Some time ago I noticed PlatformIO added support for this device so I wanted to use it. Continue reading Wio Terminal in PlatformIO → ArduinodisplayPlatformIOSeed Studiowifiwio terminal Projects Smart energy meter 30. January 2020 danman 10 Comments In my current flat the central heating runs on natural gas and I wanted to have a nice chart showing its consumption. The gas meter is directly in the hallway so everyone can see it. Because of this, I cannot simply bring in AC power and attach some exposed wires, otherwise my neighbors would probably call anti-terrorist group. The measuring device has to be small, look professional and have low power consumption so it can run on batteries. In next lines I’ll describe how I have achieved this. Continue reading Smart energy meter → Arduinoesp8266low-powermbedmeternrf51nrf51822PlatformIOsmart Projects ST-Link clone as STM32 dev board 13. July 2019 danman 1 Comment Last time I played with this device, I only uploaded gnuk token software and it was done. This time I wanted to try some developement in Arduino framework. Continue reading ST-Link clone as STM32 dev board → ArduinoboarddevPlatformIOst-linkstm32thermometerUSB Projects ESP32 NTP OLED clock 4. October 2017 danman 25 Comments As a first project with my new ESP32 module with OLED display I chose to build OLED clock. I thought I’ll just find some existing code, upload it and it’s done. There are a few such projects for ESP8266 in NodeMCU. So I started with NodeMCU upload. Continue reading ESP32 NTP OLED clock → Arduinoclockesp32NTPOLEDPlatformIOwifi"
