title = "Fixing broken TP-Link TL-MR100 | danman's blog"
full_description = "Projects Fixing broken TP-Link TL-MR100 31. January 2023 danman 19 Comments TL;DR: the problem is usually in corrupted data in SPI NAND flash, you need to download the original config data and flash back working modem firmware. I noticed there is quite a lot of offers with used not working 4G router TL-MR100 in aukro.cz . I bought one with hope I can easily fix and use it. But the fix turned out to be not that easy. The router boots, shows WiFi network, you can connect to it but the problem is that the web management doesn’t work. I’ve found out that the device consists of two interconnected systems:– MT7628AN SoC providing WiFi and Ethernet– some “NezhaC” 4G modem providing web management and mobile connectivity via USB interface The first one was working fine but its logs were showing problems to communicate with the modem and indeed – the modem was not booting. I de-soldered the flash dedicated to the modem and tried to dump it but there were ECC errors and the data was damaged. So I obtained another working device to get a working flash contents and it worked: I dumped the whole flash, flashed to my broken one and I’ve got a clone of the working one (including IMEI which is quite a problem). From the logs I discovered, that there is only a short block (0x20000 – 0x60000) containing device specific data (IMEI, calibration, configuration,…) so I copied the block from my broken device over to the working image and… Great success! I also found (J10: 115200, 1-Tx, 2-Rx, 3-GND) an UART interface of the modem (I had to buy 1.8V compatible USB-TTL adapter) and I could see the modem booting: 0x00000000 PMIC ID: 0x00000013 Cold power up switch clk to XO NO Production Mode GuiLin Buck1 active voltage Reg: 0x00000098 GuiLin Buck1 active voltage Reg: 0x0000009c cpcore -> 624M AXI -> 208M DDR -> 1066M FlashNumber: 0x0000001a Bus clock: 13MHz QSPI_CLK_RES_CTRL: 0x5b tx_desc: 0x7c188e0 use_intr=1 en_tx_dma=1 use_xip=1 SPI-NAND: GD5F1GQ4RBxIG is found in table SPI-NAND type mfr_id: c8, dev_id: c1 Set rx_pins: 4 tx_pins: 4 AHB data transfer size: 512 XIP Read mode enabled Fixed LUT bit-map: 0x3fc block_size=0x20000 page_size=0x800 bitflip_threshold=6 Bus clock: 78MHz QSPI_CLK_RES_CTRL: 0x19b pFlashP->NumBlocks: 1020 Tr069 Config Init Done BoardType: 0x00000000 PlatformCI2Ready PlatformCI2Ready end Wait for USB ready USB Enum timeout Allow to boot up LTG_LWG_Version_Flag: 0xffffffff No need to upgrade TR069 return 0x00000001 LWG/LTG switch flag 0xffffffff Select to 3Mnde LWG CRC check OK with flash address 0x00020000 MRD FlashAddress Passed to CP: 0x00020000 CRC check OK with flash address 0x00040000 LWG uboot Primary/Backup MRD are both OK cpcore -> 208M DDR -> 533M end... 0 buadrate=0 UART Boot Completed 0 GPIOPhase2Init:[zc]---Before set ICU GPIO_INT 30 0 FPIOPhase2Init:[zc]---After set ICU GPIO_INT 3f 0 UsimDetectTaskEntry:enter 1 GPIOPhase2Init:[zc]---Usim_Detect_Gpio default level =0 2 Board Type: NezhaC MIFI DKB 2 Project Type: Nezha PCIE Dongle 3 PMIC Type: 88PM801/Ustica 4 Mode Type: LWG Only 4 BSP board type: 0x0 4 Software version: NEZHAC_CP_1.064.004 Jan 17 2021 15:26:46 5 Compilation date: Jan 17 2021 and time: 15:26:46 6 Last time is not silent reset 7 Sildnt Reset Magic =f55555d5 55155d5d 8 ======= CIU register ======= 8 0xd4282d00: 0x2 9 0xd4282d04: 0x100 9 0xd4282d08: 0x0 9 0xd4282d38: 0x0 a 0xd4282d3c: 0x0 a 0xd4282d40: 0x0 a 0xd4282d44: 0x100 b 0xd4282d48: 0x80010 b 0xd4282d4c: 0x20000 b OBM set Flash type: SPI Nand c Manufacture ID: 0xc8, Device ID: 0xc1 d SPINAND is already unprotected, protection 0x0 e sn_feature: 0x11 e Flash Type: 8, NumBlocks: 1020, BlkSize: 131072, PageSize: 2048 10 FlashManager_Init:Version= 30400 11 [BBT: 0] 11 FlashManager_Init done 11 BlockCacheCount 3, FlashBlockSize 131072 22 BMT0 Version 0x73 32 BMT1 Version 0x72 32 [Version 0x73] The next update partition 1 42 FATTable1=2, FATTable2=25, FATsecs=23, MaxClusters=6140 43 RootSector=32, SecPerClust=16, UserData=82, RootDirectory=48 44 Read guard sector 80 55 psm header size:0x20, buffer addr:0x79b0014 56 flash addr:0x40e0000 5e flash addr:0x40e0000, ddr addr:0x7138680 5e magic num:0x5a5a5a5a,0xefefefef 5f flash addr:0x4100000 67 flash addr:0x4100000, ddr addr:0x71386e0 68 blk_num:1,len:0x0 68 flash addr:0x4120000 70 flash addr:0x4120000, ddr addr:0x7138740 71 blk_num:2,len:0x0 71 flash addr:0x4140000 79 flash addr:0x4140000, ddr addr:0x71387a0 7a blk_num:3,len:0x45b 7a psm file is not NULL 7a psm_block_init, file_num is 0,blk1 is 3 7b psm_block_init psm_fdi_info[0] is 3 7c psm_block_init, file_num is 1,blk1 is 1 7d psm_block_init psm_fdi_info[1] is 1 7d psm_block_init, file_num is 2,blk1 is 2 7e psm_block_init psm_fdi_info[2] is 2 ab BOOTING COMPLETED There is also list of supported SPI NANDs in the firmware:GD5F1GQ4RBxIG – this is oursGD5F2GQ4RBxIGW25N01GWxxIxW25N02GWxxIxDS35M1GAxxZD35M1GAxxPN26Q01AWSIUGF50D1G41LBMT29F1G01ABBFD How to fix your device Download my repo with tools: https://github.com/danielkucera/tl-mr100-fix Remove the top cover of your device – I haven’t found a way to open it without breaking tabs, maybe you will have more luck than me: De-solder the flash – I use a hot plate because there is a huge GND pad on the bottom side of the flash: I use 1.27mm pin headers to conveniently plug/unplug the flash to my programmer so I always solder an adapter board and the connector. I started using a self-made WSON8 adapter board with pogo-pins. The flash is supposed to work with 1.8V VCC but it happily works on 3.3V too. Next, it’s time to dump the original NAND contents: You can use SNANDer to dump the NAND. By default, you will probably see this message because your flash is corrupted: $ ~/Apps/SNANDer/src/SNANDer -r nand-230104.bin SNANDer - Serial Nor/nAND/Eeprom programmeR v.1.7.5 by McMCC <mcmcc@mail.ru> Found programmer device: WinChipHead (WCH) - CH341A Device revision is 3.0.4 spi_nand_probe: mfr_id = 0xc8, dev_id = 0xc1, dev_id_2 = 0xc8 Get Status Register 1: 0x00 Get Status Register 2: 0x01 Using Flash ECC. Detected SPI NAND Flash: GIGADEVICE GD5F1GQ4UA, Flash Size: 128 MB READ: Read addr = 0x0000000000000000, len = 0x0000000008000000 [spinand_ecc_fail_check] : ECC cannot recover detected !, page = 0x31 spi_nand_read_page: Bad Block, ECC cannot recovery detecte, page = 0x31 Status: BAD(-1) To overcome this, you can specify -d parameter and the program will happily dump your flash: $ ~/Apps/SNANDer/src/SNANDer -d -r nand-230104.bin SNANDer - Serial Nor/nAND/Eeprom programmeR v.1.7.5 by McMCC <mcmcc@mail.ru> Found programmer device: WinChipHead (WCH) - CH341A Device revision is 3.0.4 spi_nand_probe: mfr_id = 0xc8, dev_id = 0xc1, dev_id_2 = 0xc8 Get Status Register 1: 0x00 Get Status Register 2: 0x11 Disable Flash ECC. Detected SPI NAND Flash: GIGADEVICE GD5F1GQ4UA, Flash Size: 128 MB READ: Read addr = 0x0000000000000000, len = 0x0000000008400000 Read 100% [138412032] of [138412032] bytes Elapsed time: 1118 seconds Status: OK The interface is slow so it will take several minutes. Now you need to truncate the ECC bytes which are appended after each block with: python3 cut-ecc.py nand-230104.bin This will create nand-230104.bin.noecc file. Now you can dump the config block: dd if=nand-230104.bin.noecc bs=1 skip=$((0x20000)) count=$((0x40000)) of=config-230104.bin There are actually two config blocks there: 0x20000 and 0x40000 with the same contents for redundancy. You can compare and review them using Meld with following script and try to fix potential corruptions: ./compare.sh config-230104.bin If you are happy with the contents, you can now assemble the final firmware file, erase flash and write the file to it using a script: $ ./mkfix.sh 230104 262144+0 records in 262144+0 records out 262144 bytes (262 kB, 256 KiB) copied, 0,622619 s, 421 kB/s SNANDer - Serial Nor/nAND/Eeprom programmeR v.1.7.5 by McMCC <mcmcc@mail.ru> Found programmer device: WinChipHead (WCH) - CH341A Device revision is 3.0.4 spi_nand_probe: mfr_id = 0xc8, dev_i