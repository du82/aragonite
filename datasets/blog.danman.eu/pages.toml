["https://blog.danman.eu/category/front-page"]
title = "Front page | danman's blog"
full_description = "Front page, Projects Repurposing Cisco power supplies 10. February 2025 danman 1 Comment Sometimes you can find a good deal on used power supply from various vendors. In my case it was Cisco C3K-PWR-750WAC and RPS 2300. The problem is, that they don’t output any voltage until they are plugged into device. The question is, how to fool them into thinking they are plugged in. Continue reading Repurposing Cisco power supplies → Front page, Projects, Teardown Chinese PoE extractor teardown 4. February 2025 danman Leave a comment I needed to power some cameras using Power over Ethernet but they only supported 12V input, so I ordered some PoE extractors from ali. Here they are for your information. Continue reading Chinese PoE extractor teardown → aliextractorpoeteardown Front page, Projects Hacking Wowme U300Q Car Camera to Actually Work 18. November 2024 danman Leave a comment I recently came across a Wowme U300Q car camera on an auction at aukro.cz . At first glance, it seemed like a promising piece of tech, but after trying to use it, I quickly realized there was a major flaw—it didn’t rotate recorded files and it was not just an issue with my piece, also reviews confirmed it as a global problem. For anyone familiar with dash cams, this is a critical issue because, without rotating files, the camera quickly runs out of storage and stops recording. Continue reading Hacking Wowme U300Q Car Camera to Actually Work → allwinercar camerafelghidrahacking Front page, Linux, Projects OrangePI: H264 HW encoding with ffmpeg 21. October 2017 danman 21 Comments Last days I’ve been experimenting with various features of OPI. One thing I’ve always been interested in is HW encoding. There is some information on linux sunxi wiki on this topic ([1] [2]), which say that it’s not something straightforward and opensource. Continue reading OrangePI: H264 HW encoding with ffmpeg → cedarXcedrus264ffmpegH264H3HW encodingOPIOPI Zero Front page Black thursday 28. April 2017 danman 3 Comments Hi all! Yesterday I suffered a great loss. All my data from this server went away… Unfortunately, I didn’t have recent full-backup of my blog so I needed to recreate some posts from WayBackMachine. That’s why most of pictures in posts from 2016 and 2017 is missing. Sorry for that. If you are interested in some exact pictures contact me, I can try to find them in my files. I wish you more luck with your backups. Bye!"
