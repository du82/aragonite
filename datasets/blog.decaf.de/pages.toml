["https://blog.decaf.de/2007/05/13/meiert-principles-of-art-design-and-decoration"]
title = "Meiert: »Principles of art, design, and decoration« / DECAF Blog"
description = "Web-driven software company based in Berlin and Langenberg/NRW, Germany: Design/UX, Laravel + React."
full_description = "Meiert: »Principles of art, design, and decoration« 13. May 2007 I just came across Jens Meiert‘s article about »principles of art, design, and decoration«. And, hum, as I dwell upon communication design (beside coffee and stuff) while pretty often being confronted with websites to be dolled up for barbie contest, I’d love to refer to Meiert’s statement Art hides. [..] Design reveals. [..] Anything else that doesn’t have meaning is just decoration, at most. Thank you for reducing to the max, Jens. According to your thoughts it’s been a while since I dropped this one: Design is not the website’s flowery wallpaper but the character of its content. From now on, I’ll go for the »design reveals« thing. Dirk’s Picture DirkCOF, F+E. Not sure what this is all about.Berlinhttps://decaf.de Share this post Twitter Facebook Google+"
