["https://blog.decaf.de/2007/10/12/lucida-verdana-arial-andyouregone"]
title = "Lucida: And you're gone. / DECAF Blog"
description = "Ich habe das Interesse an Lucida verloren. Und weil Verdana viel zu breit und unbeholfen steht, bleibt eigentlich nur noch die gute alte Arial übrig."
full_description = "Lucida: And you're gone. 12. October 2007 Damals war Arial. Dann kam Verdana. Und als es immer mehr Computer mit Obst gab, wurde die damit einhergehende Lucida Grande (bzw deren Windows-Pendant Lucida Sans Unicode) recht schnell zur bevorzugten Schriftart vieler mac-affinen Webautoren. Where rocking horse people eat marshmallow pies The Beatles, 1967 Wer Typografie ein bisschen ernst nimmt, stößt bei der Verwendung der Lucida auf mindestens zwei Probleme, die dadurch bedingt sind, dass sie – die Lucida – eine Systemschrift ist und damit auf manche Regeln pfeift, die anderen Schriften wichtig sind: Es gibt keinen Kursivschnitt. Trennstrich und Gedankenstrich sind gleich lang. Das klingt etwas banal, führt in der Praxis jedoch immer dann zu unschönen Ergebnissen, wenn man schief schreibt und/oder viel denkt. Mir persönlich stoßen noch weitere Merkmale auf: Der Fettdruck ist für mein Empfinden zu wenig markant, sondern geht im Fließtext unter. Sie läuft sehr groß. Kombiniert man die Lucida mit einer dicktengleichen Schrift, z.B. zur Darstellung von Programmcode, muss man letztere eigentlich grundsätzlich ein Stück größer setzen, um ein gleichmäßiges Schriftbild zu erhalten. And she’s gone. Ich habe das Interesse an Lucida verloren. Und weil man Verdana nur als 11px oder 13px unter Windows verwenden kann, während sie auf vernünftigen System viel zu breit und unbeholfen steht, bleibt eigentlich nur noch die gute alte Arial übrig. Willkommen zurück, Kleines! Wir hatten dich vermisst. Links zum Thema – natürlich bei Gerrit: Gute Lucida, schlechte Lucida – Gerrit van Aaken HTML-Schriften unter der Lupe – Gerrit van Aaken Dirk’s Picture DirkCOF, F+E. Not sure what this is all about.Berlinhttps://decaf.de Share this post Twitter Facebook Google+"
year_published = 2007
