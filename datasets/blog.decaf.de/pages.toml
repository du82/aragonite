["https://blog.decaf.de/2013/07/10/kaffeesituation"]
title = "Kaffeesituation / DECAF Blog"
description = "Kurz aufgelistet, welche Bohnen wir aktuell in der Maschine haben. Zwischen Supermarkt und Edelkaffee."
full_description = "Kaffeesituation 10. July 2013 Um es kurz zu machen: Normalerweise haben wir ja den hier: Industriekaffee; aber verdammt, was für einer! Der König unter den Schnellröstern und auf einem feineren Level als andere Bohnen, die im Supermarkt erhältlich sind. Wir beziehen ihn übrigens als Kaffeeabo von Amazon. Wenn es Standard sein soll, für den großen Durst, würde ich jederzeit den Crema Intensa nehmen. I was just remembering the last time we had a quiet drink together. I had a milkshake. Indiana Jones [to his father] Aktuell haben wir noch diese Spezialität aus Salzburg: 220 Grad heiß. »Ausgewogener, kräftiger Körper mit Geschmacksnoten nach weißer Schokolade, Mandelcreme und einem Hauch von Feige.« — Mag sein, wir trinken hier in einer Liga, in der man Feigen nicht unbedingt bemerkt. Der Kaffee aber rockt natürlich enormst und fühlt sich auch ganz anders an als der Dallmayr oben. Handgeröstet, von tiefenentspannten Ösis veredelt und mit 26,50 EUR pro kg ein echtes Schmuckstück. Und dann kam gestern der hier: Den kennt man, wenn man sich mit dem Thema beschäftigt. Tut man es nicht, wird er einem früher oder später von Leuten empfohlen, die sich mit dem Thema beschäftigen. Er ist bekannt, weil er richtig gut und dabei vergleichsweise günstig (17-19 EUR/kg) ist. Und wir so: Holy shit. Der knallt. Ehrlich, wenn du den hast, brauchst du keinen anderen mehr. This is a new experience for me. Professor Henry Jones Dirk’s Picture DirkCOF, F+E. Not sure what this is all about.Berlinhttps://decaf.de Share this post Twitter Facebook Google+"
