["https://blog.decaf.de/2007/10/15/ueber-usability-nachdenken-kaugummi"]
title = "Über Usability nachdenken: Kaugummi. / DECAF Blog"
description = "Kaugummi kann, wenn man es richtig angeht, am Ende oben zugezwirbelt und sicher in der Hosentasche verstaut werden."
full_description = "Über Usability nachdenken: Kaugummi. 15. October 2007 Ich kaue seit Jahren Kaugummi. Also nicht am Stück (flppppp), sondern immer mal wieder eins oder zwei am Tag. Und trotz dieser umfangreichen Praxiserfahrung mit dem Thema ist mir erst neulich die Erkenntnis gekommen, wie man die Anforderungen an Benutzerfreundlichkeit beim Einpacken einfacher erfüllen kann. Einpacken, genau. Beim Auspacken kann man ja nicht allzu viel falsch machen, beim Einpacken schon. Ohne sinnvolle Prozessoptimierung kann es schnell in die Hose gehen. Prozessoptimierung Keine Ahnung, wie Nielsen das sieht, aber ich empfehle, das durchgekaute Gummi zuerst in das äußere Holzpapier einzuwickeln, und dann das innere Silberpapier zu verwenden. Die Gründe dafür: das Holzpapier ist reißfester als das Silberpapier und sollte deshalb möglichst nah am Gummi sein, während das Silberpapier besser als das Holzpapier dafür geeignet ist, um den Brocken abschließend einzurollen. Es kann oben zugezwirbelt und dann sicher in der Hosentasche verstaut werden. Auspacken und Einpacken also in gleicher Reihenfolge: erst Holzpapier, dann Silberpapier. Links zum Thema: Kaugummi: ab ins Papier – ÖkoLeo Kauen: Go! Spucken: NO! – eine Kampagne in Mainz Dirk’s Picture DirkCOF, F+E. Not sure what this is all about.Berlinhttps://decaf.de Share this post Twitter Facebook Google+"
