["https://blog.decaf.de/2014/08/14/grunt-workflow-fur-redaxo-cms"]
title = "Grunt-Workflow für REDAXO CMS / DECAF Blog"
description = "Beispiel einer REDAXO-Installation innerhalb eines Grunt-Workflows."
full_description = "Grunt-Workflow für REDAXO CMS 14. August 2014 Wir haben unseren Grunt-Workflow darauf ausgerichtet, gut mit REDAXO CMS zu können. Gleichzeitig sollte er möglichst generisch sein, um auch in anderen Umgebungen zu funktionieren — etwa WordPress, Magento/OXID, Applikationen auf Basis von Laravel, kleine Websites ohne Backend — oder ganz wichtig, weil wir das häufig für extern machen: um auch mal nur Frontend zu liefern. Der Workflow ist nun seit vielen Monaten im Einsatz und schlägt sich wacker, deshalb haben wir ihn neulich in einer kleinen REDAXO-Demo auf Github veröffentlicht: → github.com/DECAF/REDAXO-Grunt-Demo Nun sind solche Grunt-Setups durchaus komplex, und es hängen diverse Komponenten dran, die erstmalig installiert und eingerichtet werden müssen (siehe README). Es handelt sich also nicht um ein Paket, das im Vorbeigehen lauffähig ist, sondern es benötigt einigen Aufwand, um es zum Laufen zu bekommen, es zu verstehen, es nützlich zu finden und — hier kommt der eigentliche Sinn der Sache: — damit effizient arbeiten zu können. This is an obsession, Dad. I’ve never understood it. Never. Neither did Mom. Indiana Jones in Indiana Jones 3 Will sagen: Eigentlich müsste man einiges dazu besprechen, Hintergründe erklären und manche Themen herausstellen, die einem schnellen Wandel unterliegen oder von Entwicklern sehr unterschiedlich gehandhabt werden, etwa: Compass ja-nein-warum, Icons als SVG oder Fonts, Autoprefixer und Browserkompatibilität, wieviel Coffee ist gesund, warum überhaupt REDAXO. Sowas halt, ihr wisst schon. Es wäre also eine Diskussion nötig, und kein schlichtes Veröffentlichen von Code und langer README. Our situation has not improved. Professor Henry Jones in Indiana Jones 3 Ping! Wer nun also Interesse an dem Thema hat, weil er/sie etwa REDAXO verwendet und die Entwicklung etwas automatisieren möchte oder ein kleines Entwicklungsteam aufbaut, gemeinsam an einem REDAXO-Projekt arbeitet oder irgendwas der gleichen plant, mag uns gerne anpingen. Stellt ruhig Fragen, macht Verbesserungsvorschläge, diskutiert Sinn und Unsinn solcher Workflows. Bei Interesse stelle ich den Workflow auch gerne mal live vor, etwa beim nächsten REDAXO-Treffen. Kontaktmöglichkeiten: Twitter: @_DECAF Github: Issues REDAXO-Forum: Diskussion (Zum Schreiben ist eine Registrierung erforderlich) E-Mail an mich: ds@decaf.de Kommentare zu diesem Blogartikel Dirk’s Picture Dirk COF, F+E. Not sure what this is all about. Berlinhttps://decaf.de Share this post Twitter Facebook Google+"
