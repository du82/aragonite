["https://blog.decaf.de/2008/10/08/reboot-2008"]
title = "Reboot ¾-2008 / DECAF Blog"
description = "Web-driven software company based in Berlin and Langenberg/NRW, Germany: Design/UX, Laravel + React."
full_description = "Reboot ¾-2008 8. October 2008 Wir mussten jetzt mal handeln. Das alte Ding stand seit fast 5 Jahren in nahezu unveränderter Form im Netz. Und nicht nur technisch gab es Veränderungsbedarf, sondern auch inhaltlich. Der wesentliche Punkt kam zu kurz: Was macht DECAF eigentlich? Wir hatten zwar alles, was wir irgendwie tun, auf der dritten (!) Navigationsebene unter »Leistungen« aufgeführt, jedoch fehlte der Fokus. Der Blick auf das, was wir besonders gut können und was wir besonders gerne tun. Und das sind eigentlich nur drei Dinge: Design, Software und Beratung. Darauf soll man uns reduzieren. Und auf das, was schon seit so langer Zeit in Arbeit ist. Mehr dazu in Kürze. www.decaf.de Dirk’s Picture DirkCOF, F+E. Not sure what this is all about.Berlinhttps://decaf.de Share this post Twitter Facebook Google+"
