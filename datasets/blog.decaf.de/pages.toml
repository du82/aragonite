["https://blog.decaf.de/2009/01/12/altgriechisch"]
title = "Spricht hier jemand Altgriechisch? / DECAF Blog"
description = "Wir benötigen Hilfe bei der Übersetzung eines WordPress-Plugins. Interesse?"
full_description = "Spricht hier jemand Altgriechisch? 12. January 2009 Brody’s got friends in every town and village from here to the Sudan, he speaks a dozen languages, knows every local custom, he’ll blend in, disappear, you’ll never see him again. With any luck, he’s got the grail already. Indiana Jones Szene Marcus Brody im Nahen Osten. Heller Anzug, weißer Hut. — »Uhhh, does anyone here speak English?« Nicht einfach, eine gute Überleitung zu finden. Es geht ganz banal darum, dass wir zwei WordPress-Plugins veröffentlicht haben, die bisher noch in wenigen Sprachen funktionieren. Weil sie aber irre wenig Text enthalten, den es zu übersetzen gilt, so dass es im besten Fall zwischen zwei Schlucken Kaffee geschehen kann, kam mir in den Sinn, die Leserschaft um Hilfe zu bitten: Mag jemand den nachfolgenden Text im blauen Kasten übersetzen? Jede Fremdsprache wird dankend angenommen, um die Plugins möglichst international zu machen. Als Gegenleistung gibt es aufrichtige Anerkennung, einen Link im zugehörigen Blogeintrag, einen Link im WordPress-Verzeichnis und eine Tasse Kaffee, wenn wir uns mal irgendwo über den Weg laufen. Hier sind die Texte: 1. Plugin Entries on page x Artikel auf Seite x ..in der Kategorie y ..zum Schlagwort y ..von y (oder) ..des Autors y ..in 2008 ..im Juni 2008 ..am 23. Juni 2008 (*) Zur Startseite (oder) Zur Startseite gehen Bitte die korrekte Schreibweise des Datums in Landesprache beachten. ==Bisher vorhanden: Deutsch, Englisch, Türkisch, Polnisch, Schwedisch, Bulgarisch, Chinesisch, Französisch, Spanisch, Russisch.== 2. Plugin mailto:staff E-Mail an jeden.. (Administrator / Herausgeber / Autor / Mitwirkenden / Angemeldeten Benutzer *) Die Benutzergruppen in der Klammer sind bereits von Haus aus in WordPress in diversen Sprachen aufgeführt (siehe SVN). Allerdings immer im Singular, und im Plugin wird der Plural verwendet. Die Übersetzung selbst wird also nicht unbedingt benötigt, aber ein Hinweis auf die typische Pluralform solcher Begriffe wäre klasse :)Von jetzt an im Singular, Danke, Flo! Bisher vorhanden: Englisch, Spanisch, Italienisch, Französisch. ==Update 13.01.08:== Das Plugin bedient sich nun direkt an den WordPress-Sprachdateien, so dass es keine eigene Übersetzung mehr benötigt. Die Benutzergruppen sind zwar im Singular aufgeführt, was nicht ganz optimal ist, aber dafür stehen nun mit einem Schlag 27 oder mehr Übersetzungen parat. Look what you did! I can’t believe what you did! - Professor Henry Jones Übersetzungen mit Link zu Deiner Website gerne direkt in die Kommentare. Vielen Dank an alle Beteiligten! Dirk’s Picture DirkCOF, F+E. Not sure what this is all about.Berlinhttps://decaf.de Share this post Twitter Facebook Google+"
