title = "Error 404, und du bist schuld! / DECAF Blog"
description = "Eine handvoll Gründe, warum die Meldung, die vom Server mit einem 404er ausgegeben wird, in der Regel weder höflich noch hilfreich ist."
full_description = "Error 404, und du bist schuld! 11. June 2007 Angeregt durch eine Diskussion in der XING-Gruppe »Webdesign und Usability« möchte ich hier eine handvoll Gründe einwerfen, warum die Meldung, die vom Server mit einem 404er ausgegeben wird, in der Regel weder höflich noch hilfreich ist. Ohne individuelle 404-Fehlerseite lässt man den Benutzer dumm darstehen: 1. …weil man ihm nicht sagt, wo er sich befindet. Der Benutzer sollte erfahren, dass er grundsätzlich schonmal das richtige Webangebot aufgerufen hat. I have introduced myself. You have introduced yourself. This is a very good conversation. Katsumoto in Last Samurai 2. …weil sonst in Maschinensprache mit ihm geredet wird und sie ihm dabei noch Fehler zujubeln: »Error«! Es gab 404 Fehler beim Aufruf dieser Seite, die zudem nicht gefunden wurde? Nicht so verkrampft, sei freundlicher im Umgang mit deinen Fehlern: Die Coolness muss [..] im Subtext mitschwingen! Kai in Lammbock 3. …weil man ihm nicht erklärt, wie es zu diesem »Fehler« kommen konnte. Einer, der mehr Ahnung hatte als ich, sagte mal: manchmal verspeist man den Bären, und manchmal wird man eben vom Bären verspeist. The Stranger in Big Lebowski Zum Beispiel so: »Vielleicht haben Sie einen nicht mehr aktuellen Link benutzt oder die Adresse der Seite (URL) falsch geschrieben.« 4. …weil man ihm keine Hilfe anbietet, den »Fehler« zu umgehen. »Falls Sie die Adresse der Seite von Hand eingetippt haben, überprüfen Sie nochmals die korrekte Schreibweise. Vielleicht war ein Tippfehler schuld.« »Falls Sie über einen Link hierher gelangt sind, ist dieser Link fehlerhaft. Vielleicht möchten Sie in diesem Fall den Zurück-Knopf des Browsers benutzen, um wieder zur Ursprungsseite zu gelangen?« Außerdem gerne gesehen: Die »Meinten Sie..?«-Funktion. Technology gets better everyday. That’s fine. But most of the time all you need is a stick of gum, a pocket knife and a smile. Nathan D. Muir in Spy Game 5. …weil man nicht offensichtlich dafür sorgt, dass der »Fehler« beim nächsten Mal nicht mehr auftaucht. Ich will eine Nachricht, dass mein Aufruf registriert wurde, und dass man sich um mich kümmert! Um die Schafe zu schützen, musst du den Wolf einfangen, und nur ein Wolf kann einen Wolf fangen. Alonzo Harris in Training Day 6. …weil man ihm auch keine Hilfe anbietet, an anderer Stelle ins Webangebot einzusteigen. Wie wär’s mit einer Navigation an dieser Stelle? Und einem Suchfeld? Oder einer Auflistung besonders häufig angefragter Inhalte? Oder.. Uns bleibt immer noch Paris. Rick in Casablanca 7. …weil man ihm keine Kontaktmöglichkeiten anbietet. Als Benutzer erwarte ich die Angabe der eMail-Adresse und der Telefonnummer des Anbieters. Nicht, weil ich ihm eine Mail schreiben oder ihn anrufen wollte, sondern allein deshalb, um das gute Gefühl zu haben, dass ich es könnte. Jedes Gestern ist nur ein Traum und jedes Morgen nur eine Vision. Also lebt das Heute so gut ihr könnt, dann wird das Gestern zu einem Traum des Glücks und jedes Morgen zu einer Vision der Hoffnung. Faceman in Das A-Team 8. …weil der Server mit ihm spricht, und nicht der Mensch dahinter. Eine Website kommuniziert nicht mit Computern, sondern mit Menschen. Also, rede mit den Usern und respektiere sie. Es gibt schon genügend computer-gesteuerte Telefon-Hotlines. Heike Edinger und Timo Wirth (hum, welcher Film?) Das alles ist denkbar ungünstig, deshalb sollten 404er-Seiten selbstredend individualisiert werden. Soviel Stress, nur um die Welt zu retten, Jimbo? Jack Wade in James Bond: Der Morgen stirbt nie Stress, Jack? Wir haben doch nicht mit viel Aufwand Liebe eine Website entwickelt, um danach eine anonyme Fehlerseite ausgeben zu lassen. Dirk’s Picture DirkCOF, F+E. Not sure what this is all about.Berlinhttps://decaf.de Share this post Twitter Facebook Google+"
