["https://blog.decaf.de/2007/06/05/kaffeestoeckchen"]
title = "»Kaffeestöckchen« / DECAF Blog"
description = "Web-driven software company based in Berlin and Langenberg/NRW, Germany: Design/UX, Laravel + React."
full_description = "»Kaffeestöckchen« 5. June 2007 Der Herr Fiene – Radiomacher, Podcastbuchautor, Allerweltsblogger und irgendwas mit Medien – hätte da mal ein paar Fragen zum Kaffee. Und wenn es um Kaffee geht, fangen wir gerne Stöckchen: Die Fragen 1. Deine erste Tasse Kaffee, wann trinkst Du sie? Morgens, irgendwann zwischen 8 und 10. Zu meiner Schande muss ich gestehen, dass »Kaffee« an dieser Stelle oft nur ein kaffeeartiges Instantgetränk bedeutet. Denn die echte Kaffeekultur pflege ich morgens nur dann, wenn es auch Frühstück dazu gibt. Und Frühstück an Werktagen wird überschätzt. 2. Wieviele Tassen trinkst Du täglich? Zwei bis drei. Den zweiten gerne nach dem Mittagessen, cappuccino-like stark und intensiv. Den dritten oft spät abends, dann aus psychologischen Gründen meist entkoffeiniert. Koffein ist ein Nervengift, und Schlaf an Werktagen wird unterschätzt. 3. Koffeinfrei oder Bohnenkaffee? Diese Frage ist.. — Kaffee sollte immer Bohnen sein, egal ob mit oder ohne Koffein. Koffein ist übrigens vollkommen geschmacksneutral und hat deshalb keinen Einfluss auf das Aroma des Kaffees. Der noch immer schlechte Ruf koffeinfreier Kaffees liegt darin begründet, dass man lange Zeit nicht in der Lage war, das Koffein heraus zu bekommen, ohne dabei nicht auch wichtige Aromastoffe mit zu entfernen oder negativ zu beeinflussen. Inzwischen hat man das sehr gut im Griff (»Und wer chats erfunden?«), so dass man den Koffeinfreien nicht grundsätzlich verteufeln sollte. 4. Zucker, Milch oder Sahne? Unbedingt Milch, gerne auch Zucker. Ich trinke Kaffee nicht allzu heiß, weil er leicht abgekühlt intensiver schmeckt, deshalb darf ruhig kalte Milch hinein. Ich finde, dass jede Art von Lebensmittel ihren Geschmack verliert, wenn man sie zu heiß serviert. 5. Deine bevorzugte Zubereitungsart? In der French Press (»Pressstempelkanne«). Daraus bekommt man das intensivste Aroma, deshalb werden sie gerne auch für Kaffeeverkostungen verwendet. Eine French Press erzeugt recht dicken Kaffee und hinterlässt Kaffeesatz (»Prütt«) am Boden der Kanne, hat also einen anderen Charakter als der in Deutschland bevorzugte Papierfilterkaffee. Genau diese Schlieren vom Kaffeesatz sind mein persönliches Highlight beim letzten Schluck aus der Tasse, weil sie besonders intensiv sind. Bei der Zubereitung mit einer French Press beachten: das Material muss grob gemahlen sein, das Wasser darf nicht mehr kochen, und die Kanne soll 4 Minuten ziehen, bevor man den Stempel drückt. 6. Mit wem geniesst Du Deinen Kaffee am liebsten? 7. Deine Lieblingsmarke? Zurzeit Coffeemamas’ House Blend, und vermutlich wird sich das in nächster Zeit nicht ändern. Siehe auch »Still in love with..« Grundsätzlich neige ich zu lateinamerikanischen und indonesischen Bohnen, während mir afrikanische Bohnen zu säurebetont (noch positiver ausgedrückt: lebhaft) sind. 8. Wo trinkst Du Deinen Kaffee vorzugsweise? In einer entspannten Umgebung und aus der Absicht heraus, es bewusst zu tun. Auf keinen Fall unbedacht trinken: Kaffee ist ein jahrhundertealtes Luxusgut, damit macht man keine Scherze. 9. Wie sieht Deine Lieblingstasse aus? 10. Espresso, Cappuccino oder Latte Macchiato? Cappuccino. Espresso ist zu Kaffee, Latte Macchiato ist zu Milch. 11. Bevorzugte Tätigkeit beim Kaffeetrinken? Genießen. Alles andere wäre Quatsch :) Links zum Thema Was ich sonst noch über Kaffee zu sagen habe, steht längst im Top 5-Blog: »Fünf Fehler bei der Kaffeezubereitung« »Verhalten im Coffee House« »Verhalten im Coffee House, Teil 2« »Orte, an denen man Kaffee trinken kann« »Kaffee to go mit möglichst hippen Namen« Fragen an andere Die Fragen sollen an drei Leute weitergereicht werden. Ich frage: Die Herren Gigold und Große, weil ich gespannt bin, wie ihre Kaffeeversorgung im neuen Büro aussieht. Jeena Paradies, weil ich hoffe, dass man in Schweden interessant klingendes Gebäck zum Kaffee reicht. Jens Grochtdreis, weil ich mit ihm bereits meine längsten Onlinekaffeegespräche ever gehalten habe, und weil Kaffeestandards genauso spannend sind wie Webstandards. Falls er lieber drüber reden möchte, anstatt zu schreiben, fliegt das Stöckchen auch zu David Maciejewski und der Technikwürze. Die nächste Sendung mag dann vielleicht Cookies dazu behandeln ;) Dirk’s Picture DirkCOF, F+E. Not sure what this is all about.Berlinhttps://decaf.de Share this post Twitter Facebook Google+"
