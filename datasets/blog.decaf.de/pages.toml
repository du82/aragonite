["https://blog.decaf.de/2017/07/09/redaxo-mit-docker"]
title = "REDAXO mit Docker 🐳 / DECAF Blog"
description = "Einfaches 🐳 Docker-Setup für REDAXO-Entwicklung. Mit Demo-Website und Anleitung für Einsteiger_innen!"
full_description = "REDAXO mit Docker 🐳 9. July 2017 Falls ihr schon immer REDAXO testen wolltet, bisher aber keine Zeit oder Lust hattet, eine Entwicklungsumgebung einzurichten, das Setup zu durchlaufen und eine Demo zu installieren, könnt ihr mal unser Docker-Setup benutzen, das wir neulich bei Friends Of REDAXO veröffentlicht haben. Das Paket ist sehr ausführlich dokumentiert und soll vor allem auch eine Hilfe für Einsteiger_innen 🚀 sein, die noch keine Docker-Erfahrung mitbringen. Mit ganz wenig Aufwand habt ihr am Ende eine schicke Entwicklungsumgebung mit einem lauffähigen REDAXO CMS, das eine umfangreiche Website-Demo implementiert hat: Das Paket eignet sich also für Leute, die mit Docker rumspielen wollen, und für Leute, die mit REDAXO rumspielen wollen. Wer beides will, bekommt den Jackpot! 🎉 Kurzanleitung in 3 Schritten Installiere Docker für dein System. Falls du Windows 7 benutzt, brauchst du die Docker Toolbox. In der Docker-Konfiguration musst du die Ordner freigeben, mit denen Docker arbeiten darf. Benutze docker-compose up -d. Damit wird Zeug aus dem Netz geladen und ein Haufen Text durch deine Konsole laufen. Wenn der Eingabe-Prompt wieder erscheint, wurden deine Docker-Container gestartet, jedoch ist REDAXO noch nicht fertig. Warte einfach noch 1-2 Minuten… REDAXO ist im Browser erreichbar unter http://localhost:20080. In den REDAXO-Adminbereich kommst du über http://localhost:20080/redaxo mit den Logindaten admin/admin. Infos und Hilfe Ausführliche Informationen erhälst du auf der Projektseite: https://github.com/FriendsOfREDAXO/redaxo-mit-docker Falls du Hilfe brauchst, Fragen hast oder allgemein an REDAXO interessiert bist, besuche am besten den Slack-Chat. Eine Einladung zum Slack bekommst du hier: https://redaxo.org/slack/ Dirk’s Picture DirkCOF, F+E. Not sure what this is all about.Berlinhttps://decaf.de Share this post Twitter Facebook Google+"
