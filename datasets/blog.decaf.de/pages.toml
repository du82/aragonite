description = "Mit der Berliner Morgenpost haben wir eine Anwendung entwickelt, um die liebsten Orte der Leserinnen und Leser zu sammeln: Bars, Cafés, Restaurants, Spätis u..."
full_description = "Morgenpost: Unsere Lieblingsorte 31. October 2024 Vor rund einer Woche hat die Berliner Morgenpost begonnen, die liebsten Orte ihrer Leserinnen zu sammeln: Bars, Cafés, Restaurants, Spätis und andere. Wir haben mit der Redaktion die Anwendung entwickelt und sind ein bisschen stolz darauf, dass alles so gut geklappt hat: orte.morgenpost.de 💚 Es kann jeden Tag abgestimmt oder ein neuer Ort vorgeschlagen werden. Ganz schlicht und nur auf Basis von Cookies und Cloudflare, denn es soll vor allem Spaß machen. Die Betreiberinnen können einen Handzettel mit QR-Code ausdrucken und vor Ort anbringen, damit die mobile Kundschaft schnell voten kann. Für das Setup haben wir viel ausprobiert und wie immer viel dabei gelernt. React mit Next.js Tailwind für CSS Teile von HeadlessUI, Radix UI und shadcn/ui für die UI Refine mit MUI im Adminbereich Supabase mit PostgreSQL im Backend Ihr habt so leckeres Essen wir bringen Oma Dirk’s Picture DirkCOF, F+E. Not sure what this is all about.Berlinhttps://decaf.de Share this post Twitter Facebook Google+"
