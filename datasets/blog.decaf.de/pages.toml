["https://blog.decaf.de/2008/06/17/musik-auf-websites-def-leppard-gegen-die-message"]
title = "Musik auf Websites: Def Leppard gegen die Message. / DECAF Blog"
description = "Web-driven software company based in Berlin and Langenberg/NRW, Germany: Design/UX, Laravel + React."
full_description = "Musik auf Websites: Def Leppard gegen die Message. 17. June 2008 In einem Gespräch im SELFHTML-Forum geht es gerade darum, ob und in welcher Form es sinnvoll ist, Musik auf Websites einzubinden, die beim Betreten einer Seite automatisch abgespielt wird. Meinungen wie die nachfolgende sind dabei naheliegend: Autostart darf im Web meiner Meinung nach nie [..] sein. Stell dir vor, ich höre gerade (sehr laut) Musik und plötzlich dudelt da irgendetwas anderes rein.. Kai345 Das ist allerdings ein Pauschalurteil, gekennzeichnet durch Marker wie »nie« oder »immer«. Und natürlich sind Pauschalurteile immer schwierig, so dass meine Antwort – unabhängig von der lauten Musik – obligatorisch war: Wäre ich DJ, Musiker oder z.B. Betreiber eines Musikevents, würde mich deine Musik herzlich wenig interessieren. Wenn du meine Website betrittst, gehe ich schlicht davon aus, dass du was von mir möchtest, nicht ich von dir. Und falls dabei deine Aufmerksamkeit beeinträchtigt ist, weil du nebenbei Def Leppard hörst, ist das nicht mein Business (im doppelten Sinne). Schuer (Anm.: Der Autor dieses Blogeintrags) Den Teil »[..] gehe ich schlicht davon aus, dass du was von mir möchtest, nicht ich von dir« kann man als arrogant oder ignorant ansehen, jedoch thematisiert er einen Punkt, der aus meiner Sicht oft vernachlässigt wird: Es sind nicht nur Nutzererwartungen zu erfüllen, sondern auch die Erwartungen des Inhaltsanbieters. Und die können durchaus überwiegen. In der Praxis tun sie es ständig. Wer will jetzt also was von wem? Du willst (auf der Website als Anbieter) Besucher. Kai345 Nicht ganz. In den meisten Fällen will ich einfach ein Ziel erreichen, dessen Gelingen aber in der Tat meist von der Menge, der Aktivität oder des Interesses meiner Besucher abhängt. Als Betreiber eines Webshops wird mein Ziel vermutlich sein, möglichst viel Umsatz zu machen. Das setzt gewillte Besucher voraus, die es zu hofieren gilt: Mein Webangebot sollte bestmöglichen ihren Erwartungen entsprechen, sollte erfassbar und benutzbar sein, fehlerfrei funktionieren und alles vermeiden, was meinem Ziel im Wege stehen könnte. Def Leppard etwa. Ich würde als Betreiber an dieser Stelle auf Fahrstuhlmusik verzichten, ganz bestimmt. Was ist aber, wenn ich nicht darauf abziele, Massen zu beglücken? Wenn mein Angebot speziell ist und ich den Teufel tun würde, es für die Allgemeinheit zu verbiegen, mich anzubiedern oder sogar jemanden zu hofieren? Was ist, wenn ich der Sender bin und sich die Qualität meines Angebots darüber definiert, dass es eine tiefe statt einer breiten Wirkung erreicht? Und was ist, wenn es hier allein um meinem Style oder meine Message geht, deren feste Absicht Eigenständigkeit statt Massentauglichkeit ist? Ich habe eine Message, die es zu kommunizieren gilt. Ich brauche Aufmerksamkeit dafür, kein Def Leppard. Schuer (Anm.: Der Autor dieses Blogeintrags) Als Inhaltsanbieter wäre mir der Aufruf meiner Website durch den Besucher vermutlich ein ausreichend triftiger Grund dafür, meine Nachricht anzubringen. Und wenn sie laut ist, dann ist sie eben laut. Und wäre ich Coldplay, würde meine Website gerade Viva La Vida spielen. Wieder keine richtige Essenz? Mir ging es vor allem um Pauschalurteile. Meine Essenz ist, sie zu vermeiden. Was alles andere angeht — Technische Hintergründe zum Einbinden von Musik in Websites, konzeptionelle Überlegungen zum Autostart oder Def Leppards Frisuren — gilt wie gewohnt: Wir sind das Web. Eine Auseinandersetzung ist gewollt! Diskussion gerne hier und im Selfforum. Dirk’s Picture DirkCOF, F+E. Not sure what this is all about.Berlinhttps://decaf.de Share this post Twitter Facebook Google+"
