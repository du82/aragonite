["https://blog.decaf.de/2019/02/27/jobs-laravel-in-berlin-westfalen-oder-remote"]
title = "Jobs: Laravel in Berlin, Westfalen oder remote / DECAF Blog"
description = "Wie cool wäre es, wenn du genau die richtige Person bist und das hier liest!"
full_description = "Jobs: Laravel in Berlin, Westfalen oder remote 27. February 2019 (Wie cool wäre es, wenn du genau die richtige Person bist und das hier liest!) Position: Laravel-Entwicklung Wir benutzen ein einheitliches Setup für alle Projekte. Es besteht aktuell aus einem Laravel-Backend, das über eine REST-API mit einem React-Frontend kommuniziert. Du würdest das Team mit deiner Laravel-Erfahrung unterstützen. Es geht anfangs vor allem darum, die API mit Endpunkten auszustatten, Schnittstellen zu externer Software zu entwickeln und verschiedenste Prozesse abzubilden. Ort: Berlin, Westfalen oder remote Wir sind ein kleines Team, nur eine Handvoll Leute, allerdings an zwei Standorten: Berlin und Langenberg im Kreis Gütersloh. Wir können auch gerne remote zusammenarbeiten, das klappt seit vielen Jahren gut. Allerdings wäre es praktisch, wenn du höchstens 2–3 Zugstunden entfernt lebtest, dann können wir uns regelmäßig gemeinsam treffen (meistens in Berlin). Erfahrung: Intermediate? Erfahrung ist nicht immer leicht einzuschätzen. Das Ding ist, unser Setup ist nicht ganz einfach. Diverse Docker-Container mit Datenbanken, S3, ElasticSearch und Krams. Dazu Laravel mit API, Tokens, Testing. Oben drauf React, Redux, Saga. Drumrum ein CI-Workflow. Alles kein Hexenwerk, aber es braucht ein ganzes Weilchen, um sicher hinein zu finden. Wenn du dich mit so einem Setup auskennst oder bereits in einer ähnlichen Umgebung gearbeitet hast: Großartig, lass’ uns sprechen! Wenn du dich allgemein ganz gut auskennst, vor allem etwas Laravel-Erfahrung mitbringst, bei dem oben genannten Rest aber unsicher bist: Keine Sorge, genau richtig! Du wirst es lieben, den Rest kennenzulernen, und wir helfen nur zu gerne dabei. Lass’ uns unbedingt sprechen! 🤙 Zeit: 50–100% Unter 50% wäre zu wenig für diese Art von umfangreichen Projekten, mehr als 100% geht nicht. Alles dazwischen ist fein für uns, du entscheidest! Verhältnis: Festanstellung Wir wollen dich fest im Team! Und wir haben gemeinsam noch viel vor. Freelance würde an dieser Stelle leider nicht passen. Wir freuen uns, dich kennenzulernen! Bewerbungsunterlagen sind nicht notwendig, schreib am besten einfach eine E-Mail an jobs {ät} decaf.de mit kurzer Info über dich und zu den oben genannten Punkten. ✌️ Dirk’s Picture DirkCOF, F+E. Not sure what this is all about.Berlinhttps://decaf.de Share this post Twitter Facebook Google+"
