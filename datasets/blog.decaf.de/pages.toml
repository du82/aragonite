["https://blog.decaf.de/2008/05/20/dienstleister-clapton-hendrix"]
title = "Über Dienstleister, Clapton und Hendrix: Nothing else matters. / DECAF Blog"
description = "Denke nicht, zu wissen, was das Beste ist, solange du nicht zumindest mit Leuten wie Eric Clapton oder Jimi Hendrix darüber gesprochen hast."
full_description = "Über Dienstleister, Clapton und Hendrix: Nothing else matters. 20. May 2008 Ein Internetdienstleister – egal ob Einzelkämpfer, kleines Team oder Global Player – weiß für gewöhnlich sehr gut, was für seinen Kunden das Beste ist. Und falls er es nicht ganz genau weiß, hat er zumindest eine starke Vermutung, ein Bauchgefühl oder ein kompetentes Engel-Teufel-Duo auf den Schultern, das handfeste Infos vom Besten für den Kunden zuflüstern kann. Vermutung, Bauchgefühl, Engel und Teufel sind die Kompetenz und die Erfahrung eines Dienstleisters. Vergleiche. Will man möglichst treffend einschätzen, was das Beste ist, helfen Vergleiche: was kann ich selbst und was können andere. Schon als Kind lernt man zu vergleichen. Man müsste das Thema an dieser Stelle weiter ausbreiten und vielleicht von Beobachtungen erzählen, dass Gitarristen sehr schnell in Versuchung kommen, ihr Spiel mit Eric Clapton oder Jimi Hendrix zu vergleichen, und dass das Intro von Metallicas ‘Nothing else matters’ einfach genug zu sein scheint, um an tausenden von Lagerfeuern angeklampft werden zu können.. Wenn ich aber das Beste für diesen Artikel will, weiß ich hoffentlich, dass es andere Leute gibt, die das Thema mit den Vergleichen viel besser erklären und darstellen können als ich. Und eigentlich wollte ich auch von Anfang an nur auf diese eine Sache hinaus: Es ist für alle Beteiligten eines Internetprojekts schwierig, das Beste herauszufinden und zu realisieren. Forumsdiskussion: »Die finden das alle ganz toll« Anlass für diesen Artikel war eine Diskussion (ff.) im Forum »Webdesign und Usability«, in der folgendes gesagt wurde: Ich glaube, dass ein kurzes Beratungs- und Briefinggespräch jedes Projekt auf den Punkt bringt. Solche Aussagen hört und liest man häufig, jedoch möchte ich gerne mal dagegen halten, dass ein Beratungsgespräch in erster Linie das macht: Die Anforderungen und Erwartungen des Kunden mit den Möglichkeiten des Dienstleisters abgleichen. Ob und in welcher Form danach ein Projekt auf einem Blatt Papier steht, hängt von so vielen verschiedenen Faktoren ab, dass man vermutlich sagen kann: mische 10 Kunden mit 10 Dienstleistern, und du erhälst 100 verschiedene Projekte. Darauf aufbauend folgendes Thema: Das Thema »Wie sage ich meinem Gegenüber, dass sein jetziger Internetauftritt scheiße ist« Gute Frage. Alleine kann sie jedoch schwerlich stehen. Bitte auch diese beachten: Bin ich/sind wir in der Lage, einzuschätzen, ob der Internetauftritt wirklich scheiße ist? Wie definiert sich »Scheiße« und welche Meinungen sind relevant, um die Scheiße möglichst genau zu definieren? Finden die Nutzer den Internetauftritt auch so scheiße? Werden wir in der Lage sein, zusammen mit dem Kunden einen besseren Internetauftritt zu konzipieren und zu realisieren? Werden die Nutzer den neuen Internetauftrag dann auch besser finden? und: Was passiert, wenn danach ein anderer Dienstleister diesen neuen Internetauftritt scheiße findet? Gehe zurück zu »Los« und konzipiere einen neuen Internetauftritt? Essenz oder sowas? Kaum. Für Dienstleister vielleicht das hier: Denke nicht, zu wissen, was das Beste ist, solange du nicht zumindest mit Leuten wie Eric Clapton oder Jimi Hendrix darüber gesprochen hast. Und: wenn du das Intro von ‘Nothing else matters’ spielen kannst, bist du zumindest auf dem richtigen Weg. Dirk’s Picture DirkCOF, F+E. Not sure what this is all about.Berlinhttps://decaf.de Share this post Twitter Facebook Google+"
