full_description = "Entries on page x 2. December 2008 The WordPress plugin Entries on page x generates a link back to the archive page the current entry is on and makes it easier for users to retrieve the chronology of a blog. Examples (without function): Entries on page 12 Entries on page 1 of category »WordPress« Entries on page 4 for tag »Plugins« Entries on page 2 by John Doe Entries on page 9 from August 2008 Live demo (Update: This blog doesn’t use WordPress any more but Ghost now.) If you read this entry as a single post page, you will see the »Entries on page x«-Link above the entry. The wording depends on the type of refering page (Requires cookies!). The Plugin detects categories, tags, authors and dates. Quick demos: Call the archive page for 2 December 2008 and select this entry again. The link will be »Entries on page 1 for 2 December 2008«. Select this entry on the archive page for tag »WordPress«, and the link will be »Entries on page x for tag WordPress«. Download and further information Get further information and the current download version at the WordPress Plugin Directory. Thanks for your feedback! Dirk’s Picture DirkCOF, F+E. Not sure what this is all about.Berlinhttps://decaf.de Share this post Twitter Facebook Google+"
