["https://blog.decaf.de/2008/06/14/zugaenglichkeit-im-webdesign-gva"]
title = "Zugänglichkeit im Webdesign, GvA / DECAF Blog"
description = "Web-driven software company based in Berlin and Langenberg/NRW, Germany: Design/UX, Laravel + React."
full_description = "Zugänglichkeit im Webdesign, GvA 14. June 2008 Schöner Satz Zwei schöne Sätze des Tages heute von Gerrit van Aaken zum Thema »Zugänglichkeit im Webdesign«: Nun, ich tue mir zunehmend schwerer damit, mich als wahrhaft kompetenten Ansprechpartner für Fragen der Zugänglichkeit zu bezeichnen. Es ist ein bisschen wie in der Biochemie: Je mehr man weiß, desto weniger weiß man! Gerrit van Aaken Zugänglichkeit im Web ist ein Interdisziplinär-Ding, man kommt dabei als Spezialist für Irgendwas nicht weit. Man muss Besserwisser sein – gerne positiv gesehen –, um das Thema überhaupt erfassen zu können, und man wird dennoch immer wieder ratlos an die Wand gestellt werden, wenn sich Praxissituationen ergeben, mit denen man nicht gerechnet hat. Trotzdem: Ich bastele auf meine Weise weiter am zugänglichen Web und hoffe auf weitere spannende Diskussionen und Erkenntnisse. Gerrit van Aaken Um es nochmal auf den Fußball zu übertragen: Wir brauchen auch weiterhin 82 Millionen Bundestrainer, um Taktiken für Zugänglichkeit zu erarbeiten. Gewinnen ist nunmal kein Zustand, sondern ein fortlaufender Prozess. Danke für die Aufmerksamkeit. Zurück zu Gerrit: Zugänglichkeit im Webdesign – es bleibt schwierig! Dirk’s Picture DirkCOF, F+E. Not sure what this is all about.Berlinhttps://decaf.de Share this post Twitter Facebook Google+"
