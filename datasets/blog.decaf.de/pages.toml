["https://blog.decaf.de/2023/12/22/jobs-php-laravel-in-berlin-westfalen-oder-remote"]
title = "Jobs: PHP + Laravel in Berlin, Westfalen oder remote / DECAF Blog"
description = "Andere nennen den Bereich auf ihrer Website »Karriere«. Wir sehen das etwas gelassener."
full_description = "Jobs: PHP + Laravel in Berlin, Westfalen oder remote 22. December 2023 Andere nennen den Bereich auf ihrer Website »Karriere«. Wir sehen das etwas gelassener. Setup: PHP mit Laravel Wir benutzen ein einheitliches Setup für alle Projekte. Es besteht aktuell aus einem Laravel-Backend, das über eine REST-API mit einem React-Frontend kommuniziert. Deine Aufgabe ist, das Backend zu betreuen und aktuell zu halten, neue Endpunkte oder Hintergrund-Jobs zu implementieren, externe Dienste anzubinden und Unit-Tests zu schreiben. Natürlich nicht alleine, sondern im Team. Wir machen alles zusammen und kriegen das hin! Die Projekte übrigens sind sehr unterschiedlich: Mal geht es um Kundengarantien im ÖPNV, mal um Hochwasser und Niederschläge. Fundsachen. Erstattungen. Kunden-Management und so weiter. Und unsere Kunden sind enorm nett, alle. Ort: Berlin, Westfalen oder remote Wir sind ein kleines Team, nur eine Handvoll Leute, allerdings an zwei Standorten: Berlin und Langenberg im Kreis Gütersloh. Wir können auch gerne remote zusammenarbeiten, das klappt seit vielen Jahren gut. Falls du also lieber Zuhause oder einem anderen Ort bist, ist das wirklich kein Problem. 🎧 Zeit: 50–100% Unter 50% klappt nicht so richtig gut, mehr als 100% geht nicht. Alles dazwischen ist fein für uns, du entscheidest! Erfahrung: Zwischen »Junior« und »Intermediate« Nicht so einfach zu definieren, oder? Du brauchst jedenfalls kein Studium, keine Zertifikate und keine jahrelange Agenturerfahrung. Was du brauchen wirst, ist ein gutes Verständnis von PHP und Laravel. Und sicherlich auch SQL. Alles andere erarbeiten wir uns gemeinsam. Gehalt: 32–45k Große Unternehmen und Startups mit VC im Rücken können dir mehr Geld bieten. 💸 Aber bei uns wirst du es besser haben. Keinen künstlichen Stress, no bullshit. Wir möchten uns allen ein faires Gehalt zahlen, und der oben genannte Wert ist vor allem eine grobe Hausnummer zur Orientierung. Perspektive: 🍀, 🚀, 🐿️ Aktuell geht es um folgendes: Lass uns zusammen die vorhandenen Projekte weiter treiben und neue Projekte an den Start bringen. Das Setup funktioniert gut, und die Kunden sind glücklich. Nebenbei möchten wir ein kleines Startup gründen, das sich technisch etwas anders orientiert. Deine Perspektive: Du wirst dich weiterentwickeln und viel lernen. Mehr Verantwortung übernehmen, wenn du magst. Eigenständig arbeiten, aber nicht alleine sein. Ein gutes Team um dich herum haben, das gerne weiter wachsen soll. Und vielleicht etwas ganz Neues aufbauen. Wir freuen uns, dich kennenzulernen! Bewerbungsunterlagen sind nicht notwendig. Schreib mir, Dirk, am besten einfach eine E-Mail an ds {ät} decaf.de mit kurzer Info über dich. ✌️ Dirk’s Picture DirkCOF, F+E. Not sure what this is all about.Berlinhttps://decaf.de Share this post Twitter Facebook Google+"
