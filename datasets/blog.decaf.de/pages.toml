["https://blog.decaf.de/2007/11/23/kommunikation-in-webprojekten-barrierefrei"]
title = "Kommunikation in Webprojekten: barrierefrei. / DECAF Blog"
description = "Web-driven software company based in Berlin and Langenberg/NRW, Germany: Design/UX, Laravel + React."
full_description = "Kommunikation in Webprojekten: barrierefrei. 23. November 2007 Webprojekte basieren auf Zusammenarbeit. Und die wichtigste Zutat ist dabei wie so oft: Kommunikation. Es geht um Kennenlernen, Interesse, Vertrauen, Respekt, Austausch, Verständnis, Motivation und ein gemeinsames Ziel – meist in eben dieser Reihenfolge. Wer dabei Barrieren vermeiden möchte, kann gleich mit der ersten beginnen – Kennenlernen –, ohne Punkt 4 zu missachten – Respekt. Und welche Hürde ist gemeint? Die Nachnamen. Die sind in der Regel weniger geläufig als Vornamen. Aber es geht gar nicht allein darum, wie schwierig sie zu merken sind, sondern welchen Abstand sie schaffen, vor allem in einer Gruppe: mein Stuhl, mein Platz, mein Nachname. Da könnt ihr – Entschuldigung, können Sie – alle rundherum noch so nett sein und eure Ihre Arme nicht verschränken. Zuviel Abstand. Und obwohl wir Visitenkarten getauscht haben und zwei von uns Müllermeierschmidt heißen, stehen für ein Weilchen vielleicht noch drei bis sieben fremde Nachnamen im Raum, die die Kommunikation drosseln. Das »Hamburger Sie« Der barrierefreie Ansatz von Erstkommunikation – Achtung, jetzt kommt die Essenz dieses Postings – basiert auf dem »Hamburger Sie« (kurz zuende lesen, dann klicken) und führt in der Regel gleich dorthin, wo wir hin müssen: Guten Tag, liebe Geschäftspartner. Ich bin Dirk, das ist Stefan. Wo geht’s zum Projekt? Dirk’s Picture DirkCOF, F+E. Not sure what this is all about.Berlinhttps://decaf.de Share this post Twitter Facebook Google+"
year_published = 2007
