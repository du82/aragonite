full_description = "Still in love with.. 26. April 2007 Said this about 2 years ago when they asked my about my love (to CSS): His favorite beans come from Indonesia (he loves Sumatra and Sulawesi).. Times are a-changin’: forget about my indonesian beans. Actually, they are nice.. bold and intensive, earthy aroma, virtually no acidity. Sulawesi ist gorgeous. But I am back on the latin american side of life right now and in love with coffeemamas. Located in the heart of Berlin they do hell of a coffee. Didn’t taste their decaf yet, but I got to sip about eleven coffees all-around, and the House Blend (the latin americans mentioned above) turned out to be my personal Jamaican Blue Mountain. Thank god it’s friday coffee! (This is not advertising but enthusiasm. It’s not getting coffee for free but sharing my love.) Dirk’s Picture DirkCOF, F+E. Not sure what this is all about.Berlinhttps://decaf.de Share this post Twitter Facebook Google+"
