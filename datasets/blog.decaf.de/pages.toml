["https://blog.decaf.de/2008/07/10/10-jahre-selfhtml-forum-meine-visitenkarte"]
title = "10 Jahre SELFHTML-Forum: Meine Visitenkarte / DECAF Blog"
description = "Zum 10-jährigen Jubiläum des SELFHTML-Forums: SELF-Visitenkarte von Dirk Schürjohann."
full_description = "10 Jahre SELFHTML-Forum: Meine Visitenkarte 10. July 2008 Hin und wieder mal werde ich gefragt, was ich eigentlich im SELFHTML-Forum mache. Oft auch: Was ich eigentlich noch immer dort mache (Ergänze: , wo es doch so viele andere Dinge zu tun gibt). Aus technischer Sicht würde ich sagen: Ich verbringe dort sehr gerne meine Kaffeepausen und versuche, immer dann, wenn Zeit, Lust und Thema es erlauben, einen hilfreichen Senf abzugeben. Aus konzeptioneller Sicht hänge ich an Gewohnheiten und den vielen netten Menschen, die ich im Laufe der Zeit neben wenigen weniger netten Menschen getroffen habe. Das ist ein bisschen wie die Blogwelt, also die »Blogosphäre«, nur anders. Oder auch wie das Usenet, nur anders. Wie twittern, nur anders. Es ist vermutlich wie im echten Leben draußen: Man fährt gemeinsam in der Straßenbahn zur Arbeit, und wenn die Themen nett waren, nimmt man gerne wieder die Bahn. Das SELFHTML-Forum steht nun kurz vorm 10-jährigen Jubiläum, und auf der Suche nach Material ist mir eben meine SELF-Visitenkarte — Zeitraum 2000 bis 2004 — in die Finger gekommen. Ich möchte sie mal hier veröffentlichen, denn dies ist der richtige Platz für persönliche Selbstdarstellungen, und SELFHTML gehörte ganz selbstverständlich zu meiner Webentwicklung dazu. (Wenn überhaupt, dann interessiert das nun Nachfolgende allenfalls langjährige Teilnehmer des SELFHTML-Forums. Alle anderen können wieder twittern oder sowas..) SELF-Visitenkarte von Dirk Schürjohann Geriet erstmals 1999 als Leser an den Self-Biotop. Erste Postingversuche im Mai 2000, zu der Zeit noch mit Netscape 4 und als echter Newbie unterwegs. Befasste sich danach intensiv mit Mausrädchen, unterdrückten Quelltexten, der STRG-Taste und zwei Frames gleichzeitig. Lernte den Umgang mit LaTeX, RegExps und Tabellen (1, 2). Wurde auffällig durch die Züchtung von n00bs und gesteigertem Interesse an Britney Spears oder kleinen Smarts. Entdeckte den geheimen Pro-Account, förderte den Inner Circle (1, 2, 3) und kämpfte an der alten Eiche. Isst bei McDonald’s, liest zwischen den Zeilen, postet selten im Heise-Forum und guckt keinen Sport. Fand in Bio seinen Grillmeister, in Orlando einen würdigen Headbanger und in Arthur P. jemanden, der geht. Weitere Vorbilder sind Steven Spielberg und Crocodile Dundee. Stellt keine Fragen über den Sinn des Lebens, hat ein gestörtes Verhältnis zu Seitenbewertungen (1, 2, 3, 4), der Entwicklung des Webs (1 ff, 2) und der Leistung des W3C. Gilt als praktischer Theoretiker mit Vorliebe für Kaffee (1, 2, 3, 4). Ach, und Chräcker: danke für den leckeren Parmesan! Dirk’s Picture DirkCOF, F+E. Not sure what this is all about.Berlinhttps://decaf.de Share this post Twitter Facebook Google+"
