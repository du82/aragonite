["https://blog.dnsimple.com/2016/10/the-villains-of-remote-work"]
title = "The Villains of Remote Work - DNSimple Blog"
description = "Remote work and small teams come with their own challenges, these are some of mine."
full_description = '''Ditch the manual DNS configurations. Join our webinar to learn how to automate your DNS infrastructure with DNSimple's Terraform Provider! Working remotely is awesome. It's how DNSimple operates. There's no office, there are no working hours, there is nowhere you need to be, there's no commute, and no line for the bathroom. You're free to work when you want, how you want, and from wherever you want. Working on a small team is awesome. It's how DNSimple operates. There are no deadlines, there are no managers, there is no disconnect between the development and the business, and no HR department. You're free to contribute wherever it's effective, you get to know your coworkers well, you develop your own workflow, and you're held accountable by your commitment to your team and forward progress. Both core aspects of DNSimple, being a small remote team is a wonderful combination, but it's one that opens itself up to unexpected vulnerabilities. Much like how when a superhero makes their appearance, villains inevitably follow…being part of a small team that works remotely is a superpower that draws in super-villainy. The Faceless themselves are not evil, but I'm sure you can imagine it's still horrifying to look at something that doesn't have a face. Allow me to explain. On my first day, I was extended a bunch of warm welcomes by the team upon signing in to our Slack channel. I got to say hi to everyone and get a sense of how active the channel is at 10:30AM CST. Once the greetings were out of the way, though, is when I realized had no idea who these people were. Generally speaking, when you're put into a new environment it's fairly easy to tell how you can start making friends. You approach people based on visual queues that let us as humans know "you can say hello and ask me stuff!", or inversely, "if you interrupt my train of thought right now I will cry.". This is a skill that people train every day they talk to someone, it's a huge part of the core makeup of what it means to be an animal with thumbs, and it was in the moments after the last "welcome @arnamak!" that I realized: this skill I've relied on through countless cross-country moves, new schools, and new jobs, was not in my toolbelt.'''
year_published = 2016
