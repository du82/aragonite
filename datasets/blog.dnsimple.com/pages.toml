["https://blog.dnsimple.com/2010/12/announcing-services-other-ui-enhancements"]
title = "Announcing 'Services' and other UI Enhancements - DNSimple Blog"
description = "We're very happy to announce the roll out of an improved DNSimple web interface today to all DNSimple customers. Staying true to our name, the updates to the web interface are all about making DNS simple. Here is a rundown of what has changed and how it will make your experience with DNSimple even better."
full_description = '''Ditch the manual DNS configurations. Join our webinar to learn how to automate your DNS infrastructure with DNSimple's Terraform Provider! We're very happy to announce the roll out of an improved DNSimple web interface today to all DNSimple customers. Staying true to our name, the updates to the web interface are all about making DNS simple. Here is a rundown of what has changed and how it will make your experience with DNSimple even better. The first change you'll see when logging into your DNSimple account is the overhaul of the DNSimple domain list page. We've cleaned up the page and reduced the number of options accessible from here to make it easier to see what you can do with your domain. Each domain in the list includes a little status indicator that clearly marks whether or not DNSimple is resolving queries for a particular domain. You can also see the number of records in the domain's record collection. To the right of each domain are a set of buttons that change depending on the status of the domain. The first button is the Manage button which takes you to a page for seeing all of the details for a particular domain. More on the Manage screen in just a bit. The second button changes depending on whether or not the domain is registered with DNSimple as its registrar. If the domain is only hosted then the button will be a "Transfer" button which can be used to initiate a domain transfer. If the domain is currently being transferred then the button will say "Transferred" and will take you the domain's list of transfer orders. If you are registered but the domain does not have Whois Privacy Protection then it will say "Make Private", enabling you to quickly add Whois Privacy Protection. If the domain is private then the button will say "Make Public" allowing you to temporarily disable privacy protection. The third and final button is the "Delete" button, useful if you no longer want to manage the domain through DNSimple. For domains that are registered with DNSimple you'll also see the domain's expiration date on the domain list screen.'''
