["https://blog.dnsimple.com/2022/06/support-webauthn-api"]
title = "Get Stronger Account Protection with Web Authentication (WebAuthn) Support - DNSimple Blog"
description = "Protect your DNS assets and get stronger MFA with DNSimple's support for the Web Authentication API."
full_description = "Ditch the manual DNS configurations. Join our webinar to learn how to automate your DNS infrastructure with DNSimple's Terraform Provider! Two-factor authentication (2FA) is one of the most important steps you can take to secure your accounts, which is why DNSimple has supported two-factor authentication for many years using TOTP (Time-based One Time Password). Now we're introducing even stronger multi-factor authentication with support for the Web Authentication API (WebAuthn). You can now use built-in biometric support, like Apple Touch or Face ID, hardware security keys, like YubiKeys that support FIDO/WebAuthn, or other security devices that support the WebAuthn standard, to keep your domains as secure as possible. Multi-factor authentication (MFA) helps ensure the protection of your most important domains. A single authentication factor, especially one based only on a combination of password credentials, presents a security risk. By adding an additional factor, even if someone gets access to your password, they can't log in as you, because they won't have access to your second factor. For businesses, MFA protects against weak passwords and password theft. It helps your organization stay compliant with security requirements. By combining two or more independent authentication factors, MFA strengthens your company's security position and helps you remain resilient in the face of modern security threats. Hardware keys are the strongest form of authentication available at this time. They offer higher protection against phishing, differentiate legitimate websites, and, unlike 2FA, are connected to a physical device that must be present. They work similarly to other MFA methods — after a user presents their credentials, they're directed to enter an additional factor, like a fingerprint or a USB key that must be activated. WebAuthn is a standard for implementing public key encryption, and with DNSimple's WebAuthn support, you can now use a variety of hardware security devices as your second authentication factor."
year_published = 2022
