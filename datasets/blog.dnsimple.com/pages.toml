["https://blog.dnsimple.com/2024/11/fall-roundup-post"]
title = "What's New at DNSimple — Fall 2024 - DNSimple Blog"
description = "A roundup of improvements and updates at DNSimple for Fall 2024"
full_description = "Ditch the manual DNS configurations. Join our webinar to learn how to automate your DNS infrastructure with DNSimple's Terraform Provider! It's time again for another DNSimple Feature Focus! The last few months, the team has been rolling out enhancements to make it easier to download your domain data, provide more visibility into verifying your domain resolution, and improve our cache edge network. We're also excited to share that our CEO, Anthony, chatted with Scott Hanselman last month about DNSimple and all things DNS for his Hanselminutes podcast — listen to the conversation. Let's take a quick look at what we've improved, simplified, and added. Click the links in any of the sections below to learn more. If you're not using DNSimple yet, find the right plan for you, and give all these features and more a try free for 30 days. A lot of you wrote in asking for an easier way to export your domain data into a .CSV file. While we'd previously created a script you could use to populate Google sheets with some of this information, it required multiple steps, only returned domains registered with DNSimple, and you risked having too many queries. Our new export feature does all of this, and returns all domains in your account, without you needing to worry about rate limits on our API. Now you can download a .CSV file of your domain names, right from your domain page. The file includes domain registration, zone details, pricing, and more. You can find a full breakdown in our support article. In March 2023, we revealed initial work to develop an internally managed authoritative DNS cache edge to supplement our existing cache edge and further diversify our network topology, and we've accomplished a lot since that announcement. DNSimple's name servers are now being powered by two different cache edge networks, working together to provide a heavily redundant anycast DNS network: The new hostnames, ns2.dnsimple-edge.net and ns4.dnsimple-edge.org, have been created to represent NS2 and NS4 respectively. These hostnames use a completely separate domain name, with a mixed set of TLDs, to further increase the network diversity and reduce the impact on any registry-level DNS outage. We strongly recommend using them instead of their ns2.dnsimple.com and ns4.dnsimple.com counterparts. You can visit DNSimple's name server documentation to stay up-to-date with all the current configurations. Read this post for all the details."
