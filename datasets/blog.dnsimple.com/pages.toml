["https://blog.dnsimple.com/2010/10/dns-simplified-cname-records"]
title = "DNS Simplified: CNAME Records - DNSimple Blog"
description = "What a CNAME record is, and how to use CNAME records with DNSimple"
full_description = "Ditch the manual DNS configurations. Join our webinar to learn how to automate your DNS infrastructure with DNSimple's Terraform Provider! Canonical Name records, commonly called CNAME records, can be used to alias one name to another. They're often used to avoid maintaining two different records. Let's say you have a server where you keep all of your documents online. It might normally be accessed through docs.example.com, but you might also want to access it using documents.example.com. One way to do this is to add a CNAME record that points documents.example.com to docs.example.com. When someone visits documents.example.com they'll see the exact same content as docs.example.com. You have ilovetacos.com and www.ilovetacos.com pointing to the same application and hosted by the same server. To avoid maintaining two different records, you can create an A record for ilovetacos.com pointing to the server IP address, and a CNAME record for www.ilovetacos.com pointing to ilovetacos.com. As a result, ilovetacos.com points to the server IP address, and www.ilovetacos.com points to the same address via ilovetacos.com. If the IP address changes, you only need to update the record in one place. Just edit the A record for ilovetacos.com, and www.ilovetacos.com automatically changes, too. In DNSimple, URL redirects provide greater flexibility for websites, because you point a domain to a URL. URL redirects only work with the HTTP protocol. If you use a URL redirect to point documents.example.com to http://docs.example.com/, visitors to http://documents.example.com/ will automatically be redirected to http://docs.example.com/. The address in their browser will change to http://docs.example.com/. http://customers.docs.example.com/mystuff would redirect to http://docs.example.com/customers/mystuff. Between CNAME records and URL redirect records, DNSimple provides a powerful way to ensure visitors to your domain see the domain name you want them to see. Want to learn more about managing your CNAME records with DNSimple? Take a look at this support article. Have more questions? We'd love to talk. Get in touch"
