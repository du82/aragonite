["https://blog.dnsimple.com/category/engineering"]
title = "Engineering - DNSimple Blog"
full_description = "Ditch the manual DNS configurations. Join our webinar to learn how to automate your DNS infrastructure with DNSimple's Terraform Provider! In our new Elixir project we needed to orchestrate various sequential processing steps. But does GenStage work for low-volume processing too? In this post we discuss how to measure basic performance metrics with Elixir Phoenix and display them in the browsers developer tools using the Server-Timing API. We're adopting OpenAPI as a way to define and document the DNSimple API. Read on to find out how and why. Systems grow and evolve over time, accruing technical debt at varying speeds. Here's what we are doing about our technical debt at DNSimple. Shipping code is the most crucial moment in building things. That post outlines how we imporved the engineering experience in shipping code tough Hubot. This is what we learned when we rewrote our open source PowerDNS cookbook using the latest techniques. We scratch our own itch by scripting a small thing that let's us know if our freshly created DNS records are ready for us to access. One of the goals of the API v2 was to develop a maintainable solution without sacrificing performance; this is how we use Hanami at DNSimple to achieve that goal. In this post I explain our decision to migrate from Clockwork to Sidekiq Enterprise, and how we used our application metrics to determine the success of the project. After a few years of running our previous API in production, it no longer fit our domain management automation vision. This is the story of how we evolved the API to support our product vision. In this talk transcript you'll discover why Go was so important to us and why it was used to guide the development design decisions. We use Stunnel to provide secure encryption to our redis instances. Recently we embarked on a voyage deep down the rabbit hole in order to fix an elusive error. This is the story of how fixed it. What's the difference between `#to_i` and `#to_int`? How to sum two value objects? Let's learn Ruby Coercion Protocols in depth."
