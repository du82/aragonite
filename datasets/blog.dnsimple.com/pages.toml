["https://blog.dnsimple.com/2024/11/improving-dns-resolution-visibility"]
title = "Improving DNS Resolution Visibility - DNSimple Blog"
description = "We now run a series of verifications before any change is applied to your domain's DNS zone."
full_description = "Ditch the manual DNS configurations. Join our webinar to learn how to automate your DNS infrastructure with DNSimple's Terraform Provider! You know how we constantly talk about making your domain management as easy as possible? We've done it again. Today the DNSimple team is excited to announce our latest feature that improves your DNS resolution visibility. We know you care about being able to effectively manage your domains and DNS and want to ensure that any changes will have the desired impact. Clear communication about issues or misconfigurations is paramount so you can quickly take any necessary corrective action. Now, when you make a change to a domain and it doesn't take effect, you'll see a pop up alerting you to the list of failed verifications, along with the actions you need to take for your domain to resolve. Not using DNSimple yet? Sign up free for 30 days to take advantage of this and many other features that bring you more visibility into your domain and DNS management. Sometimes when you make a change in the app it doesn't take effect because the domains aren't directing traffic through DNSimple. This can be confusing and frustrating after multiple unsuccessful attempts, and you usually end up needing to contact support for assistance. We've changed the process to remove the guesswork and failed attempts. We now run a series of verifications before any change is applied to your domain's DNS zone to ensure the change will take effect as expected. If we detect any issues, a list of failed verifications will appear, along with the actions you need to take for your domain to resolve. This prevents ineffective changes and provides a more streamlined, efficient process. Just follow the steps in the alert, and you'll be good to go. We also include relevant support articles to guide you and help troubleshoot any issues. If you're not ready, or want to wait to correct the issues, just tick the box at the bottom, and we'll pause reminders for 24 hours. You'll find multiple error examples and more information in this support article."
