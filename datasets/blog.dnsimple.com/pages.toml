["https://blog.dnsimple.com/2024/10/export-domain-names-to-csv"]
title = "Export Domain Names to a .CSV File - DNSimple Blog"
description = "Export your domains as a .CSV file to track registration, expiration, renewal dates, and delegation info."
full_description = "Ditch the manual DNS configurations. Join our webinar to learn how to automate your DNS infrastructure with DNSimple's Terraform Provider! We heard you, and we're excited to announce that we've created an easy way for you to export your domains to a .CSV file, so you can have more control and flexibility in managing your domain portfolio. We've already received positive feedback about the export capabilities, and we're as excited for this update as you are. Not using DNSimple yet? Sign up free for 30 days to take advantage of this and many other features that make your domain management easier. No more contacting support and waiting for us to compile the data — now you can download a .CSV file of your domain names, right from your domain page. The file includes domain registration, zone details, pricing, and more. You can find a full breakdown in our support article. We previously created a script you could use to populate Google sheets with some of this information, but this required multiple steps, only returned domains registered with DNSimple, and you risked having too many queries. Our new export feature does all of this, and returns all domains in your account, without you needing to worry about rate limits on our API. We've also added a notification that includes which email it's being sent to, so you know where your export will be waiting. Whether you're an individual user with just a handful of TLDs, or you maintain a huge portfolio, like the Linux Foundation, you can benefit from having all your domain data in one file to quickly access and manage a large amount of clear, organized domain data. You can also integrate it with other data sources to build custom management tools to track registration, expiration, and renewal dates, along with current delegation data. We implemented .CSV exports as a result of your feedback, and we love being able to integrate your ideas as part of continually improving DNSimple. Your requests have brought us other popular features like WHOIS Privacy Renewal, KEY-Data Support for DNSSEC, and Let's Encrypt Wildcard Support. If there's ever something you want to see us add, let us know — we always appreciate hearing what features and improvements would make your lives easier."
