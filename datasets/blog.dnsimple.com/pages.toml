["https://blog.dnsimple.com/category/culture"]
title = "Culture - DNSimple Blog"
full_description = "Ditch the manual DNS configurations. Join our webinar to learn how to automate your DNS infrastructure with DNSimple's Terraform Provider! Quality customer support is a cornerstone of DNSimple. This post discusses how we do it, what tools we use, and the challenges we've faced over the last few years. On how taking time off and not touching a computer for weeks can help you be more productive and deal better with stressful projects. I used to ignore all that had happened on Slack while I was offline and consider catching up a waste of time... Until I changed my mind. How we use GitHub issues to keep track and communicate progress on long, big projects that expand over weeks, months or even years. Javier and Sebastian spoke at the 2017 edition of Pamplona Software Craftsmanship. This is how the conference went for them. Working remote means working from anywhere, we collected 5 tips to work from coffeeshops without getting kicked out or dying overdose of caffeine. This post is a recap of the DNSimple meetup held on the island of Lanzarote from the 7th to the 14th of December, 2016. Read on to Find out about what the DNSimple team love about remote working, what challenges we face, and how each of us deals with those challenges."
