["https://blog.dnsimple.com/2010/11/naptr-domain-registration-through-api-extended-attributes"]
title = "NAPTR and Domain Registration through the API with extended attributes - DNSimple Blog"
description = "As of yesterday, DNSimple now supports NAPTR records and domain registration and transfer of TLDs that require extended attributes through the API."
full_description = "Ditch the manual DNS configurations. Join our webinar to learn how to automate your DNS infrastructure with DNSimple's Terraform Provider! As of yesterday, DNSimple now supports NAPTR records and domain registration and transfer of TLDs that require extended attributes through the API. NAPTR record support means that domain holders who are interested in using services like SIP with ENUM phone number to URL mappings can now create NAPTR records through the web interface and API. The web interface breaks out the content data into its editable parts while the API interface requires a complete content string. The second feature that was released yesterday is the ability to register and transfer domain names that require extended attributes. This includes .us domains, .ca domains, .co.uk domains and any other domain that uses extended attributes. To find out what extended attributes are required for a TLD you can use the new extended attributes API call. Find out more in the API documentation or check out the latest version of the Ruby CLI and API wrapper. As always we welcome feedback from our customers. If you need any assistance with these features or any of the other DNSimple features, please email us at support@dnsimple.com, and thank you! I break things so Simone continues to have plenty to do. I occasionally have useful ideas, like building a domain and DNS provider that doesn't suck. A retrospective of the last two years where we adopted --squash as our default merge strategy for git branches. In this article I will try to explain the technical reason behind the ALIAS record and important limitations of the CNAME record you need to know."
