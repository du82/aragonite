["https://blog.dnsimple.com/2023/12/introducing-domain-control-plane"]
title = "Introducing the DNSimple Domain Control Plane - DNSimple Blog"
description = "Introducing the DNSimple Domain Control Plane, a single pane of glass for managing your domains."
full_description = "Ditch the manual DNS configurations. Join our webinar to learn how to automate your DNS infrastructure with DNSimple's Terraform Provider! Throughout 2023, the team at DNSimple has been working hard to deliver new features that help you manage your domains and DNS inside and outside our infrastructure. Those releases have culminated in the biggest change we've made in the last ten years, and we can't wait to share it with you. The complexity of managing zones in multiple clouds and on-premise inspired us to create what we're calling the Domain Control Plane, a single pane of glass where you can see and manage all your domains, DNS, and certificates - wherever they live. The Domain Control Plane gives developers and system admin unprecedented visibility and control into even the most complex domain portfolios — including resources hosted outside DNSimple's infrastructure. No upselling. No convoluted DNS management across multiple providers. Just a simple, clean interface you'll actually enjoy using. Available now on all plans. RSVP now for our town hall January 16 at 11AM EST to get an in-depth look at the Domain Control Plane Let's talk more about how we developed the Domain Control Plane, how you can get set up (like everything DNSimple, it's easy), and the two types of Integrated Providers. We've spoken to hundreds of site reliability engineers and application developers about the challenge of managing zones both on-premise and in the cloud. Cloud providers optimize for their cloud, and on-premise servers often are hard to configure and update, lacking user-friendly tools to manage zones. The Domain Control Plane works by connecting DNSimple via secure APIs to services where your domains and DNS are, then displaying your domains at other providers alongside your DNSimple domains inside DNSimple. Each integration must be connected using service credentials. Once connected, your domains will automatically begin appearing in DNSimple. It even extends to our API, making it easy to automate your DNS management across multiple providers with the tools you already use with DNSimple — including Terraform, Chef, Kubernetes, and many more."
