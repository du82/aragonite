["https://blog.dnsimple.com/2024/03/azure-announcement"]
title = "Microsoft Azure as A DNSimple Integrated DNS Provider - DNSimple Blog"
description = "Manage your Azure DNS in DNSimple with Azure as an Integrated DNS Provider."
full_description = "Ditch the manual DNS configurations. Join our webinar to learn how to automate your DNS infrastructure with DNSimple's Terraform Provider! In 2023, DNSimple introduced our first Integrated Providers: AWS Route 53 and CoreDNS. Today, we're excited to announce our next Integrated DNS Provider — Microsoft Azure. Integrated DNS Providers don't just let you sync and deploy DNS records — they give you full control over your DNS infrastructure, simplifying deployment and management of DNS zones across different networks through our Domain Control Plane. With our latest Integrated DNS Provider, you can manage your DNS zones from Azure within DNSimple, gaining even more visibility and control. As part of this release, we've also improved the experience around managing your Integrated DNS Providers with the new DNS Zone Providers card. This feature is available across all plans. If you haven't subscribed yet, sign up to take advantage of 30 days free, and see how our Integrated Providers and Domain Control Plane simplify your domain management. Let's talk more about Azure as an Integrated DNS Provider, how you can leverage this exciting feature to further simplify your DNS management, and the recent experience improvements we've made. Over the last year, we've been working to add Integrated Providers to our Domain Control Plane, so you can see and manage DNS across even more cloud DNS vendors, and operate authoritative DNS inside and outside corporate firewalls. We've added Microsoft Azure as an Integrated DNS Provider, because we know a lot of you use both DNSimple and Azure and want the ability to manage your DNS zones on Azure from within DNSimple. This latest integration lets you manage zones that are in DNSimple, Microsoft Azure, or both, from DNSimple's web interface, and synchronize zones between the two. Import integrated zones — All the zones hosted on that Integrated DNS Provider will be imported into DNSimple and listed on the Zones page. Manage your integrated zone records — List, create, update, and delete integrated zone records from DNSimple using the Deployment Editor. The list of supported record types differs based on the provider — view the supported records for Azure."
