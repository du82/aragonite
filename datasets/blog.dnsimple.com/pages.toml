["https://blog.dnsimple.com/2025/01/technical-debt-part-1"]
title = "What is Technical Debt? - DNSimple Blog"
description = "Explores what technical debt is and how DNSimple handles it as an investment rather than a burden."
full_description = "Ditch the manual DNS configurations. Join our webinar to learn how to automate your DNS infrastructure with DNSimple's Terraform Provider! At DNSimple, we think about technical debt a lot. Dealing with inherited debt and being smart about how we introduce new technical debt is just part of building a successful product. How we view, plan for, and manage that debt is critical to our software development process. Every system that evolves over time accrues technical debt. Depending on the number of contributors to that system; the complexity, the rate of change, as well as other factors, that debt may accrue slower or faster from system to system. So what is technical debt? And why does it matter to anyone outside an engineering team? We'll address these, some common misconceptions, and look at some examples to provide a better idea of what technical debt is and how to handle it as an investment rather than a burden. Let's get a common misconception out of the way: bugs ≠ technical debt. Bugs are important, immediate defects that need to be fixed right away for the product or feature to function as expected. To understand what technical debt is, we need to look at our development process and what it's based on — three concepts of shipping software: Early - Ship software as early and often as possible. This is one of the most important, because teams want to drive the product based on feedback from real users. These guide the things teams need or want to ship in the near future. However, working software doesn't necessarily mean well-designed software. When building a new solution that doesn't already exist in a system, you probably won't invest time in making too many design decisions in the first iteration. Adding design early would result in shipping software slowly and infrequently. The odds of building the wrong design are too high, and in the long run, incorrect design decisions are worse than the original code. It's all about making fewer decisions and adding less structure to keep options as open as possible."
year_published = 2025
