["https://blog.dnsimple.com/2021/12/domain-access-control"]
title = "Introducing Domain Access Control - DNSimple Blog"
description = "Use DNSimple's Domain Access Control to limit what each member can access on a per-domain or per-zone basis."
full_description = "Ditch the manual DNS configurations. Join our webinar to learn how to automate your DNS infrastructure with DNSimple's Terraform Provider! Previously, all members in your DNSimple account had full access to your account. They could see all domains, contacts, templates, certificates, and billing details. Now, with Domain Access Control, you can assign roles to team members in Professional and Business accounts: Domain Manager and Zone Operator. These roles let you control what each member can access on a per-domain or per-zone basis. Any team member can be given full access to the account. This gives them access to all domains and full account management. Alternatively, you can assign them one of two roles: Team members with the Operator role for a domain only have access to the DNS zone for that domain. They can see and make changes to the DNS records in the zone using the DNS editor and one-click services. Domain Managers can access all functionality under a specific domain. In addition to managing the zone, they can change registration details for a domain – including the domain's name servers and registrant, create new certificates, and perform all other operations on a domain where access is permitted. If you're on a Professional, Business, or Reseller plan, you can set up the Domain Access Control feature for any individual domain on the domain's Member tab. You'll see all team members who have access to the domain and their current role. To set roles for multiple domains in the account for a team member at once, go to the Account > Members page. Use the Manage Access button to configure the team member's domain access. When you manage the domain access for a member through the Account interface, you'll have the option to give the team member Full Access or Limited Access. When you select Limited Access, you'll see a list of your account's domains and a control for selecting the role for the member on the domain. You can also enter part of a domain name and you'll see only domains matching that search part, or you can enter a role name to see the domains where the team member has that role."
year_published = 2020
clearnet = "https://blog.dnsimple.com/2021/12/domain-access-control"
