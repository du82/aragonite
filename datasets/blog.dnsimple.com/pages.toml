["https://blog.dnsimple.com/2018/03/elapsed-time-with-ruby-the-right-way"]
title = "Elapsed time with Ruby, the right way - DNSimple Blog"
description = "Elapsed time calculations based on Time.now are wrong. Learn why they are wrong and how to fix them."
full_description = '''Ditch the manual DNS configurations. Join our webinar to learn how to automate your DNS infrastructure with DNSimple's Terraform Provider! Depending on the low level Operating System (OS) settings, Ruby's Time.now uses gettimeofday or clock_gettime Linux functions from time.h. It returns a struct with the number of seconds and the system time zone. Ruby VM can then calculate and it returns a Time object with these informations. This is often indicated as wall time in Linux documentation. The time returned by gettimeofday() is affected by discontinuous jumps in the system time (e.g., if the system administrator manually changes the system time). This isn't only affected by manual adjustments, but also to automatic reconciliations of the system clock. For instance, if your server uses NTP: Ideally the reference time is the same everywhere in the world. Once synchronized, there should not be any unexpected changes between the clock of the operating system and the reference clock. Therefore, NTP has no special methods to handle the situation. Unfortunately all the common clock hardware is not very accurate. This is simply because the frequency that makes time increase is never exactly right. Even an error of only 0.001% would make a clock be off by almost one second per day. The lack of perfect accuracy is due to CPU physical conditions like temperature, air pressure, and even magnetic fields. So when the OS tries to set a new system time, it doesn't guarantee that the new value will be in the future. If a CPU has a clock that is "too fast", the OS can decide to reset the time of a few seconds backward. Another reason why wall clocks are flawed is because some CPUs can't manage leap seconds. On Wikipedia there is a page dedicated to incidents in software history due to leap seconds. 🤓 To recap: system clock is constantly floating and it doesn't move only forwards. If your calculation of elapsed time is based on it, you're very likely to run into calculation errors or even outages.'''
year_published = 2018
