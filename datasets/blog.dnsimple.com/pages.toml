["https://blog.dnsimple.com/2024/12/enhancing-account-security-password-reset"]
title = "New Password Reset Policy to Enhance Account Security - DNSimple Blog"
description = "Protecting DNSimple accounts with new security measures, including mandatory password resets for users without MFA."
full_description = "Ditch the manual DNS configurations. Join our webinar to learn how to automate your DNS infrastructure with DNSimple's Terraform Provider! At DNSimple, your account and domain security have always been among our top priorities. We continuously review and align our policies with industry best practices to ensure robust protection, and we take decisive action to address any emerging threats. We've recently noticed an uptick in fraudulent activities, including account takeovers by malicious actors. This is typically the result of passwords that were reused and compromised by services outside of DNSimple, so we've implemented some important changes to mitigate risks and further protect your account. Let's go over these changes, along with some best practices for securing your account and user credentials. In the recent fraudulent activities we encountered, attackers gained control of compromised accounts and quickly changed the login credentials to lock out the rightful owners. They then used the stored payment methods to fraudulently purchase domains or other products. DNSimple's investigation revealed these attacks stemmed from compromised credentials. In most cases, the email and password had been exposed in data breaches on other websites not connected with DNSimple. These credentials were reused across multiple services, and none of the compromised accounts had multi-factor authentication (MFA) enabled, leaving them vulnerable. The team helped affected customers regain access and successfully stopped the fraudulent activities, often through manual intervention. The issues have been resolved, and our new password requirements will further help keep customers' information secure and prevent future attacks. To mitigate these risks, DNSimple introduced a new policy: users without MFA enabled must update their password every three months. Users with MFA enabled will not be affected by this requirement. We also recommend following best practices to secure your accounts. A detailed guide is available in this support article. Here's a summary:"
