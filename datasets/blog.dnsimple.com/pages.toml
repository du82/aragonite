["https://blog.dnsimple.com/2021/05/dnsimple-as-secondary-dns-server"]
title = "DNSimple Now Supports Secondary DNS Hosting - DNSimple Blog"
description = "Configure DNSimple as your secondary DNS provider to improve your domain's availability and redundancy with AXFR zone transfers."
full_description = "Ditch the manual DNS configurations. Join our webinar to learn how to automate your DNS infrastructure with DNSimple's Terraform Provider! We're excited to announce that we have implemented support for inbound zone transfers via AXFR, and you can now add DNSimple as your secondary DNS provider. For years we've supported zone replication across multiple providers via secondary DNS where DNSimple is the primary DNS provider. This let our users continue taking advantage of our comprehensive API, easy-to-use web interface, powerful DDoS defense, Anycast network, and low response times, and added redundancy in case DNSimple went down. With DNSimple as a secondary DNS provider, you can leverage all of these things as part of your redundancy strategy – without having to change your primary provider. Availability is key for all businesses. If your site becomes unavailable, of course you'll lose traffic, but you'll also lose leads and trust. That's why it's important to have a redundancy strategy for your DNS. Deploying a secondary DNS provider that doesn't share the same infrastructure as your primary provider means if your primary DNS provider goes down, your customers continue to have access to your infrastructure. If you're not using DNSimple yet, and you're ready to secure your online presence with our secondary DNS, Give us a try free for 30-days. We'll help make sure your site stays up, running, and secure at all times. A primary DNS server hosts and manages the zone files for your domains. Once the primary server has completed applying any updates, it can update any secondary servers and pass along the changes to them. A secondary DNS server stores a copy of the zone file in a read-only mode. This means no changes can be applied via the secondary DNS server to the zone file. The process of copying the zone file from the primary DNS server is called a zone transfer. Communication between the primary and secondaries is always unidirectional – moving from the primary to the secondary DNS servers. When a zone is updated, it results in an incremental change to the Start of Authority (SOA) serial number. The SOA's serial number is used by the secondary DNS server to determine if the zone is out of sync. The zone update will also result in a NOTIFY message being sent to the secondary DNS server. If they receive the message, they can trigger an AXFR zone transfer (RFC 5936) to sync the zone file. Even if the NOTIFY message never reaches its destination, you can still expect the secondary DNS server to carry out periodic checks on the SOA serial to determine if it needs to initiate a zone transfer to sync the zone file."
year_published = 2021
year_updated = 2023
