["https://blog.dnsimple.com/2024/06/domain-control-plane-updates"]
title = "Domain Control Plane Improvements - DNSimple Blog"
description = "We updated DNSimple's Domain Control Plane for an improved experience."
full_description = "Ditch the manual DNS configurations. Join our webinar to learn how to automate your DNS infrastructure with DNSimple's Terraform Provider! We launched the Domain Control Plane in December 2023 as a single pane of glass where you can view and manage all of your domains and DNS, whether they're registered with us or another service. We currently support DNS management through Azure, Route53, and CoreDNS, and domain management through GoDaddy. In our most recent round of updates, we unified your DNS record editor experience, so you'll be able to use a single record editor to manage everything. We've also discontinued GoDaddy domain registration via DNSimple due to recent API changes on GoDaddy's end, and adjusted the integration management for our Route53 and Azure Integrated DNS Providers to fine-tune your overall experience. These changes will take effect for all customers across all plans. If you use the Domain Control Plane, you'll see these changes immediately. And even if you don't, you'll still notice a few minor changes, like the cleaner record editor interface with group actions. Previously, anyone using the Domain Control Plane had to use a separate instance of the DNS record editor to manage DNS records between DNSimple and the integrated provider. It wasn't the most intuitive process, so we improved it. Rather than adding or removing functionality, we merged the regular and Domain Control Plane-specific record editor together, so you'll now see one unified record editor. This single editor view offers additional record management functionality when dealing with an integrated zone from an integrated provider. GoDaddy's recent API policy changes have made the integration with GoDaddy unreliable for our customers. Not every GoDaddy customer can use the GoDaddy API without fulfilling certain requirements. They've limited their Availability API to accounts with 50 or more domains, and their Management and DNS APIs to accounts with 10 or more domains and/or an active Discount Domain Club plan. We want to be a reliable partner for all of our customers, so we decided to remove the ability to register domains at GoDaddy via DNSimple's UI or API."
