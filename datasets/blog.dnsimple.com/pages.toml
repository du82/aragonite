["https://blog.dnsimple.com/2022/11/domain-security-features"]
title = "Protection and Security for Your Domains - DNSimple Blog"
description = "How to ensure you have the best security for your domains"
full_description = "Ditch the manual DNS configurations. Join our webinar to learn how to automate your DNS infrastructure with DNSimple's Terraform Provider! When it comes to DNS and Domain Management, security is one of DNSimple's top priorities. We offer multiple ways to secure your accounts and protect your most important digital assets. Our strong security policies and protocols, along with tools like DNSSEC, DDoS defense, and account access controls available on every plan, mean you know your domains are safe with us. Every DNSimple account comes with the ability to enable DNSSEC (Domain Name System Security Extensions) on your domains. DNSSEC provides a cryptographic chain of trust for your zones that authenticating resolvers use to ensure DNS results weren't tampered with while in transit. If you're curious how DNSSEC works, we've got a comic detailing the whole process. For some TLDs (Top Level Domains), users are required to manually sign their zones, which requires highly technical skills. And key rotation can be complicated. We provide expert-level DNSSEC service, so you know these operations are done correctly and your domains are as secure as possible. Most domains registered with DNSimple also include support for automatic DNSSEC key rotation. We also provide defense against DDoS (distributed denial-of-service) attacks at the DNS level. This protection is available to all customers at no additional cost, without any special configuration. If you want to dive a little deeper into DDoS, we go into more detail in our uptime post and support documentation. From multi-factor authentication to domain access control and single sign-on, you have full control over who can access your domains. Domain access control is available on the Professional plan and higher. It lets you specify different roles for your team members on a per-domain basis, so you can ensure team members only have access to the domains they need to manage. Individual logins allow multiple users to access a DNSimple account using their own credentials. That means no more worrying about losing control of your domains if someone leaves the team. And if you use Google Workspaces, you can easily provision team member accounts in DNSimple using your Google Workspace as your Identity Provider. We'll automatically disable their access if they're removed from your Google Workspace at a later date."
year_published = 2022
