["https://blog.dnsimple.com/2023/06/manage-aws-routes-in-dnsimple"]
title = "Manage Your AWS Route 53 DNS from DNSimple - DNSimple Blog"
description = "Manage your AWS Route 53 authoritative DNS zones from DNSimple's web interface with our new Integrated DNS Provider."
full_description = "Ditch the manual DNS configurations. Join our webinar to learn how to automate your DNS infrastructure with DNSimple's Terraform Provider! DNSimple has always been committed to making your domain management as simple as possible, and we're constantly adding new features to achieve that goal. Today we're taking another step towards this vision with the official release of our AWS Route 53 integration. You can now see and manage your AWS Route 53 zones inside DNSimple, with more providers to come. Our new integration with Route 53 lets you manage your DNSimple and Route 53 zones, all from within our simple web interface. We've designed this feature so you can easily figure out differences between zones and their records and quickly synchronize your DNS between providers. This feature is now available to all subscribed customers. If that's not you yet, sign up to take advantage of 30 days free,and try our new Integrated DNS Providers along with DNSimple's many other features that simplify your domain management. Let's talk more about integrated providers, how you can leverage this exciting new feature to further use DNSimple to make your DNS management easier, and what this looks like moving forward. We identified two main needs for enterprises that other DNS providers aren't addressing: the need to see and manage DNS across cloud DNS vendors, and operating authoritative DNS inside and outside corporate firewalls. We chose integrating with AWS Route 53 as the first step towards addressing these needs, because it lets you manage zones that are in DNSimple, Route 53, or both, from DNSimple's web interface. Import integrated zones — When you link an integrated DNS provider to your DNSimple account, all the zones hosted on that integrated DNS provider will be imported into DNSimple and listed on the Zones page. Manage your integrated zone records — List, create, update, and delete integrated zone records from DNSimple using the Deployment Editor. (Note: The list of supported record types differs based on the provider)"
