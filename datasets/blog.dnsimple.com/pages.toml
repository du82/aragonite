full_description = "Ditch the manual DNS configurations. Join our webinar to learn how to automate your DNS infrastructure with DNSimple's Terraform Provider! Update 2023-05-25 - WHOIS Privacy is now free across all plans. We edited this post to reflect that change. I've just rolled out a new feature for DNSimple called WHOIS Privacy Protection. For DNSimple customers that register with us or transfer domains into our system, we can now make your WHOIS information private by putting a third-party in between you and spammers. If your TLD supports WHOIS privacy, and you chooose to enable it, your email address and physical address will no longer be shown in WHOIS output. Email will be routed to you through a proxy email address. You can enable WHOIS Privacy Protection either during domain registration or after a domain is registered by visiting your domain page and following the instructions provided. Once you've enabled WHOIS Privacy Protection, the WHOIS data will be updated immediately to show the proxy information. You can disable and re-enable the protection at any time. In addition I've fixed some bugs and added a couple of new commands for describing and updating records via the dnsimple-ruby API wrapper. Finally, I'll be in Marseille this weekend for Startup Weekend Marseille. If you're in France stop by and say hi! I break things so Simone continues to have plenty to do. I occasionally have useful ideas, like building a domain and DNS provider that doesn't suck. Inspired by a recent blog post from Travis CI, I'd like to share details about how DNSimple team members work together without offices. Configure DNSimple as your secondary DNS provider to improve your domain's availability and redundancy with AXFR zone transfers."
