["https://blog.dnsimple.com/2017/08/debugging-dns"]
title = "Debugging DNS - DNSimple Blog"
description = "In this post we share some tips and tools you can use to troubleshoot DNS issues on your own like a pro."
full_description = "Ditch the manual DNS configurations. Join our webinar to learn how to automate your DNS infrastructure with DNSimple's Terraform Provider! Here at DNSimple we deal with DNS every day, and as part of offering support to our customers we troubleshoot lots of different types of DNS issues. In this post I want to give you an overview how to trouble shoot your DNS issue. There are two tools all of us use to debug any DNS issue. First there is whois, a handy tool to fetch domain related data from the registry, and dig, which is an abbreviation for domain information groper. Let's take a closer look at both of these tools. The first step when debugging a DNS issue is to check out what the registry says about the domain, so you use whois to find what's up there. Let's take a look at howdns.works. I removed a bit of the noise you'll usually see in a whois response to highlight the interesting bits. Here you can see the current name servers (we will need this information for the second step), DNSSEC information, the Domain status, and all kinds of contact information for the domain registrar, administrative and tech contacts, etc. If you would like to learn more about whois, my co-worker Amelia dedicated an entire post to it. Her post is definitely worth a read! With dig you dig out any information out of any name server on the internet. In its most basic form, you use it like this: dig <DOMAIN>. For example: This gives you the default domain to IP address mapping. Here you see what dig queried at the server for in the QUESTION SECTION: and the response in the ANSWER SECTION:. The default question in dig is for an A record and the response is a set of IP addresses. We use regional records so that you can use region.dnsimple.com to determine at what region you are currently resolving: With the +short option you can skip all the detail information and just get the record value. In my case it's our ams datacenter where I resolve my records at the moment. Since we run an Anycast network, you may receive a different response depending where you are located in the world."
year_published = 2017
