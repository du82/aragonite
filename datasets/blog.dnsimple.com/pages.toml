["https://blog.dnsimple.com/2014/01/why-alias-record"]
title = "Technical reasons behind the ALIAS record - DNSimple Blog"
description = "In this article I will try to explain the technical reason behind the ALIAS record and important limitations of the CNAME record you need to know."
full_description = "Ditch the manual DNS configurations. Join our webinar to learn how to automate your DNS infrastructure with DNSimple's Terraform Provider! Every once in a while I come across threads or discussions describing unexpected issues with the CNAME record, generally originated from pointing a domain APEX to Heroku or another service. The root of these issues inevitably leads to the reason why two years ago we created the ALIAS record. I recently noticed, despite documentation for the ALIAS record in our support site and that our posting several articles on the topic, we've never explained why you need to use the ALIAS record in some cases. In this article I will try to explain the technical reason behind the ALIAS record and important limitations of the CNAME record you need to know. I'll try to avoid non-essential DNS details that may prevent less technical readers from closing this page right now. The A and CNAME records are the two common ways to map an host name (name hereafter) to one or more IP address. Before going ahead, it's important that you really understand the differences between these two records. Please take a minute to read the support article, if you're not familiar with them. This section is the essence of the entire article. The CNAME record, other than being required to point to a name instead of an IP, has another important limitation: a CNAME record is not allowed to coexist with any other data. In other words, if blog.dnsimple.com is a CNAME for example.com, you can't have any other records attached to blog.dnsimple.com, for example no MX records (which means no emails @blog.dnsimple.com), no TXT records and, even more importantly, no NS records. This explains why you cannot use a CNAME for aliasing your root domain (apex domain) to another name. Let's take the dnsimple.com root domain. You expect at least one NS record associated to the name, one SOA record, one or more MX records (we want to use @dnsimple.com emails!) and possibly some TXT records used by third parties such as the Google Webmaster Tools."
year_published = 2014
clearnet = "https://blog.dnsimple.com/2014/01/why-alias-record"
