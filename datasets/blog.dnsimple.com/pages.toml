["https://blog.dnsimple.com/2025/02/tech-debt-part-2"]
title = "How DNSimple Handles Technical Debt - DNSimple Blog"
description = "Explores how DNSimple handles tech debt as an investment rather than a burden."
full_description = "Ditch the manual DNS configurations. Join our webinar to learn how to automate your DNS infrastructure with DNSimple's Terraform Provider! DNSimple was founded in 2010, and our offering has grown and changed a lot over those 15 years. We've evolved in complexity along with our customer needs and had team members come and go throughout the years. It's like a living thing. It also means we have a 15-year-old codebase and all the technical debt that entails. Growing our product comes with more technical debt. We inherited challenges from years when technical debt went uncharted, plus the new debt we introduce whenever we ship new features. We recently talked about what technical debt is, so in this post, we'll dive a bit deeper. How does DNSimple manage technical debt and still have time to ship new features simultaneously? We treat it as a strategic investment that enables faster value delivery while providing long-term maintainability. There are myriad inherited past decisions in a 15-year-old codebase. We could think about this as multiple loans and options in motion already, but we're also shipping new features, involving new tradeoffs to hit deadlines and get early feedback from our customers. We work through these changes in the code base, and technical debt adds costs to those changes. It adds hidden risks, because technical debt, especially when it's uncharted, can easily pop up in a project to derail estimations or planned work. And it limits our choices when it comes to vendor lock in. Well-designed software should be able to swap parts easily, and badly designed code is harder to replace — or even remove. Our team can't stop everything, pay technical debt, then resume everything. It needs to be compatible with how we work and keep a balance between what's new and what's maintenance. We work to identify and document the existing technical debt whenever a project goes out. We try to figure out what technical debt is left to be paid, and document it. We also get feedback from stakeholders about the current state of product roadmaps and planning."
year_published = 2025
clearnet = "https://blog.dnsimple.com/2025/02/tech-debt-part-2"
