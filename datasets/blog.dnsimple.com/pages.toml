title = "Using time tracking to improve your remote working habits - DNSimple Blog"
description = "What we learned, individually, from our collective time tracking experiment."
full_description = '''Ditch the manual DNS configurations. Join our webinar to learn how to automate your DNS infrastructure with DNSimple's Terraform Provider! Back in November, we conducted a time tracking experiment collectively. We tracked the results in this post. The post laid out what the experiment brought to the company. What wasn't laid out however, is how time tracking allowed some of us to better understand ourselves and to improve both our work output and our lives. Amelia and I were the most into it, although Simone also uses it but wanted to aggregate more data before providing feedback in this post. Amelia, who represents 33% of our DevOps department and 100% of our collective usage of verbal ellipsis, is no rookie when it comes to time tracking. Brought up in a military environment, she provides the time in the military format and tracks everything. To put it in her own words: By everything, she really means evvvveerrryyyttthing and that's the point. To her, if you're going to track your work effort, you might as well track everything else you do during your waking hours if you want to measure your work-life balance. I've set up a few clients to create broad buckets that lets me create broad buckets that I can use when building reports to compare where I spent my time. Sometimes I think being able to switch betwen painting broad strokes saying "I spent 30 hours at DNSimple" last week which is ok… but also, by creating different categories, I'm able to dig down and be like "the last two days I spent four hours a day in entertainment split between shows and reading and I could be amortizing that better with easy tasks from other parts of my life instead to break this up instead of block timing large amounts of faffing off" Also while it only helps for at-computer time, I also use Rescue Time which is an auto-time tracker that tracks what windows I have up. It helps keep me honest a LOT about what I am doing. With IFTT I can have summaries mailed every morning and I have it send me a really amazing looking weekly chart too. It has goals and a "focus helper" built into it that disables access to webpages.'''
year_published = 2017
clearnet = "https://blog.dnsimple.com/2017/05/individual-time-tracking"
