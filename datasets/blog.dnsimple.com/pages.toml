["https://blog.dnsimple.com/2021/10/announcing-dnssec-general-availability"]
title = "Announcing DNSSEC General Availability - DNSimple Blog"
description = "DNSimple is moving our DNSSEC out of beta and into general availability."
full_description = '''Ditch the manual DNS configurations. Join our webinar to learn how to automate your DNS infrastructure with DNSimple's Terraform Provider! In 2017, DNSimple announced our beta launch of DNSSEC (Domain Name System Security Extensions). Today, we're excited to announce we're moving out of beta and into general availability. We've spent the last five years building to this launch. Over that time, we've tested and verified DNSSEC with different domain names. It's been a long process, and we've slowly made improvements along the way. After four years of work, we're confident that we're ready to launch for general availability. And all the testing we've done over the years means you can be confident, too. DNS (Domain Name System) isn't secure on its own. Source IP addresses of DNS response packets can easily be forged or spoofed. Attackers can use that falsified information to re-route users to malicious sites. That's where DNSSEC comes in. DNSSEC provides a way to cryptographically build a chain of trust from the root name servers to authoritative name servers. Authenticating resolvers may verify this chain of trust to ensure the DNS results weren't tampered with while in transit. DNSSEC adds trust to the DNS resolution chain and reinforces the claim about authoritative DNS resolution. It also improves Internet security by making it harder to perform attacks based on DNS forgery. Hosting platforms that create subdomains for their customers (e.g. Clickfunnels) can benefit by adding DNSSEC to their zones to protect their customers' identities. DNSSEC is also valuable for personal domains/subdomains. You can benefit from using DNSSEC to verify your "digital identity" by adding signatures to your domains and subdomains – much like what you'd do by adding PGP/GPG (Pretty Good Privacy/GNU Privacy Guard) signatures to your emails. DNSimple offers one of the best DNSSEC services around. Some TLDs (Top Level Domains) make users sign their zones manually, which requires highly technical skills. And key rotation can be complicated. We provide expert-level service to ensure your DNSSEC is taken care of correctly, so you know your DNS is as secure as possible.'''
year_published = 2021
