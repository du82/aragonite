["https://blog.dnsimple.com/2015/03/whats-in-a-dns-response"]
title = "What's in a DNS response? - DNSimple Blog"
description = "DNS queries and responses fly across the internet all day, but we don't often take a look at what's inside of them. Today we do."
full_description = '''Ditch the manual DNS configurations. Join our webinar to learn how to automate your DNS infrastructure with DNSimple's Terraform Provider! A few weeks ago I published a post on various DNS lookup tools. This post gives an introduction to some aspects of DNS. Today, we're going to dive a bit more into some of the details of DNS, specifically the content of DNS responses known as resource records. Resource records, often abreviated at RR, are the content of DNS responses. They contain several fields, each with important details regarding the way the RR should be interpreted. Let's take a look at the output of the dig query Anthony used in his tutorial: The answer we're looking at here has five parts: the NAME, TTL, CLASS, TYPE and RDATA. Let's look at each one as it occurs. The NAME resource field states the domain name to which the resource record refers. In this case, we're looking at a record for the dnsimple.com. domain name. The NAME is actually best interpreted from right to left treating the period (.) as a delimiter for each portion of the NAME. Keeping this in mind, we see that this NAME exists in the com top-level domain. After this, we notice dnsimple, comes next and there are no further subdomains. This type of name is often referred to as the apex or root domain, but it is possible to provide a NAME with multiple levels of specificity. The TTL resource field is an abreviation for the phrase "time to live". This field gives the amount of time, in seconds, for which the record should be considered valid. In this case, the record only lasts for 59 seconds. While the TTL is set by the domain administrator with their DNS provider, some resolvers and caches do not respect the TTL as provided by the authoritative name server. The CLASS resource field is generally rarely used. The IN in this example, and most examples you're likely to see, indicates that this record is of the "Internet" CLASS of DNS record. There are also CH (for Chaosnet) and HS (for Hesiod) classes, as well as QCLASS options for use only in queries. Generally speaking, the CLASS field will almost always be IN in a DNS answer.'''
year_published = 2015
clearnet = "https://blog.dnsimple.com/2015/03/whats-in-a-dns-response"
