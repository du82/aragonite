full_description = "Ditch the manual DNS configurations. Join our webinar to learn how to automate your DNS infrastructure with DNSimple's Terraform Provider! A new deployment of DNSimple has gone live, bringing with it the ability to edit records. Previously you had to delete the old record and add a new one in order to make a change, now you can simply click the Edit link and make the changes you need, save the record and the DNS servers will be updated. In addition to the new edit feature I've worked on cleaning up the record list screen so long content does not cause the layout to go crazy. I've also done the same when adding and editing records. I break things so Simone continues to have plenty to do. I occasionally have useful ideas, like building a domain and DNS provider that doesn't suck. There are a lot of DNS Servers out there. We're looking at some of the top ones here and comparing their features and why some are chosen Inspired by a recent blog post from Travis CI, I'd like to share details about how DNSimple team members work together without offices. Configure DNSimple as your secondary DNS provider to improve your domain's availability and redundancy with AXFR zone transfers."
