["https://blog.dnsimple.com/2014/02/how-we-work-as-a-remote-team"]
title = "How We Work as a Remote Team - DNSimple Blog"
description = "Inspired by a recent blog post from Travis CI, I'd like to share details about how DNSimple team members work together without offices."
full_description = "Ditch the manual DNS configurations. Join our webinar to learn how to automate your DNS infrastructure with DNSimple's Terraform Provider! Inspired by a recent blog post from Mathias Meyer on the Travis CI blog, I want to share with you details about how we work together at DNSimple. DNSimple does not have a central office - actually, we don't have an office of any type, central or otherwise. The core team consists of me (@aeden), Darrin (@dje) and Simone (@weppos). I live in France, Darrin lives in Portland, Oregon, and Simone lives in Italy. From the beginning we decided to build our business around the idea of working from wherever we are at the moment, whether that's from home, from a vacation rental somewhere in the world, or even from a dive shop in Indonesia (yep, it happened! See below…). From our tools to our processes, the idea of being location independent helps define everything about how we operate. We're a software company first and foremost. We rely on Github as the center of all of our software development. All enhancements and bug reports go into Github Issues where we can discuss them. Everyone on the team has access to Github Issues and can join any discussion. Often the next step is to create a pull-request around a bit of code that addresses a particular issue. Pull requests are a good place to give constructive feedback and work as a team to decide on certain elements of code or design of a particular implementation. In general, every pull request is peer-reviewed by a member of the team. At the end someone owns that pull request (usually it's the person who opened it) and they make the final call on when it is ready to merge into master. We make heavy use of Slack as our distributed water cooler. We keep the majority of our discussions in a single, shared room. In addition to core team members we also invite contractors and part-time folks into the room as well. Anyone may come and go as they please. Heavy use of emoticons is always appreciated."
year_published = 2014
