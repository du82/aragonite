["https://blog.dnsimple.com/2024/10/expanding-cache-edge-network"]
title = "Expanding Our Second Cache Edge Network - DNSimple Blog"
description = "Our journey to expand DNSimple's DNS cache edge network and future plans."
full_description = "Ditch the manual DNS configurations. Join our webinar to learn how to automate your DNS infrastructure with DNSimple's Terraform Provider! Just over a year ago, DNSimple revealed initial work to develop an internally managed authoritative DNS cache edge to supplement our existing cache edge and further diversify our network topology. Today, we're successfully running DNSimple using a 50/50 configuration. Half of the name servers are powered by our new cache edge network, with the other half powered by the original network. Many other changes have happened since then, and we're excited to share some updates, what we've accomplished since that first announcement in March 2023, and what's next. The work to implement DNSimple's internally-built cache edge network started at the beginning of 2022. To validate the implementation, the team planned to deploy the new cache edge network on 25% of our infrastructure. We selected NS4, and planned to replace the existing cache edge for the machines serving ns4.dnsimple.com. The initial rollout took place around August 2022, with a lot of time spent sampling traffic, rolling back, fixing, and rolling forward until the canary name servers were offering a compelling level of service, comparable with the current cache edge. By October, we were ready to start migrating all the traffic from the existing ns4.dnsimple.com – still powered by the previous cache edge system – to the new name server, ns4.dnsimple-edge.org, powered by the new cache edge. The first step was simple. For all the zones registered with us, we automatically updated the name servers at the registry with the new name server. We informed all the customers who were delegating to our name servers from domains registered elsewhere, and requested the name server switch. The team also worked directly with accounts who had complex network setups to address routing issues or edge cases (no pun intended). In this phase, the reports we received from the network teams of some of our customers were essential to the success of this project."
year_published = 2024
year_updated = 2024
