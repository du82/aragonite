["https://blog.dnsimple.com/2010/10/api-contacts"]
title = "DNSimple API Update - Manage Contacts - DNSimple Blog"
description = "I've just pushed an update to the DNSimple API that adds support for listing, describing, creating and deleting contacts."
full_description = "Ditch the manual DNS configurations. Join our webinar to learn how to automate your DNS infrastructure with DNSimple's Terraform Provider! I've just pushed an update to the DNSimple API that adds support for listing, describing, creating and deleting DNSimple contacts through the API. DNSimple contacts are used as the registrant for domains that are registered through DNSimple or transferred into DNSimple from another registrar. If you're using DNSimple to register domain names then you'll need these API commands to get access to contact information needed during domain registration (any contact ID for a contact you manage can be used in the registrant_id field). The open source Ruby wrapper for DNSimple has also been updated to add commands that wrap these API commands. The new commands are contact:list, contact:describe, contact:create and contact:delete. Check out the source code on GitHub. In addition I've also updated the API documentation to include the examples for the contact API and mentioned that you can send JSON or XML when sending API requests. This feature has always been available but was previously undocumented. Finally I've made some minor changes to the web interface to add some explanation text where there was none before. I hope this helps clarify some of the elements of the DNSimple web interface. Enjoy! I break things so Simone continues to have plenty to do. I occasionally have useful ideas, like building a domain and DNS provider that doesn't suck. There are a lot of DNS Servers out there. We're looking at some of the top ones here and comparing their features and why some are chosen"
