["https://blog.eliperkins.me/stackless-stacked-prs"]
title = "Stackless Stacked Pull Requests · Blog · Eli Perkins"
description = "How I've made my workflow more efficient with `git-pile` and gotten feedback on my work faster and easier."
full_description = '''No one likes to review a +4,490/-903 pull request. It's far too much code for one reviewer to hold in their head, and results in worse feedback and slower review times. However, sometimes a large swath of code needs to be changed to close out an issue or to ship a new feature. One of my favorite Kent Beck-isms is "Make the change easy, then make the easy change." for each desired change, make the change easy (warning: this may be hard), then make the easy change— Kent Beck 🌻 (@KentBeck) September 25, 2012 I'm sure my team is tired of hearing me say it, but it's a great way to break down changes into smaller chunks that are easier to reason about and review. Martin Fowler calls this "prepartory refactoring", where changes are made in preparation for the larger change, making it trivial to make the final change. One way to do this is to use a technique called "stacked pull requests." Stacked pull requests is something I've talked about before as part of my "Great Contributions to a Codebase" post. The idea is to break down on monolithic pull request into smaller chunks, each on a separate branch, and where each PR points at the branch ahead of it. Each of these PRs can be reviewed independently, and then merged from the first PR to the last, rebasing along the way as each PR is merged. This daisy-chaining of PRs (as my colleague, Sarah Vessels, calls it) is a pattern of organizing branches where PRs for each piece of functionality make the change easy and then make the easy change. However, this still involves some human overhead, along with the additional git rebase needed to keep merge history clean as each PR is merged. While it's not a ton of work, compounding with CI time, it can make it tough to keep stacked PRs up-to-date. There's tools that have come out like Graphite's Stacked PRs and Modular's Stack PR tool that help automate this process, but I've found a simpler way to manage stacked PRs that doesn't require any additional tooling. Earlier this year, I started using git-pile by Keith Smiley and Dave Lee, which is a Facebook-/Phabricator-influence way of creating stacked PRs. In this approach, instead of creating a branch for each commit and for each PR, as a developer, I commit directly to main on my local working copy, and use git submitpr to have git-pile take that commit and create a PR for it. Under the hood, git-pile uses a separate git worktree of my repo, creating a new branch for each invocation of git submitpr, and then pushing that branch to GitHub to create a PR. My main working copy is always in a state I can anticipate, and without the need for an additional set of metadata from a service like Graphite or to daisy-chain PR after PR to keep developing locally. This involves a bit of a change in my mental model of how I work with git and my codebase. Instead of having a feature-branch-ish approach with daisy-chained stacked PRs, where my functionality lives in a set of n branches, all which depend on each other, instead, I anticipate that my main branch in my local working copy will eventually be the same as what's on origin/main, after responding to feedback from PR review and working with my teammates. However, I'm never blocked from merging my stacked PRs into main because my local main is already up-to-date! No rebasing needed, other than git pull-ing changes from origin/main to my local main. This has also changed how I stack my pull requests too. I've found ways to break down my PRs into idempotent pieces, rather than daisy-chained ones, where I can set myself up by making the change easy, and then finally making the easy change once the other PRs have been merged. Let's look at a contrived example. Say I'm working on a feature that requires: Changing legacy code to add a new isFeatureXYZEnabled property Creating a new controller that's used when isFeatureXYZEnabled == true Changing the behavior within the legacy code to use the new controller if the feature is enabled In a stacked PR model, I'd have three PRs, each dependent on the one before it. So something like: [1/3] Add a new isFeatureXYZEnabled property+400/-90 merging ep/add-xyz-feature into main • 1 commit [2/3] Add ModernXYZController for the new feature+215/-33 merging ep/add-modern-xyzcontroller into ep/add-xyz-feature • 1 commit [3/3] Use ModernXYZController if enabled+10/-30 merging ep/enable-xyz into ep/add-modern-xyzcontroller • 1 commit However, with a "stackless" stacked PR model with git-pile, I can break this down into two PRs that are idempotent where PR #1 and #2 can be merged in any order (or even simulatenously with a merge queue), and where the third PR can either be stacked on the first two, or wait until I've gotten feedback on the first two and have them merged into main. So something like: Add a new isFeatureXYZEnabled property+400/-90 merging ep/add-xyz-feature into main • 1 commit Add ModernXYZController for the new feature+215/-33 merging ep/add-modern-xyzcontroller into main • 1 commit [Draft] Use ModernXYZController if enabled+625/-123 merging ep/enable-xyz into main • 3 commits This has sped up my personal development loop a ton, where I can assume that PRs #1 and #2 will get feedback from my team and get merged into origin/main at any point, just like I already have in my local working copy of main! No more branch-of-a-branch-of-a-branch while I get feedback from my team, or needing to rebase daisy-chained PRs. Yes, there are totally times when stacked PRs are needed, and git-pile even supports that flow with the --onto flag, however, this change in my workflow has led me personally to making the change easy first, and then making the easy change. So after merging my PRs in upstream, upstream looks very similar to my local main branch: There's so much more that git-pile does, and I feel like I've only personally become comfortable with a portion of it yet. However, this notion of stackless stacked PRs is something that can be adopted even without git-pile (even though it does make it so much easier). Strive to make Kent Beck happy: make the change easy, then make the easy change. And do it with small, reviewable PRs. 🚀'''
author = "Eli Perkins"
year_published = 2024
clearnet = "https://blog.eliperkins.me/stackless-stacked-prs"
