["https://blog.emilburzo.com/2014/06/analiza-parcului-auto-din-romania"]
title = """
Analiza parcului auto din România ::    Emil Burzo"""
description = """
Introducere
Folosind date publice, vom efectua o analiză asupra parcului auto din România."""
full_description = "Analiza parcului auto din România 2014-06-24 #română #procesare date #SQL Introducere Folosind date publice, vom efectua o analiză asupra parcului auto din România. Sursă date Au fost preluate de pe http://date.gov.ro/, o inițiativă de publicare a datelor publice, într-un format deschis, fără restricții copyright. O inițiativă demnă de lăudat. Datele cuprind situația parcului auto din România la data de 31 Decembrie 2013. Curățenie Având 202 400 înregistrări și probabil exportate dintr-un sistem de evidență, e de așteptat ca datele să nu fie perfecte. După cum se poate observa, multe modele identice sunt scrise într-un mod diferit. Deoarece cantitatea de date este substanțială, prelucrarea manuală ar dura foarte mult. Recurgem astfel la Google Refine, un soft creat special pentru curățat date. Nu voi reda aici pașii urmați pentru prelucrare deoarece există documentație suficientă pe pagina proiectului; puteți totuși urmări o mică demonstrație asupra ce se poate face. Import în PostgreSQL Pentru realizarea statisticilor mai ușor, vom importa CSV-ul curățat într-o bază de date. În continuare am folosit PostgreSQL, deoarece mi se pare cel mai accesibil. Structură tabelă CREATE TABLE parc_auto ( JUDET varchar, CATEGORIE_NATIONALA varchar, CATEGORIA_COMUNITARA varchar, MARCA varchar, DESCRIERE_COMERCIALA varchar, TOTAL integer ); Import din CSV COPY parc_auto FROM '/tmp/parc-auto-2013-clean.csv' DELIMITER ',' CSV HEADER; Statistici Top 10 producători Tabel top 100 producători Producător Total DACIA 1587330 VOLKSWAGEN 692874 OPEL 501393 FORD 353927 RENAULT 288016 DAEWOO 230484 SKODA 200052 FIAT 149283 AUDI 145773 MERCEDES BENZ 144843 PEUGEOT 141386 BMW 128307 MERCEDES-BENZ 63661 HYUNDAI 63550 TOYOTA 62565 SEAT 59859 IVECO 54105 CITROEN 53327 CHEVROLET 52220 ARO 43186 NISSAN 40139 VOLVO 39440 ROMAN 38201 SUZUKI 37322 MAN 35340 OLTCIT 32303 MITSUBISHI 31285 HONDA 30976 U.T.B. 27956 SCHMITZ 24829 KIA 24677 DAF 18569 MARSA 18299 PADIS 18027 MAZDA 17806 STE