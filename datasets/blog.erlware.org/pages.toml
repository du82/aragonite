["https://blog.erlware.org/major-opado-speed-up-with-publish"]
title = "Major OpaDo Speed-Up with @publish · Erlware Blog"
description = "I received a patch for OpaDo from Francois Regis Sinot that has made the hosted OpaDo http://opado.org on Dotcloud MUCH faster, adding and removing item is now"
full_description = "7 November 2011 / #dotcloud #Functional Programming Major OpaDo Speed-Up with @publish I received a patch for OpaDo from Francois Regis Sinot that has made the hosted OpaDo http://opado.org on Dotcloud MUCH faster, adding and removing item is now instantaneous. He placed @publish around explicitly server side functions that caused adding todo items to go from 21 to 1 server calls. I thought this simple but maybe not obvious for new Opa developers (it certainly wasn’t to me!) needed a blog post so that beginners like my self may find it and be able to start using the @publish directive. Check out the Opa manual for some more information on @publish, specifically I’d look at Section 4.7.4 and 10.2 Below are the changes he made. Which you can also of see in the commit diff on Github and check out the entire source. Tristan Sloughter #cloud #Functional Programming #Javascript #Opa #Web Opa Plugin Development with a PubNub Example This will be a two part series of posts on writing plugins for Opa. One of Opa’s greatest features is you write everything in the functional, staticly typed Opa language. This even includes the frontend code you’d usually do in Javascript. This means your code is less error-prone which significantly reduces the amount of time spent on debugging code. But how do you use Javascript library X within your Opa code? ... Tristan Sloughter #Erlang #Functional Programming Erlang DC: December 3rd, 2011 ErlangDC is coming up in a month and will be featuring our own Eric Merritt speaking on building enterprise applications with Erlang and Sinan, as well as other great presentations from Erlang experts. You can still submit your own proposal. Get your tickets now! Tristan Sloughter"
