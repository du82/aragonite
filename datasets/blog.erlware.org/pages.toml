["https://blog.erlware.org/erlang-postgres-connection-pool-with-episcina"]
title = "Erlang Postgres Connection Pool with Episcina · Erlware Blog"
description = "Almost exactly a year ago I was looking to merge the many forks of Will Glozer&rsquo;s Postgres client for use in a project at Heroku. Instead Semiocast release"
full_description = "5 May 2014 / #Databases #Erlang Erlang Postgres Connection Pool with Episcina Almost exactly a year ago I was looking to merge the many forks of Will Glozer’s Postgres client for use in a project at Heroku. Instead Semiocast released their client, I gave it a try and never looked back. (But note that David Welton, a braver person than me, is working on merging the forks of epgsql at this time). I found Semiocast’s client to be clean, stable and I liked the interface better. At the same time I was in the need of a connection pooler. Many have relied on poolboy or pooler for this purpose but neither actually fits the use case of connection pooling that well. Luckily Eric and Jordan were in the need at the same time and created the Erlware project episcina, which they based off of Joseph Wecker’s fork of Will Glozer’s epgsql pool. Episcina differs in that it is purely for connection pooling, it is not for pooling workers and it is not for pooling generic processes. Here I’ll show how I combined the two in a simple example. To start we have a sys.config file to configure episcina: A key thing to note here is the connect and close providers are function calls to modules within the project and not the Postgres client. Episcina requires a return value of {ok, pid()} and the Semiocast client returns {pgsql_connection, pid()}, so we wrap the connection calls to get around that: And here is the query function to get a connection and return it to the pool after completion: This example project uses relx to build a release which will start episcina on boot: Boot the release to an interactive shell and play around: Tristan Sloughter Designing for Actor Based Systems Many people are intrigued and excited about Erlang style concurrency. Once they get the capability in their hands though they realize that they don’t know how to take advantage of the capabilities processes or actors provide. To do this we need to understand how to decompose systems with process based concurrency in mind. Keep in mind, that this material works equally well for actors in Scala or agents in F#. Differences between actors and processes don’t much matter for the sake of this discussion. ... Martin J. Logan"
