full_description = "27 April 2012 / #API #batman.js Erlang, Cowboy and Batman.js for Building Web Applications I’ll have a complete walk of through using Cowboy and Batman.js to build the TodoMVC clone in a few days. For now I have the slides from my talk at the Chicago Erlang User Group: Chicago Erlang User Group April, 4th 2012 I couldn’t get iframe embedding to work with Wordpress… So if anyone knows what that is up with please comment. Tristan Sloughter #batman.js #Cowboy #Erlang #Javascript #RESTful #web development #Webmachine Cowboy and Batman.js for Erlang Web Development Why Cowboy and Batman.js There are a lot of Erlang web frameworks out there today. Not all are modeled after the MVC model (see Nitrogen), but I think all of them are addressing the problem the wrong way. I recently gave a presentation, slides here and the code for this example here, describing my perferred method for using Erlang for web development and why I think it is the best way to go. ... Tristan Sloughter #Erlang Erlang/OTP Release Structure How to organize Erlang/OTP releases over on my personal blog. Worth reading if you are in the process of figuring out how to manage Erlang in your organization. Tristan Sloughter"
