title = "Erlang · Erlware Blog"
description = "A collection of 26 posts"
full_description = "#Erlang Erlang/OTP Release Structure How to organize Erlang/OTP releases over on my personal blog. Worth reading if you are in the process of figuring out how to manage Erlang in your organization. Tristan Sloughter #Erlang New Screencast: Sinan - Building Enterprise Erlang Applications [vimeo http://www.vimeo.com/34177001 w=400&h=220] Sinan - Building Enterprise Application from Eric Merritt on Vimeo. Tristan Sloughter #Erlang #Functional Programming Erlang DC: December 3rd, 2011 ErlangDC is coming up in a month and will be featuring our own Eric Merritt speaking on building enterprise applications with Erlang and Sinan, as well as other great presentations from Erlang experts. You can still submit your own proposal. Get your tickets now! Tristan Sloughter #Erlang #pubnub #pubsub #simple_one_for_one #Web Erlang PubNub Client and Chat I was thoroughly impressed with PubNub, a publish/subscribe service, when I first read their articles and played around with it some in Javascript. But obviously I need an Erlang API if I’m going to really use it! So I’ve created ePubNub. In the ePubNub README you’ll find information on some basic usage of the application. You don’t have to do anything more than use the epubnub.erl module to publish and subscribe (by either providing a PID to send messages to or a function handler to process each). ... Tristan Sloughter #CouchDB #Erlang #simple_one_for_one #Web #Webmachine eCloudEdit Part 2: CouchDB In my last post I showed the Webmachine backend to James Yu’s CloudEdit app in Backbone.js. What was left out was, where are the documents stored? Here I’ll show how this is done with CouchDB. And you can give the app a try at http://erlware.org:8080 First, a new Erlang app is needed that we’ll call ece_db. Three modules are implemented, one that starts the app by calling the supervisor’s start function, the supervisor itself that sets up a simple_one_for_one and the gen_server that handles the frontends requests for creating and modifying documents in CouchDB. ... Tristan Sloughter"
