full_description = "5 January 2012 / #Erlang New Screencast: Sinan - Building Enterprise Erlang Applications [vimeo http://www.vimeo.com/34177001 w=400&h=220] Sinan - Building Enterprise Application from Eric Merritt on Vimeo. Tristan Sloughter #Erlang Erlang/OTP Release Structure How to organize Erlang/OTP releases over on my personal blog. Worth reading if you are in the process of figuring out how to manage Erlang in your organization. Tristan Sloughter #cloud #Functional Programming #Javascript #Opa #Web Opa Plugin Development with a PubNub Example This will be a two part series of posts on writing plugins for Opa. One of Opa’s greatest features is you write everything in the functional, staticly typed Opa language. This even includes the frontend code you’d usually do in Javascript. This means your code is less error-prone which significantly reduces the amount of time spent on debugging code. But how do you use Javascript library X within your Opa code? ... Tristan Sloughter"
