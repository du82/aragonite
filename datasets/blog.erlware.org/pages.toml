["https://blog.erlware.org/rebar3-building-docker-images"]
title = "Rebar3: Building Docker Images · Erlware Blog"
description = "How I cut the time it takes to build an Erlang docker image in half. While adding support for a rebar3 option to only build dependencies and not project applica"
full_description = "18 September 2018 / #Erlang #rebar3 Rebar3: Building Docker Images How I cut the time it takes to build an Erlang docker image in half. While adding support for a rebar3 option to only build dependencies and not project applications, rebar3 compile --deps_only, I realized it might already actually work for the Docker use case I had in mind. So I gave it a try and, yup, turns out it does! The idea is to cache a docker layer of the built dependencies to reuse if they haven’t changed. This is done by copying only the config files, which if changed will then invalidate the next Dockerfile commands, and build only the dependencies in the next layer. After that you copy in the source of your project as usual and build the release. # build and cache dependencies COPY rebar.config rebar.lock /usr/src/app/ RUN rebar3 compile # copy in the vonnegut source and build release COPY . /usr/src/app RUN rebar3 as prod tar No new functionality needed, just plain rebar3 compile does what we need when it is given a directory with only the config and/or lock file. After copying in the rest of the project rebar3 as prod tar will compile the project’s source (the tar provider depends compile, so we don’t need to call compile directly) and build a release tarball we can copy to a new image in the next stage. A quick test with the vonnegut Dockerfile I found the build times dropped from ~30 seconds to ~14 seconds. The initial build with only the Erlang image cached, so the packages and rebar3 still have to be installed, is around 50 seconds. Note that this also works when only copying rebar.lock. Only copying the lock file may be beneficial to some who don’t care about caching plugins and prefer to be able to change the rebar config without it invalidating the cache. Also, we will still be merging in the --deps_only option as it likely has uses outside of building Docker images. Tristan Sloughter #Erlang #proper #property testing A Little on Property-Based Testing with PropEr Fred Hebert’s latest book Property-Based Testing with PropEr, Erlang and Elixir is out in a print version from The Pragmatic Programmers. If you are like me you’ve known you need to figure out property testing for a long time now and keep putting it off. Now that there is a book, with a free version even, it is the best time to get going. The book even details avoiding a common pitfall that I certainly fall into anytime I’ve tried picking up property based testing: attempting to shoehorn property testing in to any problem even when a regular unit test is a better fit. ... Tristan Sloughter"
year_published = 2018
