full_description = "16 April 2013 Deal of the Day - Half off Erlang and OTP in Action Here is your chance to get our book Erlang and OTP in Action for half price on April 16th. Use code dotd0416au at www.manning.com/logan/ Tristan Sloughter Universal Makefile for Erlang Projects That Use Rebar This post sponsored by ErlangCamp 2013 in Nashville and Amsterdam At this point in the game nearly every Erlang project uses Rebar. The problem with that is that Rebar’s approach to the command line and command dependency chaining is leaves a lot to be desired. You tend to end up typing the same command with the same options list over and over again during the course of your work. Because of the poor dependency chaining you often must retype the same sequence of commands as well. ... Tristan Sloughter #buildpacks #heroku #node.js #Opa #web development Running Opa Applications on Heroku TL;DR As I’ve mentioned before, Opa is a new web framework that introduces not only the framework itself but a whole new language. A lot has changed in Opa since I last posted about it. Now Opa has a Javascript-esque look and runs on Node.js. But it still has the amazing typing system that makes Opa a joy to code in. The currently available Heroku buildpack for Opa only supported the old, pre-Node, support. ... Tristan Sloughter"
