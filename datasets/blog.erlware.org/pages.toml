["https://blog.erlware.org/adding-js-to-all-opa-resources-use-case-google-analytics"]
title = "Adding JS To all Opa Resources: Use Case Google Analytics · Erlware Blog"
description = "I decided I wanted to add Google Analytics to OpaDo but had no idea how to easily tell each page to include the necessary Javascript. I asked on the Opa mailing"
full_description = "6 November 2011 / #Javascript #Opa Adding JS To all Opa Resources: Use Case Google Analytics I decided I wanted to add Google Analytics to OpaDo but had no idea how to easily tell each page to include the necessary Javascript. I asked on the Opa mailing list and got a quick and simple response. Frederic Ye pointed me to Resource.register_external_js It couldn’t have been any easier. You simply place your google_analytics.js file in your project and use the Resource.register_external_js function to modify the default customization of all Resources. See code below or on the github repo. For a longer article/tutorial on dealing with external resources check out this blog post from the Opa team Dealing with External Resources. Tristan Sloughter #Erlang #Functional Programming Erlang DC: December 3rd, 2011 ErlangDC is coming up in a month and will be featuring our own Eric Merritt speaking on building enterprise applications with Erlang and Sinan, as well as other great presentations from Erlang experts. You can still submit your own proposal. Get your tickets now! Tristan Sloughter #Functional Programming #Opa Opa Database Migrations Nicolas Glondu posted a comment on an earlier post detailing ways for doing database migrations with Opa. I thought it was useful enough that I should put up a post around it: If you have complex changes in database structures in a OPA program, you have two choices : > 1 – Keep both structure in your database and create a function which populates the new empty field from the other fields. ... Tristan Sloughter"
