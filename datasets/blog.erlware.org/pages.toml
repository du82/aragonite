["https://blog.erlware.org/tags/rebar3"]
title = "rebar3 · Erlware Blog"
description = "A collection of 10 posts"
full_description = '#Erlang #rebar3 #docker Rebar3: Building Docker Images How I cut the time it takes to build an Erlang docker image in half. While adding support for a rebar3 option to only build dependencies and not project applications, rebar3 compile --deps_only, I realized it might already actually work for the Docker use case I had in mind. So I gave it a try and, yup, turns out it does! The idea is to cache a docker layer of the built dependencies to reuse if they haven’t changed. ... Tristan Sloughter #Erlang #rebar3 #relx #OTP OTP-21: New sys_config_src option in relx With the release of OTP-21 and rebar3 3.6.0, which includes a new relx 3.25.0, there is better support for dynamic configuration of releases at runtime. If you are new to this concept checkout the rebar3 docs first No longer will you be forced to declare RELX_REPLACE_OS_VARS and convert strings to integers in your code because the sys.config file had to be valid Erlang terms when building the release. Instead, you can use {sys_config_src, "config/sys. ... Tristan Sloughter #Erlang #rebar3 Rebar3 Hex Plugin No plugin is needed for using Hex packages in your project, covered in documentation here, but at this time the plugin rebar3_hex is needed for publishing. The plugin provides support for registering with hex.pm and publishing packages. For instructions on registering see the rebar3 hex.pm documentation, here we’ll cover publishing a package with some unique features to the rebar3 plugin. rebar3 hex cut The cut command provides some automation on top of publish. ... Tristan Sloughter #Erlang #rebar3 Rebar3 Features (part 6): _checkouts In a build tool there is often a balancing act between ensuring repeatability and efficiency for the user. Wanting to make modifications on a dependency of your project is a common case of this. In rebar2 you could simply modify the source under deps/ and running rebar compile would pick those up. This meant that the contents of deps/ are not representative of the dependencies listed in rebar.config. With rebar3 a dependency is never rebuilt, even if a source file changes. ... Tristan Sloughter'
