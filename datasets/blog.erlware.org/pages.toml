["https://blog.erlware.org/announcing-erlangdc-an-epic-one-day-erlang-conference-in-the-washington-dc-area"]
title = "Announcing ErlangDC: An Epic One-Day Erlang Conference in the Washington, DC Area · Erlware Blog"
description = """
We are happy to announce ErlangDC: An Epic One-Day Erlang Conference in the Washington, DC area.
New to Erlang? Learn the basics — and find out why Erlang shoul"""
full_description = "11 October 2011 Announcing ErlangDC: An Epic One-Day Erlang Conference in the Washington, DC Area We are happy to announce ErlangDC: An Epic One-Day Erlang Conference in the Washington, DC area. New to Erlang? Learn the basics — and find out why Erlang should be in your programmer’s toolkit — during the morning bootcamp. Meet fellow DC-area Erlang enthusiasts at lunch. Learn advanced Erlang techniques in the afternoon tech talks. Swap Erlang war stories and make lifelong friends over pints at the post- conference Happy Hour. It will be reliably awesome. Just like Erlang. ErlangDC is organized by the local DC Erlang Meetup Group, with help from Erlang Solutions and Erlang Factory. The event will be hosted at the AOL Headquarters in Dulles, VA. Sign up when you get a chance. The early-bird tickets have been sold out fast! Tickets are only $40. Tristan Sloughter #dotcloud #Functional Programming #OCaml #Opa #Web OpaDo: Personal ToDo Lists This is a continuation of two past posts (one, two) on my first application with Opa called OpaDo. You can try the live demo here and check out the full source code on Github Updating OpaDo to add user accounts the project structure has been changed a bit and modularized. Below is the new project layout. Now there is a main, todo and user module. The main module is the entry point for the app and looks like: ... Tristan Sloughter #cloud #dotcloud #Opa #Web OpaDo Data Storage OpaDo (a port of the TodoMVC app to Opa) now persists todo items to the Opa database. The new version is up on dotcloud, http://opado-tristan.sloughter.dotcloud.com/ I’ve added a todo_item type which stores the item’s value and two other attributes we won’t use until the next post when we have user accounts for their own todo_item stores. To tell Opa where to store the records we’ll create, we provide a path to the Opa db function and set its type. ... Tristan Sloughter"
