full_description = "9 May 2012 Erlang Common Test Continuous Integration Common Test is a well thought out integration testing framework for Erlang. If you are not using it you probably should be. However, it has one fault. It does not return non-negative exit status' to the caller when the tests fail. This is a major oversight, and it makes it difficult to use as part of a continuous integration scheme or in a make based build system. The long term fix is for the OTP folks to resolve the issue in the ct_run command. To that end I have filed a bug report with the Erlang folks. In the short term, though, we need this behaving correctly. After much twiddling around with different solutions and conversions on the erlang-questions list. This solution finally popped out of a conversation with Lukas Larsson. Basically, we use the old unix standby of awk. Where ... is replaced with your additional options. Its not the best solution on the planet, but it is the simplest one that I found that works consistently. Tristan Sloughter #Emacs #Erlang Getting Flymake and Rebar to Play Nice TLDR; Copy and paste the following into your elisp erlang-mode configuration to get flymake working with Rebar projects. Intro Its probably no great surprise to anyone that I dislike Rebar a lot. That said there are times when I have no choice but to use it. This is always either because a company I am contracting for uses it, or an open source project I am contributing to uses it. When I am forced to use it there are a few things I don’t want to give up. ... Tristan Sloughter #Cowboy #Erlang #OTP #rebar #sinan Sinan Releases and Being Right Fred, of Learn You Some Erlang for Great Good, today posted on his blog about the problems around how rebar handles releases, Rebar Releases and Being Wrong. The problems he mentions and a few others are why, despite giving it a legitimate shot, I have found rebar unusable for my workflow to be efficient and stable while adhering to OTP standards at the same time. I suggest first reading his post, if you already use rebar, and then continuing on with the rest of this. ... Tristan Sloughter"
