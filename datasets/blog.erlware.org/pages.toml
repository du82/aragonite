["https://blog.erlware.org/automatic-hex-package-publishing-with-travis-ci"]
title = "Automatic Hex Package Publishing with Travis-CI · Erlware Blog"
description = """
Note: Travis CI does not yet provide rebar3 as a build tool for Erlang projects, so you will have to include a rebar3 executable escript in your repository.
In"""
full_description = '''19 November 2015 Automatic Hex Package Publishing with Travis-CI Note: Travis CI does not yet provide rebar3 as a build tool for Erlang projects, so you will have to include a rebar3 executable escript in your repository. In your application’s .app.src file use "git" as the version. This will replace the version string with the current tag when publishing the hex package: {vsn,"git"}, In the .travis.yml configuration add the below section so that the script scripts/hex.sh is run everytime a new tag is made: deploy: provider: script script: scripts/hex.sh on: tags: true Create the script hex.sh under scripts/ and make it executable: #!/usr/bin/env bash ## Setup hex user mkdir -p ~/.hex echo '{username,<<"'${HEX_USERNAME}'">>}.' > ~/.hex/hex.config echo '{key,<<"'${HEX_KEY}'">>}.' >> ~/.hex/hex.config ## Add the rebar3 hex plugin to global mkdir -p ~/.config/rebar3 echo '{plugins, [rebar3_hex]}.' > ~/.config/rebar3/rebar.config ./rebar3 hex publish <<EOF y EOF In the script it relies on two environmental variables $HEX_USERNAME and $HEX_KEY. Using either the Travis CLI tool or web interface you can create these variables and have the values encrypted or unseen by viewers of your repository. For instructions see the Travis-CI environment variables docs. Tristan Sloughter #Erlang #rebar3 #relx #OTP OTP-21: New sys_config_src option in relx With the release of OTP-21 and rebar3 3.6.0, which includes a new relx 3.25.0, there is better support for dynamic configuration of releases at runtime. If you are new to this concept checkout the rebar3 docs first No longer will you be forced to declare RELX_REPLACE_OS_VARS and convert strings to integers in your code because the sys.config file had to be valid Erlang terms when building the release. Instead, you can use {sys_config_src, "config/sys. ... Tristan Sloughter #Erlang #rebar3 Rebar3 Hex Plugin No plugin is needed for using Hex packages in your project, covered in documentation here, but at this time the plugin rebar3_hex is needed for publishing. The plugin provides support for registering with hex.pm and publishing packages. For instructions on registering see the rebar3 hex.pm documentation, here we’ll cover publishing a package with some unique features to the rebar3 plugin. rebar3 hex cut The cut command provides some automation on top of publish. ... Tristan Sloughter'''
