["https://blog.erlware.org/page/4"]
title = "Erlware Blog"
description = "Erlang tools and packaging"
full_description = "#Erlang New Screencast: Sinan - Building Enterprise Erlang Applications [vimeo http://www.vimeo.com/34177001 w=400&h=220] Sinan - Building Enterprise Application from Eric Merritt on Vimeo. Tristan Sloughter #cloud #Functional Programming #Javascript #Opa #Web Opa Plugin Development with a PubNub Example This will be a two part series of posts on writing plugins for Opa. One of Opa’s greatest features is you write everything in the functional, staticly typed Opa language. This even includes the frontend code you’d usually do in Javascript. This means your code is less error-prone which significantly reduces the amount of time spent on debugging code. But how do you use Javascript library X within your Opa code? ... Tristan Sloughter #dotcloud #Functional Programming #Opa #Web Major OpaDo Speed-Up with @publish I received a patch for OpaDo from Francois Regis Sinot that has made the hosted OpaDo http://opado.org on Dotcloud MUCH faster, adding and removing item is now instantaneous. He placed @publish around explicitly server side functions that caused adding todo items to go from 21 to 1 server calls. I thought this simple but maybe not obvious for new Opa developers (it certainly wasn’t to me!) needed a blog post so that beginners like my self may find it and be able to start using the @publish directive. ... Tristan Sloughter #Erlang #Functional Programming Erlang DC: December 3rd, 2011 ErlangDC is coming up in a month and will be featuring our own Eric Merritt speaking on building enterprise applications with Erlang and Sinan, as well as other great presentations from Erlang experts. You can still submit your own proposal. Get your tickets now! Tristan Sloughter #Javascript #Opa #Web Adding JS To all Opa Resources: Use Case Google Analytics I decided I wanted to add Google Analytics to OpaDo but had no idea how to easily tell each page to include the necessary Javascript. I asked on the Opa mailing list and got a quick and simple response. Frederic Ye pointed me to Resource.register_external_js It couldn’t have been any easier. You simply place your google_analytics.js file in your project and use the Resource.register_external_js function to modify the default customization of all Resources. ... Tristan Sloughter"
