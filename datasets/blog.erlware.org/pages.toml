full_description = "#Chef #Devops #Opscode Centos6 : Chef Node Creation I thought I’d share the scripts I use to take a fresh Centos6 install and have it configured to work with a Chef server. Maybe its not as easy as when running in a virtualized environment, but it saves plenty of time. On the new node I run the setup_client.sh script which calls in the end client_gen.sh on the Chef server once everything is installed on the node. I left the version numbers for Ruby and Chef in the script so you know what versions I’ve tested this with. ... Tristan Sloughter Mixed Erlang and Scala with Scalang This is a summary of a talk by Cliff Moon @moonpolysoft given at Strangeloop about building mixed Erlang and Scala systems with Scalang. Boundary does network analytics as a service. Their architecture uses a mixture of Erlang and Scala. Erlang is very very good at doing things like no down time deploys. We can have very low downtime on public facing parts of the system and we don’t even have to go down for deploys. ... Tristan Sloughter #batman.js #coffeescript #Javascript #js #knockout.js #RESTful Batman.js vs Knockout.js The following is NOT a tutorial for either Batman.js or Knockout.js. But, it is instead a sort of side-by-side comparison of the two for creating a user creation form that POSTs the new user’s data as JSON to the backend. The method of web development I’ve come to find the best is based on heavy frontend Javascript (though written in Coffeescript) communicating with a backend via a RESTful interface. This is appealing, because you are not cluttering the application logic with view related code. ... Tristan Sloughter Property based testing for unit testers with PropEr - Part 1 This tutorial is brought to you by ErlangCamp 2011 (click here) - Boston, August 12th and 13th - It’s gonna be totally sweet! Main contributors: Torben Hoffmann, Raghav Karol, Eric Merritt The purpose of the short document is to help people who are familiar with unit testing understand how property based testing (PBT) differs, but also where the thinking is the same. This document focusses on the PBT tool ... Tristan Sloughter"
