full_description = "26 September 2012 / #Erlang Maru Models: JSON to Erlang Record with Custom Types Working with Erlang for writing RESTful interfaces JSON is the communication “language” of choice. For simplifying the process of JSON to a model the backend could work with efficiently I’ve created maru_models. This app decodes the JSON with jiffy and uses functions generated by a modified version of Ulf’s exprecs to create an Erlang record. The generated functions are created with type information from the record definition and when a property is set for the record through these functions it is first passed to the convert function of maru_model_types to do any necessary processing. I separated this application into a separate repo to simplify people trying the examples. But the real development will be done in the Maru main repo. Tristan Sloughter #Emacs #Erlang #Functional Programming #OTP #rebar Projmake-mode: Flymake Replacement There is a great new Emacs plugin from Eric Merritt that like FlyMake builds your code and highlights within Emacs any errors or warnings, but unlike FlyMake builds across the whole project. You can clone the mode from here projmake-mode After cloning the repo to your desired location add this bit to your dot emacs file, replacing <PATH> with the path to where you cloned the repo. [gist]3794732[/gist] This Emacs code also uses add-hook to set projmake-mode to start for erlang-mode is loaded. ... Tristan Sloughter #Emacs #Erlang Getting Flymake and Rebar to Play Nice TLDR; Copy and paste the following into your elisp erlang-mode configuration to get flymake working with Rebar projects. Intro Its probably no great surprise to anyone that I dislike Rebar a lot. That said there are times when I have no choice but to use it. This is always either because a company I am contracting for uses it, or an open source project I am contributing to uses it. When I am forced to use it there are a few things I don’t want to give up. ... Tristan Sloughter"
