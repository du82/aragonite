full_description = '#Erlang Running Erlang Releases without EPMD on OTP 23.1+ Erlang/OTP deployments that want to provide shell access or cluster nodes relied on something called the Erlang Port Mapper Daemon (EPMD), a separate process that handled all distribution mechanisms. Previous attempts at working around this requirement used third party dependencies such as epmdless and required specific configuration arguments to the VM to setup. This was not ideal and was easy to get wrong. With Erlang/OTP 23.1 and relx 4.2 (included in Rebar3 3. ... Tristan Sloughter #Erlang #proper #property testing A Little on Property-Based Testing with PropEr Fred Hebert’s latest book Property-Based Testing with PropEr, Erlang and Elixir is out in a print version from The Pragmatic Programmers. If you are like me you’ve known you need to figure out property testing for a long time now and keep putting it off. Now that there is a book, with a free version even, it is the best time to get going. The book even details avoiding a common pitfall that I certainly fall into anytime I’ve tried picking up property based testing: attempting to shoehorn property testing in to any problem even when a regular unit test is a better fit. ... Tristan Sloughter #Erlang #rebar3 #docker Rebar3: Building Docker Images How I cut the time it takes to build an Erlang docker image in half. While adding support for a rebar3 option to only build dependencies and not project applications, rebar3 compile --deps_only, I realized it might already actually work for the Docker use case I had in mind. So I gave it a try and, yup, turns out it does! The idea is to cache a docker layer of the built dependencies to reuse if they haven’t changed. ... Tristan Sloughter #Erlang #rebar3 #relx #OTP OTP-21: New sys_config_src option in relx With the release of OTP-21 and rebar3 3.6.0, which includes a new relx 3.25.0, there is better support for dynamic configuration of releases at runtime. If you are new to this concept checkout the rebar3 docs first No longer will you be forced to declare RELX_REPLACE_OS_VARS and convert strings to integers in your code because the sys.config file had to be valid Erlang terms when building the release. Instead, you can use {sys_config_src, "config/sys. ... Tristan Sloughter'
