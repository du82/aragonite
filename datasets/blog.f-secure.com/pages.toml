["https://blog.f-secure.com/podcast-ransomware-payment-regulation"]
title = "Episode 56: To Ban or Not To Ban? Ransomware Payment Regulation - F-Secure Blog"
description = "Many people argue that the way to discourage ransomware is to implement an outright ban on ransom payments. Is this suggestion idealistic or realistic? How would such a ban affect companies, and what are the alternatives? Päivi Tynninen of the Finnish National Cybersecurity Center and Jordan LaRose of F-Secure are guests for episode 56 of Cyber Security Sauna."
full_description = "Ransomware payment amounts have skyrocketed over the past year. As threat actors keep getting richer, they have more resources to fuel their operations. Many people argue that the way to discourage ransomware is to implement an outright ban on ransom payments. Is this suggestion idealistic or realistic? How would such a ban affect companies, and what are the alternatives? For episode 56 of Cyber Security Sauna, Päivi Tynninen of the Finnish National Cybersecurity Center and Jordan LaRose of F-Secure stopped by to share their views. Listen, or read on for the transcript. And don’t forget to subscribe, rate and review! ALL EPISODES | FOLLOW US ON TWITTER Janne: Welcome to the show. Paivi: Thanks. Good to be here. Jordan: Hello everybody. So what kind of payments are these criminals usually after? Jordan: I see a lot of ransomware cases day to day. I’m boots-on-the-ground incident response. So when I see the ransomware payments demanded, the amounts vary wildly. Quite honestly, I think the amount is based off of not just who the actor is, but also who they think the company is. The more money they think the company has, the larger payment they’re going to demand. Päivi Tynninen, Jordan LaRose So they’re sizing the victim up and sort of figuring out, like, “This is how much money I think you have and would be willing to pay me.” Jordan: Yes. And what I can also say is when it comes to ransomware payment negotiation, I know that a lot of negotiating parties will offer something, sometimes 10, 5% of the initial number, and the attacker will take that amount. Oh, wow. Jordan: So it’s almost like calling a bluff in a card game. Paivi: Yeah. And especially in opportunistic attacks like those, you really should take everything you’re getting, because I think the expectations in each successful ransomware attack is that they are not getting paid. So if they’re offering something, I think it makes a whole lot of sense to take the amount that is being offered. Yeah. Whatever you can get. All right. So let’s talk about the argument for banning ransomware payments outright. What’s the argument in favor of this? Jordan: In the US, the Department of Treasury actually released a sanctioning on ransomware payments. Specifically, to certain countries and regions that are considered a risk by the Department of Treasury or sanctioned countries. So, the reasoning behind it is greater good. If you pay a ransomware actor, you individually may have your data recovered and decrypted, and you can resume operations. But then you are providing funding for them to carry out the next ransomware operation. It’s almost like passing the problem downhill rather than addressing it and trying to solve it. I heard that argument, for example, with the Colonial Pipeline incident, a lot of the eastern seaboard of the United States was having problems with fuel distribution. And the ransomware criminals were asking for 5 million bucks or something that. So 5 million as opposed to holding the entire east coast ransom. Why don’t we just pay it? Right? Jordan: Yeah. A lot of times companies will look at this as a business decision, honestly. Let’s say a company is completely ransomed and all of their operations have come to a stop, that lasting even for just a day can mean millions of dollars in revenue loss for larger companies. So if the attacker’s asking for a million dollars, in a lot of ways, it seems like a no-brainer to just pay the ransom and resume operations and in a way, make a profit of a million or so in having your operations back for that day. But also, good information security is not cheap. So do you guys think companies are sort of, “This is just the cost of doing business. I’m not willing to spend all this money on information security. So if there’s a ransomware thing, I’ll just pay the ransom and I’ll save some money in the end anyway.”? Paivi: I think that sounds more like uninformed decisions. Maybe the risks aren’t communicated that well, what comes with poor cybersecurity. So ransomware attacks are just a minor part of that whole picture. And if we keep communicating to the decision-makers, directors of companies, CXOs, whoever, that the biggest risk with having poor cybersecurity hygiene in your company is the risk of being ransomed against a million, couple of million dollars. That doesn’t paint the whole picture. And it doesn’t make the decision-makers understand what the real risks are and what the real cost is. Yeah. I mean, if you were vulnerable for this one crew, who’s to say there isn’t the next one just around the corner? Jordan: I think on top of that too, one thing you really need to look at is the reputational impact. When this oil pipeline was ransomed, sure, they’re down a few million dollars because they paid the ransom. But on top of that, they’ve lost the trust of essentially the American populace. So if you’re talking about a company that is not supported and backed by the government, if this kind of thing makes the news, it can ruin the company’s reputation, irrevocably. Maybe the cynical argument is like, “So what? What are you going to do now? Build your own pipeline?” Jordan: In the oil pipeline scenario it’s definitely a bit of a different story than most companies have. But I would still argue that something like this will probably prompt people to look into alternative energy resources or ways to not use this oil pipeline that is so much at risk of just going down or being insecure. No, I hear you. But I was thinking the same thing back in the day when the cheating website, Ashley Madison, got hit and their accounts were published. People still kept using their service because they liked their illicit affairs better than they like their privacy. Paivi: That’s the thing, if you don’t have any options, same goes with the critical infrastructure, that you can’t just decide that, “Yeah, I’m going to stop using oil because they have such poor cybersecurity hygiene.” I think the decision-making is happening on the grass level, on the individual level only when it’s reflected, for example, in the oil prices that, for example, paying the ransom is making the oil more expensive for the individuals. That is the only thing that is going to affect the consumer behavior. Yeah. What about on the company’s side? Let’s say that ransom paying is now outlawed and that’s not an option for you, but you got hit by ransomware anyway. So what else can you do as a company? Jordan: Yeah, there’s a very, very slim chance that you may be able to reverse the encryption mechanism, but most ransomware actors at this point have adopted ones that are essentially impossible to reverse. So once you’re hit, there’s not much you can do. And I think one of the key problems when you’re facing ransomware is that security investment, security hygiene and things, those are problems that only really seem to get addressed at most companies after there’s been an attack, or after there’s been a significant impact as a result of poor security. You can’t just respond to this type of thing. You have to be proactive. You have to, at the very least, have some kind of backups of your critical infrastructure. Ideally, you would have security policies in place and defensive measures, but even in a non-ideal world, something like backups, something like, let’s say EDR or something, just those sort of a basic single-item defensive measures are fairly easy to implement. They may be a decent amount of investment, but it’s worth its weight in gold when you’re facing a scenario like this. That’s the thing. It’s not just about getting your information back. These days, criminals are also threatening to publish your information. Let’s say I’m a hospital and I’m sitting on a lot of people’s health records and personally identifiable information, like that. I don’t want that published out there. So if I can’t pay the ransom, what else can I do? Paivi: But if you’re willing to pay the ransom, that means that you actually believe that the criminal who has stolen that information is actually going to hold up with his end of the deal. That, “Yeah, yeah, yeah. If you pay me enough, I’m not going to sell this information forward to anyone and gain even more money.” Yeah. That makes a whole lot of sense to me. Jordan: Yeah. There’s no guarantee at all that when you pay one of these ransoms that you’re going to get everything back. Even if you get the encryption key, a lot of file types and things like databases, once they’re encrypted, when they’re decrypted, a lot of data can be corrupted in that process. I’ve seen it firsthand, where a crucial customer database was encrypted, decrypted with a decryption key, and when that was done, the database was unusable. And it essentially ruined the value proposition of paying the ransom in the first place because that database was so vital. So there are a lot of reasons, even if you’re planning on paying the ransom, that things might not work out for you. Paivi: Yeah. That is exactly what I’ve seen as well when I’ve looked, for example, for the encryption routines that the criminals have implemented to their ransomware. They are very poorly implemented and they lead to corruption. And even if you have the decryption keys, you are unable to retrieve the information back when it’s been encrypted, because it’s basically corrupted at that point. Staying on the topic of hospitals. Do you guys think that regulators could just cut off these institutions from a potential solution to restoring their operations? Would the lawmakers just be happy with saying, “Yep. We’re not going to pay ransom no matter what. No matter if your hospital is ransomed, people’s private information is about to be leaked. Patients are dying on the tables. We’re sticking to our guns, no paying ransom.” Jordan: I think when we talk about specific scenarios, individual scenarios where maybe people’s lives are at stake, maybe there’s some kind of greater impact to be considered there. I think that’s something that could be handled on a case-by-case basis. And I think the oil pipeline scenario is actually one that’s worth considering here because we don’t really know much about the ransomware actor in that case. I mean, we’ve got some artifacts and things, but as far as attribution, I don’t recall seeing much in the news as to whether or not they fall under that regulation from the Department of the Treasury. And I think the reasoning for that is there was a decision made by maybe the government that it’s worth having the oil pipeline restored. It’s worth having that ransom paid in order to keep operations running. Whether or not those decisions are the right ones, I think, is a different argument. But in the case of this argument, specifically about ransomware, I think the regulation needs to happen across the board as a first step. And then we can start to consider those individual scenarios, once we’ve got that step in place. Paivi: If we think about security outside the cyber realm, for example, if we think about how safe airplanes and cars and such are, they have very strict security regulations and those are being actually followed and monitored. And no one is allowed to operate, for example, an airplane, if that hasn’t passed all of these very rigorous security measures. Why that can’t be implemented, at least to critical infrastructure? It makes a whole lot of sense to me to regulate these kinds of things, that you have very secure infrastructure. It’s been proven decade after decade and on very different topics that it can be done. Why is it impossible in cybersecurity? We can’t say that airplanes are 100% secure, or there are no car accidents, but they are of minimal impact because of these security measures. So I think we just have to accept criminals will be always criminals and there will be always attacks and ransomware incidents and such. But we just have to minimize the impact, at least on critical infrastructure. All right, we come from different countries, Jordan and Päivi and myself. So what if paying ransomware was legal in some countries but illegal in others? Would that cause ransomware actors to focus more on the countries where you can pay the ransom, or is the key here just a global ban and we’ve fixed ransomware, it’s gone now. Paivi: It would definitely lead to a situation that you find ways to transfer the money. You would be able to pay the ransom if you really want to. And what comes through your proposal of implementing these global regulations and restrictions that hasn’t worked, at all, in anything. True, true. Jordan: Yeah. I think when you’re talking about ransomware, it’s almost always an opportunistic attack. It’s an attack where maybe it’s done as a result of a scan across the internet. I mean, a great example of this was WannaCry. That was literally just an automated attack across the entire internet. They just went IP address by IP address, launched the exploit, if it worked, the estate was ransomed. If it didn’t work, it wasn’t ransomed. So I don’t think regulations will stop the attack outright. And I think that’s why, like we’ve been saying, we need to put more regulation in place, not just around whether you pay or you don’t pay, but also around what defenses you must have in place before you even get to the point that you’ve been ransomed. Especially when we’re talking about critical infrastructure, things that people’s lives depend on if it’s ransomed or not. You don’t think that would just encourage the attackers to sort of focus on these critical infrastructure organizations so that there is more pressure to pay the ransom? Jordan: Well, if we’re talking about increasing the security posture of these organizations, the best deterrent is either annoyance or delay. If the regulations force these companies to put in place a lot of security measures…Like I said, these attacks are opportunistic, mostly, in nature. So it’s a complex conversation, but I think at the end of the day, the stronger your cybersecurity posture is even if it’s just in small measures, the better chance you have of not getting hit by a ransomware attack for a myriad of reasons. Paivi: Yeah. And if we think about this from the criminal perspective, that is their job and they are trying to make as good money with as little effort as possible. So if you have a high security posture, the odds are that they are going to look somewhere else where it’s easier to attack and easier to get the ransom. Okay. There was an article on Forbes saying that 90% of organizations who pay the ransom, don’t get all their data back. Is that what you’re seeing as well? Jordan: Absolutely. Yeah. I’ve seen a lot of cases where the ransom is paid and the attacker just either takes the money and runs, or they will take the initial payment, provide a decryption key, but then ransom additional data that they’ve exfiltrated. This is not a transaction that’s verified in any way really. Y"
