["https://blog.f-secure.com/es/como-prevenir-ataques-ciberneticos-en-instagram"]
title = "Cómo prevenir ataques cibernéticos en Instagram - F-Secure Blog"
description = "Ataques en Instagram son cada vez más comunes debido a su creciente popularidad y fallas de seguridad. Sepa como protegerse."
full_description = "Las redes sociales y los problemas de ciberseguridad, un cuento de nunca acabar. Filtración de datos, apropiación de cuenta y robo de identidad son sólo algunos de los peligros a que se exponen los usuarios. Por ejemplo, desde sus inicios en el 2010 se ha cuestionado la seguridad de Instagram. La red social, basada en el uso de fotografías, ha sido criticada por no tomar suficientes precauciones respecto a los datos de sus usuarios. Sin embargo, en una reciente actualización, Instagram ha incorporado una función que permite incluir la autenticación de dos factores (A2F). Esta función es un avance en materia de seguridad en línea. En este artículo le explicamos porqué es tan importante para mejorar la seguridad en Instagram y en general. Blanco de ataques cibernéticos Instagram es un blanco atractivo para cometer ataques cibernéticos. Ya que debido a su creciente popularidad se presta para cometer fraudes cibernéticos. Más aún si consideramos que el número de usuarios de esta red social ya supera los mil millones. No obstante, la plataforma había sido más lenta en la adopción de medidas de ciberseguridad que otras redes sociales. Sin embargo, recientemente lanzó una función de verificación de seguridad (Security Checkup) y una de control de contenido sensible (Sensitive Content Control). En este caso, la más importante de las dos para la protección de datos es la de seguridad, la cual incorpora la autenticación de dos factores (A2F). ¿Pero de qué manera eleva la seguridad digital? A continuación le mostramos cómo. Evitar apropiación de cuenta con A2F La A2F en general es una manera de proteger cualquier cuenta en línea contra el acceso no autorizado. Por ejemplo, se hace mediante una clave única enviada a través de un mensaje de texto o por escaneo biométrico (huella digital, reconocimiento facial). También, a través de una pieza de hardware o una aplicación de autenticación. De este modo, se incorpora otro canal de comunicación de confianza para la cuenta. Es decir, si se detecta una actividad sospechosa en Instagram (o en otra cuenta), como inicio de sesión desde un dispositivo, de una ubicación o de un correo electrónico o no usuales, se envía un código de autenticación. De esta manera, el usuario deberá verificar su identidad. Tom Gaffney, consultor de seguridad de F-Secure señala “Este es un nuevo elemento largamente esperado por el mundo de la ciberseguridad. Instagram se había quedado atrás con respecto a sus pares en términos de de seguridad. Añadir la autenticación de dos factores es algo que todos los servicios en la nube deberían ofrecer, así que este paso de Instagram es más que bienvenido”. Es decir, la nueva función ayuda a prevenir las violaciones de seguridad, las cuales pueden terminar en la apropiación de su cuenta o , peor aún, en el robo de identidad. En el caso de Instagram, aparte de la A2F, la app dispone actualmente de las siguientes medidas de privacidad y seguridad. Por ejemplo, poner su cuenta como “privada”, “eliminar el seguidor”, “Claves de acceso”, “Vea y descargue sus propios datos” y “Borrar entradas”. Sepa cómo la A2F aquí. Phishing y la apropiación de cuenta Cada año, los hackers roban miles de millones de claves producto de las filtraciones de datos en sitios web. También el phishing es un tipo de estafa online muy popular en la que los delincuentes se hacen pasar por personas legítimas u organizaciones. Porque la idea es robar información confidencial, ya sea de las redes sociales o de otros sitios. ¿Porqué existe este tipo de fraude cibernético? Porque la mayoría de las cuentas de usuario contienen valiosa información personal. Por ejemplo, el nombre completo, la dirección del domicilio, el número de teléfono, de la tarjeta de crédito, etc. Es decir, los hackers harán todo lo posible para obtener esta información y ganar dinero con ella. Al mismo tiempo, la preocupación por la seguridad y la privacidad hace que los usuarios estén dispuestos a exigir y a pagar por una mayor seguridad en sus dispositivos conectados (72%) de acuerdo con el reporte de F-Secure “La próxima generación del hogar conectado”. Medidas de seguridad adicionales En el caso de Instagram, la función “Security Checkup” ayudará a elevar la seguridad digital de la cuenta. Pero para prevenir una violación de seguridad, la autenticación de dos factores es sólo una medida a tomar. Además que es importante protegerse de los ataques en general a nuestras cuentas. Además de activar la autenticación de dos factores, los usuarios deben proteger sus datos utilizando una clave única y fuerte para cada cuenta. Por ejemplo, para Netflix, Facebook, Amazon, etc. Lógicamente es difícil recordar un sin fín de passwords. Pero para crear claves fuertes y separadas usted puede usar un gestor de claves. Proteja facilmente sus datos Aún usando claves únicas y sólidas, su cuenta puede ser hackeada. Imaginémos por un momento que esto ha ocurrido y los piratas informáticos consiguieron su clave. ¿Sería capaz de tomar las medidas adecuadas para asegurar su cuenta? La respuesta es no, si no se tiene ni idea de que ha habido filtración de datos. Ahí es donde F-Secure ID PROTECTION es de gran ayuda. F-Secure ID PROTECTION es un administrador de claves que además puede ser configurado para monitorizar sus datos en la web. De esta manera, de producirse una filtración, usted será alarmado. Incluso es posible cambiar su password antes de que los delincuentes tengan tiempo de apoderarse de su cuenta. Más aún, debido a que F-Secure ID PROTECTION también es un administrador de claves, usted además puede generar claves sólidas y únicas y almacenarlas seguramente. Esta poderosa herramienta lo protege de la apropiación de cuentas, del robo de identidad y de otros ciberdelitos. autor: Carolina Heyder"
author = "Luciana Marques"
