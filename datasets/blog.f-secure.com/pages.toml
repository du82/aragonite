["https://blog.f-secure.com/fi/f-secure-ja-withsecure-mita-sinun-tulee-tietaa-2"]
title = "F-Secure ja WithSecure — mitä sinun tulee tietää jakautumisesta | F‑Secure"
description = "F-Secure ja WithSecure jakautuivat erillisiksi yhtiöiksi 2022. Lue, mitä sinun tulee tietää jakautumisesta."
full_description = "ArtikkeliF-Secure ja WithSecure — mitä sinun tulee tietää jakautumisestaF-Secure|30.3.2022|2 min lukuaikaF-Securen liiketoiminta jakautui 22.3.2022. Yritysten tieto­turva­ratkaisut siirtyivät yhtiön nimeltä With­Secure™ alle, ja F‑Secure jatkaa kuluttajien suojaamista. Saatat miettiä, kuinka tämä vaikutti sinuun F‑Securen asiakkaana.Nopea vastaus on, että ei juuri ollenkaan. Kaikki F‑Securen palkitut ohjelmat ja palvelut kuluttajille toimivat jatkossakin ja antavat sinulle saman suojan kuin ennenkin. Organisaatioille suunnatut tieto­turva­ratkaisut ja palvelut tarjoaa nyt kuitenkin WithSecure™. Ne kymmenet miljoonat ihmiset ja sadat palvelun­tarjoajat, jotka luottavat F‑Secureen, voivat luottaa samaan suojaukseen kuin aina.Sinulla voi silti olla kysymyksiä. Ja haluamme, että saat vastaukset suoraan meiltä.Miksi jakautuminen tapahtui?Organisaatioiden uhkakuvat kehittyvät nopeasti, sillä digitaalisella teknologialla on yhä tärkeämpi rooli lähes kaikessa toiminnassa. Auttaaksemme asiakkaitamme ja kumppaneitamme pysymään askeleen edellä uusimpia uhkia, F‑Secure päätti keskittyä kuluttajien turvallisuuteen.Tämä auttaa sekä WithSecurea™ että F‑Securea palvelemaan asiakkaidemme ja kumppaneidemme tarpeita entistä paremmin. Se keskittää ponnistelumme, jotta voimme tarjota mahdollisimman monelle organisaatiolle ja henkilölle korkeimman mahdollisen tieto­turvan. Teemme tämän nopeuttamalla toiminta­tapojamme ja lisäämällä kilpailu­kykyämme kaikkialla.Voinko käyttää sekä F‑Securea että WithSecurea™?Kyllä, ja toivommekin, että teet niin.WithSecure™ tarjoaa korkeimman tason tieto­turvan työ­paikoille. F‑Secure tekee saman koteihin ja henkilö­kohtaisille laitteille. Voit odottaa tätä kaikkien laitteiden tietoturvan suhteen.Kumpi sai Mikko Hyppösen?Mikko jatkaa vuosi­kymmenten mittaista uraansa molempien yritysten palveluksessa. Hänen virallinen työ­paikkansa on WithSecuren tutkimus­johtajana, mutta sen lisäksi hän toimii neuvon­antajana F‑Securelle tittelillä Principal Research Advisor.Missä voin seurata teitä?Voit seurata F-Securea X:ssä, LinkedInissä, Facebookissa ja Instagramissa.Voit seurata WithSecurea™ X:ssä, Linkedinissä ja Instagramissa. Suojaa kaikki, mitä teet netissäSuojaudu helposti yhdellä kattavalla sovelluksellaSuojaudu nytSivun osiotTässä artikkelissa:Miksi jakautuminen tapahtui?Voinko käyttää sekä F‑Securea että WithSecurea™?Kumpi sai Mikko Hyppösen?Missä voin seurata teitä?"
