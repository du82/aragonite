["https://blog.f-secure.com/fi/f-secure-consulting-akatemia-yksi-reitti-tietoturvauralle"]
title = "F-Secure Consulting -akatemia yksi reitti tietoturvauralle - F-Secure Blog"
description = "Julkisuudessa on paljon puhuttu IT-osaajien työvoimapulasta, joka heijastuu myös tietoturva-alalle. Uusia osaajia tarvitaan lisää samaan aikaan kuin kyberuhkakenttä monimutkaistuu ja yritysten tarve tietoturvapalveluille on kasvussa. Tietoturva saattaa äkkiseltään kuulostaa monimutkaiselta ammattikentältä, johon vaikea päästä sisään. Tärkeimpänä tekijänä alalle suuntautumisessa on kuitenkin motivaatio ja innostus, sekä halu oppia uutta. Uran alussa olevalle ja alan veteraaneille tapahtumat […]"
full_description = "Julkisuudessa on paljon puhuttu IT-osaajien työvoimapulasta, joka heijastuu myös tietoturva-alalle. Uusia osaajia tarvitaan lisää samaan aikaan kuin kyberuhkakenttä monimutkaistuu ja yritysten tarve tietoturvapalveluille on kasvussa. Tietoturva saattaa äkkiseltään kuulostaa monimutkaiselta ammattikentältä, johon vaikea päästä sisään. Tärkeimpänä tekijänä alalle suuntautumisessa on kuitenkin motivaatio ja innostus, sekä halu oppia uutta. Uran alussa olevalle ja alan veteraaneille tapahtumat ja konferenssit ovat myös tärkeä yhteyspiste päästä kuulemaan muiden kokemuksia sekä seuraamaan uusia ilmiöitä tietoturvakentällä. Alan yritykset ovat tehneet erilaisia projekteja ja ohjelmia, joiden kautta halutaan tukea tietoturva-uralle suuntautumista. Kotimaisessa tietoturvayhteisössä on hyvä henki ja uran alussa olevia kannustetaan mielellään eteenpäin. Tietoturva-ammattilaiseksi ei ole yhtä tiettyä polkua, vaan alalle päätyy ja hakeutuu usein hyvin eritaustaisia henkilöitä, vaikkakin tietotekninen koulutus tai ohjelmointitausta auttavatkin hyvin eteenpäin. F-Securella on useamman vuoden toiminut tietoturvakonsultoinnin akatemia, jonka tarkoitus on työn kautta kouluttaa alalle uusia lahjakkuuksia ja mahdollisesti työllistää heidät jakson päätyttyä. F-Secure Consulting -akatemiassa on tarjolla runsaasti itseopiskelua ja oikeita asiakastehtäviä. Myös mentorit sparraavat akatemialaisia koko perehtymisjakson ajan. Keskeisimpiä asioita tietoturvakonsultoinnin omaksumisessa on osata sanoittaa teknistä kieltä yleiskielelle ja kyky kommunikoida erilaisten asiakkaiden kanssa. Juhani Partanen haki F-Secure Consulting -akatemiaan kun kiinnostus tietoturvaan ja hakkerointiin oli herännyt. Hakemusprosessin jälkeen Juhani aloitti akatemiassa noin puoli vuotta sitten ja sai myös sitä kautta F-Securen konsultoinnista työpaikan. — Palkitsevinta on löytää haavoittuvuuksia ja saada onnistumisia. On myös hienoa nähdä paljon eri yrityksiä ja tutustua uusiin liiketoiminta-alueisiin sekä eri alan ihmisiin, Juhani kertoo. Tietoturvakonsultointi pitää sisällään todella laajan otoksen erilaisia erikoistumisalueita (esim. application security, network security, cloud security), joista F-Secure Consulting -akatemiassa muodostuu laaja-alainen perustietämys. Samalla kun iso kuva hahmottuu, voi uran alussa olevilla mennä hetki ennen kuin oma kapeampi osaamisen sektori löytyy. — Haastavinta tietoturva-alalla on laajuus, sillä kukaan ei voi osata kaikkea. Uran alussa onkin tärkeää saada kokemusta erilaisista osa-alueista, ja sitä kautta löytää oma juttu mihin keskittyä tarkemmin. Tietoturva-alalla voi olla helpointa lähteä liikenteeseen itselleen tutuista ympyröistä, eli esimerkiksi ohjelmoijalle sovellusturvallisuudesta ja juridiikan opiskelijalle tietosuojan teknisistä toteutusmenetelmistä. Näin ei tarvitse aloittaa täysin puhtaalta pöydältä ja osaamiskenttää voi laajentaa pikkuhiljaa. Kuten aikaisemmin todettu, tärkein tekijä on oma motivaatio ja innostus. — Ala kasvaa todella kovaa vauhtia ja se tarvitsee paljon uusia työntekijöitä. Kannustan siis kaikkia jotka ovat kiinnostuneita opiskelemaan alaa. Tätä voi tehdä ihan koulussa, tai sitten omatoimisesti, sillä netti on täynnä erilaista opintomateriaalia kursseista podcasteihin. Alla on muutamia suosituksia harjoittelusivustoista podcasteihin ja tapahtumiin. Työskennelläksesi tietoturva-alalla sinun ei tarvitse olla 5-vuotiaasta asti koodannut tai kasannut tietokoneita, Juhani toteaa. https://www.f-secure.com/fi/business/podcasts/herrasmieshakkerit https://www.f-secure.com/en/business/podcasts/cyber-security-sauna https://helsec.fi https://disobey.fi/2022/ Seuraava F-Secure Consulting -akatemia järjestetään ensi vuonna ja haku on nyt auki. Tarkasta lisätiedot täältä: Cyber Security Academy 2022 – F-Secure | Jobylon Jo alalla oleville tietoturva-ammattilaisille F-Securelta löytyy myös avoimia työpaikkoja. Hakuja avautuu lisää ja työhakuja päivitetään koko ajan. Tällä hetkellä haetaan hakkereita: f-secure consulting Jobs in Finland | LinkedIn"
author = "Sanna Syrjäläinen"
