["https://blog.f-secure.com/es/seguridad-de-red"]
title = "F-Secure incorpora seguridad de red con Whalebone - F-Secure Blog"
description = "F-Secure y el experto en seguridad de red Whalebone se unen para ofrecer protección completa a los proveedores de servicios. Sepa más."
full_description = "La seguridad en línea es clave en tiempos de pandemia. Los ataques enfocados al hogar conectado, el phishing, el robo de identidad etc. están a la orden del día. Hoy más que nunca es imprescindible proteger contra ciberataques. Por esta razón, el proveedor de ciberseguridad F-Secure y el experto en redes Whalebone se unen para ofrecer protección completa a los clientes de proveedores de servicios. F-Secure pasa ahora a ofrecer, además de su cartera de productos, la seguridad de red basada en DNS – Domain Name System – . DNS es una tecnología empleada para proteger la información en el sistema de nombres de dominio (DNS) utilizada en las redes IP. Seguridad en línea en capas: F-Secure incluye la seguridad DNS, para redes móviles y fijas, a su estrategia de protección integral de tres capas. De esta manera, es posible proteger a los usuarios contra los ataques más avanzados del mundo. Ya que si bien, los consumidores actualmente exigen interacciones en línea fluídas y estables, el DNS se ha vuelto cada vez más difícil de manejar. “Nuestra estrategia para proteger a los usuarios contra los ciberataques consiste en un plan por capas. Lo cual permite a nuestros socios proveedores de servicios proteger a sus clientes en toda situación, ya sea en casa, estando en camino o al conectarse a una red WiFi pública”, explica Antero Norkio, vicepresidente de gestión de soluciones de F-Secure. A continuación las tres capas de ciberseguridad: Capa 1: F-Secure TOTAL otorga la más amplia protección para dispositivos personales, incluyendo los puntos finales y además la avanzada seguridad en línea y la privacidad con VPN. Capa 2: Hogar conectado seguro: F-Secure SENSE integrado en los routers de los proveedores de servicios. Así se logra una visibilidad total del tráfico doméstico, junto además con proporcionar protección contra ciberataques para todo tipo de dispositivos en la red. Capa 3: La seguridad de red DNS de Whalebone garantiza protección base para todos los dispositivos, ya desde la red del proveedor de servicios. “La seguridad de la red basada en DNS puede ser activada para el usuario con solo pulsar un botón. Eso permite una adopción máxima, una red más rápida y estable y con menores costos de mantención “, explica Richard Malovič, director general de Whalebone. Hogar conectado seguro, usuarios preocupados El peligro a ser víctimas de filtración de datos o robo de identidad digital aumenta a medida que avanza el IoT (internet de las cosas). Además, es bien sabido que los dispositivos smart son vulnerables. Es más, la mayor parte del tráfico de ataque detectado por la red de honeypots – servidores señuelo – de F-Secure es generado por malware basado tanto en Linux como en Mirai. Los cuales se centran en los dispositivos electrónicos conectados con deficiencias de seguridad Un reciente informe de F-Secure reveló que para el 79% de los consumidores la protección de sus dispositivos conectados al internet en casa era importante o muy importante. Incluso un 72% dijo estar dispuesto a pagar por esta protección. Óptima ciberseguridad genera nuevos negocios La seguridad de F-Secure y Whalebone combinadas abre nuevas oportunidades de negocios para los proveedores de servicios: “Gracias a la rápida y fiable seguridad DNS de Whalebone y la cartera de F-Secure, los proveedores de servicios podrán proteger cualquier dispositivo electrónico conectado. Pero además, podrán elaborar ofertas de servicios de seguridad diferenciadas y por niveles para sus clientes”, recalca Antero Norkio. Asimismo, la seguridad DNS ayuda también a los proveedores de servicios a proteger mejor a sus clientes. Es decir, los anima a adquirir seguridad para los puntos finales y fomenta nuevas instalaciones entre los usuarios. F-Secure SENSE por su parte informa al usuario sobre la seguridad requerida, de acuerdo a los dispositivos conectados al router. “Siempre buscamos nuevos caminos para que nuestros socios proveedores de servicios aumenten sus ingresos y tengan clientes cada vez más satisfechos. Esto deriva en una mayor fidelidad y además de destacarlos como proveedor de servicios de confianza”, recalca Paul Palmer, Vicepresidente de Desarrollo de Negocios de F-Secure. En conclusión, “hemos visto que una eficiente seguridad del usuario disminuye la pérdida de clientes en hasta un 60%. A futuro y gracias a la combinación entre la seguridad de red y nuestra cartera, esperamos tener aún mejores resultados para los proveedores de servicios y para sus clientes.”"
