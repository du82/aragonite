["https://blog.f-secure.com/de/schutz-persoenlicher-daten"]
title = "Für Ihre persönlichen Daten interessiert sich niemand. Oder doch? - F-Secure"
description = "In diesem Artikel finden Sie 7 einfache Schritte, wie Sie Ihre persönlichen Daten schützen und somit Identitätsdiebstahl vorbeugen können."
full_description = "Sie denken, dass sich niemand für Sie interessiert und es daher nicht wichtig ist, Ihre persönlichen Daten online zu schützen? Oder denken Sie, dass sich niemand die Mühe machen würde, Ihre Daten zu stehlen? Wären Sie sicher vor Identitätsdiebstahl? Sicherlich wäre das digitale Leben viel einfacher, wenn dies der Fall wäre. Aber keine dieser Annahmen treffen zu. Im Folgenden finden Sie eine ausführliche Erklärung, warum Sie Ihre persönlichen Daten schützen sollten. Außerdem finden Sie 7 einfache Schritte, um dies umzusetzen. Kriminelle verdienen Geld mit Ihren Daten Personenbezogene Daten wie Telefonnummern, Passwörter, Adressen, Geburtsdaten usw., können auf vielfältige Weise für kriminelle Zwecke verwendet werden. Sie können zum Beispiel an andere Kriminelle verkauft, für die Übernahme von Konten und für Identitätsdiebstahl genutzt werden. Identitätsdiebstahl liegt vor, wenn jemand die persönlichen Daten einer anderen Person für Betrug oder andere Straftaten verwendet. In der Praxis bedeutet das zum Beispiel, dass eine gestohlene Kreditkartennummer zum Kauf von Waren verwendet werden kann. Viele Händler bieten Rechnungs-, Ratenzahlungs- oder andere kreditbasierte Zahlungsmethoden an, die Kriminelle mit gestohlenen Daten nutzen können. Identitätsdiebstahl kann auch dazu führen, dass jemand in Ihrem Namen einen Kredit aufnimmt. Wichtig dabei ist, dass Identitätsdiebstahl meist mit kreditbasierten Zahlungen und Krediten einhergeht. Ihr tatsächliches Vermögen spielt also keine Rolle für das Risiko, Opfer zu werden. Viele denken vielleicht auch, dass sie zu alt sind, um ein potenzielles Ziel für Identitätsdiebstahl zu sein. Das Alter ist jedoch kein Hindernis. Die persönlichen Daten älterer Menschen können genauso gut für Betrügereien verwendet werden. Außerdem haben ältere Menschen in der Regel eine bessere Bonität als jüngere Opfer. Und schließlich sind ältere Menschen möglicherweise nicht mehr so gut darauf vorbereitet, Identitätsdiebstahl schnell zu erkennen und darauf zu reagieren. Dies gibt den Kriminellen Zeit, ihre persönlichen Daten effektiver zu nutzen. Lesen Sie mehr zum Thema: Warum haben Hacker es auf Ihre persönlichen Daten abgesehen? >> Persönliche Informationen werden in großen Mengen und mit automatisierten Verfahren gestohlen Besitzen Sie ein Facebook-Konto? Sind Sie auf LinkedIn mit Kollegen und Interessengruppen vernetzt? Haben Sie jemals ein Konto bei einem Onlineshop, einem Social-Media-Dienst oder einem Streaming-Dienst angelegt? Jedes Mal, wenn Sie ein neues Konto bei einem Dienst erstellen, geben Sie diesem Dienst Ihre persönlichen Daten. Zumindest Ihre E-Mail-Adresse und ein Passwort. Und diese Daten können aus der Datenbank des Dienstes gestohlen werden. Es ist sogar wahrscheinlich, dass sie bereits gestohlen wurden. Jedes Jahr werden Milliarden von Datensätzen mit persönlichen Daten aus Onlinediensten gestohlen. Es ist sehr unwahrscheinlich, dass Hacker gezielt Ihre Daten stehlen wollen. Und das müssen sie auch nicht. Denn bei einer erfolgreichen Datenpanne können sie die persönlichen Daten von einer Million oder noch mehr Opfern stehlen. So wurde beispielsweise im Jahr 2021 entdeckt, dass die persönlichen Daten von über 500 Millionen Facebook-Nutzern frei im Dark Web verbreitet wurden. Und das ist nur ein Beispiel. Auch zielen Kriminelle normalerweise nicht auf Malware oder Phishing-Angriffe ab. Es gibt andere Möglichkeiten, persönliche Daten zu stehlen. Und die Vorgehensweise ist typischerweise vollständig automatisiert. Für die Verbreitung, den Datendiebstahl und die Weitergabe des Angriffs an andere Opfer ist oft kein Eingreifen des Kriminellen erforderlich. Es ist wirklich nichts Persönliches. Es ist rein geschäftlich. Aber es ist wichtig zu verstehen, dass jeder zum Opfer werden kann. Lesen Sie mehr zum Thema: Wie kommt es zu einer Kontoübernahme? >> Lesen Sie mehr zum Thema: Was ist Phishing? >> Ihr Passwort ist eine Schwachstelle Was ist, wenn jemand Ihr Benutzername und Passwort für z.B. Facebook stiehlt? Das ist kein Geheimnis. Man schätzt, dass über 80 % der Internetnutzer bei vielen Diensten das gleiche Passwort verwenden. Manche tun dies sogar bei allen Diensten, die sie nutzen. Kriminelle sind sich dessen sehr bewusst. Wenn es ihnen also gelingt, Anmeldedaten zu stehlen, werden sie versuchen, damit Zugang zu so vielen Webdiensten wie möglich zu erhalten. Sie wollen Zugang zu Online-Konten mit Zahlungsdaten und Daten, die sie für Identitätsdiebstahl nutzen können. Konten für Onlineshops haben diese normalerweise. Auch dieser Prozess ist automatisiert. Kein Krimineller wird seine Zeit damit verbringen, am PC zu sitzen und Millionen von Zugangsdaten nacheinander in einen Dienst einzugeben. Sie verwenden speziell entwickelte Programme, die diese Aufgabe für sie erledigen. Und sie tun es sehr schnell. Wenn die gestohlenen Anmeldedaten in anderen Diensten verwendet wurden, können die Kriminellen auf sie zugreifen. Ein Fallbeispiel Der ganze Vorgang könnte etwa so ablaufen. Krimineller A stiehlt die Anmeldedaten von einer Million Nutzern aus der Datenbank eines sozialen Netzwerkes. Die gestohlenen Daten werden im Dark Web an Kriminellen B verkauft. Krimineller B verwendet ein Programm, um alle 1 Million Benutzernamen und Passwörter mit erstaunlicher Geschwindigkeit in den Amazon Webstore einzuspeisen. Natürlich funktionieren dort nicht alle gestohlenen Anmeldedaten. Aber selbst wenn 1 % von ihnen funktionieren, hat Krimineller B gerade 10 000 Konten freigeschaltet. Eines davon könnte Ihres sein. Wie kann man persönliche Daten online schützen? Wir können also festhalten, dass Ihre Daten für Hacker doch wertvoll sind. Deshalb ist es wichtig, persönliche Daten und Ihre Identität online zu schützen. Glücklicherweise müssen Sie dafür nicht viel tun. Oft reicht es schon aus, es Hackern schwer zu machen, um Identitätsdiebstahl zu verhindern. Im Folgenden finden Sie 7 einfache Tipps zum Schutz Ihrer persönlichen Daten im Internet. 1. Verwenden Sie sichere und einzigartige Passwörter Passwörter können eine Schwachstelle sein, aber wenn Sie sie richtig verwenden, können Sie Ihre persönlichen Daten online schützen. Wenn Sie für jedes Online-Konto ein eigenes Passwort verwenden, können Hacker nicht in alle Konten eindringen, nachdem sie ein Passwort gestohlen haben. Das klingt fast zu einfach, ist aber äußerst wichtig, wenn Sie Ihre Identität online schützen wollen. Passwörter müssen auch komplex genug sein. Ein einfaches Passwort kann leicht geknackt werden. Je länger das Passwort also ist, desto stärker ist es. Sie können einen Satz verwenden und Buchstaben gegen Zahlen austauschen. Aber noch besser ist es, wenn Sie sich ein Passwort ausdenken, das Sie sich nicht merken können. Lesen Sie mehr über dieses Thema: Warum jedes Passwort wichtig ist >> 2. Ein Passwort-Manager hilft Ihnen, Ihre Passwörter sicher zu verwenden Ein Passwort-Manager ist ein wirklich praktisches Werkzeug. Mit ihm können Sie all Ihre Passwörter, PIN-Codes, Kreditkartennummern und andere Anmeldedaten sicher speichern. Sie sind immer verfügbar, wenn Sie sie brauchen, und Sie werden sie nie vergessen. Alles, was Sie brauchen, ist ein einziges Passwort, um auf den Tresor zuzugreifen. Da die Kennwörter nur auf dem Gerät gespeichert werden, auf dem die Anwendung installiert ist (und auf jedem anderen Gerät, mit dem Sie sie verknüpfen möchten), können sie nicht online gestohlen werden. Ein guter Passwort-Manager hilft Ihnen auch dabei, anstelle alter Passwörter neue, sichere Passwörter zu erstellen. Wenn Sie sich bei Online-Diensten anmelden, können Sie die Kennwörter automatisch aus Ihrem Passwort-Manager kopieren und einfügen. 3. Verwenden Sie die 2-Faktor-Authentifizierung Diese auch als Multifaktor-Authentifizierung bezeichnete Methode erfordert eine weitere Anmeldung bei Ihren Online-Konten. Dabei kann es sich um Ihren Fingerabdruck oder einen einmaligen Code handeln, der in einer Textnachricht gesendet wird. Selbst wenn es jemandem gelingen sollte, Ihr Passwort zu stehlen, müsste er Ihren Fingerabdruck oder den Einmalcode erhalten, um an Ihre Daten zu gelangen. Lesen Sie mehr zum Thema: Zwei-Faktor-Authentifizierung: Was sie ist und wie man sie aktiviert >> 4. Schützen Sie sich vor Malware und Viren Persönliche Daten und Passwörter können auch von Ihrem Gerät gestohlen werden. Malware kann Ihre Tastenanschläge aufzeichnen und Ihren Internetverkehr ausspionieren. Ein Virenschutz blockiert Malware und hindert sie daran, Ihre Daten zu stehlen. Antivirenprogramme sind für den Schutz persönlicher Daten von entscheidender Bedeutung. 5. Geben Sie keine unnötigen persönlichen Informationen an Onlinedienste weiter Viele Onlinedienste und Anwendungen fordern Sie auf, Ihre persönlichen Daten anzugeben. Die Informationen werden in ihren Datenbanken gespeichert. Leider können Sie nicht verhindern, dass Kriminelle in diese Datenbanken eindringen und Ihre Daten stehlen. Sie können diesen Diensten jedoch Ihre Daten vorenthalten oder gefälschte Daten angeben. Wenn weniger Daten über Sie online sind, haben Kriminelle weniger Chancen, sie zu stehlen. Es ist immer gut zu überlegen, warum die Informationen überhaupt benötigt werden. 6. Prüfen Sie, ob Ihre Daten bereits gestohlen worden sind Der kostenlose ID Theft Checker von F-Secure zeigt Ihnen sofort, ob Ihre persönlichen Daten bereits Teil einer Datenschutzverletzung waren. Wenn dies der Fall ist, könnten Kriminelle bereits Zugang zu Ihren Daten haben. Der kostenlose Dienst sendet einen Bericht mit detaillierten Informationen über mögliche Datenschutzverletzungen an Ihre E-Mail-Adresse. Außerdem erhalten Sie Anweisungen, wie Sie Ihre Daten schützen können. Die Nutzung des Dienstes ist völlig kostenlos, und Ihre Daten werden nicht gespeichert. Probieren Sie es hier aus. >> 7. Verwenden Sie einen Identitätsschutz Immer wieder kommt es zu Datenschutzverletzungen. Selbst wenn Sie alles richtig machen, ist es möglich, dass Ihre Daten online nach außen dringen. Wenn eine Datenpanne vorliegt, ist es wichtig, schnell zu handeln. Gestohlene Daten werden möglicherweise nicht sofort verwendet. Deshalb kann die schnelle Änderung Ihres Passworts einen Identitätsdiebstahl vorbeugen. Aber wie können Sie herausfinden, ob Ihre Daten gestohlen worden sind? Die Antwort ist die Identitätsüberwachung rund um die Uhr. Sie schlägt Alarm, wenn eine Datenschutzverletzung mit Ihren Daten festgestellt wird. F-Secure ID PROTECTION erfüllt all diese Aufgaben und fungiert gleichzeitig als Passwort-Manager. Er ist im F-Secure TOTAL Cybersicherheitspaket enthalten. TOTAL enthält außerdem ein preisgekröntes Antivirenprogramm und ein benutzerfreundliches VPN, um Ihre Privatsphäre im Internet zu schützen. Das ist alles, was Sie brauchen, um sicher online zu sein und Ihre persönlichen Daten zu schützen. Sie können TOTAL 30 Tage lang kostenlos und ohne Kreditkarte testen >>"
