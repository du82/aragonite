["https://blog.f-secure.com/es/que-es-el-stalkerware"]
title = "Seguridad digital: ¿Qué es el stalkerware? - F-Secure Blog"
description = "El stalkerware es un tipo de aplicación utilizada por delincuentes para rastrear y vigilar a una víctima. Leer más en F-Secure blog"
full_description = "El stalkerware es un tipo de aplicación utilizada por delincuentes para rastrear y vigilar a una víctima. Por lo mismo, este tipo de Malware suele ser instalado sin el conocimiento o consentimiento del usuario. Más aún, las aplicaciones están diseñadas para hacer creer a las peronas que no existe problema alguno con la privacidad de sus datos. De este modo, los agresores pueden seguir rastreando a sus víctimas sin que nadie se de cuenta. Stalkerware: Peligro múltiple para la seguridad digital El Malware de acoso o stalkerware cumple con diversas funciones. El uso de este tipo de aplicación constituye claramente una violación a la seguridad y típicamente se utiliza para: Detectar la ubicación de la víctima en tiempo real Acceder a la lista de llamadas del usuario Leer los mensajes Hacer “pantallazos” (fotos de la pantalla) y enviarlas al hacker Observar a la víctima o a su alrededor utilizando la cámara del dispositivo electrónico Escuchar al usuario con ayuda del micrófono de su dispositivo El Stalkerware en la práctica Las aplicaciones de acoso son utilizadas por diferentes tipos de actores. En este caso puede ser la pareja de la persona, sus padres, un familiar, un amigo o alguien del trabajo. Debido a ello, las razones más probables para el uso del malware pueden ser, por ejemplo, los celos, la sobreprotección, el deseo de control o dominio y, como su nombre indica, el acoso de la víctima. En este caso en particular, la aplicación tiene que ser instalada por personas con acceso físico al dispositivo electrónico del usuario en cuestión. Esto mismo diferencia a estos programas perjudiciales de otros como los infostealers. Para más información sobre el malware infostealer léa aquí >> Sin embargo, el stalkerware puede ser comprado en tiendas de aplicaciones para usos legales como el seguimiento del empleador, el antirrobo, el control parental o el monitoreo de la familia. Lamentablemente, el hecho de que el stalkerware sea empleado para dichos propósitos sugiere a la víctima que nunca es nocivo. Además, los usuarios normalmente no tienen ni idea de que son vigilados o que hay filtración de datos. Cómo saber si su teléfono tiene stalkerware Revise la lista de aplicaciones del administrador de su dispositivo Vaya a los ajustes de seguridad de los teléfonos Android para encontrar esta configuración. Entonces, busque cualquier aplicación que no conozca y si encuentra alguna, averigüe en detalle de qué se trata. Verifique los permisos de las aplicaciones En los ajustes del teléfono puede revisar qué permisos ha concedido a dichos programas. Por ejemplo, las aplicaciones de stalkerware suelen tener amplias libertades de acción. Si bien, el contar con muchos permisos no convierte a una aplicación automáticamente en stalkerware hay que ser cuidadosos. Es decir, tal vez descubra aplicaciones, hasta ahora desconocidas, que tienen autorización para usar la cámara, los registros de llamadas u otras cosas que resulten sospechosas. La herramienta F-Secure SAFE le ayudará a revisar los permisos otorgados. Mejor seguridad digital con ayuda en línea Si piensa que su teléfono puede contener stalkerware visite www.stopstalkerware.org. Este es un sitio web con muchos datos sobre cómo reconocer el stalkerware y qué hacer al respecto. En el video a continuación nuestro experto en ciberseguridad le dará mayores informaciones acerca del stalkerware."
author = "Luciana Marques"
year_published = 2021
year_updated = 2021
