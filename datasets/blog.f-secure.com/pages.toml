["https://blog.f-secure.com/es/3-de-cada-4-usuarios-temen-ser-victimas-de-un-delito-cibernetico-o-robo-de-identidad"]
title = "3 de cada 4 usuarios temen ser víctimas de un delito cibernético o robo de identidad - F-Secure Blog"
description = "La mente humana no suele ser muy buena para evaluar riesgos potenciales. Sin embargo, si parece comprender el significado del cibercrimen y del robo de identidad. Un buen ejemplo de ello es que si bien mucha gente le tiene temor a los viajes aéreos, el subirse a un automóvil sigue siendo algo mucho más arriesgado. […]"
full_description = "La mente humana no suele ser muy buena para evaluar riesgos potenciales. Sin embargo, si parece comprender el significado del cibercrimen y del robo de identidad. Un buen ejemplo de ello es que si bien mucha gente le tiene temor a los viajes aéreos, el subirse a un automóvil sigue siendo algo mucho más arriesgado. Eso se debe a que nuestro cerebro tiene una idea de peligro tipo película de acción con invasores y asaltantes. Por eso, no vemos que es mucho más probable que las enfermedades cardíacas y el cáncer nos eliminen. Pero cuando se trata de robo de identidad y ciberdelitos, la gente parece tener una idea realista de los riesgos a los que se enfrentan al utilizar la web. ¿Le preocupan más los piratas cibernéticos que su auto? Una reciente encuesta de F-Secure revela que el 71% de los usuarios dice presentir que será víctima de un robo cibernético o de identidad. Mientras que un 73% expresó temores similares con respecto a sus hijos * , a diferencia de un 66% que dijo estar preocupados por ser posible víctima de un accidente de auto. Los riesgos de una colisión automovilística se anidan en nuestra mente por una mezcla entre las noticias que escuchamos y la experiencia personal. Asimismo, la conciencia respecto a las amenazas que no ponen en peligro la vida – como los delitos cibernéticos y el robo de identidad – parece provenir de una combinación entre titulares sobre delitos online y el riesgo inminente. La encuesta además reveló que más de la mitad de los consumidores ha tenido al menos un familiar afectado por algún delito digital (51%). Uno de cada cuatro usuarios incluso expresó que ya lo han afectado varias formas de cibercrimen.El software malicioso (malwares) y los virus son las amenazas más comunes, seguidas por el fraude de tarjetas de crédito o por medio de llamadas o mensajes de texto. Sus datos nunca descansan El tiempo que los estadounidenses pasan en su automóvil aumentó a 51 minutos entre el 2016 y el 2017. Un promedio diario de 2.8 horas pasan delante de la televisión. La suma de esas dos actividades equivalen a la cantidad de tiempo que pasan en línea, 3.4 horas al diarias o 23.6 horas a la semana. Sin embargo, incluso cuando estamos dormidos, nuestros datos y nuestra identidad están flotando en la nube. “Hoy por hoy es casi imposible no usar el internet. Los servicios en la nube son usuales, pero no siempre sabemos qué información sobre nosotros se guarda y dónde está almacenada”, recalca Kristian Järnefelt, vicepresidente ejecutivo de consumo Cyber Security de F-Secure. El sitio web de Troy Hunt, Have I Been Pwned, ha detectado hasta el 27 de mayo de este año 7.858.388.981 cuentas comprometidas. Esto significa que ya hay más cuentas con claves expuestas que habitantes en la tierra. “El equipo de seguridad cibernética B2B de F-Secure llega a la conclusión de que muchos de estos servicios o negocios en la nube se están convirtiendo en blancos lucrativos para el robo masivo de datos por parte de los hackers”, agrega Kristian. Las empresas ya no se preguntan si serán atacadas o no, sino cuándo. Incluso si usted cuenta una buena seguridad TI puede convertirse en víctima. Asegure su identidad antes, durante y después de una infiltración Cerca de 1 de cada 10 usuarios web ha sufrido un robo de identidad. Èsta puede ser la amenaza más maliciosa, ya que va a la par con el crecimiento masivo del comercio en línea. Una reciente investigación de la empresa de consultoría Javelin revela que las víctimas de fraude de identidad están pagando cada vez más de sus propios bolsillos. Los costos por estafas – que implican la apertura de nuevas cuentas – aumentaron de 3.000 millones de dólares en 2017 a 3.400 millones de dólares en 2018. “Una vez que la información personal ha sido robada, es imposible recuperarla y también es posible que usted no sea capaz de detectar problemas durante años”, explica Kristian. “En la mayoría de los casos es una cuestión de velocidad. Si los usuarios reaccionan rapidamente, puede que los bienes robados sean inútiles para los criminales”. F-Secure ID PROTECTION, que se lanzará este año, ofrece protección completa contra los robos cibernéticos o de identidad, ayudando a combatirlos antes de la toma de control de cuentas y antes de que los hackers puedan aprovechar su información. Además, F-Secure TOTAL ofrece una amplia gama de herramientas de seguridad. *F-Secure Identity Protection Consumer (B2C) Survey, mayo del 2019, realizado en cooperación con la empresa Tolunal, en 9 países (EE.UU., Reino Unido, Alemania, Suiza, Países Bajos, Brasil, Finlandia, Suecia y Japón), con 400 encuestados por país = 3600 respuestas."
