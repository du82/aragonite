["https://blog.f-secure.com/podcast-dark-web"]
title = "Episode 57| Dark Web: The Good, The Bad, and the Ugly - F-Secure Blog"
description = "After data breaches and ransomware attacks, we often hear that customer information was leaked to the dark web. This obviously can have serious implications for both companies and individuals, but for many of us, the dark web is as mysterious as it sounds. So what is the dark web all about, and what’s happening there? […]"
full_description = "After data breaches and ransomware attacks, we often hear that customer information was leaked to the dark web. This obviously can have serious implications for both companies and individuals, but for many of us, the dark web is as mysterious as it sounds. So what is the dark web all about, and what’s happening there? How does it affect companies and regular people? F-Secure’s Laura Kankaala and Elias Koivula joined episode 57 of Cyber Security Sauna to help to help demystify the topic. Listen, or read on for the transcript. And don’t forget to subscribe, rate and review! ALL EPISODES | FOLLOW US ON TWITTER Janne: Welcome to the show. Laura: Thanks for having us here. Elias: Good afternoon. Let’s start with the basics. What is the dark web, and how do you get there? Laura: When we talk about the dark web, it’s basically just an overlay of our basic network infrastructure. It’s just not quite available through the means of opening our Chrome browser and going in there. We need some additional plugins or a specific kind of browser to access that. The dark web itself is part of what we can also call the deep web, and this terminology can alter depending on who you are talking with, but this deep web section of the internet is basically overall, the section of the internet that is not that easily browsable. For example, you cannot find the results on Google or on other search engines that easily. But the dark web specifically, is then the section that you need specific tooling to access. For example, Tor browser or specific plugins for your browser. Laura Kankaala, Elias Koivula Okay. So if I want to oversimplify, the clear web is the part of the internet that you and I know, and then the deep web is the part of it that is using the same infrastructure but is not part of the general internet, it’s not indexed by Google and easily findable like that. And then the dark web is the part that sort of takes extra steps to hide them a little bit, so they might use different protocols and different means of accessing. Fair enough? Elias: Yeah, absolutely. There’s this metaphor of an iceberg. And it’s supposed to explain the entire internet, or the connected web. And the top of the iceberg is often shown as the surface web, the clear web. And the rest of the iceberg, the bigger portion, is usually displayed as the deep web/dark web. Now, that is relatively true, since the surface web, by some estimations and sources, only accumulates to around four to eleven percent of the websites out there. It’s still like billions of sites, but the reason for this is that the biggest portion of the entire internet is the deep web. It’s basically governmental sites, company sites, sites that require user credentials or some other means to access. That’s the biggest portion of the internet. And the dark web, itself, is just a small portion of that. Okay, so is the deep web just simply things that are behind a credential login, or something like that? Laura: It could be like that. Or, for example, company intranets and things like that, that are not just directly available to the public internet. So it’s not that full of mystique after all. It’s just things that we can actually access, for example login pages, but whatever is behind that is not directly accessible for us unless we have the required access to that information. You mentioned one of the things you use to get on the dark web is Tor, the onion routing browser and system. What is that, and does it actually make you anonymous like they say? Elias: So using Tor does not entirely make you anonymous. It’s pseudo anonymous. And it’s just one step of the entire opsec infrastructure to build yourself a truly anonymous identity. So to understand the concept of why you’re not necessarily fully anonymous, it could be useful to understand how the Tor network works. Basically, when a Tor circuit is built, when you fire up the Tor, there’s a bunch of starting nodes you connect to. So I call one of those. Elias: Yeah, exactly. A computer calls one of those. And that first node contacts another node, the middle node, I think it’s called. And the middle node contacts an exit node. And all of these are in different places, possibly around the world even. And all of these nodes add an additional layer of encryption. So the first node adds a layer of encryption, the second node adds a layer of encryption. So the node that is currently decrypting and accessing the data cannot tell where exactly that data was initially coming from, it cannot tell the original IP. And then the exit node, that is the third node that connects you to the target website. That one does hold information about your target IP address, for instance. There’s way of identifying the data if you possibly have access to the exit node, especially if the target website you’re using does not use encryption. So let’s say you’re accessing a site using cleartext protocols, not TLS. The data you send, meaning that if your opsec is not good enough, if you order something to your home address, or create a user with your own email address, all of that data can be viewed through cleartext if the target website is not using TLS. There’s different ways of using Tor with full anonymity, and those require a bit more than just simply downloading a Tor browser or configuring a browser to use Tor plugins. Laura: I totally agree with Elias that Tor network and Tor browser, they are just technologies that anyone can use. You can go and download Tor browser for yourself, for example, if you want to use it. But the reality of things is that even though we have these technologies that would support anonymous use of the internet, it really is just that, it’s just technology. And the fact is that our lives bleed into the internet in such multiple ways. For example, as Elias said, if you register into an application or a website with your own name, or use the same email everywhere outside and inside of Tor network and in these hidden services, then these things can be used to connect you. And outside of just technical vulnerabilities, there are also these applications that we use, for example that criminals use when conducting criminal business online, so, for example, Bitcoin addresses and things like these, that then tie into this bigger picture of their online identities that can become harder to hide because exposure is wider than just actually using one specific hidden service through Tor browser. Okay. Sounds both complex and shady. Where did this dark web come from? Why do we have things like the Tor? Elias: So initially, I think, just as the regular internet, it was a byproduct of the US military. The story I’ve heard is that it was initially used as a mechanism to help spies to discuss secret information. There’s of course the question of, why was it then released to the public? Well, to help blend the information related by the spies into the crowd, it was opened up to the entire population. So to lose themselves into the crowd. Elias: Exactly, yes. Laura: I think in media it gives out a really shady look to how the dark web is full of criminals, and just bad things happening there, but the truth is that there are all kinds of websites there, and to be honest, some of the websites really remind me of the early days of the internet, like the early 2000s when I first started to make websites myself. So there’s a lot of these self-made websites. But while it’s true that there is a lot of different types of discussion forums and websites for personal hobbies and use, naturally, because there is a lack of moderation and oversight, there are a lot of hidden services that serve potentially very harmful content, and are also marketplaces for illegal activity such as buying and selling of drugs and guns and so on. So there’s a lot of different types of things out there, and I would say while some of these illegal services also happen on the clear web, perhaps the hardcore ones happen within the dark web. Elias: Yeah. Inherently there’s nothing evil about Tor. Tor is just a technology that helps you, helps you become anonymous. And also helps you access these private sites. Tor is extremely useful in places such as…let’s say there’s an authoritarian government that wants to spy and listen in on what people are talking about. Tor is a useful tool for instance in those places, to have discussion and full access to the entire database of information that’s contained. Because you can access just regular webpages with Tor, as well. Some people use Tor just to browse their daily pages, whatever they might look at. And there even exists .onion domain pages for, I think, the Washington Post, and for the FBI and, as Laura said, some popular websites as well. Laura: Definitely Tor has a really crucial role to play when it comes to freedom of speech and freedom of the press. So if access to the internet or information is limited, then Tor provides a really good gateway into the internet, making it so that it’s really difficult to see where this person is going, what kind of websites they are browsing, but also hiding the anonymity of these people from the websites themselves. Okay. Well, the first thing that comes to my mind is the drug markets and places to buy illegal guns from. But you’re saying that’s just a small part of it. So what else is there? You hear stories about nefarious hacker forums and cyber crime services… Laura: Yeah, there’s definitely those as well, and sometimes they are in the same marketplace or sometimes in a separate marketplace. I would say that some of this information, or for example data leaks or dumps, exploit code, they are sold. And then there’s also the possibility of buying just services of someone – for example, writing phishing templates for you, or doing phishing for you or whatnot. So it comes really down to just having a need for something or a demand for something and then answering to that demand. But when it comes to these hacker forums, for example, or selling exploit code, and if we’re talking about not zero days, but more generic kind of exploit code, I feel that this naturally takes place in the dark web, or through Tor browser accessing these hidden services, but there are a lot of these hacker forums that are available also in the clear net, for example, or clear/deep net, so you need to log in. Or sometimes not even that, but that contain information in data leaks, or on exploit code that is available for people, or just examples of how to do carding, or different types of crime that are really directly tied to immediate profit. Elias: I’d like to draw a separation between these hacking forums and marketplaces that you’ve mentioned. So, marketplaces are only places to usually sell some illegal material such as drugs. Mostly it’s just drugs. There’s legends of having hitmen for hire and stuff like that…those are just legends. The marketplaces are just mainly places for illicit, illegal drugs, usually material related to software, such as these ransomware builders or whatever. The quality is quite bad in the marketplaces. It’s usually just old stuff that somebody’s trying to get a quick buck for. It’s not something necessarily new or interesting. And then there are these hacker forums, which Laura mentioned. Dark web hacker forums, they, in my experience, are mostly to have serious conversations about cyber crime as a service, and other possibly illegal things. Laura: Yeah, regarding the marketplaces, the generic kind of nature of the code is definitely a big thing there. So it’s nothing revolutionary. Typically it’s quite old, like well-known scripts just repackaged and sold forward. There’s naturally zero-day merchants and brokers who are selling zero days, but that’s a super exclusive club. That is not a club that is fully always available to random people on the Tor network. And when we talk about for example, zero-day exploits, the price tag on those is not something that a consumer could easily afford, especially if they are just looking for an exploit that they are willing to spend a couple of hundred dollars maximum on. I would assume there’s quite a bit of scamming going on as well, that not everything you’re buying is exactly as advertised. Laura: Typically in these marketplaces, and especially when it comes to forums where information is shared and people are having discussions, there are typically these kinds of reputation things that you can check. So, for example, the discussions they are having on a specific piece of code or specific tooling that someone is offering, or just a dump of information. For example, when it comes to drug dealing, a lot of the drug dealers, they are really concerned about their reputation and that they are actually serving customers. I believe when Silk Road was taken down, a lot of the sellers were investigated, and the stuff they were selling was investigated at that point, and a lot of it was found to be really good quality, and they were really living up to the expectations so to speak. It would be bad for business also to be selling bad stuff online. Elias: Excellent point about the reputation. As weird as it sounds, on these anonymous forums, you are your username. So a lot of the time, especially on the dark web hacker forums, you see people providing sometimes even free software for use. Or sometimes you might find some free credential dumps provided by a user. Why? It’s really hard to decipher the actual motivation behind those, but I believe it’s for street cred. Often you can find that from these lower-level hacker forums you can sort of graduate to some higher level, if your username is well-known, if you have a reputation in the underworld. So in that sense, reputation is everything over there. Laura: That’s true. And what I find most intriguing in these forums is how trust is built in this kind of no-trust environment. As you, Janne, also said that you were a little bit skeptical of what we were going to get if we buy something from there, but how intricate the trust actually is there. And that people really believe that this person behind this specific username, he or she has a really good reputation, so we trust them. Elias: About the trust as well, these marketplaces, they usually don’t have a long life span. So usually they are closed via officials, or sometimes they have conducted exit scams. So because the payment happens usually via escrow, the site can hold a lot of Bitcoin, a lot of cryptocurrency at one time. So it’s easy to just one day, as the operator of the site, just disappear with the entire Bitcoin. And it has happened. Also, the fact that some of these marketplaces have been under police control. So the police have taken control from the original office and not let anyone know about that, that they are in control. And they’ve just let it be open and build their cases with people buying drugs and whatever. So you can never know the site is fully leg"
