["https://blog.f-secure.com/podcast-from-er-to-ir"]
title = "Episode 58| Paths to Infosec: From ER to IR - F-Secure Blog"
description = "Data breaches and other security incidents have become a frequent, severe problem for organizations. But with incident responders in short supply, there are fewer professionals available to help organizations in their hour of need. For episode 58 of Cyber Security Sauna, we were joined by F-Secure incident response consultant Eliza Bolton, who successfully transitioned to […]"
full_description = "Data breaches and other security incidents have become a frequent, severe problem for organizations. But with incident responders in short supply, there are fewer professionals available to help organizations in their hour of need. For episode 58 of Cyber Security Sauna, we were joined by F-Secure incident response consultant Eliza Bolton, who successfully transitioned to cybersecurity from the nursing profession, and F-Secure’s head of incident response, Matt Lawrence. Matt and Eliza share their views on tackling the cyber skills shortage, why diverse teams are more adaptable, and why Eliza’s background as a nursing assistant is an asset in the world of incident response. Listen, or read on for the transcript. And don’t forget to subscribe, rate and review! ALL EPISODES | FOLLOW US ON TWITTER Janne: Eliza and Matt, welcome to the show. Matt: Thanks, Janne. Eliza: Thank you. So we’ve been reading news articles about the cybersecurity talent shortage for years, and some people say that this is the result of unrealistic expectations meeting ineffective recruitment practices. What’s your take on this? Matt: It’s interesting. When we’re talking about the skills shortage, we’re looking at forward predictions, and I always want to point out that nobody in 2019 was really predicting 2020. But if you look at all the figures, currently there’s somewhere in the region of three million cyber security professionals globally today. Most of these estimate that there’s a skill shortage of around four million roles, and that’s in both the public and private sector, and that’s only in the eleven major world economies. So it’s reasonable to assume that it goes much further than this. And beyond the situation we’re in today, the skills shortage is expected to peak in around about five years’ time, if reports are to be believed. So simply put, we have a big problem and it’s getting bigger. And in incident response, I think, ransomware over the past couple of years has been a wake-up call for many organizations because it’s impossible to avoid the impact of your entire network being encrypted. And more companies are waking up to the fact that they need people with these skills at their disposal when they need it most. And yet quite broadly, the industry, as we stand today, isn’t prepared for this. And we really need to do more, now, to cope with this upswell of attacks that we’re expecting to see. Matt Lawrence, Eliza Bolton So we can’t just sit back and expect the universities to turn out quality skilled people for us. So we need to take steps ourselves. Matt: Absolutely. We have to take an active responsibility in ensuring that we’re able to defeat this. And of course, there’s many different approaches here. It’s not just simply about hiring people. Although I would argue that that is of course the most significant issue here. We do need to diversify our sources of hiring beyond graduates and purely experienced people. And there are a range of benefits to doing that. It’s not just about filling headcounts, particularly in incident response. That phone can go on at any time of day. And you cannot generally predict that, particularly for a service like ours that is global. You cannot predict the organization that’s going to be calling that number at any given time. And having a greater mix of skills and life experiences is fundamental to enable us to be more sustainable in how we provide services. But that really comes from, I feel, the whole industry reviewing and updating the hiring practices to fit more with the modern world. And for me, Eliza is somebody who definitely speaks to that. Eliza, can you tell us a little bit about yourself, your background, before you began your career in incident response? Eliza: I come from a rural village in Norfolk, where internet is basically non-existent. Even just to get this recording, I’ve had to ferret around to try and get somewhere so I got steady internet. I thought I wanted to follow in my mom’s footsteps into nursing. And I did get a place at uni to do general nursing. And then before that, mum was like, “Look, just to make sure that you want to do this, please, go and work as a nursing assistant.” So I got a nursing assistant job at our local hospital, and I worked around for a bit in different departments. And I found that I absolutely loved working in A&E. That’s the emergency department, for our international listeners. Eliza: Yeah. So it was such a lovely place, you’ve got doctors, you’ve got the consultants, you’ve got the nurses, you’ve got the HCAs, to me. And we were all such a big family and worked together, because you never knew what came through those doors, and it was just really great. And then I did some traveling, and then I was very lucky to be introduced to Matt by my brother, because my brother actually works for F-Secure too, but in the sales side. And he said to me… “Look I think this would be really good for you. You love problem solving, you have a logical way of thinking, you love your maths, you love reasoning. I think going into something like incident response would be really good for you and you’d really enjoy it.” So I was then lucky to meet Matt, and I had a coffee and met some of the team, and was just fascinated by what they were talking about and thought, “This sounds really cool. I would love to go into this.” And I was then very lucky to be offered an internship in IR, being their first guinea pig. And yeah, from there I’ve just loved every minute. And it’s been very challenging, but a fantastic step that I took. But no background in computer science or computers in general? Eliza: No, no background at all. I actually didn’t have a computer before I started working for F-Secure. So I had… That’s super interesting. Eliza: I had a laptop when I was younger, but it had died. Matt: The kids today, they’ve all got iPhones. Eliza: Yep. I didn’t need a laptop. So even in the industry, IR is considered very technical. So to me, it’s super interesting that somebody who has no prior technical background can just jump in and sort of get cracking. Were you apprehensive about that all? Did you understand what you were getting into? Eliza: No, I had no idea. When I got into it, I thought, “Oh my God, what is going on? I don’t know any of this. There’s so much to learn. What are these guys talking about?” And it’s just been a lot of hard work and shadowing people, and I seem to find everything breaks that I try to use. So I’m always trying to fix things. So having to read up so much more about it and then going away. So I think that’s a really good way to learn. I was just going to say, sounds like learning opportunities. What was the transition like for you? What went as expected, and what were the surprises? Eliza: It was a huge transition, considering I came from working in A&E doing something very different, to then coming into the technical side. So it was a huge transition. Surprises, I think it’s…there’s just so much to learn. There’s new things coming all the time, and just understanding something completely is very…I found it quite tricky. So having to go over it all the time, and then finding something new, and then seeing how it all links together. But yeah, it’s been a huge transition. Do you think that the fact that you came from an emergency department helped in that? Because I would say that an emergency department sounds like real life IR, to me. So if you had come from a different field of nursing, for example, would that have been different? Eliza: I suppose it would, because I suppose when you think about it, if you’ve got a client that’s being hacked or compromised, it’s like having somebody come through A&E who’s bleeding or got burns or fighting for their life, and you’re trying to figure out what you can do, and what’s going on if they can’t talk or something. So I suppose it’s very similar because you’re still trying to think of it as like, “Right. We need to diagnose this. What do we do?” So yeah, I can see how they’re very much linked, and you get transferable skills, definitely. And also for yourself, mentally. In incident response situations, when you first come across them, they’re very traumatic and stressful, as I would imagine first aid situations are as well. So there’s that mindset that there’s horrible things happening around you, but you have to be cool. You have to be calm and collected and the one in control. So do you think you you’re better off when you have that experience? Eliza: Yeah, I think you definitely are. I suppose with working in A&E and having…I’ve seen some horrendous things in my time there. And I think I can be quite calm in those situations, and I’ve had to learn to be calm, because obviously you’ve got families around, and you’ve got to stay calm for them and put on a brave face and things, and try and calm them down. So I think I’m kind of used to that whole stressful situation, and I do actually really like it. I enjoy having to just keep everyone around you happy and relaxed, and try and get through them. So I can see how that can really help, especially when an incident comes in, because you’ve got clients that are very agitated and nervous about things that are happening. So I think it, yeah, definitely helps coming from knowing things like that. So Matt, were these the kinds of things you were thinking about when you were considering Eliza as a candidate? You’re going so far outside the usual field where we look for candidates. Matt: I’m a big believer in sometimes just giving something a go and seeing what happens. And particularly with this situation, it was a perfect opportunity that emerged at the right time. So we’ve been thinking a lot about things that we could do more in incident response, to enable people just getting a start in the industry. And we were working on, I guess perhaps incorrectly at first, the more formal aspects of that, trying to map out a career plan almost, a development plan. But all the people who were doing that, including myself, are former graduates, and some of us have spent quite an extended amount of time within the industry. So this situation arrived and it was like, “Oh, well this is great.” We could now throw all of this stuff that we’re doing incorrectly in the bin and actually figure it out properly. And it really also enabled me, I guess, to put my money where my mouth is. Because for years I’ve stated, and I firmly believe this, that the technical skills can be learned. It’s behaviors and we look for. And some of the things Eliza’s just mentioned there, in terms of her experience with A&E, is very apt. Incident response is always about borrowing and stealing the best bits from other industries. And we stole the triage process within incident response from medical parlance. And that point about being calm in the cyber chaos is absolutely key. And I think sometimes your ability to cope with these situations is relative. If the worst situations you’ve ever experienced are organizations being cyber attacked, it’s going to be, for most people, an incredibly difficult situation to cope with mentally. But if you come from a different field with perhaps a different perspective, straight away, you’re at a distinct advantage there mentally, to be able to cope with the, sometimes, the stresses of this job. But with Eliza, and to be honest, anybody who’s looking to enter the industry, it’s about personal dedication, and it’s much more about the individual’s willingness to commit to the opportunity that is put in front of them. But with things like the UK Associate Scheme, which is another first step in this situation, which we released recently, is another example of progress that is being made here. But we need to and are going to be doing more over the next few years because otherwise this industry is not sustainable. Yeah. So when somebody with Eliza’s background joins the team, what are some of the things that you guys have picked up from her? Matt: It’s a really interesting question because learning is not a one-way street. In many ways the things that we assumed would take a long time to learn have perhaps been some of the quickest elements to learn. I guess the more challenging areas come with application of knowledge. And we’ve learned a lot about that with Eliza. I think in the early days, we were almost just chucking information over the fence and it was approaching information overload. We took a step back and realized it’s actually a lot more to do with the application of the knowledge, and ensuring that it’s retrievable. Because when you’re facing a cyber crisis, sometimes you have to make some really quick decisions in that process. And retrievability, the actionability of the information that you hold in your head is paramount. So it’s caused us to tweak hundreds of things in terms of how we train people and also how we operate the service operationally. It’s really kind of enabled us to take a step back and think, Well, instead of just thinking everybody’s going to join in and be an incident response unicorn and jump in and do everything to a high standard, we’ve got to accept that people learn at different speeds, and different levels of experience, meaning that they can contribute in different ways. And we took a step back and realized, well, our operation wasn’t facilitating and enabling people to contribute as quickly as they perhaps could have done. So it has had a transformative impact on our service. Super rewarding. Not just brilliant working with Eliza, of course, but I think just the benefits that we’ve extracted as a team have been incredible. And I guess I encourage all incident response providers in the industry to think along similar lines, because the benefits are substantial. Eliza, can you recall moment or a specific thing where you felt that you brought something to the table because of your background and who you are? Eliza: Last year, so 2020, I did a talk about women in tech. And I did that with my manager, Joani, and I was so nervous to do it. We did a talk about our journeys, and how it is a little bit different, especially for women, and how it’s a very male-dominated field and basically how it felt and stuff, and our journeys and how we got there. But I think, I don’t know if it’s just me, but I think…I went to a school where I was the only girl in my year, that was a local primary school. And then my mom and dad then sent me to an all-girls school, which I didn’t really like at all. I liked growing up with my brother, so all of his friends and stuff. So I don’t find that big bridge that some women do find in the field and I feel totally at home in, and happy to be in a group of guys. It doesn’t make any difference to me because obviously it’s what I’ve known, growing up with my brother and stuff. So I haven’t seen that bridge, but I know women have talked about that there is a huge bridge and that they’ve been treated differently, "
author = "Melissa Michael"
year_published = 2021
year_updated = 2021
