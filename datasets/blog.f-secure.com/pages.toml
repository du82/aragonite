["https://blog.f-secure.com/es/seguridad-digital-como-proteger-su-movil"]
title = "Seguridad digital: ¿Cómo proteger su móvil? - F-Secure Blog"
description = "El robo de datos con ransomware ha aumentado enormemente durante la pandemia. Sepa más sobre como proteger su móvil contra estos ataques."
full_description = "El robo de datos con software de chantaje (ransomware) ha aumentado enormemente durante la pandemia. Asi lo revela la última actualización del “Panorama de ataques cibernéticos” de F-Secure. Este tipo de ciberataques habían sido dirigidos tradicionalmente contra empresas. Sin embargo, hackers emplean este tipo de malware cada vez más contra particulares, en dispositivos móviles y computadoras. A continuación descubrirá cómo proteger sus dispositivos móviles. ¿Cómo funcionan los ataques de ransomware? El ransomware encripta todos los archivos de su dispositivo electrónico. Por lo tanto, usted no puede acceder a ellos sin una clave de descifrado. El objetivo del ransomware moderno es también robar datos antes de encriptarlos. Así los delincuentes pueden además amenazar con filtrarlos. De esta manera se presionan las víctimas a pagar rescates. Por ejemplo, el ransomware también puede bloquear el dispositivo electrónico por completo. A continuación, entonces los delincuentes exigen el pago de dinero a cambio de la clave. Incluso unos 300 a 500 dólares en Bitcoin por dispositivo. ¿Cómo me contagio con ransomware? En primer lugar, el ransomware tiene que ser descargado manualmente, por accidente o por otro malware. El software dañino se encuentra en archivos de mails, así como en sitios web y publicidad maliciosa o redes Wi-Fi inseguras. Además que los programas malignos también pueden bajar ransomware sin que usted lo note. ¿Puede el ransomware infectar a mi celular? Estos ciberataques afectan muchas veces a los computadores y Notebooks. Pero por supuesto que el ransomware para móviles existe. Por cierto tanto para dispositivos iOS como Android. Más aún, es una creciente amenaza debido a la gran cantidad de personas que utilizan smartphones. Los dispositivos móviles necesitan protección Ahora piense por un segundo para qué utiliza sus dispositivos móviles. Por ejemplo, para las compras en línea, online banking, fotos, mails etc. Pero por desgracia es la información relacionada a los pagos el blanco frecuente de filtraciones de datos. Además que los delincuentes ultimamente se enfocan en robar datos y el dinero de los usuarios de dispositivos móviles. Sin embargo, el problema es mayor. Ya que el botín se usa incluso para cometer robo de identidad y la apropiación de cuentas. Por eso la seguridad de su dispositivo móvil debe estar a la altura de los ciberataques. 5 consejos para mejorar su seguridad digital móvil: Úse un antivirus para dispositivos móviles Primero, esté consciente de que el malware dirigido a los dispositivos móviles existe. Mientras que los virus informáticos tradicionales no son un gran peligro para los tablets y smartphones, otros tipos de malware sí lo son. Segundo, el malware entra a través de tiendas de aplicaciones no oficiales, redes inseguras, archivos de mails o sitios web dudosos. Por esta razón, evite contagios utilizando un antivirus. Además mantenga sus aplicaciones y su sistema operativo actualizados. Evite el malware, evite las aplicaciones sospechosas Actualmente sabemos que algunas aplicaciones existen sólo para obtener sus datos. Pero éstas ofrecen pocos beneficios al usuario. Por ende, aceptar sus términos y condiciones significa darles carta blanca. Además, las apps de las tiendas de aplicaciones no oficiales no son examinadas y pueden resultar ser cualquier cosa. Filtraciones de datos ocurren y no hay manera segura de distinguir una aplicación sospechosa. Por eso empiece por pensar para qué la usa. Es decir, si no es necesaria, no tiene sentido tenerla. Más aún, si no le sirve, elimínela inmediatamente. No dé permisos innecesarios Primero hay que decir que muchas apps y sitios web tienen graves problemas de seguridad. Por esta razón, dar permisos innecesarios puede derivar en una filtración de datos. Pero lo mismo ocurre si da demasiada información personal a los servicios. En resumen, piénse que si usted está en línea, existe la posibilidad de que le roben. Por eso dé los menos datos y permisos posibles. Así ayudará a evitar convertirse en víctima de robo de identidad. Usted también puede elevar la seguridad en línea apagando el Bluetooth y el Wi-Fi cuando no los use. Ya que estas conexiones suelen ser utilizadas para los ciberataques. Proteja las conexiones WiFi con VPN Nunca sabrá si una red WiFi pública es segura o no. Además que todo lo que haga a través de un WiFi inseguro puede ser interceptado por criminales. Frecuentemente, las redes WiFi inseguras incluso son utilizadas para distribuir malware. Por ello, una buena manera de mejorar su seguridad es conseguir una VPN para su dispositivo móvil. Asi, con ella puede utilizar el WiFi público de forma segura. No abra links sospechosos Por ejemplo, los ciberataques de phishing, son más efectivos en los dispositivos móviles. Ya que en una pantalla pequeña las aplicaciones sólo muestran el nombre del remitente, no su dirección completa. Además, los smartphones o tablets se utilizan mucho estando en camino. Es decir, es más fácil estar distraído y caer en estafas. Por esta razón, no abra links sospechosos! Primero compruebe la dirección de correo del remitente. Asimismo, recuerde que ninguna empresa seria le pedirá información confidencial por mail o SMS. Proteja sus dispositivos contra el ransomware y demás ciberataques F-Secure TOTAL incluye una VPN, un antivirus y un gestor de claves que mejoran la seguridad de sus dispositivos móviles. Obtenga toda la protección que necesita en un sólo paquete. Incluso puede probarlo gratis durante 30 días y sin necesidad dar su tarjeta de crédito."
