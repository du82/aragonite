["https://blog.f-secure.com/podcast-episode-64-2021-2022-and-beyond-part-2"]
title = "Episode 64| 2021, 2022 and beyond – Part 2 - F-Secure Blog"
description = "With 2021 now behind us, it’s time to revisit the highs and lows of the past 12 months, and look ahead to what we can expect in the months ahead."
full_description = "With 2021 now behind us, it’s time to revisit the highs and lows of the past 12 months, and look ahead to what we can expect in the months ahead. To mark the year’s end, we recorded a special two-part episode of Cyber Security Sauna. F-Secure’s Chief Research Officer Mikko Hypponen, Security Consultant Adriana Verhagen, and AI researcher Andy Patel join episode 64 to share their key takeaways from 2021, and thoughts on important issues we’ll face in 2022 and beyond. In this episode: regulating social media networks, cloudification, AI-powered attacks, security in an age of unlimited computing power, NFTs, and more. Listen, or read on for the transcript. And don’t forget to subscribe, rate and review! Welcome to Part II of a special two-part episode of Cyber Security Sauna. In our last episode, we were joined by AI researcher Andy Patel, security consultant Adriana Verhagen, and F-Secure’s Chief Research Officer, Mikko Hypponen, to hear their thoughts on significant moments and trends in 2021. Now our conversation turns to the year ahead where we’ll hear about their expectations, hopes, and fears for 2022 and beyond. Janne: So with 2021 now safely behind us, it’s time to start to think about what sort of trends emerged from that year that we think are likely to continue in 2022. Predicting the future is always very hard, so I’m not going to ask you guys to do that, but what are some of the things you think we’re going to continue to see in 2022? Mikko Hypponen, Adriana Verhagen, Andy Patel Andy: I think that there’s going to be more people talking about the problems we have with social networks. So what sort of conversation are you looking for? Andy: Conversation about regulations regarding disinformation, trolling, online harassment on social networks. I know that some countries have started talking about these things, different aspects of things. The US hasn’t talked much about this stuff at all. I think the US needs to start talking about it, actually, because that’s where the companies are. What do you think the conversation’s going to look like? Is it going to be… GDPR did a lot in this area as well, so is it going to be regulation, or local legislation, or what do you think it’s going to be like? Andy: On the European side, it’s going to be local. I mean, Germany already has regulations regarding social networks, that they can fine them if certain types of content appear on there. And so social networks actually treat the German use case differently. Twitter even has fields in the API that are relevant, I think, only really to Germany and other countries that have those kind of agreements. It might be wise for the EU to cover this as a whole, across the whole of all of the EU countries, to approach it in the same way that Germany has, to ban certain types of content, and to hold social networks accountable for online harassment, and spreading disinformation, and trolling, and all the other stuff that is going on. Perhaps they should approach it the same way that they’re approaching blanket regulations for AI, which they’ve been doing this year. Mikko: Sounds like something which is a good idea on paper, and very hard to get right when you actually regulate it. Which we already saw, at least in the draft of the AI regulation, the idea that any company using machine learning-based technologies must be able to show how the decisions were actually made. Sounds like an impossible task, and basically restricting companies from using this kind of technology for the benefit of all. It’s going to be hard to get right for social networks as well. If you’re going to ban content, how to define it right so it’s not going to be misused? Andy: Yeah. And as with the AI regulation work that’s been going on, the drafting of those regulations has taken input from a lot of experts and companies, and so I think that’s how it should work, in a traditional EU manner that these things are drafted and then a lot of feedback and discussion happens about the nuances of these laws. And with the AI regulations, they actually structured it such that there’s the main body of the document and then appendices which can be changed more easily to cover change in the landscape as we move forward. Well, with the AI regulation, there’s been some concerns that it’s going to stifle innovation, but actually those same concerns were already voiced in GDPR conversations. So do you think we’ve learned anything since then, and we’re going to be now better positioned to take those concerns into account? Or do you think we still run the risk of stifling innovation when we introduce new regulation? Andy: It really does depend on the final wording of those regulations. There are things in there right now that need to be changed, like what Mikko pointed out, about the fact that we need to be able to explain how decisions are made and we need to be able to show that every piece of data in the training set was vetted for bias and inaccuracy and stuff like that, which is…these tasks are impossible. The wording needs to be such that it allows for normal use cases. But I think that as long as these high-risk applications are well defined, it shouldn’t stifle innovation. Because really, those are the ones where the regulations apply the most. Mikko: But the concern is very valid. Teaching machines with biased data will of course lead to biased decisions, and it’s a really valid concern, and it’s a really hard thing to get right. It’s a huge problem. We need massive amounts of data when we want to teach machines, and most of the data we have is originally biased, or it gets biased as we collect it. And we humans are biased ourselves, so it’s…I don’t really know how to solve this, but the concern is very valid. Andy: Yeah. And when you look at the machine learning that’s already in use in the world, when we think about recommenders for social networks, those things are being manipulated by inauthentic behavior all the time and they’re learning from it. And so that bias exists on a day-to-day basis in the models that are trained on the data that’s fed into social networks. Mikko: Yeah. And when, for example, law enforcement uses advanced systems to figure out where there’s likelihood of crime to appear and who are the people likely to engage in criminal activities in the future, even though they haven’t done it yet, we suspect they will do it in the future, sort of like pre-crime idea, surprisingly, this is not science fiction. This already happens all the time around the world. Of course, bias has a huge point in all of those discussions, like who do we suspect to be future criminals? You’re under arrest for a future murder. Andy: Minority Report. Yeah, because you look like one of our past murderers. Mikko: Yeah. What about you, Adriana? What sort of things do you think are going to happen in the regulation space? Adriana: I think that what we’re going to see is that there’s a growing need for threat-based pentesting and exercises, and these are being driven by the rollout of DORA and TIBER. So these regulations, they, in their own way, will stimulate those type of exercises. So when we talk about threat-based pentesting, we’re really emphasizing having the attacker’s perspective being included in the exercises that organizations perform, and this is a bit different than what has been going on before, which is traditional pentesting, which doesn’t have to be attacker oriented. It could just be for these generic weaknesses that we found. A common framework that pentesters use is called OWASP. And with that shift, I think what will be interesting is that companies will include their attacker perspective more in their defenses as well. And we’ll see a shift from the narrative, as well. The security narrative is going to change from being one of “We’re having vulnerabilities” to “We have an attack path that could lead to a significant business impact.” And we’re already seeing a bit of that, but I think that with these regulatory changes, we’ll see more of that. In order for this to be a success as well, we’ll need the maturing of cyber security processes in organizations. And cybersecurity has been a topic now for already a while and processes are not ad hoc anymore, so they’re becoming more mature, and they’re collecting better data. And through that maturing, we can also see that cyber security risk management will become more quantified. Because in order for risk management to be quantified, it needs to have really good data. And to tie that back to the regulatory changes, is that, until now it’s been hard to do cyber risk quantification because we just don’t have enough data on the impact associated with cyber risk. And these new regulations, also new regulations in the US, are forcing companies to be more public about the impact. So when you tie this all together, we will see that more companies will become more mature about their cybersecurity processes, but also they will start using cyber risk quantification to drive their investment decisions. And I think that that’s a really positive trend. One of the things I think we noticed in 2021 was with the pandemic pushing companies into the cloud. Remote working is certainly here to stay, so maybe that was an unintended side effect of an unintended side effect. What does that increasingly cloudified corporate environment look for, for an attacker? What are they going to do differently in the future? Andy: Phishing. If we’re in a world that Mikko has spoken about, where we’re on terminals, dumb terminals, then one of the obvious ways of attacking people would be to phish for their credentials. Yeah. If you can’t break in, you have to get somebody’s key. Andy: Right. Mikko: Yeah. Well, we go through the easiest way in, and in the future, the easiest way in will continue to be the users. And I’m not blaming the users here. I don’t like the phrasing we often see, that the user is the weakest link. I think that’s not really fair. We’re putting users into an impossible position. It’s not stupid users, it’s stupid systems. And if there’s a link on the screen the user must not click, then the link really shouldn’t be on the screen to begin with, and we should put the responsibility to where it belongs. And it doesn’t belong to the user. But it is a hard problem to solve, and this will only become a bigger and bigger issue in the long run. And when you think about the world where we are headed, looking at how technology has changed over the last decades and how it will continue, I think, in the future decades, computing power has increased, storage space has increased, memory has increased, connectivity, bandwidth has increased, prices have plummeted. All right, let’s assume for a second, this continues. What will the world look like in the end? Well, it’s going to look like that everybody has unlimited computing at their fingertips for free. And when I say unlimited, I mean imagine that you have access to the biggest possible AWS cluster with unlimited processing power, unlimited RAM, unlimited storage, unlimited bandwidth, and it costs nothing, or it costs pennies, so practically free. That’s the world where we’re headed, and I think even though this might be a pipe dream or might be really far away in the future, I think it’s an interesting idea to think about, especially from the point of view of builders and developers and coders. And the question then becomes, if you would have no limits, what would you build? If there’s no practical limits for processing power or memory or any of that, what kind of solutions would you be building? And that’s a sort of liberating thought, and I do think that’s sort of the direction where we’re headed, even though we might not be exactly there in the end. But looking at the last 30 years, this is the direction where we are headed. I think it’s going to continue. It’s an interesting vision. Are you not worried about sort of what the attacks in that world are going to look like? Mikko: Yeah. Bad people will not be going away, that’s for sure. And there will be crime, and since crime has changed to this new world where geography no longer matters, it’s definitely going to be there. When I was writing my book last year, I did a study about bank robberies. Did you know that in Finland, my home country of Finland, in 1991, 30 years ago, we had 114 bank robberies? Like, robberies where banks went into banks with guns to steal cash? And the last time we had a bank robbery was in 2005. We haven’t had a single one since then because there’s no banks anymore and the few banks we have don’t have cash. We do have plenty of online bank robberies, banking Trojans credit, card theft, hacks into cryptocurrency exchanges, and phishing of credentials for financial systems. So real world bank robberies have disappeared. Online bank robberies have exploded. And this is the way of the future as well. Crime doesn’t go away. It just changes shape. And it will continue changing shape in the future as well. Andy: With regards to having unlimited compute in the future, that will mean that all these cryptocurrencies will go away. Well, that’s what I was thinking. I’m going to do crypto mining in that world. Andy: Well, yeah. I mean, it’ll sort of invalidate that, won’t it? Because… Mikko: Well, if you look at Bitcoin in particular, it automatically adjusts for difficulty, so if you have a huge amount of computing power, it would be hugely difficult to solve a single block. So they, or he, Mr. Satoshi, has already thought about this. Andy: But if everyone has access to very large amounts of compute, then everyone could be mining. Mikko: As long as it’s not literally unlimited, it would self-adjust. This has been taken into account, which is interesting. Another interesting thing about the original Bitcoin paper is that it already takes into account quantum computing. Bitcoin algorithms are quantum safe if you use unique keys for every single new transaction. Which is remarkable, considering that this is from 2008. So it’s sort of like aliens landed and left this mysterious paper and disappeared and we’re still wondering how the hell, who the hell, what the hell? What is this? Yeah. Plus all the Bitcoin will have been mined in a couple of years anyway, so… Mikko: No, no. That’s going to be another a hundred years before we get the last one. But yeah. We’re actually very close to 90 percent of all the Bitcoins being mined, so it becomes slower over time. Ah, okay. I didn’t know that. Mikko: But the vast majority of them have been mined already, and big part of that has been lost forever as well, which is interesting. And whenever we speak about unlimited computing power as well as Bitcoin and Blockchain, we very quickly enter into discussion about the planet and global warming and how is this good for the environment. And of course, none of this is good for the environment. But I do believe that the solution for g"
