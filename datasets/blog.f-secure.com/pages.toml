["https://blog.f-secure.com/fi/5-tapaa-suojautua-identiteettivarkaudelta"]
title = "5 tapaa suojautua identiteettivarkaudelta - F-Secure Blog"
description = "Jokainen meistä on kiinnostava kohde verkkorikollisille. Jos rikollinen onnistuu kaappaamaan identiteettisi, hän pystyy tekemään paljon haittaa ja aiheuttamaan ylimääräistä vaivaa, kun joudut selvittämään nimissäsi tehtyjä asioita tai perumaan nimisissäsi otettuja luottoja. Mikä pahinta, vaivan ja rahallisten kustannusten lisäksi identiteettivarkaus rapauttaa turvallisuudentunnetta. On siis monta hyvää syytä varmistaa, ettei joudu sellaisen kohteeksi.  Identiteettivarkaudet eivät ole harvinaisia. Tilastojen valossa on paljon […]"
full_description = "Jokainen meistä on kiinnostava kohde verkkorikollisille. Jos rikollinen onnistuu kaappaamaan identiteettisi, hän pystyy tekemään paljon haittaa ja aiheuttamaan ylimääräistä vaivaa, kun joudut selvittämään nimissäsi tehtyjä asioita tai perumaan nimisissäsi otettuja luottoja. Mikä pahinta, vaivan ja rahallisten kustannusten lisäksi identiteettivarkaus rapauttaa turvallisuudentunnetta. On siis monta hyvää syytä varmistaa, ettei joudu sellaisen kohteeksi. Identiteettivarkaudet eivät ole harvinaisia. Tilastojen valossa on paljon todennäköisempää, että sinut ryöstetään verkossa kuin kadulla. Mitä identiteettivarkaudet ovat? Identiteettivarkaus on rikos, jossa esiinnytään toisena henkilönä. Internet on helpottanut identiteettivarkauksien toteuttamista avaamalla uusia mahdollisuuksia vieraan henkilöllisyyden väärinkäyttämiseen. Väärällä henkilöllisyydellä voi esimerkiksi ostaa tavaroita verkosta laskulla tai ottaa pikavippejä. Myös internet-profiilien kaappauksen voi nähdä identiteettivarkautena. Kuvittele, että joku kaappaisi Facebook-profiilisi tai sähköpostisi ja pyytäisi kavereiltasi rahaa lainaan käyttäen jotain hätätilannetta verukkeena. Moni ystävistäsi saattaisi mennä lankaan. Pidä huolta henkilötiedoistasi verkossa Jos joku kysyy henkilötunnustasi ja osoitettasi verkossa ilman poikkeuksellisen perusteltua syytä, hälytyskellojen kannattaa soida. Onko kyseessä varmasti luotettava taho? Miksi näitä tietoja kysytään? Näiden vinkkien avulla suojaudut niin verkon, kuin myös ”oikean maailman” kautta tapahtuvilta identiteettivarkauksilta. 1. Minimoi paperisen postin riskit Identiteettivarkaat voivat helposti varastaa postisi, ellei sinulla ole lukollista postilaatikkoa tai luukkusi ole ovessa. Jos varas on päättäväinen, nämäkin ovat vain hidasteita. Pelkkä saapuvan postin suojaus ei riitä, koska varkaalle kaikkein helpointa on tonkia paperikierrätyslaatikoita ja napata sieltä luottokorttilaskuja ja muuta arkaluontoista paperiroskaa. Näistä tiedoista pystyy päättelemään, mistä ostat, mitä ostat, mikä on asiakasnumerosi ja mihin osoitteeseen olet tilannut. Näitä tietoja yhdistelemällä voi harhauttaa asiakaspalvelijoita toimittamaan tavaraa uuteen – ja väärään – osoitteeseen. Välttääkseis tämän, revi yksilöivät tiedot, kuten osoitteesi ja nimesi pois ennen kuin heität paperit paperinkeräykseen. 2. Pienennä paperijalanjälkeäsi Vielä paperisen postin turvaamistakin parempi ratkaisu on luopua paperista niin paljon kuin mahdollista. Myös luonto kiittää sinua tästä. Siirrä laskusi verkkolaskuiksi ja palkkakuittisi verkkopalkkapalveluun. Tällöin suurempi osa arkaluontoisista tiedoistasi on vahvan tunnistautumisen takana ja käsiteltävänä vain salatun yhteyden läpi, mikä on paljon fyysistä postilaatikkoa turvallisempaa. 3. Huolehdi salasanoista – etenkin sähköpostissa Älä käytä samaa salasanaa kahdessa eri palvelussa, varsinkaan sähköpostissasi. Kannattaa käyttää salasanojen hallintaohjelmaa kuten F-Secure ID PROTECTION, jotta voit helposti varmistaa, että käytät jokaisessa palvelussa riittävän vahvaa uniikkia salasanaa ja silti pääset helposti kirjautumaan näihin palveluihin. Hyvän salasanan lisäksi tärkeimmissä tileissä, kuten sosiaalisen median tileissä ja etenkin sähköpostitileissä on tärkeää panna kaksinkertainen kirjautuminen päälle. Tällöin pelkän salasanan arvaamalla identiteettivaras ei saa pääsyä verkkoidentiteettisi keskeisimpään paikkaan – sähköpostiin. Kaksinkertainen kirjautuminen (two-factor authentication) vaatii salasanan lisäksi koodin toisesta laitteesta. Sähköposti on erityisen tärkeä pitää turvassa, koska jos identiteettivaras saa pääsyn sähköpostiisi, pelissä ei ole pelkästään yksityisyytesi ja viestisi. Varas voi sähköpostitilisi avulla käyttää eri verkkopalveluiden salasananpalautustoimintoja ja täten kaapata muutkin tilisi, esimerkiksi sosiaalisen median tilisi ja verkkokauppojen tilisi. 4. Verkkopankki – ei ainoastaan rahasi, vaan myös henkilöllisyytesi Koska on kyse rahasta, on itsestään selvää, että verkkopankkitunnukset kannattaa pitää hyvin tallessa. Raha ei ole ainoa tärkeä asia verkkopankissa. Vaikka tili olisi tyhjä, verkkopankilla voi tunnistautua. Pankkitunnuksia pidetään Suomessa riittävän vahvana tunnistautumisena lähes mihin tahansa asiointiin. Jos jollain on pääsy verkkopankkitunnuksiisi, hän voi ottaa lainaa nimissäsi tai muuttaa tietojasi viranomaispalveluissa – esimerkiksi uudelleenohjata kaikki postisi ja pakettisi itselleen. Koska julkisissa langattomissa verkoissa on mahdollista harhauttaa joku antamaan tiedot väärälle sivulle, ei näissä verkoissa kannata käyttää verkkopankkia, tai tehdä mitään muutakaan vahvaa tietoturvaa vaativaa – paitsi jos käyttää yhteyden suojaavaa VPN:ää, kuten FREEDOME VPN. 5. Tietojenluovutuskielto Jos sinulla on poikkeuksellisen suuri riski joutua identiteettivarkauden uhriksi, voit pienentää sinusta saatavilla olevaa tietoa tekemällä tietojenluovutuskiellon maistraattiin. Tällöin ainoastaan viranomaiset saavat tiedot. On meidän jokaisen omalla vastuulla pitää huolta identititeetistämme verkossa. Se voi tuntua joskus mahdottomalta, mutta näitä vinkkejä seuraamalla olet jo askeleen edellä verkkorikollisia!"
author = "Tuomas Rantalainen"
