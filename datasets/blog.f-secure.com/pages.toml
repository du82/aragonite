["https://blog.f-secure.com/podcast-appsec-two-anttis"]
title = "Episode 61| AppSec, According to Two Guys Named Antti - F-Secure Blog"
description = 'The topic of application security has never been more important. So how are companies approaching appsec? What should companies do to ensure appsec gets the attention it needs? Principal security consultants Antti Tuomi and Antti Vaha-Sipila share their thoughts on changes in application security, shifting left, supporting developers, "level boss testing," and much more.'
full_description = "The topic of application security has never been more important. So how are companies approaching appsec? What should companies do to ensure appsec gets the attention it needs? For episode 61 of Cyber Security Sauna, Antti Tuomi, who works in Japan and Antti Vaha-Sipila (known as AVS), from Finland, joined the show to share their thoughts on changes in application security, shifting left, supporting developers, “level boss testing,” and much more. Listen, or read on for the transcript. And don’t forget to subscribe, rate and review! ALL EPISODES | FOLLOW US ON TWITTER Janne: So guys, throughout your career, what have you change in terms of how application security is regarded by organizations and how they tend to approach that? Antti Vaha-Sipila: Well, at least for me, the one interesting trend that I’ve seen is the rise of threat modeling. 10 years ago if you looked at how companies were doing security, very, very few companies said that they do threat modeling, which is a sense just thinking about risk beforehand, before starting implementation. But now it’s not rare at all. For example, we help a lot of people with threat modeling, getting the kind of wheels of the ground, so it’s not rare anymore. F-Secure Principal Security Consultants Antti Vaha-Sipila, Antti Tuomi Antti Tuomi: I think it’s kind of interesting also, speaking about this with AVS here, because you have a lot of experience in enabling security and development, as part of a development organization. Whereas during my history in security, I have mostly been on the security auditing, security testing side of things. There has been a lot of change on both sides of that spectrum. When I was starting in the application security industry or business, like back in the late 2000s, usually we would do a security test as ordered by the customer. And then we would find some vulnerabilities. And that would be the norm back in the day. So of course, cross site scripting, SQL injections, all those things were reasonably new. And usually when we held the meeting about, okay, here are the results, usually the first thing would be like, “Well, is this really an issue? I mean, we have SSL, so does it matter if we have these scriptings and these injections? Our database server is in the intranet, you can’t access it, like this isn’t exploitable, is it?” So we had to go through that whole process of like, okay, which part in the security stack takes care of actually which layer of security. And that is definitely, fortunately, one of the things that I do not remember having to have that discussion in the last 10 years now. So I’m very happy about that. This must have been around the same time when somebody asked me that if SQL injections are a thing, why are people still using SQL? So like, do you feel that companies are more aware of like what these security sort of basics mean, now that we’re having less of those conversations? Antti Tuomi: Definitely. I think the overall security awareness – security not just being antivirus and firewalls, but also being how you build the applications – that is now a piece of common sense, that yes, we do need to also protect our applications, not just the networks and the endpoints. Antti Vaha-Sipila: Right. Antti, when you say that you haven’t seen that sort of stuff for a while now, do you think that the root cause is just about awareness? Or is it about frameworks and architectures getting safer, or something like that? Antti Tuomi: That’s actually a very good point. And I think you are absolutely correct in hinting that frameworks and everything do have a big part in that. Because if you consider, for example, the web application development languages and frameworks in like late 2000s, early 2010s, you would still have a lot of applications written in PHP, just vanilla PHP. And if you didn’t know that SQL injections are an issue, then how would you prevent them? And nowadays, a modern MVC framework with an ORM layer on top of it, it is actually more difficult to write an injection flaw than it is to write like a normal safe query. So I think you’re definitely right about that. Antti Vaha-Sipila: The reason I asked was because the other big trend or big change that I’m seeing is really, especially in greenfield development when you’re doing something completely new, the architecture nowadays tends to be like a cloud native architecture, so we see a lot of APIs, even in microservice architecture. And I think that that does carry a significant security benefit, because APIs are much more restricted in what they can accept. For example, you don’t have to do that sort of page-building on the server side anymore. And so, I think that is the major contributor, from my perspective, to the situation. So do these frameworks and new methods of working, do these mean that we’re actually making software secured by design more, or more easily than before? Antti Tuomi: Not necessarily by design, but the basic layers and premises of security are often abstracted away. So that the average developer does not have to think like, okay, with my MVC framework and ORM framework in 2021, how do I write an SQL query? What type of a join do I need to make? Instead you just query for objects in the code and you just get it. So it’s completely… You don’t need to touch the internals. And that definitely helps in also making sure that you don’t touch the internals in the wrong way. Antti Vaha-Sipila: Yeah. And if you spread your architecture in a microservice way, for example, the database might be owned by one single microservice that only does its thing. It doesn’t do anything more complicated than respond to well-formed queries, or HTTP and JSON. Even if somebody would compromise your application, they wouldn’t be able to, for example, escalate their access to the database that would reside on the same box, for example. So, in a way it is like security through design, but I think that security is one of the many side effects of the new design. It’s not necessarily why things had been designed in that way. Okay. So you think there’s still ways to go for companies before they’re in that fully sort of secure by design mode? Antti Tuomi: Definitely. Antti Vaha-Sipila: You could say that now that we have this sort of a robust architecture, then this is what we mean by security by design, and then you could, I don’t know, I mean, you could just paint white and call it white. (Laughing) Fair enough. Antti Tuomi: One of the things that I find intriguing is that, in the late 2000s, OWASP Top 10 was kind of a reasonably new thing. If I remember correctly, the first edition came out in 2004, I think, and the next one in 2007. And one of the interesting things that I think about the change, or the lack of change, is that OWASP Top 10 is still quite relevant. And I think especially over here in Japan, and I think also in Europe as well, we still very often get requests like, could you test whether our application has any OWASP Top 10 vulnerabilities? So, although the standard is there and it has changed a bit, but the basic premises are still there, and there are a lot of still very similar or the same vulnerability categories. It’s still one of the base resources, like, do we have OWASP Top 10? That’s what we want to know. A couple of years ago there was a stat in a black hat presentation, I saw that, one in five developers have never heard of OWASP Top 10. Is that your experience with developers these days, and their sort of level of security knowledge? Antti Tuomi: I would have to say that, at least based on my experience in Europe, I would say that most developers were already familiar with OWASP Top 10, like in the 2010s and going forward. And I do not remember having to introduce OWASP Top 10 to anyone like within the last 10 years. And at the moment, over here in Japan as well, it seems to be a well-known basis for application security. But at the same time, I do also find that there’s a lot of cases where the customers focus so much on the OWASP Top 10 that they forget everything beyond it. For example, XML external entities were not necessarily directly a part of the OWASP categories, at least not at all times. And in many cases, they might forget that that’s actually something we need to look for. So there’s more to it than just the OWASP Top 10. Antti Vaha-Sipila: OWASP Top 10 is a very wide generalization. I mean, everybody, every single company, has a slightly different Top 10, if you’d really look at the types of vulnerabilities they have. When I started at a software company as an appsec person in 2011, the first thing I did was I just got all the reports from the past three years, and went through them – security testing reports, I mean. And I just categorized all the findings, and tried to figure out what’s the type of a flaw or bug that we are seeing in that company. And I’ve got to admit it was really not OWASP Top 10. For example, database injections were not a thing at all, mostly due to the architecture that they had adopted. Antti Tuomi: So you’re saying like the Top 10 for a bank, might not be the Top 10 for an IT service provider? Antti Vaha-Sipila: Well, definitely not. And even within the vertical, it depends on the company and the type of architecture, type of software stack that they’ve chosen. I mean, if you are going to do old-school PHP, you are more vulnerable to types of things than if you’re using a very mature framework. So I don’t know if it matters that much, that the developers definitely have to know OWASP Top 10. They have to know what are the specific risks for their type of architecture and stack. Sure. I mean, if you know the exact situation in your organization, you’re always going to be better off. But if you have no starting point at all, I would argue that the OWASP Top 10 is better than nothing. Like if you don’t have that company-specific information, start from this. Antti Tuomi: I mean, OWASP is well known, but AVS, have you seen or heard of any other like upcoming resources that especially security-aware companies refer to nowadays, in Europe? Antti Vaha-Sipila: Those companies that are looking to integrate at security earlier on in the track development process, many of them talk about these software maturity models. Like one is from OWASP SAMM, the current version is not that bad anymore. And there’s the BSIMM model from Synopsys, ex-Cigital, which is probably more well known. I think that those are the things that companies would actually mention nowadays, when talking about this. Antti Tuomi: That’s interesting. One of the topics that often nowadays comes up when we talk to these modern application developers, who are running on, for example, AWS cloud infrastructure, and running full DevOps cycles…One of the things that we often get asked is like, okay, is there something we need to do to secure our DevOps pipeline? So I’m kind of wondering when are we going to get the, not the OWASP Top 10, but the DevOps Top 10, list of things you should be doing or should not be doing. Antti Vaha-Sipila: Actually, I’m going to guess that that already exists in at least three different companies’ marketing materials. I mean, that sounds like something that you do if you’d have a tool. (Laughing) Yeah, that makes sense. But like, OWASP is still like the most widely known out there, and the new Top 10 list is out this year, some changes in there. What do you guys think about new items on the list? My particular favorite is insecure design. Antti Vaha-Sipila: Yeah, speaking about tools. I mean, OWASP Top 10 has been used a lot for like classifying findings from automated tools. So, good luck automating that one. (Laughing) Yeah. Antti Tuomi: Definitely. And although, like I definitely think that that category like belongs there, insecure design. For example, if you expose your internal VPCs in your AWS cloud infrastructure, or you expose for example, your S3 buckets to external users, that might be like insecure design or insecure configuration. So, it definitely does belong on the list, but the instructions on, okay, how do you check for this? How do you assess this? How do you fix this? Well, design it better. Yeah. It’s a bit of a catchall category, and the main reason for security mistakes is that people make security mistakes. Antti Tuomi: Exactly. Antti Vaha-Sipila: It’s very hard to operationalize that. So, I mean, on the privacy or data protection side of things, there are many checklists. How to process personal data securely, do this and this and this and this. And then, as the last one, hey, remember, you have to be compliant with regulation. Why don’t you code already? Exactly. Yeah. So, okay. So, what kind of issues are you guys then finding most when you’re looking at applications? What’s your personal top 10? Antti Tuomi: I think kind of a pattern that has been continuing for me for maybe the last five years or so, since 2015, is that technical vulnerabilities are getting harder and harder to find, especially when it comes to the traditional, cross-site scripting and SQL injection, types of things. And that is likely very much also due to the frameworks in place. But one trend at least, that I personally think still applies is issues related to access controls. For example, being able to see another user’s data, or being able to change some parameters in like an API request, just being able to access a feature or data that you should not be able to. Those are still reasonably common. And of course, also, those so-called business logic vulnerabilities where you skip a step, or you skip the payment altogether and still get the product. These kinds of, utilizing the flow of the application in an unexpected way, are still fairly common. On the other hand, what’s kind of interesting I think is like, what are the types of issues that development organizations are struggling with when it comes to these application infrastructures? What types of threats catch the developers and the product owners off-guard? Antti Vaha-Sipila: I’d say that supply chain issues are a really a big thing. If you’re doing threat modeling, you tend to find more architecture and design level issues, not like implementation level issues. Unless you’re doing retroactive threat modeling use cases, you can actually find bugs. But a typical pattern maybe for a finding could be that you have an assumption that a component works in a certain way, or comes from a trusted source, when in fact it doesn’t come from a trusted source, and it doesn’t exactly work in the way that people assumed it would work. That causes a security issue, or a potential weakness at least. Antti Tuomi: I guess you’re talking about, for example, these dependency confusion attacks and- Antti Vaha-Sipila: That is one type of it, yes. Then maybe like also, if you call an API, what sort of assumption it makes for the inputs, can you really trust the data that it’s sending bac"
