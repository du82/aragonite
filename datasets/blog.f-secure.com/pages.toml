["https://blog.f-secure.com/podcast-2021-2022-and-beyond-part-1"]
title = "Episode 63| 2021, 2022 and beyond - Part 1 - F-Secure Blog"
description = "2021 is drawing to a close, and it’s time to revisit the highs and lows of the past 12 months, and look ahead to the brand new year to come. To mark the year’s end, we’ve recorded a special two-part episode of Cyber Security Sauna. F-Secure’s Chief Research Officer Mikko Hypponen, Security Consultant Adriana Verhagen, and […]"
full_description = "2021 is drawing to a close, and it’s time to revisit the highs and lows of the past 12 months, and look ahead to the brand new year to come. To mark the year’s end, we’ve recorded a special two-part episode of Cyber Security Sauna. F-Secure’s Chief Research Officer Mikko Hypponen, Security Consultant Adriana Verhagen, and AI researcher Andy Patel join episode 63 to share their key takeaways from 2021, and thoughts on important issues we’ll face in 2022 and beyond. In this episode: cyber security and the board, how companies are doing at integrating security into the business, what a Metaverse could mean, cyber crime unicorns, machine learning in attacks, the future of programming, and more. Listen, or read on for the transcript. And don’t forget to subscribe, rate and review! ALL EPISODES | FOLLOW US ON TWITTER Janne: What stood out to you guys in 2021? Adriana: At the end of 2020, there was the SolarWinds hack, which was pretty big. And in 2021, we still had an aftermath of SolarWinds, which actually was the board of directors being sued because they hadn’t paid enough attention, although they were aware of the risks. That’s what the claimants claim, that the board was aware. So I think what this is actually showing is a precedent for the fact that boards are going to become more and more accountable, or held accountable, for cyber incidents and for the aftermath of these cyber incidents. So I think what we will see more and more is the board being more engaged with the organizations and how they manage cyber risk. Mikko Hypponen, Adriana Verhagen, Andy Patel Mikko: Yeah. And that would be the high time for this to start to happen. Leadership teams and board members, in my opinion, have just been ignoring the whole topic of cyber security for forever. It’s only becoming a topic for the top management when there is an incident, either in the company or in the news. And in this time and age, that’s simply not good enough. I think cyber security should be a permanent topic on any board level meeting in any large company. But clearly, the thing that’s preventing this is that you look at the stereotype of the board member of a typical enterprise company and they are people who are not really their strongest in digital topics or technology topics. So I suppose they’re just trying to ignore the topic if they can, and that’s not good enough anymore. Yeah. I’m sure a lot of people in the field welcome the fact that the top management of organizations is being held accountable. But is that correct? Should we do that? Is it right that we, like you said, these guys don’t know about technology. Is the problem with them or with their immediate subordinates, or who’s responsible? Adriana: Well, I do think that the board has responsibility in engaging with the leadership team of an organization to ensure that the tone is right. And if the board is unable to do that, then there might be a lax approach towards managing cyber risk. So I do think that there is an accountability, and we will see that that will be going up and up. So we’re already seeing that boards are getting training, and they’re getting involved in crisis management exercises, and so on. So it’s a bit better than what it used to be, but it needs to get better. Mikko: Yeah. And I do think they are, and should be responsible, just like they are responsible for physical security, and workplace safety, and things like fire safety. They’re not experts in fire safety either, but I think they realize that it’s their responsibility that the company takes care of things like this. And typically, of course it’s done by experts in their own field, but the ultimate responsibility is in the top management of the company. And that’s the way we should be thinking about this kind of security and this kind of safety as well. Sure. But that’s what I mean. The board doesn’t go around asking, “What sort of locks do we have on our doors? And have we had fire drills this year?” They trust that somebody is taking care of that. So is the final responsibility with the board or with somebody else in the organization? Are the boards, in fact, asking their, I don’t know, CIOs or anybody like, “Are we doing enough for cyber security?” And these people are just nodding their heads saying, “Yes, yes, yes. We are.” Mikko: Well, I’ve had discussions with leadership team members for large companies over the last couple of years about ransomware in particular. And some companies have done exactly that. Leadership team members and board members have gone to CIOs and CISOs, like, “Are we really taking backups the way we should be taking backups? Or do we really have backups of everything? Are we sure the backups are incorruptible by an outsider attacker? How do we know? How are we sure? Show us, show me, prove me you can recover our data. Prove me we can get our systems back in 24 hours,” questions like that. And it is a new field. Things like fire safety, workplace safety are well established. I think in most large companies, top management can feel pretty reassured that the professionals hired to do that know what they’re doing, but this is a new field. So they should be asking questions like this. Like more detailed questions without worrying about micromanagement. Mikko: Show us, prove it, trust and verify. Andy: Isn’t it also like a resourcing issue? I mean, I see lot of claims from people on Twitter who work in infosec that there’s just not enough money or people being put into this problem. Whereas building safety is budgeted for, because it’s something that you ordinarily have to do. I mean, it’s just a common sense thing to do, but it feels like it’s a side issue is still, and it’s not resourced properly. Janne: I think you’re right. A lot of problems out there we’re expecting to do more with less every year. And for example, in cyber security, you could make a convincing argument that the problem is getting more and more complex all the time. So maybe it’s not realistic in this field. I don’t know if it’s realistic in any field, but maybe it’s not realistic in particularly this field to do more with less every year. So for example, we talked about SolarWinds already. Supply chain attacks are obviously a thing that’s here now. And the supply chains of companies are getting more and more complex all the time. So how do you secure that if your resources are not growing? Adriana: That’s a very tough question, right? I mean, the answer is that you need to have your resources growing. I don’t see another way around it, right? Although the move to cloud does enable to reduce some of the investment in infrastructure security. But I think with respect to resourcing, what’s interesting is that if the board becomes more engaged, then the attention comes from top to bottom, and then we’ll see that budgets will follow much better to what they actually need. So I think that there will be also an increase in resources, and that will be due to the attention from the top. Mikko: SolarWind is interesting because that was a governmental attack. We believe it was the Russian intelligence targeting targets, mostly in US and UK governments, with this supply chain attack. But we’ve also seen supply chain attacks which have nothing to do with governmental attacks, or intelligence agencies, or spying, or intelligence gathering. Most importantly, the Kaseya breach, which was REvil Russian ransomware gang. And the idea that ransomware gangs are now mature enough to exploit unknown zero-day vulnerabilities in software providers’ systems to use them as a supply chain attack to gain access to managed security service providers, clients’ systems, that’s a pretty advanced attack. And I think it’s a symptom of something deeper. It’s an illustration of the fact that these organized crime gangs, organized cyber crime gangs, are now becoming more and more powerful, more and more wealthy. For example, in the Kaseya incident, we don’t know how REvil got the zero day in Kaseya’s network, but they could have perfectly bought it. They have the money, and zero days are buy-able from the dark net. Absolutely. What do you guys think about software supply chain attacks? There’s legislation in the works in some jurisdictions where they’re talking about having a software bill of goods, like this is what goes into this software. Is that a realistic way to handle the risk in a world that’s all about DevOps, and things are changing all the time, and you’re putting things, taking things apart and putting them back together all the time? What can we do to secure the software supply chain? Adriana: I think that you’re absolutely right. I mean, the digital world is highly interconnected. Software uses open source libraries, open source packages, whatever you want to call it, that is, every company uses bits and pieces of other creators. And this means that everything is interconnected. So understanding how to protect that is critical. And there is a lot of discussion around this, which is in 2021 is being a lot talked about shifting security left. So this basically means that in the process of change in an organization, so software development, we’re looking to address security risks at the very onset of a project. So where do you identify risk? Where do you identify cyber risk? The earlier you do that, the better it is because it’s not only going to be cheaper for an organization, but it’s going to be easier to architect. The challenge is that this is a fairly new way of thinking. Some people might say that it’s not the new anymore, but for a lot of organizations, shifting left is not something they are doing already. So if we want mass or the mass pop population of these organizations to adapt, that is a big effort. But I think we’re going into that direction because of the supply chain attacks, which are becoming a big concern. Also in the past year, I think we’ve seen more integration of security with other parts of the business. It’s not that just the IT team anymore. Is this an encouraging sign for you guys? Adriana: Yes, yes. Yes. We’re definitely seeing that. I mean, in the ideal world, we won’t have a security team. So we’ll have security that is part of the business, and part of… It’s like in the ideal world, we also don’t have an IT team because businesses are a software company, so that’s their core business and will have security integrated in that core business. But that’s very far to say, and we’re not there yet. With the shift to the left, the business has to be more involved and security needs to get closer to the business to understand what are the real priorities? And we can’t just look at vulnerabilities in an isolated manner. That doesn’t work because it’s just too much. And how do you want organizations to fix hundreds of thousands of vulnerabilities, and not really being able to say why we need to fix them? Because it’s isolated, there’s just isolated instances of weaknesses in the systems. So if you have a much closer dialogue with the business, we’re able to go towards something that we’re seeing already right now is making the case for attack paths, and using attack chains to describe why there is a risk to the organization instead of looking at isolated vulnerabilities. So in order to have these attack paths, we need to be able to understand what the business does. And that’s where we are going to see that security is much more embedded in the business because it’s going to talk much more about the impact that an incident would have on the business. Mikko: The way I like to think about it is that security is the enabler. That’s the part of the organization which enables the rest of the organization to work. And it’s almost never thought about like that. Typically, the security team and security experts, and the CISO are seen as part of the company which always says, “No.” That’s a very typical attitude towards security people, and that’s a completely wrong way around. No company buys computers, or IT systems to run security software or IDSs or IPSs, or endpoint security, or filters. No, we buy computers, we use technology to make our work easier, to be more productive, to be more creative. And security is the part of our organization which enables the rest of the company to be productive, to be creative. It’s just a part that we need to be there so we can do the thing we really want to do. That’s the way we should be thinking about it. And we almost never think about it like that. Are you seeing that shift that businesses are starting to take attention of security? Or is that a real thing or is that a false start Mikko: No, I do think it’s happening. Slowly but surely, companies are realizing that this is the model and this is how we should be building it. I think there’s a clear shift also towards a world where security is moving more and more away from the endpoint and towards the… I’m not just speaking about cloudification. I’m thinking about a world where the future is a Playstation. Let me explain this. Yeah, I know it sounds a bit weird, but the future is a Playstation, or the future is an Xbox. An Xbox is a great example. Xbox is a computer which runs Windows. This is a fact. It’s a computer made by Microsoft. The operating system is Windows. So it is a computer, but it’s not like any other computer you have in your home, because it doesn’t really look like a computer. You don’t use it like a computer. You don’t, even if you’re a programmer, you can’t program this computer, even though you own it, even though it runs Windows. And this is, I believe, the world that we are going towards. More and more of the computing devices we use aren’t really computers. They are more like terminals or consoles like your PlayStation or Xboxes. And we see this very well with, I don’t know, your iPad Pro, which is a very powerful computer, which you can use to do everything, but it’s actually really locked down just like your PlayStation or Xbox is locked down. Or a Chromebook, more and more companies are using these kind of systems for their employees to access the services they use because all the services they use are in the cloud. All the services they use are in the web. And it’s so much easier to secure your networks if your end users can’t run EXE’s or can’t run binary applications at all. And I think this is the world we are headed in the long run. More and more of the systems we use will be cloud only. And end users will not be able to do the powerful things they have been able to do for couple of decades now. So we are going back to the world where we were in the 1970s or ’80s, with dumped VT terminals and powerful servers, which then run the real thing. This from a security point of view had tons of benefits. And I think in the long run they will be coming back. So the security comes from the fact that you don’t have enough rope to hang yourself with? Mikko: Exactly. You can’t, even if you want to, even if you’re "
