["https://blog.f-secure.com/de/welt-passwort-tag-aendert-verdammt-nochmal-endlich-eure-passwoerter"]
title = "Welt-Passwort-Tag: Ändert verdammt nochmal endlich eure Passwörter! - F-Secure"
description = "Wer kann sich eigentlich noch an den Hackerangriff auf Politiker, Journalisten und Prominente im Januar 2019 erinnern? Damals hat ein 20-jähriger Schüler aus dem hessischen Homburg für Schlagzeilen gesorgt. Er hat es sogar in die Prime Time der Nachrichtensender geschafft. Um das, was damals passierte, soll es hier und heute aber nicht gehen. Das Ganze […]"
full_description = "Wer kann sich eigentlich noch an den Hackerangriff auf Politiker, Journalisten und Prominente im Januar 2019 erinnern? Damals hat ein 20-jähriger Schüler aus dem hessischen Homburg für Schlagzeilen gesorgt. Er hat es sogar in die Prime Time der Nachrichtensender geschafft. Um das, was damals passierte, soll es hier und heute aber nicht gehen. Das Ganze können Sie auch hier nachlesen. Wir möchten allerdings nochmals an die Worte des damaligen Bundesinnenminister Horst Seehofer erinnern: „Es war ein ernsthafter Warnschuss. (…) Ein Frühwarnsystem sei in Zukunft nötig“. Wir haben uns damals schon die Frage gestellt, wie viele Warnschüsse denn noch nötig seien, damit dieses Thema auf der Agenda steht und vor allem auch bleibt. Und was die Regierung in dieser Angelegenheit denn zu unternehmen versuche. Eine Zeit lang war das Thema Datenskandal tatsächlich sogar sehr prominent, es flachte aber leider schnell wieder ab. Zugegeben, in der Zwischenzeit hat sich viel getan. Wir haben eine zweieinhalbjährige Pandemie hinter uns, auch wenn diese noch nicht ganz vorüber ist. Und auch die wiederum wird mit dem jetzigen Ukraine-Krieg überschattet. Wenn der Krieg dann hoffentlich ein baldiges und friedvolles Ende findet, dann steht auch schon das nächste Unheil vor der Tür. Aber egal, was es ist oder war – begleitet wurden diese „Themen“ immer mit Cyberangriffen. Das war in der Vergangenheit schon so und wird auch in Zukunft so sein. Noch tut es nicht weh Aber so ein Angriff ist leider nicht greifbar, um zu verstehen, welche Auswirkungen es hat. „Noch“ hat es nicht unsere allgemeine Gesellschaft erreicht. „Noch“ tut es der Allgemeinheit nicht weh. Bislang trifft es am Ende doch nur Einzelne. Und wenn, „ich habe doch eh nichts zu verbergen“ und „warum sollte ich als Privatperson überhaupt ein Ziel sein?“ Wir sollten nicht warten, sondern handeln. Denn wenn nicht, ergeht es uns vielleicht irgendwann wie dem YouTuber Julien Bam. Sehen Sie sich seine Geschichte bis zum Ende an: Es obliegt Ihnen, ob Sie ein Ziel sind oder nicht. Und wenn doch, haben Sie es in der Hand, es dem Angreifer so schwer wie möglich zu machen. Lassen Sie uns hier und jetzt damit anfangen. Mit dem heutigen 5. Mai 2022, dem internationalen Tag des Passwortes möchten wir erneut, ja fast schon gebetsmühlenartig Ihnen sagen, dass Sie verdammt nochmal Ihre Passwörter in den Griff bekommen müssen. Verzeihen Sie bitte uns unsere Ausdrucksweise, aber es ist an der Zeit, wenn nicht höchste Zeit, zu Handeln. Denn wir bei F-Secure denken, dass nur eine richtige Passwortstrategie essenziell für den Schutz der persönlichen digitalen Identität ist. Nicht warten, handeln! Doch was tun? Falls noch nicht vorhanden, legen Sie sich einen Passwort Manager zu, beispielsweise die F-Secure ID Protection oder einen anderen Manager Ihrer Wahl. Nehmen Sie sich Zeit und betreiben Passworthygiene. Legen Sie für jeden Account ein eigenes, starkes Passwort an. Nutzen Sie Zwei-Faktor-Authentifizierung. Nur so können Sie sicher sein, dass Sie zumindest kein einfaches Ziel für Angreifer sind. Es ist am Anfang schwer, aber Sie werden sehen: Plötzlich leben Sie ein Leben, in dem Sicherheitsvorfälle und andere Datenskandale gar keine Bedeutung mehr haben und Sie sich keine Sorgen um Ihrer Sicherheit mehr machen müssen. Weitere Tipps finden Sie auch hier."
