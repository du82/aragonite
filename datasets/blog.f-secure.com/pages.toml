title = "Over deze blog - F-Secure Blog"
full_description = "Over deze blog De digitale wereld verbindt ons en biedt grenzeloze mogelijkheden. Maar tegelijkertijd zijn onze gegevens, bedrijven en zelfs onze identiteiten kwetsbaarder dan ooit. De wereld verandert, maar de risico’s ook. We begeven ons allemaal in dit complexe, virtuele landschap dat continu in beweging is. Maar hoe houd je jouw bedrijf veilig en je huis privé? Is dat eigenlijk nog wel te doen? Het antwoord is: ja! En deze blog helpt je daarbij. De combinatie van mens en machine is onmisbaar voor cybersecurity. Daarom delen we niet alleen kennis van onze experts met tientallen jaren ervaring. Maar ook data uit onze ongeëvenaarde tools. Hiermee krijg je inzicht in wat er speelt op het gebied van cybersecurity. We delen onderzoeken en geven tips zodat je goed geïnformeerd bent over het beveiligen van jouw cybersecurity en privacy. Alles is met elkaar verbonden. Samen kunnen we ervoor zorgen dat alles beschermd blijft. Wij zijn medewerkers van F-Secure, een cybersecurity bedrijf dat er alles aan doet om mensen en bedrijven over de hele wereld te beschermen tegen cyberaanvallen. De auteurs Bert de Houwer Meer informatie Rob Vissers Country Sales Manager Meer informatie Harm van Koppen Meer informatie Luc van Roey Meer informatie Niels Witteveen Meer informatie"
