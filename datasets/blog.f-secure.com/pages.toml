["https://blog.f-secure.com/fr/apprivoiser-lanxiete-numerique-a-lheure-du-teletravail"]
title = "Apprivoiser l'anxiété numérique à l'heure du télétravail - F-Secure Blog"
description = "En 2017, l’American Psychological Association et ecoAmerica ont introduit le concept d’ « anxiété climatique ». Ce terme renvoie à « une peur chronique de la fatalité environnementale ». Cette angoisse prend racine dans un contexte relativement anxiogène, fait de catastrophes météorologiques, de débats politiques et d’actions collectives de sensibilisation. Aujourd’hui, nous constatons l’émergence d’un […]"
full_description = "En 2017, l’American Psychological Association et ecoAmerica ont introduit le concept d’ « anxiété climatique ». Ce terme renvoie à « une peur chronique de la fatalité environnementale ». Cette angoisse prend racine dans un contexte relativement anxiogène, fait de catastrophes météorologiques, de débats politiques et d’actions collectives de sensibilisation. Aujourd’hui, nous constatons l’émergence d’un phénomène analogue : l’ « anxiété numérique ». Cette anxiété concerne la sécurité et la confidentialité en ligne. Une enquête F-Secure menée l’année dernière dans neuf pays auprès de 7 200 internautes a révélé l’ampleur de ce phénomène : 6 professionnels sur 10 (60 %) ont déclaré qu’ils étaient de plus en plus inquiets pour leur sécurité et leur vie privée en ligne. Ce chiffre atteint même 67% pour les professionnels ayant travaillé à distance au cours de l’année dernière. Les télétravailleurs admettent se sentir plus souvent dépassés. Ils sont également plus nombreux à éviter les nouvelles technologies et à modifier leurs habitudes en ligne pour limiter les risques. L’ « anxiété numérique » des télétravailleurs, similaire à l’anxiété climatique. Dans un monde où le cybercrime est devenu plus fréquent que de nombreux crimes de la vie réelle, le danger est effectivement présent. Mais plus un individu passe de temps en ligne, plus il tombe sur des informations liées à la cybercriminalité… Il est alors facile pour lui de céder à la peur. L’anxiété numérique n’est pas déclenchée par une alerte de sécurité ou un filtre anti-phishing. C’est une angoisse de fond, qui demeure en toute circonstance. Si la prudence s’avère utile, le stress permanent, lui, épuise inutilement… surtout dans un contexte de pandémie mondiale où les questionnements anxiogènes sont déjà nombreux. Les télétravailleurs, particulièrement vulnérables face à l’anxiété numérique Au début de la pandémie de Covid-19, des centaines de millions de professionnels ont été contraints de passer au télétravail. Pour beaucoup, il s’agissait d’un mode de travail totalement nouveau. Au plus fort de la pandémie, près de 7 employés américains à temps plein sur 10 travaillaient à distance. Ce faisant, les frontières entre travail et vie privée se sont estompées. Selon un sondage, 70% des nouveaux télétravailleurs travaillent le week-end. Et 45 % déclarent travailler plus qu’avant la transition. Bien souvent, les nouveaux télétravailleurs ont le statut de cadres. Ils sont chargés d’analyser des données ou de créer des contenus, et se rendaient jusque-là au bureau pour travailler sur ordinateur. Ce type d’emploi exige généralement certaines compétences informatiques. Il est donc logique que ces professionnels soient plus alertes face aux cybermenaces qui pèsent sur leur sécurité et leur vie privée. Et lorsqu’ils ne le sont pas, leurs employeurs sont là pour les rappeler à l’ordre. Combattre l’anxiété numérique en adoptant des points de repères Dans la mesure où de nombreux télétravailleurs doivent gérer eux-mêmes leur sécurité et leur système informatique, il leur faut limiter les risques. Heureusement, il existe quelques règles de base permettant de créer un environnement de télétravail favorable. Assurez-vous que vos ordinateurs professionnels et personnels soient bien à jour : vérifiez le système d’exploitation, les programmes et les logiciels de sécurité. Les cybercriminels ciblent volontiers les logiciels obsolètes car ils comportent souvent des failles de sécurité. En comblant ces failles, vous obtiendrez une meilleure sécurité de base. Renforcez votre réseau domestique en remplaçant le mot de passe de votre réseau WiFi par un mot de passe unique et suffisamment complexe. Les mauvais mots de passe sont une invitation à la cybercriminalité. En choisissant des mots de passe assez complexes, vous pourrez avoir davantage confiance en votre réseau et en vos appareils. Protégez votre vie privée avec un VPN. Ce type de tunnel sécurisé est indispensable sur la plupart des réseaux professionnels. Si vous n’en utilisez pas sur vos appareils personnels, pensez-y dès maintenant. Souvent, les victimes d’anxiété numérique sont déjà bien informées et ces conseils ne suffisent pas à les rassurer. Le télétravail implique un effacement des frontières entre vie privée et vie professionnelle. Si l’employé commet une erreur de jugement qui met en danger sa cybersécurité personnelle, il met également en danger son emploi. Et le soir, les angoisses de la journée de travail s’invitent souvent dans l’intimité. Pour se libérer de l’anxiété numérique, il faut donc veiller à maintenir des frontières claires entre vie professionnelle et vie privée. Voici quelques mesures qui vous permettront non seulement d’améliorer votre sécurité en ligne, mais aussi de mieux séparer travail et vie privée. Évitez de trop partager votre écran pendant les réunions en ligne. Pensez à fermer toutes les fenêtres privées ou indésirables au moment de partager votre écran. De nombreux utilisateurs couvrent également leur webcam lorsqu’elle n’est pas utilisée. Évitez d’utiliser votre adresse e-mail professionnelle pour vous inscrire à des services personnels. Vous recevrez moins d’e-mails suspects à évaluer, et gagnerez donc du temps sur vos heures de travail. Si le système de messagerie de votre employeur propose une fonction de signalement des e-mails de phishing, utilisez-la. Cela contribuera à votre sécurité et à celle de votre entreprise. Vous acquerrez ainsi le bon réflexe d’étudier attentivement chaque e-mail avant de cliquer. Évitez d’utiliser vos appareils professionnels pour vos loisirs. Déconnectez-vous lorsque vous avez terminé votre travail. Cela peut être bénéfique pour votre cybersécurité, tout comme pour votre équilibre personnel. Fixez-vous des temps de pause. Ne laissez pas le travail s’immiscer dans votre vie privée. Arrêtez de répondre à vos messages professionnels le soir et le week-end."
author = "Amon Francoise Koutoua"
year_published = 2022
year_updated = 2022
