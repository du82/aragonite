title = "Episode 60| Biometrics: Privacy, Problems and Possibilities - F-Secure Blog"
description = "Biometric authentication systems have the potential to take the place of passwords. But when should they really be used, and how? What are the risks, and when should biometrics be approached with skepticism? Vic Harkness and Tom Van de Wiele join Cyber Security Sauna to talk about the advantages and disadvantages of biometric authentication systems, some of the wackiest ways our bodies can be measured, and why layered security still works best."
full_description = "Biometrics have gotten a lot of attention in recent years. Biometric authentication systems have the potential to take the place of passwords, streamlining the user login experience. But there are a lot of considerations before taking these systems into use. When should they be used, and how? What are the risks, and when should biometrics be approached with skepticism? Vic Harkness, who gave a presentation on biometrics at DEFCON 29 Rogues Village, and red teamer Tom Van de Wiele joined episode 60 of Cyber Security Sauna to talk about the advantages and disadvantages of biometric authentication systems, some of the wackiest ways our bodies can be measured, and why layered security still works best. Listen, or read on for the transcript. And don’t forget to subscribe, rate and review! ALL EPISODES | FOLLOW US ON TWITTER Janne: Welcome to the show. Tom: Thanks for having us. Vic: Yeah. Thank you. So, in general, what are the advantages of using biometrics for identification or authentication? I guess you can’t forget your fingerprint at home. Vic: Yeah. It is an advantage that you can’t forget your fingerprint or your face. It’s something that you’re carrying with you easily. It’s not something that you have to write down, such as writing down your password on a bit of paper and carrying that with you. That also means that there’s less opportunity for theft potentially, because no one can steal a picture of your face. Well, or can they? That is one of the potential drawbacks of it. If a system could successfully authenticate people using a photo of their face, that’s bad. But thankfully, a lot of the systems are built to not work like that. Something like that wouldn’t be sufficient. Vic Harkness, Tom Van de Wiele So when we say biometrics, what exactly are we talking about? Fingerprints obviously; your face, you mentioned. We’re basically identifying based on something that we are that gets measured somehow. Vic: Yeah. Biometrics refers to basically quantifying the human body. So any way we can numerically describe the human body, and ideally, describe it uniquely. And there’s all kinds of different ways we can do this. Most commonly we’ve seen fingerprint recognition, where the computer is looking at the certain positions of locations called minutiae in your fingerprint and encoding these as numbers, which can then be used for matching. It’s similar with facial recognition systems. It’s often looking at various locations around the face and numerical values associated with those. But in the same way as my password is not stored in the system, hopefully, but a hash of it is, in the same way, there’s no picture of my fingerprint on the phone. There’s some sort of a numerical representation of it. Vic: Right. It depends on the system. For things like your passport, nowadays, those use a facial photo and also fingerprints. Those actually do have a complete picture of your fingerprint, and at borders, quite often they will collect a complete fingerprint. But for things like unlocking your phone, opening a certain application, they do just contain a numerical encoding of your fingerprint rather than the fingerprint itself, much like how a password should ideally be salted and hashed rather than just being a plain text value that someone could then reuse if they’re able to compromise the storage file. Tom: The problem is that not all technology is created equally, and some security vendors will have to make systems that have to apply or have to satisfy different security criteria, versus the consumer tech that we have in our pockets. So when we talk about fingerprint readers, when we talk about facial recognition, we have to make a very big distinction between consumer tech versus tech that’s being used in other places and other applications. Yeah, absolutely. And there’s other compensating controls as well. I remember a conversation about a specific type of fingerprint reader being said that it’s insecure because you can attach clamps to it and do this thing and then run it like this. And then you can adjust the data, and the Marine Corps uses this. And a Marine Corps colonel mentioned that, “Yeah, but we also have an armed Marine standing next to the fingerprint reader, so try to attach your clamps to it.” Tom: And that’s a very good point, in that obviously there’s a reason why companies and governments are using biometrics, but the problem is that like any other security control, if you single out a security control, it will fail at some point. So you need to have a combination of different security controls, a pin or a password, or like you mentioned an armed guard, or the fact that it’s a certain geographic setting that only a few people can have access to. So you need to have a combination of different security controls, of which biometrics could be one, to be able to protect whatever it is that you’re trying to protect. Okay. Now, one of the most common arguments against biometric authentication is that you can’t change your fingerprint. So what do you do if your fingerprints get compromised in a breach? But Vic, I’ve heard you say that that’s actually not much of an issue. Why not? Vic: Yeah, that’s correct. If it is a system where it’s only encoding certain numerical values that describe your fingerprint, then if an attacker was to steal those, they wouldn’t be able to do too much with them, whereas they would need to steal an entire image to actually be able to use it. Okay. What about if an attacker actually gets access to your face or fingerprint directly, like a kid that uses his sleeping dad’s finger to buy in-app money for a game, or something like that? Vic: Quite often with biometric systems, there’ll be some sort of secondary modality, such as some sort of liveliness detection in the system. In the case of a child who’s using his dad’s fingerprint to buy more in-game currency for a computer game or something, there tends not to be too stringent secondary modalities in there. So they probably could just get their dad’s fingerprint, put it on the phone and go buy stuff. But if we’re looking at potentially more serious applications, such as taking out a bank loan or performing some other sensitive financial interaction, the banks have moved away from just having say, a photo of a person, because could you just grab a photo of them off of social media? Could you take a photo of the person? Could you just flash the camera at them when it’s doing the check so that it thinks they’re there? In these sorts of scenarios, you need the person to actually be giving consent, rather than just a person to be able to pop up and point of phone at them. Banks have had a lot of issues with fraud taking place between romantic partners, where one person will take out a loan in the other person’s name that obviously, they don’t want them to know about, because they’ve got ready access to things like their date of birth, their address, all that sort of personal information. But they might also have access to the face of their partner. So say their partner is asleep in bed. They could then use their sleeping face to authenticate to a system. So what banks have moved more towards is requiring a video from the person who’s taking out a loan of them saying some set phrase, not the my-voice-is-my-password thing, but it could be, “My name is (full name), and this is-” And I understand that I’m taking a loan. Vic: Yeah. As well as some semi-random bit of extra data, like saying the number 12 or doing a certain gesture, because then – The system’s not coercion-proof, but the person who is having the loan taken out in their name is definitely aware of what’s happening. So that helps to reduce the risk from fraud. Well, that’s the thing, I like the word “coercion” you mentioned, because that’s one of the arguments as well, is that, what if somebody puts a gun to your head and takes your photo by force? And I’m like, if somebody puts a gun to my head, I’m going to give them my password as well. So I don’t see that being an issue. Vic: Yeah. With that level of coercion, you’re probably going to do what they say regardless. One of the concerns people have had is with law enforcement. So I believe that the law in the U.S. currently is that you can’t be compelled to hand over your password for your phone, but you can be compelled to put your fingerprint on the reader, or the policeman could just force you to look at your camera for a second so that it unlocks automatically. And then they could look for incriminating evidence. I believe that in iPhones they’ve actually introduced a tool which stops the iPhone from being used for unlocking in that way temporarily. Tom was telling me about this earlier. Tom: Yeah. So most modern iPhones, and I suppose iPads as well, that have either the older Touch ID or Face ID, if you bring up the menu for emergency services and then cancel it again, it will temporarily disable things like Face ID, if indeed you are somewhere where there might be abuse of your phone by whoever it is, or at a protest, or where someone can compel you to unlock your phone. And it’s good that at least the technology is trying to catch up to those scenarios, knowing that not every place is safe to unlock your face whether you want it or not. So let’s hope companies stay agile here and give us enough tools to choose when we want to use this technology. Well, that’s very interesting. Can you guys think of some of the other risks or disadvantages of biometrics? Tom: I think at least for me, one of the biggest concerns I have is it’s kind of a semantics discussion, as we already touched upon, not all biometric systems are created equally. Sometimes they are part of a larger database. And if that database leaks, now, of course, you have the name and certain biometric data of that person, which can be of use to someone. Again, this falls under the category of identity theft, or fraud, or trying to harass someone the moment they want to, I don’t know, have a position somewhere at a company or a government, or go into politics. So it’s not just the actual concerns of when to use it and what we’re talking about. It’s also the aftermarket consequences of what do you do when you have a breach? Because I’m not sure how many people or companies, rather, that have implemented biometric technology are running the actual crisis simulations of having a breach and what to do with it. Because as we mentioned, you can’t change your face and you can’t change your fingerprints. So you need to make sure that it is extremely hard and costly for an attacker to able to yield or use the data in any way possible, either directly or for aftermarket sales. Could you do something like change the way you’re capturing that biometric data and by that, render the old hashes inoperable? Tom: I think that would mean that you would have to enroll yourself in a way that you can change it. Or just force everybody to re-enroll. Tom: I suppose, yes. But again, we’re talking about biometrics and biometrics is two. So is the system really just logging certain coordinates or certain metadata, so to speak, with which they can determine that, yes, this is indeed your fingerprint or your face? And at the same time, of course, all the algorithms and all the thresholds are being updated because people grow and people grow older, or their faces change, or people get sick or lose weight or gain weight. So what you want to do as a hacker trying to mess with these systems, is you’re trying to find the lowest threshold for acceptance for these systems and try to see if you can mess with those statistics or those numbers. So it really is deep down a numbers game. But again, that is, of course, if indeed the system is only logging those things. And that is really where we need more transparency, because the solution cannot just be “we’ll throw biometrics at it” because you might be adding a far larger problem versus the solution you think that you have in your hands. Okay. Vic: I think that people quite often place too much reliance on biometric systems, they’ve seen all the movies of the eyeball scanners and they think biometrics is quite secure. It’s become a bit of a buzzword, really. People just think it means it’s very secure. If you look on Amazon for instance, if you search for biometric locks, you’ll find just endless pages of fairly cheap biometric locks, which supposedly unlock with your fingerprint. And you look at the reviews of them and you’ll see people saying, “Bought this, found out that it unlocks with any fingerprint, it’s rubbish. Can’t use it.” But if someone’s not done that test themself or hasn’t looked at the reviews, they might think, “Oh, biometric lock. It’s going to be super secure, it’s going to be more secure than a key,” because people are aware that you can pick locks, it’s fairly common knowledge. So you could potentially get people improperly using cheap biometric systems off of Amazon thinking that they’re securing something, and they’re not really able to make the informed decisions about the security of the system they’re using to secure whatever it is they’re securing. That’s a good point. I’m wondering, aside from the most common fingerprint and face recognition, I know there’s many other aspects of our bodies that can be used to identify us and then authenticate us, both physical and behavioral. What are some of these? Vic: Yeah, I mean, there’s so many different ways. Because basically any way you can quantify a human could be used for biometrics. In terms of physical biometrics, there’s so many different things, some of which will get used in combination with others. Like say palm biometrics, where they’re looking at the palm of your hand. You’ve got a palm print that’s unique to you, similar to a fingerprint, but you’ve also got a lot of veins in your palm, which are supposedly unique in how they’re positioned. So you can have a system which is scanning the palm print of your palm, is looking at the veins, and combining those two to create an extra layer of security. As things like camera systems get even more and more powerful and more high resolution, some biometric systems, instead of just doing facial recognition as we traditionally think about it, they’re also looking at your pores, like just by mapping out the person’s pores, that’s an extra layer of security on top of just a facial image. In terms of behavioral biometrics, there’s so much weird stuff, like phone banking systems use voice biometrics some of the time. They might not even tell you they’re doing it, but it’s automatically taking place to provide an extra layer of security. You get things like keystroke biometrics, where some systems, when you enter in your password, it’s looking at also the kind of cadence of how you’re pressing the keys on your keyboard and using that as an extra layer of authentication on top of the password. Because in theory, if someone had just stole"
