["https://blog.f-secure.com/es/como-hacer-participes-a-tus-hijos-de-su-seguridad-en-la-red"]
title = "Cómo hacer partícipes a tus hijos de su seguridad en la red - F-Secure Blog"
description = "La línea entre el mundo online y el mundo real nunca ha sido tan delgada. A continuación compartimos contigo una historia reciente que escuchamos de una madre usuaria de F-Secure y que esperemos tengas en cuenta: “Mi hija de siete se perdió hoy de camino al colegio. Cuando la jefa de estudios me llamó para […]"
full_description = "La línea entre el mundo online y el mundo real nunca ha sido tan delgada. A continuación compartimos contigo una historia reciente que escuchamos de una madre usuaria de F-Secure y que esperemos tengas en cuenta: “Mi hija de siete se perdió hoy de camino al colegio. Cuando la jefa de estudios me llamó para decirme que no había llegado, llamé a mi hija. Cuando hablamos, descubrí que había girado mal en una de las calles y se perdió. Afortunadamente, me aseguré de instalar F-Secure SAFE en su Android y fui capaz de localizarla desde mi portátil. Por teléfono pude guiarla hacia la escuela donde la recogieron a la entrada. Estoy muy agradecida por este servicio y por las preocupaciones que me ahorró.” La protección que instalas en el teléfono de tus hijos no solo los mantiene alejados de las amenazas en el mundo virtual, también los protege de los peligros de las calles. Como la mayoría de las cosas que nuestros teléfonos móviles pueden hacer, este tipo de herramientas ni siquiera existían cuando la mayoría de nosotros éramos unos críos. Mientras, tú como padre o madre estarás más al tanto de las amenazas y peligros a los que tus hijos pueden enfrentarse tanto online como en el mundo real, ellos seguro que se preocupan más de cómo usar al dedillo sus aplicaciones y páginas favoritas de Internet. Es por esto que desde F-Secure diseñamos las nuevas Family Rules con el App Control para instalarlo con tus hijos. Este proceso te ayudará a charlar con tus hijos sobre la red, qué deberían usar y qué no. También te dará la oportunidad de establecer directrices para entender cómo la vida online conecta con el mundo real. Por ejmplo, podréis instruirlos sobre qué hacer si se pierden en la calle o si un extraño intenta quedar con ellos en la vida real. Aquí tienes otros temas de los que puedes hablar con tus hijos: Ejemplos de amenazas online a las que pueden enfrentarse y, en caso de que se las encuentren, cómo deberían manejarlas Sus derechos y responsabilidades en la red Qué tipo de contenido online quieres evitarle a tus hijos y porqué Una buena paternidad digital no es solo establecer límites y entender que las páginas web como YouTube no es un buen babysitter. Los padres y madres tienen que preocuparse por sí mismos y saber qué ven sus hijos en Internet. Si tus hijos usan Facebook, Instagram, Snapchat, WhatsApp o cualquier otra herramienta de comunicación, tú deberías usarla también. No necesitas ser un experto pero sí estar familiarizado con cómo estas apps funcionan y porqué le gustan a tus hijos. Además, al decirle a tus hijos que estás conectado a través de estas redes, puedes hacerlos saber que estarás al tanto de lo que hagan a través de ellas. Este conocimiento de primera mano puede darte el entendimiento para seguir la conversación sobre la seguridad online que solo acabará cuando dejen de ser niños."
author = "F-Secure Spain"
year_published = 2018
year_updated = 2018
