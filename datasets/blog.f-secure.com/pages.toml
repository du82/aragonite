["https://blog.f-secure.com/podcast-latest-tech"]
title = "Episode 59| Keeping Your Latest Tech from Becoming the Latest Threat - F-Secure Blog"
description = "New technologies often become new threat platforms. Christine Bejerasco explains how companies can avoid having their new tech exploited by taking a secure-by-design approach."
full_description = "Cyber crime is a constantly evolving game. As soon as new technology is introduced, attackers start figuring out how to exploit it for malicious purposes. No one understands this better than F-Secure Chief Technology Officer Christine Bejerasco. Christine joins episode 59 of Cyber Security Sauna to discuss the fast-changing world of cyber crime, and how companies can avoid having their new technologies exploited by taking a secure-by-design approach. Listen, or read on for the transcript. And don’t forget to subscribe, rate and review! ALL EPISODES | FOLLOW US ON TWITTER Thank you for having me, Janne. So, can you give me some examples of where newly introduced technologies soon become used for malicious purposes? This is actually an interesting observation, because I was looking back from a historical perspective, looking at when did Microsoft Word, for instance, start to introduce macros? And then from what I can dig in the interwebs, firstly, it was 1993 that they started to introduce macros. And then the first proof of concept malware that uses macro in Microsoft Word came in 1995. So essentially, you have now a platform, Microsoft Word, which is actually a tool, that became a platform as well for automation. Which is very good. It’s very good to have macros, that helps us. But of course, that platform then also became a platform for threat actors to perform malicious activities. And even today, it is still being used by threat actors as well. So that’s one example. And then another thing is the app stores, which, if I remember correctly, were first introduced by Symbian, essentially. Before Symbian, we had mobile phones that were, well you couldn’t really tailor them to your taste as a user. So you didn’t have your own applications, but you had to be stuck with messaging, alarm clock, and then Snake. (Laughing) That’s what we had then. Christine Bejerasco, Chief Technology Officer, F-Secure Absolutely. And then you had Symbian, which, now there’s new apps that were released and everybody could use them. That was 2003. And then by 2004, there was the first Bluetooth worm using Symbian, which was Cabir. So technology comes in, and then it also becomes a platform for threat actors to perform malicious activities. So I guess that makes sense. As our understanding, as users, on the technology evolves, attackers evolve in their thinking as well. They understand the technology better, they’re able to use it for things that the designers maybe didn’t think of. So what do we do? Just stop introducing new technology? We would be in the stone age if we actually do that. It’s not really about not introducing new technologies, because for instance, if no one introduced electricity, then we wouldn’t have the internet that we have today. So whenever we introduce a new technology, we create sometimes not only a singular technology, but a platform for others to build new technologies on top of. So you have electricity, and then you have computing, and then you have the internet, which, all of these are platforms that enhance our lives. I mean, we can do remote work because of all of these different technologies that we have. So I’m definitely an advocate for more technologies, even, to be introduced. But it’s really the thinking, that whenever we introduce something, how can that be misused? Whenever we build our own homes, it’s not that we build our house, and then we have front doors that don’t have locks in them, and then later on we realize “Okay, wait a minute, I’m living in a bad neighborhood, let me add a lock to my front door.” If we can sort of think of building software like this, that at the beginning, we already think of like, “How do you build security into this software rather than bolting it in later on?” That you build the software that is secure by design. And I’m not saying that we’re going to be perfect at this on the first try, but there is this concept now of what we call “shifting security left.” Where security should be as close, not just to the development process, but as close to the design process as possible. Like performing threat modeling sessions, for instance, that how can a certain capability, a certain API, a certain functionality can be misused? And then thinking of how to mitigate that. Okay, so in the past we had security teams weigh in at the very end of a software development project. You’re now talking about moving that to the left, to the earlier phases of the development cycle, so that we’re thinking outside the box. Not just looking at the features that we intend the software to have, but also, what can somebody malicious or very creative do with this software? Exactly. And I think that is the best that we can do at the moment. Because in this world, we are adding more complexity on top of already complex systems. And what I mean by this is, we have our endpoint operating systems, Windows, Linux, Mac, et cetera. And we have our mobile operating systems. And then to add to that we have cloud platforms nowadays. And we have an organization that has hybrid implementations of this, so they have multi-cloud implementations, they have different platforms that they have implemented. And it can be mind-boggling, to be honest, to secure all of those different areas that an organization is now owning. And what is the responsibility that they have? Where does it end, versus where does the responsibility of the cloud platform owner begin? So these things nowadays, they’re not so easily defined anymore. And therefore, if you are somebody who is leading the security team within the organization, it’s quite natural and understandable to be confused about this. So the question is how do we end up helping these people, in order to make it a little bit easier for them? Because the technologies that they are handling, even the old ones, they are not really getting deprecated. So for example, how many messaging platforms do we have today? And have we even deprecated emails which are probably older than me? So these are the things the security officer, or a CISO in a certain organization, are being challenged with. And how can then the technology creators or the businesses help these people? But what’s the developer team to do? There’s only a handful of them and there’s an infinite number of hackers out there, just clawing at every new piece of technology. They seem to have an infinite amount of time to nitpick every bit of your software and find all the vulnerabilities. So what are you gonna do? I believe that the developer teams, on their own, would be challenged without the support of the business. So I can give one example. For instance, when we are building new technologies, the first thing that we really want to come out, as a business, is the functionality of this technology. And one of the things, unfortunately, that gets cut, are the security capabilities that should come in, hopefully during the first release. So whenever the development team is already pressed for time, and they have this priority queue, the security items go out so that they can go to market on their target time. So my hope is that if the business truly understands how their technologies can actually be used as platforms for attacks, then they would take, hopefully, more responsibility for this. We need to improve this, and we need to allocate time for the developers, such that in the beginning, even in the first release, and I am now probably dreaming, but even in the first release, there is already security capability that at its very core, this product is hopefully secure by design. And then I would also like to encourage not just the businesses, because security, adding this to products, unfortunately comes with a cost. It’s a cost of developers’ time – they need to implement this, they need to think of several angles on how this product can be misused. And of course, the company as well, if there is no security knowledge in-house, then they need to work with red teamers, for example outside the company, on thinking of how can this product be misused? Or risk management consultants, for instance. And that helps release a product from the beginning that already has security by design. But of course, with a cost. So the hope is that some legislation or some government support for instance, for businesses, and some incentives, whenever there are businesses who are building capabilities that are secure by design, could also be available to those businesses. Because I do believe that with the right incentives, this could be good for the business, from a monetary perspective, and of course, if the business dictates that when we release this product, this will not be a product that will be used for DDoS attacks, for instance. And we will do our best to do that. I think I’m with you, but let’s unpack this for a minute. What does it mean in practice for developers to make products that are secure by design? Secure by design, of course, starts with the thinking when you’re still architecting, let’s say, the capabilities of the product. Maybe one pragmatic example is when someone is designing an API. And that API is exposed publicly, or through a certain portal that somebody could still access and then authenticate with. The hope that I have is that the thinking of the developers would be, “Who are capable of accessing this API first? And how do I make sure that authentication for the access of this API only works for those parties that are allowed to access them?” Most of the APIs, of course, are publicly documented. But “how can I make sure that, for example, the elements of this API, or the capabilities of this API, will not then be misused or accessed from, for example, geolocations that it’s not allowed to be accessed from?” So these are the hopes that I have, that even before somebody writes the first line of code for this capability, that people will then be thinking, and simulating, and hopefully even doing tabletop exercises and threat modeling, essentially, that how would this capability then be misused? Yeah, what could go wrong? Exactly. And in addition to that, so once it goes out there, of course – we can only think so much during threat modeling. And once this capability is out there, do we even have monitoring on how this was already used or misused? Because without that, we will be left to the mercy of those who are trying to probe for vulnerabilities, like of our capabilities. I mean, we’re lucky if they are the white hat hackers, and they report those capabilities. But if they’re not, then that’s the time that the product starts to be used for malicious purposes. This makes perfect sense to me. So I guess the real question is, why isn’t this happening? Is it hard for development teams to justify the extra effort and the extra cost? Or why isn’t this happening? I think we try to put sometimes the pressure on the development teams, but to be honest, they are also getting pressured by the product management, the business, essentially, who needs to deliver the actual capabilities. So the cost factor is really one of the issues. And if we do some root cause analysis, why is the cost factor such a big thing when it comes to security? It’s because there’s not a lot of incentives for businesses today to release products that are secure by design. I mean, it’s upon them if they want to be diligent and send out these capabilities that are secure by design, but then they also need to fork the extra cost. So for really big companies, they can do this, because they have security teams and they have bigger revenues. But if we’re talking about a startup…I’m a startup who likes to create baby monitors with something novel, and then I put it out there, of course I would need my baby monitor functionality first. And then with the rest of the money that I have, I probably won’t have anything extra to invest for security. But if, for example, my company gets some tax breaks, for instance, if I do secure by design, then that is something that I could factor in towards my finances, that I could say that, yeah, we should definitely do it because it makes sense from a business perspective. Security makes sense, even from a business perspective. Now, in a market economy, these sort of problems are supposed to be fixed by the demand side, sort of consumers demand better baby monitors. But it’s really hard, when you’re looking at a baby monitor, it’s really hard to tell if it’s made properly or not. There’s all sorts of padlocks and ‘uses internet technology’ and other kinds of vague technology-sounding statements that I don’t really understand as a consumer. So how fix? Well, I guess in a market economy, if the demand doesn’t go towards me buying a more secure product, and if we just let the market economy dictate this, then unfortunately we will be decaying towards the point where we have cheaper products, they may work as expected, but they’re performing denial of service attacks towards companies like Netflix and whatnot. That sounds like what’s happening. Exactly. So that’s already what’s happening today. So we are in the state where we have created this problem, essentially, because of security being treated as an additional cost. If we want to secure all of these different platforms and technologies that we have built so far so that we can build more on top of them, then we need to make sure that the foundations that we are building are solid enough. Yeah, absolutely. It sounds like you’ve given up on sort of educating the consumers and think that we’re not going to fix that issue this way. Is there something we can as a security community do about this, sort of make it more transparent so that it’s easier for people with no technical skills to understand, sort of what good and bad looks like? Is there anything we can do? I’m not sure if this is going to be a very popular idea, but one of the thoughts I’ve been having is that if we can sort of promote or praise products that are really trying to build security into their capabilities, of course we probably will not find a product today that doesn’t have a vulnerability. But there are products that it’s getting harder and harder to find vulnerabilities in their platform, and as such the vulnerabilities in their platforms are becoming more expensive. So celebrating those companies as well could be helpful in this regard, especially if they are companies who are not the big ones. And especially if you can see that they are trying to make a living, of course they are trying to make a profit with their products. But still, even with the challenges that they are having, they are working continuously on building security into their capabilities. I think those companies should be celebrated. Because for one, they don’t even get incentives, for instance, from governments. And they’re doing it anyway. So I think it’s very responsible and those are the type of companies that I think we should"
