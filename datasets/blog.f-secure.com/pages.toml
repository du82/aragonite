["https://blog.f-secure.com/de/nutzungsbasierte-security"]
title = "Nutzungsbasierte Security – die Zukunft der Cybersicherheit für Unternehmen - F-Secure"
description = "Zahlreiche Branchen sind in den letzten Jahren zu nutzungsbasierten Zahlungsmodellen übergegangen. Sowohl Unternehmen als auch Privatleute sind es mittlerweile gewohnt, für Datennutzung, Cloud-Speicher, Webhosting etc. je nach Nutzung zu bezahlen. Und sogar einige Branchen, von denen man es nicht erwartet hätte, haben sich nutzungsbasierte Modelle zu eigen gemacht, Wir haben immer schon daran geglaubt, dass […]"
full_description = "Zahlreiche Branchen sind in den letzten Jahren zu nutzungsbasierten Zahlungsmodellen übergegangen. Sowohl Unternehmen als auch Privatleute sind es mittlerweile gewohnt, für Datennutzung, Cloud-Speicher, Webhosting etc. je nach Nutzung zu bezahlen. Und sogar einige Branchen, von denen man es nicht erwartet hätte, haben sich nutzungsbasierte Modelle zu eigen gemacht, Wir haben immer schon daran geglaubt, dass in der Cybersicherheit nutzungsbasierten Modellen die Zukunft gehört. Und als wir 2018 die ersten Gespräche darüber mit unseren Kunden führten, merkten wir, wie groß die Nachfrage nach solchen Modellen ist. Moderne Unternehmen wählen ihre Cybersecurity-Lösungen vor allem nach den Kriterien Flexibilität und Einfachheit aus. Diese Diskussion hat durch die Pandemie noch eine neue Wendung genommen, weil die Unternehmen jetzt unbedingt ihre Fixkosten minimieren mussten. „Die Pandemie hat die Nachfrage nach abonnementbasierten Managed Security Services beschleunigt, und Service-Anbieter, die diesen Bedarf bedienen, stellen ihr Geschäft für die Zukunft auf“, sagt dazu Niko Isotalo, Director of Product Management bei F-Secure. Die verstärkte Nachfrage nach Flexibilität und nutzungsbasierter Preisgestaltung in der Pandemie zeigt auch eine aktuelle Forrester-Studie: „In der Pandemie hat viele Kunden verärgert, dass die Anbieter die Lizenznutzung nicht unter die Grundlinie senken wollten, obwohl die Nutzung im Unternehmen aufgrund von Personalabbau zurückgegangen war. Prüfen Sie die Verträge und fordern Sie die Flexibilität, die Lizenz-Grundlinien unter bestimmten Bedingungen zu ändern, sowie die Möglichkeit, ungenutzte Lizenzen ohne zusätzliche Kosten ins Folgejahr zu übertragen.“ Zwar stehen die Budgets in allen Regionen und Branchen unter Druck, doch bei den Investitionen in Cybersicherheit sind Kürzungen leider gefährlicher denn je. Für einen Teil der Unternehmen könnte aber der Wechsel zu einem nutzungsbasierten Sicherheitsmodell einen operativ und finanziell sinnvollen Mittelweg darstellen. Wir sind der Ansicht, dass nutzungsbasierter Security die Zukunft gehört, aber wir wissen auch, dass das nicht für alle Kunden das Richtige ist. Wir möchten unseren Kunden Flexibilität bieten, und dazu gehört, dass wir weiterhin auch die klassische Lizenzierung anbieten. Welche Art Unternehmen wird vom nutzungsbasierten Modell profitieren? Unternehmen, die sich in einer Phase schnellen Wachstums befinden, wollen keinen Vertrag über 50 Lizenzen unterschreiben, nur um festzustellen, dass sie doch 100 oder auch nur 51 benötigen. Bei einem Standardvertrag müssten sie jedes Mal nachbestellen, wenn sie ihre Wachstumsziele überschreiten. Wenn sie aber nicht so schnell wachsen wie erwartet, zahlen sie am Ende für Lizenzen, die sie gar nicht brauchen. Bei Security auf Nutzungsbasis sind dagegen keine Nachverhandlungen nötig, Sie zahlen nur für den zusätzlichen Endpunkt, sobald Sie ihn hinzufügen, oder einen weniger, wenn er wegfällt. Wenn ein Unternehmen nicht sicher ist, wie groß sein Sicherheitsbedarf sein wird, dann sollten Sie Services möglichst einfach hinzufügen oder entfernen können. F-Secure Elements ist so konzipiert, dass Sie sich aussuchen können, welche Lösungen auf welchen Geräten installiert werden – und das jeden Monat neu. Unternehmen, die möglichst wenig Verwaltungsaufwand für Bestellungen und Verlängerungen treiben wollen, können sich diesen Overhead bei nutzungsbasierter Security ganz sparen. Sie zahlen monatlich für das, was Sie in dem Monat genutzt haben, und das war’s. Unternehmen, die befürchten müssen, dass sich die aktuelle Lage negativ auf ihr Geschäftsergebnis auswirkt, müssen in der Lage sein, ihre Fixkosten kurzfristig zu senken. F-Secure Elements ist ohne Initialkosten oder lange Verpflichtungen verfügbar. Für Unternehmen, die ihre IT bereits ganz oder größtenteils auslagern und sich auf ihr Kerngeschäft konzentrieren wollen, ist der Umstand, dass keine Initialkosten anfallen, ebenso attraktiv, weil sie dann in andere Bereiche investieren können. Bei F-Secure haben wir vor Kurzem die Einführung von Elements bekannt gegeben, unserer All-in-One-Sicherheitsplattform. Mit Elements wollten wir unser gesamtes Angebot vereinfachen, aber wir wollen unseren Kunden und Partnern auch so viel Flexibilität wie möglich bieten. Aus diesem Grund ist Elements mit Blick auf nutzungsbasierte Sicherheitskonzepte konzipiert. Der modulare Aufbau bedeutet, dass Sie jeden Monat nach Bedarf und Budget einfach Lösungen und Services hinzufügen oder entfernen können. Mit diesem Modell können Sie ganz leicht jede beliebige Kombination von Lösungen und Diensten zusammenstellen, die Sie brauchen – alles auf monatliche Abrechnung. Niko Isotalo von F-Secure vergleicht das gerne mit einem Restaurant, und zwar einem guten Restaurant, keinem All-you-can-eat-Büfett: „Wir wollen unseren Kunden volle Transparenz geben“, sagt er. „Wenn Sie in ein Restaurant gehen, können Sie aufstehen und gehen, wann immer Sie wollen; und niemand wird verlangen, dass Sie zuerst noch zwei Getränke bestellen, wenn Sie nach der Rechnung fragen.“ Anders als im Restaurant bekommen Sie und Ihre Kunden bei F-Secure Elements aber eine Abrechnungsprognose in Echtzeit, sodass Sie genau sehen können, wie hoch die Rechnung auf Grundlage der aktuellen Nutzung jeden Monat ausfallen wird. Diese Funktion gibt es in der Management-Konsole von Elements, die alle Aspekte Ihrer Cyberverteidigung steuert und anzeigt. Bei diesem System entfällt auch das Bestellen und Verlängern. Alles, was Sie tun müssen, ist, den Kunden in unserem System zu konfigurieren, und schon ist Elements verfügbar. Dann zahlt der Kunde jeweils nur für das, was er nutzt, und als Partner erhalten Sie automatisch zusätzliche Vorteile, je nach dem Gesamtumfang der Leistungen. Wenn Sie finden, dass nutzungsbasierte Security das Richtige für Ihre Kunden sein könnte und mehr über F-Secure Elements erfahren möchten, klicken Sie hier."
