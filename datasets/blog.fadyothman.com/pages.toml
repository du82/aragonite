description = "One of the main issues I faced when moving to Linux many years ago is the lack of a good office suite, this is not the case anymore for Linux, some wonderful MS Office alternatives are already…"
full_description = "Member-only storySurviving without MS Office on Linux (The best office alternatives on Linux)Fady Othman·FollowPublished inUser-friendly Linux·3 min read·Dec 1, 2024--ShareFree LinkOne of the main issues I faced when moving to Linux many years ago is the lack of a good office suite, this is not the case anymore for Linux, some wonderful MS Office alternatives are already available for Linux, so let’s explore some of these options.Installing Microsoft fontsBefore we start, here’s a tip that makes the documents look very similar to what you see in MS Office, you first need to install Microsoft fonts, in Ubuntu you can do that by simply running the following commands.sudo add-apt-repository multiversesudo apt update && sudo apt install ttf-mscorefonts-installerOnlyOfficeOnly office is one of the best office alternatives out there, I used it for a long time, the main reason is that the UI somewhat resembles MS Office which makes it easier to migrate to this office suite, it’s also free to use.You can download the package suitable for your distribution from this page, packages for windows and mac are also available if you’re worried about editing compatibility on another machine.WPS Office"
