full_description = "Member-only storyAvoid small unallocated space when partitioning (gparted)Fady Othman·FollowPublished inUser-friendly Linux·Dec 17, 2024--ShareFree LinkOne of the things that annoyed me when partitioning drives on Linux is that sometimes you end up with a very small unallocated spaces, like the one in this screenshot.While the space used is very small and negligible, it’s always felt wrong, today, I was removing my swap partition (in favor of using a swap file instead), and I encountered the problem, the fix was super simple, when you resize the partition you need to set “Align to” to “None”, this will eliminate the unallocated space.The super simple solutionAnd now no more small fragments :DAfter"
