full_description = "Member-only storyFrom a Race Condition to Free NFTsFady Othman·Follow2 min read·Feb 13, 2025--2ShareFree LinkHi Everyone,Race conditions are among the most fascinating and dangerous security vulnerabilities. They often arise in systems where multiple processes interact asynchronously, leading to unexpected behaviour. In this post, I’ll walk you through a race condition I discovered in an NFT marketplace website that allowed me to obtain NFTs for free.Problems Happen at BoundariesBefore diving into the details, I want to start with a quote from The Shellcoder’s Handbook:Problems Happen at BoundariesAlthough this isn’t universally true, it’s generally the case that security problems occur when there’s a transition of some kind: from one process to another, from one technology to another, or from one interface to another. The following are a few examples of these.Security vulnerabilities frequently occur when there’s a transition — between processes, technologies, or interfaces. Web3 applications are no exception. They bridge Web2 technologies (traditional web servers, APIs, and databases) with blockchain networks, which operate under entirely different principles.The NFT Marketplace Vulnerability"
