full_description = "Member-only storyWeb Security RoadmapFady Othman·Follow2 min read·Dec 14, 2022--ShareFree LinkHi everyone,I tried to collect as much as I could in this road map but I probably forgot some stuff, if you think something is worth adding please let me know and I will add it to the list.Pre-requisitesHow the internet workHow the browser works.What is DNS and how it works?How HTTP protocol works and how your website is served by the server.What is TLS and how it works?OS basicsHow operating systems work in general.LinuxHow to use the terminal, and basic terminal commands.Linux file system basics and how to edit system configuration.Web DevelopmentSQL basics (I recommend MySql).Learn a back-end language (I recommend PHP), and make sure to focus on the following topics (other topics are important too but these topics are the ones you can not miss).Session Management.Cookies.How to interact with the database.Learn front-end basics.Javascript, make sure that you understand topics like what is DOM, CORS, postMessage, web sockets ..etc.Learn HTML and CSS.Learn how different types of APIs…"
