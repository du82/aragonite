description = "If you like tiling window managers and also like KDE and want the best of both worlds, you can get a pretty good tiling experience using a mix of “Krohnkite” (kwin script) and few custom shortcuts…"
full_description = "Member-only storyBest way to set up tiling on KDEFady Othman·FollowPublished inUser-friendly Linux·3 min read·Dec 30, 2024--ShareFree LinkIf you like tiling window managers and also like KDE and want the best of both worlds, you can get a pretty good tiling experience using a mix of “Krohnkite” (kwin script) and few custom shortcuts.Let’s take a look on how to setup this on kde.Setting up Krohnkite (method 1)This is actually super easy todo, first go to “System Settings” then search for kwin, click “KWin scripts” then hit the “Get New Scripts” button.Now search for “Krohnkite” and hit the install button.Setting up Krohnkite (method 2)To manually install krohnkite follow the steps below:Clone the repositorygit clone https://github.com/esjeon/krohnkite.git2. Run make install.make install"
