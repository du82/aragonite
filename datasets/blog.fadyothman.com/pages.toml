["https://blog.fadyothman.com/fixing-syncthing-permission-errors-on-casaos-external-storage-370e8f2199ff"]
title = "Fixing Syncthing permission errors on CasaOs (external storage) | by Fady Othman | User-friendly Linux | Medium"
description = "When you try to configure Syncthing on Casa OS to share a folder from an external drive, you will get an error similar to the following. I looked a lot online for fixes for this issue until I finally…"
full_description = "Member-only storyFixing Syncthing permission errors on CasaOs (external storage)Fady Othman·FollowPublished inUser-friendly Linux·2 min read·Dec 7, 2024--ShareFree LinkWhen you try to configure Syncthing on Casa OS to share a folder from an external drive, you will get an error similar to the following.Failed to create folder marker: mkdir /media/yourdrive/.stfolder: permission denied”I looked a lot online for fixes for this issue until I finally got it to work, the fix comes in two steps.Step 1 : Fixing the mount permissionsThe root cause of the problem is that the folder is mounted as a different user on the docker image, and hence the user in the docker image doesn’t have the proper permissions, a quick fix for this is to set the permissions to 777, to do so edit the file “/etc/udevil/udevil.conf” using vim or nano.sudo vim /etc/udevil/udevil.confFind the line with the variable “default_options_exfat” if you’re using exfat in your external drive and change it to the following (mainly changing the umask=0000 to mount with 777 permissions), if you’re using a different file format like vfat then the variable that you will need to change will be “default_options_vfat”.default_options_exfat = nosuid, nodev, noatime, uid=$UID, gid=$GID, umask=0000, iocharset=utf8, namecase=0Another option would be to change both the UID and GID to 0 to set the permission to root (Syncthing runs as root inside the docker container), please…"
