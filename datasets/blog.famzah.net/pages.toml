full_description = '''December 20, 2024 by Ivan Zahariev Leave a comment Achieving Zero-Downtime PHP-FPM Restarts and Atomic Updates The Challenge with PHP-FPM Restarts PHP-FPM (FastCGI Process Manager) is a powerful solution for managing PHP processes, but it poses challenges when updating PHP applications or configurations without impacting active requests. A key setting in PHP-FPM is process_control_timeout, which dictates how long the master process waits for a child to finish before forcefully terminating it on graceful restart. If a slow child lingers, incoming requests queue up, causing delays for the duration of the timeout. This delay can lead to significant downtime, especially for high-traffic applications. The Solution: Zero-Downtime Restarts and Atomic Deployments These challenges are addressed through a proof-of-concept designed to enable zero-downtime PHP-FPM restarts and atomic source code updates, ensuring seamless service continuity. Key components of the solution include: Redundant PHP-FPM Pools with Replicas: PHP-FPM instances are managed in redundant pools with at least two replicas. While one replica restarts, the other remains active, ensuring no downtime. Load Balancer Management: A lightweight load balancer dynamically toggles traffic between replicas during restarts, making the switch invisible to users. Atomic Code Deployment: Instead of directly using the “release” symlink as the PHP-FPM working directory, the release target is mounted in an isolated user namespace before starting the PHP-FPM master processes. This ensures that changes to the symlink location can be made immediately for new deployments, while running PHP-FPM masters continue to use their isolated view of the release directory until they are restarted at a convenient time. Important Considerations Static Content and Atomicity: In this setup, Apache serves static content (files not ending in “.php") directly by following the “release” symlink. This means that updates to the “release” symlink immediately impact Apache-served static files, diverging from the atomic deployment of PHP sources. To achieve true atomic deployment of both static content and PHP files, the setup must be reworked. This could involve putting both PHP and static file serving behind a single backend and managing traffic between two such backends in the same way that traffic is currently managed between PHP-FPM backends. Temporary Capacity Reduction: During the restart of one replica (PHP-FPM master), only half of the capacity is available. This capacity reduction should be considered in the context of the expected traffic load during deployments or restarts. Increased Memory Usage: Running two (or more) identical PHP-FPM masters introduces higher memory consumption, as each master maintains its own independent OPcache. This redundancy ensures reliability and atomicity but comes at the cost of increased resource usage. Demo, documentation and source code The full code and setup guide are available on GitHub. Contributions and feedback are welcome! __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c86d08ca0ec', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Categories: Development, Linux | Tags: Apache, php, PHP-FPM | Permalink.'''
