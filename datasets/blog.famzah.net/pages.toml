full_description = "Home Welcome to famzah‘s blog – a place where I’ll share IT and hardware know-how which I recently acquired, and also some personally interesting stuff which may be useful for the public. The main purpose is that you learn something new here, or that I just save you some time on doing an IT, hardware or other project, which I already successfully did. Review the “Recent posts” links on the right, and also the “Categories” list. Feel free to leave a comment, of any kind. Enjoy! Here are a few insightful quotes, which you can read before you decide where to proceed to: Georges Pompidou (French minister and a president of the French Republic in the 1960-1970’s): There are three roads to ruin: women, gambling and technicians. The most pleasant is with women, the quickest is with gambling, but the surest is with technicians. Archibald Putt (dated around 1980’s): Technology is dominated by two types of people: those who understand what they don’t manage, and those who manage what they don’t understand. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67b6f90e2b899', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67b6f90e2b8d3', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Share this:TwitterFacebookRedditEmail"
