full_description = "Habits of Highly Effective Engineering Managers I finished reading the books “The Making of a Manager” by Juklie Zhuo, “The 7 Habits of Highly Effective People” by Stephen Covey, and “The 21 Irrefutable Laws of Leadership” by John Maxwell. Here are my notes: Management Metrics Leadership Relationships Read more: Habits of Highly Effective Engineering Managers December 19, 2018 Intercepting class method invocations using metaclass programming in Python In Ruby, objects have a handy method called method_missing which allows one to handle method calls for methods that have not been defined. Most examples out there explain how to implement this in Python using __getattr__, however, none of them (honestly, none) explain how to intercept class method (@classmethod) invocations using __metaclass__. And this is… Read more: Intercepting class method invocations using metaclass programming in Python October 8, 2018 API Development Tips Organisations who are paying attention already know they need to have an open web API, and many already have under development or in the wild. Make sure you haven’t been caught by the pitfalls of many early API releases. Multiple points of failure: The 5 tips Test it all Plan for future versions Embrace standards… Read more: API Development Tips June 18, 2018 Collective Wisdom from the Experts I’ve finally had a chance to read a book I bought a while ago called “97 Things Every Software Architect Should Know – Collective Wisdom from the Experts“. Not the shortest title for a book, but very descriptive. I bought this book at the OSCON Conference in Portland last year. It’s an interesting book and… Read more: Collective Wisdom from the Experts June 6, 2018 How to create a Data Container Component in React One pattern I’ve used quite a lot while working with React at the BBC and Discovery Channel is the Data Container pattern. It became popular in the last couple of years thanks to libraries like Redux and Komposer. The idea is