title = "Zend Framework DAL: DAOs and DataMappers – Federico Cargnelutti"
description = "A Data Access Layer (DAL) is the layer of your application that provides simplified access to data stored in persistent storage of some kind. For example, the DAL might return a reference to an object complete with its attributes instead of a row of fields from a database table. A Data Access Objects (DAO) is…"
full_description = "Giorgio Sironi says: September 20, 2009 at 9:07 am Hi Federico, Zend_Entity and Doctrine 2 are in-development and will be generic DataMapper implementation driven by annotation or yaml/xml metadata, like Hibernate for Java. I started to contribute to both and their objective is also to eliminate the requirement for custom classes, speeding up development. Federico says: September 20, 2009 at 12:52 pm Hi Giorgio, Yes, I’m following the development of ZF and Doctrine very closely. I like Benjamin’s proposal (http://bit.ly/JrSM6), and it’s great that Zend is supporting it and that you are helping him. I’m glad Zend finally decided to adopt these design patterns that have proven to increase the efficiency of the coding process. Giorgio Sironi says: September 20, 2009 at 1:33 pm Following Matthew Weier O’Phinney’s blog and tweets I guess they are willing to improve the design, but since it is a big and established project they are slowed down by backward compatibility. umpirsky says: September 21, 2009 at 10:53 am Nice post! Why don’t you let exception to be thrown from Project_Dao_Db_User, but return status instead, breaking the trace? Tom Van Herreweghe says: September 21, 2009 at 12:41 pm Hey Federico, I think there is something that doesn’t quite feel right with your code. The idea of working with DAL’s is a great idea, but I think that your implementation is still too tightly coupled to the Db: In your Project_Model_User, you get an instance from the Db. But the problem is that when you want to change your persistance from Db to let’s say Soap, you have to change all your models, because they’re now coupled to the Db. Models should not have to know where their data comes from. Well actually, they should: from your Datamapper. So it seems more logical, to let the Datamapper care about which DAO should be used. Maybe it’s just a matter of opinion or taste, but what do you think? Federico says: September 21, 2009 at 3:31 pm Hi Tom, Yes, you are right. The DataMapper should expose some methods that permit the Domain Model to do whatever it needs to do, while keeping it isolated from the database. I’ve updated the example, thanks. Umpirsky, Done, I got rid of the exceptions to avoid confusion. Thanks."
