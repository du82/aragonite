ergence of… Read more: Recommender Systems: Content-based, Social recommendations and Collaborative filtering June 26, 2016 Geo Proximity Search: The Haversine Equation I’m working on a project that requires Geo proximity search. Basically, what I’m doing is plotting a radius around a point on a map, which is defined by the distance between two points on the map given their latitudes and longitudes. To achieve this I’m using the Haversine formula (spherical trigonometry). This equation is important… Read more: Geo Proximity Search: The Haversine Equation December 8, 2014 Installing multiple versions of Ruby using RVM Ruby Version Manager (RVM) is a tool that allows you to install multiple versions of Ruby and have multiple versions of the same interpreter. Very handy for those who have to maintain different applications using different versions of Ruby. To start, download RVM and install the latest stable version of Ruby: $ echo insecure >>… Read more: Installing multiple versions of Ruby using RVM August 26, 2014 MySQL Split String Function MySQL does not include a function to split a delimited string. However, it’s very easy to create your own function. Create function syntax A user-defined function is a way to extend MySQL with a new function that works like a native MySQL function. To create a function, you must have the INSERT privilege for the… Read more: MySQL Split String Function February 22, 2014 Software Architecture Document Guidelines Regardless of the development process that you use, a description of the software architecture can be essential for any project, big or small. If software architecture is about the structure of a system and is the vehicle for satisfying the requirements, then the software architecture document is a written description of this. The Software Architecture… Read more: Software Architecture Document Guidelines August 16, 2013 Check whether your web server is correctly configured Last year Zone-H reported a record number of 1.5 million websites defacements. 1 million of those websites where running Apache. When it comes to configuring a web server, some people tend to turn everything on by default. Developers are happy because the functionality that they wanted is available without any extra configuration, and there is… Read more: Check whether your web server is correctly configured December 11, 2011 TDD: Checking the return value of a Stub State verification is used to ensure that after a method is run, the returned value of the SUT is as expected. Of course, you may need to use Stubs on a test double or a real object to tell the object to return a value in response to a given message. In Java, you declare… Read more: TDD: Checking the return value of a Stub April 15, 2011 OSCON 2010, The O’Reilly Open Source Convention A couple of weeks ago I attended the O’Reilly Open Source Convention (OSCON) in Portland. OSCON has hundreds of sessions and activities focused on all aspects of open source software. I met some great people, the talks were good and I saw some promising ideas and technologies. Workshops attended Android for Java Developers Marko Gargenta… Read more: OSCON 2010, The O’Reilly Open Source Convention August 9, 2010 Implementing Dynamic Finders and Parsing Method Expressions Most ORMs support the concept of dynamic finders. A dynamic finder looks like a normal method invocation, but the method itself doesn’t exist, instead, it’s generated dynamically and processed via another method at runtime. A good example of this is Ruby. When you invoke a method that doesn’t exist, it raises a NoMethodError exception, unless… Read more: Implementing Dynamic Finders and Parsing Method Expressions March 22, 2010 Command-line memcached stat reporter Nicholas Tang wrote a nice little perl script that shows a basic memcached top display for a list of servers. You can specify thresholds, for instance, and it’ll change color to red if you exceed the thresholds. You can also choose the refresh/sleep time, and whether to show immediate (per second) stats, or lifetime stats.… Read more: Command-line memcached stat reporter November 29, 2009 Database Replication Adapter for Zend Framework Applications Last updated: 21 Feb, 2010 Database replication is an option that allows the content of one database to be replicated to another database or databases, providing a mechanism to scale out the database. Scaling out the database allows more activities to be processed and more users to access the database by running multiple copies of… Read more: Database Replication Adapter for Zend Framework Applications October 2, 2009 Zend Framework DAL: DAOs and DataMappers A Data Access Layer (DAL) is the layer of your application that provides simplified access to data stored in persistent storage of some kind. For example, the DAL might return a reference to an object complete with its attributes instead of a row of fields from a database table. A Data Access Objects (DAO) is… Read more: Zend Framework DAL: DAOs and DataMappers September 19, 2009 1 2 3 … 6 Next Page→"
