title = "Database Replication Adapter for Zend Framework Applications – Federico Cargnelutti"
description = "Last updated: 21 Feb, 2010 Database replication is an option that allows the content of one database to be replicated to another database or databases, providing a mechanism to scale out the database. Scaling out the database allows more activities to be processed and more users to access the database by running multiple copies of…"
full_description = "Sasa Bogdanovic says: October 2, 2009 at 8:48 pm Hi Federico, it is great to have such a flexible way of pointing the application to access the desired database instance and I am sure it will find its use in enterprise applications that use replication. But when it comes to flexibility, MySQL replication engine itself beats them all as it allows almost all possible configurations you may think of. Except one. Well, multi-master replication is referred to as a configuration in which one slave receives updates from more than one master database. While various replication topologies are possible, MySQL does not support multi-master replication out of the box. It is possible by manual or script-controlled switching from one master to another after certain amount of time, but definitely not automatically by MySQL replication engine. It is also unclear to me why would a replica, or consumer, receive an update request. If it is read-only, it should never receive an update request. From a semantic point of view, – A master instance is not a replica. It is the original, while slave databases, being read-only, are copies, or replicas. – A database will be read-only as long as the user connecting to it has read-only rights. Been into MySQL replication a lot lately :) Federico says: October 2, 2009 at 9:15 pm Hi Sasa, That’s right. Suppliers (masters) are not replicas. Consumers (slaves) are read-only replicas and they can receive updates from one or more Suppliers. Are you saying that MySQL desn’t allow you to have 2 or more Suppliers + 2 or more Consumers? What about circular replication with 2 or more nodes? Each node is master of the following node and slave of the preceding one. Circular replication allows you to add more nodes into the mix. Sasa Bogdanovic says: October 2, 2009 at 9:36 pm Hi Federico, that’s right. MySQL replication is configured on the slave database using CHANGE MASTER statement, which cannot accept parameters for an array of masters, but only for a single one. A switch to another master can be done manually using the same statement. Obviously, at the moment the slave is configured to receive updates from the second master, it loses connectivity with the first one."
