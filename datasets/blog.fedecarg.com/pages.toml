full_description = "CaChi says: April 4, 2010 at 12:20 am hi, very wonderfull your work whith this ORM i like too much, but i have a question… ¿the orm only be can used with ZF?… Success! Antony says: April 13, 2010 at 3:04 pm Hello, Federico. What about more complex examples with findAll and Orm itself? This is like “standart” issue: we need limit our select with N,M and order by some columns. Imagine situation: we represent our data as a table with pagination and some “order” functionality. What should I write in my controller? $repository = new UserRepository; $users = $repository->findAll($_GET); /* or $users = $repository->findAll($_GET['name'], $_GET['order'], $_GET['limit_from']); or $users = $repository->findAllbyName(...); ... */ $view->entities = $users; What is your way for this issue? Federico says: April 16, 2010 at 1:26 pm You can supply an array as the final parameter. The MethodExpressionParser class checks for an extra parameter. Line 162 http://bit.ly/9If7Qz"
