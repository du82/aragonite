["http://blog.gerv.net/2015/01/je-suis"]
title = "Je Suis… | Hacking for Christ"
full_description = "Je Suis… Posted on January 9, 2015 by gerv When Muhammad is mocked, Islamic extremism kills and says: We have avenged the Prophet Muhammad! When Jesus is mocked, Christianity hopes and says: And so Jesus also suffered outside the city gate to make the people holy through his own blood. Let us, then, go to him outside the camp, bearing the disgrace he bore. For here we do not have an enduring city, but we are looking for the city that is to come. We are called not to avenge him, but to identify with him and accept the same disgrace. Je Suis Charlie. Et Je Suis Jésus. This entry was posted in Personal by gerv. Bookmark the permalink. Anonymous on January 12, 2015 at 8:11 AM said: And when a terrible atrocity has taken place, Gervase takes the opportunity to post offensive generalizations and prejudice, stirring the fires of strife and intolerance. Let he who is without sin; glass houses; take your pick of applicable expressions. When Christian sensibilities are offended, people were burnt at the stake, and wars were fought. The Old and New Testaments are both full of easily quotable offensive statements that would deeply offend any person with a shred of morality; that doesn’t make all Christians terrible people. Religious intolerance and extremists can be found in every religion. gerv on January 12, 2015 at 8:49 AM said: And when a terrible atrocity has taken place, Gervase takes the opportunity to post offensive generalizations and prejudice, stirring the fires of strife and intolerance. I don’t quite understand your point. You think that the phrase “Islamic extremism” also covers some non-violent viewpoints which I am unfairly tarring with the same brush? When Christian sensibilities are offended, people were burnt at the stake, and wars were fought. If you want to discuss in detail, be more specific, but in general: do you think such actions would have been approved of by Jesus? I notice you continue to be anonymous; are you afraid of violence from me? If not, why not? Could it be that there’s a difference?"
