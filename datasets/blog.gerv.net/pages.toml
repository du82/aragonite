["https://blog.gerv.net/2018/06"]
title = "June | 2018 | Hacking for Christ"
full_description = "We Win Posted on June 28, 2018 by gerv 2 Mozilla has been making a big effort in the past few years to make privacy and data (ab)use a first-class concern in the public consciousness. I think we can safely say that when a staid company like Barclays Bank is using dancing vegetables on national broadcast TV in a privacy-focussed advert, we have won that battle… Posted in Politics, Security, Syndicate | 2 Replies Mozilla All Hands Posted on June 11, 2018 by gerv 2 Today, from across the world, Mozillians are gathering in San Francisco for our six-monthly All Hands. For obvious reasons, I won’t be able to be there, so I want to wish all the best to everyone, and I am confident that more awesome ideas for rocking the free web will emerge from their deliberations. Each year brings different grey clouds to the sky, and requires us to adjust our strategy and tactics to deal with new threats. Some we win and a few we lose, but it’s clear that the world and the web are much better places with Mozilla in them fighting for what is right. Posted in Mozilla, Syndicate | 2 Replies A Case for the Total Abolition of Software Patents Posted on June 6, 2018 by gerv 12 A little while back, I wrote a piece outlining the case for the total abolition (or non-introduction) of software patents, as seen through the lens of “promoting innovation”. Few of the arguments are new, but the “Narrow Road to Patent Goodness” presentation of the information is quite novel as far as I know, and may form a good basis for anyone trying to explain all the possible problems with software (or other) patents. You can find it on my website. Posted in Legal, Syndicate | 12 Replies"
