["https://blog.gerv.net/2013/08/persuade-and-be-persuaded"]
title = "Persuade And Be Persuaded | Hacking for Christ"
full_description = "Persuade And Be Persuaded Posted on August 16, 2013 by gerv It is crucial, of course, to never present any individual decision as written in stone. In the comments associated with each assignment of an issue to a specific future release, invite discussion, dissent, and be genuinely willing to be persuaded whenever possible. Never exercise control merely for the sake of exercising control: the more deeply others participate in the release planning process (see the section called “Share Management Tasks as Well as Technical Tasks” in Chapter 8, Managing Volunteers), the easier it will be to persuade them to share your priorities on the issues that really count for you. — Karl Fogel, Producing Open Source Software This entry was posted in Producing OSS Quotes, Syndicate by gerv. Bookmark the permalink."
