["https://blog.gerv.net/2017/08/spend-save-give"]
title = "Spend, Save, Give | Hacking for Christ"
full_description = "Spend, Save, Give Posted on August 11, 2017 by gerv We are planning to teach our eldest son, now 5, about the wise use of money using a system called “Spend, Save, Give”. The child has 3 jars, one with each label. Each week, they get given an amount of money in conveniently-sized coins. They have to put at least a tenth of it into the Give jar. The New Testament does not mandate that Christians give away a specific proportion of their income, but 10%, corresponding to the Old Testament tithe, is widely considered “a good starting point”. They can distribute the rest across the 3 jars as they choose. “Spend” money can be taken out and spent at any time. “Save” money has to be used on a named item of significant price. (We plan to add a feature here – they have to name the item, we write it down, and they can buy it two weeks later if they still want it at that point. This prevents impulse purchases.) “Give” money must be given away – to church or a charity of the child’s choice. This called for a small making project. You need: * 3 mason jars with the standard-size neck * A pack of slotted lids (which I couldn’t find from a UK source – better sources welcome) * A copy of this handy PDF of labels, wih thanks to “Three Little Monkeys Studio” * A colour printer * Craft knife, cutting mat, tape etc. Assembly instructions would be superfluous; here’s the result: My phone camera is a little distorting; the jars are all the same size :-) This entry was posted in Making by gerv. Bookmark the permalink."
