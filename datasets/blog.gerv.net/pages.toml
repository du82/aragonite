title = "21st Century Nesting | Hacking for Christ"
full_description = "21st Century Nesting Posted on April 11, 2014 by gerv Our neighbours have acquired a 21st century bird’s nest: Not only is it behind a satellite dish but, if you look closely, large parts of it are constructed from the wire ties that the builders (who are still working on our estate) use for tying layers of bricks together. We believe it belongs to a couple of magpies, and it contains six (low-tech) eggs. I have no idea what effect this has on their reception… This entry was posted in Personal, Syndicate by gerv. Bookmark the permalink. Anonymous on April 11, 2014 at 3:53 PM said: obviously like your web site however you have to take a look at the spelling on quite a few of your posts. Many of them are rife with spelling issues and I find it very troublesome to tell the truth nevertheless I’ll certainly come again again. gerv on April 11, 2014 at 6:18 PM said: Indeed. That one’s a keeper (I’ve cleaned out anything that might be useful to the spammer.) They are also hitting faster these days; normally, they go for older posts. Simon on April 13, 2014 at 9:49 AM said: It’s funny how well some animals – birds, especially – adapt to human environments. We change the landscape beyond all recognition, yet it turns out that skyscrapers aren’t all that different from rocky cliff faces when you’re a pigeon. I must say, though – that’s a pretty good piece of engineering from your avian neighbours…"
