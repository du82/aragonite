title = "Security | Hacking for Christ"
full_description = "We Win Posted on June 28, 2018 by gerv 2 Mozilla has been making a big effort in the past few years to make privacy and data (ab)use a first-class concern in the public consciousness. I think we can safely say that when a staid company like Barclays Bank is using dancing vegetables on national broadcast TV in a privacy-focussed advert, we have won that battle… Posted in Politics, Security, Syndicate | 2 Replies Darknet Diaries Podcast on Diginotar Posted on October 16, 2017 by gerv Reply I was recently interviewed by the “Darknet Diaries” podcast about the Diginotar incident, for which I did Mozilla’s security response. Even though this major CA breach happened back in 2011, it still casts a long shadow over the CA industry today, as the scale of the catastrophe has not since been equalled. The episode is 25 minutes long. Posted in Hacking, Security, Syndicate, WebPKI | Leave a reply SSL/TLS and PKI History Posted on September 29, 2017 by gerv Reply A really good, high-level summary of the history of the SSL/TLS protocols and WebPKI from Feisty Duck. Posted in Security, Syndicate, WebPKI | Leave a reply Don’t Pin To A Single CA Posted on April 28, 2017 by gerv 2 If you do certificate pinning, either via HPKP, or in your mobile app, or your IoT device, or your desktop software, or anywhere… do not pin solely to a single certificate, whether it’s a leaf certificate, intermediate or root certificate, and do not pin solely to certificates from a single CA. This is the height of self-imposed Single Point of Failure foolishness, and has the potential to bite you in the ass. If your CA goes away or becomes untrusted and it causes you problems, no-one will be sympathetic. This Has Been A Public Service Announcement. Posted in Security, Syndicate, WebPKI | 2 Replies Firefox Secure Travel Addon Posted on March 10, 2017 by gerv 5 In these troubled times, business travellers occasionally have to cross borders where the border guards have significant powers to seize your electronic devices, and even compel you to unlock them or provide passwords. You have the difficult choice between refusing, and perhaps not getting into the country, or complying, and having sensitive data put at risk. It is possible to avoid storing confidential data on your device if it’s all in the cloud, but then your browser is logged into (or has stored passwords for) various important systems which have lots of sensitive data, so anyone who has access to your machine has access to that data. And simply deleting all these passwords and cookies is a) a pain, and b) hard to recover from. What might be very cool is a Firefox Secure Travel addon where you press a “Travelling Now” button and it: Disconnects you from Sync Deletes all cookies for a defined list of domains Deletes all stored passwords for the same defined list of domains Then when you arrive, you can log back in to Sync and get your passwords back (assuming it doesn’t propagate the deletions!), and log back in to the services. I guess the border authorities can always ask for your Sync password but there’s a good chance they might not think to do that. A super-paranoid version of the above would also: Generate a random password Submit it securely to a company-run web service On receiving acknowledgement of receipt, change your Sync password to the random password Then, on arrival, you just need to call your IT department (who would ID you e.g. by voice or in person) to get the random password from them, and you are up and running. In the mean time, your data is genuinely out of your reach. You can unlock your device and tell them any passwords you know, and they won’t get your data. Worth doing? Posted in Hacking, Security, Syndicate | 5 Replies"
