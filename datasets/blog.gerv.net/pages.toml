["https://blog.gerv.net/2017/06/my-addons"]
title = "My Addons | Hacking for Christ"
full_description = "My Addons Posted on June 29, 2017 by gerv Firefox Nightly (will be 56) already no longer supports addons which are not multiprocess-compatible. And Firefox 57 will not support “Legacy” addons – those which use XUL, XPCOM or the Addons SDK. I just started using Nightly instead of Aurora as my main browser, at Mark Mayo’s request :-), and this is what I found (after doing “Update Addons”): Addons installed: 37 Non-multiprocess-compatible addons (may also be marked Legacy): 21 (57%) Legacy addons: 5 (14%) Addons which will work in 57, if nothing changes: 11 (29%) Useful addons which no longer work as of now are: 1-Click YouTube Video Downloader, Advertising Cookie Opt-Out, AutoAuth, Expiry Canary (OK, I wrote that one, that’s my fault), Google Translator, Live HTTP Headers, Mass Password Reset, RESTClient, and User Agent Switcher. Useful addons which will also no longer work in 57 (if nothing changes) include: Adblock Plus, HTTPS Everywhere, JSONView, and Send to Kodi. I’m sure Adblock Plus is being updated, because it would be sheer madness if we went ahead and it was not being. As for the rest – who knows? There doesn’t seem to be a way of finding out other than researching each one individually. In the Firefox (I think it was) Town Hall, there was a question asked about addons and whether we felt that we were in a good place in terms of people not having a bad experience with their addons stopping working. The answer came back that we were. I fully admit I may not be a typical user, but it seems like this will not be my experience… :-( This entry was posted in Mozilla, Syndicate by gerv. Bookmark the permalink. Aryx on June 29, 2017 at 2:15 AM said: For JSONView, try the internal json viewer which is also enabled by default in release. It’s a similar situation regarding addon compatibility with Firefox 57 here. Gijs on June 29, 2017 at 10:14 AM said: https://addons.mozilla.org/en-gb/firefox/addon/user-agent-switcher-revived/ https://addons.mozilla.org/en-us/firefox/addon/google-translator-webextension/ https://addons.mozilla.org/en-US/firefox/addon/youtube_downloader_webx/ https://addons.mozilla.org/en-US/firefox/addon/rested/ I can’t find what the ad cookie opt-out add-on is (as in, I can’t find an add-on with that name using google), but it sounds like it should be available/implementable as a webextension? HTTPS Everywhere also already has a webextension version (which they use in Chrome) – it seems there are some technical details about update signing which are stopping them from putting this on AMO today ( https://github.com/EFForg/https-everywhere/issues/9958#issuecomment-302581089 ) but you should be able to switch easily. It seems the developer of live http headers thinks you can just use the devtools as they ship with Firefox (see comments on AMO)."
