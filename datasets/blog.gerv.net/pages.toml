title = "Miscellaneous | Hacking for Christ"
full_description = "In the Navel of the Moon Posted on May 8, 2018 by gerv 5 Question: which country’s name translates literally as “In the Navel of the Moon”? I recently came across this fascinating map which gives the literal translation of every country name. Some are very pedestrian, but some are fascinating. (I’m not sure why it’s on a site dedicated to comparing credit cards, but other places I’ve found it give them the credit. If this is an SEO thing, I’m happy to reward them for producing decent content…) Most appropriately, Canada apparently means “The Village”… Posted in Miscellaneous, Syndicate | 5 Replies Eurovision Bingo (yet again) Posted on May 8, 2018 by gerv Reply Some people say that all Eurovision songs are the same. That’s probably not quite true, but there is perhaps a hint of truth in the suggestion that some themes tend to recur from year to year. Hence, I thought, Eurovision Bingo. I wrote some code to analyse a directory full of lyrics, normally those from the previous year of the competition, and work out the frequency of occurrence of each word. It will then generate Bingo cards, with sets of words of different levels of commonness. You can then use them to play Bingo while watching this year’s competition (which is on Saturday). There’s a Github repo, or if you want to go straight to pre-generated cards for this year, they are here. Here’s a sample card from the 2014 lyrics: fell cause rising gonna rain world believe dancing hold once every mean LOVE something chance hey show or passed say because light hard home heart Have fun :-) Posted in Making, Miscellaneous | Leave a reply Well Played, BBC News… Posted on December 6, 2017 by gerv 1 This is currently showing on the BBC News home page: The story is this one. Posted in Miscellaneous | 1 Reply The Ukulele Orchestra of Great Britain Posted on December 1, 2017 by gerv Reply The Ukulele Orchestra of Great Britain come highly recommended. My wife and I saw them last night in Leicester’s De Montfort Hall, and had a wonderful time. They take themselves only semi-seriously, and play a wide range of music; if you’ve never heard Blur’s Song2 played on a bank of eight massed ukuleles, your cultural education is not complete. They play all around the world, so hopefully there’s a date near you in the next six months. Posted in Miscellaneous, Syndicate | Leave a reply"
