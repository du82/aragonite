full_description = "MozSpace Calendars Posted on April 23, 2013 by gerv [Update: changed links so each shows events in the office’s local timezone, rather than GMT.] Mozilla’s wonderful Workplace Resources team are maintaining public calendars for the events going on at each Mozilla Space. If you live near one of these, you might want to keep an eye on it. Each has a .ics feed linked from the bottom corner. (Note that not all these calendars may be in use yet; they are proactively created for each space as it comes into existence.) Auckland Beijing Berlin Boston London Mountain View Paris Portland San Francisco Taipei Toronto Vancouver This entry was posted in Mozilla, Syndicate by gerv. Bookmark the permalink. Pascal Chevrel on April 23, 2013 at 4:43 PM said: I didn’t even know we had such a calendar for Paris. Liz on April 23, 2013 at 7:52 PM said: Oh, this could be useful. Do you happen to know how we can get events listed on the calendars? gerv on April 24, 2013 at 11:00 AM said: I assume you would contact the receptionist or secretary or other WPR employee responsible for the office in question."
