["https://blog.gerv.net/2016/05/eurovision-bingo-again"]
title = "Eurovision Bingo (again) | Hacking for Christ"
full_description = "Eurovision Bingo (again) Posted on May 9, 2016 by gerv Some people say that all Eurovision songs are the same. (And some say all blog posts on this topic are the same…) That’s probably not quite true, but there is perhaps a hint of truth in the suggestion that some themes tend to recur from year to year. Hence, I thought, Eurovision Bingo. I wrote some code to analyse a directory full of lyrics, normally those from the previous year of the competition, and work out the frequency of occurrence of each word. It will then generate Bingo cards, with sets of words of different levels of commonness. You can then use them to play Bingo while watching this year’s competition (which is on Saturday). There’s a Github repo, or if you want to go straight to pre-generated cards for this year, they are here. Here’s a sample card from the 2014 lyrics: fell cause rising gonna rain world believe dancing hold once every mean LOVE something chance hey show or passed say because light hard home heart Have fun :-) This entry was posted in Hacking, Miscellaneous, Syndicate by gerv. Bookmark the permalink. Bingomum on May 19, 2016 at 5:06 PM said: I had fun doing something similar to this at a Eurovision party last week. It was a blast. Thanks again for the Github link :-) AMAR SINGH on March 22, 2019 at 7:20 AM said: We had a great time at evening at Eurovision party, It was fun here Thanks for this Rebekah Staley on June 5, 2019 at 3:46 PM said: Great time at evening at Eurovision party, It was a blast justin hanger on June 6, 2019 at 11:43 AM said: Your tips are amazing! but i fonud something unique here, you should check these link out! SUMMAY SANGA on June 22, 2019 at 9:25 AM said: We had a great time at your tips are amazing, you should check these link out! kingdomace casino on August 21, 2019 at 7:16 AM said: I love to play Eurovision Bingo, I never bord from this game. bingo sites co uk on October 25, 2019 at 8:10 AM said: Great bingo site or latest bonus offers updates for player"
