title = "Accidental Bitcoin Speculation | Hacking for Christ"
full_description = "Accidental Bitcoin Speculation Posted on October 24, 2017 by gerv I had to pay a ransomware bill in February 2015. I bought the right amount of Bitcoin but, like many people, forgot about the transfer fee, so some kind person donated me 0.005 BTC. This means once I was done, my Bitcoin wallet wasn’t totally empty. I have just logged into it again for the first time since, and found that the value of Bitcoin has gone up 28x since then, and so that small amount is now worth… £21.94 (US$28.91). I guess I’m an accidental Bitcoin speculator… This entry was posted in Hacking, Syndicate by gerv. Bookmark the permalink. Byznyslab on November 8, 2017 at 4:35 PM said: Wait until the end of the year and you’ll be a random rich speculator. Just a bit more bitcoins :) Spreadcharts on November 24, 2017 at 5:10 PM said: China´s goverment is developing itself virtual currency so there is high chance of getting on more than 10k/bitcoin so keep holding."
