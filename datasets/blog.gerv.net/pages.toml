["https://blog.gerv.net/2017/07/my-addons-2"]
title = "My Addons (2) | Hacking for Christ"
full_description = "My Addons (2) Posted on July 1, 2017 by gerv My last post on this topic aroused some interest. Here’s the current status of my addons, according to my research. Name u Legacy? No-e10s? Solution Adblock Plus Y N They seem to be working on it. Install from here but you need to disable addon signing. Bookmarklets Context Menu N N Works Cleanest Addon Manager Y N Emailed author, but port very unlikely to be possible due to lack of API to alter chrome HTTPS Everywhere Y N They seem to be working on it JSONView Y N Enable Firefox’s built-in JSON viewer Mailman-admin-helper N N Works Qotter Copy & Show N N Works Send to Kodi Y N Bug filed, author says he’s planning to do it, but no progress; port should be possible Vidyo Replay Download N N Works Wayback Machine N N Works 1-Click YouTube Video Downloader Y Y Switch to YouTube Video and Audio Downloader About Startup Y Y Emailed author: not possible to port to WebExtensions Activity Stream N N Works Advertising Cookie Opt-Out Y Y Replaced by this addon, but that one is still legacy. Asked my Google contact to file a bug. AutoAuth Y Y Addon has ceased development due to the changes :-(; Chrome option “has a plan for Firefox”. AutoHiDPI Y Y Bug filed, author will look into it but no progress; port may not be possible due to lack of arbitrary pref API Expiry Canary Y Y My addon; I believe it’s not possible to update due to lack of SSL APIs in WebExtensions geckoprofiler Y N New version available from here Google Translator for Firefox Y Y Switch to Google Translator (webextension) HTTP Logout Y Y Perhaps some interest; emailed author, who says he has little time Jidesha Y Y Enables screensharing; not needed since Firefox 52 LinkChecker Y Y Original website gone away; can’t find non-legacy alternative Live HTTP Headers Y Y Use Firefox’s dev tools Mass Password Reset Y Y Abandoned by authors; doesn’t seem like there are password APIs Min Vid N N Works MoCo Authorizer Y Y Emailed author; seems like some function may be portable but not all MoCo SSO Tweaks Y N Mozilla is moving away from Okta No Flash Y Y Bug filed; it may be that the extension is no longer needed RESTClient Y Y Switch to RESTED Tab Center N N Works Test Pilot N N Works TiddlyWiki for Firefox Y Y Bug filed on e10s work but no progress; porting would be a very big job UAControl Y Y Switch to User Agent Switcher (revived) and Custom UserAgent String Ubuntu Modifications Y Y Ignore; doesn’t do anything useful User Agent Switcher Y Y Switch to User Agent Switcher (revived) and Custom UserAgent String User Agent JS Fixer Y Y Switch to User Agent Switcher (revived) and Custom UserAgent String YouTube Downloader – 4K Download Y Y Switch to YouTube Video and Audio Downloader So the situation is not terrible, but it’s not awesome either. Several useful extensions, particularly those that modify the chrome or the browser behaviour, or which tweak prefs, are simply not replaceable in the new world. This entry was posted in Mozilla, Syndicate by gerv. Bookmark the permalink."
