["https://blog.gerv.net/category/politics"]
title = "Politics | Hacking for Christ"
full_description = "We Win Posted on June 28, 2018 by gerv 2 Mozilla has been making a big effort in the past few years to make privacy and data (ab)use a first-class concern in the public consciousness. I think we can safely say that when a staid company like Barclays Bank is using dancing vegetables on national broadcast TV in a privacy-focussed advert, we have won that battle… Posted in Politics, Security, Syndicate | 2 Replies Submitting comments to the UK Algorithms Inquiry Posted on October 24, 2017 by gerv Reply Algorithms, machine learning, artificial intelligence, and other code-driven decision-making are increasingly hot topics for policymakers across the globe. The latest request for information came from the House of Commons Science and Technology Select Committee of the UK Parliament – a cross party body holding an inquiry into the use of algorithms in public and business decision making. Last week, Mozilla submitted comments, written by me and edited/improved by Heather West, on how we think about the intersection of algorithms and policy. Posted in Hacking, Politics, Syndicate | Leave a reply Accepting Inconsistency Posted on August 22, 2017 by gerv 2 Following my previous post on things I learned at Bible college about how to have a reasonable discussion, here is another: you need to accept that people are inconsistent. That is to say, it is entirely possible that someone you are debating with will hold two opinions that you believe cannot logically be held at the same time. In a reasonable discussion, you need to accept that this is so without assuming evil intent. One good reason for doing so is that it’s probably true of you also – no-one currently on earth has a worldview and set of opinions which is entirely self-consistent and logically perfect. What you should not do is claim that one or both of the views “isn’t really their view”, or that they are lying or dissembling when they claim to hold both. You are, of course, entirely entitled to point out the inconsistency as you see it, and ask them how they reconcile the two positions. It may be that they haven’t noticed the conflict, and this will cause them to think. Or it may be that you haven’t understood their position fully, and after discussion, you agree the two views are actually compatible. Or it may be that your worldviews and base assumptions differ to such an extent that what you believe is logically impossible, they think is logically fine. The clearest examples are also the most controversial, but to try and illustrate: some people I talk to cannot understand how my beliefs about church leadership are consistent with with my view that everyone is created in the image of God and therefore equally valuable and important. But I, of course, think these views are entirely consistent. And I often cannot understand how the views on human rights espoused by some people I talk to are consistent with with their views on abortion. But they, of course, see no conflict. Regardless, in either direction, it’s not OK for either me or them to make bold statements that the other party is a liar, is debating in bad faith, or is in other ways evil just because, in that party’s opinion, the other person’s set of views is not logically coherent. Posted in Politics | 2 Replies"
