["https://blog.gerv.net/2017/06/root-store-policy-2-5-published"]
title = "Root Store Policy 2.5 Published | Hacking for Christ"
full_description = "Root Store Policy 2.5 Published Posted on June 23, 2017 by gerv Version 2.5 of Mozilla’s Root Store Policy has now been published. This document incorporates by reference the Common CCADB Policy 1.0.1. With this update, we have mostly worked through the backlog of modernization proposals, and I’d call this a policy fit for a transparent, openly-run root program in 2017. That doesn’t mean that there’s not more that could be done, but we’ve come a long way from policy 2.2, which we were using until six months ago, and which hadn’t been substantively updated since 2012. We also hope that, very soon, more root store operators will join the CCADB, which will reduce everyone’s costs and administrative burdens on all sides, and hopefully allow root programs to be more responsive to changing circumstances and requests for inclusion or change. This entry was posted in Mozilla, Syndicate, WebPKI by gerv. Bookmark the permalink. Kees on June 24, 2017 at 9:30 PM said: What puzzles me is that the CCADB is not using a certificate not even one from Let’s Encrypt… Seems to be contradictory, even although the site doesn’t seem to have a login or something like it… gerv on June 25, 2017 at 7:51 AM said: I know it’s ironic, but Github Pages with a custom domain doesn’t support SSL. We can probably fix it by putting it behind Cloudflare, but that’s a separate step we haven’t got around to yet."
