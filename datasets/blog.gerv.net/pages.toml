["http://blog.gerv.net/2015/05/eurovision-bingo"]
title = "Eurovision Bingo | Hacking for Christ"
full_description = "Eurovision Bingo Posted on May 18, 2015 by gerv Some people say that all Eurovision songs are the same. That’s probably not quite true, but there is perhaps a hint of truth in the suggestion that some themes tend to recur from year to year. Hence, I thought, Eurovision Bingo. I wrote some code to analyse a directory full of lyrics, normally those from the previous year of the competition, and work out the frequency of occurrence of each word. It will then generate Bingo cards, with sets of words of different levels of commonness. You can then use them to play Bingo while watching this year’s competition (which is on Saturday). There’s a Github repo, or if you want to go straight to pre-generated cards for this year, they are here. Here’s a sample card from the 2014 lyrics: fell cause rising gonna rain world believe dancing hold once every mean LOVE something chance hey show or passed say because light hard home heart Have fun :-) This entry was posted in Hacking, Miscellaneous, Syndicate by gerv. Bookmark the permalink. gerv on May 24, 2015 at 7:55 PM said: I’m glad you liked them :-) In our game, the first person got a line during song 9, and the second (probably) during the same song. How long did it take you?"
