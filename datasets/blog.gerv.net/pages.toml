title = "Mozilla | Hacking for Christ | Page 2"
full_description = "My Name Is Ozymandigest… Posted on February 24, 2017 by gerv Reply With this patch, a shatter’d visage is obscured, Its’ sneer of cold command in history orphaned. That one whose results were long once, and secure, But now resides, antique, imprinted on things best forgotten. — J.C. Jones’ epitaph for SHA-1 Posted in Mozilla, Quotations, WebPKI | Leave a reply FOSDEM Talk: Video Available Posted on February 7, 2017 by gerv Reply I spoke on Sunday at the FOSDEM conference in the Policy devroom about the Mozilla Root Program, and about the various CA-related incidents of the past 5 years. Here’s the video (48 minutes, WebM): Given that this only happened two days ago, I should give kudos to the FOSDEM people for their high quality and efficient video processing operation. Posted in Browsers, Mozilla, Security, Syndicate | Leave a reply Speaking at FOSDEM on the Mozilla Root Program Posted on January 30, 2017 by gerv Reply Like every year for the past ten or more (except for a couple of years when my wife was due to have a baby), I’ll be going to FOSDEM, the premier European grass-roots FLOSS conference. This year, I’m speaking on the Policy and Legal Issues track, with the title “Reflections on Adjusting Trust: Tales of running an open and transparent Certificate Authority Program“. The talk is on Sunday at 12.40pm in the Legal and Policy Issues devroom (H.1301), and I’ll be talking about how we use the Mozilla root program to improve the state of security and encryption on the Internet, and the various CA misdemeanours we have found along the way. Hope to see you there :-) Note that the Legal and Policy Issues devroom is usually scarily popular; arrive early if you want to get inside. Posted in Browsers, Hacking, Mozilla, Security, Syndicate | Leave a reply Making Good Decisions Posted on December 16, 2016 by gerv Reply Mitchell has been focussed for a while on how Mozilla can make good decisions which are made quickly rather than getting bogged down, but which do not bypass the important step of getting the opinions of a diverse cross-section of interested and knowledgeable members of our community. In relation to that, I’d like to re-draw everyone’s attention to Productive Discussion, a document which came out of a session at the Summit in Brussels in 2013, and which explains how best to hold a community consultation in a way which invites positive, useful input and avoids the paralysis of assuming that consensus is required before one can move forward. If there’s a decision you are responsible for making and want to make it using best practice within our community, it’s a recommended read. Posted in Governance, Mozilla, Syndicate | Leave a reply"
