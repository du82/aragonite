["https://blog.gerv.net/2016/10/no-default-passwords"]
title = "No Default Passwords | Hacking for Christ"
full_description = "No Default Passwords Posted on October 20, 2016 by gerv One of the big problems with IoT devices is default passwords – here’s the list coded into the malware that attacked Brian Krebs. But without a default password, you have to make each device unique and then give the randomly-generated password to the user, perhaps by putting it on a sticky label. Again, my IoT vision post suggests a better solution. If the device’s public key and a password are in an RFID tag on it, and you just swipe that over your hub, the hub can find and connect securely to the device over SSL, and then authenticate itself to the device (using the password) as the user’s real hub, with zero configuration on the part of the user. And all of this works without the need for any UI or printed label which needs to be localized. Better usability, better security, better for the internet. This entry was posted in Hacking, Security, Syndicate by gerv. Bookmark the permalink. Ian Thomas on October 20, 2016 at 1:35 PM said: A good solution for people who care about security, but the majority want it to “just work”. They’ll lose their RFID cards and then what? The random password on a sticker protects against random attacks (e.g. malware) while also being reasonably convenient for the user. gerv on October 20, 2016 at 2:52 PM said: The RFID tag is in a sticker attached to the device – nothing to lose. It’s like the password sticker but contains a public key for immediate secure channel establishment and a password for 2-way auth. It’s strictly better than the password-on-sticker approach. fabrice on October 20, 2016 at 3:49 PM said: You’re adding BOM cost and provisioning. Also not sure how your SSL setup works. Where/when is the certificate created? by which authority? fabrice on October 20, 2016 at 3:51 PM said: Also, about “the hub can find and connect securely to the device over SSL”. One of the challenges with IoT devices is to pair them with the local wifi network in the first place. If you don’t address that you don’t have much."
