["https://blog.gerv.net/2013/08/firefox-os-phones-available-worldwide-from-friday"]
title = "Firefox OS Phones Available Worldwide from Friday | Hacking for Christ"
full_description = "Firefox OS Phones Available Worldwide from Friday Posted on August 12, 2013 by gerv Firefox OS has launched in Spain, Poland, Venezuela and Colombia – but not yet here in the UK. However, from Friday ZTE (one of the manufacturers Mozilla is working with) will be selling their “ZTE Open” Firefox OS phone unlocked from their UK and US eBay stores, and it can be purchased worldwide. They will sell a US-frequencies model from their US store for $79.99, and a UK/EU-frequencies model from their UK store for £59.99. The phone is network unlocked, so you can use it anywhere. It ships with Firefox OS 1.0.1 and can be updated over-the-air. So if you’ve been waiting to get your hands on one, wait no longer :-) This entry was posted in Mozilla, Syndicate by gerv. Bookmark the permalink. Robert on August 12, 2013 at 5:48 PM said: I am still looking for information if Firefox OS devices are bootloader unlocked or not. Is there a condition to use the Firefox brand that devices must be owned by the buyer and not by the OEM using locked bootloaders? if not, which are and which aren’t? gerv on August 15, 2013 at 10:12 PM said: Having made enquiries, I’m pleased to confirm that the ZTE Open is bootloader-unlockable. (I don’t have a set of instructions to hand; I’m seeing if some are available. But the process seems fairly similar across phones these days; there are only so many possibilities for the button combo to hold down at boot! :-)"
