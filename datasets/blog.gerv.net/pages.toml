["https://blog.gerv.net/category/miscellaneous/page/2"]
title = "Miscellaneous | Hacking for Christ | Page 2"
full_description = "Eurovision Bingo Posted on May 18, 2015 by gerv 2 Some people say that all Eurovision songs are the same. That’s probably not quite true, but there is perhaps a hint of truth in the suggestion that some themes tend to recur from year to year. Hence, I thought, Eurovision Bingo. I wrote some code to analyse a directory full of lyrics, normally those from the previous year of the competition, and work out the frequency of occurrence of each word. It will then generate Bingo cards, with sets of words of different levels of commonness. You can then use them to play Bingo while watching this year’s competition (which is on Saturday). There’s a Github repo, or if you want to go straight to pre-generated cards for this year, they are here. Here’s a sample card from the 2014 lyrics: fell cause rising gonna rain world believe dancing hold once every mean LOVE something chance hey show or passed say because light hard home heart Have fun :-) Posted in Hacking, Miscellaneous, Syndicate | 2 Replies If You Like… Posted on April 16, 2015 by gerv Reply An old slogan, due for a comeback? :-) Posted in Miscellaneous, Syndicate | Leave a reply Not That Secret, Actually… Posted on November 26, 2014 by gerv 6 (Try searching Google Maps for “Secret Location”… there’s one in Norway, one in Toronto, and two in Vancouver!) Posted in Miscellaneous, Syndicate | 6 Replies Slavery… Posted on May 23, 2014 by gerv Reply I got the following (presumably misdirected) email at licensing@mozilla.org: If i go on several sites that shows adult videos for free on streaming it’s because i need to see that kind of things ! just don’t ask me why ! I don’t intend to hurt anybody I just want to get fed up to it ! As you know,i never download and i’ve been said it was free to see as long as you don’t share ! Please, let me see what i want ? I’m completely out of money How sad :-( Jesus replied, ‘Very truly I tell you, everyone who sins is a slave to sin. Now a slave has no permanent place in the family, but a son belongs to it for ever. So if the Son sets you free, you will be free indeed. — John 8:34-36 Posted in Miscellaneous | Leave a reply"
