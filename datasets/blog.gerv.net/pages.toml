title = "Mozilla All Hands | Hacking for Christ"
full_description = "Mozilla All Hands Posted on June 11, 2018 by gerv Today, from across the world, Mozillians are gathering in San Francisco for our six-monthly All Hands. For obvious reasons, I won’t be able to be there, so I want to wish all the best to everyone, and I am confident that more awesome ideas for rocking the free web will emerge from their deliberations. Each year brings different grey clouds to the sky, and requires us to adjust our strategy and tactics to deal with new threats. Some we win and a few we lose, but it’s clear that the world and the web are much better places with Mozilla in them fighting for what is right. This entry was posted in Mozilla, Syndicate by gerv. Bookmark the permalink. Karl Fogel on June 11, 2018 at 6:53 PM said: +1. I’d like to see that last sentence as a pop-up on every site on the web. (Okay, just kidding — that would be questionable UX. But you know what I mean.)"
