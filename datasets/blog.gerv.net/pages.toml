["https://blog.gerv.net/2013/10/data-unsuitable-for-authentication"]
title = "Data Unsuitable for Authentication | Hacking for Christ"
full_description = "Data Unsuitable for Authentication Posted on October 2, 2013 by gerv It used to be that my bank rang me (on one of the regular occasions where they mistakenly block my debit card, often over payments which have been occurring regularly every month for years) and asked me to authenticate myself. These days, they ring me and make at least an attempt to authenticate themselves to me, which is an improvement. However, the conversation still goes something like this: Bank: “Sir, if you give me the month and year of your date of birth, I’ll give you the day.” Me: “But my date of birth is on Wikipedia. Anyone can know what it is. You can’t use it to prove I’m me.” Bank: “…” There should be a list of pieces of information which are considered sufficiently “public” or “well known” and so should never be used for authentication – because they are publicly discoverable or because you have to give them to large numbers of people in the course of life. There should be a website listing them, and a hall of shame for companies which use them. Those well-known pieces of information would include: Date of birth Current address Mother’s maiden name Bank account number and sort code Credit card number, expiry and CVC SSN (in the USA) What else? In general, companies should instead use information specific to their relationship with that customer. For example “last item you bought” or “last transaction you made” at a bank. This entry was posted in Security, Syndicate by gerv. Bookmark the permalink. Tim Smith on October 2, 2013 at 6:06 PM said: I set up a secret word on my mobile account that they have to give me before I’ll give them any information. The inspiration came from a column by Barry Fox many, many years ago in PCW. It’s worked pretty well, the only time it falls down is when the call has clearly come from a call centre that’s been handed a long list of names and numbers and nothing else. The chap sounded very relieved when I suggested that we really didn’t need to go through the challenge and answer for me to tell him that I was happy with my new phone and contract. Haven’t spoken with my bank for years though. The last time I did they refused to speak to me on a wireless landline because it was insecure. Tim"
year_published = 2013
