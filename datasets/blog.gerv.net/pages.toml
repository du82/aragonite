["https://blog.gerv.net/category/mozilla"]
title = "Mozilla | Hacking for Christ"
full_description = "Mozilla All Hands Posted on June 11, 2018 by gerv 2 Today, from across the world, Mozillians are gathering in San Francisco for our six-monthly All Hands. For obvious reasons, I won’t be able to be there, so I want to wish all the best to everyone, and I am confident that more awesome ideas for rocking the free web will emerge from their deliberations. Each year brings different grey clouds to the sky, and requires us to adjust our strategy and tactics to deal with new threats. Some we win and a few we lose, but it’s clear that the world and the web are much better places with Mozilla in them fighting for what is right. Posted in Mozilla, Syndicate | 2 Replies Happy Birthday, Mozilla Posted on March 31, 2018 by gerv 8 Mozilla is 20 today. Most of what can be said about that has been ably said by others, some of whom have been involved for even longer than the 18 years I managed. Asa and I started at roughly the same time, but at least Mitchell, Myk and dmose have been around longer and are still involved. (Apologies if I’ve forgotten someone.) As most of you know, I probably won’t be around to see much more of it, but (this will seem trite if it’s not to seem big-headed!) Mozilla is much more than one or even a few people. There will always be a Mozilla as long as there is an Internet and people who care about people on it. In that vein, let me also say that I’m absolutely delighted with the final outcome of the worldview project. The four items in the addendum to the Manifesto are admirable goals to aim for, and ones I endorse wholeheartedly. Posted in Death and Dying, Mozilla, Syndicate | 8 Replies Going Home Posted on February 16, 2018 by gerv 106 I’m going home. As some of my readers will know, my cancer (read that link if the fact I have cancer is new to you) has been causing difficulty in my liver this year, and recently we had a meeting with my consultant to plot a way forward. He said that recent scans had shown an increased growth rate of some tumours (including the liver one), and that has overwhelmed my body’s ability to cope with the changes cancer brings. The last two months have seen various new symptoms and a reasonably rapid decline in my general health. The next two months will be more of the same unless something is done. After some unsuccessful procedures on my liver over the course of this year, the last option is radiotherapy to try and shrink the problem tumour; we are investigating that this week. But even if that succeeds, the improvement will be relatively short-lived – perhaps 3-6 months – as the regrowth rate will be faster. If radiotherapy is not feasible or doesn’t work, the timelines are rather shorter than that. My death is not imminent, but either way I am unlikely to see out 2018. In all this, my wife, my children and I are confident that God is in charge and his purposes are good, and we can trust him and not be afraid of what is coming. We don’t know what the future holds for each of us, but he does. We’ve taken this news as a sign to make some significant changes. The most relevant to readers of this blog is that I am stepping away from Mozilla so I can spend more time focussed on the most important things – my relationships with Jesus, and with my family. I love my work, and God has blessed my time at Mozilla and enabled me to do much which I think have been good for the Internet and the world. However, there are things in life which are much more important, and it’s now time for others to take up those projects and causes and carry them into the future. I have every confidence in my colleagues and fellow Mozillians that this will be done with the greatest care and skill. The CA program, MOSS, and Mozilla’s policy work are all in very good hands. If you pray, please pray that we would make wise decisions about what to do when, and that we would live through this process in a way that brings glory to Jesus. In case it’s of interest, we have set up a read-only mailing list which people can join to keep informed about what is going on, and to hear a bit about how we are handling this and what we would like prayer for. You can subscribe to the list using that link, if you have a Google account. If you don’t you can still join by emailing lightandmomentary+subscribe@googlegroups.com. “Though outwardly we are wasting away, yet inwardly we are being renewed day by day. For our light and momentary troubles are achieving for us an eternal glory that far outweighs them all. So we fix our eyes not on what is seen, but on what is unseen, since what is seen is temporary, but what is unseen is eternal.” — 2 Cor 4:16-18. If I have done anything good in 18 years at Mozilla, may God get all the glory. Posted in Mozilla, Personal, Syndicate | 106 Replies"
