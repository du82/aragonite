["https://blog.gerv.net/2018/06/a-case-for-the-total-abolition-of-software-patents"]
title = "A Case for the Total Abolition of Software Patents | Hacking for Christ"
full_description = "A Case for the Total Abolition of Software Patents Posted on June 6, 2018 by gerv A little while back, I wrote a piece outlining the case for the total abolition (or non-introduction) of software patents, as seen through the lens of “promoting innovation”. Few of the arguments are new, but the “Narrow Road to Patent Goodness” presentation of the information is quite novel as far as I know, and may form a good basis for anyone trying to explain all the possible problems with software (or other) patents. You can find it on my website. This entry was posted in Legal, Syndicate by gerv. Bookmark the permalink. Ben Bucksch on June 7, 2018 at 9:39 PM said: European Patent Convention (EPC 1973) http://www.epo.org/law-practice/legal-texts/html/epc/1973/e/ar52.html ” Article 52 Patentable inventions (1) European patents shall be granted for any inventions which are susceptible of industrial application, which are new and which involve an inventive step. (2) The following in particular shall not be regarded as inventions within the meaning of paragraph 1: (a) discoveries, scientific theories and mathematical methods; (b) aesthetic creations; (c) schemes, rules and methods for performing mental acts, playing games or doing business, and programs for computers; (d) presentations of information. ” “not … inventions: … programs for computers” Karl Fogel on June 7, 2018 at 10:15 PM said: My goodness that is clear thinking. Thanks, Gerv. Tweetidenting about the article now. Gervase Markham on June 8, 2018 at 8:50 AM said: Yes, indeed. However, that sadly doesn’t stop the EPO issuing them, and courts enforcing them. AFAIK, anyway – have any software patents come to litigation in Europe recently? What happened? And still, if they are still a problem in the USA, they are still a problem for everyone in practice, because the web is World Wide, and we want standards that will work everywhere. Gervase Markham on June 8, 2018 at 8:51 AM said: Hi Karl. What is “Tweetidenting”? This page is now the only hit in Google. Did you just coin a new word?"
