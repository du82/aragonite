["http://blog.gerv.net/2012/06/facebook-email-mitm"]
title = "Facebook MITMed My Email | Hacking for Christ"
full_description = 'Facebook MITMed My Email Posted on June 23, 2012 by gerv I prefer email to social media. I do have a Facebook page, but I don’t post anything there, and I made sure that my primary personal email address, gerv[at]gerv.net, was displayed in the profile so that people could contact me directly. Today, I happened to visit my Facebook profile, and noticed that they had changed the displayed email address to gerv.markham[at]facebook.com! The old one was still in the database, but it had been hidden. Email to the Facebook address is forwarded by Facebook to the other one, so it ends up in the same place. [Update: I now think this is not correct. The email instead goes to my Facebook inbox, and I don’t get a notification email to say it’s there. Which is, IMO, even worse – they don’t just pass it through their servers on the way to where it would have gone, they keep it, and fail to send me a copy!] In other words, Facebook silently inserted themselves into the path of formerly-direct unencrypted communications from people who want to email me. In other contexts, this is known as a Man In The Middle (MITM) attack. What on earth do they think they are playing at? This entry was posted in Hacking, Syndicate by gerv. Bookmark the permalink. Gijs on June 23, 2012 at 8:30 AM said: Thanks for pointing this out! It was the same for me; now fixed… bit surprised as that seems like a pretty strange thing for them to do. :-\ Insanity on June 23, 2012 at 9:31 AM said: This is an absolute attack on personal liberties and privacy. However, it would also be nice if you stopped using google’s feedproxy as your rss redirector, which somewhat does the same thing to your rss subscribers through planet Mozilla. having the rss hosted by them is fine (although blogspot now truncates postings for tracking purposes), but having the redirect go throuh them is another privacy issue. John Larson on June 23, 2012 at 10:49 AM said: Ironically, this was done in the name of privacy. When users were switched over to the new privacy system, all of their previous personal information was hidden. (More accurately, all contact information was hidden — as for how much of the other information was shared, I don’t recall). This was because users on the old system often did not know exactly how much was being shared, or how to change those settings. Starting users off with some reasonable defaults while they adjusted is probably the better idea, since they could always opt to be more public in the future if they chose. When Facebook added @facebook.com emails as part of its Messaging initiative, those addresses were made public for people who had previously set their privacy settings to allow all users to message them. Since emails to the Facebook address also go to the Facebook inbox, this was also seen as a reasonable default. Consider the use of email as identity — with a new Facebook address, people can work from a familiar interface (email) while at the same time associating that email with a certain online identity on Facebook. Personally, I believe that users should be actively managing their privacy online. This means staying on top of changes to online services with which they have a relationship. Otherwise, they are effectively outsourcing privacy management to a third-party whose interests may not align with their own. I do not believe that simplifying something as complicated as this down to a single bolded phrase does not properly recognize the challenges of online privacy, and turns reasonable discussion of the pitfalls and perils of trying to the right thing into a soundbite.'
year_published = 2012
