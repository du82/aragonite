["https://blog.gerv.net/2015/02/top-50-dos-problems-solved-doubling-disk-capacity"]
title = "Top 50 DOS Problems Solved: Doubling Disk Capacity | Hacking for Christ"
full_description = "Top 50 DOS Problems Solved: Doubling Disk Capacity Posted on February 28, 2015 by gerv Q: I have been told that it is possible to convert 720K 3.5-inch floppy disks into 1.44Mb versions by drilling a hole in the casing. Is this true? How is it done? Is it safe? A: It is true for the majority of disks. A few fail immediately, but the only way to tell is to try it. The size and placement of the hole is, near enough, a duplicate of the write-protect hole. If the write-protect hole is in the bottom left of the disk, the extra hole goes in a similar position in the bottom right. Whatever you do, make sure that all traces of plastic swarf are cleared away. As to whether this technique is safe, it is a point of disagreement. In theory, you could find converted disks less reliable. My own experience over several years has been 100 per cent problem free other than those disks which have refused to format to 1.44Mb in the first place. You can perform a similar trick with 360K and 1.2Mb 5.25-inch disks. Hands up who remembers doing this. I certainly do… This entry was posted in Syndicate by gerv. Bookmark the permalink. Flore on February 28, 2015 at 10:55 PM said: I definitely remember that… Very easy to do. I wonder if a lot of those HD disks were sold. gerv on March 1, 2015 at 1:21 AM said: Oh, I’m sure lots were, because this was a cheapskate thing to do. I was a schoolboy, so I did it. My parents, running a business, did not :-) Michael Kaply on March 1, 2015 at 6:03 AM said: There was a company that sold a disk hole punch specifically for this purpose. Gervase Markham on March 1, 2015 at 7:56 AM said: I remember using a conventional holepunch. The holes it made were a bit on the large side, but it worked. glandium on March 2, 2015 at 5:12 AM said: I was using a soldering iron to create those holes, melting the plastic. Donald Gordon on March 2, 2015 at 8:18 PM said: I upgraded from dual 360K drives to a high density 3.5″ disk so late that 1.44MB disks were reasonably priced. The trick that was worthwhile, even at this late state, was jamming a few extra tracks on your HD 3.5″ disk to increase its capacity still further. This was so popular that some software install disks had this done to them by the vendor! Wikipedia tells me this was Microsoft, and they fit 1.68MB on said disks."
