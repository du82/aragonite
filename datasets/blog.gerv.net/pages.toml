["https://blog.gerv.net/2005/09/ssl2_must_die"]
title = "SSL2 Must Die: Help Wanted | Hacking for Christ"
full_description = "SSL2 Must Die: Help Wanted Posted on September 1, 2005 by gerv We’ve been working on making it possible to turn off SSL version 2 (an older, more insecure version of the SSL protocol) in Firefox. We’ve already had one big success, with the number of SSL2-only sites dropping from around 10,000 to around 2,000 after a large ISP reconfigured their servers. But there are no more big wins. I’ve obtained a list of the most popular sites which are SSL2-only. I am looking for volunteers to help with the task of checking that the list is correct, grouping it by company, ISP and netblock, and getting in touch with the relevant admins to ask them to fix the configuration of their servers. Please email me if you can spare a few hours for this. This entry was posted in Mozilla by gerv. Bookmark the permalink. DJC on September 1, 2005 at 1:39 PM said: I’ve had SSL2 disabled since your last blog post, and I haven’t had a single problem! Quite promising seeing as I’m on the Internet for at least 5 hours per day. Alan Trick on September 1, 2005 at 3:07 PM said: Just a note. I just checked on my browser and it’s disabled by default. Although I got mine from the gentoo package system. Mabye Mozilla still ships it enabled. jhermans on September 1, 2005 at 3:29 PM said: I’ve testing with the link you provided () and the others I found on your previous post, but I seem not be able to switch off SSL2 support anymore ! Mozilla/5.0 (Windows; U; Windows NT 5.1; en-US; rv:1.8b4) Gecko/20050831 Firefox/1.0+ n/a on September 1, 2005 at 4:32 PM said: Mozilla should hard-code a compressed list of enabled SSL2 sites and blacklist any others. :) Alan Trick on September 1, 2005 at 5:18 PM said: n/a, what would that accomplish? We want to get web sites to move away for these old protocols, not give them a reason to stay complacent. Neil T. on September 1, 2005 at 5:20 PM said: I’d prefer if Firefox popped up a warning if the site only supported SSL2 on the lines of “This site uses an older, less secure connection. Any data you submit may be at risk of being read by third parties. Do you wish to continue? (Yes/No)” . That might encourage more sysadmins to switch over, especially if all browser makers adopted this approach."
