["https://blog.gerv.net/2016/04/dmca-section-512-comments-submitted"]
title = "DMCA Section 512 Comments Submitted | Hacking for Christ"
full_description = "DMCA Section 512 Comments Submitted Posted on April 6, 2016 by gerv A small milestone: the first post in my name on the Mozilla Net Policy blog has just been published. It concerns our filing comments for a US Copyright Office consultation on section 512 of the DMCA – the section dealing with safe harbo(u)rs for intermediary liability. Section 512 contains the rules that mean Facebook, Twitter and other platforms actually let you have a conversation and upload images and videos to talk about, rather than restricting that capability because they are too afraid of immediate copyright liability. This is not to be confused with section 1201 of the DMCA, which gives the rules for the 3-yearly process for getting DMCA exceptions for important things like phone unlocking. We also filed comments in a consultation on that recently. We hope that the Copyright Office’s recent attention to these sections bodes well for useful reforms to US copyright law. This entry was posted in Mozilla, Politics, Syndicate by gerv. Bookmark the permalink."
