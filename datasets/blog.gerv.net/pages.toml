["https://blog.gerv.net/category/browsers"]
title = "Browsers | Hacking for Christ"
full_description = "Firefox Quantum: Fast for Good Posted on November 14, 2017 by gerv 5 Today, we launch Firefox 57 “Quantum” – the culmination of a year’s work to rebuild Firefox from the inside out as a “flipping fast”, standards-compliant, user-centric browser which takes maximum advantage of modern computers. If you haven’t tried Firefox in a while, now is the time to give it another go. Get it here. Posted in Browsers, Mozilla, Syndicate | 5 Replies FOSDEM Talk: Video Available Posted on February 7, 2017 by gerv Reply I spoke on Sunday at the FOSDEM conference in the Policy devroom about the Mozilla Root Program, and about the various CA-related incidents of the past 5 years. Here’s the video (48 minutes, WebM): Given that this only happened two days ago, I should give kudos to the FOSDEM people for their high quality and efficient video processing operation. Posted in Browsers, Mozilla, Security, Syndicate | Leave a reply Speaking at FOSDEM on the Mozilla Root Program Posted on January 30, 2017 by gerv Reply Like every year for the past ten or more (except for a couple of years when my wife was due to have a baby), I’ll be going to FOSDEM, the premier European grass-roots FLOSS conference. This year, I’m speaking on the Policy and Legal Issues track, with the title “Reflections on Adjusting Trust: Tales of running an open and transparent Certificate Authority Program“. The talk is on Sunday at 12.40pm in the Legal and Policy Issues devroom (H.1301), and I’ll be talking about how we use the Mozilla root program to improve the state of security and encryption on the Internet, and the various CA misdemeanours we have found along the way. Hope to see you there :-) Note that the Legal and Policy Issues devroom is usually scarily popular; arrive early if you want to get inside. Posted in Browsers, Hacking, Mozilla, Security, Syndicate | Leave a reply Introducing Deliberate Protocol Errors: Langley’s Law Posted on September 26, 2016 by gerv 1 Google have just published the draft spec for a protocol called Roughtime, which allows clients to determine the time to within the nearest 10 seconds or so without the need for an authoritative trusted timeserver. One part of their ecosystem document caught my eye – it’s like a small “chaos monkey” for protocols, where their server intentionally sends out a small subset of responses with various forms of protocol error: A healthy software ecosystem doesn‘t arise by specifying how software should behave and then assuming that implementations will do the right thing. Rather we plan on having Roughtime servers return invalid, bogus answers to a small fraction of requests. These bogus answers would contain the wrong time, but would also be invalid in another way. For example, one of the signatures might be incorrect, or the tags in the message might be in the wrong order. Client implementations that don’t implement all the necessary checks would find that they get nonsense answers and, hopefully, that will be sufficient to expose bugs before they turn into a Blackhat talk. The fascinating thing about this is that it’s a complete reversal of the ancient Postel’s Law regarding internet protocols: Be conservative in what you send, be liberal in what you accept. This behaviour instead requires implementations to be conservative in what they accept, otherwise they will get garbage data. And it also involves being, if not liberal, then certainly occasionally non-conforming in what they send. Postel’s law has long been criticised for leading to interoperability issues – see HTML for an example of how accepting anything can be a nightmare, with the WHAT-WG having to come along and spec things much more tightly later. However, but simply reversing the second half to be conservative in what you accept doesn’t work well either – see XHTML/XML and the yellow screen of death for an example of a failure to solve the HTML problem that way. This type of change wouldn’t work in many protocols, but the particular design of this one, where you have to ask a number of different servers for their opinion, makes it possible. It will be interesting to see whether reversing Postel will lead to more interoperable software. Let’s call it “Langley’s Law”: Be occasionally evil in what you send, and conservative in what you accept. Posted in Browsers, Google, Security, Syndicate | 1 Reply"
