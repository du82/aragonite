["https://blog.gerv.net/author/gerv/page/3"]
title = "gerv | Hacking for Christ | Page 3"
full_description = "Join OpenStreetMap UK Posted on October 16, 2017 by gerv Reply OpenStreetMap is the world’s premier provider of free-as-in-freedom mapping and routing data, with a data density in many places which far surpasses all proprietary providers. Here, for example, is the centre of Kampala, Uganda, Africa: They have chapters around the world, and one was recently set up in the home of OSM, the UK. Joining is only £5 a year; please consider joining and supporting them in this way if you use OSM data at all or are interested in the project. Posted in Hacking, Syndicate | Leave a reply Q3 MOSS Update Posted on October 4, 2017 by gerv Reply The Mozilla Open Source Support (MOSS) update for Q3 has been published on the main Mozilla blog. Highlights include the launch of our pilot program focussed on supporting open source in India, a large grant to Ushahidi, and a very successful audit of the chrony NTP daemon. Posted in MOSS, Mozilla, Syndicate | Leave a reply SSL/TLS and PKI History Posted on September 29, 2017 by gerv Reply A really good, high-level summary of the history of the SSL/TLS protocols and WebPKI from Feisty Duck. Posted in Security, Syndicate, WebPKI | Leave a reply MOSS Conflict of Interest Rules Posted on September 28, 2017 by gerv Reply We decided to implement a lightweight Conflict of Interest policy for the MOSS Committees, not because we have had problems, but because we’d like never to have them :-) They are based loosely on the Wikipedia ones, and are here for anyone to use who wants them (CC-0). MOSS Conflict of Interest Rules (v1.0) As a committee member, you must: 1. Disclose actively if you are receiving, will receive, or have received in the past 5 years payment or anything of value from an applicant or their project; 2. Disclose actively if any family member, spouse, partner, business associate, significant other, close friend, or their organizations or employers would benefit from the approval of an application; 3. Answer fully and honestly any relevant and appropriate questions about potential conflicts of interest when discussing an application; 4. Disclose actively if your approval or disapproval of an application could be perceived by others or the public as improper, because even the perception of a conflict or unauthorized personal gain needs to be disclosed; 5. Not approve applications for personal gain. Under the above rules, a person should “disclose actively” a potential or actual conflict of interest. To “disclose actively” means (1) to report the conflict to the MOSS Administrator; and (2) to do so explicitly and as soon as the conflict is known. The MOSS Administrator will assess the conflict and, if it is judged to be material, will report it or request that the member report it to the committee. Posted in MOSS, Syndicate | Leave a reply"
