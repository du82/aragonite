["https://blog.gerv.net/2016/09/off-trial"]
title = "Off Trial | Hacking for Christ"
full_description = "Off Trial Posted on September 27, 2016 by gerv Six weeks ago, I posted “On Trial”, which explained that I was taking part in a medical trial in Manchester. In the trial, I was trying out some interesting new DNA repair pathway inhibitors which, it was hoped, might have a beneficial effect on my cancer. However, as of ten days ago, my participation has ended. The trial parameters say that participants can continue as long as their cancer shrinks or stays the same. Scans are done every six weeks to determine what change, if any, there has been. As mine had been stable for the five months before starting participation, I was surprised to discover that after six weeks of treatment my liver metastasis had grown by 7%. This level of growth was outside the trial parameters, so they concluded (probably correctly!) the treatment was not helping me and that was that. The Lord has all of this in his hands, and I am confident of his good purposes for me :-) This entry was posted in Personal, Syndicate by gerv. Bookmark the permalink."
