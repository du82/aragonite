["https://blog.gerv.net/2013/04/no-money-in-email-clients"]
title = "No Money In Email Clients | Hacking for Christ"
full_description = "No Money In Email Clients Posted on April 25, 2013 by gerv It seems there is no money in the email client space. Some of the finest minds at Mozilla were unable to make Thunderbird financially self-supporting, having tried several methods, and now an Indigogo campaign to raise $100K for the Geary email client, with support from Bytemark and CiviCRM and with publicity on TechCrunch, has not met its target (they reached just over half the total). I have no inside insight into what’s going on at Postbox, but their last major release was in November 2011, most changes since then have been bug fixes, and most of their recent blog posts have been about price reductions or ways to get it cheaper. Is it simply that webmail is good enough for most people? This entry was posted in Mozilla, Syndicate by gerv. Bookmark the permalink. Neil Turner on April 25, 2013 at 10:11 AM said: Also, Sparrow (sparrowapp.com) got bought by Google and ceased development last year. I think you’re mostly right that for most people webmail is good enough. Outlook rules supreme in corporate IT, and presumably most people are happy with the email client that comes with their smartphone or tablet. And I admit to switching from Thunderbird to Apple’s Mail app on my Mac because I found it simpler. Dirkjan Ochtman on April 25, 2013 at 10:24 AM said: Yes. The current crop of webmail clients (I prefer GMail, but my wife likes outlook.com better, actually) is very good. If you use POP3, then webmail affords you with better access to your email everywhere. If you use IMAP, then webmail latencies aren’t actually much worse than native client latencies. From where I sit, the browser keeps eating native desktop software. I could get by with just a browser and a terminal these days, although I still prefer native feed readers (but that’s going to get harder with Reader’s demise) and local storage of audio and video still makes more sense. On touch devices (particularly phones) it’s not as clear because there’s more of a performance bonus for removing the intermediate browser layers, but I think that’s coming down RSN. Still, a good webmail client upholding Mozilla values might be valuable."
