["https://blog.gerv.net/category/webpki"]
title = "WebPKI | Hacking for Christ"
full_description = "Darknet Diaries Podcast on Diginotar Posted on October 16, 2017 by gerv Reply I was recently interviewed by the “Darknet Diaries” podcast about the Diginotar incident, for which I did Mozilla’s security response. Even though this major CA breach happened back in 2011, it still casts a long shadow over the CA industry today, as the scale of the catastrophe has not since been equalled. The episode is 25 minutes long. Posted in Hacking, Security, Syndicate, WebPKI | Leave a reply SSL/TLS and PKI History Posted on September 29, 2017 by gerv Reply A really good, high-level summary of the history of the SSL/TLS protocols and WebPKI from Feisty Duck. Posted in Security, Syndicate, WebPKI | Leave a reply Root Store Policy 2.5 Published Posted on June 23, 2017 by gerv 2 Version 2.5 of Mozilla’s Root Store Policy has now been published. This document incorporates by reference the Common CCADB Policy 1.0.1. With this update, we have mostly worked through the backlog of modernization proposals, and I’d call this a policy fit for a transparent, openly-run root program in 2017. That doesn’t mean that there’s not more that could be done, but we’ve come a long way from policy 2.2, which we were using until six months ago, and which hadn’t been substantively updated since 2012. We also hope that, very soon, more root store operators will join the CCADB, which will reduce everyone’s costs and administrative burdens on all sides, and hopefully allow root programs to be more responsive to changing circumstances and requests for inclusion or change. Posted in Mozilla, Syndicate, WebPKI | 2 Replies Don’t Pin To A Single CA Posted on April 28, 2017 by gerv 2 If you do certificate pinning, either via HPKP, or in your mobile app, or your IoT device, or your desktop software, or anywhere… do not pin solely to a single certificate, whether it’s a leaf certificate, intermediate or root certificate, and do not pin solely to certificates from a single CA. This is the height of self-imposed Single Point of Failure foolishness, and has the potential to bite you in the ass. If your CA goes away or becomes untrusted and it causes you problems, no-one will be sympathetic. This Has Been A Public Service Announcement. Posted in Security, Syndicate, WebPKI | 2 Replies"
