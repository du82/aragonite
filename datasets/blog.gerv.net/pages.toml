title = "Quotations | Hacking for Christ"
full_description = "My Name Is Ozymandigest… Posted on February 24, 2017 by gerv Reply With this patch, a shatter’d visage is obscured, Its’ sneer of cold command in history orphaned. That one whose results were long once, and secure, But now resides, antique, imprinted on things best forgotten. — J.C. Jones’ epitaph for SHA-1 Posted in Mozilla, Quotations, WebPKI | Leave a reply Overheard at Google CT Policy Day… Posted on February 21, 2017 by gerv Reply Jacob Hoffman-Andrews (of Let’s Encrypt): “I tried signing up for certspotter alerts for a domain and got a timeout on the signup page.” Andrew Ayer (of CertSpotter): “Oh, dear. Which domain?” Jacob Hoffman-Andrews: “hoffman-andrews.com” Andrew Ayer: “Do you have a lot of certs for that domain?” Jacob Hoffman-Andrews: “Oh yeah, I totally do!” Andrew Ayer: “How many?” Jacob Hoffman-Andrews: “A couple of hundred thousand.” Andrew Ayer: “Yeah, that would do it…” Posted in Hacking, Quotations, Syndicate, WebPKI | Leave a reply An Important Truth From A Surprising Source Posted on February 9, 2017 by gerv Reply Q: I feel bad. Doesn’t that mean you must have said something wrong? A: No, other people aren’t obligated to refrain from saying anything that makes you feel bad. — Tim Chevalier Posted in Quotations | Leave a reply Awareness Posted on December 14, 2016 by gerv 3 I’ve been reading the excellent “Stuff White People Like“, billed as “The Definitive Guide to the Unique Taste of Millions”. It’s based on a well-read (although now seemingly dormant) satirical blog. Here’s an entry which particularly hit home: 18. Awareness. An interesting fact about white people is that they firmly believe all the world’s problems can be solved through “awareness” – meaning the process of making other people aware of problems, magically causing someone else, like the government, to fix it. This belief allows them to feel that sweet self-satisfaction without actually having to solve anything or face any difficult challenges, because the only challenge of raising awareness is getting the attention of people who are currently unaware. What make this even more appealing for white people is that you can raise “awareness” through expensive dinners, parties, marathons, T-shirts, fashion shows, concerts and bracelets. In other words, white people just have to keep doing stuff they like, except that now they can feel better about making a difference. Raising awareness is also awesome because once you raise awareness to an acceptable though arbitrary level, you can just back off and say, “Bam! Did my part. Now it’s your turn. Fix it.” So, to summarise: you get all the benefits of helping (self-satisfaction, telling other people) but no need for difficult decisions or the ensuing criticism. (How do you criticise awareness?) Once again, white people find a way to score that sweet double victory. Popular things to be aware of: the environment, diseases like cancer and AIDS, Africa, poverty, anorexia, homophobia, middle school field hockey/lacrosse teams, drug rehab, and political prisoners. Posted in Quotations, Syndicate | 3 Replies"
