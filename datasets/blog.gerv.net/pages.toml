["https://blog.gerv.net/2017/11/firefox-quantum-fast-for-good"]
title = "Firefox Quantum: Fast for Good | Hacking for Christ"
full_description = "Firefox Quantum: Fast for Good Posted on November 14, 2017 by gerv Today, we launch Firefox 57 “Quantum” – the culmination of a year’s work to rebuild Firefox from the inside out as a “flipping fast”, standards-compliant, user-centric browser which takes maximum advantage of modern computers. If you haven’t tried Firefox in a while, now is the time to give it another go. Get it here. This entry was posted in Browsers, Mozilla, Syndicate by gerv. Bookmark the permalink. Mike Oliver on November 15, 2017 at 2:47 PM said: Fix your browser, the extensions are what made Firefox better now they are unusable. The text at the header of the browser and the bookmarks and all that is super small, and you killed the only extension that fixed it. Who cares if it’s faster if it’s a pain in the ass to use. It’s not a hard concept ease of use and speed together. Customization and function are what people want. I’ve posted this same issue all over your FB but no reply, and you had the nerve to mark one of my posts as spam. Gervase Markham on November 15, 2017 at 3:12 PM said: The UI text in our UI is the same as other applications on your computer; if that’s too small for you, there will be OS-level settings which change the size of the text in all applications, which are the appropriate way to fix the problem. WalterK on November 17, 2017 at 10:33 AM said: So far, performance on newer hardware is good. But with new branding, HTML document icon has dark blue/black background. That is an eye-sore ugly and contrasts with every other document that resides on my desktop. Could Firefox change it to have white/light background similar to all other apps or add another icon to the executable for people to change it manually? Gervase Markham on November 17, 2017 at 3:14 PM said: This is probably not the best place for a bug report :-) See https://bugzilla.mozilla.org/ . WalterK on November 19, 2017 at 2:39 AM said: Of cause, you are right :) The issue has been already reported [1] but it looks like it is a “design decision”. Let’s see if we can convince people in charge to accommodate the dissenters. [1] https://bugzilla.mozilla.org/show_bug.cgi?id=1417990"
