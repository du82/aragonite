["https://blog.gerv.net/2018/03/happy-birthday-mozilla-4"]
title = "Happy Birthday, Mozilla | Hacking for Christ"
full_description = "Happy Birthday, Mozilla Posted on March 31, 2018 by gerv Mozilla is 20 today. Most of what can be said about that has been ably said by others, some of whom have been involved for even longer than the 18 years I managed. Asa and I started at roughly the same time, but at least Mitchell, Myk and dmose have been around longer and are still involved. (Apologies if I’ve forgotten someone.) As most of you know, I probably won’t be around to see much more of it, but (this will seem trite if it’s not to seem big-headed!) Mozilla is much more than one or even a few people. There will always be a Mozilla as long as there is an Internet and people who care about people on it. In that vein, let me also say that I’m absolutely delighted with the final outcome of the worldview project. The four items in the addendum to the Manifesto are admirable goals to aim for, and ones I endorse wholeheartedly. This entry was posted in Death and Dying, Mozilla, Syndicate by gerv. Bookmark the permalink. Asa Dotzler on March 31, 2018 at 10:27 PM said: There are more than a dozen people working at Mozilla today who were at Netscape back in the day. I think that’s amazing. gerv on April 1, 2018 at 3:49 AM said: it is – although if we are being picky, we might not count those who took a “break” in the middle to go and work for someone else. There are a few of those. But still, they say the age of a “job for life” is over – seems like not everywhere. Of course, dying at 40 does make that somewhat easier to achieve… :-) Asa Dotzler on April 3, 2018 at 12:21 AM said: Continuously working on Mozilla is a much smaller group. Me, dbaron, and myk (and mitchell if you count part-time) are it I think. We were the last out at Netscape and the first in at the Foundation along with ben, leaf, brendan, mscott, jst, and chofmann who are all off to other things now. Gervase Markham on April 3, 2018 at 2:16 AM said: Yep, that sounds about right. If one glosses over the Netscape/Foundation transition, have any of those people been full time paid since March 31st, 1998? Mitchell – no. You and me – no (we both started a bit later). When did myk and dbaron join Netscape? If no-one has been full-time paid continuously, then mitchell could be it if we count part-time. How long did it take her to persuade Mitch Kapor to pay her? :-)"
