full_description = "Speaking at FOSDEM on the Mozilla Root Program Posted on January 30, 2017 by gerv Like every year for the past ten or more (except for a couple of years when my wife was due to have a baby), I’ll be going to FOSDEM, the premier European grass-roots FLOSS conference. This year, I’m speaking on the Policy and Legal Issues track, with the title “Reflections on Adjusting Trust: Tales of running an open and transparent Certificate Authority Program“. The talk is on Sunday at 12.40pm in the Legal and Policy Issues devroom (H.1301), and I’ll be talking about how we use the Mozilla root program to improve the state of security and encryption on the Internet, and the various CA misdemeanours we have found along the way. Hope to see you there :-) Note that the Legal and Policy Issues devroom is usually scarily popular; arrive early if you want to get inside. This entry was posted in Browsers, Hacking, Mozilla, Security, Syndicate by gerv. Bookmark the permalink."
