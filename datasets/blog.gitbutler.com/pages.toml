["https://blog.gitbutler.com/git-tips-and-tricks"]
title = "Git Tips and Tricks"
description = "Some things that people don’t tend to know about Git anymore, and some new things you might not have noticed."
full_description = '''a year ago by Scott Chacon — 1 min read Git Tips and Tricks Some things that people don’t tend to know about Git anymore, and some new things you might not have noticed. git My FOSDEM 2024 talk on little known Git stuff that this blog series is based off.Years ago I used to do talks on advanced Git stuff. For the last decade or so, I've sort of assumed that everyone knew all the advanced command line stuff by now.However, in the last few months I’ve been back on the speaking circuit, talking about Git and GitButler and I’ve found that lots of people don’t know a lot of stuff about Git.There is a whole generation of developers who just grew up only using Git, never having to switch to it from something else or relearn previous concepts from SVN or CVS or whatever.Additionally, there are a few things that Git can do now that wasn’t possible years ago. Git has learned some stuff. Most of the changes are subtle or very targeted, but they could be useful to people, so I figured this would be a good time to do a little survey of some interesting Git things that might be new to you for whatever reason.There are a million things, but I'm going to narrow them down to "still too many for one blog post", so instead I'll do a small series covering a few topics each.The SeriesSo, I'm going to write 3 short articles on some interesting Git things for intermediate to advanced Git users that you may not know, either because they just never came up or because they're pretty new and you've been using Git the same way for years.The topics are:Oldies but GoodiesSome Subtle New ThingsReally Large Repositories and MonoreposI hope you find something interesting in there. Git continues to surprise even me, so have fun exploring!Let's start with Oldies but Goodies! The link has been copied! Some Other Posts Like This How to do patch-based review with git range-diff How Core Git Developers Configure Git Stacked Branches with GitButler Fearless Rebasing'''
