["https://blog.gitbutler.com/introducing-gitbutler"]
title = "Introducing GitButler"
description = """
The development world runs on Git, yet pretty much nobody actually likes using Git.

The main reason people put up with Git is love for GitHub, but GitHub is where people collaborate, not where people work. GitHub is not local.

Nobody has really tried to reinvent the concept of version"""
full_description = "GitButler's Ian, Kiril, Scott, Matthias and Anne in Lithuania, planning the future of Version Control. Not pictured, our other amazing butler, Nikita. 2 years ago by Scott Chacon — 1 min read Introducing GitButler blog company The development world runs on Git, yet pretty much nobody actually likes using Git.The main reason people put up with Git is love for GitHub, but GitHub is where people collaborate, not where people work. GitHub is not local.Nobody has really tried to reinvent the concept of version control tooling from first principles in a GitHub world. If we started from scratch, what would a really great way to manage your source code look like?We are rethinking source code management as a code concierge. An intelligent, context aware helper that learns from you, rather than a dumb and dangerous tool that you have to learn.We have completely new ideas based on modern workflows as a drop in replacement, easily adoptable by any of the millions of Git-based developers today, individually or in teams.Over the next few months, we will be reinventing the entire concept of source code management and we can't wait to show you what we're working on. If you would like to help us, please sign up for our waiting list.We look forward to serving you. The link has been copied! Some Other Posts Like This How to do patch-based review with git range-diff How Core Git Developers Configure Git Stacked Branches with GitButler Fearless Rebasing"
