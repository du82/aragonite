title = "Strong results for malaria vaccine - The GiveWell Blog"
description = "A study published in the New England Journal of Medicine reports strong results from a clinical trial testing the efficacy of a malaria vaccine. The"
full_description = "Strong results for malaria vaccine Previous Post Next Post December 10, 2008 | by Elie This post is more than 16 years oldA study published in the New England Journal of Medicine reports strong results from a clinical trial testing the efficacy of a malaria vaccine. The double-blind, randomized trial found a significant impact on malaria incidence among the group receiving the malaria vaccine. The full study is available here. The summary results: 894 children were randomly assigned to receive the either the malaria vaccine or hte control vaccine. Among the children who completed the study according to the protocol, 32 of 402 (8%) who received the malaria vaccine developed clinical malaria and 66 of 407 (16%) in the control group did. Results were similar when all 894 children were included in the intention-to-treat analysis. Results were similar in both the trial locations (Tanzania and Kenya). (h/t Chris Blattman) Posted in Uncategorized | Permalink | 1 Comment Previous Post Next Post"
