["https://blog.givewell.org/2007/04/14/nice-guys-finish-last"]
title = "Nice guys finish last - The GiveWell Blog"
description = "In addition to ~20 charity/philanthropy/social-goodliness blogs, I read one blog, TechCrunch, about for-profit Internet startups. I'd say I see about 10x"
full_description = "Nice guys finish last Previous Post Next Post April 14, 2007 (updated on: April 14, 2007) | by Holden This post is more than 17 years oldIn addition to ~20 charity/philanthropy/social-goodliness blogs, I read one blog, TechCrunch, about for-profit Internet startups. I’d say I see about 10x as much negativity, sarcasm, skepticism, and criticism on TechCrunch as on those 20 improve-the-world blogs combined. That’s why I like TechCrunch. If you check out the front page now, you’ll see TechCrunch questioning Google’s high-priced acquisition of DoubleClick, stating “We all know what sucks about LinkedIn [one of the most successful social networks in the world]”, and responding to Rolling Stone’s plan to create a social network with “The Rolling Stone audience may be too old to get into the social networking scene.” Nobody gets off easy. Contrast with NetSquared, currently holding a vote to showcase 20 projects “remixing the Web for social good.” While TechCrunch picks only the most promising, highest-profile startups to write about, the ~150 NetSquared nominees were selected as follows: anyone who wanted to nominate a project did so. Yet while TechCrunch is constantly picking at its subjects for weaknesses, you’ll have a tough time finding anyone critical of anyone on NetSquared. Here are a few choice examples of the tone: all the projects are amazing, there is far too much to choose from, etc. Check out the specific discussions of projects and you’ll see the same: criticisms are few and far between, and always prefaced with “This is the most wonderful thing in the world, but …” I believe the difference in tone is pretty constant between these two sectors – and it isn’t just the people, it’s the way people see charity. I’ve even heard my coworkers say things like “I think all charities are doing wonderful things” (I usually ask if they think the same about all businesses). The thing is, in the business world it’s obvious to everyone that good isn’t good enough. You need to be the BEST, within your area, or else capital is better spent on your competitors – and you’re going to go under. But I don’t see why this is any less true of the nonprofit sector – all of it except the part about going under. Right now, there’s no mechanism for charitable capital (donations from individuals) to flow to where it’s best used, and that means no mechanism for inferior charities to go under, and THAT means no constant pressure to get better. That’s what we’re trying to change, because we think the people served by charities deserve the same relentless improvement and scrutiny that the people served by businesses benefit from. We need kind people in the nonprofit sector, but I could go for fewer nice people. Nice people are always encouraging; they think everything well-intentioned is worth doing; they respond to my ideas with “OK” instead of “Wouldn’t it be better to ____?” They make good grandmothers, not good partners. Posted in Uncategorized | Permalink | 3 Comments Previous Post Next Post"
