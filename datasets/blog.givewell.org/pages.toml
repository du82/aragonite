full_description = "Bear with us Previous Post Next Post December 20, 2007 | by Holden This post is more than 17 years oldWe got more attention today than we can handle. We have a tremendous volume of questions, comments, concerns, and requests and it’s going to take us a while to dig through them. We have no customer service dept – it’s just me, Elie, and Teel – but we will get it done. So if you emailed us or commented on our blog and you’re wondering where we went, we’ll be responding to you as soon as is practical (should be within a week), and we appreciate your patience. Highlights of what caused the ruckus: New York Times feature that is currrently the 3rd most emailed story on NYT. Stephanie Strom did a great job turning our nerdy research project into a story that people want to read and pass on. That photo is so evil-looking that it’s already giving me nightmares. CNBC interview on Power Lunch. Apparently I messed up by putting my hands behind the chair. Sorry. Wall Street Journal article about taking charity evaluation beyond the Straw Ratio. This is a fantastically exciting article in that it’s directly taking on the difference between effectiveness and “low overhead.” Between it and the NYT, it’s a dark day for naive accounting metrics. Kudos to Rachel Silverman and Sally Beatty. Posted in GiveWell project | Permalink | 15 Comments Previous Post Next Post"
