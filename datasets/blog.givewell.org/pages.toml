title = "March 2010 - The GiveWell Blog"
full_description = "Think Before You Give: A new podcast with Elie Hassenfeld and Saundra Schimmelpfennig March 29, 2010 (updated on: July 26, 2016) | by Holden GiveWell has teamed up with Saundra Schimmelpfenig of Good Intentions Are Not Enough to produce Think Before You Give, a podcast aimed at helping to empower and educate donors. We enjoy Saundra’s work and are happy to be working with her on this. The Think Before You Give website now has the first podcast available…. Read More Posted in Uncategorized | Permalink | 1 Comment TakeAction @ GuideStar March 29, 2010 | by Holden We are thrilled to announce a partnership with GuideStar via its new feature, TakeAction @ GuideStar. TakeAction allows donors to select a cause that interests them and see general information as well as recommended charities, with content provided by GiveWell, Philanthropedia, and Great Nonprofits. To date, GuideStar has provided only basic information, and only information… Read More Posted in Uncategorized | Permalink | 3 Comments A good response re: diversion of skilled labor March 27, 2010 | by Holden I previously expressed concerns about diversion of skilled labor: the possibility that nonprofits are outbidding the local private sector for top local talent. John de Wit of the Small Enterprise Foundation emailed us with a response: On the question of whether we divert skilled labour from other potentially productive pursuits let me try to comment… Read More Posted in Uncategorized | Permalink A proposal for donors interested in causes/charities we haven’t covered March 23, 2010 | by Elie I was talking with a friend of mine recently about how he decides which charities to support, and he said: I really like the GiveWell approach, but there are two reasons it’s not practical for me to base most of my charitable decisions on it. First, you just haven’t covered a lot of the areas… Read More Posted in Uncategorized | Permalink | 9 Comments Cost-effectiveness estimates: Inside the sausage factory March 19, 2010 (updated on: July 26, 2016) | by Holden We’ve long had mixed feelings about cost-effectiveness estimates of charitable programs, i.e., attempts to figure out “how much good is accomplished per dollar donated.” The advantages of these estimates are obvious. If you can calculate that program A can help much more people – with the same funds, and in the same terms – than… Read More Posted in Cost-effectiveness analysis | Permalink | 9 Comments"
