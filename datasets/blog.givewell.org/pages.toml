September 3, 2010 (updated on: October 14, 2010) | by Elie Over the past few months, we’ve been continuing our search for outstanding microfinance organizations (in addition to the one we’ve already identified). Below are the results. Overview of our process and key questions In brief, our take on microfinance is that offering credit and other financial services is likely an effective way to improve people’s… Read More Posted in Microfinance charities, Uncategorized | Permalink | 2 Comments"
