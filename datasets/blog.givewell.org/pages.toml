title = "The GiveWell Blog - Exploring how to get real change for your dollar."
description = "Exploring how to get real change for your dollar."
full_description = "Results from GiveWell’s First Grantee Survey January 29, 2025 | by Matt Wang Recently, the GiveWell research team has focused on collecting more feedback about our work and processes, such as through our Change Our Mind contest, our Research Council, and by asking donors for feedback. While we typically ask for candid, live feedback from the organizations we work with, we had not previously invited anonymous assessment of our grantmaking process. We know our processes are different from those of many other funders, and we want to make sure our work reflects our values of maximizing global well-being, transparency, truth-seeking, and considerateness. So, in July 2024, we sent out our first anonymous survey to people we’ve worked with during grant investigations. The survey was sent to 55 individuals representing 40 organizations that participated in a GiveWell grant investigation from January 1, 2022, to March 31, 2024. It focused on their experiences with our process and post-grant follow-up, and also included a few general questions asking for their feedback about GiveWell. We received 32 responses to the survey, a response rate of 58%. Two of the 32 responses were from organizations that did not receive a grant. What we learned Overall, the people who responded to our survey rated their satisfaction with GiveWell’s investigation process as 4.2 out of 5. The highest-rated areas were responsiveness and respectful communication, well-reasoned information requests, and satisfaction with the post-investigation process. Read more Posted in Evaluation of GiveWell, Transparency | Permalink | Leave a comment January 2025 Updates January 27, 2025 | by Chandler Brotak Every month we send an email newsletter to our supporters sharing recent updates from our work. We publish selected portions of the newsletter on our blog to make this news more accessible to people who visit our website. For key updates from the latest installment, please see below! If you’d like to receive the complete newsletter in your inbox each month, you can subscribe here. Read more Posted in Updates | Permalink | Leave a comment"
