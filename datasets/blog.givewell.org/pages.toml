description = "We've been releasing a lot of new material over the last few weeks, and I want to make sure that our blog readers are aware of it. GiveWell.net now"
full_description = "New material Previous Post Next Post July 22, 2008 (updated on: July 23, 2008) | by Holden This post is more than 16 years oldWe’ve been releasing a lot of new material over the last few weeks, and I want to make sure that our blog readers are aware of it. GiveWell.net now includes: New research reports and charity recommendations on three causes. Global Poverty: includes a thorough review of the logical and empirical case for microfinance. We have no recommended organization (though we awarded our grant in this cause to Opportunity International) due to how little information we were able to get from large MFIs. Early childhood care: we recommend the Nurse-Family Partnership, an exceptional organization replicating a proven program. K-12 education: we recommend the Knowledge is Power Program and Teach for America, though we believe that early childhood care (specifically the Nurse-Family Partnership) is a more promising approach to promoting equality of opportunity than either of these. New summaries of our research, which give the highlights rather than the details: see our summary of findings for all five causes, as well as our overviews of equality of opportunity in the U.S. and developing-world direct aid. A thorough review of the successes, shortcomings, and lessons from our first year, as well as our plan for the coming year. An overview of our modified funding model, the GiveWell Pledge. More on this in a future post. Posted in GiveWell project | Permalink Previous Post Next Post"
