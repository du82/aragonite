["https://blog.givewell.org/2007/01/23/our-first-content-less-meta-post"]
title = "Our first content-less meta-post! - The GiveWell Blog"
description = "I don't have time for a real post today and I did two yesterday, so here are some scattered comments about what you can expect over the next few weeks:"
full_description = "Our first content-less meta-post! Previous Post Next Post January 23, 2007 (updated on: March 24, 2007) | by Holden This post is more than 18 years oldI don’t have time for a real post today and I did two yesterday, so here are some scattered comments about what you can expect over the next few weeks: First off, there’s a blog carnival – which is an awful name for what I would prefer to call a “blogozine,” a collection of posts from various blogs on a single topic – on “responsible investing.” Check it out if you care what other people think of the issues I’ve been discussing. I’m not finished with the Straw Ratio. I’ve made the biggest points I want to make, but at some point I want to finish totally tearing it apart. Lately I’ve been very focused on the business strategy end of the GiveWell project; I haven’t had time to do much actual research and learn more about the world’s problems. So a lot of my posts have been on abstract philosophy of giving/evaluation. That will change somewhat over the next few weeks, as I am visiting two Holden Award-winning charities: Children’s Aid Society and New Visions for Public Schools. Elie will probably go with me, and we plan to absolutely grill these people and come back with much more knowledge of what they do. You’ll hear about it. How’s my choice of topics? What’s worth reading and what isn’t? What would you rather I blog about? Leave comments on the blog or email me (holden@givewell.net) to let me know. Posted in GiveWell project | Permalink | 1 Comment Previous Post Next Post"
