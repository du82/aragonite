full_description = "Why are you reading this? November 13, 2007 (updated on: November 13, 2007) | by Holden For nearly a year now, we’ve been talking about creating the world’s first truly useful donor resource: one that goes beyond naive and meaningless metrics like “how much of my money goes to program”? and instead looks at what charities do and whether it works. It’s not an idea anymore, it’s a product. It exists… Read More Posted in GiveWell project | Permalink | 1 Comment Where should you give? November 11, 2007 (updated on: November 23, 2007) | by Holden When you’re donating, do you want a “safe and reputable” charity – or the best? From fighting disease in Africa to improving inner-city education, helping people isn’t simple – for charities OR for donors. That’s why it isn’t enough to know that “99% of your money goes to programs.” (In fact, we think it’s often… Read More Posted in GiveWell project, Uncategorized | Permalink | 4 Comments How to get your values violated November 8, 2007 (updated on: November 11, 2007) | by Holden Look, another story where a foundation is accused of violating its original funders’ values. It’s ridiculous to accuse the foundation. The funders violated their own values, the second they handed over their money to an organization set up to exist forever. Read More Posted in Uncategorized | Permalink 3 . . . 2 . . . 1 . . . November 7, 2007 (updated on: November 11, 2007) | by Holden This Monday, we will release the beta for the product we’ve been promising since day one: a full account of what charities we recommend, and why, in five different humanitarian causes. (Only one cause will be available at first, but the others will come online within 5-10 weeks.) I blogged yesterday only because I had… Read More Posted in GiveWell project | Permalink “Dollars per life changed” metric: What is it good for? November 6, 2007 (updated on: July 26, 2016) | by Holden Many moons ago, I listed the metrics we planned to use in evaluations. Well, here’s a shocker for you: when looking at actual charities’ activities, the reality is 10,000x as complicated as anything that can fit into these metrics. We always knew we would run into the following problem: if Charity A saves 100 people… Read More Posted in Uncategorized | Permalink | 6 Comments"
