title = "What I wrote in the Gates Foundation survey - The GiveWell Blog"
description = '''Hey, the Gates Foundation is finally showing some interest in what others think. Here's what I wrote in response to "Please share any comment or opinions'''
full_description = "What I wrote in the Gates Foundation survey Previous Post Next Post October 31, 2007 | by Holden This post is more than 17 years oldHey, the Gates Foundation is finally showing some interest in what others think. Here’s what I wrote in response to “Please share any comment or opinions you have about our web site.” Not enough information. Not even close to enough information. Where are your evaluations & technical reports? Where’s your evidence for whether you’ve saved lives, how many lives you’ve saved, whether you’ve made any traction on education, what you think works in education? All I see is a list of grantees with 2-sentence descriptions (no account of how you choose them over other applicants) and a bunch of generalizing, salesy publications that don’t get specific about what was observed, how it was observed, and what specific practices you advocate. Glad you’re finally inviting feedback, because there are other people in existence trying to figure out where to give. As the leading foundation, you have an opportunity to create dialogue about how to help people as well as possible, and affect others’ giving as well as your own. This website does a great job burying that opportunity. Also, the look&feel is pretty drab. Posted in Uncategorized | Permalink | 6 Comments Previous Post Next Post"
