["https://blog.givewell.org/2008/05/22/good-vs-better"]
title = "Good vs. better - The GiveWell Blog"
description = "I recently read Better by Atul Gawande, and found myself particularly struck - and reminded of our own situation - by his analysis of hospital care."
full_description = "Good vs. better Previous Post Next Post May 22, 2008 (updated on: July 25, 2016) | by Elie This post is more than 16 years oldI recently read Better by Atul Gawande, and found myself particularly struck – and reminded of our own situation – by his analysis of hospital care. According to Dr. Gawande, conventional wisdom has long been that the vast majority of hospitals provides top-notch, quality care, and only a fraction treats their patients incompetently. This implies that the most important thing a patient can do is weed out incompetent hospitals – but worrying about “average” vs. “exceptional” isn’t worth it. But a systematic study found otherwise. The Cystic Fibrosis Foundation had long monitored the well-being of CF patients at hospitals around the country. When they evaluated the data, they found that quality of care and patient outcomes, such as life expectancy and quality of life, varied more than they had expected. A relatively small group of hospitals provided low-quality care, but another group provided top-notch care. Their patients lived longer and lived better. (The foundation also found that the vast majority of hospitals fell in the giant, indistinguishable middle, providing average care that was neither incompetent nor excellent.) The differences in impact weren’t just academic. The evaluation found that average life expectancy for someone diagnosed with CF was 30 yrs, but at top hospitals, life expectancy was significantly longer, averaging 46 yrs. While alive, patients at average hospitals had lower quality of life than those without CF because they had lower lung function and consequently couldn’t participate in a host of normal activities. At top hospitals, patients’ lung function was equivalent to those without the illness. The differences were real and they were stunning. Recognizing the significance of the results, the Cystic Fibrosis Foundation did the only thing they could: they made all the information public. Patients should know which hospitals provide best care, shouldn’t they? Doctors should know which methods work best, shouldn’t they? Critics feared that demand for care at the best hospitals would outstrip the hospitals’ ability to provide it, but instead something else happened. Care improved across the board as hospitals’ staff met and implemented the practices of those at the top. The reported conventional wisdom on hospitals reminds me of the conventional wisdom we constantly hear expressed about charities: that the vast majority of them do great work, and that it’s important to weed out the “frauds” but that distinguishing between “legitimate” charities amounts to nitpicking. Our instinct, however, is that charities are like hospitals, companies, and any other set of highly complex organizations that vary in their people and approach to difficult problems. Our instinct is that in charity as in most other things, the difference between “best” and “average” is at least as important as the difference between “legitimate” and “illegitimate” – and that starting to examine the differences, publicize them, and push for the best may lead to improvement across the board. Posted in GiveWell project | Permalink | 10 Comments Previous Post Next Post"
