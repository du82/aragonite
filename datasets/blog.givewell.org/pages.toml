full_description = "Haiti earthquake relief seems less cost-effective than everyday international aid January 29, 2010 (updated on: August 18, 2011) | by Elie The disaster in Haiti – and the media coverage of it – pull at the emotions in a way that everyday suffering in the developing world does not. However, our rough calculations suggest that in fact, a donor can have a bigger impact for less money by funding top charities’ everyday activities to reduce unnecessary… Read More Posted in Disaster relief, Haiti earthquake | Permalink | 5 Comments Can choosing the right charity double your impact? January 28, 2010 (updated on: August 18, 2011) | by Elie Reader Evan writes: I’ve been thinking about how best to donate to Haiti, and I reviewed some of the materials on your website and found them pretty helpful and persuasive. So thank you! But then my law firm announced that it would match donations to the Red Cross or Doctors Without Borders. Given that, I… Read More Posted in Disaster relief, Haiti earthquake, Impact evaluation | Permalink | 5 Comments More on the microfinance “repayment rate” January 22, 2010 (updated on: December 8, 2011) | by Elie We are concerned about the way repayment rates are often reported. We’ve written about this issue before, arguing that different delinquency indicators can easily be misleading and pointing to one example we found where a microfinance institution’s reported repayment rate substantially obscures the portion of its borrowers that have repaid loans. Following the links from… Read More Posted in Impact evaluation, Microfinance charities, Problems with microfinance | Permalink Haiti earthquake donations January 13, 2010 (updated on: September 2, 2016) | by Elie Update: see our official page on Haiti earthquake relief, which consolidates advice from us and a few other sources we have high opinions of. Reader Brigid writes: “I would love to hear any thoughts you have on contributions in light of the crisis in Haiti. My sense is that now of all times is when… Read More Posted in Disaster relief, Haiti earthquake | Permalink | 14 Comments"
