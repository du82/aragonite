["https://blog.givewell.org/2007/08/18/wont-the-real-microlending-please-stand-up"]
title = "Won't the real microlending please stand up? - The GiveWell Blog"
description = "There's been a lot of excitement about microlending, especially since the 2006 Nobel Peace Prize created a wave of stories about it. The basic idea is to"
full_description = "Won’t the real microlending please stand up? Previous Post Next Post August 18, 2007 (updated on: June 11, 2012) | by Holden This post is more than 17 years oldThere’s been a lot of excitement about microlending, especially since the 2006 Nobel Peace Prize created a wave of stories about it. The basic idea is to make loans to the destitute, helping them pull themselves out of poverty. The stories and the numbers floating around from fundraisers paint a picture that’s simply too good to be true (below) … we can’t authoritatively say that we have the real story, but I think I’m starting to understand the difference between these stories and how microlending actually helps people. First, the good stuff. The microlending you’ve heard of: beggars to billionaires, thousands of times a day gramm When I first heard about microfinance, everywhere I turned was a story like this one, or this one, or perhaps this one, or all these ones. (Dang. That was the easiest time I’ve ever had finding examples of anything.) Basic story: poor entrepreneur has a killer business model (OK, usually a fruit stand) that’s ready to expand, if only someone would lend the funds. In swoops a microlender; the entrepreneur borrows, expands the business, succeeds, and changes her life for good. Now imagine how I felt after combining those basic stories with the aggregate numbers: repayment rates like 97%, on billions of dollars lent, with a typical loan being around $50 ??? So if each loan repaid is a person who has built a business and escaped poverty … then if I donate $50, it can be lent out repeatedly and help a family escape poverty every 6-12 months for the rest of eternity? And if Grameen Bank has lent out ~$5 billion … that’s … 100 million people lifted out of poverty forever? I know what you’re thinking: “Sign me up! How could Holden doubt any of these claims?” Well, call me the Grinch, but here were a few things that bugged me: 1. If every loan were really going to expand a successful business, the lenders wouldn’t be nonprofits – they would for-profits, and Muhammad Yunus and his friends would all be katrillionaires. Oh, and poverty wouldn’t exist. 2. Expanding a business is going to involve serious risk, unless you’ve got new customers already lined up for miles. I know I never gave much thought to being an entrepreneur until I had some cash saved up … seems hard to believe that people living hand-to-mouth are all chomping at the bit to do it. This paper makes this general argument (hard to be an entrepreneur when you’re in poverty) a bit better than I just did. 3. Seriously … how many people do you know who could start a profitable business if you loaned them a million dollars? But then again, if these people aren’t lifting themselves out of poverty, why and how are they borrowing money and paying it back? What’s really going on here? The microlending that happens: credit as basic need Here’s a paper you’ll be hearing more about in future posts. It’s a review of many studies of the actual impact of microfinance on poverty. Pages 17-20 describe one of the more rigorous attempts at this, and the debate over what it showed; the one thing all three of the studies agree on is that people with credit available had smoother consumption: “household consumption increased most during the lean Aus season, when the poor often go hungry.” I don’t know about you, but I’ve always taken my ability to smooth consumption (saving, borrowing, etc.) so much for granted that it didn’t even occur to me what it would be like to live without it. But as this paper argues in great detail, the world’s poorest often are less badly hurting for food/medicine than they are for the most basic support networks and mechanisms we use to manage our lives. If your income is seasonal and you’ve got no bank, forget about starting a business – you can’t even plan for the next week. In this context, giving loans isn’t about creating and expanding ventures, it’s about meeting a basic need that might be as vital as the classic food, water, and shelter: the ability to manage risk and plan for changes. Loans aren’t the key to ending poverty, but they’re one of many things that we have to make available. So I’ve done it, I’ve killed Santa Claus. Microloans won’t end global warming and baldness; they’re just one more way of helping people, along with bednets, condoms, and water purification. Donors, how do you feel? Disgusted? Disillusioned? Ready to swear off charity for good? Or interested in learning more? Thanks to Tim of Philanthropy Action for discussing this issue with me and pointing me to two of the papers above (Dichter; Banerjee/Duflo). Posted in Uncategorized | Permalink | 4 Comments Previous Post Next Post"
