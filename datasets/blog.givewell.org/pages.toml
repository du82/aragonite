full_description = "Anonymity rocks July 31, 2007 (updated on: July 31, 2007) | by Holden I’ve been flooding our readers lately, so today I just want to brag a little bit about an aspect of our application process. We provide a public online discussion forum as one way for our applicants to ask questions and give feedback. One of the advantages of that it lets our applicants criticize us anonymously… Read More Posted in GiveWell project | Permalink | 1 Comment My favorite cause July 30, 2007 (updated on: July 30, 2007) | by Holden This is a response to the Giving Carnival topic I posted a couple days ago. I’m passionate about all of the 2007 Clear Fund causes, and about many others as well, but the one that revs me up the most is inner-city education in wealthy societies. The reasons for this are complicated and tough to… Read More Posted in Uncategorized | Permalink | 4 Comments Giving Carnival 8/07: Bare your soul July 28, 2007 (updated on: July 26, 2016) | by Holden This blog is hosting the Giving Carnival this week. The Giving Carnival is a horrible name for the following: the host chooses a topic, anyone who wants to writes/submits a post on that topic, and the host posts links to the ones he wants to (in a space this small, generally everyone) with commentary. It’s… Read More Posted in Uncategorized | Permalink | 12 Comments Wanna get pumped about GiveWell? July 27, 2007 | by Holden Read the debate over at Tactical Philanthropy, on the following question: Clarity in charity – good or bad? (My wording.) It reminds me of when I used to read really old arguments for democracy and free speech (I’m talking about Locke, John Stuart Mill, etc.) and think, “Huh, there were people who disagreed with this… Read More Posted in GiveWell project | Permalink Hangover July 25, 2007 (updated on: July 25, 2016) | by Holden That last post was a doozy, wasn’t it. Please read it, though, if you get a chance, because this is really important. It’s my first attempt in a while to do