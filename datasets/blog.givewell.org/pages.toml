full_description = "A quick, free way to support GiveWell April 10, 2007 | by Holden Over 150 projects have been submitted for the NetSquared conference at the end of May, and only 20 will get to go. The winners will be determined by an online vote, open until this Saturday afternoon … and you know what that means: 1. This is a popularity contest, and given how likable I am… Read More Posted in GiveWell project | Permalink Announcing the Clear Fund April 7, 2007 | by Holden The goal of GiveWell is to make thorough analysis of charities (the kind currently exclusive to large grantmakers) available, useful, usable, and criticizable for any donor, large or small, who cares. This has been our goal since last August, but we have come a long way in terms of strategy. Originally, our strategy was to… Read More Posted in GiveWell project | Permalink | 2 Comments Every analogy has its limits … April 5, 2007 (updated on: April 5, 2007) | by Holden As illustrated by this raging debate between me and two guys at GiftHub. (If you want to get straight to the metaphor-gone-awry goodness, Ctrl-F “life partner.”) Meanwhile, talking to people about my video game analogy, I’ve realized the biggest problem with it relates to the role of enjoyment. Enjoyment is the ultimate goal of playing… Read More Posted in Uncategorized | Permalink Charity: The video game that’s real April 3, 2007 (updated on: July 26, 2016) | by Holden “How does helping people make you feel?” That’s what I’ve been asked, and my answer isn’t familiar from any publications on marketing or fundraising that I know of. When I was younger, I loved playing video games. Single-player video games, without anyone watching. I didn’t get anything for my virtual accomplishments – not appreciation, or… Read More Posted in Uncategorized | Permalink | 16 Comments Selflessness in action April 2, 2007 (updated on: April 3, 2007) | by Holden I find most of the motivations that marketers attribute to donors irrelevant. Gaining appreciation, recognition, a legacy, a warm and fuzzy feeling, an ego boost, a thank-you note, a friend – I don’t give a crap about any of it. A great illustration of what does drive me to give was written today, by an… Read More Posted in Uncategorized | Permalink"
