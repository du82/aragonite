title = 'Malaria "success story" questioned - The GiveWell Blog'
description = "Aid Watch on questionable claims of success against malaria: Real victories against malaria would be great, but false victories can mislead and distract"
full_description = "Malaria “success story” questioned Previous Post Next Post February 12, 2009 (updated on: August 5, 2013) | by Holden This post is more than 16 years oldAid Watch on questionable claims of success against malaria: Real victories against malaria would be great, but false victories can mislead and distract critical malaria efforts. Alas, Mr. and Mrs. Gates are repeating numbers that have already been discredited. This story of irresponsible claims goes back to a big New York Times headline on February 1, 2008: “Nets and New Drug Make Inroads Against Malaria,” which quoted Dr. Arata Kochi, chief of malaria for the WHO, as reporting 50-60 percent reductions in deaths of children in Zambia, Ethiopia, and Rwanda, and so celebrated the victories of the anti-malaria campaign. Alas, Dr. Kochi had rushed to the press a dubious report. The report was never finalized by WHO, it promptly disappeared, and its specific claims were contradicted by WHO’s own September 2008 World Malaria Report, by which time Dr. Kochi was no longer WHO chief of malaria. Video with the Gateses available here. Posted in International charity, Malaria Charity, Uncategorized | Permalink Previous Post Next Post"
