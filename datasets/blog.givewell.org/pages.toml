full_description = "Cost-effective and straightforward September 11, 2008 (updated on: September 11, 2008) | by Holden We know of two large-scale, systematic projects devoted to rating the cost-effectiveness of different health interventions. Both use an approach centered on disability-adjusted life-years (DALYs), which is not the only measure of cost-effectiveness we intend to use, but they’re a start. One is the Disease Control Priorites report. We are currently in the process of… Read More Posted in Uncategorized | Permalink “Straightforward” interventions September 11, 2008 | by Holden As discussed previously, we are looking for (program-based) interventions that are both proven and scalable. The Disease Control Priorities report lists many interventions that are “proven,” in the sense that one or more studies have been done indicating that the program has improved health outcomes in the region. However, showing that a program has worked… Read More Posted in Uncategorized | Permalink Bednet use September 10, 2008 (updated on: September 10, 2008) | by Elie In our analysis of bednet distribution programs, we considered the likelihood that a distributed bednet was ultimately used for its intended purpose: to protect against malaria. The Malaria Matters blog recently posted links to numerous examples of nets used for other purposes: Net stories include use for fishing in Zambia, as bridal veils in Zambia… Read More Posted in Uncategorized | Permalink List of interventions September 6, 2008 | by Holden The Disease Control Priorities report has a summary section (pg 60-85) listing interventions, along with cost-effectiveness estimates (in disability-adjusted life-years per US$) and some other basic info (target population, required infrastructure, etc.) We’ve created an Excel version of the list that we will be referring to in future posts: List of interventions from Disease Control… Read More Posted in Uncategorized | Permalink Malaria: Whom it affects and how Septem