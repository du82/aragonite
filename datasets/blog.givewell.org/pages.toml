full_description = "Surgeries performed vs. cases of blindness prevented January 30, 2009 (updated on: July 25, 2016) | by Elie We’ve written before about the possibility that surgeries to correct blindness are extremely cost effective. While summarizing the evidence of effectiveness for trachoma interventions, we’ve learned more and it’s clear that equating surgeries performed with cases of blindness prevented is plain wrong. I read Trachoma: an overview, a literature review of the evidence of effectiveness… Read More Posted in Impact evaluation, International charity | Permalink Publication bias: Over-reporting good news January 25, 2009 (updated on: July 26, 2016) | by Holden As we look for evidence-backed programs, a major problem we’re grappling with is publication bias – the tendency of both researchers and publishers to skew the evidence to the optimistic side, before it ever gets out in the open where we can look at it. It sounds too scary to be real – how can… Read More Posted in Impact evaluation | Permalink BBB standards: Accountability or technicalities? January 15, 2009 (updated on: September 2, 2016) | by Holden Yesterday we got an email from someone looking for help on where to give, noting that two of our top charities do not meet the Better Business Bureau (BBB)’s 20 standards for charity accountability. We believe that both of these organizations are reputable, accountable, and excellent, and were surprised to hear this. After checking out… Read More Posted in Partners in Health, PSI | Permalink Quick notes on our progress January 15, 2009 | by Holden A few updates for people interested in the nuts and bolts of GiveWell’s progress (some of these have been included in our email updates, but not yet flagged on our blog): We’ve recently (this week) updated our research agenda – see the updated agenda here. The William and Flora Hewlett Foundation awarded us $100,000 for… Read More Posted in Uncategorized | Permalink Beware just-published studies January 7, 2009 (updated on: August 25, 2011) | by Holden A recent study on health care in Ghana has been making the rounds – first on Megan McArdle’s blog and then on Marginal Revolution and Overcoming Bias. McArdle says the study shows “little relationship between consumption and health outcomes”; the other two title their posts “The marginal value of health care in Ghana: is it… Read More Posted in Impact evaluation | Permalink | 5 Comments"
