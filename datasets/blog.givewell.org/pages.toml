["https://blog.givewell.org/2007/09/27/my-personal-experience-with-diarrhea"]
title = "My personal experience with diarrhea - The GiveWell Blog"
description = "One of my pet peeves is when donors are determined to fight the diseases and conditions that have affected them personally. I know, this is a"
full_description = "My personal experience with diarrhea Previous Post Next Post September 27, 2007 | by Holden This post is more than 17 years oldOne of my pet peeves is when donors are determined to fight the diseases and conditions that have affected them personally. I know, this is a personal/philosophical decision, and a lot of people I respect will disagree with my take. This blog is personal and unfiltered, as you’ve been warned before. The Straw Man says, “I’ve had a loved one affected by cancer. I know how it feels, and that’s why I’m fighting cancer.” You know how what feels, Straw Man? Losing a loved one? Then why don’t you focus on that problem: try to get fewer people to lose their loved ones? How is losing a loved one to cancer different from losing a loved one to diarrhea? You know why you’ve never lost a loved one to diarrhea, and why I haven’t either? Because it’s easy to prevent death from diarrhea. Because it’s totally insane that anyone ever dies from diarrhea. The people you know are privileged, and would never in a million years be at risk from diarrhea. That’s why diarrhea has never “touched” you or me directly. It’s also the exact reason that fighting diarrhea is such a good use of money. Fighting diarrhea is simple and saves lives immediately. Nobody should be dying from it, anywhere, but they are – in large part because people who can help, people like you, aren’t around and haven’t seen them “up close,” and are focused on the specific, narrow kind of suffering you’ve seen, instead of on fighting human suffering as well as we can. Posted in Uncategorized | Permalink | 2 Comments Previous Post Next Post"
