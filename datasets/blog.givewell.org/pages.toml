["https://blog.givewell.org/2007/06/26/more-or-less-pie"]
title = "More or less pie? - The GiveWell Blog"
description = "An objection to our project that I get occasionally goes something like this: sure, it would be great if people really understood the complexities"
full_description = "More or less pie? Previous Post Next Post June 26, 2007 (updated on: October 10, 2008) | by Holden This post is more than 17 years oldAn objection to our project that I get occasionally goes something like this: sure, it would be great if people really understood the complexities involved in helping people and gave accordingly – but aren’t we worried that revealing these complexities will just make them want to give less? What happens when people learn that charity in Africa is more complicated than “5 cents saves a life,” that charity in the US is more complicated than “Check it out, an adorable child,” and finding a low Straw Ratio isn’t the same thing as finding the best use of your donation? Well, let’s break it down. If we succeed in creating a public dialogue about how best to help people, and a website where any donor can get a picture of what charities do and whether it works, there will be some ways in which this might make the pie bigger (more total giving) and others in which it might make the pie smaller (less). Pie bigger: some donors are too analytical for traditional fundraising to work on them; the only way they can have confidence in something is if they have real information. As I argued here, giving them that information is key to getting them to give. Pie bigger: some donors simply do not know where to start. That’s the boat I was in when I started GiveWell, and it took seconds to find like-minded people. As I argued here, there’s a world of difference between a resource that gives a “checkup” on thousands of charities and one that gives them a fully thought out decision to start playing with. Pie bigger: controversy and conflict aren’t always a bad thing. As I argued here, bringing out the complexity and difficulty of charity means turning it into something challenging and engaging, rather than sweet and boring. Pie smaller: some donors honestly believe that the charities they donate to – unlike every organization in the world – have never made a debatable choice or (heavens forbid) a mistake. As soon as they get wind, it’s less charity and bigger houses for them. Pie smaller: some donors don’t want to be bothered with the details. Giving them a lot of information will overwhelm them, and they’ll give up before they can ever get out their credit cards. So it could go either way, in theory. A couple things, though. First off, the balance is tilted quite a bit by the simple fact of life that people seek out what interests them. We all know how people behave when they don’t want to think too hard about their vote: they just vote, straight-ticket, and ignore all the debates and analysis going on around them. In the end, donors who either don’t recognize or don’t want to understand the complexity in charity will just ignore us, and listen to the fundraisers. That’s extremely easy to do – much easier than doing things our way. (If it ever isn’t, that means we must have gotten really big.) By the time someone reads our research, they’re already expressing (a) an active interest in giving (b) a willingness to put effort into understanding the whole story. It’s hard to do that while fitting the profile of someone who quits in the face of imperfection or complexity. Bottom line, it seems pretty farfetched to think that we’ll reach more people who don’t care about what we’re doing than people who do care. Secondly, it doesn’t just matter how big the pie is, it matters what’s in it. The donors we’re in danger of “pushing out” (again, I find it hard to believe they will even be aware of us) are the least intelligent and/or least engaged ones. The donations we’re in danger of eliminating are the ones that are floating about almost at random, to whatever charity says “We’re perfect” first. Meanwhile, the donors we hope to bring in are the ones who care enough to want to put in some extra time and figure out how to do as much good as possible. They’re the ones who can contribute to the dialogue, and they’ll probably be contributing more money as well. Contrary to what you may have heard, there are worse things than a smaller pie. Like a half-baked one. (To those of you who saw that ending coming 5 paragraphs ago, I apologize. The marketing dept made me do it.) Posted in Uncategorized | Permalink | 3 Comments Previous Post Next Post"
author = "Holden"
year_published = 2007
year_updated = 2008
