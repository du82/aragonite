full_description = "Welcome to your virtual site visit November 29, 2007 (updated on: November 30, 2007) | by Holden Monday I visited Year Up, our #1 ranked charity in the cause of employment assistance. Although they quite understandably declined my request to videotape the visit, I’m going to share as much of my impressions as I can here. Although I think informal/intuitive evidence is generally overrated (relative to facts about life outcomes), I do still think it’s valuable. Read More Posted in Uncategorized | Permalink | 6 Comments Cheap ways to save lives November 27, 2007 (updated on: November 28, 2007) | by Elie Our research for saving lives in Africa comes out soon. While we’ve mostly stuck to finding the best organization – rather than generalizing about “how to save lives” – we’ve formed a couple informal opinions along the way, and this seems like a good time to share. First off, I think bed nets are a… Read More Posted in Uncategorized | Permalink | 23 Comments Thanks November 22, 2007 (updated on: November 29, 2007) | by Holden Elie and I get all the headlines, and the ladies, but GiveWell is a lot more than the two of us. This seems like a good time to thank: Our donors, mostly former coworkers who believed in us and stepped up to make GiveWell possible, even when it was nothing but an idea. Now, of… Read More Posted in GiveWell project | Permalink | 1 Comment Must-read if you’re interested in NYC education November 21, 2007 (updated on: December 3, 2007) | by Holden Eduwonkette gives a clear examination of data that is generally anything but. This post is more about public policy than charity, but it shows – at a glance – a lot of the problems with the traditional approach to charity (giving as an act of the heart without the brain; trusting charities that mean well,… Read More Posted in Uncategorized | Permalink Here’s to fear of failure November 20, 2007 (updated on: November 27, 2007) | by Holden A favorite saying of foundation people is, “You can’t be afraid to fail. You have to be ready to take bold risks.” I’ve thought about it, and I think they’re going too easy on themselves. I put it to you: we need both funders of innovative projects and funders who focus on what already works…. Read More Posted in Uncategorized | Permalink | 7 Comments"
