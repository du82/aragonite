full_description = "Marketplace today December 10, 2008 (updated on: December 10, 2008) | by Holden I’ll be on NPR Marketplace today, talking about why we think you can do more good by putting time into researching your giving than into volunteering. Local air times/stations here. I expect the audio will be online afterward (at which point I’ll edit it into this post). Posted in Uncategorized | Permalink | 1 Comment The first question: What do you do? December 8, 2008 | by Holden The first question I have for any charity is, “What do you do?” Not “What are you trying to accomplish?” (example: “Fight AIDS”) but “What activities are you carrying out and where?” (example: “School-based education programs emphasizing protection in Mozambique”). It’s a simple question, and an obviously important one: as the Disease Control Priorities Report… Read More Posted in Uncategorized | Permalink | 2 Comments More on iodine December 5, 2008 | by Holden Nicholas Kristof chimes in. Our previous coverage here. Posted in Uncategorized | Permalink"
