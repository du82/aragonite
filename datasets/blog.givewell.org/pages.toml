title = "December 2009 - The GiveWell Blog"
full_description = "You can save a life December 31, 2009 (updated on: July 25, 2016) | by Holden We ask you, as a donor, to turn down some great pitches – “Your interest-free loan will help this person escape poverty forever,” “You can give a cow to a poor family for Christmas,” etc. – and give instead to charities that aren’t terribly good at storytelling. Why? It comes down to this. We think… Read More Posted in GiveWell Highlights, GiveWell's Philosophy, Personal giving vs. Impact-based giving, Why good giving is hard | Permalink | 1 Comment VillageReach December 30, 2009 (updated on: December 8, 2011) | by Holden VillageReach currently holds the top slot in our top charities list. While I will be donating to the Stop Tuberculosis partnership (discussed yesterday), Elie’s donation this year went to VillageReach. VillageReach consults on health system logistics in high-poverty, remote areas to help life-saving supplies get to those who need them. It may not be the… Read More Posted in International charity, New vs. proven charities, Top charities, VillageReach | Permalink | 3 Comments Stop Tuberculosis Partnership December 29, 2009 (updated on: December 8, 2011) | by Holden The Stop Tuberculosis Partnership is one of our top-rated charities and the one I will personally be giving to this year. Like most charities, the Stop Tuberculosis Partnership has an admirable goal. It uses donations to fund grants of tuberculosis drugs to governments, and also assists them with (and monitors their implementation of) the WHO-recommended… Read More Posted in Stop TB Partnership, Top charities, Tuberculosis Charity | Permalink | 2 Comments UPenn Center for High-Impact Philanthropy December 28, 2009 | by Holden Before giving season ends, we wanted to make sure to put in a good word for the UPenn Center for High-Impact Philanthropy (which we have mentioned before). We have carefully reviewed the Center’s reports on malaria and U.S. education, both of which overlap heavily with the research we have done. We consistently find their statements… Read More Posted in Uncategorized | Permalink | 1 Comment"
