["https://blog.givewell.org/2008/08/28/cost-effectiveness-is-in-the-eye-of-the-beholder"]
title = "Cost-effectiveness is in the eye of the beholder - The GiveWell Blog"
description = 'Broadly-speaking, we think of "cost-effectiveness" as referring to how much of value is accomplished for a given amount of money. If two interventions are'
full_description = "Cost-effectiveness is in the eye of the beholder Previous Post Next Post August 28, 2008 (updated on: September 11, 2008) | by Holden This post is more than 16 years oldBroadly-speaking, we think of “cost-effectiveness” as referring to how much of value is accomplished for a given amount of money. If two interventions are both proven and scalable to similar degrees, the more cost-effective one is a better investment because it allows the same donation to accomplish more of value. However, “value” means different things to different donors: to some, $200 to save a child’s life might be a great deal, while others may prefer $450 to repair a fistula. We prefer to leave major judgment calls to our donors when practical. This means that rather adopt a single definition of value (such as Disability-Adjusted Life-Years), we hope to find the most cost-effective interventions for several different definitions of value. We can’t cover every possible notion of what’s worth funding, but we hope to be of use to as many donors as possible within the cause of developing-world health (our current focus – we will be moving on to economic empowerment later). The following are several philosophical goals – i.e., definitions of what results make an intervention “valuable” – that we think will appeal to many donors. DALYs averted. Although it isn’t our favorite measure of value, the Disability-Adjusted Life-Year is a widely used metric that considers all forms of mortality and morbidity. Some donors may feel most comfortable aiming to avert as many DALYs as possible for their donation. Economic benefits. Health problems impose an economic burden, not just a moral one. There are sometimes attempts (such as the “benefit:cost ratio” used by the Copenhagen Consensus and some versions of the social return on investment metric) to combine economic and moral benefits into a single figure, measured in dollars. Life-years saved – for those who put a lot of weight on being alive vs. not alive (and less weight on quality of life). Interventions that focus on infant mortality are likely to be cost-effective in terms of saving life-years. Lives saved. Adult lives saved. It is common to value adult lives more than children’s lives. In addition, adults are more likely to have dependents, making their deaths arguably more tragic (in a way that DALYs could capture in theory, but that DALY estimates generally don’t capture in practice). Cases of extreme suffering prevented/rectified. This goal has several subcategories, for different conceptions of what constitutes extreme suffering. One that jumps to mind is fistula (and other deformities associated with ostracization). People brought to a normal standard of health and potential productivity. In some ways the opposite of the cause immediately above, in that it focuses on helping those with high potential rather than helping those with high need. (There are different places one could draw the line for “normal health and potential productivity” – is it enough to prevent/cure someone’s blindness, or is it also important that they be adequately nourished and have reasonable job opportunities?) Unwanted pregnancies averted / population growth slowed. Some donors might see births averted as a negative; others might feel that it is the key to better quality of life and sustainability. Some of these metrics are highly well-defined and relatively easy to find or form cost-effectiveness estimates on. Others are far less so. We aren’t necessarily going to be conducting a separate search on interventions for each, but we think it’s productive to get as many appealing “goals” on the table as possible before beginning to narrow down the programs we’re focusing on. We hope that we won’t leave out programs whose potential effects are highly appealing to a large/important set of donors, even if they fail a “cost-effectiveness test” based on other metrics. If you feel that we’re leaving out any important ones, please let us know. (We will also be consulting with our supporters and Advisory Board on this question.) Posted in Uncategorized | Permalink | 3 Comments Previous Post Next Post"
author = "Holden"
year_published = 2008
year_updated = 2008
