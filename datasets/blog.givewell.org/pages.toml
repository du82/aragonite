["https://blog.givewell.org/2007/05/23/dont-talk-to-me-about-the-form-990"]
title = "Don't talk to me about the Form 990 - The GiveWell Blog"
description = "I already knew the Form 990 was useless, but sheesh. Elie and I are currently going through 990s of hundreds of charities, trying to find the ones that"
full_description = "Don’t talk to me about the Form 990 Previous Post Next Post May 23, 2007 (updated on: May 23, 2007) | by Holden This post is more than 17 years oldI already knew the Form 990 was useless, but sheesh. Elie and I are currently going through 990s of hundreds of charities, trying to find the ones that might be eligible for Clear Fund grants – we’re currently working on the International category, looking for charities that work in Africa – and I can say that a solid 95% of the time, the 990s of these international charities (including the “Purpose” and “Program Accomplishments” fields) DO NOT SAY WHAT COUNTRIES THEY WORK IN. As a reminder, the Form 990 is the only information that is publicly available for every public charity. It is where everyone has referred us for “substantive information about charities.” It is the only piece of information used by most charity evaluators, including Charity Navigator. And not only won’t it tell you what a charity does, it won’t tell you where it does it. So please, don’t tell me to look at a Form 990 until you’ve looked at one yourself. Thanks. Posted in Uncategorized | Permalink | 1 Comment Previous Post Next Post"
