title = "December 2007 - Page 2 of 2 - The GiveWell Blog"
full_description = "The 2007 Holden Award for Excellence in Imperfection December 12, 2007 (updated on: July 25, 2016) | by Holden I am proud to announce the winner of the 2007 Holden Award for Excellence in Imperfection. This award has a rich history dating back to 3 minutes ago. The rules are as follows: The first charity to make a negative correction to its GiveWell review wins the award. Since we’ve published our review drafts, we’ve… Read More Posted in Uncategorized | Permalink | 3 Comments Getting the word out December 11, 2007 (updated on: December 11, 2007) | by Holden It’s been about 5 days since we released our Africa report, and now we’re trying to get the word out. Some stuff: This week’s Chronicle of Philanthropy features us, and in a true act of sadism puts me on the cover. Smart Money mentions us in an article on intelligent giving. On the other hand,… Read More Posted in GiveWell project | Permalink | 6 Comments 2 things WAY more exciting than a blog post December 6, 2007 | by Holden 1. Our research on saving lives in Africa is now public. 2. Online chat this coming Tuesday, via the Chronicle of Philanthropy, with a special guest who looks absolutely too good to miss. Please participate – I type 120wpm, I am beyond pumped to have an online chat with the nonprofit sector, I want to… Read More Posted in GiveWell project | Permalink | 5 Comments What a “life saved” means December 4, 2007 | by Holden The goal of Cause 1 is to save lives in Africa, and we estimate that a good strategy can save a human life for somewhere in the ballpark of $1000. Sounds like an unbelievable deal, right? Not to everyone. I was recently talking to a Board member and mentioned how much cheaper it seems to be to change/save lives in Africa vs. NYC. He responded, “Yeah, but what kind of life are you saving in Africa? Is that person just going to die of something else the next year?” I think it’s interesting how (a) completely fair, relevant and important this question is for a donor; (b) how rarely we see questions like this (“Sure I helped someone, but what kind of life did I enable?”) brought up and analyzed. Here’s what we know right now: Read More Posted in Uncategorized | Permalink | 8 Comments"
