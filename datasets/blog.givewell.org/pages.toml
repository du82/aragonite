["https://blog.givewell.org/2007/05/29/its-for-charity-but-is-it-for-a-good-cause"]
title = "It's for charity - but is it for a good cause? - The GiveWell Blog"
description = '''People can get away with some incredible things as soon as they say that what they're doing is "for charity." First among these, of course, are the tax'''
full_description = "It’s for charity – but is it for a good cause? Previous Post Next Post May 29, 2007 (updated on: May 29, 2007) | by Holden This post is more than 17 years oldPeople can get away with some incredible things as soon as they say that what they’re doing is “for charity.” First among these, of course, are the tax advantages that subsidize everything from helping the needy to fighting gun control, convincing people to eat beef, and stockpiling giant piles of cash for eternity. But it isn’t just the IRS that loses all ability to tell right from wrong as soon as the word “charity” comes up. It’s all of us. Except me. You may not attend a rock concert to benefit beef, but what about cancer research? How about humane societies? Of course, these two causes are in direct conflict over the question of animal testing – many humane societies put significant amounts of their resources directly into trying to illegalize the testing that other “charities” are busy funding. Charities oppose each other in more subtle ways as well. Going through all these 990s, I’ve really become aware of the huge presence among charities of political advocacy. It’s natural that charities find themselves wanting to address the “root causes” of the problems they address; but as soon as they do this, it’s no longer safe to say that their funds are “going to a good cause” without at least thinking twice. After all, if the legal changes they want to make were completely noncontroversial, you’d think they’d already be made. If you go to a concert to “fight global warming” or “save the environment,” your dollars aren’t going to feed cuddly bunnies; chances are, they’re going to lobbyists, advocates, even demonstrators, with the aim of putting laws in place that might be pro-environment or anti-business, depending on your point of view. And even if you’re on the pro-environment side, it’s worth considering that one of the biggest struggles in politics is not just for position, but for attention and prioritization. When it comes down to it, Greenpeace (saving the environment) and Oxfam (fighting poverty) are largely working against each other – trying to get legislators to pay attention to their issue rather than others. And at least as big as political advocacy, at least judging by charities’ mission statements, is “raising awareness.” Well, awareness is a zero-sum game too. People only have so much attention span available for things that aren’t sports and diets. You want to raise awareness for Darfur, for global warming, or for Lou Gehrig’s disease? “All of the above” isn’t necessarily an option. Tooling around through my recent Google alerts (“Charity”), I see a mind-boggling silence on these questions. Indeed, I see Barry Bonds being praised for “giv[ing] some of his own things to charity,” with no mention of what causes he’s supported. I see a whole article on celebrities’ support of charities for Mother’s Day, without the mention of a single charity beyond Eva Longoria’s personal foundation (not a word on that foundation’s priorities). I see plenty of debate on the recent “Idol Gives Back” campaign in terms of whether its “devotion to charity” makes up for its cheesiness … but my question is, what does the ONE campaign (one of its beneficiaries) mean when it talks about “call[ing] for debt cancellation, trade reform and anti–corruption measures”? That sounds like legal change – what does the campaign want and is it a good idea? Nobody else wants to know? It’s the same old problem: as soon as people hear the word “charity,” their critical faculties turn off. Of course, celebrities and athletes would love it to stay this way – the last thing they need is more questions, just when they’re trying to clean up their image by throwing a few bucks at 501c3’s. But the rest of us would do well to wake up. I’ve said it before and I’ll say it again: if you want to know if someone is doing good things, the best way is to look at what they’re doing. Posted in Uncategorized | Permalink | 3 Comments Previous Post Next Post"
author = "Holden"
year_published = 2007
year_updated = 2007
