g people is hard; it has inherent limits; it’s time-consuming; and it’s expensive. But it has to be done. The first reason is that no matter how much sense an idea makes in your head, translating it to reality is another matter. I’d argue that acceptance of this basic idea is the… Read More Posted in Uncategorized | Permalink | 2 Comments"
