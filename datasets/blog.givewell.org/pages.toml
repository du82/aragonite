full_description = "Preventing blindness July 21, 2008 (updated on: July 30, 2008) | by Elie Several people have recommended that we look at the Fred Hollows Foundation. We have been shown calculations implying that they are preventing or curing a person’s blindness for every $20-60 they spend. As we continue our research on developing-world aid, we checked them out a bit ourselves. The Fred Hollows Foundation’s programs include surgeries to… Read More Posted in Uncategorized | Permalink | 3 Comments Career Academies: An unconventional approach to education July 17, 2008 (updated on: July 26, 2016) | by Holden The Career Academies initiative recently released a report on academies’ impact on students eight years after graduation. I’m fascinated by this report and this initiative because: The Career Academies initiative rejects conventional wisdom about education. For much of my life I’ve assumed that learning math, reading, and other “liberal arts” related skills is the key… Read More Posted in Uncategorized | Permalink | 3 Comments Where to focus? July 11, 2008 | by Elie We haven’t seen – either in charities’ grant application materials or in our own independent research – much discussion of how organizations decide where to focus their resources. This question seems particularly important for international aid organizations, which often work in many regions all over the world (but by necessity have to ignore many more)…. Read More Posted in Uncategorized | Permalink Some qualitative information on microfinance July 5, 2008 (updated on: July 7, 2008) | by Holden I came across an interesting article on microfinance by Tyler Cowen. Like us, Cowen is skeptical about the common anecdotes focusing on the “entrepreneurial” aspect of microfinance: For better or worse, microborrowing often entails a kind of ­bait ­and ­switch. The borrower claims that the money is for a business, but uses it for other… Read More Posted in Uncategorized | Permalink | 4 Comments"
