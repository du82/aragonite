full_description = "Matrix reloaded September 20, 2007 (updated on: July 27, 2016) | by Elie We’re still right in the thick of things in Cause 1: we’ve received applications from about half our finalists and are still waiting on the other half. Two of those we received are causing me the most difficulty: Population Services International and UNICEF. PSI didn’t fill out our matrix, but it sent us their version…. Read More Posted in Uncategorized | Permalink | 1 Comment Great people September 18, 2007 (updated on: September 18, 2007) | by Holden I’ve been thinking a lot today about the idea of “investing in people.” We are pretty obsessed with finding charities that have good results, but many people (including our applicants, and including some of the friends I’m making overseas ), are urging me to put more focus on finding great people, and trusting them. Here’s… Read More Posted in Uncategorized | Permalink | 3 Comments No more Saturdays for me September 18, 2007 | by Holden I hereby decree a new publishing schedule. Major posts will be published on Tuesday and Thursday (including today and this Thursday). Posted in GiveWell project | Permalink Not everyone under-evaluates … September 18, 2007 | by Holden Fundraisers seem to do a phenomenal job. Somehow, you don’t see fundraisers making a lot of arguments that “Money spent on evaluation means less letters mailed out” or “Evaluation is difficult and you can never really isolate causality perfectly.” Instead, you see them testing. And testing. And testing. And learning things that are far from… Read More Posted in Uncategorized | Permalink Literature reviews September 17, 2007 | by Holden All I was trying to say in the last post could be summed up like this: This is an awesome literature review about early child care programs. It describes how the author found all the papers she discusses … it is totally straightforward about what the methodological strengths and weaknesses of each paper are …… Read More Posted in Un