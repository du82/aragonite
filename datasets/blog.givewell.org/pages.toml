full_description = "Hello, world Previous Post Next Post February 24, 2007 (updated on: March 24, 2007) | by Holden This post is more than 18 years oldOther charity bloggers have been noticing us, and there have been some good discussions going on about GiveWell in other places. There really should be a better system for blog-to-blog communication, such that you can see all the conversations relevant to your blog of choice just by reading that blog’s feed … this is what the trackback system is supposed to do, I think, but it doesn’t work. Internet entrepreneurs, you’re welcome for the business idea. In its absence, here’s a quick roundup. First off, the discussion over Network for Good’s processing fees caused a mini-stir. Some found our approach obnoxious and “suck[y].” Others defended us. Katya, of Network for Good, wraps up with her thoughts on dealing with customer complaints, which demonstrate an attitude we wish we saw more of. Then there are those who looked beyond the dispute to check out our actual project. Other bloggers are confirming what we suspected: that no one else seems to be doing what we’re doing. We had some discussion about why that is on the Tactical Philanthropy blog. Of course, we hope others will feel the same needs we do, and enter the ring to address them – though now that we’re rolling, I hope that anyone who wants to put their time into a project like this will find out about us and end up shooting me an email to make sure there’s no time wasted on outright duplication. Meanwhile, Lucy Bernholz, who seems to generate catchy phrases in her sleep, calls us “community-driven, transparent analysis for donors by donors.” I really hope she didn’t pull a Pat Riley and trademark that phrase – we may have to steal it. Posted in GiveWell project | Permalink | 6 Comments Previous Post Next Post"
