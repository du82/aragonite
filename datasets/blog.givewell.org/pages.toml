few odds and ends: At our Board meeting on Tuesday the 4th, we officially named our grantees in Causes 3 (Nurse-Family Partnership) and Cause 4 (KIPP). We think both are excellent options for donors. Our writeups on these… Read More Posted in GiveWell project, Uncategorized | Permalink | 1 Comment"
