["https://blog.givewell.org/2007/04/17/spending-the-better-half"]
title = "Spending the better half - The GiveWell Blog"
description = "Our fundraising efforts have started, and dang, do I hate asking for money. For three years, I've had way more income than I can spend, and I've rarely"
full_description = "Spending the better half Previous Post Next Post April 17, 2007 (updated on: April 18, 2007) | by Holden This post is more than 17 years oldOur fundraising efforts have started, and dang, do I hate asking for money. For three years, I’ve had way more income than I can spend, and I’ve rarely had to ask anyone for anything. That’s a nice position to be in. This – especially for an abrasive guy like me – is tough. A common saying in the world of charity is: “Spend the first half of your life making money, and the second half giving it away.” As it’s become clear that GiveWell needs to be a full-time project, this saying has popped into my head a lot, and never more than now. Why not put off helping others until I’ve given myself more help than I can possibly use? Why not stay in finance, which I like fine, until I’ve accumulated such a massive fortune that I can finance GiveWell all by myself? In exchange for letting the world wait a decade or two, I’d gain the freedom to do this project my way and only my way. I wouldn’t need a business plan and an elevator pitch and the incredible amount of work that goes between thinking and communicating. I wouldn’t need to fundraise; I wouldn’t need friends and allies; I wouldn’t need favors; I wouldn’t need anyone’s approval or permission. And so, I’d do a much worse job. Not even my incredible brain can look at things from as many angles as a roomful of different people; not even my awe-inspiring self-discipline will make me consider those angles as sincerely and thoughtfully as I do when I have to. If I can’t make GiveWell speak to people enough for them to put their money behind it, it will go nowhere. And if I do make it speak to them but I can’t follow through, I’ll be humiliated and devastated in a way that wasting spare cash of my own could never make me. These are the pressures that startups face, and the world is a better place because of it. That’s why you should be concerned that philanthropy is currently seen as something to do with the “second half” of your life. “Second half” here isn’t just chronological – it’s referring to the half that specifically isn’t where the philanthropist made their name. The second half is the half that lacks risk, accountability, and the people who keep one honest (a set of factors collectively known as the “eye of the tiger”). All the great foundations today are following the orders of people who’ve made their fortune doing something else, and who no longer have to consider any criticism they don’t care for. I have to believe that matters, no matter how good their intentions. The first half of life is where people do great things or fall by the wayside. I want to spend that half “giving it away,” and if you’re a donor or just a supporter, you should be glad that’s the half you’re getting. Posted in GiveWell project | Permalink | 2 Comments Previous Post Next Post"
