["https://blog.givewell.org/2007/09/30/job-training-which-would-you-grant"]
title = "Job training: Which would you grant? - The GiveWell Blog"
description = "A couple questions for you. I think Cause 5 is going to come down to these questions. 1. Would you rather grant ... A. A program that helps severely"
full_description = "Job training: Which would you grant? Previous Post Next Post September 30, 2007 (updated on: July 26, 2016) | by Holden This post is more than 17 years oldA couple questions for you. I think Cause 5 is going to come down to these questions. 1. Would you rather grant … A. A program that helps severely unemployed/undermployed people, with barriers to employment including past convictions & drug abuse, get jobs paying $8-12/hr with no clear career path, such as security guard / nurse’s aid / administrative assistant, or B. A program that helps already-employed people go from their $8-12/hr jobs to jobs starting around $30k/yr with a clear path to at least ~$40k? 2. Would you rather grant … A. A program that takes a general-interest population and gets them into relatively white-collar-ish jobs (administrative assistant on the low end; computer support specialist on the high end), at great cost? B. A program that takes people who are already interested in and capable of a particular, narrower, more “blue-collar” career (nurse’s aid; environmental resource technician; truck driver), spending far less to get them into these (equally well-paying) jobs because it’s primarily about getting them certified? For (1), we need to know more about the connection between income and living standards in NYC … I personally feel like $8-12/hr does not count as “self-supporting,” especially when supporting a family is an issue, and so I’m leaning toward (B). For (2), I feel that as long as there are still more people who want help than there are funds to help them, we should help the “low-hanging fruit” first: the people who just need a certification to get the job they want. So, that’s (B) as well. What do you think? Posted in Uncategorized | Permalink | 12 Comments Previous Post Next Post"
