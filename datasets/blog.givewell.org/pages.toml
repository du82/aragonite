["https://blog.givewell.org/2008/06/27/the-biggest-giver-individuals"]
title = "The biggest giver: Individuals - The GiveWell Blog"
description = "This week, Giving USA released their 2007 estimate of U.S. charitable giving. Its data forms one of our favorite figures, and one of the biggest factors"
full_description = "The biggest giver: Individuals Previous Post Next Post June 27, 2008 (updated on: July 26, 2016) | by Elie This post is more than 16 years old This week, Giving USA released their 2007 estimate of U.S. charitable giving. Its data forms one of our favorite figures, and one of the biggest factors behind our decision to start GiveWell. Taken together, individuals account for 75% of total US giving; that’s 6x as much as all foundations combined. (In fact, it makes more sense to count “Bequests” as individuals, and many “Foundations” are in fact family foundations that have little to no staff, and have a similar lack of access to the information they need.) When I talk about this chart, many ask: “Sure, individual donors give a lot, but doesn’t most of it go to religious institutions and universities? Is it really going to the types of charities GiveWell focuses on: humanitarian organizations focused on providing for people’s needs?” A paper released last year by The Center on Philanthropy at Indiana University examines precisely that question, using survey data to estimate how much giving is “focused on the needs of the poor” (including an estimate for how much of the money given to “multipurpose organizations,” including churches, has this focus). Note that this report gives a higher total for individual giving than Giving USA, possibly because it is from reported data rather than IRS data, and may therefore include gifts that weren’t taken as deductions. The researchers found that: When summed, the giving to help meet basic needs and other estimated giving that is focused on the poor come to $77.30 billion, or about 30.6 percent of total estimated household contributions of $252.55. However you slice it, individual donors are the largest philanthropist in the United States. Posted in GiveWell project, Uncategorized | Permalink | 4 Comments Previous Post Next Post"
