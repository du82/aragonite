full_description = "Eat your salt September 26, 2008 | by Holden Iodine deficiency has been linked with child mortality as well as permanent cognitive debilitation. Some references are on page 25 of the 2004 Copenhagen Consensus report on malnutrition; a WHO report paints a more vivid qualitative picture (page 6): In areas of iodine deficiency, where thyroid hormone levels are low, brain development is impaired. In… Read More Posted in Uncategorized | Permalink Transparency done right September 26, 2008 | by Holden We were referred to the Against Malaria Foundation today. It’s the most transparent developing-world aid organization we’ve seen to date. AMF grants funds to NGOs that distribute insecticide-treated nets (ITNs) to fight malaria. ITN distribution is a well-established method for saving lives and lowering the burden of malaria (see the “Insecticide-treated nets” section of the… Read More Posted in Uncategorized | Permalink | 1 Comment Our Google talk September 22, 2008 | by Holden We spoke at Google (Mountain View office) on Wednesday. Elie discussed our project and its history, and I presented our chief research findings from year 1. Posted in GiveWell project | Permalink | 2 Comments Back Monday September 18, 2008 | by Holden We’re on a pledge-raising trip in CA, and our schedule has been tighter than anticipated. We’ll be back on the blog Monday. Posted in GiveWell project | Permalink Priority region 1 – finalists September 12, 2008 (updated on: September 14, 2008) | by Elie In addition to choosing straightforward, cost-effective program-based interventions, we’re also planning to identify two regions to study in detail. I’ve focused on finding priority region 1: an area that has both high and drastic disease burdens and relatively stable, low-corruption environments in which aid can likely be productive. This post details the criteria I used… Read More Posted in Uncategorized | Permalink Research agenda September 11, 2008 (updated on: September 2, 2016)