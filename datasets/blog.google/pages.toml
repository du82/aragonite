["https://blog.google/outreach-initiatives/arts-culture/delve-into-90-years-of-british-architectural-history-with-google-arts-culture"]
title = "Delve into 90 years of British architectural history with Google Arts & Culture"
description = "As the Royal Institute of British Architects (RIBA) celebrates the 90th anniversary of our home at 66 Portland Place in London, a building specifically designed to house our world-leading architectural collection, which we&#x27;re looking forward to sharing with a wider audience through our collaboration with Google Arts &amp; Culture66 Portland Place first opened its doors in 1934, a time when the modern architectural profession was taking shape. This anniversary offers a wonderful opportunity to not only celebrate this incredible building but also delve deeper into the stories held within our collection and archives.To mark the anniversary, we are deepening our strong partnership with Google Arts &amp; Culture, which began in 2021. Today, we are publishing 10 new digital stories and newly captured Street View imagery of 66 Portland Place on the RIBA collection on Google Arts &amp; Culture, for everyone to explore."
full_description = '''Breadcrumb Outreach and Initiatives Arts & Culture Delve into 90 years of British architectural history with Google Arts & Culture Nov 08, 2024 · [[read-time]] min read Share Twitter Facebook LinkedIn Mail Copy link Explore RIBA's online collection with Google Arts & Culture, featuring new virtual tours and stories. Muyiwa Oki President RIBA Share Twitter Facebook LinkedIn Mail Copy link Entrance of 66 Portland Place As the Royal Institute of British Architects (RIBA) celebrates the 90th anniversary of our home at 66 Portland Place in London, a building specifically designed to house our world-leading architectural collection, which we're looking forward to sharing with a wider audience through our collaboration with Google Arts & Culture66 Portland Place first opened its doors in 1934, a time when the modern architectural profession was taking shape. This anniversary offers a wonderful opportunity to not only celebrate this incredible building but also delve deeper into the stories held within our collection and archives.To mark the anniversary, we are deepening our strong partnership with Google Arts & Culture, which began in 2021. Today, we are publishing 10 new digital stories and newly captured Street View imagery of 66 Portland Place on the RIBA collection on Google Arts & Culture, for everyone to explore. { "previous": "Previous", "next": "Next" } Drawing for the RIBA Library at 66 Portland PlaceArtist: Miriam Wornum and Architects: George Grey Wornum and Miriam Wornum, 1934 The Henry Florence Memorial HallArchitect: George Grey Wornum (1888-1957) and Photographer: Dell & Wainwright 1934 Friends of RIBA tour of 66 Portland PlacePhotographer: Rachel Manns Detail of the bronze decoration of the main entrance doorsArchitect: George Grey Wornum (1888-1957), Artist: James Woodford, 1934 The newly released Street View imagery lets you explore the building's grand spaces, including Raymond McGrath’s engraved terrace doors or the Art Deco details of Florence Hall. This virtual tour offers a unique opportunity to experience the architectural details and historical significance of 66 Portland Place, especially as it prepares for closure and refurbishment in 2025.Two curated stories put the building's spaces in context. RIBA HQ - 66 Portland Place invites you to learn about the history and making of 66 Portland Place and see the most important decorative features while unpacking their symbolism. Imperialism and Empire at 66 Portland Place looks at RIBA’s headquarters’ colonial heritage and the Imperial iconography found around the building. It features the exhibition "Raise the Roof: Building for Change" which we hosted earlier this year, and which sparks crucial conversations about the imperial and colonial narratives embedded within our headquarters. { "previous": "Previous", "next": "Next" } Carnival of Portland PlaceArtist: Arinjoy Sen, Photographer: Agnese Sanvito 2024 Screen on the 'disappearing wall' of the Henry Jarvis Memorial Hall, Royal Institute of British Architects, 66 Portland Place, LondonArchitect: George Grey Wornum (1888-1957), Artist: Edward Bainbridge Copnall, Photographer: Christopher Hope Fitch 2021 Dominion Screen, Henry Florence Memorial HallArchitect: George Grey Wornum (1888-1957), Artist: Denis Dunlop (1892-1959), Photographer: Christopher Hope-Fitch 2021 Assembly and the Dominion ScreenArchitect: Giles Tettey Nartey and Photographer: Andy Stagg 2024 RIBA’s latest digital stories also delve into the richness of architectural history and the human narratives that have shaped and been shaped by it, from the role of women in British architecture and how architectural spaces have shaped LGBTQ+ identities to the impact of colour on design. { "previous": "Previous", "next": "Next" } Chichu Art Museum, NaoshimaJames Turrell 2019 Eames HousePhotographer: Luis Renau, 1980 Contact sheet of Cathedral of Santa Maria del Fiore (Duomo) and the Piazza della Signoria, FlorenceCreator: Architect: Filippo Brunelleschi (1377-1446); Arnoifo di Cambio (c.1240-c.1302), Photographer: Edwin Smith 1963 Walden 7 housing, Sant Just Desvern, BarcelonaArchitect: Ricardo Bofill and Photographer: Anna Dziubinska 2017 We're committed to championing better buildings, stronger communities and a sustainable environment, and that includes ensuring a more inclusive and representative understanding of architectural history. By embracing digital innovation and diverse storytelling, RIBA is reimagining how we understand and engage with the built environment, both past and present.I invite you to explore the new stories and full collection at g.co/RIBA. POSTED IN: Arts & Culture UK'''
year_published = 2024
year_updated = 2024
