["https://blog.google/around-the-globe/google-asia/how-were-helping-singaporeans-manage-chronic-diseases"]
title = "How we’re helping Singaporeans manage chronic diseases"
description = "Like many nations, Singapore faces rising rates of chronic diseases like hypertension and hyperlipidemia — as well as an aging population that increases pressures on the healthcare system.Last year, Singapore’s Ministry of Health introduced Healthier SG, a national initiative focused on preventive healthcare to tackle these challenges. The enrolment program encourages proactive preventive care, by anchoring Singapore residents with a family doctor, to co-develop a personalized health plan and take active steps to address potential health risks.Partnering closely with local healthcare institutions, Google Singapore is leaning in to complement the Healthier SG ambition through two preventive programs and a research health initiative through AI and digital health tools to help manage chronic disease risks.Managing chronic conditions"
full_description = "Breadcrumb Around the Globe Google in Asia How we’re helping Singaporeans manage chronic diseases [[read-time]] min read Share Twitter Facebook LinkedIn Mail Copy link Amy McDonough Managing Director, Strategic Health Solutions at Google Health Share Twitter Facebook LinkedIn Mail Copy link Like many nations, Singapore faces rising rates of chronic diseases like hypertension and hyperlipidemia — as well as an aging population that increases pressures on the healthcare system.Last year, Singapore’s Ministry of Health introduced Healthier SG, a national initiative focused on preventive healthcare to tackle these challenges. The enrolment program encourages proactive preventive care, by anchoring Singapore residents with a family doctor, to co-develop a personalized health plan and take active steps to address potential health risks.Partnering closely with local healthcare institutions, Google Singapore is leaning in to complement the Healthier SG ambition through two preventive programs and a research health initiative through AI and digital health tools to help manage chronic disease risks.Managing chronic conditions Patients get a Wellness Score on the HealthTrack SG app that gives them an indication of their wellness, the areas they have done well, and areas that need improvement. Hypertension (high blood pressure), hyperlipidemia (high cholesterol) and diabetes are serious health concerns affecting many Singaporeans. In fact, in 2022 the prevalence of chronic conditions in local residents from 18 to 74 years of age was 37% for hypertension, 32% for hyperlipidemia, and 8.5% for diabetes. If left unmanaged, these conditions can lead to severe health conditions.HealthTrack SG is a year-long pilot program by Google and the Health Promotion Board — one of the two preventive health programs that Google is supporting. It’s been designed to help people take control of their health by exploring how lifestyle changes can lead to better management of these conditions.Developed in collaboration with ConnectedLife and delivered by Fullerton Health, HealthTrack SG combines technology with expert healthcare delivery. Patients will use Fitbit devices to track important health information like step count, activity levels and sleep quality. This information, along with clinical data like blood pressure, is displayed in the HealthTrack SG app to give patients a holistic view of their health and highlight areas where they are doing well, and where they can make improvements.Doctors from Fullerton Health also have access to this information through an online dashboard, giving them a consolidated view of their patients' clinical progress against any lifestyle changes they had prescribed. This way, they can co-create and adjust personalized care plans with specific lifestyle recommendations with the patients.By analyzing patient profiles, the app will provide tailored support through helpful behavioral nudges and tips, which may include specific educational videos from YouTube Health on topics like making healthier food choices, encouraging positive lifestyle changes. For future phases of the collaboration, we plan to explore the potential of an AI-enhanced tool for a more personalized experience, such as the integration of Gemini models to automatically adjust lifestyle recommendations based on the patient’s progress.HealthTrack SG is designed with user privacy and data security in mind. Patients’ data is processed securely to ensure confidentiality, and is not stored or used for training other models. We prioritize user consent and adhere to strict data privacy practices to safeguard patients' information.Recruitment of patients for HealthTrack SG is planned for the first half of 2025, and eligible patients will be part of this pilot for a year to monitor their lifestyle habits. In addition to HealthTrack SG, Google is also supporting HPB’s DigiCoach program: a 12-week digital health program designed by Health2Sync and Abbott to help people manage their glucose levels through lifestyle changes.By integrating physical activity data from Fitbit devices and glucose levels through continuous glucose monitoring sensors, DigiCoach provides customized health advice to help participants form healthier habits — whether it’s changing diets or exercising more. Interested individuals can now sign up for DigiCoach.Shaping Singapore’s approach to health coachingGoogle and ConnectedLife are also supporting a research initiative, ACTIVATION, led by Alexandra Hospital (AH) and National University Polyclinics (NUP).This aims to engage 1,700 participants to explore the effectiveness of digital health interventions, including wearables and digital coaching, in encouraging healthier habits and managing chronic conditions. The research initiative will provide insights on how technology can be utilized and integrated to improve the health outcomes of Singaporeans at the population level, and support the enhancements of models of care.We hope to one day help every Singaporean take control of their health, and support the organizations that are bringing that goal to life. Together, we can create a healthier future for everyone. POSTED IN: Google in Asia Health"
year_published = 2024
year_updated = 2024
