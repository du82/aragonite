["https://blog.google/around-the-globe/google-latin-america/google-for-mexico-2024"]
title = "Google for Mexico 2024: Economic progress, driven by AI"
description = "At our annual Google for Mexico event, we showcased how we’re supporting economic growth in Mexico."
full_description = "Breadcrumb Around the Globe Google in Latin America Google for Mexico 2024: Economic progress, driven by AI Sep 10, 2024 · [[read-time]] min read Share Twitter Facebook LinkedIn Mail Copy link At our annual Google for Mexico event, we showcased how we’re supporting economic growth in Mexico, using technology to address countrywide challenges and training Mexicans in digital skills for the AI era. Julian Coulter Country Director, Google Mexico Read AI-generated summary General summary Google is making significant progress in Mexico by utilizing AI to enhance people's daily lives, support businesses, and drive economic growth. The company's latest Economic Impact Report reveals that Google products and platforms contributed over 278 billion Mexican pesos to the economy in 2023. Google is also investing in digital skills training, with plans to provide 90,000 new scholarships for free online education. Additionally, Google.org is supporting the development of an AI-powered platform for sustainable water management, addressing water scarcity challenges in Mexico. To protect user privacy, Google is launching Privacy in Results about you, allowing individuals to request the removal of personal contact information from search results. Summaries were generated by Google AI. Generative AI is experimental. Basic explainer Google is working to make AI helpful for everyone in Mexico. They're using AI to make people's lives easier, support businesses, and drive economic growth. They're also providing digital skills training and scholarships, and supporting AI research to address challenges like water scarcity. Google is committed to protecting people's privacy online and supporting the community. Summaries were generated by Google AI. Generative AI is experimental. Explore other styles: General summary Basic explainer Share Twitter Facebook LinkedIn Mail Copy link As we approach two decades of Google in Mexico, we're proud of what we've achieved so far. But we're even more excited about what the future can bring. At Google for Mexico today, we took a look toward that future, as we work to make AI helpful for everyone in Mexico. Here’s a look at how we’re using technology like AI to make people’s daily lives easier, support businesses of all sizes and ultimately drive economic growth.Support for economic progressOur latest Economic Impact Report for Mexico shows that Google is an economic engine for businesses, both small and large.In 2023, Google products and platforms like Search, Ads, AdSense, Play, YouTube and Google Cloud injected more than 278 billion Mexican pesos into the Mexican economy. That's not just an abstract figure: It represents real opportunities, real jobs and real livelihoods. Our Android app ecosystem alone supports 170,800 jobs, which is a testament to the vibrant entrepreneurial spirit in Mexico that we are supporting.Digital skills for the AI eraSince 2019, we have already trained over 26,000 people in digital skills through Google Career Certificates and, today, we are announcing 90,000 new scholarships for free online education in Mexico.We're also bringing solutions to Mexico like Gemini Education and Generative AI for Educators, a free course developed by Google in collaboration with MIT RAISE (Responsible AI for Social Empowerment) and Education. This course is designed for teachers of all disciplines who wish to incorporate Generative AI into their daily tasks.AI to address our biggest challengesWe also believe AI can help us make significant progress in tackling so many of the challenges we face as a society. Water scarcity is a real problem in many areas of Mexico today, and we want to do our part to help find a solution. Google.org, our philanthropic arm, is supporting the International Water Management Institute, with $1.5 million in funding to develop an AI-powered platform for sustainable water management. The use of AI and data analytics will address data gaps in Mexico’s national assessments of water to maximize water management and thus increase water resiliency. The AI-enabled dashboard will centralize data from various sources and provide real-time insights.More control over your information As part of our ongoing commitment to help protect people online, we're launching Privacy in Results about you in Mexico. This tool helps people request the removal of search results containing their personal contact information, like home address, phone number or email address, right from the Google app or Search.If web results containing your contact information are found, they will appear on a dashboard, and you can quickly request their removal from Google. Results about you also helps you keep track of your personal information by notifying you if new results containing your contact info pop up in Search.Support for our communityThe story of Google in Mexico is a story of collaboration, progress and shared aspirations. We are not just a technology company; we are part of the community, committed to the success of the country. We look forward to continuing to build that success together. POSTED IN: Google in Latin America"
year_published = 2024
year_updated = 2024
