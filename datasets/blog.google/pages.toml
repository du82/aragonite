["https://blog.google/inside-google/doodles/doodle-for-google-winner-2024"]
title = "Doodle for Google announces 2024 contest winner"
description = "Today we’re announcing the 2024 Doodle for Google national winner."
full_description = '''Breadcrumb Inside Google Doodles Maisie from Washington, D.C. is our 2024 Doodle for Google winner Jun 26, 2024 · [[read-time]] min read Share Twitter Facebook LinkedIn Mail Copy link Washington, D.C. high school senior Maisie Derlega shares more about the inspiration behind her winning Doodle and her wish for the next 25 years. Selly Sallah Brand Studio Read AI-generated summary General summary Maisie Derlega from Washington, D.C. won the 2024 Doodle for Google contest with her artwork titled "Family Dinner." Her Doodle depicts friends and family gathered around a table sharing a meal, representing her wish to continue the tradition of Sunday dinners with her community. Maisie's win is a testament to her artistic talent and her passion for using art to tell stories. Summaries were generated by Google AI. Generative AI is experimental. Bullet points Google Doodle contest winner announced: Maisie Derlega from Washington, D.C. Maisie's Doodle, "Family Dinner," depicts friends and family sharing a meal. Maisie's wish for the next 25 years is to continue the tradition of Sunday dinners with her community. Maisie is going to the University of Michigan to study Art & Design next year. Maisie's Doodle is on the Google homepage today. Summaries were generated by Google AI. Generative AI is experimental. Basic explainer Maisie from Washington, D.C. won the 2024 Doodle for Google contest. Her Doodle, "Family Dinner," shows people sharing a meal together. She wants to keep having Sunday dinners with her family and friends. Maisie is going to study Art & Design at the University of Michigan next year. Summaries were generated by Google AI. Generative AI is experimental. Shakespeare-ish In art's grand stage, a contest did unfold, Where youthful minds their dreams and wishes told. Maisie, from D.C., her talent took flight, With Doodle's win, her vision shines so bright. "Family Dinner," a scene of love and cheer, A wish to keep traditions ever near. Through art's embrace, her message gently weaves, A bond that time nor distance can ever cleave. From humble start to triumph's glorious height, Maisie's journey fills our hearts with delight. In Google's realm, her Doodle takes its place, A testament to creativity's grace. Summaries were generated by Google AI. Generative AI is experimental. Explore other styles: General summary Bullet points Basic explainer Shakespeare-ish Share Twitter Facebook LinkedIn Mail Copy link For this year’s Doodle for Google contest, we continued the celebrations for Google’s 25th birthday. K-12 students across the U.S. submitted artwork based on the prompt, “My wish for the next 25 years…” From tens of thousands of creative submissions, we selected the 55 state and territory winners and five national finalists. Now, we’re announcing this year’s contest winner: Congratulations to high school senior Maisie Derlega from Washington, D.C.!Maisie’s Doodle, “Family Dinner,” is on the Google homepage today. Her Doodle — depicting friends and family gathered around a table sharing a meal — represents her wish to continue the tradition of Sunday dinners with her community.We chatted with Maisie to learn more about her artistic background and the inspiration behind her Doodle: How did you start making art?I have been drawing for as long as I can remember. I’ve always loved creating things and telling stories through my art. For years I have taken art classes and had support from my family and teachers to help me grow as an artist. From picture books to graphic novels, my life has always been surrounded by art.Why did you enter the Doodle for Google contest?I have always loved the Google homepage art, it feels like such an amazing way to highlight both important events and different artists. When I found out about the contest a few years ago, it stayed on my radar and last year I meant to enter, but I missed the deadline. This year I stayed on top of it and started working on the piece the second the theme came out. It is an artist’s dream to have their art seen. And this contest gives a once-in-a-lifetime opportunity to have your art on the Google homepage like all of those artists I have seen throughout the years.What was the inspiration behind your wish for the future in your Doodle?I am going to the University of Michigan to study Art & Design next year, and it feels like my entire life is changing. My inspiration behind my wish for the future in my Doodle comes from trying to keep the things that are important to me constant.Why is your wish important to you?I love my family and friends, and our family dinner routine has emerged as something I look forward to every week. My dad is a chef, and so food and dinner tables have always been a safe space for bonding with the people who are important to me. I have so much I wish for in the future but I wanted my wish to be something I have the power to control. It is up to me to keep these people close and I will.How does it feel to be the contest winner?It feels like such a dream, I can’t even believe it. I entered the competition thinking I had next to no chance of winning, so making it to this point is a huge honor. It also feels like all of my years of developing my art is starting to pay off. I’m really proud and humbled.Congratulations again to Maisie! For more updates on all things Doodles, visit Doodles.google. POSTED IN: Doodles Search'''
