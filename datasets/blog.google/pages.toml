["https://blog.google/outreach-initiatives/grow-with-google/a-new-experiment-to-help-people-explore-more-career-possibilities"]
title = "Explore new career possibilities with Career Dreamer"
description = "Career Dreamer is a new experiment from Grow with Google that uses AI to make career exploration easier and more personalized."
full_description = "Breadcrumb Outreach and Initiatives Grow with Google A new experiment to help people explore more career possibilities Feb 19, 2025 · [[read-time]] min read Share Twitter Facebook LinkedIn Mail Copy link Career Dreamer is a new experiment from Grow with Google that uses AI to make career exploration easier and more personalized. Lisa Gevelber Founder, Grow with Google Read AI-generated summary General summary Google has launched a new tool called Career Dreamer to help people explore career possibilities. This AI-powered tool analyzes your background, skills, and interests to identify potential career paths and provide resources like Google Career Certificates. Career Dreamer helps you craft a professional story, explore career options, and even start drafting a cover letter. Summaries were generated by Google AI. Generative AI is experimental. Bullet points Google's new Career Dreamer tool helps people explore career possibilities. Career Dreamer uses AI to connect your experiences, skills, and interests to potential careers. It helps you identify your skills, craft a career story, and explore potential career paths. Career Dreamer can even help you find training resources like Google Career Certificates. Try Career Dreamer and let Google know what you think at grow.google/careerdreamer. Summaries were generated by Google AI. Generative AI is experimental. Explore other styles: General summary Bullet points Share Twitter Facebook LinkedIn Mail Copy link Updated February 19, 2025 5:12 pm ETAfter spending 20 years as a stay-at-home mom, military spouse Claire Thorn knew she wanted to prepare herself for a new career. She completed a Google Career Certificate in digital marketing and E-commerce. The course provided a strong foundation, but she still faced difficulties navigating the job search process.Then Claire became an early tester of a new, experimental tool from Google called Career Dreamer. She answered a few simple prompts about her background and interests, and Career Dreamer showed her how her life experiences could translate into skills and new career opportunities.Claire says “(Career Dreamer) helped identify skills that I take for granted and showed me that they’re important and useful in the workforce. Now, I’m armed with the confidence of knowing that I already possess exactly what employers need.”Today we're making this experiment available at grow.google/careerdreamer to make career exploration a little bit easier for everyone.Navigating a skills-based workforceThe World Economic Forum reports that workers typically hold an average of 12 different jobs throughout their lifetime, with Gen Z expected to hold 18 jobs across 6 different careers.And the less traditional your career path is, the harder it can be to frame your previous experiences into one cohesive narrative, or to understand what careers align with your particular skills and strengths. However, understanding the skills you already possess and learning how to articulate them effectively is incredibly valuable. It helps job candidates showcase their relevant experience to employers and can help open doors to fulfilling new roles. This is where Career Dreamer can help.Connecting the dots with Career DreamerCareer Dreamer uses AI to find patterns and connect the dots between your unique experiences, educational background, skills and interests. Think of it like a helping hand to bridge where you’ve been and imagine where you could go next.It helps you to quickly identify your unique skills and talents and how to talk about them, and connects you with careers (based on job market data from Lightcast and the Bureau of Labor Statistics) that might be a good fit. It can even help you discover training resources like Google Career Certificates and Google Cloud Skills Boost.With Career Dreamer, you can:Shape your professional story. Craft a Career Identity Statement that showcases the value you bring to the workforce, which you can add to your resume or professional profile and use as talking points during an interview. Explore career possibilities. Uncover a variety of careers that might align with your unique background, delve deeper into those that interest you, and find relevant jobs near you. Take the next step. Collaborate with Gemini, your AI assistant from Google, to start drafting a cover letter, refine your resume, spark new ideas for potential careers, and more. Getting startedWe hope Career Dreamer can be helpful to all kinds of job seekers. During its development, we consulted organizations that serve a wide range of individuals, such as students navigating their first careers, recent graduates entering the workforce, adult learners seeking new opportunities, and the military community, including transitioning service members, military spouses and veterans.If you’re ready for a career change, or just wondering what’s out there, try Career Dreamer and let us know what you think. You can learn more or get started at grow.google/careerdreamer. POSTED IN: Grow with Google"
