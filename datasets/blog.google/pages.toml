["https://blog.google/around-the-globe/google-europe/shaping-a-better-future-with-ai-literacy-during-europe-code-week"]
title = "Shaping a better future with AI Literacy during Europe Code Week"
description = "Google is working to empower young people during Europe Code Week."
full_description = "Breadcrumb Around the Globe Google in Europe Shaping a better future with AI Literacy during Europe Code Week Oct 15, 2024 · [[read-time]] min read Share Twitter Facebook LinkedIn Mail Copy link Working with Women Techmakers to equip young people with AI Literacy to navigate and thrive in a technology-driven future. Matt Brittin President, Google Europe, Middle East and Africa Share Twitter Facebook LinkedIn Mail Copy link AI is quickly transforming our world, introducing new opportunities and challenges across almost every industry. To ensure a future where everyone benefits from this powerful technology, we must work collectively to equip the next generation with the knowledge and skills needed to navigate it.Empowering young people through Europe Code WeekEurope Code Week has been promoting digital literacy and sparking interest in technology among young people since 2014. In 2021 alone, over 4 million people from 80+ countries participated and nearly half of them were young women, highlighting the importance of fostering an inclusive environment within the tech industry.2024’s upcoming Europe Code Week will continue this very important work, encouraging creativity and problem-solving through coding and computer science. Taking place from 14th to 27th October, this fun and engaging introduction to the digital world aims to help young people make sense of the rapidly changing world and explore new ideas.Leading the change with Women Techmakers in 2024Google has proudly participated in Europe Code Week since 2015, actively supporting initiatives that cultivate digital literacy and promote diversity in tech. This year is no different and we are delighted to collaborate with Women Techmakers, a program championing female talent in the tech sector.In alignment with our broader commitment to supporting organizations that empower future generations, Google.org recently supported the Raspberry Pi Foundation with $10 million in funding to expand access to Experience AI to educators and young people across Europe, Middle East and Africa. This innovative program, co-developed with Google DeepMind, provides teachers with the training and resources needed to both educate and inspire young people aged 11-14 about AI and the role it could play in their lives.Women Techmakers, through its dedicated network of volunteer ambassadors, aims to significantly amplify program awareness and expand reach across Europe, Middle East and Africa. These passionate advocates for diversity and inclusion will spearhead Experience AI workshops and training sessions, inspiring young girls and fostering a love for technology.Participate in Europe Code WeekThrough collaborations like Europe Code Week and Women Techmakers, we can inspire future generations of tech leaders and build a more inclusive industry for all.We invite you to explore upcoming Experience AI Events organized by our Women Techmakers ambassadors for Europe Code Week 2024. POSTED IN: Google in Europe Families"
