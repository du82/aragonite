["https://blog.google/around-the-globe/google-europe/united-kingdom/pixel-academy-supports-womens-football"]
title = "Pixel FC Academy: Empowering the next generation of women in sports media"
description = "Google Pixel has partnered with The Powerhouse Project, Arsenal FC, Liverpool FC, and The FA to launch Pixel FC Academy."
full_description = "Breadcrumb Around the Globe Google in Europe United Kingdom Pixel FC Academy: Empowering the next generation of women in sports media Oct 22, 2024 · [[read-time]] min read Share Twitter Facebook LinkedIn Mail Copy link We're taking a step further by supporting the next generation of female talent. Eileen Mannion VP, Marketing UKI Share Twitter Facebook LinkedIn Mail Copy link Women's football is exploding in popularity, and for good reasons. From record-breaking World Cup viewership to sold-out stadiums, the beautiful game is attracting a new generation of young fans worldwide. In the UK alone, more women and girls are playing football than ever before, and viewing figures for the UK Women’s Super League have more than tripled this season since moving to YouTube. But this surge in interest hasn't translated to equal representation off the pitch, particularly in sports media where barriers to entry are perceived as insurmountable. A recent study found that while nearly half of young women in the UK who love sports are passionate about careers in sports media, a staggering 55% lack the confidence to break into the field.At Google, we believe in the power of storytelling to inspire and drive change. Following the success of Pixel FC, our collective of football creators at the Women’s World Cup in Australia and New Zealand, we're incredibly excited to announce the launch of Pixel FC Academy, a pioneering program created by Google Pixel and The Powerhouse Project, in partnership with Arsenal FC, Liverpool FC, and The FA.This initiative marks a significant step forward in our ongoing commitment to championing women in football, both on and off the pitch. With Pixel FC Academy, we're taking it a step further by supporting the next generation of talent in sports media. This program is designed to break down barriers, equipping women's football creators with the tools, training and connections they need to elevate their craft and bring the excitement of the game to life for fans everywhere.The Pixel FC Academy experienceThe Academy offers a comprehensive five-month program featuring:Expert-led workshops with leading broadcasters: Participants will benefit from workshops across various disciplines, including broadcast punditry, production, written press, and social media content creation with YouTube, 90Min and ITV.Cutting-edge AI tools: Academy members will receive training on leveraging Google AI technology available on Pixel, including Gemini, to enhance their content creation process. These tools will help them brainstorm ideas, analyse player performance and match footage to identify key moments, elevate content production and so much more — unlocking a whole new level of storytelling potential and inspiring the next generation of fans.Unparalleled access and opportunities: Pixel FC Academy members will have the incredible opportunity to work alongside top professionals, film with Arsenal and Liverpool FC Women's senior teams, gain training ground access at St George's Park, and even cover a live Women's Super League match from pitchside.Mentorship and career support: Graduates will be paired with industry mentors and have access to potential work experience or paid internships with prestigious organisations like some of our supporting partners.Closing the visibility gap, one story at a timeWe are incredibly excited to witness the positive impact that this new generation of content creators will have on the future of football coverage. Pixel FC Academy embodies our commitment to empowering women in sports and fostering a more inclusive and representative media landscape.Apply here and follow @GooglePixelUK to stay updated on Pixel FC Academy's progress. POSTED IN: UK Pixel"
