["https://blog.google/about"]
title = "About the Keyword - Official Google Blog"
description = "What to know about Google's official publication for the latest company news, updates and behind-the-scenes storytelling about products and services like Google Search, Ads, Maps, Android, Chrome, Pixel, Play, and Gemini."
full_description = '''About the Keyword Follow Us Share Twitter Facebook LinkedIn Mail Copy link On this page On this page About us Authors Follow us Newsletter Contact us The Keyword is Google's official publication for the latest company news, updates and behind-the-scenes storytelling. Our contributors include hundreds of the world’s leading engineers, product managers and internet pioneers who work directly on products and services like Google Search, Ads, Maps, Android, Chrome, Pixel and Play.The Keyword also regularly features opinions and perspectives from Google’s senior leadership, including CEO Sundar Pichai, President & Chief Investment Officer Ruth Porat and President of Global Affairs Kent Walker.Launched in 2016, the Keyword replaced more than a dozen blogs covering all aspects of Google’s technology, impact and culture. Since then, the Keyword has published thousands of articles and hundreds of opinion pieces covering topics ranging from our work in generative AI to the latest Android update to the winner of our Doodle for Google contest. The Keyword is also the central hub for breaking news and announcements from annual events like Google I/O and Made by Google.The Keyword is designed to grow and change as Google does, so as we introduce new products and technologies they have a home here. And alongside the biggest news of the day, we’ll also share quick product tips and ideas to make your life easier.Where you’re from is an important part of who you are, and the name “the Keyword” is a nod to the origins of search. Keywords also unlock information, which is what we hope to do here — provide a central, official source of news about who we are, what we do and what we value. (Plus, we like that it has “word” in it.)In short: If there’s anything you want to know about what’s happening at Google right now, the Keyword is where you should start. Noteworthy authorsGooglers from across the company contribute to the Keyword — ranging from engineers and designers to doctors and scientists. Here are a few examples: Sundar PichaiSundar is the CEO of Alphabet and Google and serves on Alphabet’s Board of Directors. Under his leadership, Google has been focused on developing products and services, powered by the latest advances in AI, that offer help in moments big and small. Demis HassabisDemis Hassabis is the co-founder and CEO of Google DeepMind, one of the world’s leading AI research groups. DeepMind has produced landmark research breakthroughs such as AlphaGo, the first program to beat the world champion at the game of Go, and AlphaFold, which was heralded as a solution to the 50-year grand challenge of protein folding. James ManyikaJames is a senior vice president at Google. He focuses on technology and society, including areas ranging from AI to the future of work and the digital economy, computing infrastructure, sustainability, and other areas that have the potential for broad impact on society. Prior to Google, he spent over 25 years at McKinsey & Company, including serving on its board, and is now senior partner emeritus and chair emeritus of the McKinsey Global Institute (MGI). Dr. Karen DeSalvo, MD, MPH, MSc“Dr. Karen” leads a team of health professionals at Google who provide guidance for the development of inclusive research, products and services. She has been part of the Google COVID response team and previously served as National Coordinator for Health Information Technology and Assistant Secretary for Health (Acting) in the Obama Administration. During her time at the U.S. Department of Health and Human Services, Dr. DeSalvo focused on creating a more consumer-oriented, transparent and value-based health system. Kent WalkerKent is the President of Global Affairs at Google and Alphabet, where he works at the intersection of technology, policy and legal issues. He joined Google in 2006, and currently oversees the company’s engagement with governments around the world, content policies, and philanthropic efforts. Melonie ParkerAs Google's Chief Diversity Officer, Melonie is responsible for advancing Google's employee engagement strategy across Diversity, Equity & Inclusion. She is an advocate for change and a passionate thought leader whose mission is to help make Google more reflective of the world around us. Prabhakar RaghavanPrabhakar Raghavan is Google’s Chief Technologist. In this role, Prabhakar partners closely with the CEO and leadership team to provide technical direction and leadership in support of Google’s long-standing culture of technical excellence. He is one of the foremost authorities on Search and is the co-author of two widely-used graduate texts on algorithms and on search: Randomized Algorithms and Introduction to Information Retrieval. He has over 20 years of research spanning algorithms, web search and databases, published over 100 papers in various fields, and holds 20 issued patents including several on link analysis for web search. Rick OsterlohRick Osterloh leads Platforms & Devices, a group of products and services that bring the best of Google’s innovation in AI, software and hardware to users, partners, and developers. This includes the overall Android platform, Google Play, Chrome browser, ChromeOS, Google One, Google Photos, the Pixel portfolio, Nest, Fitbit and more. He works closely with partners across the ecosystem, and oversees multiple Google products that serve more than a billion users each. Ruth PoratAs President and Chief Investment Officer, Ruth is responsible for the company’s corporate investments and investment vehicles, including GV and CapG, the Other Bets investment portfolio, Real Estate and Workplace Services, and other company infrastructure. She was previously SVP and CFO of Alphabet and Google. Sissie HsiaoSissie Hsiao is a Vice President and General Manager, Gemini experiences and Google Assistant. She is an innovator at heart, and her areas of expertise include transforming products and businesses with cutting edge application of technology and machine learning. Urs HölzleUrs joined Google in 1999 as the first vice president of engineering. Now, he oversee Google’s technical infrastructure, including making that infrastructure available to developers around the world through Google Cloud. Vint Cerf, Ph.D.Vinton G. Cerf, Ph.D., is vice president and Chief Internet Evangelist for Google. He contributes to global policy development and continued spread of the Internet. Widely known as one of the "Fathers of the Internet," Cerf is the co-designer of the TCP/IP protocols and the architecture of the Internet. He has served in executive positions at MCI, the Corporation for National Research Initiatives and the Defense Advanced Research Projects Agency and on the faculty of Stanford University. How to follow usYou can also find the latest news and stories from Google on our official social channels — including Instagram, YouTube, Twitter and TikTok — and our weekly email newsletter. Get more stories from Google in your inbox. Get more stories from Google in your inbox. Email address Your information will be used in accordance with Google's privacy policy. Subscribe Done. Just one step more. Check your inbox to confirm your subscription. You are already subscribed to our newsletter. You can also subscribe with a different email address . Contact usNeed assistance or want to report a problem with a Google product or service? Here’s the best place to start.If you are a member of the press, contact press@google.com.Google Headquarters1600 Amphitheatre ParkwayMountain View, CA 94043650-253-0000'''
