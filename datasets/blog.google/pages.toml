["https://blog.google/products/search/doodle-for-google-2024-national-finalists"]
title = "Doodle for Google announces 2024 national finalists"
description = "Today we’re announcing the 2024 Doodle for Google top five finalists."
full_description = '''Breadcrumb Products Search Check out this year’s 5 Doodle for Google finalists Jun 10, 2024 · [[read-time]] min read Share Twitter Facebook LinkedIn Mail Copy link This year’s five finalists created Doodles themed around family, future careers and food sustainability. Selly Sallah Brand Studio Read AI-generated summary General summary Google’s Doodle for Google contest is back! This year, thousands of K-12 students submitted imaginative Doodles based on their wishes for the next 25 years. After a public vote and judges' deliberation, five national finalists have been chosen. The finalists' Doodles addressed the prompt creatively through artwork and written statements, showcasing artistic merit and imagination. Award categories include Imagination, Planet, Good Neighbor, Tech Whiz, and Biggest Smile. Stay tuned for the national winner announcement later this month! Summaries were generated by Google AI. Generative AI is experimental. Haiku-ish Students' Doodles dream Of the next twenty-five years For Google's birthday Imagination, tech, Sustainability, community, Joyful Doodles shine Five finalists stand, Voting now complete, winner soon Doodle for Google Summaries were generated by Google AI. Generative AI is experimental. Explore other styles: General summary Haiku-ish Share Twitter Facebook LinkedIn Mail Copy link Sorry, your browser doesn't support embedded videos, but don't worry, you can download it and watch it with your favorite video player! For this year’s Doodle for Google contest, students set their sights on the future. In celebration of Google’s 25th birthday, tens of thousands of K-12 students from across the U.S. submitted imaginative Doodles based on their wishes for the next 25 years.We recently announced the top 55 Doodles and invited all of you to vote for your favorites. Now, the votes are in, our judges have deliberated — and we have our five national finalists.Submissions were judged by how well they addressed the prompt through both their artwork and written statement, plus overall artistic merit and creativity. This year, we also introduced finalist award categories to inspire students to dream big: the Imagination Award for out-of-this-world creativity; the Planet Award for Doodles focused on sustainability; the Good Neighbor Award for wishes centered around local community; the Tech Whiz Award for artwork that highlights technology; and the Biggest Smile Award for the most joyful Doodle.Here are this year’s Doodle for Google national finalists (in age group order): { "previous": "Previous", "next": "Next" } Imagination Award: Katherine, Hawaii, K-3 GradeFairytales“My wish for the next 25 years is for mermaids to be in the ocean and dragons in the sky. And magic is everywhere.” Planet Award: Vivian, New Jersey, 4-5 GradeNo More Hunger“My wish for the next 25 years is that there'll be no more hunger. Every day all over the world people are starving. If we all work together we'll be able to feed everyone. My hope is that within 25 years nobody will go hungry. I'm trying to encourage food sustainability and creativity all over the world.” Good Neighbor Award: Sophia, California, 6-7 GradeFamily“My wish for the next 25 years is, I wish my family would laugh more, watch sunsets more, eating dinner together, family would stay together and that no one would die alone. In this drawing, I drew a family that loves each other a family that would risk their lives to each other, a family that would be there for eachother a family that would be patient with others shortcomings.” Tech Whiz Award: Jia Xin Sophia, Idaho, 8-9 GradeMy Ideal Future“In 25 years, aside from turning 38, I see myself living a life of computer science and art in the morning. I'll review algorithms and analyze data in the office. At night, I'll be spilling paint and creating art. I want to live life to the fullest before it ends.” Biggest Smile Award: Maisie, District of Columbia, 10-12 GradeFamily Dinner“Every Sunday night is filled with chaos, laughter and the smell of food in my household. The standing invitation goes to any friends and family in the area. As my life grows and changes, my wish for the next 25 years is that this tradition remains a constant.” Congratulations to our five finalists! Keep an eye out for our national winner announcement later this month. POSTED IN: Doodles Search'''
