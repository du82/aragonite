title = "Solaris installation"
description = "In what top scientists are calling “fucking stupid”, Solaris can’t handle disks that used to have non-solaris stuff on them without being wiped first."
full_description = 'This is my personal blog. The views expressed on these pages are mine alone and not those of my employer. Solaris installation Dec 22, 2007, Categories: solaris,unix,bugs In what top scientists are calling “fucking stupid”, Solaris can’t handle disks that used to have non-solaris stuff on them without being wiped first. I thought only the windows installer borked if the partition table looked weird, but no! The installer could not see the disk, and I was dropped into a dtterm where I had to do dd if=/dev/zero of=/dev/dsk/c0t0d0 bs=1048576 and reboot. So… wipe the disk before trying to install Solaris. <a href="https://blargh.disqus.com/?url=ref&https" ping="/ping">View the comments.</a>'
