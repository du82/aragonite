["https://blog.habets.se/2015/11/How-I-made-my-custom-keyboard-layout-on-Linux-and-Windows.html"]
title = "How I made my custom keyboard layout on Linux and Windows"
description = "This post explains how to set up a keyboard layout the way I like it. It may not fit you at all, but it may give you ideas that would work for you."
full_description = '''This is my personal blog. The views expressed on these pages are mine alone and not those of my employer. How I made my custom keyboard layout on Linux and Windows Nov 29, 2015, Categories: unix,keyboards This post explains how to set up a keyboard layout the way I like it. It may not fit you at all, but it may give you ideas that would work for you. In short: I remap Caps Lock to add some extra keys. First a description of what my preferred keyboard layout is: I type Dvorak, but also want to occasionally use Swedish letters. There are a couple of Dvorak versions for Swedish, but since most of my typing is in English or programming I think they compromise too much on the accessibility of other keys to add these three Swedish characters. So for a decade or so I’ve been remapping Caps Lock to AltGr and holding down AltGr to add new keys. Typing “ö” quickly became fluent and easy, since it involves holding down one key with my left hand and pressing a key with another. I used this method even before I switched to Dvorak, because if you’ve ever coded on a Swedish keyboard you should know how terrible it is. I know several Swedish programmers who use US keyboard layout all the time because of this, and simply live without being able to type proper Swedish. GRUB 2.x ckbcomp dvorak | sudo grub-mklayout -o /boot/grub/dvorak.gkb echo -e 'insmod keylayouts\nkeymap /boot/grub/dvorak.gkb' | sudo tee -a /etc/grub.d/40_custom echo GRUB_TERMINAL_INPUT=at_keyboard | sudo tee -a /etc/default/grub sudo update-grub Not working at the moment due to a bug in GRUB. Linux console Enable Dvorak using: $ sudo apt-get install console-data $ sudo dpkg-reconfigure keyboard-configuration No further customization made, since I spend so little time in pure terminals. Linux graphics setxkbmap dvorak and then I run xmodmap on this file. Done. Windows You don’t need to be admin to do this. Well, maybe to turn caps lock into AltGr, I forget. Make custom keyboard map (or download mine or as self-extracting archive. Google “microsoft keyboard layout creator” Install it File -> Load Existing Keyboard United States-Dvorak Check the Alt+Ctrl (AltGr) checkbox on the left. Add special keys. Don’t forget the capital letters by also checking the Shift checkbox. File -> Save Source File Say yes to setting metadata Enter suitable metadata Project -> Build DLL and Setup package. Install custom keymap Double-click on the generated Setup binary. Keyboard layout is now installed. Windows Start menu Settings Region & language Under “Languages”, click on “English (United States)” Options Remove the one that’s not your custom one. Remap Caps Lock to Right Alt (AltGr) Run regedit Navigate to HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Keyboard Layout Right click to create a new Binary Value named Scancode Map Enter value: 00 00 00 00 00 00 00 00 02 00 00 00 38 E0 3A 00 00 00 00 00 00 00 00 00 00 00 00 00: Padding 02 00 00 00: Length 38 E0: Key to map to (Right Alt) 3A 00 Key to map from (Caps Lock) 00 00 00 00: More padding Log out and in again. ChromeOS No solution yet. Use normal Dvorak. :-( Android No solution yet. Use normal Dvorak. :-( USB keyboard on any machine To get Dvorak I use a QIDO adapter. Or a WASD Keyboards keyboard. They have a switch to allow you to use Dvorak anywhere. <a href="https://blargh.disqus.com/?url=ref&https" ping="/ping">View the comments.</a>'''
year_published = 2015
clearnet = "https://blog.habets.se/2015/11/How-I-made-my-custom-keyboard-layout-on-Linux-and-Windows.html"
