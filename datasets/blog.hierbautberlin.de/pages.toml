full_description = "Der Server Lebt über Statusupdate 07 Jun 2021 In den letzten Wochen war ein wenig Funkstille, aber ab diesem Monat arbeite ich wirklich Vollzeit an HierBautBerlin. Und das wird sich hoffentlich bemerkbar machen. Erledigt Ich habe mithilfe von Ansible einen Server aufgesetzt und konfiguriert. Eine erste frühe Alpha-Version von HierBautBerlin ist nun auch auf dem Server deployed und kann hier angesehen werden. Es fehlen allerdings noch sehr viele Funktionen. Es gibt aber wenigstens ein Gefühl, wie viele Daten ich schon gesammelt habe. Das mache ich in den nächsten zwei Wochen Die Nutzer-Anmeldung und die E-Mail-Benachrichtigungen sind nun als Nächstes dran. Hoffentlich kann man am Ende dieser Woche schon Konten anlegen und Erinnerungen konfigurieren. Das motiviert/bremst mich gerade Ein wenig ausgebremst wurde ich von dem Fakt, das Traefik, dem Loadbalancer den ich gerade Nutze, nicht möglich ist, Server mithilfe eines API-Calls aus dem System zu nehmen. Dafür gibt es ein Ticket das im Jahr 2015 geöffnet wurde. Die Aussicht darauf, am Ende der nächsten zwei Wochen schon E-Mails bekommen zu können für Einträge motiviert mich aber sehr stark. Und dann geht es endlich an das Herz der Anwendung. Filtern der Daten, Anzeigen optimieren und die weiteren Quellen anbinden. Hier Baut Berlin's Logo Hier Baut Berlin Hier Baut Berlin ist Teil der 9. Runde des Prototypefund. Hier erzählt Bodo alle zwei Wochen über den aktuellen Softwarestand. Teile diesen Beitrag Twitter Facebook"
