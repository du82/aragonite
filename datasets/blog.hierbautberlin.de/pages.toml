["https://blog.hierbautberlin.de/about.html"]
title = "Hier Baut Berlin - Wir informieren Menschen über Bauvorhaben in ihrem Umfeld"
description = "Wir informieren Menschen über Bauvorhaben in ihrem Umfeld"
full_description = "Über Hier Baut Berlin Wenn Baustellen in der Stadt existieren, beeinflusst dies das Leben der Bürger:innen. So gibt es Baulärm sowie -staub und Verkehrswege werden beeinträchtigt. Oftmals ist dann noch nicht einmal klar, was und warum an der Stelle überhaupt gebaut wird. Wenn ein:e Bürger:in Berlins wissen will, warum plötzlich die eigene Straße umgebaut wird, reicht theoretisch ein Blick in das Amtsblatt von Berlin. Dort sind alle Bauausschreibungen vorhanden. Allerdings liest diese niemand. Wie schon bei “Per Anhalter durch die Galaxis” ist die Information zwar vorhanden, aber leider zu versteckt. Mit HierBautBerlin will ich ein Tool schaffen, mit dem jede:r genau die Informationen bekommen kann, die das direkte Lebensumfeld betreffen. Und das so einfach und schnell wie möglich. Neben einer interaktiven Karten wird es auch die Möglichkeit geben, per EMail über neue Einträge in der Nähe der eigenen Wohnung informiert zu werden. Der Quelltext wird unter der MIT Lizenz auf Github entwickelt. Dieses Projekt ist Teil der 9. Runde des Prototype Fund. Impressum Bodo Tasche Richard-Sorge-Str. 59 10249 Berlin +49 30 41728894 mail@hierbautberlin.de"
year_published = 2025
clearnet = "https://blog.hierbautberlin.de/about.html"
tags = ["baut", "berlin", "hier", "impressum", "über"]
language = "en"
internal-references = ["none"]
external-references = ["bmbf.de", "github.com", "prototypefund.de"]

["https://blog.hierbautberlin.de/statusupdate/2021/06/28/mehr-quellen.html"]
title = "Hier Baut Berlin - Wir informieren Menschen über Bauvorhaben in ihrem Umfeld"
