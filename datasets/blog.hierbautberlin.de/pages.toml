full_description = "Importer und UX-Workshop über Statusupdate 05 Apr 2021 Schon wieder sind zwei Wochen vergangen. Ich habe aufgrund der Feiertage aber recht wenig an HierBautBerlin programmieren können. Es gab aber trotzdem so einige Fortschritte. Erledigt Mittlerweile sind 5 Quellen fertig implementiert und die Datenbank enthält nun über 8.000 Einträge. Das ist leider auch zu viel, um diese in einer herkömmlichen Zoom-Ansicht einer Karte anzuzeigen. Die Informationen müssen geschickt sortiert und aufbereitet werden. Ich habe auch schon so einige Ideen dazu. Zum Glück war meine Ansprechpartnerin beim UX-Workshop auch sehr überzeugt von diesen Ideen. Es kann also losgehen mit dem Bau der eigentlichen Webseite. Das mache ich in den nächsten zwei Wochen Die Webseite wird der Haupt-Fokus der nächsten Wochen sein. Sobald diese steht, werde ich die erste frühe Alpha-Version online zur Verfügung stellen, damit ich schnell Feedback bekomme. Wenn die Webseite halbwegs funktioniert, werde ich mich dann wieder den weiteren noch offenen Quellen widmen. Das wird aber vermutlich noch einen Monat dauern. Das motiviert/bremst mich gerade 8.000 Einträge. Viel mehr als ich dachte. Das motiviert mich unheimlich, die Webseite mit der Kartenansicht zu bauen. Ich will diese Daten auf einer Karte sehen. Und nicht mehr in einer langweiligen Tabellenansicht. Hier Baut Berlin's Logo Hier Baut Berlin Hier Baut Berlin ist Teil der 9. Runde des Prototypefund. Hier erzählt Bodo alle zwei Wochen über den aktuellen Softwarestand. Teile diesen Beitrag Twitter Facebook"
