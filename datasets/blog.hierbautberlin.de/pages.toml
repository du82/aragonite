full_description = "Webseite über Statusupdate 18 Apr 2021 Wie schon im letzten Blogpost angekündigt, arbeite ich momentan an der Webseite. Das Ganze wird sich auch noch etwas hinziehen, da dies ein recht komplexes Thema ist. Erledigt Ich habe eine erste Version der Webseite erstellt. Das Layout fehlt zwar noch, aber das wichtigste ist schon vorhanden: Die zum aktuellen Kartenausschnitt passenden Daten werden geladen und angezeigt. Das ganze mit einer Technologie, die recht neu ist und ich noch nicht in einem echten Projekt eingesetzt habe bis jetzt. Phoenix LiveView. Mit LiveView gibt es endlich eine elegante Möglichkeit, auf dem Server die Daten zu rendern und auf dem Client interaktive Element haben zu können. Die Technik funktioniert einwandfrei und wird mir viel Zeit sparen in den nächsten Wochen. Das mache ich in den nächsten zwei Wochen Webseite, Webseite und Webseite. Hoffentlich kann ich in vier Wochen eine erste Alpha-Version online stellen. Danach kümmere ich mich dann wieder um weitere Quellen. Das motiviert/bremst mich gerade Ich arbeite nebenbei in diesem Monat an recover mit, einer OpenSource Kontaktdatenliste. Dadurch werde ich leider etwas weniger Zeit in HierBautBerlin stecken können, aber das werde ich nachholen. Hier Baut Berlin's Logo Hier Baut Berlin Hier Baut Berlin ist Teil der 9. Runde des Prototypefund. Hier erzählt Bodo alle zwei Wochen über den aktuellen Softwarestand. Teile diesen Beitrag Twitter Facebook"
