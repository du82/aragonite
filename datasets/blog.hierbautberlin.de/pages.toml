full_description = "Mehr Quellen über Statusupdate 28 Jun 2021 Es ist viel passiert diesen Monat. Und der nächste Monat wird der letzte Vollzeit-Monat am Projekt sein. So wie es aussieht, werde ich aber alles erledigen können. Erledigt Der Server ist nun unter beta.hierbautberlin.de erreichbar. Die Seite funktioniert auch schon. Es gibt sogar die Möglichkeit, sich via E-Mail über neue Einträge informieren zu lassen. Ich habe angefangen, einen Text-Parser zu bauen, der es ermöglicht, Berliner Adressen und Orte in Fließtext zu finden und diese dann auf der Karte zu hinterlegen. Sobald dieser Fertig ist, werde ich die nächsten Quellen anbinden können. Das mache ich in den nächsten zwei Wochen In den nächsten Wochen werde ich weitere Quellen anbinden und dann die UI finalisieren. Das motiviert/bremst mich gerade Der Parser ist fast fertig. Es gibt nur noch den PDF-Parser, dann sind alle schwierigen Teile erledigt und ich kann mich voll auf die UI konzentrieren :) . Hier Baut Berlin's Logo Hier Baut Berlin Hier Baut Berlin ist Teil der 9. Runde des Prototypefund. Hier erzählt Bodo alle zwei Wochen über den aktuellen Softwarestand. Teile diesen Beitrag Twitter Facebook"
