["https://blog.hierbautberlin.de/projektstart/2021/03/05/willkommen.html"]
title = "Hier Baut Berlin - Wir informieren Menschen über Bauvorhaben in ihrem Umfeld"
description = "Wir informieren Menschen über Bauvorhaben in ihrem Umfeld"
full_description = "Willkommen! über Projektstart 05 Mar 2021 Hallo im Blog von Hier Baut Berlin. Dieses Projekt ist Teil der 9. Runde des Protoype Funds und wird vom Bundesministerium für Bildung und Forschung unterstützt. Was ist Hier Baut Berlin? Ein Tool das dir helfen soll, die Entscheidungen der Stadt bezüglich ihrer Bauprojekte zu visualisieren. Wo baut die Stadt? Wo kann ich mich noch beteiligen? Meistens hört man leider von Projekten erst, wenn es zu spät ist. Wenn die Straße schon aufgerissen wird. Allerdings hättest du oft die Chance gehabt, auch schon früher informiert zu werden. Mit diesem Tool wirst du in Zukunft via Email über Neuigkeiten in deinem Umfeld informiert werden können. Und zwar sobald diese verkündet werden. Nicht erst, wenn es zu spät ist. Mein Name ist Bodo und ich habe auch schon so einige andere nützliche Projekte gebaut. Zum Beispiel SignDict.org, eines der meist genutzten deutschen Gebärdensprach-Nachschlagewerke und Wishlephant, einer Wunschlisten-Verwaltung. Ab jetzt werde ich alle zwei Wochen über den aktuellen Projekt-Stand hier informieren. Fangen wir also an: Erledigt Diese Woche habe ich auf GitHub das Projekt angelegt, Github Actions angebunden und die Readme erstellt. Daneben habe ich diesen Blog gestartet und diverse Menschen wegen potenzieller Zusammenarbeiten angeschrieben. Zeitgleich habe ich die Liste der Quellen sortiert und eine grobe Skizze des Datenbank-Designs entworfen. Das mache ich in den nächsten zwei Wochen Ich werde die ersten Quellen auslesen und in die Datenbank schreiben. Das motiviert/bremst mich gerade Die vielen positiven Gespräche und die allgemeine Bereitschaft, Daten bereitzustellen, ist sehr motivierend. Die Qualität der Datenquellen ist ebenfalls überraschend gut. Hier Baut Berlin's Logo Hier Baut Berlin Hier Baut Berlin ist Teil der 9. Runde des Prototypefund. Hier erzählt Bodo alle zwei Wochen über den aktuellen Softwarestand. Teile diesen Beitrag Twitter Facebook"
