title = "Still Little, Still FREE • The Breakroom"
description = "It’s been busy around the factory of late. So busy, that a couple of our popular little apps that were updated over the Christmas holiday are just now being released! Clicker Folks who love counting will be happy to know that Clicker has some useful new features on watchOS: Added support for the Digital Crown […]"
full_description = '''The Breakroom Still Little, Still FREE February 18, 2025 By Craig Hockenberry It’s been busy around the factory of late. So busy, that a couple of our popular little apps that were updated over the Christmas holiday are just now being released! Clicker Folks who love counting will be happy to know that Clicker has some useful new features on watchOS: Added support for the Digital Crown – just turn it to adjust the counter. If needed, this feature can also be disabled in settings (tap the gear icon).There is now separate haptic feedback when you reach a goal: a different sound and vibration are played. This is helpful for activities where you count with your eyes closed or without looking at your wrist.Added a new setting to disable haptic feedback. No sounds or vibrations will be played as you adjust the count.The complication can now display longer numbers: commas are removed when space is tight. You can get the app for FREE on the App Store. Now Playing Plus We also did a small, but important, update for Now Playing Plus. We fixed an issue where tapping on the watch face complication to see what’s playing would often show a blank screen instead of the player controls. Apple’s built-in watch complications don’t work in the circular or corner positions: Now Playing Plus fixes that. If you’re like me and need to get at the controls quickly and reliably without fumbling around with screen navigation, it’s a great addition to your Apple Watch. I use Now Playing Plus while riding my bike: a tap in the corner of my watch face, and then play/pause or adjust volume with the crown, all while keeping my eyes on the road! You can get it for FREE on the App Store. (If you have already downloaded the app, you may need to download it again from the watchOS App Store. We wish Apple would fix this.) Posted in: Clicker, Now Playing Plus Latest News var dir='https://blog.iconfactory.com/wp-content/themes/ifblog'; var content = []; content.push('\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><img src="' + dir + '/images/features/feature_alien.jpg" /></a>\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><h5>The Iconography <br />of &apos;Alien&apos;</h5></a>\ <p>\ The past, present, and sci-fi future come together as Dave Brasgalla explores \ iOS 7 and the iconography of \'Alien\'.\ </p>\ <p><a href="/2013/10/ios-7-and-the-iconography-of-alien/">Read more...</a></p>\ '); content.push('\ <a href="/2015/11/the-new-favicon/"><img src="' + dir + '/images/features/feature_favicon.png" /></a>\ <a href="/2015/11/the-new-favicon/"><h5>The New Favicon</h5></a>\ <p>\ The SVG icon used for pinned tabs in Safari 9 presents unique challenges for web designers. \ Learn a few tips and tricks as we examine how we handled those challenges in our revision \ of the Iconfactory favicon.\ </p>\ <p><a href="/2015/11/the-new-favicon/">Read more...</a></p>\ '); content.push('\ <a href="/2018/03/a-lot-can-happen-in-a-decade/"><img src="' + dir + '/images/features/feature_iosanniversary.jpg" /></a>\ <a href="/2018/03/a-lot-can-happen-in-a-decade/"><h5>A Decade of iOS</h5></a>\ <p>\ Learn about the early history of the software that changed the lives of \ so many people: Craig Hockenberry on the launch of the iOS SDK.\ </p>\ <p><a href="/2018/03/a-lot-can-happen-in-a-decade/">Read more...</a></p>\ '); var min = 0; var max = content.length - 1; var index = Math.floor(Math.random() * (max - min + 1)) + min; document.write(content[index]);'''
