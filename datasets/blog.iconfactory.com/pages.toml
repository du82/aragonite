sion has been fine through the beta release, so we’ve been making minor tweaks and adding some performance improvements – certainly nothing urgent. With last week’s release of macOS Sonoma 14.1 (on October 25th) things changed […] Triode 2.1 – Conjuring Magic October 10, 2023 Hot on the heels of a major new release, there’s a new version of Triode with two big new improvements. Our Internet radio app just keeps getting more perfect with Shazam and data management! Triode does its best to figure out what song is playing, but if you’ve ever been listening to a station without […] WorldWideWeb 2.1 October 3, 2023 Our simple web server for developers continues to improve with version 2.1. In this update, we’ve implemented two new features that are often requested by PRO users. On macOS, we added support for a reverse proxy. This lets you use WorldWideWeb as a frontend web server for a backend development environment. In simpler terms, this […] Triode 2 – Improvements Everywhere September 20, 2023 Announcing Triode 2 – a huge update to our popular Internet radio app. We’ve packed the new version with improvements, including new support for Shortcuts and Widgets, improved Siri and CarPlay support, and a ton of tweaks and refinements across iOS, macOS, tvOS, and CarPlay. Interactive Widgets Triode now sports two different types of iOS […] New OS, New Apps! September 15, 2023 Just a quick post to let you know about updates for our FREE Clicker and Now Playing Plus apps for both iOS 17 and watchOS 10. Clicker, our little counter with a thousands uses, gets two new features on iOS. The first is an interactive widget that lets you see and increment your count on […] Older posts var dir='https://blog.iconfactory.com/wp-content/themes/ifblog'; var content = []; content.push('\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><img src="' + dir + '/images/features/feature_alien.jpg" /></a>\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><h5>The Iconography <br />of &