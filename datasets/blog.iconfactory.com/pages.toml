full_description = '''The Breakroom Category: Development Tapestry: Past, Present, and Future February 25, 2025 After a successful Kickstarter campaign, and ten months of development, Tapestry is finally an App Store reality. Tapestry presents content in chronological order, with no algorithm or other person deciding what you should or shouldn’t see. Content can come from social media services like Bluesky, Mastodon, or Tumblr, as well as RSS feeds, podcasts, YouTube […] Enter Tapestry February 4, 2025 We’ve been making apps for decades and have acquired the skills to build all sorts of great things. But even talented teams can be challenged, and our latest product has been the hardest yet. I’m talking about Tapestry. It’s taken ten months since 3,369 folks agreed that the idea of putting all the things you follow […] Thinking Outside the Box with MuseBox July 16, 2024 Sometimes a design project can hit a roadblock and stall out – a point where for some reason it becomes difficult to leap over a certain potential solution in order to arrive at an even better one. Brushed Pixel came to us for help with this very situation. They had developed a solid starting point […] Developers, Developers, Develop! January 12, 2024 Two of our most popular developer tools were updated this week. It’s not just our website that’s getting the love! xScope Our primary focus with xScope version 4.7 was to update the screen recording code. Alerts in the Sonoma beta gave us pause and we noticed an increase in crashes with the older APIs. There […] Happy Anniversary, xScope! November 14, 2023 Twenty years ago today, we released a new product. To say that product has been a success would be an understatement. It’s been an essential part of a workflow for tens of thousands of folks. It’s also an app that has evolved with our desktop environments over the years: it predates responsive web design, Retina […] Announcing Linea Sketch 4.3 November 7, 2023 The latest update to Linea Sketch is now available! From textures to thumbnail cropping, version 4.3 is packed with clever new features to make sketching on your iPad easier and more fun than ever. Textures Have Never Been Easier We’ve created a variety of pre-defined seamless textures to let you quickly add visual interest and […] Welcome, Wallaroo Widgets! September 26, 2023 With Interactive Widgets, Wallaroo 1.4 brings a whole new way to customize your home screens on the latest versions of iOS, iPadOS, and macOS! There are also a handful of fixes and improvements that make using and enjoying your favorite wallpapers easier than ever. Wallpaper Widget Thanks to the new interactive widget, you’re no longer […] Talking Design Services May 4, 2023 We took some time to chat with the nice folks over at HostingAdvice about all things Iconfactory: from our history, to our current projects, to what the future might hold. HostingAdvice serves up a daily helping of technology news, product reviews, and profiles the movers & shakers of our industry. Many of our long-time fans and […] Wallaroo: A Journey from iOS to macOS (Part 3) March 24, 2023 Another day, another set of revelations. We’ve almost reached our destination, so let’s get going! Tooling Problems SwiftUI and the cross-platform frameworks you will be using are either: A new thing with bugs and rough edges — and quickly evolving. An old thing with decades of legacy — and unlikely to change. You will have […] Wallaroo: A Journey from iOS to macOS (Part 2) March 23, 2023 It’s day two of our epic journey from iOS to macOS. Let’s get started with everyone’s favorite topic. Ugly Code In every app, there’s code you hate writing, but do it anyway. Shipping is better than perfection! Here are our less-than-proud moments in Wallaroo for the Mac: Handling URLs SwiftUI’s default mechanism for handling URLs […] Older posts var dir='https://blog.iconfactory.com/wp-content/themes/ifblog'; var content = []; content.push('\ <a href="/2013/10/ios-7-and-the-iconography-of-