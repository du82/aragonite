title = "Clicker 2.0 • The Breakroom"
description = "Back in 2015, we released our first watchOS app. Clicker is a simple app with a simple goal: a way to keep track of something important in your life using your Apple Watch. It’s been used by hundreds of thousands of customers. For me, Clicker kept me swimming in the ocean, for others the count […]"
full_description = '''The Breakroom Clicker 2.0 February 3, 2023 By Craig Hockenberry Back in 2015, we released our first watchOS app. Clicker is a simple app with a simple goal: a way to keep track of something important in your life using your Apple Watch. It’s been used by hundreds of thousands of customers. For me, Clicker kept me swimming in the ocean, for others the count was something different — these are just some of the things we’ve seen in reviews and social media: Laps while running on a trackRests in an orchestral rehearsalOunces of water each dayNumber of times smoking to cut backConsecutive days exercisingNumber of books readTips from customersRows while knittingTrick-or-treater managementPizza folding (yum!) It’s eight years later and we’re all still counting! With recent advances in the capabilities of watchOS and iOS, it felt like a good time to give the product a makeover. Here are the new things that both we and our customers want: A beautiful new plus button that matches the color of the watch complicationCustomizable color now uses an array of pleasing and standard huesSettings can now be changed directly on Apple WatchNew settings to manually set count and update in tens or dozensPlus button now works on iPhone and iPadAll data automatically synced to all devices and watch complicationsLight and dark mode are supported on iPhone and iPad And the good news is that Clicker is still FREE to download and use. If you really want to show your thanks, make sure to try out one of our other apps. Enjoy! Posted in: Clicker Latest News var dir='https://blog.iconfactory.com/wp-content/themes/ifblog'; var content = []; content.push('\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><img src="' + dir + '/images/features/feature_alien.jpg" /></a>\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><h5>The Iconography <br />of &apos;Alien&apos;</h5></a>\ <p>\ The past, present, and sci-fi future come together as Dave Brasgalla explores \ iOS 7 and the iconography of \'Alien\'.\ </p>\ <p><a href="/2013/10/ios-7-and-the-iconography-of-alien/">Read more...</a></p>\ '); content.push('\ <a href="/2015/11/the-new-favicon/"><img src="' + dir + '/images/features/feature_favicon.png" /></a>\ <a href="/2015/11/the-new-favicon/"><h5>The New Favicon</h5></a>\ <p>\ The SVG icon used for pinned tabs in Safari 9 presents unique challenges for web designers. \ Learn a few tips and tricks as we examine how we handled those challenges in our revision \ of the Iconfactory favicon.\ </p>\ <p><a href="/2015/11/the-new-favicon/">Read more...</a></p>\ '); content.push('\ <a href="/2018/03/a-lot-can-happen-in-a-decade/"><img src="' + dir + '/images/features/feature_iosanniversary.jpg" /></a>\ <a href="/2018/03/a-lot-can-happen-in-a-decade/"><h5>A Decade of iOS</h5></a>\ <p>\ Learn about the early history of the software that changed the lives of \ so many people: Craig Hockenberry on the launch of the iOS SDK.\ </p>\ <p><a href="/2018/03/a-lot-can-happen-in-a-decade/">Read more...</a></p>\ '); var min = 0; var max = content.length - 1; var index = Math.floor(Math.random() * (max - min + 1)) + min; document.write(content[index]);'''
