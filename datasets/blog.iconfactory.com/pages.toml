["https://blog.iconfactory.com/author/cheryl"]
title = "Cheryl Cicha • The Breakroom"
description = "Our experienced team creates products on every development platform for clients of all sizes. We’d like to work with you, too."
full_description = '''The Breakroom Author: Cheryl Cicha Tapestry: Past, Present, and Future February 25, 2025 After a successful Kickstarter campaign, and ten months of development, Tapestry is finally an App Store reality. Tapestry presents content in chronological order, with no algorithm or other person deciding what you should or shouldn’t see. Content can come from social media services like Bluesky, Mastodon, or Tumblr, as well as RSS feeds, podcasts, YouTube […] Tot Summer Sale June 24, 2024 Summer’s here! Stay cool by keeping things simple with Tot, our elegant and streamlined text editor for notes, to-dos, and so much more. Tot’s single window design and simple formatting controls mean no more hunting for that chunk of important text. Tot’s already FREE on macOS, but now the iOS version is on sale at […] Talking Design Services May 4, 2023 We took some time to chat with the nice folks over at HostingAdvice about all things Iconfactory: from our history, to our current projects, to what the future might hold. HostingAdvice serves up a daily helping of technology news, product reviews, and profiles the movers & shakers of our industry. Many of our long-time fans and […] Proposed Anti-Bullying Emoji November 8, 2019 We are honored to be a part of an effort to make social media a kinder experience. Over the years we’ve designed thousands of emoji for clients such as Twitter, Facebook, and many others. When parliamentary candidate and former Secretary of State Penny Mordaunt approached us to create new emoji to support her anti-bullying campaign, […] Digital goodies just for you! March 5, 2019 For over 20 years The Iconfactory has been drawing icons, designing user interfaces, and building great software. We also used to create loads of free wallpapers and desktop icons just for fun, but we got busy and that tradition got lost. Before we knew it, years had gone by without any new freeware. Let’s Do […] Sweet Pea Mobile App December 13, 2016 Michael Bruch, founder of Peas and Love Corporation, partnered with us earlier this year to create a new dating app focused on healthy relationships. His thesis was that a more humanized and enjoyable online dating experience would be possible if a platform focused on enabling self expression, encouraged interesting conversation, and fostered empathy between strangers. While lots of […] Iconfactory Founder to Appear on Food Network’s ‘Cake Wars’ July 5, 2016 There’s no denying that emoji are all the rage these days. That’s why we were excited when the producers behind Food Network’s hit reality baking competition, Cake Wars, invited us to fly to LA to help judge a special emoji-themed episode which airs nationally in the United States next week. It’s the most expressive episode […] Recipe for Launching Your First App June 6, 2016 You have a great idea for an app that may be a unique twist on existing software or perhaps just building a better mobile mousetrap. One thing’s for sure – there’s nothing like it in the App Store but you wish there were. Where to begin? Everyday I talk to people that have really interesting […] Making of the 7R Mobile App November 23, 2015 7R is short for DRD4-7R, a gene associated with the hunger to explore. Also known as the “adventure gene,” some scientist claim people with this gene are more likely to embrace change and novelty, explore new places and take risks. Suunto – a leading designer and manufacturer of sports instruments – approached us to develop […] Let Iconfactory Build Your Next App February 23, 2015 The Iconfactory is now offering app development services to clients from direction and planning through visual and programmatic design to development, implementation and testing. We’d love to help your business succeed, get in touch! Older posts var dir='https://blog.iconfactory.com/wp-content/themes/ifblog'; var content = []; content.push('\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><img src="' + dir + '/images/features/feature_alien