title = "Get Eight Legs Up on Inktober with Linea Sketch • The Breakroom"
description = "October is creeping in like a stealthy spider, and with it comes time to embrace our favorite creative tradition – Inktober. This annual event beckons artists, from novice to seasoned pros, to grab their pens, brushes, or Apple Pencils and conjure up something creative each day of the month. It’s the perfect opportunity to unleash […]"
full_description = '''The Breakroom Get Eight Legs Up on Inktober with Linea Sketch September 23, 2024 By Ged Maheux October is creeping in like a stealthy spider, and with it comes time to embrace our favorite creative tradition – Inktober. This annual event beckons artists, from novice to seasoned pros, to grab their pens, brushes, or Apple Pencils and conjure up something creative each day of the month. It’s the perfect opportunity to unleash your imagination and face the thrilling challenge of turning daily prompts into hauntingly beautiful sketches. Let’s dive into the spooky fun, one eerie doodle at a time! For the sixth year running, we’re excited to contribute to the Inktober magic by offering a handy set of templates for Linea Sketch, outlining the prompts for all 31 days. This year’s templates are now available for download, with each page clearly labeled by day and prompt, making it easy to stay organized and inspired. Whether you’re aiming for a cohesive set of sketches or just want to keep your daily creations on track, these templates are the perfect tool to keep your creativity sharp and focused throughout the month! As they are every year, Linea’s Inktober 2024 templates are completely free and easy to set up. Be sure to check out our short video tutorial on how to get the templates into Linea Sketch for the iPad, and you’ll quickly be on your artistic way. Don’t forget to tag your posts with #LineaSketch on social media! We love sharing our favorite drawings on Linea’s Instagram throughout October, so it’s the perfect chance to shine. Get your screen protectors ready, charge up those Apple Pencils, and prepare to dive into a month of creativity—October will be haunting us before you know it! Posted in: Apps, Linea Latest News var dir='https://blog.iconfactory.com/wp-content/themes/ifblog'; var content = []; content.push('\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><img src="' + dir + '/images/features/feature_alien.jpg" /></a>\ <a href=