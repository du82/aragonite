full_description = '''The Breakroom Category: Design Tapestry: Past, Present, and Future February 25, 2025 After a successful Kickstarter campaign, and ten months of development, Tapestry is finally an App Store reality. Tapestry presents content in chronological order, with no algorithm or other person deciding what you should or shouldn’t see. Content can come from social media services like Bluesky, Mastodon, or Tumblr, as well as RSS feeds, podcasts, YouTube […] Enter Tapestry February 4, 2025 We’ve been making apps for decades and have acquired the skills to build all sorts of great things. But even talented teams can be challenged, and our latest product has been the hardest yet. I’m talking about Tapestry. It’s taken ten months since 3,369 folks agreed that the idea of putting all the things you follow […] Thinking Outside the Box with MuseBox July 16, 2024 Sometimes a design project can hit a roadblock and stall out – a point where for some reason it becomes difficult to leap over a certain potential solution in order to arrive at an even better one. Brushed Pixel came to us for help with this very situation. They had developed a solid starting point […] Welcome to the New Iconfactory.com January 9, 2024 We are terrible at tooting our own horn. Someone recently was excited to learn we offered design services to clients – something we’ve been doing for over 25 years and is a significant part of our business. It was clearly time for a refresh of iconfactory.com so we could highlight that aspect of our work. […] Happy Anniversary, xScope! November 14, 2023 Twenty years ago today, we released a new product. To say that product has been a success would be an understatement. It’s been an essential part of a workflow for tens of thousands of folks. It’s also an app that has evolved with our desktop environments over the years: it predates responsive web design, Retina […] Announcing Linea Sketch 4.3 November 7, 2023 The latest update to Linea Sketch is now availabl