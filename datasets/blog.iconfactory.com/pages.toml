full_description = '''The Breakroom Category: Website The Year In Review for 2024 December 23, 2024 As we enter our 29th year in business (holy cow!) we once again turn to look back at where we’ve been and, of course, where we’re headed. This past year has been full of discoveries, challenges, and change. We kicked the year off with a much-needed re-design of Iconfactory.com, bringing our app design services for […] Developers, Developers, Develop! January 12, 2024 Two of our most popular developer tools were updated this week. It’s not just our website that’s getting the love! xScope Our primary focus with xScope version 4.7 was to update the screen recording code. Alerts in the Sonoma beta gave us pause and we noticed an increase in crashes with the older APIs. There […] Welcome to the New Iconfactory.com January 9, 2024 We are terrible at tooting our own horn. Someone recently was excited to learn we offered design services to clients – something we’ve been doing for over 25 years and is a significant part of our business. It was clearly time for a refresh of iconfactory.com so we could highlight that aspect of our work. […] The Year In Review for 2023 December 13, 2023 What a year! Right off the bat, we could tell that the new year wouldn’t be pulling any punches as one of our most beloved and important applications, Twitterrific, was forced into early retirement by Elon Musk. Last January seems like a lifetime ago, but the sting of having to shutter Ollie, and the revenue […] The Year In Review for 2022 December 16, 2022 More than any other year in recent memory, 2022 brought big changes—some good, some bad, and some sad. During our 25 years in business we’ve learned to roll with all manner of punches and continue forging ahead. This year was no different. Old Friends This year brought a string of notable updates to some of […] Corey B. Marion 1967 ~ 2022 May 31, 2022 Last week we paused to remember the life, art and legacy of Corey Marion, our beloved friend and Iconfactory founder who passed away on Sunday, May 22nd. Corey was a kind, talented and amazing person who touched the lives of all who knew him by his digital creations and generous deeds. We love you now […] Year In Review for 2021 December 21, 2021 Another year has come to a close and it’s time to reflect on our accomplishments over the past fifty-two weeks. Spoiler alert: It’s a lot! The year 2021 was full of major milestones as we crafted a new and exciting chapter in the life of our very first game, celebrated 25 years in business, continued […] Year In Review for 2019 December 19, 2019 As we once again close out the year, and decade, here at the Iconfactory, we’d like to reflect back on all our accomplishments and look forward to the next year. Our 23rd year in business was a mix of familiar favorites and exciting new ground, as we laid foundations for making a sustainable business in […] Patreon: One Month In April 5, 2019 One month ago today, we launched a grand experiment to bring our fans amazing wallpapers, icons, and avatars using a brand new Patreon account. So how’s it going? It’s only been a short time, but we already feel like we’ve gotten our pixelated grooves back. We didn’t realize just how much we’ve missed creating these […] Advertising with Ollie January 22, 2019 When it comes to online advertising, the big question has always been: how do I get the most bang for the least bucks? If you’re a small developer with a limited budget (like we are), then you’re accustomed to carefully picking and choosing how and where to promote your product to reach the widest possible […] Older posts var dir='https://blog.iconfactory.com/wp-content/themes/ifblog'; var content = []; content.push('\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><img src="' + dir + '/images/features/feature_alien.jpg" /></a>\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><h5>The Iconography <br />of &apos;Alien&apos;</h5></a>\ <p>\ The past, present, and sci-fi 