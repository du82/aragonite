title = "22 Years Later… • The Breakroom"
description = "… iPulse is available on another platform! We released the first version of iPulse on a new operating system called Mac OS X in 2002. Our unobtrusive and stylish system monitor showcased the features of Apple’s new OS and was a hit. Now, two decades later, we’re happy to announce that groundbreaking product is coming […]"
full_description = '''The Breakroom 22 Years Later… March 12, 2024 By Craig Hockenberry … iPulse is available on another platform! We released the first version of iPulse on a new operating system called Mac OS X in 2002. Our unobtrusive and stylish system monitor showcased the features of Apple’s new OS and was a hit. Now, two decades later, we’re happy to announce that groundbreaking product is coming to iOS and iPadOS. And just as it did with macOS, it’s taking a new approach with its user interface to get the job done. An app that can monitor your device is a great thing to have when you need it, but can get in the way when you don’t. On iOS we solved this problem by using Picture in Picture technology. iPulse for iOS/iPadOS literally creates a movie of what’s going on inside your device and updates it every second. You can resize the display to fit well on your screen, or slide it out of the way completely. We were careful to use minimal system resources, such as CPU (3% usage) and memory (only 1 MB in size), while making the video. iPulse provides answers to a lot of questions that were previously hard to figure out: Why does playing this game use so much battery?Why is this download taking so long?Is anything syncing?How much more video can I record on an external drive?And more… The movie that’s playing also generates sound effects: there are alert tones when CPU, network, or storage are exceeded. These sounds can be turned off in the app settings. iPulse also provides an alternate view of your storage: the display you’re used to seeing in Settings > General > Storage does not include cached data used by iCloud and other apps. iPulse shows how much actual space is being used. It also provides a view of external storage – very handy if you’re recording video and quickly filling an external drive. You can learn more about iPulse on the product website. The app is a one-time purchase that will run on both your iPhone and iPad. It’s a tool no developer or power user should be without: download it today! Posted in: iPulse Latest News var dir='https://blog.iconfactory.com/wp-content/themes/ifblog'; var content = []; content.push('\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><img src="' + dir + '/images/features/feature_alien.jpg" /></a>\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><h5>The Iconography <br />of &apos;Alien&apos;</h5></a>\ <p>\ The past, present, and sci-fi future come together as Dave Brasgalla explores \ iOS 7 and the iconography of \'Alien\'.\ </p>\ <p><a href="/2013/10/ios-7-and-the-iconography-of-alien/">Read more...</a></p>\ '); content.push('\ <a href="/2015/11/the-new-favicon/"><img src="' + dir + '/images/features/feature_favicon.png" /></a>\ <a href="/2015/11/the-new-favicon/"><h5>The New Favicon</h5></a>\ <p>\ The SVG icon used for pinned tabs in Safari 9 presents unique challenges for web designers. \ Learn a few tips and tricks as we examine how we handled those challenges in our revision \ of the Iconfactory favicon.\ </p>\ <p><a href="/2015/11/the-new-favicon/">Read more...</a></p>\ '); content.push('\ <a href="/2018/03/a-lot-can-happen-in-a-decade/"><img src="' + dir + '/images/features/feature_iosanniversary.jpg" /></a>\ <a href="/2018/03/a-lot-can-happen-in-a-decade/"><h5>A Decade of iOS</h5></a>\ <p>\ Learn about the early history of the software that changed the lives of \ so many people: Craig Hockenberry on the launch of the iOS SDK.\ </p>\ <p><a href="/2018/03/a-lot-can-happen-in-a-decade/">Read more...</a></p>\ '); var min = 0; var max = content.length - 1; var index = Math.floor(Math.random() * (max - min + 1)) + min; document.write(content[index]);'''
