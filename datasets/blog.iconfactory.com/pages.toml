title = "Time To Get Started • The Breakroom"
description = "What an amazing ride this past month has been! We appreciate the support of everyone who backed our Project Tapestry Kickstarter as well as those who helped us spread the word far and wide. We couldn’t have reached our goals without your help and we’re so very excited to have an opportunity to bring Project Tapestry to […]"
full_description = '''The Breakroom Time To Get Started March 6, 2024 By Ged Maheux What an amazing ride this past month has been! We appreciate the support of everyone who backed our Project Tapestry Kickstarter as well as those who helped us spread the word far and wide. We couldn’t have reached our goals without your help and we’re so very excited to have an opportunity to bring Project Tapestry to life. Thanks to you, the project is not only funded, but we even hit our first two stretch goals, which means we’ll be integrating muffling, muting, filtering, search and more, right from the start. We’ve already begun working on design and development during the Kickstarter campaign, so we’re well on our way to making Tapestry a reality. If you backed the campaign keep an eye on your email over the next few weeks and months regarding rewards and various Tapestry related goodness. You won’t want to miss out! Be sure to follow us here at the Breakroom and on our Mastodon and Threads social media accounts for updates on Tapestry’s progress. Stay tuned – we’re just getting started and there’s a lot more to come. Posted in: Apps, Tapestry Latest News var dir='https://blog.iconfactory.com/wp-content/themes/ifblog'; var content = []; content.push('\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><img src="' + dir + '/images/features/feature_alien.jpg" /></a>\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><h5>The Iconography <br />of &apos;Alien&apos;</h5></a>\ <p>\ The past, present, and sci-fi future come together as Dave Brasgalla explores \ iOS 7 and the iconography of \'Alien\'.\ </p>\ <p><a href="/2013/10/ios-7-and-the-iconography-of-alien/">Read more...</a></p>\ '); content.push('\ <a href="/2015/11/the-new-favicon/"><img src="' + dir + '/images/features/feature_favicon.png" /></a>\ <a href="/2015/11/the-new-favicon/"><h5>The New Favicon</h5></a>\ <p>\ The SVG icon used for pinned tabs in Safari 9 presents unique challenges for web designers. \ Learn a