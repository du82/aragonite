full_description = '''The Breakroom Linea Sketch 4.3.2 Brings Quick Background Colors April 30, 2024 By Ged Maheux Today’s update to Linea Sketch for the iPad brings a great new feature that makes customizing the appearance of the canvas easier than ever. Simply open the Layers palette, select background options > Custom Background and use the new eyedropper tool to select any color in your drawing. The canvas changes in real time to reflect your choice. It’s a perfect way to experiment and find just the right background for your sketch. Linea also keeps a running list of recent colors in case you want to revert to an earlier choice at any time. Linea Sketch 4.3.2 also fixes several important bugs when drawing with Clear Ink, corrects annoying problems with time-lapse recordings and fixes a bug that broke tool options on the iPhone when full Keyboard Access is turned on. Visit Linea’s version history page for the complete list of what’s new, and then head on over to the App Store and grab the FREE download of Linea Sketch. Posted in: Apps, Linea Latest News var dir='https://blog.iconfactory.com/wp-content/themes/ifblog'; var content = []; content.push('\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><img src="' + dir + '/images/features/feature_alien.jpg" /></a>\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><h5>The Iconography <br />of &apos;Alien&apos;</h5></a>\ <p>\ The past, present, and sci-fi future come together as Dave Brasgalla explores \ iOS 7 and the iconography of \'Alien\'.\ </p>\ <p><a href="/2013/10/ios-7-and-the-iconography-of-alien/">Read more...</a></p>\ '); content.push('\ <a href="/2015/11/the-new-favicon/"><img src="' + dir + '/images/features/feature_favicon.png" /></a>\ <a href="/2015/11/the-new-favicon/"><h5>The New Favicon</h5></a>\ <p>\ The SVG icon used for pinned tabs in Safari 9 presents unique challenges for web designers. \ Learn a few tips and tricks as we examine how we handled those challenges in our revision \ of 