full_description = '''The Breakroom New OS, New Apps! September 15, 2023 By Craig Hockenberry Just a quick post to let you know about updates for our FREE Clicker and Now Playing Plus apps for both iOS 17 and watchOS 10. Clicker, our little counter with a thousands uses, gets two new features on iOS. The first is an interactive widget that lets you see and increment your count on the Home Screen. The other is support for Shortcuts: which means you can now automate your counting, including running a shortcut using the Action Button on your Apple Watch Ultra. We’ve also adopted the new look on watchOS 10, so the app looks completely at home on the new OS. Now Playing Plus, which provides a watch face complication for Now Playing, gets a similar visual treatment and fixes a bug that could prevent the now playing view from appearing correctly. Get your updates today and you’ll be ready for the new OS versions on Monday. And if you enjoy these little apps, make sure to check out our big ones! 😀 Posted in: Clicker, Now Playing Plus Latest News var dir='https://blog.iconfactory.com/wp-content/themes/ifblog'; var content = []; content.push('\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><img src="' + dir + '/images/features/feature_alien.jpg" /></a>\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><h5>The Iconography <br />of &apos;Alien&apos;</h5></a>\ <p>\ The past, present, and sci-fi future come together as Dave Brasgalla explores \ iOS 7 and the iconography of \'Alien\'.\ </p>\ <p><a href="/2013/10/ios-7-and-the-iconography-of-alien/">Read more...</a></p>\ '); content.push('\ <a href="/2015/11/the-new-favicon/"><img src="' + dir + '/images/features/feature_favicon.png" /></a>\ <a href="/2015/11/the-new-favicon/"><h5>The New Favicon</h5></a>\ <p>\ The SVG icon used for pinned tabs in Safari 9 presents unique challenges for web designers. \ Learn a few tips and tricks as we examine how we handled those challenges in our revision \ of the Iconfactory favi