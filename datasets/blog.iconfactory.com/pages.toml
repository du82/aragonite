full_description = '''The Breakroom Category: Tapestry Tapestry: Past, Present, and Future February 25, 2025 After a successful Kickstarter campaign, and ten months of development, Tapestry is finally an App Store reality. Tapestry presents content in chronological order, with no algorithm or other person deciding what you should or shouldn’t see. Content can come from social media services like Bluesky, Mastodon, or Tumblr, as well as RSS feeds, podcasts, YouTube […] Enter Tapestry February 4, 2025 We’ve been making apps for decades and have acquired the skills to build all sorts of great things. But even talented teams can be challenged, and our latest product has been the hardest yet. I’m talking about Tapestry. It’s taken ten months since 3,369 folks agreed that the idea of putting all the things you follow […] Time To Get Started March 6, 2024 What an amazing ride this past month has been! We appreciate the support of everyone who backed our Project Tapestry Kickstarter as well as those who helped us spread the word far and wide. We couldn’t have reached our goals without your help and we’re so very excited to have an opportunity to bring Project Tapestry to […] Project Tapestry’s Home Stretch February 29, 2024 Our Kickstarter to bring Project Tapestry to life is in the final stretch. The base project was funded within the first few days, but we’d love to add even more features. To do that we need to hit some stretch goals! We’re asking for your help one last time to spread the word or back […] Why Tapestry? February 14, 2024 Even in the early days of the Internet, finding and keeping track of the pages you wanted to read could be difficult. Back then, adventurous individuals created their own personal web pages to keep a public log of the latest things happening in their lives. These web logs (aka blogs) spread like wildfire, and soon […] Tapestry Unwoven February 6, 2024 It’s a bold claim to say you can make a universal timeline for the Internet. But you can.