to use: Automatic Backups. Tot now makes sure you have a copy of your notes stored on the local disk as well as in iCloud. Backups are […] Toys for Tot May 28, 2020 We’re happy to announce a new version of Tot with some features frequently requested by the app’s legion of fans. The main focus of today’s release are system extensions that allow Tot to co-exist with other apps. To this end, we’ve added a Sharing extension for both iOS and macOS. Additionally, there’s also a widget […] Tot – A New Kind of Accessibility May 5, 2020 Today we’re happy to announce the release of Tot 1.0.5 for both iOS and macOS. If your eyes work well, there’s not a lot to get excited about. But folks with vision difficulties will have a wholly different outlook. The initial releases of Tot didn’t have great accessibility. We knew it needed improving, but experience […] Dy-nam-ic! February 28, 2020 As an icon designer who’s worked in the field for over 25 years, I’ve pretty much seen it all, and then some. So when a chance comes to do something not only new, but totally unique, I jump at the design challenge. Introducing Tot’s dynamic app icon! One of the most fun features of our […] Meet Tot – Your Tiny Text Companion! February 25, 2020 You have text. Lots of text. A screen full of digital stickies. Your notes app. That scribbled-on napkin tucked in your jacket pocket (you forgot about that, didn’t you?). Tot is here to help. It’s an elegant, simple way to collect and edit text across your Mac, iPhone, and iPad. Use Tot for jotting down […] var dir='https://blog.iconfactory.com/wp-content/themes/ifblog'; var content = []; content.push('\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><img src="' + dir + '/images/features/feature_alien.jpg" /></a>\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><h5>The Iconography <br />of &apos;Alien&apos;</h5></a>\ <p>\ The past, present, and sci-fi future come together as Dave Brasgalla explores \ iOS 7 and the iconography of \'Alien\'.\