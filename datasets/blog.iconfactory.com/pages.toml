["https://blog.iconfactory.com/2025/02/tapestry-by-iconfactory-past-present-and-future"]
title = "Tapestry: Past, Present, and Future • The Breakroom"
description = "After a successful Kickstarter campaign, and ten months of development, Tapestry is finally an App Store reality. Tapestry presents content in chronological order, with no algorithm or other person deciding what you should or shouldn’t see. Content can come from social media services like Bluesky, Mastodon, or Tumblr, as well as RSS feeds, podcasts, YouTube […]"
full_description = '''The Breakroom Tapestry: Past, Present, and Future February 25, 2025 By Cheryl Cicha After a successful Kickstarter campaign, and ten months of development, Tapestry is finally an App Store reality. Tapestry presents content in chronological order, with no algorithm or other person deciding what you should or shouldn’t see. Content can come from social media services like Bluesky, Mastodon, or Tumblr, as well as RSS feeds, podcasts, YouTube channels, and others. All in the palm of your hand with no tracking. Now that Tapestry has launched, we wanted to take a few minutes to share some of the things that happened behind-the-scenes. The Backstory A few folks have asked how we launched a Kickstarter that not only hit its original goal, but nearly doubled it. We knew that we needed a strong concept to gain support. To help us refine our pitch, we worked on a rough prototype that showed us, and others, what was possible. Thankfully, this proof-of-concept convinced our amazing supporters that Tapestry was worth backing. While still in development, we constantly looked at ways to make Tapestry a sustainable product. Our goal has always been for the app to be a source of information and discovery – and we want that to be accessible to the widest possible audience. We had to give users the richest experience and features without gating content. Ultimately, we decided to make the product a free download and fund future work with both sponsored ads and premium features. A Unique Approach to Ads We hate internet advertising and so do you. That’s why we made our own ad network for Twitterrific. With Tapestry, we’ve taken what we learned there and improved it for the better. We’ve worked hard to craft ads that are harmonious, visually appealing, and for things you might want to see or use. But most importantly, we have done all this with your privacy in mind: there is no tracking and there never will be. Sponsorships in Tapestry are tasteful, concise and designed with privacy in mind. As small, independent creators, we know exactly how hard it is to get the word out about the work you’re doing. Our hope is that the community around Tapestry will want to know about exciting indie apps, blogs that are fueled by enthusiasm, and podcasts or YouTube channels that inform and entertain. We’ve also made it easy for folks to follow your work by integrating our Feed Finder into the ads. We know exactly how small the marketing budget is for all of this :-) We’ve strived to keep the price low and the value high. A Big Surprise Several months after funding, and while we were well into Tapestry’s design and development, we received an incredible opportunity. Tumblr contacted us out of the blue with an email that started “Tapestry looks cool” and went on to say they were interested in supporting our efforts with a grant. Wow! After our initial shock and disbelief, we realized that these funds allow us to build an even more robust app than what was possible with just Kickstarter. It also served as the spark for the current sponsorship program in Tapestry. Thanks to Tumblr’s support, we are beyond excited to announce that we’ll soon begin work on what so many folks have asked for: native macOS support! We also have ideas for features that will benefit Tumblr as well as other services. Stand by for more surprises! Gratitude We are beyond grateful to Tumblr and how their support allows us to deliver a better and more robust product. We are also thankful for all the backers who believed in Tapestry’s potential and supported us at launch. Finally, the health of any software product depends on the direct support of paying customers like you. Without these is no bright future for any of our apps, so thank you. Posted in: Apps, Design, Development, Strategic Vision, Tapestry, Uncategorized Latest News var dir='https://blog.iconfactory.com/wp-content/themes/ifblog'; var content = []; content.push('\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><img src="' + dir + '/images/features/feature_alien.jpg" /></a>\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><h5>The Iconography <br />of &apos;Alien&apos;</h5></a>\ <p>\ The past, present, and sci-fi future come together as Dave Brasgalla explores \ iOS 7 and the iconography of \'Alien\'.\ </p>\ <p><a href="/2013/10/ios-7-and-the-iconography-of-alien/">Read more...</a></p>\ '); content.push('\ <a href="/2015/11/the-new-favicon/"><img src="' + dir + '/images/features/feature_favicon.png" /></a>\ <a href="/2015/11/the-new-favicon/"><h5>The New Favicon</h5></a>\ <p>\ The SVG icon used for pinned tabs in Safari 9 presents unique challenges for web designers. \ Learn a few tips and tricks as we examine how we handled those challenges in our revision \ of the Iconfactory favicon.\ </p>\ <p><a href="/2015/11/the-new-favicon/">Read more...</a></p>\ '); content.push('\ <a href="/2018/03/a-lot-can-happen-in-a-decade/"><img src="' + dir + '/images/features/feature_iosanniversary.jpg" /></a>\ <a href="/2018/03/a-lot-can-happen-in-a-decade/"><h5>A Decade of iOS</h5></a>\ <p>\ Learn about the early history of the software that changed the lives of \ so many people: Craig Hockenberry on the launch of the iOS SDK.\ </p>\ <p><a href="/2018/03/a-lot-can-happen-in-a-decade/">Read more...</a></p>\ '); var min = 0; var max = content.length - 1; var index = Math.floor(Math.random() * (max - min + 1)) + min; document.write(content[index]);'''
