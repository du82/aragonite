[…] Time To Get Started March 6, 2024 What an amazing ride this past month has been! We appreciate the support of everyone who backed our Project Tapestry Kickstarter as well as those who helped us spread the word far and wide. We couldn’t have reached our goals without your help and we’re so very excited to have an opportunity to bring Project Tapestry to […] Unlock A World of Stunning Wallpapers with Wallaroo’s Anniversary Sale January 3, 2024 It’s been a little over a year since we launched Wallaroo and to celebrate we’re offering a special discount for new customers. Taking advantage of this sale is easy. Just head to the App Store by opening this link on your iPhone or iPad to receive a 35% discount off the annual subscription price. And don’t wait […] The Year In Review for 2023 December 13, 2023 What a year! Right off the bat, we could tell that the new year wouldn’t be pulling any punches as one of our most beloved and important applications, Twitterrific, was forced into early retirement by Elon Musk. Last January seems like a lifetime ago, but the sting of having to shutter Ollie, and the revenue […] Announcing Linea Sketch 4.3 November 7, 2023 The latest update to Linea Sketch is now available! From textures to thumbnail cropping, version 4.3 is packed with clever new features to make sketching on your iPad easier and more fun than ever. Textures Have Never Been Easier We’ve created a variety of pre-defined seamless textures to let you quickly add visual interest and […] Sketch Fearlessly This Inktober With Linea September 26, 2023 October rears its spooky, pumpkin-spiced head once again and with it comes our favorite way to flex our creative muscles – Inktober. The annual event encourages artists, both amateur and professional alike, to pick up a pencil, brush or stylus and channel their creativity each day in the month of October. It’s a great way […] Older posts var dir='https://blog.iconfactory.com/wp-content/themes/ifblog'; var content = []; content.