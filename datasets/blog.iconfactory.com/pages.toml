["https://blog.iconfactory.com/2024/08/linea-sketch-adds-support-for-apple-pencil-pro"]
title = "Linea Sketch Adds Support for Apple Pencil Pro • The Breakroom"
description = "Today’s update for our handy digital sketching app for the iPad brings Apple Pencil Pro support, including new shortcut squeeze actions and helpful haptic feedback. Choose from a range of sketching shortcuts like toggling Clear Ink on or off, switching to the previous drawing tool, cycling through tool sizes and even undoing the last drawing […]"
full_description = '''The Breakroom Linea Sketch Adds Support for Apple Pencil Pro August 7, 2024 By Ged Maheux Today’s update for our handy digital sketching app for the iPad brings Apple Pencil Pro support, including new shortcut squeeze actions and helpful haptic feedback. Choose from a range of sketching shortcuts like toggling Clear Ink on or off, switching to the previous drawing tool, cycling through tool sizes and even undoing the last drawing action. Squeeze actions work great and we find they are much less likely to be triggered accidentally than the older double-tap Pencil actions. Once you try it, you’ll be hooked! Linea defaults to your system-wide settings for the squeeze action, but you can choose a different action (or ignore squeezes) in Linea’s in-app settings. Today’s 4.3.3 update also enables haptic feedback, giving you a satisfying but subtle bump when performing certain tasks in Linea, such as creating ZipShapes, snapping to rotation angles, scaling selections and more. Linea Sketch 4.3.3 also fixes several important bugs, so it benefits all Linea users, even if you don’t own the new Apple Pencil Pro. Visit Linea’s version history page for the complete list of What’s New, and then head on over to the App Store and grab the FREE download of Linea Sketch. Posted in: Apps, Linea Latest News var dir='https://blog.iconfactory.com/wp-content/themes/ifblog'; var content = []; content.push('\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><img src="' + dir + '/images/features/feature_alien.jpg" /></a>\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><h5>The Iconography <br />of &apos;Alien&apos;</h5></a>\ <p>\ The past, present, and sci-fi future come together as Dave Brasgalla explores \ iOS 7 and the iconography of \'Alien\'.\ </p>\ <p><a href="/2013/10/ios-7-and-the-iconography-of-alien/">Read more...</a></p>\ '); content.push('\ <a href="/2015/11/the-new-favicon/"><img src="' + dir + '/images/features/feature_favicon.png" /></a>\ <a 