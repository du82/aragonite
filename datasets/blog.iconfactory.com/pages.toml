description = "With Inktober now in full swing, we thought it would be a great time for users to take nearly 50% off Linea’s annual subscription price. If you love to draw, sketch, or even just doodle, Linea makes the perfect companion – and now through the end of October, you get half off when you subscribe. […]"
full_description = '''The Breakroom Sketch Your Heart Out This October with Linea’s 50% Off Sale October 8, 2024 By Ged Maheux With Inktober now in full swing, we thought it would be a great time for users to take nearly 50% off Linea’s annual subscription price. If you love to draw, sketch, or even just doodle, Linea makes the perfect companion – and now through the end of October, you get half off when you subscribe. Linea makes sketching fun and easy, and puts your focus on quickly bringing ideas to life. Inktober’s daily drawing prompts are a great, low-key way to explore the app’s features including ZipShapes, texture layers, realistic brushes, and much more. Linea also comes with scores of helpful video tutorials built right into the app or on YouTube to help you get started in a snap. Here are just a few examples of what folks have created with their iPads, Apple Pencil, and Linea Sketch: Linea also creates time-lapse recordings as you draw. These short videos are a great way to pull back the curtain and share your creative process on social media, or directly with friends and family. Whether you’re a seasoned artist or a budding novice, Linea is a great way to draw and explore your creativity! Click this link on your iPhone or iPad to take nearly 50% off the annual subscription cost of Linea Sketch. But don’t wait, we’re only making this promotion available to a limited number of users and only through the end of October. There’s never been a better time to join in on the drawing fun! Posted in: Apps, Linea Latest News var dir='https://blog.iconfactory.com/wp-content/themes/ifblog'; var content = []; content.push('\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><img src="' + dir + '/images/features/feature_alien.jpg" /></a>\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><h5>The Iconography <br />of &apos;Alien&apos;</h5></a>\ <p>\ The past, present, and sci-fi future come together as Dave Brasgalla explores \ iOS 7 and the iconography of \'