title = "State of the Twitterverse • The Breakroom"
description = "Last night at about 7:30pm PST, Twitterrific customers started reporting problems accessing Twitter via the iOS app. News quickly spread on Twitter and Mastodon that a wide range of third party apps like Twitterrific, Tweetbot, Echofon, and many others had been disabled. Strangely, Twitterrific for macOS continues to work normally. We cannot say for certain […]"
full_description = '''The Breakroom State of the Twitterverse January 13, 2023 By Ged Maheux Last night at about 7:30pm PST, Twitterrific customers started reporting problems accessing Twitter via the iOS app. News quickly spread on Twitter and Mastodon that a wide range of third party apps like Twitterrific, Tweetbot, Echofon, and many others had been disabled. Strangely, Twitterrific for macOS continues to work normally. We cannot say for certain why some clients are unaffected, but it seems possible that there is a new (seemingly unstated and unannounced) policy that is only being applied to apps with large numbers of users. There’s been no official word from Twitter about what’s going on, but that’s unsurprising since the new owner eliminated the employees dedicated to keeping the API up and running smoothly, including the developer evangelists who previously provided communication with third-parties. We wouldn’t know whom to reach out to at Twitter even if such people existed. We’re in the dark just as much as you are, sadly. As soon as we have a better understanding of what has happened, we’ll update this blog post and let you know. In the meantime, if you own a Mac you can use Twitterrific for macOS (but we don’t know how much longer this will last). You can also follow @iconfactory on Twitter or find several of us on Mastodon: Ged, Sean, Craig, Talos and Anthony We’d also like to say thank you to all the people who have reached out to us on Twitter and told us how much they appreciate Twitterrific and our dedication to making Twitter usable over the years. These kind words mean a great deal to every one of us here at the Iconfactory. Quite honestly we wouldn’t be where we are today without your support of our apps like Twitterrific. Stay tuned and beaks up! Updated January 17th, 2023: We still have not received any clear communication as to why Twitter deactivated Twitterrific on January 13th. We have been respectful of their API rules, as published, for the past 16 years. We have no knowledge that these rules have changed recently or what those changes might be. Posted in: Apps, Twitterrific Latest News var dir='https://blog.iconfactory.com/wp-content/themes/ifblog'; var content = []; content.push('\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><img src="' + dir + '/images/features/feature_alien.jpg" /></a>\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><h5>The Iconography <br />of &apos;Alien&apos;</h5></a>\ <p>\ The past, present, and sci-fi future come together as Dave Brasgalla explores \ iOS 7 and the iconography of \'Alien\'.\ </p>\ <p><a href="/2013/10/ios-7-and-the-iconography-of-alien/">Read more...</a></p>\ '); content.push('\ <a href="/2015/11/the-new-favicon/"><img src="' + dir + '/images/features/feature_favicon.png" /></a>\ <a href="/2015/11/the-new-favicon/"><h5>The New Favicon</h5></a>\ <p>\ The SVG icon used for pinned tabs in Safari 9 presents unique challenges for web designers. \ Learn a few tips and tricks as we examine how we handled those challenges in our revision \ of the Iconfactory favicon.\ </p>\ <p><a href="/2015/11/the-new-favicon/">Read more...</a></p>\ '); content.push('\ <a href="/2018/03/a-lot-can-happen-in-a-decade/"><img src="' + dir + '/images/features/feature_iosanniversary.jpg" /></a>\ <a href="/2018/03/a-lot-can-happen-in-a-decade/"><h5>A Decade of iOS</h5></a>\ <p>\ Learn about the early history of the software that changed the lives of \ so many people: Craig Hockenberry on the launch of the iOS SDK.\ </p>\ <p><a href="/2018/03/a-lot-can-happen-in-a-decade/">Read more...</a></p>\ '); var min = 0; var max = content.length - 1; var index = Math.floor(Math.random() * (max - min + 1)) + min; document.write(content[index]);'''
