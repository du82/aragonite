etch from the App Store. Flare Now 50% Off for a Limited Time April 6, 2015 Flare 2 for Mac OS X is currently 50% off it’s normal price of $15 USD for a limited time as part of the Mac App Store’s Amazing Photo + Video promotion. var dir='https://blog.iconfactory.com/wp-content/themes/ifblog'; var content = []; content.push('\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><img src="' + dir + '/images/features/feature_alien.jpg" /></a>\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><h5>The Iconography <br />of &apos;Alien&apos;</h5></a>\ <p>\ The past, present, and sci-fi future come together as Dave Brasgalla explores \ iOS 7 and the iconography of \'Alien\'.\ </p>\ <p><a href="/2013/10/ios-7-and-the-iconography-of-alien/">Read more...</a></p>\ '); content.push('\ <a href="/2015/11/the-new-favicon/"><img src="' + dir + '/images/features/feature_favicon.png" /></a>\ <a href="/2015/11/the-new-favicon/"><h5>The New Favicon</h5></a>\ <p>\ The SVG icon used for pinned tabs in Safari 9 presents unique challenges for web designers. \ Learn a few tips and tricks as we examine how we handled those challenges in our revision \ of the Iconfactory favicon.\ </p>\ <p><a href="/2015/11/the-new-favicon/">Read more...</a></p>\ '); content.push('\ <a href="/2018/03/a-lot-can-happen-in-a-decade/"><img src="' + dir + '/images/features/feature_iosanniversary.jpg" /></a>\ <a href="/2018/03/a-lot-can-happen-in-a-decade/"><h5>A Decade of iOS</h5></a>\ <p>\ Learn about the early history of the software that changed the lives of \ so many people: Craig Hockenberry on the launch of the iOS SDK.\ </p>\ <p><a href="/2018/03/a-lot-can-happen-in-a-decade/">Read more...</a></p>\ '); var min = 0; var max = content.length - 1; var index = Math.floor(Math.random() * (max - min + 1)) + min; document.write(content[index]);'''
