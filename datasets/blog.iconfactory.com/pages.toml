full_description = '''The Breakroom Category: Strategic Vision Tapestry: Past, Present, and Future February 25, 2025 After a successful Kickstarter campaign, and ten months of development, Tapestry is finally an App Store reality. Tapestry presents content in chronological order, with no algorithm or other person deciding what you should or shouldn’t see. Content can come from social media services like Bluesky, Mastodon, or Tumblr, as well as RSS feeds, podcasts, YouTube […] Enter Tapestry February 4, 2025 We’ve been making apps for decades and have acquired the skills to build all sorts of great things. But even talented teams can be challenged, and our latest product has been the hardest yet. I’m talking about Tapestry. It’s taken ten months since 3,369 folks agreed that the idea of putting all the things you follow […] The Year In Review for 2024 December 23, 2024 As we enter our 29th year in business (holy cow!) we once again turn to look back at where we’ve been and, of course, where we’re headed. This past year has been full of discoveries, challenges, and change. We kicked the year off with a much-needed re-design of Iconfactory.com, bringing our app design services for […] Welcome to the New Iconfactory.com January 9, 2024 We are terrible at tooting our own horn. Someone recently was excited to learn we offered design services to clients – something we’ve been doing for over 25 years and is a significant part of our business. It was clearly time for a refresh of iconfactory.com so we could highlight that aspect of our work. […] The Year In Review for 2023 December 13, 2023 What a year! Right off the bat, we could tell that the new year wouldn’t be pulling any punches as one of our most beloved and important applications, Twitterrific, was forced into early retirement by Elon Musk. Last January seems like a lifetime ago, but the sting of having to shutter Ollie, and the revenue […] The Year In Review for 2022 December 16, 2022 More than any other year in recent memory, 2022 brought big changes—some good, some bad, and some sad. During our 25 years in business we’ve learned to roll with all manner of punches and continue forging ahead. This year was no different. Old Friends This year brought a string of notable updates to some of […] Corey B. Marion 1967 ~ 2022 May 31, 2022 Last week we paused to remember the life, art and legacy of Corey Marion, our beloved friend and Iconfactory founder who passed away on Sunday, May 22nd. Corey was a kind, talented and amazing person who touched the lives of all who knew him by his digital creations and generous deeds. We love you now […] Celebrating Our Silver Pixel Anniversary June 22, 2021 Twenty five years ago this week, Talos, Corey, and I first pushed pixels into icons of our favorite Star Wars, Star Trek, and cartoon characters and published them under the name Iconfactory (Icnfactory, actually). So much has happened since then, both with the company and the world in which we live, that it would be […] Year In Review for 2019 December 19, 2019 As we once again close out the year, and decade, here at the Iconfactory, we’d like to reflect back on all our accomplishments and look forward to the next year. Our 23rd year in business was a mix of familiar favorites and exciting new ground, as we laid foundations for making a sustainable business in […] Linea 2.8 and Beyond December 2, 2019 Older posts var dir='https://blog.iconfactory.com/wp-content/themes/ifblog'; var content = []; content.push('\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><img src="' + dir + '/images/features/feature_alien.jpg" /></a>\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><h5>The Iconography <br />of &apos;Alien&apos;</h5></a>\ <p>\ The past, present, and sci-fi future come together as Dave Brasgalla explores \ iOS 7 and the iconography of \'Alien\'.\ </p>\ <p><a href="/2013/10/ios-7-and-the-iconography-of-alien/">Read more...</a></p>\ '); content.push('\ <a href="/2015/11/the-new-fa