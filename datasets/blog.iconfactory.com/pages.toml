["https://blog.iconfactory.com/2024/12/the-year-in-review-for-2024"]
title = "The Year In Review for 2024 • The Breakroom"
description = "As we enter our 29th year in business (holy cow!) we once again turn to look back at where we’ve been and, of course, where we’re headed. This past year has been full of discoveries, challenges, and change. We kicked the year off with a much-needed re-design of Iconfactory.com, bringing our app design services for […]"
full_description = '''The Breakroom The Year In Review for 2024 December 23, 2024 By Ged Maheux As we enter our 29th year in business (holy cow!) we once again turn to look back at where we’ve been and, of course, where we’re headed. This past year has been full of discoveries, challenges, and change. We kicked the year off with a much-needed re-design of Iconfactory.com, bringing our app design services for clients into focus. The new site showcases our collective expertise in user interface design and branding, helping us connect with fellow developers who are looking to stand out in a crowded App Store. The re-designed site was a catalyst for new work in 2024 and reminded us of our passion for helping clients launch, re-imagine, and brand amazing apps. Up, Up & Away! This past year saw updates to several of our software products. In March we released a new version of Linea Sketch, adding the ability to quickly customize background and canvas colors. In August, we added support for the Apple Pencil Pro, and that’s changed the way we draw and create in Linea Sketch. In the coming year we’re looking forward to finding out if the rumors of a larger, foldable iPad are true, and what that may mean for Linea’s future. In April we introduced a helpful and groundbreaking update to iPulse, our system monitoring app for iOS. iPulse 1.1 uses Apple’s picture-in-picture technology to give you a real-time glance at what’s happening behind the scenes on your iPhone or iPad. iPulse’s picture-in-picture gauges give you a unique view under the hood of iOS. iPulse lets you track processors, network, memory, and storage space as they are constantly monitored and displayed in a convenient graph that floats above everything else on the screen. It’s is a great way to troubleshoot problems and get a bird’s eye view of what’s happening behind the scenes on both macOS and iOS. The Year of Tapestry If we could sum up 2024 in a single word it would have to be “Tapestry”. Bringing our new social media app to life has been our primary focus and driving force this year. The vision of Project Tapestry began with the Kickstarter back in January, which was quickly funded by March. Since then, we’ve been working each and every week to realize the promise of a unified, chronological timeline for all your favorite Internet content. From the outset we knew that Tapestry’s potential would be one of the biggest development challenges we’ve faced, and unsurprisingly, we were right. There’s a saying we toss around on Slack – “If it’s easy, it ain’t Tapestry™”. From its complex user interface design to syncing content across disparate social and internet services, Tapestry has continually asked us to rise to the challenge. Despite this, we’ve had tons of fun bringing it to life and have been delighted for Fridays when the weekly TestFlight builds go out to happy Kickstarter backers. We also enjoyed pushing tens of thousands of pixels for the portraits we delivered throughout the year; delivering the last ones to patient supporters just this past week. We’re in the Tapestry homestretch now and proud of what we’ve spent the year creating. We sincerely hope you’ll check it out when it comes to the App Store in early 2025. Stay tuned just a little bit longer! The Road Ahead As we journey into the new year, we’re very much looking forward to launching Tapestry as well as updating our other apps that have been patiently waiting in the wings. We’ll also be releasing new wallpapers for Wallaroo and Patreon each and every week just as we did in 2024. If you’re looking for a last minute gift, year’s worth of wallpapers for that special someone might fit the bill! We look forward to continuing our work with clients old and new to help them create beautifully designed apps, icons, and promo images. Like the rest of you, we don’t know what 2025 holds for us, but we’re excited to find out. We hope you’ll join us, once again, as we venture into that undiscovered country together. Stay well and happy holidays, everyone! Posted in: Apps, Strategic Vision, Website Latest News var dir='https://blog.iconfactory.com/wp-content/themes/ifblog'; var content = []; content.push('\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><img src="' + dir + '/images/features/feature_alien.jpg" /></a>\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><h5>The Iconography <br />of &apos;Alien&apos;</h5></a>\ <p>\ The past, present, and sci-fi future come together as Dave Brasgalla explores \ iOS 7 and the iconography of \'Alien\'.\ </p>\ <p><a href="/2013/10/ios-7-and-the-iconography-of-alien/">Read more...</a></p>\ '); content.push('\ <a href="/2015/11/the-new-favicon/"><img src="' + dir + '/images/features/feature_favicon.png" /></a>\ <a href="/2015/11/the-new-favicon/"><h5>The New Favicon</h5></a>\ <p>\ The SVG icon used for pinned tabs in Safari 9 presents unique challenges for web designers. \ Learn a few tips and tricks as we examine how we handled those challenges in our revision \ of the Iconfactory favicon.\ </p>\ <p><a href="/2015/11/the-new-favicon/">Read more...</a></p>\ '); content.push('\ <a href="/2018/03/a-lot-can-happen-in-a-decade/"><img src="' + dir + '/images/features/feature_iosanniversary.jpg" /></a>\ <a href="/2018/03/a-lot-can-happen-in-a-decade/"><h5>A Decade of iOS</h5></a>\ <p>\ Learn about the early history of the software that changed the lives of \ so many people: Craig Hockenberry on the launch of the iOS SDK.\ </p>\ <p><a href="/2018/03/a-lot-can-happen-in-a-decade/">Read more...</a></p>\ '); var min = 0; var max = content.length - 1; var index = Math.floor(Math.random() * (max - min + 1)) + min; document.write(content[index]);'''
