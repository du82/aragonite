full_description = '''The Breakroom Category: Twitterrific Twitterrific: End of an Era January 19, 2023 Twitterrific has been discontinued. A sentence that none of us wanted to write, but have long felt would need to be written someday. We didn’t expect to be writing it so soon, though, and certainly not without having had time to notify you that it was coming. We are sorry to say that the app’s […] State of the Twitterverse January 13, 2023 Last night at about 7:30pm PST, Twitterrific customers started reporting problems accessing Twitter via the iOS app. News quickly spread on Twitter and Mastodon that a wide range of third party apps like Twitterrific, Tweetbot, Echofon, and many others had been disabled. Strangely, Twitterrific for macOS continues to work normally. We cannot say for certain […] Twitterrific – What’s On The Menu? May 17, 2021 Today’s update of Twitterrific for iOS modernizes menus, tweaks navigation structure, and improves some long-standing design limitations. All of the changes in this release are free and geared to make Twitterrific even easier to use. Main navigation has moved from the top to the bottom on both the iPhone and iPad screens. There are many […] Family Sharing Is A Go! December 9, 2020 Ever since Apple announced last June that family sharing would be extended to include subscriptions and in-app purchases, we’ve been anxiously awaiting its availability. Today, we’re pleased to announce that family sharing of subscriptions and in-app purchases has been enabled in Triode, Twitterrific and Linea Sketch. This means that if you subscribe to any the […] Say Hello to Our Thready Little Friend January 24, 2020 Year In Review for 2019 December 19, 2019 As we once again close out the year, and decade, here at the Iconfactory, we’d like to reflect back on all our accomplishments and look forward to the next year. Our 23rd year in business was a mix of familiar favorites and exciting new ground, as we laid foundations for making a sustainable business in […] The Swipe Stuff December 13, 2019 For many years, Twitterrific on iOS used a relatively simple custom presentation for modal popup views such as conversation threads and profiles. With the release of iOS 13, Apple changed the design of standard modal popup views to have a more card-like appearance and behavior. With this change, our custom popups still worked, but they […] Twitterrific Subscriptions Going Well November 22, 2019 Back in June, we launched Twitterrific 6 with over 30 new and long-requested features from our users. We also switched from a one-time in-app purchase to a subscription to help support ongoing development. It’s been 5 months since the switch, so we wanted to let you know how’s it’s been going. In short, it’s going […] Twitterrific 6.1 – Multi-Window! October 24, 2019 Ever since iOS 13 was officially launched back on September 19th, we’ve been hard at work whipping Twitterrific into shape for the new operating system. Today’s update brings some amazing new features including automatic theme switching, improved visual styling and most notably support for multiple windows on iPad. We can’t tell you how happy we […] It’s Hip to Be Square! September 6, 2019 Back in the day all of us here at the Iconfactory lived, ate, and slept customization. If there was a way to change the appearance of something on our desktops, from icons to wallpapers and even the Mac’s overall look and feel, we forged ahead and changed it. Indeed, we built our early business around […] Older posts var dir='https://blog.iconfactory.com/wp-content/themes/ifblog'; var content = []; content.push('\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><img src="' + dir + '/images/features/feature_alien.jpg" /></a>\ <a href="/2013/10/ios-7-and-the-iconography-of-alien/"><h5>The Iconography <br />of &apos;Alien&apos;</h5></a>\ <p>\ The past, present, and sci-fi future come together as Dave Brasgalla explores \ iOS 7 and the iconography of \'Alien\'.\ </p>\ <p><a 