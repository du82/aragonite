title = "JOIN OUR TEAM – IOActive"
description = """
Making the world a safer and more secure place. 
It’s our mission, plain and simple. It drives everything we do – from research to client work to community involvement. And it unifies our global team into an elite force with integrity, fierce passion, and relentless creativity that doesn’t just “push the envelope” or “think outside the box.” We shred the envelope, crush the box, and we have fun doing it. We are always looking for people who share our mission to join us."""
full_description = "JOIN OUR TEAM It’s what we do together that sets us apart. OUR MISSION UNITES US Making the world a safer and more secure place. It’s our mission, plain and simple. It drives everything we do – from research to client work to community involvement. And it unifies our global team into an elite force with integrity, fierce passion, and relentless creativity that doesn’t just “push the envelope” or “think outside the box.” We shred the envelope, crush the box, and we have fun doing it. We are always looking for people who share our mission to join us. OUR PEOPLE MATTER MOST Embracing a culture of diversity and learning. You make a difference in the lives of our clients. We want to make a difference in yours. We don’t stop at traditional benefits. We strive to build a culture that challenges the status quo to create an environment where everyone can thrive and grow. Training, team events, flexible work hours and locations, supporting research interests are just a few of the ways we bring together and empower a team from every walk of life. Join our team"
