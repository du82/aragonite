["https://blog.isa.org/author/claudia-vergueiro-massei"]
title = "ISA Interchange | Claudia Vergueiro Massei"
description = "Claudia Vergueiro Massei is an executive manager committed to enabling the digital transformation in Oman and to contributing to its economic development, while building up skilled local workforce in the Sultanate. As Siemens Oman CEO, Claudia drives business in key growth areas, including power generation, transmission and distribution, oil & gas, automation, manufacturing and smart building technologies. She assumed her role after working with Siemens in Germany, Denmark and China for various business lines. Originally from Brazil, she commenced her career in strategy consulting, undertaking assignments in France, Morocco, South Africa and the United States, besides her home country. She has subsequently co-founded a SaaS (software as a service) edtech startup in Brazil, which she ran for a couple of years before joining Siemens. In her free time, Claudia enjoys to dance, travel and learn about different cultures, as well as to mentor young entrepreneurs. Claudia holds an aeronautical engineering degree from Instituto Tecnologico de Aeronautica, an MBA from the Wharton School, and an MA in international studies from the Lauder Institute, University of Pennsylvania."
