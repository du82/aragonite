["https://blog.isa.org/ask-the-automation-pros-achieving-the-best-feedforward-control"]
title = "Ask the Automation Pros: Achieving the Best Feedforward Control"
description = "In the latest installment of Ask the Automation Pros, discover best practices to understand where feedforward control is needed and how to implement it."
full_description = 'This blog covers numerous topics on industrial automation such as operations & management, continuous & batch processing, connectivity, manufacturing & machine control, and Industry 4.0. The material and information contained on this website is for general information purposes only. ISA blog posts may be authored by ISA staff and guest authors from the automation community. Views and opinions expressed by a guest author are solely their own, and do not necessarily represent those of ISA. Posts made by guest authors have been subject to peer review. The following discussion is part of an occasional series, "Ask the Automation Pros," authored by Greg McMillan, industry consultant, author of numerous process control books and 2010 ISA Life Achievement Award recipient. Program administrators will collect submitted questions and solicit responses from automation professionals. Past Q&A videos are available on the ISA YouTube channel; you can view the playlist here. You can read posts from this series here. Looking for additional career guidance, or to offer support to those new to automation? Sign up for the ISA Mentor Program. Where are the best practices to 1) understand where feedforward control is needed, and 2) how to implement it? I experience that feedforward (FF) control added to the feedback (FB) control does a good job of pre-compensating control action. It is a powerful technique. Control texts typically use Laplace transforms to derive a dynamic compensator from additive signals from block diagrams, representing first order plus dead time (FOPDT) models of how the manipulated variable (MV) and disturbance affect the process. But: I ask this question because there are many aspects of implementation practice that were never addressed in the mathematical underpinning of college texts or courses, and the control engineer must scramble to catch up. In my experience, it was a mentor (Harold Wade) who revealed the issues. I also found product bulletins on devices, postings from experts on their websites and some of the ISA books to be very helpful. I came to understand FF with FB through simulation where I wrote the code and watched how variable changed in time.'
author = "Greg McMillan"
year_published = 2025
year_updated = 2025
clearnet = "https://blog.isa.org/ask-the-automation-pros-achieving-the-best-feedforward-control"
