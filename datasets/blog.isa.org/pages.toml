["https://blog.isa.org/28-april-is-international-automation-professionals-day"]
title = "28 April is International Automation Professionals Day!"
description = "The importance of automation professionals ahead of the upcoming International Automation Professionals Day on April 28th, 2022."
full_description = "This blog covers numerous topics on industrial automation such as operations & management, continuous & batch processing, connectivity, manufacturing & machine control, and Industry 4.0. The material and information contained on this website is for general information purposes only. ISA blog posts may be authored by ISA staff and guest authors from the automation community. Views and opinions expressed by a guest author are solely their own, and do not necessarily represent those of ISA. Posts made by guest authors have been subject to peer review. In my last article, I talked about ISA members and volunteers. Today, I will discuss the importance of automation professionals and give a preview of International Automation Professionals Day which will be commemorated on ISA's founding day, 28 April 2022. Merriam-Webster dictionary defines automation as, “the technique of making an apparatus, a process, or a system operate automatically.” It’s not hard to tell that automation provides benefits to virtually all aspects of the industry. ISA defines automation as, “the creation and application of technology to monitor and control the production and delivery of products and services.” Automation encompasses many vital elements, systems, and job functions. From installation and integration to maintenance and design, procurement, and management—the automation industry comprises a variety of job functions. Marketing and sales play a vital role in the automation industry as well. Automation involves a very broad range of technologies, including instrumentation; process measurement and control; sensors; programmable logic controllers (PLCs); and distributed control systems (DCS). Automation may also include robotics and expert systems,; telemetry and communications; electro-optics; cybersecurity; wireless applications; systems integration; test measurement, and more. Automation professionals are responsible for solving complex problems in vital areas of the industry and its processes. Their work is critically important to preserving the health, safety, and welfare of the public, while also contributing to the sustainability and enhancement of our quality of life."
author = "Carlos Mandolesi"
