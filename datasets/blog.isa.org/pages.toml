["https://blog.isa.org/ask-the-automation-pros-achieving-the-best-override-control"]
title = "Ask the Automation Pros: Achieving the Best Override Control"
description = "The latest installment in the Ask the Automation Pros blog post series addresses how to implement the best override control."
full_description = 'This blog covers numerous topics on industrial automation such as operations & management, continuous & batch processing, connectivity, manufacturing & machine control, and Industry 4.0. The material and information contained on this website is for general information purposes only. ISA blog posts may be authored by ISA staff and guest authors from the automation community. Views and opinions expressed by a guest author are solely their own, and do not necessarily represent those of ISA. Posts made by guest authors have been subject to peer review. The following discussion is part of an occasional series, "Ask the Automation Pros," authored by Greg McMillan, industry consultant, author of numerous process control books and 2010 ISA Life Achievement Award recipient. Program administrators will collect submitted questions and solicit responses from automation professionals. Past Q&A videos are available on the ISA YouTube channel; you can view the playlist here. You can read posts from this series here. Looking for additional career guidance, or to offer support to those new to automation? Sign up for the ISA Mentor Program. Where are the best practices to 1) understand where override control is needed, and 2) how to implement it? It’s good that Russ raises this question on this forum since the subject is rarely covered in courses on control despite being widely used in industrial applications. There are opportunities to apply override control when a manipulated variable influences more than one process variable. For example, pump speed might be adjusted by a controller to control pipeline flow, but in doing so, when the pump speed is increased, the pump discharge pressure increases and pump suction pressure falls. The inadvertent closure of a downstream valve or failure of a downstream booster pump might mean that the target flow cannot be achieved without exceeding the design pressure limit for the pump discharge piping. Similarly, a restriction upstream of the pump could result in low suction pressure which, if pump speed is not reduced, could lead to pump failure through cavitation. Limits like this are usually identified by the process engineer. It is important to recognize that an override strategy cannot be relied upon for equipment/plant protection, but might be implemented to preempt operation of the primary equipment protection to avoid shutdowns which more seriously affect production, and which have their own way of introducing hazards especially on start-up.'
author = "Greg McMillan"
year_published = 2025
year_updated = 2025
