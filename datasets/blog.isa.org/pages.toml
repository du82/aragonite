["https://blog.isa.org/ask-the-automation-pros-the-use-of-artificial-intelligence-in-process-control"]
title = "Ask the Automation Pros: The Use of Artificial Intelligence in Process Control"
description = "In the latest installment of the Ask the Automation Pros blog series, experts provide thoughts about the use of artificial intelligence in process control."
full_description = 'This blog covers numerous topics on industrial automation such as operations & management, continuous & batch processing, connectivity, manufacturing & machine control, and Industry 4.0. The material and information contained on this website is for general information purposes only. ISA blog posts may be authored by ISA staff and guest authors from the automation community. Views and opinions expressed by a guest author are solely their own, and do not necessarily represent those of ISA. Posts made by guest authors have been subject to peer review. The following discussion is part of an occasional series, "Ask the Automation Pros," authored by Greg McMillan, industry consultant, author of numerous process control books and 2010 ISA Life Achievement Award recipient. Program administrators will collect submitted questions and solicit responses from automation professionals. Past Q&A videos are available on the ISA YouTube channel; you can view the playlist here. You can read posts from this series here. Looking for additional career guidance, or to offer support to those new to automation? Sign up for the ISA Mentor Program. There are many conceptions about what is artificial intelligence (AI). I suggest we focus more on AI that is utilizing instrumentation and is combined with existing technologies in the process industry such as proportional-integral-derivative (PID) and model predictive control (MPC) for closed loop control and principal component analysis (PCA) and projections to latent structures (PLS) for data analytics to deal with situations that would normally require human intervention. This includes machine learning and deep learning that are modeled after the decision-making processes by humans using knowledge of technologies, process and equipment. The IBM site “What Is Artificial Intelligence (AI)?” offers the following explanation of the differences between machine learning and deep learning: “Machine learning and deep learning differ in the types of neural networks they use, and the amount of human intervention involved. Classic machine learning algorithms use neural networks with an input layer, one or two ‘hidden’ layers, and an output layer. Typically, these algorithms are limited to supervised learning: the data needs to be structured or labeled by human experts to enable the algorithm to extract features from the data.'
author = "Greg McMillan"
