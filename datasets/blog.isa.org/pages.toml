["https://blog.isa.org/ask-automation-pros"]
title = "ISA | Ask the Automation Pros"
description = "The ISA Ask the Automation Pros column connects early career professionals to more seasoned professionals who are willing to help coach, guide, and share expertise."
full_description = "This ongoing feature on ISA Interchange allows early career professionals to ask a technical question to more seasoned professionals who are willing to help provide answers and share expertise. Submitters: Questions may be submitted by engineers and technicians currently employed in a plant or engineering center actively designing, installing, or maintaining process control systems with at least one year experience. You must be an ISA member. Submitters are encouraged to submit at least one generic question on using and applying process control each year. The automation professionals will provide answers. All questions and answers must not be vendor/supplier specific and should not disclose the process, type, location, or any other identifying details. The program administrators will filter questions and answers and post them for all participants on ISA Interchange. The program is designed for practitioners, retirees, and educators whose goal is the best functional use of automation products that are not exclusive to an individual supplier and are not in any way promoting the sales of products from a particular supplier. The ISA book 101 Tips for a Successful Automation Career and the McGraw-Hill Handbook Process/Industrial Instruments and Controls Handbook Sixth Edition provide excellent concise sources of essential knowledge for automation professionals. Ask the Automation Pros is a service provided without compensation to the participants. ISA does not monitor the information or advice given and is not responsible for its content. ISA participants should not be asked to solve particular instrumentation, systems, or automation problems, whether academic, real, or hypothetical. The International Society of Automation is a non-profit professional association founded in 1945 to create a better world through automation. ISA advances technical competence by connecting the automation community to achieve operational excellence. The organization develops widely-used global standards; certifies industry professionals; provides education and training; publishes books and technical articles; hosts conferences and exhibits; and provides networking and career development programs for its 40,000 members and 400,000 customers around the world."
