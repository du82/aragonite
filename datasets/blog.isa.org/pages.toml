["https://blog.isa.org/author/asim-sinha"]
title = "ISA Interchange | Asim Sinha"
description = "Asim Sinha is the CEO of IIoTexpert, a Bangalore based System integrator & Channel sales partner in Asia for Vorne Industries Inc. a cloud based Industrial IoT Company in Chicago, USA. He works with leaders at multiple levels of manufacturing companies to implement technology that turbo-charges continuous improvement and change management initiatives. He has over 24 yrs. of diversified experience with expertise in end-to-end implementations of Digital transformations and process Automation experience in both national and international operations including Instrumentation and IoT Enabled Manufacturing Solution in Oil & Gas, FMCG, Automotive and Various other Industries. As an Electronics engineering graduate, Asim started his career from Rockwell Automation India and Crown Cork and Seal Inc. USA. After returning from the United States to India in March 2006, he also served in Refineries like Reliance Industries Limited Jamnagar, HPCL Mittal Industries Bathinda and FMCG plant like Patanjali in India in a leadership role for the next few years. He worked on manufacturing & digital strategy, Industry 4.0, IIoT, DCS, Scada, EMS/MIS/MES, ICS IT-OT integration, Electrical distribution systems, Smart grid, Smart switches, Substation automation and Warehouse Automation system. He has helped companies analyze, quantify and optimize stalled or failing continuous improvement initiatives through data and process change. Asim knows pain area of the plant very well because he worked in plant for long time and so he also knows that companies have the resources to improve, but they need the tools to leverage their resources, and this starts with understanding the corporate Automation strategy. Currently he is transforming businesses with Industry 4.0/IIoT Technology solutions based on World economy forum’s Lighthouse model factory concept."
