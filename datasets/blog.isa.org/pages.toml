["https://blog.isa.org/26-automation-trailblazers-who-changed-the-world"]
title = "26 Automation Trailblazers Who Changed the World"
description = "The International Society of Automation (ISA) explores the lives and careers of some of those who have made the biggest impact on the world of automation."
full_description = "This blog covers numerous topics on industrial automation such as operations & management, continuous & batch processing, connectivity, manufacturing & machine control, and Industry 4.0. The material and information contained on this website is for general information purposes only. ISA blog posts may be authored by ISA staff and guest authors from the automation community. Views and opinions expressed by a guest author are solely their own, and do not necessarily represent those of ISA. Posts made by guest authors have been subject to peer review. The International Society of Automation (ISA) explores the lives and careers of some of those who have made the biggest impact on the world of automation since the organization was founded in 1945. The device that changed everyone's life in industrialized society—including the process control industry—was the transistor, invented in 1947 by John Bardeen, Walter Brittain, and William Schockley of Bell Laboratories. Arguably the most important invention of this century, the transistor opened the electronics age, driving out many pneumatic or air-based controllers of the 1920s and '30s. The transistor contained three electrodes and could amplify or vary currents or voltages between two of the electrodes in response to the voltages or currents imposed on the third electrode. Microprocessors made industrial controllers of all types practical, and Federico Faggin designed the first commercial microprocessor, the Intel 4004, in 1971. He led the 4004 (MCS-4) project and the design group during the first five years of Intel’s microprocessor effort. After the 4004, he led development of the Intel 8008 and 8080. Later he cofounded Zilog, the first company solely dedicated to microprocessors, and led the development of the Zilog Z80 (used extensively in controllers) and Z8 processors. The influence of microprocessors continues; they are embedded in sensors, actuators, and other end devices. Microprocessors are fueling the implementation of Industry 4.0, industrial digitalization, and IIoT. In 2010, Faggin received the 2009 National Medal of Technology and Innovation, the highest honor the U.S. confers for achievements related to technological progress."
author = "Bill Lydon"
year_published = 2025
year_updated = 2025
