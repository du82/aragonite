["https://blog.isa.org/10-essentials-successful-upgrade-dcs-migration"]
title = "Webinar Recording: 10 Essentials of a Successful Upgrade or DCS Migration"
description = "The thought of an industrial system upgrade or a DCS migration can inspire fear, uncertainty and doubt about how such a major project moves forward."
full_description = "This blog covers numerous topics on industrial automation such as operations & management, continuous & batch processing, connectivity, manufacturing & machine control, and Industry 4.0. The material and information contained on this website is for general information purposes only. ISA blog posts may be authored by ISA staff and guest authors from the automation community. Views and opinions expressed by a guest author are solely their own, and do not necessarily represent those of ISA. Posts made by guest authors have been subject to peer review. For many people, what we don’t know or understand can bring about a certain amount of fear, uncertainty and doubt. And, what we do know and understand makes us feel comfortable, so we tend to keep doing the same thing repeatedly. But sticking to the “status quo” isn’t always a good thing. This is especially true when you must decide whether to upgrade or migrate your existing legacy distributed control system (DCS). You find yourself asking, what is the worst thing that can happen if we keep the old system? It runs, right? Perhaps. But to be realistic you must also ask, how long can we continue to support the existing system? What happens if it fails? Or, is it even compatible with the latest new technology on the market? In other words, you must weigh the facts carefully to see which path forward holds the most risk, and which one has the most potential to yield a favorable outcome – that is, which solution will positively impact the overall productivity, profitability and safety of your manufacturing processes. Remaining “status quo” is easy: You know what you are working with in terms of your existing system, and you understand the huge risks involved if nothing changes. So, let’s look at what might give you the most angst if you consider an upgrade, or a migration to a completely new platform. The potential for enormous risk is during the entire installation process, but particularly during the cutover from the old automation system to the new one. At this stage, production can be affected either for good or bad. The cutover point is where the parts of the larger automation system designated to stay in place are moved to the new platform. These typically include field instrumentation, valves, motor controllers, and so on—with all the supporting networks and wiring. These components interface with the system via input/output (I/O) cards, and every connection must be moved from the old platform to the new one. So, how can we minimize this potential risk? Proper upfront planning is key and should be done well in advance of the cutover process. Let’s see why."
author = "Charles Toth"
year_published = 2025
year_updated = 2025
clearnet = "https://blog.isa.org/10-essentials-successful-upgrade-dcs-migration"
