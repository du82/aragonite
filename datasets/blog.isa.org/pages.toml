["https://blog.isa.org/ask-the-automation-pros-what-scan-time-is-needed-for-process-control-applications"]
title = "Ask the Automation Pros: What Scan Time Is Needed for Process Control Applications?"
description = "In this entry in the Ask the Automation Pros series, automation experts answer the question:  What scan time is needed for process control applications?"
full_description = 'This blog covers numerous topics on industrial automation such as operations & management, continuous & batch processing, connectivity, manufacturing & machine control, and Industry 4.0. The material and information contained on this website is for general information purposes only. ISA blog posts may be authored by ISA staff and guest authors from the automation community. Views and opinions expressed by a guest author are solely their own, and do not necessarily represent those of ISA. Posts made by guest authors have been subject to peer review. The following discussion is part of an occasional series, "Ask the Automation Pros," authored by Greg McMillan, industry consultant, author of numerous process control books and 2010 ISA Life Achievement Award recipient. Program administrators will collect submitted questions and solicit responses from automation professionals. Past Q&A videos are available on the ISA YouTube channel; you can view the playlist here. You can read posts from this series here. Looking for additional career guidance, or to offer support to those new to automation? Sign up for the ISA Mentor Program. I recall a rule from the early digital controller applications (circa 1975) that the control frequency (or scan time) should be chosen to have 10 sampling/actions within a process time-constant, or 30 within the process settling time. This was a balance of seeking perfection in control with respect to the device cost and practicality. A balance of perfection and sufficiency. (It also matches the rule in finite-difference methods for solving differential equations that for stability and goodness of fit, the time increment should be one-tenth of the time-constant.) I also recall that early horizon-predictive control models had about 30 coefficients in the Finite-Impulse-Response vector over the process settling time. Today, computer power (speed, capacity, etc.) permit many more coefficients in the FIR model and much higher control frequency. What is today’s balance of perfection to sufficiency? For instance: Is 10Hz a detectable benefit on a distillation column over 0.1 Hz? Is the optimization of 180 possible future control actions in model predictive control (MPC) a real benefit over, perhaps 10?'
author = "Greg McMillan"
year_published = 2025
year_updated = 2025
