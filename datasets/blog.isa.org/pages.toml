["https://blog.isa.org/an-interview-with-b%C3%A9la-lipt%C3%A1k-author-of-controlling-the-future-preventing-climate-and-other-disasters"]
title = 'An interview with Béla Lipták, author of "Controlling the Future: Preventing Climate and Other Disasters"'
description = 'A comprehensive interview with Béla Lipták, author of "Controlling the Future: Controlling Non-Industrial Processes to Prevent Climate and Other Disasters"'
full_description = "This blog covers numerous topics on industrial automation such as operations & management, continuous & batch processing, connectivity, manufacturing & machine control, and Industry 4.0. The material and information contained on this website is for general information purposes only. ISA blog posts may be authored by ISA staff and guest authors from the automation community. Views and opinions expressed by a guest author are solely their own, and do not necessarily represent those of ISA. Posts made by guest authors have been subject to peer review. ISA recently published Controlling the Future: Controlling Nonindustrial Processes: Preventing Climate and Other Disasters by Béla Lipták, a comprehensive analysis of how processes developed and perfected by the automation industry can be used to tackle the climate change problem. To control a process, we must fully understand it. In Controlling the Future, Lipták analyzes global warming as a heat balance process that has been disrupted by burning fossil fuels. Now, even knowing the dangers that global warming presents, 8 to 10 billion tons of carbon are still being emitted yearly. As more tipping points in the disruption of this equilibrium are reached, global warming and the frequency of its catastrophic effects will only accelerate. Béla Lipták generously gave his time to ISA, answering comprehensive questions about the writing process, the inspiration behind the book, and his expertise on climate change. What unique perspective do you have that others who have written about climate change have missed? How is this book different, and what new information is presented? I am not a climate alarmist, but I see the wounds we are inflicting on nature. The key message of this textbook is that the Earth is warming much faster than predicted by most models. This is because the present models mostly consider only the increase in the incoming heat caused by carbon emissions and largely neglect the decrease in the cooling effects caused by the melting snow and dropping albedo caused by the reduction in industrial pollution and aerosol emissions. The other main difference is that in my analysis, I apply the rules of the science of process control, which considers capacitance, inertias, accelerations, time constants, feedback, tipping points, integral accumulations, and interacting (artificial intelligence [AI]) effects when predicting the dynamic behavior of such nonindustrial process as climate change, while other models do not."
author = "Ashley Ragan"
year_published = 2025
year_updated = 2025
