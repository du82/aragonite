["https://blog.isa.org/3-ways-technology-has-changed-traditional-payments"]
title = "3 Ways Technology Has Changed Traditional Payments"
description = "The International Society of Automation (ISA)'s standard ISA-5.1, also known as ANSI/ISA-5.1, Instrumenta..."
full_description = "This blog covers numerous topics on industrial automation such as operations & management, continuous & batch processing, connectivity, manufacturing & machine control, and Industry 4.0. The material and information contained on this website is for general information purposes only. ISA blog posts may be authored by ISA staff and guest authors from the automation community. Views and opinions expressed by a guest author are solely their own, and do not necessarily represent those of ISA. Posts made by guest authors have been subject to peer review. Cash or check? In a world of digital payments, online bank accounts, and cryptocurrency, it's undeniable that technology has forever changed our payment methods and our thoughts about money. “Cash on hand” is largely a figure of speech these days, and the move toward a cashless society has had tangible impacts on how we conduct our commerce and settle our debts. Even before the remote work revolution, people were already moving their financial lives online. It's practically unheard of for a bank or credit union to not offer some sort of online banking or mobile deposit. While larger corporations still favor the “every other Friday” direct deposit method, many jobs, especially in the gig industry, now pay more frequently via apps such as PayPal or Venmo. More than 80% of Americans carry a credit card, and even “cardless” payment methods like Apply Pay are becoming more widely accepted. This, in turn, has led to more consumers making purchases on credit. This combination of the immediacy of paychecks and the availability of credit effectively raises consumers’ purchasing power. If your tech-savvy grandma sends you $50 on Venmo, and you immediately make an online purchase, the funds haven’t technically settled into your bank account even though you are able to make your online payment. In other words, the delays caused by waiting for a paper check to clear are distant memories. Technology continues to make funds available now."
author = "Aaron Smith"
year_published = 2025
year_updated = 2025
