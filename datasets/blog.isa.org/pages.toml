["https://blog.isa.org/ask-the-automation-pros-achieving-the-best-cascade-control"]
title = "Ask the Automation Pros: Achieving the Best Cascade Control"
description = "In the latest installment of the Ask the Automation Pros blog series, automation professionals share their thoughts on achieving the best cascade control."
full_description = 'This blog covers numerous topics on industrial automation such as operations & management, continuous & batch processing, connectivity, manufacturing & machine control, and Industry 4.0. The material and information contained on this website is for general information purposes only. ISA blog posts may be authored by ISA staff and guest authors from the automation community. Views and opinions expressed by a guest author are solely their own, and do not necessarily represent those of ISA. Posts made by guest authors have been subject to peer review. The following discussion is part of an occasional series, "Ask the Automation Pros," authored by Greg McMillan, industry consultant, author of numerous process control books and 2010 ISA Life Achievement Award recipient. Program administrators will collect submitted questions and solicit responses from automation professionals. Past Q&A videos are available on the ISA YouTube channel; you can view the playlist here. You can read posts from this series here. Looking for additional career guidance, or to offer support to those new to automation? Sign up for the ISA Mentor Program. Where are the best ways and methods to understand where cascade control is needed and to know the implementation issues to get the greatest performance? I ask this question because most folks starting, or shifting to, engineering careers in process control have only had one mathematically-oriented course (or perhaps a few courses) in process control, and often that was years ago. Further, there are many aspects of implementation practice that were never addressed in the mathematical underpinning of college texts or courses, and the control engineer must scramble to catch up. In my experience, it was a mentor (Harold Wade) who revealed the issues. I also found product bulletins on devices, postings from experts on their websites and some of the ISA books to be very helpful. I had a short course on process control, but the content was too much like that of a college course to be of much utility. The content of the ISA CAP program seems relevant, but I have not taken it. Are ISA standards valuable for learning? Are training courses by device vendors?'
author = "Greg McMillan"
year_published = 2025
year_updated = 2025
