["https://blog.isa.org/are-you-celebrating-ada-lovelace-day-this-year"]
title = "Are You Celebrating Ada Lovelace Day This Year?"
description = "Ada Lovelace Day, held on 13 October 2020, celebrates women in STEM. Events will take place virtually this year."
full_description = '''This blog covers numerous topics on industrial automation such as operations & management, continuous & batch processing, connectivity, manufacturing & machine control, and Industry 4.0. The material and information contained on this website is for general information purposes only. ISA blog posts may be authored by ISA staff and guest authors from the automation community. Views and opinions expressed by a guest author are solely their own, and do not necessarily represent those of ISA. Posts made by guest authors have been subject to peer review. Ada Lovelace, an English mathematician and writer who lived in the early 1800s, was one of the first women to work in a STEM field. Known for publishing the first algorithm for Charles Babbage's proposed Analytical Engine, she's also considered to be the first-ever computer programmer. These days, Ada Lovelace Day is a global phenomenon. On the second Tuesday of each October, engineers around the world celebrate it as a way to honor Lovelace and highlight the contributions of women to the science, technology, engineering, and math fields. This year, Ada Lovelace Day is 13 October 2020. We chatted with the founder of Ada Lovelace Day, Suw Charman-Anderson, about Finding Ada, the organization she set up to support women in STEM on an international scale. She also shared her insights on the importance of diversity and how STEM fields can increase it within their own ranks. Our questions and her responses can be found below. International Society of Automation: What is Ada Lovelace Day, and what are people doing this year to celebrate? Suw Charman-Anderson: Ada Lovelace Day is an international celebration of the achievements of women in science, technology, engineering, and math (STEM). It takes place every year on the second Tuesday of October, which this year is 13 October. We usually hold a "science cabaret" in London, UK, at which women in STEM give short talks about their work or research in an informal, theater-like setting, and people around the world organize their own independent events to celebrate the day.'''
author = "Kara Phelps"
year_published = 2025
year_updated = 2025
