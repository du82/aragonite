["https://blog.isa.org/my-isa-journey-scott-reynolds"]
title = "My ISA Journey"
description = "The 2025 president of the International Society of Automation (ISA) Scott Reynolds shares his personal journey with ISA."
full_description = "This blog covers numerous topics on industrial automation such as operations & management, continuous & batch processing, connectivity, manufacturing & machine control, and Industry 4.0. The material and information contained on this website is for general information purposes only. ISA blog posts may be authored by ISA staff and guest authors from the automation community. Views and opinions expressed by a guest author are solely their own, and do not necessarily represent those of ISA. Posts made by guest authors have been subject to peer review. Every ISA president is encouraged to write about their journey that led to them becoming ISA’s president. I believe the biggest value in writing this is so you might see yourself in this story, and realize that you too can be ISA’s president. It starts with being more of a customer than what I would consider an engaged member. I took training and bought books so I could get my Control Systems Engineering License in Maine, USA, and then I followed that with obtaining the ISA Certified Automation Professional® (CAP®) certification. Then, in 2012, I moved from Maine to Colorado, and I needed to connect with the automation community. This is when I decided to join an ISA Denver Section meeting. (You can search for sections in your geographical area here.) The meeting was on the different types of level instruments and their different applications. I loved this because I just studied and learned about these in my exams, and now I was getting to see an expert provide context and passion behind the things I had mostly focused on memorizing. This topic also applied to my work, because I was implementing controls systems in the water and wastewater industry at the time. Before the meeting, the program chair greeted me at check-in and introduced me to a few people before leaving me on my own for the first meeting. I found a table alone (the introvert part of this story), and watched the presentation. At the start of the meeting, the section president kicked off the meeting, and mentioned that they are looking for someone to present on the CAP certification. I was trying to get myself out there in front of people, and if I presented, I thought that would be a lot easier than trying to start a conversation with a stranger, so I offered to try to get some retired questions from ISA and do a trivia night around CAP certification."
author = "Scott Reynolds"
year_published = 2025
year_updated = 2025
