["https://blog.isa.org/2022-in-review-a-great-year-for-isa"]
title = "2022 In Review: A Great Year for ISA"
description = "ISA 2022 President Carlos Mandolesi provides a wrap up of some of the important Society events that happened over the course of the year."
full_description = "This blog covers numerous topics on industrial automation such as operations & management, continuous & batch processing, connectivity, manufacturing & machine control, and Industry 4.0. The material and information contained on this website is for general information purposes only. ISA blog posts may be authored by ISA staff and guest authors from the automation community. Views and opinions expressed by a guest author are solely their own, and do not necessarily represent those of ISA. Posts made by guest authors have been subject to peer review. We’re now at the end of the year and the end of my term as ISA President. It is amazing how the time flies by. I still remember writing my first President blog post The Future of ISA is Now in January this year. I really enjoyed the experience of being ISA’s President. I learned so many new things. There were some challenges during the journey, but we learned good lessons during the process that will make us more successful in future initiatives. I travelled and met many members from different Sections and Districts: Students, young professionals, senior professionals, leaders, and volunteers. I got inspired by so many members and volunteers and I think that I did my best to inspire other automation professionals, too. I worked hard to show that it is possible to grow ISA doing different and new things. The secret of our success this year was the great collaboration and the sense of trust between members, volunteers, and staff working together in the same direction. The direction is provided by our vision, mission, and our strategy. I can see a brilliant future for ISA in the coming years where we will continue working together to “create a better world through automation.” Overall, I’m delighted that—with one month still to go in the year—the majority of our 2022 strategic goals have already been met or exceeded. ISA members can always see the most current status on our key results on connect.isa.org—just look for the section marked “2022 key results” on the left sidebar. In particular, I want to share that we grew our membership numbers by 8% as of November 30—well above the goal of 2% we had set for the year. I want to congratulate our ISA staff team and executive director, Claire Fallon, for all their hard work!"
author = "Carlos Mandolesi"
year_published = 2025
year_updated = 2025
