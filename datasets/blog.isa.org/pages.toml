["https://blog.isa.org/author/brian-romano"]
title = "ISA Interchange | Brian Romano"
description = "Brian Romano is a 40-year veteran of the Process and Automation Controls Systems arena. Notably, he was the president of a company division before purchasing it and growing it into a successful multi-disciplined systems integration company over a 16-year period. He is currently the Director of Technology development with the Arthur G. Russell Company in Bristol, CT and is heading up the company’s Industry 4.0 offering for both new machine offerings and for existing process and automation control systems. Romano is currently the ISA SM/IIoT Division, Industry Readiness and Maturity technical committee chair. Bringing the need for qualified control system engineers to the University of Hartford, Romano helped develop the current Automation curriculum at the university's College of Engineering, Technology and Architecture where he also serves as an adjunct faculty member. To help shape local technology programs, Romano also serves as an Industrial Advisory board member at Bristol Technical High School, CETA at the University of Hartford and the Robotics and Mechatronics program at Central Connecticut State University. As a basis for his career, Romano holds an AAS in Electronic Engineering Technology, continued studies in Electrical Engineering, a BS in Information Technology, an MS in Applied Computer Science with a concentration in Modeling and Simulation, an MBA with a concentration in Data Analytics, and is currently pursuing a PhD in Technology and Innovation."
