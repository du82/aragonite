["https://blog.isa.org/author/bill-hollifield"]
title = "ISA Interchange | Bill Hollifield"
description = """
Bill Hollifield is the Principal Consultant for both Alarm Management and High Performance HMI for PAS Global, part of Hexagon. Bill has 30 years of experience in the petrochemical industry in engineering and operations, and an additional 15 years in alarm management and HMI software and services for the petrochemical, power generation, pipeline, pharmaceutical, and mining industries. He is a member of the ISA SP-18 Alarm Management committee, the ISA SP-101 HMI committee, the American Petroleum Institute’s API RP-1165 HMI committee, and the Engineering Equipment and Materials Users Association (EEMUA) Industry Review Group.

