["https://blog.isa.org/alc-2023"]
title = "Automation and Leadership Conference Brings Top Tech Experts to Colorado Springs"
description = "In early October, ISA held their annual Automation and Leadership Conference (ALC) in Colorado Springs, CO. ALC brought together a global audience of automation managers, engineers and technicians."
full_description = 'This blog covers numerous topics on industrial automation such as operations & management, continuous & batch processing, connectivity, manufacturing & machine control, and Industry 4.0. The material and information contained on this website is for general information purposes only. ISA blog posts may be authored by ISA staff and guest authors from the automation community. Views and opinions expressed by a guest author are solely their own, and do not necessarily represent those of ISA. Posts made by guest authors have been subject to peer review. In early October, ISA held its annual Automation and Leadership Conference (ALC) in beautiful Colorado Springs, Colorado. ALC proudly brought together a global audience of more than 220 automation managers, engineers and technicians who aim to stay abreast of trending industry topics focused on digital transformation, cybersecurity, and career skills. “ALC is the automation event of the year,” said Marty Bince, ISA President. “It combines leading technical presentations with society meetings, standards meetings, training and career skills development opportunities, alongside multiple fun networking events. There is really nothing else like ALC." Over the span of five days, ALC hosted a series of different events at the Cheyenne Mountain Resort including training, society meetings, a volunteer workshop, the conference itself, standards meetings, and a golf outing. Each conference day began with a keynote address to standing-room-only crowds. ALC 2023 keynotes included: Many of the ALC events were presented in a hybrid format for both in-person and virtual attendees. Local attendees and those who chose to travel were able to participate in face-to-face, live sessions, breaks, lunch, reception and tabletop exhibits. A sketch artist was present, drawing his interpretation of the importance of the event in real-time. One example is seen below. Vital technical sessions and access to an array of technical subject matter experts were offered from the US, Canada, the Middle East, Brazil, Spain, and India. Attendees also had to option to visit more than a dozen sponsor exhibitor booths with insight and information on the latest products and technology in the industry.'
