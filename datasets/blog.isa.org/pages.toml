["https://blog.isa.org/ask-the-automation-pros-the-need-and-use-of-simulation-in-process-control"]
title = "Ask the Automation Pros: The Need and Use of Simulation in Process Control"
description = "In this entry in the Ask the Automation Pros series, automation experts share their thoughts on the need and use of simulation in process control."
full_description = 'This blog covers numerous topics on industrial automation such as operations & management, continuous & batch processing, connectivity, manufacturing & machine control, and Industry 4.0. The material and information contained on this website is for general information purposes only. ISA blog posts may be authored by ISA staff and guest authors from the automation community. Views and opinions expressed by a guest author are solely their own, and do not necessarily represent those of ISA. Posts made by guest authors have been subject to peer review. The following discussion is part of an occasional series, "Ask the Automation Pros," authored by Greg McMillan, industry consultant, author of numerous process control books and 2010 ISA Life Achievement Award recipient. Program administrators will collect submitted questions and solicit responses from automation professionals. Past Q&A videos are available on the ISA YouTube channel; you can view the playlist here. You can read posts from this series here. Looking for additional career guidance, or to offer support to those new to automation? Sign up for the ISA Mentor Program. How important is simulating a new control approach prior to implementing it? How does one include realistic issues in a simulation (noise, disturbances, constraints, nonlinearity, range of dynamics, etc.)? I find that when I have enough information to model the items in Russ’s question, I tend to have enough information to design the right strategy without simulating. In many cases, the model is useful to convince others who don’t understand control theory very well that it works. I’ll have created some ad hoc excel calculations to help me crunch numbers at different operating points, but not usually much else. To frame this, my experience is with pharmaceutical manufacture and associated utility systems. What are examples of processes where running models is more necessary? Don’t get me wrong — we do tons of simulation using tie backs and other low to medium fidelity techniques — it’d be nearly impossible to program and test sequencing and batch operations without it. But typically, if I have enough engineering information to make a model, I can apply all the books you guys have written to design the right solution 😊 and just worry about tuning it in during startup.'
author = "Greg McMillan"
year_published = 2025
year_updated = 2025
