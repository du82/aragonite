["https://blog.isa.org/ask-the-automation-pros-compute-start-up-tuning"]
title = "Ask the Automation Pros: How Can We Compute Startup Tuning for New Control Valves?"
description = "The International Society of Automation (ISA)'s standard ISA-5.1, also known as ANSI/ISA-5.1, Instrumenta..."
full_description = 'This blog covers numerous topics on industrial automation such as operations & management, continuous & batch processing, connectivity, manufacturing & machine control, and Industry 4.0. The material and information contained on this website is for general information purposes only. ISA blog posts may be authored by ISA staff and guest authors from the automation community. Views and opinions expressed by a guest author are solely their own, and do not necessarily represent those of ISA. Posts made by guest authors have been subject to peer review. The following discussion is part of an occasional series, "Ask the Automation Pros," authored by Greg McMillan, industry consultant, author of numerous process control books, and 2010 ISA Life Achievement Award recipient. Program administrators will collect submitted questions and solicits responses from automation professionals. Past Q&A videos are available on the ISA YouTube channel. View the playlist here. You can read all posts from this series here. Looking for additional career guidance, or to offer support to those new to automation? Sign up for the ISA Mentor Program. I ask because I had an experience of upgrading a feedwater valve on our recovery boiler and I literally took print outs of the before and after Cv curves, eyeballed the slopes in the operating range of the old trim, and expected operating range of the new trim, then changed the gain as a ratio of the two. I expected to have to retune the valve after or during startup, but it started up at 2 a.m. and seemed perfect so we haven’t touched it in two-three years. Is this legitimate? If there are no process changes, the installed valve characteristics are linear, the valve actuator type is the same, the positioner tuning is similar and the valve precision and response time are the same, the tuning can simplify to a ratio of the slopes. An auto tuner should be used to confirm there are no changes in the process or valve response other than valve gain. Testing per ISA-TR75.25.02 can detail if there any changes in resolution or response time or nonlinearities in valve response.'
author = "Greg McMillan"
year_published = 2025
year_updated = 2025
