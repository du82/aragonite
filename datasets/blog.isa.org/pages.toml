["https://blog.isa.org/9-automation-engineers-ideas-and-principles-for-everyday-working-life"]
title = "9 Automation Engineers' Ideas and Principles for Everyday Working Life"
description = "Automation professionals from the ISA Mentor Program share their ideas and principles for everyday working life as an automation engineer."
full_description = '''This blog covers numerous topics on industrial automation such as operations & management, continuous & batch processing, connectivity, manufacturing & machine control, and Industry 4.0. The material and information contained on this website is for general information purposes only. ISA blog posts may be authored by ISA staff and guest authors from the automation community. Views and opinions expressed by a guest author are solely their own, and do not necessarily represent those of ISA. Posts made by guest authors have been subject to peer review. The following discussion is part of an occasional series, "Ask the Automation Pros," authored by Greg McMillan, industry consultant, author of numerous process control books, and 2010 ISA Life Achievement Award recipient. Program administrators will collect submitted questions and solicits responses from automation professionals. Past Q&A videos are available on the ISA YouTube channel. View the playlist here. You can read all posts from this series here. Looking for additional career guidance, or to offer support to those new to automation? Sign up for the ISA Mentor Program. Damien Hurley is a control and instrumentation (C&I) engineer for Fluor in the UK. He is currently involved in the detailed design phase of a project to build a new energy plant in an existing refinery in Scotland. His chief responsibility is C&I interface coordination with construction, the existing site C&I contractor, and the client. What ideas and principles in your career have carried the most weight in your day-to-day working life? Since we have such a wealth of knowledge available to us on the internet and in the literature, I think there's merit in knowing what fundamentals others have found important. "The wheat from the chaff," if you will! To get things rolling in this discussion, I offer some of my thoughts. Only a few years into my automation career, I seem to have fallen on two important principles: understanding and patience. I find that most old problems are not solved because they are not understood. If they were understood, then a solution could be determined. If the solution were determined, the cost of that solution could be estimated. Also, the opportunity or justification could then be determined with confidence. It is then fairly simple to decide whether the opportunity is enough to justify the resources required to implement the solution. Too often, a problem languishes because we don’t really understand what is wrong, how much it is hurting us, and/or how we can fix it.'''
