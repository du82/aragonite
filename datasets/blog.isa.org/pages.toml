["https://blog.isa.org/ask-the-automation-pros-migrate-modern-ics"]
title = "Ask the Automation Pros: How to Best Migrate from Obsolete to Modern Instrumentation and Control Systems?"
description = "Greg McMillan discusses how to migrate a project from obsolete to modern versions of instrumentation and control systems."
full_description = 'This blog covers numerous topics on industrial automation such as operations & management, continuous & batch processing, connectivity, manufacturing & machine control, and Industry 4.0. The material and information contained on this website is for general information purposes only. ISA blog posts may be authored by ISA staff and guest authors from the automation community. Views and opinions expressed by a guest author are solely their own, and do not necessarily represent those of ISA. Posts made by guest authors have been subject to peer review. The following discussion is part of an occasional series, "Ask the Automation Pros," authored by Greg McMillan, industry consultant, author of numerous process control books, and 2010 ISA Life Achievement Award recipient. Program administrators will collect submitted questions and solicits responses from automation professionals. Past Q&A videos are available on the ISA YouTube channel. View the playlist here. You can read all posts from this series here. Looking for additional career guidance, or to offer support to those new to automation? Sign up for the ISA Mentor Program. What are the most critical points to consider related to instrumentation and control systems when migrating a project from obsolete to modern versions? Avoid control issues; consider differences in PID algorithms. The proportional–integral–derivative (PID) controller algorithm could vary from the obsolete to the modern version. There are three common PID forms that a control system could offer: parallel form, standard, also known as ISA form, and series, also known as classical form. Be aware that obsolete and modern control systems versions could default or use a different PID form, if tuning parameters are not “translated,” control issues are to be expected. In some, the integral action is in repeats per minute, in others, in seconds per repeat. The Derivative term could be required in minutes versus seconds. James Beall does a great job summarizing the differences in PID forms and provides formulas to convert series to tandard PID tuning in his presentation, “Interesting and Useful Features of the DeltaV PID Controller."'
author = "Greg McMillan"
year_published = 2025
year_updated = 2025
