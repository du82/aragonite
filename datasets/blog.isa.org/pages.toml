["https://blog.isa.org/smart-grid-challenges-opportunities"]
title = "Is Smart Grid Avoiding Real Challenges?"
description = "There is too much hype about the smart grid without looking at the core problems from an engineering and business point of view."
full_description = '''This blog covers numerous topics on industrial automation such as operations & management, continuous & batch processing, connectivity, manufacturing & machine control, and Industry 4.0. The material and information contained on this website is for general information purposes only. ISA blog posts may be authored by ISA staff and guest authors from the automation community. Views and opinions expressed by a guest author are solely their own, and do not necessarily represent those of ISA. Posts made by guest authors have been subject to peer review. This article was written by Bill Lydon, automation industry authority, journalist and former chief editor at InTech magazine. In my opinion, there is too much hype about the smart grid without looking at the core problems from an engineering and business point of view. There is a constant flow of information, presentations, and discussions about the smart grid, but I wonder if this simply makes people feel good and avoids facing the real issues. Even politicians are rallying around smart grid buzzwords; I call this kind of discussion "cocktail party technology talk." There is no doubt electrical energy can be managed better, and the smart grid concepts will provide more data and can be used to control the flow of energy from generation to users. This does not address the heart of the issue. The inescapable fact is the demand for electricity is going to be larger than generation capacity in place today, requiring some real planning to avoid problems. At the highest level, there are only two key factors concerning the electrical energy problem namely, demand and supply. The amount of growing demand for power relative to the supply available is a serious problem. Ultimately, there are only two ways to meet future growing energy requirements—increase generation capacity and lower consumption. Creating more electrical power takes time and investment at a pace that is beyond today's commitments to build more electrical power generation. This encompasses traditional and alternative power generation, including wind and solar. Adding more capacity, in most cases, requires the addition of more power lines to deliver electricity to users. Major investments need to be made installing electric transmission lines and distribution transformers in emerging countries and replacing aging transmission systems in the U.S. and Europe where about 75 percent of the networks are more than 30 years old.'''
author = "Bill Lydon"
year_published = 2025
year_updated = 2025
