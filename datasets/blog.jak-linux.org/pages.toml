["https://blog.jak-linux.org/page/7"]
title = "Blog of Julian Andres Klode"
full_description = "May 11, 2011 Project APT2: new cache format and small things I did not write much code or merge much of my prototype code, but some things happened since the last blog post about APT2 specific things in August and I forgot to write about them. First of all, I dropped the GVariant-based cache. The format strings were simply getting ugly long and were not very understandable, performance was just much too slow (needing more than a few nanoseconds for a package lookup is obviously too slow for solving dependency problems); furthermore, building the cache was also slow and complicated because we needed all attributes of an object at once to pass them to GVariant, leading to ugly API. ... Read more 》 May 11, 2011 underscores and undefined behavior As everyone should know, underscores in C are not cool, as they cause undefined behavior per 7.1.3: Yet, they are widely used everywhere. Here are some examples: * inclusion guards in GLib: ` __G_VARIANT_H__` * internal Python functions: `_PyUnicode_AsString` * various macros in APT: `__deprecated`, `__hot` All of this triggers undefined behavior and is thus uncool. Of course in APT, it’s most stupid, as we do not have any namespace and could thus end up redefining things we should not much more likely then the other two. ... Read more 》 April 30, 2011 last two weeks The last two weeks, two new python-apt releases were made. 0.8.0~exp3 did not add much, but 0.8.0~exp4 added some new bindings for our friends at the mancoosi project. I also committed several fixes to the APT repository, but did not upload them yet. In #debian-devel, some people (including me and others on the Debian side; and sladen, sabdfl for the Ubuntu side) discussed the Ubuntu font license which is considered non-free by Debian, due to extreme naming restrictions in section 2 (unmodified versions must keep the name, slightly modified versions must keep the name and add something). ... Read more 》 April 15, 2011 this week: apt 0.8.14 (regex pinning), stable updates, and bug triaging python-apt 0.8.0~exp2 bug fix release On Tuesday, I uploaded python-apt 0.8.0~exp2 to experimental, fixing about 10 bugs reported in Ubuntu and Debian bug trackers. It should know even convert integers correctly on all architectures, previously we could have passed long via varargs where int was expected. Bugs Until Thursday, I went through the bug list in Launchpad and closed/fixed/reassigned/merged about 100 bugs in APT and python-apt. APT & python-apt updates for squeeze Today, I uploaded updates of apt and python-apt to stable. ... Read more 》"
year_published = 2025
