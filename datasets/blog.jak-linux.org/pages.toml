["https://blog.jak-linux.org/page/17"]
title = "Blog of Julian Andres Klode"
full_description = "February 11, 2008 JAK LINUX website now powered by ikiwiki I’m glad to announce that finally, after being powered by ftpsync for more than six months, the JAK LINUX website now uses ikiwiki. I currently have some small issues with the website: After using –rebuild, tarballs have a different modification time and are therefore reuploaded everytime, though the content is actually the same. I would also need a plugin to create directory indexes with sha1sums, but I haven’t found one yet. ... Read more 》 February 4, 2008 Experiences with git and pristine-tar In the last days, I used git very often. It was almost the first time I really used it, but I quickly understand the basic commands. As some of you may know, the readahead-list package is now maintained in a git repo in the collab-maint project. I decided to use git instead of bzr (which I used for everything before), because of its speed and because I wanted to learn more about git, how it works. ... Read more 》 February 4, 2008 uploads and machine-readable copyright Two days ago, zobel uploaded some of my package updates for me. One of them was ndisgtk 0.8.1, which adds more translations and fixes some problems. I intent to create a 0.9 release soon, with support for PolicyKit. I will upload the release candidate of this version to Debian experimental and Ubuntu Hardy. The other upload was readahead-list 1:1.20060421.1016-1, which I found on the Gentoo mirrors, but not where previous releases were located. ... Read more 》 February 4, 2008 Debian Maintainer Since yesterday, I am a Debian maintainer. This will help me and my sponsors, which have to do less now. I can now upload new versions of my packages if the version in unstable contains the “Dm-Upload-Allowed” field in the dsc (and only if the package is not NEW). For more information about the Concept of Debian Maintainers, see http://wiki.debian.org/Maintainers I’m very happy about this, as it makes my life easier. ... Read more 》 January 29, 2008 Improved aufs support in Ubuntu, Debian pre-compiled aufs modules for Ubuntu Hardy will be available soon. Today, the linux-ubuntu-modules git has seen the commit which adds the aufs module for generic and server kernels on the i386 and amd64 architectures. But this is not the only thing. 5 patches from the aufs source have been commited to Ubuntu Hardy’s kernel repo. 1. [Export __lookup_hash](https://lists.ubuntu.com/archives/kernel-team/2008-January/002036.html): and is needed for NFS 2. [Export put_filp](https://lists.ubuntu.com/archives/kernel-team/2008-January/002037.html): This patch exports put_filp and is needed for NFS. ... Read more 》"
