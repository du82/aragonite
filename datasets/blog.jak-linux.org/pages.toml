["https://blog.jak-linux.org/page/15"]
title = "Blog of Julian Andres Klode"
full_description = "May 6, 2008 News on debimg Well, you may have noticed that debimg 0.1 is still not released. But a lot of work happened over the weekend in my local branch. First of all, debimg’s set support is almost finished. I uploaded a tarball containing the differences between the official lenny weekly build from yesterday and a build created today by debimg, using the tasks of debian-cd 3.0.4 (after manual conversion to a format supported by debimg). ... Read more 》 April 29, 2008 What will be in debimg 0.1 debimg 0.1 will be the first major milestone in the development of debimg. I will now list some changes compared to the current release, debimg 0.0.3 (Please note that the following text is from an internal NEWS file and may not be correct in some aspects, as it is already some days old) Support for disk splitting This release of debimg adds support for creating media sets, i.e. splitting the packages over multiple disks. ... Read more 》 April 29, 2008 Python Speed: 'x in list' vs 'x in set' Well, this is my second post about speed in Python. Today, I noticed that debimg’s dependency resolver was much much slower than before. I thought what the problem could be and finally realized that the problem was that I switched from sets to list. This is fixed now in commit d0fd700080de5c19cb5fd66918d14c5ffa26e805 Now, some benchmarks (using IPython): In [1]: a = range(10**6) In [2]: b = set(a) In [3]: %timeit 10**6 in a 10 loops, best of 3: 31. ... Read more 》 April 25, 2008 Responding to e-mails with Evolution Every time I receive an email at my ubuntu.com address, and respond to it, Evolution uses my jak@jak-linux.org e-mail address. It should be noted that the e-mails are fetched with a single account, as they are on an imap server, and because ubuntu.com is a forward address. Is there any way to make Evolution respond with the e-mail address at which I received an email? BTW, work on debimg 0.0.4ubuntu1 (previously 0. ... Read more 》 April 25, 2008 Work on ubuimg / debimg for Ubuntu started The work on the Ubuntu version of debimg has begun. The majority of changes will be the following ones (in the order they will be done): 1. Change debimg to use germinate to calculate dependencies (package lists) 2. Add the additional stuff (live, etc.) Once we can recreate the Ubuntu hardy i386 and amd64 alternate disks, work starts on the live filesystem and on merging these features back into debimg master, which will also get support for more archs. ... Read more 》"
