["https://blog.jak-linux.org/2009/02/19/gstreamer-python-bindings-are-effectively-gpl"]
title = "GStreamer Python bindings are effectively GPL | Blog of Julian Andres Klode"
description = """
While most of the bindings are LGPL licensed, modules like pygst are licensed under the terms of the GPL-2+. This means, together with the fact that you need to use pygst for any application wishing to use these binding, that you can not create proprietary or non-GPL-compatible programs using the GStreamer Python bindings.
You can read more about this in the Debian Bug Tracker in Bug#516190. I expect that this should be forwarded to upstream but I haven’t checked their bug tracker yet."""
full_description = "While most of the bindings are LGPL licensed, modules like pygst are licensed under the terms of the GPL-2+. This means, together with the fact that you need to use pygst for any application wishing to use these binding, that you can not create proprietary or non-GPL-compatible programs using the GStreamer Python bindings. You can read more about this in the Debian Bug Tracker in Bug#516190. I expect that this should be forwarded to upstream but I haven’t checked their bug tracker yet. While most of the bindings are LGPL licensed, modules like pygst are licensed under the terms of the GPL-2+. This means, together with the fact that you need to use pygst for any application wishing to use these binding, that you can not create proprietary or non-GPL-compatible programs using the GStreamer Python bindings. You can read more about this in the Debian Bug Tracker in Bug#516190. I expect that this should be forwarded to upstream but I haven’t checked their bug tracker yet. Copyright © 2018-2020 Julian Andres Klode, articles licensed under CC BY-SA 4.0. Comments are provided by Mastodon and copyright of their authors. This website does not store any personally identifiable information. As part of standard web server access_log logging, it stores requests and the user agents and shortened IP addresses used to make them. It does, however, load some avatars from mastodon. Powered by Hugo, and the Ernest theme."
