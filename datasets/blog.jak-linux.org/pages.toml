["https://blog.jak-linux.org/page/12"]
title = "Blog of Julian Andres Klode"
full_description = "March 23, 2009 Change has come to python-apt - aka 0.7.9 released With version 0.7.9 “change has come” to python-apt, and I will tell you now what the new stuff is about: 1. Introduction of the documentation As you may know, python-apt 0.7.8’s only documentation was available from the source code and to some parts from the docstrings. This changed in python-apt 0.7.9~exp2, when I introduced a complete documentation written in reStructuredText, and generated using Sphinx. This documentation has even improved in the final 0. ... Read more 》 March 19, 2009 March updates (This is a more or less a TODO list for my Debian packages and other stuff I’m working on) Already done New package: metatheme-gilouche Today I uploaded the new package metatheme-gilouche, which builds the binary package gnome-theme-gilouche. The Gilouche theme has been created by openSUSE and is used there as the default theme in GNOME. For users of gnome-app-install, this theme provides a “better” style for your main menu. It contains icons (replacing industrial-icon-theme), GTK+, and Metacity themes. ... Read more 》 March 15, 2009 GParted eats my day... Today, I wanted to shrink a partition by 5GB, and move it 5GB to the right. Well, I expected that it would take some minutes, but now it seems to take more than 5 hours, because GParted moves around the whole 87GB of the resized partition. This is what happens: * Check file system for errors (30min) * Resize the file system (30min?) * Resize the partition * Check file system for errors (30min) * Move the file system * Read-only Simulation (! ... Read more 》 March 2, 2009 debian-cd, dependencies, debimg, comments Looking at the amd64 CD images of Lenny, I just saw that there is the package ‘gnome’ on disk 1, while some of its dependencies are on disk 2. I don’t think that this is good. Same also applies to K3B on disk 3, and openoffice.org-kde on KDE-disk 1. In my opinion, all packages which are located on a disk X, should only depend on a disk N (N<X). This means that the package gnome would be moved to disk 2, or its dependencies to disk 1. ... Read more 》"
