["https://blog.jak-linux.org/page/10"]
title = "Blog of Julian Andres Klode"
full_description = "November 20, 2009 Back to the '90s - Bye PC, welcome back thin clients In the ’90s, you had a large machine and several thin clients accessing it by using X11 via network. In 2010, you will have large datacenters providing applications to and storing the data of millions of users. As you might have guessed, I am talking about Google Chrome OS. It seems that the PC era is slowly coming to an end, with devices being increasingly connected ’to the cloud’ and people being always online; and storing their data on Google’s servers. ... Read more 》 November 3, 2009 My First upload with new source format Yesterday, I uploaded command-not-found 0.2.38-1 (based on version 0.2.38ubuntu4) to Debian unstable, using the “3.0 (quilt)” source format. All steps worked perfectly, including stuff like cowbuilder, lintian, debdiff, dput and the processing on ftp-master. Next steps are reverting my machine from Ubuntu 9.10 to my Debian unstable system and uploading new versions of gnome-main-menu, python-apt (0.7.93, not finished yet) and some other packages. In other news, the development of Ubuntu 10. ... Read more 》 October 25, 2009 I'm back I returned to Germany from my vacation in Greece yesterday, and I just installed my new hard drive into my laptop. The old Hitachi hard drive had some bad sectors after a very long usage time (compared to my other disks) - we’ll see how the new Samsung SpinPoint M7 will work. Another side benefit is the upgrade from 120GB to 500GB which means I don’t have to delete files during the next months. ... Read more 》 September 29, 2009 upgrade failures Today I wanted to upgrade my “sid” system again (like I do 1-3 times per day, especially when I have nothing else to do). First of all, I was hit by a bug in APT “Could not perform immediate configuration (2) on perl”. I worked around it by running the latest git commit of cupt, which then started to upgrade my system. At some stage however, after upgrading parts of perl it seems, the progress stopped and perl complained that it could not find English. ... Read more 》"
