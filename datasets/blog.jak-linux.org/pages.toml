["https://blog.jak-linux.org/page/9"]
title = "Blog of Julian Andres Klode"
full_description = "February 15, 2010 Maemo + Moblin = MeeGo = Failure Today, Nokia and Intel announced the merge of Maemo and Moblin into the MeeGo project. This is sad, because it will end the era of the Debian-based mobile operating system Maemo and replace it with a system using RPM and probably some other evil stuff as well. In fact, dpkg & apt-get where two of my main reasons to buy the N900. And another question is why yet another name. Moblin was already a well-known name and they shouldn’t have changed the name just because they switch the servers and add some Nokia developers. ... Read more 》 February 8, 2010 N900 standby time It seems that the N900 is able to run for > 3 days in standby, I unplugged it Friday on 7:00, and it lasted until Sunday 23:50. I used it for browsing the web a bit and to listen to music via FM transmitter. February 7, 2010 Just uninstalled hal I have just uninstalled hal from my laptop running unstable, and everything still seems to work, including suspend & resume. January 20, 2010 python-apt 0.7.93 just hit unstable. I just uploaded python-apt 0.7.93 to unstable with support for Python 2.6 and Python 3.1, meaning that there is now a single development branch again. This uploads brings developers the new API with real classes in apt_pkg (you can now use pydoc to view documentation), C++ bindings for making apt-pkg applications scriptable (although they should be considered experimental), a test suite (although aptsources fails in one test for now) and many new context managers for enhanced Python 3 coding fun. ... Read more 》 December 30, 2009 New keyboard My brother and I just replaced the keyboard of my HP Compaq 6720s with a new HP replacement part (a christmas present). The old one had no characters on some keys anymore and it did not look very well. Replacing the keyboard was a matter of removing two screws, and then just ‘clicking’ the keyboard out. The old keyboard lost a few keys during the process, but this is not really important anymore. ... Read more 》"
