["https://blog.jak-linux.org/page/14"]
title = "Blog of Julian Andres Klode"
full_description = "October 25, 2008 aufs 0+20081023-1 uploaded to experimental I just uploaded a new upstream snapshot of aufs (another unionFS) to experimental. But it is really more than just a new upstream snapshot: First of all, this release includes patches written by Jeff Mahoney jeffm@suse.com. These patches enable the usage of NFSv2 and NFSv3 file systems as branches, even on the standard Debian kernel. The package does not support NFSv4 yet, but will support it at a later point (but only with a patched kernel) - the code exists, it’s just not enabled yet. ... Read more 》 October 13, 2008 I am a Debian Developer now! 14 months after applying for the NM process, I’m a Debian Developer. On Mon, Oct 13, 2008 at 10:51:43PM +0000, Martin Zobel-Helas wrote: [ This is a long mail with important information, so please read it all carefully. ] Dear Julian Andres Klode! Your account ‘jak’ has just been created in the central LDAP database of the Debian project. […] Thank you everyone (in chronological order): * Daniel Baumann (daniel) - Sponsored my first packages * Joerg Jaspert (joerg) - The first DD who signed my key * Niv Sardi-Altivanik (xaiki) - Advocated me for NM * Martin Zobel-Helas (zobel) - My first AM * Alexander Reichle-Schmehl (tolimar) - The second DD who signed my key (at CeBIT) * Bernd Zeimetz (bzed) - Took over in June, because zobel was very busy * Christoph Berg (myon) - For checking the AM report and requesting the account creation * Jonathan McDowell (noodles) - For adding me to the keyring * Martin Zobel-Helas (zobel) - This time for creating my account And many thanks to Google - for helping me to find answers to important questions. ... Read more 》 October 10, 2008 Gentoo destroying earth? I worked a bit with some Gentoo systems the last days and it was no fun. The whole compiling thing is no fun. In fact, it is a danger for the environment. If every computer in the world run Gentoo, power consumption would increase dramatically. There would also be no netbooks, as they are almost unusable for running Gentoo on it, compiling software. The path chosen by binary distributions like Debian is much better. ... Read more 》"
