["https://blog.jak-linux.org/page/16"]
title = "Blog of Julian Andres Klode"
full_description = "April 2, 2008 Python Extension for libisofs I am working on a Python extension for the libisofs library. The extension is written in Cython , a Python-like language designed to write Python extensions. At a later point, this extension will be used to create the ISO Images in debimg. It will be disabled by default, but you can enable it via a configuration option. March 24, 2008 Python Speed: Getting the first part of a string If you want to get the first part of a string (in the following example a), you should use the partition method of the string, as it is the fastest way (and it also gives you the delimiter in [1] and the other part of the string in [2]): In [1]: a = ‘a/b/c/d/e/f/g/h/i/j/k/l/m/n/o/p/q/r/s/t/u/v/w/x/y/z’ In [2]: timeit a.partition(’/’)[0] 1000000 loops, best of 3: 362 ns per loop In [3]: timeit a[:a. ... Read more 》 March 21, 2008 debimg news: disk splitting, new data lists, PowerPC The next release of debimg (0.0.3) will be the first release supporting splitting packages over multiple disks. I worked a lot on the base technology today, and the basics are working. In order to get support for disk splitting, I introduce three new classes: Media, MediaSet and MediaSetCollection (all in libdebimg.media). The Media class is responsible for adding files to an image (incl. copying/linking), generating extra files (like MD5SUMS or documentation) and for building the image. ... Read more 》 March 20, 2008 debimg 0.0.2 builds netinst in less than 4 seconds debimg 0.0.2 has a new high speed dependency resolver and support for local repositories. With these new features, debimg is now able to produce netinst images in less than 4 seconds. BTW, you can easily build your own disk. Simply unpack the tarball, change the mirror to your one, and run ./debimg debimg.cfg. This should give you an i386 netinst disk. Get debimg 0.0.2 from http://users.alioth.debian.org/~jak-guest/debimg_0.0.2.tar.gz Fetch daily-built images at http://jak-linux. ... Read more 》"
