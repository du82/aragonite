["https://blog.jak-linux.org/2008/01/13/a-small-benchmark-bazaar-git-mercurial"]
title = "A small benchmark: Bazaar, Git, Mercurial | Blog of Julian Andres Klode"
description = """
I just performed some benchmark on Bazaar, Git and Mercurial. This is a very small benchmark, I may publish a more detailed one in a few weeks.
vcs-performance.pdf
Some notes:
1. The unit in the first chart is seconds 2. I haven't run git-gc before taking the directory sizes. Running git-gc saves about 1083 kilobytes 3. This PDF file is licensed under the MIT License, see [http://opensource.org/licenses/mit-license.php](http://opensource.org/licenses/mit-license.php)"""
