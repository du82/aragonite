["https://blog.jak-linux.org/page/11"]
title = "Blog of Julian Andres Klode"
full_description = "August 19, 2009 notify-osd in Debian I forgot to write about this but I uploaded notify-osd to Debian some time ago which brings the passive notification bubbles known from Ubuntu. There are still some applications that do not behave correctly when using notify-osd. One example is giver which utilizes buttons on the notifications to accept or reject file transfers - As notify-osd is passive, it just displays a notification without the buttons. Using the notify plugin for Pidgin is also no good idea, as it now creates dialogs instead of displaying notifications, due to some (unneeded) buttons on the notification. ... Read more 》 August 18, 2009 Python APT 0.7.92 released The release of Python APT 0.7.92 is the first (pre-)release to introduce the new C++ bindings to create Python objects for almost every C++ object in the apt-pkg and apt-inst libraries. It is also the first version of python-apt which correctly deallocates its objects. It also introduces classes in apt_inst which are modelled after the ’tarfile’ module in Python. The new progress classes behave more like the ones in apt, which allows you to write even more perfect apt-get clones (if you want to). ... Read more 》 July 29, 2009 Debian's new time-based freezes Overall, having time-based freezes is a good idea. But the chosen cycle is problematic, especially if one considers Ubuntu’s LTS release cycles. The problem is that if Debian releases a new version at approximately the same time as Ubuntu, there will not be much synchronization and Ubuntu will have newer program versions. Consider the releases of Ubuntu 8.04 LTS (April 2008) and Debian GNU/Linux 5.0 (February 2009). Whereas Ubuntu 8.04 provides GNOME 2. ... Read more 》 June 5, 2009 python-apt 0.7.91 released As I promised, I released python-apt 0.7.91 today. This version provides a new API, with real classes in apt_pkg, new names which conform to PEP 8 conventions, and it supports new language features such as the ‘with’ statement. Old code should still continue to work, if it does not and it is using only public interfaces, report a bug against python-apt or send an email. I can not guarantee that all the names will be kept like they are at the moment (it’s a pre-release), but there should not be many more changes needed. ... Read more 》"
