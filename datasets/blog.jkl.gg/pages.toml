full_description = "Stylized checkboxes in Obsidian (e.g. custom icons for canceled, rescheduled, in progress etc.) without a custom theme or plugins. Brief thought on how the next phone that’ll win the market is going to to be the one that gets AI right One of the challenges with note taking apps on mobile is the limited font selection. While desktops let you install custom fonts system-wide, mobile platforms are much more restrictive. However, there’s an elegant solution for Obsidian given it’s an electron app. Obsidian allows you to inject a CSS snippet to tweak the appearnace of the app. CSS allows you to embed base64 encoded fonts directly in them for styling text 💡. I’m powering my Hugo blog theme Henry with Bluesky comments. It’s a great way to invest in a social-media feed that you control and is open source. I like my current implementation and it’s open for others to use. Fixing the problem where an iPhone Continuity Camera is not recognized in Google Meet when using a chromium browser. I’ve been using this font for a while as my primary programming font and referenced it in one of my newsletters. Thought i’ll share this more prominently. This website now uses Commit Mono for code. I customized a few of the characters: My good friend Mustafa a Director at Shopify, has some good advice for Sonos on the recent rewrite fiasco. Kotlin coroutines testing tip - exploring 3 of the important apis to control virtual time in your tests. Kotlin coroutines testing tip - using backgroundScope to cancel never ending child coroutines in tests. Kotlin coroutines testing tip - The most important concept for testing coroutines is knowing how to pick the right Dispatcher This post talks about using the popular CSS framework Tailwind to style a Hugo theme or blog in 2024. Blog post explaining a reliable way to use the Option key on macOS for keyboard shortcuts instead of special characters. I wrote a blog post about git-number and how useful it was for my command line git usage. In an on-going effort to simplify my lifestyle & setup, I replaced git-number with a few git aliases. I’ll explain how I recreated the functionality in this blog post."
