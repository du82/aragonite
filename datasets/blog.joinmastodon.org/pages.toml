["https://blog.joinmastodon.org/page/3"]
title = "Mastodon Blog"
description = "Updates from the Mastodon team"
full_description = "Today we would like to thank Sujitech for kindly donating $100k USD to Mastodon, by far the largest single donation to our non-profit so far. Building Mastodon, which encompasses the core software on one end, and two native mobile applications on the other, is not cheap, and we can only afford a handful of full-time positions right now, relying in many ways on volunteer work. Sujitech is a Japanese tech company whose mission is to achieve a truly free and open internet, and that has supported Mastodon in various ways for many years. They have saved multiple Mastodon servers from shutting down by taking over their maintenance when the original owners were unable to continue to operate them, and in 2021, we had teamed up to build the first prototype of the official iOS app for Mastodon. The 2022 Annual Report is now available for download! As a non-profit organization supported exclusively by donations, we like to keep our community updated on our yearly progress, and 2022 was an interesting year to say the least. To help us raise more funds for our development efforts, we are launching a new line of merchandise for Mastodon including t-shirts, mugs, enamel pins, and stickers. There’s been a lot of speculation around what Threads will be and what it means for Mastodon. We’ve put together some of the most common questions and our responses based on what was launched today. Today, Mastodon for Android has received a complete Material You redesign. We left no stone unturned — tab bars, settings, composing — everything is refreshed and reflects your color palette. Today we’re making signing up on Mastodon easier than ever before. We understand that deciding which Mastodon service provider to kick off your experience with can be confusing. We know this is a completely new concept for many people, since traditionally the platform and the service provider are one and the same. This choice is what makes Mastodon different from existing social networks, but it also presents a unique onboarding challenge. To make this step easier, we now have a default sign-up option that works with a server we operate. If you wish to leave or join a different server, you can do so at any time."
