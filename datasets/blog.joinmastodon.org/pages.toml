["https://blog.joinmastodon.org/page/4"]
title = "Mastodon Blog"
description = "Updates from the Mastodon team"
full_description = "We are teaming up with the design agency Oak to update our homepage and our brand. Goodbye social media blue, hello vibrant purple! The news of Elon Musk buying Twitter has put Mastodon into the public spotlight as an alternative social network, rapidly exploding our growth with over 30,000 new users in just a single day. This is because at Mastodon, we present a vision of social media that cannot be bought and owned by any billionaire, and strive to create a more resilient global platform without profit incentives. We believe that your ability to communicate online should not be at the whims of a single commercial company. Mastodon is now available on Google Play Store and the Apple App Store. Read about some of the design decisions we made for these apps! A brand new explore page, post editing, and new moderation features are just some of the additions in this new release of Mastodon! We are developing an official Android app which will be free and focused on helping new users get started on the fediverse From media reports and individual findings that various people have presented to us, it seems that the new social media platform owned by the former president of the United States, Donald J. Trump, so-called Truth Social, is using Mastodon’s source code with various visual adjustments. The platform has not formally launched yet, but it was made accessible ahead of time. Users were quick to note that the terms of service included a worrying passage, claiming that the site is proprietary property and all source code and software are owned or controlled by them or licensed to them: On behalf of the EUNOMIA project, in which I represent Mastodon, I am happy to announce that after nearly 3 years of development there is now a public pilot for the Mastodon community. But first, what is EUNOMIA and who is EUNOMIA? EUNOMIA is a “digital companion” for social media, a set of additional functions that aim to combat the spread of misinformation by helping you critically analyze social media posts before re-sharing them. Currently available functions include:"
