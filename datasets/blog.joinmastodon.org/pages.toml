["https://blog.joinmastodon.org/2018/10/mastodons-2-year-anniversary"]
title = "Mastodon's 2 Year Anniversary - Mastodon Blog"
description = "Mastodon was first announced to the public through Hacker News, a link aggregator site for programmers, on October 6, 2016. Now we’re celebrating the 2 year anniversary! 🎉"
full_description = "Back Oct 14, 2018NewsMastodon's 2 Year AnniversaryA retrospective Eugen RochkoCEO / FounderMastodon was first announced to the public through Hacker News, a link aggregator site for programmers, on October 6, 2016. Now we’re celebrating the 2 year anniversary! 🎉Network growthFrom 45 registered users on mastodon.social, the only Mastodon server at the time, the network grew to 1,627,557 registered users on 3,460 servers. That’s not counting people on non-Mastodon servers that are compatible with Mastodon via ActivityPub!There are a lot of small servers: The median user number per server is 8 people. The biggest server hosts 415,941 accounts. The 3 largest servers combined host 52% of the network’s users, the 25 largest servers host 77% of all users *. This is natural as the largest servers are more known and therefore attract a lot of new people. However, for many people who stick around, they act as gateways, wherein once they learn more about Mastodon, they switch to a different, usually smaller server.The oldest servers that are still around today are mastodon.social, awoo.space, social.tchncs.de and icosahedron.website.Most exciting new server growth events:In April 2017, mstdn.jp was created by nullkal in his apartment. The first Japanese server of Mastodon went viral and saw a growth of tens of thousands accounts within a few days, and served as a catalyst for Mastodon’s popularity in Japan.In May 2018, after the SESTA/FOSTA laws were passed in the US and forced many sex workers into exile from mainstream social media websites, Assembly Four founded switter.at, a Mastodon server for sex workers. It grew rapidly towards a hundred thousand accounts.To this day, mastodon.social, mstdn.jp, switter.at, pawoo.net and friends.nico are the largest servers.Development milestonesFrom 332 commits by a single developer, the GitHub repository grew to over 6,140 commits by 513 people. Since the start of development in March 2016, 102 versions of Mastodon have been released, beginning with v0.1.0 up to the latest v2.5.2.4,343 pull requests were merged, and 2,851 issues were closed.This is what Mastodon looked like in October 2016:Here is a time table of Mastodon’s most notable features, that is, features that Mastodon is most known for today:October 2016The interface becomes responsive for mobile screensNovember 2016Hashtags are implementedSearch for accounts is implementedNotificationsMarking media as sensitive is addedThe “unlisted” visibility setting is addedThe publish button is renamed to “toot”December 2016The reblog button is renamed to “boost”Public timeline now excludes boosts and repliesFirst admin interface is addedLocked accounts are implementedThe “private” visibility setting is addedJanuary 2017Viewing one’s own favourites is implementedRemote follow dialog is addedThe “boop” sound for notification appearsContent warnings are implementedTwo-factor authentication is addedFebruary 2017The Streaming API appearsReporting accounts and toots is implementedThe public timeline is split into “local” and “whole known network”March 2017An emoji picker is addedApril 2017The “direct” visibility setting is addedThe coyote stops rotating as new GIF autoplay preferences are addedJune 2017The columns in the web interface can be moved, added and removedDeleting own account is implementedAugust 2017The Mastodon logo is updatedWeb Push is implemented, allowing the web interface to receive push notificationsSeptember 2017The entire Mastodon network is successfully upgraded from OStatus to ActivityPubPinning toots is implementedMySpace Tom lives on as Mastodon begins making new users follow their admin by defaultOctober 2017Custom emoji are implementedAlternative text for media attachments is addedHotkeys in the web interface are implementedDecember 2017Lists are implementedInvite system is addedJanuary 2018The e-mails sent by Mastodon become prettyMarch 2018Search for toots is implementedAccount backup download is implementedFocal point selection for thumbnails is implementedThe frontpage is redesignedMay 2018Profile metadata can now be customizedUp-to-date privacy policy is includedSeptember 2018Support for federation relays to improve content discovery is addedPublic pages of profiles and toots are redesignedFeaturing friends on public profile is implementedPress coverageIn the two year span, Mastodon was covered by:The New York TimesThe Washington PostEsquireThe VergeMotherboardWiredNPRThe OutlineAutostraddleForbesI was interviewed on three different podcasts:Software Engineering DailyIf ThenThe ChangelogOne piece of coverage stands out particularly as the source of a running joke on Mastodon. Lance Ulanoff from Mashable opened his April 2017 article “Six Reasons Mastodon Won’t Survive” with the words “William Shatner couldn’t find me on Mastodon. This was a problem.” Since then, Mastodon was known as the Shatner-free space, where you are safe to hide from his gaze.Of course, that article was wrong on many accounts, and severely underestimated Mastodon’s survivability. There were many opinion pieces titled things like “Mastodon is dead in the water” predicting its timely demise. In the end, Mastodon out-survived App.net and Google+, a multi-million dollar project. OtherSince beginning as a single repository on GitHub, Mastodon has got:A beautiful, dedicated homepage describing the projectA dedicated blog, the one you are reading right nowA new documentation websiteA GitLab server hosting many orbiting code repositoriesFazitI’m very happy with Mastodon’s accomplishments. Overseeing such a large project has its ups and downs, as it’s impossible to keep everyone happy all the time when people have conflicting desires. Regardless, I consider these to be the two best years of my life, as work on Mastodon is incredibly fulfilling and interacting with all the interesting people on the platform is very fun.Would I have done something differently if I was starting from scratch now? Mostly, no. I still receive comments about the name “Mastodon” not being suitable, or “toot” being too silly. I wouldn’t change it. I think there is nothing wrong with being less serious, and if it alienates more corporate-minded users, that’s fine. I don’t wake up every day wishing to interact with my favourite brand.As for the future, development continues: The v2.6.0 version of Mastodon is currently in the works, containing many quality of life improvements, bug fixes, improved administrative tools and a decentralized version of identity verification.Mastodon has proved itself sustainable and has accomplished a lot in taking a foothold in mainstream consciousness. With more and more people become disillusioned with the tech giants, Mastodon will become ever more appealing. Let’s get to ten million users next."
year_published = 2018
year_updated = 2018
