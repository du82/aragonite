["https://blog.joinmastodon.org/categories/new-features/page/2"]
title = "New Features - Mastodon Blog"
full_description = "The new Mastodon release brings you a much better audio player and improved support for different audio and video formats, as well as some additional security mechanisms. The audio player has been completely reworked to have a more eye-catching design. It will extract album art from the uploaded audio file automatically, or allow you to upload a thumbnail of your own choosing to be displayed in the center. Dominant colors from the artwork or thumbnail will then be used to give the player a unique look. The latest release of Mastodon introduces a simplified single-column interface as the new default for new users In this release: Polls, new tools for managing followers, new frontpage design, new admin features, Keybase integration, and more In this release: New profile directory, new tutorial, new public hashtag pages and more moderation tools After more than a month of work, I am happy to announce the new version of Mastodon, with improved visuals, a new way to assert your identity, and a lot of bug fixes. Verification Verifying identity in a network with no central authority is not straightforward. But there is a way. It requires a change in mindset, though. Twitter teaches us that people who have a checkmark next to their name are real and important, and those that don’t are not. That delegates a lot of the decision making to Twitter, the authority. Without a central authority, that decision making cannot be delegated. So, how does identity verification work on Mastodon? Mastodon 2.5 is the 100th released version of Mastodon since the project’s inception almost 2 years ago. It brings a variety of improvements to the software, the full list of which is available in the changelog. Public profile page The public areas of the web interface have been redesigned. The color scheme and design is now more consistent with the logged-in interface. The new profile layout makes better use of space for bio text and increases the value of header images. Prominent follow buttons ensure that even people new to Mastodon understand quickly what they can do on it."
year_published = 2020
