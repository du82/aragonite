["https://blog.joinmastodon.org/2018/06/why-we-must-oppose-the-new-copyright-directive"]
title = "Why we must oppose the new copyright directive - Mastodon Blog"
description = "A committee of members of the European Parliament have voted to approve Article 11 and Article 13, which pose a risk to the decentralization of the web and freedom of creative expression."
full_description = "Back Jun 25, 2018Op-EdWhy we must oppose the new copyright directiveIt's pretty bad Eugen RochkoCEO / FounderPolish translation is available: Dlaczego musimy sprzeciwić się nowej dyrektywie o prawie autorskimA committee of members of the European Parliament have voted to approve Article 11 and Article 13, which pose a risk to the decentralization of the web and freedom of creative expression.Article 11 is commonly known as the Link Tax, wherein linking to public pages may become illegal if the link displays a content preview using OpenGraph tags included by the page authors; Article 13 mandates that all user submissions must go through a content filter to detect copyright violations.There will be a wider vote on this in the European Parliament in July. Both would affect how Mastodon operates. Here is why we must oppose its passing:Content detection is not reliableKnown content identification systems such as those on YouTube routinely lead to wrongful takedowns. Sometimes it will detect faint music, inaudible to humans, in a video of the outside. It will mistakenly block public domain or transformative work. But at the same time, it will fail to notice songs with slightly shifted pitch, or video that’s been horizontally flipped. People will file claims for content they don’t actually own, and the onus will be on the creators to prove they have a right to upload. This will stiftle freedom of expression and will rob us of creative diversity.The YouTube of today is already suffering from this, even without Article 13. You think DMCA and demonetizations are bad? People will be denied at time of upload, everywhere.Small players vs. content filteringWhile large social media platforms like Twitter, Tumblr, Facebook and GitHub will be able to invest in developing the technologies required for copyright infringement scanning, others will not. And there are a lot of places on the internet outside of those platforms: blog comments sections, forums, image boards, and of course, Mastodon servers. Non-profit websites, run by individuals or small organizations, will not be able to comply with such requirements. It presupposes not only a technological investment, but also access to copyrighted content libraries to-be-scanned-for.This might lead to an emergence of content ID service providers, centralized scanning facilities, which adds not only another financial factor into the picture, but introduces a huge privacy risk by aggregating all posts from many different platforms into one place. You don’t even have to believe in government snooping, just think of all those data breaches like Equifax.The internet is not just big platformsIf often feels like when the EU passes internet regulations, they think only about the big names like Facebook, Twitter, Google and Amazon. When Germany implemented their own version of the link tax, Google still managed to negotiate a free deal with publishers, because if the publishers are excluded from Google, they’re essentially outcast. But guess who does not have the power to negotiate such deals? Smaller Google competitors.Similarly, GDPR caused a panic among smaller websites and web services due to the fear of being fined a hefty fee, with many shutting down due to uncertainty. Who did not need to panic or scramble were the companies who the law was primarily aimed at, those who violated our privacy the most: Google, Facebook, Twitter, Amazon. They can afford plenty of lawyers and engineers to comply with any new regulations.It is the nature of regulations to shut out small players, and that’s not always bad. You want water and food quality to be regulated, you don’t want any amateurs dabbling in that. And internet privacy is important for sure, in the case of GDPR it seemed to come from the right place. But any regulations will entrench the biggest companies on the market, and you have to ask yourself: Are the media conglomerates whose business model is exploitation really the landscape of the internet you want to solidify for the foreseeable future?The successful companies of today have only been able to become such because the internet was decentralized and anyone could enter the game board freely. I do not think that they are the pinnacle of what is possible, however.We need to keep the decentralized web alive, and oppose Article 11 and Article 13.More resources:Call your MEPsE-mail your MEPsSee who voted to restrict your webMore in: Let’s Fight Automated Filtering… and Web Centralisation!"
year_published = 2018
clearnet = "https://blog.joinmastodon.org/2018/06/why-we-must-oppose-the-new-copyright-directive"
