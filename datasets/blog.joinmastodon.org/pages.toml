["https://blog.joinmastodon.org/categories/news/page/3"]
title = "News - Mastodon Blog"
full_description = "Starting on Feb 8, 2021, we will be developing an official iOS app for Mastodon together with Sujitech and Lickability, which will be free to download and focused on helping new users get started After crowdfunding millions of dollars, social media platform Gab abandoned its own code and switched to the freely available Mastodon software in early 2019 as a way of circumventing Google’s and Apple’s ban on their own app from their app stores, since offering Mastodon’s client-side API would allow any existing Mastodon app to be used to access Gab. We have never had any sympathy for their thinly (if at all) veiled white supremacist platform so that was not a welcome move on our part, however the license that we publish our software under (AGPLv3) allows anyone to use it as they see fit as long as they keep the same license and make their modifications public. To provide a safer experience to new Mastodon users, we are changing the joinmastodon.org server picker Mastodon was first announced to the public through Hacker News, a link aggregator site for programmers, on October 6, 2016. Now we’re celebrating the 2 year anniversary! 🎉"
