["https://blog.joinmastodon.org/pl/2019/01/mastodon-2.7"]
title = "Mastodon 2.7 - Mastodon Blog"
description = "W tym wydaniu: nowy katalog profilów, nowy poradnik, nowa publiczna strona hashtagów i więcej narzędzi moderacyjnych"
full_description = "Back Jan 20, 2019New FeaturesMastodon 2.7Wyróżnienia z listy zmian Eugen RochkoCEO / FounderTen wpis jest tłumaczeniem wpisu Eugena Rochko Mastodon 2.7. Proszę o zgłaszanie mi uwag dotyczących tłumaczenia, jeżeli takie wystąpią.Świeże wydanie Mastodona przynosi długo oczekiwane usprawnienia możliwości poznawania treści i interfejsu administracyjnego, wraz z dużą liczbą poprawek i ulepszeń.Wydanie 2.7 zawiera 376 commitów od 36 współautorów od 31 października 2018. Aby dowiedzieć się, kto dokonał danej zmiany, możesz przejrzeć plik listy zmian, a jeżeli chcesz zobaczyć kompletną listę autorów i tłumaczy, możesz odnieść się do pliku authors. Oba są dołączone do tego wydania.Katalog profilów na mastodon.socialJedną z nowych funkcji jest katalog profilów do którego możesz się zapisać. Katalog pozwala na spojrzenie na najbardziej aktywnych twórców na danym serwerze Mastodona i filtrowanie ich na podstawie hashtagów znajdujących się w ich opisach. Dzięki temu, możesz odnaleźć osoby o podobnych zainteresowań bez konieczności przeglądania publicznej osi czasu, możesz nawet znaleźć osoby warte śledzenia z innych instancji bez konieczności rejestracji i lurkowania!Poradnik wyjaśniający osie czasuPoradnik, który widzą użytkownicy po rejestracji został opracowany na nowo. Od teraz, zamiast opisywać szczegóły domyślnego interfejsu, skupia się on na głównych założeniach Mastodona, na których opiera się jego interfejs. Do tego, zawiera kolorowe ilustracje. Poza tym, ładuje się teraz trochę szybciej, ponieważ nie jest oknem modalnym nachodzącym na interfejs, a ładuje się przed interfejsem.Publiczna strona hashtagu #catstodonPubliczne strony hashtagów bardziej efektywnie wykorzystują przestrzeń ekranu, układając wpisy w masonry grid, zamiast szerokiej kolumny. Publiczna strona hashtagów nie jest częścią interfejsu używanego przez zalogowanych użytkowników – jest stroną skupioną na niezarejestrowanych przeglądających.2.7 zawiera nowy system ostrzeżeń moderacyjnychdla Mastodona. Poprzednio użytkownicy dowiadywali się, że ich konto zostało wyłączone lub zawieszone tylko za pośrednictwem ogólnej wiadomości o błędzie przy próbie uzyskania dostępu do konta, a teraz moderatorzy mogą poinformować użytkowników o podjętych działaniach. Nawet jeżeli nie podejmą żadnego działania, mogą oni wysłać oficjalne ostrzeżenie dostarczane wiadomością e-mail, widoczne dla inncyh moderatorów w interfejsie moderacyjnym. Moderatorzy mogą przekazać w tych wiadomościach dowolne dodatkowe informacje. Ponieważ przyczyny takich działań często są podobne, istnieje system pozwalający na zapisywanie szablonów, których mogą używać moderatorzy, zamiast ręcznego pisania takich samych wiadomości za każdym razem.Oczywiście, ponieważ cięzko jest uogólniać, a niektórych trolli i spamboty najlepiej powstrzymać, kiedy nie wiedzą że zostały powstrzymane, ten system powiadomień może zostać wyłączony w konkretnych sytuacjach.Interfejs administracyjny dla zdalnych kontInterfejs moderacyjny dla kont i instancji również został opracowany na nowo. Konta wyświetlają najważniejsze liczby w prostej do odczytania siatce. Niektóre nieprzydatne informacje zostały usunięte, a takie jak data rejestracji użytkownika lub użytkownik, który wysłał mu zaproszenie zostały dodane. W przypadku kont z innych serwerów, możesz spojrzeć na listę lokalnych użytkowników którzy je śledzą.Interfejs administracyjny dla znanych serwerówInterfejs administracyjny dla znanych serwerów i zablokowane domeny zostały połączone w jedno miejsce. Poza wyświetlaniem liczby znanych kont z danego serwera, możesz dowiedzieć się, ile kont jest śledzonych z Twojego serwera, ile z nich śledzi Twoich użytkowników, ilu zostało zablokowanych lub zgłoszonych i ile miejsca zajmują załączniki multimedialne z tego serwera.Twórcy aplikacji ucieszą się na wiadomość, że wydanie 2.7 wporwadziło API dla rejestracji. Dzięki implementacji tego API, aplikacje mogą przyjmować rejestracje od ich użytkowników, zamiast kierować ich do przeglądarki. Użytkownik który zarejestruje się przez aplikację wciąż będzie musiał otworzyć potwierdzającą wiadomość e-mail, ale będzie ona zawierała odnośnik, który będzie mógł zostać otwarty przez aplikację, a kiedy konto zostanie zaktywowane, aplikacja będzie już uwierzytelniona i gotowa do działania.Narzędzie wiersza poleceń przeznaczone do zarządzania serwerem Mastodona – tootctl (wymawiane „toot control”) otrzymało kilka nowych poleceń. Od czasu powstania Mastodona, niektórzy utworzyli strony zbierające statystyki dotyczące znanych im serwerów Msatodona, oczywiście, te liczby zawsze będą się trochę różniły i ciężko jest określić, w jaki sposób są zbierane. Od teraz, możesz skanować sieć Mastodona z własnego urządzenia aby poznawać serwery i zbierać statystyki dot. korzystania z Mastodona używając polecenia tootctl domains crawl.Po uruchomieniu tego polecenia na własnym urządzeniu, uzyskałem następujące liczby: 2251 aktywnych serwerów Mastodona, 1,882,838 zarejestrowanych użytkowników, 172,041 aktywnych użytkowników i 21,537 nowych rejestracji w pierwszym tygodniu stycznia 2019.Kolejnym nowym poleceniem jest tootctl accounts follow, dzięki któremu wszyscy użytkownicy serwera zaczynają śledzić określone konto. W ramach przypomnienia, domyślnie użytkownicy Mastodona śledzą swojego administratora, dzięki czemu otrzymują ważne ogłoszenia, oraz zapełnia się ich główna oś czasu. To polecenie przydaje się w rzadkich sytuacjach, kiedy administrator potrzebuje zmienić coś na ich kontach.Aby dowiedzieć się więcej o poleceniu tootctl, dodaj do niego --help, np. tootctl domains crawl --helpTo nie wszystko co zostało dodane w tym wydaniu – jest wiele drobnych usprawnień, takich jak możliwość eksportowania list i zablokowanych domen do pliku CSV, suwak głośności dla filmów, możliwość śledzenia wielu hashtagów w tej samej kolumnie, usprawniona osbługa emoji, lepsze zabezpieczenie przed spamem dzięki sprawdzaniu MX i jeszcze więcej.PodsumowanieWspółautorzy tego wydania: 0xflotus, Aditoo17, ariasuni, ashleyhull-versent, BenLubar, chr-1x, Esteth, fwenzel, Gargron, hinaloe, jomo, kedamaDQ, Kjwon15, m4sk1n, mayaeh, mbugowski, moritzheiber, noellabo, nolanlawson, pawelngei, pointlessone, Quenty31, remram44, renatolond, Reverite, shrft, Sir-Boops, sumdog, tachyons, ThibG, tmm576, ykzts, ysksn, yukimochi, zundaTłumacze tego wydania: adrianbblk, Alix D. R., Antonis, avndp, azenet, Branko Kokanovic, Burekz Finezt, ButterflyOfFire, carl morris, codl, Daniel, Eirworks, Enol P., Ivan Pleva, Jaz-Michael King, Jeong Arm, jeroenpraat, koyu, Kristijan Tkalec, Kumasun Morino, lilo, Lorem Ipsum, Marcin Mikołajczak, Marek Ľach, Masoud Abkenar, mayaeh, Muhammad Nur Hidayat (MNH48), Mélanie Chauvel, osapon, Osoitz, Quenti2, Quentí, Ranjith Tellakula, Rasmus Sæderup, Renato “Lond” Cerqueira, rscmbbng, spla, Vanege, Xose M., 小鳥遊まりあJak zawsze, chciałbym podziękować wszystkim którzy dokonali wkładu w to wydanie, wszystkim sponsorującym ten projekt na Patreonie i wszystkim korzystającym z tej sieci! 🐘ZasobyPełna lista zmianDokumentacja dla użytkowników"
