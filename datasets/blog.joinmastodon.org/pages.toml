["https://blog.joinmastodon.org/categories/op-ed"]
title = "Op-Ed - Mastodon Blog"
full_description = "An ever growing problem of the modern social media-rich world is misinformation. The trust that was previously placed into government officials and journalism has eroded; the internet gave everyone a voice but with it made it so much more difficult to distinguish truth from fabrication. The consequences of this are very real: Almost eradicated illnesses are making a comeback because people refuse to vaccinate their children, Covid-19 is continuing to spread because people refuse to wear masks and practice social distancing, more and more people start believing that the Earth is flat and descend down a rabbit hole of ever more absurd conspiracy theories. Can you imagine Facebook closing registrations and saying “Sorry, we have too many users already, you can go sign up on Twitter instead”? And yet, this sort of situation comes up with Mastodon every so often, in regards to the mastodon.social server. You see, Mastodon is decentralized. That means there is no “main” server. If mastodon.social actually disappeared from the face of the Earth, it would not bring down the Mastodon network at all. But it is one of the biggest servers, meaning that if you look at the registered userbase, it is “effectively centralized”. 300,000 is not a small chunk of 2,000,000, after all. Inspired by a joke post I decided to go ahead and compile a list of the most shared things on Mastodon in 2018. A lot of artists have lost their blogs in the Tumblr purge. Here are 5 reasons why Mastodon is the perfect alternative. We often tout things like “Mastodon is based on open web protocols” as one of its advantages. I want to elaborate why exactly that’s a good thing. A committee of members of the European Parliament have voted to approve Article 11 and Article 13, which pose a risk to the decentralization of the web and freedom of creative expression."
