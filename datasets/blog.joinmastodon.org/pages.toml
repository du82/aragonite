["https://blog.joinmastodon.org/2022/02/official-mastodon-for-android-app-is-coming-soon"]
title = "Official Mastodon for Android app is coming soon - Mastodon Blog"
description = "We are developing an official Android app which will be free and focused on helping new users get started on the fediverse"
full_description = "Back Feb 9, 2022NewsOfficial Mastodon for Android app is coming soon Eugen RochkoCEO / FounderFollowing the successful launch of our official iOS app, in January we’ve begun the development of an Android version. We continue working with the NYC design agency Lickability and welcome Gregory Klyushnikov, better known as grishka on the fediverse, as the lead Android developer. Gregory is a talented developer with a history of working on social apps like VKontakte and Telegram.Continued development is not limited to Android. Work on the app flows into the main Mastodon software as existing APIs are adjusted and new APIs are added to support new features, and the web app’s UI is improved with ideas from the professional UX designers working on the iOS and Android apps.We are excited to bring an app that takes usability, new user onboarding and visual design seriously to one of the largest mobile platforms.The efforts are sponsored by our generous sponsors on Patreon and our custom sponsorship platform, and by the Federal Ministry of Education and Research through the Prototype Fund (BMBF Förderkennzeichen: 01IS21S29). Thanks to everyone who is already sponsoring Mastodon, and stay tuned for updates!Update: Our iOS and Android apps are now available!"
