["https://blog.joinmastodon.org/2023/07/mastodon-for-android-update"]
title = "Mastodon for Android update - Mastodon Blog"
description = "Today, Mastodon for Android has received a complete Material You redesign. We left no stone unturned — tab bars, settings, composing — everything is refreshed and reflects your color palette."
full_description = "Back Jul 1, 2023NewsMastodon for Android update Eugen RochkoCEO / FounderWhile usually our app updates don’t get a dedicated blog post, this one is a bit bigger and provides a good opportunity to reflect on how the Android app changed since launch roughly a year ago. Today, Mastodon for Android has received a complete Material You redesign. We left no stone unturned—tab bars, settings, composing—everything is refreshed and reflects your color palette.We’ve entirely revamped the previously sparse settings section with dozens of new ways to customize your experience, as well as the ability to access information about the server you’re connected to and view its rules. You can choose to hide boost/favourite counters, remind yourself to add alternative text for media uploads, change your default posting language, hide all content warnings and much more.When developing our native apps, we don’t just copy how everything works in the web app, but deliberately take the opportunity to have our professional designers work out the best user experience from first principles. As a result, profile screens now ergonomically display all the featured content that was previously missing from the app—like pinned posts, featured hashtags and endorsed users.We’ve also finally added filters management into the app. You can now view, edit and create filters for specific phrases or keywords, and customize how and where exactly those filters apply, so if there’s some topic you never want to hear about, you can just tune it out. For more peace of mind, we’ve also added the ability to temporarily pause all notifications.One subtle but important change is where and how we show verifications. If a profile has a verified link, we’ll surface it in search results and other lists so you can more easily tell different profiles apart. All in all, this is just scratching the surface of all the changes in this redesign. There are so many more features, bug fixes, and easter eggs we didn’t cover. Try it out!Mastodon is a non-profit headquartered in Germany and fully crowd-funded through donations. If you enjoy using mastodon.social, or our official apps for iOS and Android, or want to support the development of the server software itself, you can donate to our non-profit on Patreon."
