["https://blog.joinmastodon.org/categories/news/page/2"]
title = "News - Mastodon Blog"
full_description = "Today we’re making signing up on Mastodon easier than ever before. We understand that deciding which Mastodon service provider to kick off your experience with can be confusing. We know this is a completely new concept for many people, since traditionally the platform and the service provider are one and the same. This choice is what makes Mastodon different from existing social networks, but it also presents a unique onboarding challenge. To make this step easier, we now have a default sign-up option that works with a server we operate. If you wish to leave or join a different server, you can do so at any time. On Dec 16, Twitter suspended our @joinmastodon account after we shared a link to the newly registered Mastodon account of @ElonJet, an account that broadcasts public flight path data of Elon Musk’s private jet, which was previously suspended from Twitter itself. At the same time, accounts of multiple journalists from major publications such as CNN, The New York Times, The Washington Post, as well as various independent journalists, were likewise suspended for either linking to the account itself or talking about the event. We also started receiving reports that users were unable to tweet links to any Mastodon servers, including ones completely unrelated to the @ElonJet account, encountering an error message claiming that the links were identified as “potentially harmful”, among them George Takei, making it more difficult for people to share their Mastodon profiles. We teamed up with the design agency Oak to give our project a modern and professional presence--and we have succeeded! We are teaming up with the design agency Oak to update our homepage and our brand. Goodbye social media blue, hello vibrant purple! The news of Elon Musk buying Twitter has put Mastodon into the public spotlight as an alternative social network, rapidly exploding our growth with over 30,000 new users in just a single day. This is because at Mastodon, we present a vision of social media that cannot be bought and owned by any billionaire, and strive to create a more resilient global platform without profit incentives. We believe that your ability to communicate online should not be at the whims of a single commercial company."
