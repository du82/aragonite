["https://blog.joinmastodon.org/2022/03/mastodon-3.5"]
title = "Mastodon 3.5 - Mastodon Blog"
description = "A brand new explore page, post editing, and new moderation features are just some of the additions in this new release of Mastodon!"
full_description = "Back Mar 30, 2022New FeaturesMastodon 3.5What's new Eugen RochkoCEO / FounderWork on multiple features in this release has been kindly sponsored by the German Federal Ministry of Education and Research through the Prototype Fund.We’ve added one of the most requested functions among our competitors, the ability to edit posts. Since older Mastodon versions would not understand the edits, the function is disabled in the web app until more Mastodon servers upgrade to 3.5, but all parts are already included in the release. The original and previous versions of the posts are saved and remain accessible through a history view. And people who have previously shared the post get notified about any edits, so they can un-share if there’s foul play.Coincidentally, the order of media attachments in a post is no longer dependent on the order in which they were uploaded.Discoverability has always been a hot topic on Mastodon. Discoverability makes or breaks a platform, as there is nothing more important to retain a new user than to let them find something interesting to stay for, as soon as possible. In 3.5, we bring a new explore page which features currently popular posts, news stories that people share a lot, trending hashtags and follow recommendations. Furthermore, for the first time, we attempt to bring people content in their own language.As we value safety, these new features come with their own moderation tools–nothing will show up in trends unless reviewed by one of the server’s moderators first.A new, multi-step report flow improves the quality of information for moderators and highlights available self-help tools in Mastodon to the user.On the topic of moderation, any action taken by a server moderator against a user’s account, such as deleting their posts or suspending the account, will now be viewable through account settings, by default accompanied by an e-mail notification, and permit the user to submit an appeal. Since actions such as deleting posts or marking posts as sensitive did not use to generate any kind of notification, this should make them more viable precursors to harsher punishments like suspensions; and being able to handle appeals within Mastodon should reduce the burden of out-of-band e-mail communication for moderators and increase user trust in Mastodon.There is a brand new moderation dashboard that shows the development of various key metrics over time and shines some light on where new users come from, which languages they speak, and how many of them stay active months later. A completely new look for the report screen reduces the time and effort required to handle reports, and multiple selections on the accounts page offer a way to clean up spam and bot accounts in large batches.ConclusionThe 3.5 release consists of 887 commits by 23 contributors between June 3, 2021 and March 30, 2022. For line-by-line attributions, you can peruse the changelog file, and for a historically complete list of contributors and translators, you can refer to the authors file, both included in the release.Contributors to this release: Gargron, ClearlyClaire, tribela, noiob, mayaeh, mashirozx, noellabo, baby-gnu, MitarashiDango, chandrn7, Brawaru, aquarla, zunda, rgroothuijsen, ykzts, HolgerHuo, helloworldstack, r0hanSH, kgtkr, heguro, matildepark, weex, truongnmtTranslators for this release: Kristaps_M, Cyax, Sveinn í Felli, Kimmo Kujansuu, Jeong Arm, xatier, Thai Localization, spla, NCAA, Emanuel Pina, GunChleoc, Xosé M., Hồ Nhất Duy, T. E. Kalaycı, ケインツロ space_invader, e, Jeff Huang, Besnik_b, Nurul Azeera Hidayah @ Muhammad Nur Hidayat Yasuyoshi, koyu, Ramdziana F Y, calypsoopenmail, Alessandro Levati, Bran_Ruz, Tigran, Allen Zhong, Daniele Lira Mereb, Zoltán Gera, Martin, Gearguy, Marek Ľach, Eshagh, Asier Iturralde Sarasola, Takeçi, Roboron, Ihor Hordiichuk, xpil, Tagomago, Rojdayek, Ondřej Pokorný, Kristoffer Grundström, Alexander Sorokin, Joene, ButterflyOfFire, Balázs Meskó, Catalina, Manuel Viens, L