["https://blog.joinmastodon.org/pl/2020/08/mastodon-3.2"]
title = "Mastodon 3.2 - Mastodon Blog"
description = """
Nowe wydanie Mastodona wprowadza zdecydowanie lepszy odtwarzacz audio, usprawnioną obsługę różnorodnych formatów audio i wideo, a także dodatkowe mechanizmy zabezpieczające.
Ten wpis jest tłumaczeniem wpisu pt. Mastodon 3.2 – A look inside. Proszę o zgłaszanie mi uwag dotyczących tłumaczenia, jeżeli takie wystąpią.
Całkowicie na nowo opracowano odtwarzacz dźwięku, aby otrzymał bardziej przyciągający wzrok wygląd. Automatycznie wydobywa on obraz albumu z pliku, lub pozwala na wybór wyświetlanej po środku miniatury. Dominujący kolor z tej grafiki jest wykorzystywany aby nadać odtwarzaczowi wyróżniający się wygląd."""
full_description = "Back Aug 2, 2020New FeaturesMastodon 3.2Spojrzenie w głąb Eugen RochkoCEO / FounderNowe wydanie Mastodona wprowadza zdecydowanie lepszy odtwarzacz audio, usprawnioną obsługę różnorodnych formatów audio i wideo, a także dodatkowe mechanizmy zabezpieczające.Ten wpis jest tłumaczeniem wpisu pt. Mastodon 3.2 – A look inside. Proszę o zgłaszanie mi uwag dotyczących tłumaczenia, jeżeli takie wystąpią.Całkowicie na nowo opracowano odtwarzacz dźwięku, aby otrzymał bardziej przyciągający wzrok wygląd. Automatycznie wydobywa on obraz albumu z pliku, lub pozwala na wybór wyświetlanej po środku miniatury. Dominujący kolor z tej grafiki jest wykorzystywany aby nadać odtwarzaczowi wyróżniający się wygląd.Tak jak poprzednio miniatury filmów były automatycznie oparte o pierwszą klatkę filmu, teraz możesz wysłać własną miniaturę, która będzie wyświetlana przed odtworzeniem filmu. Po prostu naciśnij „Edytuj” na nowo wysłanym medium i wybierz nową miniaturę!Plik dźwiękowy z Mastodona wyświetlany na TwitterzeJeżeli dzielisz się linkami do filmów lub dźwięku z Mastodona na innych platformach, np. na Twitterze, twoi znajomi będą mogli otworzyć odtwarzacz mediów Mastodona bezpośrednio z tej platformy (zakładając że platforma obsługuje tag twitter:player).Aby lepiej zabezpieczać konta gdy nie korzystasz z nich, powstał nowy mechanizm zabezpieczający próby logowania. Jeżeli nie skonfigurowałeś(-aś) uwierytelniania dwustopniowego, nie byłeś(-aś) obecny(-a) przez przynajmniej dwa tygodnie, a ktoś spróbuje zalogować się z wcześniej nieznanego adres IP, otrzymasz prośbę o wysłanie tokenu wysłanego na Twój adres e-mail.Ta funkcja jest przeznaczona dla osób które zapomniały skonfigurować uwierzytelnianie dwuetapowe. Jeśli to czytasz, pamiętaj że wzorową praktyką jest korzystanie z 2FA (Mastodon nnie wymaaga podana numeru telefonu ani aplikacji Mastodona, każda aplikacja TOTP działa) i używania menedżera haseł, aby tworzyć losowe i unikatowe hasła dla każdego posiadanego konta!Dodawanie osobistej notatkiZdarzyło ci się zablokować lub wyciszyć kogoś i zapomnieć, dlaczego to zrobiłeś(-aś)? A może zaobserwowałeś(-aś) sporo osób i nie pamiętasz kim oni są? Teraz możesz dodać osobiste notatki do innych kont, aby pamiętać kto jest kim. Widoczne tylko dla ciebie!PodsumowanieNa wydanie 3.2 składa się 380 commitów od 27 autorów od 14 maja 2020. Aby dowiedzieć się kto odpowiada za konkretną zmianę, możesz przejrzeć plik changelogu, a dla kompletnej i listy wkładu i tłumaczeń możesz skorzystać z pliku authors (oba uwzględnione w tym wydaniu).Wkład w to wydanie wnieśli: OmmyZhang, ThibG, Gargron, noellabo, Sasha-Sorokin, dunn, highemerly, tateisu, ariasuni, bclindner, cchoi12, leo60228, mfmfuyu, mayaeh, lfuelling, ykzts, angristan, BenLubar, trwnh i arielrodriguesTłumacze tego wydania: Duy, stan ionut, Besnik_b, Emanuel Pina, regulartranslator, ButterflyOfFire, adrmzz, FédiQuébec, GiorgioHerbie, Marcin Mikołajczak, ariasuni, Thai Localization, 奈卜拉, Mentor Gashi, Xosé M., axi, Selyan Slimane AMIRI, Alix Rossi, Jeroen, SteinarK, ThonyVezbe, Hrach Mkrtchyan, Gwenn, ᏦᏁᎢᎵᏫ mask, Danial Behzadi, spla, Rafael H L Moretti, Jeong Arm, koyu, Yi-Jyun Pan, norayr, Alessandro Levati, Sasha Sorokin, gagik_, lamnatos, Sveinn í Felli, Zoltán Gera, cybergene, Tagomago, Michal Stanke, borys_sh, Ramdziana F Y, Osoitz, Maya Minatsuki, Willia, BurekzFinezt, Evert Prants, ThibG, Dewi, Emyn-Russell Nt Nefydd, vishnuvaratharajan, tolstoevsky, Diluns, Falling Snowdin, Marek Ľach, Balázs Meskó, Ryo, Roboron, StanleyFrew, PPNplus, Heimen Stoffels, Andrew, Iváns, Carlos Solís, Sokratis Alichanidis, TS, SensDeViata, AzureNya, OctolinGamer, 北䑓如法, Laura, Imre Kristoffer Eilertsen, Rikard Linde, Ali Demirtaş, diorama, Daniele Lira Mereb, Goudarz Jafari, psymyn, v4vachan, Sebastián Andil, Khóo, ZiriSut, strubbl, Reg3xp, AlexKoala, VSx86, Mo_der Steven, musix, ギャラ, Saederup92, mynameismonkey, omquylzu, Miro Rauhala, 硫酸鶏, siamano, Viorel-Cătălin Răpițeanu, Pachara Chantawong, Balázs M