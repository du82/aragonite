eryone who sponsors the project through Patreon or through our new sponsors portal, and to everyone who uses the network! 🐘Mastodon for iOSP.S. We just released a new version of our official iOS app, adding iPad support and many visual improvements, and just started beta-testing our official Android app with our Patreon supporters."
