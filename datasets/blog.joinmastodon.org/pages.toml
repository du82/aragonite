["https://blog.joinmastodon.org/2024/09/trunk-tidbits-august-2024"]
title = "Trunk & Tidbits, August 2024 - Mastodon Blog"
description = "Updates, news, and code changes from the Mastodon engineering team, for August 2024. The 4.3 beta is here!"
full_description = "Back Sep 9, 2024Trunk and Tidbits EngineeringTrunk & Tidbits, August 2024 Andy PiperDeveloper Relations Renaud ChaputCTOIt was a big month for the Mastodon team, with a lot of work going into getting the first beta release of version 4.3 ready - but that’s not all that we’ve worked on. Here is our monthly update on what we’ve been up to.ReleasesDuring August, we released versions 4.2.12 (as well as a short-lived 4.2.11) and 4.1.19, with many bug fixes. If you are running the 4.2.x or 4.1.x series, we recommend that you upgrade to these latest versions.We also released the first beta of Mastodon 4.3! This release includes a number of new features and improvements, including a new notifications screen, a new way to filter notifications, and a number of new APIs. Take a look at the full release notes here. You will want to take a look at the requirements for upgrading to the new version, as many dependencies have been updated.We are already running the latest code on our own instances (mastodon.online and mastodon.social), but it is important to get input from elsewhere. We appreciate all the feedback we can get from those upgrading to and running 4.3.0-beta.1 with their Mastodon communities - you can help us to make the release version even better.Current workOur current plan is to release a second beta (i.e. 4.3.0-beta.2) in mid-September, with the final version of 4.3.0 coming 2-3 weeks after that.Web and BackendIn August, we reviewed and merged 242 Pull Requests (163 with translation and dependency updates removed) from 18 authors. If you’re looking to get involved, here is a great place to start - a list of issues covering bug fixes and features, for both the backend and frontend.new feature A lot of work went into incorporating community feedback on the filtered notifications feature. You can now choose to drop messages rather than filtering them, reject or accept multiple ones at once, and the UI is much better. — PR #31242 (by ClearlyClaire) — PR #31262 (by renchap) — PR #31250 (by ClearlyClaire) — PR #31343 (by ClearlyClaire) — PR #31342 (by ClearlyClaire) — PR #31309 (by ClearlyClaire) — PR #31457 (by renchap)new feature Many small things have been tweaked in the new notifications screen. We enabled the new notifications (with grouping) for everyone on mastodon.social and mastodon.online, which gave us more feedback, and we are adjusting some things accordingly. It also helped to ensure that the new API did not cause significant performance issues. If you are a client application developer, you can provide feedback on the new notifications API, before we mark it as stable.interface Font Awesome removal! The main app got its icons replaced with Material Icons a few months ago, but Font Awesome was still used in the Rails rendered views (preferences, admin & moderation panels). Thanks to @mjankowski, those have been replaced as well, and we can now stop loading Font Awesome CSS & font files, which significantly reduces the page size.api We added a new api_versions property in /api/v2/instance to provide a way for client apps to more easily detect the features available on the server. You can read more about this in the PR. — PR #31354 (by ClearlyClaire)api The recently added customisable instance icon is now available in the API — PR #30205 (by renchap)admin After being deprecated in 4.2, the statsd integration has been removed. Check the 4.3 release notes for possible replacements. — PR #30240 (by mjankowski)interface The last confirmation modal, for boosting, has been updated to the new design. — PR #31555 (by Gargron)Again, there have been lot of bug fixes and refactoring from our recurring (and new!) contributors - thanks a lot!One more thing: the Azure storage support is likely to be removed in the future, as Microsoft is abandoning their Ruby SDK. More information here.We are currently working on:Polishing things before the 4.3 release, mostly around grouped notifications, along with some interface fixes.Launching a new project around Fediverse Discovery, thanks to a grant by the European Commission through their NGI Search program. More information very soon!Once 4.3 is branched out and in Release Candidate, we will focus on specification work for Quote Posts.We are also starting brainstorming around block list improvements. We did some preliminary work on this in 4.3, and we expect this to be one of the big features for 4.4.Mobile appsThere has not been a lot of activity around the mobile apps in August, due to the summer vacations. The recruitment for our full-time iOS developer position is going well and should be over by the end of September.We would like to support the new grouped notifications in the mobile apps soon, as this is a very useful feature, and it will be our focus for the immediate future.Around the CommunityHere are just a few of the things that we spotted from the developer community this past month!The wonderful @vmstan went through the documentation, and updated all of the screenshots to reflect the latest designs! You can see the pull request here and you can expect to see the updated documentation soon.Tom Casavant posted a blog entry about including Mastodon posts in DuckDuckGo search results.Alan Pope aka Popey shared a new bot, Uncle Clive, to post the results of programs for the vintage / retro Spectrum computer. You can read about it in his newsletter archive.A Hugo shortcode, stoot for including Mastodon posts in your site.Our Developer Relations human, Andy, asked about what folks may not have seen that is built on the Mastodon API, and had responses ranging from an existing iOS app with a unique UI (Pipilo), to a new app currently in iOS TestFlight (Fedicat), to an new scheduling option (MixPost). So now you know about them, too!GratitudeIt is a pleasure to look back on the contributions from our community every month. The team wants to thank everyone who uses Mastodon and by doing so, helps to make it better. We are grateful for your support, your code, your bug reports, your translations, and your feedback. Thank you!Thank you for supporting MastodonWe develop and maintain the free and open-source software that powers the social web. There is no capital behind this—we rely entirely on your support through platforms like Patreon.Donate on Patreon Donate directly View our sponsors"
