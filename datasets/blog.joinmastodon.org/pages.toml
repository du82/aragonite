["https://blog.joinmastodon.org/page/9"]
title = "Mastodon Blog"
description = "Updates from the Mastodon team"
full_description = "My instance mastodon.social has recently surpassed 43,000 users. I have closed registrations both to have more time to investigate the infrastructure and ensure a good experience for existing users, and to encourage more decentralization in the network (with a wonderful effect — the Mastodon fediverse now hosts over 161,000 people spread out over more than 500 independent instances!) But providing a smooth and swift service to 43,000 users takes some doing, and as some of the other instances are approaching large sizes themselves, it is a good time to share the tips & tricks I learned from doing it. My name is Eugen Rochko and I’m the creator of Mastodon, a free, open-source federated social network server. The flagship instance mastodon.social has over 23,000 users and is growing fast. You can check it out here. If your organization is hosting a Mastodon instance, it is essentially a self-perpetuating brand awareness campaign. When people from other instances talk to or follow your users, they see your domain name all the time, since it is part of their globally unique usernames. It’s like those sticker ads on cars, except you don’t have to pay for them and it doesn’t disturb anyone because you’re providing a service. My name is Eugen Rochko and I’m the creator of Mastodon, a free, open-source federated social network server. The flagship instance mastodon.social has over 22,000 users and is growing fast. You can check it out here. Very early on in the development of Mastodon I’ve decided that centralization and unexpected algorithmic changes were not the only one of Twitter’s problems. Harrassment and tools to deal with it have always been lacking on Twitter’s end. I reached out to people who have been affected by it to collect ideas. Here is what I gathered: Mark Zuckerberg’s manifesto might be well-spirited, but one thing in it is fundamentally wrong: In times like these, the most important thing we at Facebook can do is develop the social infrastructure to give people the power to build a global community that works for all of us. Facebook isn’t, and can never be, a platform where people have the power to build anything. Facebook doesn’t even have the pretense of a non-profit like Wikipedia or Mozilla; there is no doubt about the company’s main focus — extracting as much as possible from you — by analyzing your data and showing you ads in exchange for advertiser’s money. A future where Facebook is the global social infrastructure, is a future with no refuge from advertising and number crunching."
