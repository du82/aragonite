["https://blog.joinmastodon.org/2025/01/trunk-tidbits-december-2024"]
title = "Trunk & Tidbits, December 2024 - Mastodon Blog"
description = "The latest engineering updates from the Mastodon team technical updates covering December 2024: including Fediscovery, FOSDEM... and, holidays."
full_description = "Back Jan 10, 2025Trunk and Tidbits EngineeringTrunk & Tidbits, December 2024 Andy PiperDeveloper Relations Renaud ChaputCTOA belated “happy 2025!” wish, from the Mastodon team (although, if you’ve been paying attention, there has been some important news already this month). We’re a little later than planned in posting a summary of the work that happened during December, but let’s get into it.Last month was a bit more quiet than usual, because most of the team took time off with friends and family over the annual holiday season.In case you missed itAt the start of December, our Developer Relations lead, Andy, gave the opening keynote at RubyWorld 2024 in Japan (including a video message from Eugen). The topic was The Social Web: Decentralization and Building a Better Internet, and included the important role that Ruby plays in Mastodon’s development. You can read the full script of the talk, and also access the slides.Talking about Mastodon in JapanDuring December, the project published the Annual Report for 2023.We secured a table at FOSDEM 2025: find us at H14. We will also be part of the Social Web track (more on this below), and attend the Social Web After Hours meetup.We’ve opened a new role on the team, for a front-end web developer.Post by @MastodonEngineering@mastodon.socialView on MastodonReleasesNo release updates during December: the latest released versions remain 4.3.2, 4.2.14, and 4.1.21.As a reminder, Mastodon 4.1.x is now deprecated, which means that it will reach End of Life and no longer receive updates on April 8, 2025. If you own an instance running 4.1.x, please update to 4.2.x or 4.3.x soon.We recommend that owners / administrators of Mastodon instances upgrade to the latest available versions, as appropriate to their environments.Code updatesIn December, we reviewed and merged 187 Pull Requests (127 with translation and dependency updates removed) from 17 authors. This was a quieter month, as the team was away for the holiday break.Backendinterface Add an option to use the system scrollbars — PR #32117 (by vmstan)new feature Do not direct unconfirmed users to the settings, but to the “Check your inbox” screen, to reduce confusion — PR #33209 (by Gargron)new feature Adds optional Terms of Service, along with a generator based on a template from our law firm. This is not yet 100% finished, as we plan to update it based on feedback. — PR #33055 (by Gargron)new feature Allow instance to configure their HTTP Referer policy through a system setting. We previously disabled any Referrer header on links to external websites to avoid any data leakage, but on instances with many users it makes sense to allow the referer domain, as you can not tie the visit to any user. It will help publishers to see traffic coming from Mastodon. — PR #33214 (by Gargron) — PR #33239 (by renchap)new feature Changed the search feature so the parameters are in the URL. It allows copy and pasting of a search result page. — PR #32949 (by Gargron)interface New cute animation on the feed loading screen. — PR #33311 (by Gargron)interface Simplify the design of the interaction modal to make it less confusing to users and focus on the important part. — PR #33278 (by Gargron)performance Add a configuration option to configure Active Record query log tags, which will insert an SQL comment in every query with the controller and action that generated the query. This is very useful for SQL performance work. — PR #33342 (by renchap)AndroidNothing significant to report for December.iOSOur final release of 2024 brought improvements to the compose window and the timeline.The app is now less likely to freeze up while you’re typing out a post, and the post compose view won’t disappear (along with all your typing…) until after the post has successfully published.In the timeline, link previews no longer show large blank spaces for images that never arrive, and compact link previews show all the expected information.We also fixed a problem where images and avatars could show up with posts they didn’t belong to, and one where GIFs in content-warned or filtered posts were not blurred out. Filters set to hide, really do remove posts from your timeline completely now, and tap targets in the post header are easier to hit (for the author name, action menu button, and show/hide button).In the coming months, we will continue improving stability and fixing small UI issues while working towards supporting grouped notifications, and updating post layouts to the latest design.Documentation and websiteWe continue to get great community contributions for the documentation repository, and will work on improving our rate of review here during 2025.The code for the main joinmastodon.org website has a backlog of dependency updates via Renovate, including some with React components that contain breaking changes. If you would like to help out here, please take a look - we would welcome the additional help to get things to a better state!Fediscovery ProjectWe merged our first draft of the data sharing specification. We also have a working proof of concept provider implementation, along with the Mastodon integration.Work is now focused on the first real capability, trends (for which we have a first specification draft), and the implementation of the reference provider software.You can learn more about Fediscovery at FOSDEM - check out David’s talk on Saturday afternoon.ThanksThe past year has been a period of change and growth, inside and outside of the Mastodon project - new team members, new organisations forming in the Fediverse, more people discovering that there is an opportunity to choose better social media. If you read the news about the organisational change over the coming months, you will see that we plan to continue to build Mastodon for everyone.Thank you for your support, and for your contributions.Thank you for supporting MastodonWe develop and maintain the free and open-source software that powers the social web. There is no capital behind this—we rely entirely on your support through platforms like Patreon.Donate on Patreon Donate directly View our sponsors"
year_published = 2025
