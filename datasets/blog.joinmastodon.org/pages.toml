["https://blog.joinmastodon.org/ja/2018/12/why-does-decentralization-matter"]
title = "なぜ脱中央集権（decentralization）が重要なのか？ - Mastodon Blog"
description = "あなたのソーシャルネットワークがどのように運営され、どんな構造になっているのか、関心を持つべき理由"
full_description = "Back Dec 30, 2018Op-Edなぜ脱中央集権（decentralization）が重要なのか？ Eugen RochkoCEO / Founderこの記事はEugen RochkoさんによるWhy does decentralization matter?の翻訳です。丁寧にレビューしてくれたとりいゆきさんに感謝します。翻訳に関するご意見などは北市真までお願いします。わたしは二年間ずっとMastodonについて書いてきましたが、なぜ脱中央集権を大事にしなければならないのか、簡潔明瞭な言葉で説明したことが一度もないということに気が付きました。もちろん、インタビューで説明したことはありますし、宣伝資料のそこかしこにいくらか論拠を見付けることもできるでしょう。ですが、この記事がそういった疑問への回答の決定版になるはずです。脱中央集権（decentralization）【名詞】機能や権力を分散させること。権限を中央の権威から地域や地方に委任すること。連合世界（fediverse）【名詞】ActivityPub標準を使うMastodon、Pleroma、Misskeyなどが形成する、脱中央集権化したソーシャルネットワーク。何がそんなに大ごとなのでしょう？ 脱中央集権は、ソーシャルネットワークの運営コストを劇的に下げることでビジネスモデルを一変させます。一つの組織が、単独で全ての運営コストを背負わなければならないということから解放されるのです。いちサービス提供者が無理のない範囲や金銭上の限度を越えてまで成長する必要はありません。参入コストがほとんどゼロなので、Mastodonの運営者は—スケールの大きな収益構造を使うよう運営者に迫ってくる—ベンチャーキャピタルを探なくて大丈夫です。Facebookの重役たちがWhatsApp買収後に年間$1のビジネスモデルを排除したのには理由があります。持続可能だし公正だったのですが、投資に対して予想もできないような、青天井にさえなるかもしれないようなリターンを生み、株価を引き上げることはないからです。広告のようには。もしあなたがFacebook側の人間であれば、広告のように莫大な利益を生むものに集中するのはいいことです。ですが、Facebookのユーザーだったら……。古い格言「金を払ってないならお前は商品だ」の通り、Facebook社とユーザーの利益は食い違うものです。このことは、次のようなダークパターン1にはっきりと表れています。デフォルトでは時系列に沿っていないフィード（そのページで過去分を全部見たのかはっきりさせるのが難しいので、更にスクロールしたり更新したりすることになります。これにより広告のインプレッションが増えます）、実際には存在しない未読の通知メール、あなたが誰なのか暴くためにインターネットをまたいでブラウザーの動作を追跡すること……。脱中央集権はデジタル世界の生物多様性であり、エコシステムの健全さを保証します。連合世界などの脱中央集権化したネットワークによって、様々なユーザーインターフェイス、様々なソフトウェア、様々な運営形態が共存、協力できるようになります。何らかの災害が起こった時には、ある所は他所よりもうまくそれに適応し、生き残ります。これはモノカルチャーにはできないことです。すぐに、最近の例を思い出すことができます。アメリカで可決されたFOSTA/SESTA法案2を考えてみましょう。主だったソーシャルネットワークはどれもアメリカに基点を置いていたので影響を受け、セックスワーカーにとっては悲惨なことになりました。ドイツではセックスワークは合法です。それなのに、ドイツのセックスワーカーがソーシャルメディアに参加してはならいないというのは、一体どういうことでしょう？脱中央集権化したネットワークは検閲に対してもより抵抗力があります—「鉤十字の投稿を認めない」という類のことではなく、真の意味での検閲に。大企業の方が政府の要求に対してうまく対抗できると主張する人もいるでしょう。ですが実際には、営利企業は、ビジネスを進めたいと思っている市場のために政府の要求に対抗するのです。例えば、Googleの中国における検閲へのぱっとしない反対や、Twitterがトルコ人活動家を定期的にブロックすることを考えてみてください。ここでの脱中央集権化したネットワークの強みは数にあります。サービス提供者はブロックされたり権威に従ったりしますが、全てがそうだというわけではありません。また、新しいサーバーを作るのも簡単です。大事なことを言い残していましたが、脱中央集権は権力の非対称性を是正するものだということです。中央集権的なソーシャルメディアプラットフォームは階層構造であり、そこでは開発やプラットフォームの方向性だけでなく、ルールやその施工をCEOが決定します。そして、ユーザーはそれに異議を唱える術をほとんど持ちません。一つのプラットフォームが友人、知人、支持者を全て抑えた時には、そこから離れることができなくなるのです。脱中央集権化されたネットワークは、そもそもプラットフォームの所有者が存在しないようにすることで、所有者によるコントロールというものを捨て去っています。例えば、わたしはMastodonの開発者ですが、助言程度の影響力しか持っていません。新機能を開発して新規リリースを公開することはできます。しかし、望まない人にアップグレードを強制することはできないのです。わたしは、インターネット上の他のどのウェブサイトもコントロールしていないのと同じに、自分のサーバーを除いてはどのMastodonサーバーもコントロールしていません。これは、このネットワークがわたしの気まぐれに弄ばれはしないことを意味します。わたしよりも素早く状況に適応できますし、わたしが予想もしないような使い方を生み出すかもしれないのです。新しく作られたどんなソーシャルネットワークも、それが脱中央集権を拒むものであれば、最終的にこうした問題にぶつかることになるでしょう。そして、これまでに挑戦して失敗した他のソーシャルネットワークと同じ末路を辿らずに消滅しないで済んだのならば、その時には自分が取って代わろうとしたものと同じになるだけなのです。更に掘り下げる：How Mastodon uses decentralization（Mastodonはどのように脱中央集権を使っているのか）The nature of the self in the digital age（デジタル時代における自己というものの性質）訳注：ユーザーを騙して意図しないことをさせようとするウェブサイトやアプリの作り方のパターン。 ↩︎訳注：ウェブ上での性的取引を禁じる法案。 ↩︎"
year_published = 2018
