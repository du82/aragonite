["https://blog.joinmastodon.org/categories/op-ed/page/2"]
title = "Op-Ed - Mastodon Blog"
full_description = "Deep down you always knew it. On the edge of your perception, you always heard the people who talked about the erosion of privacy, that there was no such thing as free cheese, that if you don’t pay — then you’re the product. Now you know that it’s true. Cambridge Analytica has sucked the data so kindly and diligently collected by Facebook and used that data to influence the US elections (and who knows what else). This article assumes you’ve read my previous two blog posts, here and here. Why not give them a quick read if you haven’t already? To balance out the doom and gloom of an internet wholly under the thrall of corporate interests and fed through single channels devoid of competition, it’s worth being aware of just how pervasive and powerful an idea decentralization is in the 21st century. The structure of things now are remnants of the way things have always been done: we trust in a singular authority to manage everything behind the scenes so that our experience on this side remains seamless. ISPs, once a central requirement, are increasingly becoming outmoded, antiquated, and unnecessary. Do we need a middleman managing what is, for all intents and purposes, access to a utility? Isn’t it a bit strange that the entire world has to wait on the CEO of Twitter to come around on what constitutes healthy discourse? I am not talking about it being too little, too late. Rather, my issue is with “instant, public, global messaging and conversation” being entirely dependent on one single privately held company’s whims. Perhaps they want to go in the right direction right now for once, but who’s to say how their opinion changes in the future? Who is Twitter really accountable to except their board of directors? The online space is dominated by a small handful of companies that command a disproportionate amount of power and influence over the entire online experience, not just social media. So much influence that several of these companies have fundamentally altered many aspects of life offline; often described with the floral language of the privileged as ‘disruptive,’ but more clearly understood in the common tongue as ‘destructive.’’ The five most valuable companies at the end of 2017 were, in order: Apple, Alphabet (the company that owns Google), Microsoft, Amazon, and Facebook. each business not only depends on, but commands large parts of the technological landscape. What do all these companies have in common?"
