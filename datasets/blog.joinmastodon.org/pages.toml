["https://blog.joinmastodon.org"]
title = "Mastodon Blog"
description = "Updates from the Mastodon team"
full_description = "It is more important than ever that the social web is not controlled by corporations. Today, Mastodon is taking another step towards its founding ideals: independence and non-profit ownership. We're transferring ownership of key assets to a new European not-for-profit entity, ensuring our mission remains true to a decentralised social web, not corporate control. Sharing our thinking and progress on bringing Quote Posts to Mastodon, with a goal to create a safe and respectful space for everyone. News and updates from the Mastodon developers. Technical changes from January 2025, and what the core team did at FOSDEM. The latest engineering updates from the Mastodon team technical updates covering December 2024: including Fediscovery, FOSDEM... and, holidays. If you're curious how Mastodon is doing by the numbers, the 2023 Annual Report is finally here. How large is our budget, and where does it go? Who works on Mastodon? For all of this and more, we've got an answer--at least as far as 2023 goes. Mastodon core team technical updates for November 2024: the latest point releases, progress on Fediscovery, FOSDEM planning, and projects from the developer community. Engineering updates from the Mastodon core team, October 2024. Initial updates post-4.3, a new team member, and lots of community news. Grouped notifications, notification filtering, better onboarding and a refreshed look await in this new release of our decentralized open-source social media software. Updates, news, and code changes from the Mastodon engineering team, for August 2024. The 4.3 beta is here!"
