["https://blog.joinmastodon.org/page/6"]
title = "Mastodon Blog"
description = "Updates from the Mastodon team"
full_description = "In this release: Polls, new tools for managing followers, new frontpage design, new admin features, Keybase integration, and more We have published a 1-click install image on DigitalOcean. This reduces the initial time investment in self-hosting Mastodon substantially. You create a new droplet, choose the Mastodon image, and once it boots up, you are taken through an interactive setup prompt. The only necessary information for the prompt is a domain name (it should already be pointing at the IP address of your droplet!) and credentials to some e-mail delivery service, like SparkPost, Mailgun, Sendgrid, or something similar. Once you enter them into the setup prompt, your brand new Mastodon server boots up, ready to go. Can you imagine Facebook closing registrations and saying “Sorry, we have too many users already, you can go sign up on Twitter instead”? And yet, this sort of situation comes up with Mastodon every so often, in regards to the mastodon.social server. You see, Mastodon is decentralized. That means there is no “main” server. If mastodon.social actually disappeared from the face of the Earth, it would not bring down the Mastodon network at all. But it is one of the biggest servers, meaning that if you look at the registered userbase, it is “effectively centralized”. 300,000 is not a small chunk of 2,000,000, after all. In this release: New profile directory, new tutorial, new public hashtag pages and more moderation tools Inspired by a joke post I decided to go ahead and compile a list of the most shared things on Mastodon in 2018. A lot of artists have lost their blogs in the Tumblr purge. Here are 5 reasons why Mastodon is the perfect alternative. After more than a month of work, I am happy to announce the new version of Mastodon, with improved visuals, a new way to assert your identity, and a lot of bug fixes. Verification Verifying identity in a network with no central authority is not straightforward. But there is a way. It requires a change in mindset, though. Twitter teaches us that people who have a checkmark next to their name are real and important, and those that don’t are not. That delegates a lot of the decision making to Twitter, the authority. Without a central authority, that decision making cannot be delegated. So, how does identity verification work on Mastodon?"
