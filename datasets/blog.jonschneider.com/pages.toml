["https://blog.jonschneider.com/2008/02"]
title = "Jon Schneider's Tech Blog: February 2008"
description = "Press the Any key to continue!  (Software development and technology)"
full_description = '''ClipPath is a shell extension for Windows which adds an option to the right-click menu for files and folders to copy the location (fullly specified path and filename) of the file to the clipboard. It's a handy timesaver in lots of situations. For example, after saving a file such as a Word document to some deeply-nester folder, you might want to attach that file to an email message. Normally, to do this, in your email program, after activating the "attach file" function, you'd then have to browse through the filesystem to the location to which you'd just saved the file. With ClipPath, after saving the document, you can just bring up an Explorer window with the location of the saved file (by doing a File | Save As from the application where you were editing the document), right-click the saved file, and copy the file's location to the clipboard with the ClipPath option on the right-click menu. Then, cancel out of the Save As dialog, and in your email program, activate the "attach file" function, and just paste the full path to the file in the Open File dialog (instead of having to manually browse through the filesystem to the file's location). I've been using ClipPath for well over a year now, and I've never had a problem with it. You can download ClipPath from the Essential Developer Resources page of the website of the utility's author, sureshms. Occasionally, in debugging, it can be useful to get the current call stack trace of a program as a String. Here's a simple Java method that will do this: private static String getCallStackString() { java.io.ByteArrayOutputStream byteArrayOutputStream = new java.io.ByteArrayOutputStream(); java.io.PrintStream printStream = new java.io.PrintStream(byteArrayOutputStream); Throwable throwable = new Throwable("Current call stack:"); throwable.printStackTrace(printStream); return byteArrayOutputStream.toString(); } Note that this works even in pre-1.4 Java versions, since it doesn't use the getStackTrace method (introduced in Java 1.4). The output of this method is a string along the lines of the following: java.lang.Throwable: Current call stack: at JavaTest.getCallStack(JavaTest.java:36) at JavaTest.main(JavaTest.java:24) A minor variant of this method can be used to get the call stack of an existing Exception: private static String getCallStackString(Throwable throwable) { java.io.ByteArrayOutputStream byteArrayOutputStream = new java.io.ByteArrayOutputStream(); java.io.PrintStream printStream = new java.io.PrintStream(byteArrayOutputStream); throwable.printStackTrace(printStream); return byteArrayOutputStream.toString(); }'''
