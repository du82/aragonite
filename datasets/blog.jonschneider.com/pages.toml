["https://blog.jonschneider.com/2006/04/bugs-in-google-toolbar-v20-beta-for.html"]
title = "Jon Schneider's Tech Blog: Bugs in Google Toolbar v2.0 beta for Firefox?"
description = "Earlier today, I installed the Google Toolbar v2.0 beta update for Firefox .  I've noticed a couple of problems since installing it:  Alt+g ..."
full_description = '''Earlier today, I installed the Google Toolbar v2.0 beta update for Firefox. I've noticed a couple of problems since installing it: Alt+g The Alt+g keyboard shortcut to focus the search field on the toolbar no longer works. I can see why this was missed during testing because for most Firefox users, Alt+g opens the Go menu. However, in my copy of Firefox, I have the Go menu disabled, which I did for the specific purpose of allowing Alt+g to work with the Google toolbar instead (as it does in the Internet Explorer version of the Google toolbar)! I reported this issue to Google via their contact form for the Toolbar, so hopefully they'll fix it in a future update. Update 4/7/2006 8:30pm: I got a response back from the Google team via email. They let me know that Alt+s works in Firefox to focus the search field. I hadn't previously been aware of this; it sounds good to me, since Alt+s is even easier to reach on the keyboard with my left hand than Alt+g! Now I'll just have to train myself to use it... It is kind of unfortunate that the Firefox and IE versions of the Toolbar use different keyboard shortcuts; I wonder if IE could be made to use Alt+s as well for consistency. Publishing Posts on Blogger In my previous blog post that I made earlier today after installing the Toolbar update, the post wouldn't publish properly; when I clicked the Publish button, the browser just got stuck in a loop trying to publish the post; the post showed up in my list of posts in the Blogger "control panel", but it didn't actually show up in the blog itself. I ended up opening up IE instead and publishing the post from there, and it worked with no problem. I'm not sure yet whether the Google Toolbar update is somehow to blame for this problem. We'll see how publishing this post goes! Update: Publishing this post from Firefox with the new Google Toolbar installed worked with no problem. Looks like maybe it was just a temporary issue with the Blogger site itself earlier today, as I haven't made any other changes on my machine since then.'''
