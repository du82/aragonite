["https://blog.jonschneider.com/2009/07"]
title = "Jon Schneider's Tech Blog: July 2009"
description = "Press the Any key to continue!  (Software development and technology)"
full_description = 'A quick tip on a discovery I just made: You can quickly reorder bullet points in Microsoft Word putting the caret in the bulleted item to be reordered (i.e. click on the item), and then use Alt+Shift+UpArrow or Alt+Shift+DownArrow to reorder the selected item within the list of bullet points. Apparently this works in other MS Office programs as well (such as PowerPoint). I’ve found that this works a lot more nicely than cutting the item to be moved, and then pasting the item in the new location in the list (since often, line breaks need to be fixed up after the new item is pasted in.) Bonus tip: Alt+Shift+LeftArrow and Alt+Shift+RightArrow will indent/unindent the selected bulleted item. After newly installing Eclipse 3.5 (replacing my old Eclipse 3.3 install), when I tried to view a document with a Maven pom.xml file that I’d previously had open in my workspace, I got an error: Could not open the editor: No editor descriptor for id org.maven.ide.eclipse.editor.MavenPomEditor The fix was to install m2eclipse (the Maven plugin for Eclipse). I did this in Eclipse 3.5 as follows: Help | Install New Software In the "Install" dialog: click the Add button In the "Add Site" dialog: Name: m2eclipse Location: http://m2eclipse.sonatype.org/update/ Click OK Back in the "Install" dialog, in the "Add Site" dropdown, select: m2eclipse Under "Maven Integration", I checked: "Maven Integration for Eclipse (Required)" "Maven POM Editor (Optional)" "Maven POM XML Editor (Optional)" Click Next, go through and complete the Install wizard. When prompted, I restarted Eclipse. That got my Maven POM editor up and running in Eclipse 3.5.'
