["https://blog.jonschneider.com/2008/03"]
title = "Jon Schneider's Tech Blog: March 2008"
description = "Press the Any key to continue!  (Software development and technology)"
full_description = '''You can quickly and easily create a .zip file containing the files and subfolders in a particular subdirectory tree in Windows XP by right-clicking the root folder of the subdirectory tree to be compressed in Explorer, and then selecting Send To | Compressed (zipped) Folder from the context menu that appears. Doing this causes Explorer to create a .zip file with the contents of the subdirectory tree (with the same name as the name of the tree's root folder, plus a ".zip" extension), located in the same folder as the subdirectory tree's root folder. The files in the created .zip archive retain their full path information (so that the folder structure of the subdirectory tree will be retained when the archive is later uncompressed). This technique is handy for doing things like compressing the subdirectory tree of a small development project's source code, in order to easily send the code (in the form of the created .zip file) to another machine. The technique is also nice because it doesn't require the use of any 3rd-party tools. Have you ever wanted to know the specific color of something shown on your computer screen? Dropper by Brian Friesen is a lightweight Windows utility that will let you do just that. It will show you the color of any pixel on your screen, regardless of which running application the pixel is located in. One limitation of Dropper is that it is an older application ("older" in this case meaning 2006!), and doesn't have multi-monitor support; it can only show the color of pixels in the primary monitor on multi-monitor systems. You can download Dropper from its page on Brian's website. In most of today's major operating systems, the built-in clipboard has a significant limitation: it can hold only a single item a time. If you cut or copy a second item onto the clipboard, the first item is gone, with no direct way to recover it. Jeff Atwood posted about this issue recently in more depth on his excellent Coding Horror blog. From the comments on Jeff's post, I learned about an excellent Windows utility that addresses this problem: Ditto. Ditto allows you to use a configurable system-wide hotkey (I'm currently using Ctrl+Alt+v) which brings up a "history browser" with all items that had been recently copied to the clipboard. Ditto automatically takes care of saving clipboard items, so that older items are no longer lost when a new item is copied to the clipboard. Since installing Ditto on my machine, I've found myself using it more and more. In addition to being able to easily paste items that I know that I had on the clipboard recently, avoiding having to re-copy or retype them, Ditto enables me to in some cases plan ahead and do things more efficiently. For example, say that I have a large text document open, and I want to copy two nearby (but not adjacent) snippets of text from a location near the beginning of the document, and paste each of them to a location near the end of the document. With just basic operating system clipboard functionality, I'd need to: Copy item 1; Scroll to the end of the document; Paste item 1; Scroll back to the beginning of the document; Copy item 2; Scroll back to the end of the document; Paste item 2. With Ditto, I can achieve the same end result more quickly: Copy item 1; Copy item 2; Scroll to the end of the document; Paste item 2; (Using Ditto) Paste item 1. Ditto is written in C++, and is free and open-source. You can download it from the Ditto Homepage.'''
