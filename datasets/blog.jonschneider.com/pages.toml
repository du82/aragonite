["https://blog.jonschneider.com/2009/06"]
title = "Jon Schneider's Tech Blog: June 2009"
description = "Press the Any key to continue!  (Software development and technology)"
full_description = "I’ve been running three monitors on my PC at work for a while now, and it’s been working great for me. Multiple monitors works great for running business applications and/or doing software development; for example, I typically run my programming environment maximized on my primary monitor, run most the programming environment’s secondary windows (e.g. project file list, search results, list of compiler warnings/errors, etc.) on the second monitor, and the application’s UI or other reference material on the third monitor. I’m able to see everything I need to see at once without shuffling windows around. PC Games As multiple monitors on PCs continue to gain more market penetration, it would be nice to see more PC games join business applications and take advantage of the potential availability of multiple displays. A game’s main view of the game world could go on the primary monitor, and secondary information could go on a second monitor, freeing the entire screen area of the primary monitor to show the game world. For example: In MMORPGs such as World of Warcraft, the display can become pretty “cluttered” with ability toolbars, party status display, mini-map/radar, active buffs/debuffs, and more. All of that could (optionally) be moved onto a secondary monitor, freeing the entire area of the primary monitor to show the game world. In RTS games such as the classic Starcraft, the selected unit(s) and their information, “order” buttons (move, attack, stop, etc.), and mini-map could be moved onto the second monitor. In traditional RPGs, secondary data such as inventory screens, skill/spell lists, character statistics display, and so forth could be shown on the second monitor, again freeing the entire area of the primary monitor to show the game world at all times. Console Games It would also be nice if future console systems (i.e. successors of the current generation’s Wii, Xbox 360, and Playstation 3) would (optionally) support hook-up to multiple television sets in the future. In addition to the getting the same benefits that would be realized by PC games, this might also help with situations where there are multiple players playing simultaneously on the same local console system. Today, local multiplayer is typically accomplished via split screen; in the future, one or more players’ view could be moved onto the second screen. If a future Rock Band or Guitar Hero game supported the addition of a keyboard (piano) part or otherwise supported more players playing together beyond the 4 supported today, multiple TVs could help with the problem that would otherwise be encountered in trying to squeeze 5+ players’ parts onto the same screen! Handheld Games Obviously, the one gaming system that is way out ahead of the curve as far as multiple monitor support goes is the Nintendo DS. With two screens built into the hardware, all games on the platform can be designed to fully take advantage of the availability of two screens. Although I don’t own a DS, I’ve had a chance to briefly borrow one owned by my nephews on a couple of occasions. It is really cool in a game like Zelda to be able to see both the primary game world and the overhead map view (while in a dungeon) at all times. TV - Sports Multiple screen support would also be really cool in the future for TV – particularly for sports broadcasts. In my case, I’m a big fan of Michigan Football. Instead of watching games on just a single screen (where the display tends to focus in on the quarterback or whomever has the ball, to the exclusion of the rest of the field), it would be amazing to have a second screen showing what the downfield receivers are doing (or other action away from the ball appropriate to the play), and a third screen dedicated to showing real-time stats at all times. The score and “ticker” could also be shown on the third screen, freeing the entire area of the main screen to show the game action. Obviously, support for people watching the game on just a single TV (I’d likely be among them, at least for now!) would have to be maintained as well. Perhaps an “all in one” game broadcast (essentially what we have today) could be carried on a particular channel; the “multiple screens” version of the game could be carried on a separate set of channels. This kind of multiple screen support for sports broadcasts, particularly combined with support for single-TV viewers, would work out to quite a few channels being dedicated to sports broadcasts! Still, with the proliferation of channels available even today via digital cable or satellite broadcasts, this kind of thing might be possible in the not-too-far future. Put those old displays to use! This would also give people something to do with “old” PC monitors and TVs as they gradually get replaced over time with HD versions: Put the old displays to good use as secondary information displays for games and TV! One of the 3 monitors that I have at work is an old monitor that would be sitting on a shelf at home (or worse, in a landfill somewhere) if I didn’t have a use for it as the third monitor on my work machine. So, PC game developers, console hardware companies, and sports broadcasters: Go forth and make it so. :-)"
