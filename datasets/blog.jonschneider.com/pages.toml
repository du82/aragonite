["https://blog.jonschneider.com/2009/10"]
title = "Jon Schneider's Tech Blog: October 2009"
description = "Press the Any key to continue!  (Software development and technology)"
full_description = '''Quick tip: In Microsoft Word, in a document with in-document hyperlinks, after navigating to another location in the document by clicking on a hyperlink (typically by holding Ctrl and clicking the link, as Word will prompt when the mouse cursor is hovered over a link), you can go back to where you were before in the document by using Alt+LeftArrow (hold down the Alt key and press the Left Arrow key) – similar to clicking on the Back button in a web browser. Alt+RightArrow also works to go forward once again after using the Alt+LeftArrow shortcut to go back. These are a good shortcuts to be aware of, since Word doesn’t by default show Back/Forward buttons in the toolbar like a browser does. (This is the case in Word 2003 – I don’t have a copy of Word 2007 in front of me at the moment to check.) In Word 2003, you can get Word to show Back/Forward buttons in the toolbar by making Word’s Web toolbar visible. (Right-click a blank area of the toolbar at the top of the Word window, and select Web from the context menu that appears.) The Alt+LeftArrow and Alt+RightArrow keyboard shortcuts to navigate Back or Forward respectively also work in most web browsers on Windows. It is possible to set up sections of “mirrored content” in Microsoft Word, such that the same content appears in two or more places in the document, and changes to the content in the “master” location are automatically mirrored to the other instances of the content. The following instructions apply to Word 2003; I’ve done this in Word 2007 as well, but the specific procedure will differ slightly due to 2007’s use of the Ribbon interface rather than the traditional menu. 1. Designate the master content To designate the “master” (primary) version of the content to be mirrored, select the content (e.g. by left-clicking and dragging the mouse cursor over it), and then create a “Bookmark” on the content by selecting Insert | Bookmark from the menu. In the Bookmark dialog, add a new bookmark and name it whatever you like. Tip: You may also want to enable “Show Bookmarks” at Tools menu | Options | View tab, so that you can see the bounds of the bookmark you created. 2. Place the mirrored content Now, go to the place in the document where you want the mirrored copy of the content to appear. At that location, add a “Cross-Reference” via Insert menu | Reference | Cross-reference. In the Cross-reference dialog, set Reference Type to “Bookmark” and Insert Reference To to “Bookmark Text”; in the For Which Bookmark field, select the bookmark you created. Optionally, you can leave the “Insert as hyperlink” dialog checked. If this is checked, the mirrored content will still appear normally (it won’t be underlined like a typical World Wide Web hyperlink), but readers of the document will be able to Ctrl+click the mirrored content to jump to the location of the master copy of the content. Finally, click the dialog’s Insert button, and then the Close button. The mirrored copy of the content should now appear in the document! 3. Updating the mirrored content The mirrored content will not immediately automatically update when the master content is updated. You can update the mirrored copy manually by right-clicking the mirrored text, and selecting “Update Field” from the context menu that appears. You can update all of the mirrored content in the document at once by selecting the entire document (Edit menu | Select All; or press Ctrl+A), right-clicking anywhere in the document, and selecting “Update Field.” All mirrored content fields (and any other fields that may be present in the document) will be updated. Alternatively, you can set Word to automatically update all fields in documents each time the document is printed. To do this, in Tools menu | Options | Print tab, select the Update Fields check box. Bonus Tip: Capitalizing the mirrored content Optionally, you can make the mirrored content appear in ALL CAPS even if the master content is mixed-case. To do this: Right-click the mirrored content; from the context menu, select Edit Field. In the Field dialog, click the Field Codes button. In the Field Codes text box that appears, type the following text at the end of the existing content of the text box: \* UPPER Click OK. The mirrored content should now appear in all uppercase! (Thanks to Graham Mayor for the tip on the capitalization field switch. See Graham's site for lots of other advanced tips regarding what can be done with Word fields.)'''
