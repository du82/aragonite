title = "Jon Schneider's Tech Blog: Notepad.exe selection/scroll bug"
description = "I found another bug with Notepad.exe earlier today.  When Notepad has word wrap turned off, an entire long (longer than the window width) li..."
full_description = "I found another bug with Notepad.exe earlier today. When Notepad has word wrap turned off, an entire long (longer than the window width) line of text is selected, and the window is scrolled all the way to the left, then when the Notepad window loses focus, it automatically (and unexpectedly) scrolls all the way to the right. This means you can't have two Notepad windows on the screen, each with a long line of text selected, and each scrolled to the left, at the same time. This is inconvenient when trying to use side-by-side Notepad instances to compare a line of text in two similar files (with the line being compared selected in each window to make that line stand out)."
