title = "Announcing krb5dissect – Simon Josefsson's blog"
full_description = "Announcing krb5dissect Posted on 2007-03-14 by simon Building on my earlier efforts to document the ccache format, I’ve now created the krb5dissect tool. It will parse your Kerberos ccache file (typically /tmp/krb5cc_$UID) and prints it in a human readable format. This tool was written in about 1 hour, given the amazing amount of nice modules available from gnulib, and helpful tools such as gengetopt and help2man. Kudos! Update! Version 2.0 can do the same for Kerberos keytab files (typically /etc/krb5.keytab). This entry was posted in kerberos, programming by simon. Bookmark the permalink."
