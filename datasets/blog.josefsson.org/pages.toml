["https://blog.josefsson.org/2008/05/08/home-wireless-network"]
title = "Home Wireless Network – Simon Josefsson's blog"
full_description = "Home Wireless Network Posted on 2008-05-08 by simon Using OpenWRT with WPA-PSK 2 on Broadcom WLAN routers have been stuck on a quite old bug. Recently someone suggested that it may have been fixed in trunk, which caused me to test it. And it works! It took some time to work out the details here. To save myself time to reconstruct the commands, and hopefully save you some time too, I wrote down how to use OpenWRT with two Asus WL-500g Premium linked together wirelessly using WDS and PSK2 encryption. The writeup is long, so I put it on a separate page: http://josefsson.org/openwrt/wlan.html. If you are interested in using OpenWRT with a 3G connection, you may find my summer house internet writeup more useful. This entry was posted in embedded, hardware and tagged broadcom, openwrt, psk2, wds, wlan by simon. Bookmark the permalink. matt on 2008-07-27 at 13:16 said: Hello! Thanks for your howto, everything works good. I’ve only had some problems with getting the internet connection working on the router without wan connection. I’ve had to manually assign static network settings for wan interface on this router (copied the ip address of the wan interface from the gateway router and as a gateway address set the local ip address of that router), but now I’m very happy openwrt user. Regards. owen (oxo) on 2008-10-15 at 15:43 said: Hi On the device that has dnsmasq diabled, add dns and default gw entries so ipkg stil works … matt on 2009-06-17 at 21:32 said: Hi, I find kamikaze 8.08.1 useless with psk2 encryption. I can’t even connect to the ap with psk2 or wep enabled. I’ve flashed my routers with this version, then with my own build form 16.06.2009 and wireless with encryption enabled isn’t working. gabor on 2009-08-17 at 09:57 said: Hi, I have had some problems when MAC address was configured with upper case characters with kamikaze 8.09.1. I would also mention how to generated good PSK2 password. I found this link helpful: http://oldwiki.openwrt.org/OpenWrtDocs%282f%29KamikazeConfiguration%282f%29WiFiEncryption.html. opkg install pwgen && pwgen –secure 63 1 is working on this platform."
