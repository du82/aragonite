["https://blog.josefsson.org/2007/09/25/home-audio-server"]
title = "Home Audio Server – Simon Josefsson's blog"
full_description = "Home Audio Server Posted on 2007-09-25 by simon Procrastinating real work, I documented my home audio server setup. I needed a cross-platform solution, and as a first step, I settled with MPD. The setup is only a few days old, and I may decide to change software eventually. But the current setup works under Gnome, Windows, Mac OS X and even on my Nokia 6233. What may be missing is FM/DAB Radio and streaming of TV, but I’m not sure the little NSLU2 is up to it. We’ll see. The writeup on how to do this is long, so I put it at a separate page: http://josefsson.org/grisslan/audio.html (This is a continuation of my series to document the devices that run my home, the first was the internet setup). This entry was posted in embedded, hardware by simon. Bookmark the permalink. Patrik WallstrÃ¶m on 2007-09-25 at 22:38 said: Things will get messy if you need two players. That is why my choice was two Squeezebox 3. The downside of this is that you have a web interface to access the central server. But at least the to SB3 has a remote control each. There are other interfaces, but not quite as good as the mpd native clients on the operating systems I use. http://josefsson.org/ on 2007-09-26 at 11:08 said: Actually, I do need a second player for the living room… A stationary display for the artist/track info would be nice. There seems to be some alternatives though: Squeezebox: http://www.slimdevices.com/pi_squeezebox.html Pinnacle Soundbridge: http://tinyurl.com/yzj56f Terratec Noxon 2: http://www.my-noxon.net/sites/noxonflash/ The Squeezebox seems to be about twice as expensive. The web sites for both the SoundBridge and Noxon are rather bad, but the devices seems pretty nice. All three appear to be available locally (Webhallen). Hm. A Jackson on 2008-02-04 at 10:21 said: I have mt-daapd running on my NSLU2 running Debian, which works good. Supported by Apple iTune and hardware like the Squeezbox, Rhythmbox etc. Thought I should mention it. Whites on 2008-06-16 at 13:47 said: I get very poor performances with mpd 🙁 Actually, cpu goes to 95-96% and nothing is heard. It’s a default Debian installation, like yours, and you seem to get it working out of the box. Further, mplayer with flac goes very well, and madplay for mp3 does the job too. In your experience, can it be an mpd issue (0.13.1)? I’ll give a try to mt-daapd, but I’d like to use mpd… Thanks"
