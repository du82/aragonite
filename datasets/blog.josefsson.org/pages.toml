["https://blog.josefsson.org/2006/09/20/kerberos-5-credential-cache-file-format"]
title = "Kerberos 5 Credential Cache file format – Simon Josefsson's blog"
full_description = "Kerberos 5 Credential Cache file format Posted on 2006-09-20 by simon Reading MIT/Heimdal Kerberos V5 credential files seemed like a good first step towards making Shishi more usable. Users will be able to continue using their existing Kerberos V5 applications and libraries, but will be able to gradually move to Shishi. This has actually been on the todo-list for Shishi since day one. A few months ago, Michael B Allen wrote up a specification of the keytab file format (i.e., the file format used by /etc/krb5.keytab), and I implemented it in Shishi. Now, that file contains hostkeys, and is thus only useful for servers. To be able to read the end-user credential files would be more useful. I fired up M-x hexl-find-file RET on /tmp/krb5cc_1000, and with the help of Michael’s prior work, I came up with the following file format description and basic implementation. Kerberos ccache file format writeup Parse ccache files, header file Parse ccache files, source This entry was posted in kerberos, security by simon. Bookmark the permalink. somass on 2007-02-09 at 07:31 said: I google for this as I am facing problem with errors like Client not found or Credentials file not available. Thanks for pubilishing Cache files. I have to still exporer how I can use the given info. somass"
