["https://blog.josefsson.org/2007/07/22/linksys-wrt54g3g-huawei-e600-openwrt-kamikaze-internet-at-summer-house"]
title = "Linksys WRT54G3G + Huawei E600 + OpenWRT Kamikaze = Internet at summer house – Simon Josefsson's blog"
full_description = "Linksys WRT54G3G + Huawei E600 + OpenWRT Kamikaze = Internet at summer house Posted on 2007-07-22 by simon Spending vacation at the summer house without Internet connectivity? Unthinkable. The first few days, I connected the laptop to my cell phone using Bluetooth, and then to the Internet using 3G/UMTS. However, we have more than one laptop here, and the range of bluetooth is limited. I ended up setting up a wireless access point with a PCMCIA slot for a 3G/UMTS card. It has worked flawlessly for several days. The writeup on how to do this is long, so I put it at a separate page: http://josefsson.org/openwrt/internet.html Update: I have written a similar howto for OpenWRT 8.09 and Huawei E220, see http://josefsson.org/openwrt/dongle.html This entry was posted in embedded, hardware by simon. Bookmark the permalink. Julien on 2007-07-24 at 00:09 said: Hi Simon, First of all thanks for publishing your tutorial, it help me. I have the same linksys router than you but I do not use the 3G capabilities. Therefore I wonder if it is possible to use the pcmcia slot to plug a pcmcia-to-usb card and then connect my usb hdd. This way I aim to share my external hdd between my computers at home without having to keep one computer running full-time? I guess setting up Kamikaze 7.06 should be similar to what you have done for your 3G card since it is recognize as usb ports, plus I will have to install the samba packages. What do you think of that? Med vÃ¤nliga hÃ¤lsningar! Julien http://josefsson.org/ on 2007-07-24 at 00:26 said: Hi Julien! I see no reason why that wouldn’t work. As far as I can tell, there is nothing “magic” about the PCMCIA slot, you should be able to put anything in it. The hardware shouldn’t care or even know that it isn’t a 3G card. It would be nice if the box had an external USB port though… I thought about using a PCMCIA USB adapter and USB 3G card instead, too, and be able to add a HDD to the box. But I had this PCMCIA laying around to no use, so I didn’t want to purchase a USB 3G card too. And I have some unused NSLU2’s that I intend to set up as well.. 🙂 If you test it, let me know how it works out, maybe I’ll switch to a USB 3G card in the future… /Simon"
