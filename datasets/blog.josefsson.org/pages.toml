["https://blog.josefsson.org/2007/03/24/debian-etch-on-dell-precision-m65"]
title = "Debian etch on Dell Precision M65 – Simon Josefsson's blog"
full_description = "Debian etch on Dell Precision M65 Posted on 2007-03-24 by simon Images for Debian etch rc2 were released and I decided it was time to re-install it on my laptop. While doing this, I thought I would take notes. This will help when I re-install it next time, and hopefully others with the same or similar hardware… The writeup is long, so I decided to put it on a separate page: http://josefsson.org/etch-dell-m65.html This entry was posted in debian by simon. Bookmark the permalink. Mark on 2007-04-04 at 18:20 said: Yep, I’ve got problems with my swap partition as well.. but guess what: it really doesn’t make any difference whether you click “yes” (to continue) or “no” (to ehm, not continue?) ! simon on 2007-04-05 at 10:21 said: You mean the confusing uswusp question? Yeah, I never understood the question. My swap is working fine, and hibernation too. I suppose your only problem, like me, was the question itself? Suspend to RAM didn’t work, but that’s because s2ram didn’t know about this laptop. eran shacked on 2007-05-08 at 21:51 said: Hello I am not a professional user as you are but i am using dell precision m-65 for architecture work. When i bout the computer i got it with windows vista. I installed xp professional because it didn’t work with AutoCAD and Revit. After installing dell drivers from dell website, everything is working except the Bluetooth. After i saw your page i thought that maybe you can help me solve this problem. Thank you Eran Ehacked. Excuse my English i usually write in Hebrew simon on 2007-05-09 at 03:36 said: I don’t use Windows so I’m afraid I can’t help. Try installing Debian instead, bluetooth works just fine for me! Jan on 2007-05-24 at 07:43 said: Hi Simon, The bogus message about swap is probably not related to hardware – It is rather a bug of the debian installer. I saw it recently when installing Debian 4 on a desktop PC. Anyways – I find your blog entry very useful as I get a very good deal on the Dell M65 notebook and would never use Windows. So thanks a lot for sharing your experienece. Cheers, Jan"
