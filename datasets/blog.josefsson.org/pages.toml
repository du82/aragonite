["https://blog.josefsson.org/2007/04/14/jobo-giga-vu-pro-evolution-80gb"]
title = "Jobo Giga Vu Pro Evolution 80GB – Simon Josefsson's blog"
full_description = "Jobo Giga Vu Pro Evolution 80GB Posted on 2007-04-14 by simon I bought a new toy yesterday, altough its silly name almost made me go for the Epson P-5000 instead. Quick testing seem to suggest that the device lives up to its promises, although there is room for improvements in the user interface. One of my reasons of buying it was for the device to serve as my MP3 server in the office. Alas, the MP3 player is not very advanced. You just select directories, and press play. Crude as it may be, it appears to work. What was interesting was that the manual says the device includes software released under the GPL, available upon request. Today I sent an e-mail to support@jobo.com to ask for the code. It would be nice if I could ssh into this box and run mpg123 manually. I’ll blog about my progress on that. Anyway, the machine has some interesting specs: AMD Au1200 MIPS processor at 400MHz 128 MB DDR-SDRAM 32 MB Flash Rom 3.7″ VGA Screen 80 GB Hard Disk 2*miniUSB Audio+TV out VGA/DVI output (cable not included…) This entry was posted in hardware by simon. Bookmark the permalink."
