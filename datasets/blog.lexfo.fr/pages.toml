title = "Lexfo's security blog - Cobalt Strike Investigation Part 1"
full_description = '''ContentsIntroductionApproachFindings SummaryCobalt Strike remote-exec winrmSysmon EventsFindingsConclusionDetection Rule ExampleCobalt Strike remote-exec wmiSysmon EventsFindingsConclusionDetection Rule ExampleCobalt Strike remote-exec psexecSysmon EventsFindingsConclusionDetection Rule ExamplePart 1 - ConclusionIntroductionAlthough it was not originally designed for this use, Cobalt Strike has become one of the most frequently used tools for lateral movements and it is not uncommon to observe traces of its use during digital forensic.This article aims to analyze the different Cobalt Strike commands to find evidence that the tools could drop behind him. Several blogs have already explained how to detect Cobalt Strike, but for this analysis we choose to let the Windows log levels by default without activating special "Windows Audit Policies" and we used post-compromising tools to extract artifacts.In this first part, we will focus on the Cobalt Strike built-in remote-exec command and its different methods of remote code execution:remote-exec winrmremote-exec wmiremote-exec psexecA second blogpost will focus on the persistent Cobalt Strike session using Beacon and the built-in jump commands with different methods such as "psexec64", "winrm64" or "psexec_psh".ApproachThe aim here is to provide basic information on what kinds of logs and other artefacts could be generated from Cobalt Strike on a default Windows 10 host. To get a better context and understanding, we enabled Sysmon on the victim Workstation, so that we get a based line to compare with.The tests have been done with Cobalt Strike version 4.4 with the default configuration without any kind of customization. It'is important to note that Cobalt Strike allow users to change various settings (pipes names, service name, default temporary process, etc.) to customize its footprint. Depending on Cobalt Strike settings used by the attackers, the events generated may be slightly different and detection rule may fail.Each command has been executed twice to avoid false positive. This short analysis can be later on used as a reference to build rules to detect Cobalt Strike movements during a forensics incident response (without Sysmon or Audit Policies).The Lab is composed of the following elements:Windows 10 workstations with Sysmon installed;Windows Server 2016 Domain Controller.The different steps and tools used to extract and analyze the artifacts post compromise are:Run DFIR_ORC to extract artifacts on the Windows 10 machineRun log2timeline/plaso combined with Logstash on the extracted data to build a clear timelineAnalyze data using SplunkBy using DFIR_Orc and Plaso, we were able to process the most important artifacts:Event log (*.evtx), including PowerShell command history;Prefetch files;USNjrnl;MFT;User and System hives (userassist, appcompatcache, etc.).Findings SummaryA summary of the most important findings (excluding Sysmon events) is available on the timeline below:Cobalt Strike CommandsDescriptionremote-exec winrm[prefetch] Prefetch [WSMPROVHOST.EXE] was executed - run count 2 path hints: \WINDOWS\SYSTEM32\WSMPROVHOST.EXE hash: 0xEF06207C volume: 1 [serial number: 0x228095FD device path: \VOLUME{01d80e8a80662822-228095fd}]remote-exec winrm[evtx/winrm/91] Creating WSMan shell on server with ResourceURI: 'http://schemas.microsoft.com/powershell/Microsoft.PowerShell'remote-exec winrm[evtx/sec/4624] user 'CORP.LOCAL\alice' (S-1-5-21-1155457554-2149841727-2293290625-1108) successfully logon (type=3) from '-' ('-') (logon_id=0x0000000000483901) with '-'remote-exec winrm[evtx/powershell/400] the PowerShell engine state hosted by application C:\Windows\system32\wsmprovhost.exe -Embedding with command line '-' is changed from 'None' to 'Available'.remote-exec winrm[evtx/powershell/403] the PowerShell engine state hosted by application C:\Windows\system32\wsmprovhost.exe -Embedding with command line '-' is changed from 'Available' to 'Stopped'.remote-exec winrm[evtx/powershell/600] the PowerShell provider 'Alias' hosted by application C:\Windows\system32\wsmprovhost.exe -Embedding with command line '-' is Started.remote-exec winrm[evtx/powershell/600] the PowerShell provider 'Environment' hosted by application C:\Windows\system32\wsmprovhost.exe -Embedding with command line '-' is Started.remote-exec winrm[evtx/powershell/600] the PowerShell provider 'FileSystem' hosted by application C:\Windows\system32\wsmprovhost.exe -Embedding with command line '-' is Started.remote-exec winrm[evtx/powershell/600] the PowerShell provider 'Function' hosted by application C:\Windows\system32\wsmprovhost.exe -Embedding with command line '-' is Started.remote-exec winrm[evtx/powershell/600] the PowerShell provider 'Registry' hosted by application C:\Windows\system32\wsmprovhost.exe -Embedding with command line '-' is Started.remote-exec winrm[evtx/powershell/600] the PowerShell provider 'Variable' hosted by application C:\Windows\system32\wsmprovhost.exe -Embedding with command line '-' is Started.....remote-exec wmi[evtx/sec/4624] user 'CORP.LOCAL\alice' (S-1-5-21-1155457554-2149841727-2293290625-1108) successfully logon (type=3) from '192.168.56.119' ('-') (logon_id=0x00000000004d811f) with '-'remote-exec wmi[evtx/dcom/10016] the application-specific permission settings do not grant Local Activation permission for the COM Server application with CLSID {3480A401-BDE9-4407-BC02-798A866AC051} and APPID {30AD8C8E-AE85-42FA-B9E8-7E99E3DFBFC5} to the user 'CORP\alice' (S-1-5-21-1155457554-2149841727-2293290625-1108) from address LocalHost (Using LRPC) running in the application container Unavailable SID Unavailableremote-exec wmi[prefetch] Prefetch [OPENWITH.EXE] was executed - run count 3 path hints: \WINDOWS\SYSTEM32\OPENWITH.EXE hash: 0x5C93E816 volume: 1 [serial number: 0x228095FD device path: \VOLUME{01d80e8a80662822-228095fd}]....remote-exec psexec[evtx/sec/4624] user 'CORP.LOCAL\alice' (S-1-5-21-1155457554-2149841727-2293290625-1108) successfully logon (type=3) from '192.168.56.119' ('-') (logon_id=0x00000000005eda88) with '-'remote-exec psexec[evtx/sys/scm/7045] service 'd8041e9' (notepad.exe) was installed by user 'LocalSystem' (type: user mode service, start: demand start)Cobalt Strike remote-exec winrmThe Cobalt Strike remote-exec winrm command allows the user to execute a command using WinRM on the remote host without creating a persistent session with a Beacon. For this example, the executed command is ipconfig.Sysmon EventsAs explained earlier, System Monitor (Sysmon) was installed on the Windows 10 workstation to have reference events on which to base our analyses. We therefore first reviewed the events recorded by Sysmon to get a based line to compare with extracted artifacts. The Sysmon events below has been filtered to the most useful.Event ID 1 - Process CreationThe process creation event provides extended information about a newly created process. The full command line provides context on the process execution. The ProcessGUID field is a unique value for this process across a domain to make event correlation easier.The process chain created by the remote-exec winrm commands on the victim workstation is svchost.exe -> wsmprovhost.exe -> ipconfig.exe.TimeDescription14:24:01.884[evtx/sysmon/1] process created with command C:\Windows\system32\wsmprovhost.exe -Embedding (id 9040) by user 'CORP\alice' via C:\Windows\System32\svchost.exe (id 728)14:24:05.631[evtx/sysmon/1] process created with command "C:\Windows\system32\ipconfig.exe" (id 9384) by user 'CORP\alice' via C:\Windows\System32\wsmprovhost.exe (id 9040)14:24:05.653[evtx/sysmon/1] process created with command \??\C:\Windows\system32\conhost.exe 0xffffffff -ForceV1 (id 8268) by user 'CORP\alice' via C:\Windows\System32\ipconfig.exe (id 9384)Event ID 3 - Network Connection DetectedThe network connection event logs TCP/UDP connections on the machine. Each connection is linked to a process through the ProcessId and ProcessGUID fields. The event also contains the source and destination host names IP addresses, port numbers and IPv6 status.The execution of the remote-exec winrm commands leads to the creation of 3 network connections made to the victim workstation on the port 5985. The ports 5985 (HTTP) and 5986 (HTTPS) are the default TCP ports used by WinRM:TimeDescription14:24:04.015[evtx/sysmon/3] tcp network connection from host '-' (192.168.56.119:54074) to host '-' (192.168.56.117:5985) (pid=4)14:24:05.430[evtx/sysmon/3] tcp network connection from host '-' (192.168.56.119:54075) to host '-' (192.168.56.117:5985) (pid=4)14:24:06.461[evtx/sysmon/3] tcp network connection from host '-' (192.168.56.119:54076) to host '-' (192.168.56.117:5985) (pid=4)Event ID 7 - Image LoadedThe image loaded event logs when a module is loaded in a specific process. It indicates the process in which the module is loaded, hashes and signature information.Without Sysmon installed on the victim workstation, it is hard to get the same information from other artifacts. Nevertheless, and this will be discussed later in the article, MFT provides similar evidence and this is why we have chosen to include these events.TimeDescription14:24:01.896[evtx/sysmon/7] image C:\Windows\System32\wsmprovhost.exe loaded from process C:\Windows\System32\wsmprovhost.exe (pid=9040) with user 'CORP\alice'14:24:01.976[evtx/sysmon/7] image C:\Windows\System32\WsmSvc.dll loaded from process C:\Windows\System32\wsmprovhost.exe (pid=9040) with user 'CORP\alice'14:24:02.023[evtx/sysmon/7] image C:\Windows\System32\wsmplpxy.dll loaded from process C:\Windows\System32\wsmprovhost.exe (pid=9040) with user 'CORP\alice'14:24:04.425[evtx/sysmon/7] image C:\Windows\System32\WindowsPowerShell\v1.0\pwrshsip.dll loaded from process C:\Windows\System32\wsmprovhost.exe (pid=9040) with user 'CORP\alice'......Event ID 11 - File createdFile create operations are logged when a file is created or overwritten. This event is useful for monitoring autostart locations, like the Startup folder, as well as temporary and download directories, which are common places malware drops during initial infection.On the disk, two PowerShell scripts, generated by Microsoft, are created (__PSScriptPolicyTest_<random_number>.ps1) to test against AppLocker. If the test file executes, then it assumed that AppLocker is disabled. Two Prefetch files for ipconfig, and wsmprovhost.exe binaries are also created, as well as a log file.TimeDescription14:24:03.978[evtx/sysmon/11] process C:\Windows\system32\wsmprovhost.exe (pid=9040) created file C:\Users\alice\AppData\Local\Temp\__PSScriptPolicyTest_3yycbqb2.1vu.psm1 with user 'CORP\alice'14:24:03.978[evtx/sysmon/11] process C:\Windows\system32\wsmprovhost.exe (pid=9040) created file C:\Users\alice\AppData\Local\Temp\__PSScriptPolicyTest_jcfqwafa.032.ps1 with user 'CORP\alice'14:24:05.722[evtx/sysmon/11] process C:\Windows\system32\svchost.exe (pid=1860) created file C:\Windows\Prefetch\IPCONFIG.EXE-912F3D5B.pf with user 'NT AUTHORITY\SYSTEM'14:24:05.724[evtx/sysmon/11] process C:\Windows\system32\svchost.exe (pid=1860) created file C:\Windows\Prefetch\CONHOST.EXE-1F3E9D7E.pf with user 'NT AUTHORITY\SYSTEM'14:24:06.872[evtx/sysmon/11] process C:\Windows\system32\wsmprovhost.exe (pid=9040) created file C:\Users\alice\AppData\Local\Microsoft\CLR_v4.0\UsageLogs\wsmprovhost.exe.log with user 'CORP\alice'14:24:06.947[evtx/sysmon/11] process C:\Windows\system32\svchost.exe (pid=1860) created file C:\Windows\Prefetch\WSMPROVHOST.EXE-EF06207C.pf with user 'NT AUTHORITY\SYSTEM'FindingsNow that we have seen the events and other artifacts generated by the execution of the remote-exec winrm commands, let's dwell on the evidence present natively on a Windows 10 system out of the box.Winevtx - Microsoft-Windows-Security-AuditingWithout the audit policies enabled, there are not much events generated. However, in both tests, Windows recorded 5 successful logons (event ID 4624) with the logon type '3' (Network) from the compromised account "CORP.LOCAL\alice". If correlated, this behavior may help during the investigation to support a hypothesis.TimeDescription14:24:01.836[evtx/sec/4672] special privileges assigned to 'CORP\alice' (S-1-5-21-1155457554-2149841727-2293290625-1108) (logon_id=0x0000000000483901): SeSecurityPrivilege SeBackupPrivilege SeRestorePrivilege SeTakeOwnershipPrivilege SeDebugPrivilege SeSystemEnvironmentPrivilege SeLoadDriverPrivilege SeImpersonatePrivilege SeDelegateSessionUserImpersonatePrivilege14:24:01.836[evtx/sec/4624] user 'CORP.LOCAL\alice' (S-1-5-21-1155457554-2149841727-2293290625-1108) successfully logon (type=3) from '-' ('-') (logon_id=0x0000000000483901) with '-'14:24:03.395[evtx/sec/4672] special privileges assigned to 'CORP\alice' (S-1-5-21-1155457554-2149841727-2293290625-1108) (logon_id=0x0000000000485580): SeSecurityPrivilege SeBackupPrivilege SeRestorePrivilege SeTakeOwnershipPrivilege SeDebugPrivilege SeSystemEnvironmentPrivilege SeLoadDriverPrivilege SeImpersonatePrivilege SeDelegateSessionUserImpersonatePrivilege14:24:03.395[evtx/sec/4624] user 'CORP.LOCAL\alice' (S-1-5-21-1155457554-2149841727-2293290625-1108) successfully logon (type=3) from '-' ('-') (logon_id=0x0000000000485580) with '-'14:24:05.436[evtx/sec/4672] special privileges assigned to 'CORP\alice' (S-1-5-21-1155457554-2149841727-2293290625-1108) (logon_id=0x0000000000487c94): SeSecurityPrivilege SeBackupPrivilege SeRestorePrivilege SeTakeOwnershipPrivilege SeDebugPrivilege SeSystemEnvironmentPrivilege SeLoadDriverPrivilege SeImpersonatePrivilege SeDelegateSessionUserImpersonatePrivilege14:24:05.436[evtx/sec/4624] user 'CORP.LOCAL\alice' (S-1-5-21-1155457554-2149841727-2293290625-1108) successfully logon (type=3) from '-' ('-') (logon_id=0x0000000000487c94) with '-'14:24:06.843[evtx/sec/4634] user logged off 'CORP\alice' (S-1-5-21-1155457554-2149841727-2293290625-1108) (logon_id=0x0000000000487c94) from logon type=314:24:06.844[evtx/sec/4672] special privileges assigned to 'CORP\alice' (S-1-5-21-1155457554-2149841727-2293290625-1108) (logon_id=0x00000000004891b0): SeSecurityPrivilege SeBackupPrivilege SeRestorePrivilege SeTakeOwnershipPrivilege SeDebugPrivilege SeSystemEnvironmentPrivilege SeLoadDriverPrivilege SeImpersonatePrivilege SeDelegateSessionUserImpersonatePrivilege14:24:06.844[evtx/sec/4624] user 'CORP.LOCAL\alice' (S-1-5-21-1155457554-2149841727-2293290625-1108) successfully logon (type=3) from '-' ('-') (logon_id=0x00000000004891b0) with '-'14:24:06.868[evtx/sec/4634] user logged off 'CORP\alice' (S-1-5-21-1155457554-2149841727-2293290625-1108) (logon_id=0x0000000000485580) from logon type=314:24:06.869[evtx/sec/4672] special privileges assigned to 'CORP\alice' (S-1-5-21-1155457554-2149841727-2293290625-1108) (logon_id=0x00000000004891fe): SeSecurityPrivilege SeBackupPrivilege SeRestorePrivilege SeTakeOwnershipPrivilege SeDebugPrivilege SeSystemEnvironmentPrivilege SeLoadDriverPrivilege SeImpersonatePrivilege SeDelegateSessionUserImpersonatePrivilege14:2'''
