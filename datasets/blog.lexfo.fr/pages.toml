title = "Lexfo's security blog - Lockbit analysis"
full_description = '''LockBit EncryptionIntroductionIn this article, we will talk briefly about the LockBit features and focus on the different parts that have not been fully covered by other analysts like encryption. The LockBit sample used in this analysis has been extracted during an Incident Response. The attack was conducted manually by humans, with the help of Cobalt Strike.Finally, in the Annexes we will present a way to recover light encrypted stack strings using IDA and the miasm symbolic engine.General descriptionThe sample was packed, strings "encrypted" using XOR operation with the first byte as key. The sample checks the process privileges and sidestep Windows UAC using the bypass methods in hfiref0x’s UACME #43.LockBit stopped undesirable services by checking their names against a skip list using OpenSCManagerA, enumerate dependent services using EnumDependentServicesA and terminate them using ControlService with the SERVICE_CONTROL_STOP control code.Processes are enumerated using CreateToolhelp32Snapshot, Process32First, Process32Next and OpenProcess. If their names appear on the skip list, the process is killed using TerminateProcess.The ransomware can enumerate shares on the current /24 subnet using EnumShare and networks resources using WNetAddConnection2W and NetShareEnum.As usual, Windows snapshots are deleted using the following commands: cmd.exe /c vssadmin delete shadows /all /quiet & wmic shadowcopy delete & bcdedit /set {default} bootstatuspolicy ignoreallfailures & bcdedit /set {default} recoveryenabled No & wbadmin delete catalog -quietBelow, we will take a closer look at some of its features.IOCPTo encrypt quickly and efficiently, LockBit uses the Windows I/O Completion Ports mechanisms. This provides an efficient threading model for processing multiple asynchronous I/O requests on a multiprocessor system. Instead of using the traditional API CreateIoCompletionPort and GetQueuedCompletionStatus, they use NtCreateIoCompletion, NtSetInformationFile and NtRemoveIoCompletion.LockBit starts by creating an I/O completion Port using NtCreateIoCompletion API:create IOCPThen, for each file that does not match entries on the folder and file blacklist, it associates the file handle with the I/O completion port using NtSetInformationFile with the information class that is set to FileCompletionInformation:associate file handleThen, reading the file using the OVERLAPPED structure will create an I/O completion packet that is queued in first-in-first-out (FIFO) order to the associated I/O completion port:iocp read fileLater on (in the decryption_thread), instead of calling the “GetQueuedCompletionStatus” to dequeue an I/O completion packet from the specified I/O completion Port, it calls NtRemoveIoCompletion:NtRemoveIoCompletionEncryptionIntroductionThe encryption is based on two algorithms: RSA and AES. First, an RSA session key pair is generated on the infected workstations. This key pair is encrypted using the embedded attacker's public key and saved on the registry SOFTWARE\LockBit\full. An AES key is generated randomly for each file to encrypt. Once the file is encrypted, the AES key is encrypted using the RSA public session key and appended to the end of the file with the previously encrypted session key.Encryption detectionTo detect encryption algorithms, public crypto Yara rules can be used. On the unpack binary, you will get the following results:Big_Numbers1Prime_Constants_longCrypt32_CryptBinaryToString_APIRijnDael_AES_CHARRijnDael_AES_LONGAs you can see, the RSA algorithm has not been detected. Reading codes close to the AES functions make me grepping the constant -0x4480 using grep.app application which leads me to the library mbedtls.With the source code (or one close to the original one), we can try to load C Header files in IDA, by doing File -> Load file -> Parse C header files. You may have to set properly the Include directories and the Calling convention in the option compiler box:compiler dialog box)Also, it may be needed to delete external includes in the header files like stddef.h to avoid errors Can't open include file stddef.h.This allows the analysts to easily import structure:struct drbg ctxAnd maybe, provide hints by comparing the structure size (0x140):drbg initEncryption PreparationLike many ransomware, LockBit uses session keys to encrypt the symmetric key that is used to encrypt files. The function that generates session keys is easy to find because it is just after the debug message "Generate session keys" and just before the encryption_thread :)string generate session keysBelow the function that generates the RSA session keys:generate session keysBecause the private session key needs to be kept secret, LockBit RSA encrypts it with his embedded public key (named Attacker_Modulus in the code):import and encrypt session keys using embedded attacker's RSA public keyFinally, the full encrypted session keys are stored in the registry SOFTWARE\LockBit\full while in the SOFTWARE\LockBit\Public the public session key (Modulus and Exponent, respectively 0x100 and 0x3 bytes):Stored session keysFiles EncryptionAs we mentioned in the IOCP chapter, each file marked for encryption is passed to the encryption thread using ReadFile and the OVERLAPPED structure. They added to the original structure a random AES 128 bits key that is generated just before using BCryptGenRandom from bcrypt.dll library:generate aes keyBCryptGenRandomIn the decryption thread, the packet is dequeued from the specified I/O completion Port, then the AES key is set using aesni_setkey_enc_128 if the processor supports the Advanced Encryption Standard New Instructions (AES-NI) otherwise with the mbedtls_setkey_enc_128 function:set aes keyThe codes that check if the processor supports AES-NI are done earlier, before generating the RSA session keys:check aesni supportFinally, the file content is encrypted using AES and written back into the file:file encryptionFiles end dataAt the end of each file, 0x610 bytes are appended. This data structure contains the required information for decryption:OffsetDescriptionSize (bytes)0x0Encrypted AES key0x1000x100Encrypted RSA session keys0x5000x600First 0x10 bytes of the attacker's RSA public key0x10files end dataDecryptor and DecryptionTo decrypt a file, the Decryptor needs to:Import the attacker’s RSA keysGet and decrypt the session key pair (placed at the end of the file) using the attackers' private key.Get and decrypt the AES key (placed at the end of the file) used for encryption using the decrypted session key pair.Decrypt the file using AES and the previous AES key.The decryptor includes in its resource the full RSA attacker's key (0x483 bytes):load attackers keyImports the RSA key:Import RSA attacker's keyGets the last 0x510 file bytes and decrypts the first 0x500 to get the RSA session keys:decrypt session keyFrom this, it can decrypt the AES key (stored at the end of the file) with the RSA session key and finally the file.AnnexesDynamic Stack StringsLockBit builds his strings in the stack dynamically. For example, the function that compares file names to a blacklist uses stack strings to build the blacklist:stack stringsBecause there are many strings, and their length can be as big as a ransom note and also because it is a classical feature that you may find again in other malware, automating this task may be useful. One solution would have been to create a script using IDA that records write operation on the stack but as we said in the introduction, strings are also built in addition to a XOR routine:XOR routineor:inline xor loopIn many malware, there is often a single function that is used to decrypt the strings. Most of the time, the solution is to get the cross references to this function with its parameter using IDA, and execute the decrypt function by using one of them: + Python implementation + Debugger conditional breakpoint + IDA appcall + x86 Emulation (unicorm, miasm, etc.)But because stack strings or often inline we won’t be able to use cross references.One way to do it is by doing static symbolic emulation on a portion of the code by using IDA selection. I did use this way because with dynamic emulation (symbolic or not) you may have to handle corner cases when an instruction is doing read/write memory operation in an undefined memory zone or API call, etc.I used miasm framework, because it is easy to install (copy the miasm directory to C:\...\IDA\python\), and they already had a good example on their git.Original miasm exampleTaking a simple case:simple stack stringBy running the original miasm script, we get the following output:IRDst = loc_key_2 @32[EBP_init + 0xFFFFFC2C] = 0x730077 @32[EBP_init + 0xFFFFFC20] = 0x770024 @32[EBP_init + 0xFFFFFC34] = 0x740062 @32[EBP_init + 0xFFFFFC28] = 0x6F0064 @32[EBP_init + 0xFFFFFC30] = 0x7E002E @16[EBP_init + 0xFFFFFC38] = (EAX_init)[0:16] @32[EBP_init + 0xFFFFFC24] = 0x6E0069 This gives us a good starting point to implement more features on it.Modified versionThe idea was to modify the script to automatically comment the instruction with the right strings and rename the local variables (see picture above). Below the steps:1 - Symbolic execution Do symbolic execution on each instruction and for each write operation in memory, stored:The destination memory expr (@32[EBP_init + 0xFFFFFC2C])The instruction address (EIP)The stack position (to handle case where a local variable is accessed using ESP and not EBP)def run_symb_exec(symb, start, end): """ Execute symbolic execution and record memory writes :param symb : SymbolicEngine :param start (int) : start address :param end (int) : end address return data (dict) : Dictionnary with information needed (instruction offset, data_xrefs, source memory expression, spd value) """ data = dict() while True: irblock = ircfg.get_block(start) if irblock is None: break for assignblk in irblock: if assignblk.instr: LOGGER.debug("0x%x : %s" % (assignblk.instr.offset, assignblk.instr)) if assignblk.instr.args: if assignblk.instr.args[0].is_mem() is True: # write mem operation data[assignblk.instr.args[0]] = {'to': assignblk.instr.offset, 'd_ref_type': 2, 'expr': assignblk.instr.args[0], 'spd': idc.get_spd(assignblk.instr.offset)} if assignblk.instr.offset == end: break symb.eval_updt_assignblk(assignblk) start = symb.eval_expr(symb.ir_arch.IRDst) return data 2 - Concretize destination memory Replace destination memory expression (@32[EBP_init + 0xFFFFFC2C]) with concrete value (0x0 for EBP and the stack pointer (spd) for ESP), to get a concrete value.def concretizes_stack_ptr(phrase_mem): """ replace ESP or EBP with a concrete value :param phrase_mem (dict) """ stack = dict() for dst, src in phrase_mem.items(): ptr_expr = dst.ptr spd = src['spd'] + 0x4 real = expr_simp(ptr_expr.replace_expr({ExprId('ESP', 32): ExprInt(spd, 32), ExprId('EBP', 32): ExprInt(0x0, 32)})) if real.is_int(): stack[real.arg] = src return stack 3 - Evaluate the expression Evaluate the destination memory expression to get the result expression. For example:@128[ESP + 0x488] = {@8[0x423EE0] 0 8, @8[0x423EE0] ^ @128[0x423EE0][8:16] 8 16, @128[0x423EE0][16:128] 16 128} 4 - Translate the resulting expression in python Using the miasm Translator we can convert the expression in Python code:{@8[0x423EE0] 0 8, @8[0x423EE0] ^ @128[0x423EE0][8:16] 8 16, @128[0x423EE0][16:128] 16 128} -> (((memory(0x423EE0, 0x1) & 0xff) << 0) | ((((memory(0x423EE0, 0x1) ^ ((memory(0x423EE0, 0x10) >> 8) & 0xff)) & 0xff) & 0xff) << 8) | ((((memory(0x423EE0, 0x10) >> 16) & 0xffffffffffffffffffffffffffff) & 0xffffffffffffffffffffffffffff) << 16)) This will allow us to evaluate the Python code to get the content.5 - Comment IDA and rename local var I reproduce the stack frame using a list, and for each string found, I comment IDA to the right offset using the previously stored information and rename the local variable with the right size.def set_data_to_ida(start, data): """ Add comment with the strings, and redefine stack variables in IDA """ size_local_var = idc.get_func_attr(start, idc.FUNCATTR_FRSIZE) frame_high_offset = 0x100000000 frame_id = idc.get_func_attr(start, idc.FUNCATTR_FRAME) l_xref = dict() if size_local_var == 0: # TODO : handle when stack size is undefined size_local_var = 0x1000 # set stack size to arbitrary value 0x1000 # represent the stack as a list (initialization) stack = [0 for i in range(0, size_local_var)] # fill the stack for offset, value in data.items(): if (offset >> 31) == 1: # EBP based frame if offset <= frame_high_offset: stack_offset = twos_complement(offset) # Ex: 0xfffffe00 -> 0x200 frame_offset = stack_to_frame_offset(stack_offset, size_local_var) # frame_offset = member_offset = positive offset in the stack frame l_xref[frame_offset] = value stack[frame_offset] = value['value'] else: # ESP based frame l_xref[offset] = value stack_offset = frame_to_stack_offset(offset, size_local_var) frame_offset = offset stack[offset] = value['value'] LOGGER.debug("offset 0x%x, stack_offset 0x%x, frame_offset 0x%x, value %s" % (offset, stack_offset, frame_offset, chr(value['value']))) index = 0 while index < len(stack): if stack[index] != 0: # skip null bytes buff = get_bytes_until_delimiter(stack[index::], [0x0, 0x0]) # TODO: adjust auto ascii/utf16 ? if buff: LOGGER.debug("raw output = %s" % repr(buff)) ascii_buff = zeroes_out(buff) # transform to ascii, deletes null bytes if buff[1] == 0x0: # check if strings is utf16 TODO: check if really usefull STRTYPE = idc.STRTYPE_C else: STRTYPE = idc.STRTYPE_C var_offset = index var_name = idc.get_member_name(frame_id, var_offset) s_string = "".join(map(chr, ascii_buff)) LOGGER.info("[+] Index 0x%x, var_offset 0x%x, frame_id = 0x%x, var_name %s, strings = %s, clean_string = %s, len_strings = 0x%x, size_local_var 0x%x, xref to 0x%x" % (index, var_offset, frame_id, var_name, s_string, replace_forbidden_char(s_string), len(buff), size_local_var, l_xref[index]['to'])) # delete struct member, to create array of char LOGGER.info("[+] Delete structure member") for a_var_offset in range(var_offset, var_offset + len(buff)): # if idc.get_member_name(frame_id, a_var_offset): ret = idc.del_struc_member(frame_id, a_var_offset) LOGGER.debug("ret del_struc_member = %d" % ret) # re add structure member with good size and proper name LOGGER.info("[+] Add structure member") ret = idc.add_struc_member(frame_id, replace_forbidden_char(s_string)[:0x10], var_offset, idc.FF_STRLIT, STRTYPE, len(buff)) LOGGER.debug("ret add_struc_member = %d" % ret) # Comment instruction using the xref key LOGGER.info("[+] Comment instruction") if l_xref[index]['d_ref_type'] == 2: if not idc.get_cmt(l_xref[index]['to'], 0): idc.set_cmt(l_xref[index]['to'], s_string, 0) index = index + len(buff) else: index = index + 1 else: index = index + 1 LOGGER.info("[+] end") return stack Script Output ExampleBy selecting instructions and running the script, we get instructions automatically commented and local variable renamed:xor routine outpu'''
