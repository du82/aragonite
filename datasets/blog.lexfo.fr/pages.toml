title = "Lexfo's security blog - StealC Malware Analysis Part 1"
full_description = '''01 - IntroductionThis series of blog posts is aimed at a technical audience interested in reverse engineering and, more specifically, malware analysis.In this article, we'll take a look at the analysis of a malicious sample for Windows from the StealC family, from the packed sample to the recovery of C2.We'll automate our analysis steps with a view to integrating them into an automated pipeline for extracting indicators of compromise.In the second article we'll retrieve C2 from the loader, get the third stage sample and unpack it.The third article will focus on the last stage (StealC malware) and C2 recovery using static analysis.RequirementsThe prerequisites for this articles are :Knowledge of reverse engineering on malicious programsBasic knowledge of x86 assemblerKnowledge of C/Cpp is strongly recommendedKnowledge of Python is required for automationKnowledge of a disassembler (Binary Ninja, IDA, Ghidra)Experience of opening malware in a disassemblerExperience with a debugger (x64dbg/WinDBG...)Motivation and a few liters of coffeeTable of contentBelow is the table of contents for this articles series:01 - Introduction02 - Reminders and preparation of the analysis environment03 - Initial sample (Stage 1)04 - Loader analysis (Stage 2)05 - Analysis of Stage 306 - Stage 4 analysis (StealC)07 - Conclusion02 - Reminders and preparation of the analysis environmentSome definitionsIn order to follow this article, you need to be familiar with the vocabulary of malware analysis.A sandboxA sandbox is a solution for detonating (executing) a malicious program in a controlled environment. The purpose of this solution is to help you understand how a malicious program works. I invite you to find out for yourself about this fascinating subject, as it can save you precious time when you're under time pressure.It's worth noting that some malware programs have features that can detect whether they are running in this type of environment, so as not to execute the malicious payload and thwart detection.Open-source (CapeSandbox, Drakfuf Sanbox...) and proprietary (AnyRun, JoeSandbox...) sandboxes are available. Your choice of sandbox depends on the level of discretion you require when analyzing malware. In fact, some sandboxes collect the samples you send them and make them available to a more or less restricted audience, as is the case with some free online sandboxes. If you need to maintain a high level of discretion, you should opt for a sandbox that can be hosted on your premises, and disable all telemetry options or, even more radically, cut off access to the Internet.A command and control serverA command and control server, also known as C2 or CnC (Command and Control), is a server belonging to a malicious actor, enabling them to collect and even interact with an agent (malware) installed on an infected workstation.The C2 of a malicious program is very often requested from a malware analyst with the aim of adding it in detection and network flow equipments (e.g. firewalls, SIEMs, etc.).The C2 of a malicious program can, for example, be identified as a domain or an IP address.A packerA packer is generally the name given to a tool that compresses and potentially obfuscates an original program. A packer can be used legitimately by software publishers to protect intellectual property. Malicious programs are regularly packed to bypass static detection systems.A packer can incorporate obfuscation, anti-emulation, anti-VM and anti-debugging techniques. The packer studied in this blog post will contain only anti-emulation and obfuscation methods.There are open-source packers and obfuscators available on Github, and other proprietary ones (e.g. Tigress, VMProtect).An emulator (symbolic execution)In the context of reverse engineering, an emulator simulates the behavior of a program or a sequence of instructions by reproducing the execution context (CPU register, memory, etc.). Emulation does not deliver the same performance as a virtual machine, because the program instructions are not executed directly by the processor, but simulated.Among other things, emulation makes it possible to bypass specific anti-debug or anti-VM mechanisms that may be implemented in programs. On the other hand, some programs use anti-emulation. Anti-emulation can be characterized by the presence of dead code (useless code) that requires a quite a few of execution time, e.g. a loop that calls a useless function. A normal CPU would take a fraction of a second to execute, whereas an emulator can take several minutes.Emulators are present in detection systems such as antivirus software. The latter analyzes the behavior of programs by emulating them. If anti-emulation techniques are present in the program and are not thwarted by the emulator, the emulation may then terminate in timeout.Some open-source emulators allow symbolic execution of Windows PEs, such as MIASM, Qiling, Triton or SpeakEasy.Analysis toolsFor malware analysis, we strongly recommend using a virtual environment. You can use the hypervisor of your choice (e.g. VMWare, Virtualbox, KVM). It can be useful to use different systems, as some malware only work on specific systems. For example, you may have a Windows 7 machine and a Windows 10 machine. Once your machine is installed, you can install analysis tools, a disassembler, a debugger, dynamic analysis tools, and a development and compilation environment.Below is a non-exhaustive list of tools that may be useful for your analyses:Sysinternal Suite (procmon, processexplorer, autoruns, tcpview...)Detect It EasyPEStudioDNSpy (if you come across .NET)PE-BearFlossIsolate your machine from the network to prevent any connection to the outside world. Unless you're using a system such as inetsim, disable network interface completely.Make a snapshot of your virtual machine in a healthy state once all your analysis tools are installed and configured, so that you can return to a healthy state at any time.Set up a system enabling you to transfer files between your host and your virtual system. Be careful to restrict access to an empty directory or one with no critical data (some ransomware encrypts file shares). If in doubt, disable file sharing completely once you've transferred the malicious sample to the virtual machine.Make regular snapshots as you progress through the analyses, so that you can keep a record of your progress.A disassemblerThere are several disassemblers on the market, but the one that seems to be the most widely used in professional environments today is IDA Pro. It costs a quite a few of money, especially if you need a decompiler for a specific architecture. It has a built-in debugger and an API to automate your analysis, as well as a number of open-source plugins available on Github.In this article we use Binary Ninja, which has the same features as the IDA Pro tool, but at a much more affordable price. Binary Ninja has an active community and responsive bug-fixing support. Its integrated plugin manager lets you quickly install and configure plugins.If you want to stay in the free world, there are disassemblers such as:Radare with its graphical interface iaito (or the fork Rizin with Cutter GUI)Ghidra, a disassembler initially developed by the NSA using the Java languageA debuggerWhen you want to debug a program on Windows, you can use a debugger. Windows provides its own debugger, WinDBG.There's also a relief for OllyDBG (for the oldest among you) called x64dbg. It has a large number of useful plugins for your reverse sessions. Some useful plugins for malware analysis:https://github.com/x64dbg/ScyllaHidehttps://github.com/buzzer-re/x64dbg-ASLR-Removalhttps://github.com/therealdreg/DbgChildInitial sample (Stage 1)Open source researchWhere to startThe aim of the open-source research phase is to gather the information you need for your analyses. When you're analyzing a malicious sample, it's possible that some people have already studied the sample, or at least the malware family. If you're dealing with a totally unknown sample, grab your knowledge, some tools, a few liters of coffee and get started! The malicious actor who developed the malicious sample aims to discourage you, waste your time and make you give up.Take the time to read blog articles on malicious sample analysis, attend or watch replays of conferences on the subject (e.g. Botconf, Virus Bulletin), monitor social networks such as Twitter/X.Another very useful platform for your malware research is Malpedia. It categorizes malware families by actor and provides samples, Yara rules and links to external articles.Sample recoveryIn this article, we've chosen an arbitrarily selected sample for you. The sample was part of one of the last submissions on Malware Bazaar (malicious sample sharing platform) by user zbetcheckin. This sample has been categorized as part of the StealC family. The program appears to be detected by 58 antivirus programs.A search in Malpedia tells us that StealC:is a Malware-as-a-Servicehas existed since january 2023was written in Ccollects information on:web browserscryptographic walletsinstant message software and emailscommunicates with its C2 using HTTP POST requestsTwo Yara rules are supplied: win_stealc_auto and win_stealc_w0. These date from 2023. We can put them aside for later, as they'll come in handy. Blog posts are also available - feel free to have a look if you want to understand some of the grey areas.Here's some information about the sample we'll be looking at in this article:TypeDataSHA256c173cfcb0adfa3013a398638789bf4350601cce0e1c55a456d98311543062f82SHA187e5501bbc72be1d0b763acec9bf08c9db26a8d1MD551e5979460e5a9dc941c03bc76cc3855File size455'681 bytesFirst seen2024-04-08 07:13:32 UTC (Malware Bazaar)MIME typeapplication/x-dosexecimphash9ee9346826f4cfd6b39a524a25cdc5dessdeep12288:f9zyluCg7RvcQ7tZRsuPE16N0N9k9ptHMF:PCg7RvcKKnitHMFUser zbetcheckin indicates the origin of the malware in a comment on Malware Bazaar:Comment on Malware BazaarThe URL in the comment can be used to extract the following indicators of compromise:TypeDataIPv4185.172.128[.]59FilenameISetup8.exeURLhxxp://185.172[.]128.59/ISetup8.exeBy digging deeper into these indicators of compromise, it would be possible to retrieve more information on the infrastructure of the malicious actor. For example, we could retrieve the AS (autonomous system) associated with the IP address and pivot using this information. But this is beyond the scope of this article.We can retrieve the malicious sample via open sources such as Malware Bazaar, VirusTotal (requires an appropriate license) or directly from the infrastructure of the malicious actor if the latter has not shut down its service. If you plan to retrieve a sample from the infrastructure of a malicious actor, we strongly recommend that you use at least one bounce to connect to it (e.g. Tor, VPN, even a proxy).The files can be recovered here. Malicious samples are contained in password-protected ZIP archives. The password used for these archives is the one most commonly used when exchanging malicious files: infectedPacker identificationIf you have not yet configured your machine, please refer to the chapter Reminders and preparation of the analysis environment in this article. Now that you have the sample on your analysis system, make sure you have shut down the network.EntropyWith Binary NinjaIf you want to save time and you own Binary Ninja, you can open our .bndb file.If we look at the binary data graph, we can see that a large part of the program contains data that cannot be understood by the disassembler:Stage 1 - Pixel mapYou can get an entropy score with the get_entropy method of the Binary Ninja API:>>> for section in bv.sections: ... sec = bv.get_section_by_name(section) ... print(f"Section '{section}': {bv.get_entropy(sec.start, sec.start)}") ... Section '.data': [0.446795254945755] Section '.extern': [0.0] Section '.rdata': [0.6443907618522644] Section '.rsrc': [0.5072780251502991] Section '.synthetic_builtins': [0.0] Section '.text': [0.839885950088501] With Detect It EasyYou can also check the entropy of the binary with another tool such as Detect It Easy. With this tool, you can see that the .data and .text sections have a rather high entropy level:Detect It Easy - Stage 1's EntropyWith YaraAnother less precise way of identifying whether a program is packed is to use Yara's math.entropy module.import "math" rule PE_High_entropy { condition: uint16(0) == 0x5A4D and uint32(uint32(0x3C)) == 0x00004550 and math.entropy(0, filesize) > 6.5 } Unpack sample manuallyIf you're faced with this type of packer and you're in a hurry, it may be necessary to unpack it manually if no automated solution exists.It is common for packers to use memory allocation methods such as VirtualAlloc, then add execution permissions to this memory area with VirtualProtect. Once the memory area has been allocated, the packers retrieve the encrypted second stage. The second stage may, for example, be present in the program resources. The packer then uses decryption or decoding alrogithms to decrypt the second stage and execute it.One way of extracting the packed program is to set write hardware breakpoints on memory areas freshly allocated by methods such as VirtualAlloc and then identify the decryption routine. Once the decryption loop has passed, you can extract the memory area. Note that this type of case does not always work.The pkr_ce1a packer uses the VirtualAlloc method, decrypts the second layer and adds a few modifications to it, then releases the memory area with VirtualFree.Memory allocationTo get started, set up your favorite debugger in a virtual machine isolated from the network and any file sharing. Set a breakpoint on the VirtualAlloc and VirtualFree methods of the Kernel32.dll library. Each packer has its own way of extracting. Adapt the various steps to your technical environment.If you're using Binary Ninja or a WinDBG base, you can set a breakpoint on specific methods once you've reached the entry point of your program. The command is bu kernel32.dll!VirtualAlloc:Binary Ninja - Breakpoint in debugger consoleContinue program execution (F9) until the breakpoint is triggered. Get the size of the VirtualAlloc argument. Here the argument sent to the function is pushed onto the stack and then stored in the eax register (0x6ae00) in the VirtualAlloc function.Binary Ninja - Debugging viewTo get the return address, continue to the function return (CTRL+F9 in binary ninja). This will give us the address of the memory area allocated by VirtualAlloc in 0x21a0000. This address will not necessarily be the same on your environment:Binary Ninja - Debugging viewSave the starting address of the memory area, and its size for later usage. Continue executing the program until you call the VirtualFree (F9) method:Binary Ninja - VirtualFree Bp hitPE extractionBefore extracting the PE, you can retrieve the first two bytes and make sure it's a Windows executable a'''
