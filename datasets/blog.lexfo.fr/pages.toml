title = "Lexfo's security blog - CVE-2017-11176: A step-by-step Linux Kernel exploitation (part 1/4)"
full_description = '''IntroductionThis series covers a step-by-step walkthrough to develop a Linux kernel exploit from a CVE description. It starts with the patch analysis to understand the bug and trigger it from kernel land (part 1), then it gradually builds a working proof-of-concept code (part 2). The PoC is then turned into an arbitrary call primitive (part 3) which is finally used to execute arbitrary code in ring-0 (part 4).The targeted audience is the Linux kernel newcomers (nothing too fancy for the veterans). Since most kernel exploit articles imply that the reader is already familiar with the kernel code, we will try to fill the gap by exposing core data structure and important code paths. In the end, every single line of the exploit should be understood, as well as their impact on the kernel.While it is impossible to cover everything in a single article, we will try to unroll every kernel path needed to develop the exploit. Think of it as a guided Linux kernel tour supported by a practical example. Exploit writing is actually a good way to understand the Linux kernel. In addition, we will show some debugging techniques, tools, common pitfalls and how to fix them.The CVE developed here is CVE-2017-11176, aka "mq_notify: double sock_put()". Most distributions patched it during the mid 2017. At the time of writing, there is no known public exploit.The kernel code exposed here matches a specific version (v2.6.32.x), nevertheless the bug also affects kernels up to 4.11.9. One might think that this version is too old, yet it is still actually used in a lot of places and some paths might be easier to understand. It shouldn't be too hard to find the equivalent paths on a more recent kernel.The exploit built here is not targetless. Hence, some modifications are required to run it on another target (structure offsets/layout, gadgets, function addresses...). Do not try to run the exploit as is, this will just crash your system! You can find the final exploit here.It is recommended grabbing the source code of a vulnerable kernel and try to follow the code on the go (or even better, implement the exploit). Fire up your favorite code crawling tool and let's start!Warning: Please do not get scared by the size of this series, there are tons of code. Anyway, if you really want to get into kernel hacking, you must be ready to read a lot of codes and documentation. Just take your time.Note: we do not deserve any credit for this CVE discovery, it is basically a 1-day implementation.Table of ContentsRecommended ReadingLab SetupCore ConceptsPublic InformationUnderstanding the BugReaching the Retry LogicForcing the TriggerConclusionRecommended ReadingThis article only covers a small subset of the whole kernel. We recommend you to read those books (they are great!):Understanding the Linux Kernel (D. P. Bovet, M. Cesati)Understanding Linux Network Internals (C. Benvenuti)A guide to Kernel Exploitation: Attacking the Core (E. Perla, M. Oldani)Linux Device Drivers (J. Corbet, A. Rubini, G. Kroah-Hartman)Lab SetupUPDATE: Thanks to readers feedbacks, this section has been updated (2018-10-22).The code exposed here comes from a specific target (2.6.32.x). However, you can try to implement the exploit on the following target. There might be slight variations in the code that shouldn't be blocking.Debian 8.6.0 (amd64) ISOThe previous ISO runs a 3.16.36 kernel. We only confirmed that the bug is reachable and makes the kernel crash. Most of the changes will appear during the last stages of exploitation (cf. part 3 and 4).While the bug is (mostly) exploitable in various configurations/architecture, the only requirements needed to exploit it the same way we do are:Kernel version must be lower than 4.11.9 (we recommend < 4.x)It must run on "amd64" (x86-64) architectureYou have root access for debugging purposeThe kernel uses the SLAB allocatorSMEP is enabledkASLR and SMAP are disabledMemory: >=512MBAny number of CPU. One is okay, you will understand why soon enough.WARNING: Due to code variation in the suggested target, it is recommended to set the number of CPU to one. Otherwise, reallocation may need additional steps (cf. part 3).The "default" configuration on the previous ISO satisfies all of those requirements. If you want to develop the exploit on another target, please see the next section.Do not worry if you don't know what are SLAB/SMEP/SMAP, this will be covered in part 3 and part 4.WARNING: To ease debugging, you must run the target with a virtualization software. However, we discourage using virtualbox as it didn't support SMEP (not sure if it does right now). You can use the free version of vmware for instance or any other virtualization tool as long as it supports SMEP (we will bypass it).Once the system has been installed (don't develop on a LiveCD), we need to check that the system configuration is as expected.Checking SLAB/SMEP/SMAP/KASLR StatusIn order to know if SMEP is enabled or not, run the following command. The "smep" string MUST be present:$ grep "smep" /proc/cpuinfo flags : [...] smep bmi2 invpcid ^--- this one If not, check that cat /proc/cmdline does NOT have the nosmep string. If it does, you will need to edit the /etc/default/grub file and modify the following lines:# /etc/default/grub GRUB_CMDLINE_LINUX_DEFAULT="quiet" // must NOT have "nosmep" GRUB_CMDLINE_LINUX="initrd=/install/initrd.gz" // must NOT have "nosmep" Then run update-grub and reboot your system. If this is still disabled afterward (check /proc/cpuinfo), then use another virtualization tool.For SMAP, you will need to do the exact opposite. First, grep for "smap" in /proc/cpuinfo. If it does not appear, everything is okay. Otherwise, add "nosmap" in your grub configuration file (then update-grub and reboot).The exploit developed here we will use "hardcoded" addresses. For this reason, kASLR must be disabled. This is the equivalent of ASLR (Address Space Layout Randomization) but for the kernel. In order to disable it, you can add the nokaslr option in the cmdline (just like nosmap). In the end, the grub cmdline should be something like:GRUB_CMDLINE_LINUX_DEFAULT="quiet nokaslr nosmap" GRUB_CMDLINE_LINUX="initrd=/install/initrd.gz" Finally, your target must use the SLAB allocator. You can validate the kernel is using it with:$ grep "CONFIG_SL.B=" /boot/config-$(uname -r) CONFIG_SLAB=y It must be CONFIG_SLAB=y. Debian uses SLAB by default while Ubuntu uses SLUB by default. If not, then you will need to recompile the kernel. Please read your distribution documentation.Again, the suggested ISO satisfies all those requirements, so you only need to check that everything is okay.Installing SystemTapAs mentioned before, the ISO runs a v3.16.36 (uname -v) kernel which is vulnerable to the bug (patched in v3.16.47).WARNING: Do NOT follow the systemtap installation procedure as it might update the kernel!Because of this, we will need to grab the .deb package for our specific version and install them manually. We will need:linux-image-3.16.0-4-amd64_3.16.36-1+deb8u1_amd64.deblinux-image-3.16.0-4-amd64-dbg_3.16.36-1+deb8u1_amd64.deblinux-headers-3.16.0-4-amd64_3.16.36-1+deb8u1_amd64.debYou can download them from this link, or type:# wget https://snapshot.debian.org/archive/debian-security/20160904T172241Z/pool/updates/main/l/linux/linux-image-3.16.0-4-amd64_3.16.36-1%2Bdeb8u1_amd64.deb # wget https://snapshot.debian.org/archive/debian-security/20160904T172241Z/pool/updates/main/l/linux/linux-image-3.16.0-4-amd64-dbg_3.16.36-1%2Bdeb8u1_amd64.deb # wget https://snapshot.debian.org/archive/debian-security/20160904T172241Z/pool/updates/main/l/linux/linux-headers-3.16.0-4-amd64_3.16.36-1%2Bdeb8u1_amd64.deb Then, install them with:# dpkg -i linux-image-3.16.0-4-amd64_3.16.36-1+deb8u1_amd64.deb # dpkg -i linux-image-3.16.0-4-amd64-dbg_3.16.36-1+deb8u1_amd64.deb # dpkg -i linux-headers-3.16.0-4-amd64_3.16.36-1+deb8u1_amd64.deb Once you're done, reboot the system and then download system tap with:# apt install systemtap And finally, check that everything is fine:# stap -v -e 'probe vfs.read {printf("read performed\n"); exit()}' stap: Symbol `SSL_ImplementedCiphers' has different size in shared object, consider re-linking Pass 1: parsed user script and 106 library script(s) using 87832virt/32844res/5328shr/28100data kb, in 100usr/10sys/118real ms. Pass 2: analyzed script: 1 probe(s), 1 function(s), 3 embed(s), 0 global(s) using 202656virt/149172res/6864shr/142924data kb, in 1180usr/730sys/3789real ms. Pass 3: translated to C into "/tmp/stapWdpIWC/stap_1390f4a5f16155a0227289d1fa3d97a4_1464_src.c" using 202656virt/149364res/7056shr/142924data kb, in 0usr/20sys/23real ms. Pass 4: compiled C into "stap_1390f4a5f16155a0227289d1fa3d97a4_1464.ko" in 6310usr/890sys/13392real ms. Pass 5: starting run. read performed // <-------------- Pass 5: run completed in 10usr/20sys/309real ms. Last Minute ChecksUpdated (2018-10-22)In addition to system tap, the target kernel will be used to compile and run the exploit, so run this:# apt install binutils gcc Now, download the exploit with:$ wget https://raw.githubusercontent.com/lexfo/cve-2017-11176/master/cve-2017-11176.c Due to code differences between the suggested and the article targets, the "used-after-freed" object here lies in the "kmalloc-2048" cache (instead of kmalloc-1024). That is, change the following lines in the exploit:#define KMALLOC_TARGET 2048 // instead of 1024 This is the kind of problems that arises with non-targetless exploit. You will understand this change by reading part 3. Now, build and run the exploit:$ gcc -fpic -O0 -std=c99 -Wall -pthread cve-2017-11176.c -o exploit $ ./exploit [ ] -={ CVE-2017-11176 Exploit }=- [+] successfully migrated to CPU#0 [+] userland structures allocated: [+] g_uland_wq_elt = 0x120001000 [+] g_fake_stack = 0x20001000 [+] ROP-chain ready [ ] optmem_max = 20480 [+] can use the 'ancillary data buffer' reallocation gadget! [+] g_uland_wq_elt.func = 0xffffffff8107b6b8 [+] reallocation data initialized! [ ] initializing reallocation threads, please wait... [+] 200 reallocation threads ready! [+] reallocation ready! [+] 300 candidates created [+] parsing '/proc/net/netlink' complete [+] adjacent candidates found! [+] netlink candidates ready: [+] target.pid = -4590 [+] guard.pid = -4614 [ ] preparing blocking netlink socket [+] receive buffer reduced [ ] flooding socket [+] flood completed [+] blocking socket ready [+] netlink fd duplicated (unblock_fd=403, sock_fd2=404) [ ] creating unblock thread... [+] unblocking thread has been created! [ ] get ready to block [ ][unblock] closing 576 fd [ ][unblock] unblocking now [+] mq_notify succeed [ ] creating unblock thread... [+] unblocking thread has been created! [ ] get ready to block [ ][unblock] closing 404 fd [ ][unblock] unblocking now [ 55.395645] Freeing alive netlink socket ffff88001aca5800 [+] mq_notify succeed [+] guard socket closed [ 60.399964] general protection fault: 0000 [#1] SMP ... cut (other crash dump info) ... <<< HIT CTRL-C >>> The exploit failed (and does not give root shell) because it has not been built for this target. As you will see, it requires modifications (cf. part 3 and 4). However, it validates that we can reach the bug.WARNING: Because of other differences between our target and the suggested one, you WILL NOT get some kernel crashes (e.g. part 2). The reason being, the kernel does not automatically crash on certain error (just like above) but simply hang or kill the exploit. However, it is in a unstable state and can crash at any time. It is recommended to read the code and understand those differences.Getting Kernel Source CodeOnce the system has been installed and ready, the next step is to grab the kernel source code. Again, since we are using an outdated kernel, we will need to grab it with:# wget https://snapshot.debian.org/archive/debian-security/20160904T172241Z/pool/updates/main/l/linux/linux-source-3.16_3.16.36-1%2Bdeb8u1_all.deb And:# dpkg -i linux-source-3.16_3.16.36-1+deb8u1_all.deb The kernel source code should be located at: /usr/src/linux-source-3.16.tar.xz.Since the target kernel will crash a lot, you must analyse the kernel code and develop the exploit from your host system. That is, get those source back to your host system. The target must only be used to compile/run the exploit and SystemTap (through ssh!).From here, you can use any code crawling tool. It is required that you can cross-reference symbols efficiently. Linux has multiple millions lines of code, you will get lost without it.A lot of kernel developers seems to use cscope. You can generate the cross-references by doing like this or just:cscope -kqRubv Note the -k modifier which excludes your system library headers as the kernel runs in freestanding. The cscope database generation takes a couple of minutes, then use an editor which has a plugin for it (e.g. vim, emacs).Hopefully, you are now ready to develop your first kernel exploit.GL&HF! :-)Core ConceptsIn order not to get lost at the very first line of the CVE analysis, it is necessary to introduce some core concepts of the Linux kernel. Please note that most structures exposed here are incomplete in order to keep it simple.Process descriptor (task_struct) and the current macroOne of the most important structures in the kernel is the struct task_struct, yet not the simplest one.Every task has a task_struct object living in memory. A userland process is composed of at least one task. In a multi-threaded application, there is one task_struct for every thread. Kernel threads also have their own task_struct (e.g. kworker, migration).The task_struct holds crucial information like:// [include/linux/sched.h] struct task_struct { volatile long state; // process state (running, stopped, ...) void *stack; // task's stack pointer int prio; // process priority struct mm_struct *mm; // memory address space struct files_struct *files; // open file information const struct cred *cred; // credentials // ... }; Accessing the current running task is such a common operation that a macro exists to get a pointer on it: current.File Descriptor, File Object and File Descriptor TableEverybody knows that "everything is a file", but what does it actually mean?In the Linux kernel, there are basically seven kinds of files: regular, directory, link, character device, block device, fifo and socket. Each of them can be represented by a file descriptor. A file descriptor is basically an integer that is only meaningful for a given process. For each file descriptor, there is an associated structure: struct file.A struct file (or file object) represents a file that has been opened. It does not necessarily match any image on the disk. For instance, think about accessing files in a pseudo-file systems like /proc. While reading a file, the system may need to keep track of the cursor. This is the kind of information stored in a struct file. Pointers to struct file are often named filp (for file pointer).The most important fields of'''
