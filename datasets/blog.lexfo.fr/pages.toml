["https://blog.lexfo.fr/cobalt-strike-investigation-part-2.html"]
title = "Lexfo's security blog - Cobalt Strike Investigation - Part 2"
full_description = '''IntroductionThe previous article detailed the findings of the Cobalt Strike remote-exec built-in command that allows executing arbitrary commands on the remote host without creating a persistent session with a Beacon.This second part will focus on the jump command in Cobalt Strike, used to establish a connection from a compromised system to the command and control (C2) server. The command allows to remotely access and control the compromised system, and to use it as a pivot point for further attacks on the network. This article will detail lateral movements using the Cobalt Strike Beacon with the following built-in jump commands:jump psexec64jump winrm64jump psexec_pshApproachThe aim here is to provide basic information on the kinds of logs and other artefacts that could be generated from Cobalt Strike on a default Windows 10 host. To get a better context and understanding, we enabled Sysmon on the victim workstation, in order to get a baseline to compare with.The tests were done with Cobalt Strike version 4.4 with the default configuration, without any kind of customization. It is important to note that Cobalt Strike allows users to change various settings (pipe names, service name, default temporary process, etc.) to customize its footprint. Depending on the Cobalt Strike settings used by the attackers, the events generated may be slightly different and detection rules may fail.Each command was executed twice to avoid false positives, and the investigations were conducted on one of these two executions. This short analysis can be later on used as a reference to build rules to detect Cobalt Strike movements during a forensics incident response (without Sysmon or Audit Policies).The Lab is composed of the following elements:Windows 10 workstations with Sysmon installed,Windows Server 2016 Domain Controller.The different steps and tools used to extract and analyze the artefacts post compromise are:Run DFIR-Orc to extract artefacts on the Windows 10 machine;Run log2timeline/plaso on the extracted data to build a clear timeline;Analyze data using Splunk or Kibana (ELK fullstack with custom Logstash configuration).By using DFIR-Orc and Plaso, we were able to process the most important artefacts:Event logs (*.evtx), including PowerShell command history;Prefetch files among other execution evidence;NTFS artefacts, such as USNjrnl and MFT;User and System hives (userassist, appcompatcache, etc.).Findings SummaryA summary of the most important findings (excluding Sysmon events) is available in the timeline below. It should be noted that these events alone do not constitute evidence of the use of a Cobalt Strike beacon, and further analysis, some of which is detailed in this article, needs to be conducted to validate or not the hypothesis of remote code execution. These timelines will be detailed and explained in the following chapters.Cobalt Strike CommandsTimeDescriptionjump psexec6413:33:05.767[fs/usnjrnl] File \Windows\4542843.exe USN_REASON_FILE_CREATEjump psexec6413:33:05.769[evtx/sec/4624] User 'CORP.LOCAL\alice' (S-1-5-21-1155457554-2149841727-2293290625-1108) successfully logon (type=3) from '192.168.56.119' ('-') (logon_id=0x000000000051bce7) with '-'jump psexec6413:33:05.803[evtx/sec/4624] User 'CORP.LOCAL\alice' (S-1-5-21-1155457554-2149841727-2293290625-1108) successfully logon (type=3) from '192.168.56.119' ('-') (logon_id=0x000000000051bd0a) with '-'jump psexec6413:33:05.829[evtx/sys/scm/7045] Service '4542843' (\\DESKTOP-RI5FIO5\ADMIN$\4542843.exe) was installed by user 'LocalSystem' (type: user mode service, start: demand start)jump psexec6413:33:05.877[prefetch] Prefetch [4542843.EXE] was executed - run count 1 path hints: [] hash: 0xB39DA9E6 volume: 1 [serial number: 0x228095FD device path: \VOLUME{01d80e8a80662822-228095fd}]jump psexec6413:33:06.954[prefetch] Prefetch [RUNDLL32.EXE] was executed - run count 2 path hints: \WINDOWS\SYSTEM32\RUNDLL32.EXE hash: 0x64292FC9 volume: 1 [serial number: 0x228095FD device path: \VOLUME{01d80e8a80662822-228095fd}]jump psexec6413:33:07.000[evtx/sys/scm/7034] Service '4542843' terminated unexpectedly (1 times)jump psexec6413:33:07.000[fs/mft][macb] File \Windows\Prefetch\4542843.EXE-B39DA9E6.pf ($FILE_NAME), MFT:98397-10, PARENT: 93711-2jump psexec6413:33:07.000[fs/usnjrnl] File \Windows\Prefetch\4542843.EXE-B39DA9E6.pf USN_REASON_FILE_CREATEjump psexec6413:33:07.939[fs/usnjrnl] File \Windows\4542843.exe USN_REASON_CLOSE USN_REASON_FILE_DELETEjump psexec6413:33:17.063[fs/mft][macb] File \Windows\Prefetch\RUNDLL32.EXE-64292FC9.pf ($FILE_NAME), MFT:98393-10, PARENT: 93711-2jump psexec6413:33:17.063[fs/usnjrnl] File \Windows\Prefetch\RUNDLL32.EXE-64292FC9.pf USN_REASON_FILE_CREATE.........jump winrm6413:38:10.193[prefetch] Prefetch [WSMPROVHOST.EXE] was executed - run count 2 path hints: \WINDOWS\SYSTEM32\WSMPROVHOST.EXE hash: 0xEF06207C volume: 1 [serial number: 0x228095FD device path: \VOLUME{01d80e8a80662822-228095fd}]jump winrm6413:38:10.650[evtx/winrm/91] Creating WSMan shell on server with ResourceURI: 'http://schemas.microsoft.com/powershell/Microsoft.PowerShell'jump winrm6413:38:11.036[evtx/sec/4624] User 'CORP.LOCAL\alice' (S-1-5-21-1155457554-2149841727-2293290625-1108) successfully logon (type=3) from '-' ('-') (logon_id=0x00000000005eb099) with '-'jump winrm6413:38:11.614[fs/usnjrnl] File \Users\alice\AppData\Local\Temp\__PSScriptPolicyTest_psmlbjet.gus.ps1 USN_REASON_FILE_CREATEjump winrm6413:38:11.631[fs/usnjrnl] File \Users\alice\AppData\Local\Temp\__PSScriptPolicyTest_amxqtozh.ie2.psm1 USN_REASON_FILE_CREATEjump winrm6413:38:11.964[evtx/powershell/53504] Windows PowerShell has started an IPC listening thread on process '9724' in AppDomain 'DefaultAppDomain'jump winrm6413:38:13.099[evtx/powershell/400] The PowerShell engine state hosted by application C:\Windows\system32\wsmprovhost.exe -Embedding is changed from 'None' to 'Available'.jump winrm6413:38:13.705[evtx/sec/4624] User 'CORP.LOCAL\alice' (S-1-5-21-1155457554-2149841727-2293290625-1108) successfully logon (type=3) from '-' ('-') (logon_id=0x00000000005edc9b) with '-'jump winrm6413:38:13.828[evtx/sec/4624] User 'CORP.LOCAL\alice' (S-1-5-21-1155457554-2149841727-2293290625-1108) successfully logon (type=3) from '-' ('-') (logon_id=0x00000000005edd18) with '-'jump winrm6413:38:14.362[evtx/powershell/4104] The remote PowerShell scriptblock named '3cdb4718-452a-469b-bf94-b8a1ad197fa6' is executed (29 blocks)jump winrm6413:38:19.168[evtx/sec/4624] User 'CORP.LOCAL\alice' (S-1-5-21-1155457554-2149841727-2293290625-1108) successfully logon (type=3) from '192.168.56.119' ('-') (logon_id=0x00000000005f30a3) with '-'jump winrm6413:38:20.349[fs/mft][macb] File '\Windows\Prefetch\WSMPROVHOST.EXE-EF06207C.pf' ($FILE_NAME), MFT:106956-3, PARENT: 93711-2jump winrm6413:38:20.349[fs/usnjrnl] File \Windows\Prefetch\WSMPROVHOST.EXE-EF06207C.pf USN_REASON_FILE_CREATE.........jump psexec_psh13:45:07.732[evtx/sec/4624] User 'CORP.LOCAL\alice' (S-1-5-21-1155457554-2149841727-2293290625-1108) successfully logon (type=3) from '192.168.56.119' ('-') (logon_id=0x00000000008629e3) with '-'jump psexec_psh13:45:07.755[evtx/sys/scm/7045] Service '4b3d5bc' (%COMSPEC% /b /c start /b /min powershell -nop -w hidden -encodedcommand <base64enc_payload>) was installed by user 'LocalSystem' (type: user mode service, start: demand start)jump psexec_psh13:45:07.755[fs/mft][.a..] File \Windows\SysWOW64\cmd.exe ($STANDARD_INFORMATION), MFT:53610-1jump psexec_psh13:45:07.771[prefetch] Prefetch [CMD.EXE] was executed - run count 2 path hints: \WINDOWS\SYSWOW64\CMD.EXE hash: 0xAC113AA8 volume: 1 [serial number: 0x228095FD device path: \VOLUME{01d80e8a80662822-228095fd}]jump psexec_psh13:45:07.803[prefetch] Prefetch [POWERSHELL.EXE] was executed - run count 5 path hints: \WINDOWS\SYSWOW64\WINDOWSPOWERSHELL\V1.0\POWERSHELL.EXE hash: 0x767FB1AE volume: 1 [serial number: 0x228095FD device path: \VOLUME{01d80e8a80662822-228095fd}]jump psexec_psh13:45:07.833[fs/mft][macb] File \Windows\Prefetch\CMD.EXE-AC113AA8.pf ($FILE_NAME), MFT:110491-2, PARENT: 93711-2jump psexec_psh13:45:07.833[fs/usnjrnl] File \Windows\Prefetch\CMD.EXE-AC113AA8.pf USN_REASON_FILE_CREATEjump psexec_psh13:45:07.904[evtx/sec/4624] User 'CORP.LOCAL\alice' (S-1-5-21-1155457554-2149841727-2293290625-1108) successfully logon (type=3) from '192.168.56.119' ('-') (logon_id=0x0000000000862fb5) with '-'jump psexec_psh13:45:08.192[fs/mft][..c.] File \Windows\SysWOW64\WindowsPowerShell\v1.0\powershell_ise.exe ($STANDARD_INFORMATION), MFT:56216-1jump psexec_psh13:45:09.308[evtx/powershell/40961] A new PowerShell runspace have been createdjump psexec_psh13:45:09.508[fs/usnjrnl] File \Windows\Temp\__PSScriptPolicyTest_2nmpla2r.cyj.ps1 USN_REASON_FILE_CREATEjump psexec_psh13:45:09.520[fs/usnjrnl] File \Windows\Temp\__PSScriptPolicyTest_0tg0e3gp.i3q.psm1 USN_REASON_FILE_CREATEjump psexec_psh13:45:09.834[evtx/powershell/53504] Windows PowerShell has started an IPC listening thread on process '6920' in AppDomain 'DefaultAppDomain'jump psexec_psh13:45:10.348[evtx/powershell/400] The PowerShell engine state hosted by application powershell -nop -w hidden -encodedcommand <base64enc_payload> is changed from 'None' to 'Available'.jump psexec_psh13:45:10.387[evtx/powershell/40962] A PowerShell runspace have been closedjump psexec_psh13:45:10.681[evtx/powershell/4104] The remote PowerShell scriptblock named '7998c69a-4170-4f37-afb8-ef7ce9a2533c' is executed (1 block)jump psexec_psh13:45:11.213[evtx/powershell/4104] The remote PowerShell scriptblock named '23fe9a7e-31ee-473b-bcb0-8bd7c9b9ca38' is executed (1 block)jump psexec_psh13:45:11.246[evtx/powershell/4104] The remote PowerShell scriptblock named '010b0b53-c342-4479-aa21-445cddee3f28' is executed (1 block)jump psexec_psh13:45:17.990[fs/usnjrnl] File \Windows\Prefetch\POWERSHELL.EXE-767FB1AE.pf USN_REASON_DATA_TRUNCATIONCobalt Strike "jump psexec64"The Cobalt Strike jump psexec64 command allows the attacker to use the PsExec utility to execute a command or payload on a remote Windows system. When the jump psexec64 command is executed, it will use the active beacon to establish a connection to the specified Windows system, and then use the PsExec utility to run the malicious payload on the remote system. The command uses the psexec64 executable that is included in the Cobalt Strike package to run the command on x64 architectures. The Beacon type used for this test is smb.Microsoft-Windows-SysmonAs explained earlier, System Monitor (Sysmon) was installed on the Windows 10 workstation to have reference events on which to base our analyses. We therefore first reviewed the events recorded by Sysmon to get a baseline to compare with the extracted artefacts. The Sysmon events below have been filtered to keep the most useful ones.Event ID 1 - Process CreateThe process creation event provides extended information about a newly created process. The full command line provides context on the process execution. The ProcessGUID field is a unique value for this process across a domain to make event correlation easier.By default, Cobalt Strike spawns a temporary process and uses rundll32.exe to inject the malicious code into it and communicate the results back to the beacon using named pipes. We can note that rundll32.exe executes without any arguments, which is very suspicious. The process chain created by the jump psexec64 command on the victim workstation is service.exe -> beacon.exe -> rundll32.exe.TimeDescription13:33:05.883[evtx/sysmon/1] Process created with command \\DESKTOP-RI5FIO5\ADMIN$\4542843.exe (pid: 9612) by user 'NT AUTHORITY\SYSTEM' via C:\Windows\System32\services.exe (pid: 596)13:33:06.960[evtx/sysmon/1] Process created with command C:\Windows\System32\rundll32.exe (pid: 4648) by user 'NT AUTHORITY\SYSTEM' via \\DESKTOP-RI5FIO5\ADMIN$\4542843.exe (pid: 9612)Event ID 3 - Network Connection DetectedThe network connection event logs TCP/UDP connections on the machine. Each connection is linked to a process through the ProcessId and ProcessGUID fields. The event also contains the source and destination host names, IP addresses, port numbers and IPv6 status.In both of our tests, 3 connections using IPv4 are made to the victim. The first one on port 445, the second one on port 135 and the last one to a random port. Then, two IPv6 connections are recorded to port 445.TimeDescription13:33:06.881[evtx/sysmon/3] Tcp network connection from host - (192.168.56.119:54055) to host - (192.168.56.117:445) (pid=4)13:33:06.884[evtx/sysmon/3] Tcp network connection from host - (192.168.56.119:54056) to host - (192.168.56.117:135) (pid=832)13:33:06.885[evtx/sysmon/3] Tcp network connection from host - (192.168.56.119:54057) to host - (192.168.56.117:49692) (pid=596)13:33:06.885[evtx/sysmon/3] Tcp network connection from host - (fe80:0:0:0:d4bc:701f:e0a6:897d:49800) to host - (fe80:0:0:0:d4bc:701f:e0a6:897d:445) (pid=4)13:33:06.885[evtx/sysmon/3] Tcp network connection from host - (fe80:0:0:0:d4bc:701f:e0a6:897d:49800) to host - (fe80:0:0:0:d4bc:701f:e0a6:897d:445) (pid=4)Event ID 7 - Image LoadedThe image loaded event logs when a module is loaded in a specific process. It indicates the process in which the module is loaded, hashes and signature information.The libraries loaded by the beacon are not very fancy. This information will not be useful without Sysmon installed on the victim workstation.TimeDescription13:33:05.896[evtx/sysmon/7] Image C:\\Windows\\System32\\ntdll.dll loaded from process \\\\DESKTOP-RI5FIO5\\ADMIN$\\4542843.exe (pid=9612) with user NT AUTHORITY\SYSTEM13:33:05.897[evtx/sysmon/7] Image C:\\Windows\\System32\\kernel32.dll loaded from process \\\\DESKTOP-RI5FIO5\\ADMIN$\\4542843.exe (pid=9612) with user NT AUTHORITY\SYSTEM13:33:05.899[evtx/sysmon/7] Image C:\\Windows\\System32\\KernelBase.dll loaded from process \\\\DESKTOP-RI5FIO5\\ADMIN$\\4542843.exe (pid=9612) with user NT AUTHORITY\SYSTEM13:33:05.902[evtx/sysmon/7] Image C:\\Windows\\System32\\apphelp.dll loaded from process \\\\DESKTOP-RI5FIO5\\ADMIN$\\4542843.exe (pid=9612) with user NT AUTHORITY\SYSTEM13:33:05.915[evtx/sysmon/7] Image C:\\Windows\\System32\\advapi32.dll loaded from process \\\\DESKTOP-RI5FIO5\\ADMIN$\\4542843.exe (pid=9612) with user NT AUTHORITY\SYSTEM13:33:05.916[evtx/sysmon/7] Image C:\\Windows\\System32\\msvcrt.dll loaded from process \\\\DESKTOP-RI5FIO5\\ADMIN$\\4542843.exe (pid=9612) with user NT AUTHORITY\SYSTEM13:33:05.917[evtx/sysmon/7] Image C:\\Windows\\System32\\sechost.dll loaded from process \\\\DESKTOP-RI5FIO5\\ADMIN$\\4542843.exe (pid=9612) with user NT AUTHORITY\SYSTEM13:33:05.918[evtx/sysmon/7] Image C:\\Windows\\System32\\rpcrt4.dll loaded from process \\\\DESKTOP-RI5FIO5\\ADMIN$\\4542843.exe (pid=9612) with user NT AUTHORITY\SYSTEM13:33:05.929[evtx/sysmon/7] Image \\\\DESKTOP-RI5FIO5\\ADMIN$\\4542843.exe loaded from process \\\\DESKTOP-RI5FIO5\\ADMIN$\\4542843.exe (pid=9612) with user NT AUTHORITY\SYSTEMEvent ID 11 - File CreateFile create operati'''
