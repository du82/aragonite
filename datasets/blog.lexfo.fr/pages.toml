["https://blog.lexfo.fr/pentesting-pesit-ftp.html"]
title = "Lexfo's security blog - Pentesting a banking FTP service"
full_description = '''IntroductionA classical penetration test requires skills to assess a large variety of weaknesses, often dealing with common bug classes. Memory corruptions are rarely exploited during penetration tests. The reasons being, they can be risky (you do not want to crash a production system) and it can be time consuming (if you develop/adapt an exploit). It is also rather uncommon to have the opportunity to exploit a known memory corruption bug with a public script because both vendors and users tend to take their patching very seriously. Nevertheless, these kinds of weaknesses may enable attackers to gather powerful primitives, such as Remote Command Execution or secrets theft.Furthermore, when it comes to the banking world, it is common sense that this kind of issue shall provoke a mighty fuss, especially if no patch is ever available. Nonetheless, being able to detect memory corruptions during security assessments may avoid technical or economic disasters by just decommissioning the vulnerable service.Finally, let's be honest: legacy software is almost never audited since the major part is decommissioned whenever possible. However, the remaining part is almost never tested. The reason is simple: this kind of software is often very delicate to patch, leading users to avoid losing time in multiple vulnerability assessments. Typically, the first audit will purportedly pinpoint the most evident weaknesses. Memory corruption bugs that do not lead to crash will almost surely not be exploited, whenever detected.Consequently, I propose you to follow my analysis for CVE-2019-4599. A path I had to cross during a classical penetration test assessment. I was not expecting such surprise at first :)The targetStatic analysisALLO command handlerBypassing verif_num()The ImplementationBasic Test CasesReconsidering the Test CasesAbusing Uninitialized MemoryDealing with Huge OverflowLeveraging Arbitrary write primitiveHunting the Arbitrary Execution PrimitiveExploiting the bugConclusionDemoAppendiceThe targetIBM Sterling PeSIT FTP service is part of a complete transaction environment, aimed at syncing files between large financial entities in order to track, for instance, foreign banks' cash withdrawal. This principle is called teleclearance.teleclearanceOf course, those files usage - as well as their content - can vary, yet they are all transferred using some exchange protocol in the end. While international standards recommend using SWIFT, French banks have been using a protocol named PeSIT since the 1980s.Additionally, an FTP server is included in the Connect:Express software suite. It is used as a fallback protocol in case a PeSIT link cannot be established between two French organizations.Therefore, below are the main points of attacking the FTP server:When used by a bank, it is listening on the internet to communicate with other banking entities, although banks may typically position the service behind an IPSEC tunnelFTP protocol itself is one of the most known protocols, whose parts are described in several RFCMore importantly, penetration test is more challenging with an exploit writing phase!The second point is not really relevant since the implementation of FTP protocol does not seem to follow a specification that happens to be critical for the exploitation (RFC 959 p.30/31).Static analysisSince the binary is closed source, let's start by disassembling it. Thankfully, the binary is not stripped and most functions are labeled in either French or French/English mix. Looking at the main() function, we can see that local arguments and flags are handled using getopt() as shown in the following screenshot:french_symbolsLike any typical server, the binary starts by listening for incoming TCP connections. Once a connection has been established from a remote peer, the process gets fork()'ed and receive_commande() handles TCP payload sent by the client. That is, our main (remote) entry point:call to receive_commandereceive_commande() basically invokes two functions:TCP_RECV(): calls recv()analyse_commande(): dispatch the FTP command to the appropriate handlerLet's first analyze TCP_RECV(). Here is a simplified version: void* TCP_RECV(int mode) { int fd; int cur; if (mode == 2) { // load "more data" (e.g. partial file upload) cur = lit_parm->buf_lg; fd = sock_dtp; } else { [0] cur = 0; fd = sock_dcp; // incomming connection socket } [1] lit_parm->buf_lg = recv(fd, &lit_parm->buf[cur], lit_parm->max_len - cur, 0); if (lit_parm->buf_lg > 0) { if (mode == 1) { if (strf == 2) { [2] lit_parm->buf_lg -= 2; } else { // ... } } else { // ... } } // ... } In other words, it fills the following struct lit_parm_t structure:struct lit_parm_t { char* buf; // pointer to user supplied data int buf_lg; // length returned by recv() minus 2 // ... int max_len; // max buffer length } In particular, lit_parm->buf holds the whole read from the client with recv()[1], where cur == 0 ([0]).One might notice a very "curious" operation in [2]. Yes, the lit_parm->buf_lg is decremented by 2. Honestly, I don't know why this statement exists but it actually leads to a bug (more on this later).lit_parm itself is a global variable pointing to data allocated on the heap in init() (invoked at start up before fork()):void init() { // ... input_net = malloc(130976); // ... lit_parm = calloc(1uLL, 32uLL); lit_parm->buf = input_net; lit_parm->buf_lg = 130976; lit_parm->max_len = 130976; // ... } In turn, input_net is also a global variable pointing to the heap. One might notice, that "130976" looks like a MAX_INPUT_SIZE for the buffer.Once the data has been received with TCP_RECV(), receive_commande() invokes analyse_commande() which is the main command dispatcher. analyse_commande() distinguishes two sets of commands:pre-authentication: HELP, STAT, USER/PASS, ALLOpost-authentication: all the other commandsFrom an attack surface point of view, we either need to find a vulnerability in the pre-authentication commands or find a post-authentication bypass and then a vulnerability in the post-authentication commands. In the latter case, we would need "two vulnerabilities". That looks like more "work" and having pre-auth bug is sexier!After a rough look at the different pre-auth commands, the focus has been set on the ALLO command.ALLO command handlerThe ALLO command (for ALLOcate) is a command that can be called in pre-authentication mode. It is used to allocate a sufficient space prior to a file upload. Typically, the next command shall be STOR for instance.As the RFC959 stands, the expected grammar is:ALLO <SP> <decimal-integer> [<SP> R <SP> <decimal-integer>] <CRLF> Once data has been received in TCP_RECV() (hence both lit_parm->buf and lit_parm->buf_lg have been filled), the ALLO command handler (invoked from analyze_commande()) tries to do the following:Find the length of <decimal-integer> (character-wise)If <decimal-integer> is actually a number, copy user-provided data (i.e. <decimal-integer>) into the rem_file bufferLet's check the implementation: int i; // find the number of characters of "<decimal-integer>" (stop at first space or ends of data) [0] for (i = 0; lit_parm->buf_lg - 5 > i && lit_parm->buf[5 + i] != ' '; ++i) { } [1] if (verif_num(i, (*lit_parm->buf + 5))) { if (lit_parm->buf_lg - 5 < i) copy_len = i - 1; else copy_len = i; [2] memcpy(rem_file, (*lit_parm->buf + 5), copy_len); rem_file[copy_len] = 0; // ... In order to make things simpler, let's call the string located at 5 bytes past lit_parm->buf: PAYLOAD.So, the variable i is set to the length of PAYLOAD in [0]. Then, there is a check that PAYLOAD is only composed of digits with verif_num() in [1]. Finally, the buffer rem_file is filled with PAYLOAD of size copy_len in [2].One might immediately notice that there is no "length checks" during the memcpy() in [2]. It is filled with user-controlled data (PAYLOAD) of size copy_len into rem_file. The global variable rem_file itself is stored in the .bss as a 256 bytes character array.In other words, passing the following commands leads to a buffer overflow in the .bss:ALLO 111...<252 times>...111111 ^ start overflowing on the next variable in the .bss At this point, the only "restriction" on PAYLOAD, is that it must only contain digits as enforced by verif_num(). The latter returns true if PAYLOAD is only composed of digits OR if i is zero.This could look like the "big win" here yet "big win" does not equal "quick win" :-).In fact, being restricted to "digit only" characters leads to harder exploitation. In the next section, we will show how to bypass this restriction and overflow the rem_file buffer with almost arbitrary data.Bypassing verif_num()In the previous section, we saw that we can trigger a buffer overflow on the .bss but it came with a limitation: our PAYLOAD was restricted to digit characters.The ImplementationFirst, let's have a look at the verif_num() implementation:bool verif_num(int ctr, char *test_char) { int i; for (i = 0; i < ctr && isdigit(test_char[i]); ++i) { } return i == ctr; } In order to pass the check, the string test_char must be composed of digits characters up to ctr characters.Furthermore, if ctr is set to zero, verif_num() will always return true.Back to the ALLO handler code, we saw that verif_num()'s ctr parameter was invoked using the i variables computed here:for (i = 0; lit_parm->buf_lg - 5 > i && lit_parm->buf[5 + i] != ' '; ++i) { } and called here:if (verif_num(i, (lit_parm->buf + 5))) { ... } Basic Test CasesAlright, let's analyze this part with some practical data. Here are our test cases:| #case | lit_parm->buf | lit_parm->buf_lg | i | verif_num() | copy_len | comment | | ----- | ------------- | ---------------- | - | ----------- | -------- | ----------------------- | | 0 | 'ALLO ' | 5 | 0 | true | 0 | with one space | | 1 | 'ALLO a' | 6 | 0 | false | n/a | | | 2 | 'ALLO 1' | 7 | 0 | true | 0 | two spaces before digit | | 3 | 'ALLO a' | 7 | 0 | true | 0 | two spaces before char | | 4 | 'ALLO 1' | 6 | 1 | true | 1 | | | 5 | 'ALLO 1 ' | 7 | 1 | true | 1 | one space after | | 6 | 'ALLO 12' | 7 | 2 | true | 2 | | As we can see in case #0, #1, #4, #5 and #6, verif_num() behaves as expected, as well as the i value is correctly set. In turn, copy_len equals i.However, looking at case #2 and #3, where two spaces are inserted after the ALLO command, we see that i is always set to zero, thus verif_num() also returns true!That is, we reach the following code:[0] if (lit_parm->buf_lg - 5 < i) copy_len = i - 1; // <---- unreachable code ?! else copy_len = i; [1] memcpy(rem_file, lit_parm->buf + 5, copy_len); Back to the case #3, we see that our payload can be ALLO<sp><sp>a or ALLO<sp><sp>aaaaaaa... (two spaces). In other words, by using the "two spaces tricks" we can put some arbitrary data in PAYLOAD.Alas, in those cases, i is also set to zero, that is, copy_len is set to zero! An overflow of 0 bytes cannot be called as such!Instead, looking back to the line [0] in the previous snippet, it seems that this condition can never be true as lit_parm->buf_lg has a minimum value of 5... or... does it?Reconsidering the Test CasesRemember TCP_RECV() exposed earlier? Yes, there was a "curious line" after the call to recv(): lit_parm->buf_lg = recv(fd, &lit_parm->buf[cur], lit_parm->max_len - cur, 0); // ... lit_parm->buf_lg -= 2; // <---- what the hell ?! So yeah, our previous test cases are wrong, let's rewrite them!Back to the computation of i, we see that if lit_parm->buf_lg is lesser than 5, then i will always be set to zero (it does not iterate in the for loop). Hence, verif_num() always returns true as well!| #case | lit_parm->buf | lit_parm->buf_lg | i | verif_num() | copy_len | comment | | ----- | ------------- | ---------------- | - | ----------- | ---------- | ----------------------- | | 0 | 'ALLO ' | 3 | 0 | true | 0xffffffff | with one space | | 1 | 'ALLO a' | 4 | 0 | true | 0xffffffff | | | 2 | 'ALLO 1' | 5 | 0 | true | 0xffffffff | two spaces before digit | | 3 | 'ALLO a' | 5 | 0 | true | 0xffffffff | two spaces before char | | 4 | 'ALLO 1' | 4 | 0 | true | 0xffffffff | | | 5 | 'ALLO 1 ' | 5 | 0 | true | 0 | one space after | | 6 | 'ALLO 12' | 5 | 0 | true | 0 | | In other words, if our PAYLOAD has size of zero or one character (no matter what), copy_len is set to 0xffffffff.This is a INT UNDERFLOW baby, that leads to a huge memcpy() on the .bss!We might benefit from it, yet it rises two issues:Overwrite 0xffffffff bytes starting from the .bss will certainly crash the processCan we actually control the data (i.e. the PAYLOAD) and not being limited to zero or one byte?Abusing Uninitialized MemoryBack to the memcpy() called in the ALLO command handler, we saw that we can trigger a huge buffer overflow on rem_file (located in the .bss section). The code is:memcpy(rem_file, lit_parm->buf + 5, copy_len); As a reminder, lit_parm->buf is set and only set in recv(), that is, user-controlled data:lit_parm->buf_lg = recv(fd, &lit_parm->buf[cur], lit_parm->max_len - cur, 0); One thing to note is that lit_parm->buf (initialized in init() before the fork()) is NEVER RESET between each recv() call! Let's exploit this behavior to overflow the rem_file buffer with arbitrary data.Basically, the exploitation strategy becomes:call <5 bytes><ARBITRARY_DATA>: will set the data in lit_parm->bufcall ALLO<space><0 or 1 arbitrary byte>: only overwrites the 5 or 6 first bytes of lit_parm->buf and leaves the rest of the buffer untouched.Of course, we can only control the data up to 130971 (130976 - 5) bytes. This is because of the lit_parm->max_len restriction.Looking at the memory layout of the process, this will overwrite the whole .bss section before hitting a NULL page and provoke a segfault!That's one issue solved! There is one more though: how to exploit the fact that the huge overflow (0xffffffff bytes) will provoke a segfault?Dealing with Huge OverflowGenerally, when a buffer overflow bug overwrites a very large portion of contiguous (virtual) memory, there is a "high probability" that it will provoke a page fault (trying to write to non-mapped memory and/or read-only pages). In those cases, the kernel emits a SIGSEGV signal to the process that is generally killed.However, looking at the init() function, we see that a lot of various signal handlers are set up: puts("init: ***** signals caught"); signal(1, 1); signal(2, sig_fin); signal(3, sig_fin); signal(4, sig_fin); signal(5, 1); signal(6, sig_fin); signal(8, sig_fin); signal(7, sig_fin); signal(11, sig_fin); // SIGSEGV signal(31, sig_fin); signal(13, 1); signal(14, 1); signal(15, sig_fin); signal(20, 1); signal(17, sig_chld); signal(21, 1); signal(22, 1); signal(29, 1); signal(10, sig_usr1); signal(12, sig_usr2); Therefore, the binary binds a signal handler for the SIGSEGV signal: sig_fin(). In other words, if our overflow provokes a SIGSEGV during the call to memcpy(), the execution flow is redirected to sig_fin().Leveraging Arbitrary write primitiveAs shown above, a signal handler is def'''
