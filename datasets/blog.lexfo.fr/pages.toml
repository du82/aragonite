title = "Lexfo's security blog - Obfuscated obfuscation"
full_description = '''IntroductionDuring a Red Team, we stumbled upon a device running Android. Next to the battery slot, a pin header providing access to a debug UART and an USB port were present. After improvising a custom USB cable by crimping bullet terminals since we didn't have access to a soldering iron, we gained access to the device through MTP:8-pin connectorA mouse had to be sacrificedUSB ConnectorImprovised USB CableUsing MTP, we could retrieve a configuration file containing only ASCII characters, however they didn't make sense. Best guess we had was it could be some Base64 with a custom charset randomly selected.Since we supposed these configuration files would only be obfuscated, we wanted to reverse engineer the application that can read them. Based on the name of a service displayed on the device, we knew what to search for on Google Play to find an APK that would use, and thus decode, such configuration files. As a matter of fact, the application is a Mobile Device Management.Obviously, the APK was all obfuscated. We quickly found the Java interface used for the decoding of the configuration:public interface AbstractC3001 { /* renamed from: ı */ String mo20891(String str) throws MissingDataForEncryptionException; } However, no implementation of this interface could be found in what we had. Obviously, the implementation must have been encrypted and dynamically loaded at runtime.Decompiling the APKDecrypting the Class LoaderAES KeyAES Shift Row matrixInput StreamGetting the Class Loader DexDecrypting the Protected ClassesIdentifying the Class Loader call to decrypt the Protected ClassesDecryption keyStream cipherInput StreamGetting the Protected Classes DexDecompiling the whole projectString obfuscationDeobfuscating the configuration fileBonusConclusionDecompiling the APKFirst, we need to decompile the APK. Jadx can work quite well to get some Java-esque output. Getting the smali for reference with Apktool is also a good idea.$ jadx --show-bad-code --deobf -d out/ target.apk $ apktool d target.apk One of the packages is heavily obfuscated in the application. In our case it is named p014o. The use of Dexguard can be recognized with its Class Manager (CM) that resolves class and method names at runtime. The prototype for the CM is basically String $$c(arg1, arg2, arg3). We can find it easily:$ grep -r 'private static String $$c(' out/sources/ out/sources/p014o/C2958.java: private static String $$c(int r7, short r8, short r9) { Now we need to find "strange" resources. Two resources at the root of the application folder have non-printable names that end in '-'. They also start with a Java reference and are followed by a high-entropy blob of data.$ ls out/resources/*- out/resources/ - 'out/resources/'$'\342\200\251'' '$'\342\200\251''-' $ strings -n 10 out/resources/*- java/io/Serializable java/io/Serializable- These resources are actually encrypted with custom versions of well-known cryptographic algorithms. One will be the Class Loader (CL), and the other one the Protected Classes. In order to decrypt the Protected Classes (PC), we first need to decrypt the Class Loader which will contain the key and some parameters for the Protected Classes decryption.In the CM (in our case: out/sources/p014o/C2958.java), there is a huge static initialization. This is where the Protected Classes will be decrypted and then loaded.Last time we checked, the Dexguard mode of operation was:load a resource as an InputStream;feed the result to a class inheriting from FilterInputStream to decrypt it;do some useless obfuscation to waste a few minutes of time from a reverser;feed the decrypted result to a ZipInputStream to get a DEX file;finally load the resulting DEX as a Resource using the loadDex method.So let's find what classes extend FilterInputStream using grep:$ grep -r 'extends FilterInputStream' out/sources/p014o/ out/sources/p014o/C1538.java:public class C1538 extends FilterInputStream { out/sources/p014o/C1489.java:public final class C1489 extends FilterInputStream { out/sources/p014o/C2081.java:public final class C2081 extends FilterInputStream { out/sources/p014o/C1207.java:public final class C1207 extends FilterInputStream { out/sources/p014o/C0991.java:public final class C0991 extends FilterInputStream { out/sources/p014o/C1742.java:public final class C1742 extends FilterInputStream { out/sources/p014o/C1209.java:public final class C1209 extends FilterInputStream { out/sources/p014o/C4315CoN.java:public final class C4315CoN extends FilterInputStream { The class in C1207 strongly resembles some fast AES implementation, as can be seen from its dependency C1210 with a static initializer computing AES lookup tables:static { byte[] bArr; int i; byte b = 1; byte b2 = 1; do { b = (byte) (((b & 128) != 0 ? 27 : 0) ^ ((b << 1) ^ b)); byte b3 = (byte) (b2 ^ (b2 << 1)); byte b4 = (byte) (b3 ^ (b3 << 2)); byte b5 = (byte) (b4 ^ (b4 << 4)); b2 = (byte) (b5 ^ ((b5 & 128) != 0 ? (byte) 9 : 0)); bArr = f1476; i = b & 255; int i2 = b2 & 255; bArr[i] = (byte) (((((b2 ^ 99) ^ ((i2 << 1) | (i2 >> 7))) ^ ((i2 << 2) | (i2 >> 6))) ^ ((i2 << 3) | (i2 >> 5))) ^ ((i2 >> 4) | (i2 << 4))); } while (i != 1); bArr[0] = 99; for (int i3 = 0; i3 < 256; i3++) { int i4 = f1476[i3] & 255; f1471[i4] = (byte) i3; int i5 = i3 << 1; if (i5 >= 256) { i5 ^= 283; } int i6 = i5 << 1; if (i6 >= 256) { i6 ^= 283; } int i7 = i6 << 1; if (i7 >= 256) { i7 ^= 283; } int i8 = i7 ^ i3; int i9 = ((i5 ^ (i6 ^ i7)) << 24) | (i8 << 16) | ((i8 ^ i6) << 8) | (i8 ^ i5); f1475[i4] = i9; f1470[i4] = (i9 >>> 8) | (i9 << 24); f1472[i4] = (i9 >>> 16) | (i9 << 16); f1474[i4] = (i9 << 8) | (i9 >>> 24); } f1473[0] = 16777216; int i10 = 1; for (int i11 = 1; i11 < 10; i11++) { i10 <<= 1; if (i10 >= 256) { i10 ^= 283; } f1473[i11] = i10 << 24; } } The class C1209 looks like a broken stream cipher loosely based on Mersenne twisters with 64-bits word size and two 4-words internal states, as can be deduced from its dependency class C1208:public final class C1208 { /* renamed from: ι */ static long[] m1400(int i, int i2) { long[] jArr = new long[4]; jArr[0] = (((long) i2) & 4294967295L) | ((((long) i) & 4294967295L) << 32); for (int i3 = 1; i3 < 4; i3++) { long j = jArr[i3 - 1]; jArr[i3] = ((j ^ (j >> 30)) * 1812433253) + ((long) i3); } return jArr; } } In the past, we also found TEA, XTEA and Blowfish.Because the encryption algorithm implemented in C1209 is severely broken, we could directly guess the missing bits of key that are present in the Class Loader and decrypt the Protected Classes. However, in some cases it is still necessary to decrypt the Class Loader to retrieve them. In order to cover all the cases we will do like if we couldn't directly decrypt the Protected Classes with the information we already have.Decrypting the Class LoaderIn order to decrypt the Class Loader, we have to find a reference to one of the two decryption algorithms implemented in C1209 and C1207. By looking into the CM (class C2958), we can find a call to the C1207 constructor:byte[] bArr3 = new byte[16]; bArr3[0] = -29; bArr3[1] = -87; bArr3[2] = -61; bArr3[3] = 81; bArr3[4] = -30; bArr3[5] = -71; bArr3[6] = -19; bArr3[7] = -31; bArr3[8] = 123; bArr3[9] = -74; bArr3[10] = 119; bArr3[11] = -37; bArr3[12] = -12; try { bArr3[13] = -75; bArr3[14] = 65; bArr3[15] = -104; byte[] bArr4 = (byte[]) bArr3.clone(); C1203.m1385(bArr4, f5121, f5116); inputStream = new C1207(inputStream2, 8, bArr4, C1210.m1404(518096760)); The first argument is an InputStream, we will take a look at it later. The second is actually the number of rounds, 8 instead of 10 for AES128; the third argument is the key, notice that it is modified by a call to C1203.m1385(). Finally, the last argument is the ShiftRow matrix that is obviously different than the one in normal AES. It is generated through a call to C1210.m1404(). The actual prototype would look like that:public C1207(InputStream inputStream, int numRound, byte[] aesKey, byte[][] shiftRowMatrix); AES KeyThe key can be easily identified in the code snippet above. Although, we need to take a look at C1203.m1385 to see how it is actually modified before it is used:/* renamed from: o.ĸӀ */ public class C1203 { /* renamed from: ɩ */ public static void m1385(byte[] bArr, byte b, long j) { for (int i = 0; i < bArr.length; i++) { if (((1 << i) & j) != 0) { bArr[i] = (byte) (bArr[i] ^ b); } } } } As we can see, a XOR operation with f5121 is applied for bytes whose index matches a bit set to 1 in f5116, LSB first.private static long f5116 = 2459692291946227616L; /* ... */ private static byte f5121 = -89; We can obtain the final key using a small C code:static uint8_t key[] = { -29, -87, -61, 81, -30, -71, -19, -31, 123, -74, 119, -37, -12, -75, 65, -104 }; uint8_t *modif_key(uint8_t* ikey, uint8_t m, uint64_t mask, size_t len) { int i; for (i = 0; i < len; i++) { if (((1 << i) & mask) != 0) { ikey[i] ^= m; } } return ikey; } The result is:Before: E3A9C351E2B9EDE17BB677DBF4B54198 After: E3A9C351E21EED46DC11D0DBF412413F AES Shift Row matrixNext, we need to compute the actual shift row matrix used. Normally the Shift Row operation for AES decryption uses this matrix:Matrix - originalLet's take a look at C1210.m1404:/* renamed from: ɩ */ public static byte[][] m1404(int i) { byte[][] bArr = new byte[4][]; for (int i2 = 0; i2 < 4; i2++) { int i3 = i >>> (i2 << 3); bArr[i2] = new byte[]{(byte) (i3 & 3), (byte) ((i3 >> 2) & 3), (byte) ((i3 >> 4) & 3), (byte) ((i3 >> 6) & 3)}; } return bArr; } It is called with 518096760, converting to base-4 (0132320120131320) and rearranging as done in the snippet above would give the following matrix:Matrix - intermediateNow let's take a look at the C1207 constructor. Although useless, there is another transformation applied to this matrix. This is useless because if we want to make things quick, based on what we already have we can simply compile the C1207 class with javac and call it with the arguments we already have computed. So, it doesn't add any value to the obfuscation. Anyway, here is the final transformation:/* renamed from: ι */ private static byte[][] m1399(byte[][] bArr) { byte[][] bArr2 = new byte[bArr.length][]; for (int i = 0; i < bArr.length; i++) { bArr2[i] = new byte[bArr[i].length]; for (int i2 = 0; i2 < bArr[i].length; i2++) { bArr2[i][bArr[i][i2]] = (byte) i2; } } return bArr2; } For each row, the cell values and their indices are exchanged, giving the final Shift Row matrix used:Matrix - finalInput StreamWe now have the algorithm to decrypt the Class Loader, which is a modified AES128 with 8-rounds and a custom Shift Row matrix, as well as the decryption key. We also know that the encrypted Class Loader is one of the two resource files with non-printable characters in their names.If we backtrack the InputStream argument, we obtain it after this call:i6 = 20; /* ... */ int length4 = bArr.length; int i90 = -i6; int i91 = (length4 & i90) + (length4 | i90); /* ... */ Object[] objArr22 = new Object[3]; objArr22[2] = Integer.valueOf(i91); objArr22[1] = Integer.valueOf(i6); objArr22[0] = bArr; short s30 = (short) 135; InputStream inputStream2 = (InputStream) Class.forName($$c((byte) f5118[35], s30, (short) ((s30 ^ 376) | (s30 & 376)))).getDeclaredConstructor(byte[].class, Integer.TYPE, Integer.TYPE).newInstance(objArr22); Note that the formula (a & b) + (a | b) is equivalent to a + b. While we could decrypt the class name by reimplementing the $$c method, it seems quite obvious that the constructor is simply:ByteArrayInputStream(byte[] buf, int offset, int length); The offset is 20 and the length is the whole buffer length minus 20. Since the resources we found started with java/io/Serializable which is 20 bytes long, it actually makes sense.We need to take a look at what operation is done to bArr before being used in the ByteArrayInputStream constructor. We have this code snippet above in the code:i6 = 20; i7 = 8664; str3 = str2; cls = null; while (true) { int i89 = ((i6 | 210) << 1) - (i6 ^ 210); try { byte b19 = bArr[((i6 | 4167) << 1) - (i6 ^ 4167)]; bArr[i89] = (byte) ((b19 ^ 9) + ((b19 & 9) << 1)); Note that the formulae ((a | b) << 1) - (a ^ b) and (a ^ b) + ((a & b) << 1) are equivalent to a + b. The code above can be reduced to:bArr[20 + 210] = bArr[20 + 4167] + 9; Getting the Class Loader DexThe resource files were 8708 and 4188 bytes long respectively. Since AES works on 16-bytes blocks, the best candidate is thus the file whose length is 8708 since it is 243 * 16 + 20.By replacing the 230th byte by the 4187th added with 9 (which gives 0x4 + 0x9 = 0x0d), we can finally decrypt the CL using the key 0xE3A9C351E21EED46DC11D0DBF412413F with a slightly modified version of the AES implementation to take into account the reduced round number and the custom Shift Row matrix. A diff based on the reference implementation of AES can be found in the annex.The decryption can be obtained using this C code, for example:int main(int argc, char **argv) { int fd, outfd, i; uint8_t buf[20], obuf[16]; uint32_t keyexp[4*9]; fd = open(argv[1], O_RDONLY); read(fd, buf, 20); outfd = open(argv[2], O_WRONLY | O_CREAT | O_TRUNC, S_IRUSR | S_IWUSR); modif_key(key, -89, 2459692291946227616ULL, 16); m1404(518096760); m1399(); rijndaelKeySetupDec(keyexp, 8, key, 128); while (read(fd, buf, 16) == 16) { rijndaelDecrypt(keyexp, 8, buf, obuf); write(outfd, obuf, 16); } close(outfd); } We can now obtain the JAR file in plaintext:$ gcc -o main main.c rijndael-alg-fst.c $ ./main encfile1 cl.jar KEY: E3A9C351E21EED46DC11D0DBF412413F ShifRow Matrix: 0, 3, 1, 2, 2, 1, 3, 0, 1, 0, 2, 3, 3, 2, 0, 1, And finally get the Dex file:$ unzip cl.jar Archive: cl.jar warning [cl.jar]: 22 extra bytes at beginning or within zip file (attempting to process anyway) inflating: classes.dex Decrypting the Protected ClassesWe can now feed this classes.dex to Jadx along with the one from the APK we are analyzing so that both are integrated:$ mv classes.dex classes2.dex $ unzip target.apk classes.dex Archive: target.apk inflating: classes.dex $ jadx --show-bad-code --deobf -d cl/ classes*.dex INFO - loading ... INFO - processing ... ERROR - finished with errors, count: 26 We now have the Class Loader decompiled with the renaming matching the other decompiled classes, thanks to Jadx. The classes have now all be renamed because of the deobfuscation flag given to Jadx. The Class Manager, formerly C2958 is now named C2274. The second decryption class identified, C1209 is now named C1081. The newly obtained Class Loader is named C2257.Identifying the Class Loader call to decrypt the Protected ClassesIf we go back to the Class Manager (now renamed C2274), there is one use of an InputStream object that we didn't investigate:clsArr7[0] = Class.forName($$c(b20, s31, (short) ((i94 & 415) | (i94 ^ 415)))); clsArr7[1] = Short.TYPE; clsArr7[2] = Integer.TYPE; clsArr7[3] = Integer.TYPE; inputStream = (InputStream) cls6.getMethod($$c8, clsArr7).invoke(obj25, objArr23); The argument objArr23 can be found some few lines above:O'''
