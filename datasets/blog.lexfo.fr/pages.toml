["https://blog.lexfo.fr/cve-2017-11176-linux-kernel-exploitation-part4.html"]
title = "Lexfo's security blog - CVE-2017-11176: A step-by-step Linux Kernel exploitation (part 4/4)"
full_description = '''IntroductionIn this final part, we will transform the arbitrary call primitive (cf. part 3) into arbitrary code execution in ring-0, repair the kernel and get the root credentials. It will emphasize a lot on x86-64 architecture-specific stuff.First, the core concept section focuses on another critical kernel structure (thread_info) and how it can be abused from an exploitation point of view (retrieve current, escape seccomp-based sandbox, gain arbitrary read/write). Next, we will see the virtual memory layout, the kernel thread stacks and how they are linked to the thread_info. Then we will see how linux implements the hash tables used by Netlink. This will help for kernel repair.Secondly, we will try to call a userland payload directly and see how we get blocked by a hardware protection mechanism (SMEP). We will do an extensive study of a page fault exception trace to get meaningful information and see various ways to defeat SMEP.Thirdly, we will extract gadgets from a kernel image and explain why we need to restrict the research to the .text section. With such gadgets, we will do a stack pivot and see how to deal with aliasing. With relaxed constraints on gadget, we will implement the ROP-chain that disables SMEP, restore the stack pointer and stack frame as well as jumping to userland code in a clean state.Fourth, we will do kernel reparation. While repairing the socket dangling pointer is pretty straightforward, repairing the netlink hash list is a bit more complex. Since the bucket lists are not circular and we lost track of some elements during the reallocation, we will use a trick and an information leak to repair them.Finally, we will do a short study about the exploit reliability (where it can fail) and build a danger map during various stages of the exploit. Then, we will see how to gain root rights.Table of ContentsCore Concepts #4Meeting Supervisor Mode Execution PreventionDefeating SMEP StrategiesFinding GadgetsStack PivotingDebugging the kernel with GDBThe ROP-ChainRepair the KernelReliabilityGetting rootConclusionGoing FurtherCore Concepts #4WARNING: A lot of concepts addressed here hold out-dated information due to a major overhaul started in the mid-2016's. For instance, some thread_info's fields have been moved into the thread_struct (i.e. embedded in task_struct). Still, understanding "what it was" can help you understand "what it is" right now. And again, a lot of systems run "old" kernel versions (i.e. < 4.8.x).First, we have a look at the critical thread_info structure and how it can be abused during an exploitation scenario (retrieving current, escaping seccomp, arbitrary read/write).Next, we will see how the virtual memory map is organized in a x86-64 environment. In particular, we will see why addressing translation is limited to 48-bits (instead of 64) as well as what a "canonical" address means.Then, we will focus on the kernel thread stack. Explaining where and when they are created as well as what they hold.Finally, we will focus on the netlink hash table data structure and the associated algorithm. Understanding them will help during kernel repair and improve the exploit reliability.The thread_info StructureJust like the struct task_struct, the struct thread_info structure is very important that one must understand in order to exploit bugs in the Linux kernel.This structure is architecture dependent. In the x86-64 case, the definition is:// [arch/x86/include/asm/thread_info.h] struct thread_info { struct task_struct *task; struct exec_domain *exec_domain; __u32 flags; __u32 status; __u32 cpu; int preempt_count; mm_segment_t addr_limit; struct restart_block restart_block; void __user *sysenter_return; #ifdef CONFIG_X86_32 unsigned long previous_esp; __u8 supervisor_stack[0]; #endif int uaccess_err; }; The most important fields being:task: pointer to the task_struct linked to this thread_info (cf. next section)flags: holds flags such as _TIF_NEED_RESCHED or _TIF_SECCOMP (cf. Escaping Seccomp-Based Sandbox)addr_limit: the "highest" userland virtual address from kernel point-of-view. Used in "software protection mechanism" (cf. Gaining Arbitrary Read/Write)Let's see how we can abuse each of those fields in an exploitation scenario.Using Kernel Thread Stack PointerIn general, if you've got access to a task_struct pointer, you can retrieve lots of other kernel structures by dereferencing pointers from it. For instance, we will use it in our case to find the address of the file descriptor table during kernel reparation.Since the task field points to the associated task_struct, retrieving current (remember Core Concept #1?) is a simple as:#define get_current() (current_thread_info()->task) The problem is: how to get the address of the current thread_info?Suppose that you have a pointer in the kernel "thread stack", you can retrieve the current thread_info pointer with:#define THREAD_SIZE (PAGE_SIZE << 2) #define current_thread_info(ptr) (_ptr & ~(THREAD_SIZE - 1)) struct thread_info *ti = current_thread_info(leaky_stack_ptr); The reason why this works is because the thread_info lives inside the kernel thread stack (see the "Kernel Stacks" section).On the other hand, if you have a pointer to a task_struct, you can retrieve the current thread_info with the stack field in task_struct.That is, if you have one of those pointers, you can retrieve each other structures:task_thread_thread_info.pngNote that the task_struct's stack field doesn't point to the top of the (kernel thread) stack but to the thread_info!Escaping Seccomp-Based SandboxContainers as well as sandboxed applications seem to be more and more widespread nowadays. Using a kernel exploit is sometimes the only way (or an easiest one) to actually escape them.The Linux kernel's seccomp is a facility which allows programs to restrict access to syscalls. The syscall can be either fully forbidden (invoking it is impossible) or partially forbidden (parameters are filtered). It is setup using BPF rules (a "program" compiled in the kernel) called seccomp filters.Once enabled, seccomp filters cannot be disabled by "normal" means. The API enforces it as there is no syscall for it.When a program using seccomp makes a system call, the kernel checks if the thread_info's flags has one of the _TIF_WORK_SYSCALL_ENTRY flags set (TIF_SECCOMP is one of them). If so, it follows the syscall_trace_enter() path. At the very beginning, the function secure_computing() is called:long syscall_trace_enter(struct pt_regs *regs) { long ret = 0; if (test_thread_flag(TIF_SINGLESTEP)) regs->flags |= X86_EFLAGS_TF; /* do the secure computing check first */ secure_computing(regs->orig_ax); // <----- "rax" holds the syscall number // ... } static inline void secure_computing(int this_syscall) { if (unlikely(test_thread_flag(TIF_SECCOMP))) // <----- check the flag again __secure_computing(this_syscall); } We will not explain what is going on with seccomp past this point. Long story short, if the syscall is forbidden, a SIGKILL signal will be delivered to the faulty process.The important thing is: clearing the TIF_SECCOMP flag of the current running thread (i.e. thread_info) is "enough" to disable seccomp checks.WARNING: This is only true for the "current" thread, forking/execve'ing from here will "re-enable" seccomp (see task_struct).Gaining Arbitrary Read/WriteNow let's check the addr_limit field of thread_info.If you look at various system call implementations, you will see that most of them call copy_from_user() at the very beginning to make a copy from userland data into kernel-land. Failing to do so can lead to time-of-check time-of-use (TOCTOU) bugs (e.g. change userland value after it has been checked).In the very same way, system call code must call copy_to_user() to copy a result from kernelland into userland data.long copy_from_user(void *to, const void __user * from, unsigned long n); long copy_to_user(void __user *to, const void *from, unsigned long n); NOTE: The __user macro does nothing, this is just a hint for kernel developers that this data is a pointer to userland memory. In addition, some tools like sparse can benefit from it.Both copy_from_user() and copy_to_user() are architecture dependent functions. On x86-64 architecture, they are implemented in arch/x86/lib/copy_user_64.S.NOTE: If you don't like reading assembly code, there is a generic architecture that can be found in include/asm-generic/*. It can help you to figure out what an architecture-dependent function is "supposed to do".The generic (i.e. not x86-64) code for copy_from_user() looks like this:// from [include/asm-generic/uaccess.h] static inline long copy_from_user(void *to, const void __user * from, unsigned long n) { might_sleep(); if (access_ok(VERIFY_READ, from, n)) return __copy_from_user(to, from, n); else return n; } The "software" access rights checks are performed in access_ok() while __copy_from_user() unconditionally copy n bytes from from to to. In other words, if you see a __copy_from_user() where parameters havn't been checked, there is a serious security vulnerability. Let's get back to the x86-64 architecture.Prior to executing the actual copy, the parameter marked with __user is checked against the addr_limit value of the current thread_info. If the range (from+n) is below addr_limit, the copy is performed, otherwise copy_from_user() returns a non-null value indicating an error.The addr_limit value is set and retrieved using the set_fs() and get_fs() macros respectively:#define get_fs() (current_thread_info()->addr_limit) #define set_fs(x) (current_thread_info()->addr_limit = (x)) For instance, when you do an execve() syscall, the kernel tries to find a proper "binary loader". Assuming the binary is an ELF, the load_elf_binary() function is invoked and it ends by calling the start_thread() function: // from [arch/x86/kernel/process_64.c] void start_thread(struct pt_regs *regs, unsigned long new_ip, unsigned long new_sp) { loadsegment(fs, 0); loadsegment(es, 0); loadsegment(ds, 0); load_gs_index(0); regs->ip = new_ip; regs->sp = new_sp; percpu_write(old_rsp, new_sp); regs->cs = __USER_CS; regs->ss = __USER_DS; regs->flags = 0x200; set_fs(USER_DS); // <----- /* * Free the old FP and other extended state */ free_thread_xstate(current); } The start_thread() function resets the current thread_info's addr_limit value to USER_DS which is defined here:#define MAKE_MM_SEG(s) ((mm_segment_t) { (s) }) #define TASK_SIZE_MAX ((1UL << 47) - PAGE_SIZE) #define USER_DS MAKE_MM_SEG(TASK_SIZE_MAX) That is, a userland address is valid if it is below 0x7ffffffff000 (used to be 0xc0000000 on 32-bits).As you might already guessed, overwriting the addr_limit value leads to arbitrary read/write primitive. Ideally, we want something that does:#define KERNEL_DS MAKE_MM_SEG(-1UL) // <----- 0xffffffffffffffff set_fs(KERNEL_DS); If we achieve to do this, we disable a software protection mechanism. Again, this is "software" only! The hardware protections are still on, accessing kernel memory directly from userland will provoke a page fault that will kill your exploit (SIGSEGV) because the running level is still CPL=3 (see the "page fault" section).Since, we want read/write kernel memory from userland, we can actually ask the kernel to do it for us through a syscall that calls copy_{to|from}_user() function while providing a kernel pointer in "__user" marked parameter.Final note about thread_infoAs you might notice by the three examples shown here, the thread_info structure is of utter importance in general as well as for exploitation scenarios. We showed that:While leaking a kernel thread stack pointer, we can retrieve a pointer to the current task_struct (hence lots of kernel data structures)By overwriting the flags field we can disable seccomp protection and eventually escape some sandboxesWe can gain an arbitrary read/write primitive by changing the value of the addr_limit fieldThose are just a sample of things you can do with thread_info. This is a small but critical structure.Virtual Memory MapIn the previous section, we saw that the "highest" valid userland address was:#define TASK_SIZE_MAX ((1UL << 47) - PAGE_SIZE) // == 0x00007ffffffff000 One might wonder where does this "47" comes from?In the early AMD64 architecture, designers thought that addressing 2^64 memory is somehow "too big" and force to add another level of page table (performance hit). For this reason, it has been decided that only the lowest 48-bits of an address should be used to translate a virtual address into a physical address.However, if the userland address space ranges from 0x0000000000000000 to 0x00007ffffffff000 what will the kernel address space ? The answer is: 0xffff800000000000 to 0xffffffffffffffff.That is, the bits [48:63] are:all cleared for user addressesall set for kernel addressesMore specifically, AMD imposed that those [48:63] are the same as the 47 bit. Otherwise, an exception is thrown. Addresses respecting this convention are called canonical form addresses. With such model, it is still possible to address 256TB of memory (half for user, half for kernel).The space between 0x00007ffffffff000 and 0xffff800000000000 are unused memory addresses (also called "non-canonical addresses"). That is, the virtual memory layout for a 64-bit process is:virtual_memory_map.pngThe above diagram is the "big picture". You can get a more precise virtual memory map in the Linux kernel documentation: Documentation/x86/x86_64/mm.txt.NOTE: The "guard hole" address range is needed by some hypervisor (e.g. Xen).In the end, when you see an address starting with "0xffff8*" or higher, you can be sure that it is a kernel one.Kernel Thread StacksIn Linux (x86-64 architecture), there are two kinds of kernel stacks:thread stacks: 16k-bytes stacks for every active threadspecialized stacks: a set of per-cpu stacks used in special operationsYou may want to read the Linux kernel documentation for additional/complementary information: Documentation/x86/x86_64/kernel-stacks.First, let's describe the thread stacks. When a new thread is created (i.e. a new task_struct), the kernel does a "fork-like" operation by calling copy_process(). The later allocates a new task_struct (remember, there is one task_struct per thread) and copies most of the parent's task_struct into the new one.However, depending on how the task is created, some resources can be either shared (e.g. memory is shared in a multithreaded application) or "copied" (e.g. the libc's data). In the later case, if the thread modified some data a new separated version is created: this is called copy-on-write (i.e. it impacts only the current thread and not every thread importing the libc).In other words, a process is never created "from scratch" but starts by being a copy of its parent process (be it init). The "differences" are fixed later on.Furthermore, there is some thread specific data, one of them being the kernel thread stack. During the creation/duplication process, dup_task_stru'''
