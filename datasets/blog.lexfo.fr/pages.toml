title = "Lexfo's security blog - Dridex Loader Analysis"
full_description = '''IntroductionDridex is an old banking Trojan that appeared in 2014 and is still very active today. This is mainly due to its evolution and its complex design/architecture based on proxy layers to hide the main command and control (C&C). This article is a detailed analysis of the Dridex loader found in the wild earlier this year (2021).The first part is about anti-debug bypass and string/API recovery and the second part is more focused on the loader functionality.Anti-debug - RtlAddVectoredExceptionHandlerAt the beginning of the Dridex loader code, a function is registered using the native API RtlAddVectoredExceptionHandler to handle all the exceptions raised by the "int 3" instructions placed everywhere in the loader:int_3This instruction is always followed by the "ret" instruction, preceded by push instructions and a function that takes two DWORDs. This function is actually a custom "GetProcAddress" API and int 3 is a trampoline to execute the previously resolved API via the registered exception handler.The handler checks if the Exception Code is EXCEPTION_BREAKPOINT and modifies the ESP register in the PCONTEXT structure accordingly for the next ret instruction to execute the real API:PCONTEXT_structTo get a better control flow graph and to avoid having your debugger break for each API, a small IDA script can be made to find and patch at runtime all the int 3; ret instructions by call eax:from idaapi import get_segm_by_name from idc import patch_byte, add_bpt, set_bpt_cond, BPT_EXEC, load_and_run_plugin import ida_search load_and_run_plugin("idapython", 3) def find_all_occurences(start, end, bin_str, flags): occurences = list() ea = start while ea <= end: occurence = ida_search.find_binary(ea, end, bin_str, 0, flags) ea = occurence + 1 occurences.append(occurence) return occurences[0:-1] def patch_binary(): segment = get_segm_by_name('.text') occurences = find_all_occurences(segment.start_ea, segment.end_ea, "CC C3", ida_search.SEARCH_DOWN) datas = [0xFF, 0xD0] for occurence in occurences: for i, byte in enumerate(datas): patch_byte(occurence + i, byte) return True APIsAs usual, all the API names are obfuscated and as mentioned earlier, addresses are resolved without using the classical GetProcAddress. Instead, loaded libraries are parsed and functions names are enumerated from the PE export directory header until the CRC32 of the name XORed with a hard-coded key match:Enumerates_exports_functionsBefore resolving the API, the loader checks if the module is loaded using the PEB and PEB_LDR_DATA structures:list_of_loaded_modulesOnce again, it uses a combination of CRC32 and XOR with the same hard-coded key to check the module name. If the module is not loaded, it enumerates DLLs in the Windows directory using the GetSystemWow64DirectoryW and FindFirstFileExW/FindNextFileW APIs and loads it using LdrLoadDLL:find_DLLsThe following Python script can be used to find which DLL and API are resolved:import json import zlib import sys # python3 resolve_api_hash.py 0x588AB3EA 0x649746EC # ntDLL.DLL -> NtProtectVirtualMemory lib_hash = sys.argv[1] func_hash = sys.argv[2] with open('exports.json', 'r') as f: # {"shell32.DLL": ["AppCompat_RunDLLW", "AssocCreateForClasses", ....} apis = json.loads(f.read()) xor_key = 0x38BA5C7B # To change xor_func_hash = xor_key ^ int(func_hash, 16) xor_lib_hash = xor_key ^ int(lib_hash, 16) for lib, funcs in apis.items(): crc = zlib.crc32(lib.upper().encode('utf-8')) if crc == xor_lib_hash: for func in funcs: crc = zlib.crc32(func.encode('utf-8')) if crc == xor_func_hash: print("%s -> %s" % (lib, func)) StringsStrings are decrypted using a function that takes 3 parameters (char *output, char *enc_strings, int string_index):decrypt_stringsThis function decrypts the enc_strings buffer using the RC4 algorithm with a key located in the first 0x28 bytes (in reverse order). Then the index selects the strings to return in the output: SOFTWARE/TrendMicro/Vizor\x00\\VizorUniclientLibrary.DLL\x00ProductPath\x00\x00The algorithm can be summed up to the following Python script:import sys from Crypto.Cipher import ARC4 filepath = sys.argv[1] with open(filepath, 'rb') as f: datas = f.read() rc4_key = datas[0:0x28] rc4_key = rc4_key[::-1] arc4 = ARC4.new(rc4_key) data = arc4.decrypt(datas[0x28:]) print(data) System informationVery early in the code, a function is in charge of gathering information about the infected system. This information is stored in a global structure and used when needed for other operations. Below are more details on the gathered information:Operating versionThe build number, the Windows version and the product type are collected through the GetVersionExW function:GetVersionExWProcess architectureThe current process architecture is obtained using IsWow64Process:IsWow64ProcessProcess privilegeThe Dridex loader checks his privilege level by comparing the current process token group SID to the local administrator SID (S-1-5-32-544). It uses the GetTokenInformation API with TokenGroups as Token Information:gettokeninformationFinally, Dridex allocates the local administrator SID using AllocateAndInitializeSid and compares it using EqualSid:AllocateAndInitializeSidUAC levelDridex checks in the registry SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System the values EnableLUA, ConsentPromptBehaviorAdmin, PromptOnSecureDesktop and attributes a level from 0 to 5 based on the results:Check_UACTokenElevationUsing OpenProcessToken and GetTokenInformation with the parameter TokenElevation, Dridex checks if the current process has elevated privileges:TokenElevationSessionIdDridex also gets the Terminal Services session ID associated with the current process:SessionIdProcess Integrity LevelSimilarly, Dridex get the process integrity level using GetTokenInformation with the parameter TokenIntegrityLevel, then attributes a level from 1 to 7 based on the results:Process Integrity LevelSystem InfoFinally, Dridex calls GetSystemInfo to get information on:Number of processors;Page size;Minimum application address;Maximum application address;Allocation granularity.GetSystemInfoFinal information structureAt the end of the function, we get the following structure:00000000 info_Struct struc ; (sizeof=0x30, mappedto_36) 00000000 major_plus_minor dd ? 00000004 buildnumber dd ? 00000008 dwMajorVersion db ? 00000009 dwMinorVersion db ? 0000000A ServicePackMajor db ? 0000000B x64_x32_bit db ? 0000000C productType dw ? 0000000E dwNumberOfProcessors dw ? 00000010 dwPageSize dd ? 00000014 lpMinimumApplicationAddress dd ? 00000018 lpMaximumApplicationAddress dd ? 0000001C dwAllocationGranularity dd ? 00000020 SessionId dd ? 00000024 UAC_level dd ? 00000028 SID_local_administrator db ? 00000029 TokenElevation db ? 0000002C RID_level dd ? 00000030 info_Struct ends C&C RequestsThe Dridex loader talks to its C&Cs to download the core module and the node list. The communication is encrypted using RC4 and the protocol used is HTTPS. Below is a more detailed explanation of how the function does this job. First, it takes a hash in its parameters that will later identify the request type:Make_CnC_RequestsBy parsing the .data section, it builds a structure with the bot ID and a list of hard-coded IPs:00000000: ff ff ff ff 01 00 00 00 00 00 00 00 00 00 00 00 ................ 00000010: 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 ................ 00000020: f3 73 10 57 [7f 27 00 00] 00 7a 01 [03][51 a9 e0 de] .s.W.'...z..Q... 00000030: [3d 0d][3e 4b a8 6a][2e 0f][52 a5 98 7f][3d 0d] d6 ec =.>K.j..R...=... Bot_Id: [7f 27 00 00] -> 10111IPs (0x03):[51 a9 e0 de][3d 0d] -> 81.169.224.222:3389[3e 4b a8 6a][2e 0f] -> 62.75.168.106:3886[52 a5 98 7f][3d 0d] -> 82.165.152.127:3389Generate_IPsThen, it starts building the requests to be sent to the C&Cs in binary format using previously gathered information. The request looks like this:00000000: [2b][58 58 58 58 58 58 58 58 58 58 5f 63 35 39 31 +XXXXXXXXXX_c591 00000010: 39 35 34 37 30 31 39 31 64 64 66 34 63 30 66 39 95470191ddf4c0f9 00000020: 65 35 34 65 33 33 30 34 36 33 38 36][32 63 33 38 e54e330463862c38 00000030: 61 39 66 30 30 38 64 61 63 39 61 36 63 64 37 39 a9f008dac9a6cd79 00000040: 38 36 66 62 39 66 65 64 66 62 62 32][00 6f][1d b0 86fb9fedfbb2.o.. 00000050: f0 11][01 1f 04 11][40] 00 00 [03 3f][49 6e 74 65 6c ......@...?Intel 00000060: ...skip... 00000390: 69 6e 67 20 70 61 74 68 3a 20] 00 00 [07 4e][41 4c ing path: ...NAL 000003a0: ....skip.. 00000ae0: 72 3d 43 3a 5c 57 69 6e 64 6f 77 73] r=C:\Windows From left to right, the fields are the following:len(unique_account);unique_account;unique_system_hash;bot_id;sys_info;command;process_arch;len(process_installed);process_installed;len(envs);envs.The unique_account field is the concatenation of the Computer Name and the MD5 hash of the following expression: md5(computer_name + user_name + \x00 + \x00\x00 + installdate + \x00\x00).The unique_system_hash is also an MD5 hash: md5(serial volume + install date + arch + \x00\x00).The sys_info field is built using the following code:sys_info_field In this example, [1d b0] (7600) is the Windows build number, [f0] is a bit field that depends on the current product types, process architecture, UAC flag and Administrator rights. [11] indicates the Windows version ((majorversion << 4 - 0x50) + minorversion).The command field is the command name CRC32 code (e.g. "bot" == 0x11041f01) and it is given as a parameter. The following commands were found in the loader:0x11041f01 -> ("bot");0x18F8C844 -> ("list");0x745A17F5 -> ("mod9" -> TrendMicro Exclusion vulnerability);0xD3EF7577 -> ("dmod5" -> DllLoaded);0x69BE7CEE -> ("dmod6" -> DllStarted);0x32DC1DF8 -> ("dmod11" -> StartedInHi).The process_installed field is extracted from the following registry: HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\UninstallThe envs field is generated using the GetEnvironmentStringsW API.Before sending the request, the payload is encrypted using RC4 (the key comes from the recovered strings) and prepended by its CRC32 code:RC4_keyThe request is sent in a POST message using the WinINet library (InternetOpenA, InternetConnectW, HttpOpenRequestW, HttpSendRequestW):POST_methodsThe answer is read by calling the InternetReadFile function and if the response code is 200 or 404, the content is decrypted using RC4 with the same RC4 key as for encrypting the payload:rc4_decrypt_rep_contentThe response always starts with a CRC32 code of the content, followed by the content itself, which is RC4-encrypted with the same key as for sending the command.Bot commandOnce decrypted, the "bot" command response reveals an RSA signature (0x80 bytes long) and the Dridex "core" DLL at offset 0x80:00000000: 921c 0824 eef2 954a a522 5014 0384 e394 ...$...J."P..... 00000010: b053 b2ce a5fd aeef 6796 bd1c 5edd 764d .S......g...^.vM 00000020: 2c28 ea58 7e40 2132 8389 5259 333b 9d80 ,(.X~@!2..RY3;.. 00000030: bcfa 5af5 9eeb 0ac0 22c8 e079 1510 b48e ..Z....."..y.... 00000040: d53c e43f b9d7 19ea 23a9 8e2e 4f9f 0397 .<.?....#...O... 00000050: c3a5 d586 f1b0 864b 5b2e 03e7 3750 b371 .......K[...7P.q 00000060: 3e42 f62b f1da f555 954e 4bee fae7 823c >B.+...U.NK....< 00000070: 2a7a 812c ba90 cfba bf0a 8965 2a5c 122d *z.,.......e*\.- 00000080: 4d5a 9000 0300 0000 0400 0000 ffff 0000 MZ.............. 00000090: b800 0000 0000 0000 4000 0000 0000 0000 ........@....... 000000a0: 0000 0000 0000 0000 0000 0000 0000 0000 ................ 000000b0: 0000 0000 0000 0000 0000 0000 8401 0000 ................ 000000c0: 0e1f ba0e 00b4 09cd 21b8 014c cd21 5468 ........!..L.!Th 000000d0: 6973 2070 726f 6772 616d 2063 616e 6e6f is program canno 000000e0: 7420 6265 2072 756e 2069 6e20 444f 5320 t be run in DOS 000000f0: 6d6f 6465 2e0d 0d0a 2400 0000 0000 0000 mode....$....... 00000100: d006 fb75 9467 9526 9467 9526 9467 9526 ...u.g.&.g.&.g.& 00000110: 9935 4826 2567 9526 21f9 4b26 da66 9526 .5H&%g.&!.K&.f.& 00000120: f289 5926 e667 9526 0f8c 5b26 6a66 9526 ..Y&.g.&..[&jf.& 00000130: .