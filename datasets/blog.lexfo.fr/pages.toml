title = "Lexfo's security blog - CVE-2017-11176: A step-by-step Linux Kernel exploitation (part 2/4)"
full_description = '''IntroductionThe previous article provided a detailed analysis of the CVE-2017-11176 bug (aka. "mq_notify: double sock_put()") as well as an attack scenario.We "forced" the trigger from kernel-land to validate the bug (with the help of System Tap), and built the first version of the exploit (which only reaches the vulnerable code).It exposed three requirements needed to trigger the bug (and how to satisfy them):Force netlink_attachskb() to return 1Unblock the exploit threadForce the second fget() call to return NULLIn this article, we will try to get rid of the System Tap script and satisfy those requirements using userland code only. By the end of the article, we will have a complete proof-of-concept code that triggers the bug reliably.Table of ContentsCore Concepts #2Unblocking the Main ThreadMaking fget() Fail on Second LoopLooping back to "retry" labelFinal Proof-Of-Concept CodeConclusionCore Concepts #2In this second "core concepts" section, the scheduler subsystem will be introduced. The first focus will be on task states and how a task transitions between various states. Note that the actual scheduler algorithm (Completely Fair Scheduler) will not be discussed here.It emphasizes the wait queues as they will be used in this article to unblock a thread, and during the exploit to gain an arbitrary call primitive (cf. part 3).Task StateThe running state of a task is stored in the state field of a task_struct. A task is basically in one of those states (there are more):Running: the process is either running or waiting to be run on a cpuWaiting: the process is waiting/sleeping for an event/resource.A "running" task (TASK_RUNNING) is a task that belongs to a run queue. It can either be running on a cpu (right now) or in a near future (if elected by the scheduler).A "waiting" task is not running on any CPU. It can be woken up with the help of wait queues or signals. The most common state for waiting tasks is TASK_INTERRUPTIBLE (i.e. "sleeping" can be interrupted).The various task states are defined here:// [include/linux/sched.h] #define TASK_RUNNING 0 #define TASK_INTERRUPTIBLE 1 // ... cut (other states) ... The state field can be manipulated directly or through the __set_current_state() helper which uses the "current" macro:// [include/linux/sched.h] #define __set_current_state(state_value) \ do { current->state = (state_value); } while (0) Run QueuesThe struct rq (run queue) is one of the most important data structure for the scheduler. Every task that is in a run queue will be executed by a CPU. Every CPU has it own run queue (allowing true multi-tasking). It holds the list of tasks which are "electable" (by the scheduler) to run on a given CPU. It also has statistics used by the scheduler to make "fair" choices, and eventually rebalance the load between each cpu (i.e. cpu migration).// [kernel/sched.c] struct rq { unsigned long nr_running; // <----- statistics u64 nr_switches; // <----- statistics struct task_struct *curr; // <----- the current running task on the cpu // ... }; NOTE: With the "Completely Fair Scheduler (CFS)", the way the actual task list is stored is a bit complex but it does not matter here.To keep it simple, consider that a task moved out of any run queue will not be executed (i.e. there is no CPU to execute it). This is exactly what the deactivate_task() function does. On the contrary, activate_task() does the exact opposite (it moves task into a run queue).Blocking a task and the schedule() functionWhen a task wants to transition from a running state to a waiting state it has to do at least two things:Set its own running state to TASK_INTERRUPTIBLEInvoke deactivate_task() to move out of its run queueIn practice, no one calls deactivate_task() directly. Instead, schedule() is invoked (see below).The schedule() function is the main function of the scheduler. When schedule() is invoked, the next (running) task must be elected to run on the CPU. That is, the curr field of a run queue must be updated.However, if schedule() is called while the current task state is not running (i.e. its state is different from zero), and no signals are pending, it will call deactivate_task(): asmlinkage void __sched schedule(void) { struct task_struct *prev, *next; unsigned long *switch_count; struct rq *rq; int cpu; // ... cut ... prev = rq->curr; // <---- "prev" is the task running on the current CPU if (prev->state && !(preempt_count() & PREEMPT_ACTIVE)) { // <----- ignore the "preempt" stuff if (unlikely(signal_pending_state(prev->state, prev))) prev->state = TASK_RUNNING; else deactivate_task(rq, prev, DEQUEUE_SLEEP); // <----- task is moved out of run queue switch_count = &prev->nvcsw; } // ... cut (choose the next task) ... } In the end, a task can block by doing the following sequence:void make_it_block(void) { __set_current_state(TASK_INTERRUPTIBLE); schedule(); } The task will stay blocked until something else wakes it up.Wait QueuesWaiting for a resource or a special event is very common. For instance, if you run a server, the main thread might be waiting for incoming connections. Unless it is marked as "non blocking", the accept() syscall will block the main thread. That is, the main thread is stuck in kernel land until something else wakes it up.A wait queue is basically a doubly linked list of processes that are currently blocked (waiting). One might see it as the "opposite" of run queues. The queue itself is represented with wait_queue_head_t:// [include/linux/wait.h] typedef struct __wait_queue_head wait_queue_head_t; struct __wait_queue_head { spinlock_t lock; struct list_head task_list; }; NOTE: The struct list_head type is how Linux implements doubly linked list.Each element of the wait queue has the type wait_queue_t:// [include/linux.wait.h] typedef struct __wait_queue wait_queue_t; typedef int (*wait_queue_func_t)(wait_queue_t *wait, unsigned mode, int flags, void *key); struct __wait_queue { unsigned int flags; void *private; wait_queue_func_t func; // <----- we will get back to this struct list_head task_list; }; A wait queue element can be created with the DECLARE_WAITQUEUE() macro...// [include/linux/wait.h] #define __WAITQUEUE_INITIALIZER(name, tsk) { \ .private = tsk, \ .func = default_wake_function, \ .task_list = { NULL, NULL } } #define DECLARE_WAITQUEUE(name, tsk) \ wait_queue_t name = __WAITQUEUE_INITIALIZER(name, tsk) // <----- it creates a variable! ...which is invoked like this:DECLARE_WAITQUEUE(my_wait_queue_elt, current); // <----- use the "current" macro Finally, once a wait queue element is declared, it can be queued into a wait queue with the function add_wait_queue(). It basically just adds the element into the doubly linked list with proper locking (do not worry about it for now).// [kernel/wait.c] void add_wait_queue(wait_queue_head_t *q, wait_queue_t *wait) { unsigned long flags; wait->flags &= ~WQ_FLAG_EXCLUSIVE; spin_lock_irqsave(&q->lock, flags); __add_wait_queue(q, wait); // <----- here spin_unlock_irqrestore(&q->lock, flags); } static inline void __add_wait_queue(wait_queue_head_t *head, wait_queue_t *new) { list_add(&new->task_list, &head->task_list); } Invoking add_wait_queue() is also called "registering to a wait queue".Waking up a taskSo far, we know that there are two kinds of queues: run queues and wait queues. We saw that blocking a task is all about removing it from a run queue (with deactivate_task()). But how can it transition from the blocked (sleeping) state back to the running state?NOTE: Blocked task can be woken up through signals (and other means), but this is out-of-topic here.Since a blocked task is not running anymore, it can't wake up itself. This needs to be done from another task.Data structures which have the ownership of a particular resource have a wait queue. When a task wants to access this resource but it is not available at the moment, the task can put itself in a sleeping state until woken up by the resource's owner.In order to be woken up when the resource becomes available, it has to register to the resource's wait queue. As we saw earlier, this "registration" is made with the add_wait_queue() call.When the resource becomes available, the owner wakes one or more tasks so they can continue their executions. This is done with the __wake_up() function:// [kernel/sched.c] /** * __wake_up - wake up threads blocked on a waitqueue. * @q: the waitqueue * @mode: which threads * @nr_exclusive: how many wake-one or wake-many threads to wake up * @key: is directly passed to the wakeup function * * It may be assumed that this function implies a write memory barrier before * changing the task state if and only if any tasks are woken up. */ void __wake_up(wait_queue_head_t *q, unsigned int mode, int nr_exclusive, void *key) { unsigned long flags; spin_lock_irqsave(&q->lock, flags); __wake_up_common(q, mode, nr_exclusive, 0, key); // <----- here spin_unlock_irqrestore(&q->lock, flags); } // [kernel/sched.c] static void __wake_up_common(wait_queue_head_t *q, unsigned int mode, int nr_exclusive, int wake_flags, void *key) { wait_queue_t *curr, *next; [0] list_for_each_entry_safe(curr, next, &q->task_list, task_list) { unsigned flags = curr->flags; [1] if (curr->func(curr, mode, wake_flags, key) && (flags & WQ_FLAG_EXCLUSIVE) && !--nr_exclusive) break; } } This function iterates over every element in the wait queue [0] (list_for_each_entry_safe() is a common macro used with doubly linked list). For each element, it invokes the func() callback [1].Remember the DECLARE_WAITQUEUE() macro? It sets the func callback to default_wake_function():// [include/linux/wait.h] #define __WAITQUEUE_INITIALIZER(name, tsk) { \ .private = tsk, \ .func = default_wake_function, \ // <------ .task_list = { NULL, NULL } } #define DECLARE_WAITQUEUE(name, tsk) \ wait_queue_t name = __WAITQUEUE_INITIALIZER(name, tsk) In turn, the default_wake_function() just calls try_to_wake_up() using the private field of the wait queue element (which points to the sleeping's task_struct most of the time):int default_wake_function(wait_queue_t *curr, unsigned mode, int wake_flags, void *key) { return try_to_wake_up(curr->private, mode, wake_flags); } Finally, try_to_wake_up() is kind of the "opposite" of schedule(). While schedule() "schedules-out" the current task, try_to_wake_up() makes it schedulable again. That is, it puts it in a run queue and changes its running state!static int try_to_wake_up(struct task_struct *p, unsigned int state, int wake_flags) { struct rq *rq; // ... cut (find the appropriate run queue) ... out_activate: schedstat_inc(p, se.nr_wakeups); // <----- update some stats if (wake_flags & WF_SYNC) schedstat_inc(p, se.nr_wakeups_sync); if (orig_cpu != cpu) schedstat_inc(p, se.nr_wakeups_migrate); if (cpu == this_cpu) schedstat_inc(p, se.nr_wakeups_local); else schedstat_inc(p, se.nr_wakeups_remote); activate_task(rq, p, en_flags); // <----- put it back to run queue! success = 1; p->state = TASK_RUNNING; // <----- the state has changed! // ... cut ... } This is where activate_task() is invoked (there are other places). Because the task is now back in a run queue and its state is TASK_RUNNING, it has a chance of being scheduled. Hence, continue its execution where it was after the call to schedule().In practice, __wake_up() is rarely called directly. Instead, those helper macros are invoked:// [include/linux/wait.h] #define wake_up(x) __wake_up(x, TASK_NORMAL, 1, NULL) #define wake_up_nr(x, nr) __wake_up(x, TASK_NORMAL, nr, NULL) #define wake_up_all(x) __wake_up(x, TASK_NORMAL, 0, NULL) #define wake_up_interruptible(x) __wake_up(x, TASK_INTERRUPTIBLE, 1, NULL) #define wake_up_interruptible_nr(x, nr) __wake_up(x, TASK_INTERRUPTIBLE, nr, NULL) #define wake_up_interruptible_all(x) __wake_up(x, TASK_INTERRUPTIBLE, 0, NULL) A Complete ExampleHere is a simple example to summarize the aforementioned concepts:struct resource_a { bool resource_is_ready; wait_queue_head_t wq; }; void task_0_wants_resource_a(struct resource_a *res) { if (!res->resource_is_ready) { // "register" to be woken up DECLARE_WAITQUEUE(task0_wait_element, current); add_wait_queue(&res->wq, &task0_wait_element); // start sleeping __set_current_state(TASK_INTERRUPTIBLE); schedule(); // We'll restart HERE once woken up // Remember to "unregister" from wait queue } // XXX: ... do something with the resource ... } void task_1_makes_resource_available(struct resource_a *res) { res->resource_is_ready = true; wake_up_interruptible_all(&res->wq); // <--- unblock "task 0" } One thread runs the task_0_wants_resource_a() function which becomes blocking because the "resource" is not available. At some point, the resource owner makes it available (from another thread) and calls task_1_makes_resource_available(). After this, the execution of task_0_wants_resource_a() can resume.This is a pattern that you will often see in the Linux Kernel code, you now know what it means. Note that the term "resource" has been used here in a generic way. Tasks can wait for an event, a condition to be true or something else. Every time you see a "blocking" syscall, chances are a wait queue is not that far :-).Let's move on and start implementing the proof-of-concept.Unblocking the Main ThreadIn the previous article, we experimented several issues while trying to force netlink_attachskb() to return 1. The first issue was the call to mq_notify() that became blocking. In order to avoid this, we simply bypassed the call to schedule_timeout() but then, we created an infinite loop. We stopped the loop by removing our target file descriptor from the file descriptor table (FDT), which incidentally satisfied the last condition: it makes the second fget() call return NULL. This was done with the help of a System Tap script: function force_trigger:long (arg_sock:long) %{ struct sock *sk = (void*) STAP_ARG_arg_sock; [0] sk->sk_flags |= (1 << SOCK_DEAD); // avoid blocking the thread struct netlink_sock *nlk = (void*) sk; nlk->state |= 1; // enter the netlink_attachskb() retry path struct files_struct *files = current->files; struct fdtable *fdt = files_fdtable(files); fdt->fd[3] = NULL; // makes the second call to fget() fails %} In this section, we will try to remove the line [0] that sets the SOCK_DEAD flag of a struct sock. It means that the call of mq_notify() will become blocking again. From here, we have two possibilities:Mark the sock as SOCK_DEAD (as the stap script does)Unblock the threadControl (and win) the raceHaving our main thread blocked is actually a good thing. This is kind of a gift from an exploiter point-of-view. Remember that the patch described something about a "small window"? What was our attack scenario?Thread-1 | Thread-2 | file refcnt | sock refcnt | sock ptr | ------------------------------------+-----------------------+-------------+-------------+--------------------+ mq_notify() | | 1 | 1 | NULL | | | | | | fget(<TARGET_FD>) -> ok | | 2 (+1) | 1 | NULL | | | | | | netlink_getsockbyfilp() -> ok | | 2 | 2 (+1) | 0xfffff'''
