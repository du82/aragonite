["https://blog.llvm.org/posts/2022-01-07-moving-to-discourse"]
title = "Improving LLVM Infrastructure - Part 1: Mailing lists - The LLVM Project Blog"
description = "When the LLVM Project was open sourced in 2003, it was a small project with a small community. The tools selected to support the project were chosen during a different time and a different situation."
full_description = "Improving LLVM Infrastructure - Part 1: Mailing listsBy Tanya LattnerJan 7, 2022#community , #infrastructure , #foundation7 minute readWhen the LLVM Project was open sourced in 2003, it was a small project with a small community. The tools selected to support the project were chosen during a different time and a different situation.Now, almost 18 years later, the project has grown tremendously and those infrastructure choices are not necessarily the right choices today. According to a recent article, the LLVM community experienced record growth in 2021 with 1400 contributors to the LLVM Project. This is incredible growth! While there is a very real cost to change, it is clear that we need to invest in modernizing these tools to support the current and further growth of LLVM.Recently, the LLVM Project moved its source code repository and bug tracker to GitHub in an effort to grow the LLVM community and make contributing to the project easier. While these changes were neither quick or easy, the benefits to the project outweigh the time and efforts to make the move. The growth in contributors since the move to GitHub is just one metric showing the gains from the change.This year, the LLVM Foundation, which provides the majority of the LLVM Project infrastructure, will be spearheading the effort to evaluate and identify improvements for the remaining tools and software the project utilizes. We will be looking at mailing lists, chat servers, code review tools, and other parts of our infrastructure. This is part 1 in our blog post series describing the upcoming changes (if any) to LLVM infrastructure.Project Communication - Mailing ListsMailman and IRC have been the primary means of communication for the LLVM Project for the last 18 years. As the project has grown, we added mailing lists for subprojects like Clang, but the main list (llvm-dev) has remained unchanged. This list is meant to cover all of LLVM which includes everything from mid-level optimizations, to back-end optimizations, to the numerous LLVM backends. It has been the catchall for any topic not covered by another list. Due to the growth in LLVM and the size of the project, this list is very high traffic and requires a lot of work to filter messages that one may be interested in. It is increasingly clear that a mailing list may not be the best form of communication in the lack of features to make it easy to filter, respond and track topics of interest.In 2019, LLVM started to experiment with Discourse as an alternative to its mailing lists. Discourse is an open source discussion platform built with an amazing list of modern features, such as the following:Fully supported Email interface - Discourse supports the ability to interact through email if you do not like to use the web or app interfaces.Categories and subcategories - This breaks the LLVM project into smaller pieces and users can subscribe to topics that they care most about versus having to do their own filtering.Single Account Sign-On - Users can use their existing GitHub account to use Discourse and get access to all categories.Dynamic notifications - Immediately notifies users when they are tagged, get a new reply, or sends email when you are offline.Simple - Discourse uses a flat forum where replies are dynamically loaded and flow down the page in a line.Mobile support - App available for iOS and Android, but you can also just use the web interface.Better Moderation - The community has the ability to self moderate through flagging and spreads the work across a larger group of moderators.Enhanced spam blocking - Out of the box spam filtering that eliminates obvious spam before it gets to moderators.Safety - It has an enhanced trust system that allows the community to build natural immunity from trolls, bad actors, and spammers, and also reinforces positive behavior through likes and badges.The majority of the community was in favor of the move when the move to Discourse was discussed extensively on the LLVM mailing lists. This provides the features mentioned above in addition to a more modern communication. We did hear of one feature some would miss compared to Mailman: the ability to reply to someone directly through email. However, while it may not be ideal for some, we feel this is a worthwhile tradeoff to gain the other benefits, e.g. better safety for LLVM developers and users in general.Moving to DiscourseAs a consequence of the above discussion, we are planning to move most mailing lists to Discourse. We are excited that it will bring many new features to help improve communication for existing contributors and users, and also make the project more accessible to newcomers as most are familiar with using forums such as Discourse.However, while Discourse is a great solution for community discussions, it is not clear if it is a good place to host commit messages and post-commit review. Therefore, the commit lists won’t be part of the initial migration to Discourse - they will remain on mailing lists for now.The plan to move to Discourse will involve the following:January 7-9 - Re-configure the existing LLVM Discourse to the new category/subcategory structure (see below)January 10-20 (sometime during these 2 weeks) - The LLVM mailing list archives are migrated to Discourse and it is sanity checked by volunteers of the LLVM community. This sanity check can take a week or more.Feb 1 - The mailing lists (except commits) are put into read only mode and all users must migrate to use Discourse.Feb 1-4 (approx) - The final merge is done from Mailman to Discourse. We encourage all LLVM community members to start using Discourse on Jan 10th to minimize any disruption once the mailing lists become read only and the final messages are merged to Discourse. However, please be assured that all mail will be merged to Discourse and you will be able to continue any threads started there once that is completed.The mailman archives on the LLVM server may eventually be removed, but there is no final decision or deadline on this yet.Mapping from Mailing Lists to Discourse CategoriesThe existing LLVM Discourse will be modified to have the following categories/subcategories:AnnouncementsClang FrontendUsing ClangBuilding ClangStatic AnalyzerclangdSubprojectsLLD LinkerFlang Fortran FrontendLLDB DebuggerCode GenerationCommon InfrastructureAArch64ARMMipsPowerPCRISCVWebAssemblyX86OtherIR & OptimizationsLoop OptimizationsCommunityWomen in Compilers and ToolsJob PostingsUS Developer MeetingEuroLLVMGoogle Summer of CodeCommunity.oLLVM FoundationProject InfrastructureRelease TestersWebsiteDocumentationGitHubCode ReviewDiscordMailing Lists and ForumsIRCInfrastructure Working GroupPoliciesLLVM Dev List ArchivesRuntimesCC++OpenCLOpenMPSanitizersIncubatorCIRCTmlir-npcompMLIRAnnouncementsNewsletterTCP-WGThe Mailman archives will be mapped as follows:Mailing listscategory in DiscourseAll-commitsno migration at the momentBugs-adminno migration at the momentcfe-commitsno migration at the momentcfe-devClang Frontendcfe-usersClang Frontend/Using Clangclangd-devClang Frontend/clangddevmtg-organizersObsoleteDocsObsoleteeurollvm-organizersObsoleteflang-commitsno migration at the momentflang-devSubprojects/Flang Fortran FrontendgsocObsoletelibc-commitsno migration at the momentlibc-devRuntimes/CLibclc-devRuntimes/OpenCLlibcxx-bugsno migration at the momentlibcxx-commitsno migration at the momentlibcxx-devRuntimes/C++lldb-commitsno migration at the momentlldb-devSubprojects/lldbllvm-adminno migration at the momentllvm-announceAnnouncellvm-branch-commitsno migration at the momentllvm-bugsno migration at the momentllvm-commitsno migration at the momentllvm-devProject Infrastructure/LLVM Dev List Archivesllvm-devmeetingCommunity/US Developer Meetingllvm-foundationCommunity/LLVM FoundationMlir-commitsno migration at the momentOpenmp-commitsno migration at the momentOpenmp-devRuntimes/OpenMPParallel_libs-commitsno migration at the momentParallel_libs-devRuntimes/C++Release-testersProject Infrastructure/Release TestersTest-listObsoletevmkit-commitsObsoleteWiCTCommunity/Women in Compilers and Toolswww-scriptsObsoleteFor help with migrating to Discourse, please see the User Guide and discuss on the LLVM Discourse forums."
author = "Tanya Lattner"
year_published = 2022
year_updated = 2022
