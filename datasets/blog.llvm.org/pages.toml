full_description = '''LLVM @ "The Architecture of Open Source Applications"By Chris LattnerMay 29, 2011#meta , #optimizationOne minute readLLVM is featured in a chapter of the new book The Architecture of Open Source Applications. This chapter talks about the high-level design of LLVM, and how it differs from other contemporary compilers and JITs out there, why you might want to use it (if you're looking for compiler libraries), a simple example of writing an optimization, how the code is structured, a 10,000 foot view of how the code generator works, and some of the interesting capabilities LLVM has due to its design.Read more…C++ at Google: Here Be DragonsBy Chandler CarruthMay 23, 2011#C++ , #Clang6 minute readGoogle has one of the largest monolithic C++ codebases in the world. We have thousands of engineers working on millions of lines of C++ code every day. To help keep the entire thing running and all these engineers fast and productive we have had to build some unique C++ tools, centering around the Clang C++ compiler.Read more…What Every C Programmer Should Know About Undefined Behavior #3/3By Chris LattnerMay 21, 2011#optimization , #Clang13 minute readIn Part 1 of the series, we took a look at undefined behavior in C and showed some cases where it allows C to be more performant than "safe" languages.Read more…What Every C Programmer Should Know About Undefined Behavior #2/3By Chris LattnerMay 14, 2011#optimization , #Clang10 minute readIn Part 1 of our series, we discussed what undefined behavior is, and how it allows C and C++ compilers to produce higher performance applications than "safe" languages. This post talks about how "Read more…What Every C Programmer Should Know About Undefined Behavior #1/3By Chris LattnerMay 13, 2011#optimization , #Clang9 minute readPeople occasionally ask why LLVM-compiled code sometimes generates SIGTRAP signals when the optimizer is turned on. After digging in, they find that Clang generated a "ud2" instruction (assuming X86 code) - the same as is generated by __builtin_trap().Read more…Regular Expression CommandsBy Greg ClaytonApr 22, 2011#LLDB4 minute readGreetings LLDB users. I want to start writing regular blog posts for the new and cool features and things you can do in LLDB. Today I will start with one that was just added: regular expression commands.Read more…LLVM Developer Meeting 2010By Chris LattnerDec 23, 2010#meta , #devmtgOne minute readThe 2010 edition of the LLVM Developer's Meeting has come and gone, and it was a great event. It featured 17 great talks, several BOF sessions, and lots of informal discussions between all sorts of people interested in LLVM and its subprojects.Read more…LLVM in ClamAVBy Chris LattnerSep 7, 2010#llvm-usersOne minute readNew in version 0.96, the ClamAV antivirus system extends its internal bytecode interpreter to support an LLVM JIT compiler. This JIT compiler allows for improved execution speeds, but also provides the ability to write virus checks directly in C code.Read more…TCE project: Co-design of application-specific processors with LLVM-based compilation supportBy PekkaJun 29, 2010#vliw , #llvm-users , #tce , #asip , #eda , #tta10 minute readTTA-based Codesign Environment (TCE) is an application-specific instruction-set processor (ASIP) design toolset developed in Tampere University of Technology in several research projects since 2003. This blog post introduces the project and how LLVM is used in it to provide high-level language compiler support for the designed ASIPs.Read more…New "lldb" DebuggerBy Chris LattnerJun 8, 2010#LLDB , #new-in-llvm-2.8One minute readI'm happy to announce a great new subproject of LLVM: LLDB. LLDB is a modern debugger infrastructure which is built (like the rest of LLVM) as a series of modular and reusable libraries.Read more…«««2425262728»»»'''
