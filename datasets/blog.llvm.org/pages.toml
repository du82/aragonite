full_description = "GSoC 2024: Improve Clang DocBy Peter ChouDec 23, 2024#GSoC , #Clang-Doc7 minute readHi, my name is Peter, and this year I was involved in Google Summer of Code 2024. I worked on improving the Clang-Doc documenation generator Mentors: Petr Hosek and Paul KirthRead more…GSoC 2024: Adding LLVM and Clang plugin support for windowsBy Thomas FranshamDec 16, 2024#GSoC , #llvm.org5 minute readHello everyone! My name is Thomas and for GSOC I’ve been working on adding plugin support for LLVM and Clang to windows, which mainly involved implementing proper support for building LLVM and Clang as shared libraries (known as DLLs on Windows, dylibs on macOS, or DSOs/SOs on most other Unices) on Windows.Read more…Lightstorm: minimalistic Ruby compilerBy Alex Denisov, Amir RajanDec 9, 2024#llvm , #mlir , #ruby , #dragonruby7 minute readSome time ago I was talking about an ahead-of-time Ruby compiler. We started the project with certain goals and hypotheses in mind, and while the original compiler is at nearly 90% completion, there are still those other 90% that needs to be done.Read more…GSoC 2024: Out-Of-Process Execution For Clang-ReplBy Sahil PatidarNov 4, 2024#GSoC , #clang-repl , #orc-jit7 minute readHello! I’m Sahil Patidar, and this summer I had the exciting opportunity to participate in Google Summer of Code (GSoC) 2024. My project revolved around enhancing Clang-Repl by introducing Out-Of-Process Execution.Read more…GSoC 2024: The 1001 thresholds in LLVMBy Shourya GoelOct 21, 2024#GSoC , #Optimizations , #Performance4 minute readHey everyone! My name is Shourya and I worked on LLVM this summer through GSoC. My project is called The 1001 thresholds in LLVM. The main objective of this project was to study how varying different thresholds in llvm affect performance parameters like compile-time, bitcode-size, execution-time and llvm stats.Read more…GSoC 2024: 3-way comparison intrinsicsBy Volodymyr Vasylkun (Poseydon)Oct 7, 2024#GSoC , #optimization , #intrinsics4 minute readHello everyone! My name is Volodymyr, and in this post I would like to talk about the project I have been working on for the past couple of months as part of Google Summer of Code 2024.Read more…GSoC 2024: ABI Lowering in ClangIRBy Vinicius EspindolaSep 30, 2024#GSoC , #mlir , #clangir3 minute readClangIR is an ongoing effort to build a high-level intermediate representation (IR) for C/C++ within the LLVM ecosystem. Its key advantage lies in its ability to retain more source code information.Read more…GSoC 2024: Statistical Analysis of LLVM-IR CompilationBy Andrew KallaiSep 23, 2024#GSoC , #llvm-ir-dataset-utils , #ComPile , #analysis5 minute readWelcome! My name is Andrew and I contributed to LLVM through the 2024 Google Summer of Code Program. My project is called Statistical Analysis of LLVM-IR Compilation. The objective of this project is to provide an analysis of how time is spent in the optimization pipeline.Read more…GSoC 2024: Reviving NewGVNBy Manuel BritoSep 16, 2024#GSoC , #optimization6 minute readThis summer I participated in GSoC under the LLVM Compiler Infrastructure. The goal of the project was to improve the NewGVN pass so that it can replace GVN as the main value numbering pass in LLVM.Read more…GSoC 2024: Compile GPU kernels using ClangIRBy Zhi Ma (7mile)Sep 9, 2024#GSoC , #OpenCL , #ClangIR4 minute readHello everyone! I’m 7mile. My GSoC project this summer is Compile GPU kernels using ClangIR. It’s been an exciting journey in compiler development, and I’m thrilled to share the progress and insights gained along the way here.Read more…«««12345»»»"
