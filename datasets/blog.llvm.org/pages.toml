full_description = "apt.llvm.org - moving from physical server to the cloudBy Sylvestre LedruNov 2, 2021#infrastructure , #Compiler4 minute readIn this blog post, I would like to explain how I migrated apt.llvm.org from physical hardware hosted in a datacenter to the Google cloud. This has resulted in better security and faster builds for LLVM Debian/Ubuntu nightly builds.Read more…Generating relocatable code for ARM processorsBy Pavel LoktevOct 1, 2021#compiler17 minute readAbstract By upgrading the LLVM compiler, we solved the problem when neither LLVM nor the GCC could create the correct Position Independent Code for Cortex M controllers, with the code running in Flash memory rather than in RAM.Read more…Meet the LLVM Outreachy Interns!By Tanya LattnerJul 14, 2021#community , #women in compilers and tools , #outreachy6 minute readThe LLVM Project is participating in the Outreachy program for the first time. Two interns have been selected: Sushma Unnibhavi & Pooja Yadav. Outreachy provides paid, remote internships with the goal of increasing diversity in open source.Read more…Smaller debug info with constructor type homingBy Amy HuangApr 5, 2021#llvm5 minute readConstructor type homing for debug info Background Class type information is a large contributor to debug info size. Clang already has a few optimizations to reduce the size of class type information based on the assumption that debug info can be spread out over multiple compilation units.Read more…Women in Compilers and Tools Meetup SeriesBy Tanya LattnerMar 31, 2021#community , #women in compilers and tools4 minute readAs today is the last day of Women’s History Month, it seems fitting to announce a new meetup series for Women in Compilers and Tools. The LLVM Women in Compilers and Tools Meetup Series is a free virtual event held each month.Read more…The New Pass ManagerBy Arthur EubanksMar 26, 2021#llvm12 minute readLLVM’s New Pass Manager What is a pass manager? A pass manager schedules transformation passes and analyses to be run on IR in a specific order. Passes can run on an entire module, a single function, or something more abstract such as a strongly connected component (SCC) in a call graph or a loop inside of a function.Read more…Cling -- Beyond Just Interpreting C++By Vassil Vassilev, Wim Lavrijsen, Alexandru MilitaruMar 25, 2021#Cling12 minute readInteractive C++ with Cling In our previous blog post “Interactive C++ for Data Science” we described eval-style programming, interactive C++ in Notebooks and CUDA. This post will discuss some developed applications of Cling supporting interoperability and extensibility.Read more…LLVM meets Code Property GraphsBy Alex Denisov, Fabian YamaguchiFeb 23, 2021#llvm , #code property graph8 minute readThe code property graph (CPG) is a data structure designed to mine large codebases for instances of programming patterns via a domain-specific query language. It was first introduced in the proceedings of the IEEE Security and Privacy conference in 2014 (publication, PDF) in the context of vulnerability discovery in C system code and the Linux kernel in particular.Read more…Introducing Community.o and the Community.o SummitBy Tanya Lattner, Cyndy IshidaFeb 10, 2021#Community , #LLVM Foundation2 minute readThe LLVM Foundation is excited to announce Community.o! This is a new face to the LLVM Foundation’s Diversity and Inclusion and Women in Compilers and Tools program. We’ve adopted a name to represent what this program hopes to accomplish which is to build a strong, healthy, and diverse open source community.Read more…Bringing Stack Clash Protection to Clang / X86 — the Open Source WayBy Serge Guelton, Sylvestre Ledru, Josh StoneJan 30, 2021#Clang , #llvm8 minute readContext Stack clash is an attack that dates back to 2017, when the Qualys Research Team released an advisory with a joint blog post. It basically exploits large stack allocation (greater than PAGE_SIZE) that can lead to stack read/write not triggering the stack guard page allocated by the Linux Kernel.Read more…«««23456»»»"
