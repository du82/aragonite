full_description = "Interactive programming in C++ internships — LLVM Blog PostBy Sara BelleiDec 21, 2022#Compiler Research , #internships , #Google Summer of Code 2022 , #clang , #llvm , #Clang-Repl , #Incremental C++ , #JITLink , #Clad7 minute readAnother program year is ending and our Compiler Research team is extremely happy to share the hard work and the results of our interns contributors! The Compiler Research team includes researchers located at Princeton University and CERN.Read more…Office hours and the LLVM community calendar.By Kristof BeylsOct 27, 2022#office hours , #community calendar2 minute readAbout a thousand people contribute code to LLVM each year. There are probably many thousands who work on the LLVM code base in downstream projects. And even more people use the LLVM libraries to build other cool projects on top of.Read more…Announcing the LLVM Foundation Board of Directors for the 2022-2024 termBy Tanya LattnerOct 3, 2022#llvmdevmtg , #foundation6 minute readThe LLVM Foundation would like to announce our Board of Directors for the 2022-2024 term: Kit Barton (Secretary) Kristof Beyls Chris Bieneman Mike Edwards (Treasurer) Reid Kleckner Anton Korobeynikov Chris Lattner Tanya Lattner (President) Wei Wu Three new members and six continuing members were elected to the nine person board.Read more…Announcing the 2022 LLVM Developers' Meeting ProgramBy Tanya LattnerSep 30, 2022#llvmdevmtg , #foundation5 minute readWe had an amazing group of talk proposals submitted for the 2022 LLVM Developers’ Meeting. Thank you to all that submitted a talk proposal this year! Here is the 2022 LLVM Developers’ Meeting program:Read more…Text formatting in C++ using libc++By Mark de WeverSep 27, 2022#C++ , #libc++ , #std::format7 minute readHistorically formatting text in C++, using the standard library, has been unpleasant. It is possible to get nice output with the stream operators, but it is very verbose due to the stream manipulators.Read more…August 2022 LLVM relicensing update & further suggestions for helpBy Kristof BeylsAug 17, 2022#relicensing , #foundation5 minute readThe last update on LLVM relicensing was done about 8 months ago. Since then we’ve made substantial progress, so I thought it’s worthwhile to share another update. The TL;DR is:Read more…LLVM security group and 2021 security transparency reportBy Kristof BeylsJan 22, 2022#security2 minute readOver the past few years, the LLVM project has seen the creation of a security group, which aims to enable responsible disclosure and fixing of security-related issues affecting the LLVM project.Read more…New passes in clang-tidy to detect (some) Trojan SourceBy Serge GueltonJan 12, 2022#Clang3 minute readTrojan Source The original Trojan Source paper encompasses a family of attacks that rely on Unicode properties to make code look different from how a compiler processes it. For instance the following code taken from the paper:Read more…Improving LLVM Infrastructure - Part 1: Mailing listsBy Tanya LattnerJan 7, 2022#community , #infrastructure , #foundation7 minute readWhen the LLVM Project was open sourced in 2003, it was a small project with a small community. The tools selected to support the project were chosen during a different time and a different situation.Read more…LLVM relicensing update & call for helpBy Kristof BeylsNov 18, 2021#relicensing , #foundation8 minute readIn this blog post, I’d like to summarize the main points I talked about in the relicensing update presentation at the 2021 LLVM Developer’s meeting. The very short summary is that we are currently in the long tail phase of collecting relicensing agreements of past contributors.Read more…«««12345»»»"
