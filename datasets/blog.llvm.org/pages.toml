["https://blog.llvm.org/posts/2023-03-16-adding-new-llvm-jitlink-target-object-backend"]
title = "Adding a new target/object backend to LLVM JITLink - The LLVM Project Blog"
description = "Motivation For the last year, I have been contributing to LLVM JITLink. This post aims to doubly serve as a summary of my work and documentation for future contributors looking to add a new target/object backend to LLVM JITLink."
full_description = '''Adding a new target/object backend to LLVM JITLinkBy Kshitij JainMar 28, 2023#llvm , #JITLink , #linking , #relocations , #ELF , #i38632 minute readMotivationFor the last year, I have been contributing to LLVM JITLink. This post aims to doubly serve as a summary of my work and documentation for future contributors looking to add a new target/object backend to LLVM JITLink.We will start by establishing some background and definitions of relevant concepts. Then, we will talk about what the project actually entailed. Finally, we will go over the execution details of the project.The end goal of the project was to make LLVM JITLink capable of linking a 32-bit ELF object file, with i386 specific relocations, into a 32-bit process on the i386 hardware architecture.If the goal of the project already makes sense to you and you are looking to get started with adding a new target/object backend to LLVM JITLink yourself, you can skip to the “Recap and conveniences” section.BackgroundLinkingOur code often relies on external dependencies. For example, even a simple hello-world program written in C depends on the C stdlib for the printf function. These external dependencies are expressed as symbolic references, which I will henceforth refer to as just symbols. Symbols are names of data or functions that have unknown addresses and are resolved or fixed up during the linking process.In chronological order -The compiler converts source code to machine code.The assembler converts machine code to object files (ELF, MachO, COFF etc.)The linker links one or more object files (fixing up symbolic references along the way) and produces an executable or a shared library (also called shared object or dylib).For the purposes of this discussion we will focus on executables, but the points that will be made hold for shared objects as well.JIT linkingUnlike static linking, JIT (Just-in-time) linking is performed at runtime. While a static linker produces executables that are stored on disk, a JIT linker produces an in-memory image of the executable – essentially ready to execute bytes in memory. JIT linking a C program may feel very much like running a shell script. Under the hood though, the C program is linked into the memory of the invoking process, also commonly referred to as the executor process. The JIT linker patches up the executor process’ memory to account for the addresses of symbols at runtime, and executes necessary initializers.If you are familiar with dynamic loading then JIT linking may sound familiar, and the two have a lot in common, however they are not the same. JIT linking operates on relocatable objects (vs shared objects/dylibs for dynamic loading), and performs both the static linker’s and the dynamic loader’s jobs. Doing so allows the JIT linker to dead-strip redundant symbols, which dynamic loading cannot do, and this allows JIT linking to support finer grained compilation of languages that tend to produce a lot of redundant symbol definitions(e.g. C++).Need for JIT linkingJIT linking is primarily useful in the context of pre-compiled languages, such as C, C++, Rust etc. Why? At run time, these languages have no way1 to bring new symbol definitions into a running process’ memory and resolve references to them. Although dynamic loading partially solves this issue, it has its drawbacks (discussed above) and lags far behind the static linking experience.With JIT linking, at run time, symbolic references can be resolved to existing symbols (from the newly JIT’d code), or to newly JIT’d symbols (from the pre-compiled code). The below toy example shows what this looks like in code.// Let's assume we have the following, rather contrived, // C++ program that wants to add 2 numbers, but wants to use // an `add` function from a relocatable object file supplied by // the user. // // Let's also assume that the add function in the user-supplied // relocatable object will reference a symbol named `MAGIC` in its // definition. const int MAGIC = 42; int main(int argc, char* argv[]) { int a = 1; int b = 2; // Read the path of the user supplied relocatable object. string userSuppliedObjectPath = ...; // Initialize your JIT class that uses JIT linking under the hood. JIT J; // Add the relocatable object to your JIT. J.addObject(userSuppliedObjectPath); // Lookup the `add` function in the newly added JIT object. // Once all symbolic references within the user supplied object // are resolved, the content is fixed up and emitted to memory. // And we can then get a pointer to the `add` function. auto *add = (int(*)(int, int))J.lookup("add").getAddress(); // At this point the symbolic reference to `MAGIC` in add's // definition must have been resolved to the memory address // of the constant `MAGIC` that we defined in this program. // Run the add function found in the JIT module. int result = add(a, b); } That said, JIT linking by itself is not something that is very useful for an end user. JIT linking is an enabler for certain use-cases with pre-compiled languages (some use-cases exist for JIT-compiled languages as well2).JIT compilers (think of something like the JIT compilation component of the Java Hotspot VM, but for a statically compiled language)Debugger expression evaluators (such as the LLDB expression evaluator)REPLs (such as Cling and the currently experimental3 Clang-REPL)Standalone scripts (such as the Swift scripts, where the JIT linking is used to add an immediate mode to the compiler, which runs your code in-place via a JIT, rather than compiling it)Scriptable extensions (think about running JIT’d code in the context of some existing app, allowing the app to be extended by JIT’d code rather than precompiled plugins)While the above use cases may seem different, they are really the same — JIT linking enables linking code into existing processes (that may or may not already contain state/context), in an ABI-compatible way.LLVM JITLinkLLVM JITLink is a JIT linking implementation, in the form of a low-level library within the LLVM infrastructure. It powers LLVM’s ORC JIT APIs, which is what end-users would usually use for building runtime linking environments. It provides primitives for:Re-using existing compilers to generate relocatable objects at runtime.Allocating memory within a target executor process.Linking code into a target executor process in an ABI-compatible way.In simple words, a program Y, running in a process X, can hand JITLink a relocatable object file and JITLink will link the object file’s code into X’s memory and run it under X’s existing context (globals, functions etc.), as if it were part of a dynamic library loaded into process X4.The projectHaving set up all that background, let’s understand the main task and the end goal of the project.The task - Adding the i386(target)/ELF(object)backend to JITLinkWhat is a target?Target here, refers to a hardware architecture. i386 is a 32 bit x86 architecture.What is an object?Object here, refers to an object file format. ELF is the object format commonly used on Linux systems.Why do different target/object combinations matter and need additional work?Different target/object combinations matter, because each combination may use distinct methods for connecting symbolic references to symbol definitions. These methods are commonly referred to as relocations.The end goalThe end goal of the project was to make LLVM JITLink capable of linking a 32-bit ELF object file, with i386 specific relocations, into a 32-bit process on the i386 hardware architecture.ExecutionUnderstanding high level constructsLinkGraphThe LLVM JITLink documentation has an excellent description of LinkGraph. I recommend reading it after the below, high-level description of LinkGraph.LinkGraph is an internal representation of an object file within LLVM JITLink. While object formats may have different schemas and terminology for similar concepts, they all aim to represent machine code that can be relocated in virtual memory. The purpose of a LinkGraph is to provide a generic representation of these concepts and nuances across different object file formats.To draw conceptual analogies between the LinkGraph and an object format, let’s use ELF as an example. An ELF object contains:Sections - Any chunk of bytes that must be moved into memory as a unit.Symbols - A named chunk of bytes that could represent either data or executable instructions. Symbols occur as children of sections.Relocations - A description of how to fix up bytes within a section once the address of the relocation’s target symbol is resolved.A LinkGraph is capable of representing all of the above concepts. It first defines some building blocks.Addressable - Anything that can be assigned an address in the executor process’ virtual address space.Block - A chunk of bytes that is addressable and occurs as part of a section.On top of these building blocks, it defines the higher level object format concepts.Symbol - Equivalent of a symbol in the ELF format. Represented using an offset from the base (address) of a Block and a size in bytes.Section - Equivalent of a section in the ELF format. Represented using a collection of symbols and blocks.Edge - Equivalent of a relocation in the ELF format. Represented using an offset from the start of the containing block (indicating the storage location that needs to be fixed up), a pointer to the target whose address needs to be used for the fix-up and a kind to specify the patching formula.JITLinkContextJITLinkContext represents the target process that you’re linking into, and it provides the JIT linker with the ability to ask questions about and take actions within the process. This includes the ability to look up symbols and allocate memory, in the target process, as well as to publish the results of the linking process to the broader environment. Specifically, the JITLinkContext informs others of the addresses it has assigned to symbols and when those symbols become available in memory.Understanding the JIT linking algorithmThe LLVM JITLink linking algorithm happens in multiple phases, with each phase consisting of passes over the LinkGraph and a call to the next phase at the end. In each phase the algorithm modifies the LinkGraph as needed, by the end, producing a ready to execute in-memory image of the relocatable object that we started out with.Something that did not click for me initially, but simplified things significantly once it did, was the fact that the LinkGraph was just that, a graph! Re-reading LLVM JITLink’s high-level description of the generic JIT linking algorithm with this simple view of the LinkGraph made it much easier and intuitive to make sense of what was going on in the JIT linking process.The algorithm also provides, implementers and users of JITLink, hooks to tap into the linking process. These hooks can be used to achieve a number of things, including but not limited to, link-time optimizations, testing, validation etc.The tangiblesFirst, I set up a test loop to validate whether LLVM JITLink is able to link 32-bit i386 ELF objects, containing valid i386/ELF relocations, into a 32 bit process. The existing llvm-jitlink tool, which is built and put into the bin folder by default when you build the LLVM project, came in handy. llvm-jitlink is a command line wrapper for the JITLink library. It takes relocatable objects as input and links them into the executor process using JITLink.The tricky part here, at least for me, was to get a 32-bit llvm-jitlink ELF executable. By default, Clang produces executables for the host architecture because of which I had to understand cross-compilation5 (compiling for a target different from the host architecture) since I was developing on x86-64 hardware. In order to obtain a 32-bit llvm-jitlink ELF executable, on an x86-64 system, I needed the following -Cross-compiler - A cross-compiler that could generate 32 bit x86 code. Clang generates 32-bit x86 code if the following flags are specified in the build configuration:CMAKE_CXX_FLAGS="-m32" or CMAKE_C_FLAGS="-m32" - instructs Clang to generate 32-bit code instead of the default 64-bit code.LLVM_DEFAULT_TARGET_TRIPLE=X86 - instructs Clang to generate machine code for the x86 target by default.Target shared libraries - 32 bit x86 shared libraries, that might be checked against during compilation. In my case installing libstdc++.i686 and glibc-devel.i686 sufficed since that is all I needed to generate programs containing all possible i386/ELF relocations.The full command that I used to generate my build configuration was -cmake -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_C_FLAGS="-m32" \ -DCMAKE_CXX_COMPILER=<PATH_PREFIX>/bin/clang++ \ -DCMAKE_BUILD_TYPE=Debug \ // It is important that the `llvm-tblgen`executable is for the host architecture -DLLVM_TABLEGEN=<LLVM_BUILD_DIR_FOR_HOST_ARCH>/bin/llvm-tblgen \ -DLLVM_DEFAULT_TARGET_TRIPLE=i386-unknown-linux-gnu \ // Set of targets that the compiler must be able to generate code for. // Can save compilation time by omitting redundant target backends. -DLLVM_TARGETS_TO_BUILD=X86 \ -G "Ninja" ../llvm The last piece of my test loop was the plumbing in LLVM JITLink, on top of which I could start adding i386/ELF relocations. I added this plumbing as part of my first commit to LLVM JITLink. At a high level, there were 2 things that I implemented in that commit -ELFLinkGraphBuilder_i386 - contained specialized logic for parsing i386/ELF relocations from an object file.ELFJITLinker_i386 - contained specialized logic for fixing up i386/ELF relocations in the executable image supposed to be emitted to memory.Having set up a test loop, I incrementally added support for the following i386/ELF relocations to LLVM JITLink.Quick aside, before we talk about the individual relocations! Let’s recall what relocations are.The compiler generates code which contains symbolic references to actual symbols (everything other than local variables in a function and functions themselves). The compiler just refers to symbols by the names used by the programmer and leaves a set of TODOs for the linker to complete during linking.In ELF objects, these TODOs are found in the relocation section. They tell the linker where and how a symbolic reference needs to be fixed. The linker then, for the most part, follows the compiler’s instructions and resolves all the relocations in the program. The linker can resolve relocations because it has a view of the entire compiled program.R_386_32What - Tells the linker to replace the symbolic reference with the symbol’s absolute memory address.When - Used to reference global and static variables in non position-independent code (PIC). PIC allows code to be loaded at any address in memory, rather than at a fixed address.Code -// Compile with => clang -m32 -c -o obj.o obj.c // declare a global variable x int x; int main() { // Compiler should generate a R_386_32 relocation here. x += 1; return 0; } 00000000 <main>: 0: 55 push %ebp 1: 89 e5 mov %esp,%ebp 3: 50 pus'''
