full_description = "Instruction Relationship Framework in LLVMBy Jyotsna VermaMar 20, 2013#codegen , #MC9 minute readThe article provides an overview of the new Relationship framework of TableGen. This TableGen feature is used to describe user defined relationships between instructions. It was added to LLVM in October 2012.Read more…New Loop VectorizerBy Nadav RotemDec 7, 2012#optimization , #codegen , #new-in-llvm-3.35 minute readI would like to give a brief update regarding the development of the Loop Vectorizer. LLVM now has two vectorizers: The Loop Vectorizer, which operates on Loops, and the Basic Block Vectorizer, which optimizes straight-line code.Read more…LLVM Developer Meeting 2012By Chris LattnerDec 5, 2012#meta , #devmtgOne minute readThe 2012 LLVM Developer Meeting is now complete and was a great success. If you are interested in the talks, a complete set of slides, videos, and posters are now available.Read more…Life of an instruction in LLVMBy Eli BenderskyNov 28, 2012#codegen , #MC , #Clang , #SelectionDAG , #LLVM-IR12 minute readLLVM is a complex piece of software. There are several paths one may take on the quest of understanding how it works, none of which is simple. I recently had to dig in some areas of LLVM I was not previously familiar with, and this article is one of the outcomes of this quest.Read more…LLVM Developer Meeting 2011By Chris LattnerJan 3, 2012#meta , #devmtgOne minute readThe 2011 LLVM Devloper Meeting has come and gone, and it was a great event. It featured 17 great talks, several BOF sessions, a poster session, and lots of informal discussions between all sorts of people interested in LLVM and its subprojects.Read more…NVIDIA CUDA 4.1 Compiler Now Built on LLVMBy Chris LattnerDec 19, 2011#llvm-usersOne minute readFrom the NVIDIA CUDA compiler team: CUDA is a parallel programming model and platform created by NVIDIA for harnessing the power of hundreds of cores in modern graphics processing units (GPUs).Read more…LLVM 3.1 vector changesBy Nadav RotemDec 19, 2011#optimization , #LLVM-IR , #new-in-llvm-3.16 minute readIntel uses the Low-Level Virtual Machine (LLVM) in a number of products, including the Intel® OpenCL SDK. The SDK's implicit vectorization module generates LLVM-IR (intermediate representation) which uses vector types.Read more…LLVM 3.0 Exception Handling RedesignBy Bill WendlingNov 28, 2011#new-in-llvm-3.0 , #LLVM-IR6 minute readOne of the biggest IR changes in the LLVM 3.0 release is a redesign and reimplementation of the LLVM IR exception handling model. The old model, while it worked for most cases, fell over in some key situations, leading to obscure miscompilations, missed optimizations, and poor compile time.Read more…LLVM 3.0 Type System RewriteBy Chris LattnerNov 26, 2011#new-in-llvm-3.0 , #LLVM-IR13 minute readOne of the most pervasive IR (and thus compiler API) changes in LLVM 3.0 was a complete reimplementation of the LLVM IR type system. This change was long overdue (the original type system lasted from LLVM 1.Read more…Greedy Register Allocation in LLVM 3.0By Jakob Stoklund OlesenSep 18, 2011#optimization , #new-in-llvm-3.08 minute readLLVM has two new register allocators: Basic and Greedy. When LLVM 3.0 is released, the default optimizing register allocator will no longer be linear scan, but the new greedy register allocator.Read more…«««2324252627»»»"
