["https://blog.llvm.org/posts/2024-02-26-gsoc"]
title = "LLVM Google Summer of Code 2024 & 2023 - The LLVM Project Blog"
description = "The LLVM organization was accepted to participate in Google Summer of Code in 2024. Soon, prospective participants will begin submitting their project proposals, and mentors will review them to select those who will spend a significant amount of time this year contributing to various parts of LLVM."
full_description = "LLVM Google Summer of Code 2024 & 2023By Anton KorobeynikovMar 14, 2024#GSoC4 minute readThe LLVM organization was accepted to participate in Google Summer of Code in 2024. Soon, prospective participants will begin submitting their project proposals, and mentors will review them to select those who will spend a significant amount of time this year contributing to various parts of LLVM.But first, let’s look back and see what we had in 2023. The Google Summer of Code 2023 was very successful for the LLVM project. Overall, we received 54 proposals for 24 open projects. Out of this set of proposals, 20 projects were successfully completed and covered many different aspects of LLVM and its subprojects.ExtractAPI while building by Ankur Saini, mentored by Daniel GrumbergWebAssembly Support for clang-repl by Anubhab Ghosh, mentored by Vassil Vassilev and Alexander PenevModules Build Daemon: Build System Agnostic Support for Explicitly Built Modules by Connor Sughrue, mentored by Jan Svoboda, Michael Spencer[Interactive MLIR query tool to make exploring the IR easier] (https://summerofcode.withgoogle.com/archive/2023/projects/bdePp9VD) by Devajith Valaparambil Sreeramaswamy, mentored by Jacques PienaarImproving Compile Times by Dhruv Chawla, mentored by Nikita PopovAdding C++ Support to Clang’s ExtractAPI by Erick Velez, mentored by Daniel GrumbergOptimizing MLIR’s Presburger library by gilsaia, mentored by Kunwar GroverAdapting IR Load Semantics to Freeze All or Freeze Only Uninitialized Data by John McIver, mentored by Nuno LopesAddressing Rust optimization failures in LLVM by Kohei Asano, mentored by Nikita PopovTutorial development with clang-repl by Krishna Narayanan, mentored by Vassil VassilevFix Handling of Undefined Behavior in NewGVN by Manuel Brito, mentored by Nuno LopesMap LLVM values to corresponding source-level expressions by phyBrackets, mentored by Satish Guggilla and Karthik SenthilMachine Learning Guided Ordering of Compiler Optimization Passes by Puneeth A R, mentored by Tarindu Jayatilaka, Johannes Doerfert, and Mircea TrofinPatch based test coverage for quick test feedback by ShivamGupta123, mentored by Henrik OlssonRe-optimization using JITLink by Sunho Kim, mentored by Vassil Vassilev, Stefan Gränitz, and Lang HamesImprovements in Clang Diagnostics by Takuya Shimizu, mentored by Timm BäderBuild & Run SingleSource Benchmarks with ClangIR by Vinicius Espindola, mentored by Bruno Cardoso Lopes and Nathan LanzaBetter Performance Models for MLGO Training by Viraj Shah, mentored by Mircea Trofin, Aiden Grossman, and Ondrej SykoraEnhancing llvm-cov to Generate Hierarchical Coverage Reports by Yuhao Gu, mentored by Petr Hosek and Gulfem Savrun YeniceriAutocompletion in Clang-REPL by Yuquan Fu, mentored by Vassil VassilevSome projects also provided detailed end-of-project reports or project diaries that are outstanding on their own:Tutorial Development with Clang-ReplDiagnostic Improvements in Clang 17Improving Compile TimesAddressing Rust optimization failures in LLVMMap LLVM Values to corresponding source level expressionAnother step forward towards interactive programming - covers Autocompletion in Clang-REPL, WebAssembly Support for Clang-Repl, Re-optimization using JITLink and Tutorial development with clang-repl projects.GSoC 2024With a successful end to 2023, the LLVM Project is excited to participate in GSOC 2024. If you are interested in participating, here are some guidelines:1. Project ideasPlease take a look on list of projects at Open Projects page. Projects also have topics below on LLVM Discourse having #gsoc24 tag, so you can ask mentors about details of the project, skills required, etc.2. Way to submitting a proposalWe encourage you to discuss your proposal before submitting to GSoC system. Having your proposal discussed ensures that your proposal will be well aligned with the project. Please do not hijack other threads (e.g. with mentor Q&A) and create a separate new thread to discuss your proposal. The ideal proposal will contain:A descriptive titleInformation about you, including contact information. Please do not forget to include:Your prior compiler and compiler-related experience, if any (e.g. studies at the University, prior contributions)Whether you have any prior contributions to LLVM. If yes, please provide links to these contributions.Your past open source participation and contributions, if anyYour knowledge of programming languages (e.g. C, C++, Python, Rust, etc.) and your estimate of your level of experienceInformation about your proposed project. This should be fairly detailed and include a timeline.Information about other commitments that might affect your ability to work during the GSoC period (exams, classes, holidays, other jobs, weddings, etc.). Also, if the project allows both medium- and large-size participation, indicate the intended size of the project and the timeframe of your participation.3. Useful linksLLVM Contribution Guidelines LLVM Developer Policy GSoC channel on LLVM Discord Other documents LLVM Community Code of Conduct GSoC Contributor Guide Advice for People Applying for GSoC GSoC Program Website LLVM Office Hours4. DeadlinesSubmission to GSoC system opens on March 18th at 18:00 UTC.Submission to GSoC system ends on April 2nd at 18:00 UTC.Results to be announced on May 1st at 18:00 UTC.Welcome to the 20th Google Summer of Code!"
