["https://blog.llvm.org/posts/2021-03-31-womenincompilerstoolsmeetup"]
title = "Women in Compilers and Tools Meetup Series - The LLVM Project Blog"
description = """
As today is the last day of Women’s History Month, it seems fitting to announce a new meetup series for Women in Compilers and Tools.
The LLVM Women in Compilers and Tools Meetup Series is a free virtual event held each month."""
full_description = "Women in Compilers and Tools Meetup SeriesBy Tanya LattnerMar 31, 2021#community , #women in compilers and tools4 minute readAs today is the last day of Women’s History Month, it seems fitting to announce a new meetup series for Women in Compilers and Tools.The LLVM Women in Compilers and Tools Meetup Series is a free virtual event held each month. It is a platform where all women (trans, non-binary, and cis) in various stages in their career, speak openly, discuss, and network with others. This series will feature talks, tutorials, mentoring events and regularly highlights individuals for their contributions to the compiler, programming languages, and tools field and offers continued discussions concluding each event.This series is organized by The Women in Compilers and Tools (WiCT) Community.o group. This working group is composed of volunteers in the LLVM community and supported by the LLVM Foundation.In this series launch, we will be hearing from The Women in Compilers and Tools (WiCT) working group. This working group is composed of volunteers in the LLVM community who’ve put together this series. The WiCT working group will provide a Birds of a Feather style talk where attendees can learn more about the series and what to look forward to in the coming months! This will be a great opportunity to ask questions and network with LLVM community members and enthusiasts.The first meetup will occur on Thursday, April 22, 2021 at 6pm PDT and feature the following members of the WiCT working group:Anupama Chandrasekhar, NVIDIAAnupama is a Software Engineer at Nvidia working on graphics drivers, compilers, self driving cars and other cool technologies. Prior to this she was graphics software engineer at Intel working on the integrated GPU. Her prior work includes graphics/compute compiler development for GPUs, DX and Metal driver development and GPU performance. Her main interests are programming languages and compilers. She received her MS in Computer Science and Electrical Engineering from Pennsylvania State University and B.E in Electronics from Anna University, Chennai, India.Cyndy Ishida, AppleCyndy Ishida has been a Compiler Engineer at Apple, Inc. since 2019 concentrating on library support with Clang tooling. Prior to working at Apple, she completed internships at Virtu Financial, Microsoft and Facebook related to C++ development. Cyndy is relatively new to the LLVM community and began her involvement by contributing Mach-O Support to TextAPI, which serves as a condensed textual representation of dynamic libraries from a linking perspective. She is additionally a Board Member for the LLVM Foundation and aided in launching Community.o, The Foundation’s Diversity & Inclusion initiative and co-organized The Community.o Summit.Tanya Lattner, LLVM FoundationTanya Lattner is the President and Chief Executive Officer of the LLVM Foundation, a nonprofit supporting the open source software project LLVM (llvm.org). As CEO, Tanya designs programs to support the LLVM project through educational events such as developers conferences and workshops, student support through travel grants, community outreach, and increasing diversity within the project through the Community.o Program. She has a Bachelors of Science in Electrical Engineering from the University of Portland and a Masters Degree in Computer Science from the University of Illinois Urbana-Champaign. Tanya has over 10 years experience as a software engineer primarily focusing on compilers and related tools. She also has 5 patents from her work on code obfuscation, which use compiler techniques to prevent tampering or reverse engineering by hackers.Jubi Taneja, University of UtahJubi Taneja is a PhD candidate at the University of Utah. She will graduate and go on to work full-time with the Machine Learning Compiler group at Microsoft Research starting in the summer of 2021. Her research broadly focuses on compiler optimizations, correctness, and static analysis, with the goal of helping compiler developers use formal methods. She started her learning of compilers at IIT Bombay as an undergraduate research fellow. She earned her B.E. with a Gold Medal from Punjabi University, India. She is a SIGPLAN Long-Term Mentor for international PL researchers since summer 2020. She has been mentoring high school and undergraduate students from India for the past 10 years.If you are interested in attending, please register here."
