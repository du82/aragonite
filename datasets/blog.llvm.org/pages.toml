full_description = '''LLVM 3.3 Vectorization ImprovementsBy Nadav RotemMay 28, 2013#optimization , #new-in-llvm-3.34 minute readI would like to give a brief update regarding vectorization in LLVM. When LLVM 3.2 was released, it featured a new experimental loop vectorizer that was disabled by default. Since LLVM 3.Read more…EuroLLVM 2013, Paris, FranceBy rengolinMay 6, 2013#devmtg5 minute readTwo days after the end of EuroLLVM 2013, I finally got the energy to write a piece about it. It was a lot of hard work by an amazing team of volunteer organizers lead by Tobias Grosser, Duncan Sands, Sylvestre Ledru and Arnaud de Grandmaison, plus the usual suspects of the previous events, and in the end there was very little that had gone wrong, even in the slightest.Read more…Clang support for C++11 and beyondBy Richard SmithApr 21, 2013#C++ , #new-in-llvm-3.3 , #Clang4 minute readAs of r179861, Clang implements the entirety of the C++11 language standard. The following features have been implemented since the release of Clang 3.2, along with our plans for "Read more…Euro LLVM 2013 in ParisBy Ledru SylvestreApr 18, 2013#devmtg2 minute readIn two weeks, the 2013 edition of the Euro LLVM conference will start in historic center of Paris, France. The schedule has just been published. Most of different aspects of the LLVM infrastructure will present at the event.Read more…Status of the C++11 MigratorBy Edwin VaneApr 15, 2013#C++ , #Clang6 minute readSince the design document for cpp11-migrate, the C++11 migrator tool, was first proposed in early December 2012 development has been making steady progress. In this article I'll talk about what's been implemented in cpp11-migrate so far, what's coming up, and how you can get involved.Read more…Static analysis tools: using Clang in CppDependBy IssamApr 15, 2013#Clang , #Products3 minute readStatic analysis is a method of computer program debugging that is done by examining the code without executing the program. The process provides an understanding of the code structure, can help to ensure that the code adheres to industry standards, and can find bugs not easy to detect.Read more…LLVM Recipient of the 2012 ACM System Software AwardBy Chris LattnerApr 10, 2013#metaOne minute readThe ACM just announced that the LLVM project is the recipient of the 2012 ACM System Software Award. This award recognizes a "software system that has had a lasting influence, reflected in contributions to concepts, in commercial acceptance, or both.Read more…LLVM Debian/Ubuntu nightly packagesBy Ledru SylvestreApr 3, 2013#meta , #testing2 minute readIn order to facilitate testing and to improve the deployment of the LLVM toolchain, we are happy to publish LLVM Debian/Ubuntu nightly packages. Read on for information about how it works and what we're building.Read more…Testing libc++ with -fsanitize=undefinedBy Marshall ClowApr 1, 2013#sanitizer , #C++ , #Clang8 minute read[This article is re-posted in a slightly expanded form from Marshall's blog] After my last article, Testing libc++ with Address Sanitizer, I thought "what other tests can I run?" Address Sanitizer (ASan) is not the only "Read more…Testing libc++ with Address SanitizerBy Marshall ClowMar 28, 2013#sanitizer , #C++ , #Clang3 minute read[This article is re-posted in a slightly expanded form from Marshall's blog] I've been running the libc++ tests off and on for a while. It's a quite extensive test suite, but I wondered if there were any bugs that the test suite was not uncovering.Read more…«««2223242526»»»'''
