full_description = '''LLVM Numerics BlogBy Michael BergMar 15, 2019#numerics8 minute readKeywords: Numerics, Clang, LLVM-IR, : 2019 LLVM Developers' Meeting, LLVMDevMtg. The goal of this blog post is to start a discussion about numerics in LLVM – where we are, recent work and things that remain to be done.Read more…FOSDEM 2019 LLVM developer room reportBy Kristof BeylsMar 7, 2019#fosdem2 minute readAs well as at the LLVM developer meetings, the LLVM community is also present at a number of other events. One of those is FOSDEM, which has had a dedicated LLVM track since 2014.Read more…EuroLLVM'19 developers' meeting programBy Arnaud Allard de GrandmaisonFeb 11, 2019#devmtg , #eurollvm , #LLVM Foundation7 minute readThe LLVM Foundation is excited to announce the program for the EuroLLVM'19 developers' meeting (April 8 - 9 in Brussels / Belgium) ! Keynote MLIR: Multi-Level Intermediate Representation for Compiler Infrastructure Tatiana Shpeisman (Google), Chris Lattner (Google)Technical talksRead more…30% faster Windows builds with clang-cl and the new /Zc:dllexportInlines- flagBy Hans WennborgNov 14, 2018#Windows , #clang-cl5 minute readBackground In the course of adding Microsoft Visual C++ (MSVC) compatible Windows support to Clang, we worked hard to make sure the dllexport and dllimport declspecs are handled the same way by Clang as by MSVC.Read more…Integration of libc++ and OpenMP packages into llvm-toolchainBy Reshabh Sharma, Sylvestre LedruSep 25, 2018#apt , #libc++ , #OpenMP3 minute readA bit more than a year ago, we gave an update about recent changes in apt.llvm.org. Since then, we noticed an important increase of the usage of the service. Just last month, we saw more than 16.Read more…Announcing the new LLVM Foundation Board of DirectorsBy Tanya LattnerSep 18, 2018#LLVM Foundation7 minute readThe LLVM Foundation is pleased to announce its new Board of Directors: Chandler Carruth Mike Edwards (Treasurer) Hal Finkel Arnaud de Grandmaison Anton Korobeynikov Tanya Lattner (President) Chris Lattner John Regehr (Secretary) Tom Stellard Two new members and seven continuing members were elected to the nine person board.Read more…Announcing the program for the 2018 LLVM Developers' Meeting Bay AreaBy Tanya LattnerAug 31, 2018#devmtg4 minute readThe LLVM Foundation is excited to announce the program for the 2018 LLVM Developers' Meeting in San Jose, CA on October 17 & 18. As a reminder, ticket prices for the event will increase on September 17th.Read more…2018 LLVM Foundation's Women in Compilers and Tools WorkshopBy Tanya LattnerAug 23, 2018#women in compilers and tools3 minute readThe LLVM Foundation is excited to announce our first half day Women in Compilers and Tools Workshop held the day before the 2018 LLVM Developers’ Meeting - Bay Area. The workshop will be held at the Fairmont Hotel on October 16th from 1:00-6:30PM and includes a cocktail reception.Read more…DragonFFI: FFI/JIT for the C language using Clang/LLVMBy Adrien GuinetMar 13, 2018#Clang , #llvm15 minute readIntroductionA foreign function interface is "a mechanism by which a program written in one programming language can call routines or make use of services written in another". In the case of DragonFFI, we expose a library that allows calling C functions and using C structures from any languages.Read more…International Women's Day: Celebrating all the women in the LLVM Community!By Tanya LattnerMar 8, 2018#women in compilers and tools , #LLVM Foundation2 minute readToday is International Women's Day! To all the women in the LLVM community, thank you for all your contributions! The LLVM Foundation values diversity within the LLVM community and the field of compilers and tools.Read more…«««45678»»»'''
