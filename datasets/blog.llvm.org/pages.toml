full_description = '''LLVM receives first ever SIGPLAN Software Systems AwardBy TanyaJun 7, 2010#AwardOne minute readToday the ACM announced that Chris Lattner and the LLVM Project are the recipient of the Programming Languages Software Award. This award recognizes the impact that LLVM has had on the compiler research community, which can be seen in the large number of research publications using LLVM and the number of compiler courses that are using LLVM to teach compiler construction and optimization techniques.Read more…Clang++ Builds Boost!By Doug GregorMay 20, 2010#C++ , #Clang2 minute readBoost is a collection of open-source, peer-reviewed C++ libraries that's well-known for having many good utility components for C++ programmers. It's also well-known for using bleeding-edge C++ techniques, such as extensive template and preprocessor metaprogramming, that have pushed many C++ compilers beyond their breaking point.Read more…The Glasgow Haskell Compiler and LLVMBy David TereiMay 17, 2010#GHC , #llvm-users , #new-in-llvm-2.76 minute readIf you read the LLVM 2.7 release notes carefully you would have noticed that one of the new external users is the Glasgow Haskell Compiler (GHC). As the author of the LLVM backend for GHC, I have been invited to write a post detailing the design of the backend and my experiences with using LLVM.Read more…New "libc++" C++ Standard LibraryBy Chris LattnerMay 11, 2010#C++ , #ClangOne minute readI'm happy to announce a new subproject of LLVM: "libc++". libc++ is an implementation of the C++ Standard Library, with a focus on standards compliance, highly efficient generated code, and with an aim to support C++'0x when the standard is ratified.Read more…Extensible Metadata in LLVM IRBy Chris LattnerApr 14, 2010#optimization , #new-in-llvm-2.7 , #LLVM-IR11 minute readA common request by front-end authors is to be able to add some sort of metadata to LLVM IR. This metadata could be used to influence language-specific optimization passes (for example, Type Based Alias Analysis in C), tag information for a custom code generator, or pass through information to link time optimization.Read more…Intro to the LLVM MC ProjectBy Chris LattnerApr 9, 2010#MC16 minute readThe LLVM Machine Code (aka MC) sub-project of LLVM was created to solve a number of problems in the realm of assembly, disassembly, object file format handling, and a number of other related areas that CPU instruction-set level tools work in.Read more…ARM Advanced SIMD (NEON) Intrinsics and Types in LLVMBy Bob WilsonApr 7, 2010#ARM5 minute readLLVM now supports all the intrinsic functions defined by ARM for the Advanced SIMD (aka "NEON") instruction set, but if you are migrating from GCC to LLVM, there are some implementation differences that you may encounter.Read more…What's wrong with this code?By Daniel DunbarApr 7, 2010#KLEE2 minute readA user on IRC sent me this interesting KLEE example today, which I thought was cute enough I should post it. If you aren't familiar with it, KLEE is a tool for symbolic execution of LLVM code.Read more…Amazing feats of Clang Error RecoveryBy Chris LattnerApr 5, 2010#C++ , #Clang13 minute readIn addition to parsing and generating machine code for your source files when valid, a compiler frontend's job is also to detect invalid code and give you a hint that explains what is wrong so you can fix the problem.Read more…Dragonegg Successfully Self-Hosts!By Duncan SandsFeb 21, 2010#dragoneggOne minute readThe dragonegg GCC plugin can host itself! Dragonegg lets you use the LLVM optimizers with GCC-4.5, much like llvm-gcc, but unlike llvm-gcc does not involve modifying GCC, thanks to the new GCC plugin infrastructure (currently one small patch is required).Read more…«««2425262728»»»'''
