full_description = "Interactive C++ for Data ScienceBy Vassil Vassilev, David Lange, Simeon Ehrig, Sylvain CorlayDec 20, 2020#Cling8 minute readInteractive C++ for Data Science In our previous blog post “Interactive C++ with Cling” we mentioned that exploratory programming is an effective way to reduce the complexity of the problem. This post will discuss some applications of Cling developed to support data science researchers.Read more…Interactive C++ with ClingBy Vassil VassilevNov 30, 2020#Cling11 minute readInteractive C++ with Cling The C++ programming language is used for many numerically intensive scientific applications. A combination of performance and solid backward compatibility has led to its use for many research software codes over the past 20 years.Read more…The 2020 Virtual LLVM Developers' Meeting ProgramBy Tanya LattnerAug 23, 2020#LLVM Foundation5 minute readThe LLVM Foundation is excited to announce the 2020 Virtual LLVM Developers’ Meeting program! Registration will open this week. Keynote: Undef and Poison: Present and Future - J. Lee Technical Talks:Read more…Announcing the new LLVM Foundation BoardBy Tanya LattnerAug 21, 2020#LLVM Foundation Board7 minute readThe LLVM Foundation is pleased to announce its new Board of Directors, which includes: Kit Barton Kristof Beyls Mike Edwards (Treasurer) Hal Finkel Cyndy Ishida Anton Korobeynikov Tanya Lattner (President) Chris Lattner Tom Stellard (Secretary) Three new members and six continuing members were elected to the nine person board.Read more…The New Clang _ExtInt Feature Provides Exact Bitwidth Integer TypesBy Erich KeaneApr 21, 2020#Clang9 minute readAuthor: Erich Keane, Compiler Frontend Engineer, Intel Corporation Earlier this month I finally committed a patch to implement the extended-integer type class, _ExtInt after nearly two and a half years of design and implementation.Read more…Deterministic builds with clang and lldBy Nico WeberNov 7, 2019#lld , #Clang15 minute readDeterministic builds can lower continuous integration costs and give you more confidence in your build and test process. This post outlines what it means for a build to be deterministic, the advantages of deterministic builds, and how to achieve them using LLVM tools.Read more…Closing the gap: cross-language LTO between Rust and C/C++By Michael WoeristerSep 19, 2019#LTO10 minute readLink time optimization (LTO) is LLVM's way of implementing whole-program optimization. Cross-language LTO is a new feature in the Rust compiler that enables LLVM's link time optimization to be performed across a mixed C/C++/Rust codebase.Read more…Announcing the program for the 2019 LLVM Developers' Meeting - Bay AreaBy Tanya LattnerSep 4, 2019#devmtg , #LLVM Foundation4 minute readAnnouncing the program for the 2019 LLVM Developers' Meeting in San Jose, CA! This program is the largest we have ever had and has over 11 tutorials, 29 technical talks, 24 lightning talks, 2 panels, 3 birds of a feather, 14 posters, and 4 SRC talks.Read more…The LLVM Project is Moving to GitHubBy Tanya LattnerAug 1, 2019#LLVM Foundation3 minute readThe LLVM Project is Moving to GitHubAfter several years of discussion and planning, the LLVM project is getting ready to complete the migration of its source code from SVN to GitHub!Read more…LLVM and Google Season of DocsBy Tanya LattnerMay 24, 2019#gosc , #LLVM Foundation2 minute readThe LLVM Project is pleased to announce that we have been selected to participate in Google’s Season of Docs! Our project idea list may be found here:http://llvm.org/SeasonOfDocs.html From now until May 29th, technical writers are encouraged to review the proposed project ideas and to ask any questions you have on our gsdocs@llvm.Read more…«««34567»»»"
