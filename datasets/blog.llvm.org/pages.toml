full_description = "GSoC 2024: Half-precision in LLVM libcBy Nicolas CelikAug 31, 2024#GSoC , #libc3 minute readC23 defines new floating-point types, such as _Float16, which corresponds to the binary16 format from IEEE Std 754, also known as “half-precision,” or FP16. C23 also defines new variants of the C standard library’s math functions accordingly, such as fabsf16 to get the absolute value of a _Float16.Read more…GSoC 2024: GPU Libc BenchmarkingBy James HuAug 9, 2024#GSoC , #libc , #gpu4 minute readHey everyone! My name is James and I worked on LLVM this summer through GSoC. My project is called GPU Libc Benchmarking. The main objective of this project was to develop microbenchmarking infrastructure for libc on the GPU.Read more…LLVM Google Summer of Code 2024 & 2023By Anton KorobeynikovMar 14, 2024#GSoC4 minute readThe LLVM organization was accepted to participate in Google Summer of Code in 2024. Soon, prospective participants will begin submitting their project proposals, and mentors will review them to select those who will spend a significant amount of time this year contributing to various parts of LLVM.Read more…Another step forward towards interactive programmingBy QuillPusher (Saqib)Dec 31, 2023#clang-repl5 minute readThe Compiler Research team is pleased to announce the successful completion of another round of internships focused on enhancements in interactive programming, specifically in relation to the Clang-REPL component in LLVM.Read more…Tools for Learning LLVM TableGenBy David SpickettDec 7, 2023#TableGen15 minute readTableGen is a language used within the LLVM project for generating a variety of files, when manual maintenance would be very difficult. For example, it is used to define all of the instructions that can be used on a particular architecture.Read more…Tutorial Development with Clang-ReplBy Krishna NarayananOct 5, 2023#Clang , #Clang-repl , #Tutorial , #GSoC , #Compiler Research4 minute readIntroduction I’m Krishna Narayanan, a final undergraduate at Veermata Jijabai Technological Institute, Mumbai and I am talking about my GSoC project in this blog post which mentions the goals, tasks we have accomplished during this summer tenure.Read more…Diagnostic Improvements in Clang 17By Takuya ShimizuSep 19, 2023#clang , #frontend , #gsoc10 minute readIntroduction In the last few months, I have been a part of an ongoing effort to improve Clang’s diagnostic capabilities. The newly released Clang 17 brings several of these improvements to the forefront.Read more…Map LLVM Values to corresponding source level expression, GSoC'23 ProjectBy Shivam KunwarSep 19, 2023#llvm , #loop-vectorizer , #analysis , #remarks , #gsoc7 minute readHi, My name is Shivam, I involved with the LLVM Foundation in 2023 GSoC edition and worked on an interesting project Map LLVM Values to corresponding source level expression. Project Scope Programmers frequently rely on compiler-generated remarks and analysis reports to enhance the efficiency of their code.Read more…Adding a new target/object backend to LLVM JITLinkBy Kshitij JainMar 28, 2023#llvm , #JITLink , #linking , #relocations , #ELF , #i38632 minute readMotivation For the last year, I have been contributing to LLVM JITLink. This post aims to doubly serve as a summary of my work and documentation for future contributors looking to add a new target/object backend to LLVM JITLink.Read more…The 2023 EuroLLVM Developers' Meeting ProgramBy Tanya LattnerMar 27, 2023#LLVM Foundation , #EuroLLVM4 minute readThe LLVM Foundation is excited to announce the 2023 EuroLLVM Developers’ Meeting program! Early bird registration ends April 10th. Keynotes: Order out of Chaos, The LLVM Release Process. - Tobias Hieta “-fbounds-safety”: Enforcing bounds safety for production C code - Yeoul Na Technical Talks:Read more…«««12345»»»"
