title = "The LLVM Project Blog"
description = "LLVM Project News and Details from the Trenches"
full_description = "Clang is now used to build Chrome for WindowsBy Nico WeberMar 5, 2018#C++ , #Clang , #Products10 minute readAs of Chrome 64, Chrome for Windows is compiled with Clang. We now use Clang to build Chrome for all platforms it runs on: macOS, iOS, Linux, Chrome OS, Android, and Windows.Read more…EuroLLVM'18 developers' meeting programBy Arnaud Allard de GrandmaisonMar 1, 2018#devmtg3 minute readThe LLVM Foundation is excited to announce the program for the EuroLLVM'18 developers' meeting (April 16 - 17 in Bristol/UK) ! KeynotesThe Cerberus Memory Object Semantics for ISO and De Facto C P.Read more…LLVM accepted to 2018 Google Summer of Code!By Tanya LattnerFeb 14, 2018#GSoC , #open source , #student2 minute readWe are excited to announce the LLVM project has been accepted to 2018 Google Summer of Code! What is Google Summer of Code? Google Summer of Code (GSoC) is a global program focused on introducing students to open source software development.Read more…Improving Link Time on Windows with clang-cl and lldBy Zachary TurnerJan 8, 2018#clang-cl , #lld , #Windows18 minute readOne of our goals in bringing clang and lld to Windows has always been to improve developer experience, and what is it that developers want the most? Faster build times!Read more…Clang ♥ bash -- better auto completion is coming to bashBy Yuka TakahashiSep 19, 2017#GSoC , #Clang3 minute readCompilers are complex pieces of software and have a multitude of command-line options to fine tune parameters. Clang is no exception: it has 447 command-line options. It’s nearly impossible to memorize all these options and their correct spellings, that's where shell completion can be very handy.Read more…2017 US LLVM Developers' Meeting ProgramBy Tanya LattnerSep 11, 2017#devmtg4 minute readThe LLVM Foundation is excited to announce the selected proposals for the 2017 US LLVM Developers' Meeting! Keynotes: Falcon: An optimizing Java JIT - Philip ReamesCompiling Android userspace and Linux kernel with LLVM - Stephen Hines, Nick Desaulniers and Greg HackmannRead more…LLVM on Windows now supports PDB Debug InfoBy Zachary TurnerAug 18, 2017#pdb , #windows , #Clang6 minute readFor several years, we’ve been hard at work on making clang a world class toolchain for developing software on Windows. We’ve written about this several times in the past, and we’ve had full ABI compatibility (minus bugs) for some time.Read more…Devirtualization in LLVM and ClangBy Piotr PadlewskiMar 10, 2017#Clang7 minute readThis blog post is part of a series of blog posts from students who were funded by the LLVM Foundation to attend the 2016 LLVM Developers' Meeting in San Jose, CA.Read more…Some news about apt.llvm.orgBy Ledru SylvestreMar 6, 2017#lld , #LLDB , #apt , #Clang , #libfuzzer , #llvm4 minute readapt.llvm.org provides Debian and Ubuntu repositories for every maintained version of these distributions. LLVM, Clang, clang extra tools, compiler-rt, polly, LLDB and LLD packages are generated for the stable, stabilization and development branches.Read more…2016 LLVM Developers' Meeting - Experience from Johannes Doerfert, Travel Grant RecipientBy Johannes DoerfertFeb 21, 2017#devmtg2 minute readThis blog post is part of a series of blog posts from students who were funded by the LLVM Foundation to attend the 2016 LLVM Developers' Meeting in San Jose, CA.Read more…«««56789»»»"
