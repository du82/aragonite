5.png 105w, https://mailtrap.io/wp-content/uploads/2023/01/mailbox-providers-210x210.png 210w, https://mailtrap.io/wp-content/uploads/2023/01/mailbox-providers-250x250.png 250w" sizes="(max-width: 1030px) 100vw, 1030px"> Email Categories Password changes, invoices, confirmations, etc. Set up email categories to segment your transactional emails. Stats for each category with the corresponding metrics. Understand if a template isn’t doing well and fix it right away. <img width="900" height="860" src="https://mailtrap.io/wp-content/uploads/2023/01/email-categories.png" class="tab-content__image c-mt-5 c-mt-md-0 d-block lazyload" alt decoding="async" data-lazy="true" srcset="https://mailtrap.io/wp-content/uploads/2023/01/email-categories.png 900w, https://mailtrap.io/wp-content/uploads/2023/01/email-categories-480x459.png 480w, https://mailtrap.io/wp-content/uploads/2023/01/email-categories-453x433.png 453w, https://mailtrap.io/wp-content/uploads/2023/01/email-categories-350x334.png 350w, https://mailtrap.io/wp-content/uploads/2023/01/email-categories-700x669.png 700w, https://mailtrap.io/wp-content/uploads/2023/01/email-categories-283x270.png 283w, https://mailtrap.io/wp-content/uploads/2023/01/email-categories-565x540.png 565w, https://mailtrap.io/wp-content/uploads/2023/01/email-categories-188x180.png 188w, https://mailtrap.io/wp-content/uploads/2023/01/email-categories-377x360.png 377w, https://mailtrap.io/wp-content/uploads/2023/01/email-categories-35x33.png 35w, https://mailtrap.io/wp-content/uploads/2023/01/email-categories-69x66.png 69w, https://mailtrap.io/wp-content/uploads/2023/01/email-categories-32x32.png 32w" sizes="(max-width: 900px) 100vw, 900px"> Webhooks Get all event information pushed to your system. Integrate more deeply into your system for almost real-time unsubscribes, spam complaints, bounces, etc. <img width="1100" height="830" src="https://mailtrap.io/wp-content/uploads/2023/01/webhooks.png" class="tab-content__image c-mt-5 c-mt-md-0 d-block l