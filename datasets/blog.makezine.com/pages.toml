description = "DIY science is the perfect way to use your creative skills and learn something new. With the right supplies, some determination, and a curious mind, you can create amazing experiments that open up a whole world of possibilities. At home-made laboratories or tech workshops, makers from all backgrounds can explore new ideas by finding ways to study their environment in novel ways – allowing them to make breathtaking discoveries!"
