["https://blog.maximeheckel.com/posts/advanced-animation-patterns-with-framer-motion"]
title = "Advanced animation patterns with Framer Motion - Maxime Heckel's Blog"
description = "A deep dive into Framer Motion's propagation, exit transitions and layout animation patterns through curated examples and interactive playgrounds."
full_description = '''HomeAdvanced animation patterns with Framer MotionApril 20, 2021 / 13 min readLast Updated: August 4, 2022I got ✨a lot✨ of positive feedback from my Guide to creating animations that spark joy with Framer Motion, and it's undeniable that this library has piqued many developers' interests in the world of web-based animations. While I introduced in this previous post many of the foundational pieces that compose an animation, and how one can orchestrate multiple transitions very easily with Framer Motion, I did not touch upon many of the more advanced features that this library provides. Ever wondered how to propagate animations throughout several components or to orchestrate complex layout transitions? Well, this article will tell you all about these advanced patterns and show you some of the great things one can accomplish with Framer Motion! InfoAn icon representing the letter ‘i‘ in a circleLike the original blog post, this article contains a series of interactive widgets and playgrounds with preset examples to allow you to apply the Framer Motion concepts we're about to see without the need to set up anything!Let me know what you think about these examples, and whether they were helpful. Your feedback is super important and will help me do better for my future blog posts 😄! Propagation One of the first advanced patterns I got to encounter when I tried to add some micro-interactions with Framer Motion on my projects is propagation. I quickly learned that it's possible to propagate changes of variants from a parent motion component to any child motion component. However, this got me confused at the beginning because it broke some of the mental models I originally had when it comes to defining animations. Remember in my previous blog post when we learned that every Framer Motion Animation needed 3 properties (props) initial, animate, transition, to define a transition/animation? Well, for this pattern that's not entirely true. Framer Motion allows variants to "flow down" through every motion child component as long as these motion components do not have an animate prop defined. Only the parent motion component, in this case, defines the animate prop. The children themselves only define the behavior they intent to have for those variants. A great example where I used propagation on this blog is the "Featured" section on the home page of this blog. When you hover it, the individual cards "glow" and this effect is made possible by this pattern. To explain what really is happening under the hood, I built this little widget below where I reproduced this effect: Hover me!✨ It's magic! ✨StackAn icon representing 3 tiles on top of each other You can see that hovering (or tapping if you're on mobile) the card or even the label above it triggers the glow effect. What kind of sorcery is this?! By clicking on the "perspective" button, you can see what happens under the hood: ArrowAn icon representing an arrowThere's an "invisible" motion layer covering the card and the label. This layer holds the whileHover prop which sets the variant "hover" ArrowAn icon representing an arrowThe "glow" itself is a motion component as well, however, the only thing it defines is its own variants object with a hover key. Thus when hovering this invisible layer, we toggle the "hover" variant and any child motion component having this variant define in their variants prop will detect this change and toggle the corresponding behavior. Example of propagation pattern with Framer Motion1const CardWithGlow = () => {2 const glowVariants = {3 initial: {4 opacity: 05 },6 hover: {7 opacity: 18 }9 }10 11 return (12 // Parent sets the initial and whileHover variant keys13 <motion.div initial="initial" whileHover="hover">14 {/* child motion component sets variants that match the keys set by the parent to animate accordingly */}15 <motion.div variants={glowVariants} className="glow"/>16 <Card>17 <div>Some text on the card/div>18 </Card>19 </motion.div>20 )21} InfoAn icon representing the letter ‘i‘ in a circleYou can check out the full code of a similar example by navigating to the Card with glow effect on hover snippet page. Now let's apply what we learned about the propagation mechanism of Framer Motion! In the playground below you'll find a motion component with a "hover" animation. When hovering it, a little icon will show up on the right end side of that component. You can try to: ArrowAn icon representing an arrowModify the variant key used in the motion component wrapping the button and see that now that it defers from what's being set by the parent component, the animation does not trigger and the button is not visible on hover. ArrowAn icon representing an arrowSet ananimate prop on the motion component that wraps the button and see that it now animates on its own and does not consume the variant set by the parent on hover. PreviewConsoleStackAn icon representing 3 tiles on top of each otherPlayAn icon representing the play symbol, a triangle pointing to the rightRepeatAn icon representing an arrow twisted so it makes a loopXAn icon representing an XCleanimport { styled } from '@stitches/react'; import { motion } from 'framer-motion'; import './scene.css'; const ListItem = styled(motion.li, { width: '100%', minWidth: '300px', background: 'hsla(222, 89%, 65%, 10%)', boxShadow: '0 0px 10px -6px rgba(0, 24, 40, 0.3)', borderRadius: '8px', padding: '8px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', cursor: 'pointer', marginBottom: '0px', color: 'hsl(223, 15%, 65%)', fontSize: 18, }); const Button = styled('button', { background: 'transparent', cursor: 'pointer', border: 'none', shadow: 'none', color: 'hsl(223, 15%, 65%)', display: 'flex', }); const InfoBox = styled('div', { width: '50%', }); const ARTICLES = [ { category: 'swift', title: 'Intro to SwiftUI', description: 'An article with some SwitftUI basics', id: 1, }, ]; const Item = (props) => { const { article } = props; const readButtonVariants = { hover: { opacity: 1, }, // Uncomment the variant below and comment the variant above and notice the button will not show up on hover /* hoverme: { opacity: 1, }, */ initial: { opacity: 0, }, magic: { rotate: 360, opacity: 1, }, }; return ( <ListItem layout initial="initial" whileHover="hover"> <InfoBox>{article.title}</InfoBox> <motion.div // Uncomment me and notice the button now rotates and is always visible // animate="magic" variants={readButtonVariants} transition={{ duration: 0.25 }} > <Button aria-label="read article" title="Read article" onClick={(e) => e.preventDefault()} > &#8594; </Button> </motion.div> </ListItem> ); }; const Example = () => <Item article={ARTICLES[0]} />; export default Example; Animate components when they are unmounting So far, we've only seen examples of animation being triggered either on mount or following some specific events like hover or tap. But what about triggering an animation right before a component unmounts? Some sort of "exit" transition? Well, in this second part, we'll take a look at the Framer Motion feature that addresses this use case and also the one that impressed me the most: AnimatePresence! I tried to implement some kind of exit animations before learning about AnimatePresence, but it was hacky and always required extra code to set a proper "transitional" state (like isClosing, isOpening) and toggle the corresponding animation of that state. As you can imagine, it was very error-prone. A very hacky way to implement an exist animation without AnimatePresence1/**2This is mostly pseudo code, do not do this!3It's not good practice4**/5 6const MagicComponent = () => {7 const [hidden, setHidden] = React.useState(false);8 const [hidding, setHidding] = React.useState(false);9 10 const variants = {11 animate: (hidding) => ({12 opacity: hidding ? 0 : 1,13 })14 initial: {15 opacity: 116 },17 }18 19 const hideButton = () => {20 setHidding(true);21 setTimeout(() => setHidden(true), 1500);22 }23 24 return (25 <motion.button26 initial="initial"27 animate="animate"28 variants={variants}29 onClick={hideButton}30 custom={hidding}31 >32 Click to hide33 </motion.button>34 )35} On the other hand, AnimatePresence is extremely well thought of and easy to use. By simply wrapping any motion component in an AnimatePresence component, you'll have the ability to set an exit prop! Example of use case for AnimatePresence1const MagicComponent = () => {2 const [hidden, setHidden] = React.useState(false);3 4 return (5 <AnimatePresence>6 {!hidden && (7 <motion.button8 initial={{ opacity: 1 }}9 exit={{ opacity: 0 }}10 onClick={() => setHidden(true)}11 >12 Click to hide13 </motion.button>14 )}15 </AnimatePresence>16 );17}; In the interactive widget below, I showcase 2 versions of the same component: ArrowAn icon representing an arrowthe one on the left is not wrapped in AnimatePresence ArrowAn icon representing an arrowthe second one, however, is wrapped That's the only difference code-wise. But as you can see the difference is pretty striking! Without AnimatePresence🚀ArrowAn icon representing an arrowArrowAn icon representing an arrowWith AnimatePresence🚀ArrowAn icon representing an arrowArrowAn icon representing an arrow AlertAn icon representing an exclamation mark in an octogone👉 Something I discovered while writing this articleTo set the proper direction of the transition, left or right, depending on which button is pressed, I set a state while the user hovers the button which will change the direction of the transition accordingly (not the best implementation I know but it works 😄) Despite this working perfectly on the example on the right, the one that uses AnimatePresence, you may have noticed that on the example on the left, the transition kicks in just by hovering one of the buttons.It seems that AnimatePresence keeps track of which motion component is rendered at a given time and throughout state changes.I still need to investigate the inner workings of Framer Motion for that, but, despite it being a surprise to me, this behavior makes sense given the use case. We now have a new awesome tool to use to make our transitions even better! It's time it a try in the playground below: ArrowAn icon representing an arrowTry to remove the AnimatePresence component. Notice how this makes Framer Motion skip the animation specified in the exit prop. ArrowAn icon representing an arrowTry to modify the animation defined in the exit prop. For example, you could make the whole component scale from 1 to 0 while it exit. (I already added the proper animation objects commented in the code below 😄) PreviewConsoleStackAn icon representing 3 tiles on top of each otherPlayAn icon representing the play symbol, a triangle pointing to the rightRepeatAn icon representing an arrow twisted so it makes a loopXAn icon representing an XCleanimport { styled } from '@stitches/react'; import { AnimatePresence, motion } from 'framer-motion'; import React from 'react'; import Pill from './Pill'; import './scene.css'; const List = styled(motion.ul, { padding: '16px', width: '350px', background: ' hsl(223, 15%, 10%)', borderRadius: '8px', display: 'grid', gap: '16px', }); const ListItem = styled(motion.li, { minWidth: '300px', background: 'hsla(222, 89%, 65%, 10%)', boxShadow: '0 0px 10px -6px rgba(0, 24, 40, 0.3)', borderRadius: '8px', padding: '8px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', cursor: 'pointer', marginBottom: '0px', color: 'hsl(223, 15%, 65%)', fontSize: 18, }); const Button = styled('button', { background: 'transparent', cursor: 'pointer', border: 'none', shadow: 'none', color: 'hsl(223, 15%, 65%)', display: 'flex', }); const InfoBox = styled('div', { width: '50%', }); const FilterWrapper = styled('div', { marginBottom: '16px', input: { marginRight: '4px', }, label: { marginRight: '4px', }, }); const ARTICLES = [ { category: 'swift', title: 'Intro to SwiftUI', description: 'An article with some SwitftUI basics', id: 1, }, { category: 'js', title: 'Awesome React stuff', description: 'My best React tips!', id: 2, }, { category: 'js', title: 'Styled components magic', description: 'Get to know ways to use styled components', id: 3, }, { category: 'ts', title: 'A guide to Typescript', description: 'Type your React components!', id: 4, }, ]; const categoryToVariant = { js: 'warning', ts: 'info', swift: 'danger', }; const Item = (props) => { const { article, showCategory } = props; const readButtonVariants = { hover: { opacity: 1, }, initial: { opacity: 0, }, }; return ( <ListItem initial="initial" whileHover="hover"> <InfoBox>{article.title}</InfoBox> {/* Try to remove/comment the AnimatePresence component below! */} <AnimatePresence> {showCategory && ( <motion.div initial={{ opacity: 0 }} // initial={{ opacity: 0, scale: 1}} animate={{ opacity: 1 }} exit={{ opacity: 0 }} // exit={{ opacity: 0, scale: 0, }} > <Pill variant={categoryToVariant[article.category]}> {article.category} </Pill> </motion.div> )} </AnimatePresence> <motion.div variants={readButtonVariants} transition={{ duration: 0.25 }}> <Button aria-label="read article" title="Read article" onClick={(e) => e.preventDefault()} > &#8594; </Button> </motion.div> </ListItem> ); }; const Component = () => { const [showCategory, setShowCategory] = React.useState(false); return ( <> <FilterWrapper> <div> <input type="checkbox" id="showCategory" checked={showCategory} onChange={() => setShowCategory((prev) => !prev)} /> <label htmlFor="showCategory">Show Category</label> </div> </FilterWrapper> <List> {ARTICLES.map((article) => ( <Item key={article.id} article={article} showCategory={showCategory} /> ))} </List> </> ); }; export default Component; Layout animations We now know how to: ArrowAn icon representing an arrowpropagate animations throughout a set of motion components ArrowAn icon representing an arrowadd an exit transition to a component so it can unmount gracefully Those advanced patterns should give us the ability to craft some pretty slick transitions right? Well, wait until you hear more about how Framer Motion can handle layout animations! New!The subject of layout animations is pretty vast to say the least! Since writing and updating this part, I decided to write a dedicated blog post about Framer Motion Layout Animations: Everything about Framer Motion layout animations which is a complete guide with lots of examples.The following part is still relevant if you want a light intro to this subject, but don't forget to bookmark the complete guide for later 🙂! What is a "layout animation"? A layout animation is any animation touching layout related properties such as: ArrowAn icon representing an arrowposition properties ArrowAn icon representing an arrowflex or grid properties ArrowAn icon representing an arrowwidth or height ArrowAn icon representing an arrowsorting elements But to give you a little bit more of an idea of what I'm talking about here, let's try to take a look at the playground below that showcases 2 versions of t'''
