["https://blog.maximeheckel.com/posts/building-a-design-system-from-scratch"]
title = "Building a Design System from scratch - Maxime Heckel's Blog"
description = "A deep dive into my experience building my own design system that documents my process of defining tokens, creating efficient components, and shipping them as a package."
full_description = '''HomeBuilding a Design System from scratchMay 10, 2022 / 24 min readLast Updated: November 11, 2023As someone who's always been striving for consistency, building delightful and accessible experiences, and trying to do all that faster than ever, the concept of ✨design systems✨ has always interested me. I believe in setting up clear standards for colors and fonts and establishing patterns to build reusable components as the key to building sustainable UIs that can withstand the test of time. For the past few years, I've been working a lot on this blog, the interactive experiences showcased in my blog posts, and several other tiny projects that needed consistency in branding and components. The more I worked on them, the more I felt the need to stop copy-pasting code and colors between projects and needed my own set of UI pieces: my personal design system. After pouring countless hours into this project and sharing my progress over the past several months (almost a year now actually!), I felt it was time to write a little return on experience to focus on all the things I've learned while building a design system on my own 😊. So in this blog post, I'll go through the component patterns I came up with, explain how I picked up my tokens and overall the design system thinking mentality I adopted to make this project (somewhat) successful. InfoAn icon representing the letter ‘i‘ in a circleWant to look at what I built before jumping into this blog post? You can check out @maximeheckel/design-system, the open-source repository of this project.Note: This repository is still a work in progress, I have not yet migrated all the components to it! Context: Why would I even choose to build my own design system? Before jumping on the actual building part of this blog post, I first want to give a bit more context on why I chose to dedicate time to this project. Among the many reasons why this project came to life, you will mainly find: ArrowAn icon representing an arrowBranding: I'm trying very hard to be unique in an endless sea of developers' blogs/websites looking more or less the same. I want people to recognize my work from afar through my choice of colors, logo, components design, playfulness, and attention to detail. ArrowAn icon representing an arrowConsistency: Each piece composing this system should have a purpose. All components follow the same guidelines and are composed of more primitive elements/tokens. ArrowAn icon representing an arrowFun and Learning: I learned a lot about component building, design system thinking, and myself while building this tiny library. It helped me develop some empathy and step back and think twice about the interface of a component, composability, abstraction, and scalability. Focusing on one piece of the system at a time and making that one component mine was tons of fun and very satisfying. This project was not a necessity per se, but the more my blog/portfolio and brand were evolving, the more I was striving for these things, and the more not having a design system was slowing me down. I needed my own set of "Lego pieces" that I could rearrange/combine infinitely. Thus the idea of building a personal design system came to my mind: A small scoped design system mainly composed of primitive components focused solely on personal branding and personal use. Even though the scope of this design system feels small compared to the bigger ones we can get to work on in a work context, it was not necessarily less complex to build. In the following parts, I'll go through the challenges and decisions I've made along the way when working on this project. Tokens Tokens are the discrete elements of styles like color palette, spacing units, shadows, or typography that form the foundation of a design system. Breaking down my different projects into these most fundamental pieces was essential when I started working on my design system. Color system First, I wanted to define an efficient solid color system. I ended up opting for what I dubbed a "two-tier color variable system": ArrowAn icon representing an arrowThe first layer is a series of variables representing the HSL (Hue, Saturation, Lightness) values of the different colors within the palettes like --blue-10: '222, 89%, 90%' or --red-60: 0, 95%, 40%. ArrowAn icon representing an arrowThe second layer is more of a generic alias to the colors that will end up referenced by the components of the design system: --brand: hsl(var(--blue-50)) or --foreground: hsla(var(--gray-05), 60%). In this layer, we use the colors defined in the first one and compose them or expand them. Diagram illustrating the two-tier variable system: the --brand color is used as background color in the button while referencing the color itself. This system worked for me for the following reasons: ArrowAn icon representing an arrowComponents never end up referencing actual "colors" per se: the background color of the Button component is not --blue-10 but --brand and the value of that variable may evolve through time from blue to purple or anything else. Thanks to this system, components are more resilient to change: want to change the brand color? All you need to do is update the value of the --brand variable, and all the components referencing it will update accordingly. ArrowAn icon representing an arrowIt lets me compose my color tokens, like adding some opacity. I talked about all this in a dedicated blog post: The Power of Composition with CSS variables where I showcase a few of my color composition patterns. ArrowAn icon representing an arrowBuilding themes like light and dark mode easily: in light mode --brand might reference --blue-60, in dark mode it will be --blue-20. To illustrate the steps I took to pick up colors, create a palette, and come up with tokens, I built the little animated slideshow ✨ below: Step 1: Pick base colorsArrowAn icon representing an arrowArrowAn icon representing an arrow InfoAn icon representing the letter ‘i‘ in a circleTry toggling light/dark mode and notice how the palette changes based on the current theme all thanks to the "two-tier color variable system" detailed above! Other tokens Colors variables were my main focus to get started. They are perhaps the most crucial set of tokens to start building a compelling visual language. Then came the necessity to define consistent spacing units: Spacing tokens1--space-0: 0px;2--space-1: 4px;3--space-2: 8px;4--space-3: 12px;5--space-4: 16px;6--space-5: 24px;7--space-6: 32px;8--space-7: 40px;9--space-8: 48px;10--space-9: 56px;11--space-10: 64px;12--space-11: 80px;13--space-12: 96px; and font related tokens: Typography tokens1--font-size-1: 0.75rem;2--font-size-2: 0.875rem;3--font-size-3: 1rem;4--font-size-4: 1.125rem;5--font-size-5: 1.25rem;6--font-size-6: 1.5rem;7--font-size-7: 2rem; and little things like border radii: Radii tokens1--border-radius-0: 4px;2--border-radius-1: 8px;3--border-radius-2: 16px; Components reference these tokens directly as they are less likely to be changing significantly over time. NamingQuick parenthesis on the naming of my tokens: it's far from perfect! Here's a summary of some of the rules I followed for myself: ArrowAn icon representing an arrowFor "size-related" token sets, I'd opt for using numerical suffixes with increments of 1 like 1, 2, ..., 12. ArrowAn icon representing an arrowFor tokens that may need a bit more granularity in the future, like color scales, I opted for numerical suffixes with increments of 10. Thus if I ever needed to add a bit more I'd have the ability to do so without breaking anything. Lessons learned As I iterated on the components and developed common patterns, I often had to go back to the drawing board and define new tokens, redefine/refine some other ones, or combine and delete some. This process was particularly tedious for me as: ArrowAn icon representing an arrowUnlike my experience working on a design system in a professional context, I do not have a designer working on this one. I could only rely on gut feeling or trial and error until it felt like I nailed it or defined something that looked great. ArrowAn icon representing an arrowI imposed a rule on myself: containing the number of tokens as much as possible. That was, at times, really hard as I needed to preserve a balance between the "complexity of my design system" and the level of consistency. The tokens I've defined so far will most likely evolve in the future as I'm expanding the number of components or experimenting with new colors or new ways to define variables. I learned through this project to see them more as a malleable layer of a design system instead of a solid bedrock where everything sits on top. Component patterns As of today, my design system contains only simple components or primitives. All I need is a set of simple pieces that lets me build things faster, with consistency, while still allowing some wiggle room for creativity: like a Lego kit. Thus, I optimized this project to preserve a balance of: ArrowAn icon representing an arrowGood developer experience (DX). I want my components to be useful and help me work, experiment, and iterate faster. ArrowAn icon representing an arrowBeautiful and cohesive design/design language. Thus allowing components to be composed not just on the code side of things but also visually. I'm dedicating this part to showcasing some patterns and tricks I've come up with to achieve these goals while also making the components of my design system easier to use and maintain. If you're into component DX and composition patterns, this section should scratch an itch ✨. InfoAn icon representing the letter ‘i‘ in a circleIn this section, you may question some of my decisions or even not agree with some of them. That's fine. I think there are no 100% right or 100% wrong opinions about component patterns: the context in which we build them and preferences matter.In my case, keep in mind that I made those decisions because: ArrowAn icon representing an arrowOf the context in which I'm building this design system. I will be the only developer using it and have no other customers/consumers. ArrowAn icon representing an arrowBecause I liked it 😄 or it just made me happy Variant driven components I've always been a big fan of styled components and wanted them to be at the core of this design system. This time, however, I opted for something a bit more opinionated: @stitches/react. Among the many reasons why I picked this one rather than a more widely adopted library are: ArrowAn icon representing an arrowThe variant-driven approach. Stitches emphasize the use of variants. The set of variants a given component supports must be predefined, which means no dynamic props are allowed for styling. I'm a big believer in this pattern when working on a design system. It makes you really think about developer experience and the interface of your components. I did my best to keep the number of variants down and privilege composition and compound components which I will detail later in this article. ArrowAn icon representing an arrowThe support for polymorphism. Stitches lets you override the tag of a component via a polymorphic as prop. I'll showcase some examples of that pattern below. ArrowAn icon representing an arrowThe advanced Typescript support. Styled components' variants come with types automatically. There's no extra work needed. Sample component showcasing the main features of Stitches1import { styled } from '@stitches/react';2 3const Block = styled('div', {4 borderRadius: 8px;5 height: '50px';6 width: '100%';7 display: 'flex';8 justifyContent: 'center;9 alignItems: 'center';10 11 variants: {12 /* the appearance prop will be automatically typed as 'primary' | 'secondary' */13 appearance: {14 'primary': {15 background: 'blue';16 color: 'white';17 },18 'secondary': {19 background: 'hotpink';20 color: 'white';21 }22 }23 }24 25 /* specifying a default variant will make the appearance prop optional */26 defaultVariant: {27 appearance: 'primary';28 }29});30 31 32const App = () => {33 return (34 <Block as="section" appearance="secondary">35 Styled-components36 </Block>37 )38} When it comes to writing actual styles, I wrote my fair share of spaghetti CSS throughout my career, and I did not want this project to end up the same way. Luckily, Stitches keeps my styled-components code in check whether it's pattern-wise (no dynamic props, only variants) or type-wise, and makes me avoid many of the pitfalls I fell into with other styled-components libraries. On top of that, I came up with some custom patterns/rules to further improve the readability and maintainability of my code. One pattern that I kept getting back to while building my components was relying on local CSS variables to handle transitions, and hover/focus/active states. Button component using local CSS variables1import { styled } from '@stitches/react';2 3const StyledButton = styled('button', {4 /* Initializing local variables first and assigning them default values */5 background: 'var(--background, white)',6 color: 'var(--color, black)',7 boxShadow: 'var(--shadow, none)',8 opacity: 'var(--opacity, 1)',9 transform: 'scale(var(--button-scale, 1)) translateZ(0)',10 11 /* Main styles of the component */12 padding: 'var(--space-3) var(--space-4)',13 fontSize: 'var(--font-size-2)',14 fontWeight: 'var(--font-weight-500)',15 height: '44px',16 width: 'max-content',17 transition: 'background 0.2s, transform 0.2s, color 0.2s, box-shadow 0.3s',18 borderRadius: 'var(--border-radius-1)',19 20 /* Update local variables based on state/variant */21 '&:active': {22 '--button-scale': 0.95,23 },24 25 '&:disabled': {26 '--background': 'var(--form-input-disabled)',27 '--color': 'var(--typeface-tertiary)',28 },29 30 '&:hover': {31 '&:not(:disabled)': {32 '--shadow': 'var(--shadow-hover)',33 },34 },35 '&:focus-visible': {36 '--shadow': 'var(--shadow-hover)',37 },38 39 variants: {40 variant: {41 primary: {42 '--background': 'var(--brand)',43 '--color': 'var(--typeface-primary)',44 },45 secondary: {46 '--background': 'var(--brand-transparent)',47 '--color': 'var(--brand)',48 },49 },50 },51}); You can see in the snippet above that: ArrowAn icon representing an arrowThe local variables used in this component sit at the top. This is where I initialize them with default values. ArrowAn icon representing an arrowThen, I follow up with the main body of the CSS which contains all the main CSS properties. ArrowAn icon representing an arrowThen, any nested code, variants, selectors, ::before, or ::after statements only reassign those CSS variables. The resulting code is much easier to read and I am less afraid to experiment with more complex CSS code without feeling like I am giving up on maintainability. InfoAn icon representing the letter ‘i‘ in a circleYou may notice that I am not leveraging Stitches' own theme and variable system for now. I may eventually give it a try. My original intention was to make my code independe'''
