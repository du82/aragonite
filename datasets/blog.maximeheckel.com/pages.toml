["https://blog.maximeheckel.com/posts/first-steps-with-gpt-3-and-beyond"]
title = "First steps with GPT-3 for frontend developers - Maxime Heckel's Blog"
description = "A beginners guide to OpenAI's API that eases frontend developers into the world of GPT-3 and gives all the tools needed to start building AI-powered Next.js apps."
full_description = '''HomeFirst steps with GPT-3 for frontend developersSeptember 28, 2021 / 17 min readLast Updated: September 28, 2021Earlier this year, I've been fortunate enough to get access to the beta of the OpenAI GPT-3 API. I saw many people throughout 2020 and early 2021 starting pretty impressive projects and even companies around this API, so it's a euphemism to say that it piqued my interest. I wanted to get my hands on it ASAP and start experimenting and building things like some of the cool people on Twitter. The problem, however, is that I didn't know where to start, or even what to do with GPT-3. When I logged into the playground the first time, I was just presented with a barebone text input and a toolbar filled with sliders, that was it 😅! Thus, I figured this was yet another perfect opportunity to write the guide I wished I had when I got started and share the steps I took to achieve my goals and everthing I learned along the way. In this article, we'll take a look together at the fundamentals of GPT-3 illustrated through some interactive widgets ⚡️, and most importantly at my attempts to build my own custom summarization model! In the end, I'll also guide you on how to use the API beyond the playground, so you'll have all the tools to start building amazing AI-powered apps 🚀. InfoAn icon representing the letter ‘i‘ in a circleThis blog post will feature simplified GPT-3 prompts widgets that I built to help illustrate some of the core concepts behind the API.These prompts are simulated as I was, unfortunately, not able to get approval to use the "real" GPT-3 API on time for this use case. These simulated API responses have been, however, generated on OpenAI's playground and should still be helpful to you.All the examples that will be featured here have been generated with the davinci engine. I'm not going to talk about GPT-3 engines in this blog post to keep things simple. This may be a good talking point for a follow-up article! What is GPT-3? GPT-3 which stands for Generative Pre-trained Transformer 3 is a "text-in, text-out" API built by OpenAI that has been pre-trained on an immense and diverse set of text from the internet. It can return a relevant text output to any text input you may provide and its API is so simple to use that it makes it very easy for developers to build cool AI-powered apps 🤖 without necessarily the need for an AI or Machine Learning background. If like me, you took Machine Learning classes, or read a few articles about it, you might be confused when you start using GPT-3 and ask yourselves how to "train" it. <img alt="MaximeHeckel" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" srcSet="/_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fprofile_images%2F813646702553010176%2FrOM8J8DC_normal.jpg&amp;w=48&amp;q=75 1x, /_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fprofile_images%2F813646702553010176%2FrOM8J8DC_normal.jpg&amp;w=96&amp;q=75 2x" src="/_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fprofile_images%2F813646702553010176%2FrOM8J8DC_normal.jpg&amp;w=96&amp;q=75"/>Maxime@MaximeHeckelhey friends what's the go-to resource to get started with GPT-3? I'd like to know how I'm supposed to "train" a model to build a preset that can do a specific task. I used the playground but pretty sure I don't understand everything so I have tons of questions! Any pointers?🙏3:36 PM - Jul 8, 202125 The short answer to this is that you can't train GPT-3 (it has "pre-trained" in its name for a reason). To "tell" GPT-3 what output you want, you have to use what is referred to by the OpenAI team as the few-shot learning technique where you provide just a few examples of what response you expect for a given input. There are other ways to "guide" GPT-3 into being more specific with its output by using fine-tuning. Don't worry if you feel confused right now! We're going to analyze both these techniques through some examples below! Working with few-shot learning The first time you'll log into OpenAI, it will feel like you've been thrown to the wolves without much guidance. You'll only have a big text box and some dials on the side to tweak. Screenshot of the OpenAI playground showcasing on the left the prompt, and on the right the different settings for it That text box is referred to as the prompt. This is where you'll provide your inputs, and also see the outputs generated by GPT-3. The options in the sidebar let you tweak the output as you wish: ArrowAn icon representing an arrowTemperature and Top P influence the "randomness" of your output, 0 being the most deterministic, 1 being the most ... let's say "creative" 😅 (set it to 1 if you like to live dangerously) ArrowAn icon representing an arrowResponse Length lets you set how many "tokens" or characters you wish to have in your output For now, that's all we need to know to get started! As mentioned in the previous part, the key with GPT-3 is to provide examples of outputs to guide it to generate something we want. To illustrate that, the little widget below is a simplified version of the playground, where we want GPT-3 to generate a list of animal emojis. First, we only provide one example 1. 🦁\n which is far from enough for the API to know what to do with this input. Try to hit the Submit button and you'll see that we are far from getting what we want. Then click on the toggle and hit Submit again to see what happens when you add more examples. Prompt1. 🦁Toggle on to add more examples!Submit ✨Reset You can see that when we provide just a few examples such as 1. 🦁\n2. 🐢\n3. 🦄\n4. 🐶\n5. 🐰 as an input, we get a more accurate output. This is the strength of the GPT-3 API. No training is needed from the user side, just a few examples and you can get some really impressive results. On top of that, you can also tweak this output to your liking by changing some of the settings of the playground. In the video below you can see that when I tweak the temperature setting on the same example, the higher the temperature the more unexpected the result becomes. InfoAn icon representing the letter ‘i‘ in a circleAbout the other options:I won't go over all the options available on the playground as: ArrowAn icon representing an arrowI did not use them to their full extent and do not have a full understanding of all of them ArrowAn icon representing an arrowThey are not necessarily needed when you get started, but do play with them to see how they impact your outputs! You'll find more information about the playground options in OpenAI's dedicated documentation. Prompt Design In the examples we just saw, the outputs generated by GPT-3 were indeed promising, yet felt a bit uncontrollable: the generation only stopped once we reached maximum response length. That means that GPT-3 might stop generating an output in the middle of a sentence which can be problematic when working with text corpuses. My initial goal with GPT-3 was to build a summarization model, where I could pass text from my own blog posts as input and get a summarized one-line sentence. So, little to say that having it stopping the generation in the middle of a sentence is ... annoying 😅. This is where prompt design comes into the picture! To design a prompt, you may need to consider adding prefixes to your input and outputs to help GPT-3 to tell them apart. For my summarization model, I chose to prefix my input text (the paragraph of my blog post I wish to summarize) with input: and the resulting summarized output with summary:. The prompt design I chose for my summarization model1input: Something that originally caught my attention with Gatsby was its use2of GraphQL. It became more of a curiosity over time honestly. While I'm sure3it makes sense for many sites at scale (e-commerce, bigger and more complex4publications), at least to me the GraphQL felt like an extra level of complexity5that felt unnecessary. The more I iterated on my blog, the more the technical6choice of GraphQL felt unjustified (for my use-case at least), building data7sources felt way more complicated than it should have been.8 9summary: On top of that, the playground offers you settings to take these prefixes into account when generating an output: ArrowAn icon representing an arrowAdding a Stop Sequence to stop the generation once GPT-3 encounters a given string or set of strings. I set it here as input:. ArrowAn icon representing an arrowSetting the Start Text option. In my case, I added ↵summary, thus every time we submit our prompt, the first thing that will appear in our prompt will be this string, and then our summarized output will follow. ArrowAn icon representing an arrowSetting the Restart Text option. Once the generation has finished, we automatically append this string to be ready for the next summarization request. For this experiment, I set it as input: as this is the prefix for the text that will be summarized. Screenshot of the OpenAI playground showcasing the values I set for Stop Sequence, Start Text and Restart Text In the widget below, hit Submit to see what kind of summary we get without any prompt design. Then, just click on the toggle to try the same but with a proper prompt design. PromptWhile migrating my blog to Next.js, I took the opportunity to address the big performance pitfalls that were degrading the reader's experience in the previous version. With Core Web Vitals becoming one of the biggest factors in search ranking in 2021, I needed to get my act together and finally find workarounds to these issues before they impact my overall traffic. One of those issues was embed tweets. I often find myself in need to quote or reference a tweet in my MDX blog posts. However, using the classic Twitter embed iframe is not the best solution for that: they are slow to load and triggers a lot of Content Layout Shift (CLS) which hurts the performance of my blog. I recently migrated my blog to Next.js and took the opportunity to address some performance issues. One of those issues was due to embed tweets which triggered a lot of CLS. Something that originally caught my attention with Gatsby was its use of GraphQL. It became more of a curiosity over time honestly. While I'm sure it makes sense for many sites at scale (e-commerce, bigger and more complex publications), at least to me the GraphQL felt like an extra level of complexity that felt unnecessary. The more I iterated on my blog, the more the technical choice of GraphQL felt unjustified (for my use-case at least), building data sources felt way more complicated than it should have been. I did not understand why GraphQL was necessary. It ended up slowing me down more than helping me when building my blog Moreover, as the community grew, so did the number of plugins! This is a positive thing, don't get me wrong. But just try to search for RSS in the Gatsby Plugins website. There are 22 plugins (as I'm writing these words) doing more or less the same thing but each of them in a slightly different way. One would need to do a lot of digging to find which one is the "official"/"recommended" one to use which is not ideal. I'm pretty sure a little bit of curation in the plugin section would go a long way. Gatsby plugins are not well curated. It's not easy to find the best plugin for a specific use-case. The short answer to this is that you can't train GPT-3. To "tell" GPT-3 what output you want, you have to use what is referred to by the OpenAI team as the few-shot learning technique where you provide just a few examples of what you expect as input. There are other ways to "guide" GPT-3 into being more specific with its output by using fine-tuning. Toggle on to enable prompt design with the settings detailed above!Submit ✨Reset You can see that: ArrowAn icon representing an arrowwithout a proper prompt design GPT-3 stops generating outputs in the middle of a sentence, and even sometimes includes words of previous examples into the output which is incorrect. ArrowAn icon representing an arrowwith a proper prompt design we're getting some "satisfying" one-line sentence text summaries! This is rather impressive when you consider that so little was needed to get a decent output. It almost feels like magic! ✨ All it took was a few examples provided as input and a proper prompt design. InfoAn icon representing the letter ‘i‘ in a circleYou can head to OpenAI's completion documentation to read more about prompt design and see more examples. As satisfying as it is to see this summarization prompt work, there is yet another problem 😬: it needs a lot of examples, for each request, to perform well. That, my friend, costs a lot of money at scale, especially when you take into account OpenAI's per token pricing model. Fine-tuning We've seen in the previous examples that there are use cases where we'd need it to push few-shot learning one step further like: ArrowAn icon representing an arrowthe necessity for high-quality results, thus more examples, making requests expensive to run, especially at scale. ArrowAn icon representing an arrowthe need for faster results, i.e. lower latency requests Thanks to the new fine-tuning capabilities, we can get an improved version of the technique we learned so far so we do not need to provide GPT-3 with examples for each request. Instead, we'll provide the API with examples beforehand (and lots of them)! There are 3 main steps to this fine-tuning process: ArrowAn icon representing an arrowBuild the dataset: that dataset needs to have a lot of examples to perform well. We can provide these examples in a CSV file, containing a prompt (our inputs) column with a corresponding completion column for example. ArrowAn icon representing an arrowPrepare the dataset: the file containing the examples we just created needs to be cleaned up. The OpenAI CLI provides a command to do just that and that also gives you suggestions on how to format the data for a better result. ArrowAn icon representing an arrowCreate the fine-tuned model: this is as easy as running one CLI command against the file that's been generated by the previous step. Once the creation is complete, the fine-tuned model will appear on the playground and be ready to be used! "We recommend having at least a couple hundred examples. In general, we've found that each doubling of the dataset size leads to a linear increase in model quality" – OpenAI Fine-Tuning documentation Regarding the summarization model we looked at in the previous part, the first thing we need for its fine-tuned version is data! When I worked on this, I found a lot of high quality on Kaggle and mixed those with some of my own summaries, like the ones I featured earlier in the widget showcasing prompt design. I didn't spend enough time on it so the resulting data set is fairly short compared to what's recommended. You can find it h'''
