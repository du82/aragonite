["https://blog.maximeheckel.com/posts/cubic-bezier-from-math-to-motion"]
title = "Cubic Bézier: from math to motion - Maxime Heckel's Blog"
description = "A deep dive into the math behind Bézier curves, from simple linear interpolations to Cubic Bézier and how they are used to describe motion. This article introduces the concepts underneath cubic-bezier and easing timing functions that are used in CSS and Framer Motion transitions through easy-to-understand interactive examples."
full_description = '''HomeCubic Bézier: from math to motionNovember 2, 2021 / 14 min readLast Updated: November 18, 2021Over the past few months, I've been working a lot on my Design System and one aspect of this work that I enjoyed focusing on is micro-interactions ✨. These can be very tedious to get right, but if built properly they can make components go from good to exceptional! However, more recently, I brought my attention to something a bit more subtle. While iterating on a button component hover transition, using timing functions such as linear ease-in or ease-out did not feel quite right. The only way I achieved a satisfying result was to set my CSS transition property to the following: cubic-bezier(0.34, 1.56, 0.64, 1), which I copied-pasted from a Codepen without really knowing what those values and function were doing, which, to be honest with you, is the kind of thing that always bothers me 😅. I like to understand the tools I'm using. So, I went down a rabbit hole of math, animations, and code to have a clear understanding of what cubic-bezier really is, and also what the numbers I passed to that function meant and how they translate to motion. Hence the title of this blog post! We'll first deep dive into the math behind cubic-bezier, then try to visualize how the graphical representation of this function translates into motion and how it relates to other timing functions you might be familiar with. All of that, illustrated through interactive visualizations to allow you to see and tweak the math that's behind these beautiful transitions ⭐️. The math behind Bézier curves First, what's really behind this cubic-bezier function we keep seeing in our CSS codebases? Well, to simply put it, this function defines what is called a Cubic Bézier curve. It's a specific type of curve, that helps represent how a transition goes from an initial state to a final state. Why Cubic? That is where the math part of this article comes in. To start let's look at the definition of the umbrella term "Bézier curve": A Bézier curve is a parametric curve defined by a set of control points We can start our discovery of Bézier curves by looking at their simplest form to understand what these "control points" are, and then slowly make our way up in complexity to reach its cubic form. Linear Interpolation Let's consider two distinct points P0 and P1, and another point P that's located between them. In this scenario, P0 and P1 are the control points of the curve, and P is a point that moves between them. We can define the position of P with a value between 0 and 1 named t that is similar to a percentage: ArrowAn icon representing an arrowif t = 1, P will move to P1 ArrowAn icon representing an arrowif t = 0, P will move to P0 ArrowAn icon representing an arrowany values between 0 and 1 would be a "mix" of P0 and P1 I represented this example in the widget below, where P0 and P1 are at the extremities of the curve, and P is the blue dot moving between them. You'll see that the closer from 1 t is, the closer from the end of the curve P will be. Linear Bézier Curve / Linear interpolationt: 0.00PlayAn icon representing the play symbol, a triangle pointing to the rightRepeatAn icon representing an arrow twisted so it makes a loop This is called a Linear Interpolation. The mathThe math representation of the position of P in the case of a linear interpolation is:P = (1-t)*P0 + t*P1You can try to replace t by 0, or 1 and you'll see that we'll obtain the result we described above. Quadratic Bézier Let's add another point! We can now have two interpolated points, between each segment, moving respectively on the axis P0 -> P1 and P1 -> P2. If we link these two points (the red dots) with a segment and position an interpolated point (the blue dot) on it as well, we'll obtain something rather interesting: Quadratic Bézier Curvet: 0.00PlayAn icon representing the play symbol, a triangle pointing to the rightRepeatAn icon representing an arrow twisted so it makes a loop You can see that the blue dot follows a specific path that resembles a curve. This specifc one is called a Quadratic Bézier curve. The mathLet's do the math to find the equation representing the position of this blue dot at a given time t. We first break down the position of the red dots by using the formula we saw above. The position of these two red dots can be described as two distinct linear interpolations:A = (1-t)*P0 + t*P1B = (1-t)*P1 + t*P2We can describe the position of the blue dots as a linear interpolation as well, but this time between the points A and B:P = (1-t)*A + t*BWe then replace A and BP = (1-t)*[(1-t)*P0 + t*P1] + t*[(1-t)*P1 + t*P2]and we obtain the following formula, which is the formula representing a Quadratic Bézier:P = (1-t)**2 * P0 + 2*(1-t)*t * P1 + t**2 * P2 Here's the Javascript version of that formula that I use to get the coordinates x and y of all the positions of the blue dot for 1 second at 60 frames per second to draw the curve above: 1const quadratic = (P0, P1, P2) => {2 const x0 = P0.x;3 const y0 = P0.y;4 5 const x1 = P1.x;6 const y1 = P1.y;7 8 const x2 = P2.x;9 const y2 = P2.y;10 11 const x = (t) =>12 Math.pow(1 - t, 2) * x0 + 2 * (1 - t) * t * x1 + Math.pow(t, 2) * x2;13 14 const y = (t) =>15 Math.pow(1 - t, 2) * y0 + 2 * (1 - t) * t * y1 + Math.pow(t, 2) * y2;16 17 const res = [];18 19 // Get all the points for a transition at 60 frames per second that lasts 1s20 for (let t = 0; t <= 1; t = t + 1 / 60) {21 const valX = x(t);22 const valY = y(t);23 res.push({ x: valX, y: valY });24 }25 res.push({ x: 1, y: 0 });26 27 return res;28}; Cubic Bézier Now, if we add a fourth point (so we now have the control points P0, P1, P2, and P3), and follow the same process as before: ArrowAn icon representing an arrowwe add an interpolated point between each of the segments that link the 4 points (in red below) ArrowAn icon representing an arrowwe link these interpolated points and define an interpolated point for each of the newly obtained segments (in green) ArrowAn icon representing an arrowwe link again these points, draw a segment between them, and add yet another interpolated point (in blue) we finally obtain a the formula representing a Cubic Bézier curve. I know this may sound very complicated at this point, so I hope the visualization below will do a good job at illustrating how this curve is obtained: Cubic Bézier Curvet: 0.00PlayAn icon representing the play symbol, a triangle pointing to the rightRepeatAn icon representing an arrow twisted so it makes a loop InfoAn icon representing the letter ‘i‘ in a circleThe steps to obtain the formula of the Cubic Bézier would be a bit too long for this blog post. You can try it by yourself if you want, it follows the same method we used to get the Quadratic Bézier curve.Here's the formula that you should end up with:P = (1-t)**3 * P0 + t*P1*(3*(1-t)**2) + P2*(3*(1-t)*t**2) + P3*t**3At this point, you might observe the recursive nature of these curves. We can obtain the next order Bézier curve from the previous one.For the more curious among you, this method is called the De Casteljau algorithm and it allows you to find any point on any Bézier curve. If you want to read more about it, you can head to the corresponding Wikipedia page or to this awesome article that breaks down the math in details. Below you'll find the JS version of that formula which, like its quadratic counterpart, will return all the coordinates x and y of all the points describing the position of the blue dot along this Cubic Bézier curve, for 1 second at 60 frames per second: 1const cubic = (P0, P1, P2, P3) => {2 const x0 = P0.x;3 const y0 = P0.y;4 5 const x1 = P1.x;6 const y1 = P1.y;7 8 const x2 = P2.x;9 const y2 = P2.y;10 11 const x3 = P3.x;12 const y3 = P3.y;13 14 const y = (t) =>15 Math.pow(1 - t, 3) * y0 +16 3 * Math.pow(1 - t, 2) * t * y1 +17 3 * (1 - t) * Math.pow(t, 2) * y2 +18 Math.pow(t, 3) * y3;19 20 const x = (t) =>21 Math.pow(1 - t, 3) * x0 +22 3 * Math.pow(1 - t, 2) * t * x1 +23 3 * (1 - t) * Math.pow(t, 2) * x2 +24 Math.pow(t, 3) * x3;25 26 const res = [];27 28 for (let t = 0; t <= 1; t = t + 1 / 60) {29 const valX = x(t);30 const valY = y(t);31 res.push({ x: valX, y: valY });32 }33 res.push({ x: 1, y: 0 });34 35 return res;36}; Visualizing the motion We just did the hard part! 🎉 We broke down the math behind Bézier curves into small bits and slowly combined them to obtain the Cubic Bézier formula and represent its corresponding curve. Now we can see how this Cubic Bézier curve relates to transition and motion in general. InfoAn icon representing the letter ‘i‘ in a circleIn this section, when we look at the graphical representation of the Cubic Bézier formula, the x axis always represents time and the y axis represents the % of the motion achieved.Note: The y axis is flipped upside down: 0 is at the top, 1 at the bottom. For this part, we consider the Cubic Bézier formula from the previous section and draw its representation but with a twist: ArrowAn icon representing an arrowwe set the control point P0 with the coordinates x:0, y:0 ArrowAn icon representing an arrowwe set the control point P3 with the coordinates x:1, y:1 The reason behind that is that the cubic-bezier function in CSS uses two implicit points: ArrowAn icon representing an arrowP0 represents the initial time x:0 and the initial state y:0. It's the point where our curve starts. ArrowAn icon representing an arrowP3 represents the final time x:1 and the final state y:1. It's the point where our curve ends. Thus, this leaves us with only two control points to define: P1 and P2. Now, remember when I gave the example of a cubic-bezier function I used for one of my transition in the intro? cubic-bezier(0.34, 1.56, 0.64, 1) The four numbers passed to this function are the coordinates of the control points P1 and P2: cubic-bezier(P1.x, P1.y, P2.x, P2.y). Setting those points gives us a specific curve representing the motion that the element with this timing function will follow during its transition. AlertAn icon representing an exclamation mark in an octogoneP1.x and P2.x should always have a value between 0 and 1. To better illustrate that, I built the little Cubic Bezier visualizer below ✨. With it, you can change the position of P1 and P2 by moving the gray handles and get the Cubic Bézier curve corresponding to those values! The visualizer also allows you to: ArrowAn icon representing an arrowsee the position an element (the blue dot in this case) throughout its motion for each frame ArrowAn icon representing an arrowproject the position of the element to observe the change in y value, i.e. the trace of the motion of the element through time, by toggling Project Points on. Cubic Bézier Visualizer By projecting the positions throughout the transition, we can "see" the motion of our element represented by a Cubic Bézier with these specific control points. This is how the "math becomes motion". Some interesting things you can observe with the motion of this point: ArrowAn icon representing an arrowwe render the position of the point at each frame of the motion ArrowAn icon representing an arrowthe further apart two consecutive points in the trace are, the faster the motion is: the blue dot spends "less time" at a given position. ArrowAn icon representing an arrowthe more narrow the gap between two consecutive points in the trace is, the slower the motion is: the blue dot spends "more time" at that given position. InfoAn icon representing the letter ‘i‘ in a circleI also added the ability to plot the derivative of this curve, which represents the velocity of the motion.You can toggle the Derivative switch to make it appear.Note: Given that the y axis is flipped, observing the velocity curve can be a bit confusing: ArrowAn icon representing an arrowthe closer to the top it is, the slower the motion ArrowAn icon representing an arrowthe further from the top it is, the faster the motion Easing functions Now that we know what is truly behind the cubic-bezier CSS function, you might be wondering how the other timing functions you might be familiar with such as ease-in or linear relate to that. In a nutshell, they are actually Cubic Bézier themselves! Cubic Béziers, Cubic Béziers everywhere We can describe any of linear, ease-in, ease-out, ease-out in cubic-bézier form. The only thing to do to obtain these specific timing functions is to set the values of the coordinates for P1 and P2 accordingly. InfoAn icon representing the letter ‘i‘ in a circle ArrowAn icon representing an arrowease = cubic-bezier(0.25,0.1,0.25,1) ArrowAn icon representing an arrowlinear = cubic-bezier(0,0,1,1) ArrowAn icon representing an arrowease-in = cubic-bezier(0.42,0,1,1) ArrowAn icon representing an arrowease-out = cubic-bezier(0,0,0.58,1) ArrowAn icon representing an arrowease-in-out = cubic-bezier(0.42,0, 0.58,1) These are just the set of cubic-bezier timing functions available to us out of the box in CSS. There are many types of "ease" transitions that can be represented with specific Cubic Bézier curves. You can visualize some of those below with their corresponding P1 and P2 points: Cubic Bézier Visualizer Thus, not only uncovering the math behind Cubic Bézier helped us understand the cubic-bézier CSS function, but also a large number of easing functions that are used by many on a day-to-day basis! Cubic Bézier in Framer Motion Another aspect that re-affirms the tight relationship between Cubic Bézier and easing functions can be found in the design choices made in Framer Motion's transition object. Unlike what we've seen so far with CSS, there's is no cubic-bézier function per se in Framer Motion. To describe this type of transition you just need to pass the values of the coordinates of your P1 and P2 points as an array to the ease property: Example of cubic-bezier like transition in Framer Motion1import { motion } from 'framer-motion';2 3const Button = (props) => {4 const buttonVariants = {5 initial: {6 scale: 1,7 },8 hover: {9 scale: 0.94,10 },11 };12 13 return (14 <motion.button15 {...props}16 initial="initial"17 whileHover="hover"18 variants={buttonVariants}19 transition={{20 ease: [0.34, 1.56, 0.64, 1],21 }}22 />23 );24}; InfoAn icon representing the letter ‘i‘ in a circleIf you want to learn more about easing functions and Framer Motion, I wrote a guide to get started with Framer Motion that showcases how to use them and also covers all the basics you need to build delightful transitions. Conclusion Wow, what a ride! We went from looking at cubic-bezier(0.34, 1.56, 0.64, 1) a bit clueless and not knowing what it meant to: ArrowAn icon representing an arrowunderstand the mathematical concepts that govern Bézier curves ArrowAn icon representing an arrowbeing able to draw the graphical representation of Cubic Bézier and understand how it translates to motion ArrowAn icon representing an arrowanalyze the close relationship between cubic-bézier and the easing functions we've always been familiar with Ye'''
