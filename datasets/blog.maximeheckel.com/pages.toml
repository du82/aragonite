["https://blog.maximeheckel.com/posts/scrollspy-demystified"]
title = "Scrollspy demystified - Maxime Heckel's Blog"
description = "A deep dive into how the inner workings of a Scrollspy, Intersection Observers, and how to integrate it with Markdown-based static sites without the need of third party libraries."
full_description = '''HomeScrollspy demystifiedMarch 9, 2021 / 19 min readLast Updated: January 15, 2023Many of you have emailed or DM'ed me asking about how I implemented my table of content component, the little list of titles you'll see appear on the left gutter once you scroll a bit more down, and how I manage to highlight in that list the title of the current paragraph in view. Well, by popular demand, I finally took the time to write about this specific piece of code, and also use this as an opportunity to deep dive into the inner workings of the main trick behind it named... ✨Scrollspy✨ In this article, we'll analyze together an elegant way to implement a Scrollspy, how to abstract it with a Hook for your React project, and finally, I'll add some tips at the end on how you can integrate it with a markdown or MDX based blog to build a little table of content component similar to mine. InfoAn icon representing the letter ‘i‘ in a circleMy deepest apologies to anyone who tried to read the implementation of my TableOfContent component that's currently being used here, it's far from my best work 😅. I hope this blog post will make up for the time lost trying to decipher my code.I also took some time to refactor it and have it not rely on any 3rd party package and will link/feature some of the code at the end of this article. It's all about knowing what's intersecting the viewport Scrollspy is a "technique" that's used to keep track of the content of the user's viewport and highlight the corresponding navigation item. There are many ways to implement a Scrollspy, some of them are very complicated and involve a lot of maths. But you know me, I always prefer simple yet elegant solutions when it comes to tackling UI-related problems; it's just more satisfying that way ✨. In this case, that elegant solution is called the Intersection Observer API. What is the Intersection Observer API? In a nutshell, it's a little tool that you can use in your Javascript frontend code to detect whether a given DOM Node intersects with the document's viewport or another parent element. InfoAn icon representing the letter ‘i‘ in a circle👉 I'll introduce some of the basic concepts and how to use the Intersection Observer API in this blog post. However, if you'd like to read more details about it I encourage you to take a look at the corresponding MDN documentation. How can it be used in the context of a Scrollspy? As mentioned above, the aim of a Scrollspy is being able to keep track of what's currently "in view" for the user, thus what's intersecting with the viewport. In this blog post right now, if your window is big enough to display the table of content, you should see that the title It's all about knowing what's intersecting the viewport being highlighted since its corresponding part is currently "in view". This is because the DOM element wrapping this first part is currently "intersecting" with our viewport, and also because I built my table of content component to highlight the title corresponding to whichever section is intersecting. Sounds pretty straightforward so far right? Well, it because that's pretty much all there is behind this kind of implementation of a Scrollspy. However, there can be more nuances such as: ArrowAn icon representing an arrowWhat if 2 elements intersect at the same time? Should we highlight both corresponding titles? ArrowAn icon representing an arrowHow to take into account something like a fixed header? Regarding the first question, the implementation I introduce here only considers that one section can be highlighted at a time, thus the first section to intersect will be the one highlighted. To answer the second one, we're lucky: the Intersection Observer API allows us to pass a rootMargin option. This option adds margins around the root element/the viewport, before computing whether a section is intersecting or not. For example, adding a rootMargin of "-100px 0px 0px 0px" will add a margin top for our viewport of -100px thus making the intersection of a given element end 100px "earlier". To help visualize these 2 nuances listed above, I built this little widget below: ArrowAn icon representing an arrowThe mini browser lets you scroll a mock web page with different sections. ArrowAn icon representing an arrowEach section will be highlighted whenever it intersects with the viewport using the Intersection Observer API. ArrowAn icon representing an arrowYou can modify the "offset" or rootMargin by adding some negative margin-top to see the intersection between the section and the viewport start/end earlier the more offset you add. ArrowAn icon representing an arrowYou can modify the height of the sections to see how the first section in view is always the one being highlighted. Why use this rather than a scroll event and detecting if the element's scroll position fits in the viewport? Well, there are 2 main reasons behind that: ArrowAn icon representing an arrowPerformance: scroll event listeners run on the main thread whereas Intersection Observers do not. Thus using scroll events to continuously keep track of the current section in view is less performant and you'd probably end up needing to add some kind of throttling mechanism. @AggArvanitakis covers this in-depth in his blog post comparing both Intersection Observers and Scroll event performance. ArrowAn icon representing an arrowFinding if an element's scroll position fits within the viewport requires ~~a bit of~~ maths and I didn't like it 🤢. You can see by yourself with the code snippet below which is way harder to parse than what we're about to see. Implementation of isInView, a function that returns true if an element is in view1const isInView = (element: Element, offset: number = 0) => {2 const rect = element.getBoundingClientRect();3 4 const scrollTop =5 document.documentElement.scrollTop || document.body.scrollTop;6 7 const scrollBottom = scrollTop + window.innerHeight;8 9 const elemTop = rect.top + scrollTop;10 const elemBottom = elemTop + element.offsetHeight;11 12 const isVisible =13 elemTop < scrollBottom - offset && elemBottom > scrollTop + offset;14 return isVisible;15}; Abstracting the implementation in a React Hook Now that we've taken a look at how we can leverage the Intersection Observer API to implement a Scrollspy, let's abstract all the implementation details in a little React Hook so it can be easily used in any current or future project. AlertAn icon representing an exclamation mark in an octogoneThe implementation I'm going to introduce here is very opinionated towards making this work solely for the use-case of a Scrollspy. It can be abstracted/implemented in many different ways that are more or less opinionated but for this article, I'm keeping this close to our main topic on purpose.Of course, do reach out if you have a better implementation 😄 I'm always looking for new patterns or ways to build stuff! First steps with Intersection Observers Let's take a look at the code necessary to instantiate a new Intersection Observer in Javascript and have it observe a set of elements: Basic usage of the Intersection Observers API1const observer = new IntersectionObserver((entries) => {2 entries.forEach((entry) => {3 console.log(entry.isIntersecting); // returns true if this entry is intersecting with the viewport4 console.log(entry.intersectionRatio); // returns a number between 0 and 1 representing the ratio of the element intersecting with the viewport5 });6});7 8const targetElements = document.querySelectorAll('section');9 10observer.observe(targetElements); As you can see, there're 2 main things to do to get started: ArrowAn icon representing an arrowCreate the Intersection Observer and pass a callback function to it. That callback takes 2 arguments entries and observer but we only need to use the first one in our use-case. Entries is an array of objects where each object describes the intersection of one of the elements that we're observing. ArrowAn icon representing an arrowStart observing 🔍! For that, we need to create an array of elements to observe and call observer.observe(...). InfoAn icon representing the letter ‘i‘ in a circleOnce you're done "observing" one of the target elements or the whole set you can either call: ArrowAn icon representing an arrowobserver.unobserve(...) to stop observing a specific element ArrowAn icon representing an arrowobserver.disconnect() to stop the Intersection Observer completely. That's it! You now know how to use the Intersection Observer API to observe how a set of elements intersects with the viewport 🎉! Building an efficient Hook I'm sure there are many ways to abstract this but building an efficient Hook and avoid instantiating Intersection Observers all over the place can be pretty challenging. First, we need to create our Intersection Observer as we did above and wrap it in a useRef Hook. This way we can keep track of the state of any intersection across rerenders and also if we were to update our Intersection Observer, we would not trigger a rerender. The second key step for our Hook implementation is to know when we should start observing. For that, we can use useEffect so we can start observing as soon as the component using our Hook mounts: First iteration of our useScrollspy Hook1const useScrollspy = (elements: Element[]): [number] => {2 const observer = React.useRef<IntersectionObserver>(3 new IntersectionObserver((entries) => {4 // find the index of the section that is currently intersecting5 const indexOfElementIntersecting = entries.findIndex((entry) => {6 // if intersection > 0 it means entry is intersecting with the view port7 return entry.intersectionRatio > 0;8 });9 10 // TODO store the value of indexOfElementIntersecting11 })12 );13 14 React.useEffect(() => {15 // observe all the elements passed as argument of the hook16 elements.forEach((element) => observer.current.observe(element));17 18 // disconnect the observer once the component unmounts;19 return () => observer.current.disconnect();20 }, [elements]);21 22 // TODO return the index of the element in the elements array that is currently intersecting23 return [0];24}; This works perfectly, but a few things could go wrong: ArrowAn icon representing an arrowaccessing current directly as we do here to observe and disconnect our Intersection Observer is not safe. The current we access on mount is not guaranteed to be the same when unmounting (remember, we can update the ref without triggering a rerender). ArrowAn icon representing an arrowif we were to change the target elements our effect will run again and we'll start keeping track of the new elements which is great! But... we didn't stop keeping track of the older elements (since we didn't unmount). Thus to avoid this scenario from breaking our app, the best thing to do is to check for any existing Intersection Observers currently instantiated and disconnect them every time our effect runs: Improved version of our useScrollspy Hook handling unwanted side effect1const useScrollspy = (elements: Element[]): [number] => {2 const observer = React.useRef<IntersectionObserver>(3 new IntersectionObserver((entries) => {4 // find the index of the section that is currently intersecting5 const indexOfElementIntersecting = entries.findIndex((entry) => {6 // if intersection > 0 it means entry is intersecting with the view port7 return entry.intersectionRatio > 0;8 });9 10 // TODO store the value of indexOfElementIntersecting11 })12 );13 14 React.useEffect(() => {15 const { current: ourObserver } = observer;16 // disconnect any previously instanciated observers17 ourObserver.disconnect();18 19 // observe all the elements passed as argument of the hook20 elements.forEach((element) => ourObserver.observe(element));21 22 // disconnect the observer once the component unmounts;23 return () => ourObserver.disconnect();24 }, [elements]);25 26 // TODO return the index of the element in the elements array that is currently intersecting27 return [];28}; Great, we're almost there! The last step now is to set what to return! For simplicity here, we're only going to return the index of the target currently intersecting with the viewport. For that, we can initiate a new state to keep track of the index of the target currently intersecting, and set that state accordingly in the callback of our Intersection Observer: Implementation of useScrollspy returning the index of the current target intersecting1const useScrollspy = (elements: Element[]): [number] => {2 const [3 currentIntersectingElementIndex,4 setCurrentIntersectingElementIndex,5 ] = React.useState(-1);6 7 const observer = React.useRef<IntersectionObserver>(8 new IntersectionObserver((entries) => {9 // find the index of the section that is currently intersecting10 const indexOfElementIntersecting = entries.findIndex((entry) => {11 // if intersection > 0 it means entry is intersecting with the view port12 return entry.intersectionRatio > 0;13 });14 15 // store the value of indexOfElementIntersecting16 setCurrentIntersectingElementIndex(indexOfElementIntersecting);17 })18 );19 20 React.useEffect(() => {21 const { current: ourObserver } = observer;22 // disconnect any previously instanciated observers23 ourObserver.disconnect();24 25 // observe all the elements passed as argument of the hook26 elements.forEach((element) => ourObserver.observe(element));27 28 // disconnect the observer once the component unmounts;29 return () => ourObserver.disconnect();30 }, [elements]);31 32 // return the index of the element in the elements array that is currently intersecting33 return [currentIntersectingElementIndex];34}; A few things to note here: ArrowAn icon representing an arrowusing findIndex will return the index of the first target intersecting. ArrowAn icon representing an arrowwe set this index in a local state in that hook. Even though we may be calling set state over and over in that callback it will not impact performance since most of the time we'll be setting the same value that is already in the state. Handling offsets and custom settings Our Hook is now almost operational! One last thing to take into account is to have the ability to pass a custom root element and a custom root margin: ArrowAn icon representing an arrowwe need the first one so I can set a custom parent element that is not the main viewport, like for the playground below 😛 (it might also come in handy for you in the future) ArrowAn icon representing an arrowwe need the second one to allow our ScrollSpy to handle offset such as a header as we saw in the widget in the first part of this blog post. Here's how I abstracted them: Implementation of useScrollspy with options1const useScrollspy = (2 elements: Element[],3 options?: {4 offset?: number;5 root?: Element;6 }7): [number] => {8 const [9 currentIntersectingElementIndex,10 setCurrentIntersectingElementIndex,11 ] = React.useState(-1);12 13 const rootMargin = `-${(options && options.offset) || 0}px 0px 0px 0px`;14 15 const observer = React'''
