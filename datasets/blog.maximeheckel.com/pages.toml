title = "Shining a light on Caustics with Shaders and React Three Fiber - Maxime Heckel's Blog"
description = "A step-by-step guide on how to build a caustic light effect for your React Three Fiber project using shaders, render targets, normal maps, and custom materials."
full_description = '''HomeShining a light on Caustics with Shaders and React Three FiberJanuary 23, 2024 / 29 min readLast Updated: January 23, 2024Since my work on refraction and chromatic dispersion from early 2023, I have not ceased to experiment with light effects and shaders, always trying to strike the right balance between realism, aesthetics, and performance. However, there's one light effect that I was eager to rebuild this entire time: Caustics. Those beautiful swirls of light can be visible when light rays travel through a transmissive or transparent curved surface, such as a glass of water or the surface of a shallow lake, and converge on a surface after being refracted. I've been obsessing with Caustics since day one of working with shaders (ask @pixelbeat, he'll tell you). I saw countless examples reproducing the effect on Blender, Redshift, or WebGL/WebGPU, each one of them making me more keen to build my own implementation to fully understand how to render them for my React Three Fiber projects. Example of caustic patterns made in blender, redshift and webGPU by (left to right) @wes_cream, @active_theory, and @pixelbeat who kindly volunteered some of his time to make a custom/special render with my logo for this blog post 🙏. I not only wanted to rebuild a Caustic effect with my shader knowledge from scratch, but I also wanted to reproduce one that was both real-time and somewhat physically based while also working with a diverse set of geometries. After working heads down, step-by-step, for a few weeks, I reached this goal and got some very satisfying results 🎉 <img alt="MaximeHeckel" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" srcSet="/_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fprofile_images%2F813646702553010176%2FrOM8J8DC_normal.jpg&amp;w=48&amp;q=75 1x, /_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fprofile_images%2F813646702553010176%2FrOM8J8DC_normal.jpg&amp;w=96&amp;q=75 2x" src="/_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fprofile_images%2F813646702553010176%2FrOM8J8DC_normal.jpg&amp;w=96&amp;q=75"/>Maxime@MaximeHeckellight refraction dispersion caustics ✨ https://t.co/un43RCge6S3:57 PM - Dec 6, 20237222 While I documented my progress on Twitter showcasing all the steps and my train of thought going through this project, I wanted to dedicate a blog post to truly shine a light on caustics (🥁) by walking you through the details of the inner workings behind this effect. You'll see in this article how, by leveraging normals, render targets, and some math and shader code, you can render those beautiful and shiny swirls of light for your own creations. AcknowledgmentsReproducing this effect without the following resources: ArrowAn icon representing an arrowRendering Realtime Caustics in WebGL by Evan Wallace ArrowAn icon representing an arrowDrei's own Caustic component which served as my north star ArrowAn icon representing an arrowCaustics and the Photon Tracing Kernel ArrowAn icon representing an arrowWhat Are Caustics and How to Render Them the Right Way and many thanks to @N8Programs for his original work on caustics and the guidance which I really needed when starting this project and to @Andersonmancini for listening to my rambling when I was getting stuck. Anatomy of a Caustic Effect in WebGL In this first part, we'll look at the high-level concepts behind this project. To set the right expectations from the get-go: We're absolutely going to cheat our way through this. Indeed, if we wanted to reproduce Caustics with a high degree of accuracy, that project would probably fall into the domain of raytracing, which would be: ArrowAn icon representing an arrowWay out of reach given my current skill set as of writing this article. ArrowAn icon representing an arrowVery resource-intensive for the average computer out there, especially as we'd want most people to be able to see our work. Thus, I opted for a simpler yet still somewhat physically based approach for this project: ArrowAn icon representing an arrowWe'll simulate in a fragment shader the refracted rays from a light source going through a target mesh. ArrowAn icon representing an arrowWe'll render the resulting pattern in a caustic plane which we'll then scale and position accordingly based on the position of the light source in relation to our object. Diagram showcasing the high level components of our scene that will serve us to render a caustic effect Simulating how the caustic pattern works can seem quite tricky at first. However, if we look back at the definition established in the introduction, we can get hints for how to proceed. The light pattern we're aiming to render originates from rays hitting a curved surface, which nudges us toward relying on the Normal data of our target mesh (i.e. the surface data). On top of that, based on some preliminary research, knowing whether our rays of light converge or diverge after hitting our surface will determine the final look of our caustics. Diagram showcasing the impact of the shape of the surface on the intensity of the resulting caustic effect InfoAn icon representing the letter ‘i‘ in a circleIf you're looking for more detailed reading on the effect itself, here are some links that were useful to me during my own research: ArrowAn icon representing an arrowCaustics and the Photon Tracing Kernel ArrowAn icon representing an arrowWhat Are Caustics and How to Render Them the Right Way Extracting Normals Let's take a stab at extracting the Normal data of our target mesh! With it, we'll know the overall "shape" of our mesh which influences the final look of our caustics. Since we'll need to read that data down the line in a shader to simulate our Caustic effect, we would want to have it available as a texture. That means it's time to dedust your good ol' render target skills because we'll need them here. Render TargetsI wrote a dedicated blog post on render targets last year that goes through all the use cases alongside many examples and demos. If you have not read it yet or need a little refresher, take a glance at it before continuing 😊. As always, we'll start by defining our render target, or Framer Buffer Object (FBO), using the useFBO hook provided by @react-three/drei: this is where we'll render our target mesh with a "normal" material and take a snapshot of it to have that data available as a texture later on. Instantiating our normalRenderTarget in our Caustics scene1const Caustics = () => {2 const mesh = useRef();3 const causticsPlane = useRef();4 5 const normalRenderTarget = useFBO(2000, 2000, {});6 7 useFrame((state) => {8 const { gl } = state;9 // ...10 });11 12 return (13 <>14 <mesh ref={mesh} position={[0, 6.5, 0]}>15 <torusKnotGeometry args={[10, 3, 16, 100]} />16 <MeshTransmissionMaterial backside {...rest} />17 </mesh>18 <mesh19 ref={causticsPlane}20 rotation={[-Math.PI / 2, 0, 0]}21 position={[5, 0, 5]}22 >23 <planeGeometry />24 <meshBasicMaterial />25 </mesh>26 </>27 );28}; We'll also need a dedicated camera for our render target, which I intuitively placed where our light source would be since it will get us a view of the normals our light rays will interact with. That camera will point towards the center of the bounds of our target mesh using the lookAt function. Setting up a dedicated camera for our render target1const light = new THREE.Vector3(-10, 13, -10);2 3const normalRenderTarget = useFBO(2000, 2000, {});4 5const [normalCamera] = useState(6 () => new THREE.PerspectiveCamera(65, 1, 0.1, 1000)7);8 9useFrame((state) => {10 const { gl } = state;11 12 const bounds = new THREE.Box3().setFromObject(mesh.current, true);13 14 normalCamera.position.set(light.x, light.y, light.z);15 normalCamera.lookAt(16 bounds.getCenter(new THREE.Vector3(0, 0, 0)).x,17 bounds.getCenter(new THREE.Vector3(0, 0, 0)).y,18 bounds.getCenter(new THREE.Vector3(0, 0, 0)).z19 );20 normalCamera.up = new THREE.Vector3(0, 1, 0);21 22 //...23}); Up vectorWhen I first tried to get this camera setup, I noticed that moving its position could cause unwanted rotations of the camera, leading to weird inverted caustic patterns that didn't make much sense. I found out that locking the up vector of the camera to a specific vector, like in this case THREE.Vector3(0, 1, 0) helped to prevent this issue from happening We now have all the elements to capture our Normal data and project it onto the "caustic plane": ArrowAn icon representing an arrowIn our useFrame hook, we first swap the material of our target mesh with a material that renders the normals of our mesh. In this case, I used a custom shaderMaterial (optional, but gives us more flexibility as you'll see in the next part), but you can also use normalMaterial. 1// Custom Normal Material2const [normalMaterial] = useState(() => new NormalMaterial());3 4useFrame(() => {5 const originalMaterial = mesh.current.material;6 7 mesh.current.material = normalMaterial;8 mesh.current.material.side = THREE.BackSide;9}); ArrowAn icon representing an arrowThen, we take a snapshot of our mesh by rendering it in our render target. 1gl.setRenderTarget(normalRenderTarget);2gl.render(mesh.current, normalCamera); ArrowAn icon representing an arrowFinally, we can restore the original material of our mesh and pass the resulting texture in the map property of our temporary caustic plane material, allowing us to visualize the output. 1mesh.current.material = originalMaterial;2 3causticsPlane.current.material.map = normalRenderTarget.texture;4 5gl.setRenderTarget(null); Diagram showcasing the process of swapping the material of the target mesh to our normal material to then render it in a dedicated render target to obtain a texture that can be used as input to any material With this small render pipeline, we should be able to see our Normal data visible on our "caustic plane" thanks to the texture data obtained through our render target. This will serve as the foundations of our Caustic effect! InfoAn icon representing the letter ‘i‘ in a circleI included a small widget in the demo above to let you move the position of the light source in this scene. Try to change the different coordinates and see how the normals rendered on the plane change as you update the position vector of the light, i.e., the normalCamera used in the render target. Building our Caustics material With what we just accomplished, we have, through our FBO, a texture representing the normals of our target mesh. Having that data as a texture is very versatile because not only can we render it as we just did, but more importantly we can pass it to other shaders to do some computation. Which is exactly what we're going to do in this part! We will take our Normal data and simulate light rays going through those normals and then interpret the output to create our caustics pattern. Calculating caustics intensity At first, I didn't know how to use my Normal data to obtain the desired effect as an output. I tried my luck with using a weird mix of sin functions in the fragment shader of my caustic plane, but that didn't yield something even remotely close to what I wanted to achieve: <img alt="MaximeHeckel" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" srcSet="/_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fprofile_images%2F813646702553010176%2FrOM8J8DC_normal.jpg&amp;w=48&amp;q=75 1x, /_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fprofile_images%2F813646702553010176%2FrOM8J8DC_normal.jpg&amp;w=96&amp;q=75 2x" src="/_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fprofile_images%2F813646702553010176%2FrOM8J8DC_normal.jpg&amp;w=96&amp;q=75"/>Maxime@MaximeHeckelthat's a start I guess 🤔 https://t.co/UCEFoXgrQ1<img alt="that&#x27;s a start I guess 🤔 https://t.co/UCEFoXgrQ1" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="c-kBDlyF" srcSet="/_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fmedia%2FF_O8siBW0AA42tS.jpg&amp;w=3840&amp;q=75 1x" src="/_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fmedia%2FF_O8siBW0AA42tS.jpg&amp;w=3840&amp;q=75"/><img alt="MaximeHeckel" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" srcSet="/_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fprofile_images%2F813646702553010176%2FrOM8J8DC_normal.jpg&amp;w=48&amp;q=75 1x, /_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fprofile_images%2F813646702553010176%2FrOM8J8DC_normal.jpg&amp;w=96&amp;q=75 2x" src="/_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fprofile_images%2F813646702553010176%2FrOM8J8DC_normal.jpg&amp;w=96&amp;q=75"/>Maxime@MaximeHeckelStarted working on my own Caustics shader 🧪 So far I'm thinking about storing the normals of the target geometry in an FBO then project the texture data onto the plane based on the distance to the ground and light position 🤔 Any tips? (yes this will be in a blog post!)3:39 AM - Nov 18, 20232345:34 PM - Nov 18, 202319 On top of that, I also had this idea for my Caustics effect to be able to take on additional effects such as chromatic aberration or blur, as I really wanted the output not to be too sharp to look as natural as possible. Hence, I could not directly render the pattern onto the final plane; instead, I'd have to use an intermediate mesh with a custom shader material to do all the necessary math and computation I needed. Then, that would allow me through yet another FBO to apply as many effects to the output as I wanted on the final caustics plane itself. Diagram showcasing how, from the normal texture we just obtained, we can compute a caustic pattern that can then be projected as a texture itself onto the caustic plane. To do so, we can leverage a FullScreenQuad geometry that we will not render within our scene but instead instantiate on its own and use it within our useFrame hook. Setting up our causticsComputeRenderTarget and FullScreenQuad1const causticsComputeRenderTarget = useFBO(2000, 2000, {});2const [causticsQuad] = useState(() => new FullScreenQuad()); We then attach to it a custom shaderMaterial that will perform the following tasks: ArrowAn icon representing an arrowCalculate the refracted ray vector from our light source going through the surface of our mesh, represented here by the Normal texture we created in the first part. ArrowAn icon representing an arrowApp'''
