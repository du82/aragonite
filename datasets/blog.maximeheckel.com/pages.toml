["https://blog.maximeheckel.com/posts/build-personal-health-api-shortcuts-serverless"]
title = "Using Shortcuts and serverless to build a personal Apple Health API - Maxime Heckel's Blog"
description = "Take ownership of your Apple Watch health data with a only few lines of code."
full_description = '''HomeUsing Shortcuts and serverless to build a personal Apple Health APINovember 2, 2020 / 20 min readLast Updated: June 11, 2023I've been an Apple Watch owner for a couple of years now, and the ability to get a detailed report about diverse aspects of my health has always been its most interesting feature to me. However, having that data trapped in the Apple ecosystem is a bit of a bummer. I've always wanted to build my own Health Dashboard, like the one you can see on http://aprilzero.com/ and Gyroscope's, but custom made. The only issue blocking me was the lack of an API that could allow me to query the data that's been recorded by my watch. Moreover, it seems like I'm also far from being the only one in this situation. A lot of people on reddit or Apple support keep asking whether that API exists or not. Well, good news if you're in this situation as well, I recently figured out a way to build a personal Apple Health API! In this article, I'm going to show you how, by using a combination of Apple Shortcuts and serverless functions, you can implement a way to transfer recorded Apple Watch health samples to a Fauna database and, in return, get a fully-fledged GraphQL API. That same API is what is powering this little widget above, showcasing my recorded heart rate throughout the day. How cool is that? The chart will automatically refresh every now and then (I'm still finalizing this project) so if you're lucky, you might even catch a live update! Heart Rate Widget source code Context and plan Back in 2016-2017, I built a "working" personal health API. I relied on a custom iOS app that would read my Apple Health data and run in the background to send the data. InfoAn icon representing the letter ‘i‘ in a circleIf you're interested to take a look at my previous take at a personal Apple Health API, the codebase is still available on my Github: ArrowAn icon representing an arrowhttps://github.com/MaximeHeckel/healthpulse ArrowAn icon representing an arrowhttps://github.com/MaximeHeckel/health-dashboard It's always nice to look back at some old code and the progress one makes over the years 😊 This implementation, although pretty legitimate, had its flaws: ArrowAn icon representing an arrowit needed a server running 24/7 to be available to receive the data and write it to the database. However, the data would only be pushed maybe twice to three times a day. ArrowAn icon representing an arrowthe iOS app I build with React Native was pretty limited. For example, Apple doesn't let you run specific actions within your app on a schedule. You have no real control over what your app will do while in the background. Additionally, the HealthKit package I was using was really limited and did not allow me to read most of the data entries I was interested in, and on top of that, the package was pretty much left unmaintained thus ending up breaking my app. Today, though, we can address these 2 flaws pretty easily. For one, we can replace the server on the receiving end of the data with a serverless function. Moreover, instead of having to build a whole iOS app, we can simply build an Apple Shortcut which not only is way easier as it integrates well better with the ecosystem, it also allows us to run tasks on a schedule! Thus, with these elements, I came out with the following plan that can allow us to build a Apple Health API powered with a shortcut and a serverless function: Diagram showcasing the different elements of this project described below Here's the flow: ArrowAn icon representing an arrowWhen running, our shortcut will read the daily measurements (heart rate, steps, blood oxygen, activity, ...), and send a POST request to the serverless function ArrowAn icon representing an arrowThe serverless function, hosted on Vercel, will receive that data, sanitize it, and then send a GraphQL mutation to FaunaDB (I'll get into why I chose FaunaDB later in the article) ArrowAn icon representing an arrowOn FaunaDB, we'll store each daily entry in its own document. If the entry doesn't exist, we'll create a document for it. If it does exist, we'll update the existing entry with the new data ArrowAn icon representing an arrowAny client can query the database using GraphQL and get the health data. Now that we've established a plan, let's execute it 🚀! A shortcut to read and send Apple Health data Shortcuts are at the core of our plan. The one we're going to build is the centerpiece that allows us to extract our health data out of the Apple ecosystem. As Apple Shortcuts can only be implemented in the Shortcuts app, and are purely visual, I'll share screenshots of each key steps, and describe them. Screenshots of the Shortcuts app editor showcasing the different steps executed when running the shortcut described below The first step consists of finding health samples of a given type. For this example, we'll get both the heart rate, and the number of steps (see the first two screenshots). You can see that the options available to you in the "Find Health Sample" action may vary depending on which metric you're trying to read, you can tune these at will, the ones showcased above are the options I wanted for my specific setup: ArrowAn icon representing an arrowHeart Rate measurements are not grouped and are sorted by start date ArrowAn icon representing an arrowSteps measurements are grouped by hour, I want to have an entry for hours where no steps are recorded, and I want it sorted by start date as well You may also note that I set a variable for each sample. This is necessary to reference them in steps that are declared later in the shortcut. In the second step, we get the current date (the one from the device, more on that later), and we trigger a request with the "Get Contents Of" action where we pass the URL where our serverless function lives, as well as the body of our POST request. Regarding the body, we'll send an object of type JSON, with a date field containing the current date, a steps, and a heart field, both of type dictionary, that are respectively referencing the Steps and Heart variables that were declared earlier. InfoAn icon representing the letter ‘i‘ in a circleFor both the Heart and Steps dictionaries, we'll have to manually set the fields. Here's how these dictionaries look like on my end (you can of course adjust those based on your needs):Screenshot of the heart rate and steps dictionaries used in the body of the HTTP POST request of our shortcutIn the values field, we set the values of the sample. In timestamps we set the start dates of that same sample. There's one issue here though: every health sample in the Shortcuts app is in text format separated by \n. Thus, I had to set the two fields in each dictionary as text and I couldn't find an efficient way to parse these samples within the shortcut itself. We'll have to rely on the serverless function in the next step to format that data in a more friendly way. In the meantime, here's a snapshot of the samples we're sending: Example of payload sent by the shortcut1{2 heart: {3 hr: '86\n' +4 '127\n' +5 '124\n' +6 '126\n' +7 '127\n' +8 '124\n' +9 '125\n' +10 '123\n' +11 '121\n' +12 '124\n' +13 dates: '2020-11-01T16:12:06-05:00\n' +14 '2020-11-01T15:59:40-05:00\n' +15 '2020-11-01T15:56:56-05:00\n' +16 '2020-11-01T15:56:49-05:00\n' +17 '2020-11-01T15:56:46-05:00\n' +18 '2020-11-01T15:56:38-05:00\n' +19 '2020-11-01T15:56:36-05:00\n' +20 '2020-11-01T15:56:31-05:00\n' +21 '2020-11-01T15:56:26-05:00\n' +22 '2020-11-01T15:56:20-05:00\n' +23 },24 steps: {25 count: '409\n5421\n70\n357\n82\n65\n1133\n3710\n0\n0\n12',26 date: '2020-11-02T00:00:00-05:00\n' +27 '2020-11-01T23:00:00-05:00\n' +28 '2020-11-01T22:00:00-05:00\n' +29 '2020-11-01T21:00:00-05:00\n' +30 '2020-11-01T20:00:00-05:00\n' +31 '2020-11-01T19:00:00-05:00\n' +32 '2020-11-01T18:00:00-05:00\n' +33 '2020-11-01T17:00:00-05:00\n' +34 '2020-11-01T16:00:03-05:00\n' +35 '2020-11-01T15:10:50-05:00\n' +36 },37 date: '2020-11-01'38} A great use case for serverless As mentioned in the first part, I used to run a very similar setup to get a working personal Apple Health API. However, running a server 24/7 to only receive data every few hours might not be the most efficient thing here. If we look at the plan we've established earlier, we'll only run our Shortcuts a few times a day, and we don't have any requirements when it comes to response time. Thus, knowing this, we have a perfect use case for serverless functions! Vercel is my service of choice when it comes to serverless functions. This is where I deployed my function for this side project, however, it should work the same on other similar services. InfoAn icon representing the letter ‘i‘ in a circleI do not want to spend too much time in this article detailing how to set up a function on Vercel, it can be pretty dense. However, in case you need it, here's a quick list of the steps I followed to initiate the repository for my function: ArrowAn icon representing an arrowCreate a folder for our function ArrowAn icon representing an arrowRun yarn init to initiate the repository ArrowAn icon representing an arrowCreate an /api folder and a health.js file within this folder. This is the file where we'll write our function. ArrowAn icon representing an arrowInstall the vercel package with yarn add -D vercel ArrowAn icon representing an arrowAdd the following script in your package.json: "start": "vercel dev". If you need more details here's a direct link to the documentation on how to get started with serverless functions on Vercel. Our function will have 2 main tasks: ArrowAn icon representing an arrowsanitize the data coming from the shortcut. Given the output of the shortcut that we looked at in the previous part, there's some cleanup to do ArrowAn icon representing an arrowsend the data to a database (that will be detailed in the next part) Below is the code I wrote as an initial example in /api/health.js, that will sanitize the health data from the shortcut, and log all the entries. I added some comments in the code to detail some of the steps I wrote. Serverless function handling and formatting the data coming from our shortcut1import { NowRequest, NowResponse } from '@now/node';2 3/**4 * Format the sample to a more friendly data structure5 * @param {values: string; timestamps: string;} entry6 * @returns {Array<{ value: number; timestamp: string }>}7 */8const formathealthSample = (entry: {9 values: string;10 timestamps: string;11}): Array<{ value: number; timestamp: string }> => {12 /**13 * We destructure the sample entry based on the structure defined in the dictionaries14 * in the Get Content Of action of our shortcut15 */16 const { values, timestamps } = entry;17 18 const formattedSample = values19 // split the string by \n to obtain an array of values20 .split('\n')21 // [Edge case] filter out any potential empty strings, these happen when a new day starts and no values have been yet recorded22 .filter((item) => item !== '')23 .map((item, index) => {24 return {25 value: parseInt(item, 10),26 timestamp: new Date(timestamps.split('\n')[index]).toISOString(),27 };28 });29 30 return formattedSample;31};32 33/**34 * The handler of serverless function35 * @param {NowRequest} req36 * @param {NowResponse} res37 */38const handler = async (39 req: NowRequest,40 res: NowResponse41): Promise<NowResponse> => {42 /**43 * Destructure the body of the request based on the payload defined in the shortcut44 */45 const { heart, steps, date: deviceDate } = req.body;46 47 /**48 * Format the steps data49 */50 const formattedStepsData = formathealthSample(steps);51 console.info(52 `Steps: ${53 formattedStepsData.filter((item) => item.value !== 0).length54 } items`55 );56 57 /**58 * Format the heart data59 */60 const formattedHeartData = formathealthSample(heart);61 console.info(`Heart Rate: ${formattedHeartData.length} items`);62 63 /**64 * Variable "today" is a date set based on the device date at midninight65 * This will be used as way to timestamp our documents in the database66 */67 const today = new Date(`${deviceDate}T00:00:00.000Z`);68 69 const entry = {70 heartRate: formattedHeartData,71 steps: formattedStepsData,72 date: today.toISOString(),73 };74 75 console.log(entry);76 77 // Write data to database here...78 79 return res.status(200).json({ response: 'OK' });80};81 82export default handler; Then, we can run our function locally with yarn start, and trigger our Apple shortcut from our iOS device. Once the shortcut is done running, we should see the health entries that were recorded from your Apple Watch logged in our terminal 🎉! AlertAn icon representing an exclamation mark in an octogoneDon't forget to update the URL in your shortcut! It will be equivalent to something like http://[your-computers-local-ip]:3000/api/health. Now that we have a basic serverless function that can read and format the data set from our shortcut, let's look at how we can save that data to a database. Storing the data and building an API on FaunaDB InfoAn icon representing the letter ‘i‘ in a circleThis part is purely optional. You could store your data any way you want, on any service. I'm now going to solely detail how I proceeded on my end, which may or may not be the most optimal way.Again, I wanted to have this hack up and running fast because I love iterating on ideas so I can share them with all of you quicker 😄 In this part, we'll tackle storing the data, and building an API for any client app. Luckily for us, there are tons of services out there that can do just that, but the one I used in this case is called Fauna. Why Fauna? When building the first prototype of my Apple Health API I wanted to: ArrowAn icon representing an arrowHave a hosted database. I did not want to have to manage a cluster with a custom instance of Postgres or MySQL or any other type of database. ArrowAn icon representing an arrowHave something available in a matter of seconds, ArrowAn icon representing an arrowHave a service with complete support for GraphQL so I did not have to build a series of API endpoints. ArrowAn icon representing an arrowHave a database accessible directly from any client app. My idea was to be able to simply send GraphQL queries from a frontend app, directly to the database and get the data back. Fauna was checking all the boxes for this project. My objective here was to privilege speed by keeping things as simple as possible and use something that would allow me to get what I want with as little code as possible (as a frontend engineer, I don't like to deal with backend services and databases too much 😅) GraphQL I didn't want to build a bunch of REST endpoints, thus why I picked GraphQL here. I've played with it in the past and I liked it. It's also pretty popular among Frontend engineers. If you want to learn more about it, here's a great link to help you get started As advertised on their website, Fauna supports GraphQL out of the box. Well, sort of. You can indeed get pretty far by writing your '''
