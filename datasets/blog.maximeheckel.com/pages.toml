title = "Build your own preview deployment service - Maxime Heckel's Blog"
description = "Do you want to increase your team's development velocity and collaboration? Preview Deployments are one of the key pieces for that, and this post details how to implement your own serverless deployment service based on Google Cloud Run."
full_description = '''HomeBuild your own preview deployment serviceAugust 25, 2020 / 15 min readLast Updated: August 25, 2020Preview deployments are an essential step in the CI/CD pipelines of many frontend teams. The ability to preview every frontend change in a hosted and self-contained environment can increase the development velocity of a team quite significantly. Moreover, it brings more confidence that any newly added change will not bring any undesirable effect that would not get caught by automated tests before getting merged to production. I wanted to bring this kind of service to my team at work, however, using one of the already available platforms that provided preview deployments out of the box such as Netlify, Vercel or Serverless was not an option. All our services and deployments were either managed on Google Cloud or Firebase. Thus, if we wanted a preview deployment service, we would have to build it on Google's Cloud platform. Luckily, Google provides a great serverless service called Cloud Run. Cloud Run enables teams to deploy containers to production in a matter of seconds! Thus, I chose it as the service where the preview deployments would live, then built an automated pipeline around it that would deploy any change made to an app on every pull request and returned a URL to access that new version of that same app. In this article, we will go through each step to implement such an automated pipeline and build your own preview deployment service on Google Cloud Run as I did 🚀. InfoAn icon representing the letter ‘i‘ in a circleI'm only going to focus on my implementation of preview deployments on Google Cloud Run in this post. However, I'm pretty convinced a similar approach is doable on AWS lambda or other serverless platforms. The perfect preview deployments developer experience You might have seen this "preview deployments" feature in many other tools or SaaS out there, but I wanted to put together the list of elements that compose a great preview deployments developer experience before deep diving in my implementation. I used this list as my "north star" when building the automated pipeline and looking for how to host my previews, and the following are the key items I took into account: ArrowAn icon representing an arrowautomated: whether it's on every push or every pull request event, the developer should not need to execute any command manually to make the preview operational. ArrowAn icon representing an arroweasily accessible: once deployed, your preview deployment should have a unique link that allows anyone to access that specific version of your frontend app. ArrowAn icon representing an arrowfast: the whole process of getting your app deployed should last no more than a couple of minutes ArrowAn icon representing an arrowself-actualized: each new change on the same branch or pull request should be deployed (preferably) on top of the other one ArrowAn icon representing an arrowrunning in a consistent environment: each preview should run in the same replicated environment InfoAn icon representing the letter ‘i‘ in a circleSome people prefer to have a unique preview deployment URL per commit, others per pull request, I prefer per pull request which is the one way I'll detail in the rest of this post. Considering these points, I knew I'd have to use Docker containers from the get-go to deploy my previews: ArrowAn icon representing an arrowtheir portability ensure that the environment of the preview deployments is constant. ArrowAn icon representing an arrowhaving one image per PR is easy: I could build the image and tag it with the number of the pull request. Each new change would be built and tagged with that same number, thus ensuring the image always contains the most up to date version of the UI for that PR. Thus, the first steps of our preview deployments pipeline would consist of: ArrowAn icon representing an arrowBuilding our UI ArrowAn icon representing an arrowBuilding a Docker image ArrowAn icon representing an arrowTagging our Docker image with the PR number To help you get started here's one of the Dockerfile I always go back to build my frontend projects. It uses multistage builds and the image it outputs is very small: Dockerfile sample to build and run an app in a containerized environment1FROM node:12.18.3 as build2WORKDIR /usr/src/app3COPY package.json yarn.lock ./4RUN yarn5COPY . ./6RUN yarn build7 8FROM node:12.18.3-stretch-slim9COPY --from=build /usr/src/app/build /app10RUN yarn global add serve11WORKDIR /app12EXPOSE 300013CMD ["serve", "-p", "3000", "-s", "."] AlertAn icon representing an exclamation mark in an octogoneI wouldn't use this image to run the app in production though. Here, it relies on Vercel's serve NPM package to host the built files which is recommended to only use for testing or development. Deploying and tagging services on Google Cloud Run Considering the elements we listed in the previous part for the perfect preview deployments experience, it seemed that leveraging a serverless solution like Google Cloud Run is a great fit to deploy and run previews: ArrowAn icon representing an arrowit's cheap to run the different revisions of the app: you only pay for the traffic on the revisions ArrowAn icon representing an arroweach revision can have its own URL to be accessible: by tagging revisions, you can associate a tag to a revision which generates a unique URL for that revision ArrowAn icon representing an arrowit's fast: it only takes a few seconds to deploy services and revisions ArrowAn icon representing an arrowit's scalable: you can spin up to 1000 revisions per service! Once you reach that number, the oldest revisions will be simply removed from your service. Thus, no need to worry about taking down our revisions once we merge our pull request. We will now look into each of the steps necessary to deploy a service, a revision of a service, and how to tag a revision on Google Cloud Run. The commands that will be listed in this section will eventually make it into a Github Workflow that we will detail in the next part. AlertAn icon representing an exclamation mark in an octogoneFrom this point, you will need a Google Cloud account with a project if you want to make the workflow work. Click here to learn how to create a project on Google Cloud. I'll also use PROJECTID as the placeholder project in my examples, you'll need to replace it with the project ID you set up on your end if you want to run the commands 😊. InfoAn icon representing the letter ‘i‘ in a circleTo follow the steps detailed below on your local machine, you will need to: ArrowAn icon representing an arrowInstall Google Cloud SDK ArrowAn icon representing an arrowInstall the SDK's beta components ArrowAn icon representing an arrowInstall Docker ArrowAn icon representing an arrowSet your local CLI to use your project: gcloud config set project PROJECTID ArrowAn icon representing an arrowConfigure Docker so it can pull/push from the Google Container Registry: gcloud auth configure-docker This is totally optional as these commands will eventually run on GithubCI anyways and do not need to run locally. Push the image to Google Cloud Registry (GCR) First, we need to push the Docker image of our app that we built in the previous part: 1docker push gcr.io/PROJECTID/IMAGENAME:TAG Replace PROJECTID with your project ID, IMAGENAME with the name of the image you built, and TAG with the tag of that image (the tag will matter the most in the next part that focuses on automating these steps) Deploy a service on Cloud Run Running the following command will allow us to deploy the Docker image we just pushed to GCR as a container on Cloud Run: 1gcloud beta run deploy "myapp" --image "gcr.io/PROJECTID/IMAGENAME:TAG" --platform managed --port=3000 --region=us-east1 myapp will be the name of your service on Cloud Run, you can replace it with whatever name you want --port 3000 allows exposing the port 3000, you can replace it with whatever port your app uses InfoAn icon representing the letter ‘i‘ in a circleWe will be asked to allow unauthenticated invocations. By selecting yes, we will allow our app to be accessible through the URL that Google Cloud will output after the deployment is done. Our service is now deployed 🚀! We now have a URL for our service. Now let's look at the commands to deploy and tag a revision. Deploy and tag a revision Let's run the following command to deploy a revision for our services (remember to replace the name, project ID, image name, and tag with yours!) 1gcloud beta run deploy "myapp" --image "gcr.io/PROJECTID/IMAGENAME:TAG" --platform managed --revision-suffix=revision1 --port=3000 --region=us-east1 We now have a new revision for our service! This new revision uses the same Docker image and tag as our service. Eventually, we would want to deploy different versions of our app for each revision, which will result in each revision containing a change. We'll see in the next section how we can leverage Pull Request numbers and commit hashes to do that :smile. One of the key element of the pipeline is tagging revisions: tagging a revision will let us have a unique URL for that revision. If we have a service URL like https://myapp-abcdef123-ab.a.run.app, tagging it with "test" would give us the URL https://test---myapp-abcdef123-ab.a.run.app. To tag a revision we can run the following command: 1gcloud beta run beta update-traffic "myapp" --update-tags test=revision1 --platform=managed --region=us-east1 We now have all the key commands to deploy a service and a revision on Cloud Run and get back a unique URL for each revision! The next step is my personal favorite: automation. Automating the deployments In this part, we will create a Github workflow to execute the commands we just looked at on every Pull Request event. InfoAn icon representing the letter ‘i‘ in a circleThe key part of this implementation resides in the revision suffixes and tags: ArrowAn icon representing an arrowSuffixes: revision suffixes must be unique thus every suffix will contain the PR number and the commit hash of the latest commit. ArrowAn icon representing an arrowTags: For revision tags, we can solely rely on the PR Number, we want the revision URL to remain constant, even when a commit is added to the PR. Thus when deploying **PR #1234 ** with the HEAD commit hash abcd123 the suffix of the revision will be pr-1234-abcd123 and the tag associated with that revision will be pr-1234. The Github Workflow we're about to build is based on the Google Cloud Platform Github Actions, and more particularly we will implement a workflow that is similar to their Cloud Run Github Workflow example. I invite you to follow the README in this repository before continuing, it details how to: ArrowAn icon representing an arrowCreate a service account ArrowAn icon representing an arrowSet up the service account's key and name as secrets of your project's Github repository. I will use the same secret labels that they use in their workflow to make things easier for you to follow 😊. In this part, we'll use a service account as the account that will run our commnands in the automated pipeline. This type of account is more suited than user accounts for that kind of tasks. InfoAn icon representing the letter ‘i‘ in a circleHere are some links you might be interested in to get yourself familiar with service accounts which are mentioned in the Google Cloud Platform Cloud Run example I linked above: ArrowAn icon representing an arrowThe difference between a user and a service account ArrowAn icon representing an arrowHow to create a service account and add roles to it Considering that we now have a service account created and its key and name set as a secret of our Github repository, let's look at each step of the workflow on their own before looking at the entire pipeline: ArrowAn icon representing an arrowFirst, we have to set up our workflow to **run on every pull requests **against our main branch: 1name: Preview Deployment2 3on:4 pull_request:5 branches:6 - 'main' ArrowAn icon representing an arrowRun the checkout action and setup node action: 1---2steps:3 - name: Checkout Commit4 uses: actions/checkout@v25 with:6 ref: ${{ github.event.pull_request.head.sha }}7 - name: Use Node.js ${{ matrix.node-version }}8 uses: actions/setup-node@v19 with:10 node-version: ${{ matrix.node-version }} ArrowAn icon representing an arrowThen we need to install and configure the GCloud SDK and beta components using our service account name and secret key: 1---2- name: Setup Google Cloud SDK3 uses: GoogleCloudPlatform/github-actions/setup-gcloud@master4 with:5 project_id: ${{ secrets.PROJECTID }}6 service_account_key: ${{ secrets.RUN_SA_KEY }}7 export_default_credentials: true8- name: Install Google Cloud SDK Beta Components9 run: gcloud components install beta ArrowAn icon representing an arrowLet's not forget to configure Docker, as we showed earlier, to be able to push on GCR 1---2- name: Setup Docker for GCR3 run: gcloud auth configure-docker ArrowAn icon representing an arrowBuild and Push our Docker image using the PR number as a tag: 1---2- name: Build Docker Image3 run: docker build -t gcr.io/${secrets.PROJECTID}/IMAGENAME:${{github.event.number}}4- name: Push Docker Image To GCR5 run: docker push gcr.io/${secrets.PROJECTID}/IMAGENAME:${{github.event.number}} ArrowAn icon representing an arrowGet the commit hash of the HEAD commit of this PR. This is necessary because every revision suffix must be unique, and commit hashes are very handy to generate unique strings 😊: 1---2- name: Get HEAD Commit Hash3 id: commit4 run: echo "::set-output name=hash::$(git rev-parse --short HEAD)" ArrowAn icon representing an arrow**Deploy a new revision on Cloud Run. ** AlertAn icon representing an exclamation mark in an octogoneBefore running the pipeline for the first time, we will have to deploy our service manually beforehand to have what I'd call a "base revision". The workflow will only deploy new revisions for that service.To do so, you can head to the Google Cloud Run UI and create a service with the same name you'll end up using in your automated pipeline or if you set up the Google Cloud SDK on your local machine, you can run the deploy service command we saw in the previous section of this post. 1---2- name: Deploy Revision On Cloud Run3 run: gcloud beta run deploy "myapp" --image "gcr.io/${secrets.PROJECTID}/IMAGENAME:${{github.event.number}}" --no-traffic --platform managed --revision-suffix=${{github.event.number}}-${{steps.commit.outputs.hash}} --port=3000 --region=us-east1 ArrowAn icon representing an arrowTag the revision: 1---2- name: Tag Revision On Cloud Run3 run: gcloud beta run services update-traffic "myapp" --update-tags pr-${{github.event.number}}=myapp-${{github.event.number}}-${{steps.commit.outputs.hash}} --platform=managed --region=us-east1 ArrowAn icon representing an arrowPost the comment on the PR containing the URL! This will let your reviewer'''
year_published = 2020
year_updated = 2020
