full_description = '''HomePost-Processing Shaders as a Creative MediumFebruary 4, 2025 / 33 min readLast Updated: February 4, 2025Spending the better part of 2024 learning new shader techniques and concepts through the lens of post-processing has been the spark I needed to come up with ever more intricate, detailed, and ambitious creative work. Not only do I now know the inner workings of specific styles like Moebius, Painting, or Retro, but it also got me to a point where I strengthened the many shader mental models I built along the years enough to experiment with new styles that I see online or that I envision in my mind. That led me on a sort of creative spree for the past few months that originated from many creative developers, artists, and designers on Bluesky and Twitter such as: @dghez_, Polygon1993, @darkroomdevs, @hahajohnx, @samdape, 27-b (and many others sources listed throughout this article), whose works have, quite frankly, nerd-sniped me into reproducing or expanding their ideas into stylized shaders. Whether those featured complex pixelated patterns, trompe l'oeil, optical illusions, or surprising interactions, transcribing their art styles into shaders allowed me to not only sharpen my shader skills but also experiment with combining those effects in unique ways. Through this process, I collected a few new shading tricks in my toolbox to share with you and, more importantly, new ways to reuse what I had learned in previous years in a new context. This is the reason why I wanted to write this article. In it, you'll see the many sources of inspiration that led to those beautiful post-processing effects, my train of thought to re-implement them, and the full-on recipe behind them so you can reproduce them, expand them, or simply get inspired to create your own. ModelsI relied on many 3D models for the many post-processing effects I built, and some of them are featured in the demos of this article. Among them are: ArrowAn icon representing an arrowVenus de Milo by SMK – National Gallery of Denmark ArrowAn icon representing an arrowThe Creation of Adam by Loïc Norgeot ArrowAn icon representing an arrowTeenage Engineering TP-7 by zachernuk ArrowAn icon representing an arrowRusty Orange Spaceship by Sousinho Support my workEnjoying the content and feeling like supporting my work? You can show your appreciation by buying me a coffee which will give me the much-needed energy to take on more ambitious/high-quality articles and projects.Thank you for reading! Intricate Pixel Patterns I already explored pixelation in The Art of Dithering and Retro Shading for the Web where I introduced it alongside color quantization and dithering as it was a necessary effect to achieve a "retro style" akin to old video games on CRT displays. However, this time I want to go beyond that and show you some of the many effects you can craft with this technique by literally sculpting pixels and creating intricate and elaborate patterns. Pixelating your scene As a reminder, let's re-examine the code that I used and still use to this day for all my pixelation work: Sampling and pixelating a texture1vec2 normalizedPixelSize = pixelSize / resolution;2vec2 uvPixel = normalizedPixelSize * floor(uv / normalizedPixelSize);3 4vec4 color = texture2D(inputBuffer, uvPixel); ArrowAn icon representing an arrowWe first define a pixelSize as the number of pixels in height or width we want in a single "new pixel" for our final render/sampling. I tend to keep those as powers of 2: 1, 2, 4, 8, 16, ... ArrowAn icon representing an arrowWe then normalize the pixelSize based on the resolution, which gives us the size of a single pixel in "UV coordinates" (ranging [(0, 0), (1, 1)]). This is necessary to keep our "new pixels" square no matter the window size. ArrowAn icon representing an arrowWe define a grid of cells by dividing our UV coordinates by the normalizedPixelSize. ArrowAn icon representing an arrowAdding the floor creates the block effect: the UV coordinates no longer vary smoothly across the screen but instead jump between fixed points. ArrowAn icon representing an arrowFinally, we multiply by the normalizedPixelSize to convert the grid of cells to UV coordinates. ArrowAn icon representing an arrowWe can then use our newly mapped UV coordinates to sample our texture. If this formula still feels overwhelming, the best is to break it down with an example: Breakdown of pixelation code1Example: If we have:2resolution = vec2(800, 600) // Screen size in pixels3pixelSize = vec2(8, 8) // We want 8x8 pixel blocks4uv = vec2(0.374, 0.567) // Current texture coordinate5 61. Calculate the size of each pixel block in normalized coordinates (0 to 1)7normalizedPixelSize = (8, 8) / (800, 600) = (0.01, 0.0133)8 9 102. Snap the UV coordinate to the nearest pixel block grid11floor(uv / normalizedPixelSize) = floor((0.374, 0.567) / (0.01, 0.0133))12 = floor((37.4, 42.6)) = (37, 42)13 14Then multiply back by normalizedPixelSize15uvPixel = (0.37, 0.559) I also built the widget below for you to see what happens when you apply this code to a texture/scene: 0.0,1.01.0,1.00.0,0.01.0,0.0Pixelation: 1 x 1 InfoAn icon representing the letter ‘i‘ in a circleWe can see that what this pixelation effect accomplishes can be summarized as remapping the UV coordinates used to sample the inputBuffer of said effect.Moreover, each new pixel, or cell, now contains many pixels within them that we can leverage to create anything that we want (foreshadowing 👀) Shaping pixels We could leave our pixelated output as such, but squares quickly get boring. Moreover, our cells have a lot of pixels we can use to draw interesting patterns, or even better, sculpt any shape we may want. I saw this very cool Japanese receipt website made by @samdape last month, and I liked it so much that I recreated this pattern as a post-processing effect. I not only wanted it to work on top of everything and be dynamic but also thought it would be a great first example for this article, as it's an easy effect to break down with a lovely/original output. <img alt="samdape" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" srcSet="/_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fprofile_images%2F1865054658680553473%2FNp_0aINJ_normal.jpg&amp;w=48&amp;q=75 1x, /_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fprofile_images%2F1865054658680553473%2FNp_0aINJ_normal.jpg&amp;w=96&amp;q=75 2x" src="/_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fprofile_images%2F1865054658680553473%2FNp_0aINJ_normal.jpg&amp;w=96&amp;q=75"/>sam@samdapesaw this japanese receipt laying around &amp; turned it into my website 🌀 https://t.co/TfdoXlNIb9 from idea to live in ~3h with @figma &amp; @v0 https://t.co/lHniV7Lezo<img alt="saw this japanese receipt laying around &amp;amp; turned it into my website 🌀 https://t.co/TfdoXlNIb9 from idea to live in ~3h with @figma &amp;amp; @v0 https://t.co/lHniV7Lezo" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" srcSet="/_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fmedia%2FGeCJuDZWkAIBNfm.jpg&amp;w=1920&amp;q=75 1x, /_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fmedia%2FGeCJuDZWkAIBNfm.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fmedia%2FGeCJuDZWkAIBNfm.jpg&amp;w=3840&amp;q=75"/><img alt="saw this japanese receipt laying around &amp;amp; turned it into my website 🌀 https://t.co/TfdoXlNIb9 from idea to live in ~3h with @figma &amp;amp; @v0 https://t.co/lHniV7Lezo" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" srcSet="/_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fext_tw_video_thumb%2F1864641750087643136%2Fpu%2Fimg%2FYIz4BCpz1Ftmohk9.jpg&amp;w=1920&amp;q=75 1x, /_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fext_tw_video_thumb%2F1864641750087643136%2Fpu%2Fimg%2FYIz4BCpz1Ftmohk9.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fext_tw_video_thumb%2F1864641750087643136%2Fpu%2Fimg%2FYIz4BCpz1Ftmohk9.jpg&amp;w=3840&amp;q=75"/>12:07 PM - Dec 5, 2024863000 Here is how I interpreted this effect by just looking at the screenshots of Sam's website: ArrowAn icon representing an arrowWe have a pretty blocky-looking output, so we'll need to pixelate our inputBuffer by quite a bit. ArrowAn icon representing an arrowEach cell is composed of horizontal black bars. ArrowAn icon representing an arrowThe darker the area, the longer the bar. ArrowAn icon representing an arrowThe lighter the area, the shorter the bar (or no bar). With this in mind, we can leverage the pixelation formula we dissected just above and the luma of a given pixel to build this receipt effect. Diagram showcasing the bar pattern rendered on each cell based on the luma Receipt Bar fragment shader1void mainImage(const in vec4 inputColor, const in vec2 uv, out vec4 outputColor) {2 vec2 normalizedPixelSize = pixelSize / resolution;3 float rowIndex = floor(uv.x / normalizedPixelSize.x);4 vec2 uvPixel = normalizedPixelSize * floor(uv / normalizedPixelSize);5 6 vec4 color = texture2D(inputBuffer, uvPixel);7 8 float luma = dot(vec3(0.2126, 0.7152, 0.0722), color.rgb);9 10 vec2 cellUV = fract(uv / normalizedPixelSize);11 12 float lineWidth = 0.0;13 14 if (luma > 0.0) {15 lineWidth = 1.0;16 }17 18 if (luma > 0.3) {19 lineWidth = 0.7;20 }21 22 if (luma > 0.5) {23 lineWidth = 0.5;24 }25 26 if (luma > 0.7) {27 lineWidth = 0.3;28 }29 30 if (luma > 0.9) {31 lineWidth = 0.1;32 }33 34 if (luma > 0.99) {35 lineWidth = 0.0;36 }37 38 float yStart = 0.05;39 float yEnd = 0.95;40 41 if (cellUV.y > yStart && cellUV.y < yEnd && cellUV.x > 0.0 && cellUV.x < lineWidth) {42 color = vec4(0.0, 0.0, 0.0, 1.0);43 } else {44 color = vec4(0.70,0.74,0.73, 1.0);45 }46 outputColor = color;47} One thing that we should highlight in the code snippet above is this line: 1vec2 cellUV = fract(uv / normalizedPixelSize); It returns the cellUV coordinates ranging again from [(0, 0), (1, 1)], giving us the relative position of a given pixel within each cell. This is the "magic line" that allows us to step inside each cell and start shaping and sculpting them the way we want. In this specific case, we are conditionally turning the pixels within each cells black or white based on the lineWidth that's defined through the luma of the pixelated texture. We will use similar techniques to define many patterns, some of which are depicted in the widget below which uses a similar principle to display those features: Enable PatternsCrosshatchDotsLinesSquares0.0,1.01.0,1.00.0,0.01.0,0.0 Thanks to both the pixelation formula and this use of the fract glsl function, we established what is to me the two main pillars that we're going to keep encountering in most post-processing shaders: ArrowAn icon representing an arrowRemapping or distorting the UV coordinates ArrowAn icon representing an arrowShape, sculpt, or tweak each cell individually to create a pattern Both of these points are at work in the receipt effect in the demo below: We can port this example to render a completely different effect while keeping approximately 90% of the code above unchanged. This time, let's try to build this dotted/halftone pattern used in this picture that I saw on Twitter a few months ago from once again @samdape: <img alt="samdape" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" srcSet="/_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fprofile_images%2F1865054658680553473%2FNp_0aINJ_normal.jpg&amp;w=48&amp;q=75 1x, /_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fprofile_images%2F1865054658680553473%2FNp_0aINJ_normal.jpg&amp;w=96&amp;q=75 2x" src="/_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fprofile_images%2F1865054658680553473%2FNp_0aINJ_normal.jpg&amp;w=96&amp;q=75"/>sam@samdapecreate https://t.co/gyeq67FQHq<img alt="create https://t.co/gyeq67FQHq" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="c-kBDlyF" srcSet="/_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fmedia%2FGc_adPPXYAA4DgY.jpg&amp;w=3840&amp;q=75 1x" src="/_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fmedia%2FGc_adPPXYAA4DgY.jpg&amp;w=3840&amp;q=75"/>1:01 PM - Nov 22, 20248111551 The principle is the same, but with a few notable differences: ArrowAn icon representing an arrowWe render circles in each cell ArrowAn icon representing an arrowFor cells with luma above a certain threshold, we render a wide white circle centered in the middle of the cell ArrowAn icon representing an arrowFor the rest, a smaller circle centered this time in the bottom left corner of the cell Finally, as our final example for this section, why not try to rebuild Three.js' ASCII effect? This time, instead of creating our pattern within our fragment shader code, we will get it from an external texture containing all the characters for our ASCII palette where each character maps to a given cell luma: Diagram showcasing a simplified version of the ASCII texture passed as an argument of the ASCII effect. It also breaks down the UV coordinates used to sample each character individually. As for the implementation, we can create the texture of ASCII characters within our React Three Fiber code. Creating our ASCII palette within our React Three Fiber scene1//...2 3const ASCII_CHARS = './ノハメラマ木';4 5const ASCIIEffect = () => {6 7 //...8 9 useEffect(() => {10 const CHAR_SIZE = pixelSize;11 const canvas = document.createElement('canvas');12 const ctx = canvas.getContext('2d');13 14 canvas.width = CHAR_SIZE * asciiChars.length;15 canvas.height = CHAR_SIZE;16 17 ctx.fillStyle = 'black';18 ctx.fillRect(0, 0, canvas.width, canvas.height);19 20 ctx.fillStyle = 'white';21 ctx.font = \`\${CHAR_SIZE}px \${fontFamily}\`;22 ctx.textBaseline = 'middle';23 ctx.textAlign = 'center';24 25 asciiChars.split('').forEach((char, i) => {26 ctx.fillText(char, (i + 0.5) * CHAR_SIZE, CHAR_SIZE / 2);27 });28 29 const texture = new THREE.CanvasTexture(canvas);30 texture.minFilter = THREE.NearestFilter;31 texture.magFilter = THREE.NearestFilter;32 33 if (effectRef.current) {34 effectRef.current.asciiTexture = texture;35 effectRef.c'''
