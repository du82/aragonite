["https://blog.maximeheckel.com/posts/migrating-to-nextjs"]
title = "Migrating to Next.js - Maxime Heckel's Blog"
description = "Some thoughts on my experience using Gatsby for my blog and migrating it to Next.js, and why this was the right call for me going forward."
full_description = '''HomeMigrating to Next.jsJune 29, 2021 / 15 min readLast Updated: June 29, 2021Last year, I gave myself the objective of learning Next.js as it was getting more and more popular among the people I followed on Twitter and was adopted by many companies as their main frontend framework. The focus of the Next.js team on Developer eXperience (DX) and simplicity was striking the first time I tried it, especially compared to Gatsby which, back then, powered this blog and started to feel very cumbersome at times. Thus in January, I told myself I'd migrate over my entire blog and its content over to Next.js and see if I could leverage its simplicity to make the experience of maintaining and expanding this blog easier and less time-consuming. As this migration is now a success 🎉 I wanted to dedicate this blog post to go through some of the thoughts I gathered throughout this process, and also the experience I had with both frameworks, to maybe help you choose what's best for your own setup. InfoAn icon representing the letter ‘i‘ in a circleI want to emphasize the fact that what I'm going to write about here is purely based on personal experience and frustrations.My aim is not to delegitimize the value of one framework over the other 😄. They both have their flaws, advantages, and use-cases where they shine the most. Farewell Gatsby After over a year and a half of building this site with Gatsby, it was time to say goodbye. However, this doesn't mean I don't appreciate Gatsby any more, far from that. I feel Gatsby was a great way to enter the "technical blog-sphere" and gave me all the tools to build a successful and compelling blog: ArrowAn icon representing an arrowI had no idea what I was doing when I started this blog 🐶 (still the case but a bit less now). ArrowAn icon representing an arrowI didn't know anything about SEO, and the plugin system was a gold mine that helped me follow best practices without any knowledge required. ArrowAn icon representing an arrowIt introduced me to MDX which is now an essential part of my stack and gave me the ability to build interactive components into my blog posts. The setup for MDX on Gatsby was incredibly easy! So, "what drove you off Maxime?" you may ask. Well here are a couple of points that started to become more and more obvious as my time with Gatsby went by. InfoAn icon representing the letter ‘i‘ in a circleWorth mentioning, all of my experience was on Gatsby v2. Some of the points I'm mentioning below might have been fixed in v3. I'm not 100% sure as I did not proceed to try and update to the latest version, mostly due to lack of time. Over-engineered Something that originally caught my attention with Gatsby was its use of GraphQL. It became more of a curiosity over time honestly. While I'm sure it makes sense for many sites at scale (e-commerce, bigger and more complex publications), at least to me the GraphQL felt like an extra level of complexity that felt unnecessary. The more I iterated on my blog, the more the technical choice of GraphQL felt unjustified (for my use-case at least), building data sources felt way more complicated than it should have been: Excerpt of my gatsby-config.js and gatsby-node files1// As you can see it's a lot of lines of code for such a simple use case2 3// gatsby-config.js4module.exports = () => {5 return {6 plugins: [7 {8 resolve: 'gatsby-plugin-mdx',9 options: {10 extensions: ['.mdx', '.md'],11 defaultLayouts: {12 default: require.resolve('./src/templates/BlogPost.tsx'),13 },14 },15 },16 {17 resolve: `gatsby-source-filesystem`,18 options: {19 name: `posts`,20 path: `${__dirname}/content/`,21 },22 },23 ],24 };25};26 27// gatsby-node.js28 29exports.createPages = ({ graphql, actions }) => {30 const { createPage } = actions;31 return new Promise((resolve, reject) => {32 resolve(33 graphql(34 `35 {36 allMdx {37 edges {38 node {39 id40 timeToRead41 frontmatter {42 slug43 title44 subtitle45 date46 type47 cover {...}48 }49 parent {50 ... on File {51 absolutePath52 }53 }54 }55 }56 }57 }58 `59 ).then((result) => {60 // Create blog posts pages.61 result.data.allMdx.edges.forEach(({ node }) => {62 return createPage({63 path: `/posts/${node.frontmatter.slug}`,64 component: node.parent.absolutePath,65 context: {66 timeToRead: node.timeToRead,67 cover: node.frontmatter.cover,68 tableOfContents: node.tableOfContents,69 },70 });71 });72 })73 );74 });75}; Another example that felt weird is that it was suggest that something as simple as my website config (a simple JS object) needed to be queried via GraphQL: Excerpt of my site config and its corresponding query1/**2 Why couldn't I simply import this file directly where needed? 3 The GraphQL feels like a lot of overhead for such a simple use case4**/5 6export const pageQuery = graphql`7 query IndexPageQuery {8 site {9 siteMetadata {10 title11 shortName12 author13 keywords14 siteUrl15 description16 twitter17 }18 }19 }20`; That feeling grew stronger when I wanted to add some simple functionalities, like generating a sitemap. The only way to have those working within the Gatsby Build pipeline was to leverage that GraphQL layer which I barely understood the inner workings of it. This made my entire setup rely on plugins to let me iterate fast on this website. On top of that, it seems that the company behind Gatsby keeps releasing abstraction layers to address the plugin issues, and then new abstraction layers on top of that to solve the problems created by the previous one. During my short time using Gatsby, it went from promoting plugins to themes to recipes which was overwhelming. This thread from @tesseralis illustrates well how I feel about some of the technical choices that were made. The plugin ecosystem is a double edge sword As helpful as it seemed at the beginning, it became clear over time that delegating some of the core functionalities of my blog to plugins was not such a good idea after all: ArrowAn icon representing an arrowA lot of plugins depended on each other, like gatsby-plugin-sharp, gatsby-image, or any related plugins I was using for image optimization/processing. They needed to be updated altogether, and many times I found myself spending lots of time trying to find the right combination of versions to avoid breaking my setup. ArrowAn icon representing an arrowI was relying on a lot of plugins for canonical URLs and SEO in general. These would often break or change their behavior after an update without any warning, or collide with one another. All my meta tags were erased one time because I added a plugin to my list in the wrong order without noticing it. Twitter Cards, Opengrah Images, ... all gone for several days 😱 not ideal when you try to build a proper SEO strategy. ArrowAn icon representing an arrowMore plugins meant more node_modules which meant also longer install and build time. Over time it added up to quite a bit InfoAn icon representing the letter ‘i‘ in a circleI wrote extensively about my SEO-related mistakes and incidents in SEO mistakes I've made and how I fixed them in case you want to read scary SEO stories 👻 Moreover, as the community grew, so did the number of plugins! This is a positive thing, don't get me wrong. But just try to search for RSS in the Gatsby Plugins website. There are 22 plugins (as I'm writing these words) doing more or less the same thing but each of them in a slightly different way. One would need to do a lot of digging to find which one is the "official"/"recommended" one to use which is not ideal. I'm pretty sure a little bit of curation in the plugin section would go a long way. As a result, I was pouring hours of personal time maintaining, fixing, and expanding this site. Over time I grew tired of working with Gatsby's technical choices and started spending a lot of time working around them, thus making using Gatsby itself less and less justifiable. The migration This migration to Next.js was the opportunity for me to accomplish the following: ArrowAn icon representing an arrowLearn a bit more about Next.js on a more complex project. ArrowAn icon representing an arrowStrive for simplicity! No GraphQL or over-engineered tech, it's just a blog. No theme, few plugins, a minimum amount of dependencies. ArrowAn icon representing an arrowFocus on performance. Address any pitfalls and make sure my blog was ready for the rollout of Core Web Vitals InfoAn icon representing the letter ‘i‘ in a circleI wrote about one of those performance issues: my overreliance on iframes for Twitter Embeds which I solved by building my own "Static Tweet" component. The process I like to treat my blog like a product, so I wanted to conduct this migration as seriously as possible, without negatively impacting the reading experience or my traffic. Thus I established a little process to ensure that this effort would be successful: ArrowAn icon representing an arrowReimplement my pages and the "MDX article pipeline", i.e. getting my article and their custom widgets/components to render, generate sitemap, OpenGraph images, and RSS feed. ArrowAn icon representing an arrowMigrating over all my React components from my Gatsby Theme onto the repository of the blog. ArrowAn icon representing an arrowCleaning up my dependencies. Some pieces relied on packages that seemed a bit overkill, like Scrollspy, table of content, etc... ArrowAn icon representing an arrowTest, test, and test, especially anything related to SEO! Thankfully, I built a sturdy automated CI/CD pipeline in the past that assisted me along the way making sure I was not breaking anything unknowingly. (Thank you Maxime from 2020 🙏) Once a satisfying result was achieved, I started a slow rollout of the blog throughout a week. For that, I used Netlify's "split branch" feature. I deployed 2 branches (main for the Gatsby version, next for the Next.js version) under the same project, and slowly redirected the traffic to the new version, or falling back to the old one if issues were to occur. Screenshot of the Netlify Split Test feature used here while releasing the new Next.js version of my blog This gave me great peace of mind, knowing that whatever would happen, I'd always have the "legacy" version available if I ever needed to roll back my blog in the short term. It was while executing this process that I was able to see Next.js shine, but also noticed some of its caveats, specifically for certain aspects of my use case. Where it shined Next.js is incredibly fast and easy to iterate with. I have never worked this fast on my blog: ArrowAn icon representing an arrowAdding new data sources felt incredibly easy compared to Gatsby as I could pretty much load my MDX documents the way that fit my use-case. ArrowAn icon representing an arrowThe configuration required is light, well documented, and compatible with any package I was familiar with for basic React projects. While Gatsby felt like building a blog with pre-build LEGO pieces, Next.js on the other hand was the total opposite. The framework is very unopinionated and there are very few "plugins" per se as most of the community seems to implement their own pieces/scripts that fit exactly their setup. Want to generate your sitemap at build time? You need to build your own script. What about generating OpenGraph images? Same, build your own! This can seem like a huge trade-off, but I actually like this aspect of Next.js: ArrowAn icon representing an arrowI write these scripts for myself now. They don't need to be perfect or fit some specific requirements from the framework, i.e. no need for GraphQL for such an easy use case, which felt liberating. On top of that, it's a lot of fun! (at least to me 😛) ArrowAn icon representing an arrowI can use any library I want to assist me. No need to build or add an unnecessary plugins with additional dependencies to get the desired output. InfoAn icon representing the letter ‘i‘ in a circle@JoshWComeau dedicated an article about his Next.js blog setup where he showcases his process when it comes to writing these custom scripts The most important take here is that I finally feel in control of my blog. No more black boxes! 🙌 Caveats As liberating as it may feel at first, there were still some caveats about not having all these pre-built tools that I was used to with my previous setup. Gatsby has a better MDX support, at least as I'm writing these words. I struggled to find the right library to get a similar MDX experience on Next.js as the official next/mdx library was lacking a few things I needed. This was a bit worrying at first as MDX is at the core of my blog and I wanted to continue using it the way I was accustomed to. I opted for next-mdx-remote, however, it came with one particular tradeoff: ArrowAn icon representing an arrowit required me to put all my MDX components in context of all MDX files. This means this article technically knows about the widgets I wrote in my Framer Motion blog posts for instance. Before I could have discrete import statements in my MDX files, this is not an option anymore. ArrowAn icon representing an arrowthis increased the bundle size of my blog posts, at scale in the long run this might be a problem. However, it looks like lazy loading those component is a good workaround to this issue. Lazy Loading MDX components with Next.js and next-mdx-remote1import dynamic from 'next/dynamic';2 3const FramerMotionPropagation = dynamic(() =>4 import('./custom/Widgets/FramerMotionPropagation')5);6const FramerMotionAnimationLayout = dynamic(() =>7 import('./custom/Widgets/FramerMotionAnimationLayout')8);9const FramerMotionAnimatePresence = dynamic(() =>10 import('./custom/Widgets/FramerMotionAnimatePresence')11);12 13const MDXComponents = {14 FramerMotionPropagation,15 FramerMotionAnimationLayout,16 FramerMotionAnimatePresence,17};18 19const Article = ({ post }) => {20 return (21 <BlogLayout>22 <MDXRemote {...post.mdxSource} components={MDXComponents} />23 </BlogLayout>24 );25}; InfoAn icon representing the letter ‘i‘ in a circleI also tried using mdx-bundler which seems super promising and doesn't have the issue described above. Sadly I couldn't make it work on my setup. Image optimization also slowed me down. Vercel released next/image not long before I started the migration, but the way it worked was opposite from what I was used to with Gatsby: Gatsby would optimize images at build time, while Next optimizes images on the fly. This meant 3 things: ArrowAn icon representing an arrowI would get faster build time on Next.js 🚀 ArrowAn icon representing an arrowI had to hardcode the height and width of all my images 😅. ArrowAn icon representing an arrowI needed to either use a 3rd party image service to host my images or host my blog on Vercel as at the time, Netlify did not support next/image. I did not want to risk doing both a framework migration AND a platform migration at the same time. I stayed on Netlify and patiently waited for a couple of weeks, but the resulting next/image support was not entirely satisfyi'''
