["https://blog.maximeheckel.com/posts/switching-off-the-lights-part-2-fixing-dark-mode-flashing-on-servered-rendered-website"]
title = "Fixing the dark mode flash issue on server rendered websites - Maxime Heckel's Blog"
description = "Bringing a proper solution to dark mode flashing without an ugly hack."
full_description = '''HomeFixing the dark mode flash issue on server rendered websitesApril 16, 2020 / 7 min readLast Updated: April 16, 2020This blog post is a follow up to Switching off the lights - Adding dark mode to your React app that I wrote a year ago. I finally took the time to fix my implementation which caused a lot of issues on server rendered websites and I wanted to share my solution with you. An ugly hack When I first added dark mode on my Gatsby projects, I encountered what you might know as the "Dark mode flashing" issue. The colors of the light mode would show up for a brief moment when refreshing a webpage. Why does this issue show up? @JoshWComeau explains the reason behind this issue pretty well on his blog post CSS Variables for React Devs: "Dark Mode" is surprisingly tricky, especially in a server-rendered context (like with Gatsby or Next.js). The problem is that the HTML is generated long before it reaches the user's device, so there's no way to know which color theme the user prefers. To avoid this issue back when implementing it for the first time I did what I'd call an "ugly hack". I'd avoid rendering the whole website until the theme to render was known, and in the meantime, I'd just render a simple <div/>: Code snippet from my first dark mode article featuring the ugly hack to avoid "dark mode flash"1if (!themeState.hasThemeLoaded) {2 /*3 If the theme is not yet loaded we don't want to render4 this is just a workaround to avoid having the app rendering5 in light mode by default and then switch to dark mode while6 getting the theme state from localStorage7 */8 return <div />;9}10const theme = themeState.dark ? theme('dark') : theme('light'); This ugly hack caused me some of the most frustrating problems I've had in a while, one of them even took me several days to figure out: <img alt="MaximeHeckel" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" srcSet="/_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fprofile_images%2F813646702553010176%2FrOM8J8DC_normal.jpg&amp;w=48&amp;q=75 1x, /_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fprofile_images%2F813646702553010176%2FrOM8J8DC_normal.jpg&amp;w=96&amp;q=75 2x" src="/_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fprofile_images%2F813646702553010176%2FrOM8J8DC_normal.jpg&amp;w=96&amp;q=75"/>Maxime@MaximeHeckelThe core of the issue: I was rendering a &lt;div/&gt; when loading the website and reading the localStorage to set the proper theme (since it's async). This stopped gatsby from going further during the SSR build step and hence not generating the pages (with meta tags) of my blog6:17 PM - Aug 20, 201911 (Again thank you @chrisbiscardi for taking the time to help me debug this) I then brought another solution to this problem: add a display: hidden CSS style to the main wrapper until the theme was loaded as featured in this blog post. It fixed my SEO issues, but I was still not satisfied with this fix. After reading Josh Comeau's blog post on using CSS variables along with Emotion Styled Components, I decided to leverage these to fix the dark mode flashing issue once and for all (no hack this time!). Using CSS variables in my themes Originally I had my theme set to an object looking roughly like the following: Original version of a theme including light and dark mode colors1const theme = {2 light: {3 background: #F8F8F9,4 body: #161617,5 },6 dark: {7 background: #161617,8 body: #FFFFFF,9 },10}; The cool thing I've learned recently is that it's possible to convert the hardcoded hex values to use CSS Custom Properties in a theme object that is passed to the Emotion Theme Provider. The first thing to do add these CSS variables in a Emotion Global component: Emotion global component with CSS Custom properties1import { css, Global } from '@emotion/core';2import React from 'react';3 4const GlobalStyles = () => (5 <Global6 styles={css`7 .theme-light {8 --theme-colors-gray: #f8f8f9;9 --theme-colors-black: #161617;10 }11 12 .theme-dark {13 --theme-colors-black: #161617;14 --theme-colors-white: #ffffff;15 }16 `}17 />18);19 20export default GlobalStyles; Then, replace the hex values in the themes with the corresponding CSS variable names: Updated version of the theme object using CSS Custom Properties1const theme = {2 light: {3 background: var(--theme-colors-gray, #F8F8F9),4 body: var(--theme-colors-black, #161617),5 },6 dark: {7 background: var(--theme-colors-black, #161617),8 body: var(--theme-colors-white, #FFFFFF),9 },10}; Everything should remain pretty much the same, we've simply moved some hex values around and put them in CSS variables under their respective CSS class mode theme-light and theme-dark. Now let's see how this can be leveraged with some good old inline Javascript in a HTML script tag. Injecting a script Server rendered websites like Gatbsy let us customize the html.js file. This gives us the possibility to inject a script that will set the proper theme based on the value present in local storage. If not already available in the src folder the html.js can be copied from the .cache folder of your Gatsby project: 1cp .cache/default-html.js src/html.js InfoAn icon representing the letter ‘i‘ in a circleNote: you can read more about custom html.js in the Gatsby documentation InfoAn icon representing the letter ‘i‘ in a circle**For NextJS users: **~~I'll try to take some time to investigate and update this post with a solution for NextJS.~~Shout out to @aquaductape for writing a follow up implementation to fix this same issue on NextJS projects. You can check out the code here! The following will have to be added to this file: Javascript script that reads the local storage item with the key 'mode' to load the proper theme1(function () {2 try {3 var mode = localStorage.getItem('mode');4 var supportDarkMode =5 window.matchMedia('(prefers-color-scheme: dark)').matches === true;6 if (!mode && supportDarkMode) document.body.classList.add('theme-dark');7 if (!mode) return;8 document.body.classList.add('theme-' + mode);9 } catch (e) {}10})(); This script does the following: ArrowAn icon representing an arrowIt looks for a local storage item with a key named mode ArrowAn icon representing an arrowIt looks for the prefers-color-scheme CSS media query, here we look whether its set to dark, which translates to the user loading the website having a system using dark mode. ArrowAn icon representing an arrowIf there's no mode set in local storage but the user's system uses dark mode, we add a class theme-dark do the body of the main document. ArrowAn icon representing an arrowIf there's simply no mode set in local storage we don't do anything, which will end up loading the default theme of our UI ArrowAn icon representing an arrowOtherwise, we add the class associated with the mode set in local storage to the body of the document We can add the script to the html.js file inside the <body> tag as follows: html.js file featuring our custom script1...2<body {...props.bodyAttributes}>3 <script key="maximeheckel-theme" dangerouslySetInnerHTML={{ __html:4 `(function() { try { var mode = localStorage.getItem('mode'); var5 supportDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches6 === true; if (!mode && supportDarkMode)7 document.body.classList.add('theme-dark'); if (!mode) return;8 document.body.classList.add('theme-' + mode); } catch (e) {} })();`, }} />9 {props.preBodyComponents}10 <div11 key="{`body`}"12 id="___gatsby"13 dangerouslySetInnerHTML="{{"14 __html:15 props.body16 }}17 />18 {props.postBodyComponents}19</body>20... Updating the toggle function There's one last update to be done: updating the toggle light/dark mode function. We need to add a few lines of code to make sure we add or remove the appropriate CSS class from the body tag, otherwise the colors of our themes will be a bit messed up 😅. In the example featured in the first blog post this is what the function looked like: Original function to toggle between light and dark mode1const toggle = () => {2 const dark = !themeState.dark;3 localStorage.setItem('dark', JSON.stringify(dark));4 setThemeState({ ...themeState, dark });5}; And this is what we need to add to make it work properly again: Updated function to toggle between light and dark mode1const toggle = () => {2 const dark = !themeState.dark;3 if (dark) {4 document.body.classList.remove('theme-light');5 document.body.classList.add('theme-dark');6 } else {7 document.body.classList.remove('theme-dark');8 document.body.classList.add('theme-light');9 }10 localStorage.setItem('dark', JSON.stringify(dark));11 setThemeState({ ...themeState, dark });12}; Result By adding the code featured in the previous parts, we allow the Javascript related to getting the proper theme to be executed before we start rendering the React code. The appropriate class name to the body tag is going to be set immediately which will allow out CSS variables to be set to the proper variables. Then, for the brief moment when our "flash" issue previously occurred, the theme being used does not matter, as the colors are solely based on the CSS variables 🎉! This is what makes the flash disappear under the hood.Liked this article? Share it with a friend on Bluesky or Twitter or support me to take on more ambitious projects to write about. Have a question, feedback or simply wish to contact me privately? Shoot me a DM and I'll do my best to get back to you.Have a wonderful day.– Maxime2020-04-16T08:00:00.000+01:00Bringing a proper solution to dark mode flashing without an ugly hack.'''
