title = "Real-time dreamy Cloudscapes with Volumetric Raymarching - Maxime Heckel's Blog"
description = "This article is a deep dive into my experimentations with Volumetric rendering and how to leverage it to render beautiful raymarched cloudscapes in React Three Fiber and WebGL. In it, I walk you through everything from the basics of Volumetric Raymarching to the techniques used in video games to render physically accurate clouds."
full_description = '''HomeReal-time dreamy Cloudscapes with Volumetric RaymarchingOctober 31, 2023 / 32 min readLast Updated: November 11, 2023I spent the past few months diving into the realm of Raymarching and studying some of its applications that may come in handy for future 3D projects, and while I managed to build a pretty diverse set of scenes, all of them consisted of rendering surfaces or solid objects. My blog post on Raymarching covered some of the many impressive capabilities of this rendering technique, and as I mentioned at the end of that post, that was only the tip of the iceberg; there is a lot more we can do with it. One fascinating aspect of Raymarching I quickly encountered in my study was its capacity to be tweaked to render volumes. Instead of stopping the raymarched loop once the ray hits a surface, we push through and continue the process to sample the inside of an object. That is where my obsession with volumetric clouds started, and I think the countless hours I spent exploring the many Sky Islands in Zelda Tears of the Kingdom contributed a lot to my curiosity to learn more about how they work. I thus studied a lot of Shadertoy scenes such as "Clouds" by Inigo Quilez, "Starry Night" by al-ro, and "Volumetric Raymarching sample" by Suyoku leveraging many Volumetric Raymarching techniques to render smoke, clouds, and cloudscapes, which I obviously couldn't resist giving a try rebuilding myself: I spent a great deal of time exploring the different ways I could use Raymarching to render clouds, from fully wrapping my head around the basics of Volumetric Raymarching to leveraging physically based properties of clouds to try getting a more realistic output while also trying to squeeze as much performance out of my scenes with neat performance improvement tips I learned along the way. I cover all of that in this article, which I hope can serve you as a field guide for your own volumetric rendering experiments and learnings. Before you start👉 This article assumes you have basic knowledge about shaders, noise, and GLSL, or read The Study of Shaders with React Three Fiber as well as some notions about Raymarching, which you can learn more about in Painting with Math: A Gentle Study of Raymarching. Sources ArrowAn icon representing an arrowEA Forstbite physically based sky atmosphere and cloud rendering by Sebastien Hillaire ArrowAn icon representing an arrowPhysically Based and Scalable Atmospheres in Unreal Engine by Sebastien Hillaire ArrowAn icon representing an arrowHow Big Budget AAA Games Render Clouds by SimonDev ArrowAn icon representing an arrowScalar Spatiotemporal Blue Noise Masks ArrowAn icon representing an arrowThe Real-tile Volumetric Cloudscapes of Horizon Zero Dawn by Andrew Schneider ArrowAn icon representing an arrowVolumetric Rendering by Chris Wallis ArrowAn icon representing an arrowDirectional Derivative by Inigo Quilez Special thanks to everyone who posted Volumetric rendering demos on Shadertoy, they helped me a lot! Volumetric rendering: Raymarching with a twist In my previous blog post on Raymarching, we saw that the technique relied on: ArrowAn icon representing an arrowSigned Distance Fields: functions that return the distance of a given point in space to the surface of an object ArrowAn icon representing an arrowA Raymarching loop where we march step-by-step alongside rays cast from an origin point (a camera, the observer's eye) through each pixel of an output image, and we calculate the distance to the object's surface using our SDF. Once that distance is small enough, we can draw a pixel. If you've practiced this technique on some of your own scenes, you're in luck: Volumetric Raymarching relies on the same principles: there's a loop, rays cast from an origin, and SDFs. However, since we're rendering volumes instead of surfaces, there's a tiny twist to the technique 👀. How to sample a volume The first time we got introduced to the concept of SDF, we learned that it was important not to step inside the object during our Raymarching loop to have a beautiful render. I even emphasized that fact in one of my diagrams showcasing 3 points relative to an object: ArrowAn icon representing an arrowP1 is located far from the surface, in green, representing a positive distance to the surface. ArrowAn icon representing an arrowP2 is located at a close distance ε to the surface, in orange, ArrowAn icon representing an arrowP3 positioned inside the object, in red, representing a negative distance to the surface. Diagram showcasing 3 points, P1, P2, and P3, being respectively, at a positive distance, small distance, and inside a sphere. When sampling a volume, we'll need to actually raymarch inside our object and reframe how we think of SDF: instead of representing the distance to the surface, we will now use it as the density of our volume. ArrowAn icon representing an arrowWhen raymarching outside, the density is null, or 0. ArrowAn icon representing an arrowOnce we raymarch inside, it is positive. To illustrate this new way of thinking about Raymarching in the context of volume, here's a modified version of the widget I introduced in my blog post on the topic earlier this year. -0.5,0.50.5,0.5-0.5,-0.50.5,-0.5RepeatAn icon representing an arrow twisted so it makes a loopArrowAn icon representing an arrowStep: 0 InfoAn icon representing the letter ‘i‘ in a circleNotice how now we keep sampling once inside the object, and each step returns a layer of the volume until the ray has entirely cast through it and the density is once again 0. That reframing of what an SDF represents ends up changing two core principles in our Raymarching technique that will have to be reflected in our code: ArrowAn icon representing an arrowWe have to march step-by-step with a constant step size along our rays. We no longer use the distance returned by the SDF. ArrowAn icon representing an arrowOur SDF now returns the opposite of the distance to the surface to properly represent the density of our object (positive on the inside, 0 on the outside) Diagram showcasing 3 points, P1, P2, and P3, being respectively, at a positive distance, small distance, and inside a sphere. Only P3 is considered 'valid' in the context of Volumetric Raymarching Our first Volumetric Raymarching scene Now that we have a grasp of sampling volumes using what we know about Raymarching, we can try implementing it by modifying an existing scene. For brevity, I'm not detailing the setup of a basic of Raymarching scenes. If you want a good starting point you can head to my Raymarching setup I already introduced in a previous article. The setup of the scene is quite similar to what we're familiar with in classic Raymarching; the modifications we'll need to do are located in: ArrowAn icon representing an arrowOur SDF functions: we'll need to return the opposite of the distance: -d instead of d. Example of SDF used in Volumetric Raymarching1float sdSphere(vec3 p, float radius) {2 return length(p) - radius;3}4 5float scene(vec3 p) {6 float distance = sdSphere(p, 1.0);7 return -distance;8} ArrowAn icon representing an arrowOur raymarch function: we'll need to march at a constant step size and start drawing only once the density is over 0. Volumetric Raymarching loop with constant step size1#define MAX_STEPS 1002 3const float MARCH_SIZE = 0.08;4//...5 6float depth = 0.0;7vec3 p = rayOrigin + depth * rayDirection;8 9vec4 res = vec4(0.0);10 11for (int i = 0; i < MAX_STEPS; i++) {12 float density = scene(p);13 if (density > 0.0) {14 // ...15 }16 17 depth += MARCH_SIZE;18 p = rayOrigin + depth * rayDirection;19} Now comes another question: what shall we draw once our density is positive to represent a volume? For this first example, we can keep things simple and play with the alpha channel of our colors to make it proportional to the density of our volume: the denser our object gets as we march into it, the more opaque/darker it will be. Simple Volumetric Raymarching loop1const float MARCH_SIZE = 0.08;2 3vec4 raymarch(vec3 rayOrigin, vec3 rayDirection) {4 float depth = 0.0;5 vec3 p = rayOrigin + depth * rayDirection;6 7 vec4 res = vec4(0.0);8 9 for (int i = 0; i < MAX_STEPS; i++) {10 float density = scene(p);11 12 // We only draw the density if it's greater than 013 if (density > 0.0) {14 vec4 color = vec4(mix(vec3(1.0,1.0,1.0), vec3(0.0, 0.0, 0.0), density), density );15 color.rgb *= color.a;16 res += color * (1.0 - res.a);17 }18 19 depth += MARCH_SIZE;20 p = rayOrigin + depth * rayDirection;21 }22 23 return res;24} If we try to render this code in our React Three Fiber canvas, we should get the following result 👀 Drawing Fluffy Raymarched Clouds We now know and applied the basics of Volumetric Raymarching. So far, we only rendered a simple volumetric sphere with constant density as we march through the volume, which is a good start. We can now try using that simple scene as a foundation to render something more interesting: clouds! Noisy Volume Going from our simple SDF of a sphere to a cloud consists of drawing it with a bit more noise. Clouds don't have a uniform shape nor do they have a uniform density, thus we need to introduce some organic randomness through noise in our Raymarching loop. If you read some of my previous articles, you should already be familiar with the concept of: ArrowAn icon representing an arrowNoise, Perlin noise, and value noise derivative ArrowAn icon representing an arrowFractal Brownian Motion, or FBM. ArrowAn icon representing an arrowTexture based noise. To generate raymarched landscapes, we used a noise texture, noise derivatives, and FBM to get a detailed organic result. We'll rely on some of those concepts to create organic randomness and obtain a cloud from our SDF ☁️. Noise function for Raymarched landscape1vec3 noise(vec2 x) {2 vec2 p = floor(x);3 vec2 f = fract(x);4 vec2 u = f * f * (3. - 2. * f);5 6 float a = textureLod(uTexture, (p + vec2(.0,.0)) / 256.,0.).x;7 float b = textureLod(uTexture, (p + vec2(1.0,.0)) / 256.,0.).x;8 float c = textureLod(uTexture, (p + vec2(.0,1.0)) / 256.,0.).x;9 float d = textureLod(uTexture, (p + vec2(1.0,1.0)) / 256.,0.).x;10 11 float noiseValue = a + (b-a) * u.x + (c-a) * u.y + (a - b - c + d) * u.x * u.y;12 vec2 noiseDerivative = 6. * f * (1. - f) * (vec2(b - a, c - a) + (a - b - c + d) * u.yx);13 14 return vec3(noiseValue, noiseDerivative);15} For clouds, our noise function looks a bit different: Noise function for Volumetric clouds1float noise(vec3 x ) {2 vec3 p = floor(x);3 vec3 f = fract(x);4 vec2 u = f * f * (3. - 2. * f);5 6 vec2 uv = (p.xy + vec2(37.0, 239.0) * p.z) + u.xy;7 vec2 tex = textureLod(uNoise,(uv + 0.5) / 256.0, 0.0).yx;8 9 return mix( tex.x, tex.y, u.z ) * 2.0 - 1.0;10} To tell you the truth, I saw this function in many Shadertoy demos without necessarily seeing a credited author or even a link to an explanation; I kept using it throughout my work as it still yielded a convincing cloud noise pattern. Here's an attempt at gathering together some of its specificities from my own understanding: ArrowAn icon representing an arrowClouds are 3D structures, so our function takes in a vec3 as input: a point in space within our cloud. ArrowAn icon representing an arrowThe texture lookup differs from its landscape counterpart: we're sampling it as a 2D slice from a 3D position. The vec2(37.0, 239.0) * p.z seems a bit arbitrary to me, but from what I gathered, it allows for more variation in the resulting noise. ArrowAn icon representing an arrowWe then mix two noise values from our texture lookup based on the z value to generate a smooth noise pattern and rescale it within the [-1, 1] range. InfoAn icon representing the letter ‘i‘ in a circleDuring my research, I found that game devs and other 3D creators use a large variety of noises to get more realistic-looking clouds. If you're interested in reading more on that topic, you can check the following write-ups (also quoted as source): ArrowAn icon representing an arrowHow Big Budget AAA Games Render Clouds ArrowAn icon representing an arrowThis presentation on the EA frostbite engine starting at page 30 Applying this noise along with a Fractal Brownian motion is pretty similar to what we're used to with Raymarched landscapes: Fractal Brownian Motion applied to our Volumetric Raymarching scene1float fbm(vec3 p) {2 vec3 q = p + uTime * 0.5 * vec3(1.0, -0.2, -1.0);3 float g = noise(q);4 5 float f = 0.0;6 float scale = 0.5;7 float factor = 2.02;8 9 for (int i = 0; i < 6; i++) {10 f += scale * noise(q);11 q *= factor;12 factor += 0.21;13 scale *= 0.5;14 }15 16 return f;17}18 19float scene(vec3 p) {20 float distance = sdSphere(p, 1.0);21 float f = fbm(p);22 23 return -distance + f;24} If we apply the code above to our previous demo, we do get something that starts to look like a cloud 👀: Adding light Once again, we're just "starting" to see something approaching our goal, but a crucial element is missing to make our cloud feel more cloudy: light. The demo we just saw in the previous part lacks depth and shadows and thus doesn't feel very realistic overall, and that's due to the lack of diffuse light. Light goes a long wayWe had similar issues in: ArrowAn icon representing an arrowOur first demo from the Raymarching blog post ArrowAn icon representing an arrowOur Dispersion shader Adding diffuse and optionally specular lighting can go a long way to give your shader material or scene a sense of depth. To add light to our cloud and consequentially obtain better shadows, one may want to apply the same lighting we used in standard Raymarching scenes: ArrowAn icon representing an arrowCalculate the normal of each sample point using our scene function ArrowAn icon representing an arrowUse the dot product of the normal and the light direction Diffuse lighting in Raymarched scene using normals1vec3 getNormal(vec3 p) {2 vec2 e = vec2(.01, 0);3 4 vec3 n = scene(p) - vec3(5 scene(p-e.xyy),6 scene(p-e.yxy),7 scene(p-e.yyx));8 9 return normalize(n);10}11 12void main() {13 // ...14 15 vec3 ro = vec3(0.0, 0.0, 5.0);16 vec3 rd = normalize(vec3(uv, -1.0));17 vec3 lightPosition = vec3(1.0);18 19 float d = raymarch(ro, rd);20 vec3 p = ro + rd * d;21 22 23 vec3 color = vec3(0.0);24 25 if(d<MAX_DIST) {26 vec3 normal = getNormal(p);27 vec3 lightDirection = normalize(lightPosition - p);28 29 float diffuse = max(dot(normal, lightDirection), 0.0);30 color = vec3(1.0, 1.0, 1.0) * diffuse;31 }32 33 gl_FragColor = vec4(color, 1.0);34} That would work in theory, but it's not the optimal choice for Volumetric Raymarching: ArrowAn icon representing an arrowThe getNormal function requires a lot of sample points to estimate the "gradient" in every direction. In the code above, we need 4, but there are code snippets that require 6 for a more accurate result. ArrowAn icon representing an arrowOur volumetric raymarching loop is more resource-intensive: we're walking at a constant step size along our ray to sample the density of our volume. Thus, we need another method or ap'''
