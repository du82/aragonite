["https://blog.maximeheckel.com/posts/building-magical-ai-powered-semantic-search"]
title = "Building a magical AI-powered semantic search from scratch - Maxime Heckel's Blog"
description = "An end-to-end walkthrough on how to build a semantic search from your own MDX or Markdown based content using Postgres vector similarity search and OpenAI's text embeddings and chat completion APIs."
full_description = '''HomeBuilding a magical AI-powered semantic search from scratchJune 6, 2023 / 30 min readLast Updated: June 6, 2023I have been writing on my blog for well over five years now on topics ranging from React, Framer Motion, (a lot of) Three.js/Shader, or anything that interests me at a given moment, which bundled together constitutes a significant amount of knowledge. I'm also fortunate enough to have a lot of readers, who often reach out to me with additional questions, and more often than enough, I already have an answer written for them on one or across several blog posts. Every time this happens, I wished there was a way for them, or even myself when I need a quick refresher, to type these questions somewhere and get a digest of the many things I wrote about a given topic. A kind of semantic search, but smarter. While my takes on the recent AI trends can be pretty mixed (🌶️ "LLMs are just good copywriters") the recent advancements in Large Language Models have made building these kind of features quite accessible and quick to implement: I managed to get my own AI-powered semantic search up and running against my own content within a few days of work ✨! With the ability to generate embeddings from raw text input and leverage OpenAI's completion API, I had all the pieces necessary to make this project a reality and experiment with this new way for my readers to interact with my content. On top of that, this was the perfect opportunity to try new UX patterns, especially with search responses being streamed in real time to the frontend to amplify the magic moment 🪄 for the user. In this article, I'll share everything about this project so you can build your own AI-powered semantic search from scratch! We'll go through how to index your content, what embedding vectors are and how to work with them, how to get a human-readable search output, as well as other tips I came up with while building this feature for myself. InfoAn icon representing the letter ‘i‘ in a circleWant to give it a try before diving into the nitty-gritty details? Hit CMD+K and select "Ask me anything!" or click the button below:Ask me anything! AcknowledgmentsThis project wouldn't have been possible without some help and some already existing write-ups: ArrowAn icon representing an arrowMan and machine: GPT for second brains by Robert Andrew Martin ArrowAn icon representing an arrowStoring OpenAI embeddings in Postgres with pgvector by the Supabase team ArrowAn icon representing an arrowHow ChatGPT works: a deep dive by @DanHollick ArrowAn icon representing an arrowand special thanks to @aleksandrasays who replied to my questions and put me on the right path at the beginning of this project This is also one of my first project I'm releasing that may or may not cost me a lot of money 😅 (hopefully I did an "ok" job at avoiding some pitfalls). If you like this project and want me to support me to take on more ambitious ones and write about them in the future, you can do so by buying me a coffee. The building blocks of an AI-powered semantic search To make this project a reality, I had two big problems to solve: ArrowAn icon representing an arrowIndexing the content of my blog: processing my MDX files and storing all that somewhere. ArrowAn icon representing an arrowGetting an accurate and human-readable output: finding similar sentences from my indexed content for a given query and returning a digestible and accessible response. Number one was definitely the most daunting to me as, if not done correctly, it could jeopardize the second part of the project and waste a lot of precious time. Luckily, OpenAI has APIs and plenty of documentation about this specific subject. All I had to do, was to: ArrowAn icon representing an arrowConvert chunks of my articles into a format called embeddings (more on that later) ArrowAn icon representing an arrowStore those embeddings in a database ArrowAn icon representing an arrowConvert the user query into an embedding as well ArrowAn icon representing an arrowCompare it against the stored embeddings Knowing that, I just had to find a way to output a human-readable format, but yet again, OpenAI provides a completion API where I could leverage the best copywriter in the world: ChatGPT! By crafting a prompt that takes the chunks of text that match the user's query along with a couple of rules to follow, we can get an accurate answer that's also not hallucinated by the LLM since it relies on content that's been written by me (a human). Of course, as we'll see later in this post, it's not that easy 😬. The only choice I had to make for this stack was where to store those embeddings. There are a lot of companies offering solutions for that, such as PineconeAI or Chroma, but I ended up opting for Supabase. I picked it because their solution for embeddings is a simple pgvector database (I've learned countless times throughout my career to never bet against Postgres) plus, they also wrote a comprehensive guide on using that database to build what I wanted to achieve! Architecture diagram showcasing the different elements composing the indexing and querying aspects of the semantic search project Transforming words to vectors The first step of this project involves indexing my content. In this case, "indexing" means the following: ArrowAn icon representing an arrowConverting my content into a format called embeddings. ArrowAn icon representing an arrowStoring those embeddings in a pgvector database. First, you may wonder what the hell embedding is and why you chose this format to begin with? Or you may have heard the term before and are not entirely sure what it is. Don't worry! The following section will demystify embeddings to get you up to speed! A quick introduction to embeddings Embeddings are multi-dimensional vectors that help us represent words as a point in space and also establish relationships between similar blocks of text or tokens. Converting text into a vector is super handy because it's easier to do math with them rather than words, especially when wanting to compute the "distance" or similarities between two ideas. For example, if we were to represent the vectors for words like "Javascript" and "code", they would be placed relatively close to one another in our vector space as they are closely related. On the other hand, the vector for the word "coffee" would be further apart from those two, as it does not have such a close relationship with them. Simplified representation of the similarities between different sets of words The cool thing is that you can get those vectors for individual words but also for entire sentences! Thus, we can get a mathematical representation of a given chunk of text from any piece of content on the blog, compare it with the vector of the user's query, and determine how close of a match those are. To compute the similarity between sentences/chunks of text, we can use the cosine similarity between their vector representation. The idea behind this technique is to look at the "angle" between those two vectors and calculate the cosine of that angle: ArrowAn icon representing an arrowThe smaller the angle, the closer to 1 its cosine is: the closer those vectors are related, and thus the sentences are similar. ArrowAn icon representing an arrowThe bigger the angle, the closer to 0 its cosine is: the further those vectors are related, and thus the sentences are not similar. Simplified representation of the cosine similarity between 3 words with arbitrary dimensions The MathHere's the breakdown of the math behind cosine similarity if you want to learn more about this notion. However, when comparing subjects that are more or less related, the threshold between what is considered similar or non-similar can be subtle. My blog is more or less always about code and Javascript, thus every user query will have a cosine similarity hovering above 0.5 with all chunks of text from my articles. Knowing that we'll have to set a higher cosine similarity threshold of, let's say, 0.85 to ensure that we only return the most related results for a given query. With the widget below, you can test out this concept against the vectorial representation of a set of sentences I generated with OpenAI's embedding API: ArrowAn icon representing an arrowNotice how closely related "code-related" sentences are despite being from different topics compared to the "non code-related" ones. ArrowAn icon representing an arrowNotice how when selecting the same two bucket of sentences, we get a similarity of 1.0 when comparing two identical sentences. Heatmap representing the cosine similarity between multiple sets of sentences1234560.70970.71350.74530.70930.71150.86300.84320.84110.7094Bucket 1Bucket 2Bucket 3Bucket 41. "I build animations for my React component in Framer Motion";2. "My shader uses uniforms and varyings to create a cool effect";3. "My dog loves to go to the park";Bucket 1Bucket 2Bucket 3Bucket 44. "Do you want some cake?";5. "My dog doesn't like cats";6. "I use shaders in my components with React Three Fiber"; Cleaning up and processing my MDX files My blog uses MDX, a flavor of Markdown I use to customize and enrich my content with React components for a more interactive experience. While being super handy, it added a lot of complexity to this project when I needed to extract the "raw text" of my articles to generate my embedding vectors: ArrowAn icon representing an arrowThere are random bits of code in the middle of my article that should not be indexed, like widgets or my Sandpack components. ArrowAn icon representing an arrowSome valuable content is nested within those bits of code that we need to keep. ArrowAn icon representing an arrowThere are bits of code very similar to the ones I need to remove that are actually valuable code snippets that I need to index. Despite this, I still managed to end up with an easy-to-follow function that meets all those requirements and is not a mess of regular expression: Simple MDX cleanup utility function1// Remove JSX syntax from a string2function removeJSX(str) {3 const regex = /<[^>]+>/g;4 return str.replace(regex, '');5}6 7// Extract the link text from a markdown link8function extractLink(text) {9 const regex = /\[([^\]]+)\]\(([^)]+)\)/g;10 return text.replace(regex, (match, p1, p2) => p1);11}12 13// Replace newline characters with spaces within a string14function replaceNewlineWithSpace(str) {15 return str.replace(/\n/g, ' ');16}17 18function cleanMDXFile(mdxContent) {19 const lines = mdxContent.split('\n');20 const sections = {};21 let currentSection = '';22 let currentContent = '';23 let inCodeBlock = false;24 25 for (const line of lines) {26 // Toggle the inCodeBlock flag when encountering code blocks27 if (line.startsWith('```')) {28 inCodeBlock = !inCodeBlock;29 }30 31 if (!inCodeBlock) {32 // Extract the link text from the line, remove any JSX syntax, and append it to the current section content33 const processed = extractLink(removeJSX(line));34 currentContent += `${processed}\n`;35 } else {36 // Append the line to the current section content when inside a code block37 currentContent += `${line}\n`;38 }39 40 // Replace newline characters with spaces in the current section content41 currentContent = replaceNewlineWithSpace(currentContent);42 }43 44 return currentContent;45} Once solved, another question immediately arose: how shall I split my content?. ArrowAn icon representing an arrowGenerating an embedding vector for the entire article wouldn't make much sense since a user may ask about only one specific concept introduced in a given post. The user wouldn't want to get an entire blog post spit out at them by the semantic search. Plus, we would never get a match as the cosine similarity between the query and the embedding vector would most likely be very low. ArrowAn icon representing an arrowSplitting in very small chunks could be problematic as well as the resulting vectors would not carry a lot of meaning and thus could be returned as a match while being totally out of context. I had to strike the right balance. Thankfully, @aleksandrasays already experimented with that in her own semantic search project: she split her articles into chunks of 100 tokens. I re-implemented a similar chunking mechanism with the same length token length which yielded great results! Splitting text into 100 tokens chunks1const GPT3Tokenizer = require('gpt3-tokenizer');2 3const MAX_TOKEN = 100;4 5function splitIntoChunks(inputText) {6 const Tokenizer = GPT3Tokenizer.default;7 const chunks = [];8 let chunk = {9 tokens: [],10 start: 0,11 end: 0,12 };13 14 let start = 0;15 16 const tokenizer = new Tokenizer({ type: 'gpt3' });17 18 const { text } = tokenizer.encode(inputText);19 20 for (const word of text) {21 const newChunkTokens = [...chunk.tokens, word];22 if (newChunkTokens.length > MAX_TOKEN) {23 const text = chunk.tokens.join('');24 25 chunks.push({26 text,27 start,28 end: start + text.length,29 });30 31 start += text.length + 1;32 33 chunk = {34 tokens: [word],35 start,36 end: start,37 };38 } else {39 chunk = {40 ...chunk,41 tokens: newChunkTokens,42 };43 }44 }45 46 chunks.push({47 ...chunk,48 text: chunk.tokens.join(''),49 });50 51 return chunks;52} TokensTokens, in this case, can be words, "subwords" or characters. If you want to learn more about or visualize what constitutes a token in a given sentence, you can try using OpenAI's own GPT tokenizer. Now that the content is cleaned-up and chunked into smaller pieces, we can query the OpenAI embeddings API to generate an embedding vector for each chunk. Generating embeddings for each chunk of text1const { Configuration, OpenAIApi } = require('openai');2 3const OPENAI_EMBEDDING_MODEL = 'text-embedding-ada-002';4const OPEN_AI_API_KEY = process.env.OPEN_AI_API_KEY;5 6// ...7for await (const chunk of chunks) {8 const vector = {9 input: chunk.text,10 metadata: {11 title: metadata.title,12 url,13 },14 };15 16 try {17 const { data: embed } = await openAI.createEmbedding({18 input: vector.input,19 model: OPENAI_EMBEDDING_MODEL,20 });21 const embedding = embed.data[0].embedding;22 23 // Save embedding along with metadata here24 } catch (error) {25 // handle error26 }27}28 29// ... Each call returns a 1536-dimensional vector, representing the block of text we just sent to the API, that we can now easily store and compare with other vectors. Storing and retrieving embeddings This part was surprisingly straightforward! The folks at Supabase already wrote about my use case and gave a detailed walkthrough on how to use their service to store OpenAI embedding vectors. As a frontend engineer, my experience with databases is limited, to say the least, but using a service like Supabase with the help of ChatGPT to write my SQL code to meet the needs of my project was very easy. I started by creating a table to store my documents where each entry in the table had the following fields: ArrowAn icon representing an arrowA unique identifier id. ArrowAn '''
