["https://blog.maximeheckel.com/posts/refraction-dispersion-and-other-shader-light-effects"]
title = "Refraction, dispersion, and other shader light effects - Maxime Heckel's Blog"
description = "A guide on how to reproduce a chromatic dispersion effect for your React Three Fiber and shader projects with FBO, refraction, chromatic aberration, specular, and other tricks through 9 interactive code playgrounds."
full_description = '''HomeRefraction, dispersion, and other shader light effectsJanuary 24, 2023 / 25 min readLast Updated: June 14, 2023Since my very first lines of React Three Fiber and shader code, I've been obsessed with light and how to reproduce some of its physical properties to add some delight to my 3D scenes ✨. I gathered countless examples of renders featuring those effects in my inspiration board, but one of them that always struck me as incredible was chromatic dispersion. Examples of dispersion effects by the Vercel Team, Davo Galavotti, and many other artists While most of those are renders or use specific shaders to emulate the dispersion, I really wanted to see if it was possible to reproduce this light effect along with others on the web by staying as close as possible to the physics of light and how it interacts with a mesh while keeping it real-time. Despite the complexity of the problem and an increasingly deep rabbit hole, I've since then somewhat achieved this goal, and I'm going to tell you all about that in this blog post! In this article, I'll go through the steps I took to build a shader material with a pleasing dispersion effect through refraction, chromatic aberration, specular, and other fascinating light effects. You'll see that, with some math and well-positioned light rays, you can get something truly magical 🪄. Before you start👉 This article assumes you have basic knowledge about shaders and GLSL, or read The Study of Shaders with React Three Fiber. InfoAn icon representing the letter ‘i‘ in a circleThe GLSL code in the demos will be displayed as strings as it was easier to make that work with React Three Fiber on Sandpack.To learn more on how to import .glsl files in your React project, check out glslify-loader. Bending light with refraction Achieving a realistic refraction effect requires first to make our mesh's material transparent. There are many ways to obtain this transparency effect with shaders, but for this article, I'll focus on one that I like quite a lot: using Frame Buffer Object FBOI briefly introduced Frame Buffer Objects in my blog post titled The magic world of Particles with React Three Fiber and Shaders.There, I showcase how you can use FBO to store the positions of the points within a particle system. Transparent mesh with FBO To make our mesh transparent: we perform "multiple passes" in our render loop, i.e. for each frame. In the diagram below, I illustrated what each phase achieves and what we end up rendering within our Frame Buffer Object: Diagram showcasing how to make a mesh transparent by hidding it, rendering the scene in an FBO, using the resulting texture on the mesh's material and showing it again. ArrowAn icon representing an arrowFirst, we hide our mesh by setting the visibility prop of our material to false. ArrowAn icon representing an arrowWe set the render target to the Frame Buffer Object. ArrowAn icon representing an arrowWe take a snapshot of our entire scene (the other meshes, the background, etc.) by rendering it in the render target. ArrowAn icon representing an arrowWe set the render target back to its original value of null. ArrowAn icon representing an arrowWe pass the texture data of our Frame Buffer Object to the mesh's material fragment shader using a uniform where it will be read and displayed. ArrowAn icon representing an arrowWe show our mesh by setting the visibility prop of our material to true. To do that, we can use React Three Fiber's handy useFrame hook so we can perform all those operations for each frame, allowing us to achieve real-time transparency 😮. The following code snippet showcases how to instantiate the render target and use it to obtain the entire scene as texture data: Excerpt of a R3F scene that renders a transparent mesh through an FBO1// ...2 3const Dispersion = () => {4 const mesh = useRef();5 const mainRenderTarget = useFBO();6 7 const uniforms = useMemo(8 () => ({9 uTexture: {10 value: null,11 },12 winResolution: {13 value: new THREE.Vector2(14 window.innerWidth,15 window.innerHeight16 ).multiplyScalar(Math.min(window.devicePixelRatio, 2)),17 },18 }),19 []20 );21 22 useFrame((state) => {23 const { gl, scene, camera } = state;24 // Hide the mesh25 mesh.current.visible = false;26 gl.setRenderTarget(mainRenderTarget);27 // Render into the FBO28 gl.render(scene, camera);29 30 // Pass the texture data to our shader material31 mesh.current.material.uniforms.uTexture.value = mainRenderTarget.texture;32 33 gl.setRenderTarget(null);34 // Show the mesh35 mesh.current.visible = true;36 });37 38 return (39 <mesh ref={mesh}>40 <icosahedronGeometry args={[2, 20]} />41 <shaderMaterial42 vertexShader={vertexShader}43 fragmentShader={fragmentShader}44 uniforms={uniforms}45 />46 </mesh>47 );48};49 50// ... Pixel RatioFor our transparency to work, we need to: ArrowAn icon representing an arrowPass the current resolution as a uniform to our shader material ArrowAn icon representing an arrowMake sure not to forget to multiply the width and height by the device's pixel ratio! From my experience, I also found that capping the device pixel ratio for your scene to 2 is sometimes necessary. On some iPhone models, it looks like the DPR value can go up to 3, which can mess up the look and feel of the final render. You can set the dpr prop with the allowed values on the Canvas component:1const Scene = () => {2 return (3 <Canvas camera={{ position: [-3, 0, 6] }} dpr={[1, 2]}>4 <Dispersion />5 </Canvas>6 );7}; We now need to display our FBO's texture data on our mesh. For that, we'll need to do two things in our fragment shader code: ArrowAn icon representing an arrowCreate a uv variable representing the texture coordinate. We can obtain it by dividing the screen space coordinates of the current pixel by the size of the viewport. 1uniform vec2 winResolution;2uniform sampler2D uTexture;3 4void main() {5 vec2 uv = gl_FragCoord.xy / winResolution.xy;6 //...7} ArrowAn icon representing an arrowUse the texture2D function to get the color of the texture's pixel for that uv coordinate. 1uniform vec2 winResolution;2uniform sampler2D uTexture;3 4void main() {5 vec2 uv = gl_FragCoord.xy / winResolution.xy;6 vec4 color = texture2D(uTexture, uv);7 8 gl_FragColor = color;9} Tada! 🪄 We now have a shader material that can make our mesh "transparent" by simply rendering the scene that's behind it onto it! Since this technique relies on a fragment shader, this gives us the ability to change how the texture looks and apply all sorts of effects, like refraction 👀! The code playground below showcases this entire scene, rendered, with all the steps we just went through. We will use this code as a base throughout this blog post. Refraction Now that we have a transparent mesh, it's time to work on our refraction effect by manipulating our FBO's texture data! But first, let's refresh our memory with how refraction works. Refraction occurs when light passes from one environment to another. The ray of light will bend in the new environment due to changes in the density of the material. Simple diagram showcasing how light gets refracted when passing from one environment to another. The intensity of that "bending" depends on the index of refraction (IOR) of that material. E.g. for water, that index is 1.333, and for diamond 2.42. The higher the index, the higher the "bending" effect of our refraction will appear. When it comes to implementing it, we're in luck! GLSL has a refract function ready to use. It needs three things: ArrowAn icon representing an arrowAn incident vector. In our case, it will be a vector originating from the observer (the camera) pointed toward our mesh. ArrowAn icon representing an arrowA normal vector. It represents our mesh's surface normal. ArrowAn icon representing an arrowAn ior ratio. The vertex shader of our material can help us get the first two vectors we need. The first one, which we can name eyeVector, can be obtained by normalizing the difference between the position of our mesh and the camera's. Vertex Shader: eyeVector1varying vec3 worldNormal;2varying vec3 eyeVector;3 4void main() {5 vec4 worldPos = modelMatrix * vec4(position, 1.0);6 vec4 mvPosition = viewMatrix * worldPos;7 8 gl_Position = projectionMatrix * mvPosition;9 eyeVector = normalize(worldPos.xyz - cameraPosition);10 11 //...12} For the second one, we get it by multiplying the normal vector of the current vertex by the normalMatrix and normalizing it. Vertex Shader: worldNormal1varying vec3 worldNormal;2varying vec3 eyeVector;3 4void main() {5 //...6 vec3 transformedNormal = normalMatrix * normal;7 worldNormal = normalize(transformedNormal);8} InfoAn icon representing the letter ‘i‘ in a circleWhy do we need to transform our normal vector? There's a mathematical reason behind it. Many shaders I studied did that and I found a lot of answers detailing why it's needed. Maybe this will be worth a dedicated mini article in the future? Then, as we learned in The Study of Shaders with React Three Fiber, we can pass those vectors from the vertex shader using a variant to have them available in the fragment shader. We now have everything to use the refract function and calculate a refraction vector based on the ior ratio and our eyeVector. Fragment Shader: refractVec1//...2varying vec3 worldNormal;3varying vec3 eyeVector;4 5void main() {6 float iorRatio = 1.0/1.31;7 vec2 uv = gl_FragCoord.xy / winResolution.xy;8 vec3 normal = worldNormal;9 vec3 refractVec = refract(eyeVector, normal, iorRatio);10 11 //...12} With that resulting vector, we can slightly shift each pixel of the texture coordinate, which gives us a relatively convincing refraction effect for our transparent material. Fragment Shader: apply refractVec to texture1//...2varying vec3 worldNormal;3varying vec3 eyeVector;4 5void main() {6 float iorRatio = 1.0/1.31;7 vec2 uv = gl_FragCoord.xy / winResolution.xy;8 vec3 normal = worldNormal;9 vec3 refractVec = refract(eyeVector, normal, iorRatio);10 vec4 color = texture2D(uTexture, uv + refractVec.xy);11 12 gl_FragColor = color;13} This effect is visible in the playground below 👇. I added OrbitControl to the scene so you can drag it around and see our newly built refraction in action! Try to tweak the iorRatio variable to increase/decrease the intensity of the refraction 👀! Chromatic Dispersion Dispersion happens when the IOR of a material varies with the wavelength of the color. As a result, the different colors composing light refract at different angles, thus making each color visible. Simple diagram showcasing how light gets refracted and dispersed when passing from one environment to another. Thus, with what we learned in the previous part, we should be able to reproduce this effect by applying individual IOR values for each of the color channels (which have their own wavelength) composing the background texture. Splitting colors with Chromatic Aberration For this effect, one essential aspect of colors in shaders to remember is that they are always a vec4, a vector with four components: red, green, blue, and alpha, and like any vector, we can access and manipulate each of those components. We can thus easily manipulate each value of R, G, and B by introducing a shift, thus splitting the color into its components. This effect is also sometimes called Chromatic Aberration. The widget below showcases this effect. We split the "white" color into its equivalent RGB colors: ArrowAn icon representing an arrowWhite has the value vec4(1.0) or rgb(255, 255, 255) ArrowAn icon representing an arrowRed has the value vec4(1.0, 0.0, 0.0, 1.0) or rgb(255, 0, 0) ArrowAn icon representing an arrowGreen has the value vec4(0.0, 1.0, 0.0, 1.0) or rgb(0, 255, 0) ArrowAn icon representing an arrowBlue has the value vec4(0.0, 0.0, 1.0, 1.0) or rgb(0, 0, 255) You'll notice the colors red, green, and blue being more visible as the intensity of the shift increases. RGB Shift/Chromatic Aberration effect visualizerShift intensity: 5 We can reproduce this in our fragment shader code by: ArrowAn icon representing an arrowIntroducing individual IOR for each value of R, G, and B. ArrowAn icon representing an arrowCreating unique refraction vectors for R, G, and B. ArrowAn icon representing an arrowApplying those refraction vectors for each color channel of the texture Fragment Shader: simple dispersion1uniform float uIorR;2uniform float uIorG;3uniform float uIorB;4//...5 6void main() {7 float iorRatioRed = 1.0/uIorR;8 float iorRatioGreen = 1.0/uIorG;9 float iorRatioBlue = 1.0/uIorB;10 11 vec3 color = vec3(1.0);12 13 vec2 uv = gl_FragCoord.xy / winResolution.xy;14 vec3 normal = worldNormal;15 16 vec3 refractVecR = refract(eyeVector, normal, iorRatioRed);17 vec3 refractVecG = refract(eyeVector, normal, iorRatioGreen);18 vec3 refractVecB = refract(eyeVector, normal, iorRatioBlue);19 20 float R = texture2D(uTexture, uv + refractVecR.xy).r;21 float G = texture2D(uTexture, uv + refractVecG.xy).g;22 float B = texture2D(uTexture, uv + refractVecB.xy).b;23 24 color.r = R;25 color.g = G;26 color.b = B;27 28 gl_FragColor = vec4(color, 1.0);29} Thanks to those few lines of code based on the definition of the dispersion effect, we can easily reproduce it on top of our original refraction scene. InfoAn icon representing the letter ‘i‘ in a circleExpand the little GUI in the demo to tweak the individual IOR values! There's, however, one small problem with the look of this effect: it's not really smooth and does not feel natural 😕. Thankfully, there're a few tricks we can use as workarounds to this issue. Additional samples for a smoother dispersion While I was obsessing about reproducing a natural dispersion, @ore_ukonpower released https://next.junni.co.jp/ which featured a beautiful version of that effect. On top of that, it's open source! So after digging around in the code base, I learned this new technique: using "samples" to smooth out the RGB shift we introduced above. To illustrate this technique, let's bring back the widget featuring the RGB shift effect. If we: ArrowAn icon representing an arrowiterate a certain number of times when rendering our dispersion ArrowAn icon representing an arrowintroduce an extra shift for each color channel for each loop We can obtain a better version for our effect. RGB Shift/Chromatic Aberration effect visualizer with samplesShift intensity: 5Samples: 1 As for the glsl implementation, we can achieve it by introducing a for-loop and iterating on our color shift for as many samples as we want. Fragment Shader: smoother dispersion with samples1uniform float uRefractPower;2uniform float uChromaticAberration;3 4// ...5 6vec3 color = vec3(0.0);7 8for ( int i = 0; i < LOOP; i ++ ) {9 float slide = float(i) / float(LOOP) * 0.1;10 11 vec3 refractVecR = refract(eyeVector, normal, iorRatioRed);12 vec3 refractVecG = refract(eyeVector, normal, iorRatioGreen);13 vec3 refractVecB = refract(eyeVector, normal, iorRatioBlue);14 15 color.r += texture2D(uTexture, uv + refractVecR.xy * (uRefractPower + sli'''
