title = "Painting with Math: A Gentle Study of Raymarching - Maxime Heckel's Blog"
description = "A compilation of my Raymarching and Signed Distance Field learnings and work. In it, I teach you how to leverage those techniques along with lighting models, smoothmin, soft shadows, and some math to create beautiful 3D raymarched scenes ranging from abstract shapes to infinite realistic-looking landscapes."
full_description = '''HomePainting with Math: A Gentle Study of RaymarchingSeptember 12, 2023 / 37 min readLast Updated: September 12, 2023Most of my experience writing GLSL so far focused on enhancing pre-existing Three.js/React Three Fiber scenes that contain diverse geometries and materials with effects that wouldn't be achievable without shaders, such as my work with dispersion and particle effects. However, during my studies of shaders, I always found my way to Shadertoy, which contains a multitude of impressive 3D scenes featuring landscapes, clouds, fractals, and so much more, entirely implemented in GLSL. No geometries. No materials. Just a single fragment shader. One video titled Painting a Landscape with Math from Inigo Quilez pushed me to learn about the thing behind those 3D shader scenes: Raymarching. I was very intrigued by the perfect blend of creativity, code, and math involved in this rendering technique that allows anyone to sculpt and paint entire worlds in just a few lines of code, so I decided to spend my summer time studying every aspect of Raymarching I could through building as many scenes as possible such as the ones below which are the result of these past few months of work. (and more importantly, I took my time to do that to not burnout as the subject can be overwhelming, hence the title 🙂) In this article, you will find a condensed version of my study of Raymarching to get a gentle head start on building your own shader-powered scenes. It aims to introduce this technique alongside the concept of signed distance functions and give you the tools and building blocks to build increasingly more sophisticated scenes, from simple objects with lighting and shadows to fractals and infinite landscapes. Before you start👉 This article assumes you have basic knowledge about shaders, noise, and GLSL, or read The Study of Shaders with React Three Fiber. InfoAn icon representing the letter ‘i‘ in a circleThis article will quote, and link the work of a lot of authors/creators I relied on to teach myself Raymarching. Among them are: ArrowAn icon representing an arrowInigo Quilez ArrowAn icon representing an arrowThe Art of Code ArrowAn icon representing an arrowSyntopia ArrowAn icon representing an arrowSimonDev also known as @iced_coffee_dev on Twitter. ArrowAn icon representing an arrowThe Book of Shaders I'm very thankful for the quality content they put out there, without which I would have probably not been able to grasp the concept of Raymarching. Snapshots of Math: demystifying the concept of Raymarching If you're already familiar with Three.js or React Three Fiber 3D scenes, you most likely encountered the concepts of geometry, material, and mesh and maybe even built quite a few scenes with those constructs. Under the hood, rendering with them involves a technique called Rasterization, the process of converting 3D geometries to pixels on a screen. Raymarching on the other hand, is an alternative rendering technique to render a 3D scene, without requiring geometries or meshes... Marching rays Raymarching consists of marching step-by-step alongside rays cast from an origin point (a camera, the observer's eye, ...) through each pixel of an output image until they intersect with objects in the scene within a set maximum number of steps. When an intersection occurs, we draw the resulting pixel. That's the simplest explanation I could come up with. However, it never hurts to have a little visualization to go with the definition of a new concept! That's why I built the widget below illustrating: ArrowAn icon representing an arrowThe step-by-step aspect of Raymarching: The visualizer below lets you iterate up to 13 steps. ArrowAn icon representing an arrowThe rays cast from a single point of origin (bottom panel) ArrowAn icon representing an arrowand the intersections of those rays with an object resulting in pixels on the fragment shader (top panel) -0.5,0.50.5,0.50,0-0.5,-0.50.5,-0.5RepeatAn icon representing an arrow twisted so it makes a loopArrowAn icon representing an arrowStep: 0 InfoAn icon representing the letter ‘i‘ in a circleNotice how the rays that did not intersect with the sphere in the visualizer above resulted in black pixels 👀. That means there was nothing to draw since there was no intersection with those rays before we reached the maximum amount of steps. Defining the World with Signed Distance Fields The definition I just gave you above is only approximately correct. Usually, when working with Raymarching: ArrowAn icon representing an arrowWe won't go step-by-step with a constant step distance along our rays. That would make the process very long. ArrowAn icon representing an arrowWe also won't be relying on the intersection points between the rays and the object. Instead, we will use Signed Distance Fields, functions that calculate the shortest distances between the points reached while marching alongside our rays and the surfaces of the objects in our scene. Relying on the distance to a surface lets us define the entire scene with simple math formulas ✨. For each step, calculating and marching that resulting distance along the rays lets us approach those objects until we're close enough to consider we've "hit" the surface and can draw a pixel. The diagrams below showcase this process: Diagram showcasing the Raymarching process of 3 rays beamed from a single point and marching step-by-step by a distance d obtained through a Signed Distance Field Notice how: ArrowAn icon representing an arroweach step of the raymarching (in green) goes as far as the distance to the object. ArrowAn icon representing an arrowif the distance between a point on our rays and the surface of an object is small enough (under a small value ε) we consider we have a hit (in orange). ArrowAn icon representing an arrowif the distance is not under that threshold, we continue the process over and over using our SDF until we reach the maximum amount of steps. By using SDFs, we can define a variety of basic shapes, like spheres, boxes, or toruses that can then be combined to make more sophisticated objects (which we'll see later in this article). Each of these have a specific formula that had to be reverse-engineered from the distance of a point to its surface. For example, the SDF of a sphere is equivalent to: SDF for a sphere centered at the origin of the scene1float sdSphere(vec3 p, float radius){2 return length(p) - radius;3} To help you understand why the SDF of a sphere is defined as such, I made the diagram below: Diagram showcasing 3 points, P1, P2, and P3, being respectively, at a positive distance, small distance, and inside a sphere. In it: ArrowAn icon representing an arrowP1 is at a distance d from the surface that is positive since the distance between P1 and the center of the sphere c is greater than the radius of the sphere r. ArrowAn icon representing an arrowP2 is very close to the surface and would be considered a hit since the distance between P2 and c is greater than r but lower than ε. ArrowAn icon representing an arrowP3 lies "within" the sphre, and technically we want our Raymarcher to never end up in such use case (at least for what is presented in this article). SDFsInigo Quilez compiled a list of SDFs for most shapes that you may need to get started with Raymarching.If you wish redemonstrate those formulas yourself to have a deeper understanding of SDFs The Art of Code has a great video showcasing the process. This is where the Math in Raymarching resides: through the definition and the combination of SDFs, we can literally define entire worlds with math. To showcase that power however, we first need to create our first "Raymarcher" and put in code the different constructs we just introduced. Our first Raymarched scene This introduction to the concept of Raymarching might have left you perplexed as to how one is supposed to get started building anything with it. Lucky for us, there are many ways to render a Raymarched scene, and for this article we're going to take the perhaps most obvious approach: use a simple Three.js/React Three Fiber planeGeometry as a canvas, and paint our shader on it. InfoAn icon representing the letter ‘i‘ in a circle@winkerVSbecks uses a different approach in his blog posts titled Iridescent crystal with raymarching and signed distance fields where he uses canvas-sketch which seems more adapted to render simple shaders on the web. Regardless of which medium you use, you should definitely check his write-up on Raymarching after reading this post 😄. The canvas Rendering a shader on top of a fullscreen planeGeometry is the technique I used during this Raymarching study: ArrowAn icon representing an arrowI didn't want too much time investigating more lightweight solutions. ArrowAn icon representing an arrowI still wanted to have easy access to tools like Leva. ArrowAn icon representing an arrowI was familiar with React Three Fiber's render loop and still wanted to reuse code I've written over the past two years, like uniforms, OrbitControls, mouse movements, etc. Below is a code snippet of my canvas that served as the basis for my Raymarching work: React Three Fiber scene used as canvas for Raymarching1import { Canvas, useFrame, useThree } from '@react-three/fiber';2import { useRef, Suspense } from 'react';3import * as THREE from 'three';4import { v4 as uuidv4 } from 'uuid';5 6import fragmentShader from './fragmentShader.glsl';7import vertexShader from './vertexShader.glsl';8 9const DPR = 0.75;10 11const SDF = (props) => {12 const mesh = useRef();13 const { viewport } = useThree();14 15 const uniforms = {16 uTime: new THREE.Uniform(0.0),17 uResolution: new THREE.Uniform(new THREE.Vector2()),18 };19 20 useFrame((state) => {21 const { clock } = state;22 mesh.current.material.uniforms.uTime.value = clock.getElapsedTime();23 mesh.current.material.uniforms.uResolution.value = new THREE.Vector2(24 window.innerWidth * DPR,25 window.innerHeight * DPR26 );27 });28 29 return (30 <mesh ref={mesh} scale={[viewport.width, viewport.height, 1]}>31 <planeBufferGeometry args={[1, 1]} />32 <shaderMaterial33 key={uuidv4()}34 fragmentShader={fragmentShader}35 vertexShader={vertexShader}36 uniforms={uniforms}37 wireframe={false}38 />39 </mesh>40 );41};42 43const Scene = () => {44 return (45 <Canvas camera={{ position: [0, 0, 6] }} dpr={DPR}>46 <Suspense fallback={null}>47 <SDF />48 </Suspense>49 </Canvas>50 );51};52 53export default Scene; I'm also passing a couple of essential uniforms to my shaderMaterial, which I advise you include as well in your own work, as they may become pretty handy to have around: ArrowAn icon representing an arrowuResolution contains the current resolution of the window. ArrowAn icon representing an arrowuTime represents the time since the scene was rendered on the screen. DPRHere's yet another PSA about device pixel ratio! Raymarching scenes can be really intensive, especially at higher resolutions (you'll see why very soon). That's why I'd recommend running most examples at a DPR of 1, but if you have a computer more on the weaker end in terms of specs, I'd recommend going even lower.With a lower DPR, you should be able to appreciate the shader-based scenes from this article at the maximum FPS possible. All demos will be editable so you can fine-tune that value to fit your needs. We need to do a few tweaks to our fragment shader before we can start implementing our Raymarcher: ArrowAn icon representing an arrowNormalize our UV coordinates. ArrowAn icon representing an arrowShift our UV coordinates to be centered. ArrowAn icon representing an arrowAdjust them to the current aspect ratio of the screen. These steps allow us to have our coordinate system where the center of the screen is at the coordinates (0, 0) while preserving the appearance of our shader regardless of screen resolutions and aspect ratios (it won't appear stretched). That process may be hard to understand at first, but here's a diagram to illustrate the math involved: Diagram illustrating the normalization, shift, and aspect ratio adjustements of our UV coordinates that make sure that our raymarched scenes will be resizable and at the correct aspect ratio. Beaming rays Let's implement our Raymarching algorithm step-by-step from the definition established earlier. We need: ArrowAn icon representing an arrowA rayOrigin from where all our rays will emerge from. E.g. vec3(0, 0, 5). ArrowAn icon representing an arrowA rayDirection equivalent to normalize(vec3(uv, -1.0)) to allow us to beam rays in every direction on the screen along the negative z-axis. ArrowAn icon representing an arrowA raymarch function to march from the rayOrigin following the rayDirection and detect when we're close enough to a surface to draw it. ArrowAn icon representing an arrowAn SDF of any kind (we'll use a sphere) that our raymarch function will use to calculate how close it is from the surface at any given point of the raymarching loop. ArrowAn icon representing an arrowA maximum number MAX_STEPS of steps and a surface distance SURFACE_DISTANCE from which we can safely assume we're close enough to draw a pixel. Diagram representing the position of a theoretical sphere and our ray origin in relation to the center of the scene. Our raymarch function will loop for up to MAX_STEPS until we reach the step limit, in which case we'll draw nothing or hit the surface of the shape defined by our SDF. Raymarch function1#define MAX_STEPS 1002#define MAX_DIST 100.03#define SURFACE_DIST 0.014 5float scene(vec3 p) {6 float distance = sdSphere(p, 1.0);7 return distance;8}9 10float raymarch(vec3 ro, vec3 rd) {11 float dO = 0.0;12 vec3 color = vec3(0.0);13 14 for(int i = 0; i < MAX_STEPS; i++) {15 vec3 p = ro + rd * dO;16 17 float dS = scene(p);18 dO += dS;19 20 if(dO > MAX_DIST || dS < SURFACE_DIST) {21 break;22 }23 }24 return dO;25} If we try running this code within our canvas, we should obtain the following result 👀 Adding some depth with light We just drew a sphere with solely GLSL code 🎉. However, it looks more like a circle because our scene has no light or lighting model implemented, which means our scene doesn't have much depth. That is quite similar to the first mesh you render in Three.js using MeshBasicMaterial: the lack of shadows and reflections or diffuse makes the result look flat. If you read my article Refraction, dispersion, and other shader light effects, we had a similar issue, and that's where we introduced the concept of diffuse light. Lucky us, we can reuse the same formula and principles from that blog post: by using the dot product of the normal of the surface and a light direction vector, we can get some simple lighting in our raymarched scene 💡. GLSL implementation of diffuse lighting1float diffuse = max(dot(normal, lightDirection), 0.0); DiffuseYou may wonder why we do the dot product to know whether a given point of the surface is hit by light or not, so here's a quick refresher: ArrowAn icon representing an arrowThe dot prod'''
