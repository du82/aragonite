title = "On Crafting Painterly Shaders - Maxime Heckel's Blog"
description = "A detailed essay on my research and process of building a shader to mimic paint, watercolor, and aquarelle by exploring various implementations of the Kuwahara image smoothing filter."
full_description = '''HomeOn Crafting Painterly ShadersOctober 29, 2024 / 34 min readLast Updated: October 29, 2024Writing a shader that can reproduce the look and feel of aquarelle, watercolor, or gouache to obtain a more painterly output for my WebGL scenes has always been a long-term goal of mine. Inspired by the work of very talented 3D artists such as @simonxxoo or @arpeegee, the contrast between paintings and the added dimension allowed by 3D renderers was always very appealing to me. On top of that, my recent work with stylized shaders to mimic the hand-drawn Moebius art style emphasized not only that obtaining such stylized output was possible but also that post-processing was more likely than not the key to emulating any artistic style. After several months of on/off research that frankly was not leading to much, I stumbled upon a smoothing filter I never heard about before: the Kuwahara filter. Lucky for me, it turned out that many (very smart) people published papers about it and its ability to transform any image input into a painting-like work of art. By implementing it into a custom post-processing pass and going through many ups and downs in the process, I got very close to my original objective by building what is essentially a real-time 3D painting running in the browser: This article is the culmination of months of work, trial and error, and research to craft the perfect painterly shader for your next WebGL project. In it, we will deep dive into the characteristics of the Kuwahara filter that make it so great at transforming our work into paintings, as well as look into several techniques highlighted in the many papers I read to improve the original implementation and have it return a sharper, and more anisotropic output. Finally, we'll go through a bit of color correction and the use of textures to achieve a satisfying and accurate painting effect. Sources ArrowAn icon representing an arrowWatercolor-like compositing in Blender a great video by @arpeegee who showcases Blender's Kuwahara filter node. ArrowAn icon representing an arrowArtistic Edge and Corner Enhancing Smoothing by Papari, Giuseppe, Petkov Nicolai, and Campisi Patrizio who are behind the extended version of the Kuwahara filter. ArrowAn icon representing an arrowAnisotropic Kuwahara Filtering with PolynomialWeighting Functions by Jan Eric Kyprianidis, Amir Semmo, Henry Kang, and Jürgen Döllner who wrote a paper on using a polynomial weighting function instead of a Gaussian and also gave a lot of details necessary for my implementation of the anisotropic Kuwahara filter. ArrowAn icon representing an arrowAnisotropic image segmentation by a gradient structure tensor by Karpushin Vladislav who details how to obtain and use the structure tensor of an image to compute its local orientation. Support my workEnjoying the content and feeling like supporting my work? You can show your appreciation by buying me a coffee which will give me the much-needed energy to take on more ambitious/high-quality articles and projects.Thank you for reading! Painterly post-processing with the Kuwahara filter Up until then, my only attempts at painterly shader consisted of several implementations of custom materials focused on emulating specific aspects of paint that I instinctively listed as essential to get a convincing output: ArrowAn icon representing an arrowThe absence of texture/normal detail ArrowAn icon representing an arrowPreserved edges ArrowAn icon representing an arrowQuantized colors Below is an example of one of my "best" iterations from that exploratory work. It notably uses a Voronoi noise to smudge normals and a paintbrush texture for a more realistic look and feel. However, despite my best efforts, this work was dead in the water as my implementation was severely flawed and only worked with a subset of meshes. From then on, I knew I had to go the post-processing route to solve most of those issues, but I didn't know how. Then, one day, I stumbled upon the beautiful work of @arpeegee, who gave me the keywords I was missing all this time: Kuwahara filter. <img alt="arpeegee" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" srcSet="/_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fprofile_images%2F1857460886283128833%2FDtHiOUh0_normal.jpg&amp;w=48&amp;q=75 1x, /_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fprofile_images%2F1857460886283128833%2FDtHiOUh0_normal.jpg&amp;w=96&amp;q=75 2x" src="/_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fprofile_images%2F1857460886283128833%2FDtHiOUh0_normal.jpg&amp;w=96&amp;q=75"/>Paul@arpeegeeI'm done with this one! Learned a lot in the process 😌 Blender / Cycles https://t.co/VCkYOJeBNw<img alt="I&#x27;m done with this one! Learned a lot in the process 😌 Blender / Cycles https://t.co/VCkYOJeBNw" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" srcSet="/_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fmedia%2FGVcppXpW4AAkPpT.jpg&amp;w=1920&amp;q=75 1x, /_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fmedia%2FGVcppXpW4AAkPpT.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fmedia%2FGVcppXpW4AAkPpT.jpg&amp;w=3840&amp;q=75"/><img alt="I&#x27;m done with this one! Learned a lot in the process 😌 Blender / Cycles https://t.co/VCkYOJeBNw" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" srcSet="/_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fmedia%2FGVcppXsWIAABPym.jpg&amp;w=1920&amp;q=75 1x, /_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fmedia%2FGVcppXsWIAABPym.jpg&amp;w=3840&amp;q=75 2x" src="/_next/image/?url=https%3A%2F%2Fpbs.twimg.com%2Fmedia%2FGVcppXsWIAABPym.jpg&amp;w=3840&amp;q=75"/>7:13 PM - Aug 20, 202430835 Characteristics of the Kuwahara filter Originally intended to remove noise through smoothing from medical images, the Kuwahara filter is most commonly used today to transform any input into stylistic paintings through post-processing. Unlike other smoothing filters that reduce noise but also, on the way, blur our edges, the Kuwahara filter is capable of preserving edges and corners. That specificity is what makes it so good at achieving painting-like artistic effects by getting us two crucial visual properties of paintings: ArrowAn icon representing an arrowThe smoothing erases some of the texture details. ArrowAn icon representing an arrowThe filter preserves the edges and, in some cases, increases the sharpness compared to the original input. It achieves this by executing the following steps on each pixel of our input, which in our case would be our underlying 3D scene: ArrowAn icon representing an arrowWe center a box around a pixel. ArrowAn icon representing an arrowWe divide the box into 4 "sub-boxes" or Sectors. ArrowAn icon representing an arrowWe calculate the average color and variance for each Sector. ArrowAn icon representing an arrowWe set our pixel to the average color of the Sector with the lowest variance. ReminderIn case you need a refresher, here are the formulas for the mean (average) and variance which are concepts we're going to use throughout this article: ArrowAn icon representing an arrowMean: μ = (1/n) * Σ(xi) for i = 1 to n ArrowAn icon representing an arrowVariance: σ² = (1/n) * Σ((xi - μ)²) for i = 1 to n For our filter, the lower the variance, the more likely the colors in the sectors are close to the average. I built the widget below to visually represent those sectors surrounding a given pixel at work: Display SectorsFilledEdge 1Edge 2RepeatAn icon representing an arrow twisted so it makes a loop You can see by selecting the edge examples that: ArrowAn icon representing an arrowwhen a pixel sits just outside an edge, the Sector with the lowest variance will always be outside the edge ArrowAn icon representing an arrowwhen a pixel sits just inside an edge, the Sector with the lowest variance will be inside the edge highlighting the edge-preserving capabilities of this filter. InfoAn icon representing the letter ‘i‘ in a circleGoing forward, we will refer to the size of the Sector as the kernel size. The widget below showcases how this process of picking the average color of the Sector with the lowest variance impacts an entire image: Enable Kuwahara filterStripesCircleKernel Size: 6 Notice how, with a reasonable kernel size, we maintain the overall shapes featured in the underlying image but erase many details like, in this case, transparency. However, we can also observe that with a higher kernel size, the image filter, unfortunately, falls apart and denatures quite drastically our input, indicating that we will have to strike the right balance between kernel size and the strength of our painterly post-processing effect. Our first implementation of the Kuwahara filter as a post-processing effect Now that we have a good understanding of the inner workings of the Kuwahara filter, let's implement it as a post-processing effect on top of a React Three Fiber scene. Much like the work done in Moebius-style post-processing and other stylized shaders, we will define our custom post-processing pass using the Pass class from the post-processing package. InfoAn icon representing the letter ‘i‘ in a circleNot familiar with setting up a custom post-processing pass for a React Three Fiber scene? I highly recommend checking out the article link above, where I go through that process with more details. I will not cover those steps again in this article.We could also define this first implementation as a custom Effect, however, given that we will need multiple passes at some point to improve our filter, I chose to use Pass throughout all the examples for consistency. This post-processing pass will: ArrowAn icon representing an arrowTake our underlying scene as an input. ArrowAn icon representing an arrowImplement the Kuwahara filter in its fragment shader. ArrowAn icon representing an arrowOutput the resulting scene. The implementation of it in GLSL goes as follows: Implementation of the Kuwahara filter in GLSL1#define SECTOR_COUNT 42 3uniform int kernelSize;4uniform sampler2D inputBuffer;5uniform vec4 resolution;6uniform sampler2D originalTexture;7 8varying vec2 vUv;9 10void getSectorVarianceAndAverageColor(vec2 offset, int boxSize, out vec3 avgColor, out float variance) {11 vec3 colorSum = vec3(0.0);12 vec3 squaredColorSum = vec3(0.0);13 float sampleCount = 0.0;14 15 16 for (int y = 0; y < boxSize; y++) {17 for (int x = 0; x < boxSize; x++) {18 vec2 sampleOffset = offset + vec2(float(x), float(y));19 vec3 color = sampleColor(sampleOffset);20 colorSum += color;21 squaredColorSum += color * color;22 sampleCount += 1.0;23 }24 }25 26 // Calculate average color and variance27 avgColor = colorSum / sampleCount;28 vec3 varianceRes = (squaredColorSum / sampleCount) - (avgColor * avgColor);29 variance = dot(varianceRes, vec3(0.299, 0.587, 0.114));30}31 32void main() {33 vec3 boxAvgColors[SECTOR_COUNT];34 float boxVariances[SECTOR_COUNT];35 36 getSectorVarianceAndAverageColor(vec2(-kernelSize, -kernelSize), kernelSize, boxAvgColors[0], boxVariances[0]);37 getSectorVarianceAndAverageColor(vec2(0, -kernelSize), kernelSize, boxAvgColors[1], boxVariances[1]);38 getSectorVarianceAndAverageColor(vec2(-kernelSize, 0), kernelSize, boxAvgColors[2], boxVariances[2]);39 getSectorVarianceAndAverageColor(vec2(0, 0), kernelSize, boxAvgColors[3], boxVariances[3]);40 41 float minVariance = boxVariances[0];42 vec3 finalColor = boxAvgColors[0];43 44 for (int i = 1; i < SECTOR_COUNT; i++) {45 if (boxVariances[i] < minVariance) {46 minVariance = boxVariances[i];47 finalColor = boxAvgColors[i];48 }49 }50 51 gl_FragColor = vec4(finalColor, 1.0);52} In the code featured above, we can see that: ArrowAn icon representing an arrowWe're allocating an array of vec3 and float to store the average color and variance for each of our Sectors, respectively. ArrowAn icon representing an arrowWe're computing those stats by sampling the color for every pixel in a given Sector along the x-axis and y-axis and calculating the average and variance using the formulas we saw in the previous part. ArrowAn icon representing an arrowWe then set minVariance and finalColor as the variance and average color of the first Sector by default. ArrowAn icon representing an arrowWe then loop through the other Sectors to find the Sector with the lowest variance and set its corresponding average color as the output of our fragment shader. VarianceNotice how the variance is initially calculated for each color channel (R, G, B), resulting in a vec3. By converting it to luminance, we reduce it to a single float value, which is easier to work with and compare. Doing this will result in a version of our scene with fewer texture details while preserving the overall shape of our geometries and also introducing artifacts that look somewhat like brush strokes: InfoAn icon representing the letter ‘i‘ in a circleNotice how: ArrowAn icon representing an arrowReducing the kernel size makes our output less "painterly" while increasing its value too high makes the image lose all texture detail. ArrowAn icon representing an arrowThe brush strokes introduced through the filter look too boxy due to the shape of our kernel. The Papari extension Through our initial implementation of the Kuwahara filter as a custom post-processing pass, we already achieved a somewhat convincing paint effect. However, it suffers from several drawbacks at high kernel sizes that may make our underlying scene not discernable by the viewer, and the appearance of our "brush strokes" could most likely be improved. Ideally, we could fix both these issues in one go by allowing larger kernel sizes for a more intense stylized effect for our scene and also have more natural-looking artifacts with a slight tweak of our Kuwahara filter. That is what Giuseppe Papari proposes in his paper Artistic Edge and Corner Enhancing Smoothing. In it, he presents an extension to the Kuwahara filter that: ArrowAn icon representing an arrowRemoves the square-shaped kernel in favor of a circular one. ArrowAn icon representing an arrowImproves the weight influence that each pixel has on the filter. In this part, we will implement some of those improvements with an additional section on potential performance improvements. It may sound absurd but; I like my paintings to run as close to 60fps as possible. Circular kernel A circular-shaped kernel allows us to increase the number of Sectors when e'''
