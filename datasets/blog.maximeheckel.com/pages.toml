title = "Guide to creating animations that spark joy with Framer Motion - Maxime Heckel's Blog"
description = "An interactive guide introducing everything I've learned about Framer Motion through fun examples and little case studies of animations I built."
full_description = '''HomeGuide to creating animations that spark joy with Framer MotionDecember 15, 2020 / 15 min readLast Updated: January 31, 2023Over the past few months, Framer Motion went from being a fun tool I played with on the side to a core element of my frontend projects when it comes to adding a layer of interaction to my UIs. I went from knowing almost nothing about animations and transitions, to being able to orchestrate more complex animations involving lots of elements. I've shared a lot of the animation work I sprinkled throughout my blog on Twitter, and a lot of you have asked me to share more code snippets. Thus I felt it was time for a little write-up! In this post, you'll find a condensed guide containing everything I've learned when it comes to Framer Motion, the key concepts of animation, and how to use this library to create animations that spark joy through some interactive examples and widgets. InfoAn icon representing the letter ‘i‘ in a circleTo illustrate the concepts we will see in this blog post, which are very visual, I included a series of editable code snippets/playgrounds and widgets to allow you to try out some of the core features of Framer Motion within the article itself! The aim was to help the reader understand the concepts by applying them, tweaking some code, visualizing examples.Regarding the interactive code snippets: You can edit the code to tweak the animation at will, and see the resulting animation on the left pane (top if you're on mobile).Let me know what you think of these examples and whether you've learned these Framer Motion concepts faster by doing! Anatomy of an animation First, let's take a look at the main elements that define an animation. When working on one, whether it's to move an element, changing its shape, or color, I always try to answer the following 3 questions: ArrowAn icon representing an arrow"Where/how is my element at the beginning?" i.e the initial state ArrowAn icon representing an arrow"Where it needs to go or which shape it needs to take by the end?" i.e. the target state ArrowAn icon representing an arrow"How it's going to transition from the initial state to the end state?" i.e. the transition state In the case of Framer motion, the library gives us a motion component which takes 3 properties (props) that let us define an answer to the 3 questions above: ArrowAn icon representing an arrowinitial: the state of our element at mount time. 1<motion.div2 ...3 initial={{4 x: 0,5 rotate: 45,6 }}7 ...8 /> ArrowAn icon representing an arrowanimate: the state in which our element will be at the end of the animation. 1<motion.div2 ...3 animate={{4 x: 50,5 rotate: 270,6 }}7 ...8 /> ArrowAn icon representing an arrowtransition: how our element goes from the initial state to the target state. This is where we can define which transition type we want to define, delays, or repetitions of the same transition. 1<motion.div2 ...3 transition={{4 ease: "easeIn",5 duration: 0.7,6 }}7 ...8 /> There are many types of transitions available in Framer Motion so I added this little comparative visualization below for you to see the little nuances between some of the main types and tweak their respective options: SpringMass: 3Stiffness: 100Damping: 11<motion.div2 ...3 transition={{4 type: 'spring',5 stiffness: 100,6 mass: 3,7 damping: 1,8 }}9 />10 TweenEaselineareaseIneaseOuteaseInOutcircIncircOutcircInOutbackInbackOutbackInOutanticipate1<motion.div2 ...3 transition={{4 type: 'tween',5 ease: 'easeInOut',6 duration: 2,7 ...8 }}9 />10 InertiaVelocity: 501<motion.div2 ...3 transition={{4 type: 'inertia',5 velocity: 50,6 }}7 />8 9 10 You can find the complete list of types and all their respective options in this section of the documentation. InfoAn icon representing the letter ‘i‘ in a circleGood to know:👉 You can substitute the animate prop for one of the more specific gesture props like whileHover or whileTap. They can take the same "animation object" we just saw.👉 Only one of animate or any of the gesture props is required to define an animated Framer Motion component.👉 The library provides smart defaults for initial and transition when they are not defined. It will even adapt the transition type (spring, tween, ease) based on which property you set in your animate prop! Now that we went through the basics, let's take a look at our first examples! Below you will find a series of animated components that you can edit and tweak at will. As for what to tweak, the following list contains a few interesting points that you can check out: ArrowAn icon representing an arrow**remove the **transition prop from the first component (Example1). Notice that this translation animation went from an ease type to a spring type. This comes from the "smart defaults" we just mentioned. ArrowAn icon representing an arrowcombine animations in Example2: change the second animation from a simple rotation to a rotation and a translation. I added hints in the comments of the code to guide you. 😄 PreviewConsoleStackAn icon representing 3 tiles on top of each otherPlayAn icon representing the play symbol, a triangle pointing to the rightRepeatAn icon representing an arrow twisted so it makes a loopXAn icon representing an XCleanimport { motion } from 'framer-motion'; import './scene.css'; const Example1 = () => { return ( <div style={{ marginBottom: '50px' }}> <p>Example 1</p> <motion.div style={{ background: 'linear-gradient(90deg,#ffa0ae 0%,#aacaef 75%)', height: '100px', width: '100px', borderRadius: '10px', }} /** Below, the initial and animation field are set to declare a translation animation along the horizontal axis "x" Hence why we're setting an "x" field in both objects. **/ initial={{ x: -100, }} animate={{ x: 100, }} /** The code below specifies the transition type for our element. You can comment the whole transition prop below, and Framer Motion will fallback to "smart defaults". In this case, since we have a translation, the default transition type is spring, so you should see the element moving from left to right and "bounce" a when reaching its target state, like a spring! **/ transition={{ type: 'tween', ease: 'easeInOut', repeat: Infinity, repeatType: 'reverse', repeatDelay: 1, duration: 2, }} /> </div> ); }; const Example2 = () => { return ( <div style={{ marginBottom: '50px' }}> <p>Example 2</p> <motion.div style={{ background: 'linear-gradient(90deg,#ffa0ae 0%,#aacaef 75%)', height: '100px', width: '100px', borderRadius: '10px', }} /** Combining animations in Framer Motion is very easy! You can simply add extra fields to your initial and target object. Here for example, our element rotates between 0 and 180 degrees, if we want to have it translate horizontally at the same time, we can simply add an "x" field, like in the example above. I added these fields below, commented. If you uncomment them, you should see our element both rotate and translate at the same time. You can try changing the translation from horizontal to vertitcal, by replacing the "x" field with an "y" field. **/ initial={{ rotate: 0, // x: -100 }} animate={{ rotate: 180, // x: 100 }} transition={{ type: 'tween', ease: 'easeInOut', repeat: Infinity, repeatType: 'reverse', repeatDelay: 1, duration: 2, }} /> </div> ); }; const Examples = () => ( <div> <Example1 /> <Example2 /> </div> ); export default Examples; InfoAn icon representing the letter ‘i‘ in a circleWant to go a bit further before jumping into the next part? Here's a link to the related doc: How to animate in Framer Motion. Using variants Now that we've seen and tweaked our first Framer Motion based components, you might notice that, in the case of complex animations, things can quickly get messy. Defining everything inline can lead to your motion components being fairly hard to read but also a bit repetitive. This is why one of my favorite features of Framer Motion is the ability to define animations in a declarative way through variants. Variants are sets that have predefined animation objects, the kind of object we passed in the examples above in the animation prop. The following is an example showcasing how you can leverage variants. Notice how we declared a set of variants within the buttonVariants object and how the respective keys of these variants are referenced in the motion component: Using variants with the motion component1import { motion } from 'framer-motion';2 3const AnimatedButton = () => {4 const buttonVariants = {5 hover: {6 scale: 1.5,7 },8 pressed: {9 scale: 0.5,10 },11 rest: {12 scale: 1,13 },14 };15 16 return (17 <motion.button18 initial="rest"19 whileHover="hover"20 whileTap="pressed"21 variants={buttonVariants}22 >23 Click me!24 </motion.button>25 );26}; After seeing these variants the first time, like me, you might be wondering "wait, if everything is predefined, how can I make my animations based on some dynamic property?" Well, don't you worry! Framer Motion lets you also define variants as functions. Each variant as a function can take one argument and return and animation object. That argument has to be passed in the custom prop of your motion component. The example below showcases an example of variant as function, the hover variant will return a different object whether the button is clicked or not. The state of the button isClicked is passed in the custom prop of the motion component. Using variants and the custom prop with the motion component1import { motion } from 'framer-motion';2 3const AnimatedButton = () => {4 const buttonVariants = {5 // any variant declared as a function will inherit the `custom prop` as argument6 hover: (clicked) => ({7 // once clicked the button will not scale on hover anymore8 scale: clicked ? 1 : 1.5,9 }),10 pressed: {11 scale: 0.5,12 },13 rest: {14 scale: 1,15 },16 };17 18 const [clicked, setClicked] = React.useState(false);19 20 return (21 <motion.button22 initial="rest"23 whileHover="hover"24 whileTap="pressed"25 variants={buttonVariants}26 custom={clicked}27 onClick={() => setClicked(true)}28 >29 Click me!30 </motion.button>31 );32}; Now that we know what variants are, let's try to work with them in the following playground. Let's try to: ArrowAn icon representing an arrowmake the first button scale on hover (for now, it only rotates). ArrowAn icon representing an arrowmake the button not scale back to its original size if it's been clicked on. Hint: you can use the custom prop we just mentioned above 💡. Like in the first part, I left comments in the code to guide you! PreviewConsoleStackAn icon representing 3 tiles on top of each otherPlayAn icon representing the play symbol, a triangle pointing to the rightRepeatAn icon representing an arrow twisted so it makes a loopXAn icon representing an XCleanimport { motion } from 'framer-motion'; import React from 'react'; import './scene.css'; const Example = () => { const [isClicked, setIsClicked] = React.useState(false); React.useEffect(() => { if (isClicked) { setTimeout(() => setIsClicked(false), 3000); } }, [isClicked]); const duration = 0.6; const buttonVariants = { hover: { /** * Combining different animation in variants works the same way it works * for inline animation objects * * For the first example, to make the button scale, you simply have to * uncomment the following. Once done, hover the button and notice how * it now double in size! */ // scale: 2, rotate: 360, }, pressed: { scale: 0.95, }, clicked: { scale: 1, }, notClicked: { scale: 1, }, }; /** * Comment the buttonvariants object above and * uncomment the one below to try out the second * example: * * - the button will not scale back to its basic size once clicked * - once clicked, the hover animation will not happen. It will use * the "isClicked" custom prop passed to the button component below */ /* const buttonVariants = { hover: (isClicked) => ({ scale: isClicked ? 2 : 3, rotate: isClicked ? 0 : 360, }), pressed: { scale: 0.95, }, clicked: { scale: 2, }, notClicked: { scale: 1, }, }; */ return ( <motion.button style={{ background: 'linear-gradient(90deg,#ffa0ae 0%,#aacaef 75%)', color: 'black', border: 'none', height: '50px', width: '200px', borderRadius: '10px', cursor: isClicked ? 'default' : 'pointer', outline: 'none', boxShadow: '6px 4px 12px -6px rgba(0,24,40,0.25)', }} aria-label="Click Me!" title="Click Me!" onClick={() => { setIsClicked(true); }} /** * Here we pass the buttonVariants object as variants. It contains 4 * different target objects * - hover: which is used for the whileHover prop * - pressed: which is used for the whileTap prop * - clicked and notClicked which are respecively used for animate prop * when the button is clicked and not clicked (based on the state of the * button) * * Reference to these animation objects are passed as strings to their * props * * e.g. whileHover="hover" */ variants={buttonVariants} animate={isClicked ? 'clicked' : 'notClicked'} whileHover="hover" whileTap="pressed" /** * Uncomment the following to allow our buttonVariants objects to know * about the status of the button. * * This lets us redefine variants based on the status button */ // custom={isClicked} transition={{ duration, }} > {isClicked ? 'Clicked!' : 'Click Me!'} </motion.button> ); }; export default Example; Advanced animations using Motion Values At this point, we know how to use the key features of Framer Motion to start building our own animations: ArrowAn icon representing an arrowwe know the main elements that define an animation ✅ ArrowAn icon representing an arrowwe know how to use variants to define animations in a declarative way ✅ With those newly acquired skills, we can now look at on more concept that will allow us to build more advanced animations: Motion Values. In this part we will learn what are Motion Values and how to use them and also looked at a practical example to illustrate this concept: my own "Copy To Clipboard" button! Motion Values A MotionValue is an internal value to the Framer Motion library that "tracks the state and the velocity of an animating value". For more complex animation we may want to create our own MotionValue (quote from the docs), and then add them as inline style to a given component. To define a MotionValue, we need to use the useMotionValue hook. A MotionValue can be practical when you want to have one animation depending on another one. For example, we may want to tie together the scale and the opacity of a component in such a way that, once the component reaches half of its targeted scale, the opacity should be equal to 100%. To handle that kind of use case, Framer Motion gives us a second hook: useTransform that transforms an input MotionValue to another MotionValue through a function. The example below showcases how you can use these 2 hooks together: PreviewConsoleStackAn icon representing 3 tiles on top of each otherPlayAn icon representing the play symbol, a triangle pointing to the rightRepeatAn icon representing an arrow twisted so it makes a loopXAn icon representing an XCleanimport { motion, useMotionValue, useT'''
