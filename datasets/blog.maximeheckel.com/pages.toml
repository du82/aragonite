["https://blog.maximeheckel.com/posts/moebius-style-post-processing"]
title = "Moebius-style post-processing and other stylized shaders - Maxime Heckel's Blog"
description = "A detailed essay on the process of building a post-processing stylized shader reproducing the style of legendary artist Jean Giraud a.k.a Moebius for your React Three Fiber projects. In it, I detail the process of drawing outlines with a Sobel Filter as well as custom shadow and lighting patterns to bring a unique style to your WebGL scene."
full_description = '''HomeMoebius-style post-processing and other stylized shadersMarch 26, 2024 / 34 min readLast Updated: August 5, 2024Physically Based Rendering (PBR) is often the defacto stylistic choice for 3D developers as tools/frameworks, for the most part, optimize for realistic materials, shadows, and lighting out-of-the-box. However, in an industry constantly pushing for realism, adopting Non-Photorealistic Rendering (NPR) or stylized shaders while still following physical principles can really make your project stand out. There's been a recent resurgence in distinct artistic directions through the use of stylized shaders in many games. At least since Zelda BOTW came out, it's becoming more prevalent. While Hi-Fi Rush or the Persona series are great examples of Non-Photorealistic Rendering, there are a few indie games out there (e.g. Sable and Synergy) doing wonders by emulating a flavor of a hand-drawn art style which I particularly enjoy from legendary artist Jean Giraud aka Moebius. So far, I've only ever tried reproducing physically accurate lighting effects or base my scene in the "real world" with no styling at all, and I wanted to see whether reproducing some aspect of Jean Giraud's visual art in a WebGL environment was possible. Luckily, @UselessGameDev made a great video on reproducing the Moebius style. In it, he deconstructs the key characteristics that make the Moebius style so unique and rebuilds each of them in Unity. After carefully studying the subjects covered in that video and spending a couple of days heads-down on the problem, I managed to build what is to me a very satisfying Moebius post-processing pass on top of a React Three Fiber scene. It features not only all the elements of Moebius' style (outlines, crosshatched shadows, and specular) but also elements usually featured in his more sci-fi-focused comic books: desert, spaceships, and alien planets looming in the distance. In this article, we will deconstruct this art style and reproduce it step-by-step as a post-processing pass that you can put on top of any React Three Fiber scene. We will learn how to output hand-drawn looking outlines by leveraging an edge detection filter and stylize our final render while preserving physical elements like lighting and shadows with an extra touch of creativity. Finally, we'll look at some of the shortcomings of this render pipeline and how I worked around them in my own creations. Sources ArrowAn icon representing an arrowHow Persona Combines 2D and 3D Art by @Acerola_t ArrowAn icon representing an arrowUnlocking The Power Of Unity's Scriptable Render Pipeline by Game Dev Guide ArrowAn icon representing an arrowMoebius-style 3D Rendering by @UselessGameDev ArrowAn icon representing an arrowSketchy Pencil Effect with Three.js Post-Processing by @maya_ndljk ArrowAn icon representing an arrowtxstc55 who explored as well this effect last year Setting up the stage for post-processing We want to apply the Moebius style to a React Three Fiber scene as a whole, not just as a material of the individual meshes that compose it. Knowing that, we'll need to use a post-processing pass that can apply this style to an already rendered scene. A post-processing pass acts like an "image filter" on top of your scene to apply any modifications you'd like. @react-three/postprocessing has many effects like Bloom, Vignette, or Depth of Field built in, which you can find on many popular 3D websites. However, none of the prebuilt ones are even close to what we want to achieve, so we'll have to build it ourselves by implementing our own Pass based on a custom shader. DocsNot familiar with post-processing effects in React Three Fiber? Head to the documentation first for a quick catch-up! Unfortunately @react-three/postprocessing does not allow for custom passes, so we'll need to go "vanilla" and use more Three.js flavored code for this part. You may be familiar with how Three.js projects set up their post-processing pipeline using effectcomposer and the many flags that we need to turn on for each pass to take effect, but thanks to @react-three/drei's Effects component, this entire setup is now a bit simpler: Our scene and a skeleton post-processing pass1import { Effects } from '@react-three/drei';2import { extend } from '@react-three/fiber';3import { Pass } from 'postprocessing';4import { useRef } from 'react';5import * as THREE from 'three';6 7class MoebiusPass extends Pass {8 constructor(args) {9 super();10 }11 12 dispose() {}13 14 render(renderer, writeBuffer, readBuffer) {}15}16 17extend({ MoebiusPass });18 19const MoebiusScene = () => {20 const mesh = useRef();21 const ground = useRef();22 23 const lightPosition = [10, 10, 10];24 25 return (26 <>27 <directionalLight28 castShadow29 position={lightPosition}30 intensity={4.5}31 color="#fff"32 target={ground.current}33 />34 <mesh castShadow receiveShadow position={[-1, 2, 1]}>35 <sphereGeometry args={[1, 32, 32]} />36 <meshStandardMaterial color="orange" />37 </mesh>38 <mesh39 castShadow40 receiveShadow41 rotation={[0, Math.PI / 3, 0]}42 position={[2, 0.75, 2]}43 >44 <boxGeometry args={[1.5, 1.5, 1.5]} />45 <meshStandardMaterial color="hotpink" />46 </mesh>47 <mesh48 ref={ground}49 receiveShadow50 rotation={[-Math.PI / 2, 0, 0]}51 position={[0, 0, 0]}52 >53 <planeGeometry args={[10, 10, 100, 100]} />54 <meshStandardMaterial color="white" />55 </mesh>56 <Effects>57 <moebiusPass />58 </Effects>59 </>60 );61};62 63// ... InfoAn icon representing the letter ‘i‘ in a circleUpdate: at the time of writing this article I was not familiar with the possibility of writing custom post-processing effects which could have also been a solution here to build our stylized shader.If you want to learn more about effects and how to use custom shaders with them, my article The Art of Dithering and Retro Shading for the Web covers this topic. You can see in the code snippet above that: ArrowAn icon representing an arrowWe created a MoebiusPass class that extends from Pass. This class will let us define everything we need for our Moebius style. ArrowAn icon representing an arrowWe "extended" React Three Fiber's namespace with our MoebiusPass allowing us to use it as a standard JSX component. ArrowAn icon representing an arrowFinally, we used our newly created pass inside the Effects component. Now that we wired this together, let's create a custom shader for our post-processing pass to render on the screen. We'll first create a very simple shader to make sure that everything functions as intended: Sample post-processing pass using a custom shader material1//...2import { FullScreenQuad } from "three-stdlib";3 4const moebiusShader = {5 uniforms: {6 tDiffuse: { value: null },7 },8 vertexShader: \`9 varying vec2 vUv;10 11 void main() {12 vUv = uv;13 14 gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);15 }16 \`,17 fragmentShader: \`18 varying vec2 vUv;19 uniform sampler2D tDiffuse;20 21 void main() {22 vec2 uv = vUv;23 vec4 color = texture2D(tDiffuse, uv);24 25 gl_FragColor = vec4(color.r + 0.2, color.g, color.b, color.a);26 }27 \`,28}29 30class MoebiusPass extends Pass {31 constructor(args) {32 super();33 34 this.material = new THREE.ShaderMaterial(moebiusShader);35 this.fsQuad = new FullScreenQuad(this.material);36 }37 38 dispose() {39 this.material.dispose();40 this.fsQuad.dispose();41 }42 43 render(renderer, writeBuffer, readBuffer) {44 this.material.uniforms.tDiffuse.value = readBuffer.texture;45 46 if (this.renderToScreen) {47 renderer.setRenderTarget(null);48 this.fsQuad.render(renderer);49 } else {50 renderer.setRenderTarget(writeBuffer);51 if (this.clear) renderer.clear();52 this.fsQuad.render(renderer);53 }54 }55}56//... Much like I explored last year in my blog post on render targets, our pass consists of a simple FullScreenQuad that overlays the scene and a material that takes the underlying scene as a texture (tDiffuse), and modifies it. In this case, you should see that our base scene has now a red tint, as we increased the intensity of the red channel in the fragment shader of our post-processing pass. Drawing outlines with shaders for our React Three Fiber scene With our post-processing pass now implemented, we can start making our way toward building some of the key aspects of the Moebius style. One of the first striking elements of this art style is its consistent outlines, as most of Jean Giraud's creations are drawings. Thus, we will need to find a way to draw outlines around all the objects of our React Three Fiber scenes and to do that, we'll need to implement an edge detection filter. An edge detection filter identifies points in our scene where the brightness changes sharply, for instance, between the pixels of an object in the foreground and the background, to then place our outline around each object pretty accurately. In our case: ArrowAn icon representing an arrowWe'll implement a Sobel Filter, a type of edge detection filter. ArrowAn icon representing an arrowWe'll feed our filter both the Depth data and Normal data of our scene and combine the result obtained. Getting the Depth Buffer of our scene Why would we need the "depth data" of our scene? This data will tell us on which plane the objects of our scene belong and thus find any "depth discontinuities" and highlight where the outer outlines of the overall scene should be. First things first, let's work our way towards getting the depth information of our scene. We can use our good ol' useFBO hook to create a render target, but this time, we will also pass a depthTexture onto it and flip the depthBuffer option to `true. Setting up our depthTexture1const depthTexture = new THREE.DepthTexture(2 window.innerWidth,3 window.innerHeight4);5 6const depthRenderTarget = useFBO(window.innerWidth, window.innerHeight, {7 depthTexture,8 depthBuffer: true,9}); DepthTextureIn the code snippet above, we're defining a specific type of texture: a DepthTexture. It lets us store the depth information of the scene for a given camera, and that information will be available to us as a grayscale representation of the scene where: ArrowAn icon representing an arrowThe lighter the pixels, the further away from the camera they are. ArrowAn icon representing an arrowThe darker the pixels, the closer to the camera they are. We then use our render target within our useFrame hook to render the current scene onto it and pass its resulting depthTexture to our post-processing pass. Passing the Depth data of the scene to our post-processing pass1const MoebiusScene = () => {2 //...3 const { camera } = useThree();4 5 useFrame((state) => {6 const { gl, scene, camera } = state;7 8 gl.setRenderTarget(depthRenderTarget);9 gl.render(scene, camera);10 11 gl.setRenderTarget(null);12 });13 14 return (15 <>16 {/*...*/}17 <Effects>18 <moebiusPass19 args={[20 {21 depthRenderTarget,22 camera,23 },24 ]}25 />26 </Effects>27 </>28 );29}; We can now try to visualize our depth texture by rendering it through the fragment shader of our custom post-processing pass. However, we'll first need to know how to "read" this texture within our fragment shader, as this is not your typical sampler2D data that you can read with texture2D in GLSL. Luckily, @mattdesl provided a great example on how to read depth textures in one example that he built for the Three.js documentation. With this function, we obtain the value of the "depth" of the pixel represented by a grayscale color, which we can then return as an output of our fragment shader: Fragment shader returning the depth of every pixel represented by a grayscale color1#include <packing>2varying vec2 vUv;3uniform sampler2D tDiffuse;4uniform sampler2D tDepth;5uniform float cameraNear;6uniform float cameraFar;7 8float readDepth( sampler2D depthTexture, vec2 coord ) {9 float fragCoordZ = texture2D( depthTexture, coord ).x;10 float viewZ = perspectiveDepthToViewZ( fragCoordZ, cameraNear, cameraFar );11 return viewZToOrthographicDepth( viewZ, cameraNear, cameraFar );12}13 14void main() {15 vec2 uv = vUv;16 17 float depth = readDepth( tDepth, vUv );18 19 gl_FragColor = vec4(vec3(depth), 1.0);20} The demo below showcases the output of our post-processing pass returning the "depth data" of our scene 👇 Notice how the pixels closer to the camera appear darker than the ones further away. Also, notice how our depth buffer renders the background of the scene plain white, as the pixels composing it are the furthest from our viewpoint.Since all the objects of our main scene are close to one another, I added an extra sphere in this demo at z=-150, so the grayscale depth color would be more striking. Getting the Normal Buffer of our scene While the depth data gives us information on the outer boundaries of our scenes, the Normal data will help us find the inner outlines within our scene: ArrowAn icon representing an arrowIf our edge detection filter finds higher differences in normals, that will mean there's a very sharp corner, thus a very pronounced outline. ArrowAn icon representing an arrowIf the difference in normals is not that significant, we'll get a more subtle outline or no outline under a certain threshold. If you read my blog post on Caustics, you might be familiar with the exercise of "capturing the normals" in a render target. While this is a valid technique, it is a bit too "brute force" for our post-processing use case: we'd have to manually apply a NormalMaterial for each mesh composing our scene 😮‍💨. But we don't have time for that and have better things to do! Instead, we'll override the entire scene with a NormalMaterial (or CustomNormalMaterial in our case because we'll need to tweak it in the later parts) using the scene.overrideMaterial property: Example of usage of the overrideMaterial property of the scene object1scene.matrixWorldNeedsUpdate = true;2scene.overrideMaterial = NormalMaterial; As with the depth texture, we'll define a dedicated render target for our render target, render our scene outputting its Normal data, and pass the result as an argument of our post-processing pass. Passing the Normal data of our scene to our post-processing pass1const MoebiusScene = () => {2 const normalRenderTarget = useFBO();3 //...4 5 useFrame((state) => {6 const { gl, scene, camera } = state;7 8 gl.setRenderTarget(depthRenderTarget);9 gl.render(scene, camera);10 11 const originalSceneMaterial = scene.overrideMaterial;12 gl.setRenderTarget(normalRenderTarget);13 14 scene.matrixWorldNeedsUpdate = true;15 scene.overrideMaterial = CustomNormalMaterial;16 17 gl.render(scene, camera);18 scene.overrideMaterial = originalSceneMaterial;19 20 gl.setRenderTarget(null);21 });22 23 return (24 <>25 {/*...*/}26 <Effects>27 <moebiusPass28 args={[29 {30 depthRenderTarget,31 normalRenderTarget,32 camera,33 },34 ]}35 />36 </Effects>37 </>38 );39}; Finally, if needed, we can visualize the Normal data by returning it as output of our custom post-processing shader pass. There are no tricks here: we can use the standard texture2D function to read '''
