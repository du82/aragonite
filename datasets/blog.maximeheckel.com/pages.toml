["https://blog.maximeheckel.com/posts/immigrating-to-the-us-my-path"]
title = "Immigrating to the US - Maxime Heckel's Blog"
description = "US immigration explained for American citizens by an immigrant."
full_description = '''HomeImmigrating to the USJune 26, 2020 / 16 min readLast Updated: June 29, 2020Amid the recent worker visa ban and green card process halt due to growing unemployment in the US, I was surprised to see so few American citizens knowing what the visas impacted are, while, at the same time, having a lot of opinions about them. I saw too many people debating on Twitter whether the current immigration policy was a net good or a net negative to the country, without even knowing what rights an H1-B visa holder had or thinking that getting a green card was as easy as stepping into a DMV to get a driver's license. I wanted to write this blog post a while ago and thought that maybe this was a good time to explain, in the simplest way possible what it takes to obtain an H1-B visa, an L1-B visa, and finally, a green card as I experienced first hand the full American immigration process from being a non-immigrant worker in 2016 to be a US permanent resident at the end of 2019. AlertAn icon representing an exclamation mark in an octogoneI did my best not to make this a comment on the current administration. What the hell are work visas? To put it simply a work visa is a temporary working permit to allow a foreign national to live and work in the US. The US government allows each year for companies to sponsor visas to get workers from abroad to come and work in the US for a certain duration. There are a lot of different types of visas, but for the purpose of this article, I'll only focus on the 2 visas I held: L1-B and H1-B. L1-B In 2016 the startup I was working for in Spain got acquired and incorporated by a US-based company. My employer offered to sponsor my visa to get me to work on US soil, and as the Spanish office was incorporated under that company's name, I could qualify for an L1-B visa. InfoAn icon representing the letter ‘i‘ in a circleThe L1 Visa is for managerial or executive professionals transferring to the US from within the same company, or a subsidiary of it. There are 2 categories possible for this visa: ArrowAn icon representing an arrowL1-A for managers or executives. ArrowAn icon representing an arrowL1-B for employees with specialized knowledge. As I wasn't a manager or an executive, I fell into the second category (hence the B in L1-B). The requirements to qualify for this visa were the following: ArrowAn icon representing an arrowI had to be an employee of the company or subsidiary for at least a year ArrowAn icon representing an arrowI needed to have specialized knowledge which meant I had to prove that the work I was doing for the US company could only be done by me. As I was the maintainer of some key services of the software that the company was selling, that played in my favor. I had to write an entire essay with proof of my contributions to these key services and why I was essential to the business. That wasn't easy because pretty much anything too vague could fall in the category of "we can find some US worker to do this". After filing my application with immigration lawyers, I had to wait about 6 months for my visa to be "approved". Yes, the quotes are necessary here, because the United States Citizenship and Immigration Services' (USCIS) decision regarding my immigration case was not enough to guarantee that I could work in the US. I still had to: ArrowAn icon representing an arrowget an appointment at a US embassy ArrowAn icon representing an arrowget interviewed and screened ArrowAn icon representing an arrowgive my passport so they could apply and stamp the visa The interview in itself was not that intense but I remember being terrified to make a tiny mistake and get my visa denied. I kept my answers short, focused (mainly yes's and no's), properly state my employer's name, my degree. I also had to bring several required documents: diplomas, copy of and original passport, transcripts from college (yes they checked those), etc. Long story short, after a few weeks I got approved, which gave me the following rights as a US non-immigrant worker: ArrowAn icon representing an arrowLive and work in the US up to 5 years ArrowAn icon representing an arrowPay taxes in the US (just to make it clear to anyone spreading false rumors that immigrants/non-immigrants do not contribute to the US, don't you worry we pay the same taxes as American citizens do) ArrowAn icon representing an arrowThat's it. On the other hand, I was unable to: ArrowAn icon representing an arrowChange jobs ArrowAn icon representing an arrowStart my own business ArrowAn icon representing an arrowQualifying for social benefits ArrowAn icon representing an arrowEnter the US territory easily (everyone who experienced the immigration queue at SFO after a 12+ hours flight can tell you, it's pretty annoying) ArrowAn icon representing an arrowChange job duties: they had to remain the same to keep my visa valid. For instance, I could not switch from Software Engineering to Product Management. For that, I'd need to reapply for a visa ArrowAn icon representing an arrowVote or participate in politics But, hey, I was the happiest I've ever been, I got the opportunity to work in San Francisco, that's something I couldn't have imagined happening to me. H1-B After a few months of working in the US office of my company, the HR department contacted me and asked me if I was willing to apply for an H1-B visa. I immediately said yes because the H1-B visa offers quite a few "upgrades" compared to what I had on an L1-B visa. Let's take a look at the updated list: ArrowAn icon representing an arrowLive and work in the US up to 6 years: First 3 years, then I would have to apply again for a second H1-B. ArrowAn icon representing an arrowPay taxes in the US (yup, still doing it) ArrowAn icon representing an arrowChange jobs In my situation at that time, the H1-B meant that I'd have better job security: I could go work for another company if I wanted to or was laid off. However despite this new perk I still had to follow the following rules to keep my visa: ArrowAn icon representing an arrowThe position and job duties at the new company had to stay the same ArrowAn icon representing an arrowIf I were to be unemployed I could only stay so up to 60 days to maintain my status. Failure to do so, I'd lose my visa and have to go back home. Anecdote: At the beginning, I'd train for coding interviews once a month to be ready to interview in no time in case I'd get laid off. 60 days can be a pretty short amount of time to land a new job. ArrowAn icon representing an arrowMy new employer and I would have to go through a tedious process and lots of paperwork (see the info card "Changing Jobs on an H1-B" for more details) Applying for an H1-B visa, though, is a whole other story. Every year up to 65000 H1-B visas can be issued. As you can imagine, more than 65000 applicants are registering their case to get a visa, so the USCIS conducts a random selection, also called "lottery", to select the 65000 people that might get a chance to get a visa. What happens if you're not selected? Try again the following year. And if you fail again? Try again. InfoAn icon representing the letter ‘i‘ in a circleChanging Jobs on an H1BWhile it is possible, it is not as smooth as one might think. Here's a checklist of some of the key paperwork that the new employer needs to submit to the USCIS: Submit an employment letter detailing the position, duties, start date, and other relevant information on the job ArrowAn icon representing an arrowFile a Labor Condition Application (LCA) and wait until it is certified ArrowAn icon representing an arrowGive notice to the collective bargaining representative for their employees ArrowAn icon representing an arrowFile the visa petition and submit the relevant documents ArrowAn icon representing an arrowPay any necessary filing fees Source AlertAn icon representing an exclamation mark in an octogoneAs you can see from what is stated above: telling that the immigration system is bringing "cheap labor" to the country or "stealing the work of the citizens", well ... that's not really true. The LCA has been made to prevent that. If companies try to bring cheap labor by under-paying their non-immigrant employees, they are technically breaking the law. I was extremely lucky: I got through the lottery! Now I needed to contact my immigration lawyers to finish my petition, and I ended up getting my H1-B visa approved in August of 2017. Starting October 1st of that year my H1-B could become current, I wanted to go home for Christmas, thus needed a new stamp on my visa and had to do the whole embassy interview again. I remember being very anxious not getting my passport back in time before my return flight from France to SF, luckily it only took 4 days for the embassy to send my passport to my parent's address with my shiny new visa on it. InfoAn icon representing the letter ‘i‘ in a circleHere are some takeways for this first part: ArrowAn icon representing an arrowgetting a visa to work in the US is pretty hard, requires a lot of time, the help of immigration lawyers sometimes, and also money: companies sponsoring visas pay a lot of application fees ArrowAn icon representing an arrowthe H1-B visa is pretty restrictive when it comes to wages and position. Don't fall directly into the conservative narrative claiming that all non-immigrant workers are "stealing jobs", it is 1000x easier for a US company to hire a US worker, and if they look elsewhere on top of that it's probably because they have to remain competitive in their respective markets. From non-immigrant to permanent resident We've seen recently through the many bans and executive orders related to immigration that, despite being hard to get, these visas do not guarantee that you can stay through the entire duration. Even pre-COVID, I couldn't feel "safe" in this country without obtaining the status of permanent resident i.e. a green card. The process to get it though is long is tedious. I'm a French national, born in France (very important, it's the country of birth that matters when applying for a green card), white, male, i.e. the most privileged possible person for this process. Despite that, it still took from October 2017 until November 2019 to get my permanent resident card in hand. To put that in perspective, right now, as I'm writing these words, it can take up to 50 years for an Indian national to get the same piece of paper I got. I started the employment-based green card process also called EB in late 2017. Up to 140000 EB green cards can be granted every year. The whole process consisted of 3 steps that will be more or less detailed below. InfoAn icon representing the letter ‘i‘ in a circleI only kept the most important steps to keep it as short as possible The PERM ArrowAn icon representing an arrowFile up the "worksheet": detail all the work duties yet another time, the salary, the current position held by the applicant, proof of current and past employment, letters from all my previous manager,... ArrowAn icon representing an arrowDrafting a job notice, and advertising for the job position of the applicant: the company sponsoring must advertise for the position of the applicant in the newspaper, on its website, and its office for at least 10 business days for US workers to apply. If no one applies and qualifies for the position within 30 days the process may continue. ArrowAn icon representing an arrowPrevailing Wage Request: the salary and the job description have to be submitted to the Department Of Labor (DOL) to ensure that the applicant is paid accordingly. This step takes about 6 weeks. ArrowAn icon representing an arrowFilling the Program Electronic Review Management (PERM): the system used for obtaining Labor Certification and is the first step for certain foreign nationals in obtaining an employment-based immigrant visa. This step takes 4 to 6 months. When I reached step 4 we were already in December 2018. The PERM took about 3 months to get approved on my end, which let me continue the process in March 2019. As you can see, despite taking longer to get approved, this entire step is pretty similar to the one done when applying for my H1-B. It ensures that US workers are still prioritized when it comes to employment. AlertAn icon representing an exclamation mark in an octogoneIt is important to specify that, during that whole process, changing employer is almost impossible. Getting laid off or getting a new job or job duties mostly means that I'd have to restart the whole process from zero 😱. This was most likely the most stressful part for me and caused many sleepless nights. The i-140 and i-485 The next 2 steps are run concurrently and can be the longest depending on the applicant's country of birth. InfoAn icon representing the letter ‘i‘ in a circleThere are 5 main categories for green cards, which you can land in based on your country of birth: ArrowAn icon representing an arrowIndia ArrowAn icon representing an arrowChina ArrowAn icon representing an arrowMexico ArrowAn icon representing an arrowPhilippines ArrowAn icon representing an arrowRest Of World (ROW) I fell in the ROW category as I'm born in France. ArrowAn icon representing an arrowFile the i-140 form, also called Immigrant Petition for Alien Worker. It allows a foreign national to work in the US permanently. This form had a lot of overlap with the PERM, but this time had to be sent to USCIS instead of DOL. I chose to submit it for Premium Processing, as it brings down the time it takes to get it approved from 6 to 8 months to only a week. It cost me about $1440 to do so. ArrowAn icon representing an arrowPass a medical exam. I had to go to an immigration doctor to get a checkup, give an up to date list of all the vaccines I've ever had (it was a pain because my vaccination record was written in French), and get some extra vaccines. This was not covered by my health insurance: $1200. ArrowAn icon representing an arrowThe biometrics appointment. After receiving my i-140 approval in May of 2019, I got my biometrics registered again: photo + fingerprints. ArrowAn icon representing an arrowFile the i-485 form, also called Application to Register Permanent Residence. This is the main form that once approved would grant me the status of permanent resident of the US. The processing time for this one ... no one knows. It can be counted in months, or years. The processing time depends on your country of birth, which field office is going to process your case. At this point, the only thing I could do was wait. I submitted my case end of May 2019. Just about 2 months later I got "scheduled for an interview" which was perhaps the luckiest thing that could have happened to me, instead of waiting almost a year, it took only a few weeks to reach this step. I was scheduled for the interview on the 26th of August. I had to go to a USCIS office to answer a series of questions to a USCIS officer and verify if my paperwork was still '''
year_published = 2020
year_updated = 2020
clearnet = "https://blog.maximeheckel.com/posts/immigrating-to-the-us-my-path"
