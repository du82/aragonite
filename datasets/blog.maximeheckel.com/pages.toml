["https://blog.maximeheckel.com/posts/building-perfect-github-action-frontend-teams"]
title = "Building the perfect GitHub CI workflow for your frontend team - Maxime Heckel's Blog"
description = "A guide with some of the best Github CI tips I could find to the power best CI pipeline for your frontend team's needs."
full_description = '''HomeBuilding the perfect GitHub CI workflow for your frontend teamAugust 3, 2021 / 15 min readLast Updated: August 3, 2021You've probably noticed if you've been following me for a while that I'm a ✨ big fan ✨ of automation. I wrote about automated CI/CD a year ago and also talked a lot about the concepts surrounding this subject, but never really touched upon the tools I use for my CI jobs and how I use them. One such tool that has really worked for me, especially as a frontend engineer, is GitHub CI. For over a year now, it's been my service of choice for automated CI/CD pipelines. The workflow syntax is easy to get started with, and has an extended set of features to help you craft your CI experience the way you and your team may want it. However, even after a year, there still is a lot that I'm learning about this tool every day. When I got started with it, there was no set rule on how to properly architect your workflows, and there's a lot of tips, tricks I discovered along the way to build what I would qualify as "the perfect GitHub CI workflow" (at least to my eyes 😄). This article aims to gather those tips and good practices I've been using for personal projects and at work and show you how you can use all of those in a single workflow to power the CI/CD pipeline of your frontend team. What would constitute a "good" GitHub CI workflow? I'm going to throw my best "engineer response" at this question: it depends! Your team might have specific needs or objectives that would make some of my tips not as useful to you as they could be. However, for this article, we need some guidelines that I think would be universal when it comes to building efficient GitHub workflows, such as: ArrowAn icon representing an arrowcost-saving: bring the "build minutes" down to the lowest possible value to not have a massive bill at the end of the month. ArrowAn icon representing an arrowefficient: your team's time is precious, the workflow should be as fast as possible, but also fast to fail if something were to go wrong ArrowAn icon representing an arrowwell-architected: each step has a purpose, and might depend on other steps. This also means not running "useless steps". InfoAn icon representing the letter ‘i‘ in a circleWhen I started building my first GitHub workflows, I failed to meet those self-established guidelines. My workflows were inefficient wasted a lot of human time, compute time, and money. Some of the most critical mistakes I made were: ArrowAn icon representing an arrowRunning jobs in separate workflows, thus having no control over how they should run, and no ability to make them depend on other workflows' state. ArrowAn icon representing an arrowRunning expensive tasks multiple times. If two jobs needed the build output of my app, I'd build it twice 🤦‍♂️. Now that we've established those guidelines, let's take a look at one of the most important tips of this article. One workflow to rule them all Let's consider a typical set of tasks a frontend team would run on every PR: ArrowAn icon representing an arrowLint ArrowAn icon representing an arrowFormatting ArrowAn icon representing an arrowType checking ArrowAn icon representing an arrowUnit test ArrowAn icon representing an arrowBuild ArrowAn icon representing an arrowEnd-to-end tests, maybe on different browsers Running those in separate workflows might look like the most straightforward way to architect those tasks. However, if something as simple as the lint task fails, there's no way you can stop your expensive tasks like build or your end-to-end tests from running. And that, my friends, is not very efficient. Workflows run in parallel, and there's no way for them to interact with one another. Thus, you can't cancel a workflow due to another workflow's failed state. You're stuck running all the workflows in every PR. To address this, I chose to combine all my workflows into one. All the tasks that were independent workflows before became part of the same unique workflow, but this time, as jobs. InfoAn icon representing the letter ‘i‘ in a circleA workflow is made up of one or many jobs. By default, jobs are run in parallel, but can be run in sequence by using the proper set of options (more on that later). A job let's you define a "task" through a series of steps.You can find more about GitHub CI jobs on the dedicated section about jobs in the documentation. Excerpt of a Github CI workflow job.1# In this example, lint-format is a job among many others in a bigger GitHub workflow.2# This job has 3 steps: Checking out the code, running the lint command, and running the formatting command.3 4jobs:5 lint-format:6 runs-on: ubuntu-latest7 strategy:8 matrix:9 node: [12]10 steps:11 - name: Checkout Commit12 uses: actions/checkout@v213 - name: Use Node.js ${{ matrix.node }}14 uses: actions/setup-node@v115 with:16 node-version: ${{ matrix.node }}17 - name: Run lint18 run: |19 yarn lint20 - name: Run prettier21 run: |22 yarn format The cool thing about jobs is that you can run them sequentially or parallel as you please! GitHub provides a handy keyword called needs that lets you set one or several jobs as dependencies, thus preventing a given job to start unless the dependent jobs have successfully run. This allows us to: ArrowAn icon representing an arrowFail the workflow fast. If a key job fails, the workflow is marked as failed on your PR as soon as possible ArrowAn icon representing an arrowAvoid running useless expensive tasks on a "doomed to fail" workflow run Example of jobs running in parallel and sequentially1# In this workflow excerpt, the type-check and unit-test jobs run in parallel whereas the2# build job "needs" these 2 jobs to be successful to be kicked off.3# Thus, if any of type-check or unit-test were to fail, the build job will not start and the4# whole workflow will be marked as "failed".5 6jobs:7 type-check:8 runs-on: ubuntu-latest9 strategy:10 matrix:11 node: [12]12 steps:13 - name: Checkout Commit14 uses: actions/checkout@v215 - name: Use Node.js ${{ matrix.node }}16 uses: actions/setup-node@v117 with:18 node-version: ${{ matrix.node }}19 - name: Check types20 run: |21 yarn type-check22 unit-test:23 runs-on: ubuntu-latest24 strategy:25 matrix:26 node: [12]27 steps:28 - name: Checkout Commit29 uses: actions/checkout@v230 - name: Use Node.js ${{ matrix.node }}31 uses: actions/setup-node@v132 with:33 node-version: ${{ matrix.node }}34 - name: Run test35 run: |36 yarn test37 build:38 runs-on: ubuntu-latest39 strategy:40 matrix:41 node: [12]42 needs: [type-check, unit-test]43 steps:44 - name: Checkout Commit45 uses: actions/checkout@v246 - name: Use Node.js ${{ matrix.node }}47 uses: actions/setup-node@v148 with:49 node-version: ${{ matrix.node }}50 - name: Run build51 run: |52 yarn build You may be wondering: what job should be run in parallel and what job needs to be run sequentially? That will depend on the needs of your team. On my end, I tend to parallelize unit testing, linting, and type-checking for example. These steps are generally fast and inexpensive to run thus I do not feel they need to depend on each other in most cases. However, I'd require a job such as build to only run if those three jobs above are successful, i.e. run it sequentially. The screenshot below features the GitHub Workflow powering the CI for this blog. Yours will probably end up sharing some similarities: Screenshot of a successful Github workflow run showcasing each jobs and their dependencies with one another. Screenshot of a failed Github workflow run. Notice how failing the 'build' job did not triggered the two parallel e2e jobs as they were dependent on this job to be successful. As you can see, by combining all our workflows into one, and carefully choosing which job to parallelize or run sequentially, we end up having better visibility on how our CI pipeline functions and the dependencies between each of its steps. Sharing is caring Now that all the CI steps are combined into one single workflow, the main challenge is to find out how we can make them as efficient as possible by sharing critical job outputs. However, it's not very obvious from the get-go how one can share job outputs with other jobs on GitHub CI. There are two ways that I found to be "efficient": ArrowAn icon representing an arrowleveraging caching with actions/cache ArrowAn icon representing an arrowuploading/downloading artifacts using respectively actions/upload-artifact and actions/download-artifact The first one is "great" but only for tasks that are repetitive and have outputs that do not change much over time like installing NPM dependencies. InfoAn icon representing the letter ‘i‘ in a circleCaching dependencies is perhaps the first optimization trick that many teams chose to tackle. GitHub already wrote extensively about that in their own documentation.However, the only thing I do differently compared to the examples featured in the documentation is caching the node_modules folder rather than the yarn/npm cache folder. This drastically speeds up the install step of my CI. Example of sharing npm dependencies through multiple GitHub CI jobs1jobs:2 # As its name stands for, this jobs will install the npm dependencies and cache them3 # unless they have been cached in a previous workflow run and remained unchanged.4 install-cache:5 runs-on: ubuntu-latest6 strategy:7 matrix:8 node-version: [12]9 steps:10 - name: Checkout Commit11 uses: actions/checkout@v212 - name: Use Node.js ${{ matrix.node }}13 uses: actions/setup-node@v114 with:15 node-version: ${{ matrix.node }}16 - name: Cache yarn dependencies17 uses: actions/cache@v218 id: cache-dependencies19 with:20 path: node_modules21 key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}22 restore-keys: |23 ${{ runner.os }}-yarn-24 - name: Install Dependencies25 # Check for `cache-hit` (`steps.cache-dependencies.cache-hit != 'true'`)26 # If there's a cache hit, we skip this step (the dependencies are already available)27 # If there's no cache hit, we run "yarn install"28 if: steps.cache-dependencies.outputs.cache-hit != 'true'29 run: |30 yarn install --force --non-interactive31 # This job requires some dependencies to be installed to run. Thus we'll restore32 # the dependencies that have been previously cached and use them here.33 type-check:34 runs-on: ubuntu-latest35 strategy:36 matrix:37 node: [12]38 needs: install-cache39 steps:40 - name: Checkout Commit41 uses: actions/checkout@v242 - name: Use Node.js ${{ matrix.node }}43 uses: actions/setup-node@v144 with:45 node-version: ${{ matrix.node }}46 # Here we use actions/cache again but this time only to restore the dependencies47 # At this stage of the workflow we're sure that the dependencies have been installed and cached48 # either on this same run, or on a previous CI run. Thus we can skip trying to run "yarn install".49 - name: Restore yarn dependencies50 uses: actions/cache@v251 id: cache-dependencies52 with:53 path: node_modules54 key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}55 restore-keys: |56 ${{ runner.os }}-yarn-57 - name: Check types58 run: |59 yarn type-check Using artifacts, however, is what made a significant difference in the efficiency of my GitHub CI workflows. For example, if you have 2 jobs that respectively run your e2e tests on firefox and chrome, you do not want to build your frontend twice as this could significantly increase the number of "billable minutes" for your CI run. The optimal solution here would consist of having a build job before your end-to-end tests running only once and then share the build artifacts with your chrome-end-to-end and firefox-end-to-end jobs. InfoAn icon representing the letter ‘i‘ in a circleThis kind of optimization can have a dramatic impact on your CI builds. At a company I worked at, doing these same improvements of sharing your build artifacts before 4 instances of parallel end-to-end test runs reduced our GitHub CI billable minutes by over 50%! To achieve this, we need to leverage actions/upload-artifact and actions/download-artifact: ArrowAn icon representing an arrowonce the build is successful, use actions/upload-artifact to upload your build artifacts ArrowAn icon representing an arrowthen use action/download-artifact on any jobs you want to pull that build output and use it It's important to note that this trick only works because we're running every single CI step in the same workflow. You can only download artifacts in a workflow that were uploaded during the same workflow run. Uploading and downloading artifacts to share the build output1# This example showcases how you can share the build output of a "build" job with two following jobs that need2# the output to run their respective tasks.3 4jobs:5 build:6 ...7 steps:8 ...9 - name: Run build10 run: |11 yarn build12 # This step in the build job will upload the build output generated by the previous step13 - name: Upload build artifacts14 uses: actions/upload-artifact@v215 with:16 # Give a unique name to your artifacts so they can be easily retrieved17 name: build-output18 # This example is based of a Next.JS build output, thus the .next path.19 # The path might need to be changed based on your build settings or the framework your team is using.20 path: .next21 e2e-tests-chrome:22 ...23 needs: build24 steps:25 ...26 # Here we restore the build output generated in the previous job by downloading the artifact we uploaded27 - name: Download build artifacts28 uses: actions/download-artifact@v229 with:30 name: build-output31 # Specify the path in which you wish to place your artiface.32 # Here I restore them in the .next folder since it's necessary to run the next start command later on33 path: .next34 - name: Run cypress35 uses: cypress-io/github-action@v2.10.136 with:37 start: next start38 browser: chrome39 e2e-tests-firefox:40 ...41 needs: build42 steps:43 ...44 # Here we restore the same build output as we did in the e2e-tests-chrome job45 - name: Download build artifacts46 uses: actions/download-artifact@v247 with:48 name: build-output49 path: .next50 - name: Run cypress51 uses: cypress-io/github-action@v2.10.152 with:53 start: next start54 browser: firefox AlertAn icon representing an exclamation mark in an octogoneBe mindful about your usage of GitHub CI artifacts! Uploading and storing artifacts is part of the monthly bill and you need to make sure to not overlook how much storage you use to avoid any surprise.👉 You'll find the GitHub CI billing tiers here with more details.Below is an example of how you can use the retention-days option to help you delete outdated artifacts as early as possible, i.e. after 1 day. Setting the retention days option when uploading artifacts1jobs:2 build:3 ...4 steps:5 ...6 - name: Run build7 run: |8 yarn build9 - name: Upload build artifacts10 uses: actions/upload-artifact@v211 with:12 name: build-output13 path: .next14 retention-days: 1 "You are terminated" My last tip, and perhaps my favorite due to its simplicity is terminati'''
