title = "Everything about Framer Motion layout animations - Maxime Heckel's Blog"
description = "A complete guide to Framer Motion layout animations showcasing every concept, from the layout prop, shared layout animations and LayoutGroup, to complex drag-to-reorder interactions."
full_description = '''HomeEverything about Framer Motion layout animationsMarch 8, 2022 / 17 min readLast Updated: August 6, 2022Framer Motion has changed a lot since I last wrote about it. So much so that I recently got a bit lost trying to build a specific layout animation and my own blog post that actually looked into this specific type of animation was far from helpful 😅. Despite the updated section I added back in November, it still felt like I was not touching upon several points on this subject and that some of them were incomplete. On top of the API changes and the many new features that the Framer team added to the package around layout animations, I noticed that there are lots of little tricks that can make your layout animations go from feeling clumsy to absolutely ✨ perfect ✨. However, these are a bit hidden or lack some practical examples to fully understand them. Thus, I felt it was time to write a dedicated deep dive into all the different types of layout animations. My objective is for this article to be the place you go to whenever you need a refresher on layout animations or get stuck. Additionally, I'll give you some of my own tips and tricks that I use to work around some of the glitches that layout animations can trigger and examples on how to combine them with other tools from the library such as AnimatePresence to achieve absolutely delightful effects in your projects! InfoAn icon representing the letter ‘i‘ in a circleLooking for an intro to Framer Motion?Don't worry I got your back! You can check out my guide to creating animations that spark joy with Framer Motion to get started. Support my workEnjoying the content and feeling like supporting my work? You can show your appreciation by buying me a coffee which will give me the much-needed energy to take on more ambitious/high-quality articles and projects.Thank you for reading! Layout animations fundamentals Before we dive into the new features and complex examples of layout animations, let's look back at the fundamentals to reacquaint ourselves with how they work. A brief refresher on layout animations In Framer Motion, you can animate a motion component between distinct layouts by setting the layout prop to true. This will result in what we call a layout animation. What do we mean by "layout"?When we're talking about animating the "layout" or a "layout property" we mean updating any of the following properties: ArrowAn icon representing an arrowPosition-related, such as CSS flex, position or grid ArrowAn icon representing an arrowSize-related, such as CSS width or height ArrowAn icon representing an arrowThe overall position of an element within a list for example. This can useful if you want to animate sorting/reordering a list. We can't animate a motion component between layouts using a combination of initial and animate props as we would do for other kinds of Framer Motion animations. For that, we need to use the layout prop. In the example below, you'll find a first showcase of a layout animation: ArrowAn icon representing an arrowYou can change the position of the motion component, the square, along the x axis. ArrowAn icon representing an arrowYou can enable or disable the layout prop for that motion component StartCenterEndUse layout animation1// position: start2 3<motion.div4 style={{5 justifySelf: position,6 }}7 //...8/>9 We can see that each time we change the layout, i.e. a rerender occurs, the layout prop allows for the component to transition smoothly from its previous layout to the newly selected one. However, without it there is no transition: the square will move abruptly. Layout animations "smooth things up", and add a certain level of physicality to some user interactions where usually things would transition abruptly. One example where they can shine is when adding/removing elements from a list. I tend to leverage layout animations a lot for use cases like this one, especially combined with other Framer Motion features such as AnimatePresence. The playground below showcases one of my own NotificationList component that leverages layout animations: ArrowAn icon representing an arroweach notification is wrapped in a motion component with the layout prop set to true. ArrowAn icon representing an arrowthe overall list is wrapped in AnimatePresence thus allowing each item in a list to have an exit animation. ArrowAn icon representing an arrowclicking on any of the notifications on the list will remove them and, thanks to layout animations, the stack will gracefully readjust itself. PreviewConsoleStackAn icon representing 3 tiles on top of each otherPlayAn icon representing the play symbol, a triangle pointing to the rightRepeatAn icon representing an arrow twisted so it makes a loopXAn icon representing an XCleanApp.jsComponents.jsimport { motion, AnimatePresence } from 'framer-motion'; import React from 'react'; import { Wrapper, Toast } from './Components'; import './scene.css'; const ITEMS = ['Welcome 👋', 'An error occurred 💥', 'You did it 🎉!', 'Success ✅', 'Warning ⚠️']; const Notifications = () => { const [notifications, setNotifications] = React.useState(ITEMS) return ( <Wrapper> <AnimatePresence> {notifications.map((item) => <motion.div key={item} onClick={() => setNotifications((prev) => prev.filter(notification => notification !== item))} layout initial={{ y: 150, x: 0, opacity: 0, }} animate={{ y: 0, x: 0, opacity: 1, }} exit={{ opacity: 0, }} > <Toast>{item}</Toast> </motion.div> )} </AnimatePresence> </Wrapper> ); } export default Notifications Customizing layout animationsYou can customize the transition of your layout animations by setting it up within a layout key in your transition object:1<motion.div2 layout3 transition={{4 layout: {5 duration: 1.5,6 },7 }}8/> Fixing distortions When performing a layout animation that affects the size of a component, some distortions may appear during the transition for some properties like borderRadius or boxShadow. These distortions will occur even if these properties are not part of the animation. Luckily, there's an easy workaround to fix those: set these properties as inline styles as showcased below: Expand cardSet distorted properties inline1// expanded: false2 3// CSS4.box {5 width: 20px;6 height: 20px;7 border-radius: 20px;8}9 10.box[data-expanded="true"] {11 width: 150px;12 height: 150px;13}14 15// JS16<motion.div17 layout18 className="box"19 data-expanded={expanded}20/>21 22 CSS variablesIf like me, you're using CSS variables in your codebase, just be warned that setting a CSS variable for the value of borderRadius or boxShadow will not fix any of the side effects showcased above. You will need to use a proper value to avoid any distortions. More about the layout prop We just saw that setting the layout prop to true gives us the ability to animate a component between layouts by transitioning any properties related to its size or position. I recently discovered that there are more values that the layout prop can take: ArrowAn icon representing an arrowlayout="position": we only smoothly transition the position-related properties. Size-related properties will transition abruptly. ArrowAn icon representing an arrowlayout="size": we only smoothly transition the size-related properties. Position-related properties will transition abruptly. InfoAn icon representing the letter ‘i‘ in a circleCharts representing the evolution of positions and sizes related properties in function of the time for all the possible values of the layout prop To illustrate this, I built the widget below that showcases how the transition of a motion component is altered based on the value of the layout prop: layout={true}layout="position"layout="size"Expand card Why would we need to use these other layout properties? What's the practical use? you may ask. Sometimes, as a result of a layout animation, the content of a component that resizes can end up "squished" or "stretched". If you see this happening when working on a layout animation, chances are that it can be fixed by simply setting the layout prop to position. Below you'll find an example of such a use case: ArrowAn icon representing an arrowRemoving items in this horizontal list will affect the size of each component. By default, you will notice the components getting slightly squished when an item is removed. ArrowAn icon representing an arrowWrapping the content in a motion component and setting layout to position by toggling the switch will fix all the distortions you may observe on the content of the motion block. Each component will resize gracefully with a more natural transition. Example of practical use case for layout="position"XAn icon representing an XLabel 1XAn icon representing an XLabel 2XAn icon representing an XLabel 3Use layout="position"RepeatAn icon representing an arrow twisted so it makes a loop1<motion.div layout>2 <Label variant="success">3 <div4 style={{ 5 width: '100%',6 display: 'flex',7 justifyContent: 'start',8 }}9 >10 <DismissButton/>11 <span>{text}</span>12 </div>13 </Label>14</motion.div> Shared layout animations and LayoutGroup These two concepts are perhaps what I struggled the most with recently as: ArrowAn icon representing an arrowthey appear to be closely related based on their names but have very distinct purposes and use cases ArrowAn icon representing an arrowthere has been a lot of API changes in this area. Thus, everything I thought I had mastered was actually brand new and a bit different 😅 And I know I'm not the only one, I've seen many people confusing shared layout animations and LayoutGroup InfoAn icon representing the letter ‘i‘ in a circleThe confusion is understanding. There used to be a feature called AnimatedSharedLayout that was necessary to achieve shared layout animations that was deprecated around the same time as LayoutGroup was introduced.I first thought LayoutGroup was meant to replace AnimatedSharedLayout, but we're going to see in this part that this not really the case. Shared layout animations One might think that this is yet another type of layout animation like we saw in the previous part, but with a twist. It's not wrong, but also not quite exact either. Shared layout animations have their own API, not directly related to the layout prop. Instead of animating a component's position and size, we are animating a component between all its instances that have a common layoutId prop. To illustrate this concept let's look at the playground below: PreviewConsoleStackAn icon representing 3 tiles on top of each otherPlayAn icon representing the play symbol, a triangle pointing to the rightRepeatAn icon representing an arrow twisted so it makes a loopXAn icon representing an XCleanApp.jsComponents.jsimport { motion } from 'framer-motion'; import React from 'react'; import { List, Item, ArrowIcon } from './Components'; import './scene.css'; const ITEMS = [1, 2, 3]; const SelectableList = () => { const [selected, setSelected] = React.useState(1); return ( <List> {ITEMS.map(item => ( <Item onClick={() => setSelected(item)} onKeyDown={(event: { key: string }) => event.key === 'Enter' ? setSelected(item) : null} tabIndex={0} > <div>Item {item}</div> {item === selected ? <motion.div layoutId="arrow"> <ArrowIcon style={{ height: '24px', color: '#5686F5', transform: 'rotate(-90deg)', }} /> </motion.div> : null } </Item> ))} </List> ) } export default SelectableList We can see in this example that: ArrowAn icon representing an arrowWe're transitioning between multiple instances of the Arrow component ArrowAn icon representing an arrowThey all share a common layoutId which tells Framer Motion that these components are related and need to transition from one instance to the newly "active" one when the user clicks on a new item. The shared aspect comes from the effect of the component moving from one position to another as if it was the same. And that's what I love about shared layout animations. It's all smoke and mirrors. Like a magic trick 🪄! The "magic" behind it is actually quite simple: ArrowAn icon representing an arrowIn our example above, when clicking on a new element, the Arrow component that was displayed on the screen fades away to reveal a new instance of the Arrow component ArrowAn icon representing an arrowThat new Arrow component is the one that will be eventually positioned under our newly selected element on the list ArrowAn icon representing an arrowThat component then transitions to its final position To show you this effect, I reused the demo above and gave a different color to each instance of Arrow so you can better visualize what's happening: Little shared layout animation debuggerItem 1ArrowAn icon representing an arrowItem 2Item 3Transition duration: 0.3 seconds One component I like to decorate with shared layout animations is Tabs. We can leverage this type of animation to add proper transitions for the "selected indicator" but also to a "hover highlight" like Vercel does on their own Tabs component! Below is an example implementation of such component with these two layout animations: ArrowAn icon representing an arrowWe can see the "selected indicator" transitioning from one tab to another when a new one is selected ArrowAn icon representing an arrowThe "hover highlight" will follow the user's mouse when hovering over the Tabs component ArrowAn icon representing an arrowEach shared layout animation has a distinct layoutId prop: underline and highlight PreviewConsoleStackAn icon representing 3 tiles on top of each otherPlayAn icon representing the play symbol, a triangle pointing to the rightRepeatAn icon representing an arrow twisted so it makes a loopXAn icon representing an XCleanApp.jsComponents.jsimport { motion } from 'framer-motion'; import React from 'react'; import { Wrapper, Tab } from './Components'; import './scene.css'; const Tabs = () => { const [focused, setFocused] = React.useState(null); const [selected, setSelected] = React.useState('Item 1'); const tabs = ['Item 1', 'Item 2', 'Item 3']; return ( <Wrapper onMouseLeave={() => setFocused(null)}> {tabs.map((item) => ( <Tab key={item} onClick={() => setSelected(item)} onKeyDown={(event: { key: string }) => event.key === 'Enter' ? setSelected(item) : null } onFocus={() => setFocused(item)} onMouseEnter={() => setFocused(item)} tabIndex={0} > <span>{item}</span> {focused === item ? ( <motion.div transition={{ layout: { duration: 0.2, ease: 'easeOut', }, }} style={{ position: 'absolute', bottom: '-2px', left: '-10px', right: 0, width: '140%', height: '110%', background: '#23272F', borderRadius: '8px', zIndex: 0, }} layoutId="highlight" /> ) : null} {selected === item ? ( <motion.div style={{ position: 'absolute', bottom: '-10px', left: '0px', right: 0, height: '4px', background: '#5686F5', borderRadius: '8px', zIndex: 0, }} layoutId="underline" /> ) : null} </Tab> ))} </Wrapper> ); } export default Tabs; There's however one little problem. What if we wanted to build a reusable component that has a shared layout animation de'''
