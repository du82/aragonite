title = "The Art of Dithering and Retro Shading for the Web - Maxime Heckel's Blog"
description = "A detailed walkthrough of the inner workings of dithering and other shading techniques to give a retro look and feel to your WebGL and React Three Fiber work."
full_description = '''HomeThe Art of Dithering and Retro Shading for the WebAugust 6, 2024 / 30 min readLast Updated: August 10, 2024I spent the past few months building my personal website from the ground up, finally taking the time to incorporate some 3D work to showcase my shader and WebGL skills. Throughout this work, I got to truly understand the crucial role that post-processing plays in making a scene actually look good, which brought some resolutions to long-term frustrations I had with my past React Three Fiber and shader projects where my vision wouldn't materialize regardless of the amount of work and care I was putting into them. Taking the time to build, combine, and experiment with custom post-processing effects gave me an additional creative outlet, and among the many types I got to iterate on, I always had a particular affection for the several "retro" effects I came up with. With subtle details such as dithering, color quantization, or pixelization/CRT RGB cells, they bring a pleasant contrast between the modern web landscape and a long-gone era of technology we 90s/early 2000s kids are sometime longing for. Given the time I invested dissecting every aspect of these effects, I wanted to dive deep with you into the concepts powering them and the shader techniques I learned along the way. In this article, I hope to convince you of the power of post-processing effects and that nothing beats an elegant retro vibe applied to a website 👌✨. We'll also look into examples of dithering and pixel art from very talented folks who use the same processes that I'll be introducing later on, as well as some of my own creations that I built while learning about all this. Sources ArrowAn icon representing an arrowColor Quantization and Dithering a great video from @Acerola_t ArrowAn icon representing an arrowDithering on the GPU from Alex Charlton which features a nice deep dive into alternative color quantization techniques ArrowAn icon representing an arrowGM Shaders Mini: CRT from @XorDev which deep dives into many shader techniques to mimic some specific aspects of CRTs Support my workEnjoying the content and feeling like supporting my work? You can show your appreciation by buying me a coffee which will give me the much-needed energy to take on more ambitious/high-quality articles and projects.Thank you for reading! Dithering techniques Dithering originated as an early graphics technique to trick the viewer's brain into seeing more color or smoothness in gradients/shadows that the machines back in the day could output by intentionally introducing noise on top of an image or a render. Color palettes were very limited back then, thus relying on techniques like these was vital for game designers to realize their vision. This gave, as a result, a unique look and feel to games and media from that specific moment in time where computers became ubiquitous, but advanced graphic capabilities were not yet there. Today, dithering is more an artistic choice than a workaround. Many artists or game designers use this technique as a creative outlet to give their work a unique retro vibe, calling out to that early gaming era, or work within the realms of self-imposed limits in colors. Some great examples of such use of dithering include: ArrowAn icon representing an arrowBasement Studio's Basement Chronicle game: a well-executed point-and-click game that reminds me a lot of my own early gaming experience. ArrowAn icon representing an arrow@loackme's art, which I'm an absolute fan of. ArrowAn icon representing an arrow@aweusmeuh's use of the original Game Boy camera for experimental photography which features a sublime dithering effect. Examples of beautifully executed dithering art from left to right by Basement Studio, @aweusmeuh, and @loackme_ The latter is how we will approach dithering in this blog post: to give our React Three Fiber/Three.js projects a unique style! In this first part, we'll explore how the dithering technique works, implement it as a shader, and build a first iteration of a custom dithering post-processing effect that we can apply on top of any 3D scene. A first pass at dithering in React Three Fiber For this project, we'll create a custom post-processing effect. As we did for the Moebius stylized shader, relying on post-processing will allow us to apply a shader to an already rendered scene and alter its style like adding an "image filter" to a photo. Pass VS EffectPost-processing passes and effects are tools to reach the same goal: alter the final render of the scene by applying a custom layer of post-processing. However, they work very differently: ArrowAn icon representing an arrowPasses can be stacked on top of one another and will take as input the output of the previous pass alter it and send the result to the following pass, applying custom shaders one at a time. ArrowAn icon representing an arrowEffects, however, get merged into a single Effect Pass which can improve performances. See Effect Merging for more information To create a custom effect, we will: ArrowAn icon representing an arrowDeclare a class that extends from Effect ArrowAn icon representing an arrowDefine our fragment shader and call it from the parent constructor using the super keyword. ArrowAn icon representing an arrowDefine the set of uniforms we will need for our effect. ArrowAn icon representing an arrowCall the wrapEffect function from @react-three/post-processing with our effect class as an argument. This will allow us to use our effect as a JSX component within EffectComposer. Sample custom shader post-processing effect used in an R3F scene1import { OrbitControls, OrthographicCamera, useFBO } from '@react-three/drei';2import { Canvas } from '@react-three/fiber';3import { wrapEffect, EffectComposer } from '@react-three/postprocessing';4import { Effect } from 'postprocessing';5import { Suspense, useRef, useState } from 'react';6import { v4 as uuidv4 } from 'uuid';7 8import fragmentShader from './fragmentShader.glsl';9 10class RetroEffectImpl extends Effect {11 constructor() {12 super('RetroEffect', fragmentShader, {13 uniforms: new Map([]),14 });15 }16}17 18const RetroEffect = wrapEffect(RetroEffectImpl);19 20const Retro = () => {21 const mesh = useRef();22 23 return (24 <>25 <mesh receiveShadow castShadow>26 <torusKnotGeometry args={[1, 0.25, 128, 100]} />27 <meshStandardMaterial color="cyan" />28 </mesh>29 <EffectComposer>30 <RetroEffect />31 </EffectComposer>32 </>33 );34}; As a first step to building our effect, we'll start with a simple luminance-based white noise dithering. The idea behind this is to: ArrowAn icon representing an arrowLook at the luminance of each pixel. ArrowAn icon representing an arrowCompare it to a random number (hence the "white noise" in the name). ArrowAn icon representing an arrowOutput a white or black pixel based on whether the luminance falls above or below said random number. White noise dithering implemented in a fragment shader of a custom effect1float random(vec2 c) {2 return fract(sin(dot(c.xy, vec2(12.9898, 78.233))) * 43758.5453);3}4 5vec3 whiteNoiseDither(vec2 uv, float lum) {6 vec3 color = vec3(0.0);7 8 if (lum < random(uv)) {9 color = vec3(0.0);10 } else {11 color = vec3(1.0);12 }13 14 return color;15}16 17void mainImage(const in vec4 inputColor, const in vec2 uv, out vec4 outputColor) {18 vec4 color = texture2D(inputBuffer, uv);19 20 float lum = dot(vec3(0.2126, 0.7152, 0.0722), color.rgb);21 color.rgb = whiteNoiseDither(uv, lum);22 23 outputColor = color;24} You can observe the effect that this code would yield on the widget below which re-implements a similar process: Enable Dithering InfoAn icon representing the letter ‘i‘ in a circleYou will notice throughout this article that the syntax for the fragment shader of our effect differs from what you may be used to when working with passes or materials.Here, you'll find no main but instead a mainImage function which contains the inputColor and uv coordinates the current pixel. No need to set the gl_FragColor value at the end, that is taken care of by the outputColor variable that you simply need to set for your effect to be applied on top of your scene.On top of that, effects come with a series of preset variables that can come very handy such as: ArrowAn icon representing an arrowinputBuffer: a texture of the underlying scene ArrowAn icon representing an arrowtime: the current time ArrowAn icon representing an arrowresolution: the width/height of your window You can find more information about it in the Custom Effect documentation of pmndrs/postprocessing. Doing this will result in a grayscale version of our scene where any pixel not purely black or white will be dithered tricking our brains into seeing more shades of gray. The demo below shows the effect applied on top of a simple React Three Fiber scene: Ordered Dithering and Bayer Matrix The effect we just built works, but it relies on white noise for its dithering threshold, leading to a messy result. We can bring order to all this (🥁) using a technique commonly known as ordered dithering due to the ordered pattern it yields when applied. This technique relies on a threshold map defined via a Bayer Matrix that contains values used to determine whether we should adjust the color of a given pixel to black or white. Bayer MatrixThe generic formula of the Bayer Matrix isM(2n) = 1/(2n)^2 * [[(2n)^2 * M(n), (2n)^2 * M(n) + 2],[(2n)^2 * M(n) + 3, (2n)^2 * M(n) + 1]]However, in many examples I found online, developers tended to define those matrixes pre-computed. We will do the same in all the examples introduced in this article by using the following definitions: ArrowAn icon representing an arrow2 x 2: 1/4 * [[0.0, 2.0,], [3.0, 1.0]] ArrowAn icon representing an arrow4 x 4: 1/16 * [[0.0, 8.0, 2.0, 10.0], [12.0, 4.0, 14.0, 6.0], [3.0, 11.0, 1.0, 9.0], [15.0, 7.0, 13.0, 5.0]] Diagram showcasing the process of applying the 4x4 Bayer Matrix on the input buffer of a scene and obtaining the dithering pattern based on the threshold value matching each pixel To demonstrate how this dithering type works, I built the widget below where you can see how this matrix changes the output of a grid of pixels once applied on top of it: Enable DitheringBayer Matrix size2x24x48x8 As you can see through the examples I showcased above, we get some pretty distinct dithering patterns based on ArrowAn icon representing an arrowthe shades of gray used in the underlying pixel grid ArrowAn icon representing an arrowthe size of the Bayer Matrix used to get the threshold value ArrowAn icon representing an arrowArrowAn icon representing an arrowOrdered dithering applied on a simple grayscale gradient To implement this in GLSL, we need to get the luminance of each pixel and compare its value with the corresponding threshold value for that same pixel obtained from the Bayer Matrix: ArrowAn icon representing an arrowif the difference between those values is positive, the pixel is white ArrowAn icon representing an arrowotherwise, it is black Ordered dithering using a 4x4 Bayer Matrix1const mat4x4 bayerMatrix4x4 = mat4x4(2 0.0, 8.0, 2.0, 10.0,3 12.0, 4.0, 14.0, 6.0,4 3.0, 11.0, 1.0, 9.0,5 15.0, 7.0, 13.0, 5.06) / 16.0;7 8vec3 orderedDither(vec2 uv, float lum) {9 vec3 color = vec3(0.0);10 11 float threshold = 0.0;12 13 int x = int(uv.x * resolution.x) % 4;14 int y = int(uv.y * resolution.y) % 4;15 threshold = bayerMatrix4x4[y][x];16 17 if (lum < threshold + bias) {18 color = vec3(0.0);19 } else {20 color = vec3(1.0);21 }22 23 return color;24} Modifying the effect code we implemented in the previous part with the code we just introduced will give us an ordered dithering effect for our underlying scene: InfoAn icon representing the letter ‘i‘ in a circleNotice how: ArrowAn icon representing an arrowChanging the size of the Bayer matrix used to obtain the threshold value of a given pixel influences the effect's output. ArrowAn icon representing an arrowA larger Bayer matrix gives us a more refined dithering effect. Blue noise dithering We got ourselves a satisfying ordered dithering effect! While this is the most popular dithering technique, as well as the main one we'll leverage in this article, I still wanted to touch upon an additonal way to dither that you perhaps remember seeing in my article on Volumetric Raymarching: blue noise dithering. I used this technique in my raymarched cloud scenes to "erase the banding or layering effect due to a less granular [raymarching] loop" which funny enough is the same use case we need dithering for in our Retro post-processing effect. Unlike the previous techniques, this one relies on a texture that we'll pass to the shader of our custom post-processing effect via a uniform and then sample it as follows: 1vec4 noise = texture2D(uNoise, gl_FragCoord.xy / 128.0);2float threshold = noise.r; where 128.0 is the width/height of said texture. We also define the threshold as the red color channel of the resulting noise color we obtain from the sampling, given that we're using a grayscale texture, it doesn't matter much which value you pick. Don't forget to set your texture wrapping properties after loading the blue noise texture so it wraps both horizontally and vertically:1const texture = useTexture('/path/to/my/texture');2 3texture.wrapS = THREE.RepeatWrapping;4texture.wrapT = THREE.RepeatWrapping; Below is the resulting output when we use a blue noise texture to obtain our dithering threshold value: As you can see, it feels less repetitive and structured than ordered dithering while also not being as random as white noise dithering; a nice middle ground. InfoAn icon representing the letter ‘i‘ in a circleThere are many other dithering techniques that I wanted to explore and detail in this article. Unfortunately some of the most interesting ones like error diffusion or Floyd–Steinberg dithering are not fragment shader friendly due to their sequential nature. Color Quantization So far, all our dithering examples also converted the underlying scene to black and white, thus making us lose a lot of information and color. That is because: ArrowAn icon representing an arrowWe calculated our dithering threshold based on the pixel luminance, thus relying on a grayscale version of our scene. ArrowAn icon representing an arrowWe manually returned a black or white pixel based on the threshold value relative to the luminance. That technique is commonly referred to as luminance-based dithering and the color conversion used here compresses the color palette to 2-bit: each pixel of the resulting scene with our post-processing effect applied is either black or white, and any shade in-between appears to us through dithering. This color compression is known as color quantization, and it supports more than just black and white pixels as we'll see in this section. Shades of gray and colors Manually setting the colors of our dithering pattern can quickly get out of hand, especially with large color palettes. Instead, to g'''
