title = "My first failed SwiftUI project - Maxime Heckel's Blog"
description = "A reflection on my experience building my first SwiftUI app, what I learned, the challenges I faced, and the reasons that made me not release it."
full_description = '''HomeMy first failed SwiftUI projectJanuary 19, 2021 / 19 min readLast Updated: January 25, 2021What a better way to start 2021 than reflecting on one of my main goals for 2020: learning SwiftUI and building my first app. While I was, and still am, just a beginner in the iOS development world, I felt that the best way to learn would be to build an app from scratch. I had this idea of a simple yet beautiful weather app, which seemed pretty straightforward to build. However, a lot of things didn't go as planned 😅. Whether it was lack of planning, too high expectations, or just the developer experience itself, the closer I was getting to finishing this project, the less confident I became about my app being worth releasing on the App Store. So we can call this project a failure if you want, but I'm nonetheless still pretty proud of what I ended up building! Thus I felt a lookback at this whole experience would be an interesting topic for a blog post. Let's take a look at my first SwiftUI app, what I built, some of the challenges I faced that made me learn a lot, and why I failed to finalize this project. InfoAn icon representing the letter ‘i‘ in a circleI also wrote a take on how I felt about SwiftUI as a frontend developer, and how easy it is for anyone with React experience to get started with it!If you're interested, you can read Going native: SwiftUI from the perspective of a React developer. Sunshine's App Icon Introducing Sunshine I built Sunshine, my weather app, during the Summer and Fall of 2020. If you're following me on Twitter, you might have seen quite a few screenshots, video recordings showcasing how the app evolved throughout its development. For those who did not get the chance to see them, here is a little screen recording for you, showcasing what I built: My goal was to build a simple and beautiful weather app, with "home-made" assets that would animate on the screen based on the weather at a given location. What makes it unique compared to other apps was the asset I built (sun, clouds, rain), the focus on the UX, and the little animations sprinkled across the interface. Although challenging, I tried to stand by these principles from the prototyping phase and throughout the development of this app. The app has three main screens, each of them having a simple role yet featuring little details for a polished look: Main Screen The main screen features the name of the location, the date, and one of the most complex SwiftUI View I built for this app: the Weather Card. Screenshot of Sunshine showcasing the main screen with the weather card. The weather card displays the weather at a given location, here Tokyo and Perth, with the temperature conditions and metrics such as wind speed or humidity, as well as a graph displaying the position of the sun. This card is central to the UX. It displays all the information about the current weather conditions at a glance such as: ArrowAn icon representing an arrowTemperature ArrowAn icon representing an arrowWeather description ArrowAn icon representing an arrowOther metrics: wind speed, humidity, etc. ArrowAn icon representing an arrowThe sun's position throughout the day ArrowAn icon representing an arrowSunrise and sunset time ArrowAn icon representing an arrowAn animated representation of the weather: the sun rising, clouds sliding from the sides of the card, etc The color of the card also adapts based on both the weather conditions and the time of the day. You will get a blue gradient at midday and a more orange pastel gradient at dawn, a more grayish color when the weather is cloudy, etc. Forecast Panel Sliding the bottom panel up reveals the Forecast Panel. I felt it was a good idea to hide the complexity of this panel away from the main screen while still keeping the user "in context" within the main screen when it's displayed. Screenshot of Sunshine's forecast panel. It showcases the 2 section: the first one displays the weather forecast at the given location for the next 6 hours, the second one for the next 7 days. On this screen you can see both: ArrowAn icon representing an arrowThe hourly forecast for the next 6 hours ArrowAn icon representing an arrowThe daily forecast for the next 7 days Each card will display the temperature, and the weather conditions are reflected through the combination of an icon and a background gradient, just like the weather card on the main screen. Settings Panel Tapping the menu icon on the top left corner brings the Settings Panel. This is where you can manage some settings and also the list of locations. Screenshot of Sunshine's settings panel. It showcases the 2 main section: the first one displays the list of locations the user has added the second one is the settings tab that lets the user choose between different units to display the temperature and the wind speed. While the Sunshine feels somewhat simple from what we've just seen, it presented its own set of challenges and setbacks during the development... which was great! 🎉 These challenges allowed me to learn so much more than I would have had by solely focusing on mini-projects around a specific aspect of SwiftUI, so if you ask me now, all that frustration was worth it! Challenges, setbacks, and what I learned along the way Building a whole SwiftUI app from scratch can feel a bit overwhelming. I mostly proceeded as I'd usually do on any complex project: one feature at a time, baby steps, breaking down any problem into smaller achievable tasks. There were, however, a few problems that showed up along the development of particularly challenging features. Here's the list of interesting ones I handpicked: TabView with PageTabViewStyle I used the following code snippet to implement a simple TabView with pages that could be swiped left/right: Initial implementation of TabView with PageTabViewStyle used in Sunshine1import SwiftUI2 3struct MainView: View {4 var city: String5 6 var body: some View {7 VStack {8 Text("\(city)")9 }.onAppear {10 print("Appear!")11 print("Call API to fetch weather data")12 fetchWeatherData(city)13 }14 }15}16 17struct ContentView: View {18 @State private var selected = 019 var body: some View {20 VStack {21 TabView(selection: $selected) {22 MainView(city: "New York").tag(0)23 MainView(city: "San Francisco").tag(1)24 }25 .tabViewStyle(PageTabViewStyle())26 }27 }28} In my case, I wanted this TabView component to do the following: ArrowAn icon representing an arroweach "page" would show the weather at a given location ArrowAn icon representing an arrowswiping to another page would show the weather to the previous/following location ArrowAn icon representing an arrowwhen done swiping, i.e. the index of the current page displayed changes, I'd use the onAppear modifier to detect that the page is visible and make an API call to fetch the weather data of the location currently in view. The entire app was architected around these few lines and the idea of pages, and it worked... until iOS 14.2 🤦‍♂️. If you copy the code above and try it out today, you'll see the onAppear being called multiple times instead of just once! I reported this issue to the SwiftUI community on Reddit and it sadly looks like every iOS dev is kind of accustomed to this kind of things happening. This is not very reassuring I know..., and many developers share this frustration: Upgrading OS, even minor, break your app? That's insane. Clicking a button doesn't work because my user upgrade iOS 13 to iOS 14. My app also crash because I use opacity of 0 when upgraded to BigSur. -- Philip Young, creator of Session As someone working primarily on the web, I'm not used at all to this kind of issues. This didn't even cross my mind that it could be a possibility when starting this project. The fix? Instead of handling whether a view within a TabView "appears", I'd move the state of the index in an "observable" and trigger my API call whenever a change in the index has been observed: Latest implementation of TabView with PageTabViewStyle used in Sunshine1import SwiftUI2 3class PageViewModel: ObservableObject {4 /*5 Every time selectTabIndex changes, it will notify the6 consuming SwiftUI view which in return will update7 */8 @Published var selectTabIndex = 09}10 11struct MainView: View {12 var city: String13 14 var body: some View {15 VStack {16 Text("\(city)")17 }.onAppear {18 print("Appear!")19 }20 }21}22 23struct ContentView: View {24 @StateObject var vm = PageViewModel()25 26 var cities: [String] {27 return ["New York", "San Francisco"]28 }29 30 var body: some View {31 return VStack {32 /*33 We keep track of the current tab index through vm.selectTabIndex.34 Here we do a Two Way binding with $ because we're not only reading35 the value of selectTabIndex, we're also updating it when the page36 changes37 */38 TabView(selection: $vm.selectTabIndex) {39 MainView(city: cities[0]).tag(0)40 MainView(city: cities[1]).tag(1)41 }42 .onReceive(vm.$selectTabIndex, perform: { idx in43 // Whenever selectTabIndex changes, the following will be executed44 print("PageView :: body :: onReceive" + idx.description)45 print("Call API to fetch weather data")46 fetchWeatherData(cities[idx])47 })48 .tabViewStyle(PageTabViewStyle(indexDisplayMode: .always))49 }50 }51} Because of this issue, the app ended up in an half broken state on iOS 14.2, and I had so much refactoring to do that I ended up restarting the development of Sunshine almost from scratch 😬. Using MapKit to build a location service One of the things that can feel weird when one gets started with iOS development is knowing that SwiftUI is, to this day, still "incomplete". Many core APIs are still not available to SwiftUI and the only way to interact with those is to do it through UIKit. One of those API I had to work with was MapKit. InfoAn icon representing the letter ‘i‘ in a circle ArrowAn icon representing an arrowUIKit is the predecessor of SwiftUI and it's still widely used. UIKit Documentation ArrowAn icon representing an arrowMapKit is a set of tools and APIs for anything dealing with maps, imagery, location, and points of interest. MapKit Documentation Sunshine needed a simple "Location Service" to search for cities and getting their corresponding lat/long coordinates. For that, I needed to use MapKit, and that's where things got rather complicated: ArrowAn icon representing an arrowUsing anything MapKit related felt less "Swift" and I wasn't the most comfortable with UIKit ArrowAn icon representing an arrowThere were very few MapKit related resources or blog posts besides the Apple Documentation The hardest part was actually to know the right keywords to search for. What I needed to use was a combination of: ArrowAn icon representing an arrowMKSearchCompleter: a MapKit utility to output a list of locations based on a partial string: i.e. passing "New" would output, "New York", "New Jersey" ArrowAn icon representing an arrowMKLocalSearch: a MapKit utility with all the tools to do points of interest search: this is what I used to get the coordinates associated with a given MKSearchCompleter result. Knowing that these were the MapKit utility functions I needed to use to build my "Location Service" took a lot of time digging through the documentation. This can be a bit frustrating at the beginning, especially as a frontend developer where I'm used to "Google my way" through a problem or an unknown. In case anyone has to build that kind of "Location Service", you'll find the code just below. I added some comments to explain as much I could in a small format, but I might write a dedicated blog post about this in the future: Implementation of a Location Service to search for cities and get their coordinates1import Foundation2import SwiftUI3import MapKit4import Combine5 6// The following allows us to get a list of locations based on a partial string7class LocationSearchService: NSObject, ObservableObject, MKLocalSearchCompleterDelegate {8 /*9 By using ObservableObject we're letting know any consummer of the LocationSearchService10 of any updates in searchQuery or completions (i.e. whenever we get results).11 */12 // Here we store the search query that the user types in the search bar13 @Published var searchQuery = ""14 // Here we store the completions which are the results of the search15 @Published var completions: [MKLocalSearchCompletion] = []16 17 var completer: MKLocalSearchCompleter18 var cancellable: AnyCancellable?19 20 override init() {21 completer = MKLocalSearchCompleter()22 super.init()23 // Here we assign the search query to the MKLocalSearchCompleter24 cancellable = $searchQuery.assign(to: \.queryFragment, on: self.completer)25 completer.delegate = self26 completer.resultTypes = .address27 }28 29 /*30 Every MKLocalSearchCompleterDelegate let's you specify a completer function.31 Here we use it to set the results to empty in case the search query is empty32 or in case there's an uknown error33 */34 func completer(_ completer: MKLocalSearchCompleter, didFailWithError: Error) {35 self.completions = []36 }37 38 /*39 Every MKLocalSearchCompleterDelegate let's you specify a completerDidUpdateResults function.40 Here we use it to update the "completions" array whenever results from the MapKit API are returned41 for a given search query.42 43 These results can be filtered at will, here I did not do any extra filtering to keep things simple.44 */45 func completerDidUpdateResults(_ completer: MKLocalSearchCompleter) {46 self.completions = completer.results47 }48}49 50extension MKLocalSearchCompletion: Identifiable {}51 52// Example of LocationSearchService consummer53 54struct ContentView: View {55 @ObservedObject var locationSearchService: LocationSearchService56 57 var body: some View {58 // Typing in this field will update the search query property in the LocationSearchService59 TextField("type something...", text: $locationSearchService.searchQuery)60 }.onChange(of: locationSearchService.completions) {61 /*62 Since searchQuery is changed, the LocationSearchService will update63 the completions array with results.64 65 Here we'll perform the getCoordinatesLocation on the first element in66 the list of results.67 */68 getCoordinatesLocation(locationSearchService.completions[0])69 }70 71 func getCoordinatesLocation(_ completion: MKLocalSearchCompletion) {72 // We initiate a MKLocalSearch.Request with the completion passed as argument of the function73 let searchRequest = MKLocalSearch.Request(completion: completion)74 // We define and trigger the search75 let search = MKLocalSearch(request: searchRequest)76 77 search.start { response, error in78 /*79 In this callback we can get the response of the search request,80 which contains the coordinates of the completion passed as arguments81 */82 guard let coordinates = response?.mapItems[0].placemark.coordinate else {83 return84 }85 86 guard let name = response?.mapItems[0].name else {87 return88 }89 90 print(name)91 print(coordinates)92 93 /*94 In Sunshine, I'd save the name and the coordinates a'''
