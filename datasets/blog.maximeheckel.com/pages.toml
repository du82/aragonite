["https://blog.maximeheckel.com/posts/react-sub-components-part-2-using-the-new-context-api-6f1c089acfe4"]
title = "React sub-components Part 2: Using the new Context API - Maxime Heckel's Blog"
description = "Further simplifying the sub-component pattern using contexts to make flexible, easily testable and reusable React components"
full_description = '''HomeReact sub-components Part 2: Using the new Context APIApril 16, 2018 / 8 min readLast Updated: April 16, 2018To fully understand this post, please read my original post about React sub-components first. I’ve received a lot of good feedback after publishing my first article about React sub-components, however, some of them got me thinking about how I could further improve the sub-components pattern in order to make it easier to read and use. The flaws of the current pattern Here are some the critiques I got back from some readers: ArrowAn icon representing an arrowHaving to import findByType for every component using sub-components is annoying ArrowAn icon representing an arrowIt is hard to compose or extend a sub-component to handle specific cases ArrowAn icon representing an arrowIt’s not the most readable ArrowAn icon representing an arrowWe could easily put the wrong data within the sub-component, it is not aware about what we’re trying to render within it While I agreed with all these statements, I couldn’t find an elegant way to address them without making the component difficult to use. However one day, one user from the Reactiflux community mentioned that using contexts would remove the necessity of using the findByType util within each sub-component; which obviously got me curious. Moreover, I was hearing a lot about the upcoming new Context API in React 16.3.0 and I thought that this would be a great way to start experimenting a bit with this new functionality. What is in the new Context API? Up until now, I’ve always thought contexts in React were hard to use, and it never felt natural to me to implement components using them except in some rare higher-order components. Plus it always fell in the category of “experimental API” so I’ve never had enough confidence in it to use it for a lot of production components. The new API, however, takes a new approach to contexts and makes the feature more accessible. It is available in React 16.3.0, you can read a lot more about it and how to use it in this article. For the purpose of this post, I’ll just keep it short and explain the 3 main items that make up this new pattern: ArrowAn icon representing an arrowReact.CreateContext: a function that returns an object with a Provider and a Consumer ArrowAn icon representing an arrowProvider: a component that accepts a value prop ArrowAn icon representing an arrowConsumer: a Function as Child component with the value from the Provider as a parameter With these new items, we’ll see that it is possible to create a better sub-component pattern that answers all the flaws stated in the first part. How to build a sub-component like pattern with the context API For this part, we’ll try to build the same Article component that we’ve built in my first post, but this time using contexts. In order to achieve this, we’ll need to create an ArticleContext. This will give us an ArticleContext.Provider component that will be our main parent, which we’ll rename Article, and an ArticleContext.Consumer, which will help us build all the sub-components we need. Let’s start this example by implementing a Title sub-component: Article.js1import React from 'react';2 3// This creates the "Article Context" i.e. an object containing a Provider and a Consumer component4const ArticleContext = React.createContext();5 6// This is the Title sub-component, which is a consumer of the Article Context7const Title = () => {8 return (9 <ArticleContext.Consumer>10 {({ title, subtitle }) => (11 <div style={{ textAlign: 'center' }}>12 <h2>{title}</h2>13 <div style={{ color: '#ccc' }}>14 <h3>{subtitle}</h3>15 </div>16 </div>17 )}18 </ArticleContext.Consumer>19 );20};21 22// This is our main Article components, which is a provider of the Article Context23const Article = (props) => {24 return (25 <ArticleContext.Provider {...props}>26 {props.children}27 </ArticleContext.Provider>28 );29};30 31Article.Title = Title;32 33export default Article; The example above shows how we can leverage Consumers and Providers to obtain the same sub-component pattern as we had in the first example of my previous article. If you compare this code in the link with the code above, you can see that the latter feels way simpler. Indeed, thanks to the new Context API, there is no need to build and use the findByType util. Additionally, we don’t rely on the displayName or name property of the sub-component to know how to render them. In the code below, we can see that the resulting Article component is much easier to use. Instead of passing children to the Title sub-component, we just need to pass them in the value prop of Article, which will make them available to every Consumer of the Article context (i.e. to every sub-component defined as a Consumer of this context). App.js1import React, { Component } from 'react';2import Article from './Article';3 4class App extends Component {5 constructor() {6 this.state = {7 value: {8 title: <h1>React sub-components with</h1>,9 subtitle: (10 <div>Lets make simpler and more flexible React components</div>11 ),12 },13 };14 }15 16 render() {17 const { value } = this.state;18 return (19 <Article value={value}>20 {/* no need to pass any children to the sub-component, you can pass21 your render functions directly to the title and subtitle property in22 the content object which is passed as value from our context provider23 (i.e. Article)*/}24 <Article.Title />25 </Article>26 );27 }28}29 30export default App; Moreover, if we want to wrap Article.Title in another div or component, we can now do that as well. Given that the implementation of the findByType util in my first post was relying on the direct children of Article , sub-components were restricted to be direct children and nothing else, which is not the case with this new way of doing sub-components. Note: You can see above that my value object passed to the provider is set to the parent’s state. This is to avoid creating a new object for value all the time which will trigger a re-render of Provider and all of the consumers. See https://reactjs.org/docs/context.html#caveats Additionally, we can make the piece of code above look even better. By simply exporting the Title functional component in Article.js we can give up the <Article.Title/> notation and simply use instead <Title/>. App.js1import React, { Component } from 'react';2import Article, { Title } from './Article';3 4class App extends Component {5 constructor() {6 this.state = {7 value: {8 title: <h1>React sub-components with</h1>,9 subtitle: (10 <div>Lets make simpler and more flexible React components</div>11 ),12 },13 };14 }15 render() {16 const { value } = this.state;17 return (18 <Article value={value}>19 <Title />20 </Article>21 );22 }23}24 25export default App; This is purely aesthetic though, and I personally prefer the first implementation. It gives more context about where a given sub-component comes from and with which parent component it can be used, and also avoids duplicated name issues. Caveats When showing this new pattern to some other developers who were familiar with using the one described in my first article I got one critique: it’s not possible to whitelist children anymore; anything can go within the parent component. While this new implementation is more flexible, the first one was able to restrict the children of a component to only its sub-components. There are multiple ways to fix this, but so far the only one I’ve explored is by using flow. I’ll detail the process in my next article. Full implementation In the code snippets below, you will find: ArrowAn icon representing an arrowThe full Article component code and all its sub-components in Article.js ArrowAn icon representing an arrowAn example App.js where you can see how we use the full component and sub-components Article.js1import React from 'react';2 3// This creates the "Article Context" i.e. an object containing a Provider and a Consumer component4const ArticleContext = React.createContext();5 6// This is the Title sub-component, which is a consumer of the Article Context7const Title = () => {8 return (9 <ArticleContext.Consumer>10 {({ title, subtitle }) => (11 <div style={{ textAlign: 'center' }}>12 <h2>{title}</h2>13 <div style={{ color: '#ccc' }}>14 <h3>{subtitle}</h3>15 </div>16 </div>17 )}18 </ArticleContext.Consumer>19 );20};21 22const Metadata = () => {23 return (24 <ArticleContext.Consumer>25 {({ author, date }) => (26 <div27 style={{28 display: 'flex',29 justifyContent: 'space-between',30 }}31 >32 {author}33 {date}34 </div>35 )}36 </ArticleContext.Consumer>37 );38};39 40const Content = () => {41 return (42 <ArticleContext.Consumer>43 {({ content }) => (44 <div style={{ width: '500px', margin: '0 auto' }}>{content}</div>45 )}46 </ArticleContext.Consumer>47 );48};49 50// This is our main Article components, which is a provider of the Article Context51const Article = (props) => {52 return (53 <ArticleContext.Provider {...props}>54 {props.children}55 </ArticleContext.Provider>56 );57};58 59Article.Title = Title;60Article.Metadata = Metadata;61Article.Content = Content;62 63export default Article; App.js1import React, { Component } from 'react';2import Article from './Article';3 4const text = `5 Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.6`;7 8class App extends Component {9 constructor() {10 this.state = {11 value: {12 title: <h1>React sub-components with</h1>,13 subtitle: (14 <div>Lets make simpler and more flexible React components</div>15 ),16 author: 'Maxime Heckel',17 date: <i>April 2018</i>,18 content: <p>{text}</p>,19 },20 };21 }22 render() {23 const { value } = this.state;24 return (25 <Article value={value}>26 <Article.Title />27 {/* here we can see that wrapping the metadata sub-component is now possible thanks to contexts*/}28 <div style={{ width: '500px', margin: '80px auto' }}>29 <Article.Metadata />30 </div>31 <Article.Content />32 </Article>33 );34 }35}36 37export default App; If you feel like playing with this pattern I’ve made the example of this article available on Github here, you can set up the dockerized project using docker-compose build && docker-compose up, or just run yarn && yarn start if you want to run it directly on your machine.Liked this article? Share it with a friend on Bluesky or Twitter or support me to take on more ambitious projects to write about. Have a question, feedback or simply wish to contact me privately? Shoot me a DM and I'll do my best to get back to you.Have a wonderful day.– Maxime2018-04-16T17:08:40.154+01:00Further simplifying the sub-component pattern using contexts to make flexible, easily testable and reusable React components'''
