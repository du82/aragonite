["https://blog.maximeheckel.com/posts/guide-to-cicd-for-frontend-developers"]
title = "The little guide to CI/CD for frontend developers - Maxime Heckel's Blog"
description = "How to ship your app faster, more reliably and make your team unstoppable with good testing practices and automation."
full_description = '''HomeThe little guide to CI/CD for frontend developersJuly 28, 2020 / 30 min readLast Updated: August 12, 2020If you've been following my work for a while, or read my previous articles, you might have noticed that I love building tools that improve the reliability and the scalability of the projects I work on. Continuous Integration and Continuous Delivery pipeline, also referred to as CI/CD, is one of them. Building such a pipeline and making it as automated as possible, is like giving superpowers to your team. With it, you can enable your organization to deliver: ArrowAn icon representing an arrowCode that respects consistent styling guidelines and formatting ArrowAn icon representing an arrowReliable software is tested and so are its subsequent releases to avoid regressions ArrowAn icon representing an arrowConsistent releases: releasing a new version to the customer is as easy as possible and your team can ship fixes to production in no time ArrowAn icon representing an arrowFeatures that can easily be reverted if they degrade the user experience ArrowAn icon representing an arrowAny upcoming change to the product can be previewed as an independent unit of change ArrowAn icon representing an arrowUse every developer's time as efficiently as possible. Developers cost money and you don't want them to be constantly putting out fires in production. Automate testing and releases, remove all the humans in the process as much as possible. More testing means fewer bugs means less fear of change. Less fear of change means more experimentation and innovation. More automation means more time for experimentation and innovation. Change must be in the DNA of the team -- Eric Elliott in How to Build a High-Velocity Development Team If your team suffers from complex release processes, struggles to patch production within the same day or to get a new feature to the customers reliably: this article is for you! In this post, I'll give you all the tools that you and your team need to build a high-velocity development environment, eradicate the fear of releasing, and establish processes for your team to become unstoppable. Like the title suggests, the following will be written for frontend developers since this is the area where I'm the most knowledgeable, especially when it comes to tooling. However, the concepts and steps that I will detail can also be valuable to backend developers who are looking to improve their team's testing and release pipeline. The impact of automation on your team, your org, and your users When starting to work on a new CI/CD pipeline, or looking at improving an existing one, it's essential to target the efforts where you want to make the most positive impact: ArrowAn icon representing an arrowunit-testing, formatting, linting, and integration-testing: impact mainly the developers within your team. Having a good habit of writing unit tests, and having consistent code styling can increase velocity within the team. These are what I called fast to run fast to fail: they can be run quickly to identify any issues within the codebase and act as the first safeguard against bugs. ArrowAn icon representing an arrowend to end testing, automated release, and branch previews are more impactful at the cross-functional or organizational level. End to End testing will, for example, enable your frontend team and backend team to test some critical user paths. The automated releases ensure things are released with as little friction as possible and that your entire org can address a customer request as fast as possible. Finally, branch previews enable your frontend team and QA team to review work before it lands on production. Each upcoming feature or fix can be hosted in its service and tested on its own. ArrowAn icon representing an arrowfeature flags and accessibility testing are more customer-facing. They guarantee a better and more inclusive experience for all your users and also avoid any service disruption when it comes to releasing new features. The following showcases a rather complete CI/CD pipeline and all its different steps. Additionally I separated that pipeline in 3 parts, representing which of the team, the org and the end-user each step of the pipeline is bringing the most positive impact: Illustration of each step of a CI/CD pipeline and which of the team, the organization and the end-user they impact the most Linting, Formatting, and Unit tests These three items are the foundational pieces for your team to ship more reliable software, faster. Linting and formatting Linting and formatting are essential to keep your codebase consistent and clean. Each team member should follow the same rules and conventions when it comes to writing code. Consistency in the codebase itself is essential: ArrowAn icon representing an arrowyou do not want to bring confusion on how to write a given piece of code in your app when you onboard a new team member ArrowAn icon representing an arrowyou do not want to have to document multiple ways of doing the same thing Tools I useFor this step, I want my tools to be fast and reliable. It should only take **a few seconds **to lint and format my codebase. As a frontend engineer, I use ArrowAn icon representing an arrowESlint for linting, it comes with a set of rules to write proper Javascript, and these rules can be customized to your own team's fit. Additionally, should you need something more specific, you can build your own ESLint rules, I wrote about it here, it's an interesting exercise that involves Abstract Syntax Tree (AST). ArrowAn icon representing an arrowPrettier for formatting. It became the defacto formatting tool for Javascript developers within the last few years. I set it up in my project and editor in a way that saving a file will format it automatically for me. As said above, this step must be super fast. So fast that you can execute this step as a pre-commit hook (an arbitrary script that runs on every commit. I like using husky to set these up) as it will ensure that the code is formatted and readable before it's up for review by your teammates. Unit tests As stated earlier, I like to call these tests fast to run, **fast to fail. **They should not take an extensive amount of time to run and should reveal errors or bugs in a matter of a few seconds or even a few minutes depending on the scale of your project. The aim here is to test each part of your app as "units" or isolated components. In a React project, for example, these tests can cover: ArrowAn icon representing an arrowComponents: I like to use unit tests to ensure my components have the proper behavior and are functioning as expected on their own, i.e.** not in combination with other components or views of my app**. ArrowAn icon representing an arrowReducers / State / Actions: unit tests can help to validate that your state is updated in a specific way for a given action. Reducers are pure functions (i.e. functions that always return the same output for a given input) ArrowAn icon representing an arrowUtility functions: we build a lot of helpers, or abstract a lot of functions in our projects: these are a perfect example of things that you might want to write unit tests for. I like unit tests a lot because they act as a sanity check for your project to make sure its individual pieces work as intended over time, in a very efficient way (fast, reliable). Tools I useAs frontend developers, you might have probably heard about Jest. It's the most popular Javascript testing framework and has been for a few years now. Jest is the testing tool I always install first in my Javascript projects. To run tests on my React apps, for example, I use it in combination with: ArrowAn icon representing an arrow@testing-library/react : If you want to write maintainable tests over time without worrying about implementation details. I mainly use it to render individual components and test them. ArrowAn icon representing an arrow@testing-library/react-hooks: This library gives you all the tooling necessary to test your custom hooks. ArrowAn icon representing an arrow@testing-library/jest-dom: This package gives you extra DOM element matchers to make your tests even easier to write and read. The @testing-library maintainers also provided a ton of other packages that will help you test your app no matter the framework (Svelte, VueJS, etc). Below, you will find code snippets showcasing some test suites that are meant to illustrate how I usually write tests in different situations. In this one, I test a simple React Button component using @testing-library/react and Jest. Example of a unit test suite for a Button component using @testing-library/react1// Button.jsx2import React from 'react';3 4const Button = (props) => {5 const {6 onClick,7 disabled = false,8 loading = false,9 children,10 ...rest11 } = props;12 13 return (14 <button {...rest} onClick={() => onClick()} disabled={loading || disabled}>15 {loading ? 'Loading ...' : children}16 </button>17 );18};19 20export default Button;21 22// ===============23// Button.test.jsx24import React from 'react';25import { render, screen } from '@testing-library/react';26import userEvent from '@testing-library/user-event'; // I use the userEvent package to manage events rather than fireEvent27import '@testing-library/jest-dom/extend-expect';28import Button from './';29 30describe('Button Component', () => {31 it('Renders the Button as expected and clicking on it calls the function passed in the onClick prop', () => {32 const onClickMock = jest.fn();33 const { container, debug } = render(34 <Button name="test-btn" onClick={onClickMock}>35 Test36 </Button>37 );38 39 expect(screen.getByRole('button')).toBeInTheDocument(); // .toBeInTheDocument is a handy function that is given by the jest-dom/extend-expect package40 expect(screen.getByRole('button')).toHaveTextContent('Test');41 expect(screen.getByRole('button')).not.toHaveAttribute('disabled');42 userEvent.click(screen.getByRole('button'));43 expect(onClickMock).toHaveBeenCalled();44 });45 46 it('Renders the Button with loading set to true and clicking on it does not call the function passed in the onClick prop', () => {47 const onClickMock = jest.fn();48 const { container, debug } = render(49 <Button name="test-btn" loading onClick={onClickMock}>50 Test51 </Button>52 );53 54 expect(screen.getByRole('button')).toBeInTheDocument();55 expect(screen.getByRole('button')).toHaveTextContent('Loading ...');56 expect(screen.getByRole('button')).toHaveAttribute('disabled');57 userEvent.click(screen.getByRole('button'));58 expect(onClickMock).not.toHaveBeenCalled(); // you can negate a specific matcher by inserting `.not` before calling it59 });60 61 it('Renders the Button with disabled set to true and clicking on it does not call the function passed in the onClick prop', () => {62 const onClickMock = jest.fn();63 const { container, debug } = render(64 <Button name="test-btn" disabled onClick={onClickMock}>65 Test66 </Button>67 );68 69 expect(screen.getByRole('button')).toBeInTheDocument();70 expect(screen.getByRole('button')).toHaveTextContent('Test');71 expect(screen.getByRole('button')).toHaveAttribute('disabled');72 userEvent.click(screen.getByRole('button'));73 expect(onClickMock).not.toHaveBeenCalled();74 });75}); For this code snippet, I focus on testing a reducer function that can handle two different types of actions. I love testing reducers because as pure functions, they have predictable outputs regardless of the complexity, thus writing tests for these is always an easy win for your team. Example of a unit test for a reducer / function1// reducer.js2const initialState = {};3 4const reducer = (state = initialState, action) => {5 switch (action.type) {6 case 'FETCH_POSTS': {7 const { payload } = action;8 const items = payload.reduce((accumulator, currentItem) => {9 accumulator[currentItem.id] = currentItem;10 return accumulator;11 }, {});12 return { ...state, ...items };13 }14 case 'CLEAR_POSTS': {15 return {};16 }17 default: {18 return state;19 }20 }21};22 23export default reducer;24 25// ===============26// reducer.test.js27import reducer from './reducer';28 29describe('Reducer', () => {30 it('Handles the FETCH_POST action as expected when the initial state is an empty object', () => {31 const action = {32 type: 'FETCH_POSTS',33 payload: [34 {35 userId: 1,36 id: 1,37 title: 'Title Test',38 body: 'Test',39 },40 {41 userId: 1,42 id: 2,43 title: 'Title Test 2',44 body: 'Test2',45 },46 ],47 };48 49 const initialState = {};50 51 expect(reducer(initialState, action)).toEqual({52 1: { body: 'Test', id: 1, title: 'Title Test', userId: 1 },53 2: { body: 'Test2', id: 2, title: 'Title Test 2', userId: 1 },54 });55 });56 57 it('Handles the FETCH_POST action as expected when the initial state is an empty object', () => {58 const action = {59 type: 'FETCH_POSTS',60 payload: [61 {62 userId: 1,63 id: 1,64 title: 'Title Test',65 body: 'Test',66 },67 {68 userId: 1,69 id: 2,70 title: 'Title Test 2',71 body: 'Test2',72 },73 ],74 };75 76 const initialState = {77 3: {78 body: 'Test',79 id: 3,80 title: 'Title Test 3',81 userId: 2,82 },83 };84 85 expect(reducer(initialState, action)).toEqual({86 3: { body: 'Test', id: 3, title: 'Title Test 3', userId: 2 },87 1: { body: 'Test', id: 1, title: 'Title Test', userId: 1 },88 2: { body: 'Test2', id: 2, title: 'Title Test 2', userId: 1 },89 });90 });91 92 it('Handles the CLEAR_POSTS action as expected', () => {93 const action = {94 type: 'CLEAR_POSTS',95 };96 97 const initialState = {98 3: {99 body: 'Test',100 id: 3,101 title: 'Title Test 3',102 userId: 2,103 },104 };105 106 expect(reducer(initialState, action)).toEqual({});107 });108}); AlertAn icon representing an exclamation mark in an octogoneA note about test coverageI see a lot of people putting quarterly objectives for test coverage. Unless your project is an open-source library or a design system containing components that are critical across your entire organization, test coverage should simply remain a metric to measure whether your team is making progress when it comes to testing your consumer app. InfoAn icon representing the letter ‘i‘ in a circleA note on type checkingI'm skipping type checking in this section on purpose as this step deserves an article on its own. Integration and end-to-end testing I'm dedicating this section to both integration and end-to-end testing as I sometimes see these two types of testing used interchangeably and I think that it's important to know the nuance. Integration tests This is perhaps where most of your efforts should go when writing tests. Why? Well, when considering the effort it takes to write tests, the time it takes to execute them and the confidence level it gives back to your team: integration tests are simply the best. Unit tests give you a low confidence level but are fast to run, while end-to-end tests are slow to execute (sometimes taking over an hour in some large apps) and require expensive infrastructure to ru'''
