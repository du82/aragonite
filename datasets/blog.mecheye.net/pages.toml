full_description = "New Xplain: Basic 2D Rasterization Posted on May 29, 2017 by Jasper St. Pierre Reply Hi. I just published a new Xplain article about basic 2D rasterization. Since I left Endless and the Linux world behind, I haven’t felt as motivated to document the details of the X11 Window System, but I still feel very motivated to teach the basics and foundations of graphics and other systems. Xplain seems to be my place for interactive demo explanations, so on there it goes. Take care. Posted in Uncategorized | Leave a reply"
