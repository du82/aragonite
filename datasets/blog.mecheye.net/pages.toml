title = "August | 2011 | Clean Rinse"
full_description = "1000 words… Posted on August 26, 2011 by Jasper St. Pierre 3 http://bugzilla.gnome.org/show_bug.cgi?id=628195 EDIT: some people have been asking for a better screenshot (there’s only two pixels of difference above). Here’s a highly exaggerated example: Posted in Uncategorized | 3 Replies We’ll do it live! Posted on August 19, 2011 by Jasper St. Pierre 7 Live extension enabling and disabling has landed! This allows users to do this! I could do that all day. It’s quite fun. But there’s one little problem. Extension developers? We need to talk. “What did I do?” Nothing bad, I promise. You just have a new responsibility: in case the user doesn’t like the extension, you need to undo all the changes that you ever made to the shell. Make it look like your code never touched the place. Otherwise: that video above? The giant illusion will drop to the ground and crack into a thousand pieces. Like that China I broke last weekend. “Uh, OK. How?” If your extension looked like this before, you need to make it look like either this, or this. Put simply: main(), uh, how do I say this? main() has been, uh, let go. Sure. Don’t worry though, he’s been replaced with init(), enable() and disable(). They’re just as cool. I promise. The in-depth obitua — uh, termination notice can be read here. init()‘s best friend, the “helper” object couldn’t make it for this trip. He’ll be here next year. There’s three simple rules to take into account: There used to be one required method: main(). This has been removed. It has been replaced with a new hook, init(). You should use init() to initialize any state. Do not modify the Shell inside of this function. The init() may return an object, called the “state object”. If you do not return an object, the module is considered the state object. This object is supposed to have two new methods: enable() and disable(). These should modify Shell in the appropriate way. For lack of better vocabulary, extensions which use the module (return nothing from init()) as their state object are called “stateless” objects, and those which don’t are “stateful”. init() is guaranteed to be called at most once per shell session. enable() and disable() may be called at any time. If your extension is enabled at the start of the session, enable() will be called. If your extension is disabled at the start of the session, disable() will not be called, and there is no guarantee that init() will be called. Additionally, keep in mind that Shell extensions are versioned, so only extensions that are targeted for 3.2 should port to the new API. Some extensions that want to support both 3.0 and 3.2. Fortunately there is an easy way to do exactly that. Just run init(), and then enable(): function main() { init(); enable(); } … Stateful extensions just need to run enable() on their state object. function main() { init().enable(); } Oh, and one last thing. Thank you. You don’t have to believe it, but I’m doing this for you. I’m trying to make it easier for users to safely try out your awesome work. There’s more awesome stuff for you guys on the way. I promise. Posted in Uncategorized | 7 Replies"
