full_description = "Xplain: Regional Geometry Posted on November 18, 2015 by Jasper St. Pierre 8 *cough* *cough* Is this thing still on? I don’t write much here anymore, partly because I don’t see it as a platform where I have much voice or volume, and also because the things I most want to write about don’t fit in this blog thematically. But a few years ago when I first released Xplain, I promised everyone that when I updated my Xplain series, since it didn’t naturally have an RSS feed, I’d write something here instead. I have released a new article on Xplain, and as such, I’m here to fill up your feed reader with a link telling you to go look elsewhere. I’m particularly happy with the way this article came out, and for those of you still watching this space, I’d really appreciate it if you read it. Thank you. Xplain: Regional Geometry Posted in Uncategorized | 8 Replies"
