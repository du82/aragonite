title = "March | 2017 | Clean Rinse"
full_description = "Take care. Posted on March 10, 2017 by Jasper St. Pierre 1 Today was my last day at Endless. Most of you know me for my Linux, GNOME, and free software work. It might be shocking or surprising for you guys to know that I’m choosing, willingly!, to go on and be one of the nameless faces working on commercial software. Facts: At Endless, my last year was almost exclusively spent working on proprietary software. And I was happier. I’m typing this in Visual Studio Code, running on Windows 10. I haven’t run any variant of Linux on my main desktop computer for almost 5 years. I took a pay cut for the new position. I’ll post about my experiences working on Linux and open-source software professionally soon. After that, this blog will die. I’ll still keep it up and running, but I won’t be posting any more. Take care. Posted in Uncategorized | 1 Reply"
