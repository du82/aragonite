title = "GJS Improvements | Clean Rinse"
full_description = "GJS Improvements Posted on February 4, 2012 by Jasper St. Pierre Myself, Giovanni Campagna as well as Colin Walters have all been working hard trying to make GJS somewhat of a competitor to PyGObject, being a full introspection stack for the GNOME Desktop Environment. Rather than give you a bunch of history, let me just give you a quick taste. There’s much more to the landing than this, such as implementing your own signals, properties, as well as implementing interfaces, but it will take me a few days to come up with an exciting example that fully showcases the power that you now have. const Lang = imports.lang; const Cogl = imports.gi.Cogl; const Clutter = imports.gi.Clutter; const Gio = imports.gi.Gio; const MyClutterActor = new Lang.Class({ Name: 'MyClutterActor', Extends: Clutter.Actor, vfunc_get_preferred_width: function(actor, forHeight) { return [100, 100]; }, vfunc_get_preferred_height: function(actor, forWidth) { return [100, 100]; }, vfunc_paint: function(actor) { let alloc = this.get_allocation_box(); Cogl.set_source_color4ub(255, 0, 0, 255); Cogl.rectangle(alloc.x1, alloc.y1, alloc.x2, alloc.y2); } }); const MyClutterEffect = new Lang.Class({ Name: 'MyClutterEffect', Extends: Clutter.DeformEffect, vfunc_deform_vertex: function(effect, width, height, vertex) { vertex.x += Math.random() * 20 - 10; vertex.y += Math.random() * 20 - 10; } }); let actor = new MyClutterActor(); let stage = new Clutter.Stage(); actor.animatev(Clutter.AnimationMode.EASE_IN_OUT_CUBIC, 2000, ['x', 'y'], [200, 200]); actor.add_effect(new MyClutterEffect()); stage.add_actor(actor); stage.show_all(); Clutter.main(); This entry was posted in Uncategorized by Jasper St. Pierre. Bookmark the permalink. Jonathan Turner on February 4, 2012 at 3:58 am said: This is very cool. The code has a nice, clean feel to it (at first I didn’t even recognize it as JS) Keep up the good work! Reply ↓ Lucas Rocha on February 4, 2012 at 2:26 pm said: Great work Jasper, Giovanni, and Colin! Thanks a lot for that! Reply ↓"
