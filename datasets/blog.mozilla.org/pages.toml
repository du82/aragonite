unction featuredVideo() { // fetch the video link var videoURLElement = document.getElementById("featuredvideourl"); var videoUrl = videoURLElement.innerHTML; // a function that takes a youtuve URl and returns the ID function youtube_parser(url) { var regExp = /^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#&?]*).*/; var match = url.match(regExp); return (match && match[7].length == 11) ? match[7] : false; } const videoId = youtube_parser(videoUrl); // listen for a click. Then remoe the image and replace with the video iframe const youtube = document.getElementById("featuredvideo"); youtube.addEventListener("click", function() { var videoiframe = document.createElement("iframe"); videoiframe.setAttribute("frameborder", "0"); videoiframe.setAttribute("allowfullscreen", ""); videoiframe.setAttribute("src", "https://www.youtube-nocookie.com/embed/" + videoId + "?rel=0&showinfo=0&autoplay=1"); youtube.innerHTML = ""; youtube.classList.add('responsive-video'); youtube.appendChild(videoiframe); }); } window.addEventListener("load", featuredVideo, false); Featured Video Podcast: Outside the Fox https://www.youtube.com/watch?v=0U9XU9aE9v4 Watch more videos Featured Collection Latest Mozilla news What is the best hardware concurrency for running inference on CPU? Read More Paris AI Action Summit: A milestone for open and Public AI Read More ROOST: Open source AI safety for everyone Read More Welcoming Peter Rojas as Mozilla’s SVP of New Products Read More Mozilla, EleutherAI publish research on open datasets for LLM training Read More Raising the bar: Why differential privacy is at the core of Anonym’s approach Read More Read more Mozilla news Featured Collection Latest Firefox news Firefox News Introducing a terms of use and updated privacy notice for Firefox Read More Firefox AI Running inference in web extensions Read More Firefox Tips Supercharge your day: Firefox features for peak productivity Read More Firefox Tips Streamline your schoolwork with Fir