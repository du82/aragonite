title = "Belén del Hospital San Rafael (2015) | El blog de Navidad Digital"
description = "Entre todos los belenes que podemos visitar esta Navidad en Madrid encontramos el del Hospital San Rafael, cerca del Estadio Santiago Bernabéu. Allí todos los años se instala un belén monumental y una pequeña exposición de nacimientos del mundo. Organizado por la Orden Hospitalaria San Juan de Dios, el belén es ya toda una tradición en la ciudad…"
full_description = "Belén del Hospital San Rafael (2015) Entre todos los belenes que podemos visitar esta Navidad en Madrid encontramos el del Hospital San Rafael, cerca del Estadio Santiago Bernabéu. Allí todos los años se instala un belén monumental y una pequeña exposición de nacimientos del mundo. Organizado por la Orden Hospitalaria San Juan de Dios, el belén es ya toda una tradición en la ciudad desde 1940 y fue pionero en su época al ofrecer un ciclo de iluminación progresivo día/noche. Se entra por la C/ Herreros de Tejada, 3 y abre de 11:00 a 13:30 y de 16:30 a 20:00. La entrada es completamente gratuita, a continuación algunas fotos del belén. Comparte esta entrada:FacebookTwitterMe gusta Cargando... Relacionado Dic1717 diciembre, 2015 • By Alberto • Esta entrada fue publicada en Blog belenista, Cosas navideñas. Guarda el enlace permanente. frideollivier dijo: 17 diciembre, 2015 en 3:41 pm La imagen o escena de La Santisima Virgen recostada junto al niño no es muy comun ver. Algo tan natural y fidedigno rara vez se representa. Gracias por tu labor es hermosa Responder Miguel Velåsquez Salazar dijo: 1 enero, 2020 en 4:42 pm Una belleza que Dios quiera perdure por muchos años, felicito a los hermanos de San Juan de Dios por su labor y por como lo mantienen que el señor los bendiga. Responder"
