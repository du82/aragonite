title = "El blog de Navidad Digital | 29 años celebrando la Navidad en Internet"
description = "29 años celebrando la Navidad en Internet"
full_description = "Trampantojo de blanca Navidad – Feliz 24 (II) La Blanca Navidad del villancico ha llegado a la ciudad con un poco de retraso y en forma de trampantojo. No ha nevado, diría que afortunadamente porque la última vez que nevó casi se paraliza la ciudad, ¡pero los almendros se han encargado de pintar algunos jardines de blanco! Además, las aves, que disfrutan tanto de las flores como yo de sus frutos, han contribuido a que el suelo quede blanco como si hubiera nevado. Ver cómo van cayendo los pétalos, porque haya pájaros en la copa del árbol dándose el festín, me trae ciertos recuerdos ya que de pequeño me encantaba echar al Belén esa nieve artificial que típicamente eran bolitas de corcho o pequeñas láminas blancas. Quedaba igual que en la foto que ilustra el texto, que por cierto es de hace unos días en El Retiro de Madrid, ¡estamos en plena temporada de almendros en flor! Sigue leyendo → Feb2424 febrero, 2025 • By Alberto • Publicado en Feliz 24, Portada • Comentarios: 11 Los primeros pasos – Feliz 24 (I) Hace solo dos semanas estábamos celebrando la llegada de los Reyes Magos, tan cercano en el tiempo y, sin embargo, tan lejano a su vez. El tiempo se nos descoloca un poco con el cambio de rutina, los propósitos del nuevo año que quizá hayamos empezado, el famoso blue monday que dicen que es el día más triste del año o el invierno más asentado que tiene la luz solar bajo mínimos, ¿dónde están los amaneceres ahora? Sigue leyendo → Ene2424 enero, 2025 • By Alberto • Publicado en Feliz 24, Portada • Comentarios: 18 Feliz Día de Reyes 2025 La temporada navideña se acerca a su fin con el colofón que supone el Día de Reyes, precedido de las cabalgatas que tuvieron lugar anoche en numerosas ciudades. Toca disfrutar del día, quizá incluso darse un último paseo bajo las luces navideñas de las calles que, al menos aquí en Madrid, se encenderán hoy por última vez. La fotografía que encabeza el post es un increíble Gaspar de estilo Napolitano del artesano italiano Michele Buonincontro que vi en la Feria Internacional de Belenismo. Y la siguiente foto es una sorpresa – luego me quejo del clickbait… Sigue leyendo → Ene66 enero, 2025 • By Alberto • Publicado en Cosas navideñas, Portada • Comentarios: 6"
