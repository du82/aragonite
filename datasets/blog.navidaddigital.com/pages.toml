title = "Navidad vintage (I) | El blog de Navidad Digital"
description = "Lo clásico está de moda. El diseño retro o también llamado vintage que nos recuerda épocas pasadas y sus creaciones atrae cada vez con más fuerza. Motivos, apelan a la nostalgia de los que han vivido la época y suponen algo diferente para los que no la conocieron. Quizá, como decía Jorge Manrique, nos parece…"
full_description = "Navidad vintage (I) Lo clásico está de moda. El diseño retro o también llamado vintage que nos recuerda épocas pasadas y sus creaciones atrae cada vez con más fuerza. Motivos, apelan a la nostalgia de los que han vivido la época y suponen algo diferente para los que no la conocieron. Quizá, como decía Jorge Manrique, nos parece que cualquier tiempo pasado fue mejor. Personalmente, el pasado mejor solo mirarlo de reojo si los recuerdos nos van a dar fuerza o nos van a evitar repetir errores, para todo lo demás creo que es mejor dejarlo tranquilo y echar la vista hacia delante. Pero estamos en Navidad, bueno, casi, casi… jajaja, fiesta tradicional por excelencia y donde apelar a lo clásico es casi obligado porque refleja la evolución de la celebración con el paso del tiempo. Las costumbres locales, con más o menos influencia de algunas tendencias, se mantienen a lo largo de los años. Pero las cosas no. Primero porque las cosas ya no se hacen como antes, y segundo porque tampoco las usamos como antes, ya sea por la globalización (fabricación mundial versus pequeño taller artesano) o por los avances tecnológicos (mensajes electrónicos versus felicitaciones manuscritas). Por ello, el objetivo de esta serie de artículos es apelar a esa nostalgia navideña a través de objetos antiguos, tarjetas de felicitación de siglos pasados, fotos con historia, etc. Anoche subí al muro navideño de facebook un vídeo de una casita musical de cuerda, preludio de este artículo evidentemente. Nada de electrónica ni pilas… totalmente mecánico. El vídeo es muy sencillo, pero sin duda transporta al pasado con ese clack-clack de darle cuerda, la melodía y ese movimiento, tal vez extraño, de las figuras. Quizá incluso alguno de vosotros tuviera alguna cajita del estilo en casa. Mi pasión por todo tipo de cachibache electrónico -he crecido con ellos- no está reñida con mi admiración por los ingenios mecánicos. Las cajas de música son uno de ellos, y por eso este primer artículo de navidades vintage va dedicado a ellas. Las cajas de música se desarrollaron fundamentalmente durante el siglo XIX (se considera que la primera es obra del relojero suizo Antoine Favre en 1796) y al ser ingenios totalmente mecánicos se basaban en elementos metálicos afinados que al ser presionados hacían sonar la nota que le correspondiera. El mecanismo concreto para conseguir que suenen las notas que componen la melodía en su orden y cadencia adecuada ya depende de los distintos modelos. En el blog de El coleccionista ecléctico tienen una entrada tan extensa sobre la historia de estas singulares máquinas que no merece la pena duplicar el trabajo. ¡Así que vamos directamente a escuchar música! Estamos alrededor de los años 1890, hemos encendido la chimenea y damos cuerda a nuestra caja de música para sentarnos plácidamente, cerrar los ojos y transportarnos a un mágico mundo navideño. Noche de Paz en una caja de música Polyphon con disco de 15 pulgadas (finales siglo XIX) Navidad, Navidad en una caja de música Adeste Fideles en una caja de música ¡Despertad! 😀 Luego ya llegó el gramófono, el tocadiscos, el CD, el MP3, etc… y actualmente ya casi todos los adornos o juguetes con música navideña llevan un chip alimentado por batería que tiene almacenado en memoria un montón de melodías y las reproduce en un pequeño altavoz -que se suele oír tan mal que mejor que no suene…-. Sin embargo, las creaciones modernas que quieren tener un aspecto más clásico o vintage incorporan cajas de música en miniatura habitualmente basadas en rodillo y peine. Eso sí, el rodillo que va tocando las notas ahora se mueve con un motor eléctrico a pilas para evitar al usuario tener que dar cuerda y conservar mejor la cadencia. Aunque recuerdo hace no mucho haber visto en tiendas de regalo pequeñas cajitas musicales para hacer sonar la música manualmente. Doce días de Navidad en caja de música de rodillo motorizada Y hasta aquí este pequeño repaso musical de la navidad vintage, ya veremos y escucharemos más en próximos posts de esta serie. Aprovecho por último para hacer un llamamiento para colaborar con esta iniciativa de retrospectiva navideña. Si tenéis alguna postal navideña bonita de hace muchos años, alguna foto de esas irrepetibles que muestren el ambiente de época (si es de un sitio medianamente famoso o típico de la región mejor todavía), algún objeto que pueda ser considerado una reliquia navideña o de coleccionista. ¡compártelo! Bien en nuestro muro de facebook, bien por email, y haré una selección para mostrarlas en Navidad Digital. ¿Qué os parece la iniciativa? Fotos: Scannerqueen (niños cantores y paisaje nevado), postales de alrededor de 1970 Comparte esta entrada:FacebookTwitterMe gusta Cargando... Relacionado Nov55 noviembre, 2013 • By Alberto • Esta entrada fue publicada en Navidad Vintage, Portada. Guarda el enlace permanente."
