full_description = "Lessons Learned - The 2024 Houston Derecho 2024 is not even over yet, but so we have already endured two massive storms that caused widespread destruction. This posts goes through the lessons I learned in the first of those 2 storms 2024 Houston Derecho On May 16th 2024, a Derecho hit the Houston area which had very Oct 27, 2024 7 min read Misc Projects and Updates This post is just some small updates to past projects, and some smaller projects that don't really warrant their own full post. Garage Compressed Air Setup Updates Original post: Garage Compressed Air SetupI find myself needing compressed air for nail and staple guns, filling up tires, blowing out Jan 17, 2024 15 min read Emporia EVSE Install At the end of last year we got an EV. This post details the install of an Emporia EVSE in my garage. It won't be very long, but it may give you an idea of how you might install yours. At first I was just charging it with Jan 16, 2024 6 min read ratgdo with Liftmaster Garage Door Opener If you saw my earlier post, you'll have read about my issues with my MyQ, and how I switched to OpenGarage to gain full local control of my garage door opener Ditching MyQ for OpenGarage - Open Source Garage Door ControlThis posts details how I ditched Liftmaster MyQ Dec 13, 2023 6 min read Ditching MyQ for OpenGarage - Open Source Garage Door Control This posts details how I ditched Liftmaster MyQ and switched to a much better, completely selfhosted and local way of controlling my garage door with OpenGarage, and the problems I ran into with both solutions, and how I overcame them. MyQ In my garage I have a Chamberlain Liftmaster Garage Nov 6, 2023 14 min read VM's and Containers I am Running - 2023 My last post detailed all the hardware I am running, so this post will list all the software that I run in VM's and containers. All of the following are virtual machines running on top of ESXi 7.0 U3 on three hosts. All containers are run within Aug 30, 2023 29 min read