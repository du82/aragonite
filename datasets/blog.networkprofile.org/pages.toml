full_description = "VMware VMware VCP 6.5 Data Center Virtualization Certification Passed! Just before the new year I tool the VCP6.5-DCV Exam, and passed! If that's not an excuse to buy more hardware, I don't know what is... Jan 6, 2019 VMware What Virtual Machines Am I Running? Almost all of the servers in my homelab run inside virtual machines, here are all of them (Subject to change, very quickly...) Everything runs under ESXi 6.7 and is managed by vCenter Server 6.7 via the appliance. I have two ESXi hosts, one at home and one which Jan 4, 2019 6 min read Homelab My All-in-one colocated ESXi server I have a 1u Supermicro server colocated in a datacenter. I mainly use it for DR, Backups and hosting services which need to be on 24/7/365. Those services include this very blog, and my Nextcloud instance among other things. The datacenter is only a 10 minute drive away Dec 30, 2018 8 min read"
