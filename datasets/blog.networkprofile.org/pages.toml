full_description = "Homelab 10G SFP+ Mellanox ConnectX-2 in Synology DS1817+ spookyghost Dec 31, 2018 • 1 min read This will be a short one, but there is almost no information out there about these cards in the Synology DS1817+As of Jan 2020, this still works fine. I am running 6.2.2 with no issueI wanted to get a cheap 10G SFP+ card for my DS1817+, and the Mellanox ConnectX-2 cards are only $15 on eBay, so I bought one. (Note: These also go under MNPA19-XTR)Install was easy as expected, see imagesI got some Cisco SFP+ DACs included with the cards, the model is the SFP-H10GB-CU3M So far, everything works as expected with no issue. I get full 10G on an iPerf test and the link speed is 10,000Mb/s in Synology DSM Lessons Learned - The 2024 Houston Derecho 2024 is not even over yet, but so we have already endured two massive storms that caused widespread destruction. This posts goes through the lessons I learned in the first of those 2 storms 2024 Houston Derecho On May 16th 2024, a Derecho hit the Houston area which had very Oct 27, 2024 7 min read Misc Projects and Updates This post is just some small updates to past projects, and some smaller projects that don't really warrant their own full post. Garage Compressed Air Setup Updates Original post: Garage Compressed Air SetupI find myself needing compressed air for nail and staple guns, filling up tires, blowing out Jan 17, 2024 15 min read Emporia EVSE Install At the end of last year we got an EV. This post details the install of an Emporia EVSE in my garage. It won't be very long, but it may give you an idea of how you might install yours. At first I was just charging it with Jan 16, 2024 6 min read"
