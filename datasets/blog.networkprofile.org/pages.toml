full_description = "Redundant M.2 SATA SSD's in pfSense Firewall spookyghost Dec 31, 2018 • 2 min read This will be a short one since I have moved on from this configurationA year or two ago I wanted to have redundant SSD's in pfSense, and I happened to find some very cheap 32GB Hynix M.s SATA SSD's. I bought an M.2 to SATA adapters and threw them in. I configured them with ZFS and put them in a GEOM Mirror within pfSenseHere you can see where I placed them in the system, and how I managed the cabling After a few months, one of the SSD's dropped out of the mirror, so I threw in a spare SSD I had laying aroundThe other small Hynix SSD ended up failing too, and I moved away from this setup. While I was investigating the problem with the SSD's dropping out of the mirror, I noticed that there was a LOT of data written to them, and they had already gotten half way to their TBW within a few months. It turns out pfSense is quite hard on SSD's, and these SSD's simply weren't durable enoughEventually I fixed the issue, and you can read about it on the latter part of my blog post here. Its a simple fix, and in my opinion should be the default configuration Overall I did like this setup, and if you follow the above links advise an enable RAMDisk, I can see this being a viable setup. There was no downtime when swapping out the SSD's and rebuilding the mirror Lessons Learned - The 2024 Houston Derecho 2024 is not even over yet, but so we have already endured two massive storms that caused widespread destruction. This posts goes through the lessons I learned in the first of those 2 storms 2024 Houston Derecho On May 16th 2024, a Derecho hit the Houston area which had very Oct 27, 2024 7 min read Misc Projects and Updates This post is just some small updates to past projects, and some smaller projects that don't really warrant their own full post. Garage Compressed Air Setup Updates Original post: Garage Compressed Air SetupI find myself needing compressed air for nail and staple guns, filling up tires, blowing out Jan 17, 2024 15 min read"
