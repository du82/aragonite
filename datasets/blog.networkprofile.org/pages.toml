["https://blog.networkprofile.org/cyberpower-ups-avoid"]
title = "Cyberpower UPS's - Try something else..."
description = """
This is now the fourth time I have come across these issues with a Cyberpower UPS. It means your UPS really isn't a UPS, so you may want to think twice about picking one up

First thing to keep in mind is that these are line interactive UPS's, that means"""
full_description = '''Cyberpower UPS's - Try something else... spookyghost Oct 6, 2020 • 3 min read This is now the fourth time I have come across these issues with a Cyberpower UPS. It means your UPS really isn't a UPS, so you may want to think twice about picking one upFirst thing to keep in mind is that these are line interactive UPS's, that means the input power isn't going through the batteries at all like with a double conversion UPS, but its just passing right through to your devices while maybe doing some minor filtering and surge protection. These devices simply do not need batteries in them to provide output powerIssue 1What happens is that the UPS will work fine, until it can no longer charge the batteries. When that happens, the UPS will both shut down output power (Even though the power from the wall is fine) and continue to try and charge the batteries while giving you an error code E24 that says "Internal Fault - CONTACT SUPPORT" in the manual If you do contact support, they tell you that the UPS needs to be replaced entirely. What it really means is that you have bad batteries, and for around $40 you can be back in business.They also claim that the reason it shutdown output power is for safety reasons, but then why does it try and charge the batteries still? Your guess is as good as mine. Even worse, when you turn the UPS off and take the batteries out, they are burning hot, because the UPS is trying its best to charge bad batteries.Issue 2The second issue with them is that when the batteries are clearly bad and cannot supply a load, but still give a nominal 12v charge, the UPS thinks its fine. Even if it fails the self test, it reports that is has succeeded.I have a small USB LED Light that probably doesn't even draw 1w. If I initiate a self test, the UPS just shuts off completely, and when powered back on, reports everything is great, and the software says the test passed. Awesome!Every other UPS I come across would fail the self test while NOT shutting down output power, and it would alert you that you need new batteries.Watch this video: In the end of the video you can see the UPS lost connection, but that doesn't even matter as the Cyberpower software marks the test complete before that even happens, as you can see in the screenshot I posted above the video.This issue is compounded by the fact that the UPS completely yet again turns itself off. That means if you had a PC plugged into the UPS, and another plugged into the wall and had a very minor power dip, the one directly in the wall would probably remain on, and the one plugged into the UPS would be turned off.Doesn't that defeat the entire point of a UPS? If you have one of these units, you need to be prepared that you will lose power unexpectedly at some point. The fact you can't test the batteries without losing power means that you will either need to shutdown your computer/servers/etc every 2 weeks and test, or just replace the batteries WELL ahead of schedule, say every 2 years just to avoid losing power.A better solution would be to toss the UPS, and get a better one I have found this issue in every single Cyberpower UPS I have ever used which is 4 units in the PFCLCD series and AVRLCD seriesJust avoid them entirely, and go with a different brand.'''
year_published = 2020
year_updated = 2020
clearnet = "https://blog.networkprofile.org/cyberpower-ups-avoid"
