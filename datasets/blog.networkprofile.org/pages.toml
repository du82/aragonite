["https://blog.networkprofile.org/gps-backed-local-ntp-server"]
title = "GPS Raspberry Pi NTP Server"
description = "This post details how to create a stratum-1 NTP Server using a Raspberry Pi utilizing GPS and PPS, and get time within 100 nanoseconds of real time, directly from the atomic clocks located in the GPS satellites above your head. The best part about this guide is that this will"
full_description = '''GPS Raspberry Pi NTP Server spookyghost Jul 10, 2023 • 24 min read This post details how to create a stratum-1 NTP Server using a Raspberry Pi utilizing GPS and PPS, and get time within 100 nanoseconds of real time, directly from the atomic clocks located in the GPS satellites above your head. The best part about this guide is that this will work with no internet. After initial setup, you could disconnect it from the internet and they would work. All of the other guides out there that I have found do not include the configuration necessary for this. The goal for this project for me was to limit my reliance on the internet for services. If the internet were to go out for a few weeks during a natural disaster, I don't want to have to worry about NTP not working. I also think its silly to get the time from a server across the internet, which eventually gets it from an atomic clock, when we can get it DIRECTLY from those clocks ourselves. Its also very cool to see an $11 piece of hardware get data from 12 GPS satellites that are over 12,000 miles above the earth. What a time to be alive!In this post I will also detail how to do this same thing with USB, instead of serial. The USB config might be something to play with if you don't have a Raspberry Pi or something with GPIO pins or you don't want to solder anything. The serial config on this guide will be specific to a Raspberry Pi, however the USB config applies to pretty much any linux computer. You will be less accurate with USB though, not that it matters much for a home network. Its much more fun doing the serial config though. I actually did the USB config first, just to see how things would work out, and then I moved to the Serial config.Inspiration, references, etc:I got this entire idea from these 2 blog posts. However I think they are missing some crucial information (For my use case, at least), and also rely on you watching the YouTube videos, which means there is more chance of the information going missing. Thanks Austin for putting all this great information together, there is no way I would have been able to build this without the blog posts and the videos. I highly suggest you also read these, as he does go into a lot of detail.Microsecond accurate NTP with a Raspberry Pi and PPS GPS - Austin’s Nerdy ThingsFor around $100, you can have a Stratum 1 NTP PPS GPS system providing microsecond time to all of your computers & equipment.Austin's Nerdy ThingsAustinMillisecond accurate Chrony NTP with a USB GPS for $12 USD - Austin’s Nerdy ThingsFor around $100, you can have a Stratum 1 NTP PPS GPS system providing microsecond time to all of your computers & equipment.Austin's Nerdy ThingsAustinI got a lot of information about auto starting gpsd on boot from heregpsd failing on boot, but starts manually - Raspberry Pi ForumsRaspberry PiFri Aug 23, 2013 4:06 pmAnd I spent way too many hours looking through the Chrony config pages, which now don't seem to go anywhere...https://chrony.tuxfamily.org/doc/devel/chrony.conf.htmlI also got some great tips and tricks on how to review the data from gpsmon from @t2mf on the DiscordMy interest in NTP and time started when I watched these Jeff Geerling videosNotes before we start:I am not a Raspberry Pi expert, an NTP expert, a Chrony expert, a GPS expert or even a Linux expert. There is likely some stuff in here that could be improved, and there may even be some things I'm not doing correctly. If you spot something, please get in contact with me! And if you follow this guide, do check back every now and then, as I will update the guide (I will note what I update)Hardware:You will need a computer. I made 2 servers, one with a Raspberry Pi 3 B+ and one with a Raspberry Pi 1B+. Even the Raspberry Pi 1B+ does fine, so if you have an old one sitting around, its PERFECT for this. If you plan on doing the USB config, then pretty much anything will work. Just make sure you have a solid network connection to your local network. There is no point setting all this up and then connecting over a slow wireless connection. Ideally your computer should have Ethernet. You will of course need everything to make your computer or Pi work, such as an SD card, power supply, case etc.a GT-U7 GPS module which costs between $10 and $13 USD (This guide is specific to the GT-U7)Amazon.com: GPS Module Receiver,Navigation Satellite Positioning NEO-6M (Arduino GPS, Drone Microcontroller, GPS Receiver) Compatible with 51 Microcontroller STM32 Arduino UNO R3 with Antenna High Sensitivity : ElectronicsAmazon.com: GPS Module Receiver,Navigation Satellite Positioning NEO-6M (Arduino GPS, Drone Microcontroller, GPS Receiver) Compatible with 51 Microcontroller STM32 Arduino UNO R3 with Antenna High Sensitivity : ElectronicsBrand Deegoo-FPVIf you are doing USB connection, a GOOD Micro USB cable. I went through about 5 to get one that actually functioned well for data, as it seems most are designed for charging. If you plan on doing the Serial/PPS config (The best one) then you don't need a USB cable.If you are doing the serial config, some GPIO cables like this, you need 5 cables, so this will give you a ton spare after. I did find these were a little bit long, so you could go a bit shorter. All you need is the female-femaleAmazon.com: ELEGOO 120pcs Multicolored Dupont Wire 40pin Male to Female, 40pin Male to Male, 40pin Female to Female Breadboard Jumper Ribbon Cables Kit Compatible with Arduino Projects : ElectronicsAmazon.com: ELEGOO 120pcs Multicolored Dupont Wire 40pin Male to Female, 40pin Male to Male, 40pin Female to Female Breadboard Jumper Ribbon Cables Kit Compatible with Arduino Projects : Electronics<img alt="ELEGOO UNO R3 Board ATmega328P with USB Cable(Arduino-Compatible) for Arduino" src="https://m.media-amazon.com/images/I/51cL9RbLssL.__AC_SR166,182___.jpg"/>Optionally, a better GPS Antenna. I got okay results with the stock one for initial setup, but once I went to place it somewhere my signal was poor. I got this, which works great and has a magnetic base, so you can just stick it wherever you need. Its an SMA connection for the antenna, but it includes the IPEX to SMA adapter.Amazon.com: Bingfu Waterproof Active GPS Navigation Antenna Adhesive Mount SMA Male GPS Antenna with 15cm 6 inch U.FL IPX IPEX to SMA Female RG178 Coaxial Pigtail Cable for GPS Module Receiver Tracking : ElectronicsAmazon.com: Bingfu Waterproof Active GPS Navigation Antenna Adhesive Mount SMA Male GPS Antenna with 15cm 6 inch U.FL IPX IPEX to SMA Female RG178 Coaxial Pigtail Cable for GPS Module Receiver Tracking : Electronics<img alt="Bingfu 4G LTE Outdoor Wall Mount Waterproof Antenna SMA Male Antenna Compatible with Verizon AT&amp;T..." src="https://m.media-amazon.com/images/I/41WyzQTLiJL.__AC_SR166,182___.jpg"/>Now you know what we are doing and what you need, lets get going. This setup assumes you are using a Raspberry Pi. If you are using something else, you may need to adjust the configuration.Step 0: Initial ConfigI'm calling this step zero, because its really up to you. Get your Pi in order with Raspbian or whatever OS you are using, connect it to the network, call it what you want, etc and then follow along. We will be configuring this completely via terminal.Step 1: BackupsThe very first thing that I am going to do is configure my Raspberry to have weekly backups. These 2 servers will critical to my network, so I suggest you do the same. It also means you can easily go back a step if you mess something up (Perhaps during initial config do hourly backups?)I made a whole post on that, so I'll leave it hereBackup a running Raspberry Pi over the networkFor the longest time I’ve been looking for a way to backup my Raspberry Pi’s over to the network, to an easy to restore format. But every solution I’ve looked at has come up short. This post details a solution that works very well. Best of all, it makes incrementalNetworkProfile.orgSpookyGhostStep 2: SoftwareYou'll need to make sure your Pi is up to date and has the required packages installedsudo apt update sudo apt upgrade -y sudo apt install gpsd gpsd-clients pps-tools chrony jq tcpdump -y I also found there was some software I didn't need that was using up resources, so I removed them, This step is completely optionalsudo apt purge --remove lxde*; sudo apt autoremove -y sudo apt-get remove --auto-remove lxpanel sudo apt-get purge avahi-daemonStep 3: Initial preparationThe first thing we want to do is enable the Serial Port on your Raspberry Pi. Enter the raspi-config by doingsudo raspi-configand you should see this screen. Go down to number 3, interface optionsFrom there, Serial Portwhen it asks if you want a shell login over serial, select NoAnd then select YES to enable the serial portNow use Tab to get to Finish, and reboot if it prompts you to.Next we can configure the GPIO pin for PPS, and add the PPS module. If you are using USB you can skip this, but it won't hurt to do it anyway if you plan on perhaps upgrading to that setup down the line.sudo bash -c "echo '# the next 3 lines are for GPS PPS signals' >> /boot/firmware/config.txt" sudo bash -c "echo 'dtoverlay=pps-gpio,gpiopin=18' >> /boot/firmware/config.txt" sudo bash -c "echo 'enable_uart=1' >> /boot/firmware/config.txt" sudo bash -c "echo 'init_uart_baud=57600' >> /boot/firmware/config.txt"If you are running an older version of Raspbian, the config.txt is in a different place, so run the followingsudo bash -c "echo '# the next 3 lines are for GPS PPS signals' >> /boot/config.txt" sudo bash -c "echo 'dtoverlay=pps-gpio,gpiopin=18' >> /boot/config.txt" sudo bash -c "echo 'enable_uart=1' >> /boot/config.txt" sudo bash -c "echo 'init_uart_baud=57600' >> /boot/config.txt"Note that the baud rate here is quite high, as this GPS module supports it. If you are following this guide with a different GPS module, try 9600Now we can add the PPS module (Also skip if using USB)sudo bash -c "echo 'pps-gpio' >> /etc/modules"Now your Pi is ready to physically connect the GPS module, which we will cover in the next step.Step 4: Hardware ConfigurationNow you can connect your GPS module to the Pi. If you are using USB, just plug it in. If you are using serial, you will have to solder the header to the GPS module, and then plug it into the Pi GPIO pins. It doesn't matter if you solder the connector on with the tall pins at the top of the module or the bottom, just do what works for you. I did it so the tall pins were on the side with the LED, so I could lay it flat on a table while testing. Make sure to turn the Pi off while plugging into the GPIO. You can shut down your pi withsudo shutdown -h nowI will use this as a reference for the pinout to connect the wiresV-IN GPS —> RPi Pin 4GROUND GPS —> RPi Pin 6RX GPS —>RPi Pin 8TX GPS —>RPi Pin 10PPS GPS —>RPi Pin 12As you can tell, they are all in a line which makes it easyAlso make sure to connect the antennaUSB is of course very easy to connectGo ahead and turn your Pi on. Note that I tried to tape the antenna directly on top of the PCB to make all in one type package, and it did not work. There is some kind of interference that completely stops the GPS lock.Step 5: Initial Config and TuningNow we have all the pre-requisites setup and the hardware connected, we can start testing and configuring things.If you have connected via serial, you can check for PPS pulses to see if the PPS config is correct by doingsudo ppstest /dev/pps0You should see an output like this. Do Control + C to exit outtrying PPS source "/dev/pps0" found PPS source "/dev/pps0" ok, found 1 source(s), now start fetching data... source 0 - assert 1689037624.000000607, sequence: 19592 - clear 0.000000000, sequence: 0 source 0 - assert 1689037625.000001413, sequence: 19593 - clear 0.000000000, sequence: 0 source 0 - assert 1689037625.999999218, sequence: 19594 - clear 0.000000000, sequence: 0 source 0 - assert 1689037627.000001023, sequence: 19595 - clear 0.000000000, sequence: 0 source 0 - assert 1689037627.999999829, sequence: 19596 - clear 0.000000000, sequence: 0 source 0 - assert 1689037629.000000634, sequence: 19597 - clear 0.000000000, sequence: 0 source 0 - assert 1689037630.000000440, sequence: 19598 - clear 0.000000000, sequence: 0Now we need to edit the gpsd configuration file, this applies to USB and Serial configurations. sudo nano /etc/default/gpsdIf you are using USB, this is all you need in the config fileSTART_DAEMON="true" USBAUTO="true" # this could also be /dev/ttyUSB0, it is ACM0 on raspberry pi DEVICES="/dev/ttyACM0" GPSD_OPTIONS="-n"For Serial, on my Raspberry Pi 3 this is the configSTART_DAEMON="true" USBAUTO="true" DEVICES="/dev/ttyS0 /dev/pps0" GPSD_OPTIONS="-n"But, I did notice that on my Pi 1, the Serial Port name was different, it was ttyAMA0. So my config looked like thisSTART_DAEMON="true" USBAUTO="true" DEVICES="/dev/ttyAMA0 /dev/pps0" GPSD_OPTIONS="-n" If you are usure, you can go to /dev/ and list the output, and get a clue. Trial and error is your friend here, you won't break anything. You can see below here that serial0 is mapped to ttyAMA0, which is where I got that device name from.cd /dev/ ls -al ~snip~ brw-rw---- 1 root disk 1, 8 Jul 10 14:35 ram8 brw-rw---- 1 root disk 1, 9 Jul 10 14:35 ram9 crw-rw-rw- 1 root root 1, 8 Jul 10 14:35 random crw-rw-r-- 1 root netdev 10, 242 Jul 10 14:36 rfkill lrwxrwxrwx 1 root root 7 Jul 10 14:35 serial0 -> ttyAMA0 drwxrwxrwt 2 root root 40 May 13 05:36 shm drwxr-xr-x 3 root root 180 Jul 10 14:36 snd lrwxrwxrwx 1 root root 15 May 13 05:36 stderr -> /proc/self/fd/2 lrwxrwxrwx 1 root root 15 May 13 05:36 stdin -> /proc/self/fd/0 lrwxrwxrwx 1 root root 15 May 13 05:36 stdout -> /proc/self/fd/1 crw-rw-rw- 1 root tty 5, 0 Jul 10 14:36 tty crw--w---- 1 root tty 4, 0 Jul 10 14:36 tty0Once you have your config in place, execute the below command to make gpsd start on bootsudo ln -s /lib/systemd/system/gpsd.service /etc/systemd/system/multi-user.target.wants/Now go ahead and reboot. When it comes back, launch gpsmon and you should see the outputgpsmonIf you don't see the above, you may need to adjust your serial name, or the connection is wrong. If you are connected via USB, you won't see PPS. Your PPS offset will likely be MUCH higher than mine, as you've not yet tuned the system time which we will do later.Note that it requires 4 satellites to get accurate time (Source below)The Global Positioning System: Global Positioning TutorialUsing the Global Positioning System (GPS), every point on Earth can be given its own unique address -- its latitude, longitude, and height. The U.S. Department of Defense developed GPS satellites as a strategic system in 1978. But now, anyone can gather data from them. For instance, many new cars ha…National Ocean Service National Oceanic and Atmospheric AdministrationIf you have got to this point, you now have your GPS module connected to the Pi, and should notice the LED light blinking every second. If you ever notice it go off, or not blink every second, its bec'''
