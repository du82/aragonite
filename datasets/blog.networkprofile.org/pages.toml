["https://blog.networkprofile.org/my-home-network-complete-details-2023"]
title = "My Overkill Home Network - Complete Details 2023"
description = """
In this post I will hopefully detail my entire home network. Some of this has been in separate posts explaining single items, but nowhere do I have all of the network in one post with all the changes since last year.

Here is a full shot of the rack in"""
full_description = '''My Overkill Home Network - Complete Details 2023 spookyghost Aug 10, 2023 • 22 min read In this post I will hopefully detail my entire home network. Some of this has been in separate posts explaining single items, but nowhere do I have all of the network in one post with all the changes since last year.Here is a full shot of the rack in my house. Its in a centrally located closet which happens to have a 2ft x 2ft chase into the attic, which is very handy for running network cables. The rack itself is the 25u adjustable StarTech Rack which I've been quite pleased with.Starting at the top we have all of the networking gear and patch panels.At the very top are 2 x Monoprice keystone patch panels. They are mostly filled with Cat6 keystone jacks, but I also have a few LC-LC Keystone jacks for long fiber runs. All of these connections end up somewhere else in the house, either to cameras, AP's or to network jacks etc. Keystone patch panels are clearly the best, a you can easily add and remove jacks without moving the entire patch panel and possibly breaking other connections.This is a generic 1u cable management device off of Amazon, which does a pretty good job along with these Monoprice SlimRun Cat6a cables I am using.Below the patch panels is a 1u Supermicro Server running PFSENSEIt has an Intel Pentium Gold G5500, 8GB of ECC RAM, Quad onboard Intel NIC's and a Mellonox Connect-X3 10Gb NIC for LAN + VLANS's. More details in this postUpdated Low Power PFSENSE Build for Gigabit FiberSince moving into a house I now pay for power, so I wanted to upgrade my PFSENSE box while at the same time saving power I also got gigabit fiber, so it needed to be able to handle that. This is the updated 2020 build of my pfSense Firewall. INetworkProfile.orgspookyghostAround the back you can see the connections for my redundant internet. Ignore where it says T-Mobile, that should say Verizon!I am using a 10Gb connection for the LAN and VLAN's because I do inter-VLAN routing on the firewall, so having that extra bandwidth helps. Also because my Internet is 1Gb symmetrical, it was very easy to saturate the 1Gb Link back to the switch.Here is the Verizon Gateway sitting on top of the rack. I get pretty good signal here and get the rated speed, of around 300Mb/s down and 20Mb/s up. This costs $50/mo with no contract and no data cap, and serves as a backup to my main AT&T Fiber connection.Here is the AT&T Fiber ONT, on the other side of the room. This is 1Gb symmetrical with no cap.Both connections are in a Gateway Group in PFSENSE, so I always use the AT&T Fiber, until there is an outageThe AT&T connection is in passthrough mode so I can do inbound connections, however the Verizon connection is not. I found that the IP changes very often, and PFSENSE can sometimes get hung up on that, and cause the connection to not work. So I left it in its default configuration which gives PFSENSE an internal IP. Inbound connections are not important on the Verizon connection, however I do still need inbound remote access VPN to work, as well as a connection for some security devices.For that to work, I have a site-to-site Wireguard VPN setup to a VPS in Linode. Because my local PFSENSE box is the client, and the VPS is the server, I essentially bypass any NAT. This is very useful if you are stuck with an internet connection with CGNAT. On the VPS, I just have forwarding enabled so I can access my local network, and then I have NGINX Proxy Manager forwarding specific ports all the way through to my home network. This means I use the same IP or DNS record to get into my network no matter what goes on at home, as the tunnel just uses whatever gateway PFSENSE tells it to.This is also how you are probably getting to this blog, which is hosted at home. More details hereMoving my Blog off of Linode and back Home (Sort of)At the end of 2021, I moved my blog into Linode. The main goal for this was to keep it up in case of disaster or outage at home, and utilize the much better networking of Linode. Here is the post: Moving my Blog from Home to LinodeA while agoNetworkProfile.orgspookyghostYou can read more about the 5G setup hereRedundant WAN - Ditching T-Mobile 5G for Verizon 5GIf you’ve been reading recent articles, you will know I got T-Mobile 5G Home internet as a secondary WAN connection. It is fantastic knowing I should always have internet. My main connection is AT&T Fiber 1Gb/1Gb, but I like having a secondary connection. It started out GREAT. ForNetworkProfile.orgspookyghostBelow the firewall is my main 1Gb Switch. This is a Dell X1052P which handles the majority of the 1Gb connections in my house, and also all of the PoE in the house. This switch Does PoE and PoE+. I am using that to power AP's, some small network devices and a lot of IP cams.All of the blue connections are the IP Cameras on the house, connected in their own VLAN (I have more connected to the garage, coming up later)This witch has a 20Gb LACP trunk that connects back to my main 10Gb Switch. I am using Cisco DAC's for this for no other reason than I ran out of spare transceivers when I setup the connection.Overall the Dell X1052P is a nice switch in that it has 4 x 10Gb connections, PoE+, sliding rails, good quality fans etc, however the software is TERRIBLE. There is no way to configure via CLI, and the Web interface is the worst I have ever used.Under that switch is a Cisco SG300-28 switch. This switch is here simply because I started running out of 1Gb connections on the Dell X1052P. I have a bunch of low bandwidth things connected here, such as IPMI for servers, Printers, etc. This is connected to the Dell switch with a single 1Gb connection. On this switch I also have the second port of the Verizon Gateway connected on a separate VLAN. This lets me connect a device DIRECTLY to the Verizon internet, bypassing PFSENSE. This is useful for a Ripe Atlas network probe that we will get to later, and makes troubleshooting very easy. Its also good for testing external connections, as it completely takes my internal DNS and firewall rules out of the question.Below the SG300 is my favorite switch, the Cisco SX350-24F. This is a 24 Port 10Gb SFP+ switch, with 4 of the ports being combo ports for copper. This is my "Main" switch.This switch connects everything that needs 10Gb. There is Dual 10GB connections to my NAS, one of my ESXi server, single 10Gb connections to mine and my wife's desktop PC, the Firewall uplink, the 10Gb connection back to my garage rack and the 20GB LACP trunk to the Dell switch. I am also using some WiiTek Tranceivers to get 2.5Gb connections to my HTPC. Even though the switch only support 1Gb and 10GB, the Transceiver figures out the rest to let you have Multigig support. You can see that connection here on the far right.Below the networking are 2 shelves, one with lower power devices, and below that my three VMware ESXi hosts.Starting on the top row we have the followingHubitat HubRaspberry Pi 3B+ NTP server with GPS/PPS time sourceA new Ripe Atlas Probe connected directly to the Verizon ConnectionAnother Raspberry Pi, this time a Pi W Zero with adapter board, also running NTP with GPSAn older Ripe Atlas Probe connected to the AT&T ConnectionThe Hubitat hub has now almost entirely been replaced by a HomeAssistant virtual machine. The only reason it is here is to connect the Z-Wave and Zigbee devices I have. However, I replace those devices with WiFi versions wherever possible. In general, I'm not a huge fan of the Hubitat Hub anymore, and I've had quite a few problems with it. Its configured to just pass the devices into HomeAssitant, so its just a radio at this point. The devices that I still need it for are important though, like Smoke Detectors and leak detectors.The Ripe Atlas Probes are very cool, and generally just help the internet in general. Here is their website with more informationRIPE Atlas docs | What is RIPE Atlas? | DocsRIPE Atlas DocsDocsThe NTP servers I have made an entire guide on, which you can read here. They give all the devices on my network super accurate time, even if there is no internet. I have one connected to the Dell Switch, and one to the Cisco switch. GPS Raspberry Pi NTP ServerThis post details how to create a stratum-1 NTP Server using a Raspberry Pi utilizing GPS and PPS, and get time within 100 nanoseconds of real time, directly from the atomic clocks located in the GPS satellites above your head. The best part about this guide is that this willNetworkProfile.orgspookyghostAnd if you were wondering how I have a Pi Zero with ethernet, you can read about that alsoTurn a Raspberry Pi Zero into a full Raspberry Pi with EthernetI needed another Raspberry Pi for a project, but with the limited availability I couldn’t find one. The project doesn’t need a very fast CPU, but it must have ethernet. I have an old Raspberry Pi Zero W, but being limited to wireless is a real problem. I also needNetworkProfile.orgspookyghostI have however put them in new cases, the HighPi Pro. These have plenty of space to fit the GPS modules.Here you can see the antenna connection on the sideI just drilled a hole the same size as the connector and connected it. I put some hot glue on the back to stop it rotating when tightening alsoFor the Pi Zero and the other Pi's, I just used some generic standoffs to fit the GPS modules to a mounting hole where I couldThe Pi Zero build has the wires soldered directly to the module saving spaceBut even the ones with the large connector cables fits wellThe GPS antennas I am using are magnetic, so they just stick on top of the rack.Almost everything on that top shelf including the Pi's are powered by this Anker USB power supply that I have had for years. https://www.amazon.com/gp/product/B00P936188/There is one Pi on the shelf below, and that is an early TinyPilot device to give my NVR Machine remote access. Its a Raspberry Pi 4 with a custom USB interface and HDMI capture, so you can get BIOS level control of the machine. This is needed as my NVR Server (We'll get to that) does not have any remote management. Moving over is the start of the VMware ESXi hosts. All are running ESXi 7.0 U3, as I have not yet made the jump to 8.0. The Move from 6.7 to 7.0 was full of bugs, so I am going to stick on 7.0 U3 for a while. I will detail all of the VM's I am running in another post as its quite extensive, however here is a quick list of services they hostVeeam Backup, Borg Backup, Arq Backup, HomeAssistant, HomeBridge, NGINX Proxy Manager, vCenter, Rekor Scout/OpenALPR, Grafana, InfluxDB, LibreNMS, General use VDI VM's, Test VM's, Windows Domain Lab, Portainer, Kiwix, NextCloud, Mealie, Navidrone, Solarr, PLEX, public SFTP Server, Netbox, qBitTorrent, Prowlarr, This blog, and a few other services.The first is an ASUS PN50 with 64GB of DDR4, 2TB NVMe storage and an AMD Ryzen 4800U which has 8 cores and 16 threads. This is really a beast of a CPU for such a small box, and it handles all of the compute heavy VM's on my network that don't need fast networking. The main issue with this host is that the onboard NIC is not supported in ESXi, so I have a 1Gb Intel M.2 NIC sticking out the back. I tried to get a 2.5Gb NIC working, however I never could. To the left are my 2 Lenovo ESXi hosts. The bottom is an old M73 Tiny with just 16GB of RAM (The max it will take) and an old i5-4750T and a 1TB SATA SSD. This host handles some light VM's, however it needs to be replaced, as the NIC will no longer be supported by VMware in 8.0Above is the Lenovo M720q Tiny, which has an i7-8700T, 64GB RAM, 2TB NVMe Disk, and best of all, an Intel X520 Dual 10GB NIC in the PCI-E Slot. This host handles all of the network heavy VM's. This is what I should have got instead of the Asus PN50.Here is a shot of the NIC. Its a standard PCI-E NIC, with the IO cover removed. I put some Kapton tape on the NIC to make sure it doesn't touch anything it shouldn't. As you can expect a full size NIC in a system this small is quite a squeeze. Overall this small system has 21Gb/s of total bandwidth available to the network once you factor in the built in 1Gb NIC.Below this we have 3 x 2u Supermicro chassis. The top used to my ESXi server, however now is just a disk shelf. This disk shelf contains 12 x 8TB SAS disks that are my main media storage and connects back to my NAS below it. Nothing important is stored on here, and its in a big RAIDZ2 array.You can see here that the control lights are not lit, and the power button doesn't even do anything.The IO shield is just a blankAnd other than power cables, the only things connected are these Mini SAS SFF-8088 cables that run down to my TrueNAS box.To get the system to power on, I just jumpered the PSU connector with a paperclip and taped it in place. Power control is not important, as this will all stay on 24/7/365. There is a better way to do it, which is to get a Supermicro JBOD control board like the SuperMicro CSE-PTJBOD-CB2. However at the time of deploying this system, they were out of stock EVERYWHERE. Even now, they seem to only be available from China. So I just skipped it.Below the JBOD is an almost identical Supermicro Chassis, but this one is my NAS. It runs TrueNAS on a Xeon E3-1270 V5, 64GB ECC RAM, a dual port 25Gb NIC and a few HBA's, here are the full specsFor storage, the LSI 9207-8e (e for external) is connected to the 12 x 8TB SAS disks. The LSI 9300 is connected to 6 x 4TB SAS disks in striped mirrors for my important data. There is also 2 x Intel S3700 DC 800GB Enterprise SSD's for Metadata storage (Also called a Fusion Pool)Since building it, its been completely stable, and I wouldn't change much about the build. Sadly I don't have many pictures of the inside, as its so important to my network I can't power it off to get some nice pictures!You can read more about my storage config in this post. Nothing much has changed other than the replication destination. It now replicates to another NAS in the garage.My Data Backup Plan - 2021This post will detail how I am protecting my important data. The old post can be found here: My Backup Plan & Lessons learnedI’ve posted about my backup plan before, but a lot of things have changed, and Ihave learned a lot about what works, and what doesn’t workNetworkProfile.orgspookyghostBelow that server is my Blue Iris NVR running in an 8-bay Supermicro chassis. This has an i7 8700K, 16GB of DDR4, an NVIDIA Tesla P4 (For AI) and an LSI 9207-8i for the storage disks. I have around 48TB of storage for recording, and it does local AI to alert me to people walking on my property etc. Networking is handled by an Intel i350-T4 quad port gigabit NIC, with one port on the LAN, and one on the CCTV VLAN. This lets the server access the cameras directly, as the CCTV VLAN is completely firewalled off from everything and the internet.This is the server that I use the TinyPilot for, as its a consumer board, it has no remote management.Below that is my PDU's and my UPS. The PDU's are CyberPow'''
