["https://blog.networkprofile.org/monitoring-generac-generator-with-raspberry-pi-and-om3-fiber"]
title = "Monitoring 27kw Generac Generator with Raspberry Pi and Multimode Fiber"
description = """
A while ago I got a Generac RG027 Liquid Cooled Generator. It runs on a 2.4l Mitsubishi engine running at 1800RPM.

The Generac Monitoring sucks, so I installed Genmon. An open source generator monitoring solution on a Raspberry Pi 4

GitHub - jgyates/genmon: Generac Generator Monitoring using a"""
full_description = "Monitoring 27kw Generac Generator with Raspberry Pi and Multimode Fiber spookyghost Dec 4, 2021 • 6 min read A while ago I got a Generac RG027 Liquid Cooled Generator. It runs on a 2.4l Mitsubishi engine running at 1800RPM. The Generac Monitoring sucks, so I installed Genmon. An open source generator monitoring solution on a Raspberry Pi 4GitHub - jgyates/genmon: Generac Generator Monitoring using a Raspberry Pi and WiFiGenerac Generator Monitoring using a Raspberry Pi and WiFi - GitHub - jgyates/genmon: Generac Generator Monitoring using a Raspberry Pi and WiFiGitHubjgyatesRaspberry Pi Parts listRaspberry Pi 4 - 4GB RAMSamsung PRO Endurance 64GB MicroSD CardHighPi Clear CasePintSize.Me Generator Hat with 1 Meter cable (Link)I got the Genmon software installed and tested out the Pi for a few daysThen I got to the install. First I installed it with Cat6. I used trueCABLE Cat6 Direct Burial CMX Cable (Link)I happened to have a spool of the cable free, so I decided to use itYou can see that I have some Sealtight conduit already there. Before the generator installer finished filling the trench, I snuck it inIt don't have to go too far, you can see the garage on the left where I am going toIt was a real pain getting the cable to push through, so I used whatever lube I had on hand. It worked great!Here is where it enters the garage. I just used an electrical box, and drilled a 5/16 hole through the wallAnd here is how the conduit connects to the generatorInside the garage the cable goes up the wallAnd then into my garage rack (Ignore the dust...)Now that the networking is done, on to the Genmon installIt was a real pain to get the cable into the back of the controller. I had to remove the front panel, and then unscrew the controllerI then unplugged the MobileLink module, and plugged in the cable I got with the Generator hatI attached the Pi with double sided Velcro, and terminated the ethernet with an RJ45. It gets power via a USB-C PoE Splitter (Link)The connector looks bent, but its very strong. Its just how the hat is madeI also attached the PoE Splitter with velcroIt worked right away, no problems at all. I got my laptop out to testHere are some screenshotsOne of the main features I wanted this for is below, the enhanced exercise which actually transfers load to the generatorThat would be the end of this post, but I kept reading articles and watching videos about people having nearby lightning strikes which ended up travelling through ethernet cable, and destroying their whole network. An example is this The 8-Bit Guy video. At 6:00 he is talking about itI don't really care if my Cisco switch gets killed, but I am very concerned that the Raspberry Pi could get fried, and then kill the generator controller. Since I had a bunch of fiber laying around, I figured I would swap the Cat6 to OM3 Multimode fiber. Here is the updated parts list! I need power too now since I won't be using PoEFS.com Media Converter (Link)2 x 1Gb SFP Transceivers (Link)2m OM3 Patch Cable (Link)30m OM3 Patch Cable (Link)LC to LC Keystone Jack (Link)NOCO GC018 12-Volt Adapter Plug Socket with Eyelet Battery Terminals (Link)24w Anker USB Car Charger (Link)USB Barrel Cable (To power Media Converter from USB) (Link)I tested everything out to make sure it worked with a spare Raspberry Pi. The Media converter works great powered via USBNow I know it all works, time to install itI used the same orange split-loom conduit as my other fiberHere is the media converter mounted also with velcroSince there now is no PoE, I need to tap the battery for powerAnd here is the USB Charger mounted in the generator, with the USB cables going through a gapYou may wonder why the USB Charger is not installed on the other side near the Pi. The reason is that the front of the generator takes 6 bolts to remove, and its a lot of work. To get to the engine compartment of the generator where the USB charger is, its just a side panel that unclips. So if the Pi ever locks up, I can power cycle it by unplugging it hereThats all! Hopefully I don't touch this for a whileEDIT: I touched it and ran dedicated UPS power for Genmon, read all about it belowGenerac Maintenance, Oil Report and more Genmon ChangesI could roll this into more than one post, but I’m not sure at what point there is too many generator posts. This post will go over some changes to Genmon (The FINAL CHANGES!) and some notes on maintenance, and the Blackstone Labs Oil Report. First, Genmon. I think I’veNetworkProfile.orgSpookyGhost"
