I have never owned any Z-Wave devices before as I never had the need, but I wanted to know if my smoke alarms were going off, and I didn't want to spend"""
full_description = '''First Alert Z-Wave Smoke/CO Detectors with Hubitat spookyghost Jan 19, 2020 • 2 min read I recently bought a home, and it had no smoke detectors. Here is what I ended up withI have never owned any Z-Wave devices before as I never had the need, but I wanted to know if my smoke alarms were going off, and I didn't want to spend $200 each on the Nest alarms. Its just another "smart" thing to go wrongI ended up purchasing a three pack of First Alert Smoke and Carbon Monoxide alarms for just $100 shipped. I purchased them from Costco because it was the cheapest, and they have the best return policyI threw the Hubitat in my rack, but I wasn't sure if all of the metal would cause an issue for range. It didn't Getting them connected was easy, insert batteries into the tray and don't close it. Do a Z-Wave inclusion scan and then hold down the test button while pushing in the battery tray. Keep holding it for 5 to 10 seconds and they show up. Once they were paired I mounted them throughout my homeOnce I did that, I configured HubitatHere you can see them listedI installed the Habitat Safety monitor app and set it to use all detectors, and to give my devices a push notification if they go offI lit some paper on fire and blew it out and tested one of the alarms. I instantly got a notification to all of my devices which showed it was working wellI also setup a dashboard so I could view the status of the alarms when awayThere isn't much more to it, they just workIf you are looking for new smoke alarms, I would skip the Nest alarms and just get these. They work great Lessons Learned - The 2024 Houston Derecho 2024 is not even over yet, but so we have already endured two massive storms that caused widespread destruction. This posts goes through the lessons I learned in the first of those 2 storms 2024 Houston Derecho On May 16th 2024, a Derecho hit the Houston area which had very Oct 27, 2024 7 min read Misc Projects and Updates This post is just some small updates to past projects, and some smaller projects that don't really warrant their own full post. Garage Compressed Air Setup Updates Original post: Garage Compressed Air SetupI find myself needing compressed air for nail and staple guns, filling up tires, blowing out Jan 17, 2024 15 min read'''
