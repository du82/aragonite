full_description = "Homelab 9 Year Homelab history in pictures Since 2012 I have been interested in servers and networking, and started running them at home. Here is a history of changes over the years I don't have full explanations of everything, but ill try to mention things as I go. You will have to excuse the poor Sep 17, 2020 10 min read Hosting Traefik Reverse-Proxy Setup with Let's Encrypt in Docker I am using Traefik together with Let's Encrypt to have automatic reverse proxy setup with valid SSL certs for my Docker containers. Here is how I set it up First, make sure that port 80 and 443 are not being used by any other containers on your Docker Jan 9, 2019 3 min read VMware What Virtual Machines Am I Running? Almost all of the servers in my homelab run inside virtual machines, here are all of them (Subject to change, very quickly...) Everything runs under ESXi 6.7 and is managed by vCenter Server 6.7 via the appliance. I have two ESXi hosts, one at home and one which Jan 4, 2019 6 min read Homelab Homelab power upgrade I recently upgraded the UPS equipment in my lab. I moved from a single APC SMT1000RM2U and added a SMX1500RM2U and another one of the CyberPower PDU15M2F10R PDU's This brings the setup to the following: UPS01 - SMT1000RM2U with APC AP9631 Network Card UPS02 - SMX1500RM2U with APC Jan 4, 2019 1 min read Homelab 10G SFP+ Mellanox ConnectX-2 in Synology DS1817+ This will be a short one, but there is almost no information out there about these cards in the Synology DS1817+ As of Jan 2020, this still works fine. I am running 6.2.2 with no issue I wanted to get a cheap 10G SFP+ card for my DS1817+ Dec 31, 2018 1 min read Homelab My All-in-one colocated ESXi server I have a 1u Supermicro server colocated in a datacenter. I mainly use it for DR, Backups and hosting services which need to be on 24/7/365. Those services include this very blog, and my Nextcloud instance among other things. The datacenter is only a 10 minute drive away Dec 30, 2018 8 min