full_description = "Watchdog 15-P PoE Powered server closet environmental monitoring spookyghost Feb 25, 2020 • 2 min read I knew my server closet was too warm, but I new knew just how warm it was. I got a Geist/Vertiv Watchdog 15-P environmental monitor that does temperature, humidity and dew point and is powered by PoEThe device gives you a Web UI to view charts, sends the information via SNMP and can give you email alerts I got it used for $90 from an eBay seller called mntechnology, I used some cable management from Amazon and a Monoprice Slimrun Ca6a cable I ran the cable around to the back of the rackI decided to mount it in front of my rack, near the top which should give the worst case scinario for tempratures. The next part of this project will be installing an intake and exaust fan into the closet which should get things under control. As you can see, its quite hot in the room. The max it gets is around 98You can set detailed alerts to go out via SMS or E-MailThis is a super easy, great device that just works. I would have no issues purchasing againThanks for reading Lessons Learned - The 2024 Houston Derecho 2024 is not even over yet, but so we have already endured two massive storms that caused widespread destruction. This posts goes through the lessons I learned in the first of those 2 storms 2024 Houston Derecho On May 16th 2024, a Derecho hit the Houston area which had very Oct 27, 2024 7 min read Misc Projects and Updates This post is just some small updates to past projects, and some smaller projects that don't really warrant their own full post. Garage Compressed Air Setup Updates Original post: Garage Compressed Air SetupI find myself needing compressed air for nail and staple guns, filling up tires, blowing out Jan 17, 2024 15 min read Emporia EVSE Install At the end of last year we got an EV. This post details the install of an Emporia EVSE in my garage. It won't be very long, but it may give you an idea of how you might install yours. At first I was just charging it with Jan 16, 2024 6 min read"
