I also got gigabit fiber, so it needed to be able to handle that. This is the updated 2020 build of my pfSense Firewall.

I"""
full_description = "Updated Low Power PFSENSE Build for Gigabit Fiber spookyghost Jan 22, 2020 • 2 min read Since moving into a house I now pay for power, so I wanted to upgrade my PFSENSE box while at the same time saving powerI also got gigabit fiber, so it needed to be able to handle that. This is the updated 2020 build of my pfSense Firewall.I started out with the same chassis and PSU and SSD from my old build which can be found here: https://blog.networkprofile.org/my-overkill-1u-pfsense-build/I swapped the old board for a Supermicro X11SCL-LN4F which cost $230 shipped, it has Quad intel gigabit LAN which I need 3 of for my AT&T Fiber setup to bypass the crappy gatewayFor the CPU I went for the Intel Pentium Gold G5500, this CPU uses almost no power but has plenty of powerI added 2 x 4GB sticks of DDR4 Unbuffered ECC RAM. I chose the cheapest RAM I could find in a 2 stick configuration so I could retain dual channelHere are some pictures of the completed build. The IO Shield could not be changed, so I just hacked it out with a dremel. Ill clean it up better in the future, but it works...And best of all, it handles my gigabit connection with no problemI am super happy with this setup Lessons Learned - The 2024 Houston Derecho 2024 is not even over yet, but so we have already endured two massive storms that caused widespread destruction. This posts goes through the lessons I learned in the first of those 2 storms 2024 Houston Derecho On May 16th 2024, a Derecho hit the Houston area which had very Oct 27, 2024 7 min read Misc Projects and Updates This post is just some small updates to past projects, and some smaller projects that don't really warrant their own full post. Garage Compressed Air Setup Updates Original post: Garage Compressed Air SetupI find myself needing compressed air for nail and staple guns, filling up tires, blowing out Jan 17, 2024 15 min read Emporia EVSE Install At the end of last year we got an EV. This post details the install of an Emporia EVSE in my garage. It won't be very long, but it may give you an idea of how you might install yours. At first I was just charging it with Jan 16, 2024 6 min read"
