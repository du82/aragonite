["https://blog.networkprofile.org/vms-and-containers-i-am-running-2023"]
title = "VM's and Containers I am Running - 2023"
description = "My last post detailed all the hardware I am running, so this post will list all the software that I run in VM's and containers. All of the following are virtual machines running on top of ESXi 7.0 U3 on three hosts. All containers are run within Virtual Machines."
full_description = '''VM's and Containers I am Running - 2023 spookyghost Aug 30, 2023 • 29 min read My last post detailed all the hardware I am running, so this post will list all the software that I run in VM's and containers. All of the following are virtual machines running on top of ESXi 7.0 U3 on three hosts. All containers are run within Virtual Machines. I will try and link the website or Github page for each of the services so you can deploy them too.This post might end up being quite long.Backup01 - Virtual MachineOS: Windows Server 2022 StandardCPU's: 4 vCPU cores of Intel i7-8700TRAM: 10GB Disk: 1 x 100GB OS Disk and 1 x 300GB Data Disk - Both Thin ProvisionedNIC: Single VMware VMXNET 3 on main VLAN (10Gb Backed)Applications:Veeam Backup and Replication with NFR KeyVeeam Backup and Replication handles all of the backups of my VMware VM's to my NAS and external storage. It also replicates VM's to other hosts. Veeam is also used for some Agent backups like my NVR, and my VPS. I would love to find an alternative solution so I don't have to reply on the NFR Licensing, but I think my best bet would be to move off of ESXi entirely as there are not many free solutions to backup ESXi. The concern with the NFR key is that if they stop offering it, or limit the number of instances, I would be stuck with no backups.Veeam Data Platform: Comprehensive Backup & Recovery SolutionsVeeam Backup & Replication delivers secure and powerful data protection for all workloads, on-premises and in the cloud, ensuring seamless backup and instant recovery.Veeam SoftwareHere is a link to the NFR licensing where you can get your own key.FREE NFR keys for NEW Veeam Availability SuiteVeeam is happy to provide a FREE NFR server license to students, certified engineers, trainers and bloggersVeeam SoftwareVeeam Backup for Microsoft 365 with NFR KeyThis connects to my Office 365 Business instance that I use for my personal email, and backs up the mailboxes to the 300GB Data disk every 15 mins. Frustratingly it doesn't support SMB shares, which is just crazy. One day I hope to replace this solution too.Backup Office 365 data with Veeam Backup for Microsoft 365Use Veeam Backup for Microsoft 365 to backup your Office 365 email data, recover individual mailbox items, meet legal and compliance requirements, and more!Veeam SoftwareEmployee in research and development Information technology and services company 51-200 employeesArq Backup with Arq Premium SubscriptionArq Backup is a very simple file backup application. I pay for their yearly subscription which includes 1TB of file storage (You can get more, but it costs per GB) and a great web based UI to restore files. This would be very handy in the event of a disaster like my house burning down. Many people have good backups, but accessing those backups is hard. Not so with Arq. 1TB of space doesn't sound like a lot, but for just important files that need a cloud backup, its fine. I also have the retention set very low, just 5 days. After all this is not a historical backup, but a cloud backup.I also use Arq for a historical, long term, local backup to my NAS, of files from my NAS. That may sound backwards, but its not used to restore files in the case of disaster, but in case of file deletion. My snapshots only go back so far, but this backup goes back as long as I've used Arq (4-5 years). It has a very limited backup set, and runs nightly. The backed up data is also replicated and protected in a few different ways. Think of if you deleted a Word document 3 years ago, this is where you'd probably find it.Here is the cloud hosted Web UI where you can download files directly, you can only get to the backups after putting in your encryption keyCloud backup software for Mac and Windows : ArqArq®Misc Scheduled Tasks for file list backupsI have a scheduled task here to get a list of filenames in my media folders. I don't backup my 40+TB of media as its too costly, so I backup the file names so I can get the media again if needed. Its a VERY basic PowerShell script which does the job.cd "\\NAS01\Media\Comedy" dir | Out-File "\\NAS01\Backup\File Lists\Comedy.txt" cd "\\NAS01\Media\Documentaries" dir | Out-File "\\NAS01\Backup\File Lists\Documentaries.txt" cd "\\NAS01\Media\TV Shows" dir | Out-File "\\NAS01\Backup\File Lists\TV Shows.txt" cd "\\NAS01\Media\4K HDR Movies" dir | Out-File "\\NAS01\Backup\File Lists\4K HDR Movies.txt" cd "\\NAS01\Media\Movies\SD" dir | Out-File "\\NAS01\Backup\File Lists\Movies-SD.txt" cd "\\NAS01\Media\Movies\x264 4K LDR" dir | Out-File "\\NAS01\Backup\File Lists\Movies-x264 4K LDR.txt" cd "\\NAS01\Media\Movies\x264 720p" dir | Out-File "\\NAS01\Backup\File Lists\Movies-x264 720p.txt" cd "\\NAS01\Media\Movies\x264 1080p" dir | Out-File "\\NAS01\Backup\File Lists\Movies-x264 1080p.txt" cd "\\NAS01\Media\Movies\x265 4K LDR" dir | Out-File "\\NAS01\Backup\File Lists\Movies-x265 4K LDR.txt" cd "\\NAS01\Media\Movies\x265 1080p" dir | Out-File "\\NAS01\Backup\File Lists\x265 1080p.txt" cd "\\NAS01\Media\Movies\x265 4K HDR" dir | Out-File "\\NAS01\Backup\File Lists\Movies-x265 4K HDR.txt"Backup02 - Virtual MachineOS: Debian 11CPU's: 4 vCPU cores of Intel i7-8700TRAM: 1GB Disk: 30GB Thin DiskNIC: Single VMware VMXNET 3 on main VLAN (10Gb Backed)This VM purely runs Borg Backup. It has SMB mounts to my NAS, and I use it to backup to external drives that live off-site. I connect the external drives to my desktop, and have Backup02 connect to that also via SMB. I fire this VM up monthly to take backups and turn it off again.BorgBackup – Deduplicating archiver with compression and authenticated encryptionDocker01 - Virtual MachineOS: Debian 11CPU's: 4 vCPU cores of Intel i7-8700TRAM: 4GBDisk: 100GB Thin DiskNIC: Single VMware VMXNET 3 on main VLAN (10Gb Backed)This VM hosts the majority of my self-hosted applications, all in Docker.Applications:DockerDocker Engine must be installed first, as all the applications run under DockerInstall Docker Engine on DebianInstructions for installing Docker Engine on DebianDocker DocumentationPortainer CE in DockerPortainer provides a really nice Web-UI for managing all of your Docker contains and hosts in one single screen. You can also deploy Docker compose stacks right from the UI which is very handy.Portainer has been getting better every release, but I do worry that I rely on it too much. Its a paid product with a free community edition version, and I hope they end up limiting the features. I would transition to just using the Docker CLI, however when its 11PM at night and I need to quickly update PLEX, its so much easier doing it from a Web UI.I run Portainer with Docker Run and have it update on a script every time I patch the system. To deploy it is very easy, just decide where you want your Portainer Data to be stored (This inclides all the docker-compose.yml files) and deploy it using the followingdocker create -p 9000:9000 --name=Portainer_Docker01 --restart always -v /var/run/docker.sock:/var/run/docker.sock -v /portainer_data:/data portainer/portainer-ce:latest docker container start Portainer_Docker01In the above example, it stores the Portainer data in a folder called /portainer_data on the host, and makes the application available on port 9000Portainer: Docker and Kubernetes Management PlatformPortainer is your container management platform to deploy, troubleshoot, and secure applications across cloud, datacenter, and Industrial IoT use cases.portainer-logo-blackRemy SimonsSenior Cloud Engineer, ilionxMealie in DockerMealie stores all my recipes for food and drinks. You can import recipes from websites directly into Mealie so you have them locally without risk of the site going down, etc. I have this exposed externally via NGINX so I can easily check on ingredients needed while at the store without having to get on the VPN, and I can share recipes with friendsMealie.ioA simple, fast, and easy way to create and share recipes.Here is how I have my docker-compose file setup. In the below example it stores local Mealia data in /media/mealie and exposes the application over port 9925version: "3.1" services: mealie: container_name: Mealie image: hkotel/mealie:latest restart: always ports: - 9925:80 environment: PUID: 1000 PGID: 1000 TZ: America/Chicago # Default Recipe Settings RECIPE_PUBLIC: 'true' RECIPE_SHOW_NUTRITION: 'false' RECIPE_SHOW_ASSETS: 'true' RECIPE_LANDSCAPE_VIEW: 'true' RECIPE_DISABLE_COMMENTS: 'false' RECIPE_DISABLE_AMOUNT: 'false' # Gunicorn # WEB_CONCURRENCY: 2 # WORKERS_PER_CORE: 0.5 # MAX_WORKERS: 8 volumes: - /media/mealie/:/app/dataNavidrome in DockerNavidrone is like PLEX but for music. I don't currently use it too much, but I've been working on getting all of my music in FLAC and adding anything I listen to often. More than once now a song I liked has been removed from Apple Music which is frustrating. My eventual goal is to use locally hosted music entirely.NavidromePersonal Music StreamerNavidromeHere is my docker compose config for navidrome. In this example it uses /media/navidrome for the local files, but /media/music for the actual music, which is actually an SMB share. The application is exposed of port 4533version: "3" services: navidrome: container_name: navidrome image: deluan/navidrome:latest user: 1000:1000 # should be owner of volumes ports: - "4533:4533" restart: unless-stopped environment: # Optional: put your config options customization here. Examples: ND_SCANSCHEDULE: 1h ND_LOGLEVEL: info ND_SESSIONTIMEOUT: 24h ND_BASEURL: "" volumes: - "/media/navidrome:/data" - "/media/music:/music:ro"To mount a share in Debian just edit the /etc/fstab file and configure your shareHere is a basic example of the line you'd need to add to fstab//10.0.0.11/Data/Music /media/music cifs rw,credentials=/home/credentials/.smbcreds,uid=1000,gid=1000,file_mode=0660,dir_mode=0770,vers=3.0,iocharset=utf8,x-systemd.automount 0 0Stirling PDF in DockerI found this application from a discussion on the selfhosted board on Lemmy, and I can't live without it. It has every single PDF editing feature you could want, and everything happens locally. This is something I think everyone should have hosted!GitHub - Frooodle/Stirling-PDF: locally hosted web application that allows you to perform various operations on PDF fileslocally hosted web application that allows you to perform various operations on PDF files - GitHub - Frooodle/Stirling-PDF: locally hosted web application that allows you to perform various operati…GitHubFrooodleHere is my docker compose config. This will expose the application at port 8082, and it looks for OCR training data in the folder /media/stirling/trainingdataversion: '3.3' services: stirling-pdf: container_name: stirling-pdf image: frooodle/s-pdf:latest ports: - '8082:8080' volumes: - /media/stirling/trainingdata/:/usr/share/tesseract-ocr/4.00/tessdata #Required for extra OCR languages # - /location/of/extraConfigs:/configs # - /location/of/customFiles:/customFiles/ environment: APP_LOCALE: en_US APP_HOME_NAME: PDF Editor APP_HOME_DESCRIPTION: "" APP_NAVBAR_NAME: Stirling PDF APP_ROOT_PATH: / # ALLOW_GOOGLE_VISIBILITY: trueThe OCR Training data is located here (As outline in the Github instructions)GitHub - tesseract-ocr/tessdata: Trained models with fast variant of the “best” LSTM models + legacy modelsTrained models with fast variant of the &quot;best&quot; LSTM models + legacy models - GitHub - tesseract-ocr/tessdata: Trained models with fast variant of the &quot;best&quot; LSTM models + legacy…GitHubtesseract-ocrKiwix Serve in DockerKiwix Serve provides a Web UI for locally reading Kiwix ZIM files, such as the entirety of Wikipedia, all offline with no internet. This is extremely handy if you ever think you may be without internet for a period of time, like if a hurricane hits your city, or even if you just have slow internet, or a government that censors the internet.Here is a full list of the ZIM files I thought it would be handy to keep around, which totals around 450GB100r-off-the-grid_en_2023-06.zim 3dprinting.stackexchange.com_en_all_2023-07.zim apple.stackexchange.com_en_all_2023-05.zim appropedia_en_all_maxi_2021-03.zim arduino.stackexchange.com_en_all_2023-05.zim askubuntu.com_en_all_2023-05.zim aviation.stackexchange.com_en_all_2023-05.zim based.cooking_en_all_2023-08.zim bicycles.stackexchange.com_en_all_2023-05.zim boardgames.stackexchange.com_en_all_2023-05.zim cheatography.com_en_all_2022-03.zim cooking.stackexchange.com_en_all_2023-05.zim courses.lumenlearning.com_en_all_2021-03.zim crafts.stackexchange.com_en_all_2023-05.zim crashcourse_en_all_2023-06.zim diy.stackexchange.com_en_all_2023-03.zim earthscience.stackexchange.com_en_all_2023-05.zim edu.gcfglobal.org_en_all_2023-08.zim electronics.stackexchange.com_en_all_2023-05.zim fitness.stackexchange.com_en_all_2023-05.zim gaming.stackexchange.com_en_all_2023-05.zim gardening.stackexchange.com_en_all_2023-05.zim gutenberg_en_all_2023-08.zim ham.stackexchange.com_en_all_2023-05.zim health.stackexchange.com_en_all_2023-05.zim history.stackexchange.com_en_all_2023-05.zim ifixit_en_all_2023-07.zim interpersonal.stackexchange.com_en_all_2023-05.zim iot.stackexchange.com_en_all_2023-05.zim law.stackexchange.com_en_all_2023-05.zim lifehacks.stackexchange.com_en_all_2023-05.zim lowtechmagazine.com_en_all_2023-08.zim mechanics.stackexchange.com_en_all_2023-05.zim movies.stackexchange.com_en_all_2023-05.zim networkengineering.stackexchange.com_en_all_2023-05.zim outdoors.stackexchange.com_en_all_2023-05.zim pets.stackexchange.com_en_all_2023-05.zim phet_en_all_2023-04.zim photo.stackexchange.com_en_all_2023-05.zim politics.stackexchange.com_en_all_2023-05.zim productivity.stackexchange.com_en_all_2017-10.zim raspberrypi.stackexchange.com_en_all_2023-05.zim rationalwiki_en_all_maxi_2021-03.zim retrocomputing.stackexchange.com_en_all_2023-05.zim security.stackexchange.com_en_all_2023-05.zim serverfault.com_en_all_2023-05.zim space.stackexchange.com_en_all_2023-05.zim stackoverflow.com_en_all_2023-05.zim superuser.com_en_all_2023-05.zim sustainability.stackexchange.com_en_all_2023-05.zim teded_en_all_2023-07.zim theworldfactbook_en_all_2023-05.zim travel.stackexchange.com_en_all_2023-05.zim unix.stackexchange.com_en_all_2023-05.zim urban-prepper_en_all_2023-06.zim vikidia_en_all_nopic_2023-08.zim wikem_en_all_maxi_2021-02.zim wikibooks_en_all_maxi_2021-03.zim wikihow_en_maxi_2023-03.zim wikinews_en_all_maxi_2023-08.zim wikipedia_en_all_maxi_2023-08.zim wikiquote_en_all_maxi_2023-07.zim wikispecies_en_all_maxi_2023-08.zim wikiversity_en_all_maxi_2021-03.zim wikivoyage_en_all_maxi_2023-07.zim wiktionary_en_all_maxi_2023-07.zim woodworking.stackexchange.com_en_all_2023-05.zim workplace.stackexchange.com_en_all_2023-05.zim www.ready.gov_en_2023-06.zim www.shtfblog.com_4d9ce8d7.zim zimgit-post-disaster_en_2023-06.zimGitHub - kiwix/kiwix-tools: Command line Kiwix tools: kiwix-serve, kiwix-manage, ...Command line Kiwix tools: kiwix-serve, kiwix-manage, ... - GitHub - kiwix/'''
