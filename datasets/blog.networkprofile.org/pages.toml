l of the servers in my homelab run inside virtual machines, here are all of them (Subject to change, very quickly...) Everything runs under ESXi 6.7 and is managed by vCenter Server 6.7 via the appliance. I have two ESXi hosts, one at home and one which Jan 4, 2019 6 min read"
