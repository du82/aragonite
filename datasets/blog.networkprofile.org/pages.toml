full_description = "Why you might want a FLIR Camera spookyghost Jan 19, 2020 • 1 min read When I bought my house I bought a $200 FLIR Camera that attaches to your phone, the FLIR One. I bought it to check windows and a doors for air leaks, and to check where I needed more insulationAbove my bathroom there was a lot of insulation, but there was a weird hot spot near a light. Why?I went up into the attic and dug through the insulation, and I found thisIts a very, very, very badly done splice from a 12/2 feed of Aluminum romex to 14/2 Copper romex which was extremely hot to the touch Not only that, but it was on a 20a non-AFCI breaker. both 12/2 Alu and 14/2 CU is only allowed on a 15a breakerNot only is this not even in a junction box, but you can't just use regular wire nuts to join CU to Alu. You must used approved methodsI thew in a junction box and used some Alumiconn connectors to properly join the wiresThis alone paid me the $200 back for the camera, this causing a house fire would cost well over $200 Lessons Learned - The 2024 Houston Derecho 2024 is not even over yet, but so we have already endured two massive storms that caused widespread destruction. This posts goes through the lessons I learned in the first of those 2 storms 2024 Houston Derecho On May 16th 2024, a Derecho hit the Houston area which had very Oct 27, 2024 7 min read Misc Projects and Updates This post is just some small updates to past projects, and some smaller projects that don't really warrant their own full post. Garage Compressed Air Setup Updates Original post: Garage Compressed Air SetupI find myself needing compressed air for nail and staple guns, filling up tires, blowing out Jan 17, 2024 15 min read Emporia EVSE Install At the end of last year we got an EV. This post details the install of an Emporia EVSE in my garage. It won't be very long, but it may give you an idea of how you might install yours. At first I was just charging it with Jan 16, 2024 6 min read"
