["https://blog.networkprofile.org/quick-and-easy-snipe-it-docker-deployment"]
title = "Quick and easy Snipe-It Docker Deployment"
description = """
I wanted to very quickly get Snipe-it up and running, but none of the guides seemed very simple, and they all wanted advanced configuration. Running these commands as-is will result in a functional Snipe-it deployment at http://<your-docker-ip>:8082

First you want to create two folders on your docker host, /media/</your-docker-ip>"""
full_description = 'Quick and easy Snipe-It Docker Deployment spookyghost Dec 31, 2018 • 1 min read I wanted to very quickly get Snipe-it up and running, but none of the guides seemed very simple, and they all wanted advanced configuration. Running these commands as-is will result in a functional Snipe-it deployment at http://<your-docker-ip>:8082First you want to create two folders on your docker host, /media/snipe-mysql and /media/snipe-confsudo mkdir /media/snipe-mysql sudo mkdir /media/snipe-conf then, the mysql containerdocker run \ --name snipe-mysql \ -d \ -e MYSQL_ROOT_PASSWORD="3yyDOLC6VPFG&5gk#yNl" \ -e MYSQL_DATABASE=snipe \ -e MYSQL_USER=snipe \ -e MYSQL_PASSWORD="29fMXli8ZRQCXnxnUEG" \ -e TZ=America/Chicago \ -p 127.0.0.1:3306:3306 \ -v /media/snipe-mysql:/var/lib/mysql \ mysql:5.6 --sql-mode="" You can change the MYSQL_ROOT_PASSWORD if you want to, as well as the MYSQL_PASSWORD, but just be sure to change them in the main container configuration too. Also make sure your timezone is correctNow for the main application containerdocker create \ --name=snipe-it \ --link snipe-mysql:db \ -e PUID=1000 \ -e PGID=1000 \ -e DB_CONNECTION=mysql \ -e DB_HOST=snipe-mysql \ -e DB_DATABASE=snipe \ -e DB_USERNAME=snipe \ -e DB_PASSWORD="29fMXli8ZRQCXnxnUEG" \ -e APP_KEY=base64:5U/KPKw1GN/Rz0fWYO/4FsSOqjmjvDAQzMCqwcAqstc= \ -p 8082:80 \ -v /media/snipe-conf:/config \ --restart unless-stopped \ snipe/snipe-it Finally, run the following to start the containerdocker start snipe-it Now when you go to http://<your-docker-ip>:8082, you can finish the setupThis may not be the best way to get Snipe-it running, but it will get it running. I just wanted to quickly test it out before committing fully to it.Hopefully this helps someone Lessons Learned - The 2024 Houston Derecho 2024 is not even over yet, but so we have already endured two massive storms that caused widespread destruction. This posts goes through the lessons I learned in the first of those 2 storms 2024 Houston Derecho On May 16th 2024, a Derecho hit the Houston area which had very Oct 27, 2024 7 min read'
