["https://blog.networkprofile.org/finding-the-ip-of-an-unknown-device"]
title = "Finding unknown IP of a device on your network"
description = """
You just bought a network device which is already configured with a static IP, and you don't know what it is. This is how you can find it.

I had to do this recently when I bought an APC Network card which would not factory reset. This means it wouldn't"""
full_description = "Guide Finding unknown IP of a device on your network spookyghost Jan 3, 2019 • 2 min read You just bought a network device which is already configured with a static IP, and you don't know what it is. This is how you can find it.I had to do this recently when I bought an APC Network card which would not factory reset. This means it wouldn't switch back to DHCP, and I needed to find the IP address First you need to find the mac address. Most devices will have a sticker stating the mac address. If it doesn't, plug it into your managed switch and go take a look at the address table, and get the mac addressNow that you have the mac address, confirm its the device you are looking for by looking up the mac address online. We can see that this device is made by APC, so its the correct mac addressNow, fire up Wireshark on your laptop and filter the packets to only show packets from the mac address of your device. To do this, under the following in the filter fieldeth.addr == 00:00:00:00:00:00`Thankfully, this device is broadcasting ARP packets trying to find 204.224.111.94, whatever that may be. From these packets, we can see that our device is 204.224.111.66. Perfect!From here, you can configure a static IP on your computer so you can talk to it. I decided to set my IP to 204.224.111.94, since we know there shouldn't be any firewalling or blocking to that address on the device since its trying to talk to it already.Once I did that, bingo! I can get to the login page. Lessons Learned - The 2024 Houston Derecho 2024 is not even over yet, but so we have already endured two massive storms that caused widespread destruction. This posts goes through the lessons I learned in the first of those 2 storms 2024 Houston Derecho On May 16th 2024, a Derecho hit the Houston area which had very Oct 27, 2024 7 min read Misc Projects and Updates This post is just some small updates to past projects, and some smaller projects that don't really warrant their own full post. Garage Compressed Air Setup Updates Original post: Garage Compressed Air SetupI find myself needing compressed air for nail and staple guns, filling up tires, blowing out Jan 17, 2024 15 min read"
