full_description = "Melted UPS Batteries spookyghost Aug 6, 2023 • 2 min read For over 3 months now one of my UPS's has been complaining about its batteries. Being lazy, I just ignored it. This is a short post about what happens when you do that.It started telling me the battery is not installed properly every day or so after a whileThat's probably not good. So I ordered new batteries and waited for them to arrive. When they arrived I went to remove the old pack, and they would not come out! I had to bend the UPS to get the battery pack outAs you can see, the batteries don't look goodIt took a little effort to get them out the pack, but once I got them out you can see 2 of the batteries really took a beating for some reasonI am really surprised just how well this battery held together. It has expanded so much, but never split! I guess that's pretty goodI got my new batteries and put them in the sled, but I had to bend the UPS back. Thankfully a woodworking clamp is pretty good for thisGood as new!I put the new batteries in and they work as they shouldThats all Lessons Learned - The 2024 Houston Derecho 2024 is not even over yet, but so we have already endured two massive storms that caused widespread destruction. This posts goes through the lessons I learned in the first of those 2 storms 2024 Houston Derecho On May 16th 2024, a Derecho hit the Houston area which had very Oct 27, 2024 7 min read Misc Projects and Updates This post is just some small updates to past projects, and some smaller projects that don't really warrant their own full post. Garage Compressed Air Setup Updates Original post: Garage Compressed Air SetupI find myself needing compressed air for nail and staple guns, filling up tires, blowing out Jan 17, 2024 15 min read Emporia EVSE Install At the end of last year we got an EV. This post details the install of an Emporia EVSE in my garage. It won't be very long, but it may give you an idea of how you might install yours. At first I was just charging it with Jan 16, 2024 6 min read"
