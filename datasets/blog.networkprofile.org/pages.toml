["https://blog.networkprofile.org/full-lab-power-setup"]
title = "My Lab Power Setup"
description = "This post shows how I upgraded the power delivery to my home server room, aswell as installing the infrastructure to replace 5 UPS’s around my house withjust one large UPS. Why Upgrade the power? The electrical in my home when I moved in was terrible, it was also Aluminum andhas been incorrectl…"
full_description = "My Lab Power Setup spookyghost Oct 20, 2020 • 4 min read A lot of people wanted to know what UPS's and PDU's I am running, and where. Here are all the detailsI would highly suggest you read my post on setting up the power inlets, as it explains a lotHome Server Room Power Upgrade + Multi-room UPSThis post shows how I upgraded the power delivery to my home server room, aswell as installing the infrastructure to replace 5 UPS’s around my house withjust one large UPS. Why Upgrade the power? The electrical in my home when I moved in was terrible, it was also Aluminum andhas been incorrectl…NetworkProfile.orgSpookyGhostIn that post I mention I am getting a much larger 3000VA UPS. I had a good deal lined up which fell through, so I am using a temporary UPS. That UPS needed new batteries, so I just went and replaced all the batteries, and the larger UPS will probably wait a while nowFirst in my rack I have an SMX1500RM2U with is connected to 2 Cyberpower PDU15M2F10R PDU's with the LCD displaysNext to that, I have an SMT1500 desktop unit which I got for free (Hence not a rack unit, I can't turn down free...)Both of course have network cards, either an AP9631 or AP9630. The SMT1500 handles my desk, my wifes desk and my TV/HTPC in the living roomHere is a view of the power inlets, but I highly suggest you read the linked article at the top of this post. The UPS's are connected to the Server rack circuits on the right.The General Purpose circuit has a spare CyberPower 1500va UPS connectedI am using this for random spare stuff, as these UPS's are pretty usless, see why here:Cyberpower UPS’s - Try something else...This is now the fourth time I have come across these issues with a CyberpowerUPS. It means your UPS really isn’t a UPS, so you may want to think twice aboutpicking one up First thing to keep in mind is that these are line interactive UPS’s, that meansthe input power isn’t going through the batte…NetworkProfile.orgSpookyGhostThis one has brand new batteries, so it should be good for a little while longer.Connected to this UPS is a power strip, which powers all of my battery chargersI have a bunch of battery chargers, power tool chargers, and a USB charger. Its nice to keep all the batteries in one place, with the chargers at the readyThat is the extent of the UPS's in the house, the power inlet setup lets me avoid having UPS's at all anywhere else, as you can see here, at our desks there is no UPSAnd I have some Cyberpower PDU's under the desk for distributing the power, much nicer than a cheap power stripMoving onto the garage where I have another rack. If you want to know more about what I have in there, you can read these two postsGarage Network Rack with 10G FiberThis details my 12u rack in my detached garage which has a 10G uplink to my mainnetwork I needed some networking in my detached garage for an access point, my flighttracking setup, 3 x PoE cameras and some future additions, and instead ofrunning multiple Cat6 cables across, I decided to just run…NetworkProfile.orgSpookyGhostUnconditioned Texas Garage Lab - 1 year later (Its all fine)A little over a year ago I mounted a rack in my garage, threw a Cisco Switch inthere, an APC UPS and my Flight Tracking setup, and a second ESXi host. Seebelow for the original: Garage Network Rack with 10G FiberThis details my 12u rack in my detachedgaragewhich has a 10G uplink to my mainnetwo…NetworkProfile.orgSpookyGhostIn the garage I have an SMT1000RM2u, which is more than enough capacity for anything I can keep out thereIt too, of course has a network cardI monitor all three UPS's in LibreNMS, but they also have E-Mail alerts and remote shutdown configured for all of the devices attached"
year_published = 2020
year_updated = 2020
clearnet = "https://blog.networkprofile.org/full-lab-power-setup"
