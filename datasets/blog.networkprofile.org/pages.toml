full_description = "First Post... spookyghost Dec 28, 2018 This is my new blog. I aim to post content about my homelab and general technology related content, as well as some EDC and VEDC type stuff.I usually post on reddit, however I feel like its not permanent enough as posts can often get downvoted or just ignored despite having good content. I also delete my account for security reasons every few months, which ruins any information I have shared. It also relies on imgur or reddit as an image host, giving me almost no control. Here I can make sure the content stays up no matter what.I hope I get feedback on the performance of the blog, as its hosted in my homelab in a Docker container, and then using CloudFlare for DNS and CDN. So far it seems quite responsive Lessons Learned - The 2024 Houston Derecho 2024 is not even over yet, but so we have already endured two massive storms that caused widespread destruction. This posts goes through the lessons I learned in the first of those 2 storms 2024 Houston Derecho On May 16th 2024, a Derecho hit the Houston area which had very Oct 27, 2024 7 min read Misc Projects and Updates This post is just some small updates to past projects, and some smaller projects that don't really warrant their own full post. Garage Compressed Air Setup Updates Original post: Garage Compressed Air SetupI find myself needing compressed air for nail and staple guns, filling up tires, blowing out Jan 17, 2024 15 min read Emporia EVSE Install At the end of last year we got an EV. This post details the install of an Emporia EVSE in my garage. It won't be very long, but it may give you an idea of how you might install yours. At first I was just charging it with Jan 16, 2024 6 min read"
