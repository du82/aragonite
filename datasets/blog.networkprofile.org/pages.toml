["https://blog.networkprofile.org/6-f150-bed-divider"]
title = "$6 F150 Bed Divider"
description = """
I wanted a bed divider, and I didn't want to spend the $310 Ford charges for the OEM one. So I just made one

If you have a Circular saw, or Jigsaw, Sawzall, Hand saw you can make this in less than 10 minutes, and it just costs you $6"""
full_description = "$6 F150 Bed Divider spookyghost Feb 1, 2020 • 2 min read I wanted a bed divider, and I didn't want to spend the $310 Ford charges for the OEM one. So I just made oneIf you have a Circular saw, or Jigsaw, Sawzall, Hand saw you can make this in less than 10 minutes, and it just costs you $6 in wood. And you have some left overI bought an 8ft 2x12 from home depot. I did not get the pressure treated ones as I didn't want to risk it shrinking after I cut it, all of the ones they had were super wet I found that 64 inches and 15/16th's was the perfect length. Its easy to get in and there is zero wobble. This is a 2019 F150 with the 5.5FT bed. But I imagine anything 2015 or newer would be the same, or possibly even older. If you have a bed liner you will need to take that into accountAs you can see I cut notches in the bottom, this is pretty much required so you can actually get it into the grooves The slots are clearly made for this as they are sized exactly the same as a 2x peice of woodI am very pleased! Lessons Learned - The 2024 Houston Derecho 2024 is not even over yet, but so we have already endured two massive storms that caused widespread destruction. This posts goes through the lessons I learned in the first of those 2 storms 2024 Houston Derecho On May 16th 2024, a Derecho hit the Houston area which had very Oct 27, 2024 7 min read Misc Projects and Updates This post is just some small updates to past projects, and some smaller projects that don't really warrant their own full post. Garage Compressed Air Setup Updates Original post: Garage Compressed Air SetupI find myself needing compressed air for nail and staple guns, filling up tires, blowing out Jan 17, 2024 15 min read Emporia EVSE Install At the end of last year we got an EV. This post details the install of an Emporia EVSE in my garage. It won't be very long, but it may give you an idea of how you might install yours. At first I was just charging it with Jan 16, 2024 6 min read"
