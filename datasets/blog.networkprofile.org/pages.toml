title = "Champion 7000w Portable Generator and Gasoline Storage"
description = """
Here are all the details on my portable generator setup that can power my house in case of emergency.

A while ago I got all my electrical updated, read more below

Texas Freeze - Part 2 - Electrical OverhaulThis post is about getting my electrical system overhauled ready for solar"""
full_description = "Champion 7000w Portable Generator and Gasoline Storage spookyghost Jan 2, 2022 • 12 min read Here are all the details on my portable generator setup that can power my house in case of emergency. A while ago I got all my electrical updated, read more belowTexas Freeze - Part 2 - Electrical OverhaulThis post is about getting my electrical system overhauled ready for solar panels and a natural gas generator. The generator will be using a 200a ATS, but I also opted to install a 30a inlet with a manual interlock. This will let my plug in a portable gasoline generator ifNetworkProfile.orgSpookyGhostIn that post you can see that before I had my large Generac generator installed, I got a power inlet added so I can power my home from a portable generator. Here is a link to the specific inlet. In my opinion this is the best inletGE 30 Amp Temporary Power Inlet-T030N - The Home DepotThe GE 30 Amp Power Inlet features a single enclosure that allows you to connect your generator power to a panel powering your required loads. It’s compact size and standard features give you the protectionThe Home DepotGEAnd here are some pictures of the inlet installThis inlet box lets you close it with the cord plugged in, which is great if its raining.Here is a shot of the interlockI had no idea how long I would be waiting for my Generac generator, so I decided to pick up a portable generator. A portable generator that runs on Gasoline also means that if the natural gas goes out, I can still get power. And since I have both a Natural Gas furnace as well as some mini split heat pumps that run on 100% electric, I would still have heat if the natural gas went out.I wanted a generator that would be fairly reliable, had an inverter and could run my AC. While a Honda generator would be the choice, the fact they want $6000 for a 7kw generator is just crazy.What I really wanted was the PREDATOR 9500 Watt generator from Harbor Freight. But it was not available online, and it was ALWAYS out of stock. I then found the Champion Power Equipment 100520 8750w generator. Its 8750w peak and 7000w continuous and cost just $1000. It is not very quiet, but that's fine for my use as it would be used very rarely, and only in the worst situations.I fueled it up and ran through the break in period, and once that was done I hooked it up to the inlet and managed to start my main AC. Perfect.I noticed a LOT of glitter in that first oil change, so I threw a GenExhaust Magnetic Dip stick in and ran it some more, and it pulled a lot of junk out the oil. I would get one of these from the start if I were to do it againAmazon.com : GenExhaust for Champion Model# 100519/100520 (p/n 15010-Z080130-OB00) Generator - Non-Anodized Easy USE Magnetic Oil Dipstick : Patio, Lawn & GardenAmazon.com : GenExhaust for Champion Model# 100519/100520 (p/n 15010-Z080130-OB00) Generator - Non-Anodized Easy USE Magnetic Oil Dipstick : Patio, Lawn & GardenNon-Anodized Easy USE Magnetic Oil Dipstick : Patio, Lawn & GardenThe next modification would be a quick connector for the battery, so I can easily plug in a battery tender. I plan to plug it in every few months to make sure it stays full. You can pull start the generator, but I want the battery to workHere are the partsAmazon.com: NOCO GC002 X-Connect M6 Eyelet Terminal Accessory For NOCO Genius Smart Battery Chargers : AutomotiveBuy NOCO GC002 X-Connect M6 Eyelet Terminal Accessory For NOCO Genius Smart Battery Chargers: Terminals & Ends - Amazon.com ✓ FREE DELIVERY possible on eligible purchasesBrands related to this category on Amazon NOCO Genius. Experience smart battery chargers. Instant battery chargers for automobiles. Explore professional battery suppliesDIY Life TechAmazon.com: NOCO GENIUS1, 1-Amp Fully-Automatic Smart Charger, 6V and 12V Battery Charger, Battery Maintainer, Trickle Charger, and Battery Desulfator with Temperature Compensation : AutomotiveBuy NOCO GENIUS1, 1-Amp Fully-Automatic Smart Charger, 6V and 12V Battery Charger, Battery Maintainer, Trickle Charger, and Battery Desulfator with Temperature Compensation: Battery Accessories - Amazon.com ✓ FREE DELIVERY possible on eligible purchasesDan CurrierAfter that I figured all was good. But then I found out powering my UPS from this generator was an issue if I used the 120v GFCI plugs, read more hereChampion 100520 GFCI Removal - Running a UPS from generator powerI have a Champion 100520 8750/7000w portable generator, it will power my entire home including the AC and my server rack as long as I am careful. This post will detail the issues I had running my UPS directly plugged into the UPS. I usually just use my generatorNetworkProfile.orgSpookyGhostThat white oulet was a bit of a standout, so I got a black one. While I was in there, I also added a switch so I can easily switch between bonded neutral and floating neutral. Bonded should be used when just using the generator on its own, and it should be set to floating when plugged into the house. This is so the ground is only bonded to the neutral in one once place (Your electrical panel in that case)This is the parts I usedHeavy Duty Toggle Switch 20/15A 125/277V, 2 HP with Waterproof Rubber Boot UL cUL Certified - - Amazon.comHeavy Duty Toggle Switch 20/15A 125/277V, 2 HP with Waterproof Rubber Boot UL cUL Certified - - Amazon.comAmazon.comKristopherLeviton Decora Plus 20 Amp Industrial Grade Duplex Outlet, Black-R85-16352-0ES - The Home DepotLeviton’s Decora designer line of wiring devices adds contemporary styling to any residential or commercial application. Decora devices are built to the highest performance standards to provide a long,The Home DepotLevitonNext I decided that I should get a natural gas kit for it. Then if my main generator fails, I can still hook into the natural gas and power the house without messing around with gasolineThe install instructions were lacking, but I took some tips from this guys great videoIn the end, it came out wellHere is a link to the kit Propane Natural Gas Conversion Generator Champion 100520 420cc 8750-Watt Low Psi | eBayChampion 100520. KIT WILL ALLOW YOUR ENGINE TO RUN ON LOW PRESSURE PROPANE. WARNING: These products contain a chemical known to the state of California to cause cancer and birth defects or reproductive harm.eBayI also took note from the video above and installed a tachometer Amazon.com: Searon Small Engine Tachometer Hour Meter inductive Tachometer for Outboard Engine Chain Saws Tractors Lawnmowers Motorcycles Marine Engines RC Toys PWC ATV : AutomotiveBuy Searon Small Engine Tachometer Hour Meter inductive Tachometer for Outboard Engine Chain Saws Tractors Lawnmowers Motorcycles Marine Engines RC Toys PWC ATV: Tachometers - Amazon.com ✓ FREE DELIVERY possible on eligible purchasesBrands related to this category on Amazon Select from precision tachometersShop REED Instruments Shop now Car & Truck Performance Gauges and Gauge PodsShop GlowShift Shop now EHDIS - VINYL WRAP TOOLSShop EHDIS Shop now Runleader Digital Inductive Hour Meter for MowerShop Runleader Shop nowHere is a demo I shot of the natural gas kitAnd here is a shot of the tachometer working. Interestinly this generator runs at 3400RPM and not what I expected which was 3600RPM. This is standard for this generator. On Eco it throttles down to 2800RPMI keep the tank on the generator COMPLETELY full to the brim with gasoline treated with Sta-Bil, and I make sure the carb is completely drained and dry. Because the tank is completely full, it means there is no room for condensation, and it should last a long time. I plan to rotate it out each year, so I wrote it on the tank with a sharpie.So far this generator has handled everything I have thrown at it, even my welderFor the inlet cord, at first I bought what I thought was a good cord. DO NOT BUY THIS CORD!Amazon.com: Reliance Controls PC3040 30-Amp (L14-30), 40-Foot Generator Power Cord,Black : Patio, Lawn & GardenAmazon.com: Reliance Controls PC3040 30-Amp (L14-30), 40-Foot Generator Power Cord,Black : Patio, Lawn & GardenBrands related to this category on Amazon Connect your back up power with Reliance ControlsShop Reliance Controls Shop now generator inlet box ( L1430 - SS2-50)Shop HOME Shop now GearIT cat6 patch cable for home & office 5ft Shop GearIT Shop now ElecStream TechShop ElecStream Tech Shop nowErica JWhen I got it, I found that it simply did not lock... You can pull it out without any issue. Not really much good for a TWIST LOCK cord. Here is a demoI contacted Reliance who make the cord, but never got a reply quickly, so I went ahead and just returned the cord to Amazon, and ordered a much better cord from Iron Box which is made with real SOOW cord, and high quality ends. I paid $109, so only $10 more than the junk Chinese made Reliance cord.NEMA L14-30 Generator Extension Cord - 30A, 125/250V, 10/4 SOOW - UL Listed - Iron Box # IBX-5805 (50 ft, Build) - - Amazon.comNEMA L14-30 Generator Extension Cord - 30A, 125/250V, 10/4 SOOW - UL Listed - Iron Box # IBX-5805 (50 ft, Build) - - Amazon.comBrands related to this category on Amazon GearIT 30 amp 4 prongs generator extension cordsShop GearIT Shop now Quality, safe, and reliable extension cordsShop USW Shop nowBougeRVWhen I got the Iron Box cord, I noticed how well the ends lockIn the meantime I did get a reply from Reliance I replied back to them saying I returned the cord, and got a better cord. I got this snarky replyAre they really saying that I should ONLY be using Reliance products? Yikes. These are standard NEMA plugs and should work with any brands. I guess this is all they can do to defend their junk products.I tried to leave a review, but for some reason it got removed... Now I'm starting to realize how that cord has such good reviewsSo the moral of the story here is to avoid Reliance! Not only do they not stand behind their products, but they are junk.Next I decided that I really need to keep some gasoline on hand. Not only for this generator incase I need to use it, but incase there is a disaster and everyone starts hoarding gasoline or there is a shortage.I bought some more Wavian NATO gas cans, so I now have a total of 14 of them which is just over 72 Gallons of gasoline. Wavian Fuel Cans | The Finest Steel Jerry Cans In The WorldThe original NATO Jerry Can — quality steel fuel cans and accessories from Wavian USA. Flexible spouts, safety nozzles, gaskets, fuel can mounts, holders and more.Wavian USAWavian gas cans are completely sealed, do not vent, and are fire resistant. Because they are sealed, I've stored gas for over a year with no Sta-Bil, and it was fine.Here is a demo of how durable the cans areFirst I needed a way to get them around, so I modified the wooden bed divider in my F150 to easily move cans (More details on the wood below)$6 F150 Bed DividerI wanted a bed divider, and I didn’t want to spend the $310 Ford charges for the OEM one. So I just made one If you have a Circular saw, or Jigsaw, Sawzall, Hand saw you can make this in less than 10 minutes, and it just costs you $6NetworkProfile.orgSpookyGhostI added a middle section which easily fits 4 cans perfectly After test fitting, I painted the entire thing white. And I found I can fit 5 more cans on the other side. So now I can very easily move 9 cans around at a timeThen I got a bunch of scrap wood I had on hand, and built a storage rack for them. If this looks thrown together, that's because it is. I never purchased anything for this, it was ALL scrap.I just write the date on them with a sharpie, and move the oldest to the left. I also got this AA powered transfer pump, which makes moving gas around very easyHere is a link to the pump. I got recommended it by James Condon on YouTube who repairs generators (https://www.youtube.com/user/jcondon2007)Amazon.com: TERAPUMP 4th Gen Gas Can Fuel Transfer Pump/No More Gas Can Lifting, Fits numerous Gas Cans (Advanced Auto-Stop Sensor, & Flexible in-and-Out Take Hose) : AutomotiveBuy TERAPUMP 4th Gen Gas Can Fuel Transfer Pump/No More Gas Can Lifting, Fits numerous Gas Cans (Advanced Auto-Stop Sensor, & Flexible in-and-Out Take Hose): Hand Fuel Pumps - Amazon.com ✓ FREE DELIVERY possible on eligible purchasesDaniel RojasThats all! Let me know if anyone has any questions"
