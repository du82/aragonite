["https://blog.networkprofile.org/kiwix-access-wikipedia-and-more-with-no-internet"]
title = "Kiwix - Access Wikipedia (And More) With no Internet"
description = """
Do you want to be able to read ALL of Wikipedia at home with no internet? If so, this is for you.

Last year during a long, big power outage I realized that I rely on the internet to look up a LOT of stuff. I now have a generator"""
full_description = "Kiwix - Access Wikipedia (And More) With no Internet spookyghost Dec 3, 2021 • 3 min read Do you want to be able to read ALL of Wikipedia at home with no internet? If so, this is for you.Last year during a long, big power outage I realized that I rely on the internet to look up a LOT of stuff. I now have a generator so I won't lose power, but its possible the internet could go off, and I still want to be able to look things up. This solved that problem.The solution is KiwixKiwix: Internet content for people without internet access!Read Wikipedia or any website on your mobile phone or computer, even when there is no internet. For free!KiwixKiwix lets you read ZIM files in a web interface. And you can get all sorts of content in ZIM formatContent Packages – KiwixKiwixAnd, you can also make your own!HomeBuild quotes faster with Zimit, the best services CPQ software for professional services, software subscriptions, and bundled solutions.ZimitI'm running Kiwix inside of a Docker container, and its a VERY basic config. All it does it pass through a port to access it, and then maps a folder to the container. This folder contains all my ZIM files. And then I'm having it read *.ZIM, which means ANY ZIM file that goes in the folder, shows up in the interfacedocker run -v /media/kiwix:/data -p 8080:80 kiwix/kiwix-serve *.zimHere are some screenshots of my setup. You can see the full list of the content I've added. I think I have all the ones worth getting for a situation without internetYou can see I have Wikipedia twice. The smaller version of the Wikipedia download without images is much newer than the larger version with images, so I got both.The folder I have mapped to the container is actually mounted to a folder on my NAS which stores the ZIM filesIts really that easy. But, you can go one step further. One or two of the content packs seem to require HTTPS to view properly, so I added Kiwix to my reverse proxy setup, but just set it up with a local ACLThere really isn't much more to it, its super basic and lets you access a TON of contentAny questions, feel free to contact me. And if you like Kiwix, support themSupport us! – KiwixKiwix is a nonprofit, open-source project, and wouldn’t be what it is without the support of users -and donors- like you.Kiwix"
