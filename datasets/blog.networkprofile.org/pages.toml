["https://blog.networkprofile.org/my-backup-plan-lessons-learned"]
title = "My Backup Plan & Lessons learned"
description = "This is the first part of my plan to archive family photos for long termstorage. The second upcoming part is archiving to LTO Tape Why am I doing this? I came to the realization that if an old picture got deleted or corrupted, itmight be many years until I realize that is the case. By then my ba…"
full_description = '''My Backup Plan & Lessons learned spookyghost Jul 20, 2020 • 21 min read I've posted about my backup plan before, but a lot of things have changed, and I have learned a lot about what works, and what doesn't work for me. Skip to the end of the post if you just want to see my backup planLessons learnedOver the past 5 or 6 years I have really refined my backup plan, and I have identified multiple problems with my plan. In no real order, here is the negativesBeing too cheap:The main problems with my setup is that despite spending thousands of dollars per year on IT products, I am hesitant to actually spend money on software or services. This is really stupid, as not doing so means your backups simply don't work, or you spend way too much time troubleshooting your backups. This isn't too bad when you don't have much to do, but I found after buying a house I am very, very busy. This means when backups fail, it might be a week before I even get to look at them, this is clearly a problem. Here is where I didn't spend money and how it hurt me. These actually might fit other categories for you, however for me it was because I was too cheap Storage not fit for purposeI already had an Office365 Subscription, so I had a ton of OneDrive for Business storage, and a ton of Sharepoint Cloud storage. Because I was too cheap to spend the $3 or $4 per month for real storage (Such as B2, Wasabi, S3, Azure) I opted to try and use the Office 365 storage for backups using programs like Stablebit CloudDrive and Arq. This worked fine at first, but then I would run into a lot of problems which was the result of the hundreds of thousands of files the applications made, and also problems related to using the API to access the storage in really a way it wasn't meant to be used. This meant that over the years I had to completely delete my backup set, and start over. I couldn't contact Microsoft for support as this was a completely unsupported way to use the storageSince realizing this issue I have moved to a combination of Backblaze B2 and Wasabi, and I have not had a single problem. Software PiracyWe've all been there, or at least I think we have. You see some software for $39.99, but you can also find a crack for it online... awesome. Save the $40 and get it for free. I've done this a few times for software, and each and every time it has come back to bite me in the sense than now my backups are useless once the application finally realizes its being pirated. Your only options are to either purchase the software, or completely move off the platform. This is a giant waste of time, and you get NO SUPPORT! In hindsight, I should have just payed for the software I needed instead of pirating it, or pirating alternative software, or substituting free software that didn't do the job I needed.Updating software too soon:I have been bitten by this so many times, yet I keep doing it. Because I am interested in technology, when the new software comes out I will update it with no testing, and no real thought. This has caught me out in multiple ways OS UpgradesMultiple times I have upgraded my OS, Weather it be Windows Server, Debian or VMware ESXi. I've updated to Windows Server 2019 only to find that Veeam or my other backup software does not support it, resulting in a giant mess of downgrading (Why didn't I just read the Veeam supported notes?). I've updated ESXi only to find that Veeam didn't support that, resulting in having no VM backups until Veeam released an update, and I have updated Debian only to find that the tools I were using are now not supportedAll of these could have been avoided if I just wanted for the OS to mature, or to just read the damn notes! Incomplete or buggy SoftwareThis was a real problem for me just recently. I have been using Arq 5 for as long as I can remember, and its worked great. When Arq 6 got announced I bough the upgrade right away on launch and upgraded my system. After all, it says it was compatible. Well, it wasn't. It completely wrecked my 4TB cloud backup set and was plagued with problems. (To the point many people jumped ship!) Eventually they completely removed the backwards compatibility with Arq 5 and had to scramble to fix hundreds of bugs. It was clear this software was completely untested, yet I upgraded without a thought. In the end I downgraded back to Arq 5 and had to upload another 4TB of dataOver complicated setups:I have been guilty of this too. I want a specific design, and I will refuse to believe its simply not possible or not a good idea, so I will shoehorn 5 different tools and applications together to make my solution, only for it to flat out not work, or come crashing down later on, or worse, failing when you need to restore data Unsupported solutions and configurationsAt one point I was using StableBit Drivepool together with Stablebit CloudDrive to form a storage pool backed by OneDrive and Sharepoint, and using Robocopy to move the data. When I had a problem with this, who do I turn to? I troubleshoot Robocopy only to find its doing exactly what it should, I contact Microsoft who just laughs at what I am trying to do, and I contact Stablebit who confirms their software is working as intended. The solution I had made was completely unsupported, not only for getting help, but just for working at all. Weeks were sunk into this, only for it to be a waste of time eventually. Too many moving pieces Not only was this an unsupported use case for many of the tools I was using, but it was just relying on too many moving pieces. Any one of those fails and the whole thing comes crashing down. Stick to a basic, supported solution or configuration and you will do much better. Even if it doesn't fit your needs, you should just move on to a different solution or accept that your needs are unrealistic and cannot be met. Too many changes, too quickIn some of these more complicated setups I would make changes almost daily to try and improve the setup or fix little problems, this meant I never really knew the long term reliability of the solution, and often times the backups were being re-uploaded all too often which meant that historic data was being lost. The most basic backup solution I had setup is also the first one, Synology HyperBackup. I have since grown to love this tool as its very simply, and it just works. Its been chugging along in the back for years, and I can still restore a file from my very first backup. Keeping things simple again has come out ahead Relying on unsustainable tools or services:This has caught me out more times than all of the other problems combined, I will set something up which works great, but its just a ticking time bomb "Unlimited" storageSo far I have been caught out by this three times, and I can say I will never be caught out again. If a deal is too good to be true, it probably is. If any company sells you "Unlimited" storage for a flat fee, its just a scam. There is no way they can fulfill that promise, so they are lying to you.First I used OneDrive's unlimited storage. I didn't have a sophisticated plan in place so I manually uploaded files using my slow connection. After wasting a ton of time doing this, they killed the unlimited storage...So I moved to CrashPlan Home which was "unlimited" for $5. The initial problem is that the client would use more and more RAM the more storage you used. I personally believe this was on purpose to discourage large backup sets. I actually ended up giving CrashPlan its very own VM with 32GB of RAM just to backup my data. While this worked, it eventually was pointless anyway as CrashPlan decided that their home service was unsustainable and killed it off. This meant you had to download all your data fast (Which was not possible because of the slow speed of the service), lose it, or migrate it to CrashPlan Pro. Even migrating to CrashPlan Pro, there was a limit to the backup size during the migration. This caused many people to lose their backups. The months it took for my initial backup was wastedBut I didn't listen to myself, and I moved to CrashPlan Pro. This was double the cost at $10, so still too good to be true. It worked okay for a little while, until they announced they would stop backing up certain file types, and remove them from existing backups... uh oh. While the file types listed didn't affect me, it made me realize they were starting to feel the pain again of unlimited storage, and at any time they could add more files types and just kill your backups. So I moved off this, again wasting the time I had spent uploading all my data yet againNext up I saw Amazon Cloud Drive. This was $60 a year for unlimited storage. Awesome! So I re-uploaded another 15TB of data which on my then slow connection took forever. Once it was up there it was alright, but I did run into a few issues resulting from using the API. (See the earlier point of "Storage not fit for purpose") For a while it was going great, and because it was unlimited I just backed everything up, forever. I had over 40TB of encrypted data in my drive which I'm sure caused them some pain. Being encrypted they can't de-dupe any of it, and there is no way you can turn a profit from selling 40TB of hot storage for $60 a year. Eventually that came, and they bumped all the accounts down to 1TB and slowly removed your data... After this I pruned my backup set down and tried to use OneDrive again, but in the end the solution was to use a pay-as-you-go type storage provider like B2. It truly is unlimited, but you will pay more as you add data. They can never decide to just reduce the amount of storage available, as I pay for it.I'm sure a lot of you are using G-Suite, and I can 100% guarantee the gravy train will end soon enough. They are already implementing API throttling and the 750GB per day limit, and I'm sure more is to come NFR Software / Free Version of paid softwareSo far this has not yet caught me out, but it got close. I am very aware of how my backups could derail if any changes are madeI currently use Veeam Backup and Replication via their NFR key. I backup all my VM's using Veeam and I use their replication as well. Last year they changed from a Socket based licence to an instance based licence. I was using 18 "instances" according to their new model, but they now only gave you 10...I tried pairing down my backups, but without merging systems together or doing some hackery, there was no way I could proceed. Luckily they increased the instance count on the licence to 20 which solved my issue, but I am well aware how close I came to having my VM backups halted.This goes for any free version of paid software. Just like many other services such as Dropbox and Evernote, eventually the company will pull features from the free software to save costs or to get users to move to the paid version. Datacenter ColocationA lot of people, myself included think its very cool to have space in a rack at a datacenter. Its very secure, the power is stable and you don't need to worry about HVAC. I have a post about my datacenter colo server which you should check out if you haven't alreadyIn two cases using using colocation has been a problem for either me or someone I knew, all because of cost. Even if you do get a good deal, I think you should keep in mind if this is a sustainable deal, and if the price increases if you are willing to pay. For personal use, a colo is almost always too expensive I think A friend got a fantastic deal on a 3 year contract for 2u of rack space for just $60/mo with a 1G symmetical line with 35TB per month of bandwidth. He moved more and more services out there, and had all of his backups and replication going out there. Everything was great!... Until the contract ended and they then bumped the price up to over 5x what we he was paying before. Now he had to rush to get his hardware back from another state which was a huge hassle, and all of his backups stopped while this was happening. He then had to find replacements for extremely sophisticated setups he took for granted.I had a similar problem in that I had 1u of rack space for free. But it was through my employer which comes with a similar set of problems. Eventually I found a better job opportunity which meant that I had to rip out all of my equipment and try and replace the functions of a full ESXi setup I had in "the cloud", thats a tough task Expensive enterprise hardware you got for cheapWe all love a good deal on eBay, but if you are going to use whatever you bought for backups that need to run no matter what, make sure you can actually support that equipment and fix it if it breaks. Recently I got a killer deal on a tape library. I paid around $200 for over $4000 worth of equipment, awesome!I knew this was unsustainable hardware so I never used it for anything critical, so I just backed up media with it. Well a few weeks ago one of my tape drives started to have problems. If I was using this for my important backups and only had 1 drive, I would be forced to spend around $2000 on a replacement tape drive (Which lets face it, I won't do). Make sure the equipment you are using can be in service for a reasonable about of time even if it breaks, you don't want to be switching backup solutions every few months or you lose your historic data without doing a lot of extra workThe other thing to think about with tapes, is what happens if someone steals your tape library along with the rest of your lab? Well now you need that tape drive to get your data back! Good luck. Unreliable physical storage locations I never thought this would be an issue, but part of my off-site/off-line backups were keeping a storage drive in my desk at work. This was great, and how can it fail? Well now with COVID19 I work from home... Now my off-site backups are on-site. Luckily I have other off-site backups, but if this was my only one, all my data would now be on-site, instead of off-site!To fix this I am looking into making secure storage elsewhere on my property, or using something like a safety deposit box or storage unit that I should be able to access no matter what Not enough resources (Money & Internet) By resources I don't mean hardware, because even guys with no spare income manage to acquire a full rack of servers and a 100TB NAS at home, somehow. The issue comes when you now want to back up a large amount of data, but just don't have the resources. Backing up 30TB of data is expensive. You can't just expect to backup all that while complaining about spending $10 a month, sure you can probably find a home for the data, but I'd bet a millions dollars its not going to last. I think people need to be realistic when sizing their setups in the first place, and really think if they can sustain what they are trying to do. The other side of the coin is internet. You might have all the money in the world, but if your pipe at home is too small, you are not going to be able to do cloud backups. I had 15TB of data I wanted to'''
