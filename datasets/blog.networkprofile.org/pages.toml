description = """
I needed some lights outside so I could sit at my picnic table at night without it being pitch dark. I decided to install some 4 inch recessed lights with a dimmer switch

My table is right next to my garage, so I have easy access to power and a"""
full_description = '''Recessed Lighting and Electrical Receptacle install for Picnic Table spookyghost Jan 23, 2020 • 2 min read I needed some lights outside so I could sit at my picnic table at night without it being pitch dark. I decided to install some 4 inch recessed lights with a dimmer switchMy table is right next to my garage, so I have easy access to power and a place to mount the lightsThese are the parts I chose for the install, the HALO Lights just require a hole to install and nothing elseI also used some outdoor electrical boxes and covers, along with a 4-1/4" hole sawFirst I marked and drilled the holes. I went on the inside and made sure I wasn't going to hit any roof structure firstThe light slid in with no issue. First I fished the romex through and connected it, and then pushed it all upI mounted two outdoor plastic electrical boxes to the wall and fished the cable through. I decided while I was running electrical I may as well install a receptiple tooHere it is with the switch and receptacle, note that I switched them around. I installed some washers between the two to keep them spaces properlyI decided to use two different colors to differentiate between switch and receptacle. I used a 20a receptacle because its a 20a circuit, seems a waste to limit myself to a 15a plugI really like how these turned outAll powered upLooks great!This is how it looks when it's completely dark out That's all Lessons Learned - The 2024 Houston Derecho 2024 is not even over yet, but so we have already endured two massive storms that caused widespread destruction. This posts goes through the lessons I learned in the first of those 2 storms 2024 Houston Derecho On May 16th 2024, a Derecho hit the Houston area which had very Oct 27, 2024 7 min read Misc Projects and Updates This post is just some small updates to past projects, and some smaller projects that don't really warrant their own full post. Garage Compressed Air Setup Updates Original post: Garage Compressed Air SetupI find myself needing compressed air for nail and staple guns, filling up tires, blowing out Jan 17, 2024 15 min read'''
