full_description = "TinyPilot - An Open Source KVM Over IP DISCLAIMER! - This device was sent to me free of charge from the owner, Michael, who is a redditor and saw some of my other posts and sent me one to use and give feedback on. Now, back onto the device. This device is made from a Raspberry Pi and Oct 14, 2020 5 min read My whole house Ruckus WiFi setup When I moved into my new home, I expanded my existing Ruckus setup to give me coverage across my entire property. Here is all the details of that setup and why I chose Ruckus over my old Ubiquiti Unifi setup AP's I have 1 Ruckus R510, and two Oct 8, 2020 8 min read Cyberpower UPS's - Try something else... This is now the fourth time I have come across these issues with a Cyberpower UPS. It means your UPS really isn't a UPS, so you may want to think twice about picking one up First thing to keep in mind is that these are line interactive UPS& Oct 6, 2020 3 min read Full Lab Details - September 2020 After posting the full lab history post, a lot of people wanted details on what I do with everything in my home server rack. Here are the full details. I have not cleaned it up for the pictures, so expect some dust and some work in progress If you have Sep 21, 2020 7 min read Homelab 9 Year Homelab history in pictures Since 2012 I have been interested in servers and networking, and started running them at home. Here is a history of changes over the years I don't have full explanations of everything, but ill try to mention things as I go. You will have to excuse the poor Sep 17, 2020 10 min read Home Server Room Power Upgrade + Multi-room UPS This post shows how I upgraded the power delivery to my home server room, as well as installing the infrastructure to replace 5 UPS's around my house with just one large UPS. Why Upgrade the power? The electrical in my home when I moved in was terrible, it Sep 11, 2020 7 min read Private Internet Access VPN on pfSense (Last Updated 08/2020) This guide has been updated to reflect c