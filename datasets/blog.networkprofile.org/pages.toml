["https://blog.networkprofile.org/rosewill-build-quality-fail"]
title = "Rosewill Build Quality Fail."
description = """
Back in 2017 I bought one of the highly regarded Rosewill RSV-2600 cases. It wasn't great.

I had high exceptions since it was a very popular case, its even featured on the reddit.com/r/homelab banner

As it turns out, the build quality was totally terrible.

First, the handles"""
full_description = '''Rosewill Build Quality Fail. spookyghost Dec 31, 2018 • 2 min read Back in 2017 I bought one of the highly regarded Rosewill RSV-2600 cases. It wasn't great.I had high exceptions since it was a very popular case, its even featured on the reddit.com/r/homelab bannerAs it turns out, the build quality was totally terrible.First, the handles were too close to the screw holes, so even with screws with very small heads, it would dig into the handles. This is a standard 19" rackJust the left side had this issue, the right hand side was fine.Next, the IO Shield would not fit in at all. This was a standard Supermicro IO shield that had fit in my Fractal Design case perfectly. Even after I took a file to the Rosewill case, it never fit right. I ended up just living with it. Here you can see how bulged and deformed it is.The final nail in the coffin was the fact they literally do not know how to produce low profile PCI slot covers. The ones they include are backwards...Here you can see me attempting to install a Rosewill cover while normal spec PCI cards are installed As you can see, the screw is on the complete wrong side. They have even accounted for this in their case by adding an extra screwhole on the left hand sideI did end up using the case and finishing the build, I just found some spare covers to use.I contacted Rosewill about this, here is their first replyI waited until the 4th of April and I still had not got a reply, so I emailed back and asked them on a status. I got the following back.I never did get my replacement slot covers from them, but I don't really care all that much anymoreHopefully this helps you make a decision on purchasing a case! Lessons Learned - The 2024 Houston Derecho 2024 is not even over yet, but so we have already endured two massive storms that caused widespread destruction. This posts goes through the lessons I learned in the first of those 2 storms 2024 Houston Derecho On May 16th 2024, a Derecho hit the Houston area which had very Oct 27, 2024 7 min read'''
