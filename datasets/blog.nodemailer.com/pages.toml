["https://blog.nodemailer.com/2017/04/06/v4-0-0-back-to-mit"]
title = "v4.0.0 – back to MIT – Nodemailer. Blog"
description = "Send emails with Node.js – easy as cake!"
full_description = "Posted on April 6, 2017 by andrisv4.0.0 – back to MIT Nodemailer v4.0.0 is now released and is using the MIT license. This version does not bring any other changes, it is a republished v3.1.8 Keith says: April 18, 2017 at 10:22 pm Any particular reason the switch to MIT? Will you still be seeking additional funding to continue development? What does this mean? Reply andris says: May 11, 2017 at 10:55 am I didn’t find any customers willing to pay for Nodemailer Reply Adam says: May 4, 2017 at 6:47 pm Great module! Is there any way we can get support for the gmail extension headers? The same that node-imap supports: https://github.com/mscdex/node-imap#extensions-supported Thanks! Reply jeong says: May 7, 2017 at 11:19 am Can nodemailer only use up to Node v6 engines? I’m using Node v4, but it doesn’t work in Node v4. Reply andris says: May 11, 2017 at 10:56 am Just Node v6 and up which is the current LTS version. I don’t want to go back from `…args` to `args=Array.prototype.slice.call(arguments)` Reply Philippe says: May 10, 2017 at 2:12 pm Hi.. I would like first to thank you for the great job you have done here with your excellent nodemailer. I understood why you changed before the license in v3.x but I was wondering what happened that makes you decide to go back to MIT license…It’s just a little curiosity… Thanks for your answer and again, thanks for your great software..:-) Reply andris says: May 11, 2017 at 11:01 am I did not find any customers willing to pay for it. There were only a lot of people complaining about the change and emailing me asking if the license somehow allows to use Nodemailer without paying for it. Seemed easier to revert the license, collect the little ad revenue the site generates and just forget about it and concentrate on other projects. Reply Kieve says: June 23, 2017 at 6:57 am I’ve been support Koa a little every month. Are you up for donation? https://opencollective.com/koajs/transactions I know it’s not much, but hopefully it can buy you a beer or 2! 😀 Reply"
