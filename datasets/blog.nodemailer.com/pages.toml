non-ASCII text then this is also possible, the content is encoded and the encoding scheme is noted in the header of that node. So the same uuencoded message could be converted to MIME like this: Subject: This is a test message↵ MIME-Version: 1.0↵ Content-Type: multipart/mixed; boundary=abc↵ ↵ --abc↵ Content-Type: text/plain↵ ↵ Test content↵ ↵ --abc↵ Content-Type: application/octet-stream;↵ name="test.txt"↵ Content-Transfer-Encoding: base64↵ ↵ Q2F0↵ --abc--↵ And when opening such email message with an email client we see this: Looks pretty much the same, doesn’t it? So where did the filename test.txt in the screenshot came from? If we look at the source then we see that the Content-Type header has an extra argument called name that defines the filename. This is already pretty awesome, we can use quoted parameters in MIME and inside the quotes we can use almost any (but no all) printable ASCII characters we like. So no filenames that have special characters like quotes and still lightyears away from emojis but we already can have words separated by spaces as filename. If we would like it so. At this point the non-english speaking countries are starting to tag along and this means a new challenge: non-ASCII characters in message header. Message bodies already can use it, you can set a “charset” argument to the Content-Type header, use some encoding (usually either Base64 or Quoted-Printable) and you’re ready to send some mail, assuming you’re all right with using only latin characters in the subject line and also in the attachment filenames. So in parallel to the RFC1341 a new standard was proposed, RFC1342 that defined something called “encoded-words”. It’s a construct that using only ASCII symbols presents sequences of encoded characters in any character set. If a word in our subject line includes a non-ASCII character, for example an umlaut “test messäge, awesome!” then the Subject header could be formatted like this Subject: test =?ISO-8869-1?Q?mess=E4ge,?= awesome! Unfortunately, encoded-words come with a restriction: these can only be used as an atom and not inside quotes as anything that is quoted is meant to be kept the way it is presented. If we would try to use encoded-words as an attachment filename without quotes it would look obviously wrong Content-Type: application/octet-stream;↵ name==?ISO-8859-1?Q?mess=E4ge.txt?= Notice the double equal sign? This doesn’t seem right at all. So even if we gained support for non-latin characters in the Subject line then we are still limited in our options when using attachment names. We needed an alternative solution and even if it took some time we finally got there. In 1996 RFC2045 re-defined the Content-Type header but this time there was no explicit “name” parameter mentioned. In 1997 RFC2183 fixed this by adding a new header Content-Disposition that has a parameter called filename, suitable for, as the name suggests, defining attachment filenames. In parallel to RFC2813 another standard was released, RFC2814 that together with the newly defined filename parameter finally fixed the long standing issue of non-latin attachment filenames. This was done by introducing yet another encoding scheme, Parameter Values and Parameter Value Continuations. When encoded-words used equals sign to indicate encoded characters and question mark to separate different parts of the scheme then Parameter Values use percent sign for encoding and single quote for separation. Content-Disposition: attachment;↵ filename*=iso-8859-1''mess%4Ege.txt Asterisk in the end of the parameter name indicates that the value uses Parameter Value encoding. The same mechanism allows splitting long values into multiple chunks (thats the Continuation part) but this is not super important, so we will not cover it here. What is super important, is that the changes done in 1997 allow us to finally use emojis in filenames even if emojis as characters weren’t invented yet. If we want to use a filename like “😁😂’.txt” then this