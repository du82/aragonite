title = "blog.nodraak.fr"
full_description = 'Introduction to Rust and WebAssembly 2020-06-27 Dev Rust WebAssembly In this article, I would like to talk about two technologies I’ve been playing with recently: the Rust programming language and the WebAssembly standard. I’ll start by presenting each of these two technologies and which problems they are trying to solve. Then, I’ll explain what are the advantages of a Rust-powered Wasm module, and why it can be useful. Finally, I’ll provide links to interesting documentation. WebAssembly Since many years, client side web applications, implemented in JavaScript, have been becoming larger and larger. Read the 1227 words... "Too much precision" bug 2020-05-10 Aerospace Reverse Engineering I am currently working on the Rosalind Franklin rover, part of the Exomars 2022 mission to Mars. I develop a software layer to integrate the autonomous navigation algorithms (developed by CNES) with the hardware rover (built by Airbus). CNES has been working on image processing algorithms to give some autonomy to robots. Their expertise is being used, among other projects, in Exomars. Airbus is developing the actual rover, and has defined some APIs to be exposed to allow executing CNES’s algorithms. Read the 2831 words... Calculating the distance to the Moon 2020-02-01 Aerospace On 13th sept 2019, Pauline Acalin, a spaceflight photojournalist, posted two pictures of the Moon, taken 8.5 hours apart. Scott Manley commented “I should try measuring the distance to the Moon with this”. That’s was more than enough to get me started to attempt to do exactly this. After months of procrastination, here is finally an article with my findings and the detailed steps to reproduce them. “Rotating planets come in handy when you want to make a giant stereoscopic gif of the moon […]” - Pauline Acalin Introduction The size of the Earth will be assumed to be known. Read the 1199 words... Flying to the moon with Apollo 2019-06-05 Aerospace About 50 years ago, humans landed on the Moon for the first time. I initially wanted to write on this subject because I like rockets and space, but this anniversary is a nice coincidence. Going to the Moon is not an easy endeavor. It requires an outstanding number of subsystems and components to work flawlessly, and many maneuvers to execute right as planned. Each time a rocket takes off, an engineering miracle happens. Read the 4563 words...'
