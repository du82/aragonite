full_description = '''Launch Windows - How is Matthias Maurer going to join Thomas Pesquet's Halloween party? 2021-11-16 Aerospace Talks Talks - PTS Lunch & Learn This article is a transcript of my talk "Launch Windows - How is Matthias Maurer going to join Thomas Pesquet's Halloween party?" given on the 2021-11-03 at PTS on our weekly "PTS lunch & learn" event. The source of the slides are available on my Github. Introduction NASA’s Crew-3 Mission The leftmost person is Matthias Maurer. He is a German astronaut, and joined the ESA astronaut corp in 2015. Read the 1694 words... GPS trace collection and edition with OpenGPSTracker and Viking 2021-08-24 Miscs I don’t really have a bucket list, but I do have a list of things I want to do: I keep a short list of things to focus on and make progress. I review and update this list yearly or so. Since some time, I have been thinking about running a marathon, and this item has finally made it to this year’s focus list. After reading a couple training plans, I prepared my own, fitting my schedule and time commitment. Read the 731 words... Moon lander project: thrust vectoring with a PID controller 2021-04-18 Aerospace GNC The goal of my Moon lander guidance software series is to learn and gain some experience with an end-to-end aerospace software project, especially on the topic of GNC. I have already written a few articles sharing my findings: for instance, this one about guidance. Today I want to talk about control. I will use the engine gimbal controller of my Moon lander1 project to explain how to design, tune and validate a PID controller. Read the 2049 words... Dimensional analysis in Rust: how not to crash "Mars Climate Orbiter" 2021-03-23 Dev Rust Software is complicated: ensuring that old features keep working, while holding the bugs away, is an every day’s fight. Thankfully, there are many (too often unknown) gems, either built in the language/compiler or as third-party libraries. Some time ago, I introduced SymPy,