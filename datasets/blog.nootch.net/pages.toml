["https://blog.nootch.net/post/thoughts-on-3d-printing-after-a-month-or-so"]
title = "Thoughts on 3D printing after a month or so :: Bruno Antunes — Thoughts, rants, ideas"
description = """
Image of a Creality Ender-3 V3 KE printer, from Creality&rsquo;s website (not an affiliated link, and all opinions my own)
Complex hobbies are fun At the end of 2023, I started on a career break (get in touch if you&rsquo;re hiring!) and I&rsquo;ve done lots of reading, some coding and have recently picked up a 3D printer. I&rsquo;m in love with it, but it is a complex hobby with a lot of variables to tweak, so I&rsquo;m writing these first impressions to give others that might be interested as well some intro to the fascinating world of 3D printing, specifically FDM."""
full_description = "Thoughts on 3D printing after a month or so 2024-04-06 #self-hosting #3d-printing Image of a Creality Ender-3 V3 KE printer, from Creality’s website (not an affiliated link, and all opinions my own) Complex hobbies are fun At the end of 2023, I started on a career break (get in touch if you’re hiring!) and I’ve done lots of reading, some coding and have recently picked up a 3D printer. I’m in love with it, but it is a complex hobby with a lot of variables to tweak, so I’m writing these first impressions to give others that might be interested as well some intro to the fascinating world of 3D printing, specifically FDM. FD- what? There are two big camps in home 3D printing - FDM (Fused deposition modeling) and resin printing. I won’t cover resin printing, as it’s a toxic process that scares me a bit and it also requires UV post-processing for best results but it is the best way to print intricate models with lots of detail, like figurines. FDM is comparatively low in toxicity, and much easier to get into with the downside of prints having lower resolution, thus making them a poor choice for some models. The name comes from how the plastic filament used is heated up and deposited, layer over layer, on a print surface. FDM vs Resin print results for a small figurine In this example comparison of FDM and resin results (source), you can see the layer lines on the FDM print (left) but they’re much less pronounced on the resin print on the right. FDM was invented by S. Scott Crump, who co-founded Stratasys to bring his process to market in the early 90s. Stratasys is still around, but no hobbyist will be able to afford their products which are focused on the enterprise market. The modern low-cost printer started with the RepRap movement in 2005, and really got going in 2009 when the patents (but not the trademark) for FDM expired and commercial entities got involved. I had heard about RepRap, but back then the process was very much tinker-oriented as few true “turnkey” solutions existed, or they required heavy hacking to get good results from. Then I heard about 3D printing again more recently as Bambu Lab (a high-end printer manufacturer with Apple-esque vibes) made a big splash in 2022 with their X1 model printers, aimed at the “prosumer” market and recipient of some awards for their ability to bring 3D printing to the “masses” that can afford a 1k+ price tag for their hardware. It was still too pricey for me, but as I browsed Youtube I started to see more and more 3D printing videos which made me think there was maybe a new player on the market with a more amenable price tag. That’s when I heard of Creality. Creality has a history of making cheap somewhat reliable printers since the launch of their Ender-3 printer in early 2018. I say somewhat because their track record isn’t the best for those early models, but newer ones are seen in a much better light. Most Youtubers will still badmouth it for horrible QA and the need for 23 upgrades for their printers to be acceptable, but my experience with their Ender-3 V3 KE model has been great so far. “Ender-3” is kinda like “Agile” in the sense that it doesn’t mean much in their lineup - printers from 6 years ago or as late as a few months ago still have that name on them, and people have been vocal about Creality’s need to start naming their printers something else (Ender-3 V3 KE is a bit of a mouthful, after all) especially since Ender-3 is used for both bed-slinging and CoreXY models and that’s a bit confusing. Printers in their current lineup include: Ender-3 V3 Ender-3 V3 KE (the one I got) Ender-3 V3 SE Ender-3 V2 Neo Ender-3 Max Neo Ender-3 Neo Ender-3 S1 Plus Ender-3 S1 Pro Ender-3 S1 Ender-3 V2 Ender-3 Pro Ender-3 Max …you get the idea, feels more like an SEO thing than an actual lineup. But I mentioned bed-slinging and CoreXY - what does that mean? Types of printers First, a word on extruders All 3D printers have an extruder assembly that takes filament from a spool and drives it into a heating element and ultimately into a nozzle which then deposits the melted filament onto a build plate, layer by layer. The extruder can either be a direct-drive one, that pulls the filament using a stepper motor, or a Bowden style one that receives the filament as it’s pushed out by a stepper motor placed somewhere else and just “pushed” onto the extruder. Comparison diagram of direct-drive and Bowden style extruders source There are pros and cons to both systems. Direct-drive extruders allow for less “banding” on the print, since the filament is fed in a consistent matter, and they can also pull more elastic filaments that just bunch up on the tube between the motor and the extruder on a Bowden type setup, due to friction. They can also have higher flow rates, for wider nozzles. However, having the stepper motor on the extruder head makes it heavier, which reduces the maximum acceleration the head can have as it moves over the bed. Printer types FDM Printers come in 2 main types: bed-slingers and CoreXY. Bed-slingers are the cheaper ones. The printer’s extruder moves along the X and Z axis - left to right, and up and down. The bed moves back and forth on the Y axis. This setup is cheap, but as you try to achieve higher print speeds, the bed’s movement generates a lot of wobbling, which impacts print quality. CoreXY printers move the extruder in the X and Y axis (left to right, back to front) and the bed moves up and down on the Z axis. This makes for less vibration and ultimately a more stable print, but you need a frame, more motors and more belts, which in turn implies a more powerful controller board for the whole printer. Thus, they tend to be more expensive. But they are also easier to enclose, if you need to remove toxic fumes or achieve higher temperatures for certain filaments. I mentioned “main” types because there are also Delta printers, which take a different approach to the extruder assembly. Here’s a video: These printers usually feature round build plates (curiously, the one in the video doesn’t), and they’re even more expensive than CoreXY types. Delta printers are fast and very accurate, but they’re also expensive and have limited build space, with tall models being a particular plus. Other printer types do exist, but they’re relatively obscure. My printer is a bed-slinger which felt like a good place to start, and affordable at around €300. I got some upgrades which seems to be the thing to do with any printer, Ender-3s in particular 😅 Components of a 3D printer The main components for a printer are: Extruder assembly Print bed (which can be heated or not) on which you place a Printing plate Stepper motors and belts Controller board Spool holder I’ve already mentioned extruders. One thing I haven’t mentioned is the nozzle. You can find nozzles in 0.2, 0.4, 0.5, 0.6 and 0.8mm widths easily, with other sizes like 1.0mm being a bit harder to find. The nozzle width will determine how fine your prints can be, but of course smaller ones will imply lower flow rates and thus longer print times. Sometimes much, much longer. Think of it as the pixel size for your models. Normal nozzles will be made of brass, which is fine for normal PLA but some filament types can be infused with harder materials like carbon fiber that will completely file away your nozzle’s aperture in just a few prints. For those types of filament, a hardened steel nozzle is a must and you can even go all-in and get an amazing diamond-tipped nozzle that basically lasts forever. Heated print beds are great for higher adhesion of some materials, sometimes essential - with Nylon for example. I wouldn’t buy a printer without a heated bed. They are usually made of steel. Print plates go on top of the heated bed and are usually made of some material that other plastics don’t stick to, like PEI or glass. The PEI coating can be rough or fine, with fine ones making it harder to remove your prints but a big help when printing taller models - the inertia differential between the top and bottom of the print due to the slinging of the bed might make it impossible for the print to stay on the bed. Glue can help your prints stay on, and normal UHU sticks work great for this purpose. Some filaments require specific glues to stick to anything. Stepper motors and belts are a must, and you can usually tell how good a printer is by how much “backlash” the motors have. This is the measure of how much wiggle you can get out of a belt when the motor is stopped. If it wiggles a lot, your prints will vary from each other and from the intended model even if you use the same filament. The controller board makes the whole thing work, and they vary in processor capacity. There are still 8-bit models like the ATmega2560 being used for new printer models, and they get the job done. But most medium to high-end ones are 32 or 64-bit ARM parts. It won’t surprise you to know most of them run Linux, but more on that on the software section. The spool holder can vary from a simple plastic piece, to more elaborate multi-color setups like Bambu Lab’s AMS that only works with their printers (they are trying to be the Apple of the market, after all 😄). Filament types Of course, every printer turns spools (or pellets) of plastic compounds into physical objects. There are ALOT of filament types, and even subtypes within the main ones. PLA PLA is the most common and usually cheapest filament type. Made usually from corn starch, every shop will have PLA, and even some of its common subtypes like PLA+ or Silk PLA. This filament is a good all-rounder, and has easy to achieve melting temperatures usually in the 190-230C range - well within the reach of common printers. The same lower melting temperatures make it unsuited for high temperature applications. It’s also not very tough, so prints for models subject to high mechanical stresses are not advised. On the plus side, its fumes are non-toxic. PLA+ or PLA-HT tries to mitigate the temperature aspect by being a bit more resistant, and Silk PLA’s appeal is the coloring effect on your prints, to the detriment of its sturdiness as it’s even less resistant to impacts than normal PLA. PLA is great, you should definitely start with it. My printer came with a “HyperPLA” sample from Creality, and you can tell the difference from normal PLA. Not sure it justifies the premium, though. PETG PET is one of the most common plastics, most water bottles are made from it. It’s also very tough so those parts subjected to mechanical stress that PLA can’t handle are a great target for PET prints. Straight up PET is too hard to print with a cheap printer, so glycol is added to it hence the G in PETG. PETG requires a higher temperature to print, and a heated bed is almost a necessity. ABS Acrylonitrile-Butadiene Styrene is what Lego bricks are made of! It’s relatively easy to print even if it requires higher temperatures than even PETG, but emits somewhat toxic fumes when printing. Compared to PETG, it’s harder but less flexible and durable. ASA Acrylonitrile-Styrene Acrylate is very similar to ABS, but with one advantage: much improved UV resistance! So if your parts are going to be outdoors, ASA is a must. It requires a bit higher temperatures than ABS, with a heated bed a must at around 80-110C. An enclosure is basically required to maintain temperatures constant during printing and avoiding warping. TPU Thermoplastic Polyurethane (TPU) is a flexible filament for all those stretchy models (phone cases, etc.) It absorbs humidity like crazy, so a dry box is surely needed. Being a stretchy material, printing it is especially challenging (I haven’t tried it, yet). Nylon Nylon has very desirable qualities for prints: it’s very durable, resilient, tough, can be easily colored and is UV resistant. It’s however very expensive, sensitive to humidity, prone to warping if the temperature is not just right and has very short shelf life so make sure to use up the whole spool in under a year or so. It requires sustained 300C or more for printing, so entry-level printers usually can’t handle it too well. PEEK, PEKK, PC, etc. There are other more exotic filaments and sub-types of PLA and ABS/ASA like the carbon fiber PLA I mentioned, these are just general properties. Always check with your supplier for required heater and bed temperatures and any special care they might need. For more info, Zach Freedman has an extensive and highly entertaining series on YouTube of printing with every filament type he could find on Amazon. Storing filament Filament tends to react to moisture in the air - this process is called hydrolisation and is non-reversible, so if your filament gets too moist for too long it will become an unusable spool of easily warped gunk. Keeping it under 25% relative humidity is a good rule of thumb. There are a few solutions for storing and drying filament, even one by Creality themselves but in keeping with the maker vibe, I’ve made my own and am super happy with how it turned out. I wanted something like a Sterilite 20 Quart clear gasket box, as these come with a handy seal, but they’re impossible to find in Portugal for some reason and hella expensive to import. The solution I ended up involved a normal (no seal) plastic box, some insulating tape, sealing foam and 2 dehumidifier pouches. one of the custom dry boxes close-up of the humidity sensor (18.9%) humidity sensor in the room, for comparison (45%) the custom seal solution the other box, even drier Coupled with a Zigbee sensor that I could link to my IKEA Dirigera hub, I get pretty good results. Their humidity percentage is usually at half or less of what the room is. It’s been raining here lately, and for an ambient rate of 80%, the boxes are steadily below 40%. As a plus side, the dehumidifer pouches are reusable with just 6 minutes in the microwave when the symbol on them turns pink. After mere seconds of opening the box, the humidity levels with the ambient rate of the room, but it’s easy enough for it to come back down again. the dehumidifier pouches The printer I got I’m quite happy with the Ender-3 V3 KE, this is how I have it set up. my setup To mitigate vibration, I have placed two 2Kg weights on each side of the front - they help a lot, and might just be the most cost-effective significant upgrade you can have. Even better would be to not use a €10 IKEA table for this, or using an even heavier concrete slab under the printer. The only other upgrade I’ve done so far is adding two mounts (the white parts on the extruder and the bed, on the right) for the accelerometer from Creality that allows for better calibration of the printer. The model for the mounts is great and available for free from Printables. accelerometer mounts The software side of things Arguably, one of the things that made printers so accessible has been improvements in the software side of things. But first let’s talk about what printers actually need to print a model. Most models you "
