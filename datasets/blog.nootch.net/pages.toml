["https://blog.nootch.net/projects"]
title = "Projects :: Bruno Antunes — Thoughts, rants, ideas"
description = """
I&rsquo;m currently employed at Onfido as a full-stack developer, doing mostly Elixir, Ruby and Javascript. Before that, thoughtbot.
I have open sourced some things:
 state_shifter State machine gem (Ruby) grape_papertrail Integrates PaperTrail auditing with the Grape API framework (Ruby)  I love new languages, so I also dabble in some Crystal in my spare time."""
