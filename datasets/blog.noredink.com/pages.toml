description = "NoRedInk is on a mission to unlock every writer's potential."
full_description = "2 years ago Word Labels Working at NoRedInk, I have the opportunity to work on such a variety of challenges and puzzles! It’s a pleasure to figure out how to build ambitious and highly custom components and applications.Recently, I built a component that will primarily be used for labeling sentences with parts of speech.This component was supposed to show “labels” over words while guaranteeing that the labels wouldn’t cover meaningful content (including other labels). This required labels to be programmatically and dynamically repositioned to keep content readable:It takes some CSS and some measuring of rendered content to avoid overlaps:All meaningful content needs to be accessible to users, so it’s vital that content not be obscured.In this post, I’m going to go through a simplified version of the Elm, CSS, and HTML I used to accomplish this goal. I’m going to focus primarily on the positioning styles, since they’re particularly tricky! Read more 2 years ago Custom Focus Rings Many people who operate their devices with a keyboard need a visual indicator of keyboard focus. Without a visual indicator of which element has focus, it’s hard to know what, say, hitting enter might do. Anything might happen!It’s reasonable to think that either the browser or the operating system should be in charge of making sure keyboard focus is perceivable to keyboard users. You might think that it’s best for devs not to overwrite focus styles at all. However, if your website is customizing the look of inputs, there’s a good chance that the default focus ring won’t actually be visible to your users.This is the situation we found ourselves in at NoRedInk, and what follows is what we did to improve things. Read more engineering elm accessibility colors 2 years ago Presenting Styleguide Colors The Web Content Accessibility Guidelines (WCAG) include guidelines around how to use colors that contrast against each other so that more people can distinguish them. Color is a fuzzy topic (brains, eyes, displays, and light conditions are all complicating factors!) so it’s a good idea to rely on industry-wide standards, like WCAG. The current version of the WCAG standards define algorithms for calculating luminance & contrast and set target minimum contrasts depending on the context in which the colors are used.These algorithms should be used for their primary purpose – ensuring that content is accessible and conforms to WCAG – but they can also be used for other purposes, like making colors in a styleguide presentable. Read more engineering elm accessibility colors"
