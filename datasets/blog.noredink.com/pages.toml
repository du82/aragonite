full_description = '2 years ago Presenting Styleguide Colors The Web Content Accessibility Guidelines (WCAG) include guidelines around how to use colors that contrast against each other so that more people can distinguish them. Color is a fuzzy topic (brains, eyes, displays, and light conditions are all complicating factors!) so it’s a good idea to rely on industry-wide standards, like WCAG. The current version of the WCAG standards define algorithms for calculating luminance & contrast and set target minimum contrasts depending on the context in which the colors are used.These algorithms should be used for their primary purpose – ensuring that content is accessible and conforms to WCAG – but they can also be used for other purposes, like making colors in a styleguide presentable.Colors & BrandingNoRedInk is an education technology site, and the vast majority of our users are students. We use a lot of colors!To keep track of our colors, we have one file that defines all of our color values with names. We use the Elm programming language on the frontend with the Elm package rtfeldman/elm-css, so our color file looks something like this:module Nri.Colors exposing (..) import Css exposing (Color) redLight : Color redLight = Css.hex "#f98e8e" redMedium : Color redMedium = Css.hex "#ee2828" ... (But we have around 70 named colors instead of two.)We also have a styleguide view that shows each color in an appropriately-colored tile along with the color’s name, hex value, and rgb value. These tiles help facilitate communication between Engineering and Design.But how to present information on the color tiles? How can we make sure that the name and metadata about the color are readable on top of an arbitrarily-colored tile?We can apply some of the color math that WCAG uses when considering contrast!Luminance & ContrastThe calculation for “relative luminance” takes a color defined in terms of sRGB and figures out a rough approximation of perceptual brightness. “Relative luminance” is inherently conceptually squishy, but it is a reasonable representation of how prominent a given color is to the human eye.The relative luminance of pure black is 0 and the relative luminance of pure white is 1.Once you have the relative luminance of two colors, you’re ready to figure out the contrast ratio between them.(L1 + 0.05) / (L2 + 0.05)L1 is the relative luminance of the lighter of the colors, andL2 is the relative luminance of the darker of the colors.For black and white:(whiteLuminance + 0.05) / (blackLuminance + 0.05) (1 + 0.05) / (0 + 0.05) 21 Css.Color -> Html msg viewColor name color = dl [ css [ -- Dimensions Css.flexBasis (Css.px 200) , Css.margin Css.zero , Css.padding (Css.px 20) , Css.borderRadius (Css.px 20) -- Internals , Css.displayFlex , Css.justifyContent Css.center -- Colors , Css.backgroundColor color , Css.color (Css.hex "#00") ] ] [ div [] [ dt [] [ text "Name" ] , dd [] [ text name ] , dt [] [ text "RGB" ] , dd [] [ text color.value ] ] ] Ellie example 1The content that is supposed to be showing on each tile is often totally illegible!We know, though, which colors have the minimum and maximum luminance (black and white respectively), which means we know how to figure out whether to use black or white text on any arbitrary color tile.At NoRedInk, we use the highContrast function from the color library tesk9/palette. tesk9/palette and rtfeldman/elm-css model colors differently, so we do need to do conversions back and forth, but the advantage is that we get nice-looking, readable color tiles without resorting to box-shadow effects or background color tricks. Depending on what rendering libraries you’re using, you may or may not need to do conversions.viewColor : String -> Css.Color -> Html msg viewColor name color = let highContrastColor = toCssColor (SolidColor.highContrast (fromCssColor color)) in dl [ css [ -- Dimensions Css.flexBasis (Css.px 200) , Css.margin Css.zero , Css.padding (Css.px 20) , Css.borderRadius (Css.px 20) -- Internals , Css.displayFlex , Css.justifyContent Css.center -- Colors , Css.backgroundColor color , Css.color highContrastColor ] ] [ div [] [ dt [] [ text "Name" ] , dd [] [ text name ] , dt [] [ text "RGB" ] , dd [] [ text color.value ] ] ] Ellie example 2Now the content is legible on each tile!Legible according to which WCAG level?I mentioned previously that context (including the target WCAG conformance level) influences the minimum level of contrast required. The highest WCAG level, AAA, requires 7:1 contrast for normal text sizes, which means if our high-contrast color generation always picks a color with at least a contrast of 7, we won’t need to worry about the contextual details.However, for colors with a luminance between 0.1 and 0.3, neither black nor white will be high-enough contrast for WCAG AAA. Either (not both!) black or white will be sufficient for WCAG AA, as the contrast is higher than 4.5.Ellie with elm-charts code that produced the diagramWhat sorts of colors might have a luminance between 0.1 and 0.3?Relative luminance is defined as:L = 0.2126 * R + 0.7152 * G + 0.0722 * B where R, G and B are defined as:if RsRGB - if GsRGB - if BsRGB and RsRGB, GsRGB, and BsRGB are defined as:RsRGB = R8bit/255GsRGB = G8bit/255BsRGB = B8bit/255Relative luminance definitionI don’t want to dig into the details of relative luminance too much, but it’s worth paying attention to the different weights for red, green, and blue in the equation. Since the weight for red is 0.2126, pure red falls right in the zone where it cannot be used for WCAG AAA-conformant normal text.NameRGB colorLuminanceWhite contrastBlack contrastRed(255, 0, 0)0.21263.995.25Green(0, 255, 0)0.71521.3715.3Blue(0, 0, 255)0.07228.592.44Going FurtherThere is lots more we could do with these color tiles. We could print the color value in other color spaces (if using tesk9/palette, this is easy to do with SolidColor.toHex and SolidColor.toHSLString). We could add a grayscale toggle (see SolidColor.grayscale) to help folks consider if they’re using only color to indicate meaning (see “Understanding Success Criterion 1.4.1: Use of Color”). We could organize colors by purpose, by hue, by luminance, or by some combination thereof. We could add a chart showing all our colors & their contrast with all of our other colors, so it’s easy for designers to check which colors they can use in combination with other colors. We could also consider the user experience we want when users have adjusted operating system-level color settings, like the popular Windows high contrast mode (learn more about Windows high contrast mode specifically in “The Guide To Windows High Contrast Mode” by Cristian Díaz in Smashing Magazine).Contrast & luminance values are key building blocks in presenting colors in a styleguide, and, luckily, they are fun values to explore as well.Future WCAG versionsNow that I’ve got you excited about WCAG 2.1’s contrast calculation, I should also warn you that the 3.0 version of the color guidelines will almost certainly change dramatically. Until WCAG 3.0 is much further along, you likely do not need to understand the changes. The new version promises to be interesting!If you’d like to play with the WCAG 3.0 Advanced Perception of Color Algorithm (APCA), the website Contrast tools is a nice place to start.Future CSS propertiesSomeday, it will be possible to select high-enough contrast colors for a given context directly in CSS with color-contrast(). Watch this snippet from Adam Argyle’s 2022 State of CSS presentation to learn more. Be sure to check support for color-contrast before using it anywhere user-facing, though.Tessa Kelly@t_kelly9 engineering elm accessibility colors'
