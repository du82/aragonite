title = "NoRedInk"
description = "NoRedInk is on a mission to unlock every writer's potential."
full_description = "4 years ago A QA Interview We Never UsedAbout five years ago I was working on a QA interview process and got the following suggestion: “You’ve just arrived at the airport and have two hours before your flight to Hawaii. Make a list of everything that could go wrong between now and when the flight lands.”No information about how to assess the candidate’s response was provided, and I had another concern. I remembered growing up in Maine and taking a vacation once a year: we’d rent a house on a lake for a week and drive to it in the family car. For my parents, this type of vacation was a huge luxury, something the generation before had never been able to do; I doubt flying to Hawaii, or anywhere else, ever really entered their minds. At the age of 23, I had flown a total of three times in my life, and always between New England and Arizona. Read more qa interviewing engineering 5 years ago What would you pay for type checking? Here’s a statement that shouldn’t be controversial, but is anyway: JavaScript is a type-checked language.I’ve heard people refer to JavaScript as “untyped” (implying that it has no concept of types), which is odd considering JS’s most infamous error—“undefined is not a function”—is literally an example of the language reporting a type mismatch. How could a supposedly “untyped” language throw a TypeError? Is JS aware of types or isn’t it?Of course, the answer is that JavaScript is a type-checked language: its types are checked at runtime. The fact that the phrase “JavaScript is a type-checked language” can be considered controversial is evidence of the bizarre tribalism we’ve developed around when types get checked. I mean, is it not accurate to say that JavaScript checks types at runtime? Of course it’s accurate! Undefined is not a function! Read more types 5 years ago Cypress in Action: A Few Months InThree months ago, I wrote Going Automative: Increasing Quality. At that time, we (the NoRedInk QA team) had chosen an automated testing tool to use (Cypress), and we’d used it to start to introduce automation into our testing. Read on to learn how we’ve been getting on in the months since then! Read more engineering testing qa"
