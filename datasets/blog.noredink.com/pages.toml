full_description = "2 years ago Custom Focus Rings Many people who operate their devices with a keyboard need a visual indicator of keyboard focus. Without a visual indicator of which element has focus, it’s hard to know what, say, hitting enter might do. Anything might happen!It’s reasonable to think that either the browser or the operating system should be in charge of making sure keyboard focus is perceivable to keyboard users. You might think that it’s best for devs not to overwrite focus styles at all. However, if your website is customizing the look of inputs, there’s a good chance that the default focus ring won’t actually be visible to your users.This is the situation we found ourselves in at NoRedInk, and what follows is what we did to improve things. Read more engineering elm accessibility colors 2 years ago Presenting Styleguide Colors The Web Content Accessibility Guidelines (WCAG) include guidelines around how to use colors that contrast against each other so that more people can distinguish them. Color is a fuzzy topic (brains, eyes, displays, and light conditions are all complicating factors!) so it’s a good idea to rely on industry-wide standards, like WCAG. The current version of the WCAG standards define algorithms for calculating luminance & contrast and set target minimum contrasts depending on the context in which the colors are used.These algorithms should be used for their primary purpose – ensuring that content is accessible and conforms to WCAG – but they can also be used for other purposes, like making colors in a styleguide presentable. Read more engineering elm accessibility colors 2 years ago SVGs as Elm Code Moving SVGs out of the file system and into regular Elm code can make icons easier to manage, especially if you find you need to make accessibility improvements. Read more engineering elm accessibility"
