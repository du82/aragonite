title = "NoRedInk"
description = "NoRedInk is on a mission to unlock every writer's potential."
full_description = "3 years ago Tuning Haskell RTS for Kubernetes, Part 2 We kept on tweaking our Haskell RTS after we reached “stable enough” in part 1 of this series, trying to address two main things:Handle bursts of high concurrency more efficientlyAvoid throttling due to CFS quotas in Kubernetes If you’re unfamiliar with it, here’s a comprehensive article from OmioWe also learned some interesting properties of the parallel garbage collector in the process. Read more haskell kubernetes 3 years ago Tuning Haskell RTS for Kubernetes, Part 1 We’re running Haskell in production. We’ve told that story before.We are also running Haskell in production on Kubernetes, but we never talked about that. It was a long journey and it wasn’t all roses, so we’re going to share what we went through. Read more engineering haskell kubernetes 3 years ago Haskell for the Elm Enthusiast Many years ago NRI adopted Elm as a frontend language. We started small with a disposable proof of concept, and as the engineering team increasingly was bought into Elm being a much better developer experience than JavaScript more and more of our frontend development happened in Elm. Today almost all of our frontend is written in Elm.Meanwhile, on the backend, we use Ruby on Rails. Rails has served us well and has supported amazing growth of our website, both in terms of the features it supports, and the number of students and teachers who use it. But we’ve come to miss some of the tools that make us so productive in Elm: Tools like custom types for modeling data, or the type checker and its helpful error messages, or the ease of writing (fast) tests.A couple of years ago we started looking into Haskell as an alternative backend language that could bring to our backend some of the benefits we experience writing Elm in the frontend. Today some key parts of our backend code are written in Haskell. Over the years we’ve developed our style of writing Haskell, which can be described as very Elm-like (it’s also still changing!). Read more engineering haskell"
