["https://blog.phpdeveloper.org/2005/12"]
title = "December | 2005 | blog.phpdev"
description = "3 posts published by ccornutt during December 2005"
full_description = "A (Lengthy) Look Back at PHP in 2005 Well, here it is, the end of another year and it’s times like these that it’s always fun to take a look back to where we’ve come from and how far we’ve made it on various projects. The PHP community has come so far from those early days of January, and I thought I’d take my own look back via some of the news posts that I’ve made over on PHPDeveloper.org in the past year (almost 2000 of em) and see which ones stuck out. So, bear with me on this – I know I’ll miss a few of the biggies, but I’m going to try to highlight things in each month that really effected the community as a whole. If you like it, give it a digg to share it with more of the community. January: Of course, 2005 started off with its share of ideas about the PHP community and where it’s been (and where it’s going). Derick Rethans took the opportunity to look back at PHP in 2004, and the SitePoint PHP Blog (Dynamically Typed) looked forward to this year with a few predictions of their own. The PEAR project started off the year with a bang, releasing version 1.4.0a1 of the base libraries. The php|architect conference, php|tropics, had been announced near the end of 2004, but more details came to us from them about the conference – the wheres, whys, and hows. Tiobe Software noted that PHP had been officially named the Programming Language of 2004 (according to their index). Unfortunately, it’s gotten bumped down a few spots for this year. Zend announced their “Zend Platform” software, a “robust PHP production environment” combining some of their already existing software into a neat little package. They also continued to push their Certification (Zend Certified Engineer) with the help of a new practice certification book with real examples of the types of questions from the test. More big Zend news came later in the month when it was announced that both Intel and SAP were going to invest in the company. Two other unrelated items were also announced – the release of MySQL version 4.1.9 and the posting of the schedule for the International PHP Conference 2005 (speakers and sessions). February: This month saw people really diving into the latest PHP release, 5.1, and included highlights from Davey Shafik on the subject. There was a huge push on security in PHP applications only further spurred on by the break-in on the phpBB website (and lockout of every developer). Everyone from Chris Shiflett to Robert Peake was talking about the best practices to follow to keep you and your site safe. Wez Furlong released a beginning beta of his PDO (PHP Data Objects) functionality and it was announced that PEAR 1.4 was “on the horizion” by Tobias Schlitt. php|architect announced their webcast series, php|symphony and gave more updates for the php|tropics conference. IBM announced that they were going to work with the core PHP developers in some collaborations to help strengthen the PHP community. There were all sorts of opinions passed around about this collaboration, including some from PHP Magazine. Several PHP developers also really started looking around this month and noticing something interesting about the community – the adoption rate for PHP5 was much slower than previous versions. With all of the new features (and some things that broke), people seemed hesitant to make the jump up to this new version. Also, the latest version (at the time) of the popular PHP-based blogging package, WordPress, was released – version 1.5. March: This month, the SitePoint PHP blog shared some opinions on an ever-present struggle in the online programming world – ASP versus PHP, and Zend made an announcement about their upcoming conference – the Zend/PHP Conference & Expo in California. Other conference news, such as the reminder of PHP Quebec 2005, the announcement of the International PHP Conference – Spring Edition, and a call for papers for the PHP West conference were posted. March also marked the public start of one of the most popular web technologies to come along lately – Ajax – and sites like PHP Everywhere wondered (at that time) if it would really catch on. Indicthreads had yet another programming language comparison in the form of a look at whether Java CMS systems could really compare to the massive amount of PHP-based ones out there. In the start of another trend, Chris Shiflett started looking at testing applications with two different tools Apache-Test and SimpleTest. Three big stories happened this month as well – a release candidate for PHP 5.0.4 was posted (RC2), the dowload number for the base PEAR packages passed the ten million mark, and everyones favorite web server celebrated ten great years of development. April: The beginning of this month saw the end of the PHP Quebec 2005 conference, with several blogger looking back at the event, including Jason Lotito, Tobias Schlitt, Chris Shiflett, Sean Coates, and Derick Rethans. It was also announced this month that NASA and Zend were “teaming up” to provide the agency with effective tools to make their lives easier (sorry, no shuttles run on PHP – heh). The PHP Security Consortium also announced that they were going to start a newsletter with various security topics and information on a regular basis. Greg Beaver, that huge proponent of PEAR, also announce that the PHP_Archive package was gaining momentum and had a promising future ahead of it. He also looked at whether it was better to “bundle or PEAR” your applications. Via DynamicWebPages.de, there was a note about the training classes that Zend was now offering for their certification. You could take the class, be prepared for the exam, and get a discount on taking it as well. On the topic of training, the New York PHP Group announced that they were going to offer people in the area (or whoever wanted to come in) PHP training in a two-day session. May: At the beginning of May, the International PHP Conference 2005 was in full swing, and several people were blogging right from the conference, including Sebastian Bergmann (who was also a speaker – “PHP5 – A Year After”). PHP Magazine even had a “blogging from the floor” section on their site where various bloggers contributed their own posts. This was followed up by several of the bloggers/presenters posting photos of the event their roundups and the slides from their talks (including Ben Ramsey and Derick Rethans). This month also saw the start of another conference – the php|tropics conference in Cancun hosted by php|architect. Soon after, other bloggers also posted their own wrapups of this conference (Lukas Smith, John Coggeshall, Andrei Zmievski, Derick Rethans, Jason Sweat) and slides from their presentations. Davey Shafik posted a wonderful announcement on his blog this month as well – the PHP_Archive package, version 0.5.0 was now live and posted for all to use and abuse. Greg Beaver also mentioned that the next version of PEAR (1.4.0) was not “too far off”. He later released a version of the PEAR_PackageFile2Manager package as well. php|architect also announced their latest webcast in their series – “Tackling the PHP Job Market”. May was also the month that the first ever PHP-related podcast went on the air. Marcus Whitney made a post on hsi blog about the idea and began working on his first show. Later in the month, php|architect had their Ajax webcast with Joshua Eichorn (author of the HTML_AJAX PEAR package) and psoted the resulting audio and slides for everyone to enjoy. There was also a post on the ZDNet site in Australia with an opinion from the IBM camp that “LAMP users need to grow up” (talking specifically about the “youngness” of most PHP-based applications). June: As Ajax continued to gain steam in the online community, it became more and more apparent that keeping the Ajax news and the PHP news separate was probably a good thing – so I founded PHPDeveloper.org’s sister site, AjaxDeveloper.org. It uses the same engine and everything, the focus is just different. Announcements related specifically to Ajax were moved over there, and everything was PHP again here. This month also saw a facelift for PHPDeveloper.org as well – a move to a cleaner, news-centric look without a lot of the other features (that never really caught on) in the mix. The last of the slides/wrapups from the php|tropics conference came trickling in (via Marco Tabini) and the call for papers for the 2005 International PHP Conference was posted. Derick Rethans made note on his blog this month that the branch off to PHP 4.4 had been made and things were progressing nicely from there. php|architect made the announcement of their latest conference offerings, the php|works and web|works conferences, appealing to both the PHP side and the general web developers out there. The Pro-PHP Podcast (from Marcus Whitney) posted its first show – an interview with the man behind PDO, Wez Furlong. With PHP5 already out in the wild and developers hungry for more, work on PHP 5.1.0 was pushed even further, and the Beta 1 was posted near the beginning of the month. People began blogging about what the improvements were going to be and what new features it would contain. Later in the month, the Beta 2 was posted as well. The latest release candidate for the PHP 4.4.x series was also posted – PHP 4.4.0RC1. There was focus on a lot of different things through out this month, including: unit testing, a collaboration between Zend and PayPal on the PEAR::SOAP project, the introduction of ThinkPHP Press, work on Services_Trackback (from Tobias Schlitt), and the joining up of PHPDeveloper.org with the Pro-PHP Podcast to further its development (and even do a few shows, such as episode #3, the first PHP-related newscast). The big news this month, however was that PHP was officially turning ten – it had been ten years since Rasmus first cobbled together those scripts to help him manage his pages easily, and it was celebrated with a cake and a CD containing every version of PHP they could get their hands on. Bloggers all posted their thoughts on the occasion, and even looked back at their own history of PHP development, talking about the whens and hows of how they were introduced. July: The beginning of July saw even more development on the Ajax front, and several Ajax and PHP frameworks started to surface. ParticleTree.com posted their look at some of them, including some of the toolkits in the process. The PHP Security Consortium started something that is still very helpful today – the posting of the SecurityFocus summaries for PHP-related security issues. These newsletters contain the various exploits and what software they reference to. The latest show in the Pro-PHP Podcast was posted – another news show, talking about the news for that week, as posted on PHPDeveloper.org. Security was brought back to the forefront, and articles from PHPBuilder.com and IBM developerWorks helped to reinforce that aspect. Later, the PHP team released the first in the 4.4.x series – PHP 4.4.0 – on the 11th. The latest Beta of PHP 5.1.0 was posted as well – Beta 3. Zend also announced thier latest project, the Zend Network, a resting place for the Zend Core – a development/production environment fully supported by Zend. Davey Shafik also announced this month the start of development of his own framework project, Cerebral Cortex. Joshua Eichorn also announced his own project, the HTML_AJAX PEAR package – a blend of PHP and Ajax that makes it easy for any user to take advantage of the combination of both. The International PHP Conference posted their listing of speakers and sessions for their 2005 conference. The Pro-PHP Podcast published its latest, a roundtable session with people like Aaron Wormus and Ben Ramsey. The folks over at Oracle also published a podcast this month, taking an inside look at the Zend Core software for Oracle connections. Wez Furlong made the announcement of the release of his PDO libraries via the PECL repository to make it simple for anyone to grab and use. Marco Tabini announced a huge PHP-centric project that he’d been developing – the BeebleX search engine – a PHP search that goes through various sites, newsgroups, and other resources to pull in every bit of information it can on your given topic. Of course, there were a few bloggers who posted opinions after its launch, including John Coggeshall. Another very popular item this month was the Ajax tutorial what Rasmus posted, a “30 second Ajax tutorial” that provided a bare-bones look at how to use PHP and Ajax together to do something simple. Finishing up the month was a note about a contest that APress was putting on to generate Mandelbrot fractals in the language of your choice – which eventually would yield a PHP winner (in its category). August: Adam Trachtenberg started off the month with his tutorial on integrating the eBay API with PHP using some of the latest features that PHP5 had to offer (and a little Ajax on the side). php|architect had reminders about some of its training programs that it offers – a look at “PHP Essentials” and “Professional PHP Development”. There was a Call for Papers from the International Open Source Database Conference group, and some photos posted from the previous OSCON by a PHPer that attended. Joshua Eichorn was looking for votes for his HTML_AJAX package to try to get it into the PEAR repository. The Register posted an article with the title “Is the Web’s Love Affair with PHP Over?”, talking about some of the recent issues that had popped up with breaking backwards compatibility and the slow adoption rate that PHP5 has seen. The Pro-PHP Podcast posted a new kind of show, one involving one of the big proponents of security in PHP applications, Chris Shiflett – “Ask Chris”. Later in the month, another show would be posted, an interview with Paul Jones (previously of the Solar framework, now with Zend). PHP 5.1RC1 was released (by Ilia) and PEAR 1.4.0 went into a feature freeze before its release. php|architect also announced their latest book this month – the “Guide to PHP Security”. Zend celebrated a big milestone this month as well – the one year anniversary of their Zend Certification program. They celebrated by having all sorts of special promotions and offerings for those wanting to take the exam. Several events, both on location and online, happened this month as well – the Oracle and PHP Installfest at Linux World and the PEAR Online Workshop (involving Tobias Schlitt). In PEAR related items, Davey Shafik looked at the future of PHP and PEAR, and Greg Beaver announced the working version of go-pear.phar (and that PHP_Archive works in PHP 5.1.0+). August also saw some of the more realisitc talk about the next leap in PHP’s evolution – PHP version 6 – and some of the features/fixes that would come with it. Rasmus even posted his “wish list” for the version, really sparking off a huge discussion on what it should contain (on the php-dev mailing list). Chris Shiflett also blogged about it, stating how excited "
