title = "October | 2005 | blog.phpdev"
description = "4 posts published by ccornutt during October 2005"
full_description = "Why Does the PCP (PHP Collaboration Project) Scare Me? Am I allowed to say that this worries me just a bit? Is it normal to think that maybe, just maybe, dropping this much more power into the lap of Zend may turn things a bit sour? Right now, the Zend PHP Collaboration Project sounds more like a vaporware kind of thing – nothing more than promises between companies that they’ll help each other out. I can’t help but wonder, though, if this inclusion of larger companies with influence on this framework might cause some kind of trickle-down effect on the language itself. What happens if, say, IBM comes up with a spectacular module for the framework, but it needs an update to the PHP source to really work. Do the Zend boys make the change to the code that other developers have worked up and made as bug-free as possible? I’m not saying that the framework is all-together a bad thing. I know I’m putting a bit of a negative spin on it all, and maybe that’s just me, but I’m also a bit worried about the PHP community as well. I try to keep on top of things that are happening (especially the news), and most of the press about this announcement has been positive. I just hope that a move to bring more companies “into the fold” of PHP development doesn’t cause too many issues around the community – especially with other framework developers. What’s going to happen to their frameworks if the Zend one, obviously funded and developed by a larger group than most, comes in and blows them out of the water? Will all of these fade into obsolesce? [UPDATE]: They’ve launched their official site about the collaboration today. Am I the only one out there that finds it amusing that the video they placed so prominently not only doesn’t talk about the collaboration at all (seems like a Zend marketing video to me), but it also includes quotes from companies not even involved with the collaboration! __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c86d37419cc', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Posted in PHP on October 19, 2005 by ccornutt. 9 Comments"
