description = "9 posts published by ccornutt during November 2005"
full_description = "Buy my Mac…please? And, in another post from the “let’s abuse the blog” category today, anyone who’s interested in purchasing a like-new dual 1Ghz PowerMac should check out my auction here. It’s one of the Dual 1.5Ghz G4 PowerMacs that came out a while back and I’m selling it as a combo with my 20″ Cinema display as well. I’ve used it from everything to a little bit of video editing, to web development, to just general use. It’s been a great machine, but I don’t use it as much as I used to, and it seems a shame to have such a machine just being used as a glorified web terminal these days. So, feel free to bid away – I’m trying to bring in some cash before the honeymoon and other various wedding-related items come around… __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67be73bf4b67e', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Posted in Personal on November 26, 2005 by ccornutt. 2 Comments All I want… …is an API for the Internet Movie Database. Is that too much to ask? In this age of “information freedom” that seems to be going around, it surprises me that there are still holdouts with massive datastores of information that haven’t taken the leap. Of course, a little googling around came up with a few hints that it might be in the works for IMDB, but nothing substantial. I can see how sites, especially ones that were created for the sole reason of being a datastore, would be fearful of opening up that information to every Tom, Dick, and Mary out there – where’s the value in coming to a site (driven some by ads, etc) when someone could go out and just pull the content they need elsewhere? There’s argumaents on both sides of things, but thankfully, it seems like the “open everything” crowd is working harder at their jobs. More and more sites are exposing their backends to the world, showing off their data in all of their glory, and the people love them for it. Think about the move that eBay recently made to remove the fees on their API – imagine how much more that will fuel their adoption… But, oh well – back to the IMDB site I go. I guess if I want any content from them, I’ll have to do it the old-fashioned way (just like everyone else) – now where did I put that screen-scraper… __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67be73bf4de8f', { sectionId: '370373', format: 'inread' }); }); Posted in PHP on November 23, 2005 by ccornutt. 6 Comments"
