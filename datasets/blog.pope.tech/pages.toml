full_description = "February Accessibility Focus: Structure and Navigation Use these articles and videos to learn how to create an accessible page structure and navigation. How to declare your page’s language Learn why page language matters, how to declare it in HTML, and what language subtags are. Last Updated: February 27th, 2025 Web Accessibility Platform Product Updates – 2025 2025 Product Updates for Pope Tech’s Web Accessibility Platform. Help Center The Pope Tech Help Center provides documentation and videos on how to use Pope Tech for Websites. How to fix the 5 most common Accessibility errors How to fix the 5 most common web accessibility errors. With examples taken from live websites. Last Updated: February 27th, 2025 Canvas Accessibility Dashboard Product updates – 2025 2025 Product Updates for Pope Tech’s Canvas Accessibility Dashboard. Canvas Documentation The Pope Tech Canvas Documentation provides documentation and videos on how to use Pope Tech for Courses. How to create accessible Canvas courses 8 accessibility strategies to make accessible Canvas courses. Creating an Organizational Accessibility Strategy You might be wondering where to get started with web accessibility for your organization. Mapping out an accessibility strategy can be a great starting point. This article is a practical approach to thinking about organizational web accessibility. Consistency is the secret sauce of web accessibility I recently noticed that one of our Pope Tech clients, a university, was able to resolve over 350,000 accessibility errors in less than two months What was their secret? 2 Web Accessibility Myths and The Truth As more organizations are becoming aware of web accessibility there are 2 web accessibility myths that are increasingly thrown around. Both of these myths lead to less accessible websites. How do I make my website ADA compliant? An introduction to ADA compliance for your website and why it is more productive to focus on accessibility over complianc