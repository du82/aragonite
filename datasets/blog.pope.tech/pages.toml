full_description = "Updated: February 27, 2025Web Accessibility Platform Product Updates – 2025 by Pope Tech Stay up-to-date on all product updates for Pope Tech’s Web Accessibility Platform. Product updates include details on all major feature releases. For more details about features and fixes, review the release notes. If there are any questions or feedback, please contact us. Sign up for product update emails Sign up to get Pope Tech product updates emailed to you. Unsubscribe at any time. First Name Email Address Subscribe .formkit-field { margin-bottom: .5em; } .formkit-alert-success { padding: 15px; margin-bottom: 20px; border: 1px solid transparent; border-radius: 4px; color: #244524; background-color: #e6f6e0; border-color: #244524; } February 19th, 2025 – AIM Score manual testing and YouTube Captions Detection We’re excited to introduce two anticipated features, the AIM Score and YouTube Caption Detection. We also have an upcoming Pope Tech: For Websites training. Other updates include: You can now track website owners on websites (only available with Combined Crawl and Scan turned on). You can set organization and user time zones. Review the updates below or the release notes for more information and other fixes. AIM Score and AIM Score manual testing Wizard (Scanning and Professional Plans) The AIM Score combines automated and manual testing for a more reliable accessibility metric. This means you can now realistically include manual testing in your accessibility strategy. First, Pope Tech automatically calculates the automated score. This shows on the Dashboard in the Automated Score Card as the Automated Testing Score. Now, Pope Tech also guides you through getting the manual testing score with the AIM Score Wizard. We’ll take you through manual testing at least 4 web pages with easy-to-follow steps and videos. Once you’ve completed the manual test, you’ll have your AIM Score, most common issues, and any notes from the manual test. If you’d like to start using the AIM Score, review AIM Score manual testing documentation. YouTube Caption Detection Integration We fully launched the YouTube Caption Detection feature (it is no longer in beta status). The YouTube Caption Detection feature means you get more detailed information about your YouTube video’s captions. With this feature turned on, a scan that detects a YouTube video will come back with one of the following results: ​YouTube captions (Feature)​ YouTube automated captions (Alert)​ ​YouTube video missing captions (Error)​ YouTube video not found (Alert) If you’d like to include these results in your dashboards and reports, learn how to enable YouTube Caption Detection. Upcoming Pope Tech: For Websites training Register for Pope Tech’s training on how to scan websites and review results. We’ll also go over practical tips for identifying, understanding, and fixing common accessibility issues. There will be time at the end to ask any questions you have about how to use Pope Tech. Date and time: April 3rd | 11 a.m. – 12 p.m. MT Register for Pope Tech: For Websites training In progress: Accessibility Progress Report manual test type In Pope Tech, you can currently log two manual test types: a simple test that links to an external report and the AIM Score manual test. We are working on a third type, the Accessibility Progress Report. You’ll answer multiple questions to outline your accessibility strategy. This can be especially helpful for large organizations that need accessibility information from each department. Categories: Pope Tech Release Notes"
