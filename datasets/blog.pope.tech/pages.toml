full_description = "Updated: February 27, 2025Canvas Accessibility Dashboard Product updates – 2025 by Pope Tech Stay up-to-date on all product updates for Pope Tech’s Canvas Accessibility Dashboard. Product updates include details on all major feature releases. For more details about features and fixes, review the release notes. If there are any questions or feedback, please contact us. February 27th, 2025 – Canvas Studio Video and YouTube Captions Detection We’re excited to introduce two anticipated features, YouTube Caption Detection and Canvas Studio Video Caption Detection. Review the updates below or the release notes for more information and other fixes. YouTube Caption Detection Beta The YouTube Caption Detection feature means you get more detailed information about your YouTube video’s captions. With this feature turned on, a scan that detects a YouTube video will come back with one of the following results: ​YouTube captions (Feature)​ YouTube automated captions (Alert)​ ​YouTube video missing captions (Error)​ YouTube video not found (Alert) If you’d like to include these results in your dashboards and reports you can turn them on in your Admin Settings. Canvas Studio integration for Caption Detection Once set up the integration with Canvas Studio will detect if videos in your courses added through Canvas Studio have a caption track added. This helps prioritize results. If the integration is not set up in your account Canvas Studio videos are still detected but show up as an Alert for all videos. To set this up follow the steps in the Canvas Studio Integration documentation. In progress: Dismissed results The highly requested feature to be able to dismiss results such as No heading structure when the content doesn’t need a heading or a YouTube video that is determined to have accurate captions is almost ready and is in the final stages of QA. Categories: Pope Tech Release Notes"
