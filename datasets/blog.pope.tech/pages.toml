["https://blog.pope.tech/2022/05/04/report-formats-and-types"]
title = "Report formats and types - Pope Tech Blog"
description = """
Pope Tech Blog
\t\t\t\t\t\t\t\t\tDocumentation,  Release Notes, and Web Accessibility"""
full_description = "Updated: March 30, 2023Report formats and types by Whitney Lewis Download or email these reports to others from the Reports page. When creating a report, you’ll select the report format and then type. In this article, you’ll learn what each report format and type includes. Tip: HTML and PDF reports have the same information. The only difference is HTML reports are open as an HTML webpage and PDF reports are PDF files. Format: Email overview, Type: Page summary (default) Format: Email overview, Type: Result summary (customizable) Format: HTML or PDF, Type: Summary Format: HTML or PDF, Type: Page Detail Format: HTML or PDF, Type: Result Detail (customizable) Format: CSV, Type: Summary, Page detail, or Result detail Customize Email overview result summary and HTML or PDF result detail reports Format: Email overview, Type: Page summary The default report is the Email Overview Page summary. It is an email-only report that gives a quick view into an account or course’s accessibility with the following: Error per content block: Divides the total amount of errors by how many content blocks are included in the report to give you an average of how many errors there are per every content block. Content blocks: Content blocks include pages, syllabi, discussions, assignments, quizzes, and announcements, so this is how many content blocks are included in the report. Total errors: The total number of errors in the course or in the account. Total alerts: The total number of alerts in the course or in the account. Two most common errors: The two errors that happen the most in the course or account. Back to top Format: Email overview, Type: Result summary (customizable) The Email overview Result summary is a customizable, email-only report. When it isn’t configured, or customized, it lists the top 10 accessibility errors and alerts that are found across the course or account. Jump to Customize Email overview result summary and HTML or PDF result detail reports to learn how to configure this report. Back to top Format: HTML or PDF, Type: Summary The HTML or PDF Summary report gives an overview of how many content blocks, errors, alerts, and contrast errors there are. It also lists the most common errors. Back to top Format: HTML or PDF, Type: Page Detail The HTML/PDF Page Detail report starts with an overview of how many content blocks, errors, alerts, and contrast errors there are. It then lists the most common errors. After the most common errors, it lists every content block and its accessibility results. Back to top Format: HTML or PDF, Type: Result Detail (customizable) The HTML/PDF Result Detail report starts with an overview of how many content blocks, errors, alerts, and contrast errors there are. Next, it lists all the included results in the report. Then, every result detail, which includes what the result means and how to fix it, is listed with the content blocks it’s on. Back to top Format: CSV, Type: Summary, Page detail, or Result detail Customize There are three types of CSV reports: Summary – creates three separate .csv files for Most Common Errors, Overview, and Course or Account Summary. Course Detail – creates at least three separate .csv files for Most Common Errors, Overview, Courses Summary, and a Content Block Summary. Result Detail – creates several .csv files. They are Included Results, Included Courses, and a .csv file for each accessibility result. If the accessibility result occurs in a content block, the content block and HTML will show. Back to top Customize email overview result summary and HTML or PDF result detail reports You can customize email overview result summary, HTML result detail, or PDF result detail reports by selecting Configure Results. In the Configure results widget, select pre-configured presets. When you’re in the widget, you’ll see exactly which results are automatically selected for each preset in the result type list below the search. The presets include: Errors and Alerts – this default preset includes all results within the Errors, Contrast Errors, and Alerts categories. Images – includes all image-related results from all categories. Headings – includes all headings-related results from all categories WCAG level A, AA, and AAA Errors and Alerts – includes all requirements for WCAG level A, AA, and AAA. All – includes all results from all categories Custom – This option lets you pick any results from the list. For example, if you wanted a summary of only contrast errors, use this preset and then use the filter to search for and select contrast errors. Back to top Related articles Export and email reports Use the Canvas Accessibility Instructor Dashboards Use the Canvas Accessibility Admin Dashboard Looking for more? Here’s Pope Tech’s Canvas Documentation for the Accessibility Guide and Dashboards. Categories: LTI Dashboard and Accessibility Guide"
