full_description = "Updated: October 7, 2024Canvas Documentation by Pope Tech Pope Tech has two accessibility tools to use with Canvas: First, the Accessibility Guide, which is used right in the Canvas course editor. The second tool is the Accessibility Dashboard, which includes the Accessibility Guide along with three reporting dashboards. Below are help videos and articles for both the Accessibility Guide and Canvas Accessibility Dashboards. Accessibility Guide Documentation Access and Navigate the Accessibility Guide Video Learn how to access and navigate the Accessibility Guide when editing a course page. Accessibility Guide Demos Video Playlist Watch demos for low contrast errors, skipped heading levels, layout table error, suspicious link text, and missing alternative text. Get started with the Canvas Accessibility Guide Learn how to access and navigate the Accessibility Guide. You’ll also learn how to fix common errors. Canvas Installation Instructions Learn how to install the Accessibility Guide to your Canvas instance. Accessibility Dashboard Documentation Canvas Accessibility Dashboard and Guide Video Learn how Pope Tech’s Canvas LTI dashboards for admins and instructors and the accessibility guide can help make courses more accessible. Get Started using Pope Tech’s Canvas Course Dashboard Learn how to use the Most Common Issues widget and Content blocks widgets on the Canvas Course Dashboard to start making your courses more accessible. Pope Tech’s Canvas My Dashboard and Reports Learn how to use the widgets on Pope Tech’s Canvas Accessibility My Dashboard to review all your courses’ accessibility. Use the Canvas Accessibility Instructor Dashboards Learn how to access and use both instructor dashboards. Canvas Dashboard Course Scanning Learn how to view the status of any automatic or manual ongoing scan, when the last scan happened, or manually rescan the course. Canvas Admins Use the Canvas Accessibility Admin Dashboard Learn about how to access the Admin dashboard and use each of its widgets. Export and email reports Learn how to create and email reports for courses and accounts. Report formats and types Learn what each report format and type looks like. Canvas Admins Admin Settings Learn how to navigate to accessibility settings, enable current and new courses, and complete a Full Sync to fix issues. Alternative Formats in Canvas Using Alternative Formats in your Canvas Course Learn how to use Alternative Formats to convert documents and content to other document types. Pope Tech Canvas updates Sign up to get product updates. Unsubscribe at any time. First Name Email Address Subscribe .formkit-field { margin-bottom: .5em; } .formkit-alert-success { padding: 15px; margin-bottom: 20px; border: 1px solid transparent; border-radius: 4px; color: #244524; background-color: #e6f6e0; border-color: #244524; } Want to learn more about Pope Tech’s Canvas accessibility tools? Schedule Canvas Demo Learn more about Canvas Accessibility Guide and Dashboard features Categories: Documentation, LTI Dashboard and Accessibility GuideTags: Canvas, Higher Education, Instructor Accessibility Guide, Learning Management System (LMS)"
