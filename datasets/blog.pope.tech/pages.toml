full_description = "Updated: August 26, 2024How to create accessible Canvas courses by Whitney Lewis An LMS (Learning Management System) like Canvas is built with accessibility in mind. But, instructors must make their courses with accessibility strategies to keep a student’s Canvas experience accessible throughout each course. Using accessibility design strategies when creating or updating Canvas courses means all your students have equal access to learning materials and resources. It removes barriers and frustration for students with disabilities letting them navigate and use your course. The 8 accessibility strategies we’ll cover in this article are easy to apply once you know what they are. We’ll review exactly what you need for each including what it is, how to do it, and examples. Alternative text Headings Tables Links Contrast Documents Videos Text writing and formatting Pope Tech Accessibility Guide users The Accessibility Guide does a lot of the work for you. The strategies below have links to video demos of how to fix these accessibility issues with the Accessibility Guide. Learn how to access and use the Accessibility Guide on the Canvas Accessibility Guide YouTube playlist. Canvas Accessibility Checker If you don’t have the Accessibility Guide, the article focuses on how to apply these accessibility strategies directly in Canvas. We also include notes of when Canvas’s built-in Accessibility Checker could help. Watch the Canvas’s Accessibility Checker demo video to learn how to access and use it. Download an example accessible course template We created a free, accessible Canvas template that includes: Homepage with a 2-column and 1-column options Syllabus template Module1/Week 1 template How to use page Download Canvas Template from Google Drive (.imscc file type) Alternative text What alternative text is Alternative text is used to describe an image to users with visual disabilities. The description should convey the same information a visual user would get from the image. There are three types of images: Decorative: These images don’t convey any content. They’re “eye candy” and don’t need alternative text. Informative: These images convey content and need alternative text. Functional: These are linked images and need alternative text describing where the link goes. Alternative text can be in the content of the page near the image, or it can applied to the image’s options in Canvas. If the alternative text is in the content near the image, the image can be marked as decorative in Canvas. (Don’t worry, we’ll go over how to do this further down). PRO TIP: Ask yourself these questions when deciding if an image is decorative or informative: Do these images add needed content? Would any information be lost if these images were deleted? Would alternative text on these images give meaningful information to a screen reader? How to write alternative text Here are tips for writing great alternative text: Don’t use “image of” or “link to” language Capitalize the first word, and end full sentences with periods. Keep it succinct – try to use a few words or only a sentence or two. The purpose of the image can change what the alternative text is. That means the same image used in different contexts, or for a different purpose, could have different alternative text. How to add alternative text or mark it as decorative in Canvas Accessibility Guide users The Accessibility Guide finds all image instances including images without alternative text, with suspicious alternative text, and with alternative text. This helps you easily check images’ alternative text. The Guide also applies any changes made to alternative text for you. Learn more in the Missing alternative text Accessibility Guide demo video. To add alternative text to an image or mark it as decorative, follow these steps: In Canvas, edit the content with the image. Select the image then Image Options. Add the alternative text to the Alt Text field or select the Decorative Image checkbox. Scroll down and select Done. PRO TIP: You can also add alt text to images when uploading them. In the upload dialogue box, scroll down to the image’s Attributes and add the alt text to the Alt Text field. Canvas Accessibility Checker If your image is missing alternative text or has alternative text that has a filename extension, Canvas’s Accessibility Checker detects it and helps you fix it. Learn how in our Canvas Accessibility Checker video. Alternative text examples Example 1 – Functional images Often, we try to make the homepage look interesting and organized with icons and images. On the Canvas front page below, there’s a button that’s an image, and the front page also has numbered icons for weeks 1-15. The button image says, “Start here” and links the student to a welcome announcement. Each numbered icon links to that week in the course. Because each of these is an image that is also a link, they each need alternative text that describes where the link goes. For the “Start here” button, the alternative text could be as simple as, “Start here”. Each numbered icon’s alternative text could be, “Week 1”, “Week 2”, “Week 3” and so on. Now, when a screen reader gets to that image, it’ll announce that alternative text and give the user the same content visual users are getting. Example 2 – Informational image In this example, I’m adding this color emotion guide image to a marketing course. This image conveys a lot of information. There are seven colors with text saying what emotion that color stands for plus over 100 logo examples. Since there’s a lot of content, it’d be best to put the alternative text near the image in the page’s content. All students would benefit from content pointing out the key points of this image, and it’ll keep the alternative text for screen reader users easier. Since the alternative text is in the page’s content, the image should be marked as decorative in the Image Options. That way screen readers ignore the image. Next, I need to decide what’s the purpose of this image. Is it what the colors mean? Is it the specific logo examples? To me, the purpose is the emotion each color represents. Then, I can give some of the popular examples. If it was every logo example, the best option would be to make a table organizing the logos by color. Now, I can write the alternative text, which could be: There are common colors used for logos because those colors represent a specific emotion. They are: Yellow is optimism, clarity, and warmth. Some brands that use yellow are McDonald’s, National Geographic, and Best Buy. Orange is friendly, cheerful, and confident. Some brands that use orange are Nickelodeon, Amazon, and Fanta. Red is excitement, youthful, and bold. Some brands that use red are Cococola, Nintendo, and Target. Purple is creative, imaginative, and wise. Some brands that use purple are Taco Bell and Yahoo. Blue is trust, dependable, and strength. Some brands that use blue are Lowe’s, HP, and Dell. Green is peaceful, growth, and health. Some brands that use green are John Deere and Whole Foods. Gray is balance, calm, and neutral. Some brands that use gray are Apple and Wikipedia. Example 3 – Informational image Let’s do one more informational image. Here’s our Canvas content – a list of lab procedures with an image of a student looking through a microscope. Let’s determine if this image is decorative or informational by answering these questions: Does this image add needed content? No, because the lab procedures go over needing goggles, a mask, and using a microscope, which is what the student in the image is doing. Would any information be lost if this image was deleted? No, because the lab procedures cover the needed information the image also depicts. Would alternative text on this image give meaningful information to a screen reader? Yes, safety gear is important and this image reinforces that idea. It should also be reinforced to screen reader users. This image could go either way since the accompanying content covers all the content the image depicts. But, as the author, I decided to add alternative text because I added the image to reinforce the lab expectations, so I want to reinforce this using alternative text too. I’d add this alternative text to this image, “Student with safety goggles and mask looking through a microscope”. Example 4 – Charts and graphs It’s common for courses to use charts and graphs to show information. Unfortunately, these are usually images. Giving alternative text describing every data point isn’t helpful. Here’s what you could do instead: Include alternative text that describes a trend or important point depending on what the purpose of the chart or graph is. Put the data in a table format too. This format is more accessible and lets screen reader users explore each data point. Here’s a graph of fruit sales. If the purpose is to identify the fruit that’s selling the least, the alternative text could be: Blueberries sold the least at 60 units. They’re 40 units below the next fruit, which is watermelons at 100 units. Now let’s pretend the context is just a general overview of sales. The alternative text would change to be something like: Fruit sales bar graph. Sales range from blueberries at 60 units to grapes at 175 units. Peaches, apples, watermelons, pears, and strawberries range from 100 to 120 units. When the chart or graph has several data points, it’s not realistic to put every point in the alternative text. That’s why it’s important to understand the question you’re trying to answer in the context and to use tabular data to give every data point. Alternative text resources If you want to learn more about alternative text, check out these resources: What alternative text is, when to use it, and how to write great alt text Alternative text in the wild: 5 alternative text examples Alternative text YouTube playlist Back to top Headings What is an accessible heading structure Accessible Canvas courses use headings to organize the content on the page. For most course content, this means heading 2s that describe the broader main ideas. Then, heading 3s are under heading 2s for even more specific ideas. PRO TIP: Headings improve the readability of a page because they chunk the content. This can make it easier for students to read your content. How to create an accessible heading structure To create an accessible heading structure, there are some heading issues to avoid. Plus, there are some questions you can ask yourself to help create a logical heading structure. Common heading issues to avoid An accessible heading structure is logical, so it makes sense when a user navigates the page by headings. To keep your heading structure logical, avoid these issues: Empty headings: This is a heading block without any content. Sometimes, they’re used to add spacing to a page. But, these blank headings end up in the screen reader user’s heading list, which is confusing. No headings: This is when no headings are used on the page. This could be okay for content pages with little content. But, if there are multiple ideas, use headings to organize them and chunk up the content. Skipping a heading level: This is when a heading level is skipped when descending headings. An example of a skipped heading would be going from h2 to h4 without having an h3 between them. An h4 back to an h2 is not a skipped heading. Visually, these don’t look like an issue, but skipped headings are confusing for screen reader users because they rely on hearing a heading structure to help them understand and navigate the page. PRO TIP: Use CSS styling to make text larger – don’t apply heading styling. This could cause a skipped heading level. But, even if it doesn’t, this is confusing because paragraph text is now part of an assistive technology user’s heading list, which they use to navigate. Questions to help create a logical heading structure To create a logical heading structure, start by outlining your content. Some questions to help you know when to make a new subheading are: Is this a new idea/topic within the heading level above it? Is there enough content (1-3 paragraphs) to support a new heading? Does my previous heading have too much content? Should it be broken up into subheadings? Should this idea/topic stand out in the content? Heading structure example Here’s an example heading structure with issues. There’s an empty heading, skipped heading, and paragraph text with heading styling. So, this is the heading structure a screen reader would announce: H1: Syllabus H2: General Course Information H2: Contact Information H4: Instructor (Skipped heading) H4: Teacher Assistant H2: Course Description H3: Learning outcomes H3: Communication expectations H4: Email responses take 1-2 business days during the business week. (Paragraph text with heading styling) H2: Assignment and Assessments H2: Policies and Procedures H2: (Empty heading) H2: Student Resources H2: Schedule Here’s the same heading structure with the empty heading, skipped heading, and paragraph text with heading styling fixed. It’s more logical and accessible. H1: Syllabus H2: General Course Information H2: Contact Information H3: Instructor H3: Teacher Assistant H2: Course Description H3: Learning outcomes H3: Communication expectations H2: Assignment and Assessments H2: Policies and Procedures H2: Student Resources H2: Schedule Accessibility Guide users The Accessibility Guide finds every heading instance, so you can easily review your heading outline and adjust the headings directly in the Accessibility Guide. The Accessibility Guide then applies these changes to your content for you. Learn how in the Skipped heading level Accessibility Guide YouTube video. Canvas Accessibility Checker Canas’s Accessibility Checker finds and helps fix long headings and skipped heading levels. Heading resources If you want to learn more about headings, check out these resources: 5 heading accessibility issues and how to fix them How to create better (and more accessible) heading structures Back to top Tables What are accessible tables Accessible tables have specific HTML code a screen reader uses to navigate and announce the table. Using the correct code means screen reader users can skip the table instead of tabbing through each cell. It also means the screen reader announces how many columns and rows there are and announces the heading cell related to the data cell while they navigate the table. This is extremely helpful for users who listen to the table data. The HTML code needed is: The table header <th> tag. Table headers can be assigned to the first row, column, or both. And, when the table has headers, the screen reader announces the header before the data in the cell, so the screen reader user knows what heading the data is associated with. The scope attribute <scope> added to the table header <th> tag. Scope tells the screen reader if the header is a column or row header. We suggest adding a caption with a <caption> t"
