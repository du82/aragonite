["https://blog.regehr.org/archives/47"]
title = "The Compiler Doesn’t Care About Your Intent – Embedded in Academia"
full_description = "j h woodyatt says: March 19, 2010 at 12:08 am One of the cases where a compiler absolutely *does* need to be concerned with the intent of the programmer is when presenting diagnostic information related to programming errors. Anonymoose says: March 19, 2010 at 12:05 pm You write: “Xavier Leroyâ€™s CompCert compiler provably preserves the meaning of a C program as it is translated into PPC or ARM assembly.” That’s not really true. If the CompCert compiler could actually be proved correct, then it would (by definition) be bug-free… and it’s clearly not bug-free yet, as seen from the number of bugfixes mentioned in its changelogs. http://compcert.inria.fr/release/Changelog This isn’t Xavier Leroy’s fault; it’s mostly the fault of the C committee for not specifying C’s syntax or semantics very well (from a theoretician’s perspective; there are huge gaping holes in C that are generally handwaved away as “oh, the compiler vendors all know how to deal with that”). But still, you shouldn’t say that CompCert *does* preserve correctness; merely that it *tries to* preserve correctness. regehr says: March 19, 2010 at 12:35 pm Hi Anonymoose- I don’t quite agree with your characterization. First, looking through that changelog, I didn’t see any fixes for wrong-code bugs. It looked liked feature additions and fixing crash bugs (if CompCert crashes, no proof is emitted — it’s not wrong). Did I miss something? Second, as I understand the situation, laxity in the C standard is not a problem. The possibilities for errors in CompCert are: the PPC semantics could be wrong, the CLight semantics could be wrong, or the C->CLight translator can contain bugs. Since CIL is used to translate C into CLight, and CIL historically has contained plenty of bugs, CIL is almost certainly the weakest part of CompCert. I believe Xavier will have eliminated most dependency on CIL for the next release. xilun says: March 19, 2010 at 3:14 pm Good article, but I want to clarify on a little detail so that people do not do mistakes: volatile isn’t a portable way to do register access in C, because of various reasons. (we could debate on whether or not C90 or C99 define volatiles so they are suitable for register access, but in the real world of now massively out of order CPUs even in embedded systems, multiprocessing, lots of caches and buses, it just doesn’t work anymore, and the amount of work to put in compilers AND systems to make it work again is ridiculously disproportionate with what it would give us compared to the solution that do work today: accessors written in in-line assembly language, featuring the correct amount of memory barriers black magic to enforce the effectiveness of transactions on the correct bus in an in-order way)"
