["https://blog.regehr.org/archives/2173"]
title = "A Close Look at a Spinlock – Embedded in Academia"
full_description = "Malte Skarupke says: November 6, 2021 at 9:40 pm This is pretty neat. I’m surprised that the “lock” code seems to write all 32 bits, and I would have expected that to cause problems. Do I understand correctly that the store in “unlock” also will prevent the strex instruction in “lock” from writing? So the unlock doesn’t need atomics because any write whatsoever will prevent the lock from going through, even if it’s not a strex. (I can’t find the relevant text in the documentation) The “ldrex” and “strex” instructions feel like you’re getting access to some CPU-internal implementation detail, that they decided to make public. Like “this is how synchronization works internally in the CPU, so might as well just make that available to programmers.” I’d guess that x64 CPUs also have a mechanism like this internally (for example to ensure cache coherency) but they don’t give me access to those bits of hardware. Chris Emerson says: November 7, 2021 at 1:57 am This is a nice writeup thanks! So the `wfe()`/`dsb_sev()` are essentially a global condition variable. But without the associated lock, what prevents the `wfe()` from the lock being executed just after the `dsb_sev()` and having to wait for the next event? nyasuno says: November 7, 2021 at 5:21 am As long as my knowledge, Linux quite to use ticket spinlock because of excessive spinning problem which happens typically in virtualization env.（https://patchwork.ozlabs.org/project/ubuntu-kernel/patch/1267800142-18169-3-git-send-email-apw@canonical.com/） Green Lightning says: November 8, 2021 at 6:52 am @Chris Emerson: The processor has a hidden 1-bit event register, which is set by the SEV instruction and checked by the WFE instruction. If the event register is already set, WFE will clear it and return immediately. So, if the SEV happens before the WFE, the event register will be set and WFE will not wait. If the event register was already set for some other reason, then the WFE will clear the event register in the first iteration, the loop will continue (because the condition is still true), and the WFE instruction will wait in the second iteration. Source: https://developer.arm.com/documentation/dui0552/a/the-cortex-m3-processor/power-management/entering-sleep-mode"
year_published = 2021
clearnet = "https://blog.regehr.org/archives/2173"
