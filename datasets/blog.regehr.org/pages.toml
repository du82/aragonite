["https://blog.regehr.org/archives/161"]
title = "Compilers and Termination Revisited – Embedded in Academia"
full_description = "Rusky says: June 7, 2010 at 4:29 pm “…if you are a C++ user and you think this behavior is wrong, leave a comment at the bottom of this post or send me an email…” Aye. Michael Norrish says: June 7, 2010 at 7:46 pm Actually, I think your example where you have unspecified behaviour leading to possible undefinedness is just undefined. There was a post to this effect to comp.std.c by Mark Brader (or perhaps he e-mailed me) while I was writing my thesis. I’ll have to check my archives to see if I can find the argument. Of course, a program may be partially undefined because it may be undefined in the face of certain inputs from the environment, and not others. regehr says: June 8, 2010 at 10:20 am Hi Michael- If you find the code/email please send it along! It’s depressing how difficult it can be to reason about simple examples like this. I plan to write a longish blog post just on undefined behavior at some point… Michael Norrish says: June 11, 2010 at 5:29 am I had a look and couldn’t find it, sadly. It must have been before 1997, when I started getting serious about keeping my e-mail. The argument was typical standardese lawyering about the language in the standard. ridiculous_fish » Blog Archive » Will it optimize? says: July 23, 2010 at 12:43 am […] However, as we saw, they really can reduce the asymptotic complexity in space (question 1) and time (question 2). They can also affect calculated results (discussion of question 4) and maybe even whether your program goes into an infinite loop (see here). […] Don Stewart says: July 28, 2010 at 1:17 am I’ve clarified a few points in your Haskell paragraph here: http://www.reddit.com/r/programming/comments/cufuo/followup_to_c_compilers_disprove_fermats_last/c0vdjvn Specifically, the bottom values that may be substituted for each other are only those so-called “imprecise exceptions”, where if the compiler can show that every possible evaluation order of side-effect free code produces some exception, then the optimizer is free to reduce the entire computation to *any* of the possible exceptions. This is particularly useful when considering parallel code, where different possible execution paths lead to different partial functions. The semantics for imprecise exceptions, and when bottom values may be collapsed, are given in this paper, as implemented in GHC : http://research.microsoft.com/en-us/um/people/simonpj/papers/imprecise-exn.htm"
