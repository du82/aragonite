["https://blog.regehr.org/archives/1676"]
title = "It’s Time for a Modern Synthesis Kernel – Embedded in Academia"
full_description = "Greg Morrisett says: July 2, 2019 at 11:54 am I had a student (Fred Smith) who worked on extensions to Popcorn (the predecessor to Cyclone) that supported run-time code generation in a lightweight fashion. Here’s a paper describing part of the system: https://ecommons.cornell.edu/handle/1813/5812. Fred’s thesis had a bunch more. Benjamin Shropshire says: July 2, 2019 at 3:05 pm This kind of makes me wish things were written in C++. As far as experimenting goes C++ templates would offer an interesting opportunity to test the effect of specializing over values in small domains. Say take a function like this: int SomeFunction(bool is_single_threaded, /* other args */) { … } And replace it with something like this: template int SomeFunction(/* other args */) {… } Then simply referencing both variations would give compile time specialization almost for free. There are a lot of problems that doesn’t solve (picking and invalidating the correct variation, etc.), but it would avoid any complexity imposed by trying to run a compiler in kernel mode (which frankly seems like a rather laborious yet boring portion of the research). ZT says: July 2, 2019 at 3:45 pm Could someone manually generate this optimized ksys_write (or probably starting with the trap handler), add it is a new syscall, modify the test app to use the new syscall, run the test process, stop it immediately after it starts, manually patch all the process constants using a kernel debugger or whatever, and then unstop it to let it run the timing loop so we can find out whether the optimized version is really x10 faster? No need for JIT, just time it once. How hard can it be? No, I am not volunteering, I know nothing about kernel development. Zev Weiss says: July 2, 2019 at 4:19 pm I actually implemented something very similar to this with Linux a few years ago. It used Andi Kleenâ€™s kernel-LTO patch set as a starting point, and then used perf profiling to determine dynamically-hot codepaths, which were then recompiled with very aggressive optimizations and some auxiliary hint information (scripted out of perf) to enable speculative devirtualization of indirect calls (even cross-module ones), resulting in a equivalent new codepath with pretty much everything inlined together (from syscall entry points all the way down to device drivers), specialized for that workload on that system. That code was then built into a module and spliced into the running system via the livepatch mechanism. At the time the results werenâ€™t quite dramatic enough to justify pursuing it further (or maybe I wasnâ€™t testing it on the right workloads), but with the advent of Spectre and such increasing the cost of indirect calls non-trivially I wonder if it might look better nowâ€¦"
