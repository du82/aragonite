title = "Nine Mile Canyon – Embedded in Academia"
full_description = "Nine Mile Canyon One of my boys and I spent Sunday exploring Nine Mile Canyon, in the remote Book Cliffs a few hours drive from Salt Lake City. This canyon is known for its dense collection of rock art and ruins, a lot of which can be seen from the paved road that follows the canyon bottom. This was a lot of driving for a day trip but it wasn’t too boring since I had checked out an audiobook of Fahrenheit 451 from the library. A great pictograph panel, the figures are several feet high. Typical scenery in the upper canyon. A dodgy ice bridge. This one held us but I got wet to the knees on a different stream crossing. Fremont people in a large part of Utah drew sheep this way: February 13, 2017 regehr Outdoors, Utah"
