["https://blog.regehr.org/archives/1679"]
title = "Design and Evolution of C-Reduce (Part 2) – Embedded in Academia"
full_description = "Benjamin Shropshire says: August 12, 2019 at 12:04 pm Those open questions have some interactions I find interesting: – The bug-hijacking question seems related to the non-greedy question: If you reduce all the paths, then it can’t hijack as it will just *also* find the other bug (unless *all* the reductions hijack). – The non-greedy question seems related to the canonicalization question (and the diamond comment): If a canonicalization can converge with high probability, then with a non-greedy (with duplicate detection) approach the “effective branching factor” will decrease with depth, and improve non-greedy’s desirability. One other question I’d be interested in is: How do that answers change with the degree of available parallelism? In the extreme, if that degree is larger than the number of producible “next steps” then exploiting that more or less *requires* a non-greedy approach. If enough steps fail quickly (e.g. syntax errors), then that point might come much sooner. Cloud computing might actually allow parallelism that comes within sight of that. regehr says: August 12, 2019 at 4:20 pm Hi Benjamin, these are interesting questions! I hadn’t thought about all of these. I think there’s a problem with “reduce all paths to avoid hijacking” which is that we’ll end up with a lot of reduced test cases and no way to tell which ones trigger which bug. If we knew how to automatically figure out which bugs are triggered, we’d have just included that in the original interestingness test. Benjamin Shropshire says: August 12, 2019 at 4:56 pm I totally agree, with a a non-greedy approach and without strong canonicalization, de-duplication becomes a hard but necessary problem. On the other hand, without strong canonicalization the branching factor becomes intractable so some sort of pruning would needed regardless. Any pruning would tend to increase the risk of hijack. Maybe some happy median can be found? On a third hand, there might be some benefits to having multiple distinct local minimums to report if you can identify them as related. I wonder if line coverage/profiling of the compiler would help there? If many bugs result from corner cases, then they may stand out as statistical clusters, if you can find the right measures to inspect (which IIRC is a well understood stats problem)."
