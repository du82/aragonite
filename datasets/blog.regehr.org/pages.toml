["https://blog.regehr.org/archives/1586"]
title = "Paths to External Engagement in Computer Science Research – Embedded in Academia"
full_description = "Will Hawkins says: April 2, 2018 at 1:23 pm John, I love this series of posts. That shouldn’t surprise me — your work is great. One of the reasons that I wanted to go into graduate CS research is to potentially come up with an idea that was “so good” that it became integrated into a major open source software product. I would love it if my work ended up implemented in the Kernel, MySql, Apache, nginx, gcc, etc. My advisor’s work was folded into early versions of gcc and was the reason that I wanted to work with him so badly. My academic hero is someone like Chris Lattner whose work became its own open source project and is now hugely influential. One of the items to add to your list. It’s a subtle distinction on the “government agency” bullet, but I think it’s important nonetheless: work on industry challenges. My group was lucky enough to participate in a grand challenge from DARPA and dealing with their requirements and test platform and evaluation system made our work much more robust and more likely to get deployed because of the real world work that we had to do on integration. I hope that makes sense. Again, thank you for the thoughtful series of posts. Will regehr says: April 2, 2018 at 1:39 pm Will, thanks for the kind words and I totally agree about industry challenges! These can be sort of a best case since the external engagement is kind of packaged up and ready to go."
