["https://blog.regehr.org/archives/1578"]
title = "The Basic Toolbox – Embedded in Academia"
full_description = "Will Hawkins says: February 22, 2018 at 2:39 pm Great list!! I have some questions that I’d love to hear your feedback on, but I wanted to ask you this question up front: Do you think that knowing a “profiler” is something that is required? I’ve found it invaluable in plenty of circumstances but I’m not sure that it applies generally. Also, the profiler is unfortunately linked to the source language so I’m not sure that it belongs in its own category. Just a question. Thanks again for the great list and your writing, overall. I love reading your work! Geoff Wozniak says: February 22, 2018 at 5:12 pm I haven’t found a good pocket calculator. I switch between bc (only used when scripting), awk, shell $((…)) forms, and calc in Emacs. Emacs’ calc can do it all, but it’s a huge thing to learn and I tend to forget how to use it. Duncan Mak says: February 22, 2018 at 6:17 pm I particularly like using a Scheme implementation for doing arithmetic, particularly sums, because (+ 1 2 3 4) is inherently variadic and it’s so easy to type in. Tony D’souza says: February 22, 2018 at 7:08 pm “Old standbys like bc and dc also seem like bad choices.” Did you mean to invert the logic here? Doug Quale says: February 22, 2018 at 7:41 pm As an emacs user I probably should use calc for calculation needs, but I’ve never gotten the hang of it. I vote for the Python REPL as a calculator. If you are at a command prompt Python is right at your fingertips. It has infix entry, follows order of operations for arithmetic, uses GNU readline for command editing and history, can do hex, octal, and binary, has FP and arbitrary precision integer arithmetic, features loops and user-defined functions, and operates the same way in Unix or Windows. The ability to save results in variables and refer to the later can also be a big help. The ipython shell is an even nicer Python REPL, although startup is a little slow so you might want to start it in a command window and leave it running."
