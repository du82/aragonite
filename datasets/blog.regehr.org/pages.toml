["https://blog.regehr.org/archives/856"]
title = "Oracles for Random Testing – Embedded in Academia"
full_description = "Alex Groce says: December 17, 2012 at 3:03 pm Busy with a paper submission, but off hand, metamorphic testing comes to mind — I know changing the input F(x) will cause F'(y) on the output. Generalization of nullspace, in a sense — predictable changes in output based on a class of input transformations. Joshua Cranmer says: December 17, 2012 at 3:52 pm A generalization of the function/inverse and nop ideas is fixed-point iteration: applying a function F to the program x and then to F(x), etc., should converge to some F(y) = y “quickly.” A classic example is that a parser and AST pretty-printer pair should converge within two cycles; another example is the multiple-stage trick of compilers (a compiler should be byte-for-byte equivalent with itself when compiled by itself and when compiled by a host compiler). Flash Sheridan says: December 18, 2012 at 8:46 am A generalization of my earlier comment on Function/inverse pairs: Iâ€™d suggest generalizing the term to “Identities with Fudge Factors.” The obvious one is the traditional sine squared plus cosine squared, though we didnâ€™t get much mileage out of that. A slightly more complicated test did find a genuine bug in the PalmSource compilerâ€™s hypotf. igorsk says: December 18, 2012 at 8:49 am Re inverse functions: we (Hex-Rays) started using Csmith to test our decompiler. We generate a “good” (non-erroring and non-crashing) program with Csmith, compile and run it, decompile the object code, compile the decompiled code and (if this step succeeded) check that the re-compiled program produces the same output. We are not using it extensively yet but we already found many subtle (and not so subtle) decompilation bugs. Many thanks for the great program! Windows Programmer says: December 18, 2012 at 10:34 am Multiple Versions reminds me of a technique I learned from an Wise Old Programmer. Let’s say you need to re-implement an interface e.g. to make it faster/use less memory/etc. Keep the old interface available. When you are ready to validate the new interface, run your entire test suite–under the covers, use both the new and old implementation, and verify that the results are same. When you’re sure everything is working properly, cut away the old code. You can save your customers a lot of pain this way."
