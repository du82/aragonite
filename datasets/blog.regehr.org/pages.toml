title = "The Saturation Effect in Fuzzing – Embedded in Academia"
full_description = "Derek Jones says: June 17, 2020 at 12:41 pm John, The number of times each coding mistake causes a fault to be experienced has a bi-exponential distribution; seen here with some of your own data: http://shape-of-code.coding-guidelines.com/2017/12/12/the-shadow-of-the-input-distribution/ I suspect that one exponential represents the input distribution, and the other mistakes in the code. If this is true, and you run two fuzzers on the same code, one exponential should change and the other stay the same. I’m hoping you are going to tell me such data is available 🙂 How many times does incorrect code have to be executed before a fault is experienced? Here is one answer: http://shape-of-code.coding-guidelines.com/2020/01/27/how-useful-are-automatically-generated-compiler-tests/ Once a fuzzer has detected some number of duplicate mistakes, it is possible to estimate the number of remaining mistakes (of the kind detected): http://shape-of-code.coding-guidelines.com/2018/03/18/estimating-the-number-of-distinct-faults-in-a-program/ Ralf Jung says: June 18, 2020 at 1:37 am Speaking of probabilistic analysis of testing and bugfinding, this work was presented at our institute earlier this year and I found it quite intriguing: https://dl.acm.org/doi/10.1145/3210309 regehr says: June 19, 2020 at 10:40 pm howon, I think so! Derek, I don’t think I have good data of the sort the you want. The double exponential idea makes intuitive sense. Thanks for the link, Ralf! Stefan Ciobaca says: June 22, 2020 at 12:43 am Is there anything close to a standardized set of benchmarks for fuzzers? How would one distinguish a fundamental improvement in fuzzing from “mere” luck in choosing the right seeds? regehr says: June 22, 2020 at 12:55 pm Hi Stefan, this paper is good reading on this general subject: https://www.cs.umd.edu/~mwh/papers/fuzzeval.pdf"
