["https://blog.regehr.org/archives/46"]
title = "Picking a Research Topic in Computer Systems – Embedded in Academia"
full_description = "Matt Welsh says: March 24, 2010 at 10:39 am Hey! Comments are on! But why do you need my email address? 🙂 Seriously, this is a great post. My number one piece of advice related to this is to pick SOMETHING, ANYTHING to work on, and just jump into the deep end of the pool, even if you’re not sure it’s the right thing to do. I believe that the best way to latch onto a good problem is to take a stab at doing SOMETHING, and use the experience to inform your next steps. By diving in, you’ll learn one of two things: either (a) the problem is easy, or (b) the problem is a lot harder and more interesting than you initially thought. Even problems that seem “easy” at first blush often turn out to be hard when you start working on them. A student (or prof or anyone else) who spends too much time worrying about what problem to work on will rarely get anything done, and it is always possible to convince yourself that you’re working on the wrong problem. You can’t do research by standing on the sidelines; you have to be on the playing field, even if you’re playing the game all wrong. regehr says: March 24, 2010 at 8:41 pm Matt– I totally agree. You should do a full-length post on these kinds of ideas (or maybe you already did? it’s possible I missed it). I think it’s important for students to get a variety of perspectives on how to find and attack research problems. Cad Trainer says: July 31, 2010 at 7:56 am Have to agree with Matt. Paralysis by analysis springs to mind, if you spend too much time trying to find the perfect research area then you will achieve nothing. Perhaps switching the focus to discovering real world problems first will give you a more practical outlook on the needs of your potential employers going forward. Shuying says: December 3, 2010 at 8:25 pm well, valuable advices! But what I am thinking about is that, picking a research topic or area is kind of more complicated than what you have said! and what you said seems to only apply to those who already got their RAships. For those newly fresh phd students, picking a research topic is not decided by themselves: 1. The graduate school he/she got in has limited research area choices. 2. the interested area of research advisor does not have funding to support, but poor students need money to survive anyway. 3. the interested area of research advisor has so many students that te advisor would not take anymore students nor spend time on anyone who is not his/her current student. 4. Then the students try to find some other ways to get RAship, less matched interest, and doing the guessing games to get accepted. But who the hell know what is going on there and why not accepted nor even know the chances to belong to anywhere. Then where is my “dearest research topic”?!"
