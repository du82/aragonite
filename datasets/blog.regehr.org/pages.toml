title = "Synthesizing Constants – Embedded in Academia"
full_description = "Benjamin Shropshire says: November 7, 2018 at 2:14 pm Maybe I missed it, but it sounds like the only part of the counterexample being fed back into the process is the âˆƒ term. My instincts make me think that using the âˆ€ term would be more effective: – Start with the basic case, âˆƒC.âˆ€x.(LHS(x)=RHS(x,C)) – Find a C,xâ‚ that works – Fix C and find any counter example eâ‚ for x – Add a term to the problem (…âˆ¨LHS(eâ‚)=RHS(eâ‚,C)) – Repeat. For the running example, I’d expect that would run in at worst O(log n) iterations. Is there some reason that doesn’t work well in general? Or did I just skim over something in your post? regehr says: November 7, 2018 at 3:18 pm Hi Benjamin, I don’t believe the worst case here is going to be better than an exponential number of guesses for the constant, but I don’t have a proof of that. What you are suggesting is a way of selecting values of the input variable(s) used for specialization. Your way may well be better than what we do now, but experimentation is needed. If there is a way to synthesize an arbirary constant in O(bitwidth) solver calls then that’s huge. Benjamin Shropshire says: November 7, 2018 at 3:45 pm – I’ll conceded that O(exp(bits)) is still the worst (and expected?) case for arbitrary functions. And I don’t really have a feel for what differentiates random from function of interest to real world domains, so I can only guess at what effect that will have. – I was assuming n was the number of possible values which, now that I think on it, is not the normal notation. O(bitwidth) is the result I was thinking of. Nicolai HÃ¤hnle says: November 7, 2018 at 3:57 pm In fact, it would probably be “collapse the polynomial-time hierarchy” huge. Not that I have an immediate proof for that, but it does seem plausible to me that there’d be some kind of reduction to show that. kme says: November 7, 2018 at 6:49 pm If so, we issue a second query to see if C works for all values of x. If so, synthesis succeeds. If not, we add a constraint that this value of C doesnâ€™t work, and we start the process again. At this point, could you attempt to generalise the C counter-example? If you replace all bits but one of C with “don’t know” values and it still produces a counter-example, then you’ve halved the search space."
