["https://blog.regehr.org/archives/1576"]
title = "Trust Boundaries in Software Systems – Embedded in Academia"
full_description = "Richard Hipp says: February 12, 2018 at 2:16 pm > Anytime I put an assertion into my code, itâ€™s a tacit acknowledgment that I donâ€™t have complete trust that the property being asserted actually holds. That is not what assert() means to me. When I write assert(), it means that I, the writer, do absolutely believe that the condition is always true and that you, the reader, ought to believe it as well. If I have doubts about the truth of the condition, I’ll write something like: if( NEVER(condition) ){ … remedial action… } The NEVER() macro is so defined as to be a pass-through for release builds, but calls abort() for debug builds if the condition is true. An assert() is an executable comment. The fact that it is executable gives it more weight because it is self-verifying. When I see a comment like “/* param is never NULL */” I am much less likely to believe that comment than when I see “assert( param!=0 )”. My level of trust in the assert() depends on how well-tested is the software, but is almost always greater than my level of trust in the comment. Used in this way, assert() is a very powerful documentation mechanism that helps to keep complex software maintainable over the long term. Pat Thomson says: February 12, 2018 at 2:57 pm That is not how I view the use of assert(). Basically, if the condition is not true, stop before irreparable damage occurs or the system cannot recover in any meaningful way. The idea of an â€˜executable commentâ€™ doesnâ€™t make sense to me. Any code, not used for the direct purpose of the system, is just another failure point. regehr says: February 12, 2018 at 3:20 pm Hi Richard, if the assertion is guaranteed to be true, I guess I don’t understand why you would bother making it executable, instead of just leaving a comment? In many cases an English comment would be a lot more readable. I agree more with Pat: an assertion is not only documentation but also part of a defense-in-depth strategy against things going wrong, whether it is a logic error, some sort of unrepeatable state corruption, a compiler bug, or whatever. Of course I agree that an assertion is never used for detecting things that can legitimately go wrong in sane executions of the program."
