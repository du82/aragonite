["https://blog.regehr.org/archives/28"]
title = "Nine ways to break your systems code using volatile – Embedded in Academia"
full_description = "Bruce Wedding says: April 12, 2010 at 2:17 pm Regarding the example #5, I must be confused about the definition of a sequence point because the resulting assembly output seems to be non-ANSI C: void foo (int i) { message[i/10] = 42; ready = 1; } The full statement, message[i/10] = 42; is a sequence point. My understanding is that the fact that it is a sequence point ensures that it will be performed prior to the next line of code. So how can 1 be moved into “ready” prior to 42 being assigned the the message[] array, as your assembly output shows? foo: movl $1, ready … movl $42, message(,%edx,4) ret Your clarification is appreciated because it appears I don’t fully understand the purpose or behavior of a sequence point. It seems to me, if the lines of code in a function can be evaluated in any order, nothing would run. Thanks, Bruce regehr says: April 12, 2010 at 10:56 pm Hi Bruce- I’m glad you asked about this! You’ve touched on a part of the standard that I think is pretty ambiguous, and that even experts argue about. First, of course you are correct that there is a sequence point following “message[i/10]=42;” Second, here’s what the standard (I’m looking at page 25 of N1124) says about sequence points: “At certain specified points in the execution sequence called sequence points, all side effects of previous evaluations shall be complete and no side effects of subsequent evaluations shall have taken place. ” The question we now have to ask is: Is it a side effect to store to an element of message? Case 1: Yes, it is a side effect. The problem is that no optimizing C compiler takes this interpretation. For example, a compiler that took this literally would have to emit two stores if you wrote this code: “x=1; x=2;”. Of course, any good optimizing compiler will eliminate the first store as it cannot be observed. Case 2: The array store is not a side effect. In this interpretation, accesses to volatile objects and calls to side-effecting functions (like printf) are side effects, but stores to globals are not. If we take this view (all optimizing compilers I am aware of do) then the text I wrote in this post applies. Hope this is helpful!"
