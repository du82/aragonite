["https://blog.regehr.org/archives/1510"]
title = "Translation Validation of Bounded Exhaustive Test Cases – Embedded in Academia"
full_description = "Alex David Groce says: May 9, 2017 at 6:33 pm How critical was the exhaustiveness? That is, you guys generated 44.8 million functions. Presumably, in fact, you don’t need all of those to completely test what you tested. But without some abstraction we can’t get, no way to know how much we needed. Fine. However, for the bugs you found, do you guys have a way of binning the functions exposing them by bug that is reliable? If so, one way to guess redundancy of the exhaustive tests is to see the smallest bin size. That is, if you have a bug where there is only one example in the 45M functions, it argues that either you really need them all, or at least that the abstraction to collapse redundancy is fairly complicated (since I assume any function you generate has some very, very similar functions in the set). Alex David Groce says: May 9, 2017 at 6:35 pm On the other hand, if your smallest bin is about 500 functions, maybe something with bigger size and less exhaustiveness is worth figuring out. regehr says: May 9, 2017 at 7:41 pm Hi Alex, my impulse here is to burn cycles testing stuff rather than burning brainpower figuring out where we can cut corners. But on the other hand, if we want to push past 4 or 5 instructions and/or wider integers, we’ll obviously need to give up on exhaustiveness. But you know (I think) my top-level view of bugs, which is that they don’t have models. So it’s not at all clear that what we learn from this crop of bugs would carry over to any other crop of them. Alex David Groce says: May 9, 2017 at 7:55 pm Fair enough. Yeah, exhaustive when you can, definitely. I’m just worried about bugs whose shortest instance is 7 instructions. I am guessing this won’t cut it. Also, doesn’t ALIVE runtime go up after 6 or so, making you need to prune even more? regehr says: May 9, 2017 at 8:09 pm I’m not sure I have a good handle on Alive runtimes, but it definitely goes through the roof if you have a wide divide. Just depends a lot on the details. My sense is that for 7+ instructions we just go to random sampling. So probably I should make another 50M functions that are quite a bit larger than these, and we check out their bugfinding power. But there’s a bit of a problem: take a look at the structure of opt-fuzz, it’s a chain of choose() operations. In random mode the outputs will be skewed heavily by the order in which I chained things. Obviously this doesn’t matter in exhaustive mode. To get a good random generator out of this code I’ll need to either restructure the code or somehow otherwise reshape the search tree. Also I’ve already cut corners in a few important cases such as never generating instructions where all inputs are constants, since those trivially fold to something shorter. So we’ll miss bugs in the folder, which I’m not really worried about."
year_published = 2017
