["https://blog.regehr.org/archives/2265"]
title = "Formal-Methods-Based Bugfinding for LLVM’s AArch64 Backend – Embedded in Academia"
full_description = "BCS says: June 6, 2022 at 5:26 pm Does LLVM have any support for moving arch specific peephole optimisations into the middle end? I’m things of a way to plug in middle end passes that only run when a given backend is to be used and that ensure that the generated IR is easy to translate into good ASM for the current target arch? If that was a thing, it would reduce the portion of the compilation path that requires application specific tools (like that lifter) to apply this sort of formal verification to. Sebastian says: June 8, 2022 at 8:35 am Bugs in the compiler result in bugs in the programs the compiler produces. When the bugs in the compiler get fixed, after a recompile the bugs in the programs get fixed too. What kind of efforts exist to audit/inspect/scan large and essential open-source projects like Firefox, the Linux kernel, etc. comparing the resulting binaries before and after fixing the compiler bugs you have found, in order to try to find out what kind of effects your project has had on runtime logic of these widely-used binaries? I would assume that in some cases the binary outputs are the same, the compiler produces the same programs before and after the compiler fix. But on the other hand, some compiler fixes can be in often-exercised code paths that can have large effects on the compiler outputs. regehr says: June 8, 2022 at 1:45 pm hi BCS, I’m not aware of any support for moving transformations between the middle end and backends — I don’t think that would be straightforward. something that can be done here would be to have checkers for IRs that live only inside the backends, such as MIR. we’ve not looked into this but we’re at least somewhat interested in that. regehr says: June 8, 2022 at 1:48 pm hi Sebastian, I’m not aware of any work in that direction, but it’s something that I’ve often wanted to try. I think the main thing to be worried about would be a small fix to the compiler triggering huge changes in the output (for example because register allocation is affected) but then almost all of the changes are not really related to the fixed bug. the only way to truly figure out if a program like Firefox had been being miscompiled is to test its functionality (as opposed to looking at its assembly code) before and after the compiler is patched. but this is hard."
