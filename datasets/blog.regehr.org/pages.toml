["https://blog.regehr.org/archives/1633"]
title = "Learning When Values are Changed by Implicit Integer Casts – Embedded in Academia"
full_description = "Lars says: November 3, 2018 at 2:06 am These problems are also caught by GCC when using options -Wconversion and -Wsign-conversion. Shafik Yaghmour says: November 3, 2018 at 9:02 am Note that w/ uniform initialization we will obtain a diagnostic since narrowing conversions are ill-formed modified version of your examples: int x = -3; unsigned y{x}; int x2 = 300; unsigned char c{x2}; and from the obligatory godbolt: https://godbolt.org/z/vjY-XG we obtain a diagnostic for both cases. See this Stackoverflow answer that I wrote for explanation as to why gcc and clang treat narrowing conversions differently wrt to making them warnings or errors: https://stackoverflow.com/a/31685448/1708801 regehr says: November 3, 2018 at 11:40 am Lars, both compilers can emit conservative warnings about this, but that is very different from reporting actual changes in value during execution. John Payson says: November 3, 2018 at 12:47 pm The relationship between the choice of unsigned/signed types with the size of int and the presence or absence of defined wrapping behavior should be viewed as a historical accident. Consider the effect of “x *= x;” when x holds the largest value of its type, for various types. Because code written for system with different sizes of “int” in the days before the Standard would have different expectations as to which values behave as signed or unsigned, and the Standard wanted to minimize impact on such code, the Standard ends up mandating that some systems process the difference between two uint16_t values as an unsigned type, and that other systems process it as a signed type. Adding some new fixed-sized types whose semantics would be independent of the size of “int” would allow implementations to tailor their optimizations and diagnostics far more usefully than is possible with the existing types. If a struct member is supposed to represent a number of things from 0-65535, an attempt to add one when it holds 65535 should be considered a mistake which should be reported by a diagnostic build. If a struct member is supposed to represent a 16-bit checksum, an attempt to add one when it holds 0xFFFF should be considered normal. If the first purpose were served by a “16-bit whole number” type and the latter by a “16-bit wrapping algebraic ring” type, a compiler could easily and usefully generate a diagnostic in the first case but not the second. If the same “uint16_t” type is used in both cases, however, it would seem difficult to ensure that diagnostics from the erroneous actions get noticed without someone having to wade through lots of useless diagnostics from valid actions."
