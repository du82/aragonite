["https://blog.regehr.org/archives/2485"]
title = "Why Do Peephole Optimizations Work? – Embedded in Academia"
full_description = "benjamin shropshire says: November 1, 2023 at 10:32 pm What do you think the odds of C/C++ of getting a version of undefined behavior that still allows almost all “valid” (as the human end user sees it) optimizations without invoking nasal demons? I’m thinking the kind of thing where divide-by-zero would be defined to evaluate to “an undefined value of the appropriate type” without allowing the assumption that operation is unreachable to back propagate thought prior logic. regehr says: November 3, 2023 at 8:50 am Hi Benjamin, I think that’s really hard to do for the nastiest UBs, the memory safety violations. It’s just very hard to let a program throw a store somewhere random and then make predictions about the program’s subsequent behavior. But sure, almost all of the other UBs could be constrained, and in fact there have been efforts to do this, but they didn’t really catch on for reasons I don’t know. Xuyang Li says: November 3, 2023 at 10:38 am It seems that Contextual Refinement (https://dl.acm.org/doi/abs/10.1145/3571232) is a more accurate term for peephole-optimizable code’s property"
