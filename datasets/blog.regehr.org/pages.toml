["https://blog.regehr.org/archives/1603"]
title = "How LLVM Optimizes a Function – Embedded in Academia"
full_description = "Suyog Sarda says: September 3, 2018 at 10:03 pm This is very nice summary of IR Passes. I found “InstCombine” pass to be easier to start with to understand the code flow in LLVM IR Pass. Maybe the beginners can start with that first. Alexander Monakov says: September 4, 2018 at 12:43 am > This one simple trick halves the number of loads issued by this function. Both LLVM and GCC only got this transformation recently. Interestingly, GCC had the capability to do that for quite a while, just not with GVN, but with the “predictive commoning” pass designed specifically for that purpose (hence the ability to carry loads over more than one iteration). On this particular example though, it was not working as intended, because an earlier pass designed to transform the loop into suitable form (“loop header copying”, similar to loop rotation in the article) was copying too much, effectively duplicating one iteration of the loop in its preheader. Once header copying was throttled down (GCC bug 85275), predictive commoning was able to do its job. Johannes Doerfert says: September 4, 2018 at 3:19 am Great article! We need more of these and we should start to link them on the LLVM webpage (if you haven’t already). One small comment I have concerns loop rotation. First, the rotated loop CFG should be: initializer if (condition) goto BODY else goto EXIT BODY: body modifier if (condition) goto BODY else goto EXIT EXIT: which is different because now, the rotated loop requires one less branch compared to the original loop. While that is already a nice achievement, the rotated loop exposes other optimization opportunities. If we can prove the first guard to be always true, thus the loop to be always executed, we can reuse values defined in the loop without the need for a phi in the loop exit node. This is beneficial since the fact that the loop is always executed is now encoded in IR. Otherwise, we would later analyze the loop multiple times to determine that we’ll never see the initial value (which flows into the loop) but always on defined in the loop. [This is hard to explain without an example, I hope it makes some sense.] Finally, the patch you refer to seems to have never made it in. If that is true, maybe it is a bit misleading."
