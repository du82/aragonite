["https://blog.regehr.org/archives/1559"]
title = "Stories Behind Papers: Integer Overflow – Embedded in Academia"
full_description = "Joshua Green says: February 5, 2018 at 7:05 pm A second kind of non-standardization occurs with constructs such as INT_MIN%-1 which isâ€”by our readingâ€”well defined in ANSI C, C99, C++98, and C++11. However, we are not aware of a C or C++ compiler that reliably returns the correct result, zero, for this expression. This reminds me of this post (several of the examples should be well-defined but no sane/efficient implementation can handle them) as well as this thread (in which it was finally decided that the standard was clear and, hence, the compiler had to be updated). Dirkjan Ochtman says: February 6, 2018 at 2:39 am Have you looked at the way Rust works with integers? I would be interested in your take. regehr says: February 7, 2018 at 4:11 pm Hi Dirkjan, I like Swift’s story for integer overflow (always trap on overflow) better than Rust’s, and I hope Rust will change over to this model at some point. jpa says: February 12, 2018 at 5:22 am This is old news (from 2010) but I guess it hasn’t been mentioned here yet. With the recent bitcoin hype, this could be dubbed the quadrillion dollar bug: https://en.bitcoin.it/wiki/Value_overflow_incident Paul Muntean says: February 20, 2018 at 2:49 am Hi John, thank you for the inspiring post, it really shows that collaboration can lead to better results then when working alone. I liked the point you stressed out that not competition is your main drive. Btw. are you aware of any active research going further into this direction (e.g., compiler based detection of int./buffer (over/under)flows)? Keep publishing such inspiring blog posts! John Payson says: March 7, 2018 at 4:12 pm It would be helpful for the Standard to recognize optional guarantees which implementations could offer and programs could demand (compilers could either adjust behavior based on programs’ demands, or allowed to reject programs whose demands they cannot met). For programs that will be given data from untrustworthy sources (a very common scenario), there would be great value in having all integer computations be guaranteed to either yield some kind of result or force an abnormal program termination unless a program has configured some alternative behavior. Requiring that integer operations yield a precisely-specified result in all such cases would impair many optimizations that would otherwise be safe and useful. Allowing a compiler to treat signed computations as though performed on larger type and then truncate results on an as-convenient basis [as is done with floating-point types when FLT_EVAL_METHOD is not greater than zero] would allow must useful optimizations to be retained while still constraining the effects of out-of-range computations. Such semantics would allow a compiler to treat (x+1>y) as (x>=y) at its convenience, but would not allow a compiler to treat the evaluation of x+1 as justification for omitting code elsewhere that evaluates (x<INT_MAX)."
