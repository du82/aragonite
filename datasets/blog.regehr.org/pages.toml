title = "You Might as Well Be a Great Copy Editor – Embedded in Academia"
full_description = "John Carter says: June 24, 2020 at 2:56 pm Alas, our minds automatically fill in gaps and cover over mistakes when we read. Especially reading our own writing. If you’re a fast reader, your mind does this for you, allowing to skim and focus on the essence. If you’re writing, this is a disaster. You can blindly skim passed your own mistakes _every_ time. Solution? Read aloud. To your dog if need be. The process of vocalizing forces more of your brain to be involved. Your finite breath forces sentences to fit within your lung (and hence also brain) capacity. Feed back from your ears tells you, ‘Hey! that sounded pretty bad….” Jim Grey says: June 25, 2020 at 2:57 pm I edited technology books early in my career (gulp, 25 years ago) and the publishing company issued all of us a copy of Line by Line. I’m pleased to see you recommend it too! Cenk says: June 26, 2020 at 6:31 am If I could recommend another book it’d be “Bird by Bird”. It’s not directly about academic writing, but many of the same principles apply and it greatly helped me. https://boook.link/BirdbyBird I also agree with John Carter — reading aloud is a very good technique for finding mistakes you’d otherwise overlook. In programming we do something called “rubber ducking”, where we explain what we are working on to a rubber duck (or other inanimate object) while debugging. regehr says: June 26, 2020 at 12:49 pm John: this is a great idea! Jim, I have not seen a lot of people recommending this book, this is great to hear! Thomas: thanks, fixed. Cenk: thank you! Abida Haque says: August 6, 2020 at 10:47 am I’m not quite sure if what is described in the blog is copy editing or rather line editing. From my understanding, copy editing has to do with grammar, usage, and style only, whereas line editing has to do with making individual sentences or paragraphs better. An overly long and confusing sentence could still be grammatical and use en-dashes appropriately."
year_published = 2020
