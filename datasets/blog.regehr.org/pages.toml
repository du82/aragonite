["https://blog.regehr.org/archives/1496"]
title = "Taming Undefined Behavior in LLVM – Embedded in Academia"
full_description = '''Eelis says: April 15, 2017 at 4:55 am Interesting post, but you lost me at “Letâ€™s try to do that using undef”. Why bother with notions of an “undef value” (or “deferred UB”), when plain UB is all you need? 1. If the input is not INT_MAX, the addition returns input + 1. 2. If the input is INT_MAX, the addition results in UB. Since the optimizer may assume that the program won’t incur UB, it can assume that case 2 does not happen, and so only case 1 has to be considered, where x+1>x indeed holds. Done. No? regehr says: April 15, 2017 at 10:09 am Hi Eelis, if you only have immediate UB, speculation becomes impossible. For example, you can almost never move loop-invariant code out of loops. Eelis says: April 15, 2017 at 11:53 am How does that affect the case in question? Or are you saying that it was a bad example? victor yodaiken says: April 15, 2017 at 2:24 pm The compiler is going to use the rule “x+1 > x” when x is signed to validate an optimization which is to replace “x+1 < x" with FALSE. But the compiler does not actually guarantee that x+1 is greater than x and the C standard doesn't guarantee it either. In fact the C standard, by defining a maximum value for a signed int clearly implies otherwise. Hard to imagine how greater(x+1,x) and less(x,MAX_INT) both can be true theorems. Since assuming something false allows you to prove anything, the compiler can perform an unsound transformation. More practically, consider when we have code including, say, a data structure from an OS or library definition. If the upstream maintainers change member definitions from unsigned to signed, the program code is now silently asking for an unsound transformation that something like Coverity will flag, but the compiler does not. What it looks like on the outside is that considerable ingenuity and effort are being expended to defend an optimization that is of limited utility. What would be more useful is a warning of a type error so that the programmer could choose to optimize by hand, which is simple , or to use type coercion to avoid the ambiguity. C is not a language that is designed for complex transformations and I believe compiler developers would do better to consider programmers as colleagues who would benefit from better diagnostics and analysis.'''
