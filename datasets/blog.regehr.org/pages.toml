["https://blog.regehr.org/archives/1520"]
title = "Undefined Behavior in 2017 – Embedded in Academia"
full_description = "Noah says: July 5, 2017 at 1:13 am Since you talk about the sanitizers and tools like Checked-C, I’ll note there’s also SaferCPlusPlus[1], which is essentially a memory-safe (and data race safe) subset of C++. The idea is that there are a finite number of C++ elements that contribute to memory unsafety, and since the advent of C++11, it is now practical to simply avoid/prohibit those elements, and substitute them with fast, safe, compatible replacements. While valgrind, the sanitizers, and the various static analyzers can reduce the number of bugs dramatically, none of them fully solve the memory safety problem. You’re still playing whack-a-mole, albeit with bigger mallets. A more complete solution is to migrate to a memory safe language, and the memory safe language embedded within C++ itself is the one that’s easiest to migrate to. There’s even a tool[2] in early development (but already functional), to do much of the conversion (from C to SaferCPlusPlus), automatically. [1] https://github.com/duneroadrunner/SaferCPlusPlus#safercplusplus-versus-clangllvm-sanitizers [2] https://github.com/duneroadrunner/SaferCPlusPlus-AutoTranslation octoploid says: July 5, 2017 at 1:26 am The rules for Unsequenced Modifications will change in C++17: http://wg21.link/p0145 If I understand them correctly then e.g. foo(++i, ++i, ++i); is now well defined (indeterminately sequenced). jpfr says: July 5, 2017 at 2:30 am How do the TIS interpreter and kcc (https://github.com/kframework/c-semantics) compare when it comes to finding UB? Toby says: July 5, 2017 at 5:11 am Fantastic post. I’ll be putting it on the reading list for my software testing and security course. “The user can configure the size of the quarantine in order to trade false positives for resource usage.” False positives or negatives? John Doe says: July 5, 2017 at 5:22 am You say that “C is a portable assembly language” is a tired maxim that should not be repeated, but provide no arguments for that position."
