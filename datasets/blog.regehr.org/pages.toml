["https://blog.regehr.org/archives/1700"]
title = "Helping Generative Fuzzers Avoid Looking Only Where the Light is Good, Part 1 – Embedded in Academia"
full_description = "Alex Groce says: November 4, 2019 at 9:04 am John, I started to say “swarm testing mitigates this specific problem” in that it has a 50% chance of lopping off one side of an unbalanced tree, in some runs, so ups the probability of taking the other, longer side. Of course, naively done, this is actually terrible, because a depth k leaf has 1-(0.5^k) chance of even being possible in each generation run. BUT there is a better way, I think. In TSTL, the swarm configuration code first computes dependencies, then chooses to include/not include each grammar element (including leaves) independently. And then it applies a fixpoint where if X is in the configuration, you must have at least one way to produce each thing X consumes in the configuration. E.g., if you have: := := Then if you flip the coin to include you will randomly add either or if neither is already present. This doesn’t do what you want, but if you ALSO had the rule that if X is in the set, and there are consumers of X, then at least one consumer must be present, you’d get something that sounds painful to analyze for probabilities, but seems like it ought to boost leaf probabilities quite a bit, by randomly building a path back to the top of the grammar from each leaf with 0.5 probability. And the fewer leaves you have under you, the fewer opportunities you have to be thus included, so it’s proportional to subtree size. Alex Groce says: November 4, 2019 at 9:06 am Ugh, it ate my grammar, of course, due to angle brackets. The example, rewritten, is: If you have: EXPR := NUM EXPR := STR then if the coin for EXPR comes up heads, and those are the only ways to produce an EXPR, you randomly include one of STR or NUM, if they aren’t already in the configuration. Alex Groce says: November 4, 2019 at 9:10 am The new proposal would be that if you have: STMT := ASSIGN(VAR, EXPR) STMT := HALT STMT := CATCHFIRE STMT := IF (EXPR) STMT ELSE STMT ENDIF EXPR := NUM EXPR := STR Then if you include STR, you are forced to include EXPR, and to include either ASSIGN or IF."
