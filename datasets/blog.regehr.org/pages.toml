title = "Precision Opportunities for Demanded Bits in LLVM – Embedded in Academia"
full_description = "Benjamin Shropshire says: January 22, 2020 at 12:53 pm This seems like a portion of the compiler that would very much benefit from a non-imperative implementation. If better rules could be implemented as pattern & substitutions and those considered in a composable way (trivially easy and compact to add and remove) then real world exploration of the value of these vs. the downsides you list might be much more practical. – Turning them on/off to see the effect on compile time would be easy (at least at build time). – The maintenance overhead would be minimized during the exploration phases. – Taking each one by it self could also significantly reduce the cost of verification. IIRC you were involved in some work in that direction for the instruction combiner pass? Did anything ever come of that? regehr says: January 22, 2020 at 8:45 pm Hi Benjamin, absolutely. Some sort of DSL would be ideal for this stuff. I think the problem is that there’s quite a bit of work needed, both initially and on an ongoing basis, to create and maintain such a thing, and that that LLVM community would be correct to be suspicious of it, unless there was someone who was clearly capable of maintaining this indefinitely. Replacing InstCombine with code generated from a DSL is still something I’m very much interested in, and I believe the LLVM community is also interested, but there’s the same problem. John Payson says: January 24, 2020 at 6:54 pm > Undefined behavior in C and C++ has a similar rationale: by avoiding specification of an implementationâ€™s behaviors in numerous inconvenient situations, more efficient implementations become possible. Have you read the published Rationale for the C Standard? The way it describes UB is rather different from what the above description would suggest. Because different implementations are used to accomplish different kinds of tasks, some of which require the ability to do things not provided for by the Standard, implementations are given the freedom to either process various actions in a predictable fashion which would facilitate such tasks, or to perform optimizations on the assumption that code will not perform such actions, depending upon which approach would allow their customers to most effectively accomplish what needs to be done. While it may be interesting from an academic standpoint to examine what the Standard does and does not attempt to require in various situations, it is important to remember that the Standard does not attempt to mandate that implementations be suitable for any particular purpose. Indeed, the authors acknowledge when discussing translation limits that it doesn’t even mandate that implementations be suitable for any useful purpose. “While a deficient implementation could probably contrive a program that meets this requirement, yet still succeed in being useless, the C89 Committee felt that such ingenuity would probably require more work than making something useful.” Consider, for example, a function like “unsigned mul_mod_65536(unsigned short x, unsigned short y) { return (x*y) & 0xFFFFu;}” The authors of the Rationale describe, starting on page 44 line 20, how that would be processed by “most current implementations” in situations where the Standard would pose no requirements. I think it entirely plausible that the authors of the Standard would not have wanted to require a compiler for a 36-bit ones’-complement Univac with 18-bit “unsigned short” to generate the code needed to ensure a correct mod-65536 result in cases where the mathematical value of the product would be in the range 0x800000000u to 0xFFFFFFFFFu, but that text on page 44 would make no sense if the authors of the Standard didn’t expect that commonplace implementations for 32-bit platforms would process the code usefully for all possible inputs. With regard to the specific subject of this article, does LLVM maintain dependency information in cases where no bits of a value end up being used? By my understanding of the Standard, if some action is sequenced before a read of “x”, such an action would also be sequenced before the write performed by the assignment expression “y = x | intExpr;” even if a compiler determines that “intExpr” will always be -1. There may not be any need to actually read the value of x, but the dependency should still remain. Does LLVM maintain dependency information in such cases?"
