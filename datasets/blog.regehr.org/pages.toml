title = "Use of Assertions – Embedded in Academia"
full_description = "Magnus says: February 2, 2014 at 9:21 pm I’ve thought for quite a while that ‘assert’ should have a meaning in release (optimised) builds, which is that the compiler can assume the condition is true. E.g. if you know that a variable will (should!) always be a power of two, asserting so might let the compiler use a shift operation in a release build. As for mistakes while using assertions, I made one some months ago while doing something tricky. I’ve always assumed that assert was implemented if _DEBUG was defined, and a NOP otherwise. In fact it’s the other way around and a kind of double negative: assert is implemented only if NDEBUG is not defined! regehr says: February 2, 2014 at 10:03 pm Hi Magnus, both GCC and LLVM support __builtin_unreachable(), so it is easy to implement assert() like this in release builds: #define assert(x) if (!(x)) __builtin_unreachable() I just tried this for a small assert-heavy C file that I had sitting around and it did not seem to result in better code being generated by either Clang or GCC. It is possible that the optimizers have not been taught to exploit the dead paths that this produces, and it is also possible that the code I tried simply does not contain the correct assertions that would make good optimization possible. Philip Guo says: February 2, 2014 at 10:05 pm I tend to think by writing, so my code is littered with tons of comments (with embarrassing ASCII art for diagrams). One trick that’s worked well for me is to encode as many of those comments into assertions as possible. From an informal count of several of my research projects, I found ~3% of lines to be assertions — 1 assertion per 33 lines. I think that was Python code, though, so there’s less boilerplate. I wrote a more fluffy version of your piece here: http://pgbovine.net/code-carabiners.htm regehr says: February 2, 2014 at 10:05 pm On the other hand, it’s not hard to construct examples by hand where __builtin_unreachable() does result in (slightly) better code generation, such as when this is put at the end of a switch whose cases are meant to be exhaustive."
