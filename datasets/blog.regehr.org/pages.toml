full_description = "Olivier Gay says: December 16, 2010 at 6:31 am C1x Committee Draft now says: 6.5.5p6: “When integers are divided, the result of the / operator is the algebraic quotient with any fractional part discarded.105) If the quotient a/b is representable, the expression (a/b)*b + a%b shall equal a; otherwise, the behavior of both a/b and a%b is undefined.” So INT_MIN % -1 is now clearly an undefined behaviour. regehr says: December 16, 2010 at 8:05 am Hi Olivier- I’d heard about this, but hadn’t looked up the language. This is definitely an improvement!"
