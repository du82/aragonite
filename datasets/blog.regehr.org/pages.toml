["https://blog.regehr.org/archives/1594"]
title = "Software Engineering Takeaways – Embedded in Academia"
full_description = "Flash Sheridan says: May 17, 2018 at 5:06 am Excellent article; one nit: > If the coverage induced by a test suite is bad, the test suite itself is bad. In a fallen world, things may be messier than that. One of the things I learned doing static analysis on commercial code is that code nobody cares about gets a disproportionate proportion of hits. Sometimes there is a good reason for this, e.g., zombie code; sometimes you can ignore the (ultimately) unimportant part of the codebase. Sometimes you have to live with the imperfection, at least temporarily. More generally, donâ€™t be too sure of _any_ metric, and remember that what gets measured gets gamed. (I allude to this in my Dr Dobbâ€™s article, but in retrospect it deserved more discussion.) John Payson says: May 22, 2018 at 3:03 pm One issue I haven’t seen discussed much is the fact that many programs are reliant upon behaviors which are not described in a language standard, but rather an implementation’s documentation. If code is ported from an implementation which documents that a construct will always be processed a certain way, to an implementation which would seem like it should logically do likewise, but it occasionally processes the construct differently, that can easily lead to a variety of hard-to-track bugs which may appear and disappear in response to changes in seemingly-unrelated parts of the code. To date, the C Standard has not tried to define all the behaviors necessary to accomplish most tasks with the C language, but instead treats support for features beyond the Standard as a Quality of Implementation issue. Judging from the rationale, the authors seem to believe that if it’s obvious that a quality compiler should do something, it shouldn’t matter whether the Standard actually mandates that behavior or not. Unfortunately, whether or not it *should* matter, it’s increasingly apparent that it does. What I would like to see as a solution would be for the Standard to recognize the difference between specifying a behavior and mandating it. Say that if a program contains various directives, implementations would be free to reject or–in most cases–abnormally-terminate them, but must otherwise provide features and guarantees beyond what the Standard would otherwise require. The choice of whether to accept, reject, or abnormally terminate a program would generally be a QoI issue, but any other way of incorrectly processing an accepted program would make an implementation non-conforming. Such an approach could ease arguments about whether it is “obvious” that quality compilers for a platform should be expected to support a particular construct or behavior. If a program includes a directive that demands a behavior, compilers would be free to reject it, but higher-quality compilers should avoid needlessly restricting the range of programs they can process. That would thus make it clear that compilers which can usefully support behaviors should do so when the directives are specified, and programmers that want to use behaviors that wouldn’t otherwise be mandated by the Standard should include directives specifying them."
year_published = 2018
