["https://blog.regehr.org/archives/1515"]
title = "Compiler Optimizations are Awesome – Embedded in Academia"
full_description = "Dean Franks says: May 30, 2017 at 3:21 pm Another reason for optimizing compilers: It allows us to write simple and obvious code expecting that the compiler will do the optimization. This both reduces the initial defect count and makes the code more maintainable in the long-run. Note that these are also often the simplest optimizations (e.g. a calculation inside a loop where none of the inputs to the calculation change during loop execution) that reduce the need to create intermediate variables that can obscure the ultimate function of the code. regehr says: May 30, 2017 at 3:54 pm Dean, definitely — looking at contorted old C code makes a really strong argument for modest optimization power. bcs says: May 30, 2017 at 4:29 pm A maybe even better argument: portability. If I write code to some reasonable trade off between measured performance with optimizations on $RANDOM_MACHINE and readability, I can with reasonable certainty expect it to be reasonably performant on almost all machines. If I hand tune for the best possible performance (with or without optimization on) on that same single machine, I am probably working counter to my self for all the systems I’m not testing on. Sam Tobin-Hochstadt says: May 30, 2017 at 4:41 pm As I said in a comment after the talk (too bad it wasn’t recorded), one of his primary examples of code that was so complicated it needed to be optimized by had was the LuaJIT interpreter loop, ie the core of _an optimizing compiler_. Also, his suggestion for what to do about this was to build tools that allowed higher-level specification of the tight assembly loops he wanted to write, ie an optimizing compiler. John Tarbotton says: May 30, 2017 at 4:52 pm I must agree. Our resources are so constrained it will not run without maximum optimization. Sure we can write code that runs but it is very hard to read and finding people good enough to maintain it is hard. Even if the supply of great people was unlimited it is much cheaper to let the compiler do the work. The quality of optimizers has increased to the point hand optimizing is rarely needed and next year when we move to a new processor we will mostly have configuration code and low level drivers to change."
