["https://blog.regehr.org/archives/140"]
title = "C Compilers Disprove Fermat’s Last Theorem – Embedded in Academia"
full_description = "Justin Smith says: April 28, 2010 at 11:29 pm (You probably already have realized this.) The reason the compiler produced code that terminated was based upon the fact that the values being altered (i.e., a, b and c) within the “while” loop are never referenced again after the loop. But, once you added code which printed the resulting values it was forced to actually generate the code for the loop. Justin Smith says: April 28, 2010 at 11:33 pm I suspect your earlier “do…while” loop would also compile to a program which indefinitely iterated if you were to utilize the value “i” (in a non-trivial way) after the loop. regehr says: April 29, 2010 at 8:51 am Hi Justin- Yeah, it’s the lack of side effects that lets the compiler get rid of these loops. The problem is whether non-termination is considered a side effect! Regarding the do..while loop, you’re right, the Intel compiler for example no longer eliminates the loop. Cyrus Omar says: April 30, 2010 at 10:49 am A compiler could prove that that does not terminate. Trivially, you can run it for a while (10^9 iterations) and you’ll end up back at your initial conditions, guaranteeing it will never terminate. I’m sure one could conceive of a more general class of termination conditions and a more efficient way to detect those that would also include this loop. Problem is computer arithmetic is finite so any “for-all” type statement in math will be problematic to use to thwart a compiler. pdw says: April 30, 2010 at 4:25 pm It’s important to remember that C ints are not mathematical ints. In particular, C ints have an upper limit and overflow is undefined behavior. There are two cases to consider: 1. There’s a solution. The loop terminates and it can be omitted as the results are unused. 2. There’s no solution. The int a will eventually overflow, and the behavior of the code is undefined. Thus the compiler is allowed to do anything, including omitting the loop. At least gcc 4.1 and later will perform such optimizations."
