title = "Outdoors – Page 2 – Embedded in Academia"
full_description = "Obelisk Classes start next week so I sneaked out for a quick hike on Tuesday, climbing a minor local peak that is informally called The Obelisk. This one had eluded me for years so it felt nice to finally stand on top. Summitpost says “Obelisk is rarely climbed during the summer and provides ample solitude,” and… August 18, 2016 Perseids Matthew Flatt, my 9 year old son, and I stayed out last night watching the Perseid meteor shower. To find some dark skies we drove out to the Utah-Nevada border, along the way passing a sign that said “NEXT GAS 130 MILES” — always a good sign on a road trip. We arrived around 12:30… August 12, 2016 Happy Canyon I’ve been doing a poor job of taking pictures in Europe. On the other hand, I’ve had a trip report on the back burner since last spring, so let’s look at a few pictures from that. Happy Canyon, in a remote part of southeast Utah, has a scenic and non-technical narrow section that would be… March 25, 2016 Adandoned Mineshaft Due to my 8-year-old’s obsession with Minecraft, the abandoned mineshafts found in the game are an everyday topic of discussion around the house. He is saving up to buy a pickaxe — no joke. Since we needed a day trip for the long weekend, I thought we’d visit some actual mines in the Silver Island… February 16, 2015 Fall in City Creek Canyon I’ve lived in Utah for a while now, in three different houses, but always a short walk from City Creek Canyon. This drainage starts right at the edge of downtown SLC and goes 14 miles up into the Wasatch Range. A service road provides easy walking access all year, although the upper parts are not… October 14, 2014 Broads Fork After moving to Utah I decided that regularly spending time in the mountains was one of the best ways to stay sane and healthy. Since I usually can’t make time for an all-day hike, I developed a habit getting up around 5, hiking hard for a couple of hours, and then getting into the office… July 1, 2014 Cedar Mesa For years I’d heard people talk about Cedar Mesa, a remote part of southern Utah containing so many Anazazi ruins that it’s basically a huge outdoor museum. Recently my family spent a few days exploring this area. Despite the fact that Cedar Mesa is well-known — it was popularized, in large part, by a book… May 6, 2014 A Few Panoramas In the early 2000s, decent digital cameras were new and I was obsessed with stitching photos into panoramas. At the time the software sucked and doing a good job was a lot of work. However, I assembled plenty of them and figured out how to get them printed and my house is somewhat littered with… October 16, 2013 Great Salt Lake Desert Road Trip A few weeks ago, Matthew Flatt and I took a short road trip to the area west of the Great Salt Lake. We arrived at the Bonneville Salt Flats before dawn. Unexpectedly, there were plenty of people out on the playa; it turned out to be “Speed Week” where drivers from all over the world… September 10, 2013 Mt Washington Although I lived in the eastern USA for 10 years, all of my hiking experience has been in the west — so I was happy to take advantage of being in New England last week to climb Mt Washington, the highest mountain in that part of the world. The weather on Washington is famously erratic… August 6, 2013 ←Previous Page 1 2 3 4 … 7 Next Page→"
