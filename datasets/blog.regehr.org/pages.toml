title = "Explaining Code using ASCII Art – Embedded in Academia"
full_description = "Magnus says: February 18, 2019 at 4:04 pm Ha ha brilliant! I’ve done plenty of these, when I wanted to switch half my brain off but still do something time-consuming and fiddly, but still kind of productive. Very therapeutic! Tymtam No Choc says: February 18, 2019 at 7:57 pm These are examples of beauty in engineering. Using text, not images, would make it b.e.a.u.t.i.f.u.l. Phillip says: February 18, 2019 at 9:54 pm You should publish them, it’s a good way to store knowledge besides being therapeutic. I’d personally would love to see classic science books put in this format, Euclid’s Elements or Newton’s Opticks but don’t have the time to do the work. I think this and something like itty.bitty.sites could help ease access to information. Nick says: February 19, 2019 at 3:00 pm You might be interested in stream-tree, a library I created for expressing functions as ASCII flow charts in JavaScript. https://github.com/Widdershin/stream-tree Here’s an example of a slides app that uses stream-tree. https://github.com/Widdershin/how-to-write-javascript-without-going-insane/blob/ce84669d40c7109c8c10b93175f5b56bd2079a24/index.js#L55-L108 foo says: February 20, 2019 at 7:40 am I did some animated ascii art explanations of basic algorithms a while ago https://stackoverflow.com/questions/198199/how-do-you-reverse-a-string-in-place-in-c-or-c/21617273#21617273 https://stackoverflow.com/questions/21863609/building-a-binary-heap/43077941#43077941 https://stackoverflow.com/questions/4833423/shell-sort-java-example/22408617#22408617 Dan says: February 20, 2019 at 6:20 pm Nice collection! One more category that seems like it would fit is describing the hardware that will be controlled by the software. Warren Creemers drew/gathered a collection of Arduino layouts to add as comments in Arduino scripts: http://busyducks.com/wp_4_1/2015/11/16/ascii-art-arduino-pinouts/ (github: https://github.com/busyDuckman/ascii-art-arduinos) There is also a tool called AACircuit by Andreas Weber that is used to lay out circuits in ASCII art: https://josoansi.de/aacircuit.php (github: https://github.com/Andy1978/AACircuit) Gary Richardson made a Python version, but I haven’t been able to track down the actual files. Here’s his post about it back in 2005: http://sci.tech-archive.net/Archive/sci.electronics.design/2005-12/msg05445.html Another example of schematics used in Arduino code (by carlynorama): https://github.com/carlynorama/ASCII-schematics"
