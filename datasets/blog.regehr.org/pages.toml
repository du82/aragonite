["https://blog.regehr.org/archives/1687"]
title = "Write Fuzzable Code – Embedded in Academia"
full_description = "Alex Groce says: August 19, 2019 at 10:20 am “An obvious way to deal with embedded interpreters â€” which someone must have thought of and tried, but I donâ€™t have any pointers â€” would be to have an API for teaching the fuzzer how to see coverage of the language being interpreted.” I forgot to say this in comments, but somebody ought to (hadn’t last I looked, really, and I’ve never got around to it myself) work on making this nicely automated. It goes beyond “interpreters” in that most fuzzing of systems with serious machine-learning in the loop really wants to cover things that are “data as code”, e.g., the coverage of the trees in a forest of random decision trees: AFL should consider an input that takes a new decision tree path at least as good as a new code path, probably! Tom Dietterich and I talked about this nearly a year ago. Maybe someone has done this in ML at least since then? But if so, probably in a sort of ad-hoc, one-ML-library, way… regehr says: August 19, 2019 at 11:04 am Hi Alex, totally agree. I’ve seen nothing on this, but of course there’s a lot out there that I miss. Richard Hipp says: August 19, 2019 at 11:41 am If your program uses a pseudo-random number generator (PRNG), then it is important to seed the PRNG with either a constant or some value that is directly derived from the fuzzer inputs. The goal is to ensure that the same test input always results in the exact same sequence of machine instructions for the code under test. Failure to do this confuses profile-driven fuzzers, and it results in the fuzzer finding errors that are subsequently difficult to reproduce and fix. regehr says: August 19, 2019 at 12:40 pm Richard, definitely. I think this counts as a special case of controlling state, but I should have called this one out specifically (I think I actually had done that in my notes but then lost it!). Chris Russell says: August 19, 2019 at 12:54 pm If you’re working in JavaScript have a look at the ARCcore.filter library that makes it “trivial” (vs. other alternatives) to ensure 100% that your JavaScript function will not be called w/bad input. And, will not produce an invalid response."
