["https://blog.regehr.org/archives/2037"]
title = "Responsible and Effective Bugfinding – Embedded in Academia"
full_description = "bcs says: August 17, 2020 at 3:42 pm Several of these items seem to be navigating around a few pathologies I’ve seen related to bugs; mostly related to closing valid bugs under a verity of justifications. The comment about keeping open bug counts low touches on one part of that: something has gone wrong when the devs start trying to avoid having bugs being filed or start closing bugs in an attempt to curate some metrics. I’d rather metrics that look bad that I can trust over metrics that look good that I know have been cooked. Another pathology I’ve seen is the “this will never be important enough to fix so we will close it”. But why? If you ran out of other things to do would it get fixed? What about if this is an issue that keeps coming up; how will to track how many people care if you keep closing all the issues? A last problem I’ve seen it “We have 10,000 open bugs!!! We can’t fix them all, so declare bankruptcy and just close everything”. But you don’t have 10k bugs, you have maybe a few hundred and 9k duplicates. The two things I’d mots like to see in bug management tools (to help with these issues) are: – A priority for “a valid bug that should be fixed, but not something that will ever be at the top of the list unless something unforeseen happens.” – Better tooling for de-duplication (e.g. toss some ML at it and give a human clusters of bugs that are likely to contain duplicates). Not that I expect to get any of that. :0( Kirill Dmitrenko says: August 18, 2020 at 4:34 am > Another pathology I’ve seen is the “this will never be important enough to fix so we will close it”. But why? If you ran out of other things to do would it get fixed? What about if this is an issue that keeps coming up; how will to track how many people care if you keep closing all the issues? Because, as many things in our field, bug reports tend to rot with time. In my experience, basically every bug report that hasn’t been updated for a year, can be fixed as “nobody cares about this”. Users that originally reported the problem probably already moved on, logs or crash dumps are from an old version of software, so it’ll be a hustle to analyze them. It just becomes more expensive to triage and fix and less likely to be impactful (to reiterate, if nobody added anything to it in a year, than nobody cares)."
