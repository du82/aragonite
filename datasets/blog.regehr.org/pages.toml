["https://blog.regehr.org/archives/1722"]
title = "Alive2 Part 1: Introduction – Embedded in Academia"
full_description = "John Payson says: March 13, 2020 at 10:58 am One problem I’ve observed with clang and gcc is that different stages of optimization seem to have conflicting ideas about what constructs will be treated as defined when passed to downstream stages, and what constructs must be treated as defined when they come from upstream stages. For example, if a piece of code is conditionally executed when (uintptr_t)(p+i) and (uintptr_t)(q+5) happen to be equal, clang will seem to assume that lvalue p[i] may be replaced with lvalue q[5]–something that would be fine if no downstream stages try to make any assumptions about lvalue q[5] being unable to access some things that could be accessed by p[i]. Could you demonstrate how your tool could be used to determine what will happen with a particular piece of C code? For example, given https://godbolt.org/z/gg7x5Z (which demonstrates the above bug) could you demonstrate whether your tool would find the problem? Note that if x happens to be 5 elements, y happens to immediately follow it, and i is zero, evaluation of x+5 will yield a pointer which legitimately points just past the last value of x, but which cannot be legitimately dereferenced. While nothing in the Standard would mandate that the uintptr_t representation of that pointer compare equal to that of y, I think it’s pretty clear that the two possible correct behaviors of the function would be to leave y[0] holding 1 and return 1, or set y[0] to 2 and return 2. It would be possible for the comparison to report the two uintptr_t values equal, and if that happens, code would set y[0] to 2 but return 1, which is an incorrect behavior. BCS says: March 15, 2020 at 5:56 pm How long does it take to run all 22k test cases through Alive2? Is there anyone with an intent to wire it in as a CI/presubmit check? (If that would take too long to do directly; How stable are the test cases input/outputs? Would a cache of cases tested, to avoid re-inspecting know good refinements, be a meaningful optimization?) If that is done; have any of the LLVM owners expressed interest in collecting test cases where Alive2 is the only applied oracle? Really cool stuff. It’s really encouraging to see this sort of thing making the shift from academic theory to industrial application."
