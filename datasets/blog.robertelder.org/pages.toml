["https://blog.robertelder.org/building-a-c-compiler-type-system-the-formidable-declarator"]
title = "Building A C Compiler Type System - Part 1: The Formidable Declarator"
full_description = '''Updated July 8, 2016: Corrections related to spiral rule and K & R C style declarators. See comment on HN discussion This will be the first part in a series of posts that are intended to document my thoughts during the process of building a type system for my c compiler. As of today this type system is not 100% complete, but I have accumulated so many thoughts that I feel I should write them down even if it is just for my own reference. There are not many reference guides on the internet that describe how the C type system works well enough to write a C compiler. One idea would be to look at the source of a major compiler like gcc/clang, but I've chosen not to do that. The small amount of source I've looked at from these compilers suggests that it may not be worth the learning curve, and working in isolation might cause me to produce something novel and useful. The majority of what I've come up with is mostly the result of staring at the EBNF grammar of C for hundreds of hours, and thinking "Hmmm, can you do that?". Then I'll try it out in gcc or clang and I'll find out that I know less than I thought I did. After having done this for at least a few years now, I'm still learning things all the time. That brings me to my next point. I have not made any consideration for the C++ type system at all in this work. Years ago, I would have said that I 'know' C++. I've taken courses using C++ in university, and written many C++ programs. I was once hired with the title 'C++ Software Developer' (where I wrote Java). Despite this, I would say that I know almost nothing at all about C++. I call it the 'formidable' declarator because it has defeated my mind on more than one occasion. The simple declarator that you're used to is found in the following declaration: In this declaration, the declarator is the '* i' part. A declarator always contains at least an identifier, and possibly some other symbols. It is worth noting that a 'declarator' and a 'declaration' are completely different things. A 'declaration' has a rather intuitive meaning, whereas a 'declarator' is better thought of as a piece C jargon that comes from the name of a grammar rule that describes the C language (although there is also a grammar rule for declarations too).'''
year_published = 2016
year_updated = 2020
clearnet = "https://blog.robertelder.org/building-a-c-compiler-type-system-the-formidable-declarator"
