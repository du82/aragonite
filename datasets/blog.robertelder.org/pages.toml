\t\t\t\t
First-level paging structure: These are often called 'page directories' in a 2-level paging scheme.  You will generally have a page directory for each process in your system.  It is common on newer machines that must support more than 4gb of memory to use additional levels of page tables, such as that found in Physical Address Extension[1].  In our example, each entry in the directory is only 8 bits, or 1 byte.  Each entry contains information about the location of a page table, and some bits that tell us information about that table.
\t\t\t\t
\t\t\t
\t\t\t
\t\t\t\t
\t\t\t\t
\t\t\t\t
 Second-level paging structure: These are what you'd refer to as 'page tables'.  It is possible to have one page mapped into multiple page directories.  This would be a good idea if you wanted to allow a large number or processes to access a read-only shared library without copying the library itself multiple times.  Once again, each entry in the page table is only 8 bits, or 1 byte.  Each entry contains information about the location of a physical page, and some bits that tell us information about that memory page.
\t\t\t\t
\t\t\t
\t\t\t
\t\t\t\t
\t\t\t\t
\t\t\t\t
Physical page currently being accessed.
\t\t\t\t
\t\t\t
\t\t\tThe currently active page directory entry, or page table entry.  The index of this entry comes from the decomposition of the currently selected virtual address as shown above.
\t\t\tCurrently Selected Memory Location
\t\t\tReadable Memory.  Permissions aren't actually checked in this example, but in a real implementation this bit would be checked against the required method of access.
\t\t\tWritable Memory.  Permissions aren't actually checked in this example, but in a real implementation this bit would be checked against the required method of access.
\t\t\tExecutable Memory.  Permissions aren't actually checked in this example, but in a real implementation this bit would be checked against the required method of access.
\t\t\tInaccessible Virtual Memory.  In this example, if we traverse a page table or page directory entry where the initialised bit is not set, we assume that this represents a page fault.  In a real implementation, there could be many reasons for a page fault, and each would be handled differently.
\t\t\tUnitialised Physical Memory.  This represents memory in the physical view that would result in a page fault if it was accessed from the virtual memory address space.
\t\t\tInaccessible Physical Memory.  This represents memory locations that we cannot even attempt to access because there are no page table mappings that would translate to addresses here."""
full_description = '''I just finished updating my C compiler and minimal CPU specification to include virtual memory. The process of adding virtual memory support to a CPU, a kernel, and a compiler toolchain has made me realize that there is a lack of good explanations for how all of these parts fit together. I also realized that a surprising number of programming decisions end up relating back to virtual memory in a way that beginners might not realize. Therefore, I will review some of the aspects of virtual memory that I feel aren't explained elsewhere using this interactive explanation: You can click on a memory location above for a detailed explanation. The two views you see above represent the full physical, and full virtual views of a 256 byte address space. The virtual view represents what a typical program would see, and the physical view represents what states are actually sitting in physical RAM. This representation does not include a TLB (translation lookaside buffer). Here are a few descriptions that reference what you're seeing above. The objects as they are represented below will respond to any size changes you make using the controls above. An identity mapping is one of the simplest virtual memory mappings that you can think of: Every physical address is mapped to a virtual address that is exactly the same. This type of mapping isn't very useful for a fully featured OS, but is a useful step in bootstrapping some systems. This is the type of mapping that is currently used in the toy microkernel I've been working on. When implementing virtual memory in your kernel, in order to be able to manage memory you will need to know the physical memory location of your paging structures. Otherwise, how would you know what to set the contents of a page directory entry to? Once you enable the MMU you're only able to interact directly with virtual memory addresses, unless you disable it or find a way to go around it. This can make keeping track of physical addresses very complicated. One solution is to use recursive page tables. When using recursive page tables, we can answer one very useful question: "What is the current virtual address that corresponds to the physical address of any page, page table entry, or page directory entry?". We can answer this question by considering the indices in the virtual address itself that would allow us to traverse down to that entry or page.'''
