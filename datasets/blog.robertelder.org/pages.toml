["https://blog.robertelder.org/regular-expression-alternation"]
title = "How Regular Expression Alternation Works"
full_description = "This will match match a piece of text that contains either the word 'cat' or the word 'dog'. You could say that 'alternation' is used whenever there is more than one alternative for the string you want to match. Here is a diagram that shows the control flow graph of how a regular expression engine could interpret this regex. In this diagram, the regular expression matcher starts at the 'BEGIN' node and the moves to the 'SPLIT' node where it effectively splits control into two possible paths. First it tries to match the path with the word 'cat'. If this fails, it tries the other path with the word 'dog'. If neither path has a match, control moves to the 'FAILURE' node and the search will either re-start and continue at next character, or fail completely if it's already reached the end of the text being searched. You can also specify more than two possible alternatives by separating them all with the vertical line or 'pipe' symbol: Since alternation can be thought of as a list of alternatives, it's worth comparing it to the character class. As we saw in the first part of this series, the character class can be thought of as a list of possible characters that can appear at a specific position in our string. Regardless of what you put inside a character class, the entire class can only match a single character in your search string. With alternation, each possible alternative on either side of the pipe symbol can be any number of characters. Because the alternatives in an alternation can be a variable number of characters, it's common to use parentheses to define the start and end position for the list of alternatives. For example, this regular expression: The first and last choices in the alternation would have included the very start and the very end of the regular expression, which isn't what we want here. The presence of spaces does not break up the alternation since they're treated as just another part of the pattern that will be searched for. Here is a list of strings that would match this alternation:"
