["https://blog.robertelder.org/gnu-coreutils-package-guide"]
title = "Robert Elder's Guide To GNU Coreutils"
full_description = "Over the last 18 months, I've taken the time to create 108 short YouTube videos that summarize all of the commands that are found in the Coreutils Package. These videos focus mostly on Coreutils v8.3, but also included are a few commands from v9.0 as well. For each of the blog posts, I've adapted and modified the script slightly to make it more appropriate for written format. These videos and articles are intended to provide a quick reference and at least one useful example of why you'd want to use each command, rather than a detailed encyclopedic reference. You can find all of the videos/blog posts linked below: At the top of this blog post, you'll find links to a blog post and video for all 108 Coreutils commands. In most cases, the blog post contains approximately the same information as the video, but in some cases I did add a bit more detail or extra references in the article. For the first 50 commands, I released one video every day, but for the remaining 50 or so, I did one per week so the later ones are a bit higher quality. The purpose behind each video is to provide a quick introduction and at least one practical example of why you would even want to use this command in the first place. My expectation is that once you learn that a command exists and is useful, you'll be in a position to do your own research to find more detailed information. The 'GNU Coreutils' package is an extremely important set of software tools that are found in basically every GNU/Linux system. In other words, the commands that are present in 'Coreutils' are the 'core utilities' that required to perform many of basic the tasks on your system, like creating files, or changing permissions. Many of the GNU Coreutils commands are part of the POSIX specification. POSIX stands for 'Portable Operating System Interface', which means that many of the commands that belong to the POSIX specification are also present on other systems such as macOS and in some cases Windows (although, often with subtle differences). Therefore, learning about the commands in 'GNU Coreutils' is likely to provide knowledge that is mostly transferable to many other platforms as well."
year_published = 2024
year_updated = 2024
