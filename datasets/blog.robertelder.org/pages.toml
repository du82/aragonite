["https://blog.robertelder.org/intro-to-tail-command"]
title = "Use The 'tail' Command To Monitor Everything"
full_description = '''This article is about how to use the 'tail' command. Here is an overview of how you can use the 'head' and 'tail' commands to output different parts of a file: Use The Following Command to output the 'head' or beginning of the file/stream with the last 3 lines omitted: Use The Following Command to output the 'tail' end of the file/stream starting with the 3rd line continuing until the end: The table above shows the different ways that you can use the 'head' and 'tail' commands to output the beginning and end of a file. You can get different results by passing a positive or negative number to these commands, although not all combinations are POSIX compliant. Therefore, they may not be supported in all implementations of head/tail. In the examples shown above, the green colour text is what would get printed, and the gray text is the part that would be omitted. You can use the 'tail' command to print out the 'tail-end' of a file or stream. If we start with the following file 'business-tips.txt': which shows the last 10 lines in the file. The default number of lines to display is 10, but you can use the '-n' flag to specify a different number. For example, this command: One of the most common uses for the tail command is it's "follow" mode that you get when using the '-f' flag. If we run a command like this: you'll see the last few lines from the file '/var/log/kern.log' printed to the screen, and the cursor will appear to 'hang' as if it was waiting for something: In this case, the tail command is waiting for more lines to be appended to the end of the file so it can print them to the screen. The tail command will keep watching for new lines until you interrupt 'tail' by pressing and holding the CTRL key followed by the 'c' key. Using the tail command with the '-f' flag is a common way to monitor log files. By default, the 'tail' command will output a few lines that were already at end of the file even when you use the '-f' flag. This can be confusing if you're only interested in monitoring for log statements that happened after you issued the tail command. Therefore, I like to include the '-n' flag with a value of 0 whenever I use '-f':'''
