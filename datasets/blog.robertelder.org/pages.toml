["https://blog.robertelder.org/modelling-c-structs-typedefs-parse-time"]
title = "Modelling C Structs And Typedefs At Parse Time"
full_description = "The purpose of this article is to attempt to describe an algorithm for modelling typedefs, struct, union, enum tag specifiers, and their associated scope levels at parse time. The hope is to make this algorithm accurate enough for use in my C compiler. This article will make heavy use of C standard jargon and the intended reader will be one who is either interested in learning how to compile (specifically how to parse) the C programming language, or someone who is simply interested in learning how C works in meticulous detail. The C language version depicted in this article will be ISO C11 unless otherwise specified. The above comparison of code and the corresponding scope tree serves as an introduction to understanding how tags and identifiers can be modelled in the C programming language. Several observations can be noted from the above diagram: The following illustration depicts a method for looking up the types of identifiers that is almost always correct. We'll review the simple and almost correct version first, and then explore the subtle (and rather serious) case where it is not correct: The general algorithm is this: When looking up the type of an identifier in the tag or identifier namespace, begin in the current scope checking either the tag or identifier namespace as necessary for an entry with a matching identifier. If a match is not found in the current scope, travel up to the next scope working toward the root file scope. This works for variables, typedefed types, struct, enum, and unions. Note that all tags in a given scope share the same namespace, so if you find a tag with a matching identifier, but a different tag type (say a struct re-declared as a union), then that will be considered a 'match' that results in an compiler error since the tag type cannot be changed in a later re-declaration. For the case of variables or typedefed types, if no match is found you'll end up with an undeclared identifier error. For struct and union tags, if no match is found all the way up to the root node, this can be considered a 'declaration' of an incomplete tag in the originating scope. Enums are not permitted by the standard to allow forward declarations, so incomplete enum declarations that are not also definitions should result in an error. Finally, variables and typedefed types in the same scope share the same namespace, so the final parse tree will depend on whether the first thing found is a typedef or a variable declaration."
year_published = 2017
year_updated = 2020
