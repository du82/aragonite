["https://blog.robertelder.org/saifun-sm90uslc2gba-flash-memory-die-photos"]
title = "Die Photos Of Saifun SM90USLC2GbA Flash Memory"
full_description = "In this article, I'd like to share some of the photographs that I took of my Saifun SM90USLC2GbA flash memory chip. I also did a bit of research to try and understand more about this chip and the company that made it. Here is an overview shot of the full silicon taken with my macro lens: In this second image, you can see that the microchip is covered in tiny specs of dust, even though I just spent hours cleaning my apartment before taking this photograph: Here, it says the manufacturer is 'Saifun', or 'Saifun Semiconductor Limited.', which was a company that designed various types of non-volatile memory. From the product code 'SM90USLC2GbA', I will attempt to speculate as to the possible meaning of some of the letters: In the center of this chip, you can see the large grid of storage cells for this piece of flash memory. You can also see a closeup of my dust particles: Here's an area on the edge of the chip that contains some circuitry. The brilliant colours that you see in these images are completely natural given the right lighting angles. The saturation and brightness have not been modified in any way: These colourful effects are caused by thin-film interference, and reflections off of metal layers within the chip. You can even see some of the individual traces in the chip here: Here's a piece of dust that's stuck to the edge of the chip that's casts a shadow over the chip as it rotates: Areas on the chip that look like this, with lots of zigzagging lines, usually contain the logic or computational parts of the chip: The term 'SLC' or single-level cell, is used to describe the amount of information that's stored in an individual memory cell. With single-level cell memory, each cell only stores one bit of data. Other storage techniques, like double-level cell, triple-level cell or quad level cell also exist. The benefit of increasing storage density is that you can pack more data into the same area on the chip. However, as the storage density increases the data becomes more vulnerable to corruption since the signal from the original stored information will become weaker and more easily distorted by noise."
year_published = 2023
year_updated = 2023
