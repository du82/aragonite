["https://blog.robertelder.org/switch-statements-statement-expressions"]
title = "How to Get Fired Using Switch Statements & Statement Expressions"
full_description = "Updated Oct 27, 2016: Fixed sample code comments in coroutine example as per suggestion, edited text to note D's similar behaviour. It doesn't matter whether you're trying to achieve job security; impressing others by showing them how smart you are; or passive aggressively asserting your dominance over a code base, writing unmaintainable code has a number of practical applications. One extremely unmaintainable and bug-ridden technique for C programming involves using both switch statements and statement expressions together. In this article, we will discuss how you can leverage switch statements and statement expressions to produce C code that is so difficult to understand, you'll need to look at the assembly to figure out what it does. Many of the examples of syntax in this article are not standards compliant or they won't pass even the simplest of static analysis tests. That should be ok though, because writing many of these examples in your company's code base will probably end up getting you fired anyway. The above is what most people are used to thinking about when 'switch statements' are mentioned in C. The rough idea is that switch statements are a sort of more appealing alternative to using lots of 'else if' statements when checking for some disjoint property. Some of you may be surprised to learn that the following is also a valid switch statement: It's worth pointing out that almost no other languages support switch statements the way that they work in C (although the D language is an example). Most other languages have a switch statement that works similar to the idea of a more appealing alternative to many 'else if' checks. A switch statement in C would be more appropriately called a 'goto field'. This means that the switch(...) part simply makes a decision about which label to branch to. After branching to that label nothing special happens related to the fact that you're inside a switch statement and the code will just keep executing whatever machine instructions come next. The one exception is, of course, the break statement which will jump to the point after the switch statement body. Here is an equivalent version of the switch statement written above using only ifs and gotos."
year_published = 2016
year_updated = 2020
clearnet = "https://blog.robertelder.org/switch-statements-statement-expressions"
