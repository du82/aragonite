["https://blog.robertelder.org/data-science-linux-command-line"]
title = "An Introduction To Data Science On The Linux Command Line"
full_description = "This article will provide the reader with a brief overview for a number of different Linux commands. A special emphasis will be placed on explaining how each command can be used in the context of performing data science tasks. The goal will be to convince the reader that each of these commands can be extremely useful, and to allow them to understand what role each command can play when manipulating or analyzing data. Many readers are likely already familiar with the '|' symbol, but if not, it's worth pointing it out in advance: All of the inputs and outputs for the commands discussed in the next few sections can be automatically 'piped' into one another using the '|' symbol! This means that all of the specialized tasks done by each command can be chained together to make extremely powerful and short mini programs, all directly on the command line! What is grep? 'grep' is a tool that can be used to extract matching text from files. You can specify a number of different control flags and options that allow you to be very selective in determining what subset of text you'd like to have extracted from a file or stream. Grep is generally used as a 'line-oriented' tool, which means that when matching text is found, grep will print all of the text on that line, although you can use the '-o' flag to only print the matched part of the line. Why is grep useful? 'grep' is useful because it's the fastest way to search for a particular piece of text in a large number of files. Some great examples of use cases are: Filtering accesses to a particular web page out of a huge web server log; Searching a code base for instances of a specific keyword (this is much faster and more reliable than using the Eclipse Editor's search); Filtering the output from another command in the middle of a Unix pipe. How does grep relate to data science? Grep can be very useful for ad-hoc data science tasks because it allows you to very quickly filter out the information you want from your data set. It's very likely that your source data has a lot of information that isn't relevant to the question you're trying to answer. If the data is stored on individual lines in a text file, you can use grep to extract only the lines that you want to work with if you can think of a very precise search rule to filter them out. For example, if you had the following .csv file full of sales records on each line:"
year_published = 2019
