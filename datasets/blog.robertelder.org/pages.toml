["https://blog.robertelder.org/ds18b20-raspberry-pi-setup-pullup"]
title = "DS18B20 Raspberry Pi Setup - What's The Deal With That Pullup Resistor?"
full_description = "In this article, we'll review the setup steps for using a DS18B20 thermal sensor probe with a Raspberry Pi and also attempt to clarify some confusion related to the external pull-up resistor that is sometimes used with this sensor. You can also view the video that complements the content in this article below: Before discussing the software-based steps for using this sensor, let's resolve an important question that you're likely to have in relation to how you wire up your probe: Do you really need the external (usually 4.7K) pull-up resistor between the data line and the power? If you're using a newer Raspberry Pi (or an Arduino) the answer is No. The short story is that you can use a software control inside the Raspberry Pi to take advantage of an internal pull-up resistor that is inside the Raspberry Pi. The longer explanation involves the details of the '1 Wire Protocol' that is used for communication by the DS18B20. The typical DS18B20 sensor comes with 3 pins/wires exposed: Ground, Data and power. One feature of the 1-wire protocol is that it allows you to get rid of the dedicated power wire and instead power the chip directly from the 'data' line. This works because the 1-wire protocol dictates that when idle, the 'data' line should be put high to logic 1, and DS18B20 comes with a tiny capacitor that stores enough energy that allows it continue to operate when the data line is low during communication. As a result, we need a pull-up resistor either to 'pull up' the power pin voltage near the voltage of the data line (when you want to avoid running a 'power' wire), or to pull up the data bus to logic 1 when it is idle if you decide to use a power wire, but don't want to use the internal pull-up resistor in the Raspberry Pi. Here is a picture of my working setup that avoids the use of any soldering or pull-up resistors (exposed bare copper wires not recommended): In the picture above, red is attached to 3.3v, Black is attached to ground, and Yellow is attached to GPIO14 (in your case, you can use a different GPIO pin). Now, before you get too excited, note that will have to do a few setup steps before you can actually read from the sensor. First, add the following to the end of your /boot/config.txt file:"
