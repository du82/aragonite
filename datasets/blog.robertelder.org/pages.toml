["https://blog.robertelder.org/force-true-command-to-return-false"]
title = "How To Force The 'true' Command To Return 'false'"
full_description = "Recently, I published a video containing potentially dangerous misinformation. In this article, I'd like to set the record straight in the hopes of repairing my reputation, and preventing others from making the same mistake that I did. The misinformation in question can be found in a video that I published a few weeks ago about the 'true' command. In the offending video, I made a statement implying that the 'true' command always returns the value 'true', but this statement is actually false. To make matters worse, I knew that this statement was false at the time, but I still said it anyway, and for that, I'm sorry. To illustrate how the 'true' command can return false, consider the behaviour of the following shell script: This script invokes the 'true' command with the version flag. For the first 3 iterations of this script, the invocation of the 'true' command will return a value that allows the while loop continue. However, after the third iteration, the script executes a special shell syntax that closes standard output. The output from running this script looks like this: indicates that the standard output file descriptor should be closed. The '>' character is a common symbol that's used to redirect data streams. If the number of the stream is not explicitly specified, it's assumed to have the value '1', which indicates standard output. In the script above, after the third iteration of the loop, the standard output file descriptor will be closed. This causes the next invocation of the 'true' command to return 'false', causing an exit from the while loop. You can see this result more clearly by running the 'true' command directly on the command line with the 'help' or 'version' flags, and then checking its return code. With standard output left alone, the return value is zero: This behaviour is only exhibited by the GNU coreutils version of the 'true' command when using 'help' or 'version' flags while standard output is closed. In the 'true.c' source code, you can see the following comment:"
