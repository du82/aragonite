["https://blog.robertelder.org/regular-expression-character-escaping"]
title = "Regular Expression Character Escaping"
full_description = "In the last few sections of this series, we've gained an understanding of character classes, quantifiers and alternation. You'll be pleased to know that you're now very close to being able to read or write almost any regular expression. There's just one remaining major common cause of confusion: character escaping. In this section, we'll try to gain a fairly comprehensive understanding of the most common ways to escape characters in a regular expression. When learning how to correctly escape characters in a regular expression, it helps to divide the escaping rules into two different lists of characters that need to be escaped: One for characters inside a character class, and one for characters outside a character class. To keep this simple, this article will not consider Unicode characters and instead focus only on single-byte ASCII characters. In the sections Character Classes in Regular Expressions - A Gentle Introduction and Character Ranges & Class Negation in Regular Expressions we reviewed the 5 characters that need to be escaped inside a character class (anywhere inside [...]): But what can we say about characters that always need to be escaped outside a character class? For starters, let's consider the 5 characters from the list above, and take note of a few differences: As you can see, the list of characters that need to be escaped outside a character class includes all the characters that need to be escaped inside a character class (except for the '-' character). So far, we've only listed 4 characters that need to be escaped outside a character class. But what other characters need to be escaped outside a character class? Unsurprisingly, you also need to escape the characters that are used to represent quantifiers: We also saw how parentheses are used to identify 'groups' or 'sub-expressions', so they need to be escaped too: In the second part of this series, we discussed how the '^' character is used inside a character class to invert what the character class will match. We also briefly mentioned how it has a completely different meaning when it's found outside of a character class. When the '^' character is found outside of a character class, it's special meaning is to anchor that part of the regex to the 'start of string' or 'start of line' (depending on the regex engine/current flags). Similarly, this leads us to introduce one new character that needs to be escaped outside a character class: The '$' character will anchor its position in the regex to the 'end of string' or 'end of line' (again, depending on the regex engine/current flags)."
year_published = 2020
clearnet = "https://blog.robertelder.org/regular-expression-character-escaping"
