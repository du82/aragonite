["https://blog.robertelder.org/overlap-add-overlap-save"]
title = "Overlap Add, Overlap Save Visual Explanation"
full_description = '''This article is effectively an appendix to the article The Fast Meme Transform: Convert Audio Into Linux Commands. In this article, we will review the 'Overlap Add' and 'Overlap Save' algorithms which can be used to accomplish several intimately related mathematical tasks: For some added context on the problem being solved here, our task is to find the discrete convolution of x[n] and h[n]. x[n] represents a discrete sequence of samples of our time domain signal. h[n] represents the time domain sequence of the digital filter we wish to apply. While x[n] represents the signal in the time domain, X[n] denotes a sequence of the same length as x[n], but in the frequency domain. Similarly, H[n] represents the filter in the frequency domain. Transforming x[n] into X[n] or X[n] into x[n] is accomplished by using the Discrete Fourier Transform. The variable M represents the length of the filter sequence. The variable 'L' is the number of samples in each interval that our longer signal will be broken up into. A common question is "How do you determine the value of L?" and the answer, in general, is that you can choose any value of L that you want. However, L is often chosen so that the sum of L + M -1 is a power of two because this is a requirement of the much faster Fast Fourier Transform algorithm. Of course, you can always just use the slower Fourier Transform algorithm and get the same result for any sequence length. An example of the higher-level goal of this operation would be something like increasing or decreasing certain frequencies in a piece of music as is done in an audio equalizer. Another example would be for removing noise from a radio signal. Now that the signal has been partitioned into intervals labeled x_i[n], there are two methods that could be used to calculate the convolution between the signal and the filter, both of which are mathematically correct. These methods are the Fourier transform method, and the trivial multiply and add calculation which can be expressed as a matrix multiplication. For more details on the matrix calculation for performing convolution, see Toeplitz Matrix.'''
year_published = 2018
clearnet = "https://blog.robertelder.org/overlap-add-overlap-save"
