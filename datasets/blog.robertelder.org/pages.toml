["https://blog.robertelder.org/pump-room-leak-monitoring-raspberry-pi"]
title = "Pump Room Leak & Temperature Monitoring With Raspberry Pi"
full_description = "In this guide we'll perform a case study on how to set up your own remote monitoring system to check for leaks or dangerously low temperatures in your basement or pump room. The final solution will be one that is capable of taking pictures (or video) along with temperature and humidity data which can be sent to you regularly by email notifications. We'll discuss how to automatically upload your pictures or video to Amazon's S3 storage service so they can be publicly available and viewed from anywhere. Here's a full bill of materials of what you'd need to create this setup yourself: Total Cost of project: $78.44 CAD. Other items you may or may not already own: USB cable for the Pi; USB wall wart adapter for the Pi; jumper wires to connect DS18B20 to GPIO pins. For temperature measurements, we'll integrate two different sensors into the project. One of the primary concerns you may have in monitoring your pump room is to make sure the temperature doesn't go below the freezing point of water. Having two temperature readings from different sensors will give redundancy to the measurements in case one fails. Before you go though the install process you should be aware that you can use the 'pinout' command to view the pin assignments of the Raspberry Pi: Details about where to buy a Raspberry Pi camera and how to install it can be found in the article An Overview of How to Do Everything with Raspberry Pi Cameras. Once you're up and running with your Raspberry Pi camera, you can move on to the next section. One of the temperature sensors is the DS18B20. Here is a detailed description of how to setup and install the DS18B20 thermal probe. For the DHT11 humidity and temperature sensor the setup process is a bit simpler, check out this guide which shows the process using several different languages. This guide show the setup for two different models of the sensor. In my case, I have the 3 wire DHT11, although the ordering of the pins on my DHT11 sensor are different than the ones shown in this guide. For this guide, we'll focus on using Python so take note of the section on using the 'Adafruit_Python_DHT' repo in the previously linked guide. Also, I decided to power the DHT11 using the 3.3v on the Raspberry Pi instead of using the 5v as shown in this guide (to avoid the possibility of sending 5V signals to the 3.3v GPIO pins on the Raspberry Pi)."
