["https://blog.robertelder.org/causes-of-bit-flips-in-computer-memory"]
title = "What Causes Bit Flips In Computer Memory?"
full_description = "In my most recent article, I documented an experience where bit flips in a computer's memory corrupted a hard drive image that I was creating. In this article, I want to talk more about the root causes of why bit flips happen in a computer's memory. I also want to challenge the commonly held belief that most bit flips are caused by cosmic rays from space. In fact, if you ever do pin down a computer problem to a bit flip in memory, I'd be willing to bet that it's most likely caused by a hardware issue or the way in which the hardware was used. In the lowest regime, you have the worst possible case scenario, where the computer constantly experiences bit flips from every possible cause imaginable. It has so many problems with bit flips that it's basically unusable. For every level that you go up, you travel into a new 'error regime', where the frequency of bit flips is decreased by an order of magnitude. In the top regime, you have a computer that experiences bit flips as infrequently as possible given the known laws of physics. To start off, let's consider the worst possible case in the bottom regime. This computer is in really bad shape. It has all of the following problems: First of all, it's overheating and it's way above normal operating temperature. It also has a bad power supply that produces lots of ripple, under voltage, and over voltage. It would also have problems with the input power that comes from the power grid. The power grid would be experiencing problems like voltage sags, voltage spikes, or frequency and phase shifts. All of these glitches in the input power would eventually make their way to one of the pins on the RAM stick. The motherboard and power supply would also have bad capacitors. Likely from the electrolyte inside of them boiling off due to prolonged overheating. The RAM would also be making bad connections with the motherboard slots. This could be due to dust or oils on the pins that partially prevent a clean connection, but don't prevent it from working at all."
year_published = 2023
clearnet = "https://blog.robertelder.org/causes-of-bit-flips-in-computer-memory"
