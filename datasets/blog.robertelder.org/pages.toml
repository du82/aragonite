["https://blog.robertelder.org/importance-of-ecc-memory"]
title = "Imaging A Hard Drive With non-ECC Memory - What Could Go Wrong?"
full_description = '''I recently came home to visit with family, but right now as I write this, it's 1:00am and I'm running memtest86+ by myself in the basement. The purpose of this article, is to provide a real-life case study to show why ECC memory is not a waste of money, and to provide a detailed account of how much time you can waste when bit flips become a part of you daily computing life. Having said that, the previous sentence is a bit of lie because this article is actually about more than that: Specifically, I will discuss various learnings that I had in the process of trying to image the hard drive of an old failing family computer, and the process of trying to restore the computer to fully working order. These learnings include: Speaking of wasting time, I wasted huge amount of time on the analysis described in this article (4-6 hours per 500GB hard drive md5 checksum and ~12 hours+ per memtest run). This is probably the reason that you don't read too many articles like this one. It's not because bit flips are rare, but rather because most people who encounter them are smart enough to declare "It was probably just a ghost in my program!" and reboot the machine instead of investigating the issue and then wasting even more time writing a blog post to document the issue in excruciating detail. My overall goal was to back up the data from an old family computer that was experiencing some 'problems'. This was actually a computer that I personally put together back in the year 2008. This would make it (2022 - 2008) = 14 years old! I found it fairly impressive that it was still running, despite the reports of occasional unexplained reboots. Backing up an old computer... Sounds like a simple task, right? Well, allow me to make it more complicated for you: Most people would probably just use the simplest backup approach of copying parts of the filesystem to an external flash drive to be adequate, but in my case I wanted to approach things from a thorough data recovery perspective. Therefore, I decided to image the entire hard disk to guarantee a perfect preservation of all data. This computer was old, so I figured it would be reasonable to assume that the hard drive might be already starting to fail.'''
year_published = 2022
clearnet = "https://blog.robertelder.org/importance-of-ecc-memory"
