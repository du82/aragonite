["https://blog.robertelder.org/ssh-connect-to-raspberry-pi-over-internet"]
title = "Using SSH to Connect to Your Raspberry Pi Over The Internet"
full_description = "In this article, we will discuss one method of using SSH to remotely log into another computer from anywhere that you can access the internet. There are actually many different ways to accomplish this task in general, but this article will focus on showing you a method that involves setting up a proxy server with your favourite cloud provider, and then tunneling the connection to the Raspberry Pi through the proxy server, and down to your Raspberry Pi using SSH and port forwarding. However, before you rush off to set this up, I recommend that you make sure you know what you're doing when setting up this kind of configuration. If you do something incorrectly, you could be exposing you and your data to every hacker out there on the internet! This is because the proxy (the one that you setup and control) will need to be accessible via a public IP on the open internet. In order to get started with this technique, you will have to set up your own proxy server using one of the many popular cloud providers. This is something you will have to pay for each month, but a service like Amazon Web Services is fairly cheap if you go with a small sized instance. It will likely cost you less than $5.00 per month to set one up. It doesn't have to be powerful, it just needs to be a simple machine with network access and Linux installed. To give you an idea of what the setup will look like once you have it up and running, here is an illustration: The setup described in the picture above is one where the laptop and the Raspberry Pi are in different countries and have their own local LAN connections. Both of them connect to the internet through their own router on their own LAN (not the same router as might be suggested by the way the pictures were cropped). Both the Laptop and the Raspberry Pi will set up their own SSH connection to the proxy. In this example, we will assume that the proxy server has public IP address '123.123.123.123'. In order to achieve the final solution depicted above, you must create 3 SSH key pairs. The first is created on your Laptop with the public key added to '~/.ssh/authorized_keys' on the proxy server ('my-proxy-keypair-laptop.pub'). The second is created on the Raspberry Pi with the public key added to '~/.ssh/authorized_keys' on the proxy server ('my-proxy-keypair-pi.pub'). The third is created on the Laptop with the public key added to '~/.ssh/authorized_keys' on the Raspberry Pi ('my-first-keypair.pub'). If you need to refresh your memory about how to set up SSH keypairs, see the article How To Set Up and Distribute SSH Key Pairs."
