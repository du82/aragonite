["https://blog.robertelder.org/find-command-wildcard-globbing"]
title = "A Surprisingly Common Mistake Involving Wildcards & The Find Command"
full_description = '''If you don't you're not alone. Right now, as I'm typing this, 4 of the top 4 Google results for "find command linux" contain at least one example of the pattern illustrated by the command above. Unfortunately, there is one very subtle problem with this command that can cause you to make very serious errors if you use it. What's even worse is that the error isn't likely to be obvious every time you use it. For those of you who know about globbing, you already know what the error is and you don't need to read this article. For everyone else, let's review an example to illustrate what the problem is. Assume you're working within a source code repository, and you'd like to do some cleanup to get rid of unused files. In this case, your goal is to keep only the python source files that end with a .py extension, and delete all other types of files. Here are some commands to generate the specific listing of files we'll consider in this example: To review a list of all files that are present in the repository, you decide to issue this command at the root of the project: Now, because you want to actually delete the set of files that we just found, you decide to add the -delete flag and issue the command again: After inspecting the results, you find that this command successfully deleted exactly the set of files that you intended to: Because this process worked so well, you decide to save this command so you can use it again in the future to impress your coworkers. Later, you decide that you need to perform the exact same task of deleting any file that doesn't end in a .py extension from your repository. However, this time the repository contains the following list of files that is slightly different: So again, you decide to issue the exact same command that we just used with the intention of deleting all files that aren't python source files: But to your surprise, you find that you've just deleted way more files than you expected to, including most of the ones that end with the .py extension, with only a single file remaining:'''
year_published = 2020
