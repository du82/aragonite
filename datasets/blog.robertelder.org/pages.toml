["https://blog.robertelder.org/recording-660-fps-on-raspberry-pi-camera"]
title = "A Guide to Recording 660FPS Video On A $6 Raspberry Pi Camera"
full_description = "This article will discuss the setup steps that are required for recording videos at high frame rates on cheap Raspberry Pi cameras. Frame rates up to 660FPS on the V1 camera and up to 1007 on the V2 camera can be achieved. Filming at these extremely high frame rates on a Raspberry Pi is much more challenging and involves more work than typical point and shoot photography. This article was primarily written to supplement the instructions in the following video: The instructions presented here were tested to work on a fresh Raspbian OS image with the following md5 hash: Furthermore, the version of Raspberry Pi that was tested was a Raspberry Pi 3 model B. During the initial setup process, a Raspberry Pi V2 camera was plugged into the Raspberry Pi. After the install was completed, the camera was switched to a V1 camera which also worked without further steps, so the install steps here should cover bother camera types. The V1 camera that was tested uses the OV5647 image sensor, and the V2 camera tested uses the IMX219 sensor. The instructions I provide below make reference to static forks of the relevant code so that the results described here are repeatable. You should check out the original 'raspiraw' and 'dcraw' branches for updates by 6by9: These branches are likely to contain updates that you may need to support the Raspberry Pi 4, or more recent camera models. Several people have reported seeing this error: The major limitation throughout this process is the speed at which memory can be copied and transmitted. Only 20-40 seconds of video can be recorded at a time due the memory exhaustion of the Raspberry Pi. Also limited is the resolution of the recording: On the $6 camera, a maximum of 640x64 resolution can be recorded due to limitations on memory bandwidth. First, make sure your camera is already installed and works correctly for recording normally at lower frame rates using raspivid and raspistill. See the article An Overview of How to Do Everything with Raspberry Pi Cameras for details."
