["https://blog.robertelder.org/building-a-c-compiler-type-system-a-canonical-type-representation"]
title = "Building A C Compiler Type System - Part 2: A Canonical Type Representation"
full_description = "Updated December 20, 2016: Corrected claims about calling function that defines a struct in its parameter list. In part 1, I introduced the concept of a declarator and explained why it can be confusing to a programmer. A possible canonical representation for declarators was discussed. In this section will make use of this representation to describe a method of canonicalizing all non-tag types that can be represented in the C programming language. This representation will be general enough that it will also be able to represent various nonsensical declarations that programmers are likely to create (which necessitate good error messages), and it will even be able to represent a few types that do not exist in the C programming language. During our exploration, we'll also see a secret C type that's only possible through the magic of typedefs! We'll also see an example of a function that can be defined but cannot be called. Let's jump straight to the punch-line before we review the details later in this article. Here is a general model for describing the 'type' of any non-tag type in the C programming language: Note that this declaration declares the array 'foo', but also defines the struct 'abc'. The structure definition itself would be described using another data structure. For the purposes of this discussion, it makes more sense to consider this as the equivalent declaration/definitions written a different way: For K & R C style function declarations, the types of parameters (if specified) are part of the function definition and can be stored separately. When considering the function declaration, we only need to consider: Typedef can be treated as just another regular old storage class specifier. Of course the 'typedef' specifier is just a syntatic convenience that would need to be removed when performing a comparison on types. A typedefed type acts just like a custom specifier that you can define. Of course, its expansion can also affect the declarator: In writing this article, I realized that there are also a number of corner cases when considering 'const' or 'volatile' qualified typedefed types. In these cases, the 'const' qualifier can become absorbed into the declarator (for example when const qualifying a typedefed pointer). I also discovered that you can use typedefs to declare a secret type that can't even be declared without typedefs!"
year_published = 2016
year_updated = 2020
