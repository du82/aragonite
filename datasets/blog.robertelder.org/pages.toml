["https://blog.robertelder.org/intro-to-sort-command"]
title = "Why The 'sort' Command Is A Favourite For Librarians"
full_description = '''In this article, I will attempt to convince you that the 'sort' command is worth learning. The 'sort' command is no doubt the favourite Unix command of librarians, and by the end of this article, it should be clear why! There are a number of other Linux/Unix commands that only work correctly with input that has been pre-sorted, such as the 'uniq' command or the 'comm' command. Piping the output of 'sort' into these commands can make for quick and easy solutions to your many of your text-processing problems. Let's do a quick example to see how useful the sort command can be. Here is a text file 'best-novels.txt' that contains some random books from this list of 100 best novels on Wikipedia: These books have been listed in the file 'best-novels.txt' in a random order, but we want them to be listed in alphabetical order. We can quickly see them sorted using this command: You can also use the 'sort' command to sort numbers. Here's a file 'some-numbers.txt' that contains some sample numbers: which probably isn't what you were expecting, since the numbers aren't sorted in numerically ascending order. This is because the sort command is defaulting to lexical sorting (used by librarians) rather than numerical sorting. To force numerical sorting, you can use the '-n' flag: this will perform the sort comparisons using the entire line, which mixes the author together with the book title. In our use case, we can explicitly sort on the text starting at the first column using the following command (this probably isn't what you want, see next section!): in order to split up the columns, we need to use the '-t' flag to specify the column delimiter. In this case the $'\t' is a special syntax that is used in bash to specify a literal tab character. If you were delimiting columns with a space, you'd do this: If we want to start the comparison at the second or third column (also probably not exactly what you really want) you'd do this: BUT, the '-k' flag with the sort command is easy to misunderstand! The correct way to sort based on a specific individual column (and only that column) is to use the '-k' flag like this:'''
