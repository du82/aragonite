["https://blog.robertelder.org/regular-expression-test-cases"]
title = "Interesting Regular Expression Test Cases"
full_description = '''The purpose of this article is to document a list of test cases for the Regular Expression Visualizer tool which uses a custom-written regular expression engine. For each test case below, the relevant regular expression is listed along with an explanation about why it is useful. A direct link is also provided for each test case which allows you to see the result of inputting that regular expression into the visualizer tool. These test cases serve as a form of documentation for what cases are currently supported by the tool. Some of these test cases may also be interesting to anyone else writing their own regular expression engine. The regex '^([a-z0-9_\.\-]+)@([\da-z\.\-]+)\.([a-z\.]{2,5})$': An example of a commonly cited regular expression that claims to be able to match email addresses (but doesn't do a very great job). The regex 'employ(|er|ee|ment|ing|able)': A regular expression that capture multiple suffixes of a word. The regex '<tag>[^<]*</tag>': A regular expression to match an XML tag and its contents (only works for cases where 'tag' doesn't contain any nested XML and has no support for attributes). The regex '<[\s]*tag[^>]*>[^<]*<[\s]*/[\s]*tag[\s]*>': A slightly better version of the previous XML tag matching regex that adds a bit of tolerance for spaces. The regex '^(https?:\/\/)?([\da-z.\-]+)\.([a-z.]{2,6})([\/\w \.\-]*)*\/?$': A regex to match common URLs that only use common ASCII characters and TLDs less than 6 characters. The regex '[]': This case represents an 'empty' character class. Many regular expression engines don't allow this since it's almost certainly a mistake to write this. The only meaningful interpretation would be to mean 'match a character that that belongs to this empty list of characters'. In order words it represents the impossible constraint of being a character that isn't any character. The regex '[^]': Similar to the empty character class '[]', but a bit more useful. This case would be interpreted as 'any character NOT in the following empty list'. Therefore, this would mean 'match any possible character'.'''
year_published = 2020
clearnet = "https://blog.robertelder.org/regular-expression-test-cases"
