["https://blog.robertelder.org/paper-display-terminal-ed-vim"]
title = "Using A Piece Of Paper As A Display Terminal - ed Vs. vim"
full_description = "Despite having its roots in the late 1960s, the 'ed' editor is still installed by default on most modern Linux distributions. Although there are few practical use cases for this editor today, it can still be meaningful to learn how 'ed' works since other Unix tools like vim, grep or sed have features that are significantly influenced from 'ed'. If you try running the 'ed' command with or without a file argument, you'll see something that looks like this: If you're waiting for something to happen then you'll be waiting a long time. That's because 'ed' is waiting for you to do something! The 'ed' program doesn't work like other command-line text editors such as vim or nano. The luxury of being able to print the contents of the current file to the terminal is something that 'ed' takes very seriously. That's why you need to explicitly give 'ed' a command to tell it to do so! For example, if you want to print out an individual line in the file, you can just type the line number and press enter. If you want to append text, use the single-letter command 'a' on a line by itself to enter 'append' mode. Once you're done adding text, write a '.' character on a line by itself and press enter to stop adding text to the file. To review all the lines in the file, you can use the command '1,$p'. Finally, once you're done editing the file, you can use 'wq' to exit: To make sense of why this editor is so hard to use, it make sense to think about the way in which people interacted with computers in the early days of computing. Around the time when 'ed' was created, it was still common for computers to print their output on paper instead of electronic screens! These early output devices were called 'teleprinters', often abbreviated as TTY. The term TTY is still used on most *nix systems to this day, and if you run this command, you can probably see some of the virtual TTY devices on your system: This ancient model of sending an infinite stream of characters (sent serially) to a 'terminal' or 'teleprinter' device that 'prints' or 'renders' them is still used today. It is even used by more modern terminal programs like vim or nano! You might not believe that vim works this way because it displays all kinds of information at the top and bottom of the terminal. Vim also lets you scroll up and down or open up screen splits etc. You can't possibly send the output of vim to a printer, right? Yes, you can and that's exactly what we're about to try."
year_published = 2020
