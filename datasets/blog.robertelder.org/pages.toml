["https://blog.robertelder.org/securing-a-raspberry-pi"]
title = "A Beginners Guide to Securing A Raspberry Pi"
full_description = "Securing your Raspberry Pi is a very large topic can cover many aspects of computer security, and as a great starting point I would recommend that you first read the Raspberry Pi foundation's own guide on Securing your Raspberry Pi. In addition, I will provide some commentary on this guide in order to emphasize what I think are the most important points, but also to add a few details that aren't reflected in the guide. I will make reference to the Raspberry Pi foundation's security guide a number of times in the paragraphs below. The absolute most import part of securing your Raspberry Pi is to make sure that you haven't left on password based SSH access with the default password. There are many bots scanning the internet constantly trying to log into things with a username of 'pi' and password 'raspberry' since this is a common default login for SSH on Raspberry Pi. If you fail to disable password-based SSH authentication and leave the password as default, you are effectively leaving your Raspberry Pi openly accessible to anyone on the local area network it is connected to. If your Raspberry Pi is behind a router on a home-based network, this will make it harder for hackers to attack you, but not impossible. If you want to be super safe, you should try to secure your Raspberry Pi as if it were directly connected to the internet, and it that case, you DON'T want to have password-based SSH connections enabled with the default password! To fix this potential huge security problem you need to either disable password based SSH authentication, or change your password to be a strong password. I recommend doing both. To change the password to a more secure one, use this command: To disable password based SSH authentication, you need to edit the file located at '/etc/ssh/sshd_config' and make sure it contains the following line somewhere: If instead you find the line 'PasswordAuthentication no' OR if you find a line that starts with a '#' character ('#' means commented out), then you'll need to update or add this line as written above. Also, before you disable password based authentication, make sure that you first set up SSH key based authentication with public and private keys so that you can still access the Pi remotely. Otherwise, you won't have any way to log into the Pi using SSH. Once you add this new configuration, you need to restart the SSH server for it to take effect:"
year_published = 2019
clearnet = "https://blog.robertelder.org/securing-a-raspberry-pi"
