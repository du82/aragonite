["https://blog.robertelder.org/character-ranges-class-negation-regular-expressions"]
title = "Character Ranges & Class Negation in Regular Expressions"
full_description = "This is the second article in a series that will train you to become a Regular Expression Master. The first part of the series is: Character Classes in Regular Expressions - A Gentle Introduction. In the last section, we saw how a character class is basically just a way to specify a list of characters that can appear at a specific position in your search string. We also reviewed the first three characters that often require escaping inside a character class. Now is an appropriate time to review the fourth character that must be escaped in a character class: The 'dash', or 'hyphen' character. Recall back to the example we reviewed where we wanted to search for references to figure names. These figure names included a single letter of the alphabet to identify the figure. We used the character class '[abcdefghijklmnopqrstuvwxyz]' to specify that the last character could be any lower-case letter of the alphabet. But this syntax looks ugly and takes up a lot of space to write out. Wouldn't it be better if there was a short-hand notation that allowed us to specify every lower-case letter of the alphabet without actually writing out every letter? Something like 'a' '-' 'z'. Well, this is exactly how it's done in real regular expressions. This feature is called 'character ranges'. And now you can see why the '-' character is the fourth character that must be escaped inside a character class. When you write '[a-z]' inside a character class, it will match all lower-case letters of the alphabet: If for some reason, you *actually* wanted the dash character to be treated literally, you could do so by escaping it with a backslash like this: You're not just limited to these fairly common character ranges either. Many people don't realize that you can also create character ranges between arbitrary consecutive digits or letters of the alphabet. This animation shows random examples of character ranges that are valid in almost any regular expression engine. When defining these character ranges, the most important constraint that you need to be aware of, is that the character used to start range can't come after the character used at the end of the range. For example, if you try to create a character range from d to a, ([d-a]) you'll get an error about an invalid range. But, if you instead re-arrange the order of the characters to [a-d] you'll be able to match the characters 'a' to 'd' as expected."
year_published = 2020
clearnet = "https://blog.robertelder.org/character-ranges-class-negation-regular-expressions"
