["https://blog.robertelder.org/how-to-make-a-cpu"]
title = "How To Make A CPU - A Simple Picture Based Explanation"
full_description = '''The purpose of this article is to explain how to make a CPU out of rocks and sand as fast as possible without using too many words. As the world of proprietary hardware and software crushes in around us, we risk losing the ability to make things for ourselves as individuals. It is for this reason that I felt compelled to learn how one could hypothetically make their own integrated circuits by themself. Skip to the end of this article for a few more words on this subject and a disclaimer. I was not brave enough to buy elemental phosphorus, so you'll have to use your imagination with the matches. And that's how you make a CPU. Also, see CPUs Are Smaller Than You Think for a look inside a real Intel CPU. Obviously, the process of making a modern CPU is more complicated and less well-defined that depicted by this article. Every new generation of chips usually makes changes to the way features are built up on the wafer (not just in terms of feature size). Many common techniques are not even mentioned in this article, and many important steps have been left out. Important details (such as precise chemical compositions/concentrations) are extremely proprietary and you won't see anyone describing them on HackerNews or Reddit. Many steps in the process (such as sourcing and purification of the silicon) have more than one commonly used method. If you want to learn more about these topics, the right search phrases are "Advanced Optics For Photolithography" and "Chemical Deposition Nanofabrication" or "Lithographic Metrology". Although this article isn't perfect, the hope is that an interested reader will benefit from using many of the topics discussed herein as search terms for further research on their own. While cutting-edge nanometer scale features are not likely to be accessible for a hobbyist, micron-scale amateur chip fabrication does appear to be quite feasible. I have not tried this myself, but Sam Zeloof has, and you should definitely check out his YouTube channel. I think you could probably even build some basic chips with far less equipment than he has if you get the optics right. You could probably make it a hobby business selling cusom chips to other tech people!'''
year_published = 2021
clearnet = "https://blog.robertelder.org/how-to-make-a-cpu"
