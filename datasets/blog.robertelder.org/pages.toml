["https://blog.robertelder.org/jeri-ellsworth-robot-uprising"]
title = "Jeri Ellsworth & the Robot Uprising of 2038"
full_description = '''In a stuffed apartment filled with hydrofluoric acid, oscilloscopes and a transistor curve tracer, Jeri Ellsworth carefully places a hand-cut silicon wafer into a 1000 degree furnace. The ambient noise of police sirens can be heard in the background: "Ugh, the police are coming... So the instructions for the emulsitone dopant says let it dwell in the opening of the furnace for a bit to drive off any organics, and I can see that it's changing colour-" A unexpected knock at the door cuts her off.[1] Jeri Ellsworth works solemnly on her p-doped silicon wafer, purchased from eBay, in an effort to make a simple silicon wafer transistor from first principles. Using store-bought rust remover for the source of acid, and Aquafina as a crude source of de-ionized rinse water. This is only the 100th try at making a functioning transistor for Jeri, and beside her on the desk lays a jar of full of failed attempts. Most of the world doesn't pay much attention to Jeri or her work, but the meek will inherit the earth when judgement day begins on the 19th of January 2038 at 03:14:07 UTC. What kind of judgement day you ask? Oh, just the kind of judgement day that Jeri has been preparing for her entire life. The un-trained observer would look at Jeri and see any ordinary technical enthusiast: Just another curious technical person who is interested in learning about how the world works. But for those who are keen enough to pay close attention, the evidence is clear that, almost from the beginning, Jeri's life has actually been one long covert training exercise to prepare her to lead the next generation of resistance fighters who will wage war against the robot armies of the future. The evidence for this is overwhelming, and it starts with her interest in magnetic core logic and memory: In this video on magnetic core memory and logic, Jeri Ellsworth discusses how magnetic core memory works. Today, magnetic core memory is considered an ancient and obsolete relic of the first mainframe computers. Instead of using tiny semi-conductor features to store data, as most modern memory does, the data in magnetic core is stored in the magnetic field polarization of small iron cores, where one bit of information is stored in each of these ferrite cells. Cells. Cells Interlinked. Here is a close-up from a piece of core memory I have laying around my apartment:'''
