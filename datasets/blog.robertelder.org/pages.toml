["https://blog.robertelder.org/routing-packets-between-esp8266-modules"]
title = "Routing Packets Directly Between ESP8266 Modules"
full_description = "This article is a review of a capstone project completed by Gagandeep Gill, Kenosha Vaz, and Shaheena Shaik. The goal of the project was to attempt to bridge a wireless network connection directly between ESP8266 modules without any independent intermediary router hardware. In the end, a minimum viable product was obtained that demonstrates this objective of direct ESP8266 to ESP8266 module communication. This article includes the source code for a minimum viable product that will forward packets between ESP modules, along with detailed information on the supporting install environment and dependencies to reproduce results. The final product did not include the ability to route packets back to a standard desktop PC or laptop (simply due to lack of time), however this should be achievable in a future project using a simple serial connection at the endpoints of the bridge. The results from this project include a demo of 6 ESP8266 modules performing bi-directional communication using a setup with pre-assigned 'neighbours'. Complete source code for this demo is provided below. This setup does not involve any traditional routers or IP level routing, but instead demonstrates multi-hop wireless communication using only ESP8266 modules based on MAC addresses. The positive result obtained in this project stems from substantial technical insights from the project's faculty supervisor, Mike Jarabek. If you decide to try and replicate these results for yourself, you may be interested in several observations made by Mike that would otherwise have made this project more difficult and time consuming: This section will describe the minimum viable product required for sending data directly between ESP8266 Modules in a way that can accomplish wireless bridging. The technique described here has been tested to work with sending packets in both directions through six ESP8266 modules. Simply illustrating the ability to send information between two ESP8266 modules is insufficient for demonstrating a practical implementation that could be extended to include an arbitrarily large number of ESP8266 modules that extend the chain further and further. The reason is that the modules are usually programmed to work either in the 'access point' mode (which functions like a router) or 'station' mode (which functions like a client connecting to the router), however it isn't possible (at least as far as I know) to gain the features of both modes at the same time with IP-based routing in order to 'chain' the access point connections to form a bridge of arbitrary length."
year_published = 2018
clearnet = "https://blog.robertelder.org/routing-packets-between-esp8266-modules"
