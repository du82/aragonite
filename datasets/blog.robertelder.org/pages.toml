["https://blog.robertelder.org/regular-expression-visualizer"]
title = "The Regular Expression Visualizer, Simulator & Cross-Compiler Tool"
full_description = "This article is part of Series On Regular Expressions. For more examples of regular expressions to visualize, check out this this list of Regular Expression Test Cases. The C source code below is the common code that is required by any of the code samples that are generated above. Simply copy and paste the following code into a file called 'main.c' along with the dynamically generated code above in order to make a hard-coded program that will perform your intended regex search. Make sure the code below is passed before the dynamically generated code above. You can compile the code using this command: The code should compile without any issues and produce the executable program 'a.out'. You can run this program with this command: Note that code does not represent a fast implementation of the regular expression (in fact it's one of the slowest implementations possible). The goal here is to produce a program that is very short and easy to understand for educational purposes rather than to produce one that is fast and complicated. Above, you'll find an interactive visualization that you can use to simulate regular expressions. You can type any regular expression and the tool will automatically create two diagrams that correspond to your regular expression. Both of these diagrams are interactive, zoomable and include support for a fullscreen mode. The first diagram is a parse tree. Constructing a parse tree is the first step that a regular expression engine will perform in order to decide what meaning each character will have. You can click on individual nodes in the parse tree to highlight the corresponding character in your regular expression. You can also go the other way and click on individual characters in the regular expression to quickly find the corresponding characters in the parse tree. By reviewing how the characters are grouped together in the parse tree, you can gain insights about the meanings of individual characters and how they relate to each other in the regular expression."
year_published = 2020
