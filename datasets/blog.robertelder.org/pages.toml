["https://blog.robertelder.org/semiconductor-example-uses"]
title = "Example Uses Of Semiconductors - More Than Just CPUs"
full_description = "If you ask a software developer the question 'What are some example uses of semiconductors?', they'll probably mention 'silicon chips', like the ones found in processors or graphics cards. Indeed, this is probably the answer that I would have given just a couple years ago, but I have since become enlightened as to the true power of semiconductors. In this article, I will provide some familiar (and some surprising) photographic examples of semiconductors that we use in our everyday lives. Everybody knows that CPUs have 'transistors' in them, but have you ever actually seen a transistor? Here's a single transistor in what's called a 'TO-92 package': A transistor is a general-purpose component that can be used to switch or amplify electrical signals: And here's what the packaged 'chip' look like if you smash it open even more. Take note of the shiny silvery-coloured parts: Here's an image of an entire intact silicon die of a flash memory chip that was never covered inside an epoxy package like the one above. This particular flash memory chip is not the same type of chip used in the blue SD card above. This particular flash memory chip is for 2GiB of flash storage: The bright colours are from thin-film interference within the thin oxide layers on the surface of the chip. The edges of the chip contains lots of details that encode the logic for reading and writing data to the chip: LEDs are also made of semiconductor materials, such as gallium arsenide, indium gallium nitride, gallium phosphide and many others. The exact choice of material is an important factor in determining which wavelengths of light will be emitted by the LED. In particular, different materials have different 'band-gap' values, which is an important factor in determining the energies (and therefore wavelength) of emitted photos. When people talk about harnessing the power of 'solar energy', they're talking about using 'solar cells' to convert light into electricity. These solar cells also happen to be made of semiconductors. The most common semiconductor material used to make solar cells is silicon:"
year_published = 2022
clearnet = "https://blog.robertelder.org/semiconductor-example-uses"
