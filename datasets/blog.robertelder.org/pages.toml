["https://blog.robertelder.org/regular-expression-quantifiers"]
title = "How Do Regular Expression Quantifier Work?"
full_description = '''In this article, we will discuss regular expression quantifiers with the ultimate goal of developing a very deep understanding of how they work. In fact, by the end of this article you'll understand quantifiers so well, that you'll be able to extend your knowledge to invent a completely new quantifier has never been seen before in any regular expression engine. Quantifiers are used to quantify how many times a part of your regular expression should be repeated. Every time you want to repeat something in a regex (an individual character, a character class or a sub-expression) you can write a quantifier after it to specify how many times it should be repeated. This article will only discuss these quantifiers within the context of Perl-like regular expressions (not POSIX regular expressions). This is worth mentioning since the older POSIX style regular expression quantifiers lack certain features, and have significantly different behaviour in some cases. Most typical guides to regular expressions would probably start by immediately diving into a detailed description of what each of these symbols does. They would probably start by explaining the meaning of the '*', '+', and '?' symbols. However, this won't be your typical guide to regular expressions. The reason for this atypical approach is simple: Once you understand what this quantifier does, you're already 50% done learning everything there is to know about quantifiers. Let's do a few examples. Assume you need to write a regular expression that can match both spellings of the word 'enroll'. The word 'enroll' can sometimes be spelled with one 'l' or two 'l's depending on whether the author chooses to use British or American spelling conventions. Using this regex: In this case the quantifier is the '{1,2}' part. The '{1,2}' quantifier can be interpreted in English to mean "Whatever came just before this quantifier, repeated anywhere from 1 to 2 times.". If you wanted to change the regex to also match any misspellings of 'enroll' that have 3 'l's, you could just change the upper bound of the range from 2 to 3:'''
year_published = 2020
year_updated = 2020
clearnet = "https://blog.robertelder.org/regular-expression-quantifiers"
