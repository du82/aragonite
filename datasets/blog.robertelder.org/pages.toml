["https://blog.robertelder.org/regular-expression-parser-grammar"]
title = "An LL Grammar For Regular Expression Parsing"
full_description = '''Below is an LL grammar for a fairly complete regular exprssion parser. This grammar is a documentation of the grammar supported by the Regular Expression Visualizer Tool demonstrated here. This grammar supports most basic regular expression operations such as character classes, alternation (|), greedy and lazy quantifiers (*, +, {n}, {m,n}, {n,}, {,n}, *?, +?, {n}?, {m,n}?, {n,}?, {,n}?). Sub-expressions are supported. Simple escaped ASCII characters such as '\n', '\t' or '\x97' are supported. Currently, the following features are not supported: Unicode, backreferences, word mark breaks, capture groups, look-aheads, look-behinds. Other less-universal regular expression features like nested character classes are not supported. LL grammars like this one are an excellent resource for writing recursive descent parsers. The grammar described below was written in a format similar to Yacc grammars, although it has never been perfected enough to actually run through a parser-generator to generate source code. Instead this hand-written grammar was used as a guide when creating a hand-written parser.'''
year_published = 2020
