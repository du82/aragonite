["https://blog.robertelder.org/zipping-corrupts-eclipse-workspace"]
title = "Silently Corrupting an Eclipse Workspace:  The Ultimate Prank"
full_description = '''you can tell them "Just right-click on it and select 'Send to Compressed (zipped) folder' and save the zip file". Unbeknownst to them, you just pulled the ultimate prank by telling them to make a corrupted backup! What your friend probably doesn't realize is that the Windows 'Send to Compressed (zipped) folder' utility has a mandatory optional feature to automatically not include certain folders in the archive without telling you. This is a great feature because it demonstrates the excellent sense of humour that the authors of Microsoft Windows have. This feature was no doubt included to allow you to play a variety of hilarious pranks on others by causing them lose data, only to find out about it years later when they want to open the archive and recover it. Here's how the silent corruption feature works. Just right-click on your eclipse workspace and select 'Send to Compressed (zipped) folder'. Note that the '.plugins' folder is missing. Now when you open this workspace with Eclipse, you'll get behaviour that looks somewhat like it has 'forgotten' all of your projects. You can go and import them, but various other settings are likely to be still broken. The 'Send to Compressed (zipped) folder' feature will omit any directories that start with a period character. But wait, the '.metadata' directory in the Eclipse workspace starts with a period and it was successfully included in the archive, so what gives? I did a bit of experimenting and it appears that only directories after the first directory are omitted. This is probably why the '.metadata' folder itself is still included in the archive even though it starts with a dot. Here's what you get if you include a bunch of files and folders that start with a period: This feature of omitting directories that start with a period is probably related to the feature of Windows explorer that prevents you from creating a file or folder that starts with a dot: Folders created using this method also seem to have the same behaviour mentioned above when zipping them inside archives. As far as I can tell, this feature is recursive, meaning that only the first directory starting with a dot will be added to the archive no matter how many directories deep it is.'''
year_published = 2017
clearnet = "https://blog.robertelder.org/zipping-corrupts-eclipse-workspace"
