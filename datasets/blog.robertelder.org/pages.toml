["https://blog.robertelder.org/esp8266-network-investigation"]
title = "Can You Create A Wireless Bridge With ESP8266 Modules?"
full_description = "UPDATE 2018-12-15: The answer to the question in the title is YES! For details, please see the this article on routing packets directly between ESP8266 modules. The rest of this article will be left here unchanged as the newer article builds upon the investigations carried out by the group below. This article is a review of a capstone project completed by Anubhab De, Sanjay Kshatriya, Zankrut Hiren Shukla. The goal for their project was to investigate the feasibility of attempting to use the ESP8266 wireless module to perform wireless bridging in order to route packets between isolated networks. In the end, the students found that it is not trivially possible to use the ESP8266 module to accomplish wireless bridging in dual station/AP mode. If it is indeed possible for this to work, the students were not able to find such a configuration, and I was unable to provide them with any insights that might lead them to a fruitful solution in the time available. I do still believe that wireless network bridging can be accomplished somehow, although the final solution will likely require deeper knowledge of the ESP8266 hardware and firmware internals, and possibly some clever hacks. The remainder of this article is dedicated to the investigation that the students performed which may be of use to someone pursuing a similar type of investigation. Despite the fact that the ESP8266 module supports a 'dual' (station and AP mode) that is intended for both connecting to another WiFi and offering connections to devices at the same time, it doesn't seem to be easy to use this feature easily through multiple ESP8266 modules in order to forward packets in both directions. It is possible that there was a hardware or configuration error in the setup that lead to this conclusion, however the students performed many steps to very that their setup functioned properly. The required voltage of 3.3V was used, and the students were able to successfully connect the modules to a router over WiFi and send data between the modules."
year_published = 2018
