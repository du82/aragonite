["https://blog.robertelder.org/7-weird-old-things-about-the-c-preprocessor"]
title = "7 Scandalous Weird Old Things About The C Preprocessor"
full_description = '''Updated 2018-01-21: Added clarification related to assertion about lack of context free nature of the C preprocessor. A scandal is defined as something involving questionable moral principles that causes public outrage. This would make the word 'scandal' an excellent qualifier for describing the behaviour of the C preprocessor. I became aware of many of these features of the C preprocessor when working on my C compiler. The preprocessor is not 100% complete, but it supports recursive function macros. Specifically, it is currently able to successfully preprocess a third-party implementation of a Brainfuck interpreter that was implemented in the C preprocessor. You can try out the demo for your self. The C99 standard is about 500 pages, but only 19 of them are dedicated to describing how the C preprocessor should work. Most of the specs are high level qualitative descriptions that are intended to leave lots of freedom to the compiler implementor. It is likely that this vagueness in this specification was intentional so that it would not cause existing mainstream compilers (and code) to become non-conforming. Design freedom is good for allowing people to create novel optimizations too, but to much freedom can lead to competing interpretations. Bjarne Stroustrup even points out that the standard isn't clear about what should happen in function macro recursion[1]. With reference to a specific example he says "The question is whether the use of NIL in the last line of this sequence qualifies for non-replacement under the cited text. If it does, the result will be NIL(42). If it does not, the result will be simply 42.". In 2004, a decision was made to leave the standard in its ambiguous state: "The committee's decision was that no realistic programs "in the wild" would venture into this area, and trying to reduce the uncertainties is not worth the risk of changing conformance status of implementations or programs." Note added on 2018-01-21: I have had it on my todo list for a while now to go back and revise the asseration I'm making here that claims that the C preprocessor is context sensitive. I now believe this assertion is wrong and that the C preprocessor is NOT context sensitive, but I'll leave this section in here since it is still generally informative about the C preprocessor. Some day, I may find the time to go back and review this a bit more and prove it formally one way or another.'''
year_published = 2015
year_updated = 2020
clearnet = "https://blog.robertelder.org/7-weird-old-things-about-the-c-preprocessor"
