["https://blog.robertelder.org/commands-raspberry-pi-camera"]
title = "An Overview of How to Do Everything with Raspberry Pi Cameras"
full_description = "The purpose of this article is to provide an overview of how to perform various useful tasks with your Raspberry Pi Camera. An emphasis will be made on providing copy and paste examples rather than detailed explanations. you'll see a full printout of all available options. Here's what my version shows (it may be different for you): The above command will use 'raspivid' to capture raw .h264 video with no container. Many media players may not play this raw .h264 file correctly, so you can package it into a .mp4 file using this command on the Raspberry Pi: There is a lot of overlap in the arguments used by 'raspivid' and 'raspistill'. Here are some of the ones specific to 'raspivid': A commonly-requested feature is to be able to stream video data from your Raspberry Pi over the local network and view it on another computer. After having experimented with a number of different techniques for real-time video streaming from the Pi, I've found that the following method yields the lowest latency. Run this command on your laptop/desktop computer: Replace the 'REPLACE_WITH_YOUR_IP' part with the LAN IP address of your laptop/desktop computer where you want to view the stream. The above solution uses the 'raspivid' command to read directly from the Raspberry Pi Camera and then forward the data directly over the network using netcat using the 'nc' command. This option works well if you have only one client that needs to view the stream. It's worth noting that the data forwarded over the network by netcat is not encrypted. Also, the port 2222 is just an example. You can use any port you want as long as it's not already in use on your machine and you must make sure both port references match. This technique can also be extended to one that will work over the internet using port forwarding rules and a proxy server technique just as described in Using SSH to Connect to Your Raspberry Pi Over The Internet. In order to record from your Raspberry Pi camera, you need to make sure that the '/dev/video0' device is available. Use this command to check:"
