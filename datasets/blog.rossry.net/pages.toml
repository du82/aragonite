title = "2018-19 Donor Lottery Report, pt. 2"
description = "In 2019, I was selected to direct $500k of funding to the most effective charities I could find. Post 2/N discusses several Covid-19-related grants from 2020."
full_description = '''2018-19 Donor Lottery Report, pt. 2 14 Dec 2020 effective altruism, covid-19, donor lottery, donations This post is cross-posted to the EA Forum, where I expect comments will be much more visible than they are here. This is the second in a series of reports on my decision-making process and decisions in allocating the $500k funding pool from the January 2019 CEA donor lottery. This writeup on my phase-2 grant recommendations is released simultaneously with my writeup of phase 1, which also provides a broader introduction to my personal background, philosophical foundation, and initial process. While the decision-making process for phase 1 was largely completed prior to the widespread understanding of the scope of the Covid-19 pandemic, phase-2 grantmaking began in March 2020 and specifically focused on neglected responses to the pandemic. This writeup outlines what I can reconstruct of my process and opinions at the time, and discusses my thoughts on room for further funding. As with the previous report, this writeup represents independent work and is not coauthored or endorsed by CEA, the organizations or individuals mentioned, or my employer. Grantee organizations and individuals were given one week to review a draft of relevant segments (except for COVID-END, who I neglected to contact before publication through my own mistake), though final editorial decisions were mine. Overall summary In phase 2, CEA accepted my recommendations to grant (in decreasing order of grant size): $100k to Fast Grants, for rapid regranting to academic research projects related to Covid-19. $80k to COVID-END, to reduce duplication in Covid-19-related research and accelerate evidence-based policy responses worldwide. $15k to the Bottleneck Fund, for regranting to global interventions in water and sanitation to prevent the spread of Covid-19. $6.4k to Ian David Moss, for consulting work supporting the FRAPPE donor group. Between these grants and those from phase 1, a total of $366.4k has been granted from the original pool of $500k. I expect the remaining funding pool to be fully distributed in one or two further phases in the next year. This post has top-level sections on: general considerations regarding the Covid-19 pandemic, my opinions on the priority of pandemic interventions, and my research approach, analysis of Fast Grants, analysis of COVID-END, thoughts about the Bottleneck Fund, thoughts about funding Ian's work, the current Covid-19 situation and its implications for EA giving, and an open call for proposals for phase-3 grants. General considerations and approach I should begin this section by saying that I have mostly not followed -- or been involved in -- debates in non-public social media spaces within the EA community on the relative importance of Covid-19 work. Instead, one of the very first discussions of Covid-19 EA research that I saw was the post Prioritizing COVID-19 interventions & individual donations, posted to the EA Forum by Catherine Olsson and Ian David Moss in early May. I reached out to them, and they helpfully shared additional unpublished thoughts and research material that had not been suitable for publication at the time. At their invitation, I joined the private chat for the FRAPPE donor group during its final weeks of operation. At the same time, I was attempting to form my own back-of-the-envelope estimate of whether the Covid-19 pandemic would be an important and neglected issue that EAs should be working on. I expected (with high confidence) that most Western institutions would fail to react to the situation with sufficient flexibility and operational tempo (i. e., "speed and intensity of [actions] relative to the speed and intensity of unfolding events in the operational environment") to pick even a substantial fraction of the low-hanging and easily-identifiable intervention opportunities. I further believed (with medium confidence) that widespread lockdowns were politically inevitable, and that (with medium confidence) the economic and human costs of those widespread lockdowns would make Covid-19 interventions plausibly among the most effective interventions for making the world better, at least outside of far-future interventions. (I did not seriously re-evaluate the feasibility of finding neglected and effective far-future interventions, for similar reasons to before.) [ry: I'm not going to quantify the claims above about the pandemic's absolute importance, lest this post take several times longer to research and write.] Relative opinions on Covid-19 interventions Furthermore, I knew that most EA donors were used to acting under the significant evidential certainty that the work of Givewell et al. provide -- and anticipated that they would (understandably) be reluctant and slow to act quickly under the massive uncertainty here. Many EAs, I thought, would be used to "effective" being synonymous with "evidence-backed", and I believed that none of the most promising Covid-19 interventions would be truly evidence-backed. (I was less certain that these effects would affect large, thoughtful EA donors, but had trouble predicting their actions, and with medium-weak confidence did not expect them to fully fund the promising Covid-19 interventions available.) In the language of relative opinions, I expected that novel, non-evidence-backed approaches -- that were promising mostly based on outside-view analysis and intuitive prior beliefs -- would be materially under-supported by both the EA community and non-EA institutions. Fortunately, I had the chance to direct discretionary funding due to the donor lottery, and looked for ways to deploy it for effect. Research approach I started by considering FRAPPE's longlist of Covid-19 interventions (both the public recommendations, and others noted in unpublished research). I also solicited suggestions for other organizations and interventions from individuals I trust, though no candidates from those conversations ended up working out. (I was already independently aware of Fast Grants, though I was not seriously considering funding it on EA grounds before it was written up in Ian and Catherine's post.) My subsequent approach was mostly unstructured and punctuated by personal and professional interruptions. At most points, I felt like I faced a strategic compromise between a desire for thoroughness and the premium to acting quickly. Given the constraints of the exercise, I'm actually quite grateful for my professional experience in trading and applied research, which was useful in helping me to realize when I should stop analyzing further and act on the information I had. I'm near-certain that if I had tried to conduct all of the research at a uniformly high and "respectable" level of rigor, I would have issued grants months later than I did (and been much less effective). In the end, I'm glad that I was able to direct the grants that I did, though in hindsight I wish I had started sooner, issued grants with less delay once I already thought they were likely to be a good idea, and aimed to exhaust the remaining funding pool by, say, the middle of the year. Fast Grants Summary Fast Grants was a rapid-turnaround funding mechanism for research on Covid-19, mostly but not exclusively biomedical in nature. In my cursory (~1hr) review of projects they had funded and announced on their website at the time, roughly one-half of the projects they supported were related to vaccine development, one-quarter related to clinical treatment, and one-quarter related to testing or epidemiological modeling. In the grant rounds that were running at the time, grant applications were reviewed and responses issued on a rolling 48-hour basis, and focus was on projects with a six-month-or-less timescale. The initial round of grants distributed $20mln in the first month after launch, and at the time I was considering a grant, Fast Grants was soliciting first-round grantees to nominate peers' projects for the second round of grants. (By the point of this post's publication, Fast Grants had distributed more than $40mln; their pace of grants decelerated significantly in the second half of 2020.) While Fast Grants's lead principal, Tyler Cowen, is not an epidemiologist or research biologist, I was able to get a sense of the panel of scientists who were actually reviewing grant applications. To my cursory (<2hr) review of their online presences, they appeared to be competent research scientists. My perspective While many actors recognized the Covid-19 pandemic as an unusually important moment for action, most organizations in academia, industry, and government demonstrated an unwillingness or inability to change their operating rules for how research was done and resources were allocated. At the time, Fast Grants was one of the few organizations I saw operating to advance Covid-19 research with urgency appropriate to the situation. My positive opinion of Fast Grants was further due in part to my pre-existing positive opinion of Tyler Cowen, whose writings and nonprofit work I have followed with interest for more than five years. While I do not completely understand Tyler's perspective on how to choose or prioritize projects, I expect him to be extremely capable at work that requires broad context, flexible thinking, and an operating awareness of expected value. Given that Fast Grants was a project in a high-value cause area suited to a project manager with traits such as Tyler's, I found Fast Grants to be an especially promising funding opportunity. I recommended an initial grant of $100k, with the intention of recommending an additional grant if further research did not reveal other promising funding opportunities. In hindsight In hindsight, I now believe I should have recommended a larger grant to Fast Grants at the time, exhausting the entire funding pool not distributed in other phase-1 or phase-2 grants. I expect that the marginal funding would have enabled Fast Grants to further support high-expected-value, funding-constrained, Covid-19-related research -- and in practice, I did not resolve my further research in time to issue grants elsewhere, or a follow-up grant to Fast Grants. At the present time, however, Fast Grants is no longer soliciting funding. In any case, I no longer believe that it represents a particularly compelling funding opportunity (see "Further pandemic interventions" below). COVID-END Summary COVID-END is a collaboration of research-synthesis groups that was, at the time, working to reduce duplication of effort by policymakers reviewing evidence on questions of Covid-19-related policy. (I'm less familiar with the evolution of their work since then, though I understand it to be essentially similar.) Their major initiatives at the time were providing on-demand rapid evidence syntheses and coordinating the sharing of existing evidence reviews between policymakers and other stakeholders. My perspective I found it relatively difficult to evaluate the specific concrete actions of the different organs of COVID-END, but I thought there was substantial promise in the fundamental value proposition of reducing duplication in Covid-19 evidence synthesis. I reviewed a selection of rapid evidence reviews and a non-public document about their near-term plans, and I spoke at length with Ian David Moss (from the FRAPPE donor group) about his thoughts about their potential impact. The evidence that I could evaluate, plus secondhand recommendations from Ian, left me happy to recommend a $80k grant to fill a substantial portion of their then-identified funding gap. In hindsight I did not prioritize conducting a follow-up review of COVID-END, as I found Fast Grants to be a more promising candidate for a follow-up grant at the time. I have not tried to evaluate the counterfactual effects of the grant on COVID-END's 2020 operations, and do not think it is currently a high priority to do so. As the Covid-19 information environment matured, it became more plausible to me that the most promising marginal opportunities would not be in further evidence synthesis, and I do not currently believe that funding COVID-END represents a particularly compelling opportunity (see "Further pandemic interventions" below). The Bottleneck Fund Summary / My perspective The Bottleneck Fund was an ad-hoc project by Kristen Tonga, re-granting operating funds to small-scale ($1k-$10k) interventions in water and sanitation to prevent the spread of Covid-19 in developing regions. I spoke briefly with Kristen as part of my work with the FRAPPE donor group and reviewed a list of the projects she was considering for support. Ultimately, I decided to opportunistically fill the funding gap corresponding to what I felt were the highest-value marginal opportunities. This grant increased the fund's total operating budget by about 60%. At the time, the Covid-19 information environment was fast-moving, most institutional actors did not act with sufficient operational tempo, and many positive-expected-value interventions were going neglected. It was clear to me that there would be small-scale opportunities to direct funding based on individuals' prior expertise. Kristen's work to opportunistically identify and fund small-scale interventions related to her experience in the water/sanitation space seemed promising along those lines. In hindsight I did not conduct follow-up research on the ultimate deployment of Bottleneck Fund funds. I have reviewed an interim report on the uses of the funds (as I expected, these primarily included installing handwashing stations, distributing liquid soap/sanitizer/detergent, distributing personal protective equipment, and providing Covid-19 education in developing regions), and I understand that follow-up reporting is ongoing. I continue to be excited in general about the concept of small-scale, opportunistic regranting funds as an option for small- and medium-sized donors to partner with EA community members with narrow but relevant expertise. Ian David Moss (consulting work for FRAPPE) Summary Ian David Moss operates an independent consulting practice offering strategy and research services to donors, foundations, and nonprofits. He co-authored the "Prioritizing Covid-19 interventions & individual donations" EA Forum post with Catherine Olsson, and I spoke with him multiple times as part of my work with the FRAPPE donor group. At the time, he was contributing a substantial amount of research to the group, with his work partially pro bono and partially at a specially-negotiated consulting rate funded by the FRAPPE donors. After evaluating his work and the group's funds remaining, I decided to fund him for a fixed portion of additional research work, with a goal of producing medium-depth evaluations of additional Covid-19 interventions that had seemed marginally promising in initial evaluation. My perspective I appreciate the pro bono research work that Ian conducted and shared with the gr'''
year_published = 2020
year_updated = 2024
