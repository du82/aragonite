full_description = "Donations 2022-2024 14 Dec 2024 donations, effective altruism editorial note: This post is incomplete, but I'm publishing it in its current form in the hopes that it'll be helpful to other people thinking about their end-of-year donation decisions.While I, as ever, recommend that every serious donor use a donor advised fund to allow them to set donation amounts in tax year 2024 and decide recipient organizations in early 2025, I do recognize that a post published on December 31 is worse than one published this week. So we're going with this experiment with an unfinished draft.This notice will be removed when I consider this post final. This post describes my thoughts, at the end of 2024, about using money to make the universe a better place. I remain committed to using at least 10% of what income I earn to do so, and am excited to do more than that when I have the opportunity. This year marks the tenth anniversary of my first $4,000 donation to GiveWell's top charities! (That donation was 10% of my summer internship salary, plus some other campus jobs.) A lot has changed since my last post in 2021, only some of which I'm able to recap here. (I have tried to publish these posts annually, but missed 2022 and 2023 for idiosyncratic reasons.) I'll break this post into (1) general discussion and personal outlook, [incomplete], and logistics, (2) donations by cause area for 2024, 2023, and 2022, and summary lists, (3) [incomplete: events of 2022 and 2023], and personal-policy updates, and (4) other people's writeups that I have found interesting. (1a) Shortly after my last donations post, I left a career in quantitative trading where I had been READ MORE Donations 2021 31 Dec 2021 donations, effective altruism This post describes my thoughts, at the end of 2021, about donating money to make the universe a better place. I remain committed to using at least 10% of what income I earn to do so. This year is the first time since 2017 that I'm substantially changing my approach to donations. In 2017, I shifted my focus from mainly global poverty/health to a mix of global poverty, animal welfare, long-term future, and meta EA. This year, I'm shifting to a mix of global poverty, animal welfare, and explicitly 'exploratory' categories. note: This post is dated in some ways, but—like all my donation posts—I intend to leave it as-published as a snapshot in time instead of promising to keep it up-to-date with later info. (1a) Perhaps the most important long-term development in effective altruism in 2020 and 2021 has been the crypto boom, which has moved at least $30 billion of wealth to committed effective altruists. (The most widely visible of these is Sam Bankman-Fried, CEO of FTX.) I would roughly estimate that the top ~ten self-identifying EAs now have plans to move at least $45 billion of donations to EA causes in the next ~30 years -- even in the case that all of their various business investments mostly stagnate at current valuations. That's a lot of money. Given this landscape, my goals as an EA donor this year were (1) to move my personal focus to finding and supporting things that I expect existing large donors to have difficulty finding, evaluating, or supporting, and (2) to use my giving to 'set up' for having a larger impact later, by exploring things that I can READ MORE"
