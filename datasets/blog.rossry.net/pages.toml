title = "Onward, abroad!"
description = "I'm moving to Hong Kong!"
full_description = "Onward, abroad! 2 Mar 2018 personal attention-conservation notice: short personal-update post Tomorrow, I'll be moving to Hong Kong (for at least a few years). I'll be working for Jane Street, as I was in New York, doing roughly the same things, and still earning to give. Most of my worldly possessions are already on the slow boat to China, so there's no going back now... I expect to be thrown back into learning-things mode for a while, but after that to have time to travel, to live in a new place, and spend some time off the well-trodden path. Expect either more blog posts, or fewer; I'm not yet sure which. Meanwhile, feel free to send any travel recommendations my way, or let me know if you'll be in that part of the world anytime soon -- I honestly don't know when I'll be back in the New York/Boston area next!"
