 Beautiful Mind, and his wife died in a car crash Saturday, according to New Jersey State Police. Well, okay, somehow the fact that his life inspired a Hollywood film made it into the obit before the fact that he won the 1994 Nobel Prize in Economics. (Note: "Nash called the film an 'artistic' interpretation based on his life of how mental illness could evolve -- one that did not 'describe accurately' the nature of his delusions or treatment.") But in actuality, it's enormously difficult to describe the impact that this man had on the field of Game Theory, which now underlies much of economics, politics, and has even been applied to describe the strategy of penalty shootouts in soccer (where it closely predicts the strategies that top players actually use). And if you're anything like me, you'll find his 1950 dissertation a refreshing respite from page after page of obituary: Non-Cooperative Games (typewriter facsimile) Introduction Von Neumann and Morgenstern have developed a very fruitful theory of two-person zero-sum games in their book Theory of Games and Economic Behavior. This book also contains a theory of n-person games of a type which we would call cooperative. This theory is based on an analysis of the interrelationships of the various coalitions which can be formed by the players of the game. Our theory, in contradistinction, is based on the absence of coalitions in that it is assumed that each participant acts independently, without collaboration or communication with any of the others. The notion of an equilibrium READ MORE'''
