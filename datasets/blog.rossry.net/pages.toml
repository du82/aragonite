full_description = '''When each proud fighter brags 11 Jan 2025 death, eulogy, effective altruism, game theory content warning: As heavy as this blog gets. (1) I met Max Chiswick in June of 2024 because I wrote something wrong on the internet. He tracked me down at Manifest to tell me so—I had written about the shortcomings of poker as a teaching tool, but I had made several wrong assumptions about how one would play poker differently with the goal of learning instead of recreation. First, you'd play with two players instead of eight. We nearly always play with eight-ish players because we want a relaxing game, where large gaps in the action are considered a feature. With two players, though, not only is it your turn four times as often, but more of your decisions are "live" because it's correct to play more (initial) hands and there are fewer that you should fold on sight. Second, you'd play a game with fewer chips—meaning that you'd make bets in coarser increments and with a smaller ratio of largest-possible bet to smallest-possible bet. This makes the decision tree shallower and more amenable to explicit case-by-case reasoning, and it also has the nice effect of making the highest-stakes decisions less terrifying (while keeping the stakes of bread-and-butter decisions suitably meaningful). But most importantly, if you're playing poker as an exercise for training your mind, you should focus less on becoming a theoretically-optimal robot. You can read books and blogs about "game theory optimal" play (e.g., Nash equilibrium) and drill yourself to get arbitrarily accurate at executing it, but that's simply not the useful part. The part of poker that makes you smarter—Max explained to me—is observing the non-optimal patterns in your opponents' play, and READ MORE Donations 2022-2024 14 Dec 2024 donations, effective altruism editorial note: This post is incomplete, but I'm publishing it in its current form in the hopes that it'll be helpful to other people thinking about their end-of-year donation decisions.While I, as ever, recommend that every serious donor use a donor advised fund to allow them to set donation amounts in tax year 2024 and decide recipient organizations in early 2025, I do recognize that a post published on December 31 is worse than one published this week. So we're going with this experiment with an unfinished draft.This notice will be removed when I consider this post final. This post describes my thoughts, at the end of 2024, about using money to make the universe a better place. I remain committed to using at least 10% of what income I earn to do so, and am excited to do more than that when I have the opportunity. This year marks the tenth anniversary of my first $4,000 donation to GiveWell's top charities! (That donation was 10% of my summer internship salary, plus some other campus jobs.) A lot has changed since my last post in 2021, only some of which I'm able to recap here. (I have tried to publish these posts annually, but missed 2022 and 2023 for idiosyncratic reasons.) I'll break this post into (1) general discussion and personal outlook, [incomplete], and logistics, (2) donations by cause area for 2024, 2023, and 2022, and summary lists, (3) [incomplete: events of 2022 and 2023], and personal-policy updates, and (4) other people's writeups that I have found interesting. (1a) Shortly after my last donations post, I left a career in quantitative trading where I had been READ MORE'''
