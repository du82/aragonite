full_description = '''(Naïve) microeconomics of bundling goods 15 Feb 2023 economics, bundling, price-discrimination Originally posted to LessWrong. Junk fees are in the news from the 2023 State of the Union address, get picked up by Matt Yglesias, and Zvi responds in Junk Fees, Bundling and Unbundling. Matt and my former colleague propose an economic framing of "bundling versus unbundling", and Zvi identifies four win-win advantages of bundling, and four 'advantages' of unbundling (two win-wins, one (company win)-(customer lose), and one mixed win-lose). I think Zvi is broadly right on the points he makes, but he and Matt both skip over the basic, conventional econ-101 analysis of bundling goods on prices and customer welfare. I think that, for a broader audience, it's worth covering the "naïve microeconomics" perspective as background for the customer-behavioral story (which, admittedly, is more juicy and fun). Rather than responding to the whole conversation, this post will restrict its focus to the econ-101 microeconomics story of bundling, and ignore the behavioral / political / moral dimensions that Zvi, Matt, and others are discussing. I'm going to assume no formal economic background, and build up an explanation why a world of perfect economic agents should have sellers preferring to sell bundles of goods instead of individually-priced items. (1) Selling sandwiches Let's say that you're a sandwich-seller. Every day, 110 people come by your sandwich stall, look at the price you put on the menu, and buy a sandwich if they value it more than the price. (No bargaining or haggling; you don't have time for such things.) Sandwiches cost you $1 to make, and people value sandwiches somewhere between $0 and $11, fairly uniformly: [ed: The first-best version of this post includes interactive charts with sliders that let you explore READ MORE Speculative preparedness 29 Mar 2020 economics, prices, pandemics, big business note: "Preparedness" is right there in the title, but this is an economic analysis for the next crisis, not personal preparedness advice for the current one. Jeff Kaufman discusses an interaction between price controls and emergency preparedness: Let's say you see a potential pandemic coming, and you produce a product that could be critical. Maybe you make respirator masks, maybe you make ventilators, maybe you make PCR test reagents. You can see that if you and your competitors don't ramp up production and the pandemic happens, there will be a shortage. What do you do? [...] [One] option is to ramp up production now, speculatively. Start paying workers extra to work longer shifts and run your assembly lines around the clock. Train extra workers. Find what you're bottlenecked on and figure out how to get that ramped up too. If the pandemic fears were overblown you lose a lot of money, but if the pandemic happens people need what you have so much that you can charge high prices. How much to ramp up production in advance depends on how likely you think the pandemic is, and how much you'd be able to increase prices if it does happen. Except we have laws and customs against price gouging: if the pandemic does happen, you are going to have a lot of trouble raising your prices. The laws generally do allow passing along increased costs, but the problem here is that your costs were speculative. Let's work an example. (...) The punchline of the worked example is that if you think that there's a 50% chance of an emergency that will make your products ten times as valuable, it's still not worth it READ MORE'''
