full_description = '''2018-19 Donor Lottery Report, pt. 2 14 Dec 2020 effective altruism, covid-19, donor lottery, donations This post is cross-posted to the EA Forum, where I expect comments will be much more visible than they are here. This is the second in a series of reports on my decision-making process and decisions in allocating the $500k funding pool from the January 2019 CEA donor lottery. This writeup on my phase-2 grant recommendations is released simultaneously with my writeup of phase 1, which also provides a broader introduction to my personal background, philosophical foundation, and initial process. While the decision-making process for phase 1 was largely completed prior to the widespread understanding of the scope of the Covid-19 pandemic, phase-2 grantmaking began in March 2020 and specifically focused on neglected responses to the pandemic. This writeup outlines what I can reconstruct of my process and opinions at the time, and discusses my thoughts on room for further funding. As with the previous report, this writeup represents independent work and is not coauthored or endorsed by CEA, the organizations or individuals mentioned, or my employer. Grantee organizations and individuals were given one week to review a draft of relevant segments (except for COVID-END, who I neglected to contact before publication through my own mistake), though final editorial decisions were mine. Overall summary In phase 2, CEA accepted my recommendations to grant (in decreasing order of grant size): $100k to Fast Grants, for rapid regranting to academic research projects related to Covid-19. $80k to COVID-END, to reduce duplication in Covid-19-related research and accelerate evidence-based policy responses worldwide. $15k to the Bottleneck Fund, for regranting to global interventions in water and sanitation to prevent the spread of Covid-19. $6.4k to Ian David Moss, for consulting work supporting READ MORE 2018-19 Donor Lottery Report, pt. 1 13 Dec 2020 effective altruism, good food institute, donor lottery, donations This post is cross-posted to the EA Forum, where I expect comments will be much more visible than they are here. The results of the January 2019 CEA donor lottery meant that I was responsible for allocating the donor lottery's $500k funding pool. I entered the donor lottery anonymously, though I now intend to explain my grants and decision-making process publicly; I believe that transparency and open sharing of ideas is a good thing for effective altruism, and I'm glad to be able to contribute to that here. I expect that my grant recommendations from this funding pool will ultimately be made in three or four phases; this writeup is a preliminary report on phase 1, and is released simultaneously with my writeup on phase 2. The decision-making process for phase 1 was largely completed prior to February 2020, and phase-1 grants were not substantially affected by consideration of the Covid-19 pandemic (see "Adjusting for unexpected developments", below). Phase-2 decision-making began after February 2020, and phase-2 grants focused on neglected responses to the Covid-19 pandemic (see phase-2 writeup post). As of December 2020, phase-3 decision-making has not yet begun in earnest. Overall summary In phase 1, CEA accepted my recommendations for two earmarked grants to the Good Food Institute: $120k to GFI's European affiliate to support policy advocacy enabling the development and mainstream deployment of food products that replace farmed-animal products. $45k to GFI's Asia--Pacific affiliate to support market research and policy advocacy, likewise to support deployment of alternative protein products in Asia. This post has top-level sections on: my personal and philosophical background, my current high-level thoughts on different EA cause areas, some considerations for medium-size READ MORE'''
