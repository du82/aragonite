["https://blog.rossry.net/chisness"]
title = "When each proud fighter brags"
description = "Remembering Max Chiswick, may his memory be a blessing."
full_description = '''When each proud fighter brags 11 Jan 2025 death, eulogy, effective altruism, game theory content warning: As heavy as this blog gets. (1) I met Max Chiswick in June of 2024 because I wrote something wrong on the internet. He tracked me down at Manifest to tell me so—I had written about the shortcomings of poker as a teaching tool, but I had made several wrong assumptions about how one would play poker differently with the goal of learning instead of recreation. First, you'd play with two players instead of eight. We nearly always play with eight-ish players because we want a relaxing game, where large gaps in the action are considered a feature. With two players, though, not only is it your turn four times as often, but more of your decisions are "live" because it's correct to play more (initial) hands and there are fewer that you should fold on sight. Second, you'd play a game with fewer chips—meaning that you'd make bets in coarser increments and with a smaller ratio of largest-possible bet to smallest-possible bet. This makes the decision tree shallower and more amenable to explicit case-by-case reasoning, and it also has the nice effect of making the highest-stakes decisions less terrifying (while keeping the stakes of bread-and-butter decisions suitably meaningful). But most importantly, if you're playing poker as an exercise for training your mind, you should focus less on becoming a theoretically-optimal robot. You can read books and blogs about "game theory optimal" play (e.g., Nash equilibrium) and drill yourself to get arbitrarily accurate at executing it, but that's simply not the useful part. The part of poker that makes you smarter—Max explained to me—is observing the non-optimal patterns in your opponents' play, and playing the non-Nash strategies that exploit them. Instead of assuming that you are playing against a perfect player and aiming only to avoid imperfection yourself, you ask "What evidence can I see? What does that suggest is happening right now? How should I act in the world I find myself in? Can I get even more information about this? How?" You play the game, to win, as if it were an imperfect microcosm of an imperfect world. Because it is. Put that way, I was (and am) convinced that my original post was arguing against a strawman. I had never actually played the kind of poker that would make a fair comparison! And, as the conversation went on, I—we—got excited about co-authoring a post exploring just where my first one had gone wrong. We met the day after the conference; Max moved his flight to the evening so we could keep talking. And things turned from my original blog post, to our respective (mostly shared!) thoughts about the value of teaching through games in general, the richness of "find out what works" versus "learn what theory says", and what we were each up to next. And we hatched an idea. We could—we realized in that living room meeting— we could and wanted to write an online course that presented a vision of 'games to learn through' the way we thought it should be presented. There are moments in life where, if you're paying attention, your future forks and you get a choice. The project which wasn't even a suspicion twenty-four hours ago is now a possibility. You can leave it as just that, an interesting possibility for an interesting afternoon. Or you can decide that, whatever your plans were yesterday, you're now doing this. Once upon a time, on a different continent and two years before, I had written games to teach trading skills. (I was working at the time at a New-York-based proprietary trading firm.) I loved that work. If ever we solve all of the world's problems and there's nothing that's important to do but each of us figure out how to well, then I'll be making games that teach. But now I was working on something different. I thought. Screw that, I decided to write a course on games. We decided to write a course on games. Max had planned to expand his AI Poker Tutorial into an online textbook, but together we'd to go after the larger—and more satisfying—goal of entirely re-building it around interactives and challenges instead of readings. Then, after we'd taught the course to a few hundred students, we could pull it into a textbook. It was June; could we be ready for when colleges start in September? Sure. Well, should we ship a Minimum Viable Product sooner than that and figure out what worked? That would be good. When would we have to… Four weeks, we decided, was how long we had to write our first ten-class course. We'd teach through the lens of 'writing AIs for games', taking our students to the point where they could replicate the state of the art in 2019—when reinforcement-learning models beat human players in multi-player No-Limit Texas Hold 'em. Not with lectures, but with a series of weekly hands-on challenges. We were ambitious and a bit crazy—but hey, we were in San Francisco. It being San Francisco, we did indeed launch our in-person beta on July 15—one week later than our initial goal, but just five weeks after Max and I met for the first time—at the SF Commons. (The amazing Ricki Heicklen also helped us prep and run that first class.) Just over forty students turned out for the first day! We had an interactive-first reading and challenge for them to work through in pairs. "I'm exercising a part of my brain that hasn't been used since college!" said one of our students, "I feel like this is the kind of [stuff] that staves off dementia!" And so, in a scrappy, startup fashion, we made it through our five weeks. Our students wrote AIs for toy-sized poker variants and imbalanced rock-paper-scissors games. They—we—discovered bugs in my reference implementation of counterfactual regret minimization and experimentally determined the conditions needed for it to converge that I had misunderstood. (Then we discovered and fixed the bugs second implementation attempt.) Max and I built the airplane as we flew it—we met Sunday and Monday to prep for Monday's class, took Tuesday off to recover, Wednesday and Thursday to prep Thursday's, and… In the end, we didn't get to AIs playing full games of poker—but we learned an incredible amount about what we needed to make to get our students there. We felt that we could do it with weekly classes over ten weeks instead of twice-weekly classes over five. I had told Max—I had told myself—that this was only going to be a part-time thing for me. But he kept showing up to work on it. And I found that I kept showing up too. In September, we tried something different with a single-day hackathon (at Fractal Tech Hub) that challenged students to write programs to play rock-paper-scissors against a series of flawed opponents (and each other). Our participants had a blast ("Felt like a mix between LeetCode and an escape room… I've never done anything like it!") but we weren't satisfied. We thought it could be so much better if we spent a few weeks improving it. A few days later, Max asked whether we could do it again at Recurse Center in about a week. We could let that be an interesting possibility—or we could decide to do it. We did it. Max found a seed-stage venture accelerator that was running a batch for games startups. Were we a VC-backable games startup? Well, what would it look like if we were? The deadline was in—oops what, less than a week? Are we really doing this? Well, we put together our best concept for what we'd do if we were building a metaphorical rocketship instead of an airplane. We were rejected. ("…transparently, it’s still a little early even for [us].") Well, what if we did it anyway? Max, bouncing between San Francisco and New York month-to-month, kept working. Could we turn our hackathon infrastructure into a daily challenge like an ultra-niche Wordle? Sure, we could make an MVP. Or, after a throwaway comment that he seized before it could float away, could we make a site that let you play poker against LLMs? He made enough of it that we couldn't not finish it, and so we did. I think that a hackathon at Minifest is the first thing that we didn't say yes to—frankly, I just couldn't keep up—but we sketched out how to launch Hold’LLM (free to watch a few "featured" tables, or you could pay to run and customize your own). Max wrote a list of the tasks we needed to launch; I helped him finish it. I got distracted; he kept plugging away. On Monday I learned that Max was dead. He had felt fatigued traveling in Senegal, with something that felt like the a terrible flu. It got suddenly and dramatically worse as he made his way to Israel. It was actually a malaria infection that had reached his brain. He was hospitalized on New Year's Day. And then he was gone. 1. Beginnings and endings2. Reflecting on death3. What's next4. Remembering Max5. Gratitude (2) When my grandfather died, I wanted to treat it as an encounter with Death, a meeting face-to-face with humanity's oldest and last enemy, one loss in the fight for a future where humans did not have to die when they weren't ready just because that was easier than staying alive. I wanted it to be part of a story that was bigger than one life ending forever because then at least it could make some sense. Even then, though, I knew that that frame was for my benefit, because the actual Man-Hyong Yoo lived a story where death wasn't a thing we could end. To him, death was a thing that we postponed while we accomplished what we could with—and for—the people who mattered to us. In that post, I quoted from Wilfred Owen's "The Next War": Oh, Death was never enemy of ours! We laughed at him, we leagued with him, old chum. No soldier's paid to kick against His powers. We laughed,—knowing that better men would come, And greater wars: when each proud fighter brags He wars on Death, for lives; not men, for flags. Max Chiswick died of malaria. Max wanted to end malaria. He worked on ending malaria. No, he wasn't a doctor or a researcher, but he gave money to GiveWell because he believed that people not dying of malaria was a thing he wanted turn his resources toward—and wanted more than anything else he could buy with those dollars—and because as a player of games he thought that GiveWell's research was the best bet he could find to put his dollars on. As I count these things, Max Chiswick warred on Death, for lives. Max cared about doing it right. After he won the Manifest charity poker tournament and so could choose which charity would get $30,000, he asked me if there was anyone who I thought could turn the dollars into more lives than GiveWell. Well, I love the work that GiveWell does, but I admitted that I have become even more excited about 1Day Sooner, and so we discussed my reasons. He went off to talk with their CEO to find out more, because if he could save more lives with those dollars, that was worth getting right. On the same day that we met in my living room and decided we'd write a course on AI poker, we agreed to set the business up as a nonprofit, because he—we—were happy to take at most modest salaries and send any windfall profits on to the charities we thought could use it best. Or rather, he had already made up his mind to do that with his share. He brought it up to see if I was on the same page and we could set up the company to work that way by design instead of as a for-profit. (In the end, we never did try to make a profit in those first six months. There were a few points where we could have shipped something to sell, but each time we thought it would be better to work a bit more towards something much bigger.) A friend, when they heard about Max's death, yelled in the kind of frustration that has nothing to point at but the whole world entire: "But I already wanted no one to die of malaria forever! I'm already doing the things it makes sense to do about it!" Yeah, that's pretty much where I am, too. The work that I put on hold every day that Max showed up with another Google Doc or feature idea or half a plan to put on an event was to make a world safe from infectious disease—as best I know how with the skills and funds and plans I have. And I don't have any better ideas for what to do about the problem except…what I was already doing before I met Max, that I put on hold for a day, a week, or a season at a time to work with him on our love of games. And so this can't exactly add to the amount that I want nobody to die of malaria, or what I'm going to do about it. I don't know if this makes me feel better or worse. (3) You're not supposed to make sudden decisions at times like these, but I know that I won't be finishing the work we had planned to do together. "I couldn't have done it without—" is a thing you're supposed to say to be gracious, but I know that I would not have stuck to the project week after week if Max didn't keep showing up. I wasn't the best collaborator—I wasn't even a good collaborator—at the end. He would reach out three times to set up a coworking session, or a strategy call, or ask if I could fix a thing on the server that had taken everything down, before I would get back with a reply, because I wasn't managing my time well and because I was too stuck in a loop of guilt and shame and avoidance to open up a conversation about what to do about it. Until two days after Christmas—five days before Max was taken to the hospital and didn't come out—when I screwed up the courage to write to him about it. I had written it a few days earlier, but didn't want to send it on Christmas. I don't know if he ever read it. Maybe I'll feel better if someone does: Happy holidays! Sorry that I've been afk. I've taken a bit of time to reflect on the projects that I have going on and, well, I have too many to be able to do them all well. I've been having a huge amount of fun with the time that I've spent on Overbet / Poker Camp / RPS things, and I'm really glad to have had that chance, but I think I just can't keep it up heading into 2025. I do continue to think the work is very cool! If you decide it makes sense to keep working on things in the space, and want to keep me in the loop, I might be excited to make occasional contributions (especially on metagame-design / experience-design things). But in that world I think it makes sense to make a hard reset from an assumption of "two equal partners" to "Max, who leads the project, plus Ross, who might or might not sometimes contribute to things". […] Obviously, this should also mean a complete reset on expectations of ownership (both economically and in terms of decision-making), starting from a default that all of it is yours and none of it is mine. I'm happy to do the work of making sure you have all of the stuff I've worked on, and catching you up so you can do with it what you want. I feel bad to have done a kind of rush-forward-then-pull-back move here, but now that we're here, I think it would be even worse in the long term to keep trying to do things while pretending that I can be an equal partner. What'''
