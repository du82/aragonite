full_description = '''Metaculus and medians 5 Aug 2022 metaculus, prediction markets h1.subtitle {font-size:1.26em; text-align:right} or, Scope-sensitive snafus in summing speculations previously: Metaculus has some issues (1) Should I expect monkeypox to be a big deal for the world? Well, fortunately, Metaculus has a pair of questions that ask users to predict how many infections and deaths there will be in 2022: 203 users(!) made 817 predictions of infections, and Metaculus helpfully aggregates those into a "community prediction" of ~248k infections. 77 users made 180 predictions of deaths, with a community prediction of 541. The y-axis is on a log scale (as are the predictors' distributions). This is a good choice! Whatever you expect the most-likely case to be, there's definitely a chance with things like this that one a misestimation or shift in one factor can make it bigger or smaller by a multiple, not just an additive amount. What's not a good choice is to report the median outcome of the aggregate position as the "community prediction". This causes a headline reported value that is way too low. Like, four to seven times too low (at least for my intended purposes). Because the predictors gave (and are scored on) probability distributions, Metaculus will happily give you an aggregate distribution, of which the 248k "community prediction" is the median scenario (the middle of the three dashed lines): However, on the same plot, the aggregate distribution predicts a 10% chance of at least 4,950k infections. If it's 10% likely to be 5 million infections, then that's already lot more concerning than the 250k in the community prediction! And when I say I'm interested in how much monkeypox to expect, I READ MORE The FDA on Fluvoxamine, round 1 17 May 2022 fluvoxamine, covid-19, fda Yesterday, the US FDA responded to a submission for Emergency Use Authorization (that was submitted 146 days earlier) for use of fluvoxamine "for the outpatient treatment of adults 24 years and older...to prevent progression to severe COVID-19 and/or hospitalization" (p. 2). The FDA's conclusion is: Due to limitations in the available clinical study results for fluvoxamine in the proposed patient population, lack of compelling in vitro and in vivo data to support the proposed [mechanism of action] of fluvoxamine for the treatment of mild COVID-19 disease, and context of increasingly available therapies with well-characterized [mechanisms of action] and consistent efficacy results in nonhospitalized patients, the FDA cannot reasonably conclude that fluvoxamine may be effective for the treatment of COVID-19. As such, FDA has determined that the criteria for issuance of an EUA are not met at this time. While the FDA has concluded that the existing clinical data are insufficient to support the issuance of an EUA, these data suggest that further clinical investigation may be warranted. (p. 24, emphasis mine) Personally, I'm disappointed. I've supported the fluvoxamine trials with my personal dollars, and directed more funding from the FTX Foundation to the same trialists for other drug trials (which I remain very, very excited about). But the most productive thing to do with that disappointment is to dig in to the FDA's reasoning in their decision, and decide what's to be done next regarding fluvoxamine. Important note: This post isn't speaking for the FTX Foundation, the TOGETHER Trial team, the fluvoxamine EUA application team, or anyone but myself in my personal capacity. The FTX Foundation has funded the TOGETHER Trial and committed to additional READ MORE'''
