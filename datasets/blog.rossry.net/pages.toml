["https://blog.rossry.net/lottery-2019-1"]
title = "2018-19 Donor Lottery Report, pt. 1"
description = "In 2019, I was selected to direct $500k of funding to the most effective charities I could find. Post 1/N discusses a grant to the Good Food Institute."
full_description = '''2018-19 Donor Lottery Report, pt. 1 13 Dec 2020 effective altruism, good food institute, donor lottery, donations This post is cross-posted to the EA Forum, where I expect comments will be much more visible than they are here. The results of the January 2019 CEA donor lottery meant that I was responsible for allocating the donor lottery's $500k funding pool. I entered the donor lottery anonymously, though I now intend to explain my grants and decision-making process publicly; I believe that transparency and open sharing of ideas is a good thing for effective altruism, and I'm glad to be able to contribute to that here. I expect that my grant recommendations from this funding pool will ultimately be made in three or four phases; this writeup is a preliminary report on phase 1, and is released simultaneously with my writeup on phase 2. The decision-making process for phase 1 was largely completed prior to February 2020, and phase-1 grants were not substantially affected by consideration of the Covid-19 pandemic (see "Adjusting for unexpected developments", below). Phase-2 decision-making began after February 2020, and phase-2 grants focused on neglected responses to the Covid-19 pandemic (see phase-2 writeup post). As of December 2020, phase-3 decision-making has not yet begun in earnest. Overall summary In phase 1, CEA accepted my recommendations for two earmarked grants to the Good Food Institute: $120k to GFI's European affiliate to support policy advocacy enabling the development and mainstream deployment of food products that replace farmed-animal products. $45k to GFI's Asia--Pacific affiliate to support market research and policy advocacy, likewise to support deployment of alternative protein products in Asia. This post has top-level sections on: my personal and philosophical background, my current high-level thoughts on different EA cause areas, some considerations for medium-size donors, analysis of the Good Food Institute, and my thinking about the GFI grants in the context of early Covid-19 pandemic developments. Personal background and preliminaries I am a trader at a quantitative trading firm and an independent research economist, currently living and working in Hong Kong. I have identified as an effective altruist since 2014. This writeup represents independent work and is not coauthored or endorsed by CEA, the organizations mentioned, or by my employer. Grantee organizations were given a week to review a draft, though final editorial decisions were mine. My initial approach (and some of the structure of this writeup) was inspired by Adam Gleave's writeup of his allocation of the January 2018 donor lottery pool. I'm grateful to Adam for his strong leading example, and I'd be glad to hold myself out as a resource for donor lottery participants and allocators in the future. Adam certainly set a high bar that I am sad not to have met myself (by my own evaluation). Philosophically, I assign comparable value to future and present lives and place significant weight on animal welfare (with medium-high uncertainty). With high uncertainty, I largely endorse the standard arguments regarding the overwhelming importance of the far future. I'm undecided but currently skeptical of the marginal approaches to influencing the far future. My personal donation writeups for 2017, 2018, 2019, and 2020 have more detail. Since I find myself in substantial agreement with the Open Philanthropy Project and similar large donors about many important ideas, I initially focused on (1) my opinions that disagree on the margin with "common consensus" and (2) on organizations whose funding gaps OpenPhil did not fill out out of concern about being too high a fraction of the organization's funding base. I began this process expecting my grant recommendations to primarily focus on far-future and EA-meta opportunities, though I did not expect to be comparatively advantaged in finding new organizations and opportunities. To generate an initial list of organizations to consider, I (1) solicited ideas from individuals I trust and (2) reviewed recent grants made by the Long-Term Future Fund and EA Meta Fund. Considerations on cause areas (I discuss my post-February-2020 thinking in a section of my phase-2 writeup.) I wrote in 2018 that I expected to direct donor lottery funds to far-future or EA-meta causes. I considered opportunities in these cause areas, but -- somewhat surprisingly -- decided to make a phase-1 grant to a different cause area (animal welfare). This section discusses some of my thinking. My preliminary review of the far-future funding environment revealed that there was a large existing pool of large donors who were relatively familiar with the large organizations in the far future space. Furthermore, I gathered that many of the effective altruists who have made recent fortunes in crypto-related enterprises are familiar with, and more positive than I am on, organizations addressing the far-future cause area. With medium confidence, I expect this latter segment of donors to grow as the crypto business environment continues to resolve. This suggests that far-future causes will see increased coverage in the coming years, by donors more familiar with the space than I am likely to become without dedicated work. Finally, I found my initial conversations about EA-meta organizations difficult for me to draw actionable conclusions from. A large part of this difficulty was due to my physical and social distance from the Bay-area- and London-based communities of EA organizations. Furthermore, most people I talked with suggested that they found it difficult to evaluate the work of EA-meta organizations in an outside-view and evidence/results-based framework. If the best options for understanding and evaluating EA-meta organizations involved inside-view qualitative assessments of their staff, principals, and qualitative effects in the community (and I did not have private information about any of the individuals or impacts), I felt at a comparative disadvantage in determining funding allocation to them. These findings led me to update to be more pessimistic about my comparative advantage at thoughtful far-future-related and EA-meta-related funding. I considered a grant to the LTF Fund or EA Meta Fund to delegate the decision to their committee members, and reviewed their recent grants to form an opinion on their marginal grant opportunities. I found these likewise difficult to thoughtfully evaluate, for largely similar reasons, and decided to broaden my consideration of cause areas slightly. I thought that animal welfare was the next-most-promising cause area to investigate. (More on that below.) On medium-sized donors Roles for medium-sized donors One of my secondary objectives in allocating the donor lottery funds was to better understand the role for "medium-sized" EA donors (where here I'm using the term to mean $100k-$1mln/year). At this scale, how should donors be spending their attention and time? What opportunities are most interesting for them to dig into? These questions have clear implications for donors with annual donations in this range, as well as donors selected in future donor lotteries. Firstly, it seems clear that there are opportunities for medium-sized donors to take a focused look at very young organizations and materially support their early operations -- see Adam Gleave's grant to ALLFED, for example. But my early forays in this direction were somewhat disappointing, as above, and I did not expect I would become sufficiently familiar with the animal welfare space to evaluate early-stage organizations there, either. However, I now believe there's also a role for medium-sized donors in working with more-established organizations, and improving the community's understanding of their work via sustained engagement. The professional evaluators and the EA funds committees do good work, but we the community would be stronger with many dozens more narrowly-informed, third-party amateurs. It takes a particular approach to do this effectively, in a way that's not mostly redundant, though. Relative opinions Say you're a medium-sized donor evaluating an elastic (i. e., exhibiting diminishing marginal returns) organization or opportunity that has already been widely considered. I claim (with medium-high confidence) that you should be primarily focused on forming relative information and opinions, rather than an absolute evaluation of the organization. This is closely related to the idea of zeroing out, by my former colleague Zvi Mowshowitz -- if other actors in the "consensus" (or, if you prefer, the market) are making reasonable decisions, but you can find one thing that they're missing, then you can do well by pushing the world a little bit in the direction implied by the thing that's "underdone". Perhaps unintuitively, this is still true if you don't have a complete model of the things that the consensus opinion is getting right -- so long as you have a better model about the relevant things that they're not. Relative opinions (example) Suppose that an organization has ten independent features, each of which can multiply its overall effectiveness by a smaller or larger number. A large group of people evaluated features 1-5, made estimates of features 6-10, and figured out how they wanted to fund the organization compared to other opportunities. Furthermore, assume that they have decided -- based on those evaluations and estimates -- that it deserves some positive amount of funding (capped at the point where diminishing returns makes the marginal project slightly worse than other marginal opportunities). Now, say that you're not at all sure about features 1-9, but you took a good look at feature 10 and you are pretty sure that everyone else's estimates missed something that suggests a higher score on it. Even if you don't know anything about features 1-5, and no one knows much about features 6-9, you can predict that the overall consensus estimate was too low, and the marginal projects of the organization are better than the marginal projects to be found elsewhere. (After all, finding a specific good thing in feature 10 isn't bad news about features 6-9, nor does it mean much about any other organizations...) So, if you're pretty sure that everyone else did miss this good thing, then funding the organization's next project will be a good move for efficiency. Relative opinions (in application) The same principle applies in less black-and-white cases -- if others have tried to evaluate all the parts of something with many complicated interacting parts, and you kinda-believe-but-aren't-completely-sure that there's something you think is more positive than your guess of what the consensus is, it's still a win for efficiency to update upwards from the consensus belief and get behind the marginal project. This only really works well if the funding allocated by "relative" analysis is sufficiently small compared to the amount that's allocated by "absolute" analysis. That said, there's still a massive potential efficiency gain from not duplicating work on analyzing the same basics yet another time, and I suspect that "sufficiently small" actually means something like 20% here. What's more, if the EAs doing such research then share their thoughts openly, they still can get rolled up into the community knowledge. All taken together, I think that specialized relative analysis is relatively underdone (recursion!) and there's still plenty of scope for it to see more play in the EA community. [ry: I'll probably write these ideas up further in a standalone post, and link it here when I do.] The Good Food Institute Summary The Good Food Institute is a US-headquartered nonprofit supporting the development and mainstream deployment of food products that replace industrially-farmed animal products. My favorite description of their work came from executive director Bruce Friedrich, who described it at a meetup event as "consigning industrial animal agriculture to the dustbin of history -- as quickly as possible". (The more-polished official tagline puts this as "creating alternative proteins that cost the same or less -- and taste the same or better -- than the products of conventional animal agriculture.") GFI's typical initiatives look like: directly providing strategic support to the alt-protein private sector, working to move conventional food companies into the sector, mobilizing research scientists to fill identified gaps in the field of alternative protein technology, working to direct governmental, academic, and institutional funding towards open-access research in relevant fields, or targeted lobbying against government policies that would restrain commercial adoption of alternative proteins. Globally, GFI cooperates with a network of regional affiliates (currently, in Asia--Pacific, Brazil, Europe, India, and Israel), organizational teams who operate on-the-ground in their respective regions but work together closely for global initiatives. Approximately 58% of GFI staff are US- based, with the remaining 42% working for a non-US regional affiliate. (US-based staff also support the international affiliates on projects of international scope.) GFI has been an Animal Charity Evaluators "top charity" five consecutive times since year-end 2016 (having officially launched in February 2016). Despite their high profile, I believe that they still have substantial room to deploy additional funding -- particularly in expanding operations outside the US to address opportunities that seem to me to be particularly neglected. In particular, I believe that this room for additional funding exceeds ACE's recommendations. My perspective In the framework of "Relative opinions" above, I consider GFI to be a highly-rated organization that's nevertheless underrated by ACE and the animal-welfare EA consensus in important ways. (Because I am evaluating GFI as an underdone opportunity that's elsewhere highly-regarded, this section will look different than, say, Adam Gleaves's from-zero-baseline review of ALLFED in his 2017 donor lottery report.) The primary mistake that I think the consensus evaluation makes regarding GFI: I expect the effective altruists most interested in animal welfare overestimate how compelling non-EAs will find moral suasion that assumes that animal suffering matters. To be clear, I do think that animal suffering matters and that such an approach can be effective -- but I believe the consensus of donors funding animal-welfare organizations will (on average) overestimate its effectiveness in, say, the harder-to-reach half of the general population. Most people are, in general, bad at modeling people not like them, and furthermore bad at understanding how bad they are at modeling people not like them. By contrast, GFI's theory of change does not require that moral suasion will be effective in changing opinions regarding farmed animal produ'''
year_published = 2020
year_updated = 2024
