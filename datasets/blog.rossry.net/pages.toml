full_description = '''When each proud fighter brags 11 Jan 2025 death, eulogy, effective altruism, game theory content warning: As heavy as this blog gets. (1) I met Max Chiswick in June of 2024 because I wrote something wrong on the internet. He tracked me down at Manifest to tell me so—I had written about the shortcomings of poker as a teaching tool, but I had made several wrong assumptions about how one would play poker differently with the goal of learning instead of recreation. First, you'd play with two players instead of eight. We nearly always play with eight-ish players because we want a relaxing game, where large gaps in the action are considered a feature. With two players, though, not only is it your turn four times as often, but more of your decisions are "live" because it's correct to play more (initial) hands and there are fewer that you should fold on sight. Second, you'd play a game with fewer chips—meaning that you'd make bets in coarser increments and with a smaller ratio of largest-possible bet to smallest-possible bet. This makes the decision tree shallower and more amenable to explicit case-by-case reasoning, and it also has the nice effect of making the highest-stakes decisions less terrifying (while keeping the stakes of bread-and-butter decisions suitably meaningful). But most importantly, if you're playing poker as an exercise for training your mind, you should focus less on becoming a theoretically-optimal robot. You can read books and blogs about "game theory optimal" play (e.g., Nash equilibrium) and drill yourself to get arbitrarily accurate at executing it, but that's simply not the useful part. The part of poker that makes you smarter—Max explained to me—is observing the non-optimal patterns in your opponents' play, and READ MORE A Verse for Commencement Day 25 May 2016 death, verse for, memoriam O Captain! my Captain! our fearful trip is done, The ship has weather’d every rack, the prize we sought is won, The port is near, the bells I hear, the people all exulting, While follow eyes the steady keel, the vessel grim and daring; But O heart! heart! heart! O the bleeding drops of red, Where on the deck my Captain lies, Fallen cold and dead. O Captain! my Captain! rise up and hear the bells; Rise up—for you the flag is flung—for you the bugle trills, For you bouquets and ribbon’d wreaths—for you the shores a-crowding, For you they call, the swaying mass, their eager faces turning; Here Captain! dear father! This arm beneath your head! It is some dream that on the deck, You’ve fallen cold and dead. My Captain does not answer, his lips are pale and still, My father does not feel my arm, he has no pulse nor will, The ship is anchor’d safe and sound, its voyage closed and done, From fearful trip the victor ship comes in with object won; Exult O shores, and ring O bells! But I with mournful tread, Walk the deck my Captain lies, Fallen cold and dead. READ MORE'''
