title = "A Stroll in a Strawberry Field cocktail"
description = "A Stroll in a Strawberry Field cocktail § 1oz bourbon whiskey 1oz dry vermouth 1oz Gentian Amaro 1oz strawberry syrup Build over a large ice ball. Garnish with a lemon twist."
full_description = "A Stroll in a Strawberry Field cocktail § 1oz bourbon whiskey 1oz dry vermouth 1oz Gentian Amaro 1oz strawberry syrup Build over a large ice ball. Garnish with a lemon twist. Also works well with rye whiskey. Fresh variant § Substitute muddled strawberries for some/all of the syrup. Variant § Replace the Gentian Amaro with equal parts yellow chartreuse and St Agrestis Amaro. Bitter variant 1 § Substitute ¼oz of the Gentian Amaro for St Agrestis Amaro. (Maybe even more?) Bitter variant 2 § Add several dashes of Angostura bitters. Strawberries like ango. Gin variant § Swap out bourbon for gin, add orange bitters. “Possibly better” Gin variant 2 § Gin, lemon bitters. Garnish with a twist of lemon, expressed over the cocktail. Better bourbon variant § Bourbon, Ango, use Punt e Mes instead of dry vermouth, lemon twist Alcoholic Ribena - Triple berry variant § Gin, use blackcurrant liqueur instead of vermouth, orange bitters. Serve over an ice ball, with a cherry."
