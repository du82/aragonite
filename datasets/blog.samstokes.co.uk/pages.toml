["https://blog.samstokes.co.uk/2010/07/04/vim-wizardry-1"]
title = "Vim wizardry #1 | Five Eights"
description = "(I wrote this as a response to an Ask Hacker News post about learning Vim, but I thought it deserved a life of its own.) This is one of my favourite Vim features. Say you have the following code: do_something_with(some + long * complicated * expression) ^ Say your cursor is where the caret indicates. Typing ci) (“change inside parens”) in normal mode will: delete all the text between the two matching parens place you in insert mode with the cursor between the two (now adjacent) parens put the deleted text in the yank buffer so that p will paste it. The use case here is obviously so you can assign a name to that long complicated expression. ci) is much easier than selecting it with the mouse, and keeps your hands on the keyboard where they belong ;)"
full_description = '''Vim wizardry #1 Jul 4, 2010 (I wrote this as a response to an Ask Hacker News post about learning Vim, but I thought it deserved a life of its own.) This is one of my favourite Vim features. Say you have the following code: do_something_with(some + long * complicated * expression) ^ Say your cursor is where the caret indicates. Typing ci) (“change inside parens”) in normal mode will: delete all the text between the two matching parens place you in insert mode with the cursor between the two (now adjacent) parens put the deleted text in the yank buffer so that p will paste it. The use case here is obviously so you can assign a name to that long complicated expression. ci) is much easier than selecting it with the mouse, and keeps your hands on the keyboard where they belong ;) With nested parentheses, it does what you expect (affects the text contained by the innermost matching pair to contain your cursor - try it and see). Other equally useful variants: i" - “inside double quotes” - everything between double quotes i' - “inside single quotes” iw - “inside word” - the word the cursor is on is - “inside sentence” - great for editing prose ip - “inside paragraph” There are also similar motions beginning with “a”: a) - like i) but includes the parens (e.g. da) deletes everything inside parens and the parens themselves) a" - similarly aw - like iw but includes trailing whitespace. For another great taste that goes great with this, see the surround.vim plugin. To whet your appetite: six keystrokes to wrap your current selection in <div> tags; four to change a string from “double-quoted” to ‘single-quoted’. Comments (archived) Comments are disabled, but please feel free to reach out on social media if you'd like to discuss this post! Comments from a previous URL for this post (which now redirects here): Ah very nice, I never used the i modifier, always w, $, or f. Adding it to my repertoire. – Andrey Petrov at Sun, 04 Jul 2010 03:46:47 +0000 That's so wizard. Thank you! – shreyans at Wed, 15 Jun 2011 15:04:21 +0000 I had learned this a long time ago, thought it was great, forgot the command, and didn't even remember how to look it up. Thanks! – Dan Tasse at Mon, 18 Jul 2011 18:40:31 +0000 This was awesome. Thanks..Still waiting for #2 – Vidit at Sun, 21 Jul 2013 18:35:24 +0000'''
