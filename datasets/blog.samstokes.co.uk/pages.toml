["https://blog.samstokes.co.uk/2010/08/01/inception-isnt-science-fiction-spoilers"]
title = "Inception isn’t science fiction (spoilers!) | Five Eights"
description = "This is an insightful analysis of Inception, but I think it doesn’t go far enough. Spoilers below"
full_description = '''Inception isn't science fiction (spoilers!) Aug 1, 2010 This is an insightful analysis of Inception, but I think it doesn’t go far enough. Spoilers below Hal’s interpretation of Inception's ambiguous ending is that the whole film is Cobb's dream, and that the titular “inception” is convincing Cobb that he has to move past his guilt (“Non, je ne regrette rien”). He suggests that in the true reality, which we never see in the film, Ariadne attempts to perform this inception on Cobb, with presumably therapeutic motivations. I think if you take this interpretation a little further, you get a much more satisfying answer. The whole premise of the film is a technology which allows a sleeping person to enter another’s dream and interact with them. The dream-sharing technology is given a hasty introduction halfway through the film (“the military developed it for combat training”) and never explained. There’s nothing wrong with that - plenty of science fiction movies depend on some hokey tech to make their cool settings or plotlines possible - but to me it does stick out as an oddity. All the other fantastic elements of Inception - zero-gee fistfights, tops that spin forever, bending Paris in on itself - take place in dreams, so we don’t think to question them. Like science fiction films, dreams often take place in the context of some absurd premise which you accept as perfectly natural and obvious. You’ve got to get somewhere, but you’re on the wrong train, and you’re going to be late - only when you wake up do you realise you don’t even remember where you needed to go. Or you can fly and shoot lasers from your hands, and of course you can, because how else could you save the world from the evil killer wasps? Fantasy in dreams is normal, familiar and obvious during the dream, and fantastic only when you wake up. But Inception asks us to suspend disbelief that dream-sharing is possible. Wait a second… If the whole film is Cobb’s dream, then the one piece of science fiction, the nebulous dream-sharing technology, on which the whole plot depends but is never properly explained… is just part of the dream! Inception isn’t a science fiction adventure where people can invade each other’s dreams and plant secrets in their minds. It’s a chronicle of Cobb’s dream, which is a science fiction adventure. Dream-sharing, extractors, architects, the sinister corporation chasing him - they don’t have to actually exist, because they’re all figments of Cobb’s imagination! So, my own interpretation of Inception: Cobb’s flashbacks of his kids and of his wife’s life and death are idealised glimpses of the real real world, which we don’t otherwise see in the film. He has very real issues to deal with. He’s also apparently been watching The Matrix a lot, because when he dreams, his subconscious chooses to frame his issues in an epic struggle against faceless oppression with reality-bending special effects. Sure, it’s elaborate and intricate even by dream standards, but Cobb’s really messed up. The “inception team” - Ariadne, Arthur, Saito and the rest - are simply projections of Cobb’s subconscious; their purpose is to force him to confront those aspects of his memories and emotions he can’t face up to while awake. His revelation in the cottage on top of the skyscraper is real: that clinging to his guilt is what is keeping him from his children. That’s the climax of the movie because that’s where his subconscious was trying to get him all along. Cobb is performing inception on himself. If you’re not yet convinced that all the characters are simply created by Cobb’s unconscious mind, look at Ariadne - named for the woman who gave Theseus the tools he needed to slay the dreaded Minotaur, and then escape from the Labyrinth that is its lair. The first thing Cobb asks of her is to design a maze which he can’t find his way out of: he must surround his guilt - the Minotaur - in a Labyrinth before he can slay it. She leads him to the confrontation, gives him the strength to win, then shows him the way back out. This interpretation feels pretty satisfying to me. It doesn’t seem to have any holes. Anything is possible in a dream, and indeed noticing strange inconsistencies and inaccuracies after you “wake up” (leave the cinema) is a familiar feeling. And the way the film both refers to and represents itself is a hallmark of Nolan’s films: see for example The Prestige, which illustrates the mystery and allure of stage magic by performing an elaborate feat of misdirection on the viewer, who - Nolan asserts - “wants to be fooled”. Dreams are so powerful because we fool ourselves. Tell me why I’m wrong in the comments. Spoiler photo credit: charlo.be on Flickr Comments (archived) Comments are disabled, but please feel free to reach out on social media if you'd like to discuss this post! Comments from a previous URL for this post (which now redirects here): what is it about blogs that make people, like this blog poster, think that stating the most obvious, superficial, grade-school-level psuedo-analysis is something that intelligent people would want to read. "It might all be Cobb's dream". Well no sh*t Sherlock, thanks a lot Captain Obvious! – Obvious at Mon, 02 Aug 2010 01:27:20 +0000 Speaking of people w/ issues; "Obvious" seems to have the "omg i'm so much smarter than everyone so i'm going to post negative comments on seemingly random blog posts and tell everyone about how much smarter i am than them" complex. It's a real complex. I'm glad I don't have that complex.But seriously, very cool take on the film. I glad I read it, because I apparently wasn't "smart enough" to get it the first time ;) Thanks. – Alex Sharp at Mon, 02 Aug 2010 06:20:47 +0000 I couldn't disagree more with the "Obvious" commenter.Fantastic insight, Sam. – Kenneth Reitz at Mon, 02 Aug 2010 02:44:13 +0000 Very interesting deduction... and not at all obvious an interpretation – Sid at Mon, 02 Aug 2010 03:01:01 +0000 You can say for every movie ever created. "grade-school pseudo-analysis"? Hardly. More like kindergarden – Guest at Mon, 02 Aug 2010 03:28:28 +0000 cobb has a wedding ring when he's awake. he doesn't when he's dreaming. why the inconsistency if he's dreaming up the whole thing?also, agree on the previous comments. – THC at Mon, 02 Aug 2010 03:30:34 +0000 It's obvious in the sense that the final scene of the film is intended to make this a possible interpretation. The problem is that you want to examine A, B, C, or D as possible conclusions and not A, B, C, D, and any other letter you can imagine as a single, ambiguous solution; you want to be fooled. You want to believe that your conclusion can be correct because you're a human and you're innately programmed to recognize patterns; to see concrete, linear, or narrative structures or to impose structures where there are none.The problem with this conclusion... the hole I must expose is not any observation being made, but the underlying assumptions. This argument lies on an assumption that is inconsistent with its logic. The author of this article argues for a “true” or a “real” reality; a tangible, measureable, definable existence that is the end of the line and the truest form of consciousness; distinct from the “untrue” reality of the dream. Unfortunately, this is not the case. Being as we are never shown a ‘reality’ in the film which exhibits physical laws identical to our own, we cannot factually come to the conclusion that this interpretation is the only correct interpretation or even that it indeed exists… which I will elaborate upon.Recall the scene when Ariadne produces the two mirrors facing one another, creating the appearance of infinite regress.While this only an example of an optical infinite regress, it's presence in the film is no coincidence; it hints at the concept of consciousness as an infinite regress. In a dream, it feels real. In what we term ‘reality,’ it feels real. In these two individual cases (and this is an argument made in the film), it boils down to the fact that you cannot distinguish them from one another. Reality is experiential, metaphorical in the sense that we are only able to observe and interpret symbols. We can then conceptualize these symbols, or convert them into a system of knowledge (read: language, or via a system of symbols) in order to impose structure and determine how we experience them; thus, neural correlates are produced. Due to the very logic used to employ this argument, infinite regress of the consciousness is an invariable result. Any proposition requires a justification and any justification requires a support; in essence, you can never prove that anything is ever absolutely true. In other words, its turtles all the way down. In consciousness, an infinite number of realities can exist – thus, it is entirely plausible that the ‘dream within a dream’ continues forever; that there is no “real reality,” as you posit… and the grand finale!You are not exactly wrong. But you do not provide the best possible answer, which is that there is no best possible answer; in what constitutes a logical paradox (and ignoring intentionality, although I believe and hope this is the intention in Nolan’s Inception, which I find brilliantly constructed in order to do so), any and every plausible answer resting upon facts drawn from the film is equally valid.According to this argument, any proposition requires a justification. However, any justifica – Infinite Regression at Mon, 02 Aug 2010 04:02:11 +0000 Stop writing intellectual .. It's to obvious.. Just write.. Nobody writes or speaks like this.. Please.. – Tony at Tue, 07 Aug 2012 19:12:27 +0000 I appreciate your viewpoint as I hadn't thought of like that before, but that's because, in my opinion, it is very obvious that the top is about to fall over in the end. Your interpretation is entirely based on (or rather originates from) this event. – plusjade at Mon, 02 Aug 2010 04:05:42 +0000 And, because I'm lazy, here's an excerpt from Wikipedia on Pragmatism in regard to the Regress argument:The pragmatist philosopher William James suggests that, ultimately, everyone settles at some level of explanation based on one’s personal preferences that fit the particular individual's psychological needs. People select whatever level of explanation fits their needs, and things other than logic and reason determine those needs.It shouldn't be hard to draw a strong parallel to the film's conclusion, but here you go: he accepts the reality; the 'level of explanation' (or experience, in his case) that fits his needs. Logic and reason need not apply. – Same guy at Mon, 02 Aug 2010 04:06:48 +0000 Although jade has limited English and an even greater want of a singular, 'correct' answer, illuminating my previous argument. Let's say the spinning top did fall. The only fact that event would add to our possible interpretations is that Cobb has returned to the reality that we, as a whole, accept. It would make us feel comfortable in our assumptions. The top was left spinning with either possibility in order to force the viewer to question his or her conclusions, to prevent you from being lulled into that comfortable (limbo?) state. You want the singular, structural answer you can never have. – Infinite Regression at Mon, 02 Aug 2010 04:14:51 +0000 uh oh, no need to flatter yourself. I was replying to O.P.I missed an "it", therefore I cannot speak English?Cheer up buddy, we can all have our own opinions and yet... still exist! Bye bye. – plusjade at Mon, 02 Aug 2010 04:41:31 +0000 Oh, I knew you weren't speaking to me. I used your statement, which was possibly one of the "most-wrong" outcomes, further placating my desire to ridicule your typology. You missed an "it" in a key location, thus altering the context from which to interpret your language capabilities. Furthermore, if you had read what I posted, or understood it for that matter, you would understand that I argued for equal validity in all opinions - except, in this case, as a single matrix of answers and not as individually, exclusively correct answers.And do we really exist? Hahaha, that's a pretty bold assertion. Feeling a bit infallible, are we? (That last 'we' was condescending and not literal, for reference.) – Same guy at Mon, 02 Aug 2010 04:47:07 +0000 Wow, this guy needs to lighten up and pull the stick out. – Stan at Mon, 02 Aug 2010 08:58:35 +0000 Scratch the "although." – Same guy at Mon, 02 Aug 2010 04:15:15 +0000 The Ending = A great way to end a movie when you expect there may be a sequel. :-) – Rcavezza at Mon, 02 Aug 2010 04:29:25 +0000 Through the movie Cobb's in your dream which is this world. Planting the idea that it's not reality. Suicide is the only escape. Good luck. – Anomymous at Mon, 02 Aug 2010 08:13:15 +0000 Thanks for all the discussion! If you found my post interesting (or indeed if you found it obvious and uninteresting and want those 15 minutes of your life back) you might like this analysis, which goes a bit deeper into the message of the film than I did: http://chud.com/articles/ar... – Sam Stokes at Mon, 02 Aug 2010 10:20:35 +0000 Given the whole story was a dream (and I happen to agree with Sam), we have here possibly an identical Matrix twin.Cobb = Neo after the realization he's in matrix.In the sequel, Cobb is harvested for energy by an electricity company :) (as Neo was by the machines). – me at Mon, 02 Aug 2010 14:42:41 +0000 Actually, she does not ask him to design a maze he can not find a way out of.He asks her to design a maze that will take him 2 minutes to solve. – another 1 at Tue, 03 Aug 2010 09:25:22 +0000 I just have one thing to say. You've all neglected to spot an important detail: The spinning top that is spinning on the table of the cottage in the closing shot ACTUALLY starts to topple before the scene cuts. So does this mean a) The whole film wasn't Cobb's dream and we do indeed see reality, or b) The whole film was Cobb's dream and Nolan is simply playing with his audience, or c) Nolan's editing is crap. Can anyone offer me an insight? – forgotten dream at Fri, 11 Mar 2011 17:53:24 +0000 wow people really like to try and show off how much smarter they are then other random people they dont know and probably will never meet in there posts – Kirkstromgren at Sat, 26 May 2012 23:14:38 +0000 i thought it was a cool look at a awesome movie tho thanks – Kirkstromgren at Sat, 26 May 2012 23:15:26 +0000'''
