full_description = "About I’m Sam Stokes. I’m a British American immigrant, software engineer, and amateur mixologist. I live in San Francisco with my wife and two cats. This blog may contain musings about: feedback loops, distributed systems, board games, cocktails, mindfulness, empathy, music. For even more unpolished musings, I publish some of my notes, recipes and similar as a digital garden. I’d love to hear from you about anything I wrote! My blog doesn’t have comments, but please feel free to reach out by any of the means listed below. What does “Five Eights” mean anyway? Well, it’s almost as good as five nines, right?"
