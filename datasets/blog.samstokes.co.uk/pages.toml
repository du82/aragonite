["https://blog.samstokes.co.uk/garden"]
title = "Sam's Garden"
description = "Welcome to Sam’s garden § Along with my blog, Five Eights, this is a part of my little corner of the internet. It’s an experiment in “remembering in public”, and a home for unfinished thoughts, side projects, and random facts I found interesting."
full_description = "Welcome to Sam’s garden § Along with my blog, Five Eights, this is a part of my little corner of the internet. It’s an experiment in “remembering in public”, and a home for unfinished thoughts, side projects, and random facts I found interesting. As a digital garden, it will always be a work in progress, so please pardon my dust. I’d love to hear from you about anything written here! Ways to browse § You might be interested in: original1 cocktail recipes comparative gin tasting notes surprising facts about bananas simple experiments with generative art If you’re viewing on a desktop browser, there’s a nifty Explorer widget listing all the pages. Unfortunately it doesn’t show up in the mobile layout. The search bar does work on mobile. Footnotes § Cocktails have been around for a couple of hundred years (estimates vary) and most cocktail recipes are simple variations of other recipes, with an ingredient substituted or proportions tweaked. This means parallel evolution is extremely likely, and any recipe will have been “invented” multiple times by different people. (In fact, many classic cocktails like the Manhattan and Martini have many competing and equally apocryphal origin stories!) So my cocktails are “original” in the sense that I didn’t follow a recipe when first making them, but I don’t claim that they are novel. ↩"
