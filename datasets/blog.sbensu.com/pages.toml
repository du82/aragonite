["https://blog.sbensu.com/posts/team-oriented-vs-outcome-oriented"]
title = "sbensu: Team-oriented, outcome-oriented"
description = "Some people care about helping their team. Others care about achieving outcomes. It is important to know who is who."
full_description = '''Team-oriented, outcome-oriented March 2023 Maybe the real treasure was the friends we made along the way. No, I want my fucking gold. In my career, I’ve found two different ways1 in which people are motivated:Team-oriented people care about helping their team.Outcome-oriented people care about achieiving outcomes.The distinction is easy to see when playing games with friends:Most are team-oriented. The game is a fun excuse to hang out, any game would do.But a couple will be outcome-oriented. They want to play the game and win.This distinction is also present at work but it is much harder to notice. Work is a much larger part of our life and there are many reasons to do it: make money, achieve certain outcomes, etc. Nobody explicitly thinks "I am here to hang out with my work friends". But when you drill down, you find out that a large part of people's motivation is effectively, to hang out with their work friends.Some disclaimers on this dichotomy:Like all ways of classifying people this is not a rule or a “true category” but rather a fairly bimodal spectrum.It is also context-specific: the outcome-oriented at work may be team-oriented when playing games on Friday night.I am drawing this distinction to identify what motivates people, which is correlated but not totally determinant of how they act.Team-orientedTeam-oriented people want to help the team they are part of. When you meet them, they ask you how you are doing. They want to know you as a person and they want you to be happy and fulfilled. They make you feel like you belong.In the best case, team-oriented people understand that it is easier to get things done if everybody gets along. They know to invest in relationship, communication, education, and anything else needed for others to do their best work.In the worst case, team-oriented people think first about what the team needs and then change the outcomes accordingly. The outcome becomes an instrument to help the team. An engineer may want to prioritize a project to save the team tedious work, even if there are other projects that are much more important for customers.Outcome-orientedOutcome-oriented people want to achieve something in the world. They rarely smalltalk and end the conversation quickly to get back to whatever else they were doing. Working with them is exciting and a little bit stressful.Outcome-oriented people think first about what they want to accomplish in the world and then change everything else, including the team, to do that. For example, if they realize that a sub-team is not contributing to revenue, they will conclude the sub-team is not needed anymore.Managers: leaders vs coachesManagers serve two roles2:Coaches help their reports improve their skills and advance their career.Leaders set goals and guide the team to achieve the outcomes.Correspondingly:Team-oriented managers are usually stronger coaches than leaders.Outcome-oriented managers are usually stronger leaders than coachesFrom experience, I’ve learned that the leader and coach roles are better done by two separate people. You need a certain objectiveness and detachment to make good decisions as a leader. For example, deciding that project is a dead-end and should be discarded is always hard. But it is even harder if you are viewing it through the lens of "what will it do to the person working on it?", which is what you need to do as a coach. When I've had to fill both roles myself, I split them into two separate days:Monday project meetings: as a leader, I am checking how the project is going. Problems are resolved quickly and there is no room for personal discussion.Friday one-on-ones: as a coach, I want to know how your week went. Did you hit any problems? Are you learning from the work? What should we change?Managers have to think at the team level, so team-oriented people are disproportionally attracted to management. In a large company, this means that most of your managers are coaches, not leaders. Such a skew will make the company a great place for employees to work and improve their skills (good for retention) but it might lead to institutional decay. Institutional decay: looking only inwardsWe can distinguish between a company and a business:Company: the people working together on a business.Business: the system doing something for the world.If every manager is team-oriented, the company won't always necessary work on the goals of the business3.It is not necessarily bad for these two to diverge. The company behind the Petroleum Fund of Norway could rebrand as the Norwegian Energy Fund and reinvest all profits into sustainable energy. This is bad for the oil business. But we can still consider this divergence as a net positive. After all, the system is there to serve people.But in general, when all management is team-oriented we get principal-agent problems and institutional decay4. People's overriding incentives are "inside" the company: having happy colleagues, providing for themselves and their family, having a good career. These are not only good incentives to have but they are impossible to ignore. The problem is when they become the sole incentives driving the company.Somebody in management must be looking outwards for what the business needs; customers, suppliers, competitors, regulators are all outside of the company. It is hard work to constantly re-align what the company internally wants with that the business externally wants5. If nobody does it, the company's inward incentives take over and the business eventually dies, leaving everybody without a job.DRIs decouple management from leadershipAssigning a Direct Responsible Individual (DRI) to every project is a way to decouple “who is the leader” from “who is the manager”. This is a step in the right direction but it is only effective if the DRI is outcome-oriented. As such, I encourage teams to have individual contributors (i.e. not managers) as project DRIs. Statistically speaking, individual contributors are more likely to be outcome-oriented than managers.When the outcome-oriented become managersWorking with others is often the best way to accomplish ambitious goals. Team-oriented people naturally understand this. The outcome-oriented sometimes fail to see it and remain lone wolves their entire careers.Eventually, some of them realize how much more they can get done with a good team. Working with a report, you can achieve 10x more than what you put in: 4 hours a week of your indirect management work 6 for 40 hours from their direct work. A 5 person team can do 200 hours a week, much more than what the manager can do by themselves7.The Score Takes Care of Itself is a great account of somebody outcome-oriented, internalizing how a large group of people can do great things, and acting accordingly. Notice the title is about the "score" even though the book is about the team. I see this as the prime example of somebody motivated by outcomes but choosing to act exclusively through the team.For the outcome-oriented, the transition into management is often very hard time:They don't enjoy the day-to-day of talking to people.They feel like they are not doing anything.Talking to people is the job, and a fun puzzle"Why do I need so many meetings? Why do I need to help my reports with X? Can't they figure it out themselves and just do it?". The outcome-oriented don't necessarily enjoy the day-to-day of management and that wears on them.Reading Bob Iger's biography, it is remarkable how much of his career boiled down to understanding others. He starts several chapters describing a thorny problem, figuring out the people behind it, and then the aha moment when he figured out what incentivized those people. Once he understood the incentives, the resolution is obvious and swift. Clearly, Bob learned to treat people as a puzzle. This is important because, as a friend puts it, when you have enough people all problems are people problems.Treating people as a puzzle does two things:It lets you enjoy dealing with peopleIt sometimes defuses the emotional charge people problems come withIf you fail at this, you can always play Pavlovian games on yourself, as the next section suggests.Delayed gratificationAfter their first week as managers, the outcome-oriented complain: "I didn't do anything this week!". The problem is delayed gratification:As an individual contributor, you get dopamine daily. For example, when you are programming, you work hard for an hour, and when something works, you get a dopamine hit. The feedback loop is tight; the link between the work and the dopamine is clear.As a manager, you rarely get dopamine. You spend an entire week talking to people which doesn't feel important. Many days later, somebody tells you how everything you wanted is done. At that moment, you get this seemingly random reward.My advice is to:Consider the team’s output as their own so that they feel like they did accomplished things even thought somebody else in the team did the literal work.Associate the incoming dopamine with the entire week of talking to people. The next week, as you talk with people, remind yourself how cool it will be when they come back and everything is done.Founders are the first victimFounders are usually outcome-oriented (they achieved the outcome when there was no team) and as such, they often struggle with management too. They hire other outcome-oriented people as executives, which also struggle with management. Thus, in young startups, the higher up you go up the ladder, the worse managers / coaches people are.Identifying motivationsIn interviewsIf you know how to listen, people tell you right away what motivates them.During interviews, team-oriented people will ask and say:How many people are there in the team? What is the composition of the team?How do people get along? What are the norms?How would I fit in the team?We had a great crew and a lot of fun working on that projectNo, it was a bad experience: we didn't get alongOutcome-oriented people will ask and say:What are you trying to accomplish? Why?What happens if you succeed? What happens if you fail?How can I contribute?That was a failure, we got nowhereWe knocked it out of the park, we got to $X ARR after a year!In different phases of a projectIn the beginning of a project, you only have a goal and no team: so you mostly need outcome-oriented people. As soon as you need to scale the team, you need more team-oriented people. To launch a project, an outcome-oriented person will set a deadline and work “unsustainably” until the launch. As soon as they launch, they might take a break and work more slowly while they prepare for the next outcome. This makes for an uneven see-saw pattern of work. As such, you want to start High Variance projects with a larger proportion of outcome-oriented people.Team-oriented people care more about their work being long-term sustainable: otherwise they will not be able to stick around and work with the team! This working-style matches longer but less intense projects.In different departmentsThere are certain roles and functions that are fundamentally focused on the team, like HR and education. As such, team-oriented people gravitate to them. On the other hand, in more individual roles like sales you get the opposite selection-effect.Finding the right balanceIf you have too many outcome-oriented people, it is unlikely that you’ll have a cohesive, coordinated group operating well. In the extreme case, the team doesn’t function beyond a few members and never achieves the outcomes it intended. Important work is often only prioritized by the team-oriented:Understanding what people need to know to do their job and unblocking themCommunicating what’s going onMaking sure the right people collaborateBut this failure mode rarely happens in big companies. Big companies strongly select for team-oriented people because:They attract those that want to work with lots of people.Their interviews explicitly ask for experience working with large groups, interpersonal skills, a high degree of empathy, agreeableness, which are all correlated with being team-oriented.They reward getting along with the group and select out disagreeable outcome-oriented people.In my experience in a big company, you end up getting 5 team-oriented per 1 outcome-oriented.When you have too many team-oriented people, it is hard to set goals and achieve outcomes:Slow-start: It gets harder to set goals in the first place. If everybody is looking to everybody else for what the goal should be, you get infinite recursion. It is easy to get stuck in “planning” and “strategy” indefinitely.Zig-zag: It is unlikely that you’ll stick to the same goal for long. If achieving a certain result is causing problems for the team (as it often does!), it is always easier to change the goal than the team. In the extreme case, the team stops serving their original purpose and devolves into serving itself as described in the institutional decay section above.Meetings and "alignment": The team spends more time in meetings, even if they are not necessarily productive or move outcomes forward. “Being aligned” feels good and meetings help with it.Meta-work: The team spends more time talking about how we work than actually doing whatever work is needed. Improving the team always feels more high leverage than doing any single task even when it is not8.Over time, having too many of either side generates conflict:If there are too many team-oriented people, the outcome-oriented get impatient as the meetings pile up and meta-work takes over.If there are too many outcome-oriented people, nobody on the team feels like their needs are met: they are not learning, spending time getting to know each other, etc. Outcome-oriented people also have some of these needs (e.g. being coached) and need team-oriented people around.Finally, I’ve found that pointing out the dichotomy itself helps people recognize what is going on when certain tensions arise. For example, if an outcome-oriented person gets impatient with the length of a meeting, this dichotomy helps them seem how others have different needs and how the meeting contributes to meeting those needs. And if a team-oriented person feels the deadline is unnecessary or forced, you can explain how the deadline helps the team focus on the outcome. This dichotomy serves a similar purpose to the big five personality traits9 or Myers-Briggs in that it’ll help you understand your team better. Please don't take it too seriously: it is just another sign to add to your corporate horoscope. Thanks to Devon Zuegel for reading early drafts and providing feedback. Special thanks to Bryan Irace for teaching me much about the subject and contributing important ideas to the essay.FootnotesClaire Hughes Johnson makes a similar distinction in Scaling People: “task-oriented” vs “people-oriented”. From my reading of it, it is roughly the same distinction (but that doesn't mean she would agree with the conclusions in this p'''
year_published = 2025
clearnet = "https://blog.sbensu.com/posts/team-oriented-vs-outcome-oriented"
tags = ['"alignment"', "achieve", "always", "balance", "become", "between", "business", "care", "case,", "certain"]
language = "en"
internal-references = ["none"]
external-references = ["amazon.com", "aws.amazon.com", "bam.kalzumeus.com", "benn.substack.com", "bostonfed.org", "candyjapan.com", "en.wikipedia.org", "infobae.com", "javacodegeeks.com", "johnloeber.com", "jooq.org", "networkworld.com", "notes.andymatuschak.org", "signal.org", "slatestarcodex.com", "songexploder.net", "thezvi.substack.com", "thezvi.wordpress.com", "tiktok.com", "yew.rs"]

["https://blog.sbensu.com/posts/api-avoid-breaking-changes"]
title = "sbensu: How to avoid breaking APIs"
description = "The main trick is to design them with extension in mind so that you won't have to break them later."
full_description = '''How to avoid breaking APIs March 2023 When writing graphical user interfaces, the end user is a person. If the user interface changes overnight, the user might be surprised but they can adapt and react accordingly. Most software companies are used to changing their products often in various ways. API products don’t have this luxury.APIs are used by programs which can’t adapt to change. So, whenever you change an API, the change should be backwards compatible so that the new API version can be used by existing integrations. For a list of breaking changes one can make to JSON APIs, see Breaking changes in JSON APIs.In other words, certain decisions are much harder to reverse than others. This changes how API products are developed: when it comes to APIs, it is much higher to ship fast and iterate. And in many cases you can’t really iterate.Hyrum’s lawFrom Hyrum’s law which has (and deserves!) its own website: With a sufficient number of users of an API, it does not matter what you promise in the contract: all observable behaviors of your system will be depended on by somebody. In other words, your API “leaks” promises of how it will behave. For these “hidden” promises, you should define an explicit contract and track those changes as backwards-incompatible. Otherwise, you risk breaking your users' integrations without realizing. There are probably domain-specific "promises" that apply to your API that I can’t cover in this essay. Think about them as you design your API. Here are some hidden promises that a payment API might make:Settlement speed: Money will be available at certain times in certain accounts. In test mode, the payment might clear into the developer’s balance immediately. But in live mode, it would take 5 minutes for the balance to be there because it was handled by some queue. The integration may assume that clearing is immediate because it was immediate during testing. Stripe’s ACH v1 had this problem.FX quote expiry: If someone wants to convert USD to EUR, your API gives them a quote that defines a rate between the two. That quote is available until an expiry time, for example "next 30 minutes". If you shorten that time, integrations that rely on having 30 minutes to react to the quote will break.Dynamic properties: If a property like description is dynamically generated from other data, like {{PRODUCT}} ${{AMOUNT}}, developers will parse out PRODUCT and AMOUNT from it. Later, when you change how description is generated and add QUANTITY to the string, you might break their parsing logic. This also applies to error messages.Async properties: Returning a property asynchronously when it was previously returned synchronously is a breaking change. An example from invoices:In certain jurisdictions there are strict rules on how invoice numbers should be generated. Imagine that in the first version of the API you return the invoice number synchronously when the invoice draft is created. But that causes problems and out of compliance. To be compliant, you start generating the invoice number asynchronously. Existing integrations depend on having that invoice number on creation and thus are broken by the change.Field length: If you return short of ids with a fixed length (e.g. ch_123456), users will assume that they will continue to be short and of a fixed length and store them in their database with varchar(16). If you ever start returning longer ids (i.e. larger than 16 characters), they won’t fit in your user’s database and break their integration.I don’t have a good recipe to figure out what these are, but as Hyrum’s law suggests, they will surprise you and they will happen.On top of that, all APIs are making non-functional promises: Many of them surprising:Latency: if they always return within 200ms, developers will assume that they will continue to return within 200ms. Making the API respond within 1000ms may break an integration which times out at 500ms.Price: if today it costs $0.01 per call, a developer might design their integration one way, and if you change the price, it may “break” that integrationThroughput: a threaded integration might break if you reduce the rate limits that throttle the allowed requests per second.Storage: if you store an object for the developer, you just promised that you would store it forever unless there is a specific eviction policy1.Reliability: This is often an explicit part of the SLA.Consistency: Do integrations expect to read an object after they write it? Most APIs work this way but if you ever relax that and allow caches (which may be stale) to return certain calls, you will break integrations.If everything you do might bring you problems, do lessAs Hyrum’s suggests, the more you do, the more mistakes you can make. And because APIs are forever2, mistakes are forever too. The best way to make fewer mistakes is to do less overall. So, if when considering a feature you wonder “will they need it?”, then don’t add it. Wait until enough people complain about it before you add it. This way you will be sure they needed it. You don’t want to add surface area that you may regret unless it is really worth it.For example, let’s say that your API could have a number of side-effects (store something in a database, emit an event to some other service, send an email, etc). Once you add those side-effects, you can’t really remove them. But you can always add them later under some parameter like send_email. When in doubt, do less.Restrict your instinct to be helpful. For example, don’t volunteer information in the API responses that the developer doesn’t absolutely need. For example, Stripe originally added count on list endpoints because Mongo returned it from the list queries. It turns out that Mongo struggles to calculate that count as collections grow, and it creates all sorts of performance problems. It is not super clear that Stripe users need count. For that and other reasons, list endpoints are some of the worst endpoints for Stripe to maintain.What should’ve early Stripe done? You might think “Ahh, they shouldn’t have added count if nobody asked for it”. No, Stripe shouldn’t have offered list endpoints until absolutely necessary3. Behind every user request for a list endpoint lurks a specific problem to be solved that could be better solved in some other way:Reconciliation: “I want to reconcile my payments to the cash in bank account“If there are lots of payments, a list endpoint will be a moving target: as you list payments to add them up, new ones payments and changes come in, making it impossible for you to get a true snapshot of what happened in the period.This is better served by immutable reports that can be reconciled against bank statements.Customer portal: “I want to show customers their payments in my app”List endpoints have high latency and customers have to wait a long time for their page to render.The integration should store its notion of orders in their database, and when displaying each individual order, fetch the associated payment from Stripe. Alternatively, Stripe could make a Customer Portal.Metrics: “I want to calculate how much revenue I made each day / month / period”It takes forever to send all the payments over the network each time you want to calculate the metrics.It is better for the integration to store the changes as they come in their own data warehouse and then calculate metrics based on that warehouse. Alternatively, they could use the Stripe dashboard or Sigma.Search: “I want to search through the latest payments for one with certain metadata”The list endpoint will return fresh data (read-after-write) but it will be a very inefficient way to search for one payment.This is better served by a search API (e.g. /search?metadata[key]=value) that has all the needed indexes and can return only the objects that the user needs. (The flip-side is that a search API powered by Elastic Search is likely going to return data that is a few minutes stale which may or may not be fine for the user)But once integrations depend on list endpoints, Stripe can never retire them.Product development for APIsSo how do you evolve your product if you can’t change it often or do A/B tests4? You need to find other ways to test changes. Here is one recipe:Talk to developers before designing the APIsTest the APIs internally and maintain real integrationsRelease in alpha to external developers, subject to changeWatch them integrateRevise the API several times while in alphaConsider the far future when designing(1) Talk to developers before designing the APIsUnlike consumers, developers have to think quite a bit before using an API. Before sitting down and writing a program, they have to consider how the API integrates with what they are building. After they do that, they will form strong opinions regarding what they need for their use-case and they’ll discover new requirements as they code the integration.This means that it is much easier to interview a developer about their needs than a consumer.For example, businesses want to be paid at different times:One business wants to be paid right away so that they in turn can pay their suppliers.The other business wants to get the money 5 days later once they fulfill goods, so that the cash accounting is aligned with the revenue accounting.When interviewing businesses, it is important to understand why they need what they need. For the settlement timing example above, you may be tempted to add a payment_delay parameter:One user can pass payment_delay: 0 (days) and get their money right away.The other one can pass payment_delay: 5 (days) and get their money 5 days later.But that would’ve been a mistake. The second business fulfills 5 days later on average. They don’t know when they will fulfill the goods in advance. The right parameter would’ve been:settlement_on: capture to get the money right away.settlement_on: fulfillment to get the money later, once they hit a new fulfillment API.By understanding why developers want what they want you can (to some extent) predict other things they will want and make their lives easier in the future.(2) Test the APIs internally and maintain real integrationsOnce you understand what developers want, you can pretend to be them and then use your API. Ask your coworkers to test the API. (You should also test it but their testing will be a much more reliable way to find problems)Ask everybody to write friction logs as they test the API. Friction logs are what they sound like: a log that details every moment when the developer encountered some friction. Include screenshots and code snippets of what was confusing alongside what you were thinking when it happened.There is something very fragile about evaluating APIs (and products in general): once you understand how they work, you are no longer a reliable proxy for a new user. There are all sorts of friction and problems that can only be found by fresh eyes. For example, the word account is often ambiguous to new users but well-defined to those who learned it. Therefore, you should weigh the feedback from those fresh eyes heavily: they are seeing things that every new developer will see but you are now blind to.Ideally, you can maintain a real integration and see its problems over time. In Stripe’s case, this meant having a small side-business to sell things online. A few Stripe employees did this and had great ideas for improving the product5.(3) Release an alpha subject to changeInterviews and internal testing will only get you so far. Developers will discover requirements as they integrate and importantly, way after they integrate. Their support team might discover that your API behaves in unexpectedly when support tickets come in. This alpha period lets you change things more fluidly with the expectation that if you do change the API, the alpha integrations will be updated.Even if they agree to upgrading eventually, alpha users will drag their feet when you ask them to upgrade. Keep this in mind as you plan deprecation timelines for the alpha.(4) Watch everybody integrateMany of the problems from an API are subtle confusions. Some examples: The developer interprets balance as "pending balance" because that is what they care about when you mean "captured balance".The developer expects the next step in their integration to be about fulfilling goods but your guide’s next step is about reconciling payments with orders.The developer is providing services and your guide talks exclusively about selling goods which confuses them: is this guide for me?If the API ends up working for them after they resolve the confusion, they might not tell you what they struggled with. So, here are some ways to observe that process:Literally watch them. Go to their office and sit next to them while they program. Start a zoom meeting and be in the background in case they have questions. Make a Slack channel with them and ask them how they are doing every so often.Interview them right after they’ve integrated when they are likely to still remember the problems they encountered.Ask them to write a friction log (described above) as they integrate that you can read later. This is hard work so expect only your friends to do it.(5) Revise the API with the feedbackAs you revise the alpha API with users' feedback, try to make those fixes backwards compatible. This will save the alpha users some work. But if you need to, don’t be shy about making breaking changes to existing alpha integrations. This is the only time you can fix your mistakes, use it!(6) Consider the far future when designingAfter real usage, you’ll learn a lot more about what developers want from your API. What else might they want? What other parts of their business did they talk about? How might your API relate to those? What are some features that they mentioned but didn’t want yet?You don’t have time to fully design all of those but keep them in mind. As the example above suggest, learning that businesses care about settlement timing and fulfillment should make you ask questions like:Do they fulfill different parts of the order at different times? If so, do they want the different parts of the payment to be captured at different times? How could you handle that if needed?This might make you change the signature of the /fulfill endpoint or ask them to pass more data about what they are fulfilling.Do they ever cancel fulfillments? What should happen to the resulting cash?This might make you consider fulfillments as a separate object with a state that has to be tracked as opposed to a single property on a payment.Final warningThis essay has a loose recipe for improving an API design while minimizing future breaking changes. Even with a recipe, backwards compatibility makes iterating on APIs much harder than iterating on UIs. As such, you should extend your timelines when planning the design and rollout of an API.And you should start the process knowing that you’ll make some irreversible mistakes. Maintaining AP'''
year_published = 2025
clearnet = "https://blog.sbensu.com/posts/api-avoid-breaking-changes"
