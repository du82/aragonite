["https://blog.sbensu.com/posts/on-becoming-a-person"]
title = "sbensu: On becoming a person (book)"
description = "It reframes therapy as a relationship instead of a treatment."
full_description = '''On becoming a person (book) December 2024 Loved the book! My interpretation: The underlying metaphor for therapy is medicine. The patient is a system with problems. Treatments will be applied to the patient to solve said problems. When the doctor prescribes cholesterol pills, they'll have the same effect regardless of who the doctor is. Rogers thinks that is a terrible metaphor. Instead, it is the relationship between the therapist and the client that matters: A bad relationship can't help, even if it prescribes "the right treatment"."Within the right relationship", any treatment will cure the patient because the actual treatment is to spend time with the therapist in the context of that therapeutic relationship.I have no experience with actual therapy so I can't judge if this is true. But it certainly resonates in terms of helping people with many of their problems. My relationship with certain people is set up in a way where I simply can't help with certain problems, no matter how much I try. It is a combination of they are, who I am, how they see me, how I see them, etc. The combo makes me totally ineffective. And with other people, otherwise very similar, I have a relationship where I can easily help with those same types of problems! It's the same with management (and possibly education1). The first months of working with someone, there are only certain things you can help them with. People round this down to "they gotta trust you" but it is more nuanced: You have to earn their respect in each domain you want to help themThey have to trust you to not judge them as they tryYou have to care about them getting better at the skill Most of the coaching side of management can only come after you have the right relationship. Same for the leading side. And the two sides require different relationships! For the distinction between these two, see Team-oriented vs outcome-oriented Thank you to Rinad for recommending this and many other great books.Footnotes Priya Rose pointed out that Maria Montessori believed that her method couldn’t be applied by just anyone, and that the first step was essentially for the teacher to mature so they could be in right relationship with the student.↩ The person behind the idea »'''
