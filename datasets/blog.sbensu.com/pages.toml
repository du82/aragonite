["https://blog.sbensu.com/posts/payments-vs-transfers"]
title = "sbensu: Payments vs Transfers"
description = 'Transfer means to move money but payment means "exchanging goods or services". A payment system has a lot more requirements than a transfer system and I rarely see the crypto ecosystem acknowledge these when building "payment" products.'
full_description = '''Payments vs Transfers February 2023 Every so often, somebody will tell me how crypto will render Visa and Mastercard obsolete. Crypto could do that one day but what we have today is not enough. Other people tell me that crypto is terrible, Visa is also terrible, and that payment fees should be absolutely zero. In both cases, when they run me through the logic, I often realize that they don't understand the difference between payments and transfers:A transfer is the simplest operation: you move money from account A to account B. They are usually irreversible1 and in many cases, the same entity often controls both accounts. For example, you send money from your bank to your broker.A payment is made in exchange for goods and services and it has an implicit contract associated. The rules of this implicit contract are codified in the payment network rules.Sending USDC over the Ethereum network solves the transfer use-case but not the payment use-case. Would you send an irreversible USDC transfer to a merchant that you've never heard of before? Most people wouldn't.The value of a payment networkWe could absolutely build a crypto payment network (and that would be great) but it is important to recognize what are the many functions of existing payment networks before calling them obsolete. For payments to work well, you need:Buyer guaranteesCredit for the buyers and seller's guaranteesDispute adjudicationForeign exchange servicesA recognized brand and an “acceptance network”Compliance1. Buyer guaranteesIf sellers don't deliver the goods, buyers want to know they’ll get their money back. This requires somebody to onboard and control the sellers and take the risk if one of the sellers runs away with the money before delivering the goods.In the Visa network, this has been done historically by "acquirer banks" that have relationships with merchants. Wells Fargo, Chase, and Bank of America all have an acquiring business. In the last 15 years, acquirer banks have passed on the burden of onboarding and underwriting risk to payment processors like Stripe and Square. Commerce is growing too quickly for banks to underwrite everybody that wants to set an online store.When underwriting merchants, the key variables are:Certain industries like cruise ships and events have a long return window: they charge you today but deliver their services in 6 months or more. The payment processor accrues risk proportional to that return window. If a grocer goes out of business, there is a week or two of payments to refund. But if a cruise company goes out of business, there are +6 months worth of payments to refund.Those industries also have highly correlated refunds: one canceled cruise ship is a lot of refunds. Cruise companies are likely to go bankrupt if their cruises have to be canceled because they simply can’t pay all those refunds at the same time.Overall fraud rate of the industry: the gift card industry is prone to scams, so acquirers have learned that merchants routinely run away with buyer’s money at a higher-than-usual rate.Cash doesn't have buyer guarantees and as such, people are wary of using it for large purchases to be delivered later (but are fine with using it to buy chocolate in a kiosk).Cost: Buyer guarantees have a cost directly proportional to the total payment.2. Credit for the buyersConsumers spend a lot more if you give them credit. Merchants (with high margins) are usually happy covering many of the associated fees because they make it up in increased volume. In the Visa network, card issuers like Chase and Capital One provide that consumer credit when they issue you a credit card and a credit line.Debit cards are also issued by these issuer banks and part of the payment network but they have no credit associated. And as you'd expect, the average order value of debit cards is often much lower than credit cards, even for the same merchant2. If the consumer defaults on their credit, it is the issuer's problem. Merchants don't need to be underwriting each customer individually.Buyer’s credit was not invented by card networks. Stores used to extend credit to its buyers and keep a tally of how much each one owed (before computers!). One of the main innovations of the card networks was managing this credit for smaller merchants3 and one of the reasons that merchants were happy to accept them. From Chapter 1 of Electronic Value Exchange4: [A merchant] had three girls working on Burroughs bookkeeping machines, each handling 1,000 to 1,500 accounts. I looked at the size of the accounts: $4.58. $12.82. And he was sending out monthly bills on these accounts. Then the customers paid him maybe three or four months later. […] His accounts receivables were dragging him under. Most consumer credit in the US is revolving credit: you draw from it as you buy things, and you pay your outstanding balance wherever you can. But credit can take many forms:In LATAM installments are more popular: you buy an item today and pay over 12 installments, one a month (“coutas” in Argentina, “parcelas” in Brazil, “meses sin intereses” in Mexico).Buy Now Pay Later (BNPLs) are the latest form of consumer credit: you pay in 4 installments, every two weeks to match salary payments. This is increasingly popular where revolving credit is popular but not really interesting wherever installments are already common.Cost: Providing credit has a cost proportional to the amount of the purchase.3. Dispute adjudicationWhen buyers and sellers disagree, the network needs to adjudicate the dispute. This is expensive because it requires human attention and nobody wants to do it. Neither the seller nor the buyer (or any agents that represent them) can credibly do this work, so you need a third neutral party. In the case of Visa, it is supposed to be the network but in practice the issuers do some of this work, which is why merchants largely lose disputes.This is not always necessary. Buyers trust aggregators like Amazon to return their money if there is a problem. But without buyer guarantees and a dispute system, smaller merchants have a harder time getting off the ground.Cost: Adjudicating disputes has a fixed cost per dispute, but a high one.4. Foreign exchange servicesLet’s say the buyer wants to pay with 100 USD and the merchant wants to receive 100 EUR (on the purchase day the FX rate was 1:1). Somebody needs to:Provide the seller’s currency (EUR) and take the buyers currency (USD)Nobody naturally wants to be holding all sorts of currencies. FX rates fluctuate everyday and you need to be very careful if you are exposed to those fluctuations.Hold the FX risk during the return windowTwo months after the purchase, the buyer asks for a refund. The FX rate is now 1:1.2. The merchant wants to return 100 EUR but at current rates, that is no longer enough to cover the 100 USD the buyer wants to receive. Somebody needs to produce the missing USD. Who is holding that risk?Cost: Both of these services have a risk proportional to the total amount of the payment.5. A recognized brand and an “acceptance network”Consumers only know to pay with a “payment method” if it is advertised to them often (i.e. a brand) and there are a lot of merchants that accept it (an “acceptance network”). The network effects in payments are very strong. You know how all shops have Visa and Mastercard signs5 stuck to their windows? It takes a lot of work to make that happen in most of the world. A global payment network doesn’t just manifest!Cost: The cost of maintaining this network and brand is not linearly related to the network's processing volume but definitely proportional.6. ComplianceYou may not think as compliance as "a job to be done" but as soon as regulators start chasing you, you will! The regulators want to prevent certain goods and services to be exchanged for money (drugs, sex, etc.) and they pressure anything that functions as a payment network to do their bidding.This is far from perfect but it allows large companies and the government (large sectors of the economy) to use the card networks.While keeping compliant is a value-proposition to most actors, it less important for decentralized systems like crypto6.Transfers have fixed costs, payments have variable costsTransfer systems are much easier to set up because they don't provide all these services. Importantly, they can have “fixed” costs where the cost of a transaction is not proportional to the amount of the transfer. The transfer system is not exposed to any variable costs.But as you saw, 4/5 of the payment services have variable costs and as such, need to have a variable rate to operate.Problems with the card networkIf you want to build a new payment network, here are some places where the current dominant networks are failing for the US market7:Relatively low conversion ratesHigh fraud ratesCard networks pass the fraud burden to merchantsDebit card consumers subsidize credit card consumersCreeping costsSlow settlement timeNot all consumers can participateMany legitimate industries are deemed risky or illegal1. Relatively low conversion ratesOnline, cards are actually a pretty bad payment method. Entering the 16 digit number is a pain, which is why you are so grateful whenever Apple Pay, Shopify's Shop Pay, or Stripe’s Link are on the page ready to autocomplete all the information you need.I worked on Link and I’ve seen first hand the conversion lift that it can generate. It is crazy that most merchants still ask you to enter the 16 digits!2. High fraud ratesEvery large merchants needs to have an in-house team dedicated to preventing fraud. This is a drag on the online economy and completely unnecessary.Fraud should largely be solved with better technology. Apple Pay8 works on top of the card networks and has at least one order of magnitude less fraud:When you onboard a card to the Apple Pay wallet, the issuer authenticates and Apple Pay authenticates you with Face ID or Touch ID.Each time you set up a card with a merchant, Apple Pay generates a new set of 16 numbers and encrypts them in your device before passing them around.They only do this if they were able to authenticate you with Face ID or Touch ID, like you did in the setup.When the issuer gets one of these encrypted numbers, they can trust that they came from the Apple Pay wallet and, if they trust Apple's authentication, that it was the real consumer.Visa still hasn’t provided for all their transactions but a new payment network would certainly provide similar guarantees.3. Card networks pass the fraud burden to merchantsOnline merchants are on the hook for any fraudulent transaction which is maddening to first-time merchants9. This effectively requires merchants to underwrite each customer individually the first time they come to the store. In these cases, merchants are getting a lousy deal; they are covering the payment network fees without getting the basic value that they are supposed to provide.This is especially bad for low margin business: imagine you have a 5% margin and you keep $5 every $100 of sales. Each fraudulent transaction costs you ~$95 but each good one gets you back $5. So, to make up for each fraudulent transaction you need to sell an additional 19. Low-margin merchant have to be much more careful about fraud10.4. Debit card consumers subsidize credit card consumersCard issuers like Chase and Capital One compete to get the richest consumers. To do that, they lobby Visa to get higher fees from their premium cards and then they pass part of those fees back to the consumer, bribing them to use their card. This is what a points or a cashback program is. The fees for some of these cards end up amounting to 2% or more.But who is paying for those points and rewards? Let’s think step by step:Before cards, supply and demand force the merchant to charge an average of $100:Consumer that would use debitConsumer that would use creditConsumer pays$100$100Merchant gets$100$100Once they introduce cards, merchants initially keep the same price and they discover a 1% fee for debit and 2% for credit11:Debit consumerCredit consumerConsumer pays$100$100 - $1 rewards = $99Merchant gets$99$98Assuming a 50/50 credit-debit split, the average amount the merchant is receiving is $98.5. This is significant. The merchant would like to charge $102 to the credit card and $101 to the debit card but Visa rules prohibit this.To make up for those fees, they increase the price to $101.5 or so for all consumers. They can do this because every merchant also has to do this and the fee won't be competed away.After merchants increase to $101.5 to get back to their original target margin:Debit consumerCredit consumerConsumer pays$101.5$101.5 - $1 rewards = $100.5Merchant gets$100.5$99.5You can now see that:The merchant is making more margin from debit consumersBut overall, the merchant is actually getting what they were getting before.The debit consumer is effectively paying an extra 1.5% than what they were going to payThe credit consumer is paying what they were going to pay before.At the end of the day, it is cash and debit card users who are paying for your Chase Sapphire points.In this process, I've omitted cash users but you can see that they are equivalent to debit card users in that they pay $100 and get no benefits12. Who Gains and Who Loses from Credit Card Payments? Theory and Calibrations has a more detailed model of this process and estimates the overall effect on households: On average, each cash-using household pays $149 to card-using households and each card-using household receives $1,133 from cash users every year. 5. Creeping costs: merchants don’t have enough choiceAs noted above, merchants can’t charge different prices for consumers that are going to get rewards. If the Visa network adds more expensive “payment methods” that are unappealing to low-margin merchants, those merchants can’t really choose if they want to accept them. Coupled with the fraud costs, this makes low-margin merchants unhappy with Visa.You can see this dynamic playing out differently with Buy Now Pay Later. BNPLs took off during the last couple of crazy years. It sounds like a great idea for high margin merchants which are happy subsidizing credit for certain purchases. But low-margin merchants don’t want to pay 5-6% for BNPLs. Given that BNPLs are outside of the Visa network, that is fine: each merchant can choose what they accept and that is roughly what you see in the market.6. Settlement timeIn the US, merchants typically get paid 2 days after the purchase was completed. While this doesn't sound terrible, it could be better. Many merchants (like Instacart and Lyft), want to pay their vendors (shoppers and drivers) right away.Visa is a net settlement system: acquirer banks (and merchants) are paid in batches of payments, net of fees, disputes, and refunds. In a net settlement system you'll always have to wait to get a payment until the batch is ready. But how much you wait after the batch depen'''
