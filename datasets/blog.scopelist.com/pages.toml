full_description = "Holosun Reflex Sight, ReviewsHolosun DRS-TH: Advancing Thermal Optics Posted on May 22, 2024November 8, 2024 by Tyler P 22 May Table of ContentsAbout Holosun TechnologiesFeatures and Specifications of the DRS-THThermal Imaging TechnologyRed Dot Sight IntegrationAdvanced CapabilitiesAdditional FeaturesAvailability and PricingHolosun DRS-TH SpecificationsFAQ: Holosun DRS-TH Thermal Reflex Sight Scopelist.com proudly introduces the Holosun DRS-TH, a groundbreaking addition to our lineup of cutting-edge optics. With its integration of advanced thermal imaging technology, Holosun Technologies once again sets a new standard in firearm optics with the Digital Reflex Sight – Thermal (DRS-TH). About Holosun Technologies Holosun Technologies has earned a stellar reputation for merging cutting-edge technologies into user-friendly, durable designs. Trusted by civilian enthusiasts and professionals in law enforcement and military sectors alike, Holosun products consistently deliver superior performance. Features and Specifications of the DRS-TH Thermal Imaging Technology 256 x 192 Thermal Sensor: Detects heat signatures with exceptional precision. 1024 x 768 Display Resolution: Renders clear and detailed thermal images. Multiple Thermal Modes: Offering versatility with white hot, black hot, highlight, outline, and fusion modes. Red Dot Sight Integration Reticle Options: Choose from circle dot, dot, or circle reticle options for optimal targeting. Brightness Levels: Eight daytime and four night vision settings ensure visibility in all lighting conditions. Advanced Capabilities Photo and Video Capture: Record observations and save them to onboard storage. Digital Zoom: Zoom in up to 8x for detailed observation. Battery Life: Up to 20 hours of operation with two 18350 rechargeable batteries. Durability: IP67 rating ensures water and dust resistance, ideal for rugged environments. Additional Features USB Port: Conveniently charge the device and stream footage in 