["https://blog.sigstore.dev/announcing-sigstore-java-1-0"]
title = "Announcing sigstore-java 1.0 - Sigstore Blog"
full_description = "sigstore-javaThe sigstore-java project brings the Sigstore signing and verification paradigm to the Java ecosystem. It is built natively in Java and is easy to integrate with your Maven and Gradle builds or custom workflows.1.0 Stable ReleaseToday, thanks to the support of the community and work of our contributors, we’re excited to announce a 1.0 stable release of the sigstore-java client. This includes a library(dev.sigstore:sigstore-java) for programmatic access to the sigstore signing and verification APIs. It also includes signing plugins for maven(dev.sigstore:sigstore-maven-plugin) and gradle(dev.sigstore.sign) that integrate effortlessly with your build and publishing workflows.Signatures on Maven CentralThanks to the team at Sonatype, Sigstore signature bundles (*.sigstore.json) are an accepted signature format on Maven Central. So you can start signing your Maven Central artifacts with Sigstore today. To ensure existing verification workflows and tooling continue to work for Java workflows PGP signing is currently still required for publishing to Maven Central.FeaturesThe sigstore-java library is meant to provide a comprehensive API to sigstore infrastructure. It gives users access to both simple high level APIs while also making it possible to tweak the behavior according to your needs.The 1.0 ships with these features todayProgrammatic signing and verifying using sigstore-java APIsEasy signing using Maven and Gradle Sigstore pluginsSigning identity via browser workflow or from Github Actions id-tokenSigstore signature bundle support (*.sigstore.json)The client is already in use by some early adopters, and we attach sigstore signature bundles to all our sigstore-java artifacts on Maven Central. Head over to our github page (sigstore-java, maven, gradle) for further details on accessing the API or integrating directly with your Java builds.Development, Testing and ContributingSigstore is an open source project developed directly on GitHub and made possible by a dedicated and inclusive community.In addition to standard tests, sigstore-java is fuzzed with oss-fuzz and tested with the sigstore-conformance test suite to ensure compatibility within the sigstore ecosystem and all other language clients.Feel free to file issues directly on the sigstore-java issue tracker. You can also catch on the sigstore#java slack channel.Special thanks to our core contributors Patrick Flynn and Vladimir Sitnikov and also to Hervé Boutemy from Maven, Louis Jacomet from Gradle, and Joel Orlina for their help with Maven Central."
