["https://blog.sigstore.dev/cosign-and-policy-controller-with-gke-artifact-registry-and-cloud-kms"]
title = "Cosign and Policy-controller with GKE, Artifact Registry and KMS - Sigstore Blog"
full_description = 'As soon as I came back from KubeCon NA 2022, my first ever in-person KubeCon, I felt re-energized. What a community, full of people eager to share knowledge and expertise with each others, so inspiring. I mostly attended sessions about security best practices for containers and Kubernetes (that’s what excites me these days!). Secure Software Supply Chain (S3C) was almost mentioned everywhere, for good reasons.Sigstore as a new standard for signing, verifying and protecting software, got its first own SigstoreCon as co-located event and hit the General Availability (GA) milestone. It piqued my curiosity. I wanted to give Cosign in Kubernetes clusters a try.I did, and to be honest, within a few hours of research and tests I was able to sign my container images with Cloud KMS and Google Artifact Registry and then only allow my own signed images to run in my GKE cluster.I thought I would share my learnings and show you how easy it is. Hope you’ll like it!This blog article will walk you through two main concepts:Sign a container image with Cosign, Google Artifact Registry and Cloud KMSEnforce that only signed container images are allowed in a GKE cluster with Policy-controllerNote: while learning and testing, it was also the opportunity for me to open my first issues and PRs in the sigstore/docs (#63), sigstore/policy-controller (#520), and sigstore/community (#220) repos to fix some frictions I faced.Define the common bash variables used throughout this blog article:PROJECT_ID=FIXME-WITH-YOUR-EXISTING-PROJECT-ID gcloud config set project ${PROJECT_ID} REGION=northamerica-northeast1 Sign a container image with Cosign, Google Artifact Registry and Cloud KMSIn this section you will:Create a key in Cloud KMSCreate a Google Artifact Registry repository to store container imagesPush a simple nginx container image in this repositoryInstall Cosign locallySign this remote private container imageEnable the Cloud KMS API in our current project:gcloud services enable cloudkms.googleapis.com Create a key in Cloud KMS:KEY_RING=cosign gcloud kms keyrings create ${KEY_RING} \ --location ${REGION} KEY_NAME=cosign gcloud kms keys create ${KEY_NAME} \ --keyring ${KEY_RING} \ --location ${REGION} \ --purpose asymmetric-signing \ --default-algorithm ec-sign-p256-sha256 Enable the Artifact Registry API in our current project:gcloud services enable artifactregistry.googleapis.com Create a private Google Artifact Registry repository to store our container images:REGISTRY_NAME=containers gcloud artifacts repositories create ${REGISTRY_NAME} \ --repository-format docker \ --location ${REGION} Push an nginx image in our own private Google Artifact Registry repository:docker pull nginx docker tag nginx ${REGION}-docker.pkg.dev/${PROJECT_ID}/${REGISTRY_NAME}/nginx gcloud auth configure-docker ${REGION}-docker.pkg.dev SHA=$(docker push ${REGION}-docker.pkg.dev/${PROJECT_ID}/${REGISTRY_NAME}/nginx | grep digest: | cut -f3 -d" ") Note: we are grabbing the SHA of this remote container image in order to sign this container image later.Install Cosign locally:COSIGN_VERSION=$(curl -s https://api.github.com/repos/sigstore/cosign/releases/latest | jq -r .tag_name) curl -LO https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64 sudo mv cosign-linux-amd64 /usr/local/bin/cosign chmod +x /usr/local/bin/cosign Generage a key and sign this remote container image with Cloud KMS:gcloud auth application-default login cosign generate-key-pair \ --kms gcpkms://projects/${PROJECT_ID}/locations/${REGION}/keyRings/${KEY_RING}/cryptoKeys/${KEY_NAME} cosign sign \ --key gcpkms://projects/${PROJECT_ID}/locations/${REGION}/keyRings/${KEY_RING}/cryptoKeys/${KEY_NAME} \ ${REGION}-docker.pkg.dev/${PROJECT_ID}/${REGISTRY_NAME}/nginx@${SHA} We could now see that our Google Artifact Registry repository has two entries, one for the actual container image and the other for the associate .sig signature:gcloud artifacts docker tags list ${REGION}-docker.pkg.dev/${PROJECT_ID}/${REGISTRY_NAME}/nginx Output similar to:Listing items under project ${PROJECT_ID}, location ${REGION}, repository ${REGISTRY_NAME}. TAG IMAGE DIGEST latest ${REGION}-docker.pkg.dev/${PROJECT_ID}/${REGISTRY_NAME}/nginx sha256:4c1c50d0ffc614f90b93b07d778028dc765548e823f676fb027f61d281ac380d sha256-4c1c50d0ffc614f90b93b07d778028dc765548e823f676fb027f61d281ac380d.sig ${REGION}-docker.pkg.dev/${PROJECT_ID}/${REGISTRY_NAME}/nginx sha256:f02d7fef0df5c264e34b995a4861590bbdd7001631f6e5f23250f34202359a56 Note: there is an ongoing discussion to support the reference types from the OCI spec in order to just have the container image where the signature could be attached on. Since Cosign 2.0, that’s now an experimental feature.Verify this signed container image:cosign verify \ --key gcpkms://projects/${PROJECT_ID}/locations/${REGION}/keyRings/${KEY_RING}/cryptoKeys/${KEY_NAME} \ ${REGION}-docker.pkg.dev/${PROJECT_ID}/${REGISTRY_NAME}/nginx@${SHA} Note: we are verifying with the container image digest SHA, it’s also working with the container image tag associated to this digest.Output similar to:Verification for ${REGION}-docker.pkg.dev/${PROJECT_ID}/${REGISTRY_NAME}/nginx@sha256:4c1c50d0ffc614f90b93b07d778028dc765548e823f676fb027f61d281ac380d -- The following checks were performed on each of these signatures: - The cosign claims were validated - The signatures were verified against the specified public key [{"critical":{"identity":{"docker-reference":"${REGION}-docker.pkg.dev/${PROJECT_ID}/${REGISTRY_NAME}/nginx"},"image":{"docker-manifest-digest":"sha256:4c1c50d0ffc614f90b93b07d778028dc765548e823f676fb027f61d281ac380d"},"type":"cosign container image signature"},"optional":null}] Enforce that only signed container images are allowed in a GKE cluster with Policy-controllerIn this section you will:Create a GKE cluster with Workload IdentityCreate a dedicated least privilege Google Service Account for the Policy-controller’s ServiceAccountsInstall Policy-controller in this GKE clusterDeploy a policy to only allow signed container imagesTest this policy with both signed and unsigned container imagesEnable the GKE API in our current project:gcloud services enable container.googleapis.com Create a GKE cluster with Workload Identity:gcloud container clusters create ${CLUSTER_NAME} \ --workload-pool=${PROJECT_ID}.svc.id.goog \ --zone ${ZONE} \ --scopes "gke-default,https://www.googleapis.com/auth/cloudkms" Note: we explicitly add the https://www.googleapis.com/auth/cloudkms scope needed by Policy-controller. https://www.googleapis.com/auth/cloud-platform instead is fine too.Define a least privilege Google Service Account (GSA) for Policy-controller by granting the cloudkms.viewer, cloudkms.verifier and artifactregistry.reader roles and by enabling Workload Identity between the Kubernetes Service Account and the Google Service Account:PC_GSA_NAME=policy-controller-sa PC_GSA_ID=${PC_GSA_NAME}@${PROJECT_ID}.iam.gserviceaccount.com gcloud iam service-accounts create ${PC_GSA_NAME} gcloud iam service-accounts add-iam-policy-binding ${PC_GSA_ID} \ --role roles/iam.workloadIdentityUser \ --member "serviceAccount:${PROJECT_ID}.svc.id.goog[cosign-system/policy-controller-policy-webhook]" gcloud iam service-accounts add-iam-policy-binding ${PC_GSA_ID} \ --role roles/iam.workloadIdentityUser \ --member "serviceAccount:${PROJECT_ID}.svc.id.goog[cosign-system/policy-controller-webhook]" gcloud projects add-iam-policy-binding ${PROJECT_ID} \ --role roles/cloudkms.verifier \ --member serviceAccount:${PC_GSA_ID} gcloud projects add-iam-policy-binding ${PROJECT_ID} \ --role roles/cloudkms.viewer \ --member serviceAccount:${PC_GSA_ID} gcloud artifacts repositories add-iam-policy-binding ${REGISTRY_NAME} \ --location ${REGION} \ --member "serviceAccount:${PC_GSA_ID}" \ --role roles/artifactregistry.reader Install the Policy-controller Helm chart in this GKE cluster by annotating the Policy-controller’s ServiceAccounts to use Workload Identity:helm repo add sigstore https://sigstore.github.io/helm-charts helm repo update helm install policy-controller \ -n cosign-system sigstore/policy-controller \ --create-namespace \ --set "policywebhook.serviceAccount.annotations.iam\.gke\.io/gcp-service-account=${PC_GSA_ID}" \ --set "webhook.serviceAccount.annotations.iam\.gke\.io/gcp-service-account=${PC_GSA_ID}" Deploy a policy only allowing signed container images with our Cloud KMS key:cat << EOF | kubectl apply -f - apiVersion: policy.sigstore.dev/v1alpha1 kind: ClusterImagePolicy metadata: name: private-signed-images-cip spec: images: - glob: "**" authorities: - key: kms: gcpkms://projects/${PROJECT_ID}/locations/${REGION}/keyRings/${KEY_RING}/cryptoKeys/${KEY_NAME}/cryptoKeyVersions/1 EOF Enfore this policy for the test namespace:kubectl create namespace test kubectl label namespace test policy.sigstore.dev/include=true Note: you need to apply this label on the namespaces you want this policy to be enforced in.Test with an unsigned container image and see that it’s blocked:kubectl create deployment nginx \ --image=nginx \ -n test Output similar to:error: failed to create deployment: admission webhook "policy.sigstore.dev" denied the request: validation failed: failed policy: private-signed-images-cip: spec.template.spec.containers[0].image index.docker.io/library/nginx@sha256:b8f2383a95879e1ae064940d9a200f67a6c79e710ed82ac42263397367e7cc4e signature key validation failed for authority authority-0 for index.docker.io/library/nginx@sha256:b8f2383a95879e1ae064940d9a200f67a6c79e710ed82ac42263397367e7cc4e: no matching signatures: Test with our signed container image and see that it’s allowed:kubectl create deployment nginx \ --image=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REGISTRY_NAME}/nginx@${SHA} \ -n test Note: we are deploying with the container image digest SHA, it’s also working with the container image tag associated to this digest.Output similar to:deployment.apps/nginx created That’s it, congrats! We just enforced our GKE cluster to only allow our private and signed container images on specific namespaces! Wow!ResourcesUsing Transparent Digital Signatures to Help Secure the Software SupplyChain- Bob CallawayHow We Learned to Stop Trusting Registries and Love Signatures — Wojciech Kocjan & Tyson Kamp, InfluxDataHow to verify container images with Kyverno using KMS, Cosign, and Workload IdentityHappy signing, happy sailing!Originally posted on Medium.'
