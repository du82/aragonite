["https://blog.sigstore.dev/sigstore-project-update-august-2021-1fad6d12b8dc"]
title = "Sigstore Project Update — August 2021 - Sigstore Blog"
full_description = "Welcome to our project update for August.As always the community is continuing to expand. We are now close to 600 members in our slack workspace. We now have 46 contributors and are growing each day.The month of August saw 254 commits and 526k lines of code were changed!Lots of exciting things are happening, read more for our project updates and our presence at KubeCon, NA.cosignCosign hit 1.0 and adoption is coming on great. It seems almost daily that we spot someone new using cosign.go-releaser now has the ability to sign using cosignflagger, a delivery kubernetes operator is now signing its images using cosignKubernetes is seeking to expand its signing efforts using cosign and sigstoreThere is some exciting work happening around TUF integration with a Fulcio root. See here for a more detailed update, and expect to see this start landing next month!fulcioFulcio continues on its path to maturity. A first release is in the planning stage and will come shortly after rekor 1.0 (since rekor is a dependency of fulcio). We’re also working to directly integrate fulcio IDs with The Update Framework, which should be landing soon.rekorRekor will soon be reaching it’s 1.0 release which means we consider it ready for production! We are currently working on a sharding approach and considering its relevant API design.New Website!sigstore has a cool new website, check it out https://sigstore.devOther ProjectsThe Helm Plugin is almost ready to publishk8s-manifest-sigstore is developing at a fast space and will bring many protections to the kubernetes space with its ability to leverage admission controller based signing and validation of workloads.We now have homebrew taps for cosign and rekor-cli!Events and talks!Sigstore will be at KubeCon, NA, 2021 where we will have a booth! Come and say hi and let’s chat signing all the things! Community members will be present and there to help you get set up using sigstore and there will be swag!There will also be lots of talks. Project co-founders Dan Lorenc and Luke Hinds will be providing a history of sigstore and what’s nextSupply Chain Security ConThe Continuous Delivery Foundation is hosting a colocated event with KubeCon North America called Supply Chain Security Con, and Sigstore is featured in a number of talks. Check out the full agenda here.[Kubelist Podcast](https://www.heavybit.com/library/podcasts/the-kubelist-podcast/ep-20-sigstore-with-dan-lorenc-of-google/?utm_campaign=coschedule&utm_source=twitter&utm_medium=heavybit&utm_content=Ep. %2320, Sigstore with Dan Lorenc of Google)OSS Supply Chain Security Deep Dive with Dan LorencLuke Hinds OpenShift Commons — sigstoreGetting Involved!As always, we truly welcome contributors and users to our community. We take pride in being friendly to new folks and fostering a welcome and safe environment. Being a large open source project, there is always lots to do and it’s not always complex coding tasks, helping with documentation, general testing or just telling others about sigstore are all valued contributions. Come and join our slack workspace and say hello!"
