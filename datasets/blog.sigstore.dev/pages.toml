["https://blog.sigstore.dev/sigstore-october-roundup-80d476308b75"]
title = "Sigstore October Roundup - Sigstore Blog"
full_description = "Technical Steering Committee: New MemberThank you, Dan Lorenc, for your time on the Technical Steering Committee (TSC)! Sigstore is where it is today thanks to your help.We also want to give a big welcome to Priya Wadhwa who is replacing Dan on the TSC! We know you’ll also be great at moving Sigstore in the right direction.SigstoreConThe SigstoreCon program has been announced!We are thrilled to have representatives from 14 different companies speaking at the event, namely: Autodesk, Chainguard, Cycode, Datadog, Edgeless Systems, GitHub, Google, IBM Research, InfluxData, Nirmata, Red Hat, Trail of Bits, Upgrade, and VMware.Thank you to our Program Committee for putting together such a great program.Appu GoundanBatuhan ApaydinJacques ChesterLily SturmanPriya WadhwaWe look forward to seeing you all in Detroit! Register here.SigstoreCon Twitter SpaceJoin the upcoming Twitter Space on Thursday, October 13 at 9 am PT to learn how to join, how to talk, and how to find new friends at SigstoreCon.HacktoberfestSigstore is participating in Hacktoberfest (a month-long celebration of open source) for the first time. Get all the details and start contributing!New Look for SigstoreYou might have noticed that Sigstore has a new colour palette and a new logo. But there’s more! Read the blog post and where you’ll find the brand kit and logo downloads.Latest ReleasesSigstoreSigstore is currently on version 1.4.4!What’s changed:Fixed TUF root initialization with GCS bucket. This affects anyone who uses their own TUF root hosted on GCS, and specifies the GCS bucket only by name and not by HTTP pathFix remoteFromMirror with GCS bucketCosignCosign is container signing, verification and storage in an OCI registry. Its latest release is v1.13.0.Highlight change: For users who have deployed a private instance of Fulcio release v0.6.x and issue certificates with the Username identity, you will need to upgrade to use this version.FulcioFulcio issues code-signing certificates bound to OpenID Connect identities for use within the Sigstore ecosystem. Its most recent release is v1.0.0-rc.0.What’s changed:Update previous releases and add notes for v0.6.0Use same way to output version and expose build info to prometheusUpdate swagger doc version for Fulcio 1.0Update CHANGELOG for v1.0.0-rc.0GitsignKeyless Git signing with Sigstore! Its latest release is v0.3.2.What’s changed:Config: Fork out to git binary for config dataAdd tests for gitsign-attestRekorRekor’s aims to provide an immutable tamper-resistant ledger of metadata generated within a software projects supply chain. Its latest release is v1.0.0-rc.1.What’s changed:Add retry command line flag on rekor-cliAdd some info and debug logging to commonly used funcsAdd CHANGELOG.md for v1.0.0-rc.1Join the Community!This month is Hacktoberfest! Get started with Sigstore there :)Otherwise, new contributors and users are always welcome into our community. We take pride in being friendly to new folks and fostering a welcoming and safe environment. Being a large open source project, there is always so much to do, not all of them being complex coding tasks.Valued contributions include: helping with documentation, general testing, and sharing your love of Sigstore with others.Join our Slack workspace and come say hello! 👋"
