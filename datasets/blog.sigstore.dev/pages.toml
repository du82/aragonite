["https://blog.sigstore.dev/sigstore-feb24-roundup-2024"]
title = "Sigstore February Roundup - Sigstore Blog"
full_description = "Welcome to the February edition of the Sigstore Roundup! This is a regular summary of Sigstore news, events, releases and other happenings.EventsKubeCon Europe 2024The next KubeCon Europe will be held on 19th – 22nd March.There are several Sigstore related talks and events planned for KubeCon Europe, including:Securing the Supply Chain with Sigstore Artifacts Signatures at Scale - Dmitry Savintsev & Yonghe Zhao, YahooNavigating the Software Supply Chain Defense Landscape - Marina Moore & Aditya Sirish A Yelgundhalli, New York UniversityContribfest: Enable Additional Signing Mechanisms for TUF and in-toto: No Cryptography Skills RequiredOpen Source Summit North America 2024The next Open Source Summit North America will be held on April 16th – 18thThere are a few Sigstore related talks planned:Securing Git Repositories with Gittuf - Aditya Sirish A Yelgundhalli, New York University & Billy Lynch, ChainguardPublic Sector + OpenSSF: Principles for Package Repository Security - Jack Cable, CISA & Zach Steindler, GitHubPanel Discussion: Improving Supply Chain Integrity with OpenSSF Technologies - Arnaud Le Hors, IBM; Jay White, Microsoft; Isaac Hepworth, Google; Michael Lieberman, Kusari; Marcela Melara, Intel CorporationSOSS Community Day North America 2024Previously called OpenSSF Day, SOSS Community Day North America will be held on April 15thThere are several Sigstore talks planned:Sigstore: 2024 and Beyond - Hayden Blauzvern, GoogleLeveraging Sigstore Capabilities in a Local Environment - Chad Coleman, Lockheed MartinBuild Provenance: Lessons (so Far) from Homebrew - Joe Sweeney, Trail of BitsSigstore Community MeetingThe last Sigstore Community Meeting was held on the February 20th.You can watch a recording of the meeting hereThe next Sigstore Community Meeting will be held on March 5th.To join the meeting, please see the meeting detailsPlease do come along, all are welcome!Interesting Discussions and DevelopmentsSigstore Graduation ReviewSigstore will go forward for Graduation Review in the OpenSSF TAC meeting on March 5th. This is a significant milestone for the project and we are excited to see the outcome. The pull request for the graduation review can be found hereLatest ReleasesThis month has not seen any major releases, but there have been a number of minor releases across the various Sigstore projects.Fulcio v1.4.4The Fulcio library has been updated to v1.4.4. This release includes the addition of a production OIDC provider for Eclipse, and some minor bug fixes and changes such as changing the parseExtension function to be public, exposing the metrics port to be overridden, and the addition of a configurable idle timeout.Read the release notes hereRekor v1.3.5Logs timestamps now have nanosecond precision, support was added for sha384/sha512 hash algorithms in hashedrekords, additional DB unique index correctionRead the release notes heresigstore-go v0.2.0v0.2.0 of sigstore-go includes an updated TUF client. This also updates verification to require specifying both the certificate issuer and SAN.Read the release notes heresigstore v1.8.2The sigstore library has been updated to v1.8.2Support was added for an Ed25519ph Signer/Verifier and autoclosing the oauth flow window.Client credentials are now supported as an OIDC Auth Flow Provider.Read the release notes hereTimestamp v1.2.2The timestamp-authority library has been updated to v1.2.2. Just a minor release for a bug fix around a Go checksum database error on installation due to deleting a tagRead the release notes hereIn the News / CommunityCaleb Woodbine wrote a blog titled “Sign, Verify and Trust with Cosign” read moreThe Opensource Minder project on how they are using Sigstore to verify cryptographic provenance. read moreA stream was hosted by Viktor Farcic and Whitney Lee on “Signing Artifacts - Feat. Notary, Sigstore, and Open Policy Containers” watch hereJoin the Community!New contributors and users are always welcome into our community. We take pride in being friendly to new folks and fostering a welcoming and safe environment. Being a large open source project, there is always so much to do, not all of them being complex coding tasks.Valued contributions include: helping with documentation, general testing, and sharing your love of Sigstore with others.Join our Slack workspace and come say hello! 👋"
