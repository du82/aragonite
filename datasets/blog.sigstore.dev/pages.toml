title = "Sigstore Blog - Sigstore Blog"
full_description = "May 19, 2023Written by sigstoreBringing Privacy and Security Full Circle Through Automated AuthenticationThis is a Sigstore case study contributed by Max Furman of Smallstep No matter how well you think you secure your software supply chain, the possibility of a breach is always in the back of your mind. We recently had a moment of panic where we thought, “Did someone get access to some things we stored in secrets?” I wondered what damage they’d done and how quickly we could repair it.Tags: sigstore , cosign , supply chain security , open source , devopsApr 19, 2023Written by The Sigstore Technical Steering CommitteeSigstore Support in npm launches for Public BetaWe’re thrilled to announce that the npm project has launched a public beta, bundling Sigstore support directly into the npm Command-Line Interface (CLI). This innovation brings strong origin guarantees to the npm ecosystem and marks the first time that a large package registry technology is using public software signatures to attest to a package’s originating source code and build instructions. Sigstore is an OpenSSF project that enables developers to validate that the software they are using is exactly what it claims to be using cryptographic digital signatures and transparency log technologies.Tags: sigstore , npm , security , nodeFeb 23, 2023Written by Hayden BlauzvernCosign 2.0 Released!Cosign 2.0 has arrived! Cosign 2.0 follows Sigstore’s General Availability launch, which offers production grade stable services for artifact signing and verification. Cosign’s most significant change is to no longer require COSIGN_EXPERIMENTAL=1, since the Sigstore services are now stable! By default, Cosign will fetch an identity-based certificate from Fulcio when a signing key is not provided, and upload the signature and signing key to Rekor to provide transparency. The following is the list of breaking changes:Tags: sigstore , cosign , security , opensourceFeb 10, 2023Written by Mathieu BenoitCosign and Policy-controller with GKE, Artifact Registry and KMSAs soon as I came back from KubeCon NA 2022, my first ever in-person KubeCon, I felt re-energized. What a community, full of people eager to share knowledge and expertise with each others, so inspiring. I mostly attended sessions about security best practices for containers and Kubernetes (that’s what excites me these days!). Secure Software Supply Chain (S3C) was almost mentioned everywhere, for good reasons. Sigstore as a new standard for signing, verifying and protecting software, got its first own SigstoreCon as co-located event and hit the General Availability (GA) milestone.Tags: cosign , sigstore , security , kubernetes , kmsFeb 4, 2023Written by SigstoreTowards Easier, More Secure Signature Technology for the Java Ecosystem with SigstoreIn October 2022, the Sigstore project announced the General Availability of its free software signing service giving open source communities access to production-grade services for artifact signing and verification. As the project matures, so do the language client integrations that are actively being developed. In January 2023, sigstore-python announced the 1.0 version of Sigstore for Python. The Java community has always taken a mature approach to security. So it should come as no surprise that there is plenty of activity towards integrating Sigstore into the existing ecosystem and offering first-class support for software signing and verification with Sigstore.Tags: sigstore , java , gradle , mavenNewerOlder"
