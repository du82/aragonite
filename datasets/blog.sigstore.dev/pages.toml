["https://blog.sigstore.dev/contribute-to-sigstore-during-hacktoberfest-2022-42315a41da5f"]
title = "Contribute to Sigstore during Hacktoberfest 2022! - Sigstore Blog"
full_description = "This year, Sigstore is participating in Hacktoberfest for the first time!What is Hacktoberfest?Hacktoberfest is a month-long celebration that encourages people to contribute to open source. Digital Ocean, along with its partners, hosts it every year.Who can participate?Everyone and anyone is welcome to participate in Hacktoberfest (and to contribute to Sigstore).The first 40,000 participants (maintainers and contributors) who complete Hacktoberfest can elect to receive one of two prizes: a tree planted in their name, or the Hacktoberfest 2022 t-shirt.Contribute to SigstoreWe’re so happy that you want to contribute to Sigstore.Here’s what you need to do to participate:1 — Register to participate on the Hacktoberfest website and read their guide.2 — Browse our participating repos (view below)3 — Get your keyboard ready to start coding on October 1!Participating ReposThis year, two of the Sigstore Repos will be participating:cosigndocsStay tuned as more issues will be tagged ‘hacktoberfest’ ready.Questions?Sigstore Documentation is available here.Not sure where to start or have specific questions?Join the Sigstore Slack.Join us for the next Sigstore Office Hours on October 11 @ 16:30 UTC."
