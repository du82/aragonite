title = "Sigstore January Roundup - Sigstore Blog"
full_description = "This month, we are thrilled to have announced the 1.0 release of sigstore-python. This project started a year ago to provide a Sigstore-compatible client similar to cosign, but built entirely with Python and easily adoptable by the Python ecosystem.A big thank you to all the contributors and maintainers for making it to 1.0! Read moreLatest Blog PostsThank you to Andrew, Felix and Zachary for contributing the following blog posts this month. You should definitely give them a read:A Guide to Running Sigstore Locally by Felix Wolff and Andrew BlockWhy you can’t use Sigstore without Sigstore by Zachary NewmanUpcoming EventsCloudNativeSecurityCon NACloudNativeSecurityCon NA is happening February 1 – 2 in Seattle, WA.Congratulations to many members of the Sigstore community giving talks!Wednesday, February 1 11:50 am So You Want to Run Your Own Sigstore: Recommendations for a Secure Setup by Hayden Blauzvern 2:15 pm Lightning Talk: Securing Your Source Repositories - 5 Tips to Get Started! by Billy Lynch 3:50 pm Who Are You? I Really Want to Know…the Magic Behind OIDC by Eddie ZaneskiThursday, February 2 3:50 pm Not All That’s Signed Is Secure: Verify the Right Way with TUF and Sigstore by Zachary Newman & Marina Moore 4:40 pm “Keyless” Code Signing Without Fulcio Nathan SmithFOSDEMFOSDEM is a free event for software developers and takes place in Brussels every year. This year, it’ll be on the weekend of February 4 – 5.Don’t miss the Sigstore talk in the Security Devroom on Saturday, February 4 at 16:00 What Does Rugby Have To Do With Sigstore? Learning Sigstore via Rugby by James Strong & Lewis Denham-Parry.Many of the Sigstore community folks will be attending the conference, so keep an eye out and say hello!Sigstore LandscapeThe Sigstore Landscape is growing its collection of ecosystem technologies with two new additions: Caddy Server (under “Signed With”) and Open Policy Containers (under “Integrations”).If you’d like to add your projects, here are all the details you need.Office HoursTwice a month (or fortnightly, if you please), we host Sigstore Office Hours. Everyone is welcome to join to discuss how you use Sigstore. If you didn’t know about them, feel free to watch the previous ones here.https://www.youtube.com/watch?v=x86jxe3yfks&list=PLM6mY5TOhY1GKMC-CbRPzm496wTpPyDLNLatest ReleasesSigstoreSigstore is currently on version 1.5.1.CosignCosign is container signing, verification and storage in an OCI registry.The community is working steadily towards a release of Cosign 2.0. The pre-release for Cosign 2.0 is out: v2.0.0-rc.0. Feel free to try it out, but know there are many breaking changes from 1.0 and the prereleases may continue to change. Otherwise, please use v1.13.1.FulcioFulcio issues code-signing certificates bound to OpenID Connect identities for use within the Sigstore ecosystem. Its most recent release is v1.0.0.GitsignKeyless Git signing with Sigstore! Its latest release is v0.5.2. Highlights include new features for the credential cache - systemd support and the ability to forward interactive flows over the socket (incl. over SSH)!RekorRekor’s aims to provide an immutable tamper-resistant ledger of metadata generated within a software projects supply chain. Its latest release is v1.0.1.Join the CommunityWe’re looking forward to a great 2023 with all our maintainers, contributors and users.We take pride in being friendly to everyone, including new folks, and fostering a welcoming and safe environment. There is always room for more people in our community.Find us on Slack and Twitter @projectsigstore.See y’all next month!"
