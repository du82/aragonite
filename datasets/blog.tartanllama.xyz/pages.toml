full_description = '''I gave a talk entitled "How Rust Gets Polymorphism Right" at the Edinburgh Rust Meetup. As of Nov 2017 it has 5000 views and was on the front page of Hacker News. I was the spec editor for the runtime and tools groups, and wrote the profiling APIs. I also ported LLDB to AMD's HSA implementation. Heterogeneous compiler and debugger work, mostly based on LLVM, Clang and LLDB. Also contributing to various standards bodies. Worked on a 3D maps platform. I used Hadoop to port ordinance survey data for the whole of Britain to the platform, and wrote a Lunar Lander game using the SDK. Worked on the build team, implementing a build archival system, setting up automated testing, providing support for the developers.'''
