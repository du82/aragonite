["https://blog.trailofbits.com/2024/09/10/sanitize-your-c-containers-asan-annotations-step-by-step"]
title = "Sanitize your C++ containers: ASan annotations step-by-step - The Trail of Bits Blog"
full_description = 'Sanitize your C++ containers: ASan annotations step-by-stepDominik Czarnota, Dominik KlembaSeptember 10, 2024application-security, llvmAddressSanitizer (ASan) is a compiler plugin that helps detect memory errors like buffer overflows or use-after-frees. In this post, we explain how to equip your C++ code with ASan annotations to find more bugs. We also show our work on ASan in GCC and LLVM. In LLVM, Trail of Bits added annotations to the libc++ std::string and std::deque containers, enabled custom allocators for container annotations, and fixed bugs in libc++!Container overflowsAs mentioned in our “Understanding AddressSanitizer” blog post, ASan cannot automatically detect invalid memory accesses into allocated memory. Instead, it provides an API for users to mark memory regions as accessible or inaccessible. The C++ standard libraries leverage those APIs to annotate STL containers, which helps ASan find container overflow bugs.This is shown in action in figure 1, where we compile with ASan and no optimizations (-O0 -fsanitize=address -D_GLIBCXX_SANITIZE_VECTOR flags). This functionality is supported by both clang++ and g++. Also, if libc++ is used (-stdlib=libc++), the GLIBCXX macro can be omitted since libc++ (the LLVM’s C++ standard library) enables container annotations by default.Figure 2 shows the result of running this code, where we can see that the invalid memory access was detected as a container-overflow error (since the shadow memory was poisoned with the “fc” byte).#include <vector> int main() { std::vector<char> v; // Set capacity to 8, the size remains 0 v.reserve(8); // Access vector past its size, but before its capacity (8) return *(v.data()); }Figure 1: Example of container overflow detection (Note: we do not show MSVC on CompilerExplorer since it does not have ASan installed yet)==1==ERROR: AddressSanitizer: container-overflow on address 0x502000000010 at pc 0x000000401315 bp 0x7ffdd7e0c670 sp 0x7ffdd7e0c668 READ of size 1 at 0x502000000010 thread T0 #0 0x401314 in main /app/example.cpp:10 #1 0x7a47d5229d8f (/lib/x86_64-linux-gnu/libc.so.6+0x29d8f) #2 0x7a47d5229e3f in __libc_start_main (/lib/x86_64-linux-gnu/libc.so.6+0x29e3f) #3 0x401174 in _start (/app/output.s+0x401174) … Shadow bytes around the buggy address: =>0x502000000000: fa fa[fc]fa fa fa fa fa fa fa fa fa fa fa fa fa Shadow byte legend (one shadow byte represents 8 application bytes): Container overflow: fcFigure 2: ASan detecting the bug from figure 1. The output is truncated to show only relevant information.However, the C++ standard libraries have varying levels of support for detecting container overflows. The table below summarizes current support for this detection.LibraryAnnotated containersCommentlibstdc++ (GCC)std::vector (GCC 8)Requires -D_GLIBCXX_SANITIZE_VECTOR macro during compilation.For std::string and std::deque, see the “GCC / libstdc++ annotations” section below.libc++ (LLVM)std::vector (LLVM 3.5), std::deque (LLVM17), long std::string (LLVM18), short std::string (not yet released)Container annotations are enabled by default. Can be disabled with environment variable ASAN_OPTIONS=detect_container_overflow=0 (does not require recompilation)msvc++std::vector and std::string (Visual Studio 2022 17.2 and 17.6)Container annotations are enabled by default. Can be disabled with -D_DISABLE_VECTOR_ANNOTATION -D_DISABLE_STRING_ANNOTATION.AddressSanitizer APIThe recommended way to annotate memory is using the ASAN_POISON_MEMORY_REGION(addr, size) and ASAN_UNPOISON_MEMORY_REGION(addr, size) macros, which set the appropriate values in shadow memory. (If ASan is not enabled during compilation, then those macros only evaluate their arguments without calling annotation functions).As shown in figure 3, we can find more details on using the ASAN_POISON_MEMORY_REGION macro by reading the docstring of the underlying _asan_poison_memory_region function./// Marks a memory region ([addr, addr+size)) as unaddressable. /// /// This memory must be previously allocated by your program. Instrumented /// code is forbidden from accessing addresses in this region until it is /// unpoisoned. This function is not guaranteed to poison the entire region - /// it could poison only a subregion of [addr, addr+size) due to ASan /// alignment restrictions. /// /// \note This function is not thread-safe because no two threads can poison or /// unpoison memory in the same memory region simultaneously. /// /// \param addr Start of memory region. /// \param size Size of memory region. void __asan_poison_memory_region(void const volatile *addr, size_t size);Figure 3: A comment describing __asan_poison_memory_regionApart from those macros, the asan_interface.h file provides functions that allow for customizing the value set in shadow memory and helping with annotating certain containers, such as the __sanitizer_annotate_contiguous_container and __sanitizer_annotate_double_ended_contiguous_container functions. The documentation for the former function is shown in figure 4./// \note Use this function with caution and do not use for anything other /// than vector-like classes. /// /// \param beg Beginning of memory region. /// \param end End of memory region. /// \param old_mid Old middle of memory region. /// \param new_mid New middle of memory region. void __sanitizer_annotate_contiguous_container(const void *beg, const void *end, const void *old_mid, const void *new_mid); Figure 4: A comment describing __sanitizer_annotate_contiguous_containerThis function is used, for example, during the std::vector::pop_back operation to mark the memory of the removed element as inaccessible as shown in figure 5. Under the hood, it poisons the shadow memory with the “fc” value to report memory accesses to the corresponding memory addresses with the “container-overflow” error.Figure 5: Illustration of memory poisoning after pop_back called on five element std::vectorNotice that in pop_back, the function has to be called after destructing the element as that memory becomes inaccessible.A step-by-step exampleHere, we illustrate a proper way of adding ASan annotations to a container based on an example stack class with a limited interface. The stack data is stored in a contiguous buffer and implements the functionality shown in figure 6. The full code for the stack can be found here.class stack { public: using T = int; stack(); stack(const stack&) = delete; ~stack(); bool empty() { return size == 0; } void push(T const &v); void pop(); T& top() { if(empty()) throw std::runtime_error("Stack is empty"); return buffer[size - 1]; } private: T* buffer; size_t size = 0; size_t capacity = 32; // Returns next capacity, used only when buffer grows size_t next_capacity() { return 2 * capacity; } void grow_buffer(); }; Figure 6: Declaration of a simple stack classContainer annotation wrappersThe first step when adding ASan annotations is determining if ASan APIs are available. If they’re not, using ASan’s functions will lead to an undefined reference linker error when compiling without ASan. For that, we can use the __has_feature preprocessor macro to create a wrapper function for annotating our container, which will do nothing if compiled without ASan. Since our stack data is kept in a contiguous buffer, we will annotate it with the __sanitizer_annotate_contiguous_container function.#if __has_feature(address_sanitizer) void annotate_contiguous_container(void *container_beg, void *container_end, void *old_mid, void *new_mid) { if(container_beg != nullptr) __sanitizer_annotate_contiguous_container(container_beg, container_end, old_mid, new_mid); } #else void annotate_contiguous_container(void *, void *, void *, void *) { } #endif Figure 7: Annotation wrapper function to be used in our implementationNext, we add the annotate_new and annotate_delete functions—the former to poison a buffer of our container after it is allocated and the latter to unpoison it before deallocating it.// Annotates a new buffer. void annotate_new() { // buffer points to the new memory buffer // capacity and size have value of the size of new buffer annotate_contiguous_container(buffer, buffer + capacity, buffer + capacity, buffer + size); } // Annotates (unpoisons) buffer before deallocation void annotate_delete() { // should be called before deallocation annotate_contiguous_container(buffer, buffer + capacity, buffer + size, buffer + capacity); } Figure 8: Functions for updating container annotations after a new buffer allocation and just before buffer deallocationNext, we need to create helper functions to update the annotations when we add or remove an item from the container, as shown in figure 10.Note that the specifics of these functions depend on how the container stores its data. In containers with one moving end, as with vectors or our stack, those functions will simply handle poisoning or unpoisoning memory before adding and after removing an object. In other cases, such helper functions may require an argument, such as the old size or the number of objects that will be added.// Unpoisones memory for a new element, *before* adding it void annotate_increase() { annotate_contiguous_container(buffer, buffer + capacity, buffer + size, buffer + size + 1); } // Poison memory *after* removing an element void annotate_shrink() { annotate_contiguous_container(buffer, buffer + capacity, buffer + size + 1, buffer + size); } Figure 9: Helper functions to update container annotationsAnnotating the containerFinally, we use the helper functions in the container constructors, destructors, and methods that update its underlying size or capacity. Note that the order of operations is very important here. If our code accesses memory before unpoisoning it, ASan will detect a violation and crash. It’s also important to remember to unpoison memory before deallocation since different memory allocators may need to access the underlying memory (as it may store some metadata before or inside the allocated buffer).Shrinking the size is usually simpler than increasing it because the buffer can be moved to a new memory area while growing its size. In our stack class, we poison the memory of one removed object in a pop function, as shown in figure 14. The annotate_shrink function has to be called at the very end, after the container is fully modified.stack() { annotate_new(); } ~stack() { annotate_delete(); free(buffer); } void pop() { if(empty()) { throw std::runtime_error("Stack is empty"); } size -= 1; annotate_shrink(); } void push(T const &v) { if(size == capacity) grow_buffer(); annotate_increase(); buffer[size] = v; size += 1; } Figure 10: Implementation of a default constructor and the destructor; helper functions are used to update ASan annotationsTo manage buffer reallocation during push, we use the grow_buffer function shown in figure 15. This function maintains the buffer’s size and ensures the new buffer and capacity are correctly annotated. Consequently, by the end of the function’s execution, the object is accurately updated. This approach simplifies the push operation, as we no longer need to consider multiple buffers. It’s enough to unpoison memory for the new element, regardless of whether the capacity changed, as shown in figure 11. This last point is important to remember; for example, we discovered an issue in an ABI function of the std::basic_string class in libc++ that caused the string to have an incorrect size. This was overlooked because the function was never employed in a relevant context until we began integrating annotations. The issue, however, will stay in libc++ ABIv1 forever despite a replacement we created. While unlikely, changes to the string implementation that rely on the correct results from that function could lead to serious issues.// A function increasing capacity, but not modifying stacks content void grow_buffer() { size_t new_capacity = next_capacity(); // Get a size of the new (bigger) buffer T *new_buffer = (T *)calloc(new_capacity, sizeof(T)); // Allocate a new buffer for(size_t i = 0; i < size; ++i) { new_buffer[i] = std::move(buffer[i]); // Move all elements from the previous container into the new one. } annotate_delete(); // Unpoison old buffer (prepares for deallocation) free(buffer); // Free the buffer. buffer = new_buffer; // Assign new buffer. capacity = new_capacity; // Update capacity. annotate_new(); // Annotate (poison) new buffer. AT THE VERY END } Figure 11: Implementation of a helper function changing the buffer to a bigger oneTesting our annotations in practiceAnd with that, we’re done! With the entire stack container implemented, (almost) every invalid access to memory that is allocated triggers an error. We can test it with a main function, as shown in figure 18 (full source code here); when run on Clang++15, this function gives the output shown in figure 13.int main() { stack s; stack::T* ptr; s.push(0); s.push(1); s.push(2); s.push(3); // 4 elements ptr = &s.top(); // Save address of the top element in ptr s.pop(); // Remove the top elements (ptr does not change) std::cout << *ptr << std::endl; // ERROR: access to already removed element } Figure 12: An implementation of a program accessing a removed elementclang++ -fsanitize=address listing-x-src.cpp -o program ./program ================================================================= ==38540==ERROR: AddressSanitizer: container-overflow on address 0x60c00000004c at pc 0x559a9925a93c bp 0x7fffc06038d0 sp 0x7fffc06038c8 READ of size 4 at 0x60c00000004c thread T0 #0 0x559a9925a93b in main (/home/username/CLionProjects/ simple-annotations/a.out+0xde93b) (BuildId: b4b3601668152bb18905aec484b9234f2fabd710) [...] 0x60c00000004c is located 12 bytes inside of 128-byte region [0x60c000000040,0x60c0000000c0) allocated by thread T0 here: [...] #1 0x559a9925b2bd in stack::grow_buffer() [...] Shadow bytes around the buggy address: [...] 0x0c187fff7ff0: 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 =>0x0c187fff8000: fa fa fa fa fa fa fa fa 00[04]fc fc fc fc fc fc 0x0c187fff8010: fc fc fc fc fc fc fc fc fa fa fa fa fa fa fa fa 0x0c187fff8020: fa fa fa fa fa fa fa fa fa fa fa fa fa fa fa fa [...] Figure 13: Error detected by ASan for our container overflow annotations for the program from figure 12 compiled with Clang++ 15. Because there are 3 elements (each of 4 bytes) left in the container, fa 00[04]fc is in shadow memory, as 00 describes the first two objects (8 bytes) and 04 the last one.How we improved container annotationsAs mentioned earlier, we made many improvements to C++ container annotations in libc++. We have detailed some lessons learned during that endeavor which should help future developers implement annotations in their custom containers and custom allocators.Vector annotationsWith our improvements, the std::vector container in libc++ is annotated by ASan when a custom memory allocator is used, whereas previously, it supported only the default memory allocator. This was because the __sanitizer_annotate_contiguo'
