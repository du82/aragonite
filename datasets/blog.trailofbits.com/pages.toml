full_description = "Catching OpenSSL misuse using CodeQLDamien SantiagoDecember 22, 2023codeql, internship-projects, cryptographyI’ve created five CodeQL queries that catch potentially potent bugs in the OpenSSL libcrypto API, a widely adopted but often unforgiving API that can be misused to cause memory leaks, authentication bypasses, and other subtle cryptographic issues in implementations. These queries—which I developed during my internship with my mentors, Fredrik Dahlgren and […] Say hello to the next chapter of the Testing Handbook!Fredrik DahlgrenDecember 11, 2023codeql, static-analysis, testing-handbookToday we are announcing the latest addition to the Trail of Bits Testing Handbook: a brand new chapter on CodeQL! CodeQL is a powerful and versatile static analysis tool, and at Trail of Bits, we regularly use CodeQL on client engagements to find common vulnerabilities and to perform variant analysis for already […] Publishing Trail of Bits’ CodeQL queriesPaweł PłatekDecember 06, 2023c/c++, codeql, cryptography, goWe are publishing a set of custom CodeQL queries for Go and C. We have used them to find critical issues that the standard CodeQL queries would have missed. This new release of a continuously updated repository of CodeQL queries joins our public Semgrep rules and Automated Testing Handbook in an effort […] Look out! Divergent representations are everywhere!Andreas KellasNovember 10, 2022binary-ninja, codeql, internship-projects, research-practiceTrail of Bits recently published a blog post about a signed integer overflow in certain versions of SQLite that can enable arbitrary code execution and result in a denial of service. While working on proof-of-concept exploits for that vulnerability, we noticed that the compiler’s representation of an important integer variable is semantically […] Finding unhandled errors using CodeQLFredrik DahlgrenJanuary 11, 2022codeqlOne of your developers finds a bug in your codebase—an unhandled error code—and wonders whether there could be more. He combs through the code and finds unhandled error after unhandled error. One lone developer playing whack-a-mole. It’s not enough. And your undisciplined team of first-year Stanford grads never learned software engineering. You’re […]"
