full_description = "Attestations: A new generation of signatures on PyPIWilliam WoodruffNovember 14, 2024open-source, supply-chain, ecosystem-security, engineering-practiceFor the past year, we’ve worked with the Python Package Index (PyPI) on a new security feature for the Python ecosystem: index-hosted digital attestations, as specified in PEP 740. These attestations improve on traditional PGP signatures (which have been disabled on PyPI) by providing key usability, index verifiability, cryptographic strength, and provenance properties that bring […] Enhancing trust for SGX enclavesArtur CyganJanuary 26, 2024confidential-computing, ecosystem-security, open-source, supply-chainCreating reproducible builds for SGX enclaves used in privacy-oriented deployments is a difficult task that lacks a convenient and robust solution. We describe using Nix to achieve reproducible and transparent enclave builds so that anyone can audit whether the enclave is running the source code it claims, thereby enhancing the security of […] Celebrating our 2023 open-source contributionsTrail of BitsJanuary 24, 2024blockchain, cryptography, ecosystem-security, machine-learning, open-source, osquery, supply-chainAt Trail of Bits, we pride ourselves on making our best tools open source, such as Slither, PolyTracker, and RPC Investigator. But while this post is about open source, it’s not about our tools… In 2023, our employees submitted over 450 pull requests (PRs) that were merged into non-Trail of Bits repositories. This demonstrates our […] Our audit of PyPIWilliam WoodruffNovember 14, 2023open-source, supply-chain, ecosystem-security, auditsThis is a joint post with the PyPI maintainers; read their announcement here! This audit was sponsored by the Open Tech Fund as part of their larger mission to secure critical pieces of internet infrastructure. You can read the full report in our Publications repository. Late this summer, we performed an audit […] Adding build provenance to HomebrewWilliam WoodruffNovember 06, 2023cryptography, ecosystem-security, engineering-practice, open-sourceThis is a joint post with Alpha-Omega—read their announcement post as well! We’re starting a new project in collaboration with Alpha-Omega and OpenSSF to improve the transparency and security of Homebrew. This six-month project will bring cryptographically verifiable build provenance to homebrew-core, allowing end users and companies to prove that Homebrew’s packages […]"
