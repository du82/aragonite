["https://blog.trailofbits.com/2013/07/24/iverify-is-now-available-on-github"]
title = "iVerify is now available on Github - The Trail of Bits Blog"
full_description = "iVerify is now available on GithubDan GuidoJuly 24, 2013apple, iverify, malwareToday we’re excited to release an open-source version of iVerify!iPhone users now have an easy way to ensure their phones are free of malware.iVerify validates the integrity of supported iOS devices and detects modifications that malware or jailbreaking would make, without the use of signatures. It runs at boot-time and thoroughly inspects the device, identifying any changes and collecting relevant artifacts for offline analysis.In order to use iVerify, grab the code from GitHub, put your phone in DFU mode and run the iverify utility. Prompts on screen will indicate whether surreptitious modifications have been made. Visit the GitHub repository for more information about iVerify.If you enjoyed this post, share it: Twitter LinkedIn GitHub Mastodon Hacker News"
