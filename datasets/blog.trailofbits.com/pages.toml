full_description = "A trail of flipping bitsJoop van de PolDecember 18, 2023attacks, cryptographyTrusted execution environments (TEE) such as secure enclaves are becoming more popular to secure assets in the cloud. Their promise is enticing because when enclaves are properly used, even the operator of the enclave or the cloud service should not be able to access those assets. However, this leads to […] Security flaws in an SSO plugin for CaddyDavid Pokora, Maciej Domanski, Travis Peters,September 18, 2023attacks, audits, dynamic-analysis, exploits, go, mitigations, program-analysis, semgrep, static-analysis, vulnerability-disclosureWe identified 10 security vulnerabilities within the caddy-security plugin for the Caddy web server that could enable a variety of high-severity attacks in web applications, including client-side code execution, OAuth replay attacks, and unauthorized access to resources. During our evaluation, Caddy was deployed as a reverse proxy […] Readline crime: exploiting a SUID logic bugRory MFebruary 16, 2023attacks, exploits, linuxI discovered a logic bug in the readline dependency that partially reveals file information when parsing the file specified in the INPUTRC environment variable. This could allow attackers to move laterally on a box where sshd is running, a given user is able to login, and the user’s private key […] Stranger Strings: An exploitable flaw in SQLiteAndreas KellasOctober 25, 2022attacks, internship-projects, vulnerability-disclosureTrail of Bits is publicly disclosing CVE-2022-35737, which affects applications that use the SQLite library API. CVE-2022-35737 was introduced in SQLite version 1.0.12 (released on October 17, 2000) and fixed in release 3.39.2 (released on July 21, 2022). CVE-2022-35737 is exploitable on 64-bit systems, and exploitability depends on how the program is […] Towards Practical Security Optimizations for BinariesMichael D. BrownMarch 25, 2022attacks, exploits, reversing, static-analysisTo be thus is nothing, but to be safely thus. (Macbeth: 3.1) It’s not enough that compilers generate efficient code, they must also generate safe code. Despite the extensive testing and correctness certification that goes into developing compilers and their optimization passes, they may inadvertently introduce information leaks […]"
