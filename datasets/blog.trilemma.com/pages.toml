title = "Trilemma Adventures: 2009"
description = "Short role-playing adventures, musings on the hobby, illustration, and further afield."
full_description = '''Monday, 2 November 2009 Giant Spider Costume Each Hallowe'en, I get the urge to do something more interesting than just giving out candy and taking our kids around the block - wouldn't it be neat to have some scary street theatre going on? Imagine a ghastly wagon drawn by a team of drooling quasimodos in straight jackets, clanging an iron bell, wailing in agony and despair!I wasn't quite that ambitious this year, but the spirit of Hallowe'en did move me to make a giant spider costume!The main thing I wanted was the sense of independently moving legs. Not dangling legs, but legs that actually walk. I wondered if I built ski-like structures attached to my feet, I could use my legs to control four of the spider legs, and my arms to control the remaining four.After testing a prototype using two paint-roller handles I had at home, I was very encouraged. I went to Home Depot and bought myself sixteen 48" of them (which cleaned out Home Depot!). Paint-roller handles are thin metal tubes, coated with a laminate that takes paint nicely. Tou can saw and drill through them easily, but they're strong, and most importantly they're light enough that they don't stress the home-made hinges I was relying on.I then bought a second-hand set of hockey shoulder pads - a set with nice, large plastic shoulders I could screw into.Actually, making the holes in the hockey pads was the most dangerous part! The synthetic fabric inside the shoulder pads can wind around the drill bit once you punch through the hard exterior. SNAP! Off to to the hardware store again to replace the drill bit.The front and back legs were attached using hinges, to keep them in a vertical plane. The main problem with bent-knee designs is keeping the knees from falling sideways - which works okay for the "pile of spaghetti" costume, but not so well for a functioning spider.The middle pair of legs on each side would be controlled by my arms, so I made universal hinges out of a loop of clothesline wire. Clothesline wire is fantastic, but definitely wear gloves. I duct-taped an old pair of sneakers to the bottom skis, and made a few wobbly laps around the basement.The clothesline wire came in handy in several other places - creating the connection between the skis and the front/back leg pairs, and as flexible connectors for the handles to control the side-leg pairs.To decorate the legs, I bought two thicknesses of pipe-insulating foam, and duct taped the heck out of it, then spray painted it in a mottled pattern.Everyone was surprised that the spider wasn't going to be black, but I wanted as much contrast between the spider's legs and my own body as possible.The head/body and abdomen were made out of inexpensive chicken wire, wrapped in plaster cloth. Chicken wire is a bitch to work with, especially if your shears are rusty, but it bonds to itself nicely and lets you make great volumes.I'd planned to do three coats, but I settled for two in most places, with special reinforcement around the neck and other weight-bearing areas.As soon as I got the eyes on the head, my six year-old refused to be in the same room as it. Since I was going to be lurching after her all night on Hallowe'en, I figured she ought to give it a cute name to help her not be afraid of it. She suggested, 'Bloodie'.Walking around the house with my mask on, it became apparent that there wasn't nearly enough air flow. The neck seal was nice and tight, and the mask has a tendency to fill up with warm exhaled air. After getting a bit dizzy, I realized I could manage it by deliberately blowing out of the mouth-hole, which would cause fresh air to come in around the edges.The pedipalps are are dollar-store plastic gourds!As late as Saturday afternoon, I had yet to try all three pieces together. I could just about get the legs on by myself, but I needed help for the other pieces. As the clocked ticked down to trick-or-treating time, my construction got more and more improvised.The abdomen was held on by a garrotte-like loop of clothesline wire, which I kept off my neck by passing it through a luggage strap that I fastened around my chest.The head was then fastened on using a combination of clothesline and bungee cords. One problem was that the abdomen hung down limply like a backpack, instead of sticking straight out - we tried some last-minute engineering but we couldn't make it work in the twilight, so I went out droopy!As I was sealed in, I got a brief spell of claustrophobia. The abdomen pushed the head far forward, so all I could see was a patch of ground directly in front of me - only a foot or so past my forelegs.I would need a spider-herder! Fortunately I had a couple of volunteers, my wife (who seems to have escaped the evening without being in a photo) and my sister-in-law, Julain:Looking at this photo now, I realize her make-up job was way more hideous than my spider! She looks like she's possessed by the ghost of Quentin Crisp. *shiver*I laugh when I see this photo, the caption ought to be, "Middle-aged weirdo dresses up to hiss at your children." I guess the effect was much better in person because Hallowe'en night itself was a blast.People kept stopping us to take photos of us, or have their friends take one of them with us, and a couple of cars were nearly rear-ended.That made up for the fact that walking around like this is like trying to manage two sets of ski equipment at the same time while working out in a sensory deprivation tank. Just crossing the road was an act of faith in my handlers. I could see my legs light up in the car headlights, but very little else!I tripped several times on the sidewalk, but fortunately the only fall was during the test run in the afternoon. (Avoid grass. And curbs.)Fortunately I could hear the shrieks and laughs of the other passers by, which was a lot of fun. All in all a great success! Posted by Michael Prescott at 11:24 2 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: halloween Tuesday, 16 June 2009 Unbelievably Good Banana Curry I ad-libbed a curry yesterday, and the leftovers were so good today I nearly ate my wife's portion. It's a sweet, very mild curry - which was great for our kids. Adding the banana is something my father does!Here's the recipe as best I can remember it:Fry 1lbs ground chicken or turkey until cooked, set aside;In a pot, fry 2 medium onions, 1 zucchini until cooked;Add spices, allow them to roast for a minute or two:1.5 tsp curry powder1 tsp turmerica pinch of cinnamonAdd the remaining ingredients:796mL can of diced tomatoesthe cooked meat2/3 of a medium banana, chopped1/4 cup dried currantsBring to gentle boil, then reduce heat to simmer a bit;Add salt, cayenne pepper to taste.Mmm, curry. I forgot garlic, that would probably be good to add.For a vegetarian version, I usually replace the meat with chick peas (man, I love chick peas) and immediately after adding the tomato I take a wand blender and blend the chick peas, zucchini, onion and tomato until some of it is pureed (makes it nice and thick) but there are still identifiable bits in it. Posted by Michael Prescott at 19:07 1 comment: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: recipe Monday, 18 May 2009 The Zero-Prep Scavenger Hunt for Kids We were trying to decide what to do with the kids today when it occurred to me that it would be fun to have a scavenger hunt. The problem was that I hadn't prepared anything ahead of time, and the kids were already antsy enough that there wasn't time to do anything.So I faked a break-in.I kidnapped one of Morgan's toy mice, grabbed a handful of furniture from its house along with it, and stuffed them into my jacket pocket. Leaving a few telltale items sprinkled on the porch, I called Morgan down to investigate.The star of the day's entertainment was our cheap electronic stud finder, which I claimed was a toy detector. It has green and red lights, it makes an authoritative-sounding beeping noise, and a sneaky grownup can control when it goes off by surreptitiously sliding a finger behind it while it's on.Aiming the toy detector at various parts of our neighbourhood, we quickly determined that the stolen toys had been taken in the direction of ... the park!We came back in to get sweaters and snacks for the excursion. Morgan knew something was up; she's nearly six, old enough to innately grasp the difference between reality and Daddy's silly tricks, even if she is still sometimes confused about where the border is.Once she was satisfied that there was fun to be had, however, she was willing to suspend her disbelief, and eagerly added some decorative bedding to the tupperware container I had brought to store recovered toys.Once I had established the premise, the stud finder worked amazingly well. Danielle and I strolled along the path, and I just had to point the thing into the bushes and off the kids went with gusto. Usually this was a bush we had just passed - a side effect of the "zero-prep" aspect of the scavenger hunt.The kids got so excited by all of this that they started asking passers-by if they had seen the lost mouse. After an hour of this, we came across one couple who had already heard of our search from other park-goers! Isn't it amazing how society rallies around a crisis?One of the nice things about the zero-prep scavenger hunt is that you can fine-tune things as you go. When the kids are climbing trees, chasing each other, snacking, or otherwise keeping themselves busy, you can just enjoy the scenery. But whenever there's a lull in the action, you can drop a toy or even just bleep the toy detector and off they scurry!Here's a tip, though: if you drop a toy, remember where you dropped it. After dropping a charming, faux-wicker mouse suitcase in some bushy grass, I forgot to look around for landmarks. Or a decent landmark, at any rate. I could have sworn it was by this distinctive-looking tufty bit.. but then, you're surrounded by tufty bits. It's amazing how fast a lawn can turn on you.And then, you have to explain why the toy detector suddenly isn't working. "Interference from the bridge?" was the best I could come up with.Unable to bear the thought that I was personally responsible for the loss of this helpless, cherished toy, I suggested we link arms and walk through the field in a line, like you see on the TV when volunteers are helping the police looking for a body.The parallel was somewhat uncomfortable, and we got quizzical looks from the joggers and bicyclists whizzing past us as we inched along. But never fear, the suitcase turned up and my "decent parent" status was saved.Somehow, Morgan never caught on to what I was doing. In the end, she concluded that I must have set up all these toys two days earlier, "On your way home from work!"My only disappointment was that the kids couldn't operate the toy detector themselves, for obvious reasons. Had they been able to do that, I'm sure we'd have been running full tilt the whole time! Posted by Michael Prescott at 14:48 3 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: games, kids Tuesday, 12 May 2009 Service Level Agreement Posted by Michael Prescott at 20:28 1 comment: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: comic, silly Tuesday, 5 May 2009 What I Love About Einstein I'm working my way through a copy of Robert W. Lawson's translation of Einstein's Relativity. This isn't a mathematical treatise, but a tiny paperback written by Einstein in 1916 to explain relativity to non-physicists.It's a quaint little book, partly because of the language - but most strikingly by the way it stands in stark contrast to the modern era of predigested sound bites that deliberately pander to the gut instincts and short attention span of the intended audience.As Einstein writes in the preface,"Despite the shortness of the book, [it presumes] a fair amount of patience and force of will on the part of the reader."I don't tote this around to look smart on the subway, that furrowed brow isn't deep thought so much as frustration at the fuzziness of my own mind. No, I picked this up after reading something about relativity and suddenly becoming desperately curious to learn just how Einstein was able to envision a description of the world so utterly different than the classical view that preceded it.Not in the sense of, "My God, just how smart was he?" but literally: how do you make a discovery like this?In case you're rusty, relativity is a refinement over the venerable Euclidean geometry, whose origins go back as far as 300 B. Euclidean geometry views of the world as composed of infinitely long straight lines, utterly flat planes, and perfect spheres. I first started learning it in primary school, and learned more about it for so many years afterwards that its abstracted, clinical view become second-nature to how I looked at every day things.My kitchen table may not be a perfect plane, but that's table's problem, right?As Einstein puts it,"By reason of your past experience, you would certainly regard everyone with disdain who should pronounce even the most out-of-the-way proposition of this science to be untrue. But perhaps this feeling of proud certainty would leave you immediately if someone were to ask you: 'What, then, do you mean by the assertion that these propositions are true?'"Geometry of any sort is just a mathematical contrivance, useful to the extent that it can be used to describe reality. If you get in a convertible driving 80 km/hr, and you throw a baseball ahead of you at 50 km/hr, classical mechanics would suggest that the baseball is would start off traveling at 130 km/hr, relative to the road. So far so good.The key observation that spurred Einstein forward was the experimental discovery that the speed of light is not relative to the motion of the observer. Briefly, if you're zipping along at half the speed of light, and someone on the road shines a laser after you, classical mechanics would predict that the laser passes you at half the speed of light. What actually happens is that the laser light zips by you at full speed.In fact, no matter how fast you're going, in whatever direction, light will still pass you at the same speed, regardless of the motion of the light source relative to you.This is bizarrely counter-intuitive, to say the least - and if you think that's weird, the implications of Relativity are even more bizarre. The fact that Einstein came up with a rigorous geometry that made sense of this state of affairs was such a coup that his name became a household synonym for 'genius'.The paradoxes of Relativity make for fascinating reading, but it's not my goal to rehash them here. What I want to do is highlight what Einstein had to do to get to a solution, and that was to question his own assumptions.These weren't assumptions that had been given to him explicitly, like unjust laws he intuitively knew had to be overthrown and - dammit - he wa'''
