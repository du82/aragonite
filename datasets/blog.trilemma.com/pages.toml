full_description = '''Showing posts with label alm. Show all posts Showing posts with label alm. Show all posts Monday, 17 January 2022 After the Lords of Memory v0.23 After a very long hiatus, here's a new version of my home system, After the Lords of Memory.After the Lords of Memory v0.23If you haven't followed along:Like many games, probably, the impetus for writing it lies somewhere between an elaborate preparation for a specific campaign and a laborious expression of my preferences.This version is massively cut down from the previous version (which was nearly 80 pages). I work in expand/contract phases, and what I'd left myself was a core system smothered in a big, bloated pile of half-written subsystems.Inspired by the wave of chopped-down, very short systems like World of Dungeons, Knave, and so on, this is me clearing the decks, keeping only what is definitely the solid core. Something small enough to share (possibly even right on game night) and clearly communicate expectations.This is not a "complete" game. There's nothing on creatures, buying things, treasure, or moving around in the wilderness. (All that is left to the GM.) Nor is the text edited!This version still doesn't meet all of my original design goals. As I summarized in 2019:The core works, it's been playtested in a home game over a period of years--you can make characters, take them places, adventure, fight, advance, get injured and so on.However, the whole point of writing this game was to enable a particular campaign style, and that hasn't emerged organically from my playtest campaign. If you read the design goals post, essentially what you get is a fairly simple, theatre-of-the-mind game where grubby villagers go forth and either die or become heroes. You don't get geographic advancement.However, this does feel like a chassis to heading towards them once more.First up, Rituals. One of the (aspirational) sources of geographic advancement are the secret demands that players. These were just buried by complexity. In this version, hopefully, they'll operate a little more like the player-facing quest generator they were meant to.Anyways, here we are for now! Posted by Michael Prescott at 00:08 10 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: alm, games, rpg Sunday, 27 January 2019 After the Lords of Memory Google Plus is shutting down, and so the tiny discussion/playtest community for After the Lords of Memory is going to fall off a cliff like so much eroding shoreline. ALM is a fantasy RPG; it's far from finished, and I think it still has an ungainly puberty ahead of it before it actually does what I want it to do. This is a much ado about nothing post, because I'm doing my best to avoid putting out a new revision of ALM, even though I want to. I'm focusing on the adventure compilation instead. My design goals are written up in the first post about it. If you want to follow along ALM development (when it resumes), I will post revisions here, and tag them so you can find just the ALM posts if you want. For now, the latest revision is v0.19. The core works, it's been playtested in a home game over a period of years--you can make characters, take them places, adventure, fight, advance, get injured and so on. However, the whole point of writing this game was to enable a particular campaign style, and that hasn't emerged organically from my playtest campaign. If you read the design goals post, essentially what you get is a fairly simple, theatre-of-the-mind game where grubby villagers go forth and either die or become heroes. You don't get geographic advancement. I have much more work to do there, in particular I think I need to lay out the way the campaign is supposed to work in a way that's obvious to everyone (GM, players) so that's the default mode of play. By way of inspiration, B/X D&D laid out this very mechanistic, almost boardgame-like turn procedure for how you do a dungeon crawl. You don't have to use it - if you meet up with a posse of hirelings you sent in as advance scouts, presumably rolling initiative and then a reaction roll (hostile!) might seem weirdly out of place, but it's a good set of training wheels (a path, to use my own terminology) to get started with. Anyways, as I said, no news is no news, but here is where news will eventually appear! Posted by Michael Prescott at 16:38 5 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: alm, games, rpg Friday, 2 June 2017 A Turn Sequence Redux Just over a year ago, I mentioned I was working on an RPG. As a reminder, here's my original design intent, and a follow-up piece about a turn sequence for combat. --- I thought I was writing an RPG. What I was really doing was accumulating ideas into a bunch of separate documents that were masquerading as chapters, but were really more like a series of themed notebooks. Like some kind of hoarder, I had been accumulating for years, and when it came time to try to put them together, I realized how much I'd been fooling myself. Each document was layers of incompatible mechanical ideas, stacked ten deep like geological strata. Aaugh! Bashing that into something playable was much more work than I was expecting. Anyways, I'm pleased to say there's now a playable core, thanks to starting a play test campaign. Nothing forces you to make mechanical decisions like creating a character sheet to hand to your unsuspecting victims. I'm now a year into that campaign. Some of the ideas that originally motivated me to start this project in the first place are still waiting to come onto center stage, but the basic structure seems to be solid. It's getting easier and easier to incorporate each new piece without having to use duct tape, with so many other places in firm shape. The next hurdle is slowly transforming this into something that other people can use. I haven't quite decided what process I want to use to do that, but my goal is to start getting bits of it out so that people can tell me what they think. To that end, here's a few pages on getting hurt, how the turn sequence works, a few fighting mechanics, and some commentary on what I want fights to feel like. EDIT: ..and since that's confusing on its own, here's some of the earlier parts. Posted by Michael Prescott at 23:44 No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: alm, games, rpg Wednesday, 30 March 2016 A Turn Sequence Here's my current thoughts on a turn sequence for fast-paced activities, such as combat. By fast paced, I mean those times where the rate of irrevocable, bad things happening outstrips the party's ability to integrate what's going on, talk it over, and come up with a plan that takes into account everything they've perceived. Those times when, suddenly, arrows are skewering the hirelings, one of the ponies bolts and—for some reason—Cyril's on fire. Bad things are happening, quickly. The adventurers have to act now, on partial information, or risk being cut down while they're taking it all in. So, some design assumptions. First of all, turn length is somewhat plastic. A player's turn might represent a few seconds in melee, longer in plains chariot warfare, or half a minute in an archery duel at range. Secondly, this is theater of the mind combat. There are no miniatures to tell you how many enemies and where they're standing, or even where all your companions are standing; to get that information you have to look. If your turn consists of dragging Cyril to the side of the bridge (which is hopefully sheltered from whatever the hell is happening), all you get description about is Cyril. Obtaining information about the battlefield costs time, and maybe lives. Thirdly, turns aren't simultaneous, they're sequential. Shocking things are happening quickly enough that most of the party is simply hesitating: summoning up the gumption to run through the hail of arrows, mind overwhelmed with which direction is safest, looking from Petryn to Garom, seeing what the party's most experienced warriors are starting to do, wrestling with the instinct to chase after the pony, or just standing in shock, listening to that god awful noise Cyril is making. When Petryn charges forward to engage that shadow behind Cyril, the green and awed recruits just watch him go, at least for now. Fourth, while the players have to take turns, every time they do, all the baddies go at once. When Petryn charges to cut down that shadow, the shadow gets an action, as do the unseen archers, as does the troll climbing up over the side of the bridge. It's not looking good for Petryn. At least, that's true in an ambush. Several things modify this default, horrible situation: initiative, cohesion, exertion, leadership, and preparations. Initiative is the readiness and wherewithal to start decisive action. It's held by one side or another - the side with the initiative is choosing the bad things that happen, and forcing the other side to react. The side without can't form plans of their own, at least not without suffering terribly as they ignore the enemy side's moves. If the adventurers have the initiative, they'll have a moment to decide whether and where to strike, rather than simply screaming and trying to hold the line as the shock troops come crashing down on them. When the enemies act, there's a beat where they telegraph their moves, drawing swords before they charge, aiming before they fire, letting an organized party adapt and pre-empt them. Cohesion is the somewhat abstracted, physical arrangement of the party. They may be ready to act, but are they placed to act together? Did they get spread out while crossing the bridge, as the foragers took a moment to look down into the valley. Did Garom stop to make water by that tree stump while the rest moved on ahead? When a cohesive enemy has the initiative, they act decisively and in unison, and they'll do something bad. Maybe they unleash a volley of arrows at every single party member; maybe ten of them all charge Garom, who is forced to meet them alone. When the enemy lacks cohesion, they act piecemeal; a few charge, a few retreat; some bellow orders while others shout competing ideas. Exertion is a per-adventurer resource that lets them interrupt the turn sequence. A point of it lets you join someone else's action (say, charging in with Petryn, or helping to drag Cyril), and two points of it lets you interrupt completely (e.g. going before Petry or anyone else to plant an arrow in the troll's face as it crests the railing). I'll get into the details of exertion another time, but suffice to say it's a precious resource that adventures have in very small quantities, more if they're rested, and much less if they're burdened with armor, gear, or the duties of travel. Exertion can represent a heroic burst of adrenaline-soaked speed, or it might represent sustained vigilance - say, that you had your bow out all along, because you've had a bad feeling ever since leaving Grunford. It's a little bit reconny in the sense that it can establish details in the recent past, but just a little - not so far back that it would seem out of order if it was a two-second shot in a movie's action sequence. Lastly, leadership and preparations. If it's been established that the party is only waiting for Petryn's signal to break for the south end of the bridge, then if Petryn does that, the cohesive parts of the party can all act in unison. The plan might be to run for cover, to fire a volley of arrows, or to do several things at once. Leadership is the second best thing - an impromptu order from someone with the party's trust can galvanize some of them into action, at least as long as the trust and confidence are equal to the chaos at hand. The point of all this is to really double down on perceptual play, emphasizing the difficulty of integrating a complex situation. A party with a plan, the initiative, proper placement, and with a strong leader to issue orders when things go off the rails can be devastating. They act together, steamrolling the enemy piecemeal, while the opposing side struggles to make sense of what's happening and acts as a fragmented mess. A party that kicks in the door is just going to get chewed up immediately, taken out by enemy actions they only recognize after it's too late, if at all! Posted by Michael Prescott at 23:24 No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: alm, games, rpg Saturday, 19 March 2016 Bring Forth the Strange Weapons This afternoon, the adventurers start out as dirty, half-starved villagers emerging from winter to find the landscape around unfamiliar and deadly, steeped in the poisons of the Martoi. The village elders are bitterly divided on the first priority, what will the adventurers do? All the PCs will have to go on, for now, is their intuitions, a precious few parting gifts from the elders, and a Seree-era prefecture map. For those of you following along on the big map, this is Slumbering Tealwood, from Nall Lake in the north to the Near Soont in the south. Let the stocking begin! I have a few immediate 'fronts' - the effects of the poisons; goblin slave-takers moving in to round up the dreamers; a necromancer meddling with the ancestral bargains to the south; chalk mermaids eager for gullible acolytes who will collect magic in return for scraps of power.﻿ Posted by Michael Prescott at 09:57 No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: alm, mapping, rpg Monday, 14 March 2016 Writing an RPG I've been pecking at it long enough that I might as well come clean, I'm writing a fantasy adventure role-playing game. I mention it because I've been sitting on an ever-expanding pile of drafts and design notes, and I the closer it gets to it being something real, the less I've been posting here. That needs to change! Like many games, probably, the impetus for writing it lies somewhere between an elaborate preparation for a specific campaign and a laborious expression of my preferences. So, what am I trying to do? The core idea is geographic advancement. Like a West Marches campaign, it's focused on wilderness exploration, and adventure sites reached across that wilderness. In this game, the regional wilderness map is a central artifact of play, not only so the players can fondly recall where they've been and where they might want to go next, but as a strategic representation of how they're doing, their capabilities, and what they ought to be worrying about next. Where are the threats? Where can they get to quickly? Which trips will exhaust them? Where can they find allies and safety along the way? Which settlements do they have close enough ties with that they can enlist reliable hirelings and replacement PCs? Where do the ancestors ignore their calls? Where is their magic strong? What don't they know at all? This gives treasure a somewhat different role - a talent of silver is always a welcome'''
