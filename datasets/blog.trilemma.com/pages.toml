full_description = "Monday, 30 March 2009 The Unreasonable Effectiveness of data Interesting article by some Google folks about the effect that having access to a really, really huge text corpus has on machine translation. They argue that as the corpus of available documents gets bigger, you need less and less structure in your training data, and less complex algorithms to make use of it.Every ontology - a formal structure representing a set of concepts - is a treaty between people who have agreed to use it, but as the scope gets larger this gets ever more politically fraught, never mind the complexity issues. They reckon the semantic web (in which web content is marked up according to an ontology to make it more machine-legible) is likely to be surpassed at the starting gate by something 'dumber', but informed by a trillion-document corpus.There's an entertaining bit at the end, where they posit that these statistical tools may actually help schema/ontology designers with semantic auto-complete. You start creating a table named CARS with columns MAKE and MODEL, and (because it knows these concepts fly together in the corpus) it could auto-suggest columns such as YEAR and COLOUR. Posted by Michael Prescott at 22:57 No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: google, machinelearning, translation Newer Posts Home Subscribe to: Posts (Atom) I publish illustrated fantasy adventure locations as free PDF downloads. Show the free adventure posts Buy the Compendium!55 adventure locations, regions and settlements for one-shots and stocking your campaign. ENnie awards for Best Adventure and Best Cartography! Buy the 5e Bestiary There are also bestiaries for B/X, Dungeon World, and Year Zero! If you'd like to support this project on Patreon with a recurring tip: Become a Patron! #mc_embed_signup{background:#fff; clear:left; font:14px Helvetica,Arial,sans-serif; } /* Add your own Mailchimp form style overrides in your site stylesheet or