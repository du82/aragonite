title = "Trilemma Adventures: adventure"
description = "Short role-playing adventures, musings on the hobby, illustration, and further afield."
full_description = '''Showing posts with label adventure. Show all posts Showing posts with label adventure. Show all posts Sunday, 3 September 2023 The Fires of Lost Tlarba A dense and dusty city toils under a flickering yellow sky. None may enter, but everyone does. All may leave, but none do.Prickly selks stand at the gates. Their halberds gleam like razors, but their eyes are dull from the heat. The crowd inches forward toward the city's mouth.Sickly smoke rises from the burners along the high walls: a thousand fires of caylum wood, oracle grass, the narcotic feathers of the santhum bird. Travellers cover their mouths and noses, hoping to ward off the stupor that will soon take them. Others breathe it freely in the hopes they will acclimatize. None will.The crowd moves again, and the gates loom overhead. Everyone who passes them is looking for something. Everything lost winds up in Tlarba, they say, so where better to look? This is why you came, but maybe it was a mistake.Robed sisters push and weave through the entry line, offering marks of return. "Sixty silver and we'll fetch you out if you're in too long." Ink-black fingers tug at your skin. "Here is best," she says, jabbing at your cheek. "How long do you want? A year? Three?" She isn't joking.The nut-seller at the side of the road laughs. "Don't waste your money, they can't get out either." He scoops roasted seeds into a folded leaf, "Buy these instead. They won't get you out, but it's best not go in wanting!"As you reach for them, he catches your sleeve and pulls you close."I mean it," he hisses. The humor is gone from his face. "I went in a prince. Choose better!"He shoves you back into the lineup, laughing once more. Stupid man. Who comes here if they have a better choice?The crowd moves again, and you pass the gates. Pilgrims, families, warriors, nobles; their mules, horses, dogs and goats. Each enters in their own way, but the sweet smoke claims everyone who draws breath. You're still thinking of the nut-seller's words as it takes you.* * * d10 Where You Awaken, d20 weeks later A secluded garden terrace, high above the haze of the city. Succulent plants hang from rows of trellis. At bend in a narrow, twisting set of stairs. Fresh air somehow blows from a crack in a clay duct. In a large stone chamber, apparently beneath a temple. Chanting comes from above. The stone floor below you is warm to the touch. Crazily high up, halfway up a cathedral tower. You sit on a stone ledge barely wide enough for the birds. The squares and rectangles of the city spread beneath you endlessly. Sitting at the edge of a fountain in a wide, sunlit plaza. The sparking water cools your fingers and clears your mind. Lying in soft earth in a walled vegetable garden. Half-eaten gourds surround you; seeds are stuck to your face. A public bath house, at the end of a long pool of oily, fragrant water. Bright morning light comes from slats in the ceiling. Smells of cooking waft in from the street outside. In a dark servant's passage somewhere in a grand, stone house. A thin shaft of afternoon light comes from a tiny window. On a luxurious bed, somewhere in the high palace. A huge silver washing basin stands on spindles of dark wood. Curtains billow in the cool night breeze. In the courtyard below, servants are lighting lamps along the edge of a dark, shallow pool. You stumble on the road leading out of the city. The yawning gates are behind you. Hundreds of people queue to enter as you once did, but they pay you no attention. Roll no more, your time in the city is over. It is d4 years after you entered the city. d10Context Exhausted revelers surround you. Some are sleeping, others quietly chatting or combing each other's hair. All are sweaty from dancing, running, or sex. You are pale and sickly. A friend mops the sweat from your brow. The sickest among you is now immune to poison. Damp, mildewed air blows from a hole in the ground. You have found a way into the labyrinth beneath the city, the streets and alleys of an earlier era, buried by time and new stone. Several families are preparing food, setting out tables with fresh bread, pots of stew, and hot, watery wine. Children light fill lanterns and musicians are assembling to begin the song. Adults speak in quiet tones about the business of the city. You and a woman you don't recognize hold opposite ends of a sheaf of scrolls, the collected notes of the high palace locksmith. You are covered in small cuts and bruises. At first they hurt terribly, then not at all, and rub off like actor's paint. A small gathering of students and poets was listening to what you had to say, and is waiting for you to continue. You have been running for your life. Your heart is pounding. In ten seconds, d6 strong youths will arrive to beat you for stealing from them. A guard's knife is bloody in your hands. He lies at your feet. You have found whoever or whatever you came for. d10A bit later, you suddenly remember Living with a family for a time, learning their skills, working as part of the family business. When you touch your callused hands, you remember that they loved you. Squatting in a temple for months. You learned the names of many animals who lived there. If you see them again, they will remember you. Wading through a foul-smelling canal. A youth you had made friends with dallied, and that was the last you saw of them. Watching a pack of feral people eating a man who had stumbled in the gutter. They tore at him while he groaned. You remember the taste of him; perhaps you joined them. Exchanging clothes with a princeling, who then slipped away into the crowds. You still wear his ring, which marks your station in the city. Studying with a monstrous, toad-like philosopher who swore off tools of any kind—not just hand tools, but clothes, dwellings, weapons, books. 'Convenience softens the mind,' it would croak. It is right, and its teachings have unlocked something strange and new within you. Fighting your way through a riot in the Plaza of Jewelers. Many had fallen, and the flagstones were slippery with blood of citizens and palace guards. The shouting still rings in your ears. Many enemies were made that day; some on each side will remember you. Plotting against an order of priests who jealously protect a magical way out of the city. Your fellow conspirators plan to strike tonight, coming up through the servers. They're relying on you find an open the sewer grate in the Plaza of Tears, or they will all drown as they try to escape. Riding with the nut-seller in a royal palanquin. He was dressed like a prince, and proudly pointed out the sights as you passed. A location you sought is now known to you. You remember an age passing, lifetimes, the end of the world—or at least, the city. An eternity of wind gnawed the stone blocks of the walls and palaces down to nothing. For aeons, you knew only blowing sand and a lifeless sky. Then, one day, a traveller came and planted his staff here. Then another. Slowly, you began to take shape again. Streets, walls, gardens, plazas, alleyways, palaces, canals, and of course: people. Seething crowds of millions, the blood of the city. Your blood. Whatever your circumstances when you awaken, your relief from the mind-addling haze of the city is temporary. In 2d6 hours, you succumb again. Posted by Michael Prescott at 20:18 13 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: adventure, games, rpg Tuesday, 28 March 2023 The Terrible Salt For a generation, the tides at Vincha stopped completely. What was once an enormous tidal flat was lost under bitter waters. Now they have returned, and the brave and curious are gathering to see what was hidden under the terrible salt.This adventure features an enormous tidal flat, miles and miles wide. Adventurers who set out from Vincha have a strange and dangerous land to explore, and will need to learn its rhythms to return with anything valuable.The Terrible Salt is something of an experiment in tangibility. Unlike many of my adventures, there's no wandering monster table. Instead, the tides and the crab swarm move in defined ways from their starting points.The crab swarm is extremely dangerous. It will outnumber most parties, and unless they have good magic (or horses), it will overrun them and eat them. Avoiding notice is better than trying to flee (since the crabs never stop), but this will require that the players stay aware of their environment.Being spotted by crabs or trapped by the tides doesn't mean certain death, but players may have to ride out an uncomfortable few days being baked by the sun and freezing at night, all without any drinkable water or means of lighting a fire.The greatest danger in this scenario is facing both crabs and tides at once, either:the crab swarm comes in at the same time as the tide, and you're fighting waist-high crabs in chest-deep waterthe party is fleeing the crabs, but is then forced by the tide to shelter on a rocky island before they can shake the pursuitFortunately, the map is littered with high spots that should allow the party lots of opportunity to scout out their surroundings and avoid danger. (This scenario contains a compressed version of my take on how far you can see on a hex map.)As I finished the writing, the coral consorts became my favorite part. The implications of these srange marriages transformed the Salt Lords into something more interesting: an ethically neutral but alien presence in the scenario, inviting the party (or whomever) to take a terrifying step into a different world.The coral consorts themselves make very interesting maguffins: imagine having to go and talk to a knowledgeable NPC somewhere, but learning that they married the sea and need to be found on the slopes of the Salt Lords' citadel. Good luck!As always, thank you to my patrons on Patreon, who graciously support this project! Because of your generosity, the text and art pieces are released under CC-BY-NC 4.0, for your own non-commercial use.* * *EDIT: Some additional hooks!Wealthy relatives of the doomed expedition members want their bodies (or heirlooms) reclaimed from wherever they wound upThe players need to contact an NPC to learn something, last known to have retired to Vincha. However, she 'married the sea' and is now somewhere on the slopes of the citadelThe other end of the inland sea (beyond the citadel) is a prosperous area. If a reliable way to cross the sea (possibly with the blessing of the Salt Lords) can be found, an important trade route could open upCrabs have been attacking Vincha; myths say that they serve the Salt Lords' will, and that when they are happy the crabs are kept at bayFrom the top of the citadel, when the clouds part, you can see anywhere in the world (or so say the songs)Every river for a thousand leagues drains into the flats. The Salt Lords know everything that happens along their lengths; they have the answers you seek.Too long have the Salt Lords stolen the vulnerable, taking them away to marry the sea. Put an end to it.On the south shore of the inland sea is a tower. Well, more of a ruin than a tower. It stood watch at the mouth of a pass that reaches all the way to Urchlund.News of the tides restarting has reached Fair Riot, and it's said a Duke is coming to survey lands that he claims are his. Now, maybe they are and maybe they aren't, but a map of the flats would surely be worth good coin and a Duke's favor besides.In my nan's time, people used to go out on the flats looking for oysters. She said there was an old well on one of the rocks with water you can drink. That would be an incredibly useful staging area for further exploration.Oysters out on the flats would be an incredible boon to Vincha, if only it were safe. The baron has a sack of silver for whomever can lure those crabs away and deal with them for good. Posted by Michael Prescott at 08:53 7 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Labels: adventure, games, rpg Saturday, 9 July 2022 At the Hour of Death The lost tomb of Sierk the Carver may have passed from memory, but it's nearer than anyone suspected. But be warned, wizards don't die peacefully. Great danger awaits anyone who arrives at the hour of death.At the Hour of Death is Trilemma Adventure #55. It's a pocket dungeon that you can locate almost anywhere underground. If an ogre misses a player and bashes a wall, a secret door in a castle hallway, a crumbling brickwork. Anywhere there's enough room for the circular tomb, below.For ages I've wanted to do something with scheduled patrols, moving guards whose routes and schedule the players could learn and then anticipate. What better way to do this than let the players actually manipulate the schedule?A few notes:There's more treasure in this adventure than most of what I do. It's meant to be suitable for classic dungeon crawling: low-level adventurers avoiding threats to get what treasure they can before they run into trouble they can't handle.The skeletal infantry are meant to be both hostile and very dangerous. They're there as a lethal "minute hand" that sweeps around the perimeter of the tomb. Make this clear with their coordinated movements, the shouting of the lamp-bearers to direct them. For gritty power levels, at least, it should be obvious that to attack them frontally means getting stabbed by a forest of spears.Other than the skeletons, however, this adventure is meant to work with a reaction table (of the sort you get in early editions of D&D). If you don't have one handy, use this one from ALM: Roll d6Initial NPC Reaction Assume the worst: The NPC assumes the party is here for violence or exploitation. If weaker, the NPCs avoid, posture and prepare defenses. If they have the advantage, maybe they think it's best to deal you a blow while they can. Wary: Set boundaries (socially or physically) Mistaken Assumption: The group makes a confident, incorrect assumption about the party's purpose or identity. They've heard rumours, and your presence confirms them.Uninterested: Dour and sullen, self-absorbed, or perhaps more interested in their own problems or private discussions. Either way, they aren't making time for the party. Curiosity: You're the entertainment. Maybe that's good, maybe that's really bad, depending on their nature. Common Cause: So glad you turned up, now we can help each other! Magical CompulsionThis adventure holds the possibility of an NPC gaining a measure of control over a PC. The inhabitants of the dungeon have been compelled to follow the magic of the game board and don't realize their decisions have been influenced. Imposing this same fate on a PC, however, would effectively sideline the player. No fun! There are a few options that you might try:Wrong Trousers: The player remains in control of their character, but whatever they choose to do, they also walk a half move in the direction the game board pulls them. They can resist and take other actions, but it's'''
