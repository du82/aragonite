["https://blog.typekit.com/2018/09/04/kinuta-skill-fonts-japanese-foundries-added-to-typekit"]
title = "The Typekit Blog | Fonts from two Japanese foundries added to Typekit"
full_description = "We’re delighted to introduce two of our newest foundry partners, both based in Japan. Welcome Skill Information“S” and Kinuta Font Factory! There are eleven new fonts in the library now from these two foundry partners. Kinuta has been producing fonts for nearly twenty years, and we’re pleased to add three of these typefaces to our library. Among these is Iroha 32 Sakura Kana, a fresh take on the Gothic style that is commonly used in signage around Japan. Our Kinuta contact refers to this one as a new alternative for anyone needing to set Kana text in the Gothic style. Give it a try and let us know what you think. Known for its focus on software development, particularly for the health services industry, Skill Information“S” found itself in the font business through a collaboration with Techno Advance Co, Ltd, in 2007. Kenji Miyazawa was a poet, renowned especially for his children’s stories – many of which have since been adapted into anime. Content Editor at Typekit. Usually knows the way to the nearest public library. Lives in San Francisco in real life, @draftwerk in Twitter life."
