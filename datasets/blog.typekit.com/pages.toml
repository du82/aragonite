["https://blog.typekit.com/2017/08/30/css-font-loading"]
title = "The Typekit Blog | Now in Early Access: Serve web fonts without JavaScript"
full_description = "We’re excited to ship one of your all-time most requested features: you can now add fonts to your web site using only CSS (Cascading Style Sheets)—no JavaScript required. Also, you can now use fonts from Typekit in HTML email campaigns, mobile articles in Google’s AMP format, or anywhere else CSS web fonts are supported. Turn on Early Access and you’ll see the new CSS-only embed code in our kit editor, available as an HTML link tag or CSS @import statement. Your existing websites and kits will continue to work with the default JavaScript embed code, and you will now be presented with the new CSS embed code whenever you create a new kit, or when you access an existing kit’s embed code. CSS kits will finally allow you to use web fonts from Typekit in places our previous reliance on JavaScript prevented us from supporting, such as: For more details and step-by-step support, check out our guide to getting started with CSS-only web font serving. Either embed code gives you control over the OpenType features and language support in your site’s web fonts; you can still configure these options in our kit editor. For most web developers, the CSS embed code is the most efficient way to add web fonts to your site. Using only CSS to deliver web fonts allows you to take advantage of newer advances in how browsers load and render fonts, and removing JavaScript code and execution from the loading process should provide a small but welcome speed boost. The advanced JavaScript embed code is still the right choice for sites that use East Asian web fonts, which depend on our JavaScript-based dynamic subsetting feature for support. For advanced users or in specific use cases, our JavaScript embed code gives you fine-tuned control over how fonts are loaded. All of the same browsers and versions that currently support JavaScript web font serving will also support CSS web font serving. See a detailed listing of support. We release features into Early Access because we feel confident that they are ready to use, and we’d like you to give it a try, test its limits, and let us know how you feel about the change before it becomes a core part of our product."
year_published = 2025
