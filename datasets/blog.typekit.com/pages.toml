["https://blog.typekit.com/2018/10/09/now-in-the-library-more-fonts-for-desktop"]
title = "The Typekit Blog | Now in the library: More fonts for desktop"
full_description = "Hard to believe we’re nearly halfway through October. We’ve got a lot of updates for you this month, many of which you’ll hear about next week at Adobe’s annual MAX conference. Let’s kick it off with a look at what we’ve added to the library recently. This week’s news comes from two of our foundry partners, Typofonderie and Underware. Both have just made their full collections available for desktop use in addition to web — that’s right, no more web-only fonts from these two! The collection from Typofonderie is full of winning options for all sorts of design needs. Now that all their fonts are available in more places, this cheat sheet might come in handy. What’s your type? Consult the Typofonderie cheat sheet for quick diagnosis. Courtesy of Typofonderie. A sampling of serifs from Typofonderie: Le Monde Journal, Mencken Text, Mencken Text, PS Fournier Petit, Apolline, Le Monde Livre Classic, Geneo, and Apolline. Courtesy of Typofonderie. Display sans-serifs from Typofonderie: Ysans Mondrian, Anisette, AW Conqueror Inline, Prosaic, AW Conqueror Inline, Ysans, AW Conqueror Sans, and AW Conqueror Carved. Courtesy of Typofonderie. The Underware collection includes several outstanding and unique options that can make for unforgettable signage. Content Editor at Typekit. Usually knows the way to the nearest public library. Lives in San Francisco in real life, @draftwerk in Twitter life."
