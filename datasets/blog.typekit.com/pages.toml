["https://blog.typekit.com/2018/03/01/adobe-type-wins-keinosuke-sato-award-from-japan-typography-association"]
title = "The Typekit Blog | Adobe Type wins Keinosuke Sato award from Japan Typography Association"
full_description = "The Japan Typography Association has selected Adobe as the 2017 company winner of the Keinosuke Sato award, which is given to a selected company and individual each year for meaningful contributions to Japanese typography. Taro Yamamoto will accept the award on behalf of Adobe Type on April 20, and will join the winner of the individual award, Akira Kobayashi of Monotype, for a panel session moderated by Kiyonori Muroga, editor-in-chief of IDEA magazine. The Japan Typography Association (JTA) is composed mainly of type designers, lettering designers, and graphic designers. Keinosuke Sato, for whom the annual award is named, was one of the founding members of the association. His work as a type designer and researcher spans from the 1930s through the ’70s. The JTA was founded in 1971. In 2017 Adobe Type released both Source Han Serif and Ten Mincho, and both typefaces were well-received in Japan. Work from previous years, such as Kazuraki and Source Han Sans, was taken into consideration, and the panel of judges for the award called out improvements to Japanese font support on Typekit as a factor in their decision as well. Past recipients of the award include our foundry partners Dai Nippon Printing, Morisawa, and Jiyu-kobo. Content Editor at Typekit. Usually knows the way to the nearest public library. Lives in San Francisco in real life, @draftwerk in Twitter life."
