title = "The Typekit Blog | Join us to test a new feature on Typekit"
full_description = "We’ve been working on a new feature for finding fonts on Typekit, and we’d love to see what you think of it before we officially launch it later this year. Will you be in San Francisco or New York anytime from July 24 — August 4? We’re going to run user testing sessions in our office locations in both cities during that time and welcome you to join! Testing sessions will take about an hour, and participants will all get a $25 gift card for their time. You don’t need to have an active Typekit or Creative Cloud subscription to participate, and we won’t be testing you on your typographic know-how either. We’ll have a computer all set up for the session when you get here, and we’ll be eager to hear your thoughts! Interested? Great! We’ll need a little info so we can get in touch with you and schedule a time, so please submit this registration form to get started. You’ll hear back from us by the end of the next business day. Great! The link to register is in the post, and you can choose the time slots that work best for you. Content Editor at Typekit. Usually knows the way to the nearest public library. Lives in San Francisco in real life, @draftwerk in Twitter life."
