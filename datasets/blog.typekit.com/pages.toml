title = "The Typekit Blog"
full_description = "The collection from Typofonderie is full of winning options for all sorts of design needs. Now that all their fonts are available in more places, this cheat sheet might come in handy. What’s your type? Consult the Typofonderie cheat sheet for quick diagnosis. Courtesy of Typofonderie. A sampling of serifs from Typofonderie: Le Monde Journal, Mencken Text, Mencken Text, PS Fournier Petit, Apolline, Le Monde Livre Classic, Geneo, and Apolline. Courtesy of Typofonderie. Display sans-serifs from Typofonderie: Ysans Mondrian, Anisette, AW Conqueror Inline, Prosaic, AW Conqueror Inline, Ysans, AW Conqueror Sans, and AW Conqueror Carved. Courtesy of Typofonderie. The Underware collection includes several outstanding and unique options that can make for unforgettable signage. ATypI 2018 kicks off today, bringing its annual assortment of workshops, talks and symposiums to Antwerp. Find our own Frank Greißhammer on the Type toolmakers panel early on Wednesday. Later that morning Vinod Balakrishnan, our colleague on the Photoshop team, presents Evolution of digital typographic needs. Catch Frank at 9:25 am and Vinod at 11:40 am. We’re also supporting the closing party on Saturday evening. Please join us there and hear some remarks from Frank and Taro Yamamoto around 10 pm. TypeThursday adds its second European chapter this month, when Barcelona launches on September 20th. Looking for a type event in a different city? Additional evenings of socializing and type crit continue in: Adam Ladd’s eye for graphic design is clear in the fonts he’s designed, and we’re excited to add these to our collection. For designs that might otherwise feel a little flat, Active adds a visual texture and contains plenty of alternate character styles to play with. For a more personal touch than bold Active, try the gentle script Braisetto. This one stands up on its own, especially for packaging and branding uses, but can also be paired with bolder fonts to add a warm contrast. We’ve got two weights of this to work with, too. See everything we’ve added from Adam Ladd on his foundry page."
