["https://blog.typekit.com/2016/11/17/designing-trajan-color-concept"]
title = "The Typekit Blog | Designing Trajan Color Concept"
full_description = "One of the new features added in the recent release of Photoshop CC 2017 is support for OpenType-SVG fonts — a special flavor of OpenType that allows the use of color and pattern effects built right into the font file. This version of Photoshop includes Trajan Color Concept, a new typeface designed to show off some of the possibilities of the format. We’re now happy to announce that Trajan Color Concept is also available on Typekit for sync and web. Trajan Color Concept is one of our Adobe Type Concepts: an experimental typeface developed with a scaled-down character set so that we can get it in front of adventurous customers. Based on Carol Twombly’s iconic Trajan from 1989, this ambitious update was designed by Sérgio Martins beginning while he was an intern with the Adobe Type team. We spoke about the project with Sérgio, now working as a designer in Portugal. I’m a 25-year-old designer from Lisbon and, as of November last year, I’m also an MA graduate in editorial design from IPT (Polytechnic Institute of Tomar) in Portugal. I first became passionate about type during my BA student years, although my interest for the written and printed word dates far back, to when I was a kid. For the last four years I’ve been looking to learn and educate myself more about typography. During this whole time I’ve had several odd jobs, although since 2015 I’ve been focusing on type a lot more. I was at Adobe in San José for six months, as part of an internship for my MA. Before arriving, I’d talked to Miguel Sousa a few times and we’d discussed the possibility of developing a color font. The team had been discussing Trajan as a basis for the project for its historical value – both to Adobe Type and as an iconic revival of Roman capitals – and I was quite happy to work on such a famous (sometimes infamous) typeface. I’d met Miguel before, in Portugal, but wasn’t quite sure of what to expect from Robert – I knew the name, of course, but barely anything else. Fortunately they both proved extremely helpful, although in different ways. From the beginning Miguel helped guide the direction of the project, while Robert provided more technical feedback relating to the fidelity of the design, or feedback from an outside perspective – a fresh pair of eyes, so to speak – as it is easy to get too attached to your own design. Although we disagreed a few times, I’m happy to say those were productive discussions that lead to significant improvements."
