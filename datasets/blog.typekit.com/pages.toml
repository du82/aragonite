["https://blog.typekit.com/2017/01/10/introducing-source-serif-2-0"]
title = "The Typekit Blog | Introducing Source Serif 2.0"
full_description = "Version 2.0 of Source Serif is here! The work on this release has been a long time coming, and represents a major step forward. You can get this newest version of Source Serif from Typekit for web & sync, and its development files are available open source on Github. If you are only using Source Serif to set texts in English, probably not much. But if you look behind the scenes, quite a lot! The most obvious update is the upgraded character set, which has grown from Adobe Latin 3 to Adobe Latin 4. What does this mean? Apart from roughly doubling the amount of characters, the result is broader language support. Source Serif is now capable of setting Azerbaijani (in Latin) as well as Esperanto, and can be used for Pinyin romanization of Chinese — and many more languages besides these. I am particularly proud of the added support for Vietnamese, a language seen everywhere in the San Francisco Bay Area. Along with making a substantial expansion to the character set, version 2.0 includes several modifications to existing glyphs. In some cases, those stem from personal preference or dissatisfaction with existing shapes, while in other cases glyphs have been changed to better fit their surroundings — such as adapting the Greek to suit the context of running text, rather than standing as mathematical symbols. Version 2.0 of Source Serif introduces support for Cyrillic (more specifically, Adobe Cyrillic 2) and monotonic Greek (Adobe Greek 1). Designing type for a non-native writing system is a challenge for any designer, and many issues are not obvious to an outsider. Often, there is a tendency to “latinize” additional writing systems in search of overall harmonization, which may kill the spirit of the addition. To better understand the requirements of foreign (to me) writing systems, and to steer clear of obvious mistakes, I enlisted the help of advisors. For the Greek part of the family, I could count on the help of Gerry Leonidas. He coaches a number of type designers at the MATD in Reading every year, and has a good sense of what kinds of designs are needed for Greek today. I have to admit the Greek was not the easiest part of the family, because the shapes are just so different. Some of Gerry’s suggestions made me reconsider the overall design various times. In the end, I found a voice I liked — but not without going on a lot of detours. I made a short video to illustrate the form-finding process (see two years of work distilled down into 30 seconds!):"
