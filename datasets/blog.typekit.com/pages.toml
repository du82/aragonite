["https://blog.typekit.com/2018/04/27/fonts-for-your-finals-new-on-typekit-for-may"]
title = "The Typekit Blog | Fonts for your finals: New on Typekit for May"
full_description = "It’s hard to believe we’re already at the end of April — but here we are, and we’ve got more new type in the library to share with you. Have a look at what we’ve added this past month and a few other things that we’ve had going on. We love the bold, fresh type from designer Jamie Clarke, full of energy and fantastic for display. His Rig Shaded recently won the Platinum award in the Graphis competition for typography. Rig Shaded and its sibling Rig Solid are both available in a stunning variety of styles that can be layered on top of one another for shadow effects, outlines, gradients, and more. Brim Narrow offers a similar variety of layering options but with a decidedly different style featuring stately serifs. Use Brim Narrow Combined for simplicity if you’re working with just one color or want the fonts on your website (although it is possible to combine layers using CSS!). We added several Production Type families from Jean-Baptiste Levée and his team to our subscription library. Countach is one of these — originally designed for a car racing game, with an emphatic italic style that exhibits a clear velocity and an extended character set including a well-rounded Cyrillic. Once in a while a type family just keeps growing and growing over the years, and Production Type’s Panorama collection is such an example. Six widths and eight weights, plus italics, make for a whopping 96 font styles for this family. The variety makes this an especially adaptable choice for all manner of projects. We’ve added the whole shebang to our Marketplace: Panorama Regular as well as Semi Condensed, Condensed, Extra Condensed, Extended, and Extra Extended. Urbane Rounded comes to us from Rian Hughes of Device Fonts. It’s a cheerful rounded sans with seven weights, and will easily lighten the mood where it’s used — the heaviest weight in particular is nearly balloon-like, in the best way possible. Use the lighter weights where more subtlety is needed, like in site navigation or smaller text."
