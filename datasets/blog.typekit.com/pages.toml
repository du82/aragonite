["https://blog.typekit.com/2017/10/19/new-variable-fonts-from-adobe-originals"]
title = "The Typekit Blog | New variable fonts from Adobe Originals"
full_description = "Photoshop and Illustrator announced plenty of new features at Adobe MAX this week, include some exciting typographic features we’ve been anticipating: support for OpenType variable fonts. This new font format allows users to customize the styles within a typeface design, effectively giving them an entire family of fonts in a single file. We’ve included a few Adobe Originals families with this release of Illustrator and Photoshop to make it easier for you to explore what variable fonts can do. Don’t miss the Illustrator announcement, either, which introduces its own nifty typographic controls. We chose six families to best show what the new format will allow, and how the possibilities may differ from one typeface to another. Five of these are from our Variable Concept font collection, allowing you to play with the full variable design space on some of our most popular Adobe Originals families (although you’ll only have a limited character set for now). From the Source superfamily, Source Sans Variable, Source Serif Variable, and Source Code Variable all allow you to play with the weight range in each design, and they also contain the complete character set of the Pro versions. In addition to using the Source Variable families in Photoshop and Illustrator, you can download them from our GitHub page so you can try them out in other applications and environments as the support for variable fonts becomes more widespread. We’ll keep you posted as that support develops! Check out our roundup of variable fonts news and follow the discussions on TypeDrawers. I just ran across this new feature and am amazed! I work as a designer for a sign company and this really changes how I am able to work. Really looking forward to getting more of these variable fonts added into the Typekit! Hi, there is no support for accented characters (è, ò, à…). So now it’s almost useless. But the idea is cool. The three Source families have the same big character set as their non-variable versions. The three Concept families will be released in the future with their full character sets, but for now we provided these limited versions to at least allow folks to play around with the new features with some fonts that have more potential styles."
