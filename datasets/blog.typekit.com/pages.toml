["https://blog.typekit.com/2017/03/08/an-interview-with-dr-fiona-ross"]
title = "The Typekit Blog | An interview with Dr. Fiona Ross"
full_description = "Fiona Ross has played a crucial role in the type industry throughout her career, and it is largely thanks to her work that type designers and developers have been enabled to make innovations in non-Latin type design — though she would be quick to add that there is still a ways to go! Fiona Ross began working at Linotype (UK) in 1978 and eventually headed up their non-Latin Typographic Department — becoming the first woman manager at the company. The designs that came out from her department went on to become some of the most widely-used type designs in the world. The population that reads Bengali, for example, is about the same size as the population of the United States, and Devanagari even larger than that. We were delighted when Fiona agreed to answer a few of our questions about her fascinating career and her work on non-Latin script designs. I began as a Research Assistant at Linotype, but there was no clear career path. I had a background in Indian languages and literature, but I did not specialise in Indian-script typefaces. My first task was working on Arabic font layouts, but I became increasingly involved in the design of Indian-script typefaces, thanks to my background and the openness of Walter Tracy and Matthew Carter to listen to — and in fact, seek — my opinion regardless of my age and typographic inexperience. I was very conscious of the mismatch between the beautiful literature and Indian scripts on the one hand and their often poor representation in print on the other. I eventually headed the Department of Typographic Development at Linotype, which included the Design Studio. There, we designed original Indian and Thai typefaces and also worked on and produced Arabic typefaces in conjunction with calligraphers or external designers. My research informs my practice, and vice versa. I rely a great deal on primary sources — for example, archival materials such as those in the Non-Latin Type Collection at the University of Reading, and also authoritative secondary literature on allied disciplines. In teaching I have always advocated that students develop a research-based design methodology suited to their interests. Such a methodology enables one to make informed design decisions."
year_published = 2025
