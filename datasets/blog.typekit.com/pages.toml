["https://blog.typekit.com/2018/05/15/get-a-font-pack-for-your-next-project"]
title = "The Typekit Blog | Get a Font Pack for your next project"
full_description = "Every Creative Cloud subscription comes with access to thousands of the world’s best fonts. Now, we’re making it easier to get them into your projects with Font Packs. Font Packs are collections of fonts for things like résumés, invitations, and social stories — and you can get these fonts with a single click. Each Font Pack includes a variety of options to help you explore different creative directions and try out font combinations. Each collection also shows examples of the fonts in use, and we’ve made those files available for download so you can immediately try your own text in Illustrator (or in XD, if you’re working with the UX Font Pack) without starting from scratch. There are six more Font Packs on the way, and we’ll release one each Tuesday for the next few weeks. Keep an eye on the growing collection! Once you sync these fonts, they’ll show up in the font menu of all your desktop applications. (Yes, all — not just Adobe apps.) They can be used in print, on the web, and for your clients’ designs. They all share the same simple licensing agreement, so you never have to worry about where or how you can use the fonts. We’re planning even more beyond this, so if you’d like to see us focus on any particular kind of theme or design project in future Font Packs, please let us know. This is a great idea! With over 5,000 Typekit fonts now available, it’s sometimes challenging to cut through all the choice and find the right font. Curating them into small hand-picked collections (custom categories) suitable for particular needs should really help users be able to find the right/best font faster. Thanks! Head of Typography for Adobe Typekit & Adobe Type. Practicing typography and web design every day. I write, speak, and make tools to share what I learn. I try to be helpful. I love my wife, kids, family, friends, teachers, and dogs. I'm a volunteer firefighter."
