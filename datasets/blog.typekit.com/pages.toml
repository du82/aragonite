["https://blog.typekit.com/2018/09/11/supporting-global-type-happenings-this-month"]
title = "The Typekit Blog | Supporting Global Type Happenings This Month"
full_description = "From the UK to Spain to New York to San Francisco, we’re happy to support a handful of get togethers of font-loving folk this month. ATypI 2018 kicks off today, bringing its annual assortment of workshops, talks and symposiums to Antwerp. Find our own Frank Greißhammer on the Type toolmakers panel early on Wednesday. Later that morning Vinod Balakrishnan, our colleague on the Photoshop team, presents Evolution of digital typographic needs. Catch Frank at 9:25 am and Vinod at 11:40 am. We’re also supporting the closing party on Saturday evening. Please join us there and hear some remarks from Frank and Taro Yamamoto around 10 pm. TypeThursday adds its second European chapter this month, when Barcelona launches on September 20th. Looking for a type event in a different city? Additional evenings of socializing and type crit continue in: Quick newsflash! TypeThursday London will be celebrating it’s first birthday on Oct. 4th with extra fun, extra type crits. and extra cake for all! Typekit Product Marketing Manager. Former TYPO San Francisco conference director. Probably taking photos of signs or San Francisco sunsets. Will one day write about her adventures."
