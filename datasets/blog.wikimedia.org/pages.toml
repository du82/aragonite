title = "About – Diff"
description = "Diff is a blog by and for the Wikimedia volunteer community to connect and share learnings, stories, and ideas from across the movement. It is hosted by the Wikimedia Foundation and managed by the …"
full_description = "About Diff is a blog by and for the Wikimedia volunteer community to connect and share learnings, stories, and ideas from across the movement. It is hosted by the Wikimedia Foundation and managed by the Movement Communications team. Articles on Diff are written by Wikimedians from across the movement, including volunteers, affiliate staff, Wikimedia Foundation staff, and partner organizations. The Movement Communications team provides editorial support: we review posts for scope, proper attribution of media, and any technical issues before publishing. Articles on Diff do not represent the views of the Wikimedia Foundation, unless stated or authored by the Foundation. We try as far as possible to ensure diverse voices and perspectives in posts from Movement volunteers are preserved, subject to the rules that govern our projects including the Universal Code of Conduct. Learn more about the editorial process. Where did Diff come from? The name “Diff” is in reference to the MediaWiki interface that displays the difference between one version and another of a Wikipedia page. It also reflects the “difference” our communities and movement make in the world every day. Diff builds on the experiences of the Wikimedia Blog and Wikimedia Space, and includes their news archives. Can I publish something on Diff? Yes! All contributors to the Wikimedia movement are welcome to submit an article. Diff has a simple and accessible editorial process, to encourage participation from all — especially under-represented communities. Diff staff check posts for being in-scope, copyright attribution, and any technical issues. We do not have a singular voice or perspective and encourage authors to write in their own voice rather than follow any standard styleguide. There is no set editorial calendar. Most posts on Diff are submitted by volunteers for publishing, rather than requested or invited by the Foundation. Additionally, content on Diff can be written and translated in multiple languages. You can learn more about the editorial process and checklist for publishing. Diff’s scope is relatively broad, focusing on hosting content about the Wikimedia movement, for the Wikimedia movement. Some examples: News produced by committees, affiliates, and other community groups Interesting Wikimedia stories and discussions Links to relevant Wikimedia content published on other channels News about Wikimedia partners, the ecosystem of free knowledge and other current events that are connected with the Wikimedia movement and targeted to Wikimedia contributors Announcements, requests for feedback, reports, newsletters, and other movement-relevant content produced by the Wikimedia Foundation or community groups for community audiences Posts with an unclear impact on the Wikimedia movement are out of scope. Diff’s editorial guidelines provide more detail about acceptable content. How do I get started? First you’ll need to authenticate with your Wikimedia account (use the “Login with MediaWiki” button). Then you can start a draft and, when you’re ready, submit it for review. The Movement Communications team will review and discuss scheduling publication with you. Take a look at the editorial guidelines and publishing checklist for more detailed information. I have a question Diff is supported by the Movement Communications team at the Wikimedia Foundation. You can leave a note on the Diff project talk page on Meta or email us at diff@wikimedia.org. Bug reports and feature requests can be made on Phabricator. Please add the #diff-blog tag when creating new tasks. See also AboutGuidelinesEditorial GuidelinesPublishing checklistTranslationCalendarSubscribeHelpDiff (blog) on Meta Table of contents Where did Diff come from?Can I publish something on Diff?How do I get started?I have a question"
