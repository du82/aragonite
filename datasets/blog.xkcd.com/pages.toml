full_description = "For the handful of hurricane geeks out there Selections from lost NHC discussion bulletins: HURRICANE HUMBERTO DISCUSSION NUMBER 5 NWS TPC/NATIONAL HURRICANE CENTER MIAMI FL 500 AM EDT THU SEP 13 2007 THE NATIONAL HURRICANE CENTER HAS DETERMINED…BASED ON RECON AND MODEL GUIDANCE…THAT “HUMBERTO” IS A RIDICULOUS NAME FOR A HURRICANE. THIS WILL BE THE LAST ADVISORY ISSUED CONCERNING THIS STORM…UNTIL A MORE SERIOUS NAME … Continue reading “For the handful of hurricane geeks out there” Posted byRandall2011-08-29Posted inUncategorized142 Comments on For the handful of hurricane geeks out there Earthquakes As many people have pointed out, my comic about tweets outrunning seismic waves seems to have been widely verified in yesterday’s earthquake: http://www.hollywoodreporter.com/news/earthquake-twitter-users-learned-tremors-226481 It’s always nice to see real-life confirmation of your calculations! The quake started in Virginia at 13:51:04 EST, where most of my family lives. Texts from my brother in Charlottesville (25 miles … Continue reading “Earthquakes” Posted byRandall2011-08-24Posted inUncategorized110 Comments on Earthquakes Oops! I’m at a family reunion, where a YouTube-watching party inspired today’s comic. I woke up to find several emails letting me know, to my dismay, that the comic Doghouse Diaries has already done a similar strip about the same experience. I linked to their site last year when I posted my color survey results, but … Continue reading “Oops!” Posted byRandall2011-07-04Posted inUncategorized223 Comments on Oops! Family Illness Last fall I posted about a family illness, but didn’t give a lot of details. In October my fiancée was diagnosed with stage III breast cancer. It’s rare for young women to get breast cancer, and she’s otherwise healthy and has no family history, so it was a real bolt from the blue. She’s been … Continue reading “Family Illness” Posted byRandall2011-06-30Posted inUncategorized"
