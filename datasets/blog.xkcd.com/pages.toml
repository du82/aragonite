full_description = "What if I wrote a book? Posted bydavean 2014-03-12 1,117 Comments on What if I wrote a book? For the last couple years, I’ve been answering your science questions on What If. Today, I’m excited to announce that the What If? book is coming! What If?: Serious Scientific Answers to Absurd Hypothetical Questions will be published September 2nd by Houghton Mifflin Harcourt. Starting today you can pre-order it from your favorite bookseller (Barnes & Noble, Amazon, Indie Bound). There are also foreign editions, including a UK and Commonwealth edition and a German edition. As I’ve sifted through the letters submitted to What If every week, I’ve occasionally set aside particularly neat questions that I wanted to spend a little more time on. This book features my answers to those questions, along with revised and updated versions of some of my favorite articles from the site. (I’m also including my personal list of the weirdest questions people have submitted.) Preorder today to get a copy as soon as it comes out! Share this:TwitterFacebookLike Loading... Related Posted bydavean2014-03-12Posted inUncategorized trevor ransbury says: 2014-10-15 at 9:07 pm I really enjoyed your book but on page 234 line 1, in between character numbers 12 and 13 there should be a comma its really bugging me how it is now: 1000,000,000 how it should be: 1,000,000,000 LikeLiked by 3 people Jay Park says: 2014-10-25 at 1:14 pm I am half way through the book, and it is terrific. However, while I was reading, my son noticed an error on page 35 as he was peeking on the side. Ammonia is incorrectly listed as an element. My periodic table loving 8 yo boy blurted out, “Ammonia is not an element!” LikeLiked by 3 people درب اتوماتیک پارکینگ says: 2014-10-28 at 9:38 pm Hello, Great!! It really helped me alot .Thanks for sharing. LikeLike Jesse says: 2014-10-31 at 11:40 pm Hi! I am not a bot! Just wanted to, you know, point that out. Thanks for writing a book. LikeLike Fred says: 2014-11-04 at 3:06 pm Hi! About to start reading your book. Have you planned a fremch version of it? LikeLiked by 1 person"
