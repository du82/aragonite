full_description = "Money chart Posted byRandall 2011-11-24 249 Comments on Money chart I had a huge amount of fun putting the money chart together. It was the first time in a long time that my life’s been stable enough that I’ve been able to really disappear into a project—I’d almost forgotten how enjoyable it can be. I’ve corrected a bunch of typos and other minor errors, most of which crept into the project during the final 36-hour no-sleep marathon to integrate all the pieces together. (Those corrections, plus a few more that will be added over the next few days, will all be integrated into the printed version). Now it’s time for me to to spend some time relaxing with family, and trying to break the habit—trained into me by the research I did for the chart—of thinking of everything in economic terms. To those of you in the US (GDP: $15.18 trillion[1], total net worth: $58.73 trillion[2]), have a happy Thanksgiving! Share this:TwitterFacebookLike Loading... Related Posted byRandall2011-11-24Posted inUncategorized Stop Those Unwanted Solicitors says: 2014-04-16 at 9:12 am I simply want to tell you that I am new to weblog and definitely liked this blog site. Very likely I’m going to bookmark your blog . You absolutely have wonderful stories. Cheers for sharing with us your blog. LikeLike Free Zip Software says: 2014-04-17 at 6:52 am lot I got some most important article on this site. So i adhere to this site for collecting some important and useful article. LikeLike private detective new york says: 2014-04-21 at 4:02 am I found this website that deals with private detectives and investigations, I thought it may be helpful to you and your readers. http://www.mckeeverpi.com LikeLike saying says: 2014-04-27 at 7:59 am And you’re further saying this not far in the awaken of the exposure that latest FBI wiretaps grabbed an Israeli broker providing to help a participant of The. films en streaming LikeLike saying says: 2014-04-28 at 8:13 am However there are some well known experts in psychiatry and neurology who have been writing about the behavior from personal and scientific perspectives. prada bags LikeLike"
