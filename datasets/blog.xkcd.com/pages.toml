full_description = "Life Imitates xkcd, Part II: Richard Stallman Posted byRandall 2007-04-19 150 Comments on Life Imitates xkcd, Part II: Richard Stallman As if Cory Doctorow getting dressed in a red cape and goggles after I drew this comic wasn’t crazy enough, in response to this comic, two xkcd fans — Rafael Roquetto and Mauro Persano — have bought Richard Stallman a katana: The had it shipped to him at the FSF offices (more pictures here). He really didn’t know what to make of it. I’m told he sent them back an email thanking them, adding, “I am not sure what to do with it, other then keep it near my bed.” Share this:TwitterFacebookLike Loading... Related Posted byRandall2007-04-19Posted inUncategorized bbctol says: 2007-05-06 at 5:54 pm Richard Stallman has a katana. Richard Stallman has a katana. Richard Stallman has a katana. RICHARD STALLMAN HAS A KATANA HOLY CRAP THAT IS AWESOME LikeLike M says: 2007-05-10 at 1:14 am Anyone see this xkcd reference on overheard at college yet: http://www.overheardatcollege.com/?p=1695 ? Oh, Colin: my boyfriend (who introduced me to this site) and I almost always find the same comics funny, even when there’s explanations involved and even though we’re both majoring in subjects that fall under the umbrella of visual and performing arts. What does that say about our relationship? I hypothesize that it means the two of us are 1) closet geeks and 2) lucky to have found each other. But I could be wrong. LikeLike wizdumb says: 2007-05-11 at 2:45 pm You’re really not supposed to touch the blades at all, at least on a real live katana. This could be a cheap wall hanger though, so it might not matter. LikeLike birdy says: 2007-05-13 at 11:37 pm unrelated: xkcd as reached the Movers & Shakers Traffic Graph (Sites that are zooming up the Alexa traffic rankings in the last week.) on alexa.com permalink: http://www.alexa.com/data/details/traffic_details?site0=perfspot.com&site1=xkcd.com&site2=libertypost.org&site3=&site4=&y=r&z=1&h=300&w=610&range=3m&size=Medium&url=perfspot.com LikeLike"
