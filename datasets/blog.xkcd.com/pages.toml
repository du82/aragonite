title = "xkcd – The blag of the webcomic"
description = "The blag of the webcomic"
full_description = "What If 2 I’m excited to announce that I’m publishing a What If? sequel! What If? 2: Additional Serious Scientific Answers to Absurd Hypothetical Questions will be in stores 9/13, and is available for preorder now! In What If 2, I answer new questions I’ve receieved in the years since What If? was released. People have asked about touching exotic materials, traveling across space and time, eating things they shouldn’t, and smashing large objects into the Earth. There are questions about lasers, explosions, swingsets, candy, and soup. Several planets are destroyed—one of them by the soup. Like What If?, What If? 2 also features collections of short answers, new lists of weird and worrying questions, and some of my favorite answers from the What If site. If you want to get it when it’s released, you can preorder a copy! Posted byRandall2022-01-31Posted inUncategorized Book tour wrap-up Thank you to everyone who came to events on my book tour! It was a wild ride visiting so many cities in short succession. Thank you so much to the booksellers, venues, and especially to the wonderful people who co-hosted the tour events with me: Kate Darling, Alexandra Petri, Lev Grossman, Jim Ottaviani, Ken Jennings, Adam Savage, Ariel Waldman, Cory Doctorow, Kyle Hill, Bill Amend, Dean Regas, Sean Cannon, and Katie Mack. In addition to the above, I got to meet so many other cool people during the tour, including Simone Giertz, Scott Manley, and lots of researchers, engineers, science-enthusiast kids, and other people working on all kinds of neat stuff. And thank you to everyone who waited an extra 5 minutes to get a book signed because there was a seismologist in line and I couldn’t stop myself from asking them a bunch of questions about earthquakes. A picture from my conversation with writer Alexandra Petri in Washington, DC If you weren’t able to make it to any of my tour events, How To is now available everywhere, including at Barnes and Noble, Target, Amazon, local independents, and more. Some Barnes and Noble locations and indies have special signed copies, so you can check with your bookseller to see if those are available. Posted byRandall2019-09-252019-09-26Posted inUncategorized"
