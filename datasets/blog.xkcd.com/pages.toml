full_description = "What if I wrote a book? Posted bydavean 2014-03-12 1,117 Comments on What if I wrote a book? For the last couple years, I’ve been answering your science questions on What If. Today, I’m excited to announce that the What If? book is coming! What If?: Serious Scientific Answers to Absurd Hypothetical Questions will be published September 2nd by Houghton Mifflin Harcourt. Starting today you can pre-order it from your favorite bookseller (Barnes & Noble, Amazon, Indie Bound). There are also foreign editions, including a UK and Commonwealth edition and a German edition. As I’ve sifted through the letters submitted to What If every week, I’ve occasionally set aside particularly neat questions that I wanted to spend a little more time on. This book features my answers to those questions, along with revised and updated versions of some of my favorite articles from the site. (I’m also including my personal list of the weirdest questions people have submitted.) Preorder today to get a copy as soon as it comes out! Share this:TwitterFacebookLike Loading... Related Posted bydavean2014-03-12Posted inUncategorized pompano beach concrete slab leaks says: 2014-08-21 at 2:27 am It is easy for plumbers to become exposed to compounds including mesothelioma or steer. ” I asked my friend who’s got a busy family and a full-time people-oriented job. If the base is not level or rocks, adjust it by placing the plastic shims under the base until even and not rocking. Stop by my web blog – pompano beach concrete slab leaks LikeLike Jeff says: 2014-08-22 at 10:50 am You should probably write a post on all the posts on this post… 😉 Or maybe I could use more specific terms. LikeLike Kerry says: 2014-08-31 at 10:38 pm Is there a link to a DRM free? Or at least PDF or ePub version for sale? If not this will be yet another book I BUY (I pay for things, amazing I know), then have to download when it gets stripped of crappy DRM! Or if the author says after a while that he will rel