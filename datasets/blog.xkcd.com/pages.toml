title = "Uncategorized – Page 2 – xkcd"
description = "Posts about Uncategorized written by Randall and davean"
full_description = "A puzzle for the UK Sadly, my current Thing Explainer book tour doesn’t stop in the UK (although you can come see me at London’s Royal Institution via live videolink on December 7th—tickets here). However, in lieu of an in-person visit, my publisher and I have put together a special puzzle for UK readers to solve. The puzzle has two steps. Step one is to find out where step two is. … Continue reading “A puzzle for the UK” Posted byRandall2015-11-24Posted inUncategorized A Thing Explainer word checker Want to try writing using only simple words? Here’s a writing checker you can use: xkcd.com/simplewriter. To help me write the words in my Up Goer Five picture, I taught my computer to watch my writing and tell me when one of the words I used wasn’t in the top ten hundred. After I put up my Up Goer picture, other people made things to check writing, too … Continue reading “A Thing Explainer word checker” Posted byRandall2015-09-22Posted inUncategorized7 Comments on A Thing Explainer word checker I’m going on a book trip! I made a book that explains things. It’s called Thing Explainer. It will be out soon! It’s a big flat book full of pictures of things with lots of parts. There are also little words that tell you what all the parts do. You can read more about it here! When my book comes out in two months, I’m going to visit a … Continue reading “I’m going on a book trip!” Posted byRandall2015-09-222015-09-23Posted inUncategorized3 Comments on I’m going on a book trip! New book: Thing Explainer A while ago, I posted the comic Up Goer Five, an annotated blueprint of the Saturn V rocket with all the parts described using only the thousand most common English words. Today, I’m excited to announce that I’m publishing a collection of large-format (9″x13″) Up Goer Five-style blueprints. The book is full of detailed diagrams of interesting objects, along with explanations of what … Continue reading “New book: Thing Explainer” Posted byRandall2015-05-132015-05-13Posted inUncategorized121 Comments on New book: Thing Explainer"
