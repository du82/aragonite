full_description = "Ball Pit, Phase II I posted a while back about a ball pit I’d installed in my room. Everything in that post was true, but the pictures were a little misleading. Looking at that, you don’t necessarily realize how cramped those people are. I framed the pictures to make it look larger than it actually was (THAT’S WHAT SHE … Continue reading “Ball Pit, Phase II” Posted byRandall2008-02-27Posted inUncategorized266 Comments on Ball Pit, Phase II Keeping Time A big thanks to khmer for putting together the piano arrangement in today’s comic. Thanks also to the readers who tried playing it. I hope you didn’t realize what it was until too late. Posted byRandall2008-02-27Posted inUncategorized134 Comments on Keeping Time FRUIT OPINIONS! Holy crap. This strip’s been up for 800 seconds and it’s already the most controversial thing I’ve ever written, beating out comics about cunnilingus, the Obama endorsement, and my making 4chan tiny on the map of the internet. It turns out everyone and their mother has a fruit opinion, and every one of those opinions … Continue reading “FRUIT OPINIONS!” Posted byRandall2008-02-25Posted inUncategorized571 Comments on FRUIT OPINIONS! The Laser Elevator Solar sails suck. In a 2002 paper, Laser Elevator: Momentum Transfer Using an Optical Resonator (available at your local school/library, possibly electronically — J. of Spacecraft and Rockets 2002), Thomas R. Meyer et. al. talk about a neat way to get a lot more speed out of light reflection than with a regular solar sail. … Continue reading “The Laser Elevator” Posted byRandall2008-02-15Posted inUncategorized426 Comments on The Laser Elevator Aliens? Space has been a little disappointing for the last few decades. Since the moon, everything has turned out kind of barren. Every SETI-related result of the past 30 years has been disheartening — “there was once water on Mars” doesn’t really do it for me. There are two big exceptions. One is Jupiter and Saturn’s … Continue reading “Aliens?” Posted byRandall2008-02-15Posted inUncategorized"
