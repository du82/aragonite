["https://blog.xkcd.com/2007/08/20/testing-the-9v-battery-hack-or-assault-on-battery"]
title = "Testing the 9V Battery Hack (or: Assault on Battery) – xkcd"
description = "Kipkay over at Metacafe has posted videos showing how you can take apart a 9V battery and use the cells as AAAA or AAA batteries (he has a similar trick for 12V -> 1.5V button batteries. I have played with batteries a lot in my life and never knew this. There was some speculation on…"
full_description = "Testing the 9V Battery Hack (or: Assault on Battery) Posted byRandall 2007-08-20 185 Comments on Testing the 9V Battery Hack (or: Assault on Battery) Kipkay over at Metacafe has posted videos showing how you can take apart a 9V battery and use the cells as AAAA or AAA batteries (he has a similar trick for 12V -> 1.5V button batteries. I have played with batteries a lot in my life and never knew this. There was some speculation on reddit that it was a hoax of some kind, so as a good sciencer (like a scientist, but we don’t get the lab coats) who really didn’t want to get started on the morning chores, I decided to try it myself with a new 9V I had sitting around. I learned a couple useful things. Duracell batteries are harder to open than the video implies. My dainty needle-nose pliers weren’t enough — I had to go find larger clampy ones. The edges of the case are also sharp. This would be very tricky to do in a car somewhere without tools. He tells us these are AAAA cells, which makes sense. You know, I didn’t even know AAAA cells existed until I encountered a tablet stylus that used them. The handy thing is that they can double for AAA batteries in most cases — they just won’t last as long. I decided to test them in my TI-86. One important thing he doesn’t mention is that there’s no reliable way to tell the polarity once you’ve disconnected them, so mark them somehow as you take them apart. If you’re just guessing, you’ve got 16 combinations to work through. I didn’t think about this, so I cut them apart and folded over the remaining half-tabs on each end, then tested them all with a multimeter to get the polarity (my digital multimeter is missing, so I couldn’t get exact volt-readings). I put them in the calculator. It didn’t turn on. I added a bit of aluminum foil at the contacts to make sure they were all touching. It works! So, in conclusion: This is a decent way to get AAA batteries in a pinch for a bit less than what they cost in the store, although I don’t use 9Vs for much, so situations where this is helpful are gonna be a bit rare. AAAs in a pack of 8 usually go for about $0.70 a battery, 9Vs for around $2 — so $0.33 per AAA. AAAA batteries are rare enough, and marked up enough, that if you have something that uses them this could be a worthwhile main source. Share this:TwitterFacebookLike Loading... Related Posted byRandall2007-08-20Posted inUncategorized"
