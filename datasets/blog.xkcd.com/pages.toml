["https://blog.xkcd.com/2015/09/22/a-thing-explainer-word-checker"]
title = "A Thing Explainer word checker – xkcd"
description = "Want to try writing using only simple words? Here's a writing checker you can use: xkcd.com/simplewriter. To help me write the words in my Up Goer Five picture, I taught my computer to watch my writing and tell me when one of the words I used wasn't in the top ten hundred. After I put up my Up Goer picture, other people made things to check writing, too…"
full_description = "A Thing Explainer word checker Posted byRandall 2015-09-22 7 Comments on A Thing Explainer word checker Want to try writing using only simple words? Here’s a writing checker you can use: xkcd.com/simplewriter. To help me write the words in my Up Goer Five picture, I taught my computer to watch my writing and tell me when one of the words I used wasn’t in the top ten hundred. After I put up my Up Goer picture, other people made things to check writing, too (like this one). When I decided to write Thing Explainer, I went back to the writing checker I had used and made it better. Now, I’m happy to be able to share it with everyone! To use it, just touch here and start writing. If you use a word that’s not in Thing Explainer’s set of the ten hundred, the word will turn red. (I usually count all forms of a word, like “kick” and “kicked,” together as one word, although there are a few special cases where I don’t.) Have fun explaining things! A note on the words: Some words are used more often in certain kinds of writing and talking than in others, which means different ways of counting words will give different answers for which ones we use the most. The set of ten hundred words in Thing Explainer comes from putting together many ways of counting how much people use a word to come up with a single set of ten hundred words that should sound familiar and simple to lots of people. Thank you to James Zetlen, who helped make the word checker work on other people’s computers and not just mine. Share this:TwitterFacebookLike Loading... Related Posted byRandall2015-09-22Posted inUncategorized smylers says: 2015-09-23 at 11:02 am Subverting Randall’s editor’s admiral intentions, alternative enjoyment ensues composing complete paragraphs entirely shunning Randall’s thousand commonest dictionary terms. Bombastic prose frequently results. LikeLiked by 29 people Joshua says: 2015-09-23 at 1:21 pm re-checking my favorites from the older one he linked to (had to make a few small edits): 1). If you have a line and draw another line that shows the area under it and then draw a third line that shows how fast the second line changes, the third line is the same as the first line. 2). Take a field and make a group out of all of the ways you can move the field onto itself where two ways make a new way by doing both one after the other. You can look at any smaller group in your group to find a paired smaller field in your field that is moved onto itself by all the things in your smaller group. Also, if you take any smaller field of your field there will always be a smaller group of your group that has all the ways you can move that field onto itself. LikeLiked by 2 people"
