description = '''A while ago, I posted the comic Up Goer Five, an annotated blueprint of the Saturn V rocket with all the parts described using only the thousand most common English words. Today, I'm excited to announce that I'm publishing a collection of large-format (9"x13") Up Goer Five-style blueprints. The book is full of detailed diagrams of interesting objects, along with explanations of what…'''
full_description = "New book: Thing Explainer Posted byRandall 2015-05-132015-05-13 121 Comments on New book: Thing Explainer A while ago, I posted the comic Up Goer Five, an annotated blueprint of the Saturn V rocket with all the parts described using only the thousand most common English words. Today, I’m excited to announce that I’m publishing a collection of large-format (9″x13″) Up Goer Five-style blueprints. The book is full of detailed diagrams of interesting objects, along with explanations of what all the parts are and how they work. The titles, labels, and descriptions are all written using only the thousand most common English words. Since this book explains things, I’ve called it Thing Explainer. The diagrams in Thing Explainer cover all kinds of neat stuff—including computer buildings (datacenters), the flat rocks we live on (tectonic plates), the stuff you use to steer a plane (airliner cockpit controls), and the little bags of water you’re made of (cells). Thing Explainer will be published by Houghton Mifflin Harcourt on November 24th. You can preorder it now (Amazon, Barnes & Noble, Indie Bound, Hudson); click here for links to more information and options. Or, in the spirit of the book: I had a good time drawing Up Goer Five, so I decided to draw more pictures like that and make a book of them. The book explains things, so it’s called Thing Explainer. You can’t have Thing Explainer yet, but if you want, you can order it now, and you’ll get it about a month before the end of the year. Touch these blue words to learn how to get Thing Explainer. Share this:TwitterFacebookLike Loading... Related Posted byRandall2015-05-132015-05-13Posted inUncategorized Charles Ross says: 2015-05-13 at 5:35 am This is amazing. I pre-ordered What If and was absolutely delighted with it, so I’m sure I’ll be just as happy when this arrives. Roll on November. LikeLike FiveIronFanatic says: 2015-05-13 at 5:37 am This news is good! I like the idea of the Thing Explainer. Waiting for it will be hard! LikeLike"
