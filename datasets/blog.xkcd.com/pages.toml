["https://blog.xkcd.com/page/7"]
title = "xkcd – Page 7 – The blag of the webcomic"
description = "The blag of the webcomic"
full_description = "Laptop update I’ve been busy these past few weeks on a variety of things, but a quick note: I decided on a new laptop, concluding my February agonizing. I’m replacing my Fujitsu Lifebook P1610 with a Lenovo Thinkpad x200s. Thank you to everyone who suggested it. My Lifebook isn’t quite dead yet (though this morning it was refusing to charge until I jabbed the power port with a mechanical pencil a few times), but three things motivated my choice. First, I got a chance to play with a friend’s x200s and she gave a good general report of it. Second they’re on a pretty steep sale right now (especially with the friends and family employee discount sent by a kind reader — thank you!). And third, I finally got a G1 (my first smartphone!). The G1 means that I have ssh and a browser in my pocket, so I don’t need my laptop to be quite so pocketable as I used to. By the way — I’m very happy with the G1 so far. I left Verizon to get a G1, and the T-Mobile ccoverage is actually a lot better than I was warned; so far it hasn’t been a problem at all, even on various road trips. If you are still one of those crazy people who needs an optical drive, the x301 is basically a slightly larger x200 with an optical drive bay. And the Toshiba R600 looks like another good option for high-end ultraportables, though I’ve never had a chance to see one in person. P.S. The Lenovo site layout is pretty wonky — the tech spec sheets for the x200s and x301 are tricky to find. Posted byRandall2009-06-12Posted inUncategorized134 Comments on Laptop update Duke Nukem Forever Metalist Now that the Duke Nukem Forever project is dead (until it’s sold off and picked up by someone else), there’s a lot of renewed interest in the hilarious list of things that took less time than the Duke Nukem Forever development process. It lists things such as the Beatles’ entire music career and World War II plus the Manhattan Project. What struck me was that the list itself has been around a long time. I was laughing at it years ago, and though it was updated just today, most of the items on it still date back to the original list (circa late 2005/early 2006, I think). So I present to you — and read this carefully; it’s not a mistake — a list of things that happened since the List of Things That Have Happened Since Duke Nukem Forever Was Announced was written. Barack Obama announced his candidacy, slogged through the longest Presidential campaign in American history, and was elected. Hurricane Katrina flooded New Orleans and wiped out much of the Gulf Coast. Ehud Olmert came to power in Israel, pursued a war against Lebanon, and was succeeded by Netanyahu. Chief Justice John Roberts and Justice Samuel Alito have had their entire Supreme Court careers since the list was written. The world panicked over bird flu, calmed down, panicked over swine flu, and apparently dodged a bullet. The iPhone was announced, released, and developed to the point where it could make fart noises. Windows Vista was released, sputtered a bit, and is now reaching the end of its life cycle. Additionally, the List of Things That Took Less Time Than the Duke Nukem Forever Development has been circulating for longer than each of these things took: The release of all three Lord of the Rings movies The painting of the ceiling in the Sistine Chapel (or, will be true in a few months) World War I (nearly; age of list is uncertain) The development of Windows 95 from Windows 3.1 The construction of the Empire State Building The entire run of the original Mighty Morphin’ Power Rangers show plus the first movie. The premier of Firefly, its cancellation, its growth into a geek classic, and the subsequent greenlighting, filming and release of Serenity. Posted byRandall2009-05-07Posted inUncategorized218 Comments on Duke Nukem Forever Metalist"
