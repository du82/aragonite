description = "My new book, How To: Absurd Scientific Advice for Common Real-World Problems, is coming out on September 3rd, and I'll be going on a short book tour! (Full information for each stop is included at the bottom of this post.) How to invite me to your town Don't see your city on the list? You can…"
full_description = "Book tour announcement! Posted byRandall 2019-06-102019-06-10 My new book, How To: Absurd Scientific Advice for Common Real-World Problems, is coming out on September 3rd, and I’ll be going on a short book tour! (Full information for each stop is included at the bottom of this post.) How to invite me to your town Don’t see your city on the list? You can invite me! I’ll be adding one more US stop to my tour based on the results of a challenge. The challenge: Write the best story using nothing but book covers. Arrange the titles of your favorite books into sentences that tell a story, assemble a single continuous line of people holding up the covers, and take a photo or video documenting your feat. You can make the story as long as you want, but each book needs to be held by a different human. Creative grammar is fine, and you’ll get extra credit for including as many books and people as possible. Once your photo or video entry is ready, share it in one of two ways: POST it on social media using the hashtag #howtoxkcd EMAIL it to howtoxkcd@gmail.com Submit your entry between June 10 and July 31. Make sure to include your location (city/state, US only) so we know where to find you! The winner will be announced in August. Questions? Email howtoxkcd@gmail.com with QUESTION in the subject line! Full tour information TUESDAY, SEPTEMBER 3 CAMBRIDGE, MA 7:00 PM | HARVARD SCIENCE CENTER presented by HARVARD BOOKSTORE Sanders Theater, 45 Quincy St, Cambridge, MA 02138 Tickets and information WEDNESDAY SEPTEMBER 4 WASHINGTON, DC 7:00 PM | SIDWELL FRIENDS SCHOOL presented by POLITICS & PROSE Meeting House, 3825 Wisconsin Ave, Washington, DC 20016 Tickets and information THURSDAY SEPTEMBER 5 NEW YORK, NY 7:00 PM | COOPER UNION presented by STRAND BOOK STORE E 7th St, New York, NY 10003 Tickets and information FRIDAY SEPTEMBER 6 ANN ARBOR, MI 7:00 PM | RACKHAM AUDITORIUM presented by LITERATI BOOKSTORE 915 E Washington St, Ann Arbor, MI 48109 Tickets and information SUNDAY SEPTEMBER 8 PORTLAND, OR 7:30 PM | POWELL’S CITY OF BOOKS 1005 W Burnside St, Portland, OR 97209 Event information coming soon! Click here to pre-order the book with Powell’s. MONDAY SEPTEMBER 9 SEATTLE, WA 7:00 PM | THIRD PLACE BOOKS 17171 Bothell Way NE, #A101, Lake Forest Park, WA 98155 Tickets and information TUESDAY SEPTEMBER 10 SAN FRANCISCO, CA 7:30 PM | FIRST CONGREGATIONAL CHURCH OF BERKELEY presented by KPFA and PEGASUS BOOKS 2345 Channing Way, Berkeley, CA 94704 Tickets and information WEDNESDAY SEPTEMBER 11 SANTA CRUZ, CA 7:00 PM | SANTA CRUZ BIBLE CHURCH presented by BOOKSHOP SANTA CRUZ 440 Frederick St, Santa Cruz, CA 95062 Tickets and information THURSDAY SEPTEMBER 12 LOS ANGELES, CA 8:00 PM | ARATANI THEATER presented by LIVE TALKS LA 244 S. San Pedro Street, Downtown Los Angeles, CA 90012 Tickets and information SATURDAY SEPTEMBER 14 SALT LAKE CITY, UT 7:00 PM | LIBBY GARDNER HALL @ UNIVERSITY OF UTAH presented by WELLER BOOK WORKS & UTAH TRIANGLE FRATERNITY 1375 Presidents’ Cir, Salt Lake City, UT 84112 Tickets and information MONDAY SEPTEMBER 16 KANSAS CITY, MO 7:00 PM | UNITY TEMPLE ON THE PLAZA presented by RAINY DAY BOOKS 707 W 47th St, Kansas City, MO 64112 Tickets and information TUESDAY SEPTEMBER 17 CINCINNATI, OH 7:00 PM | JOSEPH-BETH BOOKSELLERS 2692 Madison Rd, Cincinnati, OH 45208 Tickets and information WEDNESDAY SEPTEMBER 18 LOUISVILLE, KY 7:00 PM | LOUISVILLE FREE PUBLIC LIBRARY presented by CARMICHAEL’S BOOKSTORE 301 York Street, Louisville, KY 40203 RSVP/more information THURSDAY SEPTEMBER 19 RALEIGH, NC 7:00 PM | HUNT LIBRARY @ NORTH CAROLINA STATE UNIVERSITY presented by QUAILRIDGE BOOKS 1070 Partners Way, Raleigh, NC 27606 Tickets and information Share this:TwitterFacebookLike Loading... Related Posted byRandall2019-06-102019-06-10Posted inUncategorized"
