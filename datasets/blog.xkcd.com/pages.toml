["https://blog.xkcd.com/2007/01/11/the-clarkkkkson-vs-the-xkcd-number/comment-page-3"]
title = "The Clarkkkkson vs. the xkcd Number – xkcd"
description = "I just stumbled upon this webpage in which some kid (years ago, presumably in high school) who uses odd slang defined a huge number by putting various operators together and making recursive call after recursive call. He supposes that this is the biggest number anyone's ever bothered to concisely define. My intuition is that A(g64,…"
full_description = "The Clarkkkkson vs. the xkcd Number Posted byRandall 2007-01-11 168 Comments on The Clarkkkkson vs. the xkcd Number I just stumbled upon this webpage in which some kid (years ago, presumably in high school) who uses odd slang defined a huge number by putting various operators together and making recursive call after recursive call. He supposes that this is the biggest number anyone’s ever bothered to concisely define. My intuition is that A(g64, g64) (feel free to call it the xkcd number) is bigger. However, intuition is completely useless in this kind of question. The Clarkkkkson defined: http://lab6.com/old/school/yearbook/clarkkkkson.html (And the xkcd number is the result of the Ackermann function with Graham’s Number as both the arguments, as defined in this comic.) Anyone want to take a crack at setting up some correspondences and demonstrating which is bigger — The Clarkkkkson or the xkcd number? Share this:TwitterFacebookLike Loading... Related Posted byRandall2007-01-11Posted inUncategorized Lane L. says: 2007-10-19 at 11:16 pm These numbers both recursively increase, so it is quite impossible to calculate the values, let alone compare the two. K will always increase, for as long as time exists. A(g64, g64) will always increase, in theory, past time. So, the answer is, the xkcd number will be bigger than the Clarkkkkson, some while after time ends. LikeLike Ludixkcdrous says: 2007-10-22 at 6:38 pm Where A(n) is Ackermann number n, we define L(n) as A(A(A(A(…A(A(n))…) where the number of recursive A() calls is equal to the value n. The Ludixkcdrous number is defined as L(1043452800), which is the Unix epoch time of the xkcd.com domain registration. I suspect the Ludixkcdrous number is far larger than any of the previously mentioned numbers. LikeLike Danix says: 2007-10-31 at 2:51 am Ok. I did a small, simple program to calculate the Ackermann function. This is on C, limited to 2^64-1 because I’m too lazy to search a big integer library. A(4,1): [danix@phobos1 ackermann]$ time ./acker 4 1 65533 real 0m54.338s user 0m48.125s sys 0m0.237s A(4,2) seems just to be impossible to compute, or maybe I might be able to, just that I need a big integer lib. I think the process was around 10 MB when I killed it … ow. LikeLike"
