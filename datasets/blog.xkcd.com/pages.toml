m ET Note: Anyone can view the Hangout live on YouTube (Friday, 9/12, 3:30pm PT), but only 4-6 xkcd readers will be selected using this form to participate and ask questions within the Hangout itself. Apply for a chance to participate in the Hangout by Monday, August 25. Sunday, September 14 LOS ANGELES, CA Live Talks LA An afternoon with Randall Munroe The Aero Theatre 1328 Montana Avenue Santa Monica 4:30pm Seating is limited Tickets: $43 includes one book, one reserved seat; $20 general admission More details: http://livetalksla.org/blog/2014/07/13/september-14-randall-munroe/ Hope to see you there! Share this:TwitterFacebookLike Loading... Related Posted byRandall2014-07-22Posted inUncategorized"
