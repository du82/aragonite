full_description = "Trochee Chart Here’s something I made as I drew today’s comic. It’s a chart of Google results for “X Y” (in quotes) where X and Y are words from the first panel of the strip. The first word is on the top, the second down the side (the opposite of the intuitive way, of course). I generated … Continue reading “Trochee Chart” Posted byRandall2011-02-04Posted inUncategorized144 Comments on Trochee Chart Submarines I’m going through a rough period right now. There’s an illness in my family and I’m having a hard time focusing on anything but worrying and trying to take care of health stuff. Everyone is going to be okay, but it’s going to be a difficult four or five months, and I really appreciate your … Continue reading “Submarines” Posted byRandall2010-11-05Posted inUncategorized664 Comments on Submarines Miscellaneous Color Survey People have made some fun things with the color survey data already. Howard Yeend did a 3D visualization, Gissehel made some maps out of the raw data, and Rune Grimstad made a color picker tool. Also, Jacob Rus nerd sniped me with this, which is not related to the color survey but I’m … Continue reading “Miscellaneous” Posted byRandall2010-05-15Posted inUncategorized206 Comments on Miscellaneous Sex and Gender I’ve gotten a few emails and /msgs about this so I really wanted to post a clarification. When I put the color survey together, I was mostly interested in making maps and tables of color names; the opening survey was almost an afterthought. Finn added a question about chromosomal sex, since it’s closely correlated with colorblindness … Continue reading “Sex and Gender” Posted byRandall2010-05-062016-07-10Posted inUncategorized318 Comments on Sex and Gender Color Survey Results Who in the rainbow can draw the line where the violet tint ends and the orange tint begins? Distinctly we see the difference of the colors, but where exactly does the one first blendingly enter into the other? So with sanity and insanity. —Herman Melville, Billy Budd Orange, red? I don’t know what to believe … Continue reading “Color Survey Results” Posted byRandall2010-05-03Posted inUncategorized1,287 Comments on Color Survey Results"
