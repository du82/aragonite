full_description = "Parentheses Posted byRandall 2011-03-08 136 Comments on Parentheses Every now and then, I stumble on a Wikipedia passage that makes me smile. I don’t usually share them, since calling attention to them almost certainly means they’ll be rewritten or deleted, but in this case I can’t resist. The following is from the Bracket article: Parentheses may also be nested (with one set (such as this) inside another set). This is not commonly used in formal writing [though sometimes other brackets (especially parentheses) will be used for one or more inner set of parentheses (in other words, secondary {or even tertiary} phrases can be found within the main sentence)].[citation needed] To the three anonymous editors who together wrote this paragraph, thank you for brightening my day. Share this:TwitterFacebookLike Loading... Related Posted byRandall2011-03-08Posted inUncategorized Office 2010 says: 2011-12-14 at 3:59 am Wow!I really loved reading your blog. It was very well written and simple to understand. Unlike additional blogs I have read. LikeLike eve isk says: 2011-12-29 at 10:21 am Special implants that are available after carrying out these tasks is very serious power which can be charged with endless lenses — thus there is another bug – this winter. The expansion lasted 70 years and many can fiercely fight back. For a beginner cannot even think of having such a buy isk from escaping to other players. LikeLike دليل مواقع says: 2012-03-21 at 5:44 pm In my personal opinion is subject follow-up and congratulate you for the beautiful and hot topics at the same time Only accept greetings LikeLike Herp Derpson says: 2012-11-30 at 3:47 pm It’s still on Wikipedia! 😀 Thank you for this, Randall. LikeLike Brigham says: 2012-12-12 at 2:52 pm Over a year later and it’s still there, now with a citation and everything. Haha! LikeLike Kaylin says: 2012-12-31 at 9:45 am You know that trivia about “if you click the first link in the main text of any Wikipedia page, and repeat for long enough, you eventually get to Philosophy”? I tried it, and so far I either get to Philosophy within 20 moves, or get stuck in a loop. Weird, huh? It also seems that I get to Philosophy by one of only two different paths. I must investigate further… LikeLike"
