full_description = "What If book tour! Posted byRandall 2014-07-22 1,116 Comments on What If book tour! My book, What If?: Serious Scientific Answers to Absurd Hypothetical Questions, comes out September 2nd (Pre-order: Amazon, Barnes & Noble, IndieBound), and I’m excited to announce that I’ll be going on a book tour! Here’s the event list: Tuesday, September 2 CAMBRIDGE, MA Harvard Book Store at Brattle Theatre 40 Brattle St. 6:00pm (Seating is limited) – Note: this event is now sold out! But, you can still pre-order a signed copy (link below). Tickets: $26 tickets on sale August 12 at 9am ET, includes one book, one seat. More details: http://www.harvard.com/event/randall_munroe/ Pre-order a limited number of signed copies of What If? from Harvard Book Store. Friday, September 5 NEW YORK, NY Barnes & Noble – Union Square 33 E 17th St. 7:00pm Open event, seating is first come first serve. More details: http://store-locator.barnesandnoble.com/event/84245 Tuesday, September 9 SEATTLE, WA Town Hall Seattle 1119 8th Ave. 7:30pm Seating is limited – Note: this event is now sold out! Tickets: $5, one seat More details: http://www.townhallseattle.org/randall-munroe-answering-what-if/ Wednesday, September 10 SAN FRANCISCO, CA The Booksmith at Public Works 161 Erie St. 7:30pm Seating is limited – Note: this event is now sold out! Tickets: $34 includes one book, general admission; $20 general admission The bar at Public Works will be serving drinks before, during, and after the program. This event is necessarily limited to people 21 and older. More details: http://www.brownpapertickets.com/event/772183 Thursday, September 11 BERKELEY, CA Berkeley Arts & Lectures at the Hillside Club 2286 Cedar St. 7:30pm Seating is limited – Note: this event is now sold out! Tickets: $10 with student ID; $15 general admission More details: http://www.brownpapertickets.com/event/772197 Friday, September 12 Google+ Hangout On Air moderated by Hank Green Location: Online/Various 3:30pm PT/ 6:30pm ET Note: Anyone can view the Hangout live on YouTube (Friday, 9/12, 3:30pm PT), but only 4-6 xkcd readers will be selected using this form to participate and ask questions within the Hangout itself. Apply for a chance to participate in the Hangout by Monday, August 25. Sunday, September 14 LOS ANGELES, CA Live Talks LA An afternoon with Randall Munroe The Aero Theatre 1328 Montana Avenue Santa Monica 4:30pm Seating is limited Tickets: $43 includes one book, one reserved seat; $20 general admission More details: http://livetalksla.org/blog/2014/07/13/september-14-randall-munroe/ Hope to see you there! Share this:TwitterFacebookLike Loading... Related Posted byRandall2014-07-22Posted inUncategorized"
