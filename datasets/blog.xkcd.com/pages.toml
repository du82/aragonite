full_description = 'For the handful of hurricane geeks out there Selections from lost NHC discussion bulletins: HURRICANE HUMBERTO DISCUSSION NUMBER 5 NWS TPC/NATIONAL HURRICANE CENTER MIAMI FL 500 AM EDT THU SEP 13 2007 THE NATIONAL HURRICANE CENTER HAS DETERMINED...BASED ON RECON AND MODEL GUIDANCE...THAT "HUMBERTO" IS A RIDICULOUS NAME FOR A HURRICANE. THIS WILL BE THE LAST ADVISORY ISSUED CONCERNING THIS STORM...UNTIL A MORE SERIOUS NAME IS CHOSEN. $$ FORECASTER BLYTHE HURRICANE FABIAN DISCUSSION NUMBER 15 NWS TPC/NATIONAL HURRICANE CENTER MIAMI FL 5 AM EDT SUN AUG 31 2003 FORECASTER AVILA CONTINUES TO INSIST...DESPITE ALL RECON EVIDENCE...THAT IT WAS NOT HE WHO TOOK MY SANDWICH FROM THE NHC FRIDGE. THIS ASSERTION IS NOT SUPPORTED BY FORECASTER STEWART OR MY STATISTICAL MODELS...AND BASED ON THE TIGHT CLUSTERING OF GUIDANCE...I AM ISSUING A WARNING FOR FORECASTER AVILA...THAT HE HAD BETTER BRING HIS OWN LUNCH TOMORROW. THIS WILL BE THE LAST WARNING ISSUED FOR FORECASTER AVILA. $$ FORECASTER JACOBS HURRICANE JEANNE DISCUSSION NUMBER 5 NATIONAL WEATHER SERVICE MIAMI FL 5 PM EDT TUE SEP 22 1998 THIS IS JUST TO SAY...THAT THE STORM IN THE ATLANTIC...WHICH WE NAMED JEANNE...IS STRENGTHENING. IT HAS A DISTINCT EYE... LIKE A WOMAN...AND GOOD PRESENTATION ON RADAR. THIS IS ALSO TO SAY...THAT ADVISORIES MAY BE ISSUED FOR BERMUDA...WHERE A DRYING FISH...RESTS ON A BEACH...BESIDE THE COCONUT PALMS. $$ FORECASTER CARLOS WILLIAMS TROPICAL DEPRESSION IVAN DISCUSSION NUMBER 59 NWS TPC/NATIONAL HURRICANE CENTER MIAMI FL 11 PM EDT THU SEP 16 2004 THE LOW LEVEL CENTER OF CIRCULATION OF TROPICAL DEPRESSION IVAN COULD NOT BE LOCATED BY RECON...AND THE PRESENTATION IS POOR TO ABSENT ON SATELLITE IMAGERY. IT SEEMS SAFE TO ASSUME THAT...BARRING RENEWED CONVECTION ...THE CYCLONE HAS DISSAP-- ...OH GOD...HE IS HERE...IVAN IS HERE IN THE OFFICE...EVERYONE GET DOWN OH GOD HE IS INTENSIFYLKSDJFLKHHALKJKL... $$ FORECASTER PRESCOTT HURRICANE LILI DISCUSSION NUMBER 49 NATIONAL WEATHER SERVICE