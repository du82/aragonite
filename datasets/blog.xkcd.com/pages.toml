full_description = "Color Name Survey Posted byRandall 2010-03-012016-07-10 369 Comments on Color Name Survey I’d like your help for a color name survey! The survey shows you colors, and you type a name (word or phrase) you might use for that color. The names can be as broad or specific as you want. The survey is here: http://aram.xkcd.com/color/ My friend Finn (relsqui on #xkcd) wrote the frontend. I’m doing the analysis, though I won’t go too deeply into the details or purpose (to the extent that it has one) for now so as not to bias peoples’ answers. Of course, RGB is a small and relative color space which varies depending on the device displaying it, so this survey has its limits, but it’s produced some cool data so far. If any of you want to help, you can fill out a few quick questions (don’t worry if you don’t know the answers—they’re highly optional and just help with calibration) and then come up with color names. There’s no end to the survey; the more you answer, the better the data. Thanks! P.S. I’ve added a few much-requested prints and two new posters (Movie Narrative Charts and Gravity Wells) in the xkcd store. The prints of Comic #150 (Grownups) are marked backordered right now while I replace a batch that was printed wrong, but they should be shipping again within a week. Share this:TwitterFacebookLike Loading... Related Posted byRandall2010-03-012016-07-10Posted inUncategorized realizare site craiova says: 2014-09-18 at 3:30 am I am waiting for this information. Join now to share and to make our world more interesting. See you next time. LikeLike face lift says: 2014-09-27 at 9:24 am Sono davvero molto felice per la prestazione del bel info in questo sito che, per usare la grande tecnologia in questo sito. Avevo piace davvero molto per visitare la bella info in questo sito web. Questa informazione è semplice da capire le persone normali anche. LikeLike nacele says: 2014-09-29 at 7:04 am Thank you very much for writing such an interesting article on this topic. LikeLike"
