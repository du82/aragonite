title = "Math Puzzle – xkcd"
description = "This cool puzzle (and solution) comes from my friend Mike. Alice secretly picks two different real numbers by an unknown process and puts them in two (abstract) envelopes.  Bob chooses one of the two envelopes randomly (with a fair coin toss), and shows you the number in that envelope.  You must now guess whether the…"
full_description = "Math Puzzle Posted byRandall 2010-02-09 411 Comments on Math Puzzle This cool puzzle (and solution) comes from my friend Mike. Alice secretly picks two different real numbers by an unknown process and puts them in two (abstract) envelopes. Bob chooses one of the two envelopes randomly (with a fair coin toss), and shows you the number in that envelope. You must now guess whether the number in the other, closed envelope is larger or smaller than the one you’ve seen. Is there a strategy which gives you a better than 50% chance of guessing correctly, no matter what procedure Alice used to pick her numbers? I initially thought there wasn’t, or that the problem was paradoxically defined, but it turns out that it’s perfectly valid and the answer is “Yes.” See my first comment for an example of one such winning strategy. This puzzle is similar to, but not the same as, the two envelopes paradox. For more time-devouring reading, see Wikipedia’s List of Paradoxes. Share this:TwitterFacebookLike Loading... Related Posted byRandall2010-02-09Posted inUncategorized pizza dublin 2 delivery says: 2014-04-26 at 6:20 am Your way to enlighten everything on this blog is actually pleasant, everyone manage to efficiently be familiar with it, Thanks a great deal. LikeLike Agentii de turism Bucuresti says: 2014-05-03 at 10:08 am Il tuo modo di illuminare tutto su questo blog è davvero piacevole, tutti riescono ad essere efficacemente familiarità con essa, ringraziamenti molto. LikeLike Haakon Løtveit says: 2014-05-14 at 1:01 am There is of course, a really simple method of finding the answer, and that is through the amazing power of liberal arts, namely linguistics. The question is whether we can guess with more than 50% accuracy whether the number we chose is “smaller or larger”. It was also two different reals, so they cannot be the same. Therefore with 100% accuracy, we can say that yes, this number is smaller or larger than the other number, which is what the riddle asked about. LikeLike"
