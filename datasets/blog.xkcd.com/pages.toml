full_description = "Growing Up I was thinking of getting a couch or something for my room, somewhere for guests to lounge around. Fuck new couches. I now have a ball pit in my room. I talked a little bit to Mike Machenry, who built a ball pit last year after reading my comic about it. The big problem with … Continue reading “Growing Up” Posted byRandall2007-11-19Posted inUncategorized586 Comments on Growing Up 1337 Last week’s story arc was a lot of fun for me. I hope you enjoyed it! A few notes for the more pedantic readers: In Part 2, Elaine and Dr. Knuth are not competing to calculate the time-complexity of a known algorithm. They’re each trying to develop an algorithm to solve a particular problem. His … Continue reading “1337” Posted byRandall2007-11-19Posted inUncategorized WetRiffs.com WetRiffs.com now has pictures up. Thank you to everyone who submitted — it turned out great! See the page and gallery for my comments. Posted byRandall2007-10-10Posted inUncategorized Embarassing Typo Confession: The mispelling (now fixed) in today’s comic got there acciddentaly; it wasn’t another little joke, just hubris striking. “Foreign” is one of those words I mispelled unknowingly for years. I’ve corrected it — on principal I usualy don’t edit comics after the first few minutes they’ve been up, but most of the time I’m … Continue reading “Embarassing Typo” Posted byRandall2007-10-08Posted inUncategorized Wikipedia: Blogs Wikipedia’s entry on blogs, with everything that is not the word ‘blog’ (or a derivative thereof) removed: Blog Blog blog Blog Blog blog Blog blog blogs blog blogs blogs blogs photoblog sketchblog blog blog blogging blogging blogs blog blogs blogging Blogging blogging blogging blog blog blog blog blog blog blog blogging bloggers blog blogging bloggers … Continue reading “Wikipedia: Blogs” Posted byRandall2007-10-06Posted inUncategorized174 Comments on Wikipedia: Blogs Bunny, Showers Lem’s Bunny asks the natural follow-up question to today’s comic. For those of you who have been waiting patiently: the submissions to WetRiffs.com will be going up soon — we’re just handling some final influxes of sexy. If any of you have any guitar-shower pictures you want to submit, now’s the time! Posted byRandall2007-10-05Posted inUncategorized90 Comments on Bunny, Showers"
