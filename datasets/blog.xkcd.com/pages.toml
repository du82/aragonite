full_description = "Raptor shirts! Posted byRandall 2006-10-23 73 Comments on Raptor shirts! A new “No Raptors” shirt has gone up in the store (which is now almost completely restocked in the other shirts)! I’ve stocked up on a bunch of these ahead of time so they’re up for sale right away with no preorder period! Before putting them up, I got some friends together to take pictures in them. The results were awesome: I made a collage of the pictures, featuring me and a bunch of friends who are mostly from CNU. They were a lot of fun to take. TRIVIA: Next to the girls in the anatomy lab pictures there were two grad students dissecting a small dog. They were a little confused as to why we were in their lab being so triumphant about science, especially since the building was supposed to be locked, but in the end they decided that we weren’t a threat! Which was good because they had a bunch of really sharp knives. I hope you guys enjoy the shirts! So far I’ve had more friends buy their own, after seeing the samples, than any other shirt, so I think they’re gonna do well! Also, all the previously backordered shirts are going out today and tomorrow, so you should get those soon. Share this:TwitterFacebookLike Loading... Related Posted byRandall2006-10-23Posted inUncategorized Umbrae says: 2006-10-23 at 9:26 am Haha, amazing. You should get a couple photo’s of the Just Shy shirt up too – I know from the forums there were a couple questions as to what that actually looked like on a shirt. From these examples though, I assume the color is a pretty accurate representation. Also, cool to see what the guy who writes my favorite comic actually looks like. LikeLike Kaoru says: 2006-10-23 at 10:32 am Ooh a photo of you, now you’re gonna get accosted on the street! Acronym Finder tells me CNU stands for: Christopher Newport University Chungnam National University Congress for the New Urbanism Chonnam National University Chonbuk National University Consiglio Nazionale degli Utenti California National University Consolidated Narcotics Unit Which are you at? 🙂 (I’m sure the answer is around if I look, but that removes my reason for commenting, and I’m sure you love getting comments… :P) LikeLike"
