title = "Answering Ben Stein's Question – xkcd"
description = "Ben Stein published a pretty awful editorial defending Dominique Strauss-Kahn, the IMF head arrested for sexual assault. Now, I don't disagree with him about the presumption of innocence, but the rest of the article effectively argues that smart, rich people simply don't commit crimes. In particular, he says this: In life, events tend to follow…"
full_description = "Answering Ben Stein's Question Posted byRandall 2011-05-18 310 Comments on Answering Ben Stein's Question Ben Stein published a pretty awful editorial defending Dominique Strauss-Kahn, the IMF head arrested for sexual assault. Now, I don’t disagree with him about the presumption of innocence, but the rest of the article effectively argues that smart, rich people simply don’t commit crimes. In particular, he says this: In life, events tend to follow patterns. People who commit crimes tend to be criminals, for example. Can anyone tell me any economists who have been convicted of violent sex crimes? On a whim, I just did a little research, and couldn’t believe what I found. Guess who holds an economics degree? Paul Bernardo. For those not familiar with the case, Bernardo is one of the nastiest serial killers in history. He and his wife drugged, raped, and tortured to death a number of schoolgirls in the late 80’s and early 90’s. The story is the stuff of nightmares. I’ll leave the debate over the rest of Mr. Stein’s article to others. But as for his suggestion that studying economics precludes becoming a violent sex criminal, it seems history provides one hell of a counterexample. Edit: James Urbaniak has a list of some other economists involved in sex crimes. Share this:TwitterFacebookLike Loading... Related Posted byRandall2011-05-18Posted inUncategorized are some says: 2014-07-25 at 2:03 am Richards proved helpful as a Expert Plumber before operating at Viega, and has positive factors to say about a career in water program. Richards became a item instructor at Viega after he was fired from his job truly. Brian Vance LikeLike کرکره برقی says: 2014-07-30 at 4:19 am Hi dear, Very Informative and a very good post on the blog. King regards LikeLike درب اتوماتیک says: 2014-08-06 at 5:19 am Me gusta la información útil que usted proporciona en sus mensajes. Voy a marcar su weblog y comprobar de nuevo aquí con frecuencia. Gracias! LikeLike"
