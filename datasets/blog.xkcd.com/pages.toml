title = "Ball Pit, Phase II – xkcd"
description = "I posted a while back about a ball pit I'd installed in my room. Everything in that post was true, but the pictures were a little misleading. Looking at that, you don't necessarily realize how cramped those people are. I framed the pictures to make it look larger than it actually was (THAT'S WHAT SHE…"
full_description = "Ball Pit, Phase II Posted byRandall 2008-02-27 266 Comments on Ball Pit, Phase II I posted a while back about a ball pit I’d installed in my room. Everything in that post was true, but the pictures were a little misleading. Looking at that, you don’t necessarily realize how cramped those people are. I framed the pictures to make it look larger than it actually was (THAT’S WHAT SHE SAID). In fact, the ball pit was only about the size of a large bathtub or small jacuzzi. In the pictures on the site, it was barely deep enough to be buried in, and when we shrunk the area to make it deeper, it was barely big enough for two people. When people came in and saw it, they were always startled at how small it was (also what she said). There was no room for hide and seek, and barely even space for surreptitious ball-pit groping. This was a terrible state of affairs. It was nice to sit in, but really, why bother having a ball pit if we were gonna do such a half-assed job of it? Well, as of this week, the situation has been rectified. We all chipped in and quintupled the volume of the ball pit. It’s now set up opposite a hacked-together server-projector system (yes, that means Guitar Hero in the ball pit — that’s a controller you see on the left). It’s lined with blankets and foam padding, and is oh so comfortable. We’ve had two people fall asleep in it already. For sanitary reasons, we of course have a few rules: It’s still only half the size of the recently-constructed Last.fm ballpit. But it’s finally big enough to really hide in, stretch out, and grab someone’s ass without them being sure who did it. On the other hand, it has the slightly unnerving effect that we now have no idea how many people are in the apartment at any given time. For science, the next experiment will be “what do cats think of ball pits?” Share this:TwitterFacebookLike Loading... Related Posted byRandall2008-02-27Posted inUncategorized missi says: 2012-07-12 at 2:26 pm THIS is what you do with that unused hot tub in the back yard! No messy chemicals here! LikeLike"
