["https://blog.xkcd.com/2011/12/31/godaddy"]
title = "GoDaddy – xkcd"
description = "xkcd.com is registered with GoDaddy. This is an artifact of my registering my own domains nearly ten years ago, back when I was completely new to making websites. I've always been a little uneasy about having all my domains with them, since they've got a long history of screwing over domain owners, but never got…"
full_description = "GoDaddy Posted byRandall 2011-12-31 290 Comments on GoDaddy xkcd.com is registered with GoDaddy. This is an artifact of my registering my own domains nearly ten years ago, back when I was completely new to making websites. I’ve always been a little uneasy about having all my domains with them, since they’ve got a long history of screwing over domain owners, but never got around to doing anything about it. A little while back, as the SOPA thing blew up, I poked davean, the xkcd sysadmin, about whether it was time to make switching to someone more geek-friendly a priority. He’s also wanted to switch away from GoDaddy for years (and recently met with the reddit folks to chat about SOPA stuff). He’s periodically done surveys of the alternatives, but—strange as it sounds—he’s actually had trouble finding an affordable registrar with the feature set we needed. In particular, he said he had trouble finding any that support IPv6 Glue and DNSSEC via a control system that doesn’t rely on filing and waiting on support tickets, which he says (and I quote) “freaks me out” as a means of handling registrar stuff (he’s very much an xkcd.com/705 style of administrator). The ones that did offer those features tended to be a little too high-priced for our large number of domains. We’ve had a number of alternatives recommended in the past week or two, but none have quite satisfied davean’s criteria. If you know of any registrars that might work for us, you can email us at contact@xkcd.com and he’ll take a look. We’re being cautious about how we handle this switch, since GoDaddy has seemingly been obstructing transfers in a way that can leave the sites trapped in limbo. But don’t worry—it’s in the works! Share this:TwitterFacebookLike Loading... Related Posted byRandall2011-12-31Posted inUncategorized تور آنتالیا says: 2014-07-01 at 9:43 am Hey There. I found your blog using msn. This is a very well useful info. Thanks for the post. I will definitely comeback. written article. I will make sure to bookmark it and return to read more of your LikeLike"
