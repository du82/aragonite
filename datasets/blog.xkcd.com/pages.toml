["https://blog.xkcd.com/2012/07/02/groundhog-day-correction/comment-page-6"]
title = "Groundhog Day correction – xkcd"
description = "A number of people have mentioned an issue with today's comic—in the movie Groundhog Day, it's actually implied that Phil, Bill Murray's character, didn't have sex with Rita. He took her home to his room, but they woke up in the same clothes they fell asleep in. I haven't seen the movie in a number of years, but…"
full_description = "Groundhog Day correction Posted byRandall 2012-07-02 347 Comments on Groundhog Day correction A number of people have mentioned an issue with today’s comic—in the movie Groundhog Day, it’s actually implied that Phil, Bill Murray’s character, didn’t have sex with Rita. He took her home to his room, but they woke up in the same clothes they fell asleep in. I haven’t seen the movie in a number of years, but I think they’re right—and bit of Googling suggests that I’m not the only one who was confused on that point. Groundhog Day is, like Office Space, a comedy containing a gimmick that really sticks with you, even as the rest of the story fades. Or, at least, it did with me—I’ve probably seen the movie a couple of times, but I think I’ve spent a lot more time dwelling on the time loop scenario it describes. Now that people have raised the question, I’m not even sure that I interpreted the scene this way when I was watching it. From a sci-fi point of view, the whole idea that the time loop was broken by emotional/personal development seemed kind of cheesy, but I just chalked that up to one of those things movies do because that’s how we like stories to work. Nobody wants a movie where the climax consists of an hour of excitedly inferring and testing revisions to the standard model of physics. (Or, at least, there aren’t enough of us to support a big-budget movie.) So while drawing my comic, I remembered that the time loop ended after he took Rita back to his room, and I filled in the typical romanticized Sleeping Beauty idea that I assumed had gone with it. I appreciate the corrections—in addition to being a reminder to double-check pop culture references, it’s driven home for me what a neat, original movie Groundhog Day really is. And now I wonder what kind of misconceptions I have about Ghostbusters. Share this:TwitterFacebookLike Loading... Related Posted byRandall2012-07-02Posted inUncategorized here says: 2014-05-05 at 4:40 pm I will continue to practice and re write the review when I get better. Purchased the lead sled for my husband who is a paraplegic with limited use of one arm. But after using this for so long, I’m starting to associate the smell with poop! Seriously! So now when I smell this diaper cream, it smells to me like my son has a dirty diaper, even when he doesn’t. It’s perfect, the shot are crystal clear, the zoom is smooth and the autofocus is just as good as with the smaller lens. I have a six-year-old and a 4-year-old who use this book. For instance he says the best runners are probably doing things right regardless of what science seems to indicate and we should copy them, but then he supports weights and other cross training. Those are now my favorites, especially for the price, (about 1/2 to 1/3 the price of a comparable Braun). It keeps track of my calories, carbs, fat etc, plus my calories burned during exercise. Have always considered books of all genres be well written and grab your attention immediately. One need not muddle through a slow, descriptive beginning. LikeLike"
