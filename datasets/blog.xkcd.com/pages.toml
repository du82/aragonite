full_description = "What If 2 I’m excited to announce that I’m publishing a What If? sequel! What If? 2: Additional Serious Scientific Answers to Absurd Hypothetical Questions will be in stores 9/13, and is available for preorder now! In What If 2, I answer new questions I’ve receieved in the years since What If? was released. People have asked about … Continue reading “What If 2” Posted byRandall2022-01-31Posted inUncategorized Book tour wrap-up Thank you to everyone who came to events on my book tour! It was a wild ride visiting so many cities in short succession. Thank you so much to the booksellers, venues, and especially to the wonderful people who co-hosted the tour events with me: Kate Darling, Alexandra Petri, Lev Grossman, Jim Ottaviani, Ken Jennings, … Continue reading “Book tour wrap-up” Posted byRandall2019-09-252019-09-26Posted inUncategorized How to Send a File My new book, How To: Absurd Scientific Advice for Common Real-World Problems, comes out in a week! You can preorder it now on Amazon, Barnes & Noble, IndieBound, and Apple Books. Here’s an excerpt from the How To chapter on file transfers. Chapter 19: How to Send a File Sending large data files can be difficult. Modern software systems have moved … Continue reading “How to Send a File” Posted byRandall2019-08-26Posted inUncategorized Book tour and contest winner The winner We got a huge number of submissions to the How To book tour challenge, and I’m delighted to announce the winner: The How To book tour will be taking me to Juneau, Alaska, thanks to an entry from Juneau’s Mendenhall Valley Public Library. The 98-person entry was submitted in a series of four … Continue reading “Book tour and contest winner” Posted byRandall2019-08-232019-08-27Posted inUncategorized Serena Versus the Drones My new book, How To, comes out on September 3rd (preorder: Amazon, Barnes & Noble, IndieBound, and Apple Books). One of the most exciting things about writing How To was that, for a few chapters, I was able to reach out to some extremely cool people who were willing to apply their unique expertise to ridiculous … Continue reading “Serena Versus the Drones” Posted byRandall2019-08-162019-08-16Posted inUncategorized"
