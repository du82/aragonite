title = "FRUIT OPINIONS! – xkcd"
description = "Holy crap. This strip's been up for 800 seconds and it's already the most controversial thing I've ever written, beating out comics about cunnilingus, the Obama endorsement, and my making 4chan tiny on the map of the internet. It turns out everyone and their mother has a fruit opinion, and every one of those opinions…"
full_description = "FRUIT OPINIONS! Posted byRandall 2008-02-25 571 Comments on FRUIT OPINIONS! Holy crap. This strip’s been up for 800 seconds and it’s already the most controversial thing I’ve ever written, beating out comics about cunnilingus, the Obama endorsement, and my making 4chan tiny on the map of the internet. It turns out everyone and their mother has a fruit opinion, and every one of those opinions is now in my inbox. Just remember to keep some perspective. If you think watermelon is delicious, and I think it’s only so-so, the important thing is that we each find something we like. Who’s to say whose taste is right? I am. You are wrong; watermelon is overrated. Also, I have never liked cantaloupe. It brings down otherwise tasty fruit salads. There, I said it. Share this:TwitterFacebookLike Loading... Related Posted byRandall2008-02-25Posted inUncategorized jhondeny1 says: 2010-12-04 at 7:44 pm This is a great idea, this new generation, and everyone can gather and use information from this site for any new step in life. It begins with a relatively high because the ordinary things can be very pleasant. Then decreases when it comes to some controversial things, but boring. It is also my success in life, which is why I am such a fan. and now I want to share your comments about this web site, and I hope that everyone can enjoy, and comments from my clients… LikeLike renee says: 2010-12-04 at 10:03 pm I am probably one of your few old fans (I am 55) that aren’t in your biological family. I love your comic and I would be honored to give you a free pie if you come to my bakery, I promise you will remain anonymous among my hipster staff. Just let me know what type of pie you like and I’ll make sure and make it especially for you, You are so damn funny and smart. LikeLiked by 1 person Ron says: 2011-04-19 at 2:31 pm Can I throw in another vote for submitting this strip to Threadless? Would be awesome! Lemme know if you’ve already done it. LikeLike christian louboutin says: 2011-05-16 at 2:10 am Holy crap. This strip’s been up for 800 seconds and it’s already the most controversial thing I’ve ever written, beating out comics about cunnilingus, the Obama endorsement, and my making 4chan tiny on the map of the internet. It turns out everyone and their mother has a fruit opinion, and every one of those opinions is now in my inbox. LikeLike"
