title = "MIT Talk – xkcd"
description = "(Note: Firefox crashed just as I was finishing this post. This is a terse recreation, as I'm about to collapse.) I gave a talk at MIT yesterday (now the day before yesterday). It was wonderful. I had never really done this kind of thing before, but it went so much better than I expected. I…"
full_description = "MIT Talk Posted byRandall 2007-05-16 175 Comments on MIT Talk (Note: Firefox crashed just as I was finishing this post. This is a terse recreation, as I’m about to collapse.) I gave a talk at MIT yesterday (now the day before yesterday). It was wonderful. I had never really done this kind of thing before, but it went so much better than I expected. I had someone tell me afterward that my talk was better than the one by the Penny Arcade guys, and that I was funnier in real life than in the comic. It’s hard to imagine better praise than that. The talk sold out early and the place was packed: I was stalked by RoboRaptors and pelted with playpen balls (which fell from the ceiling in the middle of the talk, courtesy some mysterious party) : Feeling a lot less tired than I look in this picture, I signed playpen balls (with jokes about spherical geometry), comic prints, tickets, and — at one point — breasts. There are more pictures here. Firefox keeps crashing. Here are some brief Things I Did: – Made fun of audience member’s mom, said “fuck you” to some of the world’s top young computational linguists, and answered a question by whistling the “Katamari Damacy” theme. – Finally managed to give davean credit for all his work, in public, in circumstances where he couldn’t escape. He pretended to be annoyed later, but only a little. – Met lovely people who twirled burning things at high speeds out on the lawn at night. Oh, and I don’t know of any video of the lecture yet, aside from one bit floating around. It should be out there somewhere. But hour-long videos with troubled audio are no fun — what I’d like to find is a transcript, like the one of the Penny Arcade talk (although those are a lot of work to create). But I’m content just remembering how cool it all was. Thank you to everyone involved, and I’m sorry to everyone who I couldn’t give enough time to that night (after the lecture, I was meeting and talking to so many people that I had trouble keeping track of who was where and when, or who I was speaking with from one minute to the next). But it was a lot of fun. Let’s do this again sometime soon. Share this:TwitterFacebookLike Loading... Related Posted byRandall2007-05-16Posted inUncategorized"
