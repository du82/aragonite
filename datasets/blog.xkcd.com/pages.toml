full_description = "New Electric Skateboard Happy pi day, everyone! My skateboard was broken for the past five or six months, and rather than get it repaired, I traded it in for a new, more powerful model. For a cost of about $120, I now have a board that can go zero to 20 mph in four seconds. This is a … Continue reading “New Electric Skateboard” Posted byRandall2008-03-14Posted inUncategorized315 Comments on New Electric Skateboard Ball Pit, Phase II I posted a while back about a ball pit I’d installed in my room. Everything in that post was true, but the pictures were a little misleading. Looking at that, you don’t necessarily realize how cramped those people are. I framed the pictures to make it look larger than it actually was (THAT’S WHAT SHE … Continue reading “Ball Pit, Phase II” Posted byRandall2008-02-27Posted inUncategorized266 Comments on Ball Pit, Phase II Keeping Time A big thanks to khmer for putting together the piano arrangement in today’s comic. Thanks also to the readers who tried playing it. I hope you didn’t realize what it was until too late. Posted byRandall2008-02-27Posted inUncategorized134 Comments on Keeping Time FRUIT OPINIONS! Holy crap. This strip’s been up for 800 seconds and it’s already the most controversial thing I’ve ever written, beating out comics about cunnilingus, the Obama endorsement, and my making 4chan tiny on the map of the internet. It turns out everyone and their mother has a fruit opinion, and every one of those opinions … Continue reading “FRUIT OPINIONS!” Posted byRandall2008-02-25Posted inUncategorized571 Comments on FRUIT OPINIONS! The Laser Elevator Solar sails suck. In a 2002 paper, Laser Elevator: Momentum Transfer Using an Optical Resonator (available at your local school/library, possibly electronically — J. of Spacecraft and Rockets 2002), Thomas R. Meyer et. al. talk about a neat way to get a lot more speed out of light reflection than with a regular solar sail. … Continue reading “The Laser Elevator” Posted