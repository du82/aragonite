["https://blog.xkcd.com/2019/02/05/how-to-absurd-scientific-advice-for-common-real-world-problems"]
title = "How To: Absurd Scientific Advice for Common Real-World Problems – xkcd"
description = "I’m excited to announce that I have a new book coming out! It’s titled How To: Absurd Scientific Advice for Common Real-World Problems, and it’s an extremely unhelpful guide to solving everyday problems. How To is an instruction manual for taking everyday problems and using science and creative thinking to turn them into much bigger and…"
full_description = "How To: Absurd Scientific Advice for Common Real-World Problems Posted byRandall 2019-02-052019-02-05 1 Comment on How To: Absurd Scientific Advice for Common Real-World Problems I’m excited to announce that I have a new book coming out! It’s titled How To: Absurd Scientific Advice for Common Real-World Problems, and it’s an extremely unhelpful guide to solving everyday problems. How To is an instruction manual for taking everyday problems and using science and creative thinking to turn them into much bigger and more exciting problems. It teaches you how to cross a river by boiling it, outlines some of the many uses for lava around the home, and walks you through how to use experimental military research to ensure that your friends will never again ask you to help them move. From changing a lightbulb to throwing a pool party, it describes unusual ways to accomplish common tasks, and analyzes what would happen to you if you tried them. In addition to being a profoundly unhelpful self-help book, it’s an exercise in applying math, science, and research to ordinary problems, and a tour through some of the strange and fun science underlying the world around us. How To will be released on September 3rd, but you can preorder it now from Amazon, Barnes & Noble, Books-A-Million, Indie Bound, and Apple Books. For more, you can check out my Q&A with Entertainment Weekly about the book, and you can find details about foreign editions at xkcd.com/how-to. Share this:TwitterFacebookLike Loading... Related Posted byRandall2019-02-052019-02-05Posted inUncategorized Lei Lani says: 2019-02-19 at 11:08 am Mr. Munroe, Thank you for making my gift-giving choices so easy these past few years! Books are always on my list of things-to-gift, and you have authored/illustrated books for every geek and geek-in-training on my list (which is most of my people!). So many trips to Wikipedia have been initiated by your comments on your strips. Thanks for furthering my education in such a wonderful way! LikeLiked by 1 person"
