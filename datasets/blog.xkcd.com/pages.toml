["https://blog.xkcd.com/2012/07/02/groundhog-day-correction/comment-page-7"]
title = "Groundhog Day correction – xkcd"
description = "A number of people have mentioned an issue with today's comic—in the movie Groundhog Day, it's actually implied that Phil, Bill Murray's character, didn't have sex with Rita. He took her home to his room, but they woke up in the same clothes they fell asleep in. I haven't seen the movie in a number of years, but…"
full_description = "Groundhog Day correction Posted byRandall 2012-07-02 347 Comments on Groundhog Day correction A number of people have mentioned an issue with today’s comic—in the movie Groundhog Day, it’s actually implied that Phil, Bill Murray’s character, didn’t have sex with Rita. He took her home to his room, but they woke up in the same clothes they fell asleep in. I haven’t seen the movie in a number of years, but I think they’re right—and bit of Googling suggests that I’m not the only one who was confused on that point. Groundhog Day is, like Office Space, a comedy containing a gimmick that really sticks with you, even as the rest of the story fades. Or, at least, it did with me—I’ve probably seen the movie a couple of times, but I think I’ve spent a lot more time dwelling on the time loop scenario it describes. Now that people have raised the question, I’m not even sure that I interpreted the scene this way when I was watching it. From a sci-fi point of view, the whole idea that the time loop was broken by emotional/personal development seemed kind of cheesy, but I just chalked that up to one of those things movies do because that’s how we like stories to work. Nobody wants a movie where the climax consists of an hour of excitedly inferring and testing revisions to the standard model of physics. (Or, at least, there aren’t enough of us to support a big-budget movie.) So while drawing my comic, I remembered that the time loop ended after he took Rita back to his room, and I filled in the typical romanticized Sleeping Beauty idea that I assumed had gone with it. I appreciate the corrections—in addition to being a reminder to double-check pop culture references, it’s driven home for me what a neat, original movie Groundhog Day really is. And now I wonder what kind of misconceptions I have about Ghostbusters. Share this:TwitterFacebookLike Loading... Related Posted byRandall2012-07-02Posted inUncategorized تاسیسات مکانیکی says: 2014-07-30 at 4:05 am Hello , Nice story of your pal thanks for sharing. تاسیسات مکانیکی Thanks LikeLike"
