er-the-top worst-case disaster scenario. One of the panels was actually slightly more plausible than the others. It was based on a real disaster which almost happened in 1973, and in two weeks it may come closer to happening than … Continue reading “Michael Bay's Scenario” Posted byRandall2011-05-08Posted inUncategorized205 Comments on Michael Bay's Scenario"
