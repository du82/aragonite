["https://blog.xkcd.com/2007/01/11/the-clarkkkkson-vs-the-xkcd-number"]
title = "The Clarkkkkson vs. the xkcd Number – xkcd"
description = "I just stumbled upon this webpage in which some kid (years ago, presumably in high school) who uses odd slang defined a huge number by putting various operators together and making recursive call after recursive call. He supposes that this is the biggest number anyone's ever bothered to concisely define. My intuition is that A(g64,…"
full_description = "The Clarkkkkson vs. the xkcd Number Posted byRandall 2007-01-11 168 Comments on The Clarkkkkson vs. the xkcd Number I just stumbled upon this webpage in which some kid (years ago, presumably in high school) who uses odd slang defined a huge number by putting various operators together and making recursive call after recursive call. He supposes that this is the biggest number anyone’s ever bothered to concisely define. My intuition is that A(g64, g64) (feel free to call it the xkcd number) is bigger. However, intuition is completely useless in this kind of question. The Clarkkkkson defined: http://lab6.com/old/school/yearbook/clarkkkkson.html (And the xkcd number is the result of the Ackermann function with Graham’s Number as both the arguments, as defined in this comic.) Anyone want to take a crack at setting up some correspondences and demonstrating which is bigger — The Clarkkkkson or the xkcd number? Share this:TwitterFacebookLike Loading... Related Posted byRandall2007-01-11Posted inUncategorized کانتر بانک says: 2013-11-27 at 8:10 am Clarkkkksonplex is equal to ck(Aclarkkkkson,Aclarkkkkson,Aclarkkkkson,Aclarkkkkson), using the definitions on the clarkkkkson page. The term is coined by Aarex Tiaokhiao. LikeLike Thrawn says: 2013-12-12 at 2:52 pm I’m going to try to give my $0.02 as simply as possible. As has been previously mentioned, Clarkkkson got the hyper function wrong, making it left-associative instead of right-associative. This severely cripples it, because a^a^a = a^(a^a), but (a^a)^a = a^(a*a), which is obviously much smaller when using values of a greater than 2. Instead of a real power tower, it simply produces a large exponent. If we fix this and use the correct hyper function, then there is no contest. Graham’s number can be expressed in Knuth’s arrow notation as x ^y z, where x and z are 3, and y is determined through a 64-stage recursive process of y_n = 3 ^y_(n-1) 3, starting with y_1 = 4. Running it through the Ackermann function basically just adds a 65th stage, with x = 2, y = g64, z = g64. By comparison, Clarkkkson starts with x, y_1, and z all equal to k, which is at least 100. It then grows x and z along with y (whereas Graham keeps them at 3), and it uses k stages instead of 65. The repeats and the whole factorial aspect are just icing on the cake; Clarkkkson wins, hands down. If, on the other hand, we keep the broken hyper function, things are much less clear-cut. The explosive growth of x and z will certainly go a long way toward compensating, and the repeats and factorials will help too. After all, (100^100)^100 > 3^(3^3). But at higher values of y, the crippling really matters, and I wouldn’t be surprised if a better mathematician than myself declared xkcd the winner. LikeLiked by 1 person"
year_published = 2007
year_updated = 2007
