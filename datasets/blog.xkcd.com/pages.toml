title = "Radiation Chart – xkcd"
description = '''There's a lot of discussion of radiation from the Fukushima plants, along with comparisons to Three Mile Island and Chernobyl. Radiation levels are often described as "<X> times the normal level" or "<Y>% over the legal limit," which can be pretty confusing. Ellen, a friend of mine who's a student at Reed and Senior Reactor…'''
full_description = "Radiation Chart Posted byRandall 2011-03-19 809 Comments on Radiation Chart There’s a lot of discussion of radiation from the Fukushima plants, along with comparisons to Three Mile Island and Chernobyl. Radiation levels are often described as “<X> times the normal level” or “<Y>% over the legal limit,” which can be pretty confusing. Ellen, a friend of mine who’s a student at Reed and Senior Reactor Operator at the Reed Research Reactor, has been spending the last few days answering questions about radiation dosage virtually nonstop (I’ve actually seen her interrupt them with “brb, reactor”). She suggested a chart might help put different amounts of radiation into perspective, and so with her help, I put one together. She also made one of her own; it has fewer colors, but contains more information about what radiation exposure consists of and how it affects the body. I’m not an expert in radiation and I’m sure I’ve got a lot of mistakes in here, but there’s so much wild misinformation out there that I figured a broad comparison of different types of dosages might be good anyway. I don’t include too much about the Fukushima reactor because the situation seems to be changing by the hour, but I hope the chart provides some helpful context. (Click to view full) Note that there are different types of ionizing radiation; the “sievert” unit quantifies the degree to which each type (gamma rays, alpha particles, etc) affects the body. You can learn more from my sources list. If you’re looking for expert updates on the nuclear situation, try the MIT NSE Hub. Ellen’s page on radiation is here. Lastly, remember that while there’s a lot of focus on possible worst-case scenarios involving the nuclear plants, the tsunami was an actual disaster that’s already killed thousands. Hundreds of thousands more, including my best friend from college, are in shelters with limited access to basic supplies and almost no ability to contact the outside world. If you’re not sure how to help, Google’s Japan Crisis Resource page is a good place to start. Edit: For people who asked about Japanese translations or other types of reprinting: you may republish this image anywhere without any sort of restriction; I place it in the public domain. I just suggest that you make sure to include a clear translation of the disclaimer that the author is not an expert, and that anyone potentially affected by Fukushima should always defer to the directives of regional health authorities. Share this:TwitterFacebookLike Loading... Related Posted byRandall2011-03-19Posted inUncategorized"
