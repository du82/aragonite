full_description = "MIT Programming Team MIT has a BattleCode programming competition, (which reminds me of Robowar, the reason I didn’t have a high-school social life). This year, [at least] one of the teams was a group of xkcd readers — Nicole, Bobby, and Jessica. They are fun people who I actually had the pleasure of meeting briefly while visiting Boston … Continue reading “MIT Programming Team” Posted byRandall2007-03-16Posted inUncategorized53 Comments on MIT Programming Team In which I lose the originals of the last three months of comics and the laptop I create them with. I draw all my comics on paper, but I scan and process them on my lovely Fujitsu Lifebook P1510, a tiny hybrid tablet computer (it’s the size of a hardback book). I have high-resolution versions of all the comics, which I use for print versions and shirts and such. I used to save them to … Continue reading “In which I lose the originals of the last three months of comics and the laptop I create them with.” Posted byRandall2007-03-15Posted inUncategorized Large numbers I mentioned an extremely large number in this comic, and then talked a little about comparing it to another large number in this blag post. But all the numbers discussed had a sense of arbitrariness to them. The xkcd number was just a function that grew rapidly plus a large argument. I’ve been thinking about … Continue reading “Large numbers” Posted byRandall2007-03-14Posted inUncategorized Velociraptor Safety I recently received a letter from Dr. Daniel Snyder, a paleontologist from Knox College, who wanted to share some theories on handling dromeosaurids: Dear sir, I have recently been introduced to your Web comic, and I write in great admiration. You have a keen mind and wit, as well as the artistic ability to convey … Continue reading “Velociraptor Safety” Posted byRandall2007-03-04Posted inUncategorized198 Comments on Velociraptor Safety Washington's Farewell Address Translated into Everyday Speech I’ve often heard that Washington’s ‘Farewell Address’ — the speech he sent out (in written form) to a bunch of papers at the end of his second term — is important. Apparently he lays down a lot of good ideas for America. But the common style of writing and vocabulary has changed since then. Maybe … Continue reading “Washington's Farewell Address Translated into Everyday Speech” Posted byRandall2007-01-29Posted inUncategorized333 Comments on Washington's Farewell Address Translated into Everyday Speech"
