title = "San Diego Comic-Con – xkcd"
description = "I'm going to be at Comic-Con in San Diego this week! I'll be appearing on panels with some really neat people for conversations about science, comics, and writing, and talking about my new book, How To: Absurd Scientific Advice for Common Real-World Problems. Here's my panel/event schedule. If you're attending, come see me there! THURSDAY…"
full_description = "San Diego Comic-Con Posted byRandall 2019-07-15 I’m going to be at Comic-Con in San Diego this week! I’ll be appearing on panels with some really neat people for conversations about science, comics, and writing, and talking about my new book, How To: Absurd Scientific Advice for Common Real-World Problems. Here’s my panel/event schedule. If you’re attending, come see me there! THURSDAY JULY 18, 2019 6:30 – 7:30 PM CONDENSING AN IDEA: MAKING THE DIFFICULT PALATABLE Location: Room 26AB How do you distill a story down to its main components? Comics often call for brevity, but how does that work with a complex story or idea? Comic-Con special guests discuss how they delve into their complex worlds of comics and come out the other side with stories we readily consume. Panelists include Kurt Busiek (Avengers), Jon B. Cooke (Comic Book Artist), and Randall Munroe (xkcd), along with Dani Colman, Tea Fougner (editorial director for comics, King Features Syndicate), and moderator Barbara Dillon. More info: https://sched.co/Rlvs FRIDAY JULY 19, 2019 10:00 – 11:00 AM THE FACTUAL AND THE ACTUAL Location: Room 32AB Enjoy exploring science, history, space, and more through sequential art with Randall Munroe (How to), John Hendrix (The Faithful Spy), Don Brown (Rocket to the Moon! Big Ideas That Changed the World #1), Dylan Meconis (Queen of the Sea), Jim Ottaviani(Hawking), and Rachel Ignotofsky (Women in Art) in conversation with librarian Judy Prince-Neeb (Chula Vista Public Library). More info: https://sched.co/RqBO SATURDAY JULY 20, 2019 10:00 – 11:00 AM SPOTLIGHT ON RANDALL MUNROE- How To: Absurd Scientific Advice for Common, Real-World Problems Location: Room 4 Randall Munroe, creator of xkcd, discusses his new book How To, a guide to using science to turn everyday problems into much bigger, more exciting problems. Learn how to cross a river by boiling it, get tips on how to make skiing much more dangerous using liquid oxygen, and hear about his experience asking famous experts the most ridiculous questions he could think of. More info: https://sched.co/Rra2 3:00PM ADVANCED GALLEY SIGNING Location: Random House Booth #1515 Come by the Penguin Random House booth to get a signed advanced copy of Randall Munroe’s forthcoming book “HOW TO: Absurd Scientific Advice for Common Real-World Problems.” Tickets are required for all signings at the Penguin Random House book and are available first come, first serve and while supplies last. Tickets will be distributed approximately 10 minutes before the start time. SUNDAY JULY 21, 2019 1:00 – 2:00 PM SHORT FORM COMICS FOR EVERY READER Location: Room # 28DE Aminder Dhaliwal (Woman World), Ebony Flowers (Hot Comb), Kevin Huizenga (The River at Night), Randall Munroe (What If), and Sophie Yanow (The Contradictions) are masters of the short form comic, whether serialized online, in pamphlets, or collected in graphic novel form. Sarah Mirk, senior editor at The Nib, leads a conversation on pacing, flow from story to story (or strip to strip), and much more. More info: https://sched.co/Rsrz Share this:TwitterFacebookLike Loading... Related Posted byRandall2019-07-15Posted inUncategorizedTags: I never use these tags for anything but I don't know how to turn them off"
