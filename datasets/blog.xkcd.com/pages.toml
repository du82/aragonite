full_description = "What if I wrote a book? Posted bydavean 2014-03-12 1,117 Comments on What if I wrote a book? For the last couple years, I’ve been answering your science questions on What If. Today, I’m excited to announce that the What If? book is coming! What If?: Serious Scientific Answers to Absurd Hypothetical Questions will be published September 2nd by Houghton Mifflin Harcourt. Starting today you can pre-order it from your favorite bookseller (Barnes & Noble, Amazon, Indie Bound). There are also foreign editions, including a UK and Commonwealth edition and a German edition. As I’ve sifted through the letters submitted to What If every week, I’ve occasionally set aside particularly neat questions that I wanted to spend a little more time on. This book features my answers to those questions, along with revised and updated versions of some of my favorite articles from the site. (I’m also including my personal list of the weirdest questions people have submitted.) Preorder today to get a copy as soon as it comes out! Share this:TwitterFacebookLike Loading... Related Posted bydavean2014-03-12Posted inUncategorized Devi says: 2014-06-27 at 12:47 am Happen to arrive at this website from a tech blog… well…don’t remember all the spiders that helped to land here… :p Just loving the comics’ and have saved the page under Favorites… Glad to know about the book.. Keep up the writing .. LikeLike درب اتوماتیک says: 2014-06-27 at 3:40 am Hi dear , I wish you continued success. Thanks Best regards . LikeLike تاسیسات ساختمان says: 2014-06-27 at 3:51 am Hello , What if I wanted to get your signature on my book that I purchased? Could I mail it to you? Thanks LikeLike Peter says: 2014-06-28 at 4:32 pm Instead of book, package contained velociraptor. 😦 Cannot buy again, no arms. LikeLike RACookPE1978 says: 2014-06-30 at 9:00 am 1. What if I ordered the ebook version and it needed to be signed? Would it arrive translated into ASL, or would it arrive via raptor as both a negativ