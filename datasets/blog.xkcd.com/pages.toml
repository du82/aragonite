["https://blog.xkcd.com/2013/09/30/asteroid-4942-munroe/comment-page-5"]
title = "Asteroid 4942 Munroe – xkcd"
description = "Whoa. There's an asteroid named after me! Amazing xkcd readers Lewis Hulbert and Jordan Zhu noticed that the International Astronomical Union—the organization in charge of official astronomical naming—was taking suggestions for what to name small Solar System objects. They submitted my name for asteroid (4942) 1987 DU6, and it was subsequently renamed 4942 Munroe. I'm really touched. I spent all…"
full_description = "Asteroid 4942 Munroe Posted byRandall 2013-09-30 260 Comments on Asteroid 4942 Munroe Whoa. There’s an asteroid named after me! Amazing xkcd readers Lewis Hulbert and Jordan Zhu noticed that the International Astronomical Union—the organization in charge of official astronomical naming—was taking suggestions for what to name small Solar System objects. They submitted my name for asteroid (4942) 1987 DU6, and it was subsequently renamed 4942 Munroe. I’m really touched. I spent all weekend telling everyone who wanted to listen (and probably some who didn’t) about the asteroid. The first thing I did was try to figure out whether 4942 Munroe was big enough to pose a threat to Earth. I was excited to learn that, based on its albedo (brightness), it’s probably about 6-10 kilometers in diameter. That’s comparable in size to the one that killed the dinosaurs—definitely big enough to cause a mass extinction! Unfortunately Fortunately, it’s in a fairly stable circular orbit between Mars and Jupiter, so it’s unlikely to hit the Earth any time soon. 4942 Munroe (!!!) is large enough that it would have noticeable gravity, although not much. If you were walking on the surface and you tripped and fell, it’d take you a minute to hit the ground. You could get into orbit around it by traveling at jogging speed, and might even escape its gravity entirely with a good jump. Thank you so much. This is the coolest thing. Share this:TwitterFacebookLike Loading... Related Posted byRandall2013-09-30Posted inUncategorized evden eve nakliyat says: 2014-04-04 at 8:08 pm taşımacılığın dogru adresi http://www.evnakliye.info LikeLike Utkarsh Classes says: 2014-04-05 at 9:28 pm this is such a nice information. cool. and keep it up my friend. Sarkari Naukri LikeLike istanbul evden eve nakliyat says: 2014-04-10 at 4:30 pm harika bir web sitesi herkese tavsiye ederim LikeLike تور آنتالیا says: 2014-04-12 at 6:31 am Thank you very much., You are a good writer. In addition to art that will give you good I congratulate you LikeLike"
