description = '''I've finally left Virginia and moved to Boston (the Cambridge-Somerville area). I'm really excited. I try to avoid the teenage-ish tendency to blame everything on wherever I am ("I just need to get out of this town! This place sucks! Hey, can you put on another Simple Plan CD?"). But I really think the Virginia…'''
full_description = "New Apartment Posted byRandall 2007-06-06 265 Comments on New Apartment I’ve finally left Virginia and moved to Boston (the Cambridge-Somerville area). I’m really excited. I try to avoid the teenage-ish tendency to blame everything on wherever I am (“I just need to get out of this town! This place sucks! Hey, can you put on another Simple Plan CD?”). But I really think the Virginia town I lived in wasn’t my kind of place. So Boston’s going to be good. I feel at home here already (it helps that I have some lovely friends in the area). Hooray for things happening! I put a whiteboard in the front hallway so everyone could leave notes and so forth. Hmm. A shared space that anyone can write/draw in … I couldn’t help it: (click for larger photo) I’ve got some Sharpies in a drawer in case I need to lock it from editing. Share this:TwitterFacebookLike Loading... Related Posted byRandall2007-06-06Posted inUncategorized mantolama says: 2011-02-15 at 11:02 am Dünyanın En İyi 100 Golü izleyin lan işte adamın hasabını bozmayın LikeLike elektrik firmaları says: 2011-02-15 at 11:03 am Dünyanın En İyi 100 Golüdürüstsün be arkadaş LikeLike web tasarımı says: 2011-02-15 at 11:04 am Dünyanın En İyi 100 Golü month reseller takipçe short LikeLike satılık eşya says: 2011-02-15 at 12:07 pm own. I grew up in the South End which is adjacent to Back Bay and is nowhere next to South Boston. It was walking distance to Copley (pronounced cop-lee and not cope-lee) Square derbederim semi LikeLike Upcoming Video Game Releases says: 2011-02-23 at 7:37 pm Cambridge-somerville area is lovely, quite expensive though so I guess your doing alright. LikeLike Chuck Dvd says: 2011-02-23 at 7:38 pm You going to collage in the Cambridge-somerville area?? LikeLike turtle beach headsets says: 2011-03-09 at 9:41 pm I am really loving the theme/design of your blog. Do you ever run into any web browser compatibility issues? A handful of my blog audience have complained about my site not working correctly in Explorer but looks great in Chrome. Do you have any recommendations to help fix this issue? LikeLike"
