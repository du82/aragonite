description = "Remember limericks? They were huge in the mid-20th century, but fell on hard times over the last couple decades. Now so many dirty limericks are a generation out-of-date, and the really clever ones lie neglected and un-retold. I want more limericks, and I want the cleverest ones collected somewhere. It strikes me that a certain…"
full_description = "LimerickDB.com Posted byRandall 2008-02-04 197 Comments on LimerickDB.com Remember limericks? They were huge in the mid-20th century, but fell on hard times over the last couple decades. Now so many dirty limericks are a generation out-of-date, and the really clever ones lie neglected and un-retold. I want more limericks, and I want the cleverest ones collected somewhere. It strikes me that a certain modern system for collecting bits of funny text might be perfect for both these goals. So, after a moment’s work, I’ve set up LimerickDB.com, which you’ll recognize as similar to bash.org. Submit away, both old and new! Anonymity is encouraged and a respect for meter is required. Dirtiness is not mandatory, but it helps. Share this:TwitterFacebookLike Loading... Related Posted byRandall2008-02-04Posted inUncategorized ThisIsNotDan says: 2011-04-26 at 12:35 pm I hope it goes back up again! There is definitely still demand for limericks on the interblag. LikeLike Vicky says: 2011-05-08 at 1:21 am Cosign everyone — it’s down 😦 bring it back, please! LikeLike Jack says: 2011-05-12 at 3:14 pm I was in the middle of writing a paper for my linguistics class on limerickdb when it disappeared! Bring it back! Give me an A! LikeLike christian louboutin says: 2011-05-16 at 2:02 am Remember limericks? They were huge in the mid-20th century, but fell on hard times over the last couple decades. Now so many dirty limericks are a generation out-of-date, and the really clever ones lie neglected and un-retold. LikeLike louboutin says: 2011-05-16 at 2:04 am I want more limericks, and I want the cleverest ones collected somewhere. It strikes me that a certain modern system for collecting bits of funny text might be perfect for both these goals. LikeLike louboutin uk says: 2011-06-01 at 4:04 am When I visited Japan, I was amazed by the giant grapes I saw in the stores. These always looked like they were meant to be gifts for someone else, so I never bought any for myself. Perhaps such large grapes aren’t very flavorful, though? When it comes to apples, I have to agree that Fujis taste the best. This is the type I always buy.1 LikeLike"
