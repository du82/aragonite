full_description = "Mirrorboard: A one-handed keyboard layout for the lazy Do you have a wearable computer? Are you interested in alternate keyboard layouts but too lazy to learn Dvorak? Do you masturbate at your desk? If you answered yes to any of these questions, you may be interested in my custom keyboard layout. I spend most of my desktop time in a web browser and … Continue reading “Mirrorboard: A one-handed keyboard layout for the lazy” Posted byRandall2007-08-14Posted inUncategorized Roller Coaster Chess A while ago I drew a comic about playing chess on a roller coaster. Various xkcd readers took up the challenge. Pictured above: Andrew Burke, Chris Ranker, Ryan DowlingSoka, and Chance Brown. To see more pictures of chess on rides, go to xkcd.com/chesscoaster. If you think you can do better, go for it, and send … Continue reading “Roller Coaster Chess” Posted byRandall2007-07-18Posted inUncategorized Perl Appetizers You may have noticed that the knapsack problem in today’s comic has two solutions. I thought that (spoiler alert!) the 1, 0, 0, 2, 0, 1 solution was the only one, but 7, 0, 0, 0, 0, 0 — seven orders of mixed fruit — also works. Why did this happen? Well, I checked my … Continue reading “Perl Appetizers” Posted byRandall2007-07-09Posted inUncategorized Kite Photography Here are some pictures I took by flying a camera-carrying kite over Boston: More at xkcd.com/kite. I’m getting a larger kite and hope to make some higher flights. I can’t really plan when I’ll be out there since it depends on the weather, but if you’re nearby (I’m flying them from the MIT athletic field), … Continue reading “Kite Photography” Posted byRandall2007-06-27Posted inUncategorized New Apartment I’ve finally left Virginia and moved to Boston (the Cambridge-Somerville area). I’m really excited. I try to avoid the teenage-ish tendency to blame everything on wherever I am (“I just need to get out of this town! This place sucks! Hey, can you put on another Simple Plan CD?”). But I really think the Virginia … Continue reading “New Apartment” Posted byRandall2007-06-06Posted inUncategorized265 Comments on New Apartment"
