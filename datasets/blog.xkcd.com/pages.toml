full_description = "Raptor shirts! Posted byRandall 2006-10-23 73 Comments on Raptor shirts! A new “No Raptors” shirt has gone up in the store (which is now almost completely restocked in the other shirts)! I’ve stocked up on a bunch of these ahead of time so they’re up for sale right away with no preorder period! Before putting them up, I got some friends together to take pictures in them. The results were awesome: I made a collage of the pictures, featuring me and a bunch of friends who are mostly from CNU. They were a lot of fun to take. TRIVIA: Next to the girls in the anatomy lab pictures there were two grad students dissecting a small dog. They were a little confused as to why we were in their lab being so triumphant about science, especially since the building was supposed to be locked, but in the end they decided that we weren’t a threat! Which was good because they had a bunch of really sharp knives. I hope you guys enjoy the shirts! So far I’ve had more friends buy their own, after seeing the samples, than any other shirt, so I think they’re gonna do well! Also, all the previously backordered shirts are going out today and tomorrow, so you should get those soon. Share this:TwitterFacebookLike Loading... Related Posted byRandall2006-10-23Posted inUncategorized Casete Luminoase Bucuresti says: 2014-02-25 at 7:51 am Il vostro sito non è solo informativo, ma anche educa loro non hanno visto in nessun libro. LikeLike çizgi film says: 2014-02-26 at 1:24 am Hey, by the way, I ran into this site and thought immediately of you. LikeLike Reclame Publicitare Bucuresti says: 2014-02-26 at 4:11 pm Very, very interesting topic. I’ve found your blog by accident, but it was very fortunate coincidence. Well written LikeLike مبلمان اداری says: 2014-03-13 at 8:48 am Thank you very much., You are a good writer. In addition to art that will give you good I congratulate you LikeLike تور چین says: 2014-03-15 at 1:05 pm super maratons! Cepuri nost organizētājiem!:) Es arī piedalī