full_description = "Dictionary of Numbers I don’t like large numbers without context. Phrases like “they called for a $21 billion budget cut” or “the probe will travel 60 billion miles” or “a 150,000-ton ship ran aground” don’t mean very much to me on their own. Is that a large ship? Does 60 billion miles take you outside the Solar System? … Continue reading “Dictionary of Numbers” Posted byRandall2013-05-15Posted inUncategorized254 Comments on Dictionary of Numbers Odd Temporal Milestones The first Star Trek episode aired closer in time to the ratification of the 19th Amendment—guaranteeing women in the US the right to vote—than to today. Posted byRandall2012-09-29Posted inUncategorized387 Comments on Odd Temporal Milestones A morbid Python script Comics #493 and #893 involve actuarial tables, which are tables for calculating the probability that someone of a given age will die within a given amount of time. One evening, when I was feeling morbid, I wrote a Python script to calculate death probabilities for any collection of people: actuary.py (.txt). It takes a list of ages … Continue reading “A morbid Python script” Posted byRandall2012-07-12Posted inUncategorized382 Comments on A morbid Python script Groundhog Day correction A number of people have mentioned an issue with today’s comic—in the movie Groundhog Day, it’s actually implied that Phil, Bill Murray’s character, didn’t have sex with Rita. He took her home to his room, but they woke up in the same clothes they fell asleep in. I haven’t seen the movie in a number of years, but … Continue reading “Groundhog Day correction” Posted byRandall2012-07-02Posted inUncategorized347 Comments on Groundhog Day correction I’m visiting CNU on April 4th I’ll be in Newport News, Virginia this April 4th to give a talk at my old school, Christopher Newport University. I’m really looking forward to it! The chaos of the past year and a half didn’t leave me with much time or energy for travel or events, so it’ll be fun to get out and … Continue reading “I’m visiting CNU on April 4th” Posted byRandall2012-03-22Posted inUncategorized335 Comments on I’m visiting CNU on April 4th"
