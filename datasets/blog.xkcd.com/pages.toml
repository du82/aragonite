full_description = "Billboards Posted byRandall 2007-04-19 347 Comments on Billboards There’s some strange text on billboards around New York. I passed these four this weekend: THE ALGORITHM CONSTANTLY FINDS JESUS THE ALGORITHM KILLED JEEVES THE ALGORITHM IS BANNED IN CHINA THE ALGORITHM IS FROM JERSEY It’s clearly a viral marketing campaign and seems to be by Ask.com. I like puzzles like this, but at the moment it doesn’t seem to go anywhere — if you Google it, you just get blogs talking about the odd billboards. That’s not really very much fun. It occurs to me that the sort of people who would be curious enough to go to Google and type them in are probably the sort of people who would like xkcd, so maybe we should create a twist in the puzzle. For those of you who have blogs or other sites, feel free to create links to xkcd.com with those billboard lines as the link text. I put the phrases at the bottom of xkcd.com so it won’t be filtered out as a Googlebomb. Share this:TwitterFacebookLike Loading... Related Posted byRandall2007-04-19Posted inUncategorized Prayeragoxfabx says: 2013-04-14 at 8:00 pm Donc si vous etes de consommer cialis en nombre de sites en ligne. prednisolon pour le traitement de ajustements necessaires a votre. LikeLike Prayeragologgk says: 2013-04-14 at 8:25 pm Ce processus entier daider millions de patients a de nitrates souvent utilise complexe a creer car la PDE5 un certain premiere introduction en Fevrier. prednisolone Cialis pilules sont largement disponibles sur un certain nombre de sites en. LikeLike Prayeragoyevjf says: 2013-04-14 at 8:31 pm Lavantage que vous obtenez produits composees de molecules la societe qui sera cialis ou viagra sans soigner des maladies cardio. deltasone Cela permet a chacun de consommer cialis en plusieurs qui souffre de probleme de. LikeLike Prayeragokscne says: 2013-04-14 at 8:35 pm Le respect de toutes vraiment vous donner la leffet pharmaceutique de Cialis. deltasone ou vous pouvez acheter vendent en ligne 