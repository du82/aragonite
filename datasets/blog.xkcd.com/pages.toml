full_description = "Cory Doctorow Posted byRandall 2007-03-23 There’s no red cape. But, then again, this was taken back in 2004: Photo courtesty Windley (via, of course, a Creative Commons license) Cory Doctorow was the guy who first convinced me to publish xkcd under a CC license, allowing people to share my comics freely. It’s easy to do and was one of the best decisions I’ve made. Check it out at CreativeCommons.org. If you want to learn more about the copyright debate, I recommend Lawrence Lessig’s book Free Culture, which is available online for — surprise — free. I read it as an audio book on a long car trip, but I recommend the text version — the audio book has a different reader for each chapter, and they’re of wildly varying quality. Share this:TwitterFacebookLike Loading... Related Posted byRandall2007-03-23Posted inUncategorized"
