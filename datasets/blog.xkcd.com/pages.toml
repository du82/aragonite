full_description = "MIT Programming Team Posted byRandall 2007-03-16 53 Comments on MIT Programming Team MIT has a BattleCode programming competition, (which reminds me of Robowar, the reason I didn’t have a high-school social life). This year, [at least] one of the teams was a group of xkcd readers — Nicole, Bobby, and Jessica. They are fun people who I actually had the pleasure of meeting briefly while visiting Boston a while back. Their team was called “If You Die in Canada, You Die in Real Life.” They didn’t win the competition. But they did win “best team name”. Share this:TwitterFacebookLike Loading... Related Posted byRandall2007-03-16Posted inUncategorized Tim says: 2007-03-16 at 3:55 pm You don’t happen to know of any RTS AI programming game that is open to everyone? I love Robowar, but it’s becoming a bit dull because of the lack of options. LikeLike Daniel W says: 2007-03-16 at 7:06 pm Battlecode is open to everybody for scrimmaging. The main competition is limited to Boston-area colleges, though. LikeLike Kaoru says: 2007-03-16 at 7:20 pm http://www.robotbattle.com/ is free but unfortunately closed-source and windows only… I haven’t played for several years but it’s the reason I didn’t have much of a high-school social life 😛 LikeLike Kaoru says: 2007-03-16 at 7:23 pm ^Apparently Brad has opened the source – http://dev.robotbattle.com/ 🙂 LikeLike Ian says: 2007-03-17 at 3:17 am I think it’s safe to say that anyone going anywhere in high technology reads this comic. The damn dean of CMU CS makes xkcd jokes in all venues from public speaking to private conferences. It shows up on exams and homework assignments with great regularity, not to mention building facades. Welcome to the meme. LikeLike Tim says: 2007-03-17 at 6:25 am Oh, I read that email domain list too quickly. Thanks, Daniel W. LikeLike James A. Calwell III says: 2007-03-17 at 7:32 pm Did they try to calculate e^Ï€ – Ï€ ? LikeLike Aurora says: 2007-03-18 at 3:32 pm I’m an MIT undergrad, and I totally remember this team name. Many of my friends on hall were in 6.370 (the competition you’re talking about), and I remember them telling me about this. I also hear you’re coming to MIT soon? When is this? I’m definitely showing up! Sometime in April, I think people I know who are organizing this have told me, yes? LikeLike"
