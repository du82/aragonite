["https://blog.xkcd.com/page/8"]
title = "xkcd – Page 8 – The blag of the webcomic"
description = "The blag of the webcomic"
full_description = "Ireland I will be in Ireland this Saturday, at SkyCon at the University of Limerick. I’m guessing they found me through my LimerickDB project, which may not be what they think it is. Since they rejected my original idea for a talk, which was based on John Cage’s 4’33” I will be talking about doing internet comics for a living, and related subjects such as frozen pizzas and MarioKart. My apologies to everyone who’s extended a speaking/convention invitation who I didn’t get back to — the answer is usually ‘no, thank you’, but I’m too meek to say so (which is probably part of why my email piles up so badly). I love traveling and talking to people all day, but it’s so exhausting that I only do a couple of them a year. Posted byRandall2009-02-11Posted inUncategorized121 Comments on Ireland A Math Problem Courtesy LispClub.com: Sue and Bob take turns rolling a 6-sided die. Once either person rolls a 6, the game is over. Sue rolls first. If she doesn’t roll a 6, Bob rolls the die; if he doesn’t roll a 6, Sue rolls again. They continue taking turns until one of them rolls a 6. Bob rolls a 6 before Sue. What is the probability Bob rolled the 6 on his second turn? The answer is not 5/36. I love puzzles which are simple to state but have a fiendishly tricky or counterintuitive answer. I just threw up a page on the xkcd IRC wiki to hold some of the better ones I’ve found over the years. I’ll be adding more over the next few weeks as I remember or find good ones. Feel free to add some of your own! Edit: Buttons and then Daniel Barkalow got the correct answer first. Here it is, rot13‘d. Check your answer against this before posting smugly or people (I) will tease you: gjb friragl svir bire gjryir avargl fvk, be nobhg gjragl-bar cbvag bar creprag. Posted byRandall2009-02-11Posted inUncategorized A Laptop Problem (Warning: boring nerd rage ahead) I need help finding a new laptop. For the last couple years, I’ve have a Fujitsu P1610 (which replaced my stolen P1510). It should last me for another year or two, but I’m pretty hard on my computers. This one has started developing problems typical of an overused, aging machine — your standard hardware failures, screen damage, random crashes, unexpected hangings, paradoxical package syndrome, retrograde memory leakage, Hamitic keyboard, fan tearing, Indian screen burn-in, dysfunctional Haskell, LCD torsion, tab key thrombosis, trackpad sclerosis, dry RAM syndrome, scroll-wheel arousal, systemic rainbow failure, peristeronic disk fragmentation, hyperactive tilde key, heat-sink apricity, kernel duplicity, space bar plasticity, and cross-site chlamydia. So I know that in the next year or two, I’ll be in the market for a new laptop. Here’s my problem: as far as I can tell, nobody makes the laptop I want. I really only have two criteria: Weight under 2.5 lbs Screen at least 1280 pixels wide This isn’t an impossible combination. My current laptop fits it. The Fujitsu Q2010 fit it. The Fujitsu U820 fits it but is actually too small and light (the size of a CD case, with a 270 dpi screen!). The problem doesn’t seem to be technology. And, given the recent popularity of netbooks, it’s probably not lack of demand for small laptops, either. Everyone just seems to assume that if you want small, you also want a cheap and crappy display. Is there nothing between the netbooks and the Lenovo X series (which are a bit bulkier than I want)? Other than buying a laptop that is several years old (hunting down a Q2010) or has a touch screen that I don’t really want (the newer model of my current one, the P1630), do I have any options? (Side note: I find it odd that there are so few laptops with high-DPI screens (>175)? Everything above 150 on that Wikipedia list is either a Fujitsu or a smartphone. Aren’t we supposed to be moving out of the era of pixels by now?) Posted byRandall2009-02-11Posted inUncategorized"
