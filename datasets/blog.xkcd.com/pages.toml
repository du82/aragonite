full_description = "iPod Announcement Five Years Ago Posted byRandall 2007-01-10 72 Comments on iPod Announcement Five Years Ago Every now and then when new products are announced, I like to take a moment and go back to read the Mac Rumors forum thread from when the iPod was first announced. http://forums.macrumors.com/showthread.php?t=500 It only gets better the further you go. Arguments one after the next explaining why the iPod will be a collosal failure and clearly spells doom for Apple. It’s just a cheerful reminder to be a bit more humble in making predictions and assertions, and one i will try to keep in mind more often (although, in the spirit of the above, I offer no guarantee). Share this:TwitterFacebookLike Loading... Related Posted byRandall2007-01-10Posted inUncategorized filmizlesinema says: 2011-02-06 at 12:19 pm adverts by various websites about them selling ipod classic 160gb LikeLike Chuck Dvd says: 2011-02-22 at 5:45 pm Who needs an Ipod when you can buy the Chuck dvd collection? LikeLike upcoming video game releases says: 2011-03-09 at 9:36 pm Appreciating the commitment you put into your website and detailed information you offer. It’s nice to come across a blog every once in a while that isn’t the same old rehashed information. Fantastic read! I’ve bookmarked your site and I’m including your RSS feeds to my Google account. LikeLike mantolama says: 2011-04-03 at 4:28 pm Hi, Can I Find out detailed information about the topic. mantolama I could not understand. ? LikeLike pengobatan tradisional says: 2012-04-09 at 2:25 am tuh atuh da, ngeunah we diriku mah.. 😀 LikeLike Angela says: 2013-10-04 at 2:40 pm Thanks to the Dictionary of Numbers I now know that the first iPod costs roughly as much as a suit. Thank you. LikeLike طراحی دکوراسیون داخلی says: 2013-11-27 at 8:05 am The history of the iPhone line of phones begins with Steve Jobs’ direction that Apple Inc. engineers investigate touchscreens and a tablet computer, which later came to fruition with the iPad. Also, many have noted the device’s similarities to Apple’s previous touch-screen portable device, the Newton MessagePad. Like the Newton, the iPhone is nearly all screen. Its form factor is credited to Apple’s head of design, Jonathan Ive LikeLike"
