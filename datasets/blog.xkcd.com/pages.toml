full_description = "I’m visiting CNU on April 4th Posted byRandall 2012-03-22 335 Comments on I’m visiting CNU on April 4th I’ll be in Newport News, Virginia this April 4th to give a talk at my old school, Christopher Newport University. I’m really looking forward to it! The chaos of the past year and a half didn’t leave me with much time or energy for travel or events, so it’ll be fun to get out and meet people again. I’m also looking forward to seeing the campus, which I hear has changed substantially since I left. The talk isn’t limited to CNU students, so if you live nearby, you’re welcome to come! Admission is free, but since space is limited, you’ll need to reserve tickets here. Hope to see you there! Share this:TwitterFacebookLike Loading... Related Posted byRandall2012-03-22Posted inUncategorized ares someassssw says: 2014-08-16 at 3:08 am This is highly informatics, crisp and clear. I think that everything has been described in systematic manner so that reader could get maximum information and learn many things. forming that opinion LikeLike ares someassssw says: 2014-08-17 at 10:45 am Do you really think the venus factor book and weight loss system by John Barban can help you lose weight Well, do not be misled by the biased diet reviews. https://twitter.com/PaulMathieson LikeLike ares someassssw says: 2014-08-18 at 10:17 am You have made ​​an extraordinary showing. I will most likely to burrow and Generally Suggest it to my companions. I am sure they ‘will be profited from this site. agen judi online terpercaya LikeLike williama says: 2014-08-19 at 6:24 am I will most likely to drill down and Usually Recommend it to my partners. I am sure they ‘will be are making money from this website. robots LikeLike ares someassssw says: 2014-08-21 at 1:16 am Years later, after the rise of the web, I realized maybe I could now find a video of a tsunami, and finally see the thing that had so captivated me as a child. But my searches for videos didn’t turn up much of any