title = "ISEE-3 – xkcd"
description = "Back in early March, I posted comic #1337, Hack, about a wayward spacecraft. ISEE-3/ICE was returning to fly past Earth after many decades of wandering through space. It was still operational, and could potentially be sent on a new mission, but NASA no longer had the equipment to talk to it—and announced that reconstructing the equipment…"
full_description = "ISEE-3 Posted byRandall 2014-05-30 79 Comments on ISEE-3 Back in early March, I posted comic #1337, Hack, about a wayward spacecraft. ISEE-3/ICE was returning to fly past Earth after many decades of wandering through space. It was still operational, and could potentially be sent on a new mission, but NASA no longer had the equipment to talk to it—and announced that reconstructing the equipment would be too difficult and expensive. ISEE-3 is just a machine, but it’s a machine we sent on an incredible journey; to have it return home to find our door closed seemed sad to me. In my comic, I imagined a group of internet space enthusiasts banding together to find a way to take control of the probe—although I figured this was just a hopeful fantasy. I wasn’t the only one who liked the idea of “rescuing” ISEE-3. In April, Dennis Wingo and Keith Cowing put up a crowdfunding project on RocketHub to try to learn how the lost communications systems worked, reconstruct working versions of them, obtain use of a powerful enough antenna, and commandeer the spacecraft. It seemed like an awfully long shot, but I contributed anyway. Well, yesterday, Cowing and his team announced, from the Arecibo radio telescope in Puerto Rico, that they are now in command of the ISEE-3 spacecraft. Congratulations to the team, and good luck with your new spaceship! Watch out for hackers. Share this:TwitterFacebookLike Loading... Related Posted byRandall2014-05-30Posted inUncategorized Tom says: 2014-05-30 at 1:28 pm If I’d done this, I’d be the only thing on my resume – “Controls own spacecraft.” I’d probably try to use it to pick up chicks though I doubt it would work. LikeLike Dr. Azrael Tod says: 2014-05-30 at 2:13 pm @tom maybe hard to find chicks you could pick up in space? LikeLike aL says: 2014-05-30 at 4:13 pm wohoo!! thats what i call power of convocatory… randall 4 president!! i know you probably dont want to… but thats the problem with politics… the people who want to, shouldnt do it LikeLike"
