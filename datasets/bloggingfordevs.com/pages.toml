["https://bloggingfordevs.com/ted-avery-interview"]
title = "Decouple Your Time From Your Money Through Blogging with Ted Avery"
description = "Learn how Ted Avery's skills as a software developer helped him build a profitable blog about budget travel."
full_description = "Hey everyone! It's time for another interview, and today I'm super stoked to be talking with Ted Avery from .css-1vmawbu{border-bottom:2px solid #69c0ff;color:#69c0ff;-webkit-transition:0.1s border-bottom linear;transition:0.1s border-bottom linear;font-size:20px;line-height:40px;}.css-1vmawbu:hover{border-bottom:4px solid #69c0ff;}.css-1vmawbu p,.css-1vmawbu ol,li .css-1vmawbu{font-size:20px;line-height:40px;}Thrifty Nomads. I first got to know Ted as a prospective customer for Affilimate, but soon learned that he also had a software development background despite being a full-time blogger. Whenever someone with technical skills decides to go down a different career path, I'm naturally curious about what their journey looked like. I grew up in a city near Toronto, Canada. I always loved computers, and I started to make my own websites in high school with some basic HTML, CSS, and Photoshop skills. I thought I wanted to be a web designer, but after one semester of a graphics and print focused degree, I decided to drop out. In perfect timing, a friend connected me with her aunt and uncle who own a web design business. They took me on to help with e-mail newsletters, and I started analysing their ASP web apps to learn some basic coding. I started a new degree in networking and security, where I finally took my first formal programming course in C++, and I fell in love with it. I still had my job at the web business and switched us over to PHP using frameworks like CodeIgniter and Laravel. After my degree, I did a startup-focused master's degree, where I also upped my skills with JavaScript, Node, iOS, and Android development. Around the same time, I got married to my high school sweetheart. My wife wanted to study her masters in Sydney, Australia, so we decided to have the 6-month backpacking trip we always dreamed of, which took us through South America, Europe, and Japan. Like many travel bloggers, we started a blog just to post stories and photos to keep our family updated at home under the name “Roadmaps to Happiness”."
