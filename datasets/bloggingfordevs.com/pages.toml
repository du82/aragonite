["https://bloggingfordevs.com/terms"]
title = "Terms and Privacy Policy · BloggingForDevs.com"
description = "Terms and Conditions"
full_description = "Hi there! I'm happy to have you on Blogging for Devs. This page is meant to inform you about the small number of services we use to keep to keep things humming, as well as how your data is used and how you can have it removed if you so please.You can also find a tiny number of terms of joining our community at the end of this document.Contact: .css-5k9mbt{color:#ffffff;border-bottom:2px solid #efefef;}hi@bloggingfordevs.com We self-host the comments on the blog in Google Firebase. If you've posted a comment and would like to have it removed, please contact us. In order to inform you of replies to any anonymous comments, we collect your email address. Your email address will not be used for any kind of marketing, targeting, or anything shady like that. We use Mailgun to email you about any replies to your comments. The email server we use with Mailgun is hosted in the EU. We use Google Analytics and turn off advertising features, IP tracking, and demographics collection for all visitors. We do not share personal data with Google Analytics. These comments are self-hosted in Google Firebase, and not shared with any third-party provider. Your email address is stored, but not visible or accessible to website visitors. It is shared with Mailgun, only in the situation where someone replies to your comment. We use ConvertKit as our email service provider. As such, your email address and sometimes your name (if you provide it) is stored with them. If you wish to unsubscribe from the newsletter, you can do so using the link in the footer of any email. If you wish to have your data completely erased from ConvertKit, please email us so we can file an erasure request on your behalf. We use Sparkloop for our newsletter referral program. As such, they are connected in ConvertKit and also have access to your email address (which is how they count your referrals). For community members, the terms of the website also apply, because our community and website are integrated together. Here are some additional details for community members."
