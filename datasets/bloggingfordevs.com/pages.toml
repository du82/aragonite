description = "A look behind the scenes at the results from a Product Hunt launch where this newsletter became the #1 Product of the Day."
full_description = '''The sky was blue. The grass was green. The birds of Copenhagen were singing, and like pretty much every living being in Denmark, they seemed a little happier than what's natural. To be specific, I .css-1vmawbu{border-bottom:2px solid #69c0ff;color:#69c0ff;-webkit-transition:0.1s border-bottom linear;transition:0.1s border-bottom linear;font-size:20px;line-height:40px;}.css-1vmawbu:hover{border-bottom:4px solid #69c0ff;}.css-1vmawbu p,.css-1vmawbu ol,li .css-1vmawbu{font-size:20px;line-height:40px;}launched this newsletter. And it reached #1! Clearly as it was my first time, I'm no expert at launching on Product Hunt, launching in general, or even running a newsletter to be honest. But as a nosy person myself, I thought it would be fun to share a bit of the behind the scenes of the Product Hunt launch: Hopefully it'll encourage someone out there who, like me, who's never even thought about launching on Product Hunt. Again, I'm not an expert at this, but maybe there are bits about my launch you can learn by having a look behind the curtain. We'll look at traffic, subscribers, and conversion rate by referrer. I'll also compare it to the first "launch", which I did on Twitter. Here's the traffic that Blogging for Devs received from Product Hunt in the #1 position for almost 24 hours. In total, about 1.5K users visited Blogging for Devs from Product Hunt during its tenure in the first position. Including the following days, this number grew to about 2.3K users (between Monday and Friday afternoon). Between August 31st (Monday) and mid-day Sept 4th (Friday), the newsletter added 1,170 subscribers (ignoring cancellations). But not all new subscribers came from Product Hunt during the launch. In total, 762 subscribers came from Product Hunt or sites that aggregate data from Product Hunt. That's based on Google Analytics, however I believe the number to be higher based on 1) How many developers may be blocking Google Analytics 2) How many subscribers are confirmed in ConvertKit (1,170 confirmed vs 907 events).'''
