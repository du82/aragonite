["https://bloggingfordevs.com/gatsby-mdx-rss-feed"]
title = "Add an RSS Feed to Your Gatsby MDX Blog"
description = "Even though more people are consuming content via Twitter and newsletters these days, having an RSS feed makes links to your content available to all kinds of tools that integrate with RSS. Here's how to add it to your Gatsby blog with Mdx in 5 minutes or less."
full_description = "Setting up an RSS feed for your Gatsby-powered JavaScript blog or website is relatively straightforward, but throwing MDX into the mix can cause some problems. Here's the working solution I eventually came up with to avoid any warnings or errors while rendering. When you go to add an RSS feed to your Gatsby website, you may first see gatsby-plugin-feed as the recommended plugin. Unfortunately, this one won't detect your mdx nodes as it's designed to work with markdown directly. As usual, you can start by copy/pasting a giant configuration object into your gatsby-config.js. Give it a read, and I'll call out a few places you may need to change or adapt for your website below. Make sure to change title above to the title of your website instead, and provide a path to the index page of your blog for the match property. Naturally, since you're referencing some data from values defined in your gatsby-config, make sure that's set properly too: If you store this kind of metadata differently in your config file, just make sure to update the Query part of the config: Your RSS feed will only be generated for production builds, so build and serve your production website and try to visit /rss.xml: Be sure that if you blog uses permalinks like /blog/article-name/ that you go in and adjust this in the serialize part of the gatsby-plugin-feed-mdx part of the configuration. Especially check for missing, connecting slashes, / which can cause your RSS feed to be full of broken links. Also, check your blog's home page and see that a reference to the feed was inserted in the metadata so it can be picked up by feed readers: The implementation above does not render the full body of your post in someone's RSS feed. Instead, they'll see a description and be able to click through and read the article on your website. If you want to include the content of your MDX-rendered post, you'll need to do a bit of extra work to inline all the styles and code needed to render properly. Here's a .css-1vmawbu{border-bottom:2px solid #69c0ff;color:#69c0ff;-webkit-transition:0.1s border-bottom linear;transition:0.1s border-bottom linear;font-size:20px;line-height:40px;}.css-1vmawbu:hover{border-bottom:4px solid #69c0ff;}.css-1vmawbu p,.css-1vmawbu ol,li .css-1vmawbu{font-size:20px;line-height:40px;}GitHub issue that solves exactly this problem."
author = "https://www.facebook.com/yourpage"
