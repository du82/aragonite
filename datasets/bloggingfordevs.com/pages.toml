title = "From Zero to 300k Monthly Readers: The Impact of Blogging Consistently with Robin Wieruch"
description = "Learn how @rwieruch's goal of reinforcing his own learning as a developer led him to create a technical blog that teaches software development to over 300,000 people every month."
full_description = "Hey everyone! I'm really excited to be talking with today with .css-1vmawbu{border-bottom:2px solid #69c0ff;color:#69c0ff;-webkit-transition:0.1s border-bottom linear;transition:0.1s border-bottom linear;font-size:20px;line-height:40px;}.css-1vmawbu:hover{border-bottom:4px solid #69c0ff;}.css-1vmawbu p,.css-1vmawbu ol,li .css-1vmawbu{font-size:20px;line-height:40px;}Robin Wieruch. You might know Robin for his break-out ebook The Road to React or the other courses he's since created about Redux, GraphQL, and Firebase. His website is also sure to pop up in the search results whenever you google for solutions to common technical challenges in JavaScript as one of the top React blogs. Robin and I have known each other for years now, and it's been super inspiring to watch how he shaped the career he has today through blogging (as well as to see him work from tropical destinations all around Southeast Asia 🏝). Hi Monica. Sure! I am a German software engineer from Berlin who enjoys traveling around in Southeast Asia :-) In 2017, I quit my full-time job and started to work with companies on their projects as an independent developer. So far I love the journey and wouldn't want to change it. In 2016, I started to write about my learnings in tech on my blog and that's it: What started as a reinforcement for my own learnings as a developer grew into a blog with more than 300,000 monthly readers. If you had asked me back in 2016 what I thought about blogging, I would have told you that I am late to the party and blogging was already a thing a couple of years ago. I never thought that I could have a successful blog one day. To be honest, these days most people find my content whenever they search for a solution to their problem on Google. While releasing a new piece on social media has its fair share of spikes in visitors, most of my traffic comes from organic search via search engines. When I started writing on my blog, I noticed only a few spikes when my articles got picked up on social media."
