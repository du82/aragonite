full_description = '''Gergely Orosz is the author of .css-1vmawbu{border-bottom:2px solid #69c0ff;color:#69c0ff;-webkit-transition:0.1s border-bottom linear;transition:0.1s border-bottom linear;font-size:20px;line-height:40px;}.css-1vmawbu:hover{border-bottom:4px solid #69c0ff;}.css-1vmawbu p,.css-1vmawbu ol,li .css-1vmawbu{font-size:20px;line-height:40px;}The Pragmatic Engineer, one of the top software blogs about engineering management and engineering at scale. His articles stem from his experience working as an engineering manager in growth-stage companies like Uber, Skype, and Skyscanner. Part of that is thanks to repeat success on the front page of Hacker News and Gergely's unique approach for crowdsourcing ideas and gauging demand on Twitter. This is going to be really different from small companies and large companies. At a small company it will matter a lot more, and at large companies a lot less. It matters less at large companies because they're very conscious about diversity. They don't want to create unfair advantages for people. Instead, they're going to say, "Well, what about the people who don't have time for this?" They don't want to exclude minority candidates, people who are working second shifts, or people who just don't have time outside work for a blog or open-source projects. Maybe 10% of people have any sort of blog or even an interesting project that's not a "Hello World" in their GitHub, whether it's a blog or an interesting project. In fact, I'm going to wager that these days, it's starting to become more important, because you really want people who are good communicators, and who could later write company blog posts. If I started a startup now, I would value that. Ultimately, having a technical blog will matter more at the place where the hiring manager is hiring, and there is not this big recruiting machine that, for better or worse, big tech companies have. First, there was the early years. I was a junior engineer and it was more of a log I wrote for myself. For instance, here's a problem I had, here's a talk I did, a competition I went to. It was almost a journal of my professional life.'''
