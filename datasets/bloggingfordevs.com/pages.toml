description = "Learn how these dev bloggers wrote content that hit the front page of Hacker News or grew subscribers by 100s per month."
full_description = '''More than 4,000 devs (😱) have taken the .css-1vmawbu{border-bottom:2px solid #69c0ff;color:#69c0ff;-webkit-transition:0.1s border-bottom linear;transition:0.1s border-bottom linear;font-size:20px;line-height:40px;}.css-1vmawbu:hover{border-bottom:4px solid #69c0ff;}.css-1vmawbu p,.css-1vmawbu ol,li .css-1vmawbu{font-size:20px;line-height:40px;}Blogging for Devs 7-Day Challenge in the roughly 5 months since launching it. To celebrate this milestone, I'm going to be turning the tables and highlighting some excellent articles written by readers of the newsletter. You'll also find a quick analysis on why I think these articles have done so well, so you can adapt those strategies for your next blog post. Apart from the useful content about diagnosing and fixing SEO mistakes, Maxime fulfilled what I think of as the "golden formula" for Hacker News: Framing a technical breakdown around your personal experience is a great way get a message across without seeming arrogant or like a know-it-all, especially in "delicate" channels like Hacker News. Plus, Maxime does a great job establishing credibility by showing a graph of his results early in the article. This gets people interested enough to keep reading and find out how to achieve that for themselves. This approach paid off: Maxime's post reached #3 on Hacker News, with 300+ points and 125 comments. Thanks to his kind shoutout, he also sent 100+ email subscribers my way. The power of recommendation in action! Gianluca's article about best practices for Docker security managed to get 15K+ visits from Hacker News, 400+ points and 192 comments. What can we learn from it? My hypothesis for the reason his article had so much success and sparked a lot of discussion is this: Plus, anytime you make a list of something, it's like a developer instinct to try and add something they think is missing...by leaving an anonymous comment on the internet 😎 This article has a great combination of easy-to-consume information (via well-formatted take-aways in bold subheadings) on a topic that developers love to discuss. The comments and votes attest to this.'''
