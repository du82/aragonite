["https://bloggingfordevs.com/sara-vieira-interview"]
title = "Learning to Charge for Your Work: Behind the Scenes of Sara Vieira's $25,000 Ebook Launch"
description = "Sara Vieira works on open source at CodeSandbox and is a prolific maker and tech speaker. Learn how she approached launching her first paid product, The Opinionated Guide to React."
full_description = "We expect to be paid high salaries for our hard-won skills, but we also expect a lot of software and educational materials produced by fellow devs to be free and open source. I'd say that .css-1vmawbu{border-bottom:2px solid #69c0ff;color:#69c0ff;-webkit-transition:0.1s border-bottom linear;transition:0.1s border-bottom linear;font-size:20px;line-height:40px;}.css-1vmawbu:hover{border-bottom:4px solid #69c0ff;}.css-1vmawbu p,.css-1vmawbu ol,li .css-1vmawbu{font-size:20px;line-height:40px;}Sara Vieira is a good example of this. Sara works as a developer on CodeSandbox, and has been contributing to open source for years. She's a prolific maker of projects like the npm Drinking Game and Is there Uber in?, which are all free and open source. In terms of demographics, I would say there isn't a clear country that stands out and I think that's also because of implementing parity purchasing power to make it affordable for everyone. So far the feedback has been pretty good, I got some requests for simple stuff I never thought of since I never used a Kindle like: Please can we have chapters? That makes sense; I just didn't know they were a thing on Kindles, much noob. I have a super relaxed refund program where you email and ask for one, and so far I've only gotten two requests, and both people gave me really good feedback and told me the book was really good but just not for them. So, I would say when someone who asks for a refund is nice and gives you good feedback you’re doing something right. My main motivation to write this book about React was my own struggles in making side projects, knowing what to use with React, and the confusion I felt in some of the hooks. I know useState, but some of them were just super confusing to me so when I dove deeper into them, I realized that it wasn't me, they are just confusing! After a while, I decided to share these things with people, I have been doing React stuff for a long while, so if nothing else it would serve my future self to have all these things as a reference."
