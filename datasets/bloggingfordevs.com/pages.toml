description = "Edidiong Asikpo is a software engineer, technical writer, community builder and speaker. Learn how she approaches growing her blog's readership strategically through Twitter and community."
full_description = "Hey everyone! This week I'm here with Edidiong Asikpo, a software engineer working with the Developer Relations team at Interswitch Group in Lagos, Nigeria. I first got to know her through Blogging for Devs, and was impressed by the traction I saw her content gaining on Twitter. She's a pro at technical writing and has spoken at numerous tech conferences on topics like getting started in open source, getting accepted to Google's Season of Docs, and breaking into tech. My name is Edidiong Asikpo. I live in Lagos, Nigeria where I work as a Software Engineer in the Developer Relations team at Interswitch Group. I am very passionate about technical writing, contributing to open source organizations, and building developer communities. I initially wanted to study Medicine & Surgery at the University because my Dad wanted me to be a medical doctor. Along the line, I remembered I loved taking Computer Science classes in high school, so I opted to study Computer Science. My University education was quite bland and typical, in the sense that the method of teaching was mostly theoretical, there was hardly any practical teaching involved. But, the turning point for me came in my 3rd year at the University when I joined .css-1vmawbu{border-bottom:2px solid #69c0ff;color:#69c0ff;-webkit-transition:0.1s border-bottom linear;transition:0.1s border-bottom linear;font-size:20px;line-height:40px;}.css-1vmawbu:hover{border-bottom:4px solid #69c0ff;}.css-1vmawbu p,.css-1vmawbu ol,li .css-1vmawbu{font-size:20px;line-height:40px;}Start Innovation Hub as an intern. I learned how to develop mobile applications and was so excited by the fact that I could build some features I saw and used on most mobile applications. This excitement made me love tech and it's been great so far. A few years ago, I experienced difficulties in expressing myself through writing and it affected me in diverse ways, so I decided to be intentional about improving my writing skills. I initially started by reducing the number of times I responded to messages on social media in short form and read a lot of articles by different creators."
