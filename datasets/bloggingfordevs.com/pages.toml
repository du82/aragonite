["https://bloggingfordevs.com/gatsby-seo"]
title = "Gatsby SEO: How to Find and Fix Non-obvious Mistakes"
description = "Learn how to find and fix common Gatsby SEO mistakes that could be affecting your rankings in Google."
full_description = '''I want to start by dislodging perhaps the most prevalent misunderstanding about SEO that developers have today: The idea that making a website "SEO-friendly" is primarily about having some meta tags in the head of your website. You can read just about any JavaScript blog on the SEO aspect of popular libraries or frameworks, whether it's Gatsby, React, NextJS, or Vue. The content centers around just a few items. Namely: But the problem is, no one bothers to explain to developers why those things are important or how they're used. So those initial SEO efforts often become broken over time, as an unintended side effect of other changes on a website. And since the devs don't know the mechanics behind it, they never notice. So today, I want to help you find and fix these non-obvious issues that could be hurting how well your site is being discovered in search 🎉 That said, these issues can apply to any website on the planet. So even if you don't use Gatsby, you'll still find practical ways to recognize technical SEO issues on websites written with other frameworks. By definition, technical SEO is the aspect of SEO that ensures your website can be effectively crawled, rendered, and indexed by Google. Often, Google is smart enough to figure out what's going on, but other times mistakes can lead to a page or website not ranking as well as it could, or for pages not to get indexed. There are many other aspects to SEO such as keyword research, the content itself, accumulating backlinks and building your website's authority, and so forth. Why should you care? At least for developers who subscribe to my newsletter, SEO matters because they want to get more people to visit their blog or their online business without spending money on ads or having a massive social media following. But I picked these issues to focus on because they all represent pitfalls that I believe are probably really common in the Gatsby world (especially if you don't have a dedicated SEO expert handling the website).'''
author = "https://www.facebook.com/yourpage"
year_published = 2020
