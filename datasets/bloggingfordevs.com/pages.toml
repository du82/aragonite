title = "2 Proven Methods That Will Make You A Better Writer"
description = "Learn how to become a better writer with the two tips that practically every successful author recommend. Then learn how to practically apply those tips to your daily routine."
full_description = '''Tell me if this rings true to your experience: Written communication is a skill that most developers have, well, under-developed. I don't have to tell you that remote work is probably going to .css-1vmawbu{border-bottom:2px solid #69c0ff;color:#69c0ff;-webkit-transition:0.1s border-bottom linear;transition:0.1s border-bottom linear;font-size:20px;line-height:40px;}.css-1vmawbu:hover{border-bottom:4px solid #69c0ff;}.css-1vmawbu p,.css-1vmawbu ol,li .css-1vmawbu{font-size:20px;line-height:40px;}be the "new normal", and the number of Slack-induced misunderstandings has probably definitely skyrocketed since the beginning of this year. Did you know that the human mind is 22x more likely to remember a fact when it's part of a story? Did you also know that stories are more persuasive than facts? Even technical articles and conference talks can benefit massively from storytelling (because stories are what people will remember). In this week's edition of Blogging for Devs, I want to share the two most important ways to improve your writing and storytelling abilities on a daily basis, as well as practical tips for implementing them. One of the best books I've read recently was Predatory Thinking by Dave Trott. The entire book is a series of stories that illustrate creative thinking principles. Some of the stories are from the author's life, but many of them aren't. They come from books about World War II, biographies, published studies, and all sorts of other sources. What makes the book impactful is that it's not just full of opinions — every lesson is backed by a story that demonstrates it in the real world. You believe it because it's based on something that actually happened. And you remember the lesson it because it's wrapped in story. Reading books in particular is important because you want to control the quality of information you're taking in. If I had to guess, you've probably read some email today, taken a peek at Twitter or Facebook, and maybe browsed some top articles on Hacker News or Reddit (I have, too).'''
