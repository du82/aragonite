["https://bloggingfordevs.com/blogging-as-a-developer"]
title = "Blogging as a Developer: Why It Could be Your Best Career Move Yet"
description = "Learn how to start a developer blog the right way, and why creating one could be your unique advantage for your tech career."
full_description = '''I can't even begin to summarize everything that has come my way as a direct result of blogging as a developer. Job opportunities and consulting work. Speaking gigs at conferences around the world. Even the financial freedom to bootstrap my own company full-time. All of that and more came as a result of blogging. I've also worked as a hiring manager and seen how much a coherent tech blog with just a few articles can help a developer stand out from hundreds of other candidates. It's just you and your website. And you can choose to do whatever you want with it. And isn't that freedom why we became developers in the first place? Social media can change "the algorithm". Google can put more ads on top of your search results. Twitter can suspend your account. Medium can run out of funding (awkward 😬). Plus, as you pick up backlinks, those will enhance the authority (and chance of ranking in Google) of your domain — not another platform. I get a lot of questions through the Blogging for Devs Newsletter about which tech stack is the best for a developer blog. As long as you've got the basics down and will feel comfortable tweaking things as needed, you can run a successful tech blog on WordPress just as well as on Gatsby, Hugo, or even Jekyll. One thing I want to be clear on: there is no shame in being a developer who blogs on WordPress. Being a mature developer is about knowing when you should be solving a problem with code or not, and that applies just as much to building your own technical blog as it does to other software. Whatever tech stack you choose, do not fall into the mistake of spending more time tweaking your theme than actually writing content. In fact, having this mindset is one of the first things I try to shift when I talk about blogging with developers. Instead, developers would be better served learning SEO so they can build sustainable traffic to their websites. Unfortunately, most developers are under the impression that SEO is "taken care of" as soon as you have some meta tags set up on your website — and this couldn't be further from the truth.'''
author = "https://www.facebook.com/yourpage"
year_published = 2020
clearnet = "https://bloggingfordevs.com/blogging-as-a-developer"
