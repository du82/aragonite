description = "Learn how to find the type of content people are already reading and sharing so you can learn which topics and angles resonate most with your target audience."
full_description = '''Motivation. It's probably the thing people struggle with even more than coming up with ideas or pushing publish after days of writing. Questions about how to stay motivated to write regularly on a blog are among the most common I receive in response to the Blogging for Devs newsletter: Especially when writing a blog post takes hours of your free time, and you have no idea whether people are even interested in what you have to say. My recommended strategy for getting motivated is to find blog post ideas that you're excited to write, and cover topics or angles that are proven winners in your industry. In this article, I'm going to cover 7 techniques for uncovering compelling tech blog post ideas for your developer blog with proven interest from the technical community. With the rise of static blogs, few devs bother to set up a search function on their website. There aren't that many articles, so what's the point? If your site doesn't have search, you're missing out on a treasure trove of topic ideas that people are clearly interested in reading. Because when someone types a phrase in your search box, they're telling you exactly what they want to find on your site, but can't. Over time, you'll be able to find patterns and generate ideas from people who're already interested in your content. For example, here's a sample report from my travel blog which tells me what people were searching for during a week in July: There's also a section called the "Searches with no results" which tells me what people hoped to find on my website, but couldn't find. These are prime candidates for dedicated articles, if I have the knowledge to write them. This technique works for any kind of blog, whether it's a tech blog, travel blog, or any other kind of website for that matter. I personally use .css-1vmawbu{border-bottom:2px solid #69c0ff;color:#69c0ff;-webkit-transition:0.1s border-bottom linear;transition:0.1s border-bottom linear;font-size:20px;line-height:40px;}.css-1vmawbu:hover{border-bottom:4px solid #69c0ff;}.css-1vmawbu p,.css-1vmawbu ol,li .css-1vmawbu{font-size:20px;line-height:40px;}Algolia for search on my blog. They have a combination of APIs and JavaScript libraries you can use to set up search, and there are some handy plugins to help you regularly upload your articles for indexing.'''
