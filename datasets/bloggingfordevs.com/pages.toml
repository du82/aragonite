title = "35 Best Ruby Blogs to Read in 2021"
description = "Check out these blogs about Ruby, Ruby on Rails, Active Record, and Object-oriented programming with Ruby. Learn about topics like unit testing in Ruby with RSpec and Capybara."
full_description = "Jason focuses on Ruby, Ruby on Rails, and especially testing in Ruby with tools like Rspec, Capybara, and Factory Bot. He also hosts a podcast called the Rails with Jason podcast. Sarah Allen's reflections on internet software and other topics. She primarily writes about Ruby and Rust. Ruby Yagi is a blog with Ruby, Rails, and web development articles, written by Axel Kee, a Kuala Lampur-based developer. You can find articles about Rspec, Capybara, Tailwind CSS, and anything you need to do web development with Ruby. Emmanuel builds small projects with Ruby and writes about them. He writes about the inner workings of Ruby and Rails from time to time with posts on the basics of Ruby and Rails periodically. Rails newbies will find his articles useful. Mike writes a lot of Ruby content on his blog, though he also touches on other frameworks and languages related to web development like Go and JavaScript. He works on open source and is based in Portland, Oregon. Everyday Rails is about getting stuff done as a software developer. It’s usually about using Ruby on Rails, but often times, it’s not. It’s about finding the best tools, libraries, and practices to help you get your apps to production. Michael writes about his experience with Ruby, and covers topics like working with Kubernetes and Ruby. This blog will be useful for you if you're looking for a blend of DevOps and the Ruby programming language. Karol writes about Ruby on Rails and Ember.js. Recent posts cover topics like race conditions in Rails, RPC, and RabbitMQ. He often writes about distributed systems architecture, event-driven design, and scaling Rails. Karol is based in Poland and is the CTO at BookingSync. Elaine and Toby write about backend development with Ruby on Rails. They occasionally write about other tooling and practices used by our amazing web development community. All content tries to be useful to both new and seasoned developers. Aaron writes about Ruby and is a core contributor to Ruby, Ruby on Rails, and Nokogiri. He currently works at Shopify and is based in Seattle."
