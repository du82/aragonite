["https://bloggingfordevs.com/launch-a-newsletter"]
title = "Launching a newsletter: How we reached 1.2K+ subscribers in under two weeks"
description = "Learn how to launch a successful newsletter and grow your email list by a thousand people in a short amount of time."
full_description = '''When I launched the .css-1vmawbu{border-bottom:2px solid #69c0ff;color:#69c0ff;-webkit-transition:0.1s border-bottom linear;transition:0.1s border-bottom linear;font-size:20px;line-height:40px;}.css-1vmawbu:hover{border-bottom:4px solid #69c0ff;}.css-1vmawbu p,.css-1vmawbu ol,li .css-1vmawbu{font-size:20px;line-height:40px;}Blogging for Devs newsletter, I had no idea it was going to take off like it did, resulting in over a thousand subscribers in such a short time. As with a lot of things, once you get a sense for the audience and what they value, you do develop a strong intuition of what will resonate with them. A month after launch, and the newsletter is still growing every day. We'll soon reach 1,500 active subscribers! In retrospect, there are a lot of factors that made the newsletter launch so successful. So in this somewhat "meta" blog post, I want to explain exactly how I came up with the launch strategy, executed it, and what I learned in the process. My goal with the course was simple: to validate the idea that developers are even interested in growing their blogs. I've learned so much about blogging, but I didn't want to commit to any big projects without first testing whether people are even interested in it. Originally, I planned a 14-day course and no newsletter. But the scope was too big, and I got the feedback that the content didn't feel "actionable" enough. So, I pivoted to a shorter 7-day course in the form of a challenge, and cut out a ton of material, with the understanding I can keep sharing more tips and ideas afterwards. I used ConvertKit to create the course as a 9-day sequence that starts once you sign up: 1 welcome email, 7 lessons, 1 conclusion email. By setting it up this way, "late joiners" wouldn't miss out or join part-way through. It also helped me make tweaks to the content as you were sending me feedback, since not everyone started on the same day. This wasn't really intentional but it saved my butt! Almost exactly 75% of people who subscribed came from Twitter, with the majority from the announcement tweet (43%) and the blogging tips tweet (11%).'''
author = "https://www.facebook.com/yourpage"
year_published = 2020
