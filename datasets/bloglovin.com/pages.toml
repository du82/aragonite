ird party websites or their content. We encourage you to familiarize yourself with the terms of service applicable to any third-party website you may access. You acknowledge sole responsibility for and assume all risk arising from your access to, use of or reliance upon any third party websites and any materials or content made available therein. You further acknowledge that we do not undertake or assume any duty to monitor the Service for inappropriate or unlawful content and do not make any promises to remove third party materials or User Content (as defined in section VI (“User Postings”) below) from being accessed through the Service. Notwithstanding the foregoing, we reserve the right to remove third party content or User Content any time in our sole discretion. V. Copyright Infringement We respect the intellectual property rights of others. We will respond expeditiously to claims of copyright infringement using guidelines and procedures set forth in Section 512 of the Digital Millennium Copyright Act of 1998 ("DMCA"). If you see any material on the Service that in your good faith belief may infringe someone's copyright, you may notify us by e-mailing us at [email protected] or by using the “Contact support” functionality available in the Service and by inserting "Copyright" in the subject line. In order for it to be effective, your notice, also known as a takedown notice, must include the following information: The identity of the original copyrighted work that you claim is infringed or - if your notice covers multiple copyrighted works - you may provide a representative list of the copyrighted works that you claim have been infringed; A sufficiently detailed description of the content on the Service that you claim infringes the copyrighted work; Your contact information, including your full name, mailing address, telephone number, and email address, if available; A statement that you believe in good faith that the use of the allegedly infringing content on th