full_description = '''Tuesday, June 14, 2005 BlogNomic Frequently Asked Questions What is this? It's a Nomic - a game which starts with no particular aim or content, and whose rules are changed by the players as the game progresses. Players submit proposed changes to this weblog, suggesting whatever they like; if enough people vote in favour of a change, we update the rules and carry on playing. Can I join in? Yes, the game is open to new players. Do I need a weblog, to play? Not any more; players did have to in the early Dynasties, but we repealed that rule a while ago. The ruleset seems very daunting - can you recommend a Nomic with fewer rules? Yes; the next round of BlogNomic. Whenever anyone wins a round, the ruleset gets trimmed back to the basic proposal-making rules and we start again with a fresh new theme. If you want to be alerted by email when this happens, just subscribe to our Ascension Alert Service, and we'll let you know. How do I join? Click the Register link at the top of the main page. Fill out the information and click the link in your verification e-mail. Then make a post here announcing your arrival. You'll be added to the list of active players, and you can start playing! How do I get the name on my posts to match my BlogNomic name? Change your screen name in your profile. Click "My Account" at the top of the page while logged in to edit your profile. How do I get the dotted boxes around text, in proposals? Just put a <blockquote> tag before it, and a </blockquote> tag after it. How do I become an admin? Have a look at the Ruleset. Is BlogNomic syndicated? Yes. If your aggregator is Atom-enabled, you can subscribed to the Atom feed, and if you use LiveJournal, you can add the LJ feed to your friends page. posted by 75th Trombone at 14 Jun 2005 09:04:10 UTC Comments (0) <!-- function toggle_visibility(id) { var e = document.getElementById(id); if(e.style.display == 'none') e.style.display = 'block'; else e.style.display = 'none'; } //--> What is BlogNomic?BlogNomic is an online Nomic: a self-modifying game where changing the rules is part of the game. Players make blog posts proposing additions or alterations to the ruleset, discussing and casting votes in the comments: if enough vote in favour, the rules are changed and play continues. The game has been running since 2003 and resets every month or so. Have a look around the wiki for more information and history. New players are always welcome and can join in the game at any time. Already a player? Log in Want to join? Here's how Frequently Asked Questions BlogNomic Wiki Community Guidelines Current Documents The Current Ruleset // Clock Script Generated By Maxx Blade's Clock v2.0d // http://www.maxxblade.co.uk/clock //<![CDATA[ function tS(){ x=new Date(tN().getUTCFullYear(),tN().getUTCMonth(),tN().getUTCDate(),tN().getUTCHours(),tN().getUTCMinutes(),tN().getUTCSeconds()); x.setTime(x.getTime()); return x; } function tN(){ return new Date(); } function lZ(x){ return (x>9)?x:'0'+x; } function y2(x){ x=(x<500)?x+1900:x; return String(x).substring(2,4) } function dT(){ document.getElementById('tP').innerHTML=eval(oT); setTimeout('dT()',1000); } var dN=new Array('Sun','Mon','Tue','Wed','Thu','Fri','Sat'),oT="dN[tS().getDay()]+' '+lZ(tS().getDate())+'/'+lZ((tS().getMonth()+1))+'/'+y2(tS().getYear())+''+'-'+'-'+''+lZ(tS().getHours())+':'+lZ(tS().getMinutes())+':'+lZ(tS().getSeconds())+' UTC'"; if(!document.all){window.onload=dT;}else{dT();} //]]> 1 Pending Proposals [Appendix] Let Names Be Names (23 hours old - 7 comments - by ais523) 2 Pending Calls for Judgement Is the Oxford Comma Dead? (34 hours old - 14 comments - by JonathanDark) Is it Winning if You Say So? (28 hours old - 10 comments - by JonathanDark) Pending Declarations of Victory None. Other Pending Votable Matters Kingmaker: Conditionally flavour text? (35 hours old - 5 comments - by ais523) Game Data Dice Roller Current Active Players(admins in bold and *) <!-- function toggle_visibility(id) { var e = document.getElementById(id); if(e.style.display == 'none') e.style.display = 'block'; else e.style.display = 'none'; } //--> ais523 Bunana Desertfrog Habanero JonathanDark* Josh* Raven1207 Snisbo There are 8 Players. Quorum is 5. Join the Discord! Archives March 2025 February 2025 January 2025 December 2024 November 2024 October 2024 September 2024 August 2024 July 2024 June 2024 May 2024 April 2024 March 2024 February 2024 January 2024 December 2023 November 2023 October 2023 September 2023 August 2023 July 2023 June 2023 May 2023 April 2023 March 2023 February 2023 January 2023 December 2022 November 2022 October 2022 September 2022 August 2022 July 2022 June 2022 May 2022 April 2022 March 2022 February 2022 January 2022 December 2021 November 2021 October 2021 September 2021 August 2021 July 2021 June 2021 May 2021 April 2021 March 2021 February 2021 January 2021 December 2020 November 2020 October 2020 September 2020 August 2020 July 2020 June 2020 May 2020 April 2020 March 2020 February 2020 January 2020 December 2019 November 2019 October 2019 September 2019 August 2019 July 2019 June 2019 May 2019 April 2019 March 2019 February 2019 January 2019 December 2018 November 2018 October 2018 September 2018 August 2018 July 2018 June 2018 May 2018 April 2018 March 2018 February 2018 January 2018 December 2017 November 2017 October 2017 September 2017 August 2017 July 2017 June 2017 May 2017 April 2017 March 2017 February 2017 January 2017 December 2016 November 2016 October 2016 September 2016 August 2016 July 2016 June 2016 May 2016 April 2016 March 2016 February 2016 January 2016 December 2015 November 2015 October 2015 September 2015 August 2015 July 2015 June 2015 May 2015 April 2015 March 2015 February 2015 January 2015 December 2014 November 2014 October 2014 September 2014 August 2014 July 2014 June 2014 May 2014 April 2014 March 2014 February 2014 January 2014 December 2013 November 2013 October 2013 September 2013 August 2013 July 2013 June 2013 May 2013 April 2013 March 2013 February 2013 January 2013 December 2012 November 2012 October 2012 September 2012 August 2012 July 2012 June 2012 May 2012 April 2012 March 2012 February 2012 January 2012 December 2011 November 2011 October 2011 September 2011 August 2011 July 2011 June 2011 May 2011 April 2011 March 2011 February 2011 January 2011 December 2010 November 2010 October 2010 September 2010 August 2010 July 2010 June 2010 May 2010 April 2010 March 2010 February 2010 January 2010 December 2009 November 2009 October 2009 September 2009 August 2009 July 2009 June 2009 May 2009 April 2009 March 2009 February 2009 January 2009 December 2008 November 2008 October 2008 September 2008 August 2008 July 2008 June 2008 May 2008 April 2008 March 2008 February 2008 January 2008 December 2007 November 2007 October 2007 September 2007 August 2007 July 2007 June 2007 May 2007 April 2007 March 2007 February 2007 January 2007 December 2006 November 2006 October 2006 September 2006 August 2006 July 2006 June 2006 May 2006 April 2006 March 2006 February 2006 January 2006 December 2005 November 2005 October 2005 September 2005 August 2005 June 2005 Archive search: Advanced Search "Nomic is a game in which changing the rules is a move. In that respect it differs from almost every other game. The primary activity of Nomic is proposing changes in the rules, debating the wisdom of changing them in that way, voting on the changes, deciding what can and cannot be done afterwards, and doing it. Even this core of the game, of course, can be changed." -- Peter Suber BlogNomic is powered by pMachine ExpressionEngine.'''
