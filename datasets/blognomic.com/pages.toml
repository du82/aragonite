title = "BlogNomic: September 2005 archive"
description = "BlogNomic archive from September 2005."
full_description = "Friday, September 30, 2005 Hostile Takeover of Shangri-La The incongruity of these territory names is… incongruous. posted by Excalabur at 30 Sep 2005 20:48:22 UTC Comments (0) Proposal: More info 4-1. Timed out, enacted by ExcalaburAdminned at 02 Oct 2005 12:34:09 UTC Add to the informations listed in Quick Reference:* The combined population of all controlled territories. posted by ChronosPhaenon at 30 Sep 2005 18:54:08 UTC Comments (4) Proposal: Sun Tzu would be confused Reach quorum, passed unanimously five-nil. Enacted by ExcalaburAdminned at 01 Oct 2005 22:58:33 UTC Remove from the Conflict rule the line: “Each method is ineffective when used in a Territory controlled by a Country using a certain Government Type.” and also remove all attack methods, except Pillage and Swindle and insert these Attack Methods:-A Country may Assault another Country at a disputed Territory. This reduces the defenderâ€™s presence by any amount up to the attackerâ€™s presence and reduces the attackerâ€™s presence by that same amount, but no more than the defenderâ€™s original presence (before it was reduced). Assault cannot be used against a Country using the same government type as the attacker. A Country may Intimidate another Country at a disputed Territory. This converts a number of the defender’s presence units into an equal number of native population units. This number has to be less than the attacker’s presence. Intimidate cannot be used against a Country if that is the only Country using a specific government type. A Country using Despotism may Dominate. If the attacker has an attacking presence that is at least equal to the size of the defending presence, e may take control of a piece of Machinery from that Territory and move it to an adjacent Territory (it may be machinery that has not been completed). This Attack Method is ineffective when used in a Territory controlled by a defender using Feudalism. A Country using Feudalism may Crusade. If the attacker has an attacking presence that is at least equal to the size of the defending presence, e may demolish a construction in that Territory (it may be a construction that has not been completed). This Attack Method is ineffective when used in a Territory controlled by a defender using Anarchy. A Country using Neorobotnikism may Exterminate. This reduces the defenderâ€™s presence by twice the attackerâ€™s presence, and then reduces the attackers presence by twice the defenderâ€™s original presence (before it was reduced). This Attack Method is ineffective when used in a Territory controlled by a defender using Telecracy. A Country using Telecracy may Mind Control. This transfers population units from the defending presence to the attacking presence. The amount transferred may be up to the square root of the defending presence (rounding all fractions up to the nearest integer), but no more than size of the attacking presence. This Attack Method is ineffective when used in a Territory controlled by a defender using Neorobotnikism. I’m trying to balance out the attack methods a bit and give some other attack options. Dominate and Crusade are completely changed, with the new universal attack methods Intimidate and Assault taking on their previous styles of attack. Mind Control is weakened and Exterminate no longer cares about native population. I still plan to make an Invade attack method for attacking controlled Territories, but haven’t figured it out yet. posted by smith at 30 Sep 2005 18:19:33 UTC Comments (4) Starvation Warning: Country Smith #001 E was 5 Grain short. posted by ChronosPhaenon at 30 Sep 2005 17:00:08 UTC Comments (0) Market Position #018 The Hegemonist will Accept Buy Orders whose H$ XX value is equal to or greater than: * H$ 185 per unit of Grain * H$ 124 per unit of Metal * H$ 238 per unit of Petroleum The Hegemonist will Accept Sell Orders whose H$ XX value is equal to or lesser than: * H$ 177 per unit of Grain * H$ 120 per unit of Metal * H$ 224 per unit of Petroleum posted by ChronosPhaenon at 30 Sep 2005 16:58:18 UTC Comments (0) Quick Reference Page I just created the Quick Reference Page. If everyone could check their own entries and make sure I didn’t screw up, I’d appreciate it. posted by Excalabur at 30 Sep 2005 09:29:21 UTC Comments (0) Call for Judgment: Emigration, Part 2: Oceanic Territories 5-0, reaches a quorum of votes for—Excalabur.Adminned at 01 Oct 2005 01:11:32 UTC The Emigration portion of the hostile takeover rule reads: Emigration - The native population gives up and many of the population emigrates to neighboring territories. The Territory loses DICEW population, where W is the native population amount. All adjacent Territories gain native population of DICEW / N rounded up, where N is the number of Territories adjacent to that Territory. However, Oceanic Territories have been created since the passage of this rule. This leads to two possible interpretations. Excalabur, reasoning that Oceanic Territories cannot be inhabited, should not be included as an adjacent territory in the count of ‘N’, and no population should be added to them. This has the benefit of being physically reasonable: no on is going to emigrate to an Ocean. However, it is not strictly what the rule says. As this is the preexisting condition of the oldest Hostile Takeover since the passage of the Oceanic Territories rule, vote AGAINST this CfJ to agree with this interpretation. However, the other possible interpretation, put forward by Purplebeard, of this rule is that each adjacent territory, including Oceanic Territories, should be included in the count of ‘N’, and that the population that would otherwise be transferred to the territory simply vanish. This has the benefit of agreeing with the method for counting ‘N’ strictly according to the rule, but fails to agree with the ‘transferred to each adjacent territory’ portion. For FOR this Call for Judgment if you agree with this interpretation. If this call for judgment passes, the following shall occur: 1. Each Hostile Takeover that has occured since the passage of the Oceanic Territories rule was created shall be adjusted to agree with the second interpretation above. 2. The Emigration rule shall be rewritten to read as follows The native population gives up and many of the population emigrates to neighboring territories. The Territory loses DICEW population, where W is the native population amount. All adjacent non-oceanic Territories gain native population of DICEW / N rounded up, where N is the number of Territories, including oceanic territories adjacent to that Territory. Apologies for writing two calls for judgment on the same action. I couldn’t figure out how to make this fit in one CfJ. posted by Call for Judgment at 30 Sep 2005 06:58:32 UTC Comments (5) Call for Judgment: Emigration, Part 1: DICE rolling 4-4. After four days, not more than half the votes are for. Failed by Excalabur.Adminned at 03 Oct 2005 23:57:00 UTC The text of the hostile takeover rule regarding emigration reads: Emigration - The native population gives up and many of the population emigrates to neighboring territories. The Territory loses DICEW population, where W is the native population amount. All adjacent Territories gain native population of DICEW / N rounded up, where N is the number of Territories adjacent to that Territory. The prevailing interpretation up until now has been that DICEW is rolled once and then divided by N for the number gained by adjacent territories. Vote AGAINST this CfJ if you agree with this interpretation. However, the other possibility is that DICEW is rolled twice, once for the population loss and once for the population gained in adjacent territories. Vote FOR this CfJ if you agree with this interpretation. If this CfJ passes, restore Purplebeard’s Hostile Takeover to the way it was before Excalabur corrected it. Furthermore, for each Hostile Takeover that has been processed, correct the handling of Emigration to follow this method. posted by Call for Judgment at 30 Sep 2005 06:43:00 UTC Comments (8) Thursday, September 29, 2005 Proposal: Going Native Failed 2-2—smithAdminned at 01 Oct 2005 13:00:31 UTC Add to the Control rule:- At any time, a Country may relinquish control of a Territory e controls, which then becomes occupied by that Country instead. At any time, a Country that is occupying or disputing a Territory may convert any number of eir population presence there into native population units. posted by smith at 29 Sep 2005 18:18:29 UTC Comments (3) Hostile Takeover of Somewhere over the Rainbow I’m plantin’ my house on that witch! posted by jamuraa at 29 Sep 2005 16:22:09 UTC Comments (0) Proposal: Endgame 5-0. Reached Quorum. Enacted by Excalabur.Adminned at 30 Sep 2005 02:47:17 UTC Add a Victory Condition rule:If the Hegemonist is a Government in Exile, and a Country has controlled Chronos Phaenon Homeland during the last 48 hours, that Country has achieved the victory conditions for this Dynasty. posted by ChronosPhaenon at 29 Sep 2005 16:06:16 UTC Comments (5) Market Position #017 The Hegemonist will Accept Buy Orders whose H$ XX value is equal to or greater than: * H$ 186 per unit of Grain * H$ 124 per unit of Metal * H$ 221 per unit of Petroleum The Hegemonist will Accept Sell Orders whose H$ XX value is equal to or lesser than: * H$ 174 per unit of Grain * H$ 120 per unit of Metal * H$ 208 per unit of Petroleum posted by ChronosPhaenon at 29 Sep 2005 15:52:31 UTC Comments (0) Wednesday, September 28, 2005 Market Position #016 The Hegemonist will Accept Buy Orders whose H$ XX value is equal to or greater than: * H$ 183 per unit of Grain * H$ 124 per unit of Metal * H$ 206 per unit of Petroleum The Hegemonist will Accept Sell Orders whose H$ XX value is equal to or lesser than: * H$ 172 per unit of Grain * H$ 120 per unit of Metal * H$ 194 per unit of Petroleum posted by ChronosPhaenon at 28 Sep 2005 22:26:06 UTC Comments (0) Call for Judgment: ‘Transfer’ 8-0. Reached Quorum and then some.—ExcalaburAdminned at 29 Sep 2005 23:42:43 UTC The Text of Mind Control reads: A Country using Telecracy may Mind Control. This transfers an amount of population units from the defending presence to the attacking presence equal to the square root of the defending presence plus one (rounding all fractions up to the nearest integer). . The glossary has an entry that reads:Unless otherwise specified, game variables defined to hold numeric values can hold only non-negative integers, and any action that would set those values below zero instead sets them to zero. The question at hand is the Mind Control of Smith by Jamuraa at Somewhere Over the Rainbow. Smith had 1 Population present, and loses 2 of them to Mind Control. Since e only had one there, eir population in the territory is set to 0. However, does Jamuraa gain 1 or 2 population? It can be argued that the word ‘transfer’ implies that Jamuraa cannot gain what Smith did not lose. If you are in this camp, vote FOR this CfJ. Upon passage, reduce Jamuraa’s population in Somewhere over the Rainbow by 1. If the person in question has been moved or converted to someone else’s cause, reduce the appropriate population accordingly. Furthermore, this CfJ shall be precedent for future actions of the same type, and interpretations of the word ‘transfer’. If you, however, feel that Jamuraa deserves his extra population, vote against this CfJ. posted by Call for Judgment at 28 Sep 2005 19:01:42 UTC Comments (9) Proposal: Negative Presence Fix S-K. Failed by ExcalaburAdminned at 30 Sep 2005 02:44:59 UTC Change the second paragraph of subrule Contrtol to: The occupying or disputing Countries are listed in the Controller field. These Countries must have a positive non-zero population presence in the Territory, which is listed in the Population field. If at any time, a Country would have less than 1 population in a Territory, ey are considered to not occupy the Territory. This information is broken out as follows: This should prevent the craziness which just happened in Somewhere Over the Rainbow posted by jamuraa at 28 Sep 2005 16:55:58 UTC Comments (5) no invasion? Should I propose another version of invasion rules or give it up? Maybe we should go in a more economic direction and less of a military one? What about making a Bond Market? Or each Country could issue its own currency for a Currency Market? Does anyone know anything about those subjects? posted by smith at 28 Sep 2005 16:48:11 UTC Comments (3) Mind Control: Smith at Somewhere Over The Rainbow. I transfer sqrt(1) + 1 = 2 people of Smith’s to me. Smith now has -1 population presence in Somewhere Over the Rainbow. posted by jamuraa at 28 Sep 2005 16:47:57 UTC Comments (0) Proposal: Idleness loophole fix. 5-0. Reached Quorum. Enacted by ExcalaburAdminned at 30 Sep 2005 02:42:16 UTC In rule 10.5 Change:Whenever a Country goes Idle, the control of eir Homeland secedes to the Hegemonist. Any other Territory they control becomes uncontrolled. Whenever a Country is Unidled, the control of eir Homeland is given back to em. The control of any other Territory they controlled at the moment of Idleing that is still uncontrolled at the moment of Unidling is also returned to em. to Whenever a Country goes Idle, the control of eir Homeland secedes to the Hegemonist if e controls it. Any other Territory they control becomes uncontrolled. Whenever a Country is Unidled, the control of eir Homeland is given back to em if the Hegemonist controls it. The control of any other Territory they controlled at the moment of Idleing that is still uncontrolled at the moment of Unidling is also returned to em. Otherwise, one could idle and unidle to get one’s homeland back. posted by Rodney at 28 Sep 2005 12:01:16 UTC Comments (4) Proposal: Nonagressive Leader 2-3. Times out, fails—ExcalaburAdminned at 30 Sep 2005 02:40:45 UTC Change the fifth paragraph of the rule “Transportation” to read: If the target Territory is occupied by another Country or disputed, this is called Hostile Transportation, which costs ten times the basic Transportation rate. In addition, if the population being moved is robots, 2 units in 5 are lost in transit and removed (with any fractional amount lost rounded up to the next integer). The occupied Territory then becomes disputed by the Countries involved. The Hegemonist cannot perform Hostile Transportation unless e, at some point since the beginning of eir Dynasty, controlled or occupied the target territory This prevents Chronos from using his dominant position to bias the game for the rest of us. While e can’t win, e can affect who does by attacking people selectively. This limits him to only colonizing uncontested territories and defending himself. Hopefully, e doesn’t veto it…. posted by Excalabur at 28 Sep 2005 09:29:45 UTC Comments (8) Proposal: Information Sheet 3-1. Timed out. Enacted by Excalabur.Adminned at 30 Sep 2005 01:54:12 UTC Create a new wiki page, entitled ‘Quick Reference’. Enact a new sub"
