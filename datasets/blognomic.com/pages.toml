title = "BlogNomic: August 2005 archive"
description = "BlogNomic archive from August 2005."
full_description = "Wednesday, August 31, 2005 Proposal: Return of the Robomuffins S-K.—ChronosAdminned at 01 Sep 2005 03:54:57 UTC Color Squares 1 to 4 Yellow. Color Scrap Brain Zone and Fresh Brain Zone Black. Color the Hexagon of Fire Red. Some things were lost when the Game reset. posted by Rodney at 31 Aug 2005 19:04:56 UTC Comments (2) Notice: Inflation The Currency Authority has acted just after Proposal: Reset passed. The situation before acting was: C = 0.755 L = 3,381 B = 500 BL=0.148 C/BL = 5.103 All relevant values adjusted by 5.103. The New Player’s value is B$ 510. posted by ChronosPhaenon at 31 Aug 2005 18:50:27 UTC Comments (0) Proposal: This land is your land, this land is *explosion sound* S-K.—ChronosAdminned at 01 Sep 2005 03:56:37 UTC If Proposal: Reset passes, destroy all squares with a number greater than 25 in the World. posted by jamuraa at 31 Aug 2005 17:05:36 UTC Comments (4) Proposal: Reset 4-0. Reached Quorum.—ChronosAdminned at 31 Aug 2005 11:28:34 UTC Reset these game variables: * Clear the ownership of all squares in the world, so that no squares are owned by a player. * Set all Players’ BDollars to 100. Set the amount of BDollars to be given a new Player to B$ 100 in the Currency rule. * Clear all players items. * Move Go Square to Square # Zero and place all players there. No player shall be considered to have landed or advanced to Go Square due to this move.If this Proposal passes, Smith shall receive Popularity benefits from it, instead of Chronos Phaenon. posted by ChronosPhaenon at 31 Aug 2005 15:07:33 UTC Comments (4) Proposal: New Player Incentive Vetoed.—ChronosAdminned at 01 Sep 2005 03:55:48 UTC Add a rule called New Player Reset: Whenever a new player joins blognomic, these game variables are reset: The ownership of all squares in the world is cleared, so that no squares are owned by a player. Players with a positive amount of BDollars have eir total reset to the new Player starting BDollar amount. All players Items are cleared. Let’s give new players an even playing field. posted by smith at 31 Aug 2005 13:25:47 UTC Comments (2) Wednesday, August 31, 2005 Proposal: Archemedes! 4-0. Reached Quorum.—ChronosAdminned at 31 Aug 2005 11:58:28 UTC Add a new color “Mt - Metal” to the list of colors. Color Square 43 the Metal Color, and Name it “The Inventor’s Shop” Add a sub-rule The Inventor’s Shop to the World rule which reads: Whenever a player lands in The Inventor’s Shop, e may pay B$ 20 to comission a new piece of Machinery. Ey then must make a post to the Blog titled “New Machine: Z” where Z is replaced with the name of their machine, and a description of what it does. The new machine must have an X value of 3 or higher. Other players may vote FOR or AGAINST the new machine on the blog. If current quorum distinct AGAINST votes are posted on the entry within 2 days, the Players have revolted and the Machine has been destroyed. Otherwise, the machine is added to the list of machinery available. posted by jamuraa at 31 Aug 2005 00:39:27 UTC Comments (3) Notice: DarkOver I’m jus expecting DarkOver to manifest eirself here, in accordance to rule 2 - Players, so I can add e to the sidebar and consider eir votes. posted by ChronosPhaenon at 31 Aug 2005 00:13:15 UTC Comments (1) Monday, August 29, 2005 Proposal: It would be nice to know… 5-0. Reached Quorum.—ChronosAdminned at 31 Aug 2005 07:13:33 UTC Enact a new subrule of “Currency” entitled “When did that happen?” statingWhenever the Currency Board adjusts the amount of B$ in existence as described in 10.2 or any other rule, the Currency Board must post a message to the main page stating that an adjustment has taken place, including any relevant details, so that the players of blognomic may be aware of the adjustment. Sorry I haven’t had any big ideas lately… I’ve been distracted. posted by gazebo_dude at 29 Aug 2005 23:30:33 UTC Comments (4) Jumping for the Hands Once more. posted by ChronosPhaenon at 29 Aug 2005 20:59:03 UTC Comments (0) Proposal: Throne Machinery 2-3. Can’t be enacted w/o COV.—Chronos.Adminned at 31 Aug 2005 07:14:02 UTC In rule World, delete this text:A player on the Throne square may, provided he has not done so since he most recently moved onto the Throne, become Emperor by posting to the frontpage (http://blognomic.com) with a post entitled “X is Claiming the Throne”, where X is eir name. E then assumes all the powers of Emperorhood until someone else becomes Emperor via the same mechanic, and may not Declare Victory. Add this to the Machinery list:* Throne. Only one Throne may exist. If a Throne is installed in a Square, destroy every other Throne in the World. A Player landing in a Square with a Throne may become Emperor by posting to the frontpage (http://blognomic.com) with a post entitled “X is Claiming the Throne”, where X is eir name. E then assumes all the powers of Emperorhood until someone else becomes Emperor via the same mechanics. Install a Throne in Sq. 11. posted by ChronosPhaenon at 29 Aug 2005 20:59:02 UTC Comments (6) Proposal: Victory 5-0. Reached Quorum.—smithAdminned at 31 Aug 2005 06:45:18 UTC Enact a new rule with the following text: These are the Victory Conditions of this Dynasty. If all Squares are Black, then the Robomuffins have wiped out all resitance and the Robomuffin with most B$ has forfilled the Victory Conditions of this Dynasty and may Declare Victory. If no Squares are Black then the Robomuffins have been banished from the land and the Knight who changed the Color of the last Black Square has forfilled the Victory Conditions of this Dynasty and may Declare Victory. If all Players have negitive B$, then the Tangelo Smuggler with the most B$ has forfilled the Victory Conditions of this Dynasty and may Declare Victory. If a Warpjumper has Moved to every Square in the World within a 24 Hour period has forfilled the Victory Conditions of this Dynasty and may Declare Victory. If all players are Criminals of in Gaol, then the Criminal with the lowest B$ has forfilled the Victory Conditions of this Dynasty and may Declare Victory. posted by Rodney at 29 Aug 2005 20:07:18 UTC Comments (5) We need players Our Active Player list is shrinking. Does anyone have any ideas for getting some more players involved? posted by smith at 29 Aug 2005 18:51:52 UTC Comments (2) Proposal: More Popularity 2-3. Could not be enacted without a change of vote.—Smith Adminned at 31 Aug 2005 06:42:57 UTC Rewrite the Popularity rule, so it reads:Whenever a proposal passes, the Player who posted it shall be allowed to Advance N Squares, where N is the number of votes FOR the proposal that passes minus the number of AGAINST votes on the proposal that passed. E shall also be allowed to add 1 Color Code (from the list on the Color Code subr-rule) to one Square of eir choosing. posted by ChronosPhaenon at 29 Aug 2005 17:39:58 UTC Comments (5) Proposal: Quick Inflation 4-0. Reached Quorum.—ChronosAdminned at 29 Aug 2005 13:45:59 UTC In Currency Value sub-rule, change once every Friday, to often. posted by ChronosPhaenon at 29 Aug 2005 14:09:58 UTC Comments (3) Proposal: Often is not often enough 4-0. Reached Quorum.—ChronosAdminned at 29 Aug 2005 13:45:48 UTC In The Yellow Shop sub-rule, delete the word “often”.This has frozen the game. I guess the 5 items use/day is enough to bar infinity scams. posted by ChronosPhaenon at 29 Aug 2005 13:58:47 UTC Comments (3) More Idleness Excalabur is Idle, as per his request. 75th Trombone, Quazie and ShadowClaw are idle for not having vote since Aug, 22. Quorum falls to 3. posted by ChronosPhaenon at 29 Aug 2005 13:53:32 UTC Comments (0) Idle Can someone mark me as idle? I’ve been caught up in moving stuff for the last week, and have no idea what’s going on anymore. I’ll unidle after i’ve had a chance to read the ruleset. posted by Excalabur at 29 Aug 2005 06:14:04 UTC Comments (0) Monday, August 29, 2005 Running for Leader I want to be leader! posted by Rodney at 29 Aug 2005 00:48:06 UTC Comments (1) Proposal: Do you smell something burning? 3-1. Reached Quorum.—ChronosAdminned at 29 Aug 2005 10:26:35 UTC Add a new subrule named “Tangelo Smuggling” to rule 13:If a Player would land on a Red Square they must Smuggle a Tangelo or lose $20 and Advance 1 Square. If a Player moves this way they are not considered to have landed on the Square that they lost $20 dollars at. Add the following item to the list of items:Tangelo. Cost: 10$. When used, the Tangelo is considered Smuggled. If a majority of votes contain the string “Third degree burns are fun!” then also make the following changes: Create a new Square named Inferno with an Ordinal Number of X. Add a new Subsubrule to Subrule 13.10 with the following text:Inferno is not connected with any other part of the World. A Player may not Advance from Inferno. Add the following text to Subrule 13.10:If a Player’s B$ becomes negitive this way then e Jumps to Inferno. posted by Rodney at 28 Aug 2005 18:14:35 UTC Comments (3) Saturday, August 27, 2005 Proposal: Property Value 5-0. Reached Quorum.—ChronosAdminned at 29 Aug 2005 07:01:58 UTC In the Property rule, changeA Player in a Square which is not Beige may Acquire that Square, becoming its Owner. To do so, e must spend an amount of B$ equal to X times the number of that Square, where X is equal 1 plus the number of color codes (including White) on that Square. To this purpose, the Square # Zero is considered to have a number 1 unit greater than the last Square in the World. toA Player in a Square which is not Beige may Acquire that Square, becoming its Owner. To do so, e must spend an amount of B$ equal to X times the number of that Square, where X is equal 1 plus the number of color codes (including White) on that Square, plus the price of any machinery installed there, as if bought new. To purposes of this rule, the Square # Zero is considered to have a number 1 unit greater than the last Square in the World. posted by ChronosPhaenon at 27 Aug 2005 15:09:58 UTC Comments (4) Proposal: Color factory revamp 4-0. Reached Quorum.—ChronosAdminned at 29 Aug 2005 07:01:47 UTC Add to The Color Factory sub rule:At any time, if there exists a Color Coded listed in the ruleset, except Wh, Bg and Gr, and The Color Factory has not that Color, add that Color to the Color Factory. At any time, if there is not a Paint Fountain in The Color Factory, install a Paint Fountain there. Flavorwise posted by ChronosPhaenon at 27 Aug 2005 15:09:48 UTC Comments (3) Friday, August 26, 2005 Jumping for the hands Kriss Kross will make ya.. posted by jamuraa at 26 Aug 2005 17:48:31 UTC Comments (0) Call for Judgment: Smuggled items. 1-2. Timed Out.—ChronosAdminned at 31 Aug 2005 07:16:37 UTC Chronos Phareon says that Rodney doesn’t have either of eir Paints, because the same effect that sent Rodney to Gaol also activated the one that toke eir Paints. This doesn’t make much sense, as there are 3 effects. The last one gives the person who sent the Debitor to Gaol half the price of the Debitor’s items. Under Cronos’s interpitation, that would mean that that last one was activated too, but that wouldn’t make any sense under the current rules. Vote FOR this CFJ if you think that the effects are seperate and didn’t trigger each other. Vote AGAINST this CFJ if you don’t. Should this CFJ pass then Rodney’s interpitation shall be considered correct, and eir actions legal. posted by Call for Judgment at 26 Aug 2005 12:41:37 UTC Comments (5) Friday, August 26, 2005 Proposal: Eureka! Self-Killed by Jamuraa—ExcalaburAdminned at 28 Aug 2005 06:48:37 UTC Add a new color “Mt - Metal” to the list of colors. Color Square 43 the Metal Color, and Name it “The Inventor’s Shop” Add a sub-rule The Inventor’s Shop to the World rule which reads: Whenever a player lands in The Inventor’s Shop, e may pay B$ 20 to create a new piece of Machinery. Ey then must make a post to the Blog titled “New Machine: Z” where Z is replaced with the name of their machine, and a description of what it does. The new machine must have an X value of 3 or higher. Other players may vote FOR or AGAINST the new machine on the blog. If 1/2 current quorum (rounded down) distinct FOR votes are posted on the entry within 2 days, the new Machinery is added to the List of Machinery. If Proposal: Machinery does not pass, this proposal does nothing. posted by jamuraa at 26 Aug 2005 02:11:36 UTC Comments (8) Proposal: Warp Machine 2-3, timed out, failed by ExcalaburAdminned at 28 Aug 2005 12:30:54 UTC If Proposal: Machinery didnâ€™t pass, this Proposal does nothing.Add to the list of available Machinery:* ‘’‘Warp Machine’‘’: Whenever a player ends a move on a Square with a Warp Machine, e may immediately Jump to any other Square with a Warp Machine. Note that this does not entitle the player to claim benefits for passing intervening squares, such as Go. Whenever a new Square is created whose last digit is 2 or 7, install a Warp Machine on that Square. A Warp Machine may never be installed in the Jackpot Square. Repeal the Warp Squares sub-rule and install a Warp Machine on Every blue Square, except the Jackpot Square.Under rule Items, delete:* Painting any Square with Blue Paint will make that Square a Warp one. Under rule Jackpot, delete:or by a Blue Square warp Under rule Homelands, changeIf a Player is loyal to a blue square, e may be referred to as a Warpjumper. toIf a Player is loyal to a square with a Warp Machine, e may be referred to as a Warpjumper. It’s less abusable (and a lot more expensive) than using paint to grant access to high numbered/high valued Squares. posted by ChronosPhaenon at 25 Aug 2005 19:41:52 UTC Comments (4) Notice: More Idleing Quazie and ShadowClaw are going idle tomorrow if they don’t vote. posted by ChronosPhaenon at 25 Aug 2005 19:28:57 UTC Comments (0) Proposal: Rule the World! 5-0. Reached Quorum.—ChronosAdminned at 27 Aug 2005 07:11:32 UTC Add a rule named “Election”:A player may atempt to become Leader of eir Clan by making a post to that effect. All Allies of that player may repspond once to the post using the FOR and AGAINST icons. After 48 hours, if there are more FOR responces than AGAINST responces then the Player who made the post shall become Leader of eir Clan, and the old Leader shall cease to be Leader. This will add an intresting political/bribery aspect to the game.I’ve edited it so it’s now a proper Proposal. You don’t append “Proposal” to the title anymore. Instead you mark it as a Proposal in the “CATEGORIES” tab in the posting window.—Chronos posted by Rodney at 25 Aug 2005 19:16:31 UTC Comments (4) Jumping for the hands One more time. posted by ChronosPhaenon at 25 Aug 2005 15:51:36 UTC Comments (0) Where did it GO ‘cos I can posted by ChronosPhaenon at 25 Aug 2005 15:50:05 UTC Comments (0) Chronos Phaenon is Claiming the Throne I just hit Sq 11. I’m also inducting myself to the Currency Board. Anyone else wants to be inducted? posted by ChronosPhaenon at 25 Aug 2005 15:49:14 UTC Comments (0) Proposal: Slot Machine 3-2. T"
