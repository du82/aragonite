title = "BlogNomic: October 2005 archive"
description = "BlogNomic archive from October 2005."
full_description = "Tuesday, November 01, 2005 Proposal: Lots of components 5-1. Reached Quorum.—ChronosAdminned at 02 Nov 2005 05:53:40 UTC Add those components to Powers:* Reflex - Power can only be used within 24 hours of either you, one of your Temples or a City controlled by your Pantheon being targeted by a Power used by a Deity from another Pantheon. (+3 Global Worship) * Hinder - You can {Make a Post} naming any Deity. That Deity becomes hindered. All Powers in that Deity’s list gains the Sign component. This can lead to a Power having two instances of the Sign component. (+50 Global Might) * Earthquake - Choose 2 Temples in the same City. Those temples are destroyed. (+25 City Might) * Volcano - Choose a Deity and a City. All temples belonging to that Deity in that City are destroyed. This power must be a Festival. (+40 City Might) * Fog - Choose a City. For the next 24 hours, that City yields no Pilgrim Worshippers to its controlling Pantheon. This power must be a Holy Day or Festival. (+30 Global Might) * Windstorm - Choose a City. For the next 24 hours, no Pilgrim Worshippers shall exist in that City. This power must be a Holy Day or Festival. (+30 Global Might) * Lightning â€“ Chose a Temple belonging to any Deity. Permanently reduce by 50 the number of Resident Worshippers yielded by that Temple. This shall be represented in the Cities Wiki by an “*” after the Deity name in the Temple’s listing. (+30 City Might) As usual, voters on this proposal may list any Components they feel are abusable, along with their vote. If any Component listed in this Proposal is considered abusable by *TWO* or more Deities, it shall be removed from the list when this proposal is enacted. posted by ChronosPhaenon at 01 Nov 2005 03:15:38 UTC Comments (5) Truman Capote You have to up everyone’s Quint when you often up yours. posted by ChronosPhaenon at 01 Nov 2005 02:48:43 UTC Comments (1) Proposal: A Fall Farewell 1-5. (Gazebo’s vote not counted, since e’s idle). Cannot be enacted without CoV.—ChronosAdminned at 02 Nov 2005 05:51:45 UTC Add a rule stating “Gazebo_dude may not unidle during this dynasty.” Set gazebo_dude’s quintessence to 5000. When gazebo_dude goes idle, write “Man, isn’t he whipped?” next to his name. Pointless fun proposal. Maybe you guys could try to tap my quint. somehow. posted by gazebo_dude at 31 Oct 2005 23:57:45 UTC Comments (7) Might as well… Idle me. I’ll be pretty distracted the next couple of months what with an overseas move and a wedding to figure out. I’ll be back, maybe february/march-ish when we’re somewhat settled, depending on when we get a computer and internet access etc. Anyway I don’t want to hold up the queue. It’s almost a shame cause this is an excellent dynasty you’ve got going here. *sigh* Anyway, cya all later, Happy Nomicing, gazebo_dude posted by gazebo_dude at 31 Oct 2005 23:44:26 UTC Comments (4) Unforetunetely for those who owned beach-front property in Valhala… ...A massive Tsunami hit. Only the original Norse settlers survived. The People of Doraith were then liberated from their oppresion from the Greeks by a group of devout Norse pilgrims. As this weaked Greek power, Enki’s followers were able to retake Ur. posted by Rodney at 31 Oct 2005 23:44:04 UTC Comments (4) Proposal: Not that much Prosperity S-K by Smith.—ChronosAdminned at 02 Nov 2005 05:40:24 UTC Change the effects of Prosperity in the list of defined Ages to:-Prosperity - During this Age, double any Quintessence gains. There, that should be better. posted by smith at 31 Oct 2005 14:48:23 UTC Comments (5) Proposal: City Power 6-0, reached quorum. Enacted by Chronos Phaenon (you beat me to it—smith)Adminned at 02 Nov 2005 05:49:24 UTC I was wrong about the effects of an Age of Prosperity. Without a quintessence cost, any number of cities could be created. If we make city creation a power component instead, then the emergency override Kevan created for Powers should keep things reasonable. Create a Global Might Power Component:Land: Create a City. The Incarnation of the Deity using this Power is its Founder, and the Deity may choose its Name, Dominant Pantheon and Description. (+15 Global Might) Change the Cities rule to read:-Each City of the world has a Name, Founder, Dominant Pantheon and optional Description, tracked in the Cities Wiki. posted by smith at 31 Oct 2005 14:19:23 UTC Comments (5) Proposal: More Powers, again 6-1. Reached Quorum. Popularity and Fana where found abusable by 3 or more Deities. Consider that I changed my vote to make no-realiable abusable also.—Chronos.Adminned at 02 Nov 2005 04:58:03 UTC If Proposal: Strange Powers didn’t pass, this Proposal does nothing.In the Powers rule, changeDeities start with no Powers, but may create a new Power by spending 1 Quintessence and constructing a new Power from a combination of the components listed below, and giving it a name of their choice. Each component has a Worship or a Might cost - a constructed power must have at least as much Worship as Might. If a Power uses any Global Might, it must also have at least as much Global Worship. A Power may only contain one instance of each component. toDeities start with no Powers, but may create a new Power by spending 1 Quintessence and constructing a new Power from a combination of the components listed below, and giving it a name of eir choice. At any time, a Deity may modify a Power e eirself has created, by spending 1 Quintessence. A Power can only be modified by adding components to it. Each component has a Worship or a Might cost - a Power being constructed or modified must have at least as much Worship as Might. If a Power uses any Global Might, it must also have at least as much Global Worship. If a Power has a Component which gives a variable amount of Worship or Might, the balance condition between those amounts (Worship >= Might and Global Worship >= Global Might) must be true when the power is being used, instead of when it is being constructed. A Power may only contain one instance of each component. Add the following components to the list in that rule:* Popularity: Power can only be used if the Deity doing so is the Godhead. (+15 Global Worship) * Universal: This power can be used by any Deity, not only by the one who created it. (+5 Global Worship) * Awe: Your people adores you. Power can only be used in a City where you have Worshippers. Figures X to the number of Worshippers you have in that city, divided by 100, rounded down - for example, both 1.01 and 1.99 are rounded to 1.00. (+X City Worship). * Non-reliable: You must roll a DICE8 when trying to use this power. X is the result of that dice roll. Only usable if this Power is also either a Holy Day or a Festival. (+X Global Worship if it’s a Holy Day; + 3X Global Worship if it’s a Festival). * Fana: X is the total number of Temples you have. (+X Global Worship). * Transmorphing: You can change roles without spending any Quintessence (+50 Global Might). * Channeling: You may transfer X Quintessence from a Deity to another. (+12X Global Might) * Shapeshifting: When changing roles, you may change the ownership of X Temples from your previous Incarnation to your new one. Only one power with the Shapeshifting component may be used per change of role. (+18X Global Might) As usual, voters on this proposal may list any Components they feel are abusable, along with their vote - if any Component is considered abusable by three or more Deities, it shall be removed from the list when this proposal is enacted.Last try has failed for lacking of votes. I’m trying it again, having tunned down some of the powers people felt as abusable before. posted by ChronosPhaenon at 31 Oct 2005 13:24:02 UTC Comments (15) Notice Catena of the Ages has passed, but I’m unable to add the Prophecy field to the GNDT. posted by ChronosPhaenon at 31 Oct 2005 13:22:00 UTC Comments (3) Ur and Doriath… ...are enlightened by Greek Worshipping. On a side note, Chronos is the Godhead again. posted by ChronosPhaenon at 31 Oct 2005 13:08:03 UTC Comments (0) Sunday, October 30, 2005 Proposal: We are overcrowding here 7-0. Reached Quorum. Wonder is abusable, More Powers has not passed.—Chronos.Adminned at 31 Oct 2005 18:43:54 UTC Hearing to what Gwydion has said, change the item about Pilgrims in Conversion to:* 100 Pilgrim Worshippers for every other City which has that Pantheon as its Dominant one. This number must be capped to the number of Resident Worshippers that Deity has in this City. Add some components to the Powers rule:* Rage: Power can only be used within 24 hours of one City of your Pantheon being destroyed by a Deity from another Pantheon. (+12 Global Worship) * Phenomenon: You must expend 3 Quintessence to perform a phenomenal feat, when using this Power. (+30 Global Worship) * Wonder: You must expend 5 Quintessence to perform a wonderful feat, when using this Power. (+50 Global Worship) If Proposal: More Powers passed add some more components to the Powers rule: * Fana â€“ Figure X to the number of Temples you have. (+X Global Worship). * Channeling - You may transfer X Quintessence from a Deity to another. (+12X Global Might) * Shapeshifting â€“ When changing roles, you may change the ownership of X Temples from your previous Incarnation to your new one. Only one power with the Shapeshifting component may be used per change of role. (+18X Global Might) As usual, voters on this proposal may list any Components they feel are abusable, along with their vote - if any Component is considered abusable by three or more Deities, it shall be removed from the list when this proposal is enacted. posted by ChronosPhaenon at 30 Oct 2005 22:17:54 UTC Comments (7) While the 950 resdents of Olimpia were celebrating their ill-gotten gains… ...They failed to notice the huge meteor sent by the Aesir. All 950 heretics were destroyed instantly opon the meteor’s impact. The people of R’leyh wisely decided to convert. In other news today, I declare myself Godhead posted by Rodney at 30 Oct 2005 15:59:53 UTC Comments (9) Sunday, October 30, 2005 My Internet Connection is Failing… Could we make it easier to +1 every Deity’s Quintessence? Cause I mean, I get lost about halfway through adding one to everyone’s Q… posted by Gwydion at 30 Oct 2005 01:32:11 UTC Comments (2) Lunaetic… ...is Idle. Quorum is 6. I’m still unable to update the GNDT. posted by ChronosPhaenon at 30 Oct 2005 01:15:08 UTC Comments (0) Proposal: Pilgrims are Foreigners S-K by Gwydion.—ChronosAdminned at 31 Oct 2005 05:18:09 UTC I propose that: 2.5.1 Conversion At any time, if there is at least one Temple belonging to a Deitiy in that Pantheon in a given City, that Pantheon has a number of Worshippers in that City, added together from the following types:: * 50 Settler Worshippers if the Founder Deity is of that Pantheon. * 100 Resident Worshippers for every Temple of that Pantheon in that City. * 100 Pilgrim Worshippers for every other City which has that Pantheon as its Dominant one. If a Pantheon has more Worshippers in a City than any other Pantheon, any Deity may change the Dominant Pantheon of that City to become that Pantheon. be changed to read: 2.5.1 Conversion At any time, if there is at least one Temple belonging to a Deitiy in that Pantheon in a given City, that Pantheon has a number of Worshippers in that City, added together from the following types:: * 50 Settler Worshippers if the Founder Deity is of that Pantheon. * 100 Resident Worshippers for every Temple of that Pantheon in that City. * Between 0 and 100 Pilgrim Worshippers for every other City which has that Pantheon as its Dominant one, so long as the number of Pilgrim Worshippers not exceed the number of Worshippers to the Dominant Pantheon of the city in question. If a Pantheon has more Worshippers in a City than any other Pantheon, any Deity may change the Dominant Pantheon of that City to become that Pantheon. This allows for the takeover of cities by a Deity with a large number of temples in the City, but does not allow for Deities with many Dominated Cities to take over Cities with very few Temples. The wording is subject to approval, obviously, but it just doesn’t seem fair that cities with one Temple (i.e. Gwynedd) should be devoted to a Pantheon just because that Pantheon is popular elsewhere. Or maybe the Deities who found Cities which are taken over by Deities of other Pantheons should just be required to re-Incarnate as a Deity of the new Dominant Pantheon…? posted by Gwydion at 30 Oct 2005 01:08:07 UTC Comments (1) Ladies, gentlemen, gods, goddesses I have to say that I’m impressed with the Power system. Seems flexible, open, and well, powerful.. =) Nice work. Don’t blow up all the cities at once. posted by Angry Grasshopper at 29 Oct 2005 21:14:44 UTC Comments (1) R’leyh is Greek once more And so are Olympia, Valhalla, Gwynedd and Babylon… In a most recent change in the balance of power, the Greek Pantheon has re-achieved supremacy over the city of Olympia. Hordes of worshippers from that city went then to Valhalla, Gwynedd and Babylon where Glimpses of Chronos’s power Isnpired them to build temples to that Divinity, giving Greek Supremacy over those cities also. By the end of the day, 400 Worshippers from all around the World rallied around Chronos temples in R’leyh where, aided by 200 local people, they overthrew Norse opression. In the aftermath, Chronos has pronounced eirself Godhead. Go Greeks!!!! posted by ChronosPhaenon at 29 Oct 2005 20:50:07 UTC Comments (0) Notice With the passage of Strange Powers, we can lo longer pay 1 Quint to build a Temple. We have to do that through a Inspire power posted by ChronosPhaenon at 29 Oct 2005 20:43:18 UTC Comments (0) Purplebeard and Jamuraa… ...are idle, per their request. Please someone with Unix savoir-faire remove them from the GNDT. Quorum is 7. posted by ChronosPhaenon at 29 Oct 2005 20:30:06 UTC Comments (3) Proposal: Catena of the Ages 6-1. Timed Out and Reached Quorum.—ChronosAdminned at 31 Oct 2005 05:18:32 UTC Create a rule called Prophecy:-Existence passes through great cycles of being. Deities may usher in these cycles by declaring a Prophecy, which is tracked in the GNDT. A Deity may change eir Prophecy occasionally to a word or short phrase of eir choosing, or to nothing at all. Create a sub-rule to that called Ages:-The current Age is determined by the Prophecy held by the most Deities, and is named after it (such as “Age of Cataclysm”, “Dark Ages” or omitting the ‘Age’ entirely, such as “The Beginning”) and is tracked in the Deity wiki. Minor differences in spelling, plural/singular, articles and conjuctions are ignored for the purposes of considering Prophecies to be the same. In the case of a tie for most popular Prophecy, the current Age continues. In the case where the most popular Prophecy is a null entry, the Age is simply called “Ageless”. When the Age changes, the Deity who brought it about must make a post alerting the divine community of the new Age. When the current Age is sw"
