title = "BlogNomic: The First Dynasty of Raven1207"
description = "An online game of Nomic: the game in which changing the rules is a move."
full_description = "Thursday, March 06, 2025 Proposal: [Appendix] Let Names Be Names In the subrule “Names” of the Appendix rule “Clarifications”, add a new list item after the first list item:Within the Ruleset, a word or phrase cannot refer to the name of a gamestate entity unless the Rules explicitly define what name that gamestate entity has. To prevent, e.g., a team named “Winning” from being considered the Winning Team – it’s unclear from the current core rules whether or not this sort of thing works, but it would probably be better for the future if it clearly didn’t work. posted by ais523 at 06 Mar 2025 04:24:00 UTC Comments (7) Call for Judgment: Is it Winning if You Say So? If “Is the Oxford Comma Dead?” was enacted, the rest of this CfJ has no effect. Uphold the Story Post - Votable Matter “Kingmaker: Conditionally flavour text?” as a valid Kingmaker per the rule “Winning”. From the comments on the other CfJ, there’s a disagreement as to whether ais’ “Winning” Team is a Winning Team or the Winning Team. We might as well settle this concurrently with the other CfJ, since that will be the next debate. If the other CfJ is enacted and ais is forced to remove “Winning”, this becomes a moot point. posted by JonathanDark at 05 Mar 2025 23:23:00 UTC Comments (10) Call for Judgment: Is the Oxford Comma Dead? Set ais523’s Team to empty. In the rule “Teams” replace ” As a Weekly Action, a Meeple can set their Team to any string of between 3 and 20 alphanumeric characters, where this string is considered flavor text, as long as all of the following criteria are true” with the following: A Meeple’s Team is considered flavor text. As a Weekly Action, a Meeple can set their Team to any string of between 3 and 20 alphanumeric characters as long as all of the following criteria are true I think commas impart important meaning to a sentence, but nevertheless this CfJ is also rewriting the rule to make it more clear. Details in the comments. posted by JonathanDark at 05 Mar 2025 17:40:00 UTC Comments (14) Story Post: Kingmaker: Conditionally flavour text? The newly enacted “Teams” rule says “As a Weekly Action, a Meeple can set their Team to any string of between 3 and 20 alphanumeric characters, where this string is considered flavor text, as long as all of the following criteria are true:”. I attempted to set my Team to “Winning”. Because the following criteria are not all true, the team name is not considered flavor text (because the string contains the word “Winning”, which is one of the criteria for the name to not be flavor text). I am unsure whether the team name not being flavor text implies that I am in fact on the Winning Team. If so, this Kingmaker post is legal. If not, it isn’t. I think it would make sense to use this post to discuss whether the post is legal or not. posted by ais523 at 05 Mar 2025 17:02:00 UTC Comments (5) Monday, March 03, 2025 Proposal: Teamwork Makes the Dream Work Timed out, 4-1. Enacted by JonathanDark.Adminned at 05 Mar 2025 16:49:11 UTC Add a new rule named “Teams” as the first rule under “Dynastic Rules” and give it the following text: Each Meeple has a publicly tracked Team which is empty by default. If a set of Meeples each have the same non-empty Team, where this comparison is case insensitive, those Meeples are said to be on that Team and are considered to be on the same Team. A Meeple with an empty Team is never considered to be on a Team. When a Meeple sets their Team, they are said to Join that Team. As a Weekly Action, a Meeple can set their Team to any string of between 3 and 20 alphanumeric characters, where this string is considered flavor text, as long as all of the following criteria are true: * That string does not contain the word “Winning” or the name of any Meeple. * Setting that Meeple’s Team to that string would not result in more than 3 Meeples being on the same Team. * That Meeple was not already on a Team with any other Meeple. When a rule mentions the word “Team”, it applies to all Meeples on that Team. Any action that a Team can take or perform can be performed by any Meeple on that Team, and when a Meeple performs such an action, they are performing it on behalf of that Team. A rule that mentions the word “you” or “your” applies to the Team (and all of the Meeples on that Team) on whose behalf the action is being performed or the rule is being applied. In the rule “Teams”, add a subrule named “Placeholder Variables” with the following text: The variables defined in this rule cannot be affected by any dynastic rule other than this rule and cannot affect any action taken if that action is defined any dynastic rule other than this one. Each Meeple has three Tokens: a Small Token, a Medium Token and a Big Token. Each Meeple’s Token has a publicly tracked Position, which is a number that defaults to 1. Each Meeple has a publicly tracked numeric amount of Energy, which defaults to three times the Rounds. Each Meeple has a publicly tracked Dice Type, which can be any type of Sicherman Dice, defaulting to Blue and White Dice. Each Meeple’s Token has number of Kittens publicly tracked in The Island of Kittens that defaults to 1. Merging is an atomic action performed by a Meeple who is on a Team and has the following steps: * Optionally replace one or more of the values of that Team’s publicly tracked variables with the same-named values of that Meeple’s publicly tracked variables. * Optionally replace one or more of that Team’s Token’s values by that Meeple’s Token’s values, as long as the type of Token whose variables are being replaced are also the same between that Meeple and that Team. * Reset that Meeple’s publicly tracked variables and that Meeple’s Token’s publicly tracked variables to their default values. Any Meeple on a Team may post a Story Post - Votable Matter whose title starts with “Merge Matter” and is known as a Merge Matter. This is a votable matter on which only votes from Meeples on the same Team as its author are counted. If a Merge Matter has FOR votes from every Meeple on the same team as its Author, it can be enacted by any Admin; if it has an AGAINST vote from any of those Meeples, it can be failed by any Admin. The author of an enacted Merge Matter may perform Merging if that author has not performed a Merging before in this dynasty. In every dynastic rule except the rule “Teams” and the rule “Placeholder Variables”, replace the text “Meeples” with “Teams” and the text “Meeple” with “Team”. In the rule “Winning”, replace “A Team has achieved victory” with “A Team is considered to be the Winning Team”. In the same rule, add the following text: When a Team becomes the Winning Team, no Meeple may take any dynastic actions except for actions mentioned in this rule. Any Meeple on the Winning Team may post a Story Post - Votable Matter whose title starts with “Kingmaker” and is known as a Kingmaker. This is a votable matter on which only votes from Meeples on the same Team as its author are counted. If a Kingmaker has FOR votes from every Meeple on the same team as its Author, it can be enacted by any Admin; if it has an AGAINST vote from any of those Meeples, it can be failed by any Admin. The author of an enacted Kingmaker has achieved victory. Meeples on the Winning Team are strongly encouraged to play a game amongst themselves on Board Game Arena, posting the link to that game as a non-official blog post, and select the winner of that game as the Meeple who should make the Kingmaker post. This is more in line with the idea of a Team taking Turns rather than individual Meeples. A Team can transfer the variables of a Meeple on that Team to that Team’s variables, so that as Teams form up, they can take the best values of the members that have Joined, although this can only happen once per Meeple. posted by JonathanDark at 03 Mar 2025 15:38:00 UTC Comments (12) Sunday, March 02, 2025 Proposal: [Building Blocks] By Our Powers Combined Withdrawn. Failed by JonathanDark.Adminned at 03 Mar 2025 15:37:55 UTC Copy the rule “Declared Alliances” and its contents from the Building Blocks wiki page to a rule with the same name in the Building Blocks section. In the rule “Isles of BoardGamia”, add a subrule named “Alliances” with the following text: A set of Meeples who are each named in the other’s Alliance are considered to be in a Verified Alliance. A Meeple in a Verified Alliance with the Current Meeple may perform actions described in the rule “The Turn” on behalf of the Meeple who is the Current Meeple; whenever they do so, those actions are performed as if the Meeple who is the Current Meeple is performing them. This allows Meeples to join Alliances and effectively control each other’s Tokens and Turns, which should speed things up if some Meeples are willing to let others take Turns for them. The “Verified Alliance” option keeps Meeples from doing this maliciously to other Meeples; if you put a Meeple in your Alliance, you are consenting to let them control your Turn for the potential benefit of achieving victory with their help. posted by JonathanDark at 02 Mar 2025 04:18:00 UTC Comments (8) Proposal: International Law Reached quorum, 4-0 with 1 DEF and Monarchple voting FOR. Enacted by JonathanDark.Adminned at 03 Mar 2025 15:35:18 UTC In the rule “Island Local Rules”, in the second paragraph, at the end of the third sentence, add the following text: ; the exception to this is when a paragraph in a Local Rule starts with ‘’‘Treaty:’‘’, in which case the rest of the text in that paragraph is not flavor text and applies to all Tokens and all non-idle Meeples. In the rule “Forbidden Island Local Rules”, replace the text “Whenever a square’s color is changed from White to either Turquoise, Magenta, or Purple, add the name of that color to the end of the Path.” with the following text: ‘’‘Treaty:’‘’ Whenever the color of a square in Forbidden Island is changed from White to either Turquoise, Magenta, or Purple, the name of that color must be added to the end of the Path. In the rule “Hellapagos Local Rules”, before the text “The color of the squares with values”, add the text: ‘’‘Treaty:’‘’ As I was patching the Forbidden Island Local Rules, I realized that the rule about Island Local Rules being flavor text causes some problems in the cases where you actually want to enforce those rules for Meeples regardless of whether they have Tokens on that Island or not. Rather than junking up other rules with enforceable Island rules, I thought we could introduce the notion of a “Treaty” rule in the Island Local Rules that is not flavor text at any time. posted by JonathanDark at 02 Mar 2025 03:24:00 UTC Comments (4) Bigger, Better, Faster, More! Josh brought up a good point that this dynasty is a bit slow and dull. I’ve been already thinking about ideas to make it more interesting and kick up the pace. One thought is around free form turns. The problem is that we have first mover advantages with several of the mechanics having token on token action, and square coloring could be considered an advantage to get in first as well. Might have to re-envision some of those. Another thought is around teams, so that turns don’t take as long if anyone on the team can take them. The idea is to merge tokens so that the team owns the small, medium, and big token. A team victory would require the team to choose the Meeple among them to achieve victory, or there could be a Board Game Arena playoff between team members. These are very basic thoughts with little meat behind them. What’s on everyone else’s minds about this? posted by JonathanDark at 01 Mar 2025 21:19:00 UTC Comments (10) Darknight Falls Off the Board Darknight has been idled due to lack of activity for the past 7 days. Quorum remains unchanged at 5. posted by JonathanDark at 01 Mar 2025 16:48:00 UTC Comments (4) Friday, February 28, 2025 Call for Judgment: This Square Is Occupied Reached quorum, 6-0. Enacted by JonathanDark.Adminned at 01 Mar 2025 02:45:48 UTC Set the Kittens of Snisbo’s Medium Token to 1 (tracked in The Island of Kittens). Set squares 22, 23, and 17 to white and square 16 to purple. This seemed like the easiest way to reverse Snisbo’s illegal changing of white squares to purple when some of those squares were occupied by Tokens. Undoing any actions built on top of that seems too twisty to get exactly right, so I’m fine to leave it alone. If someone winds up exploiting the illegal purple squares before they get reverted, *shrug*. posted by JonathanDark at 28 Feb 2025 03:58:00 UTC Comments (9) More issues with coloring under tokens Snisbo’s recent turn attempted to color squares 22 and 23 purple, even though they both had (multiple!) tokens on them at the time I can’t find a rule that makes that legal (the action looks like it was meant to be “(The Island of Kittens) Spend 1 Kitten from a Token you control to set the colour of three white Squares on The Island of Kittens that do not contain any Tokens to purple.” but the squares contained tokens – is there another rule I’m missing)? If the action is illegal, I’m not sure what impact that has on Snisbo’s turn – the appendix says “One wiki update may contain one or more alterations, or one alteration may be split over multiple updates, as long as it is clear what is happening and the alterations are otherwise legal.”, but in this case the alterations weren’t otherwise legal, so does that cause the entire update to fail? As such, I’m not sure either a) what precisely happened to the gamestate as a result, nor b) how we should best fix things, if they are indeed broken. Does anyone have suggestions? posted by ais523 at 27 Feb 2025 19:56:00 UTC Comments (6) Proposal: A Study in Cartography Timed out, 3-0. Enacted by JonathanDark.Adminned at 01 Mar 2025 20:11:22 UTC In the rule “Forbidden Island Local Rules”, add the following to the first paragraph: Each Meeple has a publicly-tracked list named Map, which contains any number of “Turquoise”, “Magenta”, or “Purple”, and defaults to an empty list. There is a publicly-tracked list named Path, which contains any number of “Turquoise”, “Magenta”, or “Purple”, and defaults to an empty list. In the same rule, append the following text: Whenever a square’s color is changed from White to either Turquoise, Magenta, or Purple, add the name of that color to the end of the Path. A Meeple is Worthy of the Forbidden Island Gate if their Map matches any contiguous sequence of at least three colors (not required to be unique) of any part of the Path, in the same order as they appear in that part of the Path. In the rule “The Turn”, add the following as sub-bullets of the bullet “Phase 2”: * (Forbidden Island) [5] Once per Token you control on Forbidden Island per Turn, if that Token is on a black square and does not have a Status of Lost, you may move that Token to any red square on Forbidden Island. * (Forbidden Island) [5] Once per Token you control on Forbidden Island per Turn, if that Token is on a red square and does not have a Status"
