["https://blogroll.org/a-gentle-intro-to-rss"]
title = '"A Gentle Intro to RSS" - Blogroll.org'
description = "I talk about RSS feeds quite a bit — they’ve been around for decades and are one of the easiest (and best) ways to keep up with your favorite blogs. However, in the zeal of my love for it, I sometimes forget that not everyone knows what RSS feeds are, much less how to use them in the first place."
full_description = '''“A Gentle Intro to RSS”Ray6 Comments I talk about RSS feeds quite a bit — they’ve been around for decades and are one of the easiest (and best) ways to keep up with your favorite blogs. However, in the zeal of my love for it, I sometimes forget that not everyone knows what RSS feeds are, much less how to use them in the first place. Derek Kedziora (an Ukrainian blogger, no less!) beat me to the punch with his “gentle” missive on RSS and its purpose: RSS stands for really simple syndication, and that’s precisely what it does. RSS turns content into a feed. An RSS reader then checks feeds to see if there is new content. Let’s say I subscribe to 100 RSS feeds: a mix of blogs, newspapers, YouTube channels and forums. Each day I open up my RSS reader to see all of the new content from each of these feeds in one place. It’s a morning newspaper for the internet. He brings up a great point how RSS feeds are a very patient (and quiet) form of keeping up: There’s no FOMO. If I take a week off from my RSS reader, I don’t get any notifications begging me to come back. All of the content is sitting there waiting. The solitude of an RSS reader is a fresh relief from the unrelenting firehoses of social media. And you are free from the yoke of algorithms because *you* get to decide what to read. For more, including Derek’s recommended RSS readers and such, mosey on over to: A gentle intro to RSS ...if you grok this... share on twitter➟ or email➟ or SMS➟ 6 Comments Mike Rockwell / Reply Mike Rockwell mentioned this Article on initialcharge.net. Joe / Reply @ray Love the retro(?) design for your site there 🙂 Ray / Reply @MindOfJoe Thanks Joe! It was intention to be a throwback to old school web. ; ) Ami / Reply I never knew what RSS stood for, nor did I know it is really simple! Thanks for explaining it 🙂 Raymond Hines / Reply Yay! Glad to be of help to someone new to it! It’s a great tool. Holler if you have any further questions or need suggestions, I’d be happy to help. Take care, Ray Ami / Reply Thanks Ray, I appreciate it! Leave a ReplyCancel ReplyYour email address will not be published. Required fields are marked * Name * Email * Website Add Comment Post Comment Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post's permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post's URL again. (Learn More)'''
