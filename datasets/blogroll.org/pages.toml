["https://blogroll.org/blogs-are-the-soul-of-the-web"]
title = "Blogs are the soul of the web - Blogroll.org"
description = "One of the great things of wandering a sea of personal blogs is it feels as if I’ve been traveling through people’s backyards, living & dining rooms,"
full_description = '''Blogs are the soul of the webRay3 Comments One of the great things of wandering a sea of personal blogs is it feels as if I’ve been traveling through people’s backyards, living & dining rooms, bedrooms (some mischievously dark) and so forth in their uniquely beautiful minds. It’s so very inviting because you are entering deeply vulnerable realms of fellow humans from all walks of life. Often you’ll find yourself wading into their souls and therefore enriching your own soul. I believe this togetherness across spaces of bits isn’t a random accident of stumbling… It’s as if these blogs are carefully placed mines (minds?) scattered across a faded internet to jar us free from loops of mindless algorithms. Indeed, these mines blow us back into our humanness as a reminder of who we are and let us know we’re most definitely not alone in cyberspace (despite rumors to the contrary). Oh, the stories we all could tell… That’s what personal blogs do, sharing all flavor of stories with doors wide open in warm embrace of their words. ...if you grok this... share on twitter➟ or email➟ or SMS➟ 3 Comments Social webs of personal websites / Reply This Article was mentioned on thenewleafjournal.com Kay / Reply I enjoyed reading this. Especially this part “Often you’ll find yourself wading into their souls and therefore enriching your own soul.” It takes me back to one of my own journal entries. Journaling brings me back to a place of reflection and personal awareness. People always tell me that I give great advice and I tell them it’s because I journal. It’s the awareness that’s uncovered and then dissected. People naturally asking for advice from me has created a pretty decent community for me. It’s def not by coincidence that these events occur. Thanks for the post! -kay Likes Jeremy Cherfas Leave a ReplyCancel ReplyYour email address will not be published. Required fields are marked * Name * Email * Website Add Comment Post Comment Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post's permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post's URL again. (Learn More)'''
