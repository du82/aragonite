["https://blogroll.org/keeping-it-simple"]
title = "Keeping it simple - Blogroll.org"
description = "When I first built Blogroll.org I went big with a fancy home page, several explainer pages, boxes of links, a message board in lieu of comments and so forth. Fun and exciting times! But then… I noticed over the past few months I was slowly backing off posting new links, posts, etc."
full_description = '''Keeping it simpleRay4 Comments When I first built Blogroll.org I went big with a fancy home page, several explainer pages, boxes of links, a message board in lieu of comments and so forth. Fun and exciting times! But then… I noticed over the past few months I was slowly backing off posting new links, posts, etc. After taking some time off to meditate on why, I realized Blogroll.org became a psychic burden weighting on my shoulders with so many things to update. Ugh. It was no longer fun. So recently I simplified things by dumping extraneous pages, shutting off the message board and wiped out the front page by swapping it with the actual blogroll (where it should have been all along). Blogroll.org went back to the roots of a blogroll without the extra junk. Ahhhh… I can breathe easier and I don’t feel pressure anymore to keep so many things updated. It’s easy and fun again. This can very much apply to your own blogs and such. If you’re struggling to write, try to simplify the mission and bend your blog to where you are in the moment. (Ways to trim things down: Knock down the number of pages needing to be updated. Change up your posting cadence. Turn it into a micro blog or newsletter. Post your photos instead. Make it an informal journal, etc. Whatever makes it easy for you to share something.) Most of all, drop whatever preconceived notions you may have of the “right way” to blog. There is only one way — yours. Enjoy. That’s the key! ...if you grok this... share on twitter➟ or email➟ or SMS➟ 4 Comments amit / Reply @alongtheray keeping it simple always helps 👍🏽 Plus I completely agree, there’s only one “right” way to blog as you say. alongtheray / Reply @amit Amen to that! Just noticed your newsletter and it’s stopped. Good reasoning behind ending it, something we should always remember. amit / Reply @alongtheray Thank you, Ray! I am so glad the words could connect with you 👍🏼 😊 joe jenett / Reply joe jenett mentioned this Article on simply.jenett.org. Leave a ReplyCancel ReplyYour email address will not be published. Required fields are marked * Name * Email * Website Add Comment Post Comment Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); To respond on your own website, enter the URL of your response which should contain a link to this post's permalink URL. Your response will then appear (possibly after moderation) on this page. Want to update or remove your response? Update or delete your post and re-enter your post's URL again. (Learn More)'''
