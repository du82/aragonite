title = "comments - Blogroll.org"
full_description = "State of the Blogroll January 20, 2022Around every three months I run a link checker on Blogroll.org to see who’s fallen by the wayside or whatever changes there might be via URLs shifting ’n all. It’s how I keep the blogroll fresh and clean just for you! My observations from these scans: - An average of one or two blogs disappear completely during each cycle (i.e. their domain no longer works or the blog has been deleted). - While it’s fortunate to only lose a couple every few months, it’s always sad to see them go and they leave a hole in the blogverse. Like losing friends. - A large portion of redirect errors come from blogs changing their URLs (i.e. moving to new locations or changing the way they do links, etc.) and forgetting to also redirect their RSS feed. So don’t forget your RSS feed when you change things up, folks!Read More Be comment friendly May 27, 2021Comments, comments, comments... Some bloggers hate 'em. Some love 'em. It's a personal choice; there's no right or wrong to it. But if you're gonna do comments, you gotta go all in and do 'em right.Read More"
