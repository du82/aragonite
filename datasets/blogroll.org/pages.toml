title = "Un-Privacy notice - Blogroll.org"
description = "Here's the really honkin' long privacy terms of conditions:"
full_description = "Un-Privacy notice Here’s the really honkin’ long privacy terms of conditions: Blogroll.org’s website and emails do not employ any analytics or tracking or data collection methods/codes anywhere, anytime. That’s it. Don’t you wish other privacy TOSes were as simple and complete as this? Ah, if only… If yer wondering how I know Blogroll.org’s traffic levels, where folks are coming from, email open rates, etc.? I have no freakin’ idea and I’m okay with that. It’s actually quite liberating. You should try it, too. Besides way back in the beginning, websites had no clue either. Old school, baby!"
