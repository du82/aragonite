title = "Xavi's blog | Igalia from a non-tech perspective"
full_description = "Igalia will be at IBC 2016 Posted on August 22, 2016 by xavier castano Reply Do you work in the media, entertainment, broadcasting or content industry? If so, please join us at IBC2016, 9-13 September in Amsterdam. The IBC Exhibition covers fifteen halls across the Amsterdam RAI and hosts over 1,600 exhibitors spanning the creation, management and delivery of electronic and media entertainment. You will be able to meet us at our booth where we will be showcasing demos of our latest work in browsers. The demo of WebKit for Wayland, a new port of WebKit that is currently being upstreamed, on an IVI shell is especially worth checking out. Igalia will be in Hall 5, booth 19 so don’t miss your chance to attend and visit us! Find us on the interactive floorplan. Posted in Igalia | Leave a reply We’re proud to sponsor #Linuxcon North America and to celebrate the 25th anniversary of #Linux and #opensource! Posted on June 21, 2016 by xavier castano Reply LinuxCon North America and ContainerCon features 175+ sessions for developers, operators, users and other open source professionals with a range of content covering Linux, Containers, Cloud and much more! Join us in Toronto, Canada where you’ll experience: Bonus Content Day featuring Docker 101 lab and tutorials Co-located events such as CloudNativeDay, KVM Forum, Linux Security Summit, Open Source Storage Summit, and Xen Project Developer Summit 25th Anniversary of Linux Casino Royale Gala on Wednesday, August 24th Igalia will have a booth there so don’t miss your chance to attend and visit us! Posted in Uncategorized | Leave a reply Igalia sponsors LinuxCon and ContainerCon Japan 2016, the premier Linux Conference in Asia Posted on June 2, 2016 by xavier castano Reply Join us at LinuxCon + ContainerCon Japan! LinuxCon Japan is the premier Linux conference in Asia that brings together a unique blend of core developers, administrators, users, community managers and industry experts. It is designed not only to encourage collaboration but to support future interaction between Japan and other Asia Pacific countries and the rest of the global Linux community. ContainerCon also comes to Japan for the first time this year, after a successful launch in North America in 2015. New developments in Linux containers are driving the adoption of cloud and virtualization technologies in many industries and ContainerCon Japan will provide a platform for exhibiting the best work. My colleague Mi Sun Silvia Cho will be talking about WebKit For Wayland and we will show some nice demos about our Browsers, Graphics and Compilers experience in our booth in Tokyo next month. Posted in Free Software, Igalia | Leave a reply"
