["http://blogs.igalia.com/alex"]
title = "Some comments – foo bar baz"
description = "foo bar baz"
full_description = "2012 WebKitGTK+ hackfest After four years we all know the hackfest is wearing and interesting at the same time, long hacking days is the rule here. This year we got people attending from more companies and different parts of the world than ever: RedHat, Collabora, Intel, Samsung, Adobe and of course Igalia organizing the event. As usual we have spent four days at Igalia office in A Coruña working in multiple topics: Epiphany (new designs, solve pending issues for 3.8), release last stable version, WebKit2 support and API development for 3.8, graphics (2D canvas acceleration, threaded graphics coordination), compilation performance, JavaScript memory usage, a11y bug fixing, GStreamer 1.0 integration, CSSRegions and CSSExclusions support, libsoup bug fixing, etc. We talked about roadmaps, future features for the port and for the GNOME browser, which would help to define the work for the next year. I would like to thank everyone for attending and working so hard to keep making this WebKit port successful these years. And also the sponsors who make the event happen, if we continue growing next year maybe we would need a bigger venue. Author alexPosted on December 13, 2012Categories English, gnome, igalia, Uncategorized, webkit2, WebKitGTK+ European WebKit Hackathon Last week I attended the European WebKit Hackathon, the organization and the location were awesome (Bucharest). We had the opportunity to meet with other WebKit teams and know about their work and plans. Adobe, Samsung, Intel, University of Szeged and Igalia were there represented. And of course we spend time hacking in some topics where we could collaborate together. Considering all the specifications the Adobe people are pushing (CSS Regions, CSS Exclusions, CSS Shaders, etc.) it was a great opportunity to try some of their work in WebKitGTK+ and help them with some compilation and testing tricks in the port. I think we can continue helping with some of those specs and make WebKitGTK+ a good port for checking web framework new features. We also could catch up with Intel EFL hacker Dominik Röttsches. EFL port uses a lot of code from the WebKitGTK+ and our goals are quite similar so it is always good we can spend sometime hacking together. Ossy from the Szeged University explained their testing infrastructure and methods for the WebKitQt port, very interesting points about how to deal with a big project like WebKit. I would like to thank organization and I hope we can make it next year. Author alexPosted on September 26, 2012September 26, 2012Categories English, igalia, technology, Uncategorized, WebKitGTK+"
