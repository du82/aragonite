full_description = "GUADEC-ES publica el horario de sus ponencias Se acaba de publicar el horario de las ponencias y talleres de la GUADEC Hispana que se celebrará el Jueves 22 y Viernes 23 de Julio en la Facultad de Informática de Coruña. Finalmente ha sido posible dar cabida a las ponencias presentadas con un horario muy compacto y exigente tanto para ponentes como asistentes. No os olvideis de inscribiros en el registro antes de Domingo, 18 de Julio de 2010. Los contenidos de la GUADEC Hispana van a ser eminentemente técnicos y van a abarcar temáticas relevantes para la comunidad de GNOME como son los retos que plantea la nueva versión de GNOME 3.0, la accesibilidad de la plataforma (a11y) y la incorporación de nuevos desarrolladores a la comunidad. GUADEC tratará temas específicos de dispositivos móbiles como es el soporte de dispositivos mutitáctiles (multitouch), la adquisición de imágenes a partir de camaras (Gdigicam), la geolocalización (GeoClue) o la reproducción de objetos multimedia (Grilo). También se presentarán una aplicaciones de OCR (OCRFeeder), una herramienta traducción de software (Gtranslator) , un reproductor de música por internet (JaMp) o las nuevas librerías y apliación para navegar en la web (Webkit y Epiphany). Esta GUADEC Hispana también servirá para reflexionar sobre la GNOME Foundation y la evaluación del proyecto GNOME. La Guadec Hispana es organizada por GPUL y GNOME HISPANO gracias a los patrocinadores Igalia y OpenShine con la colaboración de la Facultad de Informática de la UDC, la asociación GHANDALF y la Secretaría Xeral de Modernización e Innovación Tecnolóxica de la Xunta de Galicia a través de Mancomun y la Fundación para o Fomento da Calidade Industria e o Desenvolvemento Tecnolóxico de Galicia Author txenooPosted on July 13, 2010Categories Free Software, Master SWL, Planet GNOME Hispano, Planet GPUL, Planet Igalia Se publica el programa y se abre el registro de la VII GUADEC-ES Ya están disponibles el programa y la inscripción de la VII GUADEC Hispana que se celebrará en la Facultad de Informática de A Coruña del 22 al 23 de de 2010.. La organización de la VII Guadec Hispana se complace en anunciar el programa de charlas, talleres, mesas redondas y actividades para los dos días de congreso. Este año contaremos con ponentes de España, Chile, Perú y Portugal. Si quereis conocer las últimas novedades del proyecto GNOME, teneis una cita obligada en la Facultad de Informática de la Universidade da Coruña. La inscripción está ya disponible a través de la aplicación de registro, y estará abierta hasta el 18 de julio, así que date prisa si quieres acudir, ya que las plazas son limitadas. Guadec-Es es organizada por GPUL y GNOME HISPANO gracias a los patrocinadores Igalia y OpenShine con la colaboración de la Facultad de Informática de la UDC, la asociación GHANDALF y la Secretaría Xeral de Modernización e Innovación Tecnolóxica de la Xunta de Galicia a través de Mancomun y la Fundación para o Fomento da Calidade Industria e o Desenvolvemento Tecnolóxico de Galicia El programa de este año incluye muchos temas interesantes para los asistenes que quieran conocer como empezar a participar en una comunidad de Software Libre como GNOME. Pero también permite conocer las últimas novedades del proyecto GNOME en cuanto a su apliación a tecnologías móbiles, estudios de su comunidad, mejoras en accesibilidad, las implicaciones de los nuevos navegadores o el soporte de los sistemas Multitouch, entre muchos otros temas. TALLER: Introducción a GNOME 2.30, Óscar García Amor, GPUL PONENCIA: The Evolution of GNOME: Who Writes GNOME?,Germán Póo-Caamaño, GNOME Foundation PONENCIA: Estado actual de la Fundación GNOME, Germán Póo-Caamaño, GNOME Foundation PONENCIA: Accessibilidad en GNOME: funcionamiento, estado actúal y futuro en GNOME 3.0″, Alejandro Piñeiro Iglesias , Igalia PONENCIA: GNOME 3 para desarrolladores, Carlos Garcia Campos,GNOME Hispano PONENCIA: Evaluando GNOME, Juanjo Marin, Junta de Andalucía PONENCIA:: GeoClue: Framework para el soporte de Geolocalización, Javier Fernández García-Boente, Igalia PONENCIA: GDigicam, Antía Puentes Felpeto, Igalia PONENCIA: Gtranslator: Caminando hacia la versión 2.0, Pablo Sanxiao,Ghandalf PONENCIA: Multitouch en tus apps, Carlos Garnacho,Lanedo PONENCIA:”WebKit & GNOME: I want to believe!”, Mario Sanchez Prada,Igalia TALLER/ PONENCIA:Cómo empezar a colaborar en GNOME, Javier Jardón, GNOME Foundation PONENCIA: GRILO: Easing integration of multimedia content in applications, Xabier Rodríguez Calvar,Igalia TALLER/ PONENCIA: Git it done! Introducción al control de versiones con git”, Mario Sanchez Prada,Igalia PONENCIA: JaMp – Un cliente para Jamendo, Simón Pena y Alumnos Máster Software Libre PONENCIA: Sesión espiritista: Epiphany en GNOME 3.0, Diego Escalante Urrelo,GNOME TALLER: Cómo ser hacker e ir a la universidad sin morir en el intento, Diego Escalante Urrelo, GNOME PONENCIA: Vala, un lenguaje para Gnome 3.0, Roberto Majadas, OpenShine PONENCIA: OCRFeeder , Joaquim Rocha, Igalia Esperamos contar contigo. Author txenooPosted on July 1, 2010Categories Free Software, Master SWL, Planet GNOME Hispano, Planet GPUL, Planet Igalia, spanishTags gnome, gnome hispano, gpul, guadec hispana, guadec-es"
