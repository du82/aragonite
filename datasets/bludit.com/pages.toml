["https://www.bludit.com/ja"]
title = "Bludit - フラットファイルCMS"
description = "Bluditは、あなたのWebサイトやブログが秒速で構築できるWebアプリケーションです。そして、完全に自由でオープンソースです。Markdownサポート。"
full_description = "Bluditは、コンテンツをJSON形式で管理します。データベースのインストールや設定をする必要はありません。 Bluditのサイトをを美しく、クールなテーマでカスタマイズしましょう。テーマは、公式サイトからダウンロードできます。 素晴らしいプラグインでBluditに機能を追加しましょう。プラグインは、公式サイトからダウンロードできます。 Bluditには、すべての検索エンジンとSNSでサイトランキングを上げるためのSEOツールが含まれています。 Bluditのコンテンツは、MarkdownとHTMLをサポートしています。また、MarkdownエディタとWYSIWYGエディタも提供しています。 Bluditは、ユーザーのセキュリティとプライバシー保護にも配慮しています。Bluditはユーザーを追跡しませんし、外部ライブラリやフレームワーク、その他リソースも使用していません。 必要要件やインストールガイド、How Toなどについては、ドキュメントをお読みください。 サポートが必要ですか? フォーラムやチャット、Github Issueから解決しましょう。"
