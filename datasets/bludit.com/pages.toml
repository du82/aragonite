["https://www.bludit.com/ru"]
title = "Bludit - миниатюрная файловая CMS"
description = "Bludit - это веб-приложение для создания собственного сайта или блога за считанные секунды, абсолютно бесплатная и с открытым исходным кодом. Имеется поддержка Markdown."
full_description = "Bludit использует файлы в формате JSON для хранения содержимого, вам не нужно устанавливать или настраивать базу данных. Настройте свой сайт с Bludit с красивыми и классными темами. Вы можете загружать темы с официального сайта. Расширьте функциональность Bludit с помощью удивительных плагинов. Вы можете скачать плагины с официального сайта. Bludit включает все необходимые инструменты SEO, чтобы улучшить ваш рейтинг во всех поисковых системах и социальных сетях. Bludit поддерживает Markdown и HTML-код для записей, также имеет Markdown редактор и WYSIWYG редактор. Bludit заботится о безопасности и конфиденциальности пользователей. Bludit не отслеживает и не использует внешние библиотеки, фреймворки и прочие ресурсы. Прочтите нашу документацию по требованиям, руководству по установке, инструкциям и т. д. Вам нужна поддержка? Вы можете связаться с нами на форуме, в чате или на Github."
author = "Diego Najar"
year_published = 2025
