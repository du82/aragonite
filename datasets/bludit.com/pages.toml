["https://www.bludit.com/de"]
title = "Bludit - Flat-File CMS"
description = "Bludit ist eine Web-Anwendung, mit der Du schnell und einfach eine eigene Website oder einen eigenen Blog einrichten kannst. Sie ist völlig kostenlos und Open Source."
full_description = "Bludit speichert die Inhalte in Dateien des Formats JSON. Du musst keine Datenbank einrichten und konfigurieren. Für deine Website stehen schöne und coole Themes zu Verfügung, die du von der offiziellen Website herunterladen kannst. Für die Erweiterung mit Funktionen gibt es tolle Plugins, die du von der offiziellen Website herunterladen kannst. Bludit enthält alle Tools, mit denen das Ranking bei Suchmaschinen und Veröffentlichen in sozialen Netzwerken optimiert werden kann. Bludit unterstützt Markdown und HTML-Code. Du kannst wahlweise einen Markdown- oder einen WYSIWYG-Editor verwenden. Bludit nimmt den Datenschutz und die Sicherheit ernst. Es speichert keine Daten von Besuchern und verwendet keine externe Dienste."
author = "Diego Najar"
year_published = 2025
