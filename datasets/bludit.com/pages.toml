description = "Bludit is a web application to build your own website or blog in seconds, it's completely free and open source. Markdown support."
full_description = "Bludit uses files in JSON format to store the content, you don't need to install or configure a database. Customize your Bludit powered site with beautiful and cool themes. You can download themes from the official site. Bludit incorporates all the SEO tools to improve your ranking in all the search engines and social networks. Bludit supports Markdown and HTML code for the content, also provide Markdown Editor and WYSIWYG Editor. Bludit takes care of the security and privacy of the users. Bludit doesn't track or uses external libraries, frameworks and other resources."
