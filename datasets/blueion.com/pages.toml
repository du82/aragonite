full_description = "From Kitchen to Mountain Top with Chad Gangwer Outpost A while back we sat down with Chad Gangwer, chef and co-owner of LTO Burger Bar, The HabiTap, and Southern Culture Kitchen & Bar here in Greenville. When not in the kitchen there’s a good chance you’ll find Chad on a mountain or trail somewhere, exploring and adventuring to refill the well. In this chat we talk about the call of the mountains, thinking up new menu items while hungry in the woods, going vegan, and some cautionary tales of getting way out there. Programming Note We sat down with Chad before the Coronavirus pandemic hit, so it’s safe to say things have changed a bit. Follow Chad’s restaurant channels to stay up-to-date on all changes regarding openings and availabilities as the situation continues to evolve. Show Links Websites – Southern Culture / LTO / HabiTap Instagrams – @wrenaissanceman / @southernculturegvl / @ltoburgersandbar / @habitapgvl Show Notes Guest – Chad Gangwer Host – Kyle Mensing Music / Audio Production – Nic Lauretano & Kyle Mensing Editing – Kyle Mensing Location – Outpost HQ / Theater Studios"
