["https://blueion.com/work/made-by-mountains"]
title = "Made By Mountains - Blue Ion"
full_description = "Work: Case Study Made ByMountains Building a destination brand for the mountains outdoor industry hub of the East. With unmatched natural assets and a community intimately engaged in the outdoors, Western North Carolina was known by those who know as the outdoor industry hub of the East. In 2020, we embarked on a collaboration with the Growing Outdoors Partnership to officially recognize the region’s near-perfect conditions to incubate businesses that serve and celebrate the outdoors. Capabilities Analytics, Measurement & Tracking Brand Strategy Brand Writing CMS Development Content & Social Marketing Identity Development Illustration Interactive Design & UX Marketing Strategy Website Development The Moment Launched by Mountain BizWorks with support from the Appalachian Regional Commission, this initiative was aimed to boost the economies and communities of WNC by leveraging outdoor recreation and natural assets. We were tasked with rallying stakeholders across 27 unique counties to reveal the very essence of the region–the qualities that stirred the hearts of locals, and had the power to draw in outdoor entrepreneurs and business leaders. Our Take After engaging with a wide spectrum of regional stakeholders and sorting through other primary and secondary research, we closed in on two defining concepts. Our first order of business–a campaign message that resonated with locals. If it didn’t feel genuine to those living and working in WNC, it would fail to connect and be nothing more than noise. Second, we had to honor the defining relationship between the land and people in WNC. That vibrant, nurturing spirit of Western North Carolina’s mountains that’s inseparable from that of the community. The Concept Naming was the first key step to bring this initiative to life. The Made by Mountains name and its defining premise energized local and business audiences, highlighting a lifestyle and a culture that is, quite literally, made by mountains. Identity & Design The story inspired all design and materials that followed and we landed on a simple, bold, logotype for Made x Mountains, with a color palette sampled from our mountain landscape. Materials The brand transitioned and grew into ongoing programming, led by the MxM team and celebrated by communities throughout the region. To set Made by Mountains up for success, we shaped and designed an email newsletter program, got social accounts and publishing up and running, created brand guidelines and a digital asset library for WNC-based outdoor recreation organizations to access branding materials, top quality photos, and video cuts. Brand Video We collaborated with Brevard-based filmmaker Tommy Penick to shoot, edit, and produce a short film that introduced the Made by Mountains story. Website Developed for the initiative’s launch, the Made by Mountains site featured long form editorial stories of individuals who work in WNC’s outdoor recreation industry and represent the community’s character and culture. The Outcome Since its May 2021 launch, the Made by Mountains program has taken on a life of its own in the region. This new brand united stakeholders across 27 counties and sparked a movement to grow outdoor economies in each and every county. It continues to grow through community programming, training, entrepreneurial support, events, content, and more. Up Next Leadership Councilon Legal Diversity Back in 2009, one visionary legal professional, Rick Palmore, decided to take a stand and began a journey to motivate and mobilize industry leaders. His vision? A legal profession as diverse as the nation it serves. View Case Study"
