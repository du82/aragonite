title = "Key West Boats - Blue Ion"
description = "The family-owned Key West Boats had been in business for three decades when they approached us to revamp the company’s base marketing materials. With a solid reputation for building quality boats at real-people prices, they had forged a bona fide business on word-of-mouth and repeat-customer business alone. But with an update to their headquarters and […]"
full_description = "Key West Boats Outpost The family-owned Key West Boats had been in business for three decades when they approached us to revamp the company’s base marketing materials. With a solid reputation for building quality boats at real-people prices, they had forged a bona fide business on word-of-mouth and repeat-customer business alone. But with an update to their headquarters and manufacturing facility in the works, the crew at Key West Boats recognized it was time to refresh their marketing materials—starting with a new website. So began our quest to understand the business at its core: What are Key West’s fundamental guiding values? Why are loyal Key West owners so crazy about their boats? We dove right in, starting with a tour of the facility and time on the water. Ultimately, we distilled the brand down to a simple truism: everyone deserves a chance to unwind on the water. With the fundamentals in place, it was time to bring the website to life. We enlisted the help of Paul King Photo to capture stills of the boats and sweeping shots of the South Carolina Lowcountry in all its breezy, marshy glory, and Vive Media video footage of folks getting out and enjoying that very landscape. The end result was a sharper brand presentation and a new website that celebrated Key West Boats’ storied history and genuine love of life on the water."
