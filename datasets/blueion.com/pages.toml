title = "The Blue Ion Blog | News and Updates"
full_description = '''Our Perspectives Does it get any better? [youtube=http://www.youtube.com/watch?v=ZT68NnsxCQc] After the atrocity of the basket of puppies post from yesterday, manliness returns to the blog with this ESPN clip from November 2001. The stage: a meeting of #3... Uncategorized Have A Nice Day In case you are feeling blue today, here's a basket of warm pupppies to cheer you up. Whatever Too Many Choices Back in 2004 psychology professor Barry Schwartz wrote an interesting book titled The Paradox of Choice where he argued that we're forced to deal with too many trivial choices in... Whatever 2 Sites Born Today Launched two new sites today......the latest edition of Arcadia Publishing's website/bookstore and a new site for Wassamassaw Plantation. Arcadia is the nation's leading publisher of local and regional history books... Whatever Addicted to the Interweb? A recent Stanford University School of Medicine study found that more than one out of eight Americans exhibit at least one possible sign of problematic Internet use. The findings are... Whatever Happy Halloween Birthday Rich's birthday and Halloween on the same day? Makes perfect sense. Here's a pic from the past....that's Rich playing the ruler. What will he be this year? Whatever Oldies But Goodies Dan Goodsell (solid name) has posted a great collection of vintage products/packaging for kids. Check it out. I used to crave these "Funny Face" packs. Nothing provided refreshment like imitation... Whatever In Your Face Identity "Cover The World" with blood red paint. Sherman Williams sports a rallying cry that demands attention. Here's a nice adaptation from Brad Askew, as posted on Threadless... Whatever And Then There Were Two… Stay tuned for news of the title fight......the winner of which will be crowned champeen of the world. Fan favorite RP is in prime position to score an "upset" over... Life AIGA INSHOW Awards Snake River Sporting Club, Turks & Caicos Sporting Club, Niki Leigh Spa and The Navy Yard websites won AIGA INSHOW awards last Thursday night. INSHOW is AIGA's South Carolina annual... Whatever «1...154155156157158159160161»'''
