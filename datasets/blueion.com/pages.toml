title = "LCLD - Blue Ion"
full_description = "Work: Case Study Leadership Councilon Legal Diversity If you need proof that one person really can make a difference, settle in for a story. Before the Leadership Council on Legal Diversity was founded, there was a major lack of diversity in the American legal profession. Back in 2009, one visionary legal professional, Rick Palmore, decided to take a stand and began a journey to motivate and mobilize industry leaders. His vision? A legal profession as diverse as the nation it serves. Rick—and the team he’s built—have ignited a movement that’s simply unstoppable, impacting over 15,000 careers—and counting. Capabilities Strategy Copy Workshop Brand Anthem Messaging Design Custom membership and CRM integration Website and application development Conference concepting & design Sub-brand development The Moment A pioneer in creating a more diverse and equitable legal industry, the Leadership Council on Legal Diversity (LCLD) prepared to take a bold leap in 2021. For the first time in their decade-plus of existence, they would evolve from a membership organization with a focus on talent development to demand its members make personal pledges and publicly commit to change-making through their Leaders at the Front initiative. This shift would trace an even more direct line to achieving LCLD’s mission and vision, as the change they always believed possible became a reality before their eyes. Our Take LCLD needed the strongest foundation possible to launch into its exciting next phase. In an intensive two-day strategy workshop, we hashed through their opportunities and challenges, what the next decade might bring, and what tools might aid both the growth of the organization and its members. Together, we determined that their brand story and messaging needed refining to better capture and convey LCLD’s energy and hope for the future. We also began the process of revamping their website, with a focus on streamlining content, elevating the existing design palette, and creating a custom membership and CRM integration. And this was only the beginning of a true partnership that continues to evolve and develop. The Outcome LCLD and its members often confront challenging topics—but the movement they’ve launched and the progress they continue to make is worth major celebration. We infused joy throughout every brand touchpoint—from bold copy and bright colors, to playful movement and animation, and engaging illustrations. And, with a network spanning legal professionals who represent some of the biggest household names to the most talented and dedicated law students out there, we showcased LCLD’s star power and impressive results wherever possible. The Concept A defining piece of writing to reveal LCLD’s true purpose, and serve as a rally cry for its team and greater community. Design We opted to keep LCLD’s logo mark in place and expanded upon their already-joyful color palette for a fresh, bold, and elevated take. Website Production When revamping LCLD’s website, our primary focus was streamlining its robust content, elevating the existing design palette, and creating a custom membership and CRM integration. Reinvigorating a visionary brand as it raises its stakes—and nears closer to achieving its mission. Up Next This is FAB Why does the hospitality industry have to feel like a boys club? That’s the question that kept surfacing in the mind of Randi Weinstein, the founder of FAB, when the event-turned-full-blown-movement was just a twinkle in her eye. View Case Study"
