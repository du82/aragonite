["https://www.blueion.com/blog/learning-resources"]
title = "Learning From The Comfort Of Your Couch - Blue Ion"
description = "Here at Blue Ion we’re big fans of staying curious, sharpening our skills (and learning new ones), and teaching those skills to others. In fact, “committed to teaching” is one of the four core tenants of our marketing philosophy.  Also here at Blue Ion we’re all working fully remote and living that self-isolation lifestyle. We’ve […]"
full_description = "Learning From The Comfort Of Your Couch Life Here at Blue Ion we’re big fans of staying curious, sharpening our skills (and learning new ones), and teaching those skills to others. In fact, “committed to teaching” is one of the four core tenants of our marketing philosophy. Also here at Blue Ion we’re all working fully remote and living that self-isolation lifestyle. We’ve been collecting a list of resources to help us sharpen our skills while in quarantine and wanted to share them. Most of these are free or running free access campaigns for the time being. So here is the Big Blue Ion List of Learning Resources. Master Your Tools Moz SEO academy – free with code “wegotthis” Google training Facebook Blueprint Supercharge Your Marketing Think With Google free courses Learn to Code SC Codes Free Code Camp Google Python Class Python for Everybody Kaggle Python course If you really want to go big, here is a list to DIY your own Computer Science degree Become a Robot Wrangler Google ML Crash Course Fast.ai Microsoft AI School Amazon ML course Like College, But On The Internet EdX Udacity – free access for 30 days Khan Academy Coursera – 100 paid courses available for free through May Skillshare – 2 months free Suddenly a Homeschool Teacher? These Might Help Overcoming Obstacles Khan Academy is also a great resource for kids Mental & Physical Health Down Dog – free premium access through 5/1 Nike Training Club – free premium access Oak Headspace 10% Happier Finally, check your local library website. You may have free access to sites like Lynda.com, language learning services, and other learning resources via your membership. Know of more great learning resources? Let us know in the comments!"
