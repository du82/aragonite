["https://www.blueion.com/blog/welcome-emily-storrow"]
title = "Hello, Emily Storrow - Blue Ion"
description = "Say hello to Emily Storrow, Brand Strategist and Editorial Manager. She has an impressive track record as a big-thinker with journalism chops and a collaborative spirit. As is customary at Blue Ion, Emily sat down for our investigative Q&A series so that everyone can get to know her better. Without further adieu… Hometown: Asheville, North […]"
full_description = "Hello, Emily Storrow Team Say hello to Emily Storrow, Brand Strategist and Editorial Manager. She has an impressive track record as a big-thinker with journalism chops and a collaborative spirit. As is customary at Blue Ion, Emily sat down for our investigative Q&A series so that everyone can get to know her better. Without further adieu… Hometown: Asheville, North Carolina. Pets: My boyfriend and I recently bought a house and inherited a stray cat named Margaret. We’ve never identified as cat people per se, but she’s chubby and hysterical and we are completely smitten. We’ve helped her discover her inner housecat. My mom also lives in the neighborhood with our family pet, a carolina dog named Roxy. She’s even more obsessed with Margaret than we are. What terrible movie deserves a remake? I think Star Wars episodes I-III deserve another look. Favorite outdoor pursuit: I grew up camping, hiking, and swimming in watering holes, and now that I live at the coast, I just love being out on the water in any shape or form. I’m also super into gardening at home, from growing vegetables to landscaping. Favorite indoor pursuit: Cooking! Sultry bowls of pasta and big weekend breakfasts are favorites. Favorite time of day: I love the transition from golden hour to sunset to dusk. Time almost slows down as you savor the last of the day’s light. You have to eat one food for the rest of your life, what is it? Tacos. Favorite Charleston area restaurant: FIG for an occasion dinner, Santi’s for everything else. What three words would your family/friends use to describe you? Passionate, peacekeeper, mumbler. What’s always in your refrigerator? Eggs, Topo Chico, limes, and american cheese (it’s a weakness). It’s 5:00 somewhere, what’s your drink order? Always love a negroni. And lately I’ve been really digging ranch water: Topo Chico, tequila, and lots of lime (per the above, ingredients that are always on hand). What celebrity parents do you wish you had? Philip Seymour Hoffman and…Sofía Vergara. What sound or noise do you love? Pre-COVID I might have said rain on a tin roof, but these days I’d give about anything for a rowdy college football stadium or live music. If you could choose only one song to play every time you walked into a room what would it be? Green Onions by Booker T. & the M.G.’s. I don’t think I could ever get tired of hearing it. Most recent concert: Sturgill Simpson with Tyler Childers. If you weren’t a writer, you’d be? I’ve always thought it’d be awesome to be a private chef."
author = "Ellen Schmedinghoff"
year_published = 2020
year_updated = 2025
