["https://www.blueion.com/career/paid-media-manager"]
title = "Paid Media Manager - Blue Ion"
description = "Blue Ion is looking for a Paid Media Manager Blue Ion is searching for a mid to senior level Paid Media Manager to join our team. Our dream candidate has 3-5+ years experience and can contribute immediately. Your focus will be optimizing paid media campaigns across ad networks (search, display, shopping, social, video, audio, etc.), […]"
full_description = "Paid Media Manager January 2025 Blue Ion is looking for a Paid Media Manager Blue Ion is searching for a mid to senior level Paid Media Manager to join our team. Our dream candidate has 3-5+ years experience and can contribute immediately. Your focus will be optimizing paid media campaigns across ad networks (search, display, shopping, social, video, audio, etc.), and we’ll expect you to demonstrate your expertise during the interview process. You can download the full job description here, or read on for a few specifics that we’re looking for. Some things you’ll need to know in this role Paid Media Management: You’ll help clients reach their goals with the daily management of paid media campaigns across multiple platforms, with a focus on Google Ads. With our larger marketing team as support, your tasks will span campaign planning and implementation, ongoing keyword/placement research and management, tracking, analysis and reporting, ongoing budget pacing, and more! Top-Notch Communication Skills: This is a client-facing role where your opinion and leadership is requested–and required. You will regularly present to clients, sharing campaign strategy and reporting wins, losses, and “where do we go from here.” Tracking & Analysis: You should be comfortable using Google Analytics 4, Google Tag Manager, and Google Looker Studio. You’ll use these tools to analyze and interpret data, and then make it simple for clients to understand. We live and die by data, so a passion for numbers is a must! Passion for Learning & Sharing: A passion for all things digital marketing is required. We (and our clients!) will expect you to be a domain area expert—staying on top of industry trends, best practices, emerging technologies, and ad platforms. What a top candidate will have Experience in the above list would be great, but we’re also interested in the right person that fits our core values. We’d love to learn what each of the below means to you: Takes the Initiative Creative Approaches Stokes the Fire Care for the Larger Cause Cultivates Understanding Sound like a perfect match? If you’ve read this far, congratulations. You have a greater attention span than 99% of all humans. Email your cover letter, resume and/or links and project samples to [email protected]."
