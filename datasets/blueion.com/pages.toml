full_description = "Join Our Crew Endless energy.Passionate people.Inspired work. Higher frequencies. We’re a full-service branding agency with crews in Charleston, Greenville, and Asheville. We are creatives, data drivers, problem solvers, and big-picture people working with a mix of national, regional, and local brands. Since 2000, we’ve worked to share the energy that brands are made of. If you’re into great work, inspiring workplaces, and making a positive impact in your community, let’s talk. If you’re into great work, inspiring workplaces, and making a positive impact in your community, let’s talk. Current Openings Paid Media Manager Mid-Senior Level View Job Listing WhatWe Believe 01 Care for the cause. Each project is an opportunity to help clients reach their goals, build their businesses, provide for their families and communities, and reach their higher-order purpose. 02 Build bridges. Clear, open, and honest communication is key–even and especially when challenges arise. 03 Dive in. Jump in and do the work that needs to be done, knowing that alongside you are a bunch of folks ready and willing to do the same. 04 Stay curious. Be brave enough and curious enough to embrace what’s different, take a fresh look at our work, and seek new ways of viewing the world. 05 Color outside the lines. There’s a special kind of fire and drive that inspires us to push boundaries and explore new territory. We go beyond where and what we think is possible."
