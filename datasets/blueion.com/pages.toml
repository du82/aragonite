["https://www.blueion.com/about"]
title = "About - Blue Ion"
full_description = "About Us Sharing The Energy We’re Made Of Blue Ion was founded on three guiding principles. Do great work for great people, create a better workplace, and have a positive impact in the communities where we live and work. We’re intentionally small—a band of subject matter experts who can solve the most complex problems, build just about anything, and have a grand time doing it. Our Team Meet the WizardsBehind the Curtain Adam Olejarczyk Digital Brand Manager Ansley Wyckoff Front-End Developer Arthur Guy Full-Stack Developer Bobby Jenrow Full-Stack Developer Brian Dadin Lead Developer Caroline Krenger Marketing Manager Casey Gold Paid Media Manager Chelsea Lawdahl Marketing Manager Chris Simpson Head of Agency Growth & Performance David Wood Partner, Creative & Film Director Ellen Schmedinghoff Director of Strategy & Content Emily Storrow Editorial Manager Erin Spencer Editorial Manager Greta Schumann Designer Hailey Stellmach Head of Production J Bush Designer Jason Gillespie Full-Stack Developer Julia Filo Senior Marketing Manager Krista Engler Art Director Kyle Mensing Marketing Services Director Megan Swanson Project Manager Nic Lauretano Creative Director Rich Yessian Partner, Technology Director Robert Prioleau Partner, Brand Director Tori Gipe Senior Producer Adam Olejarczyk Digital Brand Manager × Expert on all things destination marketing and making search engines happy. Hobbyist woodworker. Catch him cruising Charleston by boat or golf cart, preferably with chocolate lab Sam in tow. Ansley Wyckoff Front-End Developer × Front-end developer with a knack for animation and a sharp eye for design. Mom to a pup named Maeby (who obviously became a yes) and a son named Julian. Believes all roads lead to Rome (Georgia). Arthur Guy Full-Stack Developer × Blue Ion’s PST party of one. A leap year baby who just graduated to double digits. *Checks child labor laws*—yup, all good. Find him working behind the scenes on back-end dev work and backing the Kansas City Chiefs (long before the bandwagon). Bobby Jenrow Full-Stack Developer × Multi-tasking comes naturally for this dad of twins—as he switches seamlessly between front- and back-end dev work. Blue Ion’s resident expert in all things ADA compliance. A true outdoorsman, he met his wife while hiking the Appalachian Trail. Brian Dadin Lead Developer × Joined Blue Ion back in ’05. Endless lines of code, two kiddos, and a laundry list of launches later (we stopped counting), he’s still rocking—while building sites, apps, and our in-house dev team. Dabbles in video synth and concert visuals. Caroline Krenger Marketing Manager × Longhorns and long dogs. Runner of digital marketing campaigns and half marathons. Special skills include building high-performing email campaigns and brewing coffee strong enough to wake the dead. Casey Gold Paid Media Manager × Cornhusker who joined Blue Ion in 2010 as an intern and never left. Born opportunist, launched our Greenville office six years later and grew the marketing team along the way. An object in motion that stays in motion as a dad to three and avid CrossFitter. Chelsea Lawdahl Marketing Manager × Paid media maven who wades into the mysteries of analytics and leads clients through reporting calls that make the complex digestible. And all while managing the longest-known home reno to man, pup Tootie by her side. Chris Simpson Head of Agency Growth & Performance × Florida man who made it out without becoming a headline. The first face most clients meet in their Blue Ion journey, he translates big-picture vision into actionable projects. Usually in a plaid shirt. Outside of work, find him leading Scouts or blocking goals on the soccer field. David Wood Partner, Creative & Film Director × The design piece of the Blue Ion partner puzzle. Woody to friends. David to the government. Dad to Maddie and Avery. Known for legendary whiteboarding, a fierce Vikings fandom, and sporting tee-time-ready attire. Ellen Schmedinghoff Director of Strategy & Content × Rhody who found her way to Charleston for college and never looked back. Social butterfly, backyard dweller, occasional vegan. Taps her background as a PR pro as she leads Blue Ion’s strategy and writing efforts and helps clients articulate their true purpose. Emily Storrow Editorial Manager × Rare native Ashevillian, who arrived at Blue Ion by way of the editorial world. Thinks like a publisher. Asks questions like a reporter. Can pickle watermelon rinds, shuck oysters like a pro, and wrangle two cats and a dog and make it look easy. Erin Spencer Editorial Manager × Eagle-eye proofreader, deft storyteller, and journalist with a penchant for writing across mediums. Happiest with a cup of coffee and when planning her next trip. Ask her how she feels about the Oxford comma. Greta Schumann Designer × A young gun designer who never shies away from a challenge, Greta brings Blue Ion’s own brand to life, alongside the work we do for clients, on our socials (do her a solid and hit that follow). Minnesota native who flew south for Charleston’s sunnier skies. Hailey Stellmach Head of Production × The biggest small talker at Blue Ion. Head of the production team, she makes to-do lists like you’ve never seen and slays the status update. Off the clock, lives her best life at the brewery or on the slopes back home in Colorado. J Bush Designer × Just the one letter will do—unless you’re his mom or the IRS. Dynamic designer with a knack for illustrations who believes his best work is produced in his back shed. Lifelong surfer who reckons just one shark bite isn’t enough to call it quits. Jason Gillespie Full-Stack Developer × Full stack developer. Occasional full stack of pancakes eater with a ten-year track record as a programming perfectionist. When he’s not cranking out code, find him at a campsite, a music festival, or making his own tunes, drumsticks in hand. Julia Filo Senior Marketing Manager × Published poet, amateur potter, self-described SEO nerd. Can talk big-picture paid goals then dig deep into data to find needle-in-a-haystack intel that explains user behavior or campaign performance. Married her elementary school sweetheart. Krista Engler Art Director × Art director who sweats the small stuff and has a rich eye for color, Krista channels purpose and culture into creative. Plus, as a hobby seamstress, gardener, baker, and gal who knows her way around a campsite, you can rely on her in the next zombie apocalypse. Kyle Mensing Marketing Services Director × Mastermind of MarTech, architect of brand futures, leader of Blue Ion’s digital marketing department. No stranger to clever quips, most likely to make you laugh in the middle of an analytics report. Megan Swanson Project Manager × A team coach, sounding board, and air traffic controller all wrapped up in one cozy cardigan. Chief among her producer superpowers? Balancing budgets and the most valuable resources of all: bandwidth and brainpower. Nic Lauretano Creative Director × From beer cans to conservation logos, as creative director, Nic has designed it all and then some. Tinkers with type and textures during the workday, moonlights as a musician, and rides the tides the rest of the time. Rich Yessian Partner, Technology Director × The technology piece of the Blue Ion founder puzzle. Wears many skipper hats as he charts the course for all software, servers, and systems. Happiest at 10,000 feet while piloting shelter animals to their forever homes. Robert Prioleau Partner, Brand Director × The strategy piece of the Blue Ion founder puzzle. Equal parts sheepherder, planner, and therapist, he’s tasked with bringing out the best in brands. His “I’d rather be” stickers: on a bike or skis, trail running with dogs, sipping tequila, or sleeping in his van. All at once is a life goal. Tori Gipe Senior Producer × Resident astrologer and superstar producer who leads large-scale website builds by day, toddler negotiations by night. Always has a witty comment and the brief history of the latest pop culture saga at the ready. Our CuriousHistory Born in the year 2000, Blue Ion was the product of three burnt-out creatives who loved their work but knew it could be done differently. More life, less grind. Inspiring workspaces, less cubicles. True impact, less BS. The Start Of It All (2000) Three partners and an IKEA table Turtlenecks On The Beach (2005) The high or low (?) point of Blue Ion holiday cards Last Team Standing (2012) The final occupants of downtown Charleston’s old Cigar Factory building A New HQ (2014) Our official move into 301B, world headquarters for working and gathering Launching Outpost (2016) A team dedicated to reconnecting people to the natural world…in the natural world Total Eclipse of the Heart (2017) Gathered on the roof the day the sky went dark Westward Bound (2017 & 2021) More team (and more locations!) in Greenville and Asheville Want to work with us? If you’re into great work, inspiring workplaces, and making a positive impact in your community, let’s talk. View Careers"
