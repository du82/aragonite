title = "Board of Directors | Bluetooth® Technology Website"
description = "Guiding the Bluetooth SIG and Bluetooth Wireless Technology The Bluetooth SIG is led by an independent Board of Directors composed of one representative from each Promoter member company plus up to…"
full_description = "Guiding the Bluetooth SIG and Bluetooth Wireless Technology The Bluetooth SIG is led by an independent Board of Directors composed of one representative from each Promoter member company plus up to four Associate Member Directors (AMD). The primary responsibilities of the board include: Operational oversight, including approval of the annual budget, significant expenditures, and member fees Process oversight, including adoption of specifications, establishment of groups and committees, and approval of new specification work Strategic oversight, including approval of future plans, governing documents, and key agreements The board meets face-to-face once per quarter and via phone monthly. If you would like to see the details of all the board minutes, please visit our board minutes archive. Alain Michaud Chair of the Board of Directors Senior Staff Software Engineer and Connectivity Area Tech Lead​ Google LLC Michael Russell Vice Chair of the Board of Directors Advisory Engineer Motorola Mobility, LLC (a Lenovo Company) Magnus Olsson Secretary of the Board of Directors Standards Management, Group Function Technology​ Ericsson AB Katsumi Adachi, Ph.D. Chief Specialist, Corporate Technology Planning Division​ Toshiba Corporation Carlos Cordeiro Intel Fellow | Wireless CTO, Client Group​ Intel Corporation Haipeng Jin Chief Operating Officer Telink Semiconductor (Shanghai) Co., Ltd Antti Lappeteläinen Lead Architect, Local Area Technologies Nokia Corporation Brian Tucker Director, Wireless Engineering Apple Frank Yerrace Principal Architect, Azure Edge + Platform Microsoft Corporation Feedback​ The Bluetooth SIG welcomes all ideas and topics members wish to address. Please feel free to send your comments and ideas on strategy, vision and policy here."
