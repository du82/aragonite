["https://www.bluetooth.com/blog/auracast-broadcast-audio-is-heard-loud-and-clear-at-hlaa-2024"]
title = "Auracast™ Broadcast Audio Is Heard Loud and Clear at HLAA 2024Auracast™ ブロードキャスト オーディオ、HLAA 2024で大きな注目を集める | Bluetooth® Technology Website"
description = "Last week, a wide range of hearing health innovations were introduced at this year’s Hearing Loss Association of America (HLAA) Convention in Phoenix. The largest event of its kind…"
full_description = "July 1, 2024 Jason Marcel Auracast, Bluetooth LE, Broadcast, LE Audio Last week, a wide range of hearing health innovations were introduced at this year’s Hearing Loss Association of America (HLAA) Convention in Phoenix. The largest event of its kind, the HLAA brings together a unique mix of industry and technology experts to demonstrate the latest advances in hearing health care and assistive listening technology. One of this year’s show stealers at the convention was Auracast™ broadcast audio. Given its popularity last year at HLAA, as well as the big impact this new Bluetooth® capability made at other major events (Mobile World Congress, Computex, CES, and more), it’s no surprise that Auracast™ products and solutions continued to pique interest at HLAA 2024. New Assistive Listening Technology Auracast™ broadcast audio is a new Bluetooth capability that supports the broadcasting of an audio stream to an unlimited number of users simultaneously, and many analysts expect it to revolutionize public listening in the coming years. Auracast™ broadcast audio will let you share your audio, unmute public TVs, and hear your best out in the world. For example, imagine attending a conference and being able to tune into the audio of any speaker in the conference hall, hearing what they’re saying directly through your earbuds or hearing instruments with clear, high-quality audio that drowns out the distracting ambient noise of thousands of people talking around you. This year’s attendees had an opportunity to do just that. Auracast™ Workshops at HLAA 2024 Amongst the broad range of audio innovations being shared at HLAA 2024, the event provided several opportunities to allow attendees to explore Auracast™ broadcast audio firsthand, including an interactive workshop: Keeping Up With Progress and Deployment of Auracast™ Broadcast Audio. In this special pilot program, attendees got to see for themselves all the benefits Auracast™ broadcast audio can provide. Made possible by a partnership between Listen Technologies, Ampetronic, and GN ReSound with support from the Bluetooth Special Interest Group (SIG), this educational workshop gave attendees firsthand insight into Auracast™ broadcast audio, a new Bluetooth standard for broadcast audio and access to audio in public spaces. Representatives from those organizations discussed the Auracast™ pilot installation that HLAA attendees had a chance to try for themselves, as well as other ways they could experience Auracast™ broadcast audio, today. “We are honored to present at a workshop at this year’s HLAA Convention and to join Ampetronic, GN ReSound, the Bluetooth SIG, HLAA, and other advocates for the hearing loss community in showcasing technologies that increase accessibility to clear audio for everyone,” said Tracy Bathurst, chief technology officer at Listen Technologies. Three conference rooms at the venue were outfitted with Auracast™ transmitters. So, attendees who visited select booths were able to check out an Auracast™ receiver (hearing aid or earbud) and tune into sessions offered in those conference rooms via Auracast™ broadcast audio. “Everyone was impressed with the capabilities Auracast™ broadcast audio enabled,” said Kayla Myrhow, senior product marketing manager for the Bluetooth SIG. “Each of the three workshop rooms were outfitted with an AURI transmitter from Ampetronic and Listen Technologies, allowing attendees to use headphones with a receiver, or GN Resound Nexia hearing aids to listen and participate better in the workshops.” Products with Auracast™ support are available today, and this technology is being added to new hearing aids, cochlear implants, and consumer hearing devices. It is currently supported in many new smartphones, tablets, and TVs, and has been introduced in commercial transmitters and receivers for public spaces. NEW REPORT Auracast™ Broadcast Audio Retrofit Solutions and Opportunities This report by ABI Research delves into the opportunity for public spaces to offer new Auracast™ augmented audio experiences and enhanced assistive listening to its occupants and visitors by using cost-effective retrofit Auracast™ solutions, accelerating wider adoption of Auracast™ transmitters as well as receiver devices. SEE THE REPORT Auracast™ Broadcast Audio in the Real World Soon, Auracast™ broadcast audio will be available in many of the places you like to frequent. Evidence of the inevitability of Auracast™ adoption in public locations came last month in an announcement from Google. Anticipating rapid deployment of Auracast™ broadcast audio in a broad range of public spaces, Google announced they have added the ability for venues and businesses to indicate support for Auracast™ broadcast audio within their locations. And Google is not alone. Recently, Listen Technologies and Ampetronic as well as GN ReSound both announced the releases of their Auracast™ hearing aids. Listen Technologies and Ampetronics solution, Auri™ was designed as a complete, installed Auracast™ broadcast audio-based assistive listening solution that includes networked installation transmitters for multi-channel broadcast in any size space with the option for open or secure transmission. GN Hearing, recently launched its next-generation hearing aid family, ReSound Nexia. ReSound Nexia uses Auracast™ broadcast audio to connect, enabling people with hearing loss to benefit from this new advancement in audio connectivity. Beyond Assistive Listening In addition to providing a cutting-edge assistive listening solution, Auracast™ broadcast audio will also enable you to use your hearing instruments to fully enjoy televisions in public spaces, unmuting what was once silent and creating a more complete watching experience. In some places, it is common for multiple muted TV monitors to show various sports or programs at once, but the ambient noise can make it difficult to hear the commentary. Auracast™ TVs will allow you to use your smartphone to select the TV of your choice in these venues and listen via Auracast™ compatible earbuds, headphones, or any personal listening device. Where multiple TVs are present, you will be able to switch to the audio of another TV, selecting a new broadcast without a moment’s delay. Auracast™ broadcast audio will also let you share your audio in new ways. You’ll soon be able to invite friends and family around you to share in your personal Bluetooth audio experience. We’ve all been in situations where we’re using our earbuds to listen to music on our smartphone or watch a movie on our laptop, and we want someone we’re with to hear what we’re hearing without having to hand them take one of our earbuds. Or maybe we want to share our audio with someone who’s wearing a hearing instrument. Fortunately, smartphones, tablets, and laptops will soon add Auracast™ broadcast audio, so you’ll be able to let others around you use their Bluetooth earbuds or hearing devices to join in and listen to your personal audio experience. Learn more about this new Bluetooth® capability through The Auracast™ Experience, and see how Auracast™ solutions will enhance audio accessibility for all. FEATURED EVENT The Auracast™ Experience The Auracast™ Experience is a global series of immersive demonstration events that allow visitors to experience some of the ways Auracast™ broadcast audio will help our world sound better. LEARN MORE 6月、米国アリゾナ州フェニックスで本年度のHLAA（全米難聴者協会）の年次大会が開催され、聴覚健康に関する革新的な技術が数多く紹介されました。HLAAはこの分野では最大規模の大会で、業界のエキスパートや技術者が一堂に会し、聴覚ケアや聴覚補助技術に関する最新の進歩を披露しました。 本年の大会で特に注目を集めたのが、AuracastTM ブロードキャスト オーディオでした。昨年のHLAAでも人気を博したこの新しいBluetooth機能は、MWC（モバイルワールドコングレス）、COMPUTEX、CESなど他の主要イベントでも大きな反響を呼んでいました。そのため、AuracastTM関連の製品やソリューションがHLAA 2024でも引き続き高い関心を集めたのは、驚くべき事ではありませんでした。 革新的な聴覚補助技術 AuracastTM ブロードキャスト オーディオは無制限の数のユーザーに向けて同時にオーディオストリームをブロードキャストできるBluetoothの新機能です。多くのアナリストは、この技術が今後数年で公共の場での音声を聞く方法に革命をもたらすと予想しています。AuracastTM ブロードキャスト オーディオにより、オーディオ共有、公共の場にあるテレビのミュート解除、そして、どこにいても最高の音で聴くことが可能になります。 例えば、カンファレンスに参加した際、自分のイヤホンや補聴器を使い、周囲の何千人もの人の雑音をかき消すようなクリアな高音質の音声で講演者の話を直接聞くことができるようになります。本年のHLAA参加者は、まさにこの体験をする機会を得ました。 HLAA 2024の AuracastTMワークショップ HLAA 2024では様々な革新的オーディオ技術が紹介される中、参加者がAuracastTM ブロードキャスト オーディオを実際に体験できる、対話型ワークショップ「Keeping Up With Progress and Deployment of Auracast™ Broadcast Audio」（AuracastTM ブロードキャスト オーディオの進歩と展開に関する最新情報）が用意されました。この特別な試験的プログラムでは、AuracastTM ブロードキャスト オーディオがもたらすメリットを、参加者が直接体験することができました。 このワークショップはListen Technologies、Ampetronic、GN ReSoundの協力と、Bluetooth SIG（Special Interest Group）の支援のもとで開催されました。参加者は、音声のブロードキャストと公共の場での音声アクセスに関するBluetoothの新規格であるAuracastTM ブロードキャスト オーディオについて、じかに知ることができました。HLAAの参加者に用意されたAuracastTMを試せる試験的設備と、現時点でAuracastTM ブロードキャスト オーディオを体験できるその他の方法について、各社の代表が説明しました。 Listen Technologiesの最高技術責任者であるトレーシー・バサースト（Tracy Bathurst）は次のように述べています。「本年のHLAA年次大会でワークショップを開催し、Ampetronic、GN ReSound、Bluetooth SIG、HLAAおよび難聴者コミュニティを支援する他の各組織と共に、すべての人に明瞭な音声を届けるための技術を披露でき、大変うれしく思います」 会場内の3つの会議室にAuracastTM送信機が設置されました。参加者は特定のブースに行くことで、AuracastTM受信機（補聴器またはイヤホン）を借り、これらの会議室で進行中のセッションをAuracastTM ブロードキャスト オーディオで聞くことができました。 Bluetooth SIGのシニアプロダクトマーケティングマネージャーのケイラ・ミヤハウ（Kayla Myrhow）は、次のように述べています。「誰もがAuracastTM ブロードキャスト オーディオが可能にするさまざまな機能に、感銘を受けていました。3つの会議室にはAmpetronicとListen Technologiesが提供する送信機『AURI』が設置され、参加者は受信機を搭載したヘッドフォン、またはGN ReSoundの補聴器『Nexia』を使い、より良い音質でワークショップに参加することができました」 現在、AuracastTM対応製品は既に市販されており、この技術は新しい補聴器や人工内耳、消費者向けオーディオ製品に次々に搭載されています。多くの最新スマートフォン、タブレット、テレビがAuracastTMに対応しており、公共施設向けの業務用送信機・受信機にも採用が進んでいます。 実用化が進むAuracastTM ブロードキャスト オーディオ 近い将来、AuracastTM ブロードキャスト オーディオは人々が日常的に訪れる多くの場所で利用できるようになるでしょう。公共の場でAuracastTM採用が加速する兆しは、5月のGoogleによる発表にも見ることができます。Googleは、幅広い公共スペースでAuracastTM ブロードキャスト オーディオの展開が急速に進むことを見越して、施設や企業の検索結果に示される情報にAuracastTM ブロードキャスト オーディオ対応を示すことができる機能を追加したと発表しました。 このような動きはGoogleだけにとどまりません。先日、Listen TechnologiesとAmpetronic、GN ReSoundは、AuracastTM補聴器を発表しました。Listen TechnologiesとAmpetronicsのソリューション「AuriTM」は、AuracastTM ブロードキャスト オーディオに基づく設置型の聴覚補助ソリューションで、あらゆる規模のスペースに対応できるマルチチャネルブロードキャスト用のネットワーク送信機が含まれ、公開または非公開の送信を選択できます。 GN Hearingは先日、次世代補聴器シリーズ「ReSound Nexia」を発表しました。ReSound NexiaはAuracastTM ブロードキャスト オーディオに対応しており、難聴者がこの新たなオーディオ接続の恩恵を受けられるようになります。 聴覚補助を超えて 最先端の聴覚補助ソリューションの実現に加え、AuracastTM ブロードキャスト オーディオでは公共の場でミュート設定されているテレビの音を自分のオーディオ機器でミュート解除して聞き、以前は無音だったテレビの視聴をより完全な形で楽しむことができるようになります。場所によっては、複数のモニターで同時にさまざまなスポーツ中継やテレビ番組を無音で流していることが一般的ですが、こうした場合、解説者のコメントは周囲の雑音で聞き取りにくくなります。 こうした場所では、AuracastTM対応のテレビであればスマートフォンを使用して視聴したいテレビを選び、AuracastTM対応のイヤホンやヘッドホン、その他の機器で音声を聞くことができます。複数のテレビがある場合でも、別のテレビの音声を選択することで、一瞬の遅れもなく新たなブロードキャストに切り替えることができます。 さらに、AuracastTM ブロードキャスト オーディオは、これまでにない方法でのオーディオ共有を実現します。近くにいる友人や家族を招待して、自分が楽しんでいるBluetoothオーディオを共有できるようになります。スマートフォンの音楽やノートパソコンの映画をイヤホンで聞いているときに、自分のイヤホンを片方渡すことなく、一緒にいる人に同じ音声を聞かせたいと思った経験は誰にもあるでしょう。あるいは、補聴器を装着している人とオーディオを共有したい場合もあるかもしれません。 近い将来、スマートフォン、タブレット、ノートパソコンにAuracastTM ブロードキャスト オーディオ機能が追加され、周囲の人がそれぞれ自分のBluetoothイヤホンや補聴器を使って、同じオーディオ体験を共有できるようになります。 この革新的なBluetooth®︎機能については、AuracastTM Experienceで詳しく知ることができます。AuracastTM の各種ソリューションがいかにしてすべての人々のオーディオアクセシビリティを向上させるか、ぜひご確認ください。 Select Type... Blog Posts Member Blogs Books Infographics Papers Reports Videos Blog Posts Member Blogs Books Infographics Papers Reports Videos Paper A New Bluetooth® Audio Scan-to-Listen Experience Over the past few years, QR codes have made a major comeback for tasks… Learn More Video Communicating Supported Bluetooth® Functionality In this Snapshot from ABI Research, Bluetooth SIG’s senior manager, Avi Negrin, explains new… Watch Now Blog Post Everything you ever wanted to know about Bluetooth® LE Audio and Auracast™ broadcast audio Recently, Nick Hunn, chair of the Bluetooth SIG Hearing Aid Working Group, vice chair… Read More Blog Post Auracast™ broadcast audio: a major showstopper at CES 2025 For decades, CES has connected innovators, decision makers, media, influencers, visionaries, and customers across… Read More Book Introducing Bluetooth® LE Audio 2nd Edition Now available for free digital download, get your copy of this in-depth, technical overview of the LE Audio specifications. Learn More SIG Member Blog Post Japan and China are helping to shape the future of a connected experience Recently, the Bluetooth Special Interest Group (SIG) hosted its first in-person Tokyo Seminar since… Read More Blog Post The Switch from Bluetooth® Classic to Bluetooth® LE Audio Bluetooth® Classic has long been a staple of the audio market and isn’t going away… Learn More SIG Member Paper Communicating Supported Bluetooth® Functionality This guide offers recommendations for effectively communicating support for key aspects of Bluetooth technology. Learn More Blog Post Auracast™ Broadcast Audio Enables the Pioneering of Real-Time Language Translation SolutionsAuracast™ ブロードキャスト オーディオで実現する新世代の同時通訳ソリューション In an increasingly interconnected world, language barriers continue to pose significant challenges for global… Read More Video Auracast™ Broadcast Audio for Developers: Best Practices for Developing Transmitters, Receivers, and Broadcast Assistants for Public Locations Auracast broadcast audio technology will revolutionize how we experience audio. This interactive session will… Watch Now Video The Auracast™ PA System That Fits in Your Pocket Watch how Auracast™ broadcast audio enables a simple clip-on microphone to provide a high-quality… Watch Now Blog Post Crafting Innovative Auracast™ Devices from Concept to Compatibility If you haven’t heard of AuracastTM broadcast audio yet, it’s time to fully embrace it. This… Learn More SIG Member Infographic The Perfect Fit for an Auracast™ Retrofit Learn about Auracast™ broadcast audio retrofit solutions and opportunities. Learn More Blog Post Auracast™ - Hear, There and Everywhere Most everyone reading this enjoys the benefits of Bluetooth®. Providing short-range wireless point-to-point solutions… Learn More SIG Member Paper How to Build an Auracast™ Assistant This document covers the basic design principles for building an Auracast™ assistant, explaining the… Learn More Report 2024 Bluetooth® Market Update The 2024 Bluetooth® Market Update examines the direction and adoption of Bluetooth technology. Learn More Report Auracast™ Broadcast Audio Retrofit Solutions and Opportunities This report by ABI Research delves into the opportunity for public spaces to offer… Learn More SIG Member Infographic What's the Range of Auracast™ Broadcast Audio? Get the answer to the question everyone’s asking. Find out what the coverage area… Learn More Infographic Can You Add Auracast™ Support to Existing Devices? Are you waiting for native Auracast™ support? You might not have to. Find out… Learn More Report LE Audio: The Future of Bluetooth® Audio ABI Research outlines how the arrival of LE Audio is set to transform the Bluetooth audio ecosystem and the impact it will have on Bluetooth® audio market forecasts. Learn More"
