["https://www.bluetooth.com/blog/bluetooth-core-specifications-now-scheduled-for-bi-annual-release"]
title = "Bluetooth® Core Specifications now scheduled for bi-annual release | Bluetooth® Technology Website"
description = "For more than a decade, the Bluetooth Special Interest Group (SIG) typically released a new core specification every 18 months, timed with the completion of a major new Bluetooth® feature."
full_description = "February 27, 2025 Jason Marcel Bluetooth LE “This new cadence will ensure that incremental improvements and features can reach developers and manufacturers faster.” – Alain Michaud, the Bluetooth SIG Board of Directors For more than a decade, the Bluetooth Special Interest Group (SIG) typically released a new core specification every 18 months, timed with the completion of a major new Bluetooth® feature. While this approach was effective in enabling the delivery of transformative updates, it has also meant that other Bluetooth features, enhancements, and fixes had to wait until the completion of a major feature before being released. To address this, the Bluetooth SIG Board of Directors approved the release of two versions of the Bluetooth® Core Specification annually, starting in 2025. This more frequent release cycle, publishing two updates to the Bluetooth® Core Specification each year, will allow the introduction of completed features on a more consistent and frequent basis, ensuring faster innovation and continuous improvement. Bluetooth® Core Specification bi-annual release The Bluetooth® community supports a culture of continual innovation, striving to empower developers to bring features to market faster. A bi-annual release schedule will allow developers and manufacturers to access the latest Bluetooth improvements and features more quickly, powering wireless innovation and enhancing overall market responsiveness. “Moving to a bi-annual release cycle for the Bluetooth® Core Specification represents a pivotal step forward for the entire Bluetooth technology ecosystem,” said Alain Michaud, chair of the Bluetooth SIG Board of Directors. “This new cadence will ensure that incremental improvements and features can reach developers and manufacturers faster, fueling innovation and helping them meet the evolving needs of the market with greater agility.” Bringing Bluetooth solutions to market faster The Bluetooth SIG is committed to strengthening the future of wireless connectivity. This update not only signals a significant evolution in the Bluetooth SIG specification development process, but it also reflects the organization’s commitment to driving accelerated innovation and supporting the growing needs of the Bluetooth ecosystem. “By adopting this approach, we’re not just accelerating the development cycle — we’re also reinforcing the Bluetooth SIG’s commitment to continually strengthen the foundation for the future of wireless connectivity,” said Michaud. Increasing the frequency of releases will help reduce development timelines, enable quicker adoption of new features, and better align with growing market demand for Bluetooth® connectivity, empowering members to bring cutting-edge Bluetooth solutions to market faster than ever before. The first release under this new cadence is targeted for spring 2025. FEATURED COMMUNICATION GUIDE Communicating Supported Bluetooth® Functionality This guide offers a framework that defines Bluetooth communication elements, preferred terminology, and usage criteria established by the Bluetooth SIG for each element. It aims to achieve three goals: Encourage consistent public communication of supported Bluetooth functionality Help customers easily identify Bluetooth technology and capabilities in products Increase customer confidence that products are up to date with the latest Bluetooth technology Learn More Select Type... Blog Posts Member Blogs Books Case Studies Infographics Papers Reports Study Guides Videos Blog Posts Member Blogs Books Case Studies Infographics Papers Reports Study Guides Videos Blog Post Bluetooth® Core Specifications now scheduled for bi-annual release “This new cadence will ensure that incremental improvements and features can reach developers and… Read More Paper A New Bluetooth® Audio Scan-to-Listen Experience Over the past few years, QR codes have made a major comeback for tasks… Learn More Blog Post Why it is important to standardize commun