title = "Qualify Your Product | Bluetooth® Technology Website"
description = "Bluetooth Qualification Process Updates On 11 June 2024, The Bluetooth SIG Board of Directors adopted Qualification Program Reference Document (QPRD) v3. The new Bluetooth Qualification Process went…"
full_description = "Bluetooth Qualification Process Updates On 11 June 2024, The Bluetooth SIG Board of Directors adopted Qualification Program Reference Document (QPRD) v3. The new Bluetooth Qualification Process went into effect 1 July 2024. The new process is streamlined, resolves misalignments between governing and operational documents, and consolidates process documentation into a single document. For more details, please read QPRDv3 and view our frequently asked questions (FAQ). Bluetooth Qualification Process Overview The Bluetooth Qualification Process promotes global product interoperability and reinforces the strength of the Bluetooth® brand and ecosystem to the benefit of all Bluetooth SIG members. The Bluetooth Qualification Process helps member companies ensure their products that incorporate Bluetooth technology comply with the Bluetooth Patent & Copyright License Agreement and the Bluetooth Trademark License Agreement (collectively, the Bluetooth License Agreement) and Bluetooth Specifications. ALL Bluetooth® Products Must Be Qualified Your supplier or other member companies cannot qualify your products on your behalf, you must complete the Bluetooth Qualification Process for your product yourself You can only qualify your products under your member company’s account and only by completing the Bluetooth Qualification Process You will be charged a Product Qualification Fee for the first product submission that includes a specific design. Subsequent products you submit that include the same design will not be charged a fee. Please see our Schedule of Dues and Fees for more information You Should Check for Qualification if Reselling a Product If you are reselling another company’s product (not representing the product as your own), you should ensure that the company has completed the Bluetooth Qualification Process for the product You can check to see if a product has completed the Bluetooth Qualification Process by referring to the Qualified Product database The Bluetooth Qualification Process Must Be Completed Before You Take Products to Market A Bluetooth product must complete the Bluetooth Qualification Process on or before the date that you begin to sell or distribute the product The product name and model number you provide during the Bluetooth Qualification Process must match the product name and model number used when marketing, advertising, distributing, and selling your product If Your Products Do Not Complete the Bluetooth Qualification Process Products which appear to have not completed the Bluetooth Qualification Process may be impounded by customs’ authorities and will be subject to Bluetooth SIG enforcement actions Completing the Bluetooth Qualification Process The Bluetooth Qualification Process is defined by the Qualification Program Reference Document (QPRD) v3. To demonstrate that a product complies with the Bluetooth Specification(s), each member must for each of its products: Identify the product, the design included in the product, the Bluetooth Specifications that the design implements, and the features of each implemented specification Complete the Bluetooth Qualification Process by submitting the required documentation for the product under a user account belonging to your company The Bluetooth Qualification Process consists of the phases shown below: The Bluetooth Qualification Process is completed in our tool, Qualification Workspace. Qualification Workspace will walk you through each of the phases and help you determine the proper option for your product in the Specify the Design phase (see QPRDv3 Section 3.2 for more details). RESOURCES Qualification Program Reference Document (QPRD) v3 QUALIFICATION WORKSPACE Qualification Knowledge Base Bluetooth SIG Schedule of Dues and Fees"
year_published = 2025
