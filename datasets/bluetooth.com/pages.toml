description = "If you are new to the Bluetooth SIG, here is everything you need to know to get started with your membership. Membership is easy but understanding what you need to do may be a little complicated."
full_description = "If you are new to the Bluetooth SIG, here is everything you need to know to get started with your membership. Membership is easy but understanding what you need to do may be a little complicated. Most companies become members at the SIG in order to use the Bluetooth® license and brand on its product(s). This can be done easily by joining the SIG, qualifying your product, properly branding your product and going to market. But membership at the SIG can be more than that. There are a lot of benefits and advantages. Top 7 things to get the most out of your membership 1. Understand your benefits This page outlines what is available to Adopter and Associate members. 2. Learn more about the SIG and how it works Here are our governing documents including bylaws, policies, and membership agreements. 3. Build your product Here are resources to help you develop and test your Bluetooth® product. 4. Qualify your product If you’re ready to qualify your Bluetooth product, this is the place to start. 5. Brand your product Find the logos and the guidelines for using the Bluetooth brand. 6. Upgrade your membership Do you want even more benefits and cost savings? Upgrade to Associate membership. 7. Influence the future of Bluetooth technology Learn more about our working groups and how you can help shape the future of Bluetooth."
