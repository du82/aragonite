title = "Everything you ever wanted to know about Bluetooth® LE Audio and Auracast™ broadcast audio | Bluetooth® Technology Website"
description = "Recently, Nick Hunn, chair of the Bluetooth SIG Hearing Aid Working Group, vice chair of the Generic Audio Working Group, and a key contributor to the Bluetooth® LE Audio specifications…"
full_description = "February 5, 2025 Jason Marcel Audio, Auracast, Bluetooth LE, Broadcast, LE Audio, Multi-Stream Audio Recently, Nick Hunn, chair of the Bluetooth SIG Hearing Aid Working Group, vice chair of the Generic Audio Working Group, and a key contributor to the Bluetooth® LE Audio specifications, published a new edition of his book: Introducing Bluetooth® LE Audio. This updated version provides a detailed exploration of the evolution, design, and implications of Bluetooth® LE Audio and includes new information about features like Auracast™ broadcast audio. The second edition of this book provides: Real-world insights: Lessons learned from early implementations and real-world product launches, highlighting practical challenges and solutions Enhanced discussions of key features: Expanded and updated explanations of broadcast capabilities (including Auracast™ broadcast audio), flexible connection models, and efficient audio streaming methods New profile overviews: New chapters on the Public Broadcast Profile, Broadcast Audio URI, and Gaming Audio Profile (GMAP) to reflect recent specification updates The evolution of Bluetooth® LE Audio Bluetooth® LE Audio is a revolutionary advancement in wireless audio, expanding beyond Bluetooth® Classic Audio to support a dynamic, modular architecture designed for efficiency, scalability, and broader use cases. Initially conceived to enhance hearing aid technology, its scope expanded to cater to consumer audio needs, addressing certain limitations in Bluetooth Classic Audio around audio streaming and telephony. Bluetooth® LE Audio supports a range of new features and audio improvements, including Auracast™ broadcast audio – a groundbreaking Bluetooth feature that lets you share your audio, unmute TVs in public spaces, and hear your best wherever you go – and a high-efficiency Low Complexity Communications Codec (LC3) that delivers superior audio quality at reduced bitrates, optimizing battery usage without compromising fidelity. FEATURED DOWNLOAD Introducing Bluetooth® LE Audio 2nd Edition Download your free digital copy and find out how Bluetooth® LE Audio will change the way we design and use audio. FREE DOWNLOAD Who should download this book The Bluetooth® LE Audio set of specifications consists of over twenty documents. This book guides you through the specifications, illustrating how they work together and how to use them to develop innovative new applications. You should download this book if you are a: Developer who needs to understand the specifications Designer who wants to stay ahead with their audio products Technology strategist, investor, or analyst seeking to understand the market potential Manager who makes decisions about the next generation of audio opportunities The future of Bluetooth audio Bluetooth® LE Audio supports improved audio experiences via Auracast™ broadcast audio, standardizes hearing aid support, and provides a more flexible framework for faster innovation. As more devices continue to include Bluetooth® LE Audio, its role in reshaping the audio landscape is becoming evident, especially the impact Auracast™ broadcast audio will have on personal and public audio sharing applications. Download your free digital copy to learn how Bluetooth® LE Audio will change the way we design and use audio. FEATURED DOWNLOAD Introducing Bluetooth® LE Audio 2nd Edition Download your free digital copy and find out how Bluetooth® LE Audio will change the way we design and use audio. FREE DOWNLOAD Select Type... Blog Posts Member Blogs Books Infographics Papers Reports Videos Blog Posts Member Blogs Books Infographics Papers Reports Videos Paper A New Bluetooth® Audio Scan-to-Listen Experience Over the past few years, QR codes have made a major comeback for tasks… Learn More Video Communicating Supported Bluetooth® Functionality In this Snapshot from ABI Research, Bluetooth SIG’s senior manager, Avi Negrin, explains new… Watch Now Blog Post Everything you ever wanted to know about Bluetooth® LE Audio and Auracast™ broadcast audio Recently, Nick Hunn, chair of the Bluetooth SIG Hearing Aid Working Group, vice chair… Read More Blog Post Auracast™ broadcast audio: a major showstopper at CES 2025 For decades, CES has connected innovators, decision makers, media, influencers, visionaries, and customers across… Read More Book Introducing Bluetooth® LE Audio 2nd Edition Now available for free digital download, get your copy of this in-depth, technical overview of the LE Audio specifications. Learn More SIG Member Blog Post Japan and China are helping to shape the future of a connected experience Recently, the Bluetooth Special Interest Group (SIG) hosted its first in-person Tokyo Seminar since… Read More Blog Post The Switch from Bluetooth® Classic to Bluetooth® LE Audio Bluetooth® Classic has long been a staple of the audio market and isn’t going away… Learn More SIG Member Blog Post A Walk in the Park with Bluetooth® LE Audio From our long walks on the beach testing LE Long Range, to stealth testing… Learn More SIG Member Paper Communicating Supported Bluetooth® Functionality This guide offers recommendations for effectively communicating support for key aspects of Bluetooth technology. Learn More Video Auracast™ Broadcast Audio for Developers: Best Practices for Developing Transmitters, Receivers, and Broadcast Assistants for Public Locations Auracast broadcast audio technology will revolutionize how we experience audio. This interactive session will… Watch Now Video The Auracast™ PA System That Fits in Your Pocket Watch how Auracast™ broadcast audio enables a simple clip-on microphone to provide a high-quality… Watch Now Blog Post Crafting Innovative Auracast™ Devices from Concept to Compatibility If you haven’t heard of AuracastTM broadcast audio yet, it’s time to fully embrace it. This… Learn More SIG Member Infographic The Perfect Fit for an Auracast™ Retrofit Learn about Auracast™ broadcast audio retrofit solutions and opportunities