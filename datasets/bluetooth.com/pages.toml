["https://www.bluetooth.com/blog/japan-and-china-are-helping-to-shape-the-future-of-a-connected-experience"]
title = "Japan and China are helping to shape the future of a connected experience | Bluetooth® Technology Website"
description = "Recently, the Bluetooth Special Interest Group (SIG) hosted its first in-person Tokyo Seminar since 2019. This much-awaited return drew over 650 industry professionals both on site and online."
full_description = "January 24, 2025 Jason Marcel Audio, Auracast, Bluetooth LE, Broadcast, Channel Sounding, LE Audio, Location Services Recently, the Bluetooth Special Interest Group (SIG) hosted its first in-person Tokyo Seminar since 2019. This much-awaited return drew over 650 industry professionals both on site and online. The hybrid event marked a triumphant return to face-to-face networking while maintaining the accessibility that virtual participation offers. Spotlight on revolutionary Bluetooth technologies The seminar focused on two transformative technologies currently reshaping the wireless landscape — Auracast™ broadcast audio and Bluetooth® Channel Sounding — while also emphasizing new qualification processes tailored to local audiences. In front of packed on-site and online audiences, Bluetooth SIG Senior Director for APAC & China Lori Lee provided an overview of general Bluetooth technology trends and Auracast™ broadcast audio market expectations, while Bluetooth SIG Technical Marketing Director Damon Barnes and Bluetooth SIG Technical Marketing Engineer Gongyu Lu gave comprehensive explanations on Bluetooth® Channel Sounding. Nine representatives from leading Japanese member companies and organizations — AlpsAlpine, MCPC, Musen Connect, Nordic Semiconductor, NXP Japan, Silicon Labs, Sony, Toshiba, and TÜV Rheinland Japan — shared their extensive expertise and case studies, including multifaceted presentations covering Auracast™ broadcast audio and Bluetooth® Channel Sounding. The venue also offered Auracast™ broadcast audio, with a public Auracast™ transmitter broadcasting sessions for attendees to experience multilingual content delivery via their own Auracast™ enabled receivers. Technology leaders unite to help shape the future In the exhibition area, industry giants and innovative startups — Cear, Ellisys/Gailogic, Nordic Semiconductor, Silicon Labs, Teledyne LeCroy Frontline, and Toshiba — came together to demonstrate their latest developments, presenting cutting-edge solutions that showcased the expanding possibilities of Bluetooth® technology. Through live demonstrations of Auracast™ compatible speakers and simultaneous interpretation solutions, attendees were able to experience firsthand how Auracast™ broadcast audio is revolutionizing public and personal audio solutions. The event also supported several certification exhibitions hosted by TÜV Rheinland Japan and UL Japan, Japanese certification testing bodies and BQC. Other major companies and manufacturers included GN Hearing Japan, Harman, NTT Sonority, SamSung, Sennheiser, Sony, and Xiaomi showcased a wide range of Auracast™ device implementations, such as smartphones, earphones, and headphones, that demonstrated the steady growth of Auracast™ adoption while highlighting the Auracast™ broadcast audio’s potential to transform the world as we know it. Bluetooth Tokyo Seminar 2024 not only celebrated the return of in-person events, but it also marked a significant milestone in the evolution of wireless technology, setting the stage for exciting developments in the years to come. The unprecedented attendance and enthusiastic participation from both Japanese and international companies underscored the growing momentum behind next-generation Bluetooth® technologies in the Japanese market. The successful collaboration between member companies demonstrated the industry’s unified commitment to pushing the boundaries of wireless technology solutions. FEATURED INFOGRAPHIC The Perfect Fit for an Auracast™ Retrofit Learn about Auracast™ broadcast audio retrofit solutions and opportunities. SEE THE INFOGRAPHIC Strengthening global industry collaboration In addition to hosting the Tokyo seminar, a few months ago, a delegation from the Bluetooth Special Interest Group (SIG) visited China, highlighting the organization’s commitment to the Chinese market and fostering mutual growth. The visit facilitated valuable discussions with member companies and industry organizations, offering deeper insights into local market needs and strengthening partnerships to deliver enhanced support and innovation. Bluetooth SIG CEO Neville Meijets, CMO Ken Kolderup, and Director of Marketing/Business Development for APAC & China Lori Lee met with key organizations; including the China Communications Standards Association (CCSA) and the State Radio Monitoring Center – Testing Center (SRTC); leading Chinese enterprises, such as Huawei, Xiaomi, Vivo, and OPPO; and prominent domestic Bluetooth chip manufacturers like Jieli, Bluetrum, Goodix, Phyplus, BES, Telink, UNISOC, and Barrot. Discussions with the CCSA and SRTC provided valuable perspectives on the current landscape of wireless technology in China and its future development trends. Industry-wide interest and high expectations for Bluetooth technology underscored the significance of these engagements. The visit marked an important step in supporting the evolution of Bluetooth standards and regulations in China, aligning with the Bluetooth SIG’s mission to promote technological innovation and strengthen industry collaboration. Following the China trip, the Bluetooth SIG delegation visited Japan to meet with Japanese members Sony and the Japan Audio Society (JAS) as well as key associations the Ministry of Internal Affairs and Communications (MIC) and the Mobile Computing Promotion Consortium (MCPC). As with China, this visit fostered critical discussions with member companies and industry organizations, providing an in-depth perspective into Japanese market needs and giving the Bluetooth SIG leadership greater insight into how to best support Bluetooth innovation in the region. Building momentum for a wireless future The Bluetooth SIG has a long-standing commitment to support industry collaboration and growth across the APAC region. The delegation to China and the Bluetooth SIG’s involvement in supporting wireless innovation in Japan are only some of the manifestations of this commitment. The organization remains dedicated to expanding Bluetooth applications, strengthening partnerships with Greater China and Japanese members, and contributing to the growth of the global wireless communications industry. FEATURED INNOVATION Bluetooth® Channel Sounding Bluetooth® Channel Sounding is a new secure, fine-ranging feature that promises to enhance the convenience, safety, and security of Bluetooth connected devices. By infusing billions of everyday devices with true distance awareness, Bluetooth® Channel Sounding unlocks a world of possibilities for developers, freeing them to imagine and create innovative experiences. LEARN MORE Select Type... Blog Posts Member Blogs Books Infographics Papers Reports Videos Blog Posts Member Blogs Books Infographics Papers Reports Videos Paper A New Bluetooth® Audio Scan-to-Listen Experience Over the past few years, QR codes have made a major comeback for tasks… Learn More Video Communicating Supported Bluetooth® Functionality In this Snapshot from ABI Research, Bluetooth SIG’s senior manager, Avi Negrin, explains new… Watch Now Paper Bluetooth Channel Sounding Unlocks New Distance Ranging Applications Complementing its widespread use in healthcare, consumer, audio, industrial and numerous other applications, Learn More SIG Member Blog Post Everything you ever wanted to know about Bluetooth® LE Audio and Auracast™ broadcast audio Recently, Nick Hunn, chair of the Bluetooth SIG Hearing Aid Working Group, vice chair… Read More Blog Post Auracast™ broadcast audio: a major showstopper at CES 2025 For decades, CES has connected innovators, decision makers, media, influencers, visionaries, and customers across… Read More Book Introducing Bluetooth® LE Audio 2nd Edition Now available for free digital download, get your copy of this in-depth, technical overview of the LE Audio specifications. Learn More SIG Member Blog Post Japan and China are helping to shape the future of a connected experience Recently, the Bluetooth Special Interest Group (SIG) hosted its first in-person Tokyo Seminar since… Read More Blog Post The Switch from Bluetooth® Classic to Bluetooth® LE Audio Bluetooth® Classic has long been a staple of the audio market and isn’t going away… Learn More SIG Member Blog Post The advantage of Bluetooth® Channel Sounding The short-range wireless connectivity landscape continues to evolve at a rapid pace. Technologies such… Read More Paper Communicating Supported Bluetooth® Functionality This guide offers recommendations for effectively communicating support for key aspects of Bluetooth technology. Learn More Video What is Channel Sounding? Distance measurements via Bluetooth is getting a big improvement with the upcoming Channel Sounding… Watch Now SIG Member Video ABI Snapshot – How Bluetooth® Channel Sounding Will Shape the Future of Device Positioning In this Snapshot, ABI Senior Research Director Andrew Zignani and Bluetooth SIG’s Director of… Watch Now SIG Member Report How Bluetooth® Channel Sounding Will Shape the Future of Device Positioning This market research note explores how Bluetooth® Channel Sounding is set to transform wireless positioning technology by enabling secure, centimeter-level distance measurements. Learn More Blog Post Bluetooth® Core 6.0: What's New In The Latest Bluetooth Release? Bluetooth technology is constantly growing, not only enhancing existing applications but also enabling entirely… Learn More SIG Member Blog Post Taking Find My Applications to the Next Level with Telink Discover how Telink’s solutions enhance Find My applications with cross-platform compatibility and Bluetooth Channel… Learn More SIG Member Infographic The Perfect Fit for an Auracast™ Retrofit Learn about Auracast™ broadcast audio retrofit solutions and opportunities. Learn More Report 2024 Bluetooth® Market Update The 2024 Bluetooth® Market Update examines the direction and adoption of Bluetooth technology. Learn More Report Auracast™ Broadcast Audio Retrofit Solutions and Opportunities This report by ABI Research delves into the opportunity for public spaces to offer… Learn More SIG Member Infographic What's the Range of Auracast™ Broadcast Audio? Get the answer to the question everyone’s asking. Find out what the coverage area… Learn More Infographic Can You Add Auracast™ Support to Existing Devices? Are you waiting for native Auracast™ support? You might not have to. Find out… Learn More"
