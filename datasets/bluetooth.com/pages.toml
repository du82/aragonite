 of Bluetooth technology. Learn More Video What is Channel Sounding? Distance measurements via Bluetooth is getting a big improvement with the upcoming Channel Sounding… Watch Now SIG Member Report How Bluetooth® Channel Sounding Will Shape the Future of Device Positioning This market research note explores how Bluetooth® Channel Sounding is set to transform wireless positioning technology by enabling secure, centimeter-level distance measurements. Learn More Infographic The Perfect Fit for an Auracast™ Retrofit Learn about Auracast™ broadcast audio retrofit solutions and opportunities. Learn More Report 2024 Bluetooth® Market Update The 2024 Bluetooth® Market Update examines the direction and adoption of Bluetooth technology. Learn More Report Auracast™ Broadcast Audio Retrofit Solutions and Opportunities This report by ABI Research delves into the opportunity for public spaces to offer… Learn More SIG Member Case Study Revolutionizing Online Order Fulfillment: Managing Mis Shipments Discover how Wiliot, an ambient Internet of Things (IoT) pioneer, is revolutionizing the online… Learn More SIG Member Infographic What's the Range of Auracast™ Broadcast Audio? Get the answer to the question everyone’s asking. Find out what the coverage area… Learn More Infographic Can You Add Auracast™ Support to Existing Devices? Are you waiting for native Auracast™ support? You might not have to. Find out… Learn More Case Study Helping Sony Music Solutions Inc. (SMS) Create Memorable Concert Experiences with the FreFlow LED Light System When we talk about the things we missed during the shutdowns that were part… Learn More SIG Member Case Study Retail Pharmacy A leading retailer is collaborating with Wiliot, an ambient Internet of Things (IoT) pioneer,… Learn More SIG Member Study Guide Bluetooth® Technology for Linux Developers Learn how to use the interprocess communication system D-Bus and the BlueZ APIs to create Bluetooth applications for Linux computers. Learn More Study Guide Designing and Developing Bluetooth® Internet Gateways Learn about Bluetooth® internet gateways, how to make them secure and scalable, and design and implement your own... Learn More Study Guide The Bluetooth® LE Security Study Guide Learn about fundamental security concepts, the security features of Bluetooth Low Energy, and gain some hands-on experience using those features in device code. Learn More"
