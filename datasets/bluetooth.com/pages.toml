["https://www.bluetooth.com/blog/a-first-look-at-bluetooth-channel-sounding"]
title = "A First Look at Bluetooth® Channel SoundingBluetoothチャネルサウンディングの紹介 | Bluetooth® Technology Website"
description = "Over the last 25 years, we have seen Bluetooth® technology advance from a point-to-point connectivity solution for personal audio peripherals to support a complete network of low-power wireless…"
full_description = "August 14, 2024 Jason Marcel Access Control, Bluetooth LE, Broadcast, Channel Sounding, Connected Device, Direction Finding, Item Finding, Location Services Over the last 25 years, we have seen Bluetooth® technology advance from a point-to-point connectivity solution for personal audio peripherals to support a complete network of low-power wireless devices that help commercial and industrial environments maintain high levels of operational efficiency. The forthcoming update to the Bluetooth® Core Specification adds a new feature called Bluetooth® Channel Sounding. This feature allows developers to create an exciting range of products and applications that leverage the Bluetooth® Channel Sounding’s secure fine-ranging capability. What Is Bluetooth® Channel Sounding Bluetooth® Channel Sounding is the most recent addition to a set of Bluetooth® positioning features that enable one device to determine the presence, distance, and direction of another. This new feature enables secure, fine ranging between devices​ and: Is based on the well-proven method of phase-based ranging Supports multi-level security that mitigates the risk of wireless ranging attacks Enables high-accuracy distance measurement, bringing true distance awareness to Bluetooth® connected devices The new Bluetooth® Channel Sounding feature makes it possible to create products that can calculate the distance between two Bluetooth® devices with significantly better accuracy than could ever be produced using the RSSI and path loss first-generation method. It works in an entirely different way and includes a variety of security safeguards that mitigate various types of risk. The technical flexibility of Bluetooth® Channel Sounding means that developers can prioritize whichever aspect of ranging that matters the most, be it security, accuracy, or latency. Not all applications are the same and this has been recognized and catered for in the design of the Bluetooth® Channel Sounding feature. Developers have been given the freedom to decide what matters most to them and their users in the implementation of their products. Bluetooth Channel Sounding: A Technical Overview Recently, the Bluetooth Special Interest Group (SIG) released a new paper that provides an overview of Bluetooth® Channel Sounding and gives a technical perspective as to what developers can expect from this new Bluetooth feature. Bluetooth® Channel Sounding and the ability to perform secure fine ranging presents the opportunity to enhance the convenience, safety, and security of many Bluetooth® connected devices. Presence detection, course ranging, direction finding, and now fine ranging can each be used separately or in combination to create spatially aware products and applications that end users and business enterprises can benefit from. Check out Bluetooth® Channel Sounding: A Technical Overview to learn more. FEATURED PAPER Bluetooth® Channel Sounding: A Technical Overview This paper provides an overview of the forthcoming update to the Bluetooth® Core Specification. The update adds Bluetooth Channel Sounding, a new feature that enables secure fine ranging between two Bluetooth devices. LEARN MORE 過去25年の間に、Bluetooth®︎技術はパーソナルオーディオにおけるポイントツーポイント接続ソリューションから、商業・産業環境の高い業務効率の維持を支援する低消費電力ワイヤレスデバイスのネットワーク全体を支える技術へと進化してきました。 今後予定されているBluetoothコア仕様のアップデートでは、Bluetoothチャネルサウンディングという新機能が追加されます。この機能が持つセキュアな高精度測距能力を活用することによって、さまざまな製品やアプリケーションの開発が可能になります。 Bluetoothチャネルサウンディングとは Bluetoothチャネルサウンディングは、1台のデバイスから他のデバイスの存在検知と、デバイスまでの距離および方向の判定を可能する一連のBluetooth測位機能の中で最も新しい機能です。この新機能には、デバイス間のセキュアな高精度測距を可能にすることに加え、以下の特長があります。 実績ある位相ベース測距の手法に基づく 無線測距を悪用した攻撃のリスクを低減するマルチレベルセキュリティに対応 高精度距離測定で、Bluetooth接続されたデバイス間の真の距離把握を実現 新しいBluetoothチャネルサウンディング機能によって、2つのBluetoothデバイス間の距離計算を、RSSIとパスロスを使用する第1世代の手法で可能であった精度をはるかに超える精度で可能にする製品を実現できるようになります。Bluetoothチャネルサウンディングは従来とはまったく異なる手法を用い、さらには多様なリスクを低減するための各種セキュリティ対策も用意されています。 Bluetoothチャネルサウンディングは技術的に柔軟であるため、セキュリティ、精度、遅延など、測距において開発時に最も重点とする側面を自由に選べます。あらゆるアプリケーションには違いがあり、Bluetoothチャネルサウンディング機能はこの点を意識して設計が行われています。開発者は、自身やユーザーにとって何が最も重要であるか、製品の実装の中で決めることができます。 Bluetoothチャネルサウンディング：技術的概要 Bluetooth SIG（Special Interest Group）は先日、Bluetoothチャネルサウンディングの概要と、開発者がこの新機能に対して期待できることをまとめた新しいドキュメントを公開しました。 Bluetoothチャネルサウンディングと、そのセキュアな高精度測距を実現する能力によって、数多くのBluetooth接続デバイスの利便性、安全性、セキュリティを向上させる機会が生み出されます。存在検知、コース測距、方向検知、そして新しく登場した高精度測距は、空間認識ができる製品やアプリケーションの開発に個別または併せて使用することができ、エンドユーザーや企業に恩恵をもたらします。 詳しくは『Bluetoothチャネルサウンディング：技術的概要（Bluetooth Channel Sounding: A Technical Overview）』をご覧ください。 Select Type... Blog Posts Member Blogs Infographics Papers Reports Study Guides Videos Blog Posts Member Blogs Infographics Papers Reports Study Guides Videos Video Communicating Supported Bluetooth® Functionality In this Snapshot from ABI Research, Bluetooth SIG’s senior manager, Avi Negrin, explains new… Watch Now Paper Bluetooth Channel Sounding Unlocks New Distance Ranging Applications Complementing its widespread use in healthcare, consumer, audio, industrial and numerous other applications, Learn More SIG Member Blog Post Everything you ever wanted to know about Bluetooth® LE Audio and Auracast™ broadcast audio Recently, Nick Hunn, chair of the Bluetooth SIG Hearing Aid Working Group, vice chair… Read More Blog Post Auracast™ broadcast audio: a major showstopper at CES 2025 For decades, CES has connected innovators, decision makers, media, influencers, visionaries, and customers across… Read More Blog Post Japan and China are helping to shape the future of a connected experience Recently, the Bluetooth Special Interest Group (SIG) hosted its first in-person Tokyo Seminar since… Read More Blog Post The advantage of Bluetooth® Channel Sounding The short-range wireless connectivity landscape continues to evolve at a rapid pace. Technologies such… Read More Paper Communicating Supported Bluetooth® Functionality This guide offers recommendations for effectively communicating support for key aspects of Bluetooth technology. Learn More Blog Post Bluetooth® Channel Sounding will expand the market presence of distance awareness市場における距離認識の存在感を高めるBluetooth®チャネルサウンディング While we are in the early stages of adoption for Bluetooth® Channel Sounding, the… Read More Video What is Channel Sounding? Distance measurements via Bluetooth is getting a big improvement with the upcoming Channel Sounding… Watch Now SIG Member Video ABI Snapshot – How Bluetooth® Channel Sounding Will Shape the Future of Device Positioning In this Snapshot, ABI Senior Research Director Andrew Zignani and Bluetooth SIG’s Director of… Watch Now SIG Member Report How Bluetooth® Channel Sounding Will Shape the Future of Device Positioning This market research note explores how Bluetooth® Channel Sounding is set to transform wireless positioning technology by enabling secure, centimeter-level distance measurements. Learn More Blog Post Bluetooth® Core 6.0: What's New In The Latest Bluetooth Release? Bluetooth technology is constantly growing, not only enhancing existing applications but also enabling entirely… Learn More SIG Member Blog Post Taking Find My Applications to the Next Level with Telink Discover how Telink’s solutions enhance Find My applications with cross-platform compatibility and Bluetooth Channel… Learn More SIG Member Blog Post Bluetooth Channel Sounding Brings Crucial Ranging to New Bluetooth Devices The Bluetooth SIG has relentlessly pushed forward the capabilities and feature sets of the… Learn More SIG Member SIG Member Only Paper Bluetooth® Channel Sounding Communications Guide This communications guide includes Bluetooth® Channel Sounding key messages and positioning details. This document… Learn More Report Auracast™ Broadcast Audio Retrofit Solutions and Opportunities This report by ABI Research delves into the opportunity for public spaces to offer… Learn More SIG Member Infographic What's the Range of Auracast™ Broadcast Audio? Get the answer to the question everyone’s asking. Find out what the coverage area… Learn More Infographic Can You Add Aur