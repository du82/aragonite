["https://www.bluetooth.com/develop-with-bluetooth/qualify/qualification-test-tools/profile-tuning-suite"]
title = "Profile Tuning Suite | Bluetooth® Technology Website"
description = "Automate protocol and profile interoperability testing. The Bluetooth® Profile Tuning Suite (PTS) is testing software that automates compliance testing to the specified functional requirements of…"
full_description = "Automate protocol and profile interoperability testing. The Bluetooth® Profile Tuning Suite (PTS) is testing software that automates compliance testing to the specified functional requirements of Bluetooth Host Parts and specifications that reside above the Host Controller Interface (HCI). The vision of the product is to provide complete and validated test coverage, of all specified functional requirements in scope, to the Bluetooth development and testing community. IMPORTANT NOTICE: Test suites labeled with “_OLD” have been removed with the release of PTS v8.8.0. We recommend that you update your PTS Test Modules and PTS Workspace to utilize the updated versions and verify the operation of the test cases. Release Statement PTS v8.8.0 PTS 8.8.0 Now Available​​​​​ New Features & Support: Support for TCRL 2025-1 Support for the following group .Z releases (see PTS release notes for more details): Generic Audio WG Audio, Telephony, and Automotive WG Hearing Aid WG Support for IOPT Bug Fixes Multiple profiles (See PTS Release Notes for more details) Notice of Verdict Change: PTS v8.7.4 contains a change to “Inconclusive” verdicts. All “Inconclusive” verdicts have been changed to “Indecisive”. All instances of “INCONC” have been changed to “INDCSV”. Notice for IOPT Test Cases: The IOPT Test Suite contains test case IDs that reference one or more test cases from other specifications. Please reference the KB Article on this topic for more information. Upcoming Release(s): The following is planned for the upcoming release(s): TCRL Support Adopted profile support Prioritized bug fixes Download and Support: Profile Tuning Suite (PTS) and PTS Firmware Upgrade Software are free for all registered SIG members and are available for download here. PTS testing equipment (dongle) is required to enable testing of Bluetooth Specifications and your physical device. The following KB article explains the difference between PTS dongles, their supported features, and how to purchase them. For all support questions, please submit a PTS ticket here. PTS Firmware Upgrade Software PTS Firmware Upgrade Software v1.0.0 will enable appropriate dongle firmware upgrades as they are available for a given dongle version. Note: Laird Connectivity (LE-only) dongle does not come with PTS firmware pre-installed. To install PTS firmware, you will need to download the “PTS Firmware Upgrade Software” and complete the installation process. New Features: PTS Dongle Firmware Upgrade Support Support: PTS Firmware Upgrade Software is free for all registered SIG members and can be downloaded here. For all support questions, please submit a PTS ticket here. Notice Profile Tuning Suite (PTS) exposes multiple interfaces to automate qualification testing. Included in the package are: ImplicitSend API PTSControl API ETSManager API Click here to download a zip file. Please note Windows 7 is no longer a supported operating system for PTS since Microsoft has discontinued product support. Please contact Microsoft for appropriate system upgrade recommendations."
