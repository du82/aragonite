["https://www.bluetooth.com/develop-with-bluetooth/marketing-branding/brand-enforcement-program"]
title = "Brand Enforcement Program | Bluetooth® Technology Website"
description = "Protecting the Bluetooth Brand for All Members Only members of the Bluetooth SIG are licensed to use the Bluetooth word mark, figure mark, and combination mark (collectively, the “Bluetooth Trademarks”…"
full_description = "Protecting the Bluetooth Brand for All Members Only members of the Bluetooth SIG are licensed to use the Bluetooth word mark, figure mark, and combination mark (collectively, the “Bluetooth Trademarks”), as agreed to in the Bluetooth Trademark License Agreement. Members may use the Bluetooth Trademarks in association with their products and services, as well as in association with their company to promote their membership in the Bluetooth SIG. When the trademarks are used in association with a product, that product must have undergone and properly completed the Bluetooth Qualification Process. In addition, any usage of the Bluetooth Trademarks must be in accordance with the Brand Guide for Bluetooth Trademarks. To protect the Bluetooth Trademarks, the Bluetooth SIG administers an enforcement program with two primary areas of activity. The first area is focused on when the Bluetooth Trademarks can be used. For example, ensuring their use only in association with properly qualified products. The second area is focused on how the Bluetooth Trademarks are used, ensuring their use is in accordance with the Brand Guide for Bluetooth Trademarks. Bluetooth SIG brand enforcement actions come from three primary sources including the Bluetooth SIG itself, Customs Agencies, and Bluetooth SIG member companies. Monitoring by the Bluetooth SIG The Bluetooth SIG monitors online marketplaces and company websites to ensure that only member companies are using the Bluetooth Trademarks, that usage is only in association with properly qualified products, and that usage is in accordance with the Brand Guide for Bluetooth Trademarks. NOTE: In situations where the Bluetooth SIG has identified a product listed on an online marketplace that is using the Bluetooth Trademarks but is not listed in the Qualified Product database, the Bluetooth SIG will notify the company listing the product to either remove the listing or to complete the Bluetooth Qualification Process for that product. If one of those actions is not taken within a reasonable period, the Bluetooth SIG will take action to remove the product listing from the marketplace. The most recent version of the Bluetooth Board of Directors approved enforcement policy that relates to the inappropriate use of Bluetooth Trademarks in association with member products that have not completed the Bluetooth Qualification Process can be found here. Monitoring by Customs Agencies The Bluetooth SIG maintains relationships with various customs agencies. These agencies monitor imports for the inappropriate use of the Bluetooth Trademarks. If a customs official is unable to locate a product that is using the Bluetooth Trademarks in the Qualified Product database, they may hold the shipment until they can confirm with the Bluetooth SIG that the product is authorized for such use. If confirmation is not obtained, the customs agency may destroy the products. If you are notified of a shipment being held in customs as a result of a Bluetooth brand enforcement action, please contact the Bluetooth Brand Manager. Monitoring by SIG Members Bluetooth SIG member companies are a major source of information for the brand enforcement program. If you are a member and suspect a commercial product using the Bluetooth Trademarks is not properly qualified, please report it here for further investigation. In addition, if you identify any usage of the Bluetooth Trademarks that you believe to be not in accordance with the Brand Guide for Bluetooth Trademarks, please report it to the Bluetooth Brand Manager for further investigation."
year_published = 2025
clearnet = "https://www.bluetooth.com/develop-with-bluetooth/marketing-branding/brand-enforcement-program"
