title = "Build Your Product | Bluetooth® Technology Website"
description = "Are you ready to develop with Bluetooth? If you’re ready to develop a Bluetooth® product, we can get you started with information and resources that will make the job of building with Bluetooth…"
full_description = "Are you ready to develop with Bluetooth? If you’re ready to develop a Bluetooth® product, we can get you started with information and resources that will make the job of building with Bluetooth wireless technology faster and easier. Core Specification Technical Overviews These technical overview papers summarize and explain the features and updates introduced in recent Bluetooth®️ Core Specification releases. Paper Bluetooth® Core 6.0 Feature Overview Bluetooth® Core 6.0 includes several feature enhancements. This paper provides an overview of each… Learn More Paper Bluetooth® Core 5.4 - Technical Overview This feature overview summarizes and explains the updates introduced in Bluetooth®️ Core Specification v5.4,… Learn More Paper Bluetooth® Core 5.3 Feature Enhancements Bluetooth® Core Specification v5.3 includes several feature enhancements with the potential to improve reliability,… Learn More Paper Bluetooth® Core 5.2 Feature Overview This document summarizes and explains the three primary updates in Bluetooth® Core Specification v5.2.… Learn More Paper Bluetooth® Core 5.1 Feature Overview Bluetooth® Core Specification v5.1 introduces a series of updates to the Bluetooth® Core Specification. This document provides a summary and detailed explanation of each change. Learn More Paper Bluetooth® Core 5.0 Feature Enhancements Learn how new features introduced in Bluetooth® Core Specification v5.0 significantly increase the range, speed, and broadcast messaging capacity of Bluetooth applications. Learn More Study Guides The Bluetooth SIG provides Study Guides designed to help developers get up to speed quickly on various Bluetooth capabilities. Study Guide Bluetooth® Technology for Linux Developers Learn how to use the interprocess communication system D-Bus and the BlueZ APIs to create Bluetooth applications for Linux computers. Learn More Study Guide Designing and Developing Bluetooth® Internet Gateways Learn about Bluetooth® internet gateways, how to make them secure and scalable, and design and implement your own... Learn More Study Guide The Bluetooth® LE Security Study Guide Learn about fundamental security concepts, the security features of Bluetooth Low Energy, and gain some hands-on experience using those features in device code. Learn More Study Guide How to Make Wearables Bluetooth Mesh Provisioners Learn how to create applications for smartwatches and other platforms that can monitor and control nodes in a Bluetooth mesh network. Learn More Study Guide An Introduction to Web Bluetooth Provides foundation-level information and hands-on labs that walk you through using Web Bluetooth APIs. Learn More Study Guide An Introduction to the Bluetooth Mesh Proxy Function Learn how to create applications for smartphones and other platforms which can monitor and control nodes in a Bluetooth mesh network. Learn More Study Guide An Introduction to Bluetooth Mesh Software Development Learn the theory and practice of Bluetooth mesh device software development, and create a working mesh network. Learn More Study Guide An Introduction to Bluetooth® LE Development Provides foundation-level information and hands-on labs that walk you through assembling a Bluetooth Low Energy device. Learn More Study Guide An Introduction to Bluetooth Beacons Learn how to build your own Bluetooth beacon or integrate beacon technology into your existing products and apps. Learn More View All View All Study Guides Training Videos These videos will help you gain a deeper understanding of Bluetooth technology. Video Bluetooth Low Energy Fundamentals The Bluetooth Low Energy (LE) Fundamentals Course is designed to give you the knowledge… Watch Now SIG Member Video Everything You Need to Know About Bluetooth 5.4 Bluetooth 5.4 introduces support for bi-directional, large-scale, one-to-many networking, driven by wireless standardization needs… Watch Now SIG Member Video Bluetooth Development Training: Works With 2022 The role Bluetooth has played, and will continue to play, in the evolution of IoT… Watch Now SIG Member Video Bluetooth Direction Finding Training This training video explains how Bluetooth direction finding brings a new dimension to indoor… Watch Now SIG Member Video Bluetooth Brand Use Quick Tips and Tricks Watch this brief video for some quick tips about how to use the Bluetooth… Watch Now Video Hands-On Debug of an LE Audio Stream Join Ellisys for a 30-minute informative webinar to learn about Bluetooth LE Audio and… Watch Now SIG Member Video High Accuracy Distance Measurement Demo For Keyless Entry Systems In this technology demo Lambda:4 shows their phase based ranging with a standard Bluetooth… Watch Now SIG Member Video Bluetooth Mesh for Building Automation Demo Discover how you can extend Bluetooth connectivity with TI Bluetooth Mesh in this demo. … Watch Now SIG Member Video A Technical Overview of LC3 An in depth look inside the Low Complexity Communications Codec (LC3) and the benefits… Watch Now Video Car Access With TI Connection Monitor Learn how the TI Connection Monitor is used to monitor Bluetooth Low Energy communications… Watch Now SIG Member Video What’s New in Core Spec Version 5.2 Watch this technical overview of the new features introduced in version 5.2 of the… Watch Now SIG Member Video 5 Things You Don’t Know About Bluetooth Range From frequency hopping to forward error correction, watch Mohammad Afaneh share some things you… Watch Now Video Intro to Bluetooth Addresses and Privacy Learn about Bluetooth Addresses and the role they play in protecting the privacy of… Watch Now SIG Member Video Intro to Bluetooth Low Energy Coded PHY Learn more about one of the key features introduced to Bluetooth — the LE… Watch Now SIG Member Video Intro to Web Bluetooth Web Bluetooth is an exciting new advancement in Bluetooth Low Energy development. Watch to… Watch Now SIG Member Video Intro to Bluetooth Beacons Learn more about the most popular BLE application — Bluetooth Beacons. Topics covered in… Watch Now SIG Member Video Intro to Bluetooth Direction Finding Learn about the most important feature introduced in the latest version of the Bluetooth… Watch Now SIG Member Video Intro to New Features in Bluetooth Core Specification v5.1 Learn what’s new in the most recent release of the Bluetooth core specification. Topics… Watch Now SIG Member View All View All Training Videos Additional Technical Overviews The Bluetooth SIG makes available overview papers on the latest advancements to Bluetooth technology. Paper Receiver Blocking Resilience Testing The Bluetooth SIG is soliciting member test results verifying the receiver blocking resilience of… Learn More SIG Expert Group Paper Bluetooth® Channel Sounding: A Technical Overview This paper provides a detailed technical overview of Bluetooth® Channel Sounding, a secure fine ranging… Learn More Paper The Bluetooth® Mesh Primer An introduction and explanation of important Bluetooth® Mesh concepts. Learn More Paper Low Energy Audio – Basic One-Way Unicast Audio This document gives an introduction to Bluetooth LE Audio by explaining the basics of… Learn More SIG Working Group Paper Low Energy Audio – Using UCIs, URIs, and URI Schemes This document describes how implementers can use the UCIs, URIs, and URI schemes in… Learn More SIG Working Group Paper How to Build an Auracast™ Assistant This document covers the basic design principles for building an Auracast™ assistant, explaining the… Learn More Paper How to Build an Auracast™ Transmitter This document covers the basic design principles for building an Auracast™ transmitter, explaining the… Learn More Paper Auracast™ Simple Transmitter Best Practices Guide This paper provides a set of clear, concise, and useful recommendations for product makers interested in building Auracast™ transmitter products. Learn More Paper Bluetooth® Mesh Feature Enhancements Summary This paper summarizes the recent Bluetooth® Mesh feature enhancements and provides references to other… Learn More View All View All Papers UPCOMING FEATURES Key Specification Projects Explore and overview of specification development projects currently underway and determine if any can enhance the advancement of your product. LEARN MORE White Papers Bluetooth SIG Working Groups occasionally release White Papers that provide additional guidance to developers. Paper Specification Developer Guide for Transport Discovery Service A guide for developing profiles or higher level specifications which reference and make use of the Bluetooth Transport Discovery Service (TDS). Learn More SIG Working Group Paper Personal Health Devices Transcoding Learn how data sent by a Bluetooth Sensor based on GATT and received by a Collector can be transcoded at the Collector into an IEEE Std. 11073-20601a compatible nomenclature and model. Learn More SIG Working Group Paper Internet Gateways Discover various options available to create Internet Gateways for Bluetooth Low Energy Devices. Learn More SIG Working Group Paper GATT REST API A RESTful API used to access data in devices using the functionality defined in the Bluetooth GATT profile. Learn More SIG Working Group Paper GAP REST API White Paper Internet Working Group A RESTful API used to administer connections between devices featuring Bluetooth Low Energy technology and a Gateway. Learn More SIG Working Group Paper Improving A2DP Audio Quality Learn how to configure A2DP SRC and SNK devices to produce high quality audio. Learn More SIG Working Group Paper SAP and Remote Network Access Uncover how the SIM Access Profile (SAP) allows a Bluetooth enabled device to access data contained in the SIM card of another Bluetooth enabled device. Learn More SIG Working Group Paper Filter Recommendations for Coexistence with LTE and WiMAX Discover how to enable simultaneous operation of Bluetooth wireless technology and collocated Mobile Wireless Standards (MWS) systems such as LTE and WiMAX. Learn More SIG Working Group Paper Health Device Profile Implementation Guidance Get examples and best practices regarding how the Bluetooth Health Device Profile, the ISO/IEEE 11073-20601 Personal Health Data Exchange Protocol, and the associated 11073-104xx device specialization specifications can be implemented together. Learn More SIG Working Group Paper Discovery Learn how to use SDP and EIR for passing device and service information from one device to another to develop service discovery applications. Learn More SIG Working Group Paper Sniff and Sniff-Subrating Modes Discover how to use the Sniff and Sniff-Subrating modes to provide an effective means to reduce the power consumed by a pair of connected Bluetooth devices. Learn More SIG Working Group Product Testing Events Test your Bluetooth technology products against other unreleased and unannounced products and prototypes coming soon. UPFs are nonprofit interoperability testing events the Bluetooth SIG offers as an added benefit to members. Interoperability of Bluetooth products on the market is critical to the success of the technology so we work very hard to make sure everything just “works” for consumers. Select Type... Member Events Testing Events Member Events Testing Events SIG Member Only Member Events Member Summit + UPF Testing: Singapore 4 - 11 March 2025 Singapore, Singapore Learn More SIG Member Only Member Events Member Summit + UPF Testing: San Francisco 3 - 9 September 2025 San Francisco, United States Learn More Developer Forums Have a question about developing with Bluetooth? Find answers on a forum. With over 50 million visits per month, the Stack Overflow community does a tremendous job helping each other. Please use the links below to ask questions or follow the discussions: General Bluetooth Questions Bluetooth Low Energy Questions"
