["https://www.bluetooth.com/about-us/executive-team"]
title = "Executive Team | Bluetooth® Technology Website"
description = "The executive team and Board of Directors work together to ensure the mission and goals of the Bluetooth SIG are fulfilled. Neville comes to the Bluetooth Special Interest Group from JMA Wireless…"
full_description = "The executive team and Board of Directors work together to ensure the mission and goals of the Bluetooth SIG are fulfilled. Neville Meijers, Chief Executive Officer and Executive Director Neville comes to the Bluetooth Special Interest Group from JMA Wireless, a global leader in cellular communications, where he recently led their Private Wireless, Distributed Antenna System, Business Development and Marketing teams as Chief Commercial Officer. Prior to JMA Wireless, he led strategy, product development and marketing for Kymeta’s satellite products and services. Prior to this, he served ten years at Qualcomm, where he led the development of Private LTE/5G Networks for the Industrial Internet of Things. Neville has been a board member of the Digital Intermediate Frequency Interoperability Consortium (DIFI), Chairman of the Board for the OnGo Alliance (formerly the CBRS Alliance) and founder and board director of the MulteFire Alliance. Neville has held a number of senior executive positions around the world including Qualcomm, MediaFlo Technologies (a subsidiary of Qualcomm), Discovery Communications in the USA, Discovery Networks Asia based out of Singapore, UBC/UTV in Thailand, Naspers in China, and with MIH in South Africa. Neville’s background combines a wealth of technical, go-to-market and standards experience and global business success in the cellular, satellite, broadcast and Internet industries from his many years in C-level executive positions. He will lead the Bluetooth SIG team in support of the development of new generations of Bluetooth technology, advancing awareness of Bluetooth worldwide, and supporting the test and qualification of new Bluetooth products for its over 40,000 members. Neville earned a Master of Business Administration Degree and Bachelor of Science Degree in Engineering from the University of the Witwatersrand, Johannesburg. Ken Kolderup, Chief Marketing Officer Ken Kolderup leads an international team responsible for marketing, business development, and developer relations at the Bluetooth SIG. His team works in cooperation with more than 40,000 member companies to increase the awareness, understanding, and adoption of Bluetooth technology. Kolderup brings over 25 years of marketing, business development, and general management experience to his role. Most recently, he served as the Chief Marketing Officer at Taqua, a key innovator and leading supplier of virtualized core network solutions to mobile operators worldwide. Prior to Taqua, Kolderup served as the Chief Marketing Officer at Kineto Wireless, as well as the general manager for the company’s core network products business unit. After starting his career at IBM, he went on to help build and lead several successful companies including Jetstream Communications, Edify and Centigram Communications. Kolderup holds a Bachelor of Science in Electrical Engineering and Master of Science in Industrial Engineering from Stanford University. A native of California, he enjoys mountain biking, surfing and spending time with his family, especially outdoors. Jim Douthitt, Chief Financial Officer Jim Douthitt leads teams responsible for finance, accounting, IT, and business intelligence at the Bluetooth SIG. Douthitt brings over 25 years of finance leadership in the financial services and high-tech industries. His past experiences include Deloitte, director of product management at SS&C Technologies Inc. an investment software developer, CFO of investment operations for a unit of GE Capital, SVP of Treasury operations for a unit of JPMorgan Chase, and global leader of financial integrations for new business operations at Amazon. Jim holds a bachelor’s degree in business administration with a concentration in accounting from Eastern Washington University and is a Chartered Financial Analyst (CFA). Outside of work, he enjoys time with his family boating in the San Juan Islands, and skiing, hiking, and cycling in the Cascade mountains. Denise Montoya, Vice President and General Manager Membership and Qualification Denise Montoya is the Vice President and General Manager Membership and Qualifications. In her role, Montoya oversees the planning and delivery of the SIG project portfolio in service of the Bluetooth Core Programs. She also leads the product management area which focuses on providing members a positive tool experience for use during the development of specifications, testing member products, and ultimately the member qualification of their Bluetooth devices. Montoya has over 25 years of experience in the technology industry in bringing new products and services to market. Most recently, she was at Microsoft where she drove internal adoption and marketing of the Dynamics product and shifted teams to a service-based, customer-centric mindset. Prior to Microsoft, she spent over 20 years in the wireless industry both domestically and internationally in a variety of roles within Operations, IT, and Program Offices for delivering initiatives for the Marketing and Product teams. She focuses on visibility and collaboration across teams and bringing scalability to drive effectiveness. Montoya holds a bachelor’s degree in communications from DePaul University in Chicago, Illinois. Steve Chalgren, Vice President and General Manager Specification Development and Test Steve Chalgren leads the Specifications Program at the Bluetooth Special Interest Group (SIG). His team supports our member companies that collaborate and invent new Bluetooth technology specifications, create methods to validate critical interoperability of Bluetooth devices, and respond to security vulnerabilities as they are discovered or reported. Chalgren brings over 25 years of software-focused R&D, product, and general management leadership to his role. Recently, he served as the SVP of Business Strategy and Planning for Altium, a global electrical engineering eCAD design tool and product realization provider. Before Altium, Chalgren served as the Chief Strategy Officer & EVP of Product Management at Arena Solutions, a leading cloud Product Lifecycle Management (PLM) provider. His career has spanned both manufacturing and software roles, mainly at technology start-ups, including Tricord Systems, Jetstream Communications, Agile Software, and Bocada. Chalgren holds a Bachelor of Science in Economics from the University of Minnesota. He grew up fully embracing the four-season weather of the northern states: Montana, North Dakota, and Minnesota. Today, he enjoys mountain biking, skiing, and coaching his daughter’s soccer team in temperate Northern California. Rachel Theriot, Senior Director of Project Management Rachel Theriot leads a team of people and projects, working to develop the future of Bluetooth® technology and build systems for collaboration and visibility across all Bluetooth SIG functional teams and members. Theriot has over 20 years of experience in project and program management across an array of industries, including research science, travel, government, technology, and legal administration. She enjoys asking questions, building relationships through mutual trust, and tackling transformational projects with tenacity and integrity. Theriot has a B.S in Biochemistry from the University of Rochester and a minor in piano performance from the Eastman School. Emilie Scott, Director of Human Resources Since 2010, Emilie Scott has played a key role in supporting Bluetooth SIG operations for staff and members. She currently serves as the Director of Human Resources where she oversees a wide range of initiatives that help enhance staff engagement, talent acquisition, learning and development, compliance, and company culture. Emilie holds a bachelor’s degree from Central Washington University and a Professional in Human Resources certification from the Human Resources Certificate Institute."
year_published = 2025
