["https://www.bluetooth.com/bluetooth-mesh-primer"]
title = "The Bluetooth® Mesh Primer | Bluetooth® Technology Website"
description = "Revision History 2. About this paper 3. Introduction 3.1 The Evolution of Bluetooth technology 3.2 Bluetooth Mesh Networking 4. Key Features and Concepts 4.1 Bluetooth Operational Modes 4.2…"
full_description = "The Bluetooth® Mesh Primer View Table of Contents 1. Revision History 2. About this paper 3. Introduction 3.1 The Evolution of Bluetooth technology 3.2 Bluetooth Mesh Networking 4. Key Features and Concepts 4.1 Bluetooth Operational Modes 4.2 Devices and Nodes 4.3 Elements 4.4 Messages 4.5 Addresses 4.6 Publish / Subscribe 4.7 States and Properties 4.8 States and Fundamental Operations 4.9 State Transitions 4.10 Bound States 4.11 Models 4.12 Generics 4.13 Scenes 4.14 Networks and Subnets 4.15 Keys 4.16 Provisioning 4.16.1 Direct Provisioning 4.16.2 Remote Provisioning 4.16.3 Certificate-Based Provisioning 4.17 Configuration 4.18 Features 4.18.1 Relay Nodes 4.18.2 Low Power Nodes and Friend Nodes 4.18.3 Proxy Nodes 4.19 Message Relaying 4.19.1 Multi-hop Message Delivery 4.19.2 Managed Flooding 4.19.3 Directed Forwarding 4.20 Device Firmware Updates 4.20.1 About Firmware 4.20.2 Practical Issues 4.20.3 The DFU Capability 5. System Architecture 5.1 Introduction 5.2 The Bluetooth Mesh Specifications 5.3 The Bluetooth Mesh Stacks 5.4 Bearer Layer 5.5 Network Layer 5.6 Lower Transport Layer 5.7 Upper Transport Layer 5.8 Access Layer 5.9 Foundation Model Layer 5.10 Model Layer 6. Messaging 6.1 Message Publication and Delivery 6.2 Multipath Delivery 6.3 Traversing the Stack 6.4 Relaying 6.4.1 Directed Forwarding 7. Security 7.1 Security in Bluetooth Mesh is Mandatory 7.2 Security Fundamentals 7.3 Separation of Concerns and Security Keys 7.4 Subnets and Subnet Bridging 7.5 Node Removal, Key Refresh and Trashcan Attacks 7.6 Replay Attacks 7.6.1 IV Index and Sequence Numbers 7.6.2 The IV Update procedure 7.7 Privacy 8. Scalability 9. Bluetooth Networked Lighting Control (NLC) 10. Bluetooth Mesh Stakeholders 10.1 The Planner 10.2 The Installer 10.3 The Commissioner 10.4 The Building Maintenance Role 10.5 The Building Owner 11. Conclusion 12. Additional Resources 1. Revision History Version Date Author Changes 1.0.0 19 January 2019 Martin Woolley, Bluetooth SIG Initial version 1.1.0 16 May 2024 Martin Woolley, Bluetooth SIG Updated to include key features of Bluetooth Mesh 1.1 and Bluetooth Networked Lighting Control (NLC) 2. About this paper The Bluetooth® Mesh Primer has been created to help technology professionals such as product designers and developers to quickly learn about Bluetooth Mesh technology before consulting the formal technical specifications and delving more deeply into the subject. It is not the aim of this paper to reproduce or cover the same ground as the formal specifications or to the same depth. From time to time, brief extracts from the specifications may be included where it makes sense to do so. You should think of this paper as serving to orientate by introducing and explaining important Bluetooth Mesh concepts, pointing the way to other resources and specifications and hopefully, making the learning curve a little bit less steep. 3. Introduction 3.1 The Evolution of Bluetooth technology Bluetooth technology has been around since the year 2000. Initially created to allow two devices to exchange data wirelessly without the need for any other intermediate networking equipment, it quickly found a role in products such as wireless mice and hands-free kits for cars. This first version of Bluetooth technology, used in those very first ever Bluetooth products is known formally as Bluetooth BR (Basic Rate) and operates at one million bits[1] per second (Mb/s) at the physical layer. It was followed by a faster version of the same technology which doubled the bit rate to 2 Mb/s called Bluetooth BR/EDR where EDR stands for Enhanced Data Rate. Bluetooth Low Energy (LE) first appeared in version 4.0 of the Bluetooth Core Specification[2]. This was a new version of Bluetooth technology which rather than replace its predecessor, Bluetooth BR/EDR, sat alongside it as an alternative with capabilities and qualities that made it perfect for a new generation of products and the ability to meet new and challenging technical and functional requirements. Bluetooth LE supports topologies other than point to point communication between two devices with a broadcast mode which allows one device to transmit data to an unlimited number of receivers simultaneously. Bluetooth LE is also the foundation of Bluetooth Mesh networking which allows networks of tens of thousands of devices to be created, each one able to communicate with any other device in the network. 3.2 Bluetooth Mesh networking Bluetooth Mesh networking was created to provide a secure, scalable and standardized wireless communication technology that can be applied to the problems and opportunities of commercial buildings. Networked lighting control is a key application for Bluetooth Mesh and both manual and automated lighting control across physically large spaces is made possible. An individual light or a group of lights can be acted upon in a single network operation. Here are a few of the key things that are possible with networked lighting control based on a Bluetooth Mesh network. They can be switched on and off. Their brightness (more accurately termed lightness) can be controlled along a perceptually uniform scale that compensates for the varying sensitivity to light of the human eye. Color temperature, hue and saturation can be modified. Sensors can deliver information about more or less any measurable property of a room to relevant lights so that their state can be automatically adjusted in response to the environmental conditions. Note that Bluetooth Mesh does not require a centralized router to exchange messages between the sensors and lights. Arbitrary collections of certain state values known as scenes can be defined and lights can switch from one scene to another at a single request. Scene changes affecting groups of lights can be scheduled to take place automatically at specific points in time. Allows the automatic triggering of scenes based on room occupancy and the automatic transition to a standby state when there are no occupants. This helps in saving energy. Supports the ability to set predefined schedules for changing the states of lights. Supports the concept of vendor models which allow manufacturers to add additional features to their devices when needed. Control over lights in a network is not limited by the range of direct wireless communication. A device like a switch or a sensor can exercise control over lights that are located in the far distant reaches of a building, perhaps tens of floors above. Security was designed into Bluetooth Mesh technology from the start, and it addresses potential issues and threats including: safeguarding the confidentiality of information preventing devices from being tracked through device and network privacy mechanisms preventing the manipulation of network control messages constraining actions of devices to specific parts of the network only preventing replay attacks ensuring the addition of devices to the network is subject to a secure process ensuring devices can be securely removed from the network without any risk that discarded devices can be used to gain unauthorized access at a later time offering the ability to provide and revoke guest access to relevant functionalities in the network without compromising security of larger network. Buildings that are equipped with a Bluetooth Mesh network and wireless networked lighting control enjoy a range of benefits. They become more energy efficient, with sensors delivering data about ambient light levels and room occupancy which can be automatically used to adjust lighting levels. Lighting can be reconfigured at the touch of a switch or smartphone application user interface (UI) to be optimized for a room’s current use, be it presentation or large company round-table meeting. Proactive maintenance is facilitated by the usage and device health data that Bluetooth Mesh devices can make available. Changes to physical layout and lighting requirements in a building are more easily brought about. It’s wireless! Bluetooth Mesh technology is defined by a series of standard specifications that span the full protocol stack and the behaviors, capabilities and interfaces to devices. This means that compliant products from any mix of manufacturers will be interoperable. Adopters of Bluetooth Mesh technology are not locked into a single manufacturer or small, closed group. 4. Key Features and Concepts Understanding Bluetooth Mesh networking topology requires the reader to learn about a series of fundamental features, technical terms and concepts that are not found anywhere else in the world of Bluetooth LE. In this section, we’ll explore the most fundamental of these features, terms and concepts. 4.1 Bluetooth Operational Modes Bluetooth LE defines a number of different ways which devices can communicate with each other. They are formally defined in the Bluetooth Core Specification and informally referred to as “operational modes” in this paper. The various operational modes differ in a number of ways including the topology formed by the devices, the direction of communication which is possible and the underlying technicalities of the mode such as whether it is a connection-oriented or connectionless mode. In connection-oriented communication the devices first exchange information which allows them to agree important aspects of the subsequent communication such as transmit and receive timing parameters. In connectionless communication, this does not happen and transmit and receive timings are not pre-agreed in the same way. In Bluetooth LE, connection-oriented communication always takes place between exactly two devices whereas connectionless communication can be used by one transmitting device to communicate with multiple receiver devices, with or without some degree of pre-agreed information about the parameters. Topology is concerned with the cardinality of the relationships which may be formed between communicating devices. Three distinct topologies are recognized: one-to-one (1:1) one-to-many (1:m) many-to-many (m:n) Some operational modes allow communication of application data in one direction only whereas others allow bidirectional communication. Some modes use a precisely regular schedule for the transmission of packets and in other cases, it is irregular. Seven operational modes are currently defined. They are as follows: LE Asynchronous Connection-oriented Logical transport (LE ACL) LE Advertising Broadcast (ADVB) LE Periodic Advertising (PADVB) LE Periodic Advertising with Responses (PAwR) Connected Isochronous Stream (CIS) Broadcast Isochronous Stream (BIS) Channel Sounding (CS) The Bluetooth Core Specification defines each mode in detail. Table 1 summarizes the key attributes of the seven operational modes for the purpose of comparison. Note that Channel Sounding (CS) is a special mode which is designed to support the secure calculation of the distance between two devices only and is not used for the transfer of application data. Operational Mode Connection-Oriented or Connectionless Topology Transmit Schedule Direction of Application Data LE ACL connection-oriented point-to-point regular bidirectional ADVB connectionless one-to-many irregular unidirectional PADVB connectionless one-to-many regular unidirectional PAwR connectionless one-to-many regular bidirectional CIS connection-oriented point-to-point regular bidirectional BIS connectionless one-to-many regular unidirectional CS N/A one-to-one regular N/A Table 1 – Attributes of Bluetooth Operational Modes Bluetooth Mesh technology is not an operational mode. It’s a protocol with a series of defined procedures, standard application-layer behaviors, and other features which make it possible to use Bluetooth LE as a wireless networking technology. It builds upon core capabilities of Bluetooth LE including several of the operational modes so that at times it is acting in a connectionless way and at other times using connection-oriented communication. In principle, the topology formed by a Bluetooth Mesh network is many-to-many since any device may potentially communicate with any other device and communication of application data can occur in either direction. Communication is achieved using messages which are transported by Bluetooth LE in a suitable way using a mechanism called a bearer which is based upon one of the operational modes. Devices are able to relay messages to other devices right across the network so that the end-to-end communication range is extended far beyond the radio range of each individual mesh device. 4.2 Devices and Nodes Devices which are part of a mesh network are called nodes and those which are not are called unprovisioned devices. The process which transforms an unprovisioned device into a node is called provisioning. Provisioning is a procedure which results in an unprovisioned device possessing a series of security keys, having a unicast address assigned to it and being listed in a database on a device known as the Provisioner. The Provisioner is typically a tablet or smartphone. 4.3 Elements Some nodes have multiple constituent parts, each of which can be independently controlled. In Bluetooth Mesh terminology, these parts are called elements. Figure 1 shows an LED lighting product which if added to a Bluetooth Mesh network, would form a single node with three elements, one for each of the individual LED lights. Figure 1 – Lighting node consisting of three elements 4.4 Messages When a node needs to query the status of other nodes or needs to control other nodes in some way, it sends a message of a suitable type. If a node needs to report its status to other nodes, it sends a message. All communication in the mesh network is message-oriented and many message types are defined, each with its own unique opcode. Messages fall within one of two broad categories: Acknowledged messages require a response from nodes that receive them. The response serves two purposes: it confirms that the message it relates to was received, and it returns data relating to the message recipient to the original message sender. The sender of an acknowledged message may resend the message if it does not receive the expected response(s) and therefore, acknowledged messages must be idempotent. This means that the effect of a given acknowledged message, arriving at a node multiple times, will be the same as if it had only been received once. Unacknowledged messages do not require a response. Most Bluetooth Mesh scenarios involve the use of unacknowledged messages since this model of messaging scales very well. It is made reliable by configuring nodes to retransmit copies of messages multiple times in quick succession. Messages that require acknowledgements to be returned work well when the target is a single device but do not scale well when targeting a group of multiple devices. Most messages that are involved in configuring a node or its elements use acknowledged messages. A system known as relaying a"
