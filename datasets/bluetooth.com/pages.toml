["https://www.bluetooth.com/blog/auracast-broadcast-audio-in-the-real-world"]
title = "Auracast™ Broadcast Audio in the Real World実世界で活用が進むAuracastTM ブロードキャスト オーディオ | Bluetooth® Technology Website"
description = "Since the release of the Bluetooth® LE Audio, Auracast™ broadcast audio – a new Bluetooth capability that lets you share your audio, unmute your world, and hear your best – has had a major impact…"
full_description = "August 7, 2024 Jason Marcel Auracast, Bluetooth LE, Broadcast, LE Audio, Multi-Stream Audio Since the release of the Bluetooth® LE Audio, Auracast™ broadcast audio – a new Bluetooth capability that lets you share your audio, unmute your world, and hear your best – has had a major impact across the audio market, influencing analysts’ trends and forecasts and making headlines with major industry publications. What was once speculation as to its real-world applications has now become an encouraging reality. Auracast™ broadcast audio enables an audio transmitter to broadcast audio to an unlimited number of receivers. A transmitter can be a smartphone, laptop, TV, or even a public address or sound system, and receivers are headphones, speakers, earbuds, or even hearing aids. This year alone, we’ve seen several new product announcements, from Auracast™ receivers to Auracast™ transmitters, developed by major industry players like Samsung, JBL, Ampetronic/Listen, and Sennheiser with more product announcements expected at IFA 2024 in September. Below are just a few examples of how Auracast™ broadcast audio is beginning to impact real-world public spaces. The Silent Awa Odori Hosted in Shibuya, Tokyo, Japan, the Silent Awa Odori took the traditional Japanese Awa Odori folk dance and transformed it into a silent yet immersive experience using wireless headphones and earbuds. Rather than relying on loud music blasting from speakers, which can disturb surrounding neighborhoods, this innovative approach allowed participants to enjoy the iconic dance performance through their personal audio devices. The Silent Awa Odori event successfully showcased one of the primary use cases that Auracast™ broadcast audio enables –enjoying music and audio in public spaces where loud sounds are typically not permitted or could be intrusive to others in surrounding areas. Attendees were provided with headphones or earbuds and could choose between two synchronized live audio channels: one featuring the authentic, traditional music that typically accompanies Awa Odori dances and the other offering pulsating techno sets performed by local DJs. This simultaneous access to two distinct audio streams created a unique, multi-dimensional experience for the audience. Learn more. Conference Rooms at HLAA 2024 Amongst the broad range of audio innovations that were shared at HLAA 2024, the event provided several opportunities to allow attendees to explore Auracast™ broadcast audio firsthand. Three conference rooms at the venue were outfitted with Auracast™ transmitters. So, attendees who visited select sessions were able to check out an Auracast™ receiver (hearing aid or earbud) and tune into sessions offered in those conference rooms via Auracast™ broadcast audio. “Everyone was impressed with the capabilities Auracast™ broadcast audio enabled,” said Kayla Myrhow, senior product marketing manager for the Bluetooth SIG. “Each of the three workshop rooms were outfitted with an AURI transmitter from Ampetronic and Listen Technologies, allowing attendees to use headphones with a receiver, or GN Resound Nexia hearing aids to listen and participate better in the workshops.” Products with Auracast™ support are available today, and this technology is not only being added to new hearing aids, cochlear implants, and other hearing devices, but it is also being added to consumer audio receivers like earbuds, headphones, and speakers. And it is gaining adoption in new smartphones, tablets, and TVs, and has been introduced in commercial transmitters for public spaces. Learn more. NEW REPORT Auracast™ Broadcast Audio Retrofit Solutions and Opportunities This report by ABI Research delves into the opportunity for public spaces to offer new Auracast™ augmented audio experiences and enhanced assistive listening to its occupants and visitors by using cost-effective retrofit Auracast™ solutions, accelerating wider adoption of Auracast™ transmitters as well as receiver devices. SEE THE REPORT The Auracast™ Experience In collaboration with a range of Bluetooth Special Interest Group (SIG) member companies, The Auracast™ Experience – a global event series designed to give media, analysts, and industry enthusiasts an exclusive, hands-on look at Auracast™ broadcast audio – allows visitors to experience some of the ways Auracast™ broadcast audio will help our world sound better. Attendees at The Auracast™ Experience events had an opportunity to personally sample this new broadcasting capability. Visitors took part in several simulated Auracast™ scenarios: arriving at an airport to travel to an international conference, navigating the airport terminal, and listening to keynote speeches at a public venue. Participants were provided with Auracast™ compatible earbuds and a smartphone with an Auracast™ app for scanning, receiving, and playing Auracast™ broadcasts. Even though the smartphone and earbuds are paired, the smartphone was not the audio source. The audio source, the Auracast™ transmitter, is separate, and participants were able to select and receive various Auracast™ broadcasts through the app, similar to choosing from available Wi-Fi networks. Auracast™ Broadcast Audio in an Airport Bar: For this experience, Aurcast™ enabled TVs delivered audio as Auracast™ transmitters. Attendees were able to use the Auracast™ app on their smartphones to select the TV of their choice and listen via their Auracast™ compatible earbuds, then switch to the audio of another TV by selecting a new broadcast, without a moment’s delay. This feature is not limited to sports bars. Silent TVs in hospital waiting rooms, in gymnasiums, on trains, and more are all ideal spaces where Auracast™ broadcast audio can enhance the watching experience. Auracast™ Broadcast Audio at the Airport Gate: Attendees also had a chance to see how Auracast™ broadcast audio can be used to share audio with friends and family. While waiting in the airport lounge, a colleague asked them to join in watching a movie together on their laptop. Participants were also invited to listen to music via another colleague’s smartphone. Invitations were simultaneously received via the Auracast™ app. Visitors scanned the available Auracast™ broadcasts and selected the one they wanted to hear. This allowed the audio being shared by colleagues to stream directly into their earbuds. During these personal audio-sharing scenarios, only those with the necessary passwords were able to participate, ensuring privacy while allowing more people to enjoy the same audio at once, each on their individual pairs of earbuds. Auracast™ Broadcast Audio in an Auditorium: Lastly, attendees arrived at the lecture hall for the conference. In this scenario, participants show up a few minutes late and can only find seating at the back of the auditorium where, often, it can be difficult to hear the presenter. However, since this auditorium was set up to support Auracast™ broadcast audio, attendees were able to listen at the optimal volume to suit their needs via the highest audio quality available on their own earbuds, no matter where in the auditorium they were seated. And, since multi-lingual options were offered by the venue, participants could choose between hearing the lecture in English or Mandarin. Learn more. Google Publicly Endorses Auracast™ Broadcast Audio Anticipating rapid deployment of Auracast™ broadcast audio in a broad range of public spaces, Google announced they have added the ability for venues and businesses to indicate support for Auracast™ broadcast audio within their locations. While it will be critical for hearing instrument users to understand which locations support this new broadcast capability, they are not the only ones who will benefit from the presence of Auracast™ broadcast audio in public venues. The impact of this new Bluetooth capability in public locations will extend beyond hearing assistance. Soon, whenever you visit a venue or location that offers Auracast™ broadcast audio, you’ll be able to use your smartphone to scan for Auracast™ broadcasts in the building – similar to how public Wi-Fi networks are detected. And now, Google has provided a way for venues and businesses to let visitors know whether Auracast™ broadcast audio is available at their location even before visitors arrive, which is great news for everyone! Google’s public endorsement of this feature, alongside those who are already developing Auracast™ products, gives further credibility to the efficacy of this revolutionary Bluetooth audio capability. Learn more about Auracast™ broadcast audio in public spaces. FEATURED INNOVATION Auracast™ Broadcast Audio Auracast™ broadcast audio will deliver life-changing audio experiences that will enhance the way you engage with others and the world around you. LEARN MORE Bluetooth® LE Audioのリリース以来、AuracastTM ブロードキャスト オーディオは、オーディオ共有、ミュート解除、最高の音で聴くことを可能にするBluetoothの新機能として、オーディオ市場に大きな影響をもたらしました。アナリストによるトレンド分析や予測に反映され、主要業界誌の見出しを賑わせています。そして今や、かつては推測の域に留まっていた実世界での活用という面でも、確かな現実となっています。 AuracastTM ブロードキャスト オーディオは、1台の送信機から台数無制限の受信機に向けて、オーディオをブロードキャストすることを可能にします。送信機としてスマートフォンやノートパソコンをはじめ、テレビ、場内放送システム、音響システムなどが使用でき、受信機としてはヘッドホンやスピーカー、イヤホン、さらには補聴器が使用できます。2024年だけでもSamsung、JBL、Ampetronic/Listen、Sennheiserなどの業界大手企業がAuracastTM受信機から送信機まで、相次いで新製品を発表しました。9月に開催されるIFA 2024では、さらに多くの新製品の発表が期待されています。 以下にご紹介するのは、AuracastTM ブロードキャスト オーディオが実世界の公共の場で活用され始めている事例のほんの一部です。 サイレント阿波踊り 東京都渋谷区で開催されたサイレント阿波踊りは、ワイヤレスヘッドホンやイヤホンを使用することで、周囲の静寂を保ちつつ、伝統的な阿波踊りを没入型のオーディオ体験へと変えました。近隣の迷惑となる可能性のある大音量でのスピーカー音源を使用する代わりに、この革新的なアプローチでは、参加者は自身のオーディオ機器を使用して、風物詩である阿波踊りを楽しみました。 サイレント阿波踊りは、AuracastTM ブロードキャスト オーディオで可能になる主なユースケースの1つである、公共の場で音楽・オーディオを楽しむことを見事に実現しました。そうした場では、一般的に大音量が許容されない、または周辺地域の迷惑になる可能性があります。参加者にはヘッドホンまたはイヤホンが配られ、ライブ音源を流す2つの同期されたチャンネルからオーディオを選ぶことができました。チャンネルの1つは阿波踊りで通常伴奏に用いられる伝統的な音楽、もう1つは会場のDJが流すビートの効いたテクノミュージックです。このように2つの異なるオーディオストリームに同時にアクセスできるようにすることで、多面的な独特の体験が生み出されました。 詳細はこちら HLAA 2024の会議室 HLAA 2024ではさまざまな革新的なオーディオ技術が紹介されましたが、その中にはAuracastTM ブロードキャスト オーディオを参加者が実際に体験できる機会もありました。会場内の3つの会議室にAuracastTM送信機が設置され、参加者はAuracastTM受信機（補聴器またはイヤホン）を利用して、これらの会議室で進行中のセッションをAuracastTM ブロードキャスト オーディオを通じて聞くことができました。 Bluetooth SIGのシニアプロダクトマーケティングマネージャーであるケイラ・ミヤハウ（Kayla Myrhow）は、次のように述べています。「誰もがAuracastTM ブロードキャスト オーディオが可能にするさまざまな機能に、感銘を受けていました。3つの会議室にはAmpetronicとListen Technologiesが提供する送信機『AURI』が設置され、参加者は受信機を搭載したヘッドホン、またはGN ReSoundの補聴器『Nexia』を使い、より良い音質でワークショップの試聴と参加ができました」 現在、AuracastTM対応製品は既に市販されており、新しい補聴器や人工内耳、その他の補聴用製品だけでなく、イヤホン、ヘッドホン、スピーカーなどのコンシューマーオーディオ受信機にも搭載されています。新型のスマートフォン、タブレット、テレビでもAuracastTM対応が進んでおり、公共施設向けの業務用送信機にも採用されています。 詳細はこちら AuracastTM Experience メンバー企業の協力のもと、Bluetooth SIG（Special Interest Group）は世界各地でAuracast™ Experienceを開催しています。このイベントでは、メディア関係者やアナリスト、この分野に高い関心を持つ人々にAuracastTM ブロードキャスト オーディオを実際に体験できる特別な機会を提供し、来場者はAuracastTM ブロードキャスト オーディオが豊かな音の世界を実現する方法のいくつかを体験しました。 AuracastTM Experienceでは、参加者は「国際カンファレンスに出席するため空港に到着して空港ターミナル内を移動し、カンファレンスが行われる公共の会場で基調講演を聴く」というAuracastTM活用のシナリオに沿って、新しいブロードキャスト機能を実際に試すことができました。 参加者にはAuracastTM対応のイヤホンと、AuracastTMのブロードキャストをスキャン、受信、再生するためのAuracastTMアプリの入ったスマートフォンが配られました。スマートフォンとイヤホンはペアリングされますが、オーディオを配信している音源はスマートフォンではありません。オーディオは別のAuracastTM送信機から配信され、参加者はWi-Fiネットワークを選択する場合と同じように、アプリを通じてさまざまなAuracastTM配信の中から選択し、受信できました。 空港のバー：この体験では、AuracastTM対応テレビがAuracastTM送信機として、音声を配信しました。参加者は手元のスマートフォンのAuracastTMアプリを使用して視聴したいテレビを選び、AuracastTM対応イヤホンで音声を聴くことができました。別のテレビの音声を聴きたい場合、その配信を選択するだけで、わずかな遅れもなく音声を切り替えることができました。 このような利用はスポーツバーに限られるものではありません。AuracastTM ブロードキャスト オーディオは、病院の待合室、室内競技場、電車内など無音テレビのある数多くの場所で、より充実した視聴体験を実現できます。 空港の搭乗ゲート：参加者は、AuracastTM ブロードキャスト オーディオを使った友人や家族とのオーディオ共有も体験しました。空港のラウンジでの待ち時間に、同僚がノートパソコンで一緒に映画を観ようと誘ってくれます。また別の同僚からは、スマートフォンの音楽を一緒に聴こうという誘いも届きます。それらの招待は、AuracastTMアプリを通じて同時に届きました。参加者は受信できるAuracastTM配信をスキャンして探し、聴きたいものを選びます。選択すると、同僚が共有してくれたオーディオが、直接自分のイヤホンにストリーミングされました。 こうした個人的なオーディオ共有のシナリオでは、パスワードを知っている人だけが受信できます。それによりプライバシーを保証しながら、複数の人がそれぞれ自分のイヤホンを使い、同時に同じオーディオを楽しむことができるのです。 カンファレンスホール：参加者は、最後にカンファレンスホールを訪れます。この場面に用意されたシナリオでは、参加者は講演開始から数分遅れで会場に到着します。空いていたのは後方の、講演者の話を聞き取りにくい席でした。幸いホールはAuracastTM ブロードキャスト オーディオに対応していたため、参加者はホール内の座席の位置に関係なく、自分のイヤホンで得られる最高の音質と、自身に必要な最適な音量で、講演を聴くことができました。さらに、会場では多言語サービスも提供されていたため、講演の言語を英語と中国語から選べました。 詳細はこちら GoogleがAuracastTM ブロードキャスト オーディオを公に支持 AuracastTM ブロードキャスト オーディオの導入が幅広い公共の場で急速に進むと予想されることから、Googleは施設や企業が位置情報にAuracastTM ブロードキャスト オーディオ対応を記載できるようにすると発表しました。 AuracastTM ブロードキャスト オーディオが提供されている場所の把握は補聴器ユーザーにとって極めて重要ですが、公共の場でAuracastTM ブロードキャスト オーディオの恩恵を受けられるのは補聴器ユーザーだけではありません。公共の場でAuracastTMが発揮する力は、補聴器対応にとどまらず、さらに広範囲に及びます。 間もなく、AuracastTM ブロードキャスト オーディオが利用できる場所では、現在の公共Wi-Fiを検出する場合と同じように、自分のスマートフォンを使用して施設内のAuracastTM配信をスキャンできるようになるでしょう。先日Googleは、実際にその場所に足を運ぶ前に、施設や企業から拠点内でAuracastTM ブロードキャスト オーディオを利用できるかどうかを訪問者に知らせる手段の提供を開始しました。これはあらゆる人にとって嬉しいニュースです。 AuracastTMに対するGoogleの公の支持は、既にAuracastTM製品の開発を進めている企業の例と共に、この革新的なBluetoothオーディオ機能の有効性をさらに裏付けています。 公共の場におけるAuracastTM ブロードキャスト オーディオの詳細はこちら Select Type... Blog Posts Member Blogs Books Infographics Papers Reports Videos Blog Posts Member Blogs Books Infographics Papers Reports Videos Paper A New Bluetooth® Audio Scan-to-Listen Experience Over the past few years, QR codes have made a major comeback for tasks… Learn More Video Communicating Supported Bluetooth® Functionality In this Snapshot from ABI Research, Bluetooth SIG’s senior manager, Avi Negrin, explains new… Watch Now Blog Post Everything you ever wanted to know about Bluetooth® LE Audio and Auracast™ broadcast audio Recently, Nick Hunn, chair of the Bluetooth SIG Hearing Aid Working Group, vice chair… Read More Blog Post Auracast™ broadcast audio: a major showstopper at CES 2025 For decades, CES has connected innovators, decision makers, media, influencers, visionaries, and customers across… Read More Book Introducing Bluetooth® LE Audio 2nd Edition Now available for free digital download, get your copy of this in-depth, technical overview of the LE Audio specifications. Learn More SIG Member Blog Post Japan and China are helping to shape the future of a connected experience Recently, the Bluetooth Special Interest Group (SIG) hosted its first in-person Tokyo Seminar since… Read More Blog Post The Switch from Bluetooth® Classic to Bluetooth® LE Audio Bluetooth® Classic has long been a staple of the audio market and isn’t going away… Learn More SIG Member Paper Communicating Supported Bluetooth® Functionality This guide offers recommendations for effectively communicating support for key aspects of Bluetooth technology. Learn More Blog Post Auracast™ Broadcast Audio Enables the Pioneering of Real-Time Language Translation SolutionsAuracast™ ブロードキャスト オーディオで実現する新世代の同時通訳ソリューション In an increasingly interconnected world, language barriers continue to pose significant challenges for global… Read More Video Auracast™ Broadcast Audio for Developers: Best Practices for Developing Transmitters, Receivers, and Broadcast Assistants for Public Locations Auracast broadcast audio technology will revolutionize how we experience audio. This interactive session will… Watch Now Video The Auracast™ PA System That Fit"
