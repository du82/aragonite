["https://www.bluetooth.com/blog/auracast-broadcast-audio-a-major-showstopper-at-ces-2025"]
title = "Auracast™ broadcast audio: a major showstopper at CES 2025 | Bluetooth® Technology Website"
description = "For decades, CES has connected innovators, decision makers, media, influencers, visionaries, and customers across the entire tech ecosystem, and 2025 was no exception. This year…"
full_description = "January 27, 2025 Amy Parker Audio, Auracast, Bluetooth LE, Broadcast, LE Audio, Multi-Stream Audio For decades, CES has connected innovators, decision makers, media, influencers, visionaries, and customers across the entire tech ecosystem, and 2025 was no exception. This year, attendees of the annual Consumer Electronics Show had many opportunities to experience firsthand the latest in cutting-edge innovations, from TVs and home entertainment solutions to robotics and AI to new wearables and audio devices and more. One of the top discussions that got media buzzing was an in-depth look at new Auracast™ broadcast audio solutions. Auracast™ broadcast audio Auracast™ broadcast audio is a new Bluetooth® capability that lets an audio transmitter (smartphone, laptop, TV, public address or sound system, etc.) broadcast audio to an unlimited number of audio receivers (speakers, earbuds, headphones, hearing aids, etc.). With Auracast™ broadcast audio, you can invite others to share your personal Bluetooth audio experience. It lets you hear audio from silent TVs like those in airports, gymnasiums, waiting rooms, sports bars, and more. And when visiting venues like conference centers, theaters, cinemas, lecture halls, etc., Auracast™ broadcast audio helps you hear your best in these noisy spaces. FEATURED INFOGRAPHIC The Perfect Fit for an Auracast™ Retrofit Learn about Auracast™ broadcast audio retrofit solutions and opportunities. SEE THE INFOGRAPHIC New Auracast™ devices turned heads From a dedicated meeting room at the event, the Bluetooth Special Interest Group (SIG), held a number of media and analyst briefings, showcasing the latest advancements from the Bluetooth roadmap, including demo opportunities for Auracast™ broadcast audio and Bluetooth® Channel Sounding. The Bluetooth SIG also collaborated with several member companies to support a CES Accessibility Track that provided a firsthand look at the latest Auracast™ devices. “At CES 2025, Ampetronic and Listen Technologies proudly supported key accessibility sessions, showcasing the transformative potential of Auracast™ broadcast audio,” said Mikey Shaffer, director of sales, Americas with Listen Technologies. “The highlight for us was the opportunity to experience each session using a range of Auracast™ receivers, including the dedicated Auri™ receiver, Sennheiser earbuds, and GN ReSound hearing aids.” During the CES Accessibility Track, attendees had the opportunity to experience the groundbreaking capabilities of Auracast™ broadcast audio in a live conference setting. This milestone marked a significant step forward in demonstrating how Bluetooth innovation can transform public audio experiences, from conferences to theaters and beyond. By enabling the seamless sharing of high-quality audio to personal devices, Auracast™ broadcast audio showcased its potential to redefine how we interact with sound in shared spaces, reinforcing its role as a transformative technology in the future of wireless audio connectivity. Throughout the event, more than 50 devices – including Auracast™ receivers with headphones and neck loops from Listen Technologies, Auracast™ enabled true wireless earbuds from Sonova Sennheiser, and Auaracast™ compatible hearing aids from GN ReSound – were loaned out to visitors. A diverse group of media, analysts, and industry experts participated in the experience, along with the president of the Hearing Loss Association of America (HLAA) who expressed enthusiasm for Auracast™ broadcast audio and the impact it will have on helping those with hearing loss hear their best wherever they go. “The sound quality delivered by the Auracast™ transmitter surpassed the in-room audio, regardless of your level of hearing health – a sentiment echoed by every participant who experienced the demo,” said Shaffer. “This feedback reinforced our belief in the power of Auracast™ broadcast audio to create an unparalleled listening experience. CES 2025 was not just an opportunity to demonstrate this revolutionary technology but a reminder of its potential to make a meaningful impact in diverse listening environments.” Media recognition from the event Media and analysts left the experience excited by the prospect of how Auracast™ broadcast audio will change the audio landscape around the world. Well-known publications like the New York Times and Rolling Stone Magazine highlighted several Auracast™ devices showcased at the event. Other publications, such as: ZDNet covered LG and will.i.am’s a new line of AI-enhanced Auracast™ speakers that enable seamless audio sharing and advanced connectivity for a more immersive and personalized listening experience What Hi-Fi showcased a number of Auracast™ devices that enable seamless audio sharing across multiple devices and enhance user experiences in personal and public audio spaces Tom’s Guide highlighted Auracast™ broadcast audio as one of the top 25 gadgets at CES 2025, calling out its revolutionary approach to wireless audio sharing Hearing Tracker praised Auracast™ broadcast audio for its role in enhancing assistive listening devices and advancing hearing healthcare technology There’s no doubt that the range of Auracast™ devices at CES 2025 had a significant impact on all those who had a chance to sample its capabilities. Learn more about this latest Bluetooth® audio innovation and check out The Auracast™ Experience to see for yourself how Auracast™ broadcast audio is revolutionizing audio as we know it. FEATURED INNOVATION Auracast™ Broadcast Audio Auracast™ broadcast audio will deliver life-changing audio experiences that will enhance the way you engage with others and the world around you. LEARN MORE Select Type... Blog Posts Member Blogs Books Infographics Papers Reports Videos Blog Posts Member Blogs Books Infographics Papers Reports Videos Paper A New Bluetooth® Audio Scan-to-Listen Experience Over the past few years, QR codes have made a major comeback for tasks… Learn More Video Communicating Supported Bluetooth® Functionality In this Snapshot from ABI Research, Bluetooth SIG’s senior manager, Avi Negrin, explains new… Watch Now Blog Post Everything you ever wanted to know about Bluetooth® LE Audio and Auracast™ broadcast audio Recently, Nick Hunn, chair of the Bluetooth SIG Hearing Aid Working Group, vice chair… Read More Blog Post Auracast™ broadcast audio: a major showstopper at CES 2025 For decades, CES has connected innovators, decision makers, media, influencers, visionaries, and customers across… Read More Book Introducing Bluetooth® LE Audio 2nd Edition Now available for free digital download, get your copy of this in-depth, technical overview of the LE Audio specifications. Learn More SIG Member Blog Post Japan and China are helping to shape the future of a connected experience Recently, the Bluetooth Special Interest Group (SIG) hosted its first in-person Tokyo Seminar since… Read More Blog Post The Switch from Bluetooth® Classic to Bluetooth® LE Audio Bluetooth® Classic has long been a staple of the audio market and isn’t going away… Learn More SIG Member Paper Communicating Supported Bluetooth® Functionality This guide offers recommendations for effectively communicating support for key aspects of Bluetooth technology. Learn More Blog Post Auracast™ Broadcast Audio Enables the Pioneering of Real-Time Language Translation SolutionsAuracast™ ブロードキャスト オーディオで実現する新世代の同時通訳ソリューション In an increasingly interconnected world, language barriers continue to pose significant challenges for global… Read More Video Auracast™ Broadcast Audio for Developers: Best Practices for Developing Transmitters, Receivers, and Broadcast Assistants for Public Locations Auracast broadcast audio technology will revolutionize how we experience audio. This interactive session will… Watch Now Video The Auracast™ PA System That Fits in Your Pocket Watch how Auracast™ broadcast audio enables a simple clip-on microphone to provide a high-quality… Watch Now Blog Post Crafting Innovative Auracast™ Devices from Concept to Compatibility If you haven’t heard of AuracastTM broadcast audio yet, it’s time to fully embrace it. This… Learn More SIG Member Infographic The Perfect Fit for an Auracast™ Retrofit Learn about Auracast™ broadcast audio retrofit solutions and opportunities. Learn More Blog Post Auracast™ - Hear, There and Everywhere Most everyone reading this enjoys the benefits of Bluetooth®. Providing short-range wireless point-to-point solutions… Learn More SIG Member Paper How to Build an Auracast™ Assistant This document covers the basic design principles for building an Auracast™ assistant, explaining the… Learn More Report 2024 Bluetooth® Market Update The 2024 Bluetooth® Market Update examines the direction and adoption of Bluetooth technology. Learn More Report Auracast™ Broadcast Audio Retrofit Solutions and Opportunities This report by ABI Research delves into the opportunity for public spaces to offer… Learn More SIG Member Infographic What's the Range of Auracast™ Broadcast Audio? Get the answer to the question everyone’s asking. Find out what the coverage area… Learn More Infographic Can You Add Auracast™ Support to Existing Devices? Are you waiting for native Auracast™ support? You might not have to. Find out… Learn More Report LE Audio: The Future of Bluetooth® Audio ABI Research outlines how the arrival of LE Audio is set to transform the Bluetooth audio ecosystem and the impact it will have on Bluetooth® audio market forecasts. Learn More"
