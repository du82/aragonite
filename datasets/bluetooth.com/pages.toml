full_description = "5 Things You Don’t Know About Bluetooth Range From frequency hopping to forward error correction, watch Mohammad Afaneh share some things you may not already know in this technical look at Bluetooth range. Resource Details Video Bluetooth LE, Range From frequency hopping to forward error correction, watch Mohammad Afaneh share some things you may not already know in this technical look at Bluetooth range. From frequency hopping to forward error correction, watch Mohammad Afaneh share some things you may not already know in this technical look at Bluetooth range. 本シリーズの以前の記事で、あらゆるプロジェクトに適した万能なワイヤレス接続ソリューションは無いことをご説明しました。また、商工業分野でとりわけ多いIoTの用途について調査を行い、各用途における特に重要な特性と、適していると思われる技術をリストアップしました。 今回の記事では、さまざまなワイヤレス接続技術についてさらに詳しく分析し、商工業分野におけるIoTとして特に重要な特性の観点から比較を行います。 比較する技術は以下の通りです。 Bluetooth® 技術 Wi-Fi IEEE 802.15.4ベースの技術（Thread、Zigbee） Z-Wave セルラー系の省電力広域ネットワーク技術（NB-IoT、LTE-M） 非セルラー系の省電力広域ネットワーク技術（LoRaWAN、Sigfox） 各技術について、以下の特性の観点から比較を行います。 通信距離 スループット 消費電力…"
