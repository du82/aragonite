["https://www.bluetooth.com/auracast"]
title = "Auracast | Bluetooth® Technology Website"
description = "Auracast™ broadcast audio will be offered at the CES Accessibility Track on 1/7. Location: Venetian, Level 4, Lando 4302 Auracast™ broadcast audio is a new Bluetooth® capability that will deliver life…"
full_description = "Experience Auracast™ broadcast audio at CES Auracast™ broadcast audio will be offered at the CES Accessibility Track on 1/7. Location: Venetian, Level 4, Lando 4302 INTRODUCING Auracast™ broadcast audio is a new Bluetooth® capability that will deliver life-changing audio experiences. It will let you share your audio, unmute your world, and hear your best, enhancing the way you engage with others and the world around you. Watch the Video New Audio Experiences Auracast™ broadcast audio will enable new audio experiences that will help your world sound better. Share Your Audio Auracast™ broadcast audio will let you invite others to share in your audio experience, bringing us closer together. Unmute Your World Auracast™ broadcast audio will enable you to fully enjoy televisions in public spaces, unmuting what was once silent and creating a more complete watching experience. Hear Your Best Auracast™ broadcast audio will allow you to hear your best in the places you go and is expected to become the next generation assistive listening technology, improving audio accessibility and promoting better living through better hearing. Join In, Intuitively Joining an Auracast™ broadcast will be as easy as 1, 2, or 3. 1. Searching One way to find and join an Auracast™ broadcast will feel very similar to how you search for and connect to Wi-Fi networks today. 2. Scanning A simple scan of a QR code will allow you to join an Auracast™ broadcast effortlessly. 3. Tapping A tap is now all it takes to pay. In much the same way, tap-to-hear could make access to Auracast™ broadcasts quick and easy. The Auracast™ Experience Goes Global The Auracast™ Experience is a series of immersive exhibits that allow visitors to experience a day in a life with Auracast™ broadcast audio. Learn More What the Industry is Saying “While current assistive listening systems, such as inductive loops, have been providing great benefit to people with hearing loss, they suffer from a number of challenges that have limited their deployment, including poor quality, high cost, and lack of privacy. Auracast™ broadcast audio is well positioned to become an advanced, new assistive listening system that will be significantly easier and lower cost to deploy while offering higher audio quality and greater privacy, improving audio accessibility and promoting better living through better hearing.” Nick Hunn, CTO of WiFore “Hearing and understanding speech in various environments can be a daily struggle for people with any degree of hearing loss. Audio quality innovations can benefit everyone, while also improving communication access to those with hearing loss. Having choices in technology to meet the varying needs of people with hearing loss is critical. The advent of technologies like Auracast™ broadcast audio has the potential to give people who wear hearing aids and cochlear implants an important new option for hearing access in their everyday lives.” Barbara Kelley, executive director of the Hearing Loss Association of America “Auracast™ broadcast audio is set to transform the way the world engages with wireless audio, enabling innovative new user experiences while delivering the next generation of assistive listening technology across a wide range of public venues. ABI Research expects the wireless and assistive listening industries to rapidly embrace LE Audio and Auracast™ technology, enabling more and more people to share their audio experiences with others, tune in to public broadcasts, and provide the hearing impaired with an easy to use, standardized, interoperable, and consistent assistive listening experience.” Andrew Zignani, Research Director at ABI Research “Train stations, airports and other public spaces with a lot of background noise can be challenging for people living with hearing loss. Understanding speech in these acoustically challenging environments requires technological support. Solutions such as Auracast™ broadcast audio can significantly improve the ability of people with hearing loss to communicate. Users of hearing aids or hearing implants will thus be able to move and orient themselves more easily and safely in their acoustic environment in the future. Participation and inclusion will be facilitated, and the overall quality of life will be enhanced.” Dr. Stefan Zimmer, Secretary General of the EHIMA “The impact of Bluetooth audio has been massive. A simple, wireless audio connection between two Bluetooth devices has helped make our roads safer, our lives more productive, and our relationship with music, podcasts, video streaming, and all types of personal audio more convenient and joyful. The launch of Auracast™ broadcast audio will trigger another massive change in the wireless audio market. The ability to broadcast and share audio using Bluetooth technology will reshape personal audio and enable public venues and spaces to deliver audio experiences that will improve visitor satisfaction and increase accessibility.” Mark Powell, CEO of the Bluetooth SIG “The ability to pair your smartphone to your earbuds or headphones using Bluetooth technology has brought new levels of enjoyment and convenience to personal audio and is now a part of the fabric of our lives. The introduction of Auracast™ broadcast audio will enable us to move from personal wireless listening experiences to shared wireless listening experiences, unlocking the full potential of wireless audio and bringing even more value and delight to our customers.” Zeng Xuezhong, Senior Vice President and President of Smartphone Department, Xiaomi Corporation “Bluetooth technology is extending its track record of innovation with the launch of Auracast™ broadcast audio. We are proud to work with the Bluetooth SIG and are excited to see this capability provide consumers with new, imaginative ways to connect with each other and hear their world.” Peter Liu, Pixel Ecosystem Products at Google Previous Next Related Resources Select Type... Blog Posts