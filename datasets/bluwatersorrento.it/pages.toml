title = "Privacy Policy"
full_description = "La presente informativa illustra le modalità e le finalità dei trattamenti di dati personali effettuate dal Titolare del trattamento. Saranno inoltre indicate le modalità di contatto per richiedere in ogni momento l’accesso, la modifica o l’eliminazione dei propri dati personali. La Privacy Policy si applica ogni volta che un Utente naviga attraverso le pagine del Sito web www.bluwatersorrento.it e per tutte le attività svolte online tramite esso. Il trattamento dei Dati Personali degli utenti del Sito sarà effettuato in Italia e condotto in osservanza al: A seguito della consultazione di questo Sito possono essere trattati dati relativi a persone identificate o identificabili. Il Titolare del trattamento di tali dati è: Blu Water Sorrento RestaurantVia P.R. Giuliani 35/3780067Sorrento(NA) - ItalyPhone:+39 081 057 5591Email: info@bluwatersorrento.itPiva: 05110031217 Ciascuna persona ha diritto alla protezione dei propri dati personali e nel rispetto di tale diritto la presente Privacy Policy fornisce ogni informazione utile per comprendere la modalità di raccolta e di utilizzo delle informazioni che identificano gli utenti del Sito. Il Titolare si impegna a rispettare un principio di stretta necessità nel trattamento dei dati che possono identificare la persona dell’Utente, anche indirettamente. Il Titolare non raccoglie e tratta in alcun modo “dati sensibili” in base alla definizione del Reg.UE 679/2016. I Dati Personali degli Utenti verranno trattati dal Titolare adottando le opportune misure di sicurezza volte ad impedire l’accesso, la divulgazione, la modifica o la distruzione non autorizzate dei Dati Personali. Il Sito è stato configurato affinché l'uso dei dati personali sia ridotto al minimo necessario ed fa uso di dati anonimi ogni qual volta sia possibile perseguire le medesime finalità. Il Titolare del Trattamento ed i titolari dei servizi terzi utilizzati da esso, ove non diversamente precisato, raccoglie i Dati dell’Utente con finalità strettamente legate all'erogazione dei propri Servizi."
