["https://bluwatersorrento.it/it/cookie-policy"]
title = "Cookie Policy"
full_description = "Un cookie è un piccolo file di testo che viene memorizzato dal computer nel momento in cui un sito web viene visitato da un utente. Il testo memorizza informazioni che il sito è in grado di leggere nel momento in cui viene consultato in un secondo momento. Alcuni di questi cookie sono necessari al corretto funzionamento del sito, altri sono invece utili al visitatore perché in grado di memorizzare in modo sicuro ad esempio il nome utente o le impostazioni di lingua. Il vantaggio di avere dei cookie installati nel proprio PC è quello di non aver più bisogno di compilare le stesse informazioni ogni qualvolta si voglia accedere ad un sito visitato in precedenza. Alcuni cookie sono estremamente utili perché possono rendere la navigazione più piacevole per l'utente quando visita un sito web già consultato altre volte. Se si utilizza lo stesso dispositivo e lo stesso browser, i cookie possono, ad esempio, ricordare le preferenze dell'utente, aiutarci a capire come utilizzare i nostri siti e rendere i contenuti visualizzati più pertinenti per gli interessi e le esigenze dell'utente. Nessuno dei cookie utilizzati da questo Siti Web raccoglie informazioni che identificano personalmente l'utente. Se si desidera modificare il modo in cui il browser utilizza i cookie, oppure bloccare o cancellare i cookie provenienti dal questo Sito Web (o qualsiasi altro sito), è possibile farlo cambiando le impostazioni del browser. Al fine di monitorare i cookie, la maggior parte dei browser consente all'utente di accettarli o rifiutarli tutti, accettarne solo alcuni tipi oppure, chiederà ogni volta se si desidera salvare un cookie di un sito in particolare. È altrettanto facile cancellare i cookie che sono già stati salvati dal browser sul dispositivo. Il processo per controllare ed eliminare i cookie varia a seconda del browser utilizzato. Per scoprire come fare con un browser in particolare, è possibile utilizzare la funzione Aiuto nel menù del tuo browser. Per limitare il ricevimento di cookie tramite il browser visita i seguenti siti per comprendere come impedire al tuo dispositivo di ricevere i cookie (a seconda del browser che adoperi): Firefox; Internet Explorer; Google Chrome e Safari. In alternativa visita uno dei seguenti siti: http://www.aboutcookies.org; http://www.allaboutcookies.org dove viene spiegato, passo dopo passo, come controllare ed eliminare i cookie nella maggior parte dei browser."
