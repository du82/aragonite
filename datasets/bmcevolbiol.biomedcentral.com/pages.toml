title = "Inferring the energy cost of resistance to parasitic infection and its link to a trade-off | BMC Ecology and Evolution | Full Text"
description = "Background In infected hosts, immune responses trigger a systemic energy reallocation away from energy storage and growth, to fuel a costly defense program. The exact energy costs of immune defense are however unknown in general. Life history theory predicts that such costs underpin trade-offs between host disease resistance and other fitness related traits, yet this has been seldom assessed. Here we investigate immune energy cost induced by infection, and their potential link to a trade-off between host resistance and fat storage that we previously exposed in sheep divergently selected for resistance to a pathogenic helminth. Results To this purpose, we developed a mathematical model of host-parasite interaction featuring individual changes in energy allocation over the course of infection. The model was fitted to data from an experimental infectious challenge in sheep from genetically resistant and susceptible lines to infer the magnitude of immune energy costs. A relatively small and transient immune energy cost in early infection best explained within-individual changes in growth, energy storage and parasite burden. Among individuals, predicted responses assuming this positive energy cost conformed to the observed trade-off between resistance and storage, whereas a cost-free scenario incorrectly predicted no trade-off. Conclusions Our mechanistic model fitting to experimental data provides novel insights into the link between energy costs and reallocation due to induced resistance within-individual, and trade-offs among individuals of selected lines. These will be useful to better understand the exact role of energy allocation in the evolution of host defenses, and for predicting the emergence of trade-offs in genetic selection."
full_description = 'Research Open access Published: 28 January 2025 Inferring the energy cost of resistance to parasitic infection and its link to a trade-off Frédéric Douhard1, Carole Moreno-Romieux1 & Andrea B. Doeschl-Wilson2 BMC Ecology and Evolution volume 25, Article number: 14 (2025) Cite this article 255 Accesses Metrics details AbstractBackgroundIn infected hosts, immune responses trigger a systemic energy reallocation away from energy storage and growth, to fuel a costly defense program. The exact energy costs of immune defense are however unknown in general. Life history theory predicts that such costs underpin trade-offs between host disease resistance and other fitness related traits, yet this has been seldom assessed. Here we investigate immune energy cost induced by infection, and their potential link to a trade-off between host resistance and fat storage that we previously exposed in sheep divergently selected for resistance to a pathogenic helminth.ResultsTo this purpose, we developed a mathematical model of host-parasite interaction featuring individual changes in energy allocation over the course of infection. The model was fitted to data from an experimental infectious challenge in sheep from genetically resistant and susceptible lines to infer the magnitude of immune energy costs. A relatively small and transient immune energy cost in early infection best explained within-individual changes in growth, energy storage and parasite burden. Among individuals, predicted responses assuming this positive energy cost conformed to the observed trade-off between resistance and storage, whereas a cost-free scenario incorrectly predicted no trade-off.ConclusionsOur mechanistic model fitting to experimental data provides novel insights into the link between energy costs and reallocation due to induced resistance within-individual, and trade-offs among individuals of selected lines. These will be useful to better understand the exact role of energy allocation in the evolution of host defenses, and for predicting the emergence of trade-offs in genetic selection. Peer Review reports BackgroundThe costs of immunity remain a central and long-standing question in evolutionary ecology, medical and animal sciences [1,2,3]. In particular, a fundamental life history assumption is that the evolution of host defense strategies against pathogens critically depends on energy and other nutrient costs to deploy an immune response [4, 5]. Immune costs induced upon infection have also been associated with a diversion of nutritional energy away from storage, reproductive and growth processes in order to meet the concurrent energy demands of the infected host [6,7,8]. According to the allocation hypothesis, such energy reallocation could instigate trade-offs between host resistance (i.e. the ability to limit within-host pathogen replication) and other fitness-related traits such as growth or reproduction [9, 10]. In particular, those trade-offs are expected to arise when energy supply falls short, such as during infection-induced anorexia [11, 12]. However, in many cases trade-offs are not detected [13,14,15,16,17,18], putting the concept of costly immune defense into question [19].Trade-offs can be undetected when hosts manage to mitigate the negative fitness consequences of an energy costly immune response. For instance, hosts can simultaneously adjust their energy intake or other components of their energy budget to meet the extra energy demand of immune activation [20]. Yet, quantifying the immune energy demand remains challenging. Most previous attempts have relied on changes in the rate of energy use for basal metabolism (e.g. resting metabolic rate) in infected hosts [7, 21, 22]. However, even though infection should lead to an increase in metabolic rate, the direction and the magnitude of this effect seem actually highly inconsistent across studies and host-parasite systems [23]. In some cases, hosts even enter into an hypometabolic state along with infection-induced anorexia to promote particular resistance [24] or tolerance mechanisms [12]. In certain of those situations, negative effects on fitness-related traits seem to be primarily caused by this reduction in intake rather by the energy costs of immune deployment [25, 26]. Furthermore, since metabolic trajectories after pathogen exposure strongly depend on host-parasite dynamics [27], it is increasingly clear that attempts to measure the costs of immune activation should consider the changes in energy intake and energy expenditure triggered by the immune response over the course of infection.In this study, we investigated host resistance dynamics, assuming that the level of resistance reflects the strength of an immune response deployed by the host. Under this assumption, we investigated energy-allocation trade-offs involving host resistance by answering two questions: (Q1) Does host resistance entail a substantial induced energy cost over the course of a parasitic infection in a vertebrate host? (Q2) If so, does this energy cost conform to an observed trade-off between host resistance and fat storage?To this purpose, we used experimental data of domestic sheep artificially challenged with the blood-feeding gastrointestinal nematode Haemonchus contortus. In this model system, complex immune effector mechanisms [28,29,30] confer genetic differences in host resistance to infection [13, 15]. In our studies, hosts were from lines divergently selected for resistance to short-term infectious challenge with H. contortus, so that responses of resistant (R) and susceptible (S) hosts should reflect a genetic difference in the strength of induced immunity against this specific parasite [31]. We previously detected a trade-off among lines between host resistance (using parasite fecal egg counts (\(\text{FEC}\)) as proxy) and the gain in fat reserves (using backfat thickness (\(BFT\)) as proxy), with the R line having significantly lower \(FEC\) and lower \(BFT\) than the S line [32]. However, a statistical analysis of the traits dynamics observed during the infection (Fig. 1Ai-v) could not determine if the reduced fat accumulation of R sheep compared with S sheep can be fully explained by their lower feed intake (i.e. without the need to divert energy from fat storage towards immunity to satisfy immune energy costs), or if it partly resulted from an energy allocation away from fat deposition to parasite-specific, potentially costly, immunity. It is not a priori obvious which of the two scenarios would best conform to the observed trade-off (Fig. 1B). In this study we developed a mechanistic mathematical model of host-parasite interactions featuring dynamic changes in energy allocation. We fitted this model to the experimental data to answer the biological questions above. Thereby, we tested two alternative hypotheses (Fig. 1B): (H1) there are non-negligible immune energy costs associated with host resistance, and the observed lower fat storage in the R line is the consequence of energy allocated away from fat storage to immunity to meet the higher immune energy demands in the R line, vs. (H0) immune energy costs are negligible, and the observed lower fat storage in the R line is the direct consequence of the more strongly reduced feed intake as a by-product of infection.Fig. 1Experimental data integrated in this study to infer the energy cost of immunity. A Data represent responses to a parasitic challenge (10,000 third-stage larvae of Haemonchus contortus per animal given orally) observed in growing female sheep resistant (R; n = 21) or susceptible (S; n = 21) to infection with H. contortus. It supports a trade-off between host resistance (i, ii) and the gain in fat reserves (iv), possibly mediated by feed intake in early infection (v). In addition, an energy cost of parasite-specific immunity may contribute to the trade-off between lines (hypothesis H1), or not (hypothesis H0). B To test hypotheses H0 and H1, a dynamic mechanistic model of energy budget coupled with host–pathogen interaction was fitted individually to the observed data. Fig Ai-v were modified from [32]. Points represent adjusted means with their error bars representing 95% confidence interval and asterisks indicate statistical difference between lines (ns: p > 0.1; †: p < 0.1; *: p < 0.05; **: p < 0.01; ***: p < 0.001)Full size imageMethodsInference approach and hypothesesTo test hypotheses H0 and H1, we combined previous experimental data with dynamic mathematical modelling. In brief, we developed two dynamic mechanistic models: one of host energy budget (using energy intake as a known model input) and one of host-parasite interaction, that were interconnected through a varying, potentially null, energy flow from feed to immunity (\({E}_{immunity}\)) (see details in Model description). The coupled model (Fig. 2) was fitted to longitudinal data for each individual sheep (n = 42) allowing for individual variation in two virtual immune responses associated to specific stages of nematode infection [28, 30]: one acting early against larvae establishment (\({I}_{E}\)) and one acting later against parasite fecundity (\({I}_{F}\)). The unknown unitary energy cost associated with these responses (\({e}_{{I}_{E}}\) and \({e}_{{I}_{F}}\), respectively) were used to test H0 and H1. They were assumed constant among individuals, just like the energy costs for maintenance, lipid and protein biosynthesis known from the literature [33]. Energy allocated to immunity was thus defined as \({E}_{immunity}= {e}_{{I}_{E}}\cdot {I}_{E} + {e}_{{I}_{F}}\cdot {I}_{F}\).Fig. 2Conceptual diagram of the host-parasite model coupled with a model of host energy budget to estimate the energy cost of immune responses from experimental dataFull size imageBy fitting the mechanistic model to the data, immune energy costs and the value of other parameters controlling the strength of \({I}_{E}\) and \({I}_{F}\) were inferred. In support of H1, we predicted that: (i) positive values of population energy cost parameters \({e}_{{I}_{E}}\) and \({e}_{{I}_{F}}\) best explain the observed data, (ii) the R and S lines differ in terms of energy allocation strategies between host resistance (\({E}_{immunity}\)) and host growth during infection, (iii) individual parameters controlling the strength of \({I}_{E}\) and \({I}_{F}\) differ between the R and S lines, (iv) energy allocation can generate a trade-off between host resistance and fat reserves, and (v) individual growth parameters out-of-infection do not differ between lines. Experimental dataWe used data from an artificial infestation experiment in growing female lambs from two lines divergently selected for resistance to H. contortus. Both lines originated from a prolific meat sheep breed (Romane) bred indoor at INRAE experimental facilities. Sheep were selected on their resistance to parasites based on \(FEC\) measures, following a unique protocol comprising two successive infections as outlined in detail in [34]. In the initial population, 274 naïve lambs were infected with a single dose of 10,000 third stage larvae (L3) of H. contortus to stimulate a primary immune response; 4 weeks later they were treated (0.2 mg/kg of live weight of ivermectin; Oramec, Boerhinger Ingelheim, Lyon, France); after 2 weeks of recovery they were re-infected with a single dose of 10,000 L3 to simulate a secondary immune response and finally treated 5 weeks later. At the end of first and second infection, \(FEC\) was recorded just before treatment and those measures were combined to estimate animal breeding values for resistance used as selection criterion to generate the two divergently selected lines.This study then used data from 42 ewe lambs from the second generation (G2) of divergent selection for resistance (R = low \(FEC\), n = 21) or susceptibility (S = high \(FEC\), n = 21). At G2, the divergence in \(FEC\) between R and S sheep reached a 1.9 phenotypic SD (σp) and 3.8 genetic SD (σg) from the mean \(FEC\) of initial population (G0). Specifically, female G2 lambs were infected early to stimulate a primary immune response, and again at 4 months of age, following the same infection protocol as described above, except that the first dose was of 3,500 L3/sheep to limit the potential negative consequences of infection on fertility at first mating (at 8–9 months of age). During the infection, lambs were fed ad libitum with a protein-rich concentrate (176.6 g of crude protein/kg of dry matter) and straw so that protein was not nutritionally limiting compared with energy. The longitudinal data collected during the second infection were then used in this study to calibrate the host-parasite interaction model. Data included voluntary concentrate intake (in kg/d; measured daily with automatic feeders) and five other traits measured at day 0, 17, 24, 28, 31, and 35 post-infection: \(FEC\) (in egg/g; measured by the modified McMaster technique), blood haematocrit (in %; measured by microhaematocrit centrifugation technique), body weight (in kg), back fat thickness (\(BFT\), in mm; measured by ultrasound scan on both sides at the 12th– 13th lumbar vertebra (Easi- Scan™, IMV imaging)). Those traits could be linked to the model as shown in Fig. 1. \({E}_{intake}\) was estimated from concentrate intake and diet characteristics (Table 1) assuming that concentrate was the main source of feed energy (i.e. straw intake was considered as negligible). Table 1 List of model parametersFull size tableModel descriptionOverviewIn accordance with experimental data, the model represents a growing non-reproducing sheep fed ad libitum with a protein-rich diet, infected with a single dose of L3 (Fig. 2). Both the infection challenge dose and energy intake are assumed to be known and can be used as a model input. The host-parasite system includes two components: the parasite development within the host (from third stage infective larvae \(LI\) to reproducing adults \(Am\) and\({Af}_{NL}\)), and the host immune responses against the infection. As for prey-predator models [41], these two components interact dynamically as parasitic load triggers the immune responses which in turn, act on parasite development. The immunological mechanisms by which animals have or acquire resistance to haemonchosis are highly complex and still largely unraveled [28]. Here the two latent immune response variables, \({I}_{E}\) and \({I}_{F}\) reflect an action on two key stages of parasite development: \({I}_{E}\) limits the establishment of infective L3 larvae (\({k}_{E}\)), and, \({I}_{F}\) limits the reproductive maturation of adult females (\({k}_{F}\))).For modelling energy budget, we assumed that protein accretion (\(P\)) to reach mature size drives body growth and remains unaffected by the early stages of infection. Indeed, dietary protein supplementation is known to favor the development of immunity [42, 43] but this type of effect only seems to occur once the nutritiona'
