title = "Pelage variation and morphometrics of closely related Callithrix marmoset species and their hybrids | BMC Ecology and Evolution | Full Text"
description = "Background Hybrids are expected to show greater phenotypic variation than their parental species, yet how hybrid phenotype expression varies with genetic distances in closely-related parental species remains surprisingly understudied. Here, we investigate pelage and morphometric trait variation in anthropogenic hybrids between four species of Brazilian Callithrix marmosets, a relatively recent primate radiation. Marmoset species are distinguishable by pelage phenotype and morphological specializations for eating tree exudates. In this work, we (1) describe qualitative phenotypic pelage differences between parental species and hybrids; (2) test whether significant quantitative differences exist between parental and hybrid morphometric phenotypes; and (3) determine which hybrid morphometic traits show heterosis, dysgenesis, trangression, or intermediacy relative to the parental trait. We investigated cranial and post-cranial morphometric traits, as most hybrid morphological studies focus on the former instead of the latter. Finally, we estimate mitogenomic distances between marmoset species from previously published data. Results Marmoset hybrid facial and overall body pelage variation reflected novel combinations of coloration and patterns present in parental species. In morphometric traits, C. jacchus and C. penicillata were the most similar, while C. aurita was the most distinct, and C. geoffroyi trait measures fell between these species. Only three traits in C. jacchus x C. penicillata hybrids showed heterosis. We observed heterosis and dysgenesis in several traits of C. penicillata x C. geoffroyi hybrids. Transgressive segregation was observed in hybrids of C. aurita and the other species. These hybrids were also C. aurita-like for a number of traits, including body length. Genetic distance was closest between C. jacchus and C. penicillata and farthest between C. aurita and the other species. Conclusion We attributed significant morphometric differences between marmoset species to variable levels of morphological specialization for exudivory in these species. Our results suggest that intermediate or parental species-like hybrid traits relative to the parental trait values are more likely in crosses between species with relatively lesser genetic distance. More extreme phenotypic variation is more likely in parental species with greater genetic distance, with transgressive traits appearing in hybrids of the most genetically distant parental species. We further suggest that fewer developmental disturbances can be expected in hybrids of more recently diverged parental species, and that future studies of hybrid phenotypic variation should investigate selective pressures on Callithrix cranial and post-cranial morphological traits."
full_description = "Research Open access Published: 20 September 2024 Pelage variation and morphometrics of closely related Callithrix marmoset species and their hybrids Joanna Malukiewicz1,2 na1, Kerryn Warren3,4 na1, Vanner Boere5, Illaira L. C. Bandeira6, Nelson H. A. Curi7, Fabio T. das Dores8, Lilian S. Fitorra8, Haroldo R. Furuya8, Claudia S. Igayara9, Liliane Milanelo8, Silvia B. Moreira10, Camila V. Molina11, Marcello S. Nardi12, Patricia A. Nicola13, Marcelo Passamani14, Valeria S. Pedro8, Luiz C. M. Pereira6, Bruno Petri8, Alcides Pissinatti10, Adriana Alves Quirino6, Jeffrey Rogers15, Carlos R. Ruiz-Miranda16, Daniel L. Silva17, Ita O. Silva5, Monique O. M. Silva18, Juliana L. Summa12, Ticiana Zwarg12 & …Rebecca R. Ackermann3,4 Show authors BMC Ecology and Evolution volume 24, Article number: 122 (2024) Cite this article 930 Accesses 3 Altmetric Metrics details AbstractBackgroundHybrids are expected to show greater phenotypic variation than their parental species, yet how hybrid phenotype expression varies with genetic distances in closely-related parental species remains surprisingly understudied. Here, we investigate pelage and morphometric trait variation in anthropogenic hybrids between four species of Brazilian Callithrix marmosets, a relatively recent primate radiation. Marmoset species are distinguishable by pelage phenotype and morphological specializations for eating tree exudates. In this work, we (1) describe qualitative phenotypic pelage differences between parental species and hybrids; (2) test whether significant quantitative differences exist between parental and hybrid morphometric phenotypes; and (3) determine which hybrid morphometic traits show heterosis, dysgenesis, trangression, or intermediacy relative to the parental trait. We investigated cranial and post-cranial morphometric traits, as most hybrid morphological studies focus on the former instead of the latter. Finally, we estimate mitogenomic distances between marmoset species from previously published data.ResultsMarmoset hybrid facial and overall body pelage variation reflected novel combinations of coloration and patterns present in parental species. In morphometric traits, C. jacchus and C. penicillata were the most similar, while C. aurita was the most distinct, and C. geoffroyi trait measures fell between these species. Only three traits in C. jacchus x C. penicillata hybrids showed heterosis. We observed heterosis and dysgenesis in several traits of C. penicillata x C. geoffroyi hybrids. Transgressive segregation was observed in hybrids of C. aurita and the other species. These hybrids were also C. aurita-like for a number of traits, including body length. Genetic distance was closest between C. jacchus and C. penicillata and farthest between C. aurita and the other species.ConclusionWe attributed significant morphometric differences between marmoset species to variable levels of morphological specialization for exudivory in these species. Our results suggest that intermediate or parental species-like hybrid traits relative to the parental trait values are more likely in crosses between species with relatively lesser genetic distance. More extreme phenotypic variation is more likely in parental species with greater genetic distance, with transgressive traits appearing in hybrids of the most genetically distant parental species. We further suggest that fewer developmental disturbances can be expected in hybrids of more recently diverged parental species, and that future studies of hybrid phenotypic variation should investigate selective pressures on Callithrix cranial and post-cranial morphological traits. Peer Review reports BackgroundHybridization occurs under both natural and anthropogenic contexts, with the former occurring in about 10% of animal species [1], and with the latter increasing between previously isolated populations [2,3,4]. Our understanding of the genomic consequences of animal hybridization has grown considerably (e.g. [4,5,6,7]), and the range of hybridization outcomes include but are not limited to hybrid speciation (the origin of a new species via hybridization between two distinct species), genetic swamping (maladaptive gene flow from central populations into peripheral populations [8]), adaptive introgression (the incorporation of a foreign genetic variant via hybridization from a donor pool that leads to an increase of the fitness of the recipient pool [9]), or extinction (the termination of a genetic lineage) [5,6,7]. Hybridization also impacts morphological traits [10,11,12]. Studies of hybrid morphology to date have primarily focused on craniofacial features, but we still possess knowledge gaps in how hybridization manifests itself in post-cranial anatomy [12]. Given the importance of post-cranial morphology in locomotion and reproduction and that different selective forces likely act on post-cranial and cranial morphology [13], hybrids may express cranial traits differently than post-cranial traits. Animal hybrid morphology studies also feature a single pair of parental species and the resulting hybrids (e.g. [10, 14,15,16,17,18,19]), but there is also interest in understanding how the hybrid phenotype varies with the genetic distances between closely-related parental species [10, 20].Hybrids are expected to show a more variable array of morphological phenotypes than their parental species [10, 21]. Hybrids can resemble one of their parental species, either in terms of a single trait or as a whole, can be heterotic or dysgenetic relative to the parents (measured as positive or negative deviation from a mid-point value), or can display transgressive traits (i.e. outside of the range of parental variation) [10, 21, 22]. The cumulative effects of gene interactions (dominance and epistasis), parental species temporal divergence, and allele frequency differences between parental species are all thought to underlie morphological phenotypic variation in hybrids [21]. Intermediate traits are explained by a standard polygenic model with additive effects, which is expected for species with small allele frequency differences [10, 21]. However, isolated parental populations with different fixed alleles are expected to produce heterotic hybrids [10, 21]. Dysgenesis is predicted for more distantly related taxa and represents a breakdown of ’coadapted gene complexes’ between the parental species [10, 21]. Transgressive traits seem to be related to complementary gene action of antagonistic quantitative trait loci [23, 24]. Thus, the frequency of heterosis, dysgenesis, and trangressive segregation in hybrid populations should increase with greater genetic distance between parental species, as longer divergence times allow for more fixation of complementary alleles in parental populations.As pointed out by Ackermann [10], a lingering question about the evolutionary importance of hybrid phenotypic expression is “to what extent might differences in the expression of hybrid traits exist due to degree of temporal divergence?” One key study which looked at the phenotypic effects of hybridization in pairs of parental species within a wide range of genetic distance was conducted experimentally on cichlid fish [20], and there was a particular interest in transgressive traits in this work. In F1 hybrids, the relationship between the frequency of transgressive segregation and level of parental species genetic difference had a concave shape while in F2 hybrids the amount of hybrid transgression increased linearly with parental species genetic distance [20]. However, beyond such work, hybrid expression of morphological traits across interbreeding species with variable genetic difference, particularly in non-experimental animal populations, remains understudied.Primates are one animal group where hybridization is estimated to occur among 7-10% of species [25], and the recent radiation of Brazilian Callithrix marmoset makes an excellent model for characterizing hybridization effects between closely-related species with variable degrees of temporal divergence. The two phylogenetic subgroups that compose the Callithrix genus, the “aurita” group (C. aurita and C. flaviceps) and the “jacchus” group (C. kuhlii, C. geoffroyi, C. jacchus, C. penicillata), diverged about 3.5 million years ago (Ma) [26]. Within the jacchus group, C. jacchus and C. penicillata are the most recently diverged at 0.51 Ma, followed by C. kuhlii at 0.82 Ma, and C. geoffroyi at 1.18 Ma [27]. Callithrix species are distinguishable from each other based on level of morphological specialization for eating tree gums and exudates (ie. exudivory), facial and overall body pelage patterns and coloration, and peri-auricular ear-tuft shape and color [27]. Limited Callithrix hybridization already occurs naturally between certain pairs of Callithrix species like C. jacchus and C. penicillata under secondary contact at species range boundaries, however the illegal pet trade has dramatically increased anthropogenic Callithrix hybridization relatively to natural conditions [26,27,28].Thus far, most studies of hybrid Callithrix phenotypes are based on qualitative descriptions of pelage differences between hybrids and their parental species [29,30,31,32,33,34]. Only Fuzessy et al. [35] and Cezar et al. [36] have tested theoretical expectations of hybrid phenotypic diversity in C. geoffroyi x C. penicillata and C. jacchus x C. penicillata hybrids, respectively. Here, we build upon these previous studies by examining cranial and post-cranial metric variation among four marmoset species (C. aurita, C. jacchus, C. geoffroyi, C. penicillata) along with their hybrids in individuals sampled in the wild or in captivity. Our study represents the largest marmoset morphological sampling to date in terms of hybrid sample number and types of hybrids.Our main study aims are to : (1) describe qualitative pelage phenotypic differences between parental species and hybrids; (2) test whether significant quantitative differences exist between parental and hybrid marmoset phenotypes; (3) quantify whether and how hybrid phenotypic variation differs relative to parental species (i.e., intermediate, heterotic, dysgenetic, or transgressive); and (4) investigate how aims 2 and 3 vary with differential parental species’ genetic distance, which we use as a proxy for temporal divergence. We estimated genetic distances between marmoset species from previously published mitogenomic data that include a subset of our samples [26]. Based on these aims, our first hypothesis is that the highest occurrence of intermediate morphological traits exists between C. jacchus and C. penicillata hybrids, as their parental species are the two most recently diverged within Callithrix. Given longer divergence times between jacchus and aurita group species than between jacchus group species, we hypothesize that dysgenetic and/or transgressive traits appear more frequently in hybrids of the former than in the latter set of species.MethodsSamplingOur samples consisted of 209 adult individuals (Table 1, Fig. 1 and Supplementary Table S1) from four Callithrix species (C. aurita, C. geoffroyi, C. jacchus, C. penicillata) as well as several hybrid types (C. aurita x Callithrix sp., C. penicillata x C. geoffroyi, C. penicillata x C. jacchus, Callithrix sp. x Callithrix sp). Following Yamamoto [37] observations of dental characteristics and genitalia growth in marmosets, animals between 5 and 10 months old were classified as juveniles, while those older than 11 months were considered adults. We excluded all non-adult individuals from the phenotypic and morphological analyses described below. Table 1 Marmoset sample size by taxon. “N” represents the number of individuals sampled for each given taxonFull size tableFig. 1Marmoset sampling locations. Sampling locations are indicated by different color symbols, and the approximate natural distribution of Callithrix species in Brazil are identified by different colors. The distribution maps are based on 2012 IUCN Red List Spatial Data (http://www.iucnredlist.org/technical-documents/spatial-data). The locations of the three biomes where Callithrix occur naturally, the Caatinga, Cerrado, and Atlantic Forest, are also indicated with different patterningFull size imageMarmosets were sampled between 2015 and 2019 as follows: (1) wild marmosets in Bahia, Espírito Santo, Minas Gerais, Rio de Janeiro, Pernambuco, and São Paulo states; (2) captive-born, wild-caught, and confiscated marmosets housed at the Guarulhos Municipal Zoo, Guarulhos, São Paulo, CEMAFAUNA (Centro de Manejo de Fauna da Caatinga), Petrolina, Pernambuco, CPRJ (Centro do Primatologia do Rio de Janeiro), Guapimirim, Rio de Janeiro, Parque Ecolôgico do Tietê (PET), São Paulo, SP, and Divisão Técnica de Medicina Veterinária e Manejo da Fauna Silvestre (DEPAVE-3), São Paulo, SP; (3) a wild group from Natividade, Rio de Janeiro that was caught and housed at CPRJ; and (4) a wild group from Ilha D’Agua, Rio de Janeiro, RJ housed at SERCAS (Setor de Etologia aplicada Ã Reintrodução e Conservação de Animais Silvestres), Campos dos Goytacazes, RJ. Marmoset capture methodology has been described elsewhere [34]. All individuals were allowed to recover after sample collection, and wild marmosets were released at their original point of capture. To minimize the chance of repeatedly sampling the same individual, sampling of marmosets at each wild location was only conducted once. In captive facilities, we consulted with on-site staff and records kept on each sampled marmoset to correctly identify and sample each unique individual once.Phenotyping of Callithrix species and hybrids (Aim 1)Using the approach developed in Fuzessy et al. [35], marmoset facial markings and pelage characteristics were used to phenotypically differentiate between species and hybrids (Supplementary Figure S1). Defining facial and pelage characteristics from each species and hybrid type were based on published descriptions [28, 30, 34, 35, 38] and personal observations by JM and CSI. Phenotypes of hybrids classified as C. aurita hybrids suggest that these individuals possess ancestry from C. aurita and at least one species from the jacchus group [28, 38]. Previous phylogenetic analysis of mitogenomic haplotypes assigned to a subset of C. aurita hybrids used in our sample also support C. aurita x jacchus group ancestry in these individuals (BJT024/C. aurita mitogenome, BJT025/C. jacchus mitogenome, BJT026/C. penicillata mitogenome, BJT027/C. geoffroyi mitogenome, BJT115/C. aurita mitogenome) [27]. The putative parental species of two hybrids were not able to be determined phenotypically due to ambigious phenotypes, and the hybrids were therefore classified as Callithrix sp. x Callithrix sp. For one of these hybrids, BJT070, it was shown in a previous phylogenetic study based on mitogenomes that this individual has ancestry from C. geoffroyi [27].Quantitative testing of morphometric tr"
