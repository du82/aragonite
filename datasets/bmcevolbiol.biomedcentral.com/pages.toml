title = "The adult shell matrix protein repertoire of the marine snail Crepidula is dominated by conserved genes that are also expressed in larvae | BMC Ecology and Evolution | Full Text"
description = "Mollusca is a morphologically diverse phylum, exhibiting an immense variety of calcium carbonate structures. Proteomic studies of adult shells often report high levels of rapidly-evolving, ‘novel’ shell matrix proteins (SMPs), which are hypothesized to drive shell diversification. However, relatively little is known about the phylogenetic distribution of SMPs, or about the function of individual SMPs in shell construction. To understand how SMPs contribute to shell diversification a thorough characterization of SMPs is required. Here, we build tools and a foundational understanding of SMPs in the marine gastropod species Crepidula fornicata and Crepidula atrasolea because they are genetically-enabled mollusc model organisms. First, we established a staging system of shell development in C. atrasolea for the first time. Next, we leveraged previous findings in C. fornicata combined with phylogenomic analyses of 95 metazoan species to determine the evolutionary lineage of its adult SMP repertoire. We found that 55% of C. fornicata’s SMPs belong to molluscan orthogroups, with 27% restricted to Gastropoda, and only 5% restricted at the species level. The low percentage of species-restricted SMPs underscores the importance of broad-taxon sampling and orthology inference approaches when determining homology of SMPs. From our transcriptome analysis, we found that the majority of C. fornicata SMPs that were found conserved in C. atrasolea were expressed in both larval and adult stages. We then selected a subset of SMPs of varying evolutionary ages for spatial-temporal analysis using in situ hybridization chain reaction (HCR) during larval shell development in C. atrasolea. Out of the 18 SMPs analyzed, 12 were detected in the larval shell field. These results suggest overlapping larval vs. adult SMP repertoires. Using multiplexed HCR, we observed five SMP expression patterns and three distinct cell populations within the shell field. These patterns support the idea that modular expression of SMPs could facilitate divergence of shell morphological characteristics. Collectively, these data establish an evolutionary and developmental framework in Crepidula that enables future comparisons of molluscan biomineralization to reveal mechanisms of shell diversification."
full_description = "Research Open access Published: 14 September 2024 The adult shell matrix protein repertoire of the marine snail Crepidula is dominated by conserved genes that are also expressed in larvae Rebecca N. Lopez-Anido1,2 na1, Grant O. Batzel1 na1, Gabriela Ramirez1, Yiqun Wang1, Stephanie Neal1, Maryna P. Lesoway1, Jessica A. Goodheart2 & …Deirdre C. Lyons1 Show authors BMC Ecology and Evolution volume 24, Article number: 120 (2024) Cite this article 1025 Accesses 1 Altmetric Metrics details AbstractMollusca is a morphologically diverse phylum, exhibiting an immense variety of calcium carbonate structures. Proteomic studies of adult shells often report high levels of rapidly-evolving, ‘novel’ shell matrix proteins (SMPs), which are hypothesized to drive shell diversification. However, relatively little is known about the phylogenetic distribution of SMPs, or about the function of individual SMPs in shell construction. To understand how SMPs contribute to shell diversification a thorough characterization of SMPs is required. Here, we build tools and a foundational understanding of SMPs in the marine gastropod species Crepidula fornicata and Crepidula atrasolea because they are genetically-enabled mollusc model organisms. First, we established a staging system of shell development in C. atrasolea for the first time. Next, we leveraged previous findings in C. fornicata combined with phylogenomic analyses of 95 metazoan species to determine the evolutionary lineage of its adult SMP repertoire. We found that 55% of C. fornicata’s SMPs belong to molluscan orthogroups, with 27% restricted to Gastropoda, and only 5% restricted at the species level. The low percentage of species-restricted SMPs underscores the importance of broad-taxon sampling and orthology inference approaches when determining homology of SMPs. From our transcriptome analysis, we found that the majority of C. fornicata SMPs that were found conserved in C. atrasolea were expressed in both larval and adult stages. We then selected a subset of SMPs of varying evolutionary ages for spatial-temporal analysis using in situ hybridization chain reaction (HCR) during larval shell development in C. atrasolea. Out of the 18 SMPs analyzed, 12 were detected in the larval shell field. These results suggest overlapping larval vs. adult SMP repertoires. Using multiplexed HCR, we observed five SMP expression patterns and three distinct cell populations within the shell field. These patterns support the idea that modular expression of SMPs could facilitate divergence of shell morphological characteristics. Collectively, these data establish an evolutionary and developmental framework in Crepidula that enables future comparisons of molluscan biomineralization to reveal mechanisms of shell diversification. Peer Review reports BackgroundCalcium carbonate biomineralization is a significant innovation in the evolution of divergent body forms, and is thought to have evolved independently at least 20 times in metazoans (Fig. 1A) [1,2,3]. Within the phylum Mollusca alone it is hypothesized that calcium carbonate biomineralization evolved multiple times, contributing to a rich diversity of shell shape, size, color, microstructure, and mineral content (Fig. 1B) [4,5,6,7,8,9,10]. During molluscan shell biomineralization, specialized epithelial cells in the mantle tissue secrete organic materials into an enclosed extrapallial space, including polysaccharides, proteoglycans, and shell matrix proteins (SMPs) [11, 12]. Secreted SMPs self-assemble to create an extracellular matrix that facilitates the precipitation of calcium carbonate, and SMPs become occluded in the shell [13,14,15]. Shell proteomic comparative studies have identified only a few SMPs with homologs across molluscan species [16], suggesting that SMP repertoires include many rapidly evolving, lineage-specific proteins [5, 17]. The presence of lineage-specific SMPs has led to the hypothesis that at the protein structure level, SMP diversity may have driven shell diversification and contributed to the acquisition of novel shell morphologies [6, 12, 18]. One approach to test this hypothesis is to (1) identify a species’ SMP repertoire through proteomics, (2) determine the evolutionary age of its SMPs, (3) determine the spatiotemporal expression patterns of the SMPs across life history stages, and (4) functionally perturb conserved and lineage-restricted SMP gene products to assess the morphological consequences of losing specific SMPs. All four lines of analysis should be feasible in the same organism. Two such species are the marine slipper snails Crepidula fornicata and Crepidula atrasolea [19,20,21,22]. In the present study we determine the evolutionary age of all known C. fornicata SMPs and examine the expression patterns for a subset of lineage-specific SMPs during larval shell development. These results set the stage for future work to determine how SMPs may contribute to novel shell morphology and evolution.Fig. 1Crepidula fornicata and Crepidula atrasolea are complementary model systems for biomineralization. Phylogeny of calcium carbonate biomineralization throughout the Metazoa (A; Gilbert et al. 2022) and the Mollusca (B; Kocot et al. 2020). Triangles indicate taxa that produce calcium carbonate skeletons; squares indicate taxa that have a published biomineral proteome as of 2023; circles indicate taxa that have conducted in situ hybridization for shell matrix proteins (SMPs). Comparison of indirect larval development in C. fornicata vs. direct development in C. atrasolea (C). Adult shells of the two species (D). Organism silhouettes are from PhyloPic (www.phylopic.org) with the exception of Crepidula and PolyplacophoraFull size imageWhile many studies examine SMPs that are occluded in adult shells, it is also important to study SMPs that are occluded in the larval shell. In gastropods, larval shell formation begins after gastrulation when the posterior dorsal epithelium thickens and becomes known as the shell field [23]. In the literature, “shell field” and “larval mantle” both refer to the larval tissues responsible for shell formation [23,24,25,26]. The shell field (which will eventually mature into the adult mantle tissue) secretes SMPs throughout larval development when shell morphology is first established [23]. Larval shells and adult shells can differ in microstructure, mineral content, and SMP composition [27,28,29,30]. Most studies identify SMPs use adult shells as the source material and relatively few studies focus on comparing SMP repertoires at different life history stages. While several studies highlight differences in the SMP content of larval vs. adult shells (e.g. in bivalves [29,30,31], similarities have also been identified. For example, we recently showed that several of the most highly-expressed adult C. fornicata SMPs are also expressed in the larval shell field [19]. Although functional perturbation is required to conclusively determine gene function, the expression of adult SMPs in the larval shell field is highly suggestive of a role in shell biomineralization. By examining SMPs during larval shell development, when shell morphology is first established, we can study the role of SMPs in the acquisition of new shell morphologies and shell diversity over developmental time. The deployment of SMPs during development could change over evolutionary time scales, contributing to shell diversity.Shell diversification may also rely on the division of the mantle tissue into discrete regions of SMP expression, with each region responsible for producing specific shell characteristics [24, 32]. Distinct regions of SMP expression within the mantle have been observed in multiple molluscan species [24, 33, 34]. For example, in adult bivalves, SMPs involved in nacreous-layer formation are found in the dorsal region of the mantle epithelium [34, 35], whereas SMPs implicated in prismatic-layer biomineralization are localized to the ventral portion of the mantle epithelium [36, 37]. The initial regionalization of SMPs during larval shell development could enable adult mantle modularity, and modularity has been hypothesized to drive novel shell features [32]. One could imagine that if an SMP responsible for prismatic-layer biomineralization is expressed in a new region within the shell field, that could result in a novel shell microstructure, promoting shell diversification [32]. To further explore such possibilities, we need to account for how the evolutionary age of an SMP relates to its expression domain within the shell field or mantle. For example, if lineage-restricted SMPs are responsible for specialized shell characteristics, perhaps they are localized to specific regions of the shell field. Likewise, a reasonable hypothesis is that conserved SMPs, which contribute to fundamental processes of biomineralization (e.g. calcium-regulation), may be more broadly expressed in shell field cells compared to lineage-restricted SMPs.To understand how conserved vs. lineage-restricted SMPs might contribute to shell construction and diversification, accurate estimates of the evolutionary ages of SMPs are necessary. However, a finding from multiple proteomic comparisons of SMPs using BLAST approaches is that homologs could not be identified between the shell proteomes of different species [34, 38, 39]. One main conclusion stemming from the lack of homology in BLAST hits was that SMPs were deemed highly “lineage-specific”, meaning they were found only within a particular clade [36, 40, 41]. In many cases, the phylogenetic level to which SMPs are restricted remains unclear due to the small sample sizes of available shell proteomes relative to the number of representative species [12]. Additionally, previous comparative studies relied heavily on BLAST approaches, which have been shown to generate false-negatives for sequences that are short and repetitive (for which many SMPs are susceptible), resulting in an underestimate of orthologs between different species [42]. With the emergence of more molluscan shell proteomes, transcriptomes, and genomes we can now use new orthology inference approaches to identify orthologs with more confidence [9, 10, 19, 31, 38, 43,44,45,46]. These new approaches (e.g. OrthoFinder) [46] compensate for gene-length bias, and allow us to more confidently determine the evolutionary age of SMPs and hypothesize how SMPs influence shell morphology.Here we present a toolkit of resources for studying molluscan SMP biology in two Crepidula species that are amenable to gene perturbation techniques (Fig. 1C and D). In particular we focus on C. atrasolea (a congener of the established model C. fornicata) that is an excellent species for studying shell development due to its availability year round in laboratory culture [20, 22]. We use our previous proteomic and transcriptomic work from C. fornicata [19] to identify the evolutionary age of its adult SMP repertoire and identify SMPs that are shared at different taxonomic levels with molluscs and metazoans. We then adapted in situ hybridization chain reaction (HCR) to Crepidula spp for the first time to examine the spatiotemporal expression patterns of a subset of SMPs during larval stages. With these data we revisit how SMP diversity and deployment during development might control shell evolution.MethodsAnimal cultureC. atrasolea [47] adults were maintained in the Lyons lab at the Scripps Institution of Oceanography, San Diego, California, USA. The animals were kept at 27 °C, in 100 mm x 20 mm plastic petri dishes (Corning # 430,167) with daily filtered natural seawater changes, and fed daily with 0.002% Phyto-Feast (Reed Mariculture Inc., Campbell, CA). Clutches of eggs inside their capsules were collected from the adults using forceps, as previously described in Henry et al. 2017, and placed in 35 mm x 10 mm plastic petri dishes (Falcon # 351,007) with bottle top-filtered (0.2 μm pore size; Thermo Scientific # 291–4520) natural sea water with streptomycin (2ug/mL; Sigma # S6501-100G) and penicillin (0.6 ug/mL; Sigma # 13752-5G-F) [20]. The collected embryos were then raised at room temperature (∼ 20 °C) inside their capsules until reaching the appropriate stages needed for fixation. Since C. atrasolea eggs are fertilized internally, the developmental age (days or hours post fertilization) of embryos was approximated based on hours or days since the embryo was uncleaved. The development of embryos within a single clutch is asynchronous, resulting in uncleaved, 2-cell, and 4-cell embryos all in the same clutch. In addition to days post fertilization (dpf), older embryos were also staged based on the morphology of their developing mouth, velar lobes, foot rudiment, and shell field. When embryos reached a desired stage, they were decapsulated under a dissecting scope using forceps in a gelatin coated 35 mm x 10 mm plastic petri dish prior to fixation or RNA extraction.Embryo fixation and fluorescent staining for shell development characterizationFor embryos with ciliated velar lobes (starting at the organogenesis stage; Fig. 1C), individuals were relaxed in 7.5% magnesium chloride (dissolved in filtered natural seawater; Sigma-Aldrich #M7304) at benchtop for 30 min prior to fixation. Decapsulated embryos were fixed at ∼ 20 °C with 4% formaldehyde (Thermo Scientific # 28,908) in double filtered sea water for 60 min on a shaking plate followed by three 1 min 1X PBS Tween (1X Phosphate Buffered Saline: Gibco #70011-044, 0.5% Tween 20: Sigma-Aldrich P1379-100 mL) washes followed by three 10 min 1X PBS Tween washes. Animals were then dehydrated in methanol with three 5 min 100% methanol washes followed by three 1 min 100% methanol washes. Fixed individuals were stored at -80 °C in 100% methanol.To visualize glycoproteins in the shell matrix, embryos were stained with wheat germ agglutinin (WGA), a lectin with a high affinity to N-acetylglucosamine and N‐acetylneuraminic acid residues [48,49,50]. Selected samples fixed in methanol (detailed above) were rehydrated into 5X SSCT solution (5X sodium chloride sodium citrate: Invitrogen # 15,557,044, 0.1% Tween 20) following 5 min 75% methanol 25% 5X SSCT, 50% methanol 50% 5X SSCT, 25% methanol 75% 5X SSCT, and two 100% 5X SSCT washes. Embryos were then stained in the dark with 0.001 mg/ml WGA (Alexa Fluor™ 594 Conjugate; Invitrogen W11262) and counterstained with 0.001 mg/ml hoechst in 5X SSCT for either 2–3 h at 20 °C or overnight at 4 °C overnight. Embryos were then rinsed with the 5X SSCT solution three times for 5 min at 20 °C. Samples were stored in the dark at 4 °C, and imaged within a week. Imaging methods are detailed below.RNA extraction and long read RNA sequencingThree embryonic samples (Samples 1–3) spanning zygote through early juvenile development, and three samples (Sample 4–6) of C. atrasolea adults or their organs were collected for RNA extraction. Each embryonic RNA sample was made from two separate p"
