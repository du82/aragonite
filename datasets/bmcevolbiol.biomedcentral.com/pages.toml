full_description = 'About Aims and scope BMC Ecology and Evolution, formerly known as BMC Evolutionary Biology, is an open access, peer-reviewed journal interested in all aspects of ecological and evolutionary biology. The journal considers articles on a broad range of topics, including population genetics, conservation genetics, phylogenetics, behavioural ecology, population ecology, macroecology, palaeontology, biodiversity (e.g. environmental DNA approaches), theoretical research (e.g. terraforming) and ecological and evolutionary developmental biology. More specifically: BMC Ecology and Evolution has a broad scope, welcoming research across the multifaceted and interdisciplinary fields of ecology and evolutionary biology. Given that they have an ecological or evolutionary biology context, topics considered by the journal include:Acoustic ecologyBehavioural ecology (e.g. predator-prey interactions, sexual selection).Biodiversity (e.g. halting, protecting and restoring biodiversity).Biodiversity assessment and monitoring (e.g. quadrat sampling, citizen science, remote sensing, unmanned aerial vehicles (UAVs), remotely operated vehicles (ROVs), camera traps, distributed and connected sensor systems, lidar technology, environmental DNA (eDNA) analysis, mobile applications, and bioacoustics).Biological invasions (e.g. alien species, pests).Chemical ecology (e.g. plant defense, pheromone communication).Conservation (e.g. conservation genetics).Developmental biologyEntomologyEcotoxicologyEvolutionary Medicine (e.g. use of evolutionary biology principles to understand health and disease). Ecological sustainability (e.g. agroecology, agroforestry, ecohydrology, nature-based solutions, sustainable land use).Genome evolutionImpact of environmental change on ecology and evolution (e.g. climate change, wildfires, drought, land use change). MacroecologyMacroevolutionMolecular evolutionMovement ecology (e.g. seasonal migration).Phylogenetics, phylogenomics, phylogeography and systematics (e.g. comparative genomics, evolutionary relationships).Paleontology (palaeoecology, palaeobiology, palaeogenomics, ancient DNA).Population ecology (e.g. population dynamics and distribution).Population geneticsRestoration, regeneration and rewilding (e.g. design, application, optimization, management, and outcomes of restoration and rewilding projects in terrestrial, freshwater, and marine ecosystems).Theoretical research. Research that presents a testable theory in the framework of current knowledge, backed by data/ analyses.Research supporting the United Nations Sustainable Development Goals, including: SDG 6.6: Water and Sanitation - protect and restore water-related ecosystems, including mountains, forests, wetlands, rivers, aquifers and lakes. SDG13: Climate action SDG14: Life below water SDG15: Life on land BMC Ecology and Evolution does not make editorial decisions on the basis of the interest of a study or its likely impact. Studies must be scientifically valid; for research articles this includes a scientifically sound research question, the use of suitable methods and analysis, and following community-agreed standards relevant to the research field. Open access All articles published by BMC Ecology and Evolution are made freely and permanently accessible online immediately upon publication, without subscription charges or registration barriers. Further information about open access can be found here. As authors of articles published in BMC Ecology and Evolution you are the copyright holders of your article and have granted to any third party, in advance and in perpetuity, the right to use, reproduce or disseminate your article according to the licence terms. For those of you who are US government employees or are prevented from being copyright holders for similar reasons, BMC can accommodate non-standard copyright lines. Please contact us if further information is needed. Data availability policy BMC Ecology and Evolution follows the policies of the BMC journals, unless otherwise noted below and are designed to support our commitment to open data sharing.Availability of datasets Where a widely established research community expectation for data archiving in public repositories exists, submission to a community-endorsed, public repository is mandatory. A list of data where deposition is required, can be found on the Editorial Policies Page. BMC Ecology and Evolution strongly encourages that all datasets on which the conclusions of the paper rely should be available to readers. We encourage authors to ensure that their datasets are either deposited in publicly available repositories (where available and appropriate) or presented in the main manuscript or additional supporting files whenever possible. If a dataset is not able to be deposited in any of the above repositories due to legal guidelines or ethical reasons, this must be clearly stated in the “Availability of Data and Materials” section.Data citation BMC endorses the Force 11 Data Citation Principles and requires that all publicly available datasets be fully referenced in the reference list with an accession number or unique identifier such as a digital object identifier (DOI).Authors are required to formally cite any datasets stored in external repositories that are mentioned within their manuscript, including the main datasets that are the focus of the submission, as well as any other datasets that have been used in the work. For previously published datasets, we ask authors to cite both the related research articles and the datasets themselves. All methods, software, and code developed for the manuscript should include a citation on the reference list. All Springer Nature journals, including BMC Ecology and Evolution, are participants in the Initiative for Open Citations. As such, data citations are included in full in the formal reference list, exported to Crossref and are openly available.An author list and title for the dataset should be included in the data citation, and should reflect the author(s) and dataset title recorded at the repository. If author or title is not recorded by the repository, these should not be included in the data citation. The name of the data-hosting repository, URL to the dataset and year the data were made available are required for all data citations. For DOI-based (e.g. figshare or Dryad) repositories the DOI URL should be used. For repositories using accessions (e.g. SRA or GEO) an identifiers.org URL should be used where available. Please refer to the following examples of data citation for guidance: Zhang, Q-L., Chen, J-Y., Lin, L-B., Wang, F., Guo, J., Deng, X-Y. Characterization of ladybird Henosepilachna vigintioctopunctata transcriptomes across various life stages. figshare https://doi.org/10.6084/m9.figshare.c.4064768.v3 (2018). NCBI Sequence Read Archive https://identifiers.org/ncbi/insdc.sra:SRP121625 (2017). Barbosa, P., Usie, A. and Ramos, A. M. Quercus suber isolate HL8, whole genome shotgun sequencing project. GenBank https://identifiers.org/ncbi/insdc:PKMF00000000 (2018). DNA Data Bank of Japan https://trace.ddbj.nig.ac.jp/DRASearch/submission?acc=DRA004814 (2016).Availability of computer code and software Authors must make available upon request, to editors and reviewers, any previously unreported custom computer code or algorithm used to generate the data presented in the manuscript. If published, the software application/tool should be readily available to any scientist wishing to use it for non-commercial purposes, without restrictions (such as the need for a material transfer agreement). If the implementation is not made freely available, then the manuscript should focus clearly on the development of the underlying method and not discuss the tool in any detail.A statement describing how software or custom code can be accessed must be included in the Declaration section “Availability of Data and Materials". License information for the software or method should also be stated clearly in the “Availability of Data and Materials section” and on the repository site.This section should include a link to the most recent version of your software or code (e.g. GitHub or Sourceforge or Code Ocean) as well as a link to the archived version referenced in the manuscript. The software or code should be archived in an appropriate repository with a DOI or other unique identifier. For software in GitHub, we recommend using Zenodo. Code with an assigned DOI must be formally cited and listed in the References section of the manuscript.Availability of research materialsBMC Ecology and Evolution follows the BMC editorial policies for the sharing of research materials. Submission of a manuscript to a BMC journal implies that materials described in the manuscript, including all relevant raw data, will be freely available to any scientist wishing to use them for non-commercial purposes. It is acceptable to request reasonable payment to cover costs of distribution and reagents may be made available via commercial or non-commercial third party providers. Any restrictions on materials availability, including if materials are to be distributed by a for-profit company, must be clearly stated in the paper. As per our policy on authorship responsibilities, it is expected that the corresponding author (or relevant designated authors) will be responsible for materials availability unless otherwise stated. Study pre-registrationBMC Ecology and Evolution encourages study pre-registration and pre-registration of analysis plans in public repositories; details of pre-registration should be provided in the manuscript.Replication studiesBMC Ecology and Evolution​​​​​​​ welcomes submission of replication studies that provide new insights into previously published results and will evaluate these submissions with the same editorial standards we apply to other submissions.Standards of reportingBMC Ecology and Evolution​​​​​​​ advocates complete and transparent reporting of research and follows the BMC editorial policies on standards of reporting. Additional information is available through the journal’s submission guidelines.Helpful resources for sharing your research data We are committed to supporting researchers in sharing their research data, and getting the credit they deserve. Here are some useful resources to help: Get free advice from our research data help desk Find a recommended repository for your data Publish your data in BMC Genomic Data (genomic, transcriptomic and high-throughput genotype data) or in BMC Research Notes (data from across all natural and clinical sciences) Article processing charges (APC) Authors who publish open access in BMC Ecology and Evolution are required to pay an article processing charge (APC). The APC price will be determined from the date on which the article is accepted for publication.The current APC, subject to VAT or local taxes where applicable, is: £2190.00/$2890.00/€2490.00**This journal is part of Springer Nature’s country-tiered APC pricing pilot. Find out more about the APC applicable to your country.Visit our open access support portal and our Journal Pricing FAQs for further information.Open access fundingVisit Springer Nature’s open access funding & support services for information about research funders and institutions that provide funding for APCs.Springer Nature offers agreements that enable institutions to cover open access publishing costs. Learn more about our open access agreements to check your eligibility and discover whether this journal is included.Requests for APC waivers and discounts from authors will be considered on a case-by-case basis, and may be granted in cases of financial need (see our open access policies for journals for more information). All applications for discretionary APC waivers and discounts should be made at the point of manuscript submission; requests made during the review process or after acceptance are unable to be considered. Indexing services All articles published in BMC Ecology and Evolution are included in: BFI List BIOSIS CAB Abstracts CLOCKSS CNKI CNPIEC Chemical Abstracts Service (CAS) Chinese Academy of Sciences (CAS) - GoOA DOAJ Dimensions EBSCO Academic Search EBSCO Biomedical Reference Collection EBSCO Discovery Service EBSCO STM Source EMBiology Gale Geobase Google Scholar Journal Citation Reports/Science Edition Medline Meta Naver OCLC WorldCat Discovery Service Pathway Studio Portico ProQuest-ExLibris Primo ProQuest-ExLibris Summon PubMedCentral SCImago SCOPUS Science Citation Index Science Citation Index Expanded (SCIE) TD Net Discovery Service UGC-CARE List (India) WTI AG Zoological RecordThe full text of all articles is deposited in digital archives around the world to guarantee long-term digital preservation. You can also access all articles published by BioMed Central on SpringerLink. Peer-review policy Peer-review is the system used to assess the quality of a manuscript before it is published. Independent researchers in the relevant research area assess submitted manuscripts for originality, validity and significance to help editors determine whether the manuscript should be published in their journal. You can read more about the peer-review process here.In cases where the journal is unable to find sufficient peer reviewers, the services of a publishing partner, American Journal Experts (AJE), may be used to identify suitable reviewers and provide reports to avoid further delays for authors. Reviewers recruited by AJE are paid a small honorarium for completing the review within a specified timeframe. Honoraria are paid regardless of the reviewer recommendation. In cases where reports have been obtained by AJE, the peer review reports will be unsigned unless the reviewer opts in to sign the report.BMC Ecology and Evolution operates a transparent peer-review system, where, if the article is published, the reviewer reports are published online alongside the article under a Creative Commons Attribution License 4.0 but the reviewer is not named.The benefit of transparent peer review is that it increases transparency. In addition, published reports can serve an educational purpose in helping facilitate training and research into peer review.Manuscripts submitted to BMC Ecology and Evolution are assessed by our editors and/or peer reviewers. Editor(s) are expected to obtain a minimum of two peer reviewers for manuscripts reporting primary research or secondary analysis of primary research. It is recognized that in some exceptional circumstances, particularly in niche and emerging fields, it may not be possible to obtain two independent peer reviewers. In such cases, Editor(s) may wish to make a decision to publish based on one peer review report. When making a decision based on one report, Editor(s) are expected to only do so if the peer review report meets the standards set out in the Springer Nature Code of Conduct (section Peer-Review). Overall editorial responsibility for'
