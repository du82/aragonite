title = "Come to the dark side – citizen science in nighttime ecology | BMC Ecology and Evolution | Full Text"
description = "Nocturnal ecology has hitherto led a shadowy existence in ecology, which traditionally focuses on diurnal species and functional relationships in the bright light of day. Yet nighttime hides exciting research insights and urgent conservation issues to be addressed. Citizen science is a promising approach to support this urgently needed exploration."
full_description = "Comment Open access Published: 14 February 2025 Come to the dark side – citizen science in nighttime ecology S. E. Kimmig1, F. Hölker1,2, S. Schroer1, A. Kassiem2 & …S. Kiefer1 Show authors BMC Ecology and Evolution volume 25, Article number: 15 (2025) Cite this article 566 Accesses 11 Altmetric Metrics details AbstractNocturnal ecology has hitherto led a shadowy existence in ecology, which traditionally focuses on diurnal species and functional relationships in the bright light of day. Yet nighttime hides exciting research insights and urgent conservation issues to be addressed. Citizen science is a promising approach to support this urgently needed exploration. Peer Review reports Citizen science has become a valuable method to scientists and practitioners in environmental and ecological sciences [1] as it can help to address a variety of ecological issues. One of these issues is the ecology of the nocturnal niche and of the creatures it harbours. Despite the fact that half of the Earth's surface is experiencing darkness at any given time, nighttime is still an under-explored area in ecological research [2]. This is illustrated by the limited knowledge of the ecology of, and threats to nocturnal species: Out of all mammals on the IUCN red list, that are classified as data deficient to assess their population status and/or threat level, 81% are nocturnal [3]. Also, the by far most studied insect groups such as bees, butterflies and dragonflies are diurnal although nocturnal insect activity exceeds diel activity by almost a third [4]. Neglecting nocturnal pollinators in ecological pollinator networks (including insects, rodents and bats) may result in a distorted view of the structure of plant-pollinator networks with relevant implications for conservation assessments [5]. In recent decades, a new major driver of global environmental change—light pollution (caused by artificial light at night, ALAN)—has highlighted this lack of knowledge as a blind spot in ecological research [6]. ALAN has numerous effects on the individual level such as impacts on mortality, reproduction, foraging, migratory behaviour, diel activity, physiology and gene expression. Those may further lead to cascading effects on communities across ecosystem boundaries and hence impair ecosystem functioning (e.g. through food webs, predator–prey interactions and shifted phenologies) [7]. These cascading effects can even affect diurnal communities [8].The underrepresentation of nighttime ecology in ecological research may be due to the fact that humans themselves are diurnal organisms, creating biases regarding the temporal dimension within research, but also in common knowledge within the society (e.g. species recognition) [9].CS can support the developing field of nighttime ecology that has been understudied for too long. Many “unknowns” remain to be addressed to better understand the ecology of the dark, the relevance of its species and the detrimental impacts on its biodiversity so we can design effective mitigation measures. Ultimately, we may even need to fundamentally rethink our common projection of knowledge of ecosystem functioning, which has mainly been gathered in diurnal environments, onto nocturnal systems [10]. There is further a serious deficit of transferring scientific evidence into policy and public perception [6]. In this context, citizen or community science holds the potential to enhance data collection, but also to bridge the information gap between science and society: For example, the monitoring of nocturnal species can be improved by recruiting people who are active at night (like people returning from leisure activities or shift workers) who could observe nocturnal or crepuscular animals on their way home. As human behaviour is crucial in nature conservation, knowledge exchange can also be one important pillar of nocturnal CS e.g. by informing people about the detrimental effects of light pollution and training them on how to minimize ALAN wherever possible. CS may provide the interface of scientific research with the required cultural and regional context, like the simple knowledge of the existence of a certain nocturnal species in one’s own backyard. This increases the ability of science to address complex ecological aspects for which empirical evidence is needed alongside public and policy engagement [11].CS is a promising tool for nighttime ecology but also entails specific challenges. For instance, involving people who happen to be out at night but have no particular prior interest in the subject, has the potential of reaching out to new target groups, it may, however, also be challenging to motivate them in the first place. Another aspect is -depending on the project- the requirement of special safety and engagement considerations: In some areas or at certain times of the night, people need specific gear (e.g. red lights) or safety precautions are required to protect vulnerable groups [12]. Participation of children can be limited due to sleeping times or legal limits. The relatively low knowledge in nocturnal species taxonomy together with their richness (for example the number of moths species compared to butterflies) may be an obstacle, when involving citizen scientists in research that requires species identification. For some projects this is negligible, as the data reporting does not require identification on the species level. However, targeted nocturnal data contributions are mandatory.Despite of the challenges involved, CS already contributes to nighttime ecological research and could do so even further in the future. Due to its broadband character (ranging from low level engagement to co-creation) and often interdisciplinarity, it can strengthen the field of nighttime ecology in many ways (Fig. 1): It can support monitoring efforts targeting numerous nocturnal species and help to assess the multi-dimensional impacts of ALAN on species and ecosystems (see Table S1). For example, CS informed AI can assist taxonomic identification of nocturnal insects [13] and even enable the detection of new night-active species like semi-slugs, that have recently been discovered by citizen scientists in Brunei (Table S1, line 29). CS may uncover overlooked nocturnality like in the case of the common grass snake Natrix natrix, a widespread European snake that is traditionally considered diurnal (Table S1, line 31) and it can foster the detection of unknown behaviours such as the cryptic migration of the Common Potoo Nyctibius griseus in Brazil (Table S1, line 6). The use of CS can help to study the evolution of behaviour, such as the evolution of song in nightingales (Table S1, line 15) and it can further reveal surprising behavioural adaptations of nocturnal animals, such as the unexpectedly common arboreal habitat use of amphibians in Great Britain (Table S1, line 24). CS has been used to investigate the fitness of diurnal species in response to a disturbed nocturnal resting period, for example by using a Neighborhood Nestwatch Program to study the variation in annual survival rates of avian species in urban areas (Table S1, line 25). In urban areas, CS can ultimately inform city planning, for example, by using citizen-recorded bat vocalizations along different habitat structures to evaluate the potential of urban areas for bat conservation and to develop evidence-based recommendations on how to improve urban spaces for bat protection (Table S1, line 17). Where humans live close to wildlife, the employment of CS can also pacify human wildlife conflict and inform wildlife management, like in the case of coyotes roaming at night (Table S1, line 8) or help to investigate the ecological impacts of invasive species such as nocturnal urban invasions and agricultural damages of birds in South Korea (Table S1, line 36).Fig. 1The growing field of nighttime ecology overarches several ecological research disciplines and concerns various areas of applied ecology. Citizen science is already making an important contribution to these today, but has the potential to further enhance the development of nighttime ecologyFull size imageCS can make use and be combined with a variety of different methods, from long established (e.g. camera trapping, standardized surveys, transects, bioacoustic monitoring) to more recent ones (e.g. webGIS mapping, eDNA, machine learning, other AI tools). It thus holds the potential to enrich the developing field of nighttime ecology along different engagement levels (see also Table S1).Here we want to state that the field of nocturnal ecology not only deserves much more attention by the research community—but also by society, nature conservationists and politics—and that CS could be an essential component of this attention.The more we uncover, the more we realize how hidden the dark side of all life is, and how important it is to protect it. Even for diurnal creatures, the alternation of day and (dark) night, which is deeply rooted in evolutionary history, is essential (e.g. for sleep cycles and circadian rhythms). We thus want to make a strong plea for more nighttime ecological research. CS provides a necessary tool here, because it can generate data of often overseen fauna, flora and their interactions. It can further empower citizens to engage in their right for dark nights as a source of quietness and recovery and raise awareness about nocturnal ecology among multiple actors. By connecting different actors/stakeholders and combining disciplines and methods, CS can therefore be crucial in increasing the capacity of science to address nocturnal ecological problems and to find solutions to the rapidly vanishing natural darkness of the night. Data availability No datasets were generated or analysed during the current study. AbbreviationsALAN: Artificial light at night CS: Citizen Science ReferencesFraisl D, Hager G, Bedessem B, Gold M, Hsing PY, Danielsen F, et al. Citizen science in environmental and ecological sciences. Nat Rev Methods Primers. 2022;2(1):64.Article CAS Google Scholar Kyba CCM, Pritchard SB, Ekirch AR, Eldridge A, Jechow, A, Preiser C, et al. Night matters—why the interdisciplinary field of “Night Studies” is needed. J. 2020;3(1):1–6.Bennie JJ, Duffy JP, Inger R, Gaston KJ. Biogeography of time partitioning in mammals. Proc Natl Acad Sci. 2014;111(38):13727–32.Article PubMed PubMed Central CAS Google Scholar Wong MKL, Didham RK. Global meta-analysis reveals overall higher nocturnal than diurnal activity in insect communities. Nat Commun. 2024;15(1):3236.Article PubMed PubMed Central CAS Google Scholar García Y, Giménez-Benavides L, Iriondo JM, Lara-Romero C, Méndez M, Morente-López J, Santamaría S. Addition of nocturnal pollinators modifies the structure of pollination networks. Sci Rep. 2024;14(1):1226.Article PubMed PubMed Central Google Scholar Hölker F, Bolliger J, Davies TW, Giavi S, Jechow A, Kalinkat G, et al. 11 pressing research questions on how light pollution affects biodiversity. Front Ecol Evol. 2021;9:767177.Article Google Scholar Seymoure B, Dell A, Hölker F, Kalinkat G. A framework for untangling the consequences of artificial light at night on species interactions. Philos Trans R Soc B. 1892;2023(378):20220356. Google Scholar Knop E, Zoller L, Ryser R, Gerpe C, Hörler M, Fontaine C. Artificial light at night as a new threat to pollination. Nature. 2017;548(7666):206–9.Article PubMed CAS Google Scholar Díaz-Calafat J, Jaume-Ramis S, Soacha K, Álvarez A, Piera J. Revealing biases in insect observations: A comparative analysis between academic and citizen science data. PLoS ONE. 2024;19(7):e0305757.Article PubMed PubMed Central Google Scholar Cox DT, Gaston KJ. Ecosystem functioning across the diel cycle in the Anthropocene. Trends Ecol Evol. 2024;39(1):31–40.Article PubMed Google Scholar Austen K, Janssen A, Wittmayer JM, Hölker F. The potential of citizen science to transform science: Lessons for a sustainable futur