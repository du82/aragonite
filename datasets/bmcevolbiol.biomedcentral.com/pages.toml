title = "DNA barcode reference library of the fish larvae and eggs of the South China Sea: taxonomic effectiveness and geographic structure | BMC Ecology and Evolution | Full Text"
description = "Fish early-stages constitute useful indicators of the states of marine ecosystems, as well as important fishery resources. Given the spectacular phenotypic changes during ontogeny, and the paucity of diagnostic morphological characters at the species level, the identification of fish early-stages is a challenging task. DNA barcoding, the use of the mitochondrial gene of the cytochrome c oxidase subunit I (COI) as an internal species tag, opened new perspectives for the identifications of both larval fish and fish eggs. However, the accuracy of the identifications assisted by DNA barcoding are dependent of the completeness of the DNA barcode reference libraries used to assigned unknown sequences to known species. Here, we built a DNA barcode reference library for 113 species of larval fish and 85 species of fish eggs involving the production of 741 newly generated DNA barcodes from South China Sea (63 localities). Together with 514 DNA barcodes mined from Genbank for 116 species from the South China Sea regions, a reference library including 1255 DNA barcodes for 308 species (248 locations) was assembled. The present study emphasizes the importance of integrating DNA barcoding to large scale inventories of early stages, as DNA-based species delimitation analyses delimited 305 molecular operational taxonomic units (MOTUs) and multiple cases of discordance with morphological identifications were detected. Cryptic diversity is detected with 14 species displaying two MOTUs and a total of 23 species were lumped into 11 MOTUs due to low interspecific divergence and/or mixed lineages."
full_description = "Research Open access Published: 28 October 2024 DNA barcode reference library of the fish larvae and eggs of the South China Sea: taxonomic effectiveness and geographic structure Changping Jiang1 na1, Fengming Liu1 na1, Jiao Qin2, Nicolas Hubert3, Bin Kang4, Liangliang Huang5 & …Yunrong Yan1,6 Show authors BMC Ecology and Evolution volume 24, Article number: 132 (2024) Cite this article 875 Accesses Metrics details AbstractFish early-stages constitute useful indicators of the states of marine ecosystems, as well as important fishery resources. Given the spectacular phenotypic changes during ontogeny, and the paucity of diagnostic morphological characters at the species level, the identification of fish early-stages is a challenging task. DNA barcoding, the use of the mitochondrial gene of the cytochrome c oxidase subunit I (COI) as an internal species tag, opened new perspectives for the identifications of both larval fish and fish eggs. However, the accuracy of the identifications assisted by DNA barcoding are dependent of the completeness of the DNA barcode reference libraries used to assigned unknown sequences to known species. Here, we built a DNA barcode reference library for 113 species of larval fish and 85 species of fish eggs involving the production of 741 newly generated DNA barcodes from South China Sea (63 localities). Together with 514 DNA barcodes mined from Genbank for 116 species from the South China Sea regions, a reference library including 1255 DNA barcodes for 308 species (248 locations) was assembled. The present study emphasizes the importance of integrating DNA barcoding to large scale inventories of early stages, as DNA-based species delimitation analyses delimited 305 molecular operational taxonomic units (MOTUs) and multiple cases of discordance with morphological identifications were detected. Cryptic diversity is detected with 14 species displaying two MOTUs and a total of 23 species were lumped into 11 MOTUs due to low interspecific divergence and/or mixed lineages. Peer Review reports IntroductionEarly life history stages of the majority of marine fishes occur in the upper water column, where eggs and larvae are part of the plankton before they undergo multiple metaphormoses and settle in their respective adult habitats. Large-scale surveys of the ichthyoplankton are fundamental to understand ecosystem functioning and fish population dynamics [1, 2], and to help with the sustainable management of fisheries and the design of reserve networks to preserve ocean biodiversity [3, 4]. Survey data of the ichthyoplankton could be used for monitoring spawning habitats [5], detecting changes in phenology related to human-induced perturbations [6,7,8,9], and estimating the biomass of spawning adults [10]. The greatest challenge when collating larval fish data is the difference in taxonomic resolution among studies (i.e. species vs genus vs family level identification), which limits the ability to make large-scale comparisons of ichthyoplankton assemblages. Identifying fish early stages is a challenging task as few ichthyologists are able to identify larvae to the species level, and considering the progressive loss of taxonomic expertise (i.e. taxonomic impediment), the sustainability of this expertise is compromised in a near future [11].Empirical studies of larval ecology face a major challenge which consists in accurately identifying larvae and eggs to the species level using morphological characters. This task is particularly challenging due to the high diversity of species usually encountered in marine ichthyoplankton swarms and the dramatic phenotypic changes during the fish life cycle [12]. As such, identifying fish larvae is no easy task. Consequently, there is an urgent need for a reliable and efficient approach to achieve accurate fish larvae identification. The use of standardized molecular approaches for species identification such as DNA barcoding can greatly improve the identification of ichthyoplankton [13], and potentially reduce the reliance on taxonomic experts [14]. It has been evidenced for instance that DNA barcoding could enhance the accuracy of species-level identification of marine ichthyoplankton by 70% [15]. By design, its accuracy is highly dependent on the completeness of the DNA barcode reference libraries used to assign unknown larval fish and eggs to known species [13]. These libraries turn surveys of Molecular Operational Taxonomic Units (MOTUs) into species surveys through the assignment of species names to MOTUs [16], hence giving meaning to molecular data for ecologists, evolutionary biologists and stakeholders [17]. Numerous studies have demonstrated the advantages of integrating morphological and molecular approaches in the ichthyological exploration of the world oceans. In the Pacific Ocean for instance, the Moorea Biocode project established the initial comprehensive DNA barcode reference library of the Pacific reef fishes [18]; and its application to the identification of marine larval fish assemblages in tropical and subtropical Pacific waters [13, 14].The South China Sea (SCS) constitutes a major marine biodiversity hotspot with over 3300 fish species reported [19, 20], which are threatened by illegal fishing, disappearance of mangroves and wastewater emissions. Besides, the degradation of coral reefs in the SCS over the past few decades has posed a serious threat to the persistence of multiple fish populations. Hence, protecting fish resources in the SCS is an urgent imperative. Larval fishes and fish eggs, despite offering limited dispersal opportunities for many sedentary marine fish species, provide vital information on reproductive biology, including spawning ground and timing, and population recruitment success rates. Nonetheless, research on larval fishes and eggs remains significantly limited in the SCS, mostly scattered in the literature and plagued by misidentifications [21,22,23]. This situation is likely explained by the lack of a dedicated database to provide reliable references on larval fishes and eggs in the SCS.Here, we present the result of a large-scale effort to DNA barcode larval fishes and fish eggs of the SCS with the objective to provide open resources for automated identifications of larval fishes and eggs, and promote studies of early life stages among marine fishes of the SCS (Fig. 1). Conducted between 2022 and 2023, a total of 63 sites were inventoried across the SCS (Fig. 2). In total, 741 specimens were identified, preserved, photographed and DNA barcoded to build an atlas guide representing at least 12 orders, 60 families, 113 genus and 188 species (Fig. 3) including 113 species of larval fish (Fig. 3A1-A2) and 85 species of fish eggs (Fig. 3B1-B2). Simultaneously leveraging data from current sampling efforts (188 species) and from DNA barcodes previously published in the literature [22,23,24,25] and retrieved from the NCBI and BOLD databases (166 species), we have constructed the first comprehensive larval fish and fish eggs DNA barcode reference library for the SCS. Our library includes 1255 sequences for 20 orders, 80 families, 193 genus and 308 species, including 471 DNA barcodes for 144 species which constitutes new records (Fig. 4). This comprehensive library for larval fishes and fish eggs is poised to be used by a diversity of users with varying interests, from fundamental to applied science, including fisheries management, functional ecology, taxonomy, and conservation. Additionally, the present library reveals numerous newly detected taxa for scientific exploration, along with complete collection data and DNA barcodes that will certainly facilitate their formal description as new species. Beyond shedding a new light on the fish species diversity of the SCS, this publicly available resource is anticipated to catalyse the development of DNA barcode reference libraries in the SCS. Furthermore, it is expected to enhance the accuracy of results for the growing number of studies utilizing DNA barcoding in the Western Pacific.Fig. 1Overview of data generation. From specimen collection to the validation of data generationFull size imageFig. 2Map of sampling localities. Circles denote locations where zooplankton nets were used for capture, while triangles represent sampling sites with published sequencesFull size imageFig. 3Photographs of larval fish and fish eggs. A larval fish; B fish eggsFull size imageFig. 4Species diversity included in the Biodiversity of South China Sea dataset. A Number of species by family; B Number of newly sequenced species in each family in present dataset, New species records for any mitochondrial gene (green bars); New species records for COI marker in the South China Sea(grey bars)Full size imageMaterials and methodsSpecimen collectionThe collection of larval fish and fish eggs was conducted in accordance with the “Marine Survey Code” (GB12763.1-7-91), utilizing a large zooplankton net equipped with a mechanical flowmeter (HYDRO-BIOS). All the ichthyoplankton samples examined and analyzed here were newly collected during the course of the present study using zooplankton nets (80 cm diameter, 270 cm long, 505 μm mesh size, with a cod-end container mesh of 400 μm) deployed in vertical and horizontal trawls in open seas. Two simultaneous vertical and horizontal tows were used at fixed depth (15 min at 1.5–2.2 knots), using a flowmeter attached to the mouth of the net, which was used to standardise Ichthyoplankton counts to volume of water sampled. According to the specifications for oceanographic survey — Par6: marine biological survey (GB/T 12763.6—2007): the collected samples were preserved separately in 75% ethanol–sea water solution and 5% formalin solution in seawater. These preserved samples were transported back to the laboratory for further analysis.DNA barcode sequencing and data miningIn the laboratory, larval fishes and fish eggs from each station were examined using an Olympus SZX7 stereomicroscope, sorted, enumerated, and identified. Identification of species was done using key reference guides [26,27,28,29], larval fishes and fish eggs were then stored in ethanol for later reference, and a subset has been archived at the Guangdong Ocean University.Each sample was first numbered, rehydrated in ultrapure water for 5–8 min for cleaning, and then photographed using a Zeiss microscope (Stemi 508) (Fig. 3). Total genomic DNA was extracted using an Aagen DNA Extraction Kit (Aagen, Guangdong, China) according to the manufacturer specifications. A partial fragment of the 5’-end of mitochondrial cytochrome c oxidase I gene (COI) of ∼650 bp was amplified with the universal primers FishF1(TCAACCAACCACAAAGACATTGGCAC) and FishR1(TAGACTTCTGGGTGGCCAAAGAATCA) [30]. The polymerase chain reaction (PCR) employed the following thermocycling regime: 92◦C for 5 min, 35 cycles at 92◦C for 45 s, 49◦C for 60 s, 72◦C for 60 s, and a final extension at 72◦C for 10 min. PCR amplifications were performed in a final volume of 25 μl containing 6.5 μL of ultrapure water, 2 μL of MgCl2 (5 mM), 1 μL of forward and reverse primers, 12.5 μL of Taq polymerase and 2 μL of genomic DNA. Sanger sequencing was conducted at the Sangon Biotech company. Sequences were edited using Sequencher_5.4.5 (Gene Codes), aligned with MAFFT [31] and submitted to Genbank (accession numbers: PP354153-PP354861 and PP354116-PP354147; Table S1).The taxonomic coverage of the DNA barcode reference library was further expanded by mining COI sequences for missing taxa in international repositories such as GenBank and BOLD. We employed two retrieval strategies: (1) In GenBank, we searched and downloaded COI sequences using a combination of keywords including ‘South China Sea’, ‘fish larvae’, ‘fish eggs’ and ‘fish larvae and eggs’; (2) We searched for studies in Web of Science matching the aforementioned keywords to identify and review all relevant publications, and compiled all available COI sequences.Genetic species delimitationSeveral methods have been suggested for delineating species based on DNA sequences [17, 32, 33]. Each of these methods possesses distinct properties, especially in handling singletons (i.e., delimited lineages represented by a single sequence) or heterogeneous speciation rates among lineages [34]. A combination of different approaches is increasingly used to overcome potential pitfalls arising from uneven sampling [35,36,37,38]. We used six different sequence-based methods of species delimitation to identify Molecular Operational Taxonomic Units (MOTUs): (i) Refined single linkage (RESL) as implemented in BOLD and used to generate Barcode index numbers (BIN) [17], (ii) Assemble Species by Automatic Partitioning (ASAP) [33], (iii) Poisson tree process (PTP) in its single (sPTP) and multiple rates version (mPTP) as implemented in the stand-alone software mPTP_0.2.3 [32] and (iv) general mixed yule-coalescent (GMYC) in its simple (sGMYC) and multiple rate version (mGMYC) as implemented in the R package Splits 1.019) [39]. The final delimitation scheme was established by deriving a majority-rule consensus from the six delimitation analyses conducted.Both Refined Single Linkage (RESL) and ASAP utilize DNA alignments as input, with sequences being submitted to the BOLD and ASAP web servers respectively, for delimitation analysis. For PTP analyses, a Maximum Likelihood (ML) tree was generated using the R package Phangorn 2.8.1 [40] with a GTR + F + R10 substitution model. Subsequently, the ultrametric and fully resolved tree required by GMYC analyses was reconstructed using the Bayesian approach implemented in BEAST 2.4.8 [41]. Two Markov chains of 50 million each were run independently employing a Yule pure birth model tree prior, a strict-clock of 1.2% of genetic distance per million years [42], and a GTR + F + R10 substitution model. Trees were sampled every 10,000 states after an initial burn-in period of 10 million. Both runs were first checked for statistical robustness (ESS > 200) using Tracer 1.7.1 and further combined using LogCombiner 2.4.8. The maximum credibility tree was established using TreeAnnotator 2.4.7 [41]. Sequences were collapsed into haplotypes prior to Bayesian analyses using the ALTER webserver (http://www.sing-group.org/ALTER/) [43]. Subsequently, we used the R package P2C2M.GMYC 1.0 (https://github.com/P2C2M) to assess the fit of the GMYC model to our constructed dataset.The taxonomic coverage of present sampling was further examined at both species and MOTUs levels by generating a sequence accumulation curve using the R package iNEXT [44].Specimen identification and genetic distancesMorphological identifications were refined by comparisons to sequence-based identifications performed with the blast engines of NCBI nucleotide database and the Barcode of life datasystem (BOLD). Blast results were collected for both best match and interspecific best match following Hubert et al. [13]. Specimen identifi"
