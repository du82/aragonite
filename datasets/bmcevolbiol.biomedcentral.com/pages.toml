title = "Lost in space and time: robust demography and enhanced resilience buffer adverse environmental effects in a highly isolated and sedentary pre-pleistocene landscape vertebrate | BMC Ecology and Evolution | Full Text"
description = "Background Few animal populations have been studied under the framework of the OCBIL theory, which addresses the ecology and evolution of biodiversity on old climatically buffered infertile landscapes. Available genetic data challenge the low connectivity and high genetic differentiation predicted for isolated tepui-summit vertebrate communities, suggesting potential dispersal among summits. However, the OCBIL theory posits reduced dispersibility, enhanced resilience to habitat fragmentation and inbreeding due to small populations. We tested these hypotheses by conducting the first analytic evaluation of the spatial ecology and population biology of a tepui-summit vertebrate at multiple spatial scales. Results We used harmonic radar tracking (100 individuals/448 points of contact) and capture-mark-recapture data (596 individuals captured/52 recaptured) to reveal the temporal niche, microhabitat use, population size, and dispersal abilities of the tepui-summit endemic toad Oreophrynella quelchii on Roraima-tepui. Abundance was determined using a closed population model incorporating sources of variation in capture probability. We tested the relative influence of biotic and abiotic variables on distances moved through model selection. Our data indicate that the population size of O. quelchii is remarkably large (ca. 12 million individuals), with strong seasonal demographic fluctuations. Ecology and observed limited spatial movements challenge the likelihood of active dispersal among tepui tops in this species. Our results are counter to those predicted by the available genetic data but support two hypotheses of the OCBIL theory: reduced dispersibility and enhanced resilience. However, they do not support the expectation of a small refugial population size. Conclusion We postulate that the insular, hostile tepui-summit environment tends to produce robust demographic populations, likely to buffer stochastic adverse environmental effects, rather than diversity, as observed in much younger post-Pleistocene Neotropical landscapes. Our results draw attention to the value of faunal studies using an OCBIL framework to better understand the ecology and evolution of this unique biota worldwide."
full_description = "Research Open access Published: 11 October 2024 Lost in space and time: robust demography and enhanced resilience buffer adverse environmental effects in a highly isolated and sedentary pre-pleistocene landscape vertebrate Philippe J. R. Kok ORCID: orcid.org/0000-0001-9743-97381,2, Tessa L. Broholm3, Loïc van Doorn4, Bruno Ferreto Fiorillo1 & …Carl Smith1,5 Show authors BMC Ecology and Evolution volume 24, Article number: 125 (2024) Cite this article 712 Accesses Metrics details AbstractBackgroundFew animal populations have been studied under the framework of the OCBIL theory, which addresses the ecology and evolution of biodiversity on old climatically buffered infertile landscapes. Available genetic data challenge the low connectivity and high genetic differentiation predicted for isolated tepui-summit vertebrate communities, suggesting potential dispersal among summits. However, the OCBIL theory posits reduced dispersibility, enhanced resilience to habitat fragmentation and inbreeding due to small populations. We tested these hypotheses by conducting the first analytic evaluation of the spatial ecology and population biology of a tepui-summit vertebrate at multiple spatial scales.ResultsWe used harmonic radar tracking (100 individuals/448 points of contact) and capture-mark-recapture data (596 individuals captured/52 recaptured) to reveal the temporal niche, microhabitat use, population size, and dispersal abilities of the tepui-summit endemic toad Oreophrynella quelchii on Roraima-tepui. Abundance was determined using a closed population model incorporating sources of variation in capture probability. We tested the relative influence of biotic and abiotic variables on distances moved through model selection. Our data indicate that the population size of O. quelchii is remarkably large (ca. 12 million individuals), with strong seasonal demographic fluctuations. Ecology and observed limited spatial movements challenge the likelihood of active dispersal among tepui tops in this species. Our results are counter to those predicted by the available genetic data but support two hypotheses of the OCBIL theory: reduced dispersibility and enhanced resilience. However, they do not support the expectation of a small refugial population size.ConclusionWe postulate that the insular, hostile tepui-summit environment tends to produce robust demographic populations, likely to buffer stochastic adverse environmental effects, rather than diversity, as observed in much younger post-Pleistocene Neotropical landscapes. Our results draw attention to the value of faunal studies using an OCBIL framework to better understand the ecology and evolution of this unique biota worldwide. Peer Review reports BackgroundIt is generally accepted that population fitness positively correlates with genetic diversity [1], which in turn is determined by neutral processes (such as genetic drift; [2]) that are affected by population size, connectivity, and their interactions. Estimating the size and dispersal abilities of geographically isolated populations is of intellectual interest to evolutionary biologists but is also crucial for conservation [3].Tepuis are iconic Precambrian sandstone tabletop mountains scattered across the Pantepui biogeographical region [4]. Pantepui lies in the western Guiana Shield (Fig. 1a), and its old and nutrient-poor landscapes are one of the “OCBILs” (Old, Climatically Buffered, Infertile Landscapes) characterized by Hopper [5]. Hopper [5] was the first to develop the OCBIL theory, mainly to explain plant ecology in ancient landscapes and to better understand why these old landscapes challenge patterns of latitudinal gradients with regard to species diversity and endemism [6]. The author derived seven predictions from his theory (see [5] for details), and notably hypothesized that the biotic assemblages of OCBILs might display more complex population dynamics due to reduced dispersibility; the expected persistence of old lineages; refugial phenomena; inbreeding; adaptations to resource-limited, highly competitive environments; and high levels of resilience to lower evolutionary potential [5]. Later (e.g [6, 7]), more hypotheses (up to 12 in [7]) were derived from the OCBIL theory, with the proposition of ad-hoc mechanistic explanations and examples to challenge the hypotheses through direct and indirect evidence [7]. Testing the predictions of the OCBIL theory using different approaches and in different biogeographical regions is still in its early stages [7], especially in vertebrates for which studies using an OCBIL framework are scarce [8].Fig. 1(a) Map of Pantepui and its location in South America (upper left inset). Orange shading refers to the Guiana Shield region; the star depicts the study site. (b) Western edge of the “Prow” on the summit of Roraima-tepui, showing the summit’s physiographical and ecological isolation from the surrounding uplands and neighbouring tepuis. (c) Drone photograph of the “Prow” of Roraima-tepui (taken on 14 August 2018, facing south). (d) The summit of Roraima-tepui in the dry season (photograph taken on 27 March 2019); note strong aridification. (e) The summit of Roraima-tepui in the wet season (photograph taken on 8 August 2018); note substantial flooding. Photos by PJRKFull size imageTepui summits (Fig. 1b, c) constitute a unique landscape, reaching up to ca. 3 km elevation and being both physiographically and ecologically isolated from the more fertile surrounding environment and are believed to have served as the inspiration for Sir Arthur Conan Doyle’s The Lost World. Their characteristic vegetation grows on acidic, oligotrophic soils, and tepui summits are renowned for high floral and faunal endemism [9]. High tepui summits (> 2,500 m elevation) are further characterized by extreme and seasonally contrasting environmental conditions, typified by strong cold winds, intense solar, infrared, and ultraviolet radiation, with extreme droughts during the dry season contrasting with substantial precipitation and flooding during the wet season, which usually peaks over 2–3 months (Fig. 1d, e). Vertebrate life on high tepuis is usually depauperate, typically consisting of endemic early-branching lineages and a few ecologically plastic invaders (e.g [10,11,12,13,14,15,16], for amphibians and reptiles).Toads in the genus Oreophrynella represent one of these endemic early-branching lineages seemingly well adapted to the tepui-top environment [17,18,19,20]. Terrestrial breeding and direct development have been reported in summit populations of Oreophrynella, with eggs sometimes deposited in large communal nests [20], though the general ecology of Oreophrynella species is largely unknown [18].Although tepui-top Oreophrynella populations are predicted to have low connectivity and high genetic differentiation due to the ancient and complex geomorphology of the region, genetic divergence across isolated tepui-summit Oreophrynella populations is substantially lower than expected, close to or equal to zero in the two rapidly evolving mitochondrial gene fragments studied [21]. These contradictory features (low divergence vs. ancient isolation) contrast sharply with the many reports of strong structuring among vertebrate populations in post-Pleistocene Neotropical landscapes, which are not only much younger but are also much less topographically isolating (e.g [22,23,24], for amphibians). Oreophrynella quelchii, listed as Endangered by IUCN [25], reaches 16.2–29.8 mm snout-vent length [SVL] in adults [18] and is known only from the summit of two neighbouring tepuis, Roraima-tepui (∼ 2,800 m/summit area 35 km2) and Wei-Assipu-tepui (∼ 2,260 m/summit area 3 km2). These two summits are separated by less than 2 km (airline) and by dense highland and upland rainforests (see [26]). The uncorrected pairwise distance between these populations is 0% in 16S and ND1 gene fragments [21]. Good dispersal abilities are thus anticipated if gene flow is ongoing across these tepui summits and/or if vertical displacements were instigated by “recent” environmental stressors, such as climatic oscillations, as proposed by Rull [27]. However, the OCBIL theory posits that tepui summit populations, seemingly adapted to impoverished, patchily distributed soils, should have reduced dispersibility due to the substantial risk of individuals moving to sites unsuitable for establishment [7]. The OCBIL theory also predicts enhanced abilities to persist in small, fragmented populations (i.e., enhanced resilience; [5]). Indeed, millions of years of evolution in fragmented populations presumably selected for persistence and resilience to habitat fragmentation, possibly leading to inbreeding through small population size [5, 7].These assumptions have yet to be empirically tested. To date, virtually nothing is known about the spatial ecology of tepui-top species or the drivers shaping space use patterns on tepui summits. Similarly, the population sizes and dispersal potential of tepui-top species have never been investigated. Therefore, the main aims of this work were to investigate, under the framework of the OCBIL theory, the population size and dispersal abilities of Oreophrynella quelchii using harmonic radar tracking and capture-mark-recapture (CMR) studies, which were also used to explore the species temporal niche and microhabitat use. Our field effort encompassed both wet and dry seasons, allowing us to assess whether seasonal variability and acute environmental variables/stressors can inform us about potential dispersal, population dynamics, and extinction risks of O. quelchii on the summit of Roraima-tepui. In a broader context, our results provide a framework for better understanding the global ecology and evolution of OCBIL faunas.MethodsStudy areaOur study was conducted on the summit of Roraima-tepui (05°12’ N, 60°44’ W, Fig. 2a) in June–August 2018 (42 consecutive days/wet season) and February–March 2019 (40 consecutive days/dry season). The study area focused on the northern part of the tepui called “the Prow” (Figs. 1c and 2a and b). Summit vegetation includes low-growing tepui forests, tepui scrub, and high mountain meadows and grasslands [28]. The available literature reports the climate as submicrothermic and ombrophilous, with heavy rainfall, dense cloud and mist formation almost all year, and an average annual air temperature of 8–12 °C [29]. Minimum air temperatures of 1–2 °C have been recorded, and freezing temperatures may occasionally occur [29]. McDiarmid & Donnelly [30] reported mean annual precipitation of 2,500–3,000 mm at sites above 1,500 m elevation.Fig. 2(a) Schematic of the summit of Roraima-tepui and Wei-Assipu tepui (left), and LANDSAT image of the “Prow” depicting the five 40 m × 40 m plots in red (right). (b) Drone photograph of the study area, showing four of the five plots (image shows an area of ∼ 2 km2). Photo by PJRKFull size imageClimatological monitoringPrecipitation was recorded every 24 h using a TFA® Dostmann Rainman electronic rain gauge. Other climatic variables, including heat index, barometric pressure, relative humidity, temperature, wind chill, and wind speed, were recorded every 20 min using a KESTREL® 4500 Weather Meter. Both devices were placed at the location of our field laboratory on exposed rock for most of the duration of each field campaign.Population parametersPopulation size was investigated using a CMR design modelled on Funk et al. [31] and Lettink [32]. A georeferenced LANDSAT-based map of the Prow was divided into numbered plots of 40 m × 40 m in QGIS 2.18 [33]; five plots were randomly selected using a random number generator (http://www.numbergenerator.org). Once in the field, the plots were delineated with a rope and further subdivided into 25 quadrats of 8 m × 8 m (Fig. 3); we thus surveyed a total of 125 8 m × 8 m quadrats. Each plot was mapped from the air (40–60 m altitude) using a DJI® Mavic Pro drone (e.g., Fig. 3). Coordinates of the northeast corner of each plot are as follows: Plot 1: N5°14’16.3” W60°43’51.9”, 2649 m elevation; Plot 2: N5°14’01.5” W60°44’02.3”, 2680 m elevation; Plot 3: N5°14’00.7” W60°44’04.7”, 2680 m elevation; Plot 4: N5°14’06.7” W60°44’10.5”, 2680 m elevation; Plot 5: N5° 13’ 52.9” W60° 44’ 21.7”, 2654 m elevation.Fig. 3(a) Captures (red) and recaptures (blue) of Oreophrynella quelchii within Plot 4 during the wet season. (b) Captures (red) and recaptures (blue) of O. quelchii within Plot 4 during the dry season. (c, d) Recaptures of O. quelchii in Plot 4 across seasons. Each numbered circle represents a single individual captured (or recaptured) during both seasons (c = wet season; d = dry season). The green circle indicates a specimen found in the same quadrat, orange circles indicate specimens that moved to a neighbouring quadrat, and red circles indicate individuals that moved to a non-neighbouring quadrat. Note that (a, b) should not be compared to (c, d) as they represent different time framesFull size imageEach plot was surveyed every five days with minimum disturbance (no substantial habitat modification or removal of vegetation) for five survey periods (totalling 25 days each in the wet and dry seasons). Each individual toad found within the plots was identified with a ventral surface photograph, taken in a glass petri dish, and assigned a unique identification number before being released at the exact location of capture (Fig. S1a). Notes on microhabitat variables and toad location within quadrats were recorded. Locations were later reported on the aerial maps taken by the drone to permit comparison of the distribution of individuals among plots between seasons. Drone footage was collected during wet and dry seasons to characterize differences in the landscape and hydric conditions.Population estimationThe ventral colour patterns of Oreophrynella quelchii are sufficiently variable to discriminate among individuals, allowing for unique identification through pattern recognition (Fig. S1a, b). CMR data were compiled from a manual photo-matching process (performed separately by three of the authors). Results of confirmed recaptures were processed to determine abundance using the Rcapture package (version 1.4-4) for capture-recapture experiments in R version 4.3.1 [34]. We used a closed population model for our analysis, which assumes that no birth, death, immigration, or emigration occurred during the study (i.e., population size within plots remained constant). This assumption is usually valid for data sampled across a relatively short period and when only adults are assessed [35, 36]. It should be noted that the data retrieved from both the tracking experiment (distances moved by individuals from initial sites of capture, non-linear movement patterns) and the plot surveys (distances moved by recaptured individuals within plots, absence of recaptures between close plots, occurrence of recaptures between seasons) favour the a"
