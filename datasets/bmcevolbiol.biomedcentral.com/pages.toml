full_description = "Editorial Board Senior EditorJennifer Harman, PhD, Springer Nature, UKJennifer is an Editor on the BMC Series based in the London office. Before joining BMC Ecology and Evolution, Jennifer completed her PhD within the Department of Medicine at the University of Cambridge. After graduating, Jennifer became a Postdoctoral Research Associate at the Royal Veterinary College in London. Throughout her research career, she studied the role of epigenetic and inflammatory mechanisms underlying cell behaviour changes associated with vascular disease. Jennifer actively supports the publication of open and reproducible research.Assistant Editor Vidhi Sarin, MSc, BSc, Springer Nature, IndiaManuscript Editors Nikhil Ghate, PhD, MSc, BSc, Springer Nature, India Akshay Ravindra Joshi, PhD, MPhil, MSc, BSc, Springer Nature, India Raunaq Singh Nagi, PhD, MSc, BSc, Springer Nature, India Noohi Nasim, PhD, Springer Nature, India Rajasree K P, PhD, MSc, BSc, Springer Nature, India Pranitha Pandit, PhD, MPhil, MSc, BSc, Springer Nature, India Priya Sharma, PhD, MSc, BSc, Springer Nature, India Varsha Shetty, PhD, Springer Nature, India Neha Tiwari, PhD, M.Tech, B.Tech, Springer Nature, India Pratibha Verma, PhD, MSc, BSc, Springer Nature, IndiaSenior Editorial Board MembersDavid Ferrier, PhD, University of St. Andrews, UKEvolutionary developmental biology and morphology David Ferrier is a Reader in Biology and Deputy Director of the Scottish Oceans Institute, University of St Andrews, UK. His work focuses on animal evolutionary developmental biology and comparative genomics and uses a variety of invertebrates to better understand the links between genome evolution and development. David obtained his DPhil from the University of Cambridge in 1996, did postdocs at the Universitat de Barcelona and University of Reading, then became a Departmental Lecturer at the University of Oxford. He moved to the University of St Andrews as an RCUK Fellow in Marine Biology in 2007. David has been on the editorial board at BMC Evolutionary Biology since 2009, becoming a Section Editor in 2016.Christy Hipsley, PhD, University of Copenhagen, DenmarkEvolutionary morphology and vertebrate paleontology Christy Hipsley is an Assistant Professor in the Department of Biology at the University of Copenhagen, Denmark. Her research focuses on deep-time patterns of evolution in vertebrates, using state-of-the-art bioimaging combined with phylogenetics. She is particularly interested in the evolutionary dynamics of morphological transformations – profound changes in body plans that accompany major shifts in diversification and life history. Christy received her PhD from the University of California, Santa Cruz, in 2012 while spending the majority of her doctoral studies at the Museum für Naturkunde Berlin. She continued as a Museum postdoc under Professor Johannes Müller, and relocated to Australia from 2015-2020 as an Australian Research Council fellow at the University of Melbourne. Throughout her career, Christy’s work has relied heavily on museum collections, where she has described new species of lizards and frogs, Australia’s first recorded extinct marine invertebrate, and the first developmental series of an extinct marsupial, the Tasmanian tiger. Christy became a senior Editorial Board Member of BMC Ecology and Evolution in 2022. David Liberles, PhD, Temple University, USACarmel McDougall, PhD, The University of St Andrews, UKEvolutionary developmental biology and biodiversity Dr. Carmel McDougall is a lecturer at the Scottish Oceans Institute, University of St Andrews, Scotland. With a background in molecular biology and aquaculture research, she became involved in shellfish reef restoration after stumbling across healthy oyster reefs in Australia while conducting a molecular survey of oyster biodiversity. Her research group uses comparative and functional genomics and experimental studies to provide practical outcomes for sustainable aquaculture and marine conservation, and to shed light on the evolution and diversity of the amazing repertoire of organisms found within our oceans.Josef Settele, PhD, Helmholtz-Centre for Environmental Research - UFZ, GermanyArndt von Haeseler, Dr. rer. nat., Center for Integrative Bioinformatics Vienna, Austria Genome evolution and evolutionary systems biology Arndt von Haeseler is a full Professor for Bioinformatics at the University of Vienna and at the Medical University of Vienna. His work focusses on methods to understand and model evolutionary processes and to infer evolutionary relationships. Arndt received his PhD in mathematics at the University of Bielefeld, he did his postdoc with Mike Waterman at the University of Southern California (Los Angeles), followed by several faculty positions in Munich, Leipzig and Düsseldorf (Germany). In 2005 he moved to Vienna where Arndt is now the head of the Center for Integrative Bioinformatics Vienna (www.cibiv.at) at the Max F Perutz Laboratories. His group in Vienna continues to work on theoretical aspects of molecular evolution and is also interested in computational tools to analyse high throughput sequencing data. Arndt has been an editorial board member at BMC Evolutionary Biology since 2010.Editorial Board Members Amir Abbasi, PhD, National Center for Bioinformatics, Quaid-i-Azam University, Pakistan Chris Adami, PhD, Michigan State University, USA Maja Adamska, Dr. rer. nat., Australian National University, Australia Christian Albrecht, Justus Liebig University Giessen, Germany Bader H. Alhajeri, Kuwait University, Kuwait Carlos Alonso-Alvarez, Dr. phil., National Museum of Natural Sciences, Spain David Alvarez-Ponce, University of Nevada, Reno, USA Hitoshi Araki, PhD, Hokkaido University, Japan Didier Aurelle, PhD, Aix Marseille Université, France J. Antonio Baeza, PhD, Clemson University, USA David Basanta, PhD, Moffitt Cancer Center, USA Betty Benrey, PhD, University of Neuchatel, Switzerland Franziska Beran, Dr. rer. nat., Max Planck Institute for Chemical Ecology, Germany Joseph Bielawski, PhD, Dalhousie University, Canada Corentin Bochaton, PhD, Max Planck Institute for the Science of Human History, Germany Erich Bornberg-Bauer, University of Muenster, Germany Christopher Boyko, PhD, American Museum of Natural History, USA Ignacio González Bravo, PhD, CNRS Montpellier, France Sophie Breton, PhD, University of Montreal, Canada Anna Brüniche-Olsen, PhD, University of Copenhagen, Denmark Gary Bucciarelli, PhD, UCLA, USA Damien Caillaud, University of California Davis, USA Arley Camargo, PhD, Universidad de la República, Uruguay Colin Campbell, PhD, University of Mount Union, USA Elena Cantarello, PhD, Bournemouth University, UK Giorgio Carnevale, PhD, Università degli Studi di Torino, Italy Alvar Carranza, Dr. Sci. (Biol.), University of the Republic, Uruguay Didier Casane, Dr. Sci. (Biol.), University of Paris, France Bénédicte Charrier, CNRS, France Luzhen Chen, Ph.D, Xiamen University, China Xiangrui Chen, Dr, Ningbo University, ChinaYouhua Chen, PhD, Chinese Academy of Sciences, China Yuanyuan Chen, PHD, Wuhan Botanical Garden, Chinese Academy of Sciences, China Pierre-Olivier Cheptou, PhD, CEFE/CNRS, France Andrea Chiocchio, PhD, Tuscia University, Italy Peiyun Cong, PhD, Yunnan University, China Sofia Consuegra, University of Swansea, UK Keith Crandall, PhD, George Washington University, USA Roslyn Dakin, PhD, Carleton University, Canada Cecilia Dahlsjö, Dr. phil., University of Oxford, UK Etienne G.J. Danchin, PhD, INRA, France Henrik Hjarvard de Fine Licht, PhD, University of Copenhagen, Denmark James Degnan, University of New Mexico, USA Christophe Dessimoz, Dr. phil., University of Lausanne, Switzerland Arjan De Visser, PhD, Wageningen University, Netherlands David Duchene, University of Copenhagen, Denmark Andréaz Dupoué, Sorbonne Université, France Ingo Ebersberger, Dr. rer. nat., Goethe University Frankfurt, Germany Garth D. Ehrlich, PhD, Drexel University, Germany Sar