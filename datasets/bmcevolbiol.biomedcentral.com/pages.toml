title = "Snake-like bird hisses induce anti-predator responses in a frog | BMC Ecology and Evolution | Full Text"
description = "Some snakes emit hissing calls which are imitated by birds to deter potential predators. However, the effect of these snake and bird hisses on anuran risk recognition is not yet explored. Here we hypothesize that these hisses may advertise dangers to frogs and evoke their anti-predator responses. We used little torrent frogs (Amolops torrentis) as subjects and conducted sound playbacks to test their anti-predator behaviors. We found that little torrent frogs changed their calling behaviors during sympatric snake hiss playbacks, but showed no response to white noise and allopatric snake hiss playbacks. They did not respond to sympatric avian hiss that has low acoustic similarity with snake sounds. However, they decreased calling activity in response to sympatric avian hiss that has high acoustic similarity with snakes. As compared to other treatments, more individuals ceased calling during the playbacks of the highly similar bird hiss. These results suggest that frogs may recognize risks from snake and snake-like hissing calls and perform anti-predator responses."
full_description = "Research Open access Published: 12 October 2024 Snake-like bird hisses induce anti-predator responses in a frog Longhui Zhao ORCID: orcid.org/0000-0002-8675-81751, Yuanyu Qin1, Yanjun Jin1, Jichao Wang1 & …Wei Liang ORCID: orcid.org/0000-0002-0004-97071 Show authors BMC Ecology and Evolution volume 24, Article number: 126 (2024) Cite this article 730 Accesses 2 Altmetric Metrics details AbstractSome snakes emit hissing calls which are imitated by birds to deter potential predators. However, the effect of these snake and bird hisses on anuran risk recognition is not yet explored. Here we hypothesize that these hisses may advertise dangers to frogs and evoke their anti-predator responses. We used little torrent frogs (Amolops torrentis) as subjects and conducted sound playbacks to test their anti-predator behaviors. We found that little torrent frogs changed their calling behaviors during sympatric snake hiss playbacks, but showed no response to white noise and allopatric snake hiss playbacks. They did not respond to sympatric avian hiss that has low acoustic similarity with snake sounds. However, they decreased calling activity in response to sympatric avian hiss that has high acoustic similarity with snakes. As compared to other treatments, more individuals ceased calling during the playbacks of the highly similar bird hiss. These results suggest that frogs may recognize risks from snake and snake-like hissing calls and perform anti-predator responses. Peer Review reports Acoustic signals are widely used for conspecific communications in animal kingdom. However, animals also transmit information to unintended audiences when they perform calling behaviors (Phelps et al. 2007; Aschemeier and Maher 2011; Halfwerk et al. 2014; Liu and Liang 2022). Acoustic heterospecifc eavesdropping is an interesting research topic in animal behavior and ecology field. For those unintended receivers, eavesdropping on the information of other taxa can reduce uncertainty and makes optimal decisions (Page and Ryan 2008; Akre et al. 2011; Magrath et al. 2015). Eavesdropping on heterospecific vocal signals has a close relationship with diverse contexts such as prey/host detection, predator avoidance, mate choice, and resource defense (Danchin et al. 2004; Magrath et al. 2015; Goodale et al. 2019; Bernal and Page 2023).As compared to conspecific eavesdropping alone, heterospecific eavesdropping has a potential to gain more information across various taxa (Phelps et al. 2007; Magrath et al. 2015). Studies of frog-biting insects suggest that midges have evolved an ability of eavesdropping on anuran advertisement calls and use the calls to locate their hosts (de Silva et al. 2015; Legett et al. 2019; Zhao et al. 2022b). Such interspecific interactions bring longer-term foraging benefits and could promote the appearance of species-specific innate responses (de Silva et al. 2015). Some reptiles, birds, and mammals are found to exploit heterospecific alarm calls to obtain immediate anti-predator benefits (Magrath et al. 2015). For instance, wild capuchin monkeys (Sapajus nigritus) perform adaptive anti-predator reactions after learning to associate heterospecifc alarm signals with predators (Wheeler et al. 2019). Studies of forest reptiles and birds show that iguanas can discriminate mobbing calls of sympatric flycatchers from other calls and then increase their vigilance behaviors (Ito and Mori 2010). Anura (frog and toad) is one of the main taxa that communicate with sound signal. However, heterospecific acoustic eavesdropping is largely unexplored in anuran species.Some anurans are able to detect predators by conspecific alarm or distress calls (Forti et al. 2017; Hopkins and Folt 2019). For instance, smoky jungle frogs (Leptodactylus savagei) are warned by scream calls of nearby conspecific individuals during predation events (Hopkins and Folt 2019). Studies of túngara frogs (Physalaemus pustulosus) indicate that anurans can selectively attend to heterospecific frog calls produced in presence of predators and may regard choruses as alarm signals (Phelps et al. 2007; Dapper et al. 2011). Moreover, anurans may make a trade-off between reproductive benefits and survival costs when they recognize the change of risks. When túngara frogs produce complex calls to attract females, they also have attractiveness to predators and parasites (Bernal et al. 2006; Akre et al. 2011; Halfwerk et al. 2014). The túngara frogs from urban population not only detect a change in predation and parasitism pressure from eavesdroppers, but also show adaptive signaling adjustments in forest vs. urban sites (Halfwerk et al. 2019). Some anuran predators (e.g., birds and snakes) also emit sounds (Aubret and Mangin 2014; Møller et al. 2021b), which is likely to advertise risk information. Few studies have tested whether anuran species can exploit predator calls to avoid enemies (but see Phelps et al. 2007).Snakes are one of the main predators of frogs. Despite having a weak hearing ability, they can generate sounds in various ways (Young 2003). When threatened, some snakes generate highly defensive hissing calls. The hisses have similar spectral traits with poor structure (Young et al. 1999; Aubret and Mangin 2014). Such sounds may not indicate one-to-one links between alarm signals and predators (or predator contexts) tightly, which could promote the achievement of risk recognition by receivers (Price et al. 2015; Deshpande et al. 2023). Recently, some birds are found to mimic the hisses of vipers to deter potential predators (reviewed by Møller et al. 2021b). The hisses can influence avian reproductive success (Koosa and Tilgar 2016) or increase its chances of escaping from predators (Krams et al. 2014; Zub et al. 2017). To our knowledge, however, so far no research has tested whether these hisses advertise dangers and induce anti-predator responses in anuran species.Snake’s hisses show a high degree of similarity, although their acoustic durations may vary in different species (Young 2003). These hisses have a low acoustic specialization and may provide broad warning signals (Møller et al. 2021b). Meanwhile, the high degree of similarity between snake and bird hisses has also been revealed in sympatric (e.g., Dutour et al. 2020) and allopatric species (e.g., Møller et al. 2021a). Therefore, frogs may react to hissing sounds from snake predators. However, the hiss is only emitted by a snake when it is threatened (Møller et al. 2021a). Given that snakes eat frogs it is unlikely the hiss is emitted during a hunting sequence. Therefore, if it is a sound in the context of eavesdropping on an alarm signal then the frogs could be cuing in on a sound that indicates a predatory threat that is shared among snakes, birds and the frogs. We thus presume that snake and avian hisses may evoke anti-predator responses in a similar manner.Here we used little torrent frogs (Amolops torrentis) to test our hypothesis. This species emits loud and long (~ 5.5 s) calls consisting of many short notes (Zhao et al. 2018). Males often perform calling behaviors throughout the entire day and night consequently, overlap in the active periods of sympatric snakes and birds. Hainan Island is a common distribution area of little torrent frogs, zitting cisticolas (Cisticola juncidis) and cinereus tits (Parus cinereus). The cinereus tit (of southern Asia) and Japanese tit (P. minor) (of East Asia) have been separated into two distinct species from the great tit (P. major) (Zheng 2023). In addition, snakes from Viperidae, Elapidae, and Colubridae have been reported to perform hiss displays (Møller et al. 2021a) and have large species richness in Hainan tropical rainforest (Wang 2014). In the rainforest, some snakes, such as Sinonatrix percarinata from Colubridae, have been found to prey on little torrent frogs. It is possible that the little torrent frogs may perceive risks from hisses of those snakes and birds.Two experiments were designed for the hypothesis. In the first experiment, we used sound playbacks to test how little torrent frogs responded to white noise, zitting cisticola song, and snake hisses. In the second experiment, we used the sound playbacks to test how the little torrent frogs responded to white noise, great tit hisses (snake-like calls with low similarity), and zitting cisticola hisses (snake-like calls with high similarity). Anurans may perform fleeing behaviors when exposed to acoustic signals advertising risk information (Toledo et al. 2015; Hopkins and Folt 2019; Feagles and Höbel 2022). We predicted that frogs would flee from sound sources or adjust calling behaviors (e.g., ceasing calling and reducing call rate) if these snake and bird hisses served as alarm signals.MethodsPlayback sound filesFour types of sound stimuli were used in the first playback experiment. The first type was white noise (as a control) which was generated using Adobe Audition 3.0 software (Adobe Systems Inc., San Jose, CA, U.S.A.). The second type was a song of zitting cisticola. White noise playbacks increase background noise levels of focal locations, which may affect the behaviors of calling individuals. Zitting cisticola does not feed on frog species (Zhao 2001), and we selected it’s song as an additional control. The third and fourth types were Gaboon vipers (Bitis gabonica) and king cobras (Ophiophagus hannah) hisses, respectively. Three types of sound stimuli were used in the second playback experiment. The first type was also white noise which was the same as the first experiment. The second and third types were snake-like hissing calls of great tits and zitting cisticolas, respectively. All hissing calls were obtained from a previous study (Barlow et al. 2023).Hissing calls produced by zitting cisticola (Additional file 1) show the largest resemblance with snake hisses (Additional file 2 and 3) and appear in a same cluster with snake species in previous acoustic analysis (Barlow et al. 2023). Tits often utter sharp hissing calls (Additional file 4) that have similar acoustic spectral structure with snakes (Krams et al. 2014; Møller et al. 2021a), but the similarity is lower than zitting cisticola hisses. Great tit hisses show a percussive onset that is not found in zitting cisticola and snake hisses. As compared to great tits, the spectral traits of zitting cisticola hisses are more approximate to snake hisses (Fig. 1). For each song and snake-like hiss, two or three recording files from different individuals were chosen to make acoustic signals representative. The snake-like types are scarce and only two files were obtained for them. Snake hisses are also rare and only one recording was obtained for each species. Snake and snake-like bird hisses are poorly structured sounds and show little individual variation within species (Young et al. 1999; Dutour et al. 2020). So, the small size of such stimulus is also representative. All sound files were repeatedly copied and lengthened to 3 min. Then a 3 min quiet zone was inserted before and after the copied zone, respectively. Snake-like hisses from sympatric birds have long recordings and their natural repetitions were used during playbacks. Snake hiss recordings were short and their repetition rate (16 hisses per min) was set according to the average of sympatric bird hisses to make the stimuli similar to what the frogs would perceive in nature. All sound editing was conducted in Adobe Audition 3.0 software. Fig. 1Spectrogram comparisons of the Gaboon viper and king cobra hissing call (a, b), low snake-like hissing call of the great tit (c), and high snake-like hissing call of the zitting cisticola (d). As compared with great tit hiss, zitting cisticola hiss show a more similar frequency contour with snake hissFull size imageSound playback experimentsSound playbacks were conducted in July 2022 (experiment 1) and June 2023 (experiment 2) at a tropical forest stream, Wuzhishan National Nature Reserve (109°32’-43’ E, 18°48’-59’ N), Hainan, south China. In playback experiments, a speaker (Clip3, JBL, USA) was fixed on a shelf bracket and placed at a 1 m distance to focal individual. When disturbed, little torrent frogs often move away from original position and jump into water. In this study, they were not observed to be disturbed by setting up the experiment. All stimuli were played via a digital voice recorder (ICD-PX470, Sony, Japan) connected to the speaker. During sound playbacks, the sound pressure levels (SPLs) of all stimuli were about 80 dB in the 1 m distance. Previous studies have shown that the amplitude approximates to the natural SPLs (75–85 dB) of avian hisses/calls (Møller et al. 2021a). In each experiment, different types of stimuli were stochastically broadcasted to avoid the effect of test sequence on behavioral response. One of two (or three) sound files was chosen when animals were presented with zitting cisticola songs, great tit hisses, and zitting cisticola hisses. The test processes and animals’ behavioral responses were recorded using a digital video camera (FDR-AX40, Sony, Japan). Next, we provided more details about the playback procedures.Environmental fluctuation, such as diurnal temperature variation, may influence the ability of this species to perceive acoustic signals (Sun et al. 2020). To decrease the difference of weather condition, playback tests were only carried out between 8.00 and 14.00 on sunny days. The landscape is complex in Wuzhishan mountain streams in which high and precipitous places often have more background noise than other places. In order to increase signal-noise ratio (SNR), only frogs that called at relative flat terrains (low-noise locations) were considered as subjects. Three frogs were abandoned in the second experiment because they seldom called or stopped calling prior to the beginning of test. These rules allowed us to minimize environmental variation in different individuals. During breeding seasons, male little torrent frogs inhabit streams or nearby vegetation. Males are territorial and consecutively occupy a location for many days. Both experiments were completed within a few days, and males were tested in different locations (one frog was tested in a location). So, all individuals were not tested repeatedly in a same experiment.Analysis and statisticsThree behaviors were analyzed by watching videos. Little torrent frogs prefer to call on the rocks in the stream. They would immediately jump into stream water when threatened. The number of escaping and not escaping individuals in each stimulus was calculated by observing whether animals jumped into the water. The number of calls in periods before, during and after each playback was determined by calculating the amount of vocal sac inflation. The number of ceasing/not ceasing calling individuals in different treatment groups was also calculated by watching the videos of all individuals. Males were considered as “individuals that ceased calli"
