title = "Age and environment are the main drivers shaping the wild common sole (Solea solea) microbiota | BMC Ecology and Evolution | Full Text"
description = "Microbiota plays an essential role in fish growth and health and may be influenced by the changing environmental conditions. Here, we explored the microbiota of wild common sole, one of the most important fishery resources in the Mediterranean Sea, collected from different areas in the North Adriatic Sea. Our results show that the sole microbiota differs from that of the surrounding environment and among the different body sites (gill, skin and gut). Gut microbiota composition showed to be strongly related to fish age, rather than maturity, sex or sampling site. Age-related shifts in gut microbial communities were identified, with increased abundances of Bacteroidia and Desulfobacteria, unveiling potential microbial proxies for age estimation crucial for fisheries management. Our results expand the limited knowledge of the wild common sole microbiota, also in the light of the potential usefulness of the fish microbiota as a tool for future stock identification and connectivity studies."
full_description = "Research Open access Published: 06 September 2024 Age and environment are the main drivers shaping the wild common sole (Solea solea) microbiota Marco Basili1,2 na1, Laura Sabatini2,3 na1, Giulio Pellini2, Naomi Massaccesi1,2, Elena Manini2,4, Fortunata Donato2, Giuseppe Scarcella2,4, Gian Marco Luna2,4 & …Grazia Marina Quero2,4 Show authors BMC Ecology and Evolution volume 24, Article number: 118 (2024) Cite this article 746 Accesses 1 Altmetric Metrics details AbstractMicrobiota plays an essential role in fish growth and health and may be influenced by the changing environmental conditions. Here, we explored the microbiota of wild common sole, one of the most important fishery resources in the Mediterranean Sea, collected from different areas in the North Adriatic Sea. Our results show that the sole microbiota differs from that of the surrounding environment and among the different body sites (gill, skin and gut). Gut microbiota composition showed to be strongly related to fish age, rather than maturity, sex or sampling site. Age-related shifts in gut microbial communities were identified, with increased abundances of Bacteroidia and Desulfobacteria, unveiling potential microbial proxies for age estimation crucial for fisheries management. Our results expand the limited knowledge of the wild common sole microbiota, also in the light of the potential usefulness of the fish microbiota as a tool for future stock identification and connectivity studies. Peer Review reports IntroductionFish farming, health, management, and habitat restoration are among the potential downstream uses of microbiome research in fish ecology [1]. Host-associated microbiomes present inside, as well as on body surfaces, can influence a broad range of host immunological, evolutionary, and ecological processes [2]. The microbiome is increasingly recognized as a crucial yet poorly explored tool for managing fish resources, since it represents an effective way to understand how fish respond to environmental changes [2,3,4,5,6]. Therefore, exploring fish microbiota may represent a new strategy for promoting fish health and fundamentally improving how we safeguard and manage aquatic resources for future generations [1].It has been emphasized that, in order to provide robust baseline data for both comparative purposes and a better understanding of fish biology, more studies on wild marine teleost fish species should be performed [7, 8]. This holds true also for the wild common sole, Solea (S.) solea (Linnaeus, 1758), a demersal species that is particularly abundant on relatively low-depth sandy and muddy bottoms in the Mediterranean Sea and the North–Eastern Atlantic [9]. It represents a commercially relevant flatfish resource in the Mediterranean Sea [10] and is one among the most valuable new candidates for aquaculture practices [11, 12]. Most of the common sole catches in the Mediterranean Sea are provided by fishing activities carried out in the Central and Northern Adriatic basin [10, 13] The species spatial distribution extends from shallow to 90-100 m deep waters. It is characterized by ontogenetic migrations, with adult individuals moving toward deeper waters [14, 15] and eggs/larvae returning to western coastal waters and lagoons, generally following the basin circulation [16]. So, juveniles (0 years) are mostly concentrated along the Italian side up to 30 m depth around the Po River mouth. From Trieste to Ancona, 1-2 years old sole individuals are observed along the entire coast, in the central part of the basin, and (only partially) close to the Croatian coasts. A certain number of old spawners (age ≥ 3 years) inhabits a portion of the offshore waters southwest of the Istrian peninsula, characterized by the presence of a peculiar benthic community dominated by holothurians and bryozoans [17]. Since these benthic species led to a lower trawl fishing effort, damaging the catch and reducing its commercial value [18,19,20,21], this area serves as a refuge, protecting big and older spawners from trawling activities. For this reason, this area was defined as a “Sole Sanctuary” (Fig. 1A) [10, 16, 22]. A particular ecological interest is being paid to this species due to an alarming overexploitation of sole stocks observed in the previous decade [10]. In addition, the species faces both indirect and direct anthropogenic impacts, such as contaminants, disrupted seabed, changing ocean conditions including decreased food availability, and juvenile exploitation by certain fishing techniques (e.g., rapido trawling), especially in the Adriatic Sea [10, 23,24,25], that are critical factors influencing the stock dynamics. Surprisingly, despite extensive research has been performed so far on the biology and ecology of this demersal species, microbiome studies in wild specimens of S. solea are still completely lacking, with the only available studies performed so far on farmed Solea senegalensis [26].Fig. 1(A). Map showing the sampling areas of the common sole individuals analyzed in this study. Per each sampled area (colored circles and polygon) the proportion of specimens at different ages is reported. The pink polygon indicates the “Sole Sanctuary”. (B). Sexual maturity (“Mat”) and age (“Age”) of sole individuals collected in each sampling Zone. Please note that “Age 0” means that sole individual’s age was < 1 year old. (C). Plot showing the relationship between weight and length of sampled common sole individuals and their age (bubble size) and sexual maturity (color gradient)Full size imageHere, in order to increase our understanding of this fishery resource, we filled this knowledge gap by exploring, for the first time, the microbiota of wild S. solea individuals collected in the Central and Northern Adriatic Sea. Microbial communities were sampled from three body sites, including gill, skin and gut. Representative marine sediment samples were also collected at each sampling zone to compare fish microbial communities with the surrounding environmental sources and to test whether the fish microbiota is influenced by the host habitat. This study is the first to explore the diversity and composition of the microbiota in wild common sole. Our findings should help direct future actions for stock management, as well as to guide aquaculture applications of this species.MethodsSampling areaS. solea individuals were collected during the SoleMon rapido trawl survey 2019. This scientific fishing activity is carried out annually in fall according to a depth-stratified sampling scheme with random allocation of stations within the GFCM Geographical Sub-Area 17 (GSA 17: Central and Northern Adriatic Sea) to collect updated data on demersal and benthic fishery resources [27]. Samples were collected from 9 sampling stations, classified into 4 different ‘Zones’ (3 outside and 1 inside the “Sole Sanctuary”) as follows: ‘Zone 1’ was located outside Ancona; ‘Zone 2’ corresponded to the ‘Sole sanctuary’; ‘Zone 3’ and ‘Zone 4’ were located above and below the Po River mouth, respectively (Fig. 1). The selection of these zones was based on available information on the species spatial distribution in the Adriatic Sea [10, 28] to investigate the microbiota community at the different ontogenetic phases and the association with the surrounding habitat. Fish individuals for biometric, otolith and microbiota analyses were randomly collected for each Zone.Sample collectionA total of 77 wild S. solea individuals were collected between November 14th to December 1st during 2019 (Table S1). From each Zone, a total of 24, 15, 20 and 18 sole individuals were collected, respectively. For each of the 77 specimens, total length (TL, to the nearest millimeter below), weight (g), sex and macroscopic maturity stage were measured and recorded. Gonadal maturity was defined following a modified ICES 5 stage maturity scale [27, 29, 30]. Sagittal otoliths were extracted from the inner ear, cleaned and stored dry in tubes for the following age analyses. For microbiota analyses, for each separate fish specimen, samples of skin (a 2 cm square from the left side), gut (tissue and inner digesta), and gill (second gill arch on the left gill) were collected. Only for gill samples, due to an insufficient yield of extracted DNA, only 8 out of 77, samples (all collected at Zone 1) were analyzed as described later. All fish tissue samples were obtained by aseptic dissection of fish specimens using sterile scalpels and scissors. After collection, all tissue samples were immediately placed in sterile tubes rinsed with sterile phosphate buffer solution to remove possible loosely attached microorganisms and stored at − 20 °C until further analyses. Representative sediment samples for each Zone (Table S2) were collected through a box corer. Sediment aliquots (1 g) for microbiota analyses were collected using sterile tools, placed in sterile plastic tubes and stored at − 20 °C until DNA extraction.Otolith analysisWhole sagittal otoliths were immersed in ethanol with the distal surface up (sulcus acusticus downwards) and read under a stereomicroscope using reflected light against a black background (5X and 10X magnification) [31]. When the reading was doubtful, the burning and sectioning techniques were used to improve the observation of ring deposition [32]. The age was estimated by three readers separately by counting the opaque rings from the core to the edge (Figure S1) and then compared. Soles and other flatfishes in the Adriatic Sea are characterized by an opposite pattern of deposition compared to that of other fishes of temperate and cold waters, as the opaque ring is laid down in winter/spring and the translucent ring in summer/autumn [31]. One opaque and one translucent ring were considered an annual growth (annulus) If the disagreement persisted after a further reading, the otolith was discarded. For the final age classification, the edge type, the date of capture and the theoretical date of birth (January 1st) were also considered [31].DNA extraction and sequencingFrom each type of fish tissue and sediments, DNA was extracted within 8 months from collection and using the DNeasy PowerSoil Kit (Qiagen) as described in Quero et al. [33]. Extracted DNA samples were stored at − 20 °C until processing. After quantification, the PCR amplification of the V3-V4 hypervariable region of the 16 S rRNA gene was carried out using the primer pair 341 F-785R [34] and the PCR product purified as described in Palladino et al. (2021). Nextera library indexing and preparation and Illumina MiSeq sequencing (2 × 300 bp paired-end protocol) were performed as described in Palladino et al. [35].Data analysisPrimer and adapter sequences were removed from raw reads with Cutadapt [36]. Paired-end reads were then imported and analyzed in RStudio version 4.4.0 (RStudio Team, 2020) using the DADA2 package (version 1.32) [37]. Quality check and trimming of the reads were performed following the package instructions (max estimated error > 2 and 2 per 100 bp for forward and reverse reads, respectively). Paired-end reads were subsequently merged in amplicon sequence variants (ASVs, i.e., clusters sharing 100% sequence identity); chimeric sequences were identified and removed from the dataset. Finally, prokaryotic taxonomy was assigned using a native implementation of the naive Bayesian classifier method against the SILVA database (v138; https://www.arb-silva.de/documentation/release-138/). Chloroplast and eukaryotic sequences were removed from the ASV table obtained from DADA2; samples with low numbers of ASV were removed from the dataset (Supplementary Data File 1). Abundance values were normalized using the median value of the dataset with the vegan (version 6.1) and phyloseq (version 1.48) packages [38, 39] and transformed in relative abundances. For the analysis of alpha diversity, ASV richness was calculated using the vegan package. The occurrence of statistical differences among richness values in the different types of samples was assessed with ANOVA test (stats package, version 4.4.0) considering all possible comparisons (sediment vs. fish samples; gut vs. skin; gut vs. age; gut vs. maturity; skin vs. age; skin vs. maturity; gut vs. Zone; skin vs. Zone; sediment vs. Zone).Non-metric multidimensional scaling (nMDS) was performed using a Bray–Curtis dissimilarity matrix and average linkage approach and plotted with the ggplot2 package. Significant differences in prokaryotic community composition between sample types (i.e., fish vs. environmental) as well as among fish tissues (i.e., skin, gut) were calculated by using ANOSIM through the anosim function (vegan package). A “Linear Discriminant Analysis Effect Size (LEfSe)” to find biomarkers of each group was performed and plotted using the ggplot2 package (version 3.5.1) [40].ResultsWe analyzed the microbiota associated with the gut, skin and gills of a total of 77 wild common sole specimens fish collected in the Adriatic Sea. Biometric measures per each specimen are reported in Fig. 1 and Table S1. Briefly, sole individuals included 50 juveniles with an estimated age of 0–1 years, and 27 adults older than 2 years (2–4 years). Sampled fishes displayed a mean length of 24.7 ± 4.6 cm (within a range of 15.5–33.1 cm) and maturity class ranging from 1 to 5 (Fig. 1). In the entire dataset, 18 individuals were classified as males and 59 as females; all males were identified as < 2 years and with a maturity stage of 1 or 2. Zone 2 was characterized by the absence of the youngest (< 1 year) and immature (stage 1) organisms; in contrast, in the same zone, individuals with the highest maturity classes (4 and 5) represented more than half of collected samples. Furthermore, we observed that the youngest individuals (i.e., age 0) were distributed exclusively in the coastal stations, whereas adult samples were mostly collected from Pula and Ancona stations (Fig. 1). Age and sexual maturity were not significantly correlated. Similarly, fish size (i.e., length and weight) was not correlated to fish age and sexual maturity (Fig. 1C).The number of initial raw reads and those passing the quality filtering performed by DADA2 are reported in Figure S2. Briefly, across the whole dataset, raw reads per samples ranged from 7,230 to 82,156 reads per sample, for an average number of 35,399 raw reads per sample. Rarefaction curves are reported in Figure S3. A total of 53,958 ASVs were observed across the entire dataset, of which 10,120 (18.8%) exclusive for sediment samples, 39,372 (73.0%) exclusive for sole samples and only 4,466 (8.3%) shared across all types of samples.The analysis of microbial communities associated with sole tissues and environmental samples showed a significant difference in alpha diversity (i.e., ASV richness and Shannon index) between fish and sediment samples (ANOVA, p < 0.001), with higher mean richness in sediments (avg. ASV richness 1,135.57 ± 256.4) than in soles (avg. ASV r"
