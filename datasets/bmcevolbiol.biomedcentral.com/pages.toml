title = "The influence of temperature and river runoff on phytoplankton community diversity in Beibu Gulf: insight from 18 S rDNA metabarcoding analysis | BMC Ecology and Evolution | Full Text"
description = "Background Sanniang Bay (SNB) and Dafeng River (DFR), located in the northern Beibu Gulf, is well-known as one of the eight habitats for humpback dolphins in China. This region is representative of typical estuarine and bay ecosystems and produce complex hydrodynamic seawater conditions. Moreover, anthropogenic pressure, such as eutrophication and large-scale infrastructure projects, have caused ongoing habitat deterioration and loss. It is urgent to know the phytoplankton community and their relationships with environmental factors in this region. Results In this study, we assessed the diversity and assembly mechanisms of phytoplankton communities, as well as their relationship with the physicochemical characteristics of seawater in SNB and DFR region using 18 S rDNA metabarcoding analysis. The results showed that seasonal changes markedly impacted the alpha diversity of the phytoplankton community. From March to July, with the average temperature increasing from 25.2℃ to 28.1℃,the Shannon or Species Richness were negatively correlated with temperature. During hot season (in Sep, average temperature 32.1℃), phytoplankton diversity was negatively correlated with nutrients (NH4 +, NO3−, PO43−, TN). Additionally, during the rainy season, the Bray-Curtis similarity of the phytoplankton community was significantly lower than during the dry season. In March, the distance among the sampling sites was most strongly and positively correlated with the Bray-Curtis dissimilarity. Stochastic processes, specifically dispersal limitation and ecological drift, are the primary drivers of community assembly, while deterministic assembly processes (mainly heterogeneous selection) contribute a relatively minor portion (< 17%). Conclusions Rising temperature diminished the diversity of phytoplankton in SNB and DFR, and nutrient inputs and eutrophication in estuarine areas will aggravate the loss of phytoplankton diversity."
full_description = "Research Open access Published: 22 October 2024 The influence of temperature and river runoff on phytoplankton community diversity in Beibu Gulf: insight from 18 S rDNA metabarcoding analysis Zheng Xiong1 na1, Zongsheng Xie1 na1, Haochen Li1 na1, Chunyan Peng1, Jixin Jia1, Xiaobo Liu1, Jingjing Song1, Ying Liu1, Yuyue Qin1 & …Bin Gong1 Show authors BMC Ecology and Evolution volume 24, Article number: 129 (2024) Cite this article 643 Accesses Metrics details AbstractBackgroundSanniang Bay (SNB) and Dafeng River (DFR), located in the northern Beibu Gulf, is well-known as one of the eight habitats for humpback dolphins in China. This region is representative of typical estuarine and bay ecosystems and produce complex hydrodynamic seawater conditions. Moreover, anthropogenic pressure, such as eutrophication and large-scale infrastructure projects, have caused ongoing habitat deterioration and loss. It is urgent to know the phytoplankton community and their relationships with environmental factors in this region.ResultsIn this study, we assessed the diversity and assembly mechanisms of phytoplankton communities, as well as their relationship with the physicochemical characteristics of seawater in SNB and DFR region using 18 S rDNA metabarcoding analysis. The results showed that seasonal changes markedly impacted the alpha diversity of the phytoplankton community. From March to July, with the average temperature increasing from 25.2℃ to 28.1℃,the Shannon or Species Richness were negatively correlated with temperature. During hot season (in Sep, average temperature 32.1℃), phytoplankton diversity was negatively correlated with nutrients (NH4 +, NO3−, PO43−, TN). Additionally, during the rainy season, the Bray-Curtis similarity of the phytoplankton community was significantly lower than during the dry season. In March, the distance among the sampling sites was most strongly and positively correlated with the Bray-Curtis dissimilarity. Stochastic processes, specifically dispersal limitation and ecological drift, are the primary drivers of community assembly, while deterministic assembly processes (mainly heterogeneous selection) contribute a relatively minor portion (< 17%).ConclusionsRising temperature diminished the diversity of phytoplankton in SNB and DFR, and nutrient inputs and eutrophication in estuarine areas will aggravate the loss of phytoplankton diversity. Peer Review reports BackgroundPhytoplankton constitute a diverse assemblage of organisms that serve as the foundation of the marine ecosystem [1]. Phytoplankton play a crucial role in the food web as primary autotrophic organisms, and are critical for preserving the equilibrium of entire marine ecosystems [2, 3]. Alterations in the phytoplankton community can serve as crucial indicators of potential changes in global oceanic ecology and biogeochemistry [4]. Carbon fixation (CO2-fixation) by marine phytoplankton accounts for nearly half of the Earth’s primary production [5]. The fluxes of CO2 and its balance in the Earth’s biosphere can significantly affect the ocean’s ability to sequester atmospheric CO2 [6], which will further impact global climate change. Besides carbon fixation, some oligotrophic diatoms, such as Rhizosolenia and Hemiaulus, are involved in nitrogen fixation process and they convert atmospheric N2 gas to bioavailable NH3 by establishing symbiotic associations with heterocystous cyanobacterium Richelia intracellularis [7]. The remarkable diversity of marine phytoplankton allows them to play a valuable role in stabilizing the material and energy balance in marine ecosystems and is crucial for sustaining the ecological equilibrium in the oceans [8].The taxonomic variety of phytoplankton in pelagic environments has captivated ecology researchers for over fifty years [9]. Spatial and temporal distribution patterns in marine phytoplankton communities are heavily influenced by dispersal and environmental selection [10]. Global studies indicate that temperature gradients have a negative effect on marine phytoplankton community structure and biodiversity [11]. Elevated nutrient influx from rivers can substantially alter the phytoplankton assemblage in coastal regions [12, 13]. Accurately measuring the composition and concentration of different phytoplankton taxa is essential for gaining an understanding of the mechanisms of phytoplankton community assembly, which would then allow us to forecast phytoplankton levels [14]. Microscopic-based [15], flow cytometry [16], and high-performance liquid chromatography (HPLC) pigment analysis [17] are techniques that have been to identify and count phytoplankton populations. However, these methods lack precision when identifying diverse phytoplankton in coastal and estuarial environments. DNA metabarcoding employs amplicon sequencing of DNA “barcode” genes, which enables the identification of multiple species from a mixed sample. As a result, DNA metabarcoding has gradually gained wider acceptance in the field of exploring phytoplankton community diversity [14].Understanding the mechanisms underlying phytoplankton community assembly has long been a central challenge in the fields of ecology and biogeography [18]. The utilization of DNA metabarcoding technology has facilitated our understanding of the mechanisms underlying phytoplankton community assembly [19]. Although some analytical uncertainty regarding this method exists [20, 21], rigorously evaluated workflows for DNA metabarcoding can, in fact, yield accurate and precise estimates of phytoplankton composition [22,23,24]. Researchers have used DNA metabarcoding to study the diversity and community assembly mechanisms of eukaryotic marine phytoplankton in the coastal waters of Guangdong-Hong Kong-Macao Greater Bay Area [25], Jiaozhou Bay [26], the north South China Sea [27], Maowei sea in Beibu Gulf [28], and the Pacific Ocean [29]. These studies revealed greater diversity of phytoplankton compared to traditional methods, and added more undeniable evidence that environmental heterogeneity and dispersal limitation affects phytoplankton community assembly [27]. However, the relative importance of environmental heterogeneity and dispersal limitation in determining the community assembly varied across regions [25, 26, 28, 30]. Given the intricate characteristics of different environmental factors, such as geomorphological, hydrodynamic, and nutrient levels, in different coastal zones [31], it is imperative to conduct more studies to explore the effects of diverse aquatic environments on the assembly of phytoplankton communities [26]. Furthermore, there is a lack of research on the mechanisms underlying the assembly of phytoplankton communities during different seasonal periods.Sanniang Bay (SNB) and Dafeng River (DFR) are located in subtropical zones, along the coast of northern Beibu Gulf near Qinzhou city, Guangxi province. This region is well-known as one of the eight habitats for humpback dolphins in China [32]. The abundant richness in biological diversity and unique characteristics of that ecosystem have attracted numerous in-depth studies [33, 34]. Moreover, the region is representative of typical estuarine (Dafeng River) and bay (Sanniang Bay) ecosystems. The intricate topographical characteristics produce complex hydrodynamic seawater conditions in this region [35].In 2012, the Sandun Island Petrochemical Dock was constructed in Qinzhou Bay [36]. This reclamation project resulted in a 10-km-long transport embankment that hindered freshwater input and seawater exchange in the eastern part of Qinzhou Bay [35]. It profoundly changed the hydrodynamic conditions and sediment transport processes of the region [35, 37], which may distinctively alter the diversity of the plankton. However, until now, there have been no reports regarding the spatio-temporal distribution of the phytoplankton community, the diversity of the species, and their relationships with environmental factors.The aim of this study is to investigate all the above questions. Our research holds great significance for the exploration of biodiversity and the underlying formation mechanisms within the coastal ecosystem of Beibu Gulf.Materials and methodsField samplingSixteen sites were sampled for this study near Sanniang Bay in northern Beibu Gulf (21.63°N, 108.69°E-21.56°N, 108.93°E), China. The samples were taken at depths less than 11 m, with a salinity of 17.78–31.99‰ during the months of March (Mar) 2019, July (Jul) 2019, September (Sep) 2018, and December (Dec) 2018. The sampling area included typical estuarine (Dafeng River) and bay (Sanniang Bay) ecosystems. Moreover, the site was selected because it is well-known for being one of eight habitats for humpback dolphin subpopulations in Beibu Gulf, China [38]. Seawaters were collected at the surface, middle, and bottom layers in 5 L sterile containers, and then mixed together at a 1:1:1 ratio. Each sampling site was a square area measuring 6 m × 6 m, and seawater samples were collected in triplicate. The seawater samples were stored on ice and then transferred immediately to the lab. 2 L of seawater was pre-filtered with 20-µm nylon mesh to remove large zooplankton, phytoplankton and other particles. Then the filtered seawater was re-filtered with 0.45-µm hydrophilic PVDF membranes. After filtration, each membrane was placed in a sterile plastic self-sealing bag and stored at -80℃ until the eDNA was extracted and analyzed.Analysis of seawater physico-chemical characteristicsIn situ measurements of temperature (TEMP), depth and salinity of the seawater were taken using a CTD (conductivity-temperature-depth) sensor (SBE19 Plus V2, SeaBird, USA) [39]. Turbidity was measured using a portable turbidimeter (2100Q, HACH) [40]. The pH of the seawater samples was measured by a portable pH meter (FiveGo, METTLER TOLEDO, Switzerland). Nitrate (NO3−), nitrite (NO2−), ammonium (NH4 +), and phosphate (PO43−) were detected in the filtered seawater samples using an autonomous nutrient analyzer (CleverChem Anna, DeChem-Tech, Germany) [41]. The seawater was filtered with 0.65-µm polycarbonate films (Whatman, England), and then the chlorophyll a (Chl-a) was extracted from the membrane with 90% (V/V) acetone and measured by the spectrophotometric method [42]. Total organic carbon (TOC) of the seawater was measured using a TOC analyzer (Aurora 1030 C, OI Analytical, USA). Real-time online measurement of dissolved oxygen (DO) was conducted with a portable dissolved oxygen meter (LDO10110, HACH, USA) [43]. Total nitrogen (TN) was estimated using the Pyrolysis-Chemiluminescence method (ASTM D5176-08) [44]. Total phosphorus (TP) level was assessed using a simple neutral digestion method [45].DNA extraction, PCR amplification and sequencingThe environmental DNA (eDNA) from the 0.45-µm pore size filter was extracted with a MagIso Environmental Samples DNA Kit (GBCBIO Technologies Inc., China) according to the manufacturer’s protocols. The eDNA was quantified with NanoDrop One (Thermo Scientific™, USA), then the V4 region of the 18 S rDNA gene was amplified using universal primers (R: GCTTGTCTCAAAGATTAAGCC; F: GCCTGCTGCCTTCCTTGGA) [46]. Sequencing was conducted on the Illumina HiSeq2500 platform of Majorbio Bio-pharm Technology Company (Shanghai, China). After obtaining the raw sequencing data, Btrim software was utilized to eliminate adapters and low-quality regions [47]. Next, merging of paired-end reads was performed using AdapterRemoval v2 [48]. To minimize the random sequencing error, the chimeric sequences [49], low quality reads, and barcode sequences were removed. Amplicon sequence variants (ASVs) were constructed from the amplicon data that was processed using the above-mentioned procedure [50]. Taxonomic assignment was conducted for the ASVs against an available SILVA database (SSU r138.1) [51]. The ASVs were first annotated as sequences of phylum in phytoplankton (such as Chlorophyta, Cryptophyceae, Diatomea, Streptophyta) and then filtered out into tables for the follow-up analysis.Statistical analysisThe longitude and latitude coordinates of the sampling sites were transformed to geographical distances using the R “geosphere” package [52]. The alpha diversity index of the samples was determined by calculating the Shannon, Simpson, and species richness indices using the R “vegan” package [53]. The Bray-Curtis similarity of the phytoplankton was computed with the “vegdist” function in the R “vegan” package [53]. The α-diversity and β-diversity indices of the four seasons were calculated and compared using the analysis of variance (ANOVA) method [54], with p < 0.05 considered as a significant difference. The correlations (spearman’s correlation) between the α-diversity index (or Bray-Curtis similarity) and the environmental elements (NH4 +, NO2−, NO3−, PO43−, TP, TOC, TN, Chl-a, DO, pH, TEMP, turbidity, sanility) or geographic distances were determined with the mantel test analysis using the R “reshape2” package [55]. We used the R “picante” package to apply the Bray-Curtis based Raup-Crick (RCBray) and β-nearest taxon indices (βNTI) to evaluate the prevalence of Stochastic or Deterministic assembly processes across the four seasons [56].The community assembly mechanisms consist of two primary categories: Determinism (Non-random fraction, |βNTI| > 2) and Stochasticity (Random fraction, |βNTI| < 2). The Determinism processes can further be divided into Heterogeneous selection (βNTI > 2) and Homogeneous selection (βNTI < -2) [57]. The Stochastic processes can be classified into Probabilistic Dispersal (|RCBray| > 0.95) (if RCBray < -0.95, the dominance of Homogenizing Dispersal in shaping the community composition; if RCBray > 0.95, community assembly was dominated by Dispersal Limitations) and Drift (|RCBray| < 0.95) [58, 59].ResultsAbundance and distribution of phytoplankton communitiesThe abundance of phytoplankton in Sanniang Bay and Dafeng River was analyzed and the results are displayed in Figure S1. In all four seasons, the predominant phytoplankton classes in Sanniang Bay (SNB) and Dafeng River (DFR) were Bacillariophyceae, Chlorodendrophyceae, Chlorophyceae, Mamiellophyceae, Mediophyceae, Prasinophytae, Trebouxiophyceae, and Ulvophyceae. However, the phytoplankton composition in Sanniang Bay and Dafeng River did vary significantly during the different seasons. In spring, the unidentified_Cryptophyceae and Mamiellophyceae were significantly more abundant in SNB, while there was a significantly higher abundance of Mediophyceae in DFR. In September, Mamiellophyceae, Trebouxiophyceae, and Mediophyceae were more abundant in SNB, and only one genus, Thalassiosira of Mediophyceae, was more abundant in DFR. In December, the Mediophyceae, unidentified_Streptophyta, and unidentified_Cryptophyceae were significantly more abundant in SNB, while only one genus, Cerataulina in Mediophyceae, was dominant in DFR.The alpha diversity indices and their relationship "
