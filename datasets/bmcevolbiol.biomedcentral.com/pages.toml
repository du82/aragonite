title = "Comparative analysis of chloroplast genomes in ten holly (Ilex) species: insights into phylogenetics and genome evolution | BMC Ecology and Evolution | Full Text"
description = "In order to clarify the chloroplast genomes and structural features of ten Ilex species and provide insights into the phylogeny and genome evolution of the genus Ilex, we conducted a comparative analysis of chloroplast genomes using bioinformatics methods. The chloroplast genomes of ten Ilex species were obtained, and their structural features and variations were compared. The results indicated that all chloroplast genomes in the genus Ilex exhibit a double-stranded circular structure, with sizes ranging from 157,356 to 158,018&nbsp;bp, showing minimal differences in size. The chloroplast genomes of the ten Ilex species have a relatively conservative gene count, with a total of 134 to 135 genes, including 88 or 89 protein-coding genes, and a conserved number of 8 rRNA genes. Each chloroplast genome contains 3 to 123 SSR (Simple Sequence Repeat) sites, predominantly composed of mononucleotide and trinucleotide repeats, with no detection of pentanucleotide or hexanucleotide repeats. The variation in dispersed repeat sequences among Ilex species is minimal, with a total repeat sequence number ranging from 1 to 14, concentrated in the length range of 30 to 42 base pairs. The expansion and contraction of chloroplast genome boundaries among Ilex species are relatively stable, with only minor variations observed in individual species. Variations in non-coding regions are more pronounced than those in coding regions, with the variability in the Large Single Copy region (LSC) being the highest, while the variability in the Inverted Repeat region A (IRa) is the lowest. The divergence time among Ilex species was estimated using the MCMC-tree module, revealing the evolutionary relationships among these species, their common ancestors, and their differentiation throughout the evolutionary process. The research findings provide a valuable reference for the systematic study and molecular marker development of Ilex plants."
full_description = "Research Open access Published: 31 October 2024 Comparative analysis of chloroplast genomes in ten holly (Ilex) species: insights into phylogenetics and genome evolution Hu Jiaxin1 na1, Yan Daoliang1 na1, Yuan Huwei1, Zhang Jianhong2 & …Zheng Bingsong1 Show authors BMC Ecology and Evolution volume 24, Article number: 133 (2024) Cite this article 620 Accesses 1 Citations 1 Altmetric Metrics details AbstractIn order to clarify the chloroplast genomes and structural features of ten Ilex species and provide insights into the phylogeny and genome evolution of the genus Ilex, we conducted a comparative analysis of chloroplast genomes using bioinformatics methods. The chloroplast genomes of ten Ilex species were obtained, and their structural features and variations were compared. The results indicated that all chloroplast genomes in the genus Ilex exhibit a double-stranded circular structure, with sizes ranging from 157,356 to 158,018 bp, showing minimal differences in size. The chloroplast genomes of the ten Ilex species have a relatively conservative gene count, with a total of 134 to 135 genes, including 88 or 89 protein-coding genes, and a conserved number of 8 rRNA genes. Each chloroplast genome contains 3 to 123 SSR (Simple Sequence Repeat) sites, predominantly composed of mononucleotide and trinucleotide repeats, with no detection of pentanucleotide or hexanucleotide repeats. The variation in dispersed repeat sequences among Ilex species is minimal, with a total repeat sequence number ranging from 1 to 14, concentrated in the length range of 30 to 42 base pairs. The expansion and contraction of chloroplast genome boundaries among Ilex species are relatively stable, with only minor variations observed in individual species. Variations in non-coding regions are more pronounced than those in coding regions, with the variability in the Large Single Copy region (LSC) being the highest, while the variability in the Inverted Repeat region A (IRa) is the lowest. The divergence time among Ilex species was estimated using the MCMC-tree module, revealing the evolutionary relationships among these species, their common ancestors, and their differentiation throughout the evolutionary process. The research findings provide a valuable reference for the systematic study and molecular marker development of Ilex plants. Peer Review reports IntroductionChloroplasts, as cellular organelles in plant cells, possess their own genome that encodes proteins related to photosynthesis, transport proteins, and ribosomal RNA [1]. Despite containing a substantial amount of genetic information, medium-sized chloroplast genomes can be easily sequenced, particularly with the rapid development of high-throughput sequencing technologies [2]. The chloroplast genome exhibits a highly conserved structure, characterized by a short overall sequence length that facilitates sequencing, a stable gene structure, a moderate evolutionary rate, and well-maintained collinearity among cp. genomes across different plant taxa. These features not only facilitate systematic studies at various levels but also confer advantages in comparative analyses [3], and there is good collinearity between chloroplast genomes of different plant groups. This makes chloroplast genomes not only useful for studies at different taxonomic levels but also advantageous in comparative analyses. Plant chloroplast genomes are widely used to analyze the phylogenetic relationships between species, study the origin and domestication, and investigate the structural features, variations, and evolution of plant genes [4]. Therefore, research on plant chloroplast genomes is a crucial aspect of plant genetics, significantly influences the development of phylogenomics.Plants of Ilex are distributed globally, comprising approximately 400 species [5], some of which have significant medicinal value. Several studies have identified compounds in Ilex, such as polysaccharides and Ilex pubescens triterpenoid saponins (IPTS) [6], exhibiting antioxidant [7], anti-inflammatory [8, 9], anti-tumor, and antimicrobial activities. As the largest genus of dioecious woody plants, Ilex is a good system for studying speciation, extinction and biogeography [10]. The classification and phylogenetic relationships of Ilex species have been a focus of taxonomic research, crucial for understanding evolutionary history, biodiversity conservation, and potential applications in medicine and horticulture. While past studies relied on morphological characteristics for classification, the development of molecular biology techniques has led to an increasing number of studies using molecular markers for phylogenetic analysis. By comparing the chloroplast genome sequences of ten Ilex species, we aim to understand their genome evolutionary history and relationships, revealing the phylogenetic connections among Ilex species. This knowledge contributes to a better understanding of species classification, evolutionary history, and aids in the establishment of an accurate classification system.Materials and methodsTest materialsThe 10 species of plants belonging to the genus Ilex are: Ilex bioritsensis、I.buergeri、I.cassine Tensaw、I. centrochinensis、I.chinensis、I.litseifolia、I.macrocarpa、I.pedunculosa、I.otunda and I. verticillata. Tissue samples from these species were collected for chloroplast genome sequencing at Zhejiang A&F University. Genomic DNA extraction was performed using the Tiangen kit (Tiangen, Beijing) for subsequent analysis.Genomic DNA extraction and sequencingFresh and healthy young leaves were collected, and total genomic DNA was extracted using the CTAB method [11]. After confirming the quality of the genomic DNA via agarose gel electrophoresis, a mechanical method (ultrasonication) was utilized to fragment the DNA. Subsequently, the fragmented DNA underwent purification, end repair, and sequencing adapter ligation, including 3′-end adenylation.Gel electrophoresis was performed to size-select DNA fragments, followed by PCR amplification to generate a sequencing library. Each library underwent initial quantification using Qubit 2.0, library dilution, and evaluation on an Agilent 2100 Bioanalyzer. After confirming the insert size met expectations, quantitative PCR (Q-PCR) was employed for accurate determination of library concentration. Following this, the Illumina Nova seq platform was used for paired-end sequencing with a read length of 150 bp [12]. The sequencing data have been deposited in the NCBI database under BioProject ID BankIt2810171. Individual sample accession numbers and additional sequencing details are provided in Table 1.Chloroplast genome annotation of ten species of Ilex Linn. PlantThe raw data were filtered using the fastp software to remove adapter sequences and low-quality reads, resulting in high-quality clean data. The filtered data were assembled into chloroplast genomes using SPAdes v3.10.1 software with k-mer parameters of 55, 87, and 121 [13]. The assembly was performed without relying on a reference genome. SPAdes was also used to assemble the cpDNA sequence into the chloroplast genome’s SEED sequence. SSPACE v2.0 software was employed to connect contig sequences into scaffolds, and Gapfiller v2.1.1 software was used to fill gaps [14].The sequencing reads were aligned to a pseudo genome for genome correction. Based on the chloroplast’s structure, the corrected pseudo genome underwent coordinate rearrangement to obtain the complete circular chloroplast genome sequence. The visualization of the chloroplast genome was achieved using the OGDRAW online tool.Chloroplast Genome Annotation of ten species of Ilex Linn. PlantTwo methods were employed to annotate the chloroplast genome for increased accuracy. Firstly, Prodigal v2.6.3 was used to annotate the chloroplast’s CDS, HMMER v3.1b2 software for rRNA prediction, and Aragorn v1.2.38 was applied for tRNA prediction. Secondly, gene sequences of closely related species available on NCBI were extracted and aligned to the assembled sequences using BLAST v2.6 (https://blast.ncbi.nlm.nih.gov/Blast.cgi)to obtain the second annotation result. The two annotation results were manually inspected for differing genes, and incorrect or redundant annotations were removed. This process determined the boundaries of multiple exons, resulting in the final annotation.Analysis of cpSSRs and scattered repeat sequencesSimple Sequence Repeats (SSR) markers, composed of a few nucleotides (usually 1 to 6) repeated several times, were analyzed as cpSSR markers on the chloroplast genome using MISA v1.0 (MIcroSAtellite identification tool, http://pgrc.ipk-gatersleben.de/misa/misa.html). Parameters used were 1–8 (single-base repeat of 8 times or more), 2–5, 3–3, 4 − 3, 5 − 3, and 6 − 3.Scattered repeat sequences, unlike tandem repeat sequences, are dispersed throughout the genome. vmatch v2.3.0 (http://www.vmatch.de/) software, along with Perl scripts, was used to identify repeat sequences, with parameters set to a minimum length = 30 bp and a Hamming distance = 3.Genome-wide comparative analysisThe MAFFT (--auto) software was employed for genome-wide comparisons. The IRscope online tool was used to delineate the boundaries of the inverted repeat regions in the chloroplast genomes of the aforementioned ten species. Gene positions on the boundaries were analyzed for contractions and expansions, and the boundary information was visualized using the SVG module in Perl.Relative synonymous codon usageDue to the degeneracy of codons, each amino acid corresponds to at least one codon, and at most six codons. There is a significant variation in codon usage across different species and organisms due to synonymous codons. This unevenness in the usage of synonymous codons is referred to as Relative Synonymous Codon Usage (RSCU) [15]. This preference is considered to be a comprehensive result of natural selection, species mutation, and genetic drift. Perl scripts were employed to calculate the RSCU for the chloroplast genomes of 10 Ilex species. RSCU is calculated as the ratio of the observed frequency to the average frequency of synonymous codons. RSCU values can be categorized into three types: greater than 1, less than 1, and equal to 1. The value greater than 1 indicates a higher frequency of usage for that codon compared to others, while the value less than 1 suggests a higher frequency for synonymous codons other than the specified one. If the RSCU value is equal to 1, it implies no bias in the usage of that codon. Generally, the origin of codon preference is attributed to the uneven abundance of tRNA corresponding to different codons in the cell, with higher tRNA abundance leading to a higher usage frequency of the corresponding codon.Phylogenetic analysis and divergence time estimationTo elucidate the intergeneric relationships and phylogenetic positions of 10 Ilex species, we conducted sequencing and utilized the complete chloroplast genomes of 13 Ilex species available on NCBI to construct a comprehensive evolutionary tree. Anacardium occidentale and Maytenus guangxiensis (Celastraceae) were chosen as outgroups, and the circular sequences were aligned using the MAFFT software in auto mode. The aligned data were trimmed using trimAl (v1.4.rev15), and the maximum likelihood evolutionary tree was constructed using RAxML (v8.2.10) with the GTRGAMMA model, rapid bootstrap analysis (bootstrap = 1000). Additionally, the MCMCtree module in PAML (v4.9) was used to estimate the divergence times among species based on this tree.ResultsChloroplast Genome features of 10 Ilex SpeciesThe chloroplast genomes of the 10 Ilex species all exhibit a double-stranded circular structure, consisting of four parts: a large single-copy region (LSC), a small single-copy region (SSC), and a pair of inverted repeat regions (IRs). The size of the chloroplast genomes ranges from 157,356 to 158,018 bp, (Table 2) with I. pedunculosa being the largest and I. centrochinensis being the smallest, differing by 662 bp. The length of the large single-copy region ranged from 86,730 (I. centrochinensis) ~ 87,400 bp (I. pedunculosa), the length of the small single-copy region was between 18,382 (I. litseifolia) ~ 18,459 bp (I. cassine Tensaw ), and the length of the single reverse repeat region was between 26,063 (I. macrocarpa) ~ 26,125 bp (I. rotunda), The lengths of the LSC, SSC, and IR regions show slight variations among the species. The GC content of the chloroplast genomes is around 38.34–38.37%, with similar GC content in the LSC, SSC, and IR regions. While there are differences in the size and GC content of the chloroplast genomes among Ilex species, these differences are not pronounced.Table 3 reveals variations in the length of chloroplast genomes, the number of genes, and the number of protein-coding genes among the 10 Ilex species. The total number of genes, except for I. centrochinensis, is 134, with I. centrochinensis having 135 genes. The protein-coding genes are either 88 or 89, with I. verticillata having 88 and the rest having 89. The rRNA genes are consistently 8 in all species, while the tRNA genes range from 37 to 38, with I. centrochinensis having 38 and the others having 37.The chloroplast genes of the 10 Ilex species can be categorized into four classes based on their functions: genes related to photosynthesis (45), genes related to self-replication (59), other genes (6), and genes with unknown functions (5). See Table 4 for detailed classification.Table 1 Presents the project numbers and some sequencing detailsFull size tableTable 2 Comparison of chloroplast genomes of 10 llex speciesFull size tableTable 3 Statistical table of chloroplast gene function classificationFull size tableSSR and scattered repeat sequence analysisTable 3 indicates the presence of SSR sites in the chloroplast genomes of the 10 Ilex species, predominantly consisting of single-nucleotide repeats and tri-nucleotide repeats, with no detected penta-nucleotide and hexa-nucleotide repeats. The number of detected mononucleotide repeats ranges from 118 to 128, with I. cassine having the highest and I. rotunda having the lowest. The differences in the overall quantities of di-, tri-, and tetra-nucleotide repeats are relatively small. Analyzing nucleotide types, mononucleotide repeats are the most abundant, with A and T repeat types being predominant. This result indicates that the types and quantities of simple repeat sequences in Ilex species are relatively conservative. Additionally, these sites are unevenly distributed in the chloroplast genome, but the differences among the 10 Ilex species are not significant.Use of the vmatch v2.3.0 software (http://www.vmatch.de/) combined with Perl scripts was employed to analyze and identify scattered repeat sequences in the chloroplast genomes of ten species of Ilex (holly) plants. The analysis revealed that both forward and reverse repeats were detected. Palindromic repeats were only ide"
