title = "The oldest continuous association between astigmatid mites and termites preserved in Cretaceous amber reveals the evolutionary significance of phoresy | BMC Ecology and Evolution | Full Text"
description = "Background Among minute-sized and wingless arthropods, astigmatid mites stand out for their diverse range of symbiotic associations (parasitic, neutral and mutualistic), with both invertebrate and vertebrate hosts. When inhabiting discontinuous and ephemeral environments, astigmatid mites adapt their life cycle to produce a phoretic heteromorphic nymph. When feeding resources are depleted, phoretic nymphs disperse to new habitats through phoresy, attaching to a larger animal which transports them to new locations. This dispersal strategy is crucial for accessing patchy resources, otherwise beyond the reach of these minute arthropods. In Astigmata, the phoretic nymph is highly specialized for dispersal, equipped with an attachment organ and lacking a mouth and pharynx. Despite the common occurrence of phoretic associations in modern mites, their evolutionary origins remain poorly understood. Among Astigmata, the family Schizoglyphidae represents an early derivative lineage with phoretic tritonymphs; however, our knowledge of this family is limited to a single observation. Results Here, we report the oldest biotic association of arthropods fossilised in amber (~ 130 Ma, Lebanon): an alate termite with 16 phoretic tritonymphs of Schizoglyphidae (Plesioglyphus lebanotermi gen. et sp. n.). The mites are primarily attached to the membranes of the host’s hindwings, using their attachment organs, pretarsal claws and tarsal setae. Additionally, we report new modern phoretic tritonymphs of this same family, on one of the earliest lineages of termites. These data collectively indicate that schizoglyphid-termite associations represent the oldest continuous mite-host associations. Notably, phoretic schizoglyphids retain a distinct mouth and pharynx, whereas these structures are absent in the modern phoretic stages of non-schizoglyphid Astigmata. Conclusion The discovery of Schizoglyphidae mites in Lebanese amber represents the oldest known continuous association between acariform mites and their hosts. This finding demonstrates the long-term evolutionary significance of phoresy in Astigmata, evidencing a relationship sustained for over 130 Ma. It indicates that these early mites lived inside termite nests as inquilines and used alate termites for dispersal. This ancient association offers key insights into the coevolution of both mites and termites, highlighting a potential for the future discoveries of similar mites. This fossil —a stem-group Astigmata— is important for the accurate calibration of acariform mite phylogenies, advancing our understanding of these mites evolutionary history."
full_description = "Research Open access Published: 25 February 2025 The oldest continuous association between astigmatid mites and termites preserved in Cretaceous amber reveals the evolutionary significance of phoresy Hemen Sendi1, Pavel B. Klimov2, Vasiliy B. Kolesnikov3,4, Júlia Káčerová5, Enrico Bonino6, Dany Azar7,8 & …Ninon Robin9,10 Show authors BMC Ecology and Evolution volume 25, Article number: 16 (2025) Cite this article 281 Accesses 12 Altmetric Metrics details AbstractBackgroundAmong minute-sized and wingless arthropods, astigmatid mites stand out for their diverse range of symbiotic associations (parasitic, neutral and mutualistic), with both invertebrate and vertebrate hosts. When inhabiting discontinuous and ephemeral environments, astigmatid mites adapt their life cycle to produce a phoretic heteromorphic nymph. When feeding resources are depleted, phoretic nymphs disperse to new habitats through phoresy, attaching to a larger animal which transports them to new locations. This dispersal strategy is crucial for accessing patchy resources, otherwise beyond the reach of these minute arthropods. In Astigmata, the phoretic nymph is highly specialized for dispersal, equipped with an attachment organ and lacking a mouth and pharynx. Despite the common occurrence of phoretic associations in modern mites, their evolutionary origins remain poorly understood. Among Astigmata, the family Schizoglyphidae represents an early derivative lineage with phoretic tritonymphs; however, our knowledge of this family is limited to a single observation.ResultsHere, we report the oldest biotic association of arthropods fossilised in amber (~ 130 Ma, Lebanon): an alate termite with 16 phoretic tritonymphs of Schizoglyphidae (Plesioglyphus lebanotermi gen. et sp. n.). The mites are primarily attached to the membranes of the host’s hindwings, using their attachment organs, pretarsal claws and tarsal setae. Additionally, we report new modern phoretic tritonymphs of this same family, on one of the earliest lineages of termites. These data collectively indicate that schizoglyphid-termite associations represent the oldest continuous mite-host associations. Notably, phoretic schizoglyphids retain a distinct mouth and pharynx, whereas these structures are absent in the modern phoretic stages of non-schizoglyphid Astigmata.ConclusionThe discovery of Schizoglyphidae mites in Lebanese amber represents the oldest known continuous association between acariform mites and their hosts. This finding demonstrates the long-term evolutionary significance of phoresy in Astigmata, evidencing a relationship sustained for over 130 Ma. It indicates that these early mites lived inside termite nests as inquilines and used alate termites for dispersal. This ancient association offers key insights into the coevolution of both mites and termites, highlighting a potential for the future discoveries of similar mites. This fossil —a stem-group Astigmata— is important for the accurate calibration of acariform mite phylogenies, advancing our understanding of these mites evolutionary history. Peer Review reports BackgroundPhoresy is a symbiotic interaction in which one life stage of a smaller animal attaches to a larger animal to facilitate dispersal [1–2] and access a more favourable habitat [3]. While reflecting primarily commensalism [4], phoresy can be defined together with other types of symbiotic interactions like mutualism [5], parasitism [6], or parastioidism [1, 7] as part of the lifestyle of the phoretic organism. For relatively small and/or wingless arthropods (springtails, pseudoscorpions and mites), phoresy is a key strategy to provide access to distant and patchy resources beyond their normal reach [8–9]. Phoretic organisms exhibit host-seeking behaviours and various adaptations for attachment; they typically do not feed, nor reproduce, during transport on their hosts [1].Mites (Acari), with around 55,000 described species, are among the most diverse arthropods, representing a clade of substantial medical and economical importance. They exhibit a range of ecological lifestyles, including free-living, parasitism, active predation, and saprophagy, particularly in soil-dwelling mites [10,11,12]. Modern mites, although they may not form a monophyletic group, include two monophyletic superorders: Acariformes (32,000 species) and Parasitiformes (23,000 species) [13]. Phoresy has evolved and disappeared multiple times throughout mite evolution [1]. Among the Acariformes, phoresy is common in Heterostigmata (2,700 species) and Astigmata (6,300 species) [1]. In Heterostigmata, females are typically the dispersal stage, whereas in most free-living Astigmata, the heteromorphic nymph—formerly known as the ‘hypopus’—serves as the dispersal stage [14–15]. In the enigmatic astigmatid family Schizoglyphidae, the dispersal stage is likely a tritonymph [16], which morphologically resembles the heteromorphic deutonymph. Astigmatid heteromorphic nymphs possess a highly specialized attachment organ, featuring various suckers and adhesive conoids adapted to different attachment sites, such as smooth insect cuticle, setae, or mammal hair [15]. Astigmata have a shorter life cycle compared to their ancestors, oribatid mites. While oribatid mites inhabit soil—an uninterrupted habitat—Astigmata prefer discontinuous and ephemeral environments, such as decomposing plant and fungal materials, stored products, phytotelmata, dung, actively growing mycelia, subcortical spaces, tree sap flows, and invertebrate and vertebrate nests. This habitat preference makes long-distance dispersal a crucial component of their life cycle, and Astigmata establish phoretic associations with larger organisms, such as mammals, insects, and myriapods [14]. Astigmatid phoretic nymphs often travel in groups to enhance sexual reproduction at their destination and increase their chances of establishing a large population on new resources, thereby outcompeting other colonizers [1]. Unlike other life stages (larvae, non-phoretic nymphs, and adults), phoretic nymphs are typically non-feeding, although there are occasional exceptions [6]. Adults are the sole reproductive stage. A few free-living Astigmata are capable of dispersing as adults [1, 14].Phoresy is likely the ancestral lifestyle of Astigmata, but it has been lost in (i) astigmatids inhabiting continuous habitats (such as soil or water), (ii) associated with non-nest-building insects; or (iii) nearly all vertebrates with overlapping generations, which enables maternal vertical transmission [1, 14]. Astigmata have experienced three major evolutionary events: (1) the ancestral oribatid life cycle (lacking a phoretic deutonymph) evolved to a life cycle with a specialized phoretic deutonymph (non-schizoglyphid Astigmata) or tritonymph (schizoglyphid Astigmata); (2) the deutonymphal lifecycle was then modified to permanently suppress the deutonymphal stage in several lineages, notably in Psoroptidia, a lineage of full-time (permanent) associates of birds and mammals, as these mites could effectively colonize new hosts via vertical transmission and other direct host-to-host contacts; (3) Pyroglyphidae, a lineage within Psoroptidia, transitioned to living in the nests of their hosts, thereby becoming secondarily free-living and using their former hosts for transport without forming phoretic heteromorphic nymphs [1, 17,18,19].The family Schizoglyphidae is the sister group to the remaining extant Astigmata [1]. This family is distinctive for retaining several plesiomorphic traits, including the relative position of the genital opening and attachment organ, as well as the structure of the attachment organ and gnathosoma compared to other astigmatid families [20]. This monotypic family includes a single observation of two specimens of the extant Schizoglyphus biroi Mahunka, 1978, found in New Guinea (Indonesia) on a tenebrionid beetle. Although this species exhibits the specific morphological adaptations characteristic of a phoretic heteromorphic deutonymph, it is probably a tritonymph [16]. Evidence for this includes the presence of three pairs of genital papillae (as seen in oribatid tritonymphs and adults) instead of the two pairs found in deutonymphs and adults of other Astigmata. Despite substantial efforts to find this mite again on tenebrionid beetles, it has not been re-collected, suggesting that the original phoretic host (the beetle) may represent an incidental record rather than a true biologically relevant association. Thus, the true association of Schizoglyphus biroi and the family it represents remains elusive.Acariformes is one of the earliest diverging groups within the arachnids, with fossil evidence dating back to the early Devonian [21]. However, symbiotic associations with other organisms are mostly documented from the Cretaceous, when amber preserved these interactions in situ [14, 22–23]. Crown-group Astigmata are estimated to have diverged between the Late Permian and the Early Triassic, while the stem-group likely originated in the Late Devonian to Carboniferous [13–14, 17, 22–23]. In the fossil record, Astigmata appears from the Cretaceous onward, becoming more abundant in the Cenozoic, with several instances of biotic associations [24,25,26,27,28,29,30,31,32].Here, we report the oldest amber association of an phoretic arthropod associated with its host preserved in Lebanese amber (Early Barremian, ~ 130 Ma): 16 mite tritonymphs belonging to the family Schizoglyphidae, phoretic on an alate termite Lebanotermes veltzae Engel, Azar et Nel, 2011 (Figs. 1; and 2). To confirm this association and explore potential true hosts of Schizoglyphus biroi, we also examined nests of modern termites in New Zealand and found schizoglyphids associated with Stolotermes, one of the earliest diverging termite lineages. The combined fossil and modern evidence suggests that schizoglyphid-termite associations represent the oldest known ongoing relationship between mites and their hosts. These findings shed light on the range of plesiomorphic features (including the gnathosoma and the attachment organ), present in the earliest crown-group Astigmata and reveal a highly conserved phoretic morphology that has persisted since the Early Cretaceous. This also advances our understanding of the temporal framework for the diverse mite-arthropod ecological associations observed today.MethodsWe studied 16 mite specimens attached to the fossil holotype of the termite Lebanotermes veltzae described in Engel et al. [33]. The termite host was preserved in a single amber piece (341 C–T) from the Lower Barremian of Mdeyrij-Hammana, Caza (District) Baabda, Lebanon, coll. D. Azar. The amber piece is housed at the Natural History Museum of the Lebanese University, Faculty of Sciences II, Fanar. Other syninclusions derived originally from the same amber block include: the allotype of the chironomid dipteran Ziadeus kamili (341 B), an aleyrodid hemipteran (341 A), and a ceratopogonid dipteran. The amber piece was trimmed and polished for microscopy, embedded in Canada balsam and placed in a cube of 1 mm thick microscopic glass slides. This permanent glass-amber preparation makes computed tomography not feasible for resolutions targeting the 150 μm-long mites.Several microphotographs (Figs. 1A, C; 2A–D, F; and 4A–C) were acquired using the protocol described on this website (https://enrico-bonino.eu): a Sony a7R II mirrorless camera with a 208 mm tube lens, a Raynox DCR-150, microscope objectives Mitutoyo QV 2.5× (or APO 20x), and a 110 mm tube lens with inversed Schneider Componon-S 50 mm/f2.8 lens for the whole specimen. This system (camera, tube-lens, and optics) is mounted on a MJKZZ Ultra Rail MINI V2, allowing movements in both vertical and horizontal planes. The illumination was provided by a cylindrical OGGLAB LED system DB 120EB. The entire panoramic image was assembled from two overlapping stacks, each composed of 53 frames. Images were captured in 16-bit RAW format with several steps between frames: 15 μm (with the Mitutoyo QV 2.5x), 2 μm (with the Mitutoyo 20x), and 95 μm (with Schneider-Componon lens). The frames were sub-stacked per group of eight images, stacked secondarily together and retouched in Helicon Focus (v.8.2, Professional) to remove undesired features (e.g. bubbles, dust, surfaces not in focus). Final image post-processing was done with Adobe Photoshop and Topaz DeNoise software. We also used a Zeiss Axiocam 208 mounted on an Axioimager A2 microscope, equipped with EC Epiplan 20x/0.4, 50x/0.55, and a W N-Achroplan 63 × 0.9 (water immersion) both in reflection and transmission light mode.Multispectral microimaging was performed at a research platform IPANEMA (SOLEIL Synchrotron, Orsay, France, microscope magnification x20). Reflection and luminescence images emitted by the sample were collected in various spectral ranges using a setting coupling (1) an illumination device employing 16 different LED lights (from 365 up to 700 nm wavelength, CoolLED pE-4000) and (2) a light filter device placed in front of the camera detector (a wheel holding six interference band-pass filters collecting signal within in six spectral ranges from 435 to 935 nm). Out of the 96 produced illumination/detection couples, a selection of three couples enhancing morphological features of interest were combined into pseudo-colored RGB. The stacking, alignment, image registration of the different couples, and production of pseudo-colored RGB composites were performed using ImageJ. Pseudo-colored RGB images were produced with red—illumination 435 nm/detection 650 ± 60 nm (luminescence), green—470 nm/det. 650 ± 60 nm, blue—470 nm/det. 732 ± 68 nm.Fig. 1Overview of the termite Lebanotermes veltzae Engel, Azar et Nel, 2011 from Barremian Lebanese amber with localization of phoretic schizoglyphid mites. (A) Dorsal view of the termite with four highlighted areas indicating the occurrence of the mite Plesioglyphus lebanotermi gen. et sp. n. (B) Mite localization map. Mites are positioned as follows: 1, 4, 5, 8, 12, 15 ventral; 10, 11, 16 dorsal; 2, 6, 7, 9, 13, 14 dorsolateral; 3 frontal. (C) Ventral view of termite with highlighted occurrence of a mite on the host foreleg. Boxes refer to detailed photographs in Fig. 2. Scale bars: 5 mmFull size imageFig. 2Attachment of the schizoglyphid mite Plesioglyphus lebanotermi gen. et sp. n. on the termite from Lebanese amber, Barremian. (A) Specimens 1 and 2 detached ventrolaterally from the termite host. (B) Specimen 3 is attached to the forefemur of the termite host. (C) Specimen 4 is attached between the hindwings of the host. (D) Specimens 9–15 are attached between the termite hindwings above the dorsal abdominal area. (E) Specimens 5–8 are attached between the termite hindwings above the dorsal abdominal area. (F) Detail of attachment of specimen 16 on the wing membrane of its host. (G) – +/- schematics of the CuA area of an extant termite hindwing adapted"
