title = "Osteology and functional morphology of a transitional pterosaur Dearc sgiathanach from the Middle Jurassic (Bathonian) of Scotland | BMC Ecology and Evolution | Full Text"
description = "Pterosaurs were the first vertebrates to evolve active flight. The lack of many well-preserved pterosaur fossils limits our understanding of the functional anatomy and behavior of these flight pioneers, particularly from their early history (Triassic to Middle Jurassic). Here we describe in detail the osteology of an exceptionally preserved Middle Jurassic pterosaur, the holotype of Dearc sgiathanach from the Isle of Skye, Scotland. We identify new autapomorphies of the flight apparatus (humerus and sternum), which further support the distinctiveness of Dearc compared with other early-diverging pterosaurs and describe features, such as the vertebral morphology, shared with later-diverging pterosaurs that probably developed convergently to support a large body size or as a sign of modular evolution. We used extant phylogenetic bracketing to infer the principal cranial and antebrachial musculature, indicating that Dearc had large and anteriorly placed palatal musculature that compensated for weak temporal jaw adductors and wing musculature suggestive of flight style reliant on powerful adduction and protraction of the humerus. Comparisons with other pterosaurs revealed that non-pterodactyloids such as Dearc, despite their overall conservative bauplans, adapted various flight and feeding styles. The osteology and myology of Dearc are indicative of a large predator that flew and hunted above lagoons and nearshore environments of the Middle Jurassic."
full_description = "Research Open access Published: 24 January 2025 Osteology and functional morphology of a transitional pterosaur Dearc sgiathanach from the Middle Jurassic (Bathonian) of Scotland Natalia Jagielska1,2, Michael O’Sullivan3, Ian B. Butler1, Thomas J. Challands1, Gregory F. Funston4, Dugald Ross5, Amelia Penny1 & …Stephen L. Brusatte1 Show authors BMC Ecology and Evolution volume 25, Article number: 9 (2025) Cite this article 1652 Accesses 181 Altmetric Metrics details AbstractPterosaurs were the first vertebrates to evolve active flight. The lack of many well-preserved pterosaur fossils limits our understanding of the functional anatomy and behavior of these flight pioneers, particularly from their early history (Triassic to Middle Jurassic). Here we describe in detail the osteology of an exceptionally preserved Middle Jurassic pterosaur, the holotype of Dearc sgiathanach from the Isle of Skye, Scotland. We identify new autapomorphies of the flight apparatus (humerus and sternum), which further support the distinctiveness of Dearc compared with other early-diverging pterosaurs and describe features, such as the vertebral morphology, shared with later-diverging pterosaurs that probably developed convergently to support a large body size or as a sign of modular evolution. We used extant phylogenetic bracketing to infer the principal cranial and antebrachial musculature, indicating that Dearc had large and anteriorly placed palatal musculature that compensated for weak temporal jaw adductors and wing musculature suggestive of flight style reliant on powerful adduction and protraction of the humerus. Comparisons with other pterosaurs revealed that non-pterodactyloids such as Dearc, despite their overall conservative bauplans, adapted various flight and feeding styles. The osteology and myology of Dearc are indicative of a large predator that flew and hunted above lagoons and nearshore environments of the Middle Jurassic. Peer Review reports IntroductionThe functional anatomy of pterosaurs, volant reptiles from the Mesozoic and the first vertebrates to evolve powered flight, remains poorly understood. This is largely due to a lack of extant animals to act as analogous proxies and a limited number of well-preserved, articulated, three-dimensional fossils permitting functional analysis, such as the mapping of muscle attachments. Exceptionally preserved specimens such as the holotype of Dearc sgiathanach (NMS G.2021.6.1—4) from the Middle Jurassic of the Isle of Skye, Scotland, provide a trove of information in this regard. The specimen was named and briefly described in Jagielska et al. [1], which focused on providing a diagnosis of the species and an estimation of its wingspan and growth stage. Here, we build upon the initial description and describe the osteology of the Dearc holotype in detail and then use extant phylogenetic bracketing to infer its cranial and antebrachial musculature. This allows us to make comparisons with other pterosaurs and explore the diversity of feeding and flight behaviors in the early-diverging pterosaurs of the Triassic to Late Jurassic.The holotype specimen of Dearc sgiathanach (NMS G.2021.6.1—4) is a well-preserved, articulated skeleton excavated from a bioclastic limestone deposited in a nearshore margin-marine environment [1]. The skeleton originates from the Upper Lonfearn Member of the Lealt Shale Formation, which is part of the Great Estuarine Group. The discovery was made at a site referred to as Brothers’ Point 3 (BP3) in the literature [2] (57.5863°N, 6.1494°W). The animal represents one of the largest Jurassic pterosaurs known from a well-preserved specimen, with a substantial estimated wingspan (> 2.5 m) [1], despite osteological immaturity. A phylogenetic analysis (performed in Jagielska et al. 2022 [1]) nested NMS G.2021.6 within the array of non-monofenestratans commonly called Rhamphorhynchinae, where it falls into a smaller clade of Angustinaripterini [1, 3]. Angustinaripterini are sizeable non-pterodactyloid pterosaurs with low, elongate skulls. Its position within the clade was supported by shared cranial similarities with the Middle Jurassic Chinese Angustinaripterus longicephalus [4] and younger Sericipterus wucaiwanensis [3]. Since the initial description of Dearc [1], new specimens have been discovered challenging the initial phylogenetic placement, emphasizing the importance of the Scottish genus. A study by Hone et al. [5] has shown that Dearc fits into the pterodactyloid modular evolutionary continuum, aided by discovery of the first sizeable European darwinopteran Skiphosoura bavarica (LF 4157). Phylogenetic revision including Skiphosoura recovered Dearc closer to monofenestratans and branching after the Rhamphorhynchini. Hone et al. [5] recovered Dearc in the clade “Pterodactylomorpha” on account of antorbital shape, total cervical length and the cranial elongation. In this study we will continue to refer to Dearc as member of clade Angustinaripterini, retaining its initial phylogenetic placement [1].The Scottish pterosaur record expanded since the discovery of Dearc sgiathanach, with the description of a new darwinopteran, Ceoptera evansae [6], from the overlying Kilmaluag Formation of Skye. More non-pterodactyloid pterosaur material was also excavated from the Lealt Shale Formation, of specimen suggesting size even larger than the Dearc holotype [7]. These advancements prompt renewed attention of the anatomy, paleobiology, and evolutionary relationships of Dearc.Materials & methodsμCT scanThe skull and anterior cervical vertebrae (NMS G.2021.6.2) were separated from the main skeletal block during preparation and subjected to high-resolution X-ray microtomography in a custom-built X-ray μCT scanner at the School of GeoSciences, University of Edinburgh, by IB (elaborated on in [1]). The resulting slices were segmented manually in Mimics (Materialize N.V. 2014). The data show good contrast in regions where the ratio of matrix to bone is low (rostrum), however, the contrast is reduced in the posterior part of the skull (jugal, postorbital, squamosal) where manual segmentation proved to be challenging. Although the posterior skull has reduced contrast, the internal spaces of the brain and ear region are well defined, thus enabling segmentation of brain and endosseous ear labyrinth endocasts and other vacuities. The endocast features were mapped following inferences made by Witmer et al. [8].PhotographyNMS G.2021.6 was photographed by GF using a Nikon D850 camera with Nikkor 14—24 mm and MicroNikkor 60 mm lenses. The images were created via the automated focus-stacking mode of the Nikon D850 to create enhanced-focus images in HeliconFocus v 7.5.5 of dentition and ungual bones.Extant phylogenetic bracketThe musculature placement for the crania and antebrachium in this study was inferred on the basis of the Extant Phylogenetic Bracket (EPB) [9], which encompasses extant ( [10,11,12,13] among others) and extinct (i.e., for cranium [14, 15] and antebrachium [16, 17]) Archosauriforms. The osteological correlates refer to texture changes, ridges, depressions, and other topographic landmarks present on the bone.Ungual curvatureThe measurements of ungual curvature were aided by the program DinoLino developed by Cobb & Sellers [18] for measuring inner (ventral) and outer (dorsal) ungual curvatures on the two-dimensional plane. The inner curvature is measured between the base of the flexor tubercle and the tip of the ungual bone, with an intersection of the bisector of the curved surface. This is on the basis of Feduccia’s modified method [19]. Pike and Maitland’s method [20] was used to quantify the outer ungual curvature, starting from the proximal termination of the dorsal ungual bone stretching to the ungual tip and with the bisector between the two points. The values for Dearc were compared to those for species and behavioral groups of extant animals (as in Cobb & Sellers [18]).ResultsSystematic paleontologyPterosauria Owen, 1842 [21]Breviquartossa Unwin, 2003 [22]Angustinaripterini He, 1983 [4]Type speciesDearc sgiathanach Jagielska et al. 2022 [1]Type materialNMS G.2021.6.1—4 (Fig. 1) is an associated skeleton preserved in three dimensions, with NMS G.2021.6.1 referring to the postcranial material (Fig. 1A), NMS G.2021.6.2 to the skull (Fig. 1B), NMS G.2021.6.3 to the postcranial counterslab (Fig. 1C) and NMS G.2021.6.4 to a singular phalange (Fig. 1D). The skeleton is encased in a hard limestone, and many elements are visible in limited views. The skeleton is almost entirely in articulation, including the skull (which retains delicate palatal, ceratobranchial and neurocranial elements), a complete cervical vertebral series, well-preserved elements of paired forelimbs with a complete right manus and partially preserved wing phalanges, a disarticulated dorsal vertebral series and ribcage, and a poorly preserved sacral, pelvic, tail and hindlimb region.Fig. 1A photograph and corresponding illustration of NMS G.2021.6. A a photograph of NMS G.2021.6.1 or “the main slab” showcasing the postcranial material in the dorsal view, presented in white in the illustration; B a photograph of NMS G.2021.6.2, a three-dimensional skull with the anterior-most cervical vertebra, highlighted in blue in the illustration; C a photograph of NMS G.2021.6.3 or “the counterslab” of the postcranial material in ventral orientation, highlighted in orange in the illustration; D a photograph of NMS G.2021.6.4 showcasing a singular third wing phalange in the lateral view, highlighted in green in the illustration. Scale bar 30 mmFull size imageRevised diagnosisThe clade-wide”Angustinaripterini” traits shared between Angustinaripterus longicephalus [4], Sericipterus wucaiwanensis [3] and Dearc sgiathanach [1] were noted in Jagielska et al. 2022 [1] and include a low and elongate skull (height‒length ratio < 0.2); large antorbital fenestra (20‒35% skull length and > 80% orbit dorsoventral height); lacrimal process of the jugal nearly perpendicularly inclined (90°–110°) to the jugal body; strongly inclined quadrate (130°–140° relative to the maxillary long axis); cervical vertebrae with considerable changes in the length‒to-width ratio across the neck (1.8 to 1.2, from anterior to posterior); and humeral diaphysis slender with a muscle scar tubercle. The species-specific autapomorphies include tritubular vomers with “trident-shaped” precapillary contact, a pre-choana depression on the palatal surface of the maxilla, enlarged optic lobes expanded anteroposteriorly, and the fourth metatarsal being more robust (diameter 2.5 ×) than the metatarsals one to three. Through our detailed look at the anatomy and osteology we can add two new autapomorphies, such as the deltopectoral crest being proximally expansive and taller than the ulnar crest, and the sternum bearing exhibiting an anteriorly deflected frontal margin. In the phylogenetic assessment by Hone et al. [5] Sericipterus wucaiwanensis shifted to Rhamphorhynchini, while Angustinaripterus longicephalus and Dearc sgiathanach were relegated an “unknown clade” encompassing Monofenestrata. Due to humeral and cervical characters shared by Dearc and Sericipterus, in this paper, we will continue referral to the Angustinaripterini clade.CraniumThe skull (present on a separated slab, NMS G.2021.6.2 (Fig. 1B)) is well preserved and not severely deformed (Fig. 2A-C). It is largely complete, missing only the anterior dorsal surface, which was worn away by tidal exposure. The dorsal and lateral orbital areas, along with the ventral mandible articulation, were prepared and can be readily assessed visually.Fig. 2Photographs and illustrations of the skull and associated elements (NMS G.2021.6.2). A NMS G.2021.6.2 as seen in the dorsal view; B right lateral view; C left lateral view. Scale bar 20 mmFull size imageThe skull is 222 mm long anteroposteriorly [1], as measured on the basis of the fully preserved lower jaw, from its anterior tip to the termination of the posterior-most extension of the parietal bones of the cranium. This would rank it among the longest non-pterodactyloid skulls on record, being comparable with the nearly equally sizeable Angustinaripterus longicephalus (est. 209 mm) [4]; Dimorphodon NHM PV OR 41212 (220 mm) [23] and the largest recorded Rhamphorhynchus NHM PV OR 37002 (195 mm) along with estimated lengths derived from partial material (Harpactognathus (280–300 mm) [24] and Sericipterus (210 mm) [3]. The skull is 35 mm tall dorsoventrally at its maximum, and although this would be a slight underestimate of genuine depth owing to the loss of part of the dorsal surface of the skull, it is clear that the skull has a low and elongated profile. Proportionally, the skull length is close to the length of the preserved dorsal vertebra (235 mm). The low skull profile is also comparable to that of Angustinaripterus, suggesting a clade-wide trait. The skull width varies from 60 mm posteriorly to 50 mm medially and 10 mm anteriorly, forming a triangular shape in dorsal view.The maxilla of NMS G.2021.6.2 is straight and has a constant dorsoventral depth of 15 mm. It has a total preserved anteroposterior length of approximately 55 mm, with three alveolar spaces. The antorbital fenestra can be delineated from its ventral margin, measuring approximately 50 mm proximodistally. The fenestra’s ventral margins are elongate and flat, running parallel to across the skull. It is distally bordered by the lacrimal process of the jugal. It bears similarities in alveolar spacing and morphology to a specimen classified as Rhamphorhynchidae indet. (OUMNH J.28409) from the Taynton Limestone Formation [25], suggesting a wider geospatial distribution of Jurassic pterosaurs with this type of snout morphology.The most visibly exposed regions of the skull are the lateral surfaces of the left and right jugals. The jugal is approximately 70 mm long, with 35 mm tall antorbital and 40 mm tall postorbital sections. There is a round depression on the right side of the skull around the jugal–maxilla intersection (Fig. 2B), which is either a taphonomic artifact or a shallow healing bite mark. The jugal postorbital process bows posteriorly from the body and the long axis of the jugal. The lacrimal process is angled approximately 120° laterally to the jugal body, reclining in the opposite direction to the quadrate. The jugal lacrimal process on both sides has a deep recession that has been infilled with matrix, leading to the illusion of a fenestra (Fig. 2B).The jugal in Dearc differs from that of other three-dimensionally preserved pterosaurs, such as Cacibupteryx (IGO-V 208). In Cacibupteryx, the jugal ventral to the orbit is reduced to a thin bar [26], and the body of the jugal does not lie in line with the maxilla, as in Dearc. This also applies to Rhamphorhynchus, where the maxilla and the body of the jugal do not lie in the horizontal continuum; instead, the jugal deflects ventrally"
