title = "Repeated evolution on oceanic islands: comparative genomics reveals species-specific processes in birds | BMC Ecology and Evolution | Full Text"
description = "Understanding the interplay between genetic drift, natural selection, gene flow, and demographic history in driving phenotypic and genomic differentiation of insular populations can help us gain insight into the speciation process. Comparing patterns across different insular taxa subjected to similar selective pressures upon colonizing oceanic islands provides the opportunity to study repeated evolution and identify shared patterns in their genomic landscapes of differentiation. We selected four species of passerine birds (Common Chaffinch Fringilla coelebs/canariensis, Red-billed Chough Pyrrhocorax pyrrhocorax,&nbsp;House Finch&nbsp; Haemorhous mexicanus and Dark-eyed/island Junco Junco hyemalis/insularis) that have both mainland and insular populations. Changes in body size between island and mainland populations were consistent with the island rule. For each species, we sequenced whole genomes from mainland and insular individuals to infer their demographic history, characterize their genomic differentiation, and identify the factors shaping them. We estimated the relative (Fst) and absolute (dxy) differentiation, nucleotide diversity (π), Tajima’s D, gene density and recombination rate. We also searched for selective sweeps and chromosomal inversions along the genome. All species shared a marked reduction in effective population size (Ne) upon island colonization. We found diverse patterns of differentiated genomic regions relative to the genome average in all four species, suggesting the role of selection in island-mainland differentiation, yet the lack of congruence in the location of these regions indicates that each species evolved differently in insular environments. Our results suggest that the genomic mechanisms involved in the divergence upon island colonization—such as chromosomal inversions, and historical factors like recurrent selection—differ in each species, despite the highly conserved structure of avian genomes and the similar selective factors involved. These differences are likely influenced by factors such as genetic drift, the polygenic nature of fitness traits and the action of case-specific selective pressures."
full_description = "Research Open access Published: 08 November 2024 Repeated evolution on oceanic islands: comparative genomics reveals species-specific processes in birds María Recuerda ORCID: orcid.org/0000-0001-9647-36271,2, Julio César Hernández Montoya ORCID: orcid.org/0000-0001-9703-84913, Guillermo Blanco ORCID: orcid.org/0000-0001-5742-49291 & …Borja Milá ORCID: orcid.org/0000-0002-6446-00791 Show authors BMC Ecology and Evolution volume 24, Article number: 140 (2024) Cite this article 1532 Accesses 7 Altmetric Metrics details AbstractUnderstanding the interplay between genetic drift, natural selection, gene flow, and demographic history in driving phenotypic and genomic differentiation of insular populations can help us gain insight into the speciation process. Comparing patterns across different insular taxa subjected to similar selective pressures upon colonizing oceanic islands provides the opportunity to study repeated evolution and identify shared patterns in their genomic landscapes of differentiation. We selected four species of passerine birds (Common Chaffinch Fringilla coelebs/canariensis, Red-billed Chough Pyrrhocorax pyrrhocorax, House Finch Haemorhous mexicanus and Dark-eyed/island Junco Junco hyemalis/insularis) that have both mainland and insular populations. Changes in body size between island and mainland populations were consistent with the island rule. For each species, we sequenced whole genomes from mainland and insular individuals to infer their demographic history, characterize their genomic differentiation, and identify the factors shaping them. We estimated the relative (Fst) and absolute (dxy) differentiation, nucleotide diversity (π), Tajima’s D, gene density and recombination rate. We also searched for selective sweeps and chromosomal inversions along the genome. All species shared a marked reduction in effective population size (Ne) upon island colonization. We found diverse patterns of differentiated genomic regions relative to the genome average in all four species, suggesting the role of selection in island-mainland differentiation, yet the lack of congruence in the location of these regions indicates that each species evolved differently in insular environments. Our results suggest that the genomic mechanisms involved in the divergence upon island colonization—such as chromosomal inversions, and historical factors like recurrent selection—differ in each species, despite the highly conserved structure of avian genomes and the similar selective factors involved. These differences are likely influenced by factors such as genetic drift, the polygenic nature of fitness traits and the action of case-specific selective pressures. Peer Review reports IntroductionThe colonization of oceanic islands by mainland individuals has been a major engine of biological diversification, resulting in the evolution of thousands of new plant and animal species across the world [1,2,3,4,5]. These colonization events have also provided valuable research models to study processes like evolutionary divergence and local adaptation [6,7,8]. Upon colonization of oceanic islands, individuals across taxonomic groups have often been subjected to similar demographic and selective factors, like founder effects, population bottlenecks, strong selection for local adaptation, and reduced dispersal [9, 10], resulting in examples of repeated evolution (e.g., [11, 12]). The concept of repeated evolution involves the evolution of similar traits in response to similar environmental pressures, and it encompasses processes like parallel and convergent evolution. Parallel evolution occurs when the ancestral state prior to selection is similar in both populations or taxa, whereas convergent evolution occurs when the ancestral state is different [13].The molecular basis of similar phenotypic traits across species could be entirely species-specific, or instead show evidence of repeated evolution among species. The degree of repeated evolution at the molecular level can range from sharing the same mutation on the same gene, to changes at different nucleotides within the same gene, to changes in different genes within the same pathway [14, 15]. The probability of repeated molecular evolution is determined by several factors, increasing when selective pressures are similar and genomic constraints such as demography and phylogenetic history are shared [16]. The genetic architecture of the phenotypic traits under selection is also important: single-locus traits have been often involved in repeated evolution (e.g., [17, 18]), yet for polygenic traits, which can be modified through multiple pathways, repeated molecular evolution becomes less likely [16, 19, 20] resulting instead in heterogeneous, species-specific patterns of genetic differentiation. Therefore, when dealing with polygenic traits, it is more likely to observe repeated phenotypic evolution achieved by modifying different loci that are involved in similar functions [21, 22]. In insular environments, the effect of genetic drift and founder effects that reduce genetic diversity randomly, likely limits the number of loci selection can act on [23]. This, added to the fact that a smaller effective population size reduces the efficacy of selection, results in insular populations generally having a reduced adaptive potential compared to their mainland counterparts, constraining the possibilities of observing parallel molecular evolution in insular environments [24].Understanding the factors that generate heterogeneous patterns of differentiation across the genome is one of the main goals of population genomics [25,26,27,28,29]. When comparing differentiated populations, regions that are highly divergent relative to the genomic background are known as “islands of differentiation” [30, 31] and are usually detected as regions of high relative divergence (Fst [32]). Recent advances in sequencing technologies have allowed studying the genomic landscapes of variation, which show the distributional pattern of genomic variation across the entire genome [23, 31, 33, 34]. The main factors shaping differentiation patterns are drift and selection, but demographic history and genomic features such as gene content and recombination and mutation rate, also affect the distribution of the differentiated regions [27]. Early genome scans interpreted Fst peaks as signatures of strong selection surrounded by valleys homogenized by gene flow [35], where those Fst peaks were caused by marked differences in allele frequencies at locally adapted sites and the neutral loci linked to them [36, 37]. However, when considering patterns of absolute divergence (dxy) and within-population diversity (π) besides Fst, new interpretations of how these islands of differentiation originate have been put forward. Fst peaks could also appear when population diversity is low in either of the populations compared, while dxy is less affected by this pattern. Several processes such as positive and/or background selection can reduce within population nucleotide diversity and generate “islands” of relative divergence, while absolute divergence remains unchanged [25, 38, 39]. Four theoretical models have been proposed to explain the underlying cause of islands of differentiation [39, 40] and to identify each one it is crucial to understand the relationship between Fst, dxy and π [25, 39,40,41]. Two of those models account for speciation in the presence of gene flow (“Divergence-with-gene-flow” and “Sweep-before‐differentiation”) and the other two involve allopatric speciation (“Selection in allopatry” and “Recurrent selection”) [40]. In the island colonization scenario, both speciation in the presence of gene flow and speciation in allopatry could potentially occur, yet in oceanic islands allopatric models are more likely. Thus, to correctly interpret the genomic landscapes of differentiation it is important to understand the demographic and evolutionary history of the target taxa [27]. Moreover, variations in effective population size (Ne) can produce different genomic signatures. For instance, marked reductions in Ne such as those caused by population bottlenecks at founder events, can modify levels of background selection and therefore affect the baseline for the detection of outlier loci [24, 42].Covariation of genomic patterns of differentiation among different avian species has been shown across broad evolutionary timescales [43,44,45,46] and the coincident location of differentiation peaks has been of special interest to understand the process of repeated molecular evolution where similar loci evolve independently in several species [47]. Bird genomes show high synteny [48], a relatively stable number of chromosomes [49], similar recombination landscapes [50, 51], and across species microchromosomes show higher density in gene content than macrochromosomes [50, 52]. The similarity in genomic landscapes of differentiation across closely related and recently diverged avian taxa could be attributed to a combination of factors. These include the non-random distribution of gene content across the genome and the coincidence of low recombination areas, along with linked selection, which may lead to the clustering of genes [44, 49]. Previous studies have demonstrated that the recombination landscape in birds can remain consistent across species over long evolutionary time periods [50].To better understand the genomic underpinnings of phenotypic evolution, it is crucial to consider the role of chromosomal rearrangements, such as inversions. Inversions can keep sets of adaptive alleles together in strong linkage disequilibrium, promoting the maintenance of locally adapted genomic regions. Inversions can in some instances facilitate and accelerate the parallel adaptive process by making effective selection stronger [53]. The importance of inversions in repeated evolution has been demonstrated in various taxa (e.g., [54, 55]), and their role in avian evolution is receiving increased attention [56, 57], yet their role in the context of island colonization remains underexplored (but see [58]).Repeated phenotypic changes on islands are often driven by similar selective pressures related to their unique features compared to mainland environments, such as simplified ecosystems, reduced trophic resources, the availability of new ecological niches, decreased predation (which can lead to increased intraspecific competition), and reduced interspecific competition [7, 59]. These insular selective pressures typically result in predictable changes, collectively known as the island syndrome [60, 61]. This syndrome includes modifications in body size [62], often attributed to the absence of predators and shifts in competition, as well as dietary changes to adapt to new trophic resources, leading to behavioral [63, 64], morphological [65, 66], and physiological adaptations [67, 68]. The consistent patterns of phenotypic evolution observed in insular populations across various taxonomic groups have given rise to general biogeographic rules, such as Foster’s rule, also known as the “island rule,” which posits that small animals tend to become larger and large animals tend to become smaller on islands [62, 69, 70].These patterns suggest the potential for repeated evolutionary processes across species, providing an opportunity to investigate whether the selective mechanisms during island colonization are shared among species and whether selection targets the same or different genomic loci. However, newly established island populations often face significant genetic challenges due to founder effects and genetic drift, which can reduce their adaptive potential [24]. Small founding populations and random chance often lead to a substantial reduction in the genetic pool of colonizers compared to the source population [71]. The extent and persistence of this reduced diversity are influenced by several factors: the size of the founding population, the level of isolation, the number of colonization events, and the time elapsed since the initial migration, which allows for potential renewal of diversity through mutations and gene flow [72, 73]. Additionally, small effective population sizes, successive founder events, and frequent bottlenecks can further magnify the effects of genetic drift, leading to the rapid loss of genetic diversity [20, 74]. Understanding the genomic underpinnings of divergence in oceanic islands is complex due to the concurrent occurrence of multiple genomic processes. Nevertheless, recent advances in high-throughput DNA sequencing are enabling more studies to address this issue (reviewed in [15]). Both selection and drift play roles in influencing phenotypic changes in island populations, but patterns of repeated phenotypic change are more likely to be driven by selection rather than by random drift [16, 75].Here we use a comparative approach to examine patterns of genome-wide differentiation in avian species that have colonized oceanic islands, with the goal of exploring if similar patterns of demographic history, time of divergence, and the effects of drift and directional selection in driving divergence could result in repeated molecular evolution upon island colonization. We selected four passerine species that have mainland populations and have also colonized oceanic islands; two species from mainland Europe that have colonized the island of La Palma in the Canary Islands, Atlantic Ocean, the Common Chaffinch (Fringilla coelebs/canariensis) and the Red-billed Chough (Pyrrhocorax pyrrhocorax), and two species from North America that have colonized Guadalupe Island on the Pacific Ocean, the House Finch (Haemorhous mexicanus) and the Dark-eyed Junco (Junco hyemalis/insularis). Given the considerable distance separating insular and mainland populations, and the fact that they are already recognized as separate subspecies or species, we can assume that the insular and mainland populations of these species are mainly allopatric with very restricted gene flow. The Red-billed Chough and the House Finch have diverged from mainland populations within the last 100,000 years, whereas the Common Chaffinch and the Junco have been separated from their mainland relatives for over 500,000 years [76,77,78]. Divergence times were estimated using mitochondrial DNA for all species, plus microsatellites for the Red-billed Chough and SNPs for the Common Chaffinch. Given that all four species have colonized oceanic islands and have been subjected to potentially similar selective pressures, we first analyzed if the differences in morphology between insular and mainland counterparts affected the same traits across species, as specific changes in morphological traits are expected upon colonization of the new insular environment [4, 10].We also asked if the genomic landscapes of differentiation are similar among species with different divergence times between insul"
