title = "Xanthium strumarium L., an invasive species in the subtropics: prediction of potential distribution areas and climate adaptability in Pakistan | BMC Ecology and Evolution | Full Text"
description = "Invasive species such as Xanthium strumarium L., can disrupt ecosystems, reduce crop yields, and degrade pastures, leading to economic losses and jeopardizing food security and biodiversity. To address the challenges posed by invasive species such as X. strumarium, this study uses species distribution modeling (SDM) to map its potential distribution in Pakistan and assess how it might respond to climate change. This addresses the urgent need for proactive conservation and management strategies amidst escalating ecological threats. SDM forecasts a species’ potential dispersion across various geographies in both space and time by correlating known species occurrences to environmental variables. SDMs have the potential to help address the challenges posed by invasive species by predicting the future habitat suitability of species distributions and identifying the environmental factors influencing these distributions. Our study shows that seasonal temperature dependence, mean temperature of wettest quarter and total nitrogen content of soil are important climatic factors influencing habitat suitability of X. strumarium. The potential habitat of this invasive species is likely to expand beyond the areas it currently colonizes, with a notable presence in the Punjab and Khyber Pakhtunkhwa regions. These areas are particularly vulnerable due to threats to agriculture and biodiversity. Under current conditions, an estimated 21% of Pakistan’s land area is infested by X. strumarium, mainly in upper Punjab, central Punjab and Khyber Pakhtunkhwa. The range is expected to expand in most regions except Sindh. The central and northeastern parts of the country are proving to be particularly suitable habitats for X. strumarium. Effective strategies are crucial to contain the spread of X. strumarium. The MaxEnt modeling approach generates invasion risk maps by identifying potential risk zones based on a species’ climate adaptability. These maps can aid in early detection, allowing authorities to prioritize surveillance and management strategies for controlling the spread of invasive species in suitable habitats. However, further research is recommended to understand the adaptability of species to unexplored environments."
full_description = "Research Open access Published: 10 October 2024 Xanthium strumarium L., an invasive species in the subtropics: prediction of potential distribution areas and climate adaptability in Pakistan Muhammad Waheed1, Sheikh Marifatul Haq2, Fahim Arshad1, Ivana Vitasović-Kosić3, Rainer W. Bussmann2,4, Abeer Hashem5 & …Elsayed Fathi Abd-Allah6 Show authors BMC Ecology and Evolution volume 24, Article number: 124 (2024) Cite this article 1140 Accesses 1 Citations 8 Altmetric Metrics details AbstractInvasive species such as Xanthium strumarium L., can disrupt ecosystems, reduce crop yields, and degrade pastures, leading to economic losses and jeopardizing food security and biodiversity. To address the challenges posed by invasive species such as X. strumarium, this study uses species distribution modeling (SDM) to map its potential distribution in Pakistan and assess how it might respond to climate change. This addresses the urgent need for proactive conservation and management strategies amidst escalating ecological threats. SDM forecasts a species’ potential dispersion across various geographies in both space and time by correlating known species occurrences to environmental variables. SDMs have the potential to help address the challenges posed by invasive species by predicting the future habitat suitability of species distributions and identifying the environmental factors influencing these distributions. Our study shows that seasonal temperature dependence, mean temperature of wettest quarter and total nitrogen content of soil are important climatic factors influencing habitat suitability of X. strumarium. The potential habitat of this invasive species is likely to expand beyond the areas it currently colonizes, with a notable presence in the Punjab and Khyber Pakhtunkhwa regions. These areas are particularly vulnerable due to threats to agriculture and biodiversity. Under current conditions, an estimated 21% of Pakistan’s land area is infested by X. strumarium, mainly in upper Punjab, central Punjab and Khyber Pakhtunkhwa. The range is expected to expand in most regions except Sindh. The central and northeastern parts of the country are proving to be particularly suitable habitats for X. strumarium. Effective strategies are crucial to contain the spread of X. strumarium. The MaxEnt modeling approach generates invasion risk maps by identifying potential risk zones based on a species’ climate adaptability. These maps can aid in early detection, allowing authorities to prioritize surveillance and management strategies for controlling the spread of invasive species in suitable habitats. However, further research is recommended to understand the adaptability of species to unexplored environments. Peer Review reports IntroductionThe increasing globalization of trade, travel and anthropogenic activities has led to an unprecedented rate of transboundary species displacement [1]. While many non-native species coexist harmoniously with their new environment, some exhibit invasive traits that can disrupt the balance of ecosystems and threaten native biodiversity [2,3,4]. Subtropical regions, with their transitional climates and diverse habitats, are particularly susceptible to the growth and spread of invasive plants due to the combination of favorable conditions and human activities [5]. The invasion of exotic plant species into new ecosystems has become a pervasive and complex issue in the field of ecology and conservation biology [6]. The introduction of invasive plants can disrupt the delicate balance of native habitats and adversely affect biodiversity, ecological functions and human activities [7]. Understanding the ecological niche of these invasive plants and predicting their future invasion risk is crucial for effective management and conservation measures [8, 9]. Subtropical regions, which occupy a significant portion of the world’s landmass, have a rich diversity of ecosystems, from tropical rainforests to dry grasslands [10]. These regions are known for their distinct climatic patterns with moderate to high temperatures and fluctuating rainfall throughout the year [11]. These conditions create a unique ecological environment in which invasive plants can thrive [12]. The vulnerability of subtropical regions to plant invasions is exacerbated by human activities such as urbanization, agriculture and trade, which facilitate the introduction and spread of alien species [13].Species distribution model (SDM) plays a crucial role in understanding and controlling the spread of invasive plant species [14]. By integrating environmental variables and species occurrence data, SDM enables the prediction of potential invasion areas, contributing to early detection, efficient resource allocation and informed management strategies [15]. SDM supports conservation planning by identifying threatened habitats, adapting to climate change impacts, assessing risks, optimizing resource use, guiding research efforts, and providing data-driven insights for proactive management of invasive species to ensure conservation of native ecosystems and mitigate ecological and economic impacts [16, 17]. The creation of SDM to determine the range of a species requires data that includes the species’ occurrence and influential environmental factors such as land use, climate variables and topography [18]. When creating an SDM, the relationship between the occurrence data and the predictive variables is analyzed using statistical algorithms and machine learning techniques. This model is then used to estimate the potential occurrence of the species in larger geographic areas [19]. Once an SDM is developed, it can be used to predict the occurrence of species in regions without occurrence data. In addition, SDMs can identify areas with a high probability of species occurrence based on prevailing environmental conditions. By examining ecological parameters that influence the distribution of a particular species, SDMs can identify regions where environmental conditions are favorable for the species to thrive [3, 9, 20]. Such findings are used to prioritize invasive areas and guide habitat restoration studies [21].Invasive alien species are widely recognized as a major cause of global biodiversity loss [17]. Xanthium strumarium, commonly known as common cocklebur, considered as one of the worst weeds in the world, has become a serious problem in Pakistan, significantly affecting the biodiversity of agricultural lands, roadsides, pastures, riverbanks, embankments, parks, lakes and even urban areas [22,23,24]. The spread of this plant has considerable ecological and economic consequences [25]. It poses a serious threat to various agricultural crops such as maize, soybean, sunflower, peanut and cotton in many regions of the world, including Pakistan [26]. X. strumarium is an annual plant that was originally native to North and South America, is widely naturalized (between 53° N latitude and 33° S longitude) and occurs mainly in the temperate zone, but also in subtropical and Mediterranean climates. The seeds of X. strumarium are easily dispersed as the thorny fruits can adhere to animal bodies, facilitating their transfer to new habitats. The plants can quickly become the dominant plant in an area due to their prolific seed production and high germination and survival rates [27]. The plant was introduced to Pakistan in the early 1980s, coinciding with the Afghan war [22]. The large-scale migration of Afghan nomads and their livestock led to the spread of this highly invasive weed from small to large areas [28]. Xanthium strumarium is widely distributed in several countries, including regions such as Pakistan, Australia, India, South Africa, the United States, and Turkey, where it is known as a serious weed [29]. Its occurrence and invasiveness in Pakistan has been documented in several regions including Islamabad, northwest Pakistan, Khyber Pakhtunkhwa and the upper Indus plains in Punjab [22,23,24, 28,29,30]. Currently, it is considered one of the most problematic and widespread weeds in Pakistan. In our study, we used MaxEnt and ArcGIS to delineate suitable habitats for X. strumarium in Pakistan, considering various factors such as soil properties, bioclimatic conditions, terrain features, and human activities. The integration of global climate models allowed us to predict potential climate changes and their impact on the species’ distribution. This approach provides valuable insights for planning and managing invasive species and supports conservation efforts by identifying areas suitable for eradication and considering the effects of climate change. The study had two main objectives: (1) assessment of current and projected future distribution patterns of X. strumarium while evaluating the comparative importance of different environmental parameters in the context of climate change scenarios and (2) to analyze the associated habitat changes related to the projected future suitability of X. strumarium in the subtropical region of Pakistan. We hypothesized that there is a significant relationship between environmental factors and the spread of X. strumarium in subtropical regions, suggesting that factors such as climatic conditions and soil characteristics influence the spread and that future climate change will increase the risk of invasion of this invasive species.Materials and methodsPresence dataThe subtropical region of Pakistan, characterized by its diverse topography and climatic conditions, is of great ecological and agricultural importance. Situated between the arid plains of the Indus Valley and the temperate zones of the Himalayas, this region encompasses a variety of habitats ranging from dense forests to fertile plains and plateaus. It is an important hotspot for biodiversity and is home to numerous endemic animal and plant species. In addition, the subtropical climate of this region with its distinct rainy and dry seasons offers ideal conditions for agriculture and enables the cultivation of various crops such as cotton, wheat, rice, and sugar cane. However, the region is also prone to environmental problems such as soil erosion, deforestation and the invasion of alien plant species such as X. strumarium, which pose a particular threat to the region’s ecosystems and agricultural productivity. These invasive plants can compete with native species for resources, disrupt ecosystem dynamics, and cause economic losses to farmers. Given the ecological importance and agricultural productivity of the subtropical region, it is important to study and address the challenges posed by invasive species such as X. strumarium. First, we conducted a comprehensive field survey to systematically map the areas infested by X. strumarium in the subtropical region (Fig. 1). The species, X. strumarium, was identified by Muhammad Waheed. A voucher specimen, labeled bearing the designation OKW23, was safely deposited at the Herbarium of the University of Okara. We used the quadrat method, a widely recognized technique in ecological research, to record the occurrence of different plant species. Our surveys were conducted in regions where X. strumarium had previously been reported as an invasive species and in surrounding areas to understand distribution patterns comprehensively.Fig. 1a) Xanthium strumarium plant; b) Invasion on agricultural land; c) Invasion on railway track; d) Flower of X. strumarium. (The photographs were captured by the first author during the field survey conducted in 2020)Full size imageFrom January 2020 to December 2022, we collected data on X. strumarium in different land use categories, including forests, farmland, roadsides, river basins and parklands. Our survey method involved the establishment of 10 × 10 m2 field plots in the surveyed regions. These plots were strategically placed at random to ensure a representative sample of the landscape. Within these plots, we accurately recorded the extent of X. strumarium stands. Only plots with 100% X. strumarium cover were considered for modeling and analysis. This strict selection criterion ensured that our modeling efforts were focused on areas where X. strumarium was present and dominant in significant quantity, allowing for more accurate insights into its distribution patterns and potential impacts. Over the course of three years, we conducted field surveys in Punjab, Pakistan, to collect information on the current occurrence of X. strumarium. In the first survey, all occurrences of this species in their natural habitats were documented and geo-referenced. A total of 53 records in Punjab were carefully documented to produce a comprehensive distribution map for X. strumarium in the region (Fig. 2) (Supplementary data; Table 1). In addition, 29 records were collected by the Global Biodiversity Information Facility (GBIF.org (August 26, 2022) GBIF Occurrence download epub https://doi.org/10.15468/dl.mj5kqd). We checked and excluded sites that were less than 10 km from locations (or habitats) where the species was observed (Fig. 2). This step was taken to avoid errors that could occur if we incorrectly assume that the species doesn’t occur, when in fact it does [3]. Most species occurrence prediction methods assume that species occurrence data are distributed across different locations [11]. When creating and evaluating predictive models, it’s important that many sites aren’t grouped too closely together. If there are many such grouped sites, the models may focus too much on these and not provide good results for other sites. This can give a false impression of the accuracy of the model [17].Fig. 2A map of the study area showing the subtropical regions of Pakistan and distribution points of X. strumarium. (The map was created using ArcGIS software, version 10.3.)Full size imageData collection and selection of environmental variablesAs part of our study, we compiled a comprehensive dataset of 19 bioclimatic variables with a spatial resolution of 2.5 arc minutes and elevation data with a higher resolution of 30 arc seconds from WorldClim (version 2.1) (www.worldclim.org, accessed June 15, 2022). In addition, we integrated 10 edaphic variables from https://soilgrids.org/ (accessed June 15, 2022) (Supplementary data; Table 2). To enhance our spatial data, we used ArcGIS 10.5 software to select and extract topographic information such as elevation, slope, and aspect. These layers were subjected to spatial analysis procedures to create a digital elevation model (DEM). For our future simulations, we obtained two sets of common socioeconomic paths (SSPs), namely SSPs 245 and SSPs 585, from the Coupled Model Intercomparison Project, Phase 6 (CMIP6). The shared socio-economic pathways (SSPs) comprise a range of potential future pathways, with SSP2-4.5 representing a moderate greenhouse gas emissions scenario and SSP5-8.5 representing a high emissions pathway with significant climate impacts, each providing insights "
