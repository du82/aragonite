title = "Diversity of attachment systems in heelwalkers (Mantophasmatodea) – highly specialized, but uniform | BMC Ecology and Evolution | Full Text"
description = "Background Heelwalkers possess a highly modified tarsal attachment system. All extant species lift the distalmost tarsomere permanently off the substrate and primarily use their euplantulae for locomotion. The combination of a smooth adhesive pad (arolium) on the pretarsus and fibrillary attachment pads on the euplantulae offers valuable insights for translational approaches, but its infra-order diversity remains unexplored. Results We explored the morphology of the tarsal attachment apparatus of Mantophasmatodea based on a representative taxon sampling spanning a large fraction of species of this group and compared morphological differences in the specialized morphology of this system across species and sexes. Our scanning electron microscope investigation of the tarsi of 11 species (52% of all described extant species) revealed an overall very consistent ground pattern and almost no specific adaptations. There are only minor, but mostly clade-specific differences in the shape of the adhesive setae on the tarsal euplantulae and in the morphology and density of the acanthae on the pretarsal arolium. Both features differ primarily between Austrophasmatidae in comparison to the remaining Mantophasmatodea taxa. Conclusion We conclude that the strong specialization of the mantophasmatodean tarsal attachment sufficiently copes with the diversity of substrates the insects are exposed to."
full_description = "Research Open access Published: 25 October 2024 Diversity of attachment systems in heelwalkers (Mantophasmatodea) – highly specialized, but uniform Thies H. Büscher1, Stanislav N. Gorb1 & Monika J. B. Eberhard2 BMC Ecology and Evolution volume 24, Article number: 130 (2024) Cite this article 552 Accesses Metrics details AbstractBackgroundHeelwalkers possess a highly modified tarsal attachment system. All extant species lift the distalmost tarsomere permanently off the substrate and primarily use their euplantulae for locomotion. The combination of a smooth adhesive pad (arolium) on the pretarsus and fibrillary attachment pads on the euplantulae offers valuable insights for translational approaches, but its infra-order diversity remains unexplored.ResultsWe explored the morphology of the tarsal attachment apparatus of Mantophasmatodea based on a representative taxon sampling spanning a large fraction of species of this group and compared morphological differences in the specialized morphology of this system across species and sexes. Our scanning electron microscope investigation of the tarsi of 11 species (52% of all described extant species) revealed an overall very consistent ground pattern and almost no specific adaptations. There are only minor, but mostly clade-specific differences in the shape of the adhesive setae on the tarsal euplantulae and in the morphology and density of the acanthae on the pretarsal arolium. Both features differ primarily between Austrophasmatidae in comparison to the remaining Mantophasmatodea taxa.ConclusionWe conclude that the strong specialization of the mantophasmatodean tarsal attachment sufficiently copes with the diversity of substrates the insects are exposed to. Peer Review reports IntroductionAttachment devices for locomotion are considered key innovations during the evolution of insects playing a major role for their diversification [1,2,3]. They promoted diversification of habitats and lifestyles [4] and enable extant insects to move over various terrains [5]. The adaptation to different surfaces in various environments resulted in a plethora of different attachment devices on the tarsi and pretarsi of insects [1, 6, 7].Heelwalkers (Mantophasmatodea) stand out among insects for various reasons. Their description in 2002 [8] as the latest described insect order caused considerable interest for insect systematics [6, 7, 9], and their characteristic tarsal architecture and functionality distinguish heelwalkers from all other insects [6, 7, 10]. These apterous predators are at best medium sized and primarily occur in southern parts of Africa [11, 12]. Compared to the tarsal morphology of other insects, the tarsi of Mantophasmatodea are highly specialized [6, 7]. One striking apomorphic trait is the eponymous modification of the 5th tarsomere, which is usually lifted off the substrate [10]. This tarsomere bears the pretarsus with two claws strongly reduced in size and an enlarged arolium [6, 7, 13]. For attachment during locomotion, heelwalkers employ only the attachment pads of the proximal tarsomeres (euplantulae), which are densely covered with elongated adhesive setae [6, 7]. The pretarsal arolium in contrast bears acanthae (smaller cuticular outgrowths) on a large fraction of its surface and a smooth area without any surface projections, which is brought into contact with the substrate for generation of adhesion [10]. While the adhesive force that can be generated by the arolia is remarkably high and allows the animals to attach to smooth substrates with one tarsus only (see [14]), these pads are mostly used in rare occasions, such as for attachment support in emergency situations [6], during feeding [10, 14] or copulation [10]. The general tarsal equipment was described for one species in detail [6, 7] and one study investigated the arolium of two further species [10]. These studies summarized the putative tarsal ground pattern for Mantophasmatodea to consist of five tarsomeres, of which the basal three are synsclerotic, but separated by distinct dorsal grooves [15] and a pretarsus, both equipped with the respective attachment pads [6, 7, 10]. Notably, the combination of hairy euplantulae and smooth arolia unites the two main principles of tarsal attachment devices in insects [2] on the same tarsus. There are various convergent occurrences of either hairy or smooth attachment pads in animals [3, 5], and only few cases of a combination of these principles within the same individual or species. Despite their morphological difference, both principles rely on maximization of the actual contact area for attachment and achieve this by flexible setae in hairy systems [2, 16] or by soft cuticle layering in smooth systems [17] aiding in adaption to the asperities of the substrates. Both are included in the specialized morphology of tarsi of Mantophasmatodea. This hybrid system is of interest to investigate complementary functions of both pad types for translational approaches [4]. Exploring its diversity within Mantophasmatodea aids in identification of adaptive modifications and limitations of this combination of attachment principles.The tarsal attachment structures of some other polyneopteran insect groups vary considerably between species, e.g. in earwigs (Dermaptera; [18]) stone flies (Plecoptera; [19]) and stick and leaf insects (Phasmatodea; [20, 21]), resulting from ecological differences of the species [3, 5]. In contrast, in Zoraptera (angel insects) tarsal features are very uniform [22]. Zoraptera comprises only few species and it has been speculated that the absence of specialized tarsal attachment structures interfered with the diversification of this specific lineage [22]. Mantophasmatodea is as well represented by only a small number of species [23], but these possess remarkably complex tarsal attachment systems. As the morphology of the attachment systems of only few taxa is known in this group, we intend to shed light on the diversity of this character system within Mantophasmatodea.We investigated the tarsal morphology of a broad taxon sampling across the major lineages of Mantophasmatodea. Ten species, six represented by both sexes, were examined using scanning electron microscopy (SEM). We compared the tarsal morphology of these species and incorporated the illustrations present in the literature [6, 7, 10] to analyze the diversity of the attachment system in this lineage based on 52% of all known extant species (eleven species). Our aim was to elucidate (i) the diversity of this specialized attachment system, (ii) potential adaptations at the species-level and (iii) potential sexual dimorphism in the attachment system.Materials and methodsSpecimensWe examined the tarsi of adult specimens of various mantophasmatodean species as listed in Table 1. All samples were preserved in 70% ethanol from previous studies [10, 23, 24]. The tarsal morphology of two further species was visualized in previous studies and included in this analysis. For one of these species, Mantophasma zephyra, additional micrographs not included in Beutel & Gorb [6, 7] were used to assess the features of concern for this study.Table 1 Species used in the present study. n indicates the number of specimens examined in this study. * = information taken from the literatureFull size tableScanning electron microscopy (SEM)Tarsi of ethanol stored specimens were severed at the base of the tibia and dehydrated in an ascending ethanol series. Subsequently, samples were critical point dried (Leica EM CPD 300, Leica Microscopy GmbH), mounted on aluminum stubs and sputter-coated with 10 nm gold-palladium using an EM SCD500 sputter coater (Leica Camera, Wetzlar, Germany). The tarsi were observed using a TM3000 tabletop SEM (Hitachi High-Tech Corp., Tokyo, Japan) at 15 kV accelerating voltage. If necessary, the SEM Hitachi S4800 (Hitachi High-Technologies Corp., Tokio, Japan) was used at 5 kV acceleration voltage for higher magnifications. Overview images of the same tarsus from different directions were obtained by using a rotatable sample holder [25]. Images were cropped and aligned using Affinity Photo and Affinity Designer (Serif Ltd., United Kingdom). Distances (e.g. aspect ratios) were measured using ImageJ version 1.54d [26]. We used additional micrographs of M. zephyra from previous investigations to assess the tarsal morphology [6, 7] obtained from cryo-SEM using liquid nitrogen for the cryo-fixation of the freshly ablated tarsi as described therein.Body length measurementsTo assess morphological differences between species in light of size differences across mantophasmatodeans, body length was used for comparison between species. We collected reported measurements from the literature [27,28,29,30] (see Supplementary Information S1) and measured the body length of all specimens examined in this study according to Klass et al. [28], i.e. from the anterior margin of the head to the posterior margin of the epiproct, using digital calipers (Alpha Tools Digital Caliper, Mannheim, Germany) to the nearest 0.01 mm.Terminology of micromorphological charactersSome micromorphological characters are named inconsistently in the literature. The small cuticular protuberances on the arolium are sometimes termed microtrichia (e.g [10]). and sometimes acanthae (e.g [6, 7]). for Mantophasmatodea. The same applies for the same character in Phasmatodea (see [21]). A similar situation is found for the hairs on the euplantulae. These are regarded as acanthae [6], hairs [10] or setae [7]. All of these terms originally relate to the cellular organization of the cuticle protuberances according to Richards & Richards [31]. Acanthae are defined as unicellular outgrowths, microtrichia are subcellular and setae consist of multiple cells. We consider the protusions on the arolium as acanthae and the hairs on the euplantulae as tenent setae according to their size, but further anatomical research is required to clarify the structural origin of these structures. As tenent setae is often used as a term for adhesive setae on insect tarsi we adopted this term for consistency. However, most of these tenent setae lack sockets typical for actual multicellular setae [2], hence, might more likely be acanthae.ResultsOverall tarsal morphologyThe tarsi of the three leg pairs (i.e. fore legs, middle legs and hind legs) are homogenous within the same individual (Fig. 1). There are no noticeable differences in the overall morphology of the tarsi. Therefore, with few exceptions, not all three leg pairs’ tarsi are shown here for the majority of the investigated species. All tarsi consist of five tarsomeres, of which the proximal three are somewhat fused, but can be distinguished by dorsal grooves (Fig. 1). The proximal four tarsomeres bear hairy euplantulae (Fig. 2A–C). The fifth tarsomere (ta5) bears a membranous pad ventrally, that is partially covered by acanthae, i.e. unicellular cuticular outgrowths according to Richards & Richards [31]. One arolium and two claws are located on the pretarsus (Fig. 2). Euplantulae, arolia, and the membranous area on ta5 consist of soft cuticle, indicated by the deflation of these pads observed in most cases. These membranous areas are all surrounded by elongated trichoid sensilla (Fig. 2; ts).Fig. 1Tarsi of Karoophasma biedouwense. A. Adult female, image by S. Küpper. B-G. Overview SEM images of the female tarsal morphology. B, D, F. ventral views. C,E, G. lateral views, ventral side facing downwards. B, C. Protarsus. D, E. Mesotarsus. F, G. Metatarsus. The setae of the euplantulae are largely covered by soil particles (asterisk), especially on the protarsus (B) and mesotarsus (D). Scale bars = A 1 mm; B–G 500 μmFull size imageFig. 2Overview of the tarsal morphology of Austrophasma gansbaaiense, female. (A) Protarsus. (B) Mesotarsus. (C) Metatarsus. (D) Arolium. (E) Tarsomere 5. (F) Adhesive setae of the euplantulae. (G) Acanthae on the arolium. ac, acantha; acs, acanthae zone; ads, adhesive zone; ar, arolium; cl, claw; eu1–4, euplantula 1–4; ta1–5, tarsomere 1–5; se, adhesive seta; sp, soft membranous pad; ts, trichoid sensilla; arrowheads, trichoid sensilla line between acs and ads. Scale bars = A–C, 500 μm; D, 200 μm; E, 100 μm; F, 20 μm; G, 5 μmFull size imageAroliaThe mantophasmatodean arolium is a smooth attachment pad (sensu [2]). It does not bear elongated hairy attachment structures. Nevertheless, the ventral proximal area of the arolium is covered with acanthae in all species (Fig. 3). The area in which acanthae are found is distinctly separated by the smooth adhesive zone (Fig. 2D, arrowheads). A line of trichoid sensilla is separating these two areas. Two claws are present on every pretarsus. These claws are comparably small and do not protrude over the arolium. In contrast to most other insects, the claws are oriented to the proximal side of the arolium. In most species, two trichoid sensilla are situated at the base of the claws (Fig. 3, ts). These sensilla were not present in S. paresisense (Fig. 3H). On the macroscopic level, no other differences between the taxa were observed.Fig. 3Comparative morphology of arolia. A. K. biedouwense, female protarus. B. K. botterkloofense, female protarsus. C. H. montaguense, male protarsus. D. A. rawsonvillense, female protarsus. E. A. gansbaaiense, female protarsus. F. N. ookiepense, female protarsus. G. V. clanwilliamense, male mesotarus. H. S. paresisense, male mesotarsus. I. M. zephyra, female metatarsus. J. T. gladiator, male mesotarsus. ts, trichoid sensilla. Scale bars = 200 μmFull size imageEuplantulaeThe four tarsal euplantulae are large hairy attachment pads and cover the entire ventral face of the tarsomeres (Fig. 2A–C). No differences in the relative area of the tarsomere covered by the euplantulae were observed between the species. Every euplantula is densely covered by elongated tenent setae (Fig. 2F, se). The length of these setae varies within the same euplantula and increases from the center to the periphery of the pad (Figs. 1 and 2). Two different types of seta tips were observed within Mantophasmatodea. All species possess setae with single pointed tips (Fig. 4A–F), but setae with a terminal spatula were found in four species in addition to M. kudubergense [10]: Viridiphasma clanwilliamense, S. paresisense, M. zephyra, and T. gladiator (Fig. 4G–J). Interestingly, single tip setae are found in these species as well. Both types of setae co-occur on the same euplantula. While single tip (pointed) setae are situated in the central area of the attachment pad, spatulate setae are always found at the margin areas of the euplantulae in all species that possess this type of setae (Fig. 5).Fig. 4Comparative morphology of euplantula adhesive setae. A. K. biedouwense, female metatarsus. B. K. botterkloofense, male metatarsus. C. H. montaguense, male metatarsus. D. A. rawsonvillense, female mesotarsus. E. A. gansbaaiense, female protarsus. F. N. ook"
