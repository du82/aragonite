title = "Survival cost sharing among altruistic full siblings in Mendelian population | BMC Ecology and Evolution | Full Text"
description = "Background We focus on Haldane’s familial selection in monogamous families in a diploid population, where the survival probability of each sibling is determined by altruistic food sharing with its siblings during starvation. An autosomal recessive-dominant or intermediate allele pair uniquely determines the altruistic or selfish behavior, which are coded by homozygotes. We focus on the case when additive cost and benefit functions determine the survival probability of each full sibling. Results We provide conditions for the existence of the altruistic and selfish homozygote. We show that the condition of evolutionary stability of altruism depends on the genotype-phenotype mapping. Furthermore, if the offspring size increases then the condition of evolutionary stability of altruism becomes stricter. Contrary to that, for the evolutionary stability of selfish behavior it is enough if the classical Hamilton’s rule does not hold. Moreover, when the classical Hamilton’s rule holds and the condition of evolutionary stability of altruism does not hold, then the selfish and altruistic phenotypes coexist. Conclusions In summary, the classical Hamilton’s rule is a sufficient condition for the existence of altruism, but it alone does not imply the evolutionary stability of the pure altruistic homozygote population when the altruistic siblings share the cost of altruism."
full_description = 'Research Open access Published: 18 November 2024 Survival cost sharing among altruistic full siblings in Mendelian population József Garay ORCID: orcid.org/0000-0003-0860-22521, Inmaculada López ORCID: orcid.org/0000-0002-3877-92702, Zoltán Varga ORCID: orcid.org/0000-0002-4889-33763, Villő Csiszár ORCID: orcid.org/0000-0002-7021-31624 & …Tamás F. Móri ORCID: orcid.org/0000-0002-9328-74715 Show authors BMC Ecology and Evolution volume 24, Article number: 142 (2024) Cite this article 406 Accesses Metrics details AbstractBackgroundWe focus on Haldane’s familial selection in monogamous families in a diploid population, where the survival probability of each sibling is determined by altruistic food sharing with its siblings during starvation. An autosomal recessive-dominant or intermediate allele pair uniquely determines the altruistic or selfish behavior, which are coded by homozygotes. We focus on the case when additive cost and benefit functions determine the survival probability of each full sibling.ResultsWe provide conditions for the existence of the altruistic and selfish homozygote. We show that the condition of evolutionary stability of altruism depends on the genotype-phenotype mapping. Furthermore, if the offspring size increases then the condition of evolutionary stability of altruism becomes stricter. Contrary to that, for the evolutionary stability of selfish behavior it is enough if the classical Hamilton’s rule does not hold. Moreover, when the classical Hamilton’s rule holds and the condition of evolutionary stability of altruism does not hold, then the selfish and altruistic phenotypes coexist.ConclusionsIn summary, the classical Hamilton’s rule is a sufficient condition for the existence of altruism, but it alone does not imply the evolutionary stability of the pure altruistic homozygote population when the altruistic siblings share the cost of altruism. Peer Review reports BackgroundHaldane [1] was interested in “familial selection”, where the size of the family is strictly limited by the food resource, and more newborns are produced than can survive to enter the struggle among the members of the same family e.g. [2]. Contrary to Haldane, in the present paper we focus on the opposite situation, when during a period of limited food availability [3, 4], by food sharing the siblings help each other to survive in monogamous and diploid families. Clearly, during starvation, food sharing is an altruistic behavior since it decreases the survival probability of the donor, while increases that of the recipient. Here we focus on the following case: Whenever a sib is starving, all altruistic sibs help the starving one to survive by donating the necessary food such that the total quantity of the donated food does not depend on the number of donors. Suppose the received food increases the survival of the starving sib by b. If there is only one altruistic sib, then it is the only to donate, and the donation reduces its own survival probability by c. If there are n altruistic sibs, then the survival probability of each will be reduced by c/n, since they share the costs. We emphasize that in each given food sharing event, we have an additive cost model [4]. Here we will look for a condition of subsistence of sib altruism.In Haldane’s familial selection model, full siblings (sharing both parents) interact, thus it clearly belongs to the aegis of kin selection, in the sense of Maynard Smith [5]. Kin selection theory focuses on the genetic relatedness between the recipient and the actor [1, 6, 7]. The heuristic basic idea of the kin selection theory is the inclusive fitness effect: The altruistic gene can increase its evolutionary success when an individual having the altruistic gene promotes the survival of its sibling, who also carries the same altruistic gene, thus the altruistic individual indirectly increases the frequency of the altruistic gene. The well-known mathematical formulation of the idea of this indirect effect is the classical Hamilton’s rule [7]: the altruism will spread if \(\:rb>c\), where \(\:b\) is the fitness benefit to the recipient, \(\:\:c\) is the fitness cost to the actor and \(\:r\) is the coefficient of genetic relatedness between the interacting individuals. We also focus on altruistic helping with benefit \(\:b\) and cost \(\:c\), but not in pairwise interactions. We emphasize that our game is not a standard evolutionary game, like e.g. the well-known Public Goods Game e.g. [8], in which the individuals’ benefit may be realized in fecundity, and all individuals have equal benefit from the altruistic act. Our game is a survival game cf. [9], where only one individual gets the benefit (sibling’s life is rescued by its altruistic siblings), and the costs of helping (decreasing altruistic siblings’ survival rate) are shared by the altruistic siblings (i.e. the altruistic siblings have no direct benefit). We concentrate on survival for two main reasons. Survival is a prerequisite for reproduction, thus helping in survival seems an important evolutionary strategy between siblings. Moreover, in our survival game, during an altruistic act there is no direct benefit for altruistic individuals (contrary to the public goods game); thus, only indirect fitness effects can promote altruism, i.e. rescuing its parent’s altruistic allele. As a result, in the survival game considered here, the direct benefit of an altruistic sibling cannot mask the indirect effect.Over the last decade, the classical Hamilton’s rule has been a topic of controversy [10,11,12]. Van Veelen made an effort to find the connection between kin and group selection theories, but he pointed out that these theories, in general, are not equivalent [10, 13,14,15]. Furthermore, he was looking for conditions under which the classical Hamilton’s rule gives a right prediction. Based on replicator dynamics, he found that in a linear model (when the fitness effects are additive and homogenous in the number of altruistic siblings) the classical Hamilton’s rule is correct [14, 16]. Although the replicator dynamics can handle asexual populations [17], contrary to van Veelen, we focus on diploid sexual populations.The group selection method focuses on the advantage of group living [18,19,20]. Haldane’s familial selection is connected to the group selection too, since the interaction happens within families. There are ingredients of the group selection theory which are important in Haldane’s familial selection. The interaction is not well-mixed in the whole population and altruistic act can be a common action of full siblings [4]. Usually, this interaction is given by a multi-player game [21] with the synergetic effect of the number of altruists on the individual fitness of the group (i.e. family) members. However, the other two ingredients of the group selection theory do not occur in Haldane’s familial selection. In group selection theory, there is a direct competition between different groups. Contrary to that, in Haldane’s familial selection there is no competition between different families. Moreover, in group selection theory, the groups are “quasi” stable and the phenotypic composition of the groups is determined by the formation process of the groups. Contrary to that, in Haldane’s familial selection, the surviving newborns leave their family, and form new families according to the mating system. The phenotypic composition of the families is determined by the genetic system [3, 4] and the family’s phenotypic composition is fixed by the genotype of the parents. For the perspective of the present paper, the heuristic basic idea of the group selection theory is that the common action by group members (within groups and between groups) should be evolutionarily advantageous for them. Here we only focus on Haldane’s familiar selection where there is common action within families, but no intra-familiar competitions.We agree with Van Veelen and his coauthors, who pointed out these theories are not equivalent [12, 22]. However, from the viewpoint of Haldane’s familial selection, the heuristic basic ideas of the above two theories are reasonable at the same time. On the one hand, the indirect fitness effect can work in diploid sexual families. On the other hand, the group effect (common action by altruistic siblings on the survival rate) can also work, because the selection takes place within a family. Since a direct combination of these theories is questionable [12, 22], in the framework of a population genetic model one can bring together the heuristic basic ideas of these theories [3, 4, 23]. Indeed, in monogamous diploid families, the genetic relatedness between full siblings is ½, thus altruistic help can increase the frequency of the altruistic gene indirectly. Furthermore, the survival probability of each sibling depends on its siblings’ common action (in other words, the group effect takes place). To make it clear what the role of the indirect fitness and group effects is, we must follow van Veelen and his coauthors [24], treating population genetic models rigorously.The basis of our investigation is the orthodox Darwinian view, in the sense that we focus exclusively on the frequency change of genotypes in time. We think focusing on genotypes is the most direct and simplest way to study the evolution in the framework of Haldane’s familial selection. Why do we follow this orthodox Darwinian view? Below we mention some other possibly applicable methods and the reason why we think that they are not useful in Haldane’s familiar selection, but without a complete overview, of course.The applicability of the Price equation was criticized by [12, 13, 25].The allele frequency based model depends on Haldane’s familial selection. The reason is the following. Under panmixia the embryos follow Hardy–Weinberg equilibrium, but during maturation time, the survival rate of each juvenile depends on the genotypes of their full siblings, which are determined by their parents’ genotypes. Consequently, the parental population is not in Hardy–Weinberg equilibrium. The main technical problem is that in Haldane’s familial selection model there is no bijection between genotype and phenotype distributions without genetic equilibrium [26]. In mathematical terms: the genotype distribution cannot be reconstructed unequivocally from a given allele distribution when the population is not in Hardy–Weinberg equilibrium. Thus, if the parental population is not in Hardy–Weinberg equilibrium, then an infinite number of genotype (phenotype) distributions correspond to the same allele distribution. The number of genotypes is always higher than the number of alleles. Consequently, according to the dominant-recessive inheritance of altruism, at the same parental allele distribution we have an infinite number of parental genotype distributions, and for different parental distributions the relative frequency of altruistic siblings is quite different in the whole population.Footnote 1 Natural selection operates on the diploid level. Consequently, the natural selection takes place in a higher dimensional genotype space than the allele space. Thus, the consecutive populations are never in Hardy–Weinberg equilibrium; we can only follow the evolutionary change by following the frequency change of genotype distributions. We also mention that Allen and his co-workers [27,28,29,30] built up a general stochastic mathematical framework for natural selection. At each time step they calculated which alleles were replaced by copies of others as a result of interaction, reproduction, mating, and/or death. Contrary to that, in essence they also follow the genotype distribution change from generation to generation. Finally, in the population genetics models, when the juveniles’ survival rates depend on the genotypes of their parents, the state variable of the model must be the genotype distribution [31,32,33,34,35].The applicability of individual-based fitness methods e.g [36], is ambiguous in Haldane’s familial selection. In diploid sexual populations, the parent population produces each juvenile genotype (see Table 1), since all genotypes produce other genotypes. For instance, in all families founded by two different homozygotes, all the offspring are heterozygotes. In other words, the principle of replicator dynamics, i.e. “i-type only from i-type”, does not hold when we focus on the frequency of genotypes. Moreover, an observer who can identify the different genotypes, can collect all information about natural selection. Thus in Haldane’s familial selection model the production of different genotypes is the key problem [23], and not the individual fitness (see genotype dynamics, Eq. (4) later). We note that when strict reproduction occurs (i.e. i-type only produces i-type), the individual fitness is calculated as the quotient of the total production of the i-type and the total number of i-type individuals. Thus, practically, the production rate is a more basic notion than the average production rate (i.e. individual fitness). Table 1 Genotype survival table based on the mating table, with phenotypes and Mendelian probabilities \({m}_{k(ij)}\) Full size tableThe direct application of inclusive fitness also depends on Haldane’s familial selection. There are three main reasons for that. 1. In the framework of Haldane’s familial selection model, the interaction takes place in families, so the benefit and cost of siblings depend only on the genotypes of their parents. The phenotypic composition of each family does not depend on the frequencies of the different parent genotypes in the whole population. Thus, the sib’s benefit and the sib’s cost within families are independent of the genotype frequencies in the whole population, and hence they are “independent” of the allele frequencies in the whole population, too. 2. In the present-day theory of kin selection, in terms of general Hamilton’s rule, the parameters of benefit \(\:b\) and cost \(\:c\) are functions of the allele frequencies [6]. In Haldane’s familial selection the average benefit/cost of the juvenile genotypes with respect to the whole population depends on the genotype distribution of the parental population. 3. Moreover, many parental genotype distributions have the same allele distribution. Thus, the allele distribution contains less information about the selection process than the genotype distribution. 4. The general definition of genetic relatedness is the regression of the genotypes of social partners on the genotype of the focal individual [37,38,39]. In the framework of Haldane’s familial selection under monogamy, the genetic relatedness is exactly ½ between interacting full siblings independently of the state of the whole population. 5. We are interested in the condition under which the rare mutant selfish allele cannot invade a resident altruistic homozygote population. When the mutant allele is rare enough, using the mean-'
