title = "The evolution of tenascins | BMC Ecology and Evolution | Full Text"
description = "Background The evolution of extracellular matrix is tightly linked to the evolution of organogenesis in metazoans. Tenascins are extracellular matrix glycoproteins of chordates that participate in integrin-signaling and morphogenetic events. Single tenascins are encoded by invertebrate chordates, and multiple tenascin paralogs are found in vertebrates (designated tenascin-C, tenascin-R, tenascin-W and tenascin-X) yet, overall, the evolution of this family has remained unclear. Results This study examines the genomes of hemichordates, cephalochordates, tunicates, agnathans, cartilaginous fishes, lobe-finned fishes, ray-finned fishes and representative tetrapods to identify predicted tenascin proteins. We comprehensively assess their evolutionary relationships by sequence conservation, molecular phylogeny and examination of conservation of synteny of the encoding genes. The resulting new evolutionary model posits the origin of tenascin in an ancestral chordate, with tenascin-C-like and tenascin-R-like paralogs emerging after a whole genome duplication event in an ancestral vertebrate. Tenascin-X appeared following a second round of whole genome duplication in an ancestral gnathostome, most likely from duplication of the gene encoding the tenascin-R homolog. The fourth gene, encoding tenascin-W (also known as tenascin-N), apparently arose from a local duplication of tenascin-R. Conclusions The diversity of tenascin paralogs observed in agnathans and gnathostomes has evolved through selective retention of novel genes that arose from a combination of whole genome and local duplication events. The evolutionary appearance of specific tenascin paralogs coincides with the appearance of vertebrate-specific cell and tissue types where the paralogs are abundantly expressed, such as the endocranium and facial skeleton (tenascin-C), an expanded central nervous system (tenascin-R), and bone (tenascin-W)."
full_description = "Research Open access Published: 14 September 2024 The evolution of tenascins Josephine C. Adams1 & Richard P. Tucker2 BMC Ecology and Evolution volume 24, Article number: 121 (2024) Cite this article 914 Accesses Metrics details AbstractBackgroundThe evolution of extracellular matrix is tightly linked to the evolution of organogenesis in metazoans. Tenascins are extracellular matrix glycoproteins of chordates that participate in integrin-signaling and morphogenetic events. Single tenascins are encoded by invertebrate chordates, and multiple tenascin paralogs are found in vertebrates (designated tenascin-C, tenascin-R, tenascin-W and tenascin-X) yet, overall, the evolution of this family has remained unclear.ResultsThis study examines the genomes of hemichordates, cephalochordates, tunicates, agnathans, cartilaginous fishes, lobe-finned fishes, ray-finned fishes and representative tetrapods to identify predicted tenascin proteins. We comprehensively assess their evolutionary relationships by sequence conservation, molecular phylogeny and examination of conservation of synteny of the encoding genes. The resulting new evolutionary model posits the origin of tenascin in an ancestral chordate, with tenascin-C-like and tenascin-R-like paralogs emerging after a whole genome duplication event in an ancestral vertebrate. Tenascin-X appeared following a second round of whole genome duplication in an ancestral gnathostome, most likely from duplication of the gene encoding the tenascin-R homolog. The fourth gene, encoding tenascin-W (also known as tenascin-N), apparently arose from a local duplication of tenascin-R.ConclusionsThe diversity of tenascin paralogs observed in agnathans and gnathostomes has evolved through selective retention of novel genes that arose from a combination of whole genome and local duplication events. The evolutionary appearance of specific tenascin paralogs coincides with the appearance of vertebrate-specific cell and tissue types where the paralogs are abundantly expressed, such as the endocranium and facial skeleton (tenascin-C), an expanded central nervous system (tenascin-R), and bone (tenascin-W). Peer Review reports BackgroundThe extracellular matrix (ECM) is a defining feature of the complex, multicellular tissues and organs of metazoans. While some of the families of ECM molecules that are best known from chordate models are present in modern sponges (Porifera; e.g., fibrillar and basement membrane collagens, laminins and thrombospondins), and thus have Precambrian origins, others are thought to have appeared during or just before the Cambrian radiation (estimated to have taken place approximately 538 million years ago) and are found only in chordates [1,2,3,4,5,6]. ECM molecules considered specific to Phylum Chordata include fibronectin and tenascins [7], which act as integrin ligands and participate in the regulation of morphogenetic events such as the migration of neural crest cells, the differentiation of dense connective tissue, the development of general immunity, and the maintenance of stem cell niches [8,9,10,11].Mammalian and avian genomes encode four tenascin paralogs: tenascin-C (TNC), tenascin-R (TNR), tenascin-W (TNW; also known as tenascin-N or TNN) and tenascin-X (TNX), all of which have a common domain architecture (Fig. 1A, B) [12]. An amino-terminal signal peptide directs each protein to the secretory pathway, and this is followed by a tenascin assembly domain comprised, in TNC, of a region that includes conserved cysteine residues followed by a short heptad-repeat region and additional conserved cysteine residues (Fig. 1C). TNC is secreted as hexabrachions that require inter-subunit disulfide bonds for assembly [13] and form rapidly [14]. By expression of assembly domain recombinant proteins in Escherichia coli, TNC oligomerization was shown to be a two-step process, involving trimerization by the heptad-repeat region with stabilization by cysteines C-111 and C-113 [14] followed by cross-linking of two trimers into the hexamer, in which C-64 has a critical role [15, 16]. TNW also assembles into six-armed hexabrachions [17, 18], whereas TNR appears as trimers [19, 20]. Purified chicken TNX is a monomer when viewed in the electron microscope [21], although recombinant expression of TNX in HEK293 cells resulted in detection of trimers [22]. The tenascin assembly region is followed by one or more epidermal growth factor (EGF)-like domains and tandem repeated fibronectin-type 3 (FN3) domains. A single fibrinogen-related domain (FReD) is found at the carboxy terminus. The EGF-like domains of tenascins have distinctive spacing between conserved cysteine and glycine residues (xC[x]3C[x]5C[x]4-6CxC[x]5G[x]2Cx, where x is any amino acid) that set them apart from other members of this domain family. FN3 domains are often encoded on a single exon, which appears to contribute to a broad range in their number in orthologous tenascins across species belonging to the same phylogenetic family [12], as well as the potential for functional diversity through alternative splicing [8, 23].Fig. 1A. Schematic depiction of tenascin domain architecture from Homo sapiens. The four tenascin paralogs, tenascin-C (TNC), tenascin-R (TNR), tenascin-W (TNW) and tenascin-XB (TNXB), each has a signal peptide (sp) and heptad repeats that form a coiled-coil (c-c), followed by tenascin-type epidermal growth factor (EGF)-like domains, fibronectin type 3 (FN3) domains, and a C-terminal fibrinogen-related domain. Potential integrin-binding tripeptide amino acid motifs in the FN3 domains are indicated. B. The domain organization of the four tenascin paralogs found in the chicken Gallus gallus. P-rich = proline-rich. C. Schematic representation of the N-terminal region of H. sapiens TNC, showing signal peptide (sp), tenascin assembly domain with location of cysteine residues implicated in forming or stabilizing multimers and heptad repeats, and first EGF-like domain. D. The third FN3 domain of H. sapiens TNC is formed by seven β strands lettered A through G. (adapted from [116]). The integrin-binding motif arginine-glycine-aspartic acid (RGD) is present in an exposed loop between β strands F and G, and the integrin-binding motif isoleucine-aspartic acid-glycine (IDG) is present in an exposed loop between β strands B and C. The integrin receptors that recognize these motifs are indicatedFull size imageLike fibronectin, some tenascins are ligands that interact with ECM integrin receptors via short amino acid motifs found in exposed loops between β strands in their FN3 domains (Fig. 1D). The best studied of these is the arginine-glycine-aspartic acid (RGD) motif found in the loop between β strands F and G of the third FN3 of TNC, which can interact with α8β1, αvβ6 and αvβ3 integrins [24]. An isoleucine-aspartic acid-glycine (IDG) motif in the loop between β strands B and C, also in the third FN3 of TNC, binds to α9β1 integrin (Fig. 1D) [25]. Similar exposed motifs are found in FN3 domains of TNW, and there is some experimental evidence that these also participate in integrin recognition [18]. Function-blocking antibodies to β1 integrin inhibit the proliferative effect of recombinant FN3 domains of TNR on cultured neural stem cells [26], but the specific region in TNR that interacts with the integrin has yet to be mapped. The amino acid sequence of the FReD is well conserved across the four paralogs [27]. There is experimental evidence that the FReD can also bind to integrins [28, 29], and that it acts as a ligand for Toll-like receptor 4 [30].TNC was the first member of the tenascin gene family to be discovered and is also the best studied [8, 31, 32]. TNC plays roles in branching morphogenesis and the differentiation and migration of many cell types, especially in the nervous system. It is more widely distributed during embryonic development than in the adult, but it persists in some dense connective tissues and stem cell niches [9] and reappears during chronic inflammation and tumorigenesis [33]. TNR expression is limited to the nervous system and suprarenal glands, and studies with TNR knockout mice point to an important role for this tenascin in neurogenesis and the maintenance of perineuronal nets [34]. Immunohistochemistry reveals TNW in a subset of the ECM where TNC is also found, but it is most abundant in bone [35]. In vitro, TNW can promote the development of bone [36], and the tnn knockout mouse (the official gene names for TNW in humans and mouse are Tnn and tnn, respectively) has defects in alveolar bone and incisor remodeling [37]. Finally, TNX is found primarily in skeletal muscle and loose connective tissue [38] where it can bind to type I collagen and influence collagen fibril formation [39]. Mutations in TNX are linked to Ehlers-Danlos Syndrome [40].Our previous work addressing the evolution of tenascins showed that a tenascin is present in the tunicate Ciona intestinalis [12] and in a cephalochordate, Branchiostoma floridae [41]. Whereas these species each have a single tenascin-encoding gene, two tenascin genes are present in the cartilaginous ghost shark Callorhincus milii, and the encoded proteins are most closely related to to tetrapod TNC and TNR [7]. At the time these studies were carried out, no tenascin could be identified in the echinoderm, Strongylocentrotus purpuratus, suggestive of a possible chordate-specific origin of tenascins.With the benefit of a greater number of sequenced genomes and transcriptomes from non-chordate deuterostomes and early diverging chordate species, the goal of the current study was to examine the origin of tenascins and make an in-depth assessment of the molecular evolution of tenascins. To achieve this, genomes of echinoderms, hemichordates and a xenacoelomorph were examined for encoding of possible tenascin-like proteins, and predicted amino acid sequences of tenascins were identified from diverse members of Phylum Chordata, with emphasis on the recently sequenced and assembled genomes of agnathans, sharks and rays, along with species of lobe-finned and ray-finned fishes. Many of these have undergone multiple rounds of whole genome duplication (WGD) that occurred separately from the two rounds of WGD associated with the base of the vertebrate lineage [42]. In our study, tenascins were first identified by protein sequence characteristics and domain organization, and the assembly domain and potential integrin recognition motifs were analyzed in detail. Phylogenetic tree analysis of the FReDs was used to further examine relationships of the tenascin family members and to inform models of tenascin evolution. The identification and evolutionary relationships of tenascin family members were also examined by criteria of synteny. Identification of conservation of synteny (i.e., conservation of linkage of orthologous gene loci in different species, notwithstanding the exact gene order on a chromosome or assembled genomic region, or inclusion of non-conserved intervening genes) is an effective independent method to examine evolutionary relationships in multi-gene families [43] and also informed the evolutionary model presented herein.MethodsAssembled genomesThe assembled genomes of the following species were analyzed for tenascins and syntenic relationships with tenascin genes (see Results for additional citations): Acipenser ruthenus Sterlet, NCBI Assembly ASM1064508v2 [44]; Amblyraja radiata Thorny skate, NCBI Assembly sAmbRad1.1.pri; Anolis carolinensis Green anole, NCBI Assembly AnoCar2.0 [45]; Branchiostoma belcheri Belcher’s lancelet, NCBI Assembly Haploidv18h27 [46]; Branchiostoma floridae Florida lancelet, NCBI Assembly Bfl_VNyyK [47]; Branchiostoma lanceolatum Amphioxus, NCBI Assembly BraLan3 [48]; Callorhinchus milii Elephant (ghost) shark, NCBI Assembly IMCB_Cmil_1.0 [49]; Carcharodon carcharias Great white shark, NCBI Assembly sCarCar2.pri; Ciona intestinalis Vase tunicate, NCBI Assembly KH [50]; Danio rerio Zebrafish, NCBI Assembly GRCz11 [51]; Eptatretus burgeri Inshore hagfish, eEnsembl Assembly Eburgeri_3.2 (submitted by the Riken Center For Development Biology); Gallus gallus Chicken, NCBI Assembly bGalGal1.mat.broiler.GRCg7b [52]; Homo sapiens Human, NCBI Assembly GRCh37.p13 [53]; Latimeria chalumnae Coelacanth, NCBI Assembly fLatCha1.pri, Annotation Release GCF_037176945.1-RS_2024_04; Lytechinus pictus Painted urchin, NCBI Assembly UCSD_Lpic_2.1; Lytechinus variegatus Green sea urchin, NCBI Assembly Lvar_3.0; Mus musculus House mouse, NCBI Assembly GRCm39 [54]; Oikopleura dioica Pelagic tunicate sp., NCBI Assembly OKI2018_I68_1.0 [55]; Oncorhynchus tshawytscha Chinook salmon, NCBI Assembly Otsh_v2.0 [56]; Petromyzon marinus Sea lamprey, NCBI Assembly kPetMar1.pri [57]; Pleurodeles waltl Iberian ribbed newt, NCBI Assembly ASM2665232v1 [58]; Polyodon spathula Mississippi (American) paddlefish, NCBI Assembly ASM1765450v1 [59]; Polypterus senegalus Gray (Senegal) bichir, NCBI Assembly ASM1683550v1 [60]; Protopterus annectens West African lungfish, NCBI Assembly PAN1.0; Rhincodon typus Whale shark, NCBI Assembly sRhiTyp1.1; Saccoglossus kowalevskii Acorn worm sp., NCBI Assembly Skow_1.1 [61]; Scyliorhinus canicula Small-spotted catshark, NCBI Assembly sScyCan1.1; Stegostoma fasciatum/tigrinum Zebra shark, NCBI Assembly sSteTig4.hap1; Strongylocentrotus purpuratus Purple sea urchin, NCBI Assembly Spur_5.0; Thunnus maccoyii Southern bluefin tuna, NCBI Assembly fThuMac1.1 [62]; Xenopus laevis African clawed frog, NCBI Assembly Xenopus_laevis_v10.1 [63]; Xenopus tropicalis Tropical clawed frog, NCBI Assembly UCB_Xtro_10.0 [64].Programs, search tools and phylogenetic treesThe following tasks were performed with these programs. Genome data browsers: NCBI genome data viewer (https://www.ncbi.nlm.nih.gov/genome/gdv/) [65], eEnsembl genome browser (https://www.ensembl.org) [66]; phylogenetic tree makers and viewers: EMBL Toolkit (http://etetoolkit.org/treeview/) [67], Centre National de la Recherche Scientifique (http://www.phylogeny.fr/advanced.cgi) (https://ngphylogeny.fr/) [68], T-REX (http://www.trex.uqam.ca/index.php) [69]; protein domain identification: SMART (http://smart.embl-heidelberg.de/) [70]; InterPro 98.0 (https://www.ebi.ac.uk/interpro/search/sequence/) [71]; Sequence LOGOs were generated from MUSCLE sequence alignments in WebLogo 3 (https://weblogo.threeplusone.com) [72]; coiled-coil prediction: Marcoil, Multicoil2, Ncoils, Parcoil2 (https://waggawagga.motorprotein.de/) [73]; secondary structure prediction: J Pred 4 (https://www.compbio.dundee.ac.uk/jpred/) [74]; protein blast: NCBI blastp (https://blast.ncbi.nlm.nih.gov/Blast.cgi) [75]; multiple sequence alignment by MUSCLE version 3.8.31, with ClustalW output format [76]: EMBL EBI (https://www.ebi.ac.uk/jdispatcher/msa/muscle) [77]; Protein expression tool: (https://www.xenbase.org/xenbase/) [78].To construct phylogenetic trees at NGPhylogeny.fr (see above) files were uploaded in FASTA format a"
