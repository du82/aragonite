title = "Population connectivity and size reductions in the Anthropocene: the consequence of landscapes and historical bottlenecks in white forsythia fragmented habitats | BMC Ecology and Evolution | Full Text"
description = "Background White forsythia (Abeliophyllum distichum) is an endangered Korean Peninsula endemic that has been subjected to recent population genomics studies using SNPs via RAD sequencing. Here, we primarily employed the often underutilized haplotype information from RAD loci to further describe the species’ previously uninvestigated haplotype-based genomic variation and structure, and genetic-geographic characteristics and gene flow patterns among its five earlier identified genetic groups. We also inferred the time of past events that may have impacted the effective population size of these groups, as well as the species’ potential future distribution amidst the warming climate and anthropogenic threats. Results Our findings emphasized the recognition of the species’ regional patterns of genetic structure, and the role of topography and its associated gene flow patterns as some of the possible factors that may have influenced the species’ present-day fragmented population distribution. The inferred bottleneck events during the Anthropocene, some of which aligned with the time of historical catastrophic events on the Peninsula (e.g., the Korean War), were revealed to have contributed to the generally low effective population size of its five lineages, particularly those with marginal distributional range. Future distribution under both optimistic and pessimistic climatic scenarios suggests unlikely suitable habitats for these populations to expand from their current range limits, at least in the next 80 years. Conclusions The small effective population size and landscape-driven limited gene flow among white forsythia populations will remain a big challenge for the conservation management of the species’ already fragmented population distribution. To help mitigate these impacts, the merging of various research approaches and the use of genomic data to their full potential is recommended to provide the optimized knowledge-based tools for the conservation of this endangered species, and other similar plants under pressure."
full_description = "Research Open access Published: 10 October 2024 Population connectivity and size reductions in the Anthropocene: the consequence of landscapes and historical bottlenecks in white forsythia fragmented habitats Homervergel G. Ong1, Eui‑Kwon Jung2, Yong‑In Kim3, Jung‑Hoon Lee3, Bo‑Yun Kim4, Dae-Hyun Kang5, Jae-Seo Shin2 & …Young‑Dong Kim1,2 Show authors BMC Ecology and Evolution volume 24, Article number: 123 (2024) Cite this article 793 Accesses Metrics details AbstractBackgroundWhite forsythia (Abeliophyllum distichum) is an endangered Korean Peninsula endemic that has been subjected to recent population genomics studies using SNPs via RAD sequencing. Here, we primarily employed the often underutilized haplotype information from RAD loci to further describe the species’ previously uninvestigated haplotype-based genomic variation and structure, and genetic-geographic characteristics and gene flow patterns among its five earlier identified genetic groups. We also inferred the time of past events that may have impacted the effective population size of these groups, as well as the species’ potential future distribution amidst the warming climate and anthropogenic threats.ResultsOur findings emphasized the recognition of the species’ regional patterns of genetic structure, and the role of topography and its associated gene flow patterns as some of the possible factors that may have influenced the species’ present-day fragmented population distribution. The inferred bottleneck events during the Anthropocene, some of which aligned with the time of historical catastrophic events on the Peninsula (e.g., the Korean War), were revealed to have contributed to the generally low effective population size of its five lineages, particularly those with marginal distributional range. Future distribution under both optimistic and pessimistic climatic scenarios suggests unlikely suitable habitats for these populations to expand from their current range limits, at least in the next 80 years.ConclusionsThe small effective population size and landscape-driven limited gene flow among white forsythia populations will remain a big challenge for the conservation management of the species’ already fragmented population distribution. To help mitigate these impacts, the merging of various research approaches and the use of genomic data to their full potential is recommended to provide the optimized knowledge-based tools for the conservation of this endangered species, and other similar plants under pressure. Peer Review reports BackgroundNaturally occurring fragmented plant distributions are not uncommon and can be widely spread around the world at varying limits and scales [1]. In this type of natural system, habitat suitability, landscape connectivity, and environmental selective pressures are just some of the factors that influence the patterns of gene flow, and therefore, contemporary population structure (e.g., [2,3,4,5,6]). Because of the stationary or less mobile life characteristics of plants, their habitat distribution suggests genetic structure that has been more generally impacted by time and geographic space [7, 8].Habitat fragmentation, however, reduces genetic variation and among-population gene flow due to increased isolation and random genetic drift [9,10,11]. The conversion of natural environments into anthropogenic landscapes, for instance, contributes to the further isolation of species populations, resulting in interpopulation connectivity loss, and lowered fitness and capacity for adaptation, henceforth, their higher risks of extinction [11,12,13].The increasing anthropogenic disturbance of the natural environment has reached such high magnitudes that scientists have proposed a new geological epoch coined the Anthropocene [14]. Whether this era began with industrialization in the 1800s [14,15,16] or a few thousand years ago with the emergence of agriculture [17, 18], experts seem to agree that this period is consistently characterized by a significant increase in human influence on biological and geochemical processes at a global scale. The Anthropocene has brought negative repercussions to species’ habitats, ecosystems, and biodiversity; all of which are due to man’s desire for socio-economic improvement (e.g., agriculture, industrialization, and urbanization) [17], and even geopolitical power (e.g., war, colonization) [19]. With increased anthropogenic pressures and global temperatures, small and fragmented plant populations face an elevated risk of extinction, especially if species are unable to shift their distributional range (e.g., to move higher in altitude and latitude), or if, albeit ironic, no man-made conservation measures are implemented [20, 21].In this study, we investigated the effects of historical events on the change in population size of the endangered Korean flowering plant white forsythia. We also looked into the role of geography and gene flow to the species’ patchy population distribution on the Korean Peninsula (KP) (Fig. 1), a geopolitical region that has undergone rapid changes within the past three-quarters of a century since its civil war (i.e., the Korean War 1950–1953).Fig. 1Natural population distribution (circles) of white forsythia (inset) on the KP. White circles (labeled) represent the nine sampled sites from which genetic and geographic data for molecular analyses were obtained. Black circles represent 15 additional (of 24 total) occurrence data for ecological niche modeling. The polygon of broken gray line marks the calibration area for the latter analysis, while the solid light gray lines represent the chain and branches of the Baekdudaegan Mountain Range [22]Full size imageWhite forsythia (Abeliophyllum distichum Nakai) is a rare Oleaceae shrub that naturally grows on well-drained, rocky mountain slopes in the central regions of the KP. Some of the species’ wild populations are South Korea’s natural monuments, which are small, protected habitats that carry important scientific and cultural value to the country [23, 24]. Although endemic to the Peninsula, white forsythia is also a known ornamental plant in America and Europe, where it was first introduced to the horticultural community after its discovery in 1919 [25, 26]. However, it was only much later that this early-spring blooming shrub began to attract the attention of local plant collectors, and unfortunately poachers, all happening at a time when the country was also entering its period of industrial revolution. Eventually, over-collection destroyed some of the species’ wild habitats, including one that had been originally declared a natural monument [26, 27]. As such, white forsythia became one of the first Korean endemics to receive a formal recovery plan and became a model species for conservation in South Korea [25, 26]. The current natural state of existence of white forsythia in North Korea, however, may be in question, because the last time it was confirmed to naturally occur in the reclusive country was way back in the 1930s [26, 28]. At the latest, the species is either listed as ‘endangered’ by the Korean National Arboretum [29], or ‘vulnerable’ by the National Institute of Biological Resources [30] in South Korea.Population genetic studies that were foundational in the molecular aspect of white forsythia conservation can be traced back to the late 1990s, with the use of allozyme markers (e.g., [31,32,33]). With the application of a more modern reduced-representation of genome method via restriction-site associated DNA (RAD) sequencing (e.g., GBS), range-wide population genomic and phylogeographic studies using single nucleotide polymorphisms (SNPs) were able to further elucidate the species’ genetic structure and variation patterns [34] and define its five genetic lineages and their history of divergence [35].In this study, we attempt to provide new insights into the demographic history of each of these five white forsythia lineages (with the use of SNPs), as well as the influence of physical landscapes on their distribution and genetic differentiation. Our primary intention, however, was to employ the often-untapped haplotype information from RAD loci, here defined as markers of short nucleotide sequence following RAD sequencing and related bioinformatics protocols (see Methods) to further investigate other measures of population genetic variation and structure not evaluated in earlier studies (i.e., [34, 35]). Using the physically linked variants/SNPs contained in RAD loci, we also aimed to examine the population connectivity patterns among the species’ genetic groups. This type of marker has been effectively applied to some non-model species population genomic studies (e.g., [36,37,38,39,40]) due to its potential to improve the estimation of population parameters (e.g., demography and gene flow) of relevance to conservation [41].Specifically, our goals were: (i) to determine the species’ haplotype diversity and fine-scale population genetic structure using RAD markers, (ii) to define population boundaries using the species’ genetic and geographic information, (iii) to infer the effective population size in each of the five lineages and the time when the change(s) occurred, (iv) to infer migration patterns between/among the lineages, and (v) to predict the species’ suitable habitats under different future climatic scenarios.ResultsGenomic variation and structure based on RAD lociRAD-based haplotype variation in nine white forsythia populations revealed a generally low and narrow range of within-population pairwise nucleotide diversity pi (π), with a mean of 0.00018. The lowest was recorded from the NORTHERN YJ population (π = 0.00014), while the highest was from the SOUTHERN BA-NM370a (π = 0.00022) (Table 1). All sampled sites showed the presence of private alleles, except those from the UPPER-CENTRAL lineage (GS-NM147 and GS-NM221). The number of private alleles was found highest for the marginal populations NORTHERN YJ and EASTERN AD, each with 43 and 41, respectively. As also shown in Table 1, Tajima's D (D) was positive for all sampled locations, with the two UPPER-CENTRAL populations (GS-NM147 and GS-NM221) recording the lowest values (D = 0.053 and D = 0.187, respectively). The highest Tajima’s D was recorded from the NORTHERN YJ population (D = 1.123), which is nearly double that of the second-highest EASTERN AD (D = 0.727). Table 1 Population information and RAD loci-based genetic variationFull size tableWhen between-population haplotype differentiation results are compared (Table 2), the highest pairwise PhiST (ΦST) was recorded between the marginal population pairs NORTHERN YJ and EASTERN AD (ΦST = 0.393), and between NORTHERN YJ and SOUTHERN BA-NM370b (ΦST = 0.394). The lowest PhiST was revealed between the two UPPER-CENTRAL populations GS-NM147 and GS-NM221 (ΦST = 0.054). As also shown in Table 2, the absolute measure of between-population locus divergence (DXY) was highest between the NORTHERN YJ and EASTERN AD populations (DXY = 0.00287), and between the former and the SOUTHERN BA-NM370b (DXY = 0.00284), while the lowest was found between the two UPPER-CENTRAL populations GS-NM147 and GS-NM221 (DXY = 0.00143). Table 2 Pairwise population comparison of RAD-based PhiST (below diagonal) and DXY (above diagonal). The lowest and highest values are in boldFull size tablePopulation assignment and genomic structure of samples in fineRADstructure (Fig. 2) generally grouped white forsythia samples according to their regional geographic distributions (i.e., into clusters of central and marginal population identities). When examined more locally, all individuals clustered based on their sampled locations (except those in UPPER-CENTRAL populations GS-NM147 and GS-NM221), despite not having been assigned to any a priori grouping. The plot showed particularly high levels of co-ancestry among respective members of the marginal EASTERN, NORTHERN, and SOUTHERN lineages by clearly grouping them into dark-colored blocks. Even within the SOUTHERN lineage, individuals from BA-NM370a and BA-NM370b populations displayed higher degrees of co-ancestry coefficients than average (Fig. 2). Substantial population sub-structuring was also visually evident among the three populations of the LOWER-CENTRAL lineage (YD-NM364, YD, and OC). The weakest genomic structure was reflected among the samples of the two UPPER-CENTRAL populations (GS-NM147 and GS-NM221), appearing to be indistinguishable from one another in one large block.Fig. 2Co-ancestry matrix between each pair (pixel) of 131 white forsythia samples in fineRADstructure, indicating membership assignment according to their color-coded sampled population (left) or lineage (below) and associated clades (above). The color scale (right) shows the strength of co-ancestry coefficients from low (yellow) to high (approaching black). The asterisks (*) indicate individuals assigned to population(s) other than their sampled location (i.e., GS-NM221 samples in GS-NM147 population block)Full size imageGenetic-geographic barriers to gene flowOur Procrustes analyses of genotype information (i.e., genetic matrix in PC space) and sampling locations (i.e., geographic matrix in physical map) showed a very significantly positive correlation in a symmetric rotation (t0 = 0.891, p < 0.001). Most genotypes, particularly those from the centrally distributed UPPER-CENTRAL (GS-NM147 and GS-NM221), and LOWER-CENTRAL (YD-NM364, YD, and OC) lineages were shown to have been plotted near their respective sampled sites, as indicated by the population-connecting arrows with relatively shorter shafts (Fig. 3). Only the genotypes from the NORTHERN YJ, and to some degree the EASTERN AD, appeared to have the strongest deviation from their respective geographic locations (Fig. 3). The Monmonier analysis using the Delaunay triangulation method (Fig. 4), on the other hand, detected a semi-radial genetic-geographic barrier that appears to have isolated the members of the core central distribution from the marginal ones.Fig. 3Procrustes adjustment plot showing the PC-rotated white forsythia genotypes (color-coded circles) against their sampled geographic locations (color-coded triangles). The length and direction of the arrows that connect the genotypes to their sampled locations suggest the degree of deviation/deformation of the former from the latterFull size imageFig. 4Genetic barrier (blue) in white forsythia sampled populations (white circles) after an optimized Monmonier analysis via the Delaunay triangulation method. For reference, subsidiary mountain ranges in the map are labeled. Populations: GS-NM147 (1), GS-NM221 (2), YD-NM364 (3), YD (4), OC (5), BA-NM370a (6), BA-NM370b (7), AD (8), and YJ (9)Full size imageHistorical gene flow patternsAmong the seven proposed migration models, our MIGRATE-N inference singled out the Isolated-SOUTHERN Migration model as the most likely gene flow pattern for white forsyth"
