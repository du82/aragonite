title = "Phylogeny and species delimitation of ciliates in the genus Spirostomum (class Heterotrichea) using single-cell transcriptomes | BMC Ecology and Evolution | Full Text"
description = "Background Ciliates are single-celled microbial eukaryotes that diverged from other eukaryotic lineages more than a billion years ago. The long evolutionary timespan of ciliates has led to enormous genetic and phenotypic changes, contributing significantly to their high level of diversity. Recent analyses based on molecular data have revealed numerous cases of cryptic species complexes in different ciliate lineages, demonstrating the need for a robust approach to delimit species boundaries and elucidate phylogenetic relationships. Species of the genus Spirostomum are difficult to identify due to the lack of distinctive morphological characters. Previous molecular studies have focused on only a few loci, namely the nuclear ribosomal RNA genes, alpha-tubulin, and mitochondrial CO1, suggesting the presence of several cryptic Spirostomum species. In this study, we increased taxon sampling and obtained single-cell transcriptomes of 25 Spirostomum specimens (representing six morphospecies) sampled from South Korea and the USA. We evaluated the utility of the transcriptomic data by constructing species trees using concatenation and coalescent-based methods. In addition, we used neighbor-net network analysis to visualize and quantify potential phylogenetic conflicts within the concatenated dataset. Furthermore, coalescent-based species delimitation was performed with transcriptomic data to define the species boundaries within the genus Spirostomum. Results Phylogenomic analysis of 37 Spirostomum specimens (25 newly generated transcriptomes and 12 from GenBank) and 265 protein-coding genes provides robust insight into the evolutionary relationships among Spirostomum species. Our results confirm that species with moniliform and compact macronucleus each form a distinct monophyletic lineage, with the compact macronucleus likely representing the ancestral state, while the moniliform macronucleus being a derived trait. Furthermore, our analyses suggest that ancestral polymorphism and rapid radiation may have shaped the genetic diversity and evolutionary history of Spirostomum, and the S. minus-like appearance represents the ancestral state of the species with a moniliform macronucleus. Therefore, the S. minus-like species share ancestral morphological traits and cannot be morphologically delimited. The multispecies coalescent (MSC) model suggests that two cryptic species from each of S. minus, S. ambiguum, S. subtilis, S. teres, and S. aff. minus represent distinct lineages within the genus Spirostomum. We also provide a workflow for reconstructing nuclear ribosomal RNA gene sequences from transcriptome sequences using a read mapping approach, and compare different mapping methods to reconstruct reliable contigs. Conclusion Our sampling of closely related Spirostomum populations and comprehensive single-cell RNA sequencing (scRNA-seq) data allowed us to reveal the hidden crypticity of species within the genus Spirostomum and to resolve and provide much stronger support than hitherto to the phylogeny of this model ciliate genus."
full_description = "Research Open access Published: 27 February 2025 Phylogeny and species delimitation of ciliates in the genus Spirostomum (class Heterotrichea) using single-cell transcriptomes Shahed Uddin Ahmed Shazib1,2,4,5, Auden Cote-L’Heureux2, Ragib Ahsan1,2,3, Sergio A. Muñoz-Gómez4,5, JunMo Lee6,7, Laura A. Katz2,3 & …Mann Kyoon Shin1 Show authors BMC Ecology and Evolution volume 25, Article number: 17 (2025) Cite this article 51 Accesses 2 Altmetric Metrics details AbstractBackgroundCiliates are single-celled microbial eukaryotes that diverged from other eukaryotic lineages more than a billion years ago. The long evolutionary timespan of ciliates has led to enormous genetic and phenotypic changes, contributing significantly to their high level of diversity. Recent analyses based on molecular data have revealed numerous cases of cryptic species complexes in different ciliate lineages, demonstrating the need for a robust approach to delimit species boundaries and elucidate phylogenetic relationships. Species of the genus Spirostomum are difficult to identify due to the lack of distinctive morphological characters. Previous molecular studies have focused on only a few loci, namely the nuclear ribosomal RNA genes, alpha-tubulin, and mitochondrial CO1, suggesting the presence of several cryptic Spirostomum species. In this study, we increased taxon sampling and obtained single-cell transcriptomes of 25 Spirostomum specimens (representing six morphospecies) sampled from South Korea and the USA. We evaluated the utility of the transcriptomic data by constructing species trees using concatenation and coalescent-based methods. In addition, we used neighbor-net network analysis to visualize and quantify potential phylogenetic conflicts within the concatenated dataset. Furthermore, coalescent-based species delimitation was performed with transcriptomic data to define the species boundaries within the genus Spirostomum.ResultsPhylogenomic analysis of 37 Spirostomum specimens (25 newly generated transcriptomes and 12 from GenBank) and 265 protein-coding genes provides robust insight into the evolutionary relationships among Spirostomum species. Our results confirm that species with moniliform and compact macronucleus each form a distinct monophyletic lineage, with the compact macronucleus likely representing the ancestral state, while the moniliform macronucleus being a derived trait. Furthermore, our analyses suggest that ancestral polymorphism and rapid radiation may have shaped the genetic diversity and evolutionary history of Spirostomum, and the S. minus-like appearance represents the ancestral state of the species with a moniliform macronucleus. Therefore, the S. minus-like species share ancestral morphological traits and cannot be morphologically delimited. The multispecies coalescent (MSC) model suggests that two cryptic species from each of S. minus, S. ambiguum, S. subtilis, S. teres, and S. aff. minus represent distinct lineages within the genus Spirostomum. We also provide a workflow for reconstructing nuclear ribosomal RNA gene sequences from transcriptome sequences using a read mapping approach, and compare different mapping methods to reconstruct reliable contigs.ConclusionOur sampling of closely related Spirostomum populations and comprehensive single-cell RNA sequencing (scRNA-seq) data allowed us to reveal the hidden crypticity of species within the genus Spirostomum and to resolve and provide much stronger support than hitherto to the phylogeny of this model ciliate genus. Peer Review reports BackgroundCiliates are among the most diverse clades of eukaryotes and are an essential component in aquatic and terrestrial food webs [1,2,3,4]. They are some of the most complex single-celled eukaryotes in terms of their cell structure and have even more intricate genomic architectures than multicellular eukaryotes. Ciliates of the genus Spirostomum Ehrenberg, 1834 (Class: Heterotrichea) are large cells (150–4,000 μm in length) that inhabit fresh and brackish water [5,6,7,8]. The genus Spirostomum comprises ten morphospecies characterized by a vermiform, cylindrical, and laterally flattened cell; ciliary rows that spiral during contraction; and a long collecting canal leading to a posterior contractile vacuole [9,10,11,12,13,14,15]. These “worm-like” ciliates are considered model organisms for studying ciliate ecology and physiology due to their relative abundance and sensitivity to abiotic factors [7, 16, 17]. It was recently reported that many Spirostomum species use a rhodoquinone-dependent pathway under low oxygen conditions for anaerobic fumarate reduction [18, 19]. Spirostomum species are suitable for endosymbiosis research as they can harbor either or both bacteria and eukaryotes in their cytoplasm [20]. Several Rhizobiales and Rickettsiales-like bacteria have been found in Spirostomum species; S. semivirescens is the only Spirostomum species reported to host Chlorella-like endosymbiotic green algae [18, 21,22,23,24,25]. A unique endosymbiotic system was also found in Pseudoblepharisma, which is phylogenetically sister and morphologically similar to Spirostomum. More specifically, P. tenue harbors contrasting photosynthetic symbionts in its cytoplasm, purple bacteria and green algae [26, 27]. Therefore, understanding the evolution of Spirostomum species is also key to shedding light on the evolution of the extraordinarily rare purple-green photosymbiosis of P. tenue.Several authors have previously attempted to resolve the phylogenetic relationships in the genus Spirostomum using morphological characters and a single or a few genes [10,11,12,13,14]. These single- and multigene analyses suggested the presence of cryptic species within the genus Spirostomum. For example, S. minus exhibits considerable diversity at the molecular level and may contain at least two morphologically indistinguishable cryptic species. Spirostomum teres also appears to showcase species crypticity, and has further been claimed to be a polyphyletic taxon [11, 13]. Nuclear ribosomal RNA gene sequences may not have enough phylogenetic signals to reveal species boundaries, which were not unambiguously resolved at the molecular level using both the primary and secondary structures of the rRNA gene sequences [12]. In our recent work, we increased the taxon sampling and used two protein-coding genes, e.g., nuclear alpha-tubulin and mitochondrial cytochrome c oxidase subunit 1 (CO1), to delimit Spirostomum species [13]. We also used the Bayesian multispecies coalescent (MSC) model to estimate a species tree, which allowed us to resolve the phylogenetic relationships between Spirostomum species and delimit species based on molecular data. In the present study, we improved the taxon sampling, utilized transcriptomic data information from 37 Spirostomum specimens, and used the MSC model to further understand the species complex structure and the evolutionary relationships within the genus Spirostomum.Here, we generated 25 new single-cell transcriptomes from Spirostomum specimens collected from freshwater and brackish water environments in South Korea and the USA. We used these, together with 12 additional publicly available transcriptomes, belonging to seven morphospecies (S. ambiguum, S. caudatum, S. minus, S. teres, S. semivirescens, S. subtilis, and S. yagiui), to infer a robust phylogenetic tree and investigate the species boundaries of the genus Spirostomum. To do this, we performed concatenation- and coalescent-based analyses on a dataset that encompasses 37 Spirostomum specimens and 265 protein-coding genes. We also assembled a pipeline to reconstruct the nuclear 18S rRNA gene, ITS1-5.8S-ITS2 region, and 28S rRNA gene from transcriptomic data, and constructed the rRNA operon gene tree with improved taxon sampling to confirm the broad topological framework. Our study represents the first attempt to understand the phylogeny and species boundaries of the genus Spirostomum using single-cell transcriptome data.Materials and methodsSample collection, isolation, and culturingSamples were collected from various sites, including fresh and brackish waters (Table 1). After transportation to the laboratory, the collected samples were immediately stored in a cool box and examined directly under a dissecting microscope. Single cells of each ciliate morphospecies were isolated, washed in sterile distilled water, and used to establish new cultures. The cultures were maintained at 20–24 °C in Petri dishes, and wheat grains were periodically added to stimulate the growth of prey bacteria. Culture dishes contained filtered in situ water or commercial mineral water (Evian, France) for freshwater species, and sterile seawater for brackish water species. Specimens from each clonal culture were examined under a light microscope, using bright-field and differential interference contrast (DIC) optics (Axio Imager A1; Carl Zeiss, Germany). Species characterization and identification were performed according to the following guidelines [11,12,13,14, 28,29,30] (Additional file 1: Fig. S1).Table 1 Summary of Spirostomum species and transcriptomes included in the present workFull size tableSingle-cell preparationSingle cells were isolated using a capillary glass pipette under a dissecting microscope. The cells were washed three times in sterile distilled water through successive transfers in PYREX 6-well depression plates, thereby diluting the original medium and removing eukaryotic and bacterial contaminants. Ciliates from brackish water habitats were washed three times in sterile in situ water. In the final step, cells were washed with distilled water and transferred to 1.5 mL microcentrifuge tubes for DNA extraction and 0.2 mL PCR tubes for single-cell transcriptome amplification. Cells were frozen at − 80 °C or processed immediately.Single-cell DNA extractionDNA was extracted using the RED Extract-N-Amp Tissue PCR Kit (Sigma, St. Louis, MO) following the protocol of Shazib et al. [13]. The nuclear 18S rRNA gene, ITS1-5.8S-ITS2 region, and 28S rRNA gene were amplified by polymerase chain reaction (PCR) using the TaKaRa Ex Taq polymerase kit (TaKaRa Korea Biomedical Inc., Seoul, South Korea). Polymerase chain reaction (PCR) cycling parameters and primer information were described in Shazib et al. [13]. Products of PCR reactions were directly sequenced on an ABI 3730 automated sequencer (Macrogen Inc., Seoul, South Korea) using seven sequencing primers (Additional file 2: Table S1). Sequence fragments from individual samples were checked, trimmed, and assembled into contigs using Geneious ver. Prime 2019 (Biomatters, http://www.geneious.com/) [31].Single-cell transcriptomesSingle-cell whole transcriptome amplifications (scWTA) were performed from frozen cells (− 80 °C) or cells freshly picked from the clonal cultures. Whole transcriptome amplifications (WTAs) for the individual ciliates were generated according to the Smart-seq2 protocol [32] and SMART-Seq v4 Ultra Low Input RNA Kit (TaKaRa Bio-medicals, Seoul, South Korea) with 17 cycles of cDNA amplification for each cell. In principle, both methods are selective for polyadenylated RNA, which allows the generation of full-length cDNA. After transcriptome amplification, cDNA was further purified using the ProNex® Size-Selective Purification System (Promega, WI, USA) according to the manufacturer’s protocol. Following ProNex® purification, samples were quantified using a Qubit 2.0 Fluorometer (Thermo Fisher Scientific, USA). Sequencing libraries were constructed using the Nextera XT DNA Library Preparation Kit (Illumina, FC-131-1024) and the Nextera XT Index Kit (Illumina, FC-131-1001). Sequencing was performed on HiSeq 2500 (100 bp PE) and NovaSeq 6000 (150 bp PE) instruments at Theragen Bio (Seoul, South Korea).Whole transcriptome amplification for three Spirostomum specimens (Sm_U6, Sm_U25, Su_U10) from the Katz lab was performed using the SMART-Seq® v4 Ultra® Low Input RNA Kit for Sequencing (TaKaRa Bio USA, Inc., Mountain View, CA, USA). Amplified cDNA was purified using the AMPure XP PCR Purification system (Beckman Coulter Life Sciences, Indianapolis, IN, USA) and quantified using a Qubit 3.0 Fluorometer (Thermo Fisher Scientific, Waltham, MA, USA). Illumina sequencing libraries were constructed using the Nextera XT DNA Library Preparation Kit (Illumina, FC-131-1096) and the Nextera XT Index Kit v2 Set A (Illumina, FC-131-2001). These samples were then sequenced on a HiSeq 4000 instrument (Illumina) at the Institute for Genome Sciences, University of Maryland (Baltimore, USA).High-throughput sequencing data processingWe assessed the quality of the sequenced raw reads using FastQC v.0.11.5 [33], and trimmed adapters and removed low-quality sequences with BBTools v.38.86 [34], and used q24 as the minimum quality and minimum length, 125 bp for 150 bp and 300 bp PE reads, and 70 bp for 100 bp PE reads. Transcriptome assembly was carried out using rnaSPAdes, included in the SPAdes package v.3.14.1 [35] and subsequently processed by a series of custom Python scripts from PhyloToL v.4.3.1 (PhyloToL part 1- Post assembly Pipeline) [36], available at https://github.com/Katzlab. The post-assembly pipeline removes contaminants (rRNA and non-eukaryotic sequences) and translates the nucleotide sequences with > 200 bp after assigning amino acids to gene families (GFs) with an appropriate genetic code. Further, we assessed the completeness of the translated sequences using BUSCO ver. 5.4.7 (Alveolata dataset -l alveolata_odb10, and proteome mode -m protein) [37] (Table 1; Additional file 2: Table S2).Nuclear rRNA gene reconstruction, taxonomic assignment, and tree constructionWe sequenced the nuclear rRNA gene operon (18S, ITS1-5.8S-ITS2, 28S) of 19 specimens using the Sanger method (Additional file 2: Tables S3-S4). In addition, we reconstructed the rRNA gene sequences from other Spirostomum and Anigsteinia specimens by mapping reads from their respective raw transcriptomes against a set of reference sequences downloaded from NCBI (87 reliable rRNA gene sequences of the genera Spirostomum and Anigsteinia) (see Shazib et al. [13]) (Fig. 1C). We tested various mapping software, including Bowtie 2 [38], BBMap [39], BWA [40], and HISAT2 [41], to assess their influences on the accuracy of the reconstructed contigs. After read mapping to the rRNA genes, three different read sets with differing quality thresholds (all reads, q20, and q40) were used for read assembly with rnaSPAdes [35, 42] (Additional file 2: Table S5). We aligned all the contigs reconstructed using various read mappers and reference sequences to identify errors and artifacts (Additional file 1: Fig. S2). To construct the rRNA gene sequence data matrix, all reliable Spirostomum sequences were aligned with the newly obtained sequences using the MUSCLE algorithm in Geneious ver. Prime 2019 [43]. Ambiguous sequences and poorly aligned columns were removed from the data matrix"
