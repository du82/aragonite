title = "Do morphometric data improve phylogenetic reconstruction? A systematic review and assessment | BMC Ecology and Evolution | Full Text"
description = "Background Isolating phylogenetic signal from morphological data is crucial for accurately merging fossils into the tree of life and for calibrating molecular dating. However, subjective character definition is a major limitation which can introduce biases that mislead phylogenetic inferences and divergence time estimation. The use of quantitative data, e.g., geometric morphometric (GMM; shape) data can allow for more objective integration of morphological data into phylogenetic inference. This systematic review describes the current state of the field in using continuous morphometric data (e.g., GMM data) for phylogenetic reconstruction and assesses the efficacy of these data compared to discrete characters using the PRISMA-EcoEvo v1.0. reporting guideline, and offers some pathways for approaching this task with GMM data. A comprehensive search string yielded 11,123 phylogenetic studies published in English up to Oct 2023 in the Web of Science database. Title and abstract screening removed 10,975 articles, and full-text screening was performed for 132 articles. Of these, a total of twelve articles met final inclusion criteria and were used for downstream analyses. Results Phylogenetic performance was compared between approaches that employed continuous morphometric and discrete morphological data. Overall, the reconstructed phylogenies did not show increased resolution or accuracy (i.e., benchmarked against molecular phylogenies) as continuous data alone or combined with discrete morphological datasets. Conclusions An exhaustive search of the literature for existing empirical continuous data resulted in a total of twelve articles for final inclusion following title/abstract, and full-text screening. Our study was performed under a rigorous framework for systematic reviews, which showed that the lack of available comparisons between discrete and continuous data hinders our understanding of the performance of continuous data. Our study demonstrates the problem surrounding the efficacy of continuous data as remaining relatively intractable despite an exhaustive search, due in part to the difficulty in obtaining relevant comparisons from the literature. Thus, we implore researchers to address this issue with studies that collect discrete and continuous data sets with directly comparable properties (i.e., describing shape, or size)."
full_description = "Research Open access Published: 18 October 2024 Do morphometric data improve phylogenetic reconstruction? A systematic review and assessment Emma J. Holvast1, Mélina A. Celik2, Matthew J. Phillips2 & …Laura A. B. Wilson1,3,4 Show authors BMC Ecology and Evolution volume 24, Article number: 127 (2024) Cite this article 1483 Accesses 1 Altmetric Metrics details AbstractBackgroundIsolating phylogenetic signal from morphological data is crucial for accurately merging fossils into the tree of life and for calibrating molecular dating. However, subjective character definition is a major limitation which can introduce biases that mislead phylogenetic inferences and divergence time estimation. The use of quantitative data, e.g., geometric morphometric (GMM; shape) data can allow for more objective integration of morphological data into phylogenetic inference. This systematic review describes the current state of the field in using continuous morphometric data (e.g., GMM data) for phylogenetic reconstruction and assesses the efficacy of these data compared to discrete characters using the PRISMA-EcoEvo v1.0. reporting guideline, and offers some pathways for approaching this task with GMM data. A comprehensive search string yielded 11,123 phylogenetic studies published in English up to Oct 2023 in the Web of Science database. Title and abstract screening removed 10,975 articles, and full-text screening was performed for 132 articles. Of these, a total of twelve articles met final inclusion criteria and were used for downstream analyses.ResultsPhylogenetic performance was compared between approaches that employed continuous morphometric and discrete morphological data. Overall, the reconstructed phylogenies did not show increased resolution or accuracy (i.e., benchmarked against molecular phylogenies) as continuous data alone or combined with discrete morphological datasets.ConclusionsAn exhaustive search of the literature for existing empirical continuous data resulted in a total of twelve articles for final inclusion following title/abstract, and full-text screening. Our study was performed under a rigorous framework for systematic reviews, which showed that the lack of available comparisons between discrete and continuous data hinders our understanding of the performance of continuous data. Our study demonstrates the problem surrounding the efficacy of continuous data as remaining relatively intractable despite an exhaustive search, due in part to the difficulty in obtaining relevant comparisons from the literature. Thus, we implore researchers to address this issue with studies that collect discrete and continuous data sets with directly comparable properties (i.e., describing shape, or size). Peer Review reports IntroductionDiscrete morphological data have been the primary focus of traditional systematic methods for phylogenetic reconstruction. Even following the success of molecular phylogeny, discrete morphological data remain crucial for merging fossils into the tree of life and for calibrating molecular dating [1]. However, a major limitation of discrete morphological data is subjectivity in the definition of characters and character states, which in turn, may potentially introduce biases and mislead phylogenetic inference and divergence time estimation. The use of quantitative data e.g., geometric morphometric (GMM; shape) landmark data can allow for more objective integration of morphology for phylogenetic inference. Two- or three-dimensional landmarks can be used to capture the geometry of a biological structure, and shape differences can then be quantified using the relative positions of landmarks for each object in the sample [2,3,4,5] by scaling and superimposing the landmark configurations, typically using Procrustes analysis [6].However, challenges associated with the application of GMM data to the inference of phylogenetic topology include the widespread non-independence (e.g., covariation) of landmarks due to functional or developmental correlation, which violates assumptions of standard trait evolution models. Therefore, a single landmark should not be treated as an independent character, but rather the entire landmark configuration [7]. To accommodate this concern, Álvarez-Carretero et al. [8] described a Bayesian method that extended the work of Parins-Fukuchi [9] by explicitly accounting for character correlation within a dataset of 3D cranium landmarks from carnivoran mammals, showing promise for the analysis of continuous characters for phylogenetic and divergence time estimation. Moreover, landmark configurations require Procrustes superimposition to remove non-shape differences (scaling, rotation, translation) between configurations in a dataset, allowing geometric comparisons to be made in a shape space. This procedure scales the landmark configurations to centroid size, and allows for further assessment of allometry, the covariation between shape and size. Allometry can be assessed within a geometric morphometric framework through regression of Procrustes superimposed landmarks against centroid size. Allometric variation can be difficult to tease apart from, but may also contribute to, true phylogenetic signal as the two sources of variation are often confounded [10].Subjectivity may remain with GMM through the choice i.e., number and position, and manual placement of landmarks which can result in observer and measurement error [11,12,13]. However, the development of automated GMM (whole bone shape) methods [14,15,16,17,18] that aim to reduce observer and measurement error associated with manual landmark placement, and thus increase accuracy in approximations of shape, has received recent attention in evolutionary morphology research [12, 19,20,21]. Although, further methodological studies are required to determine the most appropriate approach(es) for individual taxa and for the goals of individual studies [11]. For example, some automated landmarking approaches [e.g., ALPACA; 19] may be better employed within species or among closely related species; while others [e.g., MALPACA; 21] are particularly suitable in broad phylogenetic contexts for landmarking the types of morphologically diverse (multi-taxa) samples commonly encountered in evolutionary studies.If choosing to discretize GMM data for phylogenetic analysis [22, 23], another difficulty is in characterising and coding (i.e., discretizing) landmarks into character states. Moreover, arbitrarily delimiting discrete states from variation that is inherently continuous [24] (i.e., GMM; shape) can result in information loss [25]. However, improvements in discretization methods for continuous data have recently been proposed [22].Methods for analysing undiscretized continuous morphological data i.e., as continuous quantitative characters in phylogenetic inference have been available using cladistic approaches such as parsimony [TNT; 25,26,27,28,29] and model-based methods such as maximum likelihood (ML) [CONTML in PHYLIP; 30] and Bayesian methods [31]. However, most attempts to integrate GMM data into phylogenetic inference have been criticised due to methodological concerns and unreliability [7, 32,33,34], although few studies have performed well in reconstructing ‘true’ phylogenetic relationships [35,36,37,38].Analysis of continuous data (including GMM data) has been more commonly applied to taxonomy, especially in the delineation of species [e.g., 39, 40]. Among marsupial mammals cranial and/or dental linear measurement data have been applied in several studies on bandicoots (Peramelemorphia) [41, 42], whereas 3D landmark-based GMM of the cranium has been applied in Antechinus (Dasyuromporphia) [43].Examples of reconstructing phylogeny from GMM data include the use of landmark configurations as continuous characters in what is referred to in the literature as ‘landmark analysis under parsimony’ (LAUP; spatial parsimony) or ‘Phylogenetic Morphometrics’ (PM) as proposed by Catalano et al. [27], Goloboff and Catalano [28], Catalano and Goloboff [26], [e.g., 23, 44,45,46]. Other studies have used landmark coordinates as continuous characters under parsimony [e.g., 47], squared-change parsimony [e.g., 23], minimum evolution [48, 49] [i.e., “Euclidean parsimony”; 50] [e.g., 32], and with Brownian motion modelling of evolutionary change under maximum likelihood (ML) [e.g., 23] and under Bayesian inference [e.g., 31]; while others have used principal component (PC) scores [e.g., 24, 47, 51] and eigenscores [eigenshape analysis descriptors; e.g., 37] as continuous characters under parsimony, and PC scores as continuous characters under maximum likelihood [e.g., 24, 35, 39, 51]. However, the use of PC scores and landmark coordinates in phylogenetic inference have been heavily criticized by some researchers, with Adams et al. [33] regarding PCs of shape data as both inappropriate and ineffective as cladistic characters [33], and Varon-Gonzalez et al. [32] suggesting the unreliability of phylogenetic estimation from shape data such as landmark coordinates [32], see also criticisms by Catalano et al. [27]; Goloboff [52].An alternative approach to character-based methods for reconstructing phylogeny from GMM data is to create trees based on distances (i.e., Procrustes, Euclidean) between taxa using cluster analysis. For example, neighbour-joining [NJ; 53] [e.g., 23, 24, 35, 44, 54,55,56] and unweighted pair group method with arithmetic mean [UPGMA; 58] [e.g., 24, 35, 44, 56, 57, 59, 60] or other methods such as minimum evolution [ME; 61] [e.g., 59] and maximum likelihood using flexibly weighted least squares methods [fWLS; e.g., 62, 63].Another procedure is to estimate the positions of fossil taxa along a scaffold (molecular) phylogeny of extant taxa using quantitative data. For example, Revell et al. [64] described a maximum likelihood method for placing individual taxa into a phylogeny of extant taxa using continuous character data. This approach performed well but was limited to the placement of only extant and recently extinct taxa, and with only a single taxon placed at a time. Extending this approach, Parins‐Fukuchi [36] presented a Bayesian method that places multiple fossil taxa on a phylogeny of extant taxa using quantitative characters modelled under Brownian Motion [65]. Importantly, their model treats branch lengths in terms of morphological divergence as opposed to time, and moreover allows the placement of long extinct fossil taxa to be estimated.Probabilistic approaches (e.g., under Bayesian inference) allow estimation of branch lengths and evolutionary rates and can improve estimates of uncertainty, thus potentially improving the accuracy of morphological phylogenetics compared to cladistic methods (i.e., parsimony analysis) [9]. Recently, Zhang et al. [31] introduced a probabilistic total-evidence method for phylogenetic inference using multiple continuous (3D GMM landmark coordinates) characters in addition to discrete morphology and molecular data from both living and subfossil taxa, and fossil ages. Their method was implemented in a flexible Bayesian framework and was found to result in a general, extendable, and fast approach for phylogenetic inference from multiple continuous characters [31], thus demonstrating promise for leveraging quantitative (i.e., GMM) data in phylogeny estimation moving forward.Given the conflicting conclusions on the efficacy of GMM data for phylogeny reconstruction, coupled with the recent advancement in whole bone GMM approaches that enable the option to rapidly collect phenotypic data for taxonomic purposes, we review the current state of the field in using morphometric data for inferring phylogeny using the Preferred Reporting Items for Systematic Reviews and Meta-Analyses in ecology and evolutionary biology (PRISMA-EcoEvo v1.0.) reporting guideline. In addition, we assess the efficacy of morphometric data compared to discrete characters and offer some pathways for approaching this task with GMM data (which we here consider a subset of continuous data). Our objectives were to 1) test whether morphological phylogeny congruence with a reference molecular benchmark improves when morphometric data are included, and 2) identify the challenges and benefits that could arise from the use of GMM data in phylogenetic reconstruction.MethodsA search for relevant published literature was performed on October 11, 2023, in the Web of Science database using the PRISMA-EcoEvo version 1.0 reporting guideline of O'Dea et al. [66].Data sources and search strategyThe search strategy was developed through an initial scoping review and subsequent rearrangement of ‘phylogen*’ and ‘morpho*’ as root terms, and with ‘landmark*’ as an additional term to identify all relevant articles. Asterisks were used to include search results containing variations of the root terms ‘phylogeny’, ‘morphology’, ‘morphometric’ and of the additional term ‘landmark’. The final search string comprised the following combination of keywords and Boolean operators: phylogen* AND morpho* AND (continuous OR landmark* OR shape). The search fields selected were “All Fields”. Inclusion criteria were defined as: Publication Years “2003–2023”; languages “English”. Exclusion criteria were defined as: Document Types “Review Articles” and “Editorial Material” (see Table S1, Additional file 1 for inclusion and exclusion criteria). A date restriction of 2003 to 2023 was applied, allowing for articles published over the last 20 years, up to October 2023, capturing the advancement and maturity of the field of geometric morphometrics [67], which began in the late 1990s [68]. Deduplication, and both title/abstract and full-text screening of records were performed manually by one author in EndNote version 20 [69]. Articles were independently assessed for individual study quality by two authors to determine final inclusion (Table S2, Additional file 1; Fig. 1).Fig. 1PRISMA-EcoEvo flowchart adapted from O’Dea et al. [66] for Web of Science literature search and study selection in the systematic review, showing stages of the workflowFull size imageEligibility criteriaStudies were included or excluded in this review according to predefined criteria (Table S1, Additional file 1). These criteria would enable valid comparisons between phylogenies that are based on or included continuous data with those that did not, as well as comparison to a reference phylogeny based on independent (i.e., molecular) data.Study selectionThe search strategy identified an initial 11,123 records (Fig. 1). Five duplicates were found in records identified through the search. Of the 11,118 articles retrieved, 10,975 were excluded because they did not meet the inclusion criteria. Of the 132 potentially eligible studies, a further 120 were excluded, resulting in a total of 12 articles for final inclusion in the systematic review. We note that six of the twelve studies estimate phylogeny from GMM (i.e.,"
