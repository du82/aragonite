full_description = "Join our Editorial Board Become an Editorial Board Member BMC Ecology and Evolution is currently recruiting new Editorial Board Members to join our international Editorial Board.We encourage applications from researchers with an ecology and evolutionary biology background in a range of subject areas, broadly covered by the below: Behavioral ecology Conservation biology Ecological developmental biology Evolutionary developmental biology and biodiversity Experimental evolution Genome evolution and evolutionary systems biology Human evolution and ecology Macroecology Phylogenetics and phylogeography Population ecology Speciation and evolutionary genetics Theories and modelsBMC Ecology and Evolution scope and ethosBMC Ecology and Evolution, formerly known as BMC Evolutionary Biology, is an open access, peer-reviewed journal interested in all aspects of ecological and evolutionary biology. The journal considers articles on a broad range of topics, including population genetics, conservation genetics, phylogenetics, behavioural ecology, population ecology, macroecology, palaeontology, biodiversity (e.g. environmental DNA approaches), theoretical research (e.g. terraforming) and ecological and evolutionary developmental biology.We do not make editorial decisions on the basis of the interest of a study or its likely impact. Studies must be scientifically valid; for research articles this includes a scientifically sound research question, the use of suitable methods and analysis, and following community-agreed standards relevant to the research field.CriteriaWe are interested in individuals who are committed to open access, data sharing and innovation in scientific publishing.Suitable candidates should: have a minimum of fifteen (15) research papers published in reputable, English language, peer-reviewed journals be frequently listed as corresponding author (first or last author) during the last five years; have demonstrable expertise that fits within the scope and the need of the journal.Suitable Editorial Board Members for BMC Ecology and Evolution must: support the journal’s ethos, scope, editorial standards, and policies, and be committed to represent BMC Ecology and Evolution within the scientific community; provide a professional and supportive service to our authors and ensure that manuscripts fulfil the requirements of the Journal and are handled efficiently and appropriately through peer-review.Role and responsibilitiesThe Editorial Board Member is primarily responsible for assessing manuscripts for their suitability for peer review, selecting suitable reviewers who meet the Journal’s requirements and recommends decisions on the basis of the peer reviewers’ reports and their own assessment while adhering to the Journal’s editorial policies.An Editorial Board Member for BMC Ecology and Evolution should be willing to handle a minimum of 12 manuscripts per year across a range of disciplines within their broader subject area.We also encourage all of our Editors to take an active interest in journal development and promotional projects to help increase the visibility of our published research.More information on Editorial Board Responsibilities can be found here. Interested in applying? If you are interested in becoming an Editorial Board Member for BMC Ecology and Evolution and you meet the criteria above, please click on the button below to submit your application. We look forward to hearing from you. Apply now"
