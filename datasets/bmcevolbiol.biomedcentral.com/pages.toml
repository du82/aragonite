title = "Multicellularity and increasing Reynolds number impact on the evolutionary shift in flash-induced ciliary response in Volvocales | BMC Ecology and Evolution | Full Text"
description = "Background Volvocales in green algae have evolved by multicellularity of Chlamydomonas-like unicellular ancestor. Those with various cell numbers exist, such as unicellular Chlamydomonas, four-celled Tetrabaena, and Volvox species with different cell numbers (~1,000, ~5,000, and ~10,000). Each cell of these organisms shares two cilia and an eyespot, which are used for swimming and photosensing. They are all freshwater microalgae but inhabit different fluid environments: unicellular species live in low Reynolds-number (Re) environments where viscous forces dominate, whereas multicellular species live in relatively higher Re where inertial forces become non-negligible. Despite significant changes in the physical environment, during the evolution of multicellularity, they maintained photobehaviors (i.e., photoshock and phototactic responses), which allows them to survive under changing light conditions. Results In this study, we utilized high-speed imaging to observe flash-induced changes in the ciliary beating manner of 27 Volvocales strains. We classified flash-induced ciliary responses in Volvocales into four patterns: “1: temporal waveform conversion”, “2: no obvious response”, “3: pause in ciliary beating”, and “4: temporal changes in ciliary beating directions”. We found that which species exhibit which pattern depends on Re, which is associated with the individual size of each species rather than phylogenetic relationships. Conclusions These results suggest that only organisms that acquired different patterns of ciliary responses survived the evolutionary transition to multicellularity with a greater number of cells while maintaining photobehaviors. This study highlights the significance of the Re as a selection pressure in evolution and offers insights for designing propulsion systems in biomimetic micromachines."
full_description = 'Research Open access Published: 14 September 2024 Multicellularity and increasing Reynolds number impact on the evolutionary shift in flash-induced ciliary response in Volvocales Noriko Ueki1,2 & Ken-ichi Wakabayashi2,3 BMC Ecology and Evolution volume 24, Article number: 119 (2024) Cite this article 978 Accesses 1 Altmetric Metrics details AbstractBackgroundVolvocales in green algae have evolved by multicellularity of Chlamydomonas-like unicellular ancestor. Those with various cell numbers exist, such as unicellular Chlamydomonas, four-celled Tetrabaena, and Volvox species with different cell numbers (~1,000, ~5,000, and ~10,000). Each cell of these organisms shares two cilia and an eyespot, which are used for swimming and photosensing. They are all freshwater microalgae but inhabit different fluid environments: unicellular species live in low Reynolds-number (Re) environments where viscous forces dominate, whereas multicellular species live in relatively higher Re where inertial forces become non-negligible. Despite significant changes in the physical environment, during the evolution of multicellularity, they maintained photobehaviors (i.e., photoshock and phototactic responses), which allows them to survive under changing light conditions.ResultsIn this study, we utilized high-speed imaging to observe flash-induced changes in the ciliary beating manner of 27 Volvocales strains. We classified flash-induced ciliary responses in Volvocales into four patterns: “1: temporal waveform conversion”, “2: no obvious response”, “3: pause in ciliary beating”, and “4: temporal changes in ciliary beating directions”. We found that which species exhibit which pattern depends on Re, which is associated with the individual size of each species rather than phylogenetic relationships.ConclusionsThese results suggest that only organisms that acquired different patterns of ciliary responses survived the evolutionary transition to multicellularity with a greater number of cells while maintaining photobehaviors. This study highlights the significance of the Re as a selection pressure in evolution and offers insights for designing propulsion systems in biomimetic micromachines. Peer Review reports BackgroundIn the history of evolution, multicellularity occurred multiple times independently; multicellularity is thought to result in survival advantages under selective pressure [1]. Multicellularity provides various benefits: avoiding predation due to larger size, effective predation/escape/movement to optimal environments due to faster moving speed, division of labor by cell differentiation, etc.Volvocales green algae are a group of swimming phytoplankton that include species with a wide range of cell numbers, making them an excellent model for studying the evolution of multicellularity in existing organisms (Fig. 1A and B). The multicellular species in Volvocales have either a flat or spherical shape. Flat species contain relatively few cells, like Tetrabaena and Gonium (Fig. 1A and C). Among spherical species, Pandorina has a morphology of densely packed cells, and those with more cells have a single layer of cells on the surface of the spheroid, like Eudorina, Pleodorina, and Volvox (Fig. 1A and C). Their evolution involved increasing complexity, such as in morphogenesis and sexual reproduction [2]. Volvox, which has the highest complexity, has the following survival advantage traits: they avoid predation by their large size [3, 4], swim fast [5], move quickly to optimum light environments [6], and differentiate between somatic and reproductive cells, with the reproductive cells being located and protected inside the spherical somatic cell sheet [7] (Fig. 1A).Fig. 1Volvocales species/strains used in this study. A Schematic illustration of representative genera in Volvocales. B Phylogenetic relationships among the Volvocalean species examined in this study (Table 1). The cladogram was constructed based on the recent phylotranscriptomics/phylogenomics [8, 9] and the chloroplast multigene phylogeny [10] of homothallic V. africanus and V. zeikusii. Note that Volvox ferrisii includes V. sp. Sagami [11]. C Bright-field images of species/strains in Volvocales used in this study. Note the difference in scale bars. For species other than Volvox, only generic names are shown. For Volvox, abbreviated generic names and specific names are shown. See Table 1 for detailsFull size imageWith the increasing size of aquatic organisms, the physical properties of the surrounding fluid change. For organisms as small as 10 µm, such as Chlamydomonas, the environment is dominated by viscous forces. This would be like humans swimming in honey; thus, those small organisms must constantly generate propulsive forces to move. Cilia (or flagella) are considered adequate in such environments [12]. For smaller organisms ~1 µm in diameter, such as Escherichia coli, the effect of diffusion by Brownian motion cannot be ignored. For larger ones, > 1 mm, such as Volvox or Daphnia, the effect of inertia cannot be ignored [13, 14]. Accordingly, Volvocales range from sizes where viscous forces dominate to those with nonnegligible inertial forces. The ratio of inertia force to viscosity force is defined by the Reynolds number (Re), which is given by$$Re=\frac{\rho VL}{\mu }=\frac{VL}{\nu }$$where V (m/s) is the average velocity of an object relative to the fluid, L (m) is the characteristic length, ρ (kg/m3) is the density of the fluid, μ (kg/m·s) is the dynamic viscosity of the fluid, and ν (m2/s) is the kinematic viscosity of the fluid. The equation above can be transformed as follows:$$Re=\frac{{\rho V}^{2}}{\mu V/L}$$where the numerator represents the inertia force, and the denominator represents the viscosity force. Thus, Re > 1 means that inertia overcomes viscosity.Volvocales species commonly possess one eyespot and two cilia on each cell and beat the cilia toward the posterior of the individual with asymmetric waveforms consisting of effective and recovery strokes (Fig. 2A) [15]. Because the cilia deform differently during the two strokes, propulsion is efficiently generated even in environments with low Re, i.e., where viscosity is dominant [16]. When the eyespot senses a light stimulus, the ciliary movement pattern alters, and Ca2+ influx into the cilia is considered to occur during this process [17].Fig. 2Representative ciliary movements and photobehaviors in a unicellular and a multicellular species in Volvocales. A Ciliary and individual movement in Chlamydomonas and Volvox. Left: one stroke of an asymmetric waveform of cilia. Effective stroke (solid lines) and recovery stroke (broken lines) are shown. Modified by [6, 18]. Middle: Relationship between a cell and the direction of ciliary beating. Right: direction of the individual’s forward swimming and rotation. Black arrows: direction of ciliary beating in the asymmetric waveform. Dark gray arrows: individual’s swimming direction. Light gray arrows: direction of rotation. A, anterior pole; P, posterior pole. B Models of ciliary responses for photobehaviors in Chlamydomonas reinhardtii and Volvox ferrisii modified from [19]. The ciliary responses in magenta are focused on in this studyFull size imageInterestingly, several reports suggest that the regulation pattern in ciliary movement varies among species. In Chlamydomonas reinhardtii, the ciliary waveform converts from asymmetric to symmetric in response to a sudden increase in light intensity (such as flash illumination), causing temporal backward swimming called photoshock behavior (Fig. 2B) [20,21,22,23,24]. This waveform conversion is shared by other unicellular species of Volvocales, such as Chlorogonium and Carteria, and some prasinophytes, such as Pyramimonas and Tetraselmis [25]. In Tetrabaena socialis, which has a flat shape with four cells, cilia do not change their motility even after light stimulation, and no photobehavior is observed [19]. Several Volvox species temporarily reduce the ciliary beating frequency or stop ciliary movement in response to a sudden increase in light intensity [26, 27]. Other Volvox species in section Volvox, a group containing relatively more cells characterized by thick cytoplasmic bridges connecting cells, cilia temporarily change the direction of beating in response to sudden increase in light intensity while remaining in an asymmetric waveform (Fig. 2B) ([6] for V. ferrisii (previously reported as V. rousseletii); [27] for V. barberi). In both Volvox groups, those ciliary responses are considered to cause both phototactic and photoshock behaviors. A sudden increase in ambient light intensity induces a ciliary response in all cells throughout the sphere, causing photoshock behavior. When continuously illuminated from one direction, because of the self-rotation of the sphere about its anterior-posterior axis and directional photoreception at each eyespot, oscillation of light intensity is perceived by photoreceptors. In addition, cells closer to the anterior pole have larger eyespot. These factors result in a ciliary response only on the light side, whose amplitude is larger closer to the anterior pole, causing phototactic behavior (Fig. 2B) [6, 27,28,29].Thus, Volvocales species commonly beat their cilia in an asymmetric waveform toward the backward of the individual during normal forward swimming; conversely, the responses of ciliary movement after a sudden change of light intensity differ among species. Here, the four patterns above are classified according to the number of cells and size of the individual as “1: temporal waveform conversion”, “2: no obvious response”, “3: pause in ciliary beating”, and “4: temporal changes in ciliary beating directions”. In this study, we categorized the pattern of ciliary response after a flash illumination is applied for 27 strains (Table 1, Fig. 1B and C) and found that the patterns matched better with the Re of each species than with phylogenetic relationships.Table 1 Volvocales strains used in this studyFull size tableMaterials and methodsStrains and cultural conditionsThe Volvocales strains used in this study are listed in Table 1. Chlamydomonas reinhardtii strain CC-125 was grown in ~130 mL of tris-acetate-phosphate medium [30] in a 200-mL flask with aeration at 23ºC under continuous white, fluorescent light at ~120 µmol photons m−2 s−1. Other strains were grown in Volvox thiamin acetate (VTAC) medium [31, 32], except for Tetrabaena socialis in artificial freshwater-6 (AF-6) medium [31], statically in a test tube with a volume of 10 mL or in a 200-mL flask with a volume of ~130 mL at 24 °C–28 °C on a 16 h/8 h light/dark cycle under white fluorescent light at ~120 µmol of photons m−2 s−1.Observation of photo-induced ciliary responsePhoto-induced ciliary responses were observed under a phase-contrast microscope (Axioscope 2, ZEISS or Axioscope 5, ZEISS) under red illumination (> 665 nm). Then, algae were stimulated by a white flash illumination (Speedlite 300EZ, Canon). The ciliary beating was video recorded at 500 frames per second using a high-speed CCD camera (HAS-U2, DITECT Corporation).Character optimizationParsimony was used for character optimization of patterns 1–4 in the “cladogram” (tree topology without tree length), with the general and simple optimization algorithms ACCTRAN (accelerated transformation) and DELTRAN (delayed transformation) [33], using PastML [34]. The cladogram of the species examined in this study (Table 1, Fig. 1) was constructed based on the recent phylotranscriptomics/phylogenomics [8, 9] and the chloroplast multigene phylogeny [10] of homothallic V. africanus and V. zeikusii. V. sp. Sagami (Table 1) was included in V. ferrisii [11].Measurement of individual size and counting of cell number of individualsIndividuals of Volvox species were placed on a glass slide without a cover slip on top to avoid crushing or changing its size. They were photographed focusing on the periphery and surface of the spheroid using a stereomicroscope (Stemi508, ZEISS) equipped with a digital camera (WRAYCAM-NOA630B, Wraymer). The length in the anterior-posterior direction of the largest individual in the largest developmental stage was measured focusing on the periphery, and the number of somatic cells per area was counted focusing on the spherical surface; then, the total cell count was calculated. Species other than Volvox were photographed using a digital camera (Zeiss Axiocam 208 color) equipped with an optical microscope (Axioscope 5, ZEISS); the length in the anterior-posterior direction was measured, and the total cell number was counted in the largest individual.Measurement of diameter and swimming speed and Reynolds-number calculationAbout 8 mL of culture was placed into a 3.5 cm plastic petri dish (Iwaki) placed on the stage of a stereomicroscope (Stemi508, ZEISS) and video-recorded for around 1 min using an Axiocam 208 color camera (ZEISS). The distances that individuals traveled for 3–10 s were measured using the plugin “Manual Tracking” of FIJI (ImageJ) software version 2.1.0. Velocities were determined based on the time and distance traveled. The diameters of the individuals were measured in the direction perpendicular to the anterior-posterior axis using FIJI (ImageJ) software version 2.1.0, and approximated as the characteristic length for Re. The Re for each individual was calculated according to the following formula: diameter (µm) × velocity (µm/s) / kinematic viscosity coefficient for water 106 (µm2/s).ResultsFlash-induced ciliary responses could be categorized into four patterns in VolvocalesTo understand the diversity of ciliary responses to a sudden increase in light intensity in Volvocales, we observed ciliary movements after exposure to a white flash illumination in 27 strains (Table 1, Fig. 1B and C). The mode of flash-induced ciliary response was categorized into the following four patterns (summarized in Fig. 3E). Hereinafter, for readability, non-abbreviated generic names are shown for species other than Volvox.Fig. 3Four patterns of flash-induced ciliary response. A–D Upper rows: sequential images at equal intervals covering > 1 stroke of the asymmetrical waveform before flash illumination. Bottom rows: sequential images after flashlight application in the same time interval as the upper rows. Time points from flash illumination are shown. White arrowheads indicate bends of asymmetric waveforms. A Temporal waveform conversion (Pattern 1) in Chlamydomonas reinhardtii. B No obvious response (Pattern 2) in Vitreochlamys ordinata. C A pause in ciliary beating (Pattern 3) in Eudorina elegans. D Temporal changes in ciliary beating directions (Pattern 4) in Volvox ferrisii. Scale bars: 10 µm. E Four patterns of flash-induced ciliary response. Volvocales species exhibiting each pattern are shown. An asterisk indicates species exhibiting both Patterns 3 and 4. Species with a citation ([#]) have already been reported on the pattern of ciliary r'
