title = "A worldwide correlation of lactase persistence phenotype and genotypes | BMC Ecology and Evolution | Full Text"
description = "Background The ability of adult humans to digest the milk sugar lactose - lactase persistence - is a dominant Mendelian trait that has been a subject of extensive genetic, medical and evolutionary research. Lactase persistence is common in people of European ancestry as well as some African, Middle Eastern and Southern Asian groups, but is rare or absent elsewhere in the world. The recent identification of independent nucleotide changes that are strongly associated with lactase persistence in different populations worldwide has led to the possibility of genetic tests for the trait. However, it is highly unlikely that all lactase persistence-associated variants are known. Using an extensive database of lactase persistence phenotype frequencies, together with information on how those data were collected and data on the frequencies of lactase persistence variants, we present a global summary of the extent to which current genetic knowledge can explain lactase persistence phenotype frequency. Results We used surface interpolation of Old World lactase persistence genotype and phenotype frequency estimates obtained from all available literature and perform a comparison between predicted and observed trait frequencies in continuous space. By accommodating additional data on sample numbers and known false negative and false positive rates for the various lactase persistence phenotype tests (blood glucose and breath hydrogen), we also apply a Monte Carlo method to estimate the probability that known lactase persistence-associated allele frequencies can explain observed trait frequencies in different regions. Conclusion Lactase persistence genotype data is currently insufficient to explain lactase persistence phenotype frequency in much of western and southern Africa, southeastern Europe, the Middle East and parts of central and southern Asia. We suggest that further studies of genetic variation in these regions should reveal additional nucleotide variants that are associated with lactase persistence."
full_description = "Research article Open access Published: 09 February 2010 A worldwide correlation of lactase persistence phenotype and genotypes Yuval Itan1,2, Bryony L Jones1, Catherine JE Ingram1, Dallas M Swallow1 & …Mark G Thomas1,2,3 Show authors BMC Evolutionary Biology volume 10, Article number: 36 (2010) Cite this article 79k Accesses 172 Altmetric Metrics details AbstractBackgroundThe ability of adult humans to digest the milk sugar lactose - lactase persistence - is a dominant Mendelian trait that has been a subject of extensive genetic, medical and evolutionary research. Lactase persistence is common in people of European ancestry as well as some African, Middle Eastern and Southern Asian groups, but is rare or absent elsewhere in the world. The recent identification of independent nucleotide changes that are strongly associated with lactase persistence in different populations worldwide has led to the possibility of genetic tests for the trait. However, it is highly unlikely that all lactase persistence-associated variants are known. Using an extensive database of lactase persistence phenotype frequencies, together with information on how those data were collected and data on the frequencies of lactase persistence variants, we present a global summary of the extent to which current genetic knowledge can explain lactase persistence phenotype frequency.ResultsWe used surface interpolation of Old World lactase persistence genotype and phenotype frequency estimates obtained from all available literature and perform a comparison between predicted and observed trait frequencies in continuous space. By accommodating additional data on sample numbers and known false negative and false positive rates for the various lactase persistence phenotype tests (blood glucose and breath hydrogen), we also apply a Monte Carlo method to estimate the probability that known lactase persistence-associated allele frequencies can explain observed trait frequencies in different regions.ConclusionLactase persistence genotype data is currently insufficient to explain lactase persistence phenotype frequency in much of western and southern Africa, southeastern Europe, the Middle East and parts of central and southern Asia. We suggest that further studies of genetic variation in these regions should reveal additional nucleotide variants that are associated with lactase persistence. BackgroundAn estimated 65% of human adults (and most adult mammals) downregulate the production of intestinal lactase after weaning. Lactase is necessary for the digestion of lactose, the main carbohydrate in milk [1], and without it, milk consumption can lead to bloating, flatulence, cramps and nausea [2]. Continued production of lactase throughout adult life (lactase persistence, LP) is a genetically determined trait and is found at moderate to high frequencies in Europeans and some African, Middle Eastern and Southern Asian populations (see Additional File 1 and Figure 1).Figure 1Interpolated map of Old World LP phenotype frequencies. Dots represent collection locations. Colours and colour key show the frequencies of the LP phenotype estimated by surface interpolation.Full size imageThe most frequently used non-invasive methods for identifying the presence of intestinal lactase are based upon detecting digestion products of lactose produced by the subject (Blood Glucose, BG) or gut bacteria (Breath Hydrogen, BH). For both methods a lactose load is administered to the subject following an overnight fast. In individuals producing lactase this leads to a detectable increase in blood glucose. In individuals who are not producing lactase, the undigested lactose will pass into the colon where it is fermented by various gut bacteria, producing fatty acids and various gases, particularly hydrogen. Hydrogen passes through the blood into the lungs and so can be detected in the breath using a portable hydrogen analyser. Both the BG and the BH tests have asymmetric type I and type II error rates. Thus any study seeking association between a particular polymorphism and LP should take these error rates into account. In addition it should be noted that while in most cases the presence/absence of intestinal lactase in an adult is likely to be genetically determined, the loss of lactase can also be caused by gut trauma such as gastroenteritis [3–6]. Other non-invasive methods for detecting the presence/absence of lactase include assaying for urine galactose and detecting metabolites of Carbon-14-labelled lactose. These methods are rarely used today. The most reliable method is intestinal biopsy, which provides a direct determination of intestinal lactase activity. However, this procedure is very rarely used for diagnosing healthy individuals because of its invasive nature [7].With the recent discovery of nucleotide changes associated with LP comes the prospect of direct genetic tests for the trait [8–10]. However, it has become clear that there are multiple, independently derived LP-associated alleles with different geographical distributions [1, 8, 11, 12]. LP is particularly common in Europe and certain African and Middle Eastern groups. As a consequence these are the regions where most genetic studies have been focused and all currently known LP alleles have been identified [7, 11, 12]. The first allelic variant that was shown to be strongly associated with increased lactase activity is a C>T change 13,910 bases upstream of the LCT gene in the 13th intron of the MCM6 gene [13]. Functional studies have indicated that this change may affect lactase gene promoter activity and increase the production of lactase-phlorizin hydrolase mRNA in the intestinal mucosa [14–17] but, as with all LP-associated variants, there remains the possibility that linkage to as yet unknown causative nucleotide changes may explain observed associations. Haplotype length conservation [18], linked microsatellite variation [19] and ancient DNA analysis from early European farmers [20] later confirmed that this allele has a recent evolutionary origin and had been the subject of strong positive natural selection. Furthermore, a simulation model of the origins and evolution of lactase persistence and dairying in Europe has inferred that natural selection started to act on an initially small number of lactase persistent dairyers around 7,500 BP in a region between Central Europe and the northern Balkans, possibly in association with the Linearbandkeramik culture [21]. Another simulation study has inferred that it is likely that lactase persistence selective advantage was not constant over Europe, and that demography was a significant element in the evolution and spread of European lactase persistence [22].However, the presence of this allele could not explain the frequency of LP in most African populations [8]. Further studies identified three additional variants that are strongly associated with LP in some African and Middle Eastern populations and/or have evidence of function, all are upstream of the LCT gene in the 13th intron of the MCM6 gene: -13,907*G, -13,915*G and -14,010*C [11, 12, 23, 24]. Where data were sufficient, some of these alleles also showed genetic signatures of a recent origin and strong positive natural selection [12, 23].Although at least four strong candidate causative alleles have been identified, only a small number of populations have been studied, and those are confined to Europe, Africa and the Middle East. It is therefore unlikely that all LP-associated or LP-causing alleles are currently known. As a consequence, genetic tests based on current knowledge would underestimate the frequency of LP in most world populations. As part of the first study to seek a genetic explanation for the distribution of LP in Africa [8], a statistical procedure (GenoPheno) was developed to test if the frequency of an LP-associated allele could explain reported LP frequency in ethnically matched populations. Crucially, this statistical procedure was designed to account for sampling errors and the asymmetric type I and type II error rates associated with different phenotype tests (BH and BG).In this study we have sought to extend this approach to the whole of the Old World. However, while there is a rich literature on the frequencies of LP in different geographic regions [1] and a growing body of publications reporting the frequencies of candidate LP-causing alleles, in most cases the genetic and phenotypic data are not from the same people and often not of closely neighbouring groups. Thus, characterization of the extent to which LP frequency can be explained by current knowledge of LP-associated genotype frequencies is limited to populations where both data types are available. To overcome this problem we performed surface interpolation of various data categories (genetic, phenotypic, sample numbers, phenotype tests used and their associated error rates) and applied the statistical procedures described on a fine grid covering the Old World landmass. This has allowed us to identify regions where reported LP-associated allele frequencies are insufficient to explain the presence of LP. These regions should be good candidates for future genotype/phenotype studies.MethodsDataOur global LP phenotype dataset consists of 112 locations [1] (see Additional File 1). These data were carefully selected from a large literature on LP frequencies so as to remove data collected from (1) children, (2) patients selected for likely lactose intolerance, (3) family members, and (4) people with twentieth/twenty-first century immigrant status. Genotype data was obtained for 132 locations where the frequency of the -13,910 C>T allele had been estimated [7, 8, 11, 18, 25–27], and from 61 locations where the frequency of all 4 currently known LP associated allelic variants had been estimated [12, 23, 26, 28] (see Additional File 2). These data were carefully selected from a large literature on LP frequencies so as to remove data collected from (1) patients selected for likely lactose intolerance, (2) family members, and (3) people with twentieth/twenty-first century immigrant status. Where there was more than one dataset for a particular location (for either genotype or phenotype data), a weighted average frequency was calculated. The type I and type II error rates used were 8.621% and 6.849%, respectively, for BG and 6.818% and 4.167%, respectively, for BH [8]. Predicted LP frequencies, from the LP genotype frequencies, were calculated by assuming Hardy-Weinberg equilibrium and dominance (see Additional File 2).The geographic space explored was from longitude -19 to 180, and from latitude -48 to 72.Surface InterpolationTo estimate the distribution of LP and LP-associated allele frequencies in continuous space, from irregularly spaced data, surface interpolation was performed using the Natural Neighbour algorithm [29, 30], as implemented in the PyNGL module of the Python programming language [31–33]. Briefly, this algorithm first divides a 2-dimentional space into polygons according to the locations of the observed data points, then estimates the value at locations for which data is absent by weighting each of the neighbouring locations by their relative overlap.Quantitative Difference Correlation AnalysisWe also performed an analysis to quantify the difference between phenotype frequency and predicted phenotype frequency based on the frequency of LP-associated alleles. As above, we assumed Hardy-Weinberg equilibrium and performed surface interpolation using the data provided in the tables of Additional Files 1 and 2. We then subtracted the surface representing expected frequencies from that representing observed LP frequencies. Maps were plotted using PyNGL [33]. The code for the program is available from the authors.GenoPheno Correlation AnalysisTo identify regions where LP-associated allele frequencies are insufficient to explain observed LP incidence we applied the Monte Carlo based statistical test GenoPheno [8] to each cell in a 198 (west-east) by 119 (south-north) grid of covering the Old World. For each cell it was necessary to provide information on LP-associated allele frequencies and LP incidence (see above) as well as on sample numbers used for each data type and type I and type II error rates for the LP phenotype tests used. These parameters were estimated by surface interpolating values from genetic and phenotypic studies to provide 6 surface interpolated 'layers' of information. The code for the program is available from the authors.Similar Populations at Similar Regions AnalysisTo demonstrate LP specific genotype-phenotype correlation analysis without interpolation (Table 1) we have performed quantitative difference and GenoPheno tests (as described above) on phenotype and genotype data (from the tables of Additional Files 1 and 2, respectively) where: (1) the ethnic groups are similar, and (2) the country/region is similar and a deviation of maximum 3 degrees between the two data points.Table 1 The GenoPheno correlation for similar ethnic groups at similar regionsFull size tableSample Density AnalysisTo indicate regions where genotype and phenotype sampling is sparse we used a 2-dimensional kernel density estimation [34, 35], as implemented in the KernSmooth package of the R statistical programming environment [36]. We used an isotropic kernel with a bandwidth equal to half of the average nearest neighbour distance (ANND) between sample points, to ensure that >95% of each Gaussian sampling region will be within the ANND.ResultsInterpolated LP Phenotype FrequenciesFigure 1 shows an interpolated map of the frequencies of LP based on phenotype tests (also see Additional File 1, [1]). Although this map should provide a reasonable representation of frequencies in Europe and western Asia, it should be noted that (1) data is sparse at eastern and northern Asia, Indonesia, Melanesia, Australia and Polynesia, and (2) in Africa and the Middle East it is often the case that populations living in close proximity to each other have dramatically different LP frequencies, depending to an extent on traditional subsistence strategies [1].Interpolated Predicted LP Phenotype FrequenciesFigure 2 shows an interpolated map of the frequencies of LP predicted by all 4 currently known LP associated allelic variants, based on genotyping tests (see Additional File 2, [7, 8, 11, 18, 25–27]). As with the phenotype data, the genotype data is sparse in eastern and northern Asia, Indonesia, Melanesia, Australia and Polynesia.Figure 2Predicted Old World LP phenotype frequencies based on LP-associated allele frequencies. LP frequency prediction assumes Hardy-Weinberg equilibrium and dominance. Crosses represent collection locations where all 4 currently known LP-associated alleles were genotyped, and diamonds represent collection locations where the only data on the -13,910 C>T allele is available. Colour key shows the predicted LP phenotype frequen"
