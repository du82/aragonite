title = "In search of the genetic footprints of Sumerians: a survey of Y-chromosome and mtDNA variation in the Marsh Arabs of Iraq | BMC Ecology and Evolution | Full Text"
description = "Background For millennia, the southern part of the Mesopotamia has been a wetland region generated by the Tigris and Euphrates rivers before flowing into the Gulf. This area has been occupied by human communities since ancient times and the present-day inhabitants, the Marsh Arabs, are considered the population with the strongest link to ancient Sumerians. Popular tradition, however, considers the Marsh Arabs as a foreign group, of unknown origin, which arrived in the marshlands when the rearing of water buffalo was introduced to the region. Results To shed some light on the paternal and maternal origin of this population, Y chromosome and mitochondrial DNA (mtDNA) variation was surveyed in 143 Marsh Arabs and in a large sample of Iraqi controls. Analyses of the haplogroups and sub-haplogroups observed in the Marsh Arabs revealed a prevalent autochthonous Middle Eastern component for both male and female gene pools, with weak South-West Asian and African contributions, more evident in mtDNA. A higher male than female homogeneity is characteristic of the Marsh Arab gene pool, likely due to a strong male genetic drift determined by socio-cultural factors (patrilocality, polygamy, unequal male and female migration rates). Conclusions Evidence of genetic stratification ascribable to the Sumerian development was provided by the Y-chromosome data where the J1-Page08 branch reveals a local expansion, almost contemporary with the Sumerian City State period that characterized Southern Mesopotamia. On the other hand, a more ancient background shared with Northern Mesopotamia is revealed by the less represented Y-chromosome lineage J1-M267*. Overall our results indicate that the introduction of water buffalo breeding and rice farming, most likely from the Indian sub-continent, only marginally affected the gene pool of autochthonous people of the region. Furthermore, a prevalent Middle Eastern ancestry of the modern population of the marshes of southern Iraq implies that if the Marsh Arabs are descendants of the ancient Sumerians, also the Sumerians were most likely autochthonous and not of Indian or South Asian ancestry."
full_description = '''Research article Open access Published: 04 October 2011 In search of the genetic footprints of Sumerians: a survey of Y-chromosome and mtDNA variation in the Marsh Arabs of Iraq Nadia Al-Zahery1, Maria Pala1, Vincenza Battaglia1, Viola Grugni1, Mohammed A Hamod2,3, Baharak Hooshiar Kashani1, Anna Olivieri1, Antonio Torroni1, Augusta S Santachiara-Benerecetti1 & …Ornella Semino1,4 Show authors BMC Evolutionary Biology volume 11, Article number: 288 (2011) Cite this article 97k Accesses 206 Altmetric Metrics details AbstractBackgroundFor millennia, the southern part of the Mesopotamia has been a wetland region generated by the Tigris and Euphrates rivers before flowing into the Gulf. This area has been occupied by human communities since ancient times and the present-day inhabitants, the Marsh Arabs, are considered the population with the strongest link to ancient Sumerians. Popular tradition, however, considers the Marsh Arabs as a foreign group, of unknown origin, which arrived in the marshlands when the rearing of water buffalo was introduced to the region.ResultsTo shed some light on the paternal and maternal origin of this population, Y chromosome and mitochondrial DNA (mtDNA) variation was surveyed in 143 Marsh Arabs and in a large sample of Iraqi controls. Analyses of the haplogroups and sub-haplogroups observed in the Marsh Arabs revealed a prevalent autochthonous Middle Eastern component for both male and female gene pools, with weak South-West Asian and African contributions, more evident in mtDNA. A higher male than female homogeneity is characteristic of the Marsh Arab gene pool, likely due to a strong male genetic drift determined by socio-cultural factors (patrilocality, polygamy, unequal male and female migration rates).ConclusionsEvidence of genetic stratification ascribable to the Sumerian development was provided by the Y-chromosome data where the J1-Page08 branch reveals a local expansion, almost contemporary with the Sumerian City State period that characterized Southern Mesopotamia. On the other hand, a more ancient background shared with Northern Mesopotamia is revealed by the less represented Y-chromosome lineage J1-M267*. Overall our results indicate that the introduction of water buffalo breeding and rice farming, most likely from the Indian sub-continent, only marginally affected the gene pool of autochthonous people of the region. Furthermore, a prevalent Middle Eastern ancestry of the modern population of the marshes of southern Iraq implies that if the Marsh Arabs are descendants of the ancient Sumerians, also the Sumerians were most likely autochthonous and not of Indian or South Asian ancestry. BackgroundThe Near East is well known for its important role in human history, particularly as a theatre for great historical events that changed the face of the world during the Neolithic period. The temperate climate and fertile soil brought by the continuous flooding of the Tigris and Euphrates rivers, made the Mesopotamian region ideal for early revolutions in agriculture and farming. In particular, the southern part of Mesopotamia (the delta between the two rivers in the present day southern Iraq) has been historically known as the Garden of Eden (biblical name) or Sumer Land, the land of Abraham.The Mesopotamian civilization originated around the 4th millennium BC in the low course of the Tigris and Euphrates rivers. This alluvial territory, which emerged progressively by soil sedimentation, attracted different populations from the northern and eastern mountains but, whereas traces of their culture are present in the territory, as documented by the Ubaid-Eridu pottery, nothing is available for their identification. Only two groups of populations arrived later and in larger number leaved historical records: Sumerian and Semitic groups. The Sumerians, who spoke an isolated language not correlated to any linguistic family, are the most ancient group living in the region for which we have historical evidence. They occupied the delta between the two rivers in the southern part of the present Iraq, one of the oldest inhabited wetland environments. The Semitic groups were semi-nomadic people who spoke a Semitic language and lived in the northern area of the Syro-Arabian desert breeding small animals. From here, they reached Mesopotamia where they settled among the pre-existing populations. The Semitic people, more numerous in the north, and the Sumerians, more represented in the south, after having adsorbed the pre-existing populations, melted their cultures laying the basis of the western civilization [1].Mesopotamia MarshesThe Mesopotamian marshes are among the oldest and, until twenty years ago, the largest wetland environments in Southwest Asia, including three main areas (Figure 1): the northern Al-Hawizah, the southern Al-Hammar and the so-called Central Marshes all rich in both natural resources and biodiversity [2, 3]. However, during the last decades of the past century, a systematic plan of water diversion and draining drastically reduced the extension of the Iraqi marshes, and by the year 2000 only the northern portion of Al-Hawizah (about 10% of its original extension) remained as functioning marshland whereas the Central and Al-Hammar marshes were completely destroyed. This ecological catastrophe constrained Marsh Arabs of the drained zones to leave their niche: some of them moved to the dry land next to the marshes and others went in diaspora. However, due to the attachment to their lifestyle, Marsh Arabs have been returned to their land as soon as the restoration of marshes began (2003) [4].Figure 1Map of Iraq illustrating present and former Marsh areas. The majority of the subjects analysed in this study are from the Al-Hawizah Marshes, the only natural remaining marsh area in southern Iraq [4].Full size imageThe ancient inhabitants of the marsh areas were Sumerians, who were the first to develop an urban civilization some 5,000 years ago. Although footprints of their great civilization are still evident in prominent archaeological sites lying on the edges of the marshes, such as the ancient Sumerian cities of Lagash, Ur, Uruk, Eridu and Larsa, the origin of Sumerians is still a matter of debate [5]. With respect to this question, two main scenarios have been proposed: according to the first, the original Sumerians were a group of populations who had migrated from "the Southeast" (India region) and took the seashore route through Arabian Gulf before settling down in the southern marshes of Iraq [6]. The second hypothesis posits that the advancement of the Sumerian civilization was the result of human migrations from the mountainous area of Northeastern Mesopotamia to the southern marshes of Iraq [7], with ensuing assimilation of the previous populations.Over time, the many historical and archaeological expeditions that have been conducted in the marshes have consistently reported numerous parallelisms between the modern and ancient life styles of the marsh people [8, 9]. Details such as home architecture (particular arched reed buildings), food gathering (grazing water buffalos, trapping birds and spearing fish, rice cultivation), and means of transportation (slender bitumen-covered wooden boats, called "Tarada") are documented as still being practiced by the indigenous population locally named "Ma'dan" or "Marsh Arabs" [10, 11]. This village life-style, which has remained unchanged for seven millennia, suggests a possible link between the present-day marsh inhabitants and ancient Sumerians. However, popular tradition considers the Marsh Arabs as a foreign group, of unknown origin, which arrived in the marshlands when the rearing of water buffalo was introduced to the region.In order to shed some light on the origin of the ancient and modern Mesopotamian marsh populations, which remains ambiguous in spite of all the above mentioned theories, the genetic variation of a sample of "Marsh Arabs" has been investigated both for the maternally transmitted mitochondrial DNA (mtDNA) and the Male Specific region of the Y chromosome (MSY).MethodsThe sampleThe sample consists of 143 healthy unrelated males, mainly from the Al-Hawizah Marshes (the only not drained South Iraqi marsh area[4] (Figure 1). For each subject the "Marsh Arab" ancestry (at least for last four generations) was ascertained by interview after having obtained the informed consent. The collection (5-10 ml of blood each, in EDTA) was carried out in different villages during a field expedition. DNA was extracted from whole blood by using a standard phenol/chloroform protocol. For comparison, a sample of 154 Iraqi subjects representative of the general Iraqi population and therefore referred throughout the text as "Iraqi" was investigated for both mtDNA and Y-chromosome markers. This sample, previously analysed at low resolution [12] is mainly composed of Arabs, living along the Tigris and Euphrates Rivers. In addition, the distribution of the Y-chromosome haplogroup (Hg) J1 sub-clades was also investigated in four samples from Kuwait (N = 53), Palestine (N = 15), Israeli Druze (N = 37) and Khuzestan (South West Iran, N = 47) as well as in more than 3,700 subjects from 39 populations, mainly from Europe and the Mediterranean area but also from Africa and Asia [13, 14].This research was approved by the Ethics Committee for Clinical Experimentation at the University of Pavia (Board minutes of October 5, 2010).Y-chromosome genotypingY-chromosome haplogroup affiliation was determined according to the most recently updated phylogeny [15, 16] by genotyping, in hierarchical order, 46 single nucleotide polymorphisms (SNPs) (see the phylogeny in Figure 2 of the Result section). The nomenclature was according to the Y chromosome Consortium rules [17–19].Mutations were detected either as RFLPs or by DHPLC of pertinent fragments amplified by PCR [Additional file 1]. When necessary, results were verified by sequencing.J1-M267 Y chromosomes were analysed for a panel of eight Y-chromosome microsatellite loci (DYS19, YCAIIa/b, DYS389I/II, DYS390, DYS391 and DYS392) by using multiplex reactions according to the STR DNA Internet Data Base [20] and fragment analysis by capillary electrophoresis on ABI PRISM® 3100 Genetic Analyzer.MtDNA genotypingAffiliation within mtDNA haplogroups was first inferred through the sequencing of a fragment of 746-846 base pairs (bps) from the control region that, according to the rCRS [21], encompasses the entire hypervariable segment I (HVS-I) and part of HVS-II and then confirmed through a hierarchical survey by PCR-RFLP/sequencing of coding region haplogroup diagnostic markers. [Additional file 2]. The nomenclature was according to van Oven and Kayser, built 12 (20 July 2011) [22].Sequence analysis of the control region was performed by using primers F15973 (5'- AACTCCACCATTAGCACCCA-3') and R263 (5'-TGGCTGTGCAGACATTCAAT-3') on amplicons obtained by using the primers F15877 (5'-CAAATGGGCCTGTCCTTGTA-3') and R468 (5'-GGAGTGGGAGGGGAAAATAA-3') [23]. All the samples were sequenced starting from primer F15973. Samples showing potential heteroplasmies or ambiguities were also sequenced with primer R263.Statistical analysisHaplogroup diversity (H) was computed by using the standard method of Nei [24]. Principal component (PC) analysis was performed on haplogroup frequencies using Excel software implemented by XLstat. The relative amount of accumulated diversity, as a function of geography, was evaluated through the mean microsatellite variance estimated on at least five individuals. Haplogroup frequency and variance maps were generated by using Surfer software [25], following the Kriging procedure. Median-Joining (MJ) networks [26] were constructed by the Network 4.5.0.0 program [27]. MtDNA and Y-chromosome networks were obtained by the MJ method, with ε = 0 and weighting markers according to their relative stability (Y-chromosome: microsatellite loci were weighted proportionally to the inverse of the repeat variance of each haplogroup. MtDNA: coding region was weighted as four; control region as one - see Additional file 2) and after having processed the data with the reduced-median method. The age of microsatellite variation within haplogroups was evaluated according to Zhivotovsky et al. [28] and Sengupta et al. [29] and through the BATWING procedure (Bayesian Analysis of Trees With Internal Node Generation) [30]. Batwing runs used a model assuming an initial constant population size followed by expansion at time β with a growth rate of α. Alfa and beta parameters were as in Tofanelli et al. [31]. For both methods the effective mutation rate and a generation time of 25 years [28] were used.ResultsY-chromosome variationThe screening of 45 SNPs, plus one identified in this survey, in Marsh Arabs and Iraqis identified 28 haplogroups, 14 in the marsh sample and 22 in the control Iraqis. Only eight haplogroups were shared by both groups. Their phylogenetic relationships and frequencies are shown in Figure 2. More than 90% of both Y-chromosome gene pools can be traced back to Western Eurasian components: the Middle Eastern Hg J-M304, the Near Eastern Hgs G-M201, E-M78 and E-M123, while the Eurasian Hgs I-M170 and R-M207 are scarce and less common in the Marsh Arabs than in the control sample. Contributions from eastern Asia, India and Pakistan, represented by Hgs L-M76, Q-M378 and R2-M124, are detected in the Marsh Arabs, but at a very low frequency.Figure 2Phylogeny of Y-chromosome haplogroups and their frequencies (%) in Marsh Arab and Iraqi populations. Haplogroups are labelled according to the Y Chromosome Consortium [17, 18] and the International Society of Genetic Genealogy [16]. Differently from previously reported [19], the M365 mutation was observed in two J1-Page08 Y-chromosomes (Marsh Arabs). In these two subjects, M365 was observed in association with the new mutation L267.2 discovered while typing the M365 marker. It consists of an A to G transition at nucleotide position 159. The markers P37, M253, M223 of haplogroup I, M81 and M293 of haplogroups E, and M367, M368 and M369 of haplogroup J1 were typed but not observed. A star (*) indicates a paragroup: a group of Y chromosomes not defined by any reported phylogenetic downstream mutation. nt: not tested. (a) Heterogeneity.Full size imageHaplogroup J accounts for 55.1% of the Iraqi sample reaching 84.6% in the Marsh Arabs, one of the highest frequencies reported so far. Unlike the Iraqi sample, which displays a roughly equal proportion of J1-M267 (56.4%) and J2-M172 (43.6%), almost all Marsh Arab J chromosomes (96%) belongs to the J1-M267 clade and, in particular, to sub-Hg J1-Page08. Haplogroup E, which characterizes 6.3% of Marsh Arabs and 13.6% of Iraqis, is represented by E-M123 in both groups, and E-M78 mainly in the Iraqis. Haplogroup R1 is present at a significantly lower frequency in the Marsh Arabs than in the Iraqi sample (2.8% vs 19.4%; P < 0.001),'''
