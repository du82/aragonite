title = "Complementing aculiferan mitogenomics: comparative characterization of mitochondrial genomes of Solenogastres (Mollusca, Aplacophora) | BMC Ecology and Evolution | Full Text"
description = "Background With the advances in high-throughput sequencing and bioinformatic pipelines, mitochondrial genomes have become increasingly popular for phylogenetic analyses across different clades of invertebrates. Despite the vast rise in available mitogenomic datasets of molluscs, one class of aplacophoran molluscs – Solenogastres (or Neomeniomorpha) – is still neglected. Results Here, we present six new mitochondrial genomes from five families of Solenogastres (Amphimeniidae, Gymnomeniidae, Proneomeniidae, Pruvotinidae, Simrothiellidae), including the first complete mitogenomes, thereby now representing three of the four traditional orders. Solenogaster mitogenomes are variable in size (ranging from approximately 15,000 bp to over 17,000 bp). The gene order of the 13 protein coding genes and two rRNA genes is conserved in three blocks, but considerable variation occurs in the order of the 22 tRNA genes. Based on phylogenetic analyses and reconstruction of ancestral mitochondrial genomes of Aculifera, the position of (1) trnD gene between atp8 and atp6, (2) trnT and P genes between atp6 and nad5, and (3) trnL1 gene between G and E, resulting in a ‘MCYWQGL1E’-block of tRNA genes, are all three considered synapomorphies for Solenogastres. The tRNA gene block ‘KARNI’ present in Polyplacophora and several conchiferan taxa is dissolved in Solenogastres. Conclusion Our study shows that mitogenomes are suitable to resolve the phylogenetic relationships among Aculifera and within Solenogastres, thus presenting a cost and time efficient compromise to approach evolutionary history in these clades."
full_description = "Research Open access Published: 18 October 2024 Complementing aculiferan mitogenomics: comparative characterization of mitochondrial genomes of Solenogastres (Mollusca, Aplacophora) Franziska S. Bergmeier1, Andreas Brachmann2, Kevin M. Kocot3, Francesca Leasi4, Albert J. Poustka5,6, Michael Schrödl7, Joseph L. Sevigny8, W. Kelley Thomas8, Christiane Todt9 & …Katharina M. Jörger7 Show authors BMC Ecology and Evolution volume 24, Article number: 128 (2024) Cite this article 788 Accesses Metrics details AbstractBackgroundWith the advances in high-throughput sequencing and bioinformatic pipelines, mitochondrial genomes have become increasingly popular for phylogenetic analyses across different clades of invertebrates. Despite the vast rise in available mitogenomic datasets of molluscs, one class of aplacophoran molluscs – Solenogastres (or Neomeniomorpha) – is still neglected.ResultsHere, we present six new mitochondrial genomes from five families of Solenogastres (Amphimeniidae, Gymnomeniidae, Proneomeniidae, Pruvotinidae, Simrothiellidae), including the first complete mitogenomes, thereby now representing three of the four traditional orders. Solenogaster mitogenomes are variable in size (ranging from approximately 15,000 bp to over 17,000 bp). The gene order of the 13 protein coding genes and two rRNA genes is conserved in three blocks, but considerable variation occurs in the order of the 22 tRNA genes. Based on phylogenetic analyses and reconstruction of ancestral mitochondrial genomes of Aculifera, the position of (1) trnD gene between atp8 and atp6, (2) trnT and P genes between atp6 and nad5, and (3) trnL1 gene between G and E, resulting in a ‘MCYWQGL1E’-block of tRNA genes, are all three considered synapomorphies for Solenogastres. The tRNA gene block ‘KARNI’ present in Polyplacophora and several conchiferan taxa is dissolved in Solenogastres.ConclusionOur study shows that mitogenomes are suitable to resolve the phylogenetic relationships among Aculifera and within Solenogastres, thus presenting a cost and time efficient compromise to approach evolutionary history in these clades. Peer Review reports BackgroundSignificant advancements in sequencing technology and data mining have resulted in a remarkable increase in the availability of mitochondrial genomes (mitogenomes) in recent decades, revealing a great diversity in genome size and genome architecture across various phyla of Metazoa. Bilaterian animals usually have highly compact (approximately 16 kb) and circular mitogenomes, comprising a standard set of 13 protein coding genes (PCGs), two ribosomal RNA (rRNA) genes and 22 transfer RNA (tRNA) genes [1]. However, there are a few exceptions such as the absence of atp8 in nematodes and flatworms [2, 3]. Several major groups of Metazoa have been recognized to have a high consistency in mitochondrial gene order with only few rearrangements [4], but even in intensively studied vertebrate mitogenomes this presumed conservation [5] has been questioned recently, revealing numerous (mainly tRNA related) rearrangements [6]. Molluscan mitogenomes in particular defy classic textbook concepts by displaying an exceptionally high degree of diversity: Molluscan mitogenomes vary tremendously in size, from compact genomes of heterobranch gastropods which are 13.6 kb in length to the largest known animal mitogenome found in a scallop, which exceeds 50 kb [7, 8]. Gene rearrangements, including those involving PCGs and rRNA genes have been reported across most major molluscan groups (see e.g [9]. and references therein), likely mediated through ‘tandem duplication random losses’ of tRNA genes [10]. Even instances of gene duplications have been documented, e.g., as much as six duplicated genes in species of deep-sea squid [11] and a putative loss of atp8 in some bivalves [12]. Lastly, regarding mitochondrial inheritance, atypical patterns featuring the transmission of mtDNAs from both maternal and paternal lineages occur in certain bivalves (termed doubly uniparental inheritance – DUI [9, 13]).Increase in data availability and enhanced bioinformatic pipelines have also increased the use of mitogenomes in phylogenetic studies. Mitogenomic data have helped support novel evolutionary hypotheses and taxonomic revisions across various groups of invertebrates like arthropods, annelids, echinoderms and molluscs (e.g [14,15,16,17]. Due to the exceptionally high degree of rearrangements in molluscan mitogenome evolution and high substitution rates, the use of mitogenomes to resolve deep molluscan relationships has seen little promise, hampered by convergent evolution and long branch attraction in phylogenetic analyses (see e.g [18,19,20]). In contrast, at lower taxonomic level with denser taxon sampling, mitogenomes have delivered promising results to elucidate phylogenetic relationships [9, 21,22,23,24]. By now, a little over 1,250 molluscan mitochondrial genomes are currently available in NCBI’s Nucleotide database (accessed 21th of January 2024, search term: “Mollusca mitochondrion complete genome”), with the vast majority belonging to well-known classes like Cephalopoda, Bivalvia, and Gastropoda [9]. While mitogenomes of minor molluscan classes like Monoplacophora, Caudofoveata and Scaphopoda have been sequenced and comparatively studied [19, 22, 25,26,27,28,29], aplacophoran Solenogastres still lack a complete annotated mitochondrial genome. With only one incomplete (Neomenia carinata from Mikkelsen et al. [22]) and one unverified and unpublished mitochondrial genome (Epimenia babai, GenBank accession number MT798543.1) available on GenBank [22], the contribution of this little-known class of molluscs to the diversity of molluscan mitogenomes remains unknown, and its potential towards a better understanding of the complex evolution of mitochondrial genomes in molluscs remains unexplored.This shortcoming is particularly critical as Solenogastres play a crucial role in our understanding of deep molluscan evolution: In contrast to earlier views on molluscan evolution based on morphological data, which placed Solenogastres and Caudofoveata (either as a monophylum or grade) at the base of the molluscan tree [30,31,32] modern phylogenomic analyses consistently converge towards the Conchifera-Aculifera hypothesis, i.e., a basal dichotomy between primarily shell-bearing (Conchifera) and spicule-bearing molluscs (Aculifera, with Polyplacophora as sister group to aplacophoran Caudofoveata and Solenogastres) [33,34,35]. This evolutionary scenario is further supported by comparative developmental and gene expression studies [36, 37]. Therefore, analyzing the diversity of solenogaster mitogenomes might impact our understanding of ancestral gene arrangements of Aculifera and provide another step towards a solid hypothesis on the evolution of molluscan mitogenomes.Moreover, phylogenetic relationships of Solenogastres have been shown to be at odds with the established systematics of the group. Over the past 150 years, around 300 species of this class have been formally described and classified based mainly on external morphology (i.e., habitus and scleritome) and internal anatomy (among others characters of the reproductive system, different glands associated with the digestive system (for monographies and systematics see [38,39,40,41])). However, morphocladistic approaches have been unable to resolve internal relationships of Solenogastres, likely due to the high degree of convergent evolution found in these worm-shaped molluscs [42]. Recent phylogenetic studies based on two mitochondrial markers [43] and transcriptomic data [44, 45] have revealed conflicts in traditional systematics, such as rendering one of the main orders (Cavibelonia Salvini-Plawen, 1978) paraphyletic and presenting a new hypothesis on the sister group to all other remaining Solenogastres (family Amphimeniidae Salvini-Plawen, 1972) [43, 44] (but see [45] for alternative hypotheses). Each of those phylogenetic approaches has their strengths and weaknesses: Transcriptomic analyses are powerful in resolving phylogenetic relationships among Solenogastres [44], but this approach is potentially more costly and bioinformatically challenging, limiting their application across large-scale taxon sampling. On the other hand, multi marker barcoding approaches are easily accessible and cost-efficient allowing for dense taxon sampling, but often provide poor resolution for deeper nodes [43, 46]. In Solenogastres, sequencing of additional nuclear markers is hampered by secondary structures and generally results in the amplification of exogenous DNA, i.e. gut contents [47,48,49].In this study, we aim to explore the potential of mitogenomics as an intermediate solution for resolving the phylogenetic relationships of Solenogastres (see [50] for mitogenomes as a reliable compromise in non-model taxa). We provide the first complete mitochondrial genomes of Solenogastres, generated from six species representing the two most speciose orders “Cavibelonia” Salvini-Plawen, 1978 and Pholidoskepia Salvini-Plawen, 1978. We comparatively analyze their genomic architecture and investigate taxon-specific modifications such as gene (re)arrangements. We explore whether mitogenomic gene arrangements provide (syn)apomorphic characters useful for phylogenetic inference and investigate if protein coding genes and ribosomal RNA genes can potentially result in well-resolved tree topologies.By complementing data on this still neglected class of molluscs to the existing knowledge of molluscan mitogenome diversity, we aim to critically reassess previous hypotheses on ancestral mitogenome order in major molluscan clades, establish a hypothesis on the ancestral solenogaster mitogenome, and discuss its potential impact on the ancestral aculiferan mitogenome.ResultsCharacteristics of solenogaster mitochondrial genomesThe complete mitochondrial genome of Pruvotininae sp. is 15,347 base pairs (bp) long and contains the standard set of 13 protein coding genes (PCGs), two rRNA genes, and 22 tRNA genes (Fig. 1). Other analyzed mitogenomes range in size from 15,103 (Dorymenia sp.) to 17,090 bp (Wirenia argentea) (Table 1). All complete mitogenomes consist of the standard set of 37 genes (Fig. 2, see also Supplementary Table 1).Fig. 1Illustration of the circularized mitochondrial genome of Pruvotininae sp. (Pruvotinidae). Arrows indicate direction of transcription. Protein coding genes in green, ribosomal RNA in blue, transfer RNA in red. Body size of animal approx. 2 mmFull size imageTable 1 Solenogaster mitogenomes used in the present study and associated sampling dataFull size tableThe GC contents in complete mitogenomes range from 23.4% in Wirenia argentea to 31.3% in Kruppomenia borealis, indicating a nucleotide compositions bias towards A + T. Most complete mitochondrial genomes exhibit negative AT-skews (ranging from 0.0813 in W. argentea to -0.1772 in Dorymenia sp.) and positive GC-skews (from 0.1562 in W. argentea to 0.2812 in Dorymenia sp.), except for Pruvotininae sp. which shows slightly positive AT- and GC-skews (0.0057 / 0.00124) (see supplementary Table 2). T and G skew is present in all PCGs. PCGs encoded on the forward strand are also skewed towards T and G while PCGs of the reverse strand are skewed towards T and C, except for Pruvotininae sp. and Dorymenia sp. with a skew towards T + G, respectively A + C on the reverse strand (see supplementary Table 2). Across PCGs of all complete investigated mitogenomes, A + T contents of the third codon positions are highest (72.6 − 84.7%), followed by the second (64.2 − 69.8%) and first codon positions (61.5 − 76.3%) (supplementary Table 2).The distribution of PCGs is nearly equal between the two strands and follows a consistent distribution across all analyzed Solenogastres. The cytochrome c oxidase subunits (cox1, cox2, cox3), ATP synthase subunits (atp6, atp8), and NADH dehydrogenase subunits (nad2 and nad3) are located on the plus strand, while the remaining nads (nad1, nad4, nad4L, nad5 and nad6) along with cytochrome b (cob) are located on the minus strand (Fig. 2). Both ribosomal genes (rrnS and rrnL) are located on the minus strand, and between nine to ten of the typical 22 tRNA genes are situated on the plus strand, with the rest on the minus strand. However, in Wirenia argentea tRNAs I, K, R, N, A, and S1 genes are reversed to the minus strand forming a cluster of 14 tRNAs in total, leaving only three tRNA genes (D, T, P) on the plus strand (Fig. 2).Fig. 2Maximum-likelihood tree of Solenogastres (based on 13 protein coding genes translated into amino acids) showing respective mitogenomic gene arrangements. Dotted orange boxes indicate blocks with variations in gene arrangement, dotted black lines indicate missing sections. Protein coding genes in green, ribosomal RNA in blue, transfer RNA in red. Body sizes: Amphimeniidae sp., 62 mm; Alexandromenia crassa, 21 mm, Wirenia argentea, 6 mm, Pruvotininae sp., 2 mm, Neomenia carinata 15 mm, Kruppomenia borealis, 8 mm, Dorymenia sp., 50 mmFull size imageAll Solenogastres exhibit a highly conserved gene order arranged into three main blocks (see Fig. 3). The first block on the forward strand consists of cox1, cox2, atp8, D, atp6, T, P. The second block on the reverse strand includes F, nad5, H, nad4, nad4L, S2, cob, nad6, nad1, L2, rrnL (16S rRNA), V, rrnS (12S rRNA), M, C, Y, W, Q, G, L1, E (in Wirenia argentea transpositioned to E, L1). The third block on the forward strand contains cox3, nad3, and nad2, along with the tRNA K, A, R, N, I, and S1 genes. However, this third block displays the most rearrangements among the investigated solenogaster mitogenomes, as the positions of the tRNA A, I, K, R, N genes are highly variable among species (Fig. 2).Five different start codons with varying frequencies initiate transcription of protein coding genes in the studied mitogenomes (see Supplementary Table 1). The most common start codons, ATG (in total occurring 48 times across all investigated mitogenomes), ATA (occurring 27x), and ATT (11x) are found in most mitogenomes, except for Kruppomenia borealis, which lacks ATT. These start codons are typically present in genes such as nad1, nad4, nad5, nad6, and cob. Additional start codons TTG (2x) and GTG (2x) are present in atp6 of Pruvotininae sp., Kruppomenia borealis, and Amphimeniidae sp., and in nad4L of Pruvotininae sp. PCGs are mostly terminated via complete stop codons TAA (50x), TAG (15x), but also the truncated stop codons T(AA) (18x) and rarely TA(A) (once in W. argentea, K. borealis, and N. carinata each) which are completed post-transcriptionally through polyadenylation [9]. All investigated mitogenomes contain two types of stop codons (TAA and its truncated versions T(AA) and TA(A), as well as TAG) (see Supplementary Table 1), except for Pruvotininae sp. with only TAA (or its truncated version) as a stop codon (see Supplementary Fig. 1). The most frequently us"
