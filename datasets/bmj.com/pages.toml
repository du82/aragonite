["http://www.bmj.com/freezikaresources"]
title = "Zika virus – All BMJ resources are freely available | The BMJ"
description = "This page is a collection of free resources from across BMJ and elsewhere. It aims to inform clinicians about the global threat posed by the virus, and will be continuously updated as new information comes to light. It includes content in Chinese, Spanish, and Brazilian Portugese."
full_description = "This page is a collection of free resources from across BMJ and elsewhere. It aims to inform clinicians about the global threat posed by the virus, and will be continuously updated as new information comes to light. It includes content in Chinese, Spanish, and Brazilian Portugese. See a quick overview of the key facts, including countries affected, and advice on prevention, diagnosis and management of patients returning from outbreak areas. Public Health England and the National Travel Health Network and Centre advise that women who are pregnant (any trimester) or who plan to become pregnant should consider avoiding travel to any area where active transmission of Zika virus is being reported (box).2 They say that if you can’t avoid travelling to one of these countries you should take great care to avoid mosquito bites. The US Centers for Disease Control advises pregnant women to wear clothing that covers up as much of their body as possible (long sleeves, trousers, hat).3 It also advises travellers to use a good repellent on exposed skin during the day as well as at night and particularly during mid-morning and late afternoon to dusk, when the mosquito that transmits Zika is most active. Repellents that contain N, N-diethylmetatoluamide (DEET), picaridin, and IR3535 are all safe for pregnant women, provided that they follow the instructions, says the CDC.3 It says that if you need sunscreen you should apply repellent after sunscreen and should stay or sleep in a screened or air conditioned room or use a bed net. Most people infected with the Zika virus will not get symptoms, and if they do these are usually mild. Symptoms can include fever, rash, itching, joint pain, headache, muscle pain, eye pain, and conjunctivitis.2 There is no specific treatment, but you can take paracetamol for a fever and to ease any joint pain. However, if you’re pregnant avoid aspirin and other non-steroidal anti-inflammatory drugs.3 If you’re pregnant and think you have been infected with the Zika virus you can be tested."
