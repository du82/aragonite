title = "Re: How can I be antiracist? | The BMJ"
full_description = "Article Related content Article metrics Rapid responses Response Rapid Response: Re: How can I be antiracist? Dear Editor, As an Italian doctor practising in the UK for over 20 years, I welcome the call to action in Abi Rimmer’s article (BMJ 2025;388:r349) to actively challenge racism in healthcare. The insights from Goyal, Kar, and Mensah rightly emphasize systemic racial inequities and the need for courage in dismantling them. However, I urge the BMJ and its readers to broaden this lens to include subtler biases—such as those based on nationality, accent, or perceived cultural identity—that also shape our profession and patient care. My experiences, including patients’ shifting attitudes when I clarify I am Italian rather than Polish, reveal how discrimination extends beyond race to intersect with other identities. These biases, often overlooked, influence career opportunities, workplace dynamics, and trust in healthcare settings. The NHS’s diversity is a strength, yet its workforce and patients face prejudices not fully captured by a race-only framework. Integrating cultural competence into medical education and policy, as suggested by Betancourt et al. (Health Aff 2005;24:499-505), could address these gaps, complementing antiracism efforts. Antiracism is vital, but a truly inclusive approach must ‘say it, see it, and sort it’ for all forms of discrimination. I hope future discussions will reflect this complexity, ensuring no one’s experience is left unseen. Competing interests: No competing interests 04 March 2025 Edoardo Cervoni Physician Southport googletag.cmd.push(function() { googletag.display('div-gpt-ad-7326006-2'); }); googletag.cmd.push(function() { googletag.display('div-gpt-ad-7326006-3'); });"
