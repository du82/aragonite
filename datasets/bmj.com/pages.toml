title = "Complaints procedure | The BMJ"
description = "This procedure applies to complaints that relate to content, procedures or policies that are the responsibility of BMJ or our editorial staff. Complaints may provide an opportunity and a spur for improvement, and we aim to respond quickly, courteously, and constructively. The procedure outlined below aims to be fair to those making complaints and those complained about."
full_description = "This procedure applies to complaints that relate to content, procedures or policies that are the responsibility of BMJ or our editorial staff. Complaints may provide an opportunity and a spur for improvement, and we aim to respond quickly, courteously, and constructively. The procedure outlined below aims to be fair to those making complaints and those complained about. The complaint must relate to content, procedures or policies that are the responsibility of BMJ or our editorial staff. We define a complaint as: • anything defined as a complaint by the complainant and • anything we believe goes beyond an expression of disagreement with a decision and identifies a perceived failure of process or severe misjudgement Complaints should be directly emailed to complaints@bmj.com, and will be dealt with confidentially. This email address is solely for complaints as defined above - any other issues should be directed to support@bmj.com. Complaints at BMJ are coordinated by the complaints team with individual complaints handled by the relevant member of the editorial team and the opportunity for escalation if they cannot be resolved. • In the case that this initial response is felt to be insufficient, the complainant can request that their complaint is escalated to a more senior member of the team. • If the complainant remains unhappy, complaints may be escalated to an executive editor and ultimately the editor in chief, whose decision is final. • If a complainant remains unhappy after what the editor in chief considers a definitive reply, the complainant may complain to an external body (see below). Complaints that are not under the control of The BMJ's editorial staff will be sent to the relevant heads of department within BMJ Publishing Group. Complaints sent to the BMJ's chairman or chief executive officer, or to the BMA or affiliated society officials, will usually be referred to the editor in chief. • All complaints will be formally acknowledged within three working days. • If possible a full response will be made within two weeks. If this is not possible, an interim response will be given within two weeks. Further interim responses will be provided until the complaint is resolved. • Where we consider a complaint to be vexatious or the result of a coordinated campaign, we reserve the right to reply outside of the suggested time frames, and on some occasions we may not respond to all complainants individually."
