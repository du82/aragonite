["http://www.bmj.com/about-bmj/resources-authors/article-types/student"]
title = "BMJ Student | The BMJ"
description = "Is The BMJ the right journal for my article? Which research does The BMJ prioritise? Advice on OA and peer review, writing, laying out, and submitting articles."
full_description = "We invite medical students and newly qualified doctors to submit pitches for articles on issues related to medical student life, career planning, and education. We only consider articles that have been pitched first. For Opinion, Feature and Careers articles, please fill in the Student pitch form. The pitch forms give us the information to decide whether to encourage the article. If we like your idea, we will give you more information and invite you to submit a first draft with a declaration of interests form. We aim to respond to pitches within a month. We do not accept: • Articles on rare diseases • Dissertations, essays, or reflections • Elective reports • Original research • Reviews of products • Reviews of new drugs or therapies We aim to read new submissions within a month. Your article may undergo peer review from students or clinicians, depending on its content. Peer review can take weeks to months. If we are interested in publication, editors will ask you to make changes. The article may need to be revised multiple times before it is accepted for publication. There is no guarantee of publication and the editor reserves the right to reject articles at any stage, even if this view does not match the views of advisers or reviewers. Most articles are published within two months of acceptance. Student content is published online all year round, and we publish a printed magazine in September, aimed at freshers. • Check that we haven't published something similar in the last two years • Make it clear why the subject is relevant to medical students, and what the message is. What will medical students do or think about differently after reading your article? • Write in a balanced way for Life and Careers articles (exploring the topic from multiple angles, including pros and cons) • Consider short interviews with students, doctors, or others with relative experience or expertise for Life and Careers articles • Write as you speak in simple, direct English, and explain specialist terms • Ask your peers or an expert to review your idea before submission"
