["http://www.bmj.com/collections"]
title = "The BMJ Collections | The BMJ"
full_description = "This Collection offers new analyses and actions to tackle the challenges to adolescent girls’ nutrition in South Asia. In this collection, experts from China shed light on the current state and challenges of non-communicable chronic disease prevention and control and discuss future strategies for tackling the problem. In this collection, experts explore priorities for the research community in a post-covid context to help the UK better prepare for future health shocks of all kinds and to mitigate their impact on healthcare practice and health outcomes. Experts from China analyse the current state of women’s health; review achievements and remaining challenges in the contexts of women’s empowerment and rights, labour force participation, and family and community dynamics; and make recommendations for promoting women’s future health, with a focus on sexual and reproductive health. Gender equality in the health workforce has been repeatedly called for worldwide, but with little global progress and a lack of deep examination within countries. In this collection, a special focus on India and Kenya is undertaken, with new evidence and analysis considering a range of factors driving equality of opportunity for women’s health careers. This collection aims to stimulate debate among policymakers, researchers, and communities on how to create healthy societies by considering the political economy, whole of society approaches, and social movements. The covid-19 burden in the US was among the worst globally and the response followed a uniquely American path — fragmented public health responsibilities across federal and state jurisdictions, chronic underinvestment in public health, absence of social safety nets and workplace protections, insufficient legal infrastructure, and long standing social and income inequalities, underpinned by structural racism. How can we draw insights from research conducted using social media to understand its effects on beliefs and behaviours around vaccination, and to influence population health outcomes? This collection brings together research examining the diverse relationships between social media use and vaccination beliefs and behaviours globally."
