["https://bmj.com/content/388/bmj-2024-079458"]
title = "Diagnosis and management of complex post-traumatic stress disorder (C-PTSD) | The BMJ"
description = """
### What you need to know

Complex post-traumatic stress disorder (C-PTSD) is a new diagnosis in the International Classification of Diseases (ICD) 11.1 It is not currently recognised in the Diagnostic and Statistical Manual of Mental Disorders (DSM) 5.2 Caused by recurrent, chronic, or sustained trauma, C-PTSD has the clinical features of PTSD and symptoms that reflect the prolonged impact of sustained trauma on self-organisation, encompassing affect regulation, negative self-concept, and difficulties sustaining interpersonal relationships. Here we explain what C-PTSD is, how to recognise it, and the fundamentals of management, acknowledging that the evidence base continues to grow and evolve.

Complex PTSD may occur following exposure to events that are traumatic (box 1). Typically, this means chronic, repetitive, or prolonged trauma but may also arise from a single event or experience.1

Box 1 
### What is trauma? 

ICD-11 defines trauma as “exposure to an extremely threatening or horrific event or series of events in which escape is difficult or impossible”1 . Such events include, but are not limited to torture, concentration camps, slavery, genocide campaigns, and other forms of organised violence, prolonged domestic violence, and repeated childhood sexual or physical abuse).”1RETURN TO TEXT

Complex PTSD comprises two sets of symptoms: PTSD symptoms and disturbances of self-organisation (box 2), with diagnostic criteria requiring the presence of both. The essential features of PTSD include re-experiencing symptoms (nightmares, flashbacks, intrusive images); hyperarousal (anxiety, irritability, exaggerated startle, insomnia); and avoidance. The DSM-5 classification of PTSD included a fourth category of symptoms that describes changes in cognition and mood, …"""
full_description = "Practice Practice Pointer Diagnosis and management of complex post-traumatic stress disorder (C-PTSD) BMJ 2025; 388 doi: https://doi.org/10.1136/bmj-2024-079458 (Published 30 January 2025) Cite this as: BMJ 2025;388:e079458 Article Related content Metrics Responses Peer review Joanne Stubley, consultant medical psychotherapist1, Beverley Chipp, expert by experience2, Marta Buszewicz, retired GP, honorary associate professor341Tavistock Trauma Service, Tavistock and Portman NHS Trust, London, UK2Patient author3Camden, London4University College LondonCorrespondence to J Stubley jstubley{at}tavi-port.nhs.ukWhat you need to knowComplex PTSD is a new diagnosis in ICD-11. It combines the symptoms of PTSD with difficulties in self-organisationComplex PTSD usually arises from repeated, prolonged, or chronic exposure to trauma, whereas PTSD is often caused by a single episode of traumaBest practice guidelines advise phase based and multi component therapy, personalised to individual needsComplex post-traumatic stress disorder (C-PTSD) is a new diagnosis in the International Classification of Diseases (ICD) 11.1 It is not currently recognised in the Diagnostic and Statistical Manual of Mental Disorders (DSM) 5.2 Caused by recurrent, chronic, or sustained trauma, C-PTSD has the clinical features of PTSD and symptoms that reflect the prolonged impact of sustained trauma on self-organisation, encompassing affect regulation, negative self-concept, and difficulties sustaining interpersonal relationships. Here we explain what C-PTSD is, how to recognise it, and the fundamentals of management, acknowledging that the evidence base continues to grow and evolve.What is complex PTSD?Complex PTSD may occur following exposure to events that are traumatic (box 1). Typically, this means chronic, repetitive, or prolonged trauma but may also arise from a single event or experience.1Box 1 What is trauma? ICD-11 defines trauma as “exposure to an extremely threatening or horrific event or series of events in which escape is difficult or impossible”1 . Such events include, but are not limited to torture, concentration camps, slavery, genocide campaigns, and other forms of organised violence, prolonged domestic violence, and repeated childhood sexual or physical abuse).”1RETURN TO TEXTComplex PTSD comprises two sets of symptoms: PTSD symptoms and disturbances of self-organisation (box 2), with diagnostic criteria requiring the presence of both. The essential features of PTSD include re-experiencing symptoms (nightmares, flashbacks, intrusive images); hyperarousal (anxiety, irritability, exaggerated startle, insomnia); and avoidance. The DSM-5 classification of PTSD included a fourth category of symptoms that describes changes in cognition and mood, … View Full Text Log in Log in using your username and password BMA Member Log In If you have a subscription to The BMJ, log in: Username * Password * Forgot your log in details? Need to activate Log in via institution Log in via OpenAthens Log in through your institution Subscribe from £184 * Subscribe and get access to all BMJ articles, and much more. Subscribe* For online subscription Access this article for 1 day for:£50 / $60/ €56 (excludes VAT) You can download a PDF version for your personal record. Buy this article"
