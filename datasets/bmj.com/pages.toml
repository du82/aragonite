["http://www.bmj.com/about-bmj/publishing-model"]
title = "Publishing model | The BMJ"
full_description = "The BMJ is published by BMJ Group, a wholly owned subsidiary of the British Medical Association. The BMA grants editorial freedom to the editor of The BMJ (currently Dr. Kamran Abbasi). The views expressed in the journal are those of the authors and do not necessarily reflect the view of the BMA. The BMJ follows guidelines on editorial independence produced by the World Association of Medical Editors and the code on good publication practice produced by the Committee on Publication Ethics, the recommendations of the International Committee of Medical Journal Editors, and checklists and advice for good research reporting of the EQUATOR network. The BMJ is an online publication and publishes its articles continuously to bmj.com. The website is updated daily with original articles, podcasts, videos, and infographics and organised into four main content streams—research, education, news and views, and campaigns. In addition, the site is fully searchable, with an archive going back to 1840 and numerous topic collections on clinical and non-clinical subjects. Some articles published online will subsequently also appear in a print issue of The BMJ. The print journal is now published in three editions: one edition targeting hospital clinicians, primarily in the UK; a second edition for GPs; and a third edition aimed at academics and a more international audience. Together, their circulation totals about 122 000 copies and all are mailed in a recyclable wrapper. In place of a page number, each online article has a unique identifier; this identifier (elocator) should be used when citing any article in The BMJ. The form of the citation (e.g. BMJ 2008;337:a134) appears on all articles both online and in print, and it will appear thus in PubMed and other indexes. The BMJ has an impact factor of 93.7 (JCR 2023) and is ranked third among general medical journals. The journal's website, bmj.com has 2,700,000 views per month, and papers published in The BMJ in 2016 had over 150 media mentions across eleven key media outlets across the world. Papers published in The BMJ receive an Altmetric score that is displayed on the article's page. The journal also produces a podcast to highlight papers published in the journal."
