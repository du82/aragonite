["https://bmj.com/content/388/bmj.r346"]
title = "Improving adolescent health and nutrition in South Asia | The BMJ"
description = """
Regional cross sectoral action is a policy imperative

Roughly half of the population in South Asia is under 18 years of age, with a staggering 350 million adolescents living in the South Asia region.1 A large proportion of adolescent girls are married, and almost a fifth give birth before they are 18. The health and nutrition of adolescent girls is strongly influenced by gender discrimination and sociocultural traditions influencing adolescent marriage, lack of access to education and health services, and exposure to sexual and domestic violence.2 Concurrent prevalence of undernutrition and emergence of overweight and obesity is notable across several countries in South Asia, with a recent assessment showing that Pakistan had the highest rates of change.3

A new BMJ Collection (www.bmj.com/collections/nourishing-south-asia), led by the South Asia regional office of Unicef and Deakin University in Australia, highlights the alarming state of health and nutrition for adolescents in South Asia, with persisting high rates of undernutrition,4 poorly regulated food environments affecting the rise in overweight and obesity,5 and systematic exclusion of girls and gender …"""
full_description = "Editorials Nourishing South Asia Improving adolescent health and nutrition in South Asia BMJ 2025; 388 doi: https://doi.org/10.1136/bmj.r346 (Published 03 March 2025) Cite this as: BMJ 2025;388:r346 Read the collection: Tackling the triple burden of adolescent girls’ malnutrition Article Related content Metrics Responses Peer review Zulfiqar A Bhutta,, founding director1 2, Drishti Sharma,, researcher3, Sohana Shafique,, project coordinator4, Khakerah Rashidi, national lead health and nutrition51Institute for Global Health and Development, Aga Khan University, Karachi, Pakistan2Centre for Global Child Health, Hospital for Sick Children, Toronto, Canada3IAVI India Regional Office, Gurugram, India4Health Systems and Population Studies Division, icddr,b, Dhaka, Bangladesh5Aga Khan Foundation, AfghanistanCorrespondence to: Z A Bhutta zulfiqar.bhutta{at}sickkids.caRegional cross sectoral action is a policy imperativeRoughly half of the population in South Asia is under 18 years of age, with a staggering 350 million adolescents living in the South Asia region.1 A large proportion of adolescent girls are married, and almost a fifth give birth before they are 18. The health and nutrition of adolescent girls is strongly influenced by gender discrimination and sociocultural traditions influencing adolescent marriage, lack of access to education and health services, and exposure to sexual and domestic violence.2 Concurrent prevalence of undernutrition and emergence of overweight and obesity is notable across several countries in South Asia, with a recent assessment showing that Pakistan had the highest rates of change.3A new BMJ Collection (www.bmj.com/collections/nourishing-south-asia), led by the South Asia regional office of Unicef and Deakin University in Australia, highlights the alarming state of health and nutrition for adolescents in South Asia, with persisting high rates of undernutrition,4 poorly regulated food environments affecting the rise in overweight and obesity,5 and systematic exclusion of girls and gender norms in the region that underlie persistent patterns of undernutrition and anaemia.6 Analysis of data on 14 107 adolescent mothers from India’s fourth National Family Health Survey (2015-16) showed that they were significantly more undernourished than adult mothers and had lower rates of education, empowerment, and poorer access to health services.7 Not surprisingly, children born to adolescent mothers had significantly lower Z scores for length or height-for-age (mean difference −0.53 SD), weight-for-age (−0.40 SD), and weight-for-length or height (−0.16 SD) than children born to adult women. These findings are reflective of the specific nutritional and physiological needs of adolescents8 and the negative consequences of children having children. The long term consequences of adverse birth outcomes and the excess of small vulnerable infants born to undernourished adolescents are notable and intergenerational. With adolescent births accounting for almost a quarter of all mothers assessed in India’s fourth national survey,7 this alone is the largest impediment to human capital in South Asia.The reasons for the marginalisation of adolescents and neglect of adolescent nutrition in South Asia are manifold. In Bangladesh, the rapid rise of overweight and obesity, often concurrent with persistent undernutrition and anaemia among marginalised populations, have notable gender dimensions and are related to changes in dietary patterns and limited opportunities for mobility among adolescent girls.9 Nowhere is this more notable than in Afghanistan, where educational opportunities for girls have been officially curtailed over the past 2.5 years.Acting on the evidenceAs highlighted in the collection,4 opportunities for addressing the health and nutrition of adolescents are plentiful and it is time for concerted action in the region. The global evidence on effective interventions to meet adolescent nutritional needs is strong and underscores the importance of addressing social determinants and entrenched gender inequities, as well as direct nutrition interventions through appropriate supplementation and fortification strategies.10 The best strategy to reach adolescents, especially younger adolescent girls, is through a continuum of services using school health and community platforms,1112 emphasising the need for cross sectoral initiatives involving health and education services as well as social protection programmes.The policy and regulatory frameworks affecting food environments and exposure to inappropriate marketing of ultraprocessed foods are fast emerging as public health priorities in developing economies, and with the rapid rise in access to mobile phones and social media influences, adolescents face additional risks globally.13 Adolescent health and nutrition services therefore have to be protected from the undue influences of a largely unregulated private sector and egregious marketing strategies. Banning mobile phone use for children and adolescents in schools is one such measure. Although a ban is extreme, evidence is growing that reducing screen time improves physical activity and reduces sedentary behaviours, all essential for preventing overweight and obesity among adolescents globally.14 Robust research is also needed to fill several gaps related to epidemiology, information on drivers, and the links between adolescent nutrition, mental health, and environmental factors.These measures by national governments need to be complemented by strategies at regional level and concerted oversight by agencies such as Unicef and the World Health Organization. The efforts of the Unicef Regional Office for South Asia to highlight the need for a holistic strategy for addressing adolescent health and nutrition, especially for girls, are laudable and must now be followed up by action within countries, as well as monitoring and evaluation platforms with consistent tracking of indicators and targets. As indicated, these require action across various sectors and not just health departments or programmes. Addressing social and commercial determinants of adolescent health and nutrition consistently across the region must become a policy and programme imperative.15 Several global meetings this year, such as the Nutrition for Growth Summit in March 2025 and Scaling Up Nutrition in November, offer an opportunity for spurring action.FootnotesCompeting interests: We have read and understood BMJ policy on declaration of interests and have no interests to declare. Provenance and peer review: Commissioned; externally peer reviewed.http://creativecommons.org/licenses/by-nc/4.0/This is an Open Access article distributed in accordance with the Creative Commons Attribution Non Commercial (CC BY-NC 4.0) license, which permits others to distribute, remix, adapt, build upon this work non-commercially, and license their derivative works on different terms, provided the original work is properly cited and the use is non-commercial. See: http://creativecommons.org/licenses/by-nc/4.0/.References↵Unicef. Adolescents in South Asia. https://www.unicef.org/rosa/what-we-do/adolescents↵Baxter JB, Wasan Y, Islam M, et al. Dietary diversity and social determinants of nutrition among late adolescent girls in rural Pakistan. Matern Child Nutr2022;18:e13265. doi:10.1111/mcn.13265 pmid:34467621OpenUrlCrossRefPubMed↵NCD Risk Factor Collaboration (NCD-RisC). Worldwide trends in underweight and obesity from 1990 to 2022: a pooled analysis of 3663 population-representative studies with 222 million children, adolescents, and adults. Lancet2024;403:1027-50. doi:10.1016/S0140-6736(23)02750-2 pmid:38432237OpenUrlCrossRefPubMed↵Sethi V, Muria Z, Gardner H, Rawal S, South Asia Better Diets and Better Growth for Adolescent Girls Study Group. Obstacles and opportunities for nourishing South Asia’s adolescent girls. BMJ2025;388:e080358. doi:10.1136/bmj-2024-080358.OpenUrlFREE Full Text↵Oliver H, Sethi V, Rowel D, et al., South Asia Better Diets and Better Growth for Adolescent Girls Study Group. Home, school, and retail food environments driving obesity among adolescent girls in South Asia. BMJ2025;388:e080359. doi:10.1136/bmj-2024-080359OpenUrlFREE Full Text↵Liyana Pathirana N, Zorbas C, Khadka S, et al., South Asia Better Diets and Better Growth for Adolescent Girls Study Group. Addressing systemic exclusion and gender norms to improve nutritional outcomes for adolescent girls in South Asia. BMJ2025;388:e080360. doi:10.1136/bmj-2024-080360.OpenUrlFREE Full Text↵Nguyen PH, Scott S, Neupane S, Tran LM, Menon P. Social, biological, and programmatic factors linking adolescent pregnancy and early childhood undernutrition: a path analysis of India’s 2016 National Family and Health Survey. Lancet Child Adolesc Health2019;3:463-73. doi:10.1016/S2352-4642(19)30110-5. pmid:31105055OpenUrlCrossRefPubMed↵Das JK, Salam RA, Thornburg KL, et al. Nutrition in adolescents: physiology, metabolism, and nutritional needs. Ann N Y Acad Sci2017;1393:21-33. doi:10.1111/nyas.13330. pmid:28436102OpenUrlCrossRefPubMed↵Khan MMA, Karim M, Islam AZ, Islam MR, Khan HTA, Khalilullah MI. Prevalence of overweight and obesity among adolescents in Bangladesh: do eating habits and physical activity have a gender differential effect?J Biosoc Sci2019;51:843-56. doi:10.1017/S0021932019000142 pmid:31124767OpenUrlCrossRefPubMed↵Hargreaves D, Mates E, Menon P, et al. Strategies and interventions for healthy adolescent growth, nutrition, and development. Lancet2022;399:198-210. doi:10.1016/S0140-6736(21)01593-2 pmid:34856192OpenUrlCrossRefPubMed↵Bhutta ZA, Lassi ZS, Bergeron G, et al. Delivering an action agenda for nutrition interventions addressing adolescent girls and young women: priorities for implementation and research. Ann N Y Acad Sci2017;1393:61-71. doi:10.1111/nyas.13352. pmid:28436103OpenUrlCrossRefPubMed↵Vaivada T, Lassi ZS, Irfan O, et al. What can work and how? An overview of evidence-based interventions and delivery strategies to support health and human development from before conception to 20 years. Lancet2022;399:1810-29. doi:10.1016/S0140-6736(21)02725-2 pmid:35489360OpenUrlCrossRefPubMed↵Carducci B, Oh C, Keats EC, Roth DE, Bhutta ZA. Effect of food environment interventions on anthropometric outcomes in school-aged children and adolescents in low- and middle-income countries: a systematic review and meta-analysis. Curr Dev Nutr2020;4:nzaa098. doi:10.1093/cdn/nzaa098. pmid:32666031OpenUrlCrossRefPubMed↵Oh C, Carducci B, Vaivada T, Bhutta ZA. Interventions to promote physical activity and healthy digital media use in children and adolescents: a systematic review. Pediatrics2022;149(suppl 6):e2021053852I. doi:10.1542/peds.2021-053852I. pmid:35503334OpenUrlCrossRefPubMed↵Gilcharan Singh HK, Sinnasamy P, Wan Yi T, Chiao Wei C, Chee Siew Swee W, Shyam S. Understanding the food environment and its impact on diet and health in Asia: a scoping review. Asia Pac J Public Health2024;36:172-83. doi:10.1177/10105395241237635 pmid:38483070OpenUrlCrossRefPubMed"
