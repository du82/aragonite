title = "The role of masks and respirators in preventing respiratory infections in healthcare and community settings | The BMJ"
description = "The covid-19 pandemic saw frequent changes and conflicts in mask policies and politicization of masks. On reviewing the evidence, including studies published after the pandemic, the data suggest respirators are more effective than masks in healthcare, but must be continuously worn to be protective. Healthcare and aged care settings amplify outbreaks, so protection of patients and staff is paramount. Most guidelines assume risk is only present during close contact or aerosol generating procedures, but studies show intermittent use of respirators is not protective. New research in aerosol science confirms the risk of infection is widespread in health facilities. In community settings, any mask use is protective during epidemics, especially if used early, when combined with hand hygiene, and if wearers are compliant. Community use of N95 respirators is more protective than surgical masks, which are more protective than cloth masks, but even cloth masks provide some protection. Mask guidelines should be adaptable to the specific context and should account for rising epidemic activity, and whether a pathogen has asymptomatic transmission. The main rationale for universal masking during pandemics is asymptomatic transmission, which means risk of transmission cannot be self-identified. The precautionary principle should be applied during serious emerging infections or pandemics when transmission mode is not fully understood, or vaccines and drugs are not available. If respirators are not available, medical or cloth masks could be used as a last resort. Data exist to support extended use and reuse of masks and respirators during short supply. In summary, extensive evidence generated during the covid-19 pandemic confirms the superiority of respirators and supports the use of masks and respirators in the community during periods of high epidemic activity. Some gaps in research remain, including economic analyses, research in special population groups for whom masking is challenging, and research on countering disinformation."
full_description = "Clinical Review State of the Art Review The role of masks and respirators in preventing respiratory infections in healthcare and community settings BMJ 2025; 388 doi: https://doi.org/10.1136/bmj-2023-078573 (Published 27 February 2025) Cite this as: BMJ 2025;388:e078573 Article Related content Metrics Responses Peer review C Raina MacIntyre, professor1, Abrar A Chughtai, senior lecturer2, Mohana Kunasekaran, research associate1, Essa Tawfiq, research associate1, Trish Greenhalgh, professor of primary care health sciences31Biosecurity Program, The Kirby Institute, Faculty of Medicine and Health, University of New South Wales, Sydney, Australia2School of Population Health, Faculty of Medicine and Health, University of New South Wales, Sydney, Australia3Nuffield Department of Primary Care Health Sciences, University of Oxford, Oxford, UKCorrespondence to: A A Chughtai abrar.chughtai{at}unsw.edu.auAbstractThe covid-19 pandemic saw frequent changes and conflicts in mask policies and politicization of masks. On reviewing the evidence, including studies published after the pandemic, the data suggest respirators are more effective than masks in healthcare, but must be continuously worn to be protective. Healthcare and aged care settings amplify outbreaks, so protection of patients and staff is paramount. Most guidelines assume risk is only present during close contact or aerosol generating procedures, but studies show intermittent use of respirators is not protective. New research in aerosol science confirms the risk of infection is widespread in health facilities. In community settings, any mask use is protective during epidemics, especially if used early, when combined with hand hygiene, and if wearers are compliant. Community use of N95 respirators is more protective than surgical masks, which are more protective than cloth masks, but even cloth masks provide some protection. Mask guidelines should be adaptable to the specific context and should account for rising epidemic activity, and whether a pathogen has asymptomatic transmission. The main rationale for universal masking during pandemics is asymptomatic transmission, which means risk of transmission cannot be self-identified. The precautionary principle should be applied during serious emerging infections or pandemics when transmission mode is not fully understood, or vaccines and drugs are not available. If respirators are not available, medical or cloth masks could be used as a last resort. Data exist to support extended use and reuse of masks and respirators during short supply. In summary, extensive evidence generated during the covid-19 pandemic confirms the superiority of respirators and supports the use of masks and respirators in the community during periods of high epidemic activity. Some gaps in research remain, including economic analyses, research in special population groups for whom masking is challenging, and research on countering disinformation.IntroductionThe covid-19 pandemic put masks in the spotlight, with guidelines that were conflicting and rapidly changing. In early 2020, the World Health Organization initially recommended that masks be used only by people who had respiratory symptoms, but actively discouraged their use by healthy people.1 Advice from WHO, the United States Centers for Disease Control and Prevention (CDC), and other agencies changed several times during the pandemic, and at times swung between discouraging masks to suggesting N95 masks could be used in the community (fig 1).25 There was widespread disinformation and politicization of masks, with masks becoming a symbol of government control and oppression.2627 Yet early in a pandemic, when drugs and vaccines are unavailable, masks are among the few available protective measures, especially for frontline workers.282930313233Fig 1 Changes in guidelines on use of facemasks and respirators throughout covid-19 pandemic. Guidance from: World Health Organization (WHO),234567891011 United States Centers for Disease Control and Prevention (CDC),12131415161718192021 and Public Health England—changed to UK Health Security Agency (HSA) in April 2021222324Download figure Open in new tab Download powerpoint Masks and respirators reduce transmission of respiratory infections34 by protecting the uninfected wearer and by blocking exhaled infectious particles from infected wearers (source control). Masks designed for healthcare use (medical or surgical masks) are water resistant, fit loosely around the face allowing unfiltered air to pass through the gaps around the edges, and their filtration efficacy might be variable.35 Cloth masks are widely used in low income countries and during shortages of medical masks, such as during the early months of the covid-19 pandemic, yet were not mentioned in any WHO policy document at the start of the covid-19 pandemic.36 Respirators are designed for occupational protection and provide superior protection through high grade filtration and a tight seal around the face.3437 Respirators, including disposable filtering facepiece respirators and reusable forms (elastomeric or powered air purifying respirators),3839 are mainly used in healthcare settings and require fit testing.4041424344 Some types of powered air purifying respirators do not require fit testing because they have a hood over the entire face and head instead of a face piece. These respirators are the most suitable for long, continuous use in high risk settings.In our previous BMJ review,34 we examined evidence from randomized controlled trials (RCTs) of masks. Since then, three further RCTs in healthcare,454647 two in community settings,4849 and three as source control505152 have been published. A 2023 Cochrane review was interpreted by some to have shown that masks “do not work,”28 forcing Cochrane to issue an apology and clarification.53 The aim of this review is to summarize the current evidence around the protection provided by masks and respirators in healthcare and community settings, and how this evidence aligns with current policy.MethodsWe conducted a state of the art review examining the evidence on the effectiveness of masks and respirators in healthcare, community, and special settings. Articles were identified from PubMed (from January 1950 to 31 December 2023), Embase (from 1988 to 31 December 2023), Cochrane Library, Web of Science, and Google Scholar. The Australian New Zealand Clinical Trials Registry (ANZCTR) and the US National Institutes of Health clinical trial registry were also searched. Only English language publications were included. We used the following keywords for the search: “facemask,” “mask,” “surgical mask,” “medical mask,” “cotton/cloth mask,” “respirator,” “N95/N97, N99 respirator,” “FFP2/FFP3 respirator,” “P2/P3 respirator,” “respiratory protection,” “respiratory protective device,” “infection control,” “respiratory infections and facemasks/mask/respirator,” “influenza and facemasks/mask/respirator,” “flu and facemasks/mask/respirator,” “SARS-CoV2”/“covid-19”/“coronavirus disease,” “pandemic influenza and facemasks/mask/respirator,” “SARS and facemasks/mask/respirator,” “tuberculosis and facemasks/mask/respirator,” “TB and facemasks/mask/respirator,” “Ebola”/“Ebola virus Diseases,” and “emerging infections and facemasks/mask/respirator.” The GRADE (Grading of Recommendations Assessment, Development and Evaluation) approach was used to examine the type of evidence.54 RCTs were considered level 1 (high) evidence, observational studies (cohort, case-control, before-after, time series, case series, and case reports) were considered level 2 (low), and any other evidence was considered level 3 (very low) evidence.54 AAC reviewed the titles of publications identified by our searches and prepared an initial list of articles to be included in the study. Then CRM and AAC independently reviewed the abstracts of these articles and selected those suitable for inclusion. A separate search of the same databases was conducted by MK to identify meta-analyses of masks. A total of 29 studies were reviewed by all the authors and are summarized in supplementary table S1.282930313254555657585960616263646566676869707172737475767778 Only studies classed as high level (RCTs) have been included, and we give specific limitations for each RCT.We also searched infection control policies and guidelines from WHO, the US CDC, the UK Health Security Agency, and other health organizations to identify recommendations on the use of masks and respirators, with a focus on changing policies over the course of the pandemic. Additionally, we searched health organization websites and Google for policies and guidelines on the use of masks and respirators. Only English language literature was reviewed. Key terms used in our search were “Infection control guideline/policy/plan,” “COVID-19 guideline/policy/plan,” “Ebola control guideline/policy/plan,” “Pandemic influenza guideline/policy/plan,” “Personal protective equipment use/guideline,” “Personal protective equipment use/guideline for infection control,” “Masks use/guideline for infection control,” “Respirator use/guideline for infection control.”Previous meta-analyses on masks and respirator useMeta-analyses of masks have reported conflicting results (online supplementary table S1). Some of these meta-analyses included only RCTs,555657 while others included RCTs and observational studies.58596061 Some meta-analyses found mask use to be protective596263 and others did not,5861 reflecting varied methods and data selection procedures. The most definitive study to date found substantial heterogeneity in the settings, interventions, and measurement of outcomes of RCTs, and identified important flaws in some meta-analyses.32 These flaws included combining dissimilar outcomes (such as differing clinical case definitions or laboratory diagnostics—eg, polymerase chain reaction (PCR) and serological testing) and dissimilar settings (such as healthcare and community).79 A positive PCR test is a rarer but more reliable outcome80 than a positive serological test, yet serological testing accounted for most primary outcome measures in some trials.478182 One meta-analysis corrected for this by combining only similar outcomes.32Use of masks and respirators in healthcare settingsRCTs in healthcare settingsWe identified seven RCTs comparing the efficacy of masks with that of respirators in healthcare settings. Six were conducted before the covid-19 pandemic and one during the pandemic.33454780818283 These trials used different interventions and some of them measured different outcomes. Table 1 presents details of study design, interventions, results, and risk of biases.Table 1 Summary of high level evidence by GRADE guidelines—clinical trials on facemasks or respirators in healthcare setting (adapted and summarized from Greenhalgh et al32 under Creative Commons license)View this table:View popupView inlineA key design issue was whether healthcare workers in the respirator arm of the trial wore their device continuously throughout a shift or whether they wore it only when undertaking what was assumed to be a high risk procedure (so-called targeted or intermittent use of respirators). A recent meta-analysis that separately analyzed continuous and targeted use of respirators found that respirators were considerably more effective than masks if worn continuously.32 Intermittent use of respirators or medical masks only when performing high risk procedures was not protective. Three North American trials found no difference in efficacy between masks and respirators when used intermittently for aerosol generating procedures or treatment of patients with known infection.478182 These findings are consistent with those of a trial in China that compared medical masks, intermittent use of N95 respirators, and continuous use of N95 respirators; this study showed no difference in efficacy between intermittent N95 respirators and medical masks, but considerably greater protection from continuous N95 use.3380The superiority of N95 respirators over medical masks has also been shown against a range of viral and bacterial respiratory infections.85 These findings suggest that these infections are likely transmitted through inhalation of contaminated air86 because medical masks (designed to stop splash or spray of liquid) were not sufficiently protective. Airborne transmission of common respiratory infections means that the risk of transmission is likely to be widespread throughout health facilities owing to ventilation systems mixing and dispersing air,32 and calls into question many guidelines suggesting risk is only present during close contact or aerosol generating procedures.87Healthcare facilities and many buildings use heating, ventilation, and air conditioning systems, which can draw in fresh air and might filter the air, are designed primarily for climate control. These systems use ducts to disperse air throughout a building, so human respiratory aerosols generated in one part of a building might be dispersed to another. In reality, infectious airborne particles accumulate and disperse widely in an indoor setting,88 posing a risk to people distant from the source of infection.89When the covid-19 pandemic began, one RCT had been published comparing cloth masks with single use medical masks in a healthcare setting in Vietnam.45 The incidence of the primary outcome (influenza-like illness) was significantly higher in participants in the cloth mask arm (relative risk 13.00, 95% confidence interval 1.69 to 100.07), but there was no significant difference between arms for laboratory confirmed infection. The study was conducted in a setting where many participants washed their cloth masks by hand in cold water. A further post hoc analysis conducted in 2020 of data from that 2011 trial (after widespread concern about the safety of cloth masks) showed that if cloth masks were washed in a washing machine, their performance was similar to medical masks.90 WHO has since issued a recommendation for washing cloth masks after use at 60°C.91Observational, case-control, cohort, and experimental studies in healthcare settingsA range of evidence exists from cohort,92 case-control,93949596979899 cross sectional,100101102103104105 laboratory experimental,106107108109110111112 and other epidemiological (including time series, modeling, and case series) studies.113114115116117118119120121122 Some of these studies were conducted during the SARS outbreak,949596979899103104105113116117118119123 others examined transmission of tuberculosis,121124125 respiratory syncytial virus,92 and pertussis.102 A systematic review and meta-analysis performed in early 2020 using observational data from SARS, Middle East respiratory syndrome (MERS), and early data on SARS-CoV-2 showed 85% protection from medical masks or respirators (analyzed together) in all settings combined, with greater protection in the healthcare "
