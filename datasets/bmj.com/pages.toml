["https://bmj.com/content/388/bmj-2024-080978"]
title = "Advances in the management of endometrial cancer | The BMJ"
description = "Endometrial cancer is now the most lethal gynecologic malignancy, with incidence rates rising globally. Treatment strategies have historically been focused on a combination of surgery, radiation, and/or chemotherapy based primarily on histology and extent of tumor. Advances in the evaluation and treatment of endometrial cancers are occurring at a rapid pace, with a new focus on genomic profiling and targeted therapies. Surgical removal of the tumor remains the mainstay of therapy, but adjuvant treatments are a shifting paradigm. In the realm of gynecologic malignancies, endometrial cancer leads in the evolution of precision medicine. The ability to analyze patients, tumors, and therapy has increased over the past 10 years. Gaps in knowledge about racial and ethnic disparities, as well as pre-invasive disease prevention, are closing. This review describes the advances in endometrial cancer with a focus on people at risk, molecular classification, and modern therapeutic strategies."
full_description = "Clinical Review State of the Art Review Advances in the management of endometrial cancer BMJ 2025; 388 doi: https://doi.org/10.1136/bmj-2024-080978 (Published 05 March 2025) Cite this as: BMJ 2025;388:e080978 Article Related content Metrics Responses Peer review Bradley R Corr, associate professor1, Britt K Erickson, associate professor2, Emma L Barber, assistant professor3, Christine M Fisher, professor4, Brian Slomovitz, professor51Division of Gynecologic Oncology, University of Colorado Hospital, Aurora, CO, USA2Division of Gynecologic Oncology, University of Minnesota, Minneapolis, MO, USA3Division of Gynecologic Oncology, Northwestern University Feinberg School of MedicineChicago, IL, USA4Division of Radiation Oncology, University of Colorado Hospital, Auroro, CO, USA5Division of Gynecologic Oncology, Mount Sinai Medical Center, Miami, FL, USACorrespondence to: B R Corr Bradley.corr{at}cuanschutz.eduABSTRACTEndometrial cancer is now the most lethal gynecologic malignancy, with incidence rates rising globally. Treatment strategies have historically been focused on a combination of surgery, radiation, and/or chemotherapy based primarily on histology and extent of tumor. Advances in the evaluation and treatment of endometrial cancers are occurring at a rapid pace, with a new focus on genomic profiling and targeted therapies. Surgical removal of the tumor remains the mainstay of therapy, but adjuvant treatments are a shifting paradigm. In the realm of gynecologic malignancies, endometrial cancer leads in the evolution of precision medicine. The ability to analyze patients, tumors, and therapy has increased over the past 10 years. Gaps in knowledge about racial and ethnic disparities, as well as pre-invasive disease prevention, are closing. This review describes the advances in endometrial cancer with a focus on people at risk, molecular classification, and modern therapeutic strategies.IntroductionThe lifetime risk of developing endometrial cancer is 3.1%, and the overall five year survival rate is 81%.1 The median age of diagnosis is 64; fortunately, the disease is commonly found confined to the uterus owing to the early presenting symptom of postmenopausal bleeding. When localized disease is identified and surgically removed, five year survival rates reach 95%. However, five year survival rates for distant disease are only 18%. The three major treatment modalities for endometrial cancer remain surgery, radiation, and medical therapy. The most substantial advances are in the medical treatment options for endometrial cancers. Immunotherapy has had the greatest impact on treatment recommendations, but comprehension of tumor molecular profiles and targeted treatment responses have also enabled us to treat patients with the appropriate therapies. Continued advances in all modalities of endometrial cancer treatment have ensued, with the greatest strides forward in tumor assessment and medical therapeutic agents, which are the focus of this review. In a landscape in which treatment and evaluation of endometrial cancers are continuously evolving, providers, patients, and care givers need to stay up to date. Here we review the principles of who is at risk, what tumor evaluations are available, and how these principles affect treatment modalities.Sources and selection criteriaWe obtained data from clinical trials by searching ClinicalTrials.gov for data over the past 10 years and using the terms “uterine cancer”, “endometrial cancer”, or “molecular classification”. We excluded single site clinical trials and trials that had a focus on in vitro analysis. We prioritized phase 2 and 3 clinical trials, with a focus on trials that affected global treatment strategies and novel therapeutics. We searched PubMed and Medline for review articles on endometrial cancer from 2010 to 2024 to include for analysis of trends in treatment strategies. For the molecular analysis, pre-invasive disease, and under-represented minorities sections, we searched PubMed and Medline from 2010 to January 2024 by using the molecular analysis terms associated and listed in each subgroup heading. We excluded publications not published in English as well as editorials and other non-interventional evaluations.EpidemiologyIn the US, 66 200 new cases of uterine cancer and 13 030 deaths due to the disease occurred in 2023.2 Uterine cancer is the fourth most common cancer in women (behind breast, lung, and colorectal cancer) and the sixth most deadly cancer in women. In people over 50 years old with an intact uterus, it is the second most common malignancy.3 Ovarian cancer has always been considered the most lethal gynecologic malignancy; however, in 2023 uterine cancer surpassed ovarian cancer as the most lethal gynecologic malignancy in the US.4Despite advances in understanding of pathogenesis, risk factors, molecular subtypes, and treatment options, the incidence of endometrial cancer is increasing in the US and worldwide. More than 400 000 cases per year are estimated to occur, with the highest rates seen in North America, Europe, Micronesia/Polynesia, and Australia/New Zealand.5 Countries with the most rapid socioeconomic transitions—such as Japan, the Philippines, Belarus, Singapore, Costa Rica, and New Zealand—have seen pronounced increases in the incidence of endometrial cancer.6 Over the past two decades, the incidence has increased up to 20-fold across all age groups, and the disease is more prominent in Europe and North America than in lower income countries.56The reasons for these national and global trends are multifactorial and not completely understood. More than 80% of endometrial cancers are estrogen receptor positive and associated with estrogen related risk factors such as obesity, nulliparity, late menopause, early menarche, and menopausal estrogen supplementation.7 Changes in fertility and reproductive factors such as fewer pregnancies and nulliparity may contribute to the rapid increase of endometrial cancer in certain countries with socioeconomic transition. Additionally, obesity is increasing worldwide and likely contributes to this trend. Other factors to consider include changes in perimenopausal hormone use, an increase in diabetes, a decrease in smoking prevalence, changes in contraceptive patterns, and changes in hysterectomy rates.6In the US, data specific to histologic subtypes have informed our understanding of trends in endometrial cancer. When correcting for hysterectomy rates and analyzing endometrioid and non-endometrioid subtypes separately, Clarke and colleagues have shown that the dramatic rise in the incidence of endometrial cancer in the US from 2000 to 2015 is due to a sharp increase in the incidence of non-endometrioid histologic subtypes (such as serous carcinoma, clear cell carcinoma, and carcinosarcoma).8 In this same period, rates of endometrioid endometrial cancer remained consistent. Notably, the incidence of non-endometrioid endometrial cancer is highest among non-Hispanic black patients and rising most rapidly among non-Hispanic Asian/Pacific Islander patients.8Racial and ethnic differences in endometrial cancer outcomesProfound racial disparities exist in the incidence of endometrial cancer and death due to the disease. In the US, black people disproportionately have and die from endometrial cancer compared with white people.910 Although early reports showed that the incidence of endometrial cancer is lower in black people, differences in the prevalence of hysterectomy have likely confounded these observations. Correcting for prevalence of hysterectomy attenuates most racial disparities in incidence,11 and the overall incidence has been higher in black people since the early 2000s.39 Moreover, the number of deaths from uterine cancer have surpassed the number of deaths from ovarian cancer in black patients in the US since 2005.10 The vast majority of research on racial disparities in endometrial cancer outcomes has come from the US, with limited data resources from African, Caribbean, and European nations. However, recent data from England and Wales similarly show higher mortality rates for patients with uterine cancer from black ethnic groups compared with other ethnicities.12Data consistently show that black patients have higher rates of recurrence of and death from endometrial cancer.13 The causes of disparities in survival are multifactorial. Black people have a disproportionate incidence of high risk histology, with non-endometrioid (including serous carcinoma and carcinosarcoma) endometrial cancer being more prevalent in black patients.3913 However, irrespective of stage or histologic subtype, black people have substantially lower five year relative survival, suggesting that disparities may be related to both biologic and non-biologic (care related) factors among black people.1415 As a single example, evaluation of microbial profiles in endometrial cancers from black and white people shows a greater microbial diversity and distinct microbial profiles in tumors from black patients.16Tumor profilingMolecular profiling has become more common and has allowed researchers to categorize endometrial cancer into four distinct molecular subtypes; DNA polymerase ε (POLE, ultramutated), microsatellite instability (MSI, hypermutated), copy number low, and copy number high.17 The copy number low group is often described as no specific molecular profile (NSMP), whereas the copy number high group is often delineated as TP53 on the basis of the presence of mutant p53 protein. Although rich in molecular data, tumor profiling studies are often limited in how race is defined and reported.Stratification of a cohort of 253 molecular profiled endometrial cancer tumors by tumor histology showed no significant differences between tumors from self-reported black and white patients.18 In a separate cohort of 1882 sequentially profiled endometrial cancer tumors, somatic gene mutations did not vary between racial groups in the NSMP, microsatellite instability high (MSI-H), and POLE molecular subtypes. However, differences were seen in molecular alterations within the TP53 abnormal group. Black patients were less likely to have protein phosphatase 2 scaffold subunit Aalpha (PPP2R1A) and phosphatase and tensin homolog (PTEN) gene mutations and more frequently harbored cyclin E1 (CCNE1) amplifications, mutations in lysine methyltransferase 2B (KMT2B), breast cancer gene 1 (BRCA1), mediator complex subunit 12 (MED12), and neurofibromatosis type 1 (NF1) mutations.19 Similar findings were noted in a large cohort of more than 2000 uterine serous carcinoma tumors. Results were analyzed on the basis of predicted African ancestry from single nucleotide polymorphism analysis. Tumors from patients with predicted African ancestry had more CCNE1 amplifications, and lower phosphatidylinositol-4,5-bisphosphate 3-kinase catalytic subunit α (PIK3CA) and PPP2R1A alterations.20 The extent to which these genomic differences truly drive disparate outcomes is not clear.Reasons for disparities in survival are multifactorial and complex and likely extend beyond differences in tumoral mutation. For example, disparities exist in the initial assessment and diagnosis patterns in black versus white patients. A simulated cohort study of 367 073 black and white patients showed that guidelines fail to diagnose almost half of endometrial cancers in black patients given differences in ultrasonography findings related to endometrial thickness and indication for diagnostic testing.21 Doll and colleagues indicate that endometrial thickness guidelines fail to incorporate the increased rate of uterine fibroids and non-endometrioid histologies found in black women. This may help to explain why advanced stage disease is more likely to be diagnosed in black people.22In a cohort study of more than 270 000 patients with uterine cancer, researchers identified multiple factors associated with difference in survival between black and white people with endometrial cancer.13 They found that comorbidity score, neighborhood income, insurance status (in patients <65), histologic subtype, disease stage and treatment, and “unexplained factors” all accounted for the excess relative risk of death among black patients with endometrial cancer. Studies such as this capture risk factors at a single point in time but fail to account for a patient’s more extensive reproductive history, as well as cultural influences of racism, sexism, trauma, and intersectionality. A recent critique of disparities in endometrial cancer highlighted that a narrow definition of race as purely biologic underemphasizes the role of non-biologic (and hence modifiable) contributors to racial disparities.14Pre-invasive diseaseEndometrial intraepithelial neoplasia (EIN) is a premalignant condition of the endometrium. The term EIN is defined as hyperplasia with atypia and replaced the previous classification system of endometrial hyperplasia that classified hyperplasia into four categories: simple or complex and with and without atypia. The risk of concurrent malignancy within the uterus and progression to malignancy varied widely between these categories from 1% for simple hyperplasia to 43% for complex hyperplasia with atypia.2324 The development of endometrioid endometrial cancer is a stepwise progression from hyperplasia without atypia to hyperplasia with atypia to carcinoma. Unopposed estrogen signaling has been implicated as a driver both in the development of EIN and in the progression of EIN to endometrioid endometrial cancer.ManagementSurgeryThe standard of care treatment for EIN remains hysterectomy with consideration of bilateral salpingo-oophorectomy depending on menopausal status. This recommendation remains largely based on the relatively high rate of concurrent cancer of 42.7% in women undergoing hysterectomy with a preoperative diagnosis of atypical hyperplasia found in the seminal prospective cohort study of 306 patients, GOG 167.24 However, given the rising obesity epidemic, particularly among younger people, and higher rates of delayed childbearing, fertility sparing options for this premalignant condition are of increasing interest.25 Additionally, as the population ages and has higher rates of comorbid conditions, more patients will be inoperable and need alternative non-surgical options. Finally, some patients may not consent to hysterectomy for a variety of reasons and prefer non-surgical options.ProgestinsProgestins induce cellular differentiation and are an active hormonal intervention for treatment of EIN.26 Given the relative rarity of patients who choose non-surgical management, neither the dose nor the schedule for progestin agents has been standardized in clinical management guidelines. The data on non-hormonal treatment of EIN are also sometimes difficult to interpret, as EIN and grade 1 endometrioid cancers are often included together making parsing out the specific expected response r"
