["http://www.bmj.com/about-bmj/resources-authors/forms-policies-and-checklists/declaration-competing-interests"]
title = "Competing interest policy | The BMJ"
description = "Is The BMJ the right journal for my article? Which research does The BMJ prioritise? Advice on OA and peer review, writing, laying out, and submitting articles."
full_description = "A competing interest — often called a conflict of interest — exists when professional judgment concerning a primary interest (such as patients' welfare or the validity of research) may be influenced by a secondary interest (such as financial gain or personal rivalry). It may arise for the authors of an article in The BMJ when they have a financial interest that may influence, probably without their knowing, their interpretation of their results or those of others. We believe that, to make the best decision on how to deal with an article, we should know about any competing interests that authors may have, and that if we publish the article readers should know about them too. We are not aiming to eradicate such interests across all article types in the BMJ. However, certain articles (see below) fall under a stricter policy announced in 2014. This means that authors whose financial conflicts of interest are judged to be relevant by the BMJ team are not permitted to write these articles. We also ask our staff and reviewers to declare any competing interests. A declaration of interests for all authors must be received before an article can be reviewed and accepted for publication. It should take one of three forms, depending on what type of article you are submitting. From July 2010, The BMJ (along with other journals that are members of the International Committee of Medical Journal Editors) has asked authors of research papers to use a revised version of the ICMJE’s unified disclosure form. The unified form is intended to make life easier for authors, in that the same form can be completed for several journals. Each journal, will, however, integrate the form into its processes in different ways. When submitting a research paper, all authors must download and complete a copy of the disclosure form, which is available as a PDF at http://www.icmje.org/disclosure-of-interest/. They should keep a copy of the form and send a copy to their corresponding author who must insert within the submitted manuscript a summary statement derived from the information provided in the forms. This statement will be included in the published article. The forms for all authors must also be included as supplemental files, and will be published online for all accepted research papers."
