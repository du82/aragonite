["http://www.bmj.com/about-bmj/how-green-is-the-bmj"]
title = "How green is The BMJ? | The BMJ"
description = "The BMJ is committed to reducing its environmental impact across all the areas in which it operates. As a medical journal, we are profoundly concerned with the environmental determinants of health and with the health consequences of environmental damage and neglect. Our former editor-in-chief, Dr Fiona Godlee, was one of the founders of the UK Health Alliance on Climate Change. Our publisher, BMJ, shares our industry’s commitment to making our business more environmentally sustainable."
full_description = "The BMJ is committed to reducing its environmental impact across all the areas in which it operates. As a medical journal, we are profoundly concerned with the environmental determinants of health and with the health consequences of environmental damage and neglect. Our former editor-in-chief, Dr Fiona Godlee, was one of the founders of the UK Health Alliance on Climate Change. Our publisher, BMJ, shares our industry’s commitment to making our business more environmentally sustainable. BMJ’s Green Team brings representatives of every department together every month to identify new initiatives in any area of our activity that might improve sustainability. So keep returning to this page for updates. The BMJ is not produced from trees grown solely for the purpose of being chopped down and turned into paper. In printing the journal, we use only paper created from the waste left over by Sweden’s environmentally-friendly home building industry, which typically replaces environmentally-damaging concrete pillars and cement blocks with wooden beams and planks. Roughly 25% of The BMJ’s paper comes from the forest ‘thinnings’, the young trees identified as unlikely to produce construction grade timber and therefore rooted out, leaving more space for the healthier specimens to grow larger, for 90 years. But the bulk (75% of the wood pulp) comes from the chips and shavings left over from the making of construction timbers. The new paper created in this way for The BMJ can be recycled into fresh paper up to seven times, before typically being turned into biofuel products for instance. The paper mills producing The BMJ’s paper are highly energy-efficient, and have reduced fossil fuel usage by 80% in the last decade by substituting with energy from hydroelectric sources and renewable biofuel, half of which is generated on-site at the mill. We're on a journey. A few years ago we replaced our non-recyclable, fossil-fuel-derived polythene wrapping with oxo-degradable plastic. By September 2017 oxo-degradable plastics were being deprecated as a source of microplastics and we switched to a recyclable alternative--but it was still a single-use plastic, and still made from fossil fuels. More recently, paper wrapping has become viable for the first time, capable of wrapping The BMJ from a continuous roll at high speed--essential for a magazine with short deadlines and a large print-run. We began trialling the use of this paper wrap on November 9, 2019 for copies going to nearly 80 000 hospital doctor readers. Over the course of a year (46 issues), that will mean ~3.6 million fewer single-use plastic wrappers from The BMJ. For the remaining 40 000 copies each, we are trialling a carbon-neutral poly derived from sugar cane waste. This means that none of The BMJ's ~5.5 million wrappers annually is now derived from fossil fuels, and all remain recyclable, as before. We'll monitor the performance of both materials in the coming months, but anticipate wrapping all copies in paper within a year. For further information, see this editorial in the November 9 issue."
